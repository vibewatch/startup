      - - Defense & Autonomous Systems
        - Government defense units (DIU) & logistics operators (FedEx)
        - High-energy-density drone batteries, robotics, and aerospace payloads
        - Niche commercial deployments and active testing in 2026
        - High price tolerance where lightweight payload overrides cycle life
        - Aggregate unit order volumes and contracted ARR figures not disclosed
    notes: "Data synthesized from Lyten announcements, Fastmarkets interviews, and facility acquisition records. Commercial scale reflects nameplate facility capacities and planning targets, not audited customer run-rate revenue."
