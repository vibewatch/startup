callouts:
  - calloutType: risk
    title: Absence of Binding Commercial Offtake Contracts
    body: >
      Despite acquiring gigafactory assets with an estimated book value near $5 billion, Lyten has not disclosed
      binding long-term offtake agreements or minimum volume commitments with major automotive OEMs or utility
      operators. Legacy Northvolt customers such as Scania have adopted a wait-and-see posture, refusing to commit
      orders until factory operations and cell quality are independently proven.
    claimRefs:
      - CU009
      - CU010
  - calloutType: insight
    title: Data Center Co-Location as a Capital De-Risking Model
    body: >
      By partnering with EdgeConneX to develop a 1 GW AI data center campus adjacent to its Skellefteå battery plant,
      Lyten is attempting to circumvent the venture funding slowdown in cleantech. This co-location model links battery
      production directly to high-margin, capital-abundant AI infrastructure demand and provides an immediate local consumer
      for utility-scale storage.
    claimRefs:
      - CU002
      - CU013
