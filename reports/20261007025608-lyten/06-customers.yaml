      - - AI Data Centers & Infrastructure
        - Hyperscale operators & colocation providers (e.g. EdgeConneX)
        - Behind-the-meter backup, peak shaving, and power fluctuation mitigation
        - Up to 1 GW co-located campus planned at Skellefteå site
        - Capital co-investment, shared power infrastructure, and stable base load
        - Binding long-term power purchase and storage offtake terms undisclosed
      - - Grid-Scale Battery Energy Storage (BESS)
        - Utilities, independent power producers, and industrial operators
        - Modular stationary energy storage via Voltpack Mobile System (VMS)
        - 6 GWh existing capacity in Gdańsk, expandable to 12 GWh
        - High-throughput near-term revenue using established pack assembly
        - Dependency on third-party or restarted NMC cells pending Li-S readiness
      - - Automotive Mobility (EV OEMs)
        - Passenger EV OEMs (e.g. Stellantis) & tier-1 integrators (Hofer)
        - High-energy-density traction batteries and lightweight vehicle structures
        - Prototype module testing and concept integration (Halcyon EV)
        - Multi-billion-dollar TAM with mineral-free supply chain benefits
