chapter:
  number: 6
  title: Customers
  summary: Lyten positions its proprietary lithium-sulfur (Li-S) cells and acquired gigafactory footprint across automotive, grid energy storage, data centers, and defense mobility, but commercial traction remains concentrated in early co-development partnerships and pilot deployments while utility-scale cycle life remains unproven.
sections:
  - id: customer-segmentation-and-commercial-demand
    title: Customer Base Segmentation and Value Drivers
    body: >
      Lyten targets four core commercial segments across the energy storage and mobility ecosystems:
      commercial and industrial data center infrastructure, grid-scale battery energy storage systems (BESS),
      automotive electric vehicle original equipment manufacturers (OEMs), and high-value defense or autonomous
      systems [CU001, CU002]. In the data center and stationary storage segment, Lyten positions its modular
      Voltpack Mobile System (VMS) and BESS products to mitigate power delivery bottlenecks and manage power
      fluctuations for high-density AI infrastructure [CU002, CU005]. For automotive OEMs, the strategic value proposition
      centers on high theoretical energy density and a critical-mineral-free cathode supply chain that completely
      eliminates nickel, manganese, cobalt, and graphite [CU003, CU006]. However, adoption across these segments follows
      a bifurcated timeline: while initial commercial sales and feathering-in are directed at lightweight defense
      drones and autonomous platforms in 2026, broader utility BESS deployment is deferred to 2027–2028, and mass
      automotive cell delivery is pushed toward 2028 and beyond [CU004, CU008].
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU008
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: adoption-trajectory-and-manufacturing-integration
    title: Commercial Adoption Trajectory and Scaling Strategy
    body: >
      Lyten's commercial adoption trajectory is defined by a hybrid manufacturing and capital-efficiency strategy
      rather than pure greenfield cell deployment [CU007]. Rather than waiting for lithium-sulfur chemistry to mature
      across high-volume automotive lines, Lyten acquired Northvolt's manufacturing infrastructure in Sweden and
      Poland to produce conventional lithium-ion NMC cells and battery packs in the near term, generating baseline
      cash flow while incrementally phasing in lithium-sulfur lines as cycling performance improves [CU007, CU008, CU009].
      Commercial sales from the Gdańsk Northvolt Dwa facility target modular BESS units, while initial cell shipments
      from the Skellefteå gigafactory are targeted for the second half of 2026 to supply internal energy storage
      assembly [CU005, CU009]. Nevertheless, customer procurement across major automotive and utility accounts remains
      conditional: automotive partners require production-grade validation, while utility buyers demand multi-thousand-cycle
      durability that current Li-S commercial prototypes have not demonstrated [CU010, CU011].
    claimRefs:
      - CU005
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
    tableRefs:
      - TU002
  - id: named-customer-proof-and-concentration-risks
    title: Named Customer Proof, Retention, and Concentration Analysis
    body: >
      Proof of real-world adoption is currently limited to high-profile strategic development partners and pilot
      qualification agreements rather than binding multi-gigawatt volume offtake contracts [CU001, CU012]. Stellantis
      stands as Lyten's anchor automotive partner, having invested in 2023 to co-develop lithium-sulfur EV batteries
      and lightweight composite structures, including concept integration in Chrysler's Halcyon vehicle [CU001, CU012].
      In European powertrain engineering, Hofer Powertrain has engaged with Lyten to design and functionally validate
      modular 800V-capable Li-S battery packs [CU006]. In infrastructure, EdgeConneX has partnered with Lyten to develop
      an adjacent AI data center campus in Skellefteå scalable up to 1 GW [CU013]. However, customer concentration risk
      is elevated because legacy Northvolt automotive customers—including Scania, BMW, and Volkswagen—have made no firm
      order commitments to purchase cells from Lyten [CU010]. Furthermore, critical independent evaluations indicate that
      Lyten's pouch cells achieved only 110 cycles before halting from dendritic soft-shorting in stress testing, leaving
      unresolved gaps in long-term customer retention and warranty viability [CU014, CU015].
    claimRefs:
      - CU001
      - CU006
      - CU010
      - CU012
      - CU013
      - CU014
      - CU015
    tableRefs:
      - TU003
