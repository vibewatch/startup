companyProfile:
  summary: >-
    Lyten is a privately held advanced materials and battery company founded in 2015 in San Jose that commercializes a
    3D Graphene materials platform across lithium-sulfur cells, NMC cells, modular BESS, composites, and sensor
    products. The company has expanded through acquisitions of distressed Northvolt assets in Poland and Sweden, and it
    now presents itself as a vertically integrated manufacturing platform for energy-storage and mobility customers.
  foundedDate: '2015-01-01'
