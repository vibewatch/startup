  topStrengths:
    - Differentiated lithium-sulfur and 3D-Graphene platform with credible prototype evidence.
    - Acquired European industrial assets create near-term manufacturing optionality and scale.
    - Strategic backers and cumulative capital raised provide financing support for execution.
  topRisks:
    - Audited financials, margins, and cash-burn remain undisclosed, limiting intrinsic valuation.
    - Factory restart, yield, and qualification execution could consume capital before output scales.
    - Customer adoption and Li-S cycle life are not yet proven at durable commercial levels.
  unresolvedGaps:
