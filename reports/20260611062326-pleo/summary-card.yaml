summary:
  headline: >
    Pleo shows real product breadth, scale, and monetization progress, but the supportable public-data conclusion
    remains research-more because the latest mark still looks stretched against disclosed evidence and too many
    underwriting-critical operating metrics remain private.
  overallScore: 6
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: stretched
