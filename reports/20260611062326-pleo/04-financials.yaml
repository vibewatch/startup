    {
      "id": "gtm-traction-and-unit-economics-proxies",
      "title": "GTM motion, traction signals, and unit-economics proxies",
      "body": "Public evidence suggests Pleo's customer acquisition model is no longer only sales-led. OpenView describes a shift from a historically sales-heavy motion toward a mix of bottom-up product-led growth, top-down sales, and customer success, with an explicit ambition to reach roughly 12-month CAC payback. That is directionally encouraging, but it remains a proxy rather than a current operating KPI because Pleo does not publish realized CAC, payback by channel, or fully loaded acquisition cost. What investors do get instead are indirect signs of conversion and onboarding efficiency. Customer stories describe fast implementation, immediate bookkeeping integration, reduced receipt chasing, and meaningful reductions in finance admin, which all point toward sticky workflows and decent time-to-value for SMB customers.\n\nDistribution is also expanding beyond direct sales. The consulting-partner programme offers client discounts and a 15% revenue share, while the embedded strategy described by Nordic Fintech targets accounting SaaS vendors and PSPs that already own trusted customer relationships. Nordic Fintech's reported partner metrics, including higher spend and strong monthly active use after embedding, are company-reported and should not be treated as audited economics. Still, they support a plausible channel thesis: Pleo may be able to lower some onboarding friction and widen distribution through advisor and platform partners, even though realized channel margin and payback remain private.",
