    "number": 4,
    "title": "Financials",
    "summary": "Public evidence supports a hybrid Pleo revenue model built from subscriptions, usage-linked finance workflows, card-spend economics, and newer credit or treasury add-ons. Growth proxies improved from OpenView's ~€100m ARR profile to Kinnevik's €140m 2024 revenue run-rate marker, but exact gross margin, burn, runway, and realized channel efficiency remain private while tech.eu's valuation markdown shows outside capital markets still price execution risk. The supportable verdict is therefore constructive but qualified: monetization breadth is real, yet underwriting still needs internal mix, margin, and cash disclosures."
  },
  "sections": [
    {
      "id": "revenue-model-pricing-and-mix",
      "title": "Revenue model, pricing surface, and monetization mix",
      "body": "Pleo should be underwritten as a blended software-and-financial-rails business, not as a pure spend-card issuer and not as a clean SaaS subscription company. Kinnevik's portfolio write-up and OpenView's operating profile both describe two core revenue rails: subscription revenue from the software platform and spend-linked revenue generated when customers use Pleo cards. Official pricing then shows that the subscription layer is real and structured, with four public tiers, per-user charges on paid plans, invoice-payment fees, reimbursement fees, cashback incentives, and progressively larger credit limits. That matters because list pricing demonstrates recurring revenue intent and explicit usage monetization, while the card rail adds activity-linked upside if customers deepen spend through the platform.\n\nThe mix is also broadening. Official cash-management materials show Pleo trying to capture more treasury wallet share through linked bank accounts, sub-accounts, transfer rules, multi-currency balances, and yield on idle cash. Those features make the model more attractive if they increase ARPA and retention, but they also make the economics harder to read from outside the company because public materials do not separate realized software revenue, interchange, payments fees, credit income, or treasury yield. The right conclusion is not that the model is weak. It is that public evidence proves several monetization surfaces exist, while the realized mix between them is still opaque.",
