  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：先是支出管理，其次才是财务自动化
        blocks:
          - type: paragraph
            body: >-
              Pleo 的公开产品页和定价页支持一个较窄的核心市场定义：围绕员工卡、费用采集、报销、应付账款和审批控制。Payhawk、Spendesk、Moss 和 Soldo
              的竞品页面几乎落在同一位置：这个市场已经不再只是发卡，但也不是完整的 CFO 办公室软件栈。稳定模式是一层连接会计、HR
              和支付基础设施的支出控制层。司库、采购、差旅、电子发票和嵌入式分发更多是扩张路径，而不是清晰起点。尽调时，核心总可用市场（TAM）因此应剔除
              ERP、薪资、核心银行和通用财务软件池，再把司库和伙伴驱动分发视为相邻增长楔子，随着时间推移扩展 Pleo 可触达市场。实际买方替代方案仍是手工财务行政。
