        - 如果差旅与核心支出分开采购，多供应商并用仍然可行
      - - 薪资 / 资金管理 / 企业账户相邻场景
        - 现金账户、薪资可见性和更宽的 CFO 运营数据
        - 目前高
        - 竞争方：Ramp、Payhawk、Paylocity/Airbase、Brex
        - 最暴露的扩张切口，因为竞品打包范围已超出 Pleo 的公开核心
    notes: 本表关注支出栈部署后，买家可能在哪些位置多供应商并用或切换；「多供应商并用难度」是基于工作流嵌入深度的分析判断，不是披露的流失指标。
