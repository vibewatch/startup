      - number: '6.4'
        title: 客户集中度和耐久性仍是主要未答尽调问题
        blocks:
          - type: paragraph
            body: >-
              现有证据反驳了客户基础明显狭窄或单一垂直行业的判断，但没有回答收入集中度或耐久性这些更难的承销问题。公开证据覆盖非营利、出行、媒体、软件、制造、生物科技、花艺、交通、咨询和类似医疗的环境，降低了 Pleo
              过度暴露于某一个显性用例的风险。但没有任何公开来源披露：少数大客户是否主导收入、合同是年度还是多年期、多少客户扩张或流失，以及入职兴奋过去后队列留存是什么样。


              因此，证据质量并不对称。公开客户故事详细且新近，但大多由 Pleo 控制；评价平台提供有用摩擦信号，但 G2 等部分第三方页面仍需登录，因而只能部分用于交叉验证。实际尽调动作很清楚：向管理层索取前 20
              大客户收入占比、细分市场层面的 GRR 和 NRR、合同条款、第一年后的续约率、发票和现金管理附加率，以及具名案例研究结果能转化为组合层面留存和扩张、而不是孤立营销亮点的证据。在那之前，Pleo
              的客户章节应在宽度和日常效用上评为有希望，但在耐久性和集中度上仍不完整。
