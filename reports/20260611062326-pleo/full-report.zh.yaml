  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 按收入流拆分
        - 订阅、交换费、AP 支付、资金管理和信用的当前占比
        - 没有收入结构，投资者无法判断收入耐久性或利润率质量。
        - 要求提供按产品轨道拆分的月度经常性收入桥和毛利率。
      - - 现金消耗与现金跑道
        - 当前现金余额、月度烧钱速度和最低流动性门槛
        - 当前估值标记是合理还是偏高，取决于对融资依赖的判断。
        - 要求提供董事会或贷款人材料，显示现金跑道和契约余量。
      - - 信用表现
        - 按地区拆分的组合规模、违约率、损失率和融资成本
        - 只有风险调整后经济性健康，信用上行才有吸引力。
        - 要求提供承保材料和过去 12 个月组合表现。
      - - 股权结构表与优先权
        - 清算优先权堆叠、员工行权价敏感性和任何优先条款
        - 如果优先权很重，名义估值可能高估普通股价值。
        - 要求法务或财务提供最新股权结构表和条款摘要。
      - - 留存与扩张
        - 按队列拆分的 NRR、总留存、附加率和 ARPA
        - 溢价倍数取决于可持续的扩张经济性，而不只是客户数增长。
        - 要求提供队列表和按细分市场拆分的产品附加率趋势。
      - - 2026 年估值新鲜度
        - Kinnevik 2024 年 Q4 之后任何 2026 年内部标记、老股交易或新股融资参考
        - 如果市场条件发生实质变化，2024 年标记对 2026 年投资决策已经过时。
        - 要求提供最新董事会估值备忘录、老股成交记录或已签署融资文件。
    notes: 这些问题构成从继续研究转向明确价格判断所需的最低数据集。
    claimRefs:
      - CV018
      - CV019
      - CV039
      - CV044
      - CV045
      - CV046
