      - number: '2.2'
        title: 规模测算视角：公开证据更支持账户口径，而不是欧元 TAM
        blocks:
          - type: paragraph
            body: >-
              最强的公开上限是 European Commission 统计的 26.1 million 家 SME。这个数字很宽，但它官方且较新。公开客户数要窄得多：Pleo 称有 40,000+ 家公司，Nordic
              Fintech Magazine 报道其在 16 个欧洲国家约有 45,000 客户。这意味着相对于 EU SME 存量，渗透率只有约 0.15% 到 0.17%，约 26.055 million 家企业仍在
              Pleo 当前客户基础之外。这个数字适合做可获取市场（SOM）的合理性校验，而不是干净的可服务市场（SAM）。缺失的分母是：在 Pleo 已服务地域中，真正需要财务协作和支出控制的雇主型或多用户 SME
              有多少。Eurostat 的及时性有助于确认当前商业统计存在，但抓取到的落地页没有暴露这个精确切口。因此，以欧元计价的 TAM
              会显得比证据允许的更精确。严谨投资者的读法应是：漏斗顶端保持宽口径，已服务市场保持定性，再让管理层证据决定更细的 SAM 切分。
