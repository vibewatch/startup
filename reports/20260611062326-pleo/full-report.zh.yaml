chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品范围与商业模式
        blocks:
          - type: paragraph
            body: >-
              Pleo 把自己定位为欧洲企业支出平台，而不是狭义发卡机构。公司官方页面围绕智能公司卡、费用采集、发票处理、报销以及与财务系统的集成来呈现产品；定价页则显示，产品访问从 Starter 到 Beyond
              被刻意拆成多个层级。这个结构很重要，因为它指向以软件为主、靠功能增购变现的模式，而不只是支付利润率故事。Kinnevik 的公司概览也强化了这一判断：它把收入来源描述为两条，SaaS 订阅费和流经客户卡的支出。


              官方页面对公司身份叙事支撑充分。Pleo 称，公司由 Tradeshift 前运营人员 Jeppe Rindom 和 Niccolo Perra 于 2015 年在哥本哈根创立。今天的官方业务覆盖是欧洲 16
              个国家、40,000+ 家公司，办公室分布在 Copenhagen、London、Berlin、Stockholm、Madrid、Lisbon、Paris、Amsterdam 和
              Chennai。唯一有实质歧义的是员工数：关于页面写 800+，新闻页面写 900+，因此当前最稳妥的表述是 800-900+ 区间，而不是单点估计。这足以把 Pleo
              归为有可观运营规模的后期未上市金融科技公司，但如果没有管理层数据，还不足以给出精确的封面指标。


              产品宽度在工作流层面也能看见。官方页面称，Pleo 可以即时发行虚拟卡、报销员工垫付费用、自动处理 OCR 驱动的发票，并连接 Xero、NetSuite、QuickBooks、SAP
              SuccessFactors 和 BambooHR 等会计和 HR 系统。帮助中心还补充，多币种账户现在支持六种货币，说明产品正从传统费用管理走向靠近司库的运营现金控制。
