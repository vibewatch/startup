      - number: '8.3'
        title: 情景分析支持纪律，而不是不看价格的乐观结论
        blocks:
          - type: paragraph
            body: >-
              只看公开信息的估值框架应保持谦逊。如果把 Pleo 更像公开市场支付或工作流软件资产来承销，按约 €130 million 到 €140 million 收入套 6x 到 8x
              收入倍数，结果会低于当前隐含标记。这是反向情景，而且重要，因为公开可比公司的成交口径仍远低于 Pleo 当前收入倍数。基准情景更接近现有 Kinnevik 标记：基于当前运行率约 10x 到 11x
              收入，落在与今天外部信号相同的数量级，并承认 Pleo 的增长仍强于成熟上市参照。上行情景存在，但有条件，不是自动发生。要证明 12x 到 14x 收入或更高倍数合理，投资者需要相信：2025
              年再投资能保住持久增长，treasury 和 credit
              确实加深变现而不是增加复杂度，资本强度仍受控。换句话说，这不是一家没有上行的坏公司；而是一家当前标记已经要求投资者相信超过公开证据能完全证明内容的公司。因此，可支持的结论是继续研究：中等信心、高风险、估值偏高，而不是明确买入。
