  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图：欧洲优先的套件同行是主要基准，但美国捆绑产品正在逼近
        blocks:
          - type: paragraph
            body: >-
              保留下来的来源集指向一个清晰的直接同行群，而不是模糊的金融科技宇宙。Spendesk、Payhawk、Moss 和 Soldo 都把集成卡、审批、应付账款或发票工作流，以及财务系统集成，卖给 Pleo
              目标中的同一批 SMB 和中端市场买方。每家公司也都把任务定义得比发卡更宽：Spendesk 强调采购，Payhawk 强调财务编排和差旅，Moss 强调 AI 预会计和模块化自动化，Soldo
              强调去中心化支出加金融服务控制。因此，对于选择现代支出栈的欧洲买方，它们都是直接替代品。


              第二圈竞争已不再是假设。Ramp 和 Brex 都发布了更宽的全球控制叙事，公开客户数或发卡覆盖强于多数欧洲同行；Airbase 现在则置于 Paylocity
              的薪资加财务平台中。保留来源还不足以证明这些玩家已经是欧洲本土领导者，但它们显示了这个品类可以多快从支出管理被重新框定为更宽的 CFO 办公室捆绑产品。对 Pleo
              来说，这意味着功能重叠已经是入场门槛。真正的战略问题是：欧洲监管适配、本地集成和透明包装，是否足以防住那些能把采购、差旅、司库、薪资或资产负债表规模合入同一个购买动作的竞争对手。
