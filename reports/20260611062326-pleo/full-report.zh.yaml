  - id: FE004
    title: 产品成熟度 / 能力图
    type: matrix
    layout: standard
    summary: 定性观察 Pleo 产品最强的环节，以及公开证据更薄的地方。
    data:
      columns:
        - 工作流成熟度
        - 集成深度
        - 证据质量
        - 差异化解读
      rows:
        - label: 卡和核心支出控制
          values:
            - 高 —— 成熟且处于产品组合核心
            - 高 —— 定价和工作流证据清晰
            - 中高 —— 官方证据叠加合作伙伴 / 评价佐证
            - 基础很强，但单独看已不再独特
        - label: 报销和 AP
          values:
            - 高 —— 二者都已明确产品化
            - 中高 —— 工作流证据强，端点深度不均
            - 中 —— 主要来自官方证据和 Xero 佐证
            - 重要的套件黏合剂，降低对单点工具的需求
        - label: 会计集成层
          values:
            - 中高 —— 合作伙伴文档和导出模型扎实
            - Xero / 文档为高，QuickBooks 较低
            - 高 —— 公开文档细节异常充分
            - 对财务系统适配是真差异点，但不是通用开发者平台
        - label: 现金管理 / 资金管理
          values:
            - 中 —— 相邻能力，但已经上线
            - 中 —— 公开能力存在，采用指标缺失
            - 中 —— 发布报道叠加公司研究
            - 如果执行匹配叙事，钱包份额扩张很有吸引力
        - label: 嵌入式分销
          values:
            - 中 —— 已上线且正在积极推进
            - 中 —— 合作伙伴渠道论点清晰，广泛端点证据仍在形成
            - 中 —— 公司材料叠加一份独立画像
            - 可能具备战略意义，因为它改变分销，而不只是功能
        - label: 公开技术开放度
          values:
            - 文档为中，开放产品可扩展性为低
            - 中 —— 文档强，开源产品界面有限
            - 中 —— GitHub 更像基础设施工具，而不是公开平台模块
            - 对合作伙伴有用，但单靠它不足以形成平台护城河
    approximationNotes: 成熟度等级是基于证据深度、已披露功能广度和佐证质量的定性判断，而非供应商打分指标。
