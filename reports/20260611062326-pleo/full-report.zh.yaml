companyProfile:
  summary: >
    Pleo 是一家总部起于哥本哈根的后期未上市金融科技公司，由 Jeppe Rindom 和 Niccolo Perra 于 2015
    年创立。它最早是支出管理产品，如今呈现为更宽的财务工作流，覆盖银行卡、报销、应付账款、集成、现金管理、多币种控制和嵌入式分发。公开证据支持其在欧洲已有可观规模：16 个市场、40,000+ 客户，并指向 2024 年收入运行率超过
    EUR 140 million；但公司在留存、利润率构成、现金跑道以及 2021 年峰值估值之后的当前股权结构条款上仍披露有限。
