    rows:
      - - Pleo 2024 年 Q4 Kinnevik 标记
        - 约 $1.62bn 隐含 / 持股 14% 对应 SEK 2.445bn 股权价值
        - '>€140m 收入运行率（2024 年 10 月）'
        - 约 10x-12x 收入
        - 对被承保资产的直接当前外部标记。
        - 投资人标记，不是新的定价一级轮次，且基于 2024 年收入证据。
      - - Perk / TravelPerk 2025 年 E 轮
