      - number: '7.3'
        title: 竞争、伙伴依赖和执行宽度限制 Pleo 从扩张中兑现的上行空间
        blocks:
          - type: paragraph
            body: >-
              Pleo 的竞争风险不在于某一个压倒性对手，而在于一个拥挤的融合格局。Payhawk、Moss、Spendesk 和 Soldo
              都在营销彼此重叠的组合：卡、报销、AP、控制、集成、自动化、安全认证和受监管支付能力。这并不意味着 Pleo 没有差异化，但意味着现金管理或 AI
              辅助财务工作流等新模块很难长期独占。在一个多家供应商都承诺实时控制、更好的月结和更强合规的市场里，负担会从发布功能转向执行质量、定价纪律，以及证明相邻产品能改善留存或 ARPA，而不是只把路线图做得更复杂。


              依赖风险埋在竞争叙事下面。Pleo 披露了 Mastercard 授权发卡和 AWS 支撑的基础设施；其受监管产品也天然依赖监管关系，并且在更新的 treasury 或 credit
              工作流上依赖银行和流动性管线，而公开来源没有完整说明这些管线。独立评价一方面抵消了营销叙事，另一方面也同时显示真实客户效用和真实摩擦。评价记录并不灾难，但确实展示了会让竞争更咬人的失效模式：集成缺口、卡问题、待处理交易噪音，以及产品变更后的工作流摩擦。缓释因素是，Kinnevik
              仍把 Pleo 描述为深度嵌入客户财务工作流，而且 Pleo 现在已经是一家 800 多人的组织。残余风险是执行宽度：在不损失易用性或支持质量的情况下，加入更多受监管工作流、更多地域和更多 AI
              驱动控制，比简单再发一个功能页面难得多。
