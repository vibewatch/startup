      - number: '1.2'
        title: 领导层、治理与受监管运营基础
        blocks:
          - type: paragraph
            body: >-
              Pleo 仍然明显带有创始人印记。官方关于页面和新闻材料仍围绕 Jeppe Rindom 与 Niccolo Perra 讲公司叙事；2021 年 7
              月融资公告显示的治理变化，也更像是在扩充治理，而不是让职业经理人取代创始人：Bain Capital Ventures 合伙人 Keri Gohman 随 Series C
              加入董事会。后来围绕信贷和司库能力的产品扩张沟通，也点名 Amit Kahana 等职能负责人。合在一起，这些来源支持一个合理推断：即使 Pleo 已不再是早期创业公司，关键人物依赖仍然重要。


              受监管基础强过许多纯软件支出工具。EBA 关联的支付机构登记记录显示，Pleo Financial Services ApS 是一家丹麦电子货币机构，自 2018 年 11 月 30
              日起获准从事支付卡执行、直接借记、贷记转账和支付工具发行。公司官方页面还称，Pleo Financial Services UK Ltd 依据 Electronic Money Regulations 2011
              获 FCA 授权，机构参考号为 1020730。这个组合很重要，因为它让 Pleo 对支付功能有更多直接控制，也解释了为什么公司能扩展到相邻的司库和支付工作流，而不是停留在第三方之上的薄软件层。


              安全与合规披露方向上扎实，但仍停在较高层级。Pleo 称客户数据存储在爱尔兰的 AWS 基础设施中，并为敏感环境配置加密、基于角色的访问控制和
              MFA。缺口在治理透明度：公开材料没有给出现任董事会完整名单、委员会结构或按投资者划分的席位分配。这不会推翻本章判断，但如果没有内部材料，董事会和控制权叙事很难高置信度打分。
