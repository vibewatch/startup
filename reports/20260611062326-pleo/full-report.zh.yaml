          - type: callout
            title: 混合变现真实存在
            body: 公开证据持续支持一个结合经常性软件费用、支出相关收入，以及更新司库或信贷收入表面的模型。
            calloutType: insight
            claimRefs:
              - CI001
              - CI005
              - CI038
          - type: callout
            title: 估值尚未追上运营动能
            body: Kinnevik 更强的收入评论并未阻止 Pleo 隐含外部价值出现重大下调，这是当前来源集中最干净的反向信号。
            calloutType: risk
            claimRefs:
              - CI012
              - CI015
              - CI016
              - CI041
          - type: callout
            title: 用内部运营包承销，而不是用标价承销
            body: 在形成强投资观点前，应索取计划组合、按轨道拆分的毛利率、现金和现金跑道、按渠道拆分的 CAC，以及信贷损失数据，因为公开证据离完整承销模型仍有明显距离。
            calloutType: recommendation
            claimRefs:
