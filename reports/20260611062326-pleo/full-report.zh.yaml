      - number: '7.2'
        title: 随着 Pleo 走出核心卡工作流，监管、欺诈和运营复杂度上升
        blocks:
          - type: paragraph
            body: >-
              公开来源支持一个判断：Pleo 并不在轻监管的软件边界里运营。丹麦 EMI 牌照、英国授权披露、公开投诉路径和欧盟即时支付方案，都指向一家公司必须跟上实时支付监管，而不只是满足普通 SaaS 合规。Instant
              Payments Regulation 尤其重要，因为它为非欧元区 EMI 和支付机构引入了具体期限，还加上收款人验证、制裁筛查、资金保护、接入和报告义务。这些规则可管理，但不是零成本。如果 Pleo
              错过里程碑、控制体系搭得太慢，或在控制基础设施准备好之前承接更多支付功能，客户信任、监管信心和执行可信度会同时受损。


              欺诈和运营风险与这条边界紧密绑定。Pleo 自己的信任页面显示了严肃的基线：MFA、AWS 欧盟区存储、BC/DR 演练和漏洞赏金。状态页也显示近期 uptime
              表面干净。但另外两个事实对前瞻风险更关键：Pleo 现在就在提醒用户防范冒充攻击，而且公司称，与 Taktile
              合作是因为交易复杂度和金融犯罪风险正在随公司扩张而上升。现金管理又加了一层，因为银行账户聚合、流动性自动化、FX 处理和 treasury
              可视性，会同时放大产品面和控制面。因此，正确的承销姿态不是把监管或欺诈视为今天的投资逻辑杀手，而是把它们视为规模化风险：如果上线范围跑到控制之前，它们可能很快从可管理变成重大风险。
