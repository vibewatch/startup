      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              需求侧驱动因素在支付数据和司库痛点信号里都能看到。ECB 显示非现金、银行卡和即时支付量仍在上升，这支持商业支出工作流继续数字化。Pleo
              自身司库研究又补上买方痛点：多实体可见性差、工具碎片化、回退到电子表格，以及对采购监督或现金部署缺乏信心。SMB
              和中端市场财务团队购买统一支出控制软件，这些都是可信理由。主要约束在于，监管不是免费顺风。Instant Payments Regulation 要求 24/7 可达、收款人验证、价格平价，并要求部分提供商到
              2027 年完成重大 EMI 或 PI 升级。Bird & Bird 明确指出，制裁筛查和结算访问变化很难运营落地。再加上 EU
              交换费上限、银行门户碎片化以及现金管理推出节奏，这个市场看起来有吸引力，但运营要求高，并非无摩擦。这个组合支持建设性的需求判断，但不支持在缺少进一步尽调时假设欧洲扩张无摩擦，或承销美国式单位经济。
