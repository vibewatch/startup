      - number: '1.4'
        title: 规模信号、里程碑时间线与当前启示
        blocks:
          - type: paragraph
            body: >-
              最近的运营信号显示，Pleo 正从支出控制扩展到靠近司库的基础设施。Financial IT 和 Finextra 报道的 2025 年 10
              月现金管理发布，把产品推向英国和德国，下一步是丹麦和荷兰，并描述了一套统一账户可见性、转账规则和多币种控制的工作流。随后，Nordic Fintech Magazine 在 2026 年 3 月的特写把
              Embedded 和合作伙伴定义为下一增长杠杆，同时报告约 45,000 客户覆盖，并引用 NPS 指标，说明即便公司扩展产品栈，客户仍重视该产品。OpenView 更早的 ARR 画像和 Kinnevik
              持续评论也支持一个判断：Pleo 试图提高单账户变现深度，而不是只靠新客户发卡增长。


              监管和宏观背景有助于解释这一产品方向。Regulation (EU) 2024/886 与 Bird & Bird 的实施摘要显示，到 2027 年 4 月，欧元区 EMI 和 PI
              将需要具备即时贷记转账和收款人验证能力；EPC 的 2025 SCT Inst 规则手册则把一个相关地址格式截止日移至 2026 年 11 月 15 日。与此同时，ECB 报告 2025
              年上半年欧元区非现金支付达 77.7bn 笔，European Commission 的 SME 复盘仍描述了 26.1 million 家 SME、年增长 1.2% 的基础。对 Pleo
              来说，这意味着即使合规义务上升，大型数字支付和 SME 运营背景仍然存在。


              反向启示不是产品失败，而是估值警告。Tech.eu 2025 年 2 月关于估值下调的报道，是来源集里最干净的外部怀疑信号。它并不否定 Pleo 的产品宽度或收入运行率增长，但显示市场在把公司重新定价到接近
              2021 年高点之前，要求看到更强的可持续盈利能力和可规模化经济性证据。
