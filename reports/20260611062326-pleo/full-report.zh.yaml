        - 上探市场的层级，可显著拉高 ARPA
        - 返现既是客户激励，也是利润率成本
      - - Beyond
        - 年付折合 £199/month + £18/额外用户
        - 0.75% 返现、子账户、采购订单、AI 审核
        - 公开标价中最清晰的最高 ARPA 路径
        - Beyond 以上的真实企业定价仍未公开
      - - 发票付款
        - 按计划每张发票 £1.50 或 £0.95
