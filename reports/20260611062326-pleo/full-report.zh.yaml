  - id: FV002
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 推荐结论沿着一条简单链条展开：真实规模和业务宽度支撑继续关注，但当前估值标记、可比公司压力和隐藏的经济性挡住了买入判断。
