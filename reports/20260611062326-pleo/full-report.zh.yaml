        - 创始人加少数支出人员
        - 企业主
        - 收据、审批与记账协同首先出现痛点
        - 买方、付款方与管理员常常合并为同一角色
      - - 成长期 SMB 财务团队
        - 财务经理或财务主管
        - 员工、团队负责人和财务运营
        - 中央财务预算
        - 需要把卡、审批与会计结账连起来
        - 即便员工是高频用户，财务也成为工作流所有者
      - - 多实体 / 中端市场
        - 财务主管、财务 VP 或 CFO
        - 部门支出人员加财务管理员
        - 中央财务并带实体监督
        - 需要多实体可视性、预算、政策控制以及 ERP 或 HRIS 连接
        - 包装转向复杂功能，而不是更多席位
      - - 司库附加买方
        - CFO 或司库负责人
        - 财务团队与现金所有者
        - 财务转型预算
        - 现金可视性、外汇泄漏与闲置流动性带来挫败感
        - 核心支出控制之后，司库成为第二个钱包份额对话
      - - 嵌入式合作伙伴路径
        - 会计平台或 PSP 合作伙伴
        - 合作伙伴工作流内的 SMB 终端客户
        - 合作伙伴商业预算，随后是 SMB 订阅或支出经济性
        - 自建还是购买的压力，以及把客户留在现有平台内的诉求
        - 直接 SMB 销售部分被渠道主导分发取代
    notes: 各行是基于厂商定位、定价与合作伙伴评论综合出的定性细分，而非已披露客户组合数量。
