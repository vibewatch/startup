  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资历史和当前外部标记显示了真实规模，也显示重置尚未修复
        blocks:
          - type: paragraph
            body: >-
              Pleo 的估值记录已经不再是直线上升的故事。公司自己的 2021 年公告显示，它先以 $1.7 billion 估值完成 $150 million Series C，随后又以 $200 million
              扩展轮把合并融资推到 $350 million，并把估值推到 $4.7 billion。这个峰值重要，因为它仍在塑造创始人、员工和投资者预期。不过，对新投资者更相关的锚点，是最新外部标记。Kinnevik 的
              2024 年 Q4 材料和 tech.eu 对其的翻译显示，14% 股权标记为 SEK 2.445 billion，隐含公司价值约 $1.62 billion，同比减记约 26%。这次 markdown
              是有意义的反向证据，但并不等于经营证明崩塌。Kinnevik 同时表示，Pleo 到 2024 年 10 月已达到超过 €140 million 的收入运行率，2024 年增长速度是上市 SaaS
              基准的两到三倍，并保持高于平均的毛利率。因此，真正的张力不是「坏公司还是好公司」，而是：一个仍带溢价的私有估值，必须在一个不再默认支付 2021 年式倍数的市场里被承销，尤其当 Kinnevik
              自己也称，2025 年再投资会先让利润率改善停滞，之后的回报还看不见。
