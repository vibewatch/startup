  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 估值重置、融资不透明和 SMB 宏观敏感性仍是最清晰的投资者风险
        blocks:
          - type: paragraph
            body: >-
              最尖锐的公开风险信号，仍然来自外部定价。Kinnevik 的 2024 年 Q4 标记和 tech.eu 的报道显示，即便 Pleo 继续释放经营动能的公开迹象，其隐含价值仍远低于 2021
              年峰值。这一点重要，因为公开记录仍然没有补上叙事和可承销经济性之间的缺口：外部投资者看得到规模、经常性收入特征和工作流黏性，却仍看不到烧钱速度、手头现金、现金跑道、队列留存，或按产品轨道拆开的最新毛利率桥。实际结果是，只要增长在透明度改善前放慢，Pleo
              就会暴露在又一次估值重置，或在谈判筹码更弱时完成融资的风险里。


              第二个相关风险是需求质量。Pleo 自己的页面和 OpenView 的画像都强化了同一点：业务重心很大程度上压在欧洲 SMB 和中端市场买家身上，而不是一个已披露的企业客户底座。European
              Commission 的 SME 评估并不是针对公司本身的警告，但方向上很重要，因为它显示庞大的 SME 基数仍在经济逆风中运转，预计复苏幅度有限，贸易不确定性还在延续。Pleo
              依赖的正是这一客群，用来拉动卡支出、SaaS 席位和钱包份额扩张。缓释因素在于，Pleo 似乎已经嵌入财务工作流，耐久度高于可有可无的单点工具。残余风险则是，宏观压力可能很快体现在支付量、新 logo
              转化、降配压力，以及客户对 treasury 或 credit 等附加产品的意愿上，而投资者可能还没拿到清晰的现金跑道视图。
