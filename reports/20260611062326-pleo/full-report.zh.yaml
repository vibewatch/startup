  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 主要传导路径从监管、欺诈和产品广度执行，进入客户信任、利润率、融资灵活性和估值。
    data:
      nodes:
        - id: reg
          label: 即时支付和 EMI 合规
          detail: 截止期限、VoP、制裁筛查和监管报告都会增加执行工作。
          tone: warning
        - id: fraud
          label: 欺诈 / AML 扩张风险
          detail: 交易复杂度提高，实时冒名警示增多，运营利害也随之上升。
          tone: warning
        - id: treasury
          label: 资金管理扩张复杂度
          detail: 现金管理功能扩大了流动性、外汇和对账的覆盖面。
          tone: warning
        - id: comp
          label: 功能同质竞争
          detail: 同行也在营销相似的控制、支付和安全主张。
          tone: warning
        - id: cust
          label: 客户信任与留存
          detail: 支持质量、正常运行时间和可靠性直接影响黏性。
          tone: neutral
        - id: margin
          label: 利润率和回本
          detail: 控制工作增加、折扣加深，可能稀释经营杠杆。
          tone: negative
        - id: fin
          label: 融资灵活性
          detail: 跑道不透明、估值标记走弱，会削弱谈判筹码。
          tone: negative
        - id: val
          label: 估值结果
          detail: 公开估值标记和下一轮融资，把执行表现转化成价格。
          tone: negative
      edges:
        - from: reg
          to: margin
          label: 增加合规成本
        - from: reg
          to: cust
          label: 如果推出延误
        - from: fraud
          to: cust
          label: 打击信任
        - from: fraud
          to: margin
          label: 推高损失和运营成本
        - from: treasury
          to: margin
          label: 增加运营负荷
        - from: treasury
          to: cust
          label: 如果对账失灵
        - from: comp
          to: margin
          label: 压低价格
        - from: comp
          to: cust
          label: 增加切换选项
        - from: cust
          to: fin
          label: 改变留存叙事
        - from: margin
          to: fin
          label: 改变资金跑道
        - from: fin
          to: val
          label: 决定谈判能力
        - from: cust
          to: val
          label: 塑造增长可信度
    approximationNotes: 该图是因果综合，不是量化模型；它展示了留存公开证据支撑最强的路径。
