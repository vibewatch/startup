  - id: TP003
    title: 定价与包装对比
    columns:
      - 厂商
      - 公开入门姿态
      - 定价如何扩张
      - 什么被打包，什么被门控
      - 商业解读
      - 对 Pleo 的含义
    rows:
      - - Pleo
        - Starter 加付费层级公开发布
        - 平台费加付费计划上的新增用户收费
        - 入门层级包含核心支出控制；返现、多实体、AI 洞察和更多供应商卡向上门控
        - 足够简单和自助，降低评估摩擦
        - 有助于 SMB 获客，但可能给定制化企业包装留下的空间更少
      - - Spendesk
        - 无公开标价；需要询价
        - 模块化基础包加附加件和高级工作流
        - 基础包含无限卡和用户；采购和高级工作流以模块加入
        - 商业灵活性有利于协商式价值销售
        - 可在定制企业捆绑中胜过 Pleo，但对小买方显得不够透明
      - - Payhawk
        - 报价主导的模块化项目
        - 复杂度随模块、附加件和实体范围扩张
        - Growth 计划明确排除高级多实体和采购到付款宽度
        - 包装对齐组织复杂度，而不是员工数
        - 当买方需要企业复杂度而非简单席位定价时，会给 Pleo 施压
      - - Moss
        - 免费入门层级加付费模块化计划
        - 单一平台费加交易量费用；不收用户费
        - 卡或 AP 可免费起步；附加件和交易量推高成本
        - 对用户费敏感的买方很有竞争力
        - 在欧洲最直接挑战 Pleo 的席位经济性
      - - Soldo
        - 订阅加单独金融服务费用和试用
        - 月度订阅，部分卡片或金融服务另收费用
        - 定价有说明，但实际账单混合了软件费和支付费
        - 商业逻辑更偏向愿意管理更多环节的买家
        - 第一眼不如 Pleo 顺滑，但对重视支付通道的买家可能更有吸引力
      - - Ramp
        - 免费计划，加 $15/user、平台费，以及企业自定义报价
        - 更高阶的自动化、集成和附加组件会推高成本
        - 即便公开入门档位较低，也能看到很宽的功能面
        - 公开入门姿态激进，再靠自动化深度向上销售
        - 如果本地化跑通，Ramp 可能用更低入门价压过 Pleo，同时打出更宽的套装
      - - Brex / Airbase
        - Brex 从 $0/user 起，高阶为 $12/user；Airbase 在 Paylocity 体系内仍按企业销售
        - Brex 靠产品层级扩张；Airbase 靠中端市场平台销售扩张
        - Brex 保持可见入门价；Airbase 受益于薪资与 HCM 捆绑
        - 渠道或母公司经济性与产品定价同样重要
        - Pleo 可凭清晰度取胜，但未必能赢过企业套装杠杆
    notes: 公开标价和费用说明口径不一，因此各行比较的是可观察的商业姿态，而不是标准化后的有效年度合同价值。
