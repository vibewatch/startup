        - 当前
        - ECB 称即时贷记转账已占零售贷记转账量的 23%
        - 实时财务工作流在 SMB 买方面前更常态化
        - 确认 Pleo 是否计划在当前支付流之外更深使用即时支付
      - - 财务可视性碎片化
        - 驱动因素
        - 当前
        - Pleo 关于可视性薄弱和使用四个以上工具的司库研究
        - 支撑统一支出与司库视图的需求
        - 要求提供客户层面证据，证明可视性提升能降低流失或改善扩张
      - - 电子表格与手工兜底
        - 驱动因素
        - 当前
        - Pleo 关于电子表格和手工司库工作的研究与评论
        - 支撑自动化和更快结账带来的 ROI 案例
        - 要求按细分客群提供实施前后指标
      - - 即时支付条例
        - 混合
        - 2025-2027
        - EUR-Lex 与 Bird & Bird 关于收款人验证和制裁筛查的截止期
        - 抬高买方对现代支付 UX 的预期，但也增加供应商复杂度和成本
