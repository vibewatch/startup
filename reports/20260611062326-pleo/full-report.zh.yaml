      - number: '4.4'
        title: 融资依赖、估值重置与财务结论
        blocks:
          - type: paragraph
            body: >-
              Pleo 的公开财务叙事在 2024 年随运营动能改善，但尚未修复执行表现与外部定价之间的距离。OpenView 的画像围绕约 €100 million ARR 和 80% 同比增长来描述公司；Kinnevik
              之后在 2024 年 Q4 公告中指向 €140 million 收入运行率，以及相对 SaaS 基准更强的增长。这些都是正向规模信号。反向读法来自定价：tech.eu 报道 Kinnevik 将其 Pleo
              持股标记降至 SEK 2.445 billion，暗示估值接近 $1.62 billion，远低于 2021 年末 Series C 延期轮对应的 $4.7 billion。


              自 2021 年定价股权轮以来，最清晰的新融资事件是债务。Pleo 2024 年 5 月的 HSBC
              额度扩展了信贷能力，也表明债务现在是资本结构中的明确组成部分。这提高了灵活性，但没有回答最重要的承销问题，因为公开来源仍不披露账上现金、烧钱速度、现金跑道、信贷产品损失率，或下一次外部融资触发条件。因此，可支撑的结论是建设性但不完整：Pleo
              似乎拥有一个可信、已变现的平台，并有多条扩张轨道；但外部投资者仍需要内部运营包证据，才能有信心承销收入质量、利润率耐久性和融资依赖。
