      - number: '8.4'
        title: 剩下的工作很清楚：先补上隐藏经济性缺口，再把当前标记视为有吸引力
        blocks:
          - type: paragraph
            body: >-
              本章剩余不确定性，集中在一小组管理层可在尽调中很快披露、但外部投资者无法从公开来源补回的数据上。最重要的缺失块，是按收入流拆开的收入质量：当前收入中订阅、支付、interchange、treasury、credit
              或其他服务各占多少，每条轨道增长多快？第二块是资本强度和下行韧性：当前现金、月度烧钱、流动性现金跑道，以及 credit 产品周围任何融资契约或仓储融资依赖。第三块是风险质量：损失率、逾期行为、欺诈成本，以及
              treasury 或 credit
              扩张是否引入会压缩回报的营运资金或合规负担。第四块是股权结构表质量：优先股堆叠、员工行权价敏感性，以及任何会让表面头条估值对新钱不那么相关的条款。在这些问题得到回答前，投资逻辑破裂判断应保持简单。又一轮平轮或下轮融资、单位经济性疲弱证据，或证明
              treasury 和 credit 扩张增加复杂度的速度快于变现的证据，都会把案例推向回避。相反，经审计的持久增长和经济性改善证据，会让当前标记从偏高走向合理。
