      - number: '1.3'
        title: 融资历史与 2021 年后的估值重置
        blocks:
          - type: paragraph
            body: >-
              Pleo 的融资历史在标题层面很容易讲清，但当前所有权细节很难钉住。公司在 2021 年 7 月公开宣布 $150m Series C，估值 $1.7bn，由 Bain Capital Ventures 和
              Thrive Capital 共同领投；随后在 2021 年 12 月宣布 $200m 延期轮，使整轮融资达到 $350m、估值
              $4.7bn。这两次公告仍是公开记录中最后两个清晰的股权定价事件。此后，公司新增的是债务，而不是新的定价股权轮。2024 年 5 月，Pleo 披露 €40m HSBC Innovation Banking
              额度，用于扩展其信贷产品和透支覆盖。


              从定价股权转向债务，正是 Kinnevik 估值标记现在如此重要的原因。在 2024 年 Q4 年终公告中，Kinnevik 将其 14% Pleo 持股估值为 SEK 2,445m，低于一年前的 SEK
              3,293m；同时它仍称 Pleo 已达到 EUR 140m 收入运行率，增速为 SaaS 基准的 2-3x，且毛利率高于平均水平。Tech.eu 将这一标记解读为 Pleo 隐含估值约
              $1.62bn。尽调信息很关键：运营动能可能已经改善，但外部定价还没有回到 2021 年峰值。


              因此，当前阶段最适合理解为：后期未上市公司，产品宽、投资人质量高，但最近没有一轮市场出清的股权融资。投资者仍能从公开来源识别主要支持方和债务提供方，却无法可靠推断当前所有权、清算优先权压力或董事会控制权。
