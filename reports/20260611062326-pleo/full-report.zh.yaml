      - number: '5.2'
        title: 技术姿态最强处在会计集成，API 范围克制但较窄
        blocks:
          - type: paragraph
            body: >-
              本章最有说服力的技术证据不在营销网站，而在开发者文档。Pleo 明确把自己定位为预会计平台，为 ERP 和会计系统准备不可变、可入账数据，而不是试图替代总账。这个边界健康，因为它把架构野心收缩到 Pleo
              有可能做好的工作流：采集支出、应用政策、映射字段、导出干净记录，并保留清晰审计轨迹。文档描述了一套面向合作伙伴的栈，围绕 REST、JSON、OpenAPI、OAuth 或 API
              keys、导出任务、webhook 触发器、附件、入账行为和公司范围会计边界搭建。这是真实的集成基础设施，不是含糊的“我们能接一切”主张。取舍也同样清楚：Pleo 的 API
              模型有纪律，而不是无限开放。多实体支持采用严格公司隔离，原生集成深度在端点之间也不一致。Xero 看起来深入且运营成熟；QuickBooks 明显更薄。因此，Pleo
              在财务系统集成上技术可信，但还不是开放产品生态式的宽开发者平台。
