      - number: '6.3'
        title: 满意度和扩张信号存在，但大多只是代理指标，而非披露的留存指标
        blocks:
          - type: paragraph
            body: >-
              公开非公司佐证在应用商店和评价页面上最强。Xero App Store 显示，Pleo 上架时间较长，有 128
              条已验证用户评价，评分接近五星；客户评论明确称赞月末关账更快、记账更容易、银行卡控制更简单。Trustpilot 提供规模和混合情绪：总体评价基数大，许多评价者称赞支持和欺诈案例处理，也有人称 Pleo
              显著减少行政工作；但一星记录同样显示，响应时间、卡访问、收据匹配和支持升级存在有意义摩擦。这些负面信号重要，因为它们暴露了公司案例研究天然会淡化的运营失效模式。


              扩张信号存在，但仍大多是间接的。Kinnevik 称 ARPA 会随客户提高使用量而上升；OpenView 描述了一条 bow-tie 客户旅程，用价值实现时间、粘性功能采用、流失 ARR 和扩张 ARR
              管理；产品证据显示客户可以从银行卡扩展到报销、发票、订阅、多实体控制，如今还包括现金管理。Nordic Fintech 又加入了 Embedded
              的公司口径合作伙伴指标，暗示嵌入后支出和参与度提高。合起来看，这支持一个真实的落地并扩张故事。它没有给出的，是投资者理想上要承销的硬留存数学：没有公开 GRR、NRR、续约队列、合同期限或按细分市场拆分的流失。
