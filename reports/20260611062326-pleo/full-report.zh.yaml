      - number: '4.2'
        title: GTM 动作、牵引信号与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Pleo 的获客模型已不再只是销售驱动。OpenView 描述其从历史上偏重销售，转向自下而上的产品驱动增长、自上而下销售和客户成功的组合，并明确希望把 CAC 回本周期压到约 12
              个月。这在方向上令人鼓舞，但它仍是代理指标，而不是当前运营 KPI，因为 Pleo 不披露已实现
              CAC、按渠道拆分的回本周期或全口径获客成本。投资者能看到的，是转化和入职效率的间接迹象。客户故事描述快速实施、即时记账集成、减少追发票收据，以及财务行政明显下降，这些都指向粘性工作流和 SMB
              客户不错的价值实现速度。


              分发也在直接销售之外扩展。咨询合作伙伴计划提供客户折扣和 15% 收入分成；Nordic Fintech 描述的嵌入式战略，则瞄准已经拥有可信客户关系的会计 SaaS 厂商和 PSP。Nordic Fintech
              报道的合作伙伴指标，包括嵌入后更高支出和强劲月活使用，来自公司口径，不应当作经审计经济性。即便如此，它们仍支持一个可信渠道逻辑：Pleo
              或许能通过顾问和平台合作伙伴降低部分入职摩擦、扩大分发，尽管已实现渠道利润率和回本周期仍属私有信息。
