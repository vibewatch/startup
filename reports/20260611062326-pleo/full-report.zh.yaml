      - - 欧盟交换费上限
        - 约束
        - 结构性
        - Sacra 对借记卡 0.2% 与信用卡 0.3% 上限的分析
        - 推动货币化转向订阅和钱包份额扩张，而不是纯卡经济性
        - 要求拆分软件、交换费与新金融产品的贡献利润率
      - - 分地域分阶段推出司库
        - 约束
        - 当前
