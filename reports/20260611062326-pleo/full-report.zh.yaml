      - number: '2.3'
        title: 买方、用户和付费方地图：采用由财务牵头，但不只属于财务
        blocks:
          - type: paragraph
            body: >-
              买方链条会随公司复杂度上升而变化。在极小企业里，创始人、办公室经理和预算负责人可能还是同一个人。一旦公司有分散持卡人、多级审批人或结账压力，工作流就转向财务负责人，通常是 controller、财务经理或
              CFO，员工则仍是日常用户。Pleo 自身定位和 OpenView 文章都显示，企业想要更干净的入职、审批路由和直接会计集成，而不是另一套手工报销流程时，就会采用这类产品。Pleo、Payhawk 和
              Spendesk 的定价与包装也显示，变现跟随组织复杂度：多实体控制、预算、审批、ERP 或 HRIS 附加项、采购订单工作流，会随着团队支出去中心化而更有价值。嵌入式分发又增加了第二类买方：通过会计平台和
              PSP 销售，而不是只靠直接获取 SMB。
