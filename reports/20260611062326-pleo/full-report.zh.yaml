        - 公开警示或私有欺诈指标
        - 重复出现冒充通知、误报上升，或任何显示欺诈损失对客户造成重大影响的证据
        - 假设运营杠杆弱于计划，并下调扩张论点
      - - 运营可靠性下滑
        - 状态页和客户投诉
        - 可用性恶化、集成事件反复出现，或围绕卡片和对账的支持摩擦增加
        - 将留存和扩张假设视为过于乐观
      - - 投诉处理恶化
        - 投诉响应时限
        - 严重违反已发布的 15 个工作日响应时钟，或 Ombudsman / 监管升级增加
        - 将行为风险从可控视为转向重大
      - - 竞争压缩
        - 定价 / 赢单率 / 评论情绪
        - 竞争对手补齐产品广度和安全主张，而 Pleo 的客户导入更慢、集成质量更弱，或折扣更重
        - 在任何投资案例中下调 ARPA 和利润率假设
    notes: 这些阈值是锚定公开公司、监管机构和评论界面的分析性监控规则，而不是管理层指引。
