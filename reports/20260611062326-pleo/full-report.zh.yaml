  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 买方、用户和付费方分布较宽，但核心仍是财务牵头的 SMB 和中端市场控制问题
        blocks:
          - type: paragraph
            body: >-
              公开客户记录指向的是横向支出管理产品，而不是垂直小众工具。官方和第三方来源把 Pleo 放在 16 个欧洲市场、40,000+ 到约 45,000 客户的规模上；OpenView
              则描述其服务从创业公司到中端市场的企业，并明确称 SMB 是核心基本盘。来源集中反复出现的模式是：财务买方或 controller 做推动者，运营员工做日常用户，公司本身做付费方。这个模式出现在 Toonen
              Reizen 和 Cooltra 的现场团队、Humaans 和 Paired 的知识工作团队、IDTV 的重制作媒体场景、Bonzer 这样的多实体机构，以及 Biochem 和 Podimo
              等更大的跨境组织中。


              因此，客户基础按垂直行业和工作流看是多元的，但按公司形态看并非完全中性。大多数证据仍聚集在深度关心分散支出、差旅、订阅、发票处理和快速记账导出的企业上。实践中，财务负责人、controller
              和运营经理是最可见的买方；员工、自由职业者和部门负责人则是最可见的用户。Xero、Zapier 和 Embedded 证据进一步显示，Pleo
              的胜出部分来自嵌入客户已经信任的系统，而不是强迫客户采用全新的财务栈。可支撑的读法是：细分市场适配较宽，重心强烈落在财务牵头的 SMB 和中端市场运营上，但还没有深度企业集中度的硬证据。
