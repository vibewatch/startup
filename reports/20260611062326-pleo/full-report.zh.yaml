  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型、定价表面与变现组合
        blocks:
          - type: paragraph
            body: >-
              承销 Pleo 时，应把它看作软件加金融轨道混合业务，而不是纯支出卡发行商，也不是干净的 SaaS 订阅公司。Kinnevik 的组合公司介绍和 OpenView
              的运营画像都描述了两条核心收入轨道：来自软件平台的订阅收入，以及客户使用 Pleo
              卡时产生的支出相关收入。官方定价进一步显示，订阅层真实且有结构：四个公开层级、付费计划按用户收费、发票付款费、报销费、现金返还激励，以及逐步放大的授信额度。这很重要，因为标价证明公司有经常性收入意图和明确的使用变现；如果客户把更多支出沉入平台，银行卡轨道还会带来活动相关上行。


              收入组合也在变宽。官方现金管理材料显示，Pleo 试图靠关联银行账户、子账户、转账规则、多币种余额和闲置现金收益，获取更多司库钱包份额。如果这些功能提高 ARPA
              和留存，模型会更有吸引力；但它们也让外部更难读懂经济性，因为公开材料没有拆分已实现软件收入、交换费、支付费用、信贷收入或司库收益。正确结论不是模型弱，而是公开证据证明多种变现表面存在，但它们之间的已实现组合仍不透明。
