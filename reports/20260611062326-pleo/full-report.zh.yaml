  - id: TP001
    title: 竞品画像表
    columns:
      - 厂商
      - 主要 ICP / 地理范围
      - 公开规模或融资信号
      - 产品重心
      - 相比 Pleo 的突出点
      - 留存来源中最可见的局限
    rows:
      - - Pleo
        - 聚焦欧洲的 SMB 与中端市场团队；多实体和多币种买方路径
        - 欧洲 40,000+ 家公司
        - 卡、AP、报销、审批、集成与支出控制
        - 同业中公开标价最透明；欧洲优先的信任姿态
        - 相比 Payhawk 或 Ramp，旅行、采购和更广 CFO 套件宽度的公开证据更少
      - - Spendesk
        - 采用采购加支出控制的欧洲财务团队
        - 5,000+ 个财务团队和 12K+ CFO Connect 社区
        - 采购加支出管理，包含卡、AP 与多实体增购
        - 采购和财务社区角度强于 Pleo
        - 报价主导定价降低了实际入门成本的公开透明度
      - - Payhawk
        - 跨欧洲和北美的多实体、全球分布式财务团队
        - 多办公室领导足迹与投资人支持的董事会页面
        - 横跨卡、AP、采购、旅行、预算和电子发票的财务编排
        - 企业级和跨境控制模型比 Pleo 更宽
        - 公开定价模块化且以报价为主，完整宽度被复杂度门槛锁住
      - - Moss
        - 现代 SMB 财务团队，尤其是愿意接受模块化定价的买方
        - 首页显示 7,000+ 家公司；定价页引用 10,000+ 家欧盟企业
        - 卡、AP、报销、AI 预会计与集成
        - 取消按用户定价，降低相对 Pleo 的席位成本异议
        - 公开来源没有显示与 Pleo 或 Ramp 客户数同等级的泛欧洲品牌信号
      - - Soldo
        - 覆盖小型、中型和企业级客群的去中心化支出买方
        - 网站可见金融服务所有权与受监管 EMI 披露
        - 去中心化支出、采购和受控卡，叠加软件与金融基础设施
        - 自有金融服务姿态和行业分层强于 Pleo 的公开信息
        - 已发布定价仍不够一眼看清，因为订阅和金融服务费用分拆
      - - Ramp
        - 大型全球企业与以美国为锚点、向国际扩张的财务团队
        - 70,000+ 家企业；免费和付费计划公开发布
        - 卡、AP、采购、旅行、司库和 AI 智能体
        - 进入者中产品宽度最激进，公开规模信号最强
        - 留存来源显示全球覆盖，但没有按 Pleo 的语境证明欧洲本地定位或本地品牌信任
      - - Brex / Airbase-Paylocity
        - Brex 面向全球卡主导支出；Airbase-Paylocity 面向 100-5,000 名员工的中端市场运营方
        - Brex 发布全球发卡覆盖；Airbase 拥有 500+ 客户，Paylocity 可触达近 40,000 名客户
        - Brex 强调卡控制和全球项目；Airbase 在 Paylocity 内加入工资加支出捆绑
        - 来自 Capital One 和 Paylocity 分发的强资产负债表或渠道杠杆
        - 留存来源未证明欧洲中端市场采用深度
    notes: 覆盖范围是部分的，并有意聚焦最可能出现在欧洲 SMB 或中端市场支出管理采购流程中的厂商，而非完整全球费用软件宇宙。
