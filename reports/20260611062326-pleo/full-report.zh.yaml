      - number: '4.3'
        title: 成本结构、利润率路径与资本强度
        blocks:
          - type: paragraph
            body: >-
              外部最强的利润率质量正向信号来自 Kinnevik。它称 Pleo 在 2024 年的增速是上市 SaaS 基准的两到三倍，同时维持高于平均水平的毛利率。这个信息有用，但仍不完整，因为 Kinnevik 和
              Pleo
              都没有发布按收入流拆分的毛利率桥。即使没有完全量化，底层成本图景也容易在概念上勾勒。订阅收入应相对有吸引力，但欧洲交换费经济性有结构性上限，支付处理和客户支持消耗现金，司库或现金管理产品又需要银行连接、FX
              处理和持续基础设施。信贷和透支功能再加一层：它们可能加深变现，但也引入纯软件公司不承担的资金和风险管理成本。


              Pleo 新产品表面让利润率路径更有意思，也更复杂。现金管理承诺零 FX 本币支出、自动化流动性转移和闲置现金收益；Taktile 合作则显示，随着交易复杂度上升，公司在实时欺诈和 AML
              工具上投入。即时支付及相关欧洲支付规则，会给扩展支付功能的 EMI 或 PI
              运营商增加更多合规工作。简言之，这门生意看起来仍比放贷机构或硬件公司更轻资本，但它不是无成本软件。利润率路径可能随规模和更深产品采用改善，但仍绑定在合规、支付基础设施和资金纪律上，而公开披露尚未完全量化这些关系。
