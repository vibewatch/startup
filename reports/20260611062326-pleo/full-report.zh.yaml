      - number: '3.2'
        title: 能力、定价与控制模型：最尖锐差异在包装和运营姿态，而不是基础功能
        blocks:
          - type: paragraph
            body: >-
              Pleo 的公开定位仍像一个欧洲优先的支出平台：价格表透明，工作流栈由财务牵头。定价页列明 Essential、Advanced 和 Beyond 的月度平台费与额外用户收费；发票和集成页面显示审批工作流、50
              多种货币的供应商付款，以及标准会计或 HRIS 连接。相比报价驱动的 Spendesk 和 Payhawk，以及 Soldo 订阅加独立金融服务费用的组合，这种透明度并不常见。Moss
              是最明显的欧洲反例：它取消按用户收费，改收平台费加交易费，并为小团队提供免费入门层。


              但产品宽度正在离开 Pleo 的核心重心。Spendesk 强力延伸到采购和多实体增购。Payhawk 销售更宽的企业栈，包含差旅、采购、AI agents、EU eInvoicing 和专用 IBAN
              付款。Ramp 和 Brex 在银行卡与 AP 之上增加司库或全球发卡叙事。Airbase 被 Paylocity
              收购后的表述更进一步，把薪资和非薪资支出放进一个运营模型。对买方而言，实际含义是大多数供应商现在都能越过银行卡、AP
              和控制的最低门槛。更难的选择问题在于：需要支持多少企业复杂度，欧洲本地信任与结算是否比全球宽度更重要，以及买方更偏好透明自助定价还是协商式捆绑经济。
