  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Pleo 现在更像统一财务工作流，而不只是银行卡产品
        blocks:
          - type: paragraph
            body: >-
              Pleo 的公开产品表面已经足够宽，应把它视为统一的 SMB 财务工作流，而不是狭义公司卡工具。定价和功能页面显示，银行卡、费用采集、应付账款、报销、审批、供应商卡和记账集成都属于核心产品；多实体、HRIS、AI
              审核、采购订单和子账户则叠加在更高层级。这很重要，因为买方真正要完成的任务不是“发一张卡”，而是“让员工能花钱，守住政策控制，附上凭证，转移资金，并在不增加行政负担的情况下关账”。报销和 AP
              页面把这套工作流讲得很明确：OCR、审批路由、重复检查、付款排程和下游同步都在同一个运营模型里。从这个意义上说，Pleo
              相对点状方案最强的产品论点是工作流压缩。财务团队可以把银行卡、报销、发票处理和记账准备放在一处，而不是拼接独立的卡、报销和 AP 工具。
