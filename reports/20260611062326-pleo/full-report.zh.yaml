  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 乐观逻辑
      - 反向逻辑
      - 什么会改变观点
    rows:
      - - 规模证明
        - Pleo 有 >40,000 名客户、800+ 名员工，以及 >€140m 收入运行率证据。
        - 最新外部标记仍比 2021 年峰值低约 65%，所以规模本身尚未修复价格。
        - 展示经审计的 2025 年规模留存，以及高于成熟上市参照的耐久增长。
      - - 变现广度
        - 订阅、支出挂钩收入、发票、报销、现金管理和信贷带来钱包份额上行。
        - 公开证据未披露各轨道已实现收入结构、利润率或损失率。
        - 提供按收入流拆分的收入和毛利率，以及信贷表现。
      - - 溢价可比案例
        - TravelPerk 表明，规模化一体化差旅和费用工作流仍可能获得高溢价私有市场估值。
        - 模型适用的公开支付和工作流参照，交易估值远低于 Pleo 的隐含标记。
        - 证明 Pleo 在增长和质量上更接近高溢价私有可比，而不是公开可比。
      - - 护城河和竞争
        - 产品广度可以随着时间推高粘性和单账户平均收入。
        - 竞争对手定价页显示功能快速趋同，限制独特性溢价。
        - 展示留存、NRR 和附加率证据，证明广度加深经济性，而不只是扩大产品路线图。
