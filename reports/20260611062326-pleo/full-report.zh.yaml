        - id: n3
          label: 辅助式上手
          detail: 博客故事反复提到，在 ERP 指导和低摩擦设置下，部署只需数天到数周。
        - id: n4
          label: 员工日常使用
          detail: 员工、自由职业者和经理在生产环境中使用卡、票据采集、报销和发票工作流。
        - id: n5
          label: 财务控制和关账
          detail: 实时可视性、审批、充值和导出缩短月末关账，并减少手工行政工作。
        - id: n6
          label: 扩张与背书
