      - number: '8.2'
        title: 投资逻辑可信，但可比公司视角说明溢价必须持续挣出来
        blocks:
          - type: paragraph
            body: >-
              Pleo 的正面案例，从公开证据里很容易看见。Kinnevik 的公司页面和 Pleo
              自己的定价、产品页面显示，这家公司已经不只是一个狭窄的费用卡应用。收入模型混合了订阅和与支出挂钩的经济性，平台现在覆盖发票、报销、虚拟卡、现金管理、集成和信用功能。这种宽度重要，因为它创造了一个可信的钱包份额故事：客户采用更多工作流后，单账户平均收入可以上升。问题是，Pleo
              已经不再真空竞争。Payhawk、Spendesk、Moss、Soldo 和 Ramp 的定价页面都在营销重叠模块，这意味着仅靠功能扩张不能证明估值溢价合理。因此，可比公司视角很关键。TravelPerk
              2025 年以超过 $200 million 年化收入完成 $2.7 billion
              融资，说明同时具备增长和盈亏平衡经济性的综合财务或差旅费用平台，仍能拿到溢价私有估值。公开市场中模型更贴近的参照则更残酷：WEX、Marqeta、Payoneer 和 Corpay 按简单市值 /
              收入口径看低得多。这个差距不能证明 Pleo 被高估，但确实意味着，当前标记仍然假设 Pleo 应该更接近高溢价私有可比公司，而不是公开支付软件群体。
