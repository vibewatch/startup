  - id: TP005
    title: 护城河耐久度与竞争风险登记表
    columns:
      - 护城河主张
      - 当前支撑
      - 主要威胁
      - 严重性
      - 当前判断
      - 尽调要求
    rows:
      - - 欧洲优先的信任与运营适配
        - Pleo 的欧洲覆盖、FCA 披露和本地定价姿态
        - 美国进入者把发卡方、实体和结算本地化的速度快于预期
        - 高
        - 优势真实存在，但容易被资本充足的进入者本地化削弱
        - 要求按国家提供与 Ramp、Brex 和 Payhawk 的赢单 / 输单数据
      - - 透明定价降低采购摩擦
        - 公开层级让第一轮评估更容易
        - 报价驱动的竞品可能在更大、多实体交易中谈出更好条件
        - 中
        - 对 SMB 和低端中端市场有帮助，在企业市场不够耐久
        - 要求按细分客群提供实际折扣和打包灵活性
      - - 集成层创造粘性
        - 会计与 HRIS 钩子，加上已配置的审批和供应商付款
        - 竞品越来越多披露可比的 ERP、HRIS 和 API 深度
        - 高
        - 运营上有粘性，但并不独特
        - 要求按系统提供集成挂载、激活和流失数据
      - - 产品宽度继续从核心支出任务外扩
        - Pleo 已覆盖卡片、AP、报销和审批
        - 同业更快打包采购、差旅、资金管理和薪资相邻工作流
        - 高
        - 宽度是必要条件，不是充分条件
        - 要求按模块提供产品挂载率和交叉销售路线图经济性
      - - 监管与支付通道自有度可改善控制经济性
        - Pleo 和 Soldo 均显示受监管金融服务基础
        - 拥有银行或母公司资产负债表的竞争者可能用更好激励或覆盖砸开市场
        - 中高
        - 有用，但不独占
        - 要求拆分软件、卡组织交换费和支付通道的贡献毛利率
      - - 品牌和存量客户可防守份额
        - 40,000+ 客户意味着欧洲规模已有分量
        - 估值重置说明品类定价权并不确定
        - 高
        - 规模重要，但不能证明护城河耐久
        - 要求提供队列留存、扩张和赢回数据
    notes: 严重性反映承销相关性，而非确定性；本表有意区分已有证据支撑的当前基础，以及要判断护城河是否耐久仍需完成的尽调工作。
