  - id: TV005
    title: 投资逻辑失效与终止触发表
    columns:
      - 触发项
      - 门槛 / 信号
      - 重要性
      - 行动含义
    rows:
      - - 新融资结果
        - 相比 Kinnevik 隐含的 2024 年 Q4 标记持平或下调
        - 说明当前外部标记可能不够保守。
        - 从继续研究转向回避，除非条款保护性异常强。
      - - 增长放缓
        - 有证据显示增长不再明显快于上市工作流 / 软件参考公司
        - 会削弱给予溢价倍数的理由。
        - 下调任何溢价倍数假设。
      - - 再投资没有回报
        - 2025 年产品或市场投入拖住利润率，却看不到变现改善
        - 会破坏「现在投入、日后受益」的过渡逻辑。
        - 将情景权重转向悲观情景。
      - - 信用或资金管理压力
        - 损失、融资依赖或合规拖累出现反向数据
        - 会提高资本强度，降低盈利质量。
        - 将资金管理或信用上行视为中性或负面。
      - - 功能趋同叠加价格压力
        - 同业补齐 Pleo 的产品宽度，却没有证据显示留存或 ARPA 更好
        - 会压低护城河溢价，削弱附加率上行。
        - 估值重回接近上市支付 / 工作流参考公司的水平。
    notes: 这些触发项聚焦公开或尽调可观察信号，因为最重要的隐藏指标仍未公开。
