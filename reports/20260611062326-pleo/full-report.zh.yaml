      - number: '5.3'
        title: 司库、现金管理和 Embedded 是主要扩张楔子
        blocks:
          - type: paragraph
            body: >-
              产品已经明显走出传统费用管理。信贷和靠近司库的功能在 2024 年已通过 Overdraft 和 HSBC 支持的信贷额度扩张；到 2025
              年英国和德国的现金管理发布后，这些能力更具体。公开发布报道描述了一款产品：连接银行账户和 Pleo
              账户，应用转账规则，支持多币种余额和银行卡，并把流动性管理定义为工作流问题，而不是银行门户问题。这个相邻扩张可信，因为 Pleo
              自身司库研究指出了底层痛点：跨实体可见性弱、工具太多、回退到电子表格，以及强烈希望拥有账户和货币的单一视图。Embedded 是第二个主要楔子。这里的逻辑由分发驱动：Pleo 不必直接赢下每一个
              SMB，而是希望让银行、PSP
              和会计平台把支出和现金管理嵌入各自产品。如果这个渠道跑通，它会扩大触达，而不只依赖直接销售。需要谨慎的是，公开合作伙伴经济性仍大多来自公司口径，因此战略上行清晰，但经验证据还不完整。
