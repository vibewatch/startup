evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-composition
    missingEvidence: A current board roster with investor-seat allocation, committee structure and any observer rights.
    whyItMatters: >-
      Company-overview governance risk is hard to score without knowing who currently controls board decisions and
      oversight levers.
    diligencePath: >-
      Request the latest board deck cover, corporate governance memo or cap-table summary with board and observer
      assignments.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A single dated headcount figure covering full-time employees and contractors.
    whyItMatters: Official Pleo pages show both 800+ and 900+ employees, which makes current operating-scale comparisons imprecise.
    diligencePath: Ask management for the latest people dashboard or board KPI pack with month-end employee counts by office.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
      - TO002
  - type: private-evidence-only
    severity: material
    topic: active-customers
    missingEvidence: >-
      A current active-customer definition and count rather than a marketing floor of 40,000+ or a third-party estimate
      of about 45,000.
    whyItMatters: >-
      Customer count is a cover metric and helps interpret monetization efficiency, expansion room and market leadership
      claims.
    diligencePath: Request the latest board KPI snapshot with paying customers, active cards and net adds by country.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: >-
      Post-2021 ownership percentages, preference stack detail and any material secondary transfers after the Series C
      extension.
    whyItMatters: >-
      The investor map can identify key stakeholders but cannot quantify control, liquidation preference exposure or
      dilution without internal records.
    diligencePath: Request the latest cap table, financing documents summary and any debt covenants tied to the HSBC facility.
    relatedQuestionRefs:
      - QO013
      - QO014
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: minor
    topic: cash-management-unit-economics
    missingEvidence: Adoption, attach-rate and contribution-margin data for cash management, overdraft and embedded products.
    whyItMatters: >-
      The overview can verify launch activity, but not whether adjacent products materially improve growth quality or
      margin profile.
    diligencePath: Request product P&L, attach-rate metrics and cohort economics for treasury, credit and embedded offerings.
    relatedQuestionRefs:
      - QO008
      - QO021
      - QO022
    relatedTableRefs:
      - TO004
      - TO005
  - type: missing-source
    severity: minor
    topic: ipr-readiness
    missingEvidence: A company-specific implementation roadmap showing how Pleo will meet 2027 instant-payments obligations as an EMI.
    whyItMatters: >-
      External legal texts establish the deadline, but they do not show whether Pleo's product and compliance teams are
      on track.
    diligencePath: >-
      Request product, compliance or board materials covering verification-of-payee, sanctions-screening and SCT Inst
      readiness.
    relatedQuestionRefs:
      - QO019
      - QO020
    relatedTableRefs:
      - TO005
      - TO006
  - type: missing-source
    severity: material
    topic: sam-denominator
    missingEvidence: >-
      A country-level employer or multi-user SME count for the 16 European markets Pleo actually serves, ideally with
      filters for firms large enough to need collaborative spend controls.
    whyItMatters: >-
      Without the right denominator, any SAM or penetration math either overstates reach by using all SMEs or
      understates it by using too narrow an operational slice.
    diligencePath: >-
      Ask management for served-country customer mix and the internal TAM worksheet they use for employer or multi-user
      SMB targeting; pair that with Eurostat structural business statistics exports.
    relatedQuestionRefs:
      - QM007
      - QM024
    relatedTableRefs:
      - TM002
      - TM005
  - type: private-evidence-only
    severity: material
    topic: euro-market-value
    missingEvidence: >-
      A euro-denominated TAM or SAM built on a market definition that matches spend control plus AP and reimbursements,
      rather than broad finance-software or payments pools.
    whyItMatters: >-
      Publishing a value TAM without a matched scope would overstate precision and can materially distort valuation
      framing.
    diligencePath: >-
      Request management TAM materials or a paid analyst cut with identical market boundaries, then reconcile it to the
      account-count lens used in this chapter.
    relatedQuestionRefs:
      - QM008
      - QM024
    relatedTableRefs:
      - TM002
      - TM005
  - type: private-evidence-only
    severity: material
    topic: customer-mix-and-attach
    missingEvidence: >-
      Customer counts by segment, geography and product attach for AP, multi-entity, cash management and embedded
      distribution.
    whyItMatters: >-
      Those splits determine whether Pleo is mainly a cards-and-expenses product today or already monetising the broader
      finance-automation wedge that would justify a larger SAM.
    diligencePath: >-
      Request cohort-level customer mix, add-on attach rates, channel mix and expansion revenue by product from
      management.
    relatedQuestionRefs:
      - QM014
      - QM015
      - QM024
    relatedTableRefs:
      - TM003
      - TM005
  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing-discounting
    missingEvidence: >-
      Realized deal-level discounting, contract length and module bundling for Spendesk, Payhawk, Soldo and larger Pleo
      deals.
    whyItMatters: >-
      Public list or quote posture alone does not show whether Pleo is winning on price, margin discipline or enterprise
      flexibility.
    diligencePath: Request recent redlined quotes, order forms and approval thresholds for 10+ wins and losses by segment.
    relatedQuestionRefs:
      - QP023
  - type: missing-source
    severity: material
    topic: us-entrant-europe-depth
    missingEvidence: >-
      Verified local European volume, customer count and on-the-ground operating depth for Ramp and Brex beyond
      marketing coverage claims.
    whyItMatters: >-
      Coverage maps and currency claims do not prove that U.S. entrants already have the local density needed to
      displace Pleo in Europe today.
    diligencePath: >-
      Request country-level customer logos, issued-card counts, local issuer relationships and Europe-specific GMV or
      transaction mix.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: blocking
    topic: pleo-win-loss-moat
    missingEvidence: >-
