  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Pleo is a Copenhagen-founded, late-stage private spend-management fintech that now spans cards, expenses, accounts payable, treasury-adjacent cash management and embedded distribution across Europe. Official surfaces still support a 40,000+ customer and 16-country footprint, while Kinnevik's Q4 2024 mark and tech.eu's implied valuation show how far external pricing has reset from the 2021 $4.7bn peak. The current diligence picture is therefore one of broad product breadth and regulated operating capability, but with unresolved questions around exact current headcount, active-customer count and post-2021 ownership detail."
  },
  "sections": [
    {
      "id": "identity-product-and-commercial-model",
      "title": "Identity, product scope and commercial model",
      "body": "Pleo presents itself as a European business-spend platform rather than a narrow card issuer. Official company pages position the product around smart company cards, expense capture, invoice processing, reimbursements and integrations into finance systems, while the pricing page shows that product access is intentionally tiered from Starter through Beyond. That structure matters because it suggests a software-led monetization model with feature upsell, not just a payments-margin story. Kinnevik's company overview reinforces that read by describing two revenue streams: SaaS subscription fees and spend flowing through customer cards.\n\nThe identity story is well supported on official pages. Pleo says it was founded in Copenhagen in 2015 by Jeppe Rindom and Niccolo Perra, both former Tradeshift operators. The official footprint today is 40,000+ companies across Europe and 16 countries, with offices across Copenhagen, London, Berlin, Stockholm, Madrid, Lisbon, Paris, Amsterdam and Chennai. The only meaningful ambiguity is headcount: the about page says 800+ employees while the press page says 900+, so the safest current framing is an 800-900+ range rather than a single point estimate. That is still enough to classify Pleo as a late-stage private fintech with meaningful operating scale, but not enough to produce a precise cover metric without management data.\n\nProduct breadth is also visible at the workflow level. Official pages say Pleo can issue virtual cards instantly, reimburse employee out-of-pocket claims, automate OCR-driven invoice handling and connect to accounting and HR systems such as Xero, NetSuite, QuickBooks, SAP SuccessFactors and BambooHR. The help centre adds that multi-currency accounts now support six currencies, showing that the product is moving beyond classic expense management into treasury-adjacent operating cash controls.",
