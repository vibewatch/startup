    {
      "id": "leadership-governance-and-regulatory-footing",
      "title": "Leadership, governance and regulated operating footing",
      "body": "Pleo remains visibly founder-shaped. The official about and press materials still anchor the company narrative around Jeppe Rindom and Niccolo Perra, and the July 2021 fundraising announcement showed governance expanding rather than professional management displacing the founders: Bain Capital Ventures partner Keri Gohman joined the board as part of the Series C. Later product-expansion communications around credit and treasury capabilities also highlight named functional leaders such as Amit Kahana. Taken together, those sources support a reasonable inference that key-person dependence is still material even though Pleo is no longer an early-stage startup.\n\nThe regulated footing is stronger than many software-only spend tools. The EBA-linked payment institutions register records Pleo Financial Services ApS as a Danish electronic money institution authorised since 30 November 2018 for payment-card execution, direct debits, credit transfers and payment-instrument issuance. Official company pages also say Pleo Financial Services UK Ltd is authorised by the FCA under the Electronic Money Regulations 2011 with firm reference number 1020730. That combination matters because it gives Pleo more direct control over payment functionality and helps explain why the company can expand into adjacent treasury and payment workflows rather than remaining a thin software layer above third parties.\n\nSecurity and compliance disclosures are directionally solid but still high level. Pleo says customer data is stored in AWS infrastructure in Ireland, with encryption, role-based access controls and MFA for sensitive environments. The missing piece is governance transparency: public materials do not provide a full current board roster, committee structure or seat allocation by investor. That does not break the chapter, but it limits how confidently the board and control story can be scored without internal materials.",
