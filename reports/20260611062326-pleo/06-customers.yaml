figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Public evidence suggests Pleo wins by meeting finance-led buyers at a control problem, activating employees quickly, then expanding into adjacent workflows and entities.
  data:
    nodes:
    - id: n1
      label: Finance pain discovered
      detail: Controllers and operators notice receipt chasing, reimbursement lag, or weak spend visibility.
    - id: n2
      label: Evaluation in existing stack
      detail: Prospects compare tools based on accounting integration, support, and usability rather than card issuance alone.
    - id: n3
      label: Assisted onboarding
      detail: Blog stories repeatedly cite days-to-weeks deployment with ERP guidance and low-friction setup.
    - id: n4
      label: Daily employee usage
      detail: Employees, freelancers, and managers use cards, receipt capture, reimbursements, and invoice workflows in production.
    - id: n5
      label: Finance control and close
      detail: Real-time visibility, approvals, top-ups, and exports shorten month-end and reduce manual admin.
    - id: n6
      label: Expansion and advocacy
      detail: Accounts add modules, entities, integrations, or partner-distributed workflows and leave reviews or references.
  approximationNotes: This journey map abstracts repeated patterns across official cases, Xero reviews, and PLG commentary; it is not a measured funnel conversion dataset.
