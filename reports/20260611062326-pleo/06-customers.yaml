company:
  name: Pleo
chapter:
  number: 6
  title: Customers
  summary: Public evidence supports broad horizontal adoption across European SMB and mid-market finance teams, with named customer stories showing repeated admin savings, stronger spend control, and multi-entity rollout across sectors from nonprofits to biotech and media. Independent corroboration exists through Xero’s verified-app reviews and Trustpilot’s large review corpus, but retention and concentration remain the weakest areas because Pleo does not publicly disclose GRR, NRR, contract tenure, or top-customer exposure and much of the named proof is still marketing-led.
sections:
- id: segments-buyers-and-adoption-surface
  title: Buyer, user, and payer segments are broad, but still centered on finance-led SMB and mid-market control problems
  body: 'The public customer record points to a horizontal spend-management product rather than a niche vertical tool. Official and third-party sources place Pleo at 40,000+ to roughly 45,000 customers across 16 European markets, while OpenView describes the business as serving companies from startup to midmarket and explicitly calls SMB the bread-and-butter segment. The recurring pattern across the source set is a finance buyer or controller champion, operational employees as day-to-day users, and the company itself as payer. That pattern shows up in field teams at Toonen Reizen and Cooltra, knowledge-work teams at Humaans and Paired, production-heavy media at IDTV, multi-entity agencies like Bonzer, and larger cross-border organisations such as Biochem and Podimo.


    The customer base is therefore diversified by vertical and workflow, but not fully neutral by company shape. Most proof still clusters around businesses that care deeply about distributed spending, travel, subscriptions, invoice handling, and fast bookkeeping exports. In practice that means finance leaders, controllers, and operations managers are the most visible buyers, while employees, freelancers, and department heads are the most visible users. Xero, Zapier, and Embedded evidence further suggest that Pleo wins partly by fitting into systems customers already trust instead of forcing a net-new finance stack. The supportable read is broad segment fit with a strong center of gravity in finance-led SMB and mid-market operations, not yet hard proof of deep enterprise concentration.'
