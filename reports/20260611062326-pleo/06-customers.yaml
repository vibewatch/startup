- id: satisfaction-repeat-usage-and-expansion
  title: Satisfaction and expansion signals exist, but they are mostly proxies rather than disclosed retention metrics
  body: 'Public non-company corroboration is strongest in app-store and review surfaces. Xero’s App Store shows a long-tenured listing, 128 verified-user reviews, and a near-five-star score, with customer comments explicitly praising faster month-end close, easier bookkeeping, and simpler card control. Trustpilot contributes scale and mixed sentiment: the aggregate review base is large, many reviewers praise support and fraud-case handling, and some reviewers say Pleo materially reduces admin, but the one-star record also shows meaningful friction around response times, card access, receipt matching, and support escalation. Those negative signals matter because they reveal the operational failure modes that company case studies naturally underplay.


    Expansion signals are present, but they are still mostly indirect. Kinnevik says ARPA rises as customers increase usage, OpenView describes a bow-tie customer journey managed against time-to-value, sticky feature adoption, churn ARR, and expansion ARR, and product evidence shows customers can move from cards into reimbursements, invoices, subscriptions, multi-entity control, and now cash management. Nordic Fintech adds company-attributed partner metrics for Embedded that imply higher spend and engagement after integration. Taken together, this supports a real land-and-expand story. What it does not provide is the hard retention math an investor would ideally underwrite against: no public GRR, NRR, renewal cohorts, contract lengths, or churn by segment.'
