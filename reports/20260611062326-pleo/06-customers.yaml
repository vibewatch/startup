- id: concentration-proof-limits-and-diligence-path
  title: Customer concentration and durability remain the main unanswered diligence areas
  body: 'The available evidence argues against an obviously narrow or single-vertical customer base, but it does not answer the harder underwriting questions about revenue concentration or durability. Public proof spans nonprofit, mobility, media, software, manufacturing, biotech, floristry, transport, consulting, and healthcare-like environments, which reduces the risk that Pleo is overexposed to one obvious use case. But none of the public sources disclose whether a handful of larger accounts dominate revenue, whether contracts are annual or multi-year, how many customers expand versus churn, or what cohort retention looks like after onboarding excitement fades.


    Evidence quality is therefore asymmetric. Public customer stories are detailed and recent, yet mostly controlled by Pleo; review platforms add useful friction signals, yet some third-party pages such as G2 remain access-gated and therefore only partially usable for triangulation. The practical diligence response is clear: ask management for top-20 customer revenue exposure, segment-level GRR and NRR, contract terms, renewal rates after year one, attach rates for invoices and cash management, and proof that named case-study outcomes translate into portfolio-level retention and expansion rather than isolated marketing highlights. Until then, Pleo’s customer chapter should be scored as promising on breadth and day-to-day utility, but incomplete on durability and concentration.'
