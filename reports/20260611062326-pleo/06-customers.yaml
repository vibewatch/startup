  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-roster
    missingEvidence: A full export of named customer references by segment, country, module set, and deployment age, plus evidence that the public sample is representative.
    whyItMatters: The public case-study roster is strong but selective, so investors cannot tell whether the showcased logos reflect the median customer outcome or only marketing standouts.
    diligencePath: Request an internal customer reference list or CRM export covering recent wins, live deployments, churned accounts, and expansion cases by segment.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: Public GRR, NRR, churn, and renewal cohorts by segment and product module.
    whyItMatters: Workflow value and onboarding speed matter only if they translate into durable recurring revenue and renewals.
    diligencePath: Ask management for cohort retention tables, logo churn, revenue churn, and renewal rates for SMB, mid-market, and multi-entity cohorts.
    relatedQuestionRefs:
    - QU012
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, top-20 customer concentration, and named renewal status for the largest accounts.
    whyItMatters: A diverse logo list does not eliminate the risk that a small number of larger accounts drive disproportionate revenue or expansion.
    diligencePath: Request a customer concentration schedule with ARR, gross profit, renewal date, and module attach for the largest accounts.
    relatedQuestionRefs:
    - QU019
    - QU020
    - QU021
  - type: access-blocked
    severity: minor
    topic: independent-review-triangulation
    missingEvidence: Normal access to additional review platforms such as G2 so Pleo's support and product sentiment can be triangulated beyond Xero and Trustpilot.
    whyItMatters: Independent review diversity helps distinguish real product durability from company-controlled storytelling and one-platform sentiment noise.
    diligencePath: Retry review-platform fetches from a browser session or ask management for exported third-party review snapshots and complaint trend data.
    relatedQuestionRefs:
    - QU009
    - QU023
  - type: private-evidence-only
    severity: material
    topic: embedded-channel-economics
    missingEvidence: Named partner case studies, partner revenue contribution, churn impact, and sample size behind Embedded MAU and spend-growth metrics.
    whyItMatters: Embedded could be a meaningful expansion lever, but company-attributed partner metrics are not enough to underwrite channel durability or margin quality.
    diligencePath: Request partner cohort dashboards, named references, revenue-share terms, and post-integration retention for embedded accounts.
    relatedQuestionRefs:
    - QU015
