      - number: '1.3'
        title: Capital history and the post-2021 valuation reset
        blocks:
          - type: paragraph
            body: >-
              Pleo's financing history is unusually easy to narrate at the headline level and unusually hard to pin down
              in current ownership detail. The company publicly announced a $150m Series C in July 2021 at a $1.7bn
              valuation, co-led by Bain Capital Ventures and Thrive Capital, and then a $200m extension in December 2021
              that brought the total round to $350m at a $4.7bn valuation. Those two announcements remain the last clean
              public equity price-discovery events in the record. Since then, the company has added debt rather than
              announcing a new priced equity round. In May 2024, Pleo disclosed a €40m HSBC Innovation Banking facility
              intended to expand its credit offering and overdraft reach.


              That shift from priced equity to debt is why Kinnevik's marks now matter so much. In its Q4 2024 year-end
              release, Kinnevik valued its 14% Pleo stake at SEK 2,445m versus SEK 3,293m a year earlier, while still
              saying the company had reached EUR 140m in run-rate revenue and grown 2-3x faster than SaaS benchmarks
              with above-average gross margins. Tech.eu interpreted that mark as an implied Pleo valuation of roughly
              $1.62bn. The message is important for diligence: operational momentum may have improved, but external
              pricing has not returned to 2021 peak levels.


              The current stage, then, is best read as late-stage private with product breadth and investor-quality
              backing, but without a recent market-clearing equity round. Investors can still identify the major backers
              and the debt provider from public sources, yet they cannot reliably infer current ownership, liquidation
              preference overhang or board control from public material alone.
