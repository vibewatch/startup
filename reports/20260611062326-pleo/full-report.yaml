  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Vendor
      - Public entry posture
      - How pricing scales
      - What is bundled vs gated
      - Commercial read
      - Implication for Pleo
    rows:
      - - Pleo
        - Starter plus paid tiers published openly
        - Platform fee plus added-user charges on paid plans
        - Core spend control in entry tiers; cashback, multi-entity, AI insights and more vendor cards gated upward
        - Simple and self-serve enough to lower evaluation friction
        - Helps SMB acquisition, but may leave less room for bespoke enterprise packaging
      - - Spendesk
        - No public list price; quote required
        - Modular foundations plus add-ons and advanced workflows
        - Unlimited cards and users in base package; procurement and advanced workflows added modularly
        - Commercial flexibility favors negotiated value selling
        - Can beat Pleo in custom enterprise bundles while looking less transparent to smaller buyers
      - - Payhawk
        - Quote-led modular program
        - Complexity scales by modules, add-ons and entity scope
        - Growth plan explicitly excludes advanced multi-entity and procure-to-pay breadth
        - Packaging is aligned to organisational complexity, not headcount
        - Puts pressure on Pleo when buyers need enterprise complexity rather than simple seat pricing
      - - Moss
        - Free entry tier plus paid modular plans
        - Single platform fee plus transaction-volume fee; no user charge
        - Cards or AP can start free; add-ons and transaction volume expand cost
        - Highly competitive for buyers sensitive to user fees
        - Most directly challenges Pleo’s seat-based economics in Europe
      - - Soldo
        - Subscription plus separate financial-services fees and trials
        - Monthly subscription plus extra fees on some card or financial services
        - Pricing is described, but the effective bill mixes software and payments fees
        - Commercial logic favors buyers willing to manage more moving parts
        - Less frictionless than Pleo at first glance, but potentially stronger for rail-sensitive buyers
      - - Ramp
        - Free plan plus $15/user plus platform fee and enterprise custom
        - More advanced automation, integrations and add-ons raise cost
        - Very broad functionality visible even at lower published entry
        - Aggressive public entry posture backed by upsell on automation depth
        - If localized successfully, it could undercut Pleo on entry price while out-bundling it
      - - Brex / Airbase
        - Brex starts at $0/user and $12/user advanced; Airbase remains enterprise-sold inside Paylocity
        - Brex scales by product tier; Airbase scales with mid-market platform sale
        - Brex keeps entry visible; Airbase benefits from payroll and HCM bundling
        - Channel or parent-company economics matter as much as product pricing
        - Pleo can win on clarity, but not necessarily on enterprise bundle leverage
    notes: >-
      Public list pricing and fee descriptions are heterogeneous, so rows compare the observable commercial posture
      rather than a normalized effective annual contract value.
