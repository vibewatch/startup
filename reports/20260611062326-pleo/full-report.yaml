          - type: callout
            title: Scenario method
            body: >-
              Because Pleo does not publish full financial statements or a clean 2026 financing reference, the chapter
              uses simple revenue-multiple lenses and states the uncertainty explicitly.
            calloutType: assumption
            claimRefs:
              - CV029
