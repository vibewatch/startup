      - number: '2.3'
        title: 'Buyer, user and payer map: adoption is finance-led but not finance-only'
        blocks:
          - type: paragraph
            body: >-
              The buyer chain changes as company complexity rises. In very small businesses, founder, office manager and
              budget owner may still be the same person. Once a firm has distributed cardholders, multiple approvers or
              accounting close pressure, the workflow shifts to a finance owner, usually a controller, finance manager
              or CFO, while employees remain the daily users. Pleo’s own positioning and the OpenView write-up both
              suggest adoption happens when a business wants cleaner onboarding, approval routing and direct accounting
              integration rather than another manual reimbursement process. Pricing and packaging across Pleo, Payhawk
              and Spendesk also show that monetisation follows organisational complexity: multi-entity controls,
              budgets, approvals, ERP or HRIS add-ons and purchase-order workflows become more valuable as teams
              decentralise spend. Embedded distribution adds a second buyer class by selling through accounting
              platforms and PSPs rather than only through direct SMB acquisition.
