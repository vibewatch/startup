  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Layered view of Pleo from employee-facing spend capture through policy, payment, export, and partner-integration
      layers.
    data:
      layers:
        - label: User and finance experience
          detail: >-
            Front-end workflows span employee cards, reimbursements, invoices, approvals, and finance admin views for
            spend and cash.
          items:
            - Employee cards and mobile wallet usage
            - Receipt and mileage capture
            - Invoice inbox and approvals
            - Finance review, export, and cash views
        - label: Workflow and policy engine
          detail: >-
            Rules drive approvals, tags, duplicate detection, OCR-assisted capture, AI review, and scheduling across
            spend workflows.
          items:
            - Approval routing by amount/team/tag
            - Duplicate detection
            - OCR for receipts and invoices
            - AI expense review and policy filters
        - label: Payment and treasury execution
          detail: >-
            Pleo account balances, reimbursements, vendor payments, multi-currency balances, overdraft, and transfer
            rules sit in the execution layer.
          items:
            - Vendor payments from Pleo account
            - Direct reimbursements
            - Multi-currency balances and cards
            - Transfer rules and overdraft
        - label: Integration and export layer
          detail: >-
            Immutable export jobs, attachments, GL mapping, webhooks, OAuth/API keys, and marketplace connections
            connect Pleo to downstream systems.
          items:
            - Export jobs and immutable accounting records
            - Attachments and data mapping
            - Webhooks and OAuth / API keys
            - Marketplace and custom integrations
        - label: External systems and partners
          detail: >-
            Downstream accounting and HR systems plus partner-distribution channels frame Pleo as a pre-accounting
            platform rather than a full ERP.
          items:
            - Xero / NetSuite / other ERPs
            - HRIS endpoints such as BambooHR and SAP SuccessFactors
            - Bank and payment rails
            - Embedded partner platforms
    approximationNotes: >-
      This architecture map is synthesized from product pages, developer docs, and partner listings. Pleo does not
      publish a full public system diagram for the underlying service topology.
    claimRefs:
      - CE017
      - CE018
      - CE019
      - CE020
      - CE038
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: standard
    summary: Unified daily workflow from spend event to approval, payment, and bookkeeping export.
    data:
      nodes:
        - id: n1
          label: Employee or vendor spend appears
          description: Card purchase, out-of-pocket claim, or supplier invoice enters the platform.
        - id: n2
          label: Capture and enrich data
          description: Receipt OCR, invoice OCR, tags, categories, and supporting data are added.
        - id: n3
          label: Policy and approval routing
          description: Rules route the item to the right approver and flag issues or duplicates.
        - id: n4
          label: Execution path chosen
          description: Pleo reimburses the employee, pays the vendor, or keeps the card expense in workflow.
        - id: n5
          label: Finance review and scheduling
          description: Finance teams schedule payments, review exports, and manage exceptions.
        - id: n6
          label: Export job generated
          description: Approved items are grouped into immutable export jobs with attachments and mapped fields.
        - id: n7
          label: ERP or accounting system updated
          description: The downstream system receives journal-entry or AP records and status updates.
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
        - from: n6
          to: n7
    approximationNotes: >-
      The flow abstracts cards, reimbursements, and AP into one operating model because the public docs consistently
      describe Pleo as a unified pre-accounting workflow.
    claimRefs:
      - CE008
      - CE011
      - CE019
      - CE024
      - CE025
