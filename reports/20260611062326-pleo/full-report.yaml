  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / signal
      - Why it matters
      - Action implication
    rows:
      - - New financing outcome
        - Flat or down versus the Q4 2024 Kinnevik-implied mark
        - Would suggest the current external mark was not conservative enough.
        - Shift from research-more toward avoid unless terms are unusually protective.
      - - Growth deceleration
        - Evidence that growth no longer materially outpaces listed workflow/software references
        - Would weaken the argument for a premium multiple.
        - Cut any premium multiple assumption.
      - - Reinvestment without payoff
        - 2025 product or market investment stalls margin without visible monetization gains
        - Would undermine the “invest now, benefit later” bridge.
        - Move scenario weighting toward the bear case.
      - - Credit or treasury stress
        - Adverse data on losses, funding dependency, or compliance drag
        - Would raise capital intensity and reduce quality of earnings.
        - Treat treasury or credit upside as neutral or negative.
      - - Feature convergence plus pricing pressure
        - Peers match Pleo breadth without evidence of better retention or ARPA
        - Would reduce moat premium and weaken attach-rate upside.
        - Re-rate closer to public payment/workflow references.
    notes: >-
      These triggers focus on public or diligence-observable signals because the most important hidden metrics are still
      private.
    claimRefs:
      - CV012
      - CV035
      - CV039
      - CV042
      - CV045
      - CV046
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Revenue mix by stream
        - Current split across subscriptions, interchange, AP payments, treasury, and credit
        - Without mix, investors cannot judge durability or margin quality.
        - Request monthly recurring revenue bridge and gross margin by product rail.
      - - Cash burn and runway
        - Current cash balance, monthly burn, and minimum liquidity thresholds
        - The current mark can look fair or stretched depending on financing dependency.
        - Request board or lender package showing runway and covenant headroom.
      - - Credit performance
        - Portfolio size, default rate, loss rate, and funding cost by geography
        - Credit upside is attractive only if risk-adjusted economics are healthy.
        - Request underwriting deck and trailing 12-month portfolio performance.
      - - Cap table and preferences
        - Liquidation stack, employee strike sensitivity, and any senior terms
        - Headline valuation may overstate common-equity value if preferences are heavy.
        - Request latest cap table and term summaries from counsel or finance.
      - - Retention and expansion
        - NRR, gross retention, attach rates, and ARPA by cohort
        - Premium multiples depend on durable expansion economics, not only logo growth.
        - Request cohort tables and product attach-rate trends by segment.
      - - 2026 valuation freshness
        - Any 2026 internal mark, secondary, or primary financing reference after Kinnevik Q4 2024
        - A 2024 mark is stale for a 2026 investment decision if market conditions changed materially.
        - Request latest board valuation memo, secondary clears, or signed financing documents.
    notes: These asks are the minimum dataset needed to move from a research-more posture to a firm price call.
    claimRefs:
      - CV018
      - CV019
      - CV039
      - CV044
      - CV045
      - CV046
