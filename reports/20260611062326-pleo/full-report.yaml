    Pleo is a Copenhagen-founded, late-stage private fintech founded in 2015 by Jeppe Rindom and Niccolo Perra. What
    began as a spend-management product now presents as a broader finance workflow spanning cards, reimbursements,
    accounts payable, integrations, cash management, multi-currency controls, and embedded distribution. Public evidence
    supports meaningful European scale at 40,000+ customers across 16 markets and points to >EUR 140 million of 2024
    revenue run-rate, but the company still discloses limited detail on retention, margin mix, runway, and current
    cap-table terms after the 2021 peak-valuation period.
