  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive landscape: Europe-first suite peers are the main benchmark, but U.S. bundles are closing in'
        blocks:
          - type: paragraph
            body: >-
              The retained source set points to a clear direct-peer cluster rather than a vague fintech universe.
              Spendesk, Payhawk, Moss and Soldo all market integrated cards, approvals, accounts payable or invoice
              workflows, and finance-system integrations to the same SMB and mid-market buyers that Pleo targets. Each
              also frames the job as wider than card issuance: Spendesk leans into procurement, Payhawk into finance
              orchestration and travel, Moss into AI pre-accounting and modular automation, and Soldo into decentralised
              spend plus financial-services control. That makes them direct substitutes for a European buyer choosing a
              modern spend stack.


              The second competitive ring is no longer hypothetical. Ramp and Brex both publish broader global-control
              narratives, with stronger public customer counts or issuing coverage than most European peers, while
              Airbase now sits inside Paylocity's payroll-plus-finance platform. Those players are not yet evidenced as
              Europe-native leaders in the retained sources, but they do show how quickly the category can be reframed
              from spend management into a broader office-of-the-CFO bundle. For Pleo, that means feature overlap is
              already table stakes. The live strategic question is whether European regulatory fit, local integrations
              and transparent packaging are enough to defend against rivals that can combine procurement, travel,
              treasury, payroll or balance-sheet scale into the same buying motion.
