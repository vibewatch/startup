      - number: '4.3'
        title: Cost structure, margin path, and capital intensity
        blocks:
          - type: paragraph
            body: >-
              The strongest positive external signal on margin quality comes from Kinnevik, which says Pleo grew two to
              three times faster than listed SaaS benchmarks in 2024 while maintaining above-average gross margins. That
              is useful but still incomplete because neither Kinnevik nor Pleo publishes a stream-level gross margin
              bridge. The underlying cost picture is easy to sketch conceptually even if it is not fully quantified.
              Subscription revenue should be relatively attractive, but interchange economics in Europe are structurally
              capped, payment processing and customer support consume cash, and treasury or cash-management products
              require bank connectivity, FX handling, and ongoing infrastructure. Credit and overdraft features add
              another layer: they may deepen monetization, yet they also introduce funding and risk-management costs
              that pure software companies do not carry.


              Pleo's newer product surfaces make the margin path both more interesting and more complex. Cash management
              promises zero-FX local-currency spend, automated liquidity movement, and yield on idle cash, while
              Taktile's partnership shows investment into real-time fraud and AML tooling as transaction complexity
              rises. Instant-payments and related European payments rules add more compliance work for EMI or PI
              operators expanding payment functionality. In short, the business still appears more capital-light than a
              lender or hardware company, but it is not costless software. The margin path likely improves with scale
              and deeper product adoption, yet it remains tied to compliance, payments infrastructure, and funding
              discipline in ways public disclosures do not fully quantify.
