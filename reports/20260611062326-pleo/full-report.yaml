chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope and commercial model
        blocks:
          - type: paragraph
            body: >-
              Pleo presents itself as a European business-spend platform rather than a narrow card issuer. Official
              company pages position the product around smart company cards, expense capture, invoice processing,
              reimbursements and integrations into finance systems, while the pricing page shows that product access is
              intentionally tiered from Starter through Beyond. That structure matters because it suggests a
              software-led monetization model with feature upsell, not just a payments-margin story. Kinnevik's company
              overview reinforces that read by describing two revenue streams: SaaS subscription fees and spend flowing
              through customer cards.


              The identity story is well supported on official pages. Pleo says it was founded in Copenhagen in 2015 by
              Jeppe Rindom and Niccolo Perra, both former Tradeshift operators. The official footprint today is 40,000+
              companies across Europe and 16 countries, with offices across Copenhagen, London, Berlin, Stockholm,
              Madrid, Lisbon, Paris, Amsterdam and Chennai. The only meaningful ambiguity is headcount: the about page
              says 800+ employees while the press page says 900+, so the safest current framing is an 800-900+ range
              rather than a single point estimate. That is still enough to classify Pleo as a late-stage private fintech
              with meaningful operating scale, but not enough to produce a precise cover metric without management data.


              Product breadth is also visible at the workflow level. Official pages say Pleo can issue virtual cards
              instantly, reimburse employee out-of-pocket claims, automate OCR-driven invoice handling and connect to
              accounting and HR systems such as Xero, NetSuite, QuickBooks, SAP SuccessFactors and BambooHR. The help
              centre adds that multi-currency accounts now support six currencies, showing that the product is moving
              beyond classic expense management into treasury-adjacent operating cash controls.
