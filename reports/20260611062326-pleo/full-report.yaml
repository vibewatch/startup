            title: 'Adverse read: the mark still asks for belief ahead of proof'
            body: >-
              Public payment and workflow references clear well below Pleo’s implied multiple, so the current mark
              already assumes continued premium status despite hidden burn, loss, and cap-table variables.
            calloutType: risk
            claimRefs:
