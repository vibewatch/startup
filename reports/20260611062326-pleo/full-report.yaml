  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Valuation reset, financing opacity, and SMB macro sensitivity remain the clearest investor risks
        blocks:
          - type: paragraph
            body: >-
              The sharpest public risk signal is still external pricing. Kinnevik's Q4 2024 mark and tech.eu's coverage
              show that Pleo's implied value remains far below the 2021 peak, even after public signs of continued
              operating momentum. That matters because the public record still does not close the gap between narrative
              and underwritable economics: outside investors can see scale, recurring-revenue characteristics, and
              workflow stickiness, but they still cannot see burn, cash on hand, runway, cohort retention, or a current
              gross-margin bridge by product rail. In practice that leaves Pleo exposed to another valuation reset or a
              financing round done from a position of weaker negotiating leverage if growth slows before transparency
              improves.


              The second linked risk is demand quality. Pleo's own pages and OpenView's profile reinforce that the
              business is heavily anchored in SMB and mid-market buyers across Europe rather than in a disclosed
              enterprise base. The European Commission's SME review is not a company-specific warning, but it is
              directionally important because it shows a huge SME base still operating through economic headwinds, only
              modest projected recovery, and continued trade uncertainty. That is the customer segment Pleo depends on
              for card spend, SaaS seats, and wallet-share expansion. The mitigation is that Pleo appears embedded
              enough in finance workflows to be more durable than a nice-to-have point tool. The residual risk is that
              macro pressure can still show up quickly in payment volumes, new-logo conversion, downsell pressure, and
              appetite for add-ons like treasury or credit before investors ever get a clean view of runway.
            claimRefs:
              - CR001
              - CR002
              - CR003
