  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      The main transmission paths run from regulation, fraud, and product-breadth execution into customer trust,
      margins, financing flexibility, and valuation.
    data:
      nodes:
        - id: reg
          label: Instant-payments and EMI compliance
          detail: Deadlines, VoP, sanctions screening, and supervisory reporting all add execution work.
          tone: warning
        - id: fraud
          label: Fraud / AML scaling risk
          detail: Higher transaction complexity and live impersonation warnings raise operational stakes.
          tone: warning
        - id: treasury
          label: Treasury expansion complexity
          detail: Cash-management features widen liquidity, FX, and reconciliation surface area.
          tone: warning
        - id: comp
          label: Feature-parity competition
          detail: Peers market similar controls, payments, and security claims.
          tone: warning
        - id: cust
          label: Customer trust and retention
          detail: Support quality, uptime, and reliability directly influence stickiness.
          tone: neutral
        - id: margin
          label: Margins and payback
          detail: More control work and more discounting can dilute operating leverage.
          tone: negative
        - id: fin
          label: Financing flexibility
          detail: Opaque runway and weaker marks reduce negotiating leverage.
          tone: negative
        - id: val
          label: Valuation outcome
          detail: Public marks and the next financing round translate execution into price.
          tone: negative
      edges:
        - from: reg
          to: margin
          label: adds compliance cost
        - from: reg
          to: cust
          label: if rollout slips
        - from: fraud
          to: cust
          label: hits trust
        - from: fraud
          to: margin
          label: raises loss and ops cost
        - from: treasury
          to: margin
          label: adds operational load
        - from: treasury
          to: cust
          label: if reconciliation breaks
        - from: comp
          to: margin
          label: pressures price
        - from: comp
          to: cust
          label: raises switching options
        - from: cust
          to: fin
          label: changes retention story
        - from: margin
          to: fin
          label: changes runway
        - from: fin
          to: val
          label: sets negotiating power
        - from: cust
          to: val
          label: shapes growth credibility
    approximationNotes: >-
      This map is causal synthesis, not a quantified model; it shows the pathways most strongly supported by the
      retained public evidence.
