          upside.
        - Public evidence does not disclose the realized revenue mix, margins, or loss rates by rail.
        - Provide revenue and gross-margin splits by stream plus credit performance.
      - - Premium comp case
        - TravelPerk shows premium private valuations remain possible for integrated finance workflows at scale.
        - Public model-appropriate payment and workflow references trade much lower than Pleo’s implied mark.
        - Demonstrate that Pleo belongs closer to premium private comps than public comps on growth and quality.
      - - Moat and competition
        - Breadth can increase stickiness and average revenue per account over time.
        - Competitor pricing pages show fast feature convergence, limiting uniqueness premium.
        - Show retention, NRR, and attach-rate evidence that breadth deepens economics, not just roadmap scope.
