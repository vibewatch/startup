  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Funding history and the current external mark show real scale but a still-unrepaired reset
        blocks:
          - type: paragraph
            body: >-
              Pleo’s valuation record is not a straight-line story anymore. The company’s own 2021 announcements show a
              rapid ascent from a $150 million Series C at a $1.7 billion valuation to a $200 million extension that
              pushed the combined round to $350 million and the valuation to $4.7 billion. That peak matters because it
              still shapes founder, employee, and investor expectations. The more relevant anchor for a new investor,
              though, is the latest external mark. Kinnevik’s Q4 2024 materials and tech.eu’s translation of them put a
              14 percent stake at SEK 2.445 billion, implying a company value around $1.62 billion and a year-on-year
              write-down of roughly 26 percent. The markdown is meaningful adverse evidence, but it is not the same as a
              collapse in operating proof. Kinnevik simultaneously says Pleo reached more than €140 million in run-rate
              revenue by October 2024, grew two to three times faster than listed SaaS benchmarks in 2024, and retained
              above-average gross margins. The real tension is therefore not “bad company versus good company.” It is
              that a still-premium private value has to be underwritten against a market that no longer pays 2021-style
              multiples by default, especially when Kinnevik itself says 2025 reinvestment will stall margin improvement
              before any later payoff is visible.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
