      - number: '8.4'
        title: 'The remaining work is obvious: close the hidden-economics gap before treating the mark as attractive'
        blocks:
          - type: paragraph
            body: >-
              The chapter’s remaining uncertainty is concentrated in a small set of data that management could disclose
              quickly in diligence but that outside investors cannot recover from public sources. The most important
              missing block is revenue quality by stream: what share of current revenue is subscription, payments,
              interchange, treasury, credit, or other services, and how quickly is each rail growing? The second block
              is capital intensity and downside resilience: current cash, monthly burn, liquidity runway, and any
              funding covenant or warehouse-finance dependencies around the credit product. The third is risk quality:
              loss rates, delinquency behavior, fraud costs, and whether treasury or credit expansion introduces
              working-capital or compliance burdens that compress returns. The fourth is cap-table quality: preference
              stack, employee strike sensitivity, and any terms that would make an apparent headline valuation less
              relevant for new money. Until those asks are answered, the thesis-break logic should remain simple.
              Another flat or down financing, evidence of weak unit economics, or proof that treasury and credit
              expansion adds complexity faster than monetization would all push the case toward avoid. Conversely,
              audited evidence of durable growth and improving economics would move the current mark from stretched
              toward fair.
            claimRefs:
              - CV018
              - CV019
              - CV039
              - CV044
              - CV045
              - CV046
