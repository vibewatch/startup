  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: spend management first, finance automation second'
        blocks:
          - type: paragraph
            body: >-
              Pleo’s public product and pricing pages support a narrow core market definition built around employee
              cards, expense capture, reimbursements, accounts payable and approval controls. Competitor pages from
              Payhawk, Spendesk, Moss and Soldo land in nearly the same place: the market is no longer just card
              issuance, but it is also not the whole office-of-the-CFO software stack. The consistent pattern is a
              connected spend-control layer that sits on top of accounting, HR and payment infrastructure. Treasury,
              procurement, travel, e-invoicing and embedded distribution show up as expansion paths rather than the
              clean starting boundary. For diligence, the core TAM should therefore exclude ERP, payroll, core banking
              and generic finance software pools, then treat treasury and partner-led distribution as adjacent growth
              wedges that can expand Pleo’s reachable market over time. The practical buyer substitute remains manual
              finance admin.
