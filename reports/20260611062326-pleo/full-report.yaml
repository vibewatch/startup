      - number: '2.2'
        title: 'Sizing lenses: public evidence supports an account lens better than a euro TAM'
        blocks:
          - type: paragraph
            body: >-
              The strongest public upper bound is the European Commission’s count of 26.1 million SMEs. That figure is
              broad, but it is official and recent. Public customer counts are far narrower: Pleo says 40,000-plus
              companies, while Nordic Fintech Magazine reports about 45,000 customers across 16 European countries. That
              implies only about 0.15% to 0.17% penetration against the EU SME stock, with roughly 26.055 million
              businesses still outside Pleo’s current customer base. This is useful as a SOM sanity check, not a clean
              SAM. The missing denominator is the number of employer or multi-user SMEs in Pleo’s served geographies
              that actually need finance collaboration and spend controls. Eurostat freshness helps confirm current
              business statistics exist, but the fetched landing page does not expose that exact cut. As a result, a
              euro-denominated TAM would look more precise than the evidence allows. A disciplined investor read is
              therefore to keep the top of the funnel broad, keep the served market qualitative and let management
              evidence determine any tighter SAM cuts.
