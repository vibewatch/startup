      - number: '8.3'
        title: Scenario analysis supports discipline, not a price-insensitive bullish call
        blocks:
          - type: paragraph
            body: >-
              A public-only valuation lens should stay humble. If Pleo is underwritten more like a public-market-style
              payments or workflow software asset, a 6x to 8x revenue range on roughly €130 million to €140 million of
              revenue points below the current implied mark. That is the adverse case and it matters because public
              comparables still clear far below Pleo’s current revenue multiple. The base case is closer to the existing
              Kinnevik mark: roughly 10x to 11x revenue on the current run-rate, which lands around the same order of
              magnitude as today’s external signal and acknowledges that Pleo still has stronger growth than mature
              listed references. The upside case exists, but it is conditional rather than automatic. To justify 12x to
              14x revenue or better, investors need confidence that 2025 reinvestment preserves durable growth, that
              treasury and credit actually deepen monetization instead of adding complexity, and that capital intensity
              remains controlled. Put differently, this is not a bad company with no upside. It is a company whose
              current mark already asks the investor to believe more than public evidence can fully prove. That is why
              the supportable call is research-more with medium confidence, high risk, and a stretched valuation stance
              rather than a clean buy.
