    {
      "id": "drivers-and-constraints",
      "title": "Growth drivers and adoption constraints",
      "body": "Demand-side drivers are visible in both payments data and treasury pain signals. The ECB shows non-cash, card and instant-payment volumes still rising, which supports continued digitisation of business spend workflows. Pleo’s own treasury research then adds the buyer pain: poor multi-entity visibility, fragmented tools, spreadsheet fallback and weak confidence in procurement oversight or cash deployment. Those are credible reasons for SMB and mid-market finance teams to buy unified spend-control software. The main constraint is that regulation is not a free tailwind. The Instant Payments Regulation requires 24/7 reachability, verification of payee, pricing parity and, for some providers, major EMI or PI upgrades by 2027. Bird & Bird explicitly notes that sanctions-screening and settlement-access changes are hard to operationalise. Add EU interchange caps, bank-portal fragmentation and rollout sequencing for cash management, and the market looks attractive but operationally demanding rather than frictionless. That combination supports a constructive demand view but argues against underwriting frictionless European expansion or U.S.-style unit economics without further diligence.",
