    {
      "id": "integration-architecture",
      "title": "The technical posture is strongest in accounting integration, with disciplined but narrow API scope",
      "body": "The most convincing technical evidence in the chapter is not on the marketing site; it is in the developer docs. Pleo explicitly positions itself as a pre-accounting platform that prepares immutable, accounting-ready data for ERP and accounting systems rather than trying to replace the ledger. That boundary is healthy because it reduces architectural ambition to a workflow Pleo can plausibly own well: capture spend, apply policy, map fields, export clean records, and keep a clear audit trail. The docs describe a partner-oriented stack built around REST, JSON, OpenAPI, OAuth or API keys, export jobs, webhook triggers, attachments, posting behaviour, and company-scoped accounting boundaries. This is real integration infrastructure, not a hand-wavy “we connect to everything” claim. The trade-off is equally visible: Pleo’s API model is disciplined rather than open-ended. Multi-entity support is strict company isolation, and native integration depth is not uniform across endpoints. Xero looks deep and operationally mature; QuickBooks looks notably thinner. That makes Pleo technically credible for finance-system integrations, but not a broad developer platform in the style of open product ecosystems.",
