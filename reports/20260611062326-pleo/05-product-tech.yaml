    "number": 5,
    "title": "Product & Technology",
    "summary": "Pleo has evolved from a card-led expense tool into a broader finance workflow spanning cards, reimbursements, AP, bookkeeping exports, multi-entity and multi-currency controls, and newer credit, cash-management, and Embedded distribution layers. The strongest technical evidence is in its partner-oriented accounting integration surface—REST/OpenAPI docs, immutable export jobs, OAuth/API-key auth, and clear company-scoped data boundaries—while the weaker spots are uneven native depth across endpoints such as QuickBooks, limited public reliability metrics, and a relatively closed product surface outside finance-system integrations."
  },
  "sections": [
    {
      "id": "workflow-breadth",
      "title": "Pleo now looks like a unified finance workflow, not just a card product",
      "body": "Pleo’s public product surface is broad enough to treat it as a unified SMB finance workflow rather than a narrow corporate-card tool. The pricing and feature pages show that cards, expense capture, accounts payable, reimbursements, approvals, vendor cards, and bookkeeping integrations are all core parts of the offer, with multi-entity, HRIS, AI review, purchase orders, and sub-accounts layered into higher tiers. That matters because the practical buyer job is not “issue a card”; it is “let employees spend, keep policy control, get evidence attached, move money, and close the books without extra admin.” The reimbursements and AP pages make that workflow explicit: OCR, approval routing, duplicate checks, payment scheduling, and downstream sync sit inside the same operating model. In that sense, Pleo’s strongest product argument versus point solutions is workflow compression. A finance team can keep cards, reimbursements, invoice handling, and bookkeeping prep in one place instead of stitching together separate card, claims, and AP tools.",
