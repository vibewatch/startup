    {
      "id": "treasury-and-embedded",
      "title": "Treasury, cash management, and Embedded are the main expansion wedges",
      "body": "The product has clearly moved beyond classic expense management. Credit and treasury-adjacent functionality were already expanding in 2024 through Overdraft and the HSBC-backed credit facility, then became more concrete with the 2025 cash-management launch in the UK and Germany. Public launch coverage describes a product that links bank and Pleo accounts, applies transfer rules, supports multi-currency balances and cards, and frames liquidity management as a workflow problem rather than a bank-portal problem. That adjacency is credible because Pleo’s own treasury research highlights the underlying pain: weak cross-entity visibility, too many tools, spreadsheet fallback, and a strong desire for a single view of accounts and currencies. Embedded is the second major wedge. Here the logic is distribution-led: instead of winning every SMB directly, Pleo wants to let banks, PSPs, and accounting platforms embed spend and cash management inside their own products. If that channel works, it broadens reach without relying only on direct sales. The caution is that public partner economics are still mostly company-attributed, so the strategic upside is clear before the empirical proof is complete.",
