    {
      "id": "capability-pricing-and-control-model",
      "title": "Capability, pricing and control model: the sharpest differences are packaging and operating posture, not basic features",
      "body": "Pleo's public positioning still reads as a Europe-first spend platform with transparent list pricing and a finance-led workflow stack. The pricing page spells out monthly platform fees and additional user charges across Essential, Advanced and Beyond, while the invoices and integrations pages show approval workflows, vendor payments in 50-plus currencies and standard accounting or HRIS links. That is unusually transparent compared with quote-led Spendesk and Payhawk, and with Soldo's mix of subscription plus separate financial-services fees. Moss is the most obvious European counterexample because it removes per-user pricing and instead charges a platform fee plus transaction-based fees, including a free entry tier for small teams.\n\nProduct breadth, however, is moving away from Pleo's core center of gravity. Spendesk extends hard into procurement and multi-entity upsell. Payhawk markets a broader enterprise stack with travel, procurement, AI agents, EU eInvoicing and dedicated IBAN-based payments. Ramp and Brex add treasury or global-issuing narratives on top of cards and AP. Airbase's post-Paylocity framing goes further by combining payroll and non-payroll spend in one operating model. For a buyer, the practical implication is that most vendors now clear the minimum threshold on cards, AP and controls. The harder selection questions are how much enterprise complexity must be supported, whether Europe-local trust and settlement matter more than global breadth, and whether the buyer prefers transparent self-serve pricing or negotiated bundle economics.",
