chapter:
  number: 8
  title: Valuation
  summary: Historical funding and deployment reporting establishes residual strategic optionality, but it does not establish current cash, liabilities, active programs, or an investable price. An undated report citing a cessation date after the run date cannot establish current shutdown; avoid an unverified entry price and seek current operating and financing evidence.
sections:
  - id: funding-is-not-a-mark
    title: Historical funding is not a current valuation mark
    body: >-
      Published financing coverage records multiple rounds, including a nearly RMB 1 billion
      Series A reported in 2021, a RMB 100 million Series B first tranche reported by TechCrunch
      in February 2024, and a CNY 300 million Series B2 round reported by Yicai. These are
      historical amounts raised, not evidence of cash still available, current debt capacity,
      proceeds remaining, or a present equity value. The 2021 article said Haomo did not reveal
      its latest valuation; a separate report later described a peak valuation above USD 1
      billion, but neither supplies a current mark or cap-table terms. The assigned pool contains
      no current company valuation, audited financial statements, fully diluted capitalization,
      preference stack, or binding rescue terms. A listed autonomous-driving peer's market
      capitalization is observable, but its public-market price is not a valid multiple for a
      distressed private supplier without comparable operating and financing inputs. Accordingly,
      scenario values and target returns remain unquantified rather than being inferred from
      historical funding or a stale peak mark.
    claimRefs: [CV004, CV005, CV006, CV007, CV012, CV016]
  - id: strategic-optionality-and-erosion
    title: Strategic optionality is conditional on restart proof
    body: >-
      Historical reporting describes two potential value pools: passenger-vehicle ADAS and
      autonomous logistics. TechCrunch reported that Haomo's ADAS business was concentrated
      around Great Wall Motor, while company-issued material carried by Gasgoo described
      Xiaomotuo delivery operations and prior order milestones. These records show historical
      product activity, not current contracted revenue, unit economics, or transferable
      intellectual property. More recent adverse coverage says employees were instructed not to
      report to work and reported delayed salaries; the fetched article text does not show a
      publication date, so the timing and present operating status require direct confirmation.
      Separately, IDTechEx's 2025 analysis reported a 37% year-on-year fall in new contracts for
      software-only vendors in 2024. That is an industry pressure signal, not a Haomo-specific
      measure or valuation benchmark. Gasgoo's January-April 2026 LiDAR market figures likewise
      describe a different segment and cannot be used to assign Haomo a share or revenue multiple.
      Any residual value therefore depends on verifying live OEM nominations, customer payment,
      support obligations, restart costs, and whether a sponsor will fund the business.
    claimRefs: [CV001, CV002, CV008, CV009, CV010, CV011]
    tableRefs: [TV002]
  - id: price-sensitive-decision
    title: Avoid pending price and solvency diligence
    body: >-
      The recommendation is avoid at any unverified entry price, not a claim that the technology
      or assets have no value. The decisive asymmetry is that the available evidence supports
      historical financing and deployments, while an undated report placing a potential work
      stoppage after the run date, historical payroll allegations, and
      absent current financial and capitalization data prevent an estimate of equity recovery.
      A bull case requires confirmed active programs, transferable assets, and binding sponsor
      funding after liabilities; the base case is a distressed restructuring or asset transfer
      with uncertain proceeds to equity; the bear case is negligible or zero equity recovery if
      obligations exceed realizable asset value. No evidence in the pool supports numeric
      valuation ranges, return targets, or scenario probabilities. The decision can move to
      research-more only after diligence establishes operating status, cash and debt, payables,
      customer commitments, cap-table preferences, and the price and protections offered to new
      capital. A verified sponsor-supported restart and a sufficiently low entry price could
      change the stance; failed program verification or liabilities ahead of equity would
      reinforce avoid.
    claimRefs: [CV003, CV013, CV014, CV015, CV016]
    tableRefs: [TV001, TV003]
    figureRefs: [FV001]
