chapter:
  number: 5
  title: Product & Technology
  summary: Public reporting describes Haomo's passenger-vehicle ADAS and low-speed delivery products, alongside DriveGPT and MANA OASIS as technical initiatives. Historical deployment and reported delivery delays establish a product footprint, but the assigned evidence does not verify current supported programs, safety performance, or production readiness.
sections:
  - id: product-portfolio
    title: A two-line product portfolio with uneven proof
    body: >-
      Third-party coverage describes two distinct offerings: passenger-vehicle
      driver assistance and low-speed autonomous delivery. The passenger
      portfolio has included map-free highway NOA, memory driving, and
      automated parking; the delivery line has centered on the Little Camel
      vehicle. These are different operating contexts and should not be read as
      a single maturity curve. TechCrunch reported that Haomo said its ADAS had
      powered more than 20 vehicle models, while a later KrASIA article cited
      more than 20 HPilot-equipped models, while ML-Vehicle reported over 141
      million assisted-driving kilometers as of May 2024. The differing mileage snapshots and reported
      product counts are historical claims, not a current installed-base
      measure. No assigned source verifies which vehicle programs remain in
      production or supported today.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
    tableRefs:
      - TE001
  - id: technical-architecture
    title: DriveGPT is a reported planning approach, not a validated production stack
    body: >-
      A technical blog describes DriveGPT as an autoregressive, decoder-only
      Transformer built around a tokenized “Drive language,” with a stated
      focus on behavior and local planning. In that account, scene signals,
      vehicle behavior, and human intentions are represented as sequences from
      which the model can generate future behavior; human rankings and takeover
      examples are discussed as possible feedback for reward-model training.
      The same author cautions that high-quality perception inputs are
      necessary and questions whether generative-model inference would meet
      real-time in-vehicle compute constraints. Separately, ML-Vehicle reports that
      Haomo co-developed the MANA OASIS compute center with Volcano Engine and
      launched DriveGPT in 2023, but the assigned sources do not provide
      hardware specifications, production deployment evidence, or independent
      safety validation. A 36Kr comparison focuses on Tesla, Huawei, and
      Momenta; it is not a Haomo test or an independent benchmark for its
      system. The diagram therefore represents the reported conceptual
      pipeline, not a verified deployed architecture.
    claimRefs:
      - CE006
      - CE007
      - CE008
      - CE009
      - CE016
    tableRefs:
      - TE003
    figureRefs:
      - FE001
  - id: maturity-and-risk
    title: Delivery execution and system assurance remain the underwriting gaps
    body: >-
      Reporting points to a gap between technical ambition and confirmed
      deployment. KrASIA and ML-Vehicle describe memory-driving and parking
      projects for two Hyundai models, with an August delivery plan that
      sources said was at risk because of development delays; KrASIA also
      recounts a city-NOA schedule that slipped beyond its original 2023 target
      without confirmed deployment in that account. These reports are
      dated snapshots and do not establish the programs' status in October
      2026. Sector commentary adds context rather than a Haomo benchmark:
      IDTechEx describes pressure on software-only suppliers to offer
      cost-effective full-stack partnerships, while Gasgoo emphasizes
      long-tail scenario handling, takeover frequency, path-planning
      reliability, and response efficiency as evaluation metrics. The assigned
      pool contains no current, independently measured Haomo reliability,
      security, certification, or supported-customer data. Buyers should
      therefore treat product capability and production support as unverified
      until program-level test and acceptance records are supplied.
    claimRefs:
      - CE010
      - CE011
      - CE012
      - CE013
      - CE014
      - CE015
    tableRefs:
      - TE002
