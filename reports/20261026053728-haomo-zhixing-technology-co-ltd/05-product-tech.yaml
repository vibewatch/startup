  - id: TE003
    title: DriveGPT architecture as described in secondary technical commentary
    columns:
      - Layer or process
      - Reported role
      - Dependency
      - Technical or diligence risk
    rows:
      - - Scene and perception inputs
        - Scene signals, objects, lanes, and vehicle state are converted into model inputs
        - The blog says DriveGPT requires high-quality perception signals
        - No Haomo perception architecture, sensor specification, or input-quality results are supplied
      - - Drive-language representation
        - Quantized tokens describe scene states, behavior, and human intentions
        - Token design determines representation resolution and vocabulary size
        - The source is an independent technical explanation, not Haomo documentation
      - - DriveGPT planning
        - Autoregressive decoder-only Transformer is described for behavior and local planning
        - Depends on the preceding scene representation and learned driving examples
        - No production inference latency, compute budget, or vehicle-level deployment proof
      - - Human-feedback training
        - Human rankings and takeover situations are described as reward-model signals
        - Requires labeled and ranked driving data plus a training process
        - No dataset scale, safety protocol, or quantitative validation is disclosed
      - - Vehicle behavior output
        - Model may generate future ego-vehicle behavior in the described approach
        - A separate control and safety envelope would be required for deployment
        - The source questions real-time in-vehicle compute feasibility; no production evidence is assigned
    notes: >-
      This is a source-attributed conceptual description from a technical blog;
      it is not a confirmed implementation specification or a complete
      safety-critical vehicle architecture.
    claimRefs:
      - CE006
      - CE007
      - CE008
      - CE009
