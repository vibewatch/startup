  evidenceGaps:
    - type: missing-source
      severity: material
      topic: reliability-and-safety
      missingEvidence: Current vehicle-level validation results, intervention and disengagement rates, incident records, operational design domains, and named production-customer acceptance for each active program.
      whyItMatters: Without comparable, current field evidence, product maturity and the safety or reliability of deployment cannot be underwritten from historical product counts or planned deliveries.
      diligencePath: Request dated OEM acceptance packages, independently reviewed test protocols, field-performance denominators, incident and intervention logs, and supported-vehicle lists.
      relatedQuestionRefs:
        - QE005
    - type: missing-source
      severity: material
      topic: trust-security-compliance
      missingEvidence: Product-specific security and privacy controls, automotive-data handling documentation, applicable certifications or approvals, and quality-management evidence.
      whyItMatters: These controls determine whether vehicle data and safety-critical software can be operated, updated, and supported compliantly at scale.
      diligencePath: Obtain current security architecture and audit reports, data-flow and retention schedules, approval/certification records, OTA change controls, and quality-system evidence from the company and OEM customers.
      relatedQuestionRefs:
        - QE006
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: Public repository or release activity, practitioner-community discussion, public engineering talks, or integration-partner technical evidence that could serve as a developer-signal proxy.
      whyItMatters: The assigned successful URL pool contains no such practitioner or developer proxy, so software maintenance activity and integration adoption cannot be assessed from public signals here.
      diligencePath: Request current engineering release and maintenance records, public or partner integration documentation, and practitioner references; if no public proxy exists, record that limitation and obtain private technical diligence evidence.
