              Third-party coverage describes two distinct offerings: passenger-vehicle driver assistance and low-speed
              autonomous delivery. The passenger portfolio has included map-free highway NOA, memory driving, and
              automated parking; the delivery line has centered on the Little Camel vehicle. These are different
