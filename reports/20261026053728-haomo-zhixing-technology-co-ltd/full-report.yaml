      - number: '5.3'
        title: Delivery execution and system assurance remain the underwriting gaps
        blocks:
          - type: paragraph
            body: >-
              Reporting points to a gap between technical ambition and confirmed deployment. KrASIA and ML-Vehicle
              describe memory-driving and parking projects for two Hyundai models, with an August delivery plan that
              sources said was at risk because of development delays; KrASIA also recounts a city-NOA schedule that
              slipped beyond its original 2023 target without confirmed deployment in that account. These reports are
              dated snapshots and do not establish the programs' status in October 2026. Sector commentary adds context
              rather than a Haomo benchmark: IDTechEx describes pressure on software-only suppliers to offer
              cost-effective full-stack partnerships, while Gasgoo emphasizes long-tail scenario handling, takeover
              frequency, path-planning reliability, and response efficiency as evaluation metrics. The assigned pool
              contains no current, independently measured Haomo reliability, security, certification, or
              supported-customer data. Buyers should therefore treat product capability and production support as
              unverified until program-level test and acceptance records are supplied.
            claimRefs:
              - CE010
              - CE011
