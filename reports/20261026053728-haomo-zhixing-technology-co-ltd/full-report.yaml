      - number: '7.3'
        title: Commercial leverage and financial resilience are not established by historical reports
        blocks:
          - type: paragraph
            body: >-
              TechCrunch's February 2024 reporting described Great Wall as Haomo's largest shareholder and said Haomo
              sold mostly to that shareholder at the time, while reporting a first CNY 100 million tranche of a Series
              B. Those are dated third-party reports, not evidence of current order concentration, binding support, or
              cash available. The same report mentioned an agreement to develop robotics for a Chengdu district; it does
              not establish whether that project remains active or funds Haomo today. Separately, IDTechEx's published
              analysis reported a 37% year-on-year fall in 2024 new contracts for software-only ADAS vendors, a market
              pressure signal rather than a Haomo-specific result. Since the assigned sources do not establish Haomo's
              current OEM mix, contract backlog, receivables, debt, or liquidity, the ranking of commercial and solvency
              risks remains conditional. Obtain current contracts and financial schedules; do not treat historical
              funding raised as available cash.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Decision gates should be tied to evidence, not assumed mitigations
        blocks:
          - type: paragraph
            body: >-
              The highest-priority diligence gates are documentary: reconcile Haomo's current product approvals and OTA
              filings to each active vehicle program; inspect data inventories, transfer assessments, access controls,
              and retention logs; and obtain customer-level shipment, renewal, and payment evidence. A verified
              reportable safety event, an unremediated filing or recall deficiency, or loss of a critical OEM program
              would materially worsen the thesis. Conversely, independently reviewed compliance artifacts, current
              multi-OEM contracts, and evidence of funded operating runway would reduce uncertainty. None of these
              triggers is asserted to have occurred. The assigned sources also do not establish the absence of
              incidents, claims, employee disputes, or regulatory actions; those are specific search and document-review
              gaps rather than negative findings.
            claimRefs:
              - CR003
              - CR005
              - CR010
              - CR012
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not convert a sector event into a Haomo incident
            body: >-
              Assigned sources describe regulatory tightening and a fatal crash involving another manufacturer's
              vehicle, but do not establish a Haomo safety event. The absence of a Haomo incident in this pool is not
              proof that none occurred.
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Historical funding is not a current valuation mark
        blocks:
          - type: paragraph
            body: >-
              Published financing coverage records multiple rounds, including a nearly RMB 1 billion Series A reported
              in 2021, a RMB 100 million Series B first tranche reported by TechCrunch in February 2024, and a CNY 300
              million Series B2 round reported by Yicai. These are historical amounts raised, not evidence of cash still
              available, current debt capacity, proceeds remaining, or a present equity value. The 2021 article said
              Haomo did not reveal its latest valuation; a separate report later described a peak valuation above USD 1
              billion, but neither supplies a current mark or cap-table terms. The assigned pool contains no current
              company valuation, audited financial statements, fully diluted capitalization, preference stack, or
              binding rescue terms. A listed autonomous-driving peer's market capitalization is observable, but its
              public-market price is not a valid multiple for a distressed private supplier without comparable operating
              and financing inputs. Accordingly, scenario values and target returns remain unquantified rather than
              being inferred from historical funding or a stale peak mark.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV012
              - CV016
      - number: '8.2'
        title: Strategic optionality is conditional on restart proof
        blocks:
          - type: paragraph
            body: >-
              Historical reporting describes two potential value pools: passenger-vehicle ADAS and autonomous logistics.
              TechCrunch reported that Haomo's ADAS business was concentrated around Great Wall Motor, while
              company-issued material carried by Gasgoo described Xiaomotuo delivery operations and prior order
              milestones. These records show historical product activity, not current contracted revenue, unit
              economics, or transferable intellectual property. More recent adverse coverage says employees were
              instructed not to report to work and reported delayed salaries; the fetched article text does not show a
              publication date, so the timing and present operating status require direct confirmation. Separately,
              IDTechEx's 2025 analysis reported a 37% year-on-year fall in new contracts for software-only vendors in
              2024. That is an industry pressure signal, not a Haomo-specific measure or valuation benchmark. Gasgoo's
              January-April 2026 LiDAR market figures likewise describe a different segment and cannot be used to assign
              Haomo a share or revenue multiple. Any residual value therefore depends on verifying live OEM nominations,
              customer payment, support obligations, restart costs, and whether a sponsor will fund the business.
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV006
              - CV008
              - CV009
              - CV013
              - CV014
              - CV015
      - number: '8.3'
        title: Avoid pending price and solvency diligence
        blocks:
          - type: paragraph
            body: >-
              The recommendation is avoid at any unverified entry price, not a claim that the technology or assets have
              no value. The decisive asymmetry is that the available evidence supports historical financing and
              deployments, while an undated report placing a potential work stoppage after the run date, historical
              payroll allegations, and absent current financial and capitalization data prevent an estimate of equity
              recovery. A bull case requires confirmed active programs, transferable assets, and binding sponsor funding
              after liabilities; the base case is a distressed restructuring or asset transfer with uncertain proceeds
              to equity; the bear case is negligible or zero equity recovery if obligations exceed realizable asset
              value. No evidence in the pool supports numeric valuation ranges, return targets, or scenario
              probabilities. The decision can move to research-more only after diligence establishes operating status,
              cash and debt, payables, customer commitments, cap-table preferences, and the price and protections
              offered to new capital. A verified sponsor-supported restart and a sufficiently low entry price could
              change the stance; failed program verification or liabilities ahead of equity would reinforce avoid.
            claimRefs:
              - CV003
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV013
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV013
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Avoid pending price and solvency proof
            body: >-
              Historical fundraising is not cash available, and the current evidence cannot support a valuation range or
              return target. Reassess only after confirming liabilities, active contracts, cap-table priority, sponsor
              terms, and entry price.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV013
              - CV016
          - type: callout
            title: Operating status remains unverified
            body: >-
              The fetched adverse report describes a work halt and salary delays but does not expose its publication
              date. Confirm the event date, current payroll, and whether any operating programs remain live before
              treating historical product evidence as realizable value.
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
