  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: A crowded supplier field with overlapping routes
        blocks:
          - type: paragraph
            body: >-
              The available evidence supports a layered rather than exhaustive landscape. TechCrunch identified Pony.ai,
              WeRide, Momenta, and DeepRoute as Haomo's Chinese autonomous-driving peers in February 2024, while
              describing a broader shift by L4-oriented firms toward L2 or L3 products that could be deployed sooner. A
              separate IDTechEx analysis groups Momenta, WeRide, QCraft, and Baidu Apollo as software-only suppliers and
              contrasts them with integrated providers including Huawei, Mobileye, Horizon Robotics, Black Sesame, and
              Bosch. These are different classifications and dates, not a head-to-head performance ranking. The evidence
              does not establish the full set of OEM in-house programs, manual-driving status quo alternatives, or newer
              entrants, so the landscape table is a sourced sample rather than a complete market census.
