      - number: '3.3'
        title: OEM access and integration matter more than a feature-list comparison
        blocks:
          - type: paragraph
            body: >-
              The available supplier comparisons point to OEM access, system integration, and cost as important buying
              dimensions, but they do not disclose realized prices or contract terms. IDTechEx reports that automakers
              increasingly favor cost-effective full-stack partnerships over modular software offerings and that new
              contracts signed by software-only vendors fell 37% year over year in 2024. That is a category-level
              signal, not proof that a named supplier lost a particular Haomo program. Haomo's reported Great Wall
              relationship offers a clear distribution anchor but also leaves customer concentration and the
              availability of independent channels unresolved. No assigned source quantifies switching costs,
              multi-homing, OEM build-versus-buy economics, or the support obligations attached to a system; those gaps
              prevent a defensible total-cost or lock-in comparison.
