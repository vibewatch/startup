  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Argument
      - Evidence boundary
      - What would change the view
    rows:
      - - 'Thesis: historical product activity may leave strategic assets'
        - Reported ADAS and delivery activity is historical; it does not prove live revenue or transferable assets
        - Verify current OEM nominations, IP ownership, delivery obligations, and buyer interest
      - - 'Anti-thesis: restart and equity recovery are impaired'
        - >-
          Adverse coverage reports a work halt and delayed salaries; current liabilities and operating status are
          unverified
        - Obtain current payroll, creditor, cash, and restructuring records
      - - 'Anti-thesis: historical funding cannot finance a new entry case'
        - Reported round proceeds are amounts raised in prior periods, not current cash or available funding
        - Reconcile bank balances, debt, payables, preferences, and binding sponsor commitments
      - - 'Conditional upside: strategic sponsor may preserve selected programs'
        - No binding rescue or purchase offer is established by this pool
        - Require executed sponsor terms and program-level economics before underwriting
    notes: >-
      Evidence is incomplete and includes company-issued historical announcements; no row asserts current revenue,
      liquidity, or signed rescue financing.
    claimRefs:
      - CV004
      - CV006
      - CV008
      - CV009
      - CV013
      - CV014
      - CV015
  - id: TV003
    title: Bull / base / bear scenario framework
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation and return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
          A sponsor funds a restart; live OEM programs and transferable IP are verified; liabilities are settled or
          ring-fenced
        - No numeric range supportable; price only after diligence and a fully diluted, preference-adjusted cap table
        - Conditional; low confidence on current evidence
        - Programs or IP cannot be transferred, or sponsor terms are not binding
      - - Base
        - >-
          Selected assets or programs may continue through a restructuring, but cash needs and claims ahead of equity
          remain unknown
        - Distressed asset or rescue economics; equity return cannot be estimated without liabilities and entry terms
        - Most prudent underwriting case, not a probability estimate
        - Creditor claims, payroll arrears, or restart costs consume realizable value
      - - Bear
        - Operations do not resume and no buyer funds a viable transfer
        - Potentially zero equity recovery; no precise loss amount or valuation range established
        - Material downside case; likelihood unquantified
        - Confirmed insolvency, program termination, or assets encumbered ahead of equity
    notes: >-
      Qualitative scenarios only. No current financials, cap table, binding transaction terms, or comparable private
      valuation support numeric values or probability percentages.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV013
      - CV014
      - CV015
      - CV016
