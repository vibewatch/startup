      - number: '1.3'
        title: Commercial context and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              The surrounding China market is moving toward broader assisted-driving deployment and more integrated
              supplier offerings, but these market indicators should not be read as Haomo results. IDTechEx reported
              that 52 percent of Chinese new-energy-vehicle startup sales in 2024 supported L2+ functionality and
              described a shift toward full-stack suppliers; Gasgoo's 2026 article also described hardware-software
              integration and rising emphasis on real-world system performance. Driving Vision News reported more than
              1.3 million passenger-car LiDAR installations in China in the first four months of 2026. These sources
              establish competitive context, not Haomo market share or product adoption.

              A Law.asia article authored by Fangda Partners describes China's autonomous-vehicle rules as a layered
              framework with local pilot mechanisms and notes that, at the article's publication, specific national
              access standards for mass-produced L3-and-above vehicles had not been formally issued. Its publication
              date is not stated in the fetched text, so that regulatory description is not treated as a current legal
              status. The same article describes liability and data-security obligations as material operating
              considerations. Current approvals, compliance findings, and any company-specific incidents are not
              established by the assigned evidence.
            claimRefs:
              - CO012
              - CO013
              - CO014
              - CO015
      - number: '1.4'
        title: Evidence boundary and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              The strongest company-specific evidence is a single independent news report from February 2024,
              supplemented by a technical blog on DriveGPT. It supports a historical outline of ownership, funding,
              products, and disclosed operating indicators, but it does not establish current performance or financial
              condition. Industry publications add context but do not corroborate Haomo-specific customer, scale, or
              funding claims. In particular, no current valuation, revenue or run-rate, headcount, customer count,
              funding position, cash/debt profile, or board composition can be responsibly stated from this pool.

              A current company filing or signed investor and OEM confirmation would be needed to update the ownership
              and financing record; direct management and board materials would be needed to verify leadership,
              governance, and key-person coverage. Current vehicle-program evidence should identify the OEM, supported
              model, production period, and active service obligations. Financial statements or a current
              cash-and-liabilities schedule would be necessary to assess solvency and restart capacity. The available
              technical criticism warrants a diligence question about real-time deployment, not a conclusion about
              present product failure.
            claimRefs:
              - CO002
              - CO005
              - CO010
              - CO016
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Historical scale is not current operating proof
            body: >-
              TechCrunch's 2024 account is useful as a dated baseline, but current programs, financial condition,
              governance, and product deployment require direct refresh evidence.
            calloutType: risk
            claimRefs:
