      - number: '2.3'
        title: OEM program economics and deployment constraints shape adoption
        blocks:
          - type: paragraph
            body: >-
              The likely buying path for passenger-car ADAS is an OEM vehicle-program decision, with the driver as user
              and the commercial payer governed by an undisclosed supplier contract or vehicle bill of materials.
              TechCrunch reported Haomo's historical L2 focus and said the company claimed its solutions had powered
              more than 20 vehicle models; this is evidence of programs, not current active awards, unit shipments or
              revenue. IDTechEx reported that software-only vendors' new contracts fell 37 percent year over year in
              2024 and described automaker preference for cost-effective full-stack partnerships, while Gasgoo
              emphasized real-world performance, mass-production capability and cost optimization. These indicate
              procurement criteria, not proof of Haomo's conversion or margin. L3/L4 adoption faces separate regulatory
              and capital constraints: TechCrunch characterized L4 as capital-intensive and years from broad adoption,
              and a Research and Markets report cited a 50 percent decline in California autonomous-vehicle test mileage
              in 2024 versus 2023. Neither measure establishes Chinese demand. Buyer budget ownership, ASPs, switching
              costs, program economics, live OEM awards and the share of spend available to Haomo remain unverified.
            claimRefs:
