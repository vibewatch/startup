      - number: '1.2'
        title: Leadership, ownership, and capital evidence
        blocks:
          - type: paragraph
            body: >-
              The available leadership evidence identifies Gu Weihao as CEO and describes him as a Baidu smart-car
              veteran, but this is a February 2024 report and does not establish his current role. The assigned sources
              do not identify Haomo's founders, board, governance arrangements, or executive changes. Those gaps prevent
              a current assessment of key-person dependence or functional leadership coverage.

              TechCrunch reported a 100 million yuan ($14 million) first tranche of Series B financing led by Chengdu
              Wufa Private Equity Fund Management, and separately cited ITJuzi for more than $200 million of equity
              funding raised by that time. The reported total is not cash available, and the article supplies no current
              valuation, debt, cash, revenue, or runway. Great Wall Motor, Meituan, and Qualcomm Ventures were
              identified as past investors; Great Wall was also described as the largest shareholder. The dated report
              is not a current cap-table or financing confirmation.
            claimRefs:
