chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and disclosed operating evidence
        blocks:
          - type: paragraph
            body: >-
              TechCrunch described Haomo.ai in February 2024 as an autonomous-driving startup backed by Great Wall
              Motor. It reported a passenger-car Level 2 advanced driver-assistance focus and Level 4 solutions for
              logistics vehicles, with Great Wall as the largest shareholder and principal customer in that account. The
              same article reported that Haomo's systems had powered more than 20 vehicle models and accumulated about
              120 million kilometers, attributing those figures to the company; it also said the delivery vans had
              transported close to 300,000 grocery parcels. These are dated, company-attributed historical operating
              indicators, not current customer, revenue, or utilization measures.

              A separate technical blog says Haomo announced DriveGPT at its 2023 AI Day and characterizes it as a
              GPT-style autoregressive Transformer for driving planning and reasoning. The author distinguishes
              model-development ambition from production readiness and questions the feasibility of running the
              generative model on an in-vehicle system-on-chip in real time. That critique is an analyst's assessment,
              not evidence that deployment failed. No assigned source establishes current product availability,
              supported vehicle programs, or a present-day commercial fleet.
            claimRefs:
              - CO001
              - CO003
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
