      - number: '2.2'
        title: Observable adoption is not a disclosed addressable-spend estimate
        blocks:
          - type: paragraph
            body: >-
              The evidence supports several non-comparable market lenses rather than a stitched TAM. IDTechEx reported
              that 52 percent of Chinese new-energy-vehicle startups' total vehicle sales supported L2+ functionality in
              2024; that denominator is startup vehicle sales, not all vehicles, ADAS revenue or Haomo share. Gasgoo's
              January–April 2026 LiDAR installations offer a component-volume signal: it reported 456,986 Hesai units at
              35.0 percent share and 398,057 Huawei units at 30.5 percent, with the two at 65.5 percent combined. Those
              LiDAR figures do not measure the whole ADAS market. Tracxn displayed $457 million of funding for China's
              autonomous-vehicle sector in 2026 to date, which is capital raised, not customer spend, revenue or cash
              available to suppliers. The other reports describe growth or market direction without supplying comparable
              China segment values, CAGR, ASPs or a transparent vehicle-by-feature denominator. No source in this
              allocation supports a numeric Haomo TAM, SAM or SOM.
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM006
              - CM009
              - CM010
