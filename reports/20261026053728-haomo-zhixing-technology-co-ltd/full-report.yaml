      - number: '5.2'
        title: DriveGPT is a reported planning approach, not a validated production stack
        blocks:
          - type: paragraph
            body: >-
              A technical blog describes DriveGPT as an autoregressive, decoder-only Transformer built around a
              tokenized “Drive language,” with a stated focus on behavior and local planning. In that account, scene
              signals, vehicle behavior, and human intentions are represented as sequences from which the model can
              generate future behavior; human rankings and takeover examples are discussed as possible feedback for
              reward-model training. The same author cautions that high-quality perception inputs are necessary and
              questions whether generative-model inference would meet real-time in-vehicle compute constraints.
              Separately, ML-Vehicle reports that Haomo co-developed the MANA OASIS compute center with Volcano Engine
              and launched DriveGPT in 2023, but the assigned sources do not provide hardware specifications, production
              deployment evidence, or independent safety validation. A 36Kr comparison focuses on Tesla, Huawei, and
              Momenta; it is not a Haomo test or an independent benchmark for its system. The diagram therefore
              represents the reported conceptual pipeline, not a verified deployed architecture.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE016
