      - number: '6.2'
        title: Adoption metrics are historical and not directly comparable
        blocks:
          - type: paragraph
            body: >-
              Haomo's own February and April 2024 publications describe HPilot coverage on roughly twenty vehicle
              models, but their user-assisted-driving mileage figures differ sharply: more than 120 million kilometers
              in the February item and nearly 25 million kilometers in the April item. The sources do not define a
              comparable reporting scope or explain the difference; neither figure should be treated as a continuous
              growth series. The April account also reports more than 120,000 Xiao Motuo orders across more than 60
              communities in one Beijing district, while a reported Germany shipment concerns an equipped vehicle batch
              rather than proof of end-user uptake or repeat orders. No current active fleet, renewal, or account-level
              economics are disclosed. [CU001, CU002, CU004, CU014]
