      - number: '6.3'
        title: Retention, concentration, and continuity remain open
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not disclose current named OEM programs, customer count, contract duration,
              renewals, churn, net or gross retention, per-account revenue, or customer concentration. A November 2025
              Yicai report said Haomo had reportedly suspended operations and relayed employee accounts of leave notices
              and salary arrears; Haomo had not publicly responded in that report. This is dated adverse reporting, not
              proof of present operating status, but it makes support continuity and the status of historical
              deployments material diligence items. Market research points to broader ADAS and delivery demand, while
              also describing buyer preference for integrated solutions; none of those category-level sources verifies
              Haomo's current customer traction. [CU007, CU008, CU009, CU010, CU011, CU012, CU013]
