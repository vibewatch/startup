            title: Current Haomo status remains a diligence blocker
            body: >-
              CarNewsChina reported an operational suspension in November 2025 but also said Haomo and Great Wall had
              not clarified whether it was temporary, a dissolution, or a restructuring. Obtain current confirmation of
              active contracts, employees, technical support, and legal operating status before treating historical
              deployment as durable competitive capacity.
            calloutType: risk
