      - number: '3.4'
        title: Execution and commercialization risks temper positioning claims
        blocks:
          - type: paragraph
            body: >-
              A 2025 CarNewsChina report said Haomo had suspended operations after staff were told not to report to
              work, while explicitly noting that neither Haomo nor Great Wall had clarified whether this meant temporary
              suspension, dissolution, or restructuring. This is adverse reporting, not confirmation of current
              insolvency or closure. Competitive pressure is also visible in the cited market analysis: software-only
              suppliers face a reported contract decline, while L4 players face cost and policy constraints and some
              pursue L2++ or staged commercialization. A 36Kr-hosted BT Finance article compares Tesla, Huawei, and
              Momenta through asserted scenario-specific failure modes, but it is commentary rather than an independent
              controlled benchmark. The evidence does not establish current safety outcomes, pricing, customer
              retention, or a durable performance moat; current program and operational status require direct
              verification.
            claimRefs:
              - CP004
              - CP005
              - CP010
              - CP011
              - CP012
              - CP013
