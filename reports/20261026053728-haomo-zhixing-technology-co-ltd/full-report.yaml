  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory exposure is rising, while company readiness is unverified
        blocks:
          - type: paragraph
            body: >-
              China's February 2026 automotive-data guidance makes cross-border transfer controls and
              self-identification of important data directly relevant to automotive software suppliers, including
              autonomous-driving providers. DLA Piper describes required internal responsibility, transfer approval
              procedures, and three-year transfer-log retention; SCIO confirms that the guidance covers important-data
              identification, export processes, and security protections. Separately, MIIT and SAMR's 2025 notice
              addresses admission, recalls, OTA updates, and safety-event reporting for connected vehicles with combined
              driver-assistance systems. These requirements create potentially high consequences for an ADAS supplier
              whose software or data flows are embedded in customer vehicles, but none of the assigned sources
              demonstrates whether Haomo has filed, tested, or audited the relevant controls. The exposure is thus
              material; the probability of a Haomo-specific breach cannot be responsibly scored from this record.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
      - number: '7.2'
        title: Product safety, software changes, and validation require customer-level proof
        blocks:
          - type: paragraph
            body: >-
              The 2025 MIIT/SAMR notice described by CMS requires additional technical parameters and verification
              materials, and addresses accident/event reporting, OTA filings, and product recalls. Mint reports that a
              fatal Xiaomi crash prompted intensified scrutiny of assisted-driving claims; that event is sector context,
              not evidence of a Haomo incident. ArenaEV's historical account gives price and capability claims for
              Haomo's HP-series kits, but does not independently establish production volumes, safety outcomes, or
              present-day product availability. A separate DriveGPT paper on arXiv describes its own planning and
              prediction evaluations; it does not identify Haomo or validate Haomo's system. Taken together, these
              sources justify a high-impact safety and validation diligence priority, not a conclusion that Haomo's
              products failed or are non-compliant. Require product-specific verification, incident, OTA, and recall
              records before assigning likelihood or mitigation maturity.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
