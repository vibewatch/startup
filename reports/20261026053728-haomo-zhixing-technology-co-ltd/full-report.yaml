      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Treat historical product counts as a starting point, not proof of current operations
            body: >-
              Past model counts, mileage, planned OEM deliveries, and reported logistics use cases do not establish
              current programs, safety performance, or service continuity. Request dated vehicle-level acceptance,
              intervention, incident, and support records before underwriting deployment maturity.
            calloutType: risk
            claimRefs:
              - CE004
              - CE005
              - CE012
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer segments and public relationship evidence
        blocks:
          - type: paragraph
            body: >-
              Haomo's customer-facing evidence spans two distinct buyer groups: passenger-vehicle manufacturers
              integrating assisted-driving software, and logistics or retail operators using low-speed delivery
              vehicles. The sources do not identify the payers, contract values, fleet ownership, or revenue share for
              the named relationships, so product fit and reported deployment should not be conflated with recurring
              commercial revenue. Haomo's April 2024 announcement named Alibaba, Wumart, Meituan, and Dada Kuai Song as
              logistics collaborators and described Wumart-associated Xiao Motuo deliveries in Beijing; a separate
              report described a planned Hyundai model using DriveGPT. These are historical relationship signals, not
              confirmation that the programs remain live in October 2026. A separate 2026 article reports Meituan
              delivery-fleet activity but does not link those units to Haomo, so the named collaboration cannot be read
              as Haomo-supplied deployment. [CU003, CU004, CU005, CU015]
            claimRefs:
              - CU003
              - CU004
