  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: vehicle ADAS first, autonomy adjacencies second'
        blocks:
          - type: paragraph
            body: >-
              The most defensible core market is ADAS/AD systems supplied into passenger vehicles, especially L2 and L2+
              assistance: TechCrunch described Haomo as focused on L2 ADAS for passenger cars, and IDTechEx described
              automakers shifting toward integrated, cost-effective ADAS offerings. This boundary includes software,
              sensors, compute, integration and program support only where they are part of the vehicle supplier award;
              the available evidence does not disclose Haomo's prices or the value of those awards. China reporting
              separately describes highway NOA and urban NOA as faster-growing, higher-function layers, but supplies no
              installation totals in the cited excerpt. Personal-vehicle L3, Robotaxi L4 and low-speed
              delivery/logistics are adjacent application markets with different approval, fleet and operating
              economics; they should not be added to passenger-car ADAS spend as if they were the same buyer pool.
              Smart-cockpit hardware is another adjacent category, not demonstrated Haomo revenue. The figure is a
              qualitative boundary map, not a proportional market-size pyramid.
            claimRefs:
              - CM001
              - CM004
              - CM008
              - CM011
