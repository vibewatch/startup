              passenger-car ADAS was mostly sold to its largest shareholder and that the system had powered more than 20
              vehicle models; CarNewsChina separately reported more than 20 GWM-brand models. Those reports are
              historical and do not verify live programs today. The same evidence set reports Huawei ADS deployment in
