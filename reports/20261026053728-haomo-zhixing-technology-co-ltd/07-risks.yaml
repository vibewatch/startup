chapter:
  number: 7
  title: Risks
  summary: Public evidence points to material regulatory, product-safety, data-governance, and commercial-dependency exposures for an autonomous-driving supplier, but does not establish Haomo's current compliance posture, incident record, or live customer concentration. The risk ranking therefore emphasizes consequential external requirements and treats company-specific likelihood and mitigation maturity as unverified.
sections:
  - id: regulatory-exposure
    title: Regulatory exposure is rising, while company readiness is unverified
    body: >-
      China's February 2026 automotive-data guidance makes cross-border transfer
      controls and self-identification of important data directly relevant to
      automotive software suppliers, including autonomous-driving providers.
      DLA Piper describes required internal responsibility, transfer approval
      procedures, and three-year transfer-log retention; SCIO confirms that the
      guidance covers important-data identification, export processes, and
      security protections. Separately, MIIT and SAMR's 2025 notice addresses
      admission, recalls, OTA updates, and safety-event reporting for connected
      vehicles with combined driver-assistance systems. These requirements
      create potentially high consequences for an ADAS supplier whose software
      or data flows are embedded in customer vehicles, but none of the assigned
      sources demonstrates whether Haomo has filed, tested, or audited the
      relevant controls. The exposure is thus material; the probability of a
      Haomo-specific breach cannot be responsibly scored from this record.
    claimRefs: [CR001, CR002, CR003, CR004, CR005]
    tableRefs: [TR001]
  - id: product-safety-and-technical
    title: Product safety, software changes, and validation require customer-level proof
    body: >-
      The 2025 MIIT/SAMR notice described by CMS requires additional technical
      parameters and verification materials, and addresses accident/event
      reporting, OTA filings, and product recalls. Mint reports that a fatal
      Xiaomi crash prompted intensified scrutiny of assisted-driving claims;
      that event is sector context, not evidence of a Haomo incident. ArenaEV's
      historical account gives price and capability claims for Haomo's HP-series
      kits, but does not independently establish production volumes, safety
      outcomes, or present-day product availability. A separate DriveGPT paper
      on arXiv describes its own planning and prediction evaluations; it does
      not identify Haomo or validate Haomo's system. Taken together, these
      sources justify a high-impact safety and validation diligence priority,
      not a conclusion that Haomo's products failed or are non-compliant.
      Require product-specific verification, incident, OTA, and recall records
      before assigning likelihood or mitigation maturity.
    claimRefs: [CR004, CR005, CR006, CR007, CR008, CR009]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: commercial-and-execution-dependencies
    title: Commercial leverage and financial resilience are not established by historical reports
    body: >-
      TechCrunch's February 2024 reporting described Great Wall as Haomo's
      largest shareholder and said Haomo sold mostly to that shareholder at the
      time, while reporting a first CNY 100 million tranche of a Series B.
      Those are dated third-party reports, not evidence of current order
      concentration, binding support, or cash available. The same report
      mentioned an agreement to develop robotics for a Chengdu district; it
      does not establish whether that project remains active or funds Haomo
      today. Separately, IDTechEx's published analysis reported a 37% year-on-year
      fall in 2024 new contracts for software-only ADAS vendors, a market
      pressure signal rather than a Haomo-specific result. Since the assigned
      sources do not establish Haomo's current OEM mix, contract backlog,
      receivables, debt, or liquidity, the ranking of commercial and solvency
      risks remains conditional. Obtain current contracts and financial
      schedules; do not treat historical funding raised as available cash.
    claimRefs: [CR010, CR011, CR012, CR013]
    tableRefs: [TR003]
  - id: decision-triggers
    title: Decision gates should be tied to evidence, not assumed mitigations
    body: >-
      The highest-priority diligence gates are documentary: reconcile Haomo's
      current product approvals and OTA filings to each active vehicle program;
      inspect data inventories, transfer assessments, access controls, and
      retention logs; and obtain customer-level shipment, renewal, and payment
      evidence. A verified reportable safety event, an unremediated filing or
      recall deficiency, or loss of a critical OEM program would materially
      worsen the thesis. Conversely, independently reviewed compliance
      artifacts, current multi-OEM contracts, and evidence of funded operating
      runway would reduce uncertainty. None of these triggers is asserted to
      have occurred. The assigned sources also do not establish the absence of
      incidents, claims, employee disputes, or regulatory actions; those are
      specific search and document-review gaps rather than negative findings.
    claimRefs: [CR003, CR005, CR010, CR012, CR014]
