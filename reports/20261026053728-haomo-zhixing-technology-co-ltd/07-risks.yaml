  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: company-specific-regulatory-and-data-controls
      missingEvidence: Current Haomo product approval records, OTA filings, important-data assessments, cross-border transfer approvals, safety-case documents, audits, and regulator correspondence.
      whyItMatters: Without company-specific control evidence, public regulatory requirements cannot establish whether Haomo is compliant or estimate the likelihood of enforcement, recall, or delayed customer programs.
      diligencePath: Request a product-by-product compliance matrix and underlying MIIT/SAMR filings, data inventories, transfer assessments, audit results, and regulator correspondence; verify samples with counsel.
      relatedQuestionRefs: [QR001, QR002, QR003, QR006]
      relatedTableRefs: [TR001, TR002]
    - type: private-evidence-only
      severity: material
      topic: current-customer-concentration-and-contract-status
      missingEvidence: Current signed OEM and logistics contracts, production status, customer-level revenue and backlog, renewal terms, receivables, and referenceable customer outcomes.
      whyItMatters: Historical 2024 customer and shareholder relationships do not establish current demand, concentration, renewal probability, or cash collection.
      diligencePath: Obtain current contracts and a customer-level schedule reconciled to invoices, deployments, renewals, receivables, and customer confirmations.
      relatedQuestionRefs: [QR004, QR007]
      relatedTableRefs: [TR003]
    - type: private-evidence-only
      severity: blocking
      topic: current-liquidity-and-obligations
      missingEvidence: Current unrestricted cash, debt, payables, payroll status, contingent liabilities, project funding terms, and monthly cash flows.
      whyItMatters: A historical fundraising tranche is not current cash available to fund operations, and no assigned source provides the denominator needed to assess runway or solvency.
      diligencePath: Review monthly management accounts, bank statements, debt and payables aging, payroll records, cash restrictions, and the current financing plan.
      relatedQuestionRefs: [QR007]
      relatedTableRefs: [TR003]
    - type: missing-source
