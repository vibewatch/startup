  - type: private-evidence-only
    severity: material
    topic: current company profile
    missingEvidence: Current valuation, revenue or run-rate, cash, debt, headcount, and active customer or OEM counts.
    whyItMatters: >-
      These measures determine the company's present scale, capital needs, solvency, and commercial traction; historical
      funding and deployment figures cannot substitute for them.
    diligencePath: >-
      Request current management financials, a cash-and-liabilities schedule, dated employee counts, and a
      customer/program roster with contract and production status.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: leadership
    missingEvidence: A current founder, executive, and board roster with role histories and governance responsibilities.
    whyItMatters: >-
      The available report names one CEO at a historical date and cannot establish founder-market fit, functional
      coverage, succession depth, or current key-person exposure.
    diligencePath: >-
      Obtain a current organization chart, board roster, biographies, and confirmation of leadership changes directly
      from the company or filings.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
