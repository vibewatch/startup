company:
  name: Haomo Zhixing Technology Co., Ltd.
chapter:
  number: 1
  title: Company Overview
  summary: TechCrunch's February 2024 reporting describes Haomo as a Great Wall Motor-backed autonomous-driving supplier focused on passenger-car ADAS and logistics automation, while a technical commentary documents its DriveGPT planning model and raises an unresolved production-deployment question. The available company-specific evidence is historical; current leadership, finances, operating scale, and program status remain unverified.
sections:
  - id: identity-and-product
    title: Identity, product scope, and disclosed operating evidence
    body: >-
      TechCrunch described Haomo.ai in February 2024 as an autonomous-driving startup backed by Great Wall Motor. It reported a passenger-car Level 2 advanced driver-assistance focus and Level 4 solutions for logistics vehicles, with Great Wall as the largest shareholder and principal customer in that account. The same article reported that Haomo's systems had powered more than 20 vehicle models and accumulated about 120 million kilometers, attributing those figures to the company; it also said the delivery vans had transported close to 300,000 grocery parcels. These are dated, company-attributed historical operating indicators, not current customer, revenue, or utilization measures.

      A separate technical blog says Haomo announced DriveGPT at its 2023 AI Day and characterizes it as a GPT-style autoregressive Transformer for driving planning and reasoning. The author distinguishes model-development ambition from production readiness and questions the feasibility of running the generative model on an in-vehicle system-on-chip in real time. That critique is an analyst's assessment, not evidence that deployment failed. No assigned source establishes current product availability, supported vehicle programs, or a present-day commercial fleet.
    claimRefs: [CO001, CO003, CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: leadership-and-capital
    title: Leadership, ownership, and capital evidence
    body: >-
      The available leadership evidence identifies Gu Weihao as CEO and describes him as a Baidu smart-car veteran, but this is a February 2024 report and does not establish his current role. The assigned sources do not identify Haomo's founders, board, governance arrangements, or executive changes. Those gaps prevent a current assessment of key-person dependence or functional leadership coverage.

      TechCrunch reported a 100 million yuan ($14 million) first tranche of Series B financing led by Chengdu Wufa Private Equity Fund Management, and separately cited ITJuzi for more than $200 million of equity funding raised by that time. The reported total is not cash available, and the article supplies no current valuation, debt, cash, revenue, or runway. Great Wall Motor, Meituan, and Qualcomm Ventures were identified as past investors; Great Wall was also described as the largest shareholder. The dated report is not a current cap-table or financing confirmation.
    claimRefs: [CO002, CO004, CO005, CO011, CO016]
    tableRefs: [TO002, TO003]
  - id: market-and-regulatory-context
    title: Commercial context and regulatory exposure
    body: >-
      The surrounding China market is moving toward broader assisted-driving deployment and more integrated supplier offerings, but these market indicators should not be read as Haomo results. IDTechEx reported that 52 percent of Chinese new-energy-vehicle startup sales in 2024 supported L2+ functionality and described a shift toward full-stack suppliers; Gasgoo's 2026 article also described hardware-software integration and rising emphasis on real-world system performance. Driving Vision News reported more than 1.3 million passenger-car LiDAR installations in China in the first four months of 2026. These sources establish competitive context, not Haomo market share or product adoption.

      A Law.asia article authored by Fangda Partners describes China's autonomous-vehicle rules as a layered framework with local pilot mechanisms and notes that, at the article's publication, specific national access standards for mass-produced L3-and-above vehicles had not been formally issued. Its publication date is not stated in the fetched text, so that regulatory description is not treated as a current legal status. The same article describes liability and data-security obligations as material operating considerations. Current approvals, compliance findings, and any company-specific incidents are not established by the assigned evidence.
    claimRefs: [CO012, CO013, CO014, CO015]
  - id: diligence-implications
    title: Evidence boundary and unresolved diligence
    body: >-
      The strongest company-specific evidence is a single independent news report from February 2024, supplemented by a technical blog on DriveGPT. It supports a historical outline of ownership, funding, products, and disclosed operating indicators, but it does not establish current performance or financial condition. Industry publications add context but do not corroborate Haomo-specific customer, scale, or funding claims. In particular, no current valuation, revenue or run-rate, headcount, customer count, funding position, cash/debt profile, or board composition can be responsibly stated from this pool.

      A current company filing or signed investor and OEM confirmation would be needed to update the ownership and financing record; direct management and board materials would be needed to verify leadership, governance, and key-person coverage. Current vehicle-program evidence should identify the OEM, supported model, production period, and active service obligations. Financial statements or a current cash-and-liabilities schedule would be necessary to assess solvency and restart capacity. The available technical criticism warrants a diligence question about real-time deployment, not a conclusion about present product failure.
    claimRefs: [CO002, CO005, CO010, CO016]
