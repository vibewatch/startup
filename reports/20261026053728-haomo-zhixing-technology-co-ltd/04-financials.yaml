      - [Gross margin by product and customer, null, Low, "Required to test contribution economics; reconcile revenue to compute, sensors, installation, support, and warranty costs"]
      - [ADAS BOM and installation cost per vehicle, null, Low, "Required to assess OEM program margin; obtain supplier quotes, bill of materials, and installation labor"]
      - [R&D expense and capitalization policy, null, Low, "Required to understand cash cost and accounting treatment; obtain audited statements and project-level spend"]
      - [DriveGPT compute and inference cost, null, Low, "The blog's concern is qualitative, not a measured unit cost; obtain on-vehicle and cloud inference benchmarks"]
      - ["Sales cycle, CAC, and payback", null, Low, "OEM relationships do not establish acquisition economics; obtain funnel, sales cost, contract timing, and payback by program"]
      - [Customer concentration and receivables, null, Low, "Great Wall is described as the largest shareholder and main buyer; obtain customer revenue shares, receivable aging, and collection history"]
      - [Working capital and capex, null, Low, "Required to assess production financing; obtain inventory, supplier terms, capex commitments, and cash-conversion cycle"]
      - ["Cash, debt, payables, and contingent liabilities", null, Low, "No current balance-sheet evidence in the assigned pool; obtain bank confirmations, debt schedules, payables aging, and legal contingencies"]
      - [Monthly cash burn and runway, null, Low, "Funding raised is not cash available; obtain current unrestricted cash and a reconciled monthly cash-flow forecast"]
      - [Next financing trigger and use of proceeds, null, Low, "Historical financing does not establish a binding bridge; obtain board-approved plan, financing commitments, and milestone-linked uses"]
      - [Operating break-even scale for Haomo, null, Low, "Pony.ai's executive estimate is not transferable; obtain Haomo-specific fleet, utilization, margin, and fixed-cost break-even model"]
    notes: "All nulls are unavailable in the assigned evidence, not estimates or zeros. Sector observations and competitor comparisons are not Haomo unit-economic benchmarks."
    claimRefs: [CI001, CI002, CI003, CI008, CI009, CI010, CI012, CI013, CI014, CI015, CI016]
