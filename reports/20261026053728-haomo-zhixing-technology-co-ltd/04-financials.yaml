company:
  name: Haomo Zhixing Technology Co., Ltd.
chapter:
  number: 4
  title: Financials
  summary: Public evidence describes Haomo's OEM-linked ADAS business, delivery-vehicle activity, a historical Series B tranche, and an adverse report with a material date inconsistency. It does not disclose current revenue, realized pricing, margins, cash, liabilities, or runway, so the available record supports a commercial model hypothesis but not financial underwriting.
sections:
  - id: revenue-model-and-traction
    title: Revenue model and public traction
    body: >-
      The strongest disclosed revenue path is ADAS supplied into passenger-vehicle
      programs, with Great Wall Motor identified as Haomo's largest shareholder
      and the main customer in the TechCrunch account; the article also relays a
      company spokesperson's statement that Haomo supplied three other unnamed
      OEMs. This suggests an OEM-program model, but the evidence does not give
      per-vehicle fees, contract duration, minimum volumes, production deliveries,
      or recognized revenue. TechCrunch separately described L4 solutions for
      logistics vehicles and named Meituan, Alibaba, and JD.com among clients,
      while a Chengdu investment was tied to a robotics-development agreement.
      These are evidence of activity or relationships, not proof of recurring
      revenue or collected cash. The public traction figures in that article
      were company claims, not audited unit or revenue disclosures.
    claimRefs: [CI001, CI003, CI004, CI005, CI006, CI007]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: revenue-quality-and-pricing
    title: Revenue quality, pricing, and recognition
    body: >-
      No assigned source provides a current revenue figure, ARR, GMV, realized
      price, revenue mix, gross margin, or recognition policy for Haomo. Historical
      capital raised must not be treated as operating revenue or cash available.
      The OEM concentration signal also matters: the article calls Great Wall
      Haomo's largest shareholder and describes it as the main buyer, while the
      other three OEMs are unnamed. Without customer-level sales and collection
      data, an investor cannot distinguish contracted programs from active
      production, shipments from accepted units, or reported customer activity
      from monetized usage. Sector reports discuss capital pressure and a shift
      toward full-stack systems, but those observations do not establish Haomo's
      own pricing power or revenue quality.
    claimRefs: [CI002, CI003, CI005, CI008, CI010, CI011]
    tableRefs: [TI002]
  - id: delivery-costs-and-commercial-efficiency
    title: Delivery costs and commercial efficiency
    body: >-
      The sources identify plausible cost drivers without quantifying Haomo's
      cost base. An independent analyst article describes software-only ADAS
      vendors facing contract pressure and says cost optimization and scale
      matter across the sector; a separate market article flags a higher hardware
      cost for a competing lidar-based system than for pure vision, not a Haomo
      bill of materials. A technical blog author questions whether generative
      DriveGPT inference can run economically on vehicle compute, but offers no
      measured Haomo cost. China compliance commentary describes approval,
      reporting, and technical-documentation obligations; it is not a regulator
      filing and does not quantify Haomo's compliance spend. CAC, sales cycle,
      installation expense, warranty costs, capex, utilization, and working
      capital therefore remain unavailable.
    claimRefs: [CI010, CI012, CI013, CI014, CI015]
  - id: capital-adequacy-and-underwriting
    title: Capital adequacy and underwriting verdict
    body: >-
      TechCrunch reported a 100 million yuan (about $14 million) first tranche
      of Series B funding in February 2024 and cited ITJuzi for more than $200
      million of cumulative equity funding. Those historical proceeds do not
      establish today's cash balance, debt, payables, burn, or runway. Research
      and Markets describes business-model and financing pressure among some
      autonomous-driving companies, while its Pony.ai executive break-even
      estimate is company-specific and cannot be transferred to Haomo. A Yicai
      article fetched for this refresh carries publication metadata dated
      2026-10-26 but its body begins with a November 25 dateline and describes
      events after the report's 2026-10-26 as-of date; it is not reliable proof
      of Haomo's current operating or liquidity status. The verdict is therefore
      that commercial activity is visible but financial resilience is
      un-underwritable without current company records.
    claimRefs: [CI001, CI002, CI008, CI009, CI016]
    tableRefs: [TI003]
