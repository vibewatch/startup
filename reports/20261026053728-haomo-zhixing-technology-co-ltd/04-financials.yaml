      diligencePath: Obtain audited financial statements, monthly management accounts, signed OEM schedules, invoices, acceptance records, and customer-level revenue and collection reconciliations.
      relatedQuestionRefs: [QI003, QI004]
      relatedTableRefs: [TI001, TI002]
    - type: private-evidence-only
      severity: blocking
      topic: unit-economics
      missingEvidence: Product-level gross margin, bill of materials, compute and cloud cost, installation, support, warranty, and R&D allocation.
      whyItMatters: The business may require costly hardware, software development, and field support, but public comparators do not establish Haomo's own contribution margin.
      diligencePath: Request SKU- and customer-level cost ledgers, supplier quotes, cloud/compute invoices, support costs, and a reconciliation to audited gross profit.
      relatedQuestionRefs: [QI005, QI010]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: blocking
      topic: liquidity-and-capital
      missingEvidence: Current unrestricted cash, debt, payables aging, contingent liabilities, monthly burn, runway, and binding financing commitments.
      whyItMatters: Historical funding raised is not cash available, and current solvency cannot be assessed from the assigned evidence.
      diligencePath: Obtain bank confirmations, debt and guarantee schedules, payroll and supplier aging, legal claims, a 13-week cash forecast, and executed bridge-financing documents.
