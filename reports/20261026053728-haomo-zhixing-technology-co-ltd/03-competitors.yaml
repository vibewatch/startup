    approximationNotes: >-
      Both axes use analyst-assigned ordinal evidence scores from 1 to 5, based only on the cited descriptions. Scores measure how much comparable footprint or integration detail this pool contains, not real-world capability; sparse disclosure is not proof of weak performance. The panel midpoints are visual dividers, not benchmark thresholds, and the plotted positions do not establish a winner.
