company:
  name: Haomo Zhixing Technology Co., Ltd.
chapter:
  number: 3
  title: Competitors
  summary: Public evidence places Haomo in a crowded China ADAS market spanning software-focused suppliers, integrated platforms, and L4 specialists moving toward nearer-term products. Historical Haomo deployment and OEM ties are documented, but its present operating status, current customer programs, pricing, and relative system performance remain unverified.
sections:
  - id: competitive-landscape
    title: A crowded supplier field with overlapping routes
    body: >-
      The available evidence supports a layered rather than exhaustive landscape. TechCrunch identified Pony.ai, WeRide, Momenta, and DeepRoute as Haomo's Chinese autonomous-driving peers in February 2024, while describing a broader shift by L4-oriented firms toward L2 or L3 products that could be deployed sooner. A separate IDTechEx analysis groups Momenta, WeRide, QCraft, and Baidu Apollo as software-only suppliers and contrasts them with integrated providers including Huawei, Mobileye, Horizon Robotics, Black Sesame, and Bosch. These are different classifications and dates, not a head-to-head performance ranking. The evidence does not establish the full set of OEM in-house programs, manual-driving status quo alternatives, or newer entrants, so the landscape table is a sourced sample rather than a complete market census.
    claimRefs:
      - CP003
      - CP004
      - CP006
    tableRefs:
      - TP001
  - id: scale-and-integration
    title: Scale evidence is uneven and denominator-specific
    body: >-
      Haomo's historical footprint was tied closely to Great Wall Motor: TechCrunch reported that its passenger-car ADAS was mostly sold to its largest shareholder and that the system had powered more than 20 vehicle models; CarNewsChina separately reported more than 20 GWM-brand models. Those reports are historical and do not verify live programs today. The same evidence set reports Huawei ADS deployment in 503,000 vehicles through three automakers during 2024 and says Momenta collaborated with more than 40 OEMs, but neither number is a comparable market-share measure. Gasgoo's January-April 2026 figures are LiDAR component installations, not ADAS vehicle deployments: Hesai recorded 456,986 units (35.0%) and Huawei 398,057 units (30.5%). The metrics indicate different forms of scale and must stay separate.
    claimRefs:
      - CP001
      - CP002
      - CP007
      - CP008
      - CP009
      - CP016
    tableRefs:
      - TP002
    figureRefs:
      - FP001
  - id: buyer-tradeoffs
    title: OEM access and integration matter more than a feature-list comparison
    body: >-
      The available supplier comparisons point to OEM access, system integration, and cost as important buying dimensions, but they do not disclose realized prices or contract terms. IDTechEx reports that automakers increasingly favor cost-effective full-stack partnerships over modular software offerings and that new contracts signed by software-only vendors fell 37% year over year in 2024. That is a category-level signal, not proof that a named supplier lost a particular Haomo program. Haomo's reported Great Wall relationship offers a clear distribution anchor but also leaves customer concentration and the availability of independent channels unresolved. No assigned source quantifies switching costs, multi-homing, OEM build-versus-buy economics, or the support obligations attached to a system; those gaps prevent a defensible total-cost or lock-in comparison.
    claimRefs:
      - CP001
      - CP005
      - CP006
    tableRefs:
      - TP003
  - id: durability-and-evidence-gaps
    title: Execution and commercialization risks temper positioning claims
    body: >-
      A 2025 CarNewsChina report said Haomo had suspended operations after staff were told not to report to work, while explicitly noting that neither Haomo nor Great Wall had clarified whether this meant temporary suspension, dissolution, or restructuring. This is adverse reporting, not confirmation of current insolvency or closure. Competitive pressure is also visible in the cited market analysis: software-only suppliers face a reported contract decline, while L4 players face cost and policy constraints and some pursue L2++ or staged commercialization. A 36Kr-hosted BT Finance article compares Tesla, Huawei, and Momenta through asserted scenario-specific failure modes, but it is commentary rather than an independent controlled benchmark. The evidence does not establish current safety outcomes, pricing, customer retention, or a durable performance moat; current program and operational status require direct verification.
    claimRefs:
      - CP004
      - CP005
      - CP010
      - CP011
      - CP012
      - CP013
tables:
  - id: TP001
    title: Competitor and alternative landscape (sourced sample)
    columns:
      - Provider or group
      - Competitive role
      - Public evidence in assigned sources
      - Limitation for comparison
    rows:
      - - Haomo
        - Focal L2 ADAS supplier with an adjacent L4 logistics offer in historical reporting
        - TechCrunch reported L2 ADAS sales mostly to Great Wall and more than 20 vehicle models; CarNewsChina also reported more than 20 GWM-brand models
        - Reports date from 2024-2025 and do not establish current operations or active contracts
      - - Momenta
        - Direct ADAS supplier peer; categorized as software-only in an IDTechEx article
        - IDTechEx said it collaborated with 40+ OEMs; TechCrunch listed it among Haomo's peers
        - Collaboration count has no disclosed period, denominator, or signed-production split
      - - WeRide, Pony.ai, and DeepRoute
        - Direct or adjacent autonomous-driving suppliers; L4-to-L2/L3 route overlaps by use case
        - TechCrunch named all three as Haomo peers; IDTechEx grouped WeRide among software-only vendors
        - The sources do not provide comparable current ADAS deployments or contract economics
      - - Huawei
        - Integrated ADAS alternative and a major component supplier
        - IDTechEx reported 503,000 Huawei ADS vehicle deployments through three automakers in 2024; Gasgoo reported Huawei LiDAR installations separately
        - Vehicle deployments and LiDAR component installations are different metrics
      - - Mobileye, Horizon Robotics, Black Sesame, and Bosch
        - Integrated platform or incumbent supplier alternatives
        - IDTechEx classifies these providers as full-stack; its article also describes Mobileye's move to entry-level Zeekr models in 2025
        - No comparable supplier-level revenue, realized pricing, or performance benchmark is supplied
      - - OEM internal development and status quo
        - Potential build-versus-buy or non-ADAS alternatives to a third-party system
        - The assigned IDTechEx article reports OEM preference for cost-effective full-stack partnerships
        - Specific in-house programs, manual-driving alternatives, switching costs, and buyer decisions are not documented
    notes: >-
      Sourced landscape sample from the assigned prefetched materials, not an exhaustive enumeration. Provider classifications come from different publications and dates; no row implies equivalent product scope or measured performance.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP006
      - CP007
      - CP008
      - CP013
  - id: TP002
    title: Publicly reported scale and integration indicators
    columns:
      - Provider or metric
      - Reported evidence
      - Period and denominator
      - What it does not establish
    rows:
      - - Haomo vehicle-model footprint
        - More than 20 models; TechCrunch also reports about 120 million kilometers of driving
        - Historical company-reported figures relayed by TechCrunch in February 2024; CarNewsChina later reports more than 20 GWM-brand models
        - Current active vehicles, unique customers, or current program status
      - - Huawei ADS vehicle deployments
        - 503,000 vehicles through partnerships with three major automakers
        - IDTechEx report, 2024 deployments
        - Market share, revenue, utilization, or comparability with model counts
      - - Momenta OEM collaboration
        - More than 40 OEMs
        - IDTechEx article; period and definition of collaboration are not specified
        - Production contracts, shipped vehicles, or revenue per OEM
      - - China LiDAR installations
        - "Hesai: 456,986 units (35.0%); Huawei: 398,057 units (30.5%); combined share reported as 65.5%"
        - Gasgoo Automotive Research Institute, China, January-April 2026 LiDAR installations
        - ADAS system deployments or the market share of complete driving systems
    notes: >-
      Values retain the source's metric, period, geography, and denominator where stated. The source set mixes model counts, vehicle deployments, OEM collaborations, driving distance, and component installations; they are not a common scale measure.
    claimRefs:
      - CP002
      - CP007
      - CP008
      - CP009
      - CP016
  - id: TP003
    title: Pricing, packaging, and capability evidence
    columns:
      - Provider
      - Documented product or integration
      - Price or contract terms in assigned evidence
      - Buyer-facing implication and unresolved point
    rows:
      - - Haomo
        - L2 passenger-car ADAS and L4 logistics solutions in TechCrunch's 2024 account
        - Not disclosed in assigned sources
        - Great Wall was reported as the largest shareholder and principal customer; current concentration, support terms, and other live channels are unknown
      - - Huawei
        - IDTechEx describes a full-stack ADS platform; reported deployments span three automakers in 2024
        - Not disclosed in assigned sources
        - Integration breadth is a competitive factor, but no comparable vehicle-level price or realized margin is given
      - - Momenta
        - IDTechEx categorizes it as software-only and reports 40+ OEM collaborations
        - Not disclosed in assigned sources
        - Contract count and collaboration scope do not establish unit economics or production volume
      - - Mobileye and other integrated providers
        - IDTechEx describes full-stack offerings; Mobileye's position at Zeekr is reported to have shifted toward entry-level models in 2025
        - Not disclosed in assigned sources
        - Product placement is not a price comparison; OEM switching and bundling terms remain unverified
    notes: >-
      No listed price, realized price, contract value, discount, or package contents could be substantiated from the assigned prefetched text. “Not disclosed” means absent from this evidence set, not that providers have no pricing or contracts.
    claimRefs:
      - CP001
      - CP005
      - CP006
      - CP007
      - CP008
