chapter:
  number: 2
  title: Market Analysis
  summary: Public evidence places Haomo's core opportunity in passenger-vehicle L2/L2+ ADAS, with higher-level autonomy and low-speed logistics as adjacent markets. Available sources show adoption and component-installation signals, but do not disclose an auditable China TAM, segment revenue pool, or Haomo-specific buyer budget.
sections:
  - id: market-boundary
    title: "Market boundary: vehicle ADAS first, autonomy adjacencies second"
    body: >-
      The most defensible core market is ADAS/AD systems supplied into passenger vehicles, especially L2 and L2+ assistance: TechCrunch described Haomo as focused on L2 ADAS for passenger cars, and IDTechEx described automakers shifting toward integrated, cost-effective ADAS offerings. This boundary includes software, sensors, compute, integration and program support only where they are part of the vehicle supplier award; the available evidence does not disclose Haomo's prices or the value of those awards. China reporting separately describes highway NOA and urban NOA as faster-growing, higher-function layers, but supplies no installation totals in the cited excerpt. Personal-vehicle L3, Robotaxi L4 and low-speed delivery/logistics are adjacent application markets with different approval, fleet and operating economics; they should not be added to passenger-car ADAS spend as if they were the same buyer pool. Smart-cockpit hardware is another adjacent category, not demonstrated Haomo revenue. The figure is a qualitative boundary map, not a proportional market-size pyramid.
    claimRefs: [CM001, CM004, CM008, CM011]
    tableRefs: [TM001]
    figureRefs: [FM001]
  - id: sizing-lenses
    title: "Observable adoption is not a disclosed addressable-spend estimate"
    body: >-
      The evidence supports several non-comparable market lenses rather than a stitched TAM. IDTechEx reported that 52 percent of Chinese new-energy-vehicle startups' total vehicle sales supported L2+ functionality in 2024; that denominator is startup vehicle sales, not all vehicles, ADAS revenue or Haomo share. Gasgoo's January–April 2026 LiDAR installations offer a component-volume signal: it reported 456,986 Hesai units at 35.0 percent share and 398,057 Huawei units at 30.5 percent, with the two at 65.5 percent combined. Those LiDAR figures do not measure the whole ADAS market. Tracxn displayed $457 million of funding for China's autonomous-vehicle sector in 2026 to date, which is capital raised, not customer spend, revenue or cash available to suppliers. The other reports describe growth or market direction without supplying comparable China segment values, CAGR, ASPs or a transparent vehicle-by-feature denominator. No source in this allocation supports a numeric Haomo TAM, SAM or SOM.
    claimRefs: [CM002, CM003, CM005, CM006, CM009, CM010]
    tableRefs: [TM002]
  - id: buyers-adoption-constraints
    title: "OEM program economics and deployment constraints shape adoption"
    body: >-
      The likely buying path for passenger-car ADAS is an OEM vehicle-program decision, with the driver as user and the commercial payer governed by an undisclosed supplier contract or vehicle bill of materials. TechCrunch reported Haomo's historical L2 focus and said the company claimed its solutions had powered more than 20 vehicle models; this is evidence of programs, not current active awards, unit shipments or revenue. IDTechEx reported that software-only vendors' new contracts fell 37 percent year over year in 2024 and described automaker preference for cost-effective full-stack partnerships, while Gasgoo emphasized real-world performance, mass-production capability and cost optimization. These indicate procurement criteria, not proof of Haomo's conversion or margin. L3/L4 adoption faces separate regulatory and capital constraints: TechCrunch characterized L4 as capital-intensive and years from broad adoption, and a Research and Markets report cited a 50 percent decline in California autonomous-vehicle test mileage in 2024 versus 2023. Neither measure establishes Chinese demand. Buyer budget ownership, ASPs, switching costs, program economics, live OEM awards and the share of spend available to Haomo remain unverified.
    claimRefs: [CM003, CM004, CM007, CM009, CM011, CM012, CM014]
    tableRefs: [TM003]
tables:
  - id: TM001
    title: Market boundary and adjacent spend
    columns: ["Segment", "Included scope", "Buyer / user / payer evidence", "Boundary and relevance"]
    rows:
      - ["Passenger-vehicle L2/L2+ ADAS", "Vehicle-integrated assistance software and relevant sensor/compute/integration spend within an OEM program", "OEM vehicle-program buyer is inferred; driver is the user; contract payer and pricing are not disclosed", "Core market indicated by Haomo's reported passenger-car L2 focus; no spend or Haomo share disclosed"]
      - ["Highway NOA and urban NOA", "Higher-function passenger-car assistance programs, including L2.5 highway NOA and L2.9 urban NOA as described in the report", "OEM program and trim-level purchasing path is plausible but not documented for Haomo", "Adjacent layer within passenger-car ADAS; 2025 growth is described but volumes and incremental spend are absent"]
      - ["Personal-vehicle L3/L4", "Conditional or higher automation capability for personal vehicles", "OEMs, regulators and vehicle users are involved; budget owner and commercial access are not evidenced here", "Separate, policy-dependent adjacency; do not combine its future spend with L2/L2+"]
      - ["Robotaxi L4", "Autonomous fleet vehicles and associated deployment/operation economics", "Fleet operators and mobility platforms are potential buyers or operators; no Haomo-specific procurement evidence", "Distinct operating market with capital and scaling constraints"]
      - ["Low-speed delivery and logistics", "Autonomous delivery vehicles and fleet-oriented hardware/software", "Enterprise logistics operators are potential buyers; contract values and active programs are unknown", "Adjacent use case mentioned in historical reporting; keep separate from passenger-vehicle demand"]
      - ["Smart cockpit", "Displays, cockpit controllers, voice and related in-cabin systems", "OEM purchasing is indicated at category level; Haomo buyer relationship is not evidenced", "Adjacent category reported separately by Gasgoo; exclude from Haomo core market absent product evidence"]
    notes: "Scope is an evidence-based classification, not a spend taxonomy. Buyer and payer assignments marked as inferred or unknown are not verified contract facts; adjacent categories have distinct units and economics."
    claimRefs: [CM001, CM004, CM007, CM008, CM011, CM016]
  - id: TM002
    title: Sizing and adoption indicators available in the assigned evidence
    columns: ["Publisher / vintage", "Geography and segment", "Reported metric", "Method / confidence", "Limitation for TAM"]
    rows:
      - ["IDTechEx article, 2025-05-01", "China; new-energy-vehicle startups", "52% of total vehicle sales supported L2+ functionality in 2024", "IDTechEx report excerpt; medium confidence", "Startup-sales denominator only; not market revenue, all-vehicle penetration, supplier share or Haomo adoption"]
      - ["Gasgoo Automotive Research Institute, Jan-Apr 2026", "China passenger-car LiDAR components", "Hesai: 456,986 installed units (35.0%); Huawei: 398,057 (30.5%); combined share 65.5%", "Gasgoo compiled installation figures; medium confidence", "Component category and four-month period only; not total ADAS spend or a full-year estimate"]
      - ["Research and Markets report listing, 2026", "China independent-OEM passenger-car intelligent driving", "L2-and-above share reached 62.7% in 2025; L2.9 urban-NOA installation rate rose from 2.1% in 2022 to 17.2% in 2025", "Commercial report excerpt; medium confidence", "The excerpt does not disclose the underlying population definition, full dataset, market value or CAGR"]
      - ["Tracxn company profile, accessed 2026-10-26", "China autonomous-vehicle sector", "$457M sector funding in 2026 to date as displayed on the profile", "Database snapshot; low confidence", "Funding is capital raised, not revenue, customer spend, cash available or addressable demand"]
      - ["Research and Markets report, 2025", "California autonomous-vehicle testing; not China market sizing", "4.5 million test miles in 2024, 50% below 2023, as attributed to California DMV", "Report excerpt citing California DMV; medium confidence", "Different geography and test activity; adverse adoption context only, not Chinese market volume"]
    notes: "Metrics retain their source periods, denominators and units. No numeric TAM/SAM/SOM or CAGR is available from these excerpts; do not sum percentages, installations, test miles or financing into market revenue."
    claimRefs: [CM002, CM005, CM006, CM009, CM010]
  - id: TM003
    title: Buyer, user and adoption pathway map
    columns: ["Segment", "Buyer / budget owner", "User / payer", "Adoption trigger or constraint", "Evidence status"]
    rows:
      - ["Passenger-car L2/L2+ supplier program", "OEM product, engineering and procurement functions are inferred buyers", "Driver uses the system; contract payer and cost allocation are undisclosed", "Cost-effective deployment, system integration and production readiness", "Market criteria reported; Haomo-specific budget and contract terms unknown"]
      - ["Higher-function highway/urban NOA", "OEM program owner is inferred", "Vehicle user is the driver; trim-level payment is not evidenced", "Real-world scenario handling, reliability and cost at scale", "Industry direction reported; no Haomo awards or user willingness-to-pay data"]
      - ["Personal-vehicle L3", "OEM and regulatory qualification pathway", "Private vehicle user; consumer payment mechanism unknown", "Legal permission, safety validation and deployment readiness", "Report describes policy/qualification as constraints; no current market-size denominator"]
      - ["Robotaxi L4", "Fleet operator, OEM and mobility platform may share purchasing roles", "Fleet passenger is the end user; operator pays deployment and operating costs", "Capital intensity, vehicle utilization, safety-driver removal and local permissions", "Report evidence describes scaling limits; Haomo-specific buyer evidence absent"]
      - ["Low-speed delivery / logistics", "Enterprise fleet or logistics operator is a plausible buyer", "Delivery operator/customer; payer and contract unit unknown", "Fleet productivity, operating cost and deployment permissions", "Historical reporting mentions deployments; current fleet and contract economics are unknown"]
    notes: "Buyer and payer roles are hypotheses where explicitly marked inferred or plausible. The sources do not disclose budget ownership, ASPs, purchasing cycles, ROI thresholds, switching costs or contract economics."
    claimRefs: [CM003, CM004, CM007, CM008, CM011, CM012, CM014]
