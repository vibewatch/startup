callouts:
  - calloutType: insight
    title: Deployment signals are stronger than market-value evidence
    body: "Vehicle-feature adoption, component installations and historical program mentions support a real market, but none provides Haomo's addressable contract value or share."
    claimRefs: [CM002, CM005, CM008]
  - calloutType: risk
    title: L4 adjacency should not inflate the core estimate
    body: "Robotaxi and other L4 applications have distinct fleet economics and capital or policy constraints; broad autonomy forecasts cannot be treated as near-term passenger-car ADAS spend."
    claimRefs: [CM007, CM009]
