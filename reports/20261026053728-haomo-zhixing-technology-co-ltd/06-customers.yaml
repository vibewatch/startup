chapter:
  number: 6
  title: Customers
  summary: Public customer evidence is concentrated in Haomo-issued 2024 claims about HPilot model coverage and Xiao Motuo delivery activity, plus a third-party report of a planned Hyundai program. The disclosed metrics are historical, current customer status and retention are not established, and a 2025 report of suspended operations materially raises continuity questions.
sections:
  - id: customer-segments
    title: Buyer segments and public relationship evidence
    body: >-
      Haomo's customer-facing evidence spans two distinct buyer groups: passenger-vehicle
      manufacturers integrating assisted-driving software, and logistics or retail operators
      using low-speed delivery vehicles. The sources do not identify the payers, contract values,
      fleet ownership, or revenue share for the named relationships, so product fit and
      reported deployment should not be conflated with recurring commercial revenue. Haomo's
      April 2024 announcement named Alibaba, Wumart, Meituan, and Dada Kuai Song as logistics
      collaborators and described Wumart-associated Xiao Motuo deliveries in Beijing; a separate
      report described a planned Hyundai model using DriveGPT. These are historical relationship
      signals, not confirmation that the programs remain live in October 2026. A separate 2026
      article reports Meituan delivery-fleet activity but does not link those units to Haomo, so
      the named collaboration cannot be read as Haomo-supplied deployment. [CU003, CU004, CU005,
      CU015]
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU015
    tableRefs:
      - TU001
      - TU003
  - id: adoption-proof
    title: Adoption metrics are historical and not directly comparable
    body: >-
      Haomo's own February and April 2024 publications describe HPilot coverage on roughly
      twenty vehicle models, but their user-assisted-driving mileage figures differ sharply:
      more than 120 million kilometers in the February item and nearly 25 million kilometers
      in the April item. The sources do not define a comparable reporting scope or explain the
      difference; neither figure should be treated as a continuous growth series. The April
      account also reports more than 120,000 Xiao Motuo orders across more than 60 communities
      in one Beijing district, while a reported Germany shipment concerns an equipped vehicle
      batch rather than proof of end-user uptake or repeat orders. No current active fleet,
      renewal, or account-level economics are disclosed. [CU001, CU002, CU004, CU014]
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU014
    tableRefs:
      - TU002
    figureRefs:
      - FU001
  - id: durability-and-concentration
    title: Retention, concentration, and continuity remain open
    body: >-
      The assigned evidence does not disclose current named OEM programs, customer count,
      contract duration, renewals, churn, net or gross retention, per-account revenue, or
      customer concentration. A November 2025 Yicai report said Haomo had reportedly suspended
      operations and relayed employee accounts of leave notices and salary arrears; Haomo had
      not publicly responded in that report. This is dated adverse reporting, not proof of
      present operating status, but it makes support continuity and the status of historical
      deployments material diligence items. Market research points to broader ADAS and delivery
      demand, while also describing buyer preference for integrated solutions; none of those
      category-level sources verifies Haomo's current customer traction. [CU007, CU008, CU009,
      CU010, CU011, CU012, CU013]
    claimRefs:
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
