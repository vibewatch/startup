callouts:
  - calloutType: "risk"
    title: "Critical Vulnerabilities in Production AV Homologation and Security Governance"
    body: "Independent procurement assessments identify acute compliance gaps that could delay commercial automotive rollouts: lack of public verification for secure OTA rollback controls, unproven incident response procedures for fleet cyber incidents, and undocumented mapping to regional autonomous vehicle homologation rules. While Applied Intuition provides robust simulation primitives, scaling to production vehicles transfers severe regulatory liability to OEM customers if these governance assets remain buyer-implemented."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
  - calloutType: "insight"
    title: "Hidden Infrastructure TCO Threatens Enterprise Software Net Retention"
    body: "Applied Intuition's high gross margin software model shifts substantial compute, storage, and engineering burdens onto enterprise buyers. Running petabyte-scale sensor logs and billions of synthetic scenario permutations requires massive GPU clusters that operate outside base subscription fees. Unless buyers establish disciplined simulation governance, uncontrolled infrastructure expenses and heavy custom integration overhead threaten long-term contract expansion."
    claimRefs:
      - "CR001"
      - "CR006"
      - "CR007"
