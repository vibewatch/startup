callouts:
  - calloutType: "strength"
    title: "Universal Horizontal Market Position Across Automotive OEMs"
    body: "Applied Intuition has achieved unprecedented commercial penetration among legacy automakers, serving 18 of the top 20 global OEMs. By providing vendor-neutral simulation and vehicle operating systems, the company avoids direct competition with vehicle brands while capturing sticky recurring software spend [CO005]."
    claimRefs:
      - "CO005"
  - calloutType: "risk"
    title: "Valuation Sensitivity and Lack of Public Audited Financials"
    body: "Applied Intuition's $15 billion valuation commands an aggressive ~18x to 24x forward ARR multiple, substantially higher than public peers like Mobileye. Without publicly audited financial disclosures confirming net revenue retention, software gross margins, and customer concentration, the current capital structure carries material valuation risk if growth slows [CO011, CO012]."
    claimRefs:
      - "CO011"
      - "CO012"
