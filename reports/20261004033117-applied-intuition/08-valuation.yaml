company:
  name: Applied Intuition
chapter:
  number: 8
  title: Valuation
  summary: >-
    Applied Intuition's June 2025 Series F established a $15 billion post-money
    valuation, but the retained public evidence does not establish a single
    auditable revenue denominator or liquid market price. The resulting stance is
    research-more with medium confidence, high underwriting risk, and a stretched
    valuation until private financial, contract, and security-level evidence closes
    the gap.
sections:
  - id: recommendation
    title: Recommendation and decision posture
    body: >-
      The recommendation is research-more rather than a new entry at the $15
      billion headline valuation. That price is corroborated across financing
      databases and current reporting, and the business has meaningful proof
      points: the company claims more than 1,000 engineers, CNBC reports 18 of the
      top 20 automakers as customers, and both CNBC and Tectonic Defense identify a
      $171 million Department of Defense simulation-testing contract. Those signals
      support strategic quality, but not the price by themselves. Public revenue
      estimates use incompatible labels and periods, Forge shows limited private
      market activity, and CNBC reports no clear IPO timetable. Entry discipline
      should therefore require audited ARR and revenue, gross margin, retention,
      customer concentration, realized defense revenue, fully diluted ownership,
      and security terms before a target return or hold period is set.
    claimRefs: [CV001, CV008, CV010, CV011, CV012, CV014, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-and-entry
    title: Financing context, dilution, and entry discipline
    body: >-
      The latest retained pricing event is the June 2025 Series F and tender offer.
      Multiple sources report $600 million at a $15 billion post-money valuation,
      a 2.5x step-up from the $6 billion Series E valuation reported for March 2024.
      Multiples and Sacra describe approximately $200 million as primary capital and
      $400 million as secondary purchases, so the round size must not be treated as
      cash added to the balance sheet. Forge separately lists $220.56 million for
      the Series F issuance and a 1.0x non-participating liquidation preference;
      that is a useful security-level clue, not a complete cap table. The mismatch
      between the reported primary amount and Forge's issuance figure requires
      reconciliation before modeling dilution, cash runway, or preference overhang.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
  - id: thesis-and-comparables
    title: Thesis, anti-thesis, and comparable context
    body: >-
      The thesis is that Applied Intuition combines enterprise software economics
      with difficult-to-replicate automotive and defense distribution. The
      anti-thesis is that the public evidence is too imprecise to show how much of
      that strategic position converts into durable, high-margin recurring revenue.
      Multiples labels $415 million as June 2025 revenue and calculates 36.1x, while
      warning that its financing-linked values may be revenue, ARR, run-rate, or
      LTM. Sacra instead estimates $830 million of 2025 ARR. Its risk analysis also
      highlights incumbent entrenchment and platform commoditization. Multiples'
      selected public references span 1.9x to 33.6x revenue multiples across
      materially different businesses, so they are sensitivity endpoints rather
      than independent proof that Applied Intuition deserves a specific multiple.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV011, CV012, CV013, CV015]
    tableRefs: [TV002]
  - id: scenarios-and-diligence
    title: Scenarios, exit readiness, and thesis-break tests
    body: >-
      Scenario values below are mechanical sensitivities, not price targets. The
      bear case uses Multiples' lower $415 million denominator and selected 1.9x to
      6.8x public reference multiples; the base and bull cases use Sacra's $830
      million ARR estimate with progressively higher reference multiples. The
      resulting dispersion is itself the finding: public inputs can mechanically
      support values from below $1 billion to nearly $28 billion, so assigning
      numeric probabilities would create false precision. The thesis breaks if
      audited ARR is materially below the higher estimate, gross margin or
      retention does not support a premium software multiple, customer or defense
      concentration is excessive, or preference and dilution terms impair common
      returns. Exit readiness remains unproven until management supplies an IPO or
      strategic-exit pathway, current secondary evidence, and a board-approved
      capital plan.
    claimRefs: [CV006, CV007, CV008, CV009, CV014, CV015, CV016]
    tableRefs: [TV003]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Decision dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, Research more, "Do not underwrite a new entry at the $15B headline valuation on public evidence alone."]
      - [Confidence, Medium, "The financing anchor is corroborated, but operating and security-level inputs remain private or conflicting."]
      - [Risk rating, High, "Valuation, liquidity, concentration, and denominator uncertainty dominate otherwise strong strategic signals."]
      - [Valuation stance, Stretched, "The reported headline is 36.1x Multiples' $415M metric or about 18.1x Sacra's $830M ARR estimate."]
      - [Entry discipline, Conditional, "Require audited KPIs, contract quality, a fully diluted cap table, and current security terms."]
      - [Target return / hold / exit, Not publicly underwritable, "Do not set a return hurdle or hold period without an entry security and credible liquidity path."]
    notes: "Assessments use retained public sources through 2026-10-04; private financial statements, cap-table detail, and transaction documents were unavailable."
    claimRefs: [CV001, CV006, CV007, CV008, CV014, CV015, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Lens, Evidence-based argument, What would change the view]
    rows:
      - [Thesis, "Scale: official pages claim 1,000+ engineers and CNBC reports 18 of the top 20 automakers.", "Audited customer cohorts showing broad production deployment and durable expansion would strengthen the case."]
      - [Thesis, "Defense: CNBC and Tectonic Defense identify a $171M DoD simulation-testing contract.", "Evidence of realized high-margin revenue and follow-on awards would support a premium."]
      - [Thesis, "Operating quality: CNBC reports the company's claim that it has been profitable throughout its history.", "Audited operating cash flow, gross margin, and stock-compensation data would convert the claim into underwriting evidence."]
      - [Anti-thesis, "Metric ambiguity: $415M labeled revenue by Multiples conflicts with Sacra's $830M 2025 ARR estimate.", "A revenue-recognition bridge and audited ARR schedule would resolve the denominator."]
      - [Anti-thesis, "Competition: Sacra flags entrenched simulation vendors and cloud or semiconductor platform commoditization.", "Documented competitive wins, renewal cohorts, and stable pricing would reduce this risk."]
      - [Anti-thesis, "Liquidity: Forge reports limited market activity and no available price, while CNBC reports no clear IPO commentary.", "A qualified secondary transaction or board-approved exit plan would improve price discovery."]
    notes: "Company-issued scale and profitability statements are identified as claims; independent reporting does not substitute for audited financial or contract evidence."
    claimRefs: [CV006, CV007, CV010, CV011, CV012, CV013, CV014, CV015]
  - id: TV003
    title: Bull, base, and bear valuation sensitivities
    columns: [Case, Explicit assumptions, Mechanical valuation range, Probability signal, Downside or upside trigger]
    rows:
      - [Bear, "$415M June 2025 metric from Multiples; 1.9x-6.8x selected public reference multiples.", "$0.8B-$2.8B", "Rises if the lower denominator is confirmed or premium growth decelerates.", "Audited ARR below the higher estimate, weak retention, or multiple compression."]
      - [Base, "$830M 2025 ARR estimate from Sacra; 6.8x reference multiple to the 18.1x multiple implied by the $15B headline.", "$5.6B-$15.0B", "Rises if audited ARR approaches the estimate and profitability is verified.", "Concentration, lower gross margin, or materially dilutive security terms."]
      - [Bull, "$830M 2025 ARR estimate; 18.1x headline-implied multiple to the 33.6x upper selected public reference multiple.", "$15.0B-$27.9B", "Rises only with verified premium software economics and expanding defense revenue.", "Sustained growth, strong net retention, visible liquidity, and no preference overhang."]
    notes: "Ranges are rounded arithmetic sensitivities, not independent valuations or price targets; source periods, metric labels, and business models are not fully comparable."
    claimRefs: [CV001, CV006, CV007, CV008, CV009, CV012, CV014, CV015, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: "The evidence chain moves from strategic scale to unresolved price and liquidity inputs, ending in a research-more decision."
    data:
      nodes:
        - id: scale
          label: Strategic scale
          detail: "1,000+ engineers and broad OEM reach support platform credibility."
        - id: financing
          label: Financing anchor
          detail: "$600M Series F and tender offer established a $15B headline valuation."
        - id: denominator
          label: Metric conflict
          detail: "$415M revenue-labelled data and an $830M ARR estimate do not provide one auditable denominator."
        - id: terms
          label: Security uncertainty
          detail: "Public preference clues do not establish the fully diluted ownership or complete preference stack."
        - id: liquidity
          label: Exit uncertainty
          detail: "Limited market activity and no clear IPO timetable weaken return visibility."
        - id: decision
          label: Research more
          detail: "Require audited KPIs, contract quality, cap-table detail, and a credible exit path before entry."
    approximationNotes: "This is a qualitative decision sequence; it does not assign probabilities or infer conversion rates."
    claimRefs: [CV002, CV008, CV010, CV014, CV016]
callouts:
  - calloutType: recommendation
    title: Price-sensitive conclusion
    body: >-
      Strategic quality is not the same as valuation support. At $15 billion,
      proceed only after private diligence reconciles the revenue denominator,
      verifies software economics, and establishes ownership and liquidity terms.
    claimRefs: [CV008, CV014, CV016]
