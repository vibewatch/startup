evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-reporting
    missingEvidence: >-
      Audited financial statements confirming GAAP revenue, gross margin breakdown between software subscriptions and
      services, and net revenue retention rates.
    whyItMatters: >-
      Without audited figures, underwriting Applied Intuition's $15 billion valuation relies entirely on third-party
      analyst estimates and company claims.
    diligencePath: >-
      Request audited financial statements and board-approved financial presentations under institutional non-disclosure
      agreements.
    relatedQuestionRefs:
      - QO004
      - QO006
  - type: missing-source
    severity: minor
    topic: board-governance
    missingEvidence: >-
      Complete listing of board members, investor observer seats, and voting control distribution between co-founders
      and institutional funds.
    whyItMatters: Prevents independent assessment of minority shareholder protections and board independence.
    diligencePath: Review certificate of incorporation filings and venture capital investor rights agreements.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: oem-contract-depth
    missingEvidence: >-
      Granular breakdown of production deployment volume versus early evaluation pilots across the claimed 18 of top 20
      automaker accounts.
    whyItMatters: >-
      Determines whether enterprise accounts generate recurring software royalties on production vehicles or remain
      capped at R&D engineering seat licenses.
    diligencePath: >-
      Review OEM contract terms, master service agreements, and royalty rate schedules per vehicle identification number
      (VIN).
    relatedQuestionRefs:
      - QM008
  - type: conflicting-data
    severity: material
    topic: addressable-market-boundary
    missingEvidence: >-
      Independent reconciliation between multi-hundred-billion dollar broad AV market projections and the actual
      addressable software toolchain SAM.
    whyItMatters: >-
      Broad AV TAM estimates conflate end-user mobility spend with enterprise B2B software budgets, risking valuation
      overestimation.
    diligencePath: >-
      Model software addressable market based on global automotive R&D engineering headcount and per-seat tooling
      expenditure.
    relatedQuestionRefs:
      - QM002
      - QM008
  - type: enumeration-incomplete
    severity: material
    topic: competitor-scale-and-funding
    missingEvidence: >-
      Comparable current funding, employee scale, deployment scale, and strategic direction for every material
      competitor and substitute.
    whyItMatters: >-
      Without common scale measures, the profile table cannot distinguish durable capacity from narrow product
      positioning.
    diligencePath: >-
      Request a dated competitor census with primary financing disclosures, filings, official staffing data, and
      deployment metrics on one common basis.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: competitor-pricing
    missingEvidence: >-
      Comparable vendor quotes, realized discounts, compute charges, implementation fees, support tiers, and termination
      costs.
    whyItMatters: Opaque commercial terms prevent a normalized total-cost and switching-cost comparison.
    diligencePath: Run a common-scope RFP and collect redacted order forms or procurement references for each finalist.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: independent-benchmarks
    missingEvidence: >-
      Independent common-workload evidence for safety performance, integration time, regulatory readiness, data
      portability, and total cost.
    whyItMatters: Company positioning and publisher scores do not prove superior production outcomes or moat durability.
    diligencePath: >-
      Obtain buyer references, benchmark protocols and results, safety-case samples, migration tests, and
      regulator-facing evidence from shortlisted vendors.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials-and-gross-margin
    missingEvidence: >-
      Audited GAAP financial statements, detailed recurring vs services revenue breakdown, and realized customer gross
      margin data.
    whyItMatters: >-
      Essential for confirming whether the $15B valuation reflects high-margin software recurring revenue or
      lower-multiple professional engineering services.
    diligencePath: >-
      Request confidential disclosure of audited income statements, COGS disaggregation, and management ARR
      reconciliations in diligence data room.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: real-time-runtime-deployment
    missingEvidence: >-
      Production vehicle telemetry demonstrating the proportion of OEM customers executing Applied Intuition Vehicle OS
      runtime code in production ECUs versus development simulation tools only.
    whyItMatters: >-
      Validating whether Applied Intuition commands high-margin embedded runtime royalties per manufactured vehicle or
      remains primarily an engineering seat toolchain.
    diligencePath: >-
      Request OEM customer contract schedules distinguishing development seat licenses from production vehicle unit
      royalties.
    relatedQuestionRefs:
      - QE003
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: minor
    topic: simulation-fidelity-benchmarks
    missingEvidence: >-
      Empirical correlation data and sensor model validation benchmarks comparing Spectral synthetic sensor outputs
      against real-world photon-level sensor returns.
    whyItMatters: >-
      Determines the accuracy of virtual verification for safety case sign-offs without requiring millions of redundant
      physical test track miles.
    diligencePath: >-
      Review technical whitepapers and OEM joint validation audit reports comparing virtual LiDAR/radar point clouds
      with ground-truth physical captures.
    relatedQuestionRefs:
      - QE005
    relatedTableRefs:
      - TE002
  - type: private-evidence-only
    severity: material
    topic: retention-and-cohorts
    missingEvidence: NRR, GRR, logo churn, renewal terms, contract length, satisfaction data, and cohort expansion by customer segment.
    whyItMatters: Logo breadth and one case study cannot establish recurring revenue durability or land-and-expand economics.
    diligencePath: >-
      Request customer cohort schedules, renewal records, expansion ARR bridges, contract samples, and reference calls
      under NDA.
    relatedQuestionRefs:
      - QU007
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top-one, top-five, and top-ten customer revenue shares, plus revenue by automotive, defense, and other industrial
      segments.
    whyItMatters: >-
      The reported automaker footprint and management's segment mix do not reveal exposure to any single customer or
      procurement cycle.
    diligencePath: >-
      Review customer-level ARR and revenue schedules, backlog, remaining performance obligations, and segment
      concentration with finance leadership.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A complete roster of active customers with use case, contract status, production stage, outcome, and most recent
      usage date.
    whyItMatters: >-
      The public sample cannot distinguish paid production programs from pilots, partnerships, development licenses, or
      inactive logos.
    diligencePath: >-
      Obtain the CRM account roster and customer contracts, then validate a stratified sample through customer
      references.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-retention-and-churn
    missingEvidence: >-
      Audited historical Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and enterprise OEM logo churn
      rates.
    whyItMatters: >-
      Without verified retention metrics, underwriting the durability and recurring quality of Applied Intuition's
      software revenue under multi-year OEM cycles remains speculative.
    diligencePath: >-
      Request historical cohort revenue retention schedules and gross churn breakdowns during confidential data room
      access.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR003
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-compliance-and-licensing-register-TR001
    missingEvidence: >-
      Comprehensive audit of all state-level autonomous vehicle testing permits, international UNECE safety
      certifications, and confidential export control filings across global operating jurisdictions.
    whyItMatters: >-
      Table TR001 represents a sample enumeration of key regulatory and legal exposures; unexamined state and
      international vehicle homologation permits could harbor unmitigated compliance or licensing bottlenecks.
    diligencePath: >-
      Obtain complete state DMV autonomous testing permit records, European type-approval safety documentation, and
      ITAR/EAR classification reviews in the confidential data room.
    relatedQuestionRefs:
      - QR001
      - QR004
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: valuation-underwriting
    missingEvidence: >-
      Audited revenue and ARR bridge, gross margin, net retention, customer concentration, operating cash flow, and
      realized defense-program revenue.
    whyItMatters: These inputs determine whether the premium multiple and each scenario denominator are economically defensible.
    diligencePath: >-
      Obtain audited financial statements, KPI definitions and cohorts, customer-level concentration schedules, and
      contract-level revenue recognition from management.
    relatedQuestionRefs:
      - QV009
      - QV010
    relatedTableRefs:
      - TV001
      - TV003
  - type: private-evidence-only
    severity: material
    topic: ownership-and-liquidity
    missingEvidence: >-
      Fully diluted cap table, all preferred security terms, tender participation, current secondary indications, board
      capital plan, and credible IPO or strategic-exit pathway.
    whyItMatters: >-
      Ownership dilution, preference overhang, entry security, and exit timing determine realizable returns even if
      operating performance is strong.
    diligencePath: >-
      Review the charter, financing documents, capitalization table, tender records, 409A materials, secondary bids,
      board minutes, and exit-readiness workstream.
    relatedQuestionRefs:
      - QV009
      - QV010
    relatedTableRefs:
      - TV001
