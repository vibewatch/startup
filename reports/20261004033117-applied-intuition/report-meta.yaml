companyProfile:
  summary: >-
    Applied Intuition is a private enterprise software and AI company that builds simulation, Vehicle OS, and autonomy
    infrastructure for automotive OEMs, defense programs, and other moving-machine industries. The company has expanded
    from AV simulation into a broader physical AI platform, combining development tooling, embedded operating systems,
    and autonomy stacks across commercial and public-sector programs.
