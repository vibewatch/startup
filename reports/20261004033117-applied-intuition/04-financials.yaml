    body: "Applied Intuition commands a $15 billion premium valuation based on market perception that it is a pure-play AI vehicle software platform generating an estimated $830 million in ARR with 85% gross margins. However, if diligence reveals that a material fraction of billings is derived from bespoke integration services as employee accounts suggest, the blended margin profile and recurring quality of its revenue would compress substantially."
