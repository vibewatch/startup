          description: 自动驾驶项目与 DoD 国防现代化需求触发采购。
        - id: toolchain-entry
          label: 工具链切入
          description: 在 6 至 18 个月的销售周期内，客户通过 Simian 仿真或 Spectral 传感器建模切入。
        - id: platform-expand
          label: 全栈扩张
          description: 横向扩展至 Basis 数据管理、Vehicle OS 及具身 AI 平台。
        - id: monetization-split
          label: 收入结构分化
          description: 开票额拆分为高毛利的年度软件订阅与定制工程服务。
        - id: gross-margin-realization
          label: 实际毛利率
          description: 净盈利能力由 85% 的理论软件毛利率与交付服务成本综合决定。
        - id: retained-free-cash-flow
