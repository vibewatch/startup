  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律合规风险画像
        blocks:
          - type: paragraph
            body: >-
              Applied Intuition
              处于关乎安全生命的汽车自动驾驶与受严格管制的联邦国防采购交叉路口，在民用车规标准与军品采购法规两端均面临实质性监管与法律合规风险。在民用汽车领域，独立采购评估揭示了关键的安全与合规短板：缺乏空中下载（OTA）安全更新控制与回滚机制的公开实证、事故数据留存与司法取证监管链流程薄弱，且缺少将运行时软件行为映射至区域自动驾驶汽车（AV）准入认证（homologation）规则的正式文档
              [CR001, CR002]。鉴于 Applied Intuition 将其技术栈推向量产级高级辅助驾驶系统（ADAS）与自动驾驶（AD），若无法满足区域安全性论证（safety
              cases）或维护可审计的量产准出关口，客户与公司本身都将面临严苛的监管执法与产品责任诉讼 [CR001, CR003]。与此同时，公司在公共部门业务的快速扩张使其受制于 41 CFR 60-1.4(a)、41
              CFR 60-300.5(a) 及 41 CFR 60-741.5(a) 项下的联邦承包商平权法案与就业法规约束，必须满足针对受保护退伍军人及残障人士的平权合规要求
              [CR004]。此外，二级市场股权转让条款对老股转让设定了严格的董事会审批机制及优先购买权（ROFR），限制了一级市场流动性并给外部机构投资者带来治理摩擦 [CR005]。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
