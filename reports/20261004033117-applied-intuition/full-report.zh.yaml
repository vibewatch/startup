        title: 支撑底稿
        blocks:
          - type: callout
            title: 白盒交付契合 OEM 自主可控诉求
            body: Applied Intuition 表示其汽车 SDS 提供架构可见性、定制能力以及硬件与传感器自主选择权。这在战略上显著有别于黑盒方案，但现有证据未独立量测其实际集成速度或安全性表现。
