      - number: '1.3'
        title: 融资历程、投资方阵营与估值分歧
        blocks:
          - type: paragraph
            body: >-
              自 2017 年以来，Applied Intuition 经由七轮融资累计获得超过 $1.2 billion 的机构股权投资 [CO010]。其机构投资方涵盖蓝筹风险投资机构与主权财富管理机构，包括
              BlackRock、Kleiner Perkins、General Catalyst、Lux Capital、Fidelity Management & Research、Andreessen
              Horowitz、Qatar Investment Authority 以及 Abu Dhabi Investment Council [CO010]。公司估值从 2021 年 11 月 Series D 轮的
              $3.6 billion，升至 2024 年 3 月 Series E 轮的 $6.0 billion，随后在 2025 年 6 月 Series F 轮中跃升至 $15.0 billion [CO003,
              CO010]。这种快速的倍数扩张引发了分析界的剧烈分歧：独立市场研究机构与二级市场追踪机构指出，预估 $830 million 的 ARR 运行率对应约 18x 至 24x ARR 的远期倍数，相较
              Mobileye 等公开上市的自动驾驶及汽车软件同行存在显著溢价 [CO011, CO012]。与此同时，各商业数据库记录的历史轮次总额存在严重出入，折射出私营市场老股交易与债务工具的不透明性 [CO013]。
            claimRefs:
              - CO003
              - CO010
              - CO011
              - CO012
              - CO013
