      - number: '7.4'
        title: 支撑底稿
        blocks:
          - type: callout
            title: 量产自动驾驶准入认证与安全治理中的关键漏洞
            body: >-
              独立采购评估揭示了可能延缓商业化汽车量产落地的严重合规缺口：缺乏经过公开验证的安全 OTA 回滚机制、针对车队网络安全事件的应急预案未经验证，以及缺少映射至各区域自动驾驶车辆准入认证规则的成文归档。尽管
              Applied Intuition 提供了强大的仿真原语组件，但若上述合规治理资产仍需采购方自行开发，向实车量产过渡将给 OEM 客户带来巨大的监管法律责任风险。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: 隐性基础设施总拥有成本威胁企业级软件净留存率
            body: >-
              Applied Intuition 高毛利率的软件模型将庞大的算力、存储与工程负荷转嫁至企业客户。处理 PB 级传感器日志与数十亿次合成场景排列组合需要海量 GPU
              集群支持，此类算力开支并不包含在基础订阅费中。除非采购方建立严格的仿真预算治理机制，否则失控的基础设施开支与沉重的定制集成负担将危及其长期的合同增购与扩张。
            calloutType: insight
            claimRefs:
              - CR001
              - CR006
              - CR007
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与决策姿态
        blocks:
          - type: paragraph
            body: >-
              投资建议为继续研究，而非在 $15 billion 标称估值下直接入场。该估值在各大融资数据库与现存报道中均获印证，且业务具备扎实的立足点：公司称拥有超过 1,000 名工程师，CNBC 报道全球前 20
              大整车厂中有 18 家为其客户，CNBC 与 Tectonic Defense 也均指出其获得过 $171 million
              的国防部仿真测试合同。这些信号能证明其战略成色，但单凭它们撑不起当前价格。公开层面的收入估算口径与统计区间相互冲突，Forge 显示私募市场交易冷清，CNBC 也报道称尚无明确的 IPO
              时间表。因此，入场纪律要求严守底线：在敲定目标回报或持有周期前，必须掌握经审计的 ARR 与收入、毛利率、留存率、客户集中度、已实际落地的国防收入、完全稀释股权比例及证券条款。
            claimRefs:
              - CV001
              - CV008
              - CV010
              - CV011
              - CV012
