  - id: FE001
    title: Applied Intuition 全栈具身 AI 运行架构
    type: stack
    summary: 展现通过 Vehicle OS 与仿真工具链实现车辆硬件与软件应用解耦的分层架构体系。
    data:
      layers:
        - label: 应用与自主层
          detail: 端到端自动驾驶系统、L2+ ADAS 技术栈、国防战术智能体及车队运营工作流。
        - label: 开发与仿真工具链
          detail: Simian 场景引擎、Spectral 传感器建模、Basis 日志管理及 Strata 合规分析。
        - label: Vehicle OS 与中间件层
          detail: 硬件抽象层、AUTOSAR / ROS 2 集成、实时消息路由及电子电气（E/E）架构工具。
        - label: 计算、传感器与物理硬件
          detail: 车载以太网、多传感器套件（LiDAR/雷达/摄像头）、区域计算 ECU 及整车台架。
        - label: 云与车队数据基础设施
          detail: 分布式场景执行集群、PB 级行驶日志存储及空中下载（OTA）验证流水线。
        - label: 物理机械与运行领域
          detail: 乘用车、商用长途重卡、国防地面/空中系统、矿用自卸车及工程机械。
    approximationNotes: 基于公开技术规范和系统架构招聘启事梳理的概念性功能架构。
    claimRefs:
      - CE002
