      - number: '5.4'
        title: 支撑底稿
        blocks:
          - type: callout
            title: 解耦 Vehicle OS 的战略卡位价值
            body: >-
              Applied Intuition 从纯桌面仿真果断转向 Vehicle OS 的架构跨越，映射了计算行业硬件与操作系统解耦的历史演进规律。通过在 OEM
              底盘电子电气架构与自动驾驶算法之间植入硬件抽象层，Applied Intuition 将自身卡位为软件定义汽车不可或缺的操作系统供应商，有效帮助车企防范被底层芯片厂商绑定锁定。
            calloutType: insight
