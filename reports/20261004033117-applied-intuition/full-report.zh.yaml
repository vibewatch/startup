      - number: '6.2'
        title: 客户采用度与标杆案例质量
        blocks:
          - type: paragraph
            body: >-
              AISIN 是指定证据中记录最完备的标杆客户案例。其案例分析表明，该供应商在自主泊车开发中引入了 Applied Intuition 的 ADP 方案，用于传感器仿真、目标物仿真及云端协同
              [CU005]。同一来源亦明确指出全面部署仍在推进中，因而该证据不应被认定为已完成量产交付 [CU006]。即便如此，AISIN 工程师表示统一标准与全局视角带来了更快的决策节奏、更少的协同偏差以及更高的透明度
              [CU007]。更广泛的采用度证据则缺乏可审计性。Manhattan Venture Partners 称其实测路测减少 90%、ADAS/AD 研发提速
              10x，但调取报告未提供此类汇总收益断言对应的具体客户分母数据 [CU013]。为某全球标杆 OEM
              项目组建的底特律新团队反映了其积极的交付资源投入，但客户并未具名，且招聘启事无法证明具体收入体量、量产装车数量或续约状态 [CU008, CU009]。
