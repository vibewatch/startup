      - number: '3.3'
        title: 商务透明度缺失推高结构化采购价值
        blocks:
          - type: paragraph
            body: >-
              RFP.wiki 指出 Applied Intuition
              采用直销模式，未公开标准价目表，其授权费用随工程席位数、仿真算力与部署模块规模扩展。指定证据未提供竞品的公开商务条款，因此无法建立严谨的逐家价格排序。该采购来源同时提示，一旦场景库、验证资产与 Vehicle
              OS 工作流深度嵌入，转换成本将显著上升。该机制在逻辑上合理，但并非实测留存率，亦不能证明客户无法同时采用多家供应商。Applied Intuition 当前在汽车 GTM
              领域的招聘表明，管理层已将竞品定位、客户情报与 OEM 生态影响力列为核心运营重点。尽调启示在于：企业应在工作流资产深度沉淀之前，提前就可移植性、数据导出权、算力计量方式、技术支持边界及终止交接支持达成明确协议。
            claimRefs:
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP012
              - CP013
      - number: '3.4'
        title: 竞争护城河取决于集成深度而非公开基准测试领先
        blocks:
          - type: paragraph
            body: >-
              其竞争壁垒最强支撑来自组织规模与工作流整合：Applied Intuition 拥有 1,000 名工程师，其产品矩阵能够贯穿仿真、验证、操作系统与自动驾驶系统。管理层坦言，鉴于资本在各 AI
              价值链层级加速流动，公司必须保持激进的资本投入以构建防御力。这种表态折射出同质化风险的客观存在，而非风险已被消除。RFP.wiki
              的评分提供了结构化参照，但属于发布方自研的采购评级，并非独立的安全性、自动驾驶性能或总拥有成本基准测试。若集成收益未能覆盖采购成本与依赖风险，传统巨头的捆绑平台、垂直自动驾驶技术栈或 OEM
              内部自研团队完全可能对 Applied Intuition 构成替代。因此，长期壁垒的确立仍有赖于采购方验证的实际交付成果、可移植的数据与验证资产，以及跨产品采用切实改善经济效益或加快迭代节奏的客观证据。
            claimRefs:
              - CP006
              - CP015
              - CP016
