      - number: '1.2'
        title: 高管领导力、公司治理与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              Applied Intuition 的组织执行力依托于两位联合创始人，他们兼具深厚的工程技术功底与消费级规模的运营执行力 [CO006]。CEO Qasar Younis 曾在 2011 年将初创公司
              TalkBin 出售给 Google，其后在 Google 负责包括 Google Maps 在内的产品团队，并曾出任 Y Combinator 首席运营官兼合伙人 [CO006]。CTO Peter
              Ludwig 在联合创立 Applied Intuition 之前，曾在 Google 和 Microsoft 主导尖端产品工程，致力于构建自动驾驶系统的可扩展验证基础设施
              [CO007]。除创始人外，高管梯队还包括首席营销官 Surbhi Agarwal（曾任 Google Cloud 产品营销负责人）、总经理 Varun Mittal（曾任职于 Delphi 和
              Bosch），以及负责汽车、机器学习基础设施与特种车辆仿真等垂直业务板块的部门主管 [CO008]。然而，董事会层面的正式治理架构——包括委员会构成、表决控制权机制以及次级投资者清算优先权——仍属非公开且未披露
              [CO009]。关键人物依赖高度集中于 Younis 和 Ludwig 两人，他们在硅谷风险投资界、全球汽车行业董事会以及国防采购决策层的人脉资源，既构成战略护城河，也带来实质性的治理风险 [CO006,
              CO007]。
            claimRefs:
              - CO006
