      - number: '5.3'
        title: 部署工程、技术壁垒与交付风险
        blocks:
          - type: paragraph
            body: >-
              Applied Intuition 采用云端 SaaS 编排、本地私有化 GPU 集群与硬件在环（HIL）车辆测试台架相结合的混合软件模式交付其平台。为应对 OEM
              保守的采购流程与复杂的车载电子架构，公司将现场方案工程师直接驻扎至底特律、东京、慕尼黑及安娜堡等主要汽车制造重镇的客户工程部门。方案团队协助 OEM 从传统瀑布流工程模式转向敏捷软件驱动的 CI/CD
              研发管线，并在量产定型前于物理验证台架与工程样车（mule vehicles）上开展验证。支撑 Applied Intuition 商业地位的核心技术壁垒，在于其与全球前 20 大车企中 18
              家的深度集成，辅以多年工程沉淀所形成的庞大验证场景库、物理行为模型及合规审计报告工具。然而，公司亦面临显著的技术与商务挑战：dSPACE、IPG Automotive、Vector Informatik 及
              Siemens 等传统汽车测试巨头在硬件在环台架与认证合规管线中根基深厚；与此同时，包括 Nvidia 和 AWS
              在内的超大规模云厂商与芯片巨头正竞相推出通用机器人仿真框架，若虚拟测试工作流逐步围绕标准化通用云端工具链收敛，公司将面临平台同质化或毛利率受挤压的潜在风险。
