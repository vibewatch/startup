chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业定位、成立背景与商业模式
        blocks:
          - type: paragraph
            body: >-
              Applied Intuition, Inc. 是一家企业级软件与人工智能公司，由 CEO Qasar Younis 和 CTO Peter Ludwig 于 2017 年创立
              [CO001]。公司总部设于加利福尼亚州 Mountain View 与 Sunnyvale，并在 Washington, D.C.、Detroit、Ann
              Arbor、London、Munich、Stuttgart、Stockholm、Seoul 及 Tokyo 设有工程和驻地办事处，形成全球分布式布局 [CO002]。公司目前处于 Series F
              风险投资阶段；在 2025 年 6 月完成一笔 $600 million 的股权融资及要约收购后，其投后估值达到 $15 billion，Applied Intuition 由此将自身定位于横向物理 AI
              平台，面向乘用车、商业卡车货运、采矿、建筑、农业和国防领域提供仿真软件、车辆操作系统及自动驾驶技术栈 [CO003]。公司核心经济模型表现为模块化企业软件订阅，享有约 80% 至 85% 的高毛利率，并在汽车
              Tier-1 制造商与国防项目中推行扩张销售策略 [CO004]。独立行业分析认为 Applied Intuition 奉行开放、中立于供应商的基础设施战略——常被称为自动出行领域的 Android 模式——与
              Tesla 的 Full Self-Driving 栈等垂直整合专有架构形成鲜明对比 [CO005]。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
