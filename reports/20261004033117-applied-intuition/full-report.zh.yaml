      - number: '4.2'
        title: 单体经济模型、GTM 动态与成本结构
        blocks:
          - type: paragraph
            body: >-
              Applied Intuition 的企业级市场拓展（GTM）表现为 6 至 18 个月的直销周期，这主要受汽车研发中功能安全验证与 ISO 26262
              合规性等关键任务属性驱动。客户扩增遵循典型的「先切入再扩张（land-and-expand）」路径：客户通常先采购 Simian
              场景仿真器等单点工具，随后逐步扩展至高保真物理传感器建模、数据管理管线以及整车操作系统。在成本端，经营杠杆高度依赖研发技术人员编制与算力基础设施。Applied Intuition 披露拥有逾 1,000
              名工程师，其中包含数十位前 CTO 与初创企业创始人，并提供 100% 由雇主承担的医疗保费与 401(k)
              匹配缴费等丰厚福利。尽管轻资产云仿真模型具备出色的理论毛利率，但内部员工反馈反映出较高的组织摩擦、团队快速换血以及沉重的咨询服务负荷，这或将推高客户获取成本（CAC），并将实际综合服务毛利率拉低至纯 SaaS
              理论基准之下。
