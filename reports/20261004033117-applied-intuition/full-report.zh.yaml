  - id: FV001
    title: 投资建议决策逻辑
    type: flow
    summary: 证据链由战略业务规模推导至未决的价格与流动性变量，最终得出进一步调研的决策结论。
    data:
      nodes:
        - id: scale
          label: 战略规模
          detail: 1,000+ 工程师规模与广泛的 OEM 覆盖支撑平台公信力。
        - id: financing
          label: 融资锚点
          detail: $600M Series F 轮融资与要约收购确立了 $15B 的名义估值。
        - id: denominator
          label: 指标冲突
          detail: $415M 营收标签数据与 $830M ARR 估算相互冲突，无法提供单一可审计的分母基准。
        - id: terms
          label: 证券条款不确定性
          detail: 公开披露的优先权线索无法推导完全稀释后的持股比例或完整的优先股堆叠。
        - id: liquidity
          label: 退出路径不确定性
          detail: 二级市场交易清淡且缺乏明确的 IPO 时间表，削弱了投资回报的能见度。
        - id: decision
          label: 进一步调研
          detail: 进场前须核实经审计的关键指标、合同履约质量、股权结构表明细及可信的退出路径。
    approximationNotes: 此为定性决策逻辑推导序列；未设定主观概率，亦未推断转化率。
    claimRefs:
      - CV002
      - CV008
      - CV010
      - CV014
      - CV016
