      - number: '1.4'
        title: 运营规模、战略里程碑与新出现的阻力
        blocks:
          - type: paragraph
            body: >-
              Applied Intuition 的全球团队规模已扩张至 1,000 多名工程师，并在北美、欧洲与亚洲拥有 1,290 至 1,620 名员工
              [CO014]。运营里程碑展现出从仿真工具（Simian、Spectral）迈向端到端任务软件栈的演进路径，标志性事件包括 2025 年 2 月收购 EpiSci 以获取航空、海事和太空国防项目，以及 2025
              年 10 月与 Stellantis 达成里程碑式的多年期 Vehicle OS 合作协议 [CO015]。公司已渗透全球前 20 大汽车 OEM 中的 18 家，并获得多项重大美国国防部（U.S.
              Department of Defense）合同载体，包括一项 $249 million 的一揽子采购协议（Blanket Purchase Agreement）[CO005,
              CO015]。尽管如此，针对收入构成、项目取消风险以及 OEM 量产就绪度，依然存在关键尽调缺口
              [CO016]。虽然商业合作关系据广泛报道，但经常性软件许可与试点专业服务、涉密国防拨款之间的真实比例在公开领域仍未获审计 [CO016]。
