      - number: '8.2'
        title: 融资背景、稀释与入场纪律
        blocks:
          - type: paragraph
            body: >-
              留存的最新定价事件为 2025 年 6 月的 F 轮融资及要约收购。多家信源报道本轮融资 $600 million，投后估值达 $15 billion，较 2024 年 3 月报道的 E 轮 $6 billion
              估值跃升 2.5x。Multiples 与 Sacra 称其中约 $200 million 为新股资本，$400 million 为老股收购，因此绝不能将整轮融资金额直接视为资产负债表新增现金。Forge
              另行记录 F 轮发行额为 $220.56 million，附带 1.0x 不参与分配清算优先权；这提供了证券层面的有效线索，但并非完整的股权结构表。在测算股权稀释、现金跑道或优先股悬顶前，必须理清报道的新股金额与
              Forge 发行数据之间的出入。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
      - number: '8.3'
        title: 投资逻辑、反向逻辑与可比公司背景
        blocks:
          - type: paragraph
            body: >-
              投资逻辑在于：Applied Intuition
              兼具企业级软件的商业模式，以及难以复制的汽车与国防客户分销渠道。反向逻辑则是：公开证据精度不足，无法看清这一战略卡位究竟有多少能转化为持久、高毛利的经常性收入。Multiples 将 $415 million
              标为 2025 年 6 月收入并算出 36.1x 市销率，同时警告其融资挂钩数据可能是收入、ARR、运行率或 LTM。Sacra 则估计 2025 年 ARR 为 $830
              million，其风险分析还着重指出了既有厂商盘踞与平台同质化风险。Multiples 选取的公开可比公司跨越不同业务类型，市销率从 1.9x 延伸至 33.6x，仅能作为敏感性分析的端点，不能构成
              Applied Intuition 配得上特定估值倍数的独立证明。
            claimRefs:
              - CV006
