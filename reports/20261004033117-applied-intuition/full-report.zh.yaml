      - number: '7.2'
        title: 运营、质量与安全风险敞口
        blocks:
          - type: paragraph
            body: >-
              平台的运行可靠性高度依赖复杂的数字主线（digital thread）集成、大规模硬件在环（HIL）测试执行以及庞大的云端算力基础设施，这给企业采购方带来了巨大的隐性总拥有成本（TCO）。独立基准评测给予
              Applied Intuition 综合 3.5 分（满分 5 分）的供应商评级，指出尽管其仿真精度与 SDK 能够与 ROS 2、AUTOSAR 及 Nvidia DRIVE 良好对接，但在打通企业级
              PLM、MES 与 ERP 系统的数字主线深度上依然薄弱，需要采购方自行开发生命周期上下文信息 [CR001, CR006]。首年企业级客户导入及从传统仿真生态迁移需要巨大的工程资源投入，PB
              级车队数据接入、场景标注与合成测试执行在基础软件授权费之外催生了高昂的算力与存储开支 [CR001, CR007]。在人员与安全治理端，Applied Intuition 强制推行每周五天全天在 Mountain
              View 总部及各区域办公室现场办公的考勤制度，这在顶尖人才竞争激烈的都市圈给专用固件 HIL 与物理 AI 工程师的招募与留存带来阻力 [CR008,
              CR009]。此外，独立评估提示其缺乏针对影响车队安全运行的网络安全事件的实测应急响应预案，随着客户车队从孤立的仿真基准走向实车路测部署，该短板暴露出运营脆弱性 [CR001, CR010]。
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
