          - type: callout
            title: 估值敏感度与公开审计财务数据缺失
            body: >-
              Applied Intuition 的 $15 billion 估值对应高达约 18x 至 24x 的远期 ARR 倍数，远高于 Mobileye
              等上市公司同行。在缺乏证实净收入留存率、软件毛利率及客户集中度的公开审计财务披露的情况下，若增长放缓，当前资本结构将面临实质性估值风险 [CO011, CO012]。
            calloutType: risk
