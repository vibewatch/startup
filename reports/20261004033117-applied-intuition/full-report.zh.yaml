              - CM014
      - number: '2.4'
        title: 采纳驱动因素、结构性瓶颈与尽调现实
        blocks:
          - type: paragraph
            body: >
              推动 Applied Intuition 加速落地的关键宏观驱动因素包括：车企对抗垂直整合型 EV
              制造商的竞争加剧、软件定义汽车架构的战略性兴起，以及要求部署自主系统的军事现代化举措。此外，监管框架日益要求在实际道路部署前提供严谨的虚拟仿真证据与基于场景的测试，以满足安全认证标准，从而将仿真工具链从可选的生产力软件提升为刚性的合规基础设施。


              相反，实质性的落地制约与阻力决定了现实的市场兑现程度。尽管全球已累计投入超过 $160 billion，但真正商业化的 Level 4 Robotaxi 部署始终滞后于最初的行业预期；当 OEM
              客户削减项目预算时，企业销售周期就会被迫拉长。此外，总拥有成本（TCO）带来了隐性阻力：在基础软件许可之外，采购方必须为高性能 GPU 算力集群、PB
              级传感器数据存储、专业工程人才以及深度中间件集成承担高昂开支。缺乏公开报价单的不透明定价机制给中层采购方带来了预算不确定性，而依托专有场景库与验证资产形成的供应商锁定则抬高了切换成本并延长了采购审查周期。
            claimRefs:
              - CM007
              - CM009
              - CM010
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 图表清单
        blocks:
          - type: callout
            title: 市场边界扩张：从仿真走向整车基础设施
            body: >
              Applied Intuition 的核心市场定位已从自动驾驶仿真这一专业细分领域，拓展为提供 Vehicle OS、座舱智能（Cabin
              Intelligence）及全套自动驾驶栈的综合软件平台。这一演进使公司得以切入除自由裁量研发席位之外更广泛的汽车量产预算。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM013
          - type: callout
            title: 自动驾驶落地迟缓直接危及数百亿美元级的市场测算预期
            body: >
              关于自动驾驶汽车数千亿美元级可开拓市场的预测，建立在商业化 Level 4/5 落地节奏的基础之上，而这一节奏已屡次错失行业预期的时间表。一旦 OEM
              项目放缓或倒退回基础辅助驾驶，企业销售周期将被迫拉长，平台采购支出也将面临预算压缩。
            calloutType: risk
            claimRefs:
              - CM005
              - CM010
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争边界超越同类软件平台
        blocks:
          - type: paragraph
            body: >-
              相关竞争格局远超出单一自动驾驶软件供应商名录。RFP.wiki 将 NVIDIA DRIVE、Kodiak AI、Baidu Apollo 和 Wayve 列为同类头部竞品；CNBC 则指出 Wayve 和
              Momenta 是其全球初创竞品，并将 Waymo 列为潜在替代目标。上述来源表明，该市场既涵盖全栈计算生态，也包含垂直自动驾驶供应商及操作软件替代方案。客户亦可保留现有单点工具组合或选择内部自研，尤其鉴于
              Applied Intuition 将其汽车自动驾驶产品定位为白盒系统，允许 OEM 保留架构控制权。公开证据无法构成全量企业统计，因而对比画像表旨在提供代表性决策框架，而非穷尽式市场普查。
            claimRefs:
