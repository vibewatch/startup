  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品矩阵与客户工作流集成
        blocks:
          - type: paragraph
            body: >-
              Applied Intuition 将其产品线划分为三大支柱，旨在覆盖软件定义汽车（SDV）与自主移动机械的全生命周期：Tools & Infrastructure、Vehicle OS 以及 Autonomy
              Systems。平台起步于高保真仿真与合成数据集生成，现已从离线测试环境拓展为贯穿物理机械的端到端运行底座，覆盖汽车、国防、卡车货运、建筑工程、采矿及农业等领域。在汽车软件开发周期中，工程团队在针对罕见长尾极端工况（edge
              cases）验证自动驾驶及高级辅助驾驶系统（ADAS）时面临严峻约束：实际车队路测耗资巨大、具有危险性且统计验证效率低下。Applied Intuition 切中该痛点，通过自动化数据管理系统 Basis
              接入原始车辆传感器日志，使工程师能够通过编程检索并整理实车脱退事件；随后将上述真实驾驶异常导入核心场景构建与仿真引擎
              Simian，由后者合成数百种参数化环境变体——动态调整车速、降水、光照强度与轮胎摩擦系数，进而在将代码部署至实车之前，依托云端算力对自动驾驶感知与运动规划栈开展大规模压力测试。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE009
              - CE010
      - number: '5.2'
        title: 运行架构与抽象层设计
        blocks:
          - type: paragraph
            body: >-
              Applied Intuition
              的核心技术立论在于：支配机械运动的物理动力学与数学原理在各类运载工具间具有内在一致性，因而能够依托统一软件架构控制乘用车、商用重卡、水面舰艇及矿用挖掘机。传统汽车工程数十年间累积了庞杂的分布式电子控制单元（ECU），Tier
              1 供应商交付的孤立硬件通常绑定专用固件与点对点线束。Applied Intuition 的 Vehicle OS
              则发挥硬件抽象层（HAL）功能，将底层计算芯片、传感器与执行器同上层自动驾驶及座舱娱乐软件解耦。这一模块化中间件架构集成了 AUTOSAR、ROS 2
              以及车载以太网等汽车行业标准接口，使汽车原始设备制造商（OEM）能够在计算硬件迭代升级的同时独立推进上层应用软件开发。在传感器仿真层，Spectral
              模块负责对激光雷达、毫米波雷达及摄像头的物理反射特性执行高保真渲染；Strata 依据 ISO 26262 功能安全规范追踪验证覆盖率指标；在国防领域，Axion
              平台则将该基础设施拓展至多域指挥系统与合成战场建模，整合实况、虚拟与构建型（LVC）仿真联邦。
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
