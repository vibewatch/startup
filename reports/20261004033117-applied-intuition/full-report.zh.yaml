      - number: '4.3'
        title: 资金充裕度、融资架构与投资承销结论
        blocks:
          - type: paragraph
            body: >-
              Applied Intuition 资产负债表资金充裕，在其 2025 年 6 月由 BlackRock 旗下基金与 Kleiner Perkins 联合领投的 Series F 融资中斩获 $15
              billion 投后估值。该轮交易总额为 $600 million，包含约 $200 million 新增一级资本与 $400 million 老股转让，使公司累计获得的一级股权融资总额达到约 $1.2
              billion。雄厚的资金储备为公司提供了数年运营安全垫，有力支持其在英国、日本等区域的全球扩张，以及对具身物理 AI（embodied physical
              AI）与国防系统的持续战略投资。尽管坐拥顶级机构投资者的强力背书，但一级市场的非公开性对最终估值承销构成制约：公司未公开披露 GAAP
              收入、经审计毛利率、净留存率（NRR）或客户集中度指标。潜在投资者在进行估值承销时，必须将获取经审计财务报表作为先决条件，严格厘清持续性授权 ARR
              与定制化专业技术服务的边界，并核实商业扩张并非依赖持续的资本输血补贴。
