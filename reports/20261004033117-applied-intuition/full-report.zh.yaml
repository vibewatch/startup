  - id: TV003
    title: 乐观、基准与悲观估值敏感性分析
    columns:
      - 情景
      - 明确假设
      - 测算估值区间
      - 概率信号
      - 下行或上行触发因素
    rows:
      - - 悲观
        - 来自 Multiples 的 2025 年 6 月 $415M 指标；1.9x-6.8x 选定上市公司参考估值倍数。
        - $0.8B-$2.8B
        - 若较低的分母得到证实或高增长势头放缓，该情景概率上升。
        - 经审计 ARR 低于较高预估值、留存疲软或估值倍数压缩。
      - - 基准
        - 来自 Sacra 的 2025 年 $830M ARR 预估；6.8x 参考估值倍数至 $15B 表观估值隐含的 18.1x 估值倍数。
        - $5.6B-$15.0B
        - 若经审计 ARR 接近预估值且盈利能力得到验证，该情景概率上升。
        - 客户集中度高、毛利率下降或证券条款产生重大稀释。
      - - 乐观
        - 2025 年 $830M ARR 预估；18.1x 表观估值隐含倍数至 33.6x 选定上市公司参考倍数上限。
        - $15.0B-$27.9B
        - 仅当优质软件商业模式得到验证且国防收入持续扩张时，该情景概率才会上升。
        - 持续增长、强劲净留存、流动性清晰且无优先清算权悬坠负担。
    notes: 区间为四舍五入后的算术敏感性测算，并非独立的估值结论或目标价；来源时期、指标定义及商业模式并不完全可比。
    claimRefs:
      - CV001
