  - id: TV002
    title: 投资逻辑与反向逻辑
    columns:
      - 视角
      - 基于证据的论点
      - 何种情况会改变观点
    rows:
      - - 投资逻辑
        - 规模：官网宣称拥有 1,000+ 名工程师，CNBC 报道称其覆盖前 20 大车企中的 18 家。
        - 若经审计的客户队列显示广泛的量产部署与持续扩张，将强化这一论点。
      - - 投资逻辑
        - 国防业务：CNBC 与 Tectonic Defense 证实有一笔 $171M 的 DoD 仿真测试合同。
        - 若有证据表明已确认高毛利收入并赢得后续合同，将支撑估值溢价。
      - - 投资逻辑
        - 运营质量：CNBC 报道称，公司宣称其自成立以来始终保持盈利。
        - 经审计的经营性现金流、毛利率及股权激励数据，能将该说法转化为投资决策依据。
      - - 反向逻辑
        - 指标歧义：Multiples 标出的 $415M 收入与 Sacra 预估的 2025 年 $830M ARR 存在冲突。
        - 收入确认勾稽表与经审计的 ARR 明细表有助于理清分母。
      - - 反向逻辑
        - 竞争格局：Sacra 指出老牌仿真厂商根深蒂固，且云厂商或半导体平台可能带来通用化与同质化风险。
        - 若有据可查的竞标胜出记录、续约队列及稳定的定价策略，将减轻该风险。
      - - 反向逻辑
        - 流动性：Forge 报道称市场交易活跃度有限且无可用价格，CNBC 报道称并无明确的 IPO 相关表态。
        - 合资格的老股交易或董事会批准的退出计划将改善价格发现机制。
    notes: 公司发布的规模与盈利表态均被定性为主张；独立媒体报道不能替代经审计的财务或合同凭证。
