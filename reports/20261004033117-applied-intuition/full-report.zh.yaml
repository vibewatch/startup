      - number: '2.3'
        title: 买方分群、预算归属与采购路径
        blocks:
          - type: paragraph
            body: >
              Applied Intuition 的商业落地路径细分为三大主要买方群体：汽车 OEM、商业非公路机械/卡车车队以及政府国防项目。在汽车 OEM 内部，预算控制权分布于自动驾驶/ADAS
              副总裁、首席技术官以及车辆安全/准入认证总监。企业采购模式依赖「席位加算力」的订阅许可，模块化方案涵盖开发工具、Vehicle OS 及自动驾驶技术栈。尽管官方标价未公开公布，但采购摸底基准显示销售周期通常为 6
              至 18 个月，多年期合同承诺的年价值往往达到六至七位数。


              商业与国防垂直领域的采购路径存在显著差异。汽车领域采购聚焦于工程席位许可、云端/本地仿真算力集群调用，以及与 ROS 2、AUTOSAR 和 Nvidia DRIVE 的定制中间件集成。在国防领域，Applied
              Intuition 借助主要联邦采购渠道签订合同，包括五角大楼首席数字与人工智能办公室（CDAO）授予的 $171.1 million 生产合同，以及参与陆军 $249 million
              的一揽子采购协议。在这两大领域，客户采用均始于独立的高保真仿真模块（如目标或传感器仿真），随后拓展至任务规划或完整的车辆操作系统，从而积聚起显著的扩张收入动能。
            claimRefs:
              - CM002
              - CM006
              - CM009
              - CM010
              - CM012
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM009
