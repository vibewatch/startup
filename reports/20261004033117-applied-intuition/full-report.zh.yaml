  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群体与采购决策中心
        blocks:
          - type: paragraph
            body: >-
              Applied Intuition 展示的客群覆盖汽车、国防、卡车货运、建筑工程、采矿及农业，通过工具与基础设施、操作系统及自动驾驶软件提供服务 [CU001,
              CU002]。最强规模背书来自公司官方发布：据称全球前 20 大车企中已有 18 家采用其方案，同时服务美军及其盟友 [CU003]。Manhattan Venture Partners 独立点名了
              Volkswagen、Toyota、Porsche、Nissan、U.S. Army 以及 Defense Innovation Unit，但未披露对应合同体量或部署范围
