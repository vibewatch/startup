      - number: '7.3'
        title: 合作伙伴、客户群与财务模型依赖风险
        blocks:
          - type: paragraph
            body: >-
              Applied Intuition 的商业模式高度依赖传统汽车原始设备制造商（OEM）、Tier 1 汽车供应商以及美国国防部（DoD）的项目预算。尽管公司宣称服务全球前 20 大车企中的 18
              家，但汽车主机厂仍是其核心商业基本盘，使业务面临 6 至 18 个月的漫长销售周期、客户采购议价压制以及 OEM 资本开支波动的风险 [CR001,
              CR011]。其商业软件合同在席位加算力订阅模式下平均年化金额预估达 $740K，但标准公开报价的彻底缺失迫使每次客户接洽均沦为定制化商务谈判，使采购方在自动驾驶里程或地域扩张时极易遭遇陡峭的价格阶梯式跳涨
              [CR001, CR007]。与此同时，公司激进加码国防业务——收购战术 AI 机构、与能源部联合开展 Golden Dome 模拟导弹防御合作，并斩获 $171 million
              国防部仿真测试合同——这推高了地缘政治审查、主权出口管制风险以及联邦国防拨款周期波动的风险 [CR011, CR012]。尽管 Dana 等智能体平台力图将物理 AI
              推广至采矿、货运及农业领域，但汽车与国防之外的商业化落地尚处早期阶段，使整体业务高度暴露于车企平台换代风险及传统存量工具链的锁定防御之中 [CR010, CR013]。
            claimRefs:
              - CR001
              - CR007
              - CR010
              - CR011
              - CR012
              - CR013
