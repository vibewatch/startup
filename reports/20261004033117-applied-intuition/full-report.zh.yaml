      - number: '3.2'
        title: 产品广度与架构开放性构成核心差异化主张
        blocks:
          - type: paragraph
            body: >-
              Applied Intuition 的官方定位涵盖 Tools for Vehicle Intelligence、Vehicle OS 与 Self-Driving
              System；独立采购画像亦将其描述为融合自动驾驶软件、仿真、验证与开发工具链的综合方案。已发布的汽车 SDS 将该覆盖度延伸至白盒 L2++ 产品，并规划了通往 L3 和 L4
              能力的路径。这构建起坚实的采购切入点：OEM
              既能借助统一平台打通开发与量产部署，又无需出让传感器、计算平台或品牌级控制权。现有证据仍高度偏向发行方自身陈述：白盒与集成优势均来自公司发布材料（含联合发布声明），而非竞品对比实测。因此，采购方应分别评估架构开放性、验证可追溯性与集成负担，切勿直接将产品广度等同于运行时自动驾驶性能优势。
            claimRefs:
              - CP002
              - CP003
              - CP004
