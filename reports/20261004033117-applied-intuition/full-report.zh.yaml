      - number: '6.3'
        title: 业务可持续性、客户扩展与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Applied Intuition 的既定商业模式是由整车厂掌控终端渠道，自身提供智能能力与系统集成，使软件能够嵌入合作伙伴品牌产品中而无需建立面向 C 端的消费品牌 [CU011]。在 BigGo
              整理的联合创始人访谈中，Qasar Younis 称汽车业务约占其总收入的 30%，其余来自国防、采矿、建筑及农业领域；但这属于管理层单方陈述，并非经审计的分部财务报告 [CU012]。Verdict
              亦报道了其与 OpenAI、TRATON、Isuzu、Porsche 及 Audi 的合作关系，这证实了生态广度，但不足以证明每份合作均为付费且可持续的商业合同 [CU014]。从公司宣称拥有 1,000
              名工程师、40 位前 CTO 与 30 位前创业创始人来看，其交付能力相当可观 [CU015]。然而分析师报告提示，投资热情回落、公众信任度、融资环境以及不断演变的监管规则可能延缓自主移动出行的落地节奏
              [CU016]。指定证据均未披露 NRR、GRR、流失率、续约条款、单客收入或头部客户集中度，导致对其业务韧性与议价能力的定性仍缺乏闭环支撑。
