  - id: FU001
    title: 受证据约束的客户旅程图
    type: journey-map
    summary: 有据可查的路径涵盖从工作流调研、仿真评估到受控集成的全过程，而续约与扩张证据仍属非公开信息。
    data:
      items:
        - label: 工作流探索
          detail: 通过对商用和国防客户人员进行调研，梳理其实际业务需求。
          touchpoints: User research, pain-point discovery, and operational requirements
        - label: 仿真评估
          detail: AISIN 在虚拟泊车场景中评估传感器与目标物行为。
          touchpoints: Sensor simulation and object simulation
        - label: 前置验证
          detail: 功能验证节点前移至物理测试之前。
          touchpoints: Virtual validation before field testing
        - label: 项目基线
          detail: 客户项目对照里程碑、范围、风险与依赖项严格管控。
          touchpoints: Statement of work, milestones, risk register, and dependency map
        - label: 整车集成
          detail: 面向客户的团队统筹驻场集成与外场活动。
          touchpoints: Program governance, technical escalation, and onsite integration
        - label: 平台拓展
          detail: 横向平台模式可从单点工具延伸至操作系统与自动驾驶方案。
          touchpoints: Manufacturer distribution with Applied intelligence and integration
    approximationNotes: 各阶段综合整理自已记录的 AISIN 合作及招聘岗位工作流；此非实测漏斗，且所引来源均未量化阶段转化率、续约率或拓展率。
