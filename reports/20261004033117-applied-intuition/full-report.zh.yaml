  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类架构与现状替代方案
        blocks:
          - type: paragraph
            body: >
              Applied Intuition 将其市场品类定义为面向移动机械的物理 AI 与开发基础设施，涵盖乘用车、商业卡车货运、国防、采矿、建筑和农业领域的 ADAS 仿真、Vehicle OS
              及自动驾驶技术栈。核心业务边界包括虚拟测试软件订阅（目标与传感器仿真、日志回放、硬件在环验证）、管理车载中间件与车外数字孪生的车辆操作系统，以及战术多域自主软件。Applied Intuition
              明确排除在其商业边界之外的领域包括实体车辆制造、专有车队所有权或 Robotaxi 运营（如 Waymo 或 Cruise），以及面向消费者的零售车辆销售。


              现状替代方案构成了业务扩张的主要障碍。汽车 OEM 历史上依赖碎片化的内部脚本环境，或来自 dSPACE、Siemens 和 Ansys
              等传统厂商的汽车仿真工具链，这些成熟厂商拥有数十年的硬件在环测试积淀与根深蒂固的 ISO 26262 合规工作流。此外，AWS 和 Microsoft
              等超大规模云厂商提供通用机器人仿真平台，而垂直初创企业则专注于场景覆盖或传感器仿真等细分领域。Applied Intuition
              致力于将其模块化套件打造为整合这些割裂点工具的统一开发主线，在降低跨领域工程摩擦的同时，助力传统车企应对垂直整合型 EV 竞争对手。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM007
              - CM010
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM013
      - number: '2.2'
        title: 市场规模测算：测算视角、增长轨迹与支出周期
        blocks:
          - type: paragraph
            body: >
              评估 Applied Intuition 的市场规模需要考量多个不同的支出周期，而非依赖单一的 TAM 数据。在近期，第三方行业报告预测全球自动驾驶汽车市场规模到 2026 年将达到 $64.88
              billion，这主要由传统车企、出行运营商与科技企业加速交付 ADAS 及 AD 功能的竞争紧迫感所驱动。与此同时，美国国防部（U.S. Department of Defense）在 FY 2026
              预算申请中专门为自主化与无人系统拨出 $13.4 billion，为战术自主化与合成仿真试验场提供了即时可用、非周期性的资金来源。


              从十年周期来看，行业长期预测（如 McKinsey 的展望）预计到 2035 年全球自动驾驶汽车收入将扩大至 $300 billion 到 $400 billion
              之间。然而，软件平台的可服务市场（SAM）仅占自动驾驶汽车总价值的一小部分，主要集中在工程软件许可、算力驱动的仿真工作负载以及单车操作系统授权费。一级市场测算（如 Sacra）估计 Applied
              Intuition 在 2025 年横跨工具、车辆平台和自主系统实现的年经常性收入达到 $830
              million，反映出快速的商业化变现步伐，但也凸显出商业大单仍以定制化和多年期为主。软件市场的可开拓空间进一步受制于应用落地阻力：一旦车辆自主化项目停滞或缩减，软件许可的扩张也将直接放缓。
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM008
              - CM011
