  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与定价体系
        blocks:
          - type: paragraph
            body: >-
              Applied Intuition 主要作为企业级 B2B 软件供应商运作，向汽车 OEM、Tier 1 供应商及国防项目销售虚拟仿真与测试基础设施。来自 Sacra
              的第三方研报显示，公司商业化变现依托年度软件授权，具体按工程席位数、仿真计算工作负载及特定产品模块部署计费。其产品线横跨三大支柱：Tools and Infrastructure、模块化 Vehicle OS
              以及自动驾驶应用软件栈。尽管企业级标准公开定价完全保密，但 EquityZen 和 UpMarket 等二级市场平台证实，合格投资者准入需经私下审核，且合同条款均采取双边谈判确定。第三方研究模型假设其毛利率为
              85%，符合云原生仿真平台的典型水平。然而，r/automotive 上的匿名工程师发帖指出，Applied Intuition
              本质上大量承担高介入度服务与咨询职能，其相当一部分收入来自定制集成开发，而非纯软件订阅。这一分歧引出核心尽调疑问：其披露的 ARR 究竟反映了可规模化扩张的软件授权，还是重资本投入的定制化工程外包服务。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
