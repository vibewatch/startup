        title: 图表清单
        blocks:
          - type: callout
            title: 横跨汽车 OEM 的通用横向市场地位
            body: >-
              Applied Intuition 在传统车企中取得了前所未有的商业渗透，服务于全球前 20 大 OEM 中的 18
              家。依托中立于供应商的仿真与车辆操作系统，公司避免了与汽车品牌的直接竞争，同时锁定了高黏性的经常性软件支出 [CO005]。
            calloutType: strength
            claimRefs:
