      - number: '8.4'
        title: 情景推演、退出就绪度与逻辑证伪测试
        blocks:
          - type: paragraph
            body: >-
              下述情景测算均为机械敏感性分析，并非目标定价。悲观情景采用 Multiples 偏低的 $415 million 分母及选定的 1.9x 至 6.8x 公开参考倍数；基准与乐观情景则采用 Sacra 估计的
              $830 million ARR，并匹配逐步上调的参考倍数。由此产生的估值分歧本身就是核心发现：仅凭公开输入数据，机械测算出的估值便横跨从低于 $1 billion 到接近 $28
              billion，强行分配数字概率只会产生虚假精度。以下情况将证伪投资逻辑：经审计的 ARR
              大幅低于上述较高估算值；毛利率或留存率撑不起软件溢价倍数；客户或国防业务过度集中；或清算优先权与稀释条款削弱了普通股收益。在管理层拿出 IPO
              或战略退出路径、近期老股交易佐证以及董事会批准的资本规划前，退出就绪度仍未经证明。
            claimRefs:
