      - number: '6.3'
        title: Durability, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Applied Intuition's stated model is to let manufacturers own distribution while it supplies intelligence
              and integration, a structure that can place its software inside partner-branded products without requiring
              a consumer brand [CU011]. In the cofounder interview summarized by BigGo, Qasar Younis said automotive
              represented roughly 30% of revenue and that defense, mining, construction, and agriculture supplied the
              remainder; this is a management claim rather than audited segment reporting [CU012]. Verdict also reported
              partnerships with OpenAI, TRATON, Isuzu, Porsche, and Audi, evidence of ecosystem breadth but not proof
              that each relationship is a paying, durable customer contract [CU014]. Delivery capacity appears
              substantial from the company's claim of 1,000 engineers, 40 former CTOs, and 30 former founders [CU015].
              However, the analyst report warns that investor interest, public trust, funding conditions, and evolving
              regulation can slow autonomous-mobility adoption [CU016]. No assigned source supplies NRR, GRR, churn,
              renewal terms, customer-level revenue, or top-customer concentration, leaving durability and
              bargaining-power conclusions open.
