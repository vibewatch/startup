chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Applied Intuition, Inc. is an enterprise software and artificial intelligence company founded in 2017 by
              CEO Qasar Younis and CTO Peter Ludwig [CO001]. The company maintains its corporate headquarters in
              Mountain View and Sunnyvale, California, operating a distributed global footprint across engineering and
              field offices in Washington, D.C., Detroit, Ann Arbor, London, Munich, Stuttgart, Stockholm, Seoul, and
              Tokyo [CO002]. Operating at the Series F venture stage following a $600 million equity financing and
              tender offer in June 2025 that valued the business at $15 billion post-money, Applied Intuition positions
              itself as a horizontal physical AI platform providing simulation software, vehicle operating systems, and
              autonomy stacks across automotive, commercial trucking, mining, construction, agriculture, and defense
              domains [CO003]. The company's core economic model functions as a modular enterprise software subscription
              offering high gross margins of approximately 80% to 85%, deploying a land-and-expand sales motion across
              Tier-1 automotive manufacturers and defense programs [CO004]. Independent industry analysis categorizes
              Applied Intuition as pursuing an open, vendor-neutral infrastructure strategy—frequently termed the
              Android model of autonomous mobility—contrasting with vertically integrated proprietary architectures such
              as Tesla's Full Self-Driving stack [CO005].
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
