  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk Profile
        blocks:
          - type: paragraph
            body: >-
              Applied Intuition operates at the intersection of safety-critical automotive autonomy and regulated
              federal defense procurement, creating substantial regulatory and legal exposure across civil vehicle
              standards and military contracting rules. In commercial automotive, independent procurement evaluations
              highlight critical security and compliance deficiencies, including missing public evidence for secure
              over-the-air (OTA) update controls and rollback mechanisms, weak incident data retention and forensic
              chain-of-custody protocols, and limited formal documentation mapping runtime software behaviors to
              regional autonomous vehicle (AV) homologation rules [CR001, CR002]. Because Applied Intuition positions
              its stack for production Advanced Driver Assistance Systems (ADAS) and Autonomous Driving (AD), failure to
              satisfy regional safety cases or maintain auditable launch gates exposes customers and the company to
              severe regulatory enforcement and product liability [CR001, CR003]. Concurrently, the company's expanding
              public-sector footprint subjects it to federal contractor affirmative action and employment regulations
              under 41 CFR 60-1.4(a), 41 CFR 60-300.5(a), and 41 CFR 60-741.5(a), requiring affirmative action
              compliance for protected veterans and individuals with disabilities [CR004]. In addition, secondary market
              share transaction terms impose strict board approval gates and rights of first refusal on equity
              transfers, restricting private liquidity and introducing governance friction for external institutional
              investors [CR005].
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
          - type: figure
