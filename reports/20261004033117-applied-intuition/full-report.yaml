      - number: '6.2'
        title: Adoption and reference quality
        blocks:
          - type: paragraph
            body: >-
              AISIN is the best documented customer example in the assigned evidence. Its case study says the supplier
              integrated Applied Intuition's ADP solution for sensor simulation, object simulation, and cloud
              collaboration in automated-parking development [CU005]. The same source states that full-scale deployment
              remains ongoing, so the evidence should not be presented as a completed production rollout [CU006]. An
              AISIN engineer nevertheless attributes faster decisions, less misalignment, and greater transparency to
              shared standards and perspectives [CU007]. Broader adoption evidence is less auditable. Manhattan Venture
              Partners reports a 90% reduction in real-world testing and 10x faster ADAS/AD development, but the fetched
              report does not provide customer-level denominators for those aggregate benefit claims [CU013]. A newly
              formed Detroit-based team for a flagship global OEM program indicates active delivery investment, yet the
              customer is unnamed and the job posting does not establish revenue, production units, or renewal status
              [CU008, CU009].
