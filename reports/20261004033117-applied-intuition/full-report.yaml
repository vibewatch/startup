            title: Universal Horizontal Market Position Across Automotive OEMs
            body: >-
              Applied Intuition has achieved unprecedented commercial penetration among legacy automakers, serving 18 of
              the top 20 global OEMs. By providing vendor-neutral simulation and vehicle operating systems, the company
              avoids direct competition with vehicle brands while capturing sticky recurring software spend [CO005].
