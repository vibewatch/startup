    columns:
      - Lens
      - Evidence-based argument
      - What would change the view
    rows:
      - - Thesis
        - 'Scale: official pages claim 1,000+ engineers and CNBC reports 18 of the top 20 automakers.'
        - Audited customer cohorts showing broad production deployment and durable expansion would strengthen the case.
      - - Thesis
        - 'Defense: CNBC and Tectonic Defense identify a $171M DoD simulation-testing contract.'
        - Evidence of realized high-margin revenue and follow-on awards would support a premium.
      - - Thesis
        - 'Operating quality: CNBC reports the company''s claim that it has been profitable throughout its history.'
