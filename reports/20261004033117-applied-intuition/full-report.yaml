      - Explicit assumptions
      - Mechanical valuation range
      - Probability signal
      - Downside or upside trigger
    rows:
      - - Bear
        - $415M June 2025 metric from Multiples; 1.9x-6.8x selected public reference multiples.
        - $0.8B-$2.8B
        - Rises if the lower denominator is confirmed or premium growth decelerates.
        - Audited ARR below the higher estimate, weak retention, or multiple compression.
      - - Base
        - >-
          $830M 2025 ARR estimate from Sacra; 6.8x reference multiple to the 18.1x multiple implied by the $15B
          headline.
        - $5.6B-$15.0B
        - Rises if audited ARR approaches the estimate and profitability is verified.
        - Concentration, lower gross margin, or materially dilutive security terms.
      - - Bull
