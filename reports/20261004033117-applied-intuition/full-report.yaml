          $830M 2025 ARR estimate; 18.1x headline-implied multiple to the 33.6x upper selected public reference
          multiple.
        - $15.0B-$27.9B
        - Rises only with verified premium software economics and expanding defense revenue.
        - Sustained growth, strong net retention, visible liquidity, and no preference overhang.
