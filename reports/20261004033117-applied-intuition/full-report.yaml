      - number: '4.3'
        title: Capital Adequacy, Financing Structure, and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              Applied Intuition has accumulated substantial balance-sheet liquidity, securing a $15 billion post-money
              valuation in its June 2025 Series F financing co-led by BlackRock-managed funds and Kleiner Perkins. The
              Series F transaction totaled $600 million, comprised of approximately $200 million in primary capital and
              $400 million in secondary share purchases, bringing lifetime primary venture funding to approximately $1.2
              billion. This capital cushion provides multi-year runway to support global expansion in regions like the
              UK and Japan, as well as continued strategic investments in embodied physical AI and defense systems.
              Despite strong headline backing from top-tier institutional investors, definitive underwriting is impeded
              by private-market opacity: the company does not publicly disclose GAAP revenue, audited gross margins, net
              retention rates, or customer concentration metrics. Prospective investors must condition valuation
              underwriting on obtaining audited financial statements that separate recurring license ARR from bespoke
              professional services, and verify that commercial expansion does not depend on continuous capital
              subsidies.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Software Multiples Dependent on Service Disaggregation
            body: >-
              Applied Intuition commands a $15 billion premium valuation based on market perception that it is a
              pure-play AI vehicle software platform generating an estimated $830 million in ARR with 85% gross margins.
              However, if diligence reveals that a material fraction of billings is derived from bespoke integration
              services as employee accounts suggest, the blended margin profile and recurring quality of its revenue
              would compress substantially.
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI009
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Customer Workflow Integration
        blocks:
          - type: paragraph
            body: >-
              Applied Intuition structures its offerings into three core product pillars designed to support the entire
              lifecycle of software-defined vehicles and autonomous machinery: Tools & Infrastructure, Vehicle OS, and
              Autonomy Systems. Historically anchored in high-fidelity simulation and synthetic dataset generation, the
              platform has expanded from an offline testing environment into an end-to-end operating substrate for
              physical machines operating across automotive, defense, trucking, construction, mining, and agriculture.
              In the automotive software development lifecycle, customer engineering teams face severe constraints when
              validating autonomous driving and advanced driver assistance systems (ADAS) against rare edge cases, where
              physical fleet testing is capital-intensive, dangerous, and statistically inefficient. Applied Intuition
              addresses this bottleneck by ingesting raw vehicle sensor logs into Basis, an automated data management
              system, allowing engineers to programmatically query and curate recorded driving disengagements. These
              real-world driving anomalies are subsequently imported into Simian, the platform's core scenario authoring
              and simulation engine, which synthesizes hundreds of parameterized environmental variations—modifying
              velocity, precipitation, ambient lighting, and tire friction coefficients to stress-test autonomy
              perception and motion planning stacks at cloud scale before deploying code to physical vehicles.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
