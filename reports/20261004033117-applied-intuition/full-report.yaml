          Audited operating cash flow, gross margin, and stock-compensation data would convert the claim into
          underwriting evidence.
      - - Anti-thesis
        - 'Metric ambiguity: $415M labeled revenue by Multiples conflicts with Sacra''s $830M 2025 ARR estimate.'
        - A revenue-recognition bridge and audited ARR schedule would resolve the denominator.
      - - Anti-thesis
        - 'Competition: Sacra flags entrenched simulation vendors and cloud or semiconductor platform commoditization.'
