      - number: '5.2'
        title: Operating Architecture and Abstraction Layer Design
        blocks:
          - type: paragraph
            body: >-
              The core technical thesis of Applied Intuition is that the physical dynamics and mathematical principles
              governing machine motion are consistent across vehicles, enabling a unified software architecture to
              control passenger cars, commercial haul trucks, naval vessels, and mining excavators. Historically,
              automotive engineering accumulated decades of distributed electronic control unit (ECU) complexity, where
              each tier-1 supplier delivered siloed hardware bundled with bespoke firmware and point-to-point wiring
              harnesses. Applied Intuition's Vehicle OS functions as a hardware abstraction layer (HAL) that decouples
              underlying compute silicon, sensors, and actuators from high-level autonomy and infotainment software.
              This modular middleware architecture integrates standard automotive interfaces including AUTOSAR, ROS 2,
              and Automotive Ethernet networks, allowing automotive original equipment manufacturers (OEMs) to develop
              software applications independently of physical compute transitions. At the sensor simulation layer, the
              Spectral module executes physics-based rendering of LiDAR, radar, and camera returns, while Strata tracks
              verification coverage metrics against ISO 26262 functional safety requirements. For defense environments,
              the Axion platform extends this infrastructure into multi-domain command systems and synthetic battlespace
              modeling, integrating live, virtual, and constructive (LVC) simulation federations.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE005
              - CE008
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE006
              - CE007
              - CE012
      - number: '5.3'
        title: Deployment Engineering, Technical Moats, and Implementation Risks
        blocks:
          - type: paragraph
            body: >-
              Applied Intuition deploys its platform through a hybrid software model comprising cloud-scale SaaS
              orchestration alongside on-premises GPU clusters and hardware-in-the-loop (HIL) vehicle test benches. To
              navigate conservative OEM procurement cycles and complex vehicle electronic architectures, the company
              embeds field solution engineers directly within customer engineering divisions across major automotive
              hubs including Detroit, Tokyo, Munich, and Ann Arbor. These solution teams assist OEMs in transitioning
              from traditional waterfall engineering to iterative, software-driven CI/CD development pipelines,
              conducting validation on physical bucks and development mule vehicles before production sign-off. The
              primary technical moat protecting Applied Intuition's commercial position is deep integration with 18 of
              the top 20 global automakers, supported by extensive libraries of validated scenario behaviors, physics
              models, and compliance reporting tools that represent years of accumulated engineering knowledge. However,
              the company faces significant technical and commercial risks: incumbent automotive testing suppliers such
              as dSPACE, IPG Automotive, Vector Informatik, and Siemens retain deeply entrenched hardware-in-the-loop
              relationships and certified compliance pipelines. Simultaneously, hyperscale cloud providers and
              semiconductor vendors including Nvidia and AWS offer competing robotic simulation frameworks, creating
              potential margin compression or platform commoditization if virtual testing becomes standardized around
              generic cloud toolchains.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
          - type: table
            tableRef: TE003
            claimRefs:
              - CE006
              - CE007
              - CE012
              - CE013
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Strategic Power of Decoupled Vehicle OS
            body: >-
              Applied Intuition's decisive architectural pivot from pure desktop simulation to Vehicle OS mirrors the
              historic separation of hardware and operating systems in computing. By inserting a hardware abstraction
              layer between OEM chassis electronics and autonomy algorithms, Applied Intuition positions itself as an
              indispensable operating system vendor for software-defined vehicles, insulating automakers from compute
              vendor lock-in.
            calloutType: insight
            claimRefs:
              - CE002
              - CE006
              - CE012
          - type: callout
            title: Legacy Tier-1 Lock-in and Cloud Platform Encroachment
            body: >-
              While Applied Intuition has achieved widespread penetration across 18 of the top 20 automakers, incumbent
              testing suppliers like dSPACE maintain deep procurement entrenchment in hardware-in-the-loop facilities.
              Furthermore, aggressive investments in generic robotics simulation by hyperscalers like AWS and
              semiconductor leaders like Nvidia threaten to commoditize basic simulation workflows unless Applied
              Intuition maintains superior automotive safety compliance integrations.
            calloutType: risk
            claimRefs:
              - CE011
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and buying centers
        blocks:
          - type: paragraph
            body: >-
              Applied Intuition presents a customer base spanning automotive, defense, trucking, construction, mining,
              and agriculture, served through tools and infrastructure, operating systems, and autonomy software [CU001,
              CU002]. The strongest scale claim is company-issued: 18 of the top 20 global automakers, plus the United
              States military and allies, are said to use its solutions [CU003]. Manhattan Venture Partners separately
              names Volkswagen, Toyota, Porsche, Nissan, the U.S. Army, and the Defense Innovation Unit, but does not
              disclose contract values or deployment scope for those accounts [CU004]. Buyer evidence points to
              engineering and program leadership rather than end consumers: Applied is recruiting personnel to research
              commercial and defense workflows and to manage a flagship OEM program against a statement of work,
              milestones, risks, dependencies, and vehicle integration activities [CU008, CU009, CU010]. This supports a
              technically intensive enterprise sale, but not a quantified customer count beyond the
              automaker-penetration claim.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU008
