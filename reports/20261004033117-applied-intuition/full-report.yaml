    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape Extends Beyond Like-for-Like Platforms
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is wider than a list of autonomous-driving software vendors. RFP.wiki places
              NVIDIA DRIVE, Kodiak AI, Baidu Apollo, and Wayve among the leading same-category alternatives, while CNBC
              separately identifies Wayve and Momenta as global startup competitors and describes Waymo as a potential
