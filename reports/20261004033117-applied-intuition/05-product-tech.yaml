callouts:
  - calloutType: "insight"
    title: "The Strategic Power of Decoupled Vehicle OS"
    body: "Applied Intuition's decisive architectural pivot from pure desktop simulation to Vehicle OS mirrors the historic separation of hardware and operating systems in computing. By inserting a hardware abstraction layer between OEM chassis electronics and autonomy algorithms, Applied Intuition positions itself as an indispensable operating system vendor for software-defined vehicles, insulating automakers from compute vendor lock-in."
    claimRefs:
      - "CE002"
      - "CE006"
      - "CE012"
  - calloutType: "risk"
    title: "Legacy Tier-1 Lock-in and Cloud Platform Encroachment"
    body: "While Applied Intuition has achieved widespread penetration across 18 of the top 20 automakers, incumbent testing suppliers like dSPACE maintain deep procurement entrenchment in hardware-in-the-loop facilities. Furthermore, aggressive investments in generic robotics simulation by hyperscalers like AWS and semiconductor leaders like Nvidia threaten to commoditize basic simulation workflows unless Applied Intuition maintains superior automotive safety compliance integrations."
    claimRefs:
      - "CE011"
      - "CE014"
      - "CE015"
