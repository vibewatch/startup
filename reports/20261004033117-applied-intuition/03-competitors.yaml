    title: "White-box delivery can align with OEM control priorities"
    body: "Applied Intuition says its automotive SDS provides architectural visibility, customization, and hardware or sensor choice. That is strategically distinct from a black-box offer, but the assigned evidence does not independently measure the resulting integration speed or safety performance."
    claimRefs:
      - "CP004"

  - calloutType: "risk"
    title: "Published rankings are not independent technical benchmarks"
    body: "RFP.wiki supplies a structured shortlist and numeric scores, but the assigned pool contains no common-workload safety, autonomy-performance, implementation-time, or total-cost benchmark. Competitive superiority therefore remains a diligence question rather than a demonstrated result."
    claimRefs:
