company:
  name: "Applied Intuition"
chapter:
  number: 6
  title: "Customers"
  summary: "Applied Intuition reports unusually broad automotive reach, while an independent analyst names several OEM and defense relationships and an AISIN case study supplies the clearest workflow-level adoption evidence. Public sources do not disclose retention, contract value, customer concentration, or a complete split between pilots, development programs, and production deployments."
sections:
  - id: "customer-base-and-buyers"
    title: "Customer base and buying centers"
    body: "Applied Intuition presents a customer base spanning automotive, defense, trucking, construction, mining, and agriculture, served through tools and infrastructure, operating systems, and autonomy software [CU001, CU002]. The strongest scale claim is company-issued: 18 of the top 20 global automakers, plus the United States military and allies, are said to use its solutions [CU003]. Manhattan Venture Partners separately names Volkswagen, Toyota, Porsche, Nissan, the U.S. Army, and the Defense Innovation Unit, but does not disclose contract values or deployment scope for those accounts [CU004]. Buyer evidence points to engineering and program leadership rather than end consumers: Applied is recruiting personnel to research commercial and defense workflows and to manage a flagship OEM program against a statement of work, milestones, risks, dependencies, and vehicle integration activities [CU008, CU009, CU010]. This supports a technically intensive enterprise sale, but not a quantified customer count beyond the automaker-penetration claim."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU008"
      - "CU009"
      - "CU010"
    tableRefs:
      - "TU001"
  - id: "adoption-and-reference-quality"
    title: "Adoption and reference quality"
    body: "AISIN is the best documented customer example in the assigned evidence. Its case study says the supplier integrated Applied Intuition's ADP solution for sensor simulation, object simulation, and cloud collaboration in automated-parking development [CU005]. The same source states that full-scale deployment remains ongoing, so the evidence should not be presented as a completed production rollout [CU006]. An AISIN engineer nevertheless attributes faster decisions, less misalignment, and greater transparency to shared standards and perspectives [CU007]. Broader adoption evidence is less auditable. Manhattan Venture Partners reports a 90% reduction in real-world testing and 10x faster ADAS/AD development, but the fetched report does not provide customer-level denominators for those aggregate benefit claims [CU013]. A newly formed Detroit-based team for a flagship global OEM program indicates active delivery investment, yet the customer is unnamed and the job posting does not establish revenue, production units, or renewal status [CU008, CU009]."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU013"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "durability-expansion-and-risk"
    title: "Durability, expansion, and concentration risk"
    body: "Applied Intuition's stated model is to let manufacturers own distribution while it supplies intelligence and integration, a structure that can place its software inside partner-branded products without requiring a consumer brand [CU011]. In the cofounder interview summarized by BigGo, Qasar Younis said automotive represented roughly 30% of revenue and that defense, mining, construction, and agriculture supplied the remainder; this is a management claim rather than audited segment reporting [CU012]. Verdict also reported partnerships with OpenAI, TRATON, Isuzu, Porsche, and Audi, evidence of ecosystem breadth but not proof that each relationship is a paying, durable customer contract [CU014]. Delivery capacity appears substantial from the company's claim of 1,000 engineers, 40 former CTOs, and 30 former founders [CU015]. However, the analyst report warns that investor interest, public trust, funding conditions, and evolving regulation can slow autonomous-mobility adoption [CU016]. No assigned source supplies NRR, GRR, churn, renewal terms, customer-level revenue, or top-customer concentration, leaving durability and bargaining-power conclusions open."
    claimRefs:
      - "CU011"
      - "CU012"
      - "CU014"
      - "CU015"
      - "CU016"
    figureRefs:
      - "FU001"
