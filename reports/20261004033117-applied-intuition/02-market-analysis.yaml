callouts:
  - calloutType: "insight"
    title: "Market Boundary Expansion from Simulation to Complete Vehicle Infrastructure"
    body: >
      Applied Intuition's primary market positioning has expanded from a specialized niche in autonomous vehicle simulation into a comprehensive software platform providing Vehicle OS, Cabin Intelligence, and complete autonomy stacks. This evolution enables the company to tap broader automotive production budgets beyond discretionary R&D engineering seats.
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM013"
  - calloutType: "risk"
    title: "AV Adoption Sluggishness Directly Threatens Multi-Billion Dollar Sizing Horizons"
    body: >
      The multi-hundred-billion dollar addressable market forecasts for autonomous vehicles assume a pace of Level 4/5 commercial deployment that has repeatedly missed industry timelines. If OEM programs slow down or shift back toward basic driver assistance, enterprise sales cycles elongate and platform spending faces budget compression.
    claimRefs:
      - "CM005"
      - "CM010"
      - "CM015"
