      - [Returns Insights / Instant Refunds, "Returns, CX, and abuse-operations teams", Current public surface, "Expands post-purchase abuse controls beyond checkout fraud", "Assigned pool does not show deployment prerequisites, pricing, or guarantee terms"]
      - ["APIs, plugins, and partner connectors", "Engineering and IT integration owners", Current public surface, "Direct API plus prebuilt platform integrations and partner channels", "Rate limits, SLA terms, and versioning commitments are not public in the assigned pool"]
    notes: "Combines official product pages, blog feed, partner listings, and public API/integration surfaces; gaps mark what the assigned public pool still cannot verify."
    claimRefs: [CE001, CE003, CE004, CE009, CE011, CE013]
