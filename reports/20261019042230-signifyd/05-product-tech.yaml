          items:
            - Direct API integration
            - Plugins for Shopify / Magento / Salesforce Commerce Cloud / BigCommerce
            - Signed webhook notifications
          outputs:
            - Automated capture, cancel, void, and fulfillment actions
        - label: Extended journey coverage
          detail: "Company messaging extends the platform before and after checkout."
          note: "Recent company messaging places products before and after checkout."
          items:
            - Account creation and login controls
            - Returns Insights
            - Instant Refunds
        - label: Merchant operations layer
          detail: "Operational teams act on decisions inside commerce and order-management systems."
          items:
            - Fraud and ecommerce operations teams
            - Payment configuration owners
            - ERP or middleware administrators
          outputs:
            - Support, onboarding, and exception handling with Signifyd and partners
    approximationNotes: null
    claimRefs: [CE001, CE002, CE003, CE004, CE008, CE009, CE011]
callouts:
  - calloutType: strength
    title: Guarantee-backed decisioning is the product's clearest differentiator
    body: >-
      The strongest repeated product theme is that Signifyd does not just score risk; it returns an
      approve/decline workflow outcome and assumes liability on covered orders, which is harder to
      commoditize than another rules engine or dashboard.
    claimRefs: [CE001, CE004, CE013]
  - calloutType: risk
    title: Integration breadth is real, but operating controls remain only partially disclosed
    body: >-
      Adobe and partner materials show mature deployment paths, yet the assigned pool still lacks
      direct public evidence on uptime commitments, API rate limits, release policy, and security
      attestations, so technical diligence should not stop at the marketing surface.
    claimRefs: [CE006, CE007, CE009, CE010, CE012]
