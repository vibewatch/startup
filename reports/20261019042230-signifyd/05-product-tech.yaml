        - label: Merchant touchpoints
          note: "Invocation surfaces visible in the assigned pool."
          items:
            - Storefront checkout
            - Adobe Commerce Payment Services
            - Magento order grid
          outputs:
            - Approve / decline / manual-review decision
        - label: Decision inputs
