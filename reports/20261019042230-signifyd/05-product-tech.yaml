    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Company solution
      - Measurable benefit
      - Limitation
    rows:
      - ["Approve legitimate orders without manual review", "Fraud team or rules engine reviews checkout traffic and may hold good orders", "Guaranteed Fraud Protection evaluates each order instantly and reimburses approved fraudulent chargebacks", "\"Up to 98%\" approval, \"Up to 93%\" chargeback reduction, and \"0%\" hours spent on manual review are claimed on the product page", "These performance figures are company-claimed and not segmented by merchant profile"]
      - ["Reduce false declines at checkout", "Merchants decline some edge-case orders to avoid fraud exposure", "Company positions guarantee-backed decisioning as a way to recover otherwise-declined demand", "\"Recover up to 5-9% more revenue\" / \"Approve 5-9% more good orders\" appears in official marketing", "No independent public benchmark in the assigned pool validates realized lift"]
      - ["Automate Magento order handling", "Ops users inspect orders and manually update downstream fulfillment actions", "Adobe Commerce app auto-sends orders to Signifyd, updates workflows, links cases, and cancels guarantees for canceled orders", "Marketplace page emphasizes order-flow automation and direct case access", "Evidence is strongest for Magento/Adobe surfaces, not every commerce stack"]
      - ["Run Signifyd with Adobe Payment Services", "Merchant configures payment actions and fraud controls across multiple payment methods", "Adobe supports pre-auth and post-auth Signifyd flows across cards, vaulted cards, Admin checkout, PayPal, and Apple Pay", "Breadth of supported payment methods is explicit in Adobe documentation", "Adobe also documents incompatible configuration combinations that can break expected order handling"]
    notes: "Benefits are literal public claims or support-scope statements from cited pages; realized merchant outcomes remain dependent on integration quality and underwriting rules."
    claimRefs: [CE001, CE004, CE005, CE006, CE007, CE008]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - ["Checkout/order ingestion", "Receives order, payment, shipping, and related transaction context", "Merchant storefront, payment flow, and order payload completeness", "Weak merchant-side data mapping can reduce decision quality or force more manual review"]
      - ["Model and network intelligence", "Scores orders using 25,000+ features, network intelligence, and adaptive vertical models", "Signifyd's proprietary models and feedback loop", "Customers cannot independently inspect model logic or underwriting thresholds from the assigned pool"]
      - ["Guarantee and decision layer", "Returns approve/decline/review decisions backed by financial liability on covered orders", "Policy configuration and guarantee eligibility criteria", "Public materials do not disclose reserve methodology, claims friction, or exception handling in detail"]
      - ["Integration fabric", "Supports direct APIs, signed webhooks, platform plugins, and ERP/middleware connections", "Merchant engineering resources or partner connectors", "Integration complexity varies materially by stack; Adobe docs and NetSuite guide show configuration burden"]
      - ["Operational orchestration", "Drives cancel, void, capture, fulfillment, and reimbursement workflows after the decision", "Order-management system behavior and payment-action settings", "Documented incompatible post-auth/payment-action combinations can create operational failure modes"]
    notes: "Architecture is reconstructed only from assigned public surfaces; absent trust-center, SLA, and rate-limit artifacts remain open diligence items rather than inferred controls."
    claimRefs: [CE002, CE006, CE007, CE008, CE009, CE010]
