  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: security-and-compliance-artifacts
      missingEvidence: Direct trust-center artifacts such as SOC 2, ISO 27001, PCI attestation scope, privacy architecture, and incident-handling documentation tied to the current product set.
      whyItMatters: Product buyers in payments and fraud operations need hard evidence that security and compliance claims extend beyond partner marketing and public feature pages.
      diligencePath: Request current trust-center documents, certification reports, data-flow diagrams, and security questionnaire responses from Signifyd during technical diligence.
      relatedQuestionRefs: [QE006]
    - type: missing-source
      severity: material
      topic: reliability-and-api-operations
      missingEvidence: Public rate limits, webhook retry semantics, uptime or SLA commitments, change-log discipline, and version-support policy for APIs and plugins.
      whyItMatters: These details determine whether the product can sit safely in the merchant checkout path without hidden operational fragility.
      diligencePath: Obtain developer docs for webhook retry behavior and API limits, the customer-facing status/SLA commitments, and release/versioning policy for each supported commerce platform.
      relatedQuestionRefs: [QE006]
    - type: missing-source
