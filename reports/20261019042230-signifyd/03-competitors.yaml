company:
  name: Signifyd
chapter:
  number: 3
  title: Competitors
  summary: Signifyd competes most directly with other liability-transfer vendors such as Riskified, while Forter, Sift, Kount, and SEON represent substitute decisioning models that trade guarantee breadth for merchant control or price transparency. Public evidence suggests Signifyd's sharpest published differentiation is broader approved-order chargeback coverage and channel-ready integrations, but switching decisions still require merchant-specific bake-offs because vendor claims are not independently comparable.
sections:
  - id: direct-peers-vs-substitutes
    title: Direct peers versus substitutes
    body: Public evidence places Signifyd inside a narrow liability-transfer shortlist rather than a generic fraud-tools bucket. WalletInvestor describes Riskified as the closest direct alternative for large global merchants, while PaymentBrief groups Signifyd, Riskified, and ClearSale in guarantee/liability-shift models, separates Forter as managed decisioning, and places Sift and Kount on the merchant-retained-liability side. That means the real buying decision starts with commercial model choice; outsource chargeback risk to a vendor, or keep approval logic and loss ownership in-house through score-led tools and merchant-run workflows. Substitute pressure therefore comes not just from named competitors, but from merchants deciding they want more control and less dependence on insurance-style guarantees.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP006
      - CP015
    tableRefs:
      - TP001
    figureRefs:
      - FP001
  - id: capability-and-pricing-comparisons
    title: Capability and pricing comparisons
    body: The public record gives a usable but incomplete comparison of capability and packaging. Signifyd's official surfaces emphasize checkout decisioning, approved-order guarantees, broader non-fraud chargeback coverage, and prebuilt ecommerce-platform integrations. Independent roundups show opaque pricing across the closest enterprise peers; Riskified, ClearSale, and Sift are still mostly contact-sales motions, while public entry prices are easier to find for substitute score-first tools such as SEON and Kount. That mix matters because a merchant choosing Signifyd is not only comparing feature lists; it is also deciding whether it wants guaranteed outcomes, broader dispute coverage, implementation speed through plugins, or lower-cost tools that leave more liability and tuning work with the internal fraud team.
    claimRefs:
      - CP001
      - CP002
      - CP007
      - CP008
      - CP009
      - CP010
      - CP011
    tableRefs:
      - TP002
      - TP003
  - id: switching-cost-and-moat-durability
    title: Switching cost and moat durability
    body: Public materials do not prove a durable winner, which is itself the most important adverse competitive signal. PaymentBrief explicitly says product pages cannot establish who will perform best on a merchant's traffic and recommends parallel bake-offs because vendor-published approval and fraud metrics are not comparable across different customer mixes. Signifyd still shows real distribution and scale advantages in the public record; plugins for major commerce stacks, a broader suite spanning recovery and abuse prevention, and measurable web footprint in WMTips' tracked dataset. Those strengths look more like workflow breadth, ecosystem access, and data-network scale than a unique feature monopoly. The moat is therefore plausible but execution-dependent, and merchants still need contract and traffic-level diligence before treating Signifyd as categorically superior to Riskified, Forter, or control-oriented substitutes.
    claimRefs:
      - CP010
      - CP011
      - CP012
      - CP013
      - CP014
tables:
  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor / class
      - Category
      - Scale or public footprint
      - Target segment
      - Differentiation
      - Limitation
    rows:
      - - Signifyd
        - Guarantee / liability shift
        - WMTips says rank #6 in fraud-prevention web usage; Signifyd official pages stress a large commerce network
        - Enterprise and scaled ecommerce merchants
        - Approved-order guarantee plus published fraud and non-fraud chargeback coverage; plugins plus API
        - List pricing is opaque and public materials do not prove outperformance on a given merchant file
      - - Riskified
        - Direct peer guarantee vendor
        - Large-enterprise positioning in WalletInvestor, with broader modules noted in 2026 comparison content
        - Large global ecommerce merchants
        - Closest direct replacement if buyer wants guaranteed fraud decisions
        - Public pricing remains contact-sales and equivalent non-fraud coverage is not verified in the assigned pool
      - - Forter
        - Managed decisioning substitute
        - PaymentBrief cites vendor-stated 2B+ identities and 250,000+ storefronts
        - Enterprise merchants optimizing approval and payment performance
        - Outcome commitments without full merchant-side manual review burden
        - Public materials frame it as performance commitments rather than insurance-style liability transfer
      - - Sift
        - Risk scoring / decisioning substitute
        - Ringly says ~1T annual events across 700+ global brands
        - Growing to large ecommerce teams wanting more analyst control
        - Broad customer-journey coverage with merchant-tuned decisioning
        - Merchant retains liability and public pricing is still contact-sales
      - - Kount / SEON
        - Price-transparent score-first substitutes
        - Ringly publishes Kount at $0.07/transaction and SEON at $699/month
        - All sizes to mid-market merchants
        - Lower public price visibility and more merchant control over tuning
        - No Signifyd-style guarantee in the assigned public sources
    notes: Snapshot synthesized from assigned 2026 public sources; scale fields mix vendor-stated network metrics and third-party web-usage data, so rows are directional rather than like-for-like audited benchmarks.
    claimRefs:
      - CP003
      - CP004
      - CP005
      - CP006
      - CP007
      - CP008
      - CP010
      - CP011
      - CP014
      - CP015
  - id: TP002
    title: Feature / capability matrix
    columns:
      - Buying criterion
      - Signifyd
      - Guarantee peers
      - Decisioning / scoring substitutes
      - Public implication
    rows:
      - - Liability transfer on approved orders
        - Yes; official guarantee on approved orders
        - Riskified and ClearSale are presented as liability-shift peers
        - Forter uses outcome commitments; Sift and Kount keep liability with merchant
        - Direct peer set narrows quickly once buyer requires vendor-funded loss assumption
      - - Coverage beyond fraud chargebacks
        - Official pages say approved-order fraud and non-fraud coverage including INR and SNAD
        - Equivalent non-fraud reason-code breadth is unknown from this pool
        - Score-first tools are not positioned as guarantee-led coverage products
        - Signifyd's clearest published differentiation is broader approved-order coverage, not basic fraud scoring
      - - Merchant control and tuning
        - Lower control; vendor makes the approve/decline call
        - Riskified similar; Forter still vendor-run even without pure insurance framing
        - Higher control because merchant teams act on scores and rules
        - Status quo and internal-build substitutes stay viable for operators that prefer control over liability transfer
      - - Integration and suite breadth
        - Official plugins for Shopify, Magento, Salesforce Commerce Cloud, BigCommerce, plus API
        - Public pool notes broader modules for some peers but does not show comparable integration depth
        - Score-first tools compete on workflow fit rather than identical bundle breadth
        - Public evidence supports distribution strength, but not exclusivity or lock-in
    notes: Unknown means the assigned pool did not verify the cell from primary or independent evidence; it should not be read as product absence.
    claimRefs:
      - CP001
      - CP002
      - CP004
      - CP005
      - CP006
      - CP010
      - CP011
      - CP015
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Vendor / class
      - Public entry pricing
      - Contract model
      - Included capabilities from pool
      - Implication
    rows:
      - - Signifyd
        - No universal public rate
        - WalletInvestor says pricing is usually a percentage of approved order value and varies by vertical, volume, AOV, risk, products, target approval rate, and guarantee scope
        - Guaranteed Fraud Protection; Complete Chargeback Protection; plugin or API integration
        - Compare against the same historical order file because nominal public price benchmarks are weak
      - - Riskified
        - Contact sales
        - Approved-order guarantee model in independent comparison content
        - Chargeback guarantee plus broader ecommerce-risk modules in 2026 roundups
        - Closest commercial peer, but realized rate and exclusions remain opaque
      - - Sift
        - Contact sales
        - Enterprise scoring / decisioning platform
        - Account defense, payment protection, content integrity, passwordless authentication per Ringly
        - Alternative if buyer wants coverage breadth with retained control rather than liability transfer
      - - Kount / SEON
        - Kount $0.07/transaction; SEON $699/month
        - Transaction-fee or subscription-style scoring tools, not guarantee-led contracts
        - Risk scoring, rules, and API-first fraud workflows
        - Transparent headline pricing is better, but merchants keep more tuning burden and chargeback exposure
    notes: Public pricing is heterogeneous and mostly non-comparable; rows reflect list or article-level disclosures, not merchant-specific realized spend.
    claimRefs:
      - CP007
      - CP008
      - CP009
      - CP012
      - CP013
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: Ordinal map of public positioning; higher X means more vendor-assumed liability, while higher Y means more merchant control over tuning and decisions.
    data:
      xAxis:
        label: Liability-transfer breadth
        min: 1
        max: 5
        low: Merchant retains losses
        high: Vendor assumes more approved-order loss risk
        description: Evidence-backed ordinal placement from public positioning pages and comparisons
        scale: ordinal
      yAxis:
        label: Merchant control / custom tuning
        min: 1
        max: 5
        low: Vendor-run automation
        high: Merchant-led rules or score actioning
        description: Evidence-backed ordinal placement from public operating-model descriptions
        scale: ordinal
      points:
        - label: Signifyd
          x: 4.6
          y: 2.0
          detail: Guarantee-led checkout decisioning with official plugin and API integrations
          note: Placed high on liability transfer because official pages center approved-order guarantees and broader chargeback coverage.
        - label: Riskified
          x: 4.3
          y: 2.1
          detail: Closest direct guarantee peer in independent roundups
          note: Placed near Signifyd because public sources frame it as the closest replacement for merchants wanting guaranteed fraud decisions.
        - label: Forter
          x: 3.0
          y: 2.2
          detail: Managed decisioning with contractual outcome commitments
          note: Placed below guarantee peers on liability transfer because PaymentBrief distinguishes it from insurance-style per-order guarantees.
        - label: Sift
          x: 1.4
          y: 4.3
          detail: Broad scoring and workflow tooling across the customer journey
          note: Placed high on control because merchants act on scores and rules, retaining liability.
        - label: Kount
          x: 1.2
          y: 4.0
          detail: Score-first identity and fraud tooling with public per-transaction pricing
          note: Placed as a substitute for merchants prioritizing transparency and control over outsourced guarantees.
        - label: SEON
          x: 1.1
          y: 4.5
          detail: API-first fraud scoring with published starting price
          note: Placed as a non-guarantee substitute because assigned public sources emphasize transparent scoring rather than liability transfer.
    approximationNotes: Coordinates are ordinal judgments derived from assigned public descriptions of guarantee scope, decision ownership, and pricing posture; they are not measured performance scores or market-share ranks.
