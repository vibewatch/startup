callouts:
  - calloutType: insight
    title: The competitive set is model-driven before it is feature-driven
    body: If a buyer insists on vendor-funded chargeback protection, the true shortlist is Signifyd, Riskified, and some ClearSale-style plans. If the buyer wants merchant control and lower headline pricing, Sift-, Kount-, or SEON-style substitutes become viable even without liability transfer.
    claimRefs:
      - CP003
      - CP004
      - CP005
      - CP006
      - CP007
      - CP015
  - calloutType: risk
    title: Public benchmarks are not enough to underwrite a winner
    body: Assigned independent sources repeatedly warn that product pages and vendor-published metrics do not prove who will perform best on a merchant's traffic, so realized approval lift, false-decline reduction, exclusions, and pricing still need a merchant-specific bake-off and contract review.
    claimRefs:
      - CP009
      - CP012
      - CP013
