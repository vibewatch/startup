callouts:
  - calloutType: "strength"
    title: "Customer pain point and product pitch line up cleanly"
    body: >-
      The assigned evidence consistently shows a merchant buyer that wants more
      approvals without taking fraud losses, which is a concrete and budgetable
      problem rather than a vague AI narrative.
    claimRefs: [CU001, CU010, CU014]
  - calloutType: "insight"
    title: "The best customer-quality argument is expansion, not raw customer-count disclosure"
    body: >-
      Signifyd's public materials make the upsell path unusually legible:
      checkout fraud protection can expand into chargebacks, returns abuse, and
      authorization workflows inside the same merchant account.
    claimRefs: [CU002, CU009, CU011]
  - calloutType: "risk"
    title: "Durability is still a gap"
    body: >-
      Public proof of adoption exists, but retention, churn, contract duration,
      concentration, and partner-channel dependency remain undisclosed, so the
      customer base is credible but not yet de-risked.
    claimRefs: [CU005, CU008, CU014]
