artifact: market-analysis
slug: signifyd
runDate: 2026-10-19
company:
  name: Signifyd
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Signifyd addresses the enterprise ecommerce fraud and commerce-protection
    market, where buyers trade off fraud losses, false declines, manual review
    cost, and chargeback liability. The available evidence shows rising fraud
    pressure and a measurable installed footprint, but it does not support a
    monetary TAM, SAM, or SOM; valuation work should therefore anchor on
    merchant transaction exposure and verified customer economics rather than
    a generic cybersecurity market estimate.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The investable boundary is narrower than cybersecurity and broader than
      checkout fraud scoring. Signifyd is positioned around card-not-present
      ecommerce order decisioning, false-decline reduction, and a financial
      guarantee on approved orders. Adjacent workflows include account
      protection, policy and return abuse, payment compliance, authorization
      optimization, chargeback recovery, and, in the UK and Europe, non-fraud
      chargeback coverage. The practical substitutes are merchant rules and
      manual review, risk-score-only software, payment-provider controls, and
      accepting more fraud or false declines. Generic identity security,
      broad payment processing, and ecommerce software without a transaction
      risk decision are outside the core boundary. Independent directory
      evidence also cautions that very small merchants, businesses with little
      chargeback exposure, and companies outside card-not-present commerce are
      weaker-fit segments.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM015
    tableRefs:
      - TM001
  - id: sizing-and-demand
    title: Evidence-constrained sizing and demand
    body: >-
      The allocated sources do not publish a defensible monetary category TAM,
      SAM, or SOM, so the chapter uses observable adoption and competitive
      lenses instead of converting a broad fraud or cybersecurity forecast
      into addressable revenue. WMTips reported 756 detected Signifyd websites,
      a 7.2% share within its fraud-prevention technology category, and
      detection on 0.04% of all websites as of March 16, 2025. Those figures
      describe that publisher's web-detection universe, not merchant spend,
      gross merchandise value, or revenue share. Tracxn's live company profile
      counted 2,157 active competitors, including 408 funded companies, but its
      taxonomy includes adjacencies and is not a clean direct-competitor
      denominator. Signifyd's 2026 company-issued network statistics show
      thousands of merchants and 950 million unique digital wallets, while
      fraud pressure rose 33% year over year in the first four months of 2026.
      These observations indicate demand and data scale, but not market value.
    claimRefs:
      - CM007
      - CM008
      - CM009
      - CM010
      - CM011
      - CM012
      - CM016
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: buyers-and-adoption
    title: Buyers, users, payers, and adoption path
    body: >-
      The clearest buyers are enterprise and mid-market digital merchants with
      material card-not-present volume, chargeback exposure, false-decline
      concerns, or costly manual review. Fraud and risk teams are direct users;
      ecommerce, payments, operations, finance, customer-service, and IT teams
      participate because the decision affects conversion, fulfillment,
      authorization, disputes, and integration. Signifyd offers prebuilt
      plugins for major commerce platforms and a direct API, reducing the
      integration barrier but not eliminating model calibration, data-sharing,
      policy, and procurement work. Trigger events include rising attacks,
      international expansion, omnichannel fulfillment, high false declines,
      and pressure to automate review. The evidence does not identify a
      universal budget owner or contract-price basis, so payer and budget
      ownership remain account-specific diligence items.
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM008
      - CM013
      - CM014
    tableRefs:
      - TM003
  - id: constraints-and-valuation
    title: Adoption constraints and valuation relevance
    body: >-
      Demand is supported by broader attack surfaces: Signifyd reported sharp
      2026 increases in account takeover, card testing, buy-online-pick-up-
      in-store fraud, and first-party abuse. Adoption nevertheless depends on
      whether avoided fraud, recovered approvals, and lower review cost exceed
      software fees and the operational cost of integration. Liability-shift
      products can make ROI legible, but company-issued claims of up to 98%
      approval, up to 93% chargeback reduction, and zero manual-review hours
      are not independent market benchmarks. Public pricing is unavailable,
      budget ownership is not established, and no source exposes loss-reserve
      economics or a monetary market denominator. These gaps matter for
      valuation: a credible revenue multiple requires verified transaction
      volume, take rate or pricing, retention, guarantee losses, and segment
      penetration rather than extrapolation from website counts or attack
      growth.
    claimRefs:
      - CM006
      - CM007
      - CM008
      - CM009
      - CM013
      - CM015
      - CM016
tables:
  - id: TM001
    title: Market definition and substitute boundary
    columns:
      - Segment or category
      - Included spend or workflow
      - Excluded spend or substitute
      - Buyer or payer
      - Relevance to Signifyd
    rows:
      - - Enterprise ecommerce fraud decisioning
        - Real-time order screening, approval optimization, and guaranteed fraud chargeback coverage
        - Generic cybersecurity and offline point-of-sale fraud
        - Merchant fraud, risk, ecommerce, and finance functions
        - Core market for high-volume card-not-present merchants
      - - Chargeback and abuse management
        - Fraud and non-fraud chargeback protection, dispute automation, return and policy abuse prevention
        - Payment processing without a risk or liability-transfer service
        - Risk, payments, operations, and finance teams
        - Adjacent expansion across the customer journey
      - - Account and identity protection
        - Account-takeover detection and identity or intent signals around transactions
        - Standalone workforce identity and endpoint security
        - Fraud, security, customer experience, and IT teams
        - Relevant because attacks increasingly precede checkout
      - - Status quo and internal controls
        - Merchant rules, manual review, payment-provider controls, and risk-score-only tools
        - None; these are substitutes rather than category revenue
        - Merchant risk and operations teams
        - Sets the ROI hurdle for automation and liability shift
      - - Low-exposure or non-CNP merchants
        - Limited use where chargebacks, false declines, and review costs are immaterial
        - Very small businesses and businesses outside card-not-present commerce
        - Owner-operated or small merchant teams
        - Lower-fit segment according to an independent tool directory
    notes: >-
      Boundary is synthesized from reviewed product and directory evidence;
      no source provides a standardized category-spend taxonomy or public
      contract pricing.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM015
