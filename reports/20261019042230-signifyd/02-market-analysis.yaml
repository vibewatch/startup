callouts:
  - calloutType: risk
    title: Monetary market size remains unverified
    body: >-
      Do not convert web detections, a vendor network, attack growth, or a broad
      cybersecurity forecast into TAM. Request merchant transaction volume,
      pricing, eligible order mix, guarantee-loss economics, and segment
      penetration before underwriting category share or revenue capacity.
    claimRefs:
      - CM006
      - CM009
      - CM016
