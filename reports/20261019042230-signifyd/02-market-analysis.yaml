  evidenceGaps:
    - type: missing-source
      severity: material
      topic: monetary-market-size
      missingEvidence: >-
        A current category-spend estimate with explicit geography, merchant
        eligibility, transaction denominator, period, and methodology.
      whyItMatters: >-
        Without a defined monetary denominator, TAM, SAM, and SOM cannot support
        revenue-capacity or valuation conclusions.
      diligencePath: >-
        Obtain a reputable analyst methodology or build a bottom-up model from
        eligible ecommerce GMV, fraud-protection pricing, and merchant segment
        penetration.
      relatedQuestionRefs: [QM002, QM009]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: pricing-and-budget
      missingEvidence: >-
        Current contract pricing, fee basis, average contract value, sales
        cycle, procurement owner, and budget allocation by merchant segment.
      whyItMatters: >-
        Adoption economics and addressable revenue cannot be inferred from
        product claims or website detections.
      diligencePath: >-
        Review anonymized contracts and pipeline data, then interview risk,
        ecommerce, finance, and procurement owners across representative
        customers.
      relatedQuestionRefs: [QM005, QM007, QM009]
      relatedTableRefs: [TM003]
    - type: private-evidence-only
      severity: material
      topic: guarantee-economics
      missingEvidence: >-
        Eligible order volume, approval uplift, guarantee-loss rate, reserves,
        dispute recovery, gross margin, and cohort retention by segment.
      whyItMatters: >-
        Vendor-reported approval and chargeback outcomes do not establish
        durable unit economics or profitable market capture.
      diligencePath: >-
        Reconcile customer-level order data, guarantee payouts, pricing, and
        gross profit for representative merchant cohorts.
      relatedQuestionRefs: [QM002, QM007, QM009]
