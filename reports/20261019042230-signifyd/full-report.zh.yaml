            body: >-
              现有证据支持继续跟踪，而不是买入。Signifyd 确有企业级产品、历史融资能力，以及可能支撑有价值商业保护特许经营的客户成果主张。但当前公开材料仍不足以进行价格判断：最近保留的估值记录仍是 2021 年 4 月
              E 轮，来源没有披露当前
              ARR、毛利率、准备金表现或新的一级、二级估值。这使估值决策更多取决于入场纪律，而不是对产品的欣赏。如果新一轮融资或老股交易的营销价格接近上一轮公开的独角兽估值，仅凭公开证据不足以在没有最新管理层数据和条款细节的情况下入场。
