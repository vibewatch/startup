      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              乐观情景要求证明，Signifyd
              的担保模式不仅商业上有吸引力，经济上也有韧性：留存强劲、扣除损失覆盖后的毛利率健康，准备金或拒付损失行为足以支持持久现金生成。基准情景更简单：公司仍具战略相关性且能够融资，但投资人等待更清晰的披露或更好的价格，因为今天的公开档案只证明了历史融资和产品相关性。悲观情景是，2021
              年独角兽基准变成需要下调的锚点，因为当前增长、利润率或责任经济无法支撑它，而商户仍把多个担保或决策替代方案摆在桌面上。因此，下行情景触发因素和上行叙事同样重要。
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV006
              - CV008
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.4'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              从继续跟踪转向买入前，尽调应强制取得三类披露。第一，管理层应按产品提供当前 ARR 或年化收入、毛利率、净留存以及担保损失或准备金指标。第二，投资人需要当前资本结构故事：自 2021 年 E
              轮以来的任何新轮次、二级交易估值、清算优先权和稀释悬垂。第三，买方应在真实商户群组中检验，相比替代方案，定价权、续约质量和争议结果是否仍然强劲。若无法提供这些信息，本身就是论点破坏触发因素，因为当前公开证据已经说明，仅凭营销页面和目录无法完成可靠投资判断。
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV008
              - CV011
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 建议
            body: 继续跟踪 Signifyd，不要买入：公开证据验证了产品相关性和历史融资，但没有验证当前入场价格。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV010
              - CV011
          - type: callout
            title: 首要估值风险
            body: 最大风险是依据过时的 2021 年独角兽基准付出价格，却没有关于增长、利润率、准备金或优先权悬垂的当前披露。
            calloutType: risk
            claimRefs:
              - CV002
              - CV011
