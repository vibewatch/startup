  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 当前 ARR 增长、毛利率和保障损失率证明模型可以高效扩张；新的融资显示条款审慎。
        - 如果新鲜经济性数据确认持久性，可支持不低于最后披露的 $1.3B 基准估值，或支持战略溢价。
        - 保障损失、准备金拖累，或续约质量低于营销主张所暗示的水平。
        - 新融资或尽调材料显示经济性和续约质量强劲。
      - - 基准
        - 产品仍具战略相关性，但公开披露有限，定价仍为定制化。
        - 支持等待更好的入场点或结构化条款，而不是依据公开数据评估一笔即时的风险投资回报。
        - 单位经济性不透明、合同排除项，以及新估值标记出现时点不确定。
        - 当前公开证据集：有真实产品证明，但没有当前估值支持。
      - - 悲观
        - 当前表现落后于 2021 年基准，或买方相较替代方案不接受现有条款。
        - 由此可见，估值可能低于最近一次披露的基准，新资金的回报前景也会走弱。
        - 倍数压缩、拒付经济性转差、部署放缓，或竞争失利。
        - 没有新的估值标记，也没有经济数据披露；买方越来越关注透明定价或替代运营模式。
    notes: 这些区间只是相对于最近一次公开披露基准的方向性判断，因为留存证据不足以支持新的数值估值模型。
    claimRefs:
      - CV002
      - CV006
      - CV008
      - CV011
      - CV012
      - CV013
      - CV015
