      - number: '2.4'
        title: 采用约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              更广的攻击面支撑需求：Signifyd 报告称，2026
              年账户接管、卡测试、线上购买线下取货欺诈和第一方滥用都大幅上升。但是否采用，仍取决于避免的欺诈损失、挽回的获批订单和降低的审核成本，能否超过软件费用及集成的运营成本。责任转移产品可以让 ROI
              更容易量化，但公司宣称最高 98% 的批准率、最高 93%
              的拒付下降和零人工审核小时数，并不是独立的市场基准。公开定价不可得，预算负责人尚未明确，也没有来源披露损失准备金经济或货币化市场分母。这些缺口直接影响估值：可靠的收入倍数需要经过验证的交易量、费率或定价、留存、担保损失和细分市场渗透率，而不是从网站数量或攻击增长外推。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM013
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 货币化市场规模仍未得到验证
            body: 不要把网站检测、供应商网络、攻击增长或宽泛的网络安全预测换算成 TAM。在判断品类份额或收入容量前，应索取商户交易量、定价、符合条件的订单结构、担保损失经济和细分市场渗透率。
            calloutType: risk
            claimRefs:
