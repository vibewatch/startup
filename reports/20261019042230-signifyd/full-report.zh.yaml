  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资边界比网络安全更窄，又比结账欺诈评分更宽。Signifyd
              围绕无卡交易电商订单决策、误拒率降低以及获批订单的财务担保展开。相邻流程包括账户保护、政策和退货滥用、支付合规、授权优化、拒付追回，以及英国和欧洲的非欺诈拒付保障。现实替代方案包括商户规则和人工审核、仅提供风险评分的软件、支付服务商控制，以及接受更多欺诈或误拒。通用身份安全、广义支付处理和不含交易风险决策的电商软件不属于核心边界。独立目录还提醒，规模很小的商户、拒付暴露有限的企业，以及不做无卡交易电商的公司，匹配度较低。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM015
      - number: '2.2'
        title: 受证据约束的市场规模与需求
        blocks:
          - type: paragraph
            body: >-
              分配到的来源没有发布可据以建立可靠判断的货币口径 TAM、SAM 或 SOM，因此本章改用可观察的采用情况和竞争视角，而不是把宽泛的欺诈或网络安全预测换算成可触达收入。WMTips 报告，截至 2025 年 3
              月 16 日，识别到 756 个使用 Signifyd 的网站，占其欺诈防护技术类别的 7.2%，占全部网站的
              0.04%。这些数字描述的是该出版方的网站检测范围，不是商户支出、商品交易总额或收入份额。Tracxn 的实时公司档案统计了 2,157 家活跃竞争者，其中 408
              家获得融资，但其分类包含相邻领域，不能作为干净的直接竞争者分母。Signifyd 2026 年发布的网络统计显示，平台覆盖数千家商户和 950m 个独立数字钱包；2026 年前四个月，欺诈压力同比上升
              33%。这些观察说明需求和数据规模存在，但不能说明市场价值。
