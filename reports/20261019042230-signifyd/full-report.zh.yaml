    rows:
      - - 已批准订单的责任转移
        - 是；官方为已批准订单提供担保
        - Riskified 和 ClearSale 被列为责任转移同行
        - Forter 采用结果承诺；Sift 和 Kount 将责任留在商户
        - 一旦买方要求供应商承担损失，直接同行范围会迅速收窄
      - - 超出欺诈拒付的覆盖范围
        - 官方页面称已批准订单覆盖欺诈及非欺诈情形，包括 INR 和 SNAD
        - 指定来源池无法确认等效的非欺诈原因代码覆盖广度
        - 评分优先工具并未定位为以担保为核心的覆盖产品
        - Signifyd 最明确的公开差异化是更广的已批准订单覆盖，而非基础欺诈评分
      - - 商户控制权与调优
        - 控制权较低；由供应商决定批准或拒绝
        - Riskified 类似；即便不采用纯保险表述，Forter 仍由供应商运行
        - 控制权更高，因为商户团队依据评分和规则行动
        - 对于更看重控制权而非责任转移的运营方，维持现状和内部构建仍然可行
      - - 集成与套件广度
        - 官方提供 Shopify、Magento、Salesforce Commerce Cloud、BigCommerce 插件及 API
        - 公开来源池提到部分同行拥有更广泛的模块，但未显示可比的集成深度
