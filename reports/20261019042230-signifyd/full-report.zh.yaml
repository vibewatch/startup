      xAxis:
        label: 责任转移范围
        min: 1
        max: 5
        low: 商户承担损失
        high: 厂商承担更多已批准订单的损失风险
        description: Evidence-backed ordinal placement from public positioning pages and comparisons
        scale: ordinal
      yAxis:
        label: 商户控制 / 定制调优
        min: 1
        max: 5
        low: 厂商驱动的自动化
        high: 商户主导规则或评分处置
        description: Evidence-backed ordinal placement from public operating-model descriptions
        scale: ordinal
      points:
        - label: Signifyd
          x: 4.6
          'y': 2
          detail: 以担保为核心的结账决策，配有官方插件和 API 集成
          note: 之所以置于责任转移较高的位置，是因为官方页面强调已批准订单担保和更广泛的拒付保障。
        - label: Riskified
          x: 4.3
          'y': 2.1
          detail: 独立汇总中最接近的直接担保型同行
          note: 位置靠近 Signifyd，因为公开来源将其描述为希望获得有担保欺诈决策的商户最接近的替代方案。
        - label: Forter
