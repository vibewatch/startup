      - number: '6.4'
        title: 客户匹配度与集中度风险仍是投资判断问题
        blocks:
          - type: paragraph
            body: >-
              资料池中的反向证据不是丑闻或流失事件，而是一种匹配度质疑。SEON 的对比页面把 Signifyd
              定位为聚焦零售商、欺诈和消费者滥用的平台，同时把更广的用户旅程覆盖和更透明的决策控制作为考虑替代方案的理由。即使这种说法带有自利性，它仍点出了现实采购风险：Signifyd
              最容易赢得结账欺诈和责任转移痛点最尖锐的账户；但对于一开始就想要更广泛滥用、身份或工作流编排能力的客户，信息传达可能更窄。


              集中度风险也仍未解决。资料中没有确切商户数、头部客户占比、合作伙伴来源收入占比、续约率或合同期限。对于有担保的欺诈供应商，缺失这些信息很重要，因为客户质量不只取决于知名 logo
              或网站检测，还取决于损失、准备金和留存是否在整个客户基础上保持健康。因此，本章支持的是“真实采用但持久性未解决”，而不是“广泛且已去风险的客户基础”。
