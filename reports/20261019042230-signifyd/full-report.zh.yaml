  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 核心买方是电商风险与运营团队，零售仍是最清晰的切入口
        blocks:
          - type: paragraph
            body: >-
              最强证据仍指向 Signifyd 历史上的核心领域：电商商户，尤其是希望提高批准率又不承担欺诈损失的零售商。公司和第三方页面持续描述与结账相连的商业保护流程，并提供
              Shopify、Magento、BigCommerce 和 Salesforce Commerce Cloud 的预置集成，还通过 Celerant
              等供应商的合作伙伴渠道分销。因此，买方覆盖欺诈或风险、支付、电商运营和平台团队，而不是某个狭窄的安全预算负责人。


              客户范围比零售更广，但各细分领域的证据强度不一。ExploreTech 2026 年 7 月的档案称，Signifyd 还服务旅游、酒店、市场平台和其他数字商户，并列出财务、客服和 IT
              等职能用户。这一信息具有方向性价值，说明大客户内部可能存在跨职能采用，但同一页面把该条目标记为“未验证”，因此弱于以零售为中心的官方产品页面。最终形成的客户画像是：零售企业核心清晰，相邻 TAM
              合理但仍需按细分市场取得更硬的证据。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU011
              - CU012
