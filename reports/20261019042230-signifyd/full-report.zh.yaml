      - number: '3.3'
        title: 切换成本与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              公开材料无法证明谁是持久赢家，这本身就是最重要的不利竞争信号。PaymentBrief
              明确表示，产品页面无法证明谁在某个商户的流量上表现最好，并建议平行测试，因为不同客户结构下，供应商发布的批准率和欺诈指标不可直接比较。公开记录仍显示 Signifyd
              具备真实的分销和规模优势：覆盖主流电商技术栈的插件、横跨追回和滥用防护的更广产品套件，以及 WMTips
              跟踪数据中可量化的网站覆盖。这些优势更像流程广度、生态接入和数据网络规模，而不是独占某项功能。护城河因此有其合理性，但依赖执行；在把 Signifyd 视为明显优于 Riskified、Forter
              或偏控制型替代方案之前，商户仍需完成合同和流量层面的尽调。
            claimRefs:
              - CP010
