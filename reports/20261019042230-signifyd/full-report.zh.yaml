    rows:
      - - 有保障支持的工作流可以创造经济价值
        - 官方页面声称收入恢复 5-9%、欺诈拒付可获报销，并提供完整拒付覆盖。
        - 提供经审计的客户队列经济性，证明批准提升超过保障损失和服务成本。
      - - 产品广度支撑企业相关性
        - 官方材料将 Signifyd 定位于欺诈保护、完整拒付保护和工作流集成。
