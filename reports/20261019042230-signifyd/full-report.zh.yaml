  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价
        blocks:
          - type: paragraph
            body: >-
              留存证据显示，这是一种以实时订单决策加责任转移为核心的商业模式，而非纯软件订阅。BigCommerce 列出的标准套餐为每月 $1,500，另加获批订单金额的 0.8%；Signifyd 和
              UsagePricing
              都描述了这样的流程：公司在结账时为订单评分，为获批的欺诈决策承担责任，并提供付款后的争议服务。这种组合关系到收入质量：定价可以随商户交易流量增长，但实际经济结果取决于批准结构、拒付发生率和合同条款，而这些都未公开。
