  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 责任转移暴露是核心投资判断风险
        blocks:
          - type: paragraph
            body: >-
              留存的公开证据始终把 Signifyd 描述为担保或责任转移供应商，而不是纯评分厂商。这种定位对商户有吸引力，因为它把欺诈和部分拒付结果从商户账面上移开；但也意味着 Signifyd
              自身承担承保和合同范围风险。已披露的最强缓释因素是基于网络数据的决策和商户反馈闭环，但同一批公开材料让担保的经济侧大多保持不透明。尽调的结论是：产品证据不等于风险证据。投资人仍需取得合同附表、赔付机制、排除清单和损失表现数据，才能把担保视为持久的单位经济，而不是有说服力的营销。
            claimRefs:
