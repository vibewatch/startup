      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              最清晰的买方是数字交易量可观、面临拒付风险、担心误拒或人工审核成本高昂的企业和中端市场电商商户。欺诈与风险团队是直接用户；电商、支付、运营、财务、客服和 IT
              团队也会参与，因为该决策会影响转化、履约、授权、争议和集成。Signifyd 为主要电商平台提供预置插件，并提供直连
              API，降低了集成门槛，但没有消除模型校准、数据共享、政策制定和采购工作。触发事件包括攻击上升、国际扩张、全渠道履约、误拒率高以及自动化审核压力。现有证据没有确认统一的预算负责人或合同定价基础，因此付费方和预算归属仍需按客户逐一尽调。
            claimRefs:
