      - number: '6.2'
        title: 公开使用已有证据，但不少只是 logo 展示或客户评价
        blocks:
          - type: paragraph
            body: >-
              Signifyd 并不是没有证据的故事。资料池包括其官网上 Lenovo 和 Ferguson Home 的具名评价，二手资料还提到 Samsung、Walmart、eBay 和 Wish
              等知名品牌。WMTips 还在 2026 年识别到 756 个使用 Signifyd 的网站，其中包括 lowes.com、elfcosmetics.com 和 booksamillion.com
              等大型电商站点。综合来看，这说明公司确有市场存在，不是只有一面尚未产生收入的 logo 墙。


              局限在于证据质量。Lenovo 和 Ferguson Home 的评价由公司运营，没有合同起始日期、支出、续约历史或部署范围。Samsung、Walmart、eBay 和 Wish 出现在二手资料中，但仍只是
              logo 引用，不是有日期的案例研究，也没有独立描述经营结果。因此，采用记录足以回答“确有真实客户”，却不足以在没有更深尽调的情况下判断留存或集中度。
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU003
            claimRefs:
              - CU007
              - CU008
      - number: '6.3'
        title: 公开的钱包扩张故事清楚，但持久性指标缺失
        blocks:
          - type: paragraph
            body: >-
              Signifyd 最有说服力的商业叙事是在同一商户内先落地、再扩张。Guaranteed Fraud Protection
              是显而易见的入口，之后公司再营销完整拒付保护、退货滥用防护、拒付追回、授权率优化和账户保护等相邻产品。这一进展很重要：如果供应商能在同一账户内说服多个买方中心，或拿到更大的钱包份额，客户章节就更有说服力；Signifyd
              的产品组合在纸面上确实支持这条路径。


              但资料池没有提供群组层面的持久性证据。官方页面宣传批准率提升、拒付下降和取消人工审核等结果上限，Merchant Fraud Journal 也引用平均订单批准率改善。这些主张方向上是积极的，却没有披露
              NRR、GRR、流失、续约率、合同期限，或按商户和合作伙伴渠道拆分的集中度。即使加售路径容易理解，存量客户的经济质量仍未解决。
            claimRefs:
              - CU002
              - CU006
              - CU009
              - CU010
              - CU011
