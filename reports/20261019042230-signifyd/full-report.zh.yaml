      - - 定价不透明削弱估值信心
        - 定价页面提供定制化、按使用量计费的报价，而一篇独立替代方案文章指出缺乏透明定价。
        - 披露价格区间、合同条款和各客户队列的实际 ROI。
      - - 2021 年独角兽估值已不适合作为估值锚
        - 第三方来源仍指向 2021 年 E 轮和 $1.3B 投后估值，此后没有新的公开估值标记。
        - 披露新的融资、二级市场估值，或当前 ARR - 增长 - 利润率画像，以重置估值锚。
    notes: 证据仅总结保留的公开来源；“哪些信息会改变判断”列出的是会改变建议的尽调事项，而不是已经确立的推断事实。
