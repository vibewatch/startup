  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 直接同业与替代方案
        blocks:
          - type: paragraph
            body: >-
              公开证据把 Signifyd 放在一个狭窄的责任转移候选名单中，而不是泛化的欺诈工具类别。WalletInvestor 将 Riskified 描述为大型全球商户最接近的直接替代者；PaymentBrief 则把
              Signifyd、Riskified 和 ClearSale 归入担保或责任转移模式，将 Forter 单列为托管式决策，并把 Sift 和 Kount
              放在商户自行承担责任的一侧。也就是说，真正的采购决策首先是商业模式选择：是把拒付风险外包给供应商，还是通过以评分为核心的工具和商户自营流程，把审批逻辑和损失责任留在内部。替代压力不只来自知名竞争者，也来自那些希望拥有更多控制权、减少对保险式担保依赖的商户。
