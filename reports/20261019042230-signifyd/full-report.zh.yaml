          'y': 4.5
          detail: API 优先的欺诈评分，公布起始价格
          note: 置于非担保型替代方案位置，因为指定公开来源强调透明评分，而非责任转移。
    approximationNotes: 坐标是根据指定公开来源对担保范围、决策归属和定价取向的描述做出的序数判断，不是实测表现分数或市场份额排名。
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP006
      - CP007
      - CP015
  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: Signifyd 将有担保的欺诈决策嵌入结账流程实现变现，再把价值延伸到赔付和争议处理工作流。
    data:
      nodes:
        - id: integrate
          label: 商户集成插件或 API
          description: 通过电商插件或直接 API 连接完成集成。
          claimRefs:
            - CI001
            - CI002
        - id: score
          label: 实时评估订单和身份
          description: 商户发货前，平台会评估交易。
          claimRefs:
            - CI001
            - CI003
        - id: decide
          label: Signifyd 批准或拒绝订单，并承担已批准订单的欺诈责任
          description: 有担保的批准决策是产品的核心差异化所在。
          claimRefs:
            - CI001
            - CI006
        - id: monetize
          label: 商户支付平台费和使用相关费用
          description: 公开价目经济性显示，费用由月费加已批准订单金额的一定比例构成。
          claimRefs:
            - CI002
            - CI012
        - id: recover
          label: 拒付赔付和争议服务延伸价值
          description: 付款后的服务把变现范围从初始决策延伸出去。
          claimRefs:
            - CI003
            - CI005
        - id: underwrite
          label: 利润率持久性取决于损失率、准备金政策和实际定价
          description: 这些输入并未公开，因此仅凭公开信息无法评估资本充足性。
          claimRefs:
            - CI011
            - CI012
      edges:
        - from: integrate
          to: score
          label: 商户交易数据进入决策工作流
        - from: score
          to: decide
          label: 风险模型输出决定批准路径
        - from: decide
          to: monetize
          label: 已批准订单量带来收费机会
        - from: monetize
          to: recover
          label: 拒付和争议工作流增加服务深度
        - from: recover
          to: underwrite
          label: 损失控制和合同条款决定盈利能力
    claimRefs:
      - CI001
      - CI003
      - CI011
      - CI012
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据显示，Signifyd 是一个分层的决策与担保平台，外层由插件、API 和购买后产品组成。
    data:
      layers:
        - label: 商户触点
          note: Invocation surfaces visible in the assigned pool.
          items:
            - 门店结账
            - Adobe Commerce Payment Services
            - Magento 订单网格
          outputs:
            - 批准 / 拒绝 / 人工审核决策
        - label: 决策输入
          detail: 模型输入来自结账、身份和商户反馈数据。
          note: Official product pages describe large-scale signal collection.
          items:
            - 订单、支付和履约数据
            - 身份与意图网络
            - 商户反馈和拒付结果
        - label: 决策与担保
          note: Core commercial differentiation.
          modules:
            - Guaranteed Fraud Protection
            - Complete Chargeback Protection
            - 自适应垂直模型
          outputs:
            - 欺诈拒付赔付
            - 已批准订单的非欺诈拒付保障
        - label: 集成层
          note: Public deployment options span both no-code and engineering-heavy paths.
          items:
            - 直接 API 集成
            - Shopify / Magento / Salesforce Commerce Cloud / BigCommerce 插件
            - 签名 Webhook 通知
          outputs:
            - 自动执行扣款、取消、作废和履约操作
        - label: 延伸旅程覆盖
          detail: 公司宣传显示，该平台的覆盖范围延伸到结账前后。
          note: Recent company messaging places products before and after checkout.
          items:
            - 账户创建和登录控制
            - Returns Insights
            - Instant Refunds
        - label: 商户运营层
          detail: 运营团队在商业和订单管理系统内根据决策采取行动。
          items:
            - 欺诈与电商运营团队
            - 支付配置负责人
            - ERP 或中间件管理员
          outputs:
            - 与 Signifyd 及合作伙伴协同完成支持、上线和异常处理
    approximationNotes: null
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE008
      - CE009
      - CE011
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据支持以结账场景切入、再扩展到相邻商户工作流的路径，但续约质量仍缺乏披露。
    data:
      nodes:
        - label: 欺诈压力带来需求
          detail: 面临欺诈和盗刷测试压力上升的大型电商商户，自然会成为首批目标。
          touchpoints:
            - Fraud pressure rose 33% year over year in the first four months of 2026.
            - Card-testing attacks jumped 175% over the same period.
        - label: 以担保为支撑的初始切入
          detail: Guaranteed Fraud Protection 被定位为首个部署产品，面向希望获得即时决策和责任转移的商户。
          touchpoints:
            - Approve more orders, eliminate manual review, and protect revenue with Guaranteed Fraud Protection.
            - Any fraudulent chargeback from an approved order is reimbursed.
        - label: 跨团队运营采用
          detail: 购买方从欺诈负责人扩展到支付、电商运营、财务和支持团队，这些团队都关注批准率和拒付。
          touchpoints:
            - Up to 98% approval, more revenue.
            - 0% hours spent on manual review.
        - label: 向相邻模块交叉销售
          detail: 集成完成后，Signifyd 可以追加拒付追回、非欺诈争议保障、退货滥用工具和授权优化。
          touchpoints:
            - Complete Chargeback Protection.
            - Authorization Rate Optimization.
        - label: 渠道与生态杠杆
          detail: 预置电商集成和合作伙伴渠道能降低已采用某套商业技术栈商户的切换摩擦。
          touchpoints:
            - Plugin integration.
            - Celerant markets Signifyd as a partner solution for ecommerce retailers.
        - label: 续约与集中度检验
          detail: 公开材料解释了销售主张，但没有公布留存、集中度或合作伙伴构成数据，因此续约质量仍需靠尽调验证。
          touchpoints:
            - Thousands of merchants or brands are cited, but exact current count is absent.
            - NRR, GRR, churn, contract length, and top-customer concentration are not public.
    claimRefs:
      - CU004
      - CU005
      - CU009
      - CU010
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最大的剩余风险，一是担保背后的风险评估经济性不透明，二是结账流程对模型质量和集成的关键依赖。
    data:
      columns:
        - label: 可能性
          note: 作者仅依据留存的公开证据做出的判断。
        - label: 影响
          note: 对风险评估经济性、批准结果和尽调信心的影响。
        - label: 缓解措施成熟度
          note: 公开证据是否显示实际缓解措施，而不只是宣传主张。
        - label: 剩余严重性
          note: 考虑公开缓解措施后的剩余敞口。
      rows:
        - label: 担保经济性不透明
          note: 公开证据确认了该模式，但没有说明其背后的准备金或除外责任。
          values:
            - label: 高
              tone: high
              note: 责任转移是产品核心，除外责任仍需通过合同尽调核实。
            - label: 高
              tone: critical
              note: 损失率或准备金薄弱会同时打击利润率和风险评估可信度。
            - label: 中
              tone: medium
              note: 有证据显示决策会参考网络数据，但没有公开准备金政策。
            - label: 高
              tone: high
              note: 公开来源没有披露准备金方法、损失率或担保业务盈利能力。
        - label: 模型漂移 / 误拒
          note: 批准量增长依赖可信的自动化决策。
          values:
            - label: 中
              tone: medium
              note: 产品明确以批准更多订单、减少人工审核为优化目标。
            - label: 高
              tone: high
              note: 错误决策会同时伤害批准率、拒付表现和商户信任。
            - label: 中
              tone: medium
              note: 公开描述了反馈闭环，但没有披露 QA 和人工覆盖遥测数据。
            - label: 高
              tone: high
              note: Shopify 评价构成和 Lenovo 客户证言都表明，误拒敏感度很重要。
        - label: 集成 / 结账依赖
          note: 平台嵌在商户结账流程中。
          values:
            - label: 中
              tone: medium
              note: 有证据显示集成范围广，但没有公开可用性和回滚设计。
            - label: 高
              tone: high
              note: 嵌入式流程一旦故障，可能立即中断批准或造成收入损失。
            - label: 中
              tone: medium
              note: 多条插件和 API 路径提供了缓冲，但事故处理仍未披露。
            - label: 中高
              tone: high
              note: 在完成直接运营尽调前，剩余风险仍处于较高水平。
        - label: 融资透明度滞后
          note: 留存证据池中最新的公开估值数据点来自 2021 年。
          values:
            - label: 中
              tone: medium
              note: 历史融资记录存在，但这里没有最新的当前融资弹性公开信息。
            - label: 高
              tone: high
              note: 担保模式对资本的敏感度可能高于纯软件工作流。
            - label: 低
              tone: low
              note: 除历史规模和融资外，该证据池未见公开的其他缓解措施。
            - label: 高
              tone: high
              note: 投资者仍需要最新的准备金、现金和估值证据。
        - label: 商户满意度拖累
          note: 市场反馈总体积极，但并非一边倒。
          values:
            - label: 中
              tone: medium
              note: 尽管总体评分不错，Shopify 列表中一星评价占比仍然不低。
            - label: 中
              tone: medium
              note: 持续不满会削弱扩张和续约的可信度。
            - label: 中
              tone: medium
              note: 公开证据显示有采用，但没有详细的支持或流失遥测数据。
            - label: 中
              tone: medium
              note: 在审阅投诉主题和流失数据前，剩余敞口仍不可忽视。
        - label: 独立披露的新鲜度
          note: 外部运营证据少于营销证据。
          values:
            - label: 中
              tone: medium
              note: ExploreTech 的最新资料较新，但仍未经核实，运营细节也很少。
            - label: 中
              tone: medium
              note: 独立遥测薄弱，限制了对执行质量和当前状态的信心。
            - label: 低
              tone: low
              note: 除广泛目录和对比内容外，没有留存更有力的公开缓解措施。
            - label: 中高
              tone: high
              note: 在管理层提供更新的第三方佐证前，剩余严重性仍然偏高。
    approximationNotes: 热力图数值是对留存来源的定性综合，概括的是与投资者相关的剩余严重性，而非来源公布的风险分数。
    claimRefs:
      - CR003
      - CR006
      - CR008
      - CR009
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 推荐一方面基于真实的产品证据和历史规模，另一方面受到当前风险评估数据缺失及定价不透明的抵消。
    data:
      nodes:
        - id: proof
          label: 历史验证点
          detail: 累计融资 $390M；2021 年 E 轮投后估值 $1.3B 仍是最近一次公开估值。
          claimRefs:
            - CV001
            - CV002
        - id: product
          label: 产品证据
          detail: 官方页面强调欺诈担保、拒付保障和批准率提升。
          claimRefs:
            - CV004
            - CV005
            - CV007
        - id: pricing
          label: 商业结构
          detail: 定价是定制化、按使用量计费，而不是公开价目表。
          claimRefs:
            - CV006
        - id: comps
          label: 可比框架
          detail: 独立对比材料将 Signifyd 放在担保 / 责任转移型厂商集合中，而不是某个明显的单一品类赢家。
          claimRefs:
            - CV009
            - CV015
        - id: gap
          label: 缺失的风险评估数据
          detail: 没有留存的公开来源披露当前 ARR、毛利率、NRR、准备金方法或更新的估值。
          claimRefs:
            - CV011
        - id: call
          label: 推荐
          detail: 在新的经济数据和条款披露前，以中等信心、高风险和估值偏高的判断继续跟踪。
          claimRefs:
            - CV010
            - CV012
            - CV013
      edges:
        - from: proof
          to: product
          label: 真实平台，而非概念
          claimRefs:
            - CV001
            - CV004
        - from: product
          to: pricing
          label: 价值主张成立，但变现细节不足
          claimRefs:
            - CV004
            - CV006
        - from: pricing
          to: comps
          label: 买方替代方案很重要
          claimRefs:
            - CV006
            - CV009
            - CV015
        - from: comps
          to: gap
          label: 公开可比对象不能替代公司自身经济性
          claimRefs:
            - CV008
            - CV011
        - from: gap
          to: call
          label: 经济数据缺失，因此维持跟踪
          claimRefs:
            - CV010
            - CV011
            - CV013
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV008
      - CV011
      - CV015
