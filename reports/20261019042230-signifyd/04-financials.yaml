  evidenceGaps:
    - type: missing-source
      severity: material
      topic: capital-adequacy
      missingEvidence: Current cash balance, monthly burn, runway, debt facilities, and next financing trigger.
      whyItMatters: The capital stack and cash runway determine whether the guarantee-backed model can absorb volatility without near-term financing dependency.
      diligencePath: Request the latest board deck or monthly management accounts with cash, burn, covenant, and runway schedules.
      relatedQuestionRefs: [QI007]
    - type: missing-source
      severity: material
      topic: guarantee-economics
      missingEvidence: Realized take rate, reimbursement loss ratio, reserve methodology, and gross margin by product line.
      whyItMatters: A guarantee-backed approval product can look attractive on topline pricing while still being margin-fragile if approval losses or reserves rise.
      diligencePath: Request cohort-level unit economics for approved GMV, fraud losses, reimbursements, dispute wins, and product gross margins.
      relatedQuestionRefs: [QI002, QI003]
    - type: missing-source
      severity: material
      topic: customer-and-revenue-mix
      missingEvidence: Revenue by product, merchant segment, geography, top-customer concentration, NRR, and churn.
      whyItMatters: Revenue quality depends on concentration, attach rate, and retention, none of which can be validated from the public source set.
      diligencePath: Request the revenue bridge by product and segment plus cohort retention and concentration schedules.
      relatedQuestionRefs: [QI005, QI008]
