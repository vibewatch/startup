schemaVersion: report-v2
artifact: financials
slug: signifyd
runDate: 2026-10-19
company:
  name: Signifyd
chapter:
  number: 4
  title: Financials
  summary: >-
    Signifyd's public financial story is economically intuitive: a guarantee-backed,
    transaction-linked commerce protection platform with disclosed list pricing and
    strong company-claimed checkout outcomes. Underwriting still depends on private
    disclosure because the public record does not expose current revenue, margin,
    reserve, or runway data.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and pricing
    body: >-
      The retained evidence shows a business model built around real-time order
      decisioning plus liability transfer rather than a pure software subscription.
      BigCommerce lists a standard package at $1,500 per month plus 0.8% of approved
      order value, while Signifyd and UsagePricing both describe a workflow in which
      the company scores orders at checkout, stands behind approved fraud decisions,
      and adds post-payment dispute services. That combination matters for revenue
      quality: pricing can scale with merchant transaction flow, but the realized
      economics depend on approval mix, chargeback incidence, and contract terms that
      are not publicly disclosed.
    claimRefs: [CI001, CI002, CI003, CI012]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: unit-economics-and-traction-proxies
    title: Unit economics and traction proxies
    body: >-
      Public operating evidence is heavy on marketing outcomes and light on audited
      economics. Signifyd's own product pages advertise up to 98% approval, up to 93%
      chargeback reduction, and zero hours spent on manual review, while the Complete
      Chargeback Protection page adds a claimed 5-9% order-approval uplift and 50%
      higher dispute win rate than the industry average. Those metrics imply a
      merchant ROI story centered on higher conversion and lower labor or loss costs,
      but they do not reveal realized take rates, reimbursement cost ratios, or gross
      margins. The only public traction proxy in the assigned pool is a third-party
      technology-tracking estimate, which is directionally useful but not a substitute
      for financial reporting.
    claimRefs: [CI004, CI005, CI007, CI010, CI011]
    tableRefs: [TI003]
  - id: capital-adequacy-and-disclosure-gaps
    title: Capital adequacy and disclosure gaps
    body: >-
      The available public capital marker remains historical rather than current:
      Wikipedia cites a $205 million Series E at a $1.34 billion valuation in April
      2021. That is useful as background for the scale Signifyd once achieved, but it
      does not answer today's underwriting questions around cash on hand, burn,
      guarantee-loss reserves, or debt obligations. The assigned sources do not
      publish current revenue, ARR, gross margin, customer concentration, NRR, or
      runway, so the investor's financial diligence burden shifts to private materials
      rather than public triangulation.
    claimRefs: [CI009, CI011, CI012]
  - id: financial-verdict
    title: Financial verdict
    body: >-
      Financially, Signifyd looks like a differentiated but opaque risk-transfer
      business. The public evidence supports a credible mechanism for monetization:
      merchants pay for decisioning, integration, and downstream chargeback services,
      and the guarantee can justify usage-linked pricing when performance is strong.
      The same structure creates underwriting sensitivity to reserve methodology,
      approval discipline, and dispute economics, all of which remain undisclosed in
      the retained evidence. The result is a constructive view on revenue quality in
      concept, but a still-incomplete view on margin durability and capital adequacy.
    claimRefs: [CI001, CI008, CI011, CI012]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - [Guaranteed Fraud Protection, "Real-time order approval/decline plus fraud chargeback guarantee", "Monthly fee plus % of approved GMV", "Live product; list price visible via BigCommerce", "Corroborated model, but realized take rate undisclosed", "Provide realized fee schedules, approval-volume mix, and reimbursement loss ratio by merchant cohort"]
      - [Complete Chargeback Protection, "Guarantee extends to fraud and some non-fraud chargebacks on approved orders", "Contracted service economics not public", "Live Europe/UK offer", "Product scope is clear; economics are company-authored only", "Provide attach rate, regional pricing, and margin by dispute type"]
      - [Chargeback Recovery, "Representment and recovery workflow after disputed transactions", "Likely service or success-fee based, but not public", "Referenced in public product positioning", "Revenue contribution is plausible but not quantified", "Provide recovery pricing, win-rate economics, and labor intensity"]
      - [Checkout integrations, "Plugin/API embeds Signifyd into merchant checkout and order flow", "Implementation supports transaction-linked monetization", "$1,500/month plus 0.8% of approved order amount on one public listing", "List pricing only; enterprise terms unknown", "Provide discounting norms, minimum commitments, and channel-specific pricing"]
    notes: >-
      Public evidence mixes partner-listed list pricing with company-authored product
      positioning. It does not disclose realized pricing, product-level revenue mix,
      or guarantee loss ratios.
    claimRefs: [CI001, CI002, CI003, CI011]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - ["$1,500/month standard fee", "Public list price on BigCommerce", "Enterprise discounting not disclosed", "BigCommerce"]
      - ["0.8% of approved order amount", "Public variable component on BigCommerce", "Actual blended take rate by merchant cohort unknown", "BigCommerce"]
      - ["Custom enterprise plans", "Contact-sales / negotiated", "Contract minimums, floors, and regional pricing undisclosed", "BigCommerce"]
      - ["Complete Chargeback Protection and recovery services", "No public price disclosed", "Guarantee fee structure, recovery success fees, and reimbursement cost assumptions unknown", "Signifyd product pages"]
    notes: >-
      This table separates observable list pricing from unknown realized economics.
      Official product pages support monetization breadth, but only the BigCommerce
      listing exposes a concrete price point.
    claimRefs: [CI002, CI005, CI011]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Approval / conversion proxy", "Up to 98% approval and 5-9% more approved good orders", medium, "Supports the ROI case if approvals translate into profitable GMV", "Show merchant-cohort approval uplift versus fraud-loss and reimbursement cost"]
      - ["Chargeback / labor proxy", "Up to 93% chargeback reduction, 0% hours spent on manual review, and 50% more disputes won than industry average", medium, "Suggests operating leverage, but the baseline and merchant mix are not disclosed", "Provide before/after loss, dispute, and staffing metrics by cohort"]
      - ["Public adoption proxy", "756 tracked websites and 7.2% tracked share", low, "Shows some external usage visibility, but methodology is third-party and narrow", "Provide paying merchant count, GMV protected, and customer concentration"]
      - ["Current revenue / ARR / gross margin", null, unavailable, "Core underwriting metrics are absent from public materials", "Provide current revenue, ARR, gross margin, and product-line mix"]
      - ["Cash / burn / runway", null, unavailable, "Needed to judge financing dependency and next-round timing", "Provide cash balance, monthly burn, debt facilities, and base-case runway"]
      - ["Reserve methodology / guarantee loss ratio", null, unavailable, "Critical for a guarantee-backed business because losses can compress margin quickly", "Provide reserve policy, reimbursement loss rate, and approval-loss guardrails"]
    notes: >-
      Null values mean the assigned public evidence does not disclose the metric.
      Company-authored performance claims are useful directional signals, not audited
      unit-economics evidence.
    claimRefs: [CI004, CI005, CI007, CI010, CI011]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Signifyd monetizes by inserting guarantee-backed fraud decisioning into checkout
      and then extending value into reimbursement and dispute workflows.
    data:
      nodes:
        - id: integrate
          label: Merchant integrates plugin or API
          description: "Integration happens through ecommerce plugins or direct API connections."
          claimRefs: [CI001, CI002]
        - id: score
          label: Orders and identities are scored in real time
          description: "The platform evaluates transactions before merchants ship goods."
          claimRefs: [CI001, CI003]
        - id: decide
          label: Signifyd approves or declines and assumes approved-order fraud liability
          description: "Guarantee-backed approvals are the core product differentiator."
          claimRefs: [CI001, CI006]
        - id: monetize
          label: Merchant pays platform and usage-linked fees
          description: "Public list economics show a monthly fee plus a percentage of approved order value."
          claimRefs: [CI002, CI012]
        - id: recover
          label: Chargeback reimbursement and dispute services extend value
          description: "Post-payment services broaden the monetization surface beyond initial decisioning."
          claimRefs: [CI003, CI005]
        - id: underwrite
          label: Margin durability depends on loss ratios, reserve policy, and realized pricing
          description: "Those inputs are not public, so capital adequacy cannot be underwritten from the public set alone."
          claimRefs: [CI011, CI012]
      edges:
        - from: integrate
          to: score
          label: Merchant transaction data enters the decision workflow
        - from: score
          to: decide
          label: Risk model output determines approval path
        - from: decide
          to: monetize
          label: Approved-order volume drives fee opportunity
        - from: monetize
          to: recover
          label: Chargeback and dispute workflows add service depth
        - from: recover
          to: underwrite
          label: Loss control and contract terms determine profitability
    claimRefs: [CI001, CI003, CI011, CI012]
