      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The clearest buyers are enterprise and mid-market digital merchants with material card-not-present volume,
              chargeback exposure, false-decline concerns, or costly manual review. Fraud and risk teams are direct
              users; ecommerce, payments, operations, finance, customer-service, and IT teams participate because the
              decision affects conversion, fulfillment, authorization, disputes, and integration. Signifyd offers
              prebuilt plugins for major commerce platforms and a direct API, reducing the integration barrier but not
              eliminating model calibration, data-sharing, policy, and procurement work. Trigger events include rising
              attacks, international expansion, omnichannel fulfillment, high false declines, and pressure to automate
              review. The evidence does not identify a universal budget owner or contract-price basis, so payer and
              budget ownership remain account-specific diligence items.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
              - CM008
              - CM014
      - number: '2.4'
        title: Adoption constraints and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is supported by broader attack surfaces: Signifyd reported sharp 2026 increases in account
              takeover, card testing, buy-online-pick-up- in-store fraud, and first-party abuse. Adoption nevertheless
              depends on whether avoided fraud, recovered approvals, and lower review cost exceed software fees and the
              operational cost of integration. Liability-shift products can make ROI legible, but company-issued claims
              of up to 98% approval, up to 93% chargeback reduction, and zero manual-review hours are not independent
              market benchmarks. Public pricing is unavailable, budget ownership is not established, and no source
              exposes loss-reserve economics or a monetary market denominator. These gaps matter for valuation: a
              credible revenue multiple requires verified transaction volume, take rate or pricing, retention, guarantee
              losses, and segment penetration rather than extrapolation from website counts or attack growth.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM013
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Monetary market size remains unverified
            body: >-
              Do not convert web detections, a vendor network, attack growth, or a broad cybersecurity forecast into
              TAM. Request merchant transaction volume, pricing, eligible order mix, guarantee-loss economics, and
              segment penetration before underwriting category share or revenue capacity.
            calloutType: risk
            claimRefs:
              - CM006
              - CM009
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct peers versus substitutes
        blocks:
          - type: paragraph
            body: >-
              Public evidence places Signifyd inside a narrow liability-transfer shortlist rather than a generic
              fraud-tools bucket. WalletInvestor describes Riskified as the closest direct alternative for large global
              merchants, while PaymentBrief groups Signifyd, Riskified, and ClearSale in guarantee/liability-shift
              models, separates Forter as managed decisioning, and places Sift and Kount on the
              merchant-retained-liability side. That means the real buying decision starts with commercial model choice;
              outsource chargeback risk to a vendor, or keep approval logic and loss ownership in-house through
              score-led tools and merchant-run workflows. Substitute pressure therefore comes not just from named
              competitors, but from merchants deciding they want more control and less dependence on insurance-style
              guarantees.
