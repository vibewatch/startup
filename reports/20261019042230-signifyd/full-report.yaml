  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence supports a checkout-led land motion that expands into adjacent merchant workflows, while renewal
      quality remains under-disclosed.
    data:
      nodes:
        - label: Fraud pressure creates demand
          detail: >-
            High-volume ecommerce merchants facing rising fraud and card-testing pressure become the natural first
            target.
          touchpoints:
            - Fraud pressure rose 33% year over year in the first four months of 2026.
            - Card-testing attacks jumped 175% over the same period.
        - label: Guarantee-backed initial land
          detail: >-
            Guaranteed Fraud Protection is positioned as the first deployment for merchants that want instant decisions
            and liability shift.
          touchpoints:
            - Approve more orders, eliminate manual review, and protect revenue with Guaranteed Fraud Protection.
            - Any fraudulent chargeback from an approved order is reimbursed.
        - label: Operational adoption across teams
          detail: >-
            The buyer expands from fraud leaders to payments, ecommerce operations, finance, and support teams that care
            about approval rates and chargebacks.
          touchpoints:
            - Up to 98% approval, more revenue.
            - 0% hours spent on manual review.
        - label: Cross-sell into adjacent modules
          detail: >-
            Once integrated, Signifyd can attach chargeback recovery, non-fraud dispute coverage, returns-abuse tools,
            and authorization optimization.
          touchpoints:
            - Complete Chargeback Protection.
            - Authorization Rate Optimization.
        - label: Channel and ecosystem leverage
          detail: >-
            Prebuilt ecommerce integrations and partner channels lower friction for merchants already committed to a
            commerce stack.
          touchpoints:
            - Plugin integration.
            - Celerant markets Signifyd as a partner solution for ecommerce retailers.
        - label: Renewal and concentration test
          detail: >-
            Public materials explain the pitch but do not publish retention, concentration, or partner-mix data, so
            renewal quality still has to be diligence-led.
          touchpoints:
            - Thousands of merchants or brands are cited, but exact current count is absent.
            - NRR, GRR, churn, contract length, and top-customer concentration are not public.
    claimRefs:
      - CU004
      - CU005
      - CU009
      - CU010
      - CU014
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      The highest residual risks are the underwriting economics hidden behind the guarantee and the checkout-critical
      dependency on model quality and integrations.
    data:
      columns:
        - label: Likelihood
          note: Author assessment grounded only in retained public evidence.
        - label: Impact
          note: Impact on underwriting economics, approvals, and diligence confidence.
        - label: Mitigation maturity
          note: Whether public evidence shows an actual mitigation, not merely a claim.
        - label: Residual severity
          note: Residual exposure after considering public mitigations.
      rows:
        - label: Guarantee economics opacity
          note: Public evidence confirms the model, but not the reserves or exclusions behind it.
          values:
            - label: High
              tone: high
              note: Liability-shift is central to the product and exclusions still need contract diligence.
            - label: High
              tone: critical
              note: Loss-rate or reserve weakness would hit both margins and underwriting credibility.
            - label: Medium
              tone: medium
              note: Network-informed decisioning is evidenced, but reserve policy is not.
            - label: High
              tone: high
              note: Public sources do not disclose reserve methodology, loss rates, or guarantee profitability.
        - label: Model drift / false declines
          note: Approval growth depends on trustworthy automated decisions.
          values:
            - label: Medium
              tone: medium
              note: The product is explicitly optimized to approve more orders and cut manual review.
            - label: High
              tone: high
              note: Bad decisions would hurt approvals, chargebacks, and merchant trust simultaneously.
            - label: Medium
              tone: medium
              note: Publicly described feedback loops exist, but QA and override telemetry are not disclosed.
            - label: High
              tone: high
              note: The Shopify review mix and Lenovo testimonial both show false-decline sensitivity matters.
        - label: Integration / checkout dependency
          note: The platform sits inline with merchant checkout flows.
          values:
            - label: Medium
              tone: medium
              note: Broad integrations are evidenced, but uptime and rollback design are not.
            - label: High
              tone: high
              note: Inline failures could disrupt approvals or create revenue loss immediately.
            - label: Medium
              tone: medium
              note: Multiple plugin and API paths help, yet incident handling remains undisclosed.
            - label: Medium-high
              tone: high
              note: Residual risk stays elevated until direct operational diligence is complete.
        - label: Stale financing transparency
          note: The latest public valuation datapoint in the retained pool is from 2021.
          values:
            - label: Medium
              tone: medium
              note: Historical funding exists, but current financing flexibility is not publicly refreshed here.
            - label: High
              tone: high
              note: A guarantee model can be more capital-sensitive than a pure software workflow.
            - label: Low
              tone: low
              note: No public mitigation beyond historical scale and funding is retained in this pool.
            - label: High
              tone: high
              note: Investors still need current reserve, cash, and valuation evidence.
        - label: Merchant satisfaction drag
          note: Marketplace feedback is positive overall but not uniformly so.
          values:
            - label: Medium
              tone: medium
              note: The Shopify listing shows meaningful one-star share even with a solid overall rating.
            - label: Medium
              tone: medium
              note: Sustained dissatisfaction would weaken expansion and renewal credibility.
            - label: Medium
              tone: medium
              note: Public evidence shows adoption, but not detailed support or churn telemetry.
            - label: Medium
              tone: medium
              note: Residual exposure stays meaningful until complaint themes and churn data are reviewed.
        - label: Independent disclosure freshness
          note: External operating evidence is thinner than the marketing evidence.
          values:
            - label: Medium
              tone: medium
              note: ExploreTech's latest profile is recent, yet still unverified and light on operating detail.
            - label: Medium
              tone: medium
              note: Weak independent telemetry limits confidence in execution quality and current posture.
            - label: Low
              tone: low
              note: No strong public mitigation is retained beyond broad directories and comparison content.
            - label: Medium-high
              tone: high
              note: Residual severity remains elevated until management supplies fresher third-party corroboration.
    approximationNotes: >-
      Heatmap values are qualitative synthesis from retained sources; they summarize investor-relevant residual severity
      rather than source-published risk scores.
    claimRefs:
      - CR003
      - CR006
      - CR008
      - CR009
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation follows from real product proof and historical scale on one side, offset by missing current
      underwriting data and pricing opacity on the other.
    data:
      nodes:
        - id: proof
          label: Historical proof point
          detail: $390M cumulative funding; 2021 Series E at $1.3B post-money remains the last public mark.
          claimRefs:
            - CV001
            - CV002
        - id: product
          label: Product evidence
          detail: Official pages emphasize guaranteed fraud protection, chargeback coverage, and approval-rate uplift.
          claimRefs:
            - CV004
            - CV005
            - CV007
        - id: pricing
          label: Commercial structure
          detail: Pricing is custom and usage-based rather than a public rate card.
          claimRefs:
            - CV006
        - id: comps
          label: Comparable frame
          detail: >-
            Independent comparison material places Signifyd inside a guarantee/liability-shift set rather than a single
            obvious category winner.
          claimRefs:
            - CV009
            - CV015
        - id: gap
          label: Missing underwrite data
          detail: >-
            No retained public source discloses current ARR, gross margin, NRR, reserve methodology, or a newer
            valuation mark.
          claimRefs:
            - CV011
        - id: call
          label: Recommendation
          detail: >-
            Track with medium confidence, high risk, and a stretched valuation stance until fresh economics and terms
            are disclosed.
          claimRefs:
            - CV010
            - CV012
            - CV013
      edges:
        - from: proof
          to: product
          label: Real platform, not a concept
          claimRefs:
            - CV001
            - CV004
        - from: product
          to: pricing
          label: Value proposition exists, but monetization detail is thin
          claimRefs:
            - CV004
            - CV006
        - from: pricing
          to: comps
          label: Buyer alternatives matter
          claimRefs:
            - CV006
            - CV009
            - CV015
        - from: comps
          to: gap
          label: Public comps do not replace company economics
          claimRefs:
            - CV008
            - CV011
        - from: gap
          to: call
          label: Missing economics keeps the stance at track
          claimRefs:
            - CV010
            - CV011
            - CV013
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV008
      - CV011
      - CV015
