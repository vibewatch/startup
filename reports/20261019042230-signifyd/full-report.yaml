      - number: '5.3'
        title: Maturity signals, dependencies, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports product maturity in the sense that Signifyd exposes plugins, partner channels, a
              documented payment-services integration, and a public API surface with signed webhook notifications. The
              weaker area is verification of non-marketing operating controls. Adobe's documentation shows real
              compatibility constraints and direct onboarding dependence on Signifyd, which is useful because it proves
