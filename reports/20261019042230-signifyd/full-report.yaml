        title: Integration architecture and deployment model
        blocks:
          - type: paragraph
            body: >-
              The assigned pool shows multiple deployment paths. Adobe documents current support for Signifyd 5.4.0+
              inside Adobe Commerce Payment Services, including pre-auth and post-auth flows plus coverage across major
              payment methods. Adobe's marketplace listing and Signifyd's own product page show plugin-based deployment
              for mainstream commerce platforms, while the API Evangelist profile and the Houseblend NetSuite guide
              describe a deeper technical path via REST APIs, asynchronous webhooks, and ERP or middleware
              orchestration. That points to a product that can meet merchants at several layers of the stack, but it
              also means implementation quality depends on payment-action configuration, order-system mapping, and
              merchant operations discipline instead of a zero-config install everywhere.
