        title: Capital adequacy and disclosure gaps
        blocks:
          - type: paragraph
            body: >-
              The available public capital marker remains historical rather than current: Wikipedia cites a $205 million
              Series E at a $1.34 billion valuation in April 2021. That is useful as background for the scale Signifyd
              once achieved, but it does not answer today's underwriting questions around cash on hand, burn,
              guarantee-loss reserves, or debt obligations. The assigned sources do not publish current revenue, ARR,
              gross margin, customer concentration, NRR, or runway, so the investor's financial diligence burden shifts
