      - number: '3.3'
        title: Switching cost and moat durability
        blocks:
          - type: paragraph
            body: >-
              Public materials do not prove a durable winner, which is itself the most important adverse competitive
              signal. PaymentBrief explicitly says product pages cannot establish who will perform best on a merchant's
              traffic and recommends parallel bake-offs because vendor-published approval and fraud metrics are not
              comparable across different customer mixes. Signifyd still shows real distribution and scale advantages in
              the public record; plugins for major commerce stacks, a broader suite spanning recovery and abuse
              prevention, and measurable web footprint in WMTips' tracked dataset. Those strengths look more like
              workflow breadth, ecosystem access, and data-network scale than a unique feature monopoly. The moat is
              therefore plausible but execution-dependent, and merchants still need contract and traffic-level diligence
              before treating Signifyd as categorically superior to Riskified, Forter, or control-oriented substitutes.
            claimRefs:
