  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing
        blocks:
          - type: paragraph
            body: >-
              The retained evidence shows a business model built around real-time order decisioning plus liability
              transfer rather than a pure software subscription. BigCommerce lists a standard package at $1,500 per
              month plus 0.8% of approved order value, while Signifyd and UsagePricing both describe a workflow in which
              the company scores orders at checkout, stands behind approved fraud decisions, and adds post-payment
              dispute services. That combination matters for revenue quality: pricing can scale with merchant
              transaction flow, but the realized economics depend on approval mix, chargeback incidence, and contract
              terms that are not publicly disclosed.
