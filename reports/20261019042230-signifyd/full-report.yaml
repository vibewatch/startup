  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and differentiation
        blocks:
          - type: paragraph
            body: >-
              Signifyd's core product is not generic analytics; it is an operational decisioning layer inserted into
              ecommerce workflows. On its Guaranteed Fraud Protection page, the company says the product "uses
              AI-powered decisioning at checkout to instantly evaluate each order" and backs approved transactions with
              a fraud-chargeback guarantee, while the same page describes real-time analysis over 25,000+ data features
              and adaptive models tuned by vertical and use case. Recent company blog material shows that Signifyd now
              frames the platform as broader than checkout, spanning account creation/login, checkout, and post-purchase
              abuse management. The product differentiation therefore rests on a combination of instant approve/decline
              decisions, liability transfer, and a widening product family rather than on a pure dashboard or rules
              engine.
            claimRefs:
