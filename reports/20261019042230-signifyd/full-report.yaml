  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable boundary is narrower than cybersecurity and broader than checkout fraud scoring. Signifyd
              is positioned around card-not-present ecommerce order decisioning, false-decline reduction, and a
              financial guarantee on approved orders. Adjacent workflows include account protection, policy and return
              abuse, payment compliance, authorization optimization, chargeback recovery, and, in the UK and Europe,
              non-fraud chargeback coverage. The practical substitutes are merchant rules and manual review,
              risk-score-only software, payment-provider controls, and accepting more fraud or false declines. Generic
              identity security, broad payment processing, and ecommerce software without a transaction risk decision
              are outside the core boundary. Independent directory evidence also cautions that very small merchants,
              businesses with little chargeback exposure, and companies outside card-not-present commerce are weaker-fit
              segments.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM015
      - number: '2.2'
        title: Evidence-constrained sizing and demand
        blocks:
          - type: paragraph
            body: >-
              The allocated sources do not publish a defensible monetary category TAM, SAM, or SOM, so the chapter uses
              observable adoption and competitive lenses instead of converting a broad fraud or cybersecurity forecast
              into addressable revenue. WMTips reported 756 detected Signifyd websites, a 7.2% share within its
              fraud-prevention technology category, and detection on 0.04% of all websites as of March 16, 2025. Those
              figures describe that publisher's web-detection universe, not merchant spend, gross merchandise value, or
              revenue share. Tracxn's live company profile counted 2,157 active competitors, including 408 funded
              companies, but its taxonomy includes adjacencies and is not a clean direct-competitor denominator.
              Signifyd's 2026 company-issued network statistics show thousands of merchants and 950 million unique
              digital wallets, while fraud pressure rose 33% year over year in the first four months of 2026. These
              observations indicate demand and data scale, but not market value.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM016
