        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              Financially, Signifyd looks like a differentiated but opaque risk-transfer business. The public evidence
              supports a credible mechanism for monetization: merchants pay for decisioning, integration, and downstream
              chargeback services, and the guarantee can justify usage-linked pricing when performance is strong. The
              same structure creates underwriting sensitivity to reserve methodology, approval discipline, and dispute
              economics, all of which remain undisclosed in the retained evidence. The result is a constructive view on
              revenue quality in concept, but a still-incomplete view on margin durability and capital adequacy.
            claimRefs:
