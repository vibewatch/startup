evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: economics
    missingEvidence: Audited revenue, ARR, gross margin, and reserve or loss-rate economics for guarantee-backed decisions.
    whyItMatters: Without these metrics, the underwriting case for the guarantee model and unit economics cannot be pressure-tested.
    diligencePath: >-
      Request current management financials, cohort margin by product, and reserve methodology for approved-order
      guarantees.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Current executive roster, board composition, investor governance rights, and succession planning.
    whyItMatters: Public founder identity alone is not enough to assess decision rights, bench depth, or key-person concentration.
    diligencePath: Request an org chart, board list, committee structure, and cap-table governance summary from management.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: stale
    severity: material
    topic: valuation
    missingEvidence: >-
      A post-2021 financing, secondary transaction, 409A-style mark, or lender view that refreshes the public valuation
      anchor.
    whyItMatters: >-
      The last visible outside mark is the April 2021 unicorn round, which may not reflect the current private-market
      environment.
    diligencePath: Request the latest financing history, internal valuation materials, and any debt or structured-capital updates.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: customer-footprint
    missingEvidence: >-
      Exact paying merchant count, top-customer concentration, and reconciled definitions behind external
      website-detection statistics.
    whyItMatters: Directional adoption signals do not substitute for a cohort-level customer and concentration view.
    diligencePath: >-
      Request customer counts by segment, top-account exposure, and definitions used for merchant, brand, and protected
      transaction reporting.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: monetary-market-size
    missingEvidence: >-
      A current category-spend estimate with explicit geography, merchant eligibility, transaction denominator, period,
      and methodology.
    whyItMatters: >-
      Without a defined monetary denominator, TAM, SAM, and SOM cannot support revenue-capacity or valuation
      conclusions.
    diligencePath: >-
      Obtain a reputable analyst methodology or build a bottom-up model from eligible ecommerce GMV, fraud-protection
      pricing, and merchant segment penetration.
    relatedQuestionRefs:
      - QM002
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-and-budget
    missingEvidence: >-
      Current contract pricing, fee basis, average contract value, sales cycle, procurement owner, and budget allocation
      by merchant segment.
    whyItMatters: Adoption economics and addressable revenue cannot be inferred from product claims or website detections.
    diligencePath: >-
      Review anonymized contracts and pipeline data, then interview risk, ecommerce, finance, and procurement owners
      across representative customers.
    relatedQuestionRefs:
      - QM005
      - QM007
      - QM009
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: guarantee-economics
    missingEvidence: >-
      Eligible order volume, approval uplift, guarantee-loss rate, reserves, dispute recovery, gross margin, and cohort
      retention by segment.
    whyItMatters: >-
      Vendor-reported approval and chargeback outcomes do not establish durable unit economics or profitable market
      capture.
    diligencePath: >-
      Reconcile customer-level order data, guarantee payouts, pricing, and gross profit for representative merchant
      cohorts.
    relatedQuestionRefs:
      - QM002
      - QM007
      - QM009
  - type: missing-source
    severity: material
    topic: pricing-and-exclusions
    missingEvidence: >-
      Contract-level rates, exclusions, override rights, and refund or non-fraud reason-code carve-outs for Signifyd,
      Riskified, Forter, and ClearSale.
    whyItMatters: >-
      Public list pricing is sparse, so commercial comparability and real liability transfer cannot be underwritten from
      assigned sources alone.
    diligencePath: Request anonymized order-file pricing analyses, term sheets, and exclusion schedules from each finalist vendor.
  - type: private-evidence-only
    severity: material
    topic: merchant-specific-performance
    missingEvidence: >-
      Shadow-mode approval, false-decline, fraud-loss, and dispute outcomes on the merchant's own traffic across
      multiple vendors.
    whyItMatters: >-
      Independent sources say public performance claims are not comparable across merchants, so durable winner selection
      needs merchant-specific evidence.
    diligencePath: >-
      Run a parallel bake-off with at least one guarantee peer and one score-led substitute using the same historical
      and live traffic segments.
  - type: missing-source
    severity: minor
    topic: distribution-and-lock-in
    missingEvidence: >-
      Comparable partner-count, implementation-time, and multi-homing case data for Signifyd versus Riskified, Forter,
      and Sift.
    whyItMatters: >-
      Current sources show integrations and suite breadth but do not prove whether they create durable lock-in or only
      lower initial implementation friction.
    diligencePath: >-
      Collect reference calls and implementation plans from merchants that have switched among these vendors within the
      last 24 months.
  - type: missing-source
    severity: material
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, runway, debt facilities, and next financing trigger.
    whyItMatters: >-
      The capital stack and cash runway determine whether the guarantee-backed model can absorb volatility without
      near-term financing dependency.
    diligencePath: Request the latest board deck or monthly management accounts with cash, burn, covenant, and runway schedules.
    relatedQuestionRefs:
      - QI007
  - type: missing-source
    severity: material
    topic: guarantee-economics
    missingEvidence: Realized take rate, reimbursement loss ratio, reserve methodology, and gross margin by product line.
    whyItMatters: >-
      A guarantee-backed approval product can look attractive on topline pricing while still being margin-fragile if
      approval losses or reserves rise.
    diligencePath: >-
      Request cohort-level unit economics for approved GMV, fraud losses, reimbursements, dispute wins, and product
      gross margins.
    relatedQuestionRefs:
      - QI002
      - QI003
  - type: missing-source
    severity: material
    topic: customer-and-revenue-mix
    missingEvidence: Revenue by product, merchant segment, geography, top-customer concentration, NRR, and churn.
    whyItMatters: >-
      Revenue quality depends on concentration, attach rate, and retention, none of which can be validated from the
      public source set.
    diligencePath: Request the revenue bridge by product and segment plus cohort retention and concentration schedules.
    relatedQuestionRefs:
      - QI005
      - QI008
  - type: private-evidence-only
    severity: material
    topic: security-and-compliance-artifacts
    missingEvidence: >-
      Direct trust-center artifacts such as SOC 2, ISO 27001, PCI attestation scope, privacy architecture, and
      incident-handling documentation tied to the current product set.
    whyItMatters: >-
      Product buyers in payments and fraud operations need hard evidence that security and compliance claims extend
      beyond partner marketing and public feature pages.
    diligencePath: >-
      Request current trust-center documents, certification reports, data-flow diagrams, and security questionnaire
      responses from Signifyd during technical diligence.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: reliability-and-api-operations
    missingEvidence: >-
      Public rate limits, webhook retry semantics, uptime or SLA commitments, change-log discipline, and version-support
      policy for APIs and plugins.
    whyItMatters: >-
      These details determine whether the product can sit safely in the merchant checkout path without hidden
      operational fragility.
    diligencePath: >-
      Obtain developer docs for webhook retry behavior and API limits, the customer-facing status/SLA commitments, and
      release/versioning policy for each supported commerce platform.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: minor
    topic: partner-surface-depth
    missingEvidence: >-
      Equivalent public technical depth for non-Adobe ecosystems such as Shopify, Salesforce Commerce Cloud,
      BigCommerce, and bespoke payment stacks.
    whyItMatters: >-
      The current pool proves breadth of integration options, but not consistent implementation maturity across every
      named commerce channel.
    diligencePath: >-
      Ask for current implementation guides, reference architectures, and support runbooks for the specific commerce
      stack under evaluation.
    relatedQuestionRefs:
      - QE004
  - type: missing-source
    severity: material
    topic: retention-durability
    missingEvidence: Public NRR, GRR, churn, renewal rate, contract duration, or cohort disclosure for the merchant base.
    whyItMatters: >-
      The chapter can show real adoption, but not whether customers stay, expand, or become uneconomic after losses and
      reserve costs.
    diligencePath: >-
      Request cohort retention, renewal, churn, average contract term, and multi-product attach-rate disclosures by
      merchant segment.
    relatedQuestionRefs:
      - QU005
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Exact current merchant count, top-customer revenue share, and partner-sourced revenue mix.
    whyItMatters: >-
      Logo proof without concentration data can hide dependence on a small number of large merchants or a narrow set of
      platform channels.
    diligencePath: >-
      Ask management for current merchant count, top-10 customer concentration, revenue by channel partner, and regional
      customer mix.
    relatedQuestionRefs:
      - QU007
    relatedTableRefs:
      - TU001
      - TU002
  - type: enumeration-incomplete
