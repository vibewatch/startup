      - - Financing and reserve transparency
        - Existing and future capital providers
        - Support for guarantee economics and underwriting confidence
        - Medium
        - Stale public valuation or thin capital disclosure limits confidence in loss-absorption capacity.
        - High
        - Historical scale and prior funding are documented.
        - High until current reserves, cash, and financing position are verified directly.
    notes: >-
      This table mixes technical, network, and balance-sheet dependencies because the public
