        - Shopify, BigCommerce, Adobe Commerce, Salesforce Commerce Cloud, NetSuite
        - Plugins, APIs, and order-flow integration
        - High
        - Connector breakage or platform-policy changes reduce decision coverage or disrupt checkout approvals.
        - High
        - Multiple integration paths and broad platform support are publicly evidenced.
        - Medium-high until live connector SLAs and rollback paths are reviewed.
      - - Merchant network and feedback loops
        - Participating merchant base and chargeback/bank outcome feedback
        - Data network powering model training and real-time decisions
        - High
