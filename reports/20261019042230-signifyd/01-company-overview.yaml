      - [Business model, "Commerce protection platform with guarantee-backed order decisioning", current, high, "Exact pricing and guarantee exclusions are not public in the assigned pool."]
      - ["Last public valuation", "$1.34B after $205M Series E", "April 2021", medium, "No post-2021 public valuation refresh or secondary mark is surfaced here."]
      - ["Reported funding rounds", "Six listed rounds with amounts totaling about $390M", "2012-2021", medium, "Arithmetic from secondary-source round amounts; raised capital is not current cash, and the list may be incomplete."]
      - ["External company-size field", "200+", "2026-07-09", low, "ExploreTech does not define this field as employee headcount; exact current headcount is unsupported."]
