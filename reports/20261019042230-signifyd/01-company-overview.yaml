artifact: company-overview
slug: signifyd
runDate: 2026-10-19
company:
  name: Signifyd
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Signifyd presents as a private San Jose-based commerce-protection platform whose
    differentiated promise is guarantee-backed order decisioning, not just fraud scoring.
    The assigned evidence pool still anchors public funding and valuation on the April
    2021 Series E, while external profiles provide only directional scale signals and
    leave governance, revenue, and reserve economics largely undisclosed.
sections:
  - id: identity-and-platform
    title: Identity and platform scope
    body: >-
      The assigned source set supports a clear identity baseline even though it is much
      stronger on current product positioning than on hard financial disclosure. Public
      sources describe Signifyd as a private U.S. software company founded in 2011 and
      headquartered in San Jose, while official pages frame the business as a commerce
      protection platform for ecommerce merchants rather than a narrow checkout plug-in.
      The current product narrative centers on a decision engine that spans session
      intelligence, account integrity, purchase optimization, and returns assurance,
      with guarantee-backed fraud decisions and chargeback reimbursement used as the
      core commercial differentiator. That positioning is corroborated by external
      vendor profiles, but the strongest metrics remain company-claimed rather than
      independently audited.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO010, CO012, CO015]
    tableRefs: [TO001]
  - id: leadership-and-capital-visibility
    title: Leadership, capital, and governance visibility
    body: >-
      Founder identity is better evidenced than the current operating bench. Wikipedia
      identifies Raj Ramanand and Mike Liberty as former PayPal risk specialists who
      founded the company, which gives the business a plausible founder-market-fit story
      around payments risk. Public funding history in the assigned pool is also heavily
      back-loaded toward the 2021 unicorn round led by Owl Rock with FIS and CPP
      Investments participating, which is useful for understanding the last visible
      outside mark. What the pool does not surface is the current board roster, present
      executive lineup, or updated ownership and governance rights, so key-person and
      control assessment still depends on management materials rather than public web
      evidence.
    claimRefs: [CO001, CO008, CO009, CO013, CO016]
    tableRefs: [TO002]
  - id: public-scale-signals-and-milestones
    title: Public scale signals and milestone checkpoints
    body: >-
      Current scale evidence is directional rather than underwriting-grade. ExploreTech
      lists the vendor's company size as 200+, without defining that field as current
      employee headcount, while WMTips reports a methodology-specific footprint of 756
      detected websites in data updated March 16, 2025. UsagePricing and PaymentBrief
      reinforce that the commercial identity remains tied to a guarantee or
      liability-shift model, but PaymentBrief cautions that vendor performance figures
      are not independent benchmarks and that buyers must verify exact scope, exclusions,
      and pricing in contract. The timeline therefore separates historical company
      milestones from dated public checkpoints: the evidence shows continued market
      relevance and a stable product thesis, yet it does not refresh valuation,
      profitability, or reserve assumptions beyond the 2021 financing record.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO012, CO013, CO015, CO016]
    tableRefs: [TO003]
    figureRefs: [FO001]
