- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Flagship-project slippage
    - Spain, RWE, or P2X milestones move materially right without equivalent replacement wins
    - Concentrated visible growth ceases to support the premium private narrative
    - Reprice toward bear band or walk away pending proof of replacement demand
  - - Support-mechanism weakening
    - Grants, guarantees, or subsidy-backed project economics are reduced, delayed, or conditioned more tightly
    - Sunfire loses part of the public-risk-sharing that currently supports execution
    - Assume lower conversion, higher capital needs, and weaker valuation support
  - - SOEC validation miss
    - BASF test-facility timeline slips or does not produce credible industrial validation data
    - Bull case loses its cleanest high-temperature derisking catalyst
    - Remove technology-premium assumptions from the model
  - - Peer de-rating resumes
    - Public electrolyzer and hydrogen comps fall materially from current levels
    - Private valuation support compresses even if Sunfire-specific news is unchanged
    - Tighten entry price or require stronger structural protection
  - - Private economics disappoint
    - Diligence reveals weak gross margin, heavy burn, poor backlog aging, or shallow customer deposits
    - Common-equity upside shrinks while financing dependence increases
    - Move from research-more to pass unless price resets
  - - Capital-stack overhang proves severe
    - Preferences, ratchets, or senior claims materially cap new-equity proceeds
    - A fair enterprise value no longer translates into attractive common-equity returns
    - Pass on common-equity entry or renegotiate structure
  notes: These triggers are designed as monitorable underwriting rules, not as generic company risks. Each one directly transmits into valuation compression or weakens the path to a profitable exit.
