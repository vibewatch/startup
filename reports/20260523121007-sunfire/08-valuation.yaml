- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Capital stack
    - Full cap table, liquidation preferences, ratchets, warrants, guarantee covenants, and any seniority ahead of new equity
    - Without the waterfall, the chapter cannot convert enterprise value into reliable common-equity upside
    - Company CFO, counsel, and investor-rights package review
  - - Operating economics
    - Recognized revenue, gross margin, cash, burn, and unrestricted liquidity by 2025-2026 period
    - These determine whether Sunfire deserves peer-like valuation support or only a project-OEM discount
    - Request audited statements, board packs, and monthly KPI dashboards
  - - Backlog quality
    - Backlog aging, cancellation rights, customer deposits, advance-payment schedule, and conversion assumptions by named program
    - Project headlines are not the same as cash-converting backlog
    - Review project controls, commercial contracts, and working-capital roll-forwards
  - - Project milestone proof
    - Stage-gate evidence for Spain, RWE, P2X, and BASF including counterparties, permits, EPC status, and revenue triggers
    - The bull case depends on a small number of programs converting on time
    - Run customer/partner reference calls and obtain updated program plans
  - - SOEC durability and warranty exposure
    - Field-performance, degradation, replacement, reserve, and uptime data for solid-oxide systems
    - High-temperature upside does not justify a premium without industrial reliability proof
    - Technical diligence with engineering leadership and warranty ledger review
  - - Exit readiness
    - Board-approved exit pathways, strategic-buyer interest, and reporting maturity suitable for diligence by sponsors or acquirers
    - A premium entry price only works if the exit route is real and financeable
    - Review banker materials, sponsor feedback, and board strategy decks
  notes: These are the items most likely to move the recommendation from research-more to priced conviction. They focus on the missing evidence that public sources cannot supply.
