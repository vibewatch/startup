- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric / valuation status
  - Why it matters
  - What it says about Sunfire
  - Limitation
  enumerationScope:
    coverage: partial
    basis: 'Rows cover the most decision-useful public and private valuation references retained for this chapter as of 2026-05-23: Sunfire’s own inferred unicorn context, listed electrolyzer peers, and two private funding comparables. The set is partial because recent private transaction marks for closely comparable electrolysis companies remain largely undisclosed.'
  rows:
  - - Sunfire (inferred context)
    - ~€1B reported unicorn threshold in 2023; chapter uses roughly USD 1.1B only as an inferred context
    - Best public anchor for the current private pricing conversation
    - Sets the hurdle a new investor is implicitly being asked to clear
    - No later post-money mark was publicly disclosed in the retained source set
  - - Nel ASA
    - Market cap about USD 0.70B in May 2026; 2025 revenue NOK 963M, cash NOK 1,617M, backlog NOK 1,319M
    - Listed alkaline/PEM peer with more disclosure than Sunfire
    - Shows how cheap a de-rated but transparent public comp can look versus an opaque private unicorn context
    - Different portfolio mix and public-market discount can overstate downside if Sunfire executes better
  - - ITM Power
    - Market cap about USD 1.57B in May 2026; 2025 revenue £26.0M, cash £207M, backlog £145.1M
    - Closest high-visibility listed peer for industrial electrolyzer narrative
    - Suggests Sunfire’s inferred mark already sits near a better-disclosed public comp
    - PEM focus and UK listing make it an imperfect technology and geography match
  - - thyssenkrupp nucera
    - Market cap about USD 1.26B in May 2026 with active 2026 investor-publication cadence
    - Large-scale industrial alkaline incumbent with regular investor disclosure
    - Supports the view that Sunfire is not obviously cheap at an inferred ~$1.1B
    - Much larger installed base and corporate infrastructure than Sunfire
  - - Plug Power
    - Market cap about USD 5.27B in May 2026 despite heavy risk language in filings
    - Shows market appetite can survive even with volatile execution, but only for a broader platform story
    - Acts more as an upper-bound platform reference than as a clean comp
    - Integrated hydrogen model and U.S. scale make it structurally different
  - - Bloom Energy
    - Market cap about USD 86.04B in May 2026; broader solid-oxide and distributed-energy platform
    - Useful only as an outlier showing what a non-pure-play solid-oxide winner can trade at
    - Illustrates why Sunfire should not be valued off the richest broader platform multiple
    - Too diversified and too large to use as a primary pricing comp
  - - Electric Hydrogen
    - Oversubscribed USD 380M Series C in 2023; valuation undisclosed
    - Demonstrates private capital remains willing to fund favored electrolyzer platforms
    - Supports relevance of the sector but not a precise Sunfire valuation mark
    - Round size is not the same as post-money valuation
  - - Hystar
    - More than USD 36M Series C in 2025; valuation undisclosed
    - Shows smaller electrolyzer peers can still raise growth capital after customer traction
    - Reinforces sector capital availability at the lower end of the scale spectrum
    - Financing size is too small and too different to anchor Sunfire’s price directly
  notes: Market-cap rows use May 2026 spot values from CompaniesMarketCap paired with filings or investor publications for operating context. Sunfire’s own row is inferred, not disclosed, and private financing rows are capital-availability signals rather than clean valuation marks.
