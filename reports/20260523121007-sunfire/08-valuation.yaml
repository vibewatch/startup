  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: capital-stack
    missingEvidence: Full cap table, liquidation preferences, ratchets, warrants, guarantee covenants, and any senior claims that sit ahead of new equity.
    whyItMatters: Without the real waterfall, the chapter cannot convert enterprise-value reasoning into reliable common-equity upside or downside at any proposed entry price.
    diligencePath: Request definitive financing documents, board-approved capitalization tables, and counsel walkthroughs of all seniority provisions before pricing a round.
    relatedQuestionRefs:
    - QV027
    - QV026
    - QV029
  - type: private-evidence-only
    severity: blocking
    topic: operating-economics
    missingEvidence: Recognized revenue, gross margin, unrestricted cash, burn, backlog aging, customer deposits, cancellation rights, and warranty exposure for 2025-2026.
    whyItMatters: Those are the core inputs needed to decide whether Sunfire deserves listed-peer-like valuation support or should instead be treated as a support-dependent project OEM.
    diligencePath: Request audited or board-grade operating reports, monthly KPI packs, and project-level commercial schedules from management and finance leadership.
    relatedQuestionRefs:
    - QV023
    - QV029
    - QV031
  - type: enumeration-incomplete
    severity: material
    topic: private-comparable-valuation
    missingEvidence: Recent private transaction marks, signed term sheets, or secondary trades for closely comparable electrolyzer businesses rather than financing-size headlines alone.
    whyItMatters: The comparable table is sufficient for boundary setting, but not sufficient to collapse Sunfire into a precise current mark.
    diligencePath: Gather banker materials, recent sponsor indications, or subscription-database extracts covering private electrolyzer valuation marks and secondaries.
    relatedQuestionRefs:
    - QV018
    - QV023
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: material
    topic: exit-readiness
    missingEvidence: Board-approved exit pathways, strategic-buyer outreach, sponsor interest, and reporting-package maturity suitable for a premium private exit.
    whyItMatters: A high entry price only works if the exit route is credible, timely, and compatible with Sunfire’s disclosure profile.
    diligencePath: Review board decks, banker conversations, strategic outreach logs, and any draft exit materials before underwriting a premium outcome.
    relatedQuestionRefs:
    - QV028
    - QV029
