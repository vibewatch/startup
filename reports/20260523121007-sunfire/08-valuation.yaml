- id: scenario-range-and-investment-call
  title: A range is supportable; a clean buy call is not
  body: 'Given that evidence, the right output is a scenario range and an entry rule, not a heroic point estimate. The base case assumes Sunfire remains one of the better-capitalized European electrolyzer vendors, converts at least part of the Spain and RWE pipeline into recognized backlog or revenue proof, and keeps public support intact. That supports a public-only band of $0.9B to $1.3B with midpoint around $1.1B — effectively around the inferred unicorn context, not far above it. The bull case requires more than order headlines. It needs BASF validation to derisk SOEC, Spain and RWE milestones to convert cleanly, and private diligence to reveal healthier revenue conversion and margin structure than the public record currently shows. Only then does a $1.5B to $2.2B range look defensible. The bear case is not far-fetched. If project timing slips, if subsidy or guarantee support weakens, or if public comps re-rate down again, value can compress toward $0.4B to $0.8B. At a straight entry
    near the inferred $1.1B mark, that asymmetry does not clear a new-money buy hurdle. Even the bull outcome offers less than venture-style upside without either a discount or strong structural protections. The chapter’s recommendation is therefore research-more: Sunfire is investable enough to stay on the list, but not disclosed enough to underwrite aggressively at the publicly inferable price context.'
