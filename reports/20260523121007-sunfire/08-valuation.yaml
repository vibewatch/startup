company:
  name: Sunfire
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports Sunfire as a credible industrial-electrolyzer platform with unusually broad financing support, but not as a tightly priceable equity story. The best-supported read is an inferred valuation context around roughly $1.1B from prior unicorn reporting rather than a directly disclosed current post-money mark. That leaves Sunfire looking financeable and strategically relevant, yet only fair-to-stretched at the inferred mark because peers have de-rated, project conversion remains subsidy-sensitive, and Sunfire still withholds the revenue, margin, cash, and capital-stack detail needed for a clean buy call.
sections:
- id: priceability-and-financing-context
  title: Priceability starts with financing breadth, then runs into disclosure limits
  body: 'Sunfire has enough public financing evidence to look like a serious platform, but not enough to look fully priceable. The 2024 package is real and unusually broad: €215 million of Series E equity, up to €100 million of EIB venture debt, and roughly €200 million of previously approved grant funding. The 2025 guarantee line added another €200 million of execution support by covering advance payments, contract fulfilment, and warranty obligations without requiring Sunfire to post the same level of cash collateral. That matters because it lowers working-capital friction at exactly the point where large hydrogen projects strain balance sheets. It also means, however, that Sunfire is being underwritten through a stack of equity, venture debt, grants, and public guarantees rather than through transparent self-funded operating cash generation. The other crucial limitation is valuation disclosure. Public materials reviewed for this chapter do not disclose a current post-money valuation for
    the 2024 round or any later internal mark. The strongest public valuation signal is a 2023 press report that Sunfire could soon be worth more than €1 billion. This chapter therefore uses roughly $1.1 billion only as an inferred context translated from that reported unicorn threshold, not as a company-confirmed current price. For an investor, that distinction is decisive: the public record proves financeability and ambition, but it does not yet prove that buying common-equity exposure near the implied unicorn mark is attractive.'
