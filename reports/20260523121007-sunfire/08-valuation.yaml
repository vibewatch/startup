tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Lens
  - Current verdict
  - Public support
  - Decision implication
  - What would change the view
  rows:
  - - Recommendation
    - Research-more
    - Financing breadth and project proof are real, but valuation inputs remain incomplete
    - Do not issue a clean buy at the inferred unicorn context
    - Upgrade only after private diligence closes the revenue, margin, cash, and cap-stack gaps
  - - Confidence
    - Medium
    - Directional evidence is coherent while precision is weak
    - Use ranges and guardrails rather than a point target
    - Confidence rises with audited 2025-2026 operating data and a documented waterfall
  - - Risk rating
    - High
    - Downside combines subsidy dependence, project timing, peer de-rating, and opaque economics
    - Require a downside-first term sheet or a lower entry price
    - Risk falls only if flagship projects convert and private economics are demonstrably resilient
  - - Valuation stance
    - Fair only at the low end; stretched around inferred ~$1.1B
    - Estimated context sits near better-disclosed public peers, not at a clear discount
    - Avoid paying full strategic-premium language without operating proof
    - View improves if entry moves materially below the implied unicorn mark
  - - Base-case return at inferred context
    - Sub-2x and likely below target for new money
    - Base band centers near today’s inferred mark, not far above it
    - Entry price matters more than company-quality narrative
    - Return improves only with either a discount or better-than-publicly-visible economics
  - - Preferred exit path
    - Strategic or industrial sponsor, recap, or structured late-stage financing
    - Public evidence does not support a near-term premium IPO case
    - Underwrite to a private exit path, not a public-market miracle rerating
    - View changes if Sunfire begins reporting like a public peer and closes execution milestones
  notes: This table converts the chapter into an IC posture rather than a discounted-cash-flow model. The valuation context is inferred from public evidence and should not be mistaken for a disclosed current post-money mark.
