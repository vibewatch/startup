- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence in favor
  - Counterpoint
  - What would change the view
  rows:
  - - Financing breadth is real
    - Sunfire stacked equity, EIB venture debt, grants, and guarantee support into a >€500M capital context
    - That stack also proves the business still needs external capital and public risk-sharing to scale
    - Show that scale-up can be funded from improving operating cash generation rather than from repeated support instruments
  - - Industrial proof is visible
    - Spain, RWE, P2X, and BASF all show Sunfire is selling into serious industrial workflows
    - Most visible projects still convert into value only after later milestones, partner delivery, and subsidy-backed economics align
    - Provide backlog aging, customer deposits, and milestone-to-revenue conversion data by named program
  - - Technology leverage exists
    - HyLink Alkaline 23 and the BASF SOEC test facility create plausible cost-down and validation upside
    - Those are still company-led proof points, not yet audited field economics or fleet-level durability evidence
    - Deliver independent performance, degradation, and replacement-cost data from scaled operating systems
  - - Public-comp positioning looks respectable
    - An inferred ~$1.1B context is above Nel and near ITM and nucera rather than in obvious distress territory
    - Those listed peers disclose revenue, cash, backlog, and risk language that Sunfire still withholds
    - Move toward public-company disclosure depth or offer a clearly lower private entry price
  - - Current anti-thesis
    - Sunfire may still be an opaque, subsidy-sensitive project OEM whose equity upside is capped by dilution and long conversion cycles
    - The company could deserve a premium if private diligence reveals stronger economics and cleaner seniority than the public record suggests
    - Open the capital stack, operating model, and project-unit economics before asking investors to pay through the uncertainty
  notes: The thesis and anti-thesis are deliberately price-sensitive. A stronger company can still be a weak investment if the investor pays at a level that already assumes execution closure.
