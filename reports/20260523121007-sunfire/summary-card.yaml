summary:
  headline: >-
    Sunfire is a strategically relevant European electrolyzer scale-up with real industrial proof, but public-only
    evidence supports a research-more stance because economics, disclosure, and subsidy-linked project conversion remain
    too opaque to justify a full-price buy.
