companyProfile:
  summary: >-
    Sunfire is a Dresden-based German electrolyzer manufacturer building pressurized alkaline and solid oxide
    electrolysis systems for industrial decarbonization. The company sells into hard-to-abate sectors including
    refining, fuels, chemicals, and steel, and has public project references with RWE, Repsol/Petronor, Neste, P2X
    Solutions, and BASF-linked validation work. Public financing disclosures show a €215 million Series E, up to €100
    million of EIB venture debt, roughly €200 million of undrawn grants, and a €200 million guarantee line, making
    Sunfire one of Europe’s better-capitalized private electrolyzer scale-ups while leaving revenue, valuation, and
    margin detail private.
