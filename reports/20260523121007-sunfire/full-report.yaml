        - Would expose how much of the current execution pace depends on external backstops.
        - Assume slower build-out, higher dilution risk, or both.
      - - Competitive price pressure
        - Peers keep factories underutilised while buyers multi-source
        - >-
          Tender awards increasingly split across vendors and peer disclosures continue to show low-utilisation margin
          pressure
        - Would make cost-down claims harder to monetise even if the product works technically.
        - Demand sharper pricing and margin evidence before underwriting large-volume upside.
      - - Customer concentration
        - One flagship account stalls without replacement demand
        - A visible RWE, Repsol-linked, or P2X program pauses and Sunfire cannot point to equivalent new funded capacity
        - Would expose the difference between named-logo momentum and diversified revenue quality.
        - Reduce forward-volume assumptions and raise required return threshold.
    notes: >-
      Thresholds are diligence heuristics tied to public milestone visibility rather than to contractual covenants. They
      should be refreshed whenever the source pack changes.
