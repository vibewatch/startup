      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              The most credible near-term buyers are industrial users that already consume hydrogen or can justify large
              dedicated electrolysis next to a hard-to-abate process. Refiners are the clearest example: Repsol’s
              Cartagena and Petronor projects show how renewable hydrogen can be tied directly into existing industrial
              complexes, while the MultiPLHY project at Neste shows how even smaller high-temperature systems can plug
              into refinery operations where steam and heat are available. Utilities and hydrogen-hub developers matter
              because they aggregate infrastructure and offtake risk before molecules reach end users; RWE’s Lingen
              project is effectively a utility-led production platform for regional industrial demand. Project
              developers such as P2X Solutions matter for the same reason, with Harjavalta already operating and Joensuu
              linked to e-methanol. Steel and chemicals are strategically important but move on longer investment cycles
              and heavier infrastructure dependencies. Across these segments, the user is often the plant operator or
              engineering team, while the payer is typically a board-level decarbonization budget, refinery management,
              utility investment committee, or project SPV rather than the eventual hydrogen consumer alone.
            claimRefs:
