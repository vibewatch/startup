      - number: '6.3'
        title: Retention, durability, and evidence freshness gaps
        blocks:
          - type: paragraph
            body: >-
              Public proof of customer durability is much thinner than public proof of project selection. Sunfire's
              materials and the customer or project-owner pages identify real counterparties, MW sizes, and several
              future commissioning dates, but they do not disclose customer count, renewal rates, NRR, GRR, churn,
              service attach, or contract duration. The only durability proxies available are repeat project behavior
              and the continuity of public status updates. Repsol-related sites, P2X, and Ren-Gas suggest some repeat or
              follow-on behavior, and Harjavalta provides one live commercial operating reference. But the evidence base
              is still uneven: the freshest items sit in 2025-2026, while legacy references such as Project Air and
              GrInHy are older and less useful for current underwriting. That freshness split means investors should
              discount older demos unless management can show they still drive active pipeline or revenue today.
              Investors should therefore treat retention as an unresolved private-diligence topic and use public proof
              mainly to rank adoption maturity and freshness, not to infer cohort economics.
