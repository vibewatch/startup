      - number: '2.2'
        title: TAM, SAM, and contradictory sizing lenses
        blocks:
          - type: paragraph
            body: >-
              No single public number can serve as Sunfire’s TAM. Policy sources, market trackers, and industry outlooks
              describe different things: policy ambition, operational capacity, committed projects, announced projects,
              trade flows, and long-run decarbonization scenarios. The European Commission and Observatory still anchor
              Europe around a 20 million tonne 2030 hydrogen ambition, while IEA says government production targets
              globally are 27 to 33 Mtpa versus only about 9.5 Mtpa of government demand targets and roughly 6 Mtpa of
              legislated demand signals. Hydrogen Council offers the clearest adverse cross-check: even after the
              pipeline expanded, only 12 to 18 Mtpa of the 48 Mtpa announced global supply may actually deploy by 2030.
              CINEA’s first Hydrogen Bank auction shows there is genuine project appetite, but bids are not the same
              thing as commissioning. The investable sizing conclusion is therefore lens-based. A broad top-down TAM can
              be described through policy and project-pipeline metrics, but the serviceable market for Sunfire today is
              the narrower pool of European industrial projects that reach FEED, FID, financing, and power access.
