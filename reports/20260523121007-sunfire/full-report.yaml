  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct peers, incumbents, adjacents, and plant-level alternatives
        blocks:
          - type: paragraph
            body: >-
              Sunfire should not be benchmarked only against one stack chemistry. In real industrial tenders it faces
              large alkaline incumbents such as thyssenkrupp nucera and Nel, PEM specialists such as ITM Power and Plug,
              SOEC-focused alternatives such as Topsoe and Bloom, and large integrators that can decouple plant
              execution from stack choice. The practical competitive set therefore depends on the buyer job. If the
              buyer values disclosed installed base, public-company reporting, and large-scale alkaline references,
              nucera and Nel are the benchmark. If the buyer wants PEM dynamics plus listed-company disclosure, ITM and
              Plug matter. If the buyer has steam, waste heat, and downstream e-fuels or ammonia integration, Topsoe and
              Bloom become more relevant. Sunfire’s strategic advantage is that it can participate in both the
              large-project alkaline conversation and the high-efficiency SOEC conversation, but that also means it is
              being compared with more mature single-platform specialists on both sides.
            claimRefs:
