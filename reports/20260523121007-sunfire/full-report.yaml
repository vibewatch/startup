      - number: '8.4'
        title: Entry discipline must be hard, and the thesis breaks on execution or support slippage
        blocks:
          - type: paragraph
            body: >-
              The practical implication is that Sunfire should be treated as a conditional opportunity, not a momentum
              investment. A new investor should either enter below the inferred unicorn mark or receive downside
              protection that compensates for uncertain revenue conversion and capital-stack opacity. The missing
              diligence work is specific. First, management has to open the capital stack: liquidation preferences,
              ratchets, board rights, guarantee covenants, and any senior claims that sit ahead of fresh common equity.
              Second, Sunfire has to show board-grade operating evidence: recognized revenue by project, gross margin by
              product line, unrestricted cash, burn, backlog aging, cancellation rights, advance-payment schedules, and
              warranty exposure. Third, investors need project-level milestone proof for Spain, RWE, P2X, and BASF so
              they can test whether public references are actually moving toward revenue or simply extending the
              timeline. The thesis should be considered broken if one of three things happens: flagship programs slip
              materially, public support mechanisms cease bridging the economics gap, or private diligence shows that
              margins, cash burn, or backlog conversion are materially weaker than the public narrative implies. Those
              are not soft risks. They are direct transmission channels from operating uncertainty into valuation
              compression.
