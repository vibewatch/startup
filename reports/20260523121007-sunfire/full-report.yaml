  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The decision chain runs from capital support and industrial proof through disclosure gaps and public-comp
      de-rating to a research-more recommendation.
    data:
      nodes:
        - id: capital-breadth
          label: Capital breadth is real
          detail: Equity, EIB debt, grants, and guarantees support scale-up
        - id: industrial-proof
          label: Industrial proof exists
          detail: Spain, RWE, P2X, and BASF create real but milestone-dependent upside
        - id: support-dependence
          label: Support dependence remains high
          detail: Public guarantees, IPCEI funding, and subsidy economics still matter
        - id: disclosure-gap
          label: Core valuation inputs are private
          detail: Revenue, gross margin, cash, burn, backlog quality, and preference stack are undisclosed
        - id: peer-derating
          label: Public peers have de-rated
          detail: Nel, ITM, nucera, and Plug show the market is selective and skeptical
        - id: range-not-mark
          label: Use a band, not a mark
          detail: Public evidence supports a range around the inferred unicorn context, not a precise price
        - id: recommendation
          label: Research-more
          detail: Engage only with hard entry discipline and deeper private diligence
      edges:
        - from: capital-breadth
          to: industrial-proof
          label: Funding keeps proof points alive
        - from: industrial-proof
          to: support-dependence
          label: Projects still need policy and partner execution
        - from: support-dependence
          to: disclosure-gap
          label: Support does not replace economics visibility
        - from: disclosure-gap
          to: peer-derating
          label: Opacity matters more in a skeptical market
        - from: peer-derating
          to: range-not-mark
          label: Comparable signals define boundaries
        - from: range-not-mark
          to: recommendation
          label: Entry price and diligence determine the call
    approximationNotes: >-
      This is a decision flow rather than a time-scaled operating model. It shows the logical dependencies that drive
