      - number: '8.2'
        title: The thesis is industrial proof; the anti-thesis is de-rating, subsidy dependence, and opacity
        blocks:
          - type: paragraph
            body: >-
              The constructive case for Sunfire is straightforward. Public sources show real industrial references and a
              technology roadmap that matters to customers: two new 100 MW Spain awards, a third 100 MW tranche for
              RWE’s GET H2 plant, a 40 MW P2X FEED study that can expand if investment proceeds, a larger alkaline
              product claiming lower total installed cost, and a BASF-site SOEC validation facility that can close some
              of the remaining high-temperature proof gap. Those are not trivial signals. They explain why Sunfire can
              plausibly claim strategic relevance rather than mere pilot-stage optionality. The anti-thesis is just as
              clear. The visible growth set is concentrated in a few long-cycle, subsidy-linked projects whose cash
              conversion still depends on later milestones, partner execution, and public-support continuity. Public
              comps also no longer support indiscriminate electrolyzer optimism. Nel, ITM Power, thyssenkrupp nucera,
              and Plug all sit below earlier peak valuations, while their filings disclose revenue pressure, backlog
              conversion risk, cash burn, delayed FIDs, or outright project cancellations. Sunfire’s inferred ~$1.1B
              context therefore lands in a demanding neighborhood: above Nel, near nucera, and not far below ITM,
              despite Sunfire publishing far less revenue, cash, and backlog detail than those listed peers. Private
              financings for Electric Hydrogen and Hystar show that capital is still available to favored hydrogen
              platforms, but they do not solve the pricing problem for a new Sunfire investor. Capital availability is
              evidence of relevance, not proof that the entry price is right.
