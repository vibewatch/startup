        title: Partner, infrastructure, and customer concentration risk
        blocks:
          - type: paragraph
            body: >-
              Sunfire’s commercial proof is strongest where a few named partners trust it with large assets, but that
              same fact creates concentration and dependency risk. The RWE GET H2 phase is a good illustration: Sunfire
              supplies only one 100 MW tranche inside a 300 MW plant, Bilfinger controls ancillary systems and
              integration, the first two large tranches were awarded to Linde and ITM, and the broader economics still
              depend on pipelines, storage, and industrial offtake being built in parallel. The Spain awards are large
              and strategically attractive, but they are concentrated in Repsol-linked refinery ecosystems and do not
              commission until 2029. P2X adds repeat-customer credibility, yet the Joensuu follow-on is still FEED-stage
              and explicitly tied to a later investment decision. In other words, Sunfire has real counterparties, but
              public demand remains concentrated in a narrow set of complex, subsidy-sensitive megaproject archetypes.
              The investment implication is that partner quality is not the same as diversification. If even one or two
              flagship programs slip, Sunfire could face an outsized hit to backlog conversion, factory utilisation, and
