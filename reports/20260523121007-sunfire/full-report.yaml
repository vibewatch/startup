      - number: '7.5'
        title: Financial/model pressure, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Sunfire’s financial-model risk is best understood as a leverage problem on three layers. First, company
              funding is real but support-heavy: equity, venture debt, grants, and public guarantees all help execution,
              but they also show that the business still needs external capital and risk sharing to industrialise.
              Second, the market is oversupplied relative to bankable demand. The World Bank points to manufacturing
              overcapacity, IEEFA and Belfer to weak utilisation risk in the broader hydrogen build-out, and competitor
              filings from Nel, ITM, Topsoe, and Plug show what happens when FIDs slip or factories run below
              load—margins compress, projects cancel, and liquidity pressure rises. Third, Sunfire’s customer projects
              are long-cycle and milestone-driven, so conversion risk is not abstract: delays at RWE, Repsol-linked
              sites, or P2X would flow directly into revenue timing, working capital, and valuation. The mitigation case
              is not empty—Sunfire has repeat customers, a larger-cost-down AEL platform, and policy-aligned capital
              support—but the thesis still breaks if visible flagship projects miss their next milestones or if
              public-support frameworks stop bridging the gap between hydrogen ambition and customer economics.
