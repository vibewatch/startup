            body: >-
              Sunfire's customer-base upside is real, but it is tightly bound to project finance and sector conditions.
              The upside case is visible: standardized alkaline modules have won repeat refinery work, P2X expanded from
              Harjavalta into Joensuu FEED, and Ren-Gas extends the Finnish pipeline. The downside is that this public
              customer pool is concentrated in a handful of very large industrial names and sectors that share similar
              dependencies on subsidy design, offtake certainty, and infrastructure readiness. Independent 2026 market
              sources argue that hydrogen projects stall when policy and offtake do not line up, that RFNBO rules raise
              costs, and that too few projects reach FID. For Sunfire, that means customer concentration risk is not
              only about a few counterparties; it is also about a few correlated project archetypes. The most important
              conclusion is that Sunfire has credible named demand, especially for AEL, but converting that demand into
