      - number: '1.3'
        title: Funding, Investors, and Capital Support
        blocks:
          - type: paragraph
            body: >-
              Sunfire's capital story is now one of the clearest pieces of the company overview. In March 2024 the
              company disclosed a €215 million Series E round, an EIB venture-debt line of up to €100 million for SOEC
              commercialization, and roughly €200 million of previously approved undrawn grant funding. New money came
              from LGT Private Banking, GIC, Ahren Innovation Capital, and Carbon Equity, while existing backers
              including Lightrock, Planet First Partners, Carbon Direct Capital, Amazon's Climate Pledge Fund, and Blue
              Earth Capital increased their commitments. In January 2025, Sunfire added a separate €200 million
              guarantee-financing line backed by a Commerzbank-led bank syndicate and public guarantees from Germany and
              Saxony. That facility is especially important because it is designed to secure advance payments, contract
              performance, and warranty obligations without tying up cash. The public record therefore supports strong
              capital access and policy-backed execution capacity, but it still does not expose a current valuation,
              lifetime capital raised since founding, or a clean control map behind the financing stack.
