      - number: '7.2'
        title: Regulatory, subsidy, and legal execution risk
        blocks:
          - type: paragraph
            body: >-
              For Sunfire, legal and regulatory risk is less about a documented public lawsuit and more about whether
              projects can clear a tightening qualification stack fast enough to become economic. The retained legal
              sources show that RFNBO qualification is now governed by delegated EU rules on greenhouse-gas accounting
              and by certification systems such as REDcert and ISCC that require compliant renewable-power sourcing,
              Guarantees of Origin logic, cross-border electricity treatment, and audit-ready documentation. Those rules
              matter because Sunfire’s most visible refinery and transport-adjacent use cases need hydrogen to qualify
              under customer and policy frameworks, not merely to work technically. The same problem sits one layer
              higher at market level: ERCST calls EU hydrogen policy overly regulatory, while Germany’s federal auditors
              say the national ramp is behind plan despite billions in support. Public sources reviewed for this chapter
              did not surface an active Sunfire-specific litigation or enforcement matter, so the legal emphasis should
              stay on subsidy design, certification readiness, and implementation timing rather than on invented dispute
              risk. Investors should therefore treat compliance execution and public-support continuity as gating
              variables for demand conversion, not as minor back-office tasks.
