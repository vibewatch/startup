  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Sunfire does not participate in the whole hydrogen economy; it sells large industrial electrolyzer systems
              and related integration for projects that want to substitute fossil-based hydrogen or fossil fuels inside
              existing industrial workflows. The retained evidence points to a market centered on large green-hydrogen
              plants for refineries, industrial hubs, project developers, steel and chemical decarbonization, and
              e-methanol or e-fuels platforms. That means the relevant spend includes stacks, modules, power
              electronics, process integration, commissioning, and project-engineering scope close to the electrolyzer
              itself, but excludes merchant gas distribution, long-distance pipelines, caverns, retail fueling, and most
              downstream synthesis assets. The substitute set is also broader than grey hydrogen alone: refinery
              operators can keep using conventional hydrogen, steelmakers can stay with coal-based or gas-based routes,
              and many industrial users can prioritize efficiency, recycling, carbon capture, or electrification before
              hydrogen. Sunfire’s two technology families make this boundary narrower still. SOEC is strongest where
              waste heat or steam are available, while pressurized alkaline appears best aligned with large module-based
              baseload projects.
            claimRefs:
