      - number: '5.2'
        title: Operating architecture, integration model, and service workflow
        blocks:
          - type: paragraph
            body: >-
              Sunfire does not publicly publish full P&IDs, control architecture diagrams, or software stack
              documentation, but the retained source pack still reveals a lot about how the product is delivered. At the
              plant level, Sunfire's module is only one part of a broader operating system that includes water handling,
              hydrogen treatment, compression, drying, controls, hydrogen processing units, EPC coordination, and
              site-specific commissioning. The 50 MW alkaline launch shows the company trying to simplify this
              architecture by centralizing key plant components, increasing prefabrication, integrating air cooling as
              standard, and reducing the number of modules required in a 100 MW build from ten to two. That is less a
              chemistry story than a construction-and-integration story.


              The contrast with SOEC is equally important. MultiPLHY and GrInHy2.0 show that Sunfire's high-temperature
              product depends much more explicitly on heat, steam, hydrogen processing, and host-site integration into
              refinery or steel networks. Sunfire is not doing all of that alone: RWE discloses Bilfinger on ancillary
              systems and controls, while MultiPLHY relies on Paul Wurth/SMS for hydrogen processing and on Neste for
              refinery integration. Service is then productized as data-driven monitoring, preventive maintenance,
              repairs, and spare parts. The practical conclusion is that Sunfire's public architecture is modular but
              not self-contained. The product is bankable only when Sunfire's electrolysis modules are matched with
              capable integration partners, host-site utilities, and long-term service support.
