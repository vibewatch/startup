      - number: '3.4'
        title: Substitutes, internal build, and when buyers can still switch
        blocks:
          - type: paragraph
            body: >-
              Sunfire also competes against choices that are not a direct one-for-one OEM peer. DOE’s electrolysis
              overview is a reminder that electricity cost and grid conditions still govern project economics, so grey
              hydrogen, other decarbonization pathways, or delayed investment remain real substitutes for many
              industrial budgets. EPC-led delivery creates another substitute path. Large buyers can source feasibility,
              FEED, engineering, and plant integration separately, which reduces any single OEM’s ability to own the
              entire plant architecture. That means switching costs are moderate early and high later. Before FEED is
              locked, customers can multi-home, run technical bake-offs, and force price discovery. After detailed
              engineering, permits, module footprints, and service assumptions are embedded in the project, changing
              stack vendors becomes far more disruptive. Sunfire therefore benefits when it enters early enough to shape
              the process design and long-term service model, not just when it shows up as a late hardware quote.
