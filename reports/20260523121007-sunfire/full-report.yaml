  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk stack and residual exposure
        blocks:
          - type: paragraph
            body: >-
              Sunfire is not facing a single binary failure mode; it is carrying a correlated stack of project-market
              risks that compound. The highest residual exposure is demand conversion: public evidence from RMI, Belfer,
              IEEFA, and Germany’s federal auditors all points to a market where policy ambition, subsidy budgets,
              infrastructure build-out, and bankable offtake are still misaligned. That matters because Sunfire’s
              visible growth cases—RWE, Repsol-linked refinery work, and P2X follow-ons—are exactly the kinds of large
              industrial programs that monetise only after final investment decisions, ancillary-system integration, and
              policy-backed economics line up. The second tier of risk is capital intensity and execution. EIB’s own
              project sheet explicitly frames Sunfire as a high-risk venture with high financing needs and a nascent
              supply chain, while peer filings show that low factory utilisation and delayed FIDs are already hurting
              industry economics. The third tier is technical-commercial readiness in SOEC, where Sunfire has a real
              mitigation path but not a solved field-risk story. The practical investment implication is that Sunfire
              remains fundable and credible, but only if investors treat scale-up as a milestone-gated infrastructure
              thesis rather than as a smooth equipment-growth curve.
