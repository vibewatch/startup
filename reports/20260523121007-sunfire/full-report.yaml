        title: Milestones, Industrial References, and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              Sunfire now has enough industrial references to support a real scale-up narrative, but the chapter still
              needs explicit caution flags. RWE's 100 MW Lingen award, Repsol's two 100 MW Spain projects, and the
              MultiPLHY startup at Neste's Rotterdam refinery show commercial traction across both alkaline and SOEC
              platforms. The company also used the RWE announcement to disclose an order backlog of more than 800 MW,
              and the 2026 HyLink Alkaline 23 launch shows the company still pushing product architecture toward larger
              standardized modules. The most important negative signal is not a single failed project in the retained
              pack; it is the economics and disclosure context around scale-up. Sifted highlights green hydrogen's
              continued dependence on energy input and state aid, while Energy News warns that Sunfire's 50%
              cost-reduction narrative should not be generalized across projects. Public KPI coverage is also
              incomplete: headcount markers differ by source and date, and valuation, revenue or ARR, and customer count
              remain undisclosed in the retained public record.
