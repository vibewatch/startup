  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Sunfire’s public customer journey usually moves from industrial use-case framing to engineering or order
      commitment, then into construction or commissioning, with only a minority of accounts reaching public commercial
      operation.
    data:
      items:
        - actor: Refinery sponsor or JV
          touchpoints:
            - Site-level decarbonization target
            - Supplier selection for large AEL package
            - Refinery integration plan and commissioning target
            - Potential repeat order at second site
          emotion: Needs large hydrogen volumes and bankable industrial execution
          painpoint: Long lead times and capex-heavy economics make every project sensitive to subsidy and offtake assumptions
          opportunity: One successful site can expand into additional refinery locations
          label: Refinery expansion
        - actor: Utility or hydrogen-hub developer
          touchpoints:
            - Pilot or early phase
            - FID milestone
            - 100 MW equipment award
            - Pipeline and storage integration
          emotion: Wants bankable modules that fit broader infrastructure buildout
          painpoint: Sunfire is only one layer in a multi-partner delivery chain
          opportunity: A proven 100 MW phase can unlock additional increments
          label: Hub-scale procurement
        - actor: Hydrogen project developer
          touchpoints:
            - Initial stack delivery
            - Construction and commissioning
            - Commercial operation
            - Follow-on FEED or second-site planning
          emotion: Values an OEM that can move from first plant to expansion project
          painpoint: Project development cycles are slow and customer economics stay private
          opportunity: Harjavalta-to-Joensuu and Tampere show a repeatable Nordic motion if projects finance
          label: Developer repeat cycle
        - actor: Industrial SOEC host
          touchpoints:
            - Demo or pilot selection
            - Industrial integration with heat or hydrogen processing
            - Validation campaign
            - Decision on larger rollout
          emotion: Interested in efficiency gains where waste heat exists
          painpoint: Most proof is still experimental or pilot-led rather than contractually repeated
          opportunity: Successful long-duration validation could convert into future commercial modules
          label: SOEC validation path
        - actor: Post-installation operator / service buyer
          touchpoints:
            - Commissioning
            - Performance monitoring
            - Spare parts and maintenance
            - Renewal or additional site order
          emotion: Would value uptime and predictable support once the plant is live
          painpoint: Public sources rarely disclose service terms, uptime, or renewal behavior
          opportunity: Service attach could become a durability bridge if Sunfire proves installed-base performance
          label: Durability gap
    approximationNotes: >-
      The journey map is synthesized from named project sequences in public sources; it is not an internally published
      sales-process diagram.
