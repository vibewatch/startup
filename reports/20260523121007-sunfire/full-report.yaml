            body: >-
              Sunfire's leadership record is strongest around the founders and current management board, and weakest
              around deeper control detail. Official and third-party reporting support a 2010 founding by Nils Aldag,
              Christian von Olshausen, and Carl Berninghausen. A material leadership transition occurred in November
              2020, when Aldag moved into the CEO role and Berninghausen shifted from CEO to supervisory-board chair,
              while new COO and CFO roles were added to help industrialize the business. Today's imprint shows a
              different formal management board: Aldag, von Olshausen, Frank Posnanski, and Jens Henneberg, with Dr.
