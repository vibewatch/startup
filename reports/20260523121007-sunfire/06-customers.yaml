chapter:
  number: 6
  title: Customers
  summary: Sunfire has credible named industrial customers and project owners, with alkaline references now extending from one live commercial plant at P2X Harjavalta to multiple 100 MW signed orders at RWE and Repsol-related sites. The customer base is still concentrated in a small set of capex-heavy refinery, utility, and hydrogen-project accounts, while most SOEC proof remains pilot or demonstration-led. Public evidence is strong enough to prove adoption quality, but too thin to underwrite retention, customer count, or concentration quantitatively.
sections:
- id: customer-segmentation-and-reference-types
  title: Customer segmentation and what the named logos actually are
  body: 'Sunfire''s customer base should be framed as a concentrated industrial project book rather than a broad recurring-account base. The named counterparties in public sources cluster into a few heavy-industry segments: refinery decarbonization buyers such as Repsol-related sites and TotalEnergies-linked projects; utility or hydrogen-hub developers such as RWE and Uniper-led consortia; dedicated hydrogen project developers such as P2X Solutions and Ren-Gas; and industrial hosts such as Neste, Salzgitter, and BASF that validate SOEC use cases. This matters because buyer, host, and user are often different entities. In several references, Sunfire sells electrolysis equipment into a consortium or project company while the end user is a refinery or industrial plant. The practical takeaway is that Sunfire has real named industrial relationships across several European verticals, but they are not interchangeable. AEL references align more with commercial orders and one operating plant, while
    SOEC references align more with demonstration, validation, and host-site learning.'
