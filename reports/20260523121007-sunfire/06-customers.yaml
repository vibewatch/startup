  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table
    missingEvidence: A complete customer ledger showing every operating plant, signed order, FEED study, pilot, and inactive reference would close the enumeration gap.
    whyItMatters: Public sources enumerate only named projects, so concentration and installed-base breadth cannot be measured reliably from the outside.
    diligencePath: Request the current customer list by status, MW, sector, geography, and contract phase, then reconcile it to backlog and service data.
    relatedQuestionRefs:
    - QU013
    - QU020
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: NRR, GRR, churn, average contract term, service attach, and renewal cohorts by customer type remain private.
    whyItMatters: Without real retention metrics, public named-customer proof cannot be translated into durable revenue quality.
    diligencePath: Request customer-cohort reporting and service-renewal data for AEL and SOEC accounts as a pre-investment diligence item.
    relatedQuestionRefs:
    - QU016
    - QU017
    - QU028
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, backlog concentration, and sector mix by revenue are not public.
    whyItMatters: The visible customer set is concentrated enough that one or two delayed projects could change the revenue profile materially.
    diligencePath: Obtain a top-10 customer schedule with revenue, backlog, stage, payment milestones, and cancellation rights.
    relatedQuestionRefs:
    - QU020
    - QU021
    - QU028
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: operating-outcomes
    missingEvidence: Independent utilization, uptime, output, and customer-satisfaction data for operating references such as Harjavalta are missing.
    whyItMatters: Commercial operation matters more when it is accompanied by evidence on reliability, realized production, and customer economics.
    diligencePath: Request plant-level operating KPIs, availability data, and customer reference calls for Harjavalta and any other live systems.
    relatedQuestionRefs:
    - QU007
    - QU028
  - type: stale
    severity: minor
    topic: legacy-soec-references
    missingEvidence: Fresh operating-status updates for older references such as Project Air and GrInHy are limited compared with newer 2025-2026 proof points.
    whyItMatters: Older references can overstate current commercial traction if their present status is not refreshed.
    diligencePath: Ask management to refresh the status, lessons learned, and current commercial relevance of every pre-2025 SOEC reference.
    relatedQuestionRefs:
    - QU018
    - QU026
