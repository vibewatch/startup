- id: adoption-trajectory-and-named-proof
  title: Adoption trajectory and named customer proof quality
  body: The adoption story is strongest when Sunfire's references are sorted by proof quality instead of by logo count. P2X Harjavalta is the clearest public production proof because the plant is operating commercially and multiple sources describe it as Finland's first industrial green hydrogen plant. RWE's GET H2 phase and the two 100 MW Spain projects show signed, large-scale alkaline orders with explicit MW, integration context, and commissioning targets, but they are still pre-operation. Ren-Gas adds another substantial AEL contract, yet its Tampere project remains phased and pre-production. On the SOEC side, Nesta's MultiPLHY startup, TotalEnergies-related e-CO2Met work, GrInHy, BASF, and Project Air prove industrial interest and technology fit, but most of them are still demonstrations, pilots, or development references rather than scaled repeat commercial deployments. The diligence distinction is therefore production versus pilot, not merely named versus unnamed.
