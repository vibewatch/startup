- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration or friction
  - Impact
  - Evidence
  - Diligence path
  rows:
  - - Refinery follow-on orders
    - Visible value is concentrated in a few refinery-linked names
    - High upside if repeat sites convert; high concentration if one refiner slows capex
    - Repsol-related Bilbao, Cartagena, and Muskiz path
    - Request top-customer backlog share and refinery-sector exposure
  - - Finnish developer cluster
    - P2X and Ren-Gas create geographic momentum but also country concentration
    - Medium-high upside with repeat AEL references
    - Harjavalta operation, Joensuu FEED, Tampere contract
    - Check offtake contracts, permitting, and grid-power assumptions for Finnish projects
  - - Standardized AEL modules
    - Commercial orders still require FID, balance-of-plant, and customer financing
    - Large potential scale but long conversion cycle
    - RWE post-FID order and multi-year Harjavalta timeline
    - Review sales funnel by stage and average time from order to operation
  - - SOEC differentiation
    - Most named SOEC hosts are demos or pilots, not recurring commercial fleets
    - Good technology positioning but weaker revenue visibility
    - Neste, BASF, GrInHy, TotalEnergies-linked references
    - Demand repeat commercial SOEC orders and degradation / service data
  - - Hydrogen-hub / consortium channels
    - Partner dependencies on pipelines, storage, and auxiliaries dilute customer control
    - Execution risk rises even when customer interest is real
    - Bad Lauchstädt, GET H2, RWE/Bilfinger integration
    - Map partner responsibilities and delay liabilities per project
  - - Sector policy and offtake backdrop
    - Hydrogen projects can stall when subsidy rules, bankability, or offtake remain uncertain
    - Customer conversion risk affects the whole visible pipeline
    - Wood Mackenzie, Tamarindo, WEF, Hydrogen Insight
    - Stress-test backlog against delayed FIDs, weaker offtake, and subsidy changes
  notes: 'Expansion pathways are real, but the public evidence points to correlated risk: the same policy, offtake, and project-finance bottlenecks touch many of Sunfire’s named customers at once.'
