tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Named counterparties
  - Use case
  - Scale / status
  - Revenue or strategic value
  - Gap
  rows:
  - - Refinery decarbonization buyers
    - Buyer/user often refinery operator; payer tied to project sponsor or JV
    - Repsol Cartagena; Petronor/Repsol Muskiz; TotalEnergies-linked Leuna; Neste Rotterdam
    - Replace fossil hydrogen and support lower-carbon refining or fuels
    - Mix of signed 100 MW orders, commissioning-stage supply, and demo SOEC
    - Largest disclosed MW and clearest route to industrial hydrogen demand
    - No public contract economics, utilization, or renewal terms
  - - Utility / hydrogen-hub developers
    - Buyer often utility or JV; user can be downstream industry
    - RWE GET H2 Nukleus; Uniper / VNG / GET H2; Project Air
    - Build hydrogen production hubs and connect to industrial users
    - 100 MW signed order plus commissioning-stage and legacy project references
    - Supports bankability and large-project credibility
    - Project execution depends on ancillary systems, storage, and pipeline buildout
  - - Commercial hydrogen developers
    - Buyer and operator are dedicated hydrogen developers
    - P2X Solutions Harjavalta; P2X Solutions Joensuu; Ren-Gas Tampere
    - Produce merchant or contracted green hydrogen and e-methane
    - One 20 MW commercial plant, one 40 MW FEED, one 50 MW contract
    - Best public proof of repeat relationship and operating AEL plant
    - Customer count remains small and project timelines remain long
  - - Industrial SOEC demo hosts
    - Host site provides industrial context; supplier and consortium share risk
    - Neste MultiPLHY; Salzgitter GrInHy2.0; BASF Schwarzheide
    - Validate high-temperature electrolysis in refinery, steel, and chemicals settings
    - Demo, pilot, or validation stage
    - Shows differentiated SOEC fit in heat-integrated use cases
    - Does not yet prove repeat commercial SOEC volume or durability
  - - Consortium / infrastructure partners
    - Buyer and user split across project company, offtaker, and infrastructure owners
    - Energiepark Bad Lauchstädt; GET H2; Uniper / VNG partners
    - Test full hydrogen value chain from production to transport and use
    - Industrial-scale real-world laboratory and commissioning phase
    - Extends Sunfire into infrastructure-led ecosystems
    - Counterparty exposure is diluted across consortium structure and policy support
  notes: Rows group named counterparties by who appears to buy, host, or use the system publicly; they do not imply a broad customer-account count or recurring revenue base.
