    - RWE 100 MW plus Spain 2x100 MW
    - Visible and corroborated
    - Supports commercial relevance and enterprise GTM
    - Request contract value split, milestone schedule, and counterparty obligations
  - - Industrial references
    - Neste/MultiPLHY startup and P2X repeat partnership
    - Visible and corroborated
    - Improves bankability narrative
    - Provide installed base by status and performance guarantees achieved
  - - Recognized revenue
    - null
    - Unavailable publicly
    - Cannot underwrite historical scale or growth
    - Obtain audited financial statements or management accounts
  - - ARR or recurring revenue
    - null
    - Unavailable publicly
    - Prevents any recurring-revenue underwriting lens
    - Provide service ARR, contract duration, and renewal rates if relevant
  - - Current cash / burn / runway
    - null
    - Unavailable publicly
    - Capital adequacy cannot be judged from internally generated liquidity
    - Provide latest balance sheet, monthly burn, and runway model
  - - Gross margin / product profitability
    - null
    - Unavailable publicly
    - Margin path remains inferential
    - Provide gross margin by product line and service gross margin
  - - Realized pricing / discounting
    - null
    - Unavailable publicly
    - No direct view on unit economics or competitive pricing discipline
    - Provide order-level ASPs, discount bands, and payment terms
  - - Customer concentration
    - null
    - Unavailable publicly
    - Large-project risk may be concentrated in a few industrial accounts
    - Provide top-customer revenue share and backlog concentration
  notes: Null means the retained public pack did not disclose a supportable figure. The table intentionally preserves gaps instead of backfilling invented numbers.
