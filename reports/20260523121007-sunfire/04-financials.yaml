chapter:
  number: 4
  title: Financials
  summary: Sunfire’s public financial picture is better evidenced on financing access, project awards, and working-capital support than on recognized revenue, margin, or cash generation. The company appears capital-enabled to pursue large industrial orders, but underwriting still depends on project FIDs, subsidy-backed economics, and a much deeper private diligence package on revenue, gross margin, burn, and realized pricing.
sections:
- id: commercial-model
  title: Revenue model and what public traction actually proves
  body: 'Public materials support a revenue model built around industrial electrolyzer projects, not a clean recurring-software story. Sunfire’s visible monetization surfaces are equipment sales for large alkaline and SOEC systems, pre-award engineering work, and lifecycle service. The clearest proof is project-specific: RWE commissioned a 100 MW alkaline system after its project FID, Repsol-linked refinery projects add two more 100 MW plants, MultiPLHY created an industrial SOEC reference at Neste, and P2X awarded Sunfire a FEED study before a later investment decision. Those facts support commercial relevance and a project-led sales motion, but they do not translate into disclosed revenue or ARR. Sunfire also cites an order book above 800 MW, which helps on traction, yet public evidence still stops short of recognized revenue, revenue mix by product line, or timing of conversion from order to booked sales. Underwriting should therefore treat MW awards and references as demand signals,
    not as substitutes for audited financial performance.'
