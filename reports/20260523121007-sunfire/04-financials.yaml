  title: The main underwriting problem is conversion, not the absence of announced demand
  body: Sunfire can point to backlog, repeat customers, and named industrial projects, but sector evidence still shows delayed FIDs, financing-dependent installations, and subsidy-sensitive demand. Revenue timing is therefore the key financial risk.
