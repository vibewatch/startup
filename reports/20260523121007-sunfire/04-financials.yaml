- id: TI004
  title: Unit economics and margin drivers table
  columns:
  - Driver
  - Public signal
  - Gross-margin effect
  - Cash-flow effect
  - Diligence ask
  rows:
  - - Manufacturing scale-up
    - PtJ cites ~€263m Saxony investment and ~€162m grant notice
    - High fixed-cost absorption risk until volume rises
    - High capex and ramp-cost burden
    - Provide current plant utilization and capex remaining by site
  - - Balance-of-plant cost pressure
    - S&P says cost inflation since 2021 is material and future declines are incremental
    - Compresses margin if customer ASPs do not keep pace
    - Raises working capital for standard equipment and installation
    - Break out stack vs balance-of-plant cost mix
  - - Compression and downstream equipment
    - 30 bar alkaline design reduces compression needs
    - Potential customer cost advantage and scope simplification
    - Could reduce installed-system working capital
    - Show measured compression-equipment savings by project
  - - Civil works / buildings / HVAC
    - Sunfire markets outdoor installation and centralized key components
    - Potential lower installed-system cost base
    - Could reduce project cash needs and schedule risk
    - Provide before/after bill-of-materials evidence versus prior generation
  - - SOEC energy efficiency
    - Sunfire markets 89% LHV and 25-30 ppt efficiency advantage with steam
    - Could support better customer economics in heat-integrated use cases
    - May depend on site-specific steam availability and integration spend
    - Provide site-level energy-balance and realized operating-cost data
  - - Service tail and spares
    - Monitoring, maintenance, repairs, and spare parts are offered
    - Could lift blended gross margin after installation
    - Lower working-capital demand than first-time equipment revenue
    - Disclose service contract penetration and gross margin
  - - Warranty and performance obligations
    - Guarantee line covers warranty obligations and advance payments
    - May protect bookings but can pressure reserves if field performance slips
    - Directly affects collateral and working-capital needs
    - Disclose warranty reserve methodology and claims experience
  notes: Gross-margin effects are inferred because Sunfire does not publish product-line margins. The table focuses on what the public record says about the drivers, not on invented percentages.
