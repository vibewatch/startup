tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Public evidence
  - Revenue quality
  - Diligence ask
  rows:
  - - Large-project electrolyzer hardware
    - Sale of alkaline or SOEC systems into named industrial projects
    - RWE 100 MW, Spain 2x100 MW, MultiPLHY industrial SOEC reference
    - Likely milestone-based and lumpy
    - Provide recognized revenue by project and revenue-recognition policy
  - - Pre-award engineering / FEED
    - Engineering scope before full EPC or equipment award
    - P2X awarded Sunfire a FEED study for Joensuu 40 MW
    - Early commercial signal but not equivalent to booked product revenue
    - Show FEED revenue size, margin, and conversion rate to equipment orders
  - - Installation / integration scope
    - Delivery plus plant integration and commissioning dependencies
    - RWE pairs Sunfire with Bilfinger for auxiliary and ancillary systems
    - Revenue timing likely depends on project milestones and acceptance
    - Disclose scope split between Sunfire, partners, and EPC contractors
  - - Lifecycle services
    - Monitoring, preventive maintenance, repairs, spare parts
    - Sunfire service page lists lifecycle support offerings
    - Could support higher-quality follow-on revenue
    - Provide installed base under service contract and annual service attach rate
  - - Warranty-backed execution support
    - Contract support and warranty obligations linked to guarantee line
    - Guarantee financing explicitly secures advance payments and warranty obligations
    - Supports order execution but is not operating revenue
    - Provide warranty reserve policy and cash collateral requirements
  - - Repeat-customer follow-ons
    - Repeat awards from proven counterparties
    - Repsol selected Sunfire again; P2X expanded into new FEED scope
    - Good signal on sales efficiency but not a revenue metric
    - Show repeat-order share of pipeline and close rates by stage
  notes: This table distinguishes visible revenue mechanisms from disclosed revenue amounts. Sunfire’s public materials show where money could come from, but not how much has been recognized.
