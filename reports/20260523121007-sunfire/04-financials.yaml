- id: pricing-and-sales-motion
  title: Pricing model, contract packaging, and sales-efficiency proxies
  body: 'Sunfire does not publish list prices or realized selling prices in the retained public pack. Instead, it sells outcomes: lower total plant capex, lower total installed cost, lower compression needs, and lower LCOH where steam integration helps SOEC. That matters because the GTM motion looks enterprise and project-specific, with long cycles shaped by FEED, FID, permitting, and customer financing rather than by a fast inside-sales funnel. The best public sales-efficiency proxies are repeat scope and repeat counterparties, not CAC or payback. Repsol selected Sunfire again for Spain, P2X moved from Harjavalta operations into a new FEED scope, and RWE’s award arrived only after its project financing milestone. Even the RWE contract value is disclosed only as being in the low hundred-million-euro range. The practical conclusion is that Sunfire likely wins on bankability, process fit, and engineering credibility, but outside investors still cannot see realized ASPs, discounting, or formal
    sales productivity metrics.'
