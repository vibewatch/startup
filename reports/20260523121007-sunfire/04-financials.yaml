- id: TI007
  title: Listed-peer conversion and disclosure proxies
  columns:
  - Public comp signal
  - Reported value or statement
  - Why it matters for Sunfire
  - Caveat
  rows:
  - - ITM revenue
    - £26.0m FY2025 revenue
    - Shows how small reported revenue can remain even for a listed electrolyzer OEM
    - PEM peer, not Sunfire’s exact mix
  - - ITM EBITDA
    - £33.0m adjusted EBITDA loss
    - Indicates cash burn can persist even with public backlog and installed references
    - Loss metric is company-specific and not directly transferable
  - - ITM cash
    - £207m year-end cash
    - Public peers disclose liquidity explicitly, unlike Sunfire
    - Cash alone does not prove sustainable economics
  - - ITM backlog
    - £145.1m contracted backlog
    - Backlog disclosure helps benchmark how transparent a listed peer can be
    - Backlog definitions differ by company
  - - Nel revenue
    - NOK 963m in 2025
    - Shows listed peers can still see revenue decline despite project activity
    - Different geography and product mix
  - - Nel cash
    - NOK 1,617m year-end cash
    - Highlights the cash transparency missing for Sunfire
    - Cash is not the same as runway without burn context
  - - Nel backlog
    - NOK 1,319m order backlog
    - Illustrates how public backlog can be disclosed without implying smooth conversion
    - Backlog does not equal revenue
  - - Topsoe market update
    - FIDs postponed and some projects cancelled
    - Supports caution on revenue timing across the sector
    - Topsoe is more diversified than Sunfire
  - - Plug installation risk
    - Customer financing delays can push installations and create revenue shortfalls
    - Useful analog for project-based revenue-recognition lag
    - Plug has a broader integrated hydrogen model
  - - Plug subsidy risk
    - Reduced subsidies could hit demand, revenue, and liquidity
    - Reinforces subsidy dependency risk for OEM demand
    - Risk-factor language is precautionary and broad
  notes: These rows are sector proxies, not direct Sunfire metrics. They are used to frame what public listed peers disclose and where order-to-revenue conversion risk typically appears.
