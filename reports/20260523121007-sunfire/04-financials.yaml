- id: traction-vs-private-gaps
  title: Public traction versus private financial gaps
  body: 'Sunfire looks far better disclosed on external traction than on internal financial performance. Public sources identify large project awards, a backlog claim above 800 MW, repeat refinery-linked business in Spain, an industrial SOEC startup at Neste, and a repeat development path with P2X. That is enough to support a view that Sunfire is commercially relevant in industrial hydrogen. What remains missing are the numbers an underwriter would usually want first: recognized revenue, ARR, current cash, burn, runway, gross margin, customer concentration, and realized price or discount terms. The contrast becomes sharper when compared with listed peers. ITM, Nel, Topsoe, and Plug all disclose some combination of revenue, cash, backlog, delayed FIDs, or revenue-recognition risk in filings. Sunfire’s opacity does not mean the business is weak, but it does mean public diligence has to infer economics from project wins, grant notices, product claims, and peer analogies rather than from audited
    financial statements.'
