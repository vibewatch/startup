  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure-gap
    missingEvidence: Audited 2025 and latest-trailing-period recognized revenue, revenue mix by product line, and any ARR-like service revenue disclosure.
    whyItMatters: Without recognized revenue and mix, it is impossible to test whether MW awards and engineering wins are converting into bankable financial scale.
    diligencePath: Request audited financial statements, management accounts, and project-level revenue-recognition schedules from management or investors.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-disclosure-gap
    missingEvidence: Latest balance sheet, current cash balance, monthly burn, planned capex, covenant headroom, and runway model.
    whyItMatters: Public funding access does not reveal whether Sunfire can self-fund delays, warranty events, or slower order conversion.
    diligencePath: Request board reporting pack with monthly cash bridge, debt/grant draw schedules, and base / downside runway assumptions.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI006
  - type: private-evidence-only
    severity: blocking
    topic: margin-disclosure-gap
    missingEvidence: Gross margin by alkaline, SOEC, engineering, and service lines plus warranty reserve and field-failure history.
    whyItMatters: Sunfire’s public story rests on lower installed cost and efficiency, but those claims do not show whether the company itself earns attractive margins.
    diligencePath: Request product-line gross margin walk, reserve accounting policy, and post-commissioning service economics.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: Order-level ASPs, discount bands, payment terms, milestone schedules, and evidence of how TIC claims affect realized pricing.
    whyItMatters: Without realized pricing, investors cannot tell whether Sunfire captures cost-down benefits itself or passes them through to win projects.
    diligencePath: Review sample contracts, bid summaries, and pricing committee materials for recent large projects.
    relatedQuestionRefs:
    - QI017
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, backlog concentration, warranty reserve by project, and working-capital exposure by counterparty.
    whyItMatters: Large-project businesses can look de-risked in public while still depending heavily on a small number of counterparties or concentrated warranty risk.
    diligencePath: Request customer concentration analysis, backlog aging, advance-payment schedules, and reserve roll-forwards by major project.
    relatedQuestionRefs:
    - QI026
    relatedTableRefs:
    - TI005
    - TI006
