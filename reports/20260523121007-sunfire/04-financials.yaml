  title: Capital access is real even if internal liquidity is opaque
  body: Public sources support a large 2024 financing package, grant-backed manufacturing support, and a 2025 guarantee facility that directly helps execute customer projects. That is materially better evidence on capital access than on internal cash generation.
  claimRefs:
