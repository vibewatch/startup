- id: capital-adequacy-and-financing-dependency
  title: Capital adequacy, working capital, and financing dependency
  body: Sunfire’s strongest public financial evidence is on access to capital rather than on internally generated cash. The 2024 package combined €215 million of equity, up to €100 million of EIB venture debt, and roughly €200 million of previously approved undrawn grant funding. The 2025 guarantee line adds another €200 million of execution support and is especially important because it secures advance payments, contract fulfilment, and warranty obligations without tying up Sunfire cash as collateral. That helps working capital, but it does not reveal cash on hand or extend a disclosed runway. The adverse case is that sector-wide delays, subsidy dependence, and slow FID conversion still govern whether large announced projects become recognized revenue. IEEFA’s critique of infrastructure spending ahead of confirmed demand and peer filing language on postponed projects or customer financing delays reinforce that point. Sunfire appears capital-supported enough to pursue large projects, but
    continued underwriting still depends on policy-backed project economics and much deeper private financial disclosure.
