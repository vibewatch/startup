- id: cost-structure-and-margin-drivers
  title: Cost structure and gross-margin drivers
  body: 'The public record gives a useful map of cost drivers even though Sunfire does not disclose gross margin. PtJ’s grant notice shows the company still needs large manufacturing-scale capex, with roughly €263 million of Saxony investment and a €162 million funding notice under Sunfire 1500+. S&P adds the industry context: only a small share of announced projects has reached positive FID, electrolyzer costs are still above 2021 levels, and expected cost declines by 2030 are modest because more spend sits in balance-of-plant equipment rather than in stacks alone. Sunfire’s product messaging is targeted exactly at those pressure points, emphasizing outdoor installation, centralized key components, and lower downstream compression requirements for alkaline, plus steam-enabled efficiency for SOEC. Those are plausible margin and customer-cost levers, but they remain company claims. Until Sunfire discloses actual cost absorption, warranty reserves, or service gross profit, the safest conclusion
    is that margin improvement depends on scale, standardization, and project execution discipline more than on chemistry alone.'
