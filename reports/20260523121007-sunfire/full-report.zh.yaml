      - - 在工业场址安装大规模碱性电解产能
        - 买方必须选择模块尺寸、规划土建，并集成辅助系统
        - HyLink Alkaline 22/23 加安装和调试支持
        - RWE 和西班牙案例显示，100 MW 设计逻辑可重复
        - 工厂辅助系统和业主现场复杂度仍是外部依赖
      - - 利用废热或蒸汽降低电力需求
        - 工业业主需要热源、蒸汽处理和气体调理
        - Sunfire HyLink SOEC 面向高温、热集成用例
        - MultiPLHY 和 GrInHy 显示炼厂、钢铁场景集成，并给出更高效率声称
        - SOEC 证据仍取决于工业示范和耐久性跟进
      - - 将氢处理成工厂可用气体，并接入现场运营
        - 氢气必须压缩、干燥、处理，并接入既有网络
        - Sunfire 模块搭配氢处理单元和集成伙伴
        - Salzgitter 和 Neste 显示，其方案可接入业主工业系统
        - Sunfire 未公开披露每个接口或控制责任
      - - 在工厂寿命期内维持产出
        - 运营方需要监控、预防性服务、备件和电堆策略
        - Sunfire 对外推介带数据驱动监控的全生命周期服务
        - 服务方案意味着持续运营介入，而非一次性交付
        - 未公开正常运行时间、MTBF 或电堆更换成本指标
