  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标 / 估值状态
      - 重要性
      - 对 Sunfire 的含义
      - 局限
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the most decision-useful public and private valuation references retained for this chapter as of
        2026-05-23: Sunfire’s own inferred unicorn context, listed electrolyzer peers, and two private funding
        comparables. The set is partial because recent private transaction marks for closely comparable electrolysis
        companies remain largely undisclosed.
    rows:
      - - Sunfire（推断语境）
        - 2023 年据报道达到 ~€1B 独角兽门槛；本章仅把约 USD 1.1B 用作推断语境
        - 当前私下定价讨论里最好的公开锚点
        - 设定了新投资人被隐含要求跨过的门槛
        - 留存来源集里没有公开披露后续投后估值
      - - Nel ASA
        - 2026 年 5 月市值约 USD 0.70B；2025 年收入 NOK 963M、现金 NOK 1,617M、积压订单 NOK 1,319M
        - 披露比 Sunfire 更充分的上市碱性 / PEM 同行
        - 显示一个估值下修但透明的上市可比，相比不透明私下独角兽语境可以显得多便宜
        - 投资组合不同，且公开市场折价可能在 Sunfire 执行更好时夸大下行
      - - ITM Power
        - 2026 年 5 月市值约 USD 1.57B；2025 年收入 £26.0M、现金 £207M、积压订单 £145.1M
        - 工业电解槽叙事里能见度最高的上市同行之一
        - 暗示 Sunfire 推断标记已经接近披露更充分的上市可比
        - PEM 聚焦和英国上市身份让它在技术和地域上都不是完美匹配
      - - thyssenkrupp nucera
        - 2026 年 5 月市值约 USD 1.26B，且 2026 年投资者发布节奏活跃
        - 大型工业碱性电解在位者，定期披露投资者资料
        - 支撑这样一个观点：推断 ~$1.1B 的 Sunfire 并不显著便宜
        - 装机基础和企业基础设施都远大于 Sunfire
      - - Plug Power
        - 2026 年 5 月市值约 USD 5.27B，尽管文件里风险语言很重
        - 显示即便执行波动大，市场胃口也可能存在，但前提是更宽的平台故事
        - 更像上限平台参照，而不是干净可比
        - 一体化氢能模型和美国规模让它结构上不同
      - - Bloom Energy
        - 2026 年 5 月市值约 USD 86.04B；更宽的固体氧化物和分布式能源平台
        - 只能作为离群值，说明非纯电解槽固体氧化物赢家可能获得的交易水平
        - 说明不应按最富有的宽平台倍数给 Sunfire 估值
        - 过于多元、规模过大，不能作为主要定价可比
      - - Electric Hydrogen
        - 2023 年超额认购的 USD 380M Series C；估值未披露
        - 证明私募资本仍愿意资助受青睐的电解槽平台
        - 支撑行业相关性，但不能给出精确的 Sunfire 估值标记
        - 融资规模不等于投后估值
      - - Hystar
        - 2025 年超过 USD 36M Series C；估值未披露
        - 显示较小电解槽同行在获得客户牵引后仍能筹集成长资本
        - 强化了行业在规模谱系低端仍有资本可得性
        - 融资规模太小、差异太大，不能直接锚定 Sunfire 价格
    notes: 市值行使用 CompaniesMarketCap 的 2026 年 5 月现货值，并配合文件或投资者发布资料给出经营语境。Sunfire 自身一行是推断而非披露，私募融资行是资本可得性信号，不是干净估值标记。
