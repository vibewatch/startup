      - number: '5.5'
        title: 信任、合规、质量控制与技术风险
        blocks:
          - type: paragraph
            body: >-
              Sunfire 的公开信任证据在工业质量控制上强于数字化保障。公司公开列出 ISO 9001、ISO 45001、ISO 14001、ISO 50001、PED 2014/68/EU 下的压力设备认证，以及
              Dresden 和 Solingen 的 DIN EN ISO 3834-3 焊接合规，还列出供应商行为准则和面向外部组织的现场规则。这很有意义，因为它说明制造组织有正式控制系统和受监管设备纪律。Sunfire
              还披露了一份隐私政策，提及旨在保护处理个人数据系统的保密性、完整性、可用性和韧性的技术与组织安全措施；其服务页面也明确有一层数据驱动监测。


              缺口在于软件或现场可靠性的外部证明。公开材料没有提供 SOC 报告、公开网络安全认证、正常运行时间或故障率指标、堆栈更换经济性，或数字监测和服务层的事故历史披露。在电化学一侧，最强的反向证据来自 SOEC
              自身历程：GrInHy 在一次长时堆栈测试中报告了污染和测试台故障，DOE 材料也强调，大规模 SOEC 商业化仍取决于 QA/QC、缺陷检测和衰减诊断。合适的尽调结论是，Sunfire
              的控制体系在制造上可信，但 SOEC 风险画像和数字服务保障仍需要私有证据，之后才能被视为充分完成投资测算。
