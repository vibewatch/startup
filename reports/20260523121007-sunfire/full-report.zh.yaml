  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 指示性估值区间
      - 从 ~$1.1B 语境出发的回报逻辑
      - 概率信号
      - 关键失败模式
    rows:
      - - 悲观
        - 项目节奏滑坡、补贴支持转弱，上市同行再次估值下修，而 Sunfire 仍不披露经济性
        - USD 400M 至 800M
        - 如果没有强下行保护或优先级，新资金会亏损本金
        - 项目取消更多、FID 延迟更多、需求信号更弱
        - 旗舰项目在成为收入前，就不再像可融资项目
      - - 基准
        - Sunfire 仍能融资且具备战略相关性，部分里程碑转化，但披露缺口和支持依赖仍在
        - USD 900M 至 1300M
        - 接近推断标记入场，上行有限，也达不到干净增长门槛
        - 西班牙和 RWE 继续推进，且没有重大负面尽调意外出现
        - 执行在推进，但由于证明不完整，溢价扩张始终没有到来
      - - 乐观
        - 西班牙、RWE 和 BASF 大幅降低执行风险；私下尽调显示收入转化、利润率和股权结构洁净度好于公开资料
        - USD 1500M 至 2200M
        - 只有拿到真实经营证明，上行才可接受；若还能折价入场最好
        - 具名里程碑转化为积压订单和收入，同时上市可比趋稳
        - 如果里程碑仍只是标题级证明，而不是现金级证明，乐观情景就会失效
    notes: 这些是仅基于公开信息的承保区间，不是公司披露估值。它们用于限制入场价格、框定尽调，而不是暗示精确的当前估值。
