        - 资本开支和爬坡成本负担高
        - 按场址提供当前工厂利用率和剩余资本开支
      - - 配套系统成本压力
        - S&P 称 2021 年以来成本通胀显著，未来降幅将是渐进式
        - 如果客户 ASP 跟不上，会挤压毛利率
        - 推高标准设备和安装所需营运资本
        - 拆分电堆与配套系统成本结构
      - - 压缩和下游设备
        - 30 bar 碱性设计降低压缩需求
        - 可能带来客户成本优势，并简化范围
        - 可能降低安装系统所需营运资本
        - 按项目展示压缩设备实测节省
      - - 土建 / 建筑 / HVAC
        - Sunfire 以户外安装和关键部件集中化为卖点
        - 潜在降低安装系统成本基数
        - 可能降低项目现金需求和进度风险
        - 提供相较上一代的 BOM 前后对比证据
      - - SOEC 能效
        - Sunfire 以 89% LHV 和使用蒸汽时 25-30 ppt 效率优势为卖点
        - 在热集成场景中，可能改善客户经济性
        - 可能取决于场址特定的蒸汽可用性和集成支出
        - 提供场址级能量平衡和实际运营成本数据
      - - 服务长尾和备件
        - 提供监控、维护、维修和备件
        - 安装后可能抬升混合毛利率
        - 营运资本需求低于首次设备收入
        - 披露服务合同渗透率和毛利率
      - - 保修和性能义务
        - 担保额度覆盖保修义务和预付款
        - 可能保护订单，但若现场性能下滑，会压迫准备金
        - 直接影响抵押和营运资本需求
        - 披露保修准备金方法和索赔经验
    notes: 由于 Sunfire 不披露产品线利润率，毛利率影响只能推断。本表聚焦公开记录如何描述这些驱动因素， 不编造百分比。
