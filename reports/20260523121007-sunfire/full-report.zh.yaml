      - number: '7.2'
        title: 监管、补贴和法律执行风险
        blocks:
          - type: paragraph
            body: >-
              Sunfire 的法律与监管风险，并不是公开记录里有某一起明确诉讼，而是项目能否足够快地穿过层层收紧的资格要求，并跑出经济性。本章采用的法律来源显示，RFNBO 资格现在受欧盟关于温室气体核算的授权规则约束，也受
              REDcert、ISCC 等认证体系约束；这些体系要求可合规追溯的可再生电力来源、来源担保逻辑、跨境电力处理和可审计文件。规则重要，是因为 Sunfire
              最可见的炼厂和邻近交通场景，不只需要氢气在技术上可用，还需要在客户和政策框架下合格。市场层面也有同一问题：ERCST
              称欧盟氢能政策监管色彩过重，德国联邦审计机构则称，即便投入数十亿支持，全国爬坡仍落后于计划。本章审阅的公开来源没有发现正在进行、针对 Sunfire
              的诉讼或执法事项，因此法律重点应放在补贴设计、认证准备度和落地节奏，而不是编造纠纷风险。投资人应把合规执行和公共支持延续性视为需求转化的闸门变量，而不是后台小事。
