            body: >-
              商业上，Sunfire 的挑战不是缺少证明点，而是部分同行在公开市场披露更多可融资性信号。Nel 发布装机基础和年报评论，ITM 披露现金和积压订单，nucera 披露装机容量和订单流入，Plug 通过 SEC
              文件披露详细风险语言。Topsoe 和 Bloom 也受益于更宽的工业或企业平台，可以安抚客户和贷款人。Sunfire 的回应是复购表述、具名工业案例，以及一款公司称可降低总安装成本的 50 MW
              碱性模块。这是可信的牵引证据，但透明度仍低于公开积压订单或资产负债表报告。定价在整个行业也结构性不透明。公开来源很少给出标价；它们通常营销更低 LCOH、更低总安装成本或更强担保。对尽调来说，这意味着 GTM
              质量、融资支持和范围打包，和硬件性能一样重要。
