  - id: TV005
    title: 投资逻辑击穿与否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 传导到投资逻辑的路径
      - 行动含义
    rows:
      - - 旗舰项目滑坡
        - 西班牙、RWE 或 P2X 里程碑明显右移，且没有等量替代订单补位
        - 集中的可见增长不再支撑高溢价私下叙事
        - 重定价到悲观区间，或在替代需求证明出现前放弃
      - - 支持机制转弱
        - 赠款、担保或补贴支撑的项目经济性被削减、推迟，或条件更严
        - Sunfire 失去部分当前支撑执行的公共风险分担
        - 假设转化更低、资本需求更高、估值支撑更弱
      - - SOEC 验证落空
        - BASF 测试设施时间线滑坡，或未能产出可信的工业验证数据
        - 乐观情景失去最干净的高温降风险催化剂
        - 从模型中剔除技术溢价假设
      - - 同行估值下修重启
        - 上市电解槽和氢能可比从当前水平大幅下跌
        - 即便 Sunfire 本身消息不变，私下估值支撑也会被压缩
        - 压低入场价格，或要求更强的结构性保护
      - - 私下经济性令人失望
        - 尽调发现毛利率弱、烧钱重、积压订单账龄差，或客户押金浅
        - 普通股上行缩小，融资依赖增加
        - 除非价格重置，否则从继续研究转为放弃
      - - 资本结构压力严重
        - 优先权、棘轮条款或高级索赔显著限制新股权收益
        - 公平企业价值不再能转化为有吸引力的普通股回报
        - 放弃普通股入场，或重新谈判结构
    notes: 这些触发项是可监测的承保规则，不是泛泛的公司风险。每一项都会直接传导为估值压缩，或削弱通往有利可图退出的路径。
