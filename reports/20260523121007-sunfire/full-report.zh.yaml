      - number: '8.2'
        title: 正向逻辑是工业证明；反向逻辑是估值下修、补贴依赖和不透明
        blocks:
          - type: paragraph
            body: >-
              Sunfire 的建设性案例很直接。公开来源显示，它有真实工业标杆，也有客户在意的技术路线图：两个新的西班牙 100 MW 订单、RWE GET H2 工厂第三个 100 MW 批次、一个若投资推进可扩大的 40
              MW P2X FEED 研究、更大且声称降低总安装成本的碱性产品，以及一个位于 BASF 场地、可弥合部分剩余高温验证缺口的 SOEC 验证设施。这些信号并不轻。它们解释了为什么 Sunfire
              可以合理声称自己具备战略相关性，而不只是试点阶段的可选项。反向逻辑同样清楚。可见增长组合集中在少数周期长、绑定补贴的项目中，现金转化仍取决于后续里程碑、合作伙伴执行和公共支持延续性。公开可比公司也不再支撑不分青红皂白的电解槽乐观。Nel、ITM
              Power、thyssenkrupp nucera 和 Plug 的估值都低于早前峰值，文件中也披露收入压力、积压订单转化风险、现金消耗、FID 延迟或项目直接取消。因此，Sunfire 推断约 ~$1.1B
              的背景落在一个要求很高的区间：高于 Nel，接近 nucera，距离 ITM 不远；但 Sunfire 披露的收入、现金和积压订单细节远少于这些上市同业。Electric Hydrogen 和 Hystar
              的私募融资显示，资本仍会流向受青睐的氢能平台，但它们并不能解决新 Sunfire 投资人的定价问题。资本可得性是相关性的证据，不是入场价格正确的证明。
