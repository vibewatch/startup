      - number: '8.3'
        title: 可以支撑一个区间，但还不能给出明确买入
        blocks:
          - type: paragraph
            body: >-
              基于这些证据，合适输出是情景区间和入场规则，而不是英雄式单点估值。基准情景假设 Sunfire 仍是资本更充足的欧洲电解槽厂商之一，至少把部分西班牙和 RWE
              管线转化为已确认积压订单或收入证明，并维持公共支持。这支撑一个仅基于公开信息的 $0.9B 至 $1.3B 区间，中点约 $1.1B——基本围绕推断的独角兽背景，并未高出太多。乐观情景需要的不只是订单标题。它需要
              BASF 验证降低 SOEC 风险，西班牙和 RWE 里程碑干净转化，也需要私下尽调显示收入转化和利润率结构比当前公开记录更健康。只有这样，$1.5B 至 $2.2B
              区间才站得住。悲观情景并不遥远。如果项目时点滑坡、补贴或担保支持减弱，或公开可比公司再次下修估值，价值可能压缩到 $0.4B 至 $0.8B。若按推断的 $1.1B
              标记直接入场，这种不对称性过不了新资金买入门槛。即便利好结果兑现，如果没有折扣或强结构性保护，上行也不足以达到风投式回报。因此，本章建议继续研究：Sunfire
              值得留在名单上，但公开可推断价格背景下披露不足，不能激进承销。
