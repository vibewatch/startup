        title: 客户细分与具名客户到底是什么
        blocks:
          - type: paragraph
            body: >-
              Sunfire 的客户基础应被表述为集中的工业项目簿，而不是广泛的经常性账户基础。公开来源中的具名交易对手集中在几个重工业细分：Repsol 相关场地和 TotalEnergies 相关项目等炼厂脱碳买方；RWE
              和 Uniper 牵头联盟等公用事业或氢能枢纽开发商；P2X Solutions 和 Ren-Gas 等专用氢能项目开发商；以及 Neste、Salzgitter 和 BASF 等验证 SOEC
              用例的工业主现场。买方、主现场和用户往往不是同一实体，因此该区分很重要。在多个案例中，Sunfire 向联盟或项目公司销售电解设备，而最终用户是炼厂或工业工厂。实际结论是，Sunfire
              在多个欧洲垂直行业有真实具名工业关系，但这些关系不可互换。AEL 案例更接近商业订单和一座在运工厂；SOEC 案例更接近示范、验证和主现场学习。
