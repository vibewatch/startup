companyProfile:
  summary: >-
    Sunfire 是一家位于 Dresden 的德国电解槽制造商，开发面向工业脱碳的加压碱性和固体氧化物电解系统。公司销售对象覆盖炼油、燃料、化工、钢铁等难减排行业，并有 RWE、Repsol/Petronor、Neste、P2X
    Solutions 的公开项目案例，以及与 BASF 相关的验证工作。公开融资披露显示，公司拿到 €215 million Series E、最高 €100 million EIB 风险债、约 €200 million
    未提取补助，以及 €200 million 担保额度。Sunfire 因此是欧洲资本更充足的私营电解槽扩张公司之一，但收入、估值和利润率细节仍未公开。
