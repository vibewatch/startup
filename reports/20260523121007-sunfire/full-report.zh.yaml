  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、模块与买方适配
        blocks:
          - type: paragraph
            body: >-
              Sunfire 应被理解为销售可直接进厂部署电解产能的工业电解槽供应商，而不是纯堆栈实验室、氢气销售商或通用 EPC。公司的公开产品表面围绕两条化学路线组织：加压碱性面向广泛工业氢项目，SOEC
              面向低压蒸汽或工业余热能显著改善经济性的场景。这一区别重要，因为它说明 Sunfire 不是把一个通用模块推给所有用例。相反，碱性产品线被呈现为炼厂、化工、氨和其他大型项目的标准化主力；SOEC
              则定位于热集成钢铁、炼油和 e-fuels 环境，在这些场景中，效率收益可以抵消更高的集成复杂度。


              第五章产品定义比普通营销更可信，原因在于模块周围的范围。Sunfire 的产品组合页面和服务材料称，公司覆盖
              FEED、生产、预组装、交付、项目管理、现场支持、维护和数字服务。换句话说，产品边界已经包括工程和生命周期支持。公开证据还显示，碱性系列比 SOEC 有更清晰的模块化和商业成熟度：HyLink Alkaline
              22 和 23 明确面向 10 MW 和 50 MW 工厂模块销售，而 HyLink SOEC 是一个差异化更强但仍更窄的热驱动方案。对尽调而言，合适表述是：一家双平台工业产品公司，其 AEL 产品线今天看起来比
              SOEC 产品线更商业化。
