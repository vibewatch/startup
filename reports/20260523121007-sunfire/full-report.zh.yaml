      - number: '6.4'
        title: 扩张路径与集中度、客户转化风险
        blocks:
          - type: paragraph
            body: >-
              Sunfire 客户基础的上行真实存在，但被项目融资和行业条件紧紧约束。上行情景可见：标准化碱性模块赢得炼厂复购业务，P2X 从 Harjavalta 延伸到 Joensuu FEED，Ren-Gas
              扩展了芬兰管线。下行在于，公开客户池集中在少数非常大的工业名称和行业中，这些名称和行业共享对补贴设计、承购确定性和基础设施就绪度的依赖。独立 2026
              年市场来源认为，政策和承购没有对齐时氢能项目会停滞，RFNBO 规则会抬高成本，达到 FID 的项目太少。对 Sunfire
              来说，客户集中风险不只是少数交易对手的问题；也是少数相关项目原型的问题。最重要结论是，Sunfire 有可信的具名需求，尤其是 AEL；但要把这种需求转化为耐久、多元收入，仍取决于融资、监管和客户资本开支纪律。
