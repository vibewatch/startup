  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Sunfire
              并不覆盖整个氢能经济；它销售大型工业电解槽系统和相关集成，服务那些想在既有工业流程中替代化石制氢或化石燃料的项目。已保留证据指向一个更集中的市场：面向炼厂、工业园区、项目开发商、钢铁和化工脱碳、e-methanol
              或 e-fuels
              平台的大型绿氢工厂。因此，相关支出包括堆栈、模块、电力电子、流程集成、调试，以及贴近电解槽本身的项目工程范围；但不包括商业气体分销、长距离管道、地下储气洞库、零售加氢和大多数下游合成资产。替代集合也不只灰氢：炼厂运营商可以继续使用传统氢气，钢铁厂可以维持煤基或气基路线，许多工业用户也可以先投效率提升、回收、碳捕集或电气化。Sunfire
              的两条技术路线进一步收窄了边界。SOEC 在有余热或蒸汽的地方最强；加压碱性则更适配大型模块化基荷项目。
