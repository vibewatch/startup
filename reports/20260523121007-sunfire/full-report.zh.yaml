        title: 定价模式、合同打包与销售效率替代指标
        blocks:
          - type: paragraph
            body: >-
              Sunfire 没有在已保留公开资料中公布标价或实际成交价。它销售的是结果：更低工厂总 capex、更低总安装成本、更低压缩需求，以及在蒸汽集成帮助 SOEC 时更低的 LCOH。这很重要，因为 GTM
              动作看起来是企业级、项目制，销售周期受 FEED、FID、许可和客户融资塑造，而不是由快速内部销售漏斗驱动。最好的公开销售效率替代指标是重复范围和重复交易对手，而不是 CAC 或回本周期。Repsol
              再次在西班牙选择 Sunfire，P2X 从 Harjavalta 运营延伸到新的 FEED 范围，RWE 授标则是在项目融资里程碑之后才到来。即便 RWE
              合同价值也只披露为低数亿欧元区间。实际结论是，Sunfire 可能靠可融资性、流程适配和工程可信度赢单；但外部投资人仍看不到实际 ASP、折扣或正式销售生产率指标。
