  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接同行、既有巨头、相邻玩家与工厂层替代方案
        blocks:
          - type: paragraph
            body: >-
              不应只拿 Sunfire 和一种堆栈化学路线比较。在真实工业招标中，它面对 thyssenkrupp nucera、Nel 等大型碱性既有玩家，ITM Power、Plug 等 PEM
              专家，Topsoe、Bloom 等聚焦 SOEC 的替代方案，以及能把工厂执行与堆栈选择拆开的大型集成商。因此，实际竞争集合取决于买方任务。如果买方重视已披露装机基础、上市公司报告和大型碱性案例，nucera 和
              Nel 就是基准。如果买方想要 PEM 动态响应和上市公司披露，ITM 和 Plug 就重要。如果买方有蒸汽、余热，以及下游 e-fuels 或氨集成，Topsoe 和 Bloom 就更相关。Sunfire
              的战略优势在于，它既能参与大型项目的碱性讨论，也能参与高效率 SOEC 讨论；但这也意味着它会在两边同时被拿来和更成熟的单平台专家比较。
