      - number: '5.4'
        title: 差异化、制造诀窍与规模依赖
        blocks:
          - type: paragraph
            body: >-
              Sunfire 的核心差异化不只是销售电解槽；许多竞争对手也在做。更强的主张在于，它用一个交付组织覆盖两条化学路线，分别解决不同工业问题。AEL
              为大型工厂提供压力、模块化、更低压缩需求和更简单的户外部署。SOEC 则在有蒸汽或余热时提供显著更高效率。公开项目案例显示这些路径不是纸上谈兵：Sunfire 把碱性用于炼厂和大型氢能枢纽工作，同时把 SOEC
              用在炼油、炼钢和 e-fuels 相关叙事中。公司也比纯工程店更有制造实质。公开材料指向 Solingen 的电池生产和电镀、认证制造和压力设备管控，以及目标为 AEL 1 GW/year、SOEC 500
              MW/year 产能的工业化计划。


              话虽如此，护城河并非没有摩擦。InvestEU 明确显示，至少一部分 SOEC 早期产能建设安装在 Saxony 的合同制造商处，而不只在 Sunfire
              自有设施内。公开来源也没有披露合同制造商名称、良率或实际批量产出。结果是，这条护城河建立在流程诀窍、集成经验和双化学路线适配上，但仍依赖制造执行和伙伴产能，而不是一个容易审计的类软件平台优势。
