      - number: '2.3'
        title: 买方、用户与付款方细分
        blocks:
          - type: paragraph
            body: >-
              近期最可信的买方，是已经消耗氢气，或能证明在难减排流程旁建设大型专用电解装置合理的工业用户。炼厂是最清楚的例子：Repsol 的 Cartagena 和 Petronor
              项目显示，可再生氢可以直接接入既有工业综合体；Neste 的 MultiPLHY
              项目则说明，只要有蒸汽和热量，即便规模较小的高温系统也能接入炼厂运营。公用事业和氢能枢纽开发商同样重要，因为它们在分子到达终端用户之前先聚合基础设施和承购风险；RWE 的 Lingen
              项目本质上是一个由公用事业牵头、服务区域工业需求的生产平台。P2X Solutions 等项目开发商也出于同样原因重要，Harjavalta 已经投运，Joensuu 则与 e-methanol
              相关。钢铁和化工在战略上重要，但投资周期更长，对基础设施的依赖更重。跨这些细分市场看，用户往往是工厂运营方或工程团队；付款方通常是董事会层面的脱碳预算、炼厂管理层、公用事业投资委员会或项目
              SPV，而不只是最终氢气消费者。
