      - number: '2.4'
        title: 增长驱动、瓶颈与反向证据
        blocks:
          - type: paragraph
            body: >-
              增长逻辑建立在真实政策和客户拉动上，但不会自动兑现。欧洲现在有具约束力的可再生氢目标、氢能市场一揽子方案，以及旨在弥合可再生氢供应成本与买方支付意愿之间差距的 Hydrogen
              Bank。这些工具重要，是因为氢能项目仍然资本密集，并常依赖补助、担保、IPCEI 支持和溢价机制叠加。只是独立证据仍对时间表保持怀疑。Hydrogen Council
              将延期和取消归因于可再生电力价格、通胀、供应链问题和监管未定。IEA 显示资金投向更聚焦，但总量也变小，意味着每个项目仍要激烈争夺支持。IEEFA
              的反向判断更明确：如果利用率假设过于乐观，氢能基础设施可能被过度建设，而电气化在许多终端用途里往往仍更便宜。DNV 和 Hitachi
              补充了运营约束：低成本电力、高利用率、强电网连接不是可选项，而是项目经济性是否成立的核心。结果是，市场可以快速增长，但前提是政策支持、可负担电力和可信承购同时到位。
