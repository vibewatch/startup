      - number: '2.5'
        title: 估值影响与市场尽调缺口
        blocks:
          - type: paragraph
            body: >-
              对尽调而言，重要结论不是氢能很大，而是 Sunfire
              的可触达市场被项目成熟度卡住。政策雄心、拍卖需求和重工业脱碳都支持一个可观的长期市场。但近期更影响估值的可获取市场（SOM），是那些能拿到电力、补贴、许可、电网集成和真实工业承购的项目子集。公开证据不足以精确隔离这一数字。投资人仍需要按细分市场拆开的赢率、按技术和范围划分的平均售价、按阶段划分的积压订单转化，以及在现实电价和补贴假设下的客户经济性。这种不确定性不会否定市场，而是改变投资测算镜头。Sunfire
              在买方已有工业氢使用场景，或能将 e-methanol、低碳燃料、钢铁脱碳等溢价产品货币化时，位置最好；如果市场采用依赖投机性基础设施建设，或依赖成本平价比现有证据显示得更快到来，确定性就低得多。
            claimRefs:
