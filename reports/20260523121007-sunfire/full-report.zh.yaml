      - number: '7.4'
        title: 合作伙伴、基础设施和客户集中风险
        blocks:
          - type: paragraph
            body: >-
              Sunfire 最强的商业证明来自少数具名伙伴愿意把大型资产交给它，但同一事实也带来集中和依赖风险。RWE GET H2 阶段就是例子：Sunfire 只供应 300 MW 电厂中的一个 100 MW
              批次；Bilfinger 控制辅助系统和集成；前两个大型批次给了 Linde 和 ITM；整体经济性还取决于管道、储存和工业承购同步建成。西班牙订单规模大、战略吸引力强，但集中在 Repsol
              相关炼厂生态，且要到 2029 年才投运。P2X 带来复购客户可信度，但 Joensuu 后续项目仍处 FEED 阶段，并明确绑定之后的投资决策。换句话说，Sunfire
              确实有真实交易对手，但公开需求仍集中在少数复杂、依赖补贴的大型项目类型。投资含义是：合作伙伴质量不等于多元化。即便一两个旗舰项目滑坡，Sunfire 的积压订单转化、工厂利用率和外部融资信心都可能遭受超比例冲击。
