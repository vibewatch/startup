      - number: '7.5'
        title: 财务模型压力、缓释因素和投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              Sunfire
              的财务模型风险，本质是三层杠杆问题。第一，公司融资真实存在，但支持性资金占比高：股权、风险债务、补助和公共担保都有助执行，也说明企业要工业化仍需要外部资本和风险分担。第二，市场供应相对可融资需求过剩。World
              Bank 指出产能过剩；IEEFA 和 Belfer 指出更广泛氢能建设中利用率偏弱的风险；Nel、ITM、Topsoe 和 Plug 的竞品文件说明，一旦 FID
              延迟或工厂低负荷运行，结果就是利润率受压、项目取消、流动性压力上升。第三，Sunfire 客户项目周期长、靠里程碑推进，所以转化风险并不抽象：RWE、Repsol 相关场地或 P2X
              的延误会直接传导到收入时点、营运资金和估值。缓释逻辑并不空：Sunfire 有复购客户、降本后的更大型 AEL
              平台，也有贴合政策的资本支持；但如果可见旗舰项目错过下一批里程碑，或公共支持框架不再填补氢能雄心与客户经济性之间的缺口，投资逻辑仍会失效。
