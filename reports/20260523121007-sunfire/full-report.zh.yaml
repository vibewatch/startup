  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 责任方 / 尽调路径
    rows:
      - - 资本结构
        - 完整股权结构表、清算优先权、棘轮条款、认股权证、担保契约，以及任何排在新股权之前的优先级
        - 没有分配瀑布，本章无法把企业价值转换为可靠的普通股上行
        - 公司 CFO、法律顾问，以及投资者权利文件包审阅
      - - 经营经济性
        - 按 2025-2026 时段列示的已确认收入、毛利率、现金、烧钱速度和不受限流动性
        - 这些决定 Sunfire 值不值得获得类似同行的估值支撑，还是只能按项目 OEM 折价
        - 索取经审计报表、董事会材料和月度 KPI 仪表盘
      - - 积压订单质量
        - 按具名项目列示的积压订单账龄、取消权、客户押金、预付款时间表和转化假设
        - 项目标题不等于能转化为现金的积压订单
        - 审阅项目控制、商业合同和营运资本滚动表
      - - 项目里程碑证明
        - 西班牙、RWE、P2X 和 BASF 的阶段关口证据，包括交易对手、许可、EPC 状态和收入触发项
        - 乐观情景依赖少数项目按时转化
        - 做客户 / 合作伙伴背调访谈，并取得更新后的项目计划
      - - SOEC 耐久性和保修敞口
        - 固体氧化物系统的现场性能、衰减、更换、准备金和正常运行时间数据
        - 没有工业可靠性证明，高温上行不足以支撑溢价
        - 与工程负责人做技术尽调，并审阅保修台账
      - - 退出准备度
        - 董事会批准的退出路径、战略买家兴趣，以及适合财务赞助方或收购方尽调的报告成熟度
        - 高溢价入场价只有在退出路径真实且可融资时才成立
        - 审阅投行材料、赞助方反馈和董事会战略材料
    notes: 这些项目最可能把建议从继续研究推向有价格支撑的确信。它们聚焦公开来源无法提供的缺失证据。
