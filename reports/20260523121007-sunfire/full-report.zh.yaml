        title: 护城河耐久性、中国压力与反向情景
        blocks:
          - type: paragraph
            body: >-
              反向情景不是 Sunfire 没有护城河，而是护城河未必在所有细分市场都耐久。更大的既有玩家有更好的公开披露，在某些情况下还有更深的资产负债表或渠道信号。中国碱性制造商正在重设全球价格预期，尤其是 AWE；即便把
              EPC 和集成成本计入后，中国以外的落地项目经济性没有那么戏剧化。Topsoe 的 2025 年报告和 Nel 的 2025 年报告都显示，即便资本充足的平台也仍会遭遇 FID
              推迟、取消和收入转化放慢。这很重要，因为 Sunfire 最强的属性——双平台可选性、复购客户、热集成 SOEC
              经济性和更大的碱性模块——只有在项目真正走到融资和执行时才创造价值。因此，最重要的竞争结论是细分：Sunfire 在奖励流程适配和效率的欧洲工业项目中有可防守位置；但在最低 capex
              碱性招标商品化的场景，以及买方更看重资产负债表透明度而非技术细节的市场中，结构性暴露更高。
