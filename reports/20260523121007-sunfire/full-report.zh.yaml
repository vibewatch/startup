      - number: '7.3'
        title: 制造、技术和运营执行
        blocks:
          - type: paragraph
            body: >-
              运营风险分成两条线：AEL 工业化越来越产品化，SOEC 仍需要长期验证。积极的一面是，Sunfire 已经搭好几道缓冲：HyLink Alkaline 23
              发布时声称模块尺寸大幅提高、安装复杂度降低、客户已安装成本最高下降
              50%；担保额度也降低了并行项目的营运资金摩擦。但剩余风险仍然不小，因为电解槽项目的经济性不只取决于电堆本身，系统集成、BoP、调试和融资同样关键。World Bank
              明确指出，EPC、土建、许可和融资主导项目总成本；CORDIS 也强调，全行业仍卡在低批量制造瓶颈。SOEC 又多一层不确定性。DLR-Sunfire 论文记录了严重衰减机制，并提醒进料气质量要求仍不清晰，这正是
              Sunfire 在 BASF 场地新建测试设施的重要原因。BASF 项目是缓释，不是风险关闭的证明。在投资人看到机队级可用率、衰减曲线和更换经济性前，SOEC 技术风险仍显著高于 AEL，即便 Sunfire
              的公开路线图方向上可信。
