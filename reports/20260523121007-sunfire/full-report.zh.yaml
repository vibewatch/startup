      - number: '5.2'
        title: 运行架构、集成模型与服务流程
        blocks:
          - type: paragraph
            body: >-
              Sunfire 没有公开发布完整 P&IDs、控制架构图或软件栈文档，但已保留来源包仍透露了大量产品交付方式。在工厂层面，Sunfire
              的模块只是更大运行系统的一部分；该系统包括水处理、氢气处理、压缩、干燥、控制、氢气处理单元、EPC 协调和特定场地调试。50 MW
              碱性产品发布显示，公司正试图通过集中关键工厂部件、提高预制比例、把空气冷却作为标准配置，并把 100 MW 建设所需模块数量从 10 个降到 2
              个，来简化这套架构。这不是一个化学路线故事，更是一个施工和集成故事。


              与 SOEC 的对比同样重要。MultiPLHY 和 GrInHy2.0 显示，Sunfire 的高温产品更明确依赖热、蒸汽、氢气处理，以及与炼厂或钢铁网络的主现场集成。Sunfire
              并不单独包揽所有环节：RWE 披露 Bilfinger 负责辅助系统和控制，MultiPLHY 则依赖 Paul Wurth/SMS 做氢气处理，并依赖 Neste
              做炼厂集成。服务随后被产品化为数据驱动监测、预防性维护、维修和备件。实际结论是，Sunfire 的公开架构是模块化的，但并非自包含。只有当 Sunfire
              的电解模块与有能力的集成伙伴、主现场公用工程和长期服务支持匹配时，产品才具备可融资性。
