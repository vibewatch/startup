      - number: '3.2'
        title: 能力、技术适配，以及 Sunfire 真正不同之处
        blocks:
          - type: paragraph
            body: >-
              最重要的技术细节是：Sunfire 的差异化有条件，不是普遍成立。它的 SOEC 平台在有蒸汽或余热、且下游氨、甲醇、SAF 或其他分子生产重视更低电耗的地方才更有价值。它的加压碱性平台则在买方需要面向 100
              MW 以上工业项目的标准化、可融资模块时更有价值。这不同于 ITM 和 Plug 等 PEM 专家，后者强调动态响应和模块化低温系统；也不同于 nucera，后者强调成熟的大规模
              AWE、单电池可维护性和生命周期服务。Topsoe 和 Bloom 在效率叙事上与 Sunfire
              最直接重叠，但两者也搭配各自的制造规模和服务主张。净效果是：当客户看重流程适配和系统经济性，而不是纯化学路线正统性时，Sunfire 最强；当买方只想要披露最多、采购故事最简单的低温既有供应商时，Sunfire
              最弱。
