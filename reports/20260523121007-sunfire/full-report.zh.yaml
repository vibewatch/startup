      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Sunfire 的领导层记录在创始人和当前管理董事会层面最强，在更深层的控制细节上最弱。官方和第三方报道支持一个基线：Nils Aldag、Christian von Olshausen 和 Carl
              Berninghausen 于 2010 年创办公司。2020 年 11 月，公司发生重要领导层交接：Aldag 出任 CEO，Berninghausen 从 CEO 转任监事会主席，同时新增 COO 和 CFO
              角色，以帮助企业工业化。今天的正式管理董事会已经不同：Aldag、von Olshausen、Frank Posnanski 和 Jens Henneberg 任职，Dr. Frank Mastiaux
              担任监事会主席。这为后续章节提供了可用的领导层基线，但不是完整治理图谱。已保留资料仍未披露完整监事会名单、经济控制权、股东优先权，或 Berninghausen
              在历史材料之外的当前角色。治理尽调因此应聚焦股权结构表控制、董事会构成，以及公开融资标题背后任何投资人特定的保护性权利。
