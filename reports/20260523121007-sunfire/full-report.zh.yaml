      - number: '3.4'
        title: 替代方案、内部自建，以及买方何时还能切换
        blocks:
          - type: paragraph
            body: >-
              Sunfire 还要和一些不是一对一 OEM 同行的选择竞争。DOE 的电解概览提醒，电力成本和电网条件仍然决定项目经济性，所以灰氢、其他脱碳路径或推迟投资，仍是许多工业预算的真实替代方案。EPC
              主导交付又提供了另一条替代路径。大型买方可以分别采购可行性、FEED、工程和工厂集成，削弱任何单一 OEM 掌控整座工厂架构的能力。这意味着早期切换成本中等，后期切换成本高。FEED
              锁定之前，客户可以多家并行、开展技术比选，并迫使价格发现。详细工程、许可、模块占地和服务假设嵌入项目之后，更换堆栈供应商会变得破坏性大得多。因此，Sunfire
              受益于足够早进入、能塑造流程设计和长期服务模型，而不是只在后期作为硬件报价方出现。
