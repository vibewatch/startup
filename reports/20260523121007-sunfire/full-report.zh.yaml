      - number: '5.3'
        title: 部署案例、成熟度分化与路线图证据
        blocks:
          - type: paragraph
            body: >-
              Sunfire 的公开部署证据足以区分哪些已经产品化，哪些仍在验证。碱性一侧，公司现在有一条清晰路径：从 10 MW 案例走向重复 100 MW 订单。2023 年项目汇总把 Sunfire 与 RWE 的 10
              MW 碱性、P2X Harjavalta 的 20 MW 碱性，以及 Bad Lauchstädt 的 30 MW 角色相连；到 2024 年，RWE 已为 GET H2 Nukleus 订购一套 100 MW
              碱性系统；到 2026 年，Sunfire 又宣布 Repsol 相关场地在西班牙的两个 100 MW 项目。这条轨迹，加上 HyLink Alkaline 23 发布，支持一个判断：AEL
              正从一次性模块走向可重复的工业模块。


              SOEC 更复杂。证据是真实的：MultiPLHY 在 Neste 启动了一套 2.6 MW、12 模块 SOEC 系统；GrInHy2.0 在炼钢中达到工业运行；GrInHy3.0
              正用新模块延伸这条产品线。但公开证明主要仍是工业示范和受资助商业化工作，而不是重复 100 MW 商业订单。即便最好的来源也仍在谈验证计划、运行小时数和后续测试模块。投资人因此应把 Sunfire
              的路线图视为双线推进。AEL 像近期规模引擎；SOEC 则是差异化平台，如果耐久性、制造和热集成部署持续转化为可重复标准产品，其商业化逻辑会改善。
