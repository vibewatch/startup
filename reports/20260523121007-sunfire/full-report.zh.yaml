            body: >-
              Sunfire 最强的公开财务证据在资本获取上，而不是在内部产生现金上。2024 年方案包括 €215 million 股权、最高 €100 million EIB 风险债，以及约 €200 million
              先前获批但尚未提取的补助。2025 年担保额度又增加 €200 million 执行支持，并且尤其重要，因为它能保障预付款、履约和保修义务，而不必把 Sunfire
              的现金作为抵押占用。这有助于营运资本，但没有披露手头现金，也没有延长一条公开现金跑道。反向情景是，全行业延期、补贴依赖和 FID 转化缓慢，仍然决定大型已宣布项目能否变成已确认收入。IEEFA
              对确认需求之前基础设施支出的批评，以及同行文件中关于项目推迟或客户融资延误的语言，都强化了这一点。Sunfire
              看起来有足够资本支持去推进大型项目，但持续投资测算仍取决于有政策背书的项目经济性，以及深得多的私有财务披露。
