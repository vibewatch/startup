  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 可定价性先靠融资广度支撑，随后撞上披露边界
        blocks:
          - type: paragraph
            body: >-
              Sunfire 的公开融资证据足以让它看起来像严肃平台，但还不足以让估值完全可定价。2024 年融资包真实且罕见地宽：€215 million Series E 股权、最高 €100 million EIB
              风险债务，以及约 €200 million 此前获批补助。2025 年担保额度又增加 €200 million 执行支持，覆盖预付款、履约和质保义务，同时不要求 Sunfire
              抵押同等现金。这一点重要，因为大型氢能项目最拉扯资产负债表时，它降低了营运资金摩擦。但反过来，Sunfire
              获得承销靠的是股权、风险债务、补助和公共担保堆叠，而不是透明、自我造血的经营现金流。另一个关键限制是估值披露。本章审阅的公开材料没有披露 2024
              轮当前投后估值，也没有披露之后任何内部估值标记。最强的公开估值信号是一篇 2023 年媒体报道：Sunfire 可能很快价值超过 €1 billion。因此，本章只把约 $1.1 billion
              作为从该报道中独角兽门槛换算来的推断背景，而不是公司确认的当前价格。对投资人而言，这一区别决定性：公开记录证明 Sunfire 能融资、有雄心，但还没有证明，在隐含独角兽价格附近买入普通股敞口是有吸引力的。
