      - number: '2.2'
        title: TAM、SAM 与相互冲突的规模口径
        blocks:
          - type: paragraph
            body: >-
              没有任何一个公开数字可以直接当作 Sunfire 的总可用市场（TAM）。政策来源、市场追踪和行业展望讲的是不同对象：政策雄心、运营产能、已承诺项目、已宣布项目、贸易流，以及长期脱碳情景。European
              Commission 和 Observatory 仍把欧洲锚定在 2030 年 20 million tonne 的氢能目标；IEA 则称，全球政府生产目标为 27 to 33 Mtpa，而政府需求目标只有约
              9.5 Mtpa，已立法需求信号约 6 Mtpa。Hydrogen Council 给出最清晰的反向交叉校验：即便管线扩张，到 2030 年，已宣布的 48 Mtpa 全球供应中也可能只有 12 to 18
              Mtpa 真正落地。CINEA 首次 Hydrogen Bank 拍卖显示项目需求真实存在，但投标不等于投产。可投资口径下的规模结论因此必须按镜头拆开。宽口径自上而下 TAM 可以用政策和项目管线指标描述；但
              Sunfire 今天可服务市场，是更窄的一池欧洲工业项目——这些项目必须走到 FEED、FID、融资和电力接入。
