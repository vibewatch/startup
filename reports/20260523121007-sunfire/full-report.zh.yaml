  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 支持证据
      - 反驳点
      - 什么会改变观点
    rows:
      - - 融资宽度真实存在
        - Sunfire 把股权、EIB 风险债、赠款和担保支持叠成了 >€500M 的资本语境
        - 这套结构也证明业务扩张仍需要外部资本和公共风险分担
        - 证明扩张资金可以来自改善中的经营现金流，而不是反复依赖支持工具
      - - 工业验证可见
        - 西班牙、RWE、P2X 和 BASF 都显示 Sunfire 正在卖进严肃的工业流程
        - 大多数可见项目仍要等后续里程碑、伙伴交付和补贴支撑经济性对齐后，才会转化为价值
        - 按具名项目提供积压订单账龄、客户押金和里程碑到收入的转化数据
      - - 技术杠杆存在
        - HyLink Alkaline 23 和 BASF SOEC 测试设施带来可信的降本与验证上行
        - 这些仍是公司主导的证明点，还不是经审计的现场经济性或设备群级耐久证据
        - 从规模化运行系统交付独立的性能、衰减和更换成本数据
      - - 上市可比定位还算体面
        - 推断的 ~$1.1B 语境高于 Nel，接近 ITM 和 nucera，而不是明显困境区间
        - 这些上市同行披露收入、现金、积压订单和风险语言，Sunfire 仍未披露
        - 向上市公司披露深度靠拢，或给出明确更低的私下入场价格
      - - 当前反向逻辑
        - Sunfire 可能仍是一个不透明、对补贴敏感的项目 OEM，股权上行被稀释和长转化周期封顶
        - 如果私下尽调显示经济性更强、优先级比公开记录更干净，公司可能配得上溢价
        - 在要求投资人穿越不确定性出价前，先打开资本结构、经营模型和项目单位经济性
    notes: 投资逻辑和反向逻辑刻意对价格敏感。即使公司更强，如果投资人支付的价格已经假设执行风险闭合，仍可能是一笔弱投资。
