        - 经审计的 2025-2026 经营数据和有文件支撑的分配瀑布会提高信心
      - - 风险评级
        - 高
        - 下行风险叠加补贴依赖、项目节奏、同行估值下修和经济性不透明
        - 要求下行优先的条款清单，或更低入场价格
        - 只有旗舰项目转化且私下经济性显示韧性，风险才会下降
      - - 估值立场
        - 只有低端合理；推断的 ~$1.1B 附近偏高
        - 估计语境接近披露更充分的上市同行，而不是明显折价
        - 没有经营证明时，避免为完整战略溢价叙事买单
        - 如果入场价明显低于隐含独角兽标记，观点会改善
      - - 推断语境下的基准回报
        - 低于 2x，新资金很可能低于目标
        - 基准区间中心接近当前推断标记，而不是显著高于它
        - 入场价格比公司质量叙事更关键
        - 只有拿到折价，或公开不可见的经济性更好，回报才会改善
      - - 优先退出路径
        - 战略或产业赞助方、资本重组，或结构化后期融资
        - 公开证据不支持近期高溢价 IPO 情景
        - 按私下退出路径承保，不押注公开市场奇迹式重估
        - 如果 Sunfire 开始像上市同行一样报告，并完成执行里程碑，观点会改变
    notes: 本表把本章转换为投委会姿态，而不是折现现金流模型。估值语境来自公开证据推断，不应误认为公司披露的当前投后估值。
