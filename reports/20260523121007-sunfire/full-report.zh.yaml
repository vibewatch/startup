      - number: '8.4'
        title: 入场纪律必须严格；执行或支持滑坡会打破投资逻辑
        blocks:
          - type: paragraph
            body: >-
              实际含义是，Sunfire
              应被视为有条件机会，而不是动量投资。新投资人要么低于推断独角兽标记入场，要么拿到下行保护，以补偿收入转化不确定和资本结构不透明。缺失的尽调工作很具体。第一，管理层必须打开资本结构：清算优先权、棘轮条款、董事会权利、担保契约，以及任何排在新增普通股之前的优先请求权。第二，Sunfire
              必须拿出董事会级运营证据：按项目确认的收入、按产品线毛利率、非受限现金、烧钱速度、积压订单账龄、取消权、预付款计划和质保敞口。第三，投资人需要西班牙、RWE、P2X 和 BASF
              的项目级里程碑证明，以检验公开标杆究竟在走向收入，还是只是在拉长时间线。如果发生三件事之一，投资逻辑就应被视为破裂：旗舰项目实质性滑坡，公共支持机制不再填补经济性缺口，或私下尽调显示利润率、现金消耗或积压订单转化显著弱于公开叙事。这些不是软风险，而是运营不确定性传导为估值压缩的直接通道。
