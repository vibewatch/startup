  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 仅基于公开资料，为悲观、基准、乐观情景给出低、中、高投资测算区间；基准情景中点与本章推断的 ~$1.1B 估值背景对齐。
    data:
      items:
        - label: 悲观情景测算区间
          low: 400
          mid: 600
          high: 800
          unit: USD M
          detail: 项目延期、支持转弱、同行估值进一步下修
        - label: 基准情景测算区间
          low: 900
          mid: 1100
          high: 1300
          unit: USD M
          detail: 融资叙事仍站得住，但披露缺口仍限制估值溢价扩张
        - label: 乐观情景测算区间
          low: 1500
          mid: 1800
          high: 2200
          unit: USD M
          detail: 里程碑兑现，私下尽调显示经济性好过公开资料呈现
    approximationNotes: 这些区间按企业价值口径，从公开融资背景、上市可比公司信号和反向市场证据推断而来。不应把它们误读为公司已披露的当前估值。
    claimRefs:
      - CV010
      - CV043
      - CV044
      - CV045
      - CV051
      - CV052
      - CV053
      - CV054
