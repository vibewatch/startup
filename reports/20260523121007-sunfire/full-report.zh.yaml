              Sunfire 的资本故事现在是公司概况里最清楚的一块。2024 年 3 月，公司披露 €215 million Series E、最高 €100 million 的 EIB 风险债额度用于 SOEC
              商业化，以及约 €200 million 先前获批但尚未提取的补助。新资金来自 LGT Private Banking、GIC、Ahren Innovation Capital 和 Carbon
              Equity；Lightrock、Planet First Partners、Carbon Direct Capital、Amazon 的 Climate Pledge Fund、Blue Earth
              Capital 等既有支持者也追加承诺。2025 年 1 月，Sunfire 又获得一条单独的 €200 million 担保融资额度，由 Commerzbank 牵头的银行银团支持，并获得德国和 Saxony
              的公共担保。这一工具尤其重要，因为它用于保障预付款、合同履约和保修义务，而不必占用现金。公开记录因此支持强资本获取能力和有政策背书的执行能力，但仍未披露当前估值、成立以来累计融资额，或融资栈背后的清晰控制图。
