  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与公开牵引真正证明了什么
        blocks:
          - type: paragraph
            body: >-
              公开材料支持的收入模式围绕工业电解槽项目，而不是清晰的经常性软件故事。Sunfire 可见的变现表面包括大型碱性和 SOEC 系统设备销售、授标前工程工作，以及生命周期服务。最清楚的证明来自具体项目：RWE
              在项目 FID 后委托一套 100 MW 碱性系统，Repsol 相关炼厂项目又增加两座 100 MW 工厂，MultiPLHY 在 Neste 创建了工业 SOEC 案例，P2X 在后续投资决定前授予
              Sunfire 一项 FEED 研究。这些事实支持商业相关性和项目驱动销售动作，但不能转化为已披露收入或 ARR。Sunfire 还称订单簿超过 800
              MW，这有助于证明牵引；但公开证据仍止步于已确认收入、按产品线划分的收入结构，或订单转化为入账销售的时间。投资测算因此应把 MW 授标和案例视为需求信号，而不是审计财务表现的替代品。
