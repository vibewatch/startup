  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 决策链从资本支持和工业证明出发，经过披露缺口和上市可比公司的估值下调，落到继续研究建议。
    data:
      nodes:
        - id: capital-breadth
          label: 资本支持面确实宽
          detail: 股权、EIB 债务、补助和担保支撑扩产
        - id: industrial-proof
          label: 工业证明存在
          detail: 西班牙、RWE、P2X 和 BASF 带来真实上行空间，但仍取决于里程碑
        - id: support-dependence
          label: 外部支持依赖仍高
          detail: 公共担保、IPCEI 资金和补贴经济性仍然关键
        - id: disclosure-gap
          label: 核心估值输入仍未公开
          detail: 收入、毛利率、现金、烧钱速度、积压订单质量和优先股堆叠均未披露
        - id: peer-derating
          label: 上市同行已被下调估值
          detail: Nel、ITM、nucera 和 Plug 显示市场挑剔且怀疑
        - id: range-not-mark
          label: 用区间，不用单点估值
          detail: 公开证据支持围绕推断独角兽背景给出区间，而不是精确定价
        - id: recommendation
          label: 继续研究
          detail: 只有坚持严格入场纪律并完成更深私有尽调时才参与
      edges:
        - from: capital-breadth
          to: industrial-proof
          label: 资金让证明点延续
        - from: industrial-proof
          to: support-dependence
          label: 项目仍需要政策和伙伴执行
        - from: support-dependence
          to: disclosure-gap
          label: 支持不能替代经济性可见度
        - from: disclosure-gap
          to: peer-derating
          label: 在怀疑的市场里，不透明更要紧
        - from: peer-derating
          to: range-not-mark
          label: 可比公司信号划定边界
        - from: range-not-mark
          to: recommendation
          label: 进入价格和尽调决定结论
    approximationNotes: 这是决策流，不是按时间缩放的运营模型。它展示了推动本章建议的逻辑依赖。
    claimRefs:
      - CV001
      - CV004
      - CV011
      - CV012
      - CV013
      - CV017
      - CV039
      - CV049
      - CV056
