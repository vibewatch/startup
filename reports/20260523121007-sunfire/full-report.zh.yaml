      - number: '4.3'
        title: 成本结构与毛利率驱动
        blocks:
          - type: paragraph
            body: >-
              虽然 Sunfire 不披露毛利率，公开记录仍给出了有用的成本驱动图。PtJ 的补助通知显示，公司仍需要大规模制造 capex：Saxony 投资约 €263 million，Sunfire 1500+
              项下有一项 €162 million 资助通知。S&P 补充了行业背景：已宣布项目中只有一小部分拿到正向 FID，电解槽成本仍高于 2021 年水平，2030 年前预期降本有限，因为更多支出落在 BOP
              设备上，而不只是堆栈。Sunfire 的产品信息正好瞄准这些压力点：碱性产品强调户外安装、关键部件集中化和更低下游压缩需求，SOEC
              则强调蒸汽带来的效率。这些都是可能改善利润率和客户成本的杠杆，但仍属于公司主张。在 Sunfire
              披露实际成本吸收、保修准备金或服务毛利之前，最稳妥的结论是，利润率改善更多取决于规模、标准化和项目执行纪律，而不是单靠化学路线。
