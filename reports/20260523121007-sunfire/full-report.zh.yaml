  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险堆栈排序与剩余敞口
        blocks:
          - type: paragraph
            body: >-
              Sunfire 面临的不是单一的二元失败点，而是一组相互关联、会彼此放大的项目—市场风险。剩余风险最高的是需求转化：RMI、Belfer、IEEFA
              和德国联邦审计机构的公开证据都指向同一个市场现实——政策雄心、补贴预算、基础设施建设和可融资的承购需求仍未对齐。这一点关键，因为 Sunfire 可见的增长样本——RWE、Repsol 相关炼厂项目和 P2X
              后续项目——正是大型工业项目：只有最终投资决策、辅助系统集成、政策支撑下的经济性同时到位，才会变成收入。第二层风险是资本强度和执行。EIB 自己的项目页明确把 Sunfire
              描述为高风险企业，融资需求高、供应链仍处早期；同业文件也显示，工厂利用率低和 FID 延迟已经压伤行业经济性。第三层是 SOEC 的技术—商业就绪度。Sunfire
              确实有缓释路径，但现场风险还没有被证明已经解决。实际投资含义是：Sunfire 仍有融资能力，也可信；但投资人必须把扩张视为按里程碑闸门推进的基础设施逻辑，而不是一条平滑的设备增长曲线。
