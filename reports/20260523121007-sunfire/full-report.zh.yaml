    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品栈与发展阶段
        blocks:
          - type: paragraph
            body: >-
              应把 Sunfire 视为位于 Dresden 的工业电解槽制造商和清洁技术扩张公司，而不是单纯的氢气生产商、软件供应商或项目开发商。现有法律材料把经营母公司列为 Dresden 的 Sunfire
              SE；公司介绍材料则显示更大的布局，包括 Solingen 的生产和 Berlin 的战略办公室。官方融资和产品材料里的核心产品架构保持一致：Sunfire
              同时销售面向大型工业部署的加压碱性系统，以及面向更高效率、热集成场景的固体氧化物系统。双平台定位很重要，因为它把 Sunfire 锚定在设备和项目执行上，服务炼油商、钢铁厂、化工生产商和 e-fuels
              运营商等难减排客户。后续章节应复用的身份是：一家工业氢硬件公司，商业案例在增加，但扩张故事仍然资本密集。2024 年和 2025 年的大额融资动作支持把公司称为后期阶段；但公开估值、收入和客户数量披露仍然稀疏。
