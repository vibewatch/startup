- id: deployments-maturity-roadmap
  title: Deployment references, maturity split, and roadmap evidence
  body: 'Sunfire''s public deployment evidence is strong enough to separate what is productized from what is still being proven.
    On the alkaline side, the company now has a clear progression from 10 MW references toward repeat 100 MW orders. The 2023
    project roundup ties Sunfire to 10 MW alkaline at RWE, 20 MW alkaline at P2X Harjavalta, and a 30 MW role in Bad Lauchstädt;
    by 2024 RWE had ordered a 100 MW alkaline system for GET H2 Nukleus; by 2026 Sunfire announced two further 100 MW projects
    in Spain for Repsol-linked sites. That trajectory, plus the HyLink Alkaline 23 launch, supports the view that AEL is moving
    from one-off modules toward repeatable industrial blocks.


    SOEC is more nuanced. The evidence is real: MultiPLHY started up a 2.6 MW, 12-module SOEC system at Neste; GrInHy2.0 reached
    industrial operation in steelmaking; GrInHy3.0 is extending the line with new modules. But the public proof remains mostly
    industrial demonstration and funded commercialization work rather than repeat 100 MW commercial orders. Even the best
    sources keep talking about validation programs, operating hours, and follow-on test modules. Investors should therefore
    treat Sunfire''s roadmap as bifurcated. AEL looks like the near-term scale engine, while SOEC is the differentiated platform
    whose commercialization case improves if durability, manufacturing, and heat-integrated deployments keep converting into
    repeatable standard products.'
