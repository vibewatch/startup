- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Sunfire solution
  - Publicly measurable benefit
  - Operational limitation
  enumerationScope:
    coverage: partial
    basis: Rows cover the most visible customer workflows from retained project and product pages, not every contract or service
      workflow used in private delivery.
  rows:
  - - Move from concept to FID on a large hydrogen plant
    - Customer needs site assumptions, operational parameters, and execution scope before investment decision
    - Sunfire offers FEED plus project-definition work with EPC and integration partners
    - 500 MW FEED and Joensuu FEED studies show pre-FID productization
    - Commercial terms, engineering depth, and partner split are not public
  - - Install large-scale alkaline capacity at an industrial site
    - Buyer must select module size, plan civil works, and integrate ancillary systems
    - HyLink Alkaline 22/23 plus installation and commissioning support
    - RWE and Spain references show repeat 100 MW design logic
    - Balance-of-plant and host-site complexity remain external dependencies
  - - Exploit waste heat or steam to reduce electricity demand
    - Industrial host needs a heat source, steam handling, and gas conditioning
    - Sunfire HyLink SOEC for high-temperature, heat-integrated use cases
    - MultiPLHY and GrInHy show refinery and steel integration with higher efficiency claims
    - SOEC proof still depends on industrial demonstration and durability follow-through
  - - Process hydrogen into plant-ready gas and feed it into site operations
    - Hydrogen must be compressed, dried, treated, and tied into existing networks
    - Sunfire module paired with hydrogen processing units and integration partners
    - Salzgitter and Neste show integration into host industrial systems
    - Sunfire does not publicly disclose every interface or control responsibility
  - - Maintain output over the plant life
    - Operator needs monitoring, preventive service, spare parts, and stack strategy
    - Sunfire markets lifecycle service with data-driven monitoring
    - Service offer implies ongoing operational engagement rather than one-time delivery
    - No public uptime, MTBF, or stack-replacement cost metrics
  notes: Workflow rows combine company and partner disclosures. Benefits are public signals, not guaranteed commercial outcomes.
