  evidenceGaps:
  - type: missing-source
    severity: material
    topic: te001-product-commercial-terms
    missingEvidence: Public warranty terms, guaranteed availability, replacement intervals, and installed-base counts for
      the marketed AEL and SOEC modules.
    whyItMatters: Without commercial and field-performance terms, the module matrix remains product-definition rich but underwriting
      light.
    diligencePath: Request current product datasheets, standard warranty schedules, field-failure dashboards, and installed-base
      counts by module generation.
    relatedQuestionRefs:
    - QE002
    - QE012
    relatedTableRefs:
    - TE001
  - type: private-evidence-only
    severity: material
    topic: te003-supplier-map-and-contract-manufacturer
    missingEvidence: Identity of the SOEC contract manufacturer, supplier concentration, manufacturing yield data, and the
      detailed split between Sunfire and partner responsibilities in controls and balance of plant.
    whyItMatters: The architecture and dependency case cannot be fully underwritten if manufacturing throughput and partner
      bottlenecks remain opaque.
    diligencePath: Request the current manufacturing network map, partner responsibility matrix, yield and scrap reports,
      and contingency plans for critical suppliers and integrators.
    relatedQuestionRefs:
    - QE014
    - QE025
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: te004-digital-assurance
    missingEvidence: Independent cyber or software-assurance artifacts for data-driven monitoring and service, such as SOC
      reports, ISO 27001, penetration-test summaries, uptime history, and incident disclosures.
    whyItMatters: Sunfire exposes a monitoring layer and privacy commitments, but outside investors still cannot assess whether
      the digital service surface is operationally hardened.
    diligencePath: Request the latest security questionnaire, third-party audit results, uptime or alerting KPIs, and incident-response
      documentation for service-monitoring systems.
    relatedQuestionRefs:
    - QE021
    relatedTableRefs:
    - TE002
    - TE004
  - type: missing-source
    severity: material
    topic: te005-soec-commercialization-roadmap
    missingEvidence: Module-by-module commercialization milestones for SOEC beyond GrInHy3.0 and MultiPLHY, including stack-replacement
      economics, serial-output targets, and criteria for productizing 10 MW modules at scale.
    whyItMatters: Public roadmap evidence shows technical progress but not the exact path from industrial demonstration to
      repeatable commercial deployment.
    diligencePath: Request the internal SOEC roadmap, target cost-down curve, durability assumptions, stack-service model,
      and customer pipeline by commercialization stage.
    relatedQuestionRefs:
    - QE024
    - QE025
    relatedTableRefs:
    - TE005
