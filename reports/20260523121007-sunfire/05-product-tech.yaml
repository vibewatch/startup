- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Key dependency
  - Primary risk
  enumerationScope:
    coverage: partial
    basis: Sunfire does not publish a full plant architecture; rows synthesize the layers that recur across retained product,
      project, and partner materials.
  rows:
  - - AEL stack and electrochemical core
    - Converts renewable power and water into hydrogen at 30 bar using Sunfire stack technology
    - Cell and stack manufacturing quality; module packaging
    - Yield, degradation, and scale-up execution are not publicly quantified
  - - SOEC cell and steam layer
    - Uses high-temperature steam and heat to improve conversion efficiency
    - Reliable steam or waste-heat source at host site
    - Durability and QA/QC remain critical scale-up risks
  - - Module and system packaging
    - Turns stack technology into 10 MW and 50 MW standardized plant blocks
    - Prefabrication, air-cooling standardization, and outdoor design
    - Public evidence on installation savings is mostly company-claimed
  - - Hydrogen processing and conditioning
    - Compresses, dries, purifies, and routes hydrogen to downstream use
    - Partners such as Paul Wurth/SMS and site-specific balance of plant
    - Interfaces and responsibility boundaries are only partially public
  - - Ancillary systems and controls
    - Water treatment, control technology, and plant auxiliaries keep the system bankable
    - EPC and integration partners such as Bilfinger
    - Execution can bottleneck even when the electrolyzer module is ready
  - - Project engineering and FEED
    - Defines site requirements, operating parameters, and execution path before FID
    - Customer readiness and partner coordination
    - FIDs can slip if engineering, subsidies, or offtake are not aligned
  - - Lifecycle service and telemetry
    - Supports long-life operation through monitoring, maintenance, and spare parts
    - Digital monitoring layer and field service organization
    - No public SLA, uptime, or cyber-assurance data
  - - Manufacturing and compliance backbone
    - Certified sites and production controls support industrial delivery
    - Dresden, Solingen, and SOEC contract-manufacturer path in Saxony
    - Supplier-map opacity and serial-output uncertainty
  notes: This is an analyst reconstruction from public product pages and partner project disclosures, not a company-published
