- id: trust-quality-risks
  title: Trust, compliance, quality controls, and technical risk
  body: 'Sunfire''s public trust surface is better on industrial quality controls than on digital assurance. The company openly
    lists ISO 9001, ISO 45001, ISO 14001, ISO 50001, pressure-equipment certification under PED 2014/68/EU, and DIN EN ISO
    3834-3 welding compliance across Dresden and Solingen, plus a Supplier Code of Conduct and site rules for external organizations.
    That is meaningful because it shows the manufacturing organization has formal control systems and regulated-equipment
    discipline. Sunfire also discloses a privacy policy that references technical and organizational security measures intended
    to preserve confidentiality, integrity, availability, and resilience of systems processing personal data, and its service
    page makes a data-driven monitoring layer explicit.


    The missing piece is external proof on software or field reliability. Public materials do not provide a SOC report, public
    cyber certification, uptime or failure-rate metrics, stack replacement economics, or incident-history disclosure for the
    digital monitoring and service layer. On the electrochemical side, the strongest adverse evidence comes from the SOEC
    journey itself: GrInHy reported contamination and test-bench failures in one long-duration stack test, and DOE materials
    emphasize that large-scale SOEC commercialization still hinges on QA/QC, defect detection, and degradation diagnostics.
    The right diligence conclusion is that Sunfire''s control posture is credible in manufacturing, but its SOEC risk profile
    and digital-service assurance still require private evidence before they should be treated as fully underwritten.'
  claimRefs:
  - CE013
  - CE039
  - CE040
  - CE041
  - CE042
