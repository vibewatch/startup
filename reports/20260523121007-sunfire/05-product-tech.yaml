runDate: '2026-05-23'
company:
  name: Sunfire
chapter:
  number: 5
  title: Product & Technology
  summary: Sunfire's product-tech story is strongest where its pressurized alkaline line is already standardized into repeat
    100 MW deployments with productized service, and weaker where its SOEC line remains differentiated but still demonstration-led.
    The moat is dual-chemistry industrial know-how, European manufacturing, and integration experience; the main open risks
    are SOEC durability and QA/QC, contract-manufacturing opacity, and thin public cyber/reliability disclosure.
sections:
- id: product-portfolio
  title: Product definition, modules, and buyer fit
  body: 'Sunfire should be understood as an industrial electrolyzer vendor that sells plant-ready electrolysis capacity, not
    as a pure stack lab, hydrogen merchant, or generic EPC. The company''s public product surface is organized around two
    chemistries: pressurized alkaline for broad industrial hydrogen projects and SOEC for situations where low-pressure steam
    or industrial waste heat materially improves economics. That distinction is important because it means Sunfire is not
    pushing one universal module into every use case. Instead, the alkaline line is presented as the standardized workhorse
    for refineries, chemicals, ammonia, and other large projects, while SOEC is positioned for heat-integrated steel, refining,
    and e-fuels environments where efficiency gains can justify higher integration complexity.


    What makes the chapter-five product definition more credible than simple marketing is the scope that sits around the modules.
    Sunfire''s portfolio pages and service materials say the company covers FEED, production, pre-assembly, delivery, project
    management, on-site support, maintenance, and digital services. In other words, the product boundary already includes
    engineering and lifecycle support. Public evidence also shows the alkaline range has clearer moduleization and commercial
    maturity than SOEC: HyLink Alkaline 22 and 23 are explicitly marketed for 10 MW and 50 MW plant blocks, whereas HyLink
    SOEC is a more differentiated but still narrower heat-driven proposition. For diligence, the right framing is therefore
    a dual-platform industrial product company whose AEL line looks more commercialized today than its SOEC line.'
  claimRefs:
