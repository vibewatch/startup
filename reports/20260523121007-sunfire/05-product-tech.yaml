tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Product line or module
  - Primary buyer / use case
  - Current public status / maturity
  - Differentiation signal
  - Main diligence gap
  enumerationScope:
    coverage: partial
    basis: Rows cover the productized modules and service layers that are explicitly visible in the retained 2026 public source
      pack, not every contract variant or internal engineering deliverable.
  rows:
  - - HyLink Alkaline 22 (10 MW)
    - Industrial hydrogen projects up to 100 MW; refineries, project developers, utilities
    - Established standardized AEL block with operating references
    - 30 bar pressurized alkaline design and repeat use in RWE, P2X, and Spain follow-on work
    - Need installed-base count, warranty terms, and uptime metrics
  - - HyLink Alkaline 23 (50 MW)
    - Triple-digit megawatt industrial plants
    - New 2026 flagship module built for scale-up
    - Outdoor deployment, centralized key components, high prefabrication, and up to 50% lower TIC claim
    - Need customer-side cost breakdown and first long-run operating data
  - - AEL stack / Solingen manufacturing core
    - Internal manufacturing layer supporting AEL product line
    - Publicly disclosed in-house capability
    - Cell production, galvanization, preassembled stacks, and European-made module framing
    - Need yield, throughput, and supplier concentration data
  - - HyLink SOEC (10 MW standardized module)
    - Heat-integrated refining, steel, and e-fuels applications
    - Differentiated but still earlier commercial stage
    - 89% expected efficiency claim and explicit waste-heat / steam fit
    - Need repeat commercial orders, degradation economics, and stack-replacement cadence
  - - FEED + project execution package
    - Developers and industrial hosts moving toward FID
    - Clearly productized as part of scope of supply
    - FEED, project management, delivery, and on-site support make Sunfire more than a box vendor
    - Need sample scope split versus EPC and partner responsibilities
  - - Service + digital monitoring
    - Operators running plants over decades
    - Publicly marketed lifecycle service layer
    - Data-driven monitoring, preventive maintenance, repairs, and spare parts
    - Need SLA, cyber assurance, and response-time disclosure
  notes: The matrix distinguishes productized AEL offers from SOEC offers that still rely more heavily on heat-integrated
    demonstration evidence and funded commercialization programs.
