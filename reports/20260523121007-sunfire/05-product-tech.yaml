- id: differentiation-manufacturing
  title: Differentiation, manufacturing know-how, and scale dependencies
  body: 'Sunfire''s core differentiation is not only that it sells electrolyzers; many competitors do that. Its stronger claim
    is that it spans two chemistry paths that solve different industrial problems with one delivery organization. AEL offers
    pressure, modularity, lower compression needs, and simplified outdoor deployment for big plants. SOEC offers materially
    better efficiency where steam or waste heat is available. Public project references show those paths are not theoretical:
    Sunfire is applying alkaline to refinery and large hydrogen-hub work while using SOEC in refining, steelmaking, and e-fuels-adjacent
    narratives. The company also has more manufacturing substance than a pure engineering shop. Public materials point to
    cell production and galvanization in Solingen, certified manufacturing and pressure-equipment controls, and industrialization
    programs targeting 1 GW/year of AEL and 500 MW/year of SOEC capacity.


    That said, the moat is not frictionless. InvestEU makes clear that at least part of the SOEC early production-capacity
    build is installed at a contract manufacturer in Saxony, not only inside Sunfire''s own facilities. Public sources also
    stop short of naming the contract manufacturer, disclosing yields, or showing actual serial output. The result is a moat
    built on process know-how, integration experience, and dual-chemistry fit, but one that still depends on manufacturing
    execution and partner capacity rather than on an easily audited software-like platform advantage.'
  claimRefs:
  - CE010
  - CE016
  - CE032
  - CE033
