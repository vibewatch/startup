    {
      "id": "founders-leadership-governance",
      "title": "Founders, Leadership, and Governance",
      "body": "Sunfire's leadership record is strongest around the founders and current management board, and weakest around deeper control detail. Official and third-party reporting support a 2010 founding by Nils Aldag, Christian von Olshausen, and Carl Berninghausen. A material leadership transition occurred in November 2020, when Aldag moved into the CEO role and Berninghausen shifted from CEO to supervisory-board chair, while new COO and CFO roles were added to help industrialize the business. Today's imprint shows a different formal management board: Aldag, von Olshausen, Frank Posnanski, and Jens Henneberg, with Dr. Frank Mastiaux as supervisory-board chair. That creates a usable leadership baseline for later chapters, but not a full governance map. The retained pack still does not expose the full supervisory-board roster, economic control rights, shareholder preferences, or the current role of Berninghausen beyond historical materials. Governance diligence should therefore focus on cap-table control, board composition, and any investor-specific protective rights that sit behind the public financing headlines.",
