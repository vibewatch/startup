    "number": 1,
    "title": "Company Overview",
    "summary": "Sunfire is a Dresden-based industrial electrolyzer maker with both pressurized alkaline and SOEC product lines, a public 2024 financing package exceeding €500 million, and an additional €200 million guarantee facility in 2025. Industrial references with RWE, Repsol, and the MultiPLHY consortium show tangible commercial progress across both technology platforms. The main open issues are still valuation, revenue or ARR, precise current headcount, customer-count disclosure, and the full governance or cap-table picture."
  },
  "sections": [
    {
      "id": "identity-product-stage",
      "title": "Identity, Product Stack, and Stage",
      "body": "Sunfire should be treated as a Dresden-based industrial electrolyzer manufacturer and cleantech scale-up rather than as a hydrogen producer, software vendor, or project developer alone. Current legal materials identify the operating parent as Sunfire SE in Dresden, while the company's about materials show a broader footprint with production in Solingen and a strategic office in Berlin. The company's core product architecture is consistent across official financing and product materials: Sunfire sells both pressurized alkaline systems for large industrial deployments and solid oxide systems for higher-efficiency, heat-integrated use cases. That dual-platform positioning matters because it anchors Sunfire in equipment and project execution for hard-to-abate customers such as refiners, steelmakers, chemicals producers, and e-fuels operators. The right reusable identity for later chapters is therefore an industrial-hydrogen hardware company with growing commercial references and a capital-intensive scaling story. Large 2024 and 2025 financing steps support describing the company as late-stage, but public valuation, revenue, and customer-count disclosure remain thin.",
