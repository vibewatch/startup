  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public-litigation-checks
    missingEvidence: German and EU court or enforcement-registry results that explicitly confirm whether Sunfire faces any active public litigation, enforcement, or sanctions matters.
    whyItMatters: The retained source set supports a regulatory-execution view, but a live public case would re-rank legal risk and could affect financing, customer diligence, or procurement eligibility.
    diligencePath: Run counsel-supported searches across German commercial courts, EU sanctions and competition records, and relevant environmental and labor registries; archive the query outputs.
    relatedQuestionRefs:
    - QR006
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: contract-economics-and-warranty
    missingEvidence: Customer contract terms covering warranty reserves, liquidated damages, milestone billing, cash-collateral mechanics, and cancellation rights.
    whyItMatters: Public financing support only partly answers whether Sunfire can absorb warranty events or long commissioning cycles without margin compression or liquidity stress.
    diligencePath: Request anonymised customer contracts, warranty reserve policy, bank-facility covenants, and management commentary on advance-payment usage and contingent liabilities.
    relatedQuestionRefs:
    - QR020
    relatedTableRefs:
    - TR005
    - TR006
  - type: private-evidence-only
    severity: material
    topic: fleet-reliability-and-replacement-economics
    missingEvidence: Installed-base uptime, degradation curves, stack replacement cadence, and field-failure statistics for both AEL and SOEC projects.
    whyItMatters: Public technical papers show real SOEC degradation mechanisms, but investors still cannot underwrite warranty exposure, service margins, or repeat-order quality without fleet-level operating data.
    diligencePath: Ask for project-level uptime dashboards, service records, replacement logs, and third-party performance tests from Harjavalta, MultiPLHY, and any early 100 MW AEL deployments.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: revenue-and-backlog-concentration
    missingEvidence: Backlog and revenue broken down by customer, project stage, geography, product line, and margin profile, including cancellation rights and FID status.
    whyItMatters: Public sources prove named demand, but they do not show how much of Sunfire’s future revenue depends on a few refinery and hydrogen-hub programs moving from award to cash collection.
    diligencePath: Request backlog aging, top-customer exposure, project-stage waterfall, cancellation assumptions, and scenario analysis for delayed RWE, Repsol, and P2X programs.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR003
    - TR005
