- id: TR006
  title: Mitigation and thesis-break criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Why it matters
  - Action implication
  rows:
  - - Demand conversion / subsidy dependence
    - Flagship project schedule slips
    - RWE 300 MW or Spain 2x100 MW moves materially beyond current 2027 or 2029 milestones without replacement wins
    - Would show that visible backlog is not converting on the timetable needed to support utilisation and financing confidence.
    - Downgrade conviction; rework revenue-timing and cash-needs case before adding capital.
  - - RFNBO and certification execution
    - Certification plan remains incomplete
    - No site-specific RFNBO owner, audit plan, or customer compliance path for major projects by next diligence review
    - Would imply that policy qualification remains aspirational rather than execution-ready.
    - Treat eligibility risk as unresolved and demand covenant protection or milestone-based funding.
  - - SOEC durability
    - Long-duration validation underdelivers
    - BASF Schwarzheide or other long-run tests fail to produce stable degradation evidence through the next refresh cycle
    - Would leave SOEC as a strategic option rather than an underwritable scale product.
    - Value Sunfire primarily on AEL and haircut SOEC upside materially.
  - - Working capital / warranty exposure
    - Support bridge weakens
    - Guarantee availability tightens, collateral usage rises, or management cannot explain warranty-risk sizing
    - Would expose how much of the current execution pace depends on external backstops.
    - Assume slower build-out, higher dilution risk, or both.
  - - Competitive price pressure
    - Peers keep factories underutilised while buyers multi-source
    - Tender awards increasingly split across vendors and peer disclosures continue to show low-utilisation margin pressure
    - Would make cost-down claims harder to monetise even if the product works technically.
    - Demand sharper pricing and margin evidence before underwriting large-volume upside.
  - - Customer concentration
    - One flagship account stalls without replacement demand
    - A visible RWE, Repsol-linked, or P2X program pauses and Sunfire cannot point to equivalent new funded capacity
    - Would expose the difference between named-logo momentum and diversified revenue quality.
    - Reduce forward-volume assumptions and raise required return threshold.
  notes: Thresholds are diligence heuristics tied to public milestone visibility rather than to contractual covenants. They should be refreshed whenever the source pack changes.
