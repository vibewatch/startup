- id: manufacturing-technology-and-operational-execution
  title: Manufacturing, technology, and operational execution
  body: 'Operational risk is split between an AEL industrialisation story that is getting more productised and a SOEC story that still needs long-duration validation. On the positive side, Sunfire has built meaningful mitigants: the HyLink Alkaline 23 launch claims much larger module size, lower installation complexity, and up to 50% lower installed cost for customers, while the guarantee line reduces working-capital friction on parallel projects. But the residual exposure is still material because the economics of electrolyser projects are driven by system integration, BoP, commissioning, and financing as much as by the stack itself. The World Bank explicitly says EPC, civil works, permitting, and financing dominate total project cost, and CORDIS highlights persistent low-volume manufacturing bottlenecks across the sector. SOEC adds an extra layer of uncertainty. The DLR-Sunfire paper documents a severe degradation mechanism and warns that feed-gas quality requirements remain unclear, which
    is precisely why Sunfire’s new BASF-site test facility matters. That BASF program is a mitigation, not proof of closure. Until investors see fleet-level uptime, degradation, and replacement economics, the technical risk on SOEC remains materially higher than the AEL risk, even if Sunfire’s public roadmap is directionally credible.'
