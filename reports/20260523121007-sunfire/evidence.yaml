    whyItMatters: Older references can overstate current commercial traction if their present status is not refreshed.
    diligencePath: >-
      Ask management to refresh the status, lessons learned, and current commercial relevance of every pre-2025 SOEC
      reference.
    relatedQuestionRefs:
      - QU018
      - QU026
