      - QU020
      - QU021
      - QU028
    relatedTableRefs:
      - TU005
  - type: missing-source
    severity: material
    topic: operating-outcomes
    missingEvidence: >-
      Independent utilization, uptime, output, and customer-satisfaction data for operating references such as
      Harjavalta are missing.
    whyItMatters: >-
      Commercial operation matters more when it is accompanied by evidence on reliability, realized production, and
      customer economics.
    diligencePath: >-
      Request plant-level operating KPIs, availability data, and customer reference calls for Harjavalta and any other
      live systems.
    relatedQuestionRefs:
      - QU007
      - QU028
