    whyItMatters: >-
      Public roadmap evidence shows technical progress but not the exact path from industrial demonstration to
      repeatable commercial deployment.
    diligencePath: >-
      Request the internal SOEC roadmap, target cost-down curve, durability assumptions, stack-service model, and
