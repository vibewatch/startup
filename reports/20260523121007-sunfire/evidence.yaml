evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      A full supervisory-board roster, cap table, shareholder rights schedule, and any investor board-seat or veto-right
      information.
    whyItMatters: >-
      Public financing visibility is high, but control and governance remain too opaque to assess decision rights or
      downside protection.
    diligencePath: Request the current shareholder agreement, board materials, and a cap-table summary in the data room.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: A disclosed post-money valuation, recent financing price, or credible secondary mark for Sunfire as of 2026.
    whyItMatters: Valuation is required to benchmark dilution, investor returns, and any later valuation chapter conclusions.
    diligencePath: Obtain the Series E closing deck, cap table, or a board-approved fair-value memo.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A dated companywide employee count with geography and legal-entity scope definition.
    whyItMatters: >-
      Public sources show 500+, 650+, and 700+ people at different points, which is directionally positive but not
      precise enough for KPI use.
    diligencePath: Request an HR headcount file or a board report that reconciles employee numbers across Sunfire entities.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Current revenue, ARR, gross margin, and backlog-to-revenue conversion data.
    whyItMatters: The chapter can prove financing and industrial relevance, but not commercial efficiency or monetization quality.
    diligencePath: Request the latest management accounts, budget, and revenue bridge from bookings to recognized revenue.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: customer-count
    missingEvidence: >-
      A current count of active industrial customers, contracted projects, or installed-account base with a clear
      definition.
    whyItMatters: Project examples show commercial traction, but they do not reveal customer concentration or breadth of adoption.
    diligencePath: Request a customer list or pipeline summary that distinguishes signed contracts, live sites, and pilots.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: sam-som-precision
    missingEvidence: >-
      Sunfire segment-level ASPs, scope of supply, backlog by stage, and conversion assumptions by technology and
      geography.
    whyItMatters: >-
      Without priced scope and stage-weighted conversion, public market lenses cannot be translated into revenue SAM or
      underwriting SOM.
    diligencePath: >-
      Request backlog and pipeline by FEED, FID, NTP, and commissioning date; break out average scope value per MW for
      AEL and SOEC projects.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-ownership
    missingEvidence: >-
      Customer-level procurement maps showing who controls final budget approval for refinery, utility, steel, and
      chemical projects.
    whyItMatters: >-
      Public sources show examples, but not enough detail to generalize the exact payer and approval workflow across
      Sunfire segments.
    diligencePath: >-
      Ask management for recent deal teams, named budget owners, and procurement steps for at least one refinery, one
      utility hub, and one project-developer win.
    relatedQuestionRefs:
      - QM014
    relatedTableRefs:
      - TM003
  - type: enumeration-incomplete
    severity: material
    topic: ammonia-chemicals-demand
    missingEvidence: >-
      A disclosed European project list showing which ammonia and chemical plants are at FEED, FID, or construction and
      which technology route they selected.
    whyItMatters: >-
      Ammonia is strategically important, but public evidence in this chapter is stronger on policy and use-case logic
      than on a complete buyer-by-buyer enumeration.
    diligencePath: >-
      Build a customer list from Observatory project data, IPCEI awards, and management CRM, then map each project to
      stage, electrolyzer technology, and likely procurement date.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: project-economics
    missingEvidence: >-
      Customer LCOH models showing electricity-price assumptions, subsidy dependence, and fallback economics versus grey
      hydrogen or electrification.
    whyItMatters: >-
      The most material uncertainty for adoption timing is whether real projects stay bankable if power prices or
      support terms move against them.
    diligencePath: >-
      Obtain project-level economics for at least one refinery, one utility hub, and one e-fuels project, including
      sensitivity to power cost, utilization, and subsidy withdrawal.
    relatedQuestionRefs:
      - QM017
      - QM019
      - QM024
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Quoted ASP, EPC split, service-fee structure, discounting behavior, and warranty pricing for Sunfire and named
      peers.
    whyItMatters: >-
      Without contract-level price structure, it is hard to separate genuine product differentiation from financing or
      scope packaging.
    diligencePath: >-
      Request anonymized bid sheets, service-term summaries, and at least two recent project capex breakdowns from
      management or customers.
    relatedQuestionRefs:
      - QP013
      - QP026
  - type: missing-source
    severity: material
    topic: soec-durability
    missingEvidence: >-
      Comparable field-degradation, uptime, replacement-cycle, and warranty-loss data for commercial SOEC deployments
      versus AWE and PEM.
    whyItMatters: >-
      Sunfire’s premium efficiency story is strongest if lifetime and maintenance assumptions hold at industrial duty
      cycles.
    diligencePath: >-
      Obtain monitored fleet data, stack-replacement history, and LTSA performance reports from Sunfire, Topsoe, and
      customers with operating assets.
    relatedQuestionRefs:
      - QP027
  - type: private-evidence-only
    severity: material
    topic: win-rate-and-conversion
    missingEvidence: >-
      Tender win rates, backlog-by-stage, conversion timing, and lost-deal reasons across Sunfire, Nel, nucera, ITM, and
      SOEC alternatives.
    whyItMatters: >-
      Competitive position depends not just on product claims but on who actually converts FEED studies and pilot
      references into paid plants.
    diligencePath: >-
      Ask management for staged pipeline data, anonymized lost-deal postmortems, and customer references that explain
      why Sunfire won or lost recent tenders.
    relatedQuestionRefs:
      - QP026
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure-gap
    missingEvidence: >-
      Audited 2025 and latest-trailing-period recognized revenue, revenue mix by product line, and any ARR-like service
      revenue disclosure.
    whyItMatters: >-
      Without recognized revenue and mix, it is impossible to test whether MW awards and engineering wins are converting
      into bankable financial scale.
    diligencePath: >-
      Request audited financial statements, management accounts, and project-level revenue-recognition schedules from
      management or investors.
    relatedQuestionRefs:
      - QI023
    relatedTableRefs:
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-disclosure-gap
    missingEvidence: Latest balance sheet, current cash balance, monthly burn, planned capex, covenant headroom, and runway model.
    whyItMatters: >-
      Public funding access does not reveal whether Sunfire can self-fund delays, warranty events, or slower order
      conversion.
    diligencePath: >-
      Request board reporting pack with monthly cash bridge, debt/grant draw schedules, and base / downside runway
      assumptions.
    relatedQuestionRefs:
      - QI024
    relatedTableRefs:
      - TI006
  - type: private-evidence-only
    severity: blocking
    topic: margin-disclosure-gap
    missingEvidence: Gross margin by alkaline, SOEC, engineering, and service lines plus warranty reserve and field-failure history.
    whyItMatters: >-
      Sunfire’s public story rests on lower installed cost and efficiency, but those claims do not show whether the
      company itself earns attractive margins.
    diligencePath: Request product-line gross margin walk, reserve accounting policy, and post-commissioning service economics.
    relatedQuestionRefs:
      - QI025
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Order-level ASPs, discount bands, payment terms, milestone schedules, and evidence of how TIC claims affect
      realized pricing.
    whyItMatters: >-
      Without realized pricing, investors cannot tell whether Sunfire captures cost-down benefits itself or passes them
      through to win projects.
    diligencePath: Review sample contracts, bid summaries, and pricing committee materials for recent large projects.
    relatedQuestionRefs:
      - QI017
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top-customer revenue share, backlog concentration, warranty reserve by project, and working-capital exposure by
      counterparty.
    whyItMatters: >-
      Large-project businesses can look de-risked in public while still depending heavily on a small number of
      counterparties or concentrated warranty risk.
    diligencePath: >-
      Request customer concentration analysis, backlog aging, advance-payment schedules, and reserve roll-forwards by
      major project.
    relatedQuestionRefs:
      - QI026
    relatedTableRefs:
      - TI005
      - TI006
  - type: missing-source
    severity: material
    topic: te001-product-commercial-terms
    missingEvidence: >-
      Public warranty terms, guaranteed availability, replacement intervals, and installed-base counts for the marketed
      AEL and SOEC modules.
    whyItMatters: >-
      Without commercial and field-performance terms, the module matrix remains product-definition rich but underwriting
      light.
    diligencePath: >-
      Request current product datasheets, standard warranty schedules, field-failure dashboards, and installed-base
      counts by module generation.
    relatedQuestionRefs:
      - QE002
      - QE012
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: te003-supplier-map-and-contract-manufacturer
    missingEvidence: >-
      Identity of the SOEC contract manufacturer, supplier concentration, manufacturing yield data, and the detailed
      split between Sunfire and partner responsibilities in controls and balance of plant.
    whyItMatters: >-
      The architecture and dependency case cannot be fully underwritten if manufacturing throughput and partner
      bottlenecks remain opaque.
    diligencePath: >-
      Request the current manufacturing network map, partner responsibility matrix, yield and scrap reports, and
      contingency plans for critical suppliers and integrators.
    relatedQuestionRefs:
      - QE014
      - QE025
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: te004-digital-assurance
    missingEvidence: >-
      Independent cyber or software-assurance artifacts for data-driven monitoring and service, such as SOC reports, ISO
      27001, penetration-test summaries, uptime history, and incident disclosures.
    whyItMatters: >-
      Sunfire exposes a monitoring layer and privacy commitments, but outside investors still cannot assess whether the
      digital service surface is operationally hardened.
    diligencePath: >-
      Request the latest security questionnaire, third-party audit results, uptime or alerting KPIs, and
      incident-response documentation for service-monitoring systems.
    relatedQuestionRefs:
      - QE021
    relatedTableRefs:
      - TE002
      - TE004
  - type: missing-source
    severity: material
    topic: te005-soec-commercialization-roadmap
    missingEvidence: >-
      Module-by-module commercialization milestones for SOEC beyond GrInHy3.0 and MultiPLHY, including stack-replacement
