    relatedQuestionRefs:
      - QU016
      - QU017
      - QU028
    relatedTableRefs:
      - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, backlog concentration, and sector mix by revenue are not public.
    whyItMatters: >-
      The visible customer set is concentrated enough that one or two delayed projects could change the revenue profile
      materially.
    diligencePath: Obtain a top-10 customer schedule with revenue, backlog, stage, payment milestones, and cancellation rights.
