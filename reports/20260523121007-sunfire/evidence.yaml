    relatedQuestionRefs:
      - QE024
      - QE025
    relatedTableRefs:
      - TE005
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table
    missingEvidence: >-
      A complete customer ledger showing every operating plant, signed order, FEED study, pilot, and inactive reference
