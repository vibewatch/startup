- id: adoption-drivers-and-constraints
  title: Growth drivers, bottlenecks, and adverse evidence
  body: 'The growth case rests on real policy and customer pull, but it is not self-executing. Europe now has binding renewable-hydrogen targets, a hydrogen-market package, and a Hydrogen Bank meant to bridge the cost gap between renewable hydrogen supply and what buyers will pay. Those tools matter because hydrogen projects remain capital intensive and often depend on stacked grants, guarantees, IPCEI support, and premium mechanisms. Yet independent evidence remains skeptical on timing. Hydrogen Council attributes delays and cancellations to renewable-power prices, inflation, supply-chain issues, and unsettled regulation. IEA shows funding became more targeted but also smaller in aggregate, meaning each project still competes hard for support. IEEFA is more explicitly adverse, arguing that hydrogen infrastructure can be overbuilt if utilization assumptions are too optimistic and that electrification often remains cheaper in many end uses. DNV and Hitachi add the operational constraint:
    low-cost electricity, high utilization, and strong grid connections are not optional; they are central to whether project economics work at all. The result is a market that can grow quickly, but only where policy support, affordable power, and credible offtake line up at the same time.'
