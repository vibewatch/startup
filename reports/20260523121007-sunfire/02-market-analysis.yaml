  - type: private-evidence-only
    severity: material
    topic: sam-som-precision
    missingEvidence: Sunfire segment-level ASPs, scope of supply, backlog by stage, and conversion assumptions by technology and geography.
    whyItMatters: Without priced scope and stage-weighted conversion, public market lenses cannot be translated into revenue SAM or underwriting SOM.
    diligencePath: Request backlog and pipeline by FEED, FID, NTP, and commissioning date; break out average scope value per MW for AEL and SOEC projects.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-ownership
    missingEvidence: Customer-level procurement maps showing who controls final budget approval for refinery, utility, steel, and chemical projects.
    whyItMatters: Public sources show examples, but not enough detail to generalize the exact payer and approval workflow across Sunfire segments.
    diligencePath: Ask management for recent deal teams, named budget owners, and procurement steps for at least one refinery, one utility hub, and one project-developer win.
    relatedQuestionRefs:
    - QM014
    relatedTableRefs:
    - TM003
  - type: enumeration-incomplete
    severity: material
    topic: ammonia-chemicals-demand
    missingEvidence: A disclosed European project list showing which ammonia and chemical plants are at FEED, FID, or construction and which technology route they selected.
    whyItMatters: Ammonia is strategically important, but public evidence in this chapter is stronger on policy and use-case logic than on a complete buyer-by-buyer enumeration.
