- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Market impact
  - Evidence
  - Diligence ask
  rows:
  - - EU binding targets and gas-market package
    - Positive
    - Current to 2030
    - Creates long-run demand signal and infrastructure rules
    - Binding industry / transport targets plus hydrogen package
    - Check member-state implementation for target sectors
  - - European Hydrogen Bank premiums
    - Positive
    - Current
    - Bridges early cost gap and supports bankability
    - Fixed €/kg support and market-matching tools
    - Request awarded vs withdrawn projects by round
  - - Stacked grants, guarantees, and IPCEI support
    - Positive but dependency-creating
    - Current
    - Enables projects that may not clear on standalone economics
    - Observatory funding inventory and EU guarantee schemes
    - Quantify subsidy share in each target project
  - - Renewable electricity prices and utilization
    - Negative
    - Immediate
    - Directly determines LCOH and project viability
    - Hydrogen Council, DNV, and IEEFA all flag power-cost pressure
    - Obtain customer economics under real power curves
  - - RFNBO and certification clarity
    - Mixed
    - Immediate to 2027
    - Improves compliance certainty but can slow project preparation
    - IEA and Commission both highlight certification progress
    - Ask which projects already have qualifying power contracts
  - - Grid connection and power-quality constraints
    - Negative
    - Immediate
    - Can delay or resize large electrolyzer plants
    - Hitachi describes high-voltage and harmonics issues for DRI-scale plants
    - Request interconnection studies and energization dates
  - - Project attrition and cancellation risk
    - Negative
    - Immediate to 2030
    - Reduces sell-through versus announcement pipeline
    - Hydrogen Council and IEEFA both show material conversion risk
    - Track Sunfire pipeline by FEED, FID, NTP, and commissioning
  - - Alternative decarbonization routes
    - Negative / selective
    - Structural
    - Limits adoption in end uses where electrification or recycling is cheaper
    - IEEFA, JRC, and BNEF point to competing pathways
    - Test segment ROI versus hydrogen and non-hydrogen options
  notes: This table mixes policy tailwinds with adverse operating realities. Impact statements are analytical summaries of the retained evidence rather than management guidance.
