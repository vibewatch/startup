- id: valuation-implications-and-gaps
  title: Valuation implications and market diligence gaps
  body: For diligence purposes, the important conclusion is not that hydrogen is large, but that Sunfire’s addressable market is gated by project readiness. Policy ambition, auction demand, and heavy-industry decarbonization all support a substantial long-run market. However, the nearer-term SOM that matters for valuation is the subset of projects that can secure power, subsidies, permits, grid integration, and real industrial offtake. Public evidence is not enough to isolate that number with precision. Investors still need segment-level win rates, average selling prices by technology and scope, backlog conversion by stage, and customer economics under realistic electricity and subsidy assumptions. That uncertainty does not invalidate the market; it changes the underwriting lens. Sunfire looks best positioned where a buyer already has an industrial hydrogen use case or can monetize a premium product such as e-methanol, lower-carbon fuels, or steel decarbonization. It looks much less certain
    where market adoption depends on speculative infrastructure buildout or on cost parity arriving faster than current evidence suggests.
