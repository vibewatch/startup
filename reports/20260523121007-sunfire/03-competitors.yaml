- id: bankability-gtm-and-pricing
  title: Bankability, GTM, disclosure posture, and pricing opacity
  body: Commercially, Sunfire’s challenge is not that it lacks proof points; it is that some peers disclose more bankability signals in public. Nel publishes installed-base and annual-report commentary, ITM publishes cash and backlog, nucera publishes installed capacity and order intake, and Plug files detailed risk language through the SEC. Topsoe and Bloom also benefit from broader industrial or enterprise platforms that can reassure customers and lenders. Sunfire counters with repeat-order language, named industrial references, and a 50 MW alkaline module that it says cuts total installed cost. That is credible evidence of traction, but it is still less transparent than public backlog or balance-sheet reporting. Pricing also remains structurally opaque across the sector. Public sources rarely offer list prices; instead they market lower LCOH, lower total installed cost, or stronger guarantees. For diligence, that means GTM quality, financing support, and scope packaging matter as much
    as hardware performance.
  claimRefs:
