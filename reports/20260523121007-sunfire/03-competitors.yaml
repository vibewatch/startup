- id: TP005
  title: Moat durability / competitive risk register
  columns:
  - Sunfire moat claim
  - Supporting evidence
  - Threat or disconfirming evidence
  - Severity
  - Diligence ask
  rows:
  - - Dual-platform optionality
    - Sunfire can sell SOEC or alkaline depending on process fit
    - Execution focus is split across two technology roadmaps while rivals optimize one
    - medium
    - Ask for roadmap staffing, manufacturing allocation, and service burden by platform
  - - Industrial customer credibility
    - Sunfire cites repeat 100 MW-class orders and named projects with RWE and Repsol
    - Public installed-base disclosure is still thinner than Nel or nucera
    - medium
    - Request full installed fleet, uptime, and backlog-by-stage disclosures
  - - High-efficiency SOEC economics
    - Sunfire and Topsoe both market meaningful efficiency uplift with waste heat
    - Comparable lifetime and degradation data remain sparse in public
    - high
    - Request third-party field-performance and stack-replacement data
  - - Alkaline module cost-down
    - Sunfire says HyLink Alkaline 23 cuts TIC up to 50%
    - Chinese price benchmarks and large AWE incumbents can still compress tender pricing
    - high
    - Request recent bid comparisons against Chinese, Nel, and nucera offers
  - - European bankability niche
    - European industrial buyers may value local references and project support
    - Topsoe, Nel, nucera, ITM, and Plug all report delayed or slower project timing in some form
    - high
    - Request win/loss analysis for delayed projects and why buyers did or did not reach FID
  notes: Severity reflects how directly each threat can impair pricing power or win rates. The risk register is evidence-backed but intentionally conservative because private tender data is unavailable.
