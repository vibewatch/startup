- id: moat-durability-and-adverse-evidence
  title: Moat durability, Chinese pressure, and the adverse case
  body: 'The adverse case is not that Sunfire has no moat; it is that the moat may not be durable in every segment. Larger incumbents have better public disclosure and, in some cases, deeper balance-sheet or channel signals. Chinese alkaline manufacturers are resetting global price expectations, especially for AWE, even if landed project economics outside China remain less dramatic once EPC and integration costs are included. Topsoe’s 2025 report and Nel’s 2025 report both show that even well-capitalized platforms still suffer from postponed FIDs, cancellations, and slower revenue conversion. That matters because Sunfire’s strongest attributes—dual-platform optionality, repeat customers, heat-integrated SOEC economics, and larger alkaline modules—create value mainly when projects actually reach financing and execution. The most important competitive conclusion is therefore segmentation: Sunfire has a defendable position in European industrial projects that reward process fit and efficiency,
    but it is structurally more exposed in commoditizing lowest-capex alkaline tenders and in markets where buyers prize balance-sheet transparency over technical nuance.'
