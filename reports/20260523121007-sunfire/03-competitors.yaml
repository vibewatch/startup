  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Quoted ASP, EPC split, service-fee structure, discounting behavior, and warranty pricing for Sunfire and named peers.
    whyItMatters: Without contract-level price structure, it is hard to separate genuine product differentiation from financing or scope packaging.
    diligencePath: Request anonymized bid sheets, service-term summaries, and at least two recent project capex breakdowns from management or customers.
    relatedQuestionRefs:
    - QP013
    - QP026
  - type: missing-source
    severity: material
    topic: soec-durability
    missingEvidence: Comparable field-degradation, uptime, replacement-cycle, and warranty-loss data for commercial SOEC deployments versus AWE and PEM.
    whyItMatters: Sunfire’s premium efficiency story is strongest if lifetime and maintenance assumptions hold at industrial duty cycles.
    diligencePath: Obtain monitored fleet data, stack-replacement history, and LTSA performance reports from Sunfire, Topsoe, and customers with operating assets.
    relatedQuestionRefs:
    - QP027
  - type: private-evidence-only
    severity: material
    topic: win-rate-and-conversion
    missingEvidence: Tender win rates, backlog-by-stage, conversion timing, and lost-deal reasons across Sunfire, Nel, nucera, ITM, and SOEC alternatives.
    whyItMatters: Competitive position depends not just on product claims but on who actually converts FEED studies and pilot references into paid plants.
    diligencePath: Ask management for staged pipeline data, anonymized lost-deal postmortems, and customer references that explain why Sunfire won or lost recent tenders.
    relatedQuestionRefs:
    - QP026
