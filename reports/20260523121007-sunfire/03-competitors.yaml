callouts:
- calloutType: insight
  title: Most important competitive conclusion
  body: Sunfire does not look like the cheapest or most publicly bankable electrolyzer vendor on paper; it looks like a process-fit specialist whose upside comes from dual-platform industrial use cases where buyers value both bankable alkaline today and SOEC efficiency later.
  claimRefs:
  - CP044
  - CP045
  - CP046
- calloutType: risk
  title: Where the adverse case bites hardest
  body: The adverse case is concentrated in commoditizing alkaline tenders and in delayed Power-to-X projects, because larger incumbents and Chinese price benchmarks can compress margins before Sunfire’s efficiency and service claims have time to matter.
  claimRefs:
  - CP040
  - CP043
  - CP045
