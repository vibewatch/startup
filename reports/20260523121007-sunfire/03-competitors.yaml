  title: Competitor profile table
  columns:
  - Company / option
  - Category
  - Core tech / scope
  - Scale or bankability signal
  - Main edge versus Sunfire
  - Main limitation versus Sunfire
  rows:
  - - Sunfire
    - Direct peer
    - SOEC + pressurized alkaline
    - Named 100 MW and 200 MW projects; repeat-order language; 50 MW alkaline module
    - Only vendor in this peer set with a visible dual-platform industrial story
    - Less public installed-base and balance-sheet disclosure than listed incumbents
  - - Nel
    - Direct peer / incumbent
    - Alkaline + PEM
    - 3,800+ installed electrolyzers; one-GW new alkaline capacity decision; Samsung E&A tie-up
    - Large installed base and strong public disclosure
    - No high-temperature SOEC option
  - - thyssenkrupp nucera
    - Incumbent
    - Industrial alkaline (AWE)
    - '>10 GW installed; >3 GW contracted; 600+ projects; 300 MW Moeve order'
    - Strongest public industrial alkaline scale and project-execution narrative
    - Single-platform focus versus Sunfire’s optionality
  - - ITM Power
    - Direct peer
    - PEM
    - '>400 MW delivered or in execution; £145.1m backlog; £207m cash'
    - Clear public liquidity and backlog signals with large PEM references
    - No alkaline or SOEC route; economics depend on PEM fit
  - - Plug Power
    - Direct peer / adjacent
    - Integrated PEM platform plus production and liquefaction
    - SEC filing, production plants, 5 MW and 10 MW building blocks
    - Broader hydrogen-platform pitch and public-company disclosure
    - Execution, liquidity, and project-delay warnings are unusually explicit
  - - Topsoe
    - SOEC-adjacent direct peer
    - SOEC plus downstream Power-to-X platform
    - 500 MW SOEC factory; performance guarantees; 2,800+ employees
    - Very strong downstream integration and waste-heat story
    - Projects still depend on delayed FIDs; no alkaline line
  - - Bloom Energy
    - SOEC-adjacent direct peer
    - Solid oxide platform for hydrogen and power
    - '>2 GW electrolyzer manufacturing; Fortune 100 relationships'
    - Enterprise credibility and very strong efficiency marketing
    - Hydrogen offer sits inside broader distributed-energy strategy
  - - Linde Engineering / EPC route
    - Adjacent alternative
    - Plant engineering, integration, hydrogen processing
    - Thousands of industrial plants delivered globally
    - Lets buyers separate plant execution from OEM stack choice
    - Not a differentiated dual-platform electrolyzer OEM itself
  notes: Rows compare how buyers would encounter each option in a real project. Scale signals use only publicly disclosed indicators and do not imply equal revenue scale or profitability.
