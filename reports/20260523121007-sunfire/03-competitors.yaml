  - - Choose mature large-scale AWE incumbent
    - Prioritize installed base, disclosure, and alkaline bankability
    - thyssenkrupp nucera, Nel
    - Medium before FEED, higher after vendor-specific engineering
    - High in lowest-capex alkaline tenders
    - nucera and Nel publish scale and backlog or installed-base signals
  - - Choose PEM specialist
    - Prioritize low-temperature dynamics and public-company transparency
    - ITM, Plug
    - Medium before engineering freeze
    - Moderate in PEM-first use cases
    - ITM and Plug disclose modular PEM paths and public risk / balance-sheet information
  - - Use EPC-led multi-sourcing
    - Separate stack choice from plant execution and financing structure
    - Linde or other major plant integrators
    - Lower early lock-in; higher later if EPC package is fixed
    - Moderate across very large projects
    - Linde highlights thousands of industrial plants and hydrogen engineering services
  - - Internal build / competitive bake-off
    - Retain procurement leverage until late stage
    - Industrial owner, developer, EPC, and multiple OEMs
