- id: technology-and-capability
  title: Capability, technology fit, and where Sunfire is actually different
  body: The most important technology nuance is that Sunfire’s differentiation is conditional, not universal. Its SOEC platform matters where steam or waste heat are available and where downstream ammonia, methanol, SAF, or other molecule production values lower electricity consumption. Its pressurized alkaline platform matters where buyers want standardized, bankable modules for 100 MW-plus industrial projects. That is different from PEM specialists such as ITM and Plug, which emphasize dynamic response and modular low-temperature systems, and from nucera, which emphasizes mature large-scale AWE with single-cell maintainability and lifecycle service. Topsoe and Bloom overlap most directly with Sunfire on the efficiency narrative, but both pair that with their own manufacturing-scale and service claims. The net effect is that Sunfire is strongest when the customer values process fit and system economics over pure chemistry orthodoxy, and weakest when the buyer only wants the most disclosed
    incumbent with the simplest low-temperature procurement story.
