- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor / path
  - Public commercial unit
  - Supported public price or cost signal
  - What is visibly bundled
  - What remains opaque
  - Implication
  rows:
  - - Sunfire
    - 50 MW alkaline module; SOEC with LTSA framing
    - Claims up to 50% lower total installed cost in new alkaline design; SOEC marketed on lowest LCOH
    - Module architecture, system design, guarantees, named project references
    - No public list pricing, EPC split, or service-fee schedule
    - Sunfire sells economics through project outcome, not posted hardware price
  - - Nel
    - New pressurized alkaline plus PEM systems
    - Markets higher efficiency and lower total investment cost for new alkaline platform
    - Stack technology, production-capacity expansion, EPC partnership signal
    - No public list pricing
    - Commercial strength is public scale plus partner credibility
  - - thyssenkrupp nucera
    - 20 MW scalum® unit and modular plants
    - Promotes cost-effective AWE and lifecycle value rather than unit price
    - FEED, LCOH analysis, standardized electrolyzers, lifecycle service
    - No public list pricing or standard discount disclosure
    - Nucera competes on industrial execution and maintainability
  - - ITM Power
    - 2 MW, 5 MW, and 20 MW PEM blocks
    - Promotes conversion efficiency and factory scale rather than list price
    - Turn-key PEM systems and project references
    - No public list pricing and limited public service-term detail
    - PEM value story is modularity plus public liquidity
  - - Plug Power
    - 5 MW and 10 MW electrolyzer building blocks
    - Public filing emphasizes ecosystem scope more than price
    - Electrolyzers, production plants, liquefaction, integrated hydrogen platform
    - No public customer pricing; economics tied to broader hydrogen platform
    - Plug can package more of the value chain but still faces execution risk
  - - Topsoe / Bloom
    - SOEC sections / electrolyzer platform
    - Both market lower LCOH or highest efficiency rather than list price
    - SOEC technology, service or investor platform, downstream or enterprise trust
    - No posted hardware price and little public warranty pricing detail
    - High-efficiency rivals compete most directly where energy cost dominates
  notes: This table compares public commercial packaging, not negotiated contract terms. Across the peer set, prices are mostly hidden while efficiency, total installed cost, and service language are public.
