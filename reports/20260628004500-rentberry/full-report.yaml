              But the marketplace story has an internal coherence problem. The official homepage points to millions of
              listings across 90-plus countries, the investor site advertises 5 million-plus monthly users and 17
              million-plus daily properties, and another investor-site section claims more than 45 million active users
              and 100 million properties processed in 2025. Those are not cleanly comparable units. The practical
              takeaway is that Rentberry probably has real cross-border supply and demand activity, yet public customer
              metrics still mix listings, processed properties, monthly users, and broader customer counts in ways that
