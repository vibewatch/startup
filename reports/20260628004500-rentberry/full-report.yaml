      - number: '8.3'
        title: Bull, base, and bear cases plus sensitivity drivers
        blocks:
          - type: paragraph
            body: >
              The upside case is not impossible, but it requires several things to happen quickly and credibly. First,
              management would need to prove that the 2025 revenue base understates a much larger 2026-2027 commercial
              run-rate. Second, the company would need to convert the current pre-IPO and Reg A messaging into a real
              financing ladder rather than a marketing ladder. Third, user, property, and capital-history claims would
              need to be reconciled so investors can believe the scale narrative. If those gates clear, Rentberry could
              grow into a higher-growth software or marketplace comp band rather than being judged as a thinly monetized
              crowdfunding issuer. In that world, current retail investors might still capture upside.


              The base and bear cases are easier to model from today's public record. The base case assumes Rentberry is
              a real but still modestly monetized rental-workflow platform that keeps raising capital, keeps improving
              revenue, but remains far below the scale required to justify public-comparable multiples on a $1 billion
              narrative. The bear case assumes the opposite side of the disclosure tension wins: the cap table proves
              crowded, common stock sits behind meaningful preferred overhang, monetization remains thin relative to
              user claims, and the next financing resets pricing again. The valuation is therefore most sensitive to
              four drivers: realized 2026-2027 revenue growth, minority-share protection versus preference overhang, the
              credibility of the IPO timetable, and whether management can reconcile the platform-scale claims that
              currently point in different directions.
