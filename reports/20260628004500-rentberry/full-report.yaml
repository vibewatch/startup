  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Rentberry’s biggest risks reinforce each other by moving from compliance and trust issues into growth, capital
      access, and valuation pressure.
    data:
      nodes:
        - label: Screening non-compliance
          note: FCRA or fair-housing process failure
        - label: User trust erosion
          note: Listings, support, or refund friction
        - label: Conversion slowdown
          note: Lower application and paid-feature usage
        - label: Revenue efficiency pressure
          note: Harder to monetize screening, promotions, and payments
        - label: Capital dependence
          note: Need repeated external raises to fund losses and hiring
        - label: Valuation credibility gap
          note: Narrative stays ahead of operating proof
        - label: Recommendation downside
          note: Investment case shifts toward avoid or research-more
      edges:
        - from: Screening non-compliance
          to: User trust erosion
          label: Creates disputes and complaints
        - from: User trust erosion
          to: Conversion slowdown
          label: Reduces willingness to transact
        - from: Conversion slowdown
          to: Revenue efficiency pressure
          label: Weakens monetization per user
        - from: Revenue efficiency pressure
          to: Capital dependence
          label: Raises financing need
        - from: Capital dependence
          to: Valuation credibility gap
          label: Narrative depends on future proof
        - from: Valuation credibility gap
          to: Recommendation downside
          label: Raises underwriting haircut
    approximationNotes: null
    claimRefs:
