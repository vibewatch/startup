        title: Verified modules and how the rental workflow actually runs
        blocks:
          - type: paragraph
            body: >-
              Rentberry does clear the first diligence bar for product breadth: its own product, pricing, and help
              surfaces verify that the platform spans most of the long-term rental workflow for both sides of the
              marketplace. On the tenant side, the verified path covers search, applications, tour requests, screening,
              e-sign, payments, and maintenance. On the landlord side, the verified path covers listing, screening
              requests, tour coordination, document signing, rent collection, and paid promotion. That matters because
              the product is not just a listing portal; it is trying to hold the user inside the operating workflow
              after discovery. The evidence is strongest where a feature appears both on a marketing page and in a
              step-by-step help article. Screening, tours, maintenance, payments, and e-sign all meet that bar. By
              contrast, some higher-level claims around AI assistance and automation still sit more in marketing
              language than in deeply documented user flows, so the right read is that workflow coverage is verified
              while automation depth is only partly verified.
