  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and category choice
        blocks:
          - type: paragraph
            body: >-
              Rentberry should be analyzed as a long-term residential rental marketplace layered with leasing and
              operating workflow software, not as a generic real-estate portal and not as a short-term accommodation
              marketplace. The retained product evidence is explicit that the platform spans search, applications,
              tours, rent payments, e-signature, tenant screening, and maintenance. That bundle places Rentberry at the
              overlap of listing distribution and property-management tooling. The ownership side of the market is also
              fragmented, which matters because fragmentation raises customer-acquisition cost and makes workflow
              simplicity important: small landlords may be owner, operator, and payer in one seat, while larger
              portfolios separate decision makers across leasing, operations, and asset ownership. Public evidence
              therefore supports a boundary that includes digitally marketed, long-term rental units and the software
              stack needed to fill and service them, while excluding short-term stays, home sales, mortgage origination,
              and general travel marketplaces.
