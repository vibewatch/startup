  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and onboarding motion
        blocks:
          - type: paragraph
            body: >-
              Rentberry's customer design is visibly two-sided. The homepage, pricing page, and help center all
              distinguish tenants from landlords, while third-party software catalogs extend the practical user set to
              property managers and agents. On the demand side, the official flow starts with search, moves into tours,
              applications, negotiation, screening, e-signing, rent payment, and maintenance. On the supply side, the
              landlord help center shows self-serve listing creation, photo uploads, listing edits, promotion, tour
              management, and lease execution, which means Rentberry is trying to monetize and retain supply through
              operating tools rather than pure lead generation.


              The onboarding friction is also unusually transparent. Official pricing exposes a $9.99 tenant application
              fee, $39.99 US screening fee, starting renter's insurance pricing, and landlord-facing rent collection,
              agent, and promotion charges. That makes customer acquisition more concrete than the company's broader AI
              marketing narrative. The catch is that the public record still says much more about the product's menu of
              actions than about who pays repeatedly, which cohort renews, or how usage differs between a one-off tenant
              search and a landlord managing recurring workflow.
