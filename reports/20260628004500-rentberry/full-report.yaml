      - number: '8.2'
        title: Public comparables and the multiple gap
        blocks:
          - type: paragraph
            body: >
              The most defensible valuation lens here is revenue-multiple comparison, not discounted cash flow or
              EBITDA. Rentberry is still loss-making, public revenue is tiny relative to the fundraising narrative, and
              there is no reliable public margin bridge, retention curve, or cohort-level monetization evidence. On that
              basis, the 2026 Republic pre-money valuation implies roughly 80.5x trailing 2025 revenue using
              KingsCrowd's audited-revenue figure of $1.72 million. That already looks stretched against public rental,
              classifieds, and property-software references. Zillow trades near 2.5x EV/sales, CoStar near 3.6x,
              AppFolio near 5.4x, and high-margin portal models such as Rightmove and Scout24 sit near 7.6x-7.8x. These
              are not perfect comparables, but they all monetize at far larger scale and with far better disclosure than
              Rentberry does.


              The older unicorn mark is even harder to defend. If one simply carries the 2024 $1 billion valuation
              forward against the same public 2025 revenue base, the implied multiple is roughly 580x revenue. That is
              too far outside both mature portal multiples and software peers to underwrite without a very strong,
              well-documented forward run-rate case. KingsCrowd's own adverse framing is directionally consistent: it
              calls the current Republic pricing aggressive, notes AppFolio around 6x revenue, and argues that even a
              10x gross-return outcome would require an exit above $1.39 billion and far higher revenue than Rentberry
              has disclosed. That does not prove Rentberry is overvalued in absolute terms, but it does show that
              today's price already assumes a monetization step-change the public record does not yet demonstrate.
            claimRefs:
