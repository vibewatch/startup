chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and business model
        blocks:
          - type: paragraph
            body: >-
              Rentberry’s current identity is broader than the product story that first made it notable. The homepage
              still reads like a global long-term rental marketplace with practical tenant and landlord workflows:
              search, applications, tours, screening, payments, e-signing, and maintenance. But the 2026 investor and
              press materials now reposition the company as an AI real estate agent and pre-IPO proptech platform. That
              repositioning matters because the product story has expanded from reducing broker friction into a much
              larger claim about automating the entire rental lifecycle.


              The business model is also unusually visible for a venture-backed private company. On the official
              investor site, Rentberry discloses workflow pricing points for rental applications, screenings,
              subscriptions, rent collection, and e-sign/data storage, while also gesturing to insurance, lead
              generation, and advertising. That makes the monetization logic concrete enough to understand without
              audited financials: Rentberry is trying to sell workflow utility to both sides of the rental transaction
              while layering higher-margin investor and enterprise narratives on top.


              The main caveat is denominator discipline. Official materials clearly support San Francisco as the
              headquarters city and 2015 as the founding year, but even basic identity surfaces contain inconsistencies
              at the street-address level, and later growth claims use multiple incompatible units. Later chapters
              should therefore reuse the company’s broad identity with confidence while treating exact address, scale,
              and maturity metrics as diligence-sensitive rather than canonical.
