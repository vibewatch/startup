  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      Rentberry’s model depends on external data, payment, distribution, and capital partners rather than a fully
      self-contained stack.
    data:
      nodes:
        - label: TransUnion / screening stack
          note: Credit, background, and eviction data
        - label: Payment processors / banks
          note: Rent, fees, deposits, and card or ACH flows
        - label: Listing distribution & partners
          note: Lead generation, redirects, and marketplace visibility
        - label: Support & trust operations
