              across landlords and tenants. The official help surfaces also cover rent payments, general account
              support, tenant screening, and landlord operations, which is consistent with a product that expects
              ongoing customer interaction after the initial match.


              Still, the adverse evidence is too specific to ignore. Trustpilot's archived page pairs a good headline
              score with concrete complaints about scam or scraped listings, ghosting by landlords, duplicate inventory,
              and a broken apply flow redirecting to Expedia. GetApp Canada includes a zero-score review calling the
              screening flow a scam and another review complaining that support slows during peak times and that the
              smallest cities have limited listings. Public retention evidence therefore looks positive but shallow:
              ratings are good, complaints are real, and there is still no disclosed churn, renewal, NRR, GRR, or cohort
