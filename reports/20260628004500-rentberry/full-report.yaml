      - number: '1.3'
        title: Funding, valuation, investors, and cover metrics
        blocks:
          - type: paragraph
            body: >-
              Rentberry’s capital story is the most important unresolved issue in this chapter. On one side, AIN
              reported a September 2024 $90 million Series A led by Berkeley Hills Capital and GTM Capital at a $1
              billion valuation, which is the source of the unicorn framing. On the other side, the company’s 2026
              investor site says it has raised only $40 million-plus in prior funding, while KingsCrowd’s June 2026
              Republic campaign lists a $138.7 million pre-money valuation and $4.03 million committed on common-stock
              terms. Those statements could theoretically be reconciled with security-type differences,
              recapitalization, or selective round framing, but no reviewed public material actually performs that
              bridge.


              The adverse evidence here is substantive, not cosmetic. AIN included a Horizon Capital analyst’s
              skepticism that a company with roughly half-a-million turnover, $4.8 million in losses, and 3 million
              monthly active users could justify a $1 billion valuation. KingsCrowd then adds a second challenge by
              surfacing much lower portal valuation terms plus modest 2025 revenue and meaningful burn. Together, those
              sources do not prove fraud, but they do show that the public valuation narrative is materially less
              coherent than the headline claim suggests.


              Operational scale is also real but denominator-sensitive. Company-issued 2026 materials support 90-plus
              countries, 20 million-plus properties, and 5 million-plus monthly active users, yet the same official
              investor site also markets 45 million active users in 2025, 100 million properties processed in 2025, and
              a team of 45 while KingsCrowd lists 39 employees. The safest read is that Rentberry has achieved real
              cross-border footprint and active capital formation, but its public metrics need a glossary before they
              can support a serious valuation case.
