      - number: '3.3'
        title: Pricing, packaging, distribution, and switching costs
        blocks:
          - type: paragraph
            body: >-
              Pricing strategy is one of the clearest places where Rentberry faces pressure. Rentberry lists low à la
              carte landlord charges, but the broader field is full of free-entry or tenant-paid models. Zillow
              positions core landlording tools as free and monetizes premium exposure and screening; Avail offers a free
              base tier and a $9 per unit upgrade; TurboTenant anchors on $0 per month with paid enhancements; RentSpree
              is free for agents and landlords on basic screening workflows; Innago markets itself as entirely free; and
              Zumper advertises up to five free listings monthly. That packaging lowers adoption friction and makes
              side-by-side trials easy. Distribution compounds the problem. Zillow emphasizes 30 million-plus monthly
              visitors, Apartments.com adds Homes.com and 81 million monthly renter visits, TurboTenant advertises
              posting to 25+ sites, Avail to 19 sites, Hemlane to Zillow and Apartments.com plus other portals, and
              RentSpree leans on 300+ MLS and real estate partners. The result is only moderate switching cost.
              Landlords can mix portals and workflow vendors, or can test multiple products before standardizing, which
              means Rentberry must win on workflow quality and lead conversion rather than on lock-in alone.
