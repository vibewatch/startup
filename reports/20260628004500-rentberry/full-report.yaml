  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing surface, and monetization quality
        blocks:
          - type: paragraph
            body: >-
              Rentberry's public revenue model looks more like a rental-workflow SaaS and transaction toolkit than a
              classic listing marketplace with a disclosed take rate. The official pricing page itemizes tenant-side
              application fees, screening fees, and insurance, while landlord-side monetization appears in rent
              collection, agent or broker tooling, and paid promotion. The product pages and home page also emphasize
              screening, e-signing, maintenance, negotiation, and payment workflows, which suggests the company is
              trying to monetize multiple steps in the long-term rental journey rather than a single subscription SKU.
              That is strategically useful because it diversifies fee triggers, but it also means list pricing can
              overstate economic quality if attach rates are low or the paid features are used only sporadically.


              The underwriting problem is that public materials disclose headline fees much more clearly than realized
              revenue. The pricing page explicitly leaves rent-payment transaction fees as 'varies by location,' and
              none of the reviewed sources disclose how much total revenue comes from application flow, screening,
              recurring landlord subscriptions, promotion, or insurance. That makes revenue quality hard to score:
              Rentberry clearly has several monetization levers, but public evidence still does not show which lever is
              largest, which is most recurring, or which carries the best gross margin.
