      - number: '8.4'
        title: Final underwriting stance, kill triggers, and diligence asks
        blocks:
          - type: paragraph
            body: >
              The underwriting call should be price-sensitive, not merely company-quality-sensitive. At the reported
              2024 $1 billion mark, the answer is straightforward: public evidence does not support buying that
              valuation. At the current 2026 Republic common-stock price, the answer is still not buy, because even the
              lower mark implies an 80x-plus trailing revenue multiple, weak downside protection, and unresolved
              cap-table opacity. The right recommendation is research-more, not pass, because there is still a plausible
              platform-upside path if management can translate distribution, product breadth, and capital-markets
              ambition into verifiable financial scale. But the current burden of proof sits with the company, not the
              investor.


              A disciplined investor should therefore require four things before upgrading the stance: a reconciled
              capitalization table spanning the 2024 unicorn round through the 2026 retail common, updated operating
              metrics that bridge users to actual monetization, direct evidence that the pre-IPO path is more than a
              reserved ticker and syndicated press release, and a liquidation-waterfall analysis that shows what retail
              common is really buying. Until then, the cleanest synthesis is high risk, medium confidence, and stretched
              valuation. The core thesis-break trigger is not simply slower growth; it is another financing event that
              still fails to reconcile price, rights, and scale disclosures.
