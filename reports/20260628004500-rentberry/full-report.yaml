  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: Chain from valuation evidence, disclosure quality, and downside protections to the final recommendation.
    data:
      nodes:
        - id: n1
          label: '2024 unicorn mark: $1B'
          detail: Tracxn and AIN anchor the legacy valuation narrative.
          tone: positive
        - id: n2
          label: '2026 retail common: $138.7M pre-money, $1.85/share'
          detail: Current public price discovery is much lower than the unicorn tag.
          tone: neutral
        - id: n3
          label: Weak minority protections
          detail: Common stock, no anti-dilution, CEO voting proxy, unknown preference stack.
          tone: negative
        - id: n4
          label: Economics still thin
          detail: 2025 revenue only $1.72M versus large-scale platform claims.
          tone: negative
        - id: n5
          label: Public comps trade at ~2.5x-7.8x EV/sales
          detail: Zillow, CoStar, AppFolio, Rightmove, and Scout24 all sit far below Rentberry implied multiples.
          tone: negative
        - id: n6
          label: IPO / AI / scale narrative remains optionality
          detail: Could matter if growth accelerates, but not yet hard valuation support.
          tone: positive
        - id: n7
          label: 'Recommendation: research-more'
          detail: High risk, medium confidence, valuation stance stretched.
          tone: neutral
    approximationNotes: Node ordering emphasizes the decision chain rather than every fact in the chapter.
    claimRefs:
      - CV003
      - CV007
      - CV012
      - CV017
      - CV035
      - CV037
      - CV044
