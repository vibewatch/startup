      - number: '5.2'
        title: Operating architecture, partner dependencies, and integration limits
        blocks:
          - type: paragraph
            body: >-
              Public evidence suggests Rentberry's architecture is best understood as a workflow orchestrator layered
              over multiple external dependencies rather than as a transparently documented standalone infrastructure
              stack. The product clearly routes users through modules for screening, signatures, payments, and support,
              but the public record also discloses that important trust-critical steps rely on outside parties:
              TransUnion and MicroBilt for screening, Dropbox Sign or HelloSign for document execution, and card,
              wallet, and ACH rails for payments. This is not inherently negative; many strong vertical SaaS products
              are assembled this way. The diligence issue is visibility. The reviewed public sources do not expose an
              API library, webhook catalog, status page, or technical integration reference that would let an investor
              distinguish mature internal orchestration from a thin UI over third-party services. So the platform looks
              operationally broad, but technical maturity is easier to verify at the workflow level than at the
              infrastructure level.
