      - number: '3.4'
        title: Moat durability and adverse competitive pressure
        blocks:
          - type: paragraph
            body: >-
              Rentberry still has a recognizable wedge. Its public surface combines renter marketplace features, digital
              applications, pricing/negotiation language, and landlord tools in one brand, and that negotiation-first
              posture is less common among the reviewed rivals. But the moat looks conditional rather than durable by
              default. Larger incumbents already match most workflow primitives, while SaaS challengers push entry
              prices toward zero and syndicate demand broadly enough to make modular tool-stacking practical.
              Competitive pressure is also intensifying at the market level. Buildium's 2026 research describes
              accelerating AI adoption and more standardized workflow automation across property-management software,
              which implies fast feature convergence. Hemlane's 2026 survey shows a fragmented SMB buyer base, rising
              tenant expectations, and strong focus on market data, all of which favor vendors that can either deliver
              broader operating leverage or capture demand more efficiently. Finally, regulatory scrutiny around
              algorithmic rent-setting weakens any thesis that dynamic pricing by itself is a durable strategic moat in
              rental tech. For Rentberry, that means the key diligence question is not whether its workflow exists, but
              whether it converts and retains landlords better than larger portals or cheaper landlord software once
              traffic acquisition and price competition are included.
