  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and solution classes
        blocks:
          - type: paragraph
            body: >-
              Rentberry is not competing against a single, neatly bounded class of software. In the U.S. landlord
              workflow, buyers can solve the same job through at least four routes. First are renter-demand portals that
              have expanded into workflow, most notably Zillow Rental Manager and Apartments.com Rental Manager. These
              platforms start with audience aggregation and then add applications, screening, leases, rent collection,
              or maintenance. Second are freemium landlord operating tools such as Avail, TurboTenant, RentSpree,
              Zumper, and Innago, which compete by lowering the software entry price and shifting monetization to
              screening, payments, upgrades, or promoted listings. Third are broader property-management suites such as
              Buildium, AppFolio, and Hemlane, which become relevant once the buyer needs accounting, portfolio
              controls, or service layers rather than just listing and lease-up. Fourth is the status-quo substitute of
              mixing syndicated listings, screening, leases, and payments from separate vendors, which keeps
              multi-homing viable and limits lock-in. Rentberry's challenge is that its product spans parts of all four
              categories but is not the default demand gateway or the deepest back-office system in any one of them.
