              demonstrably drive recurring customer volume. That leaves a real diligence gap around concentration and
              revenue quality. Rentberry looks like a genuine landlord-tenant workflow product with review-backed usage,
              but a full underwriting case still needs segment-level paying-account counts, geography mix, enterprise
