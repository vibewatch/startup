  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - 2026-2027 revenue inflects toward $30M-$40M, IPO path becomes real, and disclosure conflicts are reconciled.
        - $240M-$400M using 8x-10x forward-growth marketplace/software multiples; upside exists but still sits below the legacy $1B narrative.
        - Execution risk, dilution, and inability to convert scale claims into cash flow.
        - Requires multiple hard proofs not yet public.
      - - Base
        - Revenue improves to roughly $15M-$25M over the next 12-24 months, but fundraising remains necessary and governance terms do not improve much.
        - $75M-$150M using 5x-6x revenue; current Reg CF price is roughly around the top of this band.
        - Continued losses, slower monetization, and weak minority protections.
        - Most consistent with today's public evidence.
      - - Bear
        - Scale claims fail to translate into monetization, another financing resets expectations, and common proves structurally junior to earlier capital.
        - $20M-$50M on a distressed 2.5x-4x revenue lens or recap-equity outcome.
        - Down-round dilution, failed IPO path, or financing fatigue.
        - Triggered by another round without reconciliation of price and rights.
    notes: Scenario ranges are analytical underwriting bands, not market-implied marks.
    claimRefs:
