  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Cap-table reconciliation still unavailable
        - No waterfall, no preferred-rights summary, and no reconciliation of 2024 preferred pricing versus 2026 common before the next raise.
        - Prevents clean valuation comparison and leaves retail common downside unknowable.
        - Do not invest; treat price as unverified.
      - - Another financing below the current narrative without explanation
        - Follow-on price remains near or below $1.85 without rights compensation or disclosure improvement.
        - Confirms that current pricing is not the floor investors are being shown.
        - Move from research-more toward pass.
      - - Monetization remains tiny relative to scale claims
        - Revenue growth fails to show a path toward at least low-double-digit millions despite repeated user/property claims.
        - Breaks the bridge between platform scale and valuation support.
        - Re-cut valuation on distressed or low-end marketplace multiples.
      - - IPO path remains marketing-only
        - Reserved ticker and PR continue, but no banker, draft filing, or regulator-facing milestone appears.
        - Removes the most optimistic exit narrative supporting venture-style upside.
        - Underwrite as private optionality only, not pre-IPO scarcity.
      - - Governance stays one-sided for retail common
        - Proxy voting and weak minority rights remain unchanged in future rounds.
        - Common investors bear execution risk without matching control rights.
        - Demand price discount or stay out.
    notes: The triggers focus on monitorable financing and disclosure events rather than generic startup volatility.
    claimRefs:
      - CV004
      - CV012
      - CV018
      - CV021
      - CV040
      - CV045
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Cap table and waterfall
        - Current fully diluted share count, preferred terms from 2024 and later rounds, and liquidation preference stack.
        - Needed to compare the 2024 unicorn round with the 2026 retail common on an economically like-for-like basis.
        - Company CFO or outside counsel; require as a condition to any investment decision.
      - - 2026 run-rate monetization
        - Monthly recurring revenue bridge, gross margin by product, screening/payment take rates, and landlord retention cohorts.
        - Public revenue today is too small to justify current pricing without visible acceleration.
        - CFO and finance team; request trailing twelve-month operating pack.
      - - IPO readiness
        - Banker engagement, target listing window, and whether any draft registration work exists beyond ticker reservation.
        - Distinguishes real pre-IPO optionality from marketing narrative.
        - CEO and capital-markets advisor; request timeline and documentation.
      - - Metrics reconciliation
        - One reconciled table for users, properties, countries, and total capital raised across company and third-party materials.
        - Current disclosure conflicts weaken management credibility and valuation support.
        - Investor-relations lead; publish or provide reconciliation memo.
      - - Retail security rights
        - Plain-English explanation of voting proxy, transfer restrictions, anti-dilution absence, and any issuer repurchase rights.
        - Determines whether the current common stock offers acceptable downside protection.
        - Counsel plus Republic data room; review signed stockholders' agreement and subscription package.
    notes: These are the minimum diligence asks required to move from curiosity to underwritten conviction.
