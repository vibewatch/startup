company:
  name: Rentberry
chapter:
  number: 8
  title: Valuation
summary: 'Rentberry has enough product breadth, distribution ambition, and fundraising persistence to stay investable, but public valuation evidence is internally inconsistent and still far ahead of disclosed economics. The cleanest current price signal is the 2026 Republic common-stock round at a $138.7 million pre-money valuation and $1.85 share price, yet even that implies roughly 80.5x 2025 revenue; the older 2024 unicorn round, if still relevant, would imply an even less supportable multiple. Recommendation: research-more with medium confidence, high risk, and a stretched valuation stance until management reconciles the 2024 $1 billion mark, the 2026 retail pricing, and the actual cap-table/preference stack.'
sections:
  - id: valuation-context-and-evidence-tension
    title: Valuation context and the 2024-unicorn-versus-2026-retail tension
    body: |
      Rentberry's public valuation story now rests on two very different anchors. The first is the 2024 Series A narrative: Tracxn and AIN both report a $90 million round at a $1 billion valuation, which is the source of the company's unicorn label. The second is the 2026 retail common-stock offering on Republic, where the disclosed price is $1.85 per share and the disclosed pre-money valuation is $138.7 million. Those numbers are not directly apples-to-apples because the 2024 round could have had preferred rights, liquidation preferences, and interim dilution that are not visible in public materials, while the 2026 retail security is common stock with weak minority protections. Even so, the gap is too large to ignore: the 2024 unicorn mark is roughly 7.2x the current Reg CF pre-money valuation.

      The supporting disclosure quality is also uneven. Republic and the attached subscription materials show that retail investors are buying common stock, must join the stockholders' agreement, and effectively hand voting control to the CEO through an irrevocable proxy. KingsCrowd adds that the valuation was internally determined, the common shares lack anti-dilution protection, and current investors need a very large eventual exit just to achieve venture-style returns. Company marketing then pulls the story back in the opposite direction by pitching a 2027 $1 billion-plus IPO path, a planned $3.50 follow-on price, and much larger scale claims around users, properties, and prior capital raised. The result is not a clean down-round thesis or a clean validation thesis; it is a disclosure-tension thesis.
