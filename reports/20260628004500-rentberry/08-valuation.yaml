  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: cap-table-gap
      missingEvidence: Fully diluted cap table, liquidation waterfall, and the exact rights attached to the 2024 preferred round, 2026 retail common, and any intermediate securities.
      whyItMatters: These details are required to reconcile the unicorn headline with today's much lower retail pricing and to estimate actual downside for new common shareholders.
      diligencePath: Obtain a management-prepared cap table and counsel-certified rights summary before underwriting any entry.
      relatedQuestionRefs: [QV027]
    - type: conflicting-data
      severity: material
      topic: disclosure-quality
      missingEvidence: A single reconciled company memo for users, properties, countries, and total capital raised across Republic, investor pages, press releases, and third-party trackers.
      whyItMatters: Inconsistent scale disclosures weaken confidence in management reporting discipline and make valuation narratives harder to trust.
      diligencePath: Ask investor relations to reconcile every metric used in the 2024-2026 fundraising story and trace each metric to an auditable system or filing.
      relatedQuestionRefs: [QV008, QV029]
    - type: private-evidence-only
      severity: material
      topic: monetization-proof
      missingEvidence: 2026 run-rate revenue bridge, product-level gross margins, landlord retention cohorts, and payments/screening take-rate economics.
      whyItMatters: Public revenue is too small relative to current valuation, so the only way to defend price is to prove a near-term monetization inflection.
      diligencePath: Request monthly management accounts and cohort dashboards for the last 18 months.
      relatedQuestionRefs: [QV019, QV025]
    - type: missing-source
      severity: material
      topic: ipo-readiness
      missingEvidence: Banker mandate, draft offering timetable, or other regulator-facing milestone beyond the reserved ticker and syndicated company press.
      whyItMatters: The IPO path is a major part of the upside narrative, but public evidence still looks marketing-led rather than process-led.
      diligencePath: Ask management for capital-markets timeline artifacts and verify with counsel or underwriting banks.
      relatedQuestionRefs: [QV020, QV021]
    - type: enumeration-incomplete
      severity: minor
      topic: comparable-valuation-table
      missingEvidence: Accessible private-round and M&A datasets for closer RentTech and proptech workflow transactions with disclosed revenue context.
      whyItMatters: The public comp set is informative but does not fully solve for private-market scarcity, control premiums, or security-rights differences.
      diligencePath: Expand diligence with PitchBook-equivalent private transaction memos and banker precedent books if an investment advances.
      relatedQuestionRefs: [QV012]
      relatedTableRefs: [TV004]
