  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - - Thesis
        - Rentberry has built a real rental-workflow surface with applications, screening, payments, AI claims, and international reach.
        - Verified 2026-2027 revenue acceleration and evidence that monetization is catching up with reported scale.
      - - Thesis
        - The company still attracts capital and preserves IPO optionality through Republic, Reg D, and pre-IPO marketing.
        - A filed next-step offering plus a reconciled cap table would make the capital-markets narrative more credible.
      - - Thesis
        - Retail common at $138.7M pre-money is much lower than the prior unicorn tag, so some repricing may already have occurred.
        - Clear evidence that the rights stack and share count make the 2026 common truly comparable to prior preferred rounds.
      - - Anti-thesis
        - 'Current public economics remain tiny versus the valuation story: $1.72M revenue and $4.77M net loss in 2025.'
        - Show durable run-rate revenue, stronger gross margin, and materially lower cash-burn dependence.
      - - Anti-thesis
        - Governance and downside protection are weak for minority common holders because of proxy voting and no anti-dilution protection.
        - Publish a simplified waterfall, rights summary, and any planned investor-protection terms for future rounds.
      - - Anti-thesis
        - Public disclosures on users, properties, and total capital raised conflict across company, media, and tracker sources.
        - Reconcile platform metrics and funding history in one auditable investor package.
    notes: The anti-thesis is driven more by valuation support and disclosure quality than by product inexistence.
