  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Metric
      - Multiple / valuation / status
      - Relevance
      - Limitation
    rows:
      - - Zillow Group
        - 2026 TTM revenue $2.69B; rentals Q1 revenue $183M
        - $7.13B market cap; EV/sales 2.51x
        - Closest large U.S. rental marketplace benchmark and direct signal for what scaled rentals monetization looks like.
        - Broader business mix, public-company maturity, and very different capital structure.
      - - CoStar / Apartments.com
        - 2026 TTM revenue $3.41B; 2026 guide $3.78B-$3.82B
        - $12.35B market cap; EV/sales 3.60x
        - Public benchmark for a scaled online real-estate marketplace portfolio with apartments exposure.
        - Diversified group economics, not a pure SMB rental-workflow tool.
      - - AppFolio
        - 2026 TTM revenue $995M; FY26 guide $1.110B-$1.125B
        - $5.50B market cap; EV/sales 5.41x
        - Best public property-management software comp for workflow monetization.
        - More mature SaaS model, stronger profitability, and deeper enterprise features.
      - - Rightmove
        - 2025 revenue $0.57B / GBP 425.13M
        - GBP 3.27B market cap; EV/sales 7.62x
        - High-margin classified-portal benchmark for what premium marketplace scarcity can command.
        - UK market structure and profitability are far stronger than Rentberry's public record.
      - - Scout24 / ImmoScout24
        - 2026 TTM revenue EUR 692.13M
        - EUR 5.09B market cap; EV/sales 7.84x
        - Continental-European portal benchmark for strong classifieds valuation support.
        - Mature European portal with established monetization and cash generation.
    notes: The table focuses on public rental, classifieds, and property-management references because comparable private RentTech round disclosures are sparse and inconsistent.
    enumerationScope:
      coverage: partial
      basis: Covers the most decision-relevant public marketplace and property-management comparables available from reviewed 2026 sources; excludes opaque private transaction comps without accessible financial context.
