tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Value
      - Rationale
    rows:
      - - Recommendation
        - research-more
        - Public evidence supports a real business and possible upside, but not a buyable valuation today.
      - - Confidence
        - medium
        - The price-discovery evidence is real, yet cap-table, run-rate, and disclosure gaps remain material.
      - - Risk rating
        - high
        - Common stock sits behind earlier financings, growth must outrun dilution, and disclosure consistency is weak.
      - - Valuation stance
        - stretched
        - Even the lower 2026 pre-money mark implies ~80.5x trailing revenue; the 2024 unicorn tag is far less supportable.
      - - Decision implication
        - no buy without direct diligence
        - Require cap-table, liquidation waterfall, and updated monetization proof before underwriting entry.
    notes: Locked judgment for this chapter only; recommendation is explicitly price-sensitive rather than a generic quality score.
    claimRefs:
      - CV003
      - CV012
      - CV017
      - CV033
