      - number: '1.3'
        title: 融资、估值、投资者与封面指标
        blocks:
          - type: paragraph
            body: >-
              Rentberry 的资本故事，是本章最重要的未解问题。一边是 AIN 报道，Berkeley Hills Capital 和 GTM Capital 于 2024 年 9 月领投 $90M Series
              A，估值 $1B，这也是独角兽叙事的来源。另一边，公司 2026 年投资者网站称此前融资仅 $40M 以上，而 KingsCrowd 的 2026 年 6 月 Republic 活动列出 $138.7M
              投前估值、$4.03M 已承诺金额，且条款为普通股。理论上，这些说法可用证券类型差异、资本重组或选择性轮次表述来调和，但已审阅的公开材料没有真正搭起这座桥。


              这里的反向证据是实质性的，不是表面瑕疵。AIN 引用一位 Horizon Capital 分析师的质疑：一家营业额约 50 万、亏损 $4.8M、月活 3M 的公司，能否支撑 $1B 估值。KingsCrowd
              随后又提出第二重挑战：门户估值条款低得多，2025 年收入不高，烧钱也有分量。合起来看，这些来源不能证明欺诈，但确实显示，公开估值叙事远没有标题主张那么连贯。


              运营规模也是真实的，但对分母敏感。公司 2026 年材料支持 90 多个国家、2000 万以上房源和 500 万以上月活用户；但同一个官方投资者网站又营销 2025 年 4500 万活跃用户、2025 年处理 1
              亿套房源，以及 45 人团队，而 KingsCrowd 列出 39 名员工。最稳妥的读法是：Rentberry 已经形成真实的跨境足迹并持续形成资本，但公开指标需要先有一份术语表，才足以支撑严肃估值论证。
