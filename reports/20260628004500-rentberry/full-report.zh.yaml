  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与入门路径
        blocks:
          - type: paragraph
            body: >-
              Rentberry
              的客户设计明显是双边的。首页、定价页和帮助中心都区分租客和房东，第三方软件目录则把实际用户集合扩展到物业经理和中介。需求侧，官方流程从搜索开始，进入看房、申请、谈判、筛查、电子签名、租金支付和维修。供给侧，房东帮助中心展示了自助发布房源、上传照片、编辑房源、推广、看房管理和租约签署，这意味着
              Rentberry 想靠运营工具变现并留住供给，而不是只做线索生成。


              入门摩擦也异常透明。官方定价披露 $9.99 的租客申请费、$39.99 的美国筛查费、租客保险起始价格，以及面向房东的租金收取、中介和推广收费。这让获客比公司更宽泛的 AI
              营销叙事更具体。问题在于，公开记录仍更多说明产品菜单有哪些动作，而不是谁会反复付费、哪个 cohort 会续约，或一次性租客搜索与房东管理经常性工作流之间的使用差异。
