      - number: '4.4'
        title: 承销阻碍、法律信任信号与最终财务结论
        blocks:
          - type: paragraph
            body: >-
              本章的反向证据没有显示当前破产事件或大规模客户失败，但确实显示治理和尽调摩擦。Rentberry 在 Seattle
              的诉讼历史源于该市对租金竞价服务的暂停令，政策变化后以失去实际意义驳回告终；这不是今天的致命问题，但提醒投资人，产品的一部分可能招致政策审查。Scam Detector 仍只给网站
              61.4/100，评论聚合网站也称房东套餐相对免费或更便宜替代品显贵。Trustpilot 的存档评分仍然为正，因此更大的担忧不是纯粹的客户敌意，而是公司自身运营披露的可靠性和一致性。


              从财务上看，结论应谨慎。Rentberry
              有可见的收费架构，也有足够独立数据证明真实但仍不大的收入和持续外部融资。但公司还没有公开闭合核心承销回路：已实现定价、收入结构、交易费表、毛利、支付损失率、保险经济性、当前现金，以及直接公司特定申报文件获取。在管理层拿出这些材料并调和规模和融资历史差异之前，投资人应把
              Rentberry 视为一个已经变现但披露不足的 proptech 平台；它的估值叙事明显跑在公开财务证据前面。
