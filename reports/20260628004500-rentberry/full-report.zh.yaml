  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价表面与变现质量
        blocks:
          - type: paragraph
            body: >-
              Rentberry 的公开收入模式，更像租赁工作流 SaaS
              和交易工具包，而不是披露抽成率的经典房源市场。官方定价页逐项列出租客侧申请费、筛查费和保险；房东侧变现则出现在租金收取、中介或经纪人工具、付费推广中。产品页和首页也强调筛查、电子签名、维修、谈判和支付工作流，说明公司试图在长期租赁旅程的多个步骤变现，而不是只卖一个订阅
              SKU。这在战略上有用，因为它分散了收费触发点；但如果附加率低，或付费功能只是零星使用，表价也可能夸大经济质量。


              承销难题在于，公开材料披露标题费用远比披露已实现收入清楚。定价页明确把租金支付交易费留为「因地点而异」，已审阅来源也没有披露总收入中有多少来自申请流、筛查、经常性房东订阅、推广或保险。因此收入质量很难打分：Rentberry
              显然有多个变现杠杆，但公开证据仍没有显示哪个杠杆最大、哪个最经常性、哪个毛利最好。
