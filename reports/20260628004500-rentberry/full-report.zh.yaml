      - number: '4.3'
        title: 资本充足性、融资依赖与 IPO 叙事
        blocks:
          - type: paragraph
            body: >-
              Rentberry 显然仍在靠外部融资支持增长。2026 年公开记录包括通过 Republic 营销的一轮 Reg CF，以及一轮单独自管的 Reg D，两者都围绕 $1.85 股价展开；此外还有公司相关的
              pre-IPO 信息，指向后续 $20M 融资和 2027 年上市愿景。这不自动等同于困境；高增长私人公司常常叠加众筹、风投和 pre-IPO 资本。但它确实说明，公司今天还不是处于完全自我融资的公开股权姿态。


              更难的问题是当前资本是否足够舒适。KingsCrowd 2025 年 10 月快照显示，按当时现金和烧钱速度计算，跑道超过 24 个月；如果数字准确，这是一个建设性数据点。不过，Republic
              的发行人披露显示亏损、留存亏损，并明确需要追加资金。CB Insights 和 Tracxn 也通过列出一轮待完成的 2026 年融资和 2024
              年独角兽估值，强化了融资仍在进行的判断；但即使是基础融资历史事实也冲突：公司相关材料强调已融资 $40M 以上，而 CB Insights 报道 16 轮合计
              $136.63M。没有当前现金桥、直接申报文件包和累计融资调和，资本充足性只能算部分承销。
