      - number: '3.2'
        title: 直接同业、既有玩家与替代品
        blocks:
          - type: paragraph
            body: >-
              最接近的直接重叠，来自把房源曝光和房东工作流结合起来的平台。Zillow Rental Manager 和 Apartments.com Rental Manager
              是最危险的既有玩家，因为它们把交易工具和大规模租客受众配在一起，让分发成为内置功能，而非单独的获客问题。Zumper
              规模较小，但仍然相关，因为它也从类似的自助起点出发，营销免费房源量、网络分发和租赁市场洞察。Avail、TurboTenant 和 RentSpree
              则从另一个角度进攻：只要能广泛分发、让房东入门价格接近零，并通过筛查、支付或高级升级获取收入，它们不需要成为最大的消费者目的地。Buildium、AppFolio、Hemlane 和 Innago
              进一步扩大了替代集合。当买方不太关注房源需求，而更关注会计、维修、合规或运营支持时，它们就很重要。在这个语境下，Rentberry
              的竞争集合从「租赁市场」扩大为「一站式房东软件」，这同时抬高了功能深度和信任门槛。
