      - number: '1.4'
        title: 里程碑、法律历史与反向信号
        blocks:
          - type: paragraph
            body: >-
              公司的历史弧线可追踪，尽管其中一部分来自公司自述。Wall Street Journal 和 PIX11 的早期第三方报道显示了 Rentberry
              最初的切入点：一套租金竞价和谈判工作流，试图让找房更透明。官方投资者材料随后声称公司经历多阶段扩张：2017 年 alpha 发布、2018 年城市级覆盖、2019 年区块链集成、2020 年 Wefunder
              融资、2021 年全球合作、2022 年 AI 集成、2023 年 Republic 融资，以及 2026 年 AI agent 和 pre-IPO
              推进。这是一个连贯的里程碑故事，但相当多内容仍依赖公司自己的投资者微网站，而非中立报道。


              记录中最明确的硬性反向事件是 Seattle。Pacific Legal 和 CourtListener 合起来显示，Rentberry 挑战了 Seattle 2018 年针对租金竞价网站的暂停令，2019
              年在地区法院败诉；2020 年，在市政府废除条例、上诉发回后，案件因失去实际意义而被驳回。这场法律战已经结束，并非生死问题，但它说明 Rentberry 最初商业模式激起的住房政策争议，足以引发监管反弹。


              客户声誉证据与融资故事一样复杂。Trustpilot 的存档评分很强，为 4.4/5；但同一页面包含关于诈骗、重复房源、房东失联、跳转失效和支持薄弱的具体投诉。BBB
              未认证本身不是决定性证据，但它强化了同一模式：Rentberry 可能有可用产品和强叙事野心，但尽调仍需测试房源真实性、支持质量，以及 AI-first 故事是否跑在运营证据前面。
