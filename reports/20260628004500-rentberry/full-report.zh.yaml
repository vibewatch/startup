  - id: TV005
    title: 打穿论点和否决触发器表
    columns:
      - 触发器
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 股权结构表仍无法勾稽
        - 下一轮融资前，仍没有清算瀑布、优先股权利摘要，也无法勾稽 2024 年优先股定价与 2026 年普通股。
        - 阻止干净的估值比较，也让散户普通股下行不可知。
        - 不投资；把价格视为未经验证。
      - - 又一轮融资低于当前叙事且没有解释
        - 后续价格仍接近或低于 $1.85，且没有权利补偿或披露改善。
        - 证实当前价格并不是投资者看到的底部。
        - 从继续研究转向放弃。
      - - 变现相对规模主张仍很小
        - 尽管公司反复宣称用户 / 房源规模，收入增长仍看不到至少通向低双位数百万美元的路径。
        - 打断平台规模与估值支撑之间的桥。
        - 按困境或低端市场倍数重切估值。
      - - IPO 路径仍停留在营销
        - 保留代码和公关宣传继续存在，但没有银行家、草案提交或面向监管的里程碑。
        - 移除支撑风投式上行空间的最乐观退出叙事。
        - 只按私人市场可选性承销，不按 pre-IPO 稀缺性承销。
      - - 散户普通股治理继续单边
        - 未来轮次中代理投票和弱少数股东权利不变。
        - 普通股投资者承担执行风险，却拿不到匹配的控制权。
        - 要求价格折扣，或不参与。
    notes: 触发器聚焦可监控的融资和披露事件，而不是泛泛的创业公司波动。
    claimRefs:
      - CV004
      - CV012
      - CV018
      - CV021
      - CV040
      - CV045
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 股权结构表和清算瀑布
        - 当前完全稀释股份数、2024 年及之后轮次的优先股条款，以及清算优先权堆栈。
        - 必须用经济上同口径的方式比较 2024 年独角兽轮次和 2026 年散户普通股。
        - 公司 CFO 或外部律师；把提供材料作为任何投资决策的前提。
      - - 2026 年年化收入变现
        - 月度经常性收入桥表、按产品拆分的毛利率、筛查 / 支付抽佣率，以及房东留存队列。
        - 公开收入现在太小；没有可见加速，就撑不起当前定价。
        - CFO 和财务团队；要求过去十二个月经营包。
      - - IPO 准备度
        - 银行家介入、目标上市窗口，以及除代码预留外是否已有任何注册草案工作。
        - 区分真实 pre-IPO 可选性与营销叙事。
        - CEO 和资本市场顾问；要求时间线和文件。
      - - 指标勾稽
        - 用一张表勾稽公司和第三方材料中的用户、房源、国家和累计融资额。
        - 当前披露冲突削弱管理层可信度和估值支撑。
        - 投资者关系负责人；发布或提供勾稽备忘录。
      - - 散户证券权利
        - 用通俗语言说明投票代理、转让限制、缺少反稀释，以及任何发行人回购权。
        - 判断当前普通股是否提供可接受的下行保护。
        - 律师加 Republic 数据室；审阅已签署的股东协议和认购包。
    notes: 这是从好奇走向可承销信念所需的最低尽调清单。
    claimRefs:
      - CV004
      - CV005
      - CV012
      - CV018
      - CV021
      - CV045
