      - number: '4.2'
        title: 公开牵引力代理、单位经济与披露冲突
        blocks:
          - type: paragraph
            body: >-
              公开牵引力信号方向上为正，但数字彼此不一致。KingsCrowd 的 Republic 页面、公司联合发布的新闻稿和 Rentberry
              投资者材料，都把业务描绘成拥有数百万用户、数千万房源，并有路径进入显著更大规模。但同一组来源也产生了互相冲突的营销主张：一个官方投资者页面段落称月用户超过 500 万、日房源超过 1700
              万；另一个则称活跃用户超过 4500 万、2025 年处理房源 1 亿套；2026 年联合发布的新闻稿又重复月用户 500 万、覆盖 90 多个国家的 2000
              万套房源。这些不是四舍五入差异，而是明显不同的运营叙事。


              财务快照同样混杂。KingsCrowd 披露 FY2025 收入 $1.72M、FY2025 净亏损 $4.77M、现金 $7.78M、月烧钱 $277.7K；Republic 发行人披露则强调 FY2024
              亏损、留存亏损，以及公司需要继续融资。如果数百万用户指标方向正确，公开的漏斗顶端单位变现仍极薄。按报道月用户估算的收入远低于每人一美元，按报道房源估算的收入远低于每套十美分，这意味着转化很低、相对平台覆盖的变现产品有限，或公开收入披露不完整。
