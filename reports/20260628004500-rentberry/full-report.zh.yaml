    rows:
      - - Rentberry
        - 房东免费发布房源；附加项 $19.99 和 $49.99/mo 起
        - 租户申请 $9.99；筛查 $39.99；房东可要求筛查
        - 推广和聚合以付费附加项出售
        - 租金代收 $19.99；租户保险加售 $11/mo 起
        - 透明单项包装，但不是本组最便宜的免费增值产品
      - - Zillow Rental Manager
        - 核心工具定位为免费
        - 外部引用筛查费 $45/申请人；官方页面强调集成工作流
        - 需求来自 Zillow 租赁网络和 Premium 加售
        - 已审官方页面显示租金代收免费
        - 起步摩擦极低，并绑定已审最大租房者受众
      - - Apartments.com / CoStar 平台
        - 已审 RM 页面显示无需订阅；企业分析更深但不简单
        - 已审公开 RM 摘录中未清晰标价
        - Apartments.com 房源现在也出现在 Homes.com
        - Express Pay 和可比报告被包装为增值项
        - 结合大规模需求和工作流，即使标价不够明确
      - - Zumper
        - 每月最多 5 条房源免费
        - 已审公开页面未清晰拆项
        - 推广分发和认证式升级驱动变现
        - 支付可通过 rental manager 流程使用
        - 免费增值获客让它比 Rentberry 更易测试
      - - Avail
        - Unlimited 免费；Unlimited Plus $9/unit/month
        - 租户通常支付筛查费；费用因地点而异
        - 分发到 19 个站点，并以定制化 / 速度加售
        - Plus 免 ACH 费；免费层向租户收 ACH 费
        - 对主要想要工作流广度的 DIY 房东构成强价格锚
      - - TurboTenant
        - 免费；付费方案约 $12.42/mo 和 $16.58/mo
        - 租户支付筛查费，高级方案费用更低
        - 发布到 25+ 个站点，入门价格接近零
        - 付费层免 ACH 费、付款更快到账
        - 面向同一组核心房东任务，提供很激进的自助包装
      - - RentSpree
        - 申请免费；PRO $19.99/month
        - 申请人最多支付 $49.99 筛查费；经纪人和房东免费
        - 筛查优先动线，带 MLS / 合作伙伴触达
        - 房东经常性付款费 $3；租客 ACH 免费
        - 不要求房东预付，也能打通强经纪人 / 经纪商通道
      - - Innago / Hemlane / Buildium / AppFolio
        - Innago 免费；Hemlane 从免费和 $30/mo 起；Buildium $62/mo 起；AppFolio 报价制
        - 因产品和套餐而异
