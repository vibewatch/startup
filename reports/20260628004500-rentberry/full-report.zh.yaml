      - number: '6.2'
        title: 采用证据与市场供需行为
        blocks:
          - type: paragraph
            body: >-
              客户证据在宽度上强于分母质量。官方表面和公司相关投资者材料反复营销一个全球租赁网络，拥有数百万房源、覆盖 90 多个国家、拥有数百万用户。KingsCrowd 等独立汇总来源重复了这一叙事，并补充 70
              个合作伙伴，说明可能存在某些外部分发或渠道活动。评论和目录网站也一致把产品描述为适合多房源房东、远程管理者，以及希望获得端到端数字流程的租客。


              但市场故事存在内部一致性问题。官方首页指向覆盖 90 多个国家的数百万房源，投资者网站宣传月用户 500 万以上、日房源 1700 万以上，另一个投资者网站段落又声称活跃用户超过 4500 万、2025
              年处理房源 1 亿套。这些单位不能干净比较。实际结论是：Rentberry 可能确有真实的跨境供需活动，但公开客户指标仍把房源、已处理房产、月用户和更宽客户数混在一起，使采用耐久性比标题数字暗示的更难承销。
