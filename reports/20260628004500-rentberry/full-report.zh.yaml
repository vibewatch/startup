          label: 成立
          detail: 创始团队在旧金山围绕租赁市场低效创办 Rentberry。
          tone: positive
        - date: '2017'
          label: 租金竞价上线
          detail: WSJ 和 PIX11 将 Rentberry 报道为 eBay 式租金和押金谈判平台。
          tone: neutral
        - date: '2018'
