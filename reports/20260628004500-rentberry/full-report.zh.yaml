  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与类别选择
        blocks:
          - type: paragraph
            body: >-
              Rentberry
              应被分析为一个叠加租赁和运营工作流软件的长期住宅租赁市场，而不是泛房地产门户，也不是短租住宿市场。保留的产品证据明确显示，平台覆盖搜索、申请、看房、租金支付、电子签名、租客筛查和维修。这一组合把
              Rentberry
              放在房源分发和物业管理工具的交叉处。市场的业主侧也很分散，这一点很重要，因为分散会抬高获客成本，也让工作流简化更关键：小房东可能一人同时是业主、运营者和付款方；较大资产组合则把决策者拆分到租赁、运营和资产所有权多个角色。公开证据因此支持这样一个边界：包括数字化营销的长期出租单元，以及填满并服务这些单元所需的软件栈；排除短租、房屋买卖、抵押贷款发放和泛旅游市场。
