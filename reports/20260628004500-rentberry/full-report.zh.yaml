        - 要求提供当前按国家 / 州划分的费率卡、处理商合同和商户损失历史
        - 重大
      - - 按产品拆分毛利率和处理商成本
        - 无法区分有吸引力的复购软件收入、低毛利支付或转手筛查
        - 要求提供产品 P&L、支付处理商成本、拒付和支持成本分摊
        - 阻断项
      - - 2026 年线上募资后的当前现金桥
        - 缺少当前现金和募资用途数据，跑道估算已经失效
        - 要求提供 2025 年 10 月至今的月末现金，以及每轮 2026 年融资到账资金的瀑布表
        - 阻断项
      - - 公司专属直接备案包
