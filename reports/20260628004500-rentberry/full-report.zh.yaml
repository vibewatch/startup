      - number: '7.4'
        title: 缓释因素与否决标准
        blocks:
          - type: paragraph
            body: >-
              Rentberry 确实有可见的缓释因素，但多数只是部分缓释。官方材料显示，公司有 TransUnion 支持的筛查、SSL 加密、正式隐私通知、在线帮助中心、多条变现路径，以及 2025 年
              KingsCrowd
              快照中改善的现金状况。这些都没有消除核心剩余敞口。公司仍需证明：筛查决定会触发合规的不利行动流程；公平住房审查是系统化机制而非临时处理；付款和拒付控制有被度量；支持和反欺诈运营能跟上全球市场平台的主张。同样，治理架构或许适合创始人控制，但除非管理层能把
              2024 年独角兽叙事、2026 年众筹估值和实际审计收入基础接成一座连贯的桥，否则很难安抚外部投资者。


              从承销角度看，否决标准因此直接且可监测。可信投资案例要求：没有与筛查、歧视、付款或隐私有关的负面监管行动；管理层可直接使用的一揽子对账材料，打通 2024 年与 2026
              年融资主张；亏损和烧钱趋势相对于收入增长保持稳定；并有证据显示房源诈骗、房东失联和支持延迟在下降，而不是反复出现。如果管理层拿不出这些材料，或新的执法、诉讼、平台完整性问题出现，当前 pre-IPO
              叙事应被大幅打折。


              净判断是，Rentberry
              的风险彼此相扣。合规错误会恶化声誉，声誉问题会抬高获客摩擦，牵引力变弱会加剧对外部资本的依赖，而资本依赖会让少数投资者更痛地承受治理控制权不对称。这条链条使本章负面证据成为最终建议的核心，而不是旁注附录。
