      - number: '5.2'
        title: 运营架构、合作方依赖与集成边界
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Rentberry
              的架构最好理解为叠在多个外部依赖之上的工作流编排器，而不是一个透明记录的独立基础设施栈。产品显然把用户引入筛查、签名、支付和支持等模块，但公开记录也披露，关键的信任环节依赖外部方：TransUnion 和
              MicroBilt 做筛查，Dropbox Sign 或 HelloSign 做文件签署，银行卡、钱包和 ACH 轨道做支付。这并不天然负面；很多强 vertical SaaS
              产品都是这样组装起来的。尽调问题在于可见度。已审阅的公开来源没有暴露 API 库、webhook 目录、状态页或技术集成参考，无法让投资人区分成熟的内部编排和套在第三方服务上的薄
              UI。因此，平台看起来运营范围很宽，但技术成熟度在工作流层面比基础设施层面更容易验证。
