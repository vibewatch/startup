        title: 信任、隐私、合规，以及营销何处跑在证据前面
        blocks:
          - type: paragraph
            body: >-
              最强的产品差异化主张是宽度：少有面向租客的平台试图在一个品牌表面连接搜索、申请、看房、筛查、签署、支付和维修。但最尖锐的尽调问题在信任和合规，而不在功能数量。Rentberry
              为筛查和支付收集并路由高度敏感信息，与承包商和交易对手共享数据以履行服务，并披露美国和欧盟制度下的隐私权。这些披露有用，但不能替代独立保证。已审阅来源没有发现 SOC 2 或 ISO 证据、经审计的
              uptime，或公开事故报告。筛查方面，FTC 指引明确指出，准确性、合法用途、用户认证和争议处理不是可选项；但 Rentberry 的公开材料没有解释，平台如何在运营上引导房东完成 adverse-action
