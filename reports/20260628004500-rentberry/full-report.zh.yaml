      - number: '2.2'
        title: TAM、SAM 与公开规模测算视角
        blocks:
          - type: paragraph
            body: >-
              保留的公开来源无法支撑一个干净的 TAM 数字，所以本章采用多重视角。最宽的住房视角是全国租赁存量和租户家庭：Census 显示租赁空置率为 7.3%，Realtor.com 则提示，到 2027
              年初存量可能超过 5050 万套。下一层是专业管理的公寓足迹，top-50 管理方控制约 24%
              的存量，因此构成一个集中的工作流采购群体，尽管公寓所有权本身仍然分散。软件支出方面，分析师估计美国物业管理软件市场处于低个位数十亿美元规模，但不同发布方和年份的口径不同。市场规模方面，公开证据对房源和流量的支持强于收入：Zillow
              Rentals 据称有 190 万条房源，Zillow 网络每年访问量达 101 亿次；IBISWorld 的公开页面确认了线上公寓租赁类别，但隐藏了收入数字。正确结论是：Rentberry 的近期 SAM
              窄于总住房支出；最能防守的 SOM，是需要同时做线索生成和工作流自动化的数字化营销长期租赁库存。
