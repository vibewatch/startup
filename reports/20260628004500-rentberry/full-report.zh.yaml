companyProfile:
  summary: >-
    Rentberry 是一家位于旧金山的私人 proptech 公司，成立于 2015 年，运营长期租赁市场和房东-租客工作流平台。公开产品覆盖搜索、申请、租客筛查、线上租金支付、电子签名、维修请求，以及 AI
    辅助定价或匹配主张；公开融资叙事如今则把 2024 年报道的独角兽轮次和 2026 年低得多的散户众筹估值混在一起。结果是，公司确有产品宽度和资本市场野心，但投资人面对的披露张力也异常高。
