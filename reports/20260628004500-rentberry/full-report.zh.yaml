      - number: '7.2'
        title: 运营、支持与声誉风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，Rentberry 承担的市场平台支持风险高于常态，因为平台要求用户在同一条链路里信任房源、申请、筛查、付款以及押金相关步骤。官方政策确认，Rentberry
              会处理敏感的租客和房东数据，收集房东银行账户信息用于付款，并声明没有任何互联网存储方式能做到绝对安全。条款还规定，费用一经收取不予退还，付款扣收失败后公司保留暂停账户的权利，并把大量交易责任转回给用户和房源发布方。由此形成很重的运营负担：房源过期、筛查费用被争议，或付款、跳转流程出错时，用户体验就不再只是
              UI bug，而会变成信任问题。


              负面客户证据已经足以把它列为实质性尽调事项。归档的 Trustpilot 内容包括重复房源或诈骗房源、房东失联、合作方跳转失效，以及客服处理乏力等投诉。Capterra
              评论并非一边倒负面，但其中有具体指控：为背景调查付费却没有收到结果、支持培训不足、问题发生时没有保护。这些评论本身不能证明系统性欺诈，却说明房源完整性、支持响应和争议解决仍是公开短板。


              这一点尤其重要，因为 Rentberry
              的商业卖点靠便利性和自动化支撑。如果用户相信平台能省时间，却不能稳定核验房源、分发申请人，或解决付款和筛查争议，核心漏斗就会变弱。公司也许仍有可用的产品广度，但公开证据显示，Rentberry 若想撑住
              pre-IPO 姿态，运营质控——尤其是支持、反欺诈和合作方集成可靠性——必须比投资者叙事更快改善。
