      - - Zillow Rental Manager
        - 需求门户 + 工作流在位者
        - Zillow 网络，已审页面显示月租赁访问者 30M+
        - DIY 房东和小型物业管理公司
        - 庞大租房者受众，加上房源、租约、筛查、支付、维修和定价工具
        - 已审证据显示，相比完整 PM 套件，其会计深度较浅，站外分发也更窄
      - - Apartments.com / CoStar 平台
        - 需求门户 + 数据在位者
        - 1M 业主、81M 月租房访问、每月 $400M 租金支付；背靠上市公司 CoStar
        - 覆盖 DIY、多户住宅广告主和专业运营商
        - 受众规模、Homes.com 交叉发布、支付、维修、租金可比数据和 CoStar 分析深度
        - 相比纯免费增值房东 SaaS，简单标价不够透明
      - - Zumper
        - 自助房源发布与租赁平台
        - 免费房源，加推广库存和合作伙伴分发
        - DIY 房东和中小型物业管理公司
        - 一次发布到 Zumper、PadMapper、Bing、ChatGPT 等；市场洞察和 AI 辅助营销
        - 家喻户晓的流量小于最大在位者，后台深度也较弱
      - - Avail
        - 免费增值房东 OS
        - Realtor.com 网络一部分；$0 基础层和 $9/户高级层
        - 独立房东和小组合
        - 分发到 19 个站点，并打包租约、筛查、支付、维修和租户门户
        - 依赖聚合需求，而不是拥有最大的原生市场
      - - TurboTenant
        - 免费增值房东 OS
        - 已审页面显示 1M+ 自主管理房东
        - 1 到 50+ 户的 DIY 房东
        - 入门价很低，一个栈内打包 25+ 站点广告、申请、筛查、支付和维修
        - 需求部分借自合作门户，而非完全自有
      - - RentSpree
        - 筛查优先的经纪人 / 房东工作流
        - 3M+ 用户和 300+ MLS / 房地产合作伙伴
        - 经纪人、经纪商、房东和筛查主导工作流
        - 强 MLS 邻近分发、TransUnion/Finicity 数据和低成本筛查主导动线
        - 消费者市场拉力证据少于 Zillow 或 Apartments.com
      - - AppFolio / Buildium / Hemlane / Innago
        - 更广义 PM 替代品
        - 报价制或月付 PM 套件；Innago 免费入门；Hemlane 采用软件加服务
        - 物业管理公司、组合房东和需要会计或服务深度的运营商
        - 将比较从租赁启动工具扩展到会计、运营、合规和支持
        - 作为纯消费者需求目的地，通常弱于大型租赁门户
