          detail: 筛查和租客保险附加项把信任与风险工作流变现。
          tone: neutral
        - id: payments
          label: 支付 + 收款
          detail: 租金代收费和随地点变化的支付费用把租金流转变现。
          tone: neutral
        - id: landlordplus
          label: 房东附加项
          detail: 经纪人 / 代理人和推广工具把工作流软件与曝光变现。
          tone: neutral
        - id: gross
          label: 总收入池
          detail: 申请、筛查、保险、支付和房东附加项共同贡献收入。
          tone: positive
        - id: processor
          label: 处理商与欺诈成本
          detail: 商户费、拒付和欺诈损失均未披露。
          tone: warning
        - id: support
          label: 支持与服务成本
          detail: 客户支持和争议处理费用没有公开。
          tone: warning
        - id: marketing
          label: 付费增长成本
          detail: CAC 和付费渠道强度没有公开。
          tone: warning
        - id: costs
          label: 未知成本栈
          detail: 处理商费用、支持、欺诈、保险经济性和营销成本均未公开。
          tone: warning
        - id: retained
