      - number: '8.4'
        title: 最终承销立场、否决触发点与尽调要求
        blocks:
          - type: paragraph
            body: >
              承销判断应对价格敏感，而不只是对公司质量敏感。按报道的 2024 年 $1 billion 标记，答案很直接：公开证据不支持按该估值买入。按当前 2026 年 Republic
              普通股价格，答案仍不是买入，因为即便较低标记也意味着 80x
              以上过往收入倍数、薄弱的下行保护，以及未解决的股权结构不透明。正确建议是继续研究，而不是放弃，因为如果管理层能把分发、产品广度和资本市场野心转化为可验证的财务规模，平台上行情景仍然合理。但当前举证责任在公司，而不在投资者。


              因此，纪律严明的投资者在上调立场前应要求四件事：一张对齐后的资本结构表，覆盖 2024 年独角兽轮到 2026 年散户普通股；更新后的运营指标，把用户连接到实际变现；直接证据证明 pre-IPO 路径不只是预留
              ticker
              和联合发布的新闻稿；以及一份清算瀑布分析，说明散户普通股到底买到了什么。在此之前，最干净的综合判断是高风险、中等信心、估值拉伸。击穿核心论点的触发点不只是增长放缓，而是又一轮融资事件仍无法对齐价格、权利和规模披露。
