  - id: TV003
    title: 牛市 / 基准 / 熊市场景表
    columns:
      - 场景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - 2026-2027 年收入拐向 $30M-$40M，IPO 路径成真，披露冲突得到勾稽。
        - 按 8x-10x 前瞻增长型市场 / 软件倍数估值为 $240M-$400M；存在上行空间，但仍低于旧有 $1B 叙事。
        - 执行风险、稀释，以及无法把规模主张转成现金流。
        - 需要多项尚未公开的硬证据。
      - - 基准
        - 未来 12-24 个月收入提升到约 $15M-$25M，但仍需要融资，治理条款也没有明显改善。
        - 按 5x-6x 收入估值为 $75M-$150M；当前 Reg CF 价格大致落在区间顶部附近。
        - 持续亏损、变现放缓和少数股东保护弱。
        - 与今天公开证据最一致。
      - - 熊市
        - 规模主张无法转化为变现，另一轮融资重置预期，普通股被证明在结构上劣后于早期资本。
        - 按困境 2.5x-4x 收入口径或资本重组后的股权结果，估值为 $20M-$50M。
        - 下轮降价稀释、IPO 路径失败，或融资疲劳。
        - 若再融资时仍不勾稽价格和权利，就会触发。
    notes: 场景区间是分析承销区间，不是市场隐含标记。
    claimRefs:
      - CV003
      - CV015
      - CV017
      - CV033
      - CV041
      - CV042
      - CV043
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Zillow Group
        - 2026 TTM 收入 $2.69B；租赁 Q1 收入 $183M
        - $7.13B 市值；EV/sales 2.51x
        - 最接近的大型美国租赁市场标杆，也直接说明成熟租赁变现长什么样。
        - 业务组合更宽、上市公司成熟度更高，资本结构也大不相同。
      - - CoStar / Apartments.com 平台
        - 2026 TTM 收入 $3.41B；2026 指引 $3.78B-$3.82B
        - $12.35B 市值；EV/sales 3.60x
        - 有公寓敞口的成熟在线房地产市场组合，可作为公开标杆。
        - 集团经济性分散，不是纯 SMB 租赁工作流工具。
      - - AppFolio
        - 2026 TTM 收入 $995M；FY26 指引 $1.110B-$1.125B
        - $5.50B 市值；EV/sales 5.41x
        - 物业管理软件中最适合对照工作流变现的公开可比。
        - SaaS 模型更成熟、盈利能力更强，企业级功能也更深。
      - - Rightmove
        - 2025 收入 $0.57B / GBP 425.13M
        - GBP 3.27B 市值；EV/sales 7.62x
        - 高利润分类门户标杆，说明稀缺的优质市场能拿到什么溢价。
        - 英国市场结构和盈利能力远强于 Rentberry 的公开记录。
      - - Scout24 / ImmoScout24
        - 2026 TTM 收入 EUR 692.13M
        - EUR 5.09B 市值；EV/sales 7.84x
        - 欧洲大陆门户标杆，能支撑强分类信息估值。
        - 成熟欧洲门户，变现和现金生成能力已经站稳。
    notes: 表格聚焦公开租赁、分类信息和物业管理参照，因为可比私有 RentTech 轮次披露稀疏且不一致。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-relevant public marketplace and property-management comparables available from reviewed
        2026 sources; excludes opaque private transaction comps without accessible financial context.
