  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与 2024 年独角兽、2026 年零售融资之间的张力
        blocks:
          - type: paragraph
            body: >
              Rentberry 的公开估值故事现在落在两个很不一样的锚点上。第一个是 2024 年 Series A 叙事：Tracxn 和 AIN 都报道，融资规模为 $90 million、估值为 $1
              billion，这也是公司独角兽标签的来源。第二个是 2026 年 Republic 面向散户的普通股发行，披露价格为每股 $1.85，披露的投前估值为 $138.7
              million。这些数字不能直接逐项比较，因为 2024 年融资可能带有优先权、清算优先权和中间稀释，而这些在公开材料里不可见；2026
              年零售证券则是普通股，少数股东保护很弱。即便如此，差距也大到不能忽视：2024 年独角兽标记约为当前 Reg CF 投前估值的 7.2x。


              支撑披露的质量也不均衡。Republic 及所附认购材料显示，散户投资者买入的是普通股，必须加入股东协议，并通过不可撤销代理实质上把投票控制权交给 CEO。KingsCrowd
              补充称，该估值由内部确定，普通股没有反稀释保护，当前投资者需要非常大的最终退出，才可能获得风投式回报。公司营销又把故事拉向相反方向：推介 2027 年 $1 billion 以上 IPO 路径、计划中的
              $3.50 后续发行价格，以及围绕用户、物业和既往融资额的更大规模主张。结果既不是干净的 down-round 论点，也不是干净的验证论点；它是一套披露张力论点。
