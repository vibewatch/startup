      - number: '8.3'
        title: 牛、基准、熊情景及敏感性驱动因素
        blocks:
          - type: paragraph
            body: >
              上行情景并非不可能，但需要几件事快速且可信地发生。第一，管理层必须证明 2025 年收入基数低估了 2026-2027 年更大的商业 run-rate。第二，公司必须把当前 pre-IPO 和 Reg A
              信息转化为真正的融资阶梯，而不是营销阶梯。第三，用户、物业和融资历史主张需要对齐，让投资者相信规模叙事。如果这些门槛都通过，Rentberry
              可能长进高增长软件或市场平台的可比区间，而不是被当成变现很薄的众筹发行人来评判。在那个世界里，当前散户投资者仍可能获得上行。


              基准和熊情景更容易从当下公开记录建模。基准情景假设 Rentberry 是一个真实但变现仍偏温和的租赁工作流平台，会继续融资、继续改善收入，但距离支撑 $1 billion
              叙事下公开可比倍数所需的规模仍很远。熊情景假设披露张力的反面胜出：股权结构拥挤，普通股排在有实质优先权负担之后，变现相对用户主张仍很薄，下一轮融资再次重置价格。因此，估值对四个驱动因素最敏感：2026-2027
              年实际收入增长、少数股东保护与优先权负担的对比、IPO 时间表的可信度，以及管理层能否对齐目前彼此指向不同方向的平台规模主张。
