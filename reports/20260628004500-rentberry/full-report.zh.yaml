      - number: '3.3'
        title: 定价、打包、分发与切换成本
        blocks:
          - type: paragraph
            body: >-
              定价策略是 Rentberry 承压最清楚的地方之一。Rentberry 列出低价的 à la carte 房东收费，但更宽的赛道里充满免费入门或租客付费模式。Zillow
              把核心房东工具定位为免费，并靠高级曝光和筛查变现；Avail 提供免费基础层和每套 $9 的升级；TurboTenant 以每月 $0 为锚点，另售付费增强；RentSpree
              对基础筛查工作流中的中介和房东免费；Innago 宣称自己完全免费；Zumper 每月最多宣传 5 条免费房源。这种打包降低采用摩擦，也让并排试用很容易。分发进一步放大问题。Zillow 强调每月 3000
              万以上访客，Apartments.com 加上 Homes.com 和 8100 万月度租客访问，TurboTenant 宣传发布到 25+ 个网站，Avail 覆盖 19 个网站，Hemlane 覆盖
              Zillow、Apartments.com 和其他门户，RentSpree 则依托 300+ MLS
              和房地产合作伙伴。结果是切换成本只有中等。房东可以混用门户和工作流供应商，也可以先测试多个产品再标准化，这意味着 Rentberry 必须靠工作流质量和线索转化取胜，而不能只靠锁定。
