      - - 57% 的续租占比
        - 驱动
        - 2026 当前
        - 提高能守住入住率、降低流转摩擦的工具价值
        - 询问 Rentberry 是否从续租变现，还是主要来自新租约
      - - 45% 的管理者计划整合技术栈
        - 驱动
        - 2026 当前
        - 带动对打包租赁、支付和维修工作流的需求
        - 梳理 Rentberry 必须接入哪些集成，才能替代单点方案
