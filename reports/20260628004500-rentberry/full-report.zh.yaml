      - number: '2.4'
        title: 增长驱动、采用约束与保留矛盾
        blocks:
          - type: paragraph
            body: >-
              2026 年环境同时有采用顺风和变现逆风。昂贵的购房市场、买房相对租房 105%
              的月度溢价，以及强劲续租，仍在结构性支撑需求。与此同时，新一轮多户住宅供给、高让利和可负担性压力削弱房东定价权，可能推迟软件采购或压缩抽成率。帮助租赁平台证明入住率 ROI
              的同一轮疲软，也让公开市场指标变得嘈杂：Zillow 显示全国租金仍在上涨，Realtor.com 显示大都会区中位数仍在下降，CBRE 和 Census
              发布的空置率差异明显，因为它们测量的总体不同。监管压力也在上升。FTC 2026
              年费用规则制定流程和此前与大型租赁运营方的和解，推动市场走向更清晰的全包价格和更好的披露系统；欺诈和住户体验缺口，也增加了自动化筛查、支付和沟通的理由。尽调的主要缺口，不在于市场是否真实，而在于
              Rentberry 能在这个宽泛但方法上混乱的类别中抓住哪一个收入池。
