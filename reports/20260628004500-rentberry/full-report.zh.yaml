  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Rentberry 的产品表面带来真实住房法风险，因为平台不只做分类信息。官方页面显示，租客筛查、申请、租金收取和基于报价的定价都在同一工作流里。这一点很重要，因为 FTC 和 CFPB 指引把租客筛查报告视为
              FCRA 下的消费者报告；CFPB 还明确表示，基于筛查报告提高租金、增加押金或要求共同签署人，属于触发通知义务的 adverse actions。HUD 的 Fair Housing Act 概览和 FTC
              房东指引又加了一层：如果筛查规则对受保护群体造成不成比例的不利影响，或一刀切排除犯罪史，即便平台把自己定位为中立工具而非经纪人，也可能产生 fair-housing 风险。


              Rentberry
              自己的合同不能消除这一风险。条款称公司只是中立线上场所，用户仍负责合规；但隐私和租客筛查页面确认，平台收集信用、驱逐、犯罪、就业和银行账户信息，并通过第三方供应商传输其中一部分。实践中，这意味着核心价值主张仍依赖受监管数据流和住房决策。对投资人而言，法律问题不是法律是否适用——显然适用——而是
              Rentberry 能否证明 adverse-action、数据治理和 fair-housing 控制在多个司法辖区达到生产级质量。


              Seattle 诉讼表明，政策风险也有历史基础，并非假设。Seattle 于 2018 年通过针对租金竞价平台的暂停令，Rentberry
              提起挑战，案件后来在条例废除后失去实际意义。尽管这一具体争议已经结束，它说明原始定价模型的一部分可能招致市政反弹和未来限制。更早的 ICO / 代币销售历史则增加了另一层声誉和证券法阴影：2018
              年直接来源显示，Rentberry 围绕其租赁生态营销 BERRY 代币销售；同期 SEC 指引警告，代币销售可能涉及证券法、欺诈和有限追偿风险。
