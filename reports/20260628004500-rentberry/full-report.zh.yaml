      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              客户地图按资产组合复杂度可以清晰拆分。租客侧，终端用户想要透明费用、数字申请、排期、电子签名和支付。供给侧，业主运营者和小房东可能直接购买并支付软件，因为他们自己也执行租赁任务。资产组合放大后，买方-用户-付款方关系会拆开：租赁团队和现场运营者使用产品，区域运营或物业经理选择产品，资产所有者或公司领导批准预算。这个区别很重要，因为
              Rentberry
              的价值主张同时覆盖需求生成和工作流效率。因此，当空置率上升、欺诈增加、住户服务预期提高时，产品组合更有吸引力；这些条件会让运营方更愿意为更快转化、更好筛查和更少人工交接付费。物业管理调查的公开证据显示，平台整合和住户体验缺口正在让这一工作流层更具战略意义，而不是可有可无。
