          tone: positive
        - id: n2
          label: 2026 年零售普通股：投前 $138.7M，$1.85/股
          detail: 当前公开价格发现远低于独角兽标签。
          tone: neutral
        - id: n3
          label: 少数股东保护薄弱
          detail: 普通股、无反稀释、CEO 投票代理、优先股结构未知。
          tone: negative
        - id: n4
          label: 经济性仍薄
          detail: 2025 年收入仅 $1.72M，却对应大规模平台叙事。
          tone: negative
        - id: n5
          label: 上市可比公司交易在约 2.5x-7.8x EV/sales
          detail: Zillow、CoStar、AppFolio、Rightmove 和 Scout24 都远低于 Rentberry 隐含倍数。
          tone: negative
        - id: n6
          label: IPO / AI / 规模叙事仍是期权
          detail: 如果增长加速，可能有价值，但还不能硬撑估值。
          tone: positive
        - id: n7
          label: 建议：继续研究
          detail: 高风险、中等信心，估值立场偏紧。
          tone: neutral
    approximationNotes: 节点排序突出决策链，而不是覆盖本章每一个事实。
    claimRefs:
