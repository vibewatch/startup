      - number: '8.2'
        title: 公开可比公司与倍数缺口
        blocks:
          - type: paragraph
            body: >
              这里最站得住脚的估值视角是收入倍数比较，而不是折现现金流或 EBITDA。Rentberry 仍在亏损，公开收入相对融资叙事很小，也没有可靠的公开利润率桥、留存曲线或 cohort 级变现证据。以此为基础，按
              KingsCrowd 的 $1.72 million 审计收入数据计算，2026 年 Republic 投前估值意味着约 80.5x 的 2025 年 trailing
              revenue。放在公开租赁、分类信息和房地产软件参照物旁边，这已经显得拉伸。Zillow 交易在约 2.5x EV/sales，CoStar 约 3.6x，AppFolio 约 5.4x，Rightmove 和
              Scout24 等高利润率门户模型约 7.6x-7.8x。它们都不是完美可比，但变现规模都远大于 Rentberry，披露也好得多。


              旧的独角兽标记更难站住脚。若简单把 2024 年 $1 billion 估值延续到同一 2025 年公开收入基础上，隐含倍数约为 580x
              revenue。这个水平远超成熟门户和软件同业；除非有非常强且文档充分的前瞻收入运行率案例，否则无法承销。KingsCrowd 自己的负面框架方向一致：它称当前 Republic 定价激进，指出 AppFolio
              约 6x revenue，并认为即便要取得 10x 毛回报，也需要超过 $1.39 billion 的退出估值和远高于 Rentberry 已披露水平的收入。这不能证明 Rentberry
              在绝对意义上被高估，但说明当前价格已经假设了一次公开记录尚未证明的变现跃迁。
