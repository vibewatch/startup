  - id: FI001
    title: 收入模型桥
    type: flow
    layout: wide
    summary: 公开证据显示，Rentberry 将租客和房东工作流活动转化为多个小额费用池，但留存毛利层仍不透明。
    approximationNotes: 这张桥接图是定性的，因为公开材料披露的是标价和漏斗顶部规模口径，而不是各收入流的实际组合或利润率。
    data:
      nodes:
        - id: traffic
