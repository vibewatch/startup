      - number: '7.3'
        title: 治理、融资可信度与竞争风险
        blocks:
          - type: paragraph
            body: >-
              文件中最尖锐的负面证据集中在治理和披露可信度。Republic 自己的募资材料称，创始人兼 CEO Oleksiy Lubinsky
              通过代理投票和股东协议条款集中掌握投票控制权，少数投资者实际上无法影响公司决策。同一份 Republic 风险因素还称，财务报表按持续经营基础编制，承认反复亏损，并提示可能需要额外资本。KingsCrowd
              又补上运营背景：2026 年 6 月 Republic 融资以 $138.7 million 估值营销普通股，而公司报告的 FY2025 收入只有 $1.72 million、净亏损 $4.77
              million，月烧钱约 $277.7 thousand。风投支持的公司可以承受这种组合，但它不是干净的后期成熟画像。


              AIN 2024 年报道让可信度问题更重。第一篇文章复述了 $90 million Series A 和 $1 billion 估值叙事，同时配上分析师质疑：一个营业额不高、亏损明显、用户规模远小于 Zillow
              的业务，能否支撑独角兽定价。后来的 AIN/Molfar 调查更进一步，称公司没有提供所要求的交易确认，过往披露收入仅约 $1 million 且有亏损，围绕 Berkeley Hills 和 GTM
              的投资者透明度偏弱。投资者不必先认定欺诈才把这视为严重问题；公开记录已经显示，头部融资故事存在争议，且尚未充分对齐。


              竞争和宏观环境让这道治理缺口后果更大。Zillow、Apartments.com、Avail、TurboTenant 和 Zumper
              都提供同一房东工具栈中的关键部分——房源分发、租客筛查、租约、维护和付款——且常以免费或低价入口切入，触达受众更大。同时，Zillow 和 Harvard 的 2026
              年租赁市场数据指向租金增长放缓、优惠增加和空置压力。这对租客有利，却会让一个向更价格敏感市场销售推广房源、获客线索、筛查和房东工作流工具的平台更难变现。
