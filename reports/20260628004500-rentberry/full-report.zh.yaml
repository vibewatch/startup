  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 已验证模块与租赁工作流实际运行方式
        blocks:
          - type: paragraph
            body: >-
              Rentberry
              已经跨过产品宽度的第一道尽调门槛：它自己的产品、定价和帮助页面验证了平台覆盖长期租赁工作流的大部分环节，且同时面向市场两端。租客侧，已验证路径包括搜索、申请、看房请求、筛查、电子签名、支付和维修。房东侧，已验证路径包括发布房源、筛查请求、看房协调、文件签署、租金收取和付费推广。这一点很重要，因为产品不只是房源门户；它想在发现之后继续把用户留在运营工作流里。当某个功能同时出现在营销页面和分步骤帮助文章中，证据最强。筛查、看房、维修、支付和电子签名都达到这一标准。相反，围绕
              AI 辅助和自动化的一些更高层主张，仍更多停留在营销语言，而不是深度记录的用户流程里。因此，正确读法是工作流覆盖已经验证，自动化深度只得到部分验证。
