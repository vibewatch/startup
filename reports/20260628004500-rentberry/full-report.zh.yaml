chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与商业模式
        blocks:
          - type: paragraph
            body: >-
              Rentberry 现在的身份，已经比最初让它出名的产品故事宽得多。官网仍像一个全球长期租赁市场，配套租客和房东的实际工作流：搜索、申请、看房、筛查、支付、电子签名和维修。但 2026
              年的投资者和新闻材料，已经把公司重新包装成 AI 房地产经纪和 pre-IPO proptech 平台。这一重新定位很关键，因为产品故事已经从减少经纪摩擦，扩展成自动化整个租赁生命周期的更大主张。


              对一家风投支持的私人公司而言，Rentberry 的商业模式也异常可见。官方投资者网站披露了租赁申请、筛查、订阅、租金收取，以及电子签名 /
              数据存储等工作流定价点，同时也指向保险、线索生成和广告。即使没有审计财务，这也足以让人看清变现逻辑：Rentberry 想向租赁交易两端出售工作流工具，再在其上叠加更高毛利的投资者和企业叙事。


              主要保留意见在于分母纪律。官方材料明确支持旧金山为总部城市、2015
              年为成立年份，但即使是基础身份页面，街道地址层面也不一致，后续增长主张又使用多套互不兼容的单位。因此，后文可以有信心沿用公司的宽泛身份，但精确地址、规模和成熟度指标应作为尽调敏感项处理，而非标准事实。
