        title: 留存或满意度代理、投诉与支持摩擦
        blocks:
          - type: paragraph
            body: >-
              Rentberry 最好的公开留存代理不是硬 cohort 数据，而是评论密度和正面程度。GetApp Canada 显示 61 条评论评分 4.8/5、推荐率 95%；SourceForge 显示 23
              条评论平均 5.0/5；Capterra Canada 和 Product Hunt
              也给出对一体化工作流的强正面描述。这些信号意味着房东和租客中至少有一部分重复或满意使用。官方帮助表面也覆盖租金支付、通用账户支持、租客筛查和房东运营，与一个预期在初次匹配后继续服务客户的产品相一致。


              不过，反向证据过于具体，不能忽视。Trustpilot 的存档页面一边给出不错的总评分，一边列出关于诈骗或抓取房源、房东失联、重复库存，以及申请流程跳转到 Expedia 的失效问题。GetApp Canada
              包含一条零分评论，称筛查流程是骗局；另一条评论则抱怨高峰期支持变慢、小城市房源有限。因此公开留存证据看起来正面但浅：评分好，投诉也真实，而且仍没有披露 churn、续约、NRR、GRR 或 cohort
