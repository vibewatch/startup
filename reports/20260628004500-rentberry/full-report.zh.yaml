  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与解决方案类别
        blocks:
          - type: paragraph
            body: >-
              Rentberry 面对的不是一个边界清楚的单一软件类别。在美国房东工作流中，买方至少可以通过四条路径完成同一件事。第一类是已经扩展到工作流的租客需求门户，最典型的是 Zillow Rental Manager
              和 Apartments.com Rental Manager。这些平台从聚合受众起步，再加入申请、筛查、租约、租金收取或维修。第二类是 freemium 房东运营工具，如
              Avail、TurboTenant、RentSpree、Zumper 和 Innago；它们通过降低软件入门价格竞争，并把变现转向筛查、支付、升级或推广房源。第三类是更宽的物业管理套件，如
              Buildium、AppFolio 和
              Hemlane；当买方需要会计、资产组合控制或服务层，而不只是房源发布和租出时，它们开始相关。第四类是现状替代方案：把分发房源、筛查、租约和支付分别交给不同供应商，这让多平台并用仍然可行，也限制了锁定效应。Rentberry
              的挑战在于，产品横跨四类的一部分，却既不是默认需求入口，也不是其中任何一类里最深的后台系统。
