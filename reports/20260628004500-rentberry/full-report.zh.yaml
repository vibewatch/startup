      - number: '1.2'
        title: 创始人、领导层与治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始人故事足够可信，可以复用，尽管不同来源之间并不完全干净。AIN 的 2024 年融资报道称 Oleksiy Lubinsky、Lily Ostapchuk、Oleksandr Kotovskov 和
              Denis Golubovsky 为 2015 年创始人；KingsCrowd 摘要的 2026 年 Republic 活动则明确显示 Lubinsky 为 CEO、Ostapchuk 为 CPO。官方 2026
              年投资者材料还展示了营销、技术、设计、客户成功和业务拓展等岗位的团队。合起来看，这些来源支持一个判断：Rentberry 仍由创始人带队，运营班底也不只是一个有魅力的 CEO。


              话虽如此，对一家面向散户募集 pre-IPO 资本的公司而言，公开治理披露偏弱。已审阅的官方材料给了高管履历、投资者背书和众筹行动号召足够空间，却没有披露公开董事会名单、观察员权利，或主要 VC
              与众筹利益相关方的治理影响力。这个缺口值得注意，因为公司要求投资者承销一个雄心勃勃的 IPO 叙事，同时没有提供机构尽调通常会要求的基本董事会层面背景。


              关键人物依赖仍然真实存在。Lubinsky 同时作为创始人、CEO、战略公开面孔，以及产品和融资材料中的引述来源出现。周边团队看起来能运转，但叙事和融资压力仍似乎集中在他身上。承销时，应把 Rentberry
              视为一家创始人中心型公司：高管宽度尚可，但公开治理透明度偏薄。
