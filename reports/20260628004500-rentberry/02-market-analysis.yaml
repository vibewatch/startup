  evidenceGaps:
  - type: missing-source
    severity: material
    topic: marketplace-tam
    missingEvidence: A public, methodology-transparent dollar estimate for online apartment-rental marketplaces that excludes short-term rentals, home sales, and broader property-management software.
    whyItMatters: Without a clean marketplace revenue pool, traffic and listing scale cannot be translated into a precise TAM or used safely in valuation narratives.
    diligencePath: Purchase the full IBISWorld report or find segment disclosures from Zillow, CoStar, or another public marketplace that isolate rental-marketplace revenue.
    relatedQuestionRefs:
    - QM023
  - type: conflicting-data
    severity: material
    topic: measurement-scope
    missingEvidence: A reconciled methodology note that maps HVS, large-metro listing trackers, and institutional multifamily datasets onto one common market framework.
    whyItMatters: The same chapter can otherwise appear to contradict itself on vacancy and rent growth even when publishers are measuring different cohorts.
    diligencePath: Request cohort definitions from each publisher and build a crosswalk separating all-rental-housing, large-metro listing, and institutional multifamily lenses.
    relatedQuestionRefs:
    - QM024
  - type: private-evidence-only
    severity: minor
    topic: rentberry-performance-claim
    missingEvidence: Independent proof that Rentberry landlords actually rent properties 30-40% faster than relevant alternatives.
    whyItMatters: This claim would materially strengthen the buyer-value narrative, but as of this run it remains a company assertion rather than an externally corroborated benchmark.
    diligencePath: Request cohort-level conversion or time-to-lease data from Rentberry, plus a methodology note and customer references that can be checked against peers.
    relatedQuestionRefs:
    - QM025
