figures:
- id: FM001
  title: Market sizing lens
  type: pyramid
  layout: standard
  summary: Evidence-constrained sizing pyramid that moves from the full U.S. rental stock to the narrower digitally marketed workflow layer most relevant to Rentberry.
  data:
    nodes:
    - label: Broad housing lens
      value: 50.5M+ projected rental units
      detail: Realtor.com’s stock projection shows the outer boundary of long-term rental inventory in the United States.
    - label: Professionally managed apartment lens
      value: ~24% of apartment stock / ~5.3M units
      detail: Top-50 managers represent a concentrated operations-buying cohort inside a much more fragmented ownership base.
    - label: Digital marketplace lens
      value: 1.9M Zillow Rentals listings; 10.1B annual visits
      detail: Public marketplace evidence is strongest on inventory and audience scale rather than disclosed revenue.
    - label: Rentberry wedge
      value: Long-term listings + workflow tools in 90+ countries
      detail: Rentberry’s realistic wedge is digitally marketed long-term rental inventory that also needs applications, payments, screening, and service workflows.
  approximationNotes: The layers are not additive or perfectly nested across one source set. They intentionally mix stock, concentration, audience, and company-footprint lenses because a clean external TAM for the full category is not publicly disclosed.
  claimRefs:
  - CM009
  - CM005
  - CM040
  - CM041
- id: FM002
  title: Market estimate range
  type: range
  layout: wide
  summary: Different software-market estimates and implied values preserved in one $B frame to show why TAM claims diverge by scope and publisher.
  data:
    items:
    - label: Global PMS market (2023 to 2030)
      low: 5.51
      high: 9.68
      unit: $B
      detail: Grand View’s broadest market lens across all property-management software segments.
    - label: Implied U.S. PMS market (2023)
      low: 1.81
      high: 1.81
      unit: $B
      detail: Derived from Grand View’s public North America and U.S. shares; not a directly disclosed figure.
    - label: Implied U.S. residential PMS lens (2023)
      low: 1.19
      high: 1.19
      unit: $B
      detail: Derived by applying the public residential application share to the implied U.S. market.
    - label: Technavio implied U.S. PMS market (2025 to 2030)
      low: 2.09
      high: 3.41
      unit: $B
      detail: Backsolved from the stated $1.32B growth opportunity and 10.3% CAGR.
  approximationNotes: All values are in USD billions. Items intentionally mix global and U.S. software lenses because the public source set does not disclose one comparable Rentberry-specific market number. Equal low/high values denote point estimates rather than observed statistical ranges.
  claimRefs:
  - CM021
  - CM022
  - CM023
  - CM024
  - CM039
