tables:
- id: TM001
  title: Market definition table
  columns:
  - Lens
  - Included spend / activity
  - Excluded spend / activity
  - Buyer / payer
  - Relevance to Rentberry
  rows:
  - - Long-term residential rental marketplace
    - Listing discovery, applications, tours, leasing, fee disclosure, renter-landlord matching
    - Short-term stays, hotel inventory, home sales
    - Landlords, property managers, renters
    - Directly matches Rentberry’s two-sided search and conversion surface
  - - Property-management workflow software
    - Rent collection, screening, e-sign, maintenance, resident communications, reporting
    - Brokerage CRM unrelated to occupied rentals
    - Owner-operators, third-party managers, portfolio operators
    - Matches Rentberry’s post-listing operating tools and automation value
  - - Digitally marketed multifamily inventory
    - Professionally managed apartments and rental homes promoted through online channels
    - Undigitized local inventory and owner-only word-of-mouth leasing
    - Leasing and regional operations teams
    - Best observed SAM for lead-generation plus workflow software
  - - Renter transaction and trust layer
    - Applications, screening, deposits, fee transparency, payment rails
    - Mortgage underwriting, title, home purchase closing
    - Renter user; operator budget owner
    - Important because compliance and fraud create software ROI
  - - Adjacencies deliberately excluded
    - Vacation rentals, corporate travel, home sales portals, mortgage origination
    - Included only as distribution analogs, not TAM
    - Different buyers and economics
    - Avoids overstating market size with unrelated housing spend
  notes: Boundary rows intentionally separate listing/discovery from ongoing property operations. Short-term rentals and home sales are excluded because their buyer, inventory, and monetization dynamics differ from Rentberry’s core long-term residential workflow.
