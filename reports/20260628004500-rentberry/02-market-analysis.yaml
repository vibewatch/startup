- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication for adoption
  - Diligence ask
  rows:
  - - 105% monthly premium to buy vs rent and 3.4M single-family home shortage
    - Driver
    - 2026 current
    - Keeps more households in rental tenure and supports ongoing leasing demand
    - Test whether renter retention lifts platform monetization or only occupancy
  - - 57% lease-renewal share
    - Driver
    - 2026 current
    - Raises value of tools that preserve occupancy and reduce turnover friction
    - Ask whether Rentberry monetizes renewals or mostly new leases
  - - 45% of managers plan tech-stack consolidation
    - Driver
    - 2026 current
    - Creates appetite for bundled leasing, payments, and maintenance workflows
    - Map which integrations Rentberry must land to displace point solutions
  - - Resident-service gaps (bundled services, deposit alternatives)
    - Driver
    - 2026 current
    - Supports product expansion beyond listing discovery into payments and service workflows
    - Verify which service gaps Rentberry can monetize directly
  - - High vacancy and widespread concessions
    - Constraint
    - 2026 current
    - Improves urgency to lease units but can compress operator budgets and monetization
    - Separate occupancy ROI from pure SaaS willingness to pay
  - - Construction slowdown after supply wave
    - Driver + Constraint
    - 2026->2027
    - Near-term softness remains, but later supply normalization can restore pricing power
    - Track whether Rentberry wins more in oversupplied or re-tightening markets
  - - FTC rental-fee rulemaking and prior fee settlements
    - Constraint
    - 2026 current
    - Requires better all-in pricing, disclosure, and auditability across portals and PMS tools
    - Review Rentberry’s fee-display and screening disclosures against likely rule direction
  - - Application-fraud risk and manual verification limits
    - Constraint
    - 2026 current
    - Makes screening, identity checks, and document workflows more strategic
    - Assess fraud tooling, chargeback controls, and liability allocation across partners
  notes: Direction captures whether the factor mainly expands adoption, mainly constrains it, or does both. Several tailwinds for workflow adoption coexist with headwinds for landlord pricing power, so monetization and adoption should not be treated as the same thing.
