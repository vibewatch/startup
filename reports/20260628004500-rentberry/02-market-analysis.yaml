- id: FM004
  title: Adoption funnel or value-chain map
  type: flow
  layout: standard
  summary: Value-chain view of how renter demand, operator pain points, workflow automation, and compliance pressures connect in the long-term rental stack.
  data:
    nodes:
    - id: search
      label: Renter search and comparison
      detail: Renters expect transparent fees, private tours, applications, and mobile-friendly discovery.
    - id: occupancy
      label: Owner / manager occupancy pressure
      detail: Vacancy and concessions make lead conversion and pricing visibility more important.
    - id: workflow
      label: Workflow automation layer
      detail: Applications, screening, e-sign, payments, and maintenance reduce manual handoffs.
    - id: control
      label: Compliance and control layer
      detail: Fee transparency, fraud controls, and auditability increase software importance.
    - id: outcome
      label: Operating outcome
      detail: Faster lease-up, better renewals, cleaner collections, and lower service friction.
    edges:
    - from: search
      to: occupancy
      label: renter expectations shape conversion economics
    - from: occupancy
      to: workflow
      label: soft market increases demand for automation
    - from: workflow
      to: control
      label: digitization exposes compliance and fraud needs
    - from: control
      to: outcome
      label: better systems improve lease-up and resident operations
