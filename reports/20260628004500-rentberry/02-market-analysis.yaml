chapter:
  number: 2
  title: Market Analysis
  summary: Rentberry sits at the intersection of long-term rental listings and property-management workflow software. Public evidence supports a large and still-digitizing market, but TAM claims diverge sharply by scope, so the cleanest lens is digitally marketed long-term rental inventory rather than all housing or all real-estate software spend.
sections:
- id: market-boundary
  title: Market boundary and category choice
  body: 'Rentberry should be analyzed as a long-term residential rental marketplace layered with leasing and operating workflow software, not as a generic real-estate portal and not as a short-term accommodation marketplace. The retained product evidence is explicit that the platform spans search, applications, tours, rent payments, e-signature, tenant screening, and maintenance. That bundle places Rentberry at the overlap of listing distribution and property-management tooling. The ownership side of the market is also fragmented, which matters because fragmentation raises customer-acquisition cost and makes workflow simplicity important: small landlords may be owner, operator, and payer in one seat, while larger portfolios separate decision makers across leasing, operations, and asset ownership. Public evidence therefore supports a boundary that includes digitally marketed, long-term rental units and the software stack needed to fill and service them, while excluding short-term stays, home
    sales, mortgage origination, and general travel marketplaces.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
