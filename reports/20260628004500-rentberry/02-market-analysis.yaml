- id: multi-lens-sizing
  title: TAM, SAM, and public sizing lenses
  body: 'A single clean TAM number is not supportable from retained public sources, so the chapter uses multiple lenses. The broadest housing lens is national rental stock and renter households: Census shows a 7.3% rental vacancy rate and Realtor.com suggests the stock could exceed 50.5 million units by early 2027. The next layer is the professionally managed apartment footprint, where top-50 managers control about 24% of stock and therefore represent a concentrated workflow-buying cohort even though apartment ownership itself remains fragmented. For software spend, analyst estimates point to a U.S. property-management-software market in the low-single-digit billions, but scope differs by publisher and year. For marketplace scale, public evidence is stronger on listings and traffic than revenue: Zillow Rentals reportedly carries 1.9 million listings and the Zillow network sees 10.1 billion annual visits, while IBISWorld’s public page confirms an online apartment-rental category but redacts
    the revenue figure. The right takeaway is that Rentberry’s near-term SAM is narrower than total housing spend and its most defensible SOM is digitally marketed long-term rental inventory requiring both lead generation and workflow automation.'
