- id: drivers-and-constraints
  title: Growth drivers, adoption constraints, and preserved contradictions
  body: 'The 2026 environment contains both adoption tailwinds and monetization headwinds. Demand is still structurally supported by an expensive for-sale market, a 105% monthly premium to buy versus rent, and strong lease renewals. At the same time, a wave of new multifamily supply, high concessions, and affordability stress weakens landlord pricing power and can delay software purchasing or compress take rates. The same softness that helps a leasing platform prove occupancy ROI also means public market indicators are noisy: Zillow shows rents still up nationally, Realtor.com shows large-metro medians still down, and CBRE and Census publish materially different vacancy rates because they measure different universes. Regulatory pressure is also rising. The FTC’s 2026 fee-rulemaking process and earlier settlements with large rental operators push the market toward clearer all-in pricing and better disclosure systems, while fraud and resident-experience gaps create more reasons to automate
    screening, payments, and communication. For diligence, the major gap is not whether the market is real; it is which revenue pool Rentberry can capture inside that broad but methodologically messy category.'
