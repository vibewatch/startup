- id: mitigations-and-kill-criteria
  title: Mitigations and kill criteria
  body: 'Rentberry does have visible mitigants, but most are partial. Official materials show TransUnion-backed screening, SSL encryption, formal privacy notices, a live help center, multiple monetization paths, and improved cash on the 2025 KingsCrowd snapshot. None of those eliminate the core residual exposures. The company still needs to prove that screening decisions trigger compliant adverse-action flows, that fair-housing reviews are systematic rather than ad hoc, that payment and chargeback controls are measured, and that support and fraud operations can keep pace with a global marketplace claim. Similarly, the governance stack may work for founder control, but it does little to reassure outside investors unless management can reconcile the 2024 unicorn narrative, the 2026 crowdfunding valuation, and the actual audited revenue base in one coherent bridge.


    For underwriting purposes, the kill criteria are therefore straightforward and monitorable. A credible investment case requires no adverse regulatory action tied to screening, discrimination, payments, or privacy; a management-ready reconciliation pack bridging 2024 and 2026 fundraising claims; stable loss and burn trends relative to revenue growth; and evidence that listing scams, ghosting, and support delays are falling rather than recurring. If management cannot produce those materials, or if new enforcement, lawsuit, or platform-integrity issues emerge, the current pre-IPO framing should be discounted sharply.


    The net view is that Rentberry''s risks are interconnected. Compliance mistakes would worsen reputation, reputation problems would raise customer-acquisition friction, weaker traction would intensify dependence on outside capital, and capital dependence would make the governance-control asymmetry more painful for minority investors. That chain makes this chapter''s adverse evidence central to the final recommendation rather than a side appendix.'
