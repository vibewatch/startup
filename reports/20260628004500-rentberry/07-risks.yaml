company:
  name: Rentberry
chapter:
  number: 7
  title: Risks
  summary: 'Rentberry''s main risks are not generic startup issues but linked, evidence-backed exposures: tenant-screening and fair-housing compliance, sensitive data and payments handling, weak minority-investor governance, and a public credibility gap between the 2024 unicorn narrative and the 2026 crowdfunding terms. Adverse evidence from AIN/Molfar, Republic risk factors, user-review complaints, and the historical Seattle lawsuit means investors should treat compliance execution and disclosure reconciliation as thesis-critical rather than cosmetic diligence items.'
sections:
- id: regulatory-and-legal-exposure
  title: Regulatory and legal exposure
  body: 'Rentberry''s product surface creates real housing-law exposure because the platform is not limited to classifieds. Official pages show tenant screening, applications, rent collection, and offer-based pricing inside the same workflow. That matters because FTC and CFPB guidance treat tenant-screening reports as consumer reports under the FCRA, while CFPB explicitly says higher rent, larger deposits, or co-signer requirements based on a screening report are adverse actions that trigger notice duties. HUD''s Fair Housing Act overview and the FTC''s landlord guidance add a second layer: screening rules that disproportionately disadvantage protected groups, or blanket criminal-history exclusions, can create fair-housing exposure even when the platform positions itself as a neutral tool rather than a broker.


    Rentberry''s own contracts do not remove this risk. The terms say the company is only a neutral online venue and that users remain responsible for compliance, but the privacy and tenant-screening pages confirm that the platform collects credit, eviction, criminal, employment, and bank-account information and transmits some of it through third-party providers. In practice, that means the core value proposition still depends on regulated data flows and housing decisions. For investors, the legal question is not whether laws apply—they clearly do—but whether Rentberry can prove adverse-action, data-governance, and fair-housing controls at production quality across jurisdictions.


    The Seattle litigation shows the policy risk is also historical, not hypothetical. Seattle adopted a moratorium on rent-bidding platforms in 2018, Rentberry challenged it, and the case later became moot after repeal. Even though that specific dispute is closed, it demonstrates that parts of the original pricing model can attract municipal backlash and future restrictions. The older ICO/token-sale history adds a separate reputation and securities-law overhang: direct 2018 sources show Rentberry marketed a BERRY token sale around its rental ecosystem, and SEC guidance from the same era warns that token sales can implicate securities law, fraud, and limited-recovery risk.'
