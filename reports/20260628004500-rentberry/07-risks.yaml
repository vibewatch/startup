  evidenceGaps:
  - type: missing-source
    severity: material
    topic: funding-credibility
    missingEvidence: Primary documents that bridge the 2024 claimed $90 million round, investor identities, security terms, and the 2026 crowdfunding valuation.
    whyItMatters: Without a document bridge, investors cannot tell whether the public valuation narrative reflects realized capital, changed security terms, or promotional framing.
    diligencePath: Request cap table, signed lead-investor docs, board approvals, and any 2024–2026 financing reconciliation pack from management.
    relatedQuestionRefs:
    - QR016
  - type: missing-source
    severity: material
    topic: screening-compliance
    missingEvidence: Production evidence of adverse-action notices, permissible-purpose certifications, dispute-handling workflow, and fair-housing review controls.
    whyItMatters: The platform directly touches screening and pricing decisions, so compliance quality can determine whether legal exposure stays operationally manageable.
    diligencePath: Request sample notices, CRA certifications, policy manuals, training records, and complaint logs.
    relatedQuestionRefs:
    - QR002
    - QR003
    - QR004
  - type: private-evidence-only
    severity: material
    topic: support-fraud-operations
    missingEvidence: Internal metrics for scam takedowns, listing verification, refund rates, first-response SLA, and support escalation outcomes.
    whyItMatters: Public reviews show enough trust failures that investors need operational data to decide whether the problem is shrinking or structural.
    diligencePath: Request monthly trust-and-safety dashboard, refund statistics, staffing ratios, and root-cause trend reports.
    relatedQuestionRefs:
    - QR017
    - QR018
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: privacy-controls
    missingEvidence: Processor list, data-retention schedule, breach history, subprocessor contracts, and cross-border transfer controls for sensitive tenant and landlord data.
    whyItMatters: The privacy policy confirms sensitive data collection but does not prove that privacy and security governance are mature enough for the claimed scale.
    diligencePath: Request data map, DPA templates, incident register, penetration-test summary, and CPRA/GDPR governance artifacts.
    relatedQuestionRefs:
    - QR020
    relatedTableRefs:
    - TR001
    - TR002
  - type: missing-source
    severity: minor
    topic: people-bench
    missingEvidence: Current org chart, leadership bench depth, succession planning, and support or compliance staffing by function.
    whyItMatters: The pre-IPO narrative and global marketplace claim require stronger proof that leadership depth matches the scope of the operating story.
    diligencePath: Request org chart, board roster, key-hire plan, and function-level headcount trend.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR004
