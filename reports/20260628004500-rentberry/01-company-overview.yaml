- id: founders-leadership-and-governance
  title: Founders, leadership, and governance visibility
  body: 'The founder story is credible enough to reuse, even if it is not perfectly clean across sources. AIN’s 2024 funding article names Oleksiy Lubinsky, Lily Ostapchuk, Oleksandr Kotovskov, and Denis Golubovsky as 2015 founders, while the 2026 Republic campaign summarized by KingsCrowd clearly shows Lubinsky as CEO and Ostapchuk as CPO. Official 2026 investor materials add a visible bench around marketing, technology, design, customer success, and business development. Together, those sources support the view that Rentberry is still founder-led and that the operating bench is larger than a single charismatic CEO.


    That said, public governance disclosure is weak for a company courting retail pre-IPO capital. The reviewed official materials make room for executive biographies, investor testimonials, and crowdfunding calls to action, but they do not disclose a public board roster, observer rights, or the governance influence of the major VC and crowdfunding stakeholders. That gap is notable because the company is asking investors to underwrite an ambitious IPO narrative while withholding basic board-level context that institutional diligence would usually demand.


    Key-person dependence remains real. Lubinsky appears as founder, chief executive, public face of the strategy, and quote source in both product and fundraising materials. The surrounding team looks functional, but the narrative and financing burden still appears concentrated on him. For underwriting purposes, Rentberry should be treated as a founder-centered company with decent executive breadth but thin public governance transparency.'
  claimRefs:
  - CO011
  - CO012
