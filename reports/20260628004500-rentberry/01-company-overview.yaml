  evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, board-observer map, and summary of governance rights for lead investors or crowdfunding vehicles.
    whyItMatters: Leadership visibility is reasonable, but board control and investor-rights disclosure are still too thin to judge governance resilience or downside protections.
    diligencePath: Request the latest board deck, cap table with governance rights, and any side-letter summary for major preferred and crowdfunding vehicles.
    relatedQuestionRefs:
    - QO007
    relatedTableRefs:
    - TO002
    - TO003
  - type: conflicting-data
    severity: material
    topic: capital-raised
    missingEvidence: A reconciled cap-table history showing each priced round, crowdfunding vehicle, security type, share count, and post-money valuation bridge from 2024 to 2026.
    whyItMatters: The public record spans a $1 billion 2024 valuation claim, a $138.7 million 2026 Republic pre-money valuation, and official “$40M+ raised” messaging that do not reconcile on their face.
    diligencePath: Obtain subscription documents for the 2024 round, the current Republic campaign materials, and management’s own round-by-round capitalization schedule.
    relatedQuestionRefs:
    - QO012
    - QO025
    - QO026
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, gross margin, cash burn, and ARR definitions that tie to an official financial package rather than a portal summary.
    whyItMatters: KingsCrowd surfaces useful revenue and burn data, but those numbers are not yet corroborated by a directly reviewed company filing or audited management package in this chapter.
    diligencePath: Request the latest audited financial statements, monthly KPI bridge, and the portal data-room source behind the KingsCrowd summary metrics.
    relatedQuestionRefs:
    - QO014
    - QO025
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: material
    topic: scale-metrics
    missingEvidence: A metric dictionary that distinguishes properties listed, properties processed, monthly active users, annual active users or customers, and paid users.
    whyItMatters: Public scale claims change denominator and scope across official pages and third-party summaries, which can distort valuation and product-market-fit conclusions.
    diligencePath: Ask management for the KPI glossary used in investor materials plus the time-series behind each public scale claim.
    relatedQuestionRefs:
    - QO015
    - QO016
    - QO025
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: minor
    topic: headquarters
    missingEvidence: A single authoritative corporate address used across the main website, investor site, legal pages, and fundraising portals.
    whyItMatters: The company is clearly San Francisco-based, but inconsistent street-level addresses can complicate entity verification and service-of-process checks.
    diligencePath: Confirm the registered office, principal office, and any mailing-only address from corporate records and investor documents.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO001
