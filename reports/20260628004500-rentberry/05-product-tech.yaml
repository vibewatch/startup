    severity: material
    topic: trust-gap
    missingEvidence: Independent evidence of SOC 2, ISO 27001, a public status page, uptime reporting, or incident-response disclosure.
    whyItMatters: Policy text alone is weaker than third-party assurance for a platform routing screening, signatures, payments, and maintenance communications.
    diligencePath: Request a current security packet, trust-center materials, uptime history, and any certification or penetration-test summaries.
