    missingEvidence: Benchmarks, model documentation, or customer outcome data that independently validate the AI agent's automation depth, pricing-error reduction, fraud-detection performance, or ROI forecasting.
    whyItMatters: The current AI story could represent real differentiation, but the public record does not let an investor separate genuine production performance from launch marketing.
