- id: operating-architecture-and-dependencies
  title: Operating architecture, partner dependencies, and integration limits
  body: 'Public evidence suggests Rentberry''s architecture is best understood as a workflow orchestrator layered over multiple external dependencies rather than as a transparently documented standalone infrastructure stack. The product clearly routes users through modules for screening, signatures, payments, and support, but the public record also discloses that important trust-critical steps rely on outside parties: TransUnion and MicroBilt for screening, Dropbox Sign or HelloSign for document execution, and card, wallet, and ACH rails for payments. This is not inherently negative; many strong vertical SaaS products are assembled this way. The diligence issue is visibility. The reviewed public sources do not expose an API library, webhook catalog, status page, or technical integration reference that would let an investor distinguish mature internal orchestration from a thin UI over third-party services. So the platform looks operationally broad, but technical maturity is easier to verify
    at the workflow level than at the infrastructure level.'
  claimRefs:
  - CE008
  - CE009
  - CE010
  - CE012
  - CE018
  - CE037
  - CE038
  tableRefs:
  - TE004
  - TE005
- id: support-mobile-surface-and-roadmap
  title: Support model, mobile surface, and what the public roadmap really proves
  body: Rentberry's help center and mobile surfaces show an organization that has productized self-serve support and continues to ship around mobile, but they also show the limits of what is publicly evidenced. The help center is structured around real operating jobs rather than generic FAQ fluff, which is a positive sign for product maturity. Independent directories reinforce that the platform is available on web and mobile and that users recognize a broad all-in-one workflow. The newer 2026 AI app, however, looks more like a consumer-facing rental assistant than a fully evidenced operating system for every landlord workflow. The app-store pages highlight curated matches, neighborhood context, market analysis, and application help; they do not independently prove the full autonomous landlord operations described in 2026 press releases. Public roadmap signals therefore exist, but they are mostly launch markers and support artifacts, not a rigorous changelog or release-notes discipline.
  claimRefs:
  - CE004
  - CE017
  - CE022
  - CE023
  - CE024
  - CE025
