  - TE006
  - TE007
- id: trust-privacy-compliance-and-differentiation
  title: Trust, privacy, compliance, and where marketing outruns proof
  body: 'The strongest product differentiation claim is breadth: few renter-focused platforms try to connect search, applications, tours, screening, signing, payments, and maintenance in one brand surface. But the sharpest diligence questions sit in trust and compliance, not in feature count. Rentberry collects and routes highly sensitive information for screening and payments, shares data with contractors and counterparties to fulfill services, and discloses privacy rights across U.S. and EU regimes. Those disclosures are useful, but they are not a substitute for independent assurance. The reviewed sources did not surface SOC 2 or ISO evidence, audited uptime, or public incident reporting. On screening, FTC guidance makes clear that accuracy, permissible purpose, user certification, and dispute handling are not optional; yet Rentberry''s public materials do not explain how landlords are operationally guided through adverse-action or fair-housing-sensitive steps. Likewise, the 2026 AI-agent
    and pricing claims are directionally interesting but still look marketing-led until independently validated.'
