- id: TI008
  title: Public financial gaps table
  columns:
  - Missing private metric or packet
  - Impact on judgment
  - Exact diligence path
  - Severity
  rows:
  - - Realized pricing and revenue mix by stream
    - Cannot tell whether revenue is mostly recurring subscriptions, transactional fees, or one-off screening volume
    - Request 24-month monthly revenue bridge split across applications, screening, payments, promotion, subscriptions, and insurance
    - Blocking
  - - Payment fee schedule by geography
    - Cannot model payment gross profit or regulatory exposure across markets
    - Request current fee card by country/state, processor contracts, and merchant-loss history
    - Material
  - - Gross margin by product and processor cost
    - Cannot separate attractive recurring software revenue from low-margin payments or pass-through screening
    - Request product P&L, payment processor costs, chargebacks, and support cost allocation
    - Blocking
  - - Current cash bridge after 2026 live offerings
    - Runway estimate is stale without current cash and use-of-proceeds data
    - Request month-end cash from Oct 2025 to present and waterfall of proceeds received from each 2026 raise
    - Blocking
  - - Direct company-specific filing packet
    - Automated public fetch recovered campaign pages but not a direct Rentberry EDGAR filing package
    - Have counsel or finance team provide filed Form C/Form D packet and accession numbers
    - Material
  - - Conversion, retention, and customer concentration
    - Millions-of-users claims do not help underwrite durable revenue without cohort behavior
    - Request landlord cohort conversion, retention, ARPU, churn, and top-customer concentration
    - Blocking
  - - Scale-claim reconciliation memo
    - Conflicting public metrics lower confidence in every ratio derived from them
    - Request a metric-definitions sheet reconciling active users, monthly users, properties, processed properties, and capital raised
    - Material
  notes: These are the minimum workstreams needed to turn Rentberry from a story stock into a financeable underwriting file.
