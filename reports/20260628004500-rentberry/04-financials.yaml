    - 'Medium: clear list price, unknown conversion volume'
    - Application count, attach rate, refund rate, and net recognized revenue
  - - Credit and background checks
    - Applicant-paid US tenant screening
    - USD per screening
    - $39.99 list price; similar to third-party screening benchmarks
    - 'Medium: transparent fee, unknown pass-through economics'
    - Gross vs net screening revenue, vendor rev-share, and completion rate
  - - Tenant insurance
    - Monthly renters-insurance product sold through platform
    - USD per month
    - From $11/month on official pricing page
    - 'Low-medium: recurring in theory, but attach rate and margin undisclosed'
    - Policy count, take rate, insurer economics, and churn
  - - Rent collection
    - Landlord payment-collection workflow
    - USD per landlord/month plus location-varying transaction fees
    - $19.99 list fee; transaction fees vary by location and are not publicly enumerated
    - 'Medium: recurring workflow fee, but payments economics opaque'
    - Gross payment volume, fee schedule by market, processor costs, chargebacks
  - - Agent/broker tooling
    - Paid workflow tier for agents or brokers
    - USD per month
    - $24.99/month list fee
    - 'Medium: simple recurring fee, unknown customer count'
    - Active paying agents, average tenure, and upsell path
  - - Promotion and syndication
    - Paid exposure product for listings
    - USD per month
    - $49.99/month list fee
    - 'Low-medium: monetization exists, but likely episodic rather than durable ARR'
    - Paid-listing adoption, renewal behavior, and ROI evidence
