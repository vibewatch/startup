    - GAAP revenue bridge and current fully loaded headcount
  - - CAC / payback
    - Not publicly disclosed
    - Low
    - Without CAC and payback, paid growth efficiency cannot be judged
    - Channel mix, CAC by landlord cohort, and payback period
  - - Gross margin / payment processor cost / chargeback loss
    - Not publicly disclosed
    - Low
    - Payments-led workflows can look recurring while carrying thin or volatile gross profit
    - Gross margin by product and processor-loss history
  - - Insurance attach rate and contribution margin
    - Not publicly disclosed
    - Low
    - Insurance can be economically important if attach is high; otherwise it is marketing decoration
    - Policy count, attach rate, and commission economics
  notes: The numeric proxy rows are directional calculations from public figures, not audited operating metrics; they are useful mainly because the company markets much larger platform scale than its disclosed revenue implies.
