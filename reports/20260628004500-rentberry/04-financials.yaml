- id: underwriting-blockers-and-verdict
  title: Underwriting blockers, legal trust signals, and final financial verdict
  body: 'The chapter''s adverse evidence does not show a current insolvency event or mass customer failure, but it does show governance and diligence friction. Rentberry''s Seattle litigation history arose from a city moratorium on rent-bidding services and ended in a mootness dismissal after the policy changed, which is not a fatal issue today but does remind investors that parts of the product can attract policy scrutiny. Scam Detector still scores the site only 61.4 out of 100, and review aggregators describe the landlord package as expensive relative to free or cheaper alternatives. Trustpilot''s archived rating is still positive, so the bigger concern is not pure customer hostility; it is the reliability and consistency of the company''s own operating disclosures.


    Financially, that leads to a cautious verdict. Rentberry has a visible fee architecture and enough independent data to show real, if still modest, revenue and ongoing external fundraising. But the company has not publicly closed the core underwriting loops around realized pricing, revenue mix, transaction-fee schedule, gross margin, payments loss rates, insurance economics, current cash, or direct company-specific filing retrieval. Until management produces those materials and reconciles scale and capital-history discrepancies, investors should treat Rentberry as a monetized but under-disclosed proptech platform whose valuation narrative runs materially ahead of public financial proof.'
