  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-mix
    missingEvidence: Monthly revenue bridge split across applications, screening, insurance, payments, promotion, and landlord subscriptions.
    whyItMatters: Without stream-level mix, list prices cannot be translated into revenue quality, recurrence, or margin durability.
    diligencePath: Request a 24-month monthly revenue waterfall and realized ASP schedule by monetization stream.
    relatedQuestionRefs:
    - QI001
    - QI005
    - QI011
    - QI025
    relatedTableRefs:
    - TI001
    - TI002
    - TI008
  - type: private-evidence-only
    severity: blocking
    topic: margin-and-payments-economics
    missingEvidence: Gross margin by product, processor cost, chargeback rates, fraud losses, and insurance commission economics.
    whyItMatters: Payments and screening can look like SaaS revenue while carrying very different economics; margin quality is central to underwriting.
    diligencePath: Request product P&L detail, processor contracts, loss history, and insurance partner economics.
    relatedQuestionRefs:
    - QI012
    - QI023
    relatedTableRefs:
    - TI004
    - TI008
  - type: conflicting-data
    severity: material
    topic: metric-definition-conflict
    missingEvidence: A management memo reconciling active users, monthly users, daily properties, processed properties, employee count, and total capital raised.
    whyItMatters: Conflicting scale claims contaminate every public efficiency ratio and reduce confidence in valuation narrative.
    diligencePath: Request a metric-definitions sheet signed by finance or investor relations, tied to source systems and dates.
    relatedQuestionRefs:
    - QI008
    - QI009
    - QI016
    relatedTableRefs:
    - TI003
    - TI005
    - TI008
  - type: access-blocked
    severity: material
    topic: direct-filing-pack
    missingEvidence: Direct company-specific Form C and Form D packets or accession numbers pulled from EDGAR.
    whyItMatters: Campaign pages summarize terms, but primary filing packets are needed to confirm risk factors, amendments, and legal terms.
    diligencePath: Have counsel or management provide direct SEC accession numbers or export the filed packet from EDGAR.
    relatedQuestionRefs:
    - QI014
    - QI015
    - QI024
    relatedTableRefs:
    - TI006
    - TI008
  - type: missing-source
    severity: material
    topic: payment-fee-geography
    missingEvidence: A complete fee card for rent-payment and collection charges by country, state, or payment method.
    whyItMatters: Location-varying payment fees can materially change gross profit, regulatory exposure, and customer willingness to pay.
    diligencePath: Request the current fee schedule by market and processor plus a history of any pricing changes.
    relatedQuestionRefs:
    - QI005
    relatedTableRefs:
    - TI002
    - TI008
  - type: private-evidence-only
    severity: blocking
    topic: current-cash-bridge
    missingEvidence: Month-end cash balance from Oct 2025 through the latest available month and proceeds actually received from the 2026 offerings.
    whyItMatters: Runway cannot be underwritten from stale cash figures while the company is actively fundraising and marketing an IPO path.
    diligencePath: Request a monthly cash bridge, debt schedule, and use-of-proceeds tracker through the most recent closed month.
    relatedQuestionRefs:
    - QI007
    - QI017
    relatedTableRefs:
    - TI006
    - TI008
