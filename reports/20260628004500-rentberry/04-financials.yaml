    - ~$0.34 using FY2025 revenue and 5M reported MAU
    - Low
    - Suggests monetization depth is thin unless the user number is inflated or revenue is under-disclosed
    - Monthly paying-user count and conversion by product
  - - Estimated revenue per reported property
    - <$0.10 using FY2025 revenue and 20M reported properties
    - Low
    - Implies listings are top-of-funnel inventory, not directly monetized at scale
    - Active monetized listings, not just gross inventory
  - - Estimated revenue per employee
    - ~$44K using FY2025 revenue and 39 employees
    - Low-medium
