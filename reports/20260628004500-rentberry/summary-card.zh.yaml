  topStrengths:
    - 产品覆盖的长期租赁工作流比许多窄口径房源平台更宽，包括筛查、支付、电子签约和维修。
    - 公司反复证明自己拿得到资本，也有足够公开牵引力信号，说明它不只是概念阶段的市场平台。
    - 如果变现能追上平台覆盖面，Rentberry 的跨境足迹和房东-租客工作流定位可以形成可信战略切口。
    - 公开价格和工作流细节让变现架构比许多不透明的私营市场平台更容易读懂。
  topRisks:
    - 据报道的 2024 年 $1B 独角兽估值，无法与 2026 年面向散户发行的 $138.7M 投前估值顺畅对上。
    - 公开披露在累计融资、用户或房源规模、员工数上互相冲突，削弱了公司叙事可信度。
    - 散户普通股投资人的下行保护看起来较弱，对优先权堆叠和治理权利也缺乏可见度。
    - 公开披露收入相对于营销口径的平台规模仍很小，意味着变现偏薄或披露不完整。
    - 公平住房、租客筛查、支付和租金竞价工作流持续带来监管和声誉风险。
  unresolvedGaps:
    - 从 2024 年独角兽轮到 2026 年散户普通股发行之间，一张可对账的资本结构表仍然缺失。
    - 管理层没有公开把用户、房源、已处理挂牌和付费活动统一到一套指标口径里。
    - 公开材料没有以足以承销的精度披露实际成交价格、收入结构、毛利率、流失率，或当前现金和跑道。
    - 公司没有公开清晰的董事会名单、投资人权利图谱，或面向散户普通股持有人的清算瀑布视图。
    - Pre-IPO 路径、Nasdaq 上市时间表和直接 SEC 申报包仍缺少独立确认。
