  topStrengths:
    - >-
      The product surface spans more of the long-term rental workflow than many narrow listing competitors, including
      screening, payments, e-signing, and maintenance.
    - >-
      The company has demonstrated repeated access to capital and enough public traction signals to show it is more than
      a concept-stage marketplace.
    - >-
      Rentberry's cross-border footprint and landlord-tenant workflow positioning provide a credible strategic wedge if
      monetization can catch up with platform reach.
    - >-
      Public pricing and workflow detail make the monetization architecture more legible than many opaque private
      marketplaces.
  topRisks:
    - >-
      The reported 2024 $1B unicorn valuation does not reconcile cleanly with the 2026 $138.7M retail pre-money
      valuation.
    - >-
      Public disclosures conflict on total capital raised, user or property scale, and headcount, weakening trust in the
      company narrative.
    - >-
      Retail common investors appear to have weak downside protection and limited visibility into the preference stack
      or governance rights.
    - >-
      Publicly disclosed revenue remains very small relative to marketed platform scale, implying thin monetization or
      incomplete disclosure.
    - >-
      Fair-housing, tenant-screening, payments, and rent-bidding workflows carry ongoing regulatory and reputational
      risk.
  unresolvedGaps:
    - >-
      A reconciled capitalization table from the 2024 unicorn round through the 2026 retail common offering is still
      missing.
    - >-
      Management has not publicly bridged users, properties, listings processed, and paying activity into a single
      metric glossary.
    - >-
      Public materials do not disclose realized pricing, revenue mix, gross margin, churn, or current cash and runway
      with enough precision for underwriting.
    - >-
      The company does not publicly disclose a clear board roster, investor rights map, or liquidation-waterfall view
      for retail common holders.
    - >-
      Independent confirmation of the pre-IPO path, Nasdaq-listing timeline, and direct SEC filing package remains
      incomplete.
