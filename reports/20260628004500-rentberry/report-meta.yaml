companyProfile:
  summary: Rentberry is a private San Francisco proptech company founded in 2015 that operates a long-term rental marketplace and landlord-tenant workflow platform. Its public product surface spans search, applications, tenant screening, online rent payments, e-signing, maintenance requests, and AI-assisted pricing or matching claims, while its public financing story now mixes a reported 2024 unicorn round with a much lower 2026 retail crowdfunding valuation. The result is a company with real product breadth and capital-markets ambition, but still unusually high disclosure tension for investors.
