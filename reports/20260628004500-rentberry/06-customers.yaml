- id: enterprise-use-cases-and-underwriting-gaps
  title: Enterprise, landlord, and tenant use cases versus underwriting gaps
  body: 'The most supportable customer use cases are not enterprise deployments but operationally hands-on landlords and digitally comfortable tenants. Named reviews and product catalogs repeatedly emphasize multi-property management, remote management, integrated screening, payments, and e-signing. The landlord help collection reinforces that with explicit guidance on listing requirements, promotion, property tours, and lease execution. For tenants, the strongest supported use cases are search, applications, negotiation, tours, lease signing, and online rent payments.


    Enterprise and channel expansion is more aspirational than evidenced. The pricing page explicitly invites enterprise solutions and partnerships, and KingsCrowd cites 70 partnerships, yet reviewed public material does not identify named enterprise landlords, property management brands, or channel partners that demonstrably drive recurring customer volume. That leaves a real diligence gap around concentration and revenue quality. Rentberry looks like a genuine landlord-tenant workflow product with review-backed usage, but a full underwriting case still needs segment-level paying-account counts, geography mix, enterprise references, and direct retention data before customer strength can be called durable at scale.'
