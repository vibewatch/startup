tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - segment
  - buyer/user/payer
  - primary use case
  - evidence of real use
  - strategic value
  - gap
  rows:
  - - Tenants / renters
    - User and often payer for application, screening, insurance, and payments
    - Search, schedule tours, apply, negotiate, e-sign, pay rent, request maintenance
    - Strong official workflow evidence plus repeated positive tenant reviews
    - Demand-side liquidity and transaction volume
    - No disclosed count of active paying tenants versus casual browsers
  - - Individual landlords
    - User and payer for listing, collection, promotion, and screening workflows
    - List units, manage tours, collect rent, sign leases, track maintenance
    - Official pricing and landlord-help content show a self-serve operating toolkit
    - Core supply acquisition and recurring workflow revenue
    - No disclosed landlord count or landlord retention
  - - Small property managers / multi-property operators
    - User and payer
    - Centralize listings, tenant tracking, payments, and communication across multiple properties
    - GetApp, Product Hunt, and review catalogs explicitly mention multiple-property and remote management use cases
    - Potentially higher-frequency and stickier workflow usage
    - No named property-management brands or seat counts
  - - Agents / brokers
    - User and payer where agent fee applies
    - Market listings, coordinate tours, and manage lease execution
    - Pricing page includes an agent/broker fee and software catalogs describe agent-facing workflow
    - Could widen supply acquisition beyond owner-managed listings
    - No public evidence on active paid agent seats
  - - Enterprise / partnership channel
    - Potential payer via enterprise solutions and partnerships
    - Portfolio onboarding, syndication, or channel distribution
    - Pricing page invites enterprise solutions; KingsCrowd cites 70 partnerships
    - Could improve scale and lower CAC if real
    - No named enterprise customers, partner economics, or concentration disclosure
  notes: Rows synthesize official workflow surfaces and independent review/catalog evidence; the gap column captures where segment-level paying-account or concentration data is still absent.
