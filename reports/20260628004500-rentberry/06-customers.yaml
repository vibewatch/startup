- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver or concentration risk
  - current signal
  - impact
  - diligence path
  rows:
  - - Land-and-expand via workflow depth
    - Search, tours, applications, screening, payments, e-signing, and maintenance all exist on one platform
    - Can raise switching costs if landlords adopt multiple modules
    - Request module attach rates by landlord cohort
  - - Geographic concentration risk
    - Independent reviews say the smallest cities or remote areas have limited listings
    - Marketplace quality may be far stronger in major metros than in long-tail markets
    - Request activity, supply, and conversion by top 20 cities or countries
  - - Listing-integrity risk
    - Trustpilot and GetApp-style complaints cite scams, duplicate listings, or questionable background-check experiences
    - Damages tenant trust and could slow demand conversion
    - Request fraud-rate, takedown, and landlord-verification metrics
  - - Support-capacity bottleneck
    - Reviews mention slower response during peak times despite 24/7 support claims
    - Could hurt landlord onboarding and dispute resolution during high-demand periods
    - Request ticket volumes, response times, and staffing by queue
  - - Enterprise / channel opacity
    - Enterprise solutions and 70 partnerships are marketed, but named customers and partner economics are missing
    - Makes concentration and expansion quality impossible to underwrite
    - Request top partner list, revenue contribution, and top-customer exposure
  notes: This table mixes upside and risk because the same multi-step workflow that can drive expansion also creates more places where support, trust, or inventory quality can fail.
