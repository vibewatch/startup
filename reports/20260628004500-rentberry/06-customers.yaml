- id: adoption-proof-and-marketplace-behavior
  title: Adoption proof and marketplace supply-demand behavior
  body: 'The customer proof is stronger on breadth than on denominator quality. Official surfaces and company-linked investor materials repeatedly market a global rental network with millions of listings, activity across more than 90 countries, and millions of users. Independent round-up sources such as KingsCrowd repeat that narrative and add 70 partnerships, which suggests some external distribution or channel activity. Review and catalog sites also consistently describe the product as useful for multi-property landlords, remote managers, and tenants who want an end-to-end digital process.


    But the marketplace story has an internal coherence problem. The official homepage points to millions of listings across 90-plus countries, the investor site advertises 5 million-plus monthly users and 17 million-plus daily properties, and another investor-site section claims more than 45 million active users and 100 million properties processed in 2025. Those are not cleanly comparable units. The practical takeaway is that Rentberry probably has real cross-border supply and demand activity, yet public customer metrics still mix listings, processed properties, monthly users, and broader customer counts in ways that make adoption durability harder to underwrite than the headline numbers imply.'
