  evidenceGaps:
  - type: missing-source
    severity: material
    topic: enterprise-channel
    missingEvidence: Named enterprise customers, channel partners, and partner-driven volume metrics.
    whyItMatters: Enterprise and partner proof would show whether the 70-partnership narrative creates durable revenue or is only marketing breadth.
    diligencePath: Request the top ten enterprise or partner accounts, contract values, deployment scope, and renewal history.
    relatedQuestionRefs:
    - QU020
  - type: missing-source
    severity: material
    topic: retention-gap
    missingEvidence: Segment-level churn, renewal, GRR, NRR, or cohort-retention data for landlords, managers, and paid workflow users.
    whyItMatters: Review scores can overstate durability if active landlord cohorts churn after initial onboarding or if monetization is transactional rather than recurring.
    diligencePath: Ask management for landlord and property-manager retention cohorts, module attach rates, and revenue-retention tables.
    relatedQuestionRefs:
    - QU021
  - type: missing-source
    severity: material
    topic: concentration-gap
    missingEvidence: Paying-account counts, top-market mix, and the split between browsing users and monetized customers.
    whyItMatters: Customer concentration and geography mix determine whether marketplace strength is broad or concentrated in a few urban pockets.
    diligencePath: Request monthly active paying landlords, paid tenants, revenue by top city or country, and the top twenty customer or market exposures.
    relatedQuestionRefs:
    - QU025
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: A larger sample of named tenant, landlord, and manager references with dates, property counts, and measured outcomes.
    whyItMatters: The named customer-proof table currently relies on a review sample rather than a broad census of deployments or flagship accounts.
