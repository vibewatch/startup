- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence
  - Mitigation / diligence ask
  rows:
  - - Marketplace plus workflow in one brand
    - Incumbent portals already pair workflow with much larger renter traffic
    - High
    - Zillow and Apartments.com couple listing demand with screening, payments, and landlord tooling
    - Test whether Rentberry converts better or cheaper despite weaker native traffic
  - - Dynamic pricing and negotiation UX
    - Algorithmic-pricing scrutiny may limit moat value or create compliance friction
    - Medium-High
    - Shelterforce documents escalating legal and regulatory pushback on rent-setting software
    - Clarify how Rentberry uses pricing signals and whether they are advisory or decisioning
  - - Affordable modular pricing
    - Freemium rivals push entry price to zero and tenant-paid models reduce switching friction
    - High
    - Avail, TurboTenant, RentSpree, Zillow, and Innago all advertise low or no upfront software cost
    - Request churn, win-rate, and attach-rate data to prove Rentberry monetizes better than peers
  - - All-in-one landlord workflow
    - Broader PM suites win when accounting, maintenance coordination, or service support become decisive
    - Medium
    - Buildium, AppFolio, and Hemlane expand beyond lease-up into PM operations or services
    - Map which buyer segment Rentberry serves best and where it should avoid head-on competition
  - - Syndication as reach amplifier
    - Partners can be shared across many rivals, which weakens exclusivity
    - Medium
    - Avail, TurboTenant, Hemlane, and RentSpree all rely on broad network or partner distribution
    - Ask for channel concentration and organic lead share by market
  - - International footprint and tenant-facing UX
    - U.S. buyer decisions remain driven by local traffic, MLS access, and compliance credibility
    - Medium
    - Reviewed U.S. rivals emphasize domestic distribution, screening compliance, and local PM depth
    - Request U.S.-only cohort retention and CAC/payback by city or state
  notes: Severity is an author judgment based on reviewed public evidence about distribution, pricing, regulation, and substitute depth rather than a reported market-share statistic.
