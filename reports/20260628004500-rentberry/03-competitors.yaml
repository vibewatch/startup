  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: rentberry-scale-disclosure
    missingEvidence: Current U.S. active landlord, active property, and lead-volume counts for Rentberry.
    whyItMatters: Without current scale data, it is hard to judge whether Rentberry is a meaningful portal incumbent or mainly a workflow layer riding on paid promotion and syndication.
    diligencePath: Request current landlord, property, MAU, and lead-volume disclosures by geography from management or the data room.
    relatedQuestionRefs:
    - QP024
  - type: private-evidence-only
    severity: material
    topic: rentberry-monetization-quality
    missingEvidence: Attach-rate, take-rate, and realized revenue contribution for Rentberry screening, payments, promotion, and insurance products.
    whyItMatters: Public list prices do not show whether Rentberry monetizes its installed base better or worse than freemium rivals that start at $0.
    diligencePath: Request cohort monetization, product attach rates, and gross-margin by monetization stream for the latest 12 months.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: rentberry-channel-mix
    missingEvidence: Organic-versus-paid acquisition mix and the share of listings or leads attributable to syndication partners.
    whyItMatters: The competitive thesis turns heavily on whether Rentberry owns meaningful renter demand or depends on channels that competitors also use.
    diligencePath: Request channel mix, CAC by source, and conversion-to-lease metrics for direct traffic versus syndicated traffic.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP001
    - TP003
