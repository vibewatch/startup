company:
  name: Rentberry
chapter:
  number: 3
  title: Competitors
  summary: 'Rentberry competes in two overlapping arenas: renter-demand marketplaces led by Zillow and Apartments.com, and landlord workflow software led by freemium or portfolio-management suites such as Avail, TurboTenant, RentSpree, Buildium, AppFolio, Hemlane, and Innago. The evidence suggests Rentberry''s negotiation-first, marketplace-plus-workflow pitch is real, but incumbent portals own more demand, while landlord SaaS rivals match most workflow modules with cheaper entry pricing, stronger syndication, or deeper property-management scope.'
sections:
- id: landscape-and-solution-classes
  title: Landscape and solution classes
  body: Rentberry is not competing against a single, neatly bounded class of software. In the U.S. landlord workflow, buyers can solve the same job through at least four routes. First are renter-demand portals that have expanded into workflow, most notably Zillow Rental Manager and Apartments.com Rental Manager. These platforms start with audience aggregation and then add applications, screening, leases, rent collection, or maintenance. Second are freemium landlord operating tools such as Avail, TurboTenant, RentSpree, Zumper, and Innago, which compete by lowering the software entry price and shifting monetization to screening, payments, upgrades, or promoted listings. Third are broader property-management suites such as Buildium, AppFolio, and Hemlane, which become relevant once the buyer needs accounting, portfolio controls, or service layers rather than just listing and lease-up. Fourth is the status-quo substitute of mixing syndicated listings, screening, leases, and payments from separate
    vendors, which keeps multi-homing viable and limits lock-in. Rentberry's challenge is that its product spans parts of all four categories but is not the default demand gateway or the deepest back-office system in any one of them.
