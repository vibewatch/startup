  rows:
  - - Rentberry
    - Marketplace + landlord workflow
    - Private marketplace and workflow platform
    - DIY landlords, renters, and cross-border search users
    - Transparent rent negotiation, tenant-side marketplace UX, digital applications, e-sign, payments, and landlord tools in one brand
    - Smaller renter-demand surface and less proven U.S. distribution than Zillow or Apartments.com
  - - Zillow Rental Manager
    - Demand portal + workflow incumbent
    - Zillow network with 30M+ monthly rental visitors on reviewed page
    - DIY landlords and small property managers
    - Huge renter audience plus listings, leases, screening, payments, maintenance, and pricing tools
    - Reviewed evidence suggests lighter accounting depth and narrower off-network syndication than full PM suites
  - - Apartments.com / CoStar
    - Demand portal + data incumbent
    - 1M property owners, 81M monthly renter visits, $400M rent payments monthly; backed by public CoStar
    - DIY through multifamily advertisers and professional operators
    - Audience scale, Homes.com cross-posting, payments, maintenance, rent comps, and CoStar analytics depth
    - Less transparent simple list pricing than pure freemium landlord SaaS
  - - Zumper
    - Self-serve listing and leasing platform
    - Free listings plus promoted inventory and partner distribution
    - DIY landlords and small-to-mid property managers
    - Post once across Zumper, PadMapper, Bing, ChatGPT, and more; market insights and AI-assisted marketing
    - Smaller household-name traffic and less back-office depth than the biggest incumbents
  - - Avail
    - Freemium landlord OS
    - Part of Realtor.com network; $0 base tier and $9/unit premium tier
    - Independent landlords and small portfolios
    - Lists to 19 sites and bundles leases, screening, payments, maintenance, and tenant portal
    - Relies on syndicated demand rather than owning the largest native marketplace
  - - TurboTenant
    - Freemium landlord OS
    - 1M+ self-managing landlords on reviewed surfaces
    - DIY landlords from 1 to 50+ doors
    - Very low entry price, 25+ site advertising, applications, screening, payments, and maintenance in one stack
    - Demand is partly borrowed from partner portals rather than owned outright
  - - RentSpree
    - Screening-first agent / landlord workflow
    - 3M+ users and 300+ MLS / real estate partners
    - Agents, brokers, landlords, and screening-led workflows
    - Strong MLS-adjacent distribution, TransUnion/Finicity data, and inexpensive screening-led motion
    - Less evidence of consumer marketplace pull than Zillow or Apartments.com
  - - AppFolio / Buildium / Hemlane / Innago
    - Broader PM substitutes
    - Quote-led or monthly PM suites; free-to-enter at Innago; software-plus-services at Hemlane
    - Property managers, portfolio landlords, and operators needing accounting or service depth
    - Expand the comparison from lease-up tools into accounting, operations, compliance, and support
    - Often weaker as pure consumer-demand destinations than the big rental portals
  notes: Rows cover the most relevant direct, incumbent, adjacent, and substitute classes evidenced in reviewed sources rather than every niche landlord tool in the market.
