      - number: '5.4'
        title: 安全论证、监管边界和瓶颈
        blocks:
          - type: paragraph
            body: >-
              Valar 当前公开安全论证落在三层上：通用 HTGR 加 TRISO 叙事、诉讼时期围绕负热反馈和被动衰变热移除的主张，以及 NOVA
              在联邦监督下运行这一事实。这些都有意义，但不完整。它们支持这样一种论点：堆芯概念值得认真关注；但它们尚未构成完整电站安全论证，无法覆盖带燃料运输、客户附近常规运行或寿命终止处理。AP
              的报道在这里尤其重要，因为它提出了批评者最关心的未解问题：系统是否可行且经济，带核燃料运输如何保障安全，以及废弃物最终去向何处。Utah 本地沟通有助于选址合法性，但不能替代一份从摇篮到坟墓的反应堆案例文件。


              因此，最大技术瓶颈不只在堆芯内部。公开 DOE 和 NRC 材料显示，HALEU
              供应、临界基准测试、运输包装和未来微反应堆许可，仍是活跃的全国性工作流。这些工作流之所以存在，正是因为先进反应堆生态尚未拥有充足商业燃料、成熟基准数据或规模化无摩擦许可。Valar
              可能受益于这些项目，但无法绕开它们。由此得到的产品技术判断更细：Valar 已经比许多初创公司更深入真实硬件证明，但下一批风险在于系统集成、燃料物流、许可转换，以及证明其雄心勃勃的热到产品堆栈能在叙事之外跑通。
