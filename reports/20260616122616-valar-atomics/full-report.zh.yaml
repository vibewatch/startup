      - number: '1.2'
        title: 创始人、领导层和治理
        blocks:
          - type: paragraph
            body: >-
              创始人兼 CEO Isaiah Taylor 是 Valar 公开身份的核心。多家来源把他描绘成自学成才、从高中辍学的程序员，在此前创业尝试之后创立 Valar，并通过 Ward Schaap 将公司使命与家族
              Manhattan Project 传承相连。周边领导班底则更复杂。正面尽调信号包括 Mark Mitchell 曾在 Ultra Safe Nuclear Corporation 担任领导职务、Muhammad
              Shahzad 有航天运营背景，以及 Max Ukropina 在重大测试和部署里程碑中角色清晰。不过，治理披露比融资叙事薄得多：公开证据明确显示 Doug Philippone 在 $130 million
              Series A 中加入董事会，但没有给出最新完整董事名单、委员会结构或控制权地图。负面报道还指出，Kip Mock、Elijah Froh 等非核能长期伙伴在运营中存在重要性，并提到 Day One
              Ventures 创始人 Masha Bucher 的声誉争议，由此引出关键人物和治理问题。实际结论是，Valar 既有一些经验丰富的核能和工业运营者，也有异常以创始人为中心的公开形象，治理透明度仍有限。
