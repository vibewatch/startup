      - number: '4.2'
        title: 资本形成和融资结构
        blocks:
          - type: paragraph
            body: >-
              资本形成是 Valar 财务故事中唯一清晰可见的部分。公开来源支持其快速融资节奏：2025 年 2 月种子轮被广泛报道为 $19M，2025 年末 Series A 为 $130M，2026 年 3 月融资据报为
              $450M，估值 $2B。最新一轮重要，不只因为规模，也因为结构：Bloomberg、TNW 和 Crunchbase 都称其为 $340M 股权加 $110M 债务。这已经让 Valar
              超出纯风险股权故事，进入更复杂的资本堆栈。


              更难的问题是累计融资，因为公开来源彼此不一致。Tracxn 报道四轮累计融资 $489M，但 Mother Jones 另报 $1.5M pre-seed；如果简单相加 pre-seed、seed、Series
              A 和 2026 年融资，披露总资本约为 $600.5M。最可能的解释是统计口径——是否纳入 pre-seed，债务是否与总轮次规模分开处理，以及二级来源是否按 post-money
              股权口径标准化。这种分歧不推翻更大的结论：Valar 以其成立年限而言已经筹到异常大额资本。但它意味着投资者应直接核对股本结构表和债务时间表，而不是接受任何单一标题数字。
