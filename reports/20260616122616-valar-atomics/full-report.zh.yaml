      - number: '7.2'
        title: 反应堆、燃料与废物准备度
        blocks:
          - type: paragraph
            body: >-
              技术记录有意义，但还不完整。Project NOVA 给了 Valar 一个真实里程碑：在 DOE 和 NNSA 监督下，获得 LANL 和 NCERC
              支持并实现冷临界。这很重要，因为它验证物理模型，支撑堆芯建模，比单靠幻灯片更有证据含量。但独立报道一致认为，这仍只是部分里程碑。New Scientist
              称，真正的证明点仍是受控带功率运行、持续温度表现、材料长期行为，以及监管方和客户能在常规运行下信任设计的证据。Valar 自己的材料也承认，NOVA
              数据仍需用于氦回路调理和升温协议，也就是说，部分最难的工程工作在头条里程碑之后才开始。


              燃料和废物让这个缺口更深。Reuters 和 DOE 都称 HALEU 供应仍有限；DOE 2026 年大额浓缩奖项显示供应链还在建设，而不是已经建成。NRC
              材料同样说明，燃料循环设施和乏燃料储存仍被严密监管，强依赖具体场地，运营负担很重。AP 补上关键负面细节：官员尚未解决反应堆废物最终如何处置。这并不证明 Valar
              不能解决燃料或废物问题；它证明这些问题仍是活的依赖项，不是已经关闭的工作流。因此，投资人应把冷临界视为技术降险，而不是 Valar 已跨过燃料、后端和带功率验证门槛、足以支撑商业信心的证明。
