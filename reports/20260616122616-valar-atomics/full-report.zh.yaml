  - id: TV005
    title: 论点失效和终止触发因素表
    columns:
      - 触发因素
      - 门槛 / 日期
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 没有 Ward 250 持续功率运行证据
        - 相对 2026-2028 公开时间线出现重大延误
        - 当前期权价值会变成更慢、风险更高的科研项目。
        - 将估值重切到熊市情景，或停止推进。
      - - 债务或优先权堆栈实际很苛刻
        - 任何会让新普通股投资者明显从属于优先索赔的条款
        - 即便技术推进，也会压低上行收益获取。
        - 任何投资决定前，先要求瀑布模型。
      - - 燃料供应或监管受挫
        - HALEU、DOE 授权或 NRC 路径比当前暗示更慢
        - 抹掉 Valar 相对同行的速度溢价。
        - 从「继续研究」转为回避，直到时间风险重置。
      - - 没有披露客户经济性
        - 技术里程碑之后，仍没有已签价格、规模或期限证据
        - 估值仍依赖叙事，而不是合同转化。
        - 不要按当前估值标记支付溢价。
    notes: 这些是论点失效条件，不是泛泛的创业风险。每一项都会直接改变理性投资者应支付的价格。
    claimRefs:
      - CV015
      - CV016
