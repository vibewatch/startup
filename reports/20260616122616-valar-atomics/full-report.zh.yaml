  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 价格背景与建议
        blocks:
          - type: paragraph
            body: >-
              Valar 披露的 2026 年 3/4 月估值标记容易描述，却难以承销。Bloomberg 和 The Next Web 将公司估值定在 $2B，此前完成 $450M 融资，其中 $340M 为股权、$110M
              为债务；这轮融资接在 2025 年初 $19M 种子轮和 2025 年末 $130M Series A 之后。仅这个速度就解释了公司为何吸引关注：投资人显然在为一种感知中的机会付费，即 Valar 可能成为首批把
              AI 时代真实需求与真实硬件进展连接起来的先进核能初创公司之一。


              问题在于，公开记录仍未披露那些能让投资人把 $2B
              当作传统财务价格来承销的输入项。没有公开收入，没有披露定价，没有单机毛利，没有已签电力经济性组合，也看不到债务契约或股权优先权栈。因此，本章更偏向价格敏感的建议，而不是公司质量评分。按这个标准，结论是继续研究，置信度中等，估值立场偏高：公司可能值得认真尽调，但公开证据还不足以支撑按当前估值继续加价。
