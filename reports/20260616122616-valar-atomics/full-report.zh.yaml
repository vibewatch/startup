      - number: '4.5'
        title: 财务结论和尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              财务结论偏谨慎。Valar
              已经明确解决了早期融资方程的一半：它能吸引资本和注意力。它还没有解决公开市场投资者或后期私募投资者通常需要承销的另一半：证明定价真实、需求已签约、利润率为正或可信地走向正值，并且商业化不需要持续再融资。独立负面来源强化了这一担忧。Mother
              Jones 引用专家质疑小型反应堆能否具备经济竞争力，AP 也引用怀疑者称，引人注目的空运并未回答该项目是否经济或可行。这些都不是决定性否定，但它们框定了正确的尽调姿态。


              因此，核心财务发现不是“经济性已被证明很差”，而是“经济性尚未公开证明”。投资者应要求提供当前现金余额；月度总烧钱和净烧钱；$110M tranche 的完整债务条款；每套 Ward 级系统的 capex 和
              opex；任何客户 LOI、PPA 或氢气 / 燃料承购；预期服务毛利率；以及试点与商业部署的回款曲线。在这些材料出现之前，估值更多锚定于战略叙事、政策加速和技术野心，而不是可审计的经营表现。
