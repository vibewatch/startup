      - number: '5.3'
        title: 可制造性和运营模式
        blocks:
          - type: paragraph
            body: >-
              Valar 的差异化主张不只来自新颖物理，而是可制造性。公司反复主张，核工业的问题在于手工作坊式部署，标准化 gigasite 模式可以创造重复经济。公开证据部分支持这一论点。Utah
              报道点名外部工程和建设伙伴，招聘则显示公司不只在补反应堆设计岗位，还在补燃料厂、涡轮机械、供应商质量、电站运营、IT
              和系统职能。这与纵向一体化运营野心一致，而不是一个狭窄设计公司。它也意味着执行负担很宽：Valar 必须建设核堆芯项目、燃料处理能力、场地建设能力，并最终具备运营工业园区的能力。


              在这里，披露缺口开始比话术更重要。与 X-energy、Oklo 等同业相比，Valar
              对堆芯周边电站系统级细节披露少得多。公司已有足够公开具体性来支持其确有真实反应堆努力，但还不足以承销工厂吞吐量、可维护性或首个客户运营保证。2026 年 2 月下旬的社区报道还显示，Utah
              项目当时仍处于组装和文件阶段，意味着 7 月 4 日目标之前存在真实的日程压缩。可制造性论点方向上可信；经审计的执行证据仍早。
