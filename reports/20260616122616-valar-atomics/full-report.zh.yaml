      - number: '4.3'
        title: 成本结构和单位经济性代理
        blocks:
          - type: paragraph
            body: >-
              商业化启动前，Valar 的成本结构看起来已经资本密集。公司在建设物理反应堆、场地基础设施、屏蔽和测试系统；招聘覆盖项目财务、会计、ERP、薪酬、施工质量、燃料厂运营和电站运营；Utah
              项目还依赖外部工程和建设伙伴。官方 Project NOVA 材料也明确显示，公司仍在花钱验证核心设计、氦回路调节和升温协议。这一切都不像精简软件公司的烧钱曲线。


              由于 Valar 不披露自己的单位经济性，最佳公开代理是会申报文件的可比先进反应堆公司。NuScale 的 2026 10-K 称其仍未产生重大收入，迄今收入来自工程和许可服务；该公司 2025 年经营现金流消耗
              $459.6M，尽管持有超过 $1.2B 流动性。Oklo 的 2026 10-K 同样显示大量流动性与持续亏损并存。Bloom Energy
              虽不是核能同业，却提供了有用的幕后电表硬件类比：终端用户往往偏好融资型电力结构，即便有收入，客户集中度也可能保持较高。这些可比公司不能证明 Valar 会长得一样，但它们说明，未披露的利润率和单台 capex
              是重大尽调漏洞，不是装饰性遗漏。
