      - number: '2.3'
        title: 买方、用户、付款方和可能的首个签约路径
        blocks:
          - type: paragraph
            body: >-
              Valar 的买方地图多分段，但逻辑一致。在超大规模和 AI
              园区场景中，用户是计算园区，经济买方可能是能源采购、基础设施或场地开发团队，他们把电力可得性视为新增容量上线的门槛。在公用事业和公共电力场景中，付款方更可能是服务电网的实体，能签约清洁稳定电力块，再把输出分配给负荷增长、可靠性或大客户承诺。工业用户不太关心“AI
              电力”这个类别，更关心连续电力加高温热、蒸汽、氢气或燃料合成经济性的一揽子方案。因此，同一类反应堆可能落入完全不同的预算负责人手中，取决于问题是电网瓶颈、工艺热，还是燃料原料。


              公开同业证据显示，首批合同未必总是直接把幕后围栏内的反应堆卖给超大规模客户。Kairos 与 Google 相关的部署通过 TVA 流转，而不是直接进入单个私营园区。TerraPower 的 Wyoming
              案例明确围绕区域电网和退役煤电场地需求来叙述。Oklo 的监管材料强调卖电力即服务，而不是卖反应堆硬件。这些模式重要，因为它们暗示 Valar
              的早期收入可能先来自公用事业、试点、工业园区或政府相关场地，然后才来自纯粹的超大规模“在我的数据中心旁边放一座反应堆”动作。因此，分段地图的重点不在于谁理论上需要高密度电力，而在于谁能在现实时间表内签约、获批、融资，并消化首创核能输出。
