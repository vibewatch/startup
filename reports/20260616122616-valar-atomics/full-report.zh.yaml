  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与真正计入的支出
        blocks:
          - type: paragraph
            body: >-
              相关市场不是“所有核能”，甚至不是“所有 AI 电力”。Valar
              自身材料反复把机会收窄到电网独立或电网受限应用：这些场景中，高密度、全天候能源或热，比最低交付兆瓦时成本更重要。公司明确点名数据中心供电、氢能、重工业电力和清洁碳氢燃料；其技术页强调高品质工艺热，使命页强调通过把许多反应堆聚集在一个园区来产品化核能。这个定义把市场拉向幕后电表或园区邻近发电、工业蒸汽和热，以及当多台设备标准化部署和运营时场地经济性改善的项目。


              这条边界也排除了大量表面相邻的支出。通用大电网发电、不带稳定供给要求而采购的间歇性可再生能源，以及传统集中式核电站项目，解决的是不同买方任务，而不是“在受限场地快速获得安全电力或热”。更适合决策的替代品，是处理同一运营瓶颈的直接能源方案：公用事业交付的清洁稳定电力块、本地先进反应堆、现场燃烧或燃料电池系统，以及高温工业能源包。重点不是
              Valar 已经拥有这些市场；而是公司卖向的是能源需求中的一个子集，在那里，通电速度、正常运行时间、热品质和场地成本摊销足够重要，买方才可能接受非传统核能采购路径。
