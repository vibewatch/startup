  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 目标账户和买方结构
        blocks:
          - type: paragraph
            body: >-
              Valar 的客户故事在战略上容易理解，商业上很难承销。官方材料始终围绕电网独立能源产品，而不是受监管公用事业销售来定位公司：数据中心供电、工业电力、氢能和清洁燃料。Business Insider 和
              Axios 引用管理层对电网为何不是首选客户的解释，使这一信息更尖锐。运营思路是把反应堆与极大负荷同址部署，这些负荷看重韧性、可控性和高温工艺热，而不是争夺普通批发电网需求。


              这很重要，因为它定义了买方集合。相关决策者不是零售缴费用户或广泛公用事业辖区，而是数据中心开发商和运营商、工业场地所有者、氢能或燃料运营商，以及需要快速可部署电力的公共部门用户。本地新闻和 AP
              报道又增加了第五类买方原型：看重可运输性和能源安全的军事或韧性导向用户。因此，公开记录支持一种聚焦的高价值账户策略。但公开记录尚未证明这些目标账户中任何一类已转化为披露的长期 PPA、生产部署或经常性扩张合同。
