      - number: '1.4'
        title: 里程碑、项目和规模化路径
        blocks:
          - type: paragraph
            body: >-
              先进核能公司中，Valar 的里程碑序列压缩得异常紧。官方材料描述，Ward Zero 是位于 Los Angeles 的非核热原型，之后是 Utah 的 Ward 250 建设、入选 DOE 加速试点框架，以及
              Project NOVA 于 2025 年 11 月 17 日在 Los Alamos 运营的 Nevada NCERC 达成零功率临界里程碑。公开报道随后显示，2026 年 2 月设备由 C-17 从
              California 空运到 Hill Air Force Base，再转运至 Utah San Rafael Energy Research Lab，并在 Emery County
              开展社区沟通。这些里程碑重要，因为它们拼出了一条连贯的硬件开发叙事，而不是纯 PPT 故事。即便如此，公开记录中仍有重要模糊点：一些来源把 Ward 250 描述为 5-megawatt 反应堆，另一些则称其为
              100-kWt 装置，可能意味着功率口径不同、阶段不同，或公开解释不完整。公司另行推进的 Philippines 计划和 NRC 诉讼也说明，Valar 正在并行探索多条监管路径，而不是押注单一许可路线。
