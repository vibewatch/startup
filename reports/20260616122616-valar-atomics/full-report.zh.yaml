    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品和运营足迹
        blocks:
          - type: paragraph
            body: >-
              Valar Atomics 成立于 2023 年，自称是一家私营先进核能公司，围绕 “gigasite” 部署模式建设高温气冷反应堆，而不是传统公用事业电网电站模式。公司在首页、使命、技术和 Ward 250
              材料中反复描述其设计：使用 TRISO 燃料、氦冷、石墨慢化，面向电网独立场景——数据中心供电、工业热、制氢和合成燃料。第三方公开报道一直称公司位于 El Segundo，而当前招聘页面显示其在
              California Hawthorne 有相当大的团队足迹，并且在 Utah Orangeville 仍有活跃岗位。也就是说，运营足迹清楚，但公开总部标签并不精确。后续章节最稳妥的表述，是 Los
              Angeles 都会区总部加 Utah 测试场扩张。Valar 还强调，它不是先把电卖进传统电网；它想建设同址工业园区，部署许多标准化反应堆，并用高品质工艺热作为相对轻水堆既有厂商的差异化。
