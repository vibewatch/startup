      - number: '7.5'
        title: 缓释因素、未解缺口与否决标准
        blocks:
          - type: paragraph
            body: >-
              Valar 不是没有缓释因素。公司已经积累了几个真实的降险点：DOE 背书、冷临界数据、Utah 实体进展、活跃社区沟通，以及不断强化的联邦燃料议程。Proposed Part 57
              未来可能让后续微反应堆许可更标准化；DOE 的 HALEU
              支出也可能逐步改善燃料可得性。这些都是重要正面因素，但它们是系统层面的缓释，不是公司层面的闭环。公开记录仍缺少投资人把高远野心转化为可投承销所需的文件：从试点到商业机组的已对齐产品路线图、项目特定的燃料分配或浓缩合同、废物处理策略、已签承购经济性、详细的商业
              NRC 路径，以及围绕安全和执行更透明的治理权责。


              因此，否决标准异常清楚。如果 Valar 在拿下冷临界头条后错过带功率验证序列，如果燃料和废物路径到 2027
              年仍停留在抽象层面，或如果融资继续跑在客户证明前面，下行不只是进度延误，而是商业化论证坍塌。反过来，如果公司披露可信燃料路径，证明热态运行和可重复性，并在下一次叙事驱动的重估前拿到可融资承购，当前风险栈会实质压缩。在那之前，正确姿态不是一概否定，而是带明确里程碑闸门的审慎怀疑。
