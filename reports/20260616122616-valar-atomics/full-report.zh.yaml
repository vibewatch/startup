  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争分层：谁真正与 Valar 重叠
        blocks:
          - type: paragraph
            body: >-
              不应把 Valar 和整个核能行业放在一起比较，好像每种设计都在卖同一个任务。它的公开推介同时结合三件事：使用 TRISO 燃料的高温气冷反应堆、离网 “gigasite”
              运营模式，以及从电力延伸到氢能、工业热和合成燃料的产品野心。这意味着直接同业范围比更广泛的先进反应堆宇宙窄。X-energy 是披露最清楚的技术类比，因为它也围绕高温蒸汽和工业用途推销 HTGR/TRISO
              系统。Oklo 在 24/7 园区级幕后电表电力上重叠，但其快堆和燃料回收故事让它更偏向以电力优先的买方，而不是超高温热买方。Kairos
              在先进核能初创执行上重叠，但呈现的是更传统的示范园区路径。TerraPower
              主要作为资本充足的邻近威胁而重要，面向超大规模客户和大型清洁电力采购，并不是一对一的微反应堆替代品。与此同时，现状替代方案——电网供电、天然气发电，以及棕地核电重启或增容——仍然有力，因为它们能在近期开出比任何初创先进反应堆已在商业规模证明的兆瓦块更大的电量。
