  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义和项目堆栈
        blocks:
          - type: paragraph
            body: >-
              Valar
              呈现的并不是单一公用事业式反应堆销售。其公开材料定义的是一个更宽的电网独立能源平台，围绕与大型负荷或工艺用户同址部署的标准化反应堆搭建。一级待完成任务包括为数据中心提供可靠电力、为重工业提供高品质工艺热、通过硫碘化学制氢，并最终通过改造后的
              Fischer-Tropsch 链生产合成碳氢燃料。这个框架重要，因为它把公司推入一个产品堆栈，而不只是核心物理问题：Valar 必须同时证明反应堆、传热系统、转换层、场地模式和运营模式。


              公开成熟度阶梯也异常清晰。Ward Zero 是热替身；Project NOVA 是中子学证明点；Ward250 是首个集成带功率反应堆；gigasite
              则是之后的规模化论点。纸面上，这是合理的工程推进路径，因为它把风险拆解成热系统检查、零功率堆芯验证，然后才是集成电站启动。但同一序列也凸显了今天仍缺少什么：尚无公开热平衡包、没有商业产品规格，也没有披露证据表明下游氢能或燃料层已超出概念性工艺主张。产品故事连贯，但可交付客户的
              SKU 定义仍很薄。
