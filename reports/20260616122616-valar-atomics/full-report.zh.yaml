  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律暴露面
        blocks:
          - type: paragraph
            body: >-
              Valar 最大的单一风险仍是监管转换：公司已经找到在 DOE 控制的测试中快速推进的方法，但公开证据没有显示它已跑通常规商业许可路径。公司官方材料、Reuters 和 Utility Dive 都称，DOE
              试点可在 NRC 之外授权测试反应堆，并明确以 2026 年 7 月 4 日实现临界为目标。这确实加速了进度。但这不等同于可融资的商业运营框架。WIRED 和 NRC 材料都说明，商业反应堆仍必须重新接入
              NRC；NRC 自己针对微反应堆的快速许可框架 Proposed Part 57，截至 2026 年 5 月仍只是提案。NRC 的 ADVANCE Act
              实施页面也称，机构仍在处理加速审查和微反应堆指导的法定期限；Regulations.gov 上 NRC-2025-0379
              案卷仍是拟议许可路径的已关闭征求意见案卷，而不是最终制度。政策方向有利，但商业框架仍在实时搭建。


              针对 NRC 的诉讼没有消除风险，反而让风险更尖锐。Valar 不只是游说改革；它公开主张，现行联邦规则让原型测试太慢，否则 Ward One
              会在菲律宾测试。这说明进度压力真实存在，也说明管理层愿意推动制度边界。诉讼最终可能帮助改革制度，但眼下意味着 Valar
              正处在一场法律和政策仍在拉扯的现场：由谁监管、按什么时间表、采用什么安全阈值。对投资人而言，这带来二元风险：如果 DOE
              优先路径站得住，进展会很快；如果商业许可、法院结果或监管解释无法足够快地收敛，延误也会很猛。
