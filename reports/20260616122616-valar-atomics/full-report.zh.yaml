      - number: '7.3'
        title: 执行与依赖栈
        blocks:
          - type: paragraph
            body: >-
              Valar 的项目之所以快，正是因为它依赖一套密集的外部支持栈：DOE 试点授权、LANL/NCERC 实验、Nevada 燃料和测试基础设施、Utah
              场地准入、本地政治支持，以及仍在为燃料、运营、建设和财务关键岗位招聘的组织。这些不是顺带的助推器；它们就是当前计划的操作系统。DOE 选择 Valar 进入试点，但 Reuters 和 Utility Dive
              都指出，每个参与方仍自行承担设计、制造、建设、运营和退役成本。换句话说，联邦背书能加速路径，但不会吸收执行复杂度或资本强度。


              这让 Valar 暴露在排序风险之下。ANS、AP 和 Utah
              本地报道呈现的项目，已经把冷临界、破土、军用空运、社区沟通和场地移交串在一起，公开可见的缓冲很少。同一组证据也说明，不能高估本地热情：县级支持信和开放日有助于社区接受，但替代不了燃料交付、带功率调试、合规人员配置或有韧性的供应链。实际解读是，Valar
              展示了异常强的创业速度，但只差一次滑点，就可能从速度变成拥堵。燃料交接延迟、场地调试问题或合规流程失手，都可能迅速传导为收入时间点落空，因为当前公开计划几乎看不到缓冲。
