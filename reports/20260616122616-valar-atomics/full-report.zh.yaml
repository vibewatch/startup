      - number: '8.3'
        title: 可比锚点与情景区间
        blocks:
          - type: paragraph
            body: >-
              合适的可比公司组不能为 Valar 证明一个干净公允价值，但能约束 $2B 标记讲的是什么故事。Oklo 和 NuScale
              等公开先进核能同业显示，即便规模化收入出现前，投资人也会给反应堆公司数十亿美元级期权价值；但同一批文件也显示，这类路径会消耗多少资本。Oklo 在 2025 年中公开规模信号约为 $7B，NuScale 约为
              $5.3B，但 NuScale 也披露 2025 年运营现金消耗接近 $460M。Bloom Energy 不是核能同业，但其约 $3.9B 的市值信号提醒我们，一家有真实收入的公司仍可能在 Valar
              的私募估值附近或以下交易。


              私募和战略可比也指向同一结论。Google 的 Kairos 协议和 Amazon 支持 X-energy
              的部署模式显示，成熟买家资助的是分阶段产能和订单簿形成，而不是把收入前叙事当作客户经济性的替代品。这支持情景法，而不是倍数法。熊、基准、牛三种价值应主要随运行时长证明、已签承购和资本栈清晰度变化。按这个基础，今天的
              $2B 标记已经假设了相当多技术和商业成功，而这些成功还没有以财务形式公开。
