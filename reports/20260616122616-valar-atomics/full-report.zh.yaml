  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 债务分档
        - $110M 债务分档的已签债务文件。
        - 没有契约和到期细节，头条轮次规模不够。
        - 公司财务团队；对债务包做法律审阅。
      - - 优先权堆栈
        - 2026 年股票购买协议和瀑布结构。
        - 私募估值可能夸大普通股价值。
        - 公司法律顾问；建立下行瀑布模型。
      - - 客户合同
        - 已签 PPA、试点合同或承购协议，包含价格和期限。
        - 需要把 AI 电力叙事转化为可承销需求。
        - 商务负责人；核验买方信用和规模。
      - - 单位经济性
        - Ward 级部署的 capex、opex、正常运行时间、燃料和利润率模型。
        - 情景价值主要随项目经济性变化，而不是随故事质量变化。
        - 项目融资和工程模型审阅。
      - - 运行数据
        - Ward 250 超过冷临界后，功率运行数据。
        - 可融资性取决于受控运行，不只是物理证明。
        - 公开里程碑更新后做技术尽调。
    notes: 这些要求按「先回答价格、再回答愿景」排序：先看下行保护，再看合同经济性，最后看持久运行证明。
    claimRefs:
      - CV015
      - CV016
      - CV040
      - CV041
      - CV050
