      - number: '7.4'
        title: 融资、商业化与声誉
        blocks:
          - type: paragraph
            body: >-
              融资能缓释风险，但不是干净答案。TNW 和 Tracxn 显示，Valar 已经以足够大的规模融资，把公司推入后期阶段预期；Data Center Frontier、AP 和同业 10-K
              又共同强化了另一个事实：如果没有更多证明，下一代核能还不能被纳入近期 AI 负荷规划的可融资资产。公开记录没有披露已签 PPA
              订单簿，没有项目级经济性，没有明确的客户集中度表，也没有与收入确认绑定的公开商业许可时间表。这意味着，如果在承购证明出现前还需要下一轮融资，Valar 可能手握技术兴奋度，却面对商业不透明。


              声誉和治理让融资风险更尖锐。Mother Jones 提出投资人关联、创始人判断和安全沟通问题；Business Insider 和 TNW 显示 Isaiah Taylor
              对叙事有多核心；公开治理披露仍落后于已投入资本的规模。单看任何一个问题，都不能否定公司。但放在一起，它们提高了某次技术挫折、安全沟通失误或政治转向变成融资事件、而不只是公关事件的概率。因此，投资人应拆开两个在动量市场里很容易看起来相似的命题：Valar
              可能是推进最快的核能初创公司之一；Valar 也可能仍太早，不能按常规商业电力公司承销。前者有证据支撑，后者还没有。
