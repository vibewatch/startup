      - number: '3.2'
        title: 直接同业比较：HTGR、微反应堆和示范路径差异
        blocks:
          - type: paragraph
            body: >-
              在具名同业中，X-energy 是 Valar 最难轻易排除的公司，因为重叠是结构性的：双方都依赖 HTGR 和 TRISO
              叙事，都强调工业热，也都把先进核能包装成能源密集型现代工业的解决方案。差异在商业姿态。X-energy 的公开定位更像一个更大的工业或公用事业邻近平台，而 Valar 强调可运输试点和离网园区。Oklo
              在反应堆物理和客户承诺上差异更大：Aurora 是一个带燃料回收角度的紧凑型先进裂变供电故事，更吸引园区和幕后电表电力买方，而不是合成燃料或工艺热买方。Kairos 是最清晰的执行标尺。其覆盖
              R&D、熔盐工作、制造和 Hermes 示范园区的足迹，传递出一个分步推进项目，大买方可能认为它比 Valar 的空运加诉讼叙事更传统、更可读。相比之下，TerraPower
              提醒市场，不是所有强竞争者都很小：Natrium 规模大得多、面向电网且带储能，这削弱了它与 Valar 的设计类比，却提升了它在“谁会赢得最大清洁电力预算”讨论中的相关性。
