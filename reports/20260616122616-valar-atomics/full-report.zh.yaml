      - number: '1.5'
        title: 风险、争议和证据缺口
        blocks:
          - type: paragraph
            body: >-
              公司概览层面的主要风险并不隐晦。第一，Valar 当前可信度与政治加速的 DOE 试点结构，以及 2026 年 7 月 4
              日这个连支持者都称激进的里程碑紧密绑定。第二，在已审阅证据中，收入、客户数量、利润率结构和已签署商业购电合同均未公开披露，因此估值讨论很大程度仍靠叙事支撑。第三，负面报道引出投资者声誉暴露、创始人判断力，以及缺乏同等核能资历的亲近伙伴地位过高等问题。第四，公开反应堆额定功率叙事尚未完全对齐：官方诉讼语言、Utah
              建设报道和后续空运报道使用了实质不同的规模描述。最后，相对于已筹集资本规模，总部、董事会构成和治理权利披露不足。如果后续章节能验证技术、客户需求和商业化时间线，这些问题都可在尽调中管理；眼下它们仍是核心待解项，而非边缘脚注。
