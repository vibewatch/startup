  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监控触发点
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 功率验证风险
        - Utah 运行里程碑
        - 冷态临界阶段后，仍未披露热态运行进展或设计温度数据
        - 从跟踪转为回避，直到反应堆证明的不只是堆芯物理
      - - 燃料供应风险
        - 项目专属燃料披露
        - 下一重大测试阶段前，仍没有清晰 HALEU / NNSS 分配或替代燃料路径
        - 假设时间表右移，并提高所需回报
      - - 商业许可风险
        - NRC 路径披露
        - 到 2027 年，尽管试点持续推进，仍没有可信预申请或商业许可时间表
        - 不把 DOE 试点视为足以承保长期收入
      - - 废物 / 后端风险
        - 处置计划
        - 装料运行扩大前，仍没有成文的临时贮存或永久处置路径
        - 不承保大规模部署主张
      - - 商业化风险
        - 购电证据
        - 另一轮大额融资前，仍没有签署试点经济性、PPA 或类似客户合同
        - 假设估值仍由叙事驱动，避免不计价格入场
      - - 治理 / 声誉风险
        - 控制建设回应
        - 争议之后，看不到董事会、安全治理或披露强化
        - 下调信心和交易对手转化假设
      - - 融资风险
        - 已融资本与已取得证明的对比
        - 大额新融资发生，却没有同步技术和客户证明
        - 解读为证据质量被稀释，而不只是 runway 延长
    notes: 这些触发点刻意设计得具体、可证伪，让投资判断随证据变化，而不是随泛化乐观或板块热情摆动。
    claimRefs:
      - CR023
      - CR034
      - CR040
      - CR043
      - CR044
      - CR045
      - CR046
  - id: TV001
    title: 建议摘要表
    columns:
      - 建议
      - 信心
      - 风险评级
      - 估值立场
      - 入场纪律
      - 改变判断的条件
    rows:
      - - 继续研究
        - 中
        - 高
        - 偏高
        - 不能只凭公开证据承保高于已披露 $2B 标记的价格；先要求披露里程碑和资本结构。
        - 只有在持续功率运行、已签客户经济性和完整债务 / 优先权可见之后，才转向买入。
    notes: 这是一个对价格敏感的结论，不是判断技术最终能否跑通的裁决。
    claimRefs:
      - CV013
      - CV014
      - CV045
      - CV046
  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 视角
      - 正方论点
      - 反方论点
      - 什么会改善判断
      - 什么会恶化判断
    rows:
      - - 市场需求
        - AI 和工业客户显然想要更多 24/7 清洁电力。
        - 需求本身不能保证 Valar 拿到合同或跑出经济性。
        - 与信用良好买方签署 PPA 或购电承诺。
        - 需求仍只是叙事，没有披露转化。
      - - 技术进展
        - Project NOVA 和 Ward 250 里程碑领先于很多创业公司公开展示的水平。
        - 冷态临界不是全功率、长时长性能。
        - 发布运行时长和热性能数据。
        - 时间表重置，或无法可靠地在功率下运行。
      - - 资本获取
        - 对一家 2023 年成立的核能创业公司，Valar 已融到异常大的轮次。
        - 最新一轮已包含债务，所以下行风险未来可能更快打到股权。
        - 干净的债务文件和非惩罚性优先权条款。
        - 限制性契约，或对退出价值的优先索取权。
      - - 可比公司
        - Oklo、NuScale、Kairos、X-energy 和 TerraPower 证明投资人愿意为核能期权价值付费。
        - 同行也显示，在商业证明出现前，长周期和巨额烧钱可能持续存在。
        - 证据表明 Valar 能比同行更快或更便宜地抵达证明。
        - 同行进展超过 Valar，而 Valar 仍不透明。
      - - 估值
        - 如果 Valar 能快速把证明转成合同，$2B 标记可能合理。
        - 没有收入或合同经济性时，这个标记已经假设了尚未公开的成功。
        - 功率运行时长加上可融资的合同经济性。
        - 披露没有改善，价格却继续上涨。
    notes: 各行把“拥有这个故事”的理由，与“今天支付当前价格”的理由拆开。
    claimRefs:
      - CV007
      - CV008
      - CV013
      - CV014
      - CV039
      - CV045
  - id: TV003
    title: 可比估值表
    columns:
      - 可比对象
      - 估值 / 状态信号
      - 为什么对 Valar 重要
      - 相关性
      - 主要局限
    rows:
      - - Valar Atomics
        - $450M 轮后私人 $2B 标记，其中含 $110M 债务。
        - 用作本次测试当前入场价格的锚点。
        - 最接近的直接价格信号。
        - 私人标记，财务披露有限。
      - - Oklo
        - 2025 年非关联方市值约 $7B；Aurora-INL 目标为 2027 年末至 2028 年初。
        - 显示公开市场能在规模化前为先进核能期权价值付费。
        - 最好的美国上市先进反应堆基准。
        - 反应堆类型和燃料循环论点不同。
      - - NuScale
        - 2025 年非关联方市值约 $5.3B，且披露的运营现金消耗很重。
        - 显示商业化前反应堆开发能吞掉多少资本。
        - 基于公开申报的资本强度代理。
        - 面向公用事业的 SMR 路径，不是 Valar 式 gigasite 路径。
      - - Bloom Energy
        - 2025 年非关联方市值约 $3.9B，且有真实运营业务。
        - 提醒投资人，一家有收入的能源硬件公司，交易价格仍可能接近或低于 Valar 的私人标记。
        - 有用的非核能源硬件类比。
        - 不是反应堆开发商，也不是直接许可可比对象。
      - - X-energy
        - 约 $500M Series C-1 融资，以及与 Amazon 相关的 >5 GW 部署目标。
        - 证实战略资本仍强力支持 HTGR 同行。
        - 最接近的已披露 HTGR / TRISO 融资类比。
        - 融资金额不等于已披露企业价值。
      - - Kairos Power
        - Google 协议覆盖最高 500 MW，首座反应堆计划 2030 年投运。
        - 显示买方支持按里程碑推进的容量协议。
        - 核能商业化的企业购电参考。
        - 购电结构不是估值标记。
      - - TerraPower Natrium
        - 345 MWe 基荷、带储能 500 MWe 峰值，2026 年 NRC 许可并获 DOE 支持。
        - 更成熟的项目仍然需要补贴，也要穿过漫长监管周期。
        - 可作为成熟度和规模参照。
        - 电站级别远大于 Valar 目前公开设计。
    notes: 本表混合了私募估值、公开市场信号、融资轮次和以里程碑支撑的客户承诺，因为对尚未产生收入的先进核能公司，没有一个单一的标准化估值指标能够干净适配。
    enumerationScope:
      coverage: partial
      basis: >-
        This table covers the most relevant public valuation and milestone anchors for U.S. advanced-nuclear peers and
        adjacent energy-hardware references discussed in this chapter; it is not an exhaustive census of all reactor
        developers.
    claimRefs:
