      - CV037
      - CV038
  - id: TV004
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 概率信号
      - 核心假设
      - 隐含估值区间（USDm）
      - 相对 $2B 估值标记的 MOIC
      - 下行 / 上行触发因素
    rows:
      - - 熊市
        - 公开批评者说得对：进度和经济性仍未验证。
        - Ward 250 延期，债务和优先权条款苛刻，也没有可融资的合同出现。
        - 600-1200
        - 0.3x-0.6x
        - 时间线落空，且没有运行时间或合同数据抵消。
      - - 基准
        - Valar 拿出可见的技术证明，但完整商业披露仍然缺位。
        - Ward 250 达到功率运行演示，融资通道保持打开，但经常性经济性仍未披露。
        - 1500-2400
        - 0.75x-1.2x
        - 技术证明改善速度快于经济性公开速度。
      - - 牛市
        - 技术证明转化为客户支撑的商业化。
        - 持续运行时间、已签电力或工业合同，以及可复制的部署模型出现。
        - 3000-4500
        - 1.5x-2.25x
        - 商业数据追上当前叙事。
    notes: 区间是情景输出，不是收入倍数输出。它们用来表达：同一家公司要配得上更高或更低估值，必须先出现哪些证据。
