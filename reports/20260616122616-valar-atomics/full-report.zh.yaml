      - number: '2.4'
        title: 采用驱动、时间约束和规模化前提
        blocks:
          - type: paragraph
            body: >-
              最强需求驱动在 Valar 和同业材料中都看得到：负荷增长快过电网交付，关键任务场地需要可靠性，电力与工业热捆绑有价值。Valar 自身推介依赖跨 gigasite 的场地成本摊销；X-energy 和
              Kairos 都认为，模块化、在线换料或标准化建设可以把核能推近需求点；TerraPower
              的选址标准则说明，基础设施接入和可许可性与商业就绪度不可分割。综合来看，证据支持一个清晰判断：市场确实需要清洁稳定能源，并且希望它能部署在比传统核电站更靠近受限负荷的位置。


              但约束至少同样重要。DOE 试点框架或许能为测试反应堆移除一个许可瓶颈，但 Utility Dive 记录了直接批评：绕开 NRC 会增加安全和治理风险。DCD
              指出，开发商仍要承担自己的设计、建设、运营和退役成本，因此更快的试点路径并不会让资本强度消失。Kairos 的 TRISO 工作和 X-energy 的 TRISO-X
              定位也强调，燃料和制造就绪度仍是商业化关口，不是背景细节。TNW 对该领域的梳理在时间上很直白：领先的先进反应堆初创公司仍未实现规模化商业供电。对估值而言，结论是 Valar
              所处市场确有采用压力，但公开证据仍指向分阶段路径——试点证明、渠道验证、场地标准化、燃料就绪，然后才是更广泛的超大规模或工业推广。
