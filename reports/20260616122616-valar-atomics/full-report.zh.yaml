      - number: '3.3'
        title: 替代品、潜在进入者和采购现实
        blocks:
          - type: paragraph
            body: >-
              Valar 不只是在和具名初创公司竞争，也在和时间、买方风险承受力竞争。Reuters、Utility Dive 和 ANS 都显示，DOE 快速通道试点包含更广泛的进入者——Aalo、Antares、Deep
              Fission、Last Energy、Natura、Radiant、Terrestrial、Oklo 等——因此投资者注意力和客户心智会分散到许多“首座反应堆”故事上。这一点重要，因为公开 Valar
              同业集合中的公司尚无一家用先进设计交付商业电力，买方因此仍会默认选择能更快解决问题的替代方案。对 AI 和数据中心采购而言，近端替代方案仍是电网供电、天然气，以及既有核电重启或增容。IEA 的 Energy
              and AI 分析明确称，到 2030 年，在高需求情景下化石燃料仍至关重要；EIA 对加密挖矿用电的研究显示，同址、高耗能负载已经在追逐直接低成本能源来源。这些模式支持 Valar
              的场地逻辑，但尚未支持其经济性。它们还意味着，Valar 必须用一个未来运营模式去销售，面对的替代品虽更脏或差异化更弱，却更受今天的金融机构、公用事业和超大规模客户理解。
