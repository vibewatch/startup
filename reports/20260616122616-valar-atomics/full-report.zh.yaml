      - number: '3.4'
        title: 护城河耐久性、切换成本和仍高度不确定之处
        blocks:
          - type: paragraph
            body: >-
              Valar 的护城河在概念上真实存在，但证据上仍有条件。故事的独特之处并不只是“给 AI
              用的小反应堆”；其他公司也可以这么说。更强的主张是把高温热、离网选址，以及从同一反应堆家族变现电力、氢能、工业热和碳氢燃料的可能性合在一起。如果这套产品堆栈跑通，它或许能把 Valar
              与只卖电力的竞争对手区分开。但护城河耐久性取决于买方是否更看重这种多功能性，而不是已验证运行时长、公用事业关系和透明许可。一旦买方选定反应堆供应商，切换成本应很高，因为燃料形态、冷却剂、许可路径、场地布局和长期运营模式会一起变化；在同一场地多供应商并行因此不现实。即便如此，公开证据在两个最关乎商业的问题上仍不完整：Ward250
              的单台规模到底是什么，Valar 能否拿出优于替代品或资本更充足同业的经济性。Ward250 的公开描述尚未干净对齐，因此公司仍要求投资者信任一个移动规格，同时押注速度会转化为可融资的运营证明。
