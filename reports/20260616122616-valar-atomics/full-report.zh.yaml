      - number: '2.2'
        title: 规模测算视角：这是一个巨大的电力问题，但不是干净的 Valar 专属 TAM
        blocks:
          - type: paragraph
            body: >-
              留存来源没有干净发布 Valar 专属 TAM、SAM 或 SOM，因此市场只能通过相邻需求池和反应堆采购区间三角测算。最宽的独立视角来自 IEA 对数据中心供电的展望：基准情景下，电量从 2024 年的 460
              TWh 增至 2030 年超过 1,000 TWh，核能在十年后期变得更重要。Valar 自己的首页更窄、也更宣传化，声称到 2030 年 AI 模型将需要超过 200 TWh 的额外电网电力。EIA
              对加密挖矿的分析提供了一个有用类比，说明耗电密集型计算负载多快会变得具有系统相关性：美国每年 25-91 TWh，或全国需求的 0.6%-2.3%，运营商会流向廉价电力、直接发电连接和需求响应项目。TNW
              则引入资本市场视角，引用 Goldman Sachs 对 AI 缺口最终需要 85-90 GW 新核能容量的判断。


              这些数字有意义，因为它们确立了问题规模，但并不证明 Valar 能按比例分走份额。更近端的商业楔子，应通过买方面向的部署块和渠道结构理解：Kairos 向 TVA 电网销售 50 MW，用于 Google
              相关需求；X-energy 推销 80 MWe 模块和 320 MWe 四联包，并搭配工业蒸汽；TerraPower 的 Natrium 位于 345-500 MW
              区域电网区间。上述证据说明，公开市场目前更清楚地披露了稀缺问题和可能采购规模，却远没有清楚披露 Valar 专属可服务市场。因此，任何硬性的 SAM 或 SOM 数字都只是估算，不是公开事实。
