      - number: '5.2'
        title: 反应堆架构和验证阶梯
        blocks:
          - type: paragraph
            body: >-
              从架构层面看，Valar 明显属于 HTGR 家族。公开来源在 TRISO 燃料、石墨慢化和氦冷上相互对齐，Project NOVA
              又把不锈钢中的碳化硼控制元件加入已披露材料堆栈。这足以理解基本设计哲学：一个使用包覆颗粒燃料、以石墨为核心的高温气冷反应堆，优化目标是高品质热，而不只是传统电网电力。最清晰的技术证据来自
              NOVA，因为那是公司从营销文案进入真实联邦测试环境的节点。Valar、WIRED 和 New Scientist
              都一致认为，该里程碑是零功率临界——这很重要，因为它验证堆芯几何和反应性行为，但不等同于证明一座高温、集成反应堆。


              Ward Zero 通过提供非核、全温度热替身，填补了部分缺口。Ward Zero 与 NOVA
              合在一起，支持公司有意分离热验证和中子验证的说法。但它们尚未证明集成发电、按设计温度持续运行，或商业上有用的转换效率。压缩机、换热器、涡轮系统和产品专用的厂房配套平衡仍缺少公开细节。正因这段中间层缺失，Ward250——而不是
              NOVA——仍是决定性的技术产品里程碑。
