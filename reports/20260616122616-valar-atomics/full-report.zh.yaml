      - number: '6.3'
        title: 需求信号和购买标准
        blocks:
          - type: paragraph
            body: >-
              需求论点本身可信。IEA 预计服务数据中心的发电量从 2024 年到 2030 年将增长超过一倍；Data Center Frontier
              描述的市场中，超大规模客户正在积极寻找稳定、24/7、无碳供应。TechCrunch 的行业综述显示，主要技术买方已经与其他供应商签署或资助了核能安排。对 Valar
              来说，这是有帮助的背景，因为它说明公司指向的是一个真实采购问题，而不是凭空创造出来的问题。


              同一比较也澄清了 Valar 仍需跨过的购买标准。未来客户可能不太在乎冷临界标题，更关心反应堆能否带功率运行、可靠循环、获得商业许可、锁定燃料，并支撑长期合同结构。New Scientist
              称，未来客户会想看到受控带功率运行、热性能和长期可靠行为；Reuters 和 AP 则提出燃料、经济性、安全和许可等现实障碍。换言之，市场拉力真实存在，但 Valar 目前满足可融资级买方标准的证据仍不完整。
