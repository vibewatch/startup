      - number: '6.4'
        title: 留存、扩张、集中度和披露缺口
        blocks:
          - type: paragraph
            body: >-
              公开记录最薄弱的地方，恰好也是后期投资人或企业买家最需要精度的地方。留存的公开来源没有披露活跃客户数、已预订兆瓦数、积压订单、续约率、NRR、GRR、流失率、平均合同期限或客户满意度评分。留存证据中也没有披露具名的
              hyperscaler 或工业生产承购方。因此，客户章节不能得出 Valar 留存差或集中度危险的结论；只能确认，公司尚未公开拿出评估这两件事所需的数据。


              这个缺口很关键，因为 Valar 可能采用的商业模式本来就会集中。反应堆开发商卖给数据中心、工业园区或国际场地主机，早期几乎一定依赖少数超大客户。如果今天的公开记录主要由 PNRI、DOE/LANL
              验证、Utah
              承载机构和本地场地支持构成，那么在更多具名生产客户出现前，短期集中度风险很可能偏高。扩张路径在概念上有吸引力——从试点到首批销售，再到多反应堆超大型场址——但公开尽调应盯住转化，而不是叙事：哪些交易对手已签
              LOI，已签约负荷有多少，首批合同期限多长，以及带功率运行表现是否强到足以赢得追加订单。
