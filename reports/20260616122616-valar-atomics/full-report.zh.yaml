    rows:
      - - 创始人 / 对外叙事
        - Isaiah Taylor 仍是融资、政治、媒体和产品身份的核心
        - 高
        - 高
        - 增加更可见、机构化的技术和运营声音
        - 要求提供授权分工图、决策权和独立董事会监督
      - - 核运营与安全领导力
        - 公开证据显示贡献者很强，但完整安全治理责任归属披露仍偏薄
        - 中
        - 高
        - 正式确定安全问责结构，并加深外部顾问力量
        - 要求提供安全委员会章程、组织图和汇报线
      - - 项目管理与建设
        - Utah 建设、运输、调试和实验室接口需要成熟项目控制
        - 中高
        - 高
        - 采用按里程碑推进的 PMO 纪律，必要时引入外部施工方
        - 要求提供一体化计划、风险登记表和类似挣值管理的节奏
      - - 燃料 / 供应链执行
        - 先进反应堆燃料和材料采购超出普通创业公司采购范围
        - 高
        - 高
        - 尽早招聘专职核燃料和采购负责人
        - 要求提供浓缩、制造和运输工作流的具名负责人
      - - 财务 / 合规扩张
        - 快速招聘意味着后台和合规系统仍在追赶资本规模
        - 中
        - 中高
        - 商业签约前，继续建设财务、审计和治理能力
        - 要求提供 controller/CFO 梯队、审计准备状态和内控路线图
    notes: 这张表聚焦人员和管理失效模式：即便核心设计仍然可靠，它们也可能让一家技术前景不错的硬件公司脱轨。
