  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式和变现
        blocks:
          - type: paragraph
            body: >-
              Valar 的公开材料指向未来由项目牵引的能源业务，而不是软件订阅或已经成型的公用事业模式。公司推销四条终端产品线——数据中心供电、氢能、工业电力和清洁燃料——并反复主张标准化 gigasite
              将创造最终推动规模化的现金流。独立报道方向一致：TechCrunch 和 Business Insider 描述了一种面向大型能源买方的离网部署模式，AP 则报道管理层希望 2027 年开始以测试方式售电，并在
              2028 年全面商业化。这一点重要，因为它意味着当前公开牵引力仍是收入前，至多也是规模化商业化前。


              缺失的恰是财务承销最需要的东西。留存官方页面没有披露电价、$/MWh 基准、氢气价格、合成燃料价格、反应堆售价、毛利率或已实现合同结构。公开材料描述 Valar 想卖什么，但没有说明客户现在付多少钱、合同是否
              take-or-pay，或早期部署是通过设备销售、融资型电力服务、测试合同，还是三者混合变现。TechCrunch 提到的 Philippines 合同，以及 AP 的 2027/2028
              时间线，暗示变现可能分阶段到来——先试点工作，再到更广泛产品收入——但顺序仍只是粗略勾勒。
