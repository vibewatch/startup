      - number: '4.4'
        title: 资本充足性和烧钱代理
        blocks:
          - type: paragraph
            body: >-
              Valar 很可能拥有可观资本，但公开证据没有说明这些资本是否足够。公司没有披露现金余额、月度烧钱、季度经营现金使用、债务到期表、最低流动性契约或 runway 估计。能观察到的是烧钱代理：团队人数从 2025
              年初 35 人快照增至 Tracxn 记录的 2026 年 5 月 104 人；财务、运营、燃料处理和施工岗位仍在招聘；Utah 有外部 EPC 和场地伙伴；试点路径仍依赖 DOE 支持、Nevada
              燃料供应和监管加速。这些代理都指向一个成本基础，其扩张速度快过公开记录能够量化的速度。


              2026
              年融资中的债务部分尤其重要。如果债务用于衔接场地建设或项目里程碑，它可以很聪明；但在利润率可见之前，债务也会带来还款和契约风险。新增项目财务招聘支持这样一种判断：管理层已经在为结构化资本，或许还有未来项目融资式载体做准备，而不只是再来一轮干净的普通股融资。承销含义很直接：不能只看标题融资额来判断资本充足性。它取决于
              2026 年融资中有多少是无限制现金，Utah、Philippines 和燃料开发项目吸收资金的速度，以及 $110M 债务 tranche 中包含哪些义务。
