      - number: '8.2'
        title: 为什么 $2B 标记由里程碑支撑，而不是由收入支撑
        blocks:
          - type: paragraph
            body: >-
              与大多数 2023 年成立的初创公司相比，Valar 已经拿到更多技术和政治动能。Project NOVA 在 DOE 和 Los Alamos 监督下实现冷临界，Ward 250 仍绑定一条高曝光的 2026
              年里程碑路径，公司还借助 DOE 赋能的试点框架和对 NRC 的激进法律姿态来压缩时间表。这些是真实数据点，不是纸面产品。它们也解释了为什么投资人可能愿意在商业指标可见前支付溢价。


              但里程碑堆出来的估值，不等于持久经济性证明。New Scientist、Associated Press 和 Mother Jones
              各自呈现了同一警示的不同版本：冷临界不是持续带功率运行，运输奇观不是项目经济性，专家对小型反应堆竞争力的怀疑仍未消失。这里 $110M
              债务部分很重要，因为一家收入前核能建设公司一旦开始叠加债务，时间线滑坡或成本意外会比头条融资总额暗示的速度更快地伤害股权价值。因此，公开证据支持的是期权价值框架：Valar
              为自己买到了更多射门机会，但还没有权利被当作已经进球来承销。
