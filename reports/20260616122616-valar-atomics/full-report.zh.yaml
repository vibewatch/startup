      - number: '1.3'
        title: 资本结构、投资者基础和战略利益相关方
        blocks:
          - type: paragraph
            body: >-
              Valar 的资本形成速度急剧提升。TechCrunch 报道，公司 2025 年 2 月走出隐身状态时获得 $19 million 种子轮，由 Riot Ventures
              领投，AlleyCorp、Initialized Capital、Day One Ventures 和 Steel Atlas 参投。Los Angeles Times 随后报道，Snowpoint
              Ventures 领投 $130 million Series A，Day One 和 Dream 共同领投；Bloomberg 又报道，2026 年 3 月一轮融资使公司估值达到 $2 billion，并带来
              $450 million 总融资，其中包括 $340 million 股权和 $110 million 债务。Tracxn
              的融资台账大体印证了四轮资本堆栈，但并不支持每一个财团细节。投资者组合在战略上值得注意：它把气候 / 深科技种子基金，与 Palmer Luckey、Shyam Sankar、Doug Philippone
              等防务科技人物混在一起。这个财团给 Valar 带来资本和政策网络入口，但也加深了公司对一小撮创始人主导、政策连接型支持者的依赖，而不是依赖已披露的长周期公用事业公司或工业承购方。
