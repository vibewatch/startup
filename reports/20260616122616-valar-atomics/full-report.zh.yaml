        - 重工业、先进技术、更大站点的清洁能源
        - 最接近已披露的 HTGR + TRISO + 工业热类比对象
        - 公开定位更不强调可运输性，也较少围绕园区微反应堆
      - - Oklo
        - 表后快中子裂变反应堆
        - 上市公司画像；Aurora-INL 目标为 2027 年末至 2028 年初
