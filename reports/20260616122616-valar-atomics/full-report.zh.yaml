            - HALEU TRISO 燃料
            - 石墨慢化剂
            - 氦冷却剂
            - 碳化硼控制件
        - label: 热验证层
          detail: Ward Zero 提供非核、全温度替代堆芯，让 Valar 在装料启动前先测试多套热系统。
          modules:
            - Ward Zero 替代堆芯
            - 碳化硅加热元件
            - 仪表与热系统检查
        - label: 中子学验证层
          detail: Project NOVA 在联邦监管下，以零功率验证类似 Ward250 的燃料、慢化剂和反应性控制假设。
          modules:
            - NOVA 子组件
            - NCERC 临界装置
            - 模型与测试对比
        - label: 集成反应堆层
          detail: Ward250 是首个带功率的集成电站，计划在 Utah 规模把堆芯、冷却剂、控制系统和场址系统合在一起。
          modules:
