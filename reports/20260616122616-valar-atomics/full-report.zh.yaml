      - number: '6.2'
        title: 今天的具名证明是试点、业主和伙伴
        blocks:
          - type: paragraph
            body: >-
              最强公开证明不是一面超大规模客户 logo 墙，而是一条试点和业主关系链。TechCrunch 和 Business Insider 都报道了 Philippines Nuclear Research
              Institute 研究合同；在留存来源集中，这似乎是最清晰的具名客户式协议。在美国，可见交易对手大多是基础设施和验证伙伴：DOE 的 Reactor Pilot Program、Project NOVA 下的
              Los Alamos 和 NCERC、Utah San Rafael Energy Lab，以及 Emery County 本地业主生态。这些都是有意义的证明点，因为它们显示了真实选址、测试和机构支持，而不是
              PPT。


              但区别很重要。Project NOVA 验证反应堆物理和政府实验室合作；它不是经常性商业承购。USREL 和 Emery County 证明业主场地接受度和本地政治支持；它们不证明购电转化。即便 PNRI
              关系在战略上重要，公开描述也把它归为研究或试点路径，并带有后续全规模抱负，而不是已披露、收入丰厚的生产合同。公开层面，Valar 因此已经从概念跨入具名试点生态，但还没有从试点生态跨入可融资客户基础。
