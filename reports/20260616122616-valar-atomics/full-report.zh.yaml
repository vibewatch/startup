      - number: '8.4'
        title: 入场纪律、论点破裂点与最终索取项
        blocks:
          - type: paragraph
            body: >-
              有纪律的投资人仍可以喜欢这里的前进方向。稳定清洁电力背后的市场拉力真实存在，技术团队至少有一个异常可见的证明点，可比项目也显示，大型战略交易对手愿意在长周期内支持先进核能路径。缺的不是兴奋度，而是承销闭环。在
              Valar 拿出持续带功率数据、合同经济性、以及完整债务和优先权披露之前，当前估值应被视为后续尽调的上限，而不是追价的下限。


              这把尽调压缩成一张很窄的清单。最重要的索取项是已签客户文件、精确资本栈、Ward 级部署的单机经济性，以及 Ward 250 越过冷临界之后的运行数据。如果 2026 至 2028
              年时间表拉长却没有补偿性证据，如果融资栈比头条暗示更苛刻，或如果燃料和监管瓶颈抹掉公司的速度优势，投资论点就会破裂。换句话说，Valar 未来可能在 $2B
