        - 与离网电力和数据中心叙事高度重叠
        - 不是高温气冷 / 合成燃料主张
      - - Kairos Power
        - 熔盐先进反应堆项目
        - 跨州研发、制造和示范布局
        - 示范反应堆、公用事业相邻清洁电力、工业负载
        - 在执行可信度和工厂化开发上竞争
        - 公开叙事较少围绕氢或合成燃料
      - - TerraPower
        - 带储能的大型钠冷 SMR
        - ARDP 支持的怀俄明首座电站
        - 公用事业级清洁电力、大型工业或 hyperscaler 采购
        - 关乎大额清洁电力预算和严肃交易对手
        - 规模明显更大，也更偏电网
      - - DOE 试点入选队列
        - 可能入场者
        - Aalo、Antares、Deep Fission、Last Energy、Natura、Radiant、Terrestrial、Oklo、Valar，以及与 Atomic Alchemy 相关的活动
        - 微电网、试点反应堆、军事、专业或园区负载
        - 争夺首个证明点心智和投资者资本
        - 许多仍处更早阶段或披露稀薄
      - - 棕地核电 / 增容
        - 既有替代方案
        - 现有机组、重启和增容可更快交付大块电力
        - 需要近期无碳电力的 hyperscaler 或工业买方
        - 在某些情况下更早解决同一个 24/7 清洁电力问题
        - 不模块化；不太适配站点相邻热产品
      - - 电网加燃气 PPA
        - 现状替代方案
        - 到 2030 年前，在高需求场景中仍是现实默认选择
        - AI 园区、工业负载、一般电力采购
        - 可获得、可融资，运营上也熟悉
        - 有碳暴露，也没有 Valar 式产品差异化
    notes: 各行混合了直接同行、相邻先进反应堆供应商和现状替代方案，因为 Valar 同时销售多个买方任务。融资和规模是公开信号代理，并非标准化企业价值。
