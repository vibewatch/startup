- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Current evidence
  - Impact
  - Exact diligence path
  rows:
  - - Current cash balance
    - Needed to assess runway and covenant headroom
    - No retained public source discloses cash on hand
    - Material
    - Obtain latest board deck, balance sheet, and debt-compliance certificate
  - - Monthly burn and quarterly cash use
    - Needed to size next financing need
    - Only hiring and project proxies are public
    - Material
    - Request trailing 12-month monthly burn and management forecast by program
  - - Debt terms on $110M tranche
    - Debt can subordinate equity if covenants or security are tight
    - Debt amount disclosed; pricing and covenants undisclosed
    - Material
    - Review credit agreement, amortization schedule, and pledged collateral
  - - Realized customer pricing / contract structure
    - Determines revenue quality and payback
    - No public tariffs, ASPs, or PPA terms
    - Material
    - Review signed LOIs, PPAs, offtakes, and pilot contract economics
  - - Gross margin by product line
    - Margin path is the core underwriting question
    - No public gross-margin disclosure
    - Material
    - Request contribution margin for pilot work, hardware, service, and power sales
  - - Capex per reactor and per site
    - Drives financing intensity and scaling logic
    - No disclosed build-cost bridge
    - Material
    - Review bottoms-up BOM, EPC estimates, shielding cost, and transport cost assumptions
  - - Customer concentration / backlog conversion
    - Large industrial customers can create lumpy revenue and financing risk
    - No disclosed backlog, pipeline conversion, or concentration metrics
    - Material
    - Request bookings, backlog, weighted pipeline, and top-customer exposure by product lane
  notes: These are the specific missing fields that prevent public-source underwriting of Valar’s economics today.
