- id: capital-adequacy-and-burn-proxies
  title: Capital Adequacy and Burn Proxies
  body: 'Valar likely has meaningful capital, but public evidence does not say whether that capital is enough. There is no disclosed cash balance, monthly burn, quarterly operating cash use, debt maturity schedule, minimum-liquidity covenant, or runway estimate. What can be observed instead are burn proxies: rapid headcount growth from a 35-person team snapshot in early 2025 to a Tracxn employee count of 104 by May 2026; active hiring in finance, operations, fuel handling, and construction; outside EPC and site partners in Utah; and a pilot pathway still dependent on DOE support, Nevada fuel supply, and regulatory acceleration. Those proxies argue for a cost base that is expanding faster than the public record can quantify.


    The debt component of the 2026 round is especially important. Debt can be smart if it bridges site buildout or project milestones, but it also introduces repayment and covenant risk long before margins are visible. The new project-finance hiring supports the view that management is already preparing for structured capital and perhaps future project-finance style vehicles, not just another clean common equity round. The underwriting implication is straightforward: capital adequacy cannot be judged from headline fundraising alone. It depends on how much of the 2026 round is unrestricted cash, how quickly the Utah, Philippines, and fuel-development programs absorb it, and what obligations sit inside the $110M debt tranche.'
