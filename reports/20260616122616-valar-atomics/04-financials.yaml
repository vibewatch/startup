  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding-total
    missingEvidence: A company-reconciled financing ledger that explains whether pre-seed and the $110M debt tranche are included in lifetime capital totals.
    whyItMatters: Without a reconciled capital history, investors cannot anchor dilution, debt burden, or cumulative capital efficiency accurately.
    diligencePath: Request the cap table, round-by-round closing schedule, and debt schedule from management or lead counsel.
    relatedQuestionRefs:
    - QI009
  - type: private-evidence-only
    severity: material
    topic: cash-and-runway
    missingEvidence: Current unrestricted cash, restricted cash, monthly burn, and management runway base case.
    whyItMatters: Capital adequacy cannot be assessed from fundraising headlines alone.
    diligencePath: Review the latest management accounts, cash forecast, and any board-level runway analysis.
    relatedQuestionRefs:
    - QI011
    - QI012
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Valar-specific gross margin, capex per reactor, service margin, and working-capital cycle.
    whyItMatters: These are the core variables needed to test whether gigasites can ever create attractive returns.
    diligencePath: Request bottoms-up unit economics and pilot-versus-commercial cost curves from finance and engineering.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI003
  - type: missing-source
    severity: material
    topic: customer-offtakes
    missingEvidence: Signed offtake, PPA, or pilot-contract economics for power, hydrogen, or synthetic fuels.
    whyItMatters: Revenue quality is impossible to judge without real counterparties, contract duration, and pricing structure.
    diligencePath: Review customer LOIs, PPAs, offtakes, and any milestone-payment schedules for Utah or Philippines work.
    relatedQuestionRefs:
    - QI026
    relatedTableRefs:
    - TI001
    - TI002
  - type: private-evidence-only
    severity: material
    topic: debt-terms
    missingEvidence: Interest rate, maturity, amortization, covenant package, and collateral for the disclosed $110M debt tranche.
    whyItMatters: Debt can materially change downside outcomes even if the headline round size looks strong.
    diligencePath: Request the executed credit agreement and debt-incurrence model.
    relatedQuestionRefs:
    - QI027
    relatedTableRefs:
    - TI002
    - TI004
  - type: missing-source
    severity: minor
    topic: customer-concentration
    missingEvidence: Any public disclosure of Valar backlog concentration, top-customer exposure, or pilot-to-commercial conversion funnel.
    whyItMatters: Hardware energy businesses can look diversified in narrative form while remaining highly concentrated in cash-flow reality.
    diligencePath: Request bookings and backlog by top customer and by product lane; compare against Bloom-style concentration analogs.
    relatedQuestionRefs:
    - QI023
    - QI025
    relatedTableRefs:
    - TI005
