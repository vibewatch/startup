- id: capital-formation-and-financing-structure
  title: Capital Formation and Financing Structure
  body: 'Capital formation is the one part of Valar’s financial story that is plainly visible. Public sources support a fast financing cadence: a February 2025 seed round widely reported at $19M, a late-2025 Series A of $130M, and a March 2026 financing reported at $450M and a $2B valuation. The newest round matters not just for size but for structure: Bloomberg, TNW, and Crunchbase all describe it as $340M of equity plus $110M of debt. That already moves Valar beyond a pure venture-equity story and into a more complex capital stack.


    The harder question is cumulative funding, because public sources disagree. Tracxn reports $489M raised across four rounds, but Mother Jones separately reports a $1.5M pre-seed, and a simple sum of pre-seed, seed, Series A, and the 2026 financing yields roughly $600.5M of gross disclosed capital. The most likely explanation is counting methodology—whether pre-seed is included, whether debt is treated separately from total round size, and whether secondary sources are normalizing on post-money equity only. That disagreement does not invalidate the larger conclusion that Valar has raised an unusually large amount of capital for its age, but it does mean investors should reconcile the cap table and debt schedule directly rather than accept any single headline total.'
