  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: competitor-universe
    missingEvidence: A fuller public list of advanced-reactor and substitute options segmented by buyer workflow, geography, and commercialization stage.
    whyItMatters: Valar competes across multiple buyer jobs, so an incomplete peer universe can hide indirect threats or overstate differentiation.
    diligencePath: Expand the competitor census using reactor-program databases, utility procurement disclosures, and regional advanced-reactor registries.
    relatedQuestionRefs:
    - QP019
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing-economics
    missingEvidence: Comparable LCOE, PPA, capex-per-MW, or delivered-product economics across Valar and its leading peers.
    whyItMatters: Competitive advantage cannot be underwritten if public evidence cannot show Valar is cheaper or even directionally competitive.
    diligencePath: Request management case studies, customer proposals, and internal cost curves with the assumptions needed to normalize them against peers.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: pilot-versus-commercial-advantage
    missingEvidence: Source-backed separation between DOE-pilot-specific authorizations and advantages that transfer to licensed commercial operation.
    whyItMatters: If Valar's speed depends mainly on pilot exceptions, the perceived moat may collapse when buyers evaluate real commercial rollout.
    diligencePath: Map each Ward250 milestone to the exact enabling authorization and ask which approvals would still be required for customer-serving deployment.
    relatedQuestionRefs:
    - QP024
  - type: private-evidence-only
    severity: material
    topic: fuel-cycle-and-waste-economics
    missingEvidence: Independent data on Valar's fuel supply plan, spent-fuel handling, and total lifecycle economics.
    whyItMatters: Fuel and waste handling can erase a paper cost advantage and directly affect buyer trust, insurance, and siting feasibility.
    diligencePath: Request supplier agreements, waste assumptions, shielding and dose calculations, and third-party review of lifecycle cost estimates.
    relatedQuestionRefs:
    - QP025
  - type: private-evidence-only
    severity: material
    topic: synthetic-fuel-unit-economics
    missingEvidence: Public or independently reviewed economics linking Valar's reactor heat to hydrogen and modified Fischer-Tropsch fuel production.
    whyItMatters: The multi-product moat is only durable if the synfuel pathway is economically credible versus electricity-only or hydrogen-only alternatives.
    diligencePath: Obtain mass-and-energy balances, feedstock assumptions, product yields, and sensitivity analyses against standalone hydrogen pathways.
    relatedQuestionRefs:
    - QP026
