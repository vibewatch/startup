- id: substitutes-entrants-and-procurement-reality
  title: Substitutes, likely entrants, and procurement reality
  body: Valar is also competing against time and buyer risk tolerance, not only against named startups. Reuters, Utility Dive, and ANS all show that the DOE fast-track pilot includes a broader entrant field—Aalo, Antares, Deep Fission, Last Energy, Natura, Radiant, Terrestrial, Oklo, and others—so investor attention and customer mindshare will diffuse across many “first reactor” stories. That matters because none of the companies in the public Valar peer set has yet delivered commercial power from an advanced design, which means buyers still default to substitute options that solve the problem sooner. For AI and data-center procurement, the near-term substitutes are still grid supply, gas, and incumbent nuclear restarts or uprates. The IEA's Energy and AI analysis explicitly says fossil fuels remain crucial in high-demand cases through 2030, and EIA's work on crypto-mining electricity shows that colocated, power-hungry workloads already chase direct low-cost energy sources. Those patterns
    support Valar's site logic but not yet its economics. They also mean Valar must sell a future operating model against substitutes that, while dirtier or less differentiated, are better understood by financiers, utilities, and hyperscalers today.
