  - - Broad advanced-nuclear field still pre-commercial
    - Keeps the market open to new winners
    - Better-capitalized peers or incumbent substitutes may lock buyers first
    - High
    - Open field but severe first-customer race
    - Map which buyers will wait for pilots versus choose mature substitutes now
