    - High
    - Differentiated thesis, not yet bankable advantage
    - Obtain customer pipeline by workflow and time-to-power requirement
  - - High-temperature multi-product output
    - Could monetize electricity, hydrogen, heat, and fuels from one reactor family
    - Peers may win with simpler power-only products buyers can underwrite more easily
    - High
