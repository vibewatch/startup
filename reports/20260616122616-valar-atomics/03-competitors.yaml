- id: moat-durability-and-risk
  title: Moat durability, switching costs, and where uncertainty is still high
  body: 'Valar''s moat is real in concept but still conditional in evidence. The distinctive part of the story is not simply “small reactor for AI”; other companies can say that too. The stronger claim is the combination of high-temperature heat, off-grid siting, and the possibility of monetizing electricity, hydrogen, industrial heat, and hydrocarbon fuels from one reactor family. If that product stack works, it could differentiate Valar from power-only rivals. But moat durability depends on buyers caring about that versatility more than they care about proven runtime, utility relationships, and transparent licensing. Switching costs should be high once a buyer picks a reactor vendor because fuel form, coolant, licensing path, site layout, and long operating model all change together; multi-homing is therefore implausible on one site. Even so, public evidence remains incomplete on the two questions that matter most commercially: what Ward250 really is at unit scale, and whether Valar can
    show economics better than substitutes or better-capitalized peers. Public descriptions of Ward250 do not yet reconcile cleanly, so the company still asks investors to trust a moving specification while betting that speed will convert into bankable operating proof.'
