  title: Competitive segmentation and profile snapshot
  columns:
  - Competitor / substitute
  - Segment
  - Public scale / funding signal
  - Primary buyer or use case
  - Why it overlaps Valar
  - Key limitation versus Valar
  rows:
  - - Valar Atomics
    - HTGR microreactor / off-grid gigasite
    - $450M round at $2B valuation; $489M total funding tracked by Tracxn
    - Data centers, hydrogen, industrial heat, synthetic fuels
    - Own product scope defines the target workflow
    - No public at-power operating record; public Ward250 scale disclosure is inconsistent
  - - X-energy
    - HTGR / TRISO industrial SMR
    - Large advanced-nuclear platform; markets high-temperature steam and constant power
    - Heavy industry, advanced technologies, larger-site clean energy
    - Closest disclosed HTGR + TRISO + industrial-heat analog
    - Public positioning is less transportable and less campus-microreactor-centric
  - - Oklo
    - Fast-fission behind-the-meter reactor
    - Public-company profile; Aurora-INL targeted for late 2027 to early 2028
    - Campus power, data centers, colocated 24/7 electricity
    - Strong overlap on off-grid electricity and data-center narratives
    - Not a high-temperature gas / synfuel proposition
  - - Kairos Power
    - Molten-salt advanced reactor program
    - Multi-state R&D, manufacturing, and demo footprint
    - Demonstration reactors, utility-adjacent clean power, industrial loads
    - Competes on execution credibility and factory-style development
    - Public narrative is less about hydrogen or synthetic fuels
  - - TerraPower
    - Large sodium SMR with storage
    - ARDP-backed first plant in Wyoming
    - Utility-scale clean power, large industrial or hyperscaler procurement
    - Relevant for big clean-power budgets and serious counterparties
    - Materially larger and more grid-oriented than Valar
  - - DOE pilot entrant cohort
    - Likely entrants
    - Aalo, Antares, Deep Fission, Last Energy, Natura, Radiant, Terrestrial, Oklo, Valar, and Atomic Alchemy-linked activity
    - Microgrids, pilot reactors, military, specialty or campus loads
    - Compete for first-proofpoint mindshare and investor capital
    - Many remain earlier-stage or thinly disclosed
  - - Brownfield nuclear / uprates
    - Incumbent substitute
    - Existing fleet, restarts, and uprates can deliver large blocks faster
    - Hyperscalers or industrial buyers needing near-term carbon-free power
    - Solves the same 24/7 clean-power problem sooner in some cases
    - Not modular; less tailored to site-adjacent heat products
  - - Grid plus gas PPAs
    - Status-quo substitute
    - Still the practical default in high-demand cases through 2030
    - AI campuses, industrial loads, general electricity procurement
    - Available, financeable, and operationally familiar
    - Carbon exposure and no Valar-style product differentiation
  notes: Rows mix direct peers, adjacent advanced-reactor vendors, and status-quo substitutes because Valar sells multiple buyer jobs at once. Funding and scale are public-signal proxies, not normalized enterprise values.
