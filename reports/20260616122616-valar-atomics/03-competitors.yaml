company:
  name: Valar Atomics
chapter:
  number: 3
  title: Competitors
  summary: Valar Atomics sits in a crowded advanced-nuclear field, but its most direct overlap is not with every reactor startup equally. X-energy is the closest disclosed technical analog because both market HTGR/TRISO systems for industrial heat, while Oklo overlaps on behind-the-meter campus power, Kairos on disciplined demonstration and manufacturing execution, and TerraPower on hyperscaler-adjacent clean-power procurement at much larger scale. Valar's differentiator is the off-grid “gigasite” model spanning data centers, hydrogen, industry, and synthetic fuels; its weakness is that public evidence still stops at pilot and cold-criticality milestones, with unresolved specification and economics questions.
sections:
- id: competitive-segmentation
  title: 'Competitive segmentation: who actually overlaps with Valar'
  body: 'Valar should not be compared to the entire nuclear sector as if every design sells the same job. Its public pitch combines three things at once: a high-temperature gas reactor using TRISO fuel, an off-grid “gigasite” operating model, and product ambitions that extend beyond electricity into hydrogen, industrial heat, and synthetic fuels. That means the direct peer set is narrower than the broader advanced-reactor universe. X-energy is the clearest disclosed technical analog because it also markets HTGR/TRISO systems around high-temperature steam and industrial uses. Oklo overlaps on 24/7 campus-scale behind-the-meter power, but its fast-reactor and fuel-recycling story points it toward power-first buyers rather than very-high-temperature heat buyers. Kairos overlaps on startup execution in advanced nuclear but presents a more conventional demonstration-campus path. TerraPower matters mainly as a well-capitalized adjacent threat for hyperscaler and large clean-power procurement,
    not as a like-for-like microreactor substitute. Meanwhile, status-quo alternatives—grid supply, gas generation, and brownfield nuclear restarts or uprates—remain powerful because they can deliver larger near-term megawatt blocks than any startup advanced reactor has yet proven at commercial scale.'
