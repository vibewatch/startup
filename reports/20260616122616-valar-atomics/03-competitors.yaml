  - - DOE-pilot speed
    - Fast milestones can pull financing and talent forward
    - Speed may depend on special pilot conditions that do not transfer to commercial deployments
    - High
    - Advantage today, uncertain durability tomorrow
    - Separate pilot-only permissions from reusable commercialization advantages
  - - First-startup criticality publicity
