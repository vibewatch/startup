evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board roster, board-observer list, and material investor control-rights summary.
    whyItMatters: >-
      Governance influence cannot be assessed from financing headlines alone, especially after rapid repricing and board
      additions.
    diligencePath: Request the latest board deck cover page, cap table summary, and financing term sheet excerpts from management.
    relatedQuestionRefs:
      - QO007
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: An official employee count and org breakdown by California, Utah, and any international operations.
    whyItMatters: >-
      Public vendor estimates and job boards are directionally useful but too weak for benchmarking execution capacity
      or burn.
    diligencePath: Request an HR census and hiring plan snapshot tied to the current budget.
    relatedQuestionRefs:
      - QO018
      - QO025
  - type: missing-source
    severity: material
    topic: headquarters
    missingEvidence: A primary-source statement of legal headquarters and principal operating office.
    whyItMatters: >-
      Public media and hiring surfaces use El Segundo and Hawthorne interchangeably, which muddies later diligence on
      permits, leases, and local talent concentration.
    diligencePath: >-
      Request certificate-of-incorporation details, principal-office address, and any headquarters press boilerplate the
      company considers canonical.
    relatedQuestionRefs:
      - QO002
      - QO025
  - type: private-evidence-only
    severity: material
    topic: commercialization
    missingEvidence: Revenue, customer commitments, and any signed offtake or power purchase agreements beyond pilot-program support.
    whyItMatters: >-
      The valuation story is currently capital- and policy-driven; without customer economics it is difficult to
      underwrite commercial readiness.
    diligencePath: Request pipeline by customer stage, term sheets, and projected revenue bridge from pilot to commercial deployment.
    relatedQuestionRefs:
      - QO019
      - QO020
      - QO025
  - type: conflicting-data
    severity: material
    topic: reactor-rating
    missingEvidence: >-
      A reconciled explanation of Ward One and Ward 250 power ratings and whether quoted figures are thermal, electric,
      prototype-specific, or journalistic shorthand.
    whyItMatters: >-
      Reactor-size ambiguity affects technoeconomics, siting expectations, and later comparisons with competing
      microreactor programs.
    diligencePath: Request a one-page reactor family specification sheet with named design variants and units clearly marked.
    relatedQuestionRefs:
      - QO024
      - QO025
    relatedTableRefs:
      - TO001
      - TO004
  - type: private-evidence-only
    severity: material
    topic: buyer-budgets
    missingEvidence: >-
      Customer-level budget authority and contracting structure by vertical, especially whether data-center, hydrogen,
      and industrial-heat deals sit in separate capex pools or in one integrated energy budget.
    whyItMatters: >-
      Valar’s market boundary is clear at the product level, but buyer-budget ownership determines sales-cycle length,
      procurement friction, and which segment can scale first.
    diligencePath: >-
      Ask management for anonymized pipeline examples showing buyer, payer, contracting entity, and whether the sale is
      electricity-only, heat-plus-power, or fuels-linked.
    relatedQuestionRefs:
      - QM004
  - type: missing-source
    severity: material
    topic: fuel-readiness
    missingEvidence: >-
      Valar-specific TRISO fabrication, HALEU sourcing, enrichment timing, and contingency planning for
      pilot-to-commercial scale-up.
    whyItMatters: >-
      Peer materials show fuel and manufacturing readiness are commercialization gates, but the public record does not
      show Valar’s binding supply position.
    diligencePath: >-
      Request fuel-supply memoranda, supplier names, enrichment assumptions, inventory timing, and sensitivity analysis
      for delays in commercial fuel availability.
    relatedQuestionRefs:
      - QM015
  - type: missing-source
    severity: material
    topic: sam-som-sizing
    missingEvidence: >-
      Public pipeline detail that allocates Valar opportunities by customer segment, site size, geography, contract
      type, and expected MW/TWh capture.
    whyItMatters: >-
      Without segment-level pipeline evidence, any Valar-specific SAM or SOM remains an estimate built from adjacent
      demand pools rather than a defendable market fact.
    diligencePath: >-
      Ask for pipeline rollups by vertical and stage, plus a management bridge from broad demand pools to the subset
      Valar believes it can actually serve.
    relatedQuestionRefs:
      - QM022
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: blocking
    topic: customer-offtake
    missingEvidence: >-
      Signed letters of intent, PPAs, heat-offtake terms, or pricing disclosures proving that real customers will
      contract for Valar output at economically viable levels.
    whyItMatters: >-
      The chapter can show demand pressure and plausible buyer segments, but valuation still depends on whether
      counterparties will sign around price, delivery risk, and regulatory uncertainty.
    diligencePath: >-
      Request current customer funnel, signed commercial milestones, pricing framework, and whether first deals route
      through utilities, project vehicles, or direct end users.
    relatedQuestionRefs:
      - QM023
  - type: enumeration-incomplete
    severity: material
    topic: competitor-universe
    missingEvidence: >-
      A fuller public list of advanced-reactor and substitute options segmented by buyer workflow, geography, and
      commercialization stage.
    whyItMatters: >-
      Valar competes across multiple buyer jobs, so an incomplete peer universe can hide indirect threats or overstate
      differentiation.
    diligencePath: >-
      Expand the competitor census using reactor-program databases, utility procurement disclosures, and regional
      advanced-reactor registries.
    relatedQuestionRefs:
      - QP019
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing-economics
    missingEvidence: Comparable LCOE, PPA, capex-per-MW, or delivered-product economics across Valar and its leading peers.
    whyItMatters: >-
      Competitive advantage cannot be underwritten if public evidence cannot show Valar is cheaper or even directionally
      competitive.
    diligencePath: >-
      Request management case studies, customer proposals, and internal cost curves with the assumptions needed to
      normalize them against peers.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: pilot-versus-commercial-advantage
    missingEvidence: >-
      Source-backed separation between DOE-pilot-specific authorizations and advantages that transfer to licensed
      commercial operation.
    whyItMatters: >-
      If Valar's speed depends mainly on pilot exceptions, the perceived moat may collapse when buyers evaluate real
      commercial rollout.
    diligencePath: >-
      Map each Ward250 milestone to the exact enabling authorization and ask which approvals would still be required for
      customer-serving deployment.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: material
    topic: fuel-cycle-and-waste-economics
    missingEvidence: Independent data on Valar's fuel supply plan, spent-fuel handling, and total lifecycle economics.
    whyItMatters: >-
      Fuel and waste handling can erase a paper cost advantage and directly affect buyer trust, insurance, and siting
      feasibility.
    diligencePath: >-
      Request supplier agreements, waste assumptions, shielding and dose calculations, and third-party review of
      lifecycle cost estimates.
    relatedQuestionRefs:
      - QP025
  - type: private-evidence-only
    severity: material
    topic: synthetic-fuel-unit-economics
    missingEvidence: >-
      Public or independently reviewed economics linking Valar's reactor heat to hydrogen and modified Fischer-Tropsch
