- id: mitigants-gaps-and-kill-criteria
  title: Mitigants, unresolved gaps, and kill criteria
  body: 'Valar is not a zero-mitigation story. It has already accumulated several real de-riskers: DOE sponsorship, cold-criticality data, Utah physical progress, active community outreach, and a strengthening federal fuel agenda. Proposed Part 57 could eventually make later microreactor licensing more standardized, and DOE''s HALEU spending may improve fuel availability over time. Those are important positives, but they are system-level mitigants, not company-level closure. The public record still lacks the documents an investor would need to turn high ambition into an investable underwrite: a reconciled product roadmap from pilot to commercial unit, a project-specific fuel allocation or enrichment contract, a waste-handling strategy, signed offtake economics, a detailed commercial NRC path, and more transparent governance ownership over safety and execution.


    That makes the kill criteria unusually clear. If Valar misses the at-power validation sequence after winning cold-criticality headlines, if fuel and waste pathways remain abstract through 2027, or if financing continues to outrun customer proof, the downside is not just schedule delay; it is collapse of the commercialization case. Conversely, if the company discloses a credible fuel path, demonstrates hot operations and repeatability, and lands bankable offtake before another narrative-driven repricing, the current risk stack would compress materially. Until then, the correct posture is not categorical dismissal, but disciplined skepticism with explicit milestone gating.'
