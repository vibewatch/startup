- id: reactor-fuel-and-waste-readiness
  title: Reactor, fuel, and waste readiness
  body: 'The technical record is meaningful but incomplete. Project NOVA gives Valar a real milestone: cold criticality under DOE and NNSA oversight with LANL and NCERC support. That matters because it validates physics, supports core modeling, and provides a better evidence base than slideware alone. But independent coverage is consistent that this is still a partial milestone. New Scientist says the real proof points remain controlled power operations, sustained temperature performance, materials behavior over time, and evidence that regulators and customers can trust the design under routine operation. Valar''s own materials admit that NOVA data still need to inform helium-loop conditioning and temperature ramp-up protocols, which means some of the hardest engineering work sits after the headline milestone.


    Fuel and waste deepen that gap. Reuters and DOE both say HALEU supply is still limited, and DOE''s large 2026 enrichment awards show the supply chain is being built, not finished. NRC materials likewise make clear that fuel-cycle facilities and spent-fuel storage remain tightly regulated, site-specific, and operationally burdensome. AP adds the key downside detail: officials had not yet resolved how reactor waste would ultimately be disposed of. That does not prove Valar cannot solve fuel or waste. It does prove those issues are still live dependencies rather than closed workstreams. Investors should therefore treat cold criticality as technical de-risking, not as proof that Valar has already crossed the fuel, backend, and at-power validation hurdles needed for commercial confidence.'
