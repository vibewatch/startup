- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - At-power validation risk
    - Utah operating milestone
    - No disclosed hot-operation progress or design-temperature data after cold-criticality phase
    - Move from track to avoid until reactor proves more than core physics
  - - Fuel supply risk
    - Project-specific fuel disclosure
    - No clear HALEU / NNSS allocation or alternative fuel path before next major test phase
    - Assume schedule-right and raise required return
  - - Commercial licensing risk
    - NRC path disclosure
    - No credible pre-application or commercial-license schedule by 2027 despite continued pilot progress
    - Treat DOE pilot as insufficient for underwriting long-term revenue
  - - Waste / backend risk
    - Disposition plan
    - No documented interim-storage or permanent-disposal pathway before fueled operations expand
    - Do not underwrite broad deployment claims
  - - Commercialization risk
    - Offtake evidence
    - No signed pilot economics, PPA, or comparable customer contract before another large financing event
    - Assume valuation is still narrative-led and avoid price-insensitive entry
  - - Governance / reputation risk
    - Control-building response
    - No visible strengthening of board, safety governance, or disclosure after controversies
    - Haircut confidence and counterparty-conversion assumptions
  - - Financing risk
    - Capital raised versus proof gained
    - Large new round occurs without parallel technical and customer proof
    - Interpret as dilution of evidence quality, not just extension of runway
  notes: The triggers are intentionally concrete and falsifiable so the investment call can change on evidence instead of on generalized optimism or sector enthusiasm.
