  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: Detailed terms for the 2026 financing stack, including any debt covenants, maturity profile, security package, and milestone conditions.
    whyItMatters: Headline fundraising does not reveal whether Valar can absorb schedule slippage without punitive refinancing or operational constraints.
    diligencePath: Request term sheets, debt agreements, board materials approving the financing, and management sensitivity cases under delayed commercialization.
    relatedQuestionRefs:
    - QR021
    - QR027
    relatedTableRefs:
    - TR005
  - type: missing-source
    severity: material
    topic: fuel-allocation
    missingEvidence: Project-specific HALEU or other nuclear-fuel supply allocation naming Valar, quantities, delivery windows, and fallback options.
    whyItMatters: System-level DOE funding does not prove Valar can actually fuel Ward 250 or later commercial systems on management timelines.
    diligencePath: Request supply contracts, DOE allocation correspondence, enrichment or fabrication counterparties, and transport-readiness documentation.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR002
    - TR005
  - type: private-evidence-only
    severity: material
    topic: waste-plan
    missingEvidence: A concrete spent-fuel handling, interim-storage, reprocessing, or permanent-disposal pathway for Ward 250 and future commercial units.
    whyItMatters: Waste uncertainty can derail public trust, site acceptance, and later licensing even if reactor physics performs well.
    diligencePath: Request backend fuel-cycle memo, state or federal counterparties, storage design assumptions, and expected licensing handoffs.
