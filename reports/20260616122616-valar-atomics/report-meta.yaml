companyProfile:
  summary: >-
    Valar Atomics is a private advanced-nuclear startup founded in 2023 and building high-temperature gas reactors around
    a behind-the-meter “gigasite” model for AI data centers, industrial heat, hydrogen, and synthetic fuels. Public
    evidence shows unusually fast technical and financing momentum—seed funding in early 2025, a $130 million Series A
    in late 2025, and a reported $450 million financing at a $2 billion valuation in March 2026—plus DOE-backed testing
    in Nevada and Utah. Even so, revenue, contract economics, full governance disclosure, and the long-run commercial
    licensing path remain materially under-disclosed.
  foundedDate: '2023-07-04'
  founders:
    - name: Isaiah Taylor
      role: Founder and CEO
      background: Self-taught software engineer and repeat founder whose public story ties Valar's mission to family Manhattan Project lineage through Ward Schaap.
      claimRefs:
        - CO001
        - CO017
  foundingLocation: Los Angeles metro, California
  headquarters: Los Angeles metro (El Segundo / Hawthorne), California
  productSummary: >-
    Valar is developing helium-cooled, graphite-moderated, TRISO-fueled high-temperature gas reactors intended to be
    mass-manufactured and deployed in clusters at off-grid or grid-constrained industrial campuses.
  customerFocus: Hyperscale and AI data centers, industrial heat users, hydrogen projects, synthetic-fuel production, and other large behind-the-meter power users.
  businessModel: >-
    Capital-intensive project and deployment model built around standardized reactor fleets and colocated power / heat /
    fuel production rather than conventional utility-grid sales.
  stage: Series B private company
  fundingStatus: >-
    Public sources report a $450 million March/April 2026 financing at a $2 billion valuation, including $340 million of
    equity and $110 million of debt, after a $130 million Series A in December 2025; total-raised figures remain
    inconsistent across public trackers.
