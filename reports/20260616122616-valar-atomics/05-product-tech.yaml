company:
  name: Valar Atomics
chapter:
  number: 5
  title: Product & Technology
  summary: 'Valar Atomics has progressed beyond pure concept: Ward Zero gives it a full-temperature non-nuclear surrogate, Project NOVA has reached zero-power criticality under federal oversight, and Ward250 is the first integrated powered reactor attempt. The architecture is legible—HTGR principles with TRISO fuel, graphite moderation, helium cooling, and a product thesis tied to data-center power, industrial heat, hydrogen, and synthetic fuels—but many system-level details remain undisclosed. The chapter’s core judgment is that Valar’s product story is technically serious yet still constrained by open questions around integrated hot operation, output rating consistency, HALEU logistics, software validation, and commercialization-grade safety evidence.'
sections:
- id: product-definition-and-program-stack
  title: Product Definition and Program Stack
  body: 'Valar is not presenting a single utility-style reactor sale. Its public materials define a broader grid-independent energy platform built around standardized reactors colocated with large loads or process users. The first-order jobs to be done are reliable power for data centers, high-grade process heat for heavy industry, hydrogen via sulfur-iodine chemistry, and eventually synthetic hydrocarbon fuels via a modified Fischer-Tropsch chain. That framing matters because it pushes the company into a product stack, not just a core-physics problem: Valar must prove the reactor, the heat-transfer system, the conversion layer, the site model, and the operating model together.


    The public maturity ladder is also unusually legible. Ward Zero is the thermal surrogate; Project NOVA is the neutronics proof point; Ward250 is the first integrated powered reactor; and gigasites are the scale thesis beyond that. This is a sensible engineering progression on paper because it decomposes risk into thermal-system checks, zero-power core validation, and only then an integrated plant startup. But the same sequence also highlights what remains missing today: there is still no public heat-balance package, no commercial product specification, and no disclosed evidence that the downstream hydrogen or fuels layers have moved beyond conceptual process claims. The product story is coherent, but the customer-ready SKU definition is still thin.'
