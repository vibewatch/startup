  - - Synthetic-fuel pathway
    - Aviation, logistics, defense fuel buyers
    - Conceptual product layer tied to hydrogen output
    - Links high-temp nuclear heat to carbon-neutral hydrocarbon fuels
    - Need conversion chain, carbon-source cost, and plant layout
