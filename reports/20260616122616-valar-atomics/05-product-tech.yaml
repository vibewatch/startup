  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: ward250-scale
    missingEvidence: A single source-controlled specification sheet stating Ward250 thermal output, net electric output, and the rating basis used in public statements.
    whyItMatters: Output rating changes the addressable use cases, cooling requirements, capital intensity, and whether the test unit should be read as a research reactor or a commercial microreactor precursor.
    diligencePath: Request the latest Ward250 design datasheet and compare it with the DOE pilot submission, transport manifest, and any Utah site safety basis.
    relatedQuestionRefs:
    - QE008
  - type: private-evidence-only
    severity: material
    topic: balance-of-plant
    missingEvidence: Heat-balance diagrams, primary-to-secondary loop design, turbomachinery selection, and net electric efficiency for each product mode.
    whyItMatters: Without balance-of-plant detail, investors cannot evaluate conversion efficiency, thermal losses, parasitic load, or whether hydrogen and fuels are plausible at stated temperatures.
    diligencePath: Request a current process-flow diagram, heat-and-mass balance, and preliminary design review package for Ward250 and the first commercial site.
    relatedQuestionRefs:
    - QE011
    - QE025
  - type: private-evidence-only
    severity: material
    topic: software-modeling
    missingEvidence: Validation methodology, benchmark set, uncertainty bounds, and architecture documentation for Valar’s proprietary software stack.
    whyItMatters: The software claim is part of the argument for speed, but model accuracy is mission-critical when fuel geometry, reactivity control, and thermal margins are still being proven.
    diligencePath: Request internal model-validation reports tying Ward Zero and NOVA data back to code predictions and error bands.
    relatedQuestionRefs:
    - QE012
    - QE025
  - type: missing-source
    severity: material
    topic: waste-disposal
    missingEvidence: A documented end-to-end waste plan covering transport with fuel loaded, spent-fuel custody, interim storage, and final disposition.
    whyItMatters: Waste and transport obligations shape siting risk, public acceptance, regulator posture, and total lifecycle cost.
    diligencePath: Request the DOE/NRC interfaces, spent-fuel assumptions, and post-irradiation logistics plan for Ward250 and later gigasites.
    relatedQuestionRefs:
    - QE021
    - QE025
  - type: stale
    severity: material
    topic: haleu-allocation-to-valar
    missingEvidence: Current evidence that Valar itself has firm HALEU allocation, fabrication slots, transport packages, and delivery dates tied to Ward250.
    whyItMatters: HALEU bottlenecks can shift a promising reactor schedule even when the reactor physics are sound.
    diligencePath: Request fuel-supply contracts, DOE allocation letters, and any linked transportation or fabrication milestones.
    relatedQuestionRefs:
    - QE018
    - QE019
    - QE024
  - type: missing-source
    severity: minor
    topic: commercial-licensing-path
    missingEvidence: A current commercialization roadmap showing the transition from DOE-authorized testing to NRC-licensed routine operation.
    whyItMatters: Investors need to know whether Ward250 is just a pilot artifact or a clean bridge to revenue-grade deployments.
    diligencePath: Request the licensing strategy memo, NRC engagement plan, and planned timing of Part 50/52/57 or equivalent filings.
    relatedQuestionRefs:
    - QE020
    - QE022
