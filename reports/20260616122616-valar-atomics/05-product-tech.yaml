callouts:
- calloutType: strength
  title: 'Best evidence today: a deliberate validation ladder'
  body: Valar’s strongest technical signal is not a finished commercial reactor but a credible progression from thermal surrogate to zero-power criticality to integrated test reactor. That sequence is more defensible than skipping straight from slides to a commercial module.
  claimRefs:
  - CE004
  - CE006
  - CE020
  - CE039
- calloutType: risk
  title: The Ward250 rating conflict is not cosmetic
  body: The unresolved public conflict between 100-kWt and 5-MW descriptions affects customer fit, transport assumptions, shielding, balance-of-plant design, and capital intensity. It is one of the highest-priority product-tech diligence requests.
  claimRefs:
  - CE011
  - CE012
  - CE013
- calloutType: risk
  title: Fuel logistics and licensing may outrun reactor physics as the critical path
  body: DOE and NRC materials show that HALEU availability, transport, benchmarking, and future licensing are still ecosystem bottlenecks. Even if Ward250 physics are sound, commercialization can still slip on fuel and regulatory infrastructure.
