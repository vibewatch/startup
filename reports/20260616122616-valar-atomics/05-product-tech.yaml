      detail: Ward Zero provides a non-nuclear, full-temperature surrogate that lets Valar test many thermal systems before fueled startup.
      modules:
      - Ward Zero surrogate core
      - Silicon-carbide heating elements
      - Instrumentation and thermal-system checks
    - label: Neutronics validation layer
      detail: Project NOVA verifies Ward250-like fuel, moderator, and reactivity-control assumptions at zero power under federal oversight.
      modules:
      - NOVA sub-assembly
      - NCERC critical assembly
      - Model-to-test comparison
    - label: Integrated reactor layer
      detail: Ward250 is the first powered integrated plant intended to combine core, coolant, controls, and site systems at Utah scale.
