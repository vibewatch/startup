- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Named dependency
  - Key risk
  rows:
  - - HALEU TRISO fuel
    - Produces fission heat with high-temperature-tolerant particles
    - Domestic HALEU enrichment, fuel fabrication, transport packaging
    - Fuel availability and transport benchmarks remain immature at commercial scale
  - - Graphite-moderated core
    - Slows neutrons and structures the core geometry
    - Validated neutronics data from NOVA / NCERC
    - Ward250 performance depends on scale-up from sub-assembly to full reactor
  - - Helium coolant loop
    - Transfers core heat while avoiding boiling-water behavior
    - Compressors, heat exchangers, seals, turbomachinery
    - Public loop architecture and parasitic load are undisclosed
  - - Boron-carbide reactivity control
    - Shapes shutdown and control behavior in NOVA/Ward-class core
    - Core design models and control-element manufacturing
    - Publicly visible only at physics-test level, not integrated plant operation
  - - Ward Zero silicon-carbide heated surrogate
    - Exercises thermal systems without fuel
    - Heater reliability, instrumentation, temperature limits
    - No public runtime or failure-mode data
  - - Product-conversion layer
    - Turns reactor heat into power, hydrogen, or fuels
    - Turbomachinery, sulfur-iodine process, Fischer-Tropsch process
    - No published process-flow diagrams or delivered-output data
  - - Software / simulation stack
    - Supports core design and model validation
    - Ward Zero + NOVA data, internal codebase, engineers
    - No public benchmark set or uncertainty disclosure
  - - Site assembly and operations
    - Moves modules from factory and builds Utah test site
    - Kiewit, Goree, Sprung, DOE, Utah site readiness
    - Execution schedule compressed by construction and approval dependencies
  notes: Rows mix reactor physics, thermal systems, software, and site execution because Valar’s product only works if all layers mature together.
