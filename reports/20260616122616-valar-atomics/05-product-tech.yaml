- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Valar solution
  - Measurable benefit claimed
  - Current limitation
  rows:
  - - AI or data-center operator needs firm power
    - Procure grid power plus backup, then wait on interconnection or utility buildout
    - Colocated Ward-class reactors inside a gigasite
    - 24/7 clean-firm power without depending on the broad grid
    - No public PPA structure, uptime data, or demonstrated commercial operation
  - - Industrial heat user needs high-grade process heat
    - Burn fossil fuels or electrify with expensive grid upgrades
    - HTGR heat colocated with industrial campus
    - High-temperature heat above standard LWR range
    - No public heat-rate, exchanger, or materials data
  - - Hydrogen producer wants lower-carbon H2
    - Electrolysis or fossil reforming with carbon penalty
    - Thermochemical sulfur-iodine process driven by reactor heat
    - Potentially cheaper hydrogen if high-temperature assumptions hold
    - No public pilot throughput, cost curve, or offtake
  - - Fuel buyer wants low-carbon hydrocarbons
    - Buy petroleum-derived fuels or premium SAF alternatives
    - Modified Fischer-Tropsch route using nuclear hydrogen plus captured CO2
    - Potential drop-in fuels if chemistry and cost close
    - No public process package or product-spec data
  - - Defense or remote site needs resilient portable power
    - Truck diesel or wait for grid extension
    - Transportable microreactor hardware moved by military cargo aircraft
    - Shows logistical portability and strategic relevance
    - Transport with fuel, safety basis, and disposal path remain unresolved
  notes: Benefits are company-claimed or policy-claimed; limitations are the unresolved public engineering details that keep the use cases from underwriting cleanly.
