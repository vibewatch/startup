      - Primary loop
      - Site assembly / shielding
    - label: Product-conversion layer
      detail: Commercial value depends on downstream conversion from high-temperature heat into electricity, hydrogen, and synthetic fuels.
      modules:
      - Data-center power
      - Industrial heat
      - Sulfur-iodine hydrogen
      - Modified Fischer-Tropsch fuels
