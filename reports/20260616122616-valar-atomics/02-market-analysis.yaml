- id: sizing-lenses
  title: 'Sizing lenses: a large power problem, but not a clean Valar-specific TAM'
  body: 'No retained source cleanly publishes a Valar-specific TAM, SAM, or SOM, so the market has to be triangulated through adjacent demand pools and reactor-procurement bands. The broadest independent lens is IEA’s outlook for electricity supplied to data centres, which rises from 460 TWh in 2024 to more than 1,000 TWh in 2030 in the base case, with nuclear becoming more important later in the decade. Valar’s own homepage is much narrower and more promotional, claiming AI models will require more than 200 TWh of additional grid power by 2030. EIA’s crypto-mining analysis offers a useful analog for how quickly electricity-intensive compute loads can become system-relevant: 25-91 TWh annually in the United States, or 0.6%-2.3% of national demand, with operators gravitating toward cheap power, direct generation links, and demand-response programs. TNW adds a capital-markets lens by citing Goldman Sachs on 85-90 GW of eventual new nuclear capacity needed for the AI gap.


    Those figures are meaningful because they establish the problem size, but they do not prove that Valar can capture a proportional share. The nearer-term commercial wedge is better understood through buyer-facing deployment blocks and channel structure: Kairos is selling 50 MW to the TVA grid for Google-linked demand, X-energy markets 80 MWe modules and 320 MWe four-packs with industrial steam, and TerraPower’s Natrium sits in a 345-500 MW regional-grid band. That evidence suggests public markets currently disclose the scarcity problem and the likely procurement sizes far better than they disclose a Valar-specific addressable market. Any hard SAM or SOM number would therefore be an estimate, not a public fact.'
