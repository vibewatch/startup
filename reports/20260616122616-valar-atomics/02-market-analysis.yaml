  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: buyer-budgets
    missingEvidence: Customer-level budget authority and contracting structure by vertical, especially whether data-center, hydrogen, and industrial-heat deals sit in separate capex pools or in one integrated energy budget.
    whyItMatters: Valar’s market boundary is clear at the product level, but buyer-budget ownership determines sales-cycle length, procurement friction, and which segment can scale first.
    diligencePath: Ask management for anonymized pipeline examples showing buyer, payer, contracting entity, and whether the sale is electricity-only, heat-plus-power, or fuels-linked.
    relatedQuestionRefs:
    - QM004
  - type: missing-source
    severity: material
    topic: fuel-readiness
    missingEvidence: Valar-specific TRISO fabrication, HALEU sourcing, enrichment timing, and contingency planning for pilot-to-commercial scale-up.
    whyItMatters: Peer materials show fuel and manufacturing readiness are commercialization gates, but the public record does not show Valar’s binding supply position.
    diligencePath: Request fuel-supply memoranda, supplier names, enrichment assumptions, inventory timing, and sensitivity analysis for delays in commercial fuel availability.
    relatedQuestionRefs:
    - QM015
  - type: missing-source
    severity: material
    topic: sam-som-sizing
