- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - AI and data-center load growth
    - Positive
    - Near term
    - Creates urgency for clean-firm supply near constrained campuses
    - Ask for Valar-specific pipeline by campus size and region
  - - Industrial heat + power versatility
    - Positive
    - Medium term
    - Expands addressable budgets beyond electricity-only buyers
    - Ask which verticals have signed thermal offtake interest
  - - Site-cost amortization / standardization
    - Positive
    - Medium term
    - Core to Valar margin story if many units can share one campus
    - Ask for modeled capex and opex differences between single unit and gigasite
  - - Fuel manufacturing readiness
    - Negative
    - Near to medium term
    - TRISO and enriched-fuel availability can delay commercialization
    - Ask for Valar fuel supply agreements, inventory plan, and fallback assumptions
  - - Pilot licensing acceleration
    - Positive
    - Near term
    - DOE path can shorten time to first criticality for test reactors
    - Ask what pilot milestones must convert into NRC-licensable commercial assets
  - - Regulatory controversy
    - Negative
    - Near term
    - Criticism of bypassing NRC may raise political or insurance friction
    - Ask how Valar plans to manage safety assurance and public acceptance
  - - FOAK capital burden
    - Negative
    - Persistent
    - Developer still bears design, build, operate, and decommissioning costs
    - Ask for project finance structure, debt assumptions, and risk-sharing terms
  - - Crowded advanced-nuclear field
    - Negative
    - Persistent
    - Capital, talent, and buyer attention are contested across many vendors
    - Ask how Valar differentiates by deployment speed, heat profile, and contracting model
  notes: The chapter treats drivers and constraints symmetrically because adoption depends on execution, not just market need.
