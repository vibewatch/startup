- id: milestones-programs-and-scale-up
  title: Milestones, Programs, and Scale-up Path
  body: 'The company’s milestone sequence is unusually compressed for advanced nuclear. Official materials describe Ward Zero as the non-nuclear thermal prototype in Los Angeles, followed by Utah construction for Ward 250, selection into the DOE’s accelerated pilot framework, and Project NOVA’s zero-power criticality milestone at Los Alamos-operated NCERC in Nevada on November 17, 2025. Public reporting then shows a February 2026 C-17 airlift from California to Hill Air Force Base and onward transport to the Utah San Rafael Energy Research Lab, plus community outreach efforts in Emery County. These milestones matter because they create a coherent hardware-development narrative rather than a pure slideware story. Even so, important ambiguities remain in the public record: some sources describe Ward 250 as a 5-megawatt reactor while others describe a 100-kWt unit, suggesting either different power-rating conventions, different stages, or incomplete public explanation. The company’s separate
    Philippines plan and NRC lawsuit further show that Valar is pursuing multiple regulatory routes in parallel rather than relying on a single licensing path.'
