  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board roster, board-observer list, and material investor control-rights summary.
    whyItMatters: Governance influence cannot be assessed from financing headlines alone, especially after rapid repricing and board additions.
    diligencePath: Request the latest board deck cover page, cap table summary, and financing term sheet excerpts from management.
    relatedQuestionRefs:
    - QO007
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: An official employee count and org breakdown by California, Utah, and any international operations.
    whyItMatters: Public vendor estimates and job boards are directionally useful but too weak for benchmarking execution capacity or burn.
    diligencePath: Request an HR census and hiring plan snapshot tied to the current budget.
    relatedQuestionRefs:
    - QO018
    - QO025
  - type: missing-source
    severity: material
    topic: headquarters
    missingEvidence: A primary-source statement of legal headquarters and principal operating office.
    whyItMatters: Public media and hiring surfaces use El Segundo and Hawthorne interchangeably, which muddies later diligence on permits, leases, and local talent concentration.
    diligencePath: Request certificate-of-incorporation details, principal-office address, and any headquarters press boilerplate the company considers canonical.
    relatedQuestionRefs:
    - QO002
    - QO025
  - type: private-evidence-only
    severity: material
    topic: commercialization
    missingEvidence: Revenue, customer commitments, and any signed offtake or power purchase agreements beyond pilot-program support.
    whyItMatters: The valuation story is currently capital- and policy-driven; without customer economics it is difficult to underwrite commercial readiness.
    diligencePath: Request pipeline by customer stage, term sheets, and projected revenue bridge from pilot to commercial deployment.
    relatedQuestionRefs:
    - QO019
    - QO020
    - QO025
  - type: conflicting-data
    severity: material
    topic: reactor-rating
    missingEvidence: A reconciled explanation of Ward One and Ward 250 power ratings and whether quoted figures are thermal, electric, prototype-specific, or journalistic shorthand.
    whyItMatters: Reactor-size ambiguity affects technoeconomics, siting expectations, and later comparisons with competing microreactor programs.
    diligencePath: Request a one-page reactor family specification sheet with named design variants and units clearly marked.
    relatedQuestionRefs:
    - QO024
    - QO025
    relatedTableRefs:
    - TO001
    - TO004
