- id: capitalization-and-stakeholders
  title: Capitalization, Investor Base, and Strategic Stakeholders
  body: 'Valar’s capital formation has accelerated sharply. TechCrunch reported a $19 million seed round when the company emerged from stealth in February 2025, led by Riot Ventures with AlleyCorp, Initialized Capital, Day One Ventures, and Steel Atlas participating. Los Angeles Times later reported a $130 million Series A led by Snowpoint Ventures with Day One and Dream as co-leads, while Bloomberg reported a March 2026 financing that valued the company at $2 billion and brought in $450 million total, including $340 million in equity and $110 million in debt. Tracxn’s funding ledger broadly corroborates a four-round capital stack but not every syndicate detail. The investor set is strategically notable: it blends climate/deep-tech seed firms with defense-tech names such as Palmer Luckey, Shyam Sankar, and Doug Philippone. That syndicate gives Valar both capital and political-network access, but it also deepens dependence on a narrow cluster of founder-led, policy-connected backers rather
    than on disclosed long-horizon utilities or industrial offtakers.'
