callouts:
- calloutType: strength
  title: Hardware progress is unusually fast for a private advanced-nuclear startup
  body: Valar is not just telling a financing story. Across Ward Zero, Project NOVA, Utah construction, and the C-17 airlift, the company has produced a visible sequence of physical milestones that many peer reactor startups have not yet matched in public.
  claimRefs:
  - CO008
  - CO009
  - CO010
  - CO030
- calloutType: risk
  title: Policy acceleration and company narrative are tightly coupled
  body: The company’s public timetable, valuation narrative, and site progress are deeply intertwined with the Trump-era DOE pilot framework and a July 4, 2026 milestone. That can accelerate learning, but it also concentrates execution risk in one politically salient schedule.
  claimRefs:
  - CO012
  - CO037
  - CO038
  - CO040
- calloutType: insight
  title: The operating footprint is broader than the headline “El Segundo startup” label
  body: Public references simplify Valar as an El Segundo startup, but diligence should treat it as a Los Angeles metro engineering company with a Hawthorne hiring base, a Utah test campus, Nevada lab work, and a still-relevant Philippines pathway.
