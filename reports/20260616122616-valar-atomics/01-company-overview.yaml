company:
  name: Valar Atomics
chapter:
  number: 1
  title: Company Overview
  summary: Valar Atomics is a 2023-founded private advanced-fission startup building high-temperature gas reactors for "gigasites" serving data centers, industrial heat, hydrogen, and synthetic fuels. Public evidence shows a rapid arc from a $19 million stealth seed round in February 2025 to a $130 million Series A in late 2025 and a reported $450 million financing at a $2 billion valuation in March 2026, alongside DOE-backed testing in Nevada and Utah. The company has assembled notable nuclear and defense-tech backers, but its public record still shows material gaps around exact headquarters, full board composition, reactor power-rating disclosures, and the commercial path beyond the politically accelerated DOE pilot timetable.
sections:
- id: identity-and-product
  title: Identity, Product, and Operating Footprint
  body: 'Valar Atomics was founded in 2023 and presents itself as a private advanced nuclear company building high-temperature gas reactors around a "gigasite" deployment model rather than the conventional utility-grid plant model. Across its homepage, mission, technology, and Ward 250 materials, the company consistently describes TRISO-fueled, helium-cooled, graphite-moderated reactor designs aimed at grid-independent use cases: data center power, industrial heat, hydrogen production, and synthetic fuels. Public third-party coverage consistently describes the company as El Segundo-based, while current hiring surfaces show a substantial Hawthorne, California footprint and active Orangeville, Utah roles. That means the operating footprint is clear, but the precise public headquarters label is not. The most defensible framing for later chapters is Los Angeles metro headquarters with a Utah test-site expansion. Valar also emphasizes that it is not trying to sell power into the traditional grid
    first; rather, it wants colocated industrial campuses with many standardized reactors, using high process heat as a differentiator against light-water reactor incumbents.'
