- id: risks-controversies-and-gaps
  title: Risks, Controversies, and Evidence Gaps
  body: 'The main company-overview risks are not subtle. First, Valar’s current credibility is tightly linked to a politically accelerated DOE pilot structure and a July 4, 2026 milestone that even sympathetic observers describe as aggressive. Second, revenue, customer count, margin profile, and signed commercial power contracts are not publicly disclosed in the reviewed evidence, so valuation discussions remain largely narrative-driven. Third, adverse reporting raises questions about investor reputational exposure, founder judgment, and the prominence of close associates without equivalent nuclear credentials. Fourth, the public reactor-rating narrative is not fully reconciled: official lawsuit language, Utah construction reporting, and later airlift coverage use materially different size descriptions. Finally, headquarters, board composition, and governance rights are under-disclosed relative to the amount of capital raised. These are all manageable in diligence if later chapters can validate
    technology, customer demand, and commercialization timelines; for now they remain central open items rather than edge-case footnotes.'
