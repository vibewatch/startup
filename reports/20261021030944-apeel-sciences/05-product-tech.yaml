      severity: material
      topic: performance-validation
      missingEvidence: >-
        Independent crop-level coating efficacy, RipeTrack accuracy, calibration,
        uptime, and customer outcome distributions with denominators.
      whyItMatters: >-
        Issuer claims do not establish performance consistency, implementation
        economics, or reproducibility across crops, sites, and customer cohorts.
      diligencePath: >-
        Obtain blinded validation reports, benchmark protocols, site-level cohorts,
        instrument calibration records, incident logs, and customer reference calls.
      relatedQuestionRefs: [QE004, QE005, QE009]
      relatedTableRefs: [TE001, TE002, TE003]
