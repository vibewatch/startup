    title: "Customer journey and evidence checkpoints"
    type: "journey-map"
    summary: "Apeel's adoption path crosses packing operations, logistics, retail quality, and renewal checkpoints, with public proof weakening after initial deployment."
    data:
      nodes:
        - label: "1. Crop and account selection"
          detail: "Apeel targets produce categories and B2B supply-chain accounts; crop-level opportunity and payer economics are not public."
          touchpoints: ["Supplier commercial team", "Produce category owner"]
        - label: "2. Packing-house onboarding"
          detail: "Application must fit operating equipment and labor; public commentary identifies implementation cost as a barrier."
          touchpoints: ["Packing line", "Quality operations"]
        - label: "3. Treatment and measurement"
          detail: "Coatings address moisture loss and oxidation, while RipeTrack supports digital ripeness measurement."
          touchpoints: ["Coating application", "RipeTrack inspection"]
        - label: "4. Distribution and receiving"
          detail: "Suppliers, distributors, and retailer quality teams use freshness and ripeness information for shipping and receiving decisions."
          touchpoints: ["Logistics handoff", "Retail receiving"]
        - label: "5. Shelf outcome"
          detail: "Historical company-reported evidence cites shrink reduction and higher dollar sales, but current customer-level results are unavailable."
          touchpoints: ["Merchandising", "Shrink review"]
        - label: "6. Renewal and expansion"
          detail: "The public record does not disclose renewal, cohort expansion, contract length, or concentration by customer."
          touchpoints: ["Contract review", "Crop or geography expansion"]
    approximationNotes: "Qualitative sequence only; stages are not proportional, and no conversion rate or common population is implied."
    claimRefs: [CU002, CU006, CU009, CU012, CU013, CU014, CU015]
