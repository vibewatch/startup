company:
  name: "Apeel Sciences"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    Apeel addresses a multi-party produce supply chain spanning packers, suppliers,
    distributors, and grocery retailers, but public adoption proof is uneven. Historical
    named deployments and company-issued trial signals support commercial relevance, while
    current retention, contract, expansion, and concentration metrics remain undisclosed.
sections:
  - id: "customer-segments-and-buyers"
    title: "Customer segments and buying centers"
    body: >-
      Apeel's commercial surface is B2B rather than a direct consumer sale: growers and
      packing houses operate post-harvest processes, suppliers and distributors manage
      quality through transit, and grocery retailers care about shrink, shelf quality, and
      merchandising. Industry research identifies growers, processors, distributors, and
      retailers as buyers of edible-coating solutions, while an independent private-market
      profile describes Apeel's revenue model as product sales. The official product surface
      remains organized around produce categories, ingredients, benefits, and impact, which
      is consistent with crop-specific selling rather than a single horizontal software
      contract. A 2024 offer of free coating services to delayed produce suppliers provides a
      concrete supplier-facing use case, but it does not disclose whether those suppliers
      later became paying customers or how economics differ by crop, geography, or channel.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: "adoption-and-named-proof"
    title: "Adoption trajectory and named proof"
    body: >-
      The strongest named proof in the allocated evidence is historical. A third-party
      database records 2018 commercialization of Apeel-coated avocados at Costco and Harps
      Food Stores, a 2020 company-reported average of 50% lower retail shrink and 5% to 10%
      higher dollar sales, and a 2021 network of more than 30 suppliers and retailers across
      eight countries that included an expansion relationship with AM Fresh. These milestones
      demonstrate that Apeel moved beyond laboratory validation, but they do not establish
      current production volumes, contract duration, renewal, or customer-level revenue.
      RipeTrack adds a newer adoption surface: a 2023 company announcement described initial
      trials with retailers and produce distributors. A later secondary report says roughly
      70% of the business is now in Europe, the Middle East, and Africa, signaling geographic
      repositioning but not independently verified account depth.
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU010]
    tableRefs: [TU002, TU003]
  - id: "durability-expansion-and-friction"
    title: "Durability, expansion, and customer friction"
    body: >-
      Public evidence does not support a conventional retention analysis. None of the retained
      sources discloses NRR, GRR, logo churn, renewal rates, contract length, cohort behavior,
      or top-customer revenue concentration. There is, however, evidence that implementation
      and trust can affect durability. An independent article reports that misinformation led
      some major retailers and suppliers to pause relationships or decline planned agreements.
      The same article relays the founder's claim that a redesigned formulation reduced
      application expense tenfold and enabled a strategic shift from retailer-led selling to
      suppliers, while a separate industry blog identifies upfront application equipment and
      process investment as a barrier for smaller operators. This suggests that expansion
      depends on fitting existing packing-house workflows and rebuilding channel trust, but the
      magnitude and persistence of either effect remain unquantified.
    claimRefs: [CU011, CU012, CU013, CU014]
    figureRefs: [FU001]
  - id: "underwriting-implications"
    title: "Underwriting implications"
    body: >-
      The customer thesis should therefore be treated as commercially demonstrated but not
      retention-validated. Historical retailer launches, an identified citrus distributor,
      supplier-facing services, and reported RipeTrack trials show several routes into the
      produce chain. Yet the freshest geographic-mix claim comes through secondary reporting,
      and the reviewed evidence does not identify a current roster of paying production
      customers. Before underwriting durable growth, diligence should obtain customer-level
      revenue by crop and geography, signed contract terms, production-versus-pilot status,
      cohort renewals, and proof that deployment savings accrue to the paying party. Until
      those records are available, logo history should not be treated as proof of current
      retention or expansion.
    claimRefs: [CU004, CU008, CU009, CU010, CU014, CU015]
