  topStrengths:
    - 差异化的植物来源涂层方案仍在商业化运营，RipeTrack 的质量测量工具也构成补充。
    - 据报道，重新设计的配方适配现有包装厂设备，并大幅降低施用成本，但仍需客户验证。
    - 历史上的零售部署和据报道已形成的国际业务基础，说明其商业价值不止于实验室开发。
  topRisks:
    - 据报道，员工规模已从约 450 人收缩至约 50 人，美国零售业务也基本丧失；组织能力和恢复风险因此上升。
    - 当前现金、烧钱速度、现金跑道、债务条款、资本结构，以及 2021 年之后任何有定价融资，均尚未验证。
    - 客户留存、合同期限、客户集中度、按作物划分的单位经济模型和按产品划分的毛利率均未披露。
    - 伙伴信任、标签争议、落地证据，以及据报道集中于欧洲、中东和非洲的业务布局，都会增加执行风险。
  unresolvedGaps:
    - 当前完全稀释后的股权结构表、清算优先权、债务契约，以及 2021 年之后任何融资的原始文件。
    - 经审计的 2024—2026 年财务报表、当前现金、月度烧钱速度、现金跑道、营运资本，以及按产品和地区划分的毛利率。
    - 按作物和地区划分的客户收入、集中度、合同期限、留存、扩张，以及量产相对于试点的状态。
    - 对涂层效果、施用成本、吞吐量、可靠性和 RipeTrack 准确度进行独立的实地验证。
    - 完整的董事会和管理层记录、按司法辖区开展的监管与标签审查，以及尚未解决的诉讼或合规义务。
