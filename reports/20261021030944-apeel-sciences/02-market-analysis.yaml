figures:
  - id: FM001
    title: Evidence ladder from broad need to Apeel's measurable served wedge
    type: pyramid
    summary: >-
      Six nested diligence layers show where public evidence narrows from the broad
      food-waste problem to Apeel's observable crops, geographies, buyers, and business mix.
    data:
      items:
        - label: Broad food-waste problem
          value: "Not sized from retained evidence"
          detail: "A demand driver, not a valid proxy for Apeel TAM."
        - label: Post-harvest fresh-produce preservation
          value: "Core market boundary"
          detail: "Coatings, quality measurement, and related handling workflows."
        - label: Named current coating categories
          value: "6"
          detail: "Avocados, limes, mandarins, oranges, lemons, and grapefruit."
        - label: Reported unrestricted-country permissions
          value: "9 countries"
          detail: "Permission is not the same as commercialization or revenue."
        - label: Historical commercial network
          value: "30+ relationships across 8 countries"
          detail: "A 2021 reach indicator, not a current customer count."
        - label: Reported current geographic mix
          value: "Roughly 70% EMEA"
          detail: "The article does not define whether business means revenue, volume, customers, or contracts."
    approximationNotes: "Conceptual evidence ladder, not an area-scaled TAM/SAM/SOM pyramid; values retain their original periods and denominators."
    claimRefs: [CM003, CM004, CM011, CM016]
callouts:
  - calloutType: risk
    title: Dollar market size remains unproven
    body: >-
      No retained source provides a bounded TAM, SAM, or SOM with price, eligible
      throughput, adoption, and geography assumptions. Underwriting should use customer
      contracts and crop-level unit economics rather than a generic food-waste estimate.
    claimRefs: [CM003, CM004, CM016]
  - calloutType: insight
    title: Integration cost is a gating variable
    body: >-
      Reported redesigns reduced application expense and enabled existing packing-house
      equipment, but the claim needs customer-level validation before it can support a
      faster adoption curve.
    claimRefs: [CM009, CM010]
