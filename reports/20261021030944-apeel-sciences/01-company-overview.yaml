company:
  name: "Apeel Sciences"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Apeel Sciences is a privately held Goleta food-technology company founded in 2012
    around plant-derived produce protection and now also offering ripeness-measurement
    tools. Public evidence shows a $2 billion August 2021 priced-round valuation and
    subsequent operating contraction, but current revenue, customer count, governance,
    cap table, and financing terms are not publicly supportable from the assigned evidence.
sections:
  - id: "identity-and-business-model"
    title: "Identity and business model"
    body: >-
      Apeel Sciences was founded in 2012 by James Rogers and is headquartered in
      Goleta, California. The company remains private and sells into the produce supply
      chain rather than operating as a consumer packaged-goods brand. Its core proposition
      is to apply a thin layer made from plant-derived ingredients to fresh produce to
      reinforce the natural peel, slow moisture loss and oxidation, and preserve quality
      for longer. The current product footprint extends beyond coatings: the 2023
      RipeTrack launch added measurement tools and cloud software for suppliers,
      distributors, and grocery retailers. This combination makes Apeel a business-to-
      business post-harvest technology provider whose value depends on measurable shrink
      reduction, quality consistency, and low-friction deployment at supplier facilities,
      not simply consumer awareness of the Apeel label.
    claimRefs: [CO001, CO002, CO003, CO012]
    tableRefs: [TO001]
  - id: "capital-and-stakeholders"
    title: "Capital history and stakeholder exposure"
    body: >-
      The last publicly identified priced round in the assigned evidence is the August
      2021 Series E: Multiples reports a $250 million raise led by Temasek at a $2 billion
      valuation. That valuation is historical, not a current mark. Public databases also
      disagree on cumulative funding, with Multiples reporting $640 million and EquityZen
      reporting $647 million; neither figure establishes cash available today, and the
      difference should be reconciled against the cap table and closing documents.
      Investors including Temasek, GIC, Viking Global Investors, Andreessen Horowitz, and
      Upfront Ventures are economically important, while suppliers and packing houses are
      operationally important because implementation occurs in their workflows. Existing
      shareholders may also create secondary supply through private-market platforms, but
      such availability does not establish a company-approved valuation or current
      financing terms.
    claimRefs: [CO005, CO006, CO007, CO008, CO014, CO016]
    tableRefs: [TO003]
  - id: "leadership-and-operating-reset"
    title: "Leadership and operating reset"
    body: >-
      James Rogers remains the founder most closely associated with Apeel's origin and
      technical narrative. EquityZen currently lists Luiz Beling as chief executive and
      Angelika Torres as chief financial officer, but the assigned public evidence does
      not provide a complete board roster or independently verified executive-change
      chronology. The operating footprint has contracted sharply: an independent article
      reports about 450 employees at the 2021 peak, approximately 50 employees today, and
      significant layoffs in 2022. The same account says the original coating deployment
      required specialized equipment, dedicated staff, and complex supplier-site
      installation; Rogers says a redesign cut application expense tenfold. This is a
      material reset from venture-scale expansion toward leaner supplier-led deployment,
      but the cost reduction remains a founder claim rather than independently audited
      unit economics.
    claimRefs: [CO001, CO004, CO009, CO010, CO014]
    tableRefs: [TO002]
  - id: "milestones-scale-and-open-questions"
    title: "Milestones, current scale, and unresolved diligence"
    body: >-
      Apeel's public chronology runs from its 2012 founding through seed and venture
      financing, 2018 retail commercialization, the 2021 valuation peak, 2022 layoffs,
      and the 2023 RipeTrack launch. A 2024 offer of free coating services during the
      East Coast port disruption indicates continued engagement with produce suppliers.
      The current geographic mix is also different from the U.S.-centric growth story:
      the adverse account says Europe, the Middle East, and Africa now represent roughly
      70% of business. That proportion is third-party reported and lacks a disclosed
      revenue denominator. No assigned source establishes current revenue, recurring
      revenue, customer count, official headcount, gross margin, cash burn, runway,
      board composition, ownership rights, or a post-2021 priced financing. Those fields
      should remain unavailable until management provides dated operating reports,
      customer schedules, audited financials, and capitalization records.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO013, CO015, CO016]
    figureRefs: [FO001]
