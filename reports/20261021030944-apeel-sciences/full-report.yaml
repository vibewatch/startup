        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The retained evidence cannot support a dollar TAM, SAM, or SOM without false precision. It does, however,
              establish several operating lenses. Apeel's current product page names six produce categories, while a
              secondary source describes broader regulatory permission across nine named countries and category-specific
              permission in several European markets. A historical market-data page reports more than 30 supplier and
              retailer relationships across eight countries by 2021, but that is an old reach indicator rather than a
              current customer count. A newer report says Europe, the Middle East, and Africa account for roughly 70% of
              the business. These measures use different denominators and vintages, so they should not be combined into
              a synthetic market value or conversion funnel.
            claimRefs:
              - CM003
              - CM004
              - CM011
              - CM016
