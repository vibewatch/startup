      - number: '3.4'
        title: The moat is broader, but trust and proof remain fragile
        blocks:
          - type: paragraph
            body: >-
              Apeel's portfolio breadth creates a plausible data-and-workflow moat: coatings can affect shelf life,
              while RipeTrack can inform shipping, receiving, and merchandising. Public evidence does not show whether
              those products share proprietary data advantages, bundle economically, or produce customer retention. The
              adverse record is material. Independent reporting says the company fell from about 450 employees at its
