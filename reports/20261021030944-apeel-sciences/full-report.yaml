  - id: FM001
    title: Evidence ladder from broad need to Apeel's measurable served wedge
    type: pyramid
    summary: >-
      Six nested diligence layers show where public evidence narrows from the broad food-waste problem to Apeel's
      observable crops, geographies, buyers, and business mix.
    data:
      items:
        - label: Broad food-waste problem
          value: Not sized from retained evidence
          detail: A demand driver, not a valid proxy for Apeel TAM.
        - label: Post-harvest fresh-produce preservation
          value: Core market boundary
          detail: Coatings, quality measurement, and related handling workflows.
        - label: Named current coating categories
          value: '6'
          detail: Avocados, limes, mandarins, oranges, lemons, and grapefruit.
        - label: Reported unrestricted-country permissions
          value: 9 countries
          detail: Permission is not the same as commercialization or revenue.
        - label: Historical commercial network
          value: 30+ relationships across 8 countries
          detail: A 2021 reach indicator, not a current customer count.
        - label: Reported current geographic mix
          value: Roughly 70% EMEA
          detail: The article does not define whether business means revenue, volume, customers, or contracts.
    approximationNotes: >-
      Conceptual evidence ladder, not an area-scaled TAM/SAM/SOM pyramid; values retain their original periods and
      denominators.
    claimRefs:
      - CM003
      - CM004
      - CM011
      - CM016
  - id: FP001
    title: Competitive positioning by strength of retained public evidence
    type: quadrant
    summary: >-
      The map scores evidence coverage, not product performance: Apeel's current workflow and RipeTrack are described in
      more implementation detail than incumbent substitute classes.
    xAxisLabel: Implementation-fit evidence (1=category mention, 3=explicit workflow evidence)
    yAxisLabel: Capability-scope evidence (1=category only, 3=multi-function detail)
    data:
      points:
        - label: Apeel current coating
          x: 3
          'y': 2
          detail: Existing-equipment fit is reported; preservation mechanism is described.
        - label: Apeel original workflow
          x: 3
          'y': 2
          detail: Specialized equipment, staffing, and installation burden are described.
        - label: RipeTrack
          x: 3
          'y': 3
          detail: Measurement, cloud sharing, logistics, and merchandising uses are described.
        - label: Traditional waxes
          x: 1
          'y': 1
          detail: Named as a substitute class without vendor-level implementation evidence.
        - label: Plastic packaging
          x: 1
          'y': 1
          detail: Named as a substitute class without comparative implementation evidence.
        - label: Post-harvest fungicides
          x: 1
          'y': 1
          detail: Named as a substitute class without product-level efficacy or workflow evidence.
    approximationNotes: >-
      Ordinal 1-3 scores encode only the specificity of the retained public evidence: 1=category mention, 2=mechanism or
      bounded scope, 3=explicit workflow and multi-function detail. They are not efficacy, price, or market-share
      scores.
    claimRefs:
      - CP003
      - CP004
      - CP005
      - CP009
      - CP011
      - CP012
      - CP016
