  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Apeel's addressable market is the post-harvest handling of fresh produce, with two evidenced solution
              families: edible surface coatings that slow water loss and oxidation, and measurement software and devices
              that help supply-chain operators assess ripeness and quality. The economic buyer is therefore a produce
              supplier, distributor, or retailer managing shrink, specifications, logistics, or merchandising, not the
              consumer who ultimately eats the produce. This boundary excludes the much broader value of all food waste
              and the full cold-chain, packaging, crop-protection, and fresh-food retail markets. Relevant substitutes
              include traditional waxes, fungicides and other post-harvest treatments, refrigeration, plastic packaging,
              manual quality inspection, and accepting a higher level of spoilage as the status quo.
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
              - CM007
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
              - CM007
              - CM012
