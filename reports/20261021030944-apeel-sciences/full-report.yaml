      - number: '2.3'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The coating sale is a B2B operating purchase: suppliers or packing houses apply the treatment,
              distributors carry the inventory benefit, and retailers can capture lower shrink or improved shelf
              quality. RipeTrack broadens the workflow from treatment to measurement by digitizing quality inspections
              during ripening, shipping, and receiving and aggregating results for operational decisions. Adoption
              therefore depends on more than consumer demand for sustainability. A supplier must see compatibility with
              existing lines, manageable application cost, reliable crop-level performance, and acceptance by downstream
              retail buyers. Retailers can help create demand, but the reported shift from retailer-led selling toward
              suppliers makes packing-house economics and integration the more immediate budget test.
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
