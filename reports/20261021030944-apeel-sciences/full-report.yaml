  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The evidence chain moves from a stale primary mark through conflicting updates and operating contraction to an
      evidence-gated research-more decision.
    data:
      nodes:
        - id: mark-2021
          label: 2021 primary mark
          detail: Multiples.vc reports a $2B Series E valuation.
        - id: financing-conflict
          label: Financing conflict
          detail: Public sources report $640M, $647M, and $800M total funding, plus an uncorroborated 2025 financing account.
        - id: commercial-reset
          label: Commercial reset
          detail: Reports describe a near-zero U.S. business and a severe workforce contraction.
        - id: international-optionality
          label: International base
          detail: Agroempresario reports about 70% of business in Europe, the Middle East, and Africa.
        - id: product-optionality
          label: Product optionality
          detail: Company-issued materials describe RipeTrack and broader supply-chain tools.
        - id: decision
          label: Research more
          detail: Require private financial and capitalization evidence before assigning price.
    approximationNotes: Ordered logic only; node order does not imply magnitude, probability, or a numerical conversion rate.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV008
      - CV009
      - CV010
      - CV012
      - CV016
