chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Apeel Sciences was founded in 2012 by James Rogers and is headquartered in Goleta, California. The company
              remains private and sells into the produce supply chain rather than operating as a consumer packaged-goods
              brand. Its core proposition is to apply a thin layer made from plant-derived ingredients to fresh produce
              to reinforce the natural peel, slow moisture loss and oxidation, and preserve quality for longer. The
              current product footprint extends beyond coatings: the 2023 RipeTrack launch added measurement tools and
              cloud software for suppliers, distributors, and grocery retailers. This combination makes Apeel a
              business-to- business post-harvest technology provider whose value depends on measurable shrink reduction,
              quality consistency, and low-friction deployment at supplier facilities, not simply consumer awareness of
              the Apeel label.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO012
