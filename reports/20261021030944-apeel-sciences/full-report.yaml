  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Apeel's described stack links formulations and application operations to produce measurement and software-assisted
      quality decisions.
    data:
      layers:
        - label: Formulations
          detail: Product chemistry applied after harvest
          items:
            - label: Produce coating
              detail: Edible barrier intended to slow moisture loss and oxidation
            - label: Zero MI candidate
              detail: Reported treatment in preparation for fungal infection in citrus and avocados
        - label: Application operations
          detail: Supplier and packing-house execution
          items:
            - label: Existing-line application
              detail: Newer formulation reportedly works with existing packing-house equipment
            - label: Coating services
              detail: Operational service offered during port-delay spoilage risk
        - label: Quality measurement
          detail: Non-destructive inspection of produce attributes
          items:
            - label: Durometer
              detail: Firmness measurement with an issuer-attributed accuracy claim
            - label: Advanced imaging
              detail: Announced path to dry matter, Brix, and color assessment
        - label: Data capture
          detail: Digitized collection and aggregation of inspection results
          items:
            - label: Program dashboard
              detail: Aggregates inspection data across supplier or retailer operations
            - label: Shared inspection records
              detail: Makes ripening, shipping, and receiving measurements available for analysis
        - label: Decision outputs
          detail: Software-assisted produce quality decisions
          items:
            - label: AI ripe-date estimate
              detail: Uses origin, pack date, and measurement inputs to inform logistics and merchandising
            - label: Specification monitoring
              detail: Supports assessment of whether produce meets ripeness or freshness goals
        - label: Service and support
          detail: Operational delivery around the product workflow
          items:
            - label: Supplier enablement
              detail: Newer application model is described as compatible with existing equipment
            - label: Disruption response
              detail: Coating services were offered for shipments exposed to port-delay spoilage risk
    approximationNotes: >-
      The layer sequence is analytical; it does not assert Apeel's internal system boundaries, interfaces, or production
      readiness.
    claimRefs:
      - CE002
      - CE005
      - CE009
      - CE011
      - CE012
      - CE013
      - CE014
  - id: FU001
    title: Customer journey and evidence checkpoints
    type: journey-map
    summary: >-
      Apeel's adoption path crosses packing operations, logistics, retail quality, and renewal checkpoints, with public
      proof weakening after initial deployment.
    data:
      nodes:
        - label: 1. Crop and account selection
          detail: >-
            Apeel targets produce categories and B2B supply-chain accounts; crop-level opportunity and payer economics
            are not public.
          touchpoints:
            - Supplier commercial team
            - Produce category owner
        - label: 2. Packing-house onboarding
          detail: >-
            Application must fit operating equipment and labor; public commentary identifies implementation cost as a
            barrier.
          touchpoints:
            - Packing line
            - Quality operations
        - label: 3. Treatment and measurement
          detail: Coatings address moisture loss and oxidation, while RipeTrack supports digital ripeness measurement.
          touchpoints:
            - Coating application
            - RipeTrack inspection
        - label: 4. Distribution and receiving
          detail: >-
            Suppliers, distributors, and retailer quality teams use freshness and ripeness information for shipping and
            receiving decisions.
          touchpoints:
            - Logistics handoff
            - Retail receiving
        - label: 5. Shelf outcome
          detail: >-
            Historical company-reported evidence cites shrink reduction and higher dollar sales, but current
            customer-level results are unavailable.
          touchpoints:
            - Merchandising
            - Shrink review
        - label: 6. Renewal and expansion
          detail: >-
            The public record does not disclose renewal, cohort expansion, contract length, or concentration by
            customer.
          touchpoints:
            - Contract review
            - Crop or geography expansion
    approximationNotes: Qualitative sequence only; stages are not proportional, and no conversion rate or common population is implied.
    claimRefs:
      - CU002
      - CU006
      - CU009
      - CU012
      - CU013
      - CU014
      - CU015
