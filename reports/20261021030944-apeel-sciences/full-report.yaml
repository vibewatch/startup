      - number: '5.4'
        title: Trust, safety, and technical diligence
        blocks:
          - type: paragraph
            body: >-
              Apeel's official product page says its food-grade ingredients are tested for human consumption, and a
              company statement carried by The Packer listed mono- and diglycerides, baking soda, and citric acid among
              product ingredients. That is issuer evidence, not independent certification of each formulation, claim, or
              market authorization. Trust is commercially consequential: a federal labeling proposal targeted produce
              coatings, and The Packer reported that Jimbo's would not carry produce treated with Apeel or Organipeel.
              The assigned evidence contains no public security or privacy documentation for RipeTrack, no status
              history, no API or integration documentation, and no current regulator record for Zero MI. Diligence
              should therefore separate ingredient disclosure from formulation-specific safety, labeling, cybersecurity,
              quality-system, and launch-readiness proof.
            claimRefs:
              - CE003
              - CE006
              - CE007
              - CE008
              - CE011
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Deployment and software controls remain unverified
            body: >-
              Public sources describe a lower-friction coating deployment and a digitized quality workflow, but they do
              not disclose site economics, uptime, security, privacy, API, calibration, or independent accuracy
              evidence.
            calloutType: risk
            claimRefs:
              - CE004
              - CE005
              - CE010
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying centers
        blocks:
          - type: paragraph
            body: >-
              Apeel's commercial surface is B2B rather than a direct consumer sale: growers and packing houses operate
              post-harvest processes, suppliers and distributors manage quality through transit, and grocery retailers
              care about shrink, shelf quality, and merchandising. Industry research identifies growers, processors,
              distributors, and retailers as buyers of edible-coating solutions, while an independent private-market
              profile describes Apeel's revenue model as product sales. The official product surface remains organized
              around produce categories, ingredients, benefits, and impact, which is consistent with crop-specific
              selling rather than a single horizontal software contract. A 2024 offer of free coating services to
              delayed produce suppliers provides a concrete supplier-facing use case, but it does not disclose whether
              those suppliers later became paying customers or how economics differ by crop, geography, or channel.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU009
              - CU013
      - number: '6.2'
        title: Adoption trajectory and named proof
        blocks:
          - type: paragraph
            body: >-
              The strongest named proof in the allocated evidence is historical. A third-party database records 2018
              commercialization of Apeel-coated avocados at Costco and Harps Food Stores, a 2020 company-reported
              average of 50% lower retail shrink and 5% to 10% higher dollar sales, and a 2021 network of more than 30
              suppliers and retailers across eight countries that included an expansion relationship with AM Fresh.
              These milestones demonstrate that Apeel moved beyond laboratory validation, but they do not establish
              current production volumes, contract duration, renewal, or customer-level revenue. RipeTrack adds a newer
              adoption surface: a 2023 company announcement described initial trials with retailers and produce
              distributors. A later secondary report says roughly 70% of the business is now in Europe, the Middle East,
              and Africa, signaling geographic repositioning but not independently verified account depth.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU009
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU005
              - CU008
              - CU011
      - number: '6.3'
        title: Durability, expansion, and customer friction
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not support a conventional retention analysis. None of the retained sources discloses
              NRR, GRR, logo churn, renewal rates, contract length, cohort behavior, or top-customer revenue
              concentration. There is, however, evidence that implementation and trust can affect durability. An
              independent article reports that misinformation led some major retailers and suppliers to pause
              relationships or decline planned agreements. The same article relays the founder's claim that a redesigned
              formulation reduced application expense tenfold and enabled a strategic shift from retailer-led selling to
              suppliers, while a separate industry blog identifies upfront application equipment and process investment
              as a barrier for smaller operators. This suggests that expansion depends on fitting existing packing-house
              workflows and rebuilding channel trust, but the magnitude and persistence of either effect remain
              unquantified.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU006
              - CU009
              - CU012
              - CU013
              - CU014
              - CU015
      - number: '6.4'
        title: Underwriting implications
        blocks:
          - type: paragraph
            body: >-
              The customer thesis should therefore be treated as commercially demonstrated but not retention-validated.
              Historical retailer launches, an identified citrus distributor, supplier-facing services, and reported
              RipeTrack trials show several routes into the produce chain. Yet the freshest geographic-mix claim comes
              through secondary reporting, and the reviewed evidence does not identify a current roster of paying
              production customers. Before underwriting durable growth, diligence should obtain customer-level revenue
              by crop and geography, signed contract terms, production-versus-pilot status, cohort renewals, and proof
              that deployment savings accrue to the paying party. Until those records are available, logo history should
              not be treated as proof of current retention or expansion.
            claimRefs:
              - CU004
              - CU008
              - CU009
              - CU010
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure is manageable but not closed
        blocks:
          - type: paragraph
            body: >-
              The public record does not show a regulator finding that Apeel's current coating is unsafe. A
              low-reputation secondary source reports that FDA had no questions about the company's GRAS conclusion
              under intended conditions, while also noting that the response did not evaluate one statutory compliance
              provision. That distinction matters: non-objection is not the same as a broad regulatory endorsement or
              continuing post-market assurance. Labeling remains a live political and commercial issue because H.R. 4737
              prompted a company response in 2025. Apeel says its products comply with existing labeling rules and that
              Organipeel is no longer sold, but these are company-issued assertions. Legal diligence should therefore
              verify the GRAS notices, labeling practices by jurisdiction, pending-bill status, and the settled critic
              litigation from primary records before treating the exposure as fully mitigated.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR009
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR009
      - number: '7.2'
        title: The redesigned operating model still lacks independent proof at scale
        blocks:
          - type: paragraph
            body: >-
              Execution risk is elevated by the gap between the company's historical footprint and its current operating
              base. Independent reporting says headcount fell from roughly 450 at the 2021 peak to about 50, after
              significant 2022 layoffs. The same account says the original coating deployment required specialized
              equipment, dedicated staff, and complex supplier-site installation; founder-attributed claims put the
              redesigned application's cost at one-tenth of the prior level. That redesign is directionally important,
              but no retained source provides audited cost, reliability, throughput, or multi-crop failure-rate data.
              RipeTrack adds a software and instrumentation layer, yet its accuracy and trial feedback in the retained
              article come from Apeel executives. Investment approval should require cohort-level implementation
              economics and service-quality evidence rather than treating product announcements as operating validation.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR011
              - CR012
      - number: '7.3'
        title: Partner concentration and financing opacity compound execution risk
        blocks:
          - type: paragraph
            body: >-
              Apeel's recovery depends on supplier adoption and restored trust. Third-party reporting says a
              misinformation campaign caused some retailers and suppliers to pause or decline relationships, and
              attributes roughly 70% of current business to Europe, the Middle East, and Africa. This creates a dual
              dependency on a concentrated region and on counterparties willing to install or operate Apeel-enabled
              processes. Public financing data do not resolve the capacity question: EquityZen displays $647 million of
              total funding, while Multiples reports $640 million across seven rounds and identifies the August 2021
              Series E as the latest completed round. Funding raised is not cash available, and neither source discloses
              burn, runway, debt covenants, working capital, or current capitalization. Those missing data prevent a
              reliable liquidity assessment and should be treated as a material diligence gap.
            claimRefs:
              - CR010
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR008
              - CR010
              - CR016
      - number: '7.4'
        title: Monitoring priorities and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The highest-priority monitor is whether the smaller organization can convert the redesigned deployment
              model into repeatable supplier economics without renewed partner attrition. The thesis should be paused if
              primary legal review finds noncompliance with applicable coating or labeling rules, if validated field
              data fail to support the claimed implementation-cost improvement, or if material partners again halt
              programs because of trust or performance concerns. A second trigger is liquidity: investors should not
              underwrite continued expansion until management supplies current cash, burn, runway, debt, and
              capitalization data reconciled to bank statements and board materials. A third trigger is concentration:
              the case weakens if geographic or counterparty diversification does not improve while the company attempts
              to support coatings, RipeTrack, and additional post-harvest products with its reduced workforce.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR010
              - CR013
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR010
              - CR011
              - CR013
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital raised is not liquidity
            body: >-
              The retained market-data pages disagree on cumulative funding and do not disclose current cash, burn,
              runway, debt terms, or working-capital needs. Expansion should not be underwritten from historical
              financing totals.
            calloutType: risk
            claimRefs:
              - CR013
              - CR014
              - CR015
          - type: callout
            title: Require operating proof before investment approval
            body: >-
              Request primary regulatory files, customer-level retention and concentration, deployment economics,
              reliability data, and a board-approved liquidity plan. Failure to substantiate the claimed deployment
              redesign or current runway should pause the thesis.
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR008
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment call and pricing discipline
        blocks:
          - type: paragraph
            body: >-
              The public record does not support underwriting Apeel at a defensible current enterprise value.
              Multiples.vc anchors the last completed primary financing at a $2 billion valuation in August 2021 and
              reports $640 million raised, while EquityZen shows $647 million and TBPN Digest reports $800 million.
              A4BEE goes further, reporting a 2025 Series F at $4.2 billion and a separate debt refinancing, but the
              assigned evidence contains no primary financing document that reconciles those claims. Funding raised is
              not cash available, and none of these sources establishes present cash, burn, preferences, dilution, or
              fully diluted ownership. The resulting call is research-more, with low confidence, high risk, and a
              stretched-to-indeterminate valuation stance until a current cap table and audited financial package
              establish both price and downside protection.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV008
              - CV009
              - CV010
              - CV012
              - CV016
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Apeel still owns a differentiated post-harvest proposition and is broadening it with
              digital quality tools. Company-issued materials describe RipeTrack and the Apeel Leverage initiative,
              while Apeel's product page continues to position its coating as a food-grade barrier against water loss
              and oxidation. Agroempresario also reports that a redesigned formulation reduced application expense by a
              factor of ten and that roughly 70% of the business now comes from Europe, the Middle East, and Africa. The
              anti-thesis is more consequential for valuation: TBPN Digest reports that the U.S. retail business fell
              effectively to zero, and Agroempresario describes a severe workforce contraction. Those are
              commercialization and organizational-reset signals, not evidence of scalable economics.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: Scenarios and comparable context
        blocks:
          - type: paragraph
            body: >-
              A numerical bull/base/bear valuation would be false precision because the assigned public evidence does
              not disclose current revenue, gross margin, cash burn, debt terms, customer concentration, or
              capitalization. Multiples.vc lists Olam and Genus at very different last-fiscal-year revenue multiples,
              but those public companies have different business mixes, scale, profitability, and liquidity from Apeel;
              the figures are context, not a direct pricing formula. The bull case therefore requires verified
              profitable international growth and evidence that digital products add recurring, high-margin revenue. The
              base case treats the 2021 mark as stale and demands a material discount or contractual downside
              protection. The bear case assumes U.S. rebuilding stalls and avoids new exposure until liquidity and
              solvency are demonstrated.
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV010
              - CV012
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV010
              - CV012
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              EquityZen describes a potential secondary route for accredited investors and notes that eventual liquidity
              may come through an IPO, merger, acquisition, or an eligible Express Deal. That is evidence of a
              transaction channel, not evidence of dependable liquidity, price discovery, or exit readiness. A credible
              underwriting process should obtain the current fully diluted cap table, liquidation preferences, debt
              covenants, 2024-2026 audited financials, monthly cash burn, customer and geography concentration, and
              product-level retention. Thesis-break triggers should include failure to reconcile the financing record,
              inability to demonstrate adequate runway after debt obligations, continued loss of major customers, or
              proof that RipeTrack and other expansion products do not produce repeatable gross profit. Until those
              tests clear, price negotiation cannot substitute for diligence.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
              - CV014
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: No price without a reconciled capitalization record
            body: >-
              A 2021 private-round valuation, conflicting aggregate funding figures, and an uncorroborated later
              financing account cannot establish a current entry price. Require original financing documents and a fully
              diluted waterfall before negotiating valuation.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV016
          - type: callout
            title: Commercial recovery is the key thesis test
            body: >-
              International concentration and product expansion may preserve upside, but the reported collapse of the
              U.S. business and workforce reduction make customer recovery, retention, and gross profit the central
              underwriting tests.
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV016
