              relationships. Apeel's own FAQ now foregrounds corrections, apologies, legal documents, and fact checks,
              showing that trust defense has become a visible commercial function. Funding databases also conflict
              sharply on cumulative capital, reinforcing the need to verify scale and resilience directly rather than
              infer durability from historical financing.
