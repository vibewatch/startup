              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption drivers are spoilage reduction, longer logistics windows, more consistent retail
              specifications, and disruption resilience. Apeel's offer of free coating services during a port disruption
              illustrates the inventory-risk use case, while RipeTrack targets the information gap between supply-chain
              nodes. The constraints are equally material: an independent report says the original deployment required
              specialized equipment, dedicated staff, and complex installation, although a redesigned formulation
              reportedly cut application expense tenfold and works with existing packing-house equipment. Trust is
              another gating variable because misinformation reportedly caused counterparties to pause or decline
              engagements even as secondary reporting described regulator and expert support for ingredient safety.
              Valuation should therefore depend on verified crop-level unit economics, conversion, retention, and
              current customer concentration, none of which is disclosed in this evidence set.
            claimRefs:
              - CM009
              - CM010
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Dollar market size remains unproven
            body: >-
              No retained source provides a bounded TAM, SAM, or SOM with price, eligible throughput, adoption, and
              geography assumptions. Underwriting should use customer contracts and crop-level unit economics rather
              than a generic food-waste estimate.
            calloutType: risk
            claimRefs:
              - CM003
              - CM004
              - CM016
          - type: callout
            title: Integration cost is a gating variable
            body: >-
              Reported redesigns reduced application expense and enabled existing packing-house equipment, but the claim
              needs customer-level validation before it can support a faster adoption curve.
