callouts:
  - calloutType: risk
    title: Capital raised is not liquidity
    body: >-
      The retained market-data pages disagree on cumulative funding and do not disclose current cash,
      burn, runway, debt terms, or working-capital needs. Expansion should not be underwritten from
      historical financing totals.
    claimRefs: [CR013, CR014, CR015]
  - calloutType: recommendation
    title: Require operating proof before investment approval
    body: >-
      Request primary regulatory files, customer-level retention and concentration, deployment
      economics, reliability data, and a board-approved liquidity plan. Failure to substantiate the
      claimed deployment redesign or current runway should pause the thesis.
    claimRefs: [CR004, CR006, CR007, CR008, CR014]
