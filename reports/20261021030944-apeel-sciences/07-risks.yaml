        - Suppliers and retailers / revenue generation
        - Founder-attributed estimate of roughly 70% of business
        - Regional slowdown, regulation, or partner loss impairs most activity
        - High
        - Rebuild U.S. presence and diversify markets
        - Revenue denominator, customer count, and country mix are unavailable.
      - - Packing-house integration
        - Produce suppliers / application and quality control
        - Deployment historically required dedicated equipment and staff
        - Integration cost or process friction slows adoption
        - High
        - New formulation reportedly uses existing equipment
        - Independent cost, throughput, and reliability proof is missing.
      - - Retailer and supplier trust
        - Channel partners / acceptance and merchandising
        - Some relationships reportedly paused or did not proceed
        - Renewed misinformation or poor outcomes cause program cancellation
        - High
        - Corrections, litigation, labeling, and direct engagement
        - Current partner pipeline, churn, and concentration are private.
    notes: >-
      Concentration is based on a founder-attributed regional share reported by a third party; it is
      not audited revenue. Severity and residual-exposure labels are qualitative analyst assessments.
    claimRefs: [CR007, CR008, CR010, CR016]
