    title: Historical funding does not establish runway
    body: >-
      Third-party databases report $640 million and $647 million of historical
      funding under different aggregations. Neither amount establishes current
      cash, burn, debt burden, or financing capacity.
    claimRefs: [CI012, CI013, CI016]
