  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing-and-margin
      missingEvidence: >-
        Realized prices, discount schedules, contract terms, revenue mix,
        recognition policy, gross margin, CAC, sales cycle, and payback by
        offering and customer cohort.
      whyItMatters: >-
        Without these inputs, revenue quality, contribution economics, and the
        durability of the supplier-led commercial model cannot be underwritten.
      diligencePath: >-
        Review standard contracts, invoices, audited revenue schedules, cohort
        gross-margin reports, and sales-efficiency analyses in the data room.
      relatedQuestionRefs: [QI002, QI009]
      relatedTableRefs: [TI001, TI002, TI003]
    - type: private-evidence-only
      severity: material
      topic: capital-adequacy
      missingEvidence: >-
        Current cash, restricted cash, monthly burn, runway, debt and covenant
        schedule, working-capital needs, capex plan, next-round trigger, and
        planned use of funds.
      whyItMatters: >-
        Historical funding totals cannot establish liquidity or the probability
        and timing of another financing requirement.
      diligencePath: >-
        Obtain current bank statements, board-approved forecast, monthly cash
        bridge, debt documents, covenant calculations, and financing plan.
      relatedQuestionRefs: [QI010]
      relatedTableRefs: [TI003]
