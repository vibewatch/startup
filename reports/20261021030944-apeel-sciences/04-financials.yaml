schemaVersion: "report-v2"
artifact: financials
slug: apeel-sciences
runDate: "2026-10-21"
company:
  name: Apeel Sciences
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence identifies a B2B product-and-service model spanning coating
    consumables, deployment support, and produce-quality tools, but it does not
    disclose realized pricing, gross margin, cash, burn, or runway. The strongest
    recent operating account describes a much smaller company, a lower-cost
    application model, and a business concentrated outside the United States,
    leaving capital adequacy and revenue quality unverified.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      Apeel appears to monetize a B2B produce-preservation system rather than a
      single software subscription. A company-approved profile says revenue
      comes from edible coating powder, application equipment, and an onsite
      service team, while Multiples.vc classifies the model more broadly as B2B
      product sales. The current official product surface confirms an active
      post-harvest produce-protection offering, and a company announcement
      describes RipeTrack as measurement tools plus monitoring software for
      suppliers, distributors, and retailers. These sources establish product
      categories and delivery components, not contract structure: none of the
      retained pages states list price, realized price, minimum volume, software
      fee, service fee, discount schedule, or revenue-recognition policy.
    claimRefs: [CI001, CI002, CI009, CI010, CI016]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: delivery-economics
    title: Delivery cost and sales-efficiency proxies
    body: >-
      Delivery economics have reportedly changed materially. Agroempresario,
      summarizing AgFunderNews and founder James Rogers, says the original
      coating model required specialized equipment, dedicated staff, and complex
      installation at supplier facilities. The same account attributes to
      Rogers a redesigned formulation that can use existing packing-house
      equipment, cuts application expense by a factor of ten, and supports a
      shift from retailer-led selling toward suppliers. If validated, that
      redesign could reduce implementation friction and service intensity, but
      the tenfold figure is a founder claim rather than audited cost evidence.
      No retained source quantifies sales cycle, customer-acquisition cost,
      payback, utilization, churn, gross margin, working capital, or capex.
    claimRefs: [CI003, CI004, CI016]
    tableRefs: [TI003]
  - id: traction-and-capital
    title: Public traction and financing signals
    body: >-
      Public traction indicators are dated or incompletely defined. StartupTalky
      reports an estimated 2022 annual revenue of $88.1 million, but the page
      does not identify audited accounts or a revenue-recognition basis.
      Agroempresario reports about 50 employees today, says most revenue is
      outside the United States, and separately says Europe, the Middle East,
      and Africa represent roughly 70% of Apeel's business; “business” should
      not be converted into a revenue share without clarification. Historical
      financing databases also disagree: Multiples.vc reports $640 million
      raised across seven rounds, while EquityZen reports $647 million total
      funding. Company Overview provides the round chronology; for financial
      underwriting, neither historical total proves current cash availability.
    claimRefs: [CI005, CI006, CI007, CI011, CI012, CI013, CI014, CI016]
  - id: adequacy-and-verdict
    title: Capital adequacy and underwriting verdict
    body: >-
      The adverse operating record raises financing sensitivity. Agroempresario
      reports significant layoffs in 2022, an employment decline from roughly
      450 at the 2021 peak to about 50 today, and operational problems that
      predated the later misinformation campaign. That contraction may have
      lowered fixed cost, but the retained evidence cannot distinguish a
      completed efficiency reset from continuing financial stress. The public
      file contains no current cash balance, monthly burn, runway, debt schedule,
      project-finance obligation, covenant, next-round trigger, customer
      concentration, or cohort retention. The financial verdict is therefore
      cautious: product and delivery-model evidence is credible enough to map
      revenue levers, but revenue quality, margin durability, and capital
      adequacy remain private-evidence diligence blockers.
    claimRefs: [CI003, CI004, CI005, CI008, CI012, CI013, CI016]
tables:
  - id: TI001
    title: Revenue streams and evidence status
    columns:
      - Stream
      - Mechanism
      - Unit
      - Public status
      - Revenue quality
      - Diligence ask
    rows:
      - ["Edible coating powder", "Consumable product sale", "Not disclosed", "Reported as a revenue source; current official product offering is active", "Repeat potential depends on treated throughput and replenishment, neither disclosed", "Provide contracted volume, realized price per treatment unit, renewal behavior, and revenue recognition"]
      - ["Application equipment", "Equipment supplied with coating deployment", "Not disclosed", "Reported as part of the revenue model; newer formulation reportedly uses existing packing-house equipment", "Possible upfront revenue may decline as deployment becomes less equipment-intensive", "Separate equipment sale, lease, installation, and maintenance revenue by period"]
      - ["Onsite service team", "Implementation and operating support", "Not disclosed", "Reported as part of the revenue model; redesigned delivery reportedly lowers application expense", "Service intensity and attach rate are unknown", "Provide service gross margin, staffing ratio, utilization, and attach rate"]
      - ["RipeTrack", "Measurement tools and monitoring software", "Not disclosed", "Launch and user workflow are public; commercial terms are not", "Potential data or tool revenue is not separately reported", "Provide hardware, software, subscription, and bundled-revenue terms"]
    notes: >-
      Mechanisms are source-reported, but units, prices, mix, and recognition
      are not disclosed; no row should be read as audited segment revenue.
    claimRefs: [CI001, CI002, CI003, CI004, CI009, CI010, CI016]
  - id: TI002
    title: Pricing and monetization visibility
    columns:
      - Offering
      - Public price or contract evidence
      - List versus realized status
      - Underwriting implication
      - Diligence ask
    rows:
      - ["Coating products", "No monetary price in retained evidence", "Both list and realized price unavailable", "Volume, discounting, and price realization cannot be modeled", "Provide price schedules and invoice-level realized pricing by crop and region"]
      - ["Equipment and onsite service", "Revenue mechanism reported without fee terms", "Bundling and discount treatment unavailable", "Hardware and service economics cannot be separated", "Provide standard contract, service scope, installation fee, and discount policy"]
      - ["RipeTrack tools and software", "Product workflow public; commercial model absent", "List and realized pricing unavailable", "Software-like economics cannot be assumed", "Provide SKU structure, contract term, attach rate, and standalone versus bundled revenue"]
      - ["Port-strike supplier support", "Free coating services offered in October 2024", "Temporary event-specific offer, not recurring list pricing", "Shows promotional flexibility but does not establish normal price", "Quantify waived revenue, conversion, and whether free deployment recurs"]
    notes: >-
      This is a visibility assessment, not a price list; the sole explicit
      monetary term is a temporary free-service offer tied to a 2024 port strike.
    claimRefs: [CI001, CI010, CI015, CI016]
  - id: TI003
    title: Unit economics and capital-adequacy scorecard
    columns:
      - Metric
      - Public value or status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["2022 estimated annual revenue", "$88.1 million external estimate", "Low", "Provides a dated scale proxy, not audited current revenue", "Reconcile to audited 2022 revenue and provide 2023-2026 actuals"]
      - ["Application expense change", "Founder claims a tenfold reduction", "Medium-low", "Could improve deployment margin and reduce implementation friction", "Provide before-and-after cost per treated unit and cohort-level gross margin"]
      - ["Current employment", "About 50 employees in the adverse operating account", "Medium", "Indicates a sharply reduced fixed-cost base and operating footprint", "Provide current payroll, contractor use, function mix, and restructuring charges"]
      - ["Geographic business mix", "Roughly 70% in Europe, Middle East, and Africa", "Medium-low", "Signals geographic concentration but the denominator is described only as business", "Define denominator and provide revenue and gross profit by region"]
      - ["Historical funding", "$640 million across seven rounds versus EquityZen's $647 million total", "Medium-low", "Conflicting aggregation limits precision and says nothing about remaining liquidity", "Reconcile the cap table, debt, grants, secondaries, and primary proceeds"]
      - ["Gross margin", "Not disclosed", "Unavailable", "Core test of consumable, equipment, and service economics", "Provide gross margin by offering, crop, customer, and region"]
      - ["CAC, sales cycle, and payback", "Not disclosed", "Unavailable", "Required to assess sales efficiency and supplier-led GTM economics", "Provide cohort CAC, sales cycle, deployment cost, and contribution payback"]
      - ["Cash, burn, and runway", "Not disclosed", "Unavailable", "Determines financing dependency and next-round timing", "Provide cash balance, restricted cash, monthly burn, forecast, and runway"]
      - ["Working capital, capex, and debt obligations", "Not disclosed", "Unavailable", "May make reported revenue growth cash-consumptive", "Provide inventory days, receivables, capex plan, debt schedule, covenants, and project-finance commitments"]
    notes: >-
      Values preserve source periods and denominators. “Business” is not treated
      as revenue, funding raised is not cash available, and unavailable metrics
      are explicit diligence gaps rather than estimates.
    claimRefs: [CI003, CI004, CI005, CI007, CI011, CI012, CI013, CI014, CI016]
