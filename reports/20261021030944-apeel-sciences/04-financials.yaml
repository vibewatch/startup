          detail: Contracted crops and treated throughput are not publicly quantified.
        - id: coating-product
          label: Coating consumable
          detail: Coating powder is reported as a sold revenue component.
        - id: deployment
          label: Application deployment
          detail: Equipment and installation needs reportedly fell under the redesigned formulation.
        - id: services
          label: Onsite services
          detail: Service support is reported as part of the revenue model, with attach economics undisclosed.
        - id: quality-tools
          label: RipeTrack quality tools
          detail: Measurement hardware and monitoring software broaden the customer workflow.
        - id: gross-profit
          label: Revenue and gross profit
          detail: Realized pricing, mix, recognition, cost of delivery, and gross margin are unavailable.
    approximationNotes: >-
      Conceptual flow only; it contains no inferred values, conversion rates, or
      assumption that every customer buys every component.
    claimRefs: [CI001, CI003, CI004, CI009, CI010, CI016]
callouts:
