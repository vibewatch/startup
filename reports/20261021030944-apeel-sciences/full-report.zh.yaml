    yAxisLabel: 能力范围证据（1=仅品类，3=多功能细节）
    data:
      points:
        - label: Apeel 当前涂层
          x: 3
          'y': 2
          detail: 据报道可适配现有设备；文中描述了保鲜机制。
        - label: Apeel 原始工作流
          x: 3
          'y': 2
          detail: 文中描述了专用设备、人员和安装负担。
        - label: RipeTrack
          x: 3
          'y': 3
          detail: 文中描述了测量、云端共享、物流和商品陈列用途。
        - label: 传统蜡
          x: 1
          'y': 1
          detail: 被列为替代品类别，但没有供应商层面的实施证据。
        - label: 塑料包装
          x: 1
          'y': 1
          detail: 被列为替代品类别，但没有比较性实施证据。
        - label: 采后杀菌剂
          x: 1
          'y': 1
          detail: 被列为替代品类别，但没有产品层面的功效或工作流证据。
    approximationNotes: 序数 1-3 分仅表示留存公开证据的具体程度：1=品类提及，2=机制或限定范围，3=明确工作流和多功能细节。它们不是功效、价格或市场份额评分。
    claimRefs:
      - CP003
      - CP004
      - CP005
      - CP009
      - CP011
      - CP012
      - CP016
  - id: FI001
    title: 从农产品处理量到毛利的收入模型桥接
    type: flow
    summary: 公开证据勾勒出经营步骤，但价格、构成和毛利转化仍未披露。
    data:
      nodes:
        - id: supplier-volume
          label: 供应商农产品量
          detail: 合同约定的作物和处理量没有公开量化。
        - id: coating-product
          label: 涂层耗材
          detail: 据报道，涂层粉末是销售收入的一部分。
        - id: deployment
          label: 应用部署
          detail: 据报道，重新设计的配方降低了设备和安装需求。
        - id: services
          label: 现场服务
          detail: 据报道，服务支持属于收入模型的一部分，但附加销售经济性未披露。
        - id: quality-tools
          label: RipeTrack 质量工具
          detail: 测量硬件和监测软件拓展了客户工作流。
        - id: gross-profit
          label: 收入与毛利
          detail: 实际定价、构成、收入确认、交付成本和毛利率均不可得。
    approximationNotes: 仅为概念流程；不包含推导数值、转化率，也不假设每个客户都会购买所有组件。
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI009
      - CI010
      - CI016
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Apeel 所描述的技术栈，将配方和应用运营连接到农产品测量及软件辅助的质量决策。
    data:
      layers:
        - label: 配方
          detail: 采后应用的产品化学
          items:
            - label: 农产品涂层
              detail: 旨在减缓水分流失和氧化的可食用屏障
            - label: Zero MI 候选方案
              detail: 据报道，正准备用于柑橘和牛油果真菌感染的处理方案
        - label: 应用运营
          detail: 供应商与包装厂执行
          items:
            - label: 现有产线应用
              detail: 据报道，新配方可使用现有包装厂设备
            - label: 涂层服务
              detail: 港口延误造成腐败风险期间提供的运营服务
        - label: 质量测量
          detail: 对农产品属性的无损检测
          items:
            - label: 硬度计
              detail: 硬度测量；准确性由发布方声称
            - label: 高级成像
              detail: 已宣布的干物质、Brix 和颜色评估路径
        - label: 数据采集
          detail: 检查结果的数字化采集与汇总
          items:
            - label: 项目仪表板
              detail: 汇总供应商或零售商运营中的检查数据
            - label: 共享检查记录
              detail: 将成熟度、运输和收货测量结果用于分析
        - label: 决策输出
          detail: 软件辅助的农产品质量决策
          items:
            - label: AI 成熟日期估计
              detail: 使用产地、包装日期和测量输入，为物流和商品陈列提供依据
            - label: 规格监测
              detail: 支持评估农产品是否达到成熟度或新鲜度目标
        - label: 服务与支持
          detail: 围绕产品工作流的运营交付
          items:
            - label: 供应商赋能
              detail: 据描述，新应用模式兼容现有设备
            - label: 中断响应
              detail: 为面临港口延误腐败风险的货物提供涂层服务
    approximationNotes: 层级顺序是分析框架；不代表 Apeel 的内部系统边界、接口或生产就绪度。
    claimRefs:
      - CE002
      - CE005
      - CE009
      - CE011
      - CE012
      - CE013
      - CE014
  - id: FU001
    title: 客户旅程与证据检查点
    type: journey-map
    summary: Apeel 的采用路径横跨包装运营、物流、零售质量和续约检查点；初始部署后，公开证明逐渐减弱。
    data:
      nodes:
        - label: 1. 作物与账户选择
          detail: Apeel 瞄准农产品品类和 B2B 供应链账户；作物层面的机会和付款方经济性未公开。
          touchpoints:
            - Supplier commercial team
            - Produce category owner
        - label: 2. 包装厂接入
          detail: 应用必须适配运营设备和劳动力；公开评论将实施成本列为障碍。
          touchpoints:
            - Packing line
            - Quality operations
        - label: 3. 处理与测量
          detail: 涂层应对水分流失和氧化，RipeTrack 则支持数字化成熟度测量。
          touchpoints:
            - Coating application
            - RipeTrack inspection
        - label: 4. 配送与收货
          detail: 供应商、分销商和零售商质量团队利用新鲜度与成熟度信息作出运输和收货决策。
          touchpoints:
            - Logistics handoff
            - Retail receiving
        - label: 5. 货架结果
          detail: 历史公司报告证据提到损耗下降和销售额增加，但当前客户层面的结果不可得。
          touchpoints:
            - Merchandising
            - Shrink review
        - label: 6. 续约与扩张
          detail: 公开记录未披露续约、客户队列扩张、合同期限或客户集中度。
          touchpoints:
            - Contract review
            - Crop or geography expansion
    approximationNotes: 仅为定性顺序；各阶段不按比例表示，也不暗示转化率或共同总体。
    claimRefs:
      - CU002
      - CU006
      - CU009
      - CU012
      - CU013
      - CU014
      - CU015
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 基于留存证据，对四个投资判断风险簇的影响、可能性和缓释成熟度进行定性排序。
    data:
      columns:
        - 影响
        - 可能性
        - 缓释成熟度
      rows:
        - label: 监管 / 标签
          values:
            - 高
            - 中
            - 发展中
        - label: 产品安全证据
          values:
            - 高
            - 低至中
            - 部分建立
        - label: 运营规模
          values:
            - 高
            - 高
            - 部分重新设计
        - label: 测量可靠性
          values:
            - 中
            - 中
            - 试验阶段
        - label: 合作伙伴 / 声誉
          values:
            - 高
            - 高
            - 被动应对
        - label: 融资 / 流动性
          values:
            - 高
            - 中
            - 不透明
    approximationNotes: 类别是分析师的定性判断，不是测量得到的概率。由于公开融资历史无法证明当前现金或现金跑道，融资可能性最高定为中。
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR010
      - CR011
      - CR013
      - CR014
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 证据链从过时的新股估值，经由相互冲突的更新和经营收缩，走向以证据为门槛的继续研究决策。
    data:
      nodes:
        - id: mark-2021
          label: 2021 年新股估值
          detail: Multiples.vc 报道 Series E 估值为 $2B。
        - id: financing-conflict
          label: 融资冲突
          detail: 公开来源报告累计融资为 $640M、$647M 和 $800M，另有一笔未经佐证的 2025 年融资记录。
        - id: commercial-reset
          label: 商业重置
          detail: 报道描述了接近于零的美国业务和严重的员工规模收缩。
        - id: international-optionality
          label: 国际业务基础
          detail: Agroempresario 报道称，约 70% 的业务位于欧洲、中东和非洲。
        - id: product-optionality
          label: 产品期权价值
          detail: 公司材料介绍了 RipeTrack 和更广泛的供应链工具。
        - id: decision
          label: 继续研究
          detail: 在确定价格前，要求提供非公开财务和资本结构证据。
    approximationNotes: 仅表示逻辑顺序；节点顺序不代表规模、概率或数值转化率。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV008
      - CV009
      - CV010
      - CV012
      - CV016
