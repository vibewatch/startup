      - number: '1.3'
        title: 领导层与运营重置
        blocks:
          - type: paragraph
            body: >-
              James Rogers 仍是与 Apeel 起源及技术叙事联系最紧密的创始人。EquityZen 目前将 Luiz Beling 列为首席执行官、Angelika Torres
              列为首席财务官，但现有公开证据没有提供完整的董事会名单，也没有独立核实的高管变动时间线。运营规模已大幅收缩：一篇独立报道显示，2021 年峰值约有 450 名员工，如今约 50 名，且 2022
              年曾大幅裁员。同一报道称，早期涂层部署需要专用设备、专职人员和复杂的供应商现场安装；Rogers
              表示重新设计后应用成本降低了十倍。这是从风险投资规模扩张转向更精简、由供应商主导部署的一次重大重置，但降本仍是创始人说法，并非独立审计的单位经济性。
