      - number: '3.3'
        title: 公开定价缺失，切换成本证据不一
        blocks:
          - type: paragraph
            body: >-
              已审阅来源均未披露标价、实际价格、合同期限、最低用量、设备融资或 RipeTrack 套装方案。这一缺口使真实的单位价格比较无法进行，也无法仅凭公开数据对 ROI
              主张作投资判断。部署证据说明了切换成本为何重要：早期涂层模式把专用设备、实验室或其他设施嵌入供应商现场，而重新设计则意在适配已安装的包装厂设备。更容易采用应降低买方摩擦，但如果竞争处理方案也能使用同一生产线，锁定效应可能随之减弱。据报道销售主导方从零售商转向供应商，而当前业务约
              70% 集中在欧洲、中东和非洲，也说明渠道进入和区域信任至少与化学配方同样重要。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP008
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
