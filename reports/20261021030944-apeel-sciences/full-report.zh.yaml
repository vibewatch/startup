      - number: '3.4'
        title: 护城河更宽，但信任与证明仍脆弱
        blocks:
          - type: paragraph
            body: >-
              Apeel 的产品组合广度构成了一个合理的数据与工作流护城河：涂层可以影响货架期，RipeTrack
              则可以影响运输、收货和陈列。公开证据没有说明这些产品是否共享专有数据优势、能否在经济上打包销售，或能否提高生鲜客户留存。不利记录具有实质影响。独立报道称，公司员工数从 2021 年峰值约 450 人降至约 50
              人，错误信息还导致部分零售商和供应商暂停或拒绝合作。Apeel 自己的 FAQ
              现在把纠正、道歉、法律文件和事实核查放在显著位置，说明信任防御已成为可见的商业职能。融资数据库对累计资本的数字也存在明显冲突，进一步说明必须直接核实规模和韧性，不能从历史融资推断持久性。
