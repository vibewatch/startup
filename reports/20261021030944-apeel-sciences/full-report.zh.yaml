  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Apeel
              的可服务市场是采后生鲜处理，包含两类有证据支持的解决方案：减缓水分流失和氧化的可食用表面涂层，以及帮助供应链运营方评估成熟度和品质的测量软件与设备。因此，经济买方是管理损耗、规格、物流或陈列的生鲜供应商、分销商或零售商，而不是最终食用生鲜的消费者。这个边界不包括更宽泛的全部食物浪费、完整冷链、包装、作物保护或生鲜零售市场。相关替代方案包括传统蜡膜、杀菌剂、其他采后处理、冷藏、塑料包装、人工品质检查，以及接受更高腐损水平的现状方案。
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
              - CM007
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
