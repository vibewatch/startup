      - number: '8.2'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              投资逻辑是 Apeel 仍拥有差异化的采后方案，并正把它扩展到数字化品质工具。公司材料介绍了 RipeTrack 和 Apeel Leverage 计划；Apeel
              产品页面继续把涂层定位为抵御水分流失和氧化的食品级屏障。Agroempresario 还报道，重新设计的配方将应用成本降低十倍，如今约 70% 的业务来自欧洲、中东和非洲。反向逻辑对估值更关键：TBPN
              Digest 报道美国零售业务实际上降至零，Agroempresario 描述了严重的员工规模收缩。这些是商业化和组织重置信号，不是可规模化经济性的证据。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: 情景与可比背景
        blocks:
          - type: paragraph
            body: >-
              由于现有公开证据没有披露当前收入、毛利率、烧钱、债务条款、客户集中度或资本化，给出数字化的乐观、基准和悲观估值会制造虚假精确度。Multiples.vc 列出 Olam 和 Genus
              在非常不同的最近财年收入倍数，但这些上市公司的业务组合、规模、盈利能力和流动性都与 Apeel
              不同；这些数字只能提供背景，不是直接定价公式。因此，乐观情景需要经验证的、可盈利的国际增长，以及数字产品增加经常性高毛利收入的证据；基准情景把 2021
              年估值视为过时，并要求大幅折价或合同性下行保护；悲观情景假设美国业务重建停滞，在流动性和偿付能力得到证明前不新增敞口。
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV010
              - CV012
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV010
              - CV012
              - CV015
              - CV016
      - number: '8.4'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              EquityZen 描述了面向合格投资人的潜在老股交易路径，并指出最终流动性可能来自 IPO、合并、收购或符合条件的 Express
              Deal。这只是交易渠道的证据，不是可靠流动性、价格发现或退出准备度的证据。可信的投资判断流程应取得当前完全稀释股权结构表、清算优先权、债务契约、2024-2026
              年经审计财务报表、月度现金消耗、客户和地域集中度以及产品层面的留存。投资逻辑破坏触发条件应包括无法核对融资记录、债务义务之后仍无法证明有足够现金跑道、主要客户持续流失，或证明 RipeTrack
              和其他扩展产品无法带来可重复的生鲜业务毛利。在这些测试通过前，价格谈判不能替代尽调。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
              - CV014
              - CV016
