chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Apeel Sciences 于 2012 年由 James Rogers 创立，总部位于 Goleta,
              California。公司仍为私营企业，面向生鲜供应链销售产品，而不是经营消费包装品牌。其核心方案是在生鲜表面涂覆一层植物来源的薄膜，强化天然果皮，减缓水分流失和氧化，从而延长品质保持时间。当前产品范围已超出涂层：2023
              年推出的 RipeTrack 增加了面向供应商、分销商和杂货零售商的测量工具与云软件。两者结合，使 Apeel 成为一家 B2B
              采后技术供应商；其价值取决于可量化的损耗降低、稳定的品质和在供应商设施中的低摩擦部署，而不只是消费者对 Apeel 品牌的认知。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO012
