            title: 商业复苏是核心投资逻辑测试
            body: 国际集中度和产品扩展可能保留上行空间，但据报道美国业务崩塌和员工规模下降，使客户复苏、留存和毛利成为投资判断的核心测试。
            calloutType: risk
