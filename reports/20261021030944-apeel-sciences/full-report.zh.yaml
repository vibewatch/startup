      - number: '7.4'
        title: 监测重点与投资逻辑破坏触发条件
        blocks:
          - type: paragraph
            body: >-
              最高优先级的监测项，是这支更小的团队能否把重设计后的部署模式转化为可重复的供应商经济性，同时避免伙伴再次流失。如果一手法律审查发现不符合适用的涂层或标签规则，经过验证的现场数据无法支持所称的实施成本改善，或重要伙伴因信任或性能问题再次暂停项目，就应暂停投资逻辑。第二项触发条件是流动性：管理层未提供与银行对账单及董事会材料核对过的当前现金、烧钱、现金跑道、债务和资本化数据前，投资人不应把持续扩张计入判断。第三项触发条件是集中度：公司在员工规模缩减的同时支持涂层、RipeTrack
              及其他采后产品时，如果地域或交易对手多元化没有改善，投资案例就会走弱。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR010
              - CR013
              - CR014
              - CR015
              - CR016
