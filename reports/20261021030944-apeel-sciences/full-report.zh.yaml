  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险可管理，但尚未关闭
        blocks:
          - type: paragraph
            body: >-
              公开记录没有显示监管机构认定 Apeel 当前涂层不安全。一份信誉较低的二手来源称，FDA 对公司在预期条件下的 GRAS
              结论没有异议，同时指出该回应没有评估一项法定合规条款。区别很重要：不反对不等于广泛的监管背书，也不等于持续的上市后保证。标签仍是现实的政治和商业问题，因为 H.R. 4737 在 2025
              年促成了公司回应。Apeel 称其产品符合现有标签规则，且 Organipeel 已不再销售，但这些都是公司发布的主张。因此，在将风险视为已完全缓释前，法律尽调应从一手记录核实 GRAS
              通知、各司法辖区的标签做法、待决法案状态及已和解的批评者诉讼。
            claimRefs:
              - CR001
