  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资结论与定价纪律
        blocks:
          - type: paragraph
            body: >-
              公开记录不足以支持对 Apeel 进行可辩护的当前企业价值投资判断。Multiples.vc 将最近完成的一轮主要融资锚定在 2021 年 8 月的 $2 billion 估值，并报告融资 $640
              million；EquityZen 显示 $647 million，TBPN Digest 报道 $800 million。A4BEE 更进一步，报道 2025 年 $4.2 billion 的 F
              轮以及一笔独立债务再融资，但现有证据没有一手融资文件来核对这些说法。融资额不等于可用现金，也没有任何来源确认当前现金、烧钱、优先权、稀释或完全稀释后的所有权。因此，当前结论是继续研究，信心低、风险高；在当前股权结构表和经审计财务包同时明确价格和下行保护前，估值立场从偏高到无法判断。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
