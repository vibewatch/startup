      - number: '2.2'
        title: 证据约束下的市场规模
        blocks:
          - type: paragraph
            body: >-
              留存证据不足以支持带金额的 TAM、SAM 或 SOM，也不应制造虚假的精确度。不过，证据确实提供了几个运营观察角度。Apeel
              当前产品页面列出六类生鲜；一份二手来源则描述了覆盖九个指定国家的更广泛监管许可，以及若干欧洲市场的品类许可。一份历史市场数据页面称，截至 2021 年，公司与 30
              多家供应商和零售商建立了覆盖八国的关系，但那是旧的触达指标，不是当前客户数。较新的报道称，欧洲、中东和非洲约占业务的 70%。这些指标的分母和时间点不同，不能合并成虚构的市场规模或转化漏斗。
