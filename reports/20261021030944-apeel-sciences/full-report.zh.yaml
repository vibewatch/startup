        title: 展品
        blocks:
          - type: callout
            title: 没有价格一致的资本化记录
            body: 2021 年私募轮估值、相互冲突的累计融资数字以及未经核实的后续融资报道，都不能确定当前入场价格。在谈判估值前，要求提供原始融资文件和完全稀释后的瀑布表。
            calloutType: recommendation
