            body: >-
              公司历史规模与当前运营基础之间的落差，放大了执行风险。独立报道显示，员工数在 2021 年峰值约 450 人，经历 2022 年大幅裁员后降至约 50
              人。同一报道称，最初的涂层部署需要专用设备、专职人员和复杂的供应商现场安装；创始人则称，重新设计后的应用成本只有此前的十分之一。这一重设计方向上是积极变化，但留存来源没有提供经审计的成本、可靠性、吞吐量或跨作物失败率数据。RipeTrack
              又增加了软件和仪器层，不过留存文章中的准确性与试验反馈来自 Apeel 高管。投资批准前，应要求取得客户队列层面的实施经济性和服务质量证据，不能把产品公告当成运营验证。
