              Apeel，而不是监管机构或独立试验。产品组合如今已超出涂层配方：2023 年 RipeTrack 公告描述了用于生鲜品质决策的测量工具和监控软件；后续报道称 Apeel 正在准备用于柑橘和鳄梨真菌控制的
              Zero MI。这些扩展构成了更广泛的采后平台，但现有来源没有确认当前商业规模、普遍可售的 SKU 范围，或新产品是否经过独立验证。
