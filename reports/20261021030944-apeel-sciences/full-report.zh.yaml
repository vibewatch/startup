              Rogers，称其可使用现有包装厂设备，把应用成本降低十倍，并支持销售主导方从零售商转向供应商。如果得到验证，这一重设计可以降低实施摩擦和服务强度，但十倍这一数字是创始人说法，并非经审计的成本证据。现有来源没有量化销售周期、获客成本、回本周期、利用率、流失、毛利率、营运资金或资本开支。
