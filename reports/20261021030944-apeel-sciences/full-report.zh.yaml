      - number: '2.3'
        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              涂层销售是一项 B2B 运营采购：供应商或包装厂负责应用处理，分销商因库存损耗降低而受益，零售商则可能获得更低损耗或更好的货架品质。RipeTrack
              把工作流从处理扩展到测量，通过数字化成熟、运输和收货环节的品质检查，将结果汇总用于运营决策。因此，采用不仅取决于消费者对可持续性的需求。供应商必须确认产品能接入现有生产线、应用成本可控、作物层面的表现可靠，并得到下游零售买家的接受。零售商可以帮助创造需求，但据报道销售主导方正从零售商转向供应商，这使包装厂的经济性和系统集成更直接地接受预算检验。
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: 增长驱动、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              最强的采用驱动因素是减少腐损、延长物流窗口、稳定零售规格和提高抗中断能力。Apeel 在港口中断期间免费提供涂层服务，展示了库存风险场景；RipeTrack
              则瞄准供应链节点之间的信息缺口。约束同样重要：一份独立报道称，早期部署需要专用设备、专职人员和复杂安装，尽管据报道重新设计的配方将应用成本降低十倍，并可使用现有包装厂设备。信任也是另一项准入变量，因为据报道错误信息曾导致交易对手暂停或拒绝合作，即使另一篇报道描述了监管机构和专家对成分安全性的支持。因此，估值应取决于经验证的作物层面单位经济性、转化率、留存和当前客户集中度，而这些都没有在本证据集中披露。
            claimRefs:
              - CM009
              - CM010
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 展品
        blocks:
          - type: callout
            title: 美元口径的市场规模仍未经证明
            body: 现有来源没有提供带价格、合格吞吐量、采用率和地域假设的有界 TAM、SAM 或 SOM。投资判断应使用客户合同和作物层面单位经济性，而不是泛化的食物浪费估算。
            calloutType: risk
            claimRefs:
              - CM003
              - CM004
              - CM016
          - type: callout
            title: 集成成本是门槛变量
            body: 据报道，公司重新设计的方案降低了应用成本，并可使用现有包装厂设备；但这一说法仍需客户层面的验证，之后才能支持采用曲线加快的判断。
            calloutType: insight
            claimRefs:
              - CM009
              - CM010
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合是工作流，而非整齐的同业群
        blocks:
          - type: paragraph
            body: >-
              留存证据支持按任务划分的竞争框架，而不是一张可直接比较的初创公司名单。Apeel
              的核心涂层减缓水分流失和氧化；公开记录还列出了传统蜡膜、塑料包装、采后杀菌剂、依赖冷藏的处理，以及人工成熟度检测等买方解决生鲜品质的方式。RipeTrack 则把 Apeel
              从保存扩展到无损测量、云端数据采集和陈列决策。产品范围更宽可能提高客户相关性，但也会让 Apeel
              面对不同预算负责人和根深蒂固的运营惯例。现有来源没有提供当前具名直接涂层竞争者的可辩护清单，因此通用解决方案类别与已验证的公司同业分开列示。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP009
              - CP011
              - CP012
              - CP016
