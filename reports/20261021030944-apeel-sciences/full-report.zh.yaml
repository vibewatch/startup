              - CO012
              - CO016
      - number: '1.2'
        title: 资本历史与利益相关方敞口
        blocks:
          - type: paragraph
            body: >-
              现有证据中最后一轮公开确认的定价融资是 2021 年 8 月的 E 轮：Multiples 报道 Temasek 以 $2 billion 估值领投 $250
              million。该估值属于历史记录，不是当前估值。公开数据库对累计融资也存在分歧：Multiples 报道 $640 million，EquityZen 报道 $647
              million；两者都不能证明今天可用的现金，差额还应与股权结构表和交割文件核对。Temasek、GIC、Viking Global Investors、Andreessen Horowitz 和 Upfront
              Ventures 等投资人具有重要经济影响；供应商和包装厂则具有重要运营影响，因为部署发生在它们的工作流中。现有股东也可能通过私募市场平台形成老股供给，但这种可得性不能证明公司认可的估值或当前融资条款。
            claimRefs:
