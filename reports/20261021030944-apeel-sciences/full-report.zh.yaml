              Apeel 的公开时间线从 2012 年创立开始，经历种子轮和风险融资、2018 年零售商业化、2021 年估值峰值、2022 年裁员以及 2023 年推出 RipeTrack。2024
              年东海岸港口中断期间向生鲜供应商免费提供涂层服务，说明公司仍在持续参与供应链。当前地域结构也不同于以美国为中心的增长叙事：不利报道称，欧洲、中东和非洲如今约占业务的
