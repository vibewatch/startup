      - number: '7.3'
        title: 伙伴集中度与融资透明度叠加执行风险
        blocks:
          - type: paragraph
            body: >-
              Apeel 的复苏取决于供应商采用和恢复信任。第三方报道称，一场错误信息活动导致部分零售商和供应商暂停或拒绝合作，并称当前业务约 70%
              位于欧洲、中东和非洲。这造成了双重依赖：依赖一个集中的区域，也依赖愿意安装或运营 Apeel 流程的交易对手。公开融资数据没有解决资金能力问题：EquityZen 显示累计融资 $647 million，而
              Multiples 报道七轮融资 $640 million，并将 2021 年 8 月 E
              轮列为最近完成的轮次。融资额不等于可用现金，任何来源都没有披露烧钱、现金跑道、债务契约、营运资金或当前资本化。这些数据缺口阻碍可靠的流动性评估，应视为重大尽调缺口。
            claimRefs:
              - CR010
