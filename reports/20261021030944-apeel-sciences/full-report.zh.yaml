            title: 投资批准前必须取得运营证明
            body: 要求提供一手监管文件、客户层面的留存和集中度、部署经济性、可靠性数据以及董事会批准的流动性计划。若无法证明所称的部署重设计或当前现金跑道，应暂停投资逻辑。
