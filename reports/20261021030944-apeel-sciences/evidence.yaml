evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      Closing documents and a company-prepared financing schedule reconciling the $640 million and $647 million
      cumulative funding totals.
    whyItMatters: >-
      Funding raised cannot be translated into dilution, security rights, or current liquidity while the public totals
      conflict.
    diligencePath: >-
      Obtain the cap table, financing ledger, stock-purchase agreements, debt schedule, and cash reconciliation from
      management.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: private-company-disclosure
    missingEvidence: Current audited revenue, gross margin, customer count and concentration, cash burn, cash balance, and runway.
    whyItMatters: >-
      The public operating-reset narrative cannot establish commercial durability or financing need without current
      financial and customer denominators.
    diligencePath: >-
      Request monthly management accounts, audited statements, bank balances, customer-level revenue cohorts, contracts,
      and the current operating plan.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: >-
      Complete executive and board roster, appointment dates, committee assignments, succession plans, and departures
      since 2021.
    whyItMatters: >-
      A sharply smaller organization may carry key-person and governance risk that a partial public roster cannot
      quantify.
    diligencePath: >-
      Request board minutes, governance chart, employment agreements, organizational chart, and executive departure
      history.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholders
    missingEvidence: >-
      Full current cap table, security classes, liquidation preferences, investor rights, transfer restrictions, and
      secondary transaction history.
    whyItMatters: >-
      Named investors indicate financing history but do not reveal control, ownership, liquidation economics, or price
      discovery.
    diligencePath: >-
      Obtain the fully diluted cap table, charter, voting agreements, investor-rights agreements, and approved secondary
      records.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Crop-level throughput, realized treatment price, eligible facilities, current contracted customers, adoption, and
      retention by geography.
    whyItMatters: >-
      Without common denominators and current commercial inputs, a dollar TAM, SAM, or SOM would be false precision and
      cannot anchor valuation.
    diligencePath: >-
      Obtain management's market model and customer-level operating data, then reconcile assumptions to third-party
      produce throughput and facility counts.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: market-adoption
    missingEvidence: Current customer count and a reconciled definition of the reported EMEA business share.
    whyItMatters: >-
      Historical relationships and an undefined business-share percentage cannot establish current penetration or
      concentration.
    diligencePath: >-
      Request a dated customer roster, geography-level revenue or volume, and definitions for active, contracted, and
      trial customers.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Verified application cost, installation burden, crop-level efficacy, payback period, renewal, and buyer budget
      ownership.
    whyItMatters: >-
      The adoption curve and addressable spend depend on customer economics rather than the size of the food-waste
      problem.
    diligencePath: >-
      Review representative contracts and interview supplier operations teams across crops, equipment configurations,
      and geographies.
    relatedQuestionRefs:
      - QM006
      - QM007
      - QM009
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Current price cards or contracts showing price per treated unit, implementation fees, minimum volumes, discount
      tiers, term length, and RipeTrack packaging.
    whyItMatters: >-
      Without comparable realized pricing and contract terms, neither ROI nor switching cost can be benchmarked against
      incumbent treatments.
    diligencePath: >-
      Request redacted current customer contracts and a cohort-level gross-margin and payback bridge, then compare them
      with two buyer RFPs.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: enumeration-incomplete
    severity: material
    topic: named-direct-competitors
    missingEvidence: >-
      A current list of named coating competitors with crop coverage, installed base, price, efficacy, regulatory
      posture, and customer references.
    whyItMatters: >-
      Solution-class comparisons cannot establish relative performance, share, or moat durability against actual
      vendors.
    diligencePath: >-
      Run a buyer-led RFP across major packers and retailers and obtain independent crop-level trials for at least three
      named alternatives.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: pricing-and-margin
    missingEvidence: >-
      Realized prices, discount schedules, contract terms, revenue mix, recognition policy, gross margin, CAC, sales
      cycle, and payback by offering and customer cohort.
    whyItMatters: >-
      Without these inputs, revenue quality, contribution economics, and the durability of the supplier-led commercial
      model cannot be underwritten.
    diligencePath: >-
      Review standard contracts, invoices, audited revenue schedules, cohort gross-margin reports, and sales-efficiency
      analyses in the data room.
    relatedQuestionRefs:
      - QI002
      - QI009
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, restricted cash, monthly burn, runway, debt and covenant schedule, working-capital needs, capex
      plan, next-round trigger, and planned use of funds.
    whyItMatters: >-
      Historical funding totals cannot establish liquidity or the probability and timing of another financing
      requirement.
    diligencePath: >-
      Obtain current bank statements, board-approved forecast, monthly cash bridge, debt documents, covenant
      calculations, and financing plan.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      A public developer, integration-partner, practitioner, package, repository, API, or technical-community signal
      tied to current Apeel deployments.
    whyItMatters: >-
      Without an external technical-adoption signal, integration depth, maintainability, and practitioner acceptance
      cannot be independently assessed.
    diligencePath: >-
      Request API and integration documentation, current partner references, implementation architecture, and interviews
      with customer technical operators.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: performance-validation
    missingEvidence: >-
      Independent crop-level coating efficacy, RipeTrack accuracy, calibration, uptime, and customer outcome
      distributions with denominators.
    whyItMatters: >-
      Issuer claims do not establish performance consistency, implementation economics, or reproducibility across crops,
      sites, and customer cohorts.
    diligencePath: >-
      Obtain blinded validation reports, benchmark protocols, site-level cohorts, instrument calibration records,
      incident logs, and customer reference calls.
    relatedQuestionRefs:
      - QE004
      - QE005
      - QE009
    relatedTableRefs:
      - TE001
      - TE002
      - TE003
  - type: missing-source
    severity: material
    topic: controls-and-compliance
    missingEvidence: >-
      Current formulation-specific regulatory records, batch-quality controls, RipeTrack security and privacy controls,
      and Zero MI launch approvals.
    whyItMatters: >-
      Ingredient disclosure alone cannot verify market-specific authorization, production quality, software risk
      controls, or launch readiness.
    diligencePath: >-
      Review regulator correspondence, safety dossiers, quality-system audits, formulation specifications, security
      testing, privacy terms, and approval timelines.
    relatedQuestionRefs:
      - QE006
      - QE007
      - QE009
    relatedTableRefs:
      - TE001
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention and concentration
    missingEvidence: >-
      Customer cohorts with NRR, GRR, logo churn, renewal rates, contract length, expansion attach rates, and
      top-customer revenue shares.
    whyItMatters: >-
      Without cohort and concentration data, historical launches cannot establish durable recurring demand or acceptable
      dependency risk.
    diligencePath: >-
      Request a customer-level revenue export, contract roster, renewal history, and cohort bridge segmented by crop,
      geography, and customer type.
    relatedQuestionRefs:
      - QU005
  - type: enumeration-incomplete
    severity: material
    topic: named customers
    missingEvidence: >-
      A current, complete list of paying production customers with pilots separated from active deployments and expired
      relationships.
    whyItMatters: The public list is historical and cannot establish current account depth, production status, or reference quality.
    diligencePath: >-
      Reconcile CRM accounts to invoices and deployment logs, then verify a sample through direct customer reference
      calls.
    relatedQuestionRefs:
      - QU003
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: customer economics
    missingEvidence: >-
      Customer-specific implementation cost, realized shrink savings, sales lift, pricing, and payback by crop and
      facility.
    whyItMatters: Expansion depends on whether measurable savings exceed deployment and operating costs for the actual payer.
    diligencePath: >-
      Obtain signed business cases and post-deployment scorecards for at least three recent customers across distinct
      crops and regions.
    relatedQuestionRefs:
      - QU002
      - QU006
  - type: missing-source
    severity: material
    topic: regulatory-primary-records
    missingEvidence: >-
      Primary FDA notices and response letters, current formulation specifications, jurisdictional labeling opinions,
      the current status of H.R. 4737, and a complete litigation docket.
    whyItMatters: >-
      Company statements and low-reputation summaries cannot establish the exact scope of regulatory clearance, current
      compliance, or remaining legal exposure.
    diligencePath: >-
      Obtain GRN 648 and 886 with supplements, counsel memoranda, current labels, regulator correspondence, complaints,
      settlement documents, and an open-matters schedule.
    relatedQuestionRefs:
      - QR001
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: liquidity
    missingEvidence: >-
      Current unrestricted cash, monthly burn, runway, debt and covenant schedule, working-capital cycle, capitalization
      table, liquidation preferences, and board-approved operating plan.
    whyItMatters: >-
      Historical funding totals do not show cash available to support the reduced workforce, product expansion,
      commercial rebuilding, or downside resilience.
    diligencePath: >-
      Reconcile management accounts to bank statements, debt documents, the cap table, board materials, and a monthly
      24-month cash forecast with downside sensitivities.
    relatedQuestionRefs:
      - QR006
  - type: missing-source
    severity: material
    topic: operating-validation
    missingEvidence: >-
      Independent cohort data on installation cost, throughput, uptime, quality failures, RipeTrack accuracy, customer
      retention, partner concentration, and field performance by crop.
    whyItMatters: >-
      The key mitigation claims are announcement-level or founder-attributed and do not establish repeatable economics
      or reliability at commercial scale.
    diligencePath: >-
      Review customer contracts and cohort data, interview reference and churned customers, and reproduce performance
      tests against named baselines with a third-party technical reviewer.
    relatedQuestionRefs:
      - QR003
      - QR004
      - QR005
      - QR008
      - QR009
      - QR010
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      Original financing documents that reconcile the $640M, $647M, and $800M funding totals and confirm or refute the
      reported 2025 equity and debt transactions.
    whyItMatters: >-
      Round seniority, current valuation, debt burden, dilution, and available liquidity cannot be inferred from
      conflicting secondary accounts.
    diligencePath: >-
      Obtain the financing ledger, signed term sheets, debt agreements, board approvals, and bank statements from
      management and reconcile them to the fully diluted cap table.
    relatedQuestionRefs:
      - QV003
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited 2024-2026 revenue, gross margin, operating cash flow, cash balance, burn, and product-level unit
      economics.
    whyItMatters: >-
      A valuation range and target return require earnings or cash-flow capacity, not fundraising totals or product
      narratives.
    diligencePath: >-
      Review audited statements, monthly management accounts, bank statements, revenue recognition policy, and
      gross-margin bridges by product and geography.
    relatedQuestionRefs:
      - QV001
      - QV006
      - QV007
      - QV009
  - type: private-evidence-only
    severity: material
    topic: capitalization
    missingEvidence: >-
      Current fully diluted ownership, option pool, liquidation preferences, participation rights, anti-dilution terms,
      warrants, debt covenants, and secondary transaction prices.
    whyItMatters: Headline enterprise value does not determine investor returns when preference and dilution overhang are unknown.
    diligencePath: >-
      Build an exit waterfall from the certified cap table, charter, investor-rights agreements, debt documents, and the
      last twelve months of primary and secondary transactions.
    relatedQuestionRefs:
      - QV002
      - QV008
      - QV009
  - type: private-evidence-only
    severity: material
    topic: commercial-quality
    missingEvidence: >-
      Customer-level revenue concentration, cohort retention, contract terms, realized shrink reduction, and
      gross-profit contribution for coatings and RipeTrack.
    whyItMatters: International concentration and product launches do not establish durable demand or scalable gross profit.
    diligencePath: >-
      Review customer contracts, invoices, churn and cohort schedules, product telemetry, and reference calls across
      U.S. and international customers.
    relatedQuestionRefs:
      - QV004
      - QV005
      - QV007
      - QV009
