companyProfile:
  summary: >-
    Founded in 2012 and headquartered in Goleta, Apeel Sciences sells plant-derived post-harvest produce coatings and
    RipeTrack ripeness and quality-management tools to suppliers, distributors, and retailers. Its commercial
    proposition is lower spoilage and more consistent produce quality, but the current scale and economics of that
    proposition remain undisclosed.
