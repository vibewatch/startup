  topStrengths:
    - >-
      A differentiated plant-derived coating proposition remains commercially active and is complemented by RipeTrack
      quality-measurement tools.
    - >-
      The redesigned formulation reportedly fits existing packing-house equipment and materially lowers application
      expense, subject to customer validation.
    - >-
      Historical retail deployments and a reported international business base demonstrate commercial relevance beyond
      laboratory development.
  topRisks:
    - >-
      Reported workforce contraction from about 450 to about 50 and an effectively lost U.S. retail business raise
      organizational-capacity and recovery risk.
    - Current cash, burn, runway, debt terms, capitalization, and any post-2021 priced financing remain unverified.
    - >-
      Customer retention, contract duration, concentration, crop-level unit economics, and product-level gross margins
      are undisclosed.
    - >-
      Partner trust, labeling debate, implementation proof, and a reported concentration in Europe, the Middle East, and
      Africa increase execution risk.
  unresolvedGaps:
    - >-
      Current fully diluted cap table, liquidation preferences, debt covenants, and original documents for any post-2021
      financing.
    - >-
      Audited 2024-2026 financials, current cash, monthly burn, runway, working capital, and gross margin by product and
      region.
    - >-
      Customer-level revenue, concentration, contract length, retention, expansion, and production-versus-pilot status
      by crop and geography.
    - >-
      Independent field validation of coating efficacy, application cost, throughput, reliability, and RipeTrack
      accuracy.
    - >-
      Complete board and leadership records, jurisdiction-specific regulatory and labeling review, and unresolved
      litigation or compliance obligations.
