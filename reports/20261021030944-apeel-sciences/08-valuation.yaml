company:
  name: Apeel Sciences
chapter:
  number: 8
  title: Valuation
  summary: >-
    Apeel retains product and data-platform optionality, but public financing records conflict
    materially and the operating evidence includes a severe contraction in the United States.
    The appropriate stance is research-more with high risk and strict entry discipline, not a
    point valuation derived from stale or unreconciled private-market marks.
sections:
  - id: investment-call
    title: Investment call and pricing discipline
    body: >-
      The public record does not support underwriting Apeel at a defensible current enterprise
      value. Multiples.vc anchors the last completed primary financing at a $2 billion valuation
      in August 2021 and reports $640 million raised, while EquityZen shows $647 million and TBPN
      Digest reports $800 million. A4BEE goes further, reporting a 2025 Series F at $4.2 billion
      and a separate debt refinancing, but the assigned evidence contains no primary financing
      document that reconciles those claims. Funding raised is not cash available, and none of
      these sources establishes present cash, burn, preferences, dilution, or fully diluted
      ownership. The resulting call is research-more, with low confidence, high risk, and a
      stretched-to-indeterminate valuation stance until a current cap table and audited financial
      package establish both price and downside protection.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-antithesis
    title: Thesis and anti-thesis
    body: >-
      The thesis is that Apeel still owns a differentiated post-harvest proposition and is
      broadening it with digital quality tools. Company-issued materials describe RipeTrack and
      the Apeel Leverage initiative, while Apeel's product page continues to position its coating
      as a food-grade barrier against water loss and oxidation. Agroempresario also reports that a
      redesigned formulation reduced application expense by a factor of ten and that roughly 70%
      of the business now comes from Europe, the Middle East, and Africa. The anti-thesis is more
      consequential for valuation: TBPN Digest reports that the U.S. retail business fell
      effectively to zero, and Agroempresario describes a severe workforce contraction. Those
      are commercialization and organizational-reset signals, not evidence of scalable economics.
    claimRefs: [CV008, CV009, CV010, CV011, CV012, CV013]
    tableRefs: [TV002]
  - id: scenarios-and-comparables
    title: Scenarios and comparable context
    body: >-
      A numerical bull/base/bear valuation would be false precision because the assigned public
      evidence does not disclose current revenue, gross margin, cash burn, debt terms, customer
      concentration, or capitalization. Multiples.vc lists Olam and Genus at very different
      last-fiscal-year revenue multiples, but those public companies have different business
      mixes, scale, profitability, and liquidity from Apeel; the figures are context, not a direct
      pricing formula. The bull case therefore requires verified profitable international growth
      and evidence that digital products add recurring, high-margin revenue. The base case treats
      the 2021 mark as stale and demands a material discount or contractual downside protection.
      The bear case assumes U.S. rebuilding stalls and avoids new exposure until liquidity and
      solvency are demonstrated.
    claimRefs: [CV001, CV007, CV008, CV010, CV012, CV015, CV016]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness and final diligence asks
    body: >-
      EquityZen describes a potential secondary route for accredited investors and notes that
      eventual liquidity may come through an IPO, merger, acquisition, or an eligible Express
      Deal. That is evidence of a transaction channel, not evidence of dependable liquidity,
      price discovery, or exit readiness. A credible underwriting process should obtain the
      current fully diluted cap table, liquidation preferences, debt covenants, 2024-2026 audited
      financials, monthly cash burn, customer and geography concentration, and product-level
      retention. Thesis-break triggers should include failure to reconcile the financing record,
      inability to demonstrate adequate runway after debt obligations, continued loss of major
      customers, or proof that RipeTrack and other expansion products do not produce repeatable
      gross profit. Until those tests clear, price negotiation cannot substitute for diligence.
    claimRefs: [CV006, CV007, CV008, CV009, CV012, CV014, CV016]
