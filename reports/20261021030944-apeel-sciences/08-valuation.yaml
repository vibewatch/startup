callouts:
  - calloutType: recommendation
    title: No price without a reconciled capitalization record
    body: >-
      A 2021 private-round valuation, conflicting aggregate funding figures, and an uncorroborated
      later financing account cannot establish a current entry price. Require original financing
      documents and a fully diluted waterfall before negotiating valuation.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV016]
  - calloutType: risk
    title: Commercial recovery is the key thesis test
    body: >-
      International concentration and product expansion may preserve upside, but the reported
      collapse of the U.S. business and workforce reduction make customer recovery, retention,
      and gross profit the central underwriting tests.
    claimRefs: [CV008, CV009, CV010, CV011, CV012, CV016]
