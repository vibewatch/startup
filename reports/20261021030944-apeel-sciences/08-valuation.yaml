    notes: "Reported operating statements largely derive from founder interviews or company-issued materials and require customer, contract, and financial corroboration."
    claimRefs: [CV008, CV009, CV010, CV011, CV012, CV013]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Assumptions, Valuation and return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Verified profitable international growth; recurring RipeTrack revenue; U.S. recovery", "Set a range only after audited revenue, margin, net debt, and dilution inputs; upside must clear the target return after preferences", "Execution across hardware, software, and multiple geographies", "Possible but unverified"]
      - [Base, "International business persists while U.S. recovery remains slow and digital monetization is early", "Treat the 2021 $2B mark as a stale ceiling and require a material discount or preferred downside protection", "Cash burn, concentration, and follow-on dilution remain unknown", "Most consistent with the assigned evidence"]
      - [Bear, "U.S. rebuilding stalls; new products do not create repeatable gross profit; financing terms are onerous", "No new-money exposure until solvency, runway, and preference overhang are demonstrated", "Down round, debt pressure, customer losses, and illiquidity", "Material downside with unknown probability"]
    notes: "Scenario signals are qualitative because public evidence does not support current revenue, margin, cash, debt-term, or cap-table inputs; no numerical valuation range is inferred."
    claimRefs: [CV001, CV006, CV007, CV008, CV010, CV012, CV015, CV016]
