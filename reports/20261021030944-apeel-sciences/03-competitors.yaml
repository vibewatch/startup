    rows:
      - [Freshness mechanism, "Barrier slows moisture loss and oxidation", "Same core mechanism", "Measures quality; does not itself preserve produce", "Waxes, plastic, and fungicides address different parts of the job", "No preservation capability established"]
      - [Existing-equipment fit, "Reportedly compatible with packing-house equipment", "Specialized equipment and dedicated staff", "Described as a user-friendly inspection platform", Unknown, "Uses existing staff and routines"]
      - [Ripeness measurement, "Not the coating's primary function", "Not established", "Non-destructive tools plus AI ripe-date estimate", Unknown, "Described by Apeel as time-consuming and inconsistent"]
      - [Data sharing, Unknown, Unknown, "Automatic cloud capture and team sharing", Unknown, "No digital sharing established"]
      - [Crop breadth, "Avocados, citrus, cucumbers, apples, and other produce reported", "Not separately disclosed", "Started with avocado and expanding to more categories", Unknown, "Depends on internal process"]
      - [Trust posture, "Visible labeling and safety controversy exposure", "Same brand exposure", "No independent trust benchmark", "Vendor-specific posture not identified", "Controlled by buyer but lacks an external standard in retained evidence"]
    notes: "Unknown means the assigned prefetched evidence did not establish the cell; company claims and syndicated launch material are not independent comparative tests."
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP011, CP012, CP013, CP014]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Offering or alternative, Public commercial model, Public price or unit, Included capability, Discount or contract unknowns, Underwriting implication]
    rows:
      - [Apeel current coating, "B2B product sales to suppliers and retailers", Unknown, "Produce coating and application workflow", "Volume tiers, minimums, equipment terms, and realized price unknown", "Cannot compare cost per treated unit or payback"]
      - [Apeel original workflow, "B2B deployment with dedicated application resources", Unknown, "Coating plus specialized equipment and staff", "Installation and labor allocation unknown", "Legacy burden may explain redesign but does not establish current margin"]
      - [RipeTrack, "Suite of measurement tools and monitoring software", Unknown, "Inspection tools, cloud dashboard, and AI-supported ripe-date analysis", "Hardware, subscription, service, and bundling terms unknown", "Attach economics and switching cost cannot be assessed"]
      - ["Waxes, plastic, and fungicides", "Incumbent products or packaging", Unknown, "Category-specific preservation or protection", "Named vendors, crop-specific price, dose, and contract terms absent", "No defensible relative-price conclusion"]
    notes: "Every price cell is unknown because none of the retained sources discloses list or realized pricing; commercial descriptions are source-reported, not verified contracts."
    claimRefs: [CP003, CP004, CP005, CP006, CP009, CP010]
figures:
  - id: FP001
    title: Competitive positioning by strength of retained public evidence
    type: quadrant
    summary: >-
      The map scores evidence coverage, not product performance: Apeel's current workflow and
      RipeTrack are described in more implementation detail than incumbent substitute classes.
    xAxisLabel: "Implementation-fit evidence (1=category mention, 3=explicit workflow evidence)"
    yAxisLabel: "Capability-scope evidence (1=category only, 3=multi-function detail)"
    data:
      points:
        - label: Apeel current coating
          x: 3
          y: 2
          detail: "Existing-equipment fit is reported; preservation mechanism is described."
        - label: Apeel original workflow
          x: 3
          y: 2
          detail: "Specialized equipment, staffing, and installation burden are described."
        - label: RipeTrack
          x: 3
          y: 3
          detail: "Measurement, cloud sharing, logistics, and merchandising uses are described."
        - label: Traditional waxes
          x: 1
          y: 1
          detail: "Named as a substitute class without vendor-level implementation evidence."
        - label: Plastic packaging
          x: 1
          y: 1
          detail: "Named as a substitute class without comparative implementation evidence."
        - label: Post-harvest fungicides
          x: 1
          y: 1
          detail: "Named as a substitute class without product-level efficacy or workflow evidence."
    approximationNotes: "Ordinal 1-3 scores encode only the specificity of the retained public evidence: 1=category mention, 2=mechanism or bounded scope, 3=explicit workflow and multi-function detail. They are not efficacy, price, or market-share scores."
    claimRefs: [CP003, CP004, CP005, CP009, CP011, CP012, CP016]
callouts:
  - calloutType: risk
    title: Named-peer and pricing blind spot
    body: >-
      The assigned source pool does not identify a current direct coating peer with comparable
      price, crop efficacy, installed base, or renewal data. A buyer-led RFP and customer
      references are required before treating public differentiation claims as durable.
    claimRefs: [CP010, CP016]
