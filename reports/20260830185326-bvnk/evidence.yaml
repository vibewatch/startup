evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: >-
      Round-by-round cap table, liquidation preferences, secondaries, and exact ownership stakes before the Mastercard
      sale.
    whyItMatters: >-
      Without the security stack and ownership split, investors cannot convert enterprise value into founder and
      investor outcomes or judge preference overhang.
    diligencePath: Request cap table, board consents, and round documents covering the 2022 Series A through the 2026 sale.
    relatedQuestionRefs:
      - QO009
      - QO011
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: disclosure
    missingEvidence: Audited FY2025 and trailing-2026 revenue, gross profit, and customer concentration data.
    whyItMatters: >-
      The company clearly had commercial traction, but valuation quality still depends on revenue durability and margin
      composition.
    diligencePath: Obtain management accounts, audited statements, and a top-20 customer revenue bridge.
    relatedQuestionRefs:
      - QO015
      - QO025
    relatedTableRefs:
      - TO001
      - TO002
      - TO004
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A reconciled employee-count definition covering full-time staff, contractors, and post-acquisition timing.
    whyItMatters: >-
      The difference between 350+ and 469 does not change the thesis, but it affects maturity benchmarking and cost
      inference.
    diligencePath: Request HR headcount by entity and function as of quarter-end 2026-06-30.
    relatedQuestionRefs:
