chapter:
  number: 3
  title: Competitors
  summary: BVNK competes in a crowded stablecoin-infrastructure field, but most alternatives emphasize either custody, issuance, or developer-first APIs rather than BVNK’s specific mix of regulated multi-rail enterprise payments, wallets, and treasury orchestration. Its strongest differentiation improved after the Mastercard deal, though that same deal introduces neutrality and roadmap risk for customers that prefer an independent vendor.
sections:
- id: landscape-and-overlap
  title: Landscape classes and the real overlap set
  body: |-
    The easiest way to overstate competition around BVNK is to collapse the whole digital-asset stack into one peer set. In practice, overlap varies by buyer problem. Fireblocks and BitGo are strong where custody, wallet control, or issuance infrastructure dominate. Circle and Paxos are strongest where the core need is issuer-regulated stablecoin infrastructure or protocol-native settlement. Bridge and Zero Hash lean harder into API-native orchestration and developer-first packaging. Internal build remains the substitute for the largest enterprises with existing compliance and treasury depth.

    BVNK’s overlap zone is most acute where enterprises want regulated multi-rail payments infrastructure rather than one narrow function. Its public positioning around send, receive, store, convert, spend, and earn is broader than pure checkout or pure issuance claims. That puts it in the middle of the most commercially valuable part of the market: buyers who want a single vendor to abstract fiat and on-chain complexity across multiple workflows.

    That is why capability breadth and distribution quality matter more than headline category labels alone. In this market, buyers do not reward the most crypto-native product description; they reward the vendor that reduces operational, compliance, and treasury complexity fastest for a real enterprise deployment.
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP033
  - CP031
