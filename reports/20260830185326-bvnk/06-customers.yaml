- id: named-production-proof
  title: Named production proof is the strongest part of the customer case
  body: 'Named customer evidence is unusually good here. Worldpay, Deel, and Corpay each provide concrete workflow proof rather than vague partnership language. Worldpay described stablecoin payouts across more than 180 markets and positioned the service inside a mainstream payouts stack. Deel said 10,000 contractors across 100 countries were already receiving stablecoins and then extended the feature to employees. Corpay framed the relationship around embedded stablecoin wallets and treasury operations for a customer base of more than 800,000 clients. These are not just exploratory pilots; they are signals of real operational deployment.


    The rest of the logo set should be treated more carefully. Flywire is named by BVNK and Mastercard, but no dedicated case study was found. Other names such as Rapyd, Thunes, Bitso, dLocal, LianLian Global, Equals Money, IC Markets, XM, and Trust Payments are positive indicators, but the evidentiary depth is weaker. The right approach is to weight customer proof by workflow specificity, freshness, and independence, not by raw logo count.


    In practice, the customer question is less about whether demand exists and more about how durable and diversified it is. The next layer of diligence should therefore convert strong public logo proof into segment economics, concentration analysis, and repeat-usage evidence that can support a full underwriting case.'
  claimRefs:
  - CU007
  - CU008
  - CU009
  - CU010
