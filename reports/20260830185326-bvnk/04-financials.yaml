- id: traction-and-unit-economics
  title: Public traction signals and inferred unit economics
  body: 'BVNK’s throughput progression is real even if its revenue line is opaque. The public record moves from roughly $12 billion of annualized volume around the Visa investment to over $20 billion annually around the Citi investment and then to $30 billion annualized stablecoin payment volume in 2025, alongside 2.8 million transactions and 226 new customers. Those are substantial numbers for a young enterprise infrastructure provider and help explain why strategic buyers took the company seriously.


    Still, public traction is not the same thing as underwritable unit economics. Revenue, ARR, gross margin, CAC, payback, and NRR are not disclosed. The best one can say from public evidence is that the business likely benefits from sticky enterprise workflows, software-enabled compliance, and working-capital value for customers, which should support better quality than a low-value commodity PSP. But that remains an inference until management opens the books.


    For diligence, that means throughput should be treated as a strong leading indicator but not as a substitute for revenue quality. Investors still need to separate transactional economics, spread revenue, platform fees, customer concentration, and delivery cost before assuming software-like value capture.'
