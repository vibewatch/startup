  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The thesis is strategically strong, but disclosure keeps it from a buy call
        blocks:
          - type: paragraph
            body: >-
              BVNK’s positive case is easy to articulate. The company built a broad enterprise stablecoin stack, secured
              a meaningful licensing footprint, won credible customers such as Worldpay, Deel, and Corpay, and rode a
              category inflection just as stablecoin payments became strategically important to global incumbents. That
              combination was powerful enough for Mastercard to pay up to $1.8 billion only fifteen months after a
              reported $750 million Series B mark. This is not a weak company that happened to find a buyer; it is a
              company that seems to have executed well into a strong strategic window.


              The anti-thesis is equally important. Public financial disclosure never caught up with the strategic
              narrative. Investors still lack audited revenue, margin, concentration, and retention data, plus clean
              visibility into preference overhang and post-close autonomy. Those gaps matter because a good company is
              not automatically a good buy at any price. The strongest call supported by public evidence is therefore
              positive but price-disciplined.


              That is also why valuation should be read through both a strategic and a financial lens. The observed
              outcome validates scarcity and market timing, but the discipline question remains how much of the premium
              was earned by durable economics versus by strategic urgency at a key point in the market cycle.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
