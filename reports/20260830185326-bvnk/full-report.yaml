      - number: '2.2'
        title: Who buys, why they buy, and how adoption unfolds
        blocks:
          - type: paragraph
            body: >-
              The enterprise buyer set is increasingly visible. Payment service providers, fintechs, payroll platforms,
              marketplaces, brokerages, and treasury-heavy corporates all appear in the public record because they face
              a similar operational problem: legacy rails are slow, corridor-dependent, and expensive in liquidity
              terms. Stablecoins matter less as a speculative asset here than as programmable settlement infrastructure.
              For payroll operators, the wedge is worker payout speed and choice; for PSPs and marketplaces it is
              near-instant cross-border payouts; for finance teams it is liquidity efficiency and lower dependence on
              pre-funded balances.


              Adoption also follows a recognizable pattern. Enterprises typically begin with compliance and treasury
              analysis, move into a narrow corridor or product pilot, then expand to higher-volume payouts or broader
              embedded-wallet functionality once operations prove reliable. This is why speed has overtaken fee savings
              in the current buying narrative. Buyers want 24/7 settlement, fewer trapped balances, and clearer control
              over where money is at each step. Cost still matters, but only after reliability and compliance discipline
              are solved.


              The practical diligence implication is that investors should underwrite the subset of enterprise payment
              flows that can clear compliance, treasury, and integration hurdles rather than anchoring on
              undifferentiated global token volume. That narrower framing still supports a large opportunity while
              keeping adoption assumptions realistic.
