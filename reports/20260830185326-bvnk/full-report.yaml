        title: Customer segments and what scale is publicly visible
        blocks:
          - type: paragraph
            body: >-
              BVNK’s customer base is not a generic mix of crypto logos. The public record points to a relatively
              coherent segment set: PSPs and payout processors, payroll platforms, treasury-heavy cross-border
              operators, marketplaces, fintech platforms, and brokerages or digital-asset businesses. These buyers all
              need some combination of faster settlement, cross-border reach, wallet functionality, and reduced
              dependence on banking-hour constraints. That segment logic is consistent across BVNK’s own product pages
              and its named customer announcements.


              Public scale data is helpful but incomplete. BVNK disclosed 226 new customers in 2025, $30 billion of
              annualized payment volume, and 2.8 million transactions, plus a one-third US volume share by year-end.
              Those are strong adoption signals, but they stop short of the numbers investors most want, such as total
              active customers, segment mix by revenue, or top-account concentration. The result is a customer story
              that is clearly real, but not yet cleanly quantified.


              In practice, the customer question is less about whether demand exists and more about how durable and
              diversified it is. The next layer of diligence should therefore convert strong public logo proof into
              segment economics, concentration analysis, and repeat-usage evidence that can support a full underwriting
