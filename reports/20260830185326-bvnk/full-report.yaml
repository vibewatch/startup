  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams and monetization packaging
        blocks:
          - type: paragraph
            body: >-
              BVNK’s public product set implies a diversified enterprise payments revenue model even though precise
              economics are hidden. The platform sells global payouts, payment acceptance, wallets, real-time
              conversion, card-linked spend, and rewards. That supports multiple monetization paths: transaction fees,
              FX or spread economics, wallet or platform fees, implementation and support value, and possibly
              balance-related economics around idle funds or treasury optimization. The MiCA-oriented commercial policy
              is useful because it confirms that exchange services have formal pricing or pricing methodology
              disclosures even if public websites do not list rates.


              This is not a pure SaaS subscription story and not a pure interchange story. It is a
              payments-infrastructure model where revenue recognition likely mixes usage-based and service-based
              economics. That can be attractive because it links monetization to throughput and workflow integration,
              but it also creates analytical complexity. Without customer-level contracts, investors cannot cleanly
              separate software-like recurring revenue from transactional or spread-driven revenue.


