      - number: '6.3'
        title: Durability, expansion, and what still remains unknown
        blocks:
          - type: paragraph
            body: >-
              The strongest public durability signal is not a retention ratio but operating intensity. A platform
              handling $30 billion of annualized stablecoin volume and 2.8 million transactions is unlikely to consist
              purely of pilots. Public customer narratives also imply land-and-expand logic: win a payout or settlement
              workflow, then broaden into wallets, treasury, or adjacent user-facing products. That is strategically
              attractive because it can increase switching costs and product attach over time.


              But the main customer diligence gaps remain substantial. NRR, GRR, churn, customer satisfaction, and
              concentration are not disclosed, and the most visible proof is partner-led through large counterparties.
              That means customer quality looks good, but the downside case around concentration and channel dependence
              still needs direct management evidence. Investors should treat the customer chapter as supportive, not
              fully closed.


              In practice, the customer question is less about whether demand exists and more about how durable and
              diversified it is. The next layer of diligence should therefore convert strong public logo proof into
              segment economics, concentration analysis, and repeat-usage evidence that can support a full underwriting
              case.


              The strongest follow-up work would therefore turn public logo proof into a quantified account map. That
              means measuring active accounts, usage concentration, deployment depth, renewal behavior, and the mix
              between direct customers and partner-amplified distribution channels.


              A customer-quality verdict therefore depends on two simultaneous truths. First, BVNK has stronger public
              proof than many private infrastructure vendors because several named customers describe real,
              production-like workflows. Second, the disclosed evidence still overweights marquee stories relative to
              portfolio statistics. That means the right customer conclusion is positive but bounded: the company has
              convincingly solved important problems for credible operators, yet investors still need cohort data and
              account-level concentration analysis to know whether those wins generalize across the book or are
              disproportionately carried by a narrow set of strategic relationships.
