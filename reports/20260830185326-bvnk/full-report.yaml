  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and the right sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Stablecoin payments is a deceptively broad label. For BVNK, the relevant market is not all crypto activity
              and not even all stablecoin transaction volume. The more defensible boundary is enterprise orchestration:
              the layer that lets businesses move between fiat and stablecoins, manage wallets and treasury, and plug
              new rails into existing payout, payroll, settlement, and checkout workflows. That boundary excludes
              speculative trading and most consumer token-investment behavior while still capturing the enterprise
              infrastructure value that Mastercard, Worldpay, and Corpay are implicitly underwriting.


              Under that definition, multiple market-size lenses matter. Mastercard cited at least $350 billion of
              digital-currency payment use cases in 2025, BVNK cited $5.2 trillion of stablecoin payments in 2024 inside
              $24 trillion of total stablecoin transactions, and Chainalysis estimated $28 trillion of adjusted real
              economic activity for 2025. Those are not contradictory if treated as progressively broader definitions.
              The investment takeaway is that the market is already large enough to matter now, and plausibly enormous
              later, but precision requires staying explicit about scope instead of repeating trillion-dollar numbers as
              if they were interchangeable.


              The practical diligence implication is that investors should underwrite the subset of enterprise payment
              flows that can clear compliance, treasury, and integration hurdles rather than anchoring on
              undifferentiated global token volume. That narrower framing still supports a large opportunity while
              keeping adoption assumptions realistic.
