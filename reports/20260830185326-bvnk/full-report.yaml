      - number: '4.3'
        title: Capital adequacy, filings, and the right financial verdict
        blocks:
          - type: paragraph
            body: >-
              Before the acquisition, BVNK appears to have been a well-funded but still disclosure-light infrastructure
              scale-up. The Series B added $50 million in late 2024, and strategic investors Visa and Citi followed in
              2025. Tracxn’s approximate $93.2 million lifetime-funding figure looks directionally plausible. But public
              filings do not disclose the consolidated cash position, monthly burn, runway, or exact customer
              concentration. Companies House small-company accounts are helpful for entity continuity and legal
              compliance, not for real underwriting of the operating group.


              The Mastercard sale changes the capital-adequacy question materially. As a standalone venture-backed
              company, BVNK still needed proof on profitability and margin path. As a newly acquired platform,
              survival-capital risk is replaced by integration-execution risk. The right financial verdict is therefore
              that BVNK showed credible scale and likely good infrastructure economics, but no investor should have
              underwritten the business purely from public financial evidence before the exit.


              For diligence, that means throughput should be treated as a strong leading indicator but not as a
              substitute for revenue quality. Investors still need to separate transactional economics, spread revenue,
              platform fees, customer concentration, and delivery cost before assuming software-like value capture.


              That distinction is especially important for an acquired infrastructure company. Strategic buyers can
              price optionality and distribution synergies more aggressively than public-market comparables, so
              diligence still needs a clean bridge from payment volume to durable gross profit and retained customer
              value.


              For diligence purposes, the most important missing bridge is the translation from volume into gross
              profit. A business can look impressive on throughput yet still hide weak take rates, expensive support
              costs, or concentrated economics in a few corridors. The reverse can also be true: modest headline fees
              may still create attractive margin if integration work is repeatable and treasury value is high. That is
              why the public evidence is supportive rather than definitive. It confirms scale and strategic relevance,
              but it does not let an investor independently test whether growth quality improved as the company moved
              from crypto-native customers toward larger enterprise and payments counterparties.
