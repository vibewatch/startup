      - number: '7.3'
        title: People, customer concentration, and Mastercard integration shape the residual risk
        blocks:
          - type: paragraph
            body: >-
              BVNK benefits from a visible founder bench and named functional leaders, but key-person dependence remains
              real because the founding team still anchors the narrative, product vision, and much of the company’s
              strategic credibility. Customer concentration is similarly ambiguous. Public proof on marquee customers is
              a strength, yet that same visibility suggests a relatively small set of large relationships could matter
              disproportionately, and investors do not have the concentration data needed to test the downside.


              Mastercard ownership cuts both ways. It reduces financing risk and likely improves institutional trust,
              but it also introduces integration risk, strategic-priority risk, and potential neutrality concerns for
              customers that do not want deep dependence on a large network owner. That duality is why the residual risk
              rating stays high rather than falling to medium simply because the company found a strategic buyer.


              As a result, the right risk framing is neither crypto panic nor post-acquisition complacency. The
              investment question is whether BVNK can preserve its compliance edge, customer trust, and product velocity
              while the surrounding regulatory and competitive environment continues to institutionalize.


              The residual rating stays elevated because several downside paths are correlated rather than independent.
              A policy change, partner disruption, or founder transition could all pressure customer confidence at the
              same time, which is why monitoring and mitigation discipline matter more than any single headline risk
              label.


              Importantly, not all of these risks move together. Better regulation can reduce legal ambiguity while
              simultaneously increasing compliance cost. Mastercard ownership can lower funding risk while raising
              integration and neutrality risk. Stronger named customers can validate the platform while also increasing
              concentration sensitivity. The chapter’s real message is therefore not that BVNK is unusually fragile, but
              that the company sits at the junction of several external systems that can change independently. Good
              diligence should test whether management has explicit contingency plans for each dependency rather than
              assuming the strategic exit resolved them automatically.
