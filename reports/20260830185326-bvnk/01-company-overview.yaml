company:
  name: BVNK
chapter:
  number: 1
  title: Company Overview
  summary: BVNK is a London-founded stablecoin payments infrastructure company that built a broad enterprise product set, reached material payment-volume scale, and sold to Mastercard in 2026 at up to $1.8 billion. The public record is unusually strong on product breadth, licensing posture, and strategic demand, but weaker on audited financial disclosure, exact customer counts, and governance detail below the holding-company level.
sections:
- id: identity-and-platform
  title: Identity, product scope, and present-day footprint
  body: |-
    BVNK’s public positioning is unusually consistent across its homepage, payments pages, and Mastercard’s acquisition materials: this is not a retail crypto app, but an enterprise stablecoin orchestration platform that sits between fiat rails, blockchains, and business workflows. The company presents itself as a single-integration stack that lets enterprises send, receive, store, convert, spend, and earn across fiat and stablecoin balances. That product framing matters because it defines the company’s economic ambition. BVNK is not only selling on-chain settlement; it is selling abstraction, compliance, and integration convenience to payment companies, marketplaces, payroll platforms, brokerages, and other enterprises that do not want to assemble their own banking, custody, and blockchain stack.

    The scale markers disclosed publicly support a serious platform rather than an early pilot business. BVNK says it supports 130-plus countries and more than 40 licenses or registrations across the UK, EU, and US footprint. The company’s own access threshold of at least $500,000 of monthly payment volume also implies that its intended customers are meaningful operators rather than hobbyist merchants. On current pages, BVNK positions stablecoins as another production payment rail inside an enterprise-grade architecture, not as an experimental add-on. That is exactly the product story Mastercard chose to buy in 2026, and it explains why strategic value emerged before public financial transparency fully caught up.
