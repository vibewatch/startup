      - number: '4.2'
        title: 公开牵引信号与推断出的单位经济
        blocks:
          - type: paragraph
            body: >-
              即便收入线不透明，BVNK 的吞吐量进展是真实的。公开记录从 Visa 投资前后的约 $12 billion 年化交易量，走到 Citi 投资前后的年化超过 $20 billion，再到 2025 年 $30
              billion 年化稳定币支付量，同时还有 2.8 million 笔交易和 226 个新客户。对一家年轻的企业基础设施提供商来说，这些数字很有分量，也解释了为什么战略买方会认真看待公司。


              不过，公开牵引不等于可直接尽调定价的单位经济。收入、ARR、毛利率、CAC、回本周期和 NRR
              都未披露。公开证据最多能说明，这家公司可能受益于粘性企业工作流、软件驱动合规，以及给客户带来的营运资本价值；这些因素应能支撑高于低价值商品化 PSP 的质量。但在管理层打开账本之前，这仍只是推断。


              做尽调时，应把吞吐量视为强领先指标，而不是收入质量的替代品。投资者在假设软件式价值捕获之前，仍需要拆开交易经济、价差收入、平台费、客户集中度和交付成本。
