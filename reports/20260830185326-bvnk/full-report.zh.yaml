      - number: '2.2'
        title: 谁在购买、为什么购买，以及采用如何展开
        blocks:
          - type: paragraph
            body: >-
              企业买方群体越来越清晰。支付服务提供商、金融科技公司、薪资平台、市场平台、券商和资金管理需求重的企业，都出现在公开记录里，因为它们面对相似的运营问题：传统轨道慢、依赖走廊，还会占用流动性、抬高成本。在这里，稳定币作为投机资产的重要性低于作为可编程结算基础设施的重要性。薪资运营商看重工人收款速度和选择权；PSP
              和市场平台看重近实时跨境付款；财务团队看重流动性效率，以及降低对预充值余额的依赖。


              采用路径也有清晰模式。企业通常先做合规和资金管理分析，再进入单一走廊或单个产品试点；运营跑稳后，才扩展到更高交易量的付款，或更广的嵌入式钱包功能。这也是当前购买叙事中，速度压过费率节省的原因。买方想要 24/7
              结算、更少被困余额，并且更清楚地掌握资金每一步在哪里。成本仍然重要，但可靠性和合规纪律要先解决。


              实用的尽调含义是，投资者应判断那些能跨过合规、资金管理和集成门槛的企业支付流子集，而不是锚定无差别的全球代币交易量。这个更窄框架仍支撑大机会，也让采用假设保持现实。
