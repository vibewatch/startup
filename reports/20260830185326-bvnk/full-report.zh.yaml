chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、产品范围和当前足迹
        blocks:
          - type: paragraph
            body: >-
              BVNK 在官网、支付页面和 Mastercard
              收购材料中的公开定位异常一致：它不是零售加密应用，而是企业级稳定币编排平台，夹在法币轨道、区块链和业务工作流之间。公司把自己定义为一套单次集成栈，让企业在法币和稳定币余额之间发送、接收、存储、兑换、消费和获取收益。这个产品框定很关键，因为它界定了
              BVNK 的经济野心。BVNK 卖的不只是链上结算，还把抽象层、合规和集成便利卖给支付公司、市场平台、薪资平台、券商，以及不想自建银行、托管和区块链栈的企业。


              公开披露的规模指标更像一个严肃平台，而不是早期试点。BVNK 称支持 130 多个国家，并在英国、欧盟和美国拥有 40 多项牌照或注册。公司设置的准入门槛——月支付量至少
              $500,000——也说明目标客户是有体量的运营方，而不是业余商户。在当前页面上，BVNK 把稳定币放进企业级架构，作为另一条生产支付轨道，而不是实验性外挂。Mastercard 在 2026
              年买下的正是这个产品故事；这也解释了为什么战略价值先于公开财务透明度显现。
