      - number: '1.2'
        title: 管理层厚度、创始人依赖与法律实体控制
        blocks:
          - type: paragraph
            body: >-
              按后期金融科技公司标准，BVNK 的创始人可见度很高。Jesse Hemson-Struthers、Donald Jackson 和 Chris Harmse
              都在公司介绍页被直接列名，周边管理团队也披露了财务、合规、法务、商业、人才、产品、马耳他和美国扩张负责人。这种宽度是正面信号，说明 BVNK
              搭出的不是创始人驱动的商业空壳。公司看起来已经补齐受监管跨境基础设施业务所需的职能覆盖，合规重市场还配有本地高管。


              即便如此，关键人依赖仍然不低。最强的公开叙事仍围绕 Hemson-Struthers 展开：创始人、主要发言人、融资负责人，也是这个品类的战略解释者。可获得的 Companies House
              记录还显示，公开治理可见度更多停留在单个实体，而非集团全貌：这些记录显示董事变更、办公地址变更，以及 Mastercard
              交割后的重大控制人变更，但没有给出公开市场尽调所需的完整投资级治理图谱。稳妥结论是管理层厚度存在，但顶层收购故事之下的控制透明度，在公开来源中仍有限。
