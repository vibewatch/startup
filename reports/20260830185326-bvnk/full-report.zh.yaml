  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与变现包装
        blocks:
          - type: paragraph
            body: >-
              BVNK
              的公开产品组合指向多元化的企业支付收入模型，尽管精确经济性仍被藏住。平台销售全球付款、收款、钱包、实时兑换、卡联动消费和奖励。这支撑多条变现路径：交易费、外汇或价差经济、钱包或平台费、实施和支持价值，以及围绕闲置资金或资金管理优化的余额经济。面向
              MiCA 的商业政策有用，因为即便公开网站不列费率，它也确认兑换服务有正式定价或定价方法披露。


              这不是纯 SaaS
              订阅故事，也不是纯银行卡交换费故事。它是支付基础设施模型，收入确认大概率混合按使用量计费和服务型收入。这种模式有吸引力，因为变现与吞吐量和工作流集成绑定；但它也提高了分析复杂度。没有客户级合同，投资者无法干净拆分软件式经常性收入、交易收入和价差驱动收入。


              做尽调时，应把吞吐量视为强领先指标，而不是收入质量的替代品。投资者在假设软件式价值捕获之前，仍需要拆开交易经济、价差收入、平台费、客户集中度和交付成本。
