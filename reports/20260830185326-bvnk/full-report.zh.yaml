      - number: '7.3'
        title: 人员、客户集中度和 Mastercard 整合决定剩余风险
        blocks:
          - type: paragraph
            body: >-
              BVNK
              有一支看得见的创始人班底，也公开了具名职能负责人；但关键人物依赖仍然真实存在，因为创始团队仍撑着公司叙事、产品愿景和很大一部分战略可信度。客户集中度同样暧昧。标杆客户的公开证据是加分项，但这种可见度也提示：少数大型关系可能影响过大，投资者又拿不到检验下行情景所需的集中度数据。


              Mastercard
              成为所有者有利有弊。它降低融资风险，也很可能提高机构信任，但同时带来整合风险、战略优先级风险，以及客户对中立性的顾虑——有些客户并不想深度依赖一家大型网络所有者。正因为这种双重性，残余风险评级仍为高，而不会因为公司找到了战略买方就简单降到中。


              因此，正确的风险框架既不是加密恐慌，也不是收购后松懈。投资问题在于：当周围监管和竞争环境继续机构化，BVNK 能否守住合规优势、客户信任和产品速度。


              残余评级维持高位，是因为几条下行路径彼此相关，并非相互独立。政策变化、合作伙伴中断或创始人交接，都可能同时挤压客户信心。因此，监控和缓释纪律比任何单一的标题风险标签更重要。


              重要的是，这些风险并不都同向移动。监管改善可以降低法律模糊性，同时抬高合规成本。Mastercard
              入主可以降低融资风险，同时抬高整合和中立性风险。更强的具名客户可以验证平台，也会提高集中度敏感性。因此，本章真正想说的不是 BVNK
              格外脆弱，而是公司站在几套外部系统的交汇处，这些系统可能各自变化。好的尽调应逐项检验管理层是否为每个依赖关系准备了明确应急方案，而不是假设战略退出自动解决了一切。
