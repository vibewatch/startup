              客户的客户群。这些不只是探索性试点，而是真实运营部署的信号。


              其余客户名单需要更谨慎处理。Flywire 被 BVNK 和 Mastercard 点名，但没有找到专门案例研究。Rapyd、Thunes、Bitso、dLocal、LianLian Global、Equals
              Money、IC Markets、XM 和 Trust Payments 等名字是正面指标，但证据深度更弱。正确做法是按工作流具体性、新鲜度和独立性给客户证明加权，而不是按原始客户标识数量计分。


              实际上，客户问题不在于需求是否存在，而在于需求有多耐久、多分散。因此，下一层尽调应把强公开客户证明转化为细分经济性、集中度分析和重复使用证据，从而支撑完整投资判断。
