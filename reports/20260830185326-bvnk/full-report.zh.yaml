      - number: '1.3'
        title: 融资路径、收购结果与客户证明
        blocks:
          - type: paragraph
            body: >-
              BVNK 的资本路径显示，公司大约五年内从风险资本支持的品类押注，走成了战略收购标的。最干净的硬融资事实是 2024 年 12 月的 Series B 轮融资：BVNK 披露了 Haun Ventures 领投的
              $50 million 融资，Coinbase Ventures、Scribble Ventures、DRW Venture Capital、Avenir 和 Tiger Global 参与。Visa 和
              Citi Ventures 在 2025 年追加战略投资，绝对金额不如信号价值重要。这些投资者验证了一个判断：稳定币基础设施正在变成主流支付管道的一部分。


              战略结果更重要。Mastercard 宣布以最高 $1.8 billion 收购 BVNK，其中包括 $300 million 或有对价，之后又确认交易已经完成。这笔交易是 BVNK
              跨过独角兽门槛的第一个确定性公开证明；此前公开提到的 Series B 轮估值约 $750 million，仍低于 $1 billion。客户证据解释了战略溢价从何而来。Worldpay、Deel 和
              Corpay 分别描述了围绕付款、薪资、钱包或资金管理的具体生产用途，BVNK 自己的 2025 年回顾也补充了具名企业用户和 $30 billion
              年化稳定币交易量指标。公开收入披露仍然很薄，但平台的商业价值并不薄。这个框架也让收购、融资和客户里程碑，在报告后文保持一致。


              实用的尽调视角，是把已经清楚证明的事实和仍需推断的部分分开。已证明：BVNK
              有真实受监管足迹、真实具名客户、真实吞吐量披露，并以超过上一轮报道私人估值两倍的价格完成战略退出。仍需推断：精确收入、利润率质量，以及客户广度而不是少数旗舰账户，在多大程度上推动了头部叙事。这个区分仍支撑正面概览，因为公司已经从有意思的基础设施故事，跨到被验证的战略资产。
