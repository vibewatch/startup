      - number: '6.3'
        title: 耐久性、扩张，以及仍未知的部分
        blocks:
          - type: paragraph
            body: >-
              最强的公开耐久性信号不是留存率，而是运营强度。一个处理 $30 billion 年化稳定币交易量、2.8 million
              笔交易的平台，不太可能完全由试点构成。公开客户叙事也暗示落地后扩展逻辑：先赢下付款或结算工作流，再拓宽到钱包、资金管理或相邻的面向用户产品。这在战略上有吸引力，因为它能随着时间推高切换成本和产品挂载。


              但客户尽调的主要缺口仍然很大。NRR、GRR、流失、客户满意度和集中度都未披露，最可见的证明又是由大型对手方牵头的合作伙伴叙事。因此，客户质量看起来不错，但围绕集中度和渠道依赖的下行情景，仍需要管理层直接提供证据。投资者应把客户章节视为支持性强，但尚未完全闭合。


              实际上，客户问题不在于需求是否存在，而在于需求有多耐久、多分散。因此，下一层尽调应把强公开客户证明转化为细分经济性、集中度分析和重复使用证据，从而支撑完整投资判断。


              最强的后续工作，是把公开客户证明转成量化账户地图。这意味着衡量活跃账户、使用集中度、部署深度、续约行为，以及直接客户与合作伙伴放大分销渠道之间的组合。


              客户质量结论要同时承认两件事。第一，BVNK
              的公开证明强于许多私人基础设施供应商，因为几个具名客户描述了真实、接近生产状态的工作流。第二，已披露证据相对组合统计，仍过度偏向明星案例。因此，正确的客户结论是正面但有边界：公司已经令人信服地为可信运营方解决了重要问题，但投资者仍需要队列数据和账户级集中度分析，才能知道这些胜利能否推广到全客户盘子，还是主要由一小组战略关系承载。
