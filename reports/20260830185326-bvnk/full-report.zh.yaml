  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与公开可见规模
        blocks:
          - type: paragraph
            body: >-
              BVNK 的客户群不是泛泛的加密客户名单拼盘。公开记录指向一组相对连贯的细分：PSP
              和付款处理商、薪资平台、资金管理需求重的跨境运营方、市场平台、金融科技平台，以及券商或数字资产业务。这些买方都需要更快结算、跨境触达、钱包功能，并降低对银行营业时间约束的依赖，只是组合各有不同。这个分层逻辑，在
              BVNK 自己的产品页面和具名客户公告中保持一致。


              公开规模数据有帮助，但不完整。BVNK 披露 2025 年新增 226 个客户、$30 billion 年化支付量和 2.8 million
              笔交易，年底美国交易量占三分之一。这些都是强采用信号，但还没有给到投资者最想要的数字，例如总活跃客户数、按收入划分的细分组合，或头部账户集中度。结果是客户故事明显真实，却还没有被清晰量化。


              实际上，客户问题不在于需求是否存在，而在于需求有多耐久、多分散。因此，下一层尽调应把强公开客户证明转化为细分经济性、集中度分析和重复使用证据，从而支撑完整投资判断。
