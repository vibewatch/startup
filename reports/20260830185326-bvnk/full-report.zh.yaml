  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与正确的规模口径
        blocks:
          - type: paragraph
            body: >-
              “稳定币支付”是一个容易显得宽泛的标签。BVNK
              要看的市场不是全部加密活动，甚至不是全部稳定币交易量。更站得住脚的边界是企业级编排：这一层让企业在法币和稳定币之间切换，管理钱包和资金，并把新轨道接入现有付款、薪资、结算和结账工作流。这个边界排除了投机交易和大多数消费者代币投资行为，但仍捕捉到
              Mastercard、Worldpay 和 Corpay 实际押注的企业基础设施价值。


              在这个定义下，多组市场规模口径都重要。Mastercard 提到 2025 年数字货币支付用例至少 $350 billion，BVNK 提到 2024 年稳定币支付为 $5.2 trillion、总稳定币交易为
              $24 trillion，Chainalysis 则估算 2025 年调整后的真实经济活动为 $28
              trillion。只要把它们看作逐层变宽的定义，这些数字并不矛盾。投资结论是：市场现在已经足够大，未来也可能极大；但想要精确判断，就必须把范围说清楚，不能把万亿美元数字当作同一口径反复引用。


              实用的尽调含义是，投资者应判断那些能跨过合规、资金管理和集成门槛的企业支付流子集，而不是锚定无差别的全球代币交易量。这个更窄框架仍支撑大机会，也让采用假设保持现实。
