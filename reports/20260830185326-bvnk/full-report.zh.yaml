  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑有战略强度，但披露不足以支撑买入
        blocks:
          - type: paragraph
            body: >-
              BVNK 的正向逻辑很容易讲清楚。公司搭出一套宽口径企业稳定币技术栈，拿到有分量的牌照覆盖，赢下 Worldpay、Deel、Corpay
              等可信客户，又正好踩中品类拐点——稳定币支付开始对全球现有巨头具备战略意义。这个组合足以让 Mastercard 在据报道 $750 million 的 Series B 标记仅 15 个月后，给出最高 $1.8
              billion 的价格。BVNK 不是一家碰巧找到买家的弱公司；它看起来是在强战略窗口里执行到位的公司。


              反向逻辑同样重要。公开财务披露始终没有追上战略叙事。投资者仍缺少经审计的收入、利润率、客户集中度和留存数据，也看不清优先股悬挂和交割后自主权。这些缺口很关键，因为好公司不等于任何价格都值得买入。公共证据能支撑的最强结论，是正面但必须守价格纪律。


              因此，估值也要同时用战略和财务两副镜头来看。已经发生的结果验证了稀缺性和市场时点，但纪律问题仍是：溢价中有多少来自可持续经济性，又有多少来自市场周期关键节点的战略急迫感。
