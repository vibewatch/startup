      - number: '8.2'
        title: 估值语境更支持战略价值，而不是纯财务可比
        blocks:
          - type: paragraph
            body: >-
              估值语境在方向上异常清楚，尽管细部经济性仍不完整。约 $750 million 的 Series B 形成了硬性的准独角兽锚点；最高 $1.8 billion 的 Mastercard
              交易形成了硬性的战略退出锚点。短时间内的跃升非常显著。最合理的解释是，BVNK 把稀缺牌照、增长中的吞吐量、可信企业客户和品类时点组合到一起，而大型支付巨头很难靠内部自然复制。


              可比框架也支持这个判断。Stripe 以约 $1.1 billion 收购 Bridge，验证了市场对稳定币编排的战略胃口。S&P 提到 Zero Hash 约 $1 billion
              的私人估值，为品类提供了另一个参照点。Circle 推进托管支付，Fireblocks 定位企业基础设施，都说明现有巨头和基础设施提供商正汇聚到同一组问题上。因此，对战略买家来说，BVNK
              的出售价格在方向上说得通，哪怕公开收入数据太弱，不足以支撑金融买家的精确 DCF 思维。


              因此，估值也要同时用战略和财务两副镜头来看。已经发生的结果验证了稀缺性和市场时点，但纪律问题仍是：溢价中有多少来自可持续经济性，又有多少来自市场周期关键节点的战略急迫感。
