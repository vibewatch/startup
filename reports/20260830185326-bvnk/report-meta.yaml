  topStrengths:
  - Strong product breadth across payouts, wallets, conversion, cards, and compliance-oriented orchestration.
  - Credible enterprise customer proof from Worldpay, Deel, and Corpay plus a material licensing footprint.
  - Strategic validation from Haun, Visa, Citi, and ultimately Mastercard at up to a $1.8B outcome.
  topRisks:
  - Audited revenue, margin, concentration, and retention data remain materially under-disclosed in public sources.
  - Regulatory intensity and multi-jurisdiction compliance remain structural rather than solved risks.
  - Mastercard integration can improve distribution while also creating neutrality and roadmap-dependence risk.
  - External bank, stablecoin, and blockchain dependencies can still transmit operational shocks into customers and economics.
  unresolvedGaps:
  - Audited FY2025 / TTM 2026 revenue, gross margin, and customer concentration by segment.
  - Cap table, preference stack, and pre-close investor-return bridge.
  - Post-close roadmap autonomy, retention packages, and integration PMO detail.
  - Incident history, fraud-loss data, and corridor-level regulatory examination outcomes.
