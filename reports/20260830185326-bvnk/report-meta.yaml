  productSummary: BVNK offers enterprise stablecoin infrastructure for sending, receiving, storing, converting, spending, and earning across fiat and on-chain payment workflows, including payouts, wallets, cards, and treasury operations.
  customerFocus: Fintechs, payment service providers, payroll platforms, marketplaces, brokerages, and treasury-heavy enterprises.
  businessModel: Enterprise contract-driven monetization across payment orchestration, conversion, wallet infrastructure, card-linked workflows, and related compliance or treasury services.
  stage: Late-stage private / strategic-acquisition target
  fundingStatus: BVNK raised a $50 million Series B in 2024, added strategic backing from Visa and Citi in 2025, and was acquired by Mastercard in 2026 for up to $1.8 billion.
