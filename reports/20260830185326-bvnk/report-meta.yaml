companyProfile:
  summary: BVNK is a London-founded enterprise payments infrastructure company that connects fiat rails and stablecoin rails through one regulated product stack. Before its 2026 sale to Mastercard, the company assembled a broad product surface across payouts, acceptance, wallets, conversion, cards, and rewards, paired that with UK, EU, and US licensing, and won credible enterprise customers such as Worldpay, Deel, and Corpay.
  foundedDate: '2021-01-01'
