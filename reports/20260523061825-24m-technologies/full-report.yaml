            body: >
              MIT Technology Review (March 2026) and a Branford Group auction listing (June 2026) confirm that 24M
              Technologies entered complete closure. The company has not issued a public statement, co-founder Yet-Ming
              Chiang declined to comment, and email and phone inquiries went unanswered. Assets including equipment, IP,
              and facilities are being auctioned. This represents a total loss scenario for equity holders and raises
              questions about the fate of technology licenses held by Kyocera, Volkswagen, Fujifilm, Freyr, and Lucas
              TVS.
