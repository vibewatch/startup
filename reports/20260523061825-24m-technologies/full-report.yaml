      - number: '5.4'
        title: IP Position and Academic Foundation
        blocks:
          - type: paragraph
            body: >
              24M's intellectual property estate comprised 700+ patents and patent applications as of the company's last
              disclosed update, spanning SemiSolid electrode composition and manufacturing, ETOP pack integration,
              Impervio separator architecture, Eternalyte electrolyte formulation, LiForever recycling methods, and
              lithium-metal cell designs. The foundational IP originates in MIT research: Yet-Ming Chiang, W. Craig
              Carter, and Mihai Duduta published the seminal "Semi-solid lithium rechargeable flow battery" paper in
              Advanced Energy Materials (1[4]:511–516, 2011), which established the SemiSolid concept and is the
              scientific basis for the company's patent estate. Two foundational patents — US 8,722,226 and US 8,722,227
              (high energy density redox flow device, issued May 2014) — are co-assigned to 24M from MIT research.
              Chiang, listed as inventor on more than 1,250 patents across his career according to PatSnap, contributed
              the theoretical framework for SemiSolid electrodes and the asymmetric lithium-metal / SemiSolid cathode
              cell architecture (Grant 11,394,049).

              USPTO filings for 24M Technologies, Inc. document an active patent programme through 2022–2024 covering
              electrochemical slurry compositions, continuous and semi-continuous electrode production methods,
              separator seals, overcharge protection mechanisms, current-interrupt devices, and methods for
              electrochemical cell remediation. The breadth of claims suggests 24M focused on securing process IP
              (manufacturing steps) rather than material IP (specific chemistries), consistent with a licensing model in
              which partners supply their own cathode and anode materials. However, since the company entered closure
              with no disclosed IP acquisition, the disposition of the patent estate — whether sold, licensed, or held
              in wind-down — is unknown as of the research anchor date of 2026-05-23.
