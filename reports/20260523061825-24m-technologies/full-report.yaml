      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: IP Auction — Highest Residual Risk from Closure
            body: >
              The June 2026 open auction of 24M's 700-plus patent portfolio is the most consequential near-term risk
              from the closure. If a Chinese battery manufacturer or patent assertion entity acquires the foundational
              SemiSolid, Impervio, and ETOP patents, the resulting IP position could restrict US battery technology
              development, generate licensing litigation against legitimate manufacturers, or be used to block competing
              US innovations. No defensive purchasing consortium, government right-of-first-refusal, or restricted
              auction process has been publicly announced.
            calloutType: insight
            claimRefs:
              - CR037
              - CR001
          - type: callout
            title: FREYR Termination — Thesis-Break Event That Preceded Closure
            body: >
              FREYR Battery's termination of both license agreements with 24M in November 2024 — paying $3 million and
              forfeiting nearly seven million preferred shares — was the single most decisive event preceding the March
              2026 closure. FREYR had been 24M's primary US and European production pathway. Its subsequent pivot to
              solar module manufacturing signals that the licensee judged battery manufacturing economics as
              structurally unworkable against Chinese competition, not merely that 24M's specific platform was
              insufficient. Any investor evaluating 24M's IP auction should treat FREYR's exit as evidence of a market
              failure, not a platform failure.
            calloutType: insight
            claimRefs:
              - CR003
              - CR020
              - CR021
          - type: callout
            title: Chinese Battery Cost Advantage — Structural, Not Cyclical
            body: >
              CATL and BYD's collective 59% global battery market share as of Q1 2026, combined with cell prices
              approaching $50/kWh, represents a structural competitive advantage built over two decades of integrated
              supply chain investment, domestic lithium and cathode material access, and government industrial policy.
              This cost position cannot be addressed by a technology licensing model that requires licensees to fund
              their own gigafactories in higher-cost markets without matching supply chain integration. The IRA's 45X
              credits were the primary offset mechanism; their rollback risk removes the final economic lever that made
              US-licensed battery manufacturing commercially viable.
            calloutType: insight
            claimRefs:
              - CR009
              - CR010
              - CR014
              - CR018
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Series H Valuation Context and Implied Metrics
        blocks:
          - type: paragraph
            body: >
              In September 2024, 24M Technologies closed its $87 million Series H at a $1.3 billion post-money
              valuation, achieving unicorn status. The round was led by Nuovo+, an affiliate of PTT and Global Power
              Synergy PCL (GPSC), which contributed $51.1 million — proceeds from the simultaneous sale of its Rayong,
              Thailand battery pilot facility back to 24M. This circular structure means only approximately $35.9
              million represented genuinely new external capital, while the balance was a balance-sheet reclassification
              of an acquired asset. The Series H headline valuation of $1.3 billion implies a dilution of roughly 6.7%
              per the announced round size — consistent with a late-stage minority preferred round with meaningful
              preference overhang from prior rounds.

              The $1.3 billion valuation rested on four pillars: (1) 24M's 700+ patent IP portfolio covering SemiSolid,
              ETOP, Impervio, and Eternalyte technologies; (2) anticipated licensing revenue from existing and future
              partners including Kyocera, Volkswagen, Fujifilm, and Nuovo+; (3) strategic optionality as a
              chemistry-agnostic battery technology platform; and (4) a positive macro environment for domestic battery
              manufacturing supported by IRA manufacturing tax credits and EV demand growth expectations. By March 2026
              — only 18 months later — all four pillars had materially eroded: the licensing revenue base remained
              commercially underdeveloped, IRA support was curtailed, VW and Fujifilm had not reached commercial
              production, and FREYR had terminated both licenses. The implied monthly cash burn of $4–7 million was
              unsustainable given the licensing revenue base. No Series I or follow-on round was announced or closed.

              Using industry revenue multiples applicable to IP licensing businesses (5–15x revenue), the $1.3 billion
              valuation would require annual recurring royalty and licensing revenue of approximately $87–260 million to
              be supported at entry-level multiples. No evidence supports revenue at this scale; the only confirmed
              commercial royalty stream — Kyocera's ~200 MWh/year Enerezza production — would generate single-digit
              millions at standard per-kWh royalty rates. The valuation was therefore primarily an option-value and
              strategic-premium construct, not an evidence-supported revenue-multiple valuation. This is common for
              pre-commercial deep-tech licensors but makes the valuation acutely vulnerable to any slowdown in licensing
              commercialisation.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
