  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Shutdown, Liquidation, and Asset-Sale Risk
        blocks:
          - type: paragraph
            body: >
              24M Technologies' closure risk has materialized completely: by March 2026 the company had entered
              wind-down proceedings, and a public auction of all assets managed by the Branford-Marcotte Group through
              BidSpotter is scheduled to commence June 29, 2026. The auction encompasses all company property at the
              Cambridge, Massachusetts headquarters — including manufacturing equipment, laboratory instruments,
              pilot-line machinery, furniture, and fixtures. AuctionZip listings corroborate the scope and date. MIT
              Technology Review's March 2026 article on the US battery industry explicitly identified 24M as a company
              that has shut down, describing the failure as illustrative of a broader contraction in battery startup
              capital rather than an isolated management failure. Archyde's independent analysis similarly characterizes
              24M's closure as resulting from the convergence of scale-up risk, adverse market timing, and over-reliance
              on a licensing model that left commercial execution entirely in partners' hands. The most acute near-term
              risk from the liquidation perspective is the disposition of 24M's 700-plus patent portfolio. An open
              auction could allow a competitor Chinese battery manufacturer, an incumbent cell maker, or a patent
              assertion entity to acquire foundational IP covering the SemiSolid manufacturing process, Impervio
              separator, Eternalyte electrolyte, and ETOP architecture. Such an acquisition could restrict future US
              battery innovation or generate licensing litigation against legitimate manufacturers. The legal risk
              register (TR001) captures the full regulatory and legal exposure, including unresolved questions about
              ARPA-E grant milestone compliance, potential clawback obligations, and pending litigation from the
              closure. The risk heatmap (FR001) summarizes the combined severity and likelihood profile across all risk
              categories. The convergence of FREYR termination, EV market slowdown, Chinese battery cost deflation, and
              the Series H circular structure created mutually reinforcing failure conditions that no single management
              action could have reversed.
