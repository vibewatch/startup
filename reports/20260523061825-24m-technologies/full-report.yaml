          material to recovery
        - Commission independent IP valuation from Anaqua, CPA Global, or similar; monitor USPTO assignment records
      - - Preference stack waterfall at closure
        - >-
          Total cumulative preferred stock liquidation preferences from 12+ rounds are not publicly disclosed; critical
          to understanding Series H recovery
        - >-
