        - Moderate
        - Kyocera ESS uses LFP-compatible SemiSolid; no Li-metal or NMC licensee reached commercial scale
      - - Asset-light licensing model limits 24M's capital intensity
        - Licensee capital requirements ($2B+ per viable gigafactory) remain high; 24M cannot control licensee execution
        - Critical
        - >-
          FREYR's $2.6B factory was too capital-intensive given market conditions; 24M had no mechanism to fund or
          rescue licensee execution
      - - First-mover advantage in SemiSolid as a manufacturing process category
        - >-
          QuantumScape (solid-state) and Sila (silicon anode) attracted comparable OEM attention for competing process
          innovations; 24M was not the only game in advanced battery process licensing
        - Moderate
        - >-
          QuantumScape retained $971M cash and active licensing pipeline after 24M closure; Sila opened US factory;
          24M's first-mover position did not translate to sustained OEM adoption
      - - Government grants (DOE, ARPA-E) validate technology and support R&D
        - >-
          Government grants provide validation but not commercial revenue; competitors (Sila: $120M+ DOE, QuantumScape:
          government contracts) also received significant public funding
        - Low
        - >-
          DOE/ARPA-E funding did not prevent closure; government programs validated technology but were insufficient
          commercial backstop
      - - Northvolt-style execution risk exists for conventional manufacturers; SemiSolid simpler to scale
        - >-
          Northvolt's collapse showed that battery manufacturing execution risk is severe regardless of approach;
          SemiSolid's relative simplicity did not create a comparable licensee advantage
        - Critical
        - >-
          Northvolt failed with $15B raised and $50B in orders using conventional technology; 24M's simpler process did
          not attract the scale of manufacturing partners needed for sustainability
    notes: >-
      Risk severity (Critical / Moderate / Low) is an analytical judgment based on documented commercial outcomes.
      Outcome evidence reflects publicly available information as of May 2026; private information about 24M internal
      decisions is not available.
