  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base — Segments, Relationship Types, and Buyer Profiles
        blocks:
          - type: paragraph
            body: >
              24M Technologies did not sell batteries to end-users; it licensed its SemiSolid manufacturing technology
              to industrial partners who built, marketed, and sold battery products in their own right. The company's
              direct "customers" were therefore licensees who paid an upfront technology-access fee plus ongoing
              royalties tied to production volume. This licensing model created three distinct relationship categories:

              **Commercial licensees** are partners with fully executed license agreements who have commenced some level
              of production. Kyocera is the only confirmed commercial licensee: it has manufactured and sold the
              Enerezza ESS in Japan since 2020, and its annual capacity reached approximately 20,000 units
              (approximately 200 MWh/yr) by 2024.

              **Development licensees** are partners with executed agreements who were in qualification or
              pilot-production stages at closure. These include Fujifilm (license and $20M investment, September 2022,
              leveraging precision-coating expertise for mass production qualification), Lucas TVS/TVS Indeon (license
              and Series H co-investor, battery pack assembly since August 2024 at a 1 GWh facility in Tamil Nadu,
              India, but no confirmed SemiSolid cell manufacturing), and Nuovo+/GPSC (transferred the Rayong, Thailand
              facility to 24M in exchange for ~USD 51 million in preferred equity in early 2024; pilot production
              commenced for an unnamed India-based mobility OEM with samples planned for late 2024).

              **Equity-investor partners** are entities with strategic equity stakes but no confirmed commercial
              production. Volkswagen Group acquired 25% of 24M's equity in January 2022 and positioned itself for
              SemiSolid integration into future unified-cell battery programs at PowerCo gigafactories — but no
              commercial SemiSolid production was established by closure. Asahi Kasei and Dai Nippon Printing (DNP)
              joined as Series H co-investors with stated strategic interest in materials and packaging applications
              respectively, without disclosed licensing or deployment commitments.

              **Terminated licensees** include FREYR Battery, which signed an unlimited SemiSolid license in January
              2021 for a planned 40 GWh Norway gigafactory, but mutually terminated both agreements with 24M in November
              2024, forfeiting nearly 7 million Series G preferred shares and paying $3 million to 24M.

              No end-user buyer evidence (individual households, utilities, or fleet operators) is publicly available.
              Kyocera's Enerezza end-customers are Japanese residential solar-plus-storage households; their number,
              satisfaction metrics, and contract terms are disclosed only at the aggregate capacity level.
