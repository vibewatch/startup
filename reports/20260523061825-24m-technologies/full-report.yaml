              Yet-Ming Chiang's co-founding of both A123 Systems and 24M, combined with more than 200 publications and
              60 patents, gave 24M exceptional scientific credibility and access to government funding. The CEO and
              senior leadership team collectively brought decades of lithium-ion manufacturing experience from Quallion,
              EnerDel, QuantumScape, and Samsung SDI—an unusually strong operator bench for an early-stage battery
