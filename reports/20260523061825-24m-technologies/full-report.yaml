  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview and Category Taxonomy
        blocks:
          - type: paragraph
            body: >
              The competitive landscape facing 24M Technologies maps into four distinct categories that must be analysed
              separately, because they represent different threat vectors and different buyer decision contexts.

              The first category is Chinese incumbent battery manufacturers — primarily CATL, BYD, CALB, and Ganfeng —
              who compete through manufacturing scale, vertical integration, and pricing power rather than novel process
              technology. CATL held 45.2% of global EV battery installations in January 2026 with 32.5 GWh deployed that
              month alone, and sells LFP cells at an estimated $53–56 per kWh at the factory gate. BYD, the
              second-largest, held 13.8% with 9.9 GWh. These two companies together account for nearly 60% of global EV
              battery installations. CATL and BYD are not direct product competitors to SemiSolid — they produce
              finished cells under conventional slurry-coat processes — but they are the status-quo alternatives that
              prospective 24M licensees compare against. If a battery manufacturer can source cells at $53/kWh from CATL
              or BYD, the business case for retooling manufacturing lines to 24M's SemiSolid process depends entirely on
              whether 24M's claimed 40% cost reduction would bring the licensee below the Chinese price floor, which is
              implausible for ex-China manufacturers facing higher labour, land, and energy costs.

              The second category is established Western and Korean cell manufacturers — LG Energy Solution, Panasonic,
              Samsung SDI, and SK On — that compete on technological differentiation and supply assurance for
              non-Chinese customers. LG Energy Solution held 6.6% global market share in January 2026 with 4.7 GWh,
              Panasonic held 4.3% with 3.1 GWh. These companies are simultaneously 24M's potential customers (as
              licensees) and its technological competitors, because they have internal R&D programs for advanced
              manufacturing and next-generation chemistries including solid-state. LG Energy Solution's Q1 2026 results
              showed revenue of KRW 6.6 trillion ($4.3B), with ESS batteries growing to the mid-20% share of revenue;
              they are targeting over 50 GWh of North American ESS capacity by end 2026. These companies have massive
              distribution networks, existing OEM relationships, and manufacturing scale that 24M would need to displace
              from the inside (via licensing) rather than compete against head-to-head.

              The third category is advanced-battery technology startups that compete in the same next- generation cell
              technology space: QuantumScape (solid-state lithium-metal), Solid Power (sulfide solid electrolyte), SES
              AI (lithium-metal hybrid), and Sila Nanotechnologies (silicon-carbon anode). These companies are
              technology peers rather than direct licensee competitors; they are not customers of 24M, but they compete
              for the same pool of OEM partnerships and licensee/partner attention. Their ability to attract capital,
              customers, and media attention while remaining pre-revenue (QuantumScape, Solid Power) or early-revenue
              (SES AI: $6.7M Q1 2026 revenue) indicates that the market tolerates long timelines for next-generation
              battery technology — but only for companies with demonstrated capital access and narrow technical focus.

              The fourth category is the status-quo alternative to both 24M and the advanced-battery startups:
              conventional lithium-ion manufacturing using slurry-coat electrode processes. This is not a "competitor"
              in the traditional sense, but it is the incumbent approach that all new process technologies must
              displace. Conventional LFP and NMC cell manufacturing is well-understood, continuously improving (driven
              by automation, yield improvement, and raw material sourcing), and backed by trillions of dollars in
              already-deployed gigafactory capital. The barrier to switching from conventional to SemiSolid is not just
              technology validation but the write-off of existing manufacturing infrastructure.
