  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Architecture
        blocks:
          - type: paragraph
            body: >
              24M Technologies structured its business entirely as a technology licensing company. Rather than building
              or operating gigafactories, 24M licensed its SemiSolid™ manufacturing platform, Unit Cell process, and
              associated IP (700+ patents and patent applications) to manufacturing partners. Licensees paid for the
              right to produce batteries using 24M's process and technology suite; in exchange, 24M received license
              fees and — based on standard industry practice for comparable technology licensors — ongoing royalties per
              unit or per kWh of production. Specific royalty rates, upfront license payment amounts, and
              revenue-sharing terms have never been disclosed publicly. The company itself described its model as
              "nimble and asset-light," explicitly contrasting itself with battery manufacturers that require heavy
              capital for factory construction. This approach limits 24M's capital intensity for its own manufacturing
              footprint but concentrates commercial-execution risk with licensee partners who must fund their own
              gigawatt-scale factories.

              24M's revenue streams theoretically comprised: (1) technology license fees paid at the inception of each
              licensing agreement, (2) ongoing per-unit or per-kWh royalties on licensee production volume, (3)
              engineering and development services revenues from joint-development work with partners, and (4)
              government grants covering specified R&D milestones. The only stream with any evidence of commercial-scale
              activity is the Kyocera licensing arrangement, under which Kyocera produced approximately 20,000 Enerezza
              residential energy-storage units per year using the SemiSolid process — an implied volume of roughly 200
              MWh per year. Grant income was at least $12.2 million from ARPA-E. No other revenue stream is evidenced at
              commercial scale. Revenue recognition policy, reported revenue, ARR, gross margin, and the relative
              contribution of each stream are all unavailable from public sources.
