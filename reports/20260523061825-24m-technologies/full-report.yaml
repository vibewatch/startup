      - number: '3.5'
        title: Technology Licensing Model Comparison — 24M vs. QuantumScape vs. Solid Power
        blocks:
          - type: paragraph
            body: >
              The technology licensing model in batteries — licensing manufacturing processes, electrolytes, or cell
              designs to established manufacturers rather than building and operating gigafactories — was the strategic
              thesis of 24M, QuantumScape, and Solid Power simultaneously. Comparing these three implementations reveals
              why 24M's closure was more predictable in hindsight.

              24M's licensing model required licensees to adopt a comprehensive manufacturing process change: replacing
              conventional slurry-coat electrode production with the SemiSolid electrode paste process, including new
              mixing, casting, and assembly equipment. This is a high-friction adoption requiring (i) capital investment
              in new manufacturing equipment, (ii) two-year product validation cycles with OEM customers, (iii)
              retooling of existing production lines or greenfield construction, and (iv) operator training and process
              qualification. Only Kyocera met this bar at commercial scale (400 MWh annual production after its JPY 10B
              expansion). FREYR signed a 2021 unlimited license for a 40 GWh Norway plant but mutually terminated the
              agreement in November 2024, paying 24M $3 million and forfeiting nearly 7 million shares of Series G
              preferred stock. VW's indirect 24M exposure through its participation in the Series G round did not
              convert to a commercial licensee relationship.

              QuantumScape's licensing model is structurally less demanding of the licensee in process terms:
              QuantumScape supplies the manufactured ceramic separator (via Murata and Corning) and licenses the Eagle
              Line process blueprint, enabling partners to integrate the separator into cell manufacturing without
              adopting a completely new electrode process. The Eagle Line serves as a transferable manufacturing
              template. However, QuantumScape's cells require lithium-metal anodes — which have their own handling,
              formation, and safety challenges at scale — and have not yet been demonstrated in automotive production
              volumes. The SPAC-funded public company structure gives QuantumScape access to non-dilutive at-the-market
              equity in amounts ($264M raised in 2025) that privately held 24M could not access after Series H.

              Solid Power's model is narrower than either: it sells a sulfide solid electrolyte material (electrolyte
              powder) and licenses cell designs, without requiring a licensee to adopt a new manufacturing framework.
              The Samsung SDI collaboration demonstrates this: Samsung SDI integrates Solid Power's electrolyte into
              cells it manufactures using its existing equipment, evaluated by BMW in a demonstration vehicle. This
              lower adoption friction is also Solid Power's moat weakness: electrolyte material can be replicated or
              substituted as the technology matures.

              The comparative analysis reveals a fundamental tension in the technology licensing model for batteries:
              higher process IP content creates higher moat durability but also higher adoption friction and longer
              licensee validation cycles, directly limiting the addressable licensee pool. 24M chose high IP content
              (comprehensive process licensing) and found that the pool of capable, willing, and adequately capitalised
              Western licensees was too small to sustain the business model.
