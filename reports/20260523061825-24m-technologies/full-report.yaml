      - number: '2.2'
        title: Market Sizing Lenses and Estimate Divergence
        blocks:
          - type: paragraph
            body: >
              The global lithium-ion battery market is among the most contested in market research due to definitional
              inconsistency. Published 2026 estimates span a three-fold range: Custom Market Insights places the market
              at $83 billion, Mordor Intelligence at $136 billion, and Fortune Business Insights at $207 billion. These
              divergences reflect differing inclusions of battery pack assembly vs. cell manufacturing, installed base
              vs. new shipments, and the treatment of Chinese domestic markets. For diligence, the most useful lens is
              production-volume metrics rather than revenue estimates, as cell prices are declining rapidly and
              revenue-based TAMs are collapsing even as volume grows.

              BloombergNEF's 2025 battery price survey provides the most granular volume-to-price bridge: global pack
              prices fell 8% in 2025 to a record low of $108/kWh, and BNEF forecasts a further 3% decline to $105/kWh in
              2026. Stationary storage pack prices dropped 45% to $70/kWh in 2025, the sharpest decline across any
              segment, making grid storage the lowest-priced segment for the first time. Average LFP pack prices were
              $81/kWh and NMC packs $128/kWh. China-manufactured packs averaged $84/kWh while North American packs were
              44% higher and European packs 56% higher, reflecting tariff and supply-chain cost differentials.

              For the ESS deployment market specifically, BloombergNEF's October 2025 outlook projected global energy
              storage additions of 123 GW / 360 GWh in 2026, representing 33% growth over 2025 (which itself saw 92 GW /
              247 GWh added). InfoLink Consulting projects global ESS cell shipments of 801 GWh and installations of 353
              GWh in 2026 — consistent in installation volume with the BNEF estimate. The IEA's Global Energy Review
              2026 confirmed 108 GW of new battery storage deployed in 2025, 40% more than 2024 (itself a record); LFP
              batteries now account for approximately 90% of deployments and around 80% of new 2025 capacity was
              utility-scale. The US grid-scale BESS market faces near-term headwinds: Wood Mackenzie (Q2 2025) warned of
              a potential 29% contraction in US utility-scale deployments in 2026 due to tariff uncertainty and FEOC
              restrictions on Chinese battery content; BNEF was more optimistic following the July 2025 budget bill that
              preserved storage investment tax credits through the 2030s.

              For the EV battery segment, the Business Research Company estimates the global EV battery market at $108
              billion in 2026, with Grand View Research estimating $198.9 billion by 2030 at 21.8% CAGR. However, these
              revenue forecasts must be contextualized against physical market realities: US EV sales fell 4% in 2025 —
              the first decline in a decade — after the federal purchase tax credit expired in September 2025, and
              automakers collectively wrote down more than $50 billion in EV-related capital. The Battery Research
              Company (Dallas Fed) reports more than 10 announced US gigafactory projects have been officially canceled,
              representing $10+ billion in abandoned investment.

              24M's SAM (serviceable addressable market) as a technology licensor is not independently disclosed and is
              not directly derivable from headline TAM figures. A licensor's SAM is the total royalty or licensing
              revenue opportunity across manufacturing capacity that adopts the licensed process — a figure requiring
              knowledge of industry-wide adoption rates, per-GWh licensing fee structures, and competition from
              incumbent processes. Neither 24M nor any third party has published this figure; the evidence gap is
              material and is preserved in the diligence gaps section.
