      - number: '6.4'
        title: GTM Model, Revenue Architecture, and Customer Journey
        blocks:
          - type: paragraph
            body: >
              24M's go-to-market was exclusively B2B licensing, targeting battery manufacturers and automotive OEMs
              rather than building downstream battery products. The customer journey followed a multi-year funnel: (1)
              technical evaluation and feasibility alignment, (2) license agreement execution with upfront fee payment,
              (3) pilot/qualification cell production using 24M process know-how and tooling support, (4) regulatory and
              product qualification, and (5) commercial-scale production with ongoing royalty payments to 24M per unit
              or per kWh.

              Revenue from this model was twofold: upfront license fees (undisclosed for all partnerships except the
              FREYR termination payment of USD 3 million) and per-unit or per-kWh royalties from licensees in commercial
              production. The Kyocera relationship was the only confirmed active royalty-generating channel. Royalty
              rates, minimum volumes, and contract durations were not publicly disclosed for any licensee.

              The Series H financing structure reinforced the GTM alignment: five of the six Series H co-investors
              (Kyocera, Asahi Kasei, DNP, Lucas TVS, Mitsui O.S.K. Lines) were or were expected to become licensees or
              supply-chain partners, meaning investor capital and licensee relationships were deeply intertwined. Nuovo+
              led the round and was both the largest single investor and the Thailand facility seller. This dual-role
              structure created potential conflicts of interest between investor governance rights and commercial
              licensing terms.

              The channel architecture was entirely direct: no distributor, reseller, or integrator layer existed
              between 24M and its industrial licensees. End-market channel responsibility sat entirely with licensees
              (e.g., Kyocera sold Enerezza through its own solar-plus-storage distribution network; Lucas TVS sold EV
              battery packs through OEM supply agreements). 24M had no direct customer relationship with the households,
              automotive OEMs, or fleet operators who ultimately used the battery products.
            claimRefs:
              - CU027
              - CU028
              - CU029
              - CU030
              - CU031
              - CU032
