      - number: '4.5'
        title: Capital Adequacy Assessment and Adverse Financial Evidence
        blocks:
          - type: paragraph
            body: >
              Capital adequacy cannot be assessed directly from public sources. 24M does not disclose cash balances,
              monthly burn rate, or expected runway. However, the timeline of observable events allows inference about
              the severity of its capital constraint.

              The Series H financing closed September 5, 2024, raising $87 million at a $1.3 billion post-money
              valuation. Of that $87 million, approximately $51.1 million was effectively recycled from the Thailand
              facility sale to Nuovo+ and reinvested as equity, leaving the net cash inflow from third-party investors
              at approximately $35.9 million. The company also assumed ownership of a facility with ongoing operational
              costs.

              The company entered closure by March 2026 — at most 18 months after the Series H close, and potentially as
              few as 12–15 months if some capital was consumed by transaction costs and facility setup. This implies a
              minimum monthly net cash burn of approximately $4–7 million if the entire Series H were treated as
              operating runway — or substantially higher if the facility acquisition cost is excluded. These are
              estimates, not reported figures.

              The Branford Group complete-closure auction was scheduled from June 15 to June 18, 2026, covering assets
              at three 24M locations: 26 Dartmouth Street Westwood MA 02090, 29 Esquire Road Billerica MA 01821, and 8
              Roosevelt Avenue Hudson NH 03051. Auction assets include advanced battery manufacturing equipment,
              robotics (Fanuc LR Mate 200iD), battery testers (Maccor Series 4000H, Neware), laboratory and R&D
              equipment, machine shop tools, and facility infrastructure with multiple items dated 2024 — indicating
              capital investment through at least August 2024.

              The broader venture capital context is adverse: Mercom Capital reported that VC funding for energy storage
              companies totaled $2.4 billion in the first half of 2024, a 37% decrease year-over-year from $3.8 billion
              in 1H 2023. MIT Technology Review and Archyde attributed the closure to investor pullback, IRA incentive
              rollbacks, a cooling EV market, and the structural difficulty of converting technology licensing to
              commercial-scale manufacturing validation.
