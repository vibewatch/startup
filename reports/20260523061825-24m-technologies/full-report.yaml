      - number: '1.3'
        title: Funding History and Investor Map
        blocks:
          - type: paragraph
            body: >
              24M has raised more than $500 million across twelve or more funding rounds since 2010, combining
              institutional venture capital, strategic corporate investment, and US government grants. The most recent
              round, a Series H Preferred Stock financing led by Nuovo+, closed on 5 September 2024 and raised $87
              million at a $1.3 billion post-money valuation, making 24M a unicorn-class private company at that point.

              The Series H co-investors—Kyocera Corporation (returning), Asahi Kasei, Dai Nippon Printing (DNP), Lucas
              TVS, and Mitsui O.S.K. Lines—are predominantly Japanese and Indian industrial corporates with direct
              stakes in battery supply chains. Volkswagen Group acquired a 25% equity stake as part of a strategic
              Series F in January 2022, becoming the largest single external equity holder and signalling OEM-level
              validation of the SemiSolid approach. Fujifilm invested $20 million in September 2022 and received a
              license for the SemiSolid platform, leveraging its precision-coating manufacturing heritage. Freyr, the
              Norwegian battery gigafactory developer, signed a licensing agreement in January 2021 granting unlimited
              production rights to current and future 24M technologies for a planned 40 GWh plant in Norway.

              Government funding supplemented private capital: 24M received a $9 million ARPA-E SCALEUP grant in June
              2023 for high-energy-density lithium-metal anode cells targeting electric aviation, and a separate $3.2
              million ARPA-E EVs4ALL award to develop sodium-metal batteries in partnership with MIT and Carnegie Mellon
              University. These grants reflected federal support for domestic advanced battery supply-chain development
              under the Bipartisan Infrastructure Law and Inflation Reduction Act framework.

              The heavy weighting of Asian industrial corporates among investors suggests the licensing model was better
              suited to Asian manufacturing ecosystems than US ones—a dynamic that likely contributed to the company's
              difficulty finding a US-based commercial anchor before the 2026 closure.
