      - number: '3.2'
        title: Chinese Incumbent Competition — CATL, BYD, and Pricing Power
        blocks:
          - type: paragraph
            body: >
              CATL's competitive position in 2026 represents the most severe structural threat to any Western
              advanced-battery manufacturing startup. With a 45.2% global EV battery market share in January 2026 and a
              domestic China market share of 50.1% in Q1 2026 — its highest in five years — CATL operates at a scale and
              cost structure that no licensing-model company can match or credibly threaten in the medium term. Chinese
              LFP cells from CATL trade at an estimated $53–56 per kWh at the factory gate in 2026, compared to global
              average pack prices of approximately $105/kWh across all chemistries (BNEF). US-manufactured cells carry a
              structural cost premium of approximately 56% versus Chinese equivalents according to Benchmark Mineral
              Intelligence, creating a price gap that persists even after accounting for US tariffs on Chinese battery
              imports.

              CATL's cost leadership is anchored in three structural advantages: (i) massive economies of scale with
              China's total battery manufacturing capacity estimated at approximately 3.1 terawatt-hours, far exceeding
              global demand, creating margin cushion through high throughput; (ii) vertical integration into raw
              materials including cathode and anode material production, which allows CATL to capture manufacturing
              margin across the value chain; and (iii) continuous Cell-to-Pack (CTP) innovation that eliminates
              module-level packaging, the same objective that 24M's ETOP platform targets, but at orders-of-magnitude
              larger commercial scale. CATL's Shenxing and Qilin battery platforms offer 10–80% charging in under four
              minutes, demonstrating ongoing performance innovation that competes with the energy-density and cycle-life
              claims of advanced-battery startups.

              BYD, the world's second-largest battery manufacturer with 13.8% global market share, presents a distinct
              competitive profile. BYD's Blade LFP battery eliminates conventional prismatic cell module structures,
              achieving safety benefits through cell-to-pack integration in a way conceptually similar to 24M's ETOP
              claims but in LFP chemistry and at massive commercial scale. BYD's key structural advantage is vertical
              integration into vehicle manufacturing: by consuming the majority of its battery output internally, BYD
              captures full margin across the battery-vehicle stack, avoiding inter-company transfer pricing
              inefficiencies that third-party suppliers like 24M's licensees face. BYD's Q1 2026 China domestic market
              share of 17.5% was down year-on-year — reflecting CATL's dominance — but its global brand and cost
              position remain formidable.

              The CATL/BYD pricing floor effectively defines the economic boundary within which 24M's technology
              licensing proposition must operate. No Western battery licensee can achieve $53–56/kWh for cells at
              commercial scale, with or without SemiSolid process advantages. The realistic case for SemiSolid licensing
              is a cost advantage versus other Western manufacturers — not versus Chinese incumbents — and this limits
              the addressable licensee pool to companies manufacturing outside China for non-Chinese markets. This
              structural constraint was a core element of 24M's commercial execution challenge.
