      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >
              24M was co-founded in 2010 by Yet-Ming Chiang, Throop Wilder, and W. Craig Carter. Chiang, the Kyocera
              Professor of Materials Science and Engineering at MIT, previously co-founded A123 Systems, whose IPO gave
              him direct visibility into the scale-up complexities of battery manufacturing and inspired the SemiSolid
              simplification thesis. He holds more than 60 patents and has published more than 200 scientific articles;
              he serves as Chief Scientist at 24M. Wilder, a serial entrepreneur whose prior companies were acquired by
              Cisco and BCSI, co-founded 24M and served as CEO before transitioning to Executive Chairman. Carter, an
              MIT POSCO Professor, contributed the theoretical framework for the SemiSolid flow concept and consulted
              for several years.

              Naoki Ota serves as President and CEO. Ota co-founded Quallion, the first US-based lithium-ion battery
              manufacturer (serving medical and aerospace markets), and later served as CTO and COO of EnerDel, where he
              built 1 GWh production capability. Richard Chleboski (CFO) previously co-founded Evergreen Solar, leading
              it through an IPO and growing its market cap to over $1 billion.

              The leadership roster reflects deep battery-industry domain expertise across cell chemistry, manufacturing
              scale-up, and capital formation. Yet-Ming Chiang's dual role—active MIT professor and company
              co-founder—represents a key-person concentration risk: his academic eminence helped attract strategic
              investors and government funding, but his refusal to comment on the record about the 2026 shutdown
              illustrates the opacity of governance at closure. No independent board member names are publicly
              disclosed; investor board-seat holders are inferred from major shareholders but not confirmed.
