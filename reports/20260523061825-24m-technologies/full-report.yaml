              24M's decision to license technology rather than build its own gigafactories limited capital intensity but
              created dependence on partners' operational and financial capacity. With Freyr facing its own difficulties
              and no confirmed US-based gigafactory anchor, the licensing model appears to have been insufficient to
              generate the revenue required to sustain operations when investor appetite contracted in 2025–2026.
