      - number: '7.3'
        title: Partner and Commercial Dependency Risks
        blocks:
          - type: paragraph
            body: >
              24M's asset-light licensing model concentrated every commercial execution risk with its licensee partners
              — and by the time of closure, that dependency had proven fatal. FREYR Battery, 24M's primary US-market
              pathway, terminated both of its license agreements on November 4, 2024, paying a $3 million settlement and
              forfeiting 6,975,956 Series G preferred shares. FREYR subsequently cancelled its planned Norwegian Battery
              Valley gigafactory and its proposed Georgia, USA facility, pivoting entirely to solar module and cell
              manufacturing. The SEC-filed termination agreement and the Nasdaq announcement both confirm the settlement
              terms; contracts.justia.com corroborates the agreement structure. FREYR's full strategic exit from battery
              manufacturing — rather than merely switching technology providers — signals that the licensee assessed the
              long-term economics of novel battery manufacturing as unworkable against Chinese competition, not merely a
              dissatisfaction with 24M's specific platform. Volkswagen Group's acquisition of a 25% equity stake in 24M
              in January 2022 carried implicit expectations of a manufacturing partnership, but no confirmed automotive
              production commitment or gigafactory deployment using SemiSolid technology was announced over the
              subsequent four years before closure. Fujifilm invested $20 million in September 2022 for industrial
              applications but similarly made no commercial production announcement by March 2026. Kyocera Corporation,
              the sole commercial licensee producing SemiSolid technology at scale, manufactured approximately 20,000
              Enerezza residential energy-storage units per year (≈200 MWh annually) in Japan — a production volume
              entirely insufficient to sustain a $1.3 billion valuation or fund 24M's ongoing R&D and operations.
              Critically, every confirmed commercial deployment was in Japan; 24M had no US-based production licensee
              and no automotive OEM commercial deployment anywhere in the world at the time of closure. The
              partner/dependency risk register (TR003) enumerates each relationship and its failure mode; the dependency
              map (FR003) shows the structural concentration of commercial execution with a single operational partner.
