  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Definition, and Scope
        blocks:
          - type: paragraph
            body: >
              For diligence purposes, the 24M market analysis separates three distinct spend categories that are often
              conflated in headline TAM figures: (i) battery cell manufacturing (the production of raw cells using
              electrochemical materials and process equipment), (ii) battery system integration (the assembly of cells
              into packs and systems sold to end users), and (iii) battery deployment (the purchase of complete battery
              energy storage systems by utilities, IPPs, commercial operators, and residential consumers). 24M's
              SemiSolid manufacturing platform operates at layer (i): it is a licensed manufacturing process sold to
              battery producers, not a finished cell or system sold to end buyers. This distinction matters enormously
              for market sizing — the cell manufacturing TAM (revenue generated by manufacturers selling cells) is
              substantially smaller than the global BESS deployment market (revenue received by project developers and
              integrators) and the battery market in its broadest definition (all related capex and opex across the
              value chain).

              The energy storage market relevant to 24M includes: stationary grid-scale battery energy storage systems
              (BESS), residential energy storage (exemplified by Kyocera's Enerezza product built on SemiSolid cells),
              and EV battery manufacturing for automotive OEMs. The consumer electronics battery market (mobile phones,
              laptops, portable devices) is excluded from primary scope because 24M's SemiSolid platform was developed
              for larger-format cells and its commercial partners (Kyocera, Volkswagen, Fujifilm, Freyr) targeted grid,
              residential, and automotive applications. Adjacencies include electric aviation and eVTOL (where 24M
              received ARPA-E SCALEUP funding) and sodium-metal batteries (ARPA-E EVs4ALL grant), but these are
              early-stage and not material to commercial sizing for the review period.

              Status-quo substitutes for SemiSolid technology are conventional lithium-ion manufacturing processes using
              slurry coating and electrode drying — the dominant approach used by CATL, BYD, Panasonic, LG Energy
              Solution, and others. SemiSolid competes as a manufacturing process alternative, not as a distinct
              chemistry; its chemistry-agnostic nature (compatible with LFP, NMC, and advanced formats) means it is
              positioned as a cost-reduction and simplification overlay on existing battery chemistry ecosystems. The
              competitive comparison is therefore not cell chemistry X vs. chemistry Y, but rather SemiSolid process vs.
              conventional slurry-coat process, with target benefits of up to 40% lower manufacturing cost and
              elimination of energy-intensive electrode drying steps.
