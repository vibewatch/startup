  - id: FE001
    title: 24M SemiSolid Product Architecture — Technology Stack
    type: stack
    layout: standard
    summary: >
      Layered technology stack showing how the SemiSolid electrode foundation supports four additional proprietary
      platforms, from the base manufacturing process through end-of-life recycling.
    claimRefs:
      - CE001
      - CE007
      - CE011
      - CE016
      - CE021
    data:
      layers:
        - id: layer_semisolid
          label: Layer 1 — SemiSolid™ Electrode Manufacturing Platform
          detail: >
            Binder-free, solvent-free thick electrode process. Area capacity 6–12 mAh/cm². 40–65% capex reduction
            claimed. Foundation for all other platforms.
          items:
            - Slurry formulation (active material + electrolyte + carbon, no binder)
            - Direct cast onto current-collector foil (no drying oven, no NMP recovery)
            - Solvent-free; calendering elimination; ~50% fewer manufacturing steps
        - id: layer_unit_cell
          label: Layer 2 — Unit Cell / ETOP™ Pack Integration
          detail: >
            Sealed cathode/anode pair (Unit Cell) stacked directly into pack housing (ETOP). Up to 80% electrode volume
            fraction. Eliminates cell and module structures.
          items:
            - Sealed electrode pair in thin polymer film (Unit Cell)
            - ETOP single-machine assembly (seal, stack, wire, close) — no cell casings
            - Up to 50% more EV range or equivalent cost reduction vs cell-to-pack
        - id: layer_safety
          label: Layer 3 — Impervio™ Separator + Eternalyte™ Electrolyte
          detail: >
            Safety and performance enhancement layer. Impervio blocks dendrites and detects faults. Eternalyte provides
            3x ionic conductivity; >80% capacity at minus 20 degrees C.
          items:
            - Impervio — dendrite suppression + real-time BMS fault detection
            - Eternalyte — ~26 mS/cm ionic conductivity; fast-charge to 90% in 16 min
            - Combined stack targets 1,000-mile battery (company projection)
        - id: layer_recycling
          label: Layer 4 — LiForever™ Direct Material Recycling
          detail: >
            End-of-life layer unique to binder-free SemiSolid format. No black mass; active materials recovered in
            original crystalline form.
          items:
            - Separation without pyro/hydrometallurgy (no black mass)
            - Low-cost cleaning and re-lithiation to reclaim full capacity
            - Compatible with LFP, NMC, NCA, graphite; chemistry-agnostic
