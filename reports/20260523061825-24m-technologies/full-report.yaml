            title: Kyocera Concentration — Single-Licensee Commercial Dependency
            body: >-
              All confirmed royalty revenue flowed from a single licensee (Kyocera) in a single geography (Japan) and a
              single end-market (residential ESS). At 200 MWh/yr and an estimated royalty of USD 3–5/kWh, Kyocera
              yielded at most ~USD 0.6–1M/yr — structurally insufficient for a company with $500M+ raised and a $1.3B
              valuation. This concentration is the primary commercial de-risking failure.
