  - id: TM004
    title: Growth Drivers and Adoption Constraints
    columns:
      - Driver / Constraint
      - Direction
      - Timing
      - Implication for Market
      - Diligence Ask
    rows:
      - - Renewable energy integration demand (solar + wind pairing with BESS)
        - Driver
        - Current (2025–2030+)
        - >-
          Persistent structural demand for grid-scale storage across all geographies; ~80% of 2025 new battery capacity
          was utility-scale (IEA)
        - >-
          Monitor grid interconnection queues by ISO/RTO; track renewable capacity additions vs. storage co-deployment
          rates
      - - AI / data center backup power demand
        - Driver
        - Current (2025–2028)
        - >-
          BESS for UPS grew 30% to 45 GW in 2025 (IEA); single Stargate AI project may require 1 GW of storage; new
          demand source independent of EV cycle
        - >-
          Track data center build plans and battery backup procurement specifications; assess duration requirements (UPS
          is typically short-duration, limiting some cell formats)
      - - EV-to-BESS capacity pivot by major manufacturers
        - Driver
        - Immediate (2025–2026)
        - >-
          Ford, GM, Stellantis, SK On, Samsung SDI, LGES all redirecting EV battery capacity to BESS; creates new BESS
          supply volume and accelerates LFP adoption outside EVs
        - >-
          Track conversion timelines and actual BESS output from redirected capacity; assess whether this increases cell
          supply competition for SemiSolid licensees
      - - US IRA Investment Tax Credit preservation for battery storage
        - Driver
        - 2025–2030s
        - >-
          July 2025 budget bill preserved storage ITC; BNEF cited as key support for US outlook despite EV pullback;
          manufacturing credit (45X) also retained
        - Confirm current ITC value ($/kWh) and FEOC compliance requirements applicable to SemiSolid-licensed products
      - - Emerging market expansion (Australia, India, Brazil, South Korea)
        - Driver
        - 2026–2028+
        - >-
          InfoLink projects emerging markets at ~20% of global installation growth in 2026; GWh-scale tenders in India,
          Brazil, South Korea; 11.4 GWh new installs in Australia in 2025 (338% YoY)
        - >-
          Monitor tender awards and project commissioning timelines; assess localization requirements that may affect
          licensing models
      - - US EV purchase tax credit expiration (September 2025)
        - Constraint
        - Immediate (2025–2026)
        - >-
          US EV sales fell 4% in 2025; automakers wrote down $53B+ in EV assets; $19.9B in planned EV manufacturing
          investments canceled; EV battery demand severely reduced
        - >-
          Monitor OEM EV model launch cadence and battery supply agreement renegotiations; assess whether EV pivot to
          BESS absorbs SemiSolid-compatible applications
      - - Chinese LFP price dominance ($44–60/kWh vs. $81/kWh global avg)
        - Constraint
        - Structural
        - >-
          China's 3.1 TWh of installed battery capacity creates severe pricing pressure; US-made LFP cells 56% more
          expensive than Chinese equivalents in 2025; tariffs partially offset but do not eliminate cost gap
        - >-
          Quantify cost-of-adoption for a licensee adopting SemiSolid vs. sourcing from China; assess whether claimed
          40% manufacturing cost reduction closes or only narrows the gap
      - - Capital intensity and 'valley of death' for battery manufacturing startups
        - Constraint
        - Structural
        - >-
          Break-even requires ~$2B and 10 years; minimum viable scale is 18–22 GWh; VC capital incompatible with
          timelines; battery industry consolidation inevitable (industry analysis from The Battery Show 2025)
        - >-
          Assess whether licensing (vs. manufacturing) model genuinely bypasses capital constraint or transfers it to
          licensees; evaluate whether licensees have sufficient patient capital
    notes: >
      The eight drivers and constraints listed are not exhaustive but represent the most material forces shaping the
      battery manufacturing market relevant to 24M's technology and business model. The EV credit expiration and Chinese
      price competition are confirmed constraints that directly affected 24M's commercial environment; the capital
      intensity constraint is a structural characteristic that predates 24M and will persist for any battery
      manufacturing innovator. The AI/data-center driver and EV-to-BESS pivot are the most significant new demand
      dynamics emerging in 2025–2026, but their benefit would accrue to active market participants — not to 24M
      post-closure.
