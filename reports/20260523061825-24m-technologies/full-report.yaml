      - number: '3.4'
        title: Advanced Battery Startups — Solid-State, Lithium-Metal, and Silicon-Anode Peers
        blocks:
          - type: paragraph
            body: >
              QuantumScape is the most direct analog to 24M's strategic positioning: a US-based, venture- and
              public-capital-backed company whose business model centres on licensing proprietary battery manufacturing
              technology to external partners rather than building and operating gigafactories. QuantumScape's QSE-5
              solid-state lithium-metal cells achieve 844 Wh/L volumetric energy density and were validated at 95%
              capacity retention after 1,000 cycles in pilot settings. The Eagle Line — QuantumScape's publicly
              demonstrated manufacturing reference line integrating the "Cobra" separator process (25x faster than its
              predecessor) — was inaugurated in February 2026 in San Jose. QuantumScape has contracted with Murata
              Manufacturing and Corning for separator supply and is developing licensing relationships with automotive
              OEMs in Europe, North America, and Japan, as well as emerging non-automotive markets including drone
              defence, AI data centres, and robotics.

              QuantumScape's financial profile contrasts sharply with 24M's: the company posted a net loss of $435.1
              million for full-year 2025 (improved from $477.9M in 2024), ended 2025 with $970.8 million in cash and
              marketable securities, and reported a Q1 2026 net loss of $100.8 million against an accumulated deficit of
              approximately $3.9 billion. The company has not yet generated commercial revenue, burning approximately
              $242.5 million in operating cash in 2025 — a trajectory that its management indicates provides a cash
              runway into at least H2 2028. The critical difference between QuantumScape's survival and 24M's closure is
              access to public equity markets (NYSE: QS), which enabled QuantumScape to raise $264.2 million through at-
              the-market share sales in 2025 without requiring commercial traction to justify the capital.

              Solid Power is developing sulfide-based solid electrolyte and is pursuing a licensing model for
              electrolyte supply and cell design. Its October 2025 three-way collaboration with Samsung SDI and BMW —
              supplying solid electrolyte for Samsung SDI to build cells, which BMW evaluates in a demonstration vehicle
              — represents a narrower model than 24M's (electrolyte supply + cell design licensing, not full
              manufacturing process licensing). Series production of solid- state vehicles is not expected before 2030
              per BMW executives and Solid Power's own guidance. Solid Power's business model — selling solid
              electrolyte to Tier 1 battery manufacturers and licensing cell designs to OEMs — is less capital-intensive
              than 24M's full-process licensing but also less differentiated: the electrolyte supply chain can be
              replicated or bypassed by vertically integrated manufacturers.

              SES AI Corporation has pivoted from pure EV-focused lithium-metal batteries to a diversified
              commercialisation strategy across three segments: energy storage systems (via its UZ Energy acquisition),
              drone batteries, and AI-driven battery materials discovery (the Molecular Universe platform). Q1 2026
              revenue was $6.7 million (47% growth vs. Q4 2025), with full-year 2026 guidance of $30–35 million. SES AI
              signed a $20 million multiyear ESS distribution agreement with ATG EPower in Q1 2026 and converted its
              Chungju, South Korea facility from EV pouch cells to drone-format cells, targeting one million cells per
              year. SES AI's liquidity position of $178 million and its pivot away from automotive to near-term revenue
              applications demonstrates a strategic agility that 24M, focused on a single technology licensing model,
              did not pursue.

              Sila Nanotechnologies offers a different category of adjacent competition: materials-layer innovation
              (silicon-carbon anode) rather than manufacturing-process innovation. In September 2025 Sila opened its
              Moses Lake, Washington factory — the first automotive-scale US silicon anode plant, spanning 600,000
              square feet on 160 acres — with initial capacity of 2–5 GWh and potential expansion to 250 GWh. Sila's
              Titan Silicon anode delivers a 20% energy density improvement over best-performing graphite cells and was
              being qualified for the Mercedes-Benz G-Class electric SUV targeting 2026 delivery. Sila received over
              $120 million in DOE/ARPA-E grant support and holds more than 250 patents. Unlike 24M, Sila sells a
              material (anode powder) that integrates into existing cell manufacturing lines without requiring a
              complete manufacturing process overhaul — a significantly lower adoption barrier.

              Toyota, via Prime Planet Energy & Solutions (Panasonic JV), has received Japanese government certification
              to begin solid-state battery production in 2026 at an initial 9 GWh/year scale, with first deployment in
              Lexus vehicles targeted for 2027–28 and mass-market cost parity targeted post-2030. Toyota's solid-state
              batteries claim 450–500 Wh/kg and under 10-minute charging. Toyota's commercial solid-state program
              demonstrates that the most durable path to advanced battery commercialisation may require OEM-level
              vertical integration and decades-long R&D investment — a model fundamentally different from the
              asset-light licensing strategy 24M pursued.
