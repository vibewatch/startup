chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Technology Platform
        blocks:
          - type: paragraph
            body: >
              24M Technologies, Inc. is an MIT-originated battery technology company headquartered in Cambridge,
              Massachusetts, incorporated in 2010. Its stated mission is to provide affordable energy storage by
              reinventing how lithium-ion batteries are designed and manufactured. The company is a private entity with
              no mandatory public financial disclosures; revenue and detailed financial performance are undisclosed.

              The core product is the SemiSolid™ manufacturing platform, in which thick, gooey semi-solid electrodes
              replace the conventional electrode-drying and calendering steps of traditional lithium-ion production.
              According to company claims, this eliminates more than 80% of the inactive materials present in standard
              cells, reducing manufacturing costs by up to 40% while improving energy density, safety, and
              recyclability.

              The company's technology suite extends beyond the foundational SemiSolid platform. The Impervio™
              separator, unveiled at CES in January 2024, is a functionalized layer that prevents metallic dendrite
              formation and enables real-time monitoring for internal defects—targeting both lithium-ion and
              next-generation lithium-metal cell formats. The Eternalyte™ electrolyte, announced in February 2024, is a
              liquid electrolyte engineered for lithium-metal batteries that maintains up to 90% capacity at −20°C,
              addressing the cold-weather performance limitation of competing electrolytes.

              The ETOP (Electrode-to-Pack) platform, first announced at the Japan Mobility Show in October 2023 and
              further promoted in September 2025, eliminates individual cell and module structures entirely by
              integrating sealed electrode pairs directly into the battery pack. The company claims ETOP raises
              electrode content to up to 80% of pack volume versus 30–60% in traditional designs, enabling up to 50%
              more EV range or equivalent reductions in pack cost and weight. The SemiSolid platform is
              chemistry-agnostic, compatible with LFP, NMC, and next-generation chemistries including lithium-metal and
              sodium-metal, without requiring partners to change manufacturing supply chains.

              24M's business model is technology licensing: the company licenses its platform to battery manufacturers
              and OEMs rather than building or operating gigafactories itself. This approach limits capital intensity
              for 24M but concentrates commercial execution risk with partners. By March 2026 the company had entered
              closure proceedings; its assets were scheduled for a complete-closure auction starting 29 June 2026.
