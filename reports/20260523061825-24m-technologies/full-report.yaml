      - number: '1.5'
        title: Milestones, Operating Status, and Adverse Findings
        blocks:
          - type: paragraph
            body: >
              24M achieved a series of compelling technical and commercial milestones between 2010 and 2025 before its
              abrupt closure in early 2026. Key inflection points include the 2015 public debut of SemiSolid technology,
              the 2021–2022 wave of corporate licensing agreements, the 2023 introduction of ETOP and government ARPA-E
              grants, and the September 2024 Series H that confirmed a $1.3 billion valuation.

              The most material adverse finding is the company's reported shutdown. On 12 March 2026 MIT Technology
              Review reported—citing Steve Levine at The Information—that 24M was shutting down and would auction off
              its property. The company itself remained silent; emails to the official press address went unanswered,
              phone calls were unreturned, and co-founder Yet-Ming Chiang declined to speak on the record. The Branford
              Group subsequently listed a complete-closure auction for three vertically integrated 24M facilities in
              Massachusetts, with timed bidding scheduled from 29 June to 1 July 2026.

              Industry analysts and MIT Technology Review cited several structural factors: a tightening of investor
              appetite for capital-intensive hardware innovation; gutting of key Inflation Reduction Act incentives that
              had underpinned the US battery startup thesis; a cooling EV market with major automakers cancelling models
              and slashing factory plans; and the persistent difficulty of translating laboratory-scale manufacturing
              innovations into commercially validated, cost-competitive production at gigawatt scale. Kara Rodby of
              Volta Energy Technologies characterised 24M as "a great example of something that should have been
              easier," reflecting its relative proximity to existing lithium-ion technology compared to more speculative
              chemistries.

              The SemiSolid technology had been demonstrated at hundreds-of-megawatts scale primarily through Kyocera's
              residential energy storage production in Japan, but the company never achieved the gigawatt-scale adoption
              that would have validated its commercial model. Kyocera had announced plans to increase SemiSolid
              production capacity by fiscal year 2026; the status of those plans following the closure announcement is
              unclear and constitutes a material open question for diligence.

              The adverse event is well-supported by at least two independent, high-credibility sources (MIT Technology
              Review, BidSpotter auction listing) and should be treated as confirmed. The specific governance decisions,
              investor negotiations, and technical failures leading to closure remain undisclosed, representing the
              primary unresolved dimension of this chapter.
