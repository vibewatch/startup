              - CV033
              - CV034
              - CV035
              - CV036
      - number: '8.4'
        title: Liquidation Value and Asset Recovery Analysis
        blocks:
          - type: paragraph
            body: >
              The Branford Group has been engaged to conduct a complete-closure auction of 24M Technologies' US assets,
              scheduled for June 15–18, 2026. The auction covers three locations: 26 Dartmouth Street, Westwood MA
              02090; 29 Esquire Road, Billerica MA 01821; and 8 Roosevelt Avenue, Hudson NH 03051. Asset categories
              include manufacturing equipment, robotics, battery testers and formation equipment, laboratory
              instruments, machine shop tooling, and facility infrastructure. Multiple items are dated 2024, consistent
              with the Thailand facility acquisition and the Series H-funded operational build-out.

              Physical equipment recovery in battery manufacturing distress sales typically achieves 10–40 cents on the
              dollar relative to original acquisition cost. Specialised electrochemical test equipment and
              SemiSolid-specific processing tools have limited secondary markets, which compresses recovery rates
              further. The auction is structured as a complete-closure sale with no stalking-horse bid or restructuring,
              implying maximisation of liquidation speed over recovery value. Aggregate physical asset recovery from the
              three US locations is estimated — based on the industry distress sale benchmark and the auction scope — to
              be well below $30 million.

              The most significant asset uncertainty is the Rayong, Thailand pilot facility, which cost $51.1 million in
              August 2024. The Thailand facility is not referenced in the US Branford Group auction listing. Its
              disposition is unknown: it may have reverted to Nuovo+ (the prior owner), been separately negotiated in a
              private transaction, or be subject to Thai BOI/IEAT regulatory constraints. This creates a material
              evidence gap in the total asset recovery picture. The 700+ patent portfolio represents another potentially
              recoverable asset, but battery IP in distress situations typically sells at steep discounts unless a
              well-capitalised strategic acquirer with immediate production plans participates. Given that all three
              named licensees (VW, Fujifilm, Kyocera) have the option of developing competing or adjacent technology,
              the bargaining position of a distress IP seller is weak. Recovery on IP is estimated at 5–15% of the value
              implied by the $1.3 billion valuation.
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
          - type: table
            tableRef: TV006
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV029
              - CV030
              - CV031
              - CV036
              - CV037
              - CV039
      - number: '8.5'
        title: Valuation Scenarios, Recommendation, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >
              Three scenarios capture the range of outcomes for the 2024 $1.3 billion valuation. The bear case — which
              is now the operative reality — assumes 24M enters complete wind-down with physical asset recovery of
              $10–25 million from the US auction, IP recovery of $0–30 million (depending on whether a strategic
              acquirer emerges), and uncertain Thailand facility recovery. Series H preferred holders face near-total
              loss on equity given the aggregate preference stack from prior rounds ($500M+ cumulative raises) that must
              be satisfied before Series H receives any residual. The base case — now effectively foreclosed — would
              have required a licensing revenue acceleration to $50–100 million ARR to justify the valuation, which did
              not occur. The bull case, at the time of issuance, assumed FREYR's US gigafactory, VW's automotive
              production, and Nuovo+ Thailand scaling would collectively drive royalty revenue into the $100M+ range by
              2027. All three scenarios within this bull case have been invalidated.

              The fundamental valuation mistake was pricing 24M as if commercialisation risk resided entirely with
              licensees and not with the licensor. In reality, the licensor bore substantial reputational, strategic,
              and capital risk when licensees underperformed. When FREYR terminated, the credibility of the licensing
              model was impaired for future capital raises. When the IRA manufacturing incentive environment
              deteriorated, the strategic rationale for new US battery investment weakened. When VW and Fujifilm
              remained pre-commercial, the implied royalty pipeline that supported the $1.3 billion terminal value
              evaporated.

              The investment recommendation as of May 2026 is unambiguous: the $1.3 billion 2024 valuation is severely
              impaired and the equity is effectively worthless from a going-concern perspective. The recommendation for
              any investor who participated at the Series H is to classify the position as a total loss, engage the
              wind-down estate to understand any preference recovery, and assess whether IP rights acquired in the
              bankruptcy-adjacent process carry strategic value for adjacent battery IP programs. The valuation collapse
              is fully consistent with the broader battery startup impairment pattern, and no public evidence supports
              any residual equity value above the preference stack.
            claimRefs:
              - CV032
