      - number: '4.3'
        title: Capital Structure and Funding Chronology Reference
        blocks:
          - type: paragraph
            body: >
              24M has raised more than $500 million across twelve or more funding rounds since its 2010 founding; the
              detailed round-by-round chronology is preserved in the Company Overview chapter and is referenced here
              rather than reproduced. The financial structure is notable for several characteristics relevant to capital
              adequacy assessment.

              First, the investor base is overwhelmingly Asian industrial corporates (Kyocera, Asahi Kasei, Dai Nippon
              Printing, Mitsui O.S.K. Lines, Nuovo+/PTT/GPSC, Fujifilm, ITOCHU) and one European OEM (Volkswagen Group).
              North American financial institutions and US technology VCs are largely absent beyond early-stage rounds
              (CRV, North Bridge Venture Partners in Series A-D). This geographic skew towards Asian strategic investors
              aligns with regions where SemiSolid licensing had most traction but created a dependency on
              corporate-strategic capital rather than independent financial capital.

              Second, the US government contributed at least $12.2 million in ARPA-E grants: a $9 million SCALEUP award
              (June 2023) for high-energy-density lithium-metal anode cells targeting electric aviation, and a $3.2
              million EVs4ALL award (January 2023) for sodium-metal battery development in partnership with MIT and
              Carnegie Mellon University. These grants were tied to specific R&D deliverables and did not constitute
              unrestricted operating capital.

              Third, the capital structure appears to be entirely equity-financed, with no publicly disclosed debt,
              revolving credit facility, project-finance obligations, or convertible notes. This is consistent with a
              technology-licensing business model that has minimal hard asset collateral to pledge, but also means there
              is no debt covenant or interest-coverage metric that could have served as an early warning of financial
              stress.

              The Series H closed September 5, 2024 and was the company's final disclosed financing event before the
              March 2026 closure — a runway of at most 18 months from the most recent capital raise.
