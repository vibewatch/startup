      - number: '3.6'
        title: Moat Durability Assessment and Adverse Evidence — Was 24M's Competitive Position Sufficient?
        blocks:
          - type: paragraph
            body: >
              The central competitive question for 24M Technologies at the time of its March 2026 closure is whether its
              SemiSolid moat — built on patented manufacturing process IP, chemistry agnosticism, and a licensing model
              — was inherently insufficient or was simply under-resourced against better-capitalised incumbents and
              peers.

              The adverse evidence points strongly toward structural insufficiency. Northvolt — which raised $15+
              billion in equity and debt, secured $50 billion in orders from tier-1 automotive OEMs, and built a
              flagship gigafactory in Skellefteå, Sweden — filed for bankruptcy in March 2025 with $5.8 billion in debt
              and only $30 million in cash (approximately seven days of operations at its $100 million monthly burn
              rate). Investigators discovered approximately 4,000 unopened equipment boxes worth €430 million at
              facilities, and production reached only 5% of designed capacity. Northvolt lost a €2 billion BMW contract
              in mid-2024 after falling two years behind on deliveries. If the conventional lithium-ion manufacturing
              approach with vastly more capital and the strongest OEM partnerships in Europe could not achieve
              commercial viability, the case for an asset-light licensing model succeeding where manufacturing-first
              failed requires a specific channel (capable, willing licensees) that proved equally elusive.

              FREYR Battery's trajectory provides the most direct adverse evidence for 24M's moat durability. FREYR
              signed an unlimited 24M SemiSolid license in January 2021 intending to build a 40 GWh factory in Norway
              and a 34 GWh factory in Georgia ("Giga America"). By November 2024, FREYR and 24M mutually terminated all
              licensing and services agreements; FREYR paid $3 million and forfeited nearly 7 million Series G preferred
              shares. In February 2025, FREYR officially cancelled the $2.6 billion "Giga America" project and agreed to
              sell the 368-acre Georgia site for $50 million, citing "climbing interest rates, falling battery prices,
              and change in leadership." FREYR subsequently pivoted to solar manufacturing after acquiring Trina Solar's
              Texas factory. The FREYR outcome is a direct test of 24M's licensing moat: a commercially serious licensee
              with government backing and OEM-level ambitions concluded that the SemiSolid technology licensing business
              case was not executable in the Western market context.

              QuantumScape's survival — with $971M in cash, an Eagle Line pilot facility, and an active licensing
              pipeline despite $3.9 billion in accumulated losses — illustrates that the technology licensing model for
              batteries is not inherently non-viable, but it requires (a) access to public equity markets to sustain
              years of pre-commercial operations, (b) a narrowly scoped technology offering with clear performance
              differentiation (844 Wh/L vs. 400–500 Wh/L for conventional Li-ion), and (c) partnerships with first-tier
              OEMs (VW PowerCo) whose capacity and intent to scale are credible. 24M lacked (a) — it was private — and
              struggled with (c) — Kyocera was the only credible commercial partner.

              The SemiSolid moat's inherent limitations relative to Chinese incumbents are structural rather than
              execution-dependent. Even a fully scaled 24M licensee producing SemiSolid cells at Western costs would
              face a $53–56/kWh Chinese LFP alternative for every customer in a cost- competitive market. SemiSolid's
              40% manufacturing cost reduction claim is measured against conventional Western manufacturing costs, not
              against Chinese cell import prices. The effective moat was therefore limited to (i) supply-chain security
              applications where Chinese cell sourcing is prohibited by FEOC regulations, and (ii)
              performance-differentiated applications (higher energy density, thicker electrodes) where cost per kWh is
              not the primary selection criterion. Both of these markets existed and were real, but they were
              insufficiently large to sustain 24M's operating structure.

              One remaining question without adverse evidence is whether the SemiSolid process has any inherent quality,
              safety, or cycle-life issues at commercial scale. The Kyocera Enerezza residential ESS product used
              SemiSolid cells commercially without any publicly reported safety recall or product failure as of May 2026
              — providing limited but positive evidence that the technology itself was not the proximate failure mode.
