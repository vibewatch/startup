      - number: '8.2'
        title: Public-Market Peer Comparable Analysis
        blocks:
          - type: paragraph
            body: >
              Three publicly traded battery technology companies provide the most directly relevant market-based comps
              for 24M: QuantumScape Corporation (QS), Solid Power Inc. (SLDP), and SES AI Corporation (SES). All three
              pursued similar pre-commercial licensing or cell-development strategies, went public via SPAC mergers at
              peak market valuations, and have since experienced severe multiple compression. None has achieved
              commercial-scale revenue.

              QuantumScape went public via a SPAC merger in November 2020, at an implied enterprise value of
              approximately $3.3 billion. The company is developing solid-state lithium-metal batteries for automotive
              applications and licenses technology in partnership with Volkswagen. As of Q1 2026, QuantumScape continued
              to operate at a significant cash burn with no commercial-scale product revenue. The company reported
              progress on its Cobra separator process entering baseline production, but commercial automotive-scale
              manufacturing remains years away. QuantumScape's market capitalisation has declined sharply from its
              post-IPO peak, illustrating the multiple compression trajectory applicable to pre-commercial battery IP
              platforms.

              Solid Power went public via SPAC in 2021, developing all-solid-state batteries in partnership with BMW and
              Samsung SDI. In October 2025, Solid Power formalised a three-party collaboration with Samsung SDI and BMW
              to advance all-solid-state battery technology. FY2025 results show ongoing losses and no meaningful
              commercial revenue. The company's share price reflects sustained discounting of commercialisation risk.
              Solid Power's trajectory — headline automotive OEM partnerships without commercial revenue — mirrors 24M's
              Volkswagen relationship.

              SES AI Corporation reported Q1 2026 financial results showing ongoing losses and a cash burn rate
              inconsistent with long-term sustainability without additional capital raises. SES AI pursues lithium-metal
              pouch cell development and has partnerships with major automotive OEMs, but commercial-scale production
              has not been achieved. The company's market capitalisation is a fraction of its SPAC-era valuation.

              Across all three comps, the market has applied severe discounts relative to original SPAC valuations,
              confirming that battery technology platforms without commercial-scale revenue face structural multiple
              compression over time. This compression is directly relevant to 24M's private-market $1.3 billion
              valuation mark.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
