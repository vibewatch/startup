      - number: '5.2'
        title: Technology Portfolio — ETOP, Eternalyte, Impervio, and LiForever
        blocks:
          - type: paragraph
            body: >
              The ETOP™ (Electrode-to-Pack) platform, first launched at the Japan Mobility Show in October 2023 and
              promoted for the US market in September 2025, eliminates individual cell casings and module structures
              entirely. In the ETOP architecture, sealed anode/cathode pairs encapsulated in thin polymer film are
              stacked directly into the battery pack housing; the pack itself becomes the structural container for
              electrode pairs. This removes the cost and weight of hundreds or thousands of individual cell housings and
              the module-level interconnects between them. 24M claims electrode content reaches up to 80% of pack volume
              in ETOP versus 30–60% in conventional cell-to-pack designs, enabling up to 50% more EV range or equivalent
              pack weight and cost reduction. ETOP is also compatible with 24M's Impervio separator for individual
              electrode-pair monitoring through the battery management system. No ETOP deployment at commercial
              production scale had been publicly announced before 24M's closure.

              The Eternalyte™ electrolyte, unveiled in February 2024 and extended in late 2024 from lithium-metal to
              graphite and silicon anode chemistries, is a proprietary liquid formulation achieving approximately 26
              mS/cm ionic conductivity at 25°C — roughly three times that of standard electrolytes — with a lithium-ion
              transference number of ~0.6. This high conductivity enables rapid charging: 90% state-of-charge in 16
              minutes for graphite electrodes or 80% in 11 minutes for lithium-metal cells. At −20°C, Eternalyte cells
              retain over 80% of rated capacity at 1C rate, whereas conventional electrolytes typically lose most of
              their capacity at sub-zero temperatures. Eternalyte requires no special manufacturing equipment and is
              described as a drop-in upgrade to existing production lines.

              The Impervio™ separator, introduced at CES in January 2024, addresses dendrite-related safety failures in
              lithium-ion and lithium-metal cells. Its proprietary structure physically blocks metallic and lithium
              dendrite propagation at the electrode level — including dendrites caused by manufacturing contaminants,
              misaligned electrodes, or separator defects — while a conductive layer embedded in the separator
              continuously monitors cell electrochemistry, enabling the battery management system to detect a potential
              short before it occurs and safely discharge the affected cell. In 24M's internal overcharge test, a
              conventional NMC/graphite cell without Impervio shorted after 15 minutes of overcharging and exploded at
              38 minutes; an identical cell with Impervio remained stable through 60 minutes. Impervio-enabled
              lithium-metal prototypes were shipped to an unnamed major global automotive OEM in October 2024, but
              commercial production was not reached before closure.

              LiForever™, announced March 2024, is a direct-material recycling process unique to the binder-free
              SemiSolid format. Because SemiSolid electrodes contain no organic binder, spent electrode material can be
              separated from the electrolyte without pyrometallurgical or hydrometallurgical treatment, avoiding the
              formation of black mass. Recovered active materials (graphite, LFP, NMC, NCA) retain their crystalline
              structure and undergo only a low-cost cleaning and re-lithiation step to reclaim full capacity. LiForever
              was demonstrated on end-of-life LFP cells at the Rayong pilot facility.
