  - id: FV001
    title: Recommendation Logic
    type: flow
    insight: >
      The recommendation chain flows from four converging adverse inputs — no commercial revenue, failed licensee
      network, exhausted capital, and liquidation confirmed — to an unambiguous total-loss conclusion. No recovery
      scenario changes the equity valuation from zero; only IP or Thailand disposition can affect creditor recovery.
    data:
      nodes:
        - id: n1
          label: No Commercial-Scale Revenue (single Kyocera licensee; undisclosed royalty)
        - id: n2
          label: Licensee Network Failure (FREYR terminated; VW/Fujifilm pre-commercial only)
        - id: n3
          label: Capital Exhaustion (Series H $87M consumed within 18 months)
        - id: n4
          label: IRA / Policy Deterioration (EV manufacturing incentives curtailed)
        - id: n5
          label: Wind-Down Confirmed (MIT Technology Review March 2026; Branford auction June 2026)
        - id: n6
          label: Equity Worthless (below preference stack; no going-concern)
        - id: n7
          label: Recovery Scenarios (Thailand disposition; IP acquirer; Kyocera license survival)
        - id: n8
          label: Total Loss Recommendation (Do Not Invest; write down to liquidation value)
      edges:
        - from: n1
          to: n5
          label: Insufficient revenue to fund operations
        - from: n2
          to: n5
          label: Commercial pipeline eliminated
        - from: n3
          to: n5
          label: No runway for next raise
        - from: n4
          to: n5
          label: Capital environment closed
        - from: n5
          to: n6
          label: Wind-down confirms equity destruction
        - from: n6
          to: n8
          label: Preference stack > recoverable assets
        - from: n7
          to: n8
          label: Recovery upside does not reach Series H equity
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV032
      - CV034
      - CV035
      - CV041
      - CV042
  - id: FV002
    title: Valuation Sensitivity
    type: bar
    insight: >
      24M's $1.3B valuation is sensitive to the licensing revenue multiple and ARR assumed. At any evidence-supportable
      ARR (the Kyocera-only base of ~$2–5M), the implied revenue multiple at $1.3B is 260–650x — unsustainable for any
      comparable technology licensor. Even aggressive bull-case ARR of $50M only justifies $375–750M at market
      multiples. The bear case (wind-down) implies zero going-concern value.
    data:
      items:
        - label: 'Bear: Liquidation Value (physical + IP estimate)'
          value: 0.035
          unit: $B
        - label: Base at $5M ARR, 12x multiple
          value: 0.06
          unit: $B
        - label: Base at $20M ARR, 10x multiple
          value: 0.2
          unit: $B
        - label: Bull at $50M ARR, 12x multiple
          value: 0.6
          unit: $B
        - label: Bull at $100M ARR, 8x multiple
          value: 0.8
          unit: $B
        - label: 24M Series H Valuation (Sept 2024)
          value: 1.3
          unit: $B
    approximationNotes: >
      ARR estimates are illustrative; 24M has not disclosed any revenue figure. The Kyocera-only ARR of $2–5M is
      estimated from ~200 MWh/year at industry-analog royalty rates of 2–8% of cell revenue. Revenue multiples of 8–15x
      are based on comparable IP licensing company ranges (Solid Power, QuantumScape) and general SaaS/IP precedents.
      The $0.035B liquidation estimate represents physical assets ($10–25M) plus IP distress estimate ($0–10M midpoint);
      Thailand facility is excluded from this estimate due to evidence gap.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV033
      - CV038
      - CV041
  - id: FV003
    title: Valuation / Return Range
    type: range
    insight: >
      The valuation range across scenarios confirms that the bear case (wind-down) is now operative reality. The bull
      case range was always conditional on multiple simultaneous licensee scale-ups that did not occur. Series H
      investors at $1.3B are in a position where even the bull case exit no longer exists; recovery is limited to
      liquidation proceeds after satisfying the preference stack.
    data:
      items:
        - label: Bear Case — Liquidation (operative)
          low: 0.01
          mid: 0.035
          high: 0.06
          unit: $B
        - label: Base Case — As of Series H (invalidated)
          low: 0.2
          mid: 0.5
          high: 0.9
          unit: $B
        - label: Bull Case — Full Scale-Up (foreclosed)
          low: 0.8
          mid: 1.5
          high: 3
          unit: $B
        - label: 24M Series H Entry Valuation
          low: 1.3
          mid: 1.3
          high: 1.3
          unit: $B
    approximationNotes: >
      Bear case low/mid/high represents physical-only recovery ($10M), physical+IP estimate ($35M), and
      physical+IP+partial Thailand recovery ($60M) respectively. Base and bull cases were theoretical at Series H
      issuance and are now foreclosed by wind-down. Series H investors are above the bear case recoverable value in all
      scenarios, meaning equity recovery is effectively zero.
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV032
      - CV033
      - CV039
      - CV040
  - id: FV004
    title: Investment KPIs
    type: kpi
    insight: >
      24M Technologies scores at the critical/impaired end of every investable dimension: the last-round valuation is
      severely impaired, no commercial revenue was achieved, the licensee network collapsed, IP value is distress-level,
      and equity recovery is projected at zero. The KPI snapshot confirms that the 2024 unicorn mark was not sustained.
    data:
      items:
        - label: Last Round Valuation
          value: $1.3B (Sept 2024 Series H)
          status: impaired
          note: Severe impairment; company in wind-down; equity below preference stack
        - label: Total Funding Raised
          value: $500M+ across 12+ rounds
          status: confirmed
          note: Confirmed from multiple sources; specific round breakdown partially available
        - label: Commercial Revenue (Licensing)
          value: Undisclosed; estimated <$10M/yr
          status: missing
          note: Only Kyocera at commercial scale; no disclosed royalty rate or revenue figure
        - label: Active Commercial Licensees at Closure
          value: 1 (Kyocera only)
          status: confirmed
          note: FREYR terminated Nov 2024; VW and Fujifilm never reached production
        - label: Implied Monthly Cash Burn
          value: $4–7M/mo (estimated)
          status: estimated
          note: Inferred from $87M raise and 18-month runway; not disclosed
        - label: IP Portfolio Size
          value: 700+ patents
          status: confirmed
          note: Confirmed by company disclosure; liquidation value undisclosed
        - label: Series H Equity Recovery (Projected)
          value: ~0% (below preference stack)
          status: impaired
          note: Physical + IP recovery estimated well below aggregate preferred preference stack
        - label: Wind-Down Status
          value: Complete closure — confirmed
          status: confirmed
          note: MIT Technology Review March 2026; Branford auction June 2026
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV006
      - CV007
      - CV008
      - CV025
      - CV041
