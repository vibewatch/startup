      - number: '7.5'
        title: 人员、执行、技术与止损标准
        blocks:
          - type: paragraph
            body: >
              24M 的人员与执行风险集中在关键人物依赖、未经验证的技术规模化，以及纯授权模式把全部制造执行外包出去的天然限制上。联合创始人兼首席科学家 Yet-Ming Chiang
              是投资人、伙伴和政府资助机构眼中最重要的信誉锚点，拥有 MIT Kyocera Professor、A123 Systems 联合创始人、60+ 项专利等学术光环；但据 MIT Technology Review
              报道，他明确拒绝就 2026 年关停公开置评，显示正式清算前组织已陷入困境，并可能出现关键人物疏离。公司 16 年运营史中，没有任何美国 GWh 级工厂部署 SemiSolid
              技术，确认核心技术规模化风险从未解决，授权模式也无法替代自建制造的证明。2024 年 9 月以 $51.1 million 收购的泰国 Rayong 设施，在 24M 持有期间从未扩至商业生产，随后被纳入
              2026 年 6 月清算。IP 组合拍卖也给任何试图重启技术的潜在买方带来执行风险：700+ 项专利的权属链条、关闭后既有被许可方协议的可执行性，以及 ARPA-E 资助里程碑义务状态，都是未解决的法律问题。

              投资人本应在关闭前监控的止损标准——且在停业前或停业过程中全部被突破——包括：（1）FREYR 或可比的美国汽车被许可方宣布建设 GWh
              级工厂；（2）第二家产生收入的商业被许可方投入运营；（3）中国电池电芯价格稳定在 $70/kWh 以上；（4）IRA 45X 抵免完整延续至 2025 年，并确认有 OEM
              使用。上述条件均未满足。缓释与止损标准表（TR005）为任何考虑从清算拍卖中收购 IP 的投资人，结构化总结了可监控触发项、阈值事件和行动含义。
