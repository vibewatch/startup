  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览与类别划分
        blocks:
          - type: paragraph
            body: >
              24M Technologies 面临的竞争格局可拆成四个类别，必须分开分析，因为它们代表不同威胁向量，也落在不同买方决策语境里。

              第一类是中国在位电池制造商——主要是 CATL、BYD、CALB 和 Ganfeng。它们靠制造规模、垂直整合和定价权竞争，而不是靠新型工艺技术。2026 年 1 月，CATL 占全球 EV 电池装机
              45.2%，单月部署 32.5 GWh；LFP 电芯出厂价估计为每 kWh $53–56。排名第二的 BYD 占 13.8%，装机 9.9 GWh。两家公司合计接近全球 EV 电池装机的 60%。CATL 和
              BYD 不是 SemiSolid 的直接产品竞争对手——它们用传统浆料涂布工艺生产成品电芯——但它们是潜在 24M 授权客户对比的现状替代方案。如果电池制造商可以从 CATL 或 BYD 以 $53/kWh
              采购电芯，那么改造产线采用 24M SemiSolid 工艺的商业理由，完全取决于 24M 所称 40% 降本能否让授权客户低于中国价格地板；中国以外制造商面对更高劳动力、土地和能源成本，这一路径并不可信。

              第二类是在位西方和韩国电芯制造商——LG Energy Solution、Panasonic、Samsung SDI 和 SK On。它们面向非中国客户，靠技术差异化和供应确定性竞争。2026 年 1 月，LG
              Energy Solution 全球份额 6.6%，装机 4.7 GWh；Panasonic 份额 4.3%，装机 3.1 GWh。这些公司既可能是 24M
              的客户（作为授权客户），也是其技术竞争对手，因为它们内部都有先进制造和包括固态在内的下一代化学体系研发项目。LG Energy Solution 2026 年 Q1 业绩显示收入 KRW 6.6
              trillion（$4.3B），ESS 电池收入占比升至 20% 多；公司目标是到 2026 年底在北美拥有超过 50 GWh ESS 产能。这些公司拥有庞大分销网络、既有 OEM 关系和制造规模；24M
              若想取代它们，只能从内部通过许可切入，而不是正面竞争。

              第三类是先进电池技术创业公司，处在同一个下一代电芯技术空间：QuantumScape（固态锂金属）、Solid Power（硫化物固态电解质）、SES AI（锂金属混合）和 Sila
              Nanotechnologies（硅碳负极）。这些公司是技术同行，而不是直接授权客户竞争对手；它们不是 24M 的客户，但会争夺同一批 OEM 合作、授权客户 /
              伙伴注意力。它们在尚未产生收入（QuantumScape、Solid Power）或收入早期（SES AI：2026 年 Q1 收入
              $6.7M）的情况下仍能吸引资本、客户和媒体关注，说明市场可以容忍下一代电池技术的长周期——但前提是公司有已验证的资本获取能力和更窄的技术焦点。

              第四类是 24M 和先进电池创业公司的共同现状替代方案：采用浆料涂布电极工艺的传统锂离子制造。严格说这不是传统意义上的「竞争对手」，但它是在位路径，所有新工艺都必须替代它。传统 LFP 和 NMC
              电芯制造已被充分理解，并在自动化、良率提升和原材料采购推动下持续改进，背后还有数万亿美元已部署的 gigafactory 资本。制造商从传统工艺切换到
              SemiSolid，障碍不只是技术验证，还包括既有制造基础设施的核销。
