      - number: '5.2'
        title: 技术组合——ETOP、Eternalyte、Impervio 与 LiForever
        blocks:
          - type: paragraph
            body: >
              ETOP™（Electrode-to-Pack）平台于 2023 年 10 月在 Japan Mobility Show 首次发布，并在 2025 年 9 月面向美国市场推广，它完全取消单体电芯壳体和模组结构。在
              ETOP 架构里，封装在薄聚合物膜中的密封正负极对直接堆叠进电池包壳体；电池包本身成为电极对的结构容器。这去掉了成百上千个单体电芯外壳的成本和重量，也去掉了模组层级互连。24M 称，在 ETOP
              中电极内容物最高可占电池包体积的 80%，而传统 cell-to-pack 设计为 30–60%；由此可让 EV 续航最高增加 50%，或实现同等幅度的电池包减重和降本。ETOP 也兼容 24M 的
              Impervio 隔膜，可通过电池管理系统监测单个电极对。24M 关停前，没有公开宣布任何 ETOP 在商业量产规模的部署。

              Eternalyte™ 电解液于 2024 年 2 月公布，并在 2024 年末从锂金属扩展到石墨和硅负极化学体系。这是一种自研液态配方，在 25°C 下离子电导率约 26
              mS/cm，约为标准电解液的三倍，锂离子迁移数约 ~0.6。高电导率带来快充能力：石墨电极可在 16 分钟达到 90% 荷电状态，锂金属电芯可在 11 分钟达到 80%。在 −20°C 下，Eternalyte
              电芯在 1C 倍率下保留超过 80% 额定容量，而传统电解液在零下温度通常会损失大部分容量。Eternalyte 不需要特殊制造设备，被描述为可直接导入现有产线的升级。

              Impervio™ 隔膜于 2024 年 1 月 CES
              发布，针对锂离子和锂金属电芯中与枝晶相关的安全失效。其自研结构在电极层级物理阻挡金属和锂枝晶扩展——包括制造污染物、电极错位或隔膜缺陷导致的枝晶——同时嵌入隔膜的导电层持续监测电芯电化学状态，让电池管理系统能在潜在短路发生前识别风险，并安全放电受影响电芯。在
              24M 内部过充测试中，未使用 Impervio 的传统 NMC/石墨电芯在过充 15 分钟后短路、38 分钟时爆炸；使用 Impervio 的同款电芯稳定坚持到 60 分钟。启用 Impervio
              的锂金属原型在 2024 年 10 月已发给一家未具名全球主要汽车 OEM，但关停前未进入商业生产。

              LiForever™ 于 2024 年 3 月宣布，是一种直接材料回收工艺，独特之处在于适配无粘结剂的 SemiSolid 格式。由于 SemiSolid
              电极不含有机粘结剂，报废电极材料无需火法或湿法冶金处理即可与电解液分离，避免形成黑粉。回收的活性材料（石墨、LFP、NMC、NCA）保留其晶体结构，只需低成本清洁和补锂，就能恢复全部容量。LiForever 已在
              Rayong 试点设施用退役 LFP 电芯完成演示。
