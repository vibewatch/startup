      - number: '2.3'
        title: 买方、用户与付费方分层
        blocks:
          - type: paragraph
            body: >
              24M 面向的电池市场由三套不同的买方—付费方结构主导，每套结构的采购周期、预算归属和采用触发点都不同。

              在电网级和住宅 ESS 市场——24M 的主要商业渠道——终端买方是电力公用事业、独立电力生产商和住宅客户，但技术买方是授权 SemiSolid 制造工艺的系统集成商或电芯制造商（例如
              Kyocera）。Kyocera 生产 SemiSolid 电芯，并组装成 Enerezza 住宅 ESS 产品，再在日本 feed-in premium 计划下卖给日本业主。Kyocera 2024 年 12
              月宣布，到 FY2026 将 SemiSolid 年产能翻倍至 400 MWh，背后是在 Shiga Yasu 新建产线的 JPY 10 billion 投资——这是 24M
              技术最主要的商业规模化。该技术决策的预算所有者是 Kyocera 的公司战略和制造管理层，而不是住宅终端客户。Enerezza 的商业成功和日本住宅储能需求上升，触发了采用。

              BNEF 估计，公用事业公司拥有约 46% 的已装机电池储能，是表前 BESS 的主要买方。表前系统（占已装机容量 63%）由公用事业和 IPP
              通过竞争性招标或双边合同采购，采购驱动来自电网可靠性、可再生能源并网要求、容量市场收入和能源套利经济性。已装机公用事业级 BESS 成本因时长和项目复杂度不同，介于 $210–390/kWh。24M
              与这些买方的许可谈判隔了一层：他们从系统集成商采购，而不是从技术许可方采购。

              EV 电池买方正剧烈重组。Ford、GM 和 Stellantis 在 2025 年合计确认超过 $53 billion 的 EV 与电池减值，随后把过剩电池产能转向 BESS。Ford 于 2025 年 12
              月解散与 SK On 的 $11.4 billion BlueOval SK 合资公司，并将 Kentucky 电池工厂改用于采用 LFP 方形电芯的 BESS。GM 在 2025 年 Q4 记入 $6
              billion 的 EV 收缩减值。Stellantis 记录了由 EV 战略反转带来的 €22.2 billion 费用。这样的重配意味着汽车 OEM 电池买方已从寻找 EV 优化的 NMC 技术，转向基于
              LFP 的 BESS 生产——原则上，这一转向契合 24M 不绑定化学体系、兼容 LFP 的 SemiSolid 平台，但商业窗口在公司关闭前没有真正打开。

              技术许可方的买方分类是：（a）希望降低制造成本的电池制造商（主要许可买方），（b）希望获得差异化电芯且愿意出资推动合作制造商采用新工艺的 OEM（战略投资方 /
              买方），以及（c）需要本土技术替代方案的政府支持电池项目（拨款和共同投资资金）。24M 三类都覆盖了：Kyocera 和 Fujifilm 是制造授权客户，Volkswagen 是 OEM
              战略投资方，ARPA-E 是政府资金来源。根本商业挑战在于，如何把这种合作结构转化为足以支撑运营的经常性 royalty 收入——从关闭结果看，这套结构没有达到所需商业速度。
