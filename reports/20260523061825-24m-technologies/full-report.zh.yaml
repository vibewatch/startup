      - number: '2.2'
        title: 市场规模测算口径与估算分歧
        blocks:
          - type: paragraph
            body: >
              由于定义不一致，全球锂离子电池市场是市场研究中争议最大的领域之一。已发布的 2026 年估算相差三倍：Custom Market Insights 估计为 $83 billion，Mordor
              Intelligence 为 $136 billion，Fortune Business Insights 为 $207
              billion。差异来自是否纳入电池包组装与电芯制造、存量装机与新增出货如何处理，以及是否纳入中国本土市场。尽调中，产量指标比收入估算更有用，因为电芯价格快速下跌；即使规模增长，按收入口径的 TAM 也在收缩。

              BloombergNEF 的 2025 年电池价格调查提供了最细的「量价桥」：全球电池包价格 2025 年下降 8%，至历史低点 $108/kWh；BNEF 预测 2026 年还会再降 3% 至
              $105/kWh。固定式储能电池包价格 2025 年下降 45% 至 $70/kWh，是所有细分中降幅最大的一类，也首次成为价格最低的细分。LFP 电池包均价为 $81/kWh，NMC 电池包为
              $128/kWh。中国制造电池包均价为 $84/kWh，北美高 44%，欧洲高 56%，反映关税和供应链成本差异。

              聚焦 ESS 部署市场，BloombergNEF 2025 年 10 月展望预计，2026 年全球储能新增 123 GW / 360 GWh，较 2025 年增长 33%（2025 年自身新增 92 GW /
              247 GWh）。InfoLink Consulting 预计 2026 年全球 ESS 电芯出货 801 GWh、装机 353 GWh——装机量与 BNEF 估算基本一致。IEA 的 Global Energy
              Review 2026 确认，2025 年新增电池储能 108 GW，比 2024 年高 40%（2024 年已是纪录年）；LFP 电池目前约占部署量 90%，2025 年新增容量约 80%
              为公用事业级。美国电网级 BESS 市场短期承压：Wood Mackenzie（2025 年 Q2）警告，受关税不确定性和针对中国电池内容的 FEOC 限制影响，2026 年美国公用事业级部署可能收缩
              29%；BNEF 则在 2025 年 7 月预算案保留储能投资税收抵免至 2030 年代后更乐观。

              EV 电池细分中，The Business Research Company 估算 2026 年全球 EV 电池市场为 $108 billion；Grand View Research 估算到 2030 年达
              $198.9 billion，CAGR 21.8%。但这些收入预测必须放在物理市场现实中看：2025 年，美国 EV 销量下降 4%——这是十年来首次下滑——原因是联邦购车税收抵免于 2025 年 9
              月到期；车企合计计提超过 $50 billion 的 EV 资本减值。The Battery Research Company（Dallas Fed）报告称，美国已正式取消超过 10 个已宣布的
              gigafactory 项目，涉及超过 $10 billion 废弃投资。

              作为技术许可方，24M 的 SAM（可服务市场）未独立披露，也无法从 headline TAM 直接推导。许可方的 SAM，是采用该授权工艺的制造产能带来的总 royalty
              或许可收入机会——这一数字需要知道全行业采用率、每 GWh 许可费结构，以及在位工艺的竞争强度。24M 和任何第三方都没有发布这个数字；证据缺口很重要，并保留在尽调缺口部分。
