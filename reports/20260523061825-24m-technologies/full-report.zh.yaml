      - number: '2.5'
        title: 24M 的市场语境、证据缺口与规模尽调
        blocks:
          - type: paragraph
            body: >
              24M Technologies 处在两个相邻市场的交汇处：电池制造技术许可（一个没有公开 TAM 的专业 B2B 细分）和电网 / 住宅 ESS 终端市场（Kyocera 每年 400 MWh 的
              SemiSolid 产量，是唯一有记录的商业规模部署）。以 headline TAM 增长率、电芯价格下降带来的更广泛采用、全球 ESS 装机激增来衡量，市场本身具备吸引力；但这并未阻止公司在 2026 年 3
              月关闭。

              24M 关闭留下的证据链（MIT Technology Review、Dallas Fed、行业专家）一致指向三项压倒公司有利技术定位的结构性市场约束：（1）美国 EV
              市场减速，拿走了技术许可的关键商业锚点；（2）投资人对多年商业化周期、硬件密集型创业公司的兴趣收紧；（3）亚洲制造生态合作（Kyocera、日本）始终难以转化为美国或欧洲商业基础。Volta Energy
              Technologies 的 Kara Rodby 把 24M 称为「a great example of something that should have been easier」——承认
              SemiSolid 相比固态等路线更接近既有锂离子技术，本有结构性优势，但仍不足以支撑商业可持续。

              Freyr 于 2021 年 1 月宣布的 gigafactory 许可协议，授予 Freyr 为挪威规划 40 GWh 工厂使用 24M
              现有及未来技术的无限生产权，正好体现了市场机会与商业执行之间的落差：Freyr 后来自身经历财务重组，挪威 gigafactory 也未按计划推进。Volkswagen 于 2022 年 1 月取得 25%
              股权，在 EV 市场乐观情绪高点提供了 OEM 级背书；但 2023–2025 年间 VW 放缓激进 EV 时间表，降低了 SemiSolid 合作对其供应链的战略紧迫性。

              公开证据无法量化 24M 许可模式的 SAM 和 SOM。公司没有披露许可收入、每 GWh 授权产能的 royalty 费率，也没有披露已经产生经常性付款的活跃授权客户数量。估算 SAM/SOM
              的尽调路径需要：（a）所有活跃授权客户已确认的 GWh 级产量，（b）按 GWh
              或按单位计的许可费结构，以及（c）调查可触达市场池（中国以外）中有能力、有意愿采用授权新工艺的电池制造商。公开来源无法提供这些输入。

              24M 的关闭不应被解读为 ESS 或 EV
              电池市场失败的证据——这些市场仍在增长。它更应被解读为：在资本密集型硬件行业里，新型制造工艺走技术许可模式非常难，尤其当在位工艺强势、亚洲竞争激烈。市场很大且在增长；问题是 24M
              穿越这个市场的具体路径是否商业可行——到 2026 年 3 月，答案是否定的。
