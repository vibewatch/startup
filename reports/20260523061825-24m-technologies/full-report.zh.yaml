      - number: '3.3'
        title: 西方与韩国在位制造商——LG Energy Solution、Panasonic、Samsung SDI
        blocks:
          - type: paragraph
            body: >
              在 24M 的技术许可野心中，LG Energy Solution（LGES）是战略上最重要的在位竞争者。2026 年 1 月，LGES 占全球 EV 电池装机 6.6%，并正经历根本性的业务组合切换：预计
              2026 年 ESS 电池收入将首次超过 EV 电池收入，ESS 销售目标超过 KRW 12 trillion（$8B），EV 电池销售约 KRW 10.3 trillion。LGES 在
              Michigan、Tennessee（与 GM 的 Ultium Cells 合资公司）、Ohio 和 Canada 等设施建设超过 50 GWh 北美 ESS 产能，目标 2026
              年底投产。这一规模直接挑战任何瞄准北美 ESS 制造的许可模式，因为 LGES 带来既有 OEM 关系、制造能力和靠近美国需求中心的地理位置，创业公司授权客户无法复制。

              LGES 2026 年 Q1 业绩（收入 KRW 6.6 trillion，经营亏损 KRW 207.8B）反映出过渡期压力：新 ESS 设施爬坡推高成本，关键北美客户调整库存导致 EV
              电池出货下降。尽管经营亏损，LGES 仍获得超过 100 GWh 的 46-Series 圆柱 EV 电池新订单，截至 2026 年 4 月，总订单积压超过 440 GWh。LGES
              也在开发全固态和钠离子电池，面向下一代产品，把自己放在 24M 和 QuantumScape 当前瞄准的先进化学体系转型控制位上。

              Panasonic 是全球第三大 EV 电池制造商，2026 年 1 月份额 4.3%（3.1 GWh）。它最知名的身份是 Tesla 主要圆柱电芯供应商，也是 Prime Planet Energy &
              Solutions（PPES）的多数股东；PPES 是 Panasonic 与 Toyota 的合资公司，2026 年开始固态电池生产，初始产能 9 GWh/年，目标 2027–28 年首次搭载 Lexus
              车型。Panasonic 的战略位置受益于与 Tesla 的独家深度关系，以及在 Toyota 固态项目中的角色；其制造和客户关系实际上排除了授权 SemiSolid 这类独立工艺技术的可能。

              2025 年 10 月，Samsung SDI 宣布与 Solid Power、BMW Group 签署三方 Joint Evaluation
              Agreement，为一款示范车开发全固态电池电芯。根据协议，Solid Power 向 Samsung SDI 提供硫化物固态电解质，Samsung SDI 将其集成进隔膜和正极电解质，并制造由 BMW
              评估的电芯。这项合作说明，成熟韩国电芯制造商正主动参与先进制造许可竞争——它们是授权材料和工艺的采购方，而不是 SemiSolid 的潜在授权客户。Samsung SDI 是下一代电解质 IP 的战略收购方，不是
              24M 潜在客户。
