      - number: '1.3'
        title: 融资历史与投资方图谱
        blocks:
          - type: paragraph
            body: >
              自 2010 年以来，24M 完成十二轮以上融资，累计超过 $500 million，资金来源包括机构风险资本、战略产业投资和美国政府拨款。最近一轮是 Nuovo+ 领投的 Series H Preferred
              Stock 融资，2024 年 9 月 5 日交割，融资 $87 million，投后估值 $1.3 billion，使 24M 当时跻身独角兽级私营公司。

              Series H 共同投资方包括 Kyocera Corporation（跟投）、Asahi Kasei、Dai Nippon Printing（DNP）、Lucas TVS 和 Mitsui O.S.K.
              Lines，主要是日本和印度工业企业，且都直接押注电池供应链。Volkswagen Group 在 2022 年 1 月的战略性 Series F 中取得 25% 股权，成为最大单一外部股东，也释放了 OEM
              层面对 SemiSolid 路线的背书。Fujifilm 于 2022 年 9 月投资 $20 million，并获得 SemiSolid 平台许可，借助其精密涂布制造积累。挪威电池 gigafactory
              开发商 Freyr 于 2021 年 1 月签署许可协议，获得当前及未来 24M 技术在挪威规划 40 GWh 工厂中的无限生产权。

              政府资金补充了私人资本：24M 于 2023 年 6 月获得 $9 million ARPA-E SCALEUP 拨款，用于面向电动航空的高能量密度锂金属负极电芯；另获 $3.2 million ARPA-E
              EVs4ALL 奖项，与 MIT 和 Carnegie Mellon University 合作开发钠金属电池。这些拨款体现了联邦政府在 Bipartisan Infrastructure Law 和
              Inflation Reduction Act 框架下，对美国本土先进电池供应链建设的支持。

              投资方高度偏向亚洲工业企业，说明许可模式更适配亚洲制造生态，而不是美国生态；这一动态很可能加剧了公司在 2026 年关闭前寻找美国商业锚点的难度。
