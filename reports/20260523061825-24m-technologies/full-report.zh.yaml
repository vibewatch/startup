      - number: '4.4'
        title: 单位经济、成本结构与毛利率分析
        blocks:
          - type: paragraph
            body: >
              24M 的单位经济根本没有披露，因为公司是私有公司，从未在任何公开文件中报告收入、收入成本或毛利率。下面的分析只能用第一性原理推演，并参照公开可得的相邻案例重建其可能成本结构。

              收入端，技术授权方的单件收入由前期授权费（一次性）加单件版税构成。相邻行业的可比技术授权安排（半导体 IP 授权、特种材料授权）通常能拿到被授权方净收入 2–8% 的版税率，或每件
              $0.50–$5.00，取决于技术新颖性和排他性。24M 没有公开披露任何授权合同条款，也没有发布任何定价表。

              成本端，24M 的“轻资产”模式声称资本强度低于电芯制造商。但公司仍要承担 R&D 成本（约 119 名员工、Cambridge 和 Westwood MA 的实验室空间、Rayong
              试点设施）、嵌入伙伴联合开发协议中的工程服务成本，以及一般和行政成本。2024 年 8 月以 $51.1 million 收购 Thailand Rayong
              设施，意味着公司明显偏离纯轻资产模式，并新增持续设施运营成本。

              该技术宣称相对传统锂离子制造可降低 40% 制造成本，这是给被授权方看的客户经济性主张，不是 24M 自身的利润率主张。24M 授权收入的毛利率，取决于授权和版税收入相对 R&D
              与服务交付成本的比例——这些数据均未报告。公开数据无法建立获客成本（CAC）、客户终身价值（LTV）、回本周期或销售周期长度。
