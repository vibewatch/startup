      - number: '7.3'
        title: 伙伴与商业依赖风险
        blocks:
          - type: paragraph
            body: >
              24M 的轻资产授权模式，把每一项商业执行风险都集中到被许可方伙伴身上；到公司关闭时，这种依赖已经证明是致命的。FREYR Battery 曾是 24M 进入美国市场的主要路径。2024 年 11 月 4
              日，FREYR 终止两份许可协议，支付 $3 million 和解款，并放弃 6,975,956 股 Series G 优先股。随后 FREYR 取消了规划中的挪威 Battery Valley GWh
              级工厂和拟建的美国 Georgia 工厂，完全转向太阳能组件和电芯制造。SEC 备案的终止协议和 Nasdaq 公告均确认了和解条款；contracts.justia.com 也印证了协议结构。FREYR
              全面退出电池制造，而不只是更换技术供应商，说明被许可方判断，在中国竞争面前，新型电池制造的长期经济性不可行；问题不只是对 24M 具体平台不满意。Volkswagen Group 于 2022 年 1 月取得
              24M 25% 股权，隐含了制造合作预期；但在关闭前随后四年里，没有任何确认的汽车量产承诺或采用 SemiSolid 技术的 GWh 级工厂部署宣布。Fujifilm 于 2022 年 9 月为工业应用投资
              $20 million，但到 2026 年 3 月也没有商业生产公告。Kyocera Corporation 是唯一以规模化方式生产 SemiSolid 技术的商业被许可方，在日本每年制造约 20,000 套
              Enerezza 住宅储能单元（约 200 MWh/yr）；这一产量完全不足以支撑 $1.3 billion 估值，也不足以资助 24M 持续 R&D 和运营。关键是，所有确认商业部署都在日本；关闭时，24M
              没有美国本土生产被许可方，也没有任何地区的汽车 OEM 商业部署。伙伴 / 依赖风险登记表（TR003）逐一列出各项关系及失败模式；依赖图（FR003）显示商业执行在单一运营伙伴上的结构性集中。
