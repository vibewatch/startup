  - id: TM004
    title: 增长驱动因素和采用约束
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 对市场的影响
      - 尽调问题
    rows:
      - - 可再生能源并网需求（光伏 + 风电配 BESS）
        - 驱动
        - 当前（2025–2030+）
        - 各地区电网级储能存在持续结构性需求；2025 年新增电池容量约 80% 来自公用事业规模（IEA）
        - 按 ISO/RTO 监测电网并网排队；跟踪可再生能源新增容量与储能配套部署率
      - - AI / 数据中心备用电源需求
        - 驱动
        - 当前（2025–2028）
        - 用于 UPS 的 BESS 2025 年增长 30% 至 45 GW（IEA）；单个 Stargate AI 项目可能需要 1 GW 储能；新增需求来源不依赖 EV 周期
        - 跟踪数据中心建设计划和电池备用电源采购规格；评估时长要求（UPS 通常为短时长，会限制部分电芯格式）
      - - 大型制造商将 EV 产能转向 BESS
        - 驱动
        - 立即（2025–2026）
        - Ford、GM、Stellantis、SK On、Samsung SDI、LGES 都把 EV 电池产能转向 BESS；带来新的 BESS 供应量，并加速 LFP 在 EV 之外采用
        - 跟踪产能转换时间表及转向产能的实际 BESS 产出；评估这是否加剧 SemiSolid 被授权方的电芯供应竞争
      - - 美国 IRA 保留电池储能投资税收抵免
        - 驱动
        - 2025–2030s
        - 2025 年 7 月预算法案保留储能 ITC；BNEF 称其在 EV 回撤下仍是支撑美国前景的关键；制造抵免（45X）也被保留
        - 确认适用于 SemiSolid 授权产品的当前 ITC 价值（$/kWh）和 FEOC 合规要求
      - - 新兴市场扩张（澳大利亚、印度、巴西、韩国）
        - 驱动
        - 2026–2028+
        - InfoLink 预计新兴市场贡献 2026 年全球装机增长约 20%；印度、巴西、韩国出现 GWh 级招标；澳大利亚 2025 年新增装机 11.4 GWh（同比 338%）
        - 监测招标授予和项目投运时间表；评估可能影响授权模式的本地化要求
      - - 美国 EV 购车税收抵免到期（2025 年 9 月）
        - 约束
        - 立即（2025–2026）
        - 2025 年美国 EV 销量下降 4%；车企减记 EV 资产 $53B+；计划中的 EV 制造投资取消 $19.9B；EV 电池需求大幅下滑
        - 监测 OEM EV 车型发布节奏和电池供应协议重新谈判；评估 EV 转向 BESS 是否吸收 SemiSolid 兼容应用
      - - 中国 LFP 价格优势（$44–60/kWh，相对全球均值 $81/kWh）
        - 约束
        - 结构性
        - 中国 3.1 TWh 已安装电池产能带来严重价格压力；2025 年美国制造 LFP 电芯比中国同类产品贵 56%；关税部分抵消，但无法消除成本差距
        - 量化被授权方采用 SemiSolid 与从中国采购之间的采用成本；评估声称的 40% 制造成本下降能否抹平成本差距，还是只是缩小差距
      - - 电池制造初创公司的资本强度和「死亡谷」
        - 约束
        - 结构性
        - 盈亏平衡需要约 $2B 和 10 年；最小可行规模为 18–22 GWh；VC 资本与时间线不匹配；电池行业整合不可避免（The Battery Show 2025 行业分析）
        - 评估授权（相对于制造）模式是真能绕开资本约束，还是把约束转嫁给被授权方；判断被授权方是否有足够耐心资本
    notes: >
      上述八项驱动因素和约束并不穷尽，但代表了影响电池制造市场、并与 24M 技术和商业模式关系最密切的关键力量。EV 抵免到期和中国价格竞争是已确认的约束，直接影响 24M 的商业环境；资本强度约束是早于 24M
      存在的结构性特征，也会持续影响任何电池制造创新者。AI / 数据中心驱动因素和 EV 向 BESS 转向是 2025–2026 年出现的最重要新需求动态，但受益者会是仍在市场中的活跃参与方，而不是关闭后的 24M。
    claimRefs:
