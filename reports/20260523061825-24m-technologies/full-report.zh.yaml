      - number: '8.4'
        title: 清算价值与资产回收分析
        blocks:
          - type: paragraph
            body: >
              Branford Group 已受聘对 24M Technologies 的美国资产进行完全关闭拍卖，时间定在 2026 年 6 月 15–18 日。拍卖覆盖三个地点：26 Dartmouth Street,
              Westwood MA 02090；29 Esquire Road, Billerica MA 01821；以及 8 Roosevelt Avenue, Hudson NH
              03051。资产类别包括制造设备、机器人、电池测试与化成设备、实验室仪器、机加工工具和厂务基础设施。多项资产标注为 2024 年，符合泰国设施收购和 Series H 资金支持的运营扩张时间线。

              电池制造困境出售中，实体设备回收通常只能达到原始采购成本每 1 美元回收 10–40 美分。专用电化学测试设备和 SemiSolid
              专用加工工具二级市场有限，会进一步压低回收率。该拍卖被设计为完全关闭出售，没有基准竞标，也没有重组安排，意味着优先清算速度而非回收价值。基于行业困境出售基准和拍卖范围，三个美国地点的实体资产合计回收估计远低于
              $30 million。

              最大的资产不确定性是泰国 Rayong 试点设施，该设施 2024 年 8 月成本为 $51.1 million。美国 Branford Group 拍卖清单没有提到泰国设施。其处置未知：可能已返还
              Nuovo+（原所有者）、通过私下交易单独谈判，或受 Thai BOI/IEAT 监管约束。这在总资产回收图景中造成重大证据缺口。700+ 项专利组合是另一个可能可回收资产，但困境中的电池 IP
              通常以大幅折价出售，除非有资本充足且具备即时生产计划的战略买方参与。鉴于三家具名被许可方（VW、Fujifilm、Kyocera）都可以选择开发竞争性或相邻技术，困境 IP 卖方议价地位很弱。IP 回收估计为
              $1.3 billion 估值所隐含价值的 5–15%。
