      - number: '1.5'
        title: 里程碑、运营状态与反向发现
        blocks:
          - type: paragraph
            body: >
              2010 至 2025 年间，24M 完成了一系列有说服力的技术和商业里程碑，随后在 2026 年初突然关闭。关键拐点包括 2015 年 SemiSolid 技术公开亮相、2021–2022
              年企业许可协议集中落地、2023 年 ETOP 推出和 ARPA-E 政府拨款，以及 2024 年 9 月确认 $1.3 billion 估值的 Series H。

              最重大的反向发现，是公司据报道已关停。2026 年 3 月 12 日，MIT Technology Review 援引 The Information 的 Steve Levine 报道称，24M
              已启动关闭，并将拍卖资产。公司本身保持沉默；发往官方媒体邮箱的邮件无人回复，电话无人接听，联合创始人 Yet-Ming Chiang 拒绝公开发言。Branford Group 随后列出 24M
              在马萨诸塞州三座垂直整合设施的完全关闭拍卖，定时竞价计划从 2026 年 6 月 29 日持续至 7 月 1 日。

              行业分析师和 MIT Technology Review 提到几个结构性因素：资本密集型硬件创新的投资人兴趣收紧；支撑美国电池创业逻辑的 Inflation Reduction Act 关键激励被削弱；EV
              市场降温，主要车企取消车型并削减工厂计划；以及把实验室规模制造创新转化为经商业验证、具备成本竞争力的 GW 级生产，始终困难。Volta Energy Technologies 的 Kara Rodby 将
              24M 形容为「a great example of something that should have been easier」，意思是，相比更具投机性的化学体系，24M 离既有锂离子技术更近，本应更容易。

              SemiSolid 技术主要通过 Kyocera 在日本的住宅储能生产，验证到数百 MW 规模，但公司从未获得足以证明商业模式的 GW 级采用。Kyocera 曾宣布计划在 2026 财年提高 SemiSolid
              产能；关闭消息发布后，该计划状态不明，是尽调中的重大开放问题。

              至少两个独立且高可信来源（MIT Technology Review、BidSpotter
              拍卖清单）支撑了这次负面事件，应按已确认处理。导致关闭的具体治理决定、投资人谈判和技术失败仍未披露，是本章最核心的未解维度。
