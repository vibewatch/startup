      - number: '7.4'
        title: 财务、资本与电池初创资本寒冬
        blocks:
          - type: paragraph
            body: >
              24M 的财务风险画像反映了 2023–2025 年更广泛的电池初创资本寒冬，同时又叠加了其授权模式和闭环融资结构特有的结构性弱点。2012 至 2024 年，公司通过十二轮或更多轮融资累计募资超过 $500
              million，却没有公开披露过任何盈利季度或经营现金流为正的时期。2024 年 9 月 Series H 的结构是：Nuovo+ Company 以 $51.1 million 把泰国 Rayong
              试点设施卖给 24M，并同步把所得款项再投回 Series H 优先股；也就是说，真正新增外部现金约为 $35.9 million，而不是 $87 million。按 2026 年 3 月关闭时间线（Series
              H 结束后约 15–18 个月）计算，以净新增现金为基础的隐含月度净烧钱为 $2.0–2.5 million；如果把完整 $87 million 当作现金跑道基数，则为 $4–7
              million。无论采用哪种算法，两项估计都指向现金快速耗尽。

              更广泛的电池初创资本寒冬，可由 Northvolt AB 在 2024 年 11 月申请 Chapter 11 破产保护说明。Northvolt 此前已融资约 $15
              billion，却仍然倒下，打碎了“资本深度本身足以跨过制造规模化鸿沟”的假设，也降低了机构继续投资电池初创公司的意愿。QuantumScape 在 2025–2026 年继续报告重大亏损，Solid Power
              和 SES AI 也是如此。全球第二大电池制造商 LG Energy Solution 即使订单强劲，2026 年 Q1 仍录得亏损，说明 EV
              价格通缩连龙头也难以抵御。电池技术投资人撤退并非非理性：电池制造初创公司的“死亡谷”——从试点生产到 GWh 级商业产出的鸿沟——通常需要在 R&D 阶段之外再投入 $500 million 到 $5
              billion。24M 的授权模式明确试图避开这个门槛，但其被许可方最终拒绝出资。Sila Nanotechnologies 于 2025 年开出美国首座汽车级硅负极工厂，展示了 24M
              没走成的幸存路径：自建制造，并拿出已验证的产量。人员与执行风险登记表（TR004）记录了关键财务依赖与缺口。
