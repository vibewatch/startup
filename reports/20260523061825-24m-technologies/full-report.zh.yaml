    title: 市场规模金字塔——锂离子电池市场层级
    type: pyramid
    layout: standard
    summary: >
      三层市场金字塔，展示锂离子电池市场从最宽 TAM 定义（全球全部锂离子市场）到与 24M SemiSolid 平台相关的特定技术授权市场的层级。各层数值反映分析师区间中点；24M 的 SAM/SOM
      是受证据约束的估计，并非公司披露数据。
    data:
      items:
        - label: 全球锂离子电池市场（TAM）
          value: $83–207B (2026, analyst range)
          note: 区间很宽，反映各市场报告定义不一致；包括 EV、ESS、消费电子
        - label: 电网 / ESS + EV 电池制造（SAM 代理）
          value: ~$100–150B estimated, not independently verified
          note: 不含消费电子；根据 BNEF ESS 部署数据 + EV 电池市场估计近似；24M 未披露 SAM
        - label: 技术授权 / 新工艺市场（SOM 代理）
          value: Not publicly disclosed; only Kyocera at 400 MWh/yr scale confirmed
          note: 电池制造技术授权子市场没有独立 TAM 估计；无法从公开数据推导 24M SOM
    approximationNotes: >
      第 2 层根据 BRC（$108B EV 电池）和 BNEF/InfoLink ESS 部署数据（Coherent Market Insights 与 Business Research Company 给出的 $68–82B
      固定式储能市场）估算，并扣除消费电子。第 3 层（SOM/技术授权）是证据缺口——没有分析师报告给出电池制造工艺授权的独立市场规模，24M 也从未披露该数字。金字塔表达的是嵌套结构，而非精确收入层级。
