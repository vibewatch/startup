      - number: '8.5'
        title: 估值情景、建议与破题触发项
        blocks:
          - type: paragraph
            body: >
              三个情景覆盖 2024 年 $1.3 billion 估值的结果区间。悲观情景——如今已是现实——假设 24M 进入完全停业清算，美国拍卖回收实体资产 $10–25 million，IP 回收 $0–30
              million（取决于是否出现战略买方），泰国设施回收不确定。考虑到此前轮次形成、必须在 Series H 获得任何剩余前先被满足的总优先权堆叠（累计融资 $500M+），Series H
              优先股持有人面临股权近乎全损。基准情景——现在事实上已被封死——需要授权收入加速到 $50–100 million ARR 才能支撑估值，但这没有发生。乐观情景在发行时假设 FREYR 美国 GWh 级工厂、VW
              汽车量产和 Nuovo+ 泰国扩产会共同推动 2027 年版税收入进入 $100M+ 区间。乐观情景中的三项前提都已被推翻。

              根本的估值错误，是把 24M 定价为商业化风险完全留在被许可方、而不在授权方身上。现实中，当被许可方表现不及预期，授权方面临的是实质性的声誉、战略和资本风险。FREYR
              终止后，授权模式在未来融资中的可信度受损。IRA 制造激励环境恶化后，美国新增电池投资的战略理由变弱。VW 和 Fujifilm 长期停在商业化前阶段后，支撑 $1.3 billion 终值的隐含版税管线蒸发。

              截至 2026 年 5 月，投资建议没有歧义：2024 年 $1.3 billion 估值已严重受损；从持续经营角度看，股权实际上没有价值。对任何参与 Series H
              的投资人，建议将该头寸归类为全损，与停业清算主体沟通了解任何优先权回收，并评估在类破产流程中取得的 IP 权利是否对相邻电池 IP
              项目具有战略价值。估值崩塌完全符合更广泛的电池初创减值模式，且没有公开证据支持优先权堆叠之上存在任何剩余股权价值。
