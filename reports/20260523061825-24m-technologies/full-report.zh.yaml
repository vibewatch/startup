      - number: '6.3'
        title: 被授权方生态——采用阶段、开发证据与商业缺口
        blocks:
          - type: paragraph
            body: >
              除 Kyocera 外，24M 还积累了一批被许可方，覆盖地域（印度、泰国、欧洲），或分散到不同技术赛道（汽车、ESS、精密制造）。公司关闭前，没有一家进入 SemiSolid 电芯商业化量产。

              **Lucas TVS / TVS Indeon（印度）：** Lucas TVS 与 24M 签署许可和服务协议，并作为 Series H 共同投资方参投。其子公司 TVS Indeon 于 2024 年 8
              月在 Chennai 附近 Thervoy Kandigai 的 1 GWh 工厂启动电池包组装业务，面向印度 EV 和 ESS 市场。到 2025 年 3 月，TVS Indeon 已扩至每天
              1,000–1,500 个电池包，并宣布追加 ₹200 crore 的 R&D 投资。采用 24M SemiSolid 工艺的电芯制造被列为中期目标，但截至 2026 年初尚未启动。电池包组装（使用外购电芯）与
              SemiSolid 电芯生产（依赖 24M 专有工艺）之间的缺口，就是仍未跨过的关键一步。

              **Nuovo+/GPSC（泰国）：** Nuovo+ Company Limited 是 Arun Plus 与 GPSC 的合资公司，二者均属于泰国 PTT Group。2024 年初，Nuovo+ 以约
              USD 51 million 的优先股权益，把位于泰国 Rayong 的 Map Ta Phut 工业园电池设施转给 24M。该设施最高产能 100 MWh，随后成为 24M Technologies
              (Thailand) Limited，并为一家未具名的印度出行 OEM 启动试生产，验证样品计划在 2024 年秋交付。GPSC 投资者关系材料确认双方合作，以加速下一代电池技术验证。24M
              关闭前，没有确认向这家未具名 OEM 形成商业供货。

              **Fujifilm Corporation（日本）：** Fujifilm 于 2022 年 9 月投资 USD 20 million 可转债，并获得 SemiSolid
              平台许可，意图把自身精密涂布制造能力用于量产认证。截至本研究锚定日期，公开资料未披露已确认的商业生产或认证里程碑。

              **Volkswagen Group（欧洲）：** VW 于 2022 年 1 月取得 25% 股权，并被广泛报道为 24M 在 2024 年 10 月发给“一家大型全球汽车
              OEM”的锂金属原型电芯的可能接收方。VW 旗下 PowerCo 在 Salzgitter（德国）、Sagunto（西班牙）和 St. Thomas（加拿大）都有 GWh 级工厂项目，但没有任何 PowerCo
              工厂公开确认整合 SemiSolid 生产。VW 关系是汽车级规模量产最具战略意义的潜在客户，但公司关闭前没有被商业激活。

              **FREYR Battery（已终止）：** FREYR 于 2021 年 1 月为其挪威规划中的 40 GWh Clean Facility 签署无限制 SemiSolid 许可。到 2023 年，FREYR
              已转向放弃挪威 GWh 级工厂开发；2024 年 11 月，双方共同终止全部许可和服务协议。FREYR 放弃近 7 million 股 Series G 优先股，并向 24M 支付 USD 3 million
              和解款。该终止对更广泛的授权许可逻辑构成重大负面信号。
