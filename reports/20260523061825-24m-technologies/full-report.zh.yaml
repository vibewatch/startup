      - number: '5.4'
        title: IP 位置与学术基础
        blocks:
          - type: paragraph
            body: >
              截至公司最后一次披露更新，24M 的知识产权组合包括 700+ 项专利和专利申请，覆盖 SemiSolid 电极组成与制造、ETOP 电池包集成、Impervio 隔膜架构、Eternalyte
              电解液配方、LiForever 回收方法和锂金属电芯设计。基础 IP 源自 MIT 研究：Yet-Ming Chiang、W. Craig Carter 和 Mihai Duduta 在 Advanced
              Energy Materials（1[4]:511–516, 2011）发表开创性论文 “Semi-solid lithium rechargeable flow battery”，确立了 SemiSolid
              概念，也构成公司专利组合的科学基础。两项基础专利——US 8,722,226 和 US 8,722,227（高能量密度氧化还原液流装置，2014 年 5 月授权）——来自 MIT 研究，并共同转让给
              24M。PatSnap 称 Chiang 职业生涯中列名发明人超过 1,250 项专利；他为 SemiSolid 电极和非对称锂金属 / SemiSolid 正极电芯架构（Grant
              11,394,049）贡献了理论框架。

              24M Technologies, Inc. 的 USPTO 文件显示，公司在 2022–2024
              年仍有活跃专利计划，覆盖电化学浆料组成、连续和半连续电极生产方法、隔膜密封、过充保护机制、电流中断装置，以及电化学电芯修复方法。权利要求覆盖面显示，24M 重点保护的是工艺 IP（制造步骤），而不是材料
              IP（特定化学体系）；这与授权模式一致，因为伙伴会供应自己的正极和负极材料。不过，公司进入关停时没有披露 IP 收购方，因此截至 2026-05-23
              这一研究锚点日，专利组合去向——出售、授权，还是由清算实体持有——仍未知。
