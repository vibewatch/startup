      - - 相对西方传统锂离子电池，制造成本降低 40%
        - 中国龙头（CATL / BYD）连西方传统成本也能压低 56%+；SemiSolid 优势无法弥合与 中国进口的差距
        - 严重
        - 没有西方被授权方认为成本账足够有吸引力并持续投资；FREYR 将“电池价格下跌”（中国 竞争）列为终止授权的主要原因
      - - 化学体系无关性（兼容 LFP、NMC、锂金属）扩大可触达授权方市场
        - 中国制造商已按规模生产所有化学体系；符合 FEOC 要求的市场规模有限
        - 中等
        - Kyocera ESS 使用兼容 LFP 的 SemiSolid；没有锂金属或 NMC 被授权方达到商业规模
      - - 轻资产授权模式降低 24M 资本强度
        - 被授权方资本需求（每座可行 gigafactory $2B+）仍然高企；24M 无法控制被授权方执行
        - 严重
        - FREYR 的 $2.6B 工厂在市场条件下资本过重；24M 没有机制为被授权方执行提供资金或 救助
      - - 作为 SemiSolid 制造工艺类别的先发优势
        - QuantumScape（固态）和 Sila（硅负极）也因竞争性工艺创新获得类似 OEM 关注；24M 并不是先进电池工艺授权的唯一玩家
        - 中等
        - 24M 关闭后，QuantumScape 仍保留 $971M 现金和活跃授权管线；Sila 开设美国工厂；24M 的先发地位没有转化为持续 OEM 采用
      - - 政府拨款（DOE、ARPA-E）验证技术并支持研发
        - 政府拨款提供验证，但不是商业收入；竞争对手（Sila：$120M+ DOE、QuantumScape： 政府合同）也获得大量公共资金
        - 低
        - DOE / ARPA-E 资金未能阻止关闭；政府项目验证了技术，但不足以充当商业托底
      - - Northvolt 式执行风险存在于传统制造商；SemiSolid 更易规模化
        - Northvolt 倒下说明，无论路线如何，电池制造执行风险都很高；SemiSolid 的相对简单没有为 被授权方创造同等优势
        - 严重
        - Northvolt 用传统技术融资 $15B、拿到 $50B 订单后仍失败；24M 更简单的工艺没有吸引到 维持公司所需规模的制造伙伴
    notes: 风险严重性（严重 / 中等 / 低）是基于已记录商业结果的分析判断。结果证据反映截至 2026 年 5 月的公开信息；关于 24M 内部决策的私人信息不可得。
