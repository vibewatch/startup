      - number: '8.2'
        title: 公开市场可比公司分析
        blocks:
          - type: paragraph
            body: >
              三家上市电池技术公司为 24M 提供最直接相关的市场可比对象：QuantumScape Corporation（QS）、Solid Power Inc.（SLDP）和 SES AI
              Corporation（SES）。三者都走过类似的商业化前授权或电芯开发策略，都在市场估值峰值通过 SPAC 合并上市，并在此后经历严重倍数压缩。没有一家实现商业规模收入。

              QuantumScape 于 2020 年 11 月通过 SPAC 合并上市，隐含企业价值约 $3.3 billion。公司在为汽车应用开发固态锂金属电池，并与 Volkswagen 合作授权技术。截至 2026
              年 Q1，QuantumScape 仍在高额烧钱，没有商业规模产品收入。公司报告其 Cobra 隔膜工艺进入基线生产，但汽车级商业制造仍需数年。QuantumScape 市值已较 IPO
              后高点大幅下跌，展示了适用于商业化前电池 IP 平台的倍数压缩路径。

              Solid Power 于 2021 年通过 SPAC 上市，与 BMW 和 Samsung SDI 合作开发全固态电池。2025 年 10 月，Solid Power 与 Samsung SDI、BMW
              正式达成三方合作，推进全固态电池技术。FY2025 业绩显示公司仍在亏损，且没有有意义的商业收入。股价反映市场持续折价商业化风险。Solid Power 的路径——有头部汽车 OEM
              合作，却没有商业收入——映射了 24M 与 Volkswagen 的关系。

              SES AI Corporation 披露的 2026 年 Q1 财务结果显示，公司持续亏损，烧钱速度若无额外融资将难以长期维持。SES AI 研发锂金属软包电芯，并与主要汽车 OEM
              合作，但尚未实现商业规模生产。公司市值仅为 SPAC 时代估值的一小部分。

              横跨这三家可比公司，市场都相对原始 SPAC 估值给出严重折价，确认没有商业规模收入的电池技术平台会随时间面对结构性倍数压缩。这一压缩与 24M 私募市场 $1.3 billion 估值标记直接相关。
