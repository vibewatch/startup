      - CE004
      - CE005
      - CE006
      - CE031
      - CE032
      - CE040
    notes: >
      干法电极和固态电池数据来自对竞争对手的公开报道中的外部市场估计（Tesla 收购 Maxwell，2019；QuantumScape SEC 文件）。24M 的资本开支降幅由公司披露，并得到 MIT News
      佐证，但未经过任何第三方制造顾问独立审计。纳入固态电池对比，仅用于定位 24M 兼容锂离子电池的路线与下一代押注的差异。
