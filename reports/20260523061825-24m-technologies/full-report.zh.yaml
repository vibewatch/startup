  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、定义与范围
        blocks:
          - type: paragraph
            body: >
              尽调中，24M 的市场分析需要拆开三类经常在 headline TAM
              数字中混用的支出：（i）电池电芯制造（使用电化学材料和工艺设备生产原始电芯），（ii）电池系统集成（把电芯组装成卖给终端用户的电池包和系统），以及（iii）电池部署（公用事业、IPP、商业运营商和住宅消费者购买完整电池储能系统）。24M
              的 SemiSolid 制造平台位于第（i）层：它是授权给电池生产商的制造工艺，不是卖给终端买家的成品电芯或系统。这个区分对市场规模测算极其关键——电芯制造 TAM（制造商销售电芯产生的收入）明显小于全球
              BESS 部署市场（项目开发商和集成商获得的收入），也小于最宽口径的电池市场（价值链上的 capex 和 opex）。

              24M 面向的储能市场包括：固定式电网级 BESS、住宅储能（代表案例是 Kyocera 基于 SemiSolid 电芯打造的 Enerezza 产品），以及面向汽车 OEM 的 EV
              电池制造。消费电子电池市场（手机、笔记本电脑、便携设备）不在主要范围内，因为 24M 的 SemiSolid
              平台面向更大规格电芯开发，其商业伙伴（Kyocera、Volkswagen、Fujifilm、Freyr）瞄准电网、住宅和汽车应用。相邻领域包括电动航空和 eVTOL（24M 获得 ARPA-E SCALEUP
              资金）以及钠金属电池（ARPA-E EVs4ALL 拨款），但这些仍处早期阶段，对审查期内商业规模测算不构成重要影响。

              SemiSolid 技术的现状替代方案，是采用浆料涂布和电极干燥的传统锂离子制造工艺——CATL、BYD、Panasonic、LG Energy Solution 等主流厂商使用的占优路径。SemiSolid
              竞争的是制造工艺替代方案，而不是一种独立化学体系；其不绑定化学体系的特性（兼容 LFP、NMC 和先进形式）使其定位成叠加在既有电池化学生态上的降本和简化工具。因此，竞争比较不是电芯化学体系 X 对比化学体系
              Y，而是 SemiSolid 工艺对比传统浆料涂布工艺，目标收益是制造成本最高降低 40%，并消除高耗能电极干燥环节。
