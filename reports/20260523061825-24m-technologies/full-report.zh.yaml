  - id: TV006
    title: 最终尽调询问事项表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 泰国 Rayong 工厂处置
        - Rayong 工厂转让、出售或返还 Nuovo+ 均无公开披露；未列入 Branford Group 美国拍卖
        - 其收购成本为 $51.1M（约占 Series H 净资本的 60%），处置结果是总资产回收的最大单一变量
        - 联系 Branford Group 清算财产管理人；联系 Nuovo+ / GPSC 投资者关系；查阅泰国 BOI/IEAT 记录
      - - 知识产权组合评估与买方兴趣
        - 700+ 项专利组合估值或停业清算中与战略买方沟通情况均无公开披露
        - 电池知识产权买方溢价（战略买方 vs. 拍卖困境定价）可能在 $0 到 $100M+ 之间；对回收高度重要
        - 委托 Anaqua、CPA Global 或类似机构进行独立知识产权估值；跟踪 USPTO 转让记录
      - - 关闭时优先权堆栈分配瀑布
        - 12+ 轮累计优先股清算优先权总额未公开披露；这是判断 Series H 回收的关键
        - 若合计优先权超过总资产回收，则无论知识产权 / 泰国资产结果如何，Series H 持有人股权回收为零
        - 向清算财产管理人或 Series H 共同投资人索取股权结构表和优先权分配瀑布
      - - 关闭后 Kyocera 授权状态
        - Kyocera 的 SemiSolid 授权是否在 24M 停业清算后继续存续，或是否需与知识产权买方重谈，均无披露
        - 若 Kyocera 继续生产，授权知识产权仍有持续收入价值；若放弃，知识产权价值仅剩防御 / 阻断
        - 联系 Kyocera 企业传播部门；通过清算财产方审阅授权协议控制权变更条款
      - - Series H 共同投资人身份
        - 公开具名的 Series H 投资人只有 Nuovo+；其他投资人及其合计出资金额未披露
        - 共同投资人联盟会影响停业清算中组织债权人代表的能力，也影响知识产权处置决策治理
