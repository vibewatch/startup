  - id: FU001
    title: 客户旅程图——24M Technologies 许可模式
    type: journey-map
    insight: 24M 的商业旅程只有一个确认的「完成」案例：Kyocera 达到商业规模生产。其他所有被许可方都停在评估、签署许可或试点阶段，或已经退出——这说明该模式入口漏斗很宽，但商业出口极窄。
    data:
      items:
        - id: jm-awareness
          label: 认知 / 技术评估
          actor: 电池制造商或 OEM
          description: 潜在被许可方通过行业媒体、MIT 研究网络、展会或直接触达了解到 SemiSolid 技术，并评估该工艺与自身制造布局、化学体系目标和资本开支假设的匹配度。
          channels:
            - MIT 学术网络
            - 行业会议（Japan Mobility Show、CES、Reuters Automotive）
            - 行业媒体（electrive、batteriesnews、BusinessWire）
        - id: jm-license-execution
          label: 许可协议签署
          actor: 电池制造商或 OEM + 24M 商务拓展
          description: >-
            签署许可和服务协议；支付前期费用；获得 IP 访问权，包括工艺文件、know-how 转移和培训。合作伙伴包括：Kyocera（约 2020 年）、FREYR（2021 年 1 月）、Fujifilm（2022 年
            9 月）、Lucas TVS（约 2024 年）、Nuovo+（2024 年 Series H 领投方）。
          channels:
            - 直接 B2B 谈判
            - 法律顾问（Tilleke & Gibbins、TTT+Partners）
            - Series H 共同投资结构（投资者—被许可方利益一致模式）
        - id: jm-pilot-production
          label: 试点 / 认证生产
          actor: 被许可方工程团队 + 24M 工艺支持团队
          description: 被许可方使用 SemiSolid 工艺设备和 24M 技术支持，建立试点电芯产线。生产样品电芯，用于按 OEM 或产品规格做资格测试。Kyocera 已通过；Rayong 试点为印度 OEM 启动。
          channels:
            - 被许可方自有工厂（Kyocera Shiga Yasu；TVS Indeon Tamil Nadu；泰国 Rayong）
            - 24M 工程支持和 know-how 转移
        - id: jm-regulatory-qualification
          label: 监管 / 产品认证
          actor: 被许可方 + 监管机构 + OEM 质量团队
          description: 产品按安全、性能和可靠性标准进行认证：日本住宅 ESS（Kyocera Enerezza 已通过 JIS 和 PSE 认证）；汽车 OEM 认证（2–4 年周期；Kyocera 之外无确认完成）。
          channels:
            - 日本监管机构（Kyocera）
            - 汽车 OEM 质量项目（VW、印度 OEM——未确认）
        - id: jm-commercial-production
          label: 商业规模生产
          actor: 被许可方制造运营
          description: >-
            被许可方实现商业批量制造；SemiSolid 电芯规模化生产；24M 按单位或按 kWh 收取权利金。只有 Kyocera 确认到达这一阶段：20,000 units/yr（200 MWh/yr），并向 400
            MWh/yr 目标增长。
          channels:
            - Kyocera Shiga Yasu 工厂（已确认）
            - Kyocera 销售与分销（日本住宅，152 国网络）
        - id: jm-expansion-renewal
          label: 扩张与续约
          actor: 被许可方 + 24M 客户管理
          description: >-
            成功的被许可方扩产、进入新地区，或许可更多 24M 平台。Kyocera 宣布投入 JPY 10B 翻倍产能；获得 Tanahashi Award；并接入 TEPCO/ENERES
            VPP。其他被许可方均未达到此阶段。
          channels:
            - 被许可方战略规划
            - 公用事业 / VPP 合作（TEPCO、ENERES）
            - 新产品线许可（ETOP、Eternalyte、Impervio 附加项）
