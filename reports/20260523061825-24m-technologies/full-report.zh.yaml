      - number: '4.6'
        title: 财务结论——收入质量、利润率路径与尽调阻断点
        blocks:
          - type: paragraph
            body: >
              24M Technologies 的财务画像有大量无法验证的主张，并且已经出现严重反向结果，常规承销空间基本被封死。以下结论覆盖本章六项内容要求。

              收入质量低：唯一确认达到商业规模的收入来源，是 Kyocera 在日本住宅储能领域的授权安排。Kyocera 当前约 200 MWh 产量，如果按行业类似 2–8% 电芯收入版税率估值，24M
              年度版税收入也只有个位数百万美元，远低于一家累计融资 $500M+、约 119
              人组织所需规模。其他授权流要么未进入生产（VW、Fujifilm、FREYR），要么只处于试点阶段（Nuovo+/Thailand）。

              利润率路径无法从公开资料中发现。轻资产逻辑理论上应支持授权收入的高毛利率，但 Thailand 设施收购引入资本开支和运营成本，削弱利润率质量。没有已报告财务数据，毛利率无法评估。

              授权逻辑显著低估了资本强度。$51.1 million Rayong 设施收购、Massachusetts 三处设施持续运营，以及约 119 人团队，都代表大量持续成本，与纯 IP 授权业务不一致。

              资本充足性结论：Series H 之后，公司资本不足以支撑超过约 18 个月运营。最终走向完整关停拍卖，而不是战略出售或重组，说明没有剩余股权价值，也没有买方愿意承接持续负债。

              尽调阻断点：最主要、无法解决的缺口是收入和年经常性收入（ARR）、烧钱速度和现金跑道、毛利率、授权合同条款，以及导致关停的治理决策。只有接触清算资产中的财务记录才能回答这些问题，而这些记录并未公开。
