      - number: '3.2'
        title: 中国在位厂商竞争——CATL、BYD 与定价权
        blocks:
          - type: paragraph
            body: >
              CATL 在 2026 年的竞争位置，是任何西方先进电池制造创业公司面对的最严峻结构性威胁。2026 年 1 月，CATL 全球 EV 电池份额 45.2%；2026 年 Q1，其中国本土份额
              50.1%，达到五年来最高。这样的规模和成本结构，是任何许可模式公司在中期都无法匹敌或可信威胁的。2026 年，CATL 中国 LFP 电芯出厂价估计为每 kWh $53–56；相比之下，BNEF
              数据显示全球所有化学体系电池包均价约 $105/kWh。Benchmark Mineral Intelligence 认为，美国制造电芯相对中国同类产品有约 56%
              的结构性成本溢价；即使计入美国对中国电池进口的关税，价差仍然存在。

              CATL 的成本领先建立在三项结构性优势上：（i）巨大的规模经济——中国电池总制造能力估计约 3.1 TWh，远超全球需求，高产出为利润率提供缓冲；（ii）向正极、负极材料生产等原材料环节垂直整合，使 CATL
              能在价值链多环节获取制造利润；（iii）持续 Cell-to-Pack（CTP）创新，取消模组级封装，这与 24M ETOP 平台目标相同，但商业规模大几个数量级。CATL 的 Shenxing 和 Qilin
              电池平台可在四分钟内完成 10–80% 充电，显示其性能创新仍在继续，直接竞争先进电池创业公司有关能量密度和循环寿命的主张。

              BYD 是全球第二大电池制造商，全球份额 13.8%，竞争画像不同。BYD 的 Blade LFP 电池取消传统方形电芯模组结构，通过 cell-to-pack 集成带来安全收益，概念上接近 24M 的 ETOP
              主张，但使用 LFP 化学体系，并已达到庞大商业规模。BYD 的关键结构性优势是向整车制造垂直整合：通过内部消化大部分电池产出，BYD 捕获电池—整车堆栈的完整利润，避免 24M
              授权客户这类第三方供应商面对的公司间转移定价低效。BYD 2026 年 Q1 中国本土份额为 17.5%，同比下降——反映 CATL 的主导地位——但其全球品牌和成本位置仍很强。

              CATL/BYD 价格地板实际上界定了 24M 技术许可主张可运行的经济边界。没有西方电池授权客户能在商业规模下做到 $53–56/kWh 电芯成本，无论是否采用 SemiSolid 工艺优势。SemiSolid
              许可的现实场景，是相对其他西方制造商获得成本优势，而不是相对中国在位厂商；这把可触达授权客户池限制在中国以外、面向非中国市场制造的公司。这一结构性约束，是 24M 商业执行挑战的核心之一。
