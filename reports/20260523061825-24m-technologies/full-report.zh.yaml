      - number: '8.3'
        title: 困境可比与电池初创失败类比
        blocks:
          - type: paragraph
            body: >
              Northvolt AB 是对 24M 最有启发的失败类比。Northvolt 从 Volkswagen、Goldman Sachs、European Investment Bank 等明星投资方累计募集约
              $15 billion 股权和债务融资，并在瑞典建设 GWh 级锂离子产能。即便拥有如此巨大的资本基础，Northvolt 仍于 2024 年 11 月 21 日在美国申请 Chapter 11 破产保护，与
              24M Series H 完成处于同一季度。Northvolt 失败被归因于电芯质量缺陷、未达生产目标、失去 BMW 大订单，以及无法把制造爬坡到商业规模。该破产证明，即使资本规模达到 24M 累计融资的
              30×，也无法保证新型电池制造路线具备商业可行性。

              FREYR Battery 的路径是 24M 自身伙伴生态中的直接类比。FREYR 融资建设一座 40 GWh 挪威工厂和一座 $2.6 billion 的美国 Georgia Giga America
              设施，两者都使用 24M SemiSolid 技术。到 2024 年 11 月 4 日，FREYR 终止两份许可协议，并向 24M 支付 $3 million 和解款。随后 FREYR 取消 Georgia
              电池工厂，完全转向太阳能组件制造，彻底放弃对 24M 技术的押注。FREYR 终止消除了 24M 唯一重要的美国商业授权前景，并显著缩小了支撑 $1.3 billion 估值的可触达版税基础。

              更广泛的电池初创困境——Northvolt Chapter 11、FREYR 转向、多个 SPAC 时代电池公司以大幅折价交易——为 24M 私募估值构成强有力的下行可比组。每个案例里，从技术展示到 GWh
              级生产的商业化缺口都比授权收入更快吞噬资本。24M 的轻资产授权模式本来就是为避开这个陷阱而设计，但它对被许可方执行的依赖，只是把商业失败风险转嫁给伙伴；当伙伴失败或退出，收入基础就蒸发。
