  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 关停、清算与资产出售风险
        blocks:
          - type: paragraph
            body: >
              24M Technologies 的关闭风险已经完全兑现：到 2026 年 3 月，公司已进入停业清算程序；由 Branford-Marcotte Group 通过 BidSpotter
              管理的全部资产公开拍卖计划于 2026 年 6 月 29 日启动。拍卖覆盖公司 Cambridge, Massachusetts
              总部的全部财产，包括制造设备、实验室仪器、试点产线设备、家具和固定装置。AuctionZip 清单也印证了范围和日期。MIT Technology Review 2026 年 3 月关于美国电池行业的文章明确把
              24M 列为已关闭公司，并把失败描述为电池初创资本更大范围收缩的缩影，而非孤立的管理失误。Archyde 的独立分析同样认为，24M
              关闭源于规模化风险、不利市场时点，以及过度依赖授权模式；该模式把商业执行完全交给伙伴。站在清算角度，最急迫的近期风险是 24M 700+
              项专利组合的处置。公开拍卖可能让竞争性的中国电池制造商、现有电芯厂或专利主张实体买下覆盖 SemiSolid 制造工艺、Impervio 隔膜、Eternalyte 电解液和 ETOP 架构的基础
              IP。若发生这种收购，未来美国电池创新可能受限，合规制造商也可能遭遇许可诉讼。法律风险登记表（TR001）覆盖完整的监管与法律敞口，包括 ARPA-E
              资助里程碑合规、潜在追回义务，以及关闭引发的待决诉讼。风险热力图（FR001）汇总了各风险类别的综合严重性和可能性。FREYR 终止、EV 市场放缓、中国电池成本下探和 Series H
              闭环结构叠加，形成互相强化的失败条件，单一管理动作已无法扭转。
