  - id: FV002
    title: 估值敏感性
    type: bar
    insight: >
      24M 的 $1.3B 估值对许可收入倍数和 ARR 假设高度敏感。在任何证据能支撑的 ARR（仅 Kyocera 的基准 ~$2–5M）下，$1.3B 隐含收入倍数为
      260–650x——任何可比技术许可方都撑不住。即便采用激进的乐观情景 ARR $50M，按市场倍数也只能支撑 $375–750M。悲观情景（关闭清算）意味着持续经营价值为零。
    data:
      items:
        - label: 悲观：清算价值（实物资产 + IP 估计）
          value: 0.035
          unit: $B
        - label: 基准情景 $5M ARR，12x 倍数
          value: 0.06
          unit: $B
        - label: 基准情景 $20M ARR，10x 倍数
          value: 0.2
          unit: $B
        - label: 乐观情景 $50M ARR，12x 倍数
          value: 0.6
          unit: $B
        - label: 乐观情景 $100M ARR，8x 倍数
          value: 0.8
          unit: $B
        - label: 24M Series H 估值（Sept 2024）
          value: 1.3
          unit: $B
    approximationNotes: >
      ARR 估计仅作示意；24M 没有披露任何收入数字。仅 Kyocera 的 $2–5M ARR，按约 ~200 MWh/year、行业类似特许权使用费率为电芯收入 2–8% 估算。8–15x 收入倍数参考可比 IP
      许可公司区间（Solid Power、QuantumScape）和一般 SaaS/IP 先例。$0.035B 清算估计包括实物资产（$10–25M）加 IP 困境估值（$0–10M
      中点）；由于存在证据缺口，泰国工厂不纳入该估计。
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV033
      - CV038
      - CV041
  - id: FV003
    title: 估值 / 回报区间
    type: range
    insight: |
      各情景估值区间确认，悲观情景（关闭清算）已经成为现实。乐观情景区间原本就取决于多个被许可方同步规模化，而这些都没有发生。以 $1.3B 进入的 Series H 投资者，连乐观退出也已不存在；回收只剩满足优先股堆叠后的清算收益。
    data:
      items:
        - label: 悲观情景 — 清算（已成为现实）
          low: 0.01
          mid: 0.035
          high: 0.06
          unit: $B
        - label: 基准情景 — Series H 时点（已失效）
          low: 0.2
          mid: 0.5
          high: 0.9
          unit: $B
        - label: 乐观情景 — 全面规模化（已无可能）
          low: 0.8
          mid: 1.5
          high: 3
          unit: $B
        - label: 24M Series H 入场估值
          low: 1.3
          mid: 1.3
          high: 1.3
          unit: $B
    approximationNotes: >
      悲观情景的低 / 中 / 高分别代表仅实物资产回收（$10M）、实物资产 + IP 估计（$35M）、实物资产 + 部分泰国回收（$60M）。基准和乐观情景在 Series H
      发行时只是理论假设，现在已被关闭清算封死。悲观情景可回收价值在所有情景下都够不到 Series H 投资者，股权回收事实上为零。
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV032
      - CV033
      - CV039
      - CV040
  - id: FV004
    title: 投资 KPI
    type: kpi
    insight: |
      24M Technologies 在每个可投资维度都落在关键 / 受损端：上一轮估值严重受损，商业收入没有跑出来，被许可方网络崩塌，IP 价值只剩困境水平，预计股权回收为零。KPI 快照确认，2024 独角兽估值没有守住。
    data:
      items:
        - label: 上一轮估值
          value: $1.3B (Sept 2024 Series H)
          status: impaired
          note: 严重受损；公司处于关闭清算；股权低于优先股堆叠
        - label: 累计融资
          value: $500M+ across 12+ rounds
          status: confirmed
          note: 多方来源确认；具体轮次拆分仅部分可得
        - label: 商业收入（许可）
          value: Undisclosed; estimated <$10M/yr
          status: missing
          note: 只有 Kyocera 达到商业规模；特许权使用费率或收入数字未披露
        - label: 关闭时活跃商业被许可方
          value: 1 (Kyocera only)
          status: confirmed
          note: FREYR 于 Nov 2024 终止；VW 和 Fujifilm 从未投产
        - label: 隐含月度烧钱
          value: $4–7M/mo (estimated)
          status: estimated
          note: 由 $87M 融资和 18 个月现金跑道推算；未披露
        - label: IP 组合规模
          value: 700+ patents
          status: confirmed
          note: 公司披露确认；清算价值未披露
        - label: Series H 股权回收（预计）
          value: ~0% (below preference stack)
          status: impaired
          note: 实物资产 + IP 回收估计远低于合计优先股堆叠
        - label: 关闭清算状态
          value: Complete closure — confirmed
          status: confirmed
          note: MIT Technology Review March 2026；Branford 拍卖 June 2026
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV006
      - CV007
      - CV008
      - CV025
      - CV041
