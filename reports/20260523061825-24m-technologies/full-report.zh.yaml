  - id: FE001
    title: 24M SemiSolid 产品架构——技术栈
    type: stack
    layout: standard
    summary: |
      分层技术栈展示 SemiSolid 电极基础如何支撑另外四个自有平台，从底层制造工艺一直到寿命终止后的回收。
    claimRefs:
      - CE001
      - CE007
      - CE011
      - CE016
      - CE021
    data:
      layers:
        - id: layer_semisolid
          label: 第 1 层——SemiSolid™ 电极制造平台
          detail: |
            无粘结剂、无溶剂的厚电极工艺。面容量 6–12 mAh/cm²。公司声称资本开支降低 40–65%。它是所有其他平台的基础。
          items:
            - 浆料配方（活性材料 + 电解液 + 碳，无粘结剂）
            - 直接浇铸到集流体箔上（无需干燥炉，无 NMP 回收）
            - 无溶剂；取消辊压；制造步骤减少约 50%
        - id: layer_unit_cell
          label: 第 2 层——Unit Cell / ETOP™ 电池包集成
          detail: |
            密封的阴极 / 阳极对（Unit Cell）直接堆叠进电池包壳体（ETOP）。电极体积分数最高 80%。省去电芯外壳和模组结构。
          items:
            - 薄聚合物膜中的密封电极对（Unit Cell）
            - ETOP 单机装配（密封、堆叠、布线、封闭）——无电芯外壳
            - 相对电芯直装电池包，EV 续航最高增加 50%，或实现同等成本下降
        - id: layer_safety
          label: 第 3 层——Impervio™ 隔膜 + Eternalyte™ 电解液
          detail: |
            安全与性能增强层。Impervio 阻断枝晶并检测故障。Eternalyte 提供 3x 离子电导率；−20°C 下容量保持 >80%。
          items:
            - Impervio——抑制枝晶 + 实时 BMS 故障检测
            - Eternalyte——约 26 mS/cm 离子电导率；16 min 快充至 90%
            - 组合堆栈目标为 1,000 英里电池（公司预测）
        - id: layer_recycling
          label: 第 4 层——LiForever™ 直接材料回收
          detail: |
            寿命终止层，只有无粘结剂 SemiSolid 形态具备。没有黑粉；活性材料以原始晶体形态回收。
          items:
            - 不经火法 / 湿法冶金分离（无黑粉）
            - 低成本清洗和再锂化，回收全部容量
            - 兼容 LFP、NMC、NCA、石墨；不依赖化学体系
