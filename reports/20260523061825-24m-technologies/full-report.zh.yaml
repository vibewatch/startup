      - number: '4.3'
        title: 股权结构与融资时间线参考
        blocks:
          - type: paragraph
            body: >
              24M 自 2010 年成立以来，已在十二轮或更多融资中累计筹得超过 $500 million；逐轮详细时间线保留在公司概况章节，此处只做引用，不再重复。它的财务结构有几项特征，与资本充足性评估直接相关。

              第一，投资者基础高度集中在亚洲产业公司（Kyocera、Asahi Kasei、Dai Nippon Printing、Mitsui O.S.K.
              Lines、Nuovo+/PTT/GPSC、Fujifilm、ITOCHU），以及一个欧洲 OEM（Volkswagen Group）。除早期轮次（CRV、North Bridge Venture
              Partners 的 Series A-D）外，北美金融机构和美国科技 VC 基本缺席。这种偏向亚洲战略投资者的地域倾斜，与 SemiSolid
              授权最有牵引的地区一致，但也让公司依赖企业战略资本，而不是独立财务资本。

              第二，美国政府通过 ARPA-E 至少提供 $12.2 million 资助：一笔 $9 million SCALEUP 奖项（2023 年 6 月），用于面向电动航空的高能量密度锂金属负极电芯；一笔 $3.2
              million EVs4ALL 奖项（2023 年 1 月），用于与 MIT 和 Carnegie Mellon University 合作开发钠金属电池。这些资助绑定具体 R&D
              交付物，不构成不受限制的运营资本。

              第三，资本结构看起来完全由股权融资构成；没有公开披露债务、循环信贷额度、项目融资义务或可转债。这符合技术授权商业模式：可质押硬资产很少。但也意味着没有债务契约或利息覆盖指标，能提前预警财务压力。

              Series H 于 2024 年 9 月 5 日完成，是公司在 2026 年 3 月关停前最后一次披露的融资事件；距离最近一次融资，现金跑道最多 18 个月。
