  - id: TE002
    title: 制造工艺对比——SemiSolid、传统工艺与替代路线
    columns:
      - 工艺属性
      - 传统浆料涂布（Li-ion）
      - 24M SemiSolid™
      - 干法电极（如 Maxwell / Tesla）
      - 固态电池（如 QuantumScape）
    rows:
      - - 电极粘结剂
        - 需要 NMP 可溶 PVDF 粘结剂
        - 无粘结剂；以电解液作为工艺溶剂
        - PTFE 干法粘结剂（压延）
        - 无（陶瓷固态电解质层）
      - - 溶剂 / 干燥步骤
        - NMP 溶剂；高能耗干燥炉；需要 NMP 回收
        - 无溶剂；无干燥炉；直接浇铸
        - 无液体溶剂；冷 / 热压压延
        - 固态电解质层无液体溶剂
      - - 电极厚度 / 面容量
        - ~2–4 mAh/cm²（为倍率性能做薄）
        - 6–12 mAh/cm²（更厚；能量密度更高）
        - 3–6 mAh/cm²（中等厚度）
        - 可变；固态电解质界面采用超薄设计
      - - 资本开支强度
        - 基准（100%）
        - 声称为基准的 35–60%（降低 40–65%）
        - 估计为基准的 60–75%（规模化成熟度较低）
        - 明显更高（新材料、洁净室制造）
      - - 商业规模验证
        - 是——行业标准；CATL、LG、Samsung SDI 达到 100+ GWh/yr
        - 部分——Kyocera 达到 200–400 MWh/yr；没有汽车级 GWh 规模
        - 部分——Maxwell / Tesla 已宣布整合；不是完整超级工厂
        - 否——截至 2026，所有供应商仍处商业化前
    claimRefs:
