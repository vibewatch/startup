      - number: '3.5'
        title: 技术授权模式对比——24M vs. QuantumScape vs. Solid Power
        blocks:
          - type: paragraph
            body: >
              电池行业的技术授权模式，是把制造工艺、电解质或电芯设计授权给成熟制造商，而不是自建并运营超级工厂；24M、QuantumScape 和 Solid Power 曾同时押注这一战略。把三种落地方式放在一起看，24M
              的关停为什么事后更可预期，就更清楚。

              24M 的授权模式要求被授权方全面改变制造工艺：用 SemiSolid 电极浆料工艺替代传统浆料涂布电极生产，并配套新的混料、流延和组装设备。采用摩擦很高：（i）需要为新制造设备投入资本，（ii）要与 OEM
              客户跑完两年产品验证周期，（iii）要改造既有产线或新建绿地工厂，（iv）还要完成操作员培训和工艺认证。只有 Kyocera 在商业规模达到这一门槛（JPY 10B 扩产后年产 400 MWh）。FREYR 曾在
              2021 年为 40 GWh 挪威工厂签下无限授权，但 2024 年 11 月双方终止协议，FREYR 向 24M 支付 $3 million，并放弃近 7 million 股 Series G 优先股。VW
              通过参与 Series G 轮间接持有 24M 敞口，但没有转化为商业被授权方关系。

              从工艺角度看，QuantumScape 的授权模式对被授权方要求低一些：QuantumScape 供应已制造好的陶瓷隔膜（通过 Murata 和 Corning），并授权 Eagle Line
              工艺蓝图，让伙伴在不采用全新电极工艺的情况下，把隔膜集成进电芯制造。Eagle Line 扮演可转移制造模板。但 QuantumScape
              电芯需要锂金属负极，规模化处理、化成和安全都各有挑战，而且尚未在汽车量产规模上得到验证。SPAC 支持的上市公司结构，让 QuantumScape 可以获得非稀释性 at-the-market 股权融资，规模达到
              2025 年筹得 $264M 的量级；私有的 24M 在 Series H 之后没有这种通道。

              Solid Power 的模式比两者都更窄：它销售硫化物固态电解质材料（电解质粉体），并授权电芯设计，不要求被授权方采用新的制造框架。Samsung SDI 合作正说明这一点：Samsung SDI
              用现有设备制造电芯，同时把 Solid Power 的电解质集成进去，再由 BMW 在演示车辆上评估。采用摩擦更低，也削弱了 Solid Power 的护城河：技术成熟后，电解质材料可能被复制或替代。

              对比之下，电池技术授权模式存在一个根本张力：工艺 IP 含量越高，护城河越耐久，但采用摩擦也越高，被授权方验证周期越长，可触达的被授权方池子就越小。24M 选择了高 IP
              含量的完整工艺授权，最后发现有能力、有意愿、且资本充足的西方被授权方太少，支撑不起这套商业模式。
