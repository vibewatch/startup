      - number: '6.4'
        title: GTM 模式、收入架构与客户旅程
        blocks:
          - type: paragraph
            body: >
              24M 的上市路径完全是 B2B 授权许可，目标客户是电池制造商和汽车 OEM，而不是自己做下游电池产品。客户旅程是一条跨数年的漏斗：（1）技术评估与可行性对齐；（2）签署许可协议并支付预付费用；（3）借助
              24M 工艺知识和工具支持，完成试点 / 认证电芯生产；（4）监管与产品认证；（5）进入商业规模生产，并按单元或按 kWh 向 24M 持续支付版税。

              这一模式的收入分两部分：预付许可费（除 FREYR 终止时支付的 USD 3 million 外，各项合作均未披露）以及商业生产被许可方按单元或按 kWh 支付的版税。Kyocera
              关系是唯一确认仍在产生版税的活跃渠道。任何被许可方的版税率、最低采购量和合同期限都没有公开披露。

              Series H 融资结构进一步强化了 GTM 绑定：六家 Series H 共同投资方中有五家（Kyocera、Asahi Kasei、DNP、Lucas TVS、Mitsui O.S.K.
              Lines）已经或预计会成为被许可方或供应链伙伴，意味着投资人资金与被许可方关系深度交织。Nuovo+
              领投该轮，既是最大单一投资方，也是泰国工厂卖方。这种双重角色结构，在投资人治理权与商业许可条款之间制造了潜在利益冲突。

              渠道架构完全直销：24M 与工业被许可方之间没有分销商、转售商或集成商层级。终端市场渠道责任完全落在被许可方身上（例如，Kyocera 通过自己的光储分销网络销售 Enerezza；Lucas TVS 通过
              OEM 供货协议销售 EV 电池包）。最终使用这些电池产品的家庭、汽车 OEM 或车队运营商，与 24M 没有直接客户关系。
