  - id: FM004
    title: 技术授权采用漏斗——SemiSolid 通往商业规模之路
    type: funnel
    layout: standard
    summary: |
      24M 技术授权模式的五阶段采用漏斗，从初始技术评估到商业规模生产。Kyocera 完成全部五阶段；大多数其他潜在被授权方没有越过第 1–2 阶段。漏斗说明，从授权兴趣转化为商业采用才是关键约束。
    data:
      items:
        - label: 第 1 阶段：技术评估
          value: 100
          description: 电池制造商评估 SemiSolid 工艺与既有浆料涂布工艺；初步评估知识产权并检查化学体系兼容性
          exemplars: >-
            Volkswagen (strategic investor, 2022); Fujifilm (license + $20M investment, 2022); Freyr (license, 2021);
            Lucas TVS; Asahi Kasei
        - label: 第 2 阶段：签署授权
          value: 60
          description: 签署技术授权协议；确定授权费或里程碑付款条款；取得 24M 知识产权和制造工艺诀窍
          exemplars: Kyocera (license partner since 2020); Fujifilm (license, 2022); Freyr (unlimited license, 2021)
        - label: 第 3 阶段：试点 / 原型生产
          value: 30
          description: 被授权方使用 SemiSolid 工艺生产试点电芯；集成进测试产品；按 OEM 或系统规格做资格验证
          exemplars: Kyocera (Enerezza prototype and product testing, 2020); Fujifilm (leveraging precision-coating heritage)
        - label: 第 4 阶段：监管 / 产品认证
          value: 15
          description: 产品认证周期（OEM 级电芯通常约 2 年）；安全认证；电网并网合规；户用系统批准
          exemplars: Kyocera Enerezza (Japan residential qualifications completed by 2020 launch)
        - label: 阶段 5：商业规模生产
          value: 5
          description: 被许可方实现商业批量制造；产生权利金；24M 许可收入落地；Kyocera 目标 400 MWh/yr（FY2026）
          exemplars: Kyocera only — 400 MWh/yr target by FY2026; JPY 10B Shiga Yasu plant expansion
