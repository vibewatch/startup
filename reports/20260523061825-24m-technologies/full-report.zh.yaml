  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础——细分、关系类型与买方画像
        blocks:
          - type: paragraph
            body: >
              24M Technologies 不向终端用户销售电池；它把 SemiSolid
              制造技术授权给产业伙伴，由这些伙伴自行制造、营销和销售电池产品。因此，公司的直接“客户”是被授权方：它们支付前期技术接入费，并按产量支付持续版税。这种授权模式形成三类不同关系：

              **商业被授权方** 是已经签署完整授权协议、并已启动某种程度生产的伙伴。Kyocera 是唯一已确认的商业被授权方：它自 2020 年以来在日本制造并销售 Enerezza ESS，到 2024 年年产能达到约
              20,000 台（约 200 MWh/yr）。

              **开发被授权方** 是已签署协议、但关停时仍处于认证或试点生产阶段的伙伴。包括 Fujifilm（2022 年 9 月授权和 $20M 投资，借助精密涂布能力做量产认证）、Lucas TVS/TVS
              Indeon（授权方和 Series H 共同投资者，2024 年 8 月起在印度 Tamil Nadu 一座 1 GWh 设施组装电池包，但未确认 SemiSolid 电芯制造），以及
              Nuovo+/GPSC（2024 年初把 Thailand Rayong 设施转让给 24M，换取约 USD 51 million 优先股；已为一家未具名、总部在印度的出行 OEM 启动试点生产，计划 2024
              年末交付样品）。

              **股权投资伙伴** 是持有战略股权、但没有确认商业生产的实体。Volkswagen Group 于 2022 年 1 月收购 24M 25% 股权，并为未来在 PowerCo 超级工厂的统一电芯项目中集成
              SemiSolid 做布局——但到关停时仍未建立商业 SemiSolid 生产。Asahi Kasei 和 Dai Nippon Printing（DNP）作为 Series H
              共同投资者加入，分别表述了对材料和封装应用的战略兴趣，但未披露授权或部署承诺。

              **已终止被授权方** 包括 FREYR Battery。它在 2021 年 1 月为计划中的 40 GWh Norway 超级工厂签署无限 SemiSolid 授权，但 2024 年 11 月与 24M
              共同终止两份协议，放弃近 7 million 股 Series G 优先股，并向 24M 支付 $3 million。

              没有公开可得的终端买方证据（个人家庭、公用事业公司或车队运营商）。Kyocera 的 Enerezza 终端客户是日本住宅光伏加储能家庭；其数量、满意度指标和合同条款只在总产能层面披露。
