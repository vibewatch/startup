      - number: '5.3'
        title: 性能主张与技术验证证据
        blocks:
          - type: paragraph
            body: >
              24M 最可信的性能证据，来自它在 NAATBatt 2023 ARPA-E 场次展示的 SemiSolid LFP 电芯循环数据。2014 年制造的一颗 5.5 Ah LFP/石墨软包电芯在 25°C
              下累计超过 7,000 次循环，容量衰减很小；循环寿命预测显示，在 75% 容量保持率下可超过 10,000 次循环。2018 年制造的一颗 110 Ah、接近量产意图的方形电芯，2,500
              次循环后的容量保持率优于 5.5 Ah 电芯，预测在 75% 容量保持率下可超过 13,000 次循环。这些数字显著超过电网储能要求，也达到或超过 CATL 领先商业 LFP 电芯水平。

              Impervio 隔膜的滥用容忍主张，有 24M 在 2024 年 10 月发布的视频和测试数据支撑，展示了过充电芯在有无 Impervio 条件下的实时对比。24M 内部测试还显示，正极被约 ~1%
              不锈钢污染——一种现实制造缺陷——会使基准电芯在化成后立即短路；而 Impervio 电芯抑制了随之产生的金属枝晶，并在容量保持率 >83% 的情况下超过 800 次循环。

              1,000-mile（1,600 km）续航 EV 电池主张，是 ETOP+Eternalyte+SemiSolid 组合的公司预测目标，不是已演示产品。Fast Company 报道了 24M 对生产
              1,000-mile 电池目标的表述；MIT Technology Review 提到这一目标，但把 24M
              关停描述为一个“本该更容易”的案例，暗示即便是相对容易接入的创新，也未能跨过商业执行鸿沟。没有公开发布过 ETOP 电芯或 Eternalyte 电芯在接近量产配置下的独立第三方电芯级测试。
