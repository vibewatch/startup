              以下 KPI 快照汇总了截至 2026 年 5 月 23 日研究日可得和推断的指标。24M 是私营公司，无需发布财务报表。收入、毛利率、ARR 和客户数均未公开披露，也无法可靠估计。公司最近披露的 $1.3
              billion 估值来自 2024 年 9 月；此后没有宣布新的融资轮，公司于 2026 年初进入关闭。

              根据第三方聚合数据，员工数估计约 119 人；公司未确认这一数字，也可能无法反映关闭前裁员。2026 年 5 月的运营状态为已关闭 / 清盘中，资产拍卖定于 2026 年 6 月下旬。

              公司的研发和制造基础设施包括马萨诸塞州 Cambridge 和 Westwood 两地，以及 2024 年在泰国 Rayong 开设的试点设施。Branford Group
