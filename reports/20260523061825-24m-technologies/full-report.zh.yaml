      - number: '4.2'
        title: 授权伙伴关系与商业牵引证据
        blocks:
          - type: paragraph
            body: >
              Kyocera Corporation 是唯一已确认用 24M 技术实现商业规模生产的 24M 被授权方。Kyocera 的 Enerezza 住宅储能系统于 2020 年在日本商业发布，基于 24M
              SemiSolid 电极和单元电芯制造工艺。截至 2024 年 12 月，Kyocera 年产能约 20,000 台，并宣布计划通过在 Shiga Yasu 工厂投资 JPY 10 billion（约 USD
              62–72 million）建设新产线，到 FY2026 把产量翻倍至每年 400 MWh。2024 年 3 月，Kyocera 与 24M 共同获得 Electrochemical Society of
              Japan 的 Tanahashi Award，这是行业对 SemiSolid 电池在 Enerezza 中商业应用的认可。这是唯一有文档证明的 24M 授权安排落地为批量生产。

              Nuovo+（PTT 和 Global Power Synergy PCL 的关联方）是 2024 年 9 月 Series H 的领投方，投资 $51.1 million，资金来自它向 24M 出售
              Thailand Rayong 试点设施的所得。Thailand 收购于 2024 年 8 月 30 日完成；该设施面积 71,000 square-foot，集电池制造和 R&D 于一体，可支持 100 MWh
              年度试点生产，也是 24M 首个自有制造规模设施。截至 2024 年 9 月，24M 已开始在 Rayong 为一家未具名、总部在印度的出行 OEM 做试点生产。

              FREYR Battery 持有两份 24M 授权（2020 年 12 月用于其 Norway 工厂，2021 年 10 月用于其美国 “Giga America” 工厂）。FREYR 于 2024 年 11 月
              4 日通过共同终止协议结束两份授权。FREYR 为此前提供的服务支付 $3.0 million 和解款，并放弃持有的全部 6,975,956 股 24M Series G 优先股。这次终止拿掉了 24M
              最重要的美国商业授权前景。

              Fujifilm Corporation 在 2022 年 9 月作为 $20 million 投资的一部分获得 SemiSolid 制造授权，意在利用 Fujifilm 80
              年精密涂布技术积累。Volkswagen Group 于 2022 年 1 月收购 25% 股权，并设立全资子公司，与 24M 共同开发 SemiSolid 汽车电芯生产。Fujifilm 和
              Volkswagen 都没有报告任何商业规模 SemiSolid 生产。
