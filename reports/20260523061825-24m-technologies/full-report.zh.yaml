      - number: '6.2'
        title: Kyocera——唯一商业规模被授权方与 ESS 客户锚点
        blocks:
          - type: paragraph
            body: >
              Kyocera Corporation 是唯一已确认用 24M 的 SemiSolid 技术规模化制造并商业销售电池产品的被授权方。Kyocera 于 2020 年在日本推出 Enerezza 住宅
              ESS，使其成为全球首个商业 SemiSolid 电池产品。到 2024 年 12 月，Kyocera 在 Shiga Yasu 制造设施拥有 20,000 台 Enerezza 年产能（约 200
              MWh/yr），并宣布投资 JPY 10 billion（~USD 67 million），到 FY2026 把产能翻倍至约 400 MWh/yr。

              2024 年 3 月，Kyocera 与 24M 共同获得 Electrochemical Society of Japan 的 Technology Award（Tanahashi Award），表彰
              Enerezza 系统中 SemiSolid 锂离子电芯的实际商业化；这是任何 24M 被授权方获得的唯一外部第三方质量或商业认可。

              Kyocera 的 Enerezza 电池也被接入日本虚拟电厂（VPP）聚合项目。Tokyo Electric Power Company（TEPCO）和能源管理公司 ENERES 已使用 Enerezza
              设备开展家庭电池聚合试点，远程控制家庭储能，用于电网需求响应平衡。Kyocera 分销网络覆盖 152 个国家，说明日本以外存在潜在空间——但没有证据确认 Enerezza 已在日本以外部署。

              Kyocera 的客户证据质量显著强于任何其他 24M 伙伴：产量得到确认（20,000 台/yr），产能投资已公开宣布（JPY 10 billion），产品已商业上市且有名称，Tanahashi Award
              提供独立第三方验证。这是真正的商业化，不是试点或承诺。

              不过，Kyocera 在 2024 年 12 月宣布产能翻倍，距离 24M 于 2026 年 3 月进入关停程序不到三个月。截至研究锚点日，Kyocera 是否实现 FY2026 400 MWh/yr
              目标，以及其授权协议是否能在 24M 清算后存续，仍是开放问题。
