      - number: '6.5'
        title: 反向证据——商业化失败与 2026 年关停评估
        blocks:
          - type: paragraph
            body: >
              把全部客户证据放到 24M 2026 年 3 月关闭这个结果下看，结论清楚且负面：公司的被许可方模式客户牵引不足，既支撑不了商业可持续性，也无法降低技术商业化逻辑的风险。

              **单一伙伴依赖：** 所有确认的版税收入都来自 Kyocera 这一家被许可方，且集中在一个地区（日本）和一个终端市场（住宅 ESS）。Kyocera 已验证的最高产量约 200 MWh/yr，距离支撑 24M
              $1.3B 估值所需的 GWh 级版税收入流低了数个数量级。即使用 USD 5/kWh 这一偏乐观的版税计算，200 MWh/yr 每年也只产生约 USD 1 million，远不足以支撑一家累计融资超过
              $500 million 的公司。

              **被许可方流失：** FREYR 2024 年 11 月终止协议，是一个清晰信号：授权模式的经济性连已承诺的 GWh 级工厂开发商也难以留住。FREYR
              自身从挪威电芯制造转向美国太阳能，确实让许可失去意义；但结构性问题仍然存在——市场条件变化时，被许可方可以退出，也会退出，这是该模式的根本脆弱点。

              **没有确认的汽车 OEM 量产：** Volkswagen Group 虽持有 25% 股权，并在 2024 年 10 月收到锂金属原型电芯，但没有建立任何 SemiSolid
              商业化生产。汽车认证周期通常从原型到量产需要 2–4 年，这意味着即便 2024 年 10 月的原型交付顺利，也不可能在 24M 于 2026 年初关闭前转化为商业收入。

              **开发阶段 vs. 商业阶段：** 公司关闭时，Lucas TVS/TVS Indeon 仍在用外购电芯组装电池包，而不是生产 SemiSolid 电芯。Fujifilm 和 Axxiva/Nuovo+
              处在认证或试点阶段，没有确认部署。24M 的泰国设施在为一家未具名 OEM 生产验证样品，而不是商业化产量。

              **市场评论：** MIT Technology Review 2026 年 3 月对美国电池行业的复盘把 24M 作为典型案例，称这类美国电池初创公司“难以让其技术被客户规模化采用”，而授权模式又依赖 24M
              无法控制的伙伴资本和时间表。Archyde 也把关停描述为“全球制造商对 24M 路线信心减弱”的体现。

              结论是，24M 积累了大量伙伴兴趣和名义许可关系，却只把其中一家转化为产生收入的商业化生产。Kyocera 关系验证了 SemiSolid 技术在住宅 ESS 规模上的商业可行性；但它没有验证汽车级商业化、GWh
              级版税经济性，也没有验证更广泛授权模式的耐久性。
            claimRefs:
              - CU034
              - CU035
              - CU036
              - CU037
              - CU038
              - CU039
              - CU040
              - CU041
