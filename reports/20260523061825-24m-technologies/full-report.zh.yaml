      - number: '7.6'
        title: 图表证据
        blocks:
          - type: callout
            title: IP 拍卖——关闭后最高的剩余风险
            body: >
              2026 年 6 月对 24M 700+ 项专利组合的公开拍卖，是关闭带来的最重要近期风险。若中国电池制造商或专利主张实体买下基础性的 SemiSolid、Impervio 和 ETOP 专利，形成的 IP
              位置可能限制美国电池技术发展，对合规制造商发起许可诉讼，或被用于阻挡美国竞争性创新。公开资料未显示已有防御性购买财团、政府优先购买权或受限拍卖流程。
            calloutType: insight
            claimRefs:
              - CR037
              - CR001
          - type: callout
            title: FREYR 终止——关闭前的破题事件
            body: >
              FREYR Battery 于 2024 年 11 月终止与 24M 的两份许可协议，支付 $3 million 并放弃近 7 million 股优先股；这是 2026 年 3
              月关闭前最决定性的单一事件。FREYR 曾是 24M 在美国和欧洲的主要生产路径。随后它转向太阳能组件制造，说明被许可方判断，在中国竞争面前，电池制造经济性在结构上不可行；问题不只是 24M
              具体平台不够好。任何评估 24M IP 拍卖的投资人，都应把 FREYR 退出视为市场失败的证据，而不是平台失败。
            calloutType: insight
            claimRefs:
              - CR003
              - CR020
              - CR021
          - type: callout
            title: 中国电池成本优势——结构性，而非周期性
            body: >
              截至 2026 年 Q1，CATL 和 BYD 合计拥有 59% 全球电池市场份额；叠加接近 $50/kWh
              的电芯价格，这是一种经过二十年一体化供应链投资、国内锂和正极材料获取、政府产业政策共同打造的结构性竞争优势。要求被许可方在成本更高市场自掏腰包建设 GWh
              级工厂、却无法匹配供应链整合的技术授权模式，无法解决这种成本位置。IRA 45X 抵免是主要抵消机制；其回撤风险拿走了让美国授权电池制造商业上可行的最后一个经济杠杆。
            calloutType: insight
            claimRefs:
              - CR009
              - CR010
              - CR014
              - CR018
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: Series H 估值背景与隐含指标
        blocks:
          - type: paragraph
            body: >
              2024 年 9 月，24M Technologies 以 $1.3 billion 投后估值完成 $87 million Series H，成为独角兽。该轮由 Nuovo+ 领投；Nuovo+ 是 PTT 与
              Global Power Synergy PCL（GPSC）的关联方，出资 $51.1 million，资金来自其同步把泰国 Rayong 电池试点设施卖回 24M
              的所得。这个闭环结构意味着，真正新增外部资本只有约 $35.9 million，其余是所收购资产在资产负债表上的重新分类。按已宣布轮次规模计算，Series H 的 $1.3 billion 头部估值隐含约
              6.7% 稀释，符合一个后期少数股权优先股融资，并带有此前轮次积累的明显优先权负担。

              $1.3 billion 估值建立在四个支柱上：（1）24M 覆盖 SemiSolid、ETOP、Impervio 和 Eternalyte 技术的 700+ 项专利 IP 组合；（2）来自
              Kyocera、Volkswagen、Fujifilm、Nuovo+ 等现有和未来伙伴的预期授权收入；（3）作为化学体系中立电池技术平台的战略可选性；（4）IRA 制造税收抵免和 EV
              需求增长预期支撑下的国内电池制造正向宏观环境。到 2026 年 3 月，仅 18 个月后，四个支柱均已明显削弱：授权收入基础仍未成熟商业化，IRA 支持被削减，VW 和 Fujifilm
              未进入商业生产，FREYR 终止两份许可。考虑到授权收入基础，$4–7 million 的隐含月度烧钱不可持续。没有任何 Series I 或后续融资宣布或完成。

              按 IP 授权业务适用的行业收入倍数（5–15x 收入）计算，要支撑 $1.3 billion 估值，年经常性版税和许可收入需要约 $87–260
              million。没有证据支持收入达到这一规模；唯一确认的商业版税流——Kyocera 约 200 MWh/year 的 Enerezza 产量——按常规每 kWh
              版税率只能产生个位数百万美元。因而，该估值主要是期权价值和战略溢价结构，而不是有收入倍数证据支撑的估值。对于商业化前的深科技授权方，这并不少见，但也让估值对任何授权商业化放缓都极其敏感。
