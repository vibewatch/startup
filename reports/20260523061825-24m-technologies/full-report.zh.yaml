      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              24M 面向的电池储能市场，主导增长驱动是电网储能需求激增，背后有三股力量汇合：大规模太阳能和风电部署需要可调度备份，AI 数据中心用电需求需要前所未有规模的电池备份，过剩 EV 电池产能结构性转向 BESS
              应用。IEA 2026 年数据确认，数据中心基于电池的不间断电源在 2025 年增长 30%，达到 45 GW。仅 Texas Abilene 拟建的 Stargate AI 设施就可能需要 1 GW
              电池备份，相当于 2025 年美国电网所有装机电池的约 6%。

              美国通过 2025 年 7 月预算调和法案（「One Big Beautiful Bill Act」）保留了对电池储能安装和制造的投资税收抵免，延续到 2030 年代，为电网储能提供关键政策托底；BNEF
              也把这视为其在 EV 市场承压下仍看好全球储能的原因。澳大利亚的 Capacity Investment Scheme 正推动 2026 年预计 13 GWh 的新增 ESS 装机；印度、巴西、韩国的招标管线都以
              GWh 计。InfoLink 的 2026 年展望将新兴市场（不含中国、美国、欧洲）置于全球装机增长约 20% 的位置。

              像 SemiSolid 这样的新型电池制造工艺，首要采用约束是结构性资本强度。The Battery Show North America（2025）的行业专家量化了最低可行电池工厂门槛：约需 $2
              billion 资本和 10 年才能达到现金流盈亏平衡，最低盈利规模为 18–22 GWh。这一资本时间线与风险资本模式根本不兼容。Dallas Fed（2026 年 3 月）确认，美国已有超过 10 个
              gigafactory 项目被正式取消或停滞，涉及超过 $10 billion 废弃投资。中国成本优势——LFP 电芯 $44–60/kWh，对比全球均价 $81/kWh——来自政府支持、规模、垂直整合和 15
              年学习曲线；美国制造商无法单靠技术复制。

              24M 的问题在于，技术许可模式原本是为了绕开直接制造的资本强度，但它只是把资本风险转给授权客户，而不是消除风险。授权客户需要投资改造产线，并穿越两年产品验证周期（标准 OEM
              认证时间线），却无法保证有足够产量支撑投资。商业验证集中在日本（Kyocera），美国和欧洲采用有限——即便有 Volkswagen 的战略投资——反映出结构性错配：电池制造资本流向中国、韩国、日本，而 24M
              最深的商业关系在美国研究、日本合作伙伴和欧洲 OEM 兴趣之间分散。

              关于市场吸引力，一个重要的反向信号来自 Wood Mackenzie 的情景分析（2025 年 Q2）：在悲观政策情景下，美国公用事业级 BESS 市场 2026 年可能萎缩
              29%；如果投资税收抵免被废除，未来五年预期新增容量可能少 16 GW。FEOC 限制自 2026 年生效，阻止与中国实体绑定的电池组件获得 ITC 资格。这些限制为非中国电芯技术许可方（如
              SemiSolid）创造了潜在机会，可帮助美国制造商合规；但它们也表明，政策不确定性本身就是投资决策的约束，会让授权客户的长期承诺更复杂。
