      - number: '4.5'
        title: 资本充足性评估与反向财务证据
        blocks:
          - type: paragraph
            body: >
              公开资料无法直接评估资本充足性。24M 不披露现金余额、月度烧钱速度或预期现金跑道。但可观察事件时间线足以推断资本约束有多严重。

              Series H 融资于 2024 年 9 月 5 日完成，按 $1.3 billion 投后估值筹得 $87 million。其中约 $51.1 million 实际上来自 Thailand 设施出售给
              Nuovo+ 的资金，再以股权形式回流；第三方投资者带来的净现金流入约 $35.9 million。公司还接手了一个会持续产生成本的设施。

              到 2026 年 3 月，公司进入关停，距离 Series H 完成最多 18 个月；如果部分资本被交易成本和设施搭建消耗，可能只有 12–15 个月。这意味着，如果把整笔 Series H
              都视作运营现金跑道，最低月度净现金消耗约 $4–7 million；如果剔除设施收购成本，则实际更高。这些是估算，不是报告数据。

              Branford Group 的完整关停拍卖计划于 2026 年 6 月 15 日至 6 月 18 日举行，覆盖 24M 三个地点的资产：26 Dartmouth Street Westwood MA
              02090、29 Esquire Road Billerica MA 01821 和 8 Roosevelt Avenue Hudson NH 03051。拍卖资产包括先进电池制造设备、机器人（Fanuc LR
              Mate 200iD）、电池测试仪（Maccor Series 4000H、Neware）、实验室和 R&D 设备、机加工工具和设施基础设施；多项设备标注日期为 2024 年，说明至少到 2024 年 8
              月公司仍在投入资本。

              更大的风险资本环境也不利：Mercom Capital 报告称，2024 年上半年能源存储公司 VC 融资总额为 $2.4 billion，较 2023 年上半年的 $3.8 billion 同比下降
              37%。MIT Technology Review 和 Archyde 将 24M 关停归因于投资者撤退、IRA 激励回调、EV 市场降温，以及把技术授权转化为商业规模制造验证的结构性难度。
