  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: SemiSolid™ 制造平台——核心架构与工艺
        blocks:
          - type: paragraph
            body: >
              24M Technologies 起源于 MIT 教授 Yet-Ming Chiang 的一个观察：传统锂离子电池制造源自 1980
              年代末改造而来的磁带生产流程，复杂度本可低得多。标准流程在电芯组装前要经过浆料混合、狭缝模头或刮刀涂布、溶剂干燥、NMP 回收、辊压、分切和冲切；24M 的 SemiSolid
              平台直接把电解液作为加工溶剂，去掉干燥、辊压和溶剂回收步骤。

              在 SemiSolid
              工艺中，活性材料颗粒（LFP、NMC、NCA、石墨）先与导电碳和液态电解液直接混合，形成浓稠凝胶状悬浮液，再浇铸到集流体箔上（负极用铜，正极用铝），不使用任何粘结剂或额外溶剂。由于不需要干燥或辊压，该工艺无溶剂，也不需要资本密集的干燥炉和
              NMP 回收系统。所得电极显著厚于传统设计：24M 的 ARPA-E 演示材料记录了 6–12 mAh/cm² 面容量，而传统水平为 2–4
              mAh/cm²。更厚的电极把非活性材料（铜箔、铝箔、隔膜、封装）占比降到传统水平以下 80% 以上。“软性”设计还带来很强的滥用容忍度——电芯被刺穿或变形后仍能机械性工作，不会出现完全固态电极那种尖锐失效模式。

              公司报告的制造经济性声称，相比传统超级工厂产线，资本开支可降低 40–65%，占地可降低 30–40%，单电芯制造成本最高可降低 40%。这些数字出现在 24M 的 LiForever 数据表和 Rayong
              设施新闻稿中，并得到 MIT News 2022 年 10
              月关于该平台报道的佐证。独立分析师指出，厚电极路径也会带来自己的规模化挑战：浆料黏度管理、高速涂布均匀性，以及厚多孔结构的电解液润湿，都是会随电极载量增加而加剧的工艺工程问题；截至 2026 年，没有一项已在
              GWh 级吞吐下完全解决。

              SemiSolid 平台不绑定化学体系：同一套制造设备只需改变浆料组成，就能运行 LFP、NMC811、NCA、硅主导、锂金属和钠金属电极配方。这一架构是 24M
              其他所有产品平台——ETOP、Impervio、Eternalyte 和 LiForever——叠加其上的基础。
