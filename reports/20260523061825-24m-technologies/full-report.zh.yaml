companyProfile:
  summary: >-
    24M Technologies 是 MIT 分拆出的公司，2010 年成立，试图将 SemiSolid 电池制造工艺商业化：用知识产权许可模式降低电池资本开支、简化生产，并支持多种化学体系。公司吸引了
    Volkswagen、Kyocera、Fujifilm、Nuovo+ 等战略投资方和合作伙伴，但只有 Kyocera 跑出了可见的商业化生产。2024 年 9 月，公司以 $1.3 billion 投后估值完成 $87
    million Series H 融资；到 2026 年初，24M 进入清盘，并走向 2026 年 6 月的资产拍卖。
