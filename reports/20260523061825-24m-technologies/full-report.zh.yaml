      - number: '3.6'
        title: 护城河耐久性评估与反向证据——24M 的竞争位置是否足够？
        blocks:
          - type: paragraph
            body: >
              到 2026 年 3 月关停时，围绕 24M Technologies 的核心竞争问题是：SemiSolid 护城河——由专利制造工艺
              IP、化学体系无关性和授权模式构成——到底是天然不够强，还是只是在资本更充足的巨头和同业面前资源不足。

              反向证据强烈指向结构性不足。Northvolt 累计融资超过 $15 billion（股权和债务），拿下 Tier-1 汽车 OEM 的 $50 billion 订单，并在 Sweden 的 Skellefteå
              建成旗舰超级工厂，却在 2025 年 3 月申请破产，当时债务 $5.8 billion，现金只有 $30 million（按每月 $100 million 烧钱速度，约七天运营资金）。调查人员在工厂发现约
              4,000 个未开封设备箱，价值 €430 million；产量只达到设计产能的 5%。2024 年中，Northvolt 因交付落后两年而失去 €2 billion BMW 合同。如果资本远充足、欧洲最强
              OEM 伙伴也押注的传统锂离子制造路径都无法实现商业可行性，那么轻资产授权模式要在制造优先模式失败之处胜出，就必须依赖一个具体通道——有能力且愿意采用的被授权方——而事实证明这个通道同样难找。

              FREYR Battery 的轨迹给出了最直接的反向证据，指向 24M 护城河耐久性不足。FREYR 在 2021 年 1 月签署无限 24M SemiSolid 授权，计划在 Norway 建 40 GWh
              工厂，并在 Georgia 建 34 GWh 工厂（“Giga America”）。到 2024 年 11 月，FREYR 与 24M 共同终止所有授权和服务协议；FREYR 支付 $3 million，并放弃近
              7 million 股 Series G 优先股。2025 年 2 月，FREYR 正式取消 $2.6 billion “Giga America” 项目，并同意以 $50 million 出售 368-acre
              Georgia 场地，理由是“利率上升、电池价格下跌、领导层变更”。之后 FREYR 收购 Trina Solar 的 Texas 工厂，转向太阳能制造。FREYR 的结果就是对 24M
              授权护城河的一次直接测试：一个商业意图明确、有政府背书、且有 OEM 级雄心的被授权方，最终认为 SemiSolid 技术授权商业案例在西方市场跑不通。

              QuantumScape 仍能存活——持有 $971M 现金、拥有 Eagle Line 试点设施、尽管累计亏损 $3.9 billion
              仍有活跃授权管线——说明电池技术授权模式并非天然不可行，但需要三件事：（a）能进入公开股权市场，撑过多年商业化前运营；（b）技术供给边界较窄，且性能差异清楚（844 Wh/L vs. 传统 Li-ion 的
              400–500 Wh/L）；（c）与一线 OEM（VW PowerCo）合作，对方的扩产能力和意愿可信。24M 缺少（a）——它是私有公司；在（c）上也吃力——Kyocera 是唯一可信的商业伙伴。

              相比中国既有厂商，SemiSolid 护城河的内在限制是结构性的，不取决于执行。即便某个 24M 被授权方完全规模化、并以西方成本生产 SemiSolid 电芯，在成本竞争市场里，每个客户仍会面对
              $53–56/kWh 的中国 LFP 替代品。SemiSolid 宣称制造成本降低 40%，对比对象是传统西方制造成本，不是中国电芯进口价格。因此，实际护城河只覆盖两类场景：（i）FEOC
              法规禁止采购中国电芯的供应链安全应用；（ii）成本每 kWh 不是首要选择标准、且需要性能差异化的应用（更高能量密度、更厚电极）。这两个市场确实存在，但规模不足以支撑 24M 的运营结构。

              仍缺少反向证据的问题是，SemiSolid 工艺在商业规模上是否存在内在质量、安全或循环寿命问题。Kyocera Enerezza 住宅 ESS 产品已经商业化使用 SemiSolid 电芯，截至 2026 年
              5 月没有公开安全召回或产品失效报告；这给出有限但正面的证据，说明技术本身不是近端失效点。
