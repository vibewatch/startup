chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、使命与技术平台
        blocks:
          - type: paragraph
            body: >
              24M Technologies, Inc. 是一家源自 MIT 的电池技术公司，总部位于马萨诸塞州 Cambridge，2010
              年注册成立。公司宣称的使命，是通过重塑锂离子电池的设计和制造方式，提供可负担的储能。24M 是私营公司，没有强制公开财务披露；收入和详细财务表现未披露。

              核心产品是 SemiSolid™ 制造平台。该平台用厚而黏稠的半固态电极，取代传统锂离子生产中的电极干燥和辊压环节。按公司说法，该方法去除了标准电芯中超过 80% 的非活性材料，最高可降低制造成本
              40%，同时提升能量密度、安全性和可回收性。

              公司的技术组合不止基础 SemiSolid 平台。2024 年 1 月在 CES 发布的 Impervio™ 隔膜，是一层功能化材料，可阻止金属枝晶形成，并实时监测内部缺陷，面向锂离子和下一代锂金属电芯。2024
              年 2 月发布的 Eternalyte™ 电解液，则是为锂金属电池设计的液态电解液，在 −20°C 下仍可保持最高 90% 容量，针对竞品电解液的低温性能短板。

              ETOP（Electrode-to-Pack）平台最早于 2023 年 10 月 Japan Mobility Show 发布，并在 2025 年 9
              月继续推广。它完全取消单体电芯和模组结构，把密封电极对直接集成进电池包。公司称，ETOP 可把电极在电池包体积中的占比提升至最高 80%，而传统设计为 30–60%；因此电动车续航最多可提高
              50%，或在同等性能下降低电池包成本和重量。SemiSolid 平台不绑定化学体系，兼容 LFP、NMC 以及包括锂金属、钠金属在内的下一代化学体系，且不要求合作伙伴改变制造供应链。

              24M 的商业模式是技术许可：公司向电池制造商和 OEM 授权平台，而不是自己建设或运营 gigafactory。该路径降低了 24M 的资本强度，却把商业落地风险集中到合作伙伴身上。到 2026 年 3
              月，公司已进入关闭程序；其资产计划于 2026 年 6 月 29 日起启动完全关闭拍卖。
