      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >
              24M 于 2010 年由 Yet-Ming Chiang、Throop Wilder 和 W. Craig Carter 联合创立。Chiang 是 MIT Kyocera 材料科学与工程教授，此前联合创立
              A123 Systems；A123 Systems 的 IPO 让他直接看到电池制造规模化的复杂性，也催生了 SemiSolid 简化制造的论点。他拥有超过 60 项专利，发表超过 200 篇科研论文；在 24M
              担任首席科学家。Wilder 是连续创业者，过往公司被 Cisco 和 BCSI 收购；他联合创立 24M 并出任 CEO，之后转任执行董事长。Carter 是 MIT POSCO 教授，为 SemiSolid
              流动概念提供理论框架，并担任多年顾问。

              Naoki Ota 担任总裁兼 CEO。Ota 联合创立 Quallion，这家公司是美国第一家本土锂离子电池制造商，服务医疗和航空航天市场；之后他在 EnerDel 任 CTO 和 COO，建成 1 GWh
              生产能力。Richard Chleboski（CFO）此前联合创立 Evergreen Solar，带领公司 IPO，并把市值推至超过 $1 billion。

              管理层履历显示，公司在电芯化学、制造规模化和融资上都有深厚电池行业经验。Yet-Ming Chiang 同时是 MIT
              在职教授和公司联合创始人，带来关键人物集中风险：他的学术声望帮助公司吸引战略投资方和政府资金，但他拒绝就 2026
              年关停公开置评，也凸显关闭时治理的不透明。独立董事姓名没有公开披露；投资方董事席位只能从主要股东推断，尚未得到确认。
