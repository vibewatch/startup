      - number: '3.4'
        title: 先进电池创业公司——固态、锂金属与硅负极同行
        blocks:
          - type: paragraph
            body: >
              QuantumScape 是 24M 战略定位最直接的可比对象：同样在美国，靠风险资本和公开市场资本支撑，商业模式也不是自建并运营超级工厂，而是把自研电池制造技术授权给外部伙伴。QuantumScape 的
              QSE-5 固态锂金属电芯达到 844 Wh/L 体积能量密度，在试点环境中经过验证，1,000 次循环后容量保持率为 95%。Eagle Line 是 QuantumScape 已公开展示的制造参考线，集成了
              “Cobra” 隔膜工艺（速度比上一代快 25x），2026 年 2 月在 San Jose 启用。QuantumScape 已与 Murata Manufacturing 和 Corning
              签订隔膜供应合同，并在欧洲、北美、日本与汽车 OEM 发展授权关系，同时切入无人机防务、AI 数据中心、机器人等新兴非汽车市场。

              QuantumScape 的财务画像与 24M 反差很大：公司 2025 全年净亏损 $435.1 million（较 2024 年的 $477.9M 收窄），2025 年底持有 $970.8 million
              现金及有价证券，2026 年 Q1 净亏损 $100.8 million，累计亏损约 $3.9 billion。公司尚未产生商业收入，2025 年经营现金消耗约 $242.5
              million；管理层称这足以把现金跑道延至至少 2028 年下半年。QuantumScape 能活下来而 24M 关停，关键差别在于前者能进入公开股权市场（NYSE: QS），并在 2025 年通过
              at-the-market 股票销售筹得 $264.2 million，不必靠商业牵引来证明融资合理性。

              Solid Power 正在开发硫化物固态电解质，并围绕电解质供应和电芯设计走授权模式。它在 2025 年 10 月与 Samsung SDI、BMW 达成三方合作：Solid Power
              供应固态电解质，Samsung SDI 负责制造电芯，BMW 在演示车辆上评估。这一模式比 24M 更窄，只覆盖电解质供应和电芯设计授权，而不是完整制造工艺授权。按 BMW 高管和 Solid Power
              自身指引，固态汽车量产预计不会早于 2030 年。Solid Power 的模式是向 Tier 1 电池厂销售固态电解质，并向 OEM 授权电芯设计；它比 24M
              的全工艺授权更轻资本，但差异化也更弱：电解质供应链可以被复制，也可能被垂直整合厂商绕开。

              SES AI Corporation 已从纯 EV 锂金属电池转向三段式商业化策略：储能系统（通过收购 UZ Energy）、无人机电池，以及 AI 驱动的电池材料发现（Molecular Universe
              平台）。2026 年 Q1 收入为 $6.7 million（较 2025 年 Q4 增长 47%），2026 全年指引为 $30–35 million。SES AI 在 2026 年 Q1 与 ATG
              EPower 签署 $20 million 多年期 ESS 分销协议，并把韩国 Chungju 工厂从 EV 软包电芯改造成无人机规格电芯，目标年产一百万颗。SES AI 持有 $178 million
              流动性，并从汽车转向近期可产生收入的应用；这种战略机动性，是专注单一技术授权模式的 24M 没有采取的路径。

              Sila Nanotechnologies 属于另一类相邻竞争：它创新的是材料层（硅碳负极），不是制造工艺。2025 年 9 月，Sila 启用位于 Washington 州 Moses Lake
              的工厂，这是美国首个汽车规模硅负极工厂，占地 160 acres、建筑面积 600,000 square feet，初始产能 2–5 GWh，潜在扩产至 250 GWh。Sila 的 Titan Silicon
              负极相比表现最好的石墨电芯可提升 20% 能量密度，并正在为 Mercedes-Benz G-Class electric SUV 做认证，目标 2026 年交付。Sila 获得超过 $120 million
              DOE/ARPA-E 资助，持有 250 多项专利。与 24M 不同，Sila 卖的是材料（负极粉体），可以接入现有电芯产线，不需要彻底改造制造流程——采用门槛低得多。

              Toyota 通过 Prime Planet Energy & Solutions（Panasonic 合资公司）获得日本政府认证，将于 2026 年开始固态电池生产，初始规模 9 GWh/year，计划
              2027–28 年率先搭载 Lexus 车型，并在 2030 年后实现大众市场成本平价。Toyota 的固态电池宣称达到 450–500 Wh/kg，充电时间低于 10 分钟。Toyota
              的商业固态项目说明，先进电池商业化最耐久的路径，可能需要 OEM 级垂直整合和数十年 R&D 投入——这与 24M 追求的轻资产授权策略根本不同。
