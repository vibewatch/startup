        - EV 制造商；EV 消费者
        - OEM 利润 / MSRP 定价模型
        - OEM EV 项目 → 电池规格选择 → 多年供应协议 → 超级工厂投资
        - OEM 电池战略 VP / CTO
        - EV 车型上市节奏；监管合规；电芯成本对 ICE 平价；（现在：EV 需求放缓推动转向 BESS）
      - - 技术授权（直接）
        - 评估新工艺的电池制造商
        - 被授权方生产团队和制造运营
        - 来自产量的授权版税
        - 技术评估 → 试点批次 → 授权谈判 → 规模化承诺 → 持续版税
        - 被授权方 CTO / CEO
        - 相比传统工艺已验证的成本节省；合作伙伴背书（Kyocera 商业化）；不限定化学体系的兼容性
      - - ARPA-E / 政府 R&D
        - 美国 DOE ARPA-E（拨款资金）
        - 研究和早期制造开发
        - 美国纳税人通过联邦拨款买单
        - 拨款申请 → 获奖 → 按里程碑拨付 → 进展报告
        - DOE 项目负责人 / ARPA-E
        - 国家储能技术目标；本土电池独立；下一代化学体系开发（Li-metal、Na-metal、eVTOL）
    notes: >
      该买方图谱区分终端市场买方（公用事业、屋主、OEM）和技术买方（电池制造商、被授权方）。24M 主要处在技术买方层，而不是终端市场。Kyocera 是唯一有文件证明已从初始授权推进到商业规模生产的买方（Enerezza，400
