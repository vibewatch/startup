      - number: '5.5'
        title: 制造规模、部署记录与商业化缺口
        blocks:
          - type: paragraph
            body: >
              24M 技术唯一达到商业规模的部署，是 Kyocera 在日本的 Enerezza 住宅储能系统，2020 年发布。Kyocera 在 Shiga Yasu 工厂运营约 20,000 台年产能（≈200
              MWh/yr），并于 2024 年 12 月宣布投资 JPY 10 billion，在 FY2026 前把产能翻倍至 400 MWh/yr。Kyocera 与 24M 共同获得 2024 年
              Electrochemical Society of Japan Tanahashi Award，表彰 SemiSolid 电池的实际商业化；这是 24M 唯一因量产规模应用获得的行业奖项。它构成
              SemiSolid 制造在商业规模有效的唯一证据，尽管规模是 200–400 MWh/yr，而不是汽车应用所需的 GWh 级。

              Thailand Rayong 试点设施占地 71,000 square-foot、产能 100 MWh，于 2024 年 8 月从 Nuovo+ 收购，目标是展示商业规模工艺，并为全球伙伴验证
              ETOP、Impervio 和 LiForever。24M 已在 Rayong 为一家未具名、总部在印度的出行 OEM 启动试点生产，并计划在 2024 年秋季交付验证样品。2026 年 3
              月关停后，该设施状态未知；没有公开报告确认它是被转让、拍卖还是关闭清算。

              除 Kyocera 外，没有 24M 被授权方达到商业规模生产。FREYR Battery 于 2024 年 11 月终止 Norway 和美国两份授权，未部署任何 SemiSolid 工厂，并支付 $3
              million 和解款、放弃其股权。Volkswagen Group 持有 25% 股权，但尽管 2022 年投资，也没有建立商业 SemiSolid 生产。Fujifilm、Lucas TVS 和 Axxiva
              均未披露商业部署。24M 轻资产授权模式的结构性风险——商业执行完全依赖伙伴，且伙伴控制自己的资本、时间表和制造爬坡——在 EV 市场情绪降温、融资收紧、被授权方后撤时，最终成为致命点。

              MIT Technology Review 把 24M 2026 年 3
              月关停描述为更大收缩的缩影：电池创业公司融资热潮已经结束，投资者退向“更安全的押注”，即便是设计上可接入现有锂离子供应链的创新，也无法跨过实验室承诺与 GWh 级制造之间的执行鸿沟。Volta Energy
              Technologies 技术负责人 Kara Rodby 将其称为“本应更容易的一类事情的典型例子”。24M 关停时没有发布公开声明，联合创始人 Chiang 拒绝公开置评。
