      - number: '7.2'
        title: 外部市场、政策与竞争风险
        blocks:
          - type: paragraph
            body: >
              到 2024–2026 年，24M 商业模式所处的外部风险环境已在三个交叉维度严重恶化：EV 市场放缓、IRA 政策回撤、中国电池成本下探。竞争端，2026 年 Q1 CATL 约占全球 EV 电池供应
              45%，BYD 约占 14%，两者合计控制近 60% 市场；这一主导地位建立在碳酸锂、正极材料、负极材料和隔膜的国内一体化供应链上，由此形成美国制造商无法匹配的电芯价格。BloombergNEF
              报告称，电池包价格已接近 $108/kWh，预计 2026 年仍会下行。在这些价格水平下，一个新型美国授权制造工艺的增量价值主张变得难以成立：被许可方必须先投入 $500 million 到 $5 billion
              建设 GWh 级工厂，才能达到商业规模；若没有明确政府支持或锁定的 OEM 采购，经济性站不住。政策端，美国 Inflation Reduction Act 的 45X Advanced
              Manufacturing Production Credit 是支撑国内电池制造投资的主要政策工具；2024 年选举后，执行不确定性明显上升，削弱了 2021–2023
              年美国电池初创公司大额融资所依赖的政策顺风。Wood Mackenzie 预计，在不利关税和 IRA 情景下，美国电网级 BESS 市场 2026 年可能收缩近三分之一。Dallas Fed 2026 年 3
              月发布的研究确认，美国 EV 渗透率约为新车销量的 8–9%，低于早先目标；需求疲软导致主要 OEM 推迟电池技术合作承诺。S&P Global Automotive Insights 2026 年 3
              月报道称，OEM 正把产能转向固定式储能，而不是 EV
              电池，降低了汽车电池技术联盟的紧迫性。仅靠授权模式无法弥补中国在供应链整合上的结构优势。运营风险登记表（TR002）和风险传导图（FR002）记录了这些外部力量如何传导为收入崩塌和公司关闭。
