  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与商业化架构
        blocks:
          - type: paragraph
            body: >
              24M Technologies 完全按技术授权公司来设计业务。它不建设或运营超级工厂，而是把 SemiSolid™ 制造平台、Unit Cell 工艺和相关 IP（700+
              项专利及专利申请）授权给制造伙伴。被授权方支付费用，获得使用 24M 工艺和技术套件生产电池的权利；作为交换，24M 收取授权费，并按类似技术授权方的行业惯例，持续按产量单位或每 kWh
              收取版税。具体版税率、前期授权付款金额和收入分成条款从未公开披露。公司自称模式“灵活且轻资产”，明确把自己与需要重资本建厂的电池制造商区分开。这一路径降低了 24M
              自身制造足迹的资本强度，却把商业执行风险集中到被授权伙伴身上，因为后者必须为自己的 GWh 级工厂融资。

              24M 的理论收入来源包括：（1）每份授权协议启动时支付的技术授权费，（2）基于被授权方产量的持续单件或每 kWh 版税，（3）与伙伴联合开发产生的工程和开发服务收入，以及（4）覆盖特定 R&D
              里程碑的政府资助。有证据显示达到商业规模活动的唯一来源，是 Kyocera 授权安排：Kyocera 使用 SemiSolid 工艺每年生产约 20,000 台 Enerezza 住宅储能设备，隐含年产量约
              200 MWh。ARPA-E 资助收入至少为 $12.2 million。没有证据显示其他收入来源达到商业规模。收入确认政策、已报告收入、年经常性收入（ARR）、毛利率，以及各收入来源相对贡献，公开资料均不可得。
