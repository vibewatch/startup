- id: western-korean-manufacturers
  title: Western and Korean Incumbent Manufacturers — LG Energy Solution, Panasonic, Samsung SDI
  body: 'LG Energy Solution (LGES) is the most strategically relevant incumbent competitor for 24M''s technology licensing
    ambitions. LGES held 6.6% of global EV battery installations in January 2026 and is undergoing a fundamental business-mix
    shift: ESS batteries are projected to surpass EV battery revenue for the first time in 2026, with ESS sales targeted to
    exceed KRW 12 trillion ($8B) versus EV battery sales of approximately KRW 10.3 trillion. LGES is building over 50 GWh
    of North American ESS production capacity by end 2026 across facilities in Michigan, Tennessee (Ultium Cells JV with GM),
    Ohio, and Canada. This scale represents a direct challenge to any licensing model targeting North American ESS manufacturing,
    because LGES brings existing OEM relationships, manufacturing capability, and geographic proximity to US demand centers
    that no startup licensee can replicate.

    LGES''s Q1 2026 results (KRW 6.6 trillion revenue, operating loss of KRW 207.8B) reflect a transition period: costs are
    rising as new ESS facilities ramp up, while EV battery shipments declined due to inventory adjustments by a key North
    American customer. Despite the operating loss, LGES secured over 100 GWh in new orders for its 46-Series cylindrical EV
    batteries, bringing its total order backlog to over 440 GWh as of April 2026. LGES is also developing all-solid-state
    and sodium-ion batteries for the next generation of products, positioning itself to own the transition to advanced chemistries
    that 24M and QuantumScape are currently targeting.

    Panasonic, the third-largest global EV battery manufacturer with 4.3% market share in January 2026 (3.1 GWh), is best
    known as Tesla''s primary cylindrical cell supplier and as a majority owner of Prime Planet Energy & Solutions (PPES)
    — the joint venture with Toyota that began solid-state battery production in 2026 with initial capacity of 9 GWh/year,
    with first deployment in Lexus vehicles targeted for 2027–28. Panasonic''s strategic position benefits from its exclusive
    depth with Tesla and its role in Toyota''s solid-state program; its manufacturing and customer relationships effectively
    close it off from licensing independent process technology like SemiSolid.

    Samsung SDI, in October 2025, announced a three-way Joint Evaluation Agreement with Solid Power and BMW Group to develop
    all-solid-state battery cells for a demonstration vehicle. Under this agreement, Solid Power supplies sulfide-based solid
    electrolyte to Samsung SDI, which integrates it into separators and catholytes and manufactures cells evaluated by BMW.
    This collaboration demonstrates how established Korean cell manufacturers are actively competing in the advanced manufacturing
    licensing space — as acquirers of licensed materials and processes rather than as potential licensees for SemiSolid. Samsung
    SDI is a strategic acquirer of next-generation electrolyte IP, not a prospective 24M customer.

    '
