    topic: 24M's SemiSolid quality and performance at Kyocera commercial scale
    missingEvidence: 'No independent third-party performance validation of Kyocera''s SemiSolid Enerezza cells at commercial
      scale (cycle life, calendar ageing, safety, field return rates) has been publicly reported. Kyocera''s 400 MWh production
      scale is known from Kyocera press releases but detailed cell performance data in residential ESS deployment is not publicly
      available.

      '
    whyItMatters: 'If SemiSolid cells showed degraded performance in the field, it would materially alter the moat assessment
      and explain why Kyocera did not accelerate its own expansion further.

      '
