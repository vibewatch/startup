    missingEvidence: '24M never disclosed its licensing fee structure, royalty rate per kWh, or the specific commercial terms
      with Kyocera, FREYR, or any other licensee. The $3M FREYR termination payment provides one data point but is a settlement
      amount, not a royalty rate. Without royalty economics, it is impossible to independently assess whether the licensing
      model was structurally viable at full commercial scale or whether it was underpriced relative to the value delivered.

      '
    whyItMatters: 'The licensing fee structure directly determines whether the model could have been viable with a larger
      licensee pool, or whether even full commercialisation would have been insufficient to support 24M''s operating costs.

      '
    relatedQuestionRefs:
