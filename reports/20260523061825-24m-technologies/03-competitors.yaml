- id: TP003
  title: Pricing and Cost Structure Comparison — Battery Cells and Technology Licensing
  claimRefs:
  - CP002
  - CP033
  - CP034
  - CP006
  - CP011
  columns:
  - competitor
  - price_cost_basis
  - value_quantity
  - discount_unknowns
  - implication
  rows:
  - - CATL (LFP cells, China factory gate)
    - Factory-gate cell price, Chinese manufacturing cost
    - $53–56 /kWh (2026 estimate, Benchmark Mineral Intelligence / BNEF)
    - Excludes shipping, tariffs, qualification costs for non-Chinese customers
    - Sets global price floor; Western licensees cannot compete on $/kWh at this level
  - - Global average LFP pack price (all manufacturers)
    - Pack-level (cell + module + BMS), BNEF weighted average
    - $81 /kWh (2025, BNEF); ~$105 /kWh across all chemistries (2026)
    - US/EU pack prices ~44% above China average; wide variation by format
    - Western licensees compete in the $80–130/kWh pack range, where SemiSolid's claimed 40% mfg cost reduction is more applicable
  - - LG Energy Solution (ESS cells, North American production)
    - ESS cell supply contracts; operating loss basis in EV segment
    - Not publicly disclosed; ESS operating margin projected ~15% (2026 analyst estimate)
    - List pricing unavailable; ITC-eligible for US ESS projects reduces effective customer cost
    - LGES North American ESS cells are FEOC-compliant and increasingly competitive; limits 24M licensee addressable market
  - - QuantumScape (QSE-5 solid-state cells, pilot scale)
    - Pre-commercial pilot production; no publicly disclosed pricing
    - 'Cost targets: $400–800 /kWh in early commercial phase (analyst estimates)'
    - Far above commercial parity; licensing revenue model means QS does not sell cells
    - QS cells are not yet price-competitive; technology licensing revenue (not cell sales) is the value capture mechanism
  - - SES AI (Li-Metal ESS/drone cells, commercial)
    - ESS distribution agreement + drone cell supply
    - $6.7M Q1 2026 revenue on ~1M annual drone cell capacity; $30–35M FY2026 guidance
    - Per-cell and per-kWh pricing not disclosed; gross margin 18.1% Q1 2026
    - SES AI is first advanced-battery startup to generate material commercial revenue; validates non-EV pivot as near-term
      bridge
  - - 24M Technologies (SemiSolid licensing — historical)
    - Licensing fee + royalty model; no publicly disclosed terms
    - Revenue undisclosed; Series H at $1.3B valuation implies significant expected royalty growth
    - License fee and royalty terms with Kyocera/FREYR undisclosed; FREYR termination payment was $3M (partial evidence)
    - License economics were insufficient to sustain operations post-Series H; only Kyocera generated any licensing revenue
  notes: Pricing data reflects publicly reported estimates; actual contract prices are not disclosed. Chinese factory-gate
    prices from Benchmark Mineral Intelligence / AInvest (2026). Pack prices from BNEF. QS and SES AI cost estimates are analyst
    approximations, not company-disclosed pricing.
- id: TP004
  title: Moat Durability and Competitive Risk Register — 24M Technologies
  claimRefs:
  - CP007
  - CP008
  - CP022
  - CP023
  - CP026
  - CP029
  - CP032
  - CP035
  columns:
  - moat_claim
  - threat
  - severity
  - outcome_evidence
  rows:
  - - SemiSolid process IP (patents, know-how) creates switching costs for licensees
    - Low licensee addressable pool; high adoption friction means only Kyocera converted
    - Critical
    - FREYR terminated license Nov 2024; no US or EU licensee reached commercial scale
  - - 40% manufacturing cost reduction vs. conventional Western Li-ion
    - Chinese incumbents (CATL/BYD) undercut even conventional Western costs by 56%+; SemiSolid advantage does not close the
      gap vs. Chinese imports
    - Critical
    - No Western licensee found the cost case compelling enough to sustain investment; FREYR cited 'falling battery prices'
      (Chinese competition) as primary reason for license termination
  - - Chemistry agnosticism (LFP, NMC, Li-metal compatible) broadens addressable licensee market
    - Chinese manufacturers already produce all chemistries at scale; FEOC-compliant market limited in size
    - Moderate
    - Kyocera ESS uses LFP-compatible SemiSolid; no Li-metal or NMC licensee reached commercial scale
  - - Asset-light licensing model limits 24M's capital intensity
    - Licensee capital requirements ($2B+ per viable gigafactory) remain high; 24M cannot control licensee execution
    - Critical
    - FREYR's $2.6B factory was too capital-intensive given market conditions; 24M had no mechanism to fund or rescue licensee
      execution
  - - First-mover advantage in SemiSolid as a manufacturing process category
    - QuantumScape (solid-state) and Sila (silicon anode) attracted comparable OEM attention for competing process innovations;
      24M was not the only game in advanced battery process licensing
    - Moderate
    - QuantumScape retained $971M cash and active licensing pipeline after 24M closure; Sila opened US factory; 24M's first-mover
      position did not translate to sustained OEM adoption
  - - Government grants (DOE, ARPA-E) validate technology and support R&D
    - 'Government grants provide validation but not commercial revenue; competitors (Sila: $120M+ DOE, QuantumScape: government
      contracts) also received significant public funding'
    - Low
    - DOE/ARPA-E funding did not prevent closure; government programs validated technology but were insufficient commercial
      backstop
  - - Northvolt-style execution risk exists for conventional manufacturers; SemiSolid simpler to scale
    - Northvolt's collapse showed that battery manufacturing execution risk is severe regardless of approach; SemiSolid's
      relative simplicity did not create a comparable licensee advantage
    - Critical
    - Northvolt failed with $15B raised and $50B in orders using conventional technology; 24M's simpler process did not attract
      the scale of manufacturing partners needed for sustainability
  notes: Risk severity (Critical / Moderate / Low) is an analytical judgment based on documented commercial outcomes. Outcome
    evidence reflects publicly available information as of May 2026; private information about 24M internal decisions is not
    available.
