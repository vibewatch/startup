  body: 'The June 2026 open auction of 24M''s 700-plus patent portfolio is the most consequential near-term risk from the closure. If a Chinese battery manufacturer or patent assertion entity acquires the foundational SemiSolid, Impervio, and ETOP patents, the resulting IP position could restrict US battery technology development, generate licensing litigation against legitimate manufacturers, or be used to block competing US innovations. No defensive purchasing consortium, government right-of-first-refusal, or restricted auction process has been publicly announced.

    '
  claimRefs:
  - CR037
  - CR001
- id: callout-freyr-termination
  type: risk
  title: FREYR Termination — Thesis-Break Event That Preceded Closure
  body: 'FREYR Battery''s termination of both license agreements with 24M in November 2024 — paying $3 million and forfeiting nearly seven million preferred shares — was the single most decisive event preceding the March 2026 closure. FREYR had been 24M''s primary US and European production pathway. Its subsequent pivot to solar module manufacturing signals that the licensee judged battery manufacturing economics as structurally unworkable against Chinese competition, not merely that 24M''s specific platform was insufficient. Any investor evaluating 24M''s IP auction should treat FREYR''s exit as evidence of a market failure, not a platform failure.

    '
  claimRefs:
  - CR003
  - CR020
  - CR021
- id: callout-china-competition
  type: risk
  title: Chinese Battery Cost Advantage — Structural, Not Cyclical
  body: 'CATL and BYD''s collective 59% global battery market share as of Q1 2026, combined with cell prices approaching $50/kWh, represents a structural competitive advantage built over two decades of integrated supply chain investment, domestic lithium and cathode material access, and government industrial policy. This cost position cannot be addressed by a technology licensing model that requires licensees to fund their own gigafactories in higher-cost markets without matching supply chain integration. The IRA''s 45X credits were the primary offset mechanism; their rollback risk removes the final economic lever that made US-licensed battery manufacturing commercially viable.

    '
  claimRefs:
  - CR009
  - CR010
  - CR014
  - CR018
