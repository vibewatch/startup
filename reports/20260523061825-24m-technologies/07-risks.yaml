- id: people-execution-kill-criteria
  title: People, Execution, Technology, and Kill Criteria
  body: '24M''s people and execution risks centered on key-person concentration, unproven technology scale-up, and the inherent limitations of a pure-licensing model that externalizes all manufacturing execution. Co-founder and Chief Scientist Yet-Ming Chiang — whose academic eminence (MIT Kyocera Professor, A123 Systems co-founder, 60+ patents) was the primary credibility anchor with investors, partners, and government grant agencies — explicitly declined to comment on the record about the 2026 shutdown per MIT Technology Review, indicating organizational distress and potential key-person disengagement before the formal wind-down. No US gigawatt-hour factory deployed SemiSolid technology at any point during the company''s 16-year operating history, confirming that the core technology-scale-up risk was never resolved and that the licensing model could not serve as a substitute for first-party manufacturing proof. The Rayong, Thailand facility acquired for $51.1 million in September 2024
    was never scaled to commercial production under 24M''s ownership before being included in the June 2026 liquidation. The IP portfolio auction creates execution risk for any potential acquirer who might attempt to restart the technology: the chain of title across 700+ patents, the enforceability of existing licensee agreements post-closure, and the status of ARPA-E grant milestone obligations all represent unresolved legal questions.

    Kill criteria that an investor should have monitored prior to the closure — and that were all breached before or during wind-down — include: (1) FREYR or a comparable US automotive licensee announcing a GWh-scale factory build; (2) a second revenue-generating commercial licensee becoming operational; (3) Chinese battery cell prices stabilizing above $70/kWh; and (4) IRA 45X credits surviving intact into 2025 with confirmed OEM utilization. None of these conditions were met. The mitigation and kill criteria table (TR005) provides a structured summary of monitorable triggers, threshold events, and the action implications for any investor considering IP acquisition from the liquidation auction.

    '
