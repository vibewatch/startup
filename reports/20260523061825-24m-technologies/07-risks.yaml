- id: external-market-and-policy
  title: External Market, Policy, and Competitive Risks
  body: 'The external risk environment for 24M''s business model had deteriorated severely by 2024–2026 across three intersecting dimensions: EV market slowdown, IRA policy rollback, and Chinese battery cost deflation. On the competitive side, CATL held approximately 45% of global EV battery supply in Q1 2026 and BYD approximately 14%, together controlling nearly 60% of the market — a dominant position built on integrated domestic supply chains for lithium carbonate, cathode materials, anode materials, and separators that yield cell prices US manufacturers cannot match. BloombergNEF reported battery pack prices approaching $108/kWh, with continued decline expected in 2026. At those price levels, the incremental value proposition of a novel US-licensed manufacturing process — which would require licensees to fund gigafactory construction at $500 million to $5 billion before reaching commercial scale — becomes economically untenable without explicit government support or captive OEM offtake.
    On the policy side, the US Inflation Reduction Act''s 45X Advanced Manufacturing Production Credit for battery cells and modules is the primary policy instrument supporting domestic battery manufacturing investment; following the 2024 election, implementation uncertainty rose materially, weakening the policy tailwind that had justified large capital raises for US battery startups in 2021–2023. Wood Mackenzie projects the US grid-scale BESS market could shrink by almost one-third in 2026 under adverse tariff and IRA scenarios. Dallas Fed research published March 2026 confirms US EV penetration at approximately 8–9% of new vehicle sales — below earlier targets — reflecting demand softness that led major OEMs to defer battery technology partnership commitments. S&P Global Automotive Insights reported in March 2026 that OEMs were pivoting capacity toward stationary energy storage rather than EV batteries, reducing urgency for automotive battery technology alliances. China''s structural advantage
    in supply chain integration is not addressable through a licensing model alone. The operational risk register (TR002) and risk transmission map (FR002) document how these external forces flowed through to revenue collapse and closure.

    '
