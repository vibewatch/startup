company:
  name: 24M Technologies
chapter:
  number: 7
  title: Risks
  summary: '24M Technologies represents one of the starkest risk case studies in the 2020s US battery startup cohort: a company that raised more than $500 million, achieved unicorn valuation ($1.3 billion at its September 2024 Series H), and entered complete closure by March 2026 — less than 18 months after its final raise. The risk posture is severe across every dimension assessed. On legal and liquidation risk, all company assets are scheduled for public auction by the Branford-Marcotte Group starting June 29, 2026, with the IP portfolio (700+ patents) at risk of acquisition by competitors or patent trolls. On market and policy risk, Chinese battery manufacturers CATL (45% share) and BYD (14% share) collectively hold nearly 60% of global EV battery supply at cost structures inaccessible to US licensors; the IRA''s 45X manufacturing credits face political rollback risk; and Wood Mackenzie projects US grid-scale BESS capacity could shrink by almost one-third in 2026. On partner and dependency
    risk, FREYR Battery terminated both license agreements in November 2024 and pivoted to solar, eliminating 24M''s primary US production pathway; Volkswagen''s 25% equity stake never converted to a commercial deployment; and Kyocera remained the sole commercial licensee at approximately 200 MWh per year — insufficient at scale to sustain the company''s valuation. On financial risk, the Series H was circularly structured (Nuovo+ sold its Rayong plant to 24M for $51.1M and simultaneously reinvested those proceeds as preferred stock), making net new external cash approximately $35.9 million and implying an effective burn runway of 6–12 months. On people and execution risk, co-founder Yet-Ming Chiang declined to comment on the record about the closure, and no US GWh-scale factory ever deployed SemiSolid technology. Kill criteria are effectively moot — each one was already breached before closure. Evidence gaps include pending litigation status, DOE grant clawback risk, and liquidation waterfall
    recovery percentages.

    '
sections:
- id: shutdown-and-liquidation
  title: Shutdown, Liquidation, and Asset-Sale Risk
  body: '24M Technologies'' closure risk has materialized completely: by March 2026 the company had entered wind-down proceedings, and a public auction of all assets managed by the Branford-Marcotte Group through BidSpotter is scheduled to commence June 29, 2026. The auction encompasses all company property at the Cambridge, Massachusetts headquarters — including manufacturing equipment, laboratory instruments, pilot-line machinery, furniture, and fixtures. AuctionZip listings corroborate the scope and date. MIT Technology Review''s March 2026 article on the US battery industry explicitly identified 24M as a company that has shut down, describing the failure as illustrative of a broader contraction in battery startup capital rather than an isolated management failure. Archyde''s independent analysis similarly characterizes 24M''s closure as resulting from the convergence of scale-up risk, adverse market timing, and over-reliance on a licensing model that left commercial execution entirely
    in partners'' hands. The most acute near-term risk from the liquidation perspective is the disposition of 24M''s 700-plus patent portfolio. An open auction could allow a competitor Chinese battery manufacturer, an incumbent cell maker, or a patent assertion entity to acquire foundational IP covering the SemiSolid manufacturing process, Impervio separator, Eternalyte electrolyte, and ETOP architecture. Such an acquisition could restrict future US battery innovation or generate licensing litigation against legitimate manufacturers. The legal risk register (TR001) captures the full regulatory and legal exposure, including unresolved questions about ARPA-E grant milestone compliance, potential clawback obligations, and pending litigation from the closure. The risk heatmap (FR001) summarizes the combined severity and likelihood profile across all risk categories. The convergence of FREYR termination, EV market slowdown, Chinese battery cost deflation, and the Series H circular structure created
    mutually reinforcing failure conditions that no single management action could have reversed.

    '
