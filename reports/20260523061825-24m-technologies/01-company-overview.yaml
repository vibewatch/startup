  - id: financial-profile
    title: Cover Metrics and Financial Profile
    body: >
      The following KPI snapshot captures available and inferred metrics as of the research
      date of 23 May 2026. 24M is a private company and is not required to publish
      financial statements. Revenue, gross margin, ARR, and customer count are not
      publicly disclosed and cannot be reliably estimated. The company's most recently
      disclosed valuation of $1.3 billion dates to September 2024; no subsequent
      financing round has been announced, and the company entered closure in early 2026.

      Headcount is estimated at approximately 119 employees based on third-party aggregator
      data; this figure has not been confirmed by the company and may not reflect the
      pre-closure reduction. Operating status as of May 2026 is closed/winding-down,
      with an asset auction scheduled for late June 2026.

      The company's R&D and manufacturing infrastructure included locations in Cambridge
      and Westwood, Massachusetts, and a pilot facility in Rayong, Thailand opened in
      2024. Inventory and fixed assets from these three locations are included in the
      Branford Group auction. Capital structure details beyond publicly announced equity
      rounds (no disclosed debt, convertible notes, or secondary transactions) are unknown.
