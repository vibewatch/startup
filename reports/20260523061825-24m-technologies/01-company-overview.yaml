callouts:
  - calloutType: risk
    title: Company Shut Down in Early 2026
    body: >
      MIT Technology Review (March 2026) and a Branford Group auction listing (June 2026)
      confirm that 24M Technologies entered complete closure. The company has not issued a
      public statement, co-founder Yet-Ming Chiang declined to comment, and email and phone
      inquiries went unanswered. Assets including equipment, IP, and facilities are being
      auctioned. This represents a total loss scenario for equity holders and raises
      questions about the fate of technology licenses held by Kyocera, Volkswagen, Fujifilm,
      Freyr, and Lucas TVS.
    claimRefs:
      - CO034
      - CO035
      - CO036

  - calloutType: strength
    title: MIT Pedigree, Patent Depth, and Domain Expertise
    body: >
      Yet-Ming Chiang's co-founding of both A123 Systems and 24M, combined with more than
      200 publications and 60 patents, gave 24M exceptional scientific credibility and
      access to government funding. The CEO and senior leadership team collectively brought
      decades of lithium-ion manufacturing experience from Quallion, EnerDel, QuantumScape,
      and Samsung SDI—an unusually strong operator bench for an early-stage battery startup.
    claimRefs:
      - CO008
      - CO009
      - CO006
      - CO011

  - calloutType: insight
    title: Licensing-First Model Transferred Execution Risk to Partners
    body: >
      24M's decision to license technology rather than build its own gigafactories limited
      capital intensity but created dependence on partners' operational and financial
      capacity. With Freyr facing its own difficulties and no confirmed US-based gigafactory
      anchor, the licensing model appears to have been insufficient to generate the revenue
      required to sustain operations when investor appetite contracted in 2025–2026.
    claimRefs:
      - CO022
      - CO025
      - CO037

