  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financials
      missingEvidence: >
        Annual revenue, gross margin, ARR, and customer count for 24M Technologies;
        detailed breakdown of total capital raised by round and investor.
      whyItMatters: >
        Without revenue data it is impossible to assess whether the licensing model
        generated sufficient cash to sustain operations, or whether the Series H
        capital was consumed by burn before commercialisation milestones were met.
      diligencePath: >
        Request financial statements or management accounts from the liquidation trustee
        or Branford Group auction process; contact prior investors (VW, Fujifilm) for
        disclosed financial terms.
      relatedQuestionRefs:
        - QO005

    - type: missing-source
      severity: material
      topic: shutdown
      missingEvidence: >
        Official explanation from 24M management, board, or major investors for the
        closure decision; specific triggers (e.g., failed financing, partner withdrawal,
        technical failure) behind the 2026 shutdown.
      whyItMatters: >
        The proximate cause of closure is material for IP valuation, for assessing
        whether Kyocera and Fujifilm licenses survive, and for understanding systemic
        risks in the US battery startup ecosystem. Understanding the causal chain
        (technical failure, partner withdrawal, or market conditions) has different
        implications for the residual value of the IP.
      diligencePath: >
        Obtain court or regulatory filings if any insolvency proceedings are initiated;
        interview former employees via LinkedIn; track reporting from The Information
        and MIT Technology Review as more details emerge.
      relatedTableRefs:
        - TO004
      relatedQuestionRefs:
        - QO024

    - type: stale
      severity: material
      topic: licensing
      missingEvidence: >
        Current status of Kyocera's SemiSolid production plans and license rights following
        the 24M shutdown announcement; whether Kyocera's FY2026 production increase target
        is proceeding, paused, or abandoned. TO003 investor map is partial; earlier-round
        institutional VCs (CRV, North Bridge, Shumway Capital) and minor shareholders
        are unconfirmed; stake percentages and board-seat holders (except VW 25%) are unknown.
      whyItMatters: >
        Kyocera is the primary commercial licensee producing SemiSolid cells at scale;
        its continued operation—or cessation—determines whether the technology retains
        any live commercial footprint post-closure. Incomplete investor data limits
        cap-table and governance analysis.
      diligencePath: >
        Review Kyocera Corporation investor relations filings and earnings calls;
        contact Kyocera directly via official channels; monitor Japanese battery
        industry trade press for production announcements. Contact Series E/F-era investors
        via public fund disclosures for confirmed ownership data.
      relatedTableRefs:
        - TO003
      relatedQuestionRefs:
        - QO025

    - type: missing-source
      severity: minor
      topic: headcount and TO002 board composition
      missingEvidence: >
        Verified employee headcount figures for 24M Technologies as of closure,
        and historical headcount trajectory from 2010 to 2026. Board of directors
        composition and investor board-seat holders are not publicly identified;
        TO002 only captures the named executive leadership team.
      whyItMatters: >
        Headcount trajectory is a proxy for burn rate and operational scale;
        the ~119 third-party estimate has not been confirmed by the company.
        Incomplete board composition data limits assessment of governance oversight.
      diligencePath: >
        Review LinkedIn company-page headcount; cross-reference WARN Act filings in
        Massachusetts for notification of layoffs at closure.
      relatedTableRefs:
        - TO002
      relatedQuestionRefs:
        - QO017

    - type: missing-source
      severity: minor
      topic: technology
      missingEvidence: >
        Independent third-party technical benchmarking comparing 24M's SemiSolid
        platform to solid-state battery alternatives (QuantumScape, Solid Power, etc.)
        on cost, cycle life, energy density, and manufacturing yield at scale.
      whyItMatters: >
        All cost-reduction and energy-density figures in the public record are
        company-claimed; no independently audited production data has been published,
        making it impossible to verify 40% cost savings or competitive positioning claims.
      diligencePath: >
        Commission independent technical assessment from battery consultancy (e.g.,
        Volta Energy Technologies, Benchmark Mineral Intelligence); review ARPA-E
        project progress reports if publicly available.
      relatedQuestionRefs:
        - QO020
        - QO023

