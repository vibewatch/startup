  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: 24M licensing fee terms and royalty economics
      missingEvidence: >
        24M never disclosed its licensing fee structure, royalty rate per kWh, or the specific commercial terms with
        Kyocera, FREYR, or any other licensee. The $3M FREYR termination payment provides one data point but is a
        settlement amount for prior services, not a royalty rate. Without royalty economics, it is impossible to
        independently assess whether the licensing model was structurally viable at full commercial scale.
      whyItMatters: >
        The licensing fee structure directly determines whether the model could have been viable with a larger licensee
        pool, or whether even full commercialisation would have been insufficient to support 24M's operating costs.
      relatedQuestionRefs:
        - QI002
        - QI003

    - type: private-evidence-only
      severity: material
      topic: Monthly cash burn rate and runway before closure
      missingEvidence: >
        No cash balance, monthly burn rate, or runway figure has been publicly disclosed by 24M for any period. The
        implied burn rate of $4–7M/month is a mathematical estimate derived from the observable Series H headline and
        the observed closure timeline — it carries significant uncertainty and should not be relied upon without
        verification against internal records.
      whyItMatters: >
        Without burn rate data, it is impossible to determine whether closure was caused by unexpectedly high operating
        costs, a failure to raise additional capital, a strategic governance decision, or some combination of factors.
      relatedQuestionRefs:
        - QI004
        - QI022

    - type: private-evidence-only
      severity: material
      topic: VW and Fujifilm commercialization status and IP rights post-closure
      missingEvidence: >
        Neither Volkswagen Group (25% equity holder, board seat, SemiSolid automotive subsidiary) nor Fujifilm ($20M
        investor, SemiSolid licensee) has publicly disclosed its commercialization status or its plans for the 24M IP
        post-closure. VW's subsidiary could potentially continue SemiSolid development independently under an existing
        license; this is unknown.
      whyItMatters: >
        If VW or Fujifilm continue to use 24M IP under existing licenses, the patent portfolio retains some commercial
        value even after 24M's closure. If all licensees abandon the technology, the portfolio value at auction is
        primarily defensive (blocking prior art) rather than revenue-generative.
      relatedQuestionRefs:
        - QI017
        - QI018

    - type: evidence-conflict
      severity: moderate
      topic: Thailand facility disposition post-closure
      missingEvidence: >
        The Branford Group auction lists three US locations (Westwood MA, Billerica MA, Hudson NH). The Thailand
        Rayong facility is not mentioned in either auction listing. It is unclear whether the Thailand facility was
        separately negotiated with Nuovo+ (the original seller), included in a private transaction, or is subject to
        Thai government restrictions via the BOI/IEAT licenses obtained at acquisition.
      whyItMatters: >
        The Thailand facility cost $51.1M and represents approximately 60% of the Series H headline capital. Its
        disposition directly affects the remaining equity value and the recovery potential for Series H investors.
      relatedQuestionRefs:
        - QI015
        - QI026

