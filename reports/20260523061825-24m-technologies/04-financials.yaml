company:
  name: 24M Technologies
chapter:
  number: 4
  title: Financials
  summary: >
    24M Technologies operated exclusively as a technology licensor throughout its life: it did not manufacture batteries
    at commercial scale but instead licensed its SemiSolid™ platform to manufacturing partners in exchange for upfront
    fees and ongoing per-unit royalties whose specific terms were never publicly disclosed. The company raised more than
    $500 million across twelve or more rounds, including an $87 million Series H at a $1.3 billion post-money valuation
    in September 2024 — its final raise. The Series H was structurally co-financed by Nuovo+, which sold its Rayong,
    Thailand battery pilot facility to 24M for $51.1 million and simultaneously reinvested those proceeds into Series H
    preferred stock, meaning the net new external cash inflow was approximately $35.9 million. Only one licensee —
    Kyocera Corporation — achieved commercial-scale production, generating residential energy-storage revenue in Japan
    through its Enerezza system at approximately 20,000 units (≈200 MWh) per year. FREYR Battery terminated both its
    license agreements on November 4, 2024, paying a $3 million settlement and forfeiting 6,975,956 Series G preferred
    shares. Volkswagen Group's 25% equity stake from January 2022 never translated into an automotive commercial
    deployment. Revenue, gross margin, ARR, burn rate, and runway are all undisclosed. The company entered closure by
    March 2026, less than 18 months after its unicorn-valuation Series H — an implied monthly net burn of $4–7 million.
    The capital structure is equity-only with no disclosed debt. Every forward-looking financial metric is unavailable
    and constitutes a diligence gap that cannot be remedied from public sources.

sections:
  - id: revenue-model
    title: Revenue Model and Monetization Architecture
    body: >
      24M Technologies structured its business entirely as a technology licensing company. Rather than building or
      operating gigafactories, 24M licensed its SemiSolid™ manufacturing platform, Unit Cell process, and associated
      IP (700+ patents and patent applications) to manufacturing partners. Licensees paid for the right to produce
      batteries using 24M's process and technology suite; in exchange, 24M received license fees and — based on standard
      industry practice for comparable technology licensors — ongoing royalties per unit or per kWh of production.
      Specific royalty rates, upfront license payment amounts, and revenue-sharing terms have never been disclosed
      publicly. The company itself described its model as "nimble and asset-light," explicitly contrasting itself with
      battery manufacturers that require heavy capital for factory construction. This approach limits 24M's capital
      intensity for its own manufacturing footprint but concentrates commercial-execution risk with licensee partners
      who must fund their own gigawatt-scale factories.

      24M's revenue streams theoretically comprised: (1) technology license fees paid at the inception of each licensing
      agreement, (2) ongoing per-unit or per-kWh royalties on licensee production volume, (3) engineering and development
      services revenues from joint-development work with partners, and (4) government grants covering specified R&D
      milestones. The only stream with any evidence of commercial-scale activity is the Kyocera licensing arrangement,
      under which Kyocera produced approximately 20,000 Enerezza residential energy-storage units per year using the
      SemiSolid process — an implied volume of roughly 200 MWh per year. Grant income was at least $12.2 million from
      ARPA-E. No other revenue stream is evidenced at commercial scale. Revenue recognition policy, reported revenue,
      ARR, gross margin, and the relative contribution of each stream are all unavailable from public sources.
