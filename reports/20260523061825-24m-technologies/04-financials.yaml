  - id: unit-economics-cost-structure
    title: Unit Economics, Cost Structure, and Gross Margin Analysis
    body: >
      24M's unit economics are fundamentally undisclosed because the company is private and never reported revenue,
      cost of revenue, or gross margin in any public filing. The following analysis reconstructs the likely cost
      structure from first-principles reasoning and publicly available analogues.

      On the revenue side, a technology licensor's revenue per unit consists of an upfront license fee (one-time) plus
      a per-unit royalty. Comparable technology licensing arrangements in adjacent industries (semiconductor IP
      licensing, specialty materials licensing) typically yield royalty rates of 2–8% of licensee net revenue or
      $0.50–$5.00 per unit depending on the novelty and exclusivity of the technology. No 24M licensing contract terms
      have been publicly disclosed, and the company has not published any pricing schedule.

      On the cost side, 24M's "asset-light" model claims lower capital intensity than cell manufacturers. However, the
      company still incurred R&D costs (staff of approximately 119, laboratory space in Cambridge and Westwood MA,
      and the Rayong pilot facility), engineering services costs embedded in partner joint-development agreements, and
      general and administrative costs. The acquisition of the Rayong, Thailand facility in August 2024 for $51.1
      million represented a material step away from the pure asset-light model and introduced ongoing facility
      operations costs.

      The technology's claimed 40% manufacturing cost reduction over conventional lithium-ion is a customer-economics
      claim for licensees, not a margin claim for 24M itself. 24M's gross margin on its licensing revenue would be
      determined by the ratio of license and royalty revenue to R&D and service delivery costs — none of which are
      reported. No CAC, LTV, payback period, or sales-cycle length can be established from public data.
