  - id: licensing-partnerships
    title: Licensing Partnerships and Commercial Traction Evidence
    body: >
      Kyocera Corporation is the only 24M licensee confirmed to have reached commercial-scale production using 24M
      technology. Kyocera's Enerezza residential energy-storage system, launched commercially in Japan in 2020, is built
      on the 24M SemiSolid electrode and unit cell manufacturing process. As of December 2024, Kyocera operated an
      annual production capacity of approximately 20,000 units and announced plans to double production to 400 MWh per
      year by FY2026 through a JPY 10 billion (approximately USD 62–72 million) investment in a new production line at
      its Shiga Yasu plant. In March 2024, Kyocera and 24M jointly received the Electrochemical Society of Japan's
      Tanahashi Award, an industry recognition for the commercial application of SemiSolid batteries in Enerezza.
      This is the only documented proof of a 24M licensing arrangement resulting in volume production.

      Nuovo+ (an affiliate of PTT and Global Power Synergy PCL) served as the lead investor in the September 2024
      Series H, investing $51.1 million derived from the proceeds of its sale of the Rayong, Thailand pilot facility to
      24M. The Thailand acquisition — a 71,000 square-foot battery manufacturing and R&D facility capable of 100 MWh
      annual pilot production — closed on August 30, 2024, and was 24M's first owned manufacturing-scale facility.
      24M had begun pilot production at Rayong for an unnamed India-based mobility OEM as of September 2024.

      FREYR Battery held two 24M licenses (December 2020 for its Norway plant and October 2021 for its US "Giga
      America" factory). FREYR terminated both via a mutual termination agreement on November 4, 2024. FREYR paid
      $3.0 million in settlement for services previously provided and forfeited all 6,975,956 shares of 24M Series G
      preferred stock it held. This termination eliminated 24M's most prominent US commercial licensing prospect.

      Fujifilm Corporation received a SemiSolid manufacturing license as part of a $20 million investment in September
      2022, leveraging Fujifilm's 80-year history in precision coating technology. Volkswagen Group acquired a 25%
      equity stake in January 2022 and established a wholly-owned subsidiary to co-develop SemiSolid automotive cell
      production with 24M. Neither Fujifilm nor Volkswagen have reported any commercial-scale SemiSolid production.
