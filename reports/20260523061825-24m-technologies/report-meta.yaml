companyProfile:
  summary: 24M Technologies was an MIT spin-off founded in 2010 to commercialize a SemiSolid battery manufacturing process that aimed to lower battery capex, simplify production, and support multiple chemistries through an IP-licensing model. The company attracted strategic investors and partners including Volkswagen, Kyocera, Fujifilm, and Nuovo+, but only Kyocera reached visible commercial production. After raising an $87 million Series H at a $1.3 billion valuation in September 2024, 24M entered wind-down in early 2026 and moved toward an asset auction in June 2026.
