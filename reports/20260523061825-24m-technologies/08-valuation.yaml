- id: distressed-comps-and-failure-analogues
  title: Distressed Comps and Battery Startup Failure Analogues
  body: 'Northvolt AB represents the most instructive failure analogue for 24M. Northvolt raised approximately $15 billion in total equity and debt financing from marquee investors including Volkswagen, Goldman Sachs, and the European Investment Bank. The company was building gigafactory-scale lithium-ion production in Sweden. Despite this massive capital base, Northvolt filed for Chapter 11 bankruptcy protection in the US on November 21, 2024 — the same quarter as 24M''s Series H close. Northvolt''s failure was attributed to quality defects in its cells, missed production targets, the loss of a major BMW order, and an inability to ramp manufacturing at commercial scale. The bankruptcy demonstrates that even capital at 30× the scale of 24M''s total raise cannot guarantee commercial viability for novel battery manufacturing approaches.

    FREYR Battery''s trajectory is a direct analogue within 24M''s own partner ecosystem. FREYR raised capital to build a 40 GWh Norwegian factory and a $2.6 billion US Giga America facility in Georgia, both using 24M''s SemiSolid technology. By November 4, 2024, FREYR terminated both license agreements, paying 24M a $3 million settlement. FREYR subsequently cancelled its Georgia battery plant and pivoted entirely to solar module manufacturing — a complete abandonment of the 24M technology bet. The FREYR termination eliminated 24M''s only significant US commercial licensing prospect and sharply reduced the addressable royalty base supporting the $1.3 billion valuation.

    The broader pattern of battery startup distress — Northvolt Chapter 11, FREYR pivot, multiple SPAC-era battery companies trading at steep discounts — constitutes a strong downside comp set for 24M''s private valuation. In each case, the commercialisation gap between technology demonstration and gigawatt-scale production consumed capital far faster than licensing revenue could replace it. 24M''s asset-light licensing model was designed to avoid this trap, but its dependency on licensee execution meant that commercial failure risk was simply transferred to partners — and when partners failed or withdrew, the revenue base evaporated.

    '
