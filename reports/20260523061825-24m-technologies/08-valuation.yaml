  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Exact QuantumScape and peer market capitalisations as of May 2026
    missingEvidence: 'QuantumScape''s exact market capitalisation as of May 23, 2026 is not confirmed from a real-time market data source in the fetch log. Q1 2026 SEC filings confirm ongoing losses and pre-commercial status but do not provide a current share price. Public market caps for SLDP and SES are similarly not pinned to May 2026. The pattern of significant discount from SPAC-era valuations is well-established from multiple sources.

      '
    whyItMatters: 'Precise market cap figures would improve the comparable valuation table quantitative precision, but the directional conclusion — all comps trade at steep discounts from peak — is robust without exact numbers.

      '
    relatedQuestionRefs:
    - QV004
  - type: private-evidence-only
    severity: material
    topic: Thailand Rayong facility post-closure disposition
    missingEvidence: 'The $51.1 million Rayong, Thailand battery pilot facility acquired by 24M in August 2024 is not referenced in the Branford Group US auction listing. No public disclosure from Nuovo+, 24M, or Thai authorities explains whether the facility was transferred back to Nuovo+, sold to a third party, or is pending disposition. Given Thai BOI/IEAT regulatory involvement at acquisition, the disposition may require regulatory approval.

      '
    whyItMatters: 'The Thailand facility represents approximately 60% of the net new cash deployed at Series H. Its disposition is the single largest determinant of total asset recovery beyond the US auction, and the outcome could range from $0 (abandoned) to $50M+ (near-cost recovery if Nuovo+ repurchases) — a highly material range.

      '
    relatedQuestionRefs:
    - QV011
  - type: private-evidence-only
    severity: material
    topic: 24M aggregate preferred stock liquidation preference waterfall
    missingEvidence: '24M Technologies has never publicly disclosed its cap table, liquidation preference stack, or the per-series preference amounts for its 12+ funding rounds. The aggregate liquidation preferences from Seed through Series H are unknown and cannot be reconstructed from public sources. Without this data, it is impossible to determine whether any recovery from US auction or IP sale would reach Series H equity holders after satisfying prior preferences.

      '
    whyItMatters: 'If cumulative liquidation preferences exceed total asset recovery (physical + IP + Thailand), Series H investors receive zero equity recovery. This is the most likely scenario given total raises of $500M+ and the small estimated asset recovery range, but it cannot be confirmed without the cap table.

      '
    relatedQuestionRefs:
    - QV014
  - type: private-evidence-only
    severity: minor
    topic: Evidence of Series H investor due diligence adequacy and pre-close FREYR risk awareness
    missingEvidence: 'No public evidence exists on what due diligence Series H investors performed on 24M''s commercial revenue position, the structural risk embedded in the circular Nuovo+ transaction, or the FREYR license at-risk status. The FREYR mutual termination was announced November 4, 2024 — only 60 days after the September 5, 2024 Series H close — raising the question of whether FREYR''s withdrawal was foreseeable at time of investment.

      '
    whyItMatters: 'If FREYR risk was known or knowable at Series H close, it would reflect on the quality of the round''s due diligence and potentially on management disclosure obligations. However, this is a legal and governance question that cannot be answered from public sources and is outside the scope of this valuation chapter.

      '
    relatedQuestionRefs:
    - QV025
  - type: enumeration-incomplete
    severity: minor
    topic: Comparable valuation table — private battery startup comp coverage
    missingEvidence: 'The comparable valuation table includes only publicly disclosed comps (QS, SLDP, SES, Northvolt with public Chapter 11 filings, FREYR with public SEC filings, and 24M itself). Private battery startup comps with undisclosed valuations — including Factorial Energy, PolyJoule, Amprius Technologies, and others — are excluded because their private valuations are not publicly available. The partial-coverage designation reflects this limitation.

      '
    whyItMatters: 'Additional private-market comps could refine the multiple compression analysis, but the public comps are sufficient to establish the directional pattern: all battery technology startups at comparable stages have experienced severe valuation impairment.

      '
    relatedTableRefs:
    - TV004
    relatedQuestionRefs: []
