- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Topic
  - Missing Evidence
  - Why It Matters
  - Owner or Diligence Path
  rows:
  - - Thailand Rayong facility disposition
    - No public disclosure of Rayong facility transfer, sale, or return to Nuovo+; not listed in Branford Group US auction
    - At $51.1M acquisition cost (~60% of net Series H capital), its disposition is the single largest determinant of total asset recovery
    - Engage Branford Group estate administrator; contact Nuovo+/GPSC investor relations; review Thai BOI/IEAT records
  - - IP portfolio appraisal and acquirer interest
    - No public disclosure of 700+ patent portfolio valuation or strategic acquirer conversations in wind-down
    - Battery IP acquirer premium (strategic vs. auction distress pricing) could range from $0 to $100M+; highly material to recovery
    - Commission independent IP valuation from Anaqua, CPA Global, or similar; monitor USPTO assignment records
  - - Preference stack waterfall at closure
    - Total cumulative preferred stock liquidation preferences from 12+ rounds are not publicly disclosed; critical to understanding Series H recovery
    - If aggregate preferences exceed total asset recovery, Series H holders receive zero on equity regardless of IP/Thailand outcome
    - Request cap table and preference waterfall from estate administrator or Series H co-investors
  - - Kyocera license status post-closure
    - No disclosure on whether Kyocera's SemiSolid license survives 24M's wind-down or requires renegotiation with IP acquirer
    - If Kyocera continues production, the licensing IP has ongoing revenue value; if abandoned, IP value is purely defensive/blocking
    - Contact Kyocera Corporate Communications; review license agreement change-of-control provisions via estate
  - - Series H investor co-investor identities
    - Only Nuovo+ is publicly named as Series H investor; other investors and their aggregate dollar amounts are undisclosed
    - Coalition of co-investors affects ability to organise creditor representation in wind-down; affects governance of IP disposition decisions
    - Review Brochure/PPM or Series H closing documents via estate; check SEC Form D for partial disclosure
