- id: liquidation-and-asset-value
  title: Liquidation Value and Asset Recovery Analysis
  body: 'The Branford Group has been engaged to conduct a complete-closure auction of 24M Technologies'' US assets, scheduled for June 15–18, 2026. The auction covers three locations: 26 Dartmouth Street, Westwood MA 02090; 29 Esquire Road, Billerica MA 01821; and 8 Roosevelt Avenue, Hudson NH 03051. Asset categories include manufacturing equipment, robotics, battery testers and formation equipment, laboratory instruments, machine shop tooling, and facility infrastructure. Multiple items are dated 2024, consistent with the Thailand facility acquisition and the Series H-funded operational build-out.

    Physical equipment recovery in battery manufacturing distress sales typically achieves 10–40 cents on the dollar relative to original acquisition cost. Specialised electrochemical test equipment and SemiSolid-specific processing tools have limited secondary markets, which compresses recovery rates further. The auction is structured as a complete-closure sale with no stalking-horse bid or restructuring, implying maximisation of liquidation speed over recovery value. Aggregate physical asset recovery from the three US locations is estimated — based on the industry distress sale benchmark and the auction scope — to be well below $30 million.

    The most significant asset uncertainty is the Rayong, Thailand pilot facility, which cost $51.1 million in August 2024. The Thailand facility is not referenced in the US Branford Group auction listing. Its disposition is unknown: it may have reverted to Nuovo+ (the prior owner), been separately negotiated in a private transaction, or be subject to Thai BOI/IEAT regulatory constraints. This creates a material evidence gap in the total asset recovery picture. The 700+ patent portfolio represents another potentially recoverable asset, but battery IP in distress situations typically sells at steep discounts unless a well-capitalised strategic acquirer with immediate production plans participates. Given that all three named licensees (VW, Fujifilm, Kyocera) have the option of developing competing or adjacent technology, the bargaining position of a distress IP seller is weak. Recovery on IP is estimated at 5–15% of the value implied by the $1.3 billion valuation.

    '
