- id: FV002
  title: Valuation Sensitivity
  type: bar
  insight: '24M''s $1.3B valuation is sensitive to the licensing revenue multiple and ARR assumed. At any evidence-supportable ARR (the Kyocera-only base of ~$2–5M), the implied revenue multiple at $1.3B is 260–650x — unsustainable for any comparable technology licensor. Even aggressive bull-case ARR of $50M only justifies $375–750M at market multiples. The bear case (wind-down) implies zero going-concern value.

    '
