chapter:
  number: 8
  letter: V
  title: Valuation
  summary: '24M Technologies achieved a $1.3 billion post-money valuation in September 2024 via its $87 million Series H — its final capital raise. Structured analysis reveals the valuation was expensive at issuance and has since become severely impaired. The Nuovo+ co-investment was a circular sale-and-reinvestment transaction that inflated the headline raise while contributing only ~$35.9 million in net new external cash. Comparable public-market battery startups — QuantumScape, Solid Power, and SES AI — all trade at sharp discounts to peak valuations with no commercial-scale revenue. Northvolt''s November 2024 Chapter 11 filing after raising ~$15 billion illustrates that capital scale does not protect against commercialisation failure. FREYR''s license termination in November 2024 eliminated 24M''s only credible US commercial prospect. The Branford Group complete-closure auction scheduled for June 2026 confirms the company has entered wind-down. Liquidation value of physical and IP assets
    is estimated to be a small fraction of the $1.3 billion valuation. The base-case conclusion is that Series H investors face near-total loss on equity, and the 2024 unicorn valuation did not survive contact with commercialisation reality.

    '
sections:
- id: series-h-valuation-context
  title: Series H Valuation Context and Implied Metrics
  body: 'In September 2024, 24M Technologies closed its $87 million Series H at a $1.3 billion post-money valuation, achieving unicorn status. The round was led by Nuovo+, an affiliate of PTT and Global Power Synergy PCL (GPSC), which contributed $51.1 million — proceeds from the simultaneous sale of its Rayong, Thailand battery pilot facility back to 24M. This circular structure means only approximately $35.9 million represented genuinely new external capital, while the balance was a balance-sheet reclassification of an acquired asset. The Series H headline valuation of $1.3 billion implies a dilution of roughly 6.7% per the announced round size — consistent with a late-stage minority preferred round with meaningful preference overhang from prior rounds.

    The $1.3 billion valuation rested on four pillars: (1) 24M''s 700+ patent IP portfolio covering SemiSolid, ETOP, Impervio, and Eternalyte technologies; (2) anticipated licensing revenue from existing and future partners including Kyocera, Volkswagen, Fujifilm, and Nuovo+; (3) strategic optionality as a chemistry-agnostic battery technology platform; and (4) a positive macro environment for domestic battery manufacturing supported by IRA manufacturing tax credits and EV demand growth expectations. By March 2026 — only 18 months later — all four pillars had materially eroded: the licensing revenue base remained commercially underdeveloped, IRA support was curtailed, VW and Fujifilm had not reached commercial production, and FREYR had terminated both licenses. The implied monthly cash burn of $4–7 million was unsustainable given the licensing revenue base. No Series I or follow-on round was announced or closed.

    Using industry revenue multiples applicable to IP licensing businesses (5–15x revenue), the $1.3 billion valuation would require annual recurring royalty and licensing revenue of approximately $87–260 million to be supported at entry-level multiples. No evidence supports revenue at this scale; the only confirmed commercial royalty stream — Kyocera''s ~200 MWh/year Enerezza production — would generate single-digit millions at standard per-kWh royalty rates. The valuation was therefore primarily an option-value and strategic-premium construct, not an evidence-supported revenue-multiple valuation. This is common for pre-commercial deep-tech licensors but makes the valuation acutely vulnerable to any slowdown in licensing commercialisation.

    '
