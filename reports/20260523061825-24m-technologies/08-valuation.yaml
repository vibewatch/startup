  claims:
  - id: CV001
    statement: '24M Technologies raised $87 million in Series H preferred stock in September 2024 at a $1.3 billion post-money valuation, achieving unicorn status. The round was led by Nuovo+, an affiliate of PTT and Global Power Synergy PLC (GPSC). This is confirmed by the company''s official BusinessWire press release, Pulse2 independent reporting, and Mercom Capital Group analyst coverage.

      '
    type: third-party-reported
    topic: valuation-context
    sourceRefs:
    - SV001
    - SV002
    - SV003
    confidence: high
    freshness: historical
    answersQuestionRefs:
    - QV001
  - id: CV002
    statement: 'The Nuovo+ $51.1 million contribution to the Series H was structured as a circular transaction: Nuovo+ simultaneously sold its Rayong, Thailand battery pilot facility to 24M for $51.1 million and reinvested those proceeds into 24M Series H preferred stock. The net new external cash inflow to 24M from the round was therefore approximately $35.9 million (total $87M minus the $51.1M asset-for-equity exchange).

      '
    type: inferred
    topic: valuation-context
    sourceRefs:
    - SV001
    - SV019
    confidence: high
    freshness: historical
    answersQuestionRefs:
    - QV002
    - QV019
  - id: CV003
    statement: 'The $1.3 billion post-money valuation implies that to be supported at standard technology-licensor revenue multiples (8–15x), 24M would require annual recurring revenue of approximately $87–163 million. At a more aggressive 15x multiple (top of the range for high-growth IP licensors), even $87M ARR would only justify $1.3B. The only confirmed commercial royalty stream — Kyocera''s ~200 MWh/year production — would generate estimated royalties of $2–8 million per year at industry-analog rates, implying an unsupported implied multiple of 160–650x on observable royalty revenue.

      '
    type: estimated
    topic: valuation-context
    sourceRefs:
    - SV001
    - SV012
    - SV003
    confidence: medium
    freshness: historical
    answersQuestionRefs:
    - QV003
    - QV009
  - id: CV004
    statement: '24M''s $1.3 billion valuation was primarily an option-value and strategic-premium construct. The four pillars supporting it — IP portfolio value, future licensing revenue pipeline, strategic optionality as a chemistry-agnostic platform, and IRA-backed US manufacturing growth — were each forward-looking assumptions rather than evidence-supported trailing revenue multiples. This is structurally similar to how QuantumScape, Solid Power, and SES AI were valued at peak: on future technology potential rather than current revenue.

