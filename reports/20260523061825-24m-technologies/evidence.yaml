    severity: material
    topic: VW Group shareholder agreement terms and change-of-control provisions
    missingEvidence: >
      The specific terms of Volkswagen Group's shareholder agreement with 24M — including any change-of-control consent
      rights, IP licensing perpetuity clauses, liquidation preference mechanics, or first-right-of-refusal on IP — are
      not publicly disclosed. The January 2022 press release confirms the 25% equity stake but provides no contractual
      detail on shareholder protections.
    whyItMatters: >
      VW's shareholder agreement terms could materially affect the June 2026 auction: VW may hold consent rights over IP
      disposition, perpetual licensing rights to the SemiSolid technology that survive closure, or preferential equity
      recovery claims. Any IP acquirer from the auction should understand whether VW retains any ongoing rights to the
      technology.
    diligencePath: >
      Request the VW shareholder agreement and associated IP licensing schedule from the liquidation trustee; contact VW
      corporate development to clarify their post-closure position on the technology; review any SEC-filed exhibits from
      the Series G round that may contain shareholder agreement summaries.
