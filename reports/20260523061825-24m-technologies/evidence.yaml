  - type: private-evidence-only
    severity: material
    topic: Thailand Rayong facility post-closure disposition
    missingEvidence: >
      The $51.1 million Rayong, Thailand battery pilot facility acquired by 24M in August 2024 is not referenced in the
      Branford Group US auction listing. No public disclosure from Nuovo+, 24M, or Thai authorities explains whether the
      facility was transferred back to Nuovo+, sold to a third party, or is pending disposition. Given Thai BOI/IEAT
      regulatory involvement at acquisition, the disposition may require regulatory approval.
    whyItMatters: >
      The Thailand facility represents approximately 60% of the net new cash deployed at Series H. Its disposition is
      the single largest determinant of total asset recovery beyond the US auction, and the outcome could range from $0
      (abandoned) to $50M+ (near-cost recovery if Nuovo+ repurchases) — a highly material range.
    relatedQuestionRefs:
