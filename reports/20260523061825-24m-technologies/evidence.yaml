  - type: evidence-conflict
    severity: moderate
    topic: CATL/BYD FEOC status and US market accessibility
    missingEvidence: >
      The implementation of FEOC (Foreign Entity of Concern) restrictions on CATL and BYD cells in US ITC-eligible
      storage projects is a regulatory matter with ongoing litigation and administrative guidance. The full commercial
      impact — which US projects are affected, what substitutes are eligible, and whether Korean manufacturers fully
      fill the gap — is not definitively resolved as of May 2026.
    whyItMatters: >
      If FEOC restrictions were stringent and fully enforced, they could have created a protected US market for
      SemiSolid or other non-Chinese cell technologies; if loosely enforced or subject to waivers, the competitive
      advantage disappears.
