  - type: private-evidence-only
    severity: material
    topic: ARPA-E grant milestone completion and DOE clawback risk
    missingEvidence: >
      Whether 24M completed its ARPA-E grant milestones (sodium-metal battery program, $3.2 million, 2023) before
      closure and whether the US Department of Energy has any clawback rights on disbursed grant funds is entirely
      unknown from public sources. The ARPA-E grant documentation confirms the award but does not disclose milestone
      completion status or any enforcement action.
    whyItMatters: >
      A DOE clawback claim would rank as a senior creditor obligation in the liquidation waterfall, reducing recovery
      for equity and subordinate creditors. It would also represent a government regulatory risk for 24M's successors or
      any IP acquirer who assumes obligations under the grant.
    diligencePath: >
      Request confirmation from the DOE/ARPA-E contracting officer of milestone completion status and grant close-out
      documentation; review any grant agreement terms regarding change-of-control or wind-down obligations; assess
      whether DOE filed any claim against the 24M estate.
    relatedTableRefs:
      - TR001
    relatedQuestionRefs:
      - QR007
      - QR020
  - type: missing-source
    severity: material
    topic: pending litigation and creditor claims from closure
    missingEvidence: >
      No public sources confirm whether 24M Technologies faces pending litigation from employees, creditors, former
      licensees, or government agencies arising from the March 2026 closure and the June 2026 auction. Employee
      severance disputes, WARN Act compliance, and any secured creditor claims are entirely absent from the public
      record.
    whyItMatters: >
      Any pending litigation or creditor claims would affect the liquidation waterfall, reduce auction proceeds
      available for equity holders, and create legal encumbrances on the IP portfolio being auctioned — making it
      critical information for any bidder evaluating the June 2026 auction.
    diligencePath: >
      Search PACER (US federal court records) for any bankruptcy, WARN Act, or employment litigation filings naming 24M
      Technologies; verify Massachusetts state court records for any creditor or employee claims; request confirmation
      from the Branford-Marcotte Group of any known encumbrances on auctioned assets.
    relatedQuestionRefs:
      - QR008
      - QR021
