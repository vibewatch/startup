    statement: >
      The SemiSolid™ manufacturing process uses a thick, gel-like suspension of active material particles (LFP, NMC,
      NCA, graphite) mixed directly with conductive carbon and liquid electrolyte, then cast onto current-collector foil
      without any organic binder or additional solvent — using the electrolyte as the processing solvent. This
      eliminates the drying and calendering steps required in conventional slurry coating, which uses NMP
      (N-methyl-2-pyrrolidone) as a solvent that must be evaporated and recovered.
