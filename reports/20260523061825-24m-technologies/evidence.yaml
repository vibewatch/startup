    severity: minor
    topic: Evidence of Series H investor due diligence adequacy and pre-close FREYR risk awareness
    missingEvidence: >
      No public evidence exists on what due diligence Series H investors performed on 24M's commercial revenue position,
      the structural risk embedded in the circular Nuovo+ transaction, or the FREYR license at-risk status. The FREYR
      mutual termination was announced November 4, 2024 — only 60 days after the September 5, 2024 Series H close —
      raising the question of whether FREYR's withdrawal was foreseeable at time of investment.
    whyItMatters: >
      If FREYR risk was known or knowable at Series H close, it would reflect on the quality of the round's due
      diligence and potentially on management disclosure obligations. However, this is a legal and governance question
      that cannot be answered from public sources and is outside the scope of this valuation chapter.
