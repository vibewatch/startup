  - type: private-evidence-only
    severity: material
    topic: 24M aggregate preferred stock liquidation preference waterfall
    missingEvidence: >
      24M Technologies has never publicly disclosed its cap table, liquidation preference stack, or the per-series
      preference amounts for its 12+ funding rounds. The aggregate liquidation preferences from Seed through Series H
      are unknown and cannot be reconstructed from public sources. Without this data, it is impossible to determine
      whether any recovery from US auction or IP sale would reach Series H equity holders after satisfying prior
      preferences.
    whyItMatters: >
      If cumulative liquidation preferences exceed total asset recovery (physical + IP + Thailand), Series H investors
      receive zero equity recovery. This is the most likely scenario given total raises of $500M+ and the small
      estimated asset recovery range, but it cannot be confirmed without the cap table.
    relatedQuestionRefs:
