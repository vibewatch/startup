figures:
  - id: FM001
    title: Market Sizing Pyramid — Lithium-Ion Battery Market Layers
    type: pyramid
    layout: standard
    summary: >
      Three-layer market pyramid showing the hierarchy of lithium-ion battery market
      segments from broadest TAM definition (all Li-ion global market) to the specific
      technology licensing market relevant to 24M's SemiSolid platform. Layer values
      reflect analyst-range midpoints; 24M SAM/SOM are evidence-constrained estimates,
      not company-disclosed figures.
    data:
      items:
        - label: "Global Li-ion Battery Market (TAM)"
          value: "$83–207B (2026, analyst range)"
          note: "Wide range reflects definitional inconsistency across market reports; includes EV, ESS, consumer electronics"
        - label: "Grid/ESS + EV Battery Manufacturing (SAM proxy)"
          value: "~$100–150B estimated, not independently verified"
          note: "Excludes consumer electronics; approximated from BNEF ESS deployment data + EV battery market estimates; 24M did not disclose SAM"
        - label: "Technology Licensing / Novel Process Market (SOM proxy)"
          value: "Not publicly disclosed; only Kyocera at 400 MWh/yr scale confirmed"
          note: "No independent TAM estimate for battery manufacturing technology licensing sub-market exists; 24M SOM cannot be derived from public data"
    approximationNotes: >
      Layer 2 is estimated from segment revenue data from BRC ($108B EV battery) and BNEF/InfoLink ESS
      deployment data ($68–82B stationary storage market per Coherent Market Insights and Business
      Research Company), less consumer electronics. Layer 3 (SOM/technology licensing) is an evidence
      gap — no analyst report provides an independent market size for battery manufacturing process
      licensing, and 24M never disclosed this figure. The pyramid communicates the nested structure
      rather than precise revenue layers.
    claimRefs:
      - CM001
      - CM002
      - CM009
      - CM011

