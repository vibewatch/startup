  - id: drivers-constraints
    title: Growth Drivers and Adoption Constraints
    body: >
      The dominant growth driver for the battery storage markets relevant to 24M is the
      surge in grid storage demand driven by three converging forces: large-scale solar
      and wind deployment requiring dispatchable backup, AI data center power demand
      requiring battery backup at unprecedented scale, and the structural shift of excess
      EV battery capacity toward BESS applications. The IEA's 2026 data confirms battery-
      based uninterruptible power supplies for data centers grew 30% to 45 GW in 2025.
      The proposed Stargate AI facility in Abilene, Texas alone may require 1 GW of battery
      backup, representing approximately 6% of all batteries installed on the US grid in 2025.

      Policy support for grid storage was preserved in the US through the July 2025 budget
      reconciliation bill (the "One Big Beautiful Bill Act"), which maintained investment
      tax credits for battery storage installation and manufacturing through the 2030s —
      a critical backstop that BNEF cited as a reason for its optimistic global storage
      outlook despite EV market headwinds. Australia's Capacity Investment Scheme is driving
      13 GWh of new ESS installations projected for 2026; India, Brazil, and South Korea
      have pipeline tenders measuring in GWh. InfoLink's 2026 outlook places emerging markets
      (excluding China, US, Europe) at approximately 20% of global installation growth.

      The primary adoption constraint for novel battery manufacturing processes like SemiSolid
      is structural capital intensity. Industry experts at The Battery Show North America (2025)
      quantified the minimum viable battery factory as requiring approximately $2 billion in
      capital and 10 years to reach cash-flow breakeven, with a minimum profitable scale of
      18–22 GWh. This capital timeline is fundamentally incompatible with venture capital
      models. The Dallas Fed (March 2026) confirmed that more than 10 US gigafactory projects
      have been officially canceled or stalled, representing over $10 billion in abandoned
      investment. China's cost advantage — with LFP cells at $44–60/kWh vs. $81/kWh global
      average — reflects government support, scale, vertical integration, and a 15-year
      learning curve that US manufacturers cannot replicate through technology alone.

      For 24M specifically, the technology licensing model was designed to bypass direct
      manufacturing capital intensity — but this transferred the capital risk to licensees
      rather than eliminating it. The model required licensees to invest in retooling
      manufacturing lines and navigating two-year product validation cycles (the standard
      OEM qualification timeline), without the guarantee of sufficient volume to justify
      the investment. The concentration of commercial validation in Japan (Kyocera) and
      the limited uptake in the US or Europe — despite Volkswagen's strategic investment —
      reflects a structural mismatch between where battery manufacturing capital flows
      (China, Korea, Japan) and where 24M had its deepest commercial relationships (US
      research, Japanese partners, European OEM interest).

      An important disconfirming signal on market attractiveness is Wood Mackenzie's
      scenario analysis (Q2 2025) showing the US utility-scale BESS market could shrink 29%
      in 2026 under a pessimistic policy scenario — and could lose 16 GW of expected
      five-year additions if the investment tax credit were repealed. FEOC restrictions,
      effective from 2026, block battery components tied to Chinese entities from qualifying
      for ITCs. These restrictions create a potential opportunity for non-Chinese cell
      technology licensors (such as SemiSolid) to position US manufacturers for compliance
      — but also demonstrate that policy uncertainty is itself a constraint on investment
      decisions, complicating long-term licensee commitments.
