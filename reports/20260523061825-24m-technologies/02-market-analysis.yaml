  - id: market-context-24m
    title: Market Context for 24M, Evidence Gaps, and Sizing Diligence
    body: >
      24M Technologies operated at the intersection of two adjacent markets: battery
      manufacturing technology licensing (a specialized B2B segment with no publicly
      disclosed TAM) and the grid/residential ESS end market (where Kyocera's 400 MWh/year
      SemiSolid production represents the only documented commercial-scale deployment).
      Market attractiveness — measured by headline TAM growth rates, declining cell prices
      enabling broader adoption, and surging global ESS installations — did not prevent
      the company's closure in March 2026.

      The evidence trail from 24M's closure (MIT Technology Review, Dallas Fed, industry
      experts) consistently points to three structural market constraints that overwhelmed
      the company's favorable technology positioning: (1) the US EV market deceleration
      removing a key commercial anchor for technology licensing, (2) the tightening of
      investor appetite for hardware-intensive startups with multi-year commercialization
      timelines, and (3) the persistent difficulty of translating Asian manufacturing
      ecosystem partnerships (Kyocera, Japan) into a US or European commercial base. Kara
      Rodby of Volta Energy Technologies described 24M as "a great example of something
      that should have been easier" — acknowledging that SemiSolid's relative proximity to
      existing lithium-ion technology (versus solid-state) gave it structural advantages
      that still proved insufficient for commercial sustainability.

      The Freyr gigafactory licensing deal announced in January 2021 — which granted Freyr
      unlimited production rights for a planned 40 GWh Norway plant — was emblematic of
      the gap between market opportunity and commercial execution: Freyr itself subsequently
      underwent financial restructuring, and the Norwegian gigafactory did not proceed as
      planned. The Volkswagen 25% equity stake (January 2022) represented OEM-level
      validation at a time of peak EV market optimism; VW's subsequent pullback from
      aggressive EV timelines across 2023–2025 reduced the strategic urgency of the
      SemiSolid partnership for the automaker's supply chain.

      SAM and SOM for 24M's licensing model remain unquantifiable from public evidence.
      The company did not disclose licensing revenue, royalty rates per GWh of licensed
      production, or the number of active licensees generating recurring payments. The
      diligence path for SAM/SOM estimation would require (a) confirmed GWh-scale production
      from all active licensees, (b) licensing fee structure per GWh or per unit, and (c)
      an industry survey of how many battery manufacturers in the relevant addressable pool
      (outside China) have the capability and willingness to adopt a licensed novel process.
      None of these inputs are available from public sources.

      The closure of 24M should not be interpreted as evidence of market failure in ESS or
      EV batteries — those markets are growing. It should be interpreted as evidence of the
      structural difficulty of the technology licensing model for novel manufacturing processes
      in capital-intensive hardware industries with dominant incumbent processes and fierce
      Asian competition. The market is large and growing; the question was whether 24M's
      specific path through that market was commercially viable — and the answer, by March
      2026, was no.
