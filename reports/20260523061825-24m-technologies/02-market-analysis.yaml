      The eight drivers and constraints listed are not exhaustive but represent the most material forces
      shaping the battery manufacturing market relevant to 24M's technology and business model. The EV
      credit expiration and Chinese price competition are confirmed constraints that directly affected
      24M's commercial environment; the capital intensity constraint is a structural characteristic that
      predates 24M and will persist for any battery manufacturing innovator. The AI/data-center driver
      and EV-to-BESS pivot are the most significant new demand dynamics emerging in 2025–2026, but
      their benefit would accrue to active market participants — not to 24M post-closure.
