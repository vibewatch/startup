  - id: FM004
    title: Technology Licensing Adoption Funnel — SemiSolid Path to Commercial Scale
    type: funnel
    layout: standard
    summary: >
      Five-stage adoption funnel for 24M's technology licensing model, from initial technical
      evaluation through commercial-scale production. Kyocera completed all five stages; most
      other potential licensees did not progress beyond stages 1–2. The funnel illustrates
      why conversion from licensing interest to commercial adoption was the critical constraint.
    data:
      items:
        - label: "Stage 1: Technical Evaluation"
          value: 100
          description: "Battery manufacturer evaluates SemiSolid process vs. incumbent slurry-coat; initial IP assessment and chemistry compatibility check"
          exemplars: "Volkswagen (strategic investor, 2022); Fujifilm (license + $20M investment, 2022); Freyr (license, 2021); Lucas TVS; Asahi Kasei"
        - label: "Stage 2: License Execution"
          value: 60
          description: "Technology license agreement signed; royalty or milestone payment terms established; access to 24M IP and manufacturing know-how"
          exemplars: "Kyocera (license partner since 2020); Fujifilm (license, 2022); Freyr (unlimited license, 2021)"
        - label: "Stage 3: Pilot / Prototype Production"
          value: 30
          description: "Licensee produces pilot cells using SemiSolid process; integration into test products; qualification against OEM or system specs"
          exemplars: "Kyocera (Enerezza prototype and product testing, 2020); Fujifilm (leveraging precision-coating heritage)"
        - label: "Stage 4: Regulatory / Product Qualification"
          value: 15
          description: "Product qualification cycle (~2 years typical for OEM-grade cells); safety certifications; grid interconnection compliance; residential system approvals"
          exemplars: "Kyocera Enerezza (Japan residential qualifications completed by 2020 launch)"
        - label: "Stage 5: Commercial-Scale Production"
          value: 5
          description: "Licensee achieves commercial volume manufacturing; royalties generated; 24M licensing revenue realized; 400 MWh/yr Kyocera target (FY2026)"
          exemplars: "Kyocera only — 400 MWh/yr target by FY2026; JPY 10B Shiga Yasu plant expansion"
    claimRefs:
