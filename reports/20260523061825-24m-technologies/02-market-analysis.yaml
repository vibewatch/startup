  - id: buyer-segmentation
    title: Buyer, User, and Payer Segmentation
    body: >
      Three distinct buyer-payer structures govern the battery markets relevant to 24M,
      each with different procurement cycles, budget ownership, and adoption triggers.

      In the grid-scale and residential ESS market — 24M's primary commercial channel —
      the end buyers are electric utilities, independent power producers, and residential
      customers, but the technology buyer is the system integrator or cell manufacturer
      (such as Kyocera) that licenses the SemiSolid manufacturing process. Kyocera
      manufactures SemiSolid cells and assembles them into its Enerezza residential ESS
      product, which is then sold to Japanese homeowners under Japan's feed-in premium
      program. Kyocera's December 2024 announcement to double SemiSolid production capacity
      to 400 MWh/year by FY2026 — backed by a JPY 10 billion investment in a new production
      line at Shiga Yasu — represents the primary commercial scale-up of 24M's technology.
      The budget owner for this technology decision was Kyocera's corporate strategy and
      manufacturing leadership, not the residential end customer. Adoption was triggered
      by demonstrated commercial success of Enerezza and rising residential storage demand
      in Japan.

      BNEF estimates utility companies own approximately 46% of installed battery storage
      and are the primary buyers of front-of-meter BESS. Front-of-meter systems (63% of
      installed capacity) are procured by utilities and IPPs via competitive tenders or
      bilateral contracts, with procurement driven by grid reliability, renewable integration
      mandates, capacity market revenues, and energy arbitrage economics. Installed utility-
      scale BESS costs range from $210–390/kWh depending on duration and project complexity.
      For 24M, these buyers are one step removed from the licensing conversation: they procure
      from system integrators, not technology licensors.

      The EV battery buyer segment is undergoing radical restructuring. Ford, GM, and Stellantis
      collectively recorded $53+ billion in EV and battery-related write-downs in 2025, then
      pivoted excess battery capacity toward BESS. Ford dissolved its $11.4 billion BlueOval
      SK joint venture with SK On in December 2025 and is repurposing Kentucky battery plants
      for BESS using LFP prismatic cells. GM recorded $6 billion in Q4 2025 write-offs from
      EV pullbacks. Stellantis recorded €22.2 billion in charges linked to EV strategy reversals.
      This reconfiguration means auto OEM battery buyers have shifted from seeking EV-optimized
      NMC technology toward LFP-based BESS production — a shift that, in principle, aligned
      with 24M's chemistry-agnostic LFP-compatible SemiSolid platform, but the commercial
      window did not materialize before the company's closure.

      For a technology licensor, the relevant buyer taxonomy is: (a) battery manufacturers
      seeking to reduce manufacturing costs (primary licensing buyer), (b) OEMs seeking
      differentiated cells and willing to fund partner manufacturers to adopt novel processes
      (strategic investor/buyer), and (c) government-backed battery programmes needing
      domestic technology alternatives (grant and co-investment funding). 24M addressed all
      three: Kyocera and Fujifilm as manufacturing licensees, Volkswagen as an OEM strategic
      investor, and ARPA-E as a government funding source. The fundamental commercial challenge
      was translating this partnership structure into recurring royalty revenues sufficient to
      sustain operations — a structure that, based on the closure outcome, did not achieve
      the required commercial velocity.
