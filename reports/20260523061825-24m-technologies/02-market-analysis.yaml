  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: SAM and SOM for technology licensing
      missingEvidence: >
        24M never disclosed its serviceable addressable market (SAM) or serviceable obtainable
        market (SOM) for the battery manufacturing technology licensing sub-market. No analyst
        report independently quantifies the market for novel battery cell manufacturing process
        licensing. Key missing inputs: number of battery manufacturers globally that are
        addressable licensees (outside China), average licensing fee per GWh of production,
        and 24M's achieved royalty revenue run-rate. Without these, the technology licensing
        TAM/SAM/SOM cannot be derived from public data.
      whyItMatters: >
        SAM/SOM are the most decision-relevant market metrics for evaluating a licensing business
        model. The disconnect between the large global Li-ion TAM and 24M's commercial outcome
        is precisely explained by the inaccessibility of the SAM — the company had a very small
        addressable pool of manufacturing licensees willing to commit to scale-up, and only one
        achieved commercial production. Without SAM/SOM, the market size data cannot explain
        valuation or commercial trajectory.
      diligencePath: >
        Engage battery industry consultancies (Volta Energy Technologies, Benchmark Mineral
        Intelligence) to estimate the market for battery manufacturing process licensing.
        Request licensing revenue data from Branford Group liquidation or any creditor filings.
        Survey battery manufacturers in Japan, Europe, and North America on adoption readiness
        for novel manufacturing processes.
      relatedQuestionRefs:
        - QM009
        - QM010
        - QM001
        - QM026

    - type: missing-source
      severity: material
      topic: Licensee commercial status post-24M closure
      missingEvidence: >
        The current status of all 24M licensees' production plans following the March 2026
        closure is undisclosed. Kyocera's 400 MWh/yr FY2026 target and JPY 10B investment
        were announced in December 2024; whether these plans are proceeding, paused, or
        abandoned post-closure is unknown. Fujifilm's SemiSolid production status is unknown.
        Freyr's unlimited license rights are of uncertain value given Freyr's own restructuring.
      whyItMatters: >
        If Kyocera continues SemiSolid production under its existing license, the technology
        retains a live commercial footprint despite 24M's closure, which affects IP residual
        value. If Kyocera reverts to conventional manufacturing, the commercial validation
        of SemiSolid at scale ends with 24M. This is the single most important post-closure
        market status question.
      diligencePath: >
        Review Kyocera Corporation investor relations filings and quarterly earnings calls for
        any update on Enerezza production plans. Monitor Japanese battery industry trade press
        for Shiga Yasu plant operational status. Contact Kyocera via official investor relations
        channels.
      relatedQuestionRefs:
        - QM023
        - QM024

    - type: conflicting-data
      severity: material
      topic: US BESS market 2026 outlook (optimistic vs. pessimistic scenario)
      missingEvidence: >
        BNEF (October 2025) projected 123 GW / 360 GWh of global storage additions in 2026
        and expressed guarded optimism about the US market after the July 2025 budget bill.
        Wood Mackenzie (Q2 2025, pre-final bill) warned of a 29% contraction in US utility-
        scale BESS in 2026. The reconciliation of these two views is not available; they
        reflect different policy assumption vintages and different market scopes.
      whyItMatters: >
        The US BESS market trajectory directly affects the demand environment into which any
        surviving SemiSolid licensee would sell products and influences the attractiveness of
        the US licensing market for potential technology acquirers of 24M's IP.
      diligencePath: >
        Obtain BNEF and Wood Mackenzie updated US storage outlook reports for H2 2026;
        monitor actual quarterly US storage installation data from ACP/Wood Mackenzie US
        Energy Storage Monitor.
      relatedQuestionRefs:
        - QM015
        - QM025
        - QM022

    - type: stale
      severity: minor
      topic: Freyr and other early licensee status
      missingEvidence: >
        Freyr Battery, which signed a 2021 unlimited-license agreement with 24M for its planned
        40 GWh Norway plant, underwent significant financial restructuring and rebrand. The
        current status of the SemiSolid license within Freyr's restructured operations and
        of its Norway plant plans is not covered in recently retrieved sources.
      whyItMatters: >
        Freyr represented 24M's largest potential scale deployment outside of Asia. Its failure
        to proceed with the Norway gigafactory plan was a significant commercial setback.
        Understanding the current license status has implications for IP valuation.
      diligencePath: >
        Review Freyr's most recent company filings, investor communications, and any Norwegian
        energy industry trade press. Determine whether the unlimited license was terminated,
        transferred, or remains active under restructured Freyr ownership.
      relatedQuestionRefs:
        - QM024
        - QM030

