    reason: >
      SM013 (Mordor Intelligence) is an analyst report where the full data is behind a paywall;
      the source is cited for the specific headline TAM figures ($136B, 21.9% CAGR) that are
      publicly reported in secondary sources and confirmed via web search. The URL was accessed
      and retrieved content that partially confirms the figures. Additional analyst reports
      (Fortune Business Insights, Custom Market Insights) appear in web search summaries with
      consistent data but were not directly fetched; they are cited via the SM013 consolidated
      source entry, which limits independent verification. This is acknowledged as a limitation
      of market sizing data, not a core analytical failure, since the sizing gap for SAM/SOM
      is explicitly preserved in evidenceGaps regardless of the TAM estimates used.
