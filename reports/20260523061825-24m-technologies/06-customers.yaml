callouts:
- id: CU-CALL-01
  type: insight
  title: Kyocera Concentration — Single-Licensee Commercial Dependency
  body: All confirmed royalty revenue flowed from a single licensee (Kyocera) in a single geography (Japan) and a single end-market
    (residential ESS). At 200 MWh/yr and an estimated royalty of USD 3–5/kWh, Kyocera yielded at most ~USD 0.6–1M/yr — structurally
    insufficient for a company with $500M+ raised and a $1.3B valuation. This concentration is the primary commercial de-risking
    failure.
  severity: major
  sourceRefs:
  - SU001
  - SU002
  claimRefs:
  - CU009
  - CU037
- id: CU-CALL-02
  type: insight
  title: FREYR Termination — Model Fragility Signal
  body: FREYR's November 2024 mutual termination of its unlimited SemiSolid license — after 3 years and payment of USD 3M
    plus forfeiture of ~7M preferred shares — is the clearest evidence that the licensing model lacked sufficient stickiness
    to survive partner strategic pivots. No other licensee's commitment was tested comparably, but the exit risk applies to
    all.
  severity: major
  sourceRefs:
  - SU003
  - SU004
  - SU029
  claimRefs:
  - CU035
  - CU036
- id: CU-CALL-03
  type: strength
  title: Kyocera Enerezza — Genuine Commercial Validation at ESS Scale
  body: Kyocera's 2020 Enerezza launch, the 2024 Tanahashi Award, the JPY 10 billion capacity investment, and the TEPCO/ENERES
    VPP integration collectively constitute the only genuine, independently validated commercial proof of SemiSolid technology.
    The technology works at ESS scale in Japan. This does not validate automotive-scale or GWh-scale economics, but it is
    a real deployment.
  severity: positive
  sourceRefs:
