- id: licensee-ecosystem-development
  title: Licensee Ecosystem — Adoption Stages, Development Evidence, and Commercial Gaps
  body: 'Beyond Kyocera, 24M accumulated a portfolio of licensees who represented either geographic coverage (India, Thailand,
    Europe) or technology-segment diversification (automotive, ESS, precision manufacturing). None reached commercial SemiSolid
    cell production before closure.

    **Lucas TVS / TVS Indeon (India):** Lucas TVS signed a license and services agreement with 24M and participated as a Series
    H co-investor. Its subsidiary TVS Indeon began battery pack assembly operations in August 2024 at a 1 GWh facility in
    Thervoy Kandigai, near Chennai, targeting Indian EV and ESS markets. By March 2025, TVS Indeon had scaled to 1,000–1,500
    battery packs per day and announced an additional ₹200 crore R&D investment. Cell manufacturing using 24M''s SemiSolid
    process was stated as a medium-term goal but had not commenced as of early 2026. The gap between pack assembly (using
    procured cells) and SemiSolid cell production (requiring 24M''s proprietary process) represents the critical unfulfilled
    step.

    **Nuovo+/GPSC (Thailand):** Nuovo+ Company Limited — a JV of Arun Plus and GPSC, both within Thailand''s PTT Group — transferred
    its Map Ta Phut industrial-estate battery facility in Rayong, Thailand to 24M in early 2024 for approximately USD 51 million
    in preferred equity. The facility (capacity up to 100 MWh) became 24M Technologies (Thailand) Limited and commenced pilot
    production for an unnamed India-based mobility OEM with validation samples planned for autumn 2024. GPSC''s investor relations
    confirmed a partnership to accelerate next-generation battery technology demonstration. No commercial supply to the unnamed
    OEM was confirmed before 24M''s closure.

    **Fujifilm Corporation (Japan):** Fujifilm invested USD 20 million in convertible notes and received a SemiSolid platform
    license in September 2022, intending to leverage its precision-coating manufacturing capabilities for mass-production
    qualification. No confirmed commercial production or qualification milestone is publicly disclosed as of the research
    anchor date.

    **Volkswagen Group (Europe):** VW acquired a 25% equity stake in January 2022 and was widely reported as the likely recipient
    of Li-metal prototype cells shipped by 24M to a "major global automotive OEM" in October 2024. VW''s PowerCo subsidiary
    has gigafactory programs in Salzgitter (Germany), Sagunto (Spain), and St. Thomas (Canada), but no SemiSolid production
    integration was publicly confirmed at any PowerCo facility. The VW relationship represented the most strategically significant
    potential customer for automotive-scale volume, but its commercial activation was not achieved before closure.

    **FREYR Battery (terminated):** FREYR signed an unlimited SemiSolid license in January 2021 for its planned 40 GWh Clean
    Facility in Norway. By 2023 FREYR had pivoted away from Norwegian gigafactory development, and in November 2024 both parties
    mutually terminated all license and service agreements. FREYR forfeited nearly 7 million Series G preferred shares and
    paid 24M USD 3 million in settlement. The termination was a material adverse signal for the broader licensing thesis.

    '
