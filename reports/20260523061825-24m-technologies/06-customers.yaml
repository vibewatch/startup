  - id: EGU002
    topic: Royalty rates, minimum commitments, and license contract terms for all licensees
    description: 'No royalty rate, minimum production volume, exclusivity provision, or license duration was publicly disclosed
      for any 24M license agreement. Without these, revenue projections, retention durability, and exit risk cannot be independently
      assessed.

      '
    severity: material
    relatedTableRefs:
    - TU002
    - TU004
  - id: EGU003
    topic: Kyocera license survival clause under 24M wind-down
    description: 'Whether Kyocera''s license agreement contains a survival or assignment clause that preserves its production
      rights following 24M''s closure and asset wind-down has not been publicly disclosed. This is the most commercially critical
      disclosure gap.

      '
    severity: material
    relatedTableRefs:
    - TU004
  - id: EGU004
    topic: Fujifilm SemiSolid qualification milestone — confirmed or failed
    description: 'Fujifilm''s USD 20M investment and license were executed in September 2022, but no production qualification
      milestone, confirmation, or adverse update has been publicly disclosed. The absence of public milestones over three
      years is itself an adverse signal warranting direct inquiry.

      '
    severity: material
    relatedTableRefs:
    - TU003
  - id: EGU005
    topic: Volkswagen Group production license confirmation and PowerCo SemiSolid integration plans
    description: 'VW''s 25% equity stake does not confirm a technology production license, and no SemiSolid integration into
      PowerCo factory programs has been publicly confirmed. VW''s post-closure plans for 24M''s IP are unknown.

      '
    severity: material
    relatedTableRefs:
    - TU003
    - TU005
  - id: EGU006
    topic: Developer-signal proxy — no battery engineering community discourse on customer adoption
    description: '24M Technologies is a hardware manufacturing licensing company with no open-source code, API, or developer
      community. No GitHub repos, Stack Overflow tags, or engineering forum discussions about deploying SemiSolid technology
      at customer sites were identified. Battery-news.de (practitioner community media) and USPTO patent records serve as
      the closest available proxy for engineering community validation. Absence of developer discourse is consistent with
      the pre-commercial status of most licensees.

      '
    severity: minor
