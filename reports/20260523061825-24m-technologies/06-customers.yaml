  - id: EGU001
    topic: Named-customer proof table partial coverage — India mobility OEM identity
    description: 'The named customer proof table (TU003) lists the India-based mobility OEM receiving Rayong pilot samples
      as a key customer with partial coverage. The OEM''s identity has not been disclosed in any public communication. A due-diligence
      request to 24M''s estate administrator or to Nouveau+/GPSC is required to identify this customer.

      '
    severity: material
    relatedTableRefs:
