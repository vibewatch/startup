  insight: 24M's commercial journey had a single confirmed "completion" (Kyocera reaching commercial-scale production). All
    other licensees stalled or exited at evaluation, license execution, or pilot stages — revealing that the model's funnel
    was wide at entry but extremely narrow at commercial exit.
  data:
    items:
    - id: jm-awareness
      label: Awareness / Technical Evaluation
      actor: Battery manufacturer or OEM
      description: Prospective licensee learns of SemiSolid technology via industry press, MIT research network, trade shows,
        or direct outreach. Evaluates process compatibility with own manufacturing footprint, chemistry targets, and capex
        assumptions.
      channels:
      - MIT academic network
      - Industry conferences (Japan Mobility Show, CES, Reuters Automotive)
      - Trade press (electrive, batteriesnews, BusinessWire)
    - id: jm-license-execution
      label: License Agreement Execution
      actor: Battery manufacturer or OEM + 24M Business Development
      description: 'License and services agreement signed; upfront fee paid; IP access granted including process documentation,
        know-how transfer, and training. Partners: Kyocera (~2020), FREYR (Jan 2021), Fujifilm (Sep 2022), Lucas TVS (~2024),
        Nuovo+ (Series H lead 2024).'
      channels:
      - Direct B2B negotiation
      - Legal advisors (Tilleke & Gibbins, TTT+Partners)
      - Series H co-investment structure (aligned investor-licensee model)
    - id: jm-pilot-production
      label: Pilot / Qualification Production
      actor: Licensee engineering + 24M process support team
      description: Licensee establishes pilot cell manufacturing line using SemiSolid process tooling and technical support
        from 24M. Produces sample cells for qualification testing against OEM or product specifications. Kyocera passed; Rayong
        pilot commenced for India OEM.
      channels:
      - Licensee's own factory (Kyocera Shiga Yasu; TVS Indeon Tamil Nadu; Rayong Thailand)
      - 24M engineering support and know-how transfer
    - id: jm-regulatory-qualification
      label: Regulatory / Product Qualification
      actor: Licensee + regulatory bodies + OEM quality teams
      description: 'Product qualification against safety, performance, and reliability standards: Japan residential ESS (Kyocera
        Enerezza cleared JIS and PSE certifications); automotive OEM qualification (2–4 year cycle; no confirmed completion
        beyond Kyocera).'
      channels:
      - Japanese regulatory bodies (Kyocera)
      - Automotive OEM quality programs (VW, India OEM — not confirmed)
    - id: jm-commercial-production
      label: Commercial-Scale Production
      actor: Licensee manufacturing operations
      description: 'Licensee achieves commercial volume manufacturing; SemiSolid cells produced at scale; 24M receives per-unit
        or per-kWh royalties. Only Kyocera confirmed at this stage: 20,000 units/yr (200 MWh/yr) and growing toward 400 MWh/yr
        target.'
      channels:
      - Kyocera Shiga Yasu plant (confirmed)
      - Kyocera sales and distribution (Japan residential, 152-country network)
    - id: jm-expansion-renewal
      label: Expansion and License Renewal
      actor: Licensee + 24M account management
      description: Successful licensee expands capacity, enters new geographies, or licenses additional 24M platforms. Kyocera
        announced JPY 10B doubling; awarded Tanahashi Award; integrated into TEPCO/ENERES VPP. No other licensee reached this
        stage.
      channels:
      - Licensee strategic planning
      - Utility/VPP partnerships (TEPCO, ENERES)
      - New product-line licensing (ETOP, Eternalyte, Impervio add-ons)
