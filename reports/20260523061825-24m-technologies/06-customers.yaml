- id: kyocera-commercial-anchor
  title: Kyocera — The Sole Commercial-Scale Licensee and ESS Customer Anchor
  body: 'Kyocera Corporation is the only licensee confirmed to have manufactured and commercially sold a battery product using
    24M''s SemiSolid technology at scale. Kyocera launched the Enerezza residential ESS in Japan in 2020, making it the world''s
    first commercial SemiSolid battery product. By December 2024, Kyocera had an annual production capacity of 20,000 Enerezza
    units (approximately 200 MWh/yr) at its Shiga Yasu manufacturing facility and announced a JPY 10 billion (~USD 67 million)
    investment to double capacity to approximately 400 MWh/yr by FY2026.

    In March 2024, Kyocera and 24M jointly received the Electrochemical Society of Japan''s Technology Award (Tanahashi Award)
    for the practical commercialization of SemiSolid lithium-ion battery cells in the Enerezza system — the only external
    third-party quality or commercial recognition received by any 24M licensee.

    Kyocera''s Enerezza batteries are also integrated into virtual power plant (VPP) aggregation programs in Japan. Tokyo
    Electric Power Company (TEPCO) and energy management firm ENERES have conducted home-battery aggregation pilots using
    Enerezza units, remotely controlling household storage for grid demand-response balancing. Kyocera''s distribution network
    spans 152 countries, suggesting latent potential beyond Japan — but no confirmed Enerezza deployments outside Japan are
    evidenced.

    The quality of Kyocera''s customer evidence is significantly stronger than any other 24M partner: production volume is
    confirmed (20,000 units/yr), capacity investment has been publicly announced (JPY 10 billion), product is commercially
    available and named, and the Tanahashi Award provides independent third-party validation. The relationship is a genuine
    commercialization, not a pilot or promise.

    However, Kyocera''s December 2024 capacity doubling announcement came less than three months before 24M entered closure
    proceedings in March 2026. Whether Kyocera''s FY2026 400 MWh/yr target was achieved, and whether its license agreement
    survives 24M''s wind-down, are open questions as of the research anchor date.

    '
