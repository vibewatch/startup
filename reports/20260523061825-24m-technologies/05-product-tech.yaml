    title: 24M SemiSolid Product Architecture — Technology Stack
    type: stack
    layout: standard
    summary: >
      Layered technology stack showing how the SemiSolid electrode foundation supports four additional
      proprietary platforms, from the base manufacturing process through end-of-life recycling.
