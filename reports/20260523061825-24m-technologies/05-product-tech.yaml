    - id: CE039
      statement: >
        None of 24M's gigafactory-scale licensees — FREYR Battery (Norway and US), Lucas TVS (India),
        or Axxiva (China) — reached commercial production using 24M technology. FREYR terminated both
        licenses in November 2024 without deploying any SemiSolid factory, forfeiting $3 million in
        services settlement and its equity stake. The asset-light model concentrated execution risk
        entirely with licensees, and no licensee had both the capital and the market conditions to build
        at scale during 24M's operational period.
