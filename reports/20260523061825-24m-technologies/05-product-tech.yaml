  - id: performance-technical-validation
    title: Performance Claims and Technical Validation Evidence
    body: >
      24M's most credible performance evidence comes from its SemiSolid LFP cell cycling data presented at the
      NAATBatt 2023 ARPA-E session. A 5.5 Ah LFP/graphite pouch cell built in 2014 accumulated more than 7,000
      cycles at 25°C with minimal capacity decay, with cycle-life projections exceeding 10,000 cycles at 75%
      retention. A 110 Ah production-intent prismatic cell built in 2018 showed better capacity retention after
      2,500 cycles than the 5.5 Ah cell, projecting >13,000 cycles at 75% retention. These figures substantially
      exceed grid-storage requirements and match or exceed leading commercial LFP cells from CATL.

      The Impervio separator's abuse-tolerance claims are supported by 24M's published video and test data released
      in October 2024, showing real-time comparison of overcharged cells with and without Impervio. The 24M internal
      test also demonstrated that contamination of the cathode with ~1% stainless steel — a realistic manufacturing
      defect — caused the baseline cell to short immediately after formation, while the Impervio cell suppressed the
      resulting metallic dendrite and surpassed 800 cycles with >83% capacity retention.

      The 1,000-mile (1,600 km) range EV battery claim, a combination of ETOP+Eternalyte+SemiSolid, is a
      company-projected target rather than demonstrated product. Fast Company covered 24M's articulation of
      a goal to produce a 1,000-mile battery; MIT Technology Review noted this goal but characterised 24M's closure
      as a case where "it should have been easier" — implying even relatively accessible innovations could not
      bridge the commercial execution gap. No independent third-party cell-level test of ETOP cells or Eternalyte
      cells in a production-representative configuration has been publicly released.
