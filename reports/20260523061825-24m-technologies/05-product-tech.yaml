  - id: deployment-and-commercialization-gap
    title: Manufacturing Scale, Deployment Record, and Commercialization Gap
    body: >
      The only commercial-scale deployment of any 24M technology is Kyocera's Enerezza residential energy-storage
      system in Japan, launched in 2020. Kyocera operates an annual capacity of approximately 20,000 units (≈200
      MWh/yr) at its Shiga Yasu plant and announced in December 2024 a JPY 10 billion investment to double capacity
      to 400 MWh/yr by FY2026. Kyocera and 24M jointly received the 2024 Electrochemical Society of Japan
      Tanahashi Award for the practical commercialisation of SemiSolid batteries — the only industry award 24M
      received for a production-scale application. This constitutes the sole evidence that SemiSolid manufacturing
      works at commercial scale, albeit at 200–400 MWh/yr rather than the gigawatt scale required for automotive
      applications.

      The Rayong, Thailand pilot facility — a 71,000 square-foot, 100 MWh-capacity plant acquired from Nuovo+ in
      August 2024 — was intended to demonstrate commercial-scale processes and validate ETOP, Impervio, and LiForever
      for global partners. 24M commenced pilot production at Rayong for an unnamed India-based mobility OEM and
      planned to deliver validation samples in fall 2024. The facility's status after the March 2026 closure is
      unknown; no public report confirms whether it was transferred, auctioned, or wound down.

      Beyond Kyocera, no 24M licensee reached commercial-scale production. FREYR Battery terminated both its
      Norway and US licenses in November 2024 without deploying any SemiSolid factory, forfeiting $3 million in
      settlements and its equity stake. Volkswagen Group, holding 25% equity, established no commercial SemiSolid
      production despite its 2022 investment. Fujifilm, Lucas TVS, and Axxiva disclosed no commercial deployments.
      The structural risk of 24M's asset-light licensing model — that commercial execution depended entirely on
      partners who controlled their own capital, timelines, and manufacturing ramp — proved fatal when EV market
      sentiment cooled, funding tightened, and licensees retreated.

      MIT Technology Review characterised 24M's March 2026 closure as emblematic of a broader contraction: the
      battery startup funding boom had ended, investors had retreated to "safer bets," and even innovations designed
      to work within existing lithium-ion supply chains could not survive the execution gap between laboratory
      promise and gigawatt-scale manufacturing. Kara Rodby, technical principal at Volta Energy Technologies,
      described it as "a great example of something that should have been easier." 24M issued no public statement
      at closure, and co-founder Chiang declined to speak on the record.
