company:
  name: 24M Technologies
chapter:
  number: 5
  title: Product & Technology
  summary: >
    24M Technologies built a five-platform battery technology suite centred on its SemiSolid™ manufacturing process —
    a binder-free, solvent-free electrode architecture in which thick, gel-like electrode slurry is cast directly onto
    current-collector foil, eliminating conventional drying, calendering, and NMP-solvent-recovery steps. The company
    claimed 40–65% lower capital expenditure, 30–40% smaller factory floor area, and up to 40% lower per-cell
    manufacturing cost versus conventional slurry coating. Around the SemiSolid core, 24M layered four further
    innovations: (1) ETOP™ (Electrode-to-Pack), which eliminates individual cell and module structures and achieves
    up to 80% electrode volume fraction versus 30–60% in conventional packs; (2) Eternalyte™, a next-generation
    liquid electrolyte with ~26 mS/cm ionic conductivity and >80% capacity retention at −20°C; (3) Impervio™, a
    separator that suppresses dendrite propagation and enables real-time fault detection before thermal runaway;
    and (4) LiForever™, a direct-material recycling process that recovers active materials without creating black
    mass. The IP estate covered 700+ patents and applications rooted in foundational MIT research by Yet-Ming Chiang
    and colleagues. The only technology to reach commercial scale was the SemiSolid electrode, deployed by Kyocera
    in its Enerezza residential ESS in Japan (≈200 MWh/yr by 2024, with a JPY 10 billion plan to reach 400 MWh/yr).
    No automotive OEM, and none of 24M's other licensees, deployed any SemiSolid technology at commercial scale before
    the company's March 2026 shutdown. Impervio, Eternalyte, ETOP, and LiForever all remained at prototype or pilot
    stage. The gap between compelling technical claims and constrained commercial validation is the central diligence
    finding: the platform's technical promise was real and peer-reviewed, but its manufacturing scalability at gigawatt
    scale was never proven.

sections:
  - id: semi-solid-platform
    title: SemiSolid™ Manufacturing Platform — Core Architecture and Process
    body: >
      24M Technologies originated from MIT professor Yet-Ming Chiang's observation that conventional lithium-ion
      battery manufacturing — derived from magnetic-tape production adapted in the late 1980s — was unnecessarily
      complex. The standard process involves slurry mixing, slot-die or doctor-blade coating, solvent drying, NMP
      recovery, calendering, slitting, and notching before cell assembly; 24M's SemiSolid platform removes the
      drying, calendering, and solvent-recovery steps by using the electrolyte itself as the processing solvent.

      In the SemiSolid process, a thick, gel-like suspension of active material particles (LFP, NMC, NCA, graphite)
      is mixed directly with conductive carbon and liquid electrolyte, then cast onto current-collector foil (copper
      for anode, aluminium for cathode) without any binder or additional solvent. Because no drying or calendering is
      required, the process is solvent-free and eliminates capital-intensive drying ovens and NMP recovery systems.
      The resulting electrodes are substantially thicker than conventional designs: 24M's ARPA-E presentation
      documents area capacity of 6–12 mAh/cm² versus the conventional 2–4 mAh/cm². Thicker electrodes reduce the
      proportion of inactive materials (copper foil, aluminium foil, separator, packaging) to more than 80% below
      conventional levels. The "soft" design also imparts exceptional abuse tolerance — cells continue to function
      mechanically after puncture or deformation without the sharp failure modes of fully solid electrodes.

      Company-reported manufacturing economics claim 40–65% capital expenditure reduction and 30–40% floor-space
      reduction versus a conventional gigafactory line, plus up to 40% lower per-cell manufacturing cost. These
      figures appear on 24M's LiForever datasheet and the Rayong facility press release and were corroborated by
      MIT News coverage of the platform in October 2022. Independent analysts have noted that the thick-electrode
      approach creates its own scalability challenges: slurry viscosity management, coating uniformity at high speed,
      and electrolyte wetting of thick porous structures are process-engineering problems that intensify as electrode
      loading increases, and none has been fully resolved at gigawatt-scale throughput as of 2026.

      The SemiSolid platform is chemistry-agnostic: the same manufacturing equipment can run LFP, NMC811, NCA,
      silicon-dominant, lithium-metal, and sodium-metal electrode formulations by changing only the slurry
      composition. This architecture is the foundation on which all other 24M product platforms — ETOP, Impervio,
      Eternalyte, and LiForever — are layered.
