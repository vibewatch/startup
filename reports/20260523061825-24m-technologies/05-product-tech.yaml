  - id: TE002
    title: Manufacturing Process Comparison — SemiSolid vs Conventional and Alternatives
    columns:
      - Process Attribute
      - Conventional Slurry Coating (Li-ion)
      - 24M SemiSolid™
      - Dry Electrode (e.g., Maxwell/Tesla)
      - Solid-State (e.g., QuantumScape)
    rows:
      - - Electrode binder
        - NMP-soluble PVDF binder required
        - No binder; electrolyte as processing solvent
        - PTFE dry binder (calendered)
        - None (ceramic solid electrolyte layer)
      - - Solvent / drying step
        - NMP solvent; energy-intensive drying oven; NMP recovery required
        - No solvent; no drying oven; direct cast
        - No liquid solvent; cold/hot press calendering
        - No liquid solvent in solid electrolyte layer
      - - Electrode thickness / area capacity
        - ~2–4 mAh/cm² (thin for rate performance)
        - 6–12 mAh/cm² (thicker; higher energy density)
        - 3–6 mAh/cm² (moderate thickness)
        - Variable; ultra-thin for solid electrolyte interface
      - - Capex intensity
        - Baseline (100%)
        - Claimed 35–60% of baseline (40–65% reduction)
        - Estimated 60–75% of baseline (less mature at scale)
        - Significantly higher (novel materials, clean-room fabrication)
      - - Commercial scale validated
        - Yes — industry standard; CATL, LG, Samsung SDI at 100+ GWh/yr
        - Partially — Kyocera at 200–400 MWh/yr; no automotive GWh scale
        - Partial — Maxwell/Tesla integration announced; not full gigafactory
        - No — remains pre-commercial across all suppliers as of 2026
    claimRefs:
