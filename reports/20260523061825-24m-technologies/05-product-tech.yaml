    - id: CE040
      statement: >
        Independent technical analysis of thick-electrode SemiSolid-style architectures highlights three
        unresolved scalability challenges at gigafactory throughput: (1) slurry viscosity management —
        highly loaded suspensions become paste-like and resist uniform high-speed coating; (2) electrode
        wetting — thick electrodes require longer electrolyte infiltration times, limiting line speed;
        (3) coating uniformity — particle distribution inhomogeneities at scale lead to localised
        capacity loss and reduced yield. These challenges are acknowledged in peer-reviewed literature
        but are not quantified specifically for 24M's proprietary formulation.
      topic: deployment-and-commercialization-gap
      type: third-party-reported
      confidence: medium
      freshness: current
      sourceRefs:
        - SE009
        - SE017
      answersQuestionRefs:
        - QE017
        - QE026

