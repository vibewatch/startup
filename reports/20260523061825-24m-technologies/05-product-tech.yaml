  claims:
    - id: CE001
      statement: >
        The SemiSolid™ manufacturing process uses a thick, gel-like suspension of active material particles
        (LFP, NMC, NCA, graphite) mixed directly with conductive carbon and liquid electrolyte, then cast onto
        current-collector foil without any organic binder or additional solvent — using the electrolyte as the
        processing solvent. This eliminates the drying and calendering steps required in conventional slurry
        coating, which uses NMP (N-methyl-2-pyrrolidone) as a solvent that must be evaporated and recovered.
      topic: semi-solid-platform
      type: company-claimed
      confidence: high
      freshness: current
      sourceRefs:
        - SE003
        - SE010
      answersQuestionRefs:
        - QE001
        - QE002

    - id: CE002
      statement: >
        24M claims the SemiSolid process reduces manufacturing steps by approximately 50% versus conventional
        lithium-ion production: eliminating slurry mixing with NMP, electrode drying (the largest energy consumer
        in a conventional line), NMP solvent recovery, and calendering, while retaining electrode stacking,
        electrolyte fill, packaging, and formation/aging.
      topic: semi-solid-platform
      type: company-claimed
      confidence: high
      freshness: current
      sourceRefs:
        - SE003
        - SE022
      answersQuestionRefs:
