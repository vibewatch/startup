  evidenceGaps:
    - id: EGE001
      topic: Automotive OEM deployment — why no commercial SemiSolid EV batteries despite licensing
      type: private-evidence-only
      severity: material
      description: >
        Commercial and technical reasons for VW, FREYR, Lucas TVS, and Axxiva's failure to deploy
        SemiSolid technology at commercial scale are not publicly disclosed. FREYR's mutual termination
        agreement cites services settlement but not technical failure. VW's wind-down of SemiSolid
        co-development has not been publicly explained. Specific capex cost-model validation, yield
        performance data from partner trials, and internal OEM evaluation reports are all private.
      relatedQuestionRefs:
        - QE018

    - id: EGE002
      topic: FREYR technical and commercial reasons for license termination
      type: private-evidence-only
      severity: material
      description: >
        FREYR Battery's November 2024 termination of both 24M licenses was disclosed via SEC filing
        and press, but FREYR provided no technical explanation. Whether the decision was driven by
        manufacturing yield limitations, equipment integration problems, capex recalculation, or
        purely strategic business reasons (FREYR's own pivot to solar modules) cannot be determined
        from public sources. 24M's side of the technical assessment is also not disclosed.
      relatedQuestionRefs:
        - QE019

    - id: EGE003
      topic: Rayong Thailand facility post-closure status and IP estate disposition
      type: missing-source
      severity: material
      description: >
        The Rayong, Thailand pilot facility was 24M's only owned manufacturing asset at closure.
        Whether it was transferred to Nuovo+, included in the June 2026 US equipment auction,
        sold separately, or remains operational under a successor entity is unknown as of 2026-05-23.
        Similarly, the disposition of 24M's 700+ patent portfolio — whether sold, licensed, or held
        by the wind-down estate — has not been publicly reported.
      relatedQuestionRefs:
        - QE015
        - QE025
