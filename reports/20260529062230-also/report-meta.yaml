companyProfile:
  summary: >
    Also is a Palo Alto-based small-EV company founded as a Rivian spinout in March 2025. The company
    originated as an internal Rivian skunkworks project ("Project Inder") launched in 2022 and was separated
    as a standalone entity with $105 million from Eclipse. Rivian retained a substantial minority stake
    and RJ Scaringe serves as board chair. Chris Yu, formerly Rivian's VP of Future Programs and earlier
    at Specialized Bicycles, leads the company as President and Co-Founder. Also's flagship TM-B is a
    Class 3 e-bike featuring the proprietary DreamRide pedal-by-wire propulsion system, priced at $3,500–$4,500,
    with deliveries planned for 2026. The TM-Q cargo-and-family quad and an autonomous delivery robot
    (Alpha Wave) complete the product roadmap. A DoorDash commercial partnership announced in March 2026
    anchors the commercial/delivery use case. By March 2026, Also had raised $305 million total across
    the Eclipse seed, Greenoaks Series A, and a $200 million Series C co-led by Greenoaks and Prysm Capital.
