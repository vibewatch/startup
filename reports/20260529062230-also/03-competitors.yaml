- id: substitutes-fleet-and-scale-pressure
  title: Substitutes, Fleet Alternatives, and Scale Pressure Outside the Direct Bike Set
  body: The substitute threat becomes more serious once the buyer is not a pure consumer. Bird and Lime let riders consume short-trip mobility without owning a vehicle, which is attractive for occasional or city-centered use. The status-quo alternative can be even simpler — keep using a conventional bicycle for low-cost local trips, keep using a car when weather, range, or carrying requirements dominate, or keep dispatching commercial delivery vans already embedded in fleet operations. Lime’s IPO filing shows that shared micromobility can reach very real revenue scale, even if balance-sheet quality remains mixed. For a fleet or local-commerce buyer, DoorDash-scale delivery volumes and shared-operator economics matter far more than whether a rival commuter bike has better styling. NIU broadens the threat further because it spans electric motorcycles, mopeds, bicycles, e-bikes, and kick-scooters through omnichannel distribution. That kind of breadth can pressure small-EV economics and dealer access even if the product form factor is not identical to Also’s. Also’s delivery-vehicle push therefore gives it upside, but it also moves the company into tougher comparison sets where uptime, parts logistics, and route economics matter more than premium branding. The right read is that commercial optionality increases TAM relevance while also exposing Also to stronger execution tests than the consumer-bike market alone would impose.
