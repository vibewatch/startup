company:
  name: Also
chapter:
  number: 3
  title: Competitors
  summary: 'Also’s competitive set is layered: direct premium and connected e-bike peers such as Rad Power, Cowboy, Ampler, and Urtopia; premium incumbents such as Specialized and Trek with stronger dealer/service trust; and adjacent substitutes ranging from Lime and Bird to conventional bikes, private cars, and commercial delivery vans. Also’s edge is modularity, software-defined drive-by-wire control, strong design, and a consumer-to-commercial/autonomous bridge through TM-Q. The problem is that rivals and status-quo options often look safer on price, service density, or operating proof, while VanMoof, Bird, and Rad Power show how quickly proprietary-bike excitement can collapse into service and capital stress.'
sections:
- id: landscape-and-solution-classes
  title: 'Landscape: Direct Peers, Substitutes, and Adjacent Small-EV Classes'
  body: 'The competitive set is broader than a simple list of bike brands. Also’s closest direct peers are premium or connected consumer e-bike companies that sell ownership, design, and software experience into the same urban short-trip budget: Rad Power, Cowboy, Ampler, and Urtopia. But the premium-incumbent lens matters too. Specialized and Trek are not selling Also’s drive-by-wire architecture, yet they already own rider trust, shop-floor fit service, and dealer-backed repair surfaces that can make a safer premium alternative look more rational than a newer software-defined platform. Adjacent substitutes matter just as much. Lime and Bird compete for the same urban trip without ownership, NIU and similar small-EV OEMs compete through breadth and channel reach, and the default fallback can still be a conventional bicycle, a private car, or an already-deployed delivery van. Also’s own TM-Q and DoorDash work widen the frame again: for commercial buyers, the relevant alternative is whatever lowers cost per route, improves utilization, and can survive operational abuse. That is why this chapter treats the market as overlapping solution classes rather than pretending that one comparator table alone explains the buyer decision.'
