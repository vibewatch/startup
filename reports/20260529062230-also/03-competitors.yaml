- id: TP001
  title: Competitor profile table
  columns:
  - Competitor / class
  - Category
  - Scale / funding signal
  - Target segment
  - Differentiation
  - Limitation vs Also
  rows:
  - - Also
    - Premium connected e-bike + quad small EV
    - Current funding disclosed elsewhere; public service density still emerging
    - Premium consumer and selected fleet buyers
    - Software-defined ride architecture plus quad optionality
    - Scale and service proof still limited in public record
  - - Rad Power Bikes
    - Lower-priced utility / cargo e-bikes
    - 450,000+ customers; claims North America largest electric-bike brand
    - Utility, cargo, family, and entry-price buyers
    - Breadth, lower prices, retail and service channels
    - Recent bankruptcy and sale show structural fragility
  - - Cowboy
    - Connected urban e-bike specialist
    - Refurbished channel and mature app-led ownership positioning
    - Urban design- and software-oriented riders
    - GPS, crash detection, adaptive power, strong connected story
    - Narrower use-case range and less cargo/fleet optionality
  - - Ampler
    - Lightweight urban commuter e-bikes
    - Leasing and test-ride motion; premium but design-led
    - Commuters who value lightness and simplicity
    - USB-C charging and low-gimmick urban positioning
    - Less obvious cargo or fleet bridge
  - - Urtopia
    - Feature-rich carbon e-bikes
    - 1,000+ bike shops claim and broad smart-feature message
    - Premium riders wanting smart features and light weight
    - Carbon, AI, GPS, UL-certified narrative
    - Crowded spec-sheet competition can compress differentiation
  - - Bird / Lime
    - Shared micromobility operators
    - Hundreds of cities for Bird; Lime at $886.7M 2025 revenue across 230 cities and 29 countries
    - Short-trip riders and city programs
    - Access without ownership and high urban convenience
    - Economics and public-market durability remain uneven
  - - Specialized / Trek
    - Premium incumbent bike brands
    - Entrenched premium-bike brands with dealer and service trust
    - Design-conscious riders who prioritize brand confidence and fit support
    - Brand equity, in-person retail, and service confidence
    - Less differentiated than Also on modularity, drive-by-wire, and commercial angle
  - - NIU
    - Volume urban-mobility OEM
    - Broad vehicle catalog and omnichannel sales model
    - Global two-wheel and micro-mobility buyers
    - Vehicle-class breadth and channel scale
    - Not a like-for-like premium ownership brand
  - - VanMoof (historical lesson)
    - Premium proprietary e-bike brand
    - About 200,000 bikes sold before bankruptcy
    - Premium urban riders
    - Design-led connected bikes with strong brand identity
    - Bankruptcy showed repair and app dependence risks
  - - Conventional bikes / acoustic cargo bikes
    - Status-quo two-wheel substitute
    - Existing bikes need no new financing, app onboarding, or service learning curve
    - Riders prioritizing low cost, exercise, or repair simplicity
    - Cheapest ownership path and easy repairability
    - Do not match Also on assist, software, or higher-speed utility
  - - Private car ownership
    - Status-quo urban transport substitute
    - Already-installed household vehicle and parking routines
    - Riders prioritizing weather protection, range, or passenger carrying
    - Familiarity, all-weather utility, and no new mobility workflow
    - Much higher cost and weaker fit for short urban trips
  - - Commercial delivery vans
    - Status-quo fleet substitute
    - Existing fleet tools, route processes, and cargo standards
    - Merchants or operators optimizing for route density and uptime
    - Proven carrying capacity and operational familiarity
    - Higher operating cost and less bike-lane / curb-access flexibility
  notes: Scale/funding signals are intentionally uneven because public disclosure varies widely by competitor class. Where hard figures are absent, the table names only the defensible public signal rather than guessing.
