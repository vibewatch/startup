- id: adverse-competitor-evidence
  title: 'Adverse Competitor Evidence: What VanMoof, Bird, and Rad Power Say About Category Risk'
  body: The adverse evidence matters because this category has repeatedly shown that a compelling product story is not enough. VanMoof is the clearest cautionary tale for premium proprietary systems. AP and TechCrunch both show a company with roughly 200,000 bikes sold and global brand stores, yet bankruptcy still translated into halted repairs, paused refunds, app dependence, and uncertainty for owners because proprietary parts and software made normal repair channels difficult. Bird is the public-markets cautionary tale. TechCrunch documents its Chapter 11 filing after delisting, layoffs, and collapsing market value, while The Verge argues the failure reflected unsustainable capital and pricing discipline more than a lack of consumer demand for shared micromobility itself. Rad Power is the direct-to-consumer e-bike cautionary tale. TechCrunch, GeekWire, and Electrek together show a business that once looked dominant, then filed for Chapter 11, saw revenues fall sharply, and ultimately
    sold core assets at a fraction of peak valuation. The takeaway for Also is not that the market is fake. It is that service, warranty, capital structure, and operational discipline can be more decisive than design buzz or early category leadership. That is the right frame for judging moat durability in 2026.
