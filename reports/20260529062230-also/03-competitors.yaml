- id: TP005
  title: Adverse competitor evidence table
  columns:
  - Case
  - What failed or broke
  - Source-backed signal
  - Why it matters for Also
  - Open diligence question
  rows:
  - - VanMoof
    - Premium proprietary e-bike brand entered bankruptcy
    - Repairs halted, refunds paused, app and parts dependence created owner risk
    - Proprietary systems can become liabilities if service resilience is weak
    - How repairable is Also outside company-controlled channels?
  - - Bird
    - Public shared-micromobility pioneer filed Chapter 11
    - Delisting, layoffs, and weak public-market economics preceded bankruptcy
    - Shared-fleet demand can be real even while individual operators fail financially
    - Can Also avoid capital-structure stress if it leans into fleets?
  - - Rad Power Bikes
    - Former category leader filed Chapter 11 and sold assets
    - Revenue fell sharply and asset sale value was far below peak valuation
    - Direct-to-consumer e-bike scale alone does not prevent financial collapse
    - What does Also’s downside margin and inventory model look like?
  - - Lime
    - Scaled operator still flagged going-concern risk in IPO filing
    - Revenue growth came with debt and liquidity concerns
    - Even category winners can carry heavy balance-sheet risk
    - What level of external capital does Also need before cash generation is credible?
  notes: These adverse cases are not direct one-for-one analogies. They are category stress tests showing where design-led or growth-led narratives historically broke down.
