- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Main threat
  - Severity
  - Why the threat is credible
  - Mitigation / diligence ask
  rows:
  - - Software-defined ride feel
    - Connected-bike specialists can match software narratives
    - medium
    - Cowboy and Urtopia already sell connectivity and smart features
    - Ask for retention, NPS, and feature-usage data versus peers
  - - Quad optionality
    - Fleet buyers may still prefer more proven delivery economics or larger OEMs
    - high
    - Commercial operators optimize around uptime and cost-per-route, not novelty
    - Request live pilot results and contract conversion data
  - - Partner service network
    - Service density may trail peers or fail at scale
    - high
    - VanMoof shows how service fragility can destroy trust; Rad and Urtopia highlight wider support surfaces
    - Obtain current partner roster, SLA metrics, and parts-availability data
  - - Premium brand positioning
    - Lower-priced utility brands can compress willingness to pay
    - medium
    - Rad offers cargo and utility coverage well below Also’s current pricing
    - Validate why buyers pay up and when they trade down
  - - Delivery partnership narrative
    - A single named partner can overstate actual competitive position
    - medium
    - DoorDash scale is real, but rollout specifics remain undisclosed
    - Request signed scope, pilot geographies, and deployment timing
  - - Category momentum
    - Capital destruction can spook buyers, investors, and suppliers
    - high
    - Bird, VanMoof, Lime, and Rad all show balance-sheet or category-discipline risk
    - Stress-test capital needs, warranty reserves, and downside funding plans
  - - Dealer-backed premium incumbency
    - Specialized and Trek can win on trust, fit, and repair confidence rather than novelty
    - high
    - Buyers often pay for known brands when reliability and service access matter more than architecture novelty
    - Test close rates against incumbent dealer options and document actual service SLAs
  notes: Severity reflects likely impact on durability, not certainty of failure. Several threats are execution-driven and can be mitigated if internal data are strong.
