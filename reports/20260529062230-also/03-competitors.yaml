  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: win-loss
    missingEvidence: Named customer wins, losses, and conversion rates showing how Also performs against specific peers.
    whyItMatters: Competitive positioning is much stronger when it is backed by actual sales outcomes rather than only product comparison.
    diligencePath: Request CRM win/loss notes, retailer conversations, and any competitive battle cards used in fundraising or sales.
    relatedQuestionRefs:
    - QP023
    - QP025
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: fleet-pricing
    missingEvidence: Actual pricing, discounting, and support obligations for TM-Q or fleet-oriented Also deployments.
    whyItMatters: Commercial competitive pressure is impossible to price correctly from public consumer pages alone.
    diligencePath: Request draft fleet pricing sheets, pilot contracts, and support SLAs for commercial accounts.
    relatedQuestionRefs:
    - QP010
    - QP025
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: service-sla
    missingEvidence: Repair turnaround, parts availability, and warranty performance for Also versus competitors.
    whyItMatters: VanMoof shows how service fragility can destroy a premium brand even when product appeal is high.
    diligencePath: Request current service metrics, warranty reserves, and partner network performance by region.
    relatedQuestionRefs:
    - QP014
    - QP021
    - QP025
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: minor
    topic: private-peer-scale
    missingEvidence: Recent funding, sell-through, or gross-margin data for private peers such as Cowboy, Ampler, and Urtopia.
    whyItMatters: Without current scale data, competitive rankings remain more qualitative than financial.
    diligencePath: Gather investor decks, recent financing announcements, or management interviews for the private set.
    relatedQuestionRefs:
    - QP004
    - QP023
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: delivery-rollout
    missingEvidence: Named pilot geographies, vehicle specs, and deployment timing for Also’s delivery-vehicle program.
    whyItMatters: The fleet wedge matters to the moat argument, but current public evidence proves intent more than scaled execution.
    diligencePath: Request partner rollout calendars, pilot KPIs, and technical specs for the delivery configuration.
    relatedQuestionRefs:
    - QP022
    - QP025
    relatedTableRefs:
    - TP005
