callouts:
- calloutType: risk
  title: Premium pricing and proprietary architecture are compelling differentiators, but they are still the least-proven consumer bet in the file
  body: The product can be admired and still be risky. Also’s price band, pedal-by-wire architecture, OTA-heavy control layer, and modular hardware may create an excellent experience, but they also create the exact combination that can fail if conversion is shallow or service economics turn ugly.
  claimRefs:
