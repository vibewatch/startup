- calloutType: risk
  title: 2026 regulation makes battery and classification proof non-optional
  body: This is no longer a generic “watch regulation” footnote. Federal battery scrutiny, CPSC hazard data, and active state work on micromobility classification all mean Also must show concrete compliance and launch-boundary discipline before investors should credit scale narratives.
  claimRefs:
  - CR005
  - CR006
  - CR007
  - CR058
  - CR059
  - CR060
- calloutType: recommendation
  title: Underwrite only after certification, first deliveries, service KPIs, and a second commercial proof point are visible
  body: The decision rule should stay strict. If Also cannot show battery-compliance evidence, shipped-unit proof, launch-market service metrics, and commercial traction beyond DoorDash, then the right stance is to value the upside as optional rather than assume the risks are already solved.
