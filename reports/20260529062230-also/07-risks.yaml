- id: manufacturing-supply-chain-and-capital-risk
  title: Manufacturing, supply-chain, and capital-intensity risk stay high because the public record is still reservation-led rather than operations-led
  body: 'Also’s reservation language is unusually explicit that enthusiasm and readiness are not the same thing. The company says there is no guaranteed delivery date, that manufacturing may not have begun, and that queue priority depends on manufacturing schedule plus delivery and service operations availability. Public manufacturing counterparties are still undisclosed, which makes tariff, single-source, landed-cost, and quality-risk analysis incomplete. This matters more because the company is not scaling a simple commodity bike: it is scaling batteries, service logistics, custom architecture, and commercial variants while still pre-revenue from the standpoint of visible public delivery proof. Category history shows how dangerous that can be. Rad Power’s bankruptcy exposed tariff and battery-liability stress; Bird’s bankruptcy showed how quickly micromobility narratives can reverse; Lime’s filing shows even larger operators can carry debt, liquidity strain, and partner concentration at
    scale. Rivian lineage and large fundraising help, but Rivian’s own shareholder letter is a reminder that the broader ecosystem still worries about additional financing, suppliers, tariffs, safety standards, permits, and concentration. So mitigation maturity is only medium, residual exposure is high, and the principal diligence asks are supplier concentration, landed-cost sensitivity, burn and runway by ramp scenario, and warranty reserve planning.'
