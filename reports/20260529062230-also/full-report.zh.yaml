      - number: '8.3'
        title: 上市可比公司框架和乐观 / 基准 / 悲观估值区间
        blocks:
          - type: paragraph
            body: >-
              上市可比公司集合作为边界条件有用，但不能机械套公式。NIU 是最接近的上市小型 EV 或两轮车可比对象， 目前筛出来的市销率只有约 0.30x、企业价值 / 收入约
              0.20x；这提醒我们，不应假定公开市场会给硬件主导的微出行支付高倍数。 Rivian 是更高估值的战略 EV 参照，市销率约 3.23x，但它规模大得多、披露充分得多，而且仍深度亏损，
              所以更适合作为叙事上限可比，而不是直接迁移的倍数。Lime 提供了另一课：规模化微出行可以产生真实收入和自由现金流， 却仍可能背负足以触发持续经营警示的负债。三角校验后，当前价值区间应保持谨慎。悲观情景在
              $500 million 至 $750 million 左右，前提是交付滑坡或融资重置。基准情景在 $800 million 至 $1.05 billion 左右，
              前提是上线发生且伙伴叙事维持，但真实经济性仍不披露。只有在交付、TM-Q 商业化和自动驾驶试点开始证明平台杠杆时， 乐观情景才到约 $1.25 billion 至 $1.70 billion。
