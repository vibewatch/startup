chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、布局与平台逻辑
        blocks:
          - type: paragraph
            body: >-
              Also 更应被看作一家源自 Rivian 的小型 EV 公司，而不是普通电动自行车创业公司。公司 2025 年 3 月在 Eclipse 出资支持下正式拆分， Rivian
              保留少数股权，并公开把未来协作放在共享技术、规模经济和选择性使用零售触点上。现有公司材料讲的也不只是一辆自行车： Also 称自己在打造用于载人和载货的小型
              EV，既有人驾也有自动驾驶，覆盖消费和商用场景。运营布局从一开始就刻意分散。Palo Alto 是工程和产品中心，Seattle 负责商务和客户运营，Taichung
              承接供应链工作。品牌语言也重要。官方文案把小型 EV 称为基础性的出行变化， 名字 “Also” 则意在表达对现有交通的补充，而不是二元替代。这个定位为后文定调：先是平台和现场部署逻辑，不只是高端自行车 SKU
              发布。
