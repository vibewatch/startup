      - number: '2.2'
        title: 规模测算视角、可观察需求与干净 TAM/SAM/SOM 的边界
        blocks:
          - type: paragraph
            body: >-
              公开来源足以用多个视角约束市场，但还不足以发布一个精确的单一来源 TAM。最清晰的硬需求信号来自共享微出行。USDOT 称，2023 年共享自行车和电动滑板车出行超过 133 million 次，多数行程约 15
              minutes，约 37% 替代汽车出行。同一文件称，2022 年一次平均 1.5-mile 自行车或电动自行车行程花费 $2.30 到 $5.50；这意味着仅该使用场景切片就有约 $306 million 到
              $732 million 的直接可观察骑行支出代理。第二个视角来自运营商规模收入： TechCrunch 称 Lime 的 IPO 文件显示 2025 年收入增至 $886.7 million，覆盖 230
              个城市和 29 个国家，说明共享小型 EV 运营即便利润率仍有争议， 也能做出实质规模。第三个视角来自商用配送邻近市场：DoorDash 称其 2025 年在 40 多个国家产生近 $75 billion
              商户销售额，第四季度 903 million 笔订单显示了 Also 试图用 TM-Q 触达的流程有多大。第四个视角是当前消费端价格阶梯。Also、Rad Power、Cowboy
              等品牌已经显示买家支付意愿在哪里。 公开来源不给的是高端联网电动自行车、四轮家庭车和配送小型 EV 按地域拆分的可信外部数据。因此，正确的尽调姿态是受证据约束的 TAM/SAM/SOM，
              而不是宏大的全出行总量口号。
