  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: standard
    summary: 描绘消费者兴趣和商业合作目前如何从认知进入演示、预订、交付准备，随后才进入持久使用。
    data:
      items:
        - id: stage-awareness
          label: 认知
          actor: 消费者骑手或商业运营商
          description: 故事从 Also 宽泛的消费者 + 商业定位、媒体报道和具名合作公告开始，而不是从一长串客户 logo 开始。
          channels:
            - TM-B 和 TM-Q 产品页
            - 新闻页
            - DoorDash 公告
            - 独立评测
        - id: stage-hands-on-proof
          label: 上手验证
          actor: 潜在骑手或合作伙伴评估方
          description: 潜在客户可以通过试骑、Sea Otter 演示、媒体预览骑行，或模拟真实使用的内部化社区活动接触产品。
          channels:
            - 十城试骑
            - Sea Otter Classic
            - 预览骑行
            - Camp ALSO
        - id: stage-commitment
          label: 承诺
          actor: 家庭买家或商业项目发起方
          description: 消费者承诺目前走预订流程，其经济条款随时间变化；商业承诺仍以合作措辞呈现，而不是披露订单。
          channels:
            - 预订协议
            - Forbes 首发报道
            - DoorDash 商业协议
        - id: stage-delivery-readiness
          label: 交付准备
          actor: 运营、服务和履约团队
          description: 服务、融资和组装伙伴搭出了一部分转化脚手架，但交付时间、制造启动和装机规模仍不透明。
          channels:
            - 服务页
            - 服务与组装
            - 合作伙伴页
        - id: stage-durability
          label: 持久性 / 扩张
          actor: 留存客户或规模化车队
          description: 公开记录到这里变得很薄：未披露续约、流失、使用量或复购队列数据，因此持久性仍是尽调项，而不是已验证结果。
          channels:
            - 留存指标未披露
            - 无公开装机基数
            - 无公开车队续约数据
