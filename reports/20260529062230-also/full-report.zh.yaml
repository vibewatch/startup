      - number: '8.4'
        title: 建议、退出逻辑、否决触发器和最终尽调
        blocks:
          - type: paragraph
            body: >-
              本章结论是继续研究。这不是永远回避，而是一个价格敏感判断：公开记录还不足以支持按 $1 billion 基准出价， 仿佛它已经是完整尽调过的干净股权机会。对一家硬件重、制造、服务和安全问题仍未解决的公司，
              新投资人应要求一条可信路径，在四到六年持有期内拿到超额回报。在当前基准下，只有最强执行路径才开始支撑这种野心；
              即便如此，未披露的稀释和优先权条款也可能吃掉大部分上行。基于今天的证据，最可能的退出是获得更多交付证明后再做一轮私募融资或战略交易； IPO
              期权要等运营指标可公开后才成立。投资逻辑破裂触发器可以监控，并不抽象：错过 2026 年交付、 当前价位下预订转化弱、重大电池安全或分类挫折、战略伙伴滑坡，或出现更结构化的新一轮融资。
              因此，最终尽调应聚焦清算瀑布、预订、单位经济性、服务负担，以及 DoorDash 协议的真实经济范围。
