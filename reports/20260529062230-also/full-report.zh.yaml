        - ~0.30x P/S 和 ~0.20x EV/revenue
        - 当前来源集中最接近的硬件主导小型 EV 上市可比公司
        - 中国上市的成熟公众公司；地域和阶段与 Also 差异很大。
      - - Rivian Automotive
        - 相邻的 EV 平台上市可比公司
