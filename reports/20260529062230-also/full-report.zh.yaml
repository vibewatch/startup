      - number: '3.3'
        title: 直接自行车集合之外的替代品、车队方案与规模压力
        blocks:
          - type: paragraph
            body: >-
              一旦买家不再是纯消费者，替代威胁会更严肃。Bird 和 Lime 让骑行者无需拥有车辆也能消费短途出行，这对偶发或城市中心使用很有吸引力。
              现状替代甚至可以更简单——低成本本地出行继续用传统自行车，天气、续航或装载需求占上风时继续开车，或继续调度已经嵌入车队运营的商用配送厢式车。 Lime 的 IPO
              文件显示，共享微出行能达到很真实的收入规模，即便资产负债表质量仍然参差。对车队或本地商业买家来说，DoorDash 级别配送量和共享运营商经济性， 远比某个通勤自行车对手造型更好看重要。NIU
              进一步扩大威胁，因为它通过全渠道分销覆盖电动摩托、轻便摩托、自行车、电动自行车和立式电动滑板车。 即使产品形态不完全等同于 Also，这种宽度也能挤压小型 EV 经济性和经销商触达。Also
              推配送车辆因此带来上行空间，也把公司带进更艰难的比较集合： 正常运行时间、零件物流和路线经济性比高端品牌更重要。正确解读是，商用可选性提升 TAM 相关性，但也让 Also
              面临比单纯消费自行车市场更强的执行检验。
