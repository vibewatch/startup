      - number: '3.2'
        title: 直接消费同业比较：价格、能力与分销
        blocks:
          - type: paragraph
            body: >-
              在直接所有权集合里，比较分成四条线。Rad Power 胜在品类宽、价格更低、工具属性定位成熟。其当前产品组合大约从 $1,299 延伸到 $2,399， 公司称已服务超过 450,000
              名客户，并在美国和加拿大提供线上、零售和服务渠道支持。Cowboy 胜在联网能力和精致的城市简洁性，提供 GPS 追踪、 碰撞检测、自适应动力，以及扩大可及性的翻新车入口。Ampler
              更像一家设计驱动的通勤自行车公司，靠轻量化、USB-C 充电、试骑和租赁竞争， 而不是靠重载货或类似四轮车的场景。Urtopia 在参数表上最直接，把碳纤维车身、GPS、4G、AI 辅助功能和据称 1,000
              多家门店支持组合在一起。 再往上还有 Specialized 和 Trek 这样的高端既有玩家；它们可能没有 Also 的线控驱动叙事，但用品牌熟悉度、线下服务信心和更安全的经销商支撑所有权来竞争。
              面对这些玩家，Also 的消费端优势不是最低价格，也不是当前最密集的服务网点。它最强的故事是差异化骑行架构、模块化、强设计，以及同一平台逻辑能延伸到 TM-Q。
              这为高端个人交通到更高载重和商用场景搭起桥。但在公开服务密度、融资深度和可靠性数据改善之前，买家仍可理性地选择更便宜、更成熟或支持更清楚的替代品。
