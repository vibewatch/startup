      - number: '3.4'
        title: 护城河耐久性、切换成本与多归属风险
        blocks:
          - type: paragraph
            body: >-
              Also 的护城河有潜力，但还没定型。平台故事有差异：DreamRide、软件定义控制、模块化，以及从 TM-B 到 TM-Q 的桥，比普通通勤车架更难模仿。 但这个品类的实际切换成本不是 SaaS
              意义上的软件锁定，而是服务触达、自研零件、融资、维修周转，以及买家是否相信品牌能活下去。 这些正是既有玩家和邻近玩家能施压的地方。Specialized 和 Trek
              可以依托经销商支撑的适配、服务和品牌熟悉度；Rad 和 Urtopia 公开提到的支持触点比 Also 当前具名的更广；Cowboy 和 Ampler 对更看重精致所有权而非四轮可选性的买家，有更清晰的城市定位。
              共享运营商让锁定进一步下降，因为用户可以把偶发租赁和一辆低价自有自行车组合起来；当可靠性和载重能力比新鲜感更重要时，汽车和厢式车仍是默认选项。
              对许多买家来说，多归属很容易：拥有一辆低价电动自行车，保留汽车，需要时使用共享车队。这意味着 Also 的护城河至少和产品原创性一样依赖执行质量和服务可靠性。
              如果公司证明支持可靠、车队部署可信，架构可以变成可防守优势。否则，当前差异化仍可能被分销更好的品牌或承诺更少的替代品套利掉。
