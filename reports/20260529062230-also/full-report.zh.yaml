              $305 million 的已披露融资。现在，利益相关方地图和融资金额一样重要。Rivian 仍在经济和战略上关键，因为它还持有少数股权，并提供可信度、技术血统和潜在零售杠杆。Greenoaks
              是头部估值设定者。Eclipse 是最早外部投资人。 DoorDash 不只是资本，它还带来商业自动驾驶项目和治理触点。Prysm 则是另一家后期财务赞助方。尽调含义很明确：Also
              已经是多方共处的股权结构故事， 不再是简单的创始人加种子投资人案例。
