  - id: TV005
    title: 打破投资论点与叫停触发表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 2026 年交付时点滑坡
        - 消费者交付明显推迟，超出公司披露的 2026 年计划
        - 削弱平台正从叙事走向执行的论点。
        - 把估值重切到熊市区间，并暂停任何按价投资流程。
      - - 现价下预订或转化疲弱
        - 退款活跃、付费转化低，或必须大幅打折才能推动 TM-B 放量
        - 说明产品差异化没有抵消价格弹性。
        - 推翻高端消费者需求假设，并要求更低入场价。
      - - 电池安全或车辆分类受挫
        - 出现重大现场事故、不利监管行动，或因电池 / 车辆类别规则引发高成本重新设计
        - 服务、召回、责任和市场准入风险同步上升。
        - 暂停尽调，直到重新核算安全响应、合规姿态和准备金需求。
      - - 战略融资重置
        - 降价轮、显著更强的优先权，或其他让新普通股式投资者居后的结构
        - 确认公开基准高估了干净股权价值。
        - 在原价格锚下，从继续研究转向回避。
      - - DoorDash 或 Rivian 关联收窄
        - 商业协议停滞、车队试点范围缩小，或 Rivian 合作痕迹消失
        - 削弱支撑上行情形的平台可选性。
        - 从牛市情形中剔除战略溢价假设。
    notes: 这些触发项写成可观察事件；一旦发生，会直接改写估值承销，而不是泛泛列风险。
    claimRefs:
      - CV003
      - CV007
      - CV014
      - CV016
      - CV023
      - CV025
      - CV026
      - CV043
      - CV049
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 股权结构表与清算瀑布
        - Series C 后的持股、优先权、参与权、清偿顺位，以及任何棘轮或认股权证
        - 在 $1B 基准下，结构对普通股结果的影响可能比名义价格更大。
        - 财务 + 法律尽调；索取最新股权结构表、章程、附属协议和清算瀑布模型。
      - - 预订漏斗质量
        - 总预订量、付费转化、退款率、取消时点，以及融资购买 / 现金购买占比
        - 产品可以让人兴奋，但仍可能无法规模化转化。
        - 增长和运营尽调；按地域和渠道复盘 cohort 漏斗数据。
      - - 交付后单位经济
        - 贡献利润率、质保准备金、服务成本、电池更换率，以及分车型 CAC / 回本周期
        - 没有这些，估值讲的是设计和伙伴故事，不是一门生意。
        - 财务 + 服务尽调；获取车型级毛利率和服务 cohort 报告。
      - - 制造与供应商韧性
        - 代工条款、最低订单、良率数据，以及电池 / 驱动系统供应商集中度
        - 小型 EV 硬件如果在供应链准备好之前放量，很快会偏离计划。
        - 运营尽调；复盘供应协议、QA 指标和备用方案。
      - - DoorDash 协议经济性
        - 试点范围、排他性、收入分成、责任分配和履约义务
        - 战略上行情形取决于这项合作能否创造真实可部署需求。
        - 商业 + 法律尽调；审阅已签协议和部署路线图。
      - - 安全与监管合规
        - 电池认证、事故报告流程、逐司法辖区车辆分类，以及任何重新设计要求
        - 安全或分类失败会阻断发布、增加成本，并损害品牌信任。
        - 监管尽调；审阅认证文件、合规备忘录和召回应对手册。
    notes: 这些问题是把当前公开故事转化为干净投资承销所需的最低材料包。
    claimRefs:
      - CV006
      - CV014
      - CV019
      - CV020
      - CV023
      - CV025
      - CV047
      - CV050
