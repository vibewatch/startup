  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 高端定价下的产品市场匹配仍未证明；如果转化或可靠性不及预期，DreamRide 会让服务负担更重
        blocks:
          - type: paragraph
            body: >-
              消费端风险先从价格开始。TM-B 目前约 $3,500，高性能配置约 $4,500；在 Also 尚未证明交付规模、 留存或复购之前，这个价位已经明显高于大众电动自行车。Electrek
              的反向解读有价值，因为它直接质疑： 即便产品打动人，美国买家是否会大规模接受 $3,500-$4,500 的电动自行车。平台本身也拉高执行风险， 因为 DreamRide 不是传统传动系统：Also
              称其采用垂直整合架构、自研电机、定制软件、OTA 更新， 以及踏板线控系统，踩踏和车轮运动之间没有直接机械连接。它可能做出差异化，但也会把保修、诊断、 培训和零部件复杂度风险推给上线服务伙伴。现有服务网络和
              Chase 融资关系确实能缓释风险， 但缓释成熟度仍只是中等，因为 SLA 密度、融资渗透、早期保修表现和转化经济性都没有披露。
              管理层证明价格、服务和产品复杂度能互相配合，而不是彼此掣肘之前，剩余敞口仍高。尽调要求很直接： 按上线市场证明订金到订单的转化、融资采用率、早期服务质量和零部件可得性。
