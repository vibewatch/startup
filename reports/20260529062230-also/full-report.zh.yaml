      - number: '4.3'
        title: 成本结构与资本强度：真正背负规模化负担的高端小型 EV 平台
        blocks:
          - type: paragraph
            body: >-
              成本故事比简单消费自行车创业公司重得多。Also 反复称自己垂直整合，强调内部硬件和软件能力，并把新资金用途与产品开发、制造和全球部署绑定。 运营布局也强化了这一判断：Palo Alto
              承载工程、电池系统、电子、软件和物流领导；Taichung 支持全球供应管理和供应商开发； Seattle
              承担商务、支持和服务职能。即便还没有完整交付规模数据，公开记录已经指向产品工程、供应链搭建、服务赋能和车队 / 自动驾驶开发上的实质投入。

              公开证据不给的是实际单位经济性桥梁。没有披露 BOM、电池成本、质保准备金、毛利率、翻新率、单车服务成本、退货率或按车型划分的贡献利润率。 这很重要，因为产品本身技术野心很高：DreamRide
              具备线控踏板、再生制动、软件定义，并包裹在联网硬件和锁车功能中。独立电动自行车报道准确点出了它带来的投资判断张力——
              自行车看起来有差异，但高端价位和自研复杂度可能抬高服务负担，并缩窄现实销量基础。行业历史让这个风险具体化：Rad Power 在多年裁员、 产品安全压力和从纯 DTC 转向后进入破产。Also
              可能资本更充足、技术更复杂，但这个品类已经证明，增长叙事能多快撞上支持和资产负债表现实。
