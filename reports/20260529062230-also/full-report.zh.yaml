      - number: '3.5'
        title: 反向竞品证据：VanMoof、Bird 和 Rad Power 揭示的品类风险
        blocks:
          - type: paragraph
            body: >-
              反向证据重要，因为这个品类反复证明，有吸引力的产品故事还不够。VanMoof 是高端自研系统最清晰的警示。AP 和 TechCrunch 都显示， 这家公司售出约 200,000
              辆自行车并拥有全球品牌门店，但破产仍转化为维修停摆、退款暂停、应用依赖和车主不确定性，因为自研零件和软件让常规维修渠道难以介入。 Bird 是公开市场警示。TechCrunch 记录了它在退市、裁员和市值崩塌后的
              Chapter 11 申请；The Verge 则认为，失败更多来自不可持续的资本和定价纪律， 而不是共享微出行本身没有消费需求。Rad Power
              是直接面向消费者电动自行车的警示。TechCrunch、GeekWire 和 Electrek 合在一起显示， 这家公司一度看似占优，随后申请 Chapter
              11，收入大幅下滑，并最终以远低于峰值估值的价格出售核心资产。给 Also 的启示不是市场是假的，而是服务、 质保、资本结构和运营纪律，可能比设计热度或早期品类领先更具决定性。用这个框架判断 2026
              年护城河耐久性更合适。
