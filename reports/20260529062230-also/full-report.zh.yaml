        title: 产品定义、模块与公开路线图表面
        blocks:
          - type: paragraph
            body: >-
              Also 当前产品应理解为先通过 TM-B 表达出来的小型 EV 平台，而不是在标准车架上加装电机的传统自行车品牌。官方材料把小型 EV 称为画布，
              把内部技术平台称为赋能层，并称产品线会继续扩展。客户流程比“骑一辆自行车”更宽：同一基础系统被定位为通勤、工具或家庭使用、轻载货， 最终通过 TM-Q
              式衍生车型进入更密集的商业配送。公开评测持续强化这种框架。TM-B 在上框层面模块化，提供面向消费者的 Solo 和 Comfort
              类座椅、工具架版本，以及感知软件的配置。评测者还强调，公司希望用一个核心架构覆盖多个使用场景，而不要求买家学习多个产品类别。 这让产品定义具有战略意义。Also
              不只是卖一段高端骑行体验；它在测试一个软件定义硬件核心能否覆盖多种小型车辆任务，同时守住对电池、推进、 UI 和服务栈的差异化控制。
