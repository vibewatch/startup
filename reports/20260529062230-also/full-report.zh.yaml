  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手 / 类别
      - 品类
      - 规模 / 融资信号
      - 目标客群
      - 差异化
      - 相比 Also 的短板
    rows:
      - - Also
        - 高端联网电助力自行车 + 四轮小型 EV
        - 当前融资已在别处披露；公开服务密度仍在形成
        - 高端消费者和部分车队买家
        - 软件定义的骑行架构，加上四轮选项
        - 公开记录里的规模和服务证明仍有限
      - - Rad Power Bikes
        - 低价实用 / 载货电助力自行车
        - 450,000+ 客户；自称北美最大电动自行车品牌
        - 实用、载货、家庭和入门价位买家
        - 产品宽度、更低价格、零售和服务渠道
        - 近期破产和出售暴露结构性脆弱
      - - Cowboy
        - 联网城市电助力自行车专业品牌
        - 翻新渠道和成熟的 app 主导持有体验定位
        - 看重设计和软件的城市骑行者
        - GPS、碰撞检测、自适应动力、强联网叙事
        - 用例更窄，载货 / 车队选项更少
      - - Ampler
        - 轻量城市通勤电助力自行车
        - 租赁和试骑动作；高端但设计驱动
        - 看重轻量和简单的通勤者
        - USB-C 充电和少噱头的城市定位
        - 载货或车队桥接不够明显
      - - Urtopia
        - 功能丰富的碳纤维电助力自行车
        - 声称覆盖 1,000+ 家自行车店，并强调广泛智能功能
        - 想要智能功能和轻量化的高端骑行者
        - 碳纤维、AI、GPS、UL 认证叙事
        - 规格表竞争拥挤，可能压缩差异化
      - - Bird / Lime
        - 共享微出行运营商
        - Bird 覆盖数百座城市；Lime 2025 年收入 $886.7M，覆盖 230 座城市和 29 个国家
        - 短途骑行者和城市项目
        - 无需持有即可使用，城市便利性高
        - 经济性和公开市场韧性仍不均衡
      - - Specialized / Trek
        - 高端既有自行车品牌
        - 根基深的高端自行车品牌，具备经销商和服务信任
        - 重视设计、品牌信心和适配支持的骑行者
        - 品牌资产、线下零售和服务信心
        - 在模块化、线控和商业角度上不如 Also 差异化
      - - NIU
        - 规模型城市出行 OEM
        - 车辆目录广、全渠道销售模式
        - 全球两轮和微出行买家
        - 车型覆盖宽度和渠道规模
        - 不是完全对标的高端持有型品牌
      - - VanMoof（历史教训）
        - 高端专有电助力自行车品牌
        - 破产前售出约 200,000 辆自行车
        - 高端城市骑行者
        - 设计驱动的联网自行车，品牌识别强
        - 破产暴露维修和 app 依赖风险
      - - 传统自行车 / 非电动载货自行车
        - 既有两轮替代品
        - 现有自行车无需新的分期、app 上手或服务学习曲线
        - 优先考虑低成本、锻炼或维修简单的骑行者
        - 最便宜的持有路径，维修也容易
        - 在助力、软件或更高速用途上比不上 Also
      - - 私家车持有
        - 既有城市交通替代品
        - 家庭已有车辆和停车习惯
        - 优先考虑天气防护、续航或载客的用户
        - 熟悉、全天候可用，且无需新的出行流程
        - 成本高得多，也不太适合城市短途
      - - 商业配送厢式货车
        - 既有车队替代品
        - 既有车队工具、路线流程和载货标准
        - 优化路线密度和在线率的商户或运营商
        - 已验证的载货能力和运营熟悉度
        - 运营成本更高，自行车道 / 路缘通行灵活性更弱
    notes: 规模 / 融资信号刻意不拉齐，因为不同竞争类别的公开披露差异很大。缺少硬数字时，表格只列可辩护的公开信号，而不猜测。
