        title: 高端城市消费者、家庭 / 工具用户、车队和配送伙伴都出现在故事里——但证据深度不同
        blocks:
          - type: paragraph
            body: >-
              Also 的客户地图现在像五个相邻但不均衡的需求池：想要一辆快速、设计感强通勤车的高端城市消费者；使用载货和载娃配置的家庭 / 工具型家庭； 评估 TM-Q
              以降低城市运营成本的商用车队；寻找可走自行车道载货车辆的配送 / 物流伙伴；以及 DoorDash 这个唯一具名的自动驾驶 / 配送伙伴。
              这种跨度在战略上有吸引力，因为一个平台可以同时讲人和货的移动。但它也拆散了证据质量。消费端证据来自产品页、预订、试骑和预览评测。 车队证据主要来自 TM-Q 定位和伙伴措辞。DoorDash
              证据更深，因为它点名交易对手和使用场景。即便如此，这些表面仍没有展示生产规模客户数、 复购或实时车队利用率。公开记录显示的是可信细分市场；还没有显示哪个细分最先或最好转化。
