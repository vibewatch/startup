  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同业、替代品与邻近小型 EV 类别
        blocks:
          - type: paragraph
            body: >-
              竞争集合比一张自行车品牌清单更宽。Also 最接近的直接同业，是把所有权、设计和软件体验卖进同一城市短途预算的高端或联网消费电动自行车公司： Rad Power、Cowboy、Ampler 和
              Urtopia。但高端既有玩家视角也重要。Specialized 和 Trek 没有出售 Also 的线控驱动架构，
              却已经拥有骑手信任、门店现场适配服务和经销商支撑的维修触点，这些都能让更安全的高端替代选择看起来更理性。邻近替代品同样重要。 Lime 和 Bird 不要求拥有车辆，却争夺同一城市出行；NIU 等小型 EV
              OEM 靠品类宽度和渠道触达竞争；默认退路仍可能是一辆传统自行车、 一辆私家车，或一辆已经部署的配送厢式车。Also 自己的 TM-Q 和 DoorDash
              工作再次拉宽边界：对商用买家来说，真正的替代方案是任何能降低每条路线成本、 提高利用率并经得住运营磨损的东西。因此，本章把市场看作重叠的解决方案类别，而不是假装一张竞品表就能解释买家决策。
