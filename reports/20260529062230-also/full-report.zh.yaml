      - number: '8.2'
        title: 当前价格锚下的投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              乐观情景是真实存在的。Also 有来自 Rivian 的真实战略血统，TM-B 展示了可见技术和产品差异化， 试骑带来早期现场证据，评测和品牌动能也足以说明公司正在打穿高端骑行人群。DoorDash
              关系进一步把叙事从消费自行车扩到商业和自动驾驶小型 EV 用例。 市场证据也支持短途小型车辆出行需求，Argonne 的研究表明，私人拥有的微出行规模远大于通常被统计的共享车辆子集。
              反向逻辑同样真实。产品兴奋不等于品类经济性。Also 仍在面向高端消费价位销售，预订条款明确避开交付保证， 官方材料也没有披露证明平台可盈利扩张所需的运营指标。外部评论已经质疑 $3,500-$4,500
              自行车能否跑出规模经济； Bird、Rad Power 和 VanMoof 的行业失败也说明，技术含量高的微出行业务会多快撞上融资、服务或维修负担。 安全和分类规则又给国际扩张加了一层摩擦。
