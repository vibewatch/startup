        - 披露商业铺开时间表、车队经济性和非试点部署量最关键。
      - - 投资逻辑：市场和基础设施证据仍支持短途城市出行和配送场景里的微出行需求。
        - 如果证明 Also 能以有吸引力的单位经济性抓住这部分需求，市场顺风会更值得投资。
      - - 反向逻辑：Also 仍不披露收入、出货、毛利率和预订转化数据，经济性尚未证明。
        - 经审计的交付、毛利率、保修成本和现金消耗披露，会直接削弱这条反向逻辑。
      - - 反向逻辑：$3,500-$4,500 定价可能过于高端，在美国若没有重营销或融资支持，难以实现大规模消费者采用。
        - 强转化、低取消率以及健康复购推荐或候补名单行为的证据会有帮助。
      - - 反向逻辑：行业失败和电池安全审查显示，即使产品受欢迎，这个品类也可能毁掉股权价值。
        - 如果能证明安全合规、现场故障率低，并且服务模式避开自研维修瓶颈，判断会改善。
    notes: 各行把市场、产品、伙伴和风险证据转化为估值后果，而不是泛泛评价公司质量。
