  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入表面：可见变现已经存在，但大多仍未规模化
        blocks:
          - type: paragraph
            body: >-
              Also 已不再是纯概念公司，因为它现在公布了真实消费端价格和预订机制。

              当前 TM-B 页面显示基础款 TM-B 起价 $3,500，TM-B Performance 款 $4,500；同时，门店页单独列出约 $350 到 $500 的可更换上框配件。
              预订协议在财务上有意义，因为它在预订时收取整车全价，而不是象征性定金；尽管如此，协议仍承诺退款，并明确拒绝保证交付时间。 换句话说，公司已经暴露出变现表面，但仍是预订驱动，而不是交付验证。

              更宽的收入模型最好概括为消费加商用的混合平台。官方公司材料称 Also 同时服务消费者和商业伙伴，2026 年 3 月 DoorDash 公告又增加了一项围绕自动配送车辆的多年商业合作。 TM-Q
              页面把这一逻辑延伸到面向家庭交通、物流和配送车队的四轮平台，但价格、可用时间和合同结构仍未披露。这对投资判断很重要： 公司显然打算从硬件、配件、融资或伙伴关系，以及未来车队项目中变现；但目前只有 TM-B
              消费端标价具体到足以建模。
