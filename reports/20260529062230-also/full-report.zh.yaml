  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议仍偏谨慎，因为战略上行和真实产品验证，仍被当前估值标尺下的信息披露与结构缺口压住。
    data:
      nodes:
        - id: n1
          label: Rivian 血统 + 少数股权
        - id: n2
          label: TM-B 已公布定价 + 10 城市实地验证
        - id: n3
          label: DoorDash 战略价值 / 自动驾驶期权
        - id: n4
          label: 未披露收入、利润率或出货基数
        - id: n5
          label: 2025 年 7 月 $1B 标尺 + 2026 年 Series C 轮
        - id: n6
          label: 行业失败案例 + 安全 / 分类风险
        - id: n7
          label: 建议 = 继续研究
      edges:
        - from: n1
          to: n5
        - from: n2
          to: n5
        - from: n3
          to: n5
        - from: n4
          to: n7
        - from: n5
          to: n7
        - from: n6
          to: n7
    approximationNotes: 流程把投资判断链条压缩成最直接影响结论的少数变量。
