      - number: '7.4'
        title: DoorDash 集中度、Rivian 生态依赖和已上线的现有竞争者，让 Also 几乎没有容错空间
        blocks:
          - type: paragraph
            body: >-
              DoorDash 既是最强外部证据，也是集中风险。战略投资、董事会席位和多年合作验证了相关性， 但也意味着公开记录仍锚定在一个具名商业对手方上。TechCrunch 提到 Amazon 已向 Rivian
              订购数千辆类似配送车， 这一点重要，因为它抬高了证明门槛：生态里已有大车队验证先例，而 Also 自身披露的部署范围仍有限。 Rivian
              血统也有两面性。它带来可信度、技术杠杆和可能的零售或规模收益，但不能把母生态误读成持续支持的现成保证。
              与此同时，消费端和车队端替代方案已经上线。Cowboy、Rad、Ampler、Urtopia、NIU、Lime 和 Bird 说明，
              客户已经可以买、租，或拿成熟替代品比较，其中很多价格更低，或已有真实运营历史。因此竞争反击不是假设： 如果 Also 上市晚、定价高，或服务薄，现有玩家可以用可得性、更低价格或更简单的拥有体验回应。
