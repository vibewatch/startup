        - 维修停止、退款暂停，app 和零部件依赖给车主带来风险
        - 如果服务韧性弱，专有系统会变成负债
        - 离开公司控制渠道后，Also 的可维修性如何？
      - - Bird
        - 上市共享微出行先行者申请 Chapter 11 破产保护
        - 退市、裁员和疲弱的上市公司经济性先于破产出现
        - 共享车队需求可以真实存在，但单个运营商仍可能财务失血
        - 如果 Also 更偏向车队，能否避开资本结构压力？
      - - Rad Power Bikes
        - 前品类龙头申请 Chapter 11 破产保护并出售资产
        - 收入大幅下滑，资产出售价值远低于峰值估值
        - 仅靠直面消费者的电动自行车规模，挡不住财务崩塌
        - Also 的下行利润率和库存模型是什么样？
      - - Lime
        - 已做大规模的运营商在 IPO 文件中仍提示持续经营风险
        - 收入增长伴随债务和流动性压力
        - 即便是品类赢家，也可能背着沉重的资产负债表风险
        - 在现金生成可信之前，Also 还需要多少外部资本？
    notes: 这些反向案例并非一一对应的直接类比，而是品类压力测试，说明以设计或增长为主线的叙事过去会在哪里断裂。
