      - number: '4.4'
        title: 资本充足性与结论：披露融资很厚，但还不能完成闭环投资判断
        blocks:
          - type: paragraph
            body: >-
              Also 对一家微出行创业公司来说，已披露资金支持异常强。公开来源支持 2025 年 3 月 $105 million 启动轮、2025 年 7 月 Greenoaks 以 $1 billion 估值投资，以及
              2026 年 3 月包含 Greenoaks、Prysm Capital 和 DoorDash 的 $200 million Series C。 投资人至少可以重建 $305 million
              的已披露累计资本，公司也明确称最新轮融资将用于产品开发、制造和全球部署。这是真实缓冲， 尤其是在许多同业远未接近这种资产负债表支持就已经挣扎的品类中。

              即便如此，仅靠公开材料无法回答资本充足性。审阅来源没有披露不受限现金、月度烧钱速度、现金跑道、债务额度、契约结构、营运资本需求或预订转化率。
              关键是，没有审阅来源披露已确认收入、GMV、交付量或毛利率。当前最可支撑的结论是，Also 仍处于收入前阶段，或商业化太早，公开证据无法证明有实质经营收入。
              公司有在线价格、预订、演示和商业伙伴信号，但还没有提供区分产品热度和持久收入质量所需的数据。因此，财务结论是混合的：融资通道很强， 但收入质量、利润率路径和现金充足性仍被私有数据卡住。
