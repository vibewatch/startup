      - number: '2.4'
        title: 增长驱动、采用约束与时点仍然重要的原因
        blocks:
          - type: paragraph
            body: >-
              最强需求驱动都来自短距离和经济性。共享微出行证据显示，骑行者会把小型 EV 用于城市短途，尤其是一公里接驳痛点明显、且自行车道通行能缩短到达时间的地方。 Argonne
              的研究支撑环境和能源逻辑：电动自行车替代燃油单人汽车行程时节能最大，引用数据也显示，已观察到的电动自行车使用中有相当一部分已经在做这件事。 Also
              自己的产品叙事试图用模块化硬件、软件定义控制、融资和合作伙伴服务强化这些驱动。但约束同样真实。电池安全监管正在收紧。PeopleForBikes 称， 美国可能采用的标准正向 UL 2271、UL 2272 和
              UL 2849 收敛，CPSC 与 FDNY 支持的证词也显示，严重火灾事件后，推动强制性全国规则的政治压力真实存在。 跨境产品可移植性也不简单。英国 EAPC 规则把连续额定功率限制在 250
              watts，并把更高功率或更快的电机驱动车辆视为轻便摩托或摩托车。 最后，Also
              自己的预订协议提醒买家，热情不等于交付确定性：公开材料仍未承诺锁定价格或锁定交付窗口。市场可以增长，但执行纪律和合规准备度将决定增长能以多快速度触达。
