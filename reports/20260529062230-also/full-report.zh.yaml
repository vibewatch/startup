  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 收入未披露，估值判断最受证据里程碑牵动，而不是某个公式化倍数。
    data:
      items:
        - label: 披露稀疏 / 无交付验证
          value: 600
          detail: 若发布延期或转化不及预期，讨论估值为 $M
        - label: 当前公开证据集
          value: 850
          detail: 具备产品可见度和合作伙伴信号、但经济性仍披露稀疏时，估值为 $M
        - label: 当前公开基准
          value: 1000
          detail: 2025 年 7 月 Greenoaks 估值标记为 $M
        - label: 2026 年准时交付 + 漏斗披露
          value: 1200
          detail: 若发布质量显著提升，估值为 $M
        - label: 交付 + 利润率 + 服务验证
          value: 1450
          detail: 若硬件经济性看起来可复制，估值为 $M
        - label: TM-Q / 自动驾驶带来的平台杠杆
          value: 1700
          detail: 若小型 EV 平台逻辑变清晰，估值为 $M
    approximationNotes: 敏感性台阶是四舍五入后的投委会讨论值，绑定里程碑可信度，不是管理层指引。
    claimRefs:
      - CV004
      - CV019
      - CV037
      - CV043
      - CV044
      - CV045
      - CV047
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 当前公开基准落在基础区间上沿，但还没达到支持明确买入的验证门槛。
    data:
      items:
        - label: 悲观当前价值区间
          low: 500
          high: 750
        - label: 基准当前价值区间
          low: 800
          high: 1050
        - label: 乐观当前价值区间
          low: 1250
          high: 1700
        - label: 公开基准
          low: 1000
          high: 1000
    approximationNotes: 区间按最接近的 $50M 取整，校准的是当前价值讨论，不是未来退出估值。
    claimRefs:
      - CV004
      - CV043
      - CV044
      - CV045
      - CV046
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: KPI 面板说明：Also 战略上有吸引力，但按当前估值标记，仍未跨过明确买入门槛。
    data:
      items:
        - label: 市场顺风
          value: Real
          detail: USDOT 和 Argonne 的证据都支撑微出行存在持久用例。
          score: 7
        - label: 产品验证
          value: Visible, pre-scale
          detail: TM-B 定价、DreamRide 定位和 10 城市试骑都是真验证，但还不是规模化交付。
          score: 6
        - label: 战略杠杆
          value: Rivian + DoorDash
          detail: 母公司血统和配送平台可选性，确实给投资判断加分。
          score: 8
        - label: 经济性披露
          value: Low
          detail: 收入、销量、毛利率和员工人数仍未披露。
          score: 3
        - label: 公开可比公司支撑
          value: Mixed
          detail: NIU 估值便宜；Rivian 更贵，但体量大得多、披露也更多。
          score: 4
        - label: 安全 / 监管负担
          value: Meaningful
          detail: 电池标准和电动自行车分类规则可能增加成本和发布摩擦。
          score: 4
        - label: 证据质量
          value: Mixed but broad
          detail: 来源基础多元，但私营公司指标缺失，仍挡住清晰投资判断。
          score: 5
    claimRefs:
      - CV011
      - CV019
      - CV021
      - CV022
      - CV023
      - CV025
      - CV030
      - CV032
      - CV046
