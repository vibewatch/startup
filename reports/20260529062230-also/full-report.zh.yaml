      - number: '5.4'
        title: 信任、服务、隐私与未解技术风险
        blocks:
          - type: paragraph
            body: >-
              这里的信任负担高于普通电动自行车，因为骑手被要求像信任车规控制一样，信任软件、电池、锁止、应用和服务系统。正面看，官方材料展示了隐私和条款文件、
              由应用承接的控制、防盗功能、服务与组装支持，以及正在扩展的零售服务网络。评测也确认，许多承诺功能已经出现在真实车辆上。但监管语境显示仍有待证明的事项。 CPSC
              电池论坛突出强制安全标准、防篡改电池包、自动断电和电池健康监测的压力；本次审阅的 Also 记录没有浮现同等公开认证文件或测试披露。 竞争语境也缩窄护城河：Cowboy 已经提供
              OTA、GPS、自动锁车、防盗提醒和碰撞检测，Ampler 已经销售 USB-C 充电电动自行车， 因此 Also 的上行取决于 DreamRide、模块化硬件和集成服务能否在规模化后保持可靠。Rad Power
              的品类失败强化了同一点： 如果质保、服务连续性或电池风险管理在规模下崩掉，技术野心就没那么重要。
