              公开治理能见度仍然窄，而且高度依赖个人。Chris Yu 是最清晰的运营锚点：他在发布期材料中一直以总裁身份出现，2026 年合作伙伴公告称其为联合创始人； 他来自 Rivian 和 Specialized
              的产品履历也直接相关。RJ Scaringe 继续充当通往母公司的战略桥梁，在 Rivian 仍持有少数股权的同时担任董事会主席。 这给 Also 带来很强的技术血统，也可能让它更容易撬动 Rivian
