  - id: TP004
    title: 护城河耐久性 / 竞争风险台账
    columns:
      - 护城河主张
      - 主要威胁
      - 严重性
      - 威胁可信的原因
      - 缓释措施 / 尽调问题
    rows:
      - - 软件定义骑行体感
        - 联网自行车专家能跟上软件叙事
        - 中
        - Cowboy 和 Urtopia 已在销售联网和智能功能
        - 要求提供相较同业的留存、NPS 和功能使用数据
      - - 四轮选项
        - 车队买家可能仍偏好更成熟的配送经济性或更大的 OEM
        - 高
        - 商业运营商优化的是在线率和单路线成本，不是新颖性
        - 要求提供现有试点结果和合同转化数据
      - - 合作伙伴服务网络
        - 服务密度可能落后同业，或在规模化时失效
        - 高
        - VanMoof 说明服务脆弱会摧毁信任；Rad 和 Urtopia 则凸显更广支持面的价值
        - 获取当前合作伙伴名单、SLA 指标和零部件可用性数据
      - - 高端品牌定位
        - 低价实用品牌会压缩支付意愿
        - 中
        - Rad 以远低于 Also 当前定价覆盖载货和实用需求
        - 验证买家为何愿意加价，以及何时降档购买
      - - 配送合作叙事
        - 单一被点名合作伙伴可能夸大实际竞争位置
        - 中
        - DoorDash 规模真实，但铺开细节仍未披露
        - 要求提供已签范围、试点地区和部署时间
      - - 品类动能
        - 资本损毁会吓退买家、投资者和供应商
        - 高
        - Bird、VanMoof、Lime 和 Rad 都暴露资产负债表或品类纪律风险
        - 压测资金需求、质保准备金和下行情景融资计划
      - - 经销商支持的高端既有优势
        - Specialized 和 Trek 可以靠信任、适配和维修信心胜出，而不是靠新颖性
        - 高
        - 当可靠性和服务可及性比架构新颖性更重要时，买家往往愿意为熟悉品牌付费
        - 测试相对既有经销商选项的成交率，并记录实际服务 SLA
    notes: 严重性反映对耐久性的可能影响，不代表失败确定性。多项威胁取决于执行；如果内部数据强，仍可缓释。
