      - number: '4.2'
        title: GTM 动作与收入质量：前端 DTC 预订，后端伙伴项目
        blocks:
          - type: paragraph
            body: >-
              公开材料暗示一种混合市场进入动作。消费端，Also 正在运行直接面向消费者的流程，核心是在线配置、全价预订、活动试骑，以及与 Chase Slate
              的优先融资关系。售后端，公司已经借用外部服务能力：合作和服务页面指向 velofix 及更广的服务商网络，负责组装和维护，
              而不是完全自有的服务网点。发布阶段这样做在运营上合理，但也意味着公司尚未证明客户支持经济性有多少会留在内部、多少会外包。

              商用端，Also 看起来在做定制化、伙伴主导销售，而不是标准化公开合同。公司页面称其与物流、配送和交通伙伴一起打造规模化定制方案， DoorDash
              合作则把资本与多年商业合作绑定。仍然缺失的是让收入质量变得可读的常规指标：本次审阅没有公开来源披露 CAC、回本周期、
              销售周期长度、渠道抽成、预订到购买转化、取消率或经常性软件附加。因此，收入故事在宽度上有吸引力，但已实现经济性仍不透明。
