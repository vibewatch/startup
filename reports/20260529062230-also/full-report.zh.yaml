  - id: TI001
    title: 收入来源表
    columns:
      - 收入流
      - 机制
      - 单位
      - 当前价值 / 状态
      - 质量
      - 尽调问题
    rows:
      - - TM-B 消费者车辆销售
        - 直接线上预订，最终完成车辆购买
        - 车辆
        - 基础版 TM-B 起价 $3,500；TM-B Performance 起价 $4,500
        - 标价质量高，已实现销售质量低
        - 提供预订数量、转化到交付的比例、取消量和月度交付台数。
      - - 配件 / 模块化上车架
        - 加购可互换上车架及相关配件
        - 配件单品
        - 已观察到的上车架价格约为 $350 至 $500
        - 中
        - 按自行车提供配件附加率，按配件系列提供毛利率，并按使用场景拆分组合。
      - - 优先融资经济性
        - 通过 Chase Slate 优先方案支持消费者融资
        - 融资订单 / 推荐
        - 公司已披露优先融资伙伴，但经济性和补贴结构未披露
        - 低
        - 提供贷款方经济性、商户折扣或推荐费，以及融资订单占比。
      - - TM-Q 商业 / 车队销售
        - 面向配送和物流场景的定制车队或伙伴合同
        - 车队合同
        - 商业价值主张已公开，但定价、上市时间和合同形式未公开
        - 低
        - 提供 TM-Q 价目表、试点到量产的转化率，以及按阶段划分的客户管线。
      - - 自动驾驶 / 伙伴项目
