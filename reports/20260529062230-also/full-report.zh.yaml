  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值方法、融资背景和入场纪律
        blocks:
          - type: paragraph
            body: >-
              评估 Also，正确起点是里程碑和价格锚框架，而不是传统收入倍数或 DCF。公开来源给投资者两个具体标记： 2025 年 3 月从 Rivian 拆分、获得 Eclipse 的 $105 million，以及
              2025 年 7 月 Greenoaks 支持的 $1 billion 估值基准。但这些资料不提供支撑精确内在价值模型所需的材料，因为当前公开材料仍缺收入、 出货量、毛利率、员工数和预订转化。2026 年 3 月
              DoorDash / Prysm / Greenoaks Series C 提升了对成熟资本仍想配置该资产的信心， 但官方公告没有重申投后估值、优先权条款或清算瀑布。因此，新投资人应把 $1 billion
              当作参考点， 而不是干净普通股公允价值。Rivian 保留少数股权并担任主席，解释了为什么私人投资者可能愿意先于证据付钱， 但这不能消除稀释或优先权悬挂风险。因此，入场纪律比欣赏产品更重要。
