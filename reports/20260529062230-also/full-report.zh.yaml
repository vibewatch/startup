      - number: '2.3'
        title: 按细分市场拆解买家、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买家结构是这个市场最重要的区分之一，因为 Also 同时想服务消费和商用场景。在个人 TM-B 购买中，买家、用户和付款方常常是同一个人或同一户家庭；
              融资降低前期现金摩擦，服务触达则帮助试骑后的转化。在家庭和载货场景里，家庭仍然付费，但日常用户可能包括多个成年人或儿童，因此可靠性、安全性和配件灵活性成为采用关键。 在 TM-Q
              和配送场景中，公式明显改变：用户可能是骑手或运营人员，买家可能是车队经理或运营负责人，付款方可能落在更宽的本地商业、酒店、教育或物流预算中。 在线企业销售页面和 DoorDash
              合作表明，这条买家路径不是假设。因此，商用细分的预算归属更可能靠近运营、物流或车队管理，而不是 HR 或纯可持续发展团队。
              采用路径也因细分市场不同而改变。消费买家可以从营销兴趣走到预订、融资和支持式组装。商用买家通常需要先看到可服务性、自行车道合法性、正常运行时间和更低总拥有成本的证据， 才会把试点扩大到批量。
