      - number: '5.2'
        title: 架构、运营模型与差异化真正所在
        blocks:
          - type: paragraph
            body: >-
              核心技术差异点是 DreamRide。官方产品文案和多篇独立评测都把它描述为串联混动或线控踏板架构：踩踏不再机械驱动后轮。骑手转动发电机，
              软件解读输入，再由独立牵引电机驱动车辆。由此可实现软件定义挡位、自适应骑行模式、不同市场的监管重映射、削平坡度感的助力、牵引力控制和再生制动。
              硬件实现对电动自行车来说也异常集成。独立评测描述了一个中央铸造镁合金驱动单元或副车架，把电池舱、电机集成和悬架接口组合起来； 同时还有可更换上框、双向 USB-C
              充电，以及以手机为中心的控制和安全模型。竞争语境也重要。Cowboy 已经营销 OTA 更新、GPS、自动锁车、 防盗提醒和碰撞检测，Ampler 则在更轻的传统电动自行车上营销集成 USB-C
              充电。因此，候选护城河不只是应用体验打磨，而是在同一基础平台上， 把类似 EV 的软件表面、DreamRide 推进、模块化硬件和 Class 2/3 式性能包络组合起来。
