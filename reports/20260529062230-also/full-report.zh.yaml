              最大的投资判断缺口不是认知度，而是耐久性。预订协议明确写明不保证交付时间，且下单预订时制造可能尚未开始。公开发布材料也从小额可退定金转向更重的全价预订结构， 这可能显著改变转化行为。服务、组装和融资伙伴给
              Also 提供了一些商业化脚手架，但无法补上证明缺口。本次审阅没有公开来源披露客户数、已交付车辆、 活跃骑手、NRR、流失、续约、推荐或复购队列。商业集中度也同样未解：DoorDash
              有意义，但仍是唯一一个有直接官方公告深度的明确具名商业伙伴。 服务是另一个未被充分承销的风险。更宽的电动自行车品类已经显示，当品牌陷入困境时，质保和支持义务可能变得混乱；Rad Power 重组后，
              骑手质疑哪些承诺会被兑现。对 Also 而言，这意味着伙伴网络是必要但不够；在 SLA、质保和交付后满意度数据出现之前，客户故事仍是有希望但未验证。
