      - number: '7.2'
        title: 电池安全、车辆分类和自动驾驶相关许可仍是最清晰的投资逻辑破坏点，因为 2026 年规则正在收紧
        blocks:
          - type: paragraph
            body: >-
              监管和安全风险仍是投资逻辑里最二元的一块。Also 按美国 Class 3 的方式叙事，同时有欧洲和英国野心、 按司法辖区处理油门例外、还想让 TM-Q
              进入自行车道；这些已经跨过的规则体系，比公司公开记录里的合规路径更多。 CPSC 和 PeopleForBikes 都指向更严格的联邦电池安全制度，CPSC 2026 年 4 月数据集也显示，
              电动自行车伤亡基数不小，电池起火反复出现。州层面也在推进监管：Illinois 正在对 28 mph 以上车辆划更硬边界， Massachusetts 的工作则推动按速度分类、产品标准、ID
              和配送行业研究。DoorDash 带来上行空间，也叠加风险， 因为自动驾驶或自动驾驶邻近配送部署会引入许可、运行设计域和安全论证问题，普通消费自行车上市并不存在这些问题。 Also
              目前的缓释手段主要是设计意图、营销口径限制和收窄部署范围的能力。这不是零，但缓释成熟度仍低， 因为没有公开的 UL 等效状态、认证矩阵或许可跟踪表。认证、运行边界和逐司法辖区上线许可可见之前，
              剩余敞口仍高。否决标准同样清楚：没有披露合规路径，或商业部署主张跑在许可前面，就应停止投资论证。
