        - 2025 年收入 ~$886.7M，FCF ~$104M，但仍亏损，流动负债约 ~$1B
        - 已提交 IPO 申请；引用文章未披露估值，并提示持续经营警示
        - 说明即便微出行跑出规模和真实使用，融资压力仍可能存在
        - 共享租赁网络与 Also 的自有车辆和平台论点不是同一种模式。
      - - Yadea Group
        - 二轮 EV 上市格局参照
