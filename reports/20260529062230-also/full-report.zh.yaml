companyProfile:
  summary: >
    Also 是一家总部在 Palo Alto 的小型 EV 公司，2025 年 3 月从 Rivian 拆分成立。公司最早是 Rivian 2022 年启动的内部秘密项目（“Project Inder”）， 随后拿到 Eclipse
    的 $105 million 资金并独立运营。Rivian 保留了可观的少数股权， RJ Scaringe 担任董事会主席。Chris Yu 曾任 Rivian 未来项目 VP，更早在 Specialized Bicycles
    任职；他以总裁兼联合创始人身份带队。 Also 旗舰产品 TM-B 是一款 Class 3 电动自行车，采用自研 DreamRide 线控踏板推进系统，定价 $3,500–$4,500，计划 2026 年交付。产品路线图还包括
    TM-Q 载货 / 家庭四轮车和自动配送机器人 Alpha Wave。2026 年 3 月宣布的 DoorDash 商业合作锚定商用 / 配送场景。截至 2026 年 3 月，Also 已在 Eclipse
    种子轮、Greenoaks Series A，以及 Greenoaks 和 Prysm Capital 共同领投的 $200 million Series C 中累计融资 $305 million。
