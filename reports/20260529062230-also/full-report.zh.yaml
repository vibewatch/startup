  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Also 应按短距离人货移动的小型 EV 平台来分析，不是普通自行车品牌，也不是完整汽车公司。当前产品表面锚定了这个定义。TM-B 是一款定价 $3,500 到 $4,500 的 Class 3
              电动自行车，TM-Q 则把同一平台逻辑延伸到面向载货、家庭和配送流程的踏板辅助四轮车。Rivian 的拆分措辞和发布新闻稿都强化了这种框架：
              平台意在移动人和货，既有人驾也有自动驾驶。因此，纳入支出覆盖高端个人电动自行车、家庭和载货四轮车、面向车队的小型 EV 部署、售后服务以及配套融资。 排除支出包括全尺寸乘用
              EV、超出电动自行车监管处理范围的摩托车和轻便摩托，以及所有本地交通支出的宽泛大类。现状替代品随买家而变： 通勤者可能选择 Rad Power、Cowboy、Ampler 或 Urtopia
              的低价载货或通勤电动自行车；城市或雇主可以依赖 Bird 或 Lime 的共享滑板车 / 自行车； 车队运营方也可以继续使用传统厢式货车、既有配送路径，或 NIU 等更大规模城市出行
              OEM。实际市场边界因此是一块短途小型 EV 楔子： 自行车道通行、低运营成本和软件定义车辆行为，比车辆尺寸本身更重要。
