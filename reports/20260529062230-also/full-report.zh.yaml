      - number: '2.5'
        title: 市场证据仍无法证明什么
        blocks:
          - type: paragraph
            body: >-
              现有来源足以证明 Also 正在切入一个真实品类，也能证明该品类同时有消费和商用需求信号。但它还不足以证明业务最终的商业形态。没有公开来源给出高端联网电动自行车、 四轮家庭车加配送小型 EV 的干净
              SAM，这正是窄口径、受证据约束的测算框架比巨大 TAM 叙事更可信的原因。更重要的缺口在内部： 真实管线转化、各车型真实毛利、真实服务密度，以及 Also
              可能发货的每个地区的真实合规准备度。即便最强外部信号——Lime 的收入规模、DoorDash 的订单量、 共享出行次数——也只是邻近需求视角，不是 Also
              能赢得有意义份额的证明。这才是本章正确的尽调结论。市场真实且战略上有意思，因为预算、短途场景和替代行为都可见。 但对估值的信心仍应等内部数据来证明：Also 能否把品类逻辑转成可重复经济性和低摩擦部署。
            claimRefs:
