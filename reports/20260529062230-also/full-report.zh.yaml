            body: >-
              Also 的预订条款说得很明白：热情不等于交付准备就绪。公司称交付日期不保证，制造可能尚未开始， 排队优先级取决于制造排期以及交付、服务运营可得性。公开制造伙伴仍未披露，关税、单一来源、
              到岸成本和质量风险分析因此不完整。问题更重，是因为公司扩张的不是简单标准自行车：它要同时扩张电池、 服务物流、定制架构和商业版本；从可见公开交付证据看，公司仍处于收入前阶段。品类历史说明这种状态很危险。 Rad
              Power 破产暴露了关税和电池责任压力；Bird 破产说明微出行叙事可以很快反转；Lime 文件显示， 即便规模更大的运营商，也可能在规模化后背负债务、流动性压力和伙伴集中。Rivian 血统和大额融资有帮助，
