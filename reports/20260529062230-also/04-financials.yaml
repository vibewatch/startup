chapter:
  number: 4
  title: Financials
summary: 'Also has now exposed real monetization surfaces — live TM-B list pricing, accessory upsells, reservation terms,

  preferred financing, and early commercial-partner programs — but the company is still too early to support a

  traditional revenue underwrite. Public evidence points to a premium, hardware-heavy, capital-intensive model with

  partner-assisted fleet optionality, yet it still does not disclose recognized revenue, gross margin, burn, cash,

  runway, or service-cost absorption.'
sections:
- id: revenue-surface-and-current-monetization
  title: 'Revenue surface: visible monetization exists, but most of it is still pre-scale'
  body: 'Also is no longer a pure concept company because it now publishes real consumer price points and reservation mechanics.

    The current TM-B page shows a base TM-B starting at $3,500 and a TM-B Performance trim at $4,500, while the storefront

    separately lists interchangeable top-frame accessories at roughly $350 to $500. The reservation agreement is financially

    meaningful because it charges the full vehicle price at the time of reservation rather than a symbolic deposit, even though

    it still promises refunds and explicitly refuses to guarantee delivery timing. In other words, the company has exposed a

    monetization surface, but it is still reservation-led rather than proven-through-delivery.


    The broader revenue model is best described as a mixed consumer-plus-commercial platform. Official company materials say

    Also serves both consumers and commercial partners, and the March 2026 DoorDash announcement adds a multi-year commercial

    collaboration around autonomous delivery vehicles. The TM-Q page extends that logic by positioning a four-wheel platform

    for family transport, logistics, and delivery fleets, but pricing, availability, and contract structure remain undisclosed.

    That matters for underwriting: the company clearly intends to monetize hardware, accessories, financing or partner

    relationships, and future fleet programs, but only TM-B consumer list pricing is currently concrete enough to model.'
