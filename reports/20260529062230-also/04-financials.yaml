    topic: Gross margin, warranty, and service-cost absorption
    missingEvidence: No reviewed source disclosed BOM, gross margin, warranty reserve, repair incidence, or service reimbursement economics.
    whyItMatters: A premium and proprietary micromobility product can fail financially through support burden even with decent demand.
