- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - impact
  - exact diligence path
  rows:
  - - Recognized revenue and deliveries
    - Without deliveries, the company cannot be underwritten as commercially proven.
    - Request monthly deliveries, revenue recognition policy, and net sales by SKU and geography.
  - - Gross margin / contribution margin
    - Differentiation is impossible to value if margins are unknown.
    - Request gross margin by trim, warranty reserve, and contribution margin after service.
  - - Reservation funnel quality
    - Reservations can exaggerate demand if conversion is weak.
    - Request reservation cohorts, cancellation timing, and refund rates.
  - - Cash, burn, and runway
    - Funding history alone does not prove solvency or scale-readiness.
    - Request latest balance sheet, cash-flow statement, board runway model, and fundraising plan.
  - - Commercial contract economics
    - TM-Q and autonomy programs could matter more than bikes over time, but economics are opaque.
    - Request contract summaries with pricing, milestones, exclusivity, and customer concentration.
  - - Service burden and warranty profile
    - Proprietary hardware can fail financially through support costs rather than weak demand.
    - Request warranty claims, repair incidence, field-service reimbursement, and replacement-part economics.
