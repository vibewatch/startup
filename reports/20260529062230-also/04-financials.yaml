- id: capital-adequacy-pre-revenue-status-and-financial-verdict
  title: 'Capital adequacy and verdict: substantial disclosed funding, but not yet a closed underwrite'
  body: 'Also has unusually strong disclosed funding support for a micromobility startup. Public sources support a $105 million

    launch round in March 2025, a July 2025 Greenoaks investment at a $1 billion valuation, and a March 2026 $200 million

    Series C involving Greenoaks, Prysm Capital, and DoorDash. That lets an investor reconstruct at least $305 million of

    disclosed cumulative capital, and the company explicitly says the latest round will fund product development,

    manufacturing, and global deployment. This is a real cushion, especially in a category where many peers struggled long

    before reaching anything close to this balance-sheet support.


    Even so, capital adequacy cannot be answered from public materials alone. No reviewed source discloses unrestricted cash,

    monthly burn, runway, debt facilities, covenant structure, working-capital needs, or reservation-conversion rates.

    Crucially, no reviewed source discloses recognized revenue, GMV, deliveries, or gross margin. The most supportable current

    conclusion is that Also is still pre-revenue or too early in commercialization for public evidence to prove operating

    revenue of consequence. The company has live pricing, reservations, demos, and commercial partner signals, but it does not

    yet provide the data needed to distinguish product excitement from durable revenue quality. The financial verdict is

    therefore mixed: capital access is strong, but revenue quality, margin path, and cash sufficiency remain blocked by

    private data.'
