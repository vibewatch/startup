- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - 2026 delivery timing slips
    - Meaningful consumer delivery pushout beyond the company’s stated 2026 plan
    - Undercuts the argument that the platform is moving from narrative to execution.
    - Re-cut the valuation toward the bear range and pause any priced investment process.
  - - Reservation or conversion weakness at current pricing
    - High refund activity, low paid conversion, or steep discounting needed to move TM-B volume
    - Signals that product differentiation is not overcoming price elasticity.
    - Invalidate premium consumer-demand assumptions and demand a lower entry.
  - - Battery-safety or classification setback
    - Material field incident, adverse regulatory action, or costly redesign tied to battery or vehicle-class rules
    - Raises service, recall, liability, and market-access risk at once.
    - Pause diligence until safety response, compliance posture, and reserve needs are re-underwritten.
  - - Strategic financing reset
    - Down-round, materially stronger preferences, or other structure that subordinates new common-style investors
    - Confirms the public benchmark overstated clean equity value.
    - Move from research-more toward avoid at the prior price anchor.
  - - DoorDash or Rivian linkage narrows
    - Commercial agreement stalls, fleet pilot scope shrinks, or Rivian collaboration surfaces disappear
    - Weakens the platform optionality that supports the upside case.
    - Remove strategic-premium assumptions from the bull case.
  notes: Triggers are phrased as observable events that would directly change valuation underwriting rather than as generic risks.
