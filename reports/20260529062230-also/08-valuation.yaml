  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Decision implication
  rows:
  - - Recommendation
    - research-more
    - Do not underwrite the current public $1B benchmark as a buy until delivery, economics, and cap-table proof improves.
  - - Confidence
    - medium
    - The direction of the call is clear, but undisclosed terms and metrics cap precision.
  - - Risk rating
    - high
    - Hardware launch risk, price elasticity risk, safety/regulatory risk, and preference-overhang risk all remain live.
  - - Valuation stance
    - full-to-stretched
    - The current mark sits at the top of the base range and still needs forward proof to feel attractive.
  - - Target return / hold
    - Want >3x gross over 4-6 years
    - At a clean $1B entry, current public evidence does not clearly support that upside once dilution is considered.
  - - Most likely exit path today
    - Another private round or strategic sale before IPO
    - IPO readiness needs published deliveries, revenue, margin, and service-quality proof.
  - - Upgrade trigger
    - Clean entry below ~ $800M or same mark with audited delivery and margin proof
    - Either price relief or materially better evidence could move the call toward track or buy.
  notes: Recommendation is explicitly price-sensitive and treats the $1B figure as a benchmark rather than as fully underwritten common-equity fair value.
