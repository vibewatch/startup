- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - 'Thesis: Rivian lineage plus a real TM-B product gives Also more credibility than a generic premium e-bike startup.'
    - On-time consumer deliveries with strong early satisfaction and low service burden would strengthen this row materially.
  - - 'Thesis: DoorDash creates a credible path into fleet, delivery, and autonomy use cases that can justify a platform narrative.'
    - A disclosed commercial rollout schedule, fleet economics, and non-pilot deployment volume would matter most.
  - - 'Thesis: Market and infrastructure evidence still supports micromobility demand for short urban trips and delivery use cases.'
    - Proof that Also specifically captures that demand at attractive unit economics would make the market tailwind more investable.
  - - 'Anti-thesis: Also still withholds revenue, shipment, gross-margin, and reservation-conversion data, so the economics remain unproven.'
    - Audited deliveries, gross margin, warranty cost, and cash-burn disclosure would directly weaken this anti-thesis.
  - - 'Anti-thesis: $3,500-$4,500 pricing may be too premium for high-volume consumer adoption in the U.S. without heavy marketing or financing support.'
    - Evidence of strong conversion, low cancellations, and healthy repeat referral or waitlist behavior would help.
  - - 'Anti-thesis: Sector failures and battery-safety scrutiny show the category can destroy equity even when products are loved.'
    - Demonstrated safety compliance, low field-failure rates, and a service model that avoids proprietary repair bottlenecks would improve the view.
  notes: Rows translate market, product, partner, and risk evidence into valuation consequences rather than generic company-quality judgments.
