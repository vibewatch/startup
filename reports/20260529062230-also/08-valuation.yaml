- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Cap table and liquidation waterfall
    - Post-Series-C ownership, preferences, participation rights, seniority, and any ratchets or warrants
    - At a $1B benchmark, structure can matter more than headline price to common-equity outcomes.
    - Finance + counsel diligence; request the latest cap table, charter, side letters, and waterfall model.
  - - Reservation funnel quality
    - Gross reservations, paid conversion, refund rate, cancellation timing, and financed-versus-cash mix
    - The product can feel exciting while still failing to convert at scale.
    - Growth and ops diligence; review cohort funnel data by geography and channel.
  - - Delivered unit economics
    - Contribution margin, warranty reserve, service cost, battery replacement rate, and CAC/payback by trim
    - Without this, the valuation is a story about design and partners rather than a business.
    - Finance + service diligence; obtain model-level gross margin and service cohort reporting.
  - - Manufacturing and supplier resilience
    - Contract manufacturing terms, minimum orders, yield data, and battery / drivetrain supplier concentration
    - Small-EV hardware can miss plan quickly if volume ramps before the supply chain is ready.
    - Operations diligence; review supply agreements, QA metrics, and contingency plans.
  - - DoorDash agreement economics
    - Pilot scope, exclusivity, revenue share, liability allocation, and performance obligations
    - The strategic upside case depends on whether the partnership creates real deployable demand.
    - Commercial + legal diligence; review the executed agreement and deployment roadmap.
  - - Safety and regulatory compliance
    - Battery certifications, incident reporting process, jurisdiction-by-jurisdiction vehicle classification, and any redesign requirements
    - Safety or classification failures can stop launch, add cost, and damage brand trust.
    - Regulatory diligence; review certification files, compliance memos, and recall-response playbooks.
  notes: These asks are the minimum package needed to convert the current public story into clean investment underwriting.
