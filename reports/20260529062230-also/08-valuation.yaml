  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Full post-Series-C cap table, preference stack, participation rights, and liquidation waterfall.
    whyItMatters: Without structure, the $1B benchmark may overstate what new common-style equity is really buying.
    diligencePath: Request charter, side letters, financing docs, and a fully diluted waterfall model from counsel and finance.
    relatedQuestionRefs:
    - QV003
    - QV026
    - QV027
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Delivered unit economics by product line, including gross margin, warranty cost, service burden, and CAC/payback.
    whyItMatters: The valuation method is forced into milestone framing because the core economics are still not disclosed publicly.
    diligencePath: Obtain management reporting for deliveries, gross margin, service tickets, and contribution margin by trim and channel.
    relatedQuestionRefs:
    - QV009
    - QV020
    - QV027
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: material
    topic: reservation-funnel
    missingEvidence: Reservation conversion, refund cadence, financing uptake, and launch-market cohort behavior.
    whyItMatters: Premium pricing only works if reservations convert into profitable delivered demand rather than refundable curiosity.
    diligencePath: Review funnel cohorts by market, channel, and date, including refund reason codes and financing mix.
    relatedQuestionRefs:
    - QV006
    - QV027
    - QV029
    - QV030
    relatedTableRefs:
    - TV005
    - TV006
  - type: private-evidence-only
    severity: material
    topic: doordash-commercial-terms
    missingEvidence: Executed DoorDash agreement economics, pilot scope, liability allocation, and exclusivity or volume commitments.
    whyItMatters: A large share of the upside case rests on whether the partnership produces real paid deployment or mainly strategic signaling.
    diligencePath: Request the commercial agreement, rollout plan, and operating scorecard for each planned fleet pilot.
    relatedQuestionRefs:
    - QV007
    - QV008
    - QV025
    - QV030
    relatedTableRefs:
    - TV003
    - TV006
