- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - TM-B deliveries start on time, TM-Q/fleet demand becomes tangible, DoorDash autonomy pilots become commercial, and margin disclosure shows a path above niche-bike economics.
    - $1.25B-$1.70B current-value range; from a $1B entry that is only about 1.25x-1.7x mark-to-model before dilution, so true venture returns still need later exit expansion.
    - Requires execution on manufacturing, service, and partner rollout that is not yet proven in public evidence.
    - Possible, but it depends on milestones that have not yet cleared.
  - - Base
    - U.S. launch proceeds, TM-B field proof continues, and partner narrative stays intact, but public economics remain sparse and the cap table stays partly opaque.
    - $0.80B-$1.05B current-value range; around the current benchmark, upside looks limited relative to risk.
    - Even stable execution can still leave common-equity value capped by dilution, preferences, and weak price elasticity.
    - Most consistent with the present evidence package.
  - - Bear
    - Deliveries slip, reservations convert weakly at current price points, safety or service issues emerge, or a structured financing reset occurs.
    - $0.50B-$0.75B current-value range; that implies severe downside to a $1B benchmark and poor recovery for junior equity.
    - Down-round risk, higher servicing burden, and category sentiment damage can all compress value quickly.
    - Meaningful if 2026 proof points disappoint.
  notes: Ranges are current-value discussion ranges based on milestone risk, public comp boundaries, and disclosed price anchors; they are not management guidance.
