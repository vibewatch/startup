  - - Niu Technologies
    - Public micromobility / two-wheel EV comp
    - ~$196.1M market cap on ~4.54B revenue (Yahoo trailing metric)
    - ~0.30x P/S and ~0.20x EV/revenue
    - Closest listed hardware-led small-EV comp in the current source set
    - China-listed mature public company; geography and stage differ sharply from Also.
  - - Rivian Automotive
    - Public adjacent EV platform comp
    - ~$19.74B market cap on ~5.53B revenue (Yahoo trailing metric)
    - ~3.23x P/S and ~3.89x EV/revenue
    - Upper-bound strategic EV narrative reference with strong disclosure depth
    - Much larger automotive-scale business with public-market liquidity and different capital intensity.
  - - Lime IPO filing context
    - Model-appropriate micromobility reference
    - 2025 revenue ~$886.7M, FCF ~$104M, but still loss-making with ~$1B current liabilities
    - IPO filed; valuation undisclosed in the cited article; going-concern warning highlighted
    - Shows that even scaled micromobility can have real usage and still carry financing stress
    - Shared rental network is not the same model as Also’s owned-vehicle and platform thesis.
  - - Yadea Group
    - Public two-wheel EV landscape marker
    - Large listed two-wheel EV company trading in Hong Kong
    - FT summary showed shares around HK$11.32 on 2026-05-29
    - Useful reminder that established two-wheel EV players do live in public markets
    - Current fetch did not surface a directly comparable market-cap or sales-multiple datapoint.
  notes: This comp set mixes direct price anchors, public-trading comparables, and model-appropriate references because Also lacks disclosed revenue and margin inputs for a narrower formulaic set.
