company:
  name: Also
chapter:
  number: 8
  title: Valuation
  summary: 'Also’s clearest public price anchor remains the July 2025 $1 billion Greenoaks benchmark, but the open record still withholds revenue, unit sales, gross margin, and round terms. The call is therefore evidence-sensitive and price-sensitive: impressive product and brand momentum plus partner validation support upside, yet execution risk remains too high to underwrite $1B+ as clean fair value before 2026 delivery proof.'
sections:
- id: valuation-method-and-financing-context
  title: Valuation method, financing context, and entry discipline
  body: 'The right starting point for Also is a milestone-and-price-anchor framework, not a conventional revenue multiple or DCF. Open sources give investors two concrete marks: the March 2025 spinout with $105 million from Eclipse and the July 2025 Greenoaks-backed $1 billion valuation benchmark. They do not give the ingredients needed to underwrite a precise intrinsic-value model, because current public materials still omit revenue, unit shipments, gross margin, headcount, and reservation conversion. The March 2026 DoorDash / Prysm / Greenoaks Series C improves confidence that sophisticated capital still wants exposure, but the official announcement did not restate post-money valuation, preference terms, or the liquidation waterfall. That means a new investor should treat $1 billion as a reference point, not as clean common-equity fair value. Rivian’s retained minority stake and chair role explain why private investors might pay ahead of proof, but they do not eliminate dilution or preference-overhang risk. Entry discipline therefore matters more than admiration for the product.'
