  rows:
  - - Privacy Policy (updated 2026-02-20)
    - Published
    - Site, services, purchases, and personal-information handling
    - Product telemetry detail and retention practice specific to the vehicle experience remain high level
  - - Terms of Service (updated 2025-10-22)
    - Published
    - Website, mobile sites, and services including subscription-style use language
    - No standalone public SLA or connected-service pricing matrix was located
  - - Vehicle theft-protection controls
    - Publicly described and independently observed
    - GPS/location, tamper alerts, alarm, remote disable/lock, serialized parts
    - No public penetration test, incident disclosure, or external security audit found
  - - Ride safety features
    - Publicly described and seen in reviews
    - Lighting, indicators, traction control, regen braking, hill/grade management, helmet ecosystem
    - Certification and validation standards behind these features are not publicly documented
  - - Service and assembly support
    - Published official support surface
    - Retail/service locations, support and assembly intent, maintenance workflow
    - Coverage density, turnaround-time targets, and spare-parts availability are not public
  - - Certification / compliance repository
    - Not publicly surfaced in reviewed materials
    - UL/CE-style product certifications, battery compliance, or security attestations
    - This remains a material diligence gap before underwriting scale or fleet deployment
  - - UK EAPC classification rules
    - Official rulebook retrieved
    - Pedals required, more than 2 wheels allowed, 250W continuous rated power, 15.5 mph motor cutoff
    - TM-B or TM-Q would need market-specific remap or alternate homologation if sold into the UK unchanged
  - - Battery safety standard direction
    - Regulatory pressure visible
    - CPSC forum highlights auto shut-offs, tamper resistance, and battery-health monitoring for e-bikes
    - No public TM-B or TM-Q certification/test packet was surfaced alongside these expectations
  - - California / EU official lookup coverage
    - Source retrieval incomplete in this run
    - California DMV page rejected; EU Commission page returned not found
    - Cross-market class treatment still needs fresh retrievals or company-provided homologation materials
  notes: This table intentionally distinguishes what is published from what is actually proven. Absence of public certification pages is treated as a diligence gap, not proof that no certification exists.
