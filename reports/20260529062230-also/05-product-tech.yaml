    missingEvidence: Specific cell suppliers, core-component vendors, formal IP or technology-transfer rights from Rivian to Also, and contracted assembly footprint for TM-Q or other derivatives.
    whyItMatters: Supplier concentration, actual transfer rights, and who is building derivative vehicles determine how durable the technology advantage is and how exposed the company is to execution bottlenecks.
    diligencePath: Obtain supplier list, transfer agreements, licensing detail, BOM-level concentration analysis, and any contract-manufacturing or assembly agreements under NDA.
