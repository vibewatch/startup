- calloutType: risk
  title: Full-stack integration increases service and maintenance dependence
  body: 'The same design choices that make TM-B feel vehicle-like also reduce interchangeability with ordinary bike-shop workflows. Reviewers already question lock-up practicality, long-term integration support, and subscription economics for connected features. Rad Power’s bankruptcy and asset sale are a useful category warning: if service density, battery-risk management, or support continuity lag, the moat can become a bottleneck.'
  claimRefs:
  - CE032
  - CE039
  - CE040
  - CE049
  - CE050
  - CE060
  - CE061
- calloutType: insight
  title: Autonomy and manufacturing claims remain roadmap items, not proven operating capabilities
  body: DoorDash and TM-Q materials matter strategically, but the public record still stops short of showing an autonomy stack, approved operating domain, homologation path, battery-certification packet, or contracted assembly footprint for derivative vehicles. Those should be treated as diligence gaps rather than already-underwritten product capability.
  claimRefs:
  - CE053
  - CE062
  - CE063
