  - type: missing-source
    severity: material
    topic: certification-disclosure
    missingEvidence: Dedicated public documentation for battery, charger, vehicle, and software-security certifications or attestations.
    whyItMatters: Fleet buyers, insurers, and safety-sensitive customers need more than marketing and legal pages before trusting a highly integrated vehicle architecture.
    diligencePath: Request UL/CE or equivalent certification files, test reports, bug-bounty or penetration-test summaries, and any regulator-facing compliance submissions.
