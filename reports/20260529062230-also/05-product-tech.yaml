- id: TE001
  title: Product module / asset matrix
  columns:
  - module/asset/product line
  - user
  - status/maturity
  - differentiation
  - diligence gap
  rows:
  - - TM-B core consumer vehicle
    - Commuter / utility rider
    - Commercially launched and publicly priced; third-party rides completed
    - DreamRide pedal-by-wire architecture, software-defined ride modes, modular top frame system
    - Field reliability at scale and warranty incidence not public
  - - DreamRide propulsion unit
    - All TM-B riders; future derivatives
    - Production-intent and demonstrably rideable
    - Series-hybrid/pedal-by-wire architecture, regen braking, traction-aware control, in-house integration
    - No public MTBF, efficiency curve, or long-run service data
  - - Top frame and accessory ecosystem
    - Single rider, family/utility rider, cargo user
    - Shipping with TM-B launch ecosystem
    - Tool-free swaps, software-aware frame detection, rack/seat reconfiguration
    - How often owners actually swap modules in practice is unknown
  - - Battery and charging subsystem
    - All riders; accessory/device users
    - Shipping with TM-B trims
    - 538 Wh / 808 Wh options, quick release, bidirectional USB-C charging, removable pack
    - Supplier identity, cell chemistry specifics, and cycle-life data not public
  - - Portal / app / theft-protection stack
    - Rider and service team
    - Live on current TM-B product surface
    - Phone-as-key, navigation, remote lock/unlock, tamper alerts, alarm, serialized parts
    - Subscription scope, backend architecture, and security review details not public
  - - TM-Q / quad and light commercial derivatives
    - Family, cargo, delivery, or fleet user
    - Publicly disclosed but pre-volume
    - Reuses DreamRide logic in people-and-goods vehicle forms that can access bike-adjacent space
    - Launch timing, specs, and regulatory classification remain unsettled
  - - Service and assembly network
    - All customers
    - Live but still scaling
    - Retail service intent plus in-house support posture for integrated hardware
    - Coverage density, spare-parts SLA, and technician tooling standards are not public
  notes: Status reflects public evidence as of run date. “Commercially launched” means public pricing and demo visibility, not proven mass-scale field durability.
