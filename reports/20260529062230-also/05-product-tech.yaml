- id: section-architecture-and-operating-model
  title: Architecture, operating model, and where the differentiation actually lives
  body: The core technical differentiator is DreamRide. Official product copy and multiple independent reviews describe it as a series-hybrid or pedal-by-wire architecture in which pedaling does not mechanically drive the rear wheel. Instead, the rider turns a generator, software interprets that input, and a separate traction motor drives the bike. That enables software-defined gears, adaptive ride modes, regulatory remapping between markets, hill flattening, traction control, and regenerative braking. The hardware implementation is also unusually integrated for an e-bike. Independent reviews describe a central cast magnesium drive unit or subframe that combines battery housing, motor integration, and suspension interfaces; swappable top frames; bidirectional USB-C charging; and a phone-centric control and security model. Competitive context matters here. Cowboy already markets OTA updates, GPS, auto-lock, theft alerts, and crash detection, while Ampler markets integrated USB-C charging
    on lighter conventional e-bikes. The moat candidate therefore is not app polish alone. It is the combination of EV-like software surfaces with DreamRide propulsion, modular hardware, and a Class 2/3-style performance envelope on one base platform.
