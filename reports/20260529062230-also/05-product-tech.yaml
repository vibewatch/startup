- id: section-trust-service-and-open-risks
  title: Trust, service, privacy, and the unresolved technical risks
  body: 'The trust burden is higher here than for an ordinary e-bike because riders are being asked to trust software, battery, lockout, app, and service systems as if they were vehicle-grade controls. On the positive side, official materials show privacy and terms documentation, app-mediated control, anti-theft features, service-and-assembly support, and a growing retail service network. Reviews also confirm many promised features are present on real bikes. But regulatory context shows what still has to be proven. CPSC’s battery forum highlights pressure for mandatory safety standards, tamper-resistant packs, auto shut-offs, and battery-health monitoring; the reviewed Also record did not surface equivalent public certification files or test disclosures. Competitive context also narrows the moat: Cowboy already offers OTA, GPS, auto-lock, theft alerts, and crash detection, and Ampler already sells USB-C-charging e-bikes, so Also’s upside depends on whether DreamRide, modular hardware, and
    integrated service can remain reliable at scale. Category failures at Rad Power reinforce the same point: technical ambition matters less if warranty, service continuity, or battery-risk management break under scale.'
