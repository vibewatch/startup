- id: TE002
  title: Workflow / use-case table
  columns:
  - user job
  - current workflow
  - company solution
  - measurable benefit
  - limitation
  rows:
  - - Urban commuting
    - Short car or transit-adjacent trip with parking friction
    - TM-B with auto/manual modes, suspension, navigation, phone-as-key, theft controls
    - Up to 100-mile range, Class 3 assist, EV-like UX for repeated daily use
    - Premium price and public locking practicality remain concerns
  - - Household utility / errands
    - One rider needs to carry groceries, child gear, or mixed cargo
    - Utility top frame, rear rack system, front rack options, modular seating
    - One base platform can cover solo and utility use without buying separate bikes
    - Accessory costs and actual swap frequency are not public
  - - Recreation / mixed-terrain riding
    - Buyer wants one vehicle for roads, broken pavement, and light trail use
    - 120 mm suspension, trail mode, torque-rich propulsion, off-road configuration
    - Broader use envelope than a simple city commuter
    - Weight and integration make it a different proposition than enthusiast mountain bikes
  - - Shared household use
    - Different riders need different sizing or seating setups
    - Top frames and saved profiles let one bike adapt to multiple riders/use cases
    - Potentially higher utilization per household asset
    - True ease of multi-user maintenance and charging behavior is unproven
  - - Dense last-mile delivery
    - Urban delivery route needs curb access and compact vehicle footprint
    - TM-Q derivatives and DreamRide-based commercial variants
    - Bike-like regulatory footprint with platform-level software and battery architecture
    - Commercial specs, ROI, and fleet tooling are not yet publicly detailed
  - - Service / charging / support
    - Customer needs battery management and ongoing maintenance
    - Removable battery, USB-C charging, app controls, official service and assembly surface
    - Simpler charging flexibility and promise of EV-like diagnostics/support
    - Public service SLAs, remote diagnostics detail, and replacement-part process not disclosed
  notes: Benefits are based on public feature claims and independent rides, not on audited fleet or retention data.
