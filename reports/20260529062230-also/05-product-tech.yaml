- calloutType: strength
  title: DreamRide is real architectural differentiation, not cosmetic branding
  body: 'The official record and multiple independent rides align on the core fact: TM-B is not just another supplier-stack e-bike. Pedal-by-wire, software-defined gears, regenerative braking, modular top frames, and a cast central core together amount to a genuinely different architecture.'
  claimRefs:
