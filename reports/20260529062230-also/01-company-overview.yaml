  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Current revenue, unit sales, gross margin, reservation backlog, and current headcount.
    whyItMatters: These metrics determine whether Also is still a concept-rich launch story or already a scaling operating business.
    diligencePath: Request the latest board deck or Series C data room materials covering orders, deliveries, revenue, gross margin, and org size.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: ownership
    missingEvidence: Exact cap-table percentage for Rivian’s retained minority stake and any associated governance rights.
    whyItMatters: Minority percentage and rights determine how much control, dilution protection, and strategic alignment Rivian still carries.
    diligencePath: Obtain the cap table, stock purchase agreement, or investor-rights summary from the spinout and subsequent rounds.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: material
    topic: delivery-schedule
    missingEvidence: Committed production ramp, trim-by-trim delivery timing, and TM-Q commercialization schedule by geography.
    whyItMatters: Launch timing drives working-capital needs, customer-conversion assumptions, and whether the current field events can translate into real revenue.
    diligencePath: Request the manufacturing plan, supplier readiness dashboard, reservation funnel, and delivery calendar by product and market.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO004
  - type: conflicting-data
    severity: minor
    topic: governance-rights
    missingEvidence: Authoritative clarification on whether DoorDash or Stanley Tang has observer-only rights or a formal board seat.
    whyItMatters: Observer versus director status changes information rights, consent rights, and how investors should read DoorDash’s strategic influence.
    diligencePath: Confirm the executed governance package from the Series C closing set or the current board consent materials.
    relatedQuestionRefs:
    - QO007
    relatedTableRefs:
    - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: field-footprint
    missingEvidence: Full service-provider roster and a dated national calendar of recurring test-spin or retail touchpoints.
    whyItMatters: The current events page proves activity in several cities, but not the full depth or permanence of post-sale support coverage.
    diligencePath: Export the service-locator list and current field-marketing calendar, then reconcile them against actual store openings and partner contracts.
    relatedQuestionRefs:
    - QO019
    relatedTableRefs:
    - TO004
