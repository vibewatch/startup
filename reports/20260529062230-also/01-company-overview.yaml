- id: products-milestones-and-commercial-signals
  title: Products, milestones, and the early commercial signal set
  body: 'By late 2025, Also had gone from stealth spinout to visible product company. The TM-B launch in October 2025 gave the market a concrete vehicle, while year-end company recap material said TM-Q and Alpha Wave had also been introduced. Current official product pages show a two-tier TM-B price ladder at $3,500 and $4,500, plus a spec envelope built around up to 100 miles of range, 28 mph assist, 10x assist, 180 Nm torque, and the DreamRide pedal-by-wire architecture. Early 2026 field signals are real but still pre-scale: the company publicized national test-spin availability, listed at least ten U.S. metro areas on the events page, and scheduled Sea Otter Classic demos in April 2026. At the same time, the reservation agreement is legally conservative. It charges the full vehicle price as the reservation fee, offers refunds, and explicitly refuses to guarantee delivery timing. That caution lines up with the central risk signal: product excitement and design validation are real, but
    open-source evidence still does not prove high-volume economics or a locked production schedule.'
