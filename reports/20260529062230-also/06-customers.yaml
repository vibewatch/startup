callouts:
- calloutType: strength
  title: DoorDash is real proof, but only at collaboration depth
  body: DoorDash is the best named commercial signal in the public record because it combines capital, a specific use case, and a direct counterparty quote. The limitation is that the evidence still stops at collaboration language rather than disclosed fleet deployment, revenue, or renewal data.
  claimRefs:
  - CU008
  - CU009
  - CU010
  - CU014
- calloutType: risk
  title: No shipped installed base means no retention proof yet
  body: Reservations, demos, and review rides show interest, but they do not prove durable customer behavior. Without deliveries, the company cannot yet show churn, repeat purchase, referral, warranty burden, commercial renewal quality, or whether its service-partner model can absorb real after-sales load in the field.
  claimRefs:
  - CU024
  - CU025
  - CU026
  - CU029
  - CU034
  - CU038
  - CU047
  - CU048
- calloutType: insight
  title: Consumer and fleet branches are maturing at different speeds
  body: Consumer proof is broader but shallower, built on demos, reviews, and reservations. Commercial proof is narrower but strategically stronger because DoorDash is named and Amazon appears only as a thinner TM-Q adjacency signal. That uneven maturity across branches is the core customer-underwriting nuance for Also today.
  claimRefs:
  - CU014
  - CU036
  - CU037
  - CU039
  - CU045
  - CU046
