- id: consumer-demand-signals-before-shipping
  title: Consumer demand signals are real, but reservations, test spins, events, and reviewer reactions are not the same as production scale
  body: 'On the consumer side, the public record is richer on attention than on adoption. Also''s events page lists ten metro areas for test spins and events, Sea Otter created a concentrated hands-on showcase, and the review / POV material proves real riders and media experienced the TM-B rather than just marketing renders. That matters because it lowers product-reality risk. But it is still not production-scale customer proof. Reservations are not deliveries. Test spins are not repeat usage. Events are not retention. Media reactions are not cohort conversion. The strongest buyer personas visible today are premium urban consumers who want design, performance, and car-replacement convenience, plus family / utility users who value cargo and kid-carrying flexibility. The adverse side of the record is pricing sensitivity: Electrek argued first that the original $4,500 price would exclude most buyers, then later that even a $3,500 entry point may not produce high volume. That skepticism matters
    because it attacks the exact bridge between excitement and scaled demand.'
