    - Named strategic collaboration
    - Commercial proof centers on one partner
    - Fleet thesis could collapse into narrative value only
    - Request SOW scope, milestones, geography, and unit commitments
  - - Service network growth
    - Service network and velofix partnership
    - Execution quality depends on third-party coverage and responsiveness
    - Poor support would raise churn and warranty cost
    - Request service-map density, SLAs, and first-time-fix metrics
  - - Financing support
    - Preferred financing partner named
    - Checkout affordability depends on one third-party option
    - Lower attach or higher denial rates could hurt conversion
    - Request financing attach rate, approval rate, and loss assumptions
  - - Enterprise pipeline beyond DoorDash
    - Corporate sales page exists but is thin
    - No second named fleet buyer is public
    - Concentration and procurement risk stay high
    - Request pipeline by stage, segment, and probability
  - - Warranty / support execution
    - Partner network and service pages exist, but SLA outcomes are undisclosed
    - Category history shows support commitments can become painful if execution slips
    - Early owners could become detractors and referral value could collapse
    - Request warranty reserve, repair turnaround, parts fill rate, and partner escalation metrics
