chapter:
  number: 6
  title: Customers
  summary: Also’s customer reality is still pre-launch. Consumer commuter and cargo-household proof comes from reservations, ten-city test spins, Sea Otter demos, and preview reviews, while commercial proof is concentrated in a real but still early DoorDash pilot/commercial collaboration; neither branch yet shows a shipped installed base, retention KPIs, or diversified enterprise demand that would prove durable adoption.
sections:
- id: consumer-versus-commercial-customer-map
  title: Premium urban consumers, family / utility users, fleets, and delivery partners all appear in the story — but at different proof depths
  body: 'Also''s customer map now looks like five adjacent but uneven demand pools: premium urban consumers who want a fast, design-forward commuter; family / utility households using cargo and kid-carrying configurations; commercial fleets evaluating the TM-Q for lower-cost urban operations; delivery / logistics partners looking for bike-lane-capable cargo vehicles; and DoorDash as the one named autonomy / delivery partner. That spread is strategically attractive because one platform can speak to both people and goods movement. But it also fragments proof quality. Consumer evidence comes from product pages, reservations, test spins, and preview reviews. Fleet evidence comes mostly from TM-Q positioning and partner language. DoorDash evidence is deeper because it names a counterparty and use case. Still, none of these surfaces yet show production-scale customer counts, repeat purchase, or live fleet utilization. The public record shows plausible segments; it has not yet shown which segment
    converts first or best.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU005
  - CU006
  - CU007
  - CU039
  - CU041
  tableRefs:
  - TU001
