- id: durability-retention-and-concentration-gaps
  title: The biggest underwriting gap is not awareness; it is the lack of shipped installed-base, retention, and concentration evidence
  body: 'The biggest underwriting gap is not awareness; it is durability. The reservation agreement is explicit that delivery timing is not guaranteed and that manufacturing may not even have started when a reservation is placed. Public launch materials also moved from a small refundable deposit to a much heavier full-price reservation structure, which can change conversion behavior materially. Service, assembly, and financing partners give Also some commercialization scaffolding, but they do not close the proof gap. No public source reviewed here discloses customer counts, delivered units, active riders, NRR, churn, renewal, referral, or repeat-purchase cohorts. Commercial concentration is similarly unresolved: DoorDash is meaningful, but still the only clearly named commercial partner with direct official-announcement depth. Service is another underwritten risk. The broader e-bike category has shown that warranty and support obligations can become messy when brands hit distress, as Rad
    Power''s restructuring left riders questioning which commitments would be honored. For Also, that means a partner network is necessary but not enough; until SLA, warranty, and post-delivery satisfaction data exist, the customer story remains promising but unproven.'
