- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Current signal
  - Concentration risk
  - Impact if delayed
  - Diligence path
  rows:
  - - Consumer test spins to paid orders
    - Ten-city events and festival demos
