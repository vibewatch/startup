tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Current public proof
  - Strategic value
  - Gap
  rows:
  - - Premium urban consumer
    - Buyer=user in most cases; payer is household consumer
    - Daily city commuting, errands, and car-replacement convenience
    - TM-B product page, preview reviews, reservations, and test-spin program
    - Core TM-B volume story and premium brand formation
    - No disclosed conversion, delivery, or active-rider counts
  - - Family / utility household
    - Household decision-maker pays; rider mix spans parent and children
    - Kid carrying, gear hauling, school runs, and multi-role household mobility
    - TM-B modular frame story plus family / cargo framing in Forbes and Electrek
    - Higher basket size, accessory sales, and repeat household use case breadth
    - No public repeat-use, attachment-rate, or retention data
  - - Commercial fleet operator
    - Buyer is business; users are couriers or field operators
    - Last-mile logistics and delivery fleet use
    - TM-Q page plus corporate-sales surface and DoorDash context
    - Could anchor larger recurring fleet demand if procurement converts
    - No disclosed contracted units, unit economics, or launch dates
  - - Delivery / logistics platform partner
    - Payer is platform or operator; users may be couriers, merchants, or ops teams
    - Dense urban goods movement with bike-lane-capable cargo vehicles
    - DoorDash announcement plus TM-Q/Amazon references in official and independent coverage
    - Potential channel leverage and route-density relevance
    - Only one direct named partner; Amazon proof is indirect and terms-free
  - - DoorDash autonomy / delivery partner
    - Buyer / payer unclear; user may be DoorDash Labs, merchants, or courier workflows
    - Autonomous road-adjacent last-mile goods movement
    - Official collaboration, investment, board-observer role, and partner quotes
    - Most credible named commercial proof in the record
    - Still reads as pre-deployment collaboration, not disclosed production rollout
  notes: This segmentation table makes buyer / user / payer explicit and separates broad delivery-platform relevance from the single named DoorDash proof point; every row still carries a conversion or scale gap.
