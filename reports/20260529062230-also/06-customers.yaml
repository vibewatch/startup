- id: doorDash-and-adoption-proof
  title: DoorDash is the strongest named proof point, while TM-Q/Amazon references broaden the story without proving scaled deployment
  body: 'DoorDash is the strongest commercial customer proof in the file and should be read positively, but carefully. The partnership includes strategic capital, a multi-year commercial collaboration, a board-observer role for Stanley Tang, and explicit language about autonomous delivery in dense road-adjacent environments. That is materially better than a generic pilot rumor, and it fits DoorDash''s merchant / consumer logistics network. Public references to TM-Q interest or collaboration with Amazon widen the delivery / logistics narrative, but they are thinner and less direct than the DoorDash disclosures: the evidence is an Also year-end post plus independent reporting, not a disclosed Amazon contract or operating launch. Even with those adjacent signals, public commercial proof still stops short of production scale. No source here gives contracted units, revenue, operating cities, renewal structure, or live utilization. DoorDash validates relevance; it does not yet validate installed-base
    depth.'
