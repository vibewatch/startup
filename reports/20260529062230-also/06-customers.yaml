  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: installed-base
    missingEvidence: Delivered units, active riders, delivered fleet count, and geography-by-geography deployment totals.
    whyItMatters: Those figures determine whether Also is still validating demand or has actually converted interest into a durable customer base.
    diligencePath: Request the latest delivery dashboard, reservation backlog by trim, and any live fleet deployment tracker.
    relatedQuestionRefs:
    - QU011
    - QU012
    relatedTableRefs:
    - TU002
    - TU003
  - type: missing-source
    severity: material
    topic: retention
    missingEvidence: NRR, GRR, renewal rate, repeat purchase, referral rate, and cohort ride-frequency metrics for any segment.
    whyItMatters: Without durability metrics, the customer thesis cannot move from product excitement to recurring value creation.
    diligencePath: Request cohort tables for consumer deliveries and any commercial account renewals, including churn reasons.
    relatedQuestionRefs:
    - QU019
    - QU020
    - QU025
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: commercial-concentration
    missingEvidence: DoorDash contract scope, milestone schedule, unit commitments, economics, and whether any second enterprise customer is in late-stage pipeline.
    whyItMatters: Commercial upside could be real, but concentration risk is impossible to size without the pipeline and the DoorDash work order structure.
    diligencePath: Request the SOW, commercialization milestones, pipeline by stage, and any signed LOIs beyond DoorDash.
    relatedQuestionRefs:
    - QU007
    - QU008
    - QU021
    - QU022
    relatedTableRefs:
    - TU003
    - TU005
  - type: missing-source
    severity: minor
    topic: service-sla
    missingEvidence: City-by-city service coverage, warranty turn times, parts availability, and financing attach rates.
    whyItMatters: After-sales quality and affordability support may be decisive for conversion and early churn, and category history shows support burdens can quickly become customer-facing when operators stumble.
    diligencePath: Request the service provider map, first-time-fix rate, warranty claims dashboard, repair turnaround times, financing funnel metrics, and the escalation path for partner failures.
    relatedQuestionRefs:
    - QU014
    - QU015
    - QU024
    relatedTableRefs:
    - TU004
    - TU005
