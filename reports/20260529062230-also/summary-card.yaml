summary:
  headline: >
    Also has authentic Rivian engineering DNA, a differentiated DreamRide propulsion system, and a DoorDash commercial
    anchor—but it is a pre-revenue hardware startup valued at $1 billion before mass production, with unresolved
    delivery timelines, battery-safety regulatory exposure, and capital requirements that make the current benchmark
    high-risk for new investors.
