  topStrengths:
    - >-
      Authentic Rivian engineering lineage with proprietary DreamRide pedal-by-wire technology, cast-core frame, and
      modular hardware architecture—differentiators that budget e-bike makers cannot easily replicate.
    - >-
      DoorDash commercial partnership and board observer seat provide a credible enterprise anchor for the
      commercial/delivery product roadmap (TM-Q, Alpha Wave) that expands the addressable market beyond consumer
      e-bikes.
    - >-
      Tier-1 investor syndicate (Greenoaks, Eclipse, Prysm Capital) and board chair RJ Scaringe (Rivian CEO) provide
      capital access, strategic validation, and cross-platform technology sharing that strengthen the long-term platform
      thesis.
  topRisks:
    - >-
      Pre-revenue hardware execution risk: TM-B deliveries are planned but not yet begun at scale, manufacturing
      partners are unverified publicly, and unit economics at $3,500–$4,500 price points are unproven against a
      capital-intensive build.
    - >-
      Battery safety and regulatory exposure: FDNY and NYC regulations flag lithium-ion e-bike fire risk; California and
      other state e-bike classifications impose varying compliance burdens that raise product liability and insurance
      costs.
    - >-
      Sector precedent risk: VanMoof ($1B+ funding, bankrupt 2023) and Rad Power Bikes (bankrupt 2025) illustrate that
      capital-intensive premium e-bike ventures have failed at scale, and Also has not yet proved it can sustain its own
      cash conversion cycle.
  unresolvedGaps:
    - >-
      TM-B production volumes, delivery milestones, and actual manufacturing cost versus $3,500–$4,500 retail price—the
      fundamental unit-economics question.
    - >-
      Series C valuation mark, liquidation preferences, and anti-dilution provisions that could significantly affect
      new-investor return profiles at the $1 billion baseline.
    - >-
      DoorDash commercial contract terms, volume commitments, and Alpha Wave development timeline and regulatory
      approval pathway.
    - >-
      Long-term gross margin and service-model economics for a software-hardware integrated e-bike requiring
      Over-the-Air updates and an assembled-service-provider network.
