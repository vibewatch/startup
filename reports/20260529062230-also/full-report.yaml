      - number: '8.4'
        title: Recommendation, exit logic, kill triggers, and final diligence
        blocks:
          - type: paragraph
            body: >-
              The chapter lands on research-more. That is not an avoid-forever call; it is a price-sensitive judgment
              that the open record does not yet justify paying the $1 billion benchmark as though it were a fully
              underwritten clean-equity opportunity. For a hardware-heavy company with unresolved manufacturing,
              service, and safety questions, a new investor should want a credible path to outsized returns over a
              four-to-six-year hold. At the current benchmark, only the strongest execution path begins to justify that
              ambition, and even then undisclosed dilution and preference terms can absorb much of the upside. The most
              plausible exit from today’s evidence set is another private financing or a strategic transaction after
              more delivery proof, with IPO optionality only after operating metrics become publishable. Thesis-break
              triggers are monitorable rather than abstract: missed 2026 deliveries, weak reservation conversion at
              current price points, material battery-safety or classification setbacks, strategic partner slippage, or a
              more structured round. Final diligence should therefore focus on the waterfall, reservations, unit
              economics, service burden, and the actual economic scope of the DoorDash agreement.
