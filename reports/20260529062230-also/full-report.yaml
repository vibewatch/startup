              disclosed cumulative capital, and the company explicitly says the latest round will fund product
              development,

              manufacturing, and global deployment. This is a real cushion, especially in a category where many peers
              struggled long

              before reaching anything close to this balance-sheet support.


              Even so, capital adequacy cannot be answered from public materials alone. No reviewed source discloses
              unrestricted cash,

              monthly burn, runway, debt facilities, covenant structure, working-capital needs, or
              reservation-conversion rates.

