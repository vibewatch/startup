chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and platform logic
        blocks:
          - type: paragraph
            body: >-
              Also should be treated as a Rivian-origin small-EV company rather than as a generic e-bike startup. The
              company formally spun out in March 2025 with Eclipse funding, while Rivian kept a minority stake and
              publicly framed future collaboration around shared technology, economies of scale, and selective use of
              retail footprint. Current company materials push a wider story than a single bike: Also says it is
              building small EVs for moving people and goods, driven and autonomous, across consumer and commercial use
              cases. The operating footprint is already intentionally distributed. Palo Alto is the engineering and
              product center, Seattle is tied to commerce and customer operations, and Taichung anchors supply-chain
              work. Brand language also matters here. Official copy says small EVs are a foundational mobility shift,
              and the name “Also” is meant to signal complementarity with existing transport rather than a binary
              replacement story. That framing sets up later chapters: this is a platform and field-deployment thesis
              first, not just a premium-bike SKU launch.
