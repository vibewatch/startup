  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: >-
          Product-market fit at premium pricing is still unproven, and DreamRide makes the service burden harder if
          conversion or reliability disappoints
        blocks:
          - type: paragraph
            body: >-
              The consumer risk starts with price. TM-B now sits at roughly $3,500 while the Performance trim sits at
              roughly $4,500, which puts Also well above mass-market e-bike price points before the company has shown
              delivered volume, retention, or repeat purchasing. Electrek’s adverse read is useful because it directly
              challenges the idea that U.S. buyers will adopt $3,500-$4,500 e-bikes at scale, even if the product is
              impressive. The platform also increases execution risk because DreamRide is not a conventional drivetrain:
              Also describes vertically integrated architecture, in-house motors, custom software, OTA updates, and a
              pedal-by-wire system with no direct mechanical link between pedaling and wheel motion. That can produce
              differentiation, but it also raises warranty, diagnostics, training, and parts-complexity risk for launch
              service partners. The existing service network and Chase financing relationship are real mitigants, but
              mitigation maturity is still only medium because SLA density, financing attach, early warranty behavior,
              and conversion economics remain undisclosed. Residual exposure stays high until management can show that
              price, service, and product complexity work together rather than fighting each other. The diligence ask is
              straightforward: prove deposit-to-order conversion, financing uptake, early service quality, and parts
              availability by launch market.
