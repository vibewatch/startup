  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: >-
      Capability maturity is strongest on TM-B hardware and core software, less mature on derivatives, public
      certifications, and scaled support proof.
    data:
      columns:
        - TM-B core hardware
        - TM-B software/security
        - TM-B service/support
        - TM-Q/commercial derivatives
        - Alpha Wave / ecosystem
      rows:
        - label: Public product proof
          values:
            - label: High
              tone: positive
              detail: Priced, reviewed, and demoed publicly.
            - label: High
              tone: positive
              detail: Core UX, locking, and display functions shown publicly.
            - label: Medium
              tone: neutral
              detail: Official support surface exists but density not proven.
            - label: Medium
              tone: neutral
              detail: Publicly shown and discussed, but not yet volume-shipping.
            - label: Medium
              tone: neutral
              detail: Helmet and accessories are disclosed, but ecosystem breadth is still early.
        - label: Differentiation strength
          values:
            - label: High
              tone: positive
              detail: Cast core, modularity, suspension, and integrated packaging stand out.
            - label: High
              tone: positive
              detail: >-
                DreamRide and modular hardware still look unusual, but OTA, GPS, and auto-lock now exist on
                connected-bike peers too.
            - label: Medium
              tone: neutral
              detail: Service intent matters, but proof is thinner than product novelty.
            - label: High
              tone: positive
              detail: DreamRide reuse into delivery or quad forms is strategically powerful if executed.
            - label: Medium
              tone: neutral
              detail: Helmet/accessory integration is interesting but less proven as moat.
        - label: Reliability proof
          values:
            - label: Medium
              tone: warning
              detail: Multiple rides and reviews exist, but no long-term field data is public.
            - label: Medium
              tone: warning
              detail: Feature set is visible; durability and bug rate are not.
            - label: Low
              tone: warning
              detail: No public SLA or field-service metrics surfaced.
            - label: Low
              tone: warning
              detail: Derivative reliability is not publicly tested at scale.
            - label: Low
              tone: warning
              detail: Accessory durability claims are limited.
        - label: Regulatory / compliance clarity
          values:
            - label: Medium
              tone: warning
              detail: >-
                US-spec performance likely needs market remap for UK/EAPC treatment; California and EU official lookups
                were incomplete in the reviewed pack.
            - label: Low
              tone: warning
              detail: No public security-audit or connected-service attestation located.
            - label: Medium
              tone: warning
              detail: Support and legal docs exist, but product-specific compliance disclosures are sparse.
            - label: Low
              tone: warning
              detail: Autonomy and manufacturing claims for derivatives remain partnership-led, not certification-backed.
            - label: Low
              tone: warning
              detail: Safety/compliance evidence on connected accessories is limited.
        - label: Readiness for scale
          values:
            - label: Medium
              tone: neutral
              detail: Engineering appears advanced, but manufacturing scale proof is still limited.
            - label: Medium
              tone: neutral
              detail: Full-stack control can scale well if the software and support hold up.
            - label: Low
              tone: warning
              detail: Service density may become the bottleneck sooner than product appeal.
            - label: Low
              tone: warning
              detail: >-
                Commercial rollout still depends on autonomy proof, homologation, battery compliance, and actual
                assembly readiness.
            - label: Low
              tone: warning
              detail: Ecosystem scale depends on attach and pricing not yet public.
    approximationNotes: null
