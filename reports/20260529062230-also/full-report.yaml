      - number: '1.2'
        title: Leadership, governance, and dependence on key people
        blocks:
          - type: paragraph
            body: >-
              Public governance visibility is still narrow and highly personality-driven. Chris Yu is the clearest
              operating anchor: he appears as president across the launch-era materials, is described in 2026 partner
              announcements as a co-founder, and brings directly relevant product credentials from both Rivian and
              Specialized. RJ Scaringe remains the strategic bridge back to the parent company, serving as board chair
              while Rivian still holds a minority stake. That gives Also strong technical lineage and a likely easier
              path to leveraging Rivian-adjacent retail surfaces, but it also means key-person dependence is real. The
              governance picture broadened in March 2026 when DoorDash tied capital and a commercial autonomy
              partnership to Stanley Tang’s entry as a board observer. One caution: TechCrunch described this as a board
              seat, while company materials use observer language. For this chapter’s ground truth, the official 2026
              company and PR materials win, but the discrepancy is still worth flagging for later governance diligence.
