  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: >-
      Maps how consumer interest and commercial collaboration currently move from awareness into demos, reservations,
      delivery readiness, and only then into durable usage.
    data:
      items:
        - id: stage-awareness
          label: Awareness
          actor: Consumer rider or commercial operator
          description: >-
            The story starts with Also’s broad consumer-plus-commercial positioning, media coverage, and named
            partnership announcements rather than with a long customer-logo list.
          channels:
            - TM-B and TM-Q product pages
            - News page
            - DoorDash announcement
            - Independent reviews
        - id: stage-hands-on-proof
          label: Hands-on proof
          actor: Prospect rider or partner evaluator
          description: >-
            Prospects can encounter the product through test spins, Sea Otter demos, media preview rides, or
            internalized community events that simulate real-world usage.
          channels:
            - Ten-city test spins
            - Sea Otter Classic
            - Preview rides
            - Camp ALSO
        - id: stage-commitment
          label: Commitment
          actor: Household buyer or commercial sponsor
          description: >-
            Consumer commitment currently runs through reservation flows whose economics changed over time, while
            commercial commitment remains framed through collaboration language rather than disclosed orders.
          channels:
            - Reservation agreement
            - Forbes launch coverage
            - DoorDash commercial agreement
        - id: stage-delivery-readiness
          label: Delivery readiness
          actor: Operations, service, and fulfillment teams
          description: >-
            Service, financing, and assembly partners create some conversion scaffolding, but delivery timing,
            manufacturing start, and installed-base scale are still opaque.
          channels:
            - Service page
            - Service and Assembly
            - Partnerships page
        - id: stage-durability
          label: Durability / expansion
          actor: Retained customer or scaled fleet
          description: >-
            This is where the public record becomes thin: no renewal, churn, usage, or repeat-purchase data are
            disclosed, so durability remains a diligence item rather than a proven outcome.
          channels:
            - Retention metrics not disclosed
            - No public installed-base count
            - No public fleet renewal data
    approximationNotes: >-
      The journey is evidence-led but necessarily qualitative because Also has not published reservation conversion,
      delivery, or retention cohorts.
    claimRefs:
