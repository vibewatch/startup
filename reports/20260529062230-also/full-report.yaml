        - If response quality degrades, the core ride feel breaks
      - - Traction motor + control logic
        - Delivers propulsion, assist curves, regen behavior, and speed/class behavior
        - Motor design, inverter, firmware, safety logic
        - Novel architecture concentrates failure risk in software and motor control
      - - Battery pack + BMS + charging
        - Stores energy, powers bike, enables removable charging and USB-C output
        - Cell sourcing, thermal design, BMS tuning, pack enclosure
        - Cycle life, supplier concentration, and thermal validation are not public
      - - DreamRide software layer
        - Maps pedal input to ride modes, virtual gears, traction, hill flattening, and regulatory profiles
        - Firmware, calibration, UI logic, telemetry, update path
        - Regulatory or software bugs can affect classification, safety, or ride quality
      - - Portal display + phone/app experience
        - User interface for navigation, locking, ride settings, and alerts
        - Mobile app, connectivity stack, identity/authentication
        - Subscription dependency and app failure could degrade core ownership experience
      - - Modular top-frame latch + hardware interfaces
        - Allows multiple frame types and accessory/user configurations on one base vehicle
        - Electromechanical latch, frame coding, connectors, structural integrity
