  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition, modules, and public roadmap surface
        blocks:
          - type: paragraph
            body: >-
              Also’s current product should be understood as a small-EV platform expressed first through the TM-B, not
              as a conventional bicycle brand with a motor bolted onto a standard frame. Official materials describe
              small EVs as the canvas, an in-house technology platform as the enabling layer, and a lineup that will
              continue to expand. The customer workflow is broader than “ride a bike”: the same base system is being
              positioned for commuting, utility or family use, light cargo, and eventually denser commercial delivery
              through TM-Q-style derivatives. Public reviews consistently reinforce that framing. The TM-B is modular at
              the top-frame level, with consumer-oriented Solo and Comfort-like seating, utility rack variants, and
              software-aware configuration. Reviewers also highlight that the company wants one core architecture to
              span multiple use cases without asking buyers to learn several product categories. That makes the product
              definition strategically important. Also is not only selling a premium ride; it is testing whether one
              software-defined hardware core can cover multiple small-vehicle jobs while keeping differentiated control
              of the battery, propulsion, UI, and service stack.
