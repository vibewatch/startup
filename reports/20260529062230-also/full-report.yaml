      - number: '2.3'
        title: Buyer, User, Payer, and the Adoption Path by Segment
        blocks:
          - type: paragraph
            body: >-
              Buyer structure is one of the most important distinctions in this market because Also is trying to serve
              both consumer and commercial use cases. In personal TM-B purchases, buyer, user, and payer are often the
              same person or the same household, with financing reducing up-front cash friction and service access
              helping conversion after the initial test ride. In family and cargo use cases, the household still pays,
              but the daily users may be multiple adults or children, which makes reliability, safety, and accessory
              flexibility central to adoption. In TM-Q and delivery use cases, the equation changes materially: the user
              may be a courier or operator, the buyer may be a fleet manager or operations lead, and the payer may sit
              with a broader local-commerce, hospitality, education, or logistics budget. The live corporate-sales page
              and the DoorDash partnership show that this buyer path is not hypothetical. Budget ownership in the
              commercial segment is therefore likely to sit closer to operations, logistics, or fleet management than to
              HR or pure sustainability teams. The adoption path also looks different by segment. Consumer buyers can
              move from marketing interest to reservation, financing, and supported assembly. Commercial buyers
              generally need proof of serviceability, bike-lane legality, uptime, and lower total cost of ownership
              before a pilot expands into volume.
