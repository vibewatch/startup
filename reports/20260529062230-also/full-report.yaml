      - number: '7.2'
        title: >-
          Battery safety, classification, and autonomy-related permitting remain the clearest thesis-breakers because
          rules are tightening in 2026
        blocks:
          - type: paragraph
            body: >-
              Regulatory and safety risk is still the most binary part of the thesis. Also’s U.S.-style Class 3 framing,
              Europe and UK ambitions, throttle exceptions by jurisdiction, and TM-Q bike-lane ambitions already span
              more rule regimes than the company has publicly documented a compliance path for. CPSC and PeopleForBikes
              both point to a federal battery-safety regime moving toward stricter standards, and the CPSC’s April 2026
              data set shows a sizable e-bike injury and fatality base with battery fires as a recurring hazard pattern.
              State-level regulation is also moving: Illinois is drawing harder lines above 28 mph, while Massachusetts
              work is pushing speed-based categories, product standards, IDs, and delivery-sector study. DoorDash adds
              upside but also compounds the risk because autonomy or autonomy-adjacent delivery deployment introduces
              permitting, operating-domain, and safety-case questions that do not exist for a simple consumer bike
              launch. Also’s mitigation today is mostly design intent, marketing caveats, and the ability to constrain
              deployment scope. That is not nothing, but mitigation maturity is still low because there is no public
              UL-equivalent status, homologation matrix, or permit tracker. Residual exposure remains high until
              certification, operating boundaries, and jurisdiction-by-jurisdiction launch permissions are visible. The
              kill criteria are equally clear: no disclosed compliance path, or commercial deployment claims that outrun
              permits, should halt underwriting.
            claimRefs:
