        title: Public-comp framing and bull/base/bear valuation ranges
        blocks:
          - type: paragraph
            body: >-
              The public-comp set is useful as a boundary condition, not as a mechanical formula. NIU is the closest
              listed small-EV or two-wheel comparator and currently screens at only about 0.30x price-to-sales and 0.20x
              EV-to-revenue, which is a warning against assuming public markets pay premium multiples for hardware-led
              micromobility. Rivian is a much richer strategic EV reference at roughly 3.23x sales, but it is also much
              larger, much more disclosed, and still deeply loss-making, so it works better as an upper-bound narrative
              comp than as a direct transfer multiple. Lime adds a different lesson: scaled micromobility can generate
              real revenue and free cash flow, yet still carry enough liabilities to trigger a going-concern warning.
              That triangulation leads to a cautious current-value range. Bear lands around $500 million to $750 million
              if deliveries slip or financing resets. Base lands around $800 million to $1.05 billion if launch happens
              and the partner story holds without real economics disclosure. Bull reaches about $1.25 billion to $1.70
              billion only if deliveries, TM-Q commercialization, and autonomy pilots start proving platform leverage.
