      - number: '2.5'
        title: What the Market Evidence Still Cannot Prove
        blocks:
          - type: paragraph
            body: >-
              The current source base is good enough to prove that Also is attacking a real category, and that the
              category has both consumer and commercial demand signals. It is not good enough to prove the final
              commercial shape of the business. No public source gives a clean SAM for premium connected e-bikes plus
              quad-family vehicles plus delivery small EVs, which is exactly why a narrow, evidence-constrained sizing
              frame is more credible than a giant TAM claim. The more important missing pieces are internal: actual
              pipeline conversion, actual gross margin by vehicle, actual service density, and actual compliance
              readiness for each geography where Also may want to ship. Even the strongest external signals — Lime’s
              revenue scale, DoorDash’s order volume, and shared-mobility trip counts — are adjacent demand lenses, not
              proofs that Also will win a meaningful share. That is the right diligence conclusion for this chapter. The
              market is legitimate and strategically interesting because budgets, short-trip use cases, and substitute
              behavior are visible. But conviction on valuation should still wait for internal data that show whether
              Also can convert the category logic into repeatable economics and low-friction deployment.
            claimRefs:
              - CM044
              - CM046
              - CM047
              - CM048
              - CM050
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: Direct Peers, Substitutes, and Adjacent Small-EV Classes'
        blocks:
          - type: paragraph
            body: >-
              The competitive set is broader than a simple list of bike brands. Also’s closest direct peers are premium
              or connected consumer e-bike companies that sell ownership, design, and software experience into the same
              urban short-trip budget: Rad Power, Cowboy, Ampler, and Urtopia. But the premium-incumbent lens matters
              too. Specialized and Trek are not selling Also’s drive-by-wire architecture, yet they already own rider
              trust, shop-floor fit service, and dealer-backed repair surfaces that can make a safer premium alternative
              look more rational than a newer software-defined platform. Adjacent substitutes matter just as much. Lime
              and Bird compete for the same urban trip without ownership, NIU and similar small-EV OEMs compete through
              breadth and channel reach, and the default fallback can still be a conventional bicycle, a private car, or
              an already-deployed delivery van. Also’s own TM-Q and DoorDash work widen the frame again: for commercial
              buyers, the relevant alternative is whatever lowers cost per route, improves utilization, and can survive
              operational abuse. That is why this chapter treats the market as overlapping solution classes rather than
              pretending that one comparator table alone explains the buyer decision.
