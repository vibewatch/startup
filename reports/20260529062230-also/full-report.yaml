      - number: '3.2'
        title: 'Direct Consumer Peer Comparison: Price, Capability, and Distribution'
        blocks:
          - type: paragraph
            body: >-
              In the direct ownership set, the comparison splits four ways. Rad Power wins on breadth, lower price, and
              established utility positioning. Its current assortment stretches from roughly $1,299 to $2,399, and the
              company says it has served more than 450,000 customers with online, retail, and service-channel support in
              the U.S. and Canada. Cowboy wins on connectivity and refined urban simplicity, with GPS tracking, crash
              detection, adaptive power, and a refurbished entry point that broadens access. Ampler is closer to a
              design-led commuter bike company, competing through lightness, USB-C charging, test rides, and leasing
              rather than through heavy cargo or quad-like use cases. Urtopia competes most directly on the spec sheet
              by combining carbon construction, GPS, 4G, AI-assisted features, and a claimed 1,000-plus shop support
              story. Then there are premium incumbents like Specialized and Trek; they may lack Also’s drive-by-wire
              pitch, but they compete on brand familiarity, in-person service confidence, and safer dealer-backed
              ownership. Against that field, Also’s consumer advantage is not lowest price and not the densest current
              service footprint. Its best story is differentiated ride architecture, modularity, strong design, and the
              fact that the same platform logic stretches into the TM-Q. That creates a bridge from premium personal
              transport into higher-carry and commercial use cases. But until public service density, financing depth,
              and reliability data improve, buyers can still rationally prefer cheaper, more established, or more
              clearly supported alternatives.
