      - number: '1.3'
        title: Capital history and the stakeholder map now underwriting the story
        blocks:
          - type: paragraph
            body: >-
              The capital narrative moved quickly from incubation to scale. Also emerged with $105 million from Eclipse
              in March 2025, then added a July 2025 Greenoaks round that the company itself said valued the business at
              $1 billion. By March 2026, the company announced a $200 million Series C led by Greenoaks with Prysm
              Capital and DoorDash participating, which lets open sources reconstruct at least $305 million of disclosed
              funding. The stakeholder map now matters as much as the raw dollars. Rivian remains economically and
              strategically important because it still owns a minority stake and provides credibility, technical
              lineage, and potential retail leverage. Greenoaks is the headline valuation setter. Eclipse is the
              original external backer. DoorDash is more than just capital because it adds a commercial autonomy program
              and a governance touchpoint. Prysm matters as another late-stage financial sponsor. The diligence
              implication is that Also is already a multi-constituency cap-table story, not a simple
              founder-and-seed-investor case.
