      - number: '5.3'
        title: Dependencies, roadmap, and derivative vehicle logic
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a real roadmap beyond the first consumer bike, but the key constraint is now
              regulatory and operational execution rather than concept formation. Also already talks openly about TM-Q
              derivatives, a light commercial or delivery-oriented quad, and a broader people-and-goods mission. The
              DoorDash partnership strengthens that roadmap, yet the public sources only prove a collaboration to
              develop and deploy autonomous delivery over time; they do not disclose an autonomy stack, sensor package,
              operational design domain, or regulatory approvals inside TM-Q today. The legal envelope also matters.
              TM-B’s U.S. messaging centers on 28 mph pedal assist, 20 mph throttle, and software remapping in some
              jurisdictions, whereas UK EAPC rules cap continuous motor power at 250W and 15.5 mph before a vehicle
              becomes a moped or motorcycle. California and EU official pages in the source pack were not directly
              recoverable during this run, so cross-market classification still needs fresh retrieval or company
              documentation. Manufacturing proof is similarly thin. TM-Q is described as platform-sharing and
              automotive-standard tested, but the public record still does not show homologation files, battery
              certifications, or a contracted assembly footprint for derivative vehicles.
