      - number: '3.4'
        title: Moat Durability, Switching Costs, and Multi-Homing Risk
        blocks:
          - type: paragraph
            body: >-
              Also’s moat is promising, but not yet settled. The platform story is differentiated: DreamRide,
              software-defined controls, modularity, and the bridge from TM-B to TM-Q are all harder to mimic than a
              generic commuter frame. But the practical switching costs in this category are not software lock-in in the
              SaaS sense. They are service access, proprietary parts, financing, repair turnaround, and whether a buyer
              trusts the brand to survive. Those are exactly the areas where incumbents and adjacent players can apply
              pressure. Specialized and Trek can lean on dealer-backed fitting, service, and brand familiarity; Rad and
              Urtopia publicly speak to wider support surfaces than Also currently names; Cowboy and Ampler have cleaner
              urban positioning for buyers who care more about polished ownership than about quad optionality. Shared
              operators reduce lock-in further by letting users combine occasional rentals with a lower-cost personally
              owned bike, while cars and vans remain default options when reliability and carrying capacity matter more
              than novelty. For many buyers, multi-homing is easy: own one lower-priced e-bike, keep the car, and use
              shared fleets when needed. That means Also’s moat depends on execution quality and service reliability at
              least as much as on product originality. If the company proves dependable support and credible fleet
              deployment, the architecture can become a defensible advantage. If not, the current differentiation can
              still be arbitraged away by brands with better distribution or by substitutes that require less
              commitment.
