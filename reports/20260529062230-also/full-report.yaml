            body: >-
              DoorDash is both the strongest external proof point and a concentrated risk. The strategic investment,
              board seat, and multi-year collaboration validate relevance, but they also mean the public record is still
              anchored to one named commercial counterparty. TechCrunch’s note that Amazon had already ordered thousands
              of similar delivery vehicles from Rivian matters because it highlights the proof bar: the ecosystem has
              precedent for large-fleet validation, while Also itself still has limited disclosed deployment scope.
              Rivian lineage also cuts both ways. It brings credibility, tech leverage, and possible retail or scale
              benefits, but the parent ecosystem should not be mistaken for a standing guarantee of support. Meanwhile,
              consumer and fleet alternatives are already live. Cowboy, Rad, Ampler, Urtopia, NIU, Lime, and Bird show
              that customers can already buy, rent, or compare against established alternatives, many at lower price
              points or with real operating history. That is why competitive retaliation is not hypothetical: if Also
              launches late, launches expensively, or launches with thin service, incumbents can answer with
              availability, lower price, or simpler ownership. Mitigation maturity here is medium at best, residual
