              a fast, design-forward commuter; family / utility households using cargo and kid-carrying configurations;
              commercial fleets evaluating the TM-Q for lower-cost urban operations; delivery / logistics partners
              looking for bike-lane-capable cargo vehicles; and DoorDash as the one named autonomy / delivery partner.
