              - CV038
      - number: '8.2'
        title: Thesis versus anti-thesis at the current price anchor
        blocks:
          - type: paragraph
            body: >-
              The bull case is real. Also has authentic strategic lineage from Rivian, visible technology and product
              differentiation in TM-B, early field proof through test spins, and enough review and brand momentum to
              suggest the company is breaking through with premium riders. The DoorDash relationship further broadens
              the story from consumer bikes toward commercial and autonomous small-EV use cases. Market evidence also
              supports demand for short-distance small-vehicle trips, and Argonne’s work suggests privately owned
              micromobility is much larger than the shared-vehicle subset that usually gets measured. The anti-thesis is
              just as real. Product excitement is not the same thing as category economics. Also is still selling into
              premium consumer price points, reservation terms explicitly avoid delivery guarantees, and official
              materials do not disclose the operating metrics needed to prove that the platform can scale profitably.
              External commentary is already questioning whether a $3,500-$4,500 bike can reach volume economics, while
              sector failures at Bird, Rad Power, and VanMoof show how quickly tech-heavy micromobility businesses can
              run into financing, service, or repair burdens. Safety and classification rules add another layer of
              friction for international scale.
