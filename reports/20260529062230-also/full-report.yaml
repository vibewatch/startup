        - Conversion and financing proof
        - No credible funnel data showing deposits, financing attach, and order conversion at listed prices
        - Cut consumer-volume assumptions and treat the product as niche rather than scalable
      - - Battery / compliance
        - Certification path disclosure
        - No disclosed UL-equivalent path, lab evidence, or launch-market compliance matrix before broad delivery
        - Pause underwriting until certification evidence is provided
      - - Proprietary service burden
        - Early field-quality and warranty metrics
        - No city-level SLA, parts availability, OTA rollback plan, or first-time-fix evidence once deliveries begin
        - Assume higher support cost, lower NPS, and weaker referral-driven demand
      - - Manufacturing / supply chain
        - Production transparency and supplier resilience
        - Critical suppliers remain undisclosed, tariff pressure rises, or production proof stays absent near launch
        - Treat ramp timing and gross-margin assumptions as unreliable
      - - Capital intensity / runway
        - Burn and working-capital proof
        - No evidence of margin progress, inventory control, or warranty provisioning despite scale-up funding
        - Model additional capital need or avoid underwriting scale
      - - DoorDash concentration
        - Commercial milestone visibility
        - No public pilot milestones, unit commitments, or second named buyer
        - Downgrade fleet thesis to option value only
      - - Rivian ecosystem reliance
        - Support-boundary clarity
        - Investors still cannot tell what tech, retail, or operational support is truly committed versus implied
        - Do not underwrite ecosystem halo as a substitute for contractual proof
      - - Autonomy / regulatory uncertainty
        - Permit-backed deployment scope
        - Commercial autonomy narrative expands without clear ODD, permits, or safety-case detail
        - Treat autonomy upside as speculative and cap valuation credit
      - - Competitive retaliation
        - Availability and pricing gap
        - Incumbents keep live delivery, test-ride, or lower-price advantage while Also stays prelaunch or service-thin
        - Assume weaker conversion, lower pricing power, and tighter gross margin
    notes: >-
