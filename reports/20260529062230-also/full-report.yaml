              enablement, and

              fleet/autonomy development.


              What public evidence does not provide is the actual unit-economics bridge. There is no disclosed BOM,
              battery cost,

              warranty reserve, gross margin, refurbish rate, service cost per bike, return rate, or contribution margin
              by trim. That

              matters because the product itself is technologically ambitious: DreamRide is pedal-by-wire, regenerative,
              software-defined,

