  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation method, financing context, and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The right starting point for Also is a milestone-and-price-anchor framework, not a conventional revenue
              multiple or DCF. Open sources give investors two concrete marks: the March 2025 spinout with $105 million
              from Eclipse and the July 2025 Greenoaks-backed $1 billion valuation benchmark. They do not give the
              ingredients needed to underwrite a precise intrinsic-value model, because current public materials still
              omit revenue, unit shipments, gross margin, headcount, and reservation conversion. The March 2026 DoorDash
              / Prysm / Greenoaks Series C improves confidence that sophisticated capital still wants exposure, but the
              official announcement did not restate post-money valuation, preference terms, or the liquidation
              waterfall. That means a new investor should treat $1 billion as a reference point, not as clean
              common-equity fair value. Rivian’s retained minority stake and chair role explain why private investors
              might pay ahead of proof, but they do not eliminate dilution or preference-overhang risk. Entry discipline
              therefore matters more than admiration for the product.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV019
              - CV020
