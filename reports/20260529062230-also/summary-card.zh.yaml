summary:
  headline: >
    Also 拥有真实的 Rivian 工程基因、差异化 DreamRide 推进系统和 DoorDash 商业锚点；但它仍是量产前、收入前的硬件创业公司， 估值已达
    $1B。交付时间表、电池安全监管风险和资本需求仍未解决，让当前基准对新投资人风险偏高。
  overallScore: 5.5
