  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sam-sizing
    missingEvidence: A clean third-party TAM/SAM/SOM split for premium connected e-bikes, family quads, and delivery small EVs.
    whyItMatters: Without a clean market split, valuation work can overstate reach by importing all urban mobility spend.
    diligencePath: Request internal category sizing memos, retailer sell-through by segment, and any investor materials that bridge price bands to target geographies.
    relatedQuestionRefs:
    - QM020
    - QM021
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: fleet-conversion
    missingEvidence: Pipeline counts, pilot conversion rates, and average contract values for Also corporate or fleet opportunities.
    whyItMatters: Commercial demand is central to the TM-Q upside case but public sources only show intent, not actual booked demand.
    diligencePath: Request CRM pipeline exports, pilot scorecards, and any signed fleet letters of intent or commercial agreements.
    relatedQuestionRefs:
    - QM022
    - QM025
    relatedTableRefs:
    - TM004
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Contribution margin, battery cost curve, warranty reserve assumptions, and service attachment economics.
    whyItMatters: The category has repeatedly destroyed capital when warranty and service costs outpaced gross profit.
    diligencePath: Obtain the latest operating model or board deck with gross margin by vehicle, warranty claims, and service cost assumptions.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM005
  - type: missing-source
    severity: material
    topic: regulatory-portability
    missingEvidence: State-by-state and country-by-country compliance positioning for TM-B throttle behavior and TM-Q bike-lane legality.
    whyItMatters: Regulatory portability affects where the same platform can ship without redesign or reclassification.
    diligencePath: Ask counsel or homologation teams for product-by-jurisdiction compliance matrices and any pending approvals.
    relatedQuestionRefs:
    - QM018
    - QM025
    relatedTableRefs:
    - TM003
  - type: private-evidence-only
    severity: minor
    topic: service-density
    missingEvidence: Named service locations, uptime SLAs, and repair turnaround times for the partner service network.
    whyItMatters: Adoption will slow if buyers cannot validate post-sale support density in their region.
    diligencePath: Request the current service-partner roster, service-level agreements, and geographic coverage map.
