chapter:
  number: 2
  title: Market Analysis
  summary: Also sits in a narrow but meaningful small-EV market that spans premium connected e-bikes, family/cargo quads, and selected commercial delivery use cases rather than all urban mobility. Public evidence supports several useful sizing lenses — shared-micromobility trip volumes and fares, operator revenue scale, partner-delivery throughput, and current consumer price ladders — but it does not support a clean vendor-grade TAM/SAM/SOM split. The opportunity is real because short-trip substitution, bike-lane access, and commercial last-mile budgets are visible; the constraint is that regulation, battery safety, service density, and absent unit economics still limit conviction.
sections:
- id: market-boundary-and-substitutes
  title: Market Boundary, Included Spend, and Status-Quo Substitutes
  body: 'Also should be analyzed as a small-EV platform for short-distance people-and-goods movement, not as a generic bike brand and not as a full automotive company. Its current product surface anchors that definition. The TM-B is a class-3 e-bike priced at $3,500 to $4,500, while the TM-Q extends the same platform logic into a pedal-assisted four-wheel vehicle for cargo, family, and delivery workflows. Rivian’s spinout language and the launch press release both reinforce that framing by describing a platform intended to move people and goods, driven and autonomous. The included spend therefore covers premium personal e-bikes, family and cargo quads, fleet-oriented small EV deployments, after-sales service, and enabling financing. Excluded spend includes full-size passenger EVs, motorcycles and mopeds outside e-bike treatment, and the broad category of all local transportation spending. Status-quo substitutes vary by buyer: a commuter might choose a lower-cost cargo or commuter e-bike
    from Rad Power, Cowboy, Ampler, or Urtopia; a city or employer could rely on shared scooters or bikes from Bird or Lime; and a fleet operator could stay with conventional vans, legacy delivery routing, or higher-volume urban-mobility OEMs such as NIU. The practical market boundary is therefore a short-trip small-EV wedge where bike-lane access, lower operating cost, and software-defined vehicle behavior matter more than raw vehicle size.'
