- id: what-still-needs-diligence
  title: What the Market Evidence Still Cannot Prove
  body: 'The current source base is good enough to prove that Also is attacking a real category, and that the category has both consumer and commercial demand signals. It is not good enough to prove the final commercial shape of the business. No public source gives a clean SAM for premium connected e-bikes plus quad-family vehicles plus delivery small EVs, which is exactly why a narrow, evidence-constrained sizing frame is more credible than a giant TAM claim. The more important missing pieces are internal: actual pipeline conversion, actual gross margin by vehicle, actual service density, and actual compliance readiness for each geography where Also may want to ship. Even the strongest external signals — Lime’s revenue scale, DoorDash’s order volume, and shared-mobility trip counts — are adjacent demand lenses, not proofs that Also will win a meaningful share. That is the right diligence conclusion for this chapter. The market is legitimate and strategically interesting because budgets,
    short-trip use cases, and substitute behavior are visible. But conviction on valuation should still wait for internal data that show whether Also can convert the category logic into repeatable economics and low-friction deployment.'
