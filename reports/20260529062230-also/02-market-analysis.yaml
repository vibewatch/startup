- id: sizing-lenses-and-what-is-observable
  title: Sizing Lenses, Observable Demand, and the Limits of Clean TAM/SAM/SOM
  body: 'Public sources are strong enough to constrain the market with multiple lenses, but not strong enough to publish a precise single-source TAM. The clearest hard-demand signal comes from shared micromobility. USDOT says shared bikes and e-scooters produced more than 133 million trips in 2023, with most trips lasting about 15 minutes and roughly 37% replacing car trips. The same document says an average 1.5-mile bike or e-bike trip cost $2.30 to $5.50 in 2022; that implies a directly observable ride-spend proxy of roughly $306 million to $732 million for that use-case slice alone. A second lens comes from operator-scale revenue: TechCrunch says Lime’s IPO filing showed revenue growing to $886.7 million in 2025 across 230 cities and 29 countries, demonstrating that shared small-EV operations can reach material scale even when margins remain contested. A third lens comes from commercial-delivery adjacency: DoorDash says it generated nearly $75 billion of merchant sales across more than
    40 countries in 2025, and its 903 million fourth-quarter orders show how large the workflow is that Also is trying to touch with TM-Q. A fourth lens is the current consumer price ladder. Also, Rad Power, Cowboy, and other brands already show where buyer willingness exists. What public sources do not provide is a trusted external split between premium connected e-bikes, quad-family vehicles, and delivery small EVs by geography. That means the right diligence stance is evidence-constrained TAM/SAM/SOM, not a grandiose all-mobility headline number.'
