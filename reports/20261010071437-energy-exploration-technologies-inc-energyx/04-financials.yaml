company:
  name: Energy Exploration Technologies, Inc. (EnergyX)
chapter:
  number: 4
  title: Financials
  summary: EnergyX remains pre-commercial with negligible historical revenue and a $1.2 million monthly cash burn as of FY23 SEC disclosures, while advancing capital-intensive DLE projects backed by Eni's $225 million project equity and a conditional $690 million EXIM Bank loan LOI. Commercial underwriting is blocked by the absence of binding offtake agreements, unverified TaaS licensing rates, and reliance on management's internally benchmarked $1.3 billion revenue projection.
sections:
  - id: monetization-mechanisms
    title: Revenue Architecture and Commercial Monetization Streams
    body: |-
      Energy Exploration Technologies, Inc. (EnergyX) operates as a pre-commercial critical minerals technology developer seeking to establish three interrelated revenue streams. The primary commercial pillar is Technology-as-a-Service (TaaS) licensing, under which EnergyX plans to license its proprietary GET-Lit™ direct lithium extraction (DLE) membrane and separation technology to third-party lithium resource holders in exchange for quarterly per-tonne royalties tied to production volume. Under this licensing framework, licensees are expected to fund the direct capital expenditure required to fabricate and install the extraction hardware on-site, theoretically allowing EnergyX to scale its technology footprint without absorbing full balance-sheet asset ownership.

      The second revenue pillar is direct mineral resource development and offtake sales from wholly owned or project-level partnered brine assets. Through Project Black Giant in the Chilean Antofagasta region and Project Lonestar in the Smackover Formation of East Texas, EnergyX intends to extract and refine lithium into battery-grade carbonate and hydroxide for direct sale to automotive manufacturers and battery cell producers. In July 2026, Italian energy major Eni committed a $225 million minority equity investment into Project Black Giant, securing the right to lift up to approximately 25% of commercial production across the planned 52,500 tonnes per year facility.

      The third prospective revenue stream consists of recurring aftermarket replacement of proprietary consumable separation media. EnergyX intends to supply proprietary selective membranes, adsorbents, and solvent extraction reagents to licensed facilities on an estimated two-to-three-year replacement cycle. However, these monetization streams remain entirely pre-commercial. The company has not announced executed, binding take-or-pay offtake agreements with fixed pricing floors, leaving forward revenue recognition and cash timing subject to substantial execution risk.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI005
      - CI014
    tableRefs:
      - TI001
      - TI002
  - id: cost-structure-and-unit-economics
    title: Cost Structure, Unit Economics, and CapEx Benchmarks
    body: |-
      Evaluating the unit economics of EnergyX requires differentiating between preliminary engineering studies conducted on South American salar resources and operational benchmarks within North American domestic brine formations. For Project Black Giant in Chile, an engineering pre-feasibility study completed in collaboration with Worley projected capital expenditure of approximately $14,500 per tonne and direct operating costs of $2,944 per tonne of lithium carbonate equivalent. EnergyX positions these figures as industry-leading relative to traditional evaporation pond operators, which typically experience operating expenses between $4,000 and $9,100 per tonne while recovering only 30% to 40% of in-situ lithium over eighteen-month solar cycles.

      Based on these feasibility metrics and an assumed commodity price of $25,000 per metric tonne as of May 2026, management has modeled annual gross revenue of approximately $1.3 billion once both development phases reach full 52,500 tonnes per year capacity. However, independent diligence must treat this top-line figure as an illustrative, company-generated projection that is highly sensitive to commodity price volatility and unproven commercial-scale plant uptime.

      Domestic cost structures in the Smackover Formation present higher unit operating expenditures. Independent critical minerals research benchmarks direct lithium extraction operating costs between $4,000 and $7,000 per tonne of LCE in North America, driven by elevated electrical power consumption for mechanical pumping, chemical reagent consumption, and deep brine reinjection wells. In March 2026, EnergyX commissioned its 250 metric tons per year Lonestar demonstration facility in East Texas to validate these unit cost dynamics on local Smackover brine. Furthermore, in June 2026, EnergyX committed $230 million alongside Wildcat Discovery Technologies to construct a co-located LFP cathode active materials plant, attempting to integrate downstream conversion and capture higher midstream product margins.
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI009
      - CI015
