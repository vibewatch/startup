callouts:
  - calloutType: risk
    title: Offtake Execution and Revenue Timing Risk
    body: While EnergyX has secured high-profile equity partners including General Motors and Eni, commercial revenue realization remains dependent on converting memorandums and options into binding long-term take-or-pay purchase agreements across multi-year project development timelines.
    claimRefs:
      - CI003
      - CI005
      - CI014
  - calloutType: insight
    title: Project-Level Equity vs Corporate Valuation Divergence
    body: Eni's $225 million strategic equity commitment was executed directly at the Project Black Giant level rather than the EnergyX corporate entity. Underwriters must distinguish asset-level project finance from corporate equity value, particularly given the pre-revenue crowdfunding valuation claims.
    claimRefs:
      - CI004
      - CI010
      - CI011
