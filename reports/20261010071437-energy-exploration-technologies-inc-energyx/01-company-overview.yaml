company:
  name: Energy Exploration Technologies, Inc. (EnergyX)
chapter:
  number: 1
  title: Company Overview
  summary: Energy Exploration Technologies, Inc. (EnergyX) is an Austin-based energy technology company developing proprietary
    direct lithium extraction (DLE) systems, backed by strategic partnerships with Eni and General Motors, alongside an operational
    250-ton demonstration plant in Texas.
sections:
- id: executive-identity-and-governance
  title: Executive Identity and Corporate Governance
  body: Energy Exploration Technologies, Inc., commercially known as EnergyX, was founded by serial entrepreneur Teague Egan
    and incorporated in San Juan, Puerto Rico on December 18, 2018 (CO001). The company operates an Innovation Headquarters
    in Austin, Texas, alongside an operational regional office in Santiago, Chile to support its South American lithium brine
    interests, maintaining registered corporate presence in Puerto Rico (CO002). Executive governance is centered under Founder
    and Chief Executive Officer Teague Egan, supported by President of Lithium South America Juan Carlos Barrera, Chief Technology
    Officer Dr. Amit Patwardhan, and Chief Financial Officer Mayank Sharma (CO003). Advisory governance and scientific guidance
    include University of Texas polymer membrane pioneer Dr. Benny Freeman, former Alamo CEO Michael Egan, former Lazard partner
    Kris Haber, Endeavor CEO Ariel Emanuel, and independent director Paul Leggett (CO004). EnergyX reports a total workforce
    exceeding 100 professionals, comprising full-time staff and specialized technical consultants active across chemical synthesis,
    process engineering, membrane manufacturing, and field operations (CO015).
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO015
  tableRefs:
  - TO002
- id: capital-structure-and-strategic-partnerships
  title: Capital Structure, Valuation, and Strategic Partnerships
  body: EnergyX has amassed over $178 million in total capital raised through a hybrid financing model combining institutional
    venture rounds, non-dilutive government awards, and widespread retail equity crowdfunding spanning more than 49,000 individual
    investors (CO005). The company's active retail offering materials publish a management-set pre-money implied valuation
    of $3,258,556,886, calculated mechanically by multiplying total shares outstanding by the per-share offering price without
    independent third-party appraisal (CO006). In July 2026, Italian energy conglomerate Eni executed a major strategic partnership,
    committing $225 million in equity investment for a minority stake in Project Black Giant in Chile with rights to lift
    approximately 25% of commercial lithium output (CO007). This equity commitment supplements an official $690 million debt
    financing Letter of Interest issued by the U.S. Export-Import Bank (EXIM) to finance Project Black Giant's commercial
    facilities (CO008). These recent agreements build upon earlier strategic capitalization, most notably General Motors leading
    EnergyX's $50 million Series B round in 2022 to secure long-term battery raw material offtake options for its North American
    electric vehicle fleet (CO011).
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO008
  - CO011
  tableRefs:
  - TO001
  - TO003
- id: technology-platform-and-commercialization-milestones
  title: Technology Platform, Facilities, and Commercial Milestones
  body: On March 26, 2026, EnergyX achieved a critical domestic operational milestone by commissioning its Project Lonestar
    demonstration facility in Hooks, Texas, establishing the state's first direct lithium extraction plant processing Smackover
    formation brine with an annualized design capacity of 250 metric tons of battery-grade lithium hydroxide (CO009). The
    company deployed approximately $30 million in capital to construct and commission the Lonestar demonstration plant, which
    serves as the operational intermediary to qualify 5 to 25 ton customer samples ahead of a planned $1 billion commercial
    facility (CO010). The installation utilizes EnergyX's proprietary GET-Lit technology platform, an integrated separation
    portfolio combining nanofiltration membranes, solvent extraction, and adsorption mechanisms backed by more than 120 granted
    and pending patents (CO012). However, commercialization proceeds amid broader market friction; severe commodity price
    corrections in 2024 to approximately $14,000 per metric ton resulted in widespread project cancellations and domestic
    extraction idling across the lithium industry (CO013). EnergyX management acknowledges that commercial-scale DLE operations
    globally remain rare, and process energy intensity and extraction yields vary substantially according to localized brine
    chemistry (CO014).
  claimRefs:
  - CO009
  - CO010
  - CO012
  - CO013
  - CO014
