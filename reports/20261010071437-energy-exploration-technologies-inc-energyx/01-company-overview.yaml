    items:
    - date: '2018-12-18'
      label: Corporate Founding
      detail: Incorporated in San Juan, Puerto Rico by serial entrepreneur Teague Egan to develop advanced lithium extraction
        technologies.
    - date: '2020-05-15'
      label: GET-Lit Platform Development
      detail: Commenced proprietary direct lithium extraction membrane separation research and initial patent filings.
    - date: '2022-04-11'
      label: Series B Financing with GM
      detail: Secured $50M Series B round led by General Motors, establishing strategic automotive supply alignment.
    - date: '2023-09-20'
      label: Smackover Basin Acreage Acquisition
      detail: Amassed 47,500 gross acres in the Smackover brine formation across East Texas and Arkansas for domestic DLE
        expansion.
    - date: '2024-12-31'
      label: Macro Lithium Price Collapse
      detail: Global lithium carbonate spot prices declined to ~$14,000/ton, forcing industry-wide project delays while EnergyX
        maintained pilot testing.
    - date: '2026-03-26'
      label: Project Lonestar Commissioning
      detail: Commissioned the 250-ton/year demo plant in Hooks, Texas, following a $30M investment to prove commercial DLE
        extraction.
    - date: '2026-07-06'
      label: Eni $225M Investment in Black Giant
      detail: Executed strategic partnership with Eni investing $225M equity for a minority stake in Chile's Project Black
        Giant.
    - date: '2026-08-15'
      label: EXIM Bank $690M LOI
      detail: Received Letter of Interest from U.S. EXIM Bank for $690M in project debt financing for Project Black Giant
        commercial buildout.
