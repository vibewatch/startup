- calloutType: risk
  title: Commercialization and Valuation Disconnect
  body: While EnergyX reports an implied pre-money valuation of $3.26B based on retail offering share pricing, the company
    remains in a pre-commercial demonstration phase with unproven sustained project economics at industrial scale, set against
    a challenging macro lithium price environment.
  claimRefs:
