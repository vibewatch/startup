  - id: FE001
    title: GET-Lit™ end-to-end direct lithium extraction processing stack
    type: stack
    summary: >-
      Integrated five-layer flowsheet showing the progression from raw brine intake through multi-stage physical and
      chemical separation to commercial battery-grade product.
    data:
      layers:
        - label: Raw Brine Feed & Pretreatment
          detail: Intake of subterranean salar or oilfield brine followed by filtration to remove solids and hydrocarbons.
          items:
            - Subsurface Well Intake
            - Particulate Filtration
            - Temperature & Pressure Conditioning
        - label: Selective Lithium Adsorption (AX)
          detail: Engineered sorbent bead contactors capturing lithium molecules preferentially from high-salinity brine.
          items:
            - Sorbent Contact Columns
            - Brine Depletion & Rinse
            - Low-Volume Water Elution
        - label: Solvent Extraction Concentration (SX)
          detail: Organic solvent phase transfer concentrating intermediate brine up to 60,000 ppm lithium.
          items:
            - Liquid-Liquid Extraction Contactors
            - Phase Separation & Scrubbing
            - Acid Recovery Stripping
        - label: Selective Membrane Purification (MX)
          detail: GET-Lit™ proprietary membranes separating lithium ions from remaining multivalent impurities.
          items:
            - Tunable Aperture Membrane Housings
            - Multi-Stage Crossflow Filtration
            - Polishing & Ion Exchange
        - label: Refining & Product Conversion
          detail: Chemical conversion into battery-grade lithium hydroxide or carbonate.
          items:
            - Lithium Hydroxide Crystallization
            - Battery-Grade Packaging (5-25t batches)
            - Purity Qualification Testing
        - label: Aquifer Stewardship & Reinjection
          detail: Closed-loop reinjection of lithium-depleted brine into subterranean formations.
          items:
            - Pressure Management & Pumping
            - Subsurface Injection Wells
            - Aquifer Monitoring Systems
    approximationNotes: >-
      Flowsheet architecture illustrates the functional stages disclosed in EnergyX technical resources and patent
      applications.
