      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Demonstration Milestone at Project Lonestar
            body: >-
              Commissioning the 250-ton Lonestar demonstration plant validates EnergyX's mechanical and chemical
              flowsheet on Texas Smackover brine, providing vital empirical data and qualification volumes, though
              commercial scale-up requires a 200-fold expansion to reach 50,000-ton industrial targets.
            calloutType: insight
            claimRefs:
              - CE007
              - CE008
              - CE010
          - type: callout
            title: Unproven Industrial-Scale Membrane Durability and Reagent Replacement
            body: >-
              While EnergyX plans for 2-to-3-year replacement cycles for membranes and chemical extractants in
              technology licensing agreements, real-world continuous operation under extreme osmotic pressures and
              corrosive brine chemistries has not been demonstrated beyond pilot runs.
            calloutType: risk
            claimRefs:
              - CE006
