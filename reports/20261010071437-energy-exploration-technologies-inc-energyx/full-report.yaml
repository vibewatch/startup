      - number: '2.3'
        title: Buyer Segmentation, Workflow Ownership, and Procurement Pathways
        blocks:
          - type: paragraph
            body: >-
              Adoption pathways in the lithium chemicals market differ fundamentally across buyer archetypes, varying in
              workflow ownership, qualification requirements, and capital commitment. The primary buyer tier comprises
              global automotive OEMs, exemplified by General Motors, which led EnergyX's Series B financing round to
              secure direct offtake rights toward its internal target of sourcing 400,000 tons of lithium annually by
              2035. Automotive buyers procure through multi-year offtake arrangements directly supervised by corporate
              supply chain executives, frequently incorporating floor-price clauses near $15,000 per ton to shield
              prospective producers from price volatility while ensuring Inflation Reduction Act (IRA) domestic sourcing
              compliance. A secondary buyer tier consists of battery cathode manufacturers such as POSCO, whose
              procurement depends strictly on chemical qualification standards, including 99.5% carbonate purity and
              strict tolerances for iron and sodium impurities. Finally, resource holders and oilfield operators across
              the Gulf Coast Smackover Formation represent a distinct enterprise licensing segment, evaluating DLE
              systems to monetize lithium co-products from brine without deploying balance-sheet capital into full
              chemical refining operations.
            claimRefs:
              - CM006
              - CM011
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM011
              - CM013
      - number: '2.4'
        title: Adoption Drivers, Structural Bottlenecks, and Sizing Gaps
        blocks:
          - type: paragraph
            body: >-
              Market expansion for DLE is propelled by strong structural tailwinds, including tightening automotive
              emissions standards, grid-scale energy storage mandates requiring four-hour battery durations in
              California and Europe, and Western legislative mandates pushing for critical mineral independence.
              However, severe adoption constraints govern commercialization timing. The most significant structural
              bottleneck is the global conversion choke point: China controls approximately 70% to 75% of worldwide
              lithium chemical refining capacity and has historically operated conversion assets with narrow margins,
              leaving Western standalone extraction projects economically vulnerable without localized refining.
              Furthermore, capital intensity in commercial DLE remains formidable; Benchmark Mineral Intelligence
              estimates commercial plants require $300 million to $500 million in capex for 10,000 to 20,000 tons of
              annual capacity, and EnergyX projects approximately $1 billion in capital expenditure for its 50,000 tpa
              Texas facility. While strategic backing from Eni and General Motors provides critical institutional
              validation, EnergyX has not publicly disclosed binding, long-term commercial offtake contracts with
              transparent volume schedules and price floors for Project Lonestar output, leaving long-term revenue
              realization subject to commodity price cyclicality and financing execution.
            claimRefs:
              - CM008
              - CM010
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Midstream Refining Choke Point Drives Sizing Divergence
            body: >-
              While raw lithium reserves are globally dispersed across North American oilfields and South American
              salars, chemical conversion remains concentrated with China controlling 70% to 75% of refining capacity.
              EnergyX's co-location of DLE extraction and refining at Project Lonestar directly addresses this
              bottleneck, though scaling from demonstration to commercial throughput requires closing significant
              capital gaps.
            calloutType: insight
            claimRefs:
              - CM010
              - CM013
          - type: callout
            title: Downstream Price Cyclicality and Capital Intensity Risk
            body: >-
              With commercial DLE projects requiring $300M to $500M per 10k-20k tpa of capacity and Benchmark spot
              carbonate trading near $19,750 per tonne, lack of disclosed binding commercial offtake contracts with
              price floors leaves planned multi-billion-dollar commercial expansions exposed to commodity downturns.
            calloutType: risk
            claimRefs:
              - CM004
              - CM008
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Direct DLE Peers, Incumbents, and Substitutes'
        blocks:
          - type: paragraph
            body: >-
              EnergyX operates within an evolving global lithium supply chain that is transitioning from traditional
              extraction methods toward modular, direct extraction technologies. The competitive arena spans three
              distinct peer groups: venture-backed direct lithium extraction (DLE) technology developers such as Lilac
              Solutions and Aepnus; incumbent brine producers including Albemarle and SQM operating massive continental
              evaporation systems in South America and Nevada; and hard-rock pegmatite miners in Australia and China
              that extract spodumene through open-pit mining. In addition, large integrated energy companies such as
              ExxonMobil have acquired extensive acreage across the Smackover Formation to deploy proprietary or
              licensed DLE systems, while automotive manufacturers like Tesla have vertically integrated into domestic
              lithium refining. EnergyX differentiates by positioning its GET-Lit™ system as a hybrid platform capable
              of tailoring adsorption, solvent extraction, and membrane separation to diverse brine chemistries, whereas
              single-mechanism peers face extraction trade-offs across varying salinity and impurity profiles.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: Technology Architecture and Extraction Capability Matrix
        blocks:
          - type: paragraph
            body: >-
              The primary technical benchmark separating direct lithium extraction from status-quo methods centers on
              cycle time, recovery efficiency, and chemical intensity. Conventional continental solar evaporation
              requires 12 to 18 months of open-air concentration, loses 40% to 60% of original lithium in situ, and
              depends on vast land tracts and favorable arid climates. Similarly, hard-rock spodumene mining involves
              energy-intensive crushing, flotation, and acid roasting. In contrast, EnergyX claims that its GET-Lit™
              platform achieves lithium recovery rates exceeding 90% within hours, utilizing closed-loop brine
              reinjection to minimize environmental and water footprints. EnergyX has demonstrated this capability at
              its Project Lonestar plant in Texas, commissioned in early 2026 with a 250 metric ton per year
              demonstration capacity. However, independent technical verification of continuous operating availability,
              membrane fouling rates, and commercial-scale unit operating costs remains a critical diligence hurdle as
              EnergyX scales beyond pilot demonstrations toward multi-thousand-ton facilities.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: Commercial Contracts, Procurement Cycles, and Switching Dynamics
        blocks:
          - type: paragraph
            body: >-
              EnergyX pursues a dual commercial strategy intended to capture value both as an intellectual property and
              equipment provider and as a direct lithium resource owner. In technology licensing, EnergyX targets major
              mining conglomerates and resource holders like POSCO and ExxonMobil. However, institutional lithium
              licensing entails protracted 24- to 36-month sales cycles, as mining majors evaluate
              multi-hundred-million-dollar final investment decisions with conservative engineering thresholds. To avoid
              total dependency on third-party adoption, EnergyX has aggressively pursued direct resource ownership and
              joint venture partnerships. These include an agreement with Compass Minerals to develop the 30,000 tpa
              Project Powder Hound in Utah, where EnergyX funds and operates the extraction facility while paying
              production license fees. Concurrently, EnergyX secured a $225 million strategic equity investment from
              Italian energy major Eni for a minority stake in the 52,500 tpa Project Black Giant in Chile, supported by
              an offtake agreement covering roughly 25% of output and a $690 million debt letter of intent from the U.S.
              EXIM Bank.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Moat Defensibility, Downstream Refining Choke Points, and Displacement Risks
        blocks:
          - type: paragraph
            body: >-
              A structural vulnerability in Western lithium commercialization is the severe geographic bottleneck in
              downstream chemical conversion. While direct lithium extraction addresses upstream brine extraction speed
              and recovery, China controls approximately 70% to 75% of global lithium refining capacity and has
              historically suppressed processing margins. Western DLE producers that output intermediate concentrates
              rather than battery-grade lithium hydroxide or carbonate remain vulnerable to Chinese tolling power and
              market price volatility. EnergyX seeks to insulate its economics by integrating refining directly into its
              production footprint at Project Lonestar and Project Powder Hound, mirroring the downstream strategy
              demonstrated by Tesla's Robstown lithium refinery in Texas. Furthermore, EnergyX claims an
              industry-leading capital intensity of $12,500 to $14,500 per ton across its planned Utah and Chile
              operations. Defending this competitive moat requires EnergyX to maintain strict patent protection across
              its 140+ filed patents while proving that commercial-scale operating expenditures can remain resilient
              against depressed lithium chemical prices.
            claimRefs:
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial Inertia and Multi-Billion-Dollar Licensing Sales Cycles
            body: >-
              EnergyX's dual business model attempts to mitigate adoption friction by developing proprietary resources
              while marketing DLE technology to mining incumbents like POSCO and ExxonMobil. However, mining majors face
              multi-hundred-million-dollar final investment decisions with 24- to 36-month evaluation cycles, creating
              substantial commercial inertia that forces EnergyX to shoulder heavy capital commitments on its own
              projects.
            calloutType: risk
            claimRefs:
              - CP001
              - CP003
          - type: callout
            title: Downstream Chinese Refining Dominance Constrains Western Extraction Moats
            body: >-
              While DLE shortens brine extraction from 18 months to hours, global lithium chemical refining remains a
              severe geopolitical bottleneck, with China controlling roughly 70% to 75% of global conversion capacity
              and deliberately suppressing margins. Without captive, cost-competitive domestic refining such as
              EnergyX's planned Project Lonestar and Tesla's Robstown plant, upstream brine developers remain
              structurally dependent on foreign chemical processors.
            calloutType: insight
            claimRefs:
              - CP004
              - CP005
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Architecture and Commercial Monetization Streams
        blocks:
          - type: paragraph
            body: >-
              Energy Exploration Technologies, Inc. (EnergyX) operates as a pre-commercial critical minerals technology
              developer seeking to establish three interrelated revenue streams. The primary commercial pillar is
              Technology-as-a-Service (TaaS) licensing, under which EnergyX plans to license its proprietary GET-Lit™
              direct lithium extraction (DLE) membrane and separation technology to third-party lithium resource holders
              in exchange for quarterly per-tonne royalties tied to production volume. Under this licensing framework,
              licensees are expected to fund the direct capital expenditure required to fabricate and install the
              extraction hardware on-site, theoretically allowing EnergyX to scale its technology footprint without
              absorbing full balance-sheet asset ownership.


              The second revenue pillar is direct mineral resource development and offtake sales from wholly owned or
              project-level partnered brine assets. Through Project Black Giant in the Chilean Antofagasta region and
              Project Lonestar in the Smackover Formation of East Texas, EnergyX intends to extract and refine lithium
              into battery-grade carbonate and hydroxide for direct sale to automotive manufacturers and battery cell
              producers. In July 2026, Italian energy major Eni committed a $225 million minority equity investment into
              Project Black Giant, securing the right to lift up to approximately 25% of commercial production across
              the planned 52,500 tonnes per year facility.


              The third prospective revenue stream consists of recurring aftermarket replacement of proprietary
              consumable separation media. EnergyX intends to supply proprietary selective membranes, adsorbents, and
              solvent extraction reagents to licensed facilities on an estimated two-to-three-year replacement cycle.
              However, these monetization streams remain entirely pre-commercial. The company has not announced
              executed, binding take-or-pay offtake agreements with fixed pricing floors, leaving forward revenue
              recognition and cash timing subject to substantial execution risk.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
              - CI014
          - type: table
            tableRef: TI001
            claimRefs:
