  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: GET-Lit™ Platform Architecture and Brine Separation Mechanics
        blocks:
          - type: paragraph
            body: >
              EnergyX positions its core technology platform, branded as GET-Lit™ (formerly LiTAS™), as an integrated
              brine-to-battery direct lithium extraction architecture. Conventional lithium brine recovery relies on
              vast evaporation ponds across salt flats that require 12 to 24 months to concentrate salts, achieving
              modest lithium recovery rates between 30% and 60% while permanently losing millions of gallons of water to
              the atmosphere. In contrast, EnergyX’s engineered process is designed to selectively isolate lithium ions
              directly from subterranean salar and oilfield brines within hours, returning depleted brine back to
              subsurface aquifers.


              The core GET-Lit™ processing flowsheet combines three unit operations: adsorption (AX), solvent extraction
              (SX), and selective membrane separation (MX). Sorbent beads selectively capture lithium from raw, filtered
              brine with high recovery. Next, proprietary solvent extraction chemical reagents purify and concentrate
              the intermediate eluate to lithium concentrations as high as 60,000 parts per million. Finally, selective
              transport membranes featuring engineered, tunable apertures separate lithium ions from competing
              monovalent and multivalent impurities (including sodium, magnesium, calcium, and boron), enabling direct
              conversion into battery-grade lithium carbonate or lithium hydroxide.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
