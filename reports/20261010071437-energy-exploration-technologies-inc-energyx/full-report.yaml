      - number: '5.2'
        title: Facility Footprint, Demonstration Plants, and Scaling Milestones
        blocks:
          - type: paragraph
            body: >
              The commercialization trajectory of DLE is dictated by transition from bench pilots to multi-thousand-ton
              industrial facilities. In March 2026, EnergyX commissioned its Project Lonestar demonstration plant at the
              TexAmericas Center near Texarkana, Texas, establishing the largest operational DLE facility in the United
              States. Designed with an operating capacity of approximately 250 metric tons per year of battery-grade
              lithium carbonate equivalent (LCE), Lonestar represents the first operational facility extracting lithium
              from raw Smackover formation brine in Texas.


              Lonestar serves as the operational precursor to commercial-scale deployment across EnergyX's domestic and
              international resource holdings. The facility provides 5-ton to 25-ton battery-grade qualification samples
              to electric vehicle OEMs, cathode producers, and strategic partners, including General Motors and POSCO.
              Historically, EnergyX validated early containerized pilot units in Bolivia, reporting up to 94% lithium
              recovery without supplemental freshwater consumption. In South America, EnergyX is advancing Project Black
              Giant in the Salar de Punta Negra in Antofagasta, Chile, targeting 52,500 metric tons per year of
              commercial capacity across two phases backed by Eni's $225 million strategic investment and a $690 million
              debt letter of interest from the U.S. EXIM Bank.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE001
