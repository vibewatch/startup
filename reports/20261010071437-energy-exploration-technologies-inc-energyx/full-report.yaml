      - number: '4.3'
        title: Capital Adequacy, Cash Burn, and Financing Structure
        blocks:
          - type: paragraph
            body: >-
              EnergyX has funded its multi-year research and project development through an atypical dual-track capital
              structure combining strategic industrial corporate investment with substantial retail equity crowdfunding.
              Through mid-2026, the company reported cumulative equity capital raised exceeding $178 million from more
              than 49,000 investors across successive Regulation A+ and Regulation CF offerings alongside strategic
              checks from General Motors Ventures, POSCO-linked funds, and Eni Next. However, historical public
              disclosures filed with the SEC underscore significant capital consumption and ongoing corporate cash burn.


              In its fiscal year 2023 disclosures via DealMaker Securities, EnergyX reported full-year commercial
              revenue of just $210,250 against cost of goods sold of $15,777,050 and a net accounting loss of
              $14,937,941. At year-end 2023, the corporate balance sheet held $20,475,353 in cash and equivalents
              against an operational cash burn rate of approximately $1.2 million per month, implying an operating
              runway of roughly 16.4 months in the absence of subsequent financing rounds.


              To bridge the substantial capital gap required for commercial-scale deployment, EnergyX has pivoted toward
              non-dilutive project financing and asset-level equity. In July 2024, the U.S. Export-Import Bank issued a
              non-binding Letter of Intent for $690 million in debt financing to fund commercial construction for
              Project Black Giant. This debt facility is intended to complement Eni's $225 million project equity
              commitment, which funds development at the asset level rather than flowing into the parent corporate
              treasury. EnergyX remains dependent on finalizing definitive debt agreements and completing additional
              equity rounds, such as a prospective Series C, to fund corporate overhead and domestic Smackover
              expansions.
