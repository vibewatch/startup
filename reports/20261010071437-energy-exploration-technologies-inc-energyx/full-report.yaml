      - number: '6.2'
        title: Commercial Traction, Pilot Deployments, and Named Customer Proof
        blocks:
          - type: paragraph
            body: >-
              EnergyX does not yet sell lithium commercially, generating only development-stage revenues from
              preliminary services and equipment deliveries. In fiscal year 2025, the company reported approximately
              $1.3 million in total revenue, comprising roughly $244,000 from testing customer brine samples and $1.1
              million from selling membrane separation equipment. Demonstration-scale validation advanced in March 2026
              when EnergyX unveiled its 250-ton-per-year Project Lonestar DLE plant near Texarkana, Texas, processing
              locally sourced Smackover brine. Named commercial proof remains centered on strategic corporate partners
              rather than arms-length technology licensees: General Motors led EnergyX's Series B financing round and
              holds offtake rights for future lithium production, while Italian global energy major Eni entered a
              binding $225 million strategic equity investment in July 2026 for a minority stake in Project Black Giant
              in Antofagasta, Chile, securing options to lift 25% of the project's planned 52,500 tons per year of
              lithium carbonate. Additional downstream joint ventures include site control secured at TexAmericas Center
              for a proposed $500 million, 15,000-metric-ton LFP cathode plant with Wildcat Discovery Technologies,
              although this project remains contingent on site purchase options, environmental permitting, and external
              financing.
            claimRefs:
