      - number: '6.3'
        title: Retention Durability, Expansion Friction, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Customer retention metrics such as Net Revenue Retention (NRR) and Gross Revenue Retention (GRR) are not
              calculable or economically meaningful for EnergyX at its current pre-commercial juncture. Brine testing
              services represent discrete, non-recurring fee-for-service evaluations rather than predictable software or
              recurring consumable contracts. Customer concentration is acute: 100% of product equipment revenue in 2025
              derived from isolated demonstration hardware deliveries, and future commercial revenue is heavily
              concentrated in two strategic counterparties (Eni and GM). Furthermore, partner execution risks have
              mounted: GM recorded approximately $6 billion in EV-related impairment charges in early 2026 as retail EV
              adoption cooled following tax credit expirations, raising questions regarding the timing and volume of
              automotive offtake requirements. Simultaneously, cathode partner Wildcat Discovery Technologies was
              acquired for $73 million by Swedish battery startup Holyvolt, an unproven entity developing screen-printed
              battery cells that has yet to demonstrate commercial manufacturing at scale. Compounded by cumulative net
              losses of $73.3 million through year-end 2025 and formal going-concern explanatory warnings from
              independent auditors, EnergyX faces material execution hurdles before customer traction translates into
              self-sustaining commercial cash flow.
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Zero Commercial Offtake Execution Despite High-Profile Strategic Alliances
            body: >-
              While EnergyX has successfully secured high-profile corporate partners including Eni and General Motors,
              neither relationship has yielded binding, unconditional commercial product offtake deliveries. Eni's $225
              million commitment is ring-fenced at the Chilean project asset level, giving Eni a minority stake and an
              option to lift 25% of output, rather than representing an upfront revenue-generating technology license.
              GM's strategic partnership provides offtake priority, but macro EV market corrections and subsidy
              rollbacks introduce uncertainty regarding the volume and timing of future automotive procurement demand.
            calloutType: risk
            claimRefs:
              - CU009
              - CU010
              - CU015
          - type: callout
            title: Demonstration-Scale Proving Grounds as Gateways to Mining Licensing
            body: >-
              In resource extraction technology, global mining conglomerates and chemical operators rarely execute
              technology licensing agreements without inspecting continuous operational run data from field-scale
              demonstration plants. EnergyX's commissioning of the 250-ton-per-year Project Lonestar demonstration plant
              in March 2026 serves as an indispensable pre-requisite to bridge the gap between benchtop brine testing
              ($244,000 in 2025) and commercial-scale equipment orders, enabling potential enterprise customers to
              verify lithium selectivity and recovery rates in real-world conditions.
            calloutType: insight
            claimRefs:
              - CU004
              - CU007
              - CU008
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Concession, and Jurisdictional Risk
        blocks:
          - type: paragraph
            body: >-
              EnergyX's resource development strategy is exposed to substantial geopolitical and regulatory hurdles
              across South American and North American jurisdictions. In South America, the company's historical
              disqualification by the Bolivian government in June 2022 from the Uyuni and Pastos Grandes salt flat
              tender illustrates the acute sovereign risk inherent in nationalized lithium reserves. In Chile, where
              EnergyX has secured 100,000 acres in the Domeyko Range near Salar de Punta Negra for Project Black Giant,
              commercial development remains subject to environmental approvals, water extraction constraints, and
              national lithium strategy frameworks. While the election of pro-business leadership in Chile has created a
              more favorable foreign investment climate, definitive Special Lithium Operation Contracts (CEOLs) and
              community consultation processes present protracted timelines that could delay construction. In North
              America, EnergyX has amassed approximately 50,000 acres across the Smackover formation, including the 2025
              acquisition of Daytona Lithium for $4 million cash and $22 million in stock options. However, large-scale
              commercial extraction in Texas and Arkansas faces evolving state-level subsurface reinjection rules and
              environmental permitting requirements under EPA Class II and Class V injection frameworks.
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR005
              - CR006
      - number: '7.2'
        title: Operational Scalability and Process Technology Risk
        blocks:
          - type: paragraph
            body: >-
              The core technical risk centers on scaling EnergyX's proprietary GET-Lit platform from demonstration units
              to continuous, commercial-scale production. While the company successfully commissioned a 250 ton-per-year
              demonstration plant at Project Lonestar near Texarkana, Texas, in early 2026 to produce customer
              qualification samples, demonstration facilities do not prove multi-year membrane durability under
              high-volume industrial conditions. The GET-Lit architecture combines adsorption, solvent extraction, and
              lithium-selective membranes, targeting over 90% recovery in hours compared to 12 to 18 month evaporative
              cycles. However, industry competitors and technical consultants have expressed skepticism regarding claims
              that lack published third-party engineering studies, particularly regarding membrane fouling, chemical
              reagent consumption, and selectivity degradation under high total dissolved solids. EnergyX previously
              issued a cease-and-desist letter to an industry consultant who publicly questioned its marketing claims,
              highlighting sensitivity around independent technical scrutiny. Furthermore, scaling Project Black Giant
              to 52,500 tpy involves an estimated $1 billion in capital expenditure, where unanticipated engineering
              redesigns or equipment delays could lead to severe capital cost overruns.
            claimRefs:
              - CR002
              - CR006
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR009
              - CR010
      - number: '7.3'
        title: Partner Concentration and Capital Dependency
        blocks:
          - type: paragraph
            body: >-
              EnergyX's commercialization path relies heavily on a narrow group of strategic partners and debt
              providers. In July 2026, Italian energy major Eni committed $225 million of equity for a minority stake in
              Project Black Giant, securing the right to lift approximately 25% of future lithium carbonate production.
              While Eni's backing significantly de-risks the equity component of Phase 1 and Phase 2 development, the
              overall project finance structure remains contingent on a $690 million non-binding Letter of Intent from
              the U.S. EXIM Bank. Failure to convert this LOI into a definitive credit facility with acceptable debt
              service covenants would create an immediate multi-hundred-million-dollar funding deficit. Furthermore,
              anchor automotive partner General Motors holds production offtake rights from its Series B investment,
              creating customer concentration risk if GM alters its battery cathode chemistry or delays commercial
              off-take volumes. These internal dependencies are exacerbated by external market dynamics: Chinese
              converters control 70% to 75% of global lithium chemical refining capacity and historically suppress
              margins, creating sustained price volatility that threatens western direct extraction unit economics.
            claimRefs:
              - CR004
              - CR007
              - CR008
              - CR011
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR007
              - CR008
              - CR014
      - number: '7.4'
        title: Risk Heatmap, Mitigations, and Thesis-Break Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Synthesizing EnergyX's exposure across regulatory, operational, partner, and market dimensions reveals
              that the investment thesis breaks under two primary failure scenarios: project financing collapse and
              commercial DLE underperformance. The primary mitigations identified by management include securing Eni's
              upstream engineering capabilities, deploying modular containerized systems to lower upfront capital
              intensity, and pursuing non-dilutive federal debt backing through the U.S. EXIM Bank. However, clear kill
              criteria must govern diligence monitoring. A failure by EXIM Bank to formalize the $690 million loan
              within the projected development window would halt Black Giant construction and trigger emergency equity
              dilution. Similarly, if commercial recovery rates at Project Lonestar fall below 80% or if battery-grade
              product fails OEM qualification testing, EnergyX's projected cost advantages ($2,944/ton OpEx and
              $14,500/ton CapEx) would evaporate. Prospective investors must condition capital deployment on verified
              third-party engineering audits and binding offtake contracts rather than non-binding memoranda.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR007
              - CR010
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR007
              - CR010
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Financing and Commercialization Cliff: The Transition from Pilot to 52,500 tpa'
            body: >-
              EnergyX has demonstrated technical viability at pilot and 250 tpy demonstration scale, but faces an acute
              commercial execution hurdle. Converting the $690 million non-binding LOI from the U.S. EXIM Bank into
              definitive drawdown financing and scaling DLE membranes to 52,500 tpy at Project Black Giant represent
              unproven operational milestones where technical or capital failure would break the investment thesis.
            calloutType: risk
            claimRefs:
              - CR004
              - CR010
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision and price discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is TRACK rather than invest. Eni's $225 million commitment is substantive, but it
              purchases a minority interest in Project Black Giant rather than establishing an arm's-length valuation
              for EnergyX common equity. The company's fundraising page states a $3.259 billion pre-money implied
              valuation, while KingsCrowd lists a September 2026 offering valuation of $1.921 billion. Those marks
              differ materially and cannot be reconciled from the available share-count, security, preference, and
              dilution disclosures. At the same time, independent coverage describes commercial execution as the central
              risk. Entry discipline therefore requires current audited financials, a fully diluted capitalization
              table, the applicable security terms, and evidence that commercial output can bridge the disclosed
              demonstration-to-production gap.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV013
