      - number: '8.3'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that strategic capital, a commissioned 250-ton-per-year demonstration facility, and a
              company plan for 52,500 tons per year at Black Giant create valuable technical and resource optionality.
              Management's project model points to $1.3 billion of annual gross revenue, but only after both phases
              operate and at an assumed lithium price of $25,000 per metric ton. The anti-thesis is that DLE remains
              lightly proven at full commercial scale, the next disclosed production target is orders of magnitude above
              the demonstration plant, and lithium benchmark indices were negative in the retrieved snapshot. The
              investment case therefore turns on verified throughput, recovery, purity, operating cost, permitting,
              financing drawdown, and realized pricing rather than on gross-revenue targets alone.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
