      - Subsystem / Component
      - Operational Role
      - Critical Dependency
      - Technical Risk / Vulnerability
    rows:
      - - Feedstock Pretreatment
        - Filtration & Clarification Units
        - Removes suspended solids, hydrocarbons, and particulates from raw brine
        - Consistent raw brine inflow chemistry and temperature
        - Filter clogging from high-turbidity brines requiring frequent backwashing
      - - Direct Extraction (AX)
        - Engineered Sorbent Beads (Adsorption)
        - Selectively binds lithium ions from raw brine; releases via water wash
        - Sorbent mechanical durability and thermal resistance
        - Capacity loss, bead attrition, and slow desorption kinetics over repeated cycling
      - - Chemical Concentration (SX)
        - Solvent Extraction Contactors & Reagents
        - Transfers lithium to organic phase and recovers concentrated eluate up to 60,000 ppm
        - Specialty organic extractant reagents and acid recovery loops
        - Organic phase carryover, solvent loss in aqueous raffinate, and flammability controls
      - - Membrane Refining (MX)
        - GET-Lit™ Tunable Aperture Polymer Membranes
        - Selectively separates lithium from remaining mono/multivalent ions
        - Membrane module integrity under high osmotic pressure
        - Membrane fouling, chemical degradation from acid exposure, and replacement frequency
      - - Subsurface Reinjection
        - Reinjection Wells & Pumping Infrastructure
        - Returns lithium-depleted brine back into the host subterranean formation
        - Geological porosity, permeability, and regulatory reinjection permits
        - Formation souring, mineral precipitation, and local seismic/pressure limits
