  - id: TE002
    title: Workflow and use-case integration table
    columns:
      - User Job / Requirement
      - Conventional Workflow
      - EnergyX GET-Lit™ Solution
      - Measurable Performance Benefit
      - Operational Limitation / Risk
    rows:
      - - Brine Extraction & Concentration
        - Solar evaporation ponds spanning hundreds of hectares over 12 to 24 months
        - Continuous industrial adsorption and selective chemical extraction modules
        - Extraction cycle reduced from months to hours; lithium recovery rates exceeding 90% vs 30-60% in ponds
        - High electrical power requirements for pumps, heaters, and chemical regeneration systems
      - - Impurity Separation & Refining
        - Extensive chemical precipitation stages with substantial freshwater dilution and reagent loss
        - Solvent extraction and selective membrane separation with adjustable apertures
        - Concentrates lithium eluate up to 60,000 ppm while selectively rejecting multivalent ions
        - Membrane scaling, aperture fouling, and organic solvent degradation under high salinity
      - - Environmental Water Disposal
        - Permanent atmospheric evaporation of millions of gallons of water per tonne produced
        - Closed-loop reinjection of lithium-depleted brine into original subterranean aquifer
        - Minimal net water consumption and compact industrial facility footprint
        - Subsurface hydrogeological risks, potential well clogging, and aquifer pressurization
      - - OEM Feedstock Qualification
        - Offtake of generic unrefined technical-grade carbonate requiring secondary overseas conversion
        - Direct onsite refining into 5-25 ton customer qualification batches of battery-grade hydroxide
        - Domestic U.S. refining pathway circumventing foreign chemical conversion bottlenecks
        - Offtake acceptance contingent on strict battery-grade purity tolerances across OEM batches
    notes: >-
