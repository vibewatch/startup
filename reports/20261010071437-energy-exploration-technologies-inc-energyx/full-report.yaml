      - number: '4.2'
        title: Cost Structure, Unit Economics, and CapEx Benchmarks
        blocks:
          - type: paragraph
            body: >-
              Evaluating the unit economics of EnergyX requires differentiating between preliminary engineering studies
              conducted on South American salar resources and operational benchmarks within North American domestic
              brine formations. For Project Black Giant in Chile, an engineering pre-feasibility study completed in
              collaboration with Worley projected capital expenditure of approximately $14,500 per tonne and direct
              operating costs of $2,944 per tonne of lithium carbonate equivalent. EnergyX positions these figures as
              industry-leading relative to traditional evaporation pond operators, which typically experience operating
              expenses between $4,000 and $9,100 per tonne while recovering only 30% to 40% of in-situ lithium over
              eighteen-month solar cycles.


              Based on these feasibility metrics and an assumed commodity price of $25,000 per metric tonne as of May
              2026, management has modeled annual gross revenue of approximately $1.3 billion once both development
              phases reach full 52,500 tonnes per year capacity. However, independent diligence must treat this top-line
              figure as an illustrative, company-generated projection that is highly sensitive to commodity price
              volatility and unproven commercial-scale plant uptime.


              Domestic cost structures in the Smackover Formation present higher unit operating expenditures.
              Independent critical minerals research benchmarks direct lithium extraction operating costs between $4,000
              and $7,000 per tonne of LCE in North America, driven by elevated electrical power consumption for
              mechanical pumping, chemical reagent consumption, and deep brine reinjection wells. In March 2026, EnergyX
              commissioned its 250 metric tons per year Lonestar demonstration facility in East Texas to validate these
              unit cost dynamics on local Smackover brine. Furthermore, in June 2026, EnergyX committed $230 million
              alongside Wildcat Discovery Technologies to construct a co-located LFP cathode active materials plant,
              attempting to integrate downstream conversion and capture higher midstream product margins.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
