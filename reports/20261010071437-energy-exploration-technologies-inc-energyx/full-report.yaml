      - number: '1.3'
        title: Technology Platform, Facilities, and Commercial Milestones
        blocks:
          - type: paragraph
            body: >-
              On March 26, 2026, EnergyX achieved a critical domestic operational milestone by commissioning its Project
              Lonestar demonstration facility in Hooks, Texas, establishing the state's first direct lithium extraction
              plant processing Smackover formation brine with an annualized design capacity of 250 metric tons of
              battery-grade lithium hydroxide (CO009). The company deployed approximately $30 million in capital to
              construct and commission the Lonestar demonstration plant, which serves as the operational intermediary to
              qualify 5 to 25 ton customer samples ahead of a planned $1 billion commercial facility (CO010). The
              installation utilizes EnergyX's proprietary GET-Lit technology platform, an integrated separation
              portfolio combining nanofiltration membranes, solvent extraction, and adsorption mechanisms backed by more
              than 120 granted and pending patents (CO012). However, commercialization proceeds amid broader market
              friction; severe commodity price corrections in 2024 to approximately $14,000 per metric ton resulted in
              widespread project cancellations and domestic extraction idling across the lithium industry (CO013).
              EnergyX management acknowledges that commercial-scale DLE operations globally remain rare, and process
              energy intensity and extraction yields vary substantially according to localized brine chemistry (CO014).
