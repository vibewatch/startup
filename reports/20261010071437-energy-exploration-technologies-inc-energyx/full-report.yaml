              - CE014
      - number: '5.3'
        title: Industrial Workflow Integration, Developer Community Signals, and Execution Risks
        blocks:
          - type: paragraph
            body: >
              Deploying DLE in customer workflows requires tight integration with upstream brine wellfields and
              downstream refining circuits. Because raw brines vary significantly across geothermal reservoirs, oilfield
              produced water, and continental salars, direct lithium extraction cannot function as a rigid off-the-shelf
              appliance. EnergyX addresses this heterogeneity through a hybrid flowsheet that couples pre-treatment
              filtration, multi-stage extraction, and closed-loop aquifer reinjection.


              Despite demonstration milestones, significant technical and operational risks persist. First, membrane
              durability, sorbent fouling, and solvent degradation under real-world continuous high-salinity brine flow
              remain unvalidated at multi-thousand-ton commercial scales over multi-year operational cycles. Second,
              closed-loop aquifer reinjection introduces hydrogeological uncertainties, including reservoir pressure
              shifts and formation clogging. Third, because EnergyX operates in heavy industrial mining and chemical
              processing rather than software development, public software repository signals (such as GitHub, npm, or
              PyPI) are non-existent; practitioner validation instead relies on engineering partnerships with EPC firms
              like Worley, academic research with the University of Texas, and strategic evaluations by automotive and
              energy conglomerates.
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
