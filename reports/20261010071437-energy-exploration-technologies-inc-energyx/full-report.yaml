      - number: '8.2'
        title: Financing and valuation evidence
        blocks:
          - type: paragraph
            body: >-
              Financing evidence must be separated by entity and certainty. Eni's announced equity is tied to Project
              Black Giant, with associated project offtake rights, while the cited $690 million U.S. EXIM amount remains
              a letter of intent rather than a confirmed drawdown. EnergyX's own implied valuation and KingsCrowd's
              offering marks provide reference points, not a complete valuation bridge. KingsCrowd's 2024 campaign page
              also reports only $210,250 of FY2023 revenue and a $14.9 million FY2023 net loss; those historical
              accounting figures are neither ARR nor current cash burn. The available evidence therefore cannot support
              an enterprise-value, revenue-multiple, or discounted-cash-flow conclusion, and project financing must not
              be added to corporate funding or treated as cash available to the parent.
            claimRefs:
