              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: Scenarios, exit readiness, and final diligence
        blocks:
          - type: paragraph
            body: >-
              The scenario ranges below are observed financing-mark bands, not intrinsic-value estimates. A bull outcome
              requires commercial-scale performance and project economics that validate the company's planned production
              and revenue model. The base case assumes continued technical progress but delays price discovery until
              financing terms and current financial statements are available. The bear case includes a down-round below
              the 2024 reference mark, prolonged commercialization, financing failure, or lithium-price compression.
              Liquidity cannot be underwritten as an offset: EnergyX says it is private, has no exchange for its shares,
              and has no set IPO date. Final diligence should therefore obtain the fully diluted capitalization,
              preference stack, Eni closing and governance terms, EXIM conditions and draw status, refreshed audited
              financials, and independent commercial-scale operating results.
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV010
              - CV012
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation: TRACK'
            body: >-
              Do not underwrite an investment price from the available public marks. Revisit after the capitalization,
              security terms, current financials, project-finance conditions, and commercial-scale operating evidence
              are available.
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV013
              - CV016
          - type: callout
            title: Project capital is not parent-company price discovery
            body: >-
              Eni's minority investment validates strategic interest in Project Black Giant, but it does not disclose a
              valuation for EnergyX common equity and should not be treated as unrestricted parent liquidity.
            calloutType: risk
            claimRefs:
              - CV001
              - CV003
