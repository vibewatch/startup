  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Ideal Customer Profiles
        blocks:
          - type: paragraph
            body: >-
              EnergyX segments its prospective commercial customer base across three core resource and industrial
              archetypes: upstream brine resource operators, integrated energy majors, and downstream automotive and
              battery manufacturers. Upstream resource developers represent the primary target for technology licensing
              and equipment sales; these include operators of continental salar brines in South America's Lithium
              Triangle and subsurface oilfield brines across North American formations such as the Smackover Formation
              in Texas and Arkansas. These operators require direct lithium extraction systems to recover lithium ions
              directly from brines in hours rather than multi-year evaporation pond cycles, achieving recovery rates
              above 90% while returning spent brine underground via closed-loop reinjection. Downstream automotive
              OEMs—most notably General Motors—represent critical offtake buyers seeking secure, IRA-compliant domestic
              critical mineral feedstocks. Federal designation of lithium as a critical mineral under the Energy Act of
              2020 by the U.S. Geological Survey underscores the strategic urgency driving OEM procurement interest.
              However, EnergyX's sales motion faces substantial structural friction: enterprise DLE equipment purchases
              involve multi-hundred-million-dollar capital expenditure decisions with procurement evaluation cycles
              extending between two and five years.
            claimRefs:
              - CU001
              - CU002
