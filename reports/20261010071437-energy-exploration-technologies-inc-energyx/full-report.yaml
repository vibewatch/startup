    title: Company Overview
    sections:
      - number: '1.1'
        title: Executive Identity and Corporate Governance
        blocks:
          - type: paragraph
            body: >-
              Energy Exploration Technologies, Inc., commercially known as EnergyX, was founded by serial entrepreneur
              Teague Egan and incorporated in San Juan, Puerto Rico on December 18, 2018 (CO001). The company operates
              an Innovation Headquarters in Austin, Texas, alongside an operational regional office in Santiago, Chile
              to support its South American lithium brine interests, maintaining registered corporate presence in Puerto
              Rico (CO002). Executive governance is centered under Founder and Chief Executive Officer Teague Egan,
              supported by President of Lithium South America Juan Carlos Barrera, Chief Technology Officer Dr. Amit
              Patwardhan, and Chief Financial Officer Mayank Sharma (CO003). Advisory governance and scientific guidance
              include University of Texas polymer membrane pioneer Dr. Benny Freeman, former Alamo CEO Michael Egan,
              former Lazard partner Kris Haber, Endeavor CEO Ariel Emanuel, and independent director Paul Leggett
              (CO004). EnergyX reports a total workforce exceeding 100 professionals, comprising full-time staff and
              specialized technical consultants active across chemical synthesis, process engineering, membrane
              manufacturing, and field operations (CO015).
