      - number: '1.2'
        title: Capital Structure, Valuation, and Strategic Partnerships
        blocks:
          - type: paragraph
            body: >-
              EnergyX has amassed over $178 million in total capital raised through a hybrid financing model combining
              institutional venture rounds, non-dilutive government awards, and widespread retail equity crowdfunding
              spanning more than 49,000 individual investors (CO005). The company's active retail offering materials
              publish a management-set pre-money implied valuation of $3,258,556,886, calculated mechanically by
              multiplying total shares outstanding by the per-share offering price without independent third-party
              appraisal (CO006). In July 2026, Italian energy conglomerate Eni executed a major strategic partnership,
              committing $225 million in equity investment for a minority stake in Project Black Giant in Chile with
              rights to lift approximately 25% of commercial lithium output (CO007). This equity commitment supplements
              an official $690 million debt financing Letter of Interest issued by the U.S. Export-Import Bank (EXIM) to
              finance Project Black Giant's commercial facilities (CO008). These recent agreements build upon earlier
              strategic capitalization, most notably General Motors leading EnergyX's $50 million Series B round in 2022
              to secure long-term battery raw material offtake options for its North American electric vehicle fleet
              (CO011).
