  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Addressable Categories, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              The commercial market for direct lithium extraction (DLE) occupies a distinct operational position between
              upstream mineral exploration and downstream battery manufacturing. Rather than competing as a conventional
              bulk mineral extractor, EnergyX targets two interrelated addressable categories: proprietary extraction
              equipment and membrane technology licensing for third-party brine operators, and integrated mineral
              refining producing battery-grade lithium carbonate (minimum 99.5% purity) and lithium hydroxide
              monohydrate (minimum 56.5% purity). Excluded spend includes unrefined raw brine pumping, greenfield civil
              earthworks, and conventional spodumene hard-rock open-pit mining. The primary status-quo substitute
              remains traditional solar evaporation ponds, which require 12 to 24 months of evaporation time, recover
              only 20% to 50% of dissolved lithium, and consume vast land footprints in arid salar environments. In
              contrast, modern DLE technologies deploy adsorption, solvent extraction, or selective membrane separation
              to recover 80% to 95% of lithium in hours, returning the spent brine to the originating subsurface
              aquifer. For EnergyX, commercial addressability encompasses both greenfield South American salar brines
              and domestic North American oilfield brines across the Smackover Formation, where over 150,000 acres of
              prospective brine access provide the resource base for technology deployment.
            claimRefs:
              - CM001
              - CM012
              - CM013
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM012
              - CM013
              - CM015
      - number: '2.2'
        title: 'Market Sizing: Multi-Lens TAM, SAM, and SOM Projections'
        blocks:
          - type: paragraph
            body: >-
              Evaluating EnergyX's market sizing requires multiple analytical lenses across global commodity volume,
              addressable battery chemical demand, and asset-level production targets. On a global total addressable
              market (TAM) basis, independent research from Mordor Intelligence projects worldwide lithium consumption
              will grow from 1.54 million LCE metric tons in 2025 to 1.84 million tons in 2026, reaching 4.43 million
              metric tons by 2031 at a compound annual growth rate (CAGR) of 19.24%. Within this global volume, the
              serviceable addressable market (SAM) is concentrated in the automotive sector, which accounted for 51.14%
              of 2025 consumption and is expanding at a 21.73% CAGR through 2031, driven by electric vehicle battery
              manufacturing and grid-scale storage mandates. Lithium chemical pricing has stabilized from historic
              cyclical troughs, with Benchmark Mineral Intelligence assessing battery-grade carbonate at $19,750 per
              tonne and hydroxide at $18,750 per tonne CIF Asia in September 2026. On a serviceable obtainable market
              (SOM) basis, EnergyX's commercial footprint is anchored by two flagship assets: Project Black Giant in
              Chile, where a $225 million strategic equity investment from Eni supports a planned two-phase capacity of
              52,500 metric tons per year, and Project Lonestar in East Texas, where a 250-ton demonstration plant
              commissioned in March 2026 precedes a planned 50,000-ton commercial scale-up.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM007
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM007
          - type: figure
            figureRef: FM001
