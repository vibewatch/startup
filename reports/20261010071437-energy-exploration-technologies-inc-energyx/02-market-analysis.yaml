callouts:
  - calloutType: insight
    title: "Midstream Refining Choke Point Drives Sizing Divergence"
    body: "While raw lithium reserves are globally dispersed across North American oilfields and South American salars, chemical conversion remains concentrated with China controlling 70% to 75% of refining capacity. EnergyX's co-location of DLE extraction and refining at Project Lonestar directly addresses this bottleneck, though scaling from demonstration to commercial throughput requires closing significant capital gaps."
    claimRefs:
      - "CM010"
      - "CM013"
  - calloutType: risk
    title: "Downstream Price Cyclicality and Capital Intensity Risk"
    body: "With commercial DLE projects requiring $300M to $500M per 10k-20k tpa of capacity and Benchmark spot carbonate trading near $19,750 per tonne, lack of disclosed binding commercial offtake contracts with price floors leaves planned multi-billion-dollar commercial expansions exposed to commodity downturns."
    claimRefs:
      - "CM004"
      - "CM008"
      - "CM014"
