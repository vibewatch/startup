callouts:
  - calloutType: "risk"
    title: "Zero Commercial Offtake Execution Despite High-Profile Strategic Alliances"
    body: "While EnergyX has successfully secured high-profile corporate partners including Eni and General Motors, neither relationship has yielded binding, unconditional commercial product offtake deliveries. Eni's $225 million commitment is ring-fenced at the Chilean project asset level, giving Eni a minority stake and an option to lift 25% of output, rather than representing an upfront revenue-generating technology license. GM's strategic partnership provides offtake priority, but macro EV market corrections and subsidy rollbacks introduce uncertainty regarding the volume and timing of future automotive procurement demand."
    claimRefs:
      - "CU009"
      - "CU010"
      - "CU015"
  - calloutType: "insight"
    title: "Demonstration-Scale Proving Grounds as Gateways to Mining Licensing"
    body: "In resource extraction technology, global mining conglomerates and chemical operators rarely execute technology licensing agreements without inspecting continuous operational run data from field-scale demonstration plants. EnergyX's commissioning of the 250-ton-per-year Project Lonestar demonstration plant in March 2026 serves as an indispensable pre-requisite to bridge the gap between benchtop brine testing ($244,000 in 2025) and commercial-scale equipment orders, enabling potential enterprise customers to verify lithium selectivity and recovery rates in real-world conditions."
    claimRefs:
      - "CU004"
      - "CU007"
      - "CU008"
