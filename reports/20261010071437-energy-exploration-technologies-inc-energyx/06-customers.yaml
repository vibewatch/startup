company:
  name: "Energy Exploration Technologies, Inc. (EnergyX)"
chapter:
  number: 6
  title: "Customers"
  summary: "EnergyX remains a pre-commercial development-stage direct lithium extraction (DLE) technology developer with zero commercial-scale lithium customers or production offtake deliveries as of October 2026. Commercial activity is limited to testing customer brine samples ($244,000 in FY2025) and initial membrane equipment sales ($1.1 million in FY2025), alongside strategic project-level equity and offtake options from Eni ($225M into Project Black Giant for a 25% lift option) and GM Ventures. Extreme customer concentration, protracted 2-to-5-year mining sales cycles, and reliance on unproven joint ventures highlight major commercial execution risks."
sections:
  - id: "customer-segmentation-and-target-buyers"
    title: "Customer Segmentation and Ideal Customer Profiles"
    body: "EnergyX segments its prospective commercial customer base across three core resource and industrial archetypes: upstream brine resource operators, integrated energy majors, and downstream automotive and battery manufacturers. Upstream resource developers represent the primary target for technology licensing and equipment sales; these include operators of continental salar brines in South America's Lithium Triangle and subsurface oilfield brines across North American formations such as the Smackover Formation in Texas and Arkansas. These operators require direct lithium extraction systems to recover lithium ions directly from brines in hours rather than multi-year evaporation pond cycles, achieving recovery rates above 90% while returning spent brine underground via closed-loop reinjection. Downstream automotive OEMs—most notably General Motors—represent critical offtake buyers seeking secure, IRA-compliant domestic critical mineral feedstocks. Federal designation of lithium as a critical mineral under the Energy Act of 2020 by the U.S. Geological Survey underscores the strategic urgency driving OEM procurement interest. However, EnergyX's sales motion faces substantial structural friction: enterprise DLE equipment purchases involve multi-hundred-million-dollar capital expenditure decisions with procurement evaluation cycles extending between two and five years."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "commercial-traction-and-named-proof"
    title: "Commercial Traction, Pilot Deployments, and Named Customer Proof"
    body: "EnergyX does not yet sell lithium commercially, generating only development-stage revenues from preliminary services and equipment deliveries. In fiscal year 2025, the company reported approximately $1.3 million in total revenue, comprising roughly $244,000 from testing customer brine samples and $1.1 million from selling membrane separation equipment. Demonstration-scale validation advanced in March 2026 when EnergyX unveiled its 250-ton-per-year Project Lonestar DLE plant near Texarkana, Texas, processing locally sourced Smackover brine. Named commercial proof remains centered on strategic corporate partners rather than arms-length technology licensees: General Motors led EnergyX's Series B financing round and holds offtake rights for future lithium production, while Italian global energy major Eni entered a binding $225 million strategic equity investment in July 2026 for a minority stake in Project Black Giant in Antofagasta, Chile, securing options to lift 25% of the project's planned 52,500 tons per year of lithium carbonate. Additional downstream joint ventures include site control secured at TexAmericas Center for a proposed $500 million, 15,000-metric-ton LFP cathode plant with Wildcat Discovery Technologies, although this project remains contingent on site purchase options, environmental permitting, and external financing."
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "retention-expansion-and-concentration-risk"
    title: "Retention Durability, Expansion Friction, and Concentration Risks"
    body: "Customer retention metrics such as Net Revenue Retention (NRR) and Gross Revenue Retention (GRR) are not calculable or economically meaningful for EnergyX at its current pre-commercial juncture. Brine testing services represent discrete, non-recurring fee-for-service evaluations rather than predictable software or recurring consumable contracts. Customer concentration is acute: 100% of product equipment revenue in 2025 derived from isolated demonstration hardware deliveries, and future commercial revenue is heavily concentrated in two strategic counterparties (Eni and GM). Furthermore, partner execution risks have mounted: GM recorded approximately $6 billion in EV-related impairment charges in early 2026 as retail EV adoption cooled following tax credit expirations, raising questions regarding the timing and volume of automotive offtake requirements. Simultaneously, cathode partner Wildcat Discovery Technologies was acquired for $73 million by Swedish battery startup Holyvolt, an unproven entity developing screen-printed battery cells that has yet to demonstrate commercial manufacturing at scale. Compounded by cumulative net losses of $73.3 million through year-end 2025 and formal going-concern explanatory warnings from independent auditors, EnergyX faces material execution hurdles before customer traction translates into self-sustaining commercial cash flow."
    claimRefs:
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
