  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Commercial Model
      - Contract / Revenue Mechanism
      - Target Counterparty
      - Economics & Capital Responsibility
      - Switching Costs & Strategic Diligence Asks
    rows:
      - - DLE Equipment & Technology Licensing
        - Upfront licensing fee plus recurring volume-based royalty per ton LCE
        - Resource owners and mining majors (e.g., POSCO, ExxonMobil)
        - Licensee funds 100% plant capex; EnergyX provides modular units
        - Multi-hundred-million-dollar capex decisions create 24 to 36 month sales cycles
      - - Direct Resource Ownership (Project Lonestar)
        - Merchant sale of battery-grade lithium carbonate/hydroxide under offtake
        - Automotive OEMs (General Motors) and battery cell manufacturers
        - EnergyX funds extraction and refining ($400M Utah, $1B Chile)
        - High capital intensity shifts execution and commodity price risk entirely onto EnergyX
      - - Joint Venture Project Equity (Project Black Giant)
        - Strategic equity investment in project subsidiary paired with off-take rights
        - Global energy conglomerates (Eni investing $225M for minority stake)
        - Equity partner co-funds development; supported by $690M EXIM Bank debt LOI
        - Governance complexity, joint permitting, and 25% production offtake encumbrance
      - - Infrastructure Co-Location (Project Powder Hound)
        - Land lease and brine licensing fee on existing industrial salt infrastructure
        - Industrial mineral operators (Compass Minerals in Ogden, Utah)
        - EnergyX designs and funds facility ($400M); partner bears no capital costs
        - Operational dependency on partner brine concentration rates and Utah state permitting
    notes: Contract structures derived from EnergyX partnership agreements with Eni, Compass Minerals, and GM, and executive interviews in TechCrunch. Commercial realization depends on bilateral definitive agreements and market pricing benchmarks.
