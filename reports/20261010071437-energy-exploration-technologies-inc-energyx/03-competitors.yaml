  - id: TP002
    title: Feature / capability matrix
    columns:
      - Extraction / Refining Dimension
      - EnergyX (GET-Lit™)
      - Ion-Exchange DLE (Lilac / Peers)
      - Continental Solar Evaporation (Albemarle)
      - Hard-Rock Spodumene (Australia / China)
    rows:
      - - Core Separation Mechanism
        - Hybrid adsorption, solvent extraction, and selective membrane separation
        - Solid ion-exchange adsorption beads in contactor columns
        - Solar-driven fractional crystallization in open-air evaporation ponds
        - Crushing, dense media flotation, and acid-roast pyrometallurgy
      - - Extraction & Processing Timeline
        - Hours from raw brine intake to purified lithium concentrate
        - Hours to days for continuous adsorption and elution cycles
        - 12 to 18 months dependent on solar evaporation rates
        - Days to weeks for mining, beneficiation, and refining
      - - Lithium Recovery Efficiency
        - Projected >90% recovery (94% to 98% claimed in pilot testing)
        - Reported 80% to 90% recovery across demonstrated brine types
        - 40% to 60% recovery with significant brine entrainment loss
        - 60% to 75% overall recovery from run-of-mine ore to concentrate
      - - Freshwater & Reagent Footprint
        - Closed-loop reinjection with selective membranes reducing freshwater draw
        - Substantial eluent wash water and acid regeneration reagents required
        - Low chemical reagent draw but massive freshwater evaporative loss
        - High sulfuric acid intensity and fossil-fuel thermal roasting energy
      - - Downstream Refining Integration
        - Integrated refining to battery-grade LiOH/Li2CO3 at Project Lonestar
        - Produces intermediate eluent requiring third-party chemical conversion
        - Produces technical-grade or battery carbonate on site with finishing
        - Produces spodumene concentrate requiring overseas chemical refining
    notes: Technical parameters compiled from EnergyX engineering brochures, Chemical Engineering reporting, and USGS commodity data. Competitor recovery rates and reagent requirements reflect vendor claims and lack standardized third-party audit verification.
