callouts:
  - calloutType: risk
    title: Commercial Inertia and Multi-Billion-Dollar Licensing Sales Cycles
    body: EnergyX's dual business model attempts to mitigate adoption friction by developing proprietary resources while marketing DLE technology to mining incumbents like POSCO and ExxonMobil. However, mining majors face multi-hundred-million-dollar final investment decisions with 24- to 36-month evaluation cycles, creating substantial commercial inertia that forces EnergyX to shoulder heavy capital commitments on its own projects.
    claimRefs:
      - CP001
      - CP003
  - calloutType: insight
    title: Downstream Chinese Refining Dominance Constrains Western Extraction Moats
    body: While DLE shortens brine extraction from 18 months to hours, global lithium chemical refining remains a severe geopolitical bottleneck, with China controlling roughly 70% to 75% of global conversion capacity and deliberately suppressing margins. Without captive, cost-competitive domestic refining such as EnergyX's planned Project Lonestar and Tesla's Robstown plant, upstream brine developers remain structurally dependent on foreign chemical processors.
    claimRefs:
      - CP004
      - CP005
