company:
  name: "Energy Exploration Technologies, Inc. (EnergyX)"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "EnergyX has engineered the proprietary GET-Lit™ Direct Lithium Extraction (DLE) platform, combining adsorption, solvent extraction, and membrane separation to process high-salinity brines in hours rather than multi-year solar evaporation. While the company achieved operational commissioning of its 250-ton-per-year Project Lonestar demonstration plant in Texas and secured a $225 million strategic equity commitment from Eni for Project Black Giant in Chile, the architecture faces unproven 50,000+ ton commercial durability, complex field reinjection geology, and substantial capital intensity."
sections:
  - id: "technology-platform-and-separation-architecture"
    title: "GET-Lit™ Platform Architecture and Brine Separation Mechanics"
    body: |
      EnergyX positions its core technology platform, branded as GET-Lit™ (formerly LiTAS™), as an integrated brine-to-battery direct lithium extraction architecture. Conventional lithium brine recovery relies on vast evaporation ponds across salt flats that require 12 to 24 months to concentrate salts, achieving modest lithium recovery rates between 30% and 60% while permanently losing millions of gallons of water to the atmosphere. In contrast, EnergyX’s engineered process is designed to selectively isolate lithium ions directly from subterranean salar and oilfield brines within hours, returning depleted brine back to subsurface aquifers.

      The core GET-Lit™ processing flowsheet combines three unit operations: adsorption (AX), solvent extraction (SX), and selective membrane separation (MX). Sorbent beads selectively capture lithium from raw, filtered brine with high recovery. Next, proprietary solvent extraction chemical reagents purify and concentrate the intermediate eluate to lithium concentrations as high as 60,000 parts per million. Finally, selective transport membranes featuring engineered, tunable apertures separate lithium ions from competing monovalent and multivalent impurities (including sodium, magnesium, calcium, and boron), enabling direct conversion into battery-grade lithium carbonate or lithium hydroxide.
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE006"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "facility-footprint-and-demonstration-maturity"
    title: "Facility Footprint, Demonstration Plants, and Scaling Milestones"
    body: |
      The commercialization trajectory of DLE is dictated by transition from bench pilots to multi-thousand-ton industrial facilities. In March 2026, EnergyX commissioned its Project Lonestar demonstration plant at the TexAmericas Center near Texarkana, Texas, establishing the largest operational DLE facility in the United States. Designed with an operating capacity of approximately 250 metric tons per year of battery-grade lithium carbonate equivalent (LCE), Lonestar represents the first operational facility extracting lithium from raw Smackover formation brine in Texas.

      Lonestar serves as the operational precursor to commercial-scale deployment across EnergyX's domestic and international resource holdings. The facility provides 5-ton to 25-ton battery-grade qualification samples to electric vehicle OEMs, cathode producers, and strategic partners, including General Motors and POSCO. Historically, EnergyX validated early containerized pilot units in Bolivia, reporting up to 94% lithium recovery without supplemental freshwater consumption. In South America, EnergyX is advancing Project Black Giant in the Salar de Punta Negra in Antofagasta, Chile, targeting 52,500 metric tons per year of commercial capacity across two phases backed by Eni's $225 million strategic investment and a $690 million debt letter of interest from the U.S. EXIM Bank.
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
    tableRefs:
      - "TE001"
  - id: "workflow-integration-and-technical-risks"
    title: "Industrial Workflow Integration, Developer Community Signals, and Execution Risks"
    body: |
      Deploying DLE in customer workflows requires tight integration with upstream brine wellfields and downstream refining circuits. Because raw brines vary significantly across geothermal reservoirs, oilfield produced water, and continental salars, direct lithium extraction cannot function as a rigid off-the-shelf appliance. EnergyX addresses this heterogeneity through a hybrid flowsheet that couples pre-treatment filtration, multi-stage extraction, and closed-loop aquifer reinjection.

      Despite demonstration milestones, significant technical and operational risks persist. First, membrane durability, sorbent fouling, and solvent degradation under real-world continuous high-salinity brine flow remain unvalidated at multi-thousand-ton commercial scales over multi-year operational cycles. Second, closed-loop aquifer reinjection introduces hydrogeological uncertainties, including reservoir pressure shifts and formation clogging. Third, because EnergyX operates in heavy industrial mining and chemical processing rather than software development, public software repository signals (such as GitHub, npm, or PyPI) are non-existent; practitioner validation instead relies on engineering partnerships with EPC firms like Worley, academic research with the University of Texas, and strategic evaluations by automotive and energy conglomerates.
    claimRefs:
      - "CE012"
