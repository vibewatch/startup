        title: 收入架构与商业变现渠道
        blocks:
          - type: paragraph
            body: >-
              Energy Exploration Technologies,
              Inc.（EnergyX）是一家尚未商业化的关键矿产技术开发商，试图建立三条相互关联的收入线。第一条、也是主要商业支柱，是技术服务（TaaS）许可：EnergyX 计划向第三方锂资源持有者许可其 GET-Lit™
              DLE 膜和分离技术，并按产量收取季度吨位特许权费。在这一模式下，被许可方预计承担现场制造和安装提取硬件所需的直接资本开支，理论上让 EnergyX 无需在资产负债表上完整持有资产即可扩大技术覆盖。

              第二条收入线是从全资或项目合作的卤水资产进行直接矿产开发和承购销售。EnergyX 计划在智利 Antofagasta 地区的 Project Black Giant 及东德州 Smackover 地层的
              Project Lonestar 提取和精炼锂，向汽车制造商和电池电芯生产商直接销售电池级碳酸锂和氢氧化锂。2026 年 7 月，意大利能源巨头 Eni 向 Project Black Giant 承诺
              $225M 少数股权投资，并取得规划中年产 52,500 吨设施约 25% 商业产量的提货权。

              第三条潜在收入线是专有消耗型分离介质的周期性售后更换。EnergyX
              计划向获许可设施供应专有选择性膜、吸附剂和溶剂萃取试剂，预计更换周期为两至三年。不过，这些变现渠道仍完全处于商业化前阶段。公司尚未公布已签署、具有约束力且固定价格下限的照付不议承购协议，因此未来收入确认和现金到账时点仍面临重大执行风险。
