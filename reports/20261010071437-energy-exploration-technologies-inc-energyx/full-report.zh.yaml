    rows:
      - - 原料预处理
        - 过滤与澄清单元
        - 从原卤水中去除悬浮固体、碳氢化合物和颗粒物
        - 原卤水流入的化学成分和温度保持一致
        - 高浑浊度卤水导致滤器堵塞，需要频繁反冲洗
      - - 直接提取（AX）
        - 工程化吸附剂颗粒（吸附）
        - 从原卤水中选择性结合锂离子；通过水洗释放
        - 吸附剂的机械耐久性和耐热性
