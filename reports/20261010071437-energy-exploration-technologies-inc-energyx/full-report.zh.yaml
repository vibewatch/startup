  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、可服务类别与替代方案
        blocks:
          - type: paragraph
            body: >-
              直接提锂（DLE）的商业市场位于上游矿产勘探与下游电池制造之间，具有独立的运营定位。EnergyX
              不是传统的大宗矿产提取商，而是同时瞄准两类相互关联的可服务市场：面向第三方卤水运营商的专有提取设备和膜技术许可，以及生产电池级碳酸锂（纯度至少 99.5%）和一水氢氧化锂（纯度至少
              56.5%）的一体化矿物精炼。未计入的支出包括未精炼原卤水抽取、绿地土建工程以及传统锂辉石露天硬岩开采。主流替代方案仍是传统太阳能蒸发池：蒸发需要 12 至 24 个月，只能回收溶解锂的 20% 至
              50%，还会在干旱盐湖环境中占用大片土地。相比之下，现代 DLE 通过吸附、溶剂萃取或选择性膜分离，在数小时内回收 80% 至 95% 的锂，再将用过的卤水回注原始地下含水层。对 EnergyX
              而言，可服务市场既包括南美新建盐湖卤水项目，也包括北美 Smackover 地层的本土油田卤水；后者拥有超过 150,000 英亩的潜在卤水获取面积。
            claimRefs:
              - CM001
              - CM012
              - CM013
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM012
              - CM013
              - CM015
      - number: '2.2'
        title: 市场规模：多视角 TAM、SAM 与 SOM 预测
        blocks:
          - type: paragraph
            body: >-
              评估 EnergyX 的市场规模，需要同时考察全球商品量、可服务的电池化学品需求和资产层面的产能目标。按全球总可服务市场（TAM）计算，Mordor Intelligence 的独立研究预计，全球锂消费量将从
              2025 年的 1.54M LCE 公吨增至 2026 年的 1.84M 吨，并在 2031 年达到 4.43M 公吨，复合年增长率（CAGR）为
              19.24%。在这一全球总量中，可服务市场（SAM）集中于汽车行业；该行业占 2025 年消费量的 51.14%，并将在 2031 年前以 21.73% 的 CAGR
              扩张，驱动力来自电动车电池制造和电网级储能要求。锂化学品价格已从历史周期低点企稳；Benchmark Mineral Intelligence 评估显示，2026 年 9 月亚洲 CIF 电池级碳酸锂价格为
              $19,750 / 吨，氢氧化锂为 $18,750 / 吨。按可获得市场（SOM）计算，EnergyX 的商业版图由两个旗舰资产支撑：智利 Project Black Giant 获得 Eni $225M
              战略股权投资，规划分两期建设、年产能 52,500 公吨；东德州 Project Lonestar 则以 2026 年 3 月启用的 250 吨示范工厂为起点，后续计划扩至 50,000 吨商业产能。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM007
              - CM009
