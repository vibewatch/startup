            body: >-
              Energy Exploration Technologies, Inc.，商业名称为 EnergyX，由连续创业者 Teague Egan 创立，并于 2018 年 12 月 18 日在波多黎各 San
              Juan 注册（CO001）。公司在德州 Austin 运营创新总部，同时在智利 Santiago
              设有运营中的区域办公室，以支持其南美锂卤水业务；波多黎各仍保留注册公司实体（CO002）。管理层由创始人兼首席执行官 Teague Egan 负责，另有南美锂业务总裁 Juan Carlos
              Barrera、首席技术官 Dr. Amit Patwardhan 和首席财务官 Mayank Sharma（CO003）。顾问和科学指导团队包括德州大学聚合物膜先驱 Dr. Benny Freeman、前
              Alamo CEO Michael Egan、前 Lazard 合伙人 Kris Haber、Endeavor CEO Ariel Emanuel 以及独立董事 Paul
              Leggett（CO004）。EnergyX 披露员工总数超过 100 人，涵盖全职员工和专业技术顾问，分布在化学合成、工艺工程、膜制造和现场运营等岗位（CO015）。
