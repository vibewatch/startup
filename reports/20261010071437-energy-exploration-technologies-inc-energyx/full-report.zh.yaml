      - number: '6.2'
        title: 商业进展、试点部署与具名客户证明
        blocks:
          - type: paragraph
            body: >-
              EnergyX 尚未商业化销售锂，目前仅从初步服务和设备交付中取得开发阶段收入。2025 财年，公司披露总收入约 $1.3M，其中约 $244,000 来自测试客户卤水样品，$1.1M
              来自销售膜分离设备。2026 年 3 月，EnergyX 在德州 Texarkana 附近公布年产 250 吨的 Project Lonestar DLE 工厂，处理本地 Smackover
              卤水，示范规模验证由此推进。具名商业证明仍集中于战略企业伙伴，而非公平交易条件下的技术被许可方：General Motors 领投 EnergyX 的 B 轮并持有未来锂产量的承购权；意大利全球能源巨头 Eni
              则于 2026 年 7 月对智利 Antofagasta 的 Project Black Giant 进行具有约束力的 $225M 战略股权投资，取得提取该项目规划中 52,500 吨 / 年碳酸锂产量 25%
              的选择权。其他下游合资项目包括 EnergyX 在 TexAmericas Center 获得场地控制权，拟与 Wildcat Discovery Technologies 建设 $500M、15,000 公吨
              LFP 正极工厂；但该项目仍取决于场地购买选择权、环境许可和外部融资。
