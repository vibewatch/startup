      - number: '5.3'
        title: 工业工作流整合、开发者社区信号与执行风险
        blocks:
          - type: paragraph
            body: >-
              将 DLE 部署到客户工作流，需要与上游卤水井田和下游精炼回路紧密整合。由于地热储层、油田产出水和大陆盐湖的原始卤水差异很大，直接提锂不能像刚性标准化设备一样即插即用。EnergyX
              通过混合流程应对这种异质性，将预处理过滤、多级提取和闭环含水层回注结合起来。

              尽管已取得示范里程碑，技术和运营风险仍然显著。第一，在多年运营周期和数千吨级商业规模下，膜耐久性、吸附剂污染以及高盐卤水连续流动中的溶剂降解，尚未得到验证。第二，闭环含水层回注带来水文地质不确定性，包括储层压力变化和地层堵塞。第三，EnergyX
              从事的是重工业采矿和化学加工，而非软件开发，因此不存在 GitHub、npm 或 PyPI 等公开软件仓库信号；业内验证主要依赖与 Worley 等 EPC
              公司的工程合作、与德州大学的学术研究，以及汽车和能源集团的战略评估。
