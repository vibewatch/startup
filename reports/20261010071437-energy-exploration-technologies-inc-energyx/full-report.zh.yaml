      - number: '8.3'
        title: 投资逻辑与反投资逻辑
        blocks:
          - type: paragraph
            body: >-
              投资逻辑是：战略资本、已投产的 250 吨/年示范设施，以及公司在 Black Giant 年产 52,500 吨的规划，共同创造了有价值的技术和资源期权。管理层项目模型指向 13
              亿美元年毛收入，但前提是两个阶段都投入运营，且锂价假设为 25,000 美元/吨。反投资逻辑是：DLE
              在完整商业规模上仍缺乏充分验证，下一项披露的产量目标比示范工厂高出几个数量级，而抓取快照中的锂价基准指数为负。因此，投资判断取决于经验证的吞吐量、回收率、纯度、运营成本、许可、融资提款和实现价格，而不只是毛收入目标。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
