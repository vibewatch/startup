      - number: '8.2'
        title: 融资与估值证据
        blocks:
          - type: paragraph
            body: >-
              融资证据必须按实体和确定性分别判断。Eni 宣布的股权投资绑定 Project Black Giant，并附带项目承购权；而所引用的美国进出口银行 6.9
              亿美元仍只是意向书，不是已确认可提款的融资。EnergyX 自身的隐含估值和 KingsCrowd 的发行价格只能提供参考点，不能构成完整的估值桥接。KingsCrowd 的 2024
              年募资页面还显示，EnergyX 2023 财年收入仅为 210,250 美元，净亏损为 1,490 万美元；这些历史会计数据既不是
              ARR，也不是当前现金消耗。因此，现有证据不足以支持企业价值、收入倍数或贴现现金流结论；项目融资也不能计入公司融资，或被视为母公司可用现金。
            claimRefs:
