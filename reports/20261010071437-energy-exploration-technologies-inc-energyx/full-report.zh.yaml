      - number: '7.4'
        title: 风险热力图、缓释措施与击穿投资逻辑的终止标准
        blocks:
          - type: paragraph
            body: >-
              从监管、运营、伙伴和市场四个维度看，EnergyX 的投资逻辑主要会在两种情形下失效：项目融资崩溃，或商业化 DLE 表现不达标。管理层提出的主要缓释措施包括借助 Eni
              的上游工程能力、部署模块化集装箱系统以降低前期资本强度，以及通过美国进出口银行争取不稀释股权的联邦债务支持。但尽调监测必须设定明确的终止标准。若 EXIM Bank 未能在预计开发窗口内落实 6.9 $690m
              贷款，Black Giant 的建设将停摆，并触发紧急股权稀释。同样，如果 Project Lonestar 的商业回收率跌破 80%，或电池级产品未通过 OEM 认证测试，EnergyX
              预计的成本优势（$2,944/ton OpEx、$14,500/ton CapEx）将消失。潜在投资者应以经核实的第三方工程审计和有约束力的承购合同作为投放资金的前提，而不能依赖非约束性备忘录。
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR007
              - CR010
              - CR013
