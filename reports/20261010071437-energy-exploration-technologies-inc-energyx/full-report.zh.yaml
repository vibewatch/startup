      - number: '8.4'
        title: 情景、退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              下列情景区间是观察到的融资定价带，不是内在价值估计。乐观情景需要商业规模表现和项目经济性得到验证，能够支撑公司的产量与收入规划。基准情景假设技术继续进步，但在获得融资条款和最新财务报表前，价格发现会被推迟。悲观情景包括低于
              2024 年参考价格的下轮融资、商业化长期拖延、融资失败或锂价承压。流动性不能作为抵消项纳入投资判断：EnergyX 表示自己是私营公司，股份没有交易所，也没有确定的 IPO
              日期。因此，最终尽调应取得完全摊薄资本表、优先股堆叠、Eni 交割及治理条款、EXIM 条件和提款状态、更新后的经审计财务报表，以及独立的商业规模运营结果。
            claimRefs:
              - CV002
