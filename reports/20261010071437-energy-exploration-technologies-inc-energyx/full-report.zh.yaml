      - number: '3.4'
        title: 护城河防御、下游精炼瓶颈与替代风险
        blocks:
          - type: paragraph
            body: >-
              西方锂商业化的结构性弱点，在于下游化学转化存在严重的地理瓶颈。DLE 虽然提高了上游卤水提取速度和回收率，但中国控制全球约 70% 至 75%
              的锂精炼产能，且历史上压低加工利润。生产中间精矿、而非电池级氢氧化锂或碳酸锂的西方 DLE 厂商，仍容易受到中国代加工能力和市场价格波动影响。EnergyX 计划在 Project Lonestar 和
              Project Powder Hound 将精炼直接整合进生产版图，以此保护经济性，路径类似 Tesla 在德州 Robstown 锂精炼厂的下游策略。EnergyX
              还声称，其在规划中的犹他州和智利项目资本强度领先行业，为 $12,500 至 $14,500 / 吨。要守住这道护城河，公司必须严格保护其 140+ 项已申请专利，并证明商业规模运营支出能够抵御低迷锂化学品价格。
            claimRefs:
              - CP013
              - CP014
