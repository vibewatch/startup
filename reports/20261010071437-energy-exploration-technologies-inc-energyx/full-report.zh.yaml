  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 决策与价格纪律
        blocks:
          - type: paragraph
            body: >-
              建议是继续跟踪（TRACK），而不是投资。Eni 承诺的 2.25 亿美元金额可观，但它买入的是 Project Black Giant 的少数股权，并不能据此建立 EnergyX
              普通股的公平市场估值。公司募资页面给出的投前隐含估值为 32.59 亿美元，而 KingsCrowd 列出的 2026 年 9 月发行估值为 19.21
              亿美元。两组价格差异巨大，现有披露中的股份数量、证券类型、优先权和稀释信息不足以调和。与此同时，独立报道把商业化执行列为核心风险。因此，入场必须以最新经审计财务报表、完全摊薄资本表、适用的证券条款，以及商业产出能够填补已披露示范到生产缺口的证据为前提。
            claimRefs:
              - CV001
