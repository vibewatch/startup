      - number: '4.4'
        title: 财务投资判断与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              从机构投资判断角度看，EnergyX 拥有颇具潜力的技术选择权和一级战略赞助，但其财务状况缺少商业投资判断所需的合同基础。Eni、General Motors 等全球产业伙伴的参与，为 GET-Lit™
              提锂概念提供了技术验证；但公司尚未将这些战略关系转化为具有约束力、照付不议且带有强制数量承诺的采购协议。正如第三方关键矿产评估所指出，财务和执行风险已取代单纯的提取化学，成为商业可行性的主要障碍。

              管理层自行设定的发行前隐含估值，例如众筹宣传材料中的 $3.26B，以及 SEC 认证零售轮中的 $1.15B 至 $1.92B 定价基准，反映的是零售发行价格，而非公平交易条件下的机构价格发现。零售股价与
              EnergyX 实际运营基本面（FY23 收入 $210,250、持续每月烧钱 $1.2M）之间的偏离，为机构投资者带来显著下行风险。

              当前有几项关键尽调阻碍，使最终财务建模无法完成。第一，EnergyX 尚未披露 2024 或 2025 财年的经审计公司财务报表，因而无法看清示范项目之后的现金余额和企业管理费用。第二，TaaS
              模式下实际的商业许可费率表和利润分成结构仍属机密。在 EnergyX 证明 Project Lonestar 的商业化提取率持续稳定、取得美国 EXIM
              银行的最终贷款文件并签署披露保底定价的约束性承购协议之前，投资判断必须将公司归为高风险，其资本需求高度依赖外部融资。
