      - number: '4.3'
        title: 资本充足性、现金消耗与融资结构
        blocks:
          - type: paragraph
            body: >-
              EnergyX 通过战略产业企业投资与大规模零售股权众筹相结合的非典型双轨资本结构，为多年研发和项目开发提供资金。截至 2026 年中，公司披露累计股权募资超过 $178M，投资者超过 49,000
              人，来源包括多轮 Regulation A+ 和 Regulation CF 发行，以及 General Motors Ventures、POSCO 关联基金和 Eni Next 的战略投资。但公司向 SEC
              提交的历史公开披露凸显了显著资本消耗和持续的企业现金烧钱。

              EnergyX 通过 DealMaker Securities 披露的 2023 财年数据中，全年商业收入仅 $210,250，销售成本为 $15,777,050，净会计亏损为 $14,937,941。2023
              年末，公司资产负债表持有现金及等价物 $20,475,353，运营现金消耗约 $1.2M / 月；若没有后续融资轮，由此推算运营 runway 约为 16.4 个月。

              为弥补商业规模部署所需的巨大资本缺口，EnergyX 转向非稀释性项目融资和资产层面的股权融资。2024 年 7 月，美国 EXIM 银行为 Project Black Giant 商业建设融资出具 $690M
              债务融资非约束性意向书。该债务融资拟补充 Eni 的 $225M 项目股权承诺，后者用于资产层面开发，而不是流入母公司金库。EnergyX 仍需敲定最终债务协议，并完成额外股权轮（例如拟议中的 C
              轮），以支付企业管理费用和扩张本土 Smackover 业务。
