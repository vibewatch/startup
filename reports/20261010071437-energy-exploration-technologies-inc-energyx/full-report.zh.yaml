  - id: TP002
    title: 特征 / 能力矩阵
    columns:
      - 提取 / 精炼维度
      - EnergyX（GET-Lit™）
      - 离子交换 DLE（Lilac / 同行）
      - 大陆型太阳能蒸发（Albemarle）
      - 硬岩锂辉石（澳大利亚 / 中国）
    rows:
      - - 核心分离机制
        - 混合吸附、溶剂萃取与选择性膜分离
        - 接触柱中的固体离子交换吸附珠
        - 开放式蒸发池中的太阳能分级结晶
        - 破碎、重介质浮选和酸焙火法冶金
      - - 提取与处理周期
        - 从原卤水进料到纯化锂精矿只需数小时
        - 连续吸附与解吸循环需数小时至数天
        - 取决于太阳能蒸发速率，需 12 至 18 个月
        - 采矿、选矿和精炼需数天至数周
      - - 锂回收效率
        - 预计回收率 >90%（试点测试声称 94% 至 98%）
        - 已报道不同卤水类型的回收率为 80% 至 90%
        - 回收率 40% 至 60%，伴随显著卤水夹带损失
        - 从原矿到精矿的整体回收率为 60% 至 75%
      - - 淡水与试剂占用
        - 选择性膜配合闭环回注，减少淡水取用
        - 需要大量洗脱液清洗水和酸再生试剂
        - 化学试剂取用少，但蒸发造成的淡水损失巨大
        - 硫酸强度高，且热焙烧依赖化石燃料能源
      - - 下游精炼整合
        - Project Lonestar 一体化精炼至电池级 LiOH/Li2CO3
        - 生产需要第三方化学转化的中间洗脱液
        - 在现场生产技术级或电池级碳酸盐并完成精制
        - 生产需要海外化学精炼的锂辉石精矿
    notes: 技术参数汇总自 EnergyX 工程宣传册、Chemical Engineering 报道和 USGS 商品数据。竞争对手回收率和试剂需求反映供应商声称，缺乏标准化第三方审计验证。
