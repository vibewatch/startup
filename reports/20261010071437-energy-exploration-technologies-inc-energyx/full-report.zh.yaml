  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分与理想客户画像
        blocks:
          - type: paragraph
            body: >-
              EnergyX
              将潜在商业客户分为三类核心资源和工业主体：上游卤水资源运营商、综合能源巨头，以及下游汽车和电池制造商。上游资源开发商是技术许可和设备销售的主要目标，包括南美锂三角大陆盐湖卤水运营商，以及北美德州、阿肯色州
              Smackover 地层等地下油田卤水运营商。这些运营商需要 DLE 系统在数小时内直接从卤水中回收锂离子，而非等待多年蒸发池周期；目标回收率超过 90%，并通过闭环回注将用过的卤水送回地下。下游汽车
              OEM，尤其是 General Motors，是寻求稳定且符合 IRA 要求的本土关键矿产原料的关键承购买方。美国地质调查局依据 2020 年《能源法》将锂列为关键矿产，凸显推动 OEM
              采购兴趣的战略紧迫性。不过，EnergyX 的销售仍面临明显结构性摩擦：企业采购 DLE 设备涉及数亿美元资本开支决策，采购评估周期为两年至五年。
