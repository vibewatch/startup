      - number: '6.3'
        title: 留存韧性、扩张摩擦与集中度风险
        blocks:
          - type: paragraph
            body: >-
              在当前商业化前阶段，EnergyX
              的净收入留存率（NRR）和毛收入留存率（GRR）无法计算，也没有经济意义。卤水测试服务是离散、非经常性的按服务收费评估，而不是可预测的软件或经常性耗材合同。客户集中度很高：2025 年 100%
              的产品设备收入都来自孤立的示范硬件交付，未来商业收入也高度集中于两家战略对手方（Eni 和 GM）。合作伙伴的执行风险也在累积：2026 年初，随着税收抵免到期后零售电动车采用率降温，GM 录得约 $6B
              电动车相关减值，引发市场对汽车承购需求时点和数量的疑问。同时，正极合作伙伴 Wildcat Discovery Technologies 被瑞典电池初创公司 Holyvolt 以 $73M 收购；Holyvolt
              尚未证明其正在开发的丝网印刷电芯能实现商业规模制造。再加上截至 2025 年末累计净亏损 $73.3M，以及独立审计师正式出具的持续经营解释性警示，EnergyX
              在客户进展转化为自我维持的商业现金流之前仍面临重大执行障碍。
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: 展示项
        blocks:
          - type: callout
            title: 高知名度战略联盟下仍无商业承购执行
            body: >-
              EnergyX 虽成功获得 Eni 和 General Motors 等高知名度企业伙伴，但两段关系都尚未带来具有约束力、无条件的商业产品承购交付。Eni 的 $225M 承诺锁定在智利项目资产内，给予 Eni
              少数股权和提取 25% 产量的选择权，并非能够预先产生收入的技术许可。GM 的战略合作提供承购优先权，但宏观电动车市场调整和补贴退坡，使未来汽车采购需求的数量和时点存在不确定性。
            calloutType: risk
            claimRefs:
              - CU009
              - CU010
              - CU015
          - type: callout
            title: 示范规模试验场是进入矿业许可的门槛
            body: >-
              在资源提取技术领域，全球矿业集团和化学品运营商通常不会在未查看现场规模示范工厂连续运行数据前签署技术许可协议。EnergyX 于 2026 年 3 月启用年产 250 吨的 Project Lonestar
              示范工厂，是连接台式卤水测试（2025 年 $244,000）与商业规模设备订单不可或缺的前置步骤，使潜在企业客户能够在真实条件下验证锂选择性和回收率。
            calloutType: insight
            claimRefs:
              - CU004
              - CU007
              - CU008
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、特许权与司法辖区风险
        blocks:
          - type: paragraph
            body: >-
              EnergyX 的资源开发策略暴露于南美和北美多个司法辖区的重大地缘政治及监管障碍。在南美，玻利维亚政府于 2022 年 6 月将公司排除在 Uyuni 和 Pastos Grandes
              盐滩招标之外，说明国有化锂资源固有的主权风险。在智利，EnergyX 已为 Project Black Giant 在 Salar de Punta Negra 附近 Domeyko 山脉取得 100,000
              英亩土地，但商业开发仍取决于环境审批、取水限制和国家锂战略框架。智利亲商业领导层当选后，外国投资环境更有利；然而，最终的特殊锂运营合同（CEOL）和社区咨询流程周期较长，可能推迟建设。在北美，EnergyX 已在
              Smackover 地层取得约 50,000 英亩土地，其中包括 2025 年以 $4M 现金和 $22M 股票期权收购 Daytona
              Lithium。但德州和阿肯色州的大规模商业提取仍面临不断变化的州级地下回注规则，以及 EPA Class II 和 Class V 注入框架下的环境许可要求。
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR005
              - CR006
      - number: '7.2'
        title: 运营扩张与工艺技术风险
        blocks:
          - type: paragraph
            body: >-
              核心技术风险在于把 EnergyX 专有 GET-Lit 平台从示范单元扩展到连续商业化生产。公司虽于 2026 年初在德州 Texarkana 附近 Project Lonestar 成功启用年产 250
              吨的示范工厂，用于生产客户认证样品，但示范设施并不能证明膜在高产量工业条件下具备多年耐久性。GET-Lit 架构结合吸附、溶剂萃取和锂选择性膜，目标是在数小时内实现超过 90% 的回收率，而蒸发周期需要 12 至
              18 个月。但行业竞争者和技术顾问对 EnergyX 声称的、却缺乏公开第三方工程研究支持的技术主张持怀疑态度，尤其涉及膜污染、化学试剂消耗以及高总溶解固体条件下的选择性衰减。EnergyX
              此前曾向一名公开质疑其营销主张的行业顾问发出停止并终止函，显示公司对独立技术审查较为敏感。此外，将 Project Black Giant 扩至 52,500 tpy 预计需要 $1B
              资本开支，意外的工程重设计或设备延迟可能导致严重的资本成本超支。
            claimRefs:
              - CR002
              - CR006
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR009
              - CR010
      - number: '7.3'
        title: 合作伙伴集中度与资本依赖
        blocks:
          - type: paragraph
            body: >-
              EnergyX 的商业化路径高度依赖一小批战略伙伴和债务提供方。2026 年 7 月，意大利能源巨头 Eni 承诺以 $225m 股权取得 Project Black Giant
              少数股权，并获得提取未来碳酸锂产量约 25% 的权利。Eni 的支持显著降低了第一、第二阶段开发中股权融资部分的风险，但整体项目融资结构仍取决于美国进出口银行（U.S. EXIM Bank）$690m
              的非约束性意向书。若这份 LOI 无法转化为带有可接受偿债约束的最终信贷安排，项目将立即出现数亿美元的资金缺口。此外，锚定汽车伙伴 General Motors 通过 Series B 投资持有产量承购权；如果
              GM 调整电池正极化学体系或推迟商业承购量，公司就会面临客户集中风险。这些内部依赖还受到外部市场变化的放大：中国产商控制全球 70% 至 75%
              的锂化学品精炼产能，并且历史上持续压低利润率，带来长期价格波动，威胁西方直接提锂项目的单位经济性。
            claimRefs:
              - CR004
              - CR007
              - CR008
              - CR011
              - CR014
