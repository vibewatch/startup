      - - 化学浓缩（SX）
        - 溶剂萃取接触器与试剂
        - 将锂转移至有机相，并回收最高 60,000 ppm 的浓缩洗脱液
        - 特种有机萃取剂和酸回收回路
        - 有机相夹带、水相萃余液中的溶剂损失和易燃性控制
      - - 膜精炼（MX）
        - GET-Lit™ 可调孔径聚合物膜
        - 将锂与剩余单价 / 多价离子选择性分离
        - 高渗透压下的膜模块完整性
        - 膜污染、酸暴露导致的化学降解和更换频率
      - - 地下回注
        - 回注井与泵送基础设施
        - 将贫锂卤水返回地下储层
        - 地质孔隙度、渗透率和监管回注许可
        - 地层酸化、矿物沉淀以及当地地震 / 压力限制
