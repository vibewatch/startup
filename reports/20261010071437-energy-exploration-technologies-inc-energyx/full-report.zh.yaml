  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: GET-Lit™ 平台架构与卤水分离机制
        blocks:
          - type: paragraph
            body: >-
              EnergyX 将其核心技术平台 GET-Lit™（前身为 LiTAS™）定位为从卤水到电池的一体化直接提锂架构。传统锂卤水回收依赖盐滩上的大片蒸发池，需要 12 至 24 个月浓缩盐分，锂回收率只有 30% 至
              60%，还会将数百万加仑水永久蒸发到大气中。相比之下，EnergyX 的工程化流程旨在数小时内从地下盐湖和油田卤水中选择性分离锂离子，再将贫化卤水回注地下含水层。

              GET-Lit™
              核心流程由三项单元操作组成：吸附（AX）、溶剂萃取（SX）和选择性膜分离（MX）。吸附剂珠从原始过滤卤水中选择性捕获锂，并实现高回收率；随后，专有溶剂萃取化学试剂将中间洗脱液提纯并浓缩，使锂浓度最高达到
              60,000 ppm；最后，具有工程化可调孔径的选择性传输膜，将锂离子与钠、镁、钙、硼等竞争性一价和多价杂质分开，从而直接转化为电池级碳酸锂或氢氧化锂。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
