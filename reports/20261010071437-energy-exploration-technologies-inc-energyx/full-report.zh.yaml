  - id: TV003
    title: 乐观、基准与悲观情景框架
    columns:
      - 情景
      - 明确假设
      - 估值或回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 商业规模 DLE 达到吞吐量、纯度、回收率和成本目标；项目股权与债务完成交割
        - 只有在获得证明后，$1.921B-$3.259B 的观察标记区间才可作为参考；不做内在价值估计
        - 当前概率低，因为披露产量仍停留在示范规模
        - 商业调试或融资出现延误
      - - 基准
        - 技术进展持续，但放大和全额融资仍待完成
        - $1.146B-$1.921B 的历史至当前发行参考区间；等待完整条款
        - 混合：战略支持抵消了尚未解决的经济性问题
        - 稀释、优先权悬置或过时的财务数据显著削弱普通股权益
      - - 悲观
        - 放大失败、项目债务无法到位，或锂价持续承压
        - 低于 2024 年 12 月 $1.146B 参考标记，或普通股权益价值受损
        - 商业化 DLE 证据仍有限，因此这一情景并非不可能
        - 经验证的成本、回收率、许可或流动性目标未达成
    notes: 区间框定了 KingsCrowd 和 EnergyX 披露的私募发行标记；这不是公允价值估计，概率属于定性判断，缺少证券条款也无法计算回报。
    claimRefs:
      - CV002
      - CV003
