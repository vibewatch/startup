      - number: '7.5'
        title: 图表
        blocks:
          - type: callout
            title: 融资与商业化断崖：从试点走向 52,500 tpa
            body: >-
              EnergyX 已在试点和 250 tpy 示范规模上证明技术可行，但商业化执行仍面临严峻障碍。把美国进出口银行 6.9 亿美元的非约束性 LOI 转为可提款的最终融资，并将 Project Black
              Giant 的 DLE 膜规模扩至 52,500 tpy，都是尚未验证的运营里程碑；技术或资本层面的失败都会击穿投资逻辑。
            calloutType: risk
