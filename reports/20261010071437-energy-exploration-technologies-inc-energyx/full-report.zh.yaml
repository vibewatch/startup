              DLE 可将卤水提取从 18 个月缩短至数小时，但全球锂化学品精炼仍是严重的地缘政治瓶颈：中国控制约 70% 至 75% 的全球转化产能，并有意压低利润。若没有 EnergyX 规划中的 Project
