            body: >-
              评估 EnergyX 的单位经济性，需要区分南美盐湖资源的初步工程研究与北美本土卤水地层的运营基准。智利 Project Black Giant 与 Worley 合作完成的工程预可研预计资本开支约为
              $14,500 / 吨，碳酸锂当量直接运营成本为 $2,944 / 吨。EnergyX 将这些数字定位为行业领先；传统蒸发池运营商的运营费用通常为 $4,000 至 $9,100 / 吨，并且在 18
