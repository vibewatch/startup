            body: >-
              EnergyX 通过机构风险投资轮、非稀释性政府奖励和零售股权众筹相结合的混合融资模式，累计募资超过 $178M，零售投资者超过 49,000
              人（CO005）。公司当前零售发行材料公布了由管理层设定的发行前隐含估值 $3,258,556,886；该数字只是将总流通股数乘以发行价得出，未经独立第三方评估（CO006）。2026 年 7 月，意大利能源集团
              Eni 达成重要战略合作，以 $225M 股权投资换取智利 Project Black Giant 的少数股权，并获得约 25% 商业锂产量的提货权（CO007）。这项股权承诺补充了美国进出口银行（EXIM）为
              Project Black Giant 商业设施融资而出具的 $690M 债务融资意向书（CO008）。这些协议建立在更早的战略资本之上，最重要的是 General Motors 于 2022 年领投
              EnergyX 的 $50M B 轮融资，以获得面向其北美电动车车队的长期电池原料承购选择权（CO011）。
