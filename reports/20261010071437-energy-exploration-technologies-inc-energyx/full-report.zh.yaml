  - id: FE001
    title: GET-Lit™ 端到端直接锂提取处理堆栈
    type: stack
    summary: 集成式五层流程图，展示从原始卤水进入，到多阶段物理和化学分离，再到商业化电池级产品的过程。
    data:
      layers:
        - label: 原始卤水进料与预处理
          detail: 进入地下盐湖或油田卤水，随后过滤去除固体和烃类。
          items:
            - 地下井进料
            - 颗粒过滤
            - 温度与压力调节
        - label: 选择性锂吸附（AX）
          detail: 工程化吸附剂珠接触器从高盐度卤水中优先捕获锂分子。
          items:
            - 吸附剂接触柱
            - 卤水耗竭与冲洗
            - 低体积水洗脱
        - label: 溶剂萃取浓缩（SX）
          detail: 通过有机溶剂相转移，将中间卤水中的锂浓缩至最高 60,000 ppm。
          items:
            - 液液萃取接触器
            - 相分离与洗涤
            - 酸回收汽提
        - label: 选择性膜纯化（MX）
          detail: GET-Lit™ 专有膜将锂离子与剩余多价杂质分离。
          items:
            - 可调孔径膜壳
            - 多阶段错流过滤
            - 精制与离子交换
        - label: 精炼与产品转化
          detail: 通过化学转化制成电池级氢氧化锂或碳酸锂。
          items:
            - 氢氧化锂结晶
            - 电池级包装（5-25t 批次）
            - 纯度认证测试
        - label: 含水层管理与回注
          detail: 将锂耗竭卤水闭环回注至地下地层。
          items:
            - 压力管理与泵送
            - 地下注入井
            - 含水层监测系统
    approximationNotes: 流程图架构展示 EnergyX 技术资料和专利申请中披露的功能阶段。
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE008
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 展示多阶段客户参与生命周期：从最初的卤水样品评估，到示范认证、项目共同投资及商业包销交付。
    data:
      nodes:
        - label: 阶段 1：实验室卤水测试
          detail: 采矿运营商提交卤水样品，进行化学分析和台架规模锂回收评估（2025 年收入 $244K）。
          touchpoints:
            - Austin R&D laboratory evaluation
            - Certificate of Analysis and recovery assessment
        - label: 阶段 2：试点与示范验证
          detail: 部署撬装式试点设备，并在 Lonestar 项目开展示范（产能 250 tpa），证明回收率超过 90%。
          touchpoints:
            - Lonestar demonstration plant tours
            - Smackover brine processing runs
        - label: 阶段 3：战略合作与共同投资
          detail: 战略企业伙伴（Eni、GM）执行股权合资，取得项目层面权益和产量包销选择权。
          touchpoints:
            - Worley Pre-Feasibility Study reviews
            - Project equity subscription agreements
        - label: 阶段 4：商业规模建设
          detail: 完整商业工厂的工程、采购和建设（Black Giant 项目阶段 1 和 2，共 52,500 tpa）。
          touchpoints:
            - EPC contracting and EXIM Bank debt drawdown
            - Environmental permitting in Domeyko Range
        - label: 阶段 5：产量包销与耗材
          detail: 按多年合同交付电池级碳酸锂和氢氧化锂，同时持续销售替换膜。
          touchpoints:
            - Direct delivery of battery-grade lithium compounds
            - GET-Lit proprietary membrane cassette replacements
        - label: 阶段 6：下游材料整合
          detail: 通过拟议的 15,000 tpa TexAmericas LFP 工厂等合资企业，就地配套正极材料制造。
          touchpoints:
            - TexAmericas Center site development
            - Cathode specification testing with battery makers
    approximationNotes: 阶段勾勒出 EnergyX 预计的商业化模式；截至目前，实际客户进展已达到阶段 2 和阶段 3，但商业阶段 5 交付量为零。
    claimRefs:
      - CU001
      - CU004
      - CU008
      - CU010
      - CU011
