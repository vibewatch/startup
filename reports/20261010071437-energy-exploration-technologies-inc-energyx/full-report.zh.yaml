            body: >-
              EnergyX 的双重商业模式试图通过开发专有资源、同时向 POSCO 和 ExxonMobil 等矿业巨头销售 DLE 技术，降低采用阻力。但矿业巨头面对数亿美元规模的最终投资决策，评估周期长达 24 至 36
              个月，形成显著商业惯性，也迫使 EnergyX 为自有项目承担沉重资本承诺。
