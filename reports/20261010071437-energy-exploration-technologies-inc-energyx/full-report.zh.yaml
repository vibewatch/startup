            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM008
              - CM009
              - CM010
      - number: '2.3'
        title: 买方细分、工作流归属与采购路径
        blocks:
          - type: paragraph
            body: >-
              锂化学品市场不同买方的采用路径差异很大，区别在于工作流归属、认证要求和资本投入。第一层买方是全球汽车 OEM，以 General Motors 为例：该公司领投 EnergyX 的 B
              轮融资，以获得承购权，并支持其到 2035 年每年采购 400,000 吨锂的内部目标。汽车买方通常由企业供应链高管直接监督多年期承购安排，往往加入接近 $15,000 /
              吨的保底价条款，在满足《通胀削减法案》（IRA）本土采购要求的同时，保护潜在生产商免受价格波动影响。第二层买方是 POSCO 等电池正极材料制造商，其采购严格取决于化学品认证标准，包括 99.5%
              的碳酸盐纯度以及对铁、钠杂质的严格容忍度。最后，墨西哥湾沿岸 Smackover 地层的资源持有者和油田运营商构成独立的企业许可细分市场；他们希望用 DLE
              系统将卤水中的锂副产品变现，而无需把资产负债表资本投入完整的化学精炼。
            claimRefs:
              - CM006
              - CM011
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM011
              - CM013
      - number: '2.4'
        title: 采用驱动、结构性瓶颈与规模缺口
        blocks:
          - type: paragraph
            body: >-
              DLE
              市场扩张受多项结构性顺风推动，包括更严格的汽车排放标准、要求加州和欧洲配备四小时电池时长的电网级储能政策，以及推动关键矿产自主的西方立法。但商业化时点仍受明显约束。最重要的结构性瓶颈是全球转化环节：中国控制全球约
              70% 至 75% 的锂化学品精炼产能，历史上还以较窄利润运营转化资产，使没有本地精炼能力的西方独立提取项目在经济上十分脆弱。商业 DLE 的资本密集度同样很高：Benchmark Mineral
              Intelligence 估计，年产 10,000 至 20,000 吨的商业工厂需要 $300M 至 $500M 资本开支，EnergyX 则预计其德州 50,000 tpa 工厂需要约 $1B。尽管 Eni
              和 General Motors 的战略支持提供了重要机构背书，EnergyX 尚未公开披露 Project Lonestar
              产量对应的、具有透明数量计划和保底价的长期约束性商业承购合同，因此长期收入实现仍取决于商品价格周期和融资执行。
            claimRefs:
              - CM008
              - CM010
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 中游精炼瓶颈导致规模判断分歧
            body: >-
              原始锂资源分布在北美油田和南美盐湖，但化学转化仍高度集中，中国控制 70% 至 75% 的精炼产能。EnergyX 在 Project Lonestar 将 DLE
              提取与精炼结合，直接应对这一瓶颈；不过从示范产能扩至商业吞吐量，仍需填补巨大的资本缺口。
            calloutType: insight
            claimRefs:
              - CM010
              - CM013
          - type: callout
            title: 下游价格周期与资本密集度风险
            body: >-
              商业 DLE 每 10k-20k tpa 产能需要 $300M 至 $500M，而 Benchmark 现货碳酸锂价格约为 $19,750 /
              吨；由于尚未披露带保底价的约束性商业承购合同，规划中的数十亿美元商业扩张仍暴露于商品价格下行。
            calloutType: risk
            claimRefs:
              - CM004
              - CM008
              - CM014
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：直接 DLE 同业、现有企业与替代方案
        blocks:
          - type: paragraph
            body: >-
              EnergyX 所处的全球锂供应链正从传统提取方法转向模块化直接提取技术。竞争者可分为三类：Lilac Solutions 和 Aepnus 等风险投资支持的 DLE 技术开发商；Albemarle 和 SQM
              等现有卤水生产商，它们在南美和内华达运营大型大陆蒸发系统；以及澳大利亚和中国的硬岩伟晶岩矿商，通过露天开采提取锂辉石。此外，ExxonMobil 等大型综合能源公司已在 Smackover
              地层取得大片土地，以部署专有或许可的 DLE 系统；Tesla 等汽车制造商则已纵向整合本土锂精炼。EnergyX 的差异化定位是把 GET-Lit™
              做成混合平台，可根据不同卤水化学性质调整吸附、溶剂萃取和膜分离；而单一机制的同业在不同盐度和杂质结构下会面临提取取舍。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: 技术架构与提取能力矩阵
        blocks:
          - type: paragraph
            body: >-
              区分 DLE 与传统方法的技术基准，主要看循环时间、回收效率和化学品强度。传统大陆太阳能蒸发需要露天浓缩 12 至 18 个月，原位损失 40% 至 60%
              的初始锂，还依赖大片土地和适宜的干旱气候。硬岩锂辉石开采同样需要高能耗的破碎、浮选和酸焙烧。相比之下，EnergyX 声称 GET-Lit™ 平台可在数小时内实现超过 90%
              的锂回收，并通过闭环卤水回注减少环境和用水足迹。EnergyX 已在 2026 年初启用的德州 Project Lonestar 工厂展示这一能力，该示范设施年产能为 250
              公吨。不过，随着公司从试点示范向数千吨级设施扩张，连续运行可用率、膜污染率和商业规模单元运营成本仍缺乏独立技术验证。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: 商业合同、采购周期与切换动力
        blocks:
          - type: paragraph
            body: >-
              EnergyX 采取双重商业策略，既作为知识产权和设备供应商获取价值，也作为直接锂资源所有者获取价值。在技术许可上，公司瞄准 POSCO、ExxonMobil
              等大型矿业集团和资源持有者。但机构级锂技术许可的销售周期通常长达 24 至 36 个月，因为矿业巨头会以保守的工程门槛评估数亿美元规模的最终投资决策。为避免完全依赖第三方采用，EnergyX
              积极争取直接持有资源并建立合资合作，包括与 Compass Minerals 签约开发犹他州 30,000 tpa 的 Project Powder Hound；EnergyX
              负责出资和运营提取设施，并支付生产许可费。同时，EnergyX 获得意大利能源巨头 Eni 对智利 52,500 tpa Project Black Giant 的 $225M 战略股权投资，并配套约覆盖 25%
              产量的承购协议及美国 EXIM 银行 $690M 债务意向书。
