              2026 年 3 月 26 日，EnergyX 在德州 Hooks 启用 Project Lonestar 示范设施，完成关键的美国本土运营里程碑；该设施处理 Smackover 地层卤水，年设计产能为 250
              公吨电池级氢氧化锂，成为该州首座直接提锂工厂（CO009）。公司投入约 $30M 建造并调试 Lonestar 示范工厂，用于在规划中的 $1B 商业设施投产前，完成 5 至 25
