              地层卤水中提锂的运营设施。

              Lonestar 是 EnergyX 在国内和国际资源版图部署商业规模设施的运营前置环节。该工厂向电动车 OEM、正极材料生产商和战略合作伙伴（包括 General Motors 和 POSCO）提供 5 吨至
              25 吨的电池级认证样品。此前，EnergyX 在玻利维亚验证了早期集装箱式试点单元，披露锂回收率最高达 94%，且无需额外淡水消耗。在南美，EnergyX 正推进智利 Antofagasta 的 Salar
              de Punta Negra Project Black Giant，目标是分两期形成 52,500 公吨 / 年商业产能，由 Eni $225M 战略投资和美国 EXIM 银行 $690M 债务意向书支持。
