    rows:
      - - 卤水提取与浓缩
        - 横跨数百公顷、历时 12 至 24 个月的太阳能蒸发池
        - 连续式工业吸附和选择性化学萃取模块
        - 提取周期从数月缩短至数小时；锂回收率超过 90%，而蒸发池为 30-60%
        - 泵、加热器和化学再生系统耗电量高
      - - 杂质分离与精炼
        - 多道化学沉淀工序，需要大量淡水稀释并造成试剂损耗
        - 溶剂萃取和带可调孔径的选择性膜分离
        - 将锂洗脱液浓缩至最高 60,000 ppm，同时选择性排除多价离子
        - 高盐度下的膜结垢、孔径堵塞和有机溶剂降解
      - - 环境水处置
        - 每生产一吨产品，就将数百万加仑水永久蒸发到大气中
        - 将贫锂卤水闭环回注原地下含水层
        - 净耗水量极低，工业设施占地紧凑
        - 地下水文地质风险、潜在井堵塞和含水层增压
      - - OEM 原料认证
        - 承购通用未精炼技术级碳酸盐，还需在海外进行二次转化
        - 在现场直接精炼成 5-25 ton 的电池级氢氧化物客户认证批次
        - 美国国内精炼路径，绕开海外化学转化瓶颈
        - 承购能否接受取决于各 OEM 批次严格的电池级纯度容差
