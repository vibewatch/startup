              按这些可研指标及 2026 年 5 月假设的 $25,000 / 公吨商品价格，管理层测算两期开发达到 52,500 吨 / 年满产后，年毛收入约为
              $1.3B。但独立尽调必须把这一收入顶部数字视为公司自行生成的示意性预测；它对商品价格波动和未经证明的商业规模工厂开工率高度敏感。

              Smackover 地层的本土成本结构带来更高的单位运营支出。独立关键矿产研究将北美 DLE 运营成本基准定在 $4,000 至 $7,000 / 吨
              LCE，原因包括机械泵送耗电更高、化学试剂消耗以及深层卤水回注井。2026 年 3 月，EnergyX 启用东德州年产 250 公吨的 Lonestar 示范设施，以在当地 Smackover
              卤水上验证这些单位成本动态。2026 年 6 月，EnergyX 又与 Wildcat Discovery Technologies 共同承诺 $230M，建设共址 LFP
              正极活性材料工厂，试图整合下游转化并获取更高的中游产品利润。
