companyProfile:
  summary: >-
    EnergyX is a pre-commercial direct lithium extraction company that pairs GET-Lit membrane and process technology
    with project development at Project Black Giant in Chile and Project Lonestar in Texas. The company monetizes
    through technology licensing, consumables, sample testing, and project-level lithium sales, but the public evidence
    still shows pilot and demonstration-scale execution rather than sustained commercial production.
