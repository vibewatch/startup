evidenceGaps:
  - type: missing-source
    severity: material
    topic: independent-valuation
    missingEvidence: >-
      Audited arms-length institutional valuation or Series C price discovery validating the management-promoted $3.26B
      valuation
    whyItMatters: >-
      The $3.26B valuation is derived strictly from a retail Reg A+ unit price multiplied by total shares outstanding,
      lacking institutional pricing validation
    diligencePath: Inspect latest SEC Form 1-A or 1-SA filings and any future institutional Series C lead investor term sheets
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-cap-table
    missingEvidence: >-
      Complete share ownership breakdown and cap table across Series A, Series B, retail investors, and management
      equity
    whyItMatters: >-
      Full dilution schedules, founder voting control, and preferred liquidation preferences remain undisclosed to
      outside diligence
    diligencePath: Request confidential cap table schedule and voting agreement documents under diligence NDA
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: Full employment contracts, equity vesting schedules, and non-compete agreements for executive team
    whyItMatters: >-
      Validating executive retention risk and key-person dependence requires inspection of employment terms and founder
      vesting
    diligencePath: Request executive employment agreements and equity option pool vesting records under management diligence
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: commercial offtake contracts
    missingEvidence: >-
      Fully executed, binding commercial offtake agreements with disclosed volume commitments and pricing mechanisms for
      Project Lonestar commercial output.
    whyItMatters: >-
      Without binding contracts with pricing floors or fixed off-takers, commercial-scale debt financing and cash flow
      predictability remain unverified.
    diligencePath: >-
      Review future EnergyX commercial disclosures or customer SEC filings confirming binding offtake commitments and
      delivery schedules.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: project lonestar commercial unit economics
    missingEvidence: >-
      Audited capital expenditure and per-ton operating cost breakdown for the proposed 50,000 tpa commercial facility
      in Texas.
    whyItMatters: >-
      While Black Giant has an independent pre-feasibility study by Worley, Lonestar commercial unit economics are based
      solely on management estimates.
    diligencePath: >-
      Obtain an independent engineering feasibility study or formal FEED study for Project Lonestar commercial
      expansion.
    relatedQuestionRefs:
      - QM009
  - type: missing-source
    severity: material
    topic: independent-dle-capex-benchmarks
    missingEvidence: >-
      Audited third-party operational data and arms-length engineering benchmarks comparing commercial-scale capital and
      operating expenditures of GET-Lit™ against competing DLE systems.
    whyItMatters: >-
      EnergyX's projected cost leadership ($12,500–$14,500/ton capex and $2,944/ton opex) relies on pre-feasibility
      engineering studies and internal pilot data rather than audited commercial operating results.
    diligencePath: >-
      Review independent engineering reports and audited financial statements from operational commercial-scale DLE
      facilities as Project Lonestar and Project Powder Hound advance.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: pricing-monetization
    missingEvidence: >-
      Binding master commercial contracts or detailed rate cards disclosing realized per-tonne licensing fees, offtake
      floor pricing, and margin sharing terms for commercial DLE deployments.
    whyItMatters: >-
      Without executed pricing schedules, financial models must rely on unverified management revenue projections rather
      than contracted unit realization.
    diligencePath: >-
      Request customer offtake term sheets, executed TaaS licensing agreements, and price adjustment mechanisms from
      management during confirmatory diligence.
