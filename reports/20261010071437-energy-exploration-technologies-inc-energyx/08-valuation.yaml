company:
  name: "Energy Exploration Technologies, Inc. (EnergyX)"
chapter:
  number: 8
  title: Valuation
  summary: >-
    EnergyX has secured meaningful project-level strategic capital, but its operating proof remains
    at demonstration scale and public valuation marks do not reconcile. The resulting stance is
    TRACK with low confidence, high risk, and no defensible intrinsic-value range until capitalization,
    current financials, financing conditions, and commercial-scale economics are disclosed.
sections:
  - id: decision-and-price-discipline
    title: Decision and price discipline
    body: >-
      The recommendation is TRACK rather than invest. Eni's $225 million commitment is substantive,
      but it purchases a minority interest in Project Black Giant rather than establishing an
      arm's-length valuation for EnergyX common equity. The company's fundraising page states a
      $3.259 billion pre-money implied valuation, while KingsCrowd lists a September 2026 offering
      valuation of $1.921 billion. Those marks differ materially and cannot be reconciled from the
      available share-count, security, preference, and dilution disclosures. At the same time,
      independent coverage describes commercial execution as the central risk. Entry discipline
      therefore requires current audited financials, a fully diluted capitalization table, the
      applicable security terms, and evidence that commercial output can bridge the disclosed
      demonstration-to-production gap.
    claimRefs: [CV001, CV003, CV004, CV006, CV013]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-and-valuation-evidence
    title: Financing and valuation evidence
    body: >-
      Financing evidence must be separated by entity and certainty. Eni's announced equity is tied
      to Project Black Giant, with associated project offtake rights, while the cited $690 million
      U.S. EXIM amount remains a letter of intent rather than a confirmed drawdown. EnergyX's own
      implied valuation and KingsCrowd's offering marks provide reference points, not a complete
      valuation bridge. KingsCrowd's 2024 campaign page also reports only $210,250 of FY2023 revenue
      and a $14.9 million FY2023 net loss; those historical accounting figures are neither ARR nor
      current cash burn. The available evidence therefore cannot support an enterprise-value,
      revenue-multiple, or discounted-cash-flow conclusion, and project financing must not be added
      to corporate funding or treated as cash available to the parent.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV007, CV008]
    tableRefs: [TV003]
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The thesis is that strategic capital, a commissioned 250-ton-per-year demonstration facility,
      and a company plan for 52,500 tons per year at Black Giant create valuable technical and
      resource optionality. Management's project model points to $1.3 billion of annual gross revenue,
      but only after both phases operate and at an assumed lithium price of $25,000 per metric ton.
      The anti-thesis is that DLE remains lightly proven at full commercial scale, the next disclosed
      production target is orders of magnitude above the demonstration plant, and lithium benchmark
      indices were negative in the retrieved snapshot. The investment case therefore turns on
      verified throughput, recovery, purity, operating cost, permitting, financing drawdown, and
      realized pricing rather than on gross-revenue targets alone.
    claimRefs: [CV009, CV010, CV011, CV012, CV013, CV014, CV015]
    tableRefs: [TV002]
  - id: scenarios-exit-and-final-diligence
    title: Scenarios, exit readiness, and final diligence
    body: >-
      The scenario ranges below are observed financing-mark bands, not intrinsic-value estimates.
      A bull outcome requires commercial-scale performance and project economics that validate the
      company's planned production and revenue model. The base case assumes continued technical
      progress but delays price discovery until financing terms and current financial statements are
      available. The bear case includes a down-round below the 2024 reference mark, prolonged
      commercialization, financing failure, or lithium-price compression. Liquidity cannot be
      underwritten as an offset: EnergyX says it is private, has no exchange for its shares, and has
      no set IPO date. Final diligence should therefore obtain the fully diluted capitalization,
      preference stack, Eni closing and governance terms, EXIM conditions and draw status, refreshed
      audited financials, and independent commercial-scale operating results.
    claimRefs: [CV002, CV005, CV006, CV010, CV012, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: "Recommendation: TRACK"
    body: >-
      Do not underwrite an investment price from the available public marks. Revisit after the
      capitalization, security terms, current financials, project-finance conditions, and
      commercial-scale operating evidence are available.
    claimRefs: [CV006, CV013, CV016]
  - calloutType: risk
    title: Project capital is not parent-company price discovery
    body: >-
      Eni's minority investment validates strategic interest in Project Black Giant, but it does not
      disclose a valuation for EnergyX common equity and should not be treated as unrestricted parent
      liquidity.
    claimRefs: [CV001, CV003, CV004]
