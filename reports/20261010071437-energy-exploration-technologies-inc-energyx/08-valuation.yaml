      - [Anti-thesis, "DLE has limited full-commercial operating evidence", "Independent operation at nameplate scale across representative brine chemistry"]
      - [Anti-thesis, "Company revenue model assumes $25,000 per metric ton lithium pricing", "Sensitivity table using realized contract prices and downside commodity cases"]
      - [Anti-thesis, "Private shares lack a trading venue or fixed IPO date", "Credible liquidity process with timing, lockups, and preference waterfall disclosed"]
    notes: "Company plans and economics remain management claims; the operating and liquidity milestones listed are diligence thresholds, not forecasts."
    claimRefs: [CV001, CV009, CV011, CV012, CV013, CV014, CV016]
  - id: TV003
    title: Bull, base, and bear scenario frame
    columns: [Case, Explicit assumptions, Valuation or return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Commercial-scale DLE meets throughput, purity, recovery, and cost targets; project equity and debt close", "$1.921B-$3.259B observed-mark band becomes a reference only after proof; no intrinsic estimate", "Low today because disclosed production remains demonstration scale", "Commercial commissioning or financing slips"]
      - [Base, "Technical progress continues, but scale-up and full financing remain pending", "$1.146B-$1.921B historical-to-current offering reference band; wait for full terms", "Mixed: strategic backing offsets unresolved economics", "Dilution, preference overhang, or stale financials materially weaken common equity"]
      - [Bear, "Scale-up fails, project debt does not fund, or lithium pricing remains compressed", "Below the $1.146B December 2024 reference mark or impaired common-equity value", "Plausible because commercial DLE evidence remains limited", "Verified cost, recovery, permitting, or liquidity miss"]
    notes: "Ranges bracket disclosed private-offering marks from KingsCrowd and EnergyX; they are not fair-value estimates, probabilities are qualitative, and returns cannot be calculated without security terms."
    claimRefs: [CV002, CV003, CV004, CV005, CV009, CV010, CV012, CV014, CV015]
