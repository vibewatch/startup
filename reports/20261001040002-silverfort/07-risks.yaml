callouts:
  - calloutType: "risk"
    title: "Channel Concentration and Indirect Billing Risk"
    body: "Silverfort's structural transition to a 100% channel-focused distribution model represents a double-edged sword. While generating over 100% year-over-year revenue growth and mobilizing tier-1 security resellers, conducting over 90% of worldwide sales through third-party intermediaries creates operational opacity. Silverfort relies on partner tiering and external sales forces rather than direct contractual ownership of enterprise buyer relationships."
    claimRefs:
      - "CR009"
      - "CR010"
  - calloutType: "insight"
    title: "Technological Differentiation Versus Platform Encroachment"
    body: "Silverfort's primary moat rests on securing legacy protocols and non-human identities without deploying desktop or server agents. However, the thesis break trigger lies in whether hyperscale identity providers like Microsoft build native agentless telemetry into Active Directory and Entra ID suites, which would commoditize third-party inline verification layers."
    claimRefs:
      - "CR005"
      - "CR011"
