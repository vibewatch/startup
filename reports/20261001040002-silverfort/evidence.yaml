evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-financial-scale
    missingEvidence: >-
      Current audited revenue and ARR, gross margin, net revenue retention, profitability, cash balance, debt, burn, and
      runway.
    whyItMatters: The dated growth disclosures cannot establish current scale, capital efficiency, or financing need.
    diligencePath: >-
      Request audited statements, monthly ARR bridge, customer cohorts, bank statements, debt schedules, and
      board-approved operating plan under NDA.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-board
    missingEvidence: >-
      Complete current legal officer roster, board composition, committee assignments, voting rights, succession plan,
      and founder retention terms.
    whyItMatters: Public titles do not establish decision rights, control, independence, or key-person mitigation.
    diligencePath: >-
      Review charter documents, board minutes, committee charters, employment agreements, and the current capitalization
      table.
    relatedQuestionRefs:
      - QO006
      - QO008
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: investor-rights
    missingEvidence: >-
      Complete capitalization table, round-level participation amounts, preferences, protective provisions, pro rata
      rights, and secondary transactions.
    whyItMatters: A public investor list does not show ownership concentration, governance control, or economic seniority.
    diligencePath: Request the fully diluted capitalization table, financing documents, side letters, and secondary-transfer ledger.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: headquarters
    missingEvidence: >-
      Authoritative legal domicile and current principal executive-office disclosure reconciling Tel Aviv and Plano
      references.
    whyItMatters: >-
      Jurisdiction, tax, employment, and regulatory diligence depend on the legal entity and principal office rather
      than a marketing profile.
    diligencePath: >-
      Obtain current corporate registry extracts and entity chart for Silverfort, Inc., Silverfort Ltd., and operating
      subsidiaries.
    relatedQuestionRefs:
      - QO001
      - QO008
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: >-
      Independent regulatory, litigation, outage, breach, leadership-change, customer-concentration, and
      acquisition-outcome evidence.
    whyItMatters: >-
      The assigned pool's lack of a matching adverse record is not evidence that no adverse event or concentration risk
      exists.
    diligencePath: >-
      Run jurisdiction-specific legal and regulatory searches, review incident logs and cyber-insurance notices, and
      request top-customer concentration and acquisition integration reports.
    relatedQuestionRefs:
      - QO008
  - type: stale
    severity: material
    topic: valuation-and-funding
    missingEvidence: >-
      A current valuation reference and any financing, debt, secondary, or acquisition-consideration activity after the
      January 2024 Series D.
    whyItMatters: >-
      The around-$1B valuation is a dated transaction reference and should not be treated as the October 2026 fair value
      or cash available.
    diligencePath: >-
      Request current 409A or preferred-share marks, financing documents, debt agreements, secondary records, and Fabrix
      purchase accounting.
    relatedQuestionRefs:
      - QO003
      - QO004
      - QO008
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Audited industry-wide dollar sizing breakdown separating pure ITDR software spend from broader IAM directories and
      endpoint EDR bundles.
    whyItMatters: >-
      Without segmented analyst revenue data, estimating Silverfort's exact serviceable addressable market (SAM)
      requires relying on qualitative category proxies rather than definitive TAM/SAM totals.
    diligencePath: >-
      Obtain segmented Gartner, IDC, or Forrester ITDR market sizing disclosures and contract deal size distributions
      from enterprise procurement data.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: blocking
    topic: audited-financial-metrics
    missingEvidence: Audited GAAP income statements, balance sheets, and verified Annual Recurring Revenue (ARR) breakdown.
    whyItMatters: Reported revenue growth rates and ARR claims cannot be underwritten without audited GAAP verification.
    diligencePath: Request confidential financial disclosures and audited auditor packages under NDA during formal diligence.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: retention-and-churn
    missingEvidence: Net Revenue Retention (NRR) and Gross Revenue Retention (GRR) cohort schedules across enterprise customers.
    whyItMatters: Expansion economics and customer churn resilience are necessary to model multi-year customer lifetime value.
    diligencePath: Review historical customer cohort renewal tables and contract expansion logs.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: gross-margin-breakdown
    missingEvidence: >-
      Cost of goods sold breakdown detailing cloud hosting, operational telemetry, and professional services delivery
      expenses.
    whyItMatters: Gross margin determines long-term operating leverage and SaaS software cash flow conversion.
    diligencePath: Inspect management accounting schedules and hosting cost unit metrics.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: architecture-mechanics
    missingEvidence: >-
      Detailed technical specification of domain controller hook mechanics, protocol interception driver architecture,
      and network packet deciphering without decryption.
    whyItMatters: >-
      Enterprise security evaluators cannot verify whether the domain controller integration introduces performance
      latency or kernel-level instability without proprietary architecture documents.
    diligencePath: >-
      Request unredacted Silverfort architecture design documents, latency benchmarks, and domain controller integration
      guides under mutual NDA.
    relatedQuestionRefs:
      - QE001
    relatedTableRefs:
      - TE003
  - type: access-blocked
    severity: material
    topic: compliance-certifications
    missingEvidence: >-
      Independent third-party SOC 2 Type II audit report, ISO/IEC 27001 certificate attestation, and FedRAMP security
      assessment package.
    whyItMatters: >-
      Public security pages return 404 and the trust portal requires customer login, leaving compliance claims
      uncorroborated by primary independent records.
    diligencePath: >-
      Obtain current SOC 2 Type II attestation report and ISO 27001 certificate directly from Silverfort security
      compliance team.
    relatedQuestionRefs:
      - QE006
  - type: stale
    severity: minor
    topic: ai-security-roadmap
    missingEvidence: >-
      Production performance telemetry, enterprise adoption case studies, and feature availability metrics for the
      Fabrix Security AI agent runtime protection module.
    whyItMatters: >-
      Capabilities acquired in April 2026 are slated for joint rollout in late 2026, making production maturity and
      differentiation unverified in current customer deployments.
    diligencePath: >-
      Request customer references and technical demonstration of Fabrix-derived AI agent runtime protection features in
      production environments.
    relatedQuestionRefs:
      - QE004
    relatedTableRefs:
