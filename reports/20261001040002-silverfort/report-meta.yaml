companyProfile:
  summary: >-
    Silverfort sells an agentless runtime identity-security platform that extends MFA, identity threat detection, and
    service-account protection to hybrid Active Directory, cloud identity, legacy application, and OT environments. The
    company is founder-led, channel-oriented, and well capitalized, with public evidence of broad enterprise adoption
    and a January 2024 Series D, but it still does not disclose audited recurring revenue, retention, margin, or burn
    metrics.
