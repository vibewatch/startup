chapter:
  number: 6
  letter: "U"
  title: "Customers"
  takeaway: "Silverfort demonstrates enterprise adoption spanning over 1,000 corporate customers, including multiple Fortune 50 enterprises and prominent global organizations across airline, aerospace, retail, and telecommunications sectors. However, because commercial go-to-market is structured as a 100 percent channel-led model where distributors and solution partners execute delivery, direct enterprise retention, contract expansion metrics, and customer cohort longevity remain strictly confidential."

sections:
  - id: "sec-customer-segmentation"
    title: "Enterprise Customer Segmentation and Go-to-Market Deployment Models"
    body: "Silverfort targets hybrid enterprise environments where legacy corporate infrastructure intersects with distributed cloud applications and software-as-a-service platforms [CU001, CU006]. The company categorizes its customer accounts into four operational tiers: Strategic Global Accounts, Enterprise Core Accounts, Mid-Market Commercial Organizations, and Digital Touch or Tech-Touch customers [CU002, CU011]. Commercial procurement is structured around IT and security operations teams, identity and access management architects, and Chief Information Security Officers driven by compliance mandates and cyber insurance underwriting requirements [CU001, CU007]. Rather than deploying client software agents or modifying mission-critical legacy domain controllers, Silverfort operates via an agentless runtime architecture that monitors authentication protocols across Active Directory, Kerberos, LDAP, NTLM, SSH, RDP, and cloud identity providers [CU005, CU006]. Delivery across these operational tiers is executed through an indirect channel-first model, where specialized value-added distributors and regional security solution providers manage software distribution, partner enablement, customer onboarding, and tier-one administrative support [CU007, CU008]."
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"

  - id: "sec-customer-growth-trajectory"
    title: "Customer Footprint Expansion, Authentication Scale, and Organizational Governance"
    body: "Silverfort's customer growth trajectory reflects rapid enterprise adoption, expanding from early enterprise deployments to a customer base exceeding 1,000 corporate clients globally, including multiple Fortune 50 and Fortune 100 corporations [CU001, CU002]. This organizational footprint is accompanied by significant operational transaction volume, with Silverfort's runtime access protection engine actively inspecting and verifying more than 10 billion authentications daily across on-premises and hybrid customer environments [CU001, CU014]. Enterprise adoption has been substantially accelerated by regulatory compliance deadlines and rigorous cyber insurance underwriting frameworks, such as New York Department of Financial Services 23 NYCRR 500 regulations, PCI-DSS requirements, and Federal Zero Trust executive directives [CU007]. To govern account health and scale customer retention across this growing international base, Silverfort maintains formal customer success leadership covering account planning, quarterly business reviews, customer health scoring, and multi-segment escalation workflows [CU002, CU011, CU013]. However, because Silverfort operates as a privately held venture-backed vendor, definitive quantitative retention indicators such as net revenue retention, gross revenue retention, and annual gross logo churn percentages remain non-disclosed private operating metrics [CU002, CU012]."
    tableRefs:
      - "TU002"
    figureRefs: []

  - id: "sec-named-customer-proof"
    title: "Named Customer Proof, Strategic Alliances, and Operational Limitations"
    body: "Publicly verifiable customer deployments and strategic alliances validate Silverfort's core functional utility across mission-critical enterprise environments [CU003, CU004, CU007]. Prominent international organizations across critical infrastructure, transportation, aerospace, retail, and telecommunications—including Airbus, Channel 4, Coop, Kayak, Ryanair, Rio Tinto, Swiss Automotive Group, Singtel, and UPS—utilize Silverfort to discover unprotected identities and enforce multi-factor authentication across legacy infrastructure [CU001, CU014]. In addition to commercial corporate customers, Silverfort has expanded its deployment surface through strategic technology alliances, such as its joint runtime security framework with SentinelOne, which integrates autonomous endpoint threat detection with runtime identity verification to defend against automated AI agents and compromised software supply chains [CU003, CU004]. Despite these marquee references, public evidence regarding customer experience is constrained: individual contract sizes, deployment seat counts, and expansion timelines are shielded by enterprise non-disclosure agreements, leaving third-party practitioners to evaluate adoption primarily through partner integrations and recruiter job postings rather than transparent user benchmarks [CU005, CU010, CU015]."
    tableRefs:
      - "TU003"
    figureRefs: []

