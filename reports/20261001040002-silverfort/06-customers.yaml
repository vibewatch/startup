callouts:
  - id: "callout-channel-dependence"
    title: "Channel-First Commercial Distribution Dynamics"
    calloutType: "risk"
    body: "Silverfort's transition to a 100 percent channel-led sales model delivers exceptional operational leverage and global reach across European and North American enterprise markets, but it inserts intermediary distributors and resellers between the company and its end-user accounts [CU007, CU008]. This structural separation limits Silverfort's direct visibility into customer renewal sentiment, creates margin sharing obligations with distribution partners, and makes enterprise retention partially dependent on partner technical proficiency [CU008, CU011]."
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU011"

  - id: "callout-retention-transparency"
    title: "Lack of Audited Retention and Expansion Metrics"
    calloutType: "insight"
    body: "While Silverfort reports rapid revenue expansion exceeding 100 percent annually and a customer base of more than 1,000 enterprise accounts, the company maintains strict confidentiality regarding its Net Revenue Retention and Gross Revenue Retention percentages [CU001, CU002, CU012]. In the absence of audited retention cohorts, investors must evaluate customer durability through executive customer success hiring priorities, expanding partner alliances, and enterprise reference endorsements rather than verified renewal accounting [CU002, CU003, CU013]."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU012"
      - "CU013"

