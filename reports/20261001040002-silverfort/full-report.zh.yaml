      - - 遗留协议与运营技术 (OT) MFA
        - 跨 RDP、SMB、Kerberos、RADIUS 及老旧工业系统执行无代理 MFA
        - 现代 WebAuthn 浏览器 SSO 席位、标准云端 SaaS SAML 重定向门户
