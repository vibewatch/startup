  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 运行时访问保护与目录层架构
        blocks:
          - type: paragraph
            body: >-
              Silverfort 的架构基础聚焦于 Runtime Access Protection（RAP），该方案旨在绕过传统终端代理与网络代理在运维与安全上的权衡取舍。Silverfort
              无需在每台受管工作站上部署软件，也无需通过内联网络设备路由应用流量，而是直接在身份提供商（IdP）层进行集成。针对本地 Active Directory 环境，域控制器在准予或拒绝访问前，会将身份验证请求转发给
              Silverfort 进行自动化风险分析。Silverfort 实时评估上下文风险指标；若高风险或敏感访问策略要求升级认证，Silverfort
              会通过消息服务向发起请求的用户发送多因素身份验证（MFA）质询。仅在质询成功完成后，Silverfort 才会指示 Active Directory 签发身份验证票据或允许访问，从而确保 Kerberos 和
              NTLM 等传统难以防护的协议在无需修改本地终端的情况下，获得现代零信任策略强制执行。
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
              - CE008
