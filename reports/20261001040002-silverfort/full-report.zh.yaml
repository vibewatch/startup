  - id: FE001
    title: Silverfort 运行时访问防护架构技术栈
    type: stack
    summary: 逻辑架构分层图，展示 Silverfort 如何跨混合企业资产拦截、分析并执行身份安全策略。
    data:
      layers:
        - label: 访问接口与用户终端
          detail: RDP、PsExec、Remote PowerShell、传统 ERP、CIFS 文件共享与工业 OT 设备
          modules:
            - 管理 CLI 与远程工具
            - 传统客户端-服务器系统
        - label: 目录与身份存储库
          detail: Active Directory 域控制器、Azure AD / Microsoft Entra ID、Okta、RADIUS 及 ADFS
          modules:
            - 本地 Active Directory 域控制器
            - 云端身份提供商
        - label: 流量拦截与破译层
          detail: 无需解密即可破译 Active Directory 身份验证流量的专利数据包检测技术
          modules:
            - 目录流量破译引擎
            - 协议分析（Kerberos/NTLM/LDAP）
        - label: 风险分析与策略决策核心
          detail: 持续行为风险评估、身份图谱画像构建与自适应规则触发
          modules:
            - 身份风险与行为分析
            - 实时决策与策略引擎
        - label: 执行与核验服务
          detail: 阶梯式增强认证消息、推送通知、FIDO2 令牌与活动会话主动阻断
          modules:
            - MFA 推送通知与 FIDO2 服务
            - 身份验证策略防火墙
        - label: 生态集成与云治理
          detail: 跨平台信号交换、SIEM/SOAR 连接器与 Microsoft Entra ID 桥接
          modules:
            - Microsoft Entra ID 桥接连接器
            - Silverfort 集成中心
            - 共享信号框架（SSF）引擎
    approximationNotes: 逻辑架构拆解提炼自官方服务定义白皮书与技术评审文档。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE011
  - id: FU001
    title: 客户旅程全景图
    type: journey-map
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU006
      - CU007
      - CU008
      - CU011
    data:
      nodes:
        - id: step-1
          label: 资产发现与合规评估
          touchpoints:
            - Enterprise faces cyber insurance renewal or regulatory MFA mandate (NY-DFS, PCI-DSS)
            - Channel partner (Exclusive Networks, CompuNet) conducts identity posture assessment
        - id: step-2
          label: 无代理部署与协议拦截
          touchpoints:
            - Non-invasive protocol-level integration deployed parallel to Active Directory domain controllers
            - Automated mapping of Kerberos, LDAP, NTLM, and SSH authentication flows without agents
        - id: step-3
          label: 身份盘点与基线风险画像
          touchpoints:
            - Centralized discovery of human accounts, service accounts, and automated AI agents
            - Baseline behavioral risk profiling established across hybrid enterprise resources
        - id: step-4
          label: 策略执行与运行时阶梯式 MFA
          touchpoints:
            - Enforcement of step-up MFA across command-line interfaces, legacy apps, and file shares
            - Automated blocking of anomalous lateral movement and credential theft in real time
        - id: step-5
          label: 客户成功导入与健康度评分
          touchpoints:
            - Customer Success onboarding reviews initial health scores and operational alert volumes
            - Establishment of quarterly business reviews and multi-segment escalation playbooks
        - id: step-6
          label: 规模扩展与战略生态集成
          touchpoints:
            - Expansion into non-human identity governance and automated AI agent runtime protection
            - Integration with endpoint detection and response platforms (SentinelOne Singularity alliance)
  - id: FR001
    title: 企业身份安全风险矩阵
    type: matrix
    summary: 风险严重程度矩阵，按影响程度与发生可能性映射企业身份威胁向量、运营脆弱点及渠道依赖。
    data:
      columns:
        - 可忽略影响
        - 轻微影响
        - 中度影响
        - 重大影响
        - 严重影响
        - 灾难性影响
      rows:
        - label: 频繁发生
          values:
            - label: 常规策略调整
              value: Low
            - label: 轻微配置漂移
              value: Low
            - label: 网络保险控制项更新
              value: Medium
            - label: 合作伙伴利润分成摩擦
              value: High
            - label: 防钓鱼 MFA 迁移
              value: Critical
            - label: 全局 MFA 绕过连锁反应
              value: Catastrophic
        - label: 较可能发生
          values:
            - label: 遥测数据延迟
              value: Low
            - label: 次要 API 版本漂移
              value: Low
            - label: 公开目录指标推测
              value: Medium
            - label: 区域市场渠道冲突
              value: High
            - label: 身份基础设施单点延迟
              value: Critical
            - label: 大范围目录身份验证锁定
              value: Catastrophic
        - label: 可能发生
          values:
            - label: 测试环境同步异常
              value: Low
            - label: 非关键日志溢出
              value: Low
            - label: 服务账户误报激增
              value: Medium
            - label: 原生 IdP 功能侵蚀挤压
              value: High
            - label: 企业重大 SLA 违约赔偿
              value: Critical
            - label: 核心加密密钥泄露
              value: Catastrophic
        - label: 不大可能发生
          values:
            - label: 局部测试网络中断
              value: Low
            - label: 高管领导团队更迭
              value: Low
            - label: 文档内容陈旧
              value: Medium
            - label: 军民两用技术出口限制
              value: Medium
            - label: 供应链代码注入入侵
              value: Critical
            - label: 企业信任不可逆崩塌
              value: Catastrophic
        - label: 罕见发生
          values:
            - label: 短暂 DNS 解析故障
              value: Low
            - label: 备用注册表不可用
              value: Low
            - label: 云服务商瞬态网络分区
              value: Medium
            - label: 跨境监管冻结
              value: High
            - label: 灾难性身份验证系统崩溃
              value: Critical
            - label: 平台彻底消亡事件
              value: Catastrophic
    approximationNotes: 基于企业身份安全架构、渠道结构与威胁研究披露信息进行定性评估。
    claimRefs:
      - CR001
      - CR005
      - CR006
      - CR009
      - CR010
      - CR012
  - id: FV001
    title: 投资建议与尽调决策流程
    type: flow
    summary: 决策树模型，展示从技术能力评估到最终“持续跟踪”建议的分析推演步骤。
    data:
      nodes:
        - id: scale-assessment
          label: 1,000+ 家企业客户与渠道规模
        - id: architecture-validation
          label: 无代理运行时访问防护已验证
        - id: disclosure-check
          label: 评估经审计的财务与 ARR 披露情况
        - id: disclosure-gap-identified
          label: 重大缺口：未经审计的一级市场收入指标
        - id: valuation-discipline
          label: 对标市场倍数评估 Series D 轮估值
        - id: final-recommendation
          label: 投资建议：持续跟踪，等待进一步尽调
      edges:
        - from: scale-assessment
          to: architecture-validation
        - from: architecture-validation
          to: disclosure-check
        - from: disclosure-check
          to: disclosure-gap-identified
        - from: disclosure-gap-identified
          to: valuation-discipline
        - from: valuation-discipline
          to: final-recommendation
    approximationNotes: 呈现投资评估标准的递进逻辑流程。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV006
      - CV008
      - CV010
