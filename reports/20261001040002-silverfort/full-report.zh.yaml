  - id: FI001
    title: 商业化收入模型路径
    type: flow
    summary: 呈现从客户混合身份基础设施到经常性订阅收入与渠道拓展的商业变现机制。
    data:
      nodes:
        - id: enterprise-infrastructure
          label: 企业客户混合 IT 与 Active Directory
        - id: partner-distribution
          label: 100% 渠道分销与网络保险合作伙伴
        - id: runtime-deployment
          label: 无代理运行时访问防护部署
        - id: subscription-contract
          label: 年度经常性软件许可（按询价定制）
        - id: platform-expansion
          label: 模块化拓展（NHI、云、特权访问）
