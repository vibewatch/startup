      - number: '3.3'
        title: 护城河持久度、渠道实力与被替代风险
        blocks:
          - type: paragraph
            body: >-
              Silverfort 的竞争防御壁垒依托于其获得专利的 Runtime Access Protection 架构、广泛的非人类身份覆盖以及迅速的部署上线速度。公司的进入市场动作由全球合作伙伴计划驱动，超过 90%
              的收入流经渠道合作伙伴与系统集成商，在企业客户群中构建起显著的分销杠杆。然而，结构性转换成本正受到竞争风险的对冲：Microsoft 等核心平台厂商不断强化原生身份威胁检测能力，且单点解决方案蔓延促使 CISO
              面临整合安全技术栈的压力。此外，客户采购反馈指出了潜在的升级摩擦与专门的日志记录开销。Silverfort
              护城河的长期持久度，取决于能否在主流目录提供商补齐本地运行时执行短板之前，保持在跨孤岛无代理身份防护领域的持续技术领先。
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
