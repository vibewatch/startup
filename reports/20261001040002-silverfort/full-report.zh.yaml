  - number: 7
    title: 风险评估
    sections:
      - number: '7.1'
        title: 监管指令、合规驱动因素与网络安全保险脆弱性
        blocks:
          - type: paragraph
            body: >-
              Silverfort
              的价值主张与外部监管法规及日益收紧的网络安全保险标准紧密交织，这些标准迫使企业在混合、传统遗留及命令行环境中实施多因素身份验证。网络保险承保商越来越将针对管理员账户、远程访问、云应用及自动化服务账户的全面 MFA
              作为承保前提，并指出凭据失窃是导致企业数据泄露与勒索软件索赔的核心原因。虽然 Silverfort 定位其无代理架构以满足这些严苛的网络承保标准以及包括 PCI-DSS、NY-DFS
              和零信任指令在内的合规框架，但其商业销售管道仍易受到保险公司验证机制转变以及 FIDO2 等绕过代理控制的防钓鱼硬件凭据新兴要求的影响。此外，作为一家为跨国客户处理敏感认证判定的企业安全厂商，Silverfort
              面临着来自相互冲突的国际数据保护制度以及军民两用出口管制标准的持续合规成本，这可能会限制其在公共部门和主权云市场的销售。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
