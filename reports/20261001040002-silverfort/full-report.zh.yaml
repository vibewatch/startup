      - number: '2.4'
        title: 分析展项
        blocks:
          - type: callout
            title: 架构驱动的商业边界
            body: >-
              身份安全领域的核心商业博弈存在于平台套件整合与专用无代理执行之间。虽然 Microsoft 和 CrowdStrike
              依托邻近的端点与生产力许可变现，但独立厂商必须守住既有代理软件触及不到的传统遗留协议与非人类身份，才能证明增量软件支出值得。
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM008
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 企业身份安全格局与分类体系
        blocks:
          - type: paragraph
            body: >-
              身份安全领域涵盖核心云身份提供商、特权访问管理既有厂商、专用身份威胁检测与响应工具，以及传统遗留目录架构。Okta 和 Microsoft Entra ID 等核心云 IdP 保障现代 SaaS 和
              SAML/OIDC 联合协议的安全，但在传统本地 Active Directory 域、命令行界面以及非人类服务账户上留下了大量的可见性与策略执行盲区。Silverfort 通过将 Runtime Access
              Protection 架构原生集成到目录身份验证流中，在无需软件代理或内联代理重定向的情况下强制实施自适应访问与多因素身份验证，从而形成差异化优势。Silverfort 并不寻求取代既有的目录套件，而是作为企业
              IdP 背后的解耦安全层运行，同时与 Delinea 等 PAM 专精厂商及原生目录扩展展开竞争。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
