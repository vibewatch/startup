        blocks:
          - type: paragraph
            body: >-
              Silverfort 面向传统遗留企业基础设施与分布式云应用及 SaaS 平台交汇的混合企业环境 [CU001, CU006]。公司将其客户划分为四个运营层级：战略全球客户（Strategic Global
              Accounts）、企业核心客户（Enterprise Core Accounts）、中端商业组织（Mid-Market Commercial
              Organizations）以及数字触达或技术触达客户（Digital Touch or Tech-Touch）[CU002, CU011]。商业采购围绕 IT
              和安全运营团队、身份与访问管理架构师以及受合规要求和网络安全保险承保条件驱动的首席信息安全官展开 [CU001, CU007]。Silverfort
              并非部署客户端软件代理或修改关键业务传统遗留域控制器，而是通过无代理运行时架构运行，监控跨 Active Directory、Kerberos、LDAP、NTLM、SSH、RDP 以及云身份提供商的认证协议
              [CU005, CU006]。跨这些运营层级的交付通过间接渠道优先模式执行，由专业增值分销商和区域安全解决方案提供商负责软件分销、合作伙伴赋能、客户上线以及一级运维支持 [CU007, CU008]。
