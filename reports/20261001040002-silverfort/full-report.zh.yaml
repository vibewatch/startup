  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范畴与支出分类
        blocks:
          - type: paragraph
            body: >-
              身份安全领域正经历结构性品类解耦，身份基础设施管理正与身份防护及运行时威胁响应相互分离 [CM001, CM006]。Silverfort 可触达的企业支出集中在跨混合 Active Directory
              及多云环境的身份威胁检测与响应（ITDR）、非人类身份（NHI）保护以及传统遗留协议 MFA 强制执行 [CM001, CM002,
              CM007]。纳入的支出范畴包含运行时访问保护许可证、服务账户可见性工具，以及面向命令行与运营技术（OT）协议的无代理 MFA 扩展 [CM002,
              CM008]。相反，排除的支出范畴包括核心身份提供商（IdP）目录服务（如 Okta 员工席位或 Entra ID 租户许可）、通用端点检测与响应（EDR）代理软件，以及通用数据防泄漏平台 [CM001,
              CM003]。安全团队正日益将身份验证防御视作独立的控制平面，而非目录服务中无人监管的附带功能 [CM006, CM009]。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
      - number: '2.2'
        title: 目标市场规模、定价离散度与经济模型
        blocks:
          - type: paragraph
            body: >-
              评估 ITDR 市场需要分析三种截然不同的进入市场架构与定价基准，而非依赖单一自上而下的潜在市场总额（TAM）估算 [CM003, CM004, CM014]。在企业部署中，定价模式差异巨大，从原生套件捆绑包如
              Microsoft Defender for Identity（独立购买为每月每用户 $5.50，或包含在 M365 E5 中），到 EDR 附加模块如 CrowdStrike Falcon Identity
              Threat Protection（公开标价约为每年每身份 $124.99），再到像 Silverfort 这样基于定制报价的独立平台 [CM003, CM004, CM005]。针对代表性的 5,000
              席位企业部署，公开基准模型显示，折让前独立版 Defender for Identity 的年度软件支出基准约为 $330,000，CrowdStrike Falcon Identity Threat
              Protection 则为 $624,950，而 Silverfort 的交易规模依然通过多层级方案私下协商确定 [CM004, CM005]。宏观 ITDR
              搜索量与品类关注度反映出稳步上升的企业评估需求，凭据失窃已成为绝大多数勒索软件入侵的核心诱因 [CM001, CM009, CM010]。
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM009
              - CM010
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM008
              - CM010
      - number: '2.3'
        title: 买方细分、预算分配与采纳阻力
        blocks:
          - type: paragraph
            body: >-
              企业采纳运行时身份保护受制于特定的采购决策中心、运营约束及商业采购路径 [CM011, CM012, CM013]。企业 CISO
              与身份及访问管理（IAM）负责人充当核心预算掌管者与高管发起人，安全运营中心（SOC）工程团队则负责告警分流与事件响应 [CM001, CM008,
              CM011]。大型企业推行案例凸显出管理多元人员构成的运营复杂度，企业身份团队必须在庞大分布式与加盟员工群体中权衡风险削减与业务赋能 [CM011,
              CM012]。分销端，全球渠道合作伙伴网络以及要求在传统遗留资产和服务账户上强制实施 MFA 的网络安全保险承保规定，极大推动了商业拓展 [CM007,
              CM013]。然而，长期市场渗透仍面临来自企业套件捆绑、复杂的定制策略设计以及传统遗留客户端身份验证依赖所带来的采纳阻力 [CM003, CM014, CM015]。
            claimRefs:
