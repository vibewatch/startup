      - number: '3.4'
        title: 分析展项
        blocks:
          - type: callout
            title: 将身份基础设施与身份安全解耦
            body: >-
              Silverfort 的战略布局立足于将身份基础设施与身份安全彻底解耦。Silverfort 并非试图取代 Active Directory 或 Okta
              等根深蒂固的企业目录，而是作为智能运行时决策层在目录后台运行，化解了企业采纳的首要障碍。
            calloutType: insight
            claimRefs:
              - CP002
              - CP003
          - type: callout
            title: 定价透明度与既有巨头整合
            body: >-
              客户反馈与 RFP 基准指出，Silverfort 依赖定制报价且常被认为定价偏高。随着 Microsoft 等平台厂商扩大原生安全产品阵容，除非 Silverfort
              能够在非人类和传统遗留身份领域持续证明差异化的投资回报率（ROI），否则将面临预算受挤压的风险。
            calloutType: risk
            claimRefs:
              - CP008
              - CP013
  - number: 4
    title: 财务状况
    sections:
      - number: '4.1'
        title: 收入模式、定价机制与商业架构
        blocks:
          - type: paragraph
            body: >-
              Silverfort 通过企业软件订阅将其 Runtime Access Protection 平台商业化，销售覆盖混合 Active
              Directory、云端及非人类身份环境的多因素身份验证、身份威胁检测与响应以及特权访问安全。企业定价采取定制报价方式，根据组织规模量身定制，计费维度挂钩受保护的用户规模、域控制器数量和非人类身份数量，而非公开透明的按席位自选层级。在与
              Transmit Security 等竞品的第三方访问管理采购对比中，评审者指出 Silverfort
              的定价偏高或需定制报价，并指出深度传统遗留环境实施需要周密的上线规划。合同结构为附带企业级支持和服务等级协议（SLA）的多年期年度经常性订阅。收入确认遵循标准 SaaS
              订阅原则，但实际的软件与服务合同构成比例、专业服务费用以及企业折扣结构完全未对外公开。
