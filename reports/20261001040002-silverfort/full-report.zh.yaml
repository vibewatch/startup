      - number: '3.2'
        title: 能力分析与评估矩阵
        blocks:
          - type: paragraph
            body: >-
              企业访问管理采购优先考量身份验证确定性、目录集成深度、生命周期自动化，以及真实安全事件条件下的运营韧性。在正面对比评估中，Silverfort
              凭借深度的企业目录集成与传统遗留协议覆盖斩获高分，保障了传统访问管理工具无法解决的 Kerberos、NTLM 及机器服务账户安全。然而，独立采购基准表明，Silverfort
              采用定制报价模式，在大规模全面部署时常被认为价格偏高，且深度传统遗留部署需要复杂的配置工作。Delinea 等既有厂商在 PAM 传统的凭据保管库和会话管理领域占据主导地位，而原生 IdP
              套件则主要聚焦于云原生工作流和 SaaS 联合认证。下方的矩阵对比了代表性替代架构的关键技术能力与运营权衡。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
