      - number: '5.2'
        title: 产品套件、模块范畴与难以防护资产覆盖
        blocks:
          - type: paragraph
            body: >-
              Silverfort 平台涵盖多个核心功能模块，应对不同的企业身份攻击面。通用多因素身份验证（Universal Multi-Factor Authentication）将升级质询扩展至缺乏原生 MFA
              接口的系统，包括远程桌面协议（RDP）、PsExec 和 Remote PowerShell 等命令行工具、传统遗留应用、CIFS
              文件共享以及物理隔离的工业基础设施。身份威胁检测与响应（ITDR）监控涵盖人类、非人类及机器身份的认证遥测数据，识别凭据滥用、横向移动与提权企图。非人类身份（NHI）与服务账户保护通过观察实时认证动态发现机器身份，无需在传统遗留服务中轮换凭据即可建立基线行为画像。特权访问安全（PAS）与身份优先事件响应提供针对性遏制机制，使安全团队能够在发生入侵时隔离失陷账户并阻断横向移动。这些能力通过
              2024 年 11 月收购云身份安全态势管理厂商 Rezonate，以及 2026 年 4 月收购 AI 智能体安全厂商 Fabrix Security 得到了进一步扩展。
            claimRefs:
              - CE002
              - CE004
              - CE007
              - CE009
              - CE010
              - CE013
