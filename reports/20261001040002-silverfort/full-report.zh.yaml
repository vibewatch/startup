              - CV016
      - number: '8.4'
        title: 退出预期、流动性时点与尽调诉求
        blocks:
          - type: paragraph
            body: >-
              Silverfort 的退出路径涵盖首次公开募股（IPO）或由全球网络安全及云平台整合巨头进行的战略收购。然而，机构层面的流动性准备要求立即厘清特定的结构性尽调事项。包括首席财务官 Irena
              Meaden、首席客户官 Michelle Wideman、首席营销官 Tarah Cammett 以及全球渠道副总裁 Leslie Bois
              在内的核心高管任命，为规模扩张提供了必要的组织架构基础。最终尽调否决项（kill criteria）与             
              投资评估重点需要核验经审计的客户留存队列明细表、前二十大企业客户的集中度、软件与部署服务的毛利率构成，以及被收购 Fabrix 研发团队在收购后的留存状况。
            claimRefs:
              - CV005
              - CV010
              - CV014
              - CV015
      - number: '8.5'
        title: 分析展项
        blocks:
          - type: callout
            title: 资金配置的尽调前提条件
            body: 应密切跟踪 Silverfort，但在潜在投资者拿到提交董事会的经审计收入报表、基于队列的净增营收留存率明细以及可核验的毛利率核算之前，应暂缓资本配置。
            calloutType: recommendation
            claimRefs:
