      - - 基准情景
        - 混合 Active Directory 防护稳健普及；渠道收入维持 30-40% 年增长率
        - 企业估值 $1.2B-$1.5B，大致持平于 Series D 轮里程碑估值
        - 企业销售周期拉长，且自主 Agent 安全落地滞后
        - 50%（反映当前发展轨迹）
      - - 悲观情景
        - 新客获取增速放缓；面临整合摩擦且缺乏经审计利润率能见度
        - 企业估值回落至 $600M-$800M（面临下调估值轮次风险）
        - 后期网络安全软件估值倍数普遍回落且客户预算收紧
        - 25%（下行风险敞口高）
    notes: 基于历史 Series D 轮资本化基数，并模拟多种市场环境下的估值走向。
    claimRefs:
      - CV006
      - CV007
      - CV011
      - CV014
      - CV015
      - CV016
