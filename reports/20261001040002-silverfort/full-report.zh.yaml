              - CR003
              - CR004
      - number: '7.2'
        title: 运营失效模式、内联架构敏感性与研究审查
        blocks:
          - type: paragraph
            body: >-
              作为内联身份核验层运行会带来严重的技术与运营失效风险，软件缺陷或路由延迟可能会误拦截合法的企业员工访问。Silverfort 的 Runtime Access Protection
              在不部署本地终端代理的情况下拦截跨 Active Directory、云身份提供商和运营技术的认证流量，在身份基础设施边界造成单点故障隐患。公司活跃的公开威胁研究项目（例如披露 ClawHub
              等智能体技能库中严重 RPC 漏洞的报告）展示了成熟的攻击性漏洞发现能力，但同时也凸显出第三方集成与开发者生态固有的系统性供应链风险暴露。一旦 Silverfort
              自身的代理基础设施或云平台遭受凭据滥用、误报拦截或供应链篡改，客户的生产工作负载和企业目录运行将遭受直接冲击。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
