              Silverfort 的核心技术护城河在于将访问控制执行从单个终端资源转移到中央目录层。通过在无内联代理或终端软件的情况下原生拦截 Active Directory 认证流量，Silverfort
              将现代多因素身份验证与威胁防护扩展至历史上缺乏原生升级认证能力的 Kerberos 和 NTLM 等协议。
