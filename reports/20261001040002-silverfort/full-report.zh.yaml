      - number: '8.3'
        title: 情景分析、并购资本分配与稀释压力
        blocks:
          - type: paragraph
            body: >-
              资本结构与情景建模必须考量从种子轮（Series Seed）至 Series D 累计 $211M 至 $222M 的股权融资，并辅以积极的并购资本配置。2026 年 4 月 28 日，Silverfort
              宣布收购 Fabrix Security，后者是一家成立于 2025 年、此前获得 $8M 种子轮融资的 AI 原生身份初创企业，预估交易对价为
              $30M。该交易代表着其向自主智能体身份运行时访问控制领域的激进战略扩张。我们的情景分析框架评估了由成功的运行时 AI 变现与市场估值倍数扩张驱动的乐观情景（bull
              case）、反映混合本地环境中稳健企业扩张的基准情景（base case），以及由估值倍数压缩、AI 整合延期或渠道增速放缓触发的悲观情景（bear case）。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
