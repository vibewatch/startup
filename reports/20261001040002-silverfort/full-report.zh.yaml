  - id: FM001
    title: 企业身份安全市场规模测算与部署架构分层
    type: pyramid
    summary: 概念性市场金字塔图谱，展示从通用目录基础设施延伸至专用传统协议运行时防护的可触达身份安全支出层级。
    data:
      items:
        - label: 核心 IAM 基础设施
          value: 100
          unit: relative scope
          note: 基础用户目录与标准云端 Web SSO
        - label: 身份治理与管理（IGA）
          value: 80
          unit: relative scope
          note: 生命周期管理、权限审计与账号配置
        - label: 特权访问管理（PAM）
          value: 65
          unit: relative scope
          note: 密码库保险箱、会话录制与管理员特权委托
        - label: ITDR 可见性与分析
          value: 50
          unit: relative scope
          note: 域控制器日志与遥测分析（MDI、Falcon Identity）
        - label: 非人类身份与机器凭证管理
          value: 35
          unit: relative scope
          note: 服务账户映射、令牌治理与 API 发现
        - label: 运行时访问防护与传统 MFA
          value: 20
          unit: relative scope
          note: 面向传统系统与 OT 资产的深度内联协议调解
    approximationNotes: 基于架构能力需求而非单一厂商的金额预测，直观展现身份安全技术栈六大层级的相对市场体量与专业化纵深。
    claimRefs:
      - CM001
      - CM002
      - CM006
      - CM008
      - CM010
