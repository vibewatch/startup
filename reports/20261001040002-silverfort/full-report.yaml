  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Spend Classification
        blocks:
          - type: paragraph
            body: >-
              The identity security landscape is undergoing structural category decoupling where identity infrastructure
              management separates from identity protection and runtime threat response [CM001, CM006]. The enterprise
              spend addressable by Silverfort is centered on Identity Threat Detection and Response (ITDR), non-human
              identity (NHI) protection, and legacy protocol MFA enforcement across hybrid Active Directory and
              multi-cloud environments [CM001, CM002, CM007]. Included spend encompasses runtime access protection
              licenses, service account visibility tooling, and agentless MFA extensions for command-line and
              operational technology (OT) protocols [CM002, CM008]. Conversely, excluded spend comprises core identity
              provider (IdP) directory directories like Okta workforce seats or Entra ID tenant licensing, broad
              endpoint detection and response (EDR) agent software, and general data loss prevention platforms [CM001,
              CM003]. Security organizations increasingly treat authentication defense as an independent control plane
              rather than an unmonitored feature of directory directories [CM006, CM009].
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
