      - number: '3.3'
        title: Moat Durability, Channel Power & Displacement Risks
        blocks:
          - type: paragraph
            body: >-
              Silverfort's competitive defensibility relies on its patented Runtime Access Protection architecture,
              broad non-human identity coverage, and rapid deployment velocity. The company's go-to-market motion is
