      - number: '5.2'
        title: Product Suite, Module Scope, and Unprotectable Asset Coverage
        blocks:
          - type: paragraph
            body: >-
              The Silverfort platform encompasses several core functional modules that address distinct enterprise
              identity attack surfaces. Universal Multi-Factor Authentication extends step-up challenges across systems
              lacking native MFA hooks, including Remote Desktop Protocol (RDP), command-line tools like PsExec and
              Remote PowerShell, legacy applications, CIFS file shares, and air-gapped industrial infrastructure.
              Identity Threat Detection and Response (ITDR) monitors authentication telemetry across human, non-human,
              and machine identities, identifying credential misuse, lateral movement, and privilege escalation
              attempts. Non-Human Identity (NHI) and Service Account Protection discovers machine identities dynamically
              by observing live authentications, establishing baseline behavioral profiles without requiring credential
              rotation in legacy services. Privileged Access Security (PAS) and Identity-First Incident Response provide
              targeted containment mechanisms, enabling security teams to isolate compromised accounts and block lateral
              movement during active breaches. These capabilities expanded through the November 2024 acquisition of
              Rezonate for cloud identity posture management and the April 2026 acquisition of Fabrix Security for AI
              agent security.
            claimRefs:
              - CE002
              - CE004
              - CE007
              - CE009
              - CE010
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
