      - CE001
      - CE002
      - CE003
      - CE004
      - CE011
  - id: FU001
    title: Customer journey map
    type: journey-map
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU006
      - CU007
      - CU008
      - CU011
    data:
      nodes:
        - id: step-1
          label: Discovery & Compliance Assessment
          touchpoints:
            - Enterprise faces cyber insurance renewal or regulatory MFA mandate (NY-DFS, PCI-DSS)
            - Channel partner (Exclusive Networks, CompuNet) conducts identity posture assessment
        - id: step-2
          label: Agentless Deployment & Protocol Interception
          touchpoints:
            - Non-invasive protocol-level integration deployed parallel to Active Directory domain controllers
            - Automated mapping of Kerberos, LDAP, NTLM, and SSH authentication flows without agents
        - id: step-3
          label: Identity Inventory & Baseline Risk Profiling
          touchpoints:
            - Centralized discovery of human accounts, service accounts, and automated AI agents
            - Baseline behavioral risk profiling established across hybrid enterprise resources
        - id: step-4
          label: Policy Enforcement & Runtime Step-Up MFA
          touchpoints:
            - Enforcement of step-up MFA across command-line interfaces, legacy apps, and file shares
            - Automated blocking of anomalous lateral movement and credential theft in real time
        - id: step-5
          label: Customer Success Onboarding & Health Scoring
          touchpoints:
            - Customer Success onboarding reviews initial health scores and operational alert volumes
            - Establishment of quarterly business reviews and multi-segment escalation playbooks
        - id: step-6
          label: Expansion & Strategic Ecosystem Integration
          touchpoints:
            - Expansion into non-human identity governance and automated AI agent runtime protection
            - Integration with endpoint detection and response platforms (SentinelOne Singularity alliance)
