  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Runtime Access Protection and Directory-Layer Architecture
        blocks:
          - type: paragraph
            body: >-
              Silverfort's architectural foundation centers on Runtime Access Protection (RAP), an approach designed to
              bypass the operational and security trade-offs of legacy endpoint agents and network proxies. Rather than
              deploying software on every managed workstation or routing application traffic through inline network
              appliances, Silverfort integrates directly at the identity provider (IdP) layer. For on-premises Active
              Directory environments, domain controllers forward authentication requests to Silverfort for automated
              risk analysis before granting or denying access. Silverfort evaluates contextual risk indicators in real
              time; if elevated risk or sensitive access policies require step-up authentication, Silverfort dispatches
              a multi-factor authentication (MFA) challenge via its messaging service to the requesting user. Only upon
              successful challenge completion does Silverfort instruct Active Directory to issue authentication tickets
              or allow access, ensuring that unprotectable protocols like Kerberos and NTLM receive modern zero-trust
              policy enforcement without local endpoint modifications.
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
