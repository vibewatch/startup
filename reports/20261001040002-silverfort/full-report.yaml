      - number: '2.3'
        title: Buyer Segmentation, Budget Allocation, and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption of runtime identity protection is governed by specific enterprise buying centers, operational
              constraints, and commercial procurement pathways [CM011, CM012, CM013]. Enterprise CISOs and Identity and
              Access Management (IAM) leadership serve as the primary budget owners and executive sponsors, while
              Security Operations Center (SOC) engineering teams manage alert triage and incident response [CM001,
              CM008, CM011]. Major enterprise rollouts highlight the operational complexity of managing diverse
              populations, where corporate identity teams must balance risk reduction against business enablement across
              massive distributed and franchised workforces [CM011, CM012]. On the distribution side, commercial
              traction is heavily enabled by global channel partner networks and cyber insurance underwriting mandates
              that enforce MFA across legacy assets and service accounts [CM007, CM013]. However, long-term market
              penetration encounters adoption friction from enterprise suite bundling, complex custom policy design, and
              legacy client authentication dependencies [CM003, CM014, CM015].
