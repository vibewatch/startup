  - id: FE001
    title: Silverfort Runtime Access Protection Architecture Stack
    type: stack
    summary: >-
      Logical architecture layers illustrating how Silverfort intercepts, analyzes, and enforces identity security
      across hybrid enterprise assets.
    data:
      layers:
        - label: Access Interfaces & User Endpoints
          detail: RDP, PsExec, Remote PowerShell, Legacy ERPs, CIFS File Shares, and Industrial OT Devices
          modules:
            - Administrative CLI & Remote Tools
            - Legacy Client-Server Systems
        - label: Directory & Identity Repositories
          detail: Active Directory Domain Controllers, Azure AD / Microsoft Entra ID, Okta, RADIUS, and ADFS
          modules:
            - On-Premises Active Directory DCs
            - Cloud Identity Providers
        - label: Interception & Deciphering Layer
          detail: Patented packet inspection deciphering Active Directory authentication traffic without decryption
          modules:
            - Directory Traffic Deciphering Engine
            - Protocol Analysis (Kerberos/NTLM/LDAP)
        - label: Risk Analytics & Policy Decision Core
          detail: Continuous behavioral risk evaluation, identity graph profiling, and adaptive rule triggers
          modules:
            - Identity Risk & Behavioral Analytics
            - Real-Time Decision & Policy Engine
        - label: Enforcement & Verification Services
          detail: Step-up authentication messaging, push notifications, FIDO2 tokens, and active session blocking
          modules:
            - MFA Push Messaging & FIDO2 Service
            - Authentication Policy Firewall
        - label: Ecosystem Integration & Cloud Governance
          detail: Cross-platform signal exchange, SIEM/SOAR connectors, and Microsoft Entra ID bridging
          modules:
            - Microsoft Entra ID Bridge Connector
            - Silverfort Integration Hub
            - Shared Signals Framework (SSF) Engine
    approximationNotes: >-
      Logical architectural breakdown derived from official service definition white papers and technical review
      documents.
