      - number: '2.2'
        title: Addressable Market Sizing, Pricing Dispersion, and Economics
        blocks:
          - type: paragraph
            body: >-
              Evaluating the ITDR market requires analyzing three distinct go-to-market architectures and pricing
              benchmarks rather than relying on a single top-down total addressable market figure [CM003, CM004, CM014].
              In enterprise deployments, pricing models vary widely from native suite bundles such as Microsoft Defender
              for Identity ($5.50 per user per month standalone or included in M365 E5) to EDR-add-on modules such as
              CrowdStrike Falcon Identity Threat Protection (~$124.99 per identity per year list price) and standalone
              custom-quoted platforms like Silverfort [CM003, CM004, CM005]. For a representative 5,000-seat enterprise
              deployment, published benchmark models demonstrate an annual software expenditure baseline of
              approximately $330,000 for standalone Defender for Identity and $624,950 for CrowdStrike Falcon Identity
              Threat Protection before discounting, while Silverfort deal sizes remain privately negotiated through
              multi-tiered plans [CM004, CM005]. Macro ITDR search volume and category engagement reflect steady
              enterprise evaluation growth as credential compromise accounts for the vast majority of ransomware
              intrusions [CM001, CM009, CM010].
