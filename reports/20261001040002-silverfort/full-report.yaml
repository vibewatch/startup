  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Enterprise Identity Security Landscape & Taxonomy
        blocks:
          - type: paragraph
            body: >-
              The identity security landscape spans core cloud identity providers, privileged access management
              incumbents, specialized identity threat detection and response tools, and legacy directory architectures.
              Core cloud IdPs like Okta and Microsoft Entra ID secure modern SaaS and SAML/OIDC federated protocols but
              leave substantial visibility and policy enforcement blind spots across legacy on-premises Active Directory
              domains, command-line interfaces, and non-human service accounts. Silverfort differentiates its Runtime
              Access Protection architecture by integrating natively into directory authentication flows to enforce
              adaptive access and multi-factor authentication without software agents or inline proxy re-routing. Rather
              than seeking to displace incumbent directory suites, Silverfort operates as a decoupled security layer
              behind enterprise IdPs, while simultaneously competing against PAM specialists such as Delinea and native
              directory extensions.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
