callouts:
  - calloutType: "insight"
    title: "Decoupling Identity Infrastructure from Identity Security"
    body: "Silverfort's strategic posture hinges on decoupling identity infrastructure from identity security. Rather than attempting to displace deeply entrenched enterprise directories like Active Directory or Okta, Silverfort operates behind them as an intelligent runtime decision layer, neutralizing the primary barrier to enterprise adoption."
    claimRefs:
      - "CP002"
      - "CP003"
  - calloutType: "risk"
    title: "Pricing Transparency and Incumbent Consolidation"
    body: "Customer feedback and RFP benchmarks note that Silverfort relies on quote-based pricing that is frequently characterized as high. As platform vendors like Microsoft expand native security offerings, Silverfort faces the risk of budget compression unless it consistently proves differentiated ROI across non-human and legacy identities."
    claimRefs:
      - "CP008"
      - "CP013"
