chapter:
  number: 5
  title: "Product & Technology"
  summary: "Silverfort delivers runtime identity security across hybrid enterprise environments via its patented Runtime Access Protection architecture, intercepting authentication traffic at directory and identity provider layers without requiring endpoint agents or inline proxies. The platform extends multi-factor authentication, identity threat detection, and service account visibility to previously unprotectable assets such as legacy applications, command-line administration tools, and on-premises Active Directory infrastructure."
sections:
  - id: "architecture-and-operating-model"
    title: "Runtime Access Protection and Directory-Layer Architecture"
    body: "Silverfort's architectural foundation centers on Runtime Access Protection (RAP), an approach designed to bypass the operational and security trade-offs of legacy endpoint agents and network proxies. Rather than deploying software on every managed workstation or routing application traffic through inline network appliances, Silverfort integrates directly at the identity provider (IdP) layer. For on-premises Active Directory environments, domain controllers forward authentication requests to Silverfort for automated risk analysis before granting or denying access. Silverfort evaluates contextual risk indicators in real time; if elevated risk or sensitive access policies require step-up authentication, Silverfort dispatches a multi-factor authentication (MFA) challenge via its messaging service to the requesting user. Only upon successful challenge completion does Silverfort instruct Active Directory to issue authentication tickets or allow access, ensuring that unprotectable protocols like Kerberos and NTLM receive modern zero-trust policy enforcement without local endpoint modifications."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE004"
      - "CE005"
      - "CE008"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "product-modules-and-coverage"
    title: "Product Suite, Module Scope, and Unprotectable Asset Coverage"
    body: "The Silverfort platform encompasses several core functional modules that address distinct enterprise identity attack surfaces. Universal Multi-Factor Authentication extends step-up challenges across systems lacking native MFA hooks, including Remote Desktop Protocol (RDP), command-line tools like PsExec and Remote PowerShell, legacy applications, CIFS file shares, and air-gapped industrial infrastructure. Identity Threat Detection and Response (ITDR) monitors authentication telemetry across human, non-human, and machine identities, identifying credential misuse, lateral movement, and privilege escalation attempts. Non-Human Identity (NHI) and Service Account Protection discovers machine identities dynamically by observing live authentications, establishing baseline behavioral profiles without requiring credential rotation in legacy services. Privileged Access Security (PAS) and Identity-First Incident Response provide targeted containment mechanisms, enabling security teams to isolate compromised accounts and block lateral movement during active breaches. These capabilities expanded through the November 2024 acquisition of Rezonate for cloud identity posture management and the April 2026 acquisition of Fabrix Security for AI agent security."
    claimRefs:
      - "CE002"
      - "CE004"
      - "CE007"
      - "CE009"
      - "CE010"
      - "CE013"
    tableRefs:
      - "TE001"
  - id: "integration-trust-and-technical-risks"
    title: "Integration Ecosystem, Enterprise Deployments, and Diligence Caveats"
    body: "Enterprise integration relies on two primary mechanisms: deep directory bridging and the Silverfort Integration Hub cloud service. For hybrid environments, Silverfort bridges on-premises Active Directory assets into Microsoft Entra ID, surfacing legacy systems as enterprise applications subject to Conditional Access and single-sign-on policies without requiring application code rewrites. The Silverfort Integration Hub, introduced in version 5.1.2, connects deployments with external security ecosystems, supporting real-time alerts, SIEM integrations with Splunk and Microsoft Sentinel, and planned bidirectional Shared Signals Framework (SSF) exchanges with XDR and EDR platforms. Despite broad commercial adoption among major global enterprises, technical diligence reveals notable transparency gaps: Silverfort's public documentation does not fully disclose protocol-level packet inspection mechanics, and its trust center is login-gated with public compliance pages returning 404 errors, preventing independent audit of SOC 2 Type II and ISO 27001 attestations from primary public surfaces."
    claimRefs:
      - "CE003"
      - "CE004"
      - "CE006"
      - "CE011"
      - "CE012"
      - "CE014"
    tableRefs:
      - "TE002"
