company:
  name: "Silverfort"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Silverfort is a private identity-security company founded in 2016 whose current website positions its platform as a runtime enforcement layer spanning Active Directory, cloud identity providers, SaaS, legacy systems, and operational technology. The strongest public scale evidence is dated rather than current: a $116M January 2024 financing at around a $1B reported valuation, company claims of more than 1,000 customers and 450 employees by February 2025, and an April 2026 acquisition whose consideration was not disclosed in the assigned evidence."
sections:
  - id: "identity-and-business-model"
    title: "Identity, Footprint, and Business Model"
    body: >-
      A third-party company profile dates Silverfort's founding to 2016 and names Hed Kovetz,
      Yaron Kassner, and Matan Fattal as founders. Silverfort's own current website describes
      a runtime identity-security platform that integrates with Active Directory, cloud
      identity providers, SaaS, legacy systems, and operational technology, then allows,
      challenges, or blocks access requests. This establishes the product positioning, not
      independently verified efficacy. The same third-party profile is internally inconsistent
      on headquarters: it presents Tel Aviv as headquarters in one field but separately lists
      a Plano, Texas address and answers Plano in its FAQ. The chapter therefore treats Tel Aviv
      as the reported operating center and Plano as a reported U.S. location, rather than
      asserting a single verified legal headquarters. A May 2024 company release also describes
      a channel-first model with more than 90% of revenue flowing through partners.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO015"
    tableRefs:
      - "TO001"
  - id: "capital-and-scale"
    title: "Capitalization and Public Scale Signals"
    body: >-
      Public financing evidence supports a January 2024 Series D of $116M led by Brighton Park
      Capital. Silverfort said the round brought total funding to $222M, while the assigned
      third-party profile reports $223M; the $1M difference is preserved rather than averaged
      away. TechCrunch reported that its reliable sources put the valuation at around $1B, and
      the profile independently lists a $1B January 2024 valuation, but neither figure is a
      current October 2026 mark. Operating scale disclosures are also dated and largely
      company-issued: Silverfort said ARR grew more than 100% in 2023 while adding tens of
      millions in new ARR, and both Silverfort and TechCrunch described more than 100 new
      customers per quarter around the financing. A February 2025 company-issued release claimed
      more than 1,000 customers and more than 450 employees. No assigned source discloses current
      revenue, audited ARR, profitability, cash balance, burn, or runway.
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
    tableRefs:
      - "TO003"
  - id: "leadership-and-governance"
    title: "Leadership and Governance Coverage"
    body: >-
      The assigned evidence identifies co-founder Hed Kovetz as chief executive and co-founder
      Yaron Kassner as chief technology officer. The third-party profile additionally lists
      Howard Greenfield as president and chief revenue officer, Irena Meadan as chief financial
      officer, Tarah Cammett as chief marketing officer, and Michelle Wideman as chief customer
      officer. Those titles are current-page observations from a lower-reputation profile, not
      confirmations from an assigned official leadership page. The January 2024 financing added
      Brighton Park Capital co-founder Mike Gregoire to the board, according to both Silverfort
      and TechCrunch. Founder concentration is material because the founders remain the clearest
      public anchors for product strategy and external positioning, but the available sources do
      not establish the complete board, voting rights, committee composition, succession plan,
      or whether Matan Fattal retains an operating role. These are governance gaps rather than
      grounds for precise control conclusions.
    claimRefs:
      - "CO001"
      - "CO010"
    tableRefs:
      - "TO002"
  - id: "milestones-and-diligence-implications"
    title: "Milestones and Diligence Implications"
    body: >-
      Silverfort's public trajectory runs from a 2016 founding through four disclosed priced
      rounds, a May 2024 channel-program push, a February 2025 platform rebrand, and the April
      2026 acquisition of Fabrix Security. The Fabrix announcement says most joint capabilities
      would become available in the second half of 2026, so the acquisition is a strategic
      milestone rather than proof that the combined roadmap was delivered by the run date. It is
      also a company-issued release syndicated by PR Newswire, not independent transaction
      reporting, and it discloses neither purchase consideration nor financing terms. The
      assigned pool contains no regulator, court, or independently critical incident source.
      That absence cannot establish that Silverfort has had no legal, regulatory, outage, breach,
      leadership-change, or customer-concentration issue. The defensible overview is therefore
      a well-funded, founder-led identity-security vendor with dated growth signals, a partner-led
      distribution model, and material private-company information gaps.
    claimRefs:
      - "CO001"
      - "CO005"
      - "CO006"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
