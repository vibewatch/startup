  topStrengths:
    - >-
      Agentless Runtime Access Protection extends identity controls to legacy protocols and hybrid environments without
      endpoint software.
    - Public evidence shows more than 1,000 enterprise customers and sustained channel-led commercial momentum.
    - The company is well capitalized, with a disclosed $116M Series D and roughly $222M of total funding.
  topRisks:
    - Audited ARR, NRR, gross margin, and burn disclosure are not public, limiting underwriting confidence.
    - Heavy channel dependence reduces direct visibility into customer health and partner economics.
    - Incumbent platform vendors could narrow the legacy-identity gap and pressure pricing power.
  unresolvedGaps:
    - No publicly disclosed audited ARR or NRR; third-party estimates may differ materially from board reporting.
    - GAAP burn rate, cash balance, and capital efficiency remain undisclosed.
    - Top-customer concentration and contract longevity are not public.
    - Export-control and regulatory exposure for sensitive government or dual-use deployments is still unclear.
    - Microsoft Entra parity timeline for agentless on-prem MFA remains unverified.
