company:
  name: "Silverfort"
chapter:
  number: 4
  title: "Financials"
  summary: "Silverfort operates an enterprise cybersecurity subscription model with commercial momentum driven by a 100% channel-led go-to-market strategy, having scaled to over 1,000 customers and raising $222M–$223M in cumulative equity through its January 2024 Series D round. However, the company discloses no audited GAAP financial statements, gross margin schedule, net retention cohort, or cash burn run-rate, leaving underwriting dependent on private diligence."
sections:
  - id: "revenue-model-and-monetization"
    title: "Revenue Model, Pricing Mechanics, and Commercial Architecture"
    body: "Silverfort commercializes its Runtime Access Protection platform through enterprise software subscriptions, selling multi-factor authentication, identity threat detection and response, and privileged access security across hybrid Active Directory, cloud, and non-human identity environments. Enterprise pricing is quote-based and customized to organizational scope, reflecting protected user volumes, domain controllers, and non-human identities rather than transparent per-seat self-service tiers. In third-party access management procurement comparisons against competitors such as Transmit Security, reviewers identify Silverfort's pricing as high or quote-based, noting that deep legacy implementations require deliberate rollout planning. Contracts are structured as multi-year annual recurring subscriptions with enterprise support and service-level agreements. Revenue recognition follows standard SaaS subscription principles, but realized software-versus-services contract mix, professional services fees, and enterprise discounting structures remain strictly non-public."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "gtm-motion-and-channel-economics"
    title: "Go-to-Market Motion, Channel Economics, and Sales Efficiency"
    body: "Silverfort's commercial expansion is executed through a 100% channel-first distribution architecture directed by executive leadership, including Chief Financial Officer Irena Meaden and Vice President of Global Channels Leslie Bois. More than 90% of total company revenues flow directly through channel partners—reaching 100% in selected international operating regions—leveraging value-added resellers, systems integrators, and cyber insurance alliances. Company disclosures indicate rapid top-line momentum, with revenues expanding more than 100% year-over-year following the channel transition, alongside onboarding over 100 net-new enterprise customers per quarter. Partner program tiers provide tiered margin discounts, co-marketing allowances, and technical enablement via the Silverfort Academy portal. By offloading primary customer acquisition and frontline implementation to channel partners, Silverfort benefits from sales leverage, though partner commission spreads and unverified customer acquisition costs obscure underlying GAAP sales efficiency."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-and-burn-visibility"
    title: "Capital Adequacy, Financing Structure, and Underwriting Diligence Gaps"
    body: "Silverfort has raised a cumulative total of $222M to $223.34M in equity financing across five institutional rounds, culminating in a $116M Series D round in January 2024 led by Brighton Park Capital alongside Acrew Capital, Greenfield Partners, Citi Ventures, GM Ventures, Singtel Innov8, Maor Investments, and Vintage Investment Partners. Media and secondary market sources benchmark post-money valuation between $698.21M (Series D legal cap-table modeling reported by Forge Global at $1.57 per share across 74.3M shares outstanding) and $1.0B in TechCrunch and Tracxn financial reporting. While the $116M Series D provides multi-year balance sheet runway, Silverfort provides no public disclosure of GAAP net burn, cash reserves, gross margins, or net revenue retention cohorts. Evaluating long-term capital self-sufficiency is constrained by these private reporting gaps, making confirmation of unit economics and cash runway an essential diligence requirement."
    claimRefs:
      - "CI010"
      - "CI011"
      - "CI012"
      - "CI013"
      - "CI014"
