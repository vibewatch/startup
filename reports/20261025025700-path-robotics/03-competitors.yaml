      to validated prices.
    claimRefs: [CP004, CP005, CP006, CP007, CP008, CP013]
figures:
  - id: FP001
    title: Competitive positioning by adaptability and deployment breadth
    type: quadrant
    summary: >-
      Evidence-backed ordinal scoring places Path toward high variability handling and broad
      deployment, while simpler substitutes remain strongest where repeatability matters more.
    data:
      xAxis:
        label: "Adaptation to variable geometry (1 low, 5 high)"
        min: 1
        max: 5
      yAxis:
        label: "Deployment breadth across fixed and mobile work (1 low, 5 high)"
        min: 1
        max: 5
      points:
        - label: Path Robotics
          x: 5
          y: 5
          detail: "Fixed autonomous cells plus a mobile Rove concept; scores reflect claimed scope, not an independent benchmark."
        - label: Novarc plus Yaskawa
          x: 4
          y: 3
          detail: "Adaptive fit-up capability is explicit, while deployed joint-product breadth remains unproven."
        - label: Universal Robots cobot
          x: 3
          y: 3
          detail: "Reprogrammable and versatile, but assigned evidence does not show Path-like autonomous fit-up reasoning."
        - label: Traditional programmed cell
          x: 2
          y: 2
          detail: "Strong on repeatable work; variable geometry generally increases programming and fixture burden."
        - label: GrayMatter Robotics
          x: 3
          y: 4
          detail: "Broad adjacent fabrication processes, but not evidenced as a direct welding substitute."
        - label: Manual or internal build
          x: 4
          y: 2
          detail: "Human adaptability can be high, while scaling and repeatability depend on labor and internal engineering."
    approximationNotes: >-
      Scores are analyst-authored ordinal judgments from the cited capability evidence, not
      measured performance, market share, price, or benchmark thresholds.
    claimRefs: [CP002, CP003, CP007, CP008, CP010, CP012, CP014]
callouts:
  - calloutType: risk
    title: Incumbent convergence can compress the autonomy premium
    body: >-
      Novarc's Yaskawa integration shows a credible path for autonomy software to reach buyers
      through established robot platforms, while simpler cobots already anchor the low-cost end of
      the market.
    claimRefs: [CP007, CP008, CP011]
  - calloutType: recommendation
    title: Underwrite the workflow, contract, and benchmark together
    body: >-
      Request matched-part trials, realized pricing, uptime and rework data, support obligations,
      renewal history, and termination or data-portability terms before assigning value to Path's
      claimed technical moat.
    claimRefs: [CP005, CP006, CP013, CP014]
