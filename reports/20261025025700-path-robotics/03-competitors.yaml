      - ["Traditional programmed cell", null, "Capital purchase, lease, or integrator project can vary", "Robot, welding package, fixtures, safety system, and programming", "Anecdotal used-equipment figure is not a reliable normalized quote", "Can be economical for stable high-volume work despite higher programming burden"]
