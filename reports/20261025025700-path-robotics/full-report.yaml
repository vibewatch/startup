  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and adoption job
        blocks:
          - type: paragraph
            body: >-
              The relevant market is adaptive welding automation for large, variable, high-mix industrial work, not the
              entire welding economy. It includes fixed intelligent welding cells, associated perception, controls,
              positioners, software, support, and emerging mobile systems that bring automation to structures too large
              to move. It excludes commodity welding consumables, general-purpose industrial robots sold without
              adaptive welding capability, and Path's own unpriced future adjacencies such as inspection or contract
              fabrication. The status quo is manual welding, skilled-supervisor labor, integrator-built conventional
              cells, or deferring automation. Machine Design describes the target operating environment as large,
              complex, changing parts in transportation, energy, heavy equipment, and agriculture, while Sacra
              identifies plant leadership, welding engineering, quality, finance, IT, and sometimes government program
              offices as the buyer group. This boundary makes the economic test adoption-specific: a buyer must value
              reduced programming and rework enough to offset hardware, integration, qualification, and support costs.
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM006
      - number: '2.2'
        title: Multiple sizing lenses and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Two published lenses are directionally useful but not interchangeable. Business Research Insights
              estimates the global welding market at USD 347 billion in 2024, USD 369.2427 billion in 2025, and USD
              607.02 billion in 2033; Intel Market Research estimates the narrower global robotic welding system market
              at USD 7.50 billion in 2025, USD 8.06 billion in 2026, and USD 14.34 billion in 2034. The different
              scopes, publishers, and methodologies prevent arithmetic conversion from total welding spend to Path's
              SAM. Path's own 2025 review reports more than USD 100 million in bookings, while HII's 2026 agreement
              describes up to USD 900 million of combined seven-year work for Path and GrayMatter, contingent on
              readiness and performance milestones. Those company- and partner-specific figures are commercial signals,
              not recognized revenue or guaranteed backlog. Sacra separately notes that Path has not disclosed a
              reliable current valuation or underlying revenue and ARR, leaving valuation sensitivity to deployment
              conversion, margins, and milestone performance unresolved.
            claimRefs:
              - CM002
              - CM003
              - CM008
              - CM009
              - CM013
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM008
              - CM009
              - CM013
              - CM015
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM013
      - number: '2.3'
        title: Buyers, adoption path, and constraints
        blocks:
          - type: paragraph
            body: >-
              The primary buyer is an industrial operator with a costly welding bottleneck and enough throughput,
              quality pressure, or labor scarcity to justify automation. Plant and manufacturing leadership sponsor the
              capacity case; welding engineering and quality own procedure qualification and acceptance; finance
              evaluates capital versus operating expense; IT and operations support deployment; defense and shipbuilding
              may add program offices and Navy-grade qualification. Machine Design reports that Path's Robots-as-a-
              Service model can move spending from CapEx to OpEx and deploy in often 100 days or fewer, but the same
              article says conventional automation carries programming, maintenance, lens-replacement, downtime, and
              failure-risk burdens. Intel Market Research identifies high initial investment, integration complexity,
              scarce programming and maintenance expertise, supply-chain disruption, cybersecurity, and regional safety
              compliance as adoption barriers. AWS describes automation as shifting welding roles toward programming,
              quality assurance, and system supervision rather than eliminating skilled work. Rove expands the
              addressable workflow to shipbuilding and heavy construction, but its early adopter status means field
              reliability and production conversion remain diligence items.
            claimRefs:
              - CM007
              - CM010
              - CM011
              - CM012
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM010
              - CM011
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Market signal
            body: >-
              The strongest near-term signal is not the broad welding TAM; it is the convergence of labor scarcity,
              high-mix work, and buyer willingness to fund adaptive automation through operating budgets or
              milestone-based industrial programs.
            calloutType: insight
            claimRefs:
              - CM005
              - CM007
              - CM009
          - type: callout
            title: Sizing and conversion gap
            body: >-
              Public evidence does not establish Path's SAM, recognized revenue, gross margin, deployment count, or the
              portion of HII's conditional program that Path will actually capture.
            calloutType: risk
            claimRefs:
              - CM009
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The buyer can choose among six materially different solution paths
        blocks:
          - type: paragraph
            body: >-
              Path does not compete against one homogeneous peer set. Buyers can choose Path's fixed or mobile
              autonomous systems, an AI-software and incumbent-robot combination such as Novarc/Yaskawa, a
              reprogrammable cobot, a conventional programmed industrial cell, an adjacent specialist for non-welding
              processes, or continued manual and internally integrated production. HII's decision to work with both Path
              and GrayMatter is important evidence that large customers may multi-home by process rather than
              standardize on one robotics vendor. Third-party directories identify an even broader set of industrial
              automation companies, but their category labels do not establish functional parity. The investable
              question is therefore which workflow Path uniquely wins, not whether it appears on a generic competitor
              list.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
