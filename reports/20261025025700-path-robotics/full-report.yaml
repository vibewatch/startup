chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Path Robotics is identified in the assigned evidence as a Columbus, Ohio industrial robotics company whose
              core product is autonomous welding for manufacturing, critical infrastructure, defense, utility and
              energy, data centers, and heavy industry. Tracxn describes intelligent welding cells that adapt in real
              time to part variation, while the company's site describes Obsidian as a welding-specific physical-AI
              model trained on tens of millions of welded inches. The public record is inconsistent on founding year:
              Tracxn reports 2014, while the JobsOhio profile says founded in 2018. Ohio State's alumni profile says the
              founders launched from a Cleveland basement and moved to Columbus in 2019. This makes Columbus the
              best-supported operating location, but the founding-date discrepancy should remain explicit rather than
              being normalized away.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
      - number: '1.2'
        title: Founders, leadership, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              The strongest recurring leadership evidence identifies brothers Andy Lonsberry and Alex Lonsberry as
              co-founders, with Andy as CEO and Alex as CTO in Tracxn's profile. Ohio State's account adds founder
              background: the brothers grew up working in a family manufacturing operation before pursuing engineering
              and robotics. That combination supports founder-market fit, but it also indicates meaningful dependence on
              a small founder-led technical and commercial group. Path's resource index records the December 2025
              appointment of Rocket Lab COO Frank Klein and Yale SVP Geoffrey Chatas to the board. Those appointments
              add operating and financial-management experience, but a company-issued announcement does not establish
              board control rights, investor representation, independence, succession planning, or the complete current
              governance roster.
