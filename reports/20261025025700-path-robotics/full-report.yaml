      - number: '4.2'
        title: Pricing, traction, and revenue quality
        blocks:
          - type: paragraph
            body: >-
              Public pricing is too weak for a dependable revenue build. Path claims four times productivity, 30% lower
              cost, and zero customer capex, while Multiples publishes an historical projection using $200,000-$300,000
              per system and $2,000-$4,000 monthly software subscriptions. Those values are neither current list prices
              nor realized customer economics. Sacra reports management's claim that 2025 top-line revenue quadrupled
              and that 2025 bookings exceeded $100 million, but explicitly distinguishes bookings from recognized
              revenue and notes that the underlying annual revenue figures are undisclosed. It also reports net revenue
              retention above 200% without a cohort definition, starting base, churn, contract duration, or treatment of
              Foundry work. These signals are directionally positive but cannot be converted into ARR, gross profit, or
              cash flow without private records.
            claimRefs:
              - CI001
              - CI006
              - CI007
              - CI008
              - CI011
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI011
      - number: '4.3'
        title: Conditional defense pipeline
        blocks:
          - type: paragraph
            body: >-
              HII's August 2026 announcement is the strongest public commercial signal, but it is not backlog
              attributable to Path. HII said it intends to award up to $900 million of total shipbuilding work to Path
              and GrayMatter across seven years, contingent on technology readiness, manufacturing readiness, and
              performance milestones. The program begins with a Navy-grade development stage; sourcing in the delivery
              stage depends on favorable cost, schedule, and quality performance. Path's share, purchase orders, timing,
              customer advances, asset ownership, and margin are not disclosed. Treating the headline ceiling as Path
              revenue would therefore misstate both the denominator and the probability of conversion. The structure
              instead creates a potentially large but milestone-dependent demand channel that may require investment
              before production cash is earned.
            claimRefs:
              - CI009
              - CI010
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Public funding totals do not reconcile and cannot be used as cash available. Sacra reports management's
              approximately $370 million total and identifies a $20.4 million mezzanine investment in April 2026; Forge
              lists $312.77 million, Multiples lists $271 million, and Parsers VC lists $156 million. A separate Form D
              database entry shows $346,021 sold by Gaingels Path Robotics 2026 LLC, a pooled investment vehicle, rather
              than proving an equal operating-company cash receipt. Built In's explicitly LLM-generated summary also
              flags limited independent financial disclosure and reliance on bookings and announcements. RaaS, Foundry,
              and HYPR can shift hardware, installation, facility, labor, inventory, quality, and delivery costs onto
              Path before collections. Without cash, burn, debt, capex, utilization, and deployment-margin records, the
              financial verdict is promising growth with material financing dependency and an unresolved underwriting
              blocker.
            claimRefs:
