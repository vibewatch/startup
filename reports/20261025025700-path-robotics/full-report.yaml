  - id: FP001
    title: Competitive positioning by adaptability and deployment breadth
    type: quadrant
    summary: >-
      Evidence-backed ordinal scoring places Path toward high variability handling and broad deployment, while simpler
      substitutes remain strongest where repeatability matters more.
    data:
      xAxis:
        label: Adaptation to variable geometry (1 low, 5 high)
        min: 1
        max: 5
      yAxis:
        label: Deployment breadth across fixed and mobile work (1 low, 5 high)
        min: 1
        max: 5
      points:
        - label: Path Robotics
          x: 5
          'y': 5
          detail: >-
            Fixed autonomous cells plus a mobile Rove concept; scores reflect claimed scope, not an independent
            benchmark.
        - label: Novarc plus Yaskawa
          x: 4
          'y': 3
          detail: Adaptive fit-up capability is explicit, while deployed joint-product breadth remains unproven.
        - label: Universal Robots cobot
          x: 3
          'y': 3
          detail: Reprogrammable and versatile, but assigned evidence does not show Path-like autonomous fit-up reasoning.
        - label: Traditional programmed cell
          x: 2
          'y': 2
          detail: Strong on repeatable work; variable geometry generally increases programming and fixture burden.
        - label: GrayMatter Robotics
          x: 3
          'y': 4
          detail: Broad adjacent fabrication processes, but not evidenced as a direct welding substitute.
        - label: Manual or internal build
          x: 4
          'y': 2
          detail: Human adaptability can be high, while scaling and repeatability depend on labor and internal engineering.
    approximationNotes: >-
      Scores are analyst-authored ordinal judgments from the cited capability evidence, not measured performance, market
      share, price, or benchmark thresholds.
    claimRefs:
      - CP002
      - CP003
      - CP007
      - CP008
      - CP010
      - CP012
      - CP014
  - id: FI001
    title: Revenue-to-gross-profit evidence bridge
    type: flow
    summary: >-
      Path's model requires capital and operating work before contracted activity becomes recognized revenue and then
      gross profit; the public record does not quantify those conversions.
    data:
      nodes:
        - id: finance-hardware
          label: Finance hardware and deployment
          detail: Path bears manufacturing, installation, qualification, and commissioning work.
        - id: activate-system
          label: Activate customer system
          detail: A cell or mobile platform must enter customer operations.
        - id: deliver-service
          label: Deliver RaaS and support
          detail: Mission Control and application support continue after activation.
        - id: record-activity
          label: Generate bookings or production activity
          detail: Bookings and contract ceilings remain distinct from recognized revenue.
        - id: recognize-revenue
          label: Recognize revenue
          detail: Timing depends on acceptance, delivery, service periods, and milestone terms.
        - id: realize-gross-profit
          label: Realize gross profit and cash
          detail: Public evidence does not disclose margin, working capital, or collection timing.
    approximationNotes: Conceptual operating sequence only; no conversion rates, amounts, or timing are inferred.
    claimRefs:
      - CI002
      - CI005
      - CI016
