        title: Exhibits
        blocks:
          - type: callout
            title: The $900 million HII figure is not Path backlog
            body: >-
              HII's ceiling is shared with GrayMatter, spans seven years, and depends on readiness and performance
              milestones. Path's allocation, orders, timing, and economics remain undisclosed.
            calloutType: risk
            claimRefs:
              - CI009
              - CI010
          - type: callout
            title: Underwrite conversion, not headlines
            body: >-
              Require recognized revenue by stream, deployment contribution margin, cash and debt schedules, backlog
              conversion, retention cohorts, and HII cost-sharing before assigning value to reported growth or financing
              totals.
            calloutType: recommendation
            claimRefs:
