  - id: FU001
    title: Customer adoption journey
    type: journey-map
    summary: >-
      Public evidence moves from industrial pain point through evaluation or early partnership to implemented use, while
      repeatability and expansion remain open.
    data:
      items:
        - label: Problem fit
          description: High-mix parts, immovable assemblies, and skilled-welder shortages create demand for adaptable automation.
          touchpoints:
            - Variable weld paths
            - Large assemblies
            - Labor constraints
        - label: Evaluation
          description: Saronic is evaluating Rove for shipbuilding operations in Louisiana.
          touchpoints:
            - Rove
            - Shipbuilding
            - Early adopter
        - label: Development partnership
          description: Hutchens Industries was an early AF-1 partner during system development.
          touchpoints:
            - AF-1
            - Trailer manufacturing
            - Labor-gap relief
        - label: Production implementation
          description: TYCROP reported implementation with Path Robotics and ALM Positioners.
          touchpoints:
            - Complex assemblies
            - Throughput
            - On-schedule demand
        - label: Expansion hypothesis
          description: >-
            Management-reported NRR above 200% and doubled commitments suggest expansion, but definitions are
            undisclosed.
          touchpoints:
            - Retention
            - Commitment expansion
            - Unverified cohort basis
        - label: Durability proof needed
          description: Public sources do not provide cohort retention, utilization, renewal, or concentration data.
          touchpoints:
            - GRR/churn
            - Utilization
            - Customer concentration
    approximationNotes: The sequence is an analytical ordering of evidence maturity, not a measured conversion funnel.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU010
      - CU011
      - CU013
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      The densest residual exposure sits where high-impact qualification, field reliability, safety, and financing risks
      meet incomplete mitigation evidence.
    data:
      columns:
        - Low likelihood
        - Medium likelihood
        - High likelihood
      rows:
        - label: Critical impact
          values:
            - null
            - label: Worker-safety event
              tone: risk
              detail: Application-level controls and Path incident history require diligence.
            - label: Field reliability failure
              tone: risk
              detail: Rove remains an early product without independent field metrics.
        - label: High impact
          values:
            - null
            - label: Navy qualification delay
              tone: risk
              detail: Delivery depends on readiness and performance milestones.
            - label: Financing shortfall
              tone: risk
              detail: RaaS and managed production shift capital needs toward Path.
        - label: Material impact
          values:
            - label: OEM substitution
              tone: warning
              detail: Alternative platforms may exist, but switching costs are undisclosed.
            - label: Cyber-safety weakness
              tone: risk
              detail: Current standards add cybersecurity requirements.
            - label: Customer conversion
              tone: risk
              detail: Evaluation and contingent awards are not scaled revenue.
        - label: Moderate impact
          values:
            - label: Labor availability
              tone: warning
              detail: The welder shortage supports demand but complicates customer operations.
            - label: Support burden
              tone: warning
              detail: 24/7 support is offered without disclosed unit economics.
            - null
        - label: Low impact
          values:
            - label: Routine site friction
              tone: neutral
              detail: Site-specific integration work can delay commissioning without breaking the thesis.
            - null
            - null
        - label: Very low impact
          values:
            - null
            - null
            - label: No identified item
              tone: neutral
              detail: No retained evidence supports placing a named risk in this cell.
    approximationNotes: Likelihood and impact positions are qualitative analytical assessments, not incident-frequency estimates.
    claimRefs:
