artifact: financials
slug: path-robotics
runDate: 2026-10-25
company:
  name: Path Robotics
chapter:
  number: 4
  title: Financials
  summary: >-
    Path Robotics combines robotics-as-a-service, deployment and support revenue,
    contract fabrication, and milestone-gated production opportunities, but public
    evidence does not disclose recognized revenue, realized pricing, gross margin,
    cash burn, or runway. Strong company-reported growth and bookings therefore do
    not yet establish revenue quality or capital adequacy.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      Path's public model is broader than a conventional equipment sale. Sacra
      describes welding-cell deployments, recurring Robotics-as-a-Service fees, AI
      software and Mission Control support, and contract fabrication through Path
      Foundry; Forge separately identifies RaaS as the business model. Path markets
      the offer as "$0 capex" to customers, which may ease adoption but does not make
      the hardware free to Path. Foundry further changes the unit of sale from a
      robot or subscription into completed fabrication work. Rove adds a mobile
      form factor, but Robotics 24/7 describes Saronic as an early adopter evaluating
      the system rather than as evidence of scaled paid deployment. The evidence
      supports multiple monetization mechanisms, not a verified revenue mix,
      recognition schedule, or current average contract value.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-traction
    title: Pricing, traction, and revenue quality
    body: >-
      Public pricing is too weak for a dependable revenue build. Path claims four
      times productivity, 30% lower cost, and zero customer capex, while Multiples
      publishes an historical projection using $200,000-$300,000 per system and
      $2,000-$4,000 monthly software subscriptions. Those values are neither current
      list prices nor realized customer economics. Sacra reports management's claim
      that 2025 top-line revenue quadrupled and that 2025 bookings exceeded $100
      million, but explicitly distinguishes bookings from recognized revenue and
      notes that the underlying annual revenue figures are undisclosed. It also
      reports net revenue retention above 200% without a cohort definition, starting
      base, churn, contract duration, or treatment of Foundry work. These signals are
      directionally positive but cannot be converted into ARR, gross profit, or cash
      flow without private records.
    claimRefs: [CI001, CI006, CI007, CI008, CI011]
    tableRefs: [TI002]
  - id: conditional-pipeline
    title: Conditional defense pipeline
    body: >-
      HII's August 2026 announcement is the strongest public commercial signal, but
      it is not backlog attributable to Path. HII said it intends to award up to $900
      million of total shipbuilding work to Path and GrayMatter across seven years,
      contingent on technology readiness, manufacturing readiness, and performance
      milestones. The program begins with a Navy-grade development stage; sourcing
      in the delivery stage depends on favorable cost, schedule, and quality
      performance. Path's share, purchase orders, timing, customer advances, asset
      ownership, and margin are not disclosed. Treating the headline ceiling as
      Path revenue would therefore misstate both the denominator and the probability
      of conversion. The structure instead creates a potentially large but
      milestone-dependent demand channel that may require investment before
      production cash is earned.
    claimRefs: [CI009, CI010]
  - id: capital-adequacy
    title: Capital adequacy and financial verdict
    body: >-
      Public funding totals do not reconcile and cannot be used as cash available.
      Sacra reports management's approximately $370 million total and identifies a
      $20.4 million mezzanine investment in April 2026; Forge lists $312.77 million,
      Multiples lists $271 million, and Parsers VC lists $156 million. A separate
      Form D database entry shows $346,021 sold by Gaingels Path Robotics 2026 LLC,
      a pooled investment vehicle, rather than proving an equal operating-company
      cash receipt. Built In's explicitly LLM-generated summary also flags limited
      independent financial disclosure and reliance on bookings and announcements.
      RaaS, Foundry, and HYPR can shift hardware, installation, facility, labor,
      inventory, quality, and delivery costs onto Path before collections. Without
      cash, burn, debt, capex, utilization, and deployment-margin records, the
      financial verdict is promising growth with material financing dependency and
      an unresolved underwriting blocker.
    claimRefs: [CI012, CI013, CI014, CI015, CI016]
    tableRefs: [TI003]
