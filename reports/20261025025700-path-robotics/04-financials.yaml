      - [Path Foundry, "Perform contract fabrication using Path automation", "Per project or production order", "Publicly described; revenue mix and backlog are undisclosed", "Adds revenue scope and facility, labor, and working-capital exposure", "Backlog, cancellation rights, project margin, and cash-conversion cycle"]
      - [HYPR and HII production, "Qualify automation, then source shipbuilding work if milestones are met", "Development milestones and production output", "Up to $900M total for Path and GrayMatter over seven years", "Large conditional ceiling; Path share and conversion are unknown", "Path allocation, purchase orders, milestone payments, cost sharing, and margin"]
    notes: "Mechanisms are public, but unavailable values are not zero; the HII ceiling is shared, contingent opportunity rather than recognized revenue or guaranteed backlog."
    claimRefs: [CI002, CI003, CI004, CI009, CI010]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Metric or term, Value, Period or denominator, Evidence class, Underwriting implication]
    rows:
      - [Customer capex, "$0", "Company offer, current homepage", "Company claim", "Suggests Path may finance hardware economics; it is not a disclosed contract price"]
      - [Productivity, "4x", "Company offer; baseline and sample undisclosed", "Company claim", "Potential ROI support, but not evidence of realized revenue or margin"]
      - [Lower cost, "30%", "Company offer; cost definition undisclosed", "Company claim", "Potential pricing headroom requires customer-level validation"]
      - [System price, "$200K-$300K", "Per system in a third-party projection", "Unverified third-party estimate", "Do not treat as current list price or realized ASP"]
      - [Software subscription, "$2K-$4K monthly", "Per system in a third-party projection", "Unverified third-party estimate", "Do not treat as ARR without installed-base and contract data"]
    notes: "Path's homepage supplies benefit claims, while Multiples supplies projection assumptions; neither source discloses current realized pricing, discounts, contract duration, or revenue recognition."
    claimRefs: [CI001, CI011]
  - id: TI003
    title: Unit economics and capital-adequacy evidence
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [2025 top-line growth, "4x year over year", medium, "Signals growth but omits the revenue denominator", "Audited 2024-2026 monthly recognized revenue by stream"]
      - [2025 bookings, "More than $100M", medium, "Bookings require manufacture, installation, qualification, and commissioning before some revenue is recognized", "Bookings-to-revenue bridge, cancellations, acceptance terms, and aging"]
      - [Net revenue retention, ">200%", low, "Could show expansion, but cohort and Foundry treatment are undisclosed", "Cohort definition, starting base, churn, expansion, and non-recurring exclusions"]
      - [Gross margin, null, unknown, "Hardware, field support, and fabrication can materially reduce software-like margins", "Margin by cell, RaaS, software/support, Foundry, and HYPR"]
      - [CAC and payback, null, unknown, "A consultative industrial sale can consume cash before deployment", "Sales-cycle distribution, CAC, commissions, implementation cost, and payback"]
      - ["Cash, burn, and runway", null, unknown, "Funding raised is not cash available and does not establish solvency", "Monthly cash, operating burn, capex, inventory, debt service, and runway cases"]
    notes: "Null means the assigned public evidence does not disclose the metric; reported management metrics remain unaudited and are not substituted with estimates."
    claimRefs: [CI006, CI007, CI008, CI012, CI013, CI015]
figures:
  - id: FI001
    title: Revenue-to-gross-profit evidence bridge
    type: flow
    summary: >-
      Path's model requires capital and operating work before contracted activity
      becomes recognized revenue and then gross profit; the public record does not
      quantify those conversions.
    data:
      nodes:
        - id: finance-hardware
          label: Finance hardware and deployment
          detail: "Path bears manufacturing, installation, qualification, and commissioning work."
        - id: activate-system
          label: Activate customer system
          detail: "A cell or mobile platform must enter customer operations."
        - id: deliver-service
          label: Deliver RaaS and support
          detail: "Mission Control and application support continue after activation."
        - id: record-activity
          label: Generate bookings or production activity
          detail: "Bookings and contract ceilings remain distinct from recognized revenue."
        - id: recognize-revenue
          label: Recognize revenue
          detail: "Timing depends on acceptance, delivery, service periods, and milestone terms."
        - id: realize-gross-profit
          label: Realize gross profit and cash
          detail: "Public evidence does not disclose margin, working capital, or collection timing."
    approximationNotes: "Conceptual operating sequence only; no conversion rates, amounts, or timing are inferred."
    claimRefs: [CI002, CI005, CI016]
callouts:
  - calloutType: risk
    title: The $900 million HII figure is not Path backlog
    body: >-
      HII's ceiling is shared with GrayMatter, spans seven years, and depends on
      readiness and performance milestones. Path's allocation, orders, timing, and
      economics remain undisclosed.
    claimRefs: [CI009, CI010]
  - calloutType: recommendation
    title: Underwrite conversion, not headlines
    body: >-
      Require recognized revenue by stream, deployment contribution margin, cash and
      debt schedules, backlog conversion, retention cohorts, and HII cost-sharing
      before assigning value to reported growth or financing totals.
    claimRefs: [CI006, CI007, CI008, CI013, CI016]
