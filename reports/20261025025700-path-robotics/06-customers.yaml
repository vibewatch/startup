      - ["Customer commitment expansion", "At least doubled", "Recent period reported in 2026", "Management claim summarized by Sacra", "Potential land-and-expand signal", "Number of customers and contract basis"]
    notes: >-
      Values preserve the source's wording and qualifications. “Significantly improved”
      and management-reported retention are not independently quantified; null
      denominators prevent conversion into comparable growth rates.
    claimRefs: [CU006, CU007, CU010, CU011, CU012]
  - id: TU003
    title: Named customer proof table
    columns: [Customer, Segment, Deployment or use case, Production versus pilot, Outcome or status, Limitation]
    rows:
      - [Saronic Technologies, Shipbuilding, "Rove evaluation in Franklin, Louisiana", "Evaluation / early adopter", "Testing mobile welding for autonomous-vessel production", "Commercial conversion and paid scope are not disclosed"]
      - [TYCROP, "Energy, transportation, and clean-energy manufacturing", "Path plus ALM positioners for complex assemblies", "Implemented production solution", "Customer reported improved throughput and meeting demand", "No baseline, percentage, contract value, or renewal data"]
      - [Hutchens Industries, Trailer manufacturing, "AF-1 development partnership", "Early development partner", "Said AF-1 could help growth and labor gaps", "Early-partner statement does not establish current production scale"]
    enumerationScope:
      coverage: sample
      basis: "Named customer and early-adopter references publicly described in assigned 2023-2026 source materials"
    notes: >-
      This is a sample of named references, not an exhaustive customer list. Some
      corroboration is company, partner, or syndicated material; it does not establish
      independent verification of contract status or recurring revenue.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]

figures:
  - id: FU001
    title: Customer adoption journey
    type: journey-map
    summary: >-
      Public evidence moves from industrial pain point through evaluation or early
      partnership to implemented use, while repeatability and expansion remain open.
    data:
      items:
        - label: Problem fit
          description: "High-mix parts, immovable assemblies, and skilled-welder shortages create demand for adaptable automation."
          touchpoints: ["Variable weld paths", "Large assemblies", "Labor constraints"]
        - label: Evaluation
          description: "Saronic is evaluating Rove for shipbuilding operations in Louisiana."
          touchpoints: ["Rove", "Shipbuilding", "Early adopter"]
        - label: Development partnership
          description: "Hutchens Industries was an early AF-1 partner during system development."
          touchpoints: ["AF-1", "Trailer manufacturing", "Labor-gap relief"]
        - label: Production implementation
          description: "TYCROP reported implementation with Path Robotics and ALM Positioners."
          touchpoints: ["Complex assemblies", "Throughput", "On-schedule demand"]
        - label: Expansion hypothesis
          description: "Management-reported NRR above 200% and doubled commitments suggest expansion, but definitions are undisclosed."
          touchpoints: ["Retention", "Commitment expansion", "Unverified cohort basis"]
        - label: Durability proof needed
          description: "Public sources do not provide cohort retention, utilization, renewal, or concentration data."
          touchpoints: ["GRR/churn", "Utilization", "Customer concentration"]
    approximationNotes: "The sequence is an analytical ordering of evidence maturity, not a measured conversion funnel."
    claimRefs: [CU005, CU006, CU007, CU010, CU011, CU013]

callouts:
  - calloutType: insight
    title: Adoption is credible but not yet economically transparent
    body: >-
      Named implementations and evaluations establish customer engagement across fixed
      and mobile welding, but the public record does not establish recurring revenue
      durability, cohort retention, or concentration.
    claimRefs: [CU006, CU007, CU010, CU013]
  - calloutType: risk
    title: Rove remains an early-adopter proof point
    body: >-
      Rove's cited customer relationship is an evaluation and commercial availability
      was expected in early 2027; production conversion and field-support requirements
      remain unresolved.
    claimRefs: [CU006, CU009, CU014]

