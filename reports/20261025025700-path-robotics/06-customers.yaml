company:
  name: Path Robotics
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence shows Path Robotics has customer-facing deployments and evaluation
    relationships in high-mix welding, but the record distinguishes early-adopter or
    implementation proof from durable, scaled recurring usage. TYCROP and Hutchens
    provide named production or development evidence, while Saronic is evaluating the
    newer Rove system; retention, concentration, and customer-level economics remain
    largely undisclosed.
sections:
  - id: buyer-segments
    title: Buyer and use-case segmentation
    body: >-
      Path Robotics sells into manufacturers whose parts are large, variable, or
      difficult to fixture, rather than into a single standardized factory workflow.
      The strongest documented buyer contexts are shipbuilding, heavy construction,
      energy, transportation, agriculture, and trailer manufacturing. Machine Design
      describes transportation, energy, heavy equipment, and agriculture as high-mix
      settings with labor shortages and changing parts, while the Rove launch material
      adds shipbuilding and large-scale fabrication where the workpiece cannot be
      moved into a fixed cell. The buyer is therefore a multi-stakeholder industrial
      account: operations and manufacturing leadership own throughput, welding
      engineering owns process qualification, and quality teams must accept the
      resulting welds. Public material does not establish a consistent payer,
      contract value, or revenue band by segment.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Named deployments and adoption evidence
    body: >-
      The public record supports several different levels of adoption that should not
      be conflated. Hutchens Industries is described as an early partner during AF-1
      development, and Path said the cell was available with an order backlog into
      late 2023. TYCROP's own release reports implementation of Path's system with
      ALM Positioners and says it improved production performance and throughput.
      Saronic is a more prospective proof point: it is evaluating Rove in Louisiana
      shipbuilding operations, and commercial availability was expected in early
      2027. These records demonstrate customer engagement and use-case fit, but they
      do not disclose paid contract size, installed-base count, renewal, or whether
      every cited deployment reached sustained production.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU003]
    figureRefs: [FU001]
  - id: durability-expansion
    title: Durability, expansion, and concentration
    body: >-
      Path's commercial model appears designed for expansion after an initial
      deployment: the cited RaaS description includes production assistance, and the
      product narrative emphasizes adding work to cells that can handle variable
      parts. Sacra reports management claims of more than 200% net revenue retention
      and customers at least doubling commitments, but also notes that the cohort
      definition, churn, contract duration, and inclusion of non-recurring work were
      not disclosed. That qualification is material: an NRR figure without a defined
      starting cohort or revenue basis cannot establish durable recurring retention.
      The public evidence also does not identify the share of revenue from the largest
      customer, partner, or vertical, so concentration and procurement friction remain
      underwriting gaps rather than quantified risks.
    claimRefs: [CU010, CU011, CU012, CU013]
    tableRefs: [TU002]
  - id: customer-diligence
    title: What customer evidence still does not show
    body: >-
      The evidence is strongest on problem selection and named reference activity, not
      on customer economics. Machine Design presents a customer-oriented RaaS value
      proposition and a TYCROP outcome narrative, while Path's 2026 Rove coverage
      explicitly frames Saronic as an evaluator or early adopter and points to future
      commercial availability. No assigned source supplies a customer cohort table,
      logo-to-contract mapping, churn or GRR, renewal dates, deployment utilization,
      service-level performance, or customer concentration. The appropriate conclusion
      is that Path has credible adoption signals across fixed-cell and mobile use cases,
      but public evidence is insufficient to determine whether those signals represent
      repeatable, profitable expansion at scale.
    claimRefs: [CU014, CU015, CU016]

