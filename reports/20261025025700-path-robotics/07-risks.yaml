    approximationNotes: "Likelihood and impact positions are qualitative analytical assessments, not incident-frequency estimates."
    claimRefs: [CR001, CR002, CR005, CR006, CR009, CR010, CR013, CR014, CR016]
callouts:
  - calloutType: recommendation
    title: Investment kill criteria
    body: Pause underwriting if Navy-grade milestones slip materially, independent field data show persistent rework or unsafe intervention, Rove misses its reported 2027 commercialization window, or liquidity cannot fund hardware and support through customer payback.
    claimRefs: [CR006, CR007, CR009, CR010, CR013]
