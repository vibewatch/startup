company:
  name: Path Robotics
chapter:
  number: 7
  title: Risks
  summary: Path Robotics faces high residual execution risk because mobile welding, Navy-grade qualification, and a hardware-heavy service model must all mature together. The largest disclosed demand signal is shared, milestone-gated work rather than guaranteed revenue, while public evidence does not resolve safety history, unit economics, or runway.
sections:
  - id: ranked-risk-posture
    title: Ranked risk posture
    body: >-
      The highest-consequence risks are production qualification, worker safety, and
      field reliability. Rove moves autonomous welding beyond fixed cells into
      shipyards and other high-variability environments, but public descriptions still
      characterize Saronic as an evaluator or early adopter rather than evidence of
      scaled production. HII's demand signal is substantial but conditional: up to
      $900 million is shared between Path and GrayMatter over seven years and depends
      on readiness and performance milestones. The thesis therefore breaks if Path
      cannot pass Navy-grade qualification, sustain acceptable cost, schedule, and
      quality, or demonstrate safe operation outside controlled cells. Capital
      intensity and dependence on third-party robot platforms amplify the impact of
      any qualification delay.
    claimRefs: [CR004, CR005, CR006, CR007, CR009, CR010, CR016]
    figureRefs: [FR001]
  - id: safety-regulatory-exposure
    title: Safety, regulatory, and legal exposure
    body: >-
      Industrial robot applications expose workers to unexpected movement, collision,
      crushing, electrical, environmental, and maintenance hazards; mobile applications
      add the possibility of a robot driving into a worker. The current standards
      environment is also moving: A3 says R15.06-2025 added cybersecurity requirements
      and expanded covered safety functions. These are application-level obligations,
      not a certification automatically inherited from a robot component. For Path,
      the critical diligence evidence is a deployment-by-deployment risk assessment,
      factory and site acceptance results, safety-function validation, incident and
      near-miss history, and proof that remote support cannot defeat safeguards. No
      retained source establishes a Path-specific enforcement action, lawsuit, recall,
      or safety incident; that is an evidence gap, not proof that none occurred.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
  - id: operational-partner-dependencies
    title: Operational and partner dependencies
    body: >-
      Path must coordinate perception, welding, mobility, customer-site integration,
      and production acceptance rather than merely ship software. The public evidence
      describes Rove as an early product, with Sacra reporting only 50 units scheduled
      for 2027, while Saronic remains an evaluator. HII's two-stage structure creates a
      second dependency: development must validate Navy-grade production techniques
      before delivery work begins, and favorable cost, schedule, and quality remain
      explicit conditions. Upstream hardware is another concentration point because
      Sacra identifies Yaskawa and other OEM arms in fixed cells and Boston Dynamics
      Spot in Rove. A missed launch window, repeated rework, unsafe human intervention,
      failed acceptance test, or supplier discontinuity would delay both revenue and
      reference-customer proof.
    claimRefs: [CR005, CR007, CR008, CR009, CR013, CR016]
    tableRefs: [TR002, TR003]
  - id: financial-model-risk
    title: Financial and model risk
    body: >-
      Path's Robot-as-a-Service positioning lowers customer capex but shifts hardware,
      installation, utilization, service, and residual-value exposure toward Path.
      Sacra reports approximately $370 million raised as of September 2026, but funding
      raised is not cash available and Path has not disclosed a reliable current
      valuation. The same source says underlying revenue, ARR, customer count, and
      deployment count are undisclosed. Company-presented claims of 4x productivity,
      30% lower cost, zero capex, and 24/7 support therefore cannot be translated into
      gross margin, payback, or runway without private data. Underwriting should require
      cash and burn, fleet financing, support labor per cell, installation and warranty
      costs, backlog conversion, debt terms, and customer-level contribution margins.
    claimRefs: [CR010, CR011, CR012, CR014, CR015]
tables:
