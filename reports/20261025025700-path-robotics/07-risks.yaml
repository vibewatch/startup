    title: Regulatory / legal risk register
    columns: [Rule or exposure, Jurisdiction, Likelihood, Severity, Mitigation maturity, Residual exposure, Diligence path]
    rows:
      - [Industrial robot application risk assessment and safeguarding, "United States / each customer site", medium, critical, "External OSHA guidance is mature; Path-specific evidence is private", high, "Obtain task-based risk assessments, safety-function validation, FAT/SAT records, and change-control logs"]
      - [Mobile robot collision and worker interaction, "United States / mobile deployments", medium, critical, "OSHA identifies mobile collision hazards; Rove field controls are not disclosed", high, "Review navigation safety case, exclusion zones, emergency stops, and contact-event testing"]
      - [Robot-safety cybersecurity requirements, "United States / applicable installations", medium, high, "R15.06-2025 added requirements; Path implementation is not public", high, "Review threat model, network segmentation, remote access, patching, SBOM, and incident response"]
      - ["Navy-grade testing, qualification, and oversight", "United States defense shipbuilding", medium, high, "HII discloses a staged qualification process", "Medium-high until milestones pass", "Inspect qualification plans, nonconformances, oversight findings, and delivery-stage acceptance criteria"]
    notes: "Likelihood and severity are analytical assessments anchored to OSHA, A3, and HII requirements; the public source set does not enumerate private controls or Path-specific legal events."
    enumerationScope:
      coverage: partial
      basis: "Publicly visible U.S. robot-safety and disclosed defense-qualification exposures reviewed through 2026-10-25."
    claimRefs: [CR001, CR002, CR003, CR007, CR009]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Mobile precision or navigation fails in variable field conditions", medium, critical, "Rove is in early-adopter evaluation", high, "Independent yield, rework, uptime, intervention, and mobility-test data"]
      - ["Qualification delays block production conversion", medium, high, "HII uses development and delivery stages", high, "Current milestone results, nonconformances, and delivery awards"]
      - ["Remote support or connected controls create a cyber-safety failure", medium, high, "Path advertises 24/7 support; controls are not disclosed", high, "Architecture, access logs, patch SLAs, safety isolation, and incident exercises"]
      - ["Specialist labor or inspection capacity constrains scale", medium, high, "Large labor need supports demand but also raises implementation burden", "Medium-high", "Staffing by deployment, inspector capacity, training time, and support hours per cell"]
    notes: "No row is an observed Path incident rate; ratings combine disclosed product maturity, program gates, standards, and unresolved operating evidence."
    claimRefs: [CR002, CR004, CR005, CR007, CR009, CR013, CR014, CR015]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Performance-based shipbuilding pathway, HII, "Qualification and production demand", "Material; maximum work value is shared with GrayMatter", "Readiness or cost, schedule, or quality milestones fail", critical, "Two-stage qualification and delivery structure", high]
      - [Mobile welding evaluation, Saronic Technologies, "Early Rove evaluator", "One named early evaluator in retained evidence", "Evaluation does not convert to scaled paid deployment", high, "Additional early adopters are being sought", high]
      - [Robot arms and mobile base, "Yaskawa, Boston Dynamics, and other OEMs", "Physical platforms integrated with Path software and sensors", "Supplier shares and substitution lead times are undisclosed", "Component, support, or roadmap dependency delays deployments", high, "Multi-OEM sourcing is reported for fixed cells", "Medium-high"]
      - [Fleet and working-capital financing, "Investors and capital providers", "Fund hardware, installation, service, and residual value", "Current liquidity and covenants are undisclosed", "Growth consumes cash before subscriptions recover deployment cost", critical, "Approximately $370 million reportedly raised; cash available is unknown", high]
    notes: "The HII ceiling is contingent work shared by two suppliers, not recognized Path revenue; capital raised is not cash available or runway."
    claimRefs: [CR005, CR006, CR007, CR009, CR010, CR011, CR016]
