evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding-date
    missingEvidence: A primary corporate record reconciling Path Robotics' launch date, incorporation date, and operating history.
    whyItMatters: The founding date affects company age, financing chronology, and interpretation of third-party profiles.
    diligencePath: Request incorporation records, founder chronology, and the company's approved historical biography.
    relatedQuestionRefs:
      - QO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A complete current board, ownership, control-rights, and succession record.
    whyItMatters: Founder concentration and investor protections cannot be assessed from the partial public roster.
    diligencePath: Request the current cap table, charter, investor-rights summary, board roster, and succession materials under NDA.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: blocking
    topic: private-financials
    missingEvidence: Current valuation, recognized revenue, ARR, customer count, debt, cash, and runway with definitions and periods.
    whyItMatters: >-
      Funding raised and conditional partner-work ceilings do not establish available cash, recurring revenue quality,
      or investable valuation.
    diligencePath: >-
      Request the latest management accounts, financing documents, debt schedule, customer cohort data, and cash
      forecast.
    relatedQuestionRefs:
