company:
  name: Path Robotics
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a differentiated industrial-robotics product and meaningful financing history, but it does not establish current revenue, cash generation, or a tradable price. The evidence therefore supports research-more rather than a price-insensitive buy, with the latest third-party valuation signal treated as indicative rather than verified.
sections:
  - id: investment-thesis
    title: Investment thesis and anti-thesis
    body: >-
      Path has a credible product wedge in difficult-to-automate welding. Matter Venture Partners describes
      the company as building AI-powered robotic systems for manufacturing, while its portfolio page says
      welding is still more than 80% manual and that the cells are deployed across North America. The product
      story has broadened: Robotics 24/7 reports that Rove pairs the Obsidian physical-AI model with a
      quadruped robot and targets shipbuilding, heavy construction, and large fabrication where workpieces
      cannot be moved into a cell. That is strategically valuable because it expands the addressable job
      context beyond fixed-cell automation, but the Rove source also says Saronic is an early adopter
      evaluating the system, not that production revenue has been realized. The anti-thesis is therefore
      evidence-based: company and partner materials show capability and commercial interest, while public
      sources do not disclose backlog conversion, gross margin, recurring revenue, customer concentration,
      retention, or cash runway. A large financing history is not equivalent to cash available today, and
      an estimated private-market mark is not a confirmed transaction price. Until those gaps close, the
      investment case depends on execution and financing terms that an outside investor cannot currently
      underwrite.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: financing-and-comparables
    title: Financing context and comparable anchors
    body: >-
      The financing record is substantial but internally inconsistent across sources. TechCrunch reported
      a $56 million Series B in May 2021 and said total funding reached $71 million. Ohio Tech News reported
      a $100 million Series D in October 2024. Matter Venture Partners' portfolio page currently states
      "$171M Funded" and describes a 100% recurring RaaS model. Forge, updated August 20, 2026, displays a $570.09
      million post-money valuation for a November 2025 Series D-2, but its own disclosure says the figure
      represents an estimated valuation based on company-submitted certificates of incorporation and that
      Forge does not independently verify the data. That makes $570.09 million a useful diligence lead,
      not a confirmed fair value. As a public-market reference, CompaniesMarketCap reports Lincoln
      Electric at a $13.95 billion market capitalization in October 2026, while MarketScreener shows
      approximately $14.732 billion of 2026 enterprise value and a 23.1x P/E. These are not direct
      valuation multiples for a private, early-stage automation company: Lincoln has public liquidity,
      a different scale, and different economics. Grand View Research forecasts the global industrial
      robotics market at $41.9 billion in 2026 and $78.9 billion in 2033, but that market size is not
      Path revenue or a serviceable obtainable market. The correct use of these anchors is to set
      diligence questions and scenario bounds, not to manufacture a precise Path multiple.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV011]
    tableRefs: [TV003]
  - id: decision-and-diligence
    title: Decision, scenarios, and thesis-break triggers
    body: >-
      The appropriate current decision is research-more with low confidence in any precise valuation
      stance. A base case can underwrite a differentiated product and continued funding access, but it
      must assign no value to undisclosed ARR, margin, or backlog until management supplies them. The bull
      case requires paid deployments to convert into repeatable RaaS revenue, Rove to move from evaluation
      into production, and unit economics to support expansion without disproportionate service costs. The
      bear case is a financing or commercialization reset: a down round, unfavorable preferences, stalled
      production conversion, or a failure to achieve reliable autonomous welding at customer sites. The
      latest Forge mark should not be used as a target return because liquidity, preference stack, and
      current share price are not independently observable. Before entry, request the current cap table,
      fully diluted share count, preference and conversion terms, debt and covenants, trailing twelve-month
      revenue, ARR bridge, gross margin by hardware and RaaS, backlog aging, deployment cohort retention,
      customer concentration, cash balance, burn, and runway. Thesis-break monitoring should include any
      financing below the latest marked price, material preference seniority, missed production milestones,
      customer churn or concentration above management limits, or evidence that Rove remains a pilot rather
      than a repeatable product. Those conditions would move the stance toward avoid or require a materially
      lower entry price.
    claimRefs: [CV012, CV013, CV014, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: Current decision
    body: "Research-more: public evidence supports product and financing momentum, but current price, economics, liquidity, and preference terms are not sufficiently verified for a buy recommendation."
    claimRefs: [CV008, CV012, CV013]
  - calloutType: risk
    title: Principal valuation risk
    body: The strongest public valuation number is a Forge estimate with explicit non-verification and illiquidity disclosures; it should not be treated as an executable market price.
    claimRefs: [CV008]
  - calloutType: insight
    title: What would change the view
    body: Verified recurring revenue, gross-margin and retention cohorts, a clean preference stack, and production conversion of mobile welding pilots would support a higher-confidence valuation case.
    claimRefs: [CV014, CV015, CV016]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Current assessment, Decision implication]
    rows:
      - [Recommendation, research-more, "Do not underwrite a price-insensitive buy"]
      - [Confidence, low, "Public evidence is incomplete on economics and terms"]
      - [Risk rating, high, "Execution and financing structure remain material"]
      - [Valuation stance, unknown, "No independently verified executable price"]
    notes: "Assessment synthesizes the cited public record; unknown means the evidence does not support a precise valuation conclusion."
    claimRefs: [CV008, CV012, CV013]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Evidence, What would change the view]
    rows:
      - ["Product wedge", "AI-enabled adaptive welding addresses variable parts and hard-to-automate work", "Independent production uptime and quality data"]
      - ["Commercial expansion", "Rove extends the product to mobile welding and has an early adopter evaluating it", "Paid deployments, repeat orders, and cohort retention"]
      - ["Financing support", "Series B, Series D, and a reported Series D-2 mark show access to capital", "Current cap table, cash, burn, and financing terms"]
      - ["Valuation opacity", "Forge mark is estimated and explicitly not independently verified", "Primary financing documents and an arm's-length transaction"]
    notes: "Rows separate company/partner claims from independently disclosed valuation limitations; no row treats funding raised as cash available."
    claimRefs: [CV001, CV003, CV006, CV007, CV008]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Key risk]
    rows:
      - [Bull, "Paid RaaS deployments scale; Rove converts from evaluation to production; retention and margin are verified", "A higher private mark could be justified only after revenue and unit-economics disclosure", "Low until cohorts are supplied", "Commercialization and service-cost execution"]
      - [Base, "Product remains credible; financing continues; economics remain private", "Research-more; no supported target return or multiple", "Most supportable today", "Opacity prevents price discipline"]
      - [Bear, "Down round, preference overhang, stalled pilots, or weak deployment economics", "Avoid or require a material price reset", "Plausible downside", "Liquidity and dilution"]
      - [Diligence gate, "Cap table, TTM revenue, ARR bridge, gross margin, burn, runway, backlog and retention provided", "Re-underwrite entry price and expected return", "Required before commitment", "Missing primary evidence"]
    notes: "Scenarios are qualitative because public sources do not disclose the operating inputs needed for a defensible numeric valuation range."
    claimRefs: [CV012, CV013, CV014, CV015, CV016]
