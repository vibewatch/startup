chapter:
  number: 5
  title: Product & Technology
  summary: Path Robotics combines its Obsidian physical-AI welding model with vision hardware, robotic arms, and the new Rove quadruped platform to address high-variability welding that fixed automation cannot handle. The public record supports a credible adaptive-welding architecture and an emerging data feedback loop, but production reliability, certification, deployment scale, and security controls remain insufficiently disclosed.
sections:
  - id: product-and-customer-workflow
    title: Product in the customer workflow
    body: >-
      Path Robotics sells intelligent welding automation for manufacturers whose
      parts are too variable, large, or immovable for conventional fixed cells.
      Public descriptions identify Obsidian as a real-time perception and
      decision-making model for welding, while Rove extends that capability from
      a fixed cell to a mobile quadruped that brings the tool to the workpiece.
      The workflow is therefore not simply robot installation: the system scans
      the seam, generates a weld plan, adapts during execution, and is intended
      to return production data to the model. This makes the buyer value
      proposition capacity and repeatability in labor-constrained shipbuilding,
      heavy construction, and other high-mix fabrication environments, but
      publicly available material does not quantify realized throughput or
      deployment-wide quality.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: modules-and-architecture
    title: Modules and operating architecture
    body: >-
      The disclosed architecture has four practical layers: perception
      hardware, the Obsidian decision layer, a robotic execution platform, and
      a production-data feedback loop. Sea-Air-Space material describes
      proprietary lasers and optics scanning the seam, real-time weld-plan
      generation, and continuous adjustment during execution. Robotics Business
      News adds that the system monitors the weld pool and seam for heat
      distortion, while the Rove launch combines the same model with a
      quadruped. A partner case study separately describes Buildkite and Docker
      in engineering workflows, which is evidence of software delivery
      dependencies rather than proof of the robot runtime architecture. The
      public record does not specify interfaces, compute placement, network
      topology, or how safety interlocks are certified.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-deployment-and-roadmap
    title: Maturity, deployment, and roadmap
    body: >-
      Obsidian appears more mature than Rove in the public evidence. Path
      describes Obsidian as already deployed in fixed cells, while Rove is
      described as a launch and early-adopter evaluation for Saronic rather than
      as a proven production fleet. The technology’s claimed data advantage is
      substantial—tens of millions of welded inches and production data from
      each cell—but most performance numbers are company-reported. One interview
      cites a customer example reducing manual welding time per chassis from 150
      hours to 13 hours, a material result that is not accompanied by the
      customer name, baseline design, sample size, or independent verification.
      The roadmap is directionally clear toward mobile and distributed
      manufacturing, but commercial availability, service requirements,
      uptime, and repeatability across sites remain open.
    claimRefs: [CE009, CE010, CE011, CE012]
  - id: differentiation-trust-and-gaps
    title: Differentiation, trust, and implementation risk
    body: >-
      Path’s differentiation is the combination of adaptive perception,
      welding-specific data, and deployment in environments where fixed
      automation requires perfect fixturing. That positioning is credible as a
      product thesis and is corroborated by multiple trade publications, but it
      is not the same as independently verified superiority. Industrial
      reliability is a central gating issue: the company’s CEO told Robotics
      Business News that shipyard systems must operate at greater than 99%
      reliability, while the cited public materials do not report achieved
      uptime, defect rates, safety certifications, cybersecurity controls, or
      incident history. Deployment also depends on skilled implementation,
      welding process data, customer site conditions, and the quadruped’s
      stability in production. These gaps should be treated as diligence
      requirements, not as evidence that the system fails.
    claimRefs: [CE013, CE014]
