callouts:
  - calloutType: strength
    title: Adaptive welding targets a real automation bottleneck
    body: "The strongest product evidence is the specific workflow: scan variable seams, plan in real time, and adjust during welding rather than requiring perfect parts and fixed paths."
    claimRefs: [CE003, CE005, CE006]
  - calloutType: risk
    title: Production reliability is not yet publicly demonstrated
    body: "Rove’s early-adopter status and the lack of public uptime, defect, certification, and security data leave implementation risk material even though the architecture is plausible."
    claimRefs: [CE009, CE012, CE013, CE014]
