      topic: trust-gap
      missingEvidence: "Independent production evidence for uptime, weld-defect rates, safety certification, cybersecurity controls, and incident history across deployed cells and Rove pilots."
      whyItMatters: "Industrial welding failures can create scrap, rework, safety exposure, and schedule delays; architecture descriptions alone cannot establish production readiness."
      diligencePath: "Request customer-referenced uptime and defect logs, safety and conformity certificates, security review materials, incident registers, and acceptance-test criteria under NDA."
      relatedQuestionRefs: [QE007]
    - type: missing-source
      severity: material
      topic: performance-gap
      missingEvidence: "A reproducible, independently attributable benchmark for Obsidian and Rove across representative weld geometries and site conditions."
      whyItMatters: "The cited 150-to-13-hour example is potentially material but lacks the denominator, customer identity, sample, and control conditions needed to underwrite repeatability."
      diligencePath: "Obtain a customer-verified benchmark package covering baseline labor, cycle time, rework, quality acceptance, sample size, and operating conditions."
      relatedQuestionRefs: [QE004, QE005]
    - type: private-evidence-only
      severity: minor
      topic: architecture-gap
