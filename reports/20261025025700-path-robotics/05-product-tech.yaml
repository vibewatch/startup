      - [Weld immovable large structures, "Parts cannot be moved into a conventional cell", "Rove brings a mobile quadruped welding system to the workpiece", "Thomasnet and Ohio Tech News describe the mobile workflow", "Early-adopter evaluation is not proof of scaled production"]
      - [Reduce reliance on scarce welders and programmers, "Traditional cells require expert programming and controlled fixturing", "Physical AI is positioned to perceive and respond instead of repeating a fixed path", "Company interview cites a 150-to-13-hour manual-welding example", "Customer, sample, and methodology details are missing"]
      - [Improve product iteration, "Manufacturing data is difficult to turn into continuous improvement", "Each deployment is described as feeding production data back into the model", "Partner and company materials describe data feedback loops", "Data ownership, validation, and update rollback controls are undisclosed"]
    notes: "The benefit column separates reported or company-claimed outcomes from limitations; no public source establishes a comparable benchmark across customers."
    claimRefs: [CE003, CE004, CE006, CE010, CE011]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Dependency, Technical or implementation risk]
    rows:
      - [Perception, "Lasers, optics, and vision capture seam geometry and changing weld conditions", "Line of sight, calibration, and usable sensor data", "Occlusion, contamination, lighting, and calibration drift are not publicly quantified"]
      - [Decision and control, "Obsidian creates weld plans and adjusts during execution", "Welding-specific training data and validated model behavior", "Failure modes, human override, and update governance are undisclosed"]
      - [Physical execution, "Robot arm or quadruped positions the welding tool", "Mechanical stability, site access, power, and process integration", "Rove stability and production safety envelope are not independently documented"]
      - [Data and engineering delivery, "Production data supports fleet learning; Buildkite and Docker support partner-described engineering workflows", "Data capture, CI/CD, deployment, and customer connectivity", "Data rights, cybersecurity, network dependence, and rollback procedures are undisclosed"]
    notes: "This is an evidence-bounded operating model assembled from public descriptions; it is not a confirmed internal software or hardware bill of materials."
    claimRefs: [CE005, CE006, CE007, CE008, CE013, CE014]
