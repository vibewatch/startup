summary:
  headline: OPay 是尼日利亚支付市场里有规模、也有战略重要性的龙头；但经审计披露有限、业务高度集中在尼日利亚，合规和反欺诈问题又反复出现，案例仍应停在观察区间，据称的 IPO 野心也显得偏满。
