- id: capital-ownership-scale
  title: Capital Formation, Ownership Signals, and Scale Metrics
  body: 'OPay’s financing history is unusually legible for a private African fintech because Opera’s public filings provide
    a recurring external valuation bridge. After 2019 venture rounds totaling roughly $170 million, OPay closed a $400 million
    Series C in August 2021 at a $2 billion valuation led by SoftBank Vision Fund 2, taking disclosed lifetime capital raised
    to about $570 million. Opera then became the most useful public reference point for mark-to-market ownership: TechCabal
    reported that Opera’s stake had fallen to 6.4% by 2021 before climbing to 9.4% in early 2023 after a Nanobank-for-equity
    transaction, and Opera’s 2025 20-F states the company held 9.5% of OPay at year-end 2025. That filing carried the investment
    at $294.6 million and valued OPay using a probability-weighted exit framework with IPO, private-sale, redemption, and
    dissolution outcomes, implying a valuation in the low-$3 billion range and materially above the 2021 round price. BusinessDay
    separately reported that OPay hired Citi, Deutsche Bank, and JPMorgan for a possible 2026 U.S. IPO around a $4 billion
    target, although no public OPay SEC filing existed as of the run date. Scale disclosure is directionally strong but not
    perfectly clean. A Reuters-carried OPay release claimed more than 20 million daily active users and 36 million monthly
    active users worldwide in November 2025, while Opera-linked coverage elsewhere cited more than 50 million users in Nigeria,
    about 10 million DAU, and roughly $12 billion in monthly transaction volume. Those numbers show meaningful scale, but
    the underlying definitions are not yet harmonized for diligence use.'
