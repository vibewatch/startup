  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership-governance-disclosure
    missingEvidence: A full board list, committee structure, and complete named executive roster for OPay.
    whyItMatters: Governance, succession, and decision-rights analysis remain incomplete without a full board and management
      map.
    diligencePath: Request the latest board deck, cap table governance schedule, and corporate-org chart from management.
    relatedQuestionRefs:
    - QO009
    - QO026
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-secondary-history
    missingEvidence: Current cap table, investor ownership percentages beyond Opera, and any secondary-sale history after
      2021.
    whyItMatters: Ownership concentration, liquidation preference exposure, and true IPO-readiness cannot be judged from public
      round headlines alone.
    diligencePath: Obtain the latest cap table, shareholder registry, and financing documents including side letters and secondary
      transactions.
    relatedQuestionRefs:
    - QO013
    - QO014
    - QO028
    relatedTableRefs:
    - TO003
  - type: conflicting-data
    severity: material
    topic: scale-metric-definitions
    missingEvidence: A management-certified reconciliation of users, DAU, MAU, and monthly transaction-volume definitions
      across 2025-2026 disclosures.
    whyItMatters: Different denominator choices could materially change any market-share, monetization, or valuation narrative
      built on scale.
    diligencePath: Ask OPay for a KPI dictionary plus the last four quarters of board-approved operating metrics.
    relatedQuestionRefs:
    - QO016
    - QO017
    - QO027
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Revenue, profitability, headcount, and office-footprint disclosures current enough to reuse as diligence
      ground truth.
    whyItMatters: These are core maturity metrics for underwriting unit economics, management depth, and readiness for public
      markets.
    diligencePath: Request audited financial statements, current management accounts, monthly business review packs, and an
      updated org chart.
    relatedQuestionRefs:
    - QO017
    - QO027
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: country-footprint-confirmation
    missingEvidence: Primary evidence confirming whether Kenya and Pakistan are active operating markets versus historical
      expansion targets or exploratory efforts.
    whyItMatters: Country-footprint inflation can overstate TAM, regulatory complexity, and execution readiness.
    diligencePath: Request the legal-entity list, current country-by-country active-user dashboard, and local licensing matrix.
    relatedQuestionRefs:
    - QO021
    - QO022
    relatedTableRefs:
    - TO004
