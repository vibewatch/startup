- id: leadership-governance
  title: Leadership, Founder Continuity, and Governance
  body: 'Founder continuity is unusually strong. Public reporting and official releases tie OPay’s creation to James Yahui
    Zhou, who built the company inside Opera and in late 2025 moved into the role of executive chairman. The 2025-2026 governance
    reset added Lars Boilesen as co-CEO, Stephen as co-CEO and COO, and former Citigroup managing director James Perry as
    CFO, all effective December 1, 2025. Those appointments point to deliberate preparation for tighter regulatory communication,
    capital-markets work, and geographic expansion. At the Nigeria operating level, Dauda Gotring was still presented as CEO
    in early 2024, while Dotun Daniel Adekunle appeared publicly in 2026 as COO/CTO at the BusinessDay Fintech Summit. The
    picture therefore is not leadership absence but layered leadership: founder oversight, a newly globalized executive core,
    and continuing local operators. Governance transparency remains a clear weakness. Reuters-carried company releases identify
    “Stephen” only by first name, and the public record does not provide a full board list, independent-director roster, or
    committee structure. Opera’s 2025 annual report disclosed that one independent director joined OPay’s board in 2025, but
    also stated Opera has no contractual board rights and no significant influence despite its 9.5% stake. That combination
    reduces direct ownership-control concerns while increasing diligence needs around board composition, succession planning,
    and decision rights.'
  claimRefs:
