  title: Regulatory and account-freeze process risk is already visible
  body: The combination of a reported 2024 KYC penalty, a glitch-driven recovery campaign that froze customer accounts, and
    a separate court judgment against OPay for an unlawful freeze shows that fraud controls and due-process handling are real
    operational risks rather than hypothetical concerns.
  claimRefs:
