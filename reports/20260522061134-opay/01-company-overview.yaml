company:
  name: OPay
chapter:
  number: 1
  title: Company Overview
  summary: OPay is a 2018-founded Opera-incubated fintech built around Nigeria and now publicly described as a Singapore-based
    digital banking platform for emerging markets. Public filings and major press support a 2021 $400 million Series C at
    a $2 billion valuation, Opera’s 9.5% stake valued at $294.6 million as of December 2025, and a 2025-2026 governance reset
    ahead of reported IPO planning, but headquarters, revenue, headcount, and parts of the country footprint remain materially
    under-disclosed or inconsistent.
sections:
- id: identity-product-footprint
  title: Identity, Product Model, and Footprint
  body: 'OPay is a payments-led fintech platform that was established in 2018 and first launched its mobile money service
    in Nigeria, with early coverage describing a Lagos-based company built by Opera around a super-app thesis. Over time,
    the public product set narrowed from ride-hailing, delivery, and commerce experiments toward a core wallet and merchant-finance
    stack: transfers, bill payments, airtime and data purchases, debit cards, OWealth savings, point-of-sale acquiring, and
    merchant services. Opera’s 2025 annual report describes OPay as a privately held fintech operating across Africa and Asia
    with payments, transfers, savings, lending, agent POS, and merchant acquiring products. The operating center of gravity
    remains Nigeria: OPay’s public communications stress Nigerian financial inclusion, the platform is licensed by the Central
    Bank of Nigeria and insured by the NDIC, and the company reported 17 physical customer centers by early 2024. The main
    identity caveat is headquarters disclosure. Earlier coverage called OPay Lagos-headquartered, while 2025-2026 management
    releases repeatedly describe it as Singapore-based. Because the reviewed public record does not resolve whether that reflects
    a holding-company move, a dual-headquarters model, or only executive relocation, later chapters should treat Nigeria as
    the operating core and Singapore as the latest disclosed global base rather than assuming one uncontested headquarters
    statement.'
