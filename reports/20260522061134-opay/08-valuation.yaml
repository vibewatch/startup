  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Probability signal
      - Valuation range
      - What must be true
      - Main failure mode
    rows:
      - - Bear
        - 25%
        - US$1.8B-US$2.6B
        - IPO slips; market re-underwrites OPay on disclosure risk; Nigeria and compliance issues remain central.
        - Audited numbers disappoint, or fresh enforcement / fraud episodes compress investor trust.
      - - Base
        - 50%
        - US$2.8B-US$3.6B
        - Opera’s current mark is directionally right; monetization is real but still not software-like; regulation stays manageable.
        - IPO premium fails to materialize because disclosure improves only partially.
      - - Bull
        - 25%
        - US$3.8B-US$4.6B
        - Audited revenue and margin quality are strong; no new regulatory shock; IPO process validates growth durability.
        - Investors conclude current scale is lower-quality or too Nigeria-concentrated for premium pricing.
      - - Probability-weighted central view
        - 100%
        - approx. US$3.2B-US$3.4B
        - Evidence gap narrows but not fully enough to clear a wide premium over Opera’s mark.
        - Paying $4B before disclosure arrives leaves little buffer if any one assumption fails.
    notes: >-
      Scenario ranges are analyst estimates in USD billions anchored on disclosed valuation marks, sector comp ranges, and known
      downside channels rather than on a direct audited revenue model.
