  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Status / date
      - Valuation or multiple anchor
      - Relevance to OPay
      - Limitation
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-useful public and private valuation references for OPay as of the 2026-05-22 run date,
        combining direct OPay anchors, public-market fintech comps, and African private-fintech rounds rather than every
        imaginable listed bank or payments company.
    rows:
      - - OPay Series C
        - Private round, 2021
        - $2.0B post-money valuation
        - Last priced primary round and the cleanest hard historical anchor.
        - Stale for a 2026 decision and predates OPay’s current scale profile.
      - - OPay implied by Opera 2024 carrying value
        - Minority-holder mark, 2024
        - ~$2.75B implied
        - Shows OPay had already appreciated meaningfully beyond the 2021 round.
        - Derived from shareholder carrying value rather than a third-party financing event.
      - - OPay implied by Opera 2025 carrying value
        - Minority-holder mark, 2025 year-end
        - ~$3.1B implied
        - Best current public anchor before any IPO filing.
        - Based on probability-weighted internal valuation model, not a traded market cap.
      - - OPay reported US IPO ambition
        - Newsflow, May 2026
        - ~$4.0B target
        - Defines the practical entry question facing new investors.
        - Reported aspiration only; no public prospectus yet.
      - - Nubank
        - Public, May 2026
        - ~3.4x EV/revenue on ~$18B LTM revenue and ~$62B EV
        - Closest large disclosed digital-finance comp for valuation discipline.
        - Much larger, more geographically diversified, and fully public.
      - - Mercado Pago / MercadoLibre
        - Public, May 2026
        - MELI market cap ~$85.1B; no clean standalone Mercado Pago multiple
        - Relevant for wallet, merchant, and credit mix in emerging markets.
        - E-commerce plus fintech bundle makes transfer to OPay noisy.
      - - Paytm
        - Public, May 2026 / FY26
        - ~$7.4B market cap after first annual profit and ₹8,437 crore FY26 revenue
        - Shows public investors can stay selective even after payments platforms restore profitability.
        - India-specific regulation, distribution, and accounting limit direct comparability.
      - - Kaspi.kz
        - Public, May 2026 / FY2025
        - 1.85x price/sales and 7.30x normalized P/E
        - Useful super-app reference for disclosed, profitable fintech economics.
        - Far more disclosed and profitable than OPay today.
      - - Moniepoint
        - Private round, 2024
        - $1B+ valuation
        - Best recent African private-fintech cross-check below OPay’s reported levels.
        - Merchant / SME banking mix differs from OPay’s consumer-wallet orientation.
      - - Flutterwave
        - Private round, 2022
        - $3B+ valuation
        - Demonstrates that Africa-focused fintech platforms can clear multi-billion private marks.
        - Older round in a different funding environment and a more enterprise/API-heavy model.
    notes: >-
      Public comparables are intentionally mixed with private African rounds because OPay lacks audited revenue and margin data.
      The table is for triangulation, not for mechanically forcing a single multiple onto an opaque asset.
