  - id: recommendation-and-diligence-conditions
    title: Recommendation, Conditions for Upside, and Final Diligence Ask List
    body: |-
      The most defensible stance at the current evidence level is price-sensitive caution rather than enthusiasm. OPay looks too proven operationally to dismiss: the 2021 round, Opera’s recurring marks, reported IPO-bank engagement, and persistent Nigerian consumer scale all point to a company with genuine institutional value. But the same public record also shows why a blind late-stage buy call would be premature. OPay still has no public audited standalone revenue, margin, cash-flow, or cap-table package; Opera’s mark is explicitly uncertain; and Nigeria concentration, compliance enforcement, and freeze or fraud controversies remain live inputs into valuation rather than side notes.

      That is why the recommendation should be research-more / track with medium confidence, high risk, and a stretched valuation stance at a $4 billion ask. Around Opera’s implied ~$3.1 billion mark, the story is easier to defend as fair: the bridge from $2 billion in 2021 to $3.1 billion in 2025 is plausible and supported by a real shareholder mark. At $4 billion, investors are effectively pre-paying for disclosure that has not yet arrived. The price can work, but only if the IPO process reveals audited revenue quality, durable monetization beyond free-feeling transfers, acceptable regulatory correspondence, and evidence that OPay can manage Nigeria risk without valuation air pockets.

      The diligence conditions are therefore unusually concrete. Before upgrading to buy, investors should demand audited FY2025/FY2026 financials, a revenue-to-TPV and revenue-to-gross-margin bridge, geography-level user and revenue mix, a cap-table and preference-stack review, regulator and litigation correspondence, and operating metrics around complaints, freezes, fraud losses, and appeal outcomes. If management cannot supply those, the correct interpretation is not merely “more work needed.” It is that the valuation is already stretching beyond the public evidence base.
