tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Decision implication
    rows:
      - - Recommendation
        - research-more / track
        - Do not treat a $4B IPO aspiration as a buy signal without IPO-grade disclosure.
      - - Valuation stance
        - stretched at $4B; fair closer to Opera’s ~$3.1B mark
        - Margin of safety is thin at the reported IPO target.
      - - Confidence
        - medium
        - Direction of the valuation bridge is clear; monetization quality is not.
      - - Risk rating
        - high
        - Nigeria concentration, compliance history, and disclosure opacity can reprice the case quickly.
      - - Cleanest current anchor
        - Opera 2025 20-F implied value of about $3.1B
        - Best public mark available; still an internal probability-weighted fair-value model.
      - - Entry discipline
        - Prefer exposure after audited filing or at a valuation closer to $3.0-3.2B
        - Waiting for disclosure is more rational than paying the full IPO premium in advance.
      - - Upgrade trigger
        - Audited revenue and margin bridge plus no new regulatory shock
        - Would turn comp work from illustrative to underwritable.
      - - Primary downside trigger
        - IPO delay or audited numbers that weaken the monetization narrative
        - Could pull fair value back toward the mid-$2B range.
    notes: >-
      Assessment is price-sensitive rather than a generic company-quality judgment. “Fair” refers to support from public anchors,
      not intrinsic certainty.
