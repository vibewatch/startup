  - id: TV007
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Audited financials
        - FY2025 and FY2026 audited revenue, gross margin, EBITDA / EBIT, and cash-flow statements
        - Core prerequisite for direct multiple work and underwriting earnings quality
        - Obtain IPO draft, auditor package, or board-approved annual accounts.
      - - Revenue quality bridge
        - TPV-to-revenue, product-mix, and geography-level monetization bridge
        - Separates free-feeling payment habit from monetized merchant / credit / wealth economics
        - Request banker valuation deck plus monthly cohort monetization tables.
      - - Nigeria concentration
        - Country-level users, TPV, revenue, and profit contribution
        - Determines whether OPay is truly multi-market or still mostly a Nigeria risk bundle
        - Request management operating review by market.
      - - Regulatory and legal pack
        - CBN correspondence, remediation log, account-freeze cases, complaint metrics, and fraud-loss data
        - Directly affects discount rate, growth durability, and reputational risk
        - Review board risk pack and outside counsel summaries.
      - - Cap table and preferences
        - Current ownership, preference stack, anti-dilution terms, and IPO mechanics
        - Headline valuation can differ materially from effective economics to new investors
        - Review dataroom cap table and counsel memo on liquidation preferences and IPO conversion.
      - - Governance and controls
        - Board composition, committees, internal-control ownership, and listing-readiness workplan
        - Explains whether IPO-grade disclosure can arrive without surprises
        - Require governance memo and pre-listing controls assessment.
    notes: >-
      These are the minimum diligence conditions for moving from “interesting” to “investable” at a premium valuation.
