  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: audited-financials
      missingEvidence: Audited FY2025 and FY2026 standalone OPay financial statements, including revenue, gross margin, EBIT, and cash flow.
      whyItMatters: Without audited operating-company numbers, the reported $4 billion IPO target cannot be underwritten with a direct comp or earnings framework.
      diligencePath: Obtain the draft IPO filing, auditor package, or board-approved annual accounts before making a buy decision.
      relatedQuestionRefs:
        - QV008
        - QV020
    - type: private-evidence-only
      severity: material
      topic: valuation-method
      missingEvidence: Full banker or board valuation memo showing the peer set, revenue bridge, and probability assumptions behind current marks.
      whyItMatters: Public reporting reveals the broad Opera methodology but not enough to test whether the implied valuation is conservative or aggressive.
      diligencePath: Request the latest shareholder valuation deck and any IPO bank comparables pack.
      relatedQuestionRefs:
        - QV004
    - type: private-evidence-only
      severity: material
      topic: cap-table
      missingEvidence: Current cap table, preference stack, anti-dilution terms, and expected IPO mechanics.
      whyItMatters: Headline valuation can differ materially from effective entry economics for a new investor.
      diligencePath: Review the dataroom cap table and counsel memo on liquidation preferences and IPO conversion.
      relatedQuestionRefs:
        - QV029
    - type: private-evidence-only
      severity: material
      topic: geography-mix
      missingEvidence: Country-level user, TPV, revenue, and profitability mix for Nigeria versus other markets.
      whyItMatters: Nigeria concentration is one of the main discount-rate drivers in the valuation case.
      diligencePath: Request management operating review by geography and supporting KPI schedules.
      relatedQuestionRefs:
        - QV030
    - type: enumeration-incomplete
      severity: material
      topic: TV004 comparable valuation coverage remains partial because OPay lacks audited revenue and a cleaner directly comparable listed peer set.
      missingEvidence: A tighter public comp set with audited OPay revenue, margin, and geography mix plus cleaner standalone emerging-market wallet peers.
      whyItMatters: The comparable valuation table is intentionally partial today, so readers need an explicit record of what evidence would make the peer set more complete.
      diligencePath: Rebuild TV004 once audited OPay metrics and a banker-approved comp set are available.
      relatedTableRefs:
        - TV004
