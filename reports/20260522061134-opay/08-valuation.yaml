  - id: TV006
    title: Thesis-break and action triggers table
    columns:
      - Trigger
      - Threshold or event
      - Transmission to valuation
      - Action implication
    rows:
      - - Audited revenue quality disappoints
        - IPO filing shows materially lower revenue, lower take rate, or weaker margins than implied by 2026 press narratives
        - Public comp math compresses immediately and the IPO premium disappears
        - Move to avoid / require reprice closer to bear range.
      - - Fresh regulatory or compliance action
        - New CBN enforcement, onboarding restriction, or large compliance fine during IPO prep
        - Raises discount rate and weakens growth durability assumptions
        - Delay investment until remediation is documented.
      - - Fraud / freeze trust deterioration
        - Complaints, lawsuits, or appeal failures rise materially
        - Hurts user retention and increases support / compliance cost expectations
        - Treat as thesis break unless compensated by stronger disclosure and controls.
      - - Nigeria concentration remains overwhelming
        - IPO materials show little diversification in revenue or TPV outside Nigeria
        - FX and country-specific risk dominate the valuation mechanism
        - Refuse premium multiple transfer from diversified global peers.
      - - Opaque cap table or preferences
        - Late diligence reveals ratchets, stack complexity, or IPO mechanics unfavorable to new investors
        - Reduces effective entry economics even if headline valuation stays constant
        - Re-underwrite on fully diluted and net-proceeds terms before investing.
    notes: >-
      Triggers are framed as monitorable events that would change the valuation case rather than as generic operating risks.
