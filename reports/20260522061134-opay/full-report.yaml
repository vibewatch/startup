  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      Decision flow linking OPay’s operating scale, Opera’s shareholder mark, disclosure weakness, Nigeria / compliance
      risk, and final recommendation.
    data:
      nodes:
        - id: n1
          label: Operating scale exists
          detail: 2021 round plus later user / volume narratives support real franchise value.
        - id: n2
          label: 'Best public anchor: ~$3.1B'
          detail: Opera’s 2025 carrying value on a 9.5% stake is the cleanest current mark.
        - id: n3
          label: Disclosure gap remains large
          detail: No public audited standalone revenue, margin, or cash-flow package.
        - id: n4
          label: Nigeria / compliance risk still live
          detail: FX, KYC, fraud, freezes, and trust issues can widen the discount rate.
        - id: n5
          label: $4B IPO talk is a premium case
          detail: About 29% above Opera’s mark and dependent on disclosure catching up.
        - id: n6
          label: 'Recommendation: research-more / track'
          detail: Fair nearer the Opera mark; stretched at $4B without IPO-grade proof.
        - id: n7
          label: Upgrade trigger
          detail: Audited metrics, clean regulator record, and transparent cap-table economics.
      edges:
        - from: n1
          to: n6
          label: supports interest
        - from: n2
          to: n6
          label: sets fair anchor
        - from: n3
          to: n6
          label: blocks buy call
        - from: n4
          to: n6
          label: raises risk
        - from: n5
          to: n6
          label: makes price stretched
        - from: n6
          to: n7
          label: conditions to upgrade
    approximationNotes: null
