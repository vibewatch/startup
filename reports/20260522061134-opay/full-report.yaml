      - number: '4.3'
        title: Credit, float, and compliance create real financial risk even without public loss data
        blocks:
          - type: paragraph
            body: >-
              Public source quality is enough to show that OPay is not a narrow software-style processor, but not enough
              to measure its balance-sheet exposures. Opera’s filing explicitly says OPay offers savings and lending,
              alongside agent POS and merchant acquiring. OPay’s own pages show OWealth as a daily-interest product
              powered by OPay Microfinance Bank Limited. Neobanks.guide goes further, describing a stack that includes a
              deposit-taking microfinance bank, OWealth as a money-market-fund wrapper, and OPay Credit or OKash as a
              short-tenor loan product. That combination implies at least three economically different pools of risk:
              customer-balance and float management, wealth-product economics with some fund-management or spread
              component, and credit exposure from short-duration lending. What is missing is the hard data that would
              tell an investor how large those pools are.


              The same opacity applies on the cost side. OPay’s model is visibly opex-heavy rather than capex-heavy. The
              main public cost vectors are agent commissions, merchant and network settlement costs, card issuance and
              processing, KYC and fraud controls, customer support, and whatever funding and loss costs sit behind
              lending and wealth. Ecofin’s reporting on 500,000-plus agents and 563,000 agents by mid-2023 makes clear
              that offline distribution is an asset but also a commission and servicing burden. Neobanks.guide’s review
              adds the qualitative economics: agents earn commissions, card withdrawals incur issuer and operator
              charges, OWealth returns are net of management fees, and lending products charge origination fees and
              interest. None of this is enough to produce gross-margin or contribution-margin math, but it is enough to
              reject a low-cost, software-only mental model.


              Adverse evidence sharpens the point. Nairametrics and The Paypers report that the CBN fined OPay ₦1
              billion in 2024 for KYC non-compliance, while three separate 2026 reports describe a Federal High Court
              dispute over an allegedly unlawful account freeze. Nairametrics also notes that customer complaints and
              transaction-risk management are central to OPay’s operating model. Financially, those are not merely
              reputation stories. They point to recurring compliance spend, fraud-loss prevention cost, potential legal
              exposure, reversals and support expense, and the risk that tighter supervision raises the cost of
              maintaining growth. The absence of disclosed default rates, provisions, or fraud-loss ratios is therefore
              a material diligence blocker rather than a minor data gap.
