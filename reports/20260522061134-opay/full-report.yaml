      - number: '6.3'
        title: Retention, switching, and customer economics
        blocks:
          - type: paragraph
            body: >-
              OPay's likely retention engine is convenience plus physical distribution, not published cohort data. The
              strongest public switching reasons are instant transfers, low or no visible consumer fees in common use,
              merchant settlement convenience, the ability to obtain cards or cash services through agent stores, and a
              support footprint that is visibly larger than most app-only peers. TechCabal's benchmark suggests that
              speed and low-friction execution are genuine strengths, while Nairametrics shows OPay increasingly turning
              customer support and safety controls into product features rather than purely reactive operations. That
              said, public data does not clear true customer durability. There is no audited NRR, GRR, churn, or
              retention cohort disclosure, and merchant economics show real pressure points. Current Google Play
              Business reviews praise the product but complain about pay-as-you-go charges, repeated fees, and feature
              gaps, implying that merchant satisfaction is positive but not price-insensitive. Trust also appears
              socially mediated: TechCabal notes that peer reviews matter as much as product speed in building
              confidence. That means OPay can keep users when the service works, but reputational hits can still raise
              switching risk quickly.
