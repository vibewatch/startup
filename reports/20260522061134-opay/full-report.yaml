      - number: '4.2'
        title: Scale is credible, but profitability claims are only partly cleared
        blocks:
          - type: paragraph
            body: >-
              The most important financial diligence question is not whether OPay is large; it is whether large volume
              has already become durable profit. Here the public record is materially weaker. Secondary sources cite
              strong internal performance. TechCabal says Opera told shareholders OPay quadrupled its user base through
              2023 and grew revenue by more than 60% on a constant-currency basis. Ecofin and Tekedia both say OPay
              reached its first monthly profit in 2024. Those are useful signals, especially because they fit the
              broader narrative of a scaled Nigerian payments leader preparing for public markets. But none of the
              reviewed sources provides audited standalone OPay income statements, gross margins, operating margins, or
              cash-flow statements. There is no public OPay filing comparable to what a U.S. IPO prospectus would
              require.


              The biggest disclosure-quality red flag is the recurring 2026 claim that OPay generated $614.8 million of
              revenue in 2025. Technext states that number directly, and WeeTracker echoes it. But the same $614.8
              million and 28% growth figure appears in Opera Limited’s own SEC 20-F as Opera’s 2025 revenue, not OPay’s.
              That does not prove OPay’s revenue was lower or higher; it does show that at least part of the 2026 media
              cycle appears to be recycling Opera’s figure into OPay’s story. For underwriting, that means the most
              concrete-looking revenue number in the market cannot be relied upon as a verified OPay revenue fact. The
              chapter therefore treats OPay revenue as undisclosed, not as $614.8 million.


              That distinction materially affects take-rate work. If OPay’s revenue is not publicly established, then a
              clean revenue-to-TPV take-rate calculation is impossible. What can still be said is that the platform
              behaves like a low visible-fee network with monetization shifted to merchant acceptance, payouts, card
              rails, lending, and wealth products. Technext and BusinessDay both imply that public-market investors will
              force more attention onto ARPU, margin expansion, and fee discipline. That pressure may already be
              surfacing in user complaints about VAT and business-app charges. The financial implication is
              double-edged: OPay may have genuine operating leverage, but its consumer franchise was built in a market
              where fee sensitivity is high and switching costs are modest. A strong scale story therefore coexists with
              a weak public revenue-quality story. On current evidence, profitability is believable but not yet
              underwritable.
