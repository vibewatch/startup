        - Does direct NPS connectivity improve OPay economics or mostly reduce systemic friction for all players?
      - - Remittance digitization
        - Tailwind
        - Current to multi-year
        - Digital remittances are cheaper than legacy methods, creating a potential cross-sell path into wallet usage
        - How many remittance recipients can OPay onboard into retained wallet balances versus immediate cash-out?
      - - Tightening regulation, KYC, and cybersecurity requirements
        - Constraint
        - Immediate
        - Compliance cost rises as the CBN tightens supervision, cybersecurity reporting, and agent controls
        - What is OPay’s incremental compliance spend and how does it affect marginal economics by segment?
      - - Trust, fraud, and dispute resolution
        - Constraint
        - Immediate and persistent
        - Failed transfers or fraud events directly change user and agent provider choice, slowing durable adoption
        - What are transaction-failure, reversal-time, fraud-loss, and complaint-resolution benchmarks versus peers?
      - - Device, literacy, and rural access gaps
        - Constraint
        - Persistent
        - >-
          High phone ownership does not eliminate low-smartphone and low-literacy barriers, preserving the need for
          assisted channels
        - What share of OPay activity depends on USSD, agents, or low-data workflows rather than full app usage?
      - - Margin pressure from cash competition and low-fee expectations
        - Constraint
        - Persistent
        - >-
          If cash remains the benchmark and core rails trend toward zero-cost transfers, volume growth may outrun
          monetization
        - Which revenue streams beyond transfer fees support sustainable contribution margins?
    notes: >-
      The table separates adoption tailwinds from monetization constraints. Some forces increase usage while
