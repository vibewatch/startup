  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation Anchors and Whether They Coherently Bridge to $4 Billion
        blocks:
          - type: paragraph
            body: >-
              The public valuation story is more coherent than many private African-fintech cases, but it still stops
              short of proving that a $4 billion IPO would be cheap. The 2021 priced anchor is clear: OPay raised $400
              million at a $2 billion valuation in a SoftBank Vision Fund 2-led Series C. The next two anchors come not
              from OPay itself but from Opera, a minority shareholder whose public filings are the best external mark
              available. BusinessDay’s 2024 reporting on Opera’s carrying value pointed to a 9.4% stake worth $258.3
              million, implying roughly $2.75 billion for OPay. Opera’s 2025 Form 20-F then carried a 9.5% stake at
              $294.6 million, implying about $3.1 billion at year-end 2025.


              That sequence is directionally sensible: roughly 38% appreciation from the 2021 priced round to the 2024
              implied mark, then a further ~13% increase into the 2025 mark. The harder question is the May 2026 IPO
              chatter. Multiple reports say OPay hired Citi, Deutsche Bank, and JPMorgan and is targeting around $4
              billion in the US. That would be only about a 29% premium to Opera’s year-end 2025 implied value, which is
              not a wild late-stage step-up on its face. But Opera’s mark is not a public market print. Launch Base
              Africa and WeeTracker both stress that Opera’s internal model assigned an 85% IPO probability, an 18.5%
              discount rate, and a 10% discount for lack of marketability. Opera’s own filing also warns that the fair
              value of its OPay investment is highly uncertain and can create material volatility. So the anchors cohere
              directionally, but the $4 billion ask is still a forward-looking optimism case rather than a fully cleared
              valuation fact.
            claimRefs:
