      - number: '2.3'
        title: Buyer, User, Payer, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              OPay’s buyer map is multi-sided rather than single-enterprise. On the consumer side, the user and payer
              are usually the same person funding a wallet or choosing a transfer interface, but that consumer still
              depends on regulated rails, bank connectivity, agent cash points, and trust in reversals or dispute
              handling. On the merchant side, AFI’s merchant-acceptance work is the clearest external reminder that
              merchants are central nodes in cash-to-digital conversion because they receive customer payments, pay
              suppliers, and often pay workers. NQR’s design makes that concrete in Nigeria: merchants present a code,
              customers scan via bank or wallet apps, and the merchant receives a real-time credit notification. Agents
              form a separate segment again. They are users of provider infrastructure, quasi-buyers of uptime and
              service quality, and local trust intermediaries for consumers who still depend on cash-in/cash-out points.
              Banks, card schemes, and NIBSS are not retail end users, but they are still economically relevant payers
              or gatekeepers because they supply settlement, scheme access, and compliance architecture.


              Public evidence is strongest on workflow and weaker on exact signer identity. EFInA-derived reporting
              shows non-bank channels, mobile money, and financial-agent usage driving inclusion gains, which suggests
              OPay-class providers are winning where branch density and traditional onboarding were previously too weak.
              IMF evidence adds the distribution point: Nigeria’s agent goal was exceeded by far, reaching 1.375 million
              agents by September 2022, even if the north remained underserved. At the same time, the adoption path is
              constrained by device and trust realities. Proshare’s EFInA summary says mobile-phone adoption was 93% in
              2023 but smartphone usage only 27%, while TechEconomy gives an even higher 99% phone-ownership figure,
              highlighting that app-led narratives still sit on noisy device data. That is why agent and QR paths
              matter: consumers, micro-merchants, and SMEs do not all adopt through the same channel, and budget
              ownership is more directional than contractually explicit in public sources.
