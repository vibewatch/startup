        - Owner-operated merchant budget
        - Need to reduce cash handling, receive instant value, and improve reconciliation
      - - SME operator
        - Founder, ops lead, or finance owner
        - Staff taking payments and making supplier or wage flows
        - Business operating budget
        - Merchant acceptance plus transfer, payroll-like, and supplier payment workflows
        - SME owner-manager or finance lead
