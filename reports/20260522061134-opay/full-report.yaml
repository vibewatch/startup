  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              OPay should be analyzed inside Nigeria’s regulated digital-payments stack rather than as a generic
              “fintech” label. The Central Bank of Nigeria (CBN) treats the market as a supervised payments system with
              card schemes, switches, payment-service providers, agent-banking rules, mobile money operators, and
              QR/payment frameworks, and its PSP register explicitly lists Opay Digital Services Limited in the mobile
              money operator category. That places OPay at the intersection of consumer wallet usage,
              bank-account-linked transfers, merchant acceptance, agent cash-in/cash-out, debit-card usage, and
              settlement rails coordinated by banks and NIBSS rather than inside a single closed-loop wallet market.
              OPay’s own public service page supports that framing: it markets wallet funding, free transfers to bank
              accounts, bill payment, debit cards, and OWealth under one interface, which means the relevant market
              includes both app-led consumer transactions and offline distribution or acceptance touchpoints.


              The included spend is therefore broader than “wallet revenue” but narrower than all African fintech
              revenue. At the Nigeria level, the bounded market includes transaction processing and acceptance activity
              across mobile money operators, bank-transfer rails, POS/agent transactions, QR acceptance, and
              consumer/merchant-facing payment workflows. It excludes unrelated lending balances, insurance,
              wealth-management AUM, and non-payment fintech categories unless those categories directly change the
              payment workflow or attach economics. It also excludes pure telco airtime economics, generic core-banking
              software, and unconnected financial-services TAM narratives that do not map to OPay’s current regulated
              role. The main substitutes remain cash, incumbent bank transfers, bank-owned cards, multi-provider
              POS/agent setups, and competing fintech interfaces. NQR and the broader CBN road map matter because they
              show the market is being designed to pull merchants and consumers onto interoperable digital rails rather
              than onto one proprietary provider’s ecosystem.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
