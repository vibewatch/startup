            body: >-
              Adoption evidence is strongest where company-distributed scale claims are paired with observable or
              independent customer surfaces. Company releases put OPay above 50 million users, 1 million merchants, and
              more than 20 million daily active users by late 2025. Independent outlets do not fully audit those
              figures, but Ecofin repeats the broad scale story and TechCabal's FOLIO benchmark gives an external read
