              audited payments apps, with category-leading friction scores, which is meaningful because FOLIO used
              verified users completing real signup, KYC, funding, and transfer flows. Observable app-store surfaces
              also matter: the iOS consumer app held a 4.5 rating from 88,000 ratings, and the OPay Business app showed
