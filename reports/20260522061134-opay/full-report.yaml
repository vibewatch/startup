  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      OPay’s major downside channels run from regulation and fraud into onboarding friction, trust loss, higher support
      cost, and valuation pressure.
    data:
      nodes:
        - id: n1
          label: CBN / KYC escalation
          detail: Fines, onboarding pauses, tighter identity checks, or remediation orders.
        - id: n2
          label: Account closures / slower onboarding
          detail: Compliance actions reduce conversion and add friction.
        - id: n3
          label: Fraud events / freeze controversies
          detail: Scams, panic withdrawals, freezes, or lawsuits become visible to users.
        - id: n4
          label: Customer trust erosion
          detail: Complaints, support burden, and lower willingness to keep balances on-platform.
        - id: n5
          label: Higher support / compliance cost
          detail: More manual review, appeals, regulator engagement, and remediation work.
        - id: n6
          label: Growth and margin pressure
          detail: Lower customer acquisition efficiency and worse unit economics.
        - id: n7
          label: Valuation compression
          detail: Private-market or IPO narrative reprices downward.
      edges:
        - from: n1
          to: n2
        - from: n1
          to: n5
        - from: n2
          to: n4
        - from: n3
          to: n4
        - from: n3
          to: n5
        - from: n4
          to: n6
        - from: n5
          to: n6
        - from: n6
          to: n7
        - from: n1
          to: n7
          label: if enforcement becomes formal
    claimRefs:
      - CR007
      - CR008
      - CR020
      - CR021
