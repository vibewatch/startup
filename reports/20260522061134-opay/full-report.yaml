  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance
    rows:
      - - Nigeria consumer wallet and transfer layer
        - Wallet funding, bank-account transfers, bill payments, card-linked consumer payment activity
        - Deposit balances, unrelated savings AUM, and unsecured lending balances
        - Consumer user is usually also payer; banks and MMOs supply rails
        - Core OPay daily-use workflow visible on OPay’s public product page and CBN PSP classification
      - - Merchant acceptance and QR payments
        - Merchant checkout, QR acceptance, payment notifications, reconciliation, and settlement workflows
        - Generic e-commerce software or offline inventory tools with no payment role
        - Merchant owner/operator is buyer; customer initiates payment; bank/MMO rails settle
        - Important because merchant digitization is the bridge from P2P scale to B2B and retail monetization
      - - Agent banking and cash-in/cash-out
        - POS cash-in/cash-out, assisted onboarding, transaction facilitation, local liquidity distribution
        - Pure branch-banking operations and unrelated cash logistics
        - Agent proprietor chooses provider; end customers pay transaction fees or implicit spreads
        - Critical for underbanked and low-smartphone segments and for trust in underserved communities
      - - Card and switch infrastructure
        - Domestic and international card schemes, switching, settlement, and interoperability services
        - Core card-manufacturing or unrelated issuer processing with no retail payment use case
        - Banks, schemes, switches, and providers share economics depending on transaction path
        - Matters because OPay sits on regulated rails rather than operating a closed network
      - - Cross-border and remittance receipt
        - Inbound remittance receipt, wallet/account credit, transfer and withdrawal workflows
        - Export finance, trade lending, and unrelated wholesale FX dealing
        - Diaspora sender and local recipient are economic users; IMTOs, banks, and wallets split fees
        - Material adjacency because remittance costs and digital options still shape corridor conversion
      - - Egypt wallet adjacency and Africa fintech TAM
        - Expansion-style wallet, merchant, and payments opportunity outside Nigeria
        - Treating all African fintech revenue as automatically serviceable by OPay
        - Management or investors may frame this as growth optionality rather than current payer base
        - Useful as outer bound only; not a clean substitute for Nigeria serviceable-market sizing
    notes: >-
      Boundaries are intentionally layered. Rows distinguish Nigeria’s current regulated payment workflows from broader
      regional adjacencies so the chapter does not collapse transaction throughput, wallet adoption, and Africa-wide
      fintech TAM into one market number.
