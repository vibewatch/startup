  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory perimeter, identity rules, and legal recourse are the hardest downside path
        blocks:
          - type: paragraph
            body: >-
              OPay’s top risk is not generic fintech volatility; it is concentrated Nigerian regulatory transmission.
              Public evidence shows the company sits squarely inside the CBN and NDIC perimeter, with OPay listed on
              official registries and reported to have been upgraded to national status in 2026. That wider perimeter
              raises the reward, but it also raises the supervisory burden. Adverse evidence already shows how quickly
              that burden can hit operations: news coverage tied past CBN scrutiny to fines, onboarding pauses, and
              closure of non-compliant accounts. Identity rules matter because they attack OPay’s core convenience
              story. Independent coverage and OPay-linked briefings say tier-one and new accounts now need BVN or NIN,
              while the CBN’s own BVN page frames unique identity as fundamental to KYC effectiveness and payment-system
              safety. The legal downside is equally concrete. OPay’s terms reserve wide powers to demand extra
              information, refuse transactions on fraud or AML suspicion, block accounts, recover chargebacks, set off
              balances, and defer settlement. Those controls may be commercially rational, but once they collide with
              weak communication or false positives, they become a direct trust and litigation vector rather than a
              hidden back-office issue.
