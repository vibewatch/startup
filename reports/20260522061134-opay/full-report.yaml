  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and trust bridges
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports OPay as a broad everyday-money product rather than a narrow wallet niche. The
              strongest documented customer segments are underbanked consumers using transfers, bills, airtime, savings,
              cards, and small loans; micro-merchants and SMEs using collection accounts, POS terminals, and merchant
              working-capital features; and agent operators who turn cash into digital value in markets where bank
              branches and ATMs are unreliable. Independent sources consistently tie OPay's reach to financial inclusion
              rather than only to digital-first urban users. Ecofin and Business A.M. both describe the agent network as
              a nationwide distribution moat, and Neobanks.guide goes further by calling that network the key
              cash-to-wallet on-ramp for people who still build trust face-to-face. That matters for OPay's thesis: the
              customer base is not just app installers, but a hybrid base of consumers, merchants, and agents tied
              together by cash-in or cash-out convenience. What remains much weaker is remittance-user evidence. Public
              materials show multi-country operations and international card acceptance, but they do not quantify
              corridor-level remittance adoption or diaspora usage for the Nigeria product.
