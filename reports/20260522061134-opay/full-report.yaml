  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: >-
      IC-style scoring of OPay’s valuation setup as of 2026-05-22, emphasizing the tension between obvious operating
      scale and still-insufficient public disclosure.
    data:
      items:
        - label: Scale / category position
          score: 8
          detail: Nationally meaningful consumer-fintech brand with recurring shareholder re-marks.
        - label: Monetization proof
          score: 4
          detail: Monetization rails are visible, but audited revenue quality is still opaque.
        - label: Disclosure quality
          score: 2
          detail: No public audited standalone financial package or IPO filing.
        - label: Public comp support
          score: 5
          detail: Public fintech multiples support value, but not a carefree premium.
        - label: Regulatory resilience
          score: 3
          detail: Nigeria KYC / onboarding / fraud history still matters to valuation.
        - label: Geographic diversification
          score: 3
          detail: Public evidence remains overwhelmingly Nigeria-centric.
        - label: Margin of safety at $4B
          score: 3
          detail: Limited buffer above Opera’s current mark.
        - label: Overall composite
          value: 4
          score: null
          detail: Research-more / track, not buy, until disclosure catches up.
    approximationNotes: >-
      Scores are analyst judgments on a 1-10 scale synthesising the chapter’s evidence rather than reported company
      metrics.
