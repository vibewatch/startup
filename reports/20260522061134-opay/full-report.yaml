              reviews are ugly, with a 2.9 score on the accessible snapshot and complaints centered on freezes, failed
              debits, low transfer limits, and weak support. More serious trust shocks include Punch's reporting on
              unauthorized-account allegations, BusinessDay and Punch coverage of onboarding pauses and closed
              non-compliant accounts, and TechEconomy's report that OPay obtained court approval to freeze accounts
              across thirty banks after a ₦714 million transaction glitch. Nairametrics also documented panic
              withdrawals after a resurfaced fraud video revived worries about account safety. Current merchant-review
              evidence is less dramatic but still important: even positive reviewers complain about fees and usability
              gaps. Taken together, the adverse record suggests OPay wins customers on convenience and physical reach,
              but trust is still fragile because complaint-resolution quality is not publicly measurable. Before
              underwriting strong customer durability, diligence needs auditable support metrics, real retention
              cohorts, and hard remittance-user data rather than another set of marketing claims.
