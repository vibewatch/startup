      - number: '8.2'
        title: Comparable Set and Multiples Logic
        blocks:
          - type: paragraph
            body: >-
              The right comparable set is mixed by design because no single peer matches OPay’s Nigeria-heavy, low-fee
              wallet-plus-merchant model. The best public reality check comes from sector and listed-fintech multiples
              rather than from any single company clone. Finro’s Q1 2026 dataset shows how dangerous it is to anchor to
              headline averages: broad fintech traded at a 14.5x average EV/revenue multiple but only a 7.6x median,
              while payments averaged 7.7x but the median company traded at 3.6x. That median-versus-average gap matters
              because OPay’s business looks much more like a transaction-heavy, regulation-exposed payments platform
              than like the software-rich outliers that pull averages upward.


              Nubank is useful because it is a large listed digital-finance platform with meaningful scale, but it still
              underlines the disclosure gap rather than solving it. Multiples.vc showed Nubank around $18 billion of LTM
              revenue and ~$62 billion EV, or roughly 3.4x EV/revenue, while CompaniesMarketCap showed a ~$64 billion
              market cap in May 2026. Kaspi’s quoted 1.85x price/sales multiple and 7.3x normalized P/E show how much
              more compressed even a profitable, disclosed super-app can trade in public markets. Paytm, with a ~$7.4
              billion market cap and restored profitability in FY26, shows that public investors can remain skeptical
              even after turnaround evidence. Mercado Pago is directionally relevant on wallet, merchant, and credit
              intensity, but MercadoLibre is an ecommerce-fintech hybrid, so its ~$85 billion market cap is not a clean
              standalone Mercado Pago multiple. Private African peers are the other anchor. Moniepoint’s 2024 round at
              $1 billion-plus and Flutterwave’s 2022 $3 billion-plus round show that billion-dollar private-fintech
              valuations are not exotic in the region, but neither peer removes the core caveat: OPay still lacks
              audited revenue, margin, and balance-sheet disclosure. The comp lesson is therefore not “OPay deserves X
              times sales.” It is that public comps usually clear low- to mid-single-digit revenue multiples on
              disclosed numbers, while opaque late-stage private marks can run ahead of that only when investors believe
              disclosure quality will catch up fast.
