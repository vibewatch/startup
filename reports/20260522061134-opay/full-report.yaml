      - number: '4.4'
        title: The likely issue is not survival capital but valuation-quality and translation risk
        blocks:
          - type: paragraph
            body: >-
              Opera’s disclosed marks imply that OPay’s equity value moved from about $2.75 billion at end-2024 to about
              $3.10 billion at end-2025, while Bloomberg and BusinessDay report a potential late-2026 IPO ambition
              around $4 billion. That trajectory suggests a company seeking market liquidity and valuation
              crystallization rather than emergency rescue financing. Still, public evidence does not disclose OPay’s
              own cash balance, burn rate, or runway, so the exact capital need remains unknowable. The cleanest public
              explanation for IPO timing is therefore strategic: convert private-market scale into public-market
              liquidity, widen capital access, and turn paper marks into bankable value for shareholders such as Opera.


              The macro overlay is crucial because OPay appears overwhelmingly Nigeria-exposed economically even if its
              corporate footprint is broader. World Bank’s April 2026 Nigeria Development Update says macro stability
              has improved but still requires tight policy, exchange-rate flexibility, and resilience to external
              shocks. BusinessDay’s dual-listing critique applies that macro reality directly to OPay: the company earns
              in naira, would report to U.S. investors in dollars, and could see genuine local growth translated into
              weaker or even negative USD optics if the currency devalues. Opera’s own filing reinforces that OPay’s
              valuation is sensitive to macroeconomic conditions in its core markets. In other words, FX is not a side
              note to the investment case; it is part of the valuation mechanism.


              The chapter’s financial verdict is therefore mixed but disciplined. OPay likely has real underlying
              economics because it has sustained massive transaction scale, broadened product monetization beyond free
              consumer transfers, and attracted serious IPO preparation. But public disclosure quality is too weak to
              underwrite revenue quality, margin durability, or capital adequacy with confidence. Core private metrics
              remain missing, some public 2026 revenue reporting appears to misattribute Opera’s numbers to OPay, and
              credit plus complaint-handling exposure could meaningfully change margin quality. The most defensible
              judgment is that OPay looks like a scaled, potentially profitable low-fee financial network with
              meaningful upside, but one whose standalone financial profile remains opaque enough that a cautious
              investor should treat the business as “interesting but not yet fully auditable” until IPO-grade
              disclosures arrive.
