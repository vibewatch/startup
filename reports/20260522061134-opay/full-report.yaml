  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Dimension
      - Bull thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Anchor progression
        - $2.0B in 2021 to ~$2.75B in 2024 to ~$3.1B in 2025 is a credible upward march.
        - The latest mark is an internal shareholder model, not a market-clearing traded price.
        - Audited IPO disclosure that validates the shareholder mark would strengthen the bull case.
      - - Scale narrative
        - User, agent, and transaction-volume narratives imply OPay has genuine national scale.
        - Scale definitions are inconsistent and may not translate cleanly into monetization quality.
        - A KPI glossary plus audited revenue-to-volume bridge would reduce ambiguity.
      - - Public comp support
        - Large fintech and super-app comps prove billion-dollar values are possible for disclosed platforms.
        - Public payment and super-app multiples are generally lower than opaque private-market asks.
        - Clear audited growth and margin evidence could justify premiuming private value over public medians.
      - - Regional private comps
        - Flutterwave and Moniepoint show African fintech can clear $1B-$3B private marks.
        - Neither is a direct proof that OPay deserves $4B today or that public markets will agree.
        - A cleaner peer set with audited OPay metrics would make private-comp transfer more credible.
      - - Nigeria concentration
        - Nigeria is a very large market and the place where OPay is visibly strongest.
        - Nigeria dependence amplifies FX, regulation, and trust shocks in a US-listing context.
        - Geography-level revenue and TPV mix would show whether concentration is easing.
      - - Disclosure quality
        - Opera’s filings provide unusual visibility for a private African fintech.
        - OPay itself still has no public audited standalone revenue, margin, or cash-flow package.
        - Buyability improves materially only when OPay, not just Opera, discloses IPO-grade metrics.
    notes: >-
      The anti-thesis is driven more by disclosure quality and country concentration than by disbelief in OPay’s
      operating scale.
