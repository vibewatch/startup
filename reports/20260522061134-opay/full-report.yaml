chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product Model, and Footprint
        blocks:
          - type: paragraph
            body: >-
              OPay is a payments-led fintech platform that was established in 2018 and first launched its mobile money
              service in Nigeria, with early coverage describing a Lagos-based company built by Opera around a super-app
              thesis. Over time, the public product set narrowed from ride-hailing, delivery, and commerce experiments
              toward a core wallet and merchant-finance stack: transfers, bill payments, airtime and data purchases,
              debit cards, OWealth savings, point-of-sale acquiring, and merchant services. Opera’s 2025 annual report
              describes OPay as a privately held fintech operating across Africa and Asia with payments, transfers,
              savings, lending, agent POS, and merchant acquiring products. The operating center of gravity remains
              Nigeria: OPay’s public communications stress Nigerian financial inclusion, the platform is licensed by the
              Central Bank of Nigeria and insured by the NDIC, and the company reported 17 physical customer centers by
              early 2024. The main identity caveat is headquarters disclosure. Earlier coverage called OPay
              Lagos-headquartered, while 2025-2026 management releases repeatedly describe it as Singapore-based.
              Because the reviewed public record does not resolve whether that reflects a holding-company move, a
              dual-headquarters model, or only executive relocation, later chapters should treat Nigeria as the
              operating core and Singapore as the latest disclosed global base rather than assuming one uncontested
              headquarters statement.
