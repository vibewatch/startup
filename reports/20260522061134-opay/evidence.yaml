evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership-governance-disclosure
    missingEvidence: A full board list, committee structure, and complete named executive roster for OPay.
    whyItMatters: Governance, succession, and decision-rights analysis remain incomplete without a full board and management map.
    diligencePath: Request the latest board deck, cap table governance schedule, and corporate-org chart from management.
    relatedQuestionRefs:
      - QO009
      - QO026
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-secondary-history
    missingEvidence: Current cap table, investor ownership percentages beyond Opera, and any secondary-sale history after 2021.
    whyItMatters: >-
      Ownership concentration, liquidation preference exposure, and true IPO-readiness cannot be judged from public
      round headlines alone.
    diligencePath: >-
      Obtain the latest cap table, shareholder registry, and financing documents including side letters and secondary
      transactions.
    relatedQuestionRefs:
      - QO013
      - QO014
      - QO028
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: scale-metric-definitions
    missingEvidence: >-
      A management-certified reconciliation of users, DAU, MAU, and monthly transaction-volume definitions across
      2025-2026 disclosures.
    whyItMatters: >-
      Different denominator choices could materially change any market-share, monetization, or valuation narrative built
      on scale.
    diligencePath: Ask OPay for a KPI dictionary plus the last four quarters of board-approved operating metrics.
    relatedQuestionRefs:
      - QO016
      - QO017
      - QO027
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Revenue, profitability, headcount, and office-footprint disclosures current enough to reuse as diligence ground
      truth.
    whyItMatters: >-
      These are core maturity metrics for underwriting unit economics, management depth, and readiness for public
      markets.
    diligencePath: >-
      Request audited financial statements, current management accounts, monthly business review packs, and an updated
      org chart.
    relatedQuestionRefs:
      - QO017
      - QO027
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: country-footprint-confirmation
    missingEvidence: >-
      Primary evidence confirming whether Kenya and Pakistan are active operating markets versus historical expansion
      targets or exploratory efforts.
    whyItMatters: Country-footprint inflation can overstate TAM, regulatory complexity, and execution readiness.
    diligencePath: Request the legal-entity list, current country-by-country active-user dashboard, and local licensing matrix.
    relatedQuestionRefs:
      - QO021
      - QO022
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: sam-som-gap
    missingEvidence: >-
      A management-grade bridge from Nigeria rail throughput and public market forecasts to OPay’s actual serviceable
      segments, take rates, and near-term capture assumptions.
    whyItMatters: >-
      Without a segment-level capture model, transaction scale can be mistaken for addressable revenue and the
      investment case can overstate monetization headroom.
    diligencePath: >-
      Request OPay’s internal market-sizing workbook broken out by consumers, merchants, agents, SMEs, remittances, and
      any Egypt or broader Africa adjacency assumptions.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: tam-bridge
    missingEvidence: >-
      A normalized reconciliation of CBN throughput statistics, BlueWeave’s Nigeria market-value forecast, AFI’s Africa
      e-payments estimate, and BCG’s Africa fintech TAM.
    whyItMatters: >-
      Preserving contradictory estimates is better than forcing one number, but valuation work still needs an
      apples-to-apples bridge between throughput, market value, and provider revenue.
    diligencePath: >-
      Rebuild the sizing stack by mapping each source to unit, geography, time period, included flows, and explicit
      revenue assumptions, then compare against management’s own planning model.
    relatedQuestionRefs:
      - QM006
      - QM008
      - QM026
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: budget-owner-opacity
    missingEvidence: >-
      Publicly verifiable examples showing who signs and pays for OPay-class merchant, SME, and agent contracts by
      segment.
    whyItMatters: >-
      Market attractiveness depends on whether economics sit with consumer fees, merchant acceptance, agent commissions,
      SME workflow budgets, or infrastructure counterparties.
    diligencePath: >-
      Ask management for anonymized recent deal examples showing signer title, budget owner, unit economics, and whether
      the flow was direct, partner-led, or agent-led.
    relatedQuestionRefs:
      - QM027
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: device-constraint
    missingEvidence: >-
      A harmonized 2023-2024 Nigeria device-ownership and smartphone-use dataset that reconciles the 93% and 99%
      phone-ownership summaries and clarifies true smartphone penetration among target users.
    whyItMatters: >-
      App-led adoption assumptions are sensitive to device capability, and conflicting phone-ownership summaries can
      distort the case for wallet-first versus agent-assisted growth.
    diligencePath: >-
      Pull the underlying EFInA/A2F cross-tabs and compare them with GSMA and operator data by geography, gender, and
      urban-rural segment.
    relatedQuestionRefs:
      - QM016
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: egypt-adjacency
    missingEvidence: >-
      Direct evidence that OPay is actively building or operating against the Egyptian wallet opportunity rather than
      merely having historical expansion intent.
    whyItMatters: >-
      Egypt is a useful adjacency lens for wallet-scale economics, but it should not influence OPay valuation materially
      unless there is current execution evidence.
    diligencePath: >-
      Request current country roadmap materials, licensing status, local hiring plans, or partner announcements that tie
      OPay specifically to Egypt.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: provider-market-share-breakout
    missingEvidence: >-
      Provider-level 2025/2026 transaction value, active-user, and merchant-share disclosures for OPay, PalmPay,
      Moniepoint, MTN, Airtel, and bank apps.
    whyItMatters: >-
      Category totals and app rankings do not reveal who owns which share of wallet, merchant, or agent volume by
      workflow.
    diligencePath: >-
      Request NIBSS breakouts, company investor materials, or audited regulatory disclosures that separate users,
      volumes, and merchant activity by provider.
    relatedQuestionRefs:
      - QP027
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: merchant-pricing-transparency
    missingEvidence: >-
      Public MDR, settlement timing, discount schedules, and device economics for OPay, PalmPay, Moniepoint, and
      Quickteller merchant products.
    whyItMatters: >-
      Without contract-level pricing detail it is difficult to compare gross-margin pressure and true merchant switching
      economics versus Flutterwave and Paystack.
    diligencePath: >-
      Collect live merchant sign-up flows, contracts, or sales decks from each provider and compare MDR, settlement,
      chargeback, and terminal economics line by line.
    relatedQuestionRefs:
      - QP028
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: minor
    topic: bank-digital-conversion
    missingEvidence: Monthly active mobile-banking users and payment mix for Access, UBA, and GTBank.
    whyItMatters: >-
      Bank substitute pressure is obvious qualitatively but still hard to size precisely without active-user and
      transaction-split data.
    diligencePath: >-
      Review investor decks, analyst calls, or management commentary for disclosed digital actives and payment mix by
      channel.
    relatedQuestionRefs:
      - QP022
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: minor
    topic: quickteller-current-momentum
    missingEvidence: Recent Quickteller consumer active-user, merchant, or transaction figures.
    whyItMatters: >-
      It is difficult to distinguish legacy rail importance from current consumer-app momentum without fresher operating
      metrics.
    diligencePath: Obtain Interswitch investor or media disclosures that quantify Quickteller’s current usage and merchant relevance.
    relatedQuestionRefs:
      - QP012
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Audited standalone OPay revenue, gross profit, and segment mix by wallet, merchant, cards, lending, and wealth.
    whyItMatters: >-
      Without audited segment disclosure, it is impossible to convert TPV and product breadth into a defensible
      take-rate and margin model.
    diligencePath: Request the latest audited management accounts and a revenue bridge from TPV to net revenue by stream.
    relatedQuestionRefs:
      - QI007
      - QI008
      - QI025
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cash-burn
    missingEvidence: Cash balance, monthly burn, runway, and any near-term financing covenant or board trigger.
    whyItMatters: IPO readiness and capital-needs analysis remain speculative until liquidity and burn are known.
    diligencePath: Request monthly cash bridge, board materials on runway, and any financing or contingency plans.
    relatedQuestionRefs:
      - QI014
      - QI015
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: lending-book
    missingEvidence: >-
      Loan-book size, default rate, charge-offs, provisioning, vintage curves, and funding structure for OPay Credit or
      OKash.
    whyItMatters: Credit exposure can turn a low-margin payments story into a balance-sheet risk story very quickly.
    diligencePath: >-
      Obtain credit-risk packs with origination volumes, delinquency buckets, write-offs, recoveries, and capital
      allocation by product.
    relatedQuestionRefs:
      - QI016
