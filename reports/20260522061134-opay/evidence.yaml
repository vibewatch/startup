    diligencePath: >-
      Request treasury policy, average customer balances, OWealth fund statements, and revenue recognition policy for
      wealth products.
    relatedQuestionRefs:
      - QI018
      - QI025
    relatedTableRefs:
      - TI005
  - type: private-evidence-only
    severity: material
    topic: distribution-unit-economics
    missingEvidence: >-
      Agent commission schedule, merchant-acquiring net take rate after interchange/network costs, and customer-support
