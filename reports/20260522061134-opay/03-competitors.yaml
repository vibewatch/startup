tables:
- id: TP001
  title: Competitor roster
  columns:
  - Competitor
  - Category
  - Scale / funding signal
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - OPay
    - Wallet / consumer transfer / merchant services
    - 2021 $2B round; mass-market Nigeria wallet brand
    - Consumers, micro-merchants, agent-assisted users
    - Free-feeling transfers, cards, bill pay, broad everyday familiarity
    - Public merchant pricing and enterprise/cross-border detail are thinner than PSP peers
  - - PalmPay
    - Wallet / super-app / agent ecosystem
    - 35M users in Nigeria; 1.2M agents and merchants reported
    - Consumers, micro-merchants, first-finance-app users
    - Strong clarity and trust signals with dense assisted distribution
    - Enterprise depth and transparent merchant pricing remain less visible publicly
  - - Moniepoint
    - Merchant acquiring / business banking / agent banking
    - 2024 $110M round at $1B+ valuation; 800M+ transactions and $17B+ monthly TPV claimed
    - SMEs, agents, merchants
    - Business accounts, cards, support, and operations tooling
    - Less obviously dominant than OPay in pure consumer wallet habit
  - - Flutterwave
    - Enterprise PSP / checkout / payouts
    - 2022 $3B valuation; 900K businesses and 34-country reach reported
    - Enterprises, startups, cross-border merchants
    - APIs, online checkout, payouts, invoices, broad payment-method support
    - Offline consumer distribution is weaker than wallet and bank-led rivals
  - - Paystack
    - Developer-first PSP / checkout / terminals
    - Stripe acquired Paystack for $200M+; ~60K customers at acquisition
    - SMEs, developers, ecommerce merchants
    - Clean docs, high transaction-success narrative, transparent pricing
    - Smaller offline and agent footprint than OPay or Moniepoint
  - - Interswitch / Quickteller
    - Incumbent rails / consumer utility payments
    - Deep African payments infrastructure with consumer and enterprise reach
    - Banks, enterprises, bill-pay users
    - Infrastructure depth, legacy trust, broad rails footprint
    - Less visible current consumer-app momentum than newer wallets
  - - MTN MoMo
    - Telco mobile money / agent cash-in-out
    - Agent-led model with cash-in, cash-out, bill-pay and merchant QR tools
    - Mass-market and agent-assisted users, merchants
    - Telco distribution and assisted transactions
    - Public Nigeria consumer product detail is thinner than wallet leaders
  - - Airtel SmartCash / Airtel Money
    - Telco / PSB substitute
    - Airtel Africa reports 54.1M customers, 2.4M agents, $196B TPV in 2025/26
    - Unbanked users, agents, merchants
    - Airtel distribution, agents, merchant payments, loans and IMTs
    - Nigeria-specific wallet detail is less visible than Airtel group disclosure
  - - Access Bank
    - Bank-account substitute
    - AccessMore app bundles account opening, FX, QR, bill pay and rewards
    - Salary-account and current-account users
    - Primary account relationship plus broad banking bundle
    - User experience is less single-purpose than a wallet-first app
  - - UBA
    - Bank-account substitute
    - UBA app combines transfers, bills, accounts, loans and stronger authentication
    - Banked retail and SME users
    - Deposit-led relationship and security-heavy transaction controls
    - Higher-value authentication can add friction versus instant-wallet flows
  - - GTBank
    - Bank-account substitute / mobile money / agent banking
    - GTWorld plus GTExpress combines mobile banking, mobile money and agents
    - Banked retail, underserved, and agent-assisted users
    - Account, loan, bill-pay and agent stack in one institution
    - Not positioned as the lowest-friction consumer wallet brand
  - - Wave
    - West Africa low-fee substitute benchmark
    - 20M MAU, 150K+ agents, 1% send fee and 2025 debt round reported
    - Francophone West Africa mobile-money users
    - Very low-fee model with strong agent reach
    - Not a Nigeria-scale enterprise PSP and not the current default for Nigerian users
  notes: Scale signals mix company pages and reputable reporting. Rows compare the most relevant Nigeria
    and West Africa alternatives by use case; some figures are historical funding anchors rather than
    current market share.
