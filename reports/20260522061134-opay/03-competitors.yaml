- id: TP004
  title: Win-loss criteria table
  columns:
  - Criterion
  - OPay wins when
  - OPay loses when
  - Leading rival / substitute
  - Evidence
  rows:
  - - Fast consumer signup-to-transfer
    - User prioritises speed, familiarity, and free-feeling transfers
    - User prioritises higher perceived trust or clearer instructions
    - PalmPay
    - Independent ranking shows OPay leads on friction while PalmPay leads on clarity and closes trust
      gap
  - - Daily bill pay, airtime, debit-card usage
    - Buyer wants one wallet for common everyday payments
    - Buyer prefers to keep the payment flow inside a primary bank account
    - Access / UBA / GTBank
    - Banks already bundle bills, transfers, and cards inside existing account relationships
  - - SME POS and operating stack
    - Merchant mostly needs payment acceptance without heavy back-office needs
    - Merchant needs business accounts, constant support, cards, and operations tooling
    - Moniepoint
    - Moniepoint public banking page is designed around business operations rather than just wallet activity
  - - Online checkout and developer-led integration
    - Merchant only needs a simple domestic collection flow
    - Merchant needs documented APIs, global payment methods, payouts, or cross-border collections
    - Flutterwave / Paystack
    - Flutterwave and Paystack publish broader API, checkout, and pricing detail than OPay
  - - Agent-led cash-in/cash-out
    - OPay brand awareness and agent familiarity are already strong locally
    - Telco or competing agent networks matter more than app brand
    - MTN MoMo / Airtel SmartCash / Moniepoint
    - Telco and business-banking rivals offer agent commissions, QR, and assisted transactions
  - - Price-sensitive West Africa wallet benchmark
    - Nigerian users accept near-free transfer economics from wallet leaders
    - Customers compare against ultra-low-fee mobile money norms
    - Wave
    - Wave has free cash-in/out and 1% sends, a sharper consumer price signal than Nigerian peers disclose
  - - Trust and compliance-sensitive choice
    - Transfer speed is the dominant buying criterion
    - Regulatory scrutiny, authentication, or social proof matter most
    - PalmPay / banks
    - OPay tops friction but trust is its weakest audited dimension, while banks compete on security and
      compliance familiarity
  notes: Rows synthesise observed win and loss patterns from official product pages and independent reporting.
    They are workflow judgments, not audited market-share statements.
