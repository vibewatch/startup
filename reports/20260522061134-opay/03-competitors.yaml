- id: TP003
  title: Pricing / business model comparison
  columns:
  - Provider
  - Public price signal
  - Business model / monetization
  - Distribution / GTM
  - Implication for OPay
  rows:
  - - OPay
    - Free transfers to bank accounts; zero maintenance fee for active cards
    - Consumer wallet engagement, payment frequency, cards, savings, and merchant services
    - Mass-market app plus agents and service centres
    - Sets the low-fee consumer baseline but leaves merchant economics less transparent
  - - PalmPay
    - Public user pricing is less explicit than PSP peers; savings and cashback narrative is prominent
    - Consumer engagement, savings, payments, and ecosystem usage
    - App-led acquisition plus dense agent and merchant network
    - Competes directly with OPay on daily-use wallet habit and trust perception
  - - Moniepoint
    - Merchant pricing is not as publicly explicit as PSP specialists
    - Business banking, payments, cards, support, and merchant monetization
    - Offline SME sales, service, and agent relationships
    - Pressure point for OPay where merchants want a full operating stack
  - - Flutterwave
    - 2% local collections; 4.8% international; ₦10/₦25/₦50 transfer fees
    - Enterprise collections, payouts, ecommerce and API monetization
    - API-led sales to businesses, startups, and global merchants
    - Highlights OPay's weaker public enterprise and cross-border proposition
  - - Paystack
    - 1.5% + ₦100 local capped at ₦2,000; 3.9% + ₦100 international; terminal pricing published
    - Checkout, transfers, terminals, and developer-led merchant monetization
    - Self-serve and developer-first merchant acquisition
    - Strong online-merchant alternative where OPay lacks equal pricing/docs transparency
  - - Banks (Access / UBA / GTBank)
    - Digital-payment revenue accrues from transfer fees and account-led usage at scale
    - Deposit relationships, fees, cross-sell, lending, and card economics
    - Existing salary/current-account base and branch-led trust
    - Banks can defend core transfers without needing a wallet conversion event
  - - MTN / Airtel mobile money
    - Agent and merchant economics dominate; exact Nigeria consumer pricing is less transparent publicly
    - Telco-led wallet, bill-pay, merchant, and agent commissions
    - SIM distribution, agents, and kiosks
    - Adds pressure in assisted-cash segments rather than enterprise PSP
  - - Wave
    - Free deposits, withdrawals, and bill pay; 1% sends
    - Low-fee wallet with business-paid bill fees and scale-led economics
    - Agents plus simple mobile-money workflow
    - Shows how far pricing pressure can go when a wallet wins habit and reach
  notes: Only some competitors publish merchant pricing cleanly. Where public list pricing is absent,
    the row records disclosed fee signals and the implied monetization logic instead of guessing take
    rates.
