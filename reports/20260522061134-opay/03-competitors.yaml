  - CP038
  - CP039
  - CP042
- calloutType: risk
  title: Merchant economics are OPay's biggest flank
  body: Moniepoint is better aligned with SME operations and support, while Flutterwave and Paystack publish
    clearer enterprise pricing and API depth, leaving OPay with the weakest public positioning in the
    most monetizable parts of the stack.
  claimRefs:
  - CP037
  - CP038
  - CP044
- calloutType: risk
  title: Trust and oversight can reverse low-friction growth
