  evidenceGaps:
  - type: missing-source
    severity: material
    topic: provider-market-share-breakout
    missingEvidence: Provider-level 2025/2026 transaction value, active-user, and merchant-share disclosures
      for OPay, PalmPay, Moniepoint, MTN, Airtel, and bank apps.
    whyItMatters: Category totals and app rankings do not reveal who owns which share of wallet, merchant,
      or agent volume by workflow.
    diligencePath: Request NIBSS breakouts, company investor materials, or audited regulatory disclosures
      that separate users, volumes, and merchant activity by provider.
    relatedQuestionRefs:
    - QP027
    relatedTableRefs:
    - TP001
  - type: missing-source
    severity: material
    topic: merchant-pricing-transparency
    missingEvidence: Public MDR, settlement timing, discount schedules, and device economics for OPay,
      PalmPay, Moniepoint, and Quickteller merchant products.
    whyItMatters: Without contract-level pricing detail it is difficult to compare gross-margin pressure
      and true merchant switching economics versus Flutterwave and Paystack.
    diligencePath: Collect live merchant sign-up flows, contracts, or sales decks from each provider and
      compare MDR, settlement, chargeback, and terminal economics line by line.
    relatedQuestionRefs:
    - QP028
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: minor
    topic: bank-digital-conversion
    missingEvidence: Monthly active mobile-banking users and payment mix for Access, UBA, and GTBank.
    whyItMatters: Bank substitute pressure is obvious qualitatively but still hard to size precisely without
      active-user and transaction-split data.
    diligencePath: Review investor decks, analyst calls, or management commentary for disclosed digital
      actives and payment mix by channel.
    relatedQuestionRefs:
    - QP022
    relatedTableRefs:
    - TP002
  - type: missing-source
    severity: minor
    topic: quickteller-current-momentum
    missingEvidence: Recent Quickteller consumer active-user, merchant, or transaction figures.
    whyItMatters: It is difficult to distinguish legacy rail importance from current consumer-app momentum
      without fresher operating metrics.
    diligencePath: Obtain Interswitch investor or media disclosures that quantify Quickteller’s current
      usage and merchant relevance.
    relatedQuestionRefs:
    - QP012
    relatedTableRefs:
