- id: momentum-regulation-and-share-caveats
  title: Momentum, Regulation, and Share Caveats
  body: |-
    Momentum is real but easy to overstate. Nigeria's licensed mobile money operators processed ₦71.5 trillion in 2024, up 53.4% year on year, which confirms that the category is still expanding quickly. But that is sector volume, not OPay share. The independent FOLIO ranking is useful precisely because it adds product nuance: OPay led the audited payments-app set overall and dominated on friction, yet trust was its weakest dimension; PalmPay ranked second and scored even better on clarity. Those results suggest that OPay's strongest edge is speed and familiarity, while its trust lead is not settled.

    Regulation adds the harder downside. The 2024 onboarding freeze showed that compliance issues can interrupt growth, and the 2026 national-status upgrade for firms like OPay and Moniepoint came with heavier supervisory expectations rather than lighter rules. Meanwhile, banks remain financially serious competitors, earning ₦514.82 billion from e-payments in the first nine months of 2025 alone. The sharp conclusion is that OPay is one of Nigeria's strongest consumer payments brands, but its moat is narrower than a headline user number suggests: it is strongest in wallet habit, weaker in enterprise PSP and bank-linked workflows, and structurally exposed to trust, regulation, and price pressure.
