  title: OPay is a category leader, not a category monopolist
  body: The strongest interpretation of the evidence is that OPay leads Nigeria's consumer payments habit
    loop, but different rivals own the merchant, enterprise, bank-account, and low-fee substitute layers
    that matter for long-term monetization.
  claimRefs:
