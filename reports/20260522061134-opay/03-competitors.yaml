- id: pricing-business-model-and-switching
  title: Pricing, Business Model, and Switching Criteria
  body: |-
    Pricing transparency draws a sharp line through the field. Flutterwave and Paystack publish merchant economics openly: Flutterwave posts 2% local collections and 4.8% international pricing in Nigeria plus transfer fees, while Paystack posts 1.5% + ₦100 local pricing capped at ₦2,000, 3.9% + ₦100 international card pricing, and terminal costs. Wave is even clearer, with free deposits, withdrawals, and bill pay plus 1% person-to-person sends. OPay's public message is different. It stresses free bank transfers, bill payments, cards, and savings rather than the same level of merchant-pricing detail. PalmPay, Moniepoint, and Quickteller are similarly thinner on public list pricing, which makes exact take-rate comparison difficult.

    That matters for win-loss patterns. OPay wins when the buyer wants the fastest everyday transfer flow, low visible fees, and broad familiarity in consumer payments. It loses when merchants want full business banking and offline support, where Moniepoint is stronger, or when online businesses need documented APIs, cross-border collections, and explicit settlement economics, where Flutterwave and Paystack are better matches. Margin pressure comes from both directions: low-fee wallets teach users to expect near-free transfers, while banks still monetize the same flows at scale.
