chapter:
  number: 3
  title: Competitors
  summary: 'OPay is strongest where Nigerian users want a fast, familiar, low-fee wallet for transfers
    and bills, but the competitive map fragments by job: PalmPay contests mass-market wallet usage, Moniepoint
    is stronger in merchant and agent banking, Flutterwave and Paystack own enterprise and cross-border
    checkout, banks retain deposit-linked substitutes, and Wave shows the low-fee benchmark. OPay''s main
    disadvantages are thinner public merchant pricing, weaker enterprise PSP reach, and persistent trust,
    regulatory, and margin pressure.'
sections:
- id: landscape-by-job
  title: Landscape by Job to Be Done
  body: |-
    OPay's competitive landscape should be separated by job-to-be-done rather than treated as one generic fintech market. In Nigeria, the same payment problem can be solved by wallet-first mobile money operators like OPay and PalmPay, merchant and agent-banking platforms like Moniepoint, enterprise PSPs and checkout APIs like Flutterwave and Paystack, incumbent rails like Interswitch and Quickteller, telco-linked money models like MTN MoMo and Airtel SmartCash, or deposit-account banks like Access, UBA, and GTBank. The CBN register matters because it shows that the regulated field is both crowded and functionally mixed: OPay and PalmPay sit inside the MMO set, while Interswitch, VTNetwork, and Airtel-linked entities anchor adjacent payment categories.

    That means OPay is not racing one comparator across one scoreboard. It is a consumer-wallet leader inside a broader stack where different rivals own different wedges of the value chain. Interswitch and Quickteller still matter because they remain part of the incumbent payments plumbing and utility-payment habit, even if they do not generate the same app-level buzz as OPay or PalmPay. The biggest market-share caveat follows from that structure: public licence lists and category totals do not cleanly convert into provider-by-provider share, so the chapter treats competition by use case instead of implying a single winner-take-all leaderboard.
