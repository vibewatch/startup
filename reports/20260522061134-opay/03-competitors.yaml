- id: capability-distribution-and-substitutes
  title: Capability, Distribution, and Substitute Pressure
  body: |-
    PalmPay is OPay's closest mass-market consumer rival because its public growth narrative is about everyday transaction habit, dense agent and merchant presence, and a product experience that users describe as unusually clear and increasingly trusted. Moniepoint attacks from a different angle. Its public surface is built around business accounts, cards, support, and merchant operations, which makes it a stronger fit for SME and agent-banking workflows than for pure wallet-led consumer transfers. MTN MoMo and Airtel-linked SmartCash show a third model where local agents, QR, bill pay, and telco distribution create assisted-cash advantages that are hard for an app-only proposition to replicate.

    Bank substitutes are the fourth force. AccessMore, UBA Mobile, and GTWorld all bundle transfers, bills, security, account opening, loans, and, in GTBank's case, agent banking inside primary bank relationships. For formally banked users, that reduces the need to move a salary or savings relationship into a separate wallet. Wave is not a current Nigeria-scale peer, but it is the most relevant West Africa substitute benchmark because it pairs very low pricing with large agent reach. Its model shows how much price pressure a scaled wallet can create when distribution and daily habit line up.
