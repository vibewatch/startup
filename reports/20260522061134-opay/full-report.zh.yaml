      - number: '3.2'
        title: 能力、分发与替代压力
        blocks:
          - type: paragraph
            body: >-
              PalmPay 是 OPay 最接近的大众消费者对手，因为它的公开增长叙事围绕日常交易习惯、密集代理和商户存在，以及用户认为异常清晰且越来越可信的产品体验。 Moniepoint
              从另一个角度进攻。它的公开表面围绕商业账户、卡、支持和商户运营搭建，因此比纯钱包驱动的消费者转账更适合 SME 和代理银行工作流。 MTN MoMo 和 Airtel 相关 SmartCash
              展示了第三种模型：本地代理、QR、缴费和电信分发创造了辅助现金优势，纯 App 方案很难复制。


              银行替代品是第四股力量。AccessMore、UBA Mobile 和 GTWorld 都把转账、缴费、安全、开户、贷款，以及 GTBank 案例中的代理银行，打包进主银行关系。
              对已有正式银行账户的用户，这降低了把薪资或储蓄关系迁入单独钱包的必要性。Wave 不是当前尼日利亚大规模同业，但它是最相关的西非替代标杆，
              因为它把极低定价与庞大代理覆盖结合起来。其模型说明，当分发和日常习惯对齐时，一个规模化钱包能制造多大价格压力。
