  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: OPay 的主要下行风险路径始于监管和欺诈，随后传导到开户摩擦、用户信任流失、客服成本上升和估值承压。
    data:
      nodes:
        - id: n1
          label: CBN / KYC 加码
          detail: 罚款、暂停开户、更严身份核验或整改令。
        - id: n2
          label: 账户关闭 / 开户放慢
          detail: 合规动作拉低转化，并增加摩擦。
        - id: n3
          label: 欺诈事件 / 账户冻结争议
          detail: 诈骗、恐慌性提现、冻结或诉讼进入用户视野。
        - id: n4
          label: 客户信任流失
          detail: 投诉、客服负担上升，用户把余额留在平台上的意愿下降。
        - id: n5
          label: 客服 / 合规成本上升
          detail: 更多人工审核、申诉、监管沟通和整改工作。
        - id: n6
          label: 增长和利润率承压
          detail: 获客效率降低，单位经济模型变差。
        - id: n7
          label: 估值压缩
          detail: 私募市场或 IPO 叙事向下重估。
      edges:
        - from: n1
          to: n2
        - from: n1
          to: n5
        - from: n2
          to: n4
        - from: n3
          to: n4
        - from: n3
          to: n5
        - from: n4
          to: n6
        - from: n5
          to: n6
        - from: n6
          to: n7
        - from: n1
          to: n7
          label: 若执法正式落地
    claimRefs:
