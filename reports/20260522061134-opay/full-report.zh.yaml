      - number: '1.4'
        title: 里程碑、扩张路径与不利监管信号
        blocks:
          - type: paragraph
            body: >-
              里程碑记录呈现出一家快速放量、多次转向、如今试图制度化的公司。OPay 于 2018 年在尼日利亚上线，2019 年先后融资 $50 million 和 $120
              million，最初推进更宽的超级应用策略，包含网约车、外卖、物流和电商。到 2020 年，产品叙事已转向以支付为耐久核心，尽管管理层仍讨论向 Kenya、Ghana、South Africa
              等市场扩张。2021 年 8 月 C 轮把资金指定给埃及和更广泛的 Middle East，当前申报也称 OPay 业务横跨非洲和亚洲； 但已审阅公开记录无法清晰确认其当前在 Pakistan 或 Kenya
              仍有运营足迹。尼日利亚仍是唯一证据充分的大规模市场。公司监管姿态在 2024-2026 年也收紧。 Nairametrics 报道称，CBN 2024 年因 KYC 不合规分别罚 OPay 和
              Moniepoint N1 billion；Nairametrics 和 BusinessDay 均报道称， OPay 于 2026
              年获得全国牌照地位，同时面临更高资本、合规和实体存在要求。法律报道带来更尖锐的不利边缘：在一桩 2024 年事项中，OPay 因 ₦714 million 系统故障取得法院命令冻结客户账户；另一案中，Asaba
              的 Federal High Court 因 OPay 未经司法授权冻结账户，判令其支付赔偿。 合在一起看，欺诈控制、账户限制和投诉处理不是外围运营问题，而是核心尽调主题。
