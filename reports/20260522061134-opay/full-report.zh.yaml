  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 决策流把 OPay 的运营规模、Opera 股东估值锚、披露短板、尼日利亚 / 合规风险与最终建议串起来。
    data:
      nodes:
        - id: n1
          label: 运营规模确实存在
          detail: 2021 年融资轮，加上后续用户 / 交易量叙事，支撑真实业务价值。
        - id: n2
          label: 最佳公开估值锚：~$3.1B
          detail: Opera 2025 年对 9.5% 持股的账面价值，是目前最干净的估值标记。
        - id: n3
          label: 披露缺口仍大
          detail: 没有公开、经审计的独立收入、利润率或现金流资料包。
        - id: n4
          label: 尼日利亚 / 合规风险仍在
          detail: 外汇、KYC、欺诈、账户冻结和信任问题，都可能抬高折现率。
        - id: n5
          label: $4B IPO 传闻属于溢价情景
          detail: 比 Opera 估值标记高约 29%，前提是披露能跟上。
        - id: n6
          label: 建议：继续研究 / 观察
          detail: 接近 Opera 标记更合理；没有 IPO 级证据时，$4B 偏高。
        - id: n7
          label: 上调触发条件
          detail: 经审计指标、干净的监管记录，以及透明的股权结构经济性。
      edges:
        - from: n1
          to: n6
          label: 支撑关注
        - from: n2
          to: n6
          label: 设定合理锚点
        - from: n3
          to: n6
          label: 阻断买入建议
        - from: n4
          to: n6
          label: 抬高风险
        - from: n5
          to: n6
          label: 让价格偏高
        - from: n6
          to: n7
          label: 上调条件
    approximationNotes: null
    claimRefs:
      - CV005
      - CV010
      - CV015
      - CV023
      - CV024
      - CV047
      - CV048
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 以百万美元计的估值锚点对比，覆盖 OPay 2021 年定价融资轮、Opera 推导出的 2024 和 2025 估值标记、据报道的 2026 IPO 目标，以及本章的基准和悲观参考点。
    data:
      items:
        - label: 2021 年 Series C 轮
          value: 2000
