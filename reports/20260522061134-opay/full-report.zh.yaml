      - CV010
      - CV041
      - CV043
      - CV044
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: OPay 悲观、基准和乐观估值区间（十亿美元）。经审计披露一旦验证或削弱当前叙事，投资测算会迅速改写。
    data:
      items:
        - label: 悲观情景
          low: 1.8
          value: 2.2
          high: 2.6
          unit: $B
        - label: 基准情景
          low: 2.8
          value: 3.2
          high: 3.6
          unit: $B
        - label: 乐观情景
          low: 3.8
          value: 4.2
          high: 4.6
          unit: $B
    approximationNotes: 情景区间是判断区间，不是管理层指引。它们用公开估值锚、可比公司估值约束、披露质量和已识别下行通道交叉校准。
    claimRefs:
      - CV041
      - CV042
      - CV043
      - CV044
      - CV045
      - CV046
      - CV048
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 截至 2026-05-22，对 OPay 估值格局做投委会风格评分，重点看已显现运营规模与仍不足的公开披露之间的张力。
    data:
      items:
        - label: 规模 / 品类地位
          score: 8
          detail: 在全国有分量的消费者金融科技品牌，股东多次给出重估标记。
        - label: 变现证明
          score: 4
          detail: 变现路径看得见，但经审计收入质量仍不透明。
        - label: 披露质量
          score: 2
          detail: 没有公开、经审计的独立财务资料包，也没有 IPO 申报文件。
        - label: 公开可比公司支撑
          score: 5
          detail: 公开金融科技倍数支撑估值，但不足以支撑随意给溢价。
        - label: 监管韧性
          score: 3
          detail: 尼日利亚 KYC / 开户 / 欺诈历史仍会影响估值。
        - label: 地域多元化
          score: 3
          detail: 公开证据仍高度集中在尼日利亚。
        - label: $4B 的安全边际
          score: 3
          detail: 相对 Opera 当前标记，缓冲有限。
        - label: 综合评分
          value: 4
          score: null
          detail: 披露跟上之前，结论是继续研究 / 观察，不是买入。
    approximationNotes: 评分是分析师按 1-10 分尺度综合本章证据后的判断，不是公司披露指标。
    claimRefs:
      - CV016
      - CV018
      - CV023
      - CV024
      - CV039
      - CV040
      - CV047
