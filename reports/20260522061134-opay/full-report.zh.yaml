      - number: '2.2'
        title: 规模测算视角、采用证据与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              从吞吐量看，这个市场无疑很大，但公开规模记录被单位、范围和估值议程切碎。CBN 自己的 2024 年上半年电子支付统计已显示，总电子支付交易 22.42 billion 笔、金额 ₦1.559
              quadrillion；仅 MMO 就有 7.18 billion 笔、金额 ₦78.2 trillion，POS 则为 6.40 billion 笔、 ₦85.9
              trillion。这些数字最适合被理解为已观测到的轨道活动，而不是收入 TAM。BlueWeave 则发布类似收入口径的尼日利亚数字支付市场估计： 2024 年 $9.66 billion，到 2031 年增至
              $28.13 billion，CAGR 为 16.5%。覆盖全非洲的战略机构口径更宽：AFI 引用非洲数字支付市场预计到 2025 年达到约 $40 billion，BCG 则预计非洲金融科技收入到 2030
              年约 $65 billion，并把支付定义为主导增长引擎。这些数字都有用， 但描述的并不是同一个市场量。


              正确分析方法是保留矛盾，而不是抹平矛盾。CBN 的数字描述支付系统使用量和渠道吞吐量。BlueWeave 描述尼日利亚市场价值预测。AFI 和 BCG 描述更宽的大陆收入池或结构性行业机会。
              即便在尼日利亚特定视角内，证据也没有完全统一：BlueWeave 称 2024 年电子支付达到 ₦1.07 quadrillion，而 CBN 2024 年上半年表单独就已超过这一水平，
              说明定义、渠道子集或时间切片不同。来自埃及的相邻证据进一步说明，钱包密集型数字支付生态可以快速放量——当地移动钱包交易到 2025 年底达到约 EGP 4 trillion，钱包数 60 million——但除非
              OPay 埃及扩张在运营上变得重要，否则这种相邻性只与 OPay 部分相关。用于估值时，本章因此采用多个受约束视角： 已观测的尼日利亚吞吐量、类似收入的尼日利亚市场预测、全非洲支付 / 金融科技 TAM
              框架，以及埃及钱包采用相邻性。
