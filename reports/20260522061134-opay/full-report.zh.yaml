  - id: TP004
    title: 胜负标准表
    columns:
      - 标准
      - OPay 胜出条件
      - OPay 失手条件
      - 主要对手 / 替代
      - 证据
    rows:
      - - 快速完成消费者注册到转账
        - 用户优先看重速度、熟悉度和近似免费的转账
        - 用户更看重信任感或更清楚的操作指引
        - PalmPay
        - 独立排名显示 OPay 在低摩擦上领先，PalmPay 在清晰度上领先并缩小信任差距
      - - 日常账单支付、话费、借记卡使用
        - 买家想用一个钱包完成日常常见支付
        - 买家更想把支付流程留在主银行账户内
        - Access / UBA / GTBank
        - 银行已经把账单、转账和银行卡捆在现有账户关系里
      - - SME POS 和经营堆栈
        - 商户主要只需要收款，不需要重后台
        - 商户需要企业账户、持续支持、银行卡和运营工具
        - Moniepoint
        - Moniepoint 公开银行页面围绕企业经营设计，而不只是钱包活动
      - - 线上收银台和开发者驱动集成
        - 商户只需要简单的国内收款流程
        - 商户需要有文档的 API、全球支付方式、付款或跨境收款
        - Flutterwave / Paystack
        - Flutterwave 和 Paystack 发布的 API、收银台和定价细节比 OPay 更广
      - - 代理主导入金 / 出金
        - OPay 品牌认知和代理熟悉度在当地已经强
        - 电信运营商或竞争性代理网络比 App 品牌更重要
        - MTN MoMo / Airtel SmartCash / Moniepoint 等替代方案
        - 电信运营商和企业银行对手提供代理佣金、QR 和辅助交易
      - - 价格敏感的西非钱包标尺
        - 尼日利亚用户接受钱包龙头近乎免费的转账经济性
        - 客户拿它和超低费率移动钱包常态对比
        - Wave
        - Wave 入金 / 出金免费、转账 1%，比尼日利亚同业披露的消费者价格信号更锋利
      - - 信任和合规敏感选择
        - 转账速度是主导购买标准
        - 监管审查、认证或社会证明更重要
        - PalmPay / 银行
        - OPay 在低摩擦上居首，但信任是其被审计维度中最弱一项；银行则靠安全和合规熟悉度竞争
    notes: 各行综合了官方产品页和独立报道中观察到的胜负模式。它们是工作流判断，不是经审计的市场份额陈述。
