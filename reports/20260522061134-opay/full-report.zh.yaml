        - 如果披露质量跟上，从 $2B 到 $4B 的桥接在数字上说得通。
        - 缺的不是叙事能力，而是经审计的收入质量证据。
    notes: 除百分比溢价行外，数值均以十亿美元计。2024 和 2025 年锚点来自 Opera 报告的账面价值和持股比例。
