        - id: f1
          label: 代理可见度
          detail: 本地代理让 OPay 在实体场景中可被发现，并降低信任门槛。
        - id: f2
          label: 消费者开户
          detail: 消费者开通钱包，用于转账、账单和现金转换。
        - id: f3
          label: 商户开户
          detail: 中小企业通过商户 app 开通收款账户或申请 POS 终端。
        - id: f4
          label: 重复日常支付
          detail: 转账、账单、商户收款和提现使用，让 app 保持首选钱包位置。
        - id: f5
          label: 交叉销售与锁定
          detail: 卡、储蓄和放贷功能把使用场景从单次支付拓宽出去。
        - id: f6
          label: 投诉或信任事件
          detail: 欺诈提醒、客服和争议处理，决定重复使用能否延续。
      edges:
        - from: f1
          to: f2
        - from: f1
          to: f3
        - from: f2
          to: f4
        - from: f3
          to: f4
        - from: f4
          to: f5
        - from: f5
          to: f6
          label: 信任必须守住
    claimRefs:
      - CU002
