      - number: '7.3'
        title: Nigeria 集中度让代理、竞争和宏观变量快速传导
        blocks:
          - type: paragraph
            body: >-
              OPay 的强项也是集中度风险。公司的公开运营叙事几乎完全以 Nigeria 为中心：全国牌照、代理规模、客户信任争议，以及最显眼的监管事件都发生在
              Nigeria。这很重要，因为即便应用仍受欢迎，几类外部依赖也可能击穿投资逻辑。代理分销是真实护城河，但新的单一主事方规则也会让同一渠道变成重组风险。OPay
              还依赖银行、结算轨道、电信与电力可靠性，以及它无法控制的国家身份基础设施；其条款也明确否认对第三方平台宕机承担责任。竞争同时在加剧。全国牌照让金融科技公司触达更广，BusinessDay
              称此举让它们与银行站在同一起跑线，TechCabal 的 2026 年排名显示 OPay 处在真实竞赛中，而不是垄断位置。宏观压力会放大一切。World Bank 和 Opera
              披露指向汇率、通胀和更广泛的市场波动风险；Launch Base Africa 则把 OPay 估值与 Nigeria 和 Egypt 的经济稳定性、监管和竞争压力联系起来。对投资人而言，Nigeria
              集中度不是脚注；它正是监管、竞争和宏观冲击能更快打到 OPay 的主因。
