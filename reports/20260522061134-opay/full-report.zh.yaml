      - number: '3.4'
        title: 动能、监管与份额疑点
        blocks:
          - type: paragraph
            body: >-
              动能真实存在，但也容易被夸大。尼日利亚持牌移动货币运营商 2024 年处理 ₦71.5 trillion，同比增长 53.4%，确认该类别仍在快速扩张。但这是行业量， 不是 OPay 份额。独立的 FOLIO
              排名恰好因为增加了产品细节而有用：在经审计支付 App 集合中，OPay 总体领先，并在摩擦指标上占优，但信任是其最弱维度； PalmPay 排第二，清晰度得分甚至更高。这些结果说明，OPay
              最强优势是速度和熟悉度，而信任领先并未坐实。


              监管带来更硬的下行。2024 年开户冻结显示，合规问题可以打断增长；2026 年 OPay 和 Moniepoint 等公司的全国地位升级带来的是更重监管预期，而不是更轻规则。
              同时，银行仍是财务上严肃的竞争者，仅 2025 年前九个月就从电子支付赚得 ₦514.82 billion。尖锐结论是，OPay 是尼日利亚最强的消费者支付品牌之一，
              但其护城河比头条用户数暗示的更窄：它在钱包习惯上最强，在企业 PSP 和银行连接工作流上较弱，并且结构性暴露于信任、监管和价格压力。
