chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品模型与足迹
        blocks:
          - type: paragraph
            body: >-
              OPay 是一家以支付为核心的金融科技平台，成立于 2018 年，最早在尼日利亚上线移动货币服务；早期报道把它描述为一家以 Lagos 为基地、由 Opera
              围绕超级应用设想打造的公司。此后，公开产品组合从网约车、配送和电商实验，收束到核心钱包与商户金融栈：转账、缴费、话费和流量购买、 借记卡、OWealth 储蓄、POS 收单以及商户服务。Opera 2025
              年年报称，OPay 是一家私营金融科技公司，业务横跨非洲和亚洲，产品包括支付、 转账、储蓄、借贷、代理 POS 和商户收单。运营重心仍在尼日利亚：OPay 公开沟通强调尼日利亚金融普惠，平台持有 Central
              Bank of Nigeria 许可并受 NDIC 保险覆盖，公司还称截至 2024 年初拥有 17 个实体客户中心。主要身份疑点在总部披露。早期报道称 OPay 总部在 Lagos， 但 2025-2026
              年管理层新闻稿反复称其总部在 Singapore。已审阅公开记录无法判断这究竟是控股公司迁址、双总部模式，还是仅为高管搬迁； 因此，后续章节应把尼日利亚视为运营核心，把 Singapore
              视为最新披露的全球基地，而不是假定只有一个无争议的总部说法。
