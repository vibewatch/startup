        - 跨境或无卡交易流可能带来更高单元变现
      - - 钱包出款
        - 出款到 OPay 钱包每笔 ₦5
        - 已发布标价
        - 官方
        - 说明部分变现落在出款结算，而不是获客
      - - 其他银行 / MMO 出款
        - 按金额区间为 ₦10、₦25 或 ₦50
        - 已发布标价
        - 官方
        - 小额费用分层强化低可见摩擦，但不等于零变现
      - - 消费者转账
        - 宣传免费
        - 评测显示阈值和例外可能变化
        - 官方 + 评测
