  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代品
        blocks:
          - type: paragraph
            body: >-
              分析 OPay，应把它放进尼日利亚受监管的数字支付栈，而不是笼统贴上 “金融科技” 标签。Central Bank of Nigeria（CBN）把该市场视为受监管的支付系统，
              包含卡组织、交换网络、支付服务提供商、代理银行规则、移动货币运营商以及 QR / 支付框架；其 PSP 名册也明确把 Opay Digital Services Limited 列在移动货币运营商类别。这使
              OPay 位于消费者钱包使用、绑定银行账户转账、商户受理、代理现金存取、借记卡使用，以及由银行和 NIBSS 协调的清算轨道交汇处， 而不是一个单一闭环钱包市场。OPay
              自己的公开服务页也支持这一框架：它把钱包充值、免费向银行账户转账、缴费、借记卡和 OWealth 放在同一界面下营销， 说明相关市场既包括 App 驱动的消费者交易，也包括线下分发或受理触点。


              因此，纳入的支出比 “钱包收入” 更宽，但比全部非洲金融科技收入更窄。在尼日利亚层面，有界市场包括移动货币运营商、银行转账轨道、POS / 代理交易、 QR 受理以及面向消费者 /
              商户的支付工作流中的交易处理和受理活动。除非借贷、保险、财富管理 AUM 和非支付金融科技类别直接改变支付工作流或挂接经济性， 否则应排除在外。纯电信话费经济、通用核心银行软件，以及无法映射到 OPay
              当前受监管角色的泛金融服务 TAM 叙事也应排除。主要替代品仍是现金、存量银行转账、 银行自有卡、多提供商 POS / 代理布点，以及竞争性金融科技界面。NQR 和更宽的 CBN
              路线图重要，因为它们显示市场设计方向是把商户和消费者拉到可互操作的数字轨道上， 而不是推入某一个专有提供商生态。
            claimRefs:
