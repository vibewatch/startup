  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 变现轨道可见，但混合抽成率不可见
        blocks:
          - type: paragraph
            body: >-
              公开证据能清楚说明 OPay 卖什么，却较难说明每条轨道赚多少。OPay 自己的页面显示，其栈把消费者钱包充值、看起来免费的跨行转账、缴费、借记卡、 OWealth 和面向商户的支付受理组合在一起。Opera
              2025 年 Form 20-F 进一步称，OPay 是一家私营金融科技公司，业务包括支付、转账、储蓄、借贷、 代理 POS 和商户收单。这一点重要，因为它排除了把 OPay 懒惰地框成单纯 P2P 转账 App
              的说法：公司显然在商户收银、出款轨道、卡、信贷和财富周边拥有多个变现点。 收银价目卡是最清楚的直接公开费率披露。它列出本地交易 1.5%、封顶 ₦2,000，国际交易
              4%，以及小额固定出款费。相比之下，消费者页面仍在宣传免费银行转账， 以及活跃卡零维护费。


              这种不对称就是核心经济信号。可见的消费者产品被设计成免费或近乎免费，变现则落在商户和挂接金融服务轨道上。Neobanks.guide 的上手评测把同一结论推得更远： 它描述来自商户交换费、借贷和 OWealth
              相关费用的收入，同时指出代理通常赚的是由 OPay 支付、而非直接由用户支付的佣金。实际含义是， 公开商户定价不能被当作平台总支付量上的已实现抽成率。OPay
              公开规模故事很大一部分建立在消费者转账习惯和代理辅助现金流动上，而这些恰恰是最可能被补贴以维持增长和信任的资金流。 因此，正确的财务读法是分层抽成率画像：在 OPay
              作为记录处理方的场景有明确低个位数商户费率；部分出款流有微小固定费用；卡相关经济性部分藏在发卡方和网络结构里； 总交易价值上的混合变现率则低得多，且未披露。


              规模证据在方向上很强。Ecofin 追踪到月支付价值从 2020 年 1 月约 $363 million，增至 2020 年底超过 $2 billion，后来到 2024 年初每月超过 $12
              billion；Technext 报道 2026 年也有类似的约 $12 billion 月度水平，以及 500,000 多名代理。Reuters 转发的 OPay 宣传又补充称， 2025 年末全球日活用户超过
              20 million、月活用户 36 million。但这些披露不能干净比较：有些只限尼日利亚，有些是全球，有些是注册用户，有些是 DAU 或 MAU。 它们足以支持 “规模很大、低费率交易网络”
              的结论，但不足以计算可靠的单用户收入或已实现抽成率。
