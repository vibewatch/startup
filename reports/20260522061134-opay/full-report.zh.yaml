  - id: TM004
    title: 增长驱动与约束表
    columns:
      - 驱动 / 约束
      - 方向
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - 非银行普惠金融提升和代理网络深度
        - 顺风因素
        - 当前至未来数年
        - EFInA 和 IMF 证据显示，分销正在银行之外扩张，帮助 OPay 这类服务商触达银行服务不足用户
        - OPay 新增活跃用户中，有多少来自代理协助开户，而不是 App 优先开户？
      - - 商户数字化和 QR 受理
        - 顺风因素
        - 当前至未来数年
        - AFI 和 NQR 证据显示，商户受理是从 P2P 规模走向 SME 和 B2B 变现的桥
        - OPay 吞吐量中，商户发起而非纯消费者转账占比是多少？
      - - 公共支付轨道升级（NQR、NPS、NIP 零手续费目标）
        - 顺风因素
        - 2025-2026 起
        - 更快互操作和更低转账摩擦可放大交易量，并持续推高现金替代压力
        - 直连 NPS 会改善 OPay 经济性，还是主要降低全行业系统性摩擦？
      - - 汇款数字化
        - 顺风因素
        - 当前至未来数年
        - 数字汇款比传统方式便宜，可能把收款人导入钱包使用，形成交叉销售路径
        - OPay 能把多少汇款收款人转化为留存在钱包余额里的用户，而不是立即取现？
      - - 监管、KYC 和网络安全要求收紧
        - 约束
        - 立即
        - CBN 收紧监管、网络安全报告和代理管控后，合规成本上升
        - OPay 增量合规支出是多少？它如何影响各细分群体的边际经济性？
      - - 信任、欺诈和争议处理
        - 约束
        - 立即且持续
        - 转账失败或欺诈事件会直接改变用户和代理对服务商的选择，拖慢持久采用
        - 相比同业，交易失败率、冲正时间、欺诈损失和投诉解决基准是多少？
      - - 设备、识字能力和农村接入缺口
        - 约束
        - 持续
        - 手机持有率高，并未消除低智能手机渗透和低识字能力障碍，辅助渠道仍有必要
        - OPay 活动中，有多少依赖 USSD、代理或低数据工作流，而不是完整 App 使用？
      - - 现金竞争和低费率预期带来的利润率压力
        - 约束
        - 持续
        - 如果现金仍是基准，核心支付轨道又走向零成本转账，交易量增长可能跑赢变现
        - 转账费之外，哪些收入流能支撑可持续贡献利润率？
    notes: 这张表把采用顺风和变现约束拆开。有些力量会推高使用量，同时压缩经济性，因此不能把交易规模等同于估值质量。
