      - number: '7.5'
        title: 缓释动作看得见，剩下的是证明其耐久性
        blocks:
          - type: paragraph
            body: >-
              OPay 不是缓释措施不可见的案例。公司有真实控制，法律边界明确，管理层也似乎在可能的资本市场事件前专业化。但最关键的风险可观察却披露不足，因此尽调门槛异常具体。投资人应要求提供 CBN
              检查历史、整改日志，以及与开户暂停、罚款或 KYC 升级有关的任何往来文件。还应要求欺诈损失率、诈骗提醒转化指标、误报率、冻结量、申诉结果和投诉解决
              SLA。投资人需要代理生产率和流失数据，以量化单一主事方规则的影响；也需要 Nigeria 与其他市场拆分的
              TPV、收入和用户结构，判断国家集中度是在缓解还是恶化。最后，还应要求一套超越新闻稿的治理包：董事会组成、委员会章程、内控责任归属，以及适合公开上市流程的审计披露。在这些要求满足之前，默认立场应把 CBN/KYC
              升级视为最高严重度风险，把欺诈或冻结驱动的信任流失视为最高概率运营风险，把 Nigeria 集中度视为放大其他所有下行的关键因素。
