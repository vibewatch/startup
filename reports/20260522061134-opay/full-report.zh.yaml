  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: OPay 核心平台依赖尼日利亚监管方、身份基础设施、结算网络、代理商分发和宏观环境。
    data:
      nodes:
        - id: core
          label: OPay 核心钱包 + 商户平台
        - id: reg
          label: CBN / NDIC / FCCPC / NDPC
          detail: 牌照、保险表述、消费者审查、隐私负担
        - id: idv
          label: BVN / NIN / 身份基础设施
          detail: 开户与 KYC 支撑
        - id: banks
          label: 银行 / 结算 / 处理商
          detail: 执行、冲正和对账
        - id: agents
          label: 代理商 / POS 运营商
          detail: 线下获客和现金转换
        - id: cust
          label: 消费者和商户
          detail: 余额信任、客服需求、价格敏感度
        - id: macro
          label: 尼日利亚宏观环境
          detail: 通胀、外汇和家庭购买力
        - id: markets
          label: 投资者 / IPO 市场
          detail: 估值和披露预期
      edges:
