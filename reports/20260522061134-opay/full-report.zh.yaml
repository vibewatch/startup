  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与信任桥梁
        blocks:
          - type: paragraph
            body: >-
              公开证据支持把 OPay 视为一个广义的日常资金产品，而不是狭窄的钱包细分品类。记录最充分的客户群体包括：使用转账、账单、话费、储蓄、银行卡和小额贷款的欠银行服务消费者；使用收款账户、POS
              终端和商户营运资金功能的微型商户和中小企业；以及在银行网点和 ATM 不可靠的市场里把现金转成数字价值的代理运营者。独立来源反复把 OPay 的触达与金融普惠联系起来，而不只是数字优先的城市用户。Ecofin 和
              Business A.M. 都把代理网络描述为全国分销护城河；Neobanks.guide 更进一步，称该网络是那些仍要靠面对面建立信任的人群进入现金入钱包的关键入口。这一点关系到 OPay
              的投资逻辑：客户基础不只是应用安装者，而是消费者、商户和代理通过现金存取便利性连成的混合基础。仍然弱得多的是汇款用户证据。公开材料显示多国运营和国际卡受理，但没有量化 Nigeria
              产品按走廊拆分的汇款采用率或侨民使用情况。
