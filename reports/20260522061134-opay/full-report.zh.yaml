      - number: '8.4'
        title: 建议、上行条件与最终尽调清单
        blocks:
          - type: paragraph
            body: >-
              在当前证据水平下，最站得住脚的立场是价格敏感的谨慎，而不是乐观。OPay 的运营已太经验证，不能轻易否定：2021 年融资轮、Opera 的连续估值标记、据报道的 IPO 银行聘请，以及持续存在的 Nigeria
              消费者规模，都指向一家拥有真实机构价值的公司。但同一份公开记录也说明，盲目给出后期买入判断还太早。OPay 仍没有公开的经审计独立收入、利润率、现金流或股权结构包；Opera 的标记明确不确定；Nigeria
              集中度、合规执法、冻结或欺诈争议也仍是估值输入，而不是旁注。


              因此，建议应是继续研究 / 观察，信心中等，风险高，在 $4 billion 要价下估值偏高。围绕 Opera 隐含的约 $3.1 billion 标记，这个故事更容易论证为合理：从 2021 年 $2
              billion 到 2025 年 $3.1 billion 的桥接是可信的，并由真实股东标记支撑。到了 $4 billion，投资人实质上是在为尚未到来的披露预付价格。这个价格可以成立，但前提是 IPO
              流程披露经审计的收入质量、免费感转账之外的耐久货币化、可接受的监管往来，以及 OPay 能管理 Nigeria 风险且不产生估值气穴的证据。


              尽调条件因此异常具体。升级为买入前，投资人应要求 FY2025/FY2026 审计财务、收入到 TPV
              和收入到毛利率桥、按地域拆分的用户和收入结构、股权结构表与优先股堆叠审查、监管和诉讼往来，以及围绕投诉、冻结、欺诈损失和申诉结果的运营指标。如果管理层无法提供这些，正确解读不只是“还需要更多工作”，而是估值已经超出了公开证据基础。
