  - id: TM003
    title: 细分客群 / 买方图谱
    columns:
      - 细分群体
      - 买方
      - 用户
      - 付款方
      - 工作流
      - 预算负责人
      - 采用触发点
    rows:
      - - 大众消费者
        - 选择钱包或转账 App 的个人
        - 使用钱包、转账、缴费或卡的同一名个人
        - 通常是自充值钱包或绑定账户
        - 通过 App 或代理协助开户，随后反复转账和缴费
        - 家庭现金流预算
        - 需要比现金或网点办理更便宜、更快的日常支付
      - - POS / 存取现代理
        - 根据服务商在线率和支持选择平台的代理业主
        - 代理员工及本地消费者
        - 交易费和浮存资金周转支撑代理经济性
        - 专用账户 / 设备、协助存取款、本地流动性管理
        - 小企业营运资本负责人
        - 客流、可靠性、欺诈控制，以及新规下的单一服务商合规
      - - 微型商户
        - 店主或非正规商户
        - 商户收银员和终端客户
        - 商户隐性或显性承担受理成本；客户支付购买金额
        - QR / POS 受理、结算、对账、重复收款使用
        - 业主经营的商户预算
        - 需要减少现金处理、即时到账，并改善对账
      - - SME 经营者
        - 创始人、运营负责人或财务负责人
        - 收款并发起供应商或工资款流的员工
        - 企业运营预算
        - 商户受理叠加转账、类薪资发放和供应商付款工作流
        - SME 业主经理或财务负责人
        - 在消费者收款之上，需要更高吞吐量、更快结算和企业付款能力
      - - 银行 / 卡组织 / 转接机构
        - 受监管金融机构和卡组织运营方
        - 下游 PSP、MMO、商户和消费者
        - 收益通过卡组织、转接、结算和合规角色分摊
        - 提供支付轨道、互操作性、卡或 QR 标准及结算接入
        - 机构支付与基础设施预算
        - 需要让国家支付轨道保持安全、可互操作且商业上可持续
