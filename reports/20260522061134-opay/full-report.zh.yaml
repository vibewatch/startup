  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值锚点，以及它们能否连贯地推到 $4 Billion
        blocks:
          - type: paragraph
            body: >-
              公开估值故事比许多非洲私有金融科技案例更连贯，但仍不足以证明 $4 billion IPO 算便宜。2021 年的定价锚点很清楚：OPay 完成由 SoftBank Vision Fund 2 领投的
              Series C，融资 $400 million，估值 $2 billion。接下来两个锚点不是来自 OPay 自身，而是来自少数股东 Opera；其公开监管文件是目前最好的外部估值标记。BusinessDay
              2024 年关于 Opera 账面价值的报道显示，9.4% 股权价值 $258.3 million，隐含 OPay 估值约 $2.75 billion。Opera 2025 年 Form 20-F 随后把
              9.5% 股权记为 $294.6 million，隐含截至 2025 年末估值约 $3.1 billion。


              这条序列方向上说得通：从 2021 年定价轮到 2024 年隐含标记，约升值 38%；进入 2025 年标记又进一步增加约 13%。更难的问题是 2026 年 5 月的 IPO 传闻。多家报道称 OPay 聘请
              Citi、Deutsche Bank 和 JPMorgan，目标是在美国实现约 $4 billion 估值。相较 Opera 2025 年末隐含价值，这只高出约 29%，表面看并不是离谱的后期估值跳升。但
              Opera 的标记不是公开市场价格。Launch Base Africa 和 WeeTracker 都强调，Opera 的内部模型假设 IPO 概率为 85%、折现率为 18.5%、缺乏市场流动性折价为
              10%。Opera 自己的监管文件也警告，其 OPay 投资公允价值高度不确定，可能带来重大波动。因此，锚点方向上连贯，但 $4 billion 要价仍是面向未来的乐观情景，而不是已经完全坐实的估值事实。
