      - number: '1.3'
        title: 资本形成、所有权信号与规模指标
        blocks:
          - type: paragraph
            body: >-
              在非洲私营金融科技公司中，OPay 的融资历史异常可读，因为 Opera 的公开申报反复提供外部估值桥。2019 年两轮风险融资合计约 $170 million 之后， OPay 于 2021 年 8 月完成由
              SoftBank Vision Fund 2 领投的 $400 million C 轮，估值 $2 billion，披露的累计融资约 $570 million。 此后，Opera
              成为按市值标记所有权最有用的公开参照点：TechCabal 报道称，Opera 持股在 2021 年前降至 6.4%，随后因 Nanobank 换股交易在 2023 年初升至 9.4%；Opera 2025 年
              20-F 称，公司截至 2025 年底持有 OPay 9.5%。该申报把这笔投资记为 $294.6 million，并用包含 IPO、私人出售、赎回和解散结果的概率加权退出框架为 OPay 估值，隐含估值在低
              $3 billion 区间，且明显高于 2021 年轮次价格。BusinessDay 另称 OPay 已聘请 Citi、Deutsche Bank 和 JPMorgan，筹备可能在 2026 年赴美
              IPO，目标约 $4 billion；不过截至本次报告日期，OPay 尚无公开 SEC 申报。规模披露方向上强，但并不完全干净。Reuters 转发的 OPay 新闻稿称，2025 年 11 月全球日活用户超过
              20 million、月活用户 36 million；其他 Opera 相关报道则称尼日利亚用户超过 50 million、DAU 约 10 million、月交易量约 $12
              billion。这些数字显示出有意义的规模， 但底层定义尚未统一到可直接用于尽调的程度。
