      - number: '7.2'
        title: 欺诈控制真实存在，但冻结、故障和支持仍会击穿信任
        blocks:
          - type: paragraph
            body: >-
              公开证据支持 OPay 具备严肃的控制姿态，但不支持“信任问题已解决”。OPay 自有材料强调加密数据处理、PCI DSS 合规和即时账户锁定；独立报道描述的 2025 年安全栈更成熟，包括紧急锁定、Night
              Guard、大额交易生物识别检查和诈骗提醒。最强的控制信号是，OPay
              称其诈骗提醒系统现在每天警示数万名用户，并拦截数万笔高风险交易。但下行情景不只是“会发生欺诈”；真正的问题是，欺诈管理会变成客户痛点。Trustpilot 投诉、所谓欺诈提款视频后的恐慌性提款，以及
              Nairametrics 反复把信任称为行业瓶颈，都显示客户基础在情绪上很脆弱。₦714 million 故障后的大规模冻结事件和 2026
              年诉讼报道，都指向同一条传导路径：当风控工具或对账动作变得可见时，OPay
              可以在运营上保护自己，却仍然伤害客户信心。因此，安全是混合型风险：缓释能力在提升，但剩余信任敞口仍高，因为公开记录里没有申诉公平性、误报和投诉解决速度的证据。
