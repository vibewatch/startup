      - number: '4.3'
        title: 信贷、浮存和合规会制造真实财务风险，即使公开损失数据缺失
        blocks:
          - type: paragraph
            body: >-
              公开来源质量足以说明 OPay 不是狭窄的软件式处理商，却不足以衡量其资产负债表暴露。Opera 申报明确称 OPay 提供储蓄和借贷，并有代理 POS 和商户收单。 OPay 自己的页面显示，OWealth
              是由 OPay Microfinance Bank Limited 支撑的每日计息产品。Neobanks.guide 进一步描述了一个栈：包含吸收存款的微型金融银行、 作为货币市场基金包装的 OWealth，以及
              OPay Credit 或 OKash 这类短期限贷款产品。这个组合至少意味着三类经济性质不同的风险池：客户余额和浮存管理、
              带有基金管理或利差成分的财富产品经济性，以及短久期贷款带来的信用暴露。缺失的是能告诉投资者这些风险池有多大的硬数据。


              成本侧同样不透明。OPay 的模型显然运营支出更重，资本开支更轻。主要公开成本向量包括代理佣金、商户和网络清算成本、发卡和处理、KYC 与欺诈控制、 客户支持，以及藏在借贷和财富背后的资金和损失成本。Ecofin
              关于 500,000 多名代理和截至 2023 年中 563,000 名代理的报道说明，线下分发是资产， 也是佣金和服务负担。Neobanks.guide
              的评测补充了定性经济性：代理赚佣金，卡取款产生发卡方和运营商收费，OWealth 回报扣除了管理费， 贷款产品收取发放费和利息。这些不足以产出毛利率或贡献利润率数学，但足以拒绝低成本、纯软件的心智模型。


              不利证据让问题更尖锐。Nairametrics 和 The Paypers 报道称，CBN 2024 年因 KYC 不合规罚 OPay ₦1 billion；另有三篇 2026 年报道描述了 Federal
              High Court 围绕涉嫌非法账户冻结的争议。Nairametrics 还指出，客户投诉和交易风险管理是 OPay 运营模型的核心。财务上，这些不只是声誉故事。它们指向反复发生的合规支出、
              欺诈损失预防成本、潜在法律暴露、撤销和支持费用，以及更严格监管抬高维持增长成本的风险。因此，未披露违约率、拨备或欺诈损失率，是重大尽调阻断项，而非小数据缺口。
