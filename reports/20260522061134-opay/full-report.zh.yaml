      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              OPay 的买方地图是多边的，不是单一企业采购。消费者侧，用户和付款方通常是同一个人：为钱包充值，或选择一个转账界面；但该消费者仍依赖受监管轨道、 银行连接、代理现金点，以及对撤销或争议处理的信任。商户侧，AFI
              的商户受理研究最清楚地提醒外部观察者：商户是现金转数字的中心节点，因为他们收客户款、 付供应商款，也常常给员工发薪。NQR 的设计把这一点在尼日利亚具体化：商户展示二维码，客户通过银行或钱包 App
              扫码，商户收到实时入账通知。 代理又构成一个独立分层。他们是提供商基础设施的用户，是准买方，购买的是正常运行时间和服务质量，也是仍依赖现金存取点的消费者身边的本地信任中介。 银行、卡组织和 NIBSS
              不是零售终端用户，但仍是经济上相关的付款方或守门人，因为它们提供清算、组织接入和合规架构。


              公开证据在工作流上最强，在准确签约主体上较弱。基于 EFInA 的报道显示，非银行渠道、移动货币和金融代理使用正在推动普惠金融提升，说明 OPay 这类提供商正在赢下此前网点密度和传统开户太弱的场景。 IMF
              证据补充了分发点：尼日利亚的代理目标被大幅超越，截至 2022 年 9 月达到 1.375 million 名代理，即便北部仍服务不足。与此同时，采用路径受设备和信任现实约束。 Proshare 对 EFInA
              的摘要称，2023 年手机普及率为 93%，但智能手机使用率只有 27%；TechEconomy 给出更高的 99% 手机拥有率，凸显 App 驱动叙事仍建立在嘈杂的设备数据上。 这就是代理和 QR
              路径重要的原因：消费者、微型商户和 SME 并不会通过同一渠道采用，预算归属在公开来源中也更多是方向性判断，而非合同层面的明确事实。
