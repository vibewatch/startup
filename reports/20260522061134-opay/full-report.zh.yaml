        title: 架构、轨道与伙伴依赖
        blocks:
          - type: paragraph
            body: >-
              虽然 OPay 没有发布端到端架构图，公开文档仍足以推断运营模型的大致形态。商户受理似乎由 API 驱动：收银文档展示 QR 和 request-to-pay 流程、
              callback、webhook、签名、沙箱和生产端点；数字钱包文档展示下级钱包、余额查询、交易历史查询，以及 sweep-to-merchant 转账。
              这是有意义的技术表面，也说明公司能从同一个底层平台家族编排消费者钱包支付、商户收款以及现场或子商户运营。但这个栈也明显依赖轨道。消费者转账被描述为由尼日利亚银行提供动力； QR 采用很可能建立在 NIBSS
              NQR 和 CBN 支持的 request-for-payment 基础设施上；卡使用依赖卡组织和交换网络关系；开户依赖从国家数据库调取 BVN 或 NIN； 伙伴受理可以通过 Flutterwave
              等聚合商抽象。因此，最适合把该架构描述为覆盖受监管尼日利亚轨道和伙伴轨道的混合编排层，而不是封闭的专有网络。
