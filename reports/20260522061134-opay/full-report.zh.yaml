  - id: TV006
    title: 投资逻辑破裂及行动触发表
    columns:
      - 触发因素
      - 阈值或事件
      - 对估值的传导
      - 行动含义
    rows:
      - - 经审计收入质量不及预期
        - IPO 文件显示的收入、抽成率或利润率显著低于 2026 年新闻叙事暗示的水平
        - 公开市场可比估值立即收缩，IPO 溢价消失
        - 转为回避，或要求估值重定价至更接近悲观区间。
      - - 新的监管或合规行动
        - IPO 准备期间出现新的 CBN 执法、开户限制或大额合规罚款
        - 抬高折现率，削弱增长持续性假设
        - 在整改形成文件证据前推迟投资。
      - - 欺诈 / 冻结引发的信任恶化
        - 投诉、诉讼或上诉失败明显增加
        - 损害用户留存，并抬高客服 / 合规成本预期
        - 除非披露和控制显著补强，否则视为投资逻辑破裂。
      - - 尼日利亚集中度仍压倒一切
        - IPO 材料显示尼日利亚以外的收入或 TPV 多元化很少
        - 汇率和单一国家风险主导估值机制
        - 拒绝把多元化全球同业的溢价倍数迁移过来。
      - - 股权结构或优先权不透明
        - 后期尽调发现棘轮条款、优先股堆叠复杂，或 IPO 机制对新投资者不利
        - 即使名义估值不变，也会压低实际进入经济性
        - 投资前按完全摊薄和净募资条款重新测算。
    notes: 触发因素被设定为可监测事件；它们会改变估值判断，而不是泛泛的经营风险。
    claimRefs:
      - CV018
      - CV020
      - CV021
      - CV022
      - CV024
      - CV043
      - CV045
      - CV046
  - id: TV007
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 经审计财务数据
        - FY2025 和 FY2026 经审计收入、毛利率、EBITDA / EBIT 及现金流量表
        - 直接做倍数估值、承销盈利质量的核心前提
        - 获取 IPO 草稿、审计师资料包或董事会批准的年度账目。
      - - 收入质量桥接
        - TPV 到收入、产品组合、地域层面的变现桥接
        - 区分“近似免费”的支付习惯与已变现的商户 / 信贷 / 财富业务经济性
        - 索取银行估值材料和月度队列变现表。
      - - 尼日利亚集中度
        - 按国家拆分用户、TPV、收入和利润贡献
        - 判断 OPay 真正跨多市场，还是主要仍是一组尼日利亚风险
        - 索取管理层按市场拆分的经营复盘。
      - - 监管与法律资料包
        - CBN 往来函件、整改日志、账户冻结案件、投诉指标和欺诈损失数据
        - 直接影响折现率、增长持续性和声誉风险
        - 审阅董事会风险资料包和外部律师摘要。
      - - 股权结构表与优先权
        - 当前持股、优先股堆叠、反稀释条款和 IPO 机制
        - 名义估值可能与新投资者的实际经济性明显不同
        - 审阅数据室股权结构表，以及律师关于清算优先权和 IPO 转换的备忘录。
      - - 治理与控制
        - 董事会组成、委员会、内部控制责任归属和上市准备工作计划
        - 判断 IPO 级披露能否不带意外地交付
        - 要求治理备忘录和上市前控制评估。
    notes: 这些是从“有意思”进入“可投资”且能支撑溢价估值的最低尽调条件。
    claimRefs:
      - CV015
      - CV023
      - CV024
      - CV045
      - CV046
      - CV047
      - CV048
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: 从创立到 2026 年 IPO 准备窗口的公开时间线，涵盖融资、治理重置、监管升级和不利法律事件。
    data:
      items:
        - date: '2018'
          label: 在尼日利亚成立并上线
          detail: OPay 成立，并在尼日利亚推出移动支付服务。
          tone: positive
        - date: '2019'
          label: 两步式融资激增
          detail: $50M 风险投资轮和 $120M Series B 支撑早期规模化及区域扩张野心。
          tone: positive
        - date: '2020'
          label: 超级 App 逻辑接受检验
          detail: 管理层仍在推动更宽的超级 App 叙事，但支付成了更稳的重心。
          tone: neutral
        - date: 2021-08
          label: Series C 独角兽轮
          detail: SoftBank 领投的 $400M Series C 将 OPay 估值定在 $2B，并为埃及 / MENA 扩张提供资金。
          tone: positive
        - date: '2023'
          label: 采用加速
          detail: Opera 称 OPay 2023 年用户基数扩大至四倍，按固定汇率计收入增长超过 60%。
          tone: positive
        - date: '2024'
          label: 信任与控制压力浮现
          detail: 客服扩张的同时，故障追偿诉讼和非法冻结判决也出现。
          tone: negative
        - date: 2025-11
          label: 20M+ DAU 口径
          detail: OPay 称全球 DAU 已超过 20M，MAU 达 36M。
          tone: positive
        - date: 2025-12
          label: 全球财务升级
          detail: James Perry 加入担任 CFO，OPay 准备转向更机构化的治理模式。
          tone: positive
        - date: 2026-01
          label: 领导层重置 + 全国牌照
          detail: OPay 宣布全球核心团队，CBN 将 OPay 的牌照升级至全国级。
          tone: positive
        - date: '2026'
          label: IPO 可选性浮出水面
          detail: BusinessDay 报道美国 IPO 计划，但 OPay 尚无公开申报文件。
          tone: neutral
    approximationNotes: 部分条目描述的是已报道计划或治理变动，而非已完成交易。若确切生效日期未充分披露，时间按公开公告口径列示。
