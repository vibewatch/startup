      - number: '1.2'
        title: 领导层、创始人延续性与治理
        blocks:
          - type: paragraph
            body: >-
              创始人延续性异常强。公开报道和官方新闻稿都把 OPay 的创立与 James Yahui Zhou 绑定；他在 Opera 内部搭建了公司，并于 2025 年末转任执行董事长。 2025-2026
              年治理重置又引入 Lars Boilesen 任联席 CEO、Stephen 任联席 CEO 兼 COO、前 Citigroup 董事总经理 James Perry 任 CFO， 均自 2025 年 12 月 1
              日生效。这些任命指向有意为更严格的监管沟通、资本市场工作和地理扩张做准备。在尼日利亚运营层面，Dauda Gotring 仍在 2024 年初以 CEO 身份出现，Dotun Daniel Adekunle 则在
              2026 年 BusinessDay Fintech Summit 上以 COO/CTO 身份公开亮相。
              因此，问题不是领导层缺位，而是领导层分层：创始人监督、新近全球化的高管核心，以及持续在本地运营的团队。治理透明度仍是明显短板。 Reuters 转发的公司新闻稿只以名 “Stephen”
              识别该高管，公开记录也没有给出完整董事会名单、独立董事名册或委员会结构。Opera 2025 年年报披露， 2025 年有一名独立董事加入 OPay 董事会，但同时称 Opera 虽持有 9.5%
              股权，却没有合同董事席位权，也没有重大影响力。这个组合降低了直接所有权控制担忧， 但提高了围绕董事会构成、接班计划和决策权的尽调需求。
