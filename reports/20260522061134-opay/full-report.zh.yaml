      - number: '6.4'
        title: 反向证据与未解决缺口
        blocks:
          - type: paragraph
            body: >-
              客户端反向证据很实质，不能当成孤立噪音带过。历史 Trustpilot 评价很难看，可访问快照得分 2.9，投诉集中在账户冻结、扣款失败、低转账限额和支持薄弱。更严重的信任冲击包括：Punch
              报道未经授权账户指控，BusinessDay 和 Punch 报道开户暂停及关闭不合规账户，TechEconomy 报道 OPay 在一笔 ₦714 million 交易故障后获得法院批准，冻结 30
              家银行的账户。Nairametrics 还记录了旧欺诈视频重新传播后，账户安全担忧引发的恐慌性提款。当前商户评价没有那么戏剧化，但仍然重要：即便正面评价者也抱怨费用和可用性缺口。合在一起，反向记录说明 OPay
              靠便利性和物理触达赢得客户，但信任仍脆弱，因为投诉解决质量无法公开衡量。要把强客户耐久性写进投资假设，尽调需要可审计的支持指标、真实留存队列和硬性的汇款用户数据，而不是另一组营销口径。
