      - number: '4.2'
        title: 规模可信，但盈利说法只被部分排雷
        blocks:
          - type: paragraph
            body: >-
              最重要的财务尽调问题不是 OPay 是否大，而是大交易量是否已经变成耐久利润。公开记录在这一点上明显更弱。二级来源引用了强劲内部表现。 TechCabal 称 Opera 告诉股东，OPay 到 2023
              年用户基数扩大四倍，按固定汇率收入增长超过 60%。Ecofin 和 Tekedia 都称 OPay 在 2024 年实现首次月度盈利。
              这些都是有用信号，尤其与这家规模化尼日利亚支付领导者准备进入公开市场的更大叙事相吻合。但已审阅来源没有提供 OPay 单体经审计利润表、毛利率、经营利润率或现金流量表。 也没有一份可与美国 IPO
              招股书要求相比的公开 OPay 申报。


              最大的披露质量红旗，是 2026 年反复出现的 OPay 2025 年收入 $614.8 million 说法。Technext 直接写出这个数字，WeeTracker 也跟进。但同一个 $614.8
              million 和 28% 增长数字，出现在 Opera Limited 自己的 SEC 20-F 中，指的是 Opera 2025 年收入，而不是 OPay 收入。这不能证明 OPay 收入更低或更高；它说明
              2026 年媒体循环中至少有一部分似乎把 Opera 的数字回收进了 OPay 故事。用于承销时，这意味着市场上看似最具体的收入数字， 不能当作已验证的 OPay 收入事实。本章因此把 OPay
              收入视为未披露，而不是 $614.8 million。


              这个区分会实质影响抽成率工作。如果 OPay 收入没有公开坐实，干净的收入 / TPV 抽成率计算就不可能。仍可判断的是，平台表现为一个低可见费率网络，
              变现转移到商户受理、出款、卡轨道、借贷和财富产品。Technext 和 BusinessDay 都暗示，公开市场投资者会迫使更多注意力转向 ARPU、利润率扩张和收费纪律。 这种压力可能已经在用户关于 VAT
              和商业 App 费用的投诉中浮现。财务含义是双刃的：OPay 可能有真实经营杠杆，但其消费者基本盘建在一个费率敏感度高、
              切换成本适中的市场中。因此，强规模故事与弱公开收入质量故事并存。按现有证据，盈利可信，但尚不能承销。
