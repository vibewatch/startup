      - number: '7.4'
        title: 治理在改善，但披露质量仍落后于资本市场叙事
        blocks:
          - type: paragraph
            body: >-
              这里的治理风险比“没有 CEO”更微妙。2026 年 1 月，OPay
              宣布更正式的全球管理团队，方向上是正面的，也降低了纯粹的单一高管依赖。但相对于围绕公司流传的公开市场抱负，披露质量仍然薄弱。最具体的治理事实仍来自 Opera 的监管文件和估值报道，而不是 OPay
              自身丰富的独立披露。Opera 的 20-F 只披露了少数股权，却反复警告其 OPay 投资的公允价值高度不确定，主观假设更新可能带来重大波动。Weetracker 和 TechTrendsKE 把 IPO
              叙事推得更远，但无法替代对董事会组成、委员会、内控或各市场集中度的清晰公开披露。这种错配带来两类风险。第一，投资人可能过度解读估值标题，却没有穿透治理细节。第二，如果 OPay
              迈向美国上市，披露预期的跃迁可能暴露集中度、控制或所有权上的未解问题；在公司仍为私有时，这些问题容易被忽略。正确解读是：管理成熟度在提升，但披露不透明仍是真实的承销风险。
