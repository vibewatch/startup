        - label: 2025 年 Opera 推导估值标记
          value: 3100
        - label: 基准情景中点
          value: 3200
        - label: 据报道 2026 IPO 目标
          value: 4000
        - label: 悲观情景中点
          value: 2200
    approximationNotes: 所有数值均为百万美元。2024 和 2025 估值标记由 Opera 的账面价值和持股比例推导；基准和悲观情景中点为分析师估计。
    claimRefs:
