      - number: '3.3'
        title: 定价、商业模型与切换标准
        blocks:
          - type: paragraph
            body: >-
              定价透明度在市场中划出清晰分界。Flutterwave 和 Paystack 公开发布商户经济性：Flutterwave 在尼日利亚列出本地收款 2%、国际定价 4.8% 以及转账费； Paystack
              列出本地定价 1.5% + ₦100、封顶 ₦2,000，国际卡定价 3.9% + ₦100，以及终端成本。Wave 更清楚，存款、取款和缴费免费， 个人对个人转账 1%。OPay
              的公开信息不同。它强调免费银行转账、缴费、卡和储蓄，而不是提供同等水平的商户定价细节。PalmPay、Moniepoint 和 Quickteller 在公开标价上也同样更薄，使准确抽成率比较困难。


              这会影响赢单 / 输单模式。当买方想要最快的日常转账流程、低可见费用以及消费者支付中的广泛熟悉度时，OPay 会赢。商户若需要完整商业银行和线下支持， Moniepoint 更强，OPay
              会输；线上企业若需要有文档的 API、跨境收款和明确清算经济性，Flutterwave 和 Paystack 更匹配，OPay 也会输。
              利润率压力来自两个方向：低费率钱包教会用户期待近乎免费的转账，而银行仍能在规模上变现同样资金流。
