  - id: TP003
    title: 定价 / 商业模式对比
    columns:
      - 服务商
      - 公开价格信号
      - 商业模式 / 变现
      - 分发 / GTM
      - 对 OPay 的影响
    rows:
      - - OPay
        - 转账至银行账户免费；活跃银行卡零维护费
        - 消费者钱包使用、支付频次、银行卡、储蓄和商户服务
        - 大众市场 App 加代理和服务中心
        - 定下低费率消费者基线，但商户经济性不够透明
      - - PalmPay
        - 面向用户的公开定价不如 PSP 同业清楚；储蓄和返现叙事突出
        - 消费者活跃、储蓄、支付和生态使用
        - App 拉新，加密集代理和商户网络
        - 在日常钱包习惯和信任感知上正面竞争 OPay
      - - Moniepoint
        - 商户定价公开程度不如 PSP 专业机构
        - 企业银行、支付、银行卡、支持和商户变现
        - 线下 SME 销售、服务和代理关系
        - 商户想要完整经营堆栈时，Moniepoint 会成为 OPay 的压力点
      - - Flutterwave
        - 本地收款 2%；国际收款 4.8%；转账费 ₦10/₦25/₦50
        - 企业收款、付款、电商和 API 变现
        - 面向企业、创业公司和全球商户的 API 驱动销售
        - 凸显 OPay 公开企业级和跨境主张较弱
      - - Paystack
        - 本地 1.5% + ₦100，封顶 ₦2,000；国际 3.9% + ₦100；已发布终端定价
        - 收银台、转账、终端和开发者驱动的商户变现
        - 自助式、开发者优先的商户获客
        - OPay 在定价 / 文档透明度不足时，Paystack 是强线上商户替代方案
      - - 银行（Access / UBA / GTBank）
        - 数字支付收入来自大规模转账费和账户主导使用
        - 存款关系、费用、交叉销售、放贷和银行卡经济性
        - 现有薪资 / 活期账户基础和网点建立的信任
        - 银行无需先完成钱包转化，也能守住核心转账
      - - MTN / Airtel 移动钱包
        - 代理和商户经济性主导；尼日利亚消费者确切定价公开透明度较低
        - 电信运营商主导的钱包、账单支付、商户和代理佣金
        - SIM 分发、代理和亭点
        - 压力主要落在辅助现金场景，而不是企业级 PSP
      - - Wave
        - 存款、取款和账单支付免费；转账 1%
        - 低费率钱包，靠商家支付的账单费用和规模经济变现
        - 代理加简单的移动钱包流程
        - 钱包一旦赢得习惯和触达，定价压力能被推到多远，Wave 给出了标尺
    notes: 只有部分竞争对手清楚发布商户定价。公开标价缺失时，该行记录已披露的费用信号和隐含变现逻辑，而不是猜测抽佣率。
