      - number: '2.4'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              最强的增长驱动是结构性的，而非周期性的。尼日利亚普惠金融数据显示，正式普惠率在提升，非银行渠道在放量，移动货币和代理更深入日常金融。CBN 路线图明确偏好更多电子支付、 QR、代理银行、安全和消费者保护。BCG
              认为，第一波非洲金融科技已经证明消费者支付可以放量，下一波取决于让这些轨道为商户、B2B 和公共部门资金流创造生产力。 Mastercard
              从轨道视角给出同样判断：一旦互操作性、协作和欺诈控制改善，实时支付就能从简单转账走向商户和服务使用场景。跨境资金流是另一个被低估的顺风。 World Bank
              来源显示，汇款对尼日利亚仍有实质经济意义，数字渠道也比传统方式便宜，为能同时拼出速度、信任和分发的提供商留下空间。


              主要约束同样具体。监管不是消失，而是在收紧：CBN 金融科技报告显示，市场对监管究竟是赋能还是限制几乎对半分；2026 年网络安全自评提高了合规成本； 2026 年 4 月 PoS
              规则迫使代理走向单一提供商模式，并接受更严格的运营控制。信任仍是硬门槛，因为转账失败、欺诈和投诉解决会直接影响用户选择。基础设施在改善， 但并非无摩擦；Ecofin 对 National Payment
              Stack 的报道和 NIBSS 的 NQR 升级，都说明互操作性和直连是战略优先事项；但 World Bank 汇款研究仍发现跨境走廊存在互操作性不足和数字选项有限。
              最后，估值取决于变现，不只取决于采用。Business A.M. Live 关于零费率 NIP 的报道显示，现金仍是小额支付真正的竞争标尺，即便使用量增长，也会压缩利润率。 结果是，OPay
              可以受益于数字化，但只有在把轨道规模转化为可信、合规、连接商户、并最终更高价值的资金流时才成立；不能假定每一个交易价值统计都等同于可服务收入。
