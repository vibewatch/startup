  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 乐观逻辑
      - 反向逻辑
      - 何种证据会改变判断
    rows:
      - - 锚点演进
        - 从 2021 年 $2.0B 到 2024 年约 $2.75B、2025 年约 $3.1B，估值上行路径可信。
        - 最新标记来自股东内部模型，不是市场出清的交易价格。
        - 若经审计 IPO 披露验证股东标记，乐观逻辑会更强。
      - - 规模叙事
        - 用户、代理和交易量叙事显示 OPay 具备真实的全国规模。
        - 规模口径不一致，未必能干净转化为变现质量。
        - KPI 口径表加上经审计的收入-交易量桥接，可降低歧义。
      - - 公开可比公司支撑
        - 大型金融科技和超级应用可比公司证明，披露充分的平台可以达到十亿美元级估值。
        - 公开支付和超级应用倍数通常低于不透明私募市场要价。
        - 清晰的经审计增长和利润率证据，才能支撑私人估值高于公开市场中位数。
      - - 区域私募可比
        - Flutterwave 和 Moniepoint 说明，非洲金融科技公司可以拿到 $1B-$3B 私募估值标记。
        - 但二者都不能直接证明 OPay 今天应值 $4B，或公开市场会认可。
        - 更干净的同业组，加上经审计 OPay 指标，才能让私募可比迁移更可信。
      - - 尼日利亚集中度
        - 尼日利亚市场很大，也是 OPay 公开可见的最强根据地。
        - 在美国上市语境下，尼日利亚依赖会放大汇率、监管和信任冲击。
        - 按地区拆分的收入和 TPV 结构，能显示集中度是否在下降。
      - - 披露质量
        - 对一家非洲私营金融科技公司而言，Opera 文件提供了少见可见度。
        - OPay 自身仍没有公开、经审计的独立收入、利润率或现金流资料包。
        - 只有 OPay 而不只是 Opera 披露 IPO 级指标，可买性才会明显提高。
    notes: 反向逻辑更多来自披露质量和国家集中度，而不是不相信 OPay 的经营规模。
