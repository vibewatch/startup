  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品套件与客户工作流
        blocks:
          - type: paragraph
            body: >-
              已观测产品证据支持把 OPay 视为一个打包支付平台：消费者钱包居中，商户工具围绕其挂接。尼日利亚最强、已验证的任务很直接：给钱包充值，转给另一个 OPay
              用户或任意银行账户，缴费，购买话费或流量，获取借记卡，并把闲置余额放进 OWealth。围绕这个核心，OPay Business 把同一栈延展到商户收款账户、 转账、POS
              受理、账单服务、储蓄计划和商户贷款；面向埃及的表面又加入收银和分期金融模块。因此，产品组合比纯 P2P 钱包更宽，但披露质量不均。
              官方网页营销色彩很重，且常常坍缩成同一套泛落地页内容，所以真实工作流的最佳证据来自应用商店列表、FAQ 流程和商户文档，而不是结构良好的官方产品地图。 这很重要，因为 OKash、汇款和跨境收银等 OPay
              特定重点在公开表面上可见，但没有同等水平的技术细节或地理具体性。
