  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管边界、身份规则和法律救济是最硬的下行路径
        blocks:
          - type: paragraph
            body: >-
              OPay 的首要风险不是泛泛的金融科技波动，而是高度集中的 Nigeria 监管传导。公开证据显示，公司明确处在 CBN 和 NDIC 边界内，OPay 出现在官方登记中，并据报道在 2026
              年升级为全国牌照。更大的边界带来更高回报，也带来更重监管负担。反向证据已经显示这种负担能多快打到运营：新闻报道把过去的 CBN 审查与罚款、开户暂停和关闭不合规账户联系起来。身份规则很关键，因为它们直接切向
              OPay 的核心便利性叙事。独立报道和 OPay 相关简报称，一级账户和新账户现在需要 BVN 或 NIN；CBN 自己的 BVN 页面则把唯一身份视为 KYC
              有效性和支付系统安全的基础。法律下行同样具体。OPay 条款保留很宽的权力：要求补充信息、因欺诈或 AML
              怀疑拒绝交易、冻结账户、追回拒付、抵销余额并延后结算。这些控制在商业上或许合理；但一旦撞上沟通薄弱或误报，就会从隐藏的后台问题变成直接的信任和诉讼风险。
