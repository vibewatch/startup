      - number: '6.3'
        title: 留存、切换与客户经济性
        blocks:
          - type: paragraph
            body: >-
              OPay
              可能的留存引擎是便利性叠加物理分销，而不是已发布的队列数据。公开记录里最强的切换理由，是即时转账、常见使用场景下低费或无明显消费者费用、商户结算便利、可通过代理门店办卡或现金服务，以及一个明显大于多数纯应用同行的支持网络。TechCabal
              的基准说明，速度和低摩擦执行确实是 OPay 的强项；Nairametrics 则显示，OPay
              正越来越多把客户支持和安全控制做成产品功能，而不是纯粹的被动运营。问题是，公开数据没有证明真正的客户耐久性。公司没有披露经审计的 NRR、GRR、流失或留存队列；商户经济性也有真实压力点。当前 Google
              Play Business 评价一边认可产品，一边抱怨按次付费、重复收费和功能缺口，说明商户满意度为正，但并非对价格不敏感。信任也带有强社会传播属性：TechCabal
              指出，同伴评价在建立信心时与产品速度同样重要。也就是说，服务稳定时 OPay 能留住用户；一旦声誉受损，切换风险仍会快速上升。
