  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 相关性
    rows:
      - - Nigeria 消费者钱包与转账层
        - 钱包充值、银行账户转账、账单支付、银行卡关联的消费者支付活动
        - 存款余额、无关储蓄 AUM 和无抵押贷款余额
        - 消费者用户通常也是付款方；银行和 MMO 提供支付轨道
        - OPay 公开产品页和 CBN PSP 分类中可见的核心日常使用流程
      - - 商户受理和 QR 支付
        - 商户结账、QR 受理、付款通知、对账和结算流程
        - 没有支付角色的通用电商软件或线下库存工具
        - 商户所有者 / 运营者是买方；客户发起支付；银行 / MMO 轨道完成结算
        - 重要性在于，商户数字化是从 P2P 规模通往 B2B 和零售货币化的桥梁
      - - 代理银行和现金存取
        - POS 现金存取、辅助开户、交易协助、本地流动性分发
        - 纯银行网点运营和无关现金物流
        - 代理业主选择服务商；终端客户支付交易费或隐含价差
        - 对欠银行服务和低智能手机渗透人群很关键，也支撑欠服务社区里的信任
      - - 卡和交换基础设施
        - 国内和国际卡组织、交换、结算和互操作服务
        - 与零售支付场景无关的核心制卡或发行处理
        - 银行、卡组织、交换网络和服务商按交易路径分享经济收益
        - 重要性在于，OPay 坐在受监管轨道上，而不是运营封闭网络
      - - 跨境和汇款接收
        - 入境汇款接收、钱包 / 账户入账、转账和提现流程
        - 出口融资、贸易贷款和无关批发外汇交易
        - 侨民汇款人和本地收款人是经济用户；IMTO、银行和钱包分拆费用
        - 具备实质相邻性，因为汇款成本和数字化选项仍会影响跨境走廊转化
      - - 埃及钱包相邻机会与非洲金融科技 TAM
        - 尼日利亚之外的钱包、商户和支付扩张机会
        - 把所有非洲金融科技收入都自动视为 OPay 可服务市场
        - 管理层或投资人可能把它讲成增长期权，而不是当前付费者基数
        - 只能作为上限参考；不能直接替代尼日利亚可服务市场测算
    notes: 边界有意分层。各行把尼日利亚当前受监管支付工作流和更广泛的区域相邻机会拆开，避免本章把交易吞吐量、钱包采用和全非洲金融科技 TAM 压成一个市场数字。
