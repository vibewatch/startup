      - number: '8.3'
        title: 情景区间、上行条件与击穿逻辑
        blocks:
          - type: paragraph
            body: >-
              OPay 不披露经审计的独立收入，也没有清晰的收入到 TPV 桥，因此估值练习只能按情景做，而不是套公式。基准情景应从已经摆在台面上的最强公开锚点出发：Opera 2025 年末隐含价值约 $3.1
              billion。如果审计数字到位、用户和交易规模主张大体成立、监管仍严但可管理，适度的 IPO 准备度溢价可以支撑类似 $2.8-3.6 billion 的区间。这足以说明 OPay
              是有真实企业价值的严肃后期金融科技公司，但还不足以说明 $4 billion IPO 会给买方明显上行。


              乐观情景并非不可能，但有条件。要支撑 $3.8-4.6 billion 区间，OPay 需要 IPO 级别的经审计收入和利润率披露，证明其交易规模能转化为耐久货币化，而不是被补贴出来的习惯；同时不能出现新的
              CBN 或欺诈管理冲击，并且要更清楚说明业务到底有多大比例仍压倒性集中在 Nigeria，而不是已经成为更广泛覆盖非洲和亚洲的平台。悲观情景自然来自同样缺失的证据。如果 IPO 延后，如果 S-1
              等价文件显示抽佣率弱于外界暗示或收入质量较低，或者监管与账户冻结争议升级，公允价值可能很快回到 $1.8-2.6 billion。BusinessDay 对双重上市的批评还增加了另一条下行传导路径：把以
              naira 计的收入换算成 USD 披露，可能让一个本地仍在增长的业务在美国投资人眼里显得更弱。


              因此，击穿投资逻辑的路径很直接。上行要求披露质量提升得比估值野心更快。若经审计披露显示公开叙事夸大了货币化质量，若 Nigeria
              集中度仍然压倒性且没有相应利润率故事补偿，或若合规和欺诈控制问题开始限制开户、信任或定价权，而此时公开市场投资人正被要求承销一个溢价倍数，投资逻辑就会破裂。
