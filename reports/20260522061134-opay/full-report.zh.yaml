  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 按待完成任务划分的格局
        blocks:
          - type: paragraph
            body: >-
              OPay 的竞争格局应按待完成任务拆开，而不是当作一个泛金融科技市场。在尼日利亚，同一个支付问题可以由钱包优先的移动货币运营商如 OPay 和 PalmPay 解决， 也可以由 Moniepoint
              这样的商户和代理银行平台、Flutterwave 和 Paystack 这样的企业 PSP 与收银 API、Interswitch 和 Quickteller 这样的存量轨道、MTN MoMo 与 Airtel
              SmartCash 这样的电信绑定资金模型，或 Access、UBA、GTBank 这样的存款账户银行解决。CBN 名册重要， 因为它显示受监管市场既拥挤，又在功能上混杂：OPay 和 PalmPay 位于
              MMO 集合内，Interswitch、VTNetwork 和 Airtel 相关实体则锚定相邻支付类别。


              这意味着 OPay 并不是在一张计分榜上与一个可比对象赛跑。它是更大栈里的消费者钱包领导者，而不同对手掌握价值链的不同楔子。Interswitch 和 Quickteller
              仍重要，因为它们仍是存量支付管道和公用事业缴费习惯的一部分，即便它们不像 OPay 或 PalmPay 那样制造同等 App 层热度。最大的市场份额疑点也来自这种结构：
              公开牌照清单和类别总量不能干净转换为逐提供商份额，因此本章按使用场景处理竞争，而不暗示存在一个赢者通吃排行榜。
