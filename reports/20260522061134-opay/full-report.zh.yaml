            body: >-
              采用证据最强的地方，是公司发布的规模主张能与可观察或独立客户界面互相印证。公司发布稿显示，OPay 到 2025 年末已超过 5000 万用户、100 万商户，日活跃用户超过 2000
              万。独立媒体没有完整审计这些数字，但 Ecofin 复述了总体规模故事，TechCabal 的 FOLIO 基准则提供了对真实可用性的外部观察，而不只是营销文案。在这项 2026 年基准中，OPay
              在十款被审计支付应用中总排名第一，摩擦分数也领先同类；这很有意义，因为 FOLIO 使用已验证用户完成真实注册、KYC、入金和转账流程。可观察的应用商店界面同样重要：iOS 消费者应用有 8.8 万个评分、评分
              4.5；OPay Business 应用有 3.41 万条评价、评分 4.7。具名客户证据比原始规模证据薄，但并非没有。管理层引用用户和商户对便利性、可靠性的正面评价；Nairametrics
              采访了现有交易员和备用用户，评论呈现混合态度，并非纯宣传。正确解读是：OPay 有大量触达信号，也有一定客户源头证据，但独立验证的具名部署仍然有限。
