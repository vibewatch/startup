      - - Opera 对 9.4% 股权的账面价值
        - 2024 年末
        - 约 US$2.75B
        - 知情股东的账面估值标记，给出上一轮后首个公开桥点。
        - 只是账面价值，不是公平交易融资事件。
      - - Opera 对 9.5% 股权的账面价值
        - '2025-12-31'
        - 约 US$3.10B
        - IPO 文件前，当前最强的公开锚点。
        - 基于概率加权的退出假设。
      - - 据报道 IPO 目标
        - 2026-05
        - 约 US$4.0B
        - 界定当前定价讨论。
        - 仅为媒体报道目标；招股书或银行估值备忘录均未公开。
      - - IPO 目标较 Opera 账面标记的溢价
        - 2026-05 对比 2025-12-31
        - ~29%
        - 说明据报道的 IPO 估值抬升在账面上幅度可观，但并不离谱。
        - 基准锚点本身不确定，且运营公司层面未经审计。
      - - 自洽性判断
