      - number: '8.2'
        title: 可比公司集合与倍数逻辑
        blocks:
          - type: paragraph
            body: >-
              合适的可比集合本来就必须混合，因为没有单一同行完全匹配 OPay 这种 Nigeria 重、低费率、钱包加商户的模型。最好的公开现实校验来自行业和上市金融科技倍数，而不是某一个公司克隆体。Finro 的 2026
              年第一季度数据说明，锚定标题平均数很危险：广义金融科技平均 EV/revenue 为 14.5x，但中位数只有 7.6x；支付公司平均 7.7x，中位数却只有 3.6x。中位数与平均数的落差很重要，因为 OPay
              看起来更像一个交易密集、监管暴露高的支付平台，而不是把平均数拉高的软件型离群值。


              Nubank 有参考价值，因为它是规模很大的上市数字金融平台，但它更凸显披露缺口，而不是解决披露缺口。Multiples.vc 显示 Nubank LTM 收入约 $18 billion、EV 约 $62
              billion，约为 3.4x EV/revenue；CompaniesMarketCap 显示其 2026 年 5 月市值约 $64 billion。Kaspi 报出的 1.85x price/sales 和
              7.3x 标准化 P/E 说明，即便是盈利且披露充分的超级应用，在公开市场也可能被压到低得多的倍数。Paytm 市值约 $7.4 billion，并在 FY26
              恢复盈利，说明即便有扭亏证据，公开投资人仍可能保持怀疑。Mercado Pago 在钱包、商户和信贷强度上方向相关，但 MercadoLibre 是电商与金融科技混合体，其约 $85 billion
              市值不是干净的 Mercado Pago 独立倍数。非洲私有同行是另一组锚点。Moniepoint 2024 年 $1 billion-plus 轮和 Flutterwave 2022 年 $3
              billion-plus 轮表明，地区内十亿美元级私有金融科技估值并不稀奇；但没有一个同行能消除核心限制：OPay 仍缺少经审计的收入、利润率和资产负债表披露。可比公司的教训因此不是“OPay 应该拿 X
              倍销售额”。真正的结论是，公开可比公司通常在披露数字基础上兑现低到中个位数收入倍数；而不透明的后期私有标记只有在投资人相信披露质量会快速追上时，才可能跑在前面。
