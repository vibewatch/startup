  - id: TP001
    title: 竞争对手名单
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资信号
      - 目标客群
      - 差异化
      - 局限
    rows:
      - - OPay
        - 钱包 / 消费者转账 / 商户服务
        - 2021 年 $2B 融资；尼日利亚大众钱包品牌
        - 消费者、微型商户、代理协助用户
        - 近似免费的转账、卡、缴费，以及广泛日常认知
        - 公开商户定价及企业 / 跨境细节比 PSP 同业更薄
      - - PalmPay
        - 钱包 / 超级 App / 代理生态
        - 据报道尼日利亚 35M 用户；1.2M 代理和商户
        - 消费者、微型商户、首个金融 App 用户
        - 清晰度和信任信号强，辅助分销密集
        - 企业深度和透明商户定价在公开信息中仍不够可见
      - - Moniepoint
        - 商户收单 / 企业银行 / 代理银行
        - 2024 年 $110M 融资，估值 $1B+；称月交易 800M+ 笔、月 TPV $17B+
        - SME、代理、商户
        - 企业账户、卡、支持和运营工具
        - 在纯消费者钱包习惯上，不如 OPay 显得占优
      - - Flutterwave
        - 企业 PSP / 收银 / 付款
        - 2022 年估值 $3B；据报道覆盖 900K 家企业和 34 个国家
        - 企业、初创公司、跨境商户
        - API、线上收银、付款、发票、广泛支付方式支持
        - 线下消费者分销弱于钱包和银行主导的竞争对手
      - - Paystack
        - 开发者优先 PSP / 收银 / 终端
        - Stripe 以 $200M+ 收购 Paystack；收购时约 60K 客户
        - SME、开发者、电商商户
        - 文档清晰、交易成功率叙事强、定价透明
        - 线下和代理足迹小于 OPay 或 Moniepoint
      - - Interswitch / Quickteller
        - 既有支付轨道 / 消费者公共事业缴费
        - 非洲支付基础设施深厚，触达消费者和企业
        - 银行、企业、缴费用户
        - 基础设施深度、长期信任、广泛轨道足迹
        - 当前消费者 App 势头不如新钱包可见
      - - MTN MoMo
        - 电信移动货币 / 代理存取现
        - 代理主导模式，提供存现、取现、缴费和商户 QR 工具
        - 大众市场和代理协助用户、商户
        - 电信渠道分销和辅助交易
        - 尼日利亚消费者产品公开细节比钱包龙头更薄
      - - Airtel SmartCash / Airtel Money
        - 电信 / PSB 替代
        - Airtel Africa 披露 2025/26 年 54.1M 客户、2.4M 代理、TPV $196B
        - 无银行账户用户、代理、商户
        - Airtel 渠道、代理、商户支付、贷款和 IMT
        - 尼日利亚特定钱包细节不如 Airtel 集团披露可见
      - - Access Bank
        - 银行账户替代
        - AccessMore App 打包开户、外汇、QR、缴费和奖励
        - 工资账户和活期账户用户
        - 主账户关系叠加广泛银行服务包
        - 用户体验不如钱包优先 App 那样单一聚焦
      - - UBA
        - 银行账户替代
        - UBA App 集成转账、缴费、账户、贷款和更强认证
        - 已有银行账户的零售和 SME 用户
        - 存款主导关系和安全控制更重的交易管控
        - 更高价值认证相比即时钱包流程可能增加摩擦
      - - GTBank
        - 银行账户替代 / 移动货币 / 代理银行
        - GTWorld 加 GTExpress 组合移动银行、移动货币和代理
        - 已有银行账户零售用户、服务不足用户和代理协助用户
        - 一个机构内打包账户、贷款、缴费和代理栈
        - 定位并非最低摩擦的消费者钱包品牌
      - - Wave
        - 西非低费率替代基准
        - 据报道 20M MAU、150K+ 代理、1% 发送费，以及 2025 年债务融资
        - 法语西非移动货币用户
        - 极低费率模式，代理触达强
        - 不是尼日利亚规模的企业 PSP，也不是尼日利亚用户当前默认选择
    notes: 规模信号混合了公司页面和可靠报道。各行按使用场景比较最相关的尼日利亚和西非替代方案；部分数字是历史融资锚点，而非当前市场份额。
