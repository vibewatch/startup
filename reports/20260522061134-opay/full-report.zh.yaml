  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 状态 / 日期
      - 估值或倍数锚点
      - 对 OPay 的相关性
      - 局限
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-useful public and private valuation references for OPay as of the 2026-05-22 run date,
        combining direct OPay anchors, public-market fintech comps, and African private-fintech rounds rather than every
        imaginable listed bank or payments company.
    rows:
      - - OPay Series C 轮
        - 私募轮，2021
        - $2.0B 投后估值
        - 最近一次有定价的新股融资，也是最干净的历史硬锚点。
        - 对 2026 年决策已经滞后，也早于 OPay 当前规模画像。
      - - Opera 2024 年账面价值隐含的 OPay 估值
        - 少数股东标记，2024
        - 隐含约 $2.75B
        - 显示 OPay 相比 2021 年融资轮已明显升值。
        - 来自股东账面价值，不是第三方融资事件。
      - - Opera 2025 年账面价值隐含的 OPay 估值
        - 少数股东标记，2025 年末
        - 隐含约 $3.1B
        - IPO 文件出现前，当前最好的公开锚点。
        - 基于概率加权内部估值模型，不是交易形成的市值。
      - - OPay 据报道的美国 IPO 目标
        - 新闻报道，2026 年 5 月
        - 目标约 $4.0B
        - 界定新投资者面对的实际入场问题。
        - 仅是报道中的目标；尚无公开招股书。
      - - Nubank
        - 上市公司，2026 年 5 月
        - 基于约 $18B LTM 收入和约 $62B EV，EV/revenue 约 3.4x
        - 用于估值纪律的最接近大型已披露数字金融可比公司。
        - 规模大得多、地区更多元，且完全上市披露。
      - - Mercado Pago / MercadoLibre
        - 上市公司，2026 年 5 月
        - MELI 市值约 $85.1B；没有干净的 Mercado Pago 独立倍数
        - 对新兴市场的钱包、商户和信贷组合有参考价值。
        - 电商加金融科技的组合，让迁移到 OPay 时噪音较大。
      - - Paytm
        - 上市公司，2026 年 5 月 / FY26
        - 首次年度盈利、FY26 收入 ₹8,437 crore 后，市值约 $7.4B
        - 说明支付平台恢复盈利后，公开市场投资者仍会挑剔。
        - 印度特定监管、分销和会计口径限制直接可比性。
      - - Kaspi.kz
        - 上市公司，2026 年 5 月 / FY2025
        - 1.85x 市销率和 7.30x 标准化 P/E
        - 对披露充分且盈利的金融科技经济模型，是有用的超级应用参照。
        - 披露和盈利能力远强于今天的 OPay。
      - - Moniepoint
        - 私募轮，2024
        - $1B+ 估值
        - 低于 OPay 报道估值水平的近期最佳非洲私营金融科技交叉验证。
        - 商户 / SME 银行业务组合不同于 OPay 的消费者钱包定位。
      - - Flutterwave
        - 私募轮，2022
        - $3B+ 估值
        - 证明聚焦非洲的金融科技平台可以拿到数十亿美元私募估值标记。
        - 轮次较旧，融资环境不同，模式也更偏企业 / API。
    notes: 由于 OPay 缺少经审计收入和利润率数据，表中有意混合公开可比公司和非洲私募轮。用途是三角验证，而不是机械地给不透明资产套单一倍数。
