        - 2023-2024
        - Sub-Saharan Africa / Nigeria corridors
        - $54B SSA remittances in 2023; 8.45% average SSA remittance cost in Q3 2024
        - Not stated
        - Cross-border flow and cost lens relevant to wallet/remittance expansion
        - High
        - Measures remittance flows and costs, not domestic payments-market revenue
    notes: These lenses intentionally mix observed throughput, revenue-like forecasts, and adjacent regional opportunity frames. They are not additive and should be used to bracket OPay’s opportunity rather than to assert one “true” TAM.
