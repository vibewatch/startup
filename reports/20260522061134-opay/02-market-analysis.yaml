  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: sam-som-gap
      missingEvidence: A management-grade bridge from Nigeria rail throughput and public market forecasts to OPay’s actual serviceable segments, take rates, and near-term capture assumptions.
      whyItMatters: Without a segment-level capture model, transaction scale can be mistaken for addressable revenue and the investment case can overstate monetization headroom.
      diligencePath: Request OPay’s internal market-sizing workbook broken out by consumers, merchants, agents, SMEs, remittances, and any Egypt or broader Africa adjacency assumptions.
      relatedQuestionRefs:
        - QM025
      relatedTableRefs:
        - TM002
    - type: conflicting-data
      severity: material
      topic: tam-bridge
      missingEvidence: A normalized reconciliation of CBN throughput statistics, BlueWeave’s Nigeria market-value forecast, AFI’s Africa e-payments estimate, and BCG’s Africa fintech TAM.
      whyItMatters: Preserving contradictory estimates is better than forcing one number, but valuation work still needs an apples-to-apples bridge between throughput, market value, and provider revenue.
      diligencePath: Rebuild the sizing stack by mapping each source to unit, geography, time period, included flows, and explicit revenue assumptions, then compare against management’s own planning model.
      relatedQuestionRefs:
        - QM006
        - QM008
        - QM026
      relatedTableRefs:
        - TM002
    - type: missing-source
      severity: material
      topic: budget-owner-opacity
      missingEvidence: Publicly verifiable examples showing who signs and pays for OPay-class merchant, SME, and agent contracts by segment.
      whyItMatters: Market attractiveness depends on whether economics sit with consumer fees, merchant acceptance, agent commissions, SME workflow budgets, or infrastructure counterparties.
      diligencePath: Ask management for anonymized recent deal examples showing signer title, budget owner, unit economics, and whether the flow was direct, partner-led, or agent-led.
      relatedQuestionRefs:
        - QM027
      relatedTableRefs:
        - TM003
    - type: conflicting-data
      severity: minor
      topic: device-constraint
      missingEvidence: A harmonized 2023-2024 Nigeria device-ownership and smartphone-use dataset that reconciles the 93% and 99% phone-ownership summaries and clarifies true smartphone penetration among target users.
      whyItMatters: App-led adoption assumptions are sensitive to device capability, and conflicting phone-ownership summaries can distort the case for wallet-first versus agent-assisted growth.
      diligencePath: Pull the underlying EFInA/A2F cross-tabs and compare them with GSMA and operator data by geography, gender, and urban-rural segment.
      relatedQuestionRefs:
        - QM016
      relatedTableRefs:
        - TM003
    - type: missing-source
      severity: minor
      topic: egypt-adjacency
      missingEvidence: Direct evidence that OPay is actively building or operating against the Egyptian wallet opportunity rather than merely having historical expansion intent.
      whyItMatters: Egypt is a useful adjacency lens for wallet-scale economics, but it should not influence OPay valuation materially unless there is current execution evidence.
      diligencePath: Request current country roadmap materials, licensing status, local hiring plans, or partner announcements that tie OPay specifically to Egypt.
      relatedQuestionRefs:
        - QM010
      relatedTableRefs:
        - TM002
