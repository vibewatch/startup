  - id: TM003
    title: 'Segment / buyer map'
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Mass-market consumer
        - Individual choosing wallet or transfer app
        - Same individual using wallet, transfer, bills, or card
        - Usually self-funded wallet or linked account
        - App or assisted-agent onboarding, then repeat transfers and bill pay
        - Household cash-flow budget
        - Need for cheaper, faster everyday payments than cash or branch visits
      - - POS / cash-in-out agent
        - Agent proprietor selecting provider uptime and support
        - Agent staff plus local consumers
        - Agent economics funded by transaction fees and float turnover
        - Dedicated account/device, assisted deposits or withdrawals, local liquidity management
        - Small-business working-capital owner
        - Foot traffic, reliability, fraud control, and single-provider compliance under new rules
      - - Micro-merchant
        - Shop owner or informal merchant
        - Merchant cashier and end customer
        - Merchant pays acceptance costs implicitly or explicitly; customer pays purchase amount
        - QR/POS acceptance, settlement, reconciliation, repeat checkout use
        - Owner-operated merchant budget
        - Need to reduce cash handling, receive instant value, and improve reconciliation
      - - SME operator
        - Founder, ops lead, or finance owner
        - Staff taking payments and making supplier or wage flows
        - Business operating budget
        - Merchant acceptance plus transfer, payroll-like, and supplier payment workflows
        - SME owner-manager or finance lead
        - Better throughput, faster settlements, and business payments on top of consumer collection
      - - Banks / schemes / switches
        - Regulated financial institutions and scheme operators
        - PSPs, MMOs, merchants, and consumers downstream
        - Economics shared via scheme, switching, settlement, and compliance roles
        - Provide rails, interoperability, card or QR standards, and settlement access
        - Institutional payments and infrastructure budgets
        - Need to keep national rails safe, interoperable, and commercially viable
    notes: Budget-owner labels are directional. Public sources are far better at describing workflow roles and distribution mechanics than at naming the exact contract signatory or commercial pricing split for each segment.
