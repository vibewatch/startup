  - id: TM004
    title: 'Growth drivers and constraints table'
    columns:
      - Driver / constraint
      - Direction
      - Timing
      - Implication
      - Diligence ask
    rows:
      - - Non-bank inclusion gains and agent-network depth
        - Tailwind
        - Current to multi-year
        - EFInA and IMF evidence show distribution is expanding beyond banks, helping OPay-class providers reach underbanked users
        - What share of new OPay actives come from agent-assisted rather than app-first onboarding?
      - - Merchant digitization and QR acceptance
        - Tailwind
        - Current to multi-year
        - AFI and NQR evidence show merchant acceptance is the bridge from P2P scale to SME and B2B monetization
        - What percentage of OPay throughput is merchant-originated rather than pure consumer transfers?
      - - Public-rail upgrades (NQR, NPS, zero-fee NIP ambition)
        - Tailwind
        - 2025-2026 onward
        - Faster interoperability and lower transfer friction can grow volume and keep cash substitution pressure high
        - Does direct NPS connectivity improve OPay economics or mostly reduce systemic friction for all players?
      - - Remittance digitization
        - Tailwind
        - Current to multi-year
        - Digital remittances are cheaper than legacy methods, creating a potential cross-sell path into wallet usage
        - How many remittance recipients can OPay onboard into retained wallet balances versus immediate cash-out?
      - - Tightening regulation, KYC, and cybersecurity requirements
        - Constraint
        - Immediate
        - Compliance cost rises as the CBN tightens supervision, cybersecurity reporting, and agent controls
        - What is OPay’s incremental compliance spend and how does it affect marginal economics by segment?
      - - Trust, fraud, and dispute resolution
        - Constraint
        - Immediate and persistent
        - Failed transfers or fraud events directly change user and agent provider choice, slowing durable adoption
        - What are transaction-failure, reversal-time, fraud-loss, and complaint-resolution benchmarks versus peers?
      - - Device, literacy, and rural access gaps
        - Constraint
        - Persistent
        - High phone ownership does not eliminate low-smartphone and low-literacy barriers, preserving the need for assisted channels
        - What share of OPay activity depends on USSD, agents, or low-data workflows rather than full app usage?
      - - Margin pressure from cash competition and low-fee expectations
        - Constraint
        - Persistent
        - If cash remains the benchmark and core rails trend toward zero-cost transfers, volume growth may outrun monetization
        - Which revenue streams beyond transfer fees support sustainable contribution margins?
    notes: The table separates adoption tailwinds from monetization constraints. Some forces increase usage while simultaneously compressing economics, which is why transaction scale should not be equated with valuation quality.
