  - id: sizing-lenses-and-contradictions
    title: 'Sizing Lenses, Adoption Evidence, and Contradictory Estimates'
    body: |-
      The market is unquestionably large in throughput terms, but the public sizing record is fragmented by unit, scope, and valuation agenda. CBN’s own H1 2024 e-payment statistics already show 22.42 billion total e-payment transactions worth ₦1.559 quadrillion, with MMOs alone at 7.18 billion transactions worth ₦78.2 trillion and POS at 6.40 billion worth ₦85.9 trillion. Those numbers are best read as observed rail activity, not revenue TAM. BlueWeave instead publishes a revenue-like Nigeria digital-payments market estimate of $9.66 billion in 2024 growing to $28.13 billion by 2031 at a 16.5% CAGR. Africa-wide strategy houses go broader still: AFI cites an African digital-payments market expected to reach about $40 billion by 2025, while BCG projects African fintech revenues around $65 billion by 2030 and frames payments as the dominant growth engine. These figures are all useful, but they do not describe the same market quantity.

      The right analytical approach is to preserve the contradiction rather than smooth it away. CBN’s numbers describe payment-system usage and channel throughput. BlueWeave describes a Nigeria market-value forecast. AFI and BCG describe broader continental revenue pools or structural industry opportunity. Even within Nigeria-specific lenses, the evidence is not perfectly harmonized: BlueWeave says e-payments hit ₦1.07 quadrillion in 2024, while the CBN H1 2024 table alone already exceeds that level, implying different definitions, channel subsets, or time cuts. Adjacent evidence from Egypt reinforces the point that wallet-heavy digital-payment ecosystems can scale quickly—mobile-wallet transactions there reached roughly EGP 4 trillion by end-2025 with 60 million wallets—but that adjacency is only partially relevant to OPay unless its Egypt expansion becomes operationally material. For valuation work, the chapter therefore uses multiple constrained lenses: observed Nigerian throughput, Nigeria revenue-like market forecasts, Africa-wide payments/fintech TAM framing, and Egypt wallet-adoption adjacency.
