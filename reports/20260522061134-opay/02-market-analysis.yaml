  - id: growth-drivers-and-constraints
    title: 'Growth Drivers, Constraints, and Valuation Relevance'
    body: |-
      The strongest growth drivers are structural rather than cyclical. Nigeria’s inclusion data shows formal inclusion rising, non-bank channels scaling, and mobile money plus agents reaching further into everyday finance. CBN’s road map explicitly favors more electronic payments, QR, agent banking, security, and consumer protection. BCG argues that the first African fintech wave proved consumer payments can scale and that the next wave depends on making those rails productive for merchants, B2B, and public-sector flows. Mastercard makes the same point from a rails perspective: real-time payments can move beyond simple transfers into merchant and service use cases once interoperability, collaboration, and fraud controls improve. Cross-border flows are another underappreciated tailwind. World Bank sources show remittances remain economically material for Nigeria and that digital channels are cheaper than legacy methods, creating room for providers that can combine speed, trust, and distribution.

      The main constraints are equally concrete. Regulation is tightening rather than disappearing: the CBN fintech report showed the market split evenly on whether regulation is enabling or restrictive, 2026 cybersecurity self-assessments add compliance cost, and April 2026 PoS rules force agents toward a single-provider model with stricter operational controls. Trust remains a hard gating factor because failed transfers, fraud, and complaint resolution directly influence provider choice. Infrastructure is improving but not frictionless; Ecofin’s National Payment Stack coverage and NIBSS’s NQR upgrades both show why interoperability and direct connectivity are strategic priorities, yet World Bank remittance work still finds inadequate interoperability and limited digital options in cross-border corridors. Finally, valuation depends on monetization, not just adoption. Business A.M. Live’s zero-fee NIP story shows that cash remains the true competitive benchmark for small-value payments, which pressures margins even as usage grows. The result is a market where OPay can benefit from digitization, but only if it converts rail scale into trusted, compliant, merchant-linked, and eventually higher-value flows without assuming every transaction-value statistic is equivalent to serviceable revenue.
