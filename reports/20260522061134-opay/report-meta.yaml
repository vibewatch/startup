summary:
  headline: OPay is a scaled and strategically important Nigerian payments leader, but limited audited disclosure, Nigeria concentration, and recurring compliance or fraud-control issues keep the case in track territory and make the reported IPO ambition look stretched.
  overallScore: 6.7
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
