chapter:
  number: 5
  title: Product & Technology
  summary: OPay's public product stack looks strongest where a wallet, card, merchant collection, agent/POS, and trust-control bundle are layered over Nigerian payment rails. API docs and app signals show credible product depth, but architecture disclosure is thin, partner dependence is high, and cross-border or remittance detail remains materially under-documented.
sections:
- id: product-suite-and-workflows
  title: Product Suite and Customer Workflows
  body: 'Observed product evidence supports OPay as a bundled payments platform with a consumer wallet at the center and merchant tools attached around it. The strongest verified Nigeria jobs are straightforward: fund a wallet, transfer to another OPay user or any bank account, pay bills, buy airtime or data, get a debit card, and place idle balances into OWealth. Around that core, OPay Business extends the same stack into merchant collection accounts, transfers, POS acceptance, bill services, savings plans, and merchant lending, while Egypt-facing surfaces add checkout and installment-finance modules. The product mix therefore looks broader than a pure P2P wallet, but disclosure quality is uneven. The official web pages are heavily marketing-led and often collapse into the same generic landing content, so the best evidence for actual workflows comes from the app-store listings, FAQ flows, and merchant docs rather than from a well-structured official product map. That matters because OPay-specific
    focus areas such as OKash, remittance, and cross-border checkout are visibly present on the public surface, but not at the same level of technical detail or geographic specificity.'
