  evidenceGaps:
  - type: missing-source
    severity: material
    topic: architecture-disclosure
    missingEvidence: A current OPay architecture diagram or engineering note covering ledger services, fraud services, settlement orchestration, and failover design.
    whyItMatters: Without a direct systems map, product-tech conclusions rely on inference from APIs, app copy, and partner docs rather than on first-party technical disclosure.
    diligencePath: Request CTO or platform-engineering materials, status-page history, incident postmortems, and a merchant settlement sequence diagram during diligence.
    relatedQuestionRefs:
    - QE023
    - QE025
  - type: missing-source
    severity: material
    topic: cross-border-remittance
    missingEvidence: A corridor-by-corridor list of live remittance or international payment products for Nigeria users, including settlement banks, FX partners, fees, and compliance limits.
    whyItMatters: Public materials imply cross-border capability, but the exact corridor coverage and settlement design are not clear enough to underwrite growth or compliance complexity.
    diligencePath: Request corridor matrix, country launch list, regulated entity map, and FX or settlement partner schedule for each remittance and checkout product.
    relatedQuestionRefs:
    - QE019
    - QE025
  - type: private-evidence-only
    severity: material
    topic: fraud-loss-and-reversals
    missingEvidence: Internal data on fraud losses, false-positive rates, reversal SLAs by rail, complaint resolution times, and control effectiveness for NightGuard and Large Transaction Shield.
    whyItMatters: Visible controls are not enough to judge whether the product meaningfully outperforms peers on trust or whether legal and complaints risk is still structurally elevated.
    diligencePath: Ask risk, operations, and support teams for monthly control dashboards, incident cohorts, and rail-specific dispute-resolution performance.
    relatedQuestionRefs:
    - QE015
    - QE021
    - QE025
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: minor
    topic: merchant-scale-referenceability
    missingEvidence: Named enterprise or field-operations customer case studies showing live use of subordinate wallets, sweeps, QR, or merchant acceptance at scale.
    whyItMatters: The documentation implies strong merchant capabilities, but without named deployments it is hard to separate feature availability from scaled customer adoption.
    diligencePath: Request customer references, case studies, merchant GMV cohorts, and deployment examples segmented by POS, QR, and digital-wallet collections.
    relatedQuestionRefs:
    - QE010
    - QE025
    relatedTableRefs:
    - TE001
    - TE002
