- id: FE002
  title: Customer workflow / operating flow
  type: flow
  layout: standard
  summary: Observed and inferred flow from onboarding into everyday use for both consumer and merchant OPay journeys.
  approximationNotes: This flow combines documented app features, FAQ steps, and API mechanics. Merchant settlement internals after successful authorization are not fully disclosed and are simplified here.
  data:
    nodes:
    - id: w1
      label: Identity and account setup
      detail: Consumer opens wallet or merchant app; higher-tier flows depend on BVN or NIN checks and merchant KYC documents.
    - id: w2
      label: Wallet or merchant account activation
      detail: Account becomes usable for transfers, bill pay, collections, or card management.
    - id: w3
      label: Funding or collection initiation
      detail: User funds wallet or merchant creates collection request, QR, POS acceptance, or transfer instruction.
    - id: w4
      label: Authorization and risk checks
      detail: User authenticates with PIN, biometrics, NightGuard, card controls, or merchant checkout flow; system screens unusual activity.
    - id: w5
      label: Rail execution
      detail: Transaction rides bank, card, QR, or partner checkout rails; merchant APIs can wait for callback or webhook.
    - id: w6
      label: Settlement and visibility
      detail: Customer or merchant sees balance change, notification, history, and where relevant a sweep into the merchant account.
    - id: w7
      label: Support and exception handling
      detail: FAQ support tab, hotlines, WhatsApp groups, bank follow-up, or legal escalation address failed or disputed flows.
    edges:
    - from: w1
      to: w2
    - from: w2
      to: w3
    - from: w3
      to: w4
    - from: w4
      to: w5
    - from: w5
      to: w6
    - from: w6
      to: w7
      label: if reversal, complaint, or dispute
