callouts:
- calloutType: strength
  title: Distribution-led product moat beats disclosure-led moat
  body: OPay's clearest advantage is not a publicly documented proprietary core-banking architecture; it is the combination of wallet convenience, agent reach, merchant acceptance, and hybrid online-offline accessibility that keeps the product useful when bank channels fail.
  claimRefs:
  - CE031
  - CE032
  - CE039
- calloutType: risk
  title: Partner and rail dependence is material
  body: Bank integrations, card schemes, switches, NQR infrastructure, and national identity rails are all in the execution path. That makes OPay scalable inside Nigeria's payment system, but it also means outages, disputes, and reconciliation issues can originate outside OPay's own codebase.
  claimRefs:
  - CE018
  - CE019
  - CE020
  - CE034
  - CE040
- calloutType: risk
  title: Public architecture disclosure remains below diligence quality
  body: The API and wallet docs are real and useful, but they do not answer investor-grade questions on uptime history, fraud-loss rates, processor redundancy, settlement-bank maps, or live remittance corridors. Chapter conclusions therefore lean heavily on observed workflows and cautious inference.
  claimRefs:
  - CE024
  - CE035
  - CE038
  - CE042
