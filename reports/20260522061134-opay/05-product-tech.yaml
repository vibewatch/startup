    - Live and mature
    - Daily-interest positioning with instant access and additional savings modes
    - Underlying product structure, balances, and yield mechanics are not public
  - - Flexible loans / OKash-like credit
    - Consumers
    - Consumer app + Reuters press release
    - Live but thinly disclosed
    - Credit is embedded into the same wallet experience
    - No public underwriting, default, or funding disclosures
  - - Merchant collection account
    - Merchants / SMEs
    - Business app + FAQ + signup portal
    - Live and mature
    - Business account can be opened from phone and tied to payment collection
    - No public ledger or settlement architecture diagram
  - - Merchant POS + offline acceptance
    - Merchants / agents
    - Business app + FAQ + Egypt page
    - Live and mature
    - In-app POS application, 48-hour delivery claim, and free swaps
    - No public device-fleet telemetry or failure-rate data
  - - Digital wallets / branch collections
    - Enterprises / field networks
    - Digital Wallets docs
    - Live and technically specific
