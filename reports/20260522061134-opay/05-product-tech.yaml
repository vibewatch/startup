figures:
- id: FE001
  title: Product architecture map
  type: stack
  layout: wide
  summary: Layered view of the public OPay stack from user-facing apps down through rails, APIs, and external identity or settlement dependencies.
  approximationNotes: Architecture is inferred from public docs, app-store listings, and regulatory rails. OPay does not publish a full internal diagram, so internal services are intentionally generalized.
  data:
    layers:
    - label: User-facing experiences
      detail: Retail wallet app, merchant app, agent/POS touchpoints, and support channels are the primary operating surfaces.
      items:
      - Consumer wallet app
      - OPay Business app
      - Agent / POS distribution touchpoints
      - 24/7 support and USSD lock flows
    - label: Product modules
      detail: Publicly disclosed modules group around payments first, then cards, savings, credit, and merchant operations.
      items:
      - Transfers and bill pay
      - Debit card management
      - OWealth / savings tools
      - Merchant collection accounts
      - POS and QR acceptance
      - Flexible loans / merchant finance
    - label: Merchant and collections APIs
      detail: Checkout and digital-wallet documentation show payment creation, QR or R2P, callbacks, sub-wallets, balance checks, and sweeps.
      items:
      - E-wallet payment API
      - Callback / webhook handling
      - Deposit-code wallets
      - Sweep to merchant account
    - label: Payment and identity rails
      detail: OPay relies on bank-transfer rails, card schemes or switches, NQR or request-for-payment infrastructure, and BVN or NIN identity rails.
      items:
      - Nigerian bank integrations
      - Card / ATM / POS rails
      - NIBSS NQR and RfP ecosystem
      - BVN / NIN / NRBVN identity services
    - label: External ecosystem and governance
      detail: Regulation, insurance messaging, partner checkout integrations, and regional operating entities shape the usable edge of the platform.
      items:
      - CBN / NDIC oversight
      - Flutterwave partner acceptance
      - Verve card partnership
      - Nigeria / Egypt / global merchant entities
