- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - OPay surface
  - Public signal
  - Limitation / caveat
  rows:
  - - Send money to another person
    - Fund wallet, choose phone number or bank account, confirm transfer
    - Consumer app / wallet
    - App says transfers can go to non-OPay users and all Nigerian banks
    - Exact bank-rail routing, failure handling, and reversal SLAs are not public
  - - Spend from wallet on card rails
    - Apply for card, receive through app or agent, manage in app
    - Consumer app + card
    - In-app controls include PIN change, limits, block/unblock, and card details
    - Scheme and processor relationships are only partly visible
  - - Earn yield on idle cash
    - Move balance into OWealth or another savings mode
    - Consumer app
    - OWealth markets daily interest with ongoing access to funds
    - Yield source, treasury policy, and balance scale are undisclosed
  - - Open a merchant collection account
    - Download app, register, pass KYC, receive account for collections
    - Business app + FAQ
    - FAQ lists BVN, ID, address proof; app opens merchant account on phone
    - Public documents do not show reviewer or approval SLA detail
  - - Accept POS or QR payments
    - Apply in app, receive device, collect customer payment, monitor support and reversals
    - Business app + NQR rail
    - App claims real-time POS application; NQR explains interoperable merchant QR flow
    - OPay-specific QR deployment detail is inferred, not published end-to-end
  - - Run field or branch collections
    - Create subordinate wallet, take payments, sweep to main merchant account
    - Digital Wallets docs
    - Docs expose deposit code, transaction-history, balance, and sweep endpoints
    - No public customer stories confirm operational scale
  - - Handle a transfer or reversal issue
    - Escalate through support tab, WhatsApp group, or bank escalation path
    - FAQ + support lines
    - FAQ describes instant reversals in-system and bank follow-up when partner bank is still debited
    - Cross-rail disputes can still escalate into legal or trust issues
  notes: Workflows combine directly observed product copy with inferred rail steps where OPay documentation is silent; limitations mark where the public record stops.
