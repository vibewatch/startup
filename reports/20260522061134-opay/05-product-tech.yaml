- id: architecture-and-partner-rails
  title: Architecture, Rails, and Partner Dependencies
  body: 'Public documentation is enough to infer the broad shape of the operating model even though OPay does not publish an end-to-end architecture diagram. Merchant acceptance appears to be API-led: the checkout docs show QR and request-to-pay flows, callbacks, webhooks, signatures, sandbox and production endpoints, while the digital-wallets docs show subordinate wallets, balance checks, transaction-history queries, and sweep-to-merchant transfers. That is a meaningful technical surface and suggests the company can orchestrate consumer wallet payments, merchant collections, and field or sub-merchant operations from the same underlying platform family. But the stack is also clearly rail-dependent. Consumer transfers are described as powered by Nigerian banks; QR adoption likely sits on top of NIBSS NQR and CBN-backed request-for-payment infrastructure; card usage depends on scheme and switch relationships; onboarding depends on BVN or NIN retrieval from national databases; and partner acceptance
    can be abstracted through aggregators such as Flutterwave. The architecture is therefore best described as a hybrid orchestration layer over regulated Nigerian and partner rails, not a closed proprietary network.'
  claimRefs:
