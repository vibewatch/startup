  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Audited standalone OPay revenue, gross profit, and segment mix by wallet, merchant, cards, lending, and wealth.
    whyItMatters: Without audited segment disclosure, it is impossible to convert TPV and product breadth into a defensible take-rate and margin model.
    diligencePath: Request the latest audited management accounts and a revenue bridge from TPV to net revenue by stream.
    relatedQuestionRefs:
    - QI007
    - QI008
    - QI025
    relatedTableRefs:
    - TI001
    - TI003
  - type: private-evidence-only
    severity: material
    topic: cash-burn
    missingEvidence: Cash balance, monthly burn, runway, and any near-term financing covenant or board trigger.
    whyItMatters: IPO readiness and capital-needs analysis remain speculative until liquidity and burn are known.
    diligencePath: Request monthly cash bridge, board materials on runway, and any financing or contingency plans.
    relatedQuestionRefs:
    - QI014
    - QI015
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: lending-book
    missingEvidence: Loan-book size, default rate, charge-offs, provisioning, vintage curves, and funding structure for OPay Credit or OKash.
    whyItMatters: Credit exposure can turn a low-margin payments story into a balance-sheet risk story very quickly.
    diligencePath: Obtain credit-risk packs with origination volumes, delinquency buckets, write-offs, recoveries, and capital allocation by product.
    relatedQuestionRefs:
    - QI016
    - QI017
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: float-and-owealth
    missingEvidence: Wallet float size, microfinance-bank deposit mix, OWealth AUM, and retained spread or management-fee economics.
    whyItMatters: Float and MMF economics may be a major hidden profit pool or a pass-through product with limited contribution.
    diligencePath: Request treasury policy, average customer balances, OWealth fund statements, and revenue recognition policy for wealth products.
    relatedQuestionRefs:
    - QI018
    - QI025
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: distribution-unit-economics
    missingEvidence: Agent commission schedule, merchant-acquiring net take rate after interchange/network costs, and customer-support cost per transaction.
    whyItMatters: Unit-economics quality cannot be judged from list prices alone because the visible consumer proposition is heavily subsidized.
    diligencePath: Request cohort-level margin analysis by product and channel, including agent, card, and merchant economics after reversals and fraud losses.
    relatedQuestionRefs:
    - QI007
    - QI019
    - QI020
    relatedTableRefs:
    - TI002
    - TI003
  - type: private-evidence-only
    severity: minor
    topic: disclosure-harmonization
    missingEvidence: A reconciled KPI glossary for registered users, active users, monthly volume, daily transactions, and geography splits.
    whyItMatters: Conflicting metric definitions can overstate scale or distort valuation multiples.
    diligencePath: Ask management for a KPI dictionary and the same monthly operating dashboard used by the board or IPO bankers.
    relatedQuestionRefs:
    - QI006
    - QI027
    relatedTableRefs:
    - TI003
    - TI006
