chapter:
  number: 4
  title: Financials
  summary: Public evidence supports OPay as a massive low-fee Nigerian transaction network with merchant, card, lending, and wealth monetization rails plus a filing-derived equity value that moved from about $2.75 billion at end-2024 to about $3.10 billion at end-2025. But audited standalone financials are absent, several 2026 articles appear to confuse Opera’s own $614.8 million revenue with OPay’s, and lending, float, burn, and realized take-rate remain opaque. The financial judgment is therefore positive on scale but cautious on underwriteability.
sections:
- id: monetization-and-transaction-scale
  title: Monetization rails are visible, but blended take rate is not
  body: 'Public evidence is strong on what OPay sells, weaker on how much each rail earns. OPay’s own pages show a stack that combines consumer wallet funding, free-feeling interbank transfers, bill pay, debit cards, OWealth, and merchant-facing payment acceptance. Opera’s 2025 Form 20-F goes further by describing OPay as a privately held fintech with payments, transfers, savings, lending, agent POS, and merchant acquiring. That matters because it rules out the lazy framing of OPay as just a peer-to-peer transfer app: the company clearly has multiple monetization points around merchant checkout, payout rails, cards, credit, and wealth. The checkout price card is the clearest direct public fee disclosure. It lists 1.5% local transaction pricing capped at ₦2,000, 4% on international transactions, and small fixed payout fees. By contrast, the consumer pages still advertise free bank transfers and zero maintenance fees for active cards.


    That asymmetry is the core economic signal. The visible consumer product is built to feel free or nearly free, while monetization sits on merchant and attached financial-service rails. Neobanks.guide’s hands-on review pushes the same conclusion further, describing revenue from merchant interchange, lending, and OWealth-related fees, while noting that agents usually earn commissions funded by OPay rather than directly by the user. In practical terms, this means published merchant pricing cannot be read as the platform’s realized take rate on total payment volume. Much of OPay’s public scale story is built on consumer transfer habit and agent-assisted cash movement, which are precisely the flows most likely to be subsidized to sustain growth and trust. The right financial reading is therefore a layered take-rate profile: explicit low-single-digit merchant rates where OPay is the processor of record, tiny fixed payout charges on some outbound flows, card-related economics that are partly hidden in issuer and network structures, and a much lower undisclosed blended monetization rate across total transaction value.


    The scale evidence is directionally powerful. Ecofin traces monthly payment value from roughly $363 million in January 2020 to more than $2 billion by end-2020 and later to over $12 billion per month by early 2024, while Technext reports a similar roughly $12 billion monthly level in 2026 and 500,000-plus agents. Reuters-carried OPay publicity adds more than 20 million daily active users and 36 million monthly active users worldwide in late 2025. Yet these disclosures are not cleanly comparable: some are Nigeria-only, some are worldwide, some are registered users, and some are DAU or MAU. That is enough to support a “very large scale, low-fee transaction network” conclusion, but not enough to compute a reliable revenue per user or realized take rate.'
