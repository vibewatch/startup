- id: security-fraud-operational
  title: Fraud controls are real, but trust can still break on freezes, glitches, and support
  body: 'Public evidence supports a serious control posture, but not a solved trust problem. OPay’s own materials highlight encrypted data handling, PCI DSS compliance, and instant account locking, while independent coverage describes a more mature 2025 security stack that includes emergency lock, Night Guard, biometric checks for large transactions, and scam alerts. The strongest control signal is that OPay says its scam-alert system now warns tens of thousands of users daily and blocks tens of thousands of risky transactions. But the downside case is not simply “fraud happens”; it is that fraud management can become customer pain. Trustpilot complaints, panic withdrawals after alleged fraudulent-withdrawal videos, and Nairametrics’ repeated framing of trust as an industry bottleneck show the emotional fragility of the customer base. The mass-freeze story after the ₦714 million glitch and the 2026 lawsuit coverage both point to the same transmission path: when risk tools or reconciliation
    actions become visible, OPay can protect itself operationally while still harming customer confidence. That makes security a mixed risk category: mitigation maturity is improving, but residual trust exposure is still high because public proof on appeal fairness, false positives, and complaint-resolution speed remains absent.'
  claimRefs:
