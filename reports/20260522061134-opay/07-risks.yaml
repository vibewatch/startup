- id: mitigations-and-diligence-asks
  title: Mitigations are visible; the remaining work is to prove they are durable
  body: 'OPay is not a case where the mitigations are invisible. The company has real controls, the legal perimeter is explicit, and management appears to be professionalising ahead of a possible capital-markets event. But the gating diligence asks are unusually concrete because the biggest risks are observable yet under-disclosed. Investors should ask for CBN exam history, remediation logs, and any correspondence tied to onboarding pauses, fines, or KYC escalations. They should ask for fraud-loss rates, scam-alert conversion metrics, false-positive rates, freeze volumes, appeal outcomes, and complaint-resolution SLAs. They should ask for agent productivity and attrition data to quantify the effect of single-principal rules, and for Nigeria-versus-other-market TPV, revenue, and user mix to see whether country concentration is easing or worsening. Finally, they should demand a governance package that goes beyond press releases: board composition, committee charters, internal-control ownership,
    and audited disclosures suitable for a public-listing process. Until those asks are met, the default posture should treat CBN/KYC escalation as the highest-severity risk, fraud or freeze-driven trust loss as the highest-probability operational risk, and Nigeria concentration as the key amplifier that makes every other downside bigger.'
