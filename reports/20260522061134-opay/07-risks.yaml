  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: privacy-compliance
    missingEvidence: Current privacy governance pack, data-flow map, and any public or regulator-cleared evidence on data residency, retention, and cross-border transfer controls.
    whyItMatters: Public evidence confirms Nigerian data-protection obligations but does not clear whether OPay’s architecture would satisfy a serious diligence review on privacy and residency.
    diligencePath: Request NDPA compliance memorandum, data map, processor inventory, and any regulator correspondence on privacy or security controls.
    relatedQuestionRefs:
    - QR020
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: fraud-vs-trust
    missingEvidence: Fraud-loss rates, scam-alert precision, blocked-good-payment rates, freeze volumes, appeal outcomes, and complaint-resolution SLAs.
    whyItMatters: Public sources show both strong control messaging and real trust damage, but they do not reveal whether the net effect is positive or whether false positives are too costly.
    diligencePath: Request monthly fraud dashboard, appeals dashboard, customer-support backlog, and segmented loss or recovery statistics.
    relatedQuestionRefs:
    - QR021
    relatedTableRefs:
    - TR002
    - TR006
  - type: private-evidence-only
    severity: material
    topic: kyc-aml-scrutiny
    missingEvidence: Actual CBN exam findings, remediation deadlines, repeat-deficiency history, and customer-conversion impact after onboarding restrictions.
    whyItMatters: The public record already proves supervisory friction; underwriting without the regulator-facing worklist leaves the highest-severity risk largely unquantified.
    diligencePath: Request regulator correspondence, internal remediation tracker, onboarding conversion funnel, and closure statistics for non-compliant accounts.
    relatedQuestionRefs:
    - QR022
    relatedTableRefs:
    - TR001
    - TR006
  - type: private-evidence-only
    severity: material
    topic: governance-opacity
    missingEvidence: Board composition, committee structure, beneficial ownership summary, and standalone audited governance materials appropriate for a public-listing process.
    whyItMatters: The capital-markets narrative is accelerating faster than the public governance record, which makes it hard to judge oversight quality, succession depth, and control ownership.
    diligencePath: Request board deck, governance org chart, committee charters, cap-table summary, and the latest external audit or internal-control memo.
    relatedQuestionRefs:
    - QR024
    relatedTableRefs:
    - TR005
    - TR006
