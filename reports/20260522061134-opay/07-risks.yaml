- id: TR006
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold or event
  - Action implication
  rows:
  - - CBN or AML escalation
    - Formal enforcement, renewed onboarding pause, or larger sanction
    - Any named CBN action that extends beyond short remediation
    - Move to downside case and demand regulator correspondence before investing.
  - - Freeze and appeal governance failure
    - More lawsuits, regulator criticism, or poor appeal outcomes
    - Pattern of court or consumer actions around unlawful freezes
    - Treat trust risk as structural rather than episodic.
  - - Fraud-control weakness
    - Rising fraud losses or obvious false-positive backlash
    - Evidence that scam controls fail to reduce net harm
    - Question moat quality and support economics.
  - - Agent-network fragility
    - Meaningful drop in active agents or transaction density after rule changes
    - Single-principal transition materially dents distribution
    - Re-underwrite growth and offline moat assumptions.
  - - Macro and concentration shock
    - Naira or demand shock plus weaker growth in Nigeria
    - Material slowdown without diversification evidence
    - Lower valuation expectations and raise concentration discount.
  - - Governance opacity into IPO prep
    - Capital-markets push without richer disclosure
    - No board, control, or ownership transparency despite listing narrative
    - Treat IPO upside as unproven and keep governance haircut.
  notes: Kill criteria are event-driven because public sources do not provide enough numeric operating history to justify hard quantitative thresholds.
