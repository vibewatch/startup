schemaVersion: report-v2
artifact: customers
slug: opay
runDate: '2026-05-22'
company:
  name: OPay
chapter:
  number: 6
  title: Customers
  summary: Public evidence supports OPay as a mass-market Nigerian payments network spanning underbanked consumers, micro-merchants,
    agents, and SMEs, with company-distributed claims of 50 million-plus users and one million merchants reinforced by large
    app-store surfaces and an independent UX benchmark. The strongest positive signals are convenience, low-friction daily
    use, and agent-led trust bridges; the weakest areas are audited retention, remittance-user proof, and measurable complaint-resolution
    performance. Adverse evidence is material, ranging from historical Trustpilot complaints and panic withdrawals to unauthorized-account
    allegations, onboarding pauses, court-backed freezes, and current merchant complaints about fees.
sections:
- id: customer-segments
  title: Customer segments and trust bridges
  body: 'Public evidence supports OPay as a broad everyday-money product rather than a narrow wallet niche. The strongest
    documented customer segments are underbanked consumers using transfers, bills, airtime, savings, cards, and small loans;
    micro-merchants and SMEs using collection accounts, POS terminals, and merchant working-capital features; and agent operators
    who turn cash into digital value in markets where bank branches and ATMs are unreliable. Independent sources consistently
    tie OPay''s reach to financial inclusion rather than only to digital-first urban users. Ecofin and Business A.M. both
    describe the agent network as a nationwide distribution moat, and Neobanks.guide goes further by calling that network
    the key cash-to-wallet on-ramp for people who still build trust face-to-face. That matters for OPay''s thesis: the customer
    base is not just app installers, but a hybrid base of consumers, merchants, and agents tied together by cash-in or cash-out
    convenience. What remains much weaker is remittance-user evidence. Public materials show multi-country operations and
    international card acceptance, but they do not quantify corridor-level remittance adoption or diaspora usage for the Nigeria
    product.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
