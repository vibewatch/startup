  evidenceGaps:
  - type: missing-source
    severity: material
    topic: remittance-gaps
    missingEvidence: Active remittance users, corridor mix, and cross-border transaction volume for Nigeria-based OPay customers.
    whyItMatters: Remittance users are part of the thesis brief, but public sources show only multi-country footprint and
      card acceptance, not actual user adoption.
    diligencePath: Request corridor-level active-user and TPV data, with Nigeria outbound and inbound splits, from management
      or a product data room export.
    relatedQuestionRefs:
    - QU009
    relatedTableRefs:
    - TU001
    - TU005
  - type: private-evidence-only
    severity: material
    topic: retention-gaps
    missingEvidence: Audited churn, NRR, GRR, cohort retention, and repeat-usage data for consumer and merchant segments.
    whyItMatters: Public app ratings and testimonials show satisfaction, but they do not prove durable customer economics
      or low churn.
    diligencePath: Request cohort files by segment, monthly active retention curves, merchant churn, and repeat-borrow or
      repeat-settlement statistics.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: support-channels
    missingEvidence: Complaint-resolution SLAs, reversal success rates, case backlog, and time-to-resolution by customer segment.
    whyItMatters: OPay advertises 24 or 7 support, but public sources do not quantify whether disputes are resolved quickly
      enough to protect trust.
    diligencePath: Ask for internal support metrics, reversal success by rail, fraud case cycle times, and customer-service
      CSAT or NPS.
    relatedQuestionRefs:
    - QU026
    relatedTableRefs:
    - TU006
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: A broader public set of named OPay merchant or enterprise deployments beyond testimonials and app-store
      reviewers.
    whyItMatters: The named customer proof table is intentionally partial because OPay does not publish a verifiable customer
      roster, which limits concentration and deployment analysis.
    diligencePath: Request reference customers by segment, especially SMEs, larger merchants, and any remittance or diaspora-heavy
      cohorts.
    relatedQuestionRefs:
    - QU013
    - QU014
    relatedTableRefs:
    - TU003
