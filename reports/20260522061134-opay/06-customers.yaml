tables:
- id: TU001
  title: Customer segmentation table
  slug: customer-segmentation-table
  type: matrix
  columns:
  - Segment
  - Buyer / user / payer
  - Jobs-to-be-done
  - Public scale / proof
  - Why they stay / key risk
  rows:
  - - Underbanked everyday consumers
    - Individual user is buyer, user, and payer
    - Instant transfers, bills, airtime, savings, cards, small loans
    - 50M+ users claimed; 4.5/5 iOS rating
    - Stay for convenience and backup reliability; risk is freeze or support frustration
  - - Micro-merchants / sole traders
    - Merchant owner is buyer and user; customer is payer
    - Collection account, QR or POS acceptance, transfers, bill pay
    - 1M merchants claimed; merchant app reviewed at scale
    - Stay for settlement convenience; risk is pricing sensitivity
  - - Agent / PoS operators
    - Agent is business buyer and user; walk-in customer is payer
    - Cash-in/out, account opening, card issuance, local support
    - 563,252 PoS agents; 1.5M banking agents overall
    - Stay for commissions and foot traffic; risk is compliance or fraud exposure
  - - SMEs / formal merchants
    - Business buyer, staff users, customer payer
    - Collection account, POS terminal, savings plan, working-capital tools
    - OPay Business app and business page show explicit SME tooling
    - Stay for one-stop operations; risk is opaque pay-as-you-go charges
  - - Remittance / diaspora-adjacent users
    - User is payer or recipient across markets
    - International card usage and multi-country wallet adjacency
    - null
    - Public scale is not disclosed; cross-border thesis remains unproven
  notes: Scale rows mix company claims and independent reporting; null means public sources did not quantify the segment.
    Remittance evidence is directional only.
