    - Documented on official surfaces
    - Wallet users can add cards, savings, and loans
    - Expansion proof is company-led, not audited
    - Cross-sell likely helps stickiness but is not quantified
  - - Merchant to fuller operating stack
    - Business app bundles collections, POS, savings, and loans
    - Merchant collection accounts can deepen wallet usage
    - Fees can limit willingness to adopt more modules
    - Strong surface area but price sensitivity matters
  - - Agent to consumer acquisition
    - Agents remain a major trust bridge
    - Physical presence helps first-time adoption and card issuance
    - Heavy reliance on agents ties OPay to field compliance and fraud control
    - Agent quality affects local customer trust
  - - Geography
    - Public evidence is dominated by Nigeria
    - Egypt and Pakistan show optional future adjacency
    - Nigeria remains the core customer market
    - Macro or regulatory shocks in Nigeria would hit the thesis hardest
  - - Remittance / cross-border
    - Separate country products are visible
    - Could broaden addressable user base over time
    - No disclosed remittance-user scale or corridor data
    - Cross-border upside is still a diligence question
  notes: This table focuses on customer concentration and product-expansion risk, not on full corporate strategy. Public evidence
