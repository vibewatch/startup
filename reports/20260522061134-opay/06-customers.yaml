- id: adoption-proof
  title: Adoption proof across consumers, merchants, and agents
  body: 'Adoption evidence is strongest where company-distributed scale claims are paired with observable or independent customer
    surfaces. Company releases put OPay above 50 million users, 1 million merchants, and more than 20 million daily active
    users by late 2025. Independent outlets do not fully audit those figures, but Ecofin repeats the broad scale story and
    TechCabal''s FOLIO benchmark gives an external read on live usability rather than marketing copy. In that 2026 benchmark,
    OPay ranked first overall among ten audited payments apps, with category-leading friction scores, which is meaningful
    because FOLIO used verified users completing real signup, KYC, funding, and transfer flows. Observable app-store surfaces
    also matter: the iOS consumer app held a 4.5 rating from 88,000 ratings, and the OPay Business app showed 4.7 from 34,100
    reviews. Named customer proof is thinner than raw scale proof, but it is not absent. Leadership quotes users and merchants
    praising convenience and reliability, while Nairametrics interviews current traders and backup users whose comments are
    mixed rather than purely promotional. The right interpretation is that OPay has abundant reach signals and decent customer-origin
    proof, but only a limited set of independently verified named deployments.'
  claimRefs:
  - CU010
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
