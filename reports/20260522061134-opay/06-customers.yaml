figures:
- id: FU001
  title: Customer journey map
  slug: customer-journey-map
  type: journey-map
  layout: wide
  summary: Journey map showing how OPay converts trust in local cash points into repeat digital usage across consumer and
    merchant jobs.
  approximationNotes: This figure synthesizes official product surfaces and independent reporting on agent-driven adoption.
    It is directional rather than a measured funnel.
  data:
    nodes:
    - id: j1
      label: Trust bridge
      detail: Customer first meets OPay through an agent kiosk, peer referral, or visible app-store reputation.
    - id: j2
      label: Sign-up and KYC
      detail: User opens wallet or merchant account, with stronger limits gated by identity checks and compliance rules.
    - id: j3
      label: First value-in
      detail: Cash is deposited via agent or account is funded for the first transfer, bill payment, or collection use case.
    - id: j4
      label: Habit loop
      detail: User repeats transfers, bill pay, airtime, and merchant settlement because speed and low friction are visible.
    - id: j5
      label: Cross-sell layer
      detail: Cards, savings, loans, and merchant tools deepen the relationship once the core payment job is trusted.
    - id: j6
      label: Trust test
      detail: Support interactions, fraud alerts, or dispute moments determine whether the user stays or churns.
  claimRefs:
  - CU001
  - CU002
  - CU004
  - CU005
  - CU006
  - CU028
  - CU030
- id: FU002
  title: Adoption / deployment funnel
  slug: adoption-deployment-funnel
  type: flow
  layout: wide
  summary: Flow showing how consumer adoption, merchant deployment, and agent distribution reinforce one another rather than
    operating as separate businesses.
  approximationNotes: The figure is rendered as a flow because public sources show multi-sided reinforcement loops more clearly
    than a clean numerical funnel.
  data:
    nodes:
    - id: f1
      label: Agent visibility
      detail: Local agents make OPay physically discoverable and lower trust barriers.
    - id: f2
      label: Consumer onboarding
      detail: Consumers open wallets for transfers, bills, and cash conversion.
    - id: f3
      label: Merchant onboarding
      detail: SMEs open collection accounts or request POS terminals through the business app.
    - id: f4
      label: Repeated daily payments
      detail: Transfers, bills, merchant collections, and cash-out use keep the app top-of-wallet.
    - id: f5
      label: Cross-sell and lock-in
      detail: Cards, savings, and lending features widen usage beyond one payment moment.
    - id: f6
      label: Complaint or trust event
      detail: Fraud alerts, support, and dispute handling decide whether repeat usage holds.
    edges:
    - from: f1
      to: f2
    - from: f1
      to: f3
    - from: f2
      to: f4
    - from: f3
      to: f4
    - from: f4
      to: f5
    - from: f5
      to: f6
      label: trust must hold
  claimRefs:
