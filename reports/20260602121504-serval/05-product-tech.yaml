company:
  name: Serval
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Serval delivers an AI-native ITSM platform built on three specialist agents—a Help Desk Agent,
    an Automation Agent, and an Insights Agent—where security rests on strict separation between
    tool-building (Automation Agent) and tool-execution (Help Desk Agent), preventing any unconstrained
    AI action. The platform is SOC 2 Type II certified, supports cloud and self-hosted deployment
    via Kubernetes and Terraform, and integrates with 60+ enterprise systems; however, no public
    source code, architecture white papers, or independent technical benchmarks exist, leaving
    performance claims and LLM-provider dependencies as material diligence gaps.

sections:
  - id: section-product-suite
    title: Product Suite and Core Modules
    body: >-
      Serval markets itself as a unified AI-native ITSM platform combining three functional surfaces:
      a Help Desk, an Access Management module, and an Automation Engine. The company's product
      homepage describes the offering as an "AI agent workforce" deployed within enterprise IT,
      capable of handling help desk requests, provisioning time-bound access, onboarding and
      offboarding employees, and building workflow automations through natural language. Five
      distinct capability areas are marketed: Resolve Requests, Build Workflows, Transform Ticketing,
      Manage Access, and Manage Assets.


      The Help Desk module is the user-facing surface. Employees interact via Slack, Microsoft Teams,
      email, or a web portal. Serval's AI routes incoming tickets based on request content and
      context, searches connected knowledge bases to answer questions with sourced information,
      executes automations to close out common requests without human intervention, and escalates
      with full context when human handling is required. Bi-directional ticket sync is offered with
      third-party systems—specifically ServiceNow, Jira, and Zendesk—allowing enterprises to run
      Serval alongside incumbents during migration.


      The Access Management module handles just-in-time (JIT) provisioning, automated deprovisioning,
      approval workflow customization, access-profile restrictions, and SCIM integration with
      identity providers. According to the pricing page, access policies can be customized down to
      least-privilege rules, multi-approver gates, and time-bound grants. Serval also lists SCIM
      provisioning and Terraform/API-based custom provisioning as capabilities.


      The Analytics and Insights surface provides dashboards for request volume, AI resolution
      rates, time-to-resolution, and SLA compliance. The Insights Agent additionally analyzes
      ticket patterns to surface automation opportunities and suggest knowledge base updates—what
      Serval's documentation terms "automate the automation."


      A fifth surface, Asset Management, appears on the homepage as a named capability but receives
      no substantive description in public documentation, leaving its maturity ambiguous.
