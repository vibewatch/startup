  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: llm-provider
      missingEvidence: >-
        Identity of the LLM provider(s) powering Serval's Help Desk Agent, Automation Agent,
        and Insights Agent; SLA pass-through terms from LLM provider; multi-provider redundancy
        or fallback strategy.
      whyItMatters: >-
        Enterprise customers committing to Serval are indirectly dependent on an unknown LLM
        vendor's availability, pricing, data-handling, and safety policies. A change in any
        of these could degrade or disable core product functions.
      diligencePath: >-
        Request LLM provider disclosure in data processing addendum; ask for contractual SLA
        pass-through; request business continuity plan for LLM provider disruption.
      relatedQuestionRefs:
        - QE006

    - type: private-evidence-only
      severity: blocking
      topic: soc2-scope
      missingEvidence: >-
        SOC 2 Type II attestation letter, auditor identity, audit period, and scope of coverage
        (which trust service criteria and which system components).
      whyItMatters: >-
        SOC 2 Type II certification is claimed but unverifiable; the scope of coverage—including
        whether the self-hosted deployment option and AI subprocessors fall within scope—is unknown.
      diligencePath: >-
        Request SOC 2 Type II report (or NDA-protected summary) from Serval; confirm scope
        includes LLM-API data handling and access management subsystems.
      relatedQuestionRefs:
        - QE012

    - type: missing-source
      severity: material
      topic: reliability
      missingEvidence: >-
        Historical availability data, incident post-mortems, or public status page for the
        cloud-hosted deployment option; SLA breach remediation terms.
      whyItMatters: >-
        A 99.9% uptime SLA with no public track record cannot be verified; a sub-30-person
        team operating multi-tenant SaaS with agentic AI workloads may face operational risks
        that larger providers do not.
      diligencePath: >-
        Request historical availability data, incident logs, and SLA breach definition/credits
        from Serval; verify if a monitoring tool (e.g., Datadog, PagerDuty public dashboards)
        is accessible.
      relatedQuestionRefs:
        - QE009
        - QE025

    - type: missing-source
      severity: material
      topic: architecture-gaps
      missingEvidence: >-
        Technical architecture white paper, code-generation quality benchmarks, LLM error-rate
        data, and rollback mechanisms for erroneous generated workflow code.
      whyItMatters: >-
        Errors in generated workflow code could introduce access-control bugs or data-exposure
        vulnerabilities in enterprise environments; no independent technical validation exists.
      diligencePath: >-
        Request technical white paper or detailed architecture review; ask for error-rate data
        on Automation Agent code generation; verify code review workflow before automation
        deployment.
      relatedQuestionRefs:
        - QE013
