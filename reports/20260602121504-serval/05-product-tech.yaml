callouts:
  - calloutType: strength
    title: Two-Agent Security Architecture Addresses Enterprise's Biggest AI Concern
    body: >-
      Serval's deliberate separation of tool-building (Automation Agent, admin-only) from
      tool-execution (Help Desk Agent, employee-facing) is a principled architectural answer
      to the "rogue AI" risk that is the primary enterprise blocker for agentic AI adoption.
      By constraining the Help Desk Agent to a pre-approved, deterministic tool set, Serval
      limits blast radius without sacrificing automation breadth. This is a genuine product
      moat that is harder to replicate in incumbent drag-and-drop ITSM tools than in a
      greenfield AI-native design.
    claimRefs:
      - CE010
      - CE011
      - CE012

  - calloutType: risk
    title: LLM Provider Dependency is Unmitigated and Undisclosed
    body: >-
      Serval's entire product stack rests on one or more third-party LLM APIs whose identity,
      contractual SLA, and fallback strategy have not been publicly disclosed. An enterprise
      committing to Serval is indirectly committing to an unknown LLM provider's availability,
      pricing, data-handling, and model-evolution decisions. For a system handling access
      provisioning and employee data, this is a material concentration risk. No multi-provider
      redundancy, local-model fallback, or SLA pass-through to the LLM layer has been
      documented.
    claimRefs:
      - CE013
      - CE036
      - CE038

  - calloutType: risk
    title: No Public Status Page or Historical Availability Data for the 99.9% SLA Claim
    body: >-
      Serval markets a 99.9% uptime SLA for its cloud-hosted deployment option, but no
      public status page (e.g., statuspage.io instance) was found to validate historical
      availability. For a sub-30-person company managing multi-tenant SaaS with agentic
      AI workloads, the operational complexity is significant. Enterprise IT buyers should
      request historical availability data and SLA breach remediation terms before committing.
    claimRefs:
      - CE021
      - CE022
      - CE039

  - calloutType: insight
    title: SOC 2 Type II at Under 30 Employees Signals Deliberate Compliance Posture
    body: >-
      Attaining SOC 2 Type II certification with a headcount under 30 is atypical and reflects
      a deliberate early investment in compliance infrastructure—likely driven by the need to
      win deals at AI-forward enterprises like Perplexity and Together AI, which themselves
      face compliance requirements. This gives Serval a credibility advantage over earlier-stage
      competitors in enterprise procurement conversations, though the scope and auditor
      remain undisclosed.
    claimRefs:
      - CE025
      - CE027

