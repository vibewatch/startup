  - id: section-trust
    title: Trust, Security, and Compliance
    body: >-
      Serval's documentation lists its enterprise security posture as: encryption (TLS 1.3 in
      transit, AES-256 at rest), role-based access controls at org and team levels, comprehensive
      audit logging of all actions, SOC 2 Type II certification, and regular penetration testing.
      The company claims a Trust Center at trust.serval.com but that URL returned a 404 at time
      of research, suggesting the page is either under construction or the URL has changed. The AUP
      references trust.serval.com as the canonical location for the AI subprocessors list.


      SOC 2 Type II is a meaningful trust signal for enterprise sales. It requires an independent
      audit of security, availability, processing integrity, confidentiality, and privacy controls
      over a monitoring period, and its attainment by a company with under 30 employees indicates
      an early prioritization of compliance infrastructure. However, no public attestation letter,
      scope definition, or auditor name is disclosed, leaving the breadth of the SOC 2 scope
      unverifiable.


      The AUP includes specific AI transparency commitments: AI-generated outputs are labeled
      as "Serval AI" to distinguish them from human-authored content; Serval maintains a list of
      AI subprocessors and model providers; customer data is not used to train general-purpose AI
      or external machine-learning models without explicit authorization; and identifiable customer
      materials are not used for cross-customer model training. These commitments reflect an
      awareness of enterprise procurement requirements around AI data governance, though they
      are contractual commitments rather than independently audited controls.


      The AUP also requires meaningful human oversight for consequential decisions (Section 4.2):
      "Make fully automated decisions with legal or similarly significant effects on individuals
      without meaningful human oversight" is explicitly prohibited. This is a product-level
      guardrail but does not constitute a certified AI safety mechanism. NIST AI 100-2 (2025)
      identifies adversarial machine learning risks—including prompt injection and data poisoning—
      as threats to agentic AI systems; Serval's deterministic tool-gating approach mitigates the
      action-execution layer but does not fully address inference-layer adversarial risks.


      No public bug-bounty program, published CVE disclosures, or security incident history is
      available, which is normal for an early-stage startup but represents a due-diligence gap
      for enterprise security evaluators.
    claimRefs:
