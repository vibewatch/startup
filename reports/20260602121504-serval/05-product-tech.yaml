  - id: TE002
    title: Workflow Use-Case and Customer Benefit Table
    columns:
      - Employee Job / Request
      - Legacy Workflow
      - Serval Solution
      - Stated Benefit
      - Limitation / Caveat
    rows:
      - - Software access request
        - Email IT → manual Okta provisioning → 24–48 hr wait
        - Help Desk Agent receives Slack request; triggers JIT access workflow; deprovisioned automatically
        - Instant provisioning; no standing access accumulation
        - Approval routing complexity for privileged access not demonstrated
      - - Employee onboarding
        - IT team manually provisions 10–15 systems over days
        - Automation Agent runs multi-step onboarding workflow triggered by HRIS event
        - Claimed 50%+ automation of onboarding tasks
        - End-to-end onboarding coverage depends on integration breadth; unverified for complex orgs
      - - Password reset
        - IT ticket → manual verification → reset email; 30–60 min
        - Help Desk Agent verifies via existing tool and resets programmatically
        - Immediate self-service resolution
        - Requires tool pre-built by admin; initial setup effort not quantified
      - - Knowledge base question
        - Employee searches Confluence/Notion manually or asks Slack
        - Help Desk Agent queries synced KB; returns sourced answer
        - Faster answer, reduced ticket volume
        - Accuracy of RAG retrieval on enterprise docs not independently verified
      - - Incident routing / escalation
        - Manual triage by IT lead; tickets pile up overnight
        - Agent classifies, routes, and escalates with full context
        - Faster time-to-assignment; lower triage backlog
        - Routing accuracy depends on model quality; mis-routes could delay critical incidents
      - - Offboarding
        - Manual checklist across 10+ systems; access lingering risk
        - Automation workflow revokes access across integrated systems on HRIS trigger
        - Access deprovisioned immediately on departure
        - Coverage limited to integrated systems; unintegrated SaaS apps create residual risk
    notes: >-
      Use-case descriptions drawn from official Serval product and pricing pages. Stated benefits
      are company-claimed or inferred from product descriptions; no third-party case study data
      is available for most workflows. The 50% automation rate is cited from a customer testimonial
      on the homepage (Vernon Man, Head of IT) and the pricing page guarantee; no controlled study exists.
