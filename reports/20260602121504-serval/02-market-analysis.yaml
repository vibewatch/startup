    rows:
      - - AI-native ITSM platforms
        - Seat-based and usage-based subscriptions for agentic IT help desk, access management, and onboarding automation
        - Pure ticketing SaaS without AI resolution layer; legacy on-premise service desk software
        - IT Director, Head of IT, CIO with IT operations budget
        - Core direct market; Serval's primary product surface
      - - Traditional ITSM software
        - Cloud and on-premise service desk, incident management, change management, and ITAM licensing
        - Infrastructure hardware, endpoint management, and network monitoring that do not include a request layer
        - IT Director, CIO, and procurement with multi-year IT platform budget
        - Displacement opportunity; incumbent players Serval must displace or coexist with
      - - Enterprise Service Management (ESM)
        - Cross-functional request automation for HR, Finance, Legal, and Workplace teams
        - Core ERP modules, payroll systems, and accounting software without IT request workflows
        - CHRO, CFO, General Counsel, and department heads with functional budget lines
        - Adjacent expansion market; Serval's multi-team segregation supports ESM growth
      - - AIOps and IT operations
        - AI-driven incident correlation, event management, and intelligent alerting platforms
        - Network monitoring, observability dashboards, and performance management without request routing
        - IT Operations Manager and SRE teams
        - Adjacent; overlaps at auto-remediation workflows but Serval does not address infrastructure monitoring
      - - Identity and access governance
        - Agentic access provisioning, just-in-time access, and access review automation
        - Standalone PAM (privileged access management) tools and identity governance without request workflow
        - IT Security Manager, CISO, and compliance teams
        - Critical capability within Serval's platform; also a distinct governance software market
      - - IT help desk outsourcing
        - Managed service desk contracts where a third party handles IT support tickets
        - Staff augmentation, offshore IT support teams, and IT consulting engagements
        - COO, IT Director with outsourcing budget
        - Indirect competitive pressure; Serval automates what outsourcing providers staff manually
    notes: >-
      Market boundaries are based on Serval's product surface and IBM's ITSM definition. Spend estimates
      are inferred from industry reports and public pricing; no single authoritative market size for the
      AI-native ITSM sub-segment was available at research date.
