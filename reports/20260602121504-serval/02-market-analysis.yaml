  - id: adoption-constraints
    title: Adoption friction, compliance constraints, and procurement hurdles
    body: >-
      Despite strong demand tailwinds, several forces slow adoption of AI-native ITSM. Enterprise security
      and governance requirements around AI action scope are the most significant friction point. TechCrunch's
      reporting on Serval highlights the core enterprise concern: organizations are acutely aware of the risk
      of a rogue AI agent taking unintended actions, which is why Serval's architecture separates tool-building
      from tool-execution and enforces deterministic, permissioned actions rather than a single all-purpose
      agent. This is a genuine architectural differentiation, but it also means that prospects must understand
      and trust an AI-centric security model before purchasing—a non-trivial evaluation hurdle.

      Procurement cycles for ITSM platforms are lengthy because of integration requirements. Serval's
      onboarding model involves four phases (meet, build, deploy, optimize) with a dedicated deployment
      engineer, which implies an enterprise sales cycle of weeks to months before a prospect can evaluate
      the automation rate guarantee. Legacy ITSM platforms like ServiceNow, BMC, and Freshservice have
      extensive partner ecosystems and professional services relationships that create switching cost and
      inertia. Compliance certification requirements also raise the bar: SOC 2 Type II, HIPAA, and GDPR
      are standard requirements for enterprise procurement; Serval claims to meet all three per its
      documentation, but independently audited evidence is not publicly available at research cutoff.

      Data residency and sovereignty concerns are a material constraint for regulated industries (healthcare,
      financial services, government) where ITSM data includes employee PII, access logs, and sensitive
      workflow history. Serval's cloud-hosted, hybrid, and self-hosted deployment options address data
      residency in principle, but the details of self-hosted support and SLA guarantees are not
      publicly documented. Finally, the pricing model's reliance on dedicated deployment engineers
      means that very small companies (under 50 employees) are likely under-served by Serval's current
      go-to-market motion, capping the low end of the SAM.
