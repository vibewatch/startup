  - id: FM004
    title: Enterprise AI-ITSM adoption funnel
    type: funnel
    layout: standard
    summary: >-
      Enterprise AI-ITSM adoption follows a staged progression from awareness through pilot and
      integration to full deployment; each stage has meaningful drop-off driven by security review,
      integration complexity, and ROI validation requirements.
    data:
      items:
        - label: Market awareness and initial interest
          value: 100
          detail: IT leader recognizes automation gap; hears about AI-native ITSM from peers, investors, or trade press.
          tone: neutral
        - label: Pilot scoping and security evaluation
          value: 55
          detail: Prospect engages with vendor, completes security questionnaire, and defines pilot scope; many drop here due to procurement friction.
          tone: neutral
        - label: Integration setup and guided pilot
          value: 35
          detail: Dedicated deployment engineer connects core integrations (Okta, Slack, identity provider) and introduces foundational automations over 4–8 weeks.
          tone: positive
        - label: Automation rate validation (≥50%)
          value: 25
          detail: Serval's guaranteed 50% automation rate requires measurable proof; customers who reach this milestone are highly likely to convert.
          tone: positive
        - label: Full deployment and expansion
          value: 15
          detail: Customer expands to full workforce and additional use cases (ESM, access governance); expansion revenue becomes primary growth lever.
          tone: positive
    approximationNotes: >-
      Funnel percentages are ordinal weights for visualization representing the author's judgment of
      relative attrition at each stage; they are not Serval's published conversion metrics. No pipeline
      conversion data from Serval is publicly available.
    claimRefs:
      - CM009
      - CM012
      - CM025
      - CM026
      - CM046
      - CM047
      - CM048

callouts:
  - calloutType: strength
    title: Structural market tailwinds favor AI-native ITSM displacement
    body: >-
      The ITSM market's 15.9% CAGR and the faster growth of AI-adjacent IT markets reflect a broad
      shift from rule-based to AI-driven workflow automation. Serval's founding thesis—making automation
      cheaper than manual action—aligns with this secular shift. Fast-growing tech companies with lean
      IT teams and high SaaS sprawl represent an immediately serviceable segment with strong pull demand.
    claimRefs:
      - CM001
      - CM007
      - CM010
      - CM023
      - CM043
  - calloutType: risk
    title: Incumbent lock-in and enterprise security scrutiny limit displacement speed
    body: >-
      ServiceNow, Freshservice, and Jira Service Management hold entrenched positions with multi-year
      enterprise contracts, integration ecosystems, and partner service networks. New entrants including
      Aisera and Moveworks show it is possible to displace or layer onto incumbents, but the sales cycle
      is long and security scrutiny around agentic AI action is an ongoing friction source that Serval
      must actively manage in its go-to-market motion.
    claimRefs:
      - CM013
      - CM016
      - CM025
      - CM046
      - CM047
  - calloutType: insight
    title: Access management automation as a compliance-driven growth lever
    body: >-
      Just-in-time access provisioning and automated deprovisioning are not discretionary features—they
      are increasingly required by SOC 2 Type II, HIPAA, and ISO 27001 audit frameworks. Serval's
      access governance capabilities give it a compliance-driven sales entry point that is independent
      of the broader ITSM automation value proposition, potentially broadening the buyer universe to
      include CISO and security leadership alongside IT directors.
    claimRefs:
      - CM011
      - CM030
      - CM031
      - CM036

