company:
  name: Serval
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Serval operates in the ITSM and enterprise AI automation market, a segment projected to reach $22.1 billion
    by 2028 at a 15.9% CAGR according to MarketsandMarkets. The serviceable market is narrower than the headline
    ITSM figure: Serval targets AI-native automation of help desk, access management, and onboarding workflows
    for mid-market and fast-growing technology companies, competing against entrenched incumbents like ServiceNow,
    Freshservice, and Jira Service Management, as well as emerging AI-ITSM vendors like Aisera and Moveworks.
    Buyers are IT directors and heads of IT with centralized IT budgets; adoption is driven by cost pressure,
    SaaS sprawl, and the maturation of agentic AI, while friction arises from enterprise security requirements,
    integration complexity with existing identity stacks, and risk aversion around autonomous AI action.

sections:
  - id: market-boundary
    title: Market definition, scope, and adjacencies
    body: >-
      Serval's product addresses the IT service management software market, broadly defined as the software layer
      that receives, routes, automates, and resolves internal service requests from employees. IBM defines ITSM
      as the practice of planning, implementing, managing, and optimizing end-to-end delivery of information
      technology services to meet user and business goals, covering incident management, problem management,
      change management, service request management, and IT asset management. This boundary is well-established:
      it excludes adjacent categories such as IT monitoring and observability (which measures infrastructure
      health rather than workflow delivery), endpoint management (device provisioning without the request layer),
      and enterprise resource planning (which owns business processes, not IT service delivery).

      Within ITSM, Serval competes in the emerging AI-native sub-segment: platforms that use large language
      models and agentic automation to handle end-to-end request resolution, not just routing or classification.
      This sub-segment is still nascent relative to legacy ticketing vendors but is attracting heavy investment
      from incumbents (ServiceNow's autonomous AI specialist program, BMC's HelixGPT, Freshservice's Freddy AI)
      and venture-backed startups (Aisera, Moveworks, Atomicwork, Serval). Excluded from Serval's serviceable
      market are pure observability platforms (Datadog, PagerDuty), DevOps toolchains (GitHub Actions, CircleCI),
      and standalone identity governance tools (SailPoint, Saviynt) that do not include a help desk layer.

      Enterprise Service Management (ESM), which extends ITSM patterns to HR, Finance, and Legal workflows,
      represents an important adjacency. Serval's platform already supports multi-department segregation for IT,
      Security, HR, and Workplace teams, meaning ESM expansion is a plausible growth vector that would broaden
      the serviceable market if pursued. The included spend for Serval's SAM covers AI-native ITSM platform
      seats, implementation services, and automation workflow credits for organizations with 50–10,000 employees
      in technology-forward sectors.
