  evidenceGaps:
    - type: missing-source
      severity: minor
      topic: ITSM 2026 market data
      missingEvidence: A 2026 analyst estimate of the ITSM market growth rate to verify whether the 2024 MarketsandMarkets 15.9% CAGR projection is tracking to plan.
      whyItMatters: Verifying market growth against forecast helps validate the investment thesis; a slowdown would affect Serval's category tailwinds.
      diligencePath: Search for 2026 Gartner or Forrester ITSM market commentary; check ServiceNow and Atlassian investor relations filings for market size disclosures.
      relatedQuestionRefs:
        - QM007
    - type: missing-source
      severity: minor
      topic: US vs global ITSM market breakdown
      missingEvidence: A geographic breakdown of ITSM market spend showing US vs. global distribution for 2025 or 2026.
      whyItMatters: Serval is a US-based startup and understanding geographic concentration of the market helps calibrate its initial SAM.
      diligencePath: Search IDC ITSM geographic segmentation data; check Atlassian or Freshworks earnings calls for geographic revenue breakdown.
      relatedQuestionRefs:
        - QM019
    - type: missing-source
      severity: minor
      topic: Serval 2026 post-Series-B announcements
      missingEvidence: Public announcements from Serval in 2026 following the Series B close, including leadership hires, product launches, or partnership announcements.
      whyItMatters: Series B often follows with key executive hires or strategic partnerships; absence of evidence is not evidence of absence but the diligence gap should be documented.
      diligencePath: Monitor Serval's blog, LinkedIn, and press release channels; check TechCrunch and The Information for coverage of Serval post-Series B.
      relatedQuestionRefs:
        - QM023
    - type: missing-source
      severity: minor
      topic: IP and patent landscape for agentic ITSM
      missingEvidence: Patent filing data or litigation records for agentic AI and ITSM automation to identify IP risks for Serval.
      whyItMatters: If ServiceNow, Moveworks, or large incumbents hold blocking patents on agentic ITSM architectures, Serval faces potential IP risk.
      diligencePath: Search USPTO patent database for filings by ServiceNow, Moveworks, and Aisera on agentic AI and IT automation; check for pending litigation in enterprise AI.
      relatedQuestionRefs:
        - QM028
    - type: missing-source
      severity: material
      topic: ITSM market size
      missingEvidence: A 2025 or 2026 primary analyst report (Gartner, IDC, or Forrester) with current ITSM market sizing and AI-ITSM sub-segment breakdown.
      whyItMatters: The MarketsandMarkets data is from January 2024 and uses a 2028 forecast; a more current estimate would reduce uncertainty in the TAM/SAM figures.
      diligencePath: Subscribe to Gartner Market Data Intelligence or IDC ITSM service provider tracker; alternatively, search for recent Gartner Magic Quadrant for ITSM commentary that may include market size.
      relatedQuestionRefs:
        - QM001
        - QM007
      relatedTableRefs:
        - TM002

    - type: missing-source
      severity: material
      topic: Serval revenue and customer metrics
      missingEvidence: Serval's ARR, revenue growth rate, number of paying customers, or average contract value as of 2026.
      whyItMatters: Without revenue data, the SAM and SOM sizing for Serval cannot be validated; only the TAM from analyst sources is available.
      diligencePath: Request financial data from Serval's investor relations or data room; check for any press quotes from CEO on revenue milestones; look for third-party credible reports citing revenue.
      relatedQuestionRefs:
        - QM007
        - QM008
        - QM018

    - type: private-evidence-only
      severity: material
      topic: Serval automation rate validation
      missingEvidence: Independent or customer-verified evidence that Serval's guaranteed 50% automation rate is achieved across its customer base, not just in controlled pilots.
      whyItMatters: The automation rate guarantee is a key sales differentiator; if it is achieved only in ideal conditions or specific use cases, the market differentiation story weakens.
      diligencePath: Request customer reference interviews; ask for automation rate audit data from deployed customers; compare against Aisera and Moveworks case study automation rates.
      relatedQuestionRefs:
        - QM013
        - QM015

    - type: missing-source
      severity: minor
      topic: AI-ITSM competitive pricing
      missingEvidence: Serval's actual pricing structure (per-seat, per-automation, or hybrid) and ACV range compared to Freshservice enterprise and Moveworks.
      whyItMatters: Pricing determines the TAM within reach and influences win/loss dynamics against incumbents. Serval's pricing page requires a demo and does not disclose per-seat rates.
      diligencePath: Request pricing from Serval sales; compare against documented Freshservice ($19–$99+/seat/month) and Jira Service Management pricing to triangulate Serval's likely positioning.
      relatedQuestionRefs:
        - QM005
        - QM018

    - type: missing-source
      severity: minor
      topic: adverse AI ITSM deployment evidence
      missingEvidence: Published reports, case studies, or analyst commentary on failed or rolled-back AI-native ITSM deployments that would calibrate real-world adoption risk.
      whyItMatters: Without disconfirming evidence, the market analysis skews toward the optimistic case; adoption rate projections should be discounted if AI-ITSM deployments frequently fail or underperform.
      diligencePath: Search for analyst commentary on AI automation failure rates in IT operations; check enterprise technology forums and communities; look for enterprise buyer sentiment surveys.
      relatedQuestionRefs:
        - QM006
        - QM015
        - QM022

