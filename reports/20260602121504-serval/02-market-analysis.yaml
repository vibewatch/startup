  - id: buyer-segmentation
    title: Buyer, user, and payer segmentation
    body: >-
      The ITSM buying motion is fundamentally an IT-led purchase with central IT budget ownership. At
      mid-market companies (100–2,000 employees), the Head of IT or IT Director typically evaluates and
      selects the platform; at larger enterprises, the CIO or VP of IT Infrastructure governs procurement
      with involvement from security and legal. Serval's early customers—Perplexity, Mercor, Together AI,
      and Cribl—are predominantly fast-growing technology companies where a Head of IT manages a lean
      team and needs to automate most routine work rather than hire more staff. This buyer profile is
      consistent with TechCrunch's characterization of Serval's value proposition: the company makes
      automation effortless enough that building a workflow forever is easier than doing it manually once.

      Users of an ITSM platform are employees at large (all employees who submit requests) and IT
      specialists who resolve escalated tickets. Serval's agentic architecture means that most end-user
      interactions happen through Slack, Microsoft Teams, email, or a web portal, with the AI agent
      handling the resolution and only escalating to a human agent when the request falls outside defined
      automation scope. This reduces the number of IT "seats" needed for tier-1 support, making Serval's
      ROI argument about automation rate rather than seat cost per se.

      Payer segmentation is almost exclusively the IT budget line, with potential expansion to HR, Finance,
      or Legal budget owners as ESM use cases are activated. Freshservice's multi-product structure
      (Freshservice for Business Teams, Freshservice for MSPs) shows that the market already accepts
      budget fragmentation across departments as ESM matures. ServiceNow's model is predominantly a large
      enterprise play where the payer is the enterprise IT organization with multi-million dollar contracts.
      Serval's guaranteed 50% automation rate and dedicated deployment engineering model suggests a sales
      motion that builds ROI from a defined pilot before expanding to full deployment, which is a classic
      land-and-expand enterprise software pattern.
