  body: 'The ITSM market exhibits a wide pricing spread from published per-seat SaaS tiers to fully opaque enterprise contracts.
    Freshservice is the most transparent: four published tiers range from $19 to $99 per agent per month, enabling bottom-up
    PLG adoption. Atlassian JSM offers a free tier for up to three agents and scales to $44.27 per agent per month on Premium.
    Zendesk Suite anchors the mid-market entry at approximately $55 per agent per month. Atomicwork breaks from per-seat pricing
    with a $90 per-employee per-year Professional plan — a total-cost-of-ownership pitch for tech teams where all employees
    are potential service requestors. ServiceNow and Moveworks publish no list pricing; custom enterprise contracts are estimated
    to start above $200,000 and $250,000 annually respectively. Aisera custom-quotes with a minimum 12-month commitment. Serval
    does not publish pricing; its GTM targets high-velocity tech companies including Perplexity, Together.ai, Mercor, and
    Cribl — AI-first organisations that value automation rate guarantees over feature breadth. The TechCrunch Series A coverage
    in October 2025 explicitly framed Serval as a ServiceNow replacement, heightening competitive attention from ServiceNow''s
    enterprise sales force. ServiceNow''s distribution relies on a 7,500-partner ecosystem and certified implementation partners
    — a structural channel advantage Serval cannot replicate at 30 employees, creating an asymmetric distribution challenge
    in the enterprise segment above 5,000 employees.'
- id: SP004s
  title: Switching Costs, Moat, and Competitive Durability
  tableRefs:
  - TP004
  figureRefs:
  - FP003
  claimRefs:
  - CP031
  - CP032
  - CP033
  - CP034
  - CP035
  - CP036
  - CP037
  - CP038
  - CP039
  - CP040
  - CP041
  - CP042
  body: 'The ITSM competitive landscape in 2026 is characterised by durable lock-in mechanics among incumbents and emerging
    data-flywheel moats among AI-native players. ServiceNow''s switching costs are among the highest in enterprise software:
    customers face CMDB migration, custom workflow re-engineering, and retraining of ITIL-certified administrators — a multi-year,
    multi-million-dollar process. Atlassian deepens lock-in through cross-product dependency: teams using Jira Software, Confluence,
    and JSM together face compounding exit costs. Serval''s moat is nascent but structurally sound: its 150-plus native integrations
    create data and workflow coupling, and its automation dataset compounds with each resolved ticket, improving model accuracy
    over time in a manner difficult for new entrants to replicate without equivalent deployment history. Moveworks'' multi-tenant
    AI models, trained on customer communication history, generate proprietary learning lock-in that strengthens after 12
    to 18 months of deployment. The $19-billion-plus ITSM market is large enough that multiple AI-native and incumbent players
    can coexist without winner-take-all dynamics in the near term. Gartner classifies the AI Applications in ITSM market as
    a high-churn, rapid-new-entrant sub-segment as of 2025, signalling continued commoditization pressure. Atomicwork has
    received customer testimonials describing it as a ServiceNow alternative for tech teams, directly overlapping Serval''s
    displacement narrative and creating channel conflict risk. BMC Helix''s Forrester Leader designation confirms incumbents
    continue to invest heavily in AI, threatening Serval''s differentiation window. Serval''s SOC 2, HIPAA, and GDPR certifications
    offer a moat in regulated sectors where Atomicwork and some AI-native peers lack equivalent accreditation. The rapid capital
    infusion — Moveworks $200M Series C, Serval $127M total — intensifies competition for the same addressable TAM. Serval''s
    30-person team relative to ServiceNow''s 23,000-plus employees represents a concentration risk in delivery capacity and
    partner support.'
