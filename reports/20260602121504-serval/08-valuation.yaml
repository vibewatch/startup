figures:
- id: FV001
  title: Recommendation logic
  type: flow
  layout: wide
  summary: >
    The recommendation chain moves from market and proof signals through risk and valuation filters to a track decision.
    Sequoia conviction and market size are positive; revenue opacity, regulatory anomaly, and ServiceNow bundling risk
    prevent a full buy recommendation.
  data:
    nodes:
    - id: market_signal
      label: Market signal — positive
      detail: >-
        ITSM market $11–13B in 2024, projected $22–29B by 2029–2032; AI-native sub-segment growing fastest; Sequoia tier-1 endorsement.
      tone: positive
    - id: proof_signal
      label: Proof signal — narrow
      detail: >-
        Seven named tech-native customers (Perplexity, Vercel, Verkada, Clay, Cribl, Mercor, Together AI); 500% growth claim
        unanchored to dollar figure; no Fortune 500 or regulated-industry logos.
      tone: neutral
    - id: risk_signal
      label: Risk signal — elevated
      detail: >-
        No ARR or gross margin disclosure; no SEC Form D in EDGAR; ServiceNow Now Assist bundling threat; agentic AI security
        vulnerabilities documented by Dark Reading/Acronis; Axios LP scrutiny of unverifiable AI valuations.
      tone: risk
    - id: valuation_signal
      label: Valuation signal — expensive
      detail: >-
        $1B at implied 33–83x ARR multiple depending on unverifiable revenue base; 4.3x step-up in 4 months; no independent
        ARR audit; base case returns flat-to-negative from Series B entry.
      tone: warning
    - id: recommendation
      label: Recommendation — Track
      detail: >-
        Monitor May–December 2026 ARR milestones; request private data room; revisit recommendation after ARR and NRR
        disclosure. Buy in bull case only if ARR > $35M with NRR > 130% and no ServiceNow bundling event.
      tone: neutral
  claimRefs:
  - CV001
  - CV017
  - CV026
  - CV037
  sourceRefs:
  - SV009
  - SV010
  - SV013

