  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: absolute ARR and revenue quality
    missingEvidence: >
      Serval has disclosed no ARR, MRR, or gross revenue figure. The 500% growth claim from August 2025 has no public
      dollar anchor, making it impossible to calculate the implied ARR multiple, validate the growth rate, or construct
      a bottom-up financial model.
    whyItMatters: >
      At a $1B valuation, undisclosed revenue is the single largest diligence blocker. The implied ARR multiple ranges
      from 17x to 200x depending on an unverifiable revenue base — a range too wide to support an investment decision.
    diligencePath: >
      Request data room: current ARR, monthly revenue since August 2025, revenue recognition policy, and cohort progression
      by customer signing date.
    relatedQuestionRefs:
    - QV003
    - QV004
    relatedTableRefs:
    - TV001
    - TV004
  - type: private-evidence-only
    severity: material
    topic: gross margin and unit economics
    missingEvidence: >
      No gross margin, CAC, LTV, payback period, or NRR data is publicly available. The high-touch onboarding model
      (dedicated deployment engineer per pilot) creates a plausible professional services cost burden that could compress
      gross margins well below the 80% threshold typical for pure-software ITSM.
    whyItMatters: >
      Software companies with heavy onboarding obligations often report 50–65% gross margins versus 75–85% for pure-software
      peers, materially affecting the long-run DCF and comparable-company valuation. The automation guarantee creates
      unquantified credit exposure if the 50% threshold is not achieved.
    diligencePath: >
      Request P&L with service cost allocation, NRR reconciliation, CAC by acquisition channel, and historical SLA credit
      frequency and dollar amount.
    relatedQuestionRefs:
    - QV006
    - QV025
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: material
    topic: burn rate and capital adequacy
    missingEvidence: >
      No cash balance, monthly burn rate, or runway figure has been publicly disclosed following the December 2025 Series B.
      The plan to grow from 30 to 100+ employees in 2026 implies a 3x-plus headcount expansion that will triple or
      quadruple monthly cash consumption before revenue scales proportionally.
    whyItMatters: >
      If headcount expansion does not generate proportional ARR growth, Serval could require a Series C or bridge on
      compressed terms before the current capital is fully deployed, creating a funding-dependency risk that increases
      the probability of a flat or down round.
    diligencePath: >
      Request quarterly treasury reporting, operating model with monthly cash projections, and CFO sign-off on base and
      downside runway scenarios.
    relatedQuestionRefs:
    - QV007
    relatedTableRefs:
    - TV006
  - type: enumeration-incomplete
    severity: material
    topic: comparable valuation table — private company ARR disclosure
    missingEvidence: >
      Moveworks and Aisera — the two most directly comparable private AI ITSM peers — have not disclosed ARR, making
      their implied revenue multiples unverifiable. Serval's own ARR is also undisclosed, making three of five comparables
      in the table reliant on ARR range estimation rather than confirmed data.
    whyItMatters: >
      The comparable set cannot be fully populated with verified revenue multiples for the most relevant peers, which
      reduces the precision of Serval's relative valuation analysis. Public company comparables (ServiceNow, Atlassian)
      are verified but represent a different maturity profile.
    diligencePath: >
      Track any future ARR disclosures from Moveworks, Aisera, or analyst briefings. Request Serval ARR directly in data
      room to enable precise multiple calculation.
    relatedQuestionRefs:
    - QV013
    - QV016
    relatedTableRefs:
    - TV004
  - type: conflicting-data
    severity: moderate
    topic: SEC Form D non-filing regulatory anomaly
    missingEvidence: >
      EDGAR full-text search returned zero Form D results for Serval, Inc. No alternative entity names or foreign holding
      company structures have been publicly confirmed that would explain the absence of the required US exempt offering
      disclosure.
    whyItMatters: >
      The absence may indicate a filing delay, offshore structuring, or non-compliance with US securities law. Any of
      these possibilities requires legal due diligence and, if non-compliance, could constitute a material legal risk
      for investors.
    diligencePath: >
      Confirm legal entity structure; identify the filing entity for each round; request copies of all Regulation D
      exemption notices or equivalent foreign-jurisdiction securities filings from legal counsel.
    relatedQuestionRefs:
    - QV021
    relatedTableRefs:
    - TV006
