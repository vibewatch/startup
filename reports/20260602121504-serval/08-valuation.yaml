sections:
- id: valuation-anatomy
  title: Valuation anatomy and financing context
  body: >
    Serval reached a $1B post-money valuation in December 2025 following a $75M Series B led by Sequoia Capital. The step-up
    is remarkable: PitchBook cited an implied valuation of $232M in August 2025, the same month the company disclosed 500%
    revenue growth. By December 2025 — approximately four months later — Sequoia led a round at a $1B mark, representing a
    4.3x valuation increase in under one fiscal quarter. The total disclosed capital raised stands at $127M ($47M Series A
    in October 2025 led by Redpoint Ventures plus the $75M Series B). Sequoia partner Anas Biad publicly stated the company
    had generated the strongest customer feedback Sequoia had seen since backing ServiceNow sixteen years ago, providing the
    most credible public endorsement for the unicorn mark.

    The financing context, however, exposes structural diligence gaps. No SEC Form D exemption notice was located in the EDGAR
    full-text search system for Serval, Inc., which is unusual for a US company that has accepted approximately $127M in exempt
    securities offerings. Whether this reflects a filing delay, a different filing entity, or an offshore holding structure
    is unresolved. The company had approximately 30 employees at Series B close — an extraordinarily lean operating base for
    a $1B valuation — and plans to reach more than 100 employees by end of 2026, implying a 3x-plus headcount expansion that
    will materially accelerate cash burn before revenue scales proportionally. No cash position, runway, or burn rate has
    been publicly disclosed.
  claimRefs:
