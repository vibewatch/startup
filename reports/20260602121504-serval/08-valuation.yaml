  - TV005

- id: diligence-asks-and-thesis-breaks
  title: Diligence asks and thesis-break triggers
  body: >
    The valuation cannot be underwritten from public evidence. Five private disclosures would close the diligence gap: (1) current
    ARR with cohort-level progression since August 2025 to anchor the 500% growth claim; (2) gross margin split between
    software subscription and professional services onboarding, since the high-touch pilot model may compress margins below
    80%; (3) net revenue retention by customer vintage to validate the land-and-expand thesis; (4) burn rate and runway
    post-Series B to confirm capital adequacy through the planned headcount tripling; and (5) legal entity structure and
    copies of all Regulation D exemption notices or equivalent foreign securities filings.

    The thesis breaks under two primary conditions. The first is a ServiceNow bundling event in which Now Assist is repriced
    to zero incremental cost for existing ITSM customers within 12 months; this would immediately narrow Serval's addressable
    commercial window to companies not already under ServiceNow contract. The second is a security incident in a customer
    environment that is publicly attributed to Serval's agentic AI architecture; the trust damage in enterprise IT procurement
    would be disproportionate relative to any financial remediation cost. Secondary thesis-break conditions include a Series
    C at a flat or down valuation (confirming growth deceleration), loss of a key named customer such as Perplexity or Verkada,
    and departure of the founding team during the critical 2026 scale-up. TechCrunch Startups Weekly in May 2026 named
    Serval alongside Atomicwork and Moveworks as the three AI-native ITSM vendors to watch, reinforcing the competitive
    intensity that makes execution discipline non-negotiable.
  claimRefs:
  - CV022
  - CV023
  - CV031
  - CV040
  - CV041
