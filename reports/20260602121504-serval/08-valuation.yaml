- id: implied-multiples-and-peer-comps
  title: Implied multiples and comparable company benchmarks
  body: >
    Without a disclosed ARR figure, Serval's implied valuation multiple must be inferred from range scenarios. If the August
    2025 revenue base was approximately $2M ARR and the 500% growth implies roughly $12M ARR by Series B close, the $1B
    valuation implies an approximately 83x trailing ARR multiple. If the base was $5M growing to $30M, the multiple compresses
    to roughly 33x. Both cases are within the top decile of early-stage SaaS financings in 2025 and are justifiable only
    by extraordinary growth trajectory expectations. Top-quartile early-stage AI SaaS companies in 2025 received 15–40x
    forward ARR multiples; triple-digit multiples signal either exceptional growth or a compressed and unverifiable revenue
    base. No independent analyst has published a specific ARR estimate for Serval.

    The comparable public company set anchors the ceiling. ServiceNow, the dominant ITSM incumbent, reported approximately
    $10.98B in full-year 2024 revenue at a market capitalization that implies a 13–15x trailing revenue multiple — dramatically
    lower than Serval's implied range, reflecting maturity and cash-flow generation. Atlassian's Jira Service Management
    business trades at approximately 9–10x revenue as its growth has moderated. Moveworks, a private AI ITSM peer, raised
    approximately $300M at a $2.1B valuation with similarly undisclosed ARR, suggesting the investor community is comfortable
    with growth-stage AI ITSM premium multiples. PitchBook's independent tagging of Serval as a $1B company after the round
    provides third-party corroboration for the post-money mark. The ITSM market's subscription-based recurring revenue
    structure supports higher long-run multiples than transactional software, but the Serval multiple requires a growth
    trajectory that is currently unverifiable from public data.
  claimRefs:
