- id: scenario-analysis
  title: Bull, base, and bear scenario analysis
  body: >
    The bull case rests on Serval achieving $40–60M ARR by end of 2026 with 150%+ net revenue retention, successfully crossing
    from tech-native customers into at least two enterprise verticals (financial services or healthcare), and maintaining
    its 50% ticket automation guarantee at scale. Under these conditions a 25–30x forward ARR multiple at a 2027–2028
    exit implies a $1.25–1.8B valuation, generating 1.3–1.8x return from the Series B entry price. The bull case is plausible
    given Sequoia's conviction, the customer proof from Perplexity and Verkada, and the secular shift toward AI-native IT
    automation. It requires sustained exceptional execution across go-to-market, product, and security without a competitive
    response from ServiceNow that bundles AI ITSM at no incremental charge.

    The base case assumes $20–35M ARR by end of 2026 with 120%+ NRR, continued tech-native customer expansion, and a 2028
    exit at 20–25x ARR. This implies a $500M–$875M valuation range — approximately flat to slightly below the Series B entry
    price — with limited return generation for late-stage Series B investors. The bear case assumes ServiceNow bundles Now
    Assist aggressively by Q3 2026 at no incremental charge, compressing Serval's commercial window to the sub-500-employee
    tech company segment. In this scenario Serval reaches only $10–15M ARR by end of 2026, market multiples compress to
    12–15x, and a 2028 exit implies a $150–$225M valuation — a material loss from the $1B Series B entry and a potential
    down-round or distressed exit. Axios reporting from January 2026 confirms that LP scrutiny of AI startup valuations with
    unverifiable revenue bases has sharpened, making the bear case distribution fatter than the headlines suggest.
  claimRefs:
