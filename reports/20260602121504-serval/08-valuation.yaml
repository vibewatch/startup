- id: regulatory-and-adverse-signals
  title: Regulatory anomalies and adverse signals
  body: >
    Three adverse signals merit diligence escalation. First, an EDGAR full-text search for Form D filings by Serval, Inc.
    returned no results as of the analysis date. US Regulation D requires an issuer to file a Form D notice within 15 days
    of the first sale of securities in a Regulation D offering. The absence of this filing for a company that has accepted
    approximately $127M across at least two rounds is an anomaly. It may indicate that Serval is structured under a non-US
    holding entity that routes investment through a foreign vehicle exempt from US Form D requirements, or that filings were
    made under a different legal name, or that compliance was missed. Any of these explanations requires legal due diligence
    and increases regulatory risk in the diligence profile.

    Second, Axios published an analysis in January 2026 documenting heightened LP scrutiny of AI startup valuations where
    revenue is unverified, growth rates are self-reported, and implied multiples exceed 50x. Serval's profile matches the
    criteria Axios identifies as attracting down-round risk: unaudited growth claim, compressed unicorn timeline, and no
    public absolute revenue figure. Third, Dark Reading reported that agentic AI systems deployed in enterprise IT — precisely
    Serval's deployment context — inherit traditional software vulnerabilities including prompt injection and privilege escalation.
    A security incident in a Serval enterprise deployment could create material customer trust damage and remediation cost,
    neither of which is quantified in any public source.
  claimRefs:
  - CV010
  - CV011
  - CV026
  - CV033
  - CV042
