chapter:
  number: 8
  title: Valuation
  summary: >
    Serval's $1B December 2025 Series B valuation represents one of the fastest unicorn timelines in enterprise software
    history — a 4.3x step-up from a PitchBook-cited $232M August 2025 implied mark in under four months. Sequoia Capital's
    conviction is exceptional, the ITSM market structural case is credible, and customer proof from Perplexity, Vercel, and
    Verkada is real but narrow. The investment is not underwriteable on public evidence alone: no ARR, gross margin, burn rate,
    or NRR figure is disclosed; the 500% revenue growth claim has no dollar anchor; and no SEC Form D was found in EDGAR.
    A bull case exists at $50M+ ARR with 150%+ NRR, but the base case is valuation-flat at Series B entry. The verdict is
    track — monitor disclosed growth metrics and require private data room access before a full buy recommendation.
