callouts:
  - calloutType: strength
    title: Sequoia's Rare Preemptive Series B
    body: >-
      Sequoia Capital led a preemptive $75M Series B—an unsolicited, competitive-process-free
      round initiated by the investor—signaling exceptional confidence in Serval's early traction.
      Anas Biad publicly compared the customer feedback to what Sequoia heard before backing
      ServiceNow sixteen years earlier, an extremely strong endorsement from an investor with
      category-defining track record in enterprise software.
    claimRefs:
      - CO020
      - CO021
  - calloutType: risk
    title: Revenue Opacity and Valuation Concentration Risk
    body: >-
      Serval claims 500% revenue growth since August 2025 without disclosing an absolute figure.
      The $1B valuation was achieved with fewer than 30 employees and customer references limited
      to AI-native tech companies. Buyers and co-investors cannot independently verify the revenue
      trajectory or customer concentration without data room access. If absolute revenue is very
      small, the $1B valuation implies an extreme revenue multiple that increases downside risk.
    claimRefs:
      - CO022
      - CO023
      - CO035
  - calloutType: risk
    title: Key-Person Concentration in Jake Stauch
    body: >-
      All public narrative, customer interviews, and investor relationships are mediated through
      Jake Stauch. No named C-suite executives other than co-founder Alex McLeod appear in public
      materials. This level of key-person concentration is typical for a sub-30-person startup
      but becomes a diligence exposure if the company scales rapidly without a deepened leadership
      bench.
    claimRefs:
      - CO009
      - CO010
