  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue
      missingEvidence: Absolute revenue figure or ARR to contextualize the 500% growth claim
      whyItMatters: >-
        Without the denominator, the growth rate is not actionable for valuation or investment
        judgment. A 500% increase from $100K is a very different signal than from $5M.
      diligencePath: Request revenue schedule, MRR/ARR history, and customer ACV distribution
        from the data room
      relatedQuestionRefs:
        - QO002
        - QO012
    - type: private-evidence-only
      severity: material
      topic: cap table
      missingEvidence: Full capitalization table, investor ownership percentages, and board composition
      whyItMatters: >-
        Without cap table detail, no investor can assess governance, control provisions, anti-
        dilution structure, or liquidation preference stack.
      diligencePath: Request cap table from Serval or lead investor; review any filed UCC or state
        corporate filings
      relatedQuestionRefs:
        - QO010
    - type: private-evidence-only
      severity: material
      topic: customers
      missingEvidence: Total customer count, customer churn rate, net revenue retention, and F500 references
      whyItMatters: >-
        All confirmed customers are AI-native technology companies. Enterprise TAM realization
        depends on proven ability to land regulated-industry and F500 buyers.
      diligencePath: Request customer list with contract values, churn data, and NRR from data room
      relatedQuestionRefs:
        - QO018
      relatedTableRefs:
        - TO003
    - type: private-evidence-only
      severity: material
      topic: compliance
      missingEvidence: >-
        SOC 2 Type II audit report or certification letter from a recognized third-party
        auditor; HIPAA Business Associate Agreement template
      whyItMatters: >-
        Company-claimed compliance certifications without independent verification cannot be
        relied on for regulated-industry customer diligence.
      diligencePath: Request current SOC 2 Type II report and HIPAA attestation; verify issuing
        auditor and report date
    - type: missing-source
      severity: material
      topic: adverse
      missingEvidence: >-
        No adverse source specifically critical of Serval's claims, valuation, business model,
        or team was found in public records as of the run date
      whyItMatters: >-
        The absence of public criticism likely reflects the company's youth (under 2 years old)
        rather than genuine absence of risk; absence of coverage is not equivalent to absence
        of risk.
      diligencePath: >-
        Search for HN or Reddit discussions from enterprise IT professionals about Serval;
        request reference calls with existing customers; seek analyst notes from Gartner or
        Forrester on AI ITSM startups
    - type: private-evidence-only
      severity: material
      topic: leadership
      missingEvidence: Full leadership roster, board composition, and CTO/engineering leadership identity
      whyItMatters: >-
        Key-person concentration in Stauch is a diligence exposure; without a named technical
        leader, engineering depth and succession planning cannot be assessed.
      diligencePath: Request org chart, board composition, and officer roster from company or
        from public state incorporation filings
      relatedTableRefs:
        - TO002
    - type: enumeration-incomplete
      severity: minor
      topic: milestones
      missingEvidence: >-
        Exact founding date within 2024; pre-Series A product release dates; first customer
        signed date; any internal governance milestones (board formation, option pool creation)
      whyItMatters: >-
        A complete milestone timeline requires internal data; current chronology is limited
        to public press events only.
      diligencePath: Request company timeline and board deck deck historical milestones
      relatedTableRefs:
        - TO005
acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      TO004 (Product Module and Feature Summary) is an observation of product capabilities
      from official sources; all cells are direct observations from publicly available company
      materials with no estimates or derived values, qualifying for notes: null under the
      tableNotes exception.
