  - id: section-product
    title: Product, Technology, and Compliance
    body: >-
      Serval's platform is organized into five modules: Resolve Requests (help desk ticketing and
      AI resolution), Build Workflows (natural language automation builder), Transform Ticketing
      (AI-native ticketing with two-way sync to ServiceNow, Jira, Zendesk), Manage Access (JIT
      access provisioning and governance), and Manage Assets (unified asset management across MDM,
      procurement, IdP, and HRIS). Each module connects to Serval's central AI agent infrastructure.


      The underlying technical architecture is notable: workflow automations are generated as code
      behind a no-code interface, enabling both non-technical IT managers and engineering teams to
      inspect and manage automations in Git. This "code under the hood" approach is intended to provide
      the reliability and auditability of deterministic code-based workflows while removing the drag-
      and-drop friction of traditional ITSM builders. The platform supports 60+ native integrations
      including Slack, Okta, Google Workspace, GitHub, Jira, ServiceNow, AWS, Confluence, and Kandji.


      Security and compliance are marketed as core product attributes: Serval claims SOC 2 Type II
      certification, HIPAA compliance, and GDPR conformance. The platform uses TLS 1.3 for data
      in transit and AES-256 at rest, with role-based access control, audit logging, SAML/SCIM
      support, and SIEM integration. The company offers flexible deployment including self-hosted
      options via Terraform and Kubernetes. Serval's Acceptable Use Policy (AUP) is publicly
      documented and explicitly prohibits use of the platform to compete against Serval, consistent
      with standard enterprise SaaS terms. The company guarantees a 50% automation rate with a
      guided pilot program and dedicated deployment engineer support.
    claimRefs:
