company:
  name: Serval
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Serval is a San Francisco-based AI-native IT service management startup founded in 2024 that
    uses a two-agent architecture to automate help desk, access provisioning, and workflow
    orchestration for enterprise IT teams. Having reached unicorn status in December 2025 after
    a $75M Series B led by Sequoia Capital—just three months after its $47M Series A—the company
    claims 500% revenue growth but declines to disclose absolute figures, a transparency gap that
    warrants diligence scrutiny alongside its rapid valuation trajectory and sub-30-person headcount.
sections:
  - id: section-identity
    title: Identity, Founding, and Operating Model
    body: >-
      Serval, Inc. is an AI-native IT service management (ITSM) company headquartered at San Francisco,
      CA 94104. The company was founded in 2024 by Jake Stauch (CEO) and Alex McLeod, with a stated
      mission to replace legacy ticketing and workflow tools by deploying AI agents that can autonomously
      resolve help desk requests, provision access, onboard employees, and build workflow automations
      through natural language. The company operates as a private venture-backed corporation under
      Delaware incorporation and markets its product as "AI agents for IT."


      Serval's product is described as an AI-native unified platform combining a help desk, access
      management, and automation engine. The company's differentiated architecture uses two distinct
      AI agents: a Help Desk Agent that interfaces with employees via Slack, Teams, email, or web portal
      and resolves requests by calling pre-approved deterministic tools; and an Automation Agent that
      allows administrators to build those tools using natural language instructions—what the CEO calls
      "vibe coding for IT automation." A third Insights Agent analyzes ticket patterns to surface
      automation opportunities and configuration improvements. This separation of tool-building from
      tool-execution is central to Serval's enterprise security posture: the Help Desk Agent can only
      invoke pre-authorized automations, which prevents a class of "rogue AI" incidents where an
      unconstrained agent could take destructive actions.


      As of the run date, Serval's business model is enterprise SaaS with custom, quote-based pricing.
      The company offers cloud-hosted, hybrid, and self-hosted deployment options, targeting technology
      companies and enterprises with complex IT automation needs. Its go-to-market strategy supports
      both full platform replacement of legacy ITSM tools and an "AI layer" overlay on existing systems
      for customers locked into long-term contracts. Serval is incorporated as Serval, Inc. and its
      legal domain for product terms is serval.com.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
      - CO008
    tableRefs:
      - TO001
  - id: section-leadership
    title: Founders, Leadership, and Key-Person Risk
    body: >-
      Jake Stauch serves as CEO and co-founder of Serval. He is the primary public face of the
      company, appears in all major press interviews, and is the creator of the "vibe coding"
      framing central to Serval's product narrative. Alex McLeod is the other named co-founder
      and is listed as co-founder in Redpoint's portfolio page, though McLeod has not appeared
      prominently in public-facing coverage. No additional named C-suite executives, board members,
      or advisors appear in public materials as of the run date, reflecting the company's very early
      stage and sub-30-employee headcount.


      The Redpoint portfolio page identifies three Redpoint partners who sponsored the Series A deal:
      Alex Bard, Patrick Chase, and Jordan Segall. General Catalyst's Serval portfolio page names
      Marc Bhargava, Vedant Suri, and Kate Bender as the GC investors involved. The Sequoia Serval
      page lists Anas Biad as the lead Sequoia partner on the Series B—Biad publicly quoted saying
      the customer feedback was as strong as what Sequoia heard before partnering with ServiceNow
      sixteen years ago, an unusually direct comparison for a Series B press cycle.


      The Serval Start program, launched in May 2026, is an additional signal about the founding
      team's ambitions. This two-year program recruits technical builders to work at Serval as a
      path to founding their own companies, with workshops led by Stauch, Christine Kim (Head of
      Strategic Projects), Bill Trenchard (First Round partner), Greg Rosen (BoxGroup partner),
      Anas Biad (Sequoia partner), and Patrick Chase (Redpoint partner). The program is a talent
      acquisition and brand-building initiative that also reveals the senior leadership tier at Serval
      is still very small—Christine Kim appears to be the only named operating executive aside from
      Stauch. Key-person concentration in Stauch is a central diligence concern.
    claimRefs:
      - CO009
