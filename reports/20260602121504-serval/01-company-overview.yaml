  - id: section-funding
    title: Funding History, Valuation, and Investor Map
    body: >-
      Serval's funding trajectory is rapid even by 2025 venture-capital standards. The company
      completed a $47 million Series A in October 2025, led by Redpoint Ventures with participation
      from First Round Capital, General Catalyst, BoxGroup, Bessemer Venture Partners, Meritech
      Capital, Strike Capital, Sunflower Capital, and Operator Partners, as well as a cohort of
      angel investors. The Series A valued Serval at approximately $232 million, per PitchBook
      data cited in Reuters reporting.


      Just three months later in December 2025, Serval closed a $75 million Series B led by
      Sequoia Capital—a preemptive round, per Anas Biad's public comments—with Redpoint, Meritech,
      and General Catalyst also participating. The Series B brought total capital raised to $127 million
      and valued the company at $1 billion, making Serval a unicorn. The 4x valuation step-up
      in three months (from roughly $232M to $1B) occurred alongside Serval's claim of 500% revenue
      growth since August 2025, though absolute revenue figures were not disclosed.


      Serval plans to deploy Series B capital on hiring for go-to-market and engineering functions,
      targeting a headcount expansion from under 30 employees to more than 100. The company's investor
      base includes institutions with deep enterprise software expertise: Sequoia has backed ServiceNow,
      which is Serval's primary incumbent competitor; Redpoint has led the deal; and General Catalyst,
      First Round, and Bessemer round out the blue-chip backing. There is no evidence of secondary
      liquidity, debt, or credit facilities in public reporting as of the run date.
    claimRefs:
      - CO016
