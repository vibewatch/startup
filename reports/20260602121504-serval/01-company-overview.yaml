  - id: section-traction
    title: Customer Traction, Go-to-Market, and Scale
    body: >-
      Serval's publicly confirmed customer base includes Perplexity, Together AI, Mercor, Vercel,
      Verkada, and Clay—all technology companies at the AI-native end of the enterprise buyer
      spectrum. The company claims that its platform automates more than 50% of incoming IT tickets
      from day one for its customers; the case study on the homepage features a customer testimonial
      from Vernon Man, Head of IT, stating "Once we switched over to Serval, we were able to complete
      over 50% of our incoming requests automatically." No enterprise F500 customers are publicly
      named, and all confirmed customers are technology-forward companies that may not represent the
      full enterprise-IT buyer landscape.


      Revenue grew 500% from August 2025 to December 2025, per company statements cited by Reuters,
      without disclosure of absolute figures. For a company that completed its Series A in October
      2025, the revenue base as of August 2025 was likely very early—making the 500% figure
      meaningful as a signal of traction trajectory but insufficient as a standalone growth metric
      without the absolute denominator. Customer count is not publicly disclosed.


      Go-to-market is primarily direct sales with a structured deployment program: Phase 1 (Meet),
      Phase 2 (Build), Phase 3 (Deploy), Phase 4 (Optimize). The company's pricing is quote-based
      and enterprise-only; no self-serve or SMB tier is offered. The Serval Start program signals
      a longer-term recruitment and brand strategy, while the active blog and case study publication
      suggest a content-led demand generation motion. As of June 2026, the blog references comparison
      articles about Eesel and Siit alternatives—indicating targeting of specific mid-market ITSM
      buyer segments alongside the flagship enterprise motion.
    claimRefs:
      - CO032
      - CO033
      - CO034
      - CO035
      - CO036
      - CO037
    figureRefs:
      - FO003
  - id: section-milestones
    title: Milestone Chronology and Adverse Checks
    body: >-
      Serval's public record covers approximately two years from founding to unicorn status. No
      regulatory actions, legal proceedings, sanctions, or enforcement actions against Serval,
      its founders, or named executives appear in public records as of the run date. No product
      outages, security incidents, or data breach notifications appear in public materials. No
      layoffs or reported leadership departures are found in any public source.


      The primary adverse diligence considerations are structural rather than event-based: the
      company declined to disclose absolute revenue figures when reporting 500% growth; it has
      achieved unicorn status with fewer than 30 employees and no public financial verification;
      its confirmed customer list is confined to technology companies with no public F500 or
      regulated-industry references; and its core competitive thesis (replacing ServiceNow and
      similar incumbents) faces sustained competition from ServiceNow's own AI agent product
      launches. Gartner Peer Insights for AI ITSM markets lists verified enterprise deployments
      of established vendors, and Serval's absence from this verification track represents a
      material enterprise trust gap for regulated or large-enterprise buyers.


      No known founder conflicts of interest, outstanding litigation, or FINRA/SEC-adjacent
      concerns appear in public materials. The founding team is described as an "elite team of
      builders and sellers" on the careers page, consistent with a pre-scale startup in hiring
      mode. The company's rapid funding pace and aggressive unicorn narrative are high-stakes
      reputational commitments that increase the consequences of any execution shortfall.
    claimRefs:
      - CO038
      - CO039
      - CO040
      - CO041
      - CO042
