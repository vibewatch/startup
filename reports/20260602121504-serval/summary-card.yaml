  topStrengths:
    - >-
      Fastest unicorn timeline in enterprise ITSM history, with Sequoia leading a preemptive Series B and comparing
      early customer signals to ServiceNow.
    - >-
      Two-agent architecture (tool-builder + tool-executor separation) provides a defensible enterprise security story
      that reduces AI-governance risk.
    - >-
      Seven named, verifiable technology-native customers with an independently corroborated 50%+ automation rate from
      day one.
  topRisks:
    - >-
      Revenue growth claim (500% Aug–Dec 2025) is entirely unanchored — no absolute ARR or MRR has been disclosed,
      making verification and peer benchmarking impossible.
    - >-
      Extreme key-person concentration in CEO Jake Stauch; no named C-suite, board, or engineering leadership beyond
      co-founder Alex McLeod and one strategic-projects hire.
    - >-
      Customer base is exclusively AI-startup and tech-native, raising serious questions about enterprise crossover
      readiness, regulated-industry compliance, and churn risk if funded customers contract.
  unresolvedGaps:
    - >-
      Absolute ARR or MRR to anchor the 500% growth claim and assess revenue quality, cohort retention, and sustainable
      growth rate.
    - Unit economics — CAC, LTV, payback period, gross margin, and net revenue retention — are entirely private.
    - SEC Form D filing was not found in EDGAR for Serval, Inc., which is unusual given the disclosed funding scale.
    - Preference stack, liquidation waterfall, and cap-table terms at the $1B Series B price.
    - Named enterprise or non-tech customers; current named list is all venture-backed AI and software companies.
