summary:
  headline: >-
    Serval has exceptional investor conviction and a credible AI-native ITSM architecture, but the unanchored revenue
    growth claim, all-tech-startup customer base, sub-30-person headcount, and complete absence of disclosed unit
    economics leave the $1B valuation impossible to underwrite from public evidence alone.
