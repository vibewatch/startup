        blocks:
          - type: paragraph
            body: >
              Serval's capital history is remarkable for its speed. The company was founded in 2024 and by December 2025
              had accumulated $127M in disclosed venture funding across two main rounds. The Series A of $47M, led by
              Redpoint Ventures, closed in October 2025 with participation from First Round Capital, General Catalyst,
              BoxGroup, Bessemer Venture Partners, Chemistry VC, Strike Capital, Sunflower Capital, and Operator
              Partners. Just seven weeks later, Sequoia Capital led a $75M Series B at a $1B post-money valuation,
              making Serval one of the fastest unicorns in enterprise software history.

              The valuation trajectory is particularly striking. A PitchBook figure cited in the Reuters article placed
              Serval's implied valuation at $232M in August 2025 — the same summer when the company first disclosed its
              500% revenue growth claim. By December 2025 the valuation had reached $1B, a 4.3x step-up in approximately
              three months. No debt facilities, convertible notes, or project-finance obligations have been disclosed.
              Capital deployment is reportedly targeted at engineering headcount and go-to-market hiring. The company
              aims to scale from roughly 30 employees at Series B to more than 100 by end of 2026, which implies a
              significant cash burn acceleration and a material execution dependency on maintaining the growth rate that
              attracted Sequoia's lead. No SEC Form D filing was located in the EDGAR system for Serval, Inc., which is
              uncommon for a US company that has accepted exempt securities offerings of this scale.
