      - number: '2.2'
        title: TAM, SAM, and SOM sizing lenses
        blocks:
          - type: paragraph
            body: >-
              The broadest ITSM TAM is provided by MarketsandMarkets, which projects the global ITSM market to reach
              $22.1 billion by 2028 at a compound annual growth rate of 15.9%, measured from a 2023 base. This figure
              encompasses on-premise and cloud ITSM solutions across all verticals and organization sizes, and includes
              service desk software, change and configuration management, operations and performance management, and IT
              asset management. The same data source projects the AIOps platform market to reach $32.4 billion by 2028
              at a 22.7% CAGR, which reflects the broader AI-in-IT-operations space that includes observability, event
              correlation, and automation tooling beyond pure ITSM.

              A narrower lens is the cloud ITSM sub-market, which is the most directly relevant to Serval's product.
              MarketsandMarkets separately projects cloud system management (encompassing ITSM, ITOM, and ITACM) to grow
              from $10.6 billion in 2020 to $31.4 billion by 2025, implying a CAGR of 24.1%. This growth rate reinforces
              the shift to SaaS ITSM delivery that Serval's cloud-native and self-hosted deployment model addresses.
              Freshservice's publicly disclosed customer count of 74,000+ businesses provides a demand-side cross-check:
              it implies that mid-market ITSM is a mature and well-adopted category where displacing incumbents requires
              a compelling differentiation story.

              Serval's SAM is best estimated by filtering the ITSM market to AI-native and high-automation-potential
              deployments. Based on Serval's current customer profile (fast-growing technology companies, 50–2,000
              employees), the SAM is likely a fraction of the total ITSM market, perhaps $2–4 billion today growing at
              30%+ as AI-native ITSM displaces workflow-centric predecessors. The SOM is not publicly documented and
              cannot be isolated from available evidence; it is treated as an open sizing gap. Key contradictions in
              public estimates include the gap between the headline ITSM number ($22.1B, narrow software only) and the
              cloud system management figure ($31.4B), which uses a broader definition, as well as the AIOps figure
              ($32.4B), which includes observability and event management that Serval does not address.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM017
              - CM040
              - CM041
