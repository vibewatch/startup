chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Founding, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Serval, Inc. is an AI-native IT service management (ITSM) company headquartered at San Francisco, CA
              94104. The company was founded in 2024 by Jake Stauch (CEO) and Alex McLeod, with a stated mission to
              replace legacy ticketing and workflow tools by deploying AI agents that can autonomously resolve help desk
              requests, provision access, onboard employees, and build workflow automations through natural language.
              The company operates as a private venture-backed corporation under Delaware incorporation and markets its
              product as "AI agents for IT."


              Serval's product is described as an AI-native unified platform combining a help desk, access management,
              and automation engine. The company's differentiated architecture uses two distinct AI agents: a Help Desk
              Agent that interfaces with employees via Slack, Teams, email, or web portal and resolves requests by
              calling pre-approved deterministic tools; and an Automation Agent that allows administrators to build
              those tools using natural language instructions—what the CEO calls "vibe coding for IT automation." A
              third Insights Agent analyzes ticket patterns to surface automation opportunities and configuration
              improvements. This separation of tool-building from tool-execution is central to Serval's enterprise
              security posture: the Help Desk Agent can only invoke pre-authorized automations, which prevents a class
              of "rogue AI" incidents where an unconstrained agent could take destructive actions.


              As of the run date, Serval's business model is enterprise SaaS with custom, quote-based pricing. The
              company offers cloud-hosted, hybrid, and self-hosted deployment options, targeting technology companies
              and enterprises with complex IT automation needs. Its go-to-market strategy supports both full platform
              replacement of legacy ITSM tools and an "AI layer" overlay on existing systems for customers locked into
              long-term contracts. Serval is incorporated as Serval, Inc. and its legal domain for product terms is
              serval.com.
