            body: >-
              Serval operates at the intersection of enterprise software and consequential automated decision-making, a
              combination that is increasingly regulated. The EU AI Act, published in the Official Journal on 12 July
              2024, imposes binding transparency and human oversight requirements for AI systems making or influencing
              significant decisions. Automated IT access provisioning and employee offboarding decisions may qualify as
              high-risk applications under Annex III's employment category, depending on deployment context and
              interpretation by EU regulators. GDPR Article 22 independently restricts fully automated decisions with
              legal or similarly significant effects on individuals, requiring meaningful human intervention. Serval's
              own AUP acknowledges this constraint by prohibiting "fully automated decisions with legal or similarly
              significant effects on individuals without meaningful human oversight" and requiring "qualified human
              review and approval" before AI-generated recommendations are relied upon for consequential decisions—a
              self-limiting clause that partially mitigates but does not eliminate regulatory risk.


              A material governance anomaly surfaced in research: no SEC Form D filing was found for Serval in EDGAR for
              the period 2025 through the run date, despite approximately $127M in disclosed venture fundraising ($47M
              Series A, $75M Series B). Under Regulation D, companies conducting private securities offerings must
              typically file Form D within 15 days of the first sale. The absence of any filing is either an oversight
              requiring correction or signals that the offerings were structured under an alternative exemption; in
              either case, the gap warrants specific inquiry during diligence. CISA's 2026 guidance on careful adoption
              of agentic AI services adds a regulatory pressure layer for enterprise buyers in critical infrastructure
              sectors who are Serval customers, creating indirect compliance overhead for the sales process.
            claimRefs:
              - CR005
              - CR006
              - CR011
              - CR013
              - CR014
