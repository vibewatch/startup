      expansion into additional departments and deeper workflow automation as the post-deployment growth loop.
    data:
      nodes:
        - label: Discover
          description: >
            Prospect is referred via VC network, inbound marketing, or SDR outreach; demo scheduled via serval.com Book
            a Demo CTA. Key actors: IT Director / CTO.
        - label: Evaluate (Meet Phase)
          description: >
            Guided pilot scoping; dedicated deployment engineer assigned; IT ticket inventory assessed for automation
            surface area. Friction: high-touch, no self-serve trial documented.
        - label: Build Phase
          description: >
            Workflow automations described in natural language; Automation Agent generates deterministic code; IT admin
            reviews and approves permissions. Friction: code review required; learning curve for natural-language
            automation.
        - label: Deploy Phase
          description: >
            Help Desk Agent goes live in Slack / Teams / email portal; 50%+ ticket automation targeted on day one.
            Friction: employee adoption; integration parity with existing tools required.
        - label: Optimize Phase
          description: >
            Insights Agent surfaces workflow recommendations; knowledge base updated; security configuration tightened.
            Friction: change management for AI-suggested updates.
        - label: Expand to New Depts
          description: >
            Additional departments (HR, Legal, Finance) adopt Serval; integration count grows across Okta, GitHub, Jira,
            Salesforce, etc. Friction: cross-department budget and procurement coordination.
    approximationNotes: >
      Journey phases are derived from Serval's pricing page and onboarding documentation. Friction points are inferred
      from the platform architecture and competitive context, not from disclosed customer interviews.
    claimRefs:
      - CU022
      - CU023
      - CU035
  - id: FU002
    title: Adoption / Deployment Funnel
    type: flow
    layout: standard
    summary: >
      The adoption flow from initial awareness through production deployment and departmental expansion, with evidence
      quality ratings at each stage.
    data:
      nodes:
        - label: Referred or Aware
          description: |
            VC network referrals dominate; inbound signal limited; no disclosed conversion rate.
        - label: Demo Booked
          description: |
            Prospect schedules demo via serval.com CTA; no self-serve trial or PLG motion documented.
        - label: Pilot Scoped (Meet)
          description: |
            Guided pilot with dedicated deployment engineer; high-touch; no timeline or conversion data disclosed.
        - label: Workflows Built (Build)
          description: |
            Natural-language automation coding phase; engineering-assisted workflow generation; IT admin approval gate.
        - label: Production Deployed (Deploy)
          description: >
            Help Desk Agent live in Slack / Teams / email; 50%+ ticket automation claimed day-one by Serval, Reuters,
            and Sequoia.
        - label: Optimized
          description: >
            Insights Agent recommendations applied; knowledge base updated; security configuration tightened per Serval
            documentation.
        - label: Expanded to New Depts
          description: >
            HR, Legal, Finance departments adopt Serval per Reuters Dec 2025; no multi-department reference customers
            publicly confirmed.
    approximationNotes: >
      Funnel stages are structural (based on documented phases) rather than quantitative. No conversion rate or stage
      volume data is publicly available; the flow represents the documented customer onboarding sequence.
