              - CR040
              - CR041
              - CR042
      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: SEC Form D Absence Is a Material Governance Red Flag
            body: >-
              EDGAR searches return zero Form D filings for Serval across multiple query formulations covering the
              2025–2026 fundraising period. Under Regulation D, Form D is typically required within 15 days of first
              sale. The absence is either a compliance gap requiring correction or signals an unusual exemption
              structure that must be explained by counsel before closing any investment. This is a blocking diligence
              item.
            calloutType: risk
            claimRefs:
              - CR016
              - CR017
          - type: callout
            title: Agentic AI Security Incident Precedent Is Directly Analogous to Serval's Attack Surface
            body: >-
              The ServiceNow exploit (overly permissive chatbot, email-only authentication) and the 47-second
              support-ticket exploit chain both involve the exact input vector—IT support tickets—that Serval's Help
              Desk Agent processes. The pre-authorization architecture reduces blast radius but does not eliminate the
              risk. Serval has not published penetration test results or disclosed its AI red-team findings.
            calloutType: risk
            claimRefs:
              - CR002
              - CR038
              - CR007
          - type: callout
            title: Require ARR, NRR, and SLA Performance Data Before Proceeding
            body: >-
              Serval's entire investment thesis rests on revenue growth quality (500% growth claim, no ARR), automation
              performance (50% SLA guarantee, no customer aggregate data), and customer retention (no churn data). These
              are not nice-to-have metrics; they are the minimum verifiable inputs required to evaluate whether the $1B
              valuation is defensible.
            calloutType: recommendation
            claimRefs:
              - CR012
              - CR036
              - CR037
          - type: callout
            title: Pre-Authorization Architecture Is the Right Design Approach
            body: >-
              Separating tool-building (Automation Agent) from tool-execution (Help Desk Agent) with a pre-authorization
              constraint addresses the primary governance failure mode for autonomous AI agents. NIST AI 100-2 and CISA
              2026 guidance both identify access scope limitation as a key control. Serval's architecture aligns with
              these recommendations and differentiates it from less constrained agentic competitors.
            calloutType: strength
            claimRefs:
              - CR007
              - CR039
              - CR041
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation anatomy and financing context
        blocks:
          - type: paragraph
            body: >
              Serval reached a $1B post-money valuation in December 2025 following a $75M Series B led by Sequoia
              Capital. The step-up is remarkable: PitchBook cited an implied valuation of $232M in August 2025, the same
              month the company disclosed 500% revenue growth. By December 2025 — approximately four months later —
              Sequoia led a round at a $1B mark, representing a 4.3x valuation increase in under one fiscal quarter. The
              total disclosed capital raised stands at $127M ($47M Series A in October 2025 led by Redpoint Ventures
              plus the $75M Series B). Sequoia partner Anas Biad publicly stated the company had generated the strongest
              customer feedback Sequoia had seen since backing ServiceNow sixteen years ago, providing the most credible
              public endorsement for the unicorn mark.

              The financing context, however, exposes structural diligence gaps. No SEC Form D exemption notice was
              located in the EDGAR full-text search system for Serval, Inc., which is unusual for a US company that has
              accepted approximately $127M in exempt securities offerings. Whether this reflects a filing delay, a
              different filing entity, or an offshore holding structure is unresolved. The company had approximately 30
              employees at Series B close — an extraordinarily lean operating base for a $1B valuation — and plans to
              reach more than 100 employees by end of 2026, implying a 3x-plus headcount expansion that will materially
              accelerate cash burn before revenue scales proportionally. No cash position, runway, or burn rate has been
              publicly disclosed.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV021
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV037
              - CV038
              - CV039
      - number: '8.2'
        title: Implied multiples and comparable company benchmarks
        blocks:
          - type: paragraph
            body: >
              Without a disclosed ARR figure, Serval's implied valuation multiple must be inferred from range scenarios.
              If the August 2025 revenue base was approximately $2M ARR and the 500% growth implies roughly $12M ARR by
              Series B close, the $1B valuation implies an approximately 83x trailing ARR multiple. If the base was $5M
              growing to $30M, the multiple compresses to roughly 33x. Both cases are within the top decile of
              early-stage SaaS financings in 2025 and are justifiable only by extraordinary growth trajectory
              expectations. Top-quartile early-stage AI SaaS companies in 2025 received 15–40x forward ARR multiples;
              triple-digit multiples signal either exceptional growth or a compressed and unverifiable revenue base. No
              independent analyst has published a specific ARR estimate for Serval.

              The comparable public company set anchors the ceiling. ServiceNow, the dominant ITSM incumbent, reported
              approximately $10.98B in full-year 2024 revenue at a market capitalization that implies a 13–15x trailing
              revenue multiple — dramatically lower than Serval's implied range, reflecting maturity and cash-flow
              generation. Atlassian's Jira Service Management business trades at approximately 9–10x revenue as its
              growth has moderated. Moveworks, a private AI ITSM peer, raised approximately $300M at a $2.1B valuation
              with similarly undisclosed ARR, suggesting the investor community is comfortable with growth-stage AI ITSM
              premium multiples. PitchBook's independent tagging of Serval as a $1B company after the round provides
              third-party corroboration for the post-money mark. The ITSM market's subscription-based recurring revenue
              structure supports higher long-run multiples than transactional software, but the Serval multiple requires
              a growth trajectory that is currently unverifiable from public data.
            claimRefs:
              - CV012
              - CV013
              - CV017
              - CV018
              - CV019
              - CV020
              - CV024
              - CV025
              - CV029
              - CV035
              - CV036
          - type: table
            tableRef: TV004
