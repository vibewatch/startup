      - number: '5.2'
        title: Two-Agent Architecture and Workflow Engine
        blocks:
          - type: paragraph
            body: >-
              Serval's core architectural differentiator is the deliberate separation of its AI agents into specialist
              roles with bounded permissions. The architecture features three agents with distinct functions. The
              Automation Agent (used by IT administrators) accepts natural-language descriptions of desired automations,
              generates deterministic code-based workflows behind the scenes, and exposes them in a no-code UI for
              review and management. Code can also be inspected directly and managed in Git by technical teams. The Help
              Desk Agent (used by end-user employees) resolves requests exclusively by invoking pre-approved automations
              already built by the Automation Agent; it cannot take ad-hoc actions outside that permission set. The
              Insights Agent operates autonomously to analyze patterns, surface suggested automations, and recommend
              knowledge base content updates.


              CEO Jake Stauch explained the security rationale to TechCrunch in October 2025: "You don't want someone to
              go into Slack and say, 'Hey, I want to delete all the data at the company,' and the very helpful AI agent
              responds, 'Great, I'll delete all the data.' Instead it will say, 'Hey, I don't have a tool for deleting
              all the data the company.'" The Help Desk Agent can only invoke tools pre-authorized by an administrator,
              which confines the blast radius of a potential AI error or adversarial prompt to the permission set
              already granted.


              The workflow engine generates code from natural language, not drag-and-drop logic blocks. Serval describes
              this as "vibe coding for IT automation"—a deliberate product narrative framing it as analogous to the
              broader vibe-coding trend. Workflows are stored as code, allowing version control and CI/CD pipeline
              integration, while the no-code UI provides a representation accessible to non-engineers. The company
              states that the workflow engine supports deterministic, multi-step execution with predictable, auditable
              output.


              No public technical white paper, open-source repository, or independent benchmark describes the LLM
              provider(s) powering the agents, the RAG pipeline used for knowledge-base retrieval, the latency
              characteristics of workflow execution, or the reliability of the code-generation layer. These are material
              gaps for a product making enterprise reliability and compliance claims. NIST AI 100-2 (2025) identifies
              prompt injection and adversarial inputs as key risks for LLM- based agentic systems—risks Serval mitigates
              architecturally through deterministic tool- gating but cannot eliminate entirely at the LLM-inference
              layer.
            claimRefs:
