      - number: '5.3'
        title: Integrations, Deployment Options, and API
        blocks:
          - type: paragraph
            body: >-
              Serval's integrations page lists 60+ connectors spanning identity providers, HR systems, cloud platforms,
              ticketing tools, device management, and developer tools. Verified named integrations visible on the
              integrations page include: Okta, JumpCloud, Microsoft Graph, Google Workspace, Slack, Jira, Linear,
              ServiceNow, GitHub, AWS, Rippling, BambooHR, Confluence, Notion, CrowdStrike, Jamf, Kandji, PagerDuty,
              Opsgenie, incident.io, Rootly, Ramp, Navan, HubSpot, Asana, ClickUp, Figma, Calendly, Ashby, Ironclad,
              PandaDoc, Persona, Envoy, Sigma Computing, and Fresh Service, plus a custom-app option. These span four
              functional categories: Access Management, Knowledge Base, Ticket Syncing, and Workflows. The breadth is
              competitive for a sub-30-employee company, though the depth (number of actions/triggers per integration)
              is not disclosed.


              Deployment is offered in two modes. Cloud-hosted is fully managed by Serval with no customer
              infrastructure burden, automatic updates, and a 99.9% uptime SLA. Self-hosted deploys in the customer's
              private cloud using Terraform and Kubernetes and can be provisioned in hours according to documentation;
              this option is targeted at enterprises with data-residency or privacy requirements. No public status page
              was found, preventing independent validation of the 99.9% SLA claim.


              Technical API access is documented: Serval offers full API access to all integrations and supports custom
              integrations to any system via API. The pricing page references a CLI. Terraform is supported for
              infrastructure provisioning and custom access patterns. SCIM is listed for identity-provider integration.
              These capabilities target DevOps and platform engineering teams who want to embed Serval into existing
              CI/CD and IaC pipelines.


              The Serval AUP explicitly prohibits reverse-engineering, disassembling, or deriving source code from the
              service; prohibits using outputs to build competing AI products; and requires human review before relying
              on AI-generated outputs for consequential decisions—signaling that the company acknowledges AI reliability
              limitations.
