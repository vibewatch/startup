  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >
      The recommendation chain moves from market and proof signals through risk and valuation filters to a track
      decision. Sequoia conviction and market size are positive; revenue opacity, regulatory anomaly, and ServiceNow
      bundling risk prevent a full buy recommendation.
    data:
      nodes:
        - id: market_signal
          label: Market signal — positive
          detail: >-
            ITSM market $11–13B in 2024, projected $22–29B by 2029–2032; AI-native sub-segment growing fastest; Sequoia
            tier-1 endorsement.
          tone: positive
        - id: proof_signal
          label: Proof signal — narrow
          detail: >-
            Seven named tech-native customers (Perplexity, Vercel, Verkada, Clay, Cribl, Mercor, Together AI); 500%
            growth claim unanchored to dollar figure; no Fortune 500 or regulated-industry logos.
          tone: neutral
        - id: risk_signal
          label: Risk signal — elevated
          detail: >-
            No ARR or gross margin disclosure; no SEC Form D in EDGAR; ServiceNow Now Assist bundling threat; agentic AI
            security vulnerabilities documented by Dark Reading/Acronis; Axios LP scrutiny of unverifiable AI
            valuations.
          tone: risk
        - id: valuation_signal
          label: Valuation signal — expensive
          detail: >-
            $1B at implied 33–83x ARR multiple depending on unverifiable revenue base; 4.3x step-up in 4 months; no
            independent ARR audit; base case returns flat-to-negative from Series B entry.
          tone: warning
        - id: recommendation
          label: Recommendation — Track
          detail: >-
            Monitor May–December 2026 ARR milestones; request private data room; revisit recommendation after ARR and
            NRR disclosure. Buy in bull case only if ARR > $35M with NRR > 130% and no ServiceNow bundling event.
          tone: neutral
    claimRefs:
      - CV001
      - CV017
      - CV026
      - CV037
    sourceRefs:
      - SV009
      - SV010
      - SV013
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >
      Implied valuation at the $1B Series B mark under six ARR scenarios with a fixed 33x ARR multiple applied. The
      sensitivity illustrates how dramatically the implied multiple varies with the unverifiable revenue base.
    data:
      items:
        - label: $5M ARR → implied 200x multiple
          value: 200
        - label: $10M ARR → implied 100x multiple
          value: 100
        - label: $15M ARR → implied 67x multiple
          value: 67
        - label: $25M ARR → implied 40x multiple
          value: 40
        - label: $40M ARR → implied 25x multiple
          value: 25
        - label: $60M ARR → implied 17x multiple
          value: 17
    approximationNotes: >
      All ARR figures are inferred scenarios; no public ARR has been disclosed by Serval. The y-axis represents the
      implied revenue multiple at the $1B Series B post-money valuation. A 25x multiple would require ~$40M ARR,
      consistent with the bull case but not yet verifiable from public data.
    claimRefs:
      - CV017
      - CV018
      - CV019
    sourceRefs:
      - SV010
      - SV016
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >
      Three-scenario exit valuation range for Serval from Series B entry ($1B) through a 2027–2028 liquidity event. The
      bull case generates modest positive returns; the base case is flat-to-negative; the bear case is deeply negative.
    data:
      items:
        - label: Bull case — 2028 exit valuation ($B)
          low: 1.25
          mid: 1.5
          high: 1.8
          displayValue: $1.25–$1.8B
          detail: >-
            Requires $40–60M ARR by Dec 2026, 150%+ NRR, vertical expansion. 25–30x ARR multiple on $50M midpoint.
            1.3–1.8x return from Series B entry.
          tone: positive
        - label: Base case — 2028 exit valuation ($B)
          low: 0.5
          mid: 0.65
          high: 0.9
          displayValue: $500M–$900M
          detail: >-
            $20–35M ARR by Dec 2026, 120% NRR, tech-native only. 20x ARR multiple on $28M midpoint. Flat-to-0.9x return
            from Series B entry — capital preservation at best.
          tone: neutral
        - label: Bear case — 2028 exit valuation ($B)
          low: 0.1
          mid: 0.2
          high: 0.3
          displayValue: $100M–$300M
          detail: >-
            ServiceNow bundles AI ITSM for free, Serval reaches only $10–15M ARR. 12–15x ARR on $12M midpoint. 0.1–0.3x
            return — 70–90% loss from Series B entry.
          tone: negative
    approximationNotes: >
      All scenario ARR figures are estimates. Exit multiples reference 2024–2025 public SaaS comparable company
      transactions. Returns are gross of management fees, carry, and preference stack — net returns to limited partners
      would be lower.
    claimRefs:
      - CV037
      - CV038
      - CV039
    sourceRefs:
      - SV009
      - SV010
      - SV016
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: >
      IC-ready scoring across six investment dimensions for Serval as of June 2026. Market and investor quality score
      high; evidence quality and valuation discipline score low due to the private-evidence gap.
    data:
      items:
        - label: Market opportunity
          value: High
          detail: >-
            ITSM $11–13B 2024, projected $22–29B by 2029–2032; AI-native sub-segment growing fastest per 4 independent
            analyst reports.
        - label: Investor quality
          value: High
          detail: >-
            Sequoia Capital lead; Redpoint co-investor; General Catalyst and First Round participants — tier-1
            enterprise software syndicate.
        - label: Product differentiation
          value: Medium
          detail: >-
            Two-agent architecture and 50% automation guarantee are operationally credible but unvalidated at enterprise
            scale.
        - label: Revenue proof
          value: Low
          detail: >-
            500% growth claim has no ARR anchor; seven tech-native customers named; no Fortune 500 or regulated-industry
            logos.
        - label: Valuation discipline
          value: Low
          detail: >-
            Implied 33–83x ARR multiple is at the top decile of early-stage SaaS; bear case returns are deeply negative
            from $1B entry.
        - label: Evidence quality
          value: Low
          detail: >-
            No ARR, margin, burn, NRR, or regulatory filing in public domain; four material evidenceGaps require private
            data room access.
    claimRefs:
      - CV001
      - CV014
      - CV017
      - CV021
      - CV029
    sourceRefs:
      - SV002
      - SV013
      - SV016
