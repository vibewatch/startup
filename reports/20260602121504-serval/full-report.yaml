  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Causal chain showing how primary risk events at Serval transmit to investment-thesis-level consequences; nodes
      represent risk events, edges represent causal linkages.
    data:
      nodes:
        - id: ai_exploit
          label: AI security exploit via support ticket
          detail: Prompt injection or credential exploit compromises Help Desk Agent
          tone: negative
        - id: access_misprovisioning
          label: Unauthorized IT access granted
          detail: AI agent provisions access outside authorized scope or to wrong identity
          tone: negative
        - id: sla_breach
          label: Automation SLA breach (below 50%)
          detail: AI automation rate falls below contractual guarantee threshold
          tone: warning
        - id: reg_action
          label: Regulatory enforcement action
          detail: GDPR, CCPA, or EU AI Act enforcement triggered by access decision failure
          tone: negative
        - id: customer_churn
          label: Enterprise customer churn
          detail: Reference customers terminate contracts following security or SLA incident
          tone: negative
        - id: ceo_departure
          label: CEO departure (Jake Stauch)
          detail: Only named C-suite executive exits before Series C close
          tone: risk
        - id: down_round
          label: Down round or failed Series C
          detail: Valuation markdown or failed next-round financing
          tone: negative
        - id: thesis_break
          label: Investment thesis break
          detail: Combination of incidents erodes competitive position and investor confidence
          tone: negative
      edges:
        - from: ai_exploit
          to: access_misprovisioning
          label: exploit causes mis-provisioning
        - from: access_misprovisioning
          to: reg_action
          label: automated decision triggers GDPR / EU AI Act review
        - from: access_misprovisioning
          to: customer_churn
          label: security incident triggers enterprise churn
        - from: sla_breach
          to: customer_churn
          label: contractual SLA breach triggers termination rights
        - from: reg_action
          to: customer_churn
          label: regulatory action accelerates churn in regulated verticals
        - from: customer_churn
          to: down_round
          label: revenue loss forces valuation markdown
        - from: ceo_departure
          to: down_round
          label: key-person exit depresses investor confidence and Series C optionality
        - from: down_round
          to: thesis_break
          label: down round signals fundamental deterioration
    claimRefs:
      - CR002
      - CR005
      - CR012
      - CR016
      - CR031
      - CR033
      - CR042
