      - number: '1.5'
        title: Customer Traction, Go-to-Market, and Scale
        blocks:
          - type: paragraph
            body: >-
              Serval's publicly confirmed customer base includes Perplexity, Together AI, Mercor, Vercel, Verkada, and
              Clay—all technology companies at the AI-native end of the enterprise buyer spectrum. The company claims
              that its platform automates more than 50% of incoming IT tickets from day one for its customers; the case
              study on the homepage features a customer testimonial from Vernon Man, Head of IT, stating "Once we
              switched over to Serval, we were able to complete over 50% of our incoming requests automatically." No
              enterprise F500 customers are publicly named, and all confirmed customers are technology-forward companies
              that may not represent the full enterprise-IT buyer landscape.


              Revenue grew 500% from August 2025 to December 2025, per company statements cited by Reuters, without
              disclosure of absolute figures. For a company that completed its Series A in October 2025, the revenue
              base as of August 2025 was likely very early—making the 500% figure meaningful as a signal of traction
              trajectory but insufficient as a standalone growth metric without the absolute denominator. Customer count
              is not publicly disclosed.


              Go-to-market is primarily direct sales with a structured deployment program: Phase 1 (Meet), Phase 2
              (Build), Phase 3 (Deploy), Phase 4 (Optimize). The company's pricing is quote-based and enterprise-only;
              no self-serve or SMB tier is offered. The Serval Start program signals a longer-term recruitment and brand
              strategy, while the active blog and case study publication suggest a content-led demand generation motion.
              As of June 2026, the blog references comparison articles about Eesel and Siit alternatives—indicating
              targeting of specific mid-market ITSM buyer segments alongside the flagship enterprise motion.
