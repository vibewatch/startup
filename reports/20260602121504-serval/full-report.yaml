      - number: '8.3'
        title: Bull, base, and bear scenario analysis
        blocks:
          - type: paragraph
            body: >
              The bull case rests on Serval achieving $40–60M ARR by end of 2026 with 150%+ net revenue retention,
              successfully crossing from tech-native customers into at least two enterprise verticals (financial
              services or healthcare), and maintaining its 50% ticket automation guarantee at scale. Under these
              conditions a 25–30x forward ARR multiple at a 2027–2028 exit implies a $1.25–1.8B valuation, generating
              1.3–1.8x return from the Series B entry price. The bull case is plausible given Sequoia's conviction, the
              customer proof from Perplexity and Verkada, and the secular shift toward AI-native IT automation. It
              requires sustained exceptional execution across go-to-market, product, and security without a competitive
              response from ServiceNow that bundles AI ITSM at no incremental charge.

              The base case assumes $20–35M ARR by end of 2026 with 120%+ NRR, continued tech-native customer expansion,
              and a 2028 exit at 20–25x ARR. This implies a $500M–$875M valuation range — approximately flat to slightly
              below the Series B entry price — with limited return generation for late-stage Series B investors. The
              bear case assumes ServiceNow bundles Now Assist aggressively by Q3 2026 at no incremental charge,
              compressing Serval's commercial window to the sub-500-employee tech company segment. In this scenario
              Serval reaches only $10–15M ARR by end of 2026, market multiples compress to 12–15x, and a 2028 exit
              implies a $150–$225M valuation — a material loss from the $1B Series B entry and a potential down-round or
              distressed exit. Axios reporting from January 2026 confirms that LP scrutiny of AI startup valuations with
              unverifiable revenue bases has sharpened, making the bear case distribution fatter than the headlines
              suggest.
            claimRefs:
              - CV026
              - CV037
              - CV038
              - CV039
              - CV030
              - CV032
              - CV033
          - type: table
            tableRef: TV003
            claimRefs:
              - CV037
              - CV038
              - CV039
              - CV026
              - CV032
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV017
              - CV026
              - CV037
      - number: '8.4'
        title: Regulatory anomalies and adverse signals
        blocks:
          - type: paragraph
            body: >
              Three adverse signals merit diligence escalation. First, an EDGAR full-text search for Form D filings by
              Serval, Inc. returned no results as of the analysis date. US Regulation D requires an issuer to file a
              Form D notice within 15 days of the first sale of securities in a Regulation D offering. The absence of
              this filing for a company that has accepted approximately $127M across at least two rounds is an anomaly.
              It may indicate that Serval is structured under a non-US holding entity that routes investment through a
              foreign vehicle exempt from US Form D requirements, or that filings were made under a different legal
              name, or that compliance was missed. Any of these explanations requires legal due diligence and increases
              regulatory risk in the diligence profile.

              Second, Axios published an analysis in January 2026 documenting heightened LP scrutiny of AI startup
              valuations where revenue is unverified, growth rates are self-reported, and implied multiples exceed 50x.
              Serval's profile matches the criteria Axios identifies as attracting down-round risk: unaudited growth
              claim, compressed unicorn timeline, and no public absolute revenue figure. Third, Dark Reading reported
              that agentic AI systems deployed in enterprise IT — precisely Serval's deployment context — inherit
              traditional software vulnerabilities including prompt injection and privilege escalation. A security
              incident in a Serval enterprise deployment could create material customer trust damage and remediation
              cost, neither of which is quantified in any public source.
            claimRefs:
              - CV010
              - CV011
              - CV026
              - CV033
              - CV042
          - type: table
            tableRef: TV002
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV021
              - CV026
              - CV032
          - type: table
            tableRef: TV005
            claimRefs:
              - CV032
              - CV033
              - CV030
      - number: '8.5'
        title: Diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >
              The valuation cannot be underwritten from public evidence. Five private disclosures would close the
              diligence gap: (1) current ARR with cohort-level progression since August 2025 to anchor the 500% growth
              claim; (2) gross margin split between software subscription and professional services onboarding, since
              the high-touch pilot model may compress margins below 80%; (3) net revenue retention by customer vintage
              to validate the land-and-expand thesis; (4) burn rate and runway post-Series B to confirm capital adequacy
              through the planned headcount tripling; and (5) legal entity structure and copies of all Regulation D
              exemption notices or equivalent foreign securities filings.

              The thesis breaks under two primary conditions. The first is a ServiceNow bundling event in which Now
              Assist is repriced to zero incremental cost for existing ITSM customers within 12 months; this would
              immediately narrow Serval's addressable commercial window to companies not already under ServiceNow
              contract. The second is a security incident in a customer environment that is publicly attributed to
              Serval's agentic AI architecture; the trust damage in enterprise IT procurement would be disproportionate
              relative to any financial remediation cost. Secondary thesis-break conditions include a Series C at a flat
              or down valuation (confirming growth deceleration), loss of a key named customer such as Perplexity or
              Verkada, and departure of the founding team during the critical 2026 scale-up. TechCrunch Startups Weekly
              in May 2026 named Serval alongside Atomicwork and Moveworks as the three AI-native ITSM vendors to watch,
              reinforcing the competitive intensity that makes execution discipline non-negotiable.
            claimRefs:
              - CV022
              - CV023
              - CV031
              - CV040
              - CV041
