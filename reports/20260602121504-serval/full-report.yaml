      - number: '3.3'
        title: Pricing, Positioning, and Go-to-Market
        blocks:
          - type: paragraph
            body: >-
              The ITSM market exhibits a wide pricing spread from published per-seat SaaS tiers to fully opaque
              enterprise contracts. Freshservice is the most transparent: four published tiers range from $19 to $99 per
              agent per month, enabling bottom-up PLG adoption. Atlassian JSM offers a free tier for up to three agents
              and scales to $44.27 per agent per month on Premium. Zendesk Suite anchors the mid-market entry at
              approximately $55 per agent per month. Atomicwork breaks from per-seat pricing with a $90 per-employee
              per-year Professional plan — a total-cost-of-ownership pitch for tech teams where all employees are
              potential service requestors. ServiceNow and Moveworks publish no list pricing; custom enterprise
              contracts are estimated to start above $200,000 and $250,000 annually respectively. Aisera custom-quotes
              with a minimum 12-month commitment. Serval does not publish pricing; its GTM targets high-velocity tech
              companies including Perplexity, Together.ai, Mercor, and Cribl — AI-first organisations that value
              automation rate guarantees over feature breadth. The TechCrunch Series A coverage in October 2025
              explicitly framed Serval as a ServiceNow replacement, heightening competitive attention from ServiceNow's
              enterprise sales force. ServiceNow's distribution relies on a 7,500-partner ecosystem and certified
              implementation partners — a structural channel advantage Serval cannot replicate at 30 employees, creating
              an asymmetric distribution challenge in the enterprise segment above 5,000 employees.
