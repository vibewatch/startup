  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market definition, scope, and adjacencies
        blocks:
          - type: paragraph
            body: >-
              Serval's product addresses the IT service management software market, broadly defined as the software
              layer that receives, routes, automates, and resolves internal service requests from employees. IBM defines
              ITSM as the practice of planning, implementing, managing, and optimizing end-to-end delivery of
              information technology services to meet user and business goals, covering incident management, problem
              management, change management, service request management, and IT asset management. This boundary is
              well-established: it excludes adjacent categories such as IT monitoring and observability (which measures
              infrastructure health rather than workflow delivery), endpoint management (device provisioning without the
              request layer), and enterprise resource planning (which owns business processes, not IT service delivery).

              Within ITSM, Serval competes in the emerging AI-native sub-segment: platforms that use large language
              models and agentic automation to handle end-to-end request resolution, not just routing or classification.
              This sub-segment is still nascent relative to legacy ticketing vendors but is attracting heavy investment
              from incumbents (ServiceNow's autonomous AI specialist program, BMC's HelixGPT, Freshservice's Freddy AI)
              and venture-backed startups (Aisera, Moveworks, Atomicwork, Serval). Excluded from Serval's serviceable
              market are pure observability platforms (Datadog, PagerDuty), DevOps toolchains (GitHub Actions,
              CircleCI), and standalone identity governance tools (SailPoint, Saviynt) that do not include a help desk
              layer.

              Enterprise Service Management (ESM), which extends ITSM patterns to HR, Finance, and Legal workflows,
              represents an important adjacency. Serval's platform already supports multi-department segregation for IT,
              Security, HR, and Workplace teams, meaning ESM expansion is a plausible growth vector that would broaden
              the serviceable market if pursued. The included spend for Serval's SAM covers AI-native ITSM platform
              seats, implementation services, and automation workflow credits for organizations with 50–10,000 employees
              in technology-forward sectors.
