  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Player Classes
        blocks:
          - type: paragraph
            body: >-
              The AI-native IT service management market in 2026 organises around four distinct player classes: legacy
              platform incumbents that dominate enterprise contracts (ServiceNow, BMC Helix), AI-native point solutions
              that challenge incumbents on automation depth (Serval, Moveworks, Aisera), workflow automation hybrids
              that extend developer tooling into ITSM (Atlassian Jira Service Management), and traditional SaaS helpdesk
              vendors that are adding AI features to existing ticketing products (Freshservice, Zendesk). Serval
              competes simultaneously against all four classes: it positions against ServiceNow's complexity and cost,
              Moveworks' automation claims, Freshservice's SMB price points, and Atomicwork's startup-to-enterprise
              narrative. ServiceNow remains the dominant force with approximately 85% Fortune 500 penetration and
              7,700-plus enterprise customers globally as of Q1 2026, but is challenged by capital-intensive AI-native
              alternatives. Freshservice serves 74,000-plus businesses from SMB to enterprise on published per-seat
              pricing, anchoring the accessible end of the market. Jira Service Management targets DevOps-adjacent teams
              with ITIL v4 alignment and PinkVERIFY certification, leveraging the broader Atlassian ecosystem for
              cross-product lock-in. Moveworks approaches the market as an enterprise AI copilot for employee services
              across HR, IT, and facilities, with 100-plus language support and its Reasoning Engine for multi-step
              agentic workflows. Atomicwork and Aisera attack the same AI-autonomy narrative as Serval: Aisera was
              included in the Gartner Magic Quadrant for AI Applications in ITSM with claimed 65 to 90% auto-resolution
              rates. BMC Helix, named a Forrester Wave Leader for Enterprise Service Management Q4 2025, represents the
              incumbent-AI investment thesis. Serval's differentiation rests on its guaranteed 50% automation
              contractual SLA, its 500% ARR growth validating rapid market traction, and full deployment flexibility
              (cloud, hybrid, self-hosted) absent from most AI-native peers.
