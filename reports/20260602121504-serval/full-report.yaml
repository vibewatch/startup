      - number: '7.3'
        title: Competitive and Ecosystem Dependency Risks
        blocks:
          - type: paragraph
            body: >-
              The most strategically significant competitive threat to Serval is ServiceNow itself. ServiceNow has 85%
              of the Fortune 500 running its platform, is deploying NowAssist AI agents with autonomous multi-step
              workflow capabilities, and has the incumbent renewal cycle, enterprise trust, and bundling leverage that
              Serval lacks. If ServiceNow replicates Serval's 50% automation SLA guarantee or absorbs the use case into
              its platform at no incremental cost, Serval's primary differentiation evaporates. Moveworks, Aisera, and
              Atomicwork represent AI-native ITSM competitors with established customer bases and comparable
              architectures, compressing Serval's window to establish category leadership.


              Ecosystem dependency risk is high. Serval's Help Desk Agent operates exclusively through Slack, Microsoft
              Teams, email, and web portal—all third-party communication channels. Its core automation capabilities
              depend on Okta, Google Workspace, GitHub, Jira, AWS, and Workday integrations; any API policy change,
              outage, or trust revocation by these providers directly impairs Serval's product. Most critically, Serval
              has not disclosed which LLM provider or providers power its AI layer. A single-provider LLM dependency
              introduces model availability, pricing, and capability risk that cannot be assessed from public
              disclosures. Customer concentration in early-adopter tech startups—while ideal for initial
              traction—creates revenue fragility if churn in one cohort of similarly sized customers is correlated, as
              startups face shared macro risk.
            claimRefs:
              - CR023
              - CR024
              - CR025
              - CR026
