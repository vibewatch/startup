      - number: '3.4'
        title: Switching Costs, Moat, and Competitive Durability
        blocks:
          - type: paragraph
            body: >-
              The ITSM competitive landscape in 2026 is characterised by durable lock-in mechanics among incumbents and
              emerging data-flywheel moats among AI-native players. ServiceNow's switching costs are among the highest
              in enterprise software: customers face CMDB migration, custom workflow re-engineering, and retraining of
              ITIL-certified administrators — a multi-year, multi-million-dollar process. Atlassian deepens lock-in
              through cross-product dependency: teams using Jira Software, Confluence, and JSM together face compounding
              exit costs. Serval's moat is nascent but structurally sound: its 150-plus native integrations create data
              and workflow coupling, and its automation dataset compounds with each resolved ticket, improving model
              accuracy over time in a manner difficult for new entrants to replicate without equivalent deployment
              history. Moveworks' multi-tenant AI models, trained on customer communication history, generate
              proprietary learning lock-in that strengthens after 12 to 18 months of deployment. The $19-billion-plus
              ITSM market is large enough that multiple AI-native and incumbent players can coexist without
              winner-take-all dynamics in the near term. Gartner classifies the AI Applications in ITSM market as a
              high-churn, rapid-new-entrant sub-segment as of 2025, signalling continued commoditization pressure.
              Atomicwork has received customer testimonials describing it as a ServiceNow alternative for tech teams,
              directly overlapping Serval's displacement narrative and creating channel conflict risk. BMC Helix's
              Forrester Leader designation confirms incumbents continue to invest heavily in AI, threatening Serval's
              differentiation window. Serval's SOC 2, HIPAA, and GDPR certifications offer a moat in regulated sectors
              where Atomicwork and some AI-native peers lack equivalent accreditation. The rapid capital infusion —
              Moveworks $200M Series C, Serval $127M total — intensifies competition for the same addressable TAM.
              Serval's 30-person team relative to ServiceNow's 23,000-plus employees represents a concentration risk in
              delivery capacity and partner support.
