  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Suite and Core Modules
        blocks:
          - type: paragraph
            body: >-
              Serval markets itself as a unified AI-native ITSM platform combining three functional surfaces: a Help
              Desk, an Access Management module, and an Automation Engine. The company's product homepage describes the
              offering as an "AI agent workforce" deployed within enterprise IT, capable of handling help desk requests,
              provisioning time-bound access, onboarding and offboarding employees, and building workflow automations
              through natural language. Five distinct capability areas are marketed: Resolve Requests, Build Workflows,
              Transform Ticketing, Manage Access, and Manage Assets.


              The Help Desk module is the user-facing surface. Employees interact via Slack, Microsoft Teams, email, or
              a web portal. Serval's AI routes incoming tickets based on request content and context, searches connected
              knowledge bases to answer questions with sourced information, executes automations to close out common
              requests without human intervention, and escalates with full context when human handling is required.
              Bi-directional ticket sync is offered with third-party systems—specifically ServiceNow, Jira, and
              Zendesk—allowing enterprises to run Serval alongside incumbents during migration.


              The Access Management module handles just-in-time (JIT) provisioning, automated deprovisioning, approval
              workflow customization, access-profile restrictions, and SCIM integration with identity providers.
              According to the pricing page, access policies can be customized down to least-privilege rules,
              multi-approver gates, and time-bound grants. Serval also lists SCIM provisioning and Terraform/API-based
              custom provisioning as capabilities.


              The Analytics and Insights surface provides dashboards for request volume, AI resolution rates,
              time-to-resolution, and SLA compliance. The Insights Agent additionally analyzes ticket patterns to
