      - number: '1.6'
        title: Milestone Chronology and Adverse Checks
        blocks:
          - type: paragraph
            body: >-
              Serval's public record covers approximately two years from founding to unicorn status. No regulatory
              actions, legal proceedings, sanctions, or enforcement actions against Serval, its founders, or named
              executives appear in public records as of the run date. No product outages, security incidents, or data
              breach notifications appear in public materials. No layoffs or reported leadership departures are found in
              any public source.


              The primary adverse diligence considerations are structural rather than event-based: the company declined
              to disclose absolute revenue figures when reporting 500% growth; it has achieved unicorn status with fewer
              than 30 employees and no public financial verification; its confirmed customer list is confined to
              technology companies with no public F500 or regulated-industry references; and its core competitive thesis
              (replacing ServiceNow and similar incumbents) faces sustained competition from ServiceNow's own AI agent
              product launches. Gartner Peer Insights for AI ITSM markets lists verified enterprise deployments of
              established vendors, and Serval's absence from this verification track represents a material enterprise
              trust gap for regulated or large-enterprise buyers.


              No known founder conflicts of interest, outstanding litigation, or FINRA/SEC-adjacent concerns appear in
              public materials. The founding team is described as an "elite team of builders and sellers" on the careers
              page, consistent with a pre-scale startup in hiring mode. The company's rapid funding pace and aggressive
              unicorn narrative are high-stakes reputational commitments that increase the consequences of any execution
              shortfall.
