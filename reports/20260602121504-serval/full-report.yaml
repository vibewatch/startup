      - number: '1.2'
        title: Founders, Leadership, and Key-Person Risk
        blocks:
          - type: paragraph
            body: >-
              Jake Stauch serves as CEO and co-founder of Serval. He is the primary public face of the company, appears
              in all major press interviews, and is the creator of the "vibe coding" framing central to Serval's product
              narrative. Alex McLeod is the other named co-founder and is listed as co-founder in Redpoint's portfolio
              page, though McLeod has not appeared prominently in public-facing coverage. No additional named C-suite
              executives, board members, or advisors appear in public materials as of the run date, reflecting the
              company's very early stage and sub-30-employee headcount.


              The Redpoint portfolio page identifies three Redpoint partners who sponsored the Series A deal: Alex Bard,
              Patrick Chase, and Jordan Segall. General Catalyst's Serval portfolio page names Marc Bhargava, Vedant
              Suri, and Kate Bender as the GC investors involved. The Sequoia Serval page lists Anas Biad as the lead
              Sequoia partner on the Series B—Biad publicly quoted saying the customer feedback was as strong as what
              Sequoia heard before partnering with ServiceNow sixteen years ago, an unusually direct comparison for a
              Series B press cycle.


              The Serval Start program, launched in May 2026, is an additional signal about the founding team's
              ambitions. This two-year program recruits technical builders to work at Serval as a path to founding their
              own companies, with workshops led by Stauch, Christine Kim (Head of Strategic Projects), Bill Trenchard
              (First Round partner), Greg Rosen (BoxGroup partner), Anas Biad (Sequoia partner), and Patrick Chase
              (Redpoint partner). The program is a talent acquisition and brand-building initiative that also reveals
              the senior leadership tier at Serval is still very small—Christine Kim appears to be the only named
              operating executive aside from Stauch. Key-person concentration in Stauch is a central diligence concern.
