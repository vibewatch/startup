      - number: '4.5'
        title: Financial risk factors and verdict
        blocks:
          - type: paragraph
            body: >
              Serval presents three layers of financial risk. The first is revenue opacity: the 500% growth claim is
              self-reported, unaudited, and unanchored to an absolute figure. No investor or independent analyst has
              published an ARR estimate. The burn rate, runway, and cash position are completely private, which means
              capital adequacy can only be inferred from the recency of the Series B. At roughly 30 employees at Series
              B close, the company's cost base was very low, but the plan to grow to 100-plus employees by end of 2026
              implies a 3-4x headcount expansion that will likely triple or quadruple the monthly cash burn before any
              corresponding revenue acceleration materializes.

              The second risk layer is agentic AI security. Independent security researchers at Acronis, published by
              Dark Reading, have documented that agentic AI systems — even those built on modern LLM architectures —
              inherit traditional software vulnerabilities including prompt injection, privilege escalation, and
              authentication bypass. Enterprise IT environments handle sensitive credentials, configuration state, and
              privileged access to production systems. A security incident in a Serval deployment could create
              significant customer trust damage and remediation cost, both of which are unquantified in the public
              record.

              The third risk is the compressed unicorn timeline. Serval's $232M-to-$1B valuation acceleration over three
              months is among the fastest in enterprise software in 2025. Aggressive step-up valuations at early revenue
              stages create waterfall complications, employee equity dilution pressures, and investor expectation
              alignment challenges in subsequent rounds. The absence of an SEC Form D filing is a minor but notable
              anomaly for a US company at this capital scale. The financial verdict is constructive on momentum but
              requires private disclosure of ARR, gross margin, burn rate, and customer count before the valuation can
              be underwritten with rigor.
