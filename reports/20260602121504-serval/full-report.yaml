      - number: '7.4'
        title: Execution, People, and Financial Risks
        blocks:
          - type: paragraph
            body: >-
              Serval's execution risk profile is extreme by any standard. The company had fewer than 30 employees at the
              time of its December 2025 Series B, yet it carries a $1B post-money valuation, a contractual 50%
              automation SLA, and a plan to scale to 100+ employees by end-2026—a 3x headcount expansion in 12 months.
              At San Francisco compensation rates, a 100-person AI company costs roughly $18M–$25M per year in fully
              loaded headcount expense; the company's disclosed $127M in capital provides runway, but achieving product
              depth, enterprise sales capacity, and security audit depth simultaneously at this pace is operationally
              demanding.


              Jake Stauch is the only named C-suite executive in any public Serval communication as of the run date. No
              CTO, CFO, CPO, or chief security officer has been publicly announced. Alex McLeod is named as co-founder
              on Redpoint's portfolio page but has no public-facing presence in any media coverage. This key-person
              concentration is atypical for a company that has raised $127M and carries a $1B valuation; departure or
              incapacitation of Stauch before Series C would materially affect investor confidence, customer
              relationships, and the product roadmap.


              Serval's valuation multiple is aggressive given undisclosed revenue. The company claims 500% revenue
              growth since August 2025 but has not disclosed ARR or customer count. If ARR is in the $2M–$5M range at
              Series B (consistent with a very early enterprise AI company at this headcount), the $1B valuation implies
              a 200x–500x revenue multiple—a level that is only sustainable if growth continues at or above the current
              rate through Series C. A deceleration, key customer churn, or competitive loss to ServiceNow could force a
              down round.
            claimRefs:
              - CR031
