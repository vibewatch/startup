      - number: '3.2'
        title: Capability and Product Comparison
        blocks:
          - type: paragraph
            body: >-
              Serval's core capability is end-to-end autonomous ticket resolution: its AI agent ingests a request,
              identifies the required action (provisioning access via Okta, closing a Jira issue, updating a Slack
              channel), executes the workflow through 150-plus native integrations, and closes the ticket without human
              intervention. No other evaluated vendor contractually guarantees a 50% automation floor in its SLA.
              ServiceNow's NowAssist AI agents run natively on the Now Platform with ML model orchestration, CMDB
              coupling, and deep change workflow management — but require significant configuration investment and lack
              a published automation guarantee. Freshservice's Freddy AI provides AI-assisted ticket deflection and
              agent-assist suggestions, stopping short of fully autonomous resolution in its standard tiers. Jira
              Service Management includes Atlassian Intelligence for request categorisation and virtual agent support,
              but its AI depth is substantially below Serval's autonomous tier. Moveworks' Reasoning Engine supports
              multi-step agentic workflows and claims 40% fewer tickets requiring human intervention — a meaningful
              claim framed as relative reduction, not an absolute floor guarantee. Atomicwork's Atom AI copilot handles
              natural-language routing without manual classification; Aisera's conversational AI and RPA integrations
              support its claimed 65 to 90% auto-resolution range. Serval's deployment flexibility distinguishes it from
              most AI-native competitors: cloud, hybrid, and self-hosted configurations allow it to compete in regulated
              industries where data residency mandates preclude pure SaaS. ServiceNow offers on-premise deployment at a
              premium; Freshservice, Moveworks, and Atomicwork are cloud-only at standard tiers. Serval holds SOC 2 Type
              II, HIPAA, and GDPR certifications, enabling regulated-sector deals that cloud-only rivals cannot pursue.
