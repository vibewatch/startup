  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing visibility
        blocks:
          - type: paragraph
            body: >
              Serval presents a "one platform fee, no surprises" pricing model on its public pricing page, but no actual
              price card is published. All purchasing requires scheduling a sales demo, and all deployments begin with a
              guided pilot that includes a dedicated deployment engineer. The four-phase onboarding sequence — Meet,
              Build, Deploy, Optimize — implies a high-touch, services-assisted activation model that is more typical of
              mid-market and enterprise software vendors than of product-led growth companies. Serval publicly
              guarantees a 50% automation rate for IT tickets, which is an unusually bold commercial commitment and
              suggests a performance-anchored sales motion rather than a pure usage-based or seat-based model.

              The product integrates with 60-plus enterprise tools including Okta, Google Workspace, GitHub, Jira,
              Slack, Freshservice, and ServiceNow. That breadth implies a land-and-expand model where initial deployment
              covers one workflow and expands across the IT surface over time. The two-agent architecture — one agent
              for understanding IT requests, one for executing actions — is the technical basis for the automation
              guarantee, but the commercial translation of that architecture into recognized revenue is not publicly
              visible. Annual subscription contracts are implied but unconfirmed. No per-seat, per-agent, or
              consumption-based pricing tiers are disclosed. Without a price card, gross margin, or contract terms,
              pricing power remains an inference from investor confidence rather than a measurable commercial fact.
