summary:
  headline: Serval 获得了极强投资人背书，也有可信的 AI 原生 ITSM 架构；但收入增长说法没有基数支撑，客户全是科技创业公司，团队不足 30 人，单位经济完全未披露，仅靠公开证据无法支撑 $1B 估值。
