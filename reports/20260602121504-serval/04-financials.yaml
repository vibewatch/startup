- id: competitive-financial-landscape
  title: Competitive financial landscape
  body: >
    The ITSM market is large and growing. Analyst estimates from MarketsandMarkets and Grand View Research place the global
    ITSM market at approximately $11B in 2024, projected to exceed $30B by 2030. The AI-enabled ITSM sub-segment is growing
    faster, as large incumbent platforms race to integrate agentic automation alongside dedicated AI-native vendors. ServiceNow,
    with approximately $10.98B in 2024 revenue and a market capitalization exceeding $150B, has launched its own generative
    AI and agentic AI capabilities directly on the Now Platform. That competitive pressure is Serval's most material near-term
    strategic risk: a well-resourced incumbent can bundle equivalent functionality at no incremental charge for existing customers,
    compressing Serval's commercial window.

    Freshservice and Atlassian Jira Service Management both publish transparent pricing tiers that allow direct benchmarking.
    Moveworks and Aisera are AI-first ITSM alternatives with earlier venture histories but also undisclosed ARR. Atomicwork
    positions itself as a freemium-entry AI ITSM player. BMC Helix represents the legacy ITSM incumbent segment being modernized
    with AI add-ons. Serval's differentiation — two-agent architecture, guaranteed automation rate, guided pilot — is credible
    as a technical moat but has not yet been stress-tested against ServiceNow's resource depth. The absence of enterprise-brand
    customer logos from Fortune 500 companies means Serval's crossover appeal beyond the tech-native segment remains unproven,
    which materially affects its long-run TAM capture potential.
  claimRefs:
