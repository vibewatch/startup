  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: absolute ARR and revenue quality
    missingEvidence: >
      Serval has disclosed no ARR, MRR, or gross revenue figure. The 500% growth claim from August 2025 has no public dollar
      anchor, making it impossible to benchmark the company's valuation multiple, validate the growth rate, or construct a
      financial model.
    whyItMatters: >
      At a $1B valuation, undisclosed revenue is the single largest diligence blocker. If the growth rate applies to a very
      small base (e.g., $100K ARR), the valuation multiple could be in the thousands-of-times range, which is unsupported
      by any public evidence.
    diligencePath: >
      Request current and prior-year ARR, MRR by customer cohort, revenue recognition policy, and prior six quarters of revenue
      progression with month-end closes.
    relatedQuestionRefs:
    - QI012
    - QI025
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: gross margin and unit economics
    missingEvidence: >
      No gross margin, customer acquisition cost, lifetime value, payback period, or net revenue retention data is publicly
      available. The high-touch onboarding model (dedicated deployment engineer per pilot) raises the possibility that professional
      services cost significantly compresses gross margins.
    whyItMatters: >
      Software companies with heavy onboarding services obligations often report gross margins of 50-65% versus 75-85% for
      pure software, materially affecting the long-run valuation case. The automation guarantee is also a financial commitment
      with unquantified credit exposure.
    diligencePath: >
      Request software versus services gross margin split, fully-loaded cost of customer acquisition, net revenue retention
      by cohort, and historical SLA credit issuance frequency and dollar amount.
    relatedQuestionRefs:
    - QI013
    - QI014
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: material
    topic: cash position, burn rate, and runway
    missingEvidence: >
      Serval has disclosed no cash balance, monthly burn, or runway figure following the December 2025 Series B. The plan
      to triple headcount implies a substantial acceleration of cash burn in 2026 that cannot be modeled from public information.
    whyItMatters: >
      If the headcount scale-up does not generate proportional ARR growth, Serval could face a series C or bridge requirement
      on compressed terms before the current capital is fully deployed, creating a funding-dependency risk.
    diligencePath: >
      Request treasury reporting for the most recent quarter, cash burn bridge by function, and projected monthly runway under
      base and downside scenarios.
    relatedQuestionRefs:
    - QI020
    - QI022
    relatedTableRefs:
    - TI004
    - TI005
  - type: conflicting-data
    severity: moderate
    topic: SEC Form D non-filing
    missingEvidence: >
      A Form D exemption notice is legally required within 15 days of first sale in most US exempt offerings under Regulation
      D. The absence of a Form D in EDGAR for Serval, Inc. is an anomaly for a company that has received approximately $127M
      across multiple rounds.
    whyItMatters: >
      The absence may indicate a filing delay, a filing under a different entity name, or a foreign-entity structure that
      does not require US Form D. Any of these possibilities requires legal diligence to resolve, as regulatory non-compliance
      in securities law is a diligence escalation.
    diligencePath: >
      Confirm legal entity structure, identify the filing entity for each round, and request copies of all exemption notices
      and investor-related regulatory filings from legal counsel.
    relatedQuestionRefs:
    - QI010
    - QI026
    relatedTableRefs:
    - TI002
