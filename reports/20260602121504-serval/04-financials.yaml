company:
  name: Serval
chapter:
  number: 4
  title: Financials
  summary: >
    Serval's public financial record is dominated by its fundraising narrative: $127M raised across Series A and B in under
    two months at a $1B valuation by December 2025, backed by Sequoia and Redpoint. The company claims 500% revenue growth
    since August 2025 but has disclosed no dollar figure. Pricing is quote-only, all unit economics are private, no SEC Form
    D was found, and the 30-person headcount at Series B underscores an extremely early operating base. The financial picture
    is bullish on investor confidence and market momentum but cannot yet be underwritten on disclosed revenue quality, margin,
    or cash position.
sections:
- id: revenue-model-and-pricing
  title: Revenue model and pricing visibility
  body: >
    Serval presents a "one platform fee, no surprises" pricing model on its public pricing page, but no actual price card
    is published. All purchasing requires scheduling a sales demo, and all deployments begin with a guided pilot that includes
    a dedicated deployment engineer. The four-phase onboarding sequence — Meet, Build, Deploy, Optimize — implies a high-touch,
    services-assisted activation model that is more typical of mid-market and enterprise software vendors than of product-led
    growth companies. Serval publicly guarantees a 50% automation rate for IT tickets, which is an unusually bold commercial
    commitment and suggests a performance-anchored sales motion rather than a pure usage-based or seat-based model.

    The product integrates with 60-plus enterprise tools including Okta, Google Workspace, GitHub, Jira, Slack, Freshservice,
    and ServiceNow. That breadth implies a land-and-expand model where initial deployment covers one workflow and expands
    across the IT surface over time. The two-agent architecture — one agent for understanding IT requests, one for executing
    actions — is the technical basis for the automation guarantee, but the commercial translation of that architecture into
    recognized revenue is not publicly visible. Annual subscription contracts are implied but unconfirmed. No per-seat, per-agent,
    or consumption-based pricing tiers are disclosed. Without a price card, gross margin, or contract terms, pricing power
    remains an inference from investor confidence rather than a measurable commercial fact.
