- id: traction-signals-and-unit-economics
  title: Traction signals and unit economics
  body: >
    Serval's strongest public commercial evidence comes from its named customer list and its revenue growth claim. The company
    publicly names Perplexity, Together AI, Mercor, Vercel, Verkada, Clay, and Cribl as customers. These are all technology-native
    companies, most of which are themselves venture-backed startups or scale-ups. The Sequoia portfolio page independently
    corroborates this set with identical wording. This customer concentration in tech-native companies is useful for proving
    early-adopter traction but raises questions about enterprise crossover — whether Serval can sell to regulated industries,
    large financial services firms, or government agencies where compliance requirements, change management, and procurement
    cycles are far more demanding.

    Serval reported 500% revenue growth since August 2025 in the Reuters/US News article. No ARR or MRR figure was disclosed
    alongside this claim, making it impossible to anchor the growth rate to a starting base. A company growing from $100K
    ARR to $600K ARR would also be 500% growth, but it would represent an entirely different risk profile than a company growing
    from $5M to $30M. The unit economics — customer acquisition cost, lifetime value, payback period, gross margin, and net
    revenue retention — are entirely private. The pricing model is quote-based with no disclosed floor or ceiling. The automation
    guarantee (50% of tickets) is a commercial commitment but no penalty or credit mechanism is publicly described. SOC 2
    Type II certification and a 99.9% uptime SLA provide enterprise-credibility signals, but they do not substitute for disclosed
    financial metrics.
