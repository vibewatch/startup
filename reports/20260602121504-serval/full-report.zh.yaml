      - number: '1.5'
        title: 客户牵引、GTM 与规模
        blocks:
          - type: paragraph
            body: >-
              Serval 公开确认的客户包括 Perplexity、Together AI、Mercor、Vercel、Verkada 和 Clay——均为企业买家谱系中偏 AI
              原生的技术公司。公司称，其平台从客户使用第一天起就能自动处理超过 50% 的入站 IT 工单；官网案例研究引用了 IT 负责人 Vernon Man 的客户证言：「切换到 Serval 后，我们能自动完成超过
              50% 的入站请求。」公司未公开具名任何 F500 企业客户，所有已确认客户都是技术前沿公司，可能无法代表完整的企业 IT 买家版图。


              根据 Reuters 引用的公司说法，2025 年 8 月至 12 月收入增长 500%，但未披露绝对数字。对于一家 2025 年 10 月完成 Series A 的公司，2025 年 8
              月的收入基数很可能仍处早期——因此 500% 作为牵引轨迹信号有意义，但缺少绝对分母时，不能单独作为增长指标。客户数量未公开披露。


              GTM 主要是直销，配套结构化部署项目：Phase 1（Meet）、Phase 2（Build）、Phase 3（Deploy）、Phase 4（Optimize）。公司采用询价制、仅企业级定价；不提供自助服务或
              SMB 层级。Serval Start 项目显示出更长期的招聘和品牌策略，活跃博客与案例研究发布则说明公司有内容驱动的需求生成动作。截至 2026 年 6 月，博客提到关于 Eesel 和 Siit
              替代方案的对比文章，说明除旗舰企业动作外，公司也在瞄准特定中型市场 ITSM 买家细分。
