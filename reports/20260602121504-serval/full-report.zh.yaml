      - number: '1.4'
        title: 产品、技术与合规
        blocks:
          - type: paragraph
            body: >-
              Serval 平台由五个模块组成：Resolve Requests（帮助台工单和 AI 解决）、Build Workflows（自然语言自动化构建器）、Transform Ticketing（AI 原生工单，并与
              ServiceNow、Jira、Zendesk 双向同步）、Manage Access（JIT 访问开通与治理）和 Manage Assets（跨 MDM、采购、IdP 和 HRIS
              的统一资产管理）。每个模块都连接到 Serval 的中央 AI 智能体基础设施。


              底层技术架构值得关注：工作流自动化在无代码界面背后生成代码，让非技术 IT 经理和工程团队都能在 Git 中检查和管理自动化。这种「底层是代码」的做法，意在提供确定性代码工作流的可靠性和可审计性，同时移除传统
              ITSM 构建器的拖拽摩擦。平台支持 60+ 原生集成，包括 Slack、Okta、Google Workspace、GitHub、Jira、ServiceNow、AWS、Confluence 和 Kandji。


              Serval 将安全和合规作为核心产品属性来销售：公司声称拥有 SOC 2 Type II 认证、符合 HIPAA，并满足 GDPR。平台对传输中数据使用 TLS 1.3，对静态数据使用
              AES-256，并提供基于角色的访问控制、审计日志、SAML/SCIM 支持和 SIEM 集成。公司提供灵活部署，包括通过 Terraform 和 Kubernetes 进行自托管。Serval 的
              Acceptable Use Policy（AUP）公开可查，并明确禁止使用该平台与 Serval 竞争，这与标准企业 SaaS 条款一致。公司以引导式试点项目和专属部署工程师支持，保证 50% 自动化率。
