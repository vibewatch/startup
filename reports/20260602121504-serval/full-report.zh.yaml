      - number: '1.2'
        title: 创始人、领导层与关键人风险
        blocks:
          - type: paragraph
            body: >-
              Jake Stauch 担任 Serval CEO 兼联合创始人。他是公司最主要的公开面孔，出现在所有主要媒体采访中，也是 Serval 产品叙事核心「vibe coding」框架的提出者。Alex McLeod
              是另一位具名联合创始人，Redpoint 投资组合页面将其列为联合创始人，但 McLeod 尚未在面向公众的报道中高频出现。截至报告日期，公开材料中没有其他具名 C-suite
              高管、董事会成员或顾问，反映出公司仍处于极早期，员工数不足 30 人。


              Redpoint 投资组合页面列出三位赞助 Series A 交易的 Redpoint 合伙人：Alex Bard、Patrick Chase 和 Jordan Segall。General Catalyst 的
              Serval 投资组合页面列出参与的 GC 投资人为 Marc Bhargava、Vedant Suri 和 Kate Bender。Sequoia 的 Serval 页面将 Anas Biad 列为
              Series B 的主导合伙人——Biad 公开表示，客户反馈之强可比 Sequoia 十六年前投资 ServiceNow 前听到的反馈；以 Series B 新闻周期看，这是一个异常直接的类比。


              2026 年 5 月推出的 Serval Start 项目，是创始团队雄心的另一个信号。这个两年制项目招募技术型 builder 到 Serval 工作，并把它作为未来创办自己公司的路径；工作坊由
              Stauch、Christine Kim（Head of Strategic Projects）、Bill Trenchard（First Round 合伙人）、Greg Rosen（BoxGroup
              合伙人）、Anas Biad（Sequoia 合伙人）和 Patrick Chase（Redpoint 合伙人）主持。该项目既是人才获取和品牌建设动作，也显示 Serval 的高层领导梯队仍然很小——除
              Stauch 外，Christine Kim 似乎是唯一具名的运营高管。Stauch 身上的关键人集中，是尽调的核心关注点。
