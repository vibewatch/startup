      - number: '1.3'
        title: 融资历史、估值与投资方地图
        blocks:
          - type: paragraph
            body: >-
              即便按 2025 年风险投资标准看，Serval 的融资节奏也很快。公司于 2025 年 10 月完成 $47 million Series A，由 Redpoint Ventures 领投，First
              Round Capital、General Catalyst、BoxGroup、Bessemer Venture Partners、Meritech Capital、Strike
              Capital、Sunflower Capital 和 Operator Partners 参投，另有一批天使投资人参与。Reuters 报道引用的 PitchBook 数据显示，Series A 对
              Serval 的估值约为 $232 million。


              仅三个月后，2025 年 12 月，Serval 完成由 Sequoia Capital 领投的 $75 million Series B——Anas Biad
              公开评论称这是一轮先发制人的融资——Redpoint、Meritech 和 General Catalyst 也参投。Series B 使累计融资达到 $127 million，公司估值达到 $1
              billion，Serval 因此成为独角兽。三个月内估值上调 4 倍（从约 $232M 到 $1B），同时伴随 Serval 声称自 2025 年 8 月以来收入增长 500%，但公司没有披露绝对收入数字。


              Serval 计划把 Series B 资金用于 GTM 和工程岗位招聘，目标是从不足 30 名员工扩张到超过 100 人。公司的投资方包括具备深厚企业软件经验的机构：Sequoia 投资过
              ServiceNow，而 ServiceNow 是 Serval 的主要 incumbent 竞争对手；Redpoint 主导了交易；General Catalyst、First Round 和 Bessemer
              共同补齐蓝筹投资方阵容。截至报告日期，公开报道中没有二级流动性、债务或信贷额度证据。
