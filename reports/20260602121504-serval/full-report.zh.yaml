      - number: '5.2'
        title: 双智能体架构与工作流引擎
        blocks:
          - type: paragraph
            body: >-
              Serval 核心架构差异点在于，它有意把 AI 智能体拆成权限有边界的专业角色。该架构包含三个功能不同的智能体。Automation Agent（供 IT
              管理员使用）接收对目标自动化的自然语言描述，在幕后生成确定性的代码工作流，并在无代码 UI 中展示，供审查和管理。技术团队也可以直接检查代码，并在 Git 中管理。Help Desk
              Agent（供终端员工使用）只能调用 Automation Agent 已搭建并预先批准的自动化来解决请求；它不能在权限集合之外临时行动。Insights Agent
              自主运行，分析模式、提出自动化建议，并推荐知识库内容更新。


              CEO Jake Stauch 在 2025 年 10 月向 TechCrunch 解释安全逻辑：「你不会希望有人进 Slack 说，‘嘿，我想删除公司所有数据’，然后一个特别热心的 AI
              智能体回答，‘好，我来删除所有数据。’它应该说，‘嘿，我没有删除公司所有数据的工具。’」Help Desk Agent 只能调用管理员预先授权的工具，从而把潜在 AI
              错误或对抗性提示词的爆炸半径限制在既有授权范围内。


              工作流引擎从自然语言生成代码，而不是拖拽式逻辑块。Serval 将其描述为「面向 IT 自动化的 vibe coding」——这是有意的产品叙事，把它类比到更广泛的 vibe-coding
              潮流。工作流以代码形式存储，可接入版本控制和 CI/CD 流水线；无代码 UI 则提供非工程师也能理解的呈现。公司称，该工作流引擎支持确定性的多步骤执行，输出可预测、可审计。


              公开资料中没有技术白皮书、开源仓库或独立基准测试说明支撑智能体的 LLM 提供商、知识库检索使用的 RAG
              流水线、工作流执行延迟特征，或代码生成层的可靠性。对一个主张企业级可靠性和合规性的产品而言，这些都是实质性缺口。NIST AI 100-2（2025）将提示词注入和对抗性输入列为基于 LLM
              的智能体系统关键风险——Serval 借助确定性工具门控在架构上缓解这些风险，但无法在 LLM 推理层彻底消除。
