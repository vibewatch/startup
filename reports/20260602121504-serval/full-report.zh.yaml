  - id: TM004
    title: 增长驱动因素与采用约束
    columns:
      - 因素
      - 方向
      - 时点
      - 对 Serval 的含义
      - 尽调问题
    rows:
      - - SaaS 蔓延推高 IT 工单量和访问复杂度
        - 加速因素
        - 当前；未来 1–3 年继续恶化
        - 单个客户可覆盖的工作负载更大；需要更多集成才能覆盖完整技术栈
        - Serval 每个客户平均使用多少个 SaaS 工具？集成覆盖如何演进？
      - - 智能体 AI 成熟，让端到端工单解决无需人工介入
        - 加速因素
        - 当前；LLM 能力按季度提升
        - 拉高自动化率；降低客户疑虑；同时逐步抬高质量预期
        - Serval 已部署客户的自动化率中位数是多少？趋势如何？
      - - 高增长公司精简 IT 团队的经济账
        - 加速因素
        - 当前；高增长公司存在结构性需求
        - 形成拉动式需求，不必完全靠销售推动；客户会主动识别痛点
        - Serval 管线中自然流入与主动拓客各占多少？
      - - 最小权限访问与 JIT 开通的合规要求
        - 加速因素
        - 当前；NIST CSF 2.0 和 ISO/IEC 27001 修订后继续强化
        - 访问自动化从可选项变成合规要求；预算责任人从 IT 扩展到更多职能
        - Serval 是否已纳入客户 SOC 2 或 ISO 27001 控制映射？它能否作为访问日志的记录系统？
      - - 企业 AI 投资预算转向运营自动化
        - 加速因素
        - 当前；2026 年预算周期把 AI 运营工具列为优先项
        - AI 原生 ITSM 更容易获批预算；相较 2023 年缩短销售周期
        - Serval 平均销售周期多长？过去 12 个月如何变化？
      - - 围绕智能体 AI 作用范围的安全与治理顾虑
        - 约束
        - 当前；持续存在
        - 需要确定性、带权限边界的架构；加重评估负担；拖慢采购
        - 面向重视安全的买方，Serval 如何证明动作范围控制？它是否已为大型部署完成企业安全问卷？
      - - 既有 ITSM 锁定（ServiceNow、Freshservice、Jira SM）
        - 约束
        - 当前；多年合约周期
        - 客户可能先把 Serval 作为补充层采用，再考虑完整替换；限制全面替换速度
        - Serval 如何与现有 ITSM 平台共存？双向工单同步会不会侵蚀自身收入？
      - - AI 平台的企业采购周期长
        - 约束
        - 当前；通常 3–12 个月
        - 拖慢新增客户获取；更利于从现有客户先落地再扩张
        - Serval 试点转付费率是多少？平均扩张时间线多长？
      - - 受监管市场的数据驻留与主权要求
        - 约束
        - 当前；欧盟和美国受监管行业继续强化
        - 自托管部署是进入受监管垂直行业的前提；支持起来运营复杂度更高
        - Serval 管线中有多少比例要求自托管部署？适用哪些 SLA 和支持模型？
      - - 新 AI-ITSM 预算项的定价与 ROI 不确定
        - 约束
        - 短期；随着市场成熟会减弱
        - 初始交易需要强 ROI 锚点（自动化率保证、每张工单成本节省）
        - Serval 如何衡量并报告自动化率？50% 保证是否可审计且无条件？
    notes: 方向判断基于公开市场证据和 Serval 的产品定位；公开资料没有 Serval 内部管线、销售周期或赢 / 输率数据。时点来自作者对市场证据的判断。
