              但融资背景暴露出结构性尽调缺口。在 EDGAR 全文搜索系统中，没有找到 Serval, Inc. 的 SEC Form D 豁免通知；对一家已接受约 $127M
              豁免证券发行的美国公司而言，这并不寻常。它究竟反映申报延迟、不同申报实体，还是离岸控股结构，仍未解决。公司 Series B 完成时约 30 名员工——以 $1B 估值看，运营基数极其精简——并计划到 2026
