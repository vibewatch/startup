  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与玩家类型
        blocks:
          - type: paragraph
            body: >-
              2026 年，AI 原生 IT 服务管理市场围绕四类玩家展开：主导企业合同的传统在位平台（ServiceNow、BMC Helix），以自动化深度挑战在位厂商的 AI
              原生点解决方案（Serval、Moveworks、Aisera），把开发者工具延伸到 ITSM 的工作流自动化混合体（Atlassian Jira Service Management），以及把 AI
              功能加到现有工单产品中的传统 SaaS 帮助台厂商（Freshservice、Zendesk）。Serval 同时与四类玩家竞争：它分别对标 ServiceNow 的复杂度和成本、Moveworks
              的自动化主张、Freshservice 的 SMB 价格点，以及 Atomicwork 的从初创到企业叙事。截至 2026 年 Q1，ServiceNow 仍是主导力量，约渗透 85% 的 Fortune
              500，全球拥有 7,700 多家企业客户，但正受到资本密集型 AI 原生替代方案挑战。Freshservice 以公开的按席位定价服务 74,000 多家企业，从 SMB 到企业级，锚定市场可进入端。Jira
              Service Management 以 ITIL v4 对齐和 PinkVERIFY 认证瞄准 DevOps 相邻团队，并借助更广的 Atlassian 生态实现跨产品锁定。Moveworks 以面向
              HR、IT 和设施等员工服务的企业 AI copilot 切入市场，支持 100 多种语言，并用 Reasoning Engine 处理多步骤智能体工作流。Atomicwork 和 Aisera 攻击的也是与
              Serval 相同的 AI 自主叙事：Aisera 入选 Gartner Magic Quadrant for AI Applications in ITSM，并声称自动解决率为 65% 至 90%。BMC
              Helix 被评为 Forrester Wave Leader for Enterprise Service Management Q4 2025，代表在位厂商投入 AI 的投资逻辑。Serval
              的差异化建立在三点上：合同 SLA 保证 50% 自动化、500% ARR 增长验证快速市场牵引，以及多数 AI 原生同业缺少的完整部署灵活性（云、混合、自托管）。
