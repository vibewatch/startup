      - number: '7.5'
        title: 缓解框架与放弃标准
        blocks:
          - type: paragraph
            body: >-
              Serval 最强的结构性缓解来自架构：双智能体设计将工具构建（Automation Agent）与工具执行（Help Desk Agent）分离，避免无约束 AI
              智能体自主采取破坏性动作这一最危险故障模式。预授权工具范围把 Help Desk Agent 限定在明确批准的工作流内，SOC 2 Type II 合规说法也表明公司在数据处理和变更管理上有审计纪律。NIST
              AI Risk Management Framework 提供了独立风险治理模板，而企业买家正越来越多地要求 AI 供应商采用这类模板。


              破坏投资逻辑的触发点可以识别。生产安全事件——AI 大规模错误发放访问权限、提示词注入攻击，或通过集成外传数据——很可能立刻引发合规敏感客户流失，并吸引监管审查。持续 SLA 违约率超过 50%
              自动化保证，会形成公司尚未公开说明的合同责任。鉴于当前高管集中，CEO 在 Series C 前离任几乎必然破坏投资逻辑。降价轮或过桥融资会释放投资人信心恶化信号，并放大竞争和留存风险。投资人应把生产 SLA
              数据、安全披露、员工数轨迹和 ServiceNow 竞争赢 / 输率作为主要前瞻指标，建立持续监控。
