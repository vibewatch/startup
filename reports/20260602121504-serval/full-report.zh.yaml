    rows:
      - - ServiceNow CMDB 锁定
        - 高
        - 7,700+ 家企业客户深度绑定工作流；多年合约很常见
        - 瞄准尚未嵌入 ServiceNow 的绿地科技公司
      - - Atlassian 生态交叉锁定
        - 中
        - JSM 加 Jira Software 加 Confluence 的捆绑，让 DevOps 团队退出成本叠加
        - 定位为 DevOps 原生团队的覆盖层或直接替代品
      - - AI 商品化压力
        - 高
        - Gartner 提示新进入者流失率高；Atomicwork 和 Aisera 瞄准同一 AI-ITSM 买方
        - 合同约定的 50% 自动化 SLA 与不断累积的自动化数据集，构成难以复制的底线
      - - 既有厂商 AI 反向投资
        - 高
        - ServiceNow NowAssist、BMC Helix 为 Forrester 领导者；大型既有厂商大力投入 AI
        - 相比配置繁重的既有厂商实施，Serval 强调部署速度和有保证的结果
      - - TAM 内资本竞争
        - 中
        - Moveworks C 轮 $200M；Serval 总融资 $127M；多家 AI 原生厂商同步融资
        - $1B 估值和 Sequoia 背书，传递一线支持与竞争续航能力
      - - 团队与规模集中风险
