      - number: '6.2'
        title: 采用轨迹与部署证据
        blocks:
          - type: paragraph
            body: >
              最醒目的商业信号是 Serval 在 2025 年 8 月至 12 月之间收入增长 500%，该数字由 Reuters 直接报道并经公司确认。$1B 估值仅在 $232M
              估值三个月后出现，意味着投资人看到的不只是增长率，还有正在加速的轨迹。Sequoia 合伙人 Anas Biad 的评论——Serval 带来的客户反馈，是 Sequoia 自 16 年前投资
              ServiceNow 以来听过最强的——是记录中最有力的第三方背书，尽管发言方是有直接经济利益的投资人。50% 首日工单自动化率出现在三个独立界面：Serval 首页、Sequoia 组合页面和 Reuters
              文章。官方、合作伙伴证明和独立新闻来源的三重引用，提高了对该指标存在性的信心，但并不验证其方法，也不说明它是合同保证还是平均观察值。

              Serval 的上市路径有两条：完全替换既有 ITSM 系统，以及作为 AI layer 叠加在旧平台之上，服务受多年合同锁定的客户。这种灵活性在商业上重要，因为它降低了无法立即退出 ServiceNow 或
              Freshservice 的潜在客户的初始采购阻力。四阶段客户
              onboarding（Meet、Build、Deploy、Optimize）记录在公司定价页面中，意味着其激活模式是结构化、服务辅助的，而非自助试用。从 Series A 到 Series B 不到 90
              天，本身也是间接采用信号：投资人根据期间看到的客户牵引数据加速下注。
