companyProfile:
  summary: >-
    Serval 是一家 2024 年成立、总部位于旧金山的 AI 原生 ITSM 初创公司，部署两个协作的 AI 智能体——Help Desk Agent 和 Automation Agent——为企业 IT
    团队自动处理工单解决、即时访问开通、员工入职和离职。2025 年 10 月，公司完成由 Redpoint Ventures 领投的 $47M Series A；仅七周后，Sequoia Capital 又领投了一轮先发制人的
    $75M Series B，投后估值 $1B，累计披露融资达到 $127M。公司公开称 2025 年 8 月至 12 月收入增长 500%，但未披露绝对 ARR。已披露客户包括 Perplexity、Together
    AI、Mercor、Vercel、Verkada、Clay 和 Cribl，全部是技术原生公司。Series B 交割时员工约 30 人，公司称计划到 2026 年底超过 100 人。
