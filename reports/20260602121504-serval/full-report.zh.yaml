      - number: '5.5'
        title: 差异化、风险与产品缺口
        blocks:
          - type: paragraph
            body: >-
              Serval 所称差异化建立在四个支柱上。第一，原生基于代码生成工作流，区别于 ServiceNow Flow Designer 和 Freshservice Workflow Automator
              等拖拽式前代产品；确定性代码工作流可以审计、版本化，并兼容 CI/CD，低代码逻辑块做不到这些。第二，双智能体安全架构明确把 Help Desk Agent 限制在预先授权的工具集合内，为企业对无约束 AI
              的担忧给出结构性答案。第三，自然语言界面大幅降低搭建新自动化的边际成本，Serval 认为这正是 ITSM 自动化采用的瓶颈。第四，部署灵活性（云端或 Kubernetes
              自托管）加上广泛集成覆盖（60+）降低切换成本，并支持「AI layer」叠加策略。


              与这些优势相对，产品承担实质性技术风险。LLM 提供商依赖最深：Serval 的智能体依赖一个或多个第三方 LLM
              API（身份未披露）。任何提供商宕机、定价变化、模型弃用或安全政策调整，都可能实质性削弱产品。Automation Agent
              的代码生成质量无法从公开来源验证——生成的工作流代码若出错，可能引入访问控制漏洞或数据暴露风险，这比聊天机器人答错问题后果更重。99.9% 正常运行时间 SLA
              已被陈述，但无法独立验证。没有公开状态页或历史可用性数据。


              Serval 与开发者社区的互动非常有限。没有找到 Serval 集成或 SDK 的公开 GitHub 仓库。来自 serval.com 的 Hacker News 投稿没有归档公开讨论，HN Algolia
              搜索「Serval ITSM」也没有返回工程讨论。这种低开发者社区足迹符合纯企业销售动作，但也意味着产品架构或可靠性没有独立技术审视。


              The Register 和 VentureBeat 在 2026 年初发布文章，指出企业 IT 部署智能体 AI 的一般风险，包括工作流生成中的幻觉、大规模集成失败，以及企业对 AI
              可靠性保证的怀疑。这些风险适用于 Serval，不过目前没有具体事件或产品故障被公开归因于 Serval 本身。路线图信号很少：Serval 博客提到会扩展到 HR、法务和财务工作流（Reuters
              报道中提及），但没有公开产品路线图、发布变更日志或开发者 API 版本历史。
