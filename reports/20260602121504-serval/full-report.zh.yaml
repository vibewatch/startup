      - number: '4.2'
        title: 融资时间线与资本位置
        blocks:
          - type: paragraph
            body: >
              Serval 的资本历史以速度见长。公司成立于 2024 年，到 2025 年 12 月已通过两轮主要融资累计获得 $127M 披露风险投资。$47M Series A 由 Redpoint Ventures
              领投，于 2025 年 10 月完成，First Round Capital、General Catalyst、BoxGroup、Bessemer Venture Partners、Chemistry
              VC、Strike Capital、Sunflower Capital 和 Operator Partners 参投。仅七周后，Sequoia Capital 领投了投后估值 $1B 的 $75M Series
              B，使 Serval 成为企业软件史上最快进入独角兽行列的公司之一。

              估值轨迹尤其醒目。Reuters 文章引用的 PitchBook 数字显示，Serval 在 2025 年 8 月的隐含估值为 $232M——同一个夏天，公司首次披露 500% 收入增长说法。到 2025 年
              12 月，估值达到 $1B，约三个月内上调 4.3 倍。公司未披露债务额度、可转债或项目融资义务。据报道，资本部署目标是工程人员和 GTM 招聘。公司计划从 Series B 时约 30 名员工扩张到 2026
              年底超过 100 人，这意味着烧钱速度会显著加快，也使执行高度依赖于维持吸引 Sequoia 领投的增长率。EDGAR 系统中未找到 Serval, Inc. 的 SEC Form D
              备案；对于一家接受如此规模豁免证券发行的美国公司，这并不常见。
