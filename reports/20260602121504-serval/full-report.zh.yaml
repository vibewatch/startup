      - number: '2.4'
        title: 推动 AI 原生 ITSM 采用的需求驱动因素
        blocks:
          - type: paragraph
            body: >-
              四股结构性力量正在压缩 AI 原生 ITSM 的采用时间线。第一，企业 SaaS 蔓延正在指数级增加访问开通和离职交接事件：公司每引入一个新的 SaaS 工具，IT
              都要管理访问策略、凭证开通和定期访问审查。Serval 的 60+ 工具集成目录——覆盖 Okta、Google
              Workspace、GitHub、AWS、Rippling、Workday、Jira、ServiceNow 和 Zendesk——直接应对这种碎片化。第二，企业 AI 投资正在加速底层 LLM 能力成熟，而智能体
              IT 工作流需要这些能力。ServiceNow 把自主 AI specialist 定位为核心平台功能（走向「zero-touch service」），Aisera 的企业证据（60–70%
              自动解决率、某客户节省 $2.2M 支持成本）也验证技术已经可以进入企业生产部署，降低了 2023–2024 年普遍存在的买方怀疑。

              第三，快速增长公司里的精简 IT 团队形成紧迫感：一家每 12 个月员工数翻倍的公司，无法线性扩大 IT
              人员，因此自动化是成本必需品，而不是可选创新支出。第四，围绕最小权限访问（零信任、即时开通）的监管压力，让手工访问管理成为合规风险。Serval 的智能体开通、自动撤权和限时访问，直接对应 NIST 和 SOC
              2 控制要求；过去这些要求需要 IT 手工介入。
