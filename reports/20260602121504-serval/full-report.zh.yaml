chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、创立与运营模式
        blocks:
          - type: paragraph
            body: >-
              Serval, Inc. 是一家 AI 原生 IT 服务管理（ITSM）公司，总部位于 CA 94104 旧金山。公司由 Jake Stauch（CEO）和 Alex McLeod 于 2024
              年创立，使命是部署能够自主解决帮助台请求、开通访问、办理员工入职，并通过自然语言构建工作流自动化的 AI 智能体，替代传统工单和工作流工具。公司是一家在 Delaware
              注册、获得风险投资支持的私营公司，对外将产品定位为「面向 IT 的 AI 智能体」。


              Serval 将其产品描述为一个 AI 原生统一平台，组合帮助台、访问管理和自动化引擎。公司的差异化架构使用两个不同的 AI 智能体：Help Desk Agent 通过
              Slack、Teams、电子邮件或网页门户与员工交互，并通过调用预先批准的确定性工具解决请求；Automation Agent 允许管理员用自然语言指令构建这些工具——CEO 称之为「IT 自动化的 vibe
              coding」。第三个 Insights Agent 分析工单模式，发现自动化机会和配置改进点。把工具构建和工具执行分开，是 Serval 企业安全姿态的核心：Help Desk Agent
              只能调用预授权自动化，避免不受约束的智能体采取破坏性动作这类「失控 AI」事故。


              截至报告日期，Serval 的商业模式是企业 SaaS，采用定制、按报价定价。公司提供云托管、混合和自托管部署选项，目标客户是技术公司以及有复杂 IT 自动化需求的企业。其 GTM 策略同时支持完整替换传统
              ITSM 工具，以及为被长期合同锁定的客户在现有系统上叠加「AI 层」。Serval 的注册实体为 Serval, Inc.，产品条款使用的法律域名是 serval.com。
