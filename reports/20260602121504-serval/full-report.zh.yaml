  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: |
      Serval 的客户旅程沿公司定义的四个阶段推进——Meet、Build、Deploy、Optimize；部署后的增长闭环来自扩展到更多部门、更深地自动化工作流。
    data:
      nodes:
        - label: 发现
          description: |
            潜在客户来自 VC 网络转介、入站营销或 SDR 外呼；通过 serval.com 的 Book a Demo CTA 预约演示。关键参与者：IT Director / CTO。
        - label: 评估（Meet 阶段）
          description: |
            引导式试点定范围；分配专属部署工程师；评估 IT 工单存量，寻找可自动化面。摩擦点：高接触服务，未记录自助试用。
        - label: Build 阶段
          description: |
            用自然语言描述工作流自动化；Automation Agent 生成确定性代码；IT 管理员审查并批准权限。摩擦点：需要代码审查；自然语言自动化有学习曲线。
        - label: Deploy 阶段
          description: |
            Help Desk Agent 在 Slack / Teams / 邮件门户上线；首日目标是自动化 50%+ 工单。摩擦点：员工采用；必须与现有工具保持集成一致性。
        - label: Optimize 阶段
          description: |
            Insights Agent 浮现工作流建议；知识库更新；安全配置收紧。摩擦点：AI 建议更新带来的变更管理。
        - label: 扩展到新部门
          description: |
            更多部门（HR、Legal、Finance）采用 Serval；集成数量横跨 Okta、GitHub、Jira、Salesforce 等继续增加。摩擦点：跨部门预算和采购协调。
