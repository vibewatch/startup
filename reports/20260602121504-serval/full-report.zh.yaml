            body: >
              在 ARR 未披露的情况下，Serval 的隐含估值倍数只能通过区间情景推断。如果 2025 年 8 月收入基数约为 $2M ARR，500% 增长意味着 Series B 完成时约 $12M ARR，则 $1B
              估值约为 83x 过去十二个月 ARR 倍数。如果基数为 $5M 并增长到 $30M，倍数压缩至约 33x。两种情形都处于 2025 年早期 SaaS
              融资的前十分位，只有在市场预期其增长轨迹异常强劲时才说得通。2025 年前四分位早期 AI SaaS 公司获得 15–40x 预期 ARR
              倍数；三位数倍数说明要么增长极强，要么收入基数被压缩且无法验证。没有独立分析师发布过 Serval 的具体 ARR 估计。

              可比上市公司组锚定上限。ServiceNow 是主导性 ITSM 既有厂商，2024 年全年收入约 $10.98B，其市值隐含 13–15x 过去十二个月收入倍数——远低于 Serval
              隐含区间，反映出成熟度和现金流生成能力。Atlassian 的 Jira Service Management 业务因增长放缓，交易倍数约为 9–10x 收入。私有 AI ITSM 同业 Moveworks 在
              ARR 同样未披露的情况下，以 $2.1B 估值融资约 $300M，说明投资人群体能接受成长阶段 AI ITSM 的溢价倍数。PitchBook 在该轮后独立将 Serval 标记为 $1B 公司，为
              post-money 标记提供第三方印证。ITSM 市场基于订阅的经常性收入结构支持更高长期倍数，但 Serval 的倍数需要一条目前无法从公开数据验证的增长轨迹。
            claimRefs:
