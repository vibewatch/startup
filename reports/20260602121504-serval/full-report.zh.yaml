  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义、范围与相邻领域
        blocks:
          - type: paragraph
            body: >-
              Serval 的产品切入 IT 服务管理软件市场。广义上，ITSM 是接收、路由、自动化并解决员工内部服务请求的软件层。IBM 将 ITSM
              定义为规划、实施、管理和优化信息技术服务端到端交付的实践，以满足用户和业务目标，涵盖事件管理、问题管理、变更管理、服务请求管理和 IT 资产管理。这个边界已经成熟：它排除 IT
              监控和可观测性（衡量基础设施健康状况，而不是工作流交付）、端点管理（没有请求层的设备开通）以及企业资源规划（掌管业务流程，而不是 IT 服务交付）等相邻类别。

              在 ITSM 内部，Serval 竞争的是新兴 AI 原生子细分：用大语言模型和智能体自动化处理端到端请求解决，而不只是路由或分类。相比传统工单厂商，这一子细分仍处早期，但正吸引
              incumbent（ServiceNow 的自主 AI specialist 项目、BMC 的 HelixGPT、Freshservice 的 Freddy
              AI）和风险投资支持的初创公司（Aisera、Moveworks、Atomicwork、Serval）大量投入。Serval 的可服务市场不包括纯可观测性平台（Datadog、PagerDuty）、DevOps
              工具链（GitHub Actions、CircleCI）以及不包含帮助台层的独立身份治理工具（SailPoint、Saviynt）。

              Enterprise Service Management（ESM）是一个重要相邻方向，它把 ITSM 模式延伸到 HR、Finance 和 Legal 工作流。Serval 平台已经支持
              IT、Security、HR 和 Workplace 团队的多部门隔离，这意味着若公司推进，ESM 扩张是一个合理增长向量，并会扩大可服务市场。Serval SAM 纳入的支出包括 AI 原生 ITSM
              平台席位、实施服务和自动化工作流额度，面向技术前沿行业中 50–10,000 名员工的组织。
