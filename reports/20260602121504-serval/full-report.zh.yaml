        title: 牵引信号与单位经济性
        blocks:
          - type: paragraph
            body: >
              Serval 最强的公开商业证据来自已披露客户名单和收入增长主张。公司公开列出 Perplexity、Together AI、Mercor、Vercel、Verkada、Clay 和 Cribl
              为客户。这些都是技术原生公司，其中大多数本身也是有风投支持的初创公司或扩张期企业。Sequoia
              投资组合页面以相同措辞独立佐证了这一组客户。技术原生客户集中有助于证明早期采用者牵引，但也提出企业跨越问题——Serval
              能否卖给受监管行业、大型金融服务公司或政府机构；这些客户的合规要求、变更管理和采购周期严苛得多。

              Serval 在 Reuters/US News 文章中报告自 2025 年 8 月以来收入增长 500%。该主张未同时披露 ARR 或 MRR 数字，因此无法把增长率锚定到起始基数。一家公司从 $100K
              ARR 增长到 $600K ARR 也是 500% 增长，但其风险画像与从 $5M 增长到 $30M
              的公司完全不同。单位经济性——获客成本、客户终身价值、回本周期、毛利率和净收入留存——全部未公开。定价模型为询价制，没有披露底价或上限。自动化保证（50% 工单）是商业承诺，但公开材料没有描述罚金或 credit
              机制。SOC 2 Type II 认证和 99.9% uptime SLA 提供企业可信度信号，但不能替代披露的财务指标。
