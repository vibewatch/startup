      - number: '8.3'
        title: 乐观、基准与悲观情景分析
        blocks:
          - type: paragraph
            body: >
              乐观情景要成立，Serval 需要在 2026 年底把 ARR 做到 $40–60M，净留存率（NRR）超过 150%，并从技术原生客户跨进至少两个企业垂直行业（金融服务或医疗健康），同时在规模化后守住 50%
              工单自动化保证。在这些条件下，若 2027–2028 年退出时按 25–30x 远期 ARR 估值，对应 $1.25–1.8B 估值，相比 Series B 入场价产生 1.3–1.8x 回报。Sequoia
              的高确信度、Perplexity 和 Verkada 的客户验证，以及 IT 自动化转向 AI 原生的长期趋势，让乐观情景具备可能性。但它要求公司在获客、产品和安全上持续极强执行，同时 ServiceNow
              不能以零增量成本把 AI ITSM 打包进现有产品来反击。

              基准情景假设 2026 年底 ARR 为 $20–35M，NRR 超过 120%，技术原生客户继续扩张，并在 2028 年按 20–25x ARR 退出。这意味着估值区间为
              $500M–$875M——大致持平或略低于 Series B 入场价——后期 Series B 投资人的回报生成有限。悲观情景假设 ServiceNow 到 2026 年 Q3 激进打包 Now
              Assist，且不收增量费用，把 Serval 的商业窗口压缩到 500 人以下技术公司。在这种情景下，Serval 到 2026 年底只能做到 $10–15M ARR，市场倍数压缩到 12–15x，2028
              年退出对应 $150–$225M 估值——相较 $1B Series B 入场价损失明显，也可能触发下轮降估或困境退出。Axios 2026 年 1 月报道确认，LP 对收入基础不可验证的 AI
              初创估值审查已经收紧，因此悲观情景的尾部比标题看起来更厚。
