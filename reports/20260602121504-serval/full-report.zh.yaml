          - type: callout
            title: 99.9% SLA 说法缺少公开状态页或历史可用性数据
            body: >-
              Serval 为云托管部署选项营销 99.9% 正常运行时间 SLA，但未找到可验证历史可用性的公开状态页（例如 statuspage.io 实例）。一家不到 30 人的公司运营多租户 SaaS，并承载智能体
              AI 工作负载，运营复杂度很高。企业 IT 买家在签约前应要求提供历史可用性数据和 SLA 违约补救条款。
