      - number: '8.4'
        title: 监管异常与反向信号
        blocks:
          - type: paragraph
            body: >
              三个反向信号需要升级尽调。第一，截至分析日，在 EDGAR 全文检索 Serval, Inc. 的 Form D 文件没有结果。美国 Regulation D 要求发行人在 Regulation D
              发行首次出售证券后 15 天内提交 Form D 通知。一家公司至少两轮已接受约 $127M 融资，却没有该文件，这是异常。可能原因包括：Serval 由非美国控股实体架构、投资经由免于美国 Form D
              要求的境外载体进入；文件以不同法定名称提交；或合规遗漏。任何一种解释都需要法律尽调，也会提高尽调画像里的监管风险。

              第二，Axios 2026 年 1 月发布分析，记录 LP 对 AI 初创估值的审查升温，尤其是收入未经验证、增长率由公司自报、隐含倍数超过 50x 的公司。Serval 的画像正落在 Axios
              所称容易吸引下轮降估风险的标准上：未经审计的增长主张、压缩到独角兽的时间线、没有公开绝对收入数字。第三，Dark Reading 报道称，部署在企业 IT 场景的智能体 AI 系统——正是 Serval
              的部署语境——会继承传统软件漏洞，包括提示注入和权限升级。Serval 的企业部署若发生安全事件，可能造成实质客户信任损害和整改成本；公开来源都没有量化这两项。
            claimRefs:
              - CV010
              - CV011
              - CV026
              - CV033
              - CV042
