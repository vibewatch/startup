      - number: '3.2'
        title: 能力与产品对比
        blocks:
          - type: paragraph
            body: >-
              Serval 的核心能力是端到端自主工单解决：其 AI 智能体接收请求，识别所需动作（通过 Okta 开通访问、关闭 Jira issue、更新 Slack channel），通过 150
              多个原生集成执行工作流，并在无人介入下关闭工单。其他被评估厂商没有在 SLA 中合同化保证 50% 自动化下限。ServiceNow 的 NowAssist AI agents 原生运行在 Now
              Platform 上，具备 ML 模型编排、CMDB 耦合和深度变更工作流管理，但需要大量配置投入，也没有公开自动化保证。Freshservice 的 Freddy AI 提供 AI
              辅助工单分流和坐席辅助建议，标准层级尚未达到完全自主解决。Jira Service Management 包含 Atlassian Intelligence，用于请求分类和虚拟智能体支持，但 AI 深度明显低于
              Serval 的自主层级。Moveworks 的 Reasoning Engine 支持多步骤智能体工作流，并声称需要人工介入的工单减少
              40%——这是有意义的主张，但它是相对减少，不是绝对下限保证。Atomicwork 的 Atom AI copilot 处理自然语言路由，无需手工分类；Aisera 的对话式 AI 和 RPA 集成支撑其声称的
              65% 至 90% 自动解决区间。Serval 的部署灵活性使其区别于多数 AI 原生竞争对手：云、混合和自托管配置让它能在数据驻留要求排除纯 SaaS 的受监管行业竞争。ServiceNow
              高价提供本地部署；Freshservice、Moveworks 和 Atomicwork 在标准层级都是纯云。Serval 持有 SOC 2 Type II、HIPAA 和 GDPR
              认证，使其能够追逐纯云竞争对手无法进入的受监管行业交易。
