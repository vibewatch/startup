      - number: '7.3'
        title: 竞争与生态依赖风险
        blocks:
          - type: paragraph
            body: >-
              对 Serval 最具战略意义的竞争威胁是 ServiceNow 本身。ServiceNow 平台覆盖 85% 的 Fortune 500，正在部署具备自主多步骤工作流能力的 NowAssist AI
              agents，并拥有 Serval 缺少的既有续约周期、企业信任和捆绑杠杆。如果 ServiceNow 复制 Serval 的 50% 自动化 SLA 保证，或以无增量成本把该用例吸收到自身平台，Serval
              的主要差异化就会消失。Moveworks、Aisera 和 Atomicwork 是已有客户基础且架构相近的 AI 原生 ITSM 竞争者，压缩了 Serval 建立品类领导地位的窗口。


              生态依赖风险很高。Serval 的 Help Desk Agent 完全通过 Slack、Microsoft Teams、电子邮件和网页门户运行——这些都是第三方沟通渠道。其核心自动化能力依赖
              Okta、Google Workspace、GitHub、Jira、AWS 和 Workday 集成；这些提供商的任何 API 政策变化、宕机或信任撤销，都会直接削弱 Serval 产品。最关键的是，Serval
              没有披露哪家或哪些 LLM 提供商支撑其 AI 层。单一提供商 LLM
              依赖会引入模型可用性、定价和能力风险，而公开披露不足以评估这些风险。早期采用技术初创客户集中——虽适合初始牵引——但若一批规模相近的客户因共同宏观风险同步流失，收入会变得脆弱。
