      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              ITSM 购买动作本质上由 IT 主导，中央 IT 预算掌握采购。在中型市场公司（100–2,000 名员工），通常由 Head of IT 或 IT Director 评估并选择平台；在更大型企业中，CIO 或
              VP of IT Infrastructure 负责采购治理，并让安全和法务参与。Serval 的早期客户——Perplexity、Mercor、Together AI 和
              Cribl——主要是快速增长的技术公司，Head of IT 管理精简团队，需要把大部分例行工作自动化，而不是继续加人。这一买方画像与 TechCrunch 对 Serval
              价值主张的描述一致：公司把自动化做得足够轻松，以至于永久构建一个工作流比手工做一次还容易。

              ITSM 平台用户包括广义员工（提交请求的所有员工）和处理升级工单的 IT 专员。Serval 的智能体架构意味着，大多数终端用户交互发生在 Slack、Microsoft Teams、电子邮件或网页门户中，由
              AI 智能体处理解决；只有请求超出定义好的自动化范围时才升级给人工。这减少了一级支持所需的 IT「席位」数量，使 Serval 的 ROI 论证围绕自动化率，而不是单纯围绕单席成本。

              付款方几乎完全是 IT 预算线；随着 ESM 用例被激活，潜在可扩张到 HR、Finance 或 Legal 预算负责人。Freshservice 的多产品结构（Freshservice for Business
              Teams、Freshservice for MSPs）显示，随着 ESM 成熟，市场已经接受跨部门预算碎片化。ServiceNow 模式主要面向大型企业，付款方是企业 IT
              组织，合同金额可达数百万美元。Serval 保证 50% 自动化率，并采用专属部署工程模式，说明其销售动作会先从定义明确的试点中建立 ROI，再扩张到完整部署，这是典型的企业软件 land-and-expand
              模式。
