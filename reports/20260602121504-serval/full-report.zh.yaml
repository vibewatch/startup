        title: 客户证明质量与留存缺口
        blocks:
          - type: paragraph
            body: >
              尽管采用信号很强，按企业尽调标准，Serval 的客户证明质量仍偏薄。公司为 Perplexity 和 Together AI 设置的案例研究页面均返回 HTTP 404，/customers
              页面也无法访问，意味着没有公开的、由独立方撰写的案例研究内容。记录中唯一一条推荐语——IT 负责人 Vernon Man 描述 50% 以上自动化——没有标明其代表的公司，无法交叉验证。Gartner Peer
              Insights 在「AI Applications in IT Service Management」类别下没有列出 Serval 评论，也未找到 G2 评论；这与一家 2024
              年成立、尚未优先经营第三方评论平台的公司相符。公开来源中没有披露净收入留存、总收入留存、流失率、客户数、年度合同价值或客户终身价值。

              安全维度为潜在买家再加一层运营风险。Dark Reading 引用的 Acronis 研究人员证明，智能体 AI 平台——包括采用 Serval 同类架构的「vibe coded programs」——在非确定性
              LLM 层与确定性工具层交界处会带入传统软件漏洞。认证绕过、访问控制不足和提示词注入，仍是部署智能体 IT 自动化的组织面临的现实问题。Serval
              借助双智能体架构和基于角色的访问控制缓解部分风险，但这项研究也强调，客户安全姿态是当前证据基础尚未充分覆盖的关键尽调维度。
