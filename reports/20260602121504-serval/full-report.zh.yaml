    rows:
      - - AI 原生 ITSM 平台
        - 面向智能体 IT 帮助台、访问管理和入职自动化的按席位与按用量订阅
        - 没有 AI 解决层的纯工单 SaaS；传统本地部署服务台软件
        - IT 负责人、IT 主管、掌握 IT 运营预算的 CIO
        - 核心直接市场；Serval 的主要产品面
      - - 传统 ITSM 软件
        - 云和本地部署服务台、事件管理、变更管理和 ITAM 授权
        - 不包含请求层的基础设施硬件、端点管理和网络监控
        - IT 主管、CIO，以及掌握多年期 IT 平台预算的采购
        - 替换机会；Serval 必须替代或共存的在位玩家
      - - 企业服务管理（ESM）
        - 面向 HR、Finance、Legal 和 Workplace 团队的跨职能请求自动化
        - 不含 IT 请求工作流的核心 ERP 模块、薪资系统和会计软件
        - CHRO、CFO、总法律顾问，以及拥有职能预算线的部门负责人
        - 相邻扩张市场；Serval 的多团队隔离支持 ESM 增长
      - - AIOps 和 IT 运营
        - AI 驱动的事件关联、事件管理和智能告警平台
        - 不含请求路由的网络监控、可观测性仪表盘和性能管理
        - IT 运营经理和 SRE 团队
        - 相邻；在自动修复工作流上重叠，但 Serval 不覆盖基础设施监控
      - - 身份与访问治理
        - 智能体访问开通、just-in-time 访问和访问审查自动化
        - 独立 PAM（特权访问管理）工具，以及不含请求工作流的身份治理
        - IT 安全经理、CISO 和合规团队
        - Serval 平台内的关键能力；也是独立治理软件市场
      - - IT 帮助台外包
        - 第三方处理 IT 支持工单的托管服务台合同
        - 人员补充、离岸 IT 支持团队和 IT 咨询项目
        - COO、拥有外包预算的 IT 主管
        - 间接竞争压力；Serval 自动化外包商靠人工配置的工作
    notes: 市场边界基于 Serval 的产品面和 IBM 的 ITSM 定义。支出估计来自行业报告和公开定价推断；截至研究日期，没有单一权威市场规模覆盖 AI 原生 ITSM 子细分。
