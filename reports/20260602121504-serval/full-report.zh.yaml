      - number: '4.4'
        title: 竞争性财务格局
        blocks:
          - type: paragraph
            body: >
              ITSM 市场规模大且在增长。MarketsandMarkets 和 Grand View Research 的分析师估计显示，全球 ITSM 市场 2024 年约为 $11B，预计到 2030 年将超过
              $30B。AI 赋能 ITSM 子细分增长更快，因为大型在位平台正竞相把智能体自动化与专门的 AI 原生厂商一起整合进产品。ServiceNow 2024 年收入约 $10.98B，市值超过 $150B，已经在
              Now Platform 上直接推出自有生成式 AI 和智能体 AI 能力。这一竞争压力是 Serval 最实质的近期战略风险：资源充足的在位厂商可以向现有客户捆绑同等功能且不额外收费，从而压缩 Serval
              的商业窗口。

              Freshservice 和 Atlassian Jira Service Management 都公布透明定价层级，便于直接对标。Moveworks 和 Aisera 是 AI 优先 ITSM
              替代方案，融资历史更早，但 ARR 同样未披露。Atomicwork 将自己定位为带免费入口的 AI ITSM 玩家。BMC Helix 代表正在用 AI 附加功能现代化的传统 ITSM
              在位厂商细分。Serval 的差异化——双智能体架构、保证自动化率、引导式试点——作为技术护城河可信，但尚未接受 ServiceNow 资源深度的压力测试。缺少 Fortune 500 企业品牌客户标志，意味着
              Serval 超越技术原生细分的跨界吸引力仍未证实，这会实质影响其长期 TAM 捕获潜力。
