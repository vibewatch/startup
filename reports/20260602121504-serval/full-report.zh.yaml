      - number: '2.5'
        title: 采用摩擦、合规约束与采购障碍
        blocks:
          - type: paragraph
            body: >-
              尽管需求顺风强劲，几股力量仍会拖慢 AI 原生 ITSM 采用。围绕 AI 动作范围的企业安全和治理要求，是最显著的摩擦点。TechCrunch 关于 Serval 的报道点出了核心企业顾虑：组织对失控 AI
              智能体采取意外动作的风险高度敏感，因此 Serval 架构把工具构建与工具执行分离，并强制采用确定性、经授权的动作，而不是单一全能智能体。这是真正的架构差异化，但也意味着潜在客户购买前必须理解并信任一个以 AI
              为中心的安全模型——这不是轻量评估障碍。

              ITSM 平台的采购周期很长，因为它有大量集成要求。Serval
              的入职模式包含四个阶段（meet、build、deploy、optimize）和一名专属部署工程师，这意味着潜在客户在评估自动化率保证前，可能要经历数周到数月的企业销售周期。ServiceNow、BMC 和
              Freshservice 等传统 ITSM 平台拥有广泛合作伙伴生态和专业服务关系，形成切换成本和惯性。合规认证要求也抬高门槛：SOC 2 Type II、HIPAA 和 GDPR
              是企业采购的标准要求；Serval 文档称三者均满足，但截至研究截止时，独立审计证据并未公开。

              对受监管行业（医疗、金融服务、政府）而言，数据驻留和主权是实质约束，因为 ITSM 数据包含员工 PII、访问日志和敏感工作流历史。Serval 的云托管、混合和自托管部署选项原则上应对数据驻留，但自托管支持和
              SLA 保证细节没有公开记录。最后，定价模型依赖专属部署工程师，意味着很小的公司（50 人以下）可能得不到 Serval 当前 GTM 动作的充分服务，从而限制 SAM 低端。
