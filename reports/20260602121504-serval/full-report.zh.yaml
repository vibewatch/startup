      - number: '7.4'
        title: 执行、人员与财务风险
        blocks:
          - type: paragraph
            body: >-
              按任何标准看，Serval 的执行风险画像都极端。2025 年 12 月 Series B 时公司不到 30 名员工，却背负 $1B post-money 估值、合同化 50% 自动化 SLA，以及到 2026
              年底扩至 100+ 人的计划——12 个月内员工数扩大 3 倍。按旧金山薪酬水平，一家 100 人 AI 公司每年全负担员工成本约 $18M–$25M；公司披露的 $127M
              资本提供了现金跑道，但以这种速度同时做深产品、建立企业销售能力和安全审计深度，运营要求很高。


              截至运行日期，Jake Stauch 是所有公开 Serval 传播中唯一被点名的 C-suite 高管。公司没有公开宣布 CTO、CFO、CPO 或首席安全官。Alex McLeod 在 Redpoint
              组合页面被列为联合创始人，但在任何媒体报道中都没有公开露面。对一家已融资 $127M、估值 $1B 的公司而言，这种关键人物集中并不典型；如果 Stauch 在 Series C
              前离任或丧失履职能力，将实质性影响投资人信心、客户关系和产品路线图。


              在收入未披露的情况下，Serval 的估值倍数很激进。公司称自 2025 年 8 月以来收入增长 500%，但没有披露 ARR 或客户数。如果 Series B 时 ARR 为 $2M–$5M
              区间（与这一员工规模下非常早期的企业 AI 公司相符），$1B 估值意味着 200x–500x 收入倍数——只有在增长持续保持或超过当前速度直至 Series C
              时，这一水平才可持续。增长放缓、关键客户流失，或在与 ServiceNow 竞争中失利，都可能迫使公司下轮降价。
