  - id: TR001
    title: 监管 / 法律风险登记表
    enumerationScope:
      coverage: partial
      basis: >-
        Review of EU AI Act, GDPR Article 22, Regulation D Form D requirements, CCPA, CISA 2026 agentic AI guidance, and
        NIST AI RMF cross-referenced against Serval's published AUP and public disclosures as of June 2026. Coverage is
        partial because sector-specific regulations (HIPAA enforcement specifics, state-level AI bills) require
        customer-by-customer analysis.
    columns:
      - 监管领域
      - 具体要求
      - Serval 风险暴露
      - 严重性
      - 已部署缓解措施
    rows:
      - - EU AI Act（透明度 / GPAI）
        - 第 52 条规定与人交互的 AI 系统承担透明度义务；自动化、就业相邻决策可能被归入 Annex III 高风险分类
        - 在欧盟部署自动化 IT 访问和 HR 工作流自动化，可能需要透明度披露；公司未发布 EU AI Act 就绪声明
        - 高
        - AUP 含人工监督条款；无正式合规声明
      - - GDPR 第 22 条
        - 禁止在缺少有意义人工干预时，作出具有法律效力或重大影响的纯自动化决策
        - 自动化 IT 访问开通和员工离职流程具备就业相邻影响，可能触发欧盟客户的第 22 条义务
        - 高
        - AUP 要求对有后果影响的决策进行合格人工复核
      - - 美国证券法（Regulation D / Form D）
        - 豁免证券发行首次销售后 15 天内，必须向 SEC 提交 Form D
        - 截至运行日期，未发现 Serval 针对 Series A 和 Series B 已披露约 $127M 风险融资提交 SEC Form D
        - 中
        - 未披露补救措施；缺口需要直接询问
      - - CCPA / 美国州隐私法
        - 数据主体权利、自动化决策通知和退出要求
        - Serval 在企业 IT 工作流中处理员工 PII；义务取决于客户所在地和各 MSA 的数据处理范围
        - 中
        - 声称具备 SOC 2 Type II；AUP 声明符合 GDPR/CCPA
      - - CISA 智能体 AI 指引（2026）
        - CISA 指引要求关键基础设施运营方和企业 IT 环境谨慎采用智能体 AI 服务
        - 关键基础设施行业的 Serval 客户面临 CISA 指引下的采购和安全审查要求，会给 Serval 销售带来间接合规负担
        - 中低
        - 双智能体预授权架构；SOC 2 Type II；声称符合 HIPAA
    claimRefs:
      - CR005
      - CR006
      - CR009
      - CR013
      - CR014
      - CR015
      - CR016
      - CR017
      - CR018
      - CR019
      - CR020
    notes: >-
      覆盖范围并不完整；行业特定监管义务（HIPAA、FedRAMP、EU NIS2）需要按客户逐一分析。EU AI Act 分类是作者判断，仍待监管机构对 ITSM AI 自动化给出正式指引。SEC Form D 缺失是基于
      EDGAR API 搜索的事实发现；缺失并不确认违规，但值得追问。
