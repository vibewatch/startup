      - number: '5.3'
        title: 集成、部署选项与 API
        blocks:
          - type: paragraph
            body: >-
              Serval 集成页面列出 60+ 个连接器，覆盖身份提供商、HR 系统、云平台、工单工具、设备管理和开发者工具。集成页面可见的已验证命名集成包括：Okta、JumpCloud、Microsoft
              Graph、Google
              Workspace、Slack、Jira、Linear、ServiceNow、GitHub、AWS、Rippling、BambooHR、Confluence、Notion、CrowdStrike、Jamf、Kandji、PagerDuty、Opsgenie、incident.io、Rootly、Ramp、Navan、HubSpot、Asana、ClickUp、Figma、Calendly、Ashby、Ironclad、PandaDoc、Persona、Envoy、Sigma
              Computing 和 Fresh Service，另有自定义应用选项。这些横跨四类功能：Access Management、Knowledge Base、Ticket Syncing 和
              Workflows。对一家不到 30 人的公司而言，广度具备竞争力，但深度（每个集成的动作 / 触发器数量）未披露。


              部署提供两种模式。Cloud-hosted 由 Serval 全托管，客户无需承担基础设施负担，自动更新，并提供 99.9% 正常运行时间 SLA。Self-hosted 使用 Terraform 和
              Kubernetes 部署在客户私有云中，文档称可在数小时内完成资源发放；该选项面向有数据驻留或隐私要求的企业。未找到公开状态页，无法独立验证 99.9% SLA 说法。


              技术 API 访问已有文档：Serval 为所有集成提供完整 API 访问，并支持通过 API 对接任意系统的自定义集成。定价页面提到 CLI。Terraform 支持基础设施发放和自定义访问模式。SCIM
              被列为身份提供商集成能力。这些能力面向希望把 Serval 嵌入现有 CI/CD 和 IaC 流水线的 DevOps 与平台工程团队。


              Serval AUP 明确禁止对服务进行逆向工程、反汇编或推导源代码；禁止使用输出构建竞争性 AI 产品；并要求在依赖 AI 生成输出作出重大决策前进行人工审查——这表明公司承认 AI 的可靠性边界。
            claimRefs:
              - CE018
