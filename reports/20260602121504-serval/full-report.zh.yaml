  - id: FE001
    title: Serval 产品架构栈
    type: stack
    layout: standard
    summary: Serval 的平台分层从顶部的员工交互渠道，到智能体智能、工作流运行时、集成连接器，再到底部基础设施。
    data:
      layers:
        - label: 员工交互层
          detail: Slack、Microsoft Teams、电子邮件和 Web 门户——员工通过这些渠道向 Help Desk Agent 提交 IT 请求
          items:
            - Slack
            - Microsoft Teams
            - 电子邮件
            - Web 门户
        - label: 智能体智能层
          detail: 三个专门 AI 智能体各自有受限且预定义的范围——Help Desk 负责执行，Automation 负责代码生成，Insights 负责模式分析
          items:
            - Help Desk Agent（请求解决，仅限预先批准的工具）
            - Automation Agent（自然语言到代码的工作流构建器）
            - Insights Agent（模式分析和自动化建议）
        - label: 工作流与访问引擎
          detail: 确定性运行时执行存储在 Git 中的代码工作流，同时支持 JIT 访问开通和知识库 RAG 检索
          items:
            - 确定性代码工作流运行时
            - JIT 访问开通与取消开通
            - 知识库 RAG 检索
        - label: 分析与审计层
          detail: 展示解决率和 SLA 合规性的仪表盘；完整记录所有 AI 执行动作的审计轨迹，用于企业治理
          items:
            - 解决率仪表盘
            - SLA 合规跟踪
            - 所有动作的完整审计日志
        - label: 集成连接器层
          detail: 60+ 个连接器覆盖身份、HRIS、工单、开发工具和云平台——通过 Serval 维护的托管集成连接
          items:
            - 身份（Okta、JumpCloud、Microsoft Graph、Google Workspace、SCIM）
            - 工单（Jira、ServiceNow、Zendesk、Linear）
            - HR / HRIS 系统（Rippling、BambooHR、Ashby）
            - 开发工具（GitHub、AWS）
            - 总计 60+ 个连接器
        - label: 部署 / 基础设施层
          detail: 多数客户使用云托管 SaaS（99.9% SLA）；有数据驻留或隔离网络要求的企业可选择自托管 Kubernetes + Terraform
          items:
            - 云托管（99.9% SLA，托管，自动更新）
            - 自托管（Kubernetes + Terraform，客户管理）
    approximationNotes: 分层结构根据官方产品文档、定价页和 AUP 推断。LLM 提供商和底层云基础设施供应商未公开披露，因此省略。
