            title: 智能体 AI 架构承载已有记录的安全风险
            body: >
              独立安全研究人员（Acronis，Dark Reading 引用）已记录，「vibe coded programs」——也就是 Serval 使用的自然语言到代码自动化范式——会在 LLM
              到工具的接口处引入传统软件漏洞，包括认证绕过和访问控制不足。Serval 的双智能体架构和基于角色的访问控制可部分缓解这一点，但受监管行业或高敏感 IT 环境中的企业买家，在生产部署前应要求对 Serval
              的工具权限模型进行正式安全审查。
