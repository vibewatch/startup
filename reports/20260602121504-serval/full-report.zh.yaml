            body: >
              Serval 于 2025 年 12 月完成 Sequoia Capital 领投的 $75M Series B 后，达到 $1B post-money 估值。这次升值很醒目：PitchBook 引用 2025
              年 8 月的隐含估值为 $232M，同月公司披露收入增长 500%。到 2025 年 12 月——大约四个月后——Sequoia 领投的轮次按 $1B 定价，不到一个财季估值上升 4.3 倍。已披露累计融资为
