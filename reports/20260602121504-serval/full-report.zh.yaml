      - number: '3.4'
        title: 切换成本、护城河与竞争耐久性
        blocks:
          - type: paragraph
            body: >-
              2026 年的 ITSM 竞争格局，一边是在位厂商的耐久锁定机制，另一边是 AI 原生玩家正在形成的数据飞轮护城河。ServiceNow 的切换成本位居企业软件最高之列：客户要面对 CMDB
              迁移、自定义工作流重构，以及 ITIL 认证管理员再培训——这是一个多年、数百万美元级过程。Atlassian 通过跨产品依赖加深锁定：同时使用 Jira Software、Confluence 和 JSM
              的团队，退出成本会叠加。Serval 的护城河尚早，但结构上成立：其 150
              多个原生集成形成数据和工作流耦合，自动化数据集随着每个已解决工单累积，随时间提升模型准确性；没有同等部署历史的新进入者很难复制。Moveworks 的多租户 AI 模型基于客户通信历史训练，部署 12 到 18
              个月后会产生专有学习锁定。$19-billion-plus 的 ITSM 市场足够大，短期内多个 AI 原生玩家和在位厂商可以共存，而不会进入赢家通吃。Gartner 截至 2025 年将 AI
              Applications in ITSM 市场归为高流失、快速新进入者子细分，说明商品化压力会持续存在。Atomicwork 获得客户证言，被称为面向技术团队的 ServiceNow 替代方案，直接重叠
              Serval 的替代叙事，并带来渠道冲突风险。BMC Helix 的 Forrester Leader 认定证明在位厂商仍在大举投入 AI，威胁 Serval 的差异化窗口。Serval 的 SOC
              2、HIPAA 和 GDPR 认证在受监管行业提供护城河，因为 Atomicwork 和部分 AI 原生同业缺少同等资质。快速资本注入——Moveworks $200M Series C、Serval 累计
              $127M——加剧了同一可寻址 TAM 上的竞争。相对于 ServiceNow 的 23,000 多名员工，Serval 30 人团队在交付能力和合作伙伴支持上存在集中风险。
