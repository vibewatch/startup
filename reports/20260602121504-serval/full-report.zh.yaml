      - number: '5.4'
        title: 信任、安全与合规
        blocks:
          - type: paragraph
            body: >-
              Serval 文档列出的企业安全姿态包括：加密（传输中 TLS 1.3、静态 AES-256）、组织和团队层面的基于角色访问控制、对所有操作的全面审计日志、SOC 2 Type II
              认证，以及定期渗透测试。公司称设有 trust.serval.com Trust Center，但研究时该 URL 返回 404，说明页面可能仍在建设中，或 URL 已变更。AUP 将
              trust.serval.com 指定为 AI subprocessors 清单的权威位置。


              SOC 2 Type II 对企业销售是有意义的信任信号。它要求独立审计在一个监测期内审查安全性、可用性、处理完整性、保密性和隐私控制；一家不足 30
              人的公司取得该认证，说明其很早就优先投入合规基础设施。不过，公司没有公开认证函、范围定义或审计机构名称，SOC 2 覆盖范围无法验证。


              AUP 包含具体 AI 透明度承诺：AI 生成输出标记为「Serval AI」，以区别于人工撰写内容；Serval 维护 AI subprocessors 和模型提供商清单；未经明确授权，客户数据不会用于训练通用
              AI 或外部机器学习模型；可识别客户材料不会用于跨客户模型训练。这些承诺体现出公司意识到企业采购对 AI 数据治理的要求，但它们是合同承诺，不是独立审计控制。


              AUP 还要求对重大决策进行有意义的人工监督（第 4.2 节）：明确禁止「在没有有意义人工监督的情况下，对个人作出具有法律或类似重大影响的完全自动化决策」。这是产品层面的护栏，但不构成经认证的 AI
              安全机制。NIST AI 100-2（2025）将对抗性机器学习风险——包括提示词注入和数据投毒——列为智能体 AI 系统威胁；Serval
              的确定性工具门控方法缓解了动作执行层风险，但没有完全解决推理层的对抗性风险。


              公开资料中没有 bug-bounty 项目、已发布 CVE 披露或安全事件历史。对早期初创公司而言这很常见，但对企业安全评估者来说仍是尽调缺口。
