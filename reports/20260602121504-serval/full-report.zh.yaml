  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品套件与核心模块
        blocks:
          - type: paragraph
            body: >-
              Serval 将自己定位为统一的 AI 原生 ITSM 平台，组合三类功能界面：Help Desk、Access Management 模块和 Automation
              Engine。公司产品首页把该产品描述为部署在企业 IT 内部的「AI
              智能体劳动力」，可处理帮助台请求、发放有时限的访问权限、完成员工入职和离职流程，并用自然语言搭建工作流自动化。公司营销中列出五个明确能力区：Resolve Requests、Build
              Workflows、Transform Ticketing、Manage Access 和 Manage Assets。


              Help Desk 模块是面向用户的界面。员工通过 Slack、Microsoft Teams、电子邮件或网页门户交互。Serval 的 AI
              会根据请求内容和上下文路由工单，检索已连接知识库并带来源信息回答问题，执行自动化以在无需人工介入的情况下关闭常见请求，并在需要人工处理时携带完整上下文升级。公司提供与第三方系统的双向工单同步——具体包括
              ServiceNow、Jira 和 Zendesk——让企业迁移期间可将 Serval 与既有系统并行运行。


              Access Management 模块处理即时（JIT）权限发放、自动撤权、审批工作流定制、访问配置限制，以及与身份提供商的 SCIM
              集成。根据定价页面，访问策略可细化到最小权限规则、多审批人关卡和有时限授权。Serval 也列出 SCIM 权限发放，以及基于 Terraform/API 的自定义发放能力。


              Analytics and Insights 界面提供请求量、AI 解决率、解决时长和 SLA 合规性的仪表盘。Insights Agent 还会分析工单模式，挖出自动化机会，并建议知识库更新——Serval
              文档称之为「把自动化本身自动化」。


              第五个界面 Asset Management 在首页作为命名能力出现，但公开文档没有给出实质性描述，其成熟度仍不清楚。
