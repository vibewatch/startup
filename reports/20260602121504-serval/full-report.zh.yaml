      - number: '2.2'
        title: TAM、SAM 与 SOM 测算视角
        blocks:
          - type: paragraph
            body: >-
              最宽口径的 ITSM TAM 来自 MarketsandMarkets，其预计全球 ITSM 市场到 2028 年将达到 $22.1 billion，以 2023 年为基准，复合年增长率为
              15.9%。该数字覆盖所有垂直行业和组织规模的本地部署与云 ITSM 解决方案，包括服务台软件、变更和配置管理、运营与性能管理以及 IT 资产管理。同一数据源预计 AIOps 平台市场到 2028 年将达到
              $32.4 billion，CAGR 为 22.7%，反映的是更广义的 AI-in-IT-operations 空间，包含纯 ITSM 之外的可观测性、事件关联和自动化工具。

              更窄的视角是云 ITSM 子市场，它与 Serval 产品最直接相关。MarketsandMarkets 另行预计，云系统管理（包含 ITSM、ITOM 和 ITACM）将从 2020 年的 $10.6
              billion 增长到 2025 年的 $31.4 billion，对应 CAGR 24.1%。这一增长率强化了 ITSM 向 SaaS 交付迁移的趋势，而 Serval
              的云原生和自托管部署模式正面向这一趋势。Freshservice 公开披露的 74,000+ 企业客户数提供了需求侧交叉验证：它说明中型市场 ITSM 已经是成熟且广泛采用的类别，要替换
              incumbent，必须有足够有说服力的差异化故事。

              Serval 的 SAM 最适合通过把 ITSM 市场筛到 AI 原生、具备高自动化潜力的部署来估算。基于 Serval 当前客户画像（快速增长的技术公司、50–2,000 名员工），SAM 很可能只是整体
              ITSM 市场的一部分，今天或许为 $2–4 billion，并随着 AI 原生 ITSM 替代以工作流为中心的前代产品而以 30%+ 增长。SOM
              未见公开记录，也无法从现有证据中分离；本报告将其视为开放测算缺口。公开估计中的关键矛盾包括：ITSM 头部数字（$22.1B，窄口径软件）与云系统管理数字（$31.4B，定义更宽）之间的差距，以及 AIOps
              数字（$32.4B）包含 Serval 并不覆盖的可观测性和事件管理。
