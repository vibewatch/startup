            body: >
              Serval 披露的客户名单数量不多，但经过战略筛选，在 AI 和开发者工具社区中能最大化释放可信度信号。公司首页页脚列出四家公司——Perplexity、Together.ai、Mercor 和
              Cribl——Sequoia 的 Serval 组合页面则独立扩展至 Vercel 和 Verkada。TechCrunch 的 Series A 文章以及 Reuters/USNews 的 Series B
              报道又为 Perplexity、Mercor 和 Together AI 提供独立第三方印证。七家客户都是有风投支持的技术公司，员工规模从约 50 人到数百人不等；没有上市公司、Fortune
              500、受监管金融机构、政府机构或传统企业客户。客户名单覆盖多个子赛道：AI 推理平台（Perplexity、Together
              AI）、开发者平台（Vercel）、上市营销数据工具（Mercor、Clay）、可观测性与数据路由（Cribl），以及实体安全技术（Verkada）。Perplexity 和 Together AI 是当前 AI
              基础设施浪潮中最受关注的名字之一，为 Serval 在风投支持生态中提供强社会证明。Vercel 和 Verkada 将可信度延伸到纯 LLM 空间之外，说明平台可能处理硬件相邻和基础设施规模公司的 IT
              工作流。公司没有披露来自受监管垂直领域——医疗、金融服务、保险、政府——的客户，这限制了企业风险买家在合规密集环境中评估完整 ITSM 替换时可依赖的证据基础。
