        - 确认增长减速；暗示 ARR 轨迹进入基准或熊市；此前独角兽标记失效
        - 转为回避；不建议追加资本部署
      - - 关键客户流失
        - Perplexity、Vercel 或 Verkada 在 2026 年底前公开离开 Serval 平台
        - 削弱具名客户证明；引发对自动化保证交付和竞争胜率的质疑
        - 调查原因；索取 NRR 数据；进一步承诺前跟踪新 logo 速度
    notes: |
      触发项是基于公开可观察条件的定性评估。阈值定义为指示性，可能需要根据私有 data room 发现调整。所有动作含义都假设 Series B 或后期投资人视角。
    claimRefs:
      - CV032
      - CV033
      - CV030
    sourceRefs:
      - SV009
      - SV027
      - SV022
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - ARR 与收入质量
        - 当前 ARR、上一季度 ARR，以及 2025 年 8 月以来逐月收入进展
        - 500% 增长声明没有公开美元锚点；估值倍数无法计算或对标
        - 要求 data room — ARR 瀑布、收入确认政策、按客户签约日期的 cohort 进展
      - - 毛利率与单位经济
        - 软件与专业服务毛利拆分；按 cohort 的 CAC、LTV、NRR 和回本期
        - 高接触入职模式可能把毛利率压到 80% 以下；自动化 SLA 信用敞口未知
        - 索取财务报表；带服务成本分摊的详细 P&L；NRR 调节表
      - - 现金状况与 burn
        - 2025 年 12 月 Series B 后的现金余额和月度 burn rate；基准和熊市场景下的 runway 预测
        - 到 2026 年底人数扩至 100+ 会显著加速 burn；必须验证资本充足性
        - 索取资金报告；带季度现金预测的经营模型；CFO 对 runway 签字确认
      - - 法人实体与监管申报
        - 实体结构（美国 Delaware vs. 离岸控股公司）；所有 Regulation D 豁免通知或等效文件副本
        - EDGAR 未显示 Serval, Inc. 的 Form D；按美国证券法，这是尽调升级项
        - 聘请法律顾问；索取公司章程；所有投资人认购协议和豁免通知
    notes: |
      所有尽调问题都来自公开识别的证据缺口；每一项都需要私有 data room 权限才能解决。优先级列反映投资决策的阻断顺序：ARR 必须先解决。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV042
    sourceRefs:
      - SV001
      - SV020
