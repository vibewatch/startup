  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 智能体 AI 可靠性与安全风险
        blocks:
          - type: paragraph
            body: >-
              Serval 的核心产品——一个可自主发放访问权限、解决 IT 工单并编排企业工作流的 AI 智能体——带来的风险画像与传统 SaaS 工具有质的不同。当 AI
              智能体能够以用户身份认证、创建访问授权并修改审计日志时，故障爆炸半径远高于基于表单的工作流工具。安全研究人员已经给出具体案例：一名研究人员发现，一个权限过宽的 ServiceNow
              聊天机器人只受出厂默认凭证保护，只要提供任意用户的电子邮件地址即可完成认证，从而获得在任何公司 ServiceNow 实例中创建强大 AI 智能体的权限。另一个演示显示，通过支持工单投递的漏洞利用——类似 IT
              帮助台请求——大约 47 秒内就能提升权限、访问客户记录、外传数据，并修改审计日志掩盖痕迹。这些事件直接适用于 Serval，因为支持工单正是其主要输入通道。


              Acronis 研究人员发现，智能体 AI 漏洞主要不是由 AI 模型缺陷造成，而是由连接 LLM 与企业工具的确定性软件层中的经典软件错误造成——缺少输入清洗、硬编码凭证和访问控制不足。NIST AI
              100-2 E2025 将这一威胁面编入对抗性机器学习攻击分类，覆盖提示词注入、数据投毒、模型规避和模型提取。Serval 的双智能体架构把 Help Desk Agent
              限制为只能使用预先授权工具，这是有意义的设计层控制，但无法消除授权范围配置错误或集成被攻破的风险。公司 150+ 原生集成连接带特权的身份系统（Okta、Google
              Workspace、GitHub、AWS），意味着攻击面会随采用扩大。CISA 在 2026 年针对企业环境中谨慎采用智能体 AI 服务发布具体指南，说明监管共同体已将这一风险类别识别为实质性风险。
