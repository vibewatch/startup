  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 展示 Serval 的主要风险事件如何传导为投资论点层面的后果；节点代表风险事件，边代表因果连接。
    data:
      nodes:
        - id: ai_exploit
          label: AI 安全漏洞经支持工单触发
          detail: 提示注入或凭证漏洞攻破 Help Desk Agent
          tone: negative
        - id: access_misprovisioning
          label: 未授权 IT 访问被授予
          detail: AI agent 在授权范围外开通访问，或把访问授予错误身份
          tone: negative
        - id: sla_breach
          label: 自动化 SLA 违约（低于 50%）
          detail: AI 自动化率跌破合同保证阈值
          tone: warning
        - id: reg_action
          label: 监管执法行动
          detail: 访问决策失败触发 GDPR、CCPA 或 EU AI Act 执法
          tone: negative
        - id: customer_churn
          label: 企业客户流失
          detail: 安全或 SLA 事件后，参考客户终止合同
          tone: negative
        - id: ceo_departure
          label: CEO 离任（Jake Stauch）
          detail: 唯一具名 C-suite 高管在 Series C 完成前离开
          tone: risk
        - id: down_round
          label: Down round 或 Series C 失败
          detail: 估值下调，或下一轮融资失败
          tone: negative
        - id: thesis_break
          label: 投资论点破裂
          detail: 多起事件叠加削弱竞争位置和投资人信心
          tone: negative
      edges:
        - from: ai_exploit
          to: access_misprovisioning
          label: 漏洞导致错误开通
        - from: access_misprovisioning
          to: reg_action
          label: 自动化决策触发 GDPR / EU AI Act 审查
        - from: access_misprovisioning
          to: customer_churn
          label: 安全事件触发企业客户流失
        - from: sla_breach
          to: customer_churn
          label: 合同 SLA 违约触发终止权
        - from: reg_action
          to: customer_churn
          label: 监管行动加速受监管垂直行业客户流失
        - from: customer_churn
          to: down_round
          label: 收入损失迫使估值下调
        - from: ceo_departure
          to: down_round
          label: 关键人离任压低投资人信心和 Series C 可选性
        - from: down_round
          to: thesis_break
          label: Down round 释放基本面恶化信号
    claimRefs:
      - CR002
      - CR005
      - CR012
      - CR016
      - CR031
      - CR033
      - CR042
