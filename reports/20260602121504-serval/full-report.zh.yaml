  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与定价可见度
        blocks:
          - type: paragraph
            body: >
              Serval
              在公开定价页上呈现「一个平台费，没有意外收费」定价模型，但未公布实际价格卡。所有购买都需要预约销售演示，所有部署都从带专属部署工程师的引导式试点开始。四阶段入职序列——Meet、Build、Deploy、Optimize——意味着高接触、服务辅助的激活模式，更像中型市场和企业软件厂商，而不是产品驱动增长公司。Serval
              公开保证 50% 的 IT 工单自动化率，这是一个异常大胆的商业承诺，也说明其销售动作以绩效为锚，而不是纯使用量或席位模式。

              产品集成 60 多种企业工具，包括 Okta、Google Workspace、GitHub、Jira、Slack、Freshservice 和
              ServiceNow。这一广度意味着先落地再扩张模型：初始部署覆盖一个工作流，随后随时间扩展到更大的 IT 表面。双智能体架构——一个智能体理解 IT
              请求，一个智能体执行动作——是自动化保证的技术基础，但该架构如何转化为确认收入，商业层面并不公开可见。年订阅合同有暗示但未确认。未披露按席位、按坐席或按用量定价层级。没有价格卡、毛利率或合同条款，定价权仍只是从投资人信心中推断，而不是可衡量的商业事实。
