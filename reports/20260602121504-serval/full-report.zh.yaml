            body: >-
              员工数不到 30 即取得 SOC 2 Type II 认证并不常见，反映出公司早期就有意投入合规基础设施——很可能是为了拿下 Perplexity、Together AI 等 AI
              前沿企业交易，因为这些客户本身也面临合规要求。这让 Serval 在企业采购对话中相较更早期竞争者拥有可信度优势，但认证范围和审计机构仍未披露。
