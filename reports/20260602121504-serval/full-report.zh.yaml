      - number: '6.4'
        title: 扩张动力与集中度风险
        blocks:
          - type: paragraph
            body: >
              Serval 的 land-and-expand 逻辑有两条可见路径：从 IT 部门扩展到 HR、法务和财务；以及加深与 60+ 企业工具的集成。Reuters 明确报道了部门扩张，Serval
              集成页面也确认了受支持工作流界面的广度。四阶段 onboarding 旨在随时间加深部署，Insights Agent
              模块会明确给出配置建议，推动新增工作流——这是扩张收入的结构性机制。不过，没有客户公开披露跨部门使用，也没有 upsell 或扩张 ARR 指标。集中度风险显著：七家命名客户均为风投支持公司，并且与 Serval
              自身一个或多个投资方共享投资人关系。Perplexity 是 Sequoia 组合公司，而 Sequoia 正是 Serval Series B 领投方。领投 Serval Series A 的
              Redpoint，也与 Serval 投资人基础共同投资了多家命名客户。这种共同投资重叠在紧密的 AI 初创生态中很常见，但会形成推荐网络动态；当 Serval
              需要从投资人组合之外获取客户时，这种动态未必能持续。没有披露任何 Fortune 500、中端市场或受监管行业客户，是商业画像中最重要的单一缺口；在补上之前，Serval 的增长故事依赖于在一个相对同质、与 VC
