      - number: '5.6'
        title: 图表
        blocks:
          - type: callout
            title: 双智能体安全架构回应企业最大的 AI 担忧
            body: >-
              Serval 有意把工具构建（Automation Agent，仅管理员）与工具执行（Help Desk Agent，面向员工）分开，这是对「失控 AI」风险的原则性架构回答，而这一风险正是企业采用智能体 AI
              的主要障碍。Help Desk Agent 被限制在预先批准、确定性的工具集合内，Serval 在不牺牲自动化广度的前提下缩小爆炸半径。这是真正的产品护城河，在既有拖拽式 ITSM 工具中比在全新 AI
              原生设计中更难复制。
            calloutType: strength
            claimRefs:
              - CE010
              - CE011
              - CE012
          - type: callout
            title: LLM 提供商依赖未缓解且未披露
            body: >-
              Serval 整个产品栈建立在一个或多个第三方 LLM API 之上，但提供商身份、合同 SLA 和故障切换策略均未公开披露。企业采用 Serval，等于间接押注未知 LLM
              提供商的可用性、定价、数据处理和模型演进决策。一个处理访问发放和员工数据的系统承担这种依赖，就是实质性的集中风险。没有文档显示 LLM 层存在多提供商冗余、本地模型兜底或 SLA 透传。
            calloutType: risk
