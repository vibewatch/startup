      - number: '1.6'
        title: 里程碑时间线与反向检查
        blocks:
          - type: paragraph
            body: >-
              Serval 的公开记录覆盖从创立到成为独角兽的大约两年。截至报告日期，公开记录中未发现针对
              Serval、其创始人或具名高管的监管行动、法律程序、制裁或执法行动。公开材料中未出现产品宕机、安全事件或数据泄露通知。任何公开来源中也未发现裁员或已报道的领导层离职。


              主要反向尽调点是结构性的，而非事件驱动：公司披露 500% 增长时拒绝给出绝对收入；在员工不足 30 人、没有公开财务验证的情况下获得独角兽身份；确认客户名单局限于技术公司，没有公开的 F500
              或受监管行业参考客户；其核心竞争论点（替换 ServiceNow 及类似在位厂商）将持续面对 ServiceNow 自身 AI 智能体产品发布的竞争。Gartner Peer Insights 的 AI ITSM
              市场列出了既有厂商已验证的企业部署，Serval 缺席这一验证轨道，对受监管或大型企业买家构成实质企业信任缺口。


              公开材料中未出现已知创始人利益冲突、未决诉讼或 FINRA/SEC 相邻问题。招聘页面将创始团队描述为「精英 builder
              和销售团队」，符合一家扩张前、正在招聘的初创公司状态。公司融资节奏极快、独角兽叙事激进，这些高风险声誉承诺会放大任何执行失误的后果。
