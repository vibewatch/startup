      - number: '3.3'
        title: 定价、定位与 GTM
        blocks:
          - type: paragraph
            body: >-
              ITSM 市场定价跨度很大，从公开的按席位 SaaS 层级，到完全不透明的企业合同。Freshservice 最透明：四个公开层级从每坐席每月 $19 到 $99，支持自下而上的 PLG 采用。Atlassian
              JSM 为最多三名坐席提供免费层级，Premium 扩展到每坐席每月 $44.27。Zendesk Suite 以每坐席每月约 $55 锚定中型市场入口。Atomicwork
              跳出按席位定价，Professional 方案为每员工每年 $90——这是面向技术团队的总拥有成本话术，因为所有员工都可能是服务请求者。ServiceNow 和 Moveworks
              不公布标价；定制企业合同估计分别从每年 $200,000 和 $250,000 以上起。Aisera 定制报价，最低承诺 12 个月。Serval 不公布定价；其 GTM 瞄准
              Perplexity、Together.ai、Mercor 和 Cribl 等高速技术公司——这些 AI 优先组织看重自动化率保证，超过功能广度。TechCrunch 2025 年 10 月的 Series A
              报道明确把 Serval 描述为 ServiceNow 替代品，这会提高 ServiceNow 企业销售团队的竞争关注。ServiceNow 的分销依赖 7,500 个合作伙伴生态和认证实施伙伴——这是
              Serval 以 30 名员工无法复制的结构性渠道优势，在 5,000 人以上企业细分中形成不对称分销挑战。
