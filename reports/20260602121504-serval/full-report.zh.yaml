      - number: '8.5'
        title: 尽调要求与投资逻辑失效触发点
        blocks:
          - type: paragraph
            body: >
              公开证据不足以支撑该估值承销。五项非公开披露可以补上尽调缺口：（1）当前 ARR，以及自 2025 年 8 月以来的队列级推进，用来锚定 500%
              增长主张；（2）软件订阅与专业服务入职实施的毛利率拆分，因为高接触试点模式可能把毛利率压到 80% 以下；（3）按客户批次拆分的净留存率，验证先落地后扩张逻辑；（4）Series B
              后烧钱速度与现金跑道，确认资本足以支撑计划中的员工数翻三倍；（5）法律实体架构，以及所有 Regulation D 豁免通知或等效境外证券文件副本。

              投资逻辑主要在两个条件下失效。第一，ServiceNow 打包事件：12 个月内 Now Assist 对现有 ITSM 客户改为零增量成本，这会立刻把 Serval 可触达的商业窗口收窄到尚未签
              ServiceNow 合同的公司。第二，客户环境发生安全事件，并被公开归因于 Serval 的智能体 AI 架构；在企业 IT 采购里，信任损害会远大于任何财务整改成本。次级失效条件包括：Series C
              持平或下轮估值（确认增长放缓）、失去 Perplexity 或 Verkada 等关键具名客户，以及创始团队在 2026 年关键扩张期离开。TechCrunch Startups Weekly 2026 年 5
              月把 Serval 与 Atomicwork、Moveworks 并列为三家值得关注的 AI 原生 ITSM 厂商，进一步说明竞争强度很高，执行纪律不可妥协。
