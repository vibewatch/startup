  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: |
      建议链条从市场和证据信号出发，经过风险和估值过滤，落到 Track 决策。Sequoia 信念和市场规模是正向因素；收入不透明、监管异常和 ServiceNow 捆绑风险阻止给出完整买入建议。
    data:
      nodes:
        - id: market_signal
          label: 市场信号——正向
          detail: 2024 年 ITSM 市场 $11–13B，预计到 2029–2032 年达 $22–29B；AI-native 子细分增长最快；Sequoia 一线背书。
          tone: positive
        - id: proof_signal
          label: 证据信号——窄
          detail: >-
            七个具名 tech-native 客户（Perplexity、Vercel、Verkada、Clay、Cribl、Mercor、Together AI）；500% 增长说法没有美元数锚点；没有 Fortune 500
            或受监管行业 logo。
          tone: neutral
        - id: risk_signal
          label: 风险信号——升高
          detail: >-
            未披露 ARR 或毛利率；EDGAR 没有 SEC Form D；ServiceNow Now Assist 捆绑威胁；Dark Reading / Acronis 记录了 agentic AI 安全漏洞；Axios
            报道 LP 审视难以核验的 AI 估值。
          tone: risk
        - id: valuation_signal
          label: 估值信号——昂贵
          detail: $1B 估值对应隐含 33–83x ARR 倍数，取决于无法验证的收入基数；4 个月内估值抬升 4.3x；没有独立 ARR 审计；从 Series B 进入的基准情形回报持平至为负。
          tone: warning
        - id: recommendation
          label: 建议——Track
          detail: >-
            监控 2026 年 5–12 月 ARR 里程碑；要求进入私有 data room；待 ARR 和 NRR 披露后重看建议。只有牛市情形才买入：ARR > $35M、NRR > 130%，且没有 ServiceNow
            捆绑事件。
          tone: neutral
    claimRefs:
      - CV001
      - CV017
      - CV026
      - CV037
    sourceRefs:
      - SV009
      - SV010
      - SV013
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: |
      在六种 ARR 情景下，用固定 33x ARR 倍数反推 $1B Series B 标记对应的隐含估值。敏感性显示，无法验证的收入基数会让隐含倍数大幅摆动。
    data:
      items:
        - label: $5M ARR → 隐含 200x 倍数
          value: 200
        - label: $10M ARR → 隐含 100x 倍数
          value: 100
        - label: $15M ARR → 隐含 67x 倍数
          value: 67
        - label: $25M ARR → 隐含 40x 倍数
          value: 40
        - label: $40M ARR → 隐含 25x 倍数
          value: 25
        - label: $60M ARR → 隐含 17x 倍数
          value: 17
    approximationNotes: |
      所有 ARR 数字都是推断情景；Serval 未公开披露 ARR。y 轴代表 $1B Series B 投后估值下的隐含收入倍数。若要达到 25x 倍数，需要约 $40M ARR，符合牛市情形，但公开数据尚无法验证。
    claimRefs:
      - CV017
      - CV018
      - CV019
    sourceRefs:
      - SV010
      - SV016
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: |
      从 Series B 进入点（$1B）到 2027–2028 年流动性事件，Serval 的三情景退出估值区间。牛市情形产生温和正回报；基准情形持平至为负；熊市情形深度为负。
    data:
      items:
        - label: 牛市情形——2028 年退出估值（$B）
          low: 1.25
          mid: 1.5
          high: 1.8
          displayValue: $1.25–$1.8B
          detail: 要求到 2026 年 12 月 ARR 达 $40–60M、NRR 150%+，并完成垂直扩张。以 $50M 中点按 25–30x ARR 倍数计。相对 Series B 进入点回报 1.3–1.8x。
          tone: positive
        - label: 基准情形——2028 年退出估值（$B）
          low: 0.5
          mid: 0.65
          high: 0.9
          displayValue: $500M–$900M
          detail: >-
            到 2026 年 12 月 ARR 为 $20–35M，NRR 120%，仅限 tech-native。以 $28M 中点按 20x ARR 倍数计。相对 Series B 进入点回报持平至
            0.9x——最多保住本金。
          tone: neutral
        - label: 熊市情形——2028 年退出估值（$B）
          low: 0.1
          mid: 0.2
          high: 0.3
          displayValue: $100M–$300M
          detail: >-
            ServiceNow 免费捆绑 AI ITSM，Serval 只达到 $10–15M ARR。以 $12M 中点按 12–15x ARR 计。回报 0.1–0.3x——相对 Series B 进入点亏损
            70–90%。
          tone: negative
    approximationNotes: |
      所有情景 ARR 数字均为估计。退出倍数参考 2024–2025 年上市 SaaS 可比公司交易。回报为扣除管理费、carry 和优先权结构前的总回报——LP 净回报会更低。
    claimRefs:
      - CV037
      - CV038
      - CV039
    sourceRefs:
      - SV009
      - SV010
      - SV016
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: |
      截至 2026 年 6 月，Serval 在六个投资维度上的 IC-ready 打分。市场和投资人质量得分高；证据质量和估值纪律得分低，原因是私有证据缺口。
    data:
      items:
        - label: 市场机会
          value: High
          detail: 2024 年 ITSM 为 $11–13B，预计到 2029–2032 年达 $22–29B；按 4 份独立分析师报告，AI-native 子细分增长最快。
        - label: 投资人质量
          value: High
          detail: Sequoia Capital 领投；Redpoint 共同投资；General Catalyst 和 First Round 参投——一线企业软件辛迪加。
        - label: 产品差异化
          value: Medium
          detail: 双 agent 架构和 50% 自动化保证在运营上可信，但尚未在企业规模验证。
        - label: 收入证据
          value: Low
          detail: 500% 增长说法没有 ARR 锚点；七个 tech-native 客户被点名；没有 Fortune 500 或受监管行业 logo。
        - label: 估值纪律
          value: Low
          detail: 隐含 33–83x ARR 倍数位于早期 SaaS 顶部十分位；从 $1B 进入时，熊市情形回报深度为负。
        - label: 证据质量
          value: Low
          detail: 公开域没有 ARR、利润率、烧钱速度、NRR 或监管文件；四个重大 evidenceGaps 需要进入私有 data room。
    claimRefs:
      - CV001
      - CV014
      - CV017
      - CV021
      - CV029
    sourceRefs:
      - SV002
      - SV013
      - SV016
