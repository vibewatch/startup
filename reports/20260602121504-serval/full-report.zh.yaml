      - number: '7.2'
        title: 监管、合规与法律风险
        blocks:
          - type: paragraph
            body: >-
              Serval 位于企业软件与重大自动化决策的交汇处，而这一组合正受到越来越多监管。欧盟 AI Act 于 2024 年 7 月 12 日刊登在 Official Journal，对作出或影响重大决策的 AI
              系统施加有约束力的透明度和人工监督要求。自动化 IT 访问发放和员工离职决策，在具体部署语境和欧盟监管解释下，可能落入 Annex III 就业类别的高风险应用。GDPR Article 22
              也独立限制对个人产生法律或类似重大影响的完全自动化决策，要求有意义的人工介入。Serval 自身 AUP 通过禁止「在没有有意义人工监督的情况下，对个人作出具有法律或类似重大影响的完全自动化决策」，并要求在依赖
              AI 生成建议作出重大决策前进行「合格人工审查和批准」，承认了这一约束；这是自我限制条款，可部分缓解但不能消除监管风险。


              研究中出现一个实质性治理异常：尽管 Serval 披露约 $127M 风险融资（$47M Series A、$75M Series B），但在 2025 年至运行日期间，EDGAR 中未找到 Serval 的
              SEC Form D 文件。根据 Regulation D，进行私人证券发行的公司通常必须在首次销售后 15 天内提交 Form
              D。没有任何文件，要么是需要纠正的疏漏，要么说明这些发行使用了其他豁免结构；无论哪种情况，尽调中都应具体询问。CISA 2026 年关于谨慎采用智能体 AI 服务的指南，也为关键基础设施行业中可能成为
              Serval 客户的企业买家增加监管压力层，从而给销售流程带来间接合规开销。
