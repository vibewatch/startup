      - number: '6.5'
        title: 图表
        blocks:
          - type: callout
            title: Sequoia 的 ServiceNow 对比是最强单一证明点
            body: >
              Sequoia 合伙人 Anas Biad 公开表示——「我们上一次听到这么强的客户反馈，还是 16 年前与 ServiceNow 合作的时候」——这种表态对风险阶段背书而言异常直接。ServiceNow
              如今是一家 $170B+ 公司。尽管 Biad 不是独立方，但 Sequoia 在领投 $75M、估值 $1B 的轮次前做过客户尽调；这句话意味着尽调发现了与早期 ServiceNow
              模式一致的定性反馈。这是目前公开记录中衡量企业客户满意度的最佳代理指标。
            calloutType: strength
            claimRefs:
              - CU016
              - CU003
          - type: callout
            title: 所有命名客户都贴近 VC 初创生态——尚未证明企业跨越
            body: >
              每一家已披露 Serval 客户本身都是风投支持的技术公司。七家中六家与 Serval
              自身投资方共享投资人关系。这形成了推荐网络动态，对早期牵引有价值，但无法作为规模化后的主要增长渠道持续。没有任何受监管行业、Fortune 500 或中端市场买家，使外界无法有意义地推断 Serval
              能否在不共享其投资人和文化 DNA 的环境中穿过采购、合规与变更管理周期。
