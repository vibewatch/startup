  productSummary: >-
    Serval's platform combines five modules — help desk/ticketing, workflow automation,
    access management, asset management, and an AI copilot for escalated tickets — under a
    two-agent architecture. The Help Desk Agent handles employee requests via Slack, Teams,
    email, or web portal by calling pre-approved deterministic tools; the Automation Agent
    lets IT admins build those tools in natural language and stores them as versioned code.
    A third Insights Agent surfaces automation opportunities from ticket patterns. Serval
    publicly guarantees a 50% IT-ticket automation rate, supports 60+ native integrations,
    and offers cloud, hybrid, and fully self-hosted deployments with SOC 2 Type II, HIPAA,
    and GDPR compliance.
  customerFocus: >-
    Technology-native companies and venture-backed scale-ups with complex IT automation
    needs; current named customers are all in the AI/software sector. The platform is
    positioned for mid-market to enterprise buyers seeking full ITSM replacement or an
    AI-layer overlay on existing systems.
  businessModel: >-
    Enterprise SaaS with custom, quote-only pricing and a high-touch onboarding model
    (dedicated deployment engineer, four-phase activation). Annual subscription contracts
    are implied but unconfirmed. A 50% ticket-automation guarantee anchors the commercial
    pitch. No pricing floor, gross margin, or unit economics are publicly disclosed.
  stage: Series B private company
  fundingStatus: >-
    Closed a $75M preemptive Series B in December 2025 at a $1B post-money valuation led
    by Sequoia Capital, with Redpoint Ventures, Meritech Capital, and General Catalyst
    returning. Series A of $47M closed in October 2025, led by Redpoint with a broad
    co-investor syndicate. Total disclosed funding: $127M.
