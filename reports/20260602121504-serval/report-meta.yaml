companyProfile:
  summary: >-
    Serval is a 2024-founded San Francisco-based AI-native ITSM startup that deploys two
    cooperating AI agents — a Help Desk Agent and an Automation Agent — to automate ticket
    resolution, just-in-time access provisioning, employee onboarding, and offboarding for
    enterprise IT teams. In October 2025 the company raised a $47M Series A led by Redpoint
    Ventures, and just seven weeks later Sequoia Capital led a preemptive $75M Series B at a
    $1B post-money valuation, bringing total disclosed funding to $127M. The company publicly
    claims 500% revenue growth between August and December 2025 but has not disclosed an
    absolute ARR figure. Named customers include Perplexity, Together AI, Mercor, Vercel,
    Verkada, Clay, and Cribl — all technology-native companies. Headcount was approximately
    30 at Series B close, with a stated plan to exceed 100 employees by end of 2026.
