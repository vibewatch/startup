  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: case-studies
      missingEvidence: >
        At least one independently authored customer case study confirming production deployment,
        use case specifics, measured outcomes, and time-to-value for a named Serval customer.
      whyItMatters: >
        Enterprise buyers and diligence analysts require customer-authored proof to evaluate
        claims of 50%-plus ticket automation. Without case studies, all performance claims
        rest solely on company and investor statements.
      diligencePath: >
        Request Serval to provide at least two reference customers willing to participate in
        a 30-minute diligence call; ask for written case study authorization; check if
        serval.com/case-studies is planned for relaunch.
      relatedQuestionRefs:
        - QU003
        - QU014

    - type: missing-source
      severity: material
      topic: reviews
      missingEvidence: >
        Third-party platform reviews on G2 or Gartner Peer Insights that independently corroborate
        (or challenge) Serval's automation performance claims and customer satisfaction levels.
      whyItMatters: >
        The complete absence of third-party reviews means no independent signal exists on user
        experience quality, support responsiveness, or automation reliability outside Serval's
        own communications.
      diligencePath: >
        Encourage design partner customers to post anonymous reviews on G2; monitor Gartner
        Peer Insights for new entries in the "AI Applications in IT Service Management" category;
        schedule diligence calls with at least three customer references.
      relatedQuestionRefs:
        - QU019

    - type: private-evidence-only
      severity: material
      topic: retention-gaps
      missingEvidence: >
        Any disclosed metric for net revenue retention, gross revenue retention, customer count,
        or annual contract value that would allow quantitative assessment of customer durability.
      whyItMatters: >
        Without NRR or customer count, the 500% revenue growth claim cannot be decomposed into
        logo growth vs. expansion revenue, making the quality of growth (durable vs. one-time)
        unassessable.
      diligencePath: >
        Request NRR, GRR, customer logo count, and average ACV from Series C data room; compare
        against ITSM SaaS benchmarks (NRR 110–130% for top performers).
      relatedQuestionRefs:
        - QU002
        - QU006
        - QU013

    - type: enumeration-incomplete
      severity: material
      topic: named-customers
      missingEvidence: >
        The full customer list beyond the seven publicly named accounts, including any enterprise,
        mid-market, or regulated-industry customers that may exist but have not been publicly
        disclosed.
      whyItMatters: >
        If Serval's total customer base numbers only 7–15 logos, the 500% revenue growth claim
        implies either very large per-customer ACV or very high concentration in a few accounts —
        either of which represents a significant risk profile.
      diligencePath: >
        Request total customer count and breakdown by industry, size, and deployment mode;
        ask for the proportion of pipeline sourced outside the Sequoia/Redpoint co-investor
        network.
      relatedQuestionRefs:
        - QU011
        - QU024
      relatedTableRefs:
        - TU003

    - type: missing-source
      severity: minor
      topic: competitive-win-rate
      missingEvidence: >
        Serval's win rate in competitive ITSM sales cycles against ServiceNow, Freshservice,
        Moveworks, and Atomicwork, and the average deal size for each competitive scenario.
      whyItMatters: >
        Without win-rate data, it is impossible to assess whether Serval's growth comes primarily
        from net-new budget (greenfield AI deployments) or from displacement of incumbents.
      diligencePath: >
        Request CRM pipeline data showing competitive deals, win/loss rate, and average sales
        cycle length; interview recent lost-deal customers where Serval was displaced.
      relatedQuestionRefs:
        - QU008
        - QU025
        - QU027

