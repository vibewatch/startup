  - id: adoption-trajectory
    title: Adoption Trajectory and Deployment Evidence
    body: >
      The most striking commercial signal is Serval's 500% revenue growth between August and December
      2025, reported directly by Reuters and confirmed by the company. That a $1B valuation followed
      just three months after a $232M valuation implies that investors saw not just a growth rate but
      an accelerating trajectory. Sequoia partner Anas Biad's comment — that Serval generated the
      strongest customer feedback Sequoia had heard since partnering with ServiceNow 16 years earlier —
      is the most powerful third-party endorsement in the record, though it comes from an investor with
      a direct financial stake. The 50% day-one ticket automation rate appears on three independent
      surfaces: the Serval homepage, the Sequoia portfolio page, and the Reuters article. That triple
      citation from official, partner-proof, and independent-news sources raises confidence in the
      metric's existence, though not in its methodology or whether it is contractually guaranteed or
      merely observed on average.

      Serval's go-to-market offers two paths: full rip-and-replace of existing ITSM systems, and an
      AI-layer deployment that sits on top of legacy platforms for customers locked into multi-year
      contracts. This flexibility is commercially significant because it lowers initial procurement
      friction for prospects who cannot immediately exit ServiceNow or Freshservice. The four-phase
      customer onboarding (Meet, Build, Deploy, Optimize) is documented in the company's pricing page
      and implies a structured, services-assisted activation model rather than a self-serve trial.
      The speed from the Series A to the Series B in under 90 days is itself an indirect adoption
      signal: investors accelerated their commitment based on the customer traction data they
      observed in the intervening period.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
      - CU016
      - CU021
      - CU030
      - CU038
    tableRefs:
      - TU002
    figureRefs:
      - FU002

  - id: customer-proof-quality
    title: Customer Proof Quality and Retention Gaps
    body: >
      Despite the strong adoption signals, Serval's customer proof quality is thin by enterprise
      diligence standards. The company's case study pages for Perplexity and Together AI both return
      HTTP 404, and the /customers page is also unreachable, meaning no independently authored
      case study content is publicly available. The single testimonial on record — Vernon Man, Head
      of IT, describing 50-plus percent automation — does not identify the company he represents,
      making it impossible to cross-verify. Gartner Peer Insights shows no listed reviews for Serval
      in its "AI Applications in IT Service Management" category, and no G2 reviews were found,
      both consistent with a company founded in 2024 that has not yet prioritized third-party review
      platforms. No net revenue retention, gross revenue retention, churn rate, customer count,
      annual contract value, or lifetime value has been disclosed in any public source.

      The security dimension adds a layer of operational risk for would-be buyers. Researchers at
      Acronis, cited in Dark Reading, demonstrated that agentic AI platforms — including "vibe coded
      programs" with the same architecture Serval uses — carry traditional software vulnerabilities
      at the interface between the non-deterministic LLM layer and the deterministic tool layer.
      Authentication bypass, insufficient access controls, and prompt injection remain live concerns
      for organizations deploying agentic IT automation. Serval mitigates some of this risk through
      its two-agent architecture and role-based access controls, but the research underscores that
      customer security posture is a critical due-diligence dimension that the current evidence base
      does not fully address.
    claimRefs:
      - CU012
      - CU013
      - CU014
      - CU015
      - CU017
      - CU026
      - CU027
      - CU028
      - CU029
    tableRefs:
      - TU004
      - TU006
    figureRefs:
      - FU003

  - id: expansion-concentration
    title: Expansion Dynamics and Concentration Risk
    body: >
      Serval's land-and-expand thesis has two visible vectors: departmental expansion beyond IT
      into HR, legal, and finance; and integration depth across 60-plus enterprise tools. Reuters
      reported the departmental expansion explicitly, and Serval's integrations page confirms the
      breadth of supported workflow surfaces. The four-phase onboarding is designed to deepen
      deployment over time, and the Insights Agent module explicitly surfaces configuration
      recommendations that would prompt workflow additions — a structural mechanism for expansion
      revenue. However, no customers have publicly disclosed cross-departmental usage, and no
      upsell or expansion ARR metric is available. The concentration risk is significant: all seven
      named customers are themselves venture-backed and share investor relationships with one or
      more of Serval's own backers. Perplexity is a Sequoia portfolio company, the same firm that
      led Serval's Series B. Redpoint, which led Serval's Series A, co-invests alongside Serval's
      investor base in several of the named customers. This co-investment overlap is common in the
      tight-knit AI startup ecosystem but creates a referral dynamic that may not persist when
      Serval needs to acquire customers from outside its investors' portfolios. The absence of any
      disclosed Fortune 500, mid-market, or regulated-industry customer is the most material
      single gap in the commercial profile; without it, Serval's growth story depends on sustained
      velocity within a relatively homogeneous, VC-connected early-adopter cohort.
    claimRefs:
      - CU018
      - CU019
      - CU020
      - CU022
      - CU023
      - CU024
      - CU031
      - CU032
      - CU033
      - CU035
