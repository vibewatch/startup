chapter:
  number: 6
  title: Customers
  summary: >
    Serval's disclosed customer base consists of seven named, VC-backed technology companies —
    Perplexity, Together AI, Mercor, Vercel, Verkada, Clay, and Cribl — all corroborated across
    independent press coverage, investor portfolio pages, and the company's own homepage. The strongest
    commercial evidence is Sequoia partner Anas Biad's comparison to ServiceNow 16 years ago alongside
    a 500% revenue growth claim (Aug–Dec 2025); the most significant gap is the complete absence of
    independently verified case studies, G2 or Gartner Peer Insights reviews, or any disclosed retention
    metric, with all evidence sourced exclusively from Serval itself and its own investors.

sections:
  - id: customer-base-profile
    title: Customer Base Profile
    body: >
      Serval's disclosed customer roster is small in number but strategically curated for maximum
      credibility signalling within the AI and developer-tools community. The company's homepage
      footer names four companies — Perplexity, Together.ai, Mercor, and Cribl — while Sequoia's
      portfolio page for Serval independently expands that list to include Vercel and Verkada. The
      TechCrunch Series A article and the Reuters/USNews Series B coverage add independent third-party
      corroboration for Perplexity, Mercor, and Together AI. All seven customers are venture-backed
      technology companies with workforces ranging from roughly 50 to several hundred employees; none
      are publicly traded, Fortune 500, regulated financial institutions, government agencies, or
      traditional enterprise accounts. The customer list spans multiple sub-segments: AI inference
      platforms (Perplexity, Together AI), developer platforms (Vercel), go-to-market data tools
      (Mercor, Clay), observability and data routing (Cribl), and physical security technology
      (Verkada). Perplexity and Together AI are among the most high-profile names in the current
      AI infrastructure wave, providing Serval with strong social proof within the venture-backed
      ecosystem. Vercel and Verkada add credibility beyond the pure LLM space, suggesting the
      platform can handle IT workflows for hardware-adjacent and infrastructure-scale companies.
      No customers from regulated verticals — healthcare, financial services, insurance, government —
      have been disclosed, which limits the addressable evidence base for enterprise-risk buyers
      evaluating a full ITSM replacement in compliance-intensive environments.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU010
      - CU011
