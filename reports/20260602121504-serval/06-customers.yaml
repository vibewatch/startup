callouts:
  - calloutType: strength
    title: Sequoia's ServiceNow Comparison Is the Strongest Single Proof-Point
    body: >
      Sequoia partner Anas Biad's public statement — "The last time we heard customer feedback
      this strong was 16 years ago when we partnered with ServiceNow" — is unusually direct
      for a venture-stage endorsement. ServiceNow is now a $170B+ company. While Biad is not
      independent, Sequoia conducted customer diligence before leading a $75M round at a $1B
      valuation, and this statement implies that diligence surfaced qualitative feedback
      consistent with an early ServiceNow pattern. This is the best proxy for enterprise
      customer satisfaction currently in the public record.
    claimRefs:
      - CU016
      - CU003

  - calloutType: risk
    title: All Named Customers Are VC-Adjacent Startups — No Enterprise Crossover Proven
    body: >
      Every disclosed Serval customer is itself a venture-backed technology company. Six of seven
      share investor relationships with Serval's own backers. This creates a referral-network
      dynamic that is valuable for early traction but unsustainable as a primary growth channel
      at scale. The absence of any regulated-industry, Fortune 500, or mid-market buyer prevents
      meaningful inference about Serval's ability to navigate procurement, compliance, and
      change-management cycles in environments that do not share Serval's own investor and
      cultural DNA.
    claimRefs:
      - CU019
      - CU036
      - CU020

  - calloutType: risk
    title: Agentic AI Architecture Carries Documented Security Risks
    body: >
      Independent security researchers (Acronis, cited in Dark Reading) have documented that
      "vibe coded programs" — the same natural-language-to-code automation paradigm Serval
      uses — introduce traditional software vulnerabilities at the LLM-to-tool interface,
      including authentication bypass and insufficient access controls. Serval's two-agent
      architecture and role-based access controls partially mitigate this, but enterprise
      buyers in regulated industries or with high-sensitivity IT environments should require
      a formal security review of Serval's tool-permission model before production deployment.
    claimRefs:
      - CU028
      - CU029
      - CU035

  - calloutType: recommendation
    title: Require Independent Case Studies and Third-Party Reviews Before Series C
    body: >
      Before Serval can claim enterprise-grade customer proof, it must close two evidence
      gaps: at least one independently verified case study (authored by the customer, not Serval)
      for a named account, and at least five G2 or Gartner Peer Insights reviews. Both are
      standard expectations for Series C enterprise SaaS companies. The current position —
      seven named customers, zero case studies, zero third-party reviews — is acceptable at
      Series A but is below the bar for the $1B valuation Serval already carries.
    claimRefs:
      - CU012
      - CU014
      - CU026

