            VC network referrals dominate; inbound signal limited; no disclosed conversion rate.
        - label: Demo Booked
          description: >
            Prospect schedules demo via serval.com CTA; no self-serve trial or PLG motion documented.
        - label: Pilot Scoped (Meet)
          description: >
            Guided pilot with dedicated deployment engineer; high-touch; no timeline or conversion
            data disclosed.
        - label: Workflows Built (Build)
          description: >
            Natural-language automation coding phase; engineering-assisted workflow generation;
