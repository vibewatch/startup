figures:
  - id: FU001
    title: Customer Journey Map
    type: journey-map
    layout: wide
    summary: >
      Serval's customer journey progresses through four company-defined phases — Meet, Build,
      Deploy, Optimize — with expansion into additional departments and deeper workflow automation
      as the post-deployment growth loop.
    data:
      nodes:
        - label: Discover
          description: >
            Prospect is referred via VC network, inbound marketing, or SDR outreach;
            demo scheduled via serval.com Book a Demo CTA. Key actors: IT Director / CTO.
        - label: Evaluate (Meet Phase)
          description: >
            Guided pilot scoping; dedicated deployment engineer assigned;
            IT ticket inventory assessed for automation surface area. Friction: high-touch,
            no self-serve trial documented.
        - label: Build Phase
          description: >
            Workflow automations described in natural language; Automation Agent generates
            deterministic code; IT admin reviews and approves permissions. Friction: code review
            required; learning curve for natural-language automation.
        - label: Deploy Phase
          description: >
            Help Desk Agent goes live in Slack / Teams / email portal;
            50%+ ticket automation targeted on day one. Friction: employee adoption; integration
            parity with existing tools required.
        - label: Optimize Phase
          description: >
            Insights Agent surfaces workflow recommendations; knowledge base updated;
            security configuration tightened. Friction: change management for AI-suggested updates.
        - label: Expand to New Depts
          description: >
            Additional departments (HR, Legal, Finance) adopt Serval;
            integration count grows across Okta, GitHub, Jira, Salesforce, etc.
            Friction: cross-department budget and procurement coordination.
    approximationNotes: >
      Journey phases are derived from Serval's pricing page and onboarding documentation.
      Friction points are inferred from the platform architecture and competitive context,
      not from disclosed customer interviews.
    claimRefs:
      - CU022
      - CU023
      - CU035

