  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: sla-risk
      missingEvidence: >-
        Serval has not disclosed its actual automation rate across its customer base, any SLA breach
        history, remediation mechanisms for SLA miss, or the financial terms governing SLA-linked
        credits or contract termination rights.
      whyItMatters: >-
        The 50% automation SLA guarantee is Serval's primary differentiation and creates direct legal
        liability; without understanding the measured performance and contractual remedies, the
        financial risk from SLA breach cannot be quantified.
      diligencePath: >-
        Request average and median automation rate across all customer cohorts, SLA breach incident
        log, and full MSA terms covering SLA performance, remedies, and customer termination rights.
      relatedQuestionRefs:
        - QR018
      relatedTableRefs:
        - TR005

    - type: private-evidence-only
      severity: material
      topic: agentic-ai-security
      missingEvidence: >-
        Serval has not disclosed its underlying LLM provider(s), shared third-party penetration test
        results, or published an AI red-team or adversarial testing report for its agent architecture.
      whyItMatters: >-
        LLM provider identity determines model availability, pricing, and capability risk; absence of
        penetration test results makes it impossible to independently assess whether the pre-authorized
        tool architecture is enforced at the code level or only at policy level.
      diligencePath: >-
        Request name of LLM provider(s), penetration test methodology and results from prior 12 months,
        and AI red-team findings report.
      relatedQuestionRefs:
        - QR015
        - QR028

    - type: missing-source
      severity: material
      topic: regulatory
      missingEvidence: >-
        No confirmation from Serval of a reason for absence of SEC Form D filings; the absence may
        reflect an alternative securities exemption (e.g., foreign offering exemption, resale
        exemption) or a compliance gap; without an explanation the risk cannot be characterized.
      whyItMatters: >-
        A Form D filing violation is a reportable event that can trigger SEC enforcement and affect
        a company's future securities offerings; the gap should be resolved before any investment.
      diligencePath: >-
        Request legal memorandum from Serval counsel confirming the exemption relied upon for each
        round and confirming Form D was either filed under a different entity name or is not required.
      relatedQuestionRefs:
        - QR011
        - QR020
      relatedTableRefs:
        - TR001

    - type: missing-source
      severity: advisory
      topic: benchmark-data
      missingEvidence: >-
        No independent benchmark data was found for realistic AI automation rates in enterprise ITSM
        contexts; the 50–80% range cited in Serval marketing lacks third-party corroboration from
        any neutral research source.
      whyItMatters: >-
        Without a credible automation-rate baseline from independent sources, it is impossible to
        assess whether Serval's claimed automation rates are achievable at scale or represent
        aspirational targets.
      diligencePath: >-
        Seek Gartner, Forrester, or academic studies quantifying AI automation rates in enterprise
        IT service management; alternatively request Serval to provide customer-level aggregate data
        verified by a third-party auditor.
      relatedQuestionRefs:
        - QR009

callouts:
  - calloutType: risk
    title: SEC Form D Absence Is a Material Governance Red Flag
    body: >-
      EDGAR searches return zero Form D filings for Serval across multiple query formulations
      covering the 2025–2026 fundraising period. Under Regulation D, Form D is typically required
      within 15 days of first sale. The absence is either a compliance gap requiring correction or
      signals an unusual exemption structure that must be explained by counsel before closing any
      investment. This is a blocking diligence item.
    claimRefs:
      - CR016
      - CR017

  - calloutType: risk
    title: Agentic AI Security Incident Precedent Is Directly Analogous to Serval's Attack Surface
    body: >-
      The ServiceNow exploit (overly permissive chatbot, email-only authentication) and the
      47-second support-ticket exploit chain both involve the exact input vector—IT support
      tickets—that Serval's Help Desk Agent processes. The pre-authorization architecture reduces
      blast radius but does not eliminate the risk. Serval has not published penetration test
      results or disclosed its AI red-team findings.
    claimRefs:
      - CR002
      - CR038
      - CR007

  - calloutType: recommendation
    title: Require ARR, NRR, and SLA Performance Data Before Proceeding
    body: >-
      Serval's entire investment thesis rests on revenue growth quality (500% growth claim, no
      ARR), automation performance (50% SLA guarantee, no customer aggregate data), and customer
      retention (no churn data). These are not nice-to-have metrics; they are the minimum
      verifiable inputs required to evaluate whether the $1B valuation is defensible.
    claimRefs:
      - CR012
      - CR036
      - CR037

  - calloutType: strength
    title: Pre-Authorization Architecture Is the Right Design Approach
    body: >-
      Separating tool-building (Automation Agent) from tool-execution (Help Desk Agent) with a
      pre-authorization constraint addresses the primary governance failure mode for autonomous AI
      agents. NIST AI 100-2 and CISA 2026 guidance both identify access scope limitation as a
      key control. Serval's architecture aligns with these recommendations and differentiates it
      from less constrained agentic competitors.
    claimRefs:
      - CR007
      - CR039
      - CR041
