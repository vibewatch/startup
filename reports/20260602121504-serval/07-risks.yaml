    title: Regulatory / legal risk register
    enumerationScope:
      coverage: partial
      basis: >-
        Review of EU AI Act, GDPR Article 22, Regulation D Form D requirements, CCPA, CISA 2026
        agentic AI guidance, and NIST AI RMF cross-referenced against Serval's published AUP and
        public disclosures as of June 2026. Coverage is partial because sector-specific regulations
        (HIPAA enforcement specifics, state-level AI bills) require customer-by-customer analysis.
    columns:
      - Regulatory Domain
      - Specific Requirement
      - Serval Exposure
      - Severity
      - Mitigation Deployed
    rows:
      - - EU AI Act (Transparency / GPAI)
        - Art. 52 transparency obligations for AI systems interacting with humans; potential Annex III
          high-risk classification for automated employment-adjacent decisions
        - EU deployments of automated IT access and HR workflow automation may require transparency
          disclosures; no EU AI Act readiness statement published
        - High
        - AUP human-oversight clause; no formal compliance statement
      - - GDPR Article 22
        - Prohibition on solely automated decisions with legal or significantly affecting effects
          without meaningful human intervention
        - Automated IT access provisioning and employee offboarding have employment-adjacent effects
          that may trigger Article 22 obligations for EU-based customers
        - High
        - AUP requires qualified human review for consequential decisions
      - - US Securities Law (Regulation D / Form D)
        - Form D must be filed with SEC within 15 days of first sale in an exempt securities offering
        - No SEC Form D found for Serval's approximately $127M in disclosed venture fundraising across
          Series A and Series B rounds as of the run date
        - Medium
        - No disclosed remediation; gap requires direct inquiry
      - - CCPA / US State Privacy Laws
        - Data subject rights, automated decision notifications, and opt-out requirements
        - Serval processes employee PII across enterprise IT workflows; obligations depend on
          customer geography and data processing scope in each MSA
        - Medium
        - SOC 2 Type II claimed; GDPR/CCPA compliance stated in AUP
      - - CISA Agentic AI Guidance (2026)
        - CISA guidance on careful adoption of agentic AI services for critical infrastructure
          operators and enterprise IT environments
        - Serval customers in critical infrastructure sectors face CISA-guided procurement and
          security review requirements that create indirect compliance overhead for Serval's sales
        - Medium-Low
        - Two-agent pre-authorization architecture; SOC 2 Type II; HIPAA compliance claimed
