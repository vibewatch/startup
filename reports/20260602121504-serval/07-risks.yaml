company:
  name: Serval
chapter:
  number: 7
  title: Risk Register
  summary: >-
    Serval faces a distinctive risk stack centered on three mutually reinforcing vectors: agentic AI
    reliability and security risk from autonomous access provisioning with no public production track
    record; regulatory compliance exposure from EU AI Act transparency obligations and GDPR Article 22
    as Serval's automated access decisions approach legally significant territory; and execution risk
    from a sub-30-person team scaling into a $1B unicorn valuation with undisclosed revenue.
    The company's contractually guaranteed 50% automation SLA creates unusual legal liability, while
    the absence of any SEC Form D filing for approximately $127M in disclosed venture fundraising
    raises governance transparency questions. Mitigants include a well-designed two-agent
    pre-authorization architecture and SOC 2 Type II compliance claims, but competitive displacement
    by ServiceNow's AI agent rollout and dependency on key SaaS infrastructure providers represent
    persistent residual risks.

sections:
  - id: agentic-reliability-security
    title: Agentic AI Reliability and Security Risks
    body: >-
      Serval's core product—an AI agent that autonomously provisions access, resolves IT tickets, and
      orchestrates enterprise workflows—introduces a qualitatively different risk profile from
      traditional SaaS tools. When an AI agent can authenticate as a user, create access grants, and
      modify audit logs, the blast radius of a failure is far higher than a form-based workflow tool.
      Security researchers have demonstrated this concretely: a researcher discovered an overly
      permissive ServiceNow chatbot protected by only a factory default credential that could be
      authenticated as any user simply by supplying their email address, granting access to create
      powerful AI agents in any company's ServiceNow instance. A separate demonstration showed that
      an exploit delivered in a support ticket—analogous to an IT help desk request—took approximately
      47 seconds to escalate permissions, access customer records, exfiltrate data, and modify audit
      logs to cover its tracks. These incidents are directly relevant because Serval processes
      support tickets as its primary input channel.


      Acronis researchers found that agentic AI vulnerabilities are not primarily caused by AI model
      flaws but by classical software errors—lack of input sanitization, hardcoded credentials, and
      insufficient access controls—in the deterministic software layer connecting the LLM to
      enterprise tools. NIST AI 100-2 E2025 codifies this threat surface in a taxonomy of adversarial
      machine learning attacks covering prompt injection, data poisoning, model evasion, and model
      extraction. Serval's two-agent architecture, which restricts the Help Desk Agent to
      pre-authorized tools only, is a meaningful design-level control, but it does not eliminate the
      risk of a misconfigured authorization scope or a compromised integration. The company's 150+
      native integrations with privileged identity systems (Okta, Google Workspace, GitHub, AWS) mean
      the attack surface scales with adoption. CISA issued specific guidance in 2026 on careful
      adoption of agentic AI services in enterprise environments, signaling the regulatory community
      has identified this risk class as material.
    claimRefs:
