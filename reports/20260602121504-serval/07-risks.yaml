  - id: mitigation-kill-criteria
    title: Mitigation Framework and Kill Criteria
    body: >-
      Serval's strongest structural mitigation is architectural: the two-agent design that separates
      tool-building (Automation Agent) from tool-execution (Help Desk Agent) prevents the most
      dangerous failure mode where an unconstrained AI agent takes destructive actions autonomously.
      Pre-authorized tool scoping limits the Help Desk Agent to explicitly approved workflows, and the
      SOC 2 Type II compliance claim indicates audit discipline around data handling and change
      management. NIST AI Risk Management Framework provides an independent risk governance template
      that enterprise buyers increasingly require from AI vendors.


      Thesis-break triggers are identifiable. A production security incident—AI misprovisioning access
      at scale, prompt injection exploit, or data exfiltration via an integration—would likely trigger
      immediate customer churn among compliance-sensitive buyers and could attract regulatory scrutiny.
      A sustained SLA breach rate exceeding the 50% automation guarantee creates contractual liability
      that the company has not publicly characterized. CEO departure before Series C is a near-certain
      thesis-break given the current executive concentration. Down round or bridge financing signals
      deteriorating investor confidence that compounds competitive and retention risk. Investors should
      establish ongoing monitoring of production SLA data, security disclosures, headcount trajectory,
      and ServiceNow competitive win/loss rates as the primary leading indicators.
    claimRefs:
      - CR041
      - CR042
    tableRefs:
      - TR005
    figureRefs: []

