  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk Domain
      - Lead Mitigation
      - Early Warning Signal
      - Thesis-Break Trigger
      - Diligence Ask
    rows:
      - - Agentic AI security
        - Two-agent pre-authorization architecture; SOC 2 Type II; AUP human-oversight clause;
          CISA guidance compliance pathway
        - Undisclosed security incident; CVE assigned for Serval-specific vulnerability; public
          report of AI misprovisioning
        - Production AI misprovisioning causing data breach, regulatory action, or customer
          contract termination
        - Request penetration test results, AI red-team report, and incident response playbook
      - - Regulatory and legal compliance
        - GDPR/CCPA AUP provisions; HIPAA compliance claim; SOC 2 Type II; EU market entry deferred
          pending AI Act compliance confirmation
        - EU customer inquiry flagging AI Act gaps; privacy regulator inquiry; Form D notice
        - Regulatory enforcement action (GDPR, CCPA, SEC) against Serval or a reference customer
          citing Serval as the system of record
        - Request DPA templates, EU AI Act self-assessment, and SEC Form D status and rationale
      - - Competitive displacement
        - 50% automation SLA guarantee as moat; faster time-to-value vs. ServiceNow NowAssist;
          overlay sales motion for ServiceNow-locked accounts
        - ServiceNow announces equivalent SLA guarantee; Moveworks or Glean raises $200M+ for
          ITSM expansion; Serval competitive win rate drops below 40% vs. ServiceNow
        - ServiceNow bundles free AI automation for existing ITSM customers at enterprise renewal;
          Serval pipeline drops more than 30% in two consecutive quarters
        - Validate competitive win/loss analysis in enterprise deals against ServiceNow NowAssist
      - - Execution and people
        - Series B capital ($127M); Sequoia and Redpoint board oversight; Serval Start talent
          pipeline; strong investor brand for recruiting
        - CEO departure announcement; headcount milestone missed; product quality deterioration
          visible in customer escalations
        - CEO departure before Series C close; headcount fails to reach 60 by Q3 2026; second
          named executive departure in 60 days
        - Reference check all named executives; validate headcount plan and 2026 hiring pipeline
      - - Financial and valuation
        - 500% revenue growth claim; strong investor syndicate; quote-based pricing preserves
          margin flexibility; $127M capital provides 24-36 months runway at current burn
        - Failed to raise Series C at or above $1B valuation; customer churn above 10% in cohort;
          ARR growth deceleration signal in Series C materials
        - Down round or bridge financing required before reaching $10M ARR; ARR disclosed below
          $3M at Series C; Sequoia declines to lead Series C
        - Demand ARR disclosure, NRR, CAC payback period, and gross margin in Series C materials
    claimRefs:
