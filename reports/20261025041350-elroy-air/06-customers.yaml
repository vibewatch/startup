figures:
  - id: FU001
    title: Evidence-based customer adoption journey
    type: journey-map
    summary: >-
      Public evidence advances from mission definition and customer input through
      demonstrations and forward commitments, but has not reached disclosed
      repeat production economics.
    data:
      nodes:
        - id: qualify-lane
          label: Qualify a high-friction lane
          detail: "Identify middle-mile, offshore, remote, or contested logistics where runway independence matters."
          touchpoints:
            - "FedEx sortation network"
            - "Bristow Gulf Coast operations"
            - "Army contested logistics"
        - id: co-design
          label: Co-design operating requirements
          detail: "Customer and operator input shapes payload, infrastructure, safety, and network integration needs."
          touchpoints:
            - "FedEx collaboration since 2020"
            - "Bristow as early customer and partner"
        - id: demonstrate
          label: Demonstrate autonomous cargo flight
          detail: "Flight milestones establish capability before a customer-specific production deployment."
          touchpoints:
            - "25-mile autonomous flights"
            - "213-pound point-to-point cargo flight"
        - id: supervised-operations
          label: Run regulator-observed operations
          detail: "The Louisiana eIPP campaign moved varied cargo under air-traffic-control oversight."
          touchpoints:
            - "LIFTOff Louisiana"
            - "Bristow Group"
            - "FAA and public agencies"
        - id: commitment
          label: Convert interest into commitments
          detail: "Reservations and development contracts provide stronger proof than pipeline claims, but have different economics."
          touchpoints:
            - "15 Bristow early-delivery positions"
            - "U.S. Army multi-year development award"
        - id: production-expansion
          label: Prove production and expansion
          detail: "Aircraft delivery, recurring paid use, retention, and contract economics remain the unverified next stage."
          touchpoints:
            - "Late-2026 first-production expectation"
            - "No disclosed retention or concentration cohorts"
    approximationNotes: >-
      The sequence represents evidence maturity, not elapsed time, conversion rates,
      revenue, or the probability that a reservation becomes a delivered aircraft.
    claimRefs:
      - CU003
      - CU006
      - CU008
      - CU012
      - CU014
      - CU016
callouts:
  - calloutType: risk
    title: Demand claims are not contracted revenue
    body: >-
      Public pipeline, backlog, reservations, potential purchases, and contract
      ceilings use different definitions. Underwriting should rely on a
      counterparty-level schedule of funded commitments, deposits, cancellation
      rights, deliveries, and recognized revenue rather than summing those figures.
    claimRefs:
      - CU008
      - CU010
      - CU011
      - CU012
      - CU013
      - CU016
