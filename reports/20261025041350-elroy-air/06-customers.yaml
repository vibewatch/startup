  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: customer-durability-gap
      missingEvidence: >-
        Counterparty-level contracts, deposits, cancellation rights, delivery
        schedules, renewals, repeat paid utilization, NRR, GRR, churn, and contract
        length.
      whyItMatters: >-
        Without these data, reservations and pipeline claims cannot establish
        durable demand, recurring revenue, or expansion economics.
      diligencePath: >-
        Obtain the customer contract register and cohort schedule, reconcile each
        named counterparty to funded orders, deliveries, recognized revenue,
        cancellations, renewals, and repeat operational use.
      relatedQuestionRefs:
        - QU005
        - QU007
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: >-
        A complete customer and partner roster distinguishing prospects, pilots,
        reservations, purchase commitments, funded contracts, delivered aircraft,
        and recurring service customers.
      whyItMatters: >-
        The public record names only a partial set of counterparties and cannot
        establish customer count, conversion rates, or breadth of production use.
      diligencePath: >-
        Request a CRM-to-contract reconciliation with legal entity, segment,
        relationship stage, aircraft count, funded value, revenue recognized,
        deployment status, and referenceability for every counterparty.
      relatedQuestionRefs:
        - QU003
        - QU004
        - QU010
      relatedTableRefs:
        - TU003
    - type: conflicting-data
      severity: material
      topic: demand-pipeline
      missingEvidence: >-
        Definitions and dated composition for the above-1,000-aircraft backlog and
        above-1,400-aircraft, above-$5-billion potential-revenue pipeline claims.
      whyItMatters: >-
        The figures may reflect different dates, stages, pricing assumptions, or
        non-binding interest and therefore cannot be combined or treated as booked
        demand.
      diligencePath: >-
        Reconcile each published figure to a dated opportunity schedule showing
        firm orders, options, reservations, non-binding indications, expected
        pricing, probability weighting, and cancellations.
      relatedQuestionRefs:
        - QU006
