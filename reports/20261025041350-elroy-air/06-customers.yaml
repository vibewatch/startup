company:
  name: Elroy Air
chapter:
  number: 6
  title: Customers
  summary: >-
    Elroy Air has credible named demand signals across express logistics, offshore
    aviation, and defense, including FedEx design collaboration, Bristow flight
    participation and reservations, and a U.S. Army development contract. The
    evidence is still weighted toward pilots, reservations, company-reported
    pipeline, and development activity rather than production deployments,
    retention, realized revenue, or independently verified customer outcomes.
sections:
  - id: customer-segments-and-buying-centers
    title: Customer segments and buying centers
    body: >-
      The public customer record spans three distinct buying systems rather than
      one homogeneous market. FedEx represents an express-logistics network buyer
      evaluating hub-to-hub movement, with network planning and operations users
      shaping requirements for rural and island lanes. Bristow represents an
      aviation-services channel and prospective operator serving offshore energy
      customers, while the U.S. Army is a government development customer focused
      on contested logistics. Louisiana's eIPP participation adds a public-private
      deployment channel, not a conventional recurring customer. These segments
      have different procurement cycles, operating approvals, service models, and
      payers, so aggregate aircraft-demand claims should not be treated as a
      uniform commercial backlog.
    claimRefs:
      - CU003
      - CU004
      - CU007
      - CU009
      - CU012
      - CU013
    tableRefs:
      - TU001
  - id: adoption-trajectory
    title: Adoption trajectory remains pre-production
    body: >-
      Adoption evidence has progressed from customer design input to increasingly
      realistic flight demonstrations. Autonomy Global reported 25-mile autonomous
      flights in September 2025 and a later 213-pound cargo flight over 2.6 miles.
      In August 2026, DroneDJ reported a week-long eIPP campaign in Louisiana with
      Bristow and mixed real-world cargo under air-traffic-control oversight. Those
      events show operational learning, but they do not establish recurring paid
      service, fleet utilization, dispatch reliability, or unit economics.
      Bristow's 15 early-delivery positions and a potential purchase framework are
      stronger forward commitments, yet production was still expected for late
      2026. The evidence therefore supports a pre-production adoption trajectory,
      not scaled commercial deployment.
    claimRefs:
      - CU001
      - CU002
      - CU006
      - CU008
      - CU009
      - CU014
    tableRefs:
      - TU002
    figureRefs:
      - FU001
  - id: named-customer-proof
    title: Named proof is real but uneven
    body: >-
      FedEx, Bristow, and the U.S. Army provide three different grades of customer
      proof. FedEx supplied operational requirements and described intended tests,
      but the retained sources do not document completed FedEx network operations.
      Bristow participated in the 2026 Louisiana campaign and expanded early
      delivery positions, which is stronger than a logo but remains short of a
      disclosed production fleet purchase. The Army agreement is the clearest
      paid development signal: a company-issued release called it a $46 million
      multi-year award, while independent coverage described it as worth up to
      $46 million. That distinction matters because a contract ceiling is not the
      same as recognized revenue or cash collected.
    claimRefs:
      - CU003
      - CU005
      - CU006
      - CU007
      - CU008
      - CU012
      - CU013
    tableRefs:
      - TU003
  - id: durability-expansion-and-concentration
    title: Durability, expansion, and concentration remain unquantified
    body: >-
      The strongest expansion evidence is directional: Bristow increased early
      delivery positions from five to 15, and Elroy Air separately reported large
      demand figures. Those figures are not directly comparable. A March 2026
      company release cited a backlog above 1,000 aircraft, while September
      reporting relayed a company claim of more than 1,400 aircraft and more than
      $5 billion of potential future revenue. Neither disclosure defines firm
      orders, deposits, cancellation rights, expected delivery timing, or customer
      concentration. No retained source reports NRR, GRR, churn, renewal,
      contract length, repeat paid utilization, or revenue by counterparty. Until
      management supplies a contract-level schedule and operating cohorts, demand
      durability and land-and-expand economics remain material diligence gaps.
    claimRefs:
      - CU008
      - CU010
      - CU011
      - CU015
      - CU016
