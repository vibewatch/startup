callouts:
  - calloutType: recommendation
    title: Underwrite conversion, not headlines
    body: The decisive diligence question is whether reported demand and strategic milestones convert into paid deliveries, durable margins, and cash visibility before the approximately $1 billion value is accepted.
    claimRefs: [CV004, CV010, CV015]
  - calloutType: risk
    title: Downside trigger
    body: A delayed SPAC close, reduced proceeds, or failure to convert preorders into recognized revenue would increase dilution and weaken the basis for the announced valuation.
    claimRefs: [CV012, CV013, CV014]
