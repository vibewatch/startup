company:
  name: Elroy Air
chapter:
  number: 8
  title: Valuation
  summary: Elroy Air has a credible financing and commercialization narrative, but public evidence still supports a research-more stance because the approximately $1 billion transaction value is anchored to pipeline, contracts, and planned production rather than disclosed recurring revenue or demonstrated scaled delivery economics.
sections:
  - id: recommendation
    title: Recommendation and price discipline
    body: >-
      The evidence supports research-more rather than buy. Reuters reported a planned SPAC combination
      valued at roughly $1 billion and at least $165 million of committed investor proceeds, while later
      reporting described $175 million of PIPE commitments with $75 million already funded. Those are
      financing facts, not revenue or cash-on-hand proof. The investment case has real strategic support:
      Lockheed Martin Ventures participated, a multi-year Army contract is reported at up to $46 million,
      and the company has regulatory-pilot and manufacturing milestones. The counterweight is that the
      order book is repeatedly described as a pipeline or preorder set, and public sources do not disclose
      recognized revenue, gross margin, burn, runway, cancellation terms, or the conversion rate from
      reservations to delivered aircraft. At this evidence level, entry discipline should require either a
      materially lower price or audited/public-company financial disclosure that demonstrates production
      economics and funded execution.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001]
  - id: thesis-antithesis
    title: Thesis, anti-thesis, and value drivers
    body: >-
      The thesis is that Elroy can convert differentiated aircraft capability and strategic counterparties
      into a defensible middle-mile logistics platform. Chaparral is described as a hybrid-electric VTOL
      system designed for heavy payloads and long range, and the company has reported a federal integration
      pilot, defense work, Bristow engagement, and Kratos manufacturing support. These signals can reduce
      technology and market-entry risk, but they do not remove certification, reliability, service, and
      working-capital risk. The anti-thesis is therefore specific: the announced valuation may capitalize
      a non-binding or early-stage demand pipeline before delivery, revenue recognition, and unit economics
      are observable. The most important value drivers are aircraft acceptance, repeatable production,
      regulatory permissions, customer deposits and milestone payments, and contribution margin per mission.
      Multiples identifies Tesla and General Motors as listed references and Zipline, Cowarobot, Dexterity,
      and UISEE as private references, but their business mix, maturity, and disclosed metrics are not
      sufficiently comparable to support a target multiple. Until operating data are disclosed,
      comparable-company valuation is a directional reference rather than a justified target multiple.
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV010]
    tableRefs: [TV002]
  - id: scenarios-and-diligence
    title: Scenarios, downside triggers, and diligence
    body: >-
      A bull case requires the SPAC closing, the funded PIPE remaining available for production, late-2026
      aircraft output, and early customer or defense deployments converting into paid, repeatable operations.
      A base case assumes financing closes but commercialization takes longer and the pipeline converts
      gradually, requiring additional capital before positive unit economics. A bear case is triggered by
      a delayed or repriced transaction, redemptions that reduce proceeds, failed certification or flight
      reliability, manufacturing delays, or preorder cancellations; in that case dilution and multiple
      compression can overwhelm strategic validation. Public evidence does not support assigning precise
      probabilities or a precise fair-value range, so the scenario table uses qualitative probability
      signals and explicitly leaves revenue-based valuation inputs unresolved. Before underwriting price,
      diligence should obtain the signed transaction documents, cap table and preference stack, cash
      balance and use-of-proceeds schedule, backlog definitions, contract enforceability, cancellation
      rights, production cost per aircraft, warranty obligations, and independent operating data.
    claimRefs: [CV011, CV012, CV013, CV014, CV015]
    tableRefs: [TV003]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Public evidence, Decision implication]
    rows:
      - [Recommendation, "Research-more", "Do not underwrite a buy without financial and contract disclosure."]
      - [Confidence, "Medium-low", "Financing and milestone evidence is available; revenue and economics are not."]
      - [Risk rating, "High", "Hardware scale-up, regulation, execution, dilution, and conversion risk remain material."]
      - [Valuation stance, "Stretched", "Approximately $1B transaction value is not supported by disclosed revenue metrics."]
      - [Entry discipline, "Price-sensitive", "Require a lower entry price or verified production and cash-flow evidence."]
      - [Target return / exit, null, "No defensible target return or exit multiple can be calculated from public inputs."]
    notes: >-
      The table separates reported financing or transaction values from revenue, cash, and operating
      metrics. Null means the assigned public evidence does not support a numeric target.
    claimRefs: [CV001, CV002, CV003, CV004, CV015]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Strategic demand can be real", "Defense contract, Bristow engagement, and federal pilot are reported.", "Signed paid orders and delivered aircraft with repeat usage."]
      - ["Capital access is a strength", "$175M PIPE commitments are reported; $75M was already funded.", "Verified closing, cash balance, and restricted-use schedule."]
      - ["Manufacturing path is more credible", "Kratos is reported as exclusive U.S. manufacturer for initial production.", "Production acceptance, throughput, cost, and warranty data."]
      - ["Valuation remains vulnerable", "The roughly $1B value is paired with limited publicly disclosed revenue.", "Audited revenue, backlog quality, margin, and cash-conversion disclosure."]
      - ["Pipeline is not equivalent to sales", "Public reporting distinguishes preorders or potential pipeline from revenue.", "Binding contracts, deposits, cancellation terms, and recognized revenue."]
      - ["Comparable evidence is weak", "The identified public and private references differ in maturity, economics, and business mix.", "Comparable revenue, margin, growth, and capital-intensity data on a consistent basis."]
    notes: >-
      Company-issued or syndicated statements are treated as claims requiring contract-level verification;
      competitor comparisons are not used as independent valuation benchmarks.
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV010]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Probability signal, Key risk or trigger]
    rows:
      - [Bull, "Transaction closes; PIPE funds production; late-2026 output and early paid deployments occur.", "Upside could be justified only if delivery revenue and margins validate the platform.", "Low-to-medium; milestone evidence exists but scaled delivery is unproven.", "Production, certification, or customer conversion misses."]
      - [Base, "Transaction closes with slower ramp; pipeline converts gradually; more capital is needed.", "Dilution and time-to-revenue constrain returns at the announced value.", "Medium; consistent with current disclosure gaps.", "Cash burn, redemptions, and contract timing."]
      - [Bear, "Deal slips or reprices; production or regulatory milestones fail; orders cancel.", "Downside is severe because value is tied to future execution rather than current revenue.", "Material; adverse reporting highlights limited revenue and preorder risk.", "SPAC failure, failed reliability, or weak unit economics."]
    notes: >-
      Scenarios are qualitative because the assigned evidence does not disclose a revenue base, margin,
      cash balance, share count, or enforceable backlog sufficient for a numeric valuation range.
    claimRefs: [CV011, CV012, CV013, CV014, CV015]
