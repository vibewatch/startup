      - [Autonomy and mission planning, "Pre-programmed coordinates and uncrewed flight execution", "Navigation, command-and-control, geofencing, detect-and-avoid", "Need cyber, GPS-denial, abort, and human-override evidence"]
      - [Cargo and pod system, "Detachable and swappable payload modules", "Ground handling and configuration control", "Need pod certification, interchange time, and payload limits"]
