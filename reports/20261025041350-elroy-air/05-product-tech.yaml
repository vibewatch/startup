chapter:
  number: 5
  title: Product & Technology
  summary: Elroy Air's Chaparral is a hybrid-electric, autonomous VTOL cargo aircraft built around runway-independent middle-mile and dual-use logistics. Public evidence shows increasingly realistic autonomous delivery demonstrations and a modular cargo concept, but production maturity, certification scale, reliability, and cyber-resilience remain incompletely evidenced.
sections:
  - id: product-and-workflow
    title: Product and customer workflow
    body: >-
      Chaparral is designed as a cargo-first aircraft rather than a passenger eVTOL. The
      public product description combines vertical takeoff and landing, fixed-wing cruise,
      a hybrid-electric powertrain, autonomous flight, and detachable cargo pods. Its target
      workflow is the middle mile: move heavy cargo between distribution hubs, industrial
      sites, offshore locations, or austere destinations without a runway or charging
      station. The customer-facing unit is therefore not only an aircraft; it is an
      aircraft-plus-pod-plus-operating-concept system. This distinction matters because
      the observed demonstrations prove selected flight and delivery functions, not yet
      a complete recurring logistics service with disclosed dispatch, maintenance, or
      lane economics. Public descriptions also position the same platform for commercial,
      defense, humanitarian, and disaster-response missions, which expands the addressable
      use cases but increases configuration, certification, and support complexity.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-and-maturity
    title: Architecture, modularity, and demonstrated maturity
    body: >-
      The architecture has several concrete, testable layers. The aircraft uses eight
      vertical-lift rotors and four forward-flight propellers, while the hybrid system
      supplies electric propulsion without requiring ground charging infrastructure.
      Detachable and swappable pods are intended to let one airframe support different
      cargo and mission profiles. In December 2025, Elroy Air reported an autonomous
      213-pound, 2.6-mile point-to-point delivery using its Hatch Load Pod; in August
      2026, external coverage described a week-long Louisiana campaign with payloads of
      at least 150 pounds under air-traffic-control oversight. The Army-related tests
      add three unattended delivery modes: hover release, forward-flight release, and
      ground release. These are meaningful maturity signals because they exercise
      aircraft control, payload handling, and operational integration separately. They
      do not establish fleet-level reliability, all-weather performance, production
      repeatability, or commercial certification. The patent listing further indicates
      intellectual-property activity around cargo handling, mission pods, aerodynamic
      encasement, and hybrid VTOL systems, but a listing is not proof of granted scope
      or freedom to operate.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: deployment-and-trust
    title: Deployment, integration, and trust constraints
    body: >-
      Deployment is progressing through partner and government test environments rather
      than a disclosed production fleet. The Louisiana eVTOL Integration Pilot Program
      campaign placed Chaparral in an operating environment with an airport, air-traffic
      control, state transportation stakeholders, and Bristow; Kratos is identified as
      the U.S. manufacturing partner. That model may reduce the gap between aircraft
      development and operational integration, but it also creates dependencies on
      partners, production execution, and regulator acceptance. The regulatory evidence
      is explicitly forward-looking: the ABA describes an FAA/TSA BVLOS proposal with
      area approvals, automated data-service providers, detect-and-avoid requirements,
      cybersecurity controls, and reporting obligations. DLA Piper reports industry
      concerns about case-by-case area approvals, one-way visibility gaps, manual-control
      limitations, and the burden on smaller operators. For Chaparral, these are product
      requirements as much as legal issues: command-and-control links, navigation
      redundancy, cybersecurity, maintenance records, and configuration control could
      determine whether demonstrations convert into repeatable revenue operations.
    claimRefs: [CE010, CE011, CE012, CE013]
  - id: diligence-verdict
    title: Product diligence verdict
    body: >-
      The strongest product evidence is the progression from an autonomous point-to-point
      delivery to larger payload tests in an integrated airspace setting and then to
      unattended delivery modes for an Army contract. The platform's differentiators are
      coherent: cargo-only design, VTOL access, hybrid-electric range without charging
      infrastructure, modular pods, and autonomy for locations where a pilot or receiving
      crew is costly or unsafe. The evidence is weaker on the operating system around the
      aircraft. No assigned source supplies dispatch reliability, sortie denominator,
      maintenance burden, failure rates, production yield, cybersecurity test results,
      completed certification, or realized customer economics. The next diligence step
      should therefore be an aircraft-and-operations evidence package: flight-log
      denominators by weather and payload, failure and abort taxonomy, maintenance hours,
      software and configuration-control records, production acceptance data, regulatory
      approvals, and customer lane-level performance. Until those records exist, the
      product should be treated as a technically credible but scale-unproven aircraft
      program rather than an operationally mature logistics network.
    claimRefs: [CE006, CE007, CE010, CE011, CE012, CE013]
