callouts:
  - calloutType: risk
    title: The core risk is conversion, not concept validation
    body: The public record supports meaningful demonstrations and government interest, but it does not yet establish certified recurring service, binding commercial revenue, production yield, or audited liquidity.
    claimRefs: [CR002, CR007, CR010, CR011, CR013]
  - calloutType: insight
    title: Government funding reduces technical risk selectively
    body: The Army contract funds difficult autonomy, navigation, communications, and field-operation work; it does not remove the separate commercial certification, manufacturing, and customer-conversion risks.
    claimRefs: [CR005, CR006, CR009]
