  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than passenger eVTOL companies. Elroy Air is selling a potential
              middle-mile logistics capability to defense, offshore energy, humanitarian, and commercial freight buyers,
              so alternatives include heavy-lift VTOL developers, runway-dependent cargo aircraft, conventional
              helicopters and aircraft, trucking, and internal logistics programs. MarketsandMarkets identifies a wider
              cargo-drone field that includes Natilus, Dronamics, Sabrewing, Silent Arrow, BAE Systems, Volocopter,
              Dufour Aerospace, EHang, and Elroy Air. Commercial UAV News describes Elroy Air, The AIRO Group, and Zelta
              Systems as pursuing “fundamentally different visions” of autonomous cargo aviation. In that comparison,
              Elroy Air is positioned around an industrialized, certification-driven OEM model, while Zelta emphasizes
              licensing and sovereign capability and The AIRO Group emphasizes dual-use heavy lift. This framing is
              useful for segmentation but is not independent proof of competitor performance. The market also includes
              Pyka’s DropShip, a dual-use heavy-lift UAS intended for military resupply and humanitarian lift, with a
              650-pound usable-payload rating and short, unprepared-surface operations. That creates a direct
              payload-and-access comparison even though its range and operating model differ materially from Chaparral.
              Conventional helicopters remain a strong status-quo substitute where crews, existing bases, and urgent
              offshore service justify their cost.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP014
              - CP016
      - number: '3.2'
        title: Capability, trust, and distribution comparison
        blocks:
          - type: paragraph
            body: >-
              Elroy Air’s strongest differentiator is the combination of vertical takeoff and landing, hybrid-electric
              propulsion, detachable or modular cargo pods, and no onboard pilot. DroneDJ reports a Chaparral design
              target of up to 300 pounds over roughly 300 miles and says the aircraft was selected for a federal
              integration program in which most other participants focus on passenger aircraft. Elroy Air’s official
              program announcement presents the same cargo-first positioning and says the system will be used with
              Bristow and Louisiana partners across the Gulf Coast. Those features reduce dependence on runways and
              ground charging, but they do not by themselves establish dispatch reliability or route-level economics.
              The competitive moat therefore depends on regulatory evidence, manufacturing execution, and customer
              integration. A U.S. Army contract reported by eVTOL Insights adds evidence that contested logistics,
              GPS-denied navigation, protected communications, and modular payloads are part of the product-development
              agenda. The same article describes Chaparral as carrying more than 500 pounds up to 450 miles, a
              specification that differs from the 300-pound/300-mile operating description in other sources; the
              discrepancy is preserved rather than normalized.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
              - CP011
              - CP014
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a credible route to deployment, not a settled competitive advantage. Elroy Air’s
              federal pilot-program participation can provide a direct collaboration channel with regulators, while
              Bristow supplies an operating partner and Kratos supplies a production path. DroneDJ reports that Elroy
              Air expanded PIPE commitments to 175 million dollars, that 75 million dollars had been provided ahead of
              the planned combination, that Bristow increased early delivery positions from five to fifteen, and that
              first production aircraft were expected in late 2026. These are company-linked or reported commitments,
              not evidence of recognized revenue or delivered fleet utilization. Displacement risk remains material:
              Pyka’s DropShip is specified for longer-range, higher-payload multi-mission work, while passenger eVTOL
              and fixed-wing cargo developers can compete for the same institutional budgets through different operating
              models. The cargo-drone market is also heterogeneous: GMI describes a shift toward integrated operating
              networks where airframes, supervision, flight management, UTM, infrastructure, and customer workflows must
              work together. Elroy Air’s durability will therefore be tested by repeatable approvals, service support,
              production yield, and economics relative to helicopters, trucks, and competing aircraft—not by aircraft
              specifications alone.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP005
              - CP007
              - CP010
              - CP014
      - number: '3.4'
        title: Underwriting implications
        blocks:
          - type: paragraph
            body: >-
              For a buyer, Elroy Air appears best positioned where runway independence, heavy payload, long range, and
              reduced crew exposure are worth paying for and where a defense or industrial partner can absorb early
              certification and integration work. It is less clearly advantaged in lightweight, high-frequency last-mile
              delivery, where Zipline, Wing, Matternet, and other network operators are cited as leading players in
              GMI’s market overview, or in very long-range heavy lift where Pyka’s published DropShip specifications are
              more ambitious. The public evidence does not establish list pricing, realized aircraft pricing,
              maintenance cost, utilization, customer concentration, or cancellation terms. Those gaps prevent a
              conclusion that the backlog or announced financing translates into durable market share. The immediate
              competitive milestones are first production aircraft, authorized operations beyond demonstrations,
              independent safety and reliability data, and evidence that customers renew or expand after operating the
              aircraft in real logistics workflows.
            claimRefs:
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation
            body: >-
              The combination of cargo-first design, VTOL access, hybrid-electric range, modular pods, and
              federal/defense engagement is a coherent wedge into hard-to-serve middle-mile missions.
            calloutType: strength
            claimRefs:
              - CP005
              - CP006
              - CP007
          - type: callout
            title: Durability risk
            body: >-
              A backlog, financing commitment, or government program is not equivalent to delivered fleet utilization;
              realized price, support cost, reliability, and customer renewal evidence remain open.
            calloutType: risk
            claimRefs:
              - CP010
              - CP012
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Capital base and demand conversion
        blocks:
          - type: paragraph
            body: >-
              The strongest current financial signal is financing capacity rather than reported operating performance.
              Elroy Air's own news index states that previously disclosed PIPE commitments were expanded to $175 million
              and that $75 million had been funded. The same index describes a proposed business combination with a $800
              million pre-money valuation, more than $165 million of committed PIPE capital, and proceeds intended to
              fund commercial-scale Chaparral production. A separate market report describes a target post-transaction
              enterprise value of approximately $1.0 billion and more than $165 million of committed PIPE capital, while
              also warning that the demand pipeline is largely non-binding. These are financing and forward-looking
              transaction disclosures, not cash-on-hand, revenue, or free-cash-flow measures.

              Demand evidence is also substantial but not equivalent to booked revenue. Elroy Air reports more than
              1,000 aircraft in a demand backlog in its USDOT program announcement, while a later independent report
              says the commercial demand pipeline exceeds 1,400 aircraft and represents more than $5 billion of
              potential future revenue. The variation in reported counts and the use of backlog, pipeline, reservations,
              letters of intent, and potential revenue across sources make conversion and contract quality the key
              diligence issue. Bristow's 15 early delivery positions and the Army's $46 million multi-year development
              contract indicate counterparties and program funding, but neither establishes a product revenue run-rate
              or the timing of customer cash receipts.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
              - CI013
          - type: table
            tableRef: TI001
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI013
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI006
              - CI008
              - CI013
      - number: '4.2'
        title: Monetization and cost drivers
        blocks:
          - type: paragraph
            body: >-
              The public record supports a hardware-and-program monetization model: Chaparral aircraft are intended for
              commercial logistics, defense, and rapid-response use; the Army award funds development and testing; and
              Kratos is identified as the exclusive U.S. manufacturing partner. The sources do not provide a customer
              list-price schedule, realized selling price, deposit accounting, milestone-payment structure, cancellation
              rights, warranty reserve, support fee, or revenue-recognition policy. Official product specifications are
              therefore useful for identifying the unit being sold, but they cannot be used as a proxy for price, gross
              margin, or customer lifetime value.

              Cost structure is likely to be dominated by aircraft development, certification and testing, manufacturing
              ramp, payload and autonomy integration, field support, and working capital for production. The disclosed
              production target is late 2026, and the Army contract includes an initial fiscal-year 2026 obligation of
              $5.1 million within a $46.1 million firm-fixed-price award according to an independent aviation report.
              Those figures provide program scale and timing, but not Elroy Air's consolidated cash burn or contribution
              margin. A credible underwriting model still needs unit-level bill of materials, supplier terms, production
              learning curves, labor content, maintenance obligations, and the allocation of government-program costs.
            claimRefs:
              - CI006
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI013
              - CI014
              - CI016
      - number: '4.3'
        title: Financial underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              Elroy Air's capital plan appears designed to bridge the company from flight testing into production, but
              public evidence does not establish that the committed financing is sufficient for certification,
              manufacturing ramp, customer support, and working-capital needs under a downside schedule. The $175
              million expanded PIPE commitment is not the same as cash available: the company says $75 million has been
              funded, while the proposed transaction remains subject to regulatory and shareholder approval and may
              include redemption-dependent proceeds. The company also describes an Abu Dhabi manufacturing joint venture
              and a late-2026 U.S. production start, adding execution and funding dependencies that should be modeled
              separately from the core aircraft program.

              The financial verdict is consequently conditional. Positive evidence includes strategic investors, the
              Army development award, early delivery reservations, and a manufacturing partner. Negative or unresolved
              evidence includes non-binding demand instruments, inconsistent public pipeline counts, absent realized
              revenue and margin disclosure, and no public bridge from committed capital to monthly burn and runway. The
              next financing decision should be gated on audited or management-provided revenue, cash, burn, runway,
              gross-margin, backlog-conversion, and contract-liability schedules rather than on the announced valuation
              or potential pipeline alone.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI007
              - CI008
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Funded transition toward production
            body: >-
              The expanded PIPE commitment, funded tranche, Army program, and named manufacturing partner provide a
              credible financing-and-execution path into production, subject to transaction completion and delivery
              execution.
            calloutType: strength
            claimRefs:
              - CI001
              - CI002
              - CI006
              - CI008
          - type: callout
            title: Pipeline is not revenue
            body: >-
              The largest public commercial number is a potential pipeline built from non-binding instruments and
              changing aircraft counts; it should not be treated as booked revenue, ARR, cash available, or a margin
              forecast.
            calloutType: risk
            claimRefs:
              - CI003
              - CI007
              - CI013
          - type: callout
            title: Gate underwriting on cash and contract schedules
            body: >-
              Before relying on the announced valuation, require audited or management-provided revenue, cash, burn,
              runway, gross-margin, backlog-conversion, deposit, and working-capital schedules.
            calloutType: recommendation
            claimRefs:
