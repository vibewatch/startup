  - id: FP001
    title: Competitive positioning by infrastructure independence and public deployment evidence
    type: quadrant
    summary: >-
      Ordinal positioning highlights Elroy Air’s intended middle ground between runway-independent access and a
      comparatively visible deployment pathway, while preserving uncertainty around competitor evidence.
    data:
      xAxis:
        label: Infrastructure independence
        min: 0
        max: 10
        lowLabel: Runway or fixed-site dependent
        highLabel: Runway-independent / austere-site capable
        description: Ordinal score based on the assigned sources’ descriptions of runway, VTOL, and surface requirements.
      yAxis:
        label: Public deployment evidence
        min: 0
        max: 10
        lowLabel: Concept or early test
        highLabel: Government-linked or operational test
        description: >-
          Ordinal score based on reported tests, government programs, contracts, or customer operations; not a
          market-share or safety score.
      points:
        - label: Elroy Air
          x: 8
          'y': 8
          tone: positive
          detail: eIPP participation, Army contract reporting, autonomous delivery, and production-partner announcements
        - label: Pyka DropShip
          x: 7
          'y': 5
          tone: neutral
          detail: Short unprepared-surface operations and 2026 flight; customer assessments described as next steps
        - label: The AIRO Group
          x: 7
          'y': 3
          tone: neutral
          detail: Full-scale configuration and program claims described; public deployment evidence limited in assigned source
        - label: Zelta Systems
          x: 8
          'y': 2
          tone: risk
          detail: Conceptual amphibious and licensing approach; public flight validation not established in comparison source
        - label: Helicopter / conventional freight
          x: 6
          'y': 9
          tone: positive
          detail: Mature operating modes with established infrastructure, though not autonomous
        - label: Passenger eVTOL / fixed-wing cargo entrants
          x: 4
          'y': 5
          tone: neutral
          detail: >-
            Adjacent aircraft programs can compete for institutional budgets but are not directly comparable on mission
            or maturity
    approximationNotes: >-
      The 0–10 coordinates are analyst-authored ordinal scores derived from the cited disclosures about infrastructure
      requirements and public tests or programs; they are not measured performance, safety, or market-share benchmarks.
