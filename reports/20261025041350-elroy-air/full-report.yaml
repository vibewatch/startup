  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Elroy Air's aircraft is operating in a regulatory category that is novel rather than settled. The company
              says its Chaparral was selected for the USDOT and FAA eVTOL Integration Pilot Program, and its September
              2026 release describes autonomous, uncrewed flights under air-traffic-control oversight. That is useful
              operating evidence, but it is not equivalent to a type certificate, a standing commercial operating
              authorization, or nationwide deployment permission. The same release says the program's operational data
              will inform future aviation policy, which means the regulatory process remains partly prospective. The
              principal legal and regulatory risk is therefore not merely whether a test flight can be completed; it is
              whether repeatable operations, remote-pilot responsibilities, detect-and-avoid, safety-case documentation,
              and jurisdiction-specific approvals can be converted into a scalable commercial model. The eIPP selection
              and flights lower execution uncertainty, while the absence of disclosed final certification milestones
              leaves residual exposure high. A thesis-break trigger is a material delay, restriction, or failed safety
              case that prevents the planned commercial operating corridor from progressing after 2026. Broad unicorn
              datasets provide market context, but they do not supply Elroy Air-specific operating evidence or a
              valuation methodology.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR010
              - CR011
      - number: '7.2'
        title: Operational, technical, and production risk
        blocks:
          - type: paragraph
            body: >-
              The Army's $46.1 million firm-fixed-price Phase III contract is evidence of funded development, not
              evidence that the production aircraft already meets every stated performance target. Military Aerospace
              reports that the contract work is expected to run through February 2029 and covers mission planning,
              cyber-protected communications, GPS-denied or contested navigation, autonomy, and reliable field
              operation. Those requirements identify a demanding operating envelope: degraded communications and
              navigation are explicit engineering problems, not solved assumptions. Public sources also describe a
              five-year exclusive manufacturing arrangement with Kratos and a first production aircraft planned for late
              2026. A single manufacturing partner creates concentration and schedule risk; it may accelerate
              industrialization, but it also makes quality, supplier continuity, tooling, and acceptance milestones
              dependent on one external production pathway. The July payload demonstrations and the 2025 point-to-point
              milestone are encouraging, yet the public record does not disclose fleet dispatch reliability, maintenance
              hours, failure rates, or repeatable unit economics. Kill criteria should include missed production
              milestones, inability to demonstrate safe operations in degraded environments, or a persistent gap between
              advertised payload/range and accepted aircraft performance.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
      - number: '7.3'
        title: Partner, contract, and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              Elroy Air's demand evidence is promising but not equivalent to revenue. The March company release
              describes a backlog of more than 1,000 aircraft, while the September release describes a commercial demand
              pipeline exceeding 1,400 aircraft and more than $5 billion of potential revenue. The September release's
              transaction-risk language explicitly says the pipeline consists of non-binding letters of intent and
              memoranda of understanding that may not convert to binding orders or future revenue. Bristow's role as
              early customer and partner provides a credible route into Gulf Coast operations, but it also concentrates
              early validation in one operating ecosystem. DroneDJ reports that the PIPE commitment expanded to $175
              million, with $75 million provided before the planned business combination; the same article says the
              company is moving from demonstrations toward production at scale. This is financing capacity, not proof of
              cash runway, burn, gross margin, or production sufficiency. The principal financial risk is that
              certification, manufacturing, and customer conversion consume capital faster than the public financing
              plan supports. Monitoring should focus on binding purchase orders, deposits and cancellation terms,
              production acceptance, cash burn, and whether the business combination closes on the stated terms.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR012
              - CR013
              - CR015
      - number: '7.4'
        title: Residual exposure and thesis-break indicators
        blocks:
          - type: paragraph
            body: >-
              Elroy Air has several risk mitigants: government-funded development, FAA and state engagement through
              eIPP, demonstrations with cargo under air-traffic-control oversight, and a manufacturing relationship with
              Kratos. These mitigants are meaningful but mostly milestone- or plan-based. They do not establish
              commercial reliability, customer retention, or positive unit economics. The residual risk map therefore
              places certification and production execution in the high-likelihood/high-impact quadrant, while contract
              conversion and financing sufficiency remain high-impact risks with lower public observability. An investor
              should require a measurable progression from authorized demonstrations to recurring operations, from
              non-binding demand signals to binding orders, and from committed financing to audited liquidity and
              production output. If any one of those conversions fails, the announced strategic validation may remain
              real while the investable commercial thesis breaks. The most decision-useful diligence requests are the
              certification plan and open findings, flight and maintenance logs, manufacturing quality metrics, customer
              contract terms, and a cash-use bridge through first deliveries.
            claimRefs:
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR006
              - CR010
              - CR013
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The core risk is conversion, not concept validation
            body: >-
              The public record supports meaningful demonstrations and government interest, but it does not yet
              establish certified recurring service, binding commercial revenue, production yield, or audited liquidity.
            calloutType: risk
            claimRefs:
              - CR002
              - CR007
              - CR010
              - CR011
              - CR013
          - type: callout
            title: Government funding reduces technical risk selectively
            body: >-
              The Army contract funds difficult autonomy, navigation, communications, and field-operation work; it does
              not remove the separate commercial certification, manufacturing, and customer-conversion risks.
            calloutType: insight
            claimRefs:
              - CR005
              - CR006
              - CR009
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The evidence supports research-more rather than buy. Reuters reported a planned SPAC combination valued at
              roughly $1 billion and at least $165 million of committed investor proceeds, while later reporting
              described $175 million of PIPE commitments with $75 million already funded. Those are financing facts, not
              revenue or cash-on-hand proof. The investment case has real strategic support: Lockheed Martin Ventures
              participated, a multi-year Army contract is reported at up to $46 million, and the company has
              regulatory-pilot and manufacturing milestones. The counterweight is that the order book is repeatedly
              described as a pipeline or preorder set, and public sources do not disclose recognized revenue, gross
              margin, burn, runway, cancellation terms, or the conversion rate from reservations to delivered aircraft.
              At this evidence level, entry discipline should require either a materially lower price or
              audited/public-company financial disclosure that demonstrates production economics and funded execution.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV015
      - number: '8.2'
        title: Thesis, anti-thesis, and value drivers
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Elroy can convert differentiated aircraft capability and strategic counterparties into
              a defensible middle-mile logistics platform. Chaparral is described as a hybrid-electric VTOL system
              designed for heavy payloads and long range, and the company has reported a federal integration pilot,
              defense work, Bristow engagement, and Kratos manufacturing support. These signals can reduce technology
              and market-entry risk, but they do not remove certification, reliability, service, and working-capital
              risk. The anti-thesis is therefore specific: the announced valuation may capitalize a non-binding or
              early-stage demand pipeline before delivery, revenue recognition, and unit economics are observable. The
              most important value drivers are aircraft acceptance, repeatable production, regulatory permissions,
              customer deposits and milestone payments, and contribution margin per mission. Multiples identifies Tesla
              and General Motors as listed references and Zipline, Cowarobot, Dexterity, and UISEE as private
              references, but their business mix, maturity, and disclosed metrics are not sufficiently comparable to
              support a target multiple. Until operating data are disclosed, comparable-company valuation is a
              directional reference rather than a justified target multiple.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: Scenarios, downside triggers, and diligence
        blocks:
          - type: paragraph
            body: >-
              A bull case requires the SPAC closing, the funded PIPE remaining available for production, late-2026
              aircraft output, and early customer or defense deployments converting into paid, repeatable operations. A
              base case assumes financing closes but commercialization takes longer and the pipeline converts gradually,
              requiring additional capital before positive unit economics. A bear case is triggered by a delayed or
              repriced transaction, redemptions that reduce proceeds, failed certification or flight reliability,
              manufacturing delays, or preorder cancellations; in that case dilution and multiple compression can
              overwhelm strategic validation. Public evidence does not support assigning precise probabilities or a
              precise fair-value range, so the scenario table uses qualitative probability signals and explicitly leaves
              revenue-based valuation inputs unresolved. Before underwriting price, diligence should obtain the signed
              transaction documents, cap table and preference stack, cash balance and use-of-proceeds schedule, backlog
              definitions, contract enforceability, cancellation rights, production cost per aircraft, warranty
              obligations, and independent operating data.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV010
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwrite conversion, not headlines
            body: >-
              The decisive diligence question is whether reported demand and strategic milestones convert into paid
              deliveries, durable margins, and cash visibility before the approximately $1 billion value is accepted.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV010
              - CV015
          - type: callout
            title: Downside trigger
            body: >-
              A delayed SPAC close, reduced proceeds, or failure to convert preorders into recognized revenue would
              increase dilution and weaken the basis for the announced valuation.
            calloutType: risk
            claimRefs:
              - CV012
              - CV013
              - CV014
