              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption is driven by a clear operational proposition: more than 500 pounds of stated payload, up to 450
              miles of stated range, vertical operation, and no fixed runway requirement. The Louisiana eIPP flights add
              evidence that the concept can carry real cargo without an onboard pilot while operating under
              air-traffic-control oversight. They do not establish unrestricted nationwide authority or repeatable
              commercial economics. GMI identifies certification, corridor access, specialized handling, infrastructure,
              maintenance, compliance, labor, and utilization as major constraints, especially for heavy-lift systems.
              Investors should therefore treat broad market CAGRs as category context, not valuation support. The
              value-inflecting evidence would be binding orders, production deliveries, route-level reliability, fleet
              supervision ratios, maintenance burden, customer pricing, and contribution margins across representative
              defense and commercial lanes.
            claimRefs:
              - CM003
              - CM004
              - CM012
              - CM013
              - CM016
