        title: Execution milestones and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              The 2026 record shows movement from program selection toward flight operations and production planning.
              Chaparral was selected for the federal eVTOL Integration Pilot Program, completed autonomous uncrewed
              demonstrations in Louisiana under air-traffic-control oversight, and is slated for U.S. production by
              Kratos. Independent reporting also describes an Army development contract worth up to $46 million, but the
