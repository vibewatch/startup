  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Elroy Air belongs in the heavy autonomous cargo-aircraft segment, not the entire drone economy. Chaparral
              is aimed at middle-mile routes linking logistics hubs, industrial sites, offshore locations, remote
              communities, and austere defense positions where runway access or conventional transport is constrained.
              The relevant spend can include the aircraft, modular payload system, autonomy, route operations,
              maintenance, and enabling airspace services. Consumer last-mile drones, inspection aircraft, and passenger
              eVTOLs are outside the core boundary unless they compete for the same logistics budget. Status-quo
              substitutes are trucks, helicopters, crewed cargo aircraft, and smaller drones; each can remain preferable
              when roads, runways, payload, distance, or utilization make autonomy uneconomic.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM016
      - number: '2.2'
        title: Sizing lenses, not a company TAM
        blocks:
          - type: paragraph
            body: >-
              The two retained market studies show category growth but materially different endpoints. MarketsandMarkets
              estimates USD 1.53 billion in 2024 rising to USD 8.92 billion in 2030 at a 34.2% CAGR. GMI estimates USD
              2.1 billion in 2025, USD 2.8 billion in 2026, and USD 58.8 billion in 2035 at about a 40.1% CAGR. GMI's
              narrower 2025 starting values are USD 413.42 million for hybrid VTOL and USD 406.86 million for payloads
              above 100 kg, both relevant to Chaparral but overlapping rather than additive. Different dates,
              definitions, and forecast methods prevent these values from corroborating one TAM. None isolates routes
              Elroy Air can legally serve, customers it can win, pricing, utilization, or production capacity, so a
              defensible SAM and SOM remain unavailable.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
