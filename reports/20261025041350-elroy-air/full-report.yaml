        title: Transaction stage, financing, and stakeholder alignment
        blocks:
          - type: paragraph
            body: >-
              Elroy Air and Columbus Circle Capital Corp II announced a definitive business combination on June 26,
              2026, with closing expected in the fourth quarter subject to shareholder, regulatory, and other
              conditions. The announcement used an $800 million pre-money equity value and an approximately $1.0 billion
              post-transaction enterprise value. It also disclosed more than $165 million of committed PIPE capital and
              $65 million funded at signing; DroneDJ later reported commitments expanded to $175 million and $75 million
