  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Chaparral is designed as a cargo-first aircraft rather than a passenger eVTOL. The public product
              description combines vertical takeoff and landing, fixed-wing cruise, a hybrid-electric powertrain,
              autonomous flight, and detachable cargo pods. Its target workflow is the middle mile: move heavy cargo
              between distribution hubs, industrial sites, offshore locations, or austere destinations without a runway
              or charging station. The customer-facing unit is therefore not only an aircraft; it is an
              aircraft-plus-pod-plus-operating-concept system. This distinction matters because the observed
              demonstrations prove selected flight and delivery functions, not yet a complete recurring logistics
              service with disclosed dispatch, maintenance, or lane economics. Public descriptions also position the
              same platform for commercial, defense, humanitarian, and disaster-response missions, which expands the
              addressable use cases but increases configuration, certification, and support complexity.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE007
              - CE010
      - number: '5.2'
        title: Architecture, modularity, and demonstrated maturity
        blocks:
          - type: paragraph
            body: >-
              The architecture has several concrete, testable layers. The aircraft uses eight vertical-lift rotors and
              four forward-flight propellers, while the hybrid system supplies electric propulsion without requiring
              ground charging infrastructure. Detachable and swappable pods are intended to let one airframe support
              different cargo and mission profiles. In December 2025, Elroy Air reported an autonomous 213-pound,
              2.6-mile point-to-point delivery using its Hatch Load Pod; in August 2026, external coverage described a
              week-long Louisiana campaign with payloads of at least 150 pounds under air-traffic-control oversight. The
              Army-related tests add three unattended delivery modes: hover release, forward-flight release, and ground
              release. These are meaningful maturity signals because they exercise aircraft control, payload handling,
              and operational integration separately. They do not establish fleet-level reliability, all-weather
              performance, production repeatability, or commercial certification. The patent listing further indicates
              intellectual-property activity around cargo handling, mission pods, aerodynamic encasement, and hybrid
              VTOL systems, but a listing is not proof of granted scope or freedom to operate.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
