  - id: FE001
    title: Chaparral product architecture map
    type: stack
    summary: >-
      Chaparral combines autonomous mission software, hybrid-electric propulsion, modular cargo handling, and
      partner-enabled operating integration.
    data:
      layers:
        - label: Mission and autonomy
          detail: Pre-programmed coordinates and uncrewed flight control support reported unattended delivery execution.
        - label: Air vehicle
          detail: Eight vertical-lift rotors and four forward-flight propellers support VTOL and cruise.
        - label: Power system
          detail: >-
            Hybrid-electric architecture is designed to avoid ground charging infrastructure; endurance data is not
            disclosed.
        - label: Cargo interface
          detail: Swappable cargo pods and the Hatch Load Pod support multiple payload and mission profiles.
        - label: Operating ecosystem
          detail: FAA/ATC test integration and Kratos manufacturing are reported deployment dependencies.
        - label: Trust and compliance
          detail: >-
            BVLOS, detect-and-avoid, cybersecurity, maintenance, and reporting requirements remain evidence
            dependencies.
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE010
  - id: FU001
    title: Evidence-based customer adoption journey
    type: journey-map
    summary: >-
      Public evidence advances from mission definition and customer input through demonstrations and forward
      commitments, but has not reached disclosed repeat production economics.
    data:
      nodes:
        - id: qualify-lane
          label: Qualify a high-friction lane
          detail: Identify middle-mile, offshore, remote, or contested logistics where runway independence matters.
          touchpoints:
            - FedEx sortation network
            - Bristow Gulf Coast operations
            - Army contested logistics
        - id: co-design
          label: Co-design operating requirements
          detail: Customer and operator input shapes payload, infrastructure, safety, and network integration needs.
          touchpoints:
            - FedEx collaboration since 2020
            - Bristow as early customer and partner
        - id: demonstrate
          label: Demonstrate autonomous cargo flight
          detail: Flight milestones establish capability before a customer-specific production deployment.
          touchpoints:
            - 25-mile autonomous flights
            - 213-pound point-to-point cargo flight
        - id: supervised-operations
          label: Run regulator-observed operations
          detail: The Louisiana eIPP campaign moved varied cargo under air-traffic-control oversight.
          touchpoints:
            - LIFTOff Louisiana
            - Bristow Group
            - FAA and public agencies
        - id: commitment
          label: Convert interest into commitments
          detail: >-
            Reservations and development contracts provide stronger proof than pipeline claims, but have different
            economics.
          touchpoints:
            - 15 Bristow early-delivery positions
            - U.S. Army multi-year development award
        - id: production-expansion
          label: Prove production and expansion
          detail: Aircraft delivery, recurring paid use, retention, and contract economics remain the unverified next stage.
          touchpoints:
            - Late-2026 first-production expectation
            - No disclosed retention or concentration cohorts
    approximationNotes: >-
      The sequence represents evidence maturity, not elapsed time, conversion rates, revenue, or the probability that a
      reservation becomes a delivered aircraft.
    claimRefs:
      - CU003
      - CU006
      - CU008
      - CU012
      - CU014
      - CU016
