      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Public evidence identifies two concrete buyer channels. The U.S. Army funds development and testing for
              contested logistics, making government research and procurement budgets an early payer. Bristow, LIFTOff
              Louisiana, and offshore users represent a commercial path in which an aviation operator integrates
              autonomous cargo into existing industrial workflows. Elroy Air has also described logistics,
              rapid-response, and humanitarian applications, but public demand indicators are not equivalent to paid
              deployment. The 2023 backlog exceeding 1,000 aircraft was company-announced and included commitments such
              as letters of intent. Bristow's later 15 early-delivery reservations and separate potential purchase
              framework are useful signals, yet pricing, deposits, cancellation rights, delivery timing, and end-user
              budgets remain undisclosed.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
