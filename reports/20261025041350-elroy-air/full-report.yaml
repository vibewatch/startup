              - CE010
      - number: '5.3'
        title: Deployment, integration, and trust constraints
        blocks:
          - type: paragraph
            body: >-
              Deployment is progressing through partner and government test environments rather than a disclosed
              production fleet. The Louisiana eVTOL Integration Pilot Program campaign placed Chaparral in an operating
              environment with an airport, air-traffic control, state transportation stakeholders, and Bristow; Kratos
              is identified as the U.S. manufacturing partner. That model may reduce the gap between aircraft
              development and operational integration, but it also creates dependencies on partners, production
              execution, and regulator acceptance. The regulatory evidence is explicitly forward-looking: the ABA
              describes an FAA/TSA BVLOS proposal with area approvals, automated data-service providers,
              detect-and-avoid requirements, cybersecurity controls, and reporting obligations. DLA Piper reports
              industry concerns about case-by-case area approvals, one-way visibility gaps, manual-control limitations,
              and the burden on smaller operators. For Chaparral, these are product requirements as much as legal
              issues: command-and-control links, navigation redundancy, cybersecurity, maintenance records, and
              configuration control could determine whether demonstrations convert into repeatable revenue operations.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Product diligence verdict
        blocks:
          - type: paragraph
            body: >-
              The strongest product evidence is the progression from an autonomous point-to-point delivery to larger
              payload tests in an integrated airspace setting and then to unattended delivery modes for an Army
              contract. The platform's differentiators are coherent: cargo-only design, VTOL access, hybrid-electric
              range without charging infrastructure, modular pods, and autonomy for locations where a pilot or receiving
              crew is costly or unsafe. The evidence is weaker on the operating system around the aircraft. No assigned
              source supplies dispatch reliability, sortie denominator, maintenance burden, failure rates, production
              yield, cybersecurity test results, completed certification, or realized customer economics. The next
              diligence step should therefore be an aircraft-and-operations evidence package: flight-log denominators by
              weather and payload, failure and abort taxonomy, maintenance hours, software and configuration-control
              records, production acceptance data, regulatory approvals, and customer lane-level performance. Until
              those records exist, the product should be treated as a technically credible but scale-unproven aircraft
              program rather than an operationally mature logistics network.
            claimRefs:
              - CE006
              - CE007
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Coherent cargo-first design
            body: >-
              The product thesis links VTOL access, hybrid-electric range, modular pods, and autonomy to a specific
              middle-mile logistics workflow rather than a generic air-mobility proposition.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: callout
            title: Demonstration is not fleet maturity
            body: >-
              The assigned evidence does not disclose dispatch reliability, maintenance burden, production yield, cyber
              test results, or completed routine operating approvals.
            calloutType: risk
            claimRefs:
