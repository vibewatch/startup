  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying centers
        blocks:
          - type: paragraph
            body: >-
              The public customer record spans three distinct buying systems rather than one homogeneous market. FedEx
              represents an express-logistics network buyer evaluating hub-to-hub movement, with network planning and
              operations users shaping requirements for rural and island lanes. Bristow represents an aviation-services
              channel and prospective operator serving offshore energy customers, while the U.S. Army is a government
              development customer focused on contested logistics. Louisiana's eIPP participation adds a public-private
              deployment channel, not a conventional recurring customer. These segments have different procurement
              cycles, operating approvals, service models, and payers, so aggregate aircraft-demand claims should not be
              treated as a uniform commercial backlog.
            claimRefs:
              - CU003
              - CU004
              - CU007
              - CU009
              - CU012
