        title: Leadership and governance visibility
        blocks:
          - type: paragraph
            body: >-
              June and September 2026 materials identify Andrew Clare as chief executive officer and make him the
              principal public spokesperson for financing, product, and regulatory milestones. An older Aerospace
              America article quotes Dave Merrill as CEO, establishing that a leadership transition occurred, but the
              fetched record does not date or explain that change. The assigned sources do not establish Elroy Air's
