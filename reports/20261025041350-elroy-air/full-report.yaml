        - Price-sensitive
        - Require a lower entry price or verified production and cash-flow evidence.
      - - Target return / exit
        - null
        - No defensible target return or exit multiple can be calculated from public inputs.
    notes: >-
      The table separates reported financing or transaction values from revenue, cash, and operating metrics. Null means
      the assigned public evidence does not support a numeric target.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV015
  - id: TV002
    title: Thesis / anti-thesis
    columns:
      - Argument
      - Supporting evidence
      - What would change the view
    rows:
      - - Strategic demand can be real
        - Defense contract, Bristow engagement, and federal pilot are reported.
        - Signed paid orders and delivered aircraft with repeat usage.
      - - Capital access is a strength
        - $175M PIPE commitments are reported; $75M was already funded.
        - Verified closing, cash balance, and restricted-use schedule.
      - - Manufacturing path is more credible
        - Kratos is reported as exclusive U.S. manufacturer for initial production.
        - Production acceptance, throughput, cost, and warranty data.
      - - Valuation remains vulnerable
        - The roughly $1B value is paired with limited publicly disclosed revenue.
        - Audited revenue, backlog quality, margin, and cash-conversion disclosure.
      - - Pipeline is not equivalent to sales
        - Public reporting distinguishes preorders or potential pipeline from revenue.
        - Binding contracts, deposits, cancellation terms, and recognized revenue.
      - - Comparable evidence is weak
        - The identified public and private references differ in maturity, economics, and business mix.
        - Comparable revenue, margin, growth, and capital-intensity data on a consistent basis.
    notes: >-
      Company-issued or syndicated statements are treated as claims requiring contract-level verification; competitor
      comparisons are not used as independent valuation benchmarks.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Key risk or trigger
    rows:
      - - Bull
        - Transaction closes; PIPE funds production; late-2026 output and early paid deployments occur.
        - Upside could be justified only if delivery revenue and margins validate the platform.
        - Low-to-medium; milestone evidence exists but scaled delivery is unproven.
        - Production, certification, or customer conversion misses.
      - - Base
        - Transaction closes with slower ramp; pipeline converts gradually; more capital is needed.
        - Dilution and time-to-revenue constrain returns at the announced value.
        - Medium; consistent with current disclosure gaps.
        - Cash burn, redemptions, and contract timing.
      - - Bear
        - Deal slips or reprices; production or regulatory milestones fail; orders cancel.
        - Downside is severe because value is tied to future execution rather than current revenue.
        - Material; adverse reporting highlights limited revenue and preorder risk.
        - SPAC failure, failed reliability, or weak unit economics.
    notes: >-
      Scenarios are qualitative because the assigned evidence does not disclose a revenue base, margin, cash balance,
      share count, or enforceable backlog sufficient for a numeric valuation range.
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
figures:
  - id: FO001
    title: 2026 company milestone timeline
    type: timeline
    summary: >-
      Public milestones show rapid financing and operating progress, while several late-2026 items remain planned or
      conditional.
    data:
      items:
        - date: '2026-03-16'
          label: Federal pilot-program selection
          detail: A syndicated company release said Chaparral was selected for the USDOT eVTOL Integration Pilot Program.
          tone: positive
        - date: By 2026-06-26
          label: Defense-program history disclosed
          detail: >-
            The transaction announcement claimed more than six years of active programs with the Army, Marine Corps, and
            Air Force.
          tone: neutral
        - date: '2026-06-26'
          label: Definitive business combination announced
          detail: >-
            Elroy Air and CMII announced an agreement using an $800 million pre-money value and approximately $1.0
            billion enterprise value.
          tone: positive
        - date: '2026-06-26'
          label: Initial PIPE funding disclosed
          detail: More than $165 million was committed and $65 million was described as funded at BCA execution.
          tone: neutral
        - date: '2026-08-18'
          label: Army development contract reported
          detail: >-
            Independent sources reported a multi-year Chaparral contract worth up to $46 million; official obligations
            remain unverified.
          tone: neutral
        - date: Late August 2026
          label: Autonomous Louisiana flight campaign
          detail: Chaparral flew without a pilot onboard under air-traffic-control oversight during an eIPP demonstration.
          tone: positive
        - date: '2026-09-28'
          label: PIPE commitments expanded
          detail: DroneDJ reported $175 million committed and $75 million provided.
          tone: positive
        - date: Late 2026 (planned)
          label: First Kratos-built production aircraft
          detail: Management and reporting identify late 2026 as the production target; completion is not established.
          tone: neutral
        - date: Q4 2026 (expected)
          label: Transaction closing
          detail: Closing remains subject to shareholder, regulatory, and customary conditions.
          tone: risk
    approximationNotes: >-
      Dates marked planned or expected are forward-looking, and the public record available to this chapter does not
      support a complete pre-2026 timeline.
