            title: Demand claims are not contracted revenue
            body: >-
              Public pipeline, backlog, reservations, potential purchases, and contract ceilings use different
              definitions. Underwriting should rely on a counterparty-level schedule of funded commitments, deposits,
              cancellation rights, deliveries, and recognized revenue rather than summing those figures.
            calloutType: risk
            claimRefs:
