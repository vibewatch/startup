      - number: '6.2'
        title: Adoption trajectory remains pre-production
        blocks:
          - type: paragraph
            body: >-
              Adoption evidence has progressed from customer design input to increasingly realistic flight
              demonstrations. Autonomy Global reported 25-mile autonomous flights in September 2025 and a later
              213-pound cargo flight over 2.6 miles. In August 2026, DroneDJ reported a week-long eIPP campaign in
              Louisiana with Bristow and mixed real-world cargo under air-traffic-control oversight. Those events show
              operational learning, but they do not establish recurring paid service, fleet utilization, dispatch
              reliability, or unit economics. Bristow's 15 early-delivery positions and a potential purchase framework
              are stronger forward commitments, yet production was still expected for late 2026. The evidence therefore
              supports a pre-production adoption trajectory, not scaled commercial deployment.
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU008
              - CU009
              - CU014
