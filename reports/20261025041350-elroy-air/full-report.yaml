      - number: '6.3'
        title: Named proof is real but uneven
        blocks:
          - type: paragraph
            body: >-
              FedEx, Bristow, and the U.S. Army provide three different grades of customer proof. FedEx supplied
              operational requirements and described intended tests, but the retained sources do not document completed
              FedEx network operations. Bristow participated in the 2026 Louisiana campaign and expanded early delivery
              positions, which is stronger than a logo but remains short of a disclosed production fleet purchase. The
              Army agreement is the clearest paid development signal: a company-issued release called it a $46 million
              multi-year award, while independent coverage described it as worth up to $46 million. That distinction
              matters because a contract ceiling is not the same as recognized revenue or cash collected.
            claimRefs:
