      - number: '6.4'
        title: Durability, expansion, and concentration remain unquantified
        blocks:
          - type: paragraph
            body: >-
              The strongest expansion evidence is directional: Bristow increased early delivery positions from five to
              15, and Elroy Air separately reported large demand figures. Those figures are not directly comparable. A
              March 2026 company release cited a backlog above 1,000 aircraft, while September reporting relayed a
              company claim of more than 1,400 aircraft and more than $5 billion of potential future revenue. Neither
              disclosure defines firm orders, deposits, cancellation rights, expected delivery timing, or customer
              concentration. No retained source reports NRR, GRR, churn, renewal, contract length, repeat paid
              utilization, or revenue by counterparty. Until management supplies a contract-level schedule and operating
              cohorts, demand durability and land-and-expand economics remain material diligence gaps.
            claimRefs:
              - CU008
