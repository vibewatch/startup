    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and product
        blocks:
          - type: paragraph
            body: >-
              Elroy Air is a U.S.-based autonomous-aircraft developer focused on heavy-cargo logistics for defense,
              commercial, and rapid-response missions. The assigned evidence identifies a facility in Byron, California,
              but does not establish a complete location count, legal headquarters record, or founding date. Its core
              product is Chaparral, a runway-independent hybrid-electric VTOL with modular cargo pods. June and
              September 2026 sources describe a design target above 500 pounds and up to 450 miles; a March syndicated
              release instead described 300 pounds and 300 miles. That discrepancy may reflect product evolution, but
              the evidence does not explain it. LeadIQ's 11-50 employee band is a third-party estimate rather than a
              company-verified headcount.
