callouts:
  - calloutType: strength
    title: Operating evidence moved beyond a static prototype
    body: >-
      The Louisiana campaign placed an uncrewed Chaparral in an FAA-supervised
      operating environment with real cargo, while Kratos provides a named U.S.
      manufacturing path.
    claimRefs: [CO008, CO009]
  - calloutType: risk
    title: Headline demand is not contracted backlog
    body: >-
      The transaction disclosure says the 1,400-aircraft pipeline is made up of
      non-binding letters of intent and memorandums of understanding, so neither
      the aircraft count nor the $5 billion opportunity should be treated as revenue.
    claimRefs: [CO007]
