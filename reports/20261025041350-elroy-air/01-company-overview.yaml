company:
  name: Elroy Air
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Elroy Air is a California developer of the autonomous, hybrid-electric Chaparral
    cargo VTOL and is pursuing a late-2026 SPAC combination at an announced $800
    million pre-money valuation. Production, regulatory, financing, and commercial
    conversion remain execution risks: PIPE commitments are not the same as cash
    available, and the disclosed demand pipeline is explicitly non-binding.
sections:
  - id: identity-and-product
    title: Identity, footprint, and product
    body: >-
      Elroy Air is a U.S.-based autonomous-aircraft developer focused on heavy-cargo
      logistics for defense, commercial, and rapid-response missions. The assigned
      evidence identifies a facility in Byron, California, but does not establish a
      complete location count, legal headquarters record, or founding date. Its core
      product is Chaparral, a runway-independent hybrid-electric VTOL with modular
      cargo pods. June and September 2026 sources describe a design target above 500
      pounds and up to 450 miles; a March syndicated release instead described 300
      pounds and 300 miles. That discrepancy may reflect product evolution, but the
      evidence does not explain it. LeadIQ's 11-50 employee band is a third-party
      estimate rather than a company-verified headcount.
    claimRefs: [CO001, CO002, CO010, CO016]
    tableRefs: [TO001]
  - id: transaction-and-capital
    title: Transaction stage, financing, and stakeholder alignment
    body: >-
      Elroy Air and Columbus Circle Capital Corp II announced a definitive business
      combination on June 26, 2026, with closing expected in the fourth quarter
      subject to shareholder, regulatory, and other conditions. The announcement
      used an $800 million pre-money equity value and an approximately $1.0 billion
      post-transaction enterprise value. It also disclosed more than $165 million of
      committed PIPE capital and $65 million funded at signing; DroneDJ later reported
      commitments expanded to $175 million and $75 million provided. These amounts
      should not be treated as unrestricted cash available because closing, release,
      redemption, fees, and use-of-proceeds details remain unresolved. The company's
      1,400-aircraft and $5 billion pipeline is expressly composed of non-binding
      expressions of interest, not recognized revenue or firm backlog.
    claimRefs: [CO003, CO004, CO005, CO006, CO007]
    tableRefs: [TO003]
  - id: leadership-and-governance
    title: Leadership and governance visibility
    body: >-
      June and September 2026 materials identify Andrew Clare as chief executive
      officer and make him the principal public spokesperson for financing, product,
      and regulatory milestones. An older Aerospace America article quotes Dave
      Merrill as CEO, establishing that a leadership transition occurred, but the
      fetched record does not date or explain that change. The assigned sources do
      not establish Elroy Air's founders, current executive bench, board composition,
      voting control, or succession arrangements. As a result, founder-market fit,
      functional coverage, and key-person dependence cannot be fully assessed.
      The proposed transaction adds public-company governance requirements, but a
      definitive proxy/prospectus is still needed to evaluate post-close control.
    claimRefs: [CO003, CO013, CO014]
    tableRefs: [TO002]
  - id: execution-milestones-and-risk
    title: Execution milestones and regulatory exposure
    body: >-
      The 2026 record shows movement from program selection toward flight operations
      and production planning. Chaparral was selected for the federal eVTOL
      Integration Pilot Program, completed autonomous uncrewed demonstrations in
      Louisiana under air-traffic-control oversight, and is slated for U.S.
      production by Kratos. Independent reporting also describes an Army development
      contract worth up to $46 million, but the assigned evidence lacks an official
      award record showing obligations, milestones, or revenue recognition. Scale-up
      remains exposed to certification and operating approvals. GAO reported that
      FAA electric-aircraft certification was case-by-case as of March 2026 and cited
      limited standardization and specialist staffing challenges; an older industry
      account similarly described no settled approval path for autonomous cargo
      flights. These are sector constraints, not proof that Elroy Air will fail, but
      they weaken confidence in management timelines.
    claimRefs: [CO008, CO009, CO011, CO012, CO015]
    figureRefs: [FO001]
