chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Elroy Air addresses a narrower heavy-payload, runway-independent middle-mile
    market than headline cargo-drone forecasts imply. Defense procurement and
    commercial flight trials support the use case, but public evidence does not
    yet establish a company-specific SAM, SOM, or repeatable route economics.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      Elroy Air belongs in the heavy autonomous cargo-aircraft segment, not the
      entire drone economy. Chaparral is aimed at middle-mile routes linking
      logistics hubs, industrial sites, offshore locations, remote communities,
      and austere defense positions where runway access or conventional transport
      is constrained. The relevant spend can include the aircraft, modular
      payload system, autonomy, route operations, maintenance, and enabling
      airspace services. Consumer last-mile drones, inspection aircraft, and
      passenger eVTOLs are outside the core boundary unless they compete for the
      same logistics budget. Status-quo substitutes are trucks, helicopters,
      crewed cargo aircraft, and smaller drones; each can remain preferable when
      roads, runways, payload, distance, or utilization make autonomy uneconomic.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses, not a company TAM
    body: >-
      The two retained market studies show category growth but materially
      different endpoints. MarketsandMarkets estimates USD 1.53 billion in 2024
      rising to USD 8.92 billion in 2030 at a 34.2% CAGR. GMI estimates USD 2.1
      billion in 2025, USD 2.8 billion in 2026, and USD 58.8 billion in 2035 at
      about a 40.1% CAGR. GMI's narrower 2025 starting values are USD 413.42
      million for hybrid VTOL and USD 406.86 million for payloads above 100 kg,
      both relevant to Chaparral but overlapping rather than additive. Different
      dates, definitions, and forecast methods prevent these values from
      corroborating one TAM. None isolates routes Elroy Air can legally serve,
      customers it can win, pricing, utilization, or production capacity, so a
      defensible SAM and SOM remain unavailable.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyers, users, payers, and adoption path
    body: >-
      Public evidence identifies two concrete buyer channels. The U.S. Army funds
      development and testing for contested logistics, making government research
      and procurement budgets an early payer. Bristow, LIFTOff Louisiana, and
      offshore users represent a commercial path in which an aviation operator
      integrates autonomous cargo into existing industrial workflows. Elroy Air
      has also described logistics, rapid-response, and humanitarian applications,
      but public demand indicators are not equivalent to paid deployment. The
      2023 backlog exceeding 1,000 aircraft was company-announced and included
      commitments such as letters of intent. Bristow's later 15 early-delivery
      reservations and separate potential purchase framework are useful signals,
      yet pricing, deposits, cancellation rights, delivery timing, and end-user
      budgets remain undisclosed.
    claimRefs: [CM010, CM011, CM012, CM014, CM015]
    tableRefs: [TM003]
  - id: drivers-constraints-and-valuation
    title: Growth drivers, constraints, and valuation relevance
    body: >-
      Adoption is driven by a clear operational proposition: more than 500 pounds
      of stated payload, up to 450 miles of stated range, vertical operation, and
      no fixed runway requirement. The Louisiana eIPP flights add evidence that
      the concept can carry real cargo without an onboard pilot while operating
      under air-traffic-control oversight. They do not establish unrestricted
      nationwide authority or repeatable commercial economics. GMI identifies
      certification, corridor access, specialized handling, infrastructure,
      maintenance, compliance, labor, and utilization as major constraints,
      especially for heavy-lift systems. Investors should therefore treat broad
      market CAGRs as category context, not valuation support. The value-inflecting
      evidence would be binding orders, production deliveries, route-level
      reliability, fleet supervision ratios, maintenance burden, customer pricing,
      and contribution margins across representative defense and commercial lanes.
    claimRefs: [CM003, CM004, CM012, CM013, CM016]
