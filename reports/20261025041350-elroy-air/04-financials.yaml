callouts:
  - calloutType: strength
    title: Funded transition toward production
    body: "The expanded PIPE commitment, funded tranche, Army program, and named manufacturing partner provide a credible financing-and-execution path into production, subject to transaction completion and delivery execution."
    claimRefs: [CI001, CI002, CI006, CI008]
  - calloutType: risk
    title: Pipeline is not revenue
    body: "The largest public commercial number is a potential pipeline built from non-binding instruments and changing aircraft counts; it should not be treated as booked revenue, ARR, cash available, or a margin forecast."
    claimRefs: [CI003, CI007, CI013]
  - calloutType: recommendation
    title: Gate underwriting on cash and contract schedules
    body: "Before relying on the announced valuation, require audited or management-provided revenue, cash, burn, runway, gross-margin, backlog-conversion, deposit, and working-capital schedules."
    claimRefs: [CI014, CI015, CI016]
