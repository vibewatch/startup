company:
  name: Elroy Air
chapter:
  number: 4
  title: Financials
  summary: Elroy Air has assembled meaningful committed capital and a substantial stated aircraft demand pipeline, but the assigned public evidence does not disclose realized revenue, gross margin, burn, runway, or contract-level cash mechanics. The underwriting case therefore depends on converting non-binding demand and funded development programs into production aircraft and recurring or repeatable delivery economics.
sections:
  - id: capital-and-demand
    title: Capital base and demand conversion
    body: >-
      The strongest current financial signal is financing capacity rather than reported operating performance. Elroy Air's own news index states that previously disclosed PIPE commitments were expanded to $175 million and that $75 million had been funded. The same index describes a proposed business combination with a $800 million pre-money valuation, more than $165 million of committed PIPE capital, and proceeds intended to fund commercial-scale Chaparral production. A separate market report describes a target post-transaction enterprise value of approximately $1.0 billion and more than $165 million of committed PIPE capital, while also warning that the demand pipeline is largely non-binding. These are financing and forward-looking transaction disclosures, not cash-on-hand, revenue, or free-cash-flow measures.

      Demand evidence is also substantial but not equivalent to booked revenue. Elroy Air reports more than 1,000 aircraft in a demand backlog in its USDOT program announcement, while a later independent report says the commercial demand pipeline exceeds 1,400 aircraft and represents more than $5 billion of potential future revenue. The variation in reported counts and the use of backlog, pipeline, reservations, letters of intent, and potential revenue across sources make conversion and contract quality the key diligence issue. Bristow's 15 early delivery positions and the Army's $46 million multi-year development contract indicate counterparties and program funding, but neither establishes a product revenue run-rate or the timing of customer cash receipts.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007, CI013]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: monetization-and-cost-drivers
    title: Monetization and cost drivers
    body: >-
      The public record supports a hardware-and-program monetization model: Chaparral aircraft are intended for commercial logistics, defense, and rapid-response use; the Army award funds development and testing; and Kratos is identified as the exclusive U.S. manufacturing partner. The sources do not provide a customer list-price schedule, realized selling price, deposit accounting, milestone-payment structure, cancellation rights, warranty reserve, support fee, or revenue-recognition policy. Official product specifications are therefore useful for identifying the unit being sold, but they cannot be used as a proxy for price, gross margin, or customer lifetime value.

      Cost structure is likely to be dominated by aircraft development, certification and testing, manufacturing ramp, payload and autonomy integration, field support, and working capital for production. The disclosed production target is late 2026, and the Army contract includes an initial fiscal-year 2026 obligation of $5.1 million within a $46.1 million firm-fixed-price award according to an independent aviation report. Those figures provide program scale and timing, but not Elroy Air's consolidated cash burn or contribution margin. A credible underwriting model still needs unit-level bill of materials, supplier terms, production learning curves, labor content, maintenance obligations, and the allocation of government-program costs.
    claimRefs: [CI006, CI008, CI009, CI010, CI011, CI012]
    tableRefs: [TI002, TI003]
  - id: underwriting-verdict
    title: Financial underwriting verdict
    body: >-
      Elroy Air's capital plan appears designed to bridge the company from flight testing into production, but public evidence does not establish that the committed financing is sufficient for certification, manufacturing ramp, customer support, and working-capital needs under a downside schedule. The $175 million expanded PIPE commitment is not the same as cash available: the company says $75 million has been funded, while the proposed transaction remains subject to regulatory and shareholder approval and may include redemption-dependent proceeds. The company also describes an Abu Dhabi manufacturing joint venture and a late-2026 U.S. production start, adding execution and funding dependencies that should be modeled separately from the core aircraft program.

      The financial verdict is consequently conditional. Positive evidence includes strategic investors, the Army development award, early delivery reservations, and a manufacturing partner. Negative or unresolved evidence includes non-binding demand instruments, inconsistent public pipeline counts, absent realized revenue and margin disclosure, and no public bridge from committed capital to monthly burn and runway. The next financing decision should be gated on audited or management-provided revenue, cash, burn, runway, gross-margin, backlog-conversion, and contract-liability schedules rather than on the announced valuation or potential pipeline alone.
    claimRefs: [CI001, CI002, CI003, CI004, CI007, CI008, CI013, CI014, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Unit, Current value/status, Quality, Diligence ask]
    rows:
      - [Commercial aircraft, "Sale or delivery of Chaparral aircraft for logistics operators", aircraft, "15 early delivery positions reserved by Bristow; revenue timing undisclosed", "Company-reported reservation signal; not booked revenue", "Obtain binding order schedule, deposits, delivery milestones, cancellations, and recognized-revenue policy"]
      - [Defense development programs, "Firm-fixed-price development and test work for government customers", contract, "$46.1 million Army award; $5.1 million initially obligated in FY2026", "Third-party reported contract values; contract economics incomplete", "Obtain contract accounting, allowable-cost treatment, milestones, backlog, and collection schedule"]
      - [Commercial demand pipeline, "Potential future aircraft demand from logistics and aviation customers", aircraft / potential revenue, "More than 1,400 aircraft and more than $5 billion potential revenue reported by an independent source", "Pipeline estimate; much of the pipeline is non-binding", "Reconcile LOIs, MOUs, reservations, binding orders, unit prices, and conversion rates"]
      - [Manufacturing and strategic programs, "Production partnership and related strategic expansion", program, "Kratos exclusive U.S. manufacturing; first production aircraft expected late 2026", "Operational milestone; economics undisclosed", "Obtain manufacturing agreement, tooling/capex commitments, transfer prices, and working-capital needs"]
    notes: "Sources mix company announcements and independent reporting; pipeline, reservations, contract awards, and production milestones are not interchangeable revenue measures."
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI010, CI013]
  - id: TI002
    title: Pricing and monetization disclosure
    columns: [Monetization item, Public price or term, List vs realized, Evidence status, Underwriting implication, Diligence ask]
    rows:
      - [Chaparral aircraft selling price, null, "Not disclosed", "No assigned source provides a list or realized aircraft price", "Cannot translate aircraft pipeline into revenue or gross profit", "Obtain price book, customer-specific pricing, escalation clauses, and realized ASPs"]
      - [Bristow reservation economics, null, "Reservation positions are disclosed; deposits and milestone terms are not", "15 early delivery positions reported; deposit amount not provided", "Cash timing and cancellation exposure are unknown", "Obtain deposit, refund, milestone, acceptance, and cancellation terms"]
      - [Army program economics, "$46.1 million award; $5.1 million initial FY2026 obligation", "Contract value is not product ASP", "Independent reporting identifies award structure and initial obligation", "Program revenue may be milestone- or cost-accounting-dependent", "Obtain full award, performance obligations, billing schedule, and cost base"]
      - [Support and service monetization, null, "Not disclosed", "No assigned source provides support fees, maintenance pricing, or warranty reserves", "Lifecycle margin and recurring revenue are unmodeled", "Obtain service-level obligations, spares, warranty, and maintenance assumptions"]
    notes: "Nulls mean the assigned public source set did not disclose the requested price or term; they are not zero values."
    claimRefs: [CI005, CI006, CI010, CI011, CI012]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Realized average selling price, null, low, "Determines revenue conversion from aircraft demand", "Obtain executed-order ASPs by customer and configuration"]
      - [Gross margin, null, low, "Determines whether production scale creates contribution economics", "Obtain audited gross-margin bridge by program and aircraft generation"]
      - [Monthly cash burn, null, low, "Determines how long committed capital supports production and certification", "Obtain 24-month cash-flow forecast and actual monthly burn"]
      - [Runway, null, low, "Determines next-round trigger and financing dependency", "Reconcile cash funded, restricted cash, commitments, debt, capex, and downside runway"]
      - [Customer acquisition cost / payback, null, low, "Tests commercial efficiency for logistics and defense channels", "Obtain sales-cycle, channel-fee, bid-cost, and payback data"]
      - [Working-capital requirement per aircraft, null, low, "Tests whether demand growth consumes cash before delivery", "Obtain supplier terms, inventory turns, deposits, milestone receipts, and build schedule"]
    notes: "All unavailable unit-economics fields require company diligence; no null is treated as zero or estimated from the valuation."
    claimRefs: [CI001, CI002, CI013, CI014, CI016]
