companyProfile:
  summary: >-
    Elroy Air is a California developer of autonomous hybrid-electric vertical-takeoff-and-landing aircraft focused on
    heavy-cargo middle-mile logistics, defense, and rapid-response use cases. Its Chaparral platform is progressing from
    demonstrations and government programs toward planned production, supported by Bristow, Kratos, Lockheed Martin
    Ventures, and other strategic relationships. The public record does not yet establish commercial revenue, scaled
    delivery economics, or the enforceability and conversion of reported demand.
  foundingLocation: California, United States
  headquarters: San Francisco Bay Area, CA
  productSummary: >-
    Chaparral is an autonomous hybrid-electric VTOL cargo aircraft designed to operate without runways, carry heavy
    modular payloads, and support commercial logistics, defense, humanitarian, and rapid-response missions.
  customerFocus: Logistics operators, defense organizations, government programs, and industrial or energy customers
  businessModel: Aircraft and development-program monetization with manufacturing and strategic partnerships
