  evidenceGaps:
    - type: missing-source
      severity: material
      topic: pricing
      missingEvidence: "Comparable aircraft prices, service contracts, deposits, cancellation rights, maintenance terms, and realized route-level revenue."
      whyItMatters: "Without a comparable commercial package, buyer switching costs and competitive economics cannot be underwritten."
      diligencePath: "Request executed customer and partner contract summaries, list-price schedules, and maintenance/support assumptions under confidentiality."
      relatedQuestionRefs: [QP005]
      relatedTableRefs: [TP003]
    - type: conflicting-data
      severity: material
      topic: capability
      missingEvidence: "A current, configuration-specific Chaparral specification separating design maximums from the operating profile used in customer missions."
      whyItMatters: "Conflicting payload and range descriptions change the set of directly comparable aircraft and mission economics."
      diligencePath: "Obtain the current aircraft configuration, payload-range curve, reserve assumptions, and test-condition disclosure from management."
      relatedQuestionRefs: [QP002, QP010]
      relatedTableRefs: [TP001, TP002]
    - type: missing-source
      severity: material
      topic: moat
      missingEvidence: "Independent dispatch, sortie, maintenance, incident, utilization, and customer-renewal data from commercial or defense operations."
      whyItMatters: "Deployment announcements and backlog do not demonstrate a durable operating advantage over helicopters, trucks, or competing UAS."
      diligencePath: "Request anonymized mission logs, reliability metrics, service-bulletin history, and customer reference calls covering completed operations."
      relatedQuestionRefs: [QP003, QP008, QP009]
      relatedTableRefs: [TP002]
