company:
  name: Nuro
chapter:
  number: 1
  title: Company Overview
  summary: Nuro is a Mountain View autonomous-vehicle software company founded in 2016 by former Google self-driving engineers. The refreshed public evidence keeps the company in a pre-commercial but better-capitalized position, with a $203M Series E, a $6B valuation, roughly 700 employees, and a Lucid-Uber robotaxi program now tied to reported Uber commitments near $500M.
sections:
- id: identity-business-model
  title: Company Identity and Business Model
  body: Nuro is a Mountain View autonomy company that has reoriented around software licensing and partner deployment. The current public picture combines a strong founder pedigree, a large strategic robotaxi partnership, and public claims of driverless scale, but the exact commercial terms remain undisclosed. The public record is still incomplete, so each section is written as a current-state snapshot that separates hard facts from inferences and open diligence gaps. That is especially important for Nuro because the company is private, the Lucid-Uber program is still launching, and exact pricing, exclusivity and cash-burn details remain undisclosed. The refresh therefore preserves the gap list even while updating the strongest public facts, and it should be read as a diligence memo rather than a finished underwriting file.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO005
  - CO008
  - CO011
  tableRefs:
  - TO001
- id: leadership-governance
  title: Leadership and Governance
  body: The public executive slate is compact and founder-led. That is good for focus and bad for key-person concentration, especially because the commercial story still hinges on a small set of strategic counterparties and a relatively thin public disclosure set. The public record is still incomplete, so each section is written as a current-state snapshot that separates hard facts from inferences and open diligence gaps. That is especially important for Nuro because the company is private, the Lucid-Uber program is still launching, and exact pricing, exclusivity and cash-burn details remain undisclosed. The refresh therefore preserves the gap list even while updating the strongest public facts, and it should be read as a diligence memo rather than a finished underwriting file.
  claimRefs:
  - CO009
  - CO010
  - CO011
  - CO012
  tableRefs:
  - TO002
  - TO003
- id: milestones-and-gaps
  title: Milestones, Partnerships and Open Gaps
  body: The refreshed milestone line now includes a larger reported Uber commitment and current California permitting progress. The biggest open issues are contractual and operational rather than basic identity questions, which means the main diligence work is now on economics and execution. The public record is still incomplete, so each section is written as a current-state snapshot that separates hard facts from inferences and open diligence gaps. That is especially important for Nuro because the company is private, the Lucid-Uber program is still launching, and exact pricing, exclusivity and cash-burn details remain undisclosed. The refresh therefore preserves the gap list even while updating the strongest public facts, and it should be read as a diligence memo rather than a finished underwriting file.
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO008
