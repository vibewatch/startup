chapter:
  number: 5
  title: Product & Technology
  summary: Nuro's product story is now the Nuro Driver autonomy stack, not a proprietary delivery robot fleet. The public evidence points to a vehicle-agnostic, partner-deployed autonomy platform with growing internal AI tooling and a still-partially opaque architecture.
sections:
- id: product-definition
  title: Product Definition and Workflow
  body: The product is now a software stack, not a robot fleet. Nuro Driver is the commercial core, and the workflow shifts from building vehicles to integrating autonomy with partners like Lucid and operating a deployment / validation loop. The public record is still incomplete, so each section is written as a current-state snapshot that separates hard facts from inferences and open diligence gaps. That is especially important for Nuro because the company is private, the Lucid-Uber program is still launching, and exact pricing, exclusivity and cash-burn details remain undisclosed. The refresh therefore preserves the gap list even while updating the strongest public facts, and it should be read as a diligence memo rather than a finished underwriting file.
  claimRefs:
  - CE001
  - CE004
  - CE005
  tableRefs:
  - TE001
  - TE002
- id: architecture-and-ops
  title: Architecture and Operating Model
  body: 'Public materials point to a layered architecture: vehicle hardware from partners, autonomy software from Nuro, deployment / testing operations, and internal tooling that speeds engineering. That is a credible software platform story, but the detailed stack remains only partially disclosed. The public record is still incomplete, so each section is written as a current-state snapshot that separates hard facts from inferences and open diligence gaps. That is especially important for Nuro because the company is private, the Lucid-Uber program is still launching, and exact pricing, exclusivity and cash-burn details remain undisclosed. The refresh therefore preserves the gap list even while updating the strongest public facts, and it should be read as a diligence memo rather than a finished underwriting file.'
  claimRefs:
  - CE002
  - CE003
  - CE006
  - CE008
  tableRefs:
  - TE003
- id: differentiation-and-trust
  title: Differentiation, Safety and Trust Controls
  body: Nuro's differentiator is not a single component; it is the combination of autonomy software, prior driverless operating experience and partner-grade deployment. Safety and trust controls are central because the product only works within a constrained operating domain. The public record is still incomplete, so each section is written as a current-state snapshot that separates hard facts from inferences and open diligence gaps. That is especially important for Nuro because the company is private, the Lucid-Uber program is still launching, and exact pricing, exclusivity and cash-burn details remain undisclosed. The refresh therefore preserves the gap list even while updating the strongest public facts, and it should be read as a diligence memo rather than a finished underwriting file.
  claimRefs:
  - CE007
  - CE009
  - CE010
  - CE011
  - CE012
  figureRefs:
  - FE001
