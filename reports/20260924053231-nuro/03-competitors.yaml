company:
  name: Nuro
chapter:
  number: 3
  title: Competitors
  summary: Nuro competes with mature robotaxi platforms, AV software licensors, and platform partners that can multi-source autonomy. The competitive issue is less who has the prettiest demo and more who can convert safety, integration and fleet supply into durable distribution.
sections:
- id: competitor-landscape
  title: Landscape and Direct Peers
  body: The most relevant competitors are not just other robotaxi operators but also platform partners that can multi-source autonomy. Waymo and Zoox are the clearest direct robotaxi references, while Mobileye and Aurora are the strongest adjacent licensing analogues. The public record is still incomplete, so each section is written as a current-state snapshot that separates hard facts from inferences and open diligence gaps. That is especially important for Nuro because the company is private, the Lucid-Uber program is still launching, and exact pricing, exclusivity and cash-burn details remain undisclosed. The refresh therefore preserves the gap list even while updating the strongest public facts, and it should be read as a diligence memo rather than a finished underwriting file.
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP005
  tableRefs:
  - TP001
- id: differentiation
  title: Differentiation and Distribution
  body: Nuro's differentiation is an asset-light licensing model plus partner distribution. That matters because the program can scale without owning the whole fleet, but it also means Nuro is exposed to partner bargaining power and supply-chain dependence. The public record is still incomplete, so each section is written as a current-state snapshot that separates hard facts from inferences and open diligence gaps. That is especially important for Nuro because the company is private, the Lucid-Uber program is still launching, and exact pricing, exclusivity and cash-burn details remain undisclosed. The refresh therefore preserves the gap list even while updating the strongest public facts, and it should be read as a diligence memo rather than a finished underwriting file.
  claimRefs:
  - CP004
  - CP006
  - CP008
  - CP012
  tableRefs:
  - TP002
  - TP003
- id: moat-and-risk
  title: Moat Durability and Adverse Evidence
  body: The moat question is whether safety, integration and partner relationships outrun commoditization. Public evidence suggests the moat is real but not yet unassailable, especially given Uber's multi-sourcing behavior and the absence of a second OEM. The public record is still incomplete, so each section is written as a current-state snapshot that separates hard facts from inferences and open diligence gaps. That is especially important for Nuro because the company is private, the Lucid-Uber program is still launching, and exact pricing, exclusivity and cash-burn details remain undisclosed. The refresh therefore preserves the gap list even while updating the strongest public facts, and it should be read as a diligence memo rather than a finished underwriting file.
  claimRefs:
  - CP007
  - CP009
  - CP010
  - CP011
  figureRefs:
  - FP001
