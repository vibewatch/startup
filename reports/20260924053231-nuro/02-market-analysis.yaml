company:
  name: Nuro
chapter:
  number: 2
  title: Market Analysis
  summary: The addressable market for Nuro is the intersection of robotaxi demand, AV software licensing, and fleet-platform distribution. Public evidence still supports a very large TAM, but the real market is gated by regulation, utilization, and partner willingness to underwrite autonomous fleets.
sections:
- id: market-boundary
  title: Market Boundary and Substitutes
  body: Nuro lives at the intersection of robotaxi software licensing, ride-hailing distribution and fleet operations. The relevant market is not general transportation, but the slice of autonomy spend that converts into licensable, regulator-approved fleet deployment. The public record is still incomplete, so each section is written as a current-state snapshot that separates hard facts from inferences and open diligence gaps. That is especially important for Nuro because the company is private, the Lucid-Uber program is still launching, and exact pricing, exclusivity and cash-burn details remain undisclosed. The refresh therefore preserves the gap list even while updating the strongest public facts, and it should be read as a diligence memo rather than a finished underwriting file.
  claimRefs:
  - CM001
  - CM002
  - CM003
  tableRefs:
  - TM001
- id: sizing-lenses
  title: Sizing Lenses and Adoption Drivers
  body: Public market sizing remains fragmented. The most defensible approach is to preserve multiple lenses — analyst forecasts, strategic partner rollout counts and platform-level demand signals — instead of forcing one false precision number. The public record is still incomplete, so each section is written as a current-state snapshot that separates hard facts from inferences and open diligence gaps. That is especially important for Nuro because the company is private, the Lucid-Uber program is still launching, and exact pricing, exclusivity and cash-burn details remain undisclosed. The refresh therefore preserves the gap list even while updating the strongest public facts, and it should be read as a diligence memo rather than a finished underwriting file.
  claimRefs:
  - CM004
  - CM005
  - CM006
  - CM008
  tableRefs:
  - TM002
  figureRefs:
  - FM001
- id: buyer-map
  title: Buyers, Payers and Constraints
  body: 'The buyer map is B2B: OEMs, fleet operators and ride-hailing platforms. Adoption depends on regulatory approvals, trust and utilization, which is why the current public market is still smaller than the theoretical total addressable market. The public record is still incomplete, so each section is written as a current-state snapshot that separates hard facts from inferences and open diligence gaps. That is especially important for Nuro because the company is private, the Lucid-Uber program is still launching, and exact pricing, exclusivity and cash-burn details remain undisclosed. The refresh therefore preserves the gap list even while updating the strongest public facts, and it should be read as a diligence memo rather than a finished underwriting file.'
  claimRefs:
