    - Determines upside if rides launch
  - - Support / services
    - Project or maintenance layer
    - 'No'
    - Likely bundled or partner-paid
    - Could smooth early revenue
  notes: Exact pricing is not public; this table intentionally focuses on structure rather than a fabricated dollar figure.
