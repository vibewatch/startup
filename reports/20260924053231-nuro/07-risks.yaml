company:
  name: Nuro
chapter:
  number: 7
  title: Risks
  summary: Nuro's key risks remain regulatory, partner, operational and financial. The biggest near-term blockers are not technology demos but permit timing, Lucid dependence and Uber's willingness to keep multi-sourcing autonomy.
sections:
- id: regulatory-risks
  title: Regulatory and Legal Risks
  body: Commercialization is still gated by permits and by the move from testing to fully driverless commercial service. The public record shows progress, but it also shows that California remains the core bottleneck. The public record is still incomplete, so each section is written as a current-state snapshot that separates hard facts from inferences and open diligence gaps. That is especially important for Nuro because the company is private, the Lucid-Uber program is still launching, and exact pricing, exclusivity and cash-burn details remain undisclosed. The refresh therefore preserves the gap list even while updating the strongest public facts, and it should be read as a diligence memo rather than a finished underwriting file.
  claimRefs:
  - CR001
  - CR012
  tableRefs:
  - TR001
- id: operational-risks
  title: Operational and Safety Risks
  body: Operational risk is mainly about edge cases, integration and trust. Nuro has good partner materials and internal tooling, but public disengagement data for the Lucid program remains absent. The public record is still incomplete, so each section is written as a current-state snapshot that separates hard facts from inferences and open diligence gaps. That is especially important for Nuro because the company is private, the Lucid-Uber program is still launching, and exact pricing, exclusivity and cash-burn details remain undisclosed. The refresh therefore preserves the gap list even while updating the strongest public facts, and it should be read as a diligence memo rather than a finished underwriting file.
  claimRefs:
  - CR002
  - CR005
  - CR006
  - CR009
  tableRefs:
  - TR002
  figureRefs:
  - FR001
- id: partner-and-financial-risks
  title: Partner, Financial and Thesis-break Risks
  body: 'The largest concentration risk is partner dependence: Lucid for hardware and Uber for distribution. If either side slows or multi-sources away, the whole commercialization path weakens quickly. The public record is still incomplete, so each section is written as a current-state snapshot that separates hard facts from inferences and open diligence gaps. That is especially important for Nuro because the company is private, the Lucid-Uber program is still launching, and exact pricing, exclusivity and cash-burn details remain undisclosed. The refresh therefore preserves the gap list even while updating the strongest public facts, and it should be read as a diligence memo rather than a finished underwriting file.'
  claimRefs:
  - CR003
  - CR004
  - CR007
  - CR008
  - CR010
  - CR011
  tableRefs:
  - TR003
