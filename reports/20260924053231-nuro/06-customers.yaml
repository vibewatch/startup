  title: Customers
  summary: The refreshed customer picture is still partner-led. Lucid and Uber are the public anchor counterparties, while the actual end-customer demand story remains in pilot or launch-planning mode rather than broad recurring usage.
sections:
- id: customer-base
  title: Customer Base and Segmentation
  body: The customer story is still partner-led and B2B. Lucid is the OEM, Uber is the distribution layer, and the eventual end customer is the rider — but public evidence is still sparse on any broader customer cohort or recurring revenue base. The public record is still incomplete, so each section is written as a current-state snapshot that separates hard facts from inferences and open diligence gaps. That is especially important for Nuro because the company is private, the Lucid-Uber program is still launching, and exact pricing, exclusivity and cash-burn details remain undisclosed. The refresh therefore preserves the gap list even while updating the strongest public facts, and it should be read as a diligence memo rather than a finished underwriting file.
  claimRefs:
  - CU001
  - CU004
  - CU009
  - CU010
  tableRefs:
  - TU001
- id: adoption-proof
  title: Adoption Proof and Trajectory
  body: The strongest proof today is partnership momentum and regulatory testing, not mature paid usage. The rollout target size is large, but that is still a target; the public evidence stops short of a broad production service. The public record is still incomplete, so each section is written as a current-state snapshot that separates hard facts from inferences and open diligence gaps. That is especially important for Nuro because the company is private, the Lucid-Uber program is still launching, and exact pricing, exclusivity and cash-burn details remain undisclosed. The refresh therefore preserves the gap list even while updating the strongest public facts, and it should be read as a diligence memo rather than a finished underwriting file.
  claimRefs:
  - CU002
  - CU003
  - CU008
  - CU012
  tableRefs:
  - TU002
  - TU003
- id: concentration-and-expansion
  title: Concentration and Expansion
  body: 'Customer concentration is the biggest issue: the program depends on one OEM and one ride-hailing platform. Expansion would need more cities, more OEMs or more fleet operators, but those are not yet publicly confirmed. The public record is still incomplete, so each section is written as a current-state snapshot that separates hard facts from inferences and open diligence gaps. That is especially important for Nuro because the company is private, the Lucid-Uber program is still launching, and exact pricing, exclusivity and cash-burn details remain undisclosed. The refresh therefore preserves the gap list even while updating the strongest public facts, and it should be read as a diligence memo rather than a finished underwriting file.'
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU011
  figureRefs:
  - FU001
