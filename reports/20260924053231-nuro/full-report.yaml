companyProfile:
  summary: >-
    Nuro is a Mountain View-based autonomous vehicle software company founded in 2016 by former Google self-driving
    engineers Jiajun Zhu and Dave Ferguson. After building its own delivery robots, the company pivoted to licensing the
    Nuro Driver autonomy stack to automakers and mobility platforms. Its current public commercialization path is the
    Lucid-Uber robotaxi program, which has reportedly triggered a large Uber commitment and moved through California
    testing milestones in 2026.
