company:
  name: Nuro
chapter:
  number: 8
  title: Valuation
  summary: Nuro still screens as a conditional hold / track rather than a clear buy. The $6B mark is defensible only if the Lucid-Uber rollout, California permissions and recurring licensing economics convert from narrative to measurable commercialization.
sections:
- id: thesis-and-antithesis
  title: Investment Thesis and Anti-thesis
  body: 'The bull case is simple: strategic backing, a massive robotaxi market, and a software licensing model that can scale without owning every vehicle. The anti-thesis is equally clear: the public evidence is still thin on revenue, and partner concentration is high. The public record is still incomplete, so each section is written as a current-state snapshot that separates hard facts from inferences and open diligence gaps. That is especially important for Nuro because the company is private, the Lucid-Uber program is still launching, and exact pricing, exclusivity and cash-burn details remain undisclosed. The refresh therefore preserves the gap list even while updating the strongest public facts, and it should be read as a diligence memo rather than a finished underwriting file.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV012
  tableRefs:
  - TV001
  - TV002
- id: scenarios-and-comps
  title: Comparables and Scenario Logic
  body: Nuro should be valued against AV software and robotaxi peers, not against consumer car OEMs. In that frame, the $6B mark is plausible but not yet obviously cheap, and the bear case still has material downside if commercialization slips. The public record is still incomplete, so each section is written as a current-state snapshot that separates hard facts from inferences and open diligence gaps. That is especially important for Nuro because the company is private, the Lucid-Uber program is still launching, and exact pricing, exclusivity and cash-burn details remain undisclosed. The refresh therefore preserves the gap list even while updating the strongest public facts, and it should be read as a diligence memo rather than a finished underwriting file.
  claimRefs:
  - CV004
  - CV005
  - CV006
  - CV008
  - CV009
  tableRefs:
  - TV003
- id: decision-and-asks
  title: Decision, Confidence and Final Diligence Asks
  body: The right stance remains track / conditional hold. More proof is needed on paid commercialization, second-OEM expansion and recurring revenue before the price can be treated as fully supported. The public record is still incomplete, so each section is written as a current-state snapshot that separates hard facts from inferences and open diligence gaps. That is especially important for Nuro because the company is private, the Lucid-Uber program is still launching, and exact pricing, exclusivity and cash-burn details remain undisclosed. The refresh therefore preserves the gap list even while updating the strongest public facts, and it should be read as a diligence memo rather than a finished underwriting file.
  claimRefs:
  - CV007
  - CV010
  - CV011
  figureRefs:
  - FV001
