figures:
  - id: FO001
    title: Nuro 里程碑时间线（2016–2026）
    type: timeline
    summary: 截至 2026 年最新审视，梳理公司创立、融资历程、战略转型、生态合作及加州监管审批节点。
    data:
      items:
        - label: 创立
          date: '2016'
          detail: Jiajun Zhu 与 Dave Ferguson 在 Mountain View 创立 Nuro
          tone: positive
        - label: NHTSA 豁免
          date: '2020'
          detail: 公司着重提及首项自动驾驶豁免里程碑
          tone: positive
        - label: 转向技术授权
          date: '2024'
          detail: 公司及媒体报道披露业务重心由无人配送车转向软件授权
          tone: neutral
        - label: E 轮 $203M / $6B
          date: 2025-08
          detail: TechCrunch 报道最新一轮融资与估值
          tone: positive
        - label: Lucid-Uber Robotaxi 项目
          date: 2025-2026
          detail: 公开宣布合作，推动 Nuro 业务拓展至载人出行
