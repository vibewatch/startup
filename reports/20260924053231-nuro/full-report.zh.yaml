companyProfile:
  summary: >-
    Nuro 总部位于 Mountain View，由曾任 Google 自动驾驶工程师的 Jiajun Zhu 和 Dave Ferguson 于 2016 年创立。公司早期自研配送机器人，后来转为向车企和出行平台授权 Nuro
    Driver 自动驾驶技术栈。眼下公开的商业化路径是 Lucid-Uber Robotaxi 项目；据报道，该项目带来了 Uber 的大额资金承诺，且 Nuro 于 2026 年推进了加州测试里程碑。
  foundedDate: '2016-01-01'
  founders:
