      - number: '2.5'
        title: Contradictions, Adverse Evidence, and What Remains Unknowable
        blocks:
          - type: paragraph
            body: >-
              The adverse view is not that launch demand is imaginary; it is that market openness may still fail to
              convert into share for Relativity on investable timelines. The clearest evidence is the NSSL sequence
              itself: the Space Force wants more entrants, yet Relativity still had to delay its bid because the vehicle
              will not be flight-ready inside the first award window, and even an on-ramped newcomer cannot win task
              orders before a successful inaugural mission. The same issue appears in commercial agreements. SES,
              Intelsat, and OneWeb validate customer interest, but none of the public disclosures provide per-launch
              pricing, deposits, cancellation protection, or exact mission counts sufficient to convert backlog into a
              defensible SOM. Public market lenses also mix incompatible units: total space-economy value, commercial
              share, launch-service TAM, procurement ceilings, and company backlog. Investors should therefore treat the
              chapter's range estimates as bounded lenses rather than a single precise market model. The most important
              diligence gaps are mission-level contract economics, the exact timeline from first flight to
              certification, and the payload-mix assumptions needed to sustain a high annual cadence.
            claimRefs:
              - CM020
              - CM033
              - CM034
              - CM035
              - CM039
              - CM040
