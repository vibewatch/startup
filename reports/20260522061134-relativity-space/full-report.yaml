          - type: callout
            title: What has to be true for a premium valuation to work
            body: >-
              A premium to the clean 2021 benchmark requires more than a first launch headline. It requires launch
              proof, customer stickiness, transparent economics, and evidence that the Schmidt transaction delayed
              rather than guaranteed a punitive recap.
