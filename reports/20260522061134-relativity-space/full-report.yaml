      - number: '5.5'
        title: Quality Controls and Remaining Technical Risks
        blocks:
          - type: paragraph
            body: >-
              Relativity is not asking investors or customers to trust marketing alone; the public record does show a
              serious test-and-quality stack. Across official updates and facility pages, the company describes
              vehicle-level CDR, structural acceptance campaigns, non-destructive evaluation, modal and load testing,
              wind-tunnel and CFD work on entry systems, hardware-in-the-loop and run-for-record software validation,
              cryogenic component yards, and a deep Stennis engine-test footprint. That is a real control surface. The
              remaining issue is not whether the company is testing, but whether testing has closed the last commercial
              unknowns. Reuse maturity is still unproven because Block 1 recovery has not yet been demonstrated in
              flight and public evidence says nothing about refurbishment time, inspection burden, or repeatability.
              Engine risk is lower than it was in 2023, but still present until Aeon R and the upper-stage engine
              graduate from component and engine campaigns to integrated stage and orbital performance. Hybrid
              manufacturing also cuts against the original additive purity story: it likely improves schedule realism,
              yet it introduces weld, machining, coating, and inspection interfaces that must all scale at launch
              cadence. The correct diligence posture is therefore constructive but not celebratory: Terran R looks
              materially real, but its hardest proof points are still ahead of it.
