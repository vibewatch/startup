      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Why backlog takes a valuation haircut
            body: >-
              Relativity has a demand problem solved more convincingly than it has a monetization problem solved. Until
              the company shows deposits, milestone payments, and successful launch delivery, pre-flight launch
              contracts should be valued below ARR or recognized revenue.
            calloutType: risk
