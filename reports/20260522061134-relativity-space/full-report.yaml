  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Technical Execution and Manufacturing Transition
        blocks:
          - type: paragraph
            body: >-
              Relativity's top operating risk is that Terran R is materially real but still commercially unproved. The
              company has genuine hardware momentum: vehicle-level CDR is complete, first-flight production has started,
              Aeon R qualification moved forward during 2025, and April 2026 updates say flight-one engines were built
              and shipped. None of that is the same as proving a full vehicle. Public sources still do not show an
              integrated stage hot-fire, an orbital Terran R mission, a landed booster, or any reflight evidence. That
              gap matters because the company already abandoned Terran 1 after one anomaly-hit mission and the reviewed
              record still lacks a publication-quality root-cause and corrective-action package for that failure. The
              manufacturing story also changed materially. The original all-printed narrative has become a hybrid
              program combining welded aluminum structures, in-house machining, and printed propulsion. That may be the
              right speed-to-market choice, but it expands the number of interfaces where defect escape, integration
              delay, or low yield can erode schedule and margin. Until Terran R flies and returns credible reliability
              data, failed reuse economics and further schedule slip remain the chapter's central technical transmission
              risk.
