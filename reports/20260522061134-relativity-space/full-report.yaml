  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Terran R customer journey from demand formation through selection, manifest holding, first-flight proof, and
      either expansion or attrition. The critical breakpoint is not contracting but the first successful payload
      delivery, because public proof is currently abundant before that point and sparse after it.
    data:
