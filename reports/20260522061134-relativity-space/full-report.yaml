  - id: FM001
    title: 'Market Sizing Pyramid: From Sector Context to Relativity''s Obtained Demand'
    type: pyramid
    layout: wide
    summary: >-
      Four nested lenses showing why Relativity's relevant launch market is far smaller than the headline space economy
      and why disclosed backlog is only a partial proxy for obtainable demand.
    data:
      items:
        - label: TAM — Global space economy by 2035
          value: $1.8T
          detail: WEF / McKinsey estimate covering the whole upstream and downstream space economy
        - label: SAM-1 — Commercial space economy in 2024
          value: ~$478B
          detail: 78% of Space Foundation's $613B total; still far broader than launch-provider revenue
        - label: SAM-2 — Launch-demand lens most relevant to constellations by 2030
          value: $10B to >$30B / year
          detail: >-
            Range between Rocket Lab / Quilty's narrower medium-lift lens and Relativity's broader constellation-launch
            claim
        - label: Adjacency — U.S. government launch pools
          value: $5.6B Lane 1 ceiling; $13.7B Lane 2 award context
          detail: Demand signal, but only Lane 1 is near-term adjacent for Terran R
        - label: Obtained demand — Publicly disclosed Relativity backlog
          value: '>$2.9B backlog'
          detail: More than a dozen customers per March 2025 company update; pricing and cancellation terms undisclosed
    approximationNotes: >-
      The commercial-space layer is a simple calculation: 78% of $613B = $478.14B. The pyramid is not a literal audited
      TAM/SAM/SOM bridge because public sources do not provide enough data to isolate Relativity's true SAM or convert
      backlog to annual revenue.
