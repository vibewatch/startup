      - number: '3.2'
        title: 'Incumbents and Assurance Alternatives: Vulcan and New Glenn Are Not Clean Apples-to-Apples'
        blocks:
          - type: paragraph
            body: >-
              Terran R also competes against vehicles whose edge is mission assurance rather than pure medium-lift
              substitution. ULA markets Vulcan around precision insertion, off-pad encapsulation, large-fairing
              handling, and multiple solid-booster configurations, and the Space Force is already allocating Phase 3
              Lane 2 missions to it. Those attributes make Vulcan relevant wherever the buyer values orbital complexity,
              payload handling discipline, or national-security heritage more than first-stage reuse. New Glenn belongs
              in that same diligence bucket, but the evidence pack is intentionally uneven. Spaceflight Now reported
              that Blue Origin had already flown New Glenn once and secured seven Lane 2 missions, yet the official New
              Glenn page was not cleanly accessible during this run because it returned a security-checkpoint block. The
              right conclusion is therefore restrained: New Glenn is clearly a serious heavy-lift and mission-assurance
