      - number: '2.3'
        title: Buyer / User / Payer Map
        blocks:
          - type: paragraph
            body: >-
              Buyer demand is already visible, but it is fragmented by mission type and by who actually controls the
              budget. On the commercial side, GEO and MEO fleet operators such as SES and Intelsat are buyers because
              they need high-reliability launches that put large communications spacecraft into serviceable orbits.
              Constellation operators such as OneWeb buy repeated deployment capacity and care more about batch
              economics, replenishment cadence, and launcher diversification. In U.S. government demand, the
              buyer-user-payer stack often splits three ways: the U.S. Space Force or Commercial Space Office pays,
              network operators such as OneWeb Technologies or Iridium deliver the service, and warfighters or
              government agencies are the actual users. That matters because Relativity does not have to sell only to
              satellite manufacturers or only to launch-procurement teams; it needs to map into procurement systems
              where resilience, responsiveness, and diversity are budgeted outcomes. NASA and earlier Space Force
              on-ramp programs show an adjacent path into government demand, but those pathways historically served
              smaller or more risk-tolerant missions than Terran R's target sweet spot.
