  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Additive Manufacturing Strategy and Product Surface
        blocks:
          - type: paragraph
            body: >-
              Relativity still sells a combined launch-and-manufacturing identity, but the product story has clearly
              evolved. The 2021 Terran R reveal promised an entirely 3D-printed, fully reusable rocket and linked that
              ambition to the company's software-defined factory thesis. The 2023 architecture update materially revised
              that posture: Terran R grew in size, first-stage reuse became the explicit priority, and initial vehicles
              moved to hybrid aluminum tank barrels instead of an all-printed primary structure. The March 2025 update
              made the trade even clearer by describing friction-stir-welded high-strength aluminum primary structures,
              in-house machining, and custom tooling for the vehicle, while retaining additive manufacturing where
              Relativity says it matters most for iteration speed and complexity: Aeon engines and other difficult
              parts. That does not mean the additive thesis disappeared. The Long Beach headquarters, the Portal R&D
              center, and the Horizon commercialization page all show Stargate and related robotics, simulation, and
              process-control capabilities still matter strategically. The difference is that additive is now positioned
              as one tool inside a broader factory system rather than as the literal manufacturing method for the whole
              launch vehicle.
