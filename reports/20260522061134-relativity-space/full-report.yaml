      - number: '7.4'
        title: Funding, Runway, and Strategic Drift
        blocks:
          - type: paragraph
            body: >-
              The financing risk is unusually important because this is a capital-intensive launch program that still
              sits ahead of recurring launch revenue. TechCrunch reported that Relativity hit cash shortages in 2024,
              struggled to raise money, and then accepted a Schmidt-led control transaction in March 2025. That likely
              reduced immediate insolvency risk, but it did not solve the disclosure problem: public sources still do
              not show the company's cash balance, burn rate, debt headroom, or the exact structure of Schmidt's
              investment. The private-market pages available to the public make the picture noisier rather than cleaner,
              with low-confidence claims of heavy historical burn, reverse-split mechanics, and sharply different
              valuation marks. Small government awards from NASA and AFRL help demonstrate that outside institutions
              will pay Relativity for launch or manufacturing work, but those awards are far too small to fund Terran R
              through repeated slip scenarios. Strategic drift is the adjacent concern. Public materials now talk not
              only about Terran R, but also Horizon Manufacturing Technologies, Dark Matter Lab, and a broader
              commercialization posture around the factory stack. That optionality could matter later, yet at this stage
              it also creates a real risk that management attention and scarce capital spread too widely before the core
              launch business is proven.
