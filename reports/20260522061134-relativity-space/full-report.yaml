            - Hybrid-manufacturing yield friction
            - First-flight slip or backlog-conversion stress
        - label: Likely
          values:
            - Strategic drift into adjacent ventures
            - Range or payload-processing coordination drag
            - Need for new capital before reusable-flight proof
        - label: Possible
          values:
