        title: Burn, Capital Intensity, and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              The public evidence strongly supports capital intensity, but not a precise runway model. Relativity's 2022
              Stargate release described a 1MM+ square foot headquarters, a factory that was only 33% operational at the
              time, more than a dozen planned giant printers, and a forecast run rate of four Terran R rockets per
              printer per year at full capacity. The current Terran R page and March 2025 update add engine
              qualification work, stage production, pad buildout, and a first-flight campaign that still sits ahead of
              revenue at scale. Those facts support an intuitive conclusion: this is a hardware- heavy, facility-heavy,
              labor-intensive development program whose cost base should remain elevated until Terran R flies
              repeatedly. Adverse reporting sharpens that picture. TechCrunch says the company faced cash shortages in
              2024 and struggled to raise more funding before Schmidt's investment, while TSG repeats an unverified
              claim that Relativity had burned through more than $1 billion and that Schmidt's check may have approached
              $800 million. The correct underwriting posture is therefore not that runway is safe, but that near-term
              insolvency risk may have eased while the exact burn rate, cash balance, debt obligations, and
              launch-to-cash conversion still remain undisclosed.
