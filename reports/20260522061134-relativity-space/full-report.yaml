  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Baseline: Falcon 9 Sets the Reference Price of Trust'
        blocks:
          - type: paragraph
            body: >-
              The most important competitive fact is not that Terran R aspires to Falcon 9-class payload; it is that
              Falcon 9 already operates at a scale that turns launch from a vehicle-spec debate into an execution-trust
              debate. Official SpaceX statistics show hundreds of Falcon 9 launches, landings, and reflights, and
              Aerospace America described Falcon 9 flying 165 times in 2025 alone. That operating record matters because
              Space Force procurement already treats SpaceX as the default commercial-like option: Spaceflight Now
              reported that Falcon 9 was the only vehicle with an actual Phase 3 Lane 1 task order at the time of its
              April 2025 breakdown. For diligence, that means Terran R is not entering a greenfield market. It is asking
              buyers to move work away from a reusable launcher that already blends competitive public pricing, proven
              cadence, and government trust. Terran R therefore needs more than comparable payload claims; it needs
              proof that a new manufacturing system, a new booster, and a new launch operation can close a trust gap
              that Falcon 9 has spent years compounding.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP029
              - CP030
