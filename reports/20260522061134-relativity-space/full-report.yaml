      - number: '8.4'
        title: Scenario Ranges and Judgment
        blocks:
          - type: paragraph
            body: >-
              The chapter's valuation stance is not that Relativity is worthless; it is that the supportable range is
              wide and milestone-dependent. The bull case can justify a recovery above the 2021 benchmark, but only if
              late-2026 first flight happens on schedule, early missions validate customer confidence, and backlog
              begins to translate into transparent deposits or recognized revenue without another punitive financing.
              The base case is more conservative: official demand and Schmidt's control investment keep the company
              fundable enough to matter, but the best-supported numeric zone still sits around roughly $3.0 billion to
              $4.2 billion because that brackets the low-confidence 2025 compression signals and the last clean 2021
              financing mark. The bear case is not theoretical. If launch timing slips again, if customers rebook to
              Falcon 9, Vulcan, or a fast-rising Neutron alternative, or if Schmidt capital only bridges to another
              dilutive recap, supportable value could fall materially below the current secondary-style indications.
              That leaves the recommendation price-sensitive and evidence-sensitive rather than
              company-quality-sensitive: at an opaque current valuation, the right stance is track or research-more, not
              buy. A decisive positive call needs proof of conversion, not just proof of ambition.
            claimRefs:
