        title: Funding History and Capital-Structure Context
        blocks:
          - type: paragraph
            body: >-
              The cleanest capital record in the public pack still stops at the June 2021 Series E. Relativity's own
              release says it closed a $650 million round led by Fidelity, with BlackRock, Coatue, Soroban, Tiger
              Global, Baillie Gifford, Mark Cuban, Jared Leto, and other prior backers in the syndicate. CNBC
              independently tied that round to $1.34 billion of total capital raised and a $4.2 billion valuation, while
              its earlier November 2020 coverage described the prior Series D as a $500 million raise at a post-money
              value around $2.3 billion. After that point the public record becomes noisy. KPMG's Q4'23 Venture Pulse
              and Yahoo/Forge both point toward a very large late-2023 Series F-style event, but Access IPO publishes a
              much smaller and contradictory Series F description, and none of those pages provide the governance
              package, security terms, or audited cap-table math needed to use them as canonical. The March 2025 reset
              is clearer on control than on price: TechCrunch says Eric Schmidt made a significant investment, took a
              controlling stake, and became CEO, but public sources still do not disclose the exact consideration,
              ownership percentage, reverse-split mechanics, or preferred rights tied to that transaction.
