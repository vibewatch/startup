              Lane 1 is strategically relevant because the Space Force wants more providers, but Relativity still cannot
              access that demand until after first flight and on-ramp. Lane 2 proves the dollar value of high-assurance
              government launch, yet its direct-GEO and mission-assurance requirements keep it outside Terran R's
              near-term revenue pool.
