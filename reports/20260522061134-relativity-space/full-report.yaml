      - number: '6.4'
        title: Trust, Schedule, and Durability Risk
        blocks:
          - type: paragraph
            body: >-
              Customer trust has to be analyzed through the Terran 1 reset. Iridium's original contract was for up to
              six as-needed Terran 1 launches, and Terran 1 then flew only once, reached stage separation, failed to
              achieve orbit, and was cancelled a month later as Relativity pivoted fully to Terran R. In April 2023,
              both Iridium and OneWeb publicly encouraged that pivot, which is a useful signal that customers preferred
              a larger, more relevant vehicle over continuing the smaller program. Still, support quotes are not the
              same as executed amendments or successful launches. Later schedule evidence remains supportive but
              cautionary: the company continues to publish late-2026 first-flight messaging, May 2026 updates show real
              hardware progress, and SpaceNews explains why the vehicle was not ready soon enough for the first NSSL
              Phase 3 round. The result is a chapter in which durability evidence exists mainly as customer patience
              rather than operational repeat usage. SES's expansion shows some customers are willing to keep waiting,
              but until Terran R flies, every customer relationship is still underwriting roadmap credibility more than
              proven service quality.
