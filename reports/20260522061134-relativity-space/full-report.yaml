      - number: '8.3'
        title: Competitive Proof Gap Versus the Market
        blocks:
          - type: paragraph
            body: >-
              A premium valuation also has to survive a maturity comparison, not just a market-size slide. The demand
              backdrop is real: the World Economic Forum and McKinsey project a $1.8 trillion space economy by 2035,
              while Space Foundation says the market hit $613 billion in 2024 and saw 149 launches in the first half of
              2025. But Relativity is trying to monetize that growth in a lane already occupied by flight-proven
              systems. SpaceX's own stats APIs show hundreds of launches, landings, and reflights, while AIAA summarizes
              the competitive problem bluntly: Neutron is being designed as a Falcon 9 alternative, yet Falcon 9
              launched 165 times in 2025 alone. Rocket Lab already has two disclosed Neutron missions, Lane 1
              eligibility, and a public narrative built around breaking the launch monopoly for constellation operators.
              ULA's Vulcan page emphasizes national-security readiness and higher-payload configurations. Even customer
              demand signals outside Relativity's backlog matter here. Eutelsat's order for 340 additional OneWeb
              satellites shows that constellation demand is still expanding, but it also underscores how valuable
              dependable launch cadence is to customers managing replacement cycles and network continuity. This is why
              competitor maturity belongs inside the valuation discussion: the benchmark is not abstract TAM, but
              whether Relativity can turn backlog into launches before proven alternatives absorb the same mission set.
