      - number: '7.3'
        title: Customer Trust, Backlog Convertibility, and Competition
        blocks:
          - type: paragraph
            body: >-
              The customer risk is not whether Relativity can quote backlog, but whether backlog survives a long path to
              first flight. Official and reported contract disclosures show a real commercial book: OneWeb, Intelsat,
              and SES all signed on, and the backlog headline climbed from roughly $1.2 billion in 2022 to more than
              $2.9 billion by March 2025. Those agreements are meaningful demand proof, but they are still
              pre-performance contracts on an unflown Terran R. The public announcements also leave key legal and
              economic details blank, including launch counts in many cases, deposits, cancellation rights, delay
              remedies, and top-customer concentration. That opacity matters more because competition is already mature.
              Falcon 9 is not just a theoretical rival; public statistics and independent reporting show enormous
              launch, landing, and reflight scale. Rocket Lab and ULA are also pressing into overlapping mission sets
              with Neutron and Vulcan, while Lane 2 national-security awards already went to Blue Origin, SpaceX, and
              ULA. The underwriting consequence is straightforward: if Terran R slips or disappoints on its first
              missions, customers have credible alternatives and the backlog can convert into rebookings, price
              concessions, or slower cash collection rather than into clean high-margin revenue.
