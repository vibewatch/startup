      - number: '5.2'
        title: Vehicle Architecture, Propulsion, and Mission Workflow
        blocks:
          - type: paragraph
            body: >-
              In customer terms, Terran R is being positioned as a reusable medium-to-heavy-lift launch service for the
              part of the market that sits between small launchers and the heaviest government-class vehicles. Official
              architecture materials describe a two-stage rocket with a 5-meter fairing sized for constellation batches,
              dedicated telecom missions, and multi-customer rideshares. The largest publicly visible design change
              versus the 2021 reveal is not cosmetic: the vehicle moved from a seven-engine first stage and an
              all-printed narrative to a 13-engine first stage with nine gimbaled center engines, four fixed outers, and
              a hybrid structural manufacturing path. Propulsion remains consistently methalox and gas-generator-cycle,
              with the upper-stage vacuum engine described as Aeon Vac in 2023 and Aeon V in 2025-2026 updates. Official
              reuse architecture centers on a downrange barge landing after a cold-gas flip, entry burn, grid-fin-guided
              descent, and landing burn. That workflow is specific enough to be credible as an engineering concept, but
              it remains a concept until a Terran R booster actually flies, lands, and demonstrates refurbishment and
              repeatability.
