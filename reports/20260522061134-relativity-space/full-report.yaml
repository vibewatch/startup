        title: Contract and Grant Anchors Help, but They Are Not a Launch P&L
        blocks:
          - type: paragraph
            body: >-
              The hard-dollar public awards in the pack are real but modest compared with the backlog headlines. NASA's
              VCLS Demo 2 announcement awarded Relativity a $3.0 million fixed-price contract in December 2020, and
              USAspending plus SpaceNews support a later $8.77 million AFRL additive-manufacturing award tied to
              real-time flaw detection research. Relativity's own OSP-4 announcement adds another useful distinction:
              the roughly $986 million ceiling describes a nine-year mission pool open to eligible providers, not booked
              company revenue. These records therefore anchor that government customers have spent actual dollars with
              the company, but they do not support a thesis that Relativity already has a recurring launch-services
              revenue engine at Terran R scale. One award is a small demonstration launch contract from the Terran 1
              era, one is manufacturing research rather than orbital service revenue, and one is only access to compete
              for future task orders. The broader space-economy numbers from Space Foundation and WEF/McKinsey reinforce
              the same caution: a large addressable market exists, but market size does not convert signed or
              theoretical demand into recognized launcher revenue.
