      - number: '3.5'
        title: 'Diligence Bottom Line: Backlog Competes Against Heritage, Not Just Specs'
        blocks:
          - type: paragraph
            body: >-
              The correct adverse framing is straightforward. Relativity has no operational Terran R, no demonstrated
              reuse, and no public evidence yet that its launch-service agreements translate into recurring flights on
              time and on economics that can win share from incumbents. Its customer proof is still meaningful: SES and
              Intelsat-family commitments show that commercial satellite operators want additional capacity and are
              willing to reserve future slots with a new entrant. But even those supportive statements emphasize
              resiliency, capacity expansion, and ecosystem diversification, not replacement of proven providers. The
              real diligence question is therefore not whether Terran R is interesting. It is whether first flight,
              booster recovery, post-flight refurbishment, and early mission performance happen quickly enough that
              backlog converts before Neutron and incumbent fleets absorb the same second-source demand. Until that
              sequence is demonstrated, Falcon 9 remains the dominant incumbent, Neutron remains the nearer-term
              medium-lift challenger, and Vulcan or New Glenn remain the alternatives buyers can choose when heritage
              and mission assurance outweigh a new entrant’s upside narrative.
