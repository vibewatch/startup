              Commercial demand is easier to evidence than the current cap table. The backlog progression is visible in
              public milestone steps: OneWeb lifted Terran R backlog above $1.2 billion across five customers in 2022,
              Intelsat lifted it above $1.8 billion across nine customers in 2023, Relativity said it exceeded $2.9
              billion across more than a dozen customers in March 2025, and the current about page rounds that figure to
              $3 billion plus. The customer mix is anchored by telecom and government-adjacent relationships rather than
              consumer markets, with SES, Intelsat, OneWeb, Iridium, NASA, and the U.S. Air Force/Space Force forming
              the most visible external validation set in this chapter.
