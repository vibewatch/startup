              last clean, broadly corroborated mark is still the $4.2 billion Series E valuation from 2021. After that,
              the signals diverge materially: Yahoo/Forge displays a derived June 2025 estimate of $3.96 billion and a
              disputed late-2023 $5.86 billion post-money reference; Access IPO talks about a 2023 $6 billion mark but
              also says private valuations were closer to $3 billion in early 2025 and adds a low-confidence
              reverse-split narrative; CNBC's 2024 profile still showed the older $4.2 billion figure, illustrating how
              stale mainstream profile data can lag private resets. On that record, valuation-compression risk is real
              even if the exact floor is not knowable from public pages. The chapter's financial verdict is therefore
              cautious. Demand appears genuine, official launch backlog is substantial, and Schmidt's control investment
              likely bought time, but there is still no publication- quality evidence for audited revenue, margin path,
