      - number: '8.5'
        title: Final Diligence Asks and What Must Be True
        blocks:
          - type: paragraph
            body: >-
              What would have to be true for today's valuation to work is clear even if today's precise value is not.
              First, audited or lender-grade revenue evidence would have to show that backlog is converting into cash
              under contract terms that protect rather than flatter the headline number. Second, the capital structure
              would have to be less adverse than the promotional secondary pages imply: investors need to know the
              Schmidt transaction economics, any reverse-split impact, preference stack seniority, and whether another
              financing is likely before Terran R reaches recurring service. Third, launch customers would have to be
              meaningfully sticky despite the maturity gap versus Falcon 9 and the improving alternatives from Rocket
              Lab and ULA. Until those facts are public, the chapter's best judgment remains evidentially humble.
              Relativity has enough demand, talent, and capital support to keep the upside alive, but not enough audited
              economics to make the current price obviously attractive. That combination is exactly why the diligence
              list matters more than a one-decimal valuation output.
