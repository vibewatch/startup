      - number: '7.5'
        title: Kill Criteria and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              The highest-signal way to read this chapter is as a chain, not a pile, of risks. A technical miss does not
              stay technical for long: it can push first flight, which then delays NSSL entry, tests customer patience,
              weakens backlog quality, and forces either additional capital or weaker pricing against incumbents. That
              is why the most important diligence gaps are still basic underwriting variables rather than storytelling
              variables. Investors do not yet have a public Terran R mission-assurance package, public contract remedy
              language, public cash balance, or a public Terran R-specific authorization matrix. Until those gaps close,
              the most useful discipline is trigger-based. If first flight moves out again, if post-flight there is
              still no credible path into Lane 1, if customers start rebooking around Terran R, or if the company needs
              fresh capital before demonstrating reuse, the adverse case stops being a scenario and becomes the base
              case. Conversely, one successful orbital mission will not clear the chapter by itself; the chapter only
              truly improves once launch proof, licensing proof, cash proof, and backlog proof begin to reinforce each
              other.
