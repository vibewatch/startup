  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Contracted Demand Versus Flown Performance
        blocks:
          - type: paragraph
            body: >-
              Relativity's customer chapter is strongest when it keeps proof classes separate. Public evidence clearly
              supports that customers have signed onto Terran R: OneWeb did so in 2022, Intelsat in 2023, and SES
              expanded its relationship in 2025 after later acquiring Intelsat. Company sources also moved the aggregate
              commercial story from more than $1.2 billion of backlog across five customers in 2022 to more than $1.65
              billion across seven customers in 2023, more than $2.9 billion across more than a dozen customers in March
              2025, and $3 billion-plus of pre-sold launch contracts on the current company site. That is meaningful
              adoption proof in the sense of reserved demand. It is not delivered mission proof. As of the canonical run
              date, public sources still place the first Terran R launch in late 2026, and no public customer payload
              has yet flown on the vehicle. The underwriting conclusion is therefore narrow: Relativity has sold
              customers on future capacity, but it has not yet demonstrated Terran R reliability, schedule execution, or
              repeat-flight satisfaction in service.
