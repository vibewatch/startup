chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Footprint, and Product
        blocks:
          - type: paragraph
            body: >-
              Relativity Space presents itself as a launch and advanced-manufacturing company whose current commercial
              identity is anchored on Terran R, a reusable medium-to-heavy-lift rocket rather than the earlier Terran 1
              vehicle. The company’s current about page says it has grown into a team of 2,000 experts across five U.S.
              locations, with Long Beach as the headquarters and additional activity in Mississippi, Florida,
              Washington, D.C., and Seattle. That same page says Relativity has more than $3 billion in pre-sold launch
              contracts and more than a dozen customers, which makes backlog the clearest public traction indicator even
              though those bookings should not be confused with flown-launch revenue.


              Terran R is the product the rest of this report should treat as canonical. Public technical disclosures
              now converge around a vehicle sized for 23,500 kilograms to a 200-kilometer LEO with first-stage reuse,
              5,500 kilograms to GTO, and up to 33,500 kilograms to LEO in expendable mode, launching from LC-16 at Cape
              Canaveral beginning in late 2026. A separate inferred stage assessment follows from those same
              disclosures: Relativity should still be viewed as a late-development, pre-first-flight Terran R company
              rather than an operator with demonstrated recurring launch revenue.
