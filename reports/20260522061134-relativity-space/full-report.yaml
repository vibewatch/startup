      - number: '3.4'
        title: Operations, Manufacturing, and Switching Costs Favor the Fleets Already Flying
        blocks:
          - type: paragraph
            body: >-
              The core competitive dimensions extend beyond payload. Relativity still has an unusually differentiated
              manufacturing story, but that story has already evolved from the 2021 fully reusable, entirely 3D-printed
              Terran R concept into a 2023 hybrid architecture that prioritizes first-stage reuse first. That is not
              disqualifying, but it is evidence that manufacturability and economics are still being discovered rather
              than proven. Rocket Lab is making a different bet with carbon-composite structures and a captive fairing;
              ULA is making a more conservative assurance bet; and SpaceX has already translated reusable operations
              into a high-cadence machine. Buyers feel those differences as switching costs. Procurement teams do not
              only compare kilograms to orbit; they compare range access, integration practice, manifested confidence,
              insurance assumptions, and the institutional comfort that comes from working with a launcher that has
              already flown. That is why launch-network breadth and historical execution matter so much: Terran R may be
              technically relevant to multiple mission types, but the incumbents enter each sales process with
              operational memory that Relativity still has to earn.
