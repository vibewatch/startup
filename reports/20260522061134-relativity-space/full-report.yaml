  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Benchmark Point and Conflicting Private Signals
        blocks:
          - type: paragraph
            body: >-
              The valuation discussion has to start from the last clean mark, not the loudest rumor. Relativity's own
              June 2021 Series E announcement confirms a $650 million raise, and CNBC tied that financing to $1.34
              billion of cumulative capital raised and a $4.2 billion valuation. That is still the most supportable
              transaction benchmark in the public record. Everything after that is noisier. Yahoo/Forge shows a June
              2025 derived valuation estimate of $3.96 billion while also displaying a November 2023 Series F reference
              at $5.86 billion, but the same page explicitly says Forge Price is informational, model-derived, and may
              rely on limited data. Access IPO pushes the late-2023 mark to $6 billion and says private valuations were
              closer to $3 billion in early 2025 after a reverse split, but its page is promotional and does not provide
              cap-table evidence. TechCrunch clarifies the control story without closing the pricing question: Eric
              Schmidt made a significant investment, took control, and replaced Tim Ellis as CEO, yet public sources
              still do not disclose the exact consideration, ownership percentage, security seniority, or dilution
              mechanics of that transaction. The right underwriting move is therefore to preserve the conflict rather
              than collapse it into a fake spot price.
