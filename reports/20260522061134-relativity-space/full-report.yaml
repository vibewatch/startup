            body: >-
              OneWeb, Intelsat, and SES are the best public Terran R customer logos because each is tied to a named
              multi-launch agreement, a quoted customer executive, and a mission use case that fits the vehicle's
              published market positioning. OneWeb proves early constellation demand and likely large manifest appetite,
              but exact launch counts and value remain officially undisclosed even if TechCrunch reported a double-digit
