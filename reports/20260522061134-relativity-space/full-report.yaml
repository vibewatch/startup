      - number: '1.4'
        title: Milestones, Pivot, and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              Relativity’s corporate arc now reads as a pivot story rather than a steady continuation of the original
              3D-print-everything thesis. Terran 1’s March 2023 launch reached Max-Q, completed stage separation, and
              reached space, but it failed to achieve orbit because of a second-stage problem. Within weeks, management
              shelved Terran 1 and repositioned the company around Terran R. That go-to-market reset also changed the
              vehicle itself: the 2021 Terran R concept had targeted a 2024 debut with a smaller fully reusable design,
              while the April 2023 update moved to a larger vehicle, prioritized first-stage reuse, and embraced a more
              hybrid manufacturing strategy.


              Execution evidence since then is mixed but directionally constructive. The March 2025 company update said
              vehicle-level CDR had completed in December 2024 and that first-flight production was underway; March and
              April 2026 updates showed continued stage integration, engine manufacturing, testing, and LC-16 buildout.
              Still, the pack also contains the main adverse signals that matter for diligence: SpaceNews reported that
              Relativity delayed its initial NSSL Phase 3 bid because Terran R would not be flight-ready in time, and
              TechCrunch said the company had faced cash shortages in 2024 before Schmidt’s investment. The chapter
              therefore supports a balanced view: customer demand and technical progress are real, but the business
              remains pre-flight on its core product and still has to convert backlog into successful launches.
