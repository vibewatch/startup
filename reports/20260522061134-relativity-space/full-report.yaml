            body: >-
              The last fully corroborated financing in the fetched pack is still the June 2021 Series E. Relativity’s
              own announcement and CNBC both support a $650 million round led by Fidelity with participation from
              BlackRock, Coatue, Tiger Global, Baillie Gifford, Mark Cuban, and others; CNBC also reported $1.34 billion
