  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Heatmap showing where Relativity's highest residual risks cluster after considering available mitigations. The
      high-likelihood, high-impact corner is dominated by first-flight slip, backlog convertibility, and runway opacity
      rather than by generic startup noise.
    data:
      columns:
        - Low impact
        - Medium impact
        - High / critical impact
      rows:
        - label: Very likely
          values:
