          detail: >-
            Operator or government buyer needs diversified launch capacity, resilient satellite services, or
            manufacturing capability beyond incumbent options.
        - id: fit
          label: Vehicle-fit evaluation
          detail: >-
            Buyer tests whether Terran R's fairing, orbit range, reuse promise, and medium-to-heavy class fit
            constellation, GEO/MEO, or responsive-government missions.
        - id: contract
          label: Contracting or procurement access
          detail: >-
            Relationship takes the form of a multi-launch agreement, fixed-price demo award, IDIQ pool entry, or
            adjacent technical contract.
        - id: wait
          label: Manifest hold while vehicle matures
          detail: >-
            Customer waits through design, engine qualification, infrastructure buildout, and schedule revisions because
            Terran R has not yet entered service.
        - id: first-flight
          label: First successful payload delivery
          detail: >-
            This is the missing proof point that would convert customer trust from roadmap belief into demonstrated
            service credibility.
        - id: outcome
