  productSummary: >-
    Relativity sells future Terran R launch capacity and the manufacturing system behind it.
    Terran R is a reusable-first, medium-to-heavy-lift methalox rocket now built with a hybrid
    manufacturing approach that combines friction-stir-welded aluminum primary structures with
    additively manufactured Aeon engines; the company is also commercializing its factory stack
    through Horizon Manufacturing Technologies.
  customerFocus: >-
    Satellite constellation operators, GEO/MEO telecom operators, and civil or national-security
    launch buyers that want additional U.S. medium-to-heavy launch capacity before Terran R has
    established flight heritage.
  businessModel: >-
    Revenue is expected to come primarily from multi-launch service agreements and future launch
    missions on Terran R, with smaller government manufacturing awards and longer-term optionality
    from licensing or commercializing Relativity's manufacturing platform.
  stage: Late-stage private
