companyProfile:
  summary: >-
    Relativity Space is a Long Beach-based launch and advanced-manufacturing company founded
    in the mid-2010s by Tim Ellis and Jordan Noone and now led by Eric Schmidt after his March
    2025 control investment. The company has built real commercial interest around Terran R and
    now cites more than $3 billion of pre-sold launch contracts across more than a dozen customers,
    but the business still has to convert that demand into actual flight performance and recognized
    launch revenue because Terran R remains pre-flight.
  foundedDate: '2015-01-01'
