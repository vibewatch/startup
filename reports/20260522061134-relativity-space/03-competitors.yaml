  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Mission-level launch prices, discount structures, deposit schedules, cancellation protections, and integration-scope assumptions for Terran R, Falcon 9, Vulcan, and New Glenn.
    whyItMatters: Public list-price snippets are not enough to judge whether Terran R can actually underwrite competitive economics or how much incumbents can discount to defend share.
    diligencePath: Obtain recent launch-service agreements or customer term sheets, then normalize price-per-mission and price-per-kilogram on a comparable scope basis.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP003
  - type: access-blocked
    severity: material
    topic: new-glenn-public-detail
    missingEvidence: A clean, accessible official New Glenn product or mission page with customer-facing technical detail, reusable-operations framing, and any public pricing or cadence disclosures.
    whyItMatters: Without an accessible primary Blue Origin source, New Glenn can only be positioned from secondary reporting, which is enough to flag it as relevant but not enough for a tighter apples-to-apples benchmark.
    diligencePath: Re-fetch Blue Origin official pages from an environment that can clear the current security checkpoint, or request a Blue Origin payload guide or official fact sheet directly from the company.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP002
