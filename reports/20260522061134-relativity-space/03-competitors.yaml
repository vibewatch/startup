- id: emerging-challengers
  title: 'Emerging Challengers: Neutron Is Closer to Market Pressure Than Terran R'
  body: 'Among future vehicles, Neutron is the more immediate threat to Relativity because it is chasing the same medium-lift buyer logic with less conceptual distance between design intent and commercial proof. Rocket Lab already markets Neutron as a 13-ton reusable launcher, won Lane 1 eligibility, and disclosed dedicated customer missions beginning in mid-2026. Aerospace America also reported a public $55 million launch price target and framed Neutron explicitly as a Falcon 9 alternative for constellation demand. Terran R is still larger on paper, but the sequence matters more than the brochure: Relativity is still building toward first flight, and SpaceNews reported that the company delayed its initial NSSL push because the vehicle would not be ready in time for the first Phase 3 window. Monthly updates show real hardware progress, and customer agreements with SES and Intelsat-family demand are real, but there is still no operational Terran R and no demonstrated recovery. In diligence
    terms, Neutron is closer to becoming a usable second source, whereas Terran R is still selling the right to believe that first-flight execution will unlock its backlog.'
  claimRefs:
