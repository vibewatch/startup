- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Relativity claim
  - Why buyers care
  - Competitive threat
  - Severity
  - Diligence ask
  rows:
  - - Terran R matches incumbent payload class
    - Large payload and constellation flexibility widen the addressable job-to-be-done
    - Falcon 9 already serves similar missions with flight heritage; Vulcan and New Glenn cover heavier assurance-sensitive missions
    - high
    - Request win/loss data by mission class, not just brochure payload comparison
  - - Hybrid additive manufacturing should lower cost and speed ramp
    - Manufacturing differentiation is central to the investment thesis
    - The architecture already shifted materially between 2021 and 2023, so service economics remain unproven
    - high
    - Request costed build-of-materials, cycle-time data, and refurbishment assumptions by block
  - - Backlog proves market pull
    - Signed demand de-risks the go-to-market story
    - Contracts remain thin on mission count, price, timing, and cancellation detail while incumbents keep flying
    - high
    - Request customer-by-customer manifest, payment milestones, and termination terms
  - - Reusable cadence can unlock better customer economics
    - Rapid turnaround is the strategic upside versus expendable competitors
    - Neither Terran R nor Neutron has demonstrated reusable operations; Falcon 9 already has
    - high
    - Request first three-flight recovery plan, refurbishment scope, and post-flight decision gates
  - - Government adjacency expands upside
    - Lane 1 or later government wins would deepen trust and diversify revenue
    - Relativity already missed the first NSSL window and cannot win task orders before first flight
    - medium-high
    - Request the post-first-flight path to on-ramp, qualification, and first addressable mission
  - - Customers want diversification away from a monopoly-like incumbent
    - Diversification language creates openings for a second source
    - If Terran R slips, Neutron and incumbent fleets can absorb that same diversification demand first
    - high
    - Request signed customer fallback language, schedule windows, and how much backlog is non-exclusive
  notes: Severity is an analytical judgment, not a management quote. The register focuses on which elements of the competitive thesis are actually durable versus which still depend on first-flight proof.
