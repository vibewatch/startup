chapter:
  number: 3
  title: Competitors
  summary: Falcon 9 is the dominant incumbent because it combines official reuse-and-cadence scale with actual government task orders, while Terran R remains a pre-flight program selling into a market that already has trusted alternatives. Neutron is the closest medium-lift challenger because it pairs medium-lift specs with customer contracts, Electron heritage, and Lane 1 positioning ahead of first flight. Vulcan and New Glenn belong in the diligence set as mission-assurance or heavy-lift alternatives, but only partial public New Glenn detail was cleanly accessible in this run, so the chapter preserves that gap instead of inventing apples-to-apples comparisons.
sections:
- id: competitive-baseline
  title: 'Competitive Baseline: Falcon 9 Sets the Reference Price of Trust'
  body: 'The most important competitive fact is not that Terran R aspires to Falcon 9-class payload; it is that Falcon 9 already operates at a scale that turns launch from a vehicle-spec debate into an execution-trust debate. Official SpaceX statistics show hundreds of Falcon 9 launches, landings, and reflights, and Aerospace America described Falcon 9 flying 165 times in 2025 alone. That operating record matters because Space Force procurement already treats SpaceX as the default commercial-like option: Spaceflight Now reported that Falcon 9 was the only vehicle with an actual Phase 3 Lane 1 task order at the time of its April 2025 breakdown. For diligence, that means Terran R is not entering a greenfield market. It is asking buyers to move work away from a reusable launcher that already blends competitive public pricing, proven cadence, and government trust. Terran R therefore needs more than comparable payload claims; it needs proof that a new manufacturing system, a new booster, and
    a new launch operation can close a trust gap that Falcon 9 has spent years compounding.'
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
  - CP005
  - CP006
  - CP029
  - CP030
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: incumbents-and-assurance
  title: 'Incumbents and Assurance Alternatives: Vulcan and New Glenn Are Not Clean Apples-to-Apples'
  body: 'Terran R also competes against vehicles whose edge is mission assurance rather than pure medium-lift substitution. ULA markets Vulcan around precision insertion, off-pad encapsulation, large-fairing handling, and multiple solid-booster configurations, and the Space Force is already allocating Phase 3 Lane 2 missions to it. Those attributes make Vulcan relevant wherever the buyer values orbital complexity, payload handling discipline, or national-security heritage more than first-stage reuse. New Glenn belongs in that same diligence bucket, but the evidence pack is intentionally uneven. Spaceflight Now reported that Blue Origin had already flown New Glenn once and secured seven Lane 2 missions, yet the official New Glenn page was not cleanly accessible during this run because it returned a security-checkpoint block. The right conclusion is therefore restrained: New Glenn is clearly a serious heavy-lift and mission-assurance alternative, but this chapter does not invent unsupported
    payload, pricing, or cadence detail simply to force a perfect side-by-side with Terran R.'
  claimRefs:
  - CP007
  - CP008
  - CP009
  - CP010
  - CP011
