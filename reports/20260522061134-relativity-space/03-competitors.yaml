  - - Neutron
    - Nearer-term medium-lift challenger
    - 13 t reusable LEO class
    - Electron heritage, Lane 1 eligibility, and dedicated customer missions beginning mid-2026
    - Offer a reusable medium-lift alternative optimized for constellations and government demand
    - Reuse and mission assurance are still unproven at Neutron scale
  - - Terran R
    - Subject company / pre-flight entrant
    - 23.5 t reusable LEO; 33.5 t expendable LEO; 5.5 t reusable GTO
    - Customer agreements exist, but no operational Terran R launch or reuse demonstration yet
    - Translate hybrid 3D-printing manufacturing and large payload ambition into a high-cadence reusable fleet
