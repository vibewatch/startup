- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vehicle
  - Public price signal
  - Commercial proof visible in pack
  - What remains unknown
  - Diligence implication
  rows:
  - - Falcon 9
    - $74M public list point cited by AIAA
    - Lane 1 task order plus extraordinary operational cadence
    - Mission-by-mission discounts, rideshare economics, and customer-specific integration terms
    - Falcon can charge near the market benchmark because heritage reduces buyer risk
  - - Neutron
    - $55M public target cited by AIAA
    - Constellation contract plus Lane 1 eligibility before first flight
    - Whether reuse and operations actually support that price at target cadence
    - Neutron can underwrite a second-source pitch if it reaches flight close to schedule
  - - Terran R
    - Undisclosed in fetched public sources
    - Multiple SES / Intelsat-family launch agreements and earlier backlog claims
    - Per-launch price, deposits, cancellation protection, and margin structure
    - Without price transparency, Terran R must win first on trust-building milestones
  - - Vulcan
    - No clean public apples-to-apples price in fetched pack
    - Lane 2 position and ULA assurance pedigree
    - Commercial pricing by configuration and the premium attached to assurance features
    - Vulcan is bought for mission fit and assurance, not obvious list-price leadership
  - - New Glenn
    - No clean public apples-to-apples price in fetched pack
    - Lane 2 share and at least one reported flight
    - Accessible official performance page, public recurring price point, and cadence assumptions
    - Keep New Glenn in the diligence set, but preserve pricing and specification gaps until clean sources are available
  notes: The only usable public list-price points in the fetched pack are Falcon 9 and Neutron from Aerospace America. Terran R, Vulcan, and New Glenn pricing remain materially opaque, so the comparison emphasizes what is and is not actually public.
