callouts:
- calloutType: risk
  title: NSSL adjacency is real, but not yet monetizable
  body: Lane 1 is strategically relevant because the Space Force wants more providers, but Relativity still cannot access that demand until after first flight and on-ramp. Lane 2 proves the dollar value of high-assurance government launch, yet its direct-GEO and mission-assurance requirements keep it outside Terran R's near-term revenue pool.
  claimRefs:
  - CM017
  - CM018
  - CM019
  - CM020
  - CM034
  - CM035
- calloutType: insight
  title: Buyer proof is broader than one constellation thesis
  body: Public contract evidence spans GEO / MEO fleet operators, Gen2 constellation builders, responsive spare missions, commercial satcom service providers, NASA demonstration work, and national-security adjacency. Relativity's issue is therefore not a single-market dependency but converting heterogeneous demand into a trusted launch cadence.
  claimRefs:
  - CM022
  - CM023
  - CM024
  - CM025
  - CM026
  - CM027
  - CM028
  - CM029
- calloutType: assumption
  title: Backlog is not a clean SOM proxy
  body: The disclosed backlog signals customer interest, but it cannot be used as a precise near-term obtainable market estimate without mission count, payload mix, pricing, deposits, and cancellation rights. Investors should treat backlog as directional proof of demand rather than a revenue-quality SAM / SOM calculation.
