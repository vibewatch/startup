chapter:
  number: 2
  title: Market Analysis
  summary: 'Relativity Space does not compete for the whole $613 billion to $1.8 trillion space economy; it competes for the narrower medium-to-heavy launch segment serving constellation deployment, GEO/MEO satellites, and government missions adjacent to NSSL Lane 1. Public evidence bounds that addressable demand from roughly $10 billion to more than $30 billion annually by 2030 depending on scope, while real buyer proof exists across SES, Intelsat, OneWeb, and U.S. government satcom programs. The bottleneck is not market existence but conversion: SpaceX dominance, certification gates, opaque contract economics, payload-clustering requirements, and schedule trust make Relativity''s near-term obtainable share far less knowable than headline space-economy figures imply.'
sections:
- id: market-boundary
  title: 'Market Boundary: Launch Services, Not the Entire Space Economy'
  body: 'Relativity''s relevant market begins with orbital launch services and only secondarily touches the broader space economy. The company is building Terran R for medium-to-heavy commercial and government missions: dedicated batches of constellation satellites, single large GEO or MEO spacecraft, and risk-tolerant government payloads that sit near NSSL Lane 1. That means the $613 billion current global space economy and the $1.8 trillion 2035 outlook matter only as outer context. Most of that value includes downstream communications, positioning, navigation, earth observation, and other space-enabled services that do not flow directly into launch-provider revenue. The practical market boundary for Relativity is the spend that chooses a launcher: operators refreshing multi-orbit fleets, constellation builders needing repeated deployment capacity, and government buyers procuring launch or space-enabled communications resilience. Excluded from the core market are satellite-manufacturing
    revenue, generic space software and services, human-spaceflight tourism, and launch-infrastructure budgets that never convert into paid launch missions. The status quo substitutes are not abstract space-spending alternatives but incumbent launch options led by Falcon 9, plus higher-assurance and emerging U.S. vehicles such as Vulcan and Neutron.'
