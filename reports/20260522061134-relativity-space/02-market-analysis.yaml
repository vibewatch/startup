- id: market-sizing-lenses
  title: Sizing the Market With Multiple Lenses
  body: 'Macro market numbers establish headroom, but they are not a usable TAM for Relativity on their own. The World Economic Forum and McKinsey frame the space economy at $630 billion in 2023 growing to $1.8 trillion by 2035, while Space Foundation reports $613 billion in 2024 with 78% commercial share and a path to $1 trillion by 2032. Those figures confirm a growing backdrop, but launch is only one enabling layer inside them. More relevant lenses are narrower. Relativity claims constellation launches alone represent a total addressable market above $30 billion per year by 2030. Rocket Lab, citing Quilty Space, uses a much narrower lens: more than 10,000 satellites still need launch by 2030 in a market worth about $10 billion, explicitly excluding Starlink and Chinese or Russian constellations. Neither figure should be treated as authoritative on its own. Together they show why launch demand must be framed as a range bounded by scope choices: all constellation deployment versus narrower
    medium-lift launch demand excluding the largest internally served systems. Government procurement pools such as NSSL Lane 1 and Lane 2 add additional demand, but they are adjacency lenses rather than clean TAM components because they depend on mission assurance gates and award timing.'
