    - OneWeb-like constellation operators; future broadband and EO constellations
    - Primary growth lens because recurring deployments consume launch capacity
  - - GEO / MEO fleet refresh
    - Launch of single large communications spacecraft or transfer-orbit missions
    - Lifetime transponder revenue, managed network services, in-orbit operations
    - SES, Intelsat/SES, other multi-orbit fleet owners
    - Important because Terran R is sized for single large satellites as well as batches
  - - National-security launch adjacency
    - Lane 1 task orders, risk-tolerant government launches, commercial satcom resilience services
    - Lane 2 missions before certification, broader missile-defense budgets, classified payload budgets not open to new entrants
    - U.S. Space Force, SDA, Commercial Space Office, DoD program offices
    - Material upside lens, but gated by first flight and mission assurance
  - - Civil science / responsive launch adjacency
    - NASA demonstration launches and rapid-acquisition small or risk-tolerant missions
    - Large flagship science missions outside vehicle fit or procurement path
    - NASA Launch Services Program; responsive government buyers
    - Useful entry path into government credibility, but not the full Terran R TAM
  - - Broader space economy context
    - Upstream and downstream space-enabled economic activity used to frame sector growth
    - Treating all space-enabled value as launch-provider revenue
    - Analysts, investors, strategy teams
    - Context only — too broad to use as Relativity's standalone TAM
