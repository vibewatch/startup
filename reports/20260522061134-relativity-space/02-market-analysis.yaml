- id: drivers-constraints-alternatives
  title: Growth Drivers, Constraints, and Medium-Lift Alternatives
  body: 'The strongest demand drivers are not generic enthusiasm for space but very specific mission cycles. Communications constellations and replenishment programs keep generating batch launch demand; sovereign defense programs increasingly want independent launch and resilient LEO communications; and reusable rockets create the possibility of lower dollar-per-satellite economics if cadence actually materializes. Customer quotes from SES, OneWeb, and Rocket Lab''s own competitor positioning all reinforce the same signal: buyers want additional capacity and less dependence on a single provider. The opposing force is equally specific. SpaceX''s cadence, reliability, and current capture of Lane 1 task orders make it the default benchmark, not just another competitor. Terran R also faces hard timing gates: no first flight yet, no demonstrated reuse, no government mission-assurance track record for national-security awards, and no public proof that its 50-100 flight ambition can be supported
    by payload density. That leaves Relativity aiming at a real market with credible alternatives around it: Falcon 9 as the incumbent, Vulcan for the highest-assurance orbits, and Neutron as the most direct emerging medium-lift challenger.'
