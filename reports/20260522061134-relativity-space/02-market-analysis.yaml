  rows:
  - - Medium-to-heavy launch services
    - Dedicated launch fees for constellation batches, single large GEO/MEO satellites, and rideshare missions
    - Satellite manufacturing, downstream bandwidth revenue, insurance, and ground systems sold separately
    - Commercial satellite operators, constellation program offices, government launch buyers
    - Core market — the revenue pool Terran R is built to attack
  - - Constellation deployment and replenishment
    - Batch launches, replenishment campaigns, schedule premiums, mission-integration services tied to launch
