- id: TM004
  title: Growth Drivers and Constraints Table
  columns:
  - Driver / Constraint
  - Direction
  - Timing
  - Implication
  - Diligence Ask
  rows:
  - - Constellation replenishment and new broadband competition
    - Driver
    - 2026-2030
    - Recurring batches of communications satellites create repeat launch demand rather than one-off missions
    - Request customer-by-customer replenishment calendar and average satellite mass by program
  - - GEO / MEO fleet refresh and multi-orbit resilience
    - Driver
    - 2026-2030
    - Large single-satellite missions keep medium-to-heavy vehicles relevant even as constellations grow
    - Request signed mission manifests by orbit and payload class for SES / Intelsat work
  - - Sovereign military space and diversified launch base
    - Driver
    - 2026-2034
    - Government buyers are explicitly trying to expand U.S. launch resiliency and capacity
    - Request Terran R on-ramp plan, mission-assurance milestones, and target government accounts
  - - Commercial satcom resilience budgets
    - Driver
    - Current
    - OneWeb p-LEO and Iridium EMSS contracts show that LEO communications resilience already has funded government demand
    - Clarify whether Relativity benefits directly as launcher, indirectly as ecosystem supplier, or only as future capacity option
  - - Reusable economics and faster turnaround
    - Driver
    - 2027 onward if proven
    - If Terran R can reuse at scale, dollar-per-satellite and launch availability should improve
    - Request refurbishment-time, booster-life, and turnaround assumptions behind pricing
  - - SpaceX incumbent dominance
    - Constraint
    - Current
    - Buyers can say they want choice while still defaulting to the proven incumbent on mission-critical work
    - Request win-loss analysis versus Falcon 9 by mission type and booking window
  - - Certification and first-flight gates
    - Constraint
    - Current to first successful mission
    - Relativity cannot access real Lane 1 task orders before first flight and post-flight qualification steps
    - Request post-first-flight certification path and anticipated government decision timeline
  - - Lane 2 mission requirements
    - Constraint
    - Medium term
    - Direct-to-GEO, vertical integration, and dual-range requirements keep the highest-value missions outside near-term reach
    - Clarify whether Terran R roadmap explicitly targets eventual Lane 2 capability
  - - Payload clustering and manifest density
    - Constraint
    - Current through ramp
    - Medium-heavy launch economics improve only when the vehicle can fill fairing volume or lift capacity consistently
    - Request weighted backlog by mission class, payload mass, and rideshare versus dedicated mix
  - - Industrial scale-up and schedule trust
    - Constraint
    - Current through 2027
    - A 50-100 annual cadence aspiration depends on engine qualification, pad completion, and reuse actually working in operations
    - Request integrated program schedule, stage-test milestones, and contingency plan for slips
  - - Contract opacity
    - Constraint
    - Current
    - Backlog headlines do not reveal price, margin, deposit structure, or cancellation protection
    - Request LSA economics bridge from backlog dollars to expected annual revenue and cash collection
  notes: Direction and timing are analytical judgments based on public evidence rather than management guidance. The table distinguishes structural demand drivers from conversion bottlenecks that delay monetization.
