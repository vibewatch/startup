              Intelsat 体系承诺表明，商业卫星运营商需要额外运力，并愿意向新进入者预订未来时段。但即便这些支持性表述，强调的也是韧性、运力扩张和生态多元化，而不是替换已证明服务商。真正的尽调问题因此不是 Terran
