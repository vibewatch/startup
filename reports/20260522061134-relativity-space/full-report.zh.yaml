  - id: FE001
    title: Relativity 产品架构图
    type: stack
    layout: wide
    summary: 从客户任务需求下探到火箭系统及支撑 Terran R 的工业基础，共五层。
    data:
      layers:
        - label: 客户任务层
          detail: Terran R 作为发射服务销售，面向星座、电信、政府和拼车任务；这些任务需要中重型运力，但不想转向最重型供应商。
          items:
            - 星座批量部署
            - 单颗 GEO 或 MEO 电信卫星
            - 多客户拼车
            - 政府及国家安全相邻的中型运力
        - label: 发射服务运营层
          detail: 任务设计、载荷集成、发射执行和第一级回收被当作一个运营系统，而不是彼此分离的产品。
          items:
            - 任务设计和客户集成
            - PAF / 整流罩配置
            - LC-16 发射运营
            - 下游海域第一级回收与翻修闭环
        - label: 火箭系统层
          detail: 当前公开架构围绕混合制造的两级火箭：第一级可复用，上面级交付系统尚未验证。
          items:
            - 5 m 整流罩和载荷堆栈
            - 配真空发动机的上面级（Aeon Vac / Aeon V）
            - 配 13 台发动机集群的可复用第一级
            - 栅格舵、着陆腿、底部热防护和驳船着陆剖面
        - label: 推进、软件和控制层
          detail: Terran 1 到 Terran R 的共同主线，是甲烷液氧推进，加上自研制导、航电和测试软件。
          items:
            - Aeon R 液氧甲烷燃气发生器发动机
            - 设计通用性很高的上面级液氧甲烷真空发动机
            - 航电、GNC 与 HITL / 正式记录运行软件路径
            - 氦气 / COPV 增压与共底贮箱架构
        - label: 工业基础层
          detail: 产品离不开工厂和测试网络：Long Beach 制造、Stennis 测试、LC-16 发射。
          items:
            - Long Beach 总部、机加工车间、低温场地和 Portal 增材 R&D 中心
            - Stennis E2 部件试验单元和 R Complex 发动机试车台
            - 面向长时程热试车的 A-2 级段测试改造
            - LC-16 HIF、发射座、储罐区和面向回收的 Florida 扩建
    approximationNotes: 层级边界是分析性的，并非官方划分。该图意在说明，从全打印叙事转向混合运营模型后，发射产品、火箭和工厂系统如何拼在一起。
