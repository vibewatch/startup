      - number: '2.4'
        title: 增长驱动、约束与中型运力替代方案
        blocks:
          - type: paragraph
            body: >-
              最强需求驱动不是泛泛的太空热情，而是非常具体的任务周期。通信星座和补网项目持续产生批量发射需求；主权防务项目越来越需要独立发射和有韧性的 LEO
              通信；如果发射节奏真正跑出来，可复用火箭有机会降低每颗卫星成本。来自 SES、OneWeb 的客户引述，以及 Rocket Lab
              自己的竞品定位，都强化了同一个信号：买家希望获得额外运力，降低对单一供应商的依赖。反向力量同样具体。SpaceX 的节奏、可靠性，以及当前对 Lane 1
              任务订单的获取，使其成为默认标杆，而不只是另一个竞争者。Terran R 还面对硬性的时间门槛：尚未首飞、尚未证明复用、尚无面向国家安全任务的政府任务保障履历，也没有公开证据证明其 50-100
              次飞行野心能由载荷密度支撑。于是 Relativity 瞄准的是一个真实市场，但周围有可信替代：Falcon 9 是现有龙头，Vulcan 面向最高保障轨道，Neutron 则是最直接的新兴中型运力挑战者。
