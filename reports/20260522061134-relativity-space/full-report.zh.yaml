      - CV005
      - CV016
      - CV017
      - CV032
      - CV041
      - CV042
      - CV043
      - CV046
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 条形图列出框定 Relativity 当前估值争议的关键基准点：2021 年干净估值标记、推导出的 2025 年信号、 低置信度的 2025 年压缩视角，以及本章自己的基准情景中点。
    approximationNotes: 数值以十亿美元为单位展示。低置信度的私募市场信号仅作背景，不作为权威交易标记。
    data:
