              发射服务协议。这些都是有意义的需求信号，但不是年经常性收入（ARR），也不应当作确认后的发射收入。同一来源包没有披露发射时点、客户预付款结构、里程碑安排、取消保护，以及积压订单中任何单一客户占比。来源包中唯一接近收入的直接数字来自
