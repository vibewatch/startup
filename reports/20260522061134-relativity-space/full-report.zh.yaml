chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、布局与产品
        blocks:
          - type: paragraph
            body: >-
              Relativity Space 把自己定位为发射与先进制造公司；眼下的商业身份锚定 Terran R，而不是早期 Terran 1。公司当前简介页称，团队已扩张到 2,000
              名专家，分布在美国五个地点，总部位于 Long Beach，另在 Mississippi、Florida、Washington, D.C. 和 Seattle 开展业务。同一页面还称 Relativity
              拥有超过 $3 billion 的预售发射合同、客户超过十多家。积压订单因此成为最清晰的公开牵引指标，但这些预订不能和已飞行发射收入混为一谈。


              本报告其余部分应把 Terran R 视为标准产品。公开技术披露目前集中在这组参数：第一级复用时，可向 200-kilometer LEO 运送 23,500 kilograms，有效载荷到 GTO 为
              5,500 kilograms，一次性模式下可向 LEO 运送最高 33,500 kilograms，并计划自 2026 年底起从 Cape Canaveral 的 LC-16
              发射。基于同一组披露，可以推出单独的阶段判断：Relativity 仍应被看作处于后期开发、Terran R 尚未首飞的公司，而不是已经证明可反复取得发射收入的运营商。
