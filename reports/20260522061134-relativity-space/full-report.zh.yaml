      - number: '5.4'
        title: Terran 1 复盘与知识迁移
        blocks:
          - type: paragraph
            body: >-
              Terran 1 在这里的意义不在于业务线，而在于探路。独立报道和公司自有回顾在关键正面点上相互一致：火箭通过 Max-Q、完成级间分离，并让 Relativity
              在打印结构、甲烷氧推进、航电和任务运营上获得真实飞行环境。这些对于一家初创发射项目并非小里程碑。同时，由于二级问题，该次飞行未能入轨；公司仅几周后就退役 Terran 1，转而加速 Terran
              R。管理层和支持性报道把这枚小型火箭描述为概念车式验证场，而不是应继续吸收商业精力的产品。这个解释具备可信度，因为 Terran 1 页面现在明确列出其称会向 Terran R
              迁移的工程领域：推进循环、飞行软件、GNC、结构动力学和气动热力学。缺失的仍是一份完整公开故障报告。来源包支持对异常的概要解释，但没有技术尽调团队在放心把 Terran 1 经验外推到 Terran R
              可靠性前会想要的详细根因、纠正措施和验证包。
            claimRefs:
