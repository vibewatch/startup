            body: >-
              Terran R 还要与一类火箭竞争，它们的优势不是纯粹替代中型运力，而是任务保障。ULA 围绕精确入轨、发射台外封装、大型整流罩处理和多种固体助推器配置来营销 Vulcan，Space Force 已经向其分配
              Phase 3 Lane 2 任务。当买方更看重轨道复杂度、载荷处理纪律或国家安全履历，而不是一级复用时，这些属性会让 Vulcan 相关。New Glenn
              也应放进同一个尽调桶，但证据包刻意保持不均衡。Spaceflight Now 报道称 Blue Origin 已经让 New Glenn 飞行一次，并拿到七个 Lane 2 任务；但官方 New Glenn
              页面在本次运行中无法干净访问，因为返回了安全检查拦截。因此，正确结论应保持克制：New Glenn 显然是严肃的重型运力和任务保障替代，但本章不会为了强行与 Terran R
