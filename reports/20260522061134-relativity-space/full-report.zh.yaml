            body: >-
              核心竞争维度不止载荷。Relativity 的制造故事仍然非常差异化，但这个故事已经从 2021 年完全可复用、全 3D 打印的 Terran R 概念，演变为 2023
              年优先一级复用的混合架构。这并不构成否定，但说明可制造性和经济性仍在摸索，而不是已经证明。Rocket Lab 用碳复合材料结构和自有整流罩下注；ULA 押注更保守的保障能力；SpaceX
              已经把可复用运营转成高节奏机器。买方会把这些差异感知为切换成本。采购团队比较的不只是入轨公斤数；他们还比较靶场接入、集成实践、排期信心、保险假设，以及与已经飞过的发射服务商合作带来的制度舒适感。这就是为什么发射网络广度和历史执行如此重要：Terran
              R 在技术上或许适用于多类任务，但现有玩家进入每次销售流程时，都带着 Relativity 还必须挣来的运营记忆。
