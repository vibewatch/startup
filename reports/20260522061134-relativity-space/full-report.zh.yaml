      - number: '8.3'
        title: 相对市场的竞争证明缺口
        blocks:
          - type: paragraph
            body: >-
              溢价估值不仅要撑过市场规模幻灯片，还要撑过成熟度对比。需求背景真实：World Economic Forum 和 McKinsey 预计 2035 年太空经济达到 $1.8T，Space Foundation
              则称 2024 年市场达到 $613B，2025 年上半年有 149 次发射。但 Relativity 想在这个增长里变现，所处赛道已经有飞行验证系统占位。SpaceX 自己的统计 API
              显示数百次发射、着陆和复飞，AIAA 则直白总结了竞争问题：Neutron 正被设计成 Falcon 9 替代品，但 Falcon 9 仅 2025 年就发射了 165 次。Rocket Lab 已披露两次
              Neutron 任务，具备 Lane 1 资格，并围绕打破星座运营商发射垄断建立公开叙事。ULA 的 Vulcan 页面强调国家安全就绪度和更高载荷配置。Relativity
              积压订单之外的客户需求信号也重要。Eutelsat 订购 340 颗新增 OneWeb
              卫星，说明星座需求仍在扩张，但也凸显可靠发射节奏对管理替换周期和网络连续性的客户有多值钱。这正是竞争者成熟度必须进入估值讨论的原因：基准不是抽象 TAM，而是 Relativity
              能否在已验证替代方案吸收同一任务集之前，把积压订单转成发射。
