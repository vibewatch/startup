            body: >-
              在未来火箭中，Neutron 对 Relativity 的威胁更直接，因为它追逐同一套中型运力买方逻辑，而且从设计意图到商业证明之间的距离更短。Rocket Lab 已经把 Neutron 营销为 13-ton
              可复用发射器，获得 Lane 1 资格，并披露专属客户任务将从 2026 年中开始。Aerospace America 还报道了公开的 $55 million 发射价格目标，并明确把 Neutron
              描述为面向星座需求的 Falcon 9 替代品。纸面上 Terran R 仍更大，但顺序比宣传册更重要：Relativity 仍在为首飞建设，SpaceNews 报道称公司延后了最初的 NSSL
              推进，因为火箭无法及时赶上第一轮 Phase 3 窗口。月度更新显示硬件进展真实，SES 和 Intelsat 体系需求的客户协议也真实存在；但 Terran R
              仍未投入运营，也没有证明回收。按尽调口径，Neutron 更接近成为可用第二来源；Terran R 仍在销售一种相信首飞执行将解锁积压订单的权利。
