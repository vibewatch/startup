  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 本章承销估值区间的范围视图。数字跨度很大，因为公司确有需求，但经审计经济性有限， 相对在位者仍有很大验证缺口。
    approximationNotes: 这些区间是承销带，不是报价交易水平。它们纳入里程碑风险、竞争成熟度，以及缺失的合同经济性细节。
    data:
      items:
        - label: 悲观情景 — 延误或稀释性重置
          low: 1.5
          high: 2.5
          unit: $B
        - label: 基准情景 — 已获资金但仍未首飞
          low: 3
          high: 4.2
          unit: $B
        - label: 乐观情景 — 发射验证和积压订单转化
          low: 4.5
          high: 6
          unit: $B
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV042
      - CV043
      - CV044
      - CV045
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: IC 可用的 1-5 分记分卡。需求验证和市场顺风得分高于收入验证、证据质量和估值安全边际。
    approximationNotes: 分数是基于来源记录的编辑判断，不是折现现金流模型或市场隐含回归的输出。
    data:
      items:
        - label: 需求验证
          value: 4
          note: 积压订单和持续客户公告显示真实需求
        - label: 收入验证
          value: 2
          note: 公开记录没有经审计的发射收入，也没有合同经济性的桥接信息
        - label: 资本支持
          value: 3
          note: Schmidt 可能改善了现金跑道，但条款仍未披露
        - label: 竞争地位
          value: 2
          note: Relativity 在飞行验证上仍落后于 Falcon 9 和其他替代方案
        - label: 市场顺风
          value: 4
          note: 太空经济增长和星座替换需求仍然有利
        - label: 证据质量
          value: 2
          note: 私募市场价格发现噪音大，且部分带有宣传色彩
        - label: 估值安全边际
          value: 2
          note: 公开记录支持的是一个区间，不是明显便宜的入场点
    claimRefs:
      - CV005
      - CV013
      - CV016
      - CV017
