            body: >-
              剩下最大的客户问题，不是谁想不想要中重型发射运力，而是 Relativity 的积压订单到底有多集中、多确定、多持久。公开证据显示商业侧由卫星网络买方主导：星座侧是 OneWeb，GEO/MEO 电信侧是
              SES-Intelsat。SES 现在既持有自己的协议，也持有收购来的 Intelsat 关系，集中度问题因此更可信。可是公开记录仍没有披露头部客户敞口、保证金节奏、发射年份分布、里程碑付款、取消权，以及
              Terran 1 退役后是否有合同被重组或丢失。留存指标也有同样缺口。Terran R 还没有公开飞行，因此没有公开
              NRR、GRR、流失率、续约率、满意度或复飞数据集。投资人应把今天的客户故事视为可信需求与未解集中度风险的混合体：客户名单真实，细分市场匹配也顺，但积压订单还不能转成干净的收入持续性模型。
