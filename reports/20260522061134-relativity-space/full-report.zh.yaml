      - number: '8.2'
        title: 积压订单不是收入，收入也未被证明
        blocks:
          - type: paragraph
            body: >-
              官方需求证据有意义，但不等于已经赚到的经济性。Relativity 2025 年 3 月 Terran R 更新称，十多个客户的积压订单超过 $2.9B；当前公司页面仍宣传超过 $3B 预售发射合同。SES 和
              SpaceNews 都确认客户需求延续到 2025 年末。但公开材料没有披露这些合同背后的发射年份瀑布、保证金比例、里程碑节奏、取消保护、改订补救或客户集中度。这个区分重要，因为 Terran R
              还没有飞过。相较 ARR 或已确认收入，首飞前发射协议应打折：卫星运营商可以在战略上支持公司，同时仍围绕进度、融资、保险或任务保障风险重新订舱。已审阅资料中唯一类似收入的数字来自 GetLatka；它报告
              2024 年 $150M 和 $181.5M，同时也警告这些数字由公司报告或估计。真金白银的政府奖项远小于积压订单标题：NASA 的 VCLS 奖项是 $3.0M，USAspending 显示 AFRL
              制造奖项为 $8.77M，OSP-4 是上限池而不是已入账收入。因此估值案例不能把积压订单当成已经转成现金的发射收入。
