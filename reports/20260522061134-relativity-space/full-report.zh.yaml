      - number: '4.5'
        title: 估值压缩风险与财务尽调结论
        blocks:
          - type: paragraph
            body: >-
              最稳妥的估值姿态，是保留冲突，而不是把证据压成一个数字。最后一个干净、广泛交叉印证的标记，仍是 2021 年 Series E 的 $4.2 billion 估值。此后信号显著分化：Yahoo/Forge 展示了
              2025 年 6 月推导估值 $3.96 billion，以及一条有争议的 2023 年末 $5.86 billion 投后参考；Access IPO 谈到 2023 年 $6 billion 标记，但也称
              2025 年初私营估值更接近 $3 billion，并加入一条低置信度反向拆股叙事；CNBC 的 2024 年资料仍显示旧的 $4.2 billion
              数字，说明主流资料数据可能滞后于私下重置。基于这组记录，即便公开页面无法知道确切底部，估值压缩风险也是真实的。因此，本章财务结论偏谨慎。需求看起来真实，官方发射积压订单可观，Schmidt
              的控制性投资可能买来了时间；但经审计收入、利润率路径、月度烧钱、手头现金或客户集中度，仍没有达到发布质量的证据。按承销口径，公司在首次 Terran R 运营前仍显得依赖融资。
