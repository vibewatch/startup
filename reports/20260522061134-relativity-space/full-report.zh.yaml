companyProfile:
  summary: >-
    Relativity Space 是一家位于 Long Beach 的发射与先进制造公司，由 Tim Ellis 和 Jordan Noone 在 2010 年代中期创立；Eric Schmidt 在 2025 年 3
    月完成控制性投资后接任领导。公司围绕 Terran R 已经拉到真实商业兴趣，目前称已预售超过 $3 billion 发射合同、覆盖十多家客户。但 Terran R
    仍未首飞，公司还必须把这部分需求转成实际飞行表现和确认后的发射收入。
