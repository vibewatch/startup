  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 基准点与相互冲突的私募市场信号
        blocks:
          - type: paragraph
            body: >-
              估值讨论必须从最后一个干净标记开始，而不是从最响的传闻开始。Relativity 自己的 2021 年 6 月 Series E 公告确认融资 $650M，CNBC 把这轮融资与 $1.34B 累计融资和
              $4.2B 估值联系起来。这仍是公开记录里最有支撑的交易基准。之后的所有信号都更嘈杂。Yahoo/Forge 给出 2025 年 6 月推导估值为 $3.96B，同时显示 2023 年 11 月 Series F
              参考值为 $5.86B，但同一页面明确说 Forge Price 仅供参考、由模型推导，且可能依赖有限数据。Access IPO 把 2023 年末标记推到 $6B，并称 2025 年初反向拆股后私募估值接近
              $3B，但其页面带推广属性，也没有提供股权结构证据。TechCrunch 说明了控制权故事，却没有解决定价问题：Eric Schmidt 进行了重大投资、取得控制权并接替 Tim Ellis 出任
              CEO，但公开资料仍没有披露这笔交易的确切对价、持股比例、证券清偿顺位或摊薄机制。因此正确的承销动作，是保留冲突，而不是把冲突压成一个虚假的现货价格。
