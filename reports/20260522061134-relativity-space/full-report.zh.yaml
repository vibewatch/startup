      - number: '7.3'
        title: 客户信任、积压订单转化与竞争
        blocks:
          - type: paragraph
            body: >-
              客户风险不在于 Relativity 能不能报出积压订单，而在于积压订单能否撑过漫长首飞路径。官方和报道中的合同披露显示商业订单真实存在：OneWeb、Intelsat、SES 都已签约，积压订单标题也从
              2022 年约 $1.2B 升至 2025 年 3 月超过 $2.9B。这些协议是有意义的需求证明，但它们仍是一款未飞 Terran R
              上的履约前合同。公开公告也留下关键法律和经济细节空白，包括许多案例中的发射次数、保证金、取消权、延误补救，以及头部客户集中度。不透明度更重要，是因为竞争已经成熟。Falcon 9
              不是理论对手；公开统计和独立报道显示其发射、着陆和复飞规模巨大。Rocket Lab 和 ULA 也分别用 Neutron 和 Vulcan 压入重叠任务集，Lane 2 国家安全奖项已经落到 Blue
              Origin、SpaceX 和 ULA 手里。尽调后果很直接：如果 Terran R 延误，或首批任务表现令人失望，客户有可信替代选择，积压订单可能转成改订、价格让步或更慢回款，而不是干净的高毛利收入。
