      - number: '7.5'
        title: 否决标准与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              读本章最高信号的方法，是把风险看成链条，而不是一堆孤立事项。技术失误不会长期停留在技术层面：它会推迟首飞，进而延后进入
              NSSL、考验客户耐心、削弱积压订单质量，并迫使公司在额外资本或相对存量玩家更弱的定价之间选择。因此，最重要的尽调缺口仍是基础承销变量，而不是叙事变量。投资人还没有公开的 Terran R
              任务保障包、公开合同补救条款、公开现金余额，或公开 Terran R 专属授权矩阵。在这些缺口关闭之前，最有用的纪律是触发器式判断。如果首飞再次外移，如果飞后仍没有可信路径进入 Lane 1，如果客户开始绕开
              Terran R
              重新预订，或如果公司在证明复用之前就需要新资本，不利情景就不再是情景，而会变成基准情景。反过来，一次成功轨道任务本身也不能清空本章；只有发射证明、许可证明、现金证明和积压订单证明开始相互强化，本章才会真正改善。
