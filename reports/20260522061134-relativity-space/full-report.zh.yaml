  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：发射服务，不是整个太空经济
        blocks:
          - type: paragraph
            body: >-
              Relativity 的相关市场首先是轨道发射服务，其次才触及更广义的太空经济。公司正在为中重型商业和政府任务打造 Terran R：星座卫星的批量专属部署、单颗大型 GEO 或 MEO 航天器，以及靠近
              NSSL Lane 1 的、风险承受度更高的政府载荷。因此，当前 $613 billion 的全球太空经济和 2035 年 $1.8 trillion
              展望，只能作为外围背景。大部分价值来自下游通信、定位、导航、地球观测以及其他由太空赋能的服务，并不会直接流入发射服务商收入。Relativity
              的实际市场边界，是会选择发射服务的支出：更新多轨道船队的运营商、需要反复部署能力的星座建设方，以及采购发射或太空通信韧性的政府买家。核心市场之外包括卫星制造收入、泛太空软件与服务、载人航天旅游，以及从不转化为付费发射任务的发射基础设施预算。现状替代品也不是抽象的太空支出选项，而是以
              Falcon 9 为首的现有发射方案，以及 Vulcan、Neutron 等保障更高或正在出现的美国火箭。
            claimRefs:
