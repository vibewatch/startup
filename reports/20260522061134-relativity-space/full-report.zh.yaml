      - number: '8.5'
        title: 最终尽调清单与必须成立的条件
        blocks:
          - type: paragraph
            body: >-
              今天的精确价值不清楚，但要让今天的估值成立，必须满足什么条件很清楚。第一，审计级或贷款人级收入证据必须显示，积压订单正在按保护而不是美化标题数字的合同条款转成现金。第二，资本结构必须不像推广型二级市场页面暗示的那样不利：投资人需要知道
              Schmidt 交易经济性、任何反向拆股影响、优先股堆叠顺位，以及 Terran R 进入经常性服务之前是否可能再融资。第三，即便与 Falcon 9 的成熟度存在差距、Rocket Lab 和 ULA
              的替代方案也在改善，发射客户仍必须有实质粘性。在这些事实公开前，本章最好的判断仍应在证据上保持谦逊。Relativity
              有足够的需求、人才和资本支持来保住上行空间，但没有足够审计经济性让当前价格显得明显有吸引力。这个组合正是尽调清单比一位小数估值输出更重要的原因。
