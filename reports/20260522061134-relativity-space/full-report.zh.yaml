  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Terran R 客户旅程从需求形成，到选择、占住发射清单、首飞证明，再到扩张或流失。关键断点不是签约，而是首次成功交付载荷；当前公开证明在此前很充足，此后很稀疏。
    data:
      nodes:
        - id: demand
          label: 需求形成
          detail: 运营商或政府买方需要多元发射运力、韧性卫星服务，或现有供应商之外的制造能力。
        - id: fit
          label: 火箭适配评估
          detail: 买方评估 Terran R 的整流罩、轨道范围、复用承诺和中重型定位，是否适配星座、GEO/MEO 或响应式政府任务。
        - id: contract
          label: 签约或采购入口
          detail: 合作关系可能是多次发射协议、固定价演示奖励、IDIQ 池入围，或相邻技术合同。
        - id: wait
          label: 火箭成熟前占住发射清单
          detail: Terran R 尚未投入服务，客户要等设计、发动机认证、基础设施建设和进度修订完成。
        - id: first-flight
          label: 首次成功交付载荷
          detail: 这是缺失的证明点；有了它，客户信任才会从相信路线图转为认可服务能力已被验证。
        - id: outcome
          label: 扩张或重新分配
          detail: 首飞验证后，客户可以增加发射、继续排队；如果进度或可靠性不及预期，也可以把任务转走。
    approximationNotes: 阶段是分析性划分，来自公开合同语言和发射行业采购惯例。公开来源包很好地记录了签约和等待路径，但尚未记录首飞之后如何进入重复使用。
