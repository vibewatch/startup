  - id: TP001
    title: 竞争对手画像表
    columns:
      - 运载器
      - 竞争类别
      - 公开载荷级别
      - 信任 / 履历信号
      - 战略方向
      - 相对 Terran R 尽调的主要注意点
    rows:
      - - Falcon 9
        - 占主导的现任者
        - ~23 t LEO 级，复用已投入运营
        - 官方统计页面显示 Falcon 9 已发射 638 次、复飞 557 次；引用来源中，只有它拿到 Lane 1 任务订单
        - 在累积发射节奏、复用和政府信任的同时守住价格纪律
        - 任何首飞前进入者都很难在信任、排期确定性和历史表现上超过它
      - - Vulcan
        - 任务保障 / 重型运力替代方案
        - 取决于固体助推器，LEO-ref 10.8-27.2 t；GEO 3.5-6.5 t
        - Lane 2 分配，加上 ULA 国家安全任务履历和首次认证飞行
        - 凭精确入轨和载荷处理服务复杂民用及国家安全任务
        - 在复用性或商业化发射节奏上不是 Terran R 的完美可比对象；保障叙事强于成本叙事
      - - New Glenn
        - 重型运力 / 未来保障替代方案
        - 重型运力定位有间接支撑，但本轮未能拿到清晰、同口径的官方细节
        - 二手报道提到首飞和 Lane 2 分配
        - 扩展到大型商业和国家安全任务
        - 官方公开细节缺口仍然重要，因此多处单元格必须保持未知
      - - Neutron
        - 近期中型运力挑战者
        - 13 t 可复用 LEO 级
        - Electron 履历、Lane 1 资格，以及 2026 年中开始的专属客户任务
        - 提供针对星座和政府需求优化的可复用中型运力替代方案
        - 在 Neutron 规模上，复用和任务保障仍未验证
      - - Terran R
        - 标的公司 / 首飞前进入者
        - 23.5 t 可复用 LEO；33.5 t 一次性 LEO；5.5 t 可复用 GTO
        - 已有客户协议，但 Terran R 尚无运营发射或复用演示
        - 把混合 3D 打印制造和大载荷雄心，转成高频次可复用运载器队伍
        - 积压订单面对有飞行履历的现任者竞争，买方也可以等验证结果
    notes: 本表有意只覆盖抓取证据包中反复出现、且与美国市场相关的运载器。New Glenn 的单元格在本轮可访问官方产品细节受阻处继续加限定。
