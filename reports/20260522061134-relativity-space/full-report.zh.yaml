      - number: '1.4'
        title: 里程碑、转向与执行风险
        blocks:
          - type: paragraph
            body: >-
              Relativity 的公司轨迹现在更像一次转向，而不是原先“万物 3D 打印”论点的平稳延续。Terran 1 在 2023 年 3 月发射时通过
              Max-Q、完成级间分离并进入太空，但因二级问题未能入轨。几周内，管理层搁置 Terran 1，把公司重新放到 Terran R 上。这次上市路径重置也改变了火箭本身：2021 年 Terran R 概念曾以
              2024 年首秀和更小型、完全可复用设计为目标；2023 年 4 月更新则转向更大火箭，优先一级复用，并接受更混合的制造策略。


              此后的执行证据有正有负，但方向上偏建设性。公司 2025 年 3 月更新称，整箭级 CDR 已在 2024 年 12 月完成，首飞生产已经启动；2026 年 3 月和 4 月更新显示，级段集成、发动机制造、测试和
              LC-16 建设仍在推进。不过，来源包也包含尽调中真正重要的主要反向信号：SpaceNews 报道称，Relativity 延后了最初的 NSSL Phase 3 投标，因为 Terran R
              无法及时达到可飞状态；TechCrunch 称 Schmidt 投资前，公司在 2024
              年曾面临现金短缺。因此，本章支持一个平衡判断：客户需求和技术进展真实存在，但核心产品仍未首飞，公司仍必须把积压订单转成成功发射。
