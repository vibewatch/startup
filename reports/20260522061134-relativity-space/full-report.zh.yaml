  - id: FM001
    title: 市场规模金字塔：从行业背景到 Relativity 已获需求
    type: pyramid
    layout: wide
    summary: 四层嵌套视角说明，为什么 Relativity 相关发射市场远小于头部太空经济数字，也为什么已披露积压订单只能部分代表可获得需求。
    data:
      items:
        - label: TAM — 2035 年全球太空经济
          value: $1.8T
          detail: WEF / McKinsey 对整个上游和下游太空经济的估算
        - label: SAM-1 — 2024 年商业太空经济
          value: ~$478B
          detail: 占 Space Foundation $613B 总量的 78%；范围仍远宽于发射服务商收入
        - label: SAM-2 — 到 2030 年与星座最相关的发射需求口径
          value: $10B to >$30B / year
          detail: 介于 Rocket Lab / Quilty 较窄的中型运载口径与 Relativity 较宽的星座发射口径之间
        - label: 相邻市场 — 美国政府发射池
          value: $5.6B Lane 1 ceiling; $13.7B Lane 2 award context
          detail: 有需求信号，但近期与 Terran R 相邻的只有 Lane 1
        - label: 已获需求 — Relativity 公开披露积压订单
          value: '>$2.9B backlog'
          detail: 根据公司 2025 年 3 月更新，客户超过十几家；定价和取消条款未披露
    approximationNotes: 商业太空层只是简单计算：$613B 的 78% = $478.14B。该金字塔不是字面上的经审计 TAM/SAM/SOM 桥接，因为公开来源没有足够数据来隔离 Relativity 的真实 SAM，也无法把积压订单转换为年收入。
