      - number: '7.2'
        title: 认证、采购与监管门槛
        blocks:
          - type: paragraph
            body: >-
              Relativity 还面临运载器就绪与采购资格之间的时间陷阱。SpaceNews 报道，公司推迟了最初的 NSSL Phase 3 推进，因为 Terran R
              无法在首个准入窗口内准备好；官方政府材料也说明这为何重要。Lane 1 是为了吸纳更新供应商，但 SSC 和 GAO 仍把实际任务订单资格绑定到一次成功首飞，CRS
              还描述了一个包含飞行演示、子系统审查和载荷接口验证的认证流程。Lane 2 更难，需要更多任务保障、更难轨道，以及更严格的靶场和集成预期。影响不利但很具体：即使 Terran R 在 2026
              年末首飞，政府多元化也会滞后于第一发任务，而不是和首飞同步到来。同一类风险也适用于发射授权。FAA 页面和 Terran 1 时代的 LC-16 环境文件显示了真实监管先例，但没有呈现 Terran R
              专属的运载器运营许可证包。FAA 规则也把场地授权与运载器运营许可拆开，并要求事故损害的财务责任。这意味着 LC-16 的可见发射台进展，本身并不能证明 Terran R 已按目标时间表完全获准飞行。
