          - type: paragraph
            body: >-
              公开证据强力支持资本强度，但不足以搭建精确现金跑道模型。Relativity 2022 年 Stargate 新闻稿描述了超过 1MM+ square foot 的总部、一座当时只运行 33%
              的工厂、十多台计划中的巨型打印机，以及满产后每台打印机每年四枚 Terran R 火箭的预测运行率。当前 Terran R 页面和 2025 年 3
              月更新又加入发动机鉴定、级段生产、发射台建设，以及仍位于规模化收入之前的首飞活动。这些事实支持一个直观结论：这是一个硬件重、设施重、劳动密集的开发项目；在 Terran R
              反复飞行前，成本基础应会维持高位。反向报道让这幅图更尖锐。TechCrunch 称公司在 2024 年面临现金短缺，并在 Schmidt 投资前难以再募资金；TSG 重复了一条未经验证的说法，称
              Relativity 已烧掉超过 $1 billion，Schmidt 的支票可能接近 $800
              million。因此，正确承销姿态不是认为现金跑道安全，而是近期破产风险可能有所缓解，但确切烧钱速度、现金余额、债务义务和发射到现金的转化仍未披露。
