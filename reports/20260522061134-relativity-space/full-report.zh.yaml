  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 已签需求与实际飞行表现
        blocks:
          - type: paragraph
            body: >-
              Relativity 的客户章节最有说服力的写法，是把证据类别拆开。公开证据清楚支持客户已经签约 Terran R：OneWeb 在 2022 年签约，Intelsat 在 2023 年签约，SES 在 2025
              年收购 Intelsat 后进一步扩大合作。公司口径也把整体商业叙事从 2022 年五个客户、超过 $1.2B 积压订单，推进到 2023 年七个客户、超过 $1.65B，2025 年 3 月十多个客户、超过
              $2.9B，以及当前公司官网披露的 $3B+ 预售发射合同。按预留需求看，这是真实采用证据；但它不是已交付任务证明。截至本次基准日，公开资料仍把 Terran R 首飞放在 2026
              年末，也没有任何公开客户载荷已经用这型火箭飞过。因此尽调结论很窄：Relativity 已经把未来运力卖给客户，但尚未证明 Terran R 的可靠性、进度兑现或服役后的复飞满意度。
