      - number: '7.4'
        title: 融资、现金跑道与战略漂移
        blocks:
          - type: paragraph
            body: >-
              融资风险格外重要，因为这是资本密集型发射项目，仍处在经常性发射收入之前。TechCrunch 报道，Relativity 在 2024 年遭遇现金短缺、融资困难，随后在 2025 年 3 月接受 Schmidt
              牵头的控制权交易。这大概率降低了即时破产风险，但没有解决披露问题：公开资料仍没有公司的现金余额、烧钱速度、债务空间，或 Schmidt
              投资的确切结构。公众可见的私募市场页面让图景更嘈杂，而不是更清晰：它们低置信度地声称公司历史烧钱很重、存在反向拆股机制，且估值标记差异很大。NASA 和 AFRL
              的小额政府奖项有助于证明外部机构愿意为发射或制造工作向 Relativity 付款，但这些奖项太小，无法支撑 Terran R 走过反复延误情景。相邻担忧是战略漂移。公开材料现在谈的不只有 Terran R，还有
              Horizon Manufacturing Technologies、Dark Matter
              Lab，以及围绕工厂技术栈的更广商业化姿态。这个选择权以后可能有价值，但在现阶段，它也带来真实风险：核心发射业务被证明之前，管理层注意力和稀缺资本就被铺得太开。
