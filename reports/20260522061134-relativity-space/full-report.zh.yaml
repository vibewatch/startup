      - number: '5.5'
        title: 质量控制与剩余技术风险
        blocks:
          - type: paragraph
            body: >-
              Relativity 并不是要求投资者或客户只相信营销；公开记录确实显示了一套严肃的测试和质量体系。官方更新和设施页面中，公司描述了整箭级 CDR、结构验收活动、无损检测、模态和载荷测试、再入系统风洞与 CFD
              工作、硬件在环和正式留档软件验证、低温部件场地，以及深度 Stennis 发动机测试布局。这是一块真实的控制面。剩下的问题不是公司是否在测试，而是测试是否已经关闭最后的商业未知数。复用成熟度仍未证明，因为
              Block 1 回收还没有在飞行中展示，公开证据也没有说明翻修时间、检查负担或可重复性。发动机风险低于 2023 年，但在 Aeon R
              和上面级发动机从部件和发动机活动走向整合级段和轨道表现前，风险仍然存在。混合制造也削弱了最初的纯增材故事：它可能提升排期现实性，却引入焊接、机加工、涂层和检查接口，而这些都必须在发射节奏下规模化。因此，正确尽调姿态是建设性但不庆祝：Terran
              R 看起来实质上真实，但最难的证明点仍在前方。
