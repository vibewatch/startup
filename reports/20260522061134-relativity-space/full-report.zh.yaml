      - number: '5.2'
        title: 火箭架构、推进与任务流程
        blocks:
          - type: paragraph
            body: >-
              从客户视角看，Terran R 被定位为可复用中重型发射服务，服务介于小型发射器和最重政府级火箭之间的市场。官方架构材料描述了一款两级火箭，配备 5-meter
              整流罩，适合星座批量任务、专属电信任务和多客户拼车。相较 2021 年发布，公开可见的最大设计变化不是外观：火箭从七台发动机的一级和全打印叙事，转为 13
              台发动机的一级，其中九台中置发动机可万向摆动、四台外侧发动机固定，并采用混合结构制造路径。推进路线始终是甲烷氧和燃气发生器循环；上面级真空发动机在 2023 年被称为 Aeon Vac，在 2025-2026
              年更新中被称为 Aeon V。官方复用架构围绕远海驳船着陆展开，流程包括冷气翻转、再入点火、栅格翼制导下降和着陆点火。这套流程足够具体，作为工程概念具备可信度；但在 Terran R
              助推器真正飞行、着陆，并证明翻修和可重复性前，它仍只是概念。
