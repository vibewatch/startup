      - number: '2.3'
        title: 买方 / 用户 / 付款方地图
        blocks:
          - type: paragraph
            body: >-
              买方需求已经可见，但会被任务类型和真正控制预算的人切分。商业侧，SES、Intelsat 等 GEO 和 MEO 船队运营商是买方，因为它们需要高可靠发射，把大型通信航天器送入可服务轨道。OneWeb
              等星座运营商购买反复部署能力，更在意批量经济性、补网节奏和发射服务商多元化。在美国政府需求中，买方、用户、付款方经常三分：U.S. Space Force 或 Commercial Space Office
              付款，OneWeb Technologies、Iridium 等网络运营商交付服务，作战人员或政府机构才是实际用户。这一点重要，因为 Relativity
              不只需要卖给卫星制造商或发射采购团队；它必须嵌入那些把韧性、响应速度和多样性当作预算结果的采购系统。NASA 和早期 Space Force 入围项目显示了进入政府需求的邻接路径，但这些路径历史上服务的是比
              Terran R 目标甜点更小、或风险承受度更高的任务。
