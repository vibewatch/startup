  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 技术执行与制造转型
        blocks:
          - type: paragraph
            body: >-
              Relativity 最大的运营风险是 Terran R 在实物层面已有实质进展，但商业上仍未被证明。公司确实有硬件动能：整箭级 CDR 已完成，首飞生产已启动，Aeon R 鉴定在 2025 年推进，2026
              年 4 月更新称首飞发动机已经制造并发运。但这些都不等于证明一整枚火箭。公开资料仍没有显示集成级热试车、Terran R 轨道任务、回收助推器或任何复飞证据。这个缺口重要，因为公司已经在一次异常任务后放弃
              Terran
              1；已审阅记录里，针对那次失败仍缺少达到公开发布质量的根因和纠正措施包。制造叙事也发生了实质变化。最初的全打印叙事，已经变成焊接铝结构、内部机加工和打印推进系统组合的混合项目。为了加快上市，这可能是正确选择，但也增加了接口数量，缺陷漏出、集成延误或低良率都可能侵蚀进度和利润率。在
              Terran R 飞行并交回可信可靠性数据之前，复用经济性失效和进一步进度滑坡仍是本章核心技术传导风险。
