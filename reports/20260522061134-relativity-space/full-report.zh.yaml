      - number: '1.3'
        title: 资本基础、利益相关方与商业需求
        blocks:
          - type: paragraph
            body: >-
              抓取来源包中最后一笔完全交叉印证的融资仍是 2021 年 6 月 Series E 轮。Relativity 自有公告和 CNBC 都支持这轮 $650 million 融资，由 Fidelity
              领投，BlackRock、Coatue、Tiger Global、Baillie Gifford、Mark Cuban 等参投；CNBC 还报道称，当时累计融资 $1.34 billion，估值 $4.2
              billion。此后证据变得浑浊。二级市场和资料站对后续估值、融资给出不同方向的信号，因此只能作为低置信度背景，不能作为封面指标的标准口径。


              商业需求比当前股权结构更容易取证。积压订单的推进在公开里程碑中可见：2022 年 OneWeb 将 Terran R 积压订单推高到超过 $1.2 billion、覆盖五家客户；2023 年 Intelsat
              将其推高到超过 $1.8 billion、覆盖九家客户；2025 年 3 月 Relativity 称其超过 $2.9 billion、覆盖十多家客户；当前简介页则四舍五入到 $3 billion
              以上。客户组合由电信和政府邻近关系锚定，而不是消费市场；SES、Intelsat、OneWeb、Iridium、NASA，以及 U.S. Air Force/Space Force 构成本章最可见的外部验证集合。
