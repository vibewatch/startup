  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 增材制造策略与产品表面
        blocks:
          - type: paragraph
            body: >-
              Relativity 仍在销售发射与制造结合的身份，但产品故事已经明显演变。2021 年 Terran R 发布时，公司承诺一款全 3D 打印、完全可复用的火箭，并把这份雄心连接到软件定义工厂论点。2023
              年架构更新实质性修改了这一姿态：Terran R 尺寸变大，一级复用成为明确优先项，首批火箭从全打印主承力结构改为混合铝制贮箱筒段。2025 年 3
              月更新把取舍讲得更清楚：火箭主承力结构使用搅拌摩擦焊高强铝材，车辆使用内部机加工和定制工装；同时在 Relativity 认为最能提升迭代速度和复杂度的地方保留增材制造，即 Aeon
              发动机和其他难加工部件。这并不意味着增材制造论点消失。Long Beach 总部、Portal 研发中心以及 Horizon 商业化页面都显示，Stargate
              及相关机器人、仿真和过程控制能力仍有战略意义。差别在于，增材制造现在是更广义工厂系统里的一个工具，而不是整枚运载火箭的字面制造方法。
