      - CU047
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 考虑现有缓释措施后，Relativity 最高残余风险集中在哪里。高概率、高影响区主要由首飞延后、 积压订单可转换性和现金跑道不透明主导，而不是泛泛的创业公司噪音。
    data:
      columns:
        - 低影响
        - 中等影响
        - 高 / 关键影响
      rows:
        - label: 极可能
          values:
            - Terran R 专属许可包仍未公开
            - 混合制造良率摩擦
            - 首飞延后或积压订单转化承压
        - label: 可能性高
          values:
            - 战略漂移到相邻业务
            - 靶场或载荷处理协调拖慢进度
            - 复用飞行证明出现前需要新资本
        - label: 可能
          values:
            - 小型知识产权或供应商纠纷
            - 首飞后 Lane 1 准入延后
            - 再次延误后客户改签
        - label: 概率较低
          values:
            - 意外监管执法
            - 短期获得 Lane 2 准入
            - 早期飞行后复用经济性不成立
    claimRefs:
      - CR008
      - CR026
      - CR041
      - CR046
      - CR054
      - CR055
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 技术和进度风险如何传导到客户、采购、利润率和估值结果。关键在于，飞行延误不是单一延期； 它会放大积压订单、NSSL 节点和融资风险。
    data:
      nodes:
        - id: qualification_gap
          label: 资质认证与集成测试缺口
        - id: reliability_gap
          label: 没有公开任务保障包
        - id: flight_slip
          label: 首飞延后
        - id: customer_patience
          label: 客户耐心承压
        - id: backlog_attrition
          label: 积压订单转化变弱
        - id: nssl_delay
          label: 政府准入延后
        - id: pricing_pressure
          label: 价格或条款压力上升
        - id: capital_need
          label: 需要追加资本
        - id: margin_impact
          label: 毛利率压缩
        - id: valuation_impact
          label: 稀释或估值压缩
      edges:
        - from: qualification_gap
          to: flight_slip
          label: 推动
        - from: reliability_gap
          to: customer_patience
          label: 削弱
        - from: flight_slip
          to: customer_patience
          label: 考验
        - from: flight_slip
          to: nssl_delay
          label: 延后
        - from: customer_patience
          to: backlog_attrition
          label: 降低
        - from: backlog_attrition
          to: capital_need
          label: 抬高
        - from: nssl_delay
          to: capital_need
          label: 拉长
        - from: pricing_pressure
          to: margin_impact
          label: 压缩
        - from: backlog_attrition
          to: pricing_pressure
          label: 恶化
        - from: capital_need
          to: valuation_impact
          label: 可能触发
        - from: margin_impact
          to: valuation_impact
          label: 加剧
    claimRefs:
      - CR008
      - CR013
      - CR027
      - CR041
      - CR047
      - CR054
      - CR055
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: 依赖关系图显示，Relativity 必须同时协调监管方、测试基础设施、发射基础设施、锚定客户和救援资本， 而更大的竞争对手已经规模化运行。
