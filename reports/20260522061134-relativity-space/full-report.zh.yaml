              项目等政府制造或通信买方；它们不直接把载荷放到 Terran R 上，却证明 Relativity
              客户所在终端市场有资金、有战略优先级。这个分层重要，因为它说明采用证据按任务类型看很宽，但商业侧仍集中在卫星网络运营商。
