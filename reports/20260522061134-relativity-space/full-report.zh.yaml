      - number: '8.4'
        title: 情景区间与判断
        blocks:
          - type: paragraph
            body: >-
              本章的估值立场不是 Relativity 一文不值，而是可支撑区间很宽，且取决于里程碑。乐观情景可以证明估值回到 2021 年基准之上，但前提是 2026
              年末首飞按时发生，早期任务验证客户信心，积压订单开始转成透明保证金或已确认收入，且没有另一轮惩罚性融资。基准情景更保守：官方需求和 Schmidt
              的控制权投资让公司仍有融资能力、值得继续跟踪，但最有支撑的数字区间仍大致在 $3.0B 到 $4.2B，因为它夹住了低置信度的 2025 年压缩信号和最后一个干净的 2021
              年融资标记。悲观情景并非理论。如果发射时间再次滑坡，如果客户转订 Falcon 9、Vulcan 或快速崛起的 Neutron 替代方案，或如果 Schmidt
              资本只是把公司桥接到另一轮摊薄性资本重组，可支撑价值可能大幅低于当前二级市场式指示。因此，推荐取决于价格和证据，而不是公司质量本身：在当前估值不透明时，正确立场是观察或继续研究，不是买入。明确的正面判断需要转化证明，而不只是雄心证明。
