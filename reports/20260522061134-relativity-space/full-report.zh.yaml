              电信卫星群运营商，以 Intelsat 和 SES 为代表；价值主张是可复用的中重型发射器，能覆盖单颗大型卫星、多轨道韧性，并让客户摆脱少数存量供应商。第三类是 NASA、U.S. Space Force
