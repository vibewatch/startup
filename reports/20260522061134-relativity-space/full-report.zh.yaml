      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              可取得的来源包支持一个高层次创始人故事，但并不能给出干净的法律沿革。官方当前文案称公司“自 2016 年以来”存在，而多个独立和私营市场资料把成立时间放在 2015 年，并认定 Tim Ellis 和
              Jordan Noone 为创始人。最稳妥、适合发布的结论不是单一日期，而是一处有记录的冲突：业务形成于 2015-2016 年窗口；抓取到的来源无法最终调和 2015 年是否代表注册、2016
              年是否代表运营启动，或其中一组来源只是表述不精确。


              2025 年 3 月之后，领导层确定性要强得多。TechCrunch 报道称 Eric Schmidt 完成重大投资、取得控股权并出任 CEO，Tim Ellis 则卸任首席执行官并留任董事。Relativity
              的简介页也独立确认，公司在 2025 年进入 Schmidt 领导下的新阶段。来源包中公开可见的职能负责人包括 President and CFO Mo Shahzad、Chief Revenue Officer
              Josh Brost 和 CTO Kevin Wu；但更完整的董事会名单、交易后的精确持股拆分，以及 Schmidt 投资附带的任何特殊治理权利，仍未公开。
