      - number: '2.5'
        title: 矛盾、反向证据与仍无法知道的事项
        blocks:
          - type: paragraph
            body: >-
              反向观点并不是说发射需求是虚构的，而是市场开放未必能在可投资时间线上转成 Relativity 的份额。最清晰的证据来自 NSSL 序列本身：Space Force 希望更多玩家进入，但 Relativity
              仍不得不推迟投标，因为火箭无法在第一轮授标窗口内具备飞行条件；即便新进入者成功入围，在成功完成首次任务前也拿不到任务订单。同样的问题也出现在商业协议中。SES、Intelsat 和 OneWeb
              证明了客户兴趣，但公开披露没有给出单次发射价格、预付款、取消保护或足以把积压订单转成可辩护可获取市场（SOM）的精确任务数量。公开市场镜头还混杂了不兼容的单位：总体太空经济价值、商业份额、发射服务
              TAM、采购上限和公司积压订单。因此，投资者应把本章区间估算看成有边界的镜头，而不是单一精确市场模型。最重要的尽调缺口是任务级合同经济性、首飞到认证的确切时间线，以及支撑高年度节奏所需的载荷组合假设。
            claimRefs:
              - CM020
              - CM033
              - CM034
              - CM035
              - CM039
              - CM040
