      - number: '2.2'
        title: 用多重镜头测算市场
        blocks:
          - type: paragraph
            body: >-
              宏观市场数字能说明天花板，但单独拿来给 Relativity 做总可用市场（TAM）并不好用。World Economic Forum 和 McKinsey 将太空经济描述为 2023 年 $630
              billion、到 2035 年增长至 $1.8 trillion；Space Foundation 报告 2024 年规模为 $613 billion，其中商业占比 78%，并有望在 2032 年达到 $1
              trillion。这些数字确认了增长背景，但发射只是其中一个赋能层。更有用的镜头要窄得多。Relativity 称，仅星座发射到 2030 年就代表每年超过 $30 billion 的总可用市场。Rocket
              Lab 引用 Quilty Space，使用了更窄的镜头：到 2030 年仍有超过 10,000 颗卫星需要发射，市场价值约 $10 billion，并明确排除 Starlink
              以及中国或俄罗斯星座。两组数字都不应单独视为权威。放在一起看，它们解释了为什么发射需求必须以范围呈现，并由范围选择限定：一端是全部星座部署，另一端是排除最大内部服务系统后的更窄中型发射需求。NSSL Lane 1
              和 Lane 2 等政府采购池还会带来额外需求，但它们依赖任务保障门槛和授标时点，更像邻接镜头，而不是干净的 TAM 组成部分。
