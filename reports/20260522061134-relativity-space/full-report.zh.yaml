    rows:
      - - 星座补网和新的宽带竞争
        - 驱动
        - 2026-2030
        - 通信卫星反复成批补网，带来重复发射需求，而不是一次性任务
        - 按客户索取补网日历，并按项目索取平均卫星质量
      - - GEO / MEO 卫星队更新和多轨道韧性
        - 驱动
        - 2026-2030
        - 即便星座增长，单颗大型卫星任务仍让中重型运载器保持相关性
        - 索取 SES / Intelsat 相关工作的已签任务清单，按轨道和载荷级别拆分
      - - 主权军事太空和多元发射基础
        - 驱动
        - 2026-2034
        - 政府买方明确在扩大美国发射韧性和能力
        - 索取 Terran R 准入计划、任务保障里程碑和目标政府账户
      - - 商业卫星通信韧性预算
        - 驱动
        - 当前
        - OneWeb p-LEO 和 Iridium EMSS 合同显示，LEO 通信韧性已经有政府预算支持的需求
        - 厘清 Relativity 是作为发射商直接受益、作为生态供应商间接受益，还是只作为未来运力选项受益
      - - 可复用经济性和更快周转
        - 驱动
        - 若验证成功，2027 年起
        - 如果 Terran R 能大规模复用，单星发射成本和发射可用性应会改善
        - 索取定价背后的翻修时间、助推器寿命和周转假设
      - - SpaceX 现任主导地位
        - 约束
        - 当前
        - 买方可以口头说想要选择，但任务关键工作仍默认交给已验证的现任者
        - 按任务类型和预订窗口索取相对 Falcon 9 的赢单 / 输单分析
      - - 认证和首飞关口
        - 约束
        - 当前至首次成功任务
        - 首飞及飞后资格步骤完成前，Relativity 拿不到真正的 Lane 1 任务订单
        - 索取首飞后的认证路径和预期政府决策时间表
      - - Lane 2 任务要求
        - 约束
        - 中期
        - 直达 GEO、垂直集成和双靶场要求，使最高价值任务短期内够不到
        - 厘清 Terran R 路线图是否明确瞄准最终具备 Lane 2 能力
      - - 载荷聚集和任务清单密度
        - 约束
        - 当前至爬坡期
        - 只有运载器能稳定填满整流罩体积或运力，中重型发射经济性才会改善
        - 索取按任务级别、载荷质量、拼车与专属发射组合加权后的积压订单
      - - 工业化扩产和排期信任
        - 约束
        - 当前至 2027 年
        - 每年 50-100 次的发射节奏目标，取决于发动机取得资格、发射台完工，以及复用在运营中真正跑通
        - 索取整合项目排期、级段测试里程碑和延期应急计划
      - - 合同不透明
        - 约束
        - 当前
        - 积压订单标题不披露价格、利润率、定金结构或取消保护
        - 索取 LSA 经济性桥接，说明积压订单金额如何转成预期年收入和现金回款
    notes: 方向和时点是基于公开证据的分析判断，不是管理层指引。表格区分结构性需求驱动因素，以及延迟变现的转化瓶颈。
