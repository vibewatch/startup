  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 从干净基准到当前冲突的推演：需求和 Schmidt 支持让公司仍有相关性，但缺少收入转化和股权结构透明度， 建议仍停在观察 / 继续研究。
    approximationNotes: 该决策流是对来源证据的分析总结，不是概率树或估值模型。
    data:
      nodes:
        - id: n1
          label: 2021 年干净估值标记
          detail: $4.2B 投后估值仍是最后一个得到完整佐证的估值
        - id: n2
          label: 当前需求验证
          detail: 积压订单超过 $2.9B，SES 继续支持
        - id: n3
          label: 缺少收入验证
          detail: 没有经审计的发射收入、定金或合同经济性
        - id: n4
          label: 资本支持
          detail: Schmidt 控制性投资可能买来时间，但价格未披露
        - id: n5
          label: 竞争
          detail: Falcon 9 已经飞行验证；Neutron 和 Vulcan 压缩稀缺性溢价
        - id: n6
          label: 当前结论
          detail: 当前定价不透明，维持观察 / 继续研究
        - id: n7
          label: 上调路径
          detail: 首飞加积压订单变现证据
      edges:
        - from: n1
          to: n6
          label: 基准锚
        - from: n2
          to: n6
          label: 支撑相关性
        - from: n3
          to: n6
          label: 阻碍形成确信
        - from: n4
          to: n6
          label: 买到时间，不是证明
        - from: n5
          to: n6
          label: 需要折价
        - from: n6
          to: n7
          label: 改善判断的条件
    claimRefs:
