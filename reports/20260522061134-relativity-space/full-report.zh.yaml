    type: funnel
    layout: standard
    summary: 从宣称的 Terran R 客户总数，到已飞 Terran R 任务客户数的公开证明下限漏斗。交付阶段骤降至零，是本章最重要的单一事实。
    data:
      items:
        - stage: 官方宣称的 Terran R 客户
          value: 12
          label: 来自 2025-2026 年十多项官方声明的下限计数
        - stage: 公开点名的客户或项目关系
          value: 7
          label: OneWeb、Intelsat、SES、Iridium 历史关系、NASA、OSP-4 和 AFRL 可公开识别
        - stage: 已公开具名的 Terran R 商业运营商
          value: 3
          label: OneWeb、Intelsat 和 SES 是来源包里最明确的 Terran R 商业客户标识
        - stage: 已公开披露的扩张关系
          value: 1
          label: SES 是唯一一个后来公开释放扩张信号的具名客户
        - stage: 已公开披露、由 Terran R 执飞的客户
          value: 0
          label: 截至 2026-05-22，没有公开来源显示 Terran R 已交付任何载荷
        - stage: 公开重复搭乘 Terran R 的客户
          value: 0
          label: 至少一发 Terran R 任务成功之前，重复使用证据必然缺席
    approximationNotes: 数值是公开口径的下限，不是内部 CRM 或发射清单数据。第一阶段采用 12，是依据「超过一打」披露得出的保守下限，并非凭空编出的精确总数。
    claimRefs:
      - CU028
      - CU029
      - CU033
      - CU038
      - CU048
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: 主要具名客户群的相对证据质量。SES 的关系公开扩张，持续性可见度最高；NASA 和 AFRL 的金额确认最硬， 但与 Terran R 的相关性最弱。
    data:
      columns:
        - 客户侧佐证
        - 量化合同细节
        - 已交付任务证据
        - 持续性可见度
        - 核心解读
      rows:
        - label: OneWeb
          values:
            - 高
            - 中
            - None
            - 低
            - 星座需求信号强，但发射次数仍不确定
        - label: Intelsat
          values:
            - 高
            - 低
            - None
            - 低
            - 买方是严肃电信客户，但公开口径没有金额或发射次数
        - label: SES
          values:
            - 高
            - 低
            - None
            - 中高
            - 关系扩张，公开持续性信号最强
        - label: Iridium 历史合作
          values:
            - 高
            - 中
            - None
            - 低
            - 历史信任真实存在，但绑定的是 Terran 1，不是 Terran R 服务
        - label: NASA VCLS Demo 2
          values:
            - 高
            - 高
            - Terran R：无
            - 低
            - 民用发射有真金白银合同验证，但规模小、容错高
        - label: OSP-4 与 AFRL
          values:
            - 高
            - 中
            - 特定 Terran R 任务：无
            - 中
            - 政府相关性真实，但对 Terran R 实际执飞采用的证明大多间接
    approximationNotes: 定性评分只反映公开证据质量。具名交易对手拿到高分，只说明交易对手身份清楚；不代表客户已经收到服务。
