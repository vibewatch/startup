        blocks:
          - type: paragraph
            body: >-
              本章最强的产品技术证据，是到 2025-2026 年更新节奏时，Terran R 已远远超过幻灯片阶段。Relativity 2025 年 3 月声明称，项目在 2024 年 12 月通过整箭级
              CDR，并已启动首飞生产。2025 年 11 月至 2026 年 4 月的月度更新随后给出具体硬件信号：一级贮箱焊接完成、二级结构验收测试、Stennis
              单日六台发动机、二级装配放行、专用一级鉴定件、第二次飞行硬件同步启动、下导管焊接，以及所有首飞 Aeon R 发动机最终发运。地点页面通过公布各主要场地当前职责加强了这些主张：Long Beach
              是生产和部件测试中心，R Complex 和 E2 是发动机测试骨干，A-2 是未来级段测试台，LC-16 是围绕 Terran R 运营重建的 Florida
              发射场。关键区别在于已观察到的进展和已完成的产品证明。公开记录现在支持硬件存在、测试活跃、基础设施实质推进；但还不支持整合后的火箭已完成级段静态点火、进入轨道或回收助推器。
