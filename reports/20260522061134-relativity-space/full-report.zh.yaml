  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争基线：Falcon 9 定义了信任的参考价格
        blocks:
          - type: paragraph
            body: >-
              最重要的竞争事实不是 Terran R 也想达到 Falcon 9 级载荷，而是 Falcon 9 已经以规模化运营把发射从火箭参数之争变成执行信任之争。SpaceX 官方统计显示，Falcon 9
              已完成数百次发射、着陆和复飞；Aerospace America 描述 Falcon 9 仅 2025 年就飞行 165 次。这份运营记录很关键，因为 Space Force 采购已经把 SpaceX
              当作默认的商业化选项：Spaceflight Now 在 2025 年 4 月拆解中报道称，当时 Falcon 9 是唯一拿到 Phase 3 Lane 1 实际任务订单的火箭。尽调含义是，Terran R
              进入的不是绿地市场。它是在要求买方把任务从一款已经兼具公开竞争性价格、被证明的节奏和政府信任的可复用火箭上迁走。因此，Terran R
              需要的不只是可比载荷主张；它要证明新的制造系统、新的助推器和新的发射运营，能缩小 Falcon 9 多年复利形成的信任差距。
