      - number: '6.4'
        title: 信任、进度与持续性风险
        blocks:
          - type: paragraph
            body: >-
              客户信任要放在 Terran 1 重置之后看。Iridium 的原始合同最多覆盖六次按需 Terran 1 发射；随后 Terran 1
              只飞了一次，完成级间分离，却未能入轨，并在一个月后取消，Relativity 全面转向 Terran R。2023 年 4 月，Iridium 和 OneWeb
              都公开支持这一转向；这个信号有用，说明客户宁愿等一款更大、更匹配需求的火箭，也不想继续较小项目。即便如此，支持性引述不等于已执行修订或成功发射。后续进度证据仍偏支持但需要谨慎：公司继续发布 2026
              年末首飞口径，2026 年 5 月更新显示硬件确有进展，SpaceNews 解释了为什么这型火箭没赶上 NSSL Phase 3 首轮。因此，本章的持续性证据主要体现为客户耐心，而不是运营中的重复使用。SES
              扩大合作说明部分客户愿意继续等待；但在 Terran R 飞起来之前，每一段客户关系押注的仍是路线图可信度，而不是已验证的服务质量。
