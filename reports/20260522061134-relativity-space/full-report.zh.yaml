      - number: '6.3'
        title: 具名客户证据及其证明内容
        blocks:
          - type: paragraph
            body: >-
              OneWeb、Intelsat 和 SES 是公开资料中最有分量的 Terran R 客户证据，因为每个都绑定了具名的多次发射协议、客户高管引述，以及符合该火箭公开市场定位的任务场景。OneWeb
              证明早期星座需求，也大概率意味着较大的发射清单需求，但确切发射次数和金额仍未由官方披露，即便 TechCrunch 报道过两位数发射承诺。Intelsat 证明严肃的 GEO/MEO
              电信买方愿意签下一款尚未飞行的火箭，并公开把可靠性、效率和灵活性列为选择标准。SES 给出的持续性信号最强：它不仅通过收购承接了 Intelsat
              敞口，后来还扩大了合作，纳入此前未公布的发射任务。政府侧记录证明的是另一件事。NASA 说明 Terran 1 时代确实存在固定价格发射客户，OSP-4 证明公司有资格争取未来军方发射工作，AFRL
              增材制造奖项说明防务买方信任 Relativity，愿意购买技术工作。不过这些记录都不能证明 Terran R 已飞任务或交付后的客户结果。
