  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 融资历史与资本结构背景
        blocks:
          - type: paragraph
            body: >-
              公开来源包中最干净的资本记录仍停在 2021 年 6 月 Series E 轮。Relativity 自有新闻稿称，公司完成由 Fidelity 领投的 $650 million
              融资，BlackRock、Coatue、Soroban、Tiger Global、Baillie Gifford、Mark Cuban、Jared Leto 以及其他既有支持者参投。CNBC 独立把该轮与
              $1.34 billion 累计融资和 $4.2 billion 估值联系起来；其更早的 2020 年 11 月报道则称，上一轮 Series D 融资 $500 million，投后估值约 $2.3
              billion。此后公开记录变得嘈杂。KPMG 的 Q4'23 Venture Pulse 和 Yahoo/Forge 都指向 2023 年末一次规模很大的 Series F 式事件，但 Access IPO
              发布了小得多且相互矛盾的 Series F 描述；这些页面都没有提供治理安排、证券条款或经审计的股权结构表计算，无法作为标准口径使用。2025 年 3 月重置在控制权上更清晰，在价格上不清晰：TechCrunch
              称 Eric Schmidt 完成重大投资、取得控股权并出任 CEO，但公开来源仍未披露确切对价、持股比例、反向拆股机制或该交易附带的优先权。
