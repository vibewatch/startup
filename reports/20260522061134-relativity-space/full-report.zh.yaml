        title: 合同与拨款锚点有帮助，但不是发射业务 P&L
        blocks:
          - type: paragraph
            body: >-
              来源包中的硬美元公开奖项真实存在，但相较积压订单标题仍很小。NASA 的 VCLS Demo 2 公告在 2020 年 12 月授予 Relativity 一份 $3.0 million
              固定价格合同；USAspending 和 SpaceNews 支持后来一份 $8.77 million 的 AFRL 增材制造奖项，关联实时缺陷检测研究。Relativity 自有 OSP-4
              公告又提供了一个有用区分：约 $986 million 的上限描述的是一个九年任务池，合格供应商可参与其中，并不是已经入账的公司收入。因此，这些记录锚定了政府客户确实向公司花过钱，但不能支撑 Relativity
              已经拥有 Terran R 规模、可反复运转的发射服务收入引擎。一个奖项是 Terran 1 时代的小型演示发射合同，一个是制造研究而非轨道服务收入，一个只是获得未来任务订单竞争资格。Space
              Foundation 和 WEF/McKinsey 的更广义太空经济数字也强化同一谨慎点：巨大的可寻址市场存在，但市场规模不会把已签或理论需求自动转成确认后的发射商收入。
