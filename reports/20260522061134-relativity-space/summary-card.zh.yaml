summary:
  headline: Relativity 的「制造 + 发射」逻辑有差异化，已签需求也有分量；但 Terran R 仍未首飞，积压订单不是收入，2021 年后融资不透明，发射竞争又极其残酷，当前股权更值得观察，不适合激进承保。
