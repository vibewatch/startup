summary:
  headline: >-
    Relativity has a differentiated manufacturing-plus-launch thesis and meaningful signed demand, but Terran R is still
    pre-flight, backlog is not revenue, and opaque post-2021 financing plus brutal launch competition make the equity
    interesting to track rather than underwrite aggressively today.
