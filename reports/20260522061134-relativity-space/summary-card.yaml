  topStrengths:
    - >-
      Real demand exists before first flight: public backlog moved from $1.2B in 2022 to more than $2.9B by March 2025
      and includes named customers such as OneWeb, Intelsat, and SES.
    - >-
      Relativity still looks differentiated on manufacturing: hybrid structures plus in-house additive propulsion,
      regular 2025-2026 program updates, completed vehicle CDR, and ongoing engine/pad progress support a real hardware
      story rather than a slideware-only thesis.
    - >-
      The company has commercial and government-adjacent relevance at the same time, with telecom launch buyers, NASA
      heritage awards, OSP-4 eligibility, and AFRL manufacturing work all validating market fit.
    - >-
      Eric Schmidt's control investment appears to have bought time for the Terran R push instead of forcing an
      immediate shutdown or a publicly visible down-round liquidation event.
  topRisks:
    - >-
      Terran R remains pre-flight: no public source in the reviewed pack shows an integrated stage hot-fire, orbital
      mission, booster recovery, or reflight, so the core reuse-and-cadence thesis is unproven.
    - >-
      Capital intensity is high and liquidity is opaque. Public reporting says the company faced cash shortages in 2024,
      while audited cash balance, burn, and post-Schmidt financing terms remain undisclosed.
    - >-
      Backlog quality is hard to underwrite because public sources do not disclose deposit schedules, milestone billing,
      cancellation protections, concentration by customer, or any bridge from signed launches to revenue.
    - >-
      Competition is brutal: Falcon 9 already compounds trust through reuse and cadence, while Neutron and other
      vehicles are also competing for the same medium-lift demand before Terran R has flight heritage.
    - >-
      Strategic focus risk remains real because management is trying to finish Terran R, industrialize a complex hybrid
      factory system, and commercialize adjacent manufacturing initiatives at the same time.
  unresolvedGaps:
    - >-
      Exact post-Schmidt cap-table terms, ownership percentage, security seniority, and dilution mechanics are not
      public.
    - >-
      No audited revenue, cash, burn, gross-margin, or ARR disclosure was found, and the public revenue figures are
      estimated only.
    - >-
      Public sources do not disclose customer-level backlog concentration, deposits, cancellation rights, or rebooking
      behavior after the Terran 1 reset.
    - >-
      The reviewed pack still lacks Terran R flight evidence such as a public stage hot-fire result, first launch
      outcome, recovery data, or route into Lane 1 task-order eligibility.
    - >-
      The reviewed sources do not conclusively reconcile whether the company's canonical founding date should be treated
      as 2015 or 2016.
