  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing private metric
      - Why it matters
      - Current public state
      - Exact diligence path
      - Underwriting consequence
    rows:
      - - Audited revenue and 2024-2025 financial statements
        - Needed to separate backlog optics from recognized revenue and cash generation
        - Only low-confidence GetLatka revenue estimates are public in the fetched pack
        - Request audited statements or management-certified monthly revenue bridge
        - Revenue quality remains unproven
      - - Monthly burn and cash balance
        - Required for runway, covenant, and next-round timing analysis
        - Cash-pressure reporting exists, but no cash balance or burn schedule is public
        - Request trailing-12-month cash bridge and board budget through first Terran R flight
        - Capital adequacy remains inferential
      - - Gross margin and launch-cost stack
        - Determines whether cadence scales value or losses
        - Official sources market competitive economics without disclosing unit margin
        - Request direct mission cost, overhead absorption, and refurbishment model
        - Margin path cannot be underwritten
      - - Backlog timing, deposits, and customer concentration
        - Needed to assess revenue conversion risk and concentration risk
        - Contract values exist, but value by customer, year, and deposit status does not
        - Request backlog aging schedule, deposit percentage, and top-customer exposure
        - Backlog cannot be translated into annual revenue safely
      - - Horizon / additive business contribution
        - Could diversify revenue beyond launch, but only if bookings and margin exist
        - Business unit is public; revenue and profitability are not
        - Request business-unit P&L, booked work, and capex requirement
        - Diversification remains strategic optionality, not a proven earnings stream
    notes: These are the blockers that matter most to underwriting. The issue is not simply that Relativity is private; it is that the public record lacks the specific bridges from demand, capital, and manufacturing scale to durable earnings.
