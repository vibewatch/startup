  - id: revenue-quality-backlog-and-monetization
    title: 'Revenue Quality: Backlog, Not Yet Proved Revenue'
    body: >-
      Public commercial traction is much more visible than public revenue quality. Official Relativity
      sources show backlog stepping up from more than $1.2 billion across five Terran R customers in 2022
      to more than $1.8 billion across nine customers in 2023, then to more than $2.9 billion across more
      than a dozen customers in March 2025, and finally to more than $3 billion of launch service
      agreements on today's Terran R page. Those are meaningful demand signals, but they are not ARR and
      should not be treated as recognized launch revenue. The same source pack withholds the timing of
      launches, customer prepayment structure, milestone schedule, cancellation protections, and the share
      of backlog tied to any single account. The only direct revenue-like numbers in the pack come from
      GetLatka, which says Relativity reached $150 million in 2024 and $181.5 million in late 2024 while
      also warning that its figures may be company-reported or GetLatka-estimated. That makes the low-
      confidence revenue claims usable as context for scenario ranges, but not as underwritten evidence of
      durable recurring revenue or launch gross profit.
    claimRefs:
