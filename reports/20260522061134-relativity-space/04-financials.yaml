    title: The 2025 valuation should be treated as a range, not a point estimate
    body: Public private-market pages conflict too much to support one canonical number. The prudent publication stance is to preserve a 2025 valuation range anchored by low-confidence signals while keeping the 2021 Series E mark as the last clean reference point.
