figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    layout: wide
    summary: Signed launch agreements create demand proof, but revenue conversion still depends on undisclosed terms, delivery milestones, and successful missions.
    data:
      nodes:
        - id: demand
          label: Signed launch demand
          type: input
          detail: Backlog and launch service agreements above $2.9B to $3.0B
        - id: terms
          label: Deposit / milestone terms
          type: process
          detail: Publicly undisclosed for SES, Intelsat, and most commercial agreements
        - id: build
          label: Vehicle build + mission integration
          type: process
          detail: Capital-intensive hardware, testing, and pad readiness before flight
        - id: launch
          label: Successful launch campaign
          type: process
          detail: Revenue at scale depends on Terran R actually flying and repeating
        - id: recognize
          label: Recognized revenue
          type: process
          detail: No public bridge from signed backlog to revenue timing
        - id: profit
          label: Gross profit / cash conversion
          type: output
          detail: Margin and cash-collection mechanics are not publicly disclosed
        - id: side
          label: Small disclosed non-launch awards
          type: input
          detail: NASA VCLS and AFRL additive-manufacturing work provide only limited hard-dollar anchors
      edges:
        - from: demand
          to: terms
          label: contract economics matter
        - from: terms
          to: build
          label: milestones fund execution
        - from: build
          to: launch
          label: flight readiness required
        - from: launch
          to: recognize
          label: service delivery enables billing
        - from: recognize
          to: profit
          label: margin depends on cost stack
        - from: side
          to: recognize
          label: small contracts can create limited current revenue
    approximationNotes: The bridge is directional, not a recognized-revenue policy statement. It emphasizes that backlog does not become ARR or realized revenue at signature.
