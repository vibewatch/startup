callouts:
  - calloutType: risk
    title: Backlog is the core traction metric, but it is not yet a revenue-quality metric
    body: Official disclosures make customer demand visible, yet they stop at aggregate contract value. Without payment schedules, cancellation terms, launch timing, and mission completion history, the backlog cannot be translated cleanly into ARR, recognized revenue, or gross profit.
    claimRefs:
      - CI020
      - CI021
      - CI024
      - CI033
      - CI034
  - calloutType: risk
    title: Schmidt likely reduced immediate financing stress, not disclosure risk
    body: The March 2025 control reset appears real, and low-confidence sources suggest it bought runway. But the public record still lacks the price, cap-table impact, cash balance, and burn rate needed to decide how long that runway lasts.
    claimRefs:
      - CI016
      - CI017
      - CI018
      - CI019
      - CI043
  - calloutType: insight
    title: Government awards validate capability but do not underwrite Terran R economics
    body: NASA and AFRL prove that public buyers have spent actual dollars with Relativity, yet the disclosed awards total only about $11.77 million and include research work rather than repeat Terran R launch service revenue.
