  - id: government-contract-anchors
    title: Contract and Grant Anchors Help, but They Are Not a Launch P&L
    body: >-
      The hard-dollar public awards in the pack are real but modest compared with the backlog headlines.
      NASA's VCLS Demo 2 announcement awarded Relativity a $3.0 million fixed-price contract in December
      2020, and USAspending plus SpaceNews support a later $8.77 million AFRL additive-manufacturing award
      tied to real-time flaw detection research. Relativity's own OSP-4 announcement adds another useful
      distinction: the roughly $986 million ceiling describes a nine-year mission pool open to eligible
      providers, not booked company revenue. These records therefore anchor that government customers have
      spent actual dollars with the company, but they do not support a thesis that Relativity already has a
      recurring launch-services revenue engine at Terran R scale. One award is a small demonstration launch
      contract from the Terran 1 era, one is manufacturing research rather than orbital service revenue, and
      one is only access to compete for future task orders. The broader space-economy numbers from Space
      Foundation and WEF/McKinsey reinforce the same caution: a large addressable market exists, but market
      size does not convert signed or theoretical demand into recognized launcher revenue.
    claimRefs:
      - CI025
      - CI026
      - CI027
      - CI028
      - CI035
      - CI036
      - CI045
  - id: burn-capital-intensity-and-runway
    title: Burn, Capital Intensity, and Financing Dependency
    body: >-
      The public evidence strongly supports capital intensity, but not a precise runway model. Relativity's
      2022 Stargate release described a 1MM+ square foot headquarters, a factory that was only 33%
      operational at the time, more than a dozen planned giant printers, and a forecast run rate of four
      Terran R rockets per printer per year at full capacity. The current Terran R page and March 2025
      update add engine qualification work, stage production, pad buildout, and a first-flight campaign that
      still sits ahead of revenue at scale. Those facts support an intuitive conclusion: this is a hardware-
      heavy, facility-heavy, labor-intensive development program whose cost base should remain elevated
      until Terran R flies repeatedly. Adverse reporting sharpens that picture. TechCrunch says the company
      faced cash shortages in 2024 and struggled to raise more funding before Schmidt's investment, while
      TSG repeats an unverified claim that Relativity had burned through more than $1 billion and that
      Schmidt's check may have approached $800 million. The correct underwriting posture is therefore not
      that runway is safe, but that near-term insolvency risk may have eased while the exact burn rate,
      cash balance, debt obligations, and launch-to-cash conversion still remain undisclosed.
    claimRefs:
