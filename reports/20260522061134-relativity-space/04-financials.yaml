  evidenceGaps:
    - type: missing-source
      severity: material
      topic: contract terms
      missingEvidence: Signed launch service agreement terms showing deposits, milestone billing, cancellation rights, and refund mechanics.
      whyItMatters: Without contract economics, backlog cannot be translated into recognized revenue timing, cash collection, or revenue quality.
      diligencePath: Request executed LSA excerpts or a management backlog waterfall that shows payment triggers and cancellation protection by major customer.
      relatedQuestionRefs:
        - QI012
      relatedTableRefs:
        - TI001
        - TI002
    - type: missing-source
      severity: material
      topic: burn and runway
      missingEvidence: Month-end cash balance, monthly burn, committed capex, and any debt or vendor-financing obligations.
      whyItMatters: Capital adequacy is the core underwriting question for a pre-flight launch company, and the public pack cannot answer it directly.
      diligencePath: Request a trailing-12-month cash bridge plus the internal budget through first Terran R flight and first repeat mission.
      relatedQuestionRefs:
        - QI021
        - QI022
      relatedTableRefs:
        - TI003
        - TI004
    - type: missing-source
      severity: material
      topic: unit economics
      missingEvidence: Per-launch cost stack, gross margin, refurbishment assumptions, and realized price by mission type.
      whyItMatters: Margin path determines whether increasing cadence creates operating leverage or scales losses.
      diligencePath: Request direct mission cost models, launch ASPs, and management's gross-margin bridge for the first five Terran R missions.
      relatedQuestionRefs:
        - QI023
      relatedTableRefs:
        - TI002
        - TI003
    - type: missing-source
      severity: material
      topic: customer concentration
      missingEvidence: Backlog and expected revenue by customer, launch year, and mission program, plus any concentration limits or top-customer exposure.
      whyItMatters: A pre-flight company can appear diversified in logos while still being economically dependent on only one or two launch programs.
      diligencePath: Request backlog aging, top-customer share, and scenario analysis for slips or cancellations by the largest customers.
      relatedQuestionRefs:
        - QI024
      relatedTableRefs:
        - TI001
        - TI005
    - type: private-evidence-only
      severity: material
      topic: revenue quality
      missingEvidence: Audited 2024 revenue and a reconciliation from any private-company ARR or run-rate figures to GAAP or management-recognized revenue.
      whyItMatters: The only public revenue numbers in this run come from low-confidence profile pages and cannot support valuation or runway decisions on their own.
      diligencePath: Request audited or board-approved financial statements, plus a bridge from bookings and backlog to recognized revenue.
      relatedQuestionRefs:
        - QI010
        - QI026
      relatedTableRefs:
        - TI001
        - TI005
    - type: missing-source
      severity: minor
      topic: horizon economics
      missingEvidence: Horizon bookings, revenue, margin, and capex requirements as a separate business line.
      whyItMatters: Horizon could eventually diversify revenue away from launches, but today that upside is strategic optionality rather than evidenced economics.
      diligencePath: Request a business-unit P&L and booked-work pipeline for Horizon Manufacturing Technologies.
      relatedQuestionRefs:
        - QI008
        - QI026
      relatedTableRefs:
        - TI001
        - TI005
