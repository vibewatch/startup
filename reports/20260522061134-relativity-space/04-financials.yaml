        - Aggregate backlog / LSA value
        - '> $2.9B in March 2025; > $3.0B on current Terran R page'
        - Strong demand signal, but not recognized revenue and not ARR
        - Request backlog waterfall by launch year, customer, deposits, and cancellation terms
      - - NASA VCLS Demo 2
        - Fixed-price demonstration launch services contract
        - Award amount
        - $3.0M awarded in December 2020
        - Real dollar award, but small and historical rather than recurring Terran R revenue
        - Request mission completion status and cash-collection history
      - - AFRL additive-manufacturing research
        - Two-year R&D contract for flaw detection in large-format additive manufacturing
        - Award amount
        - $8.77M award recorded in April 2024
        - Useful non-launch revenue anchor, but not proof of launch-services scale economics
        - Request contract margin, staffing load, and follow-on probability
      - - Horizon Manufacturing Technologies
        - Stand-alone business unit for industrial castings / manufacturing services
        - Business-unit revenue
        - Public business-unit existence; no revenue disclosed
        - Optional diversification only until bookings or revenue are shown
        - Request Horizon bookings, revenue split, and gross-margin disclosure
      - - OSP-4 / future government task orders
        - Eligibility to compete for future missions in a ceiling-value pool
        - Ceiling value / mission pool
        - '~20 missions and ~$986M ceiling across nine years for the pool'
        - Opportunity indicator, not booked revenue until task orders are won
        - Request actual awarded orders and pipeline conversion assumptions
    notes: Public evidence supports multiple monetization surfaces, but only two small hard-dollar awards are disclosed. Backlog and eligibility pools should not be booked mentally as revenue.
