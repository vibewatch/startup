slug: relativity-space
runDate: '2026-05-22'
company:
  name: Relativity Space
chapter:
  number: 8
  title: Valuation
  summary: 'Relativity Space''s cleanest valuation anchor is still the June 2021 Series E at $4.2 billion post-money. Later private-market signals point in conflicting directions — roughly $3.0 billion to $4.0 billion for current secondary-style indications and roughly $5.9 billion to $6.0 billion for a disputed late-2023 round reference — while official evidence since 2021 is dominated by backlog, not audited revenue. The chapter therefore takes a decisive but humble stance: demand is real and Schmidt''s capital likely bought time, but today''s valuation only works if Terran R flies on time, backlog converts into cash-paying launches, and the next financing is not punitive.'
sections:
- id: benchmark-and-conflicting-private-signals
  title: Benchmark Point and Conflicting Private Signals
  body: 'The valuation discussion has to start from the last clean mark, not the loudest rumor. Relativity''s own June 2021 Series E announcement confirms a $650 million raise, and CNBC tied that financing to $1.34 billion of cumulative capital raised and a $4.2 billion valuation. That is still the most supportable transaction benchmark in the public record. Everything after that is noisier. Yahoo/Forge shows a June 2025 derived valuation estimate of $3.96 billion while also displaying a November 2023 Series F reference at $5.86 billion, but the same page explicitly says Forge Price is informational, model-derived, and may rely on limited data. Access IPO pushes the late-2023 mark to $6 billion and says private valuations were closer to $3 billion in early 2025 after a reverse split, but its page is promotional and does not provide cap-table evidence. TechCrunch clarifies the control story without closing the pricing question: Eric Schmidt made a significant investment, took control, and
    replaced Tim Ellis as CEO, yet public sources still do not disclose the exact consideration, ownership percentage, security seniority, or dilution mechanics of that transaction. The right underwriting move is therefore to preserve the conflict rather than collapse it into a fake spot price.'
