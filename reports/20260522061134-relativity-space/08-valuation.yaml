  evidenceGaps:
  - type: missing-source
    severity: material
    topic: audited-revenue-recognition
    missingEvidence: Audited 2024-2026 revenue recognition, deferred revenue, customer deposits, and cash collection by major contract.
    whyItMatters: Without audited revenue conversion, backlog cannot be treated as a realized economic base for valuation.
    diligencePath: Request audited financials, monthly management accounts, and a backlog-to-revenue waterfall from finance.
    relatedQuestionRefs:
    - QV022
  - type: private-evidence-only
    severity: material
    topic: launch-contract-economics
    missingEvidence: Representative launch service agreements showing deposit size, milestones, delay remedies, cancellation rights, and customer concentration.
    whyItMatters: These terms determine whether backlog behaves like durable value or like a revocable option on future launch capacity.
    diligencePath: Review signed LSAs and recent amendments for top customers and compare booked backlog to contracted cash milestones.
    relatedQuestionRefs:
    - QV023
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-dilution
    missingEvidence: Current cap table, Schmidt transaction terms, reverse-split documentation, preference stack, and employee dilution detail.
    whyItMatters: Enterprise value is not the same as value available to current holders when control transactions and preferences are opaque.
    diligencePath: Request board-approved cap table, security summaries, and a fully diluted ownership bridge before and after the Schmidt transaction.
    relatedQuestionRefs:
    - QV024
  - type: conflicting-data
    severity: material
    topic: secondary-market-reliability
    missingEvidence: Actual secondary trade history, share-class mapping, quote depth, and platform methodology behind 2025 private price signals.
    whyItMatters: The chapter cannot treat thin, model-derived, or promotional pages as a precise current enterprise value without transaction evidence.
    diligencePath: Collect dealer blotters, platform prints, and cap-table-adjusted share-class translations for any recent trades.
    relatedQuestionRefs:
    - QV025
    relatedTableRefs:
    - TV003
