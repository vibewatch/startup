    - Meaningful
    - Schedule slips again, customers rebook, or new capital arrives on adverse terms
    - ' $1.5B-$2.5B'
    - Preflight launch demand can reprice sharply when proven alternatives exist
    - Successful launch cadence and disclosed cash conversion would invalidate the bear case
  notes: Ranges are underwriting bands, not banker-style target prices. They are anchored on the quality of public evidence, the maturity gap versus competitors, and the difference between backlog and realized economics.
