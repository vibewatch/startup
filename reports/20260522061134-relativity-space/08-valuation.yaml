- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Diligence path
  rows:
  - - Audited revenue recognition
    - GAAP revenue, deferred revenue, and cash-collection bridge for 2024-2026
    - Separates backlog narrative from real monetization
    - Request audited financials or lender-grade monthly reporting
  - - Launch contract economics
    - Representative launch agreements, deposits, milestones, delay remedies, cancellation rights
    - Determines how much of backlog deserves credit today
    - Review signed LSAs for top customers and sample amendments
  - - Cap table and dilution
    - Schmidt transaction terms, reverse-split mechanics, preference stack, employee dilution
    - Determines who actually captures enterprise value at exit
    - Request current cap table, board approvals, and security summaries
  - - Secondary-market reliability
    - Actual transaction data, share-class mapping, broker quotes, and clearance volumes
    - Determines whether 2025 private marks are real prices or thin indications
    - Collect dealer blotters or platform trade histories
  - - Customer concentration
    - Backlog split by account, launch year, and mission class
    - Concentrated backlog deserves a sharper haircut
    - Request customer-by-customer backlog waterfall
  - - Cash runway and burn
    - Cash balance, monthly burn, capex plan, and debt or vendor obligations
    - Clarifies whether first flight is funded without another recap
    - Request 12-18 month liquidity bridge and downside plan
  notes: 'These asks intentionally track the chapter''s four biggest evidence gaps: audited revenue, true contract economics, cap table / dilution, and secondary-market reliability.'
