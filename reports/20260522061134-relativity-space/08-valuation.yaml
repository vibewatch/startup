- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Observable threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - First flight slips again
    - Late-2026 target no longer holds or major vehicle issue emerges
    - Backlog credibility and financing confidence both weaken
    - Downgrade to bear-case underwriting
  - - Backlog quality deteriorates
    - Customer amendments, rebookings, or missing deposits surface
    - Demand signal converts into option value rather than cash value
    - Apply deeper haircut to backlog and scenario range
  - - Dilutive financing arrives before service
    - New money is raised on punitive terms or with heavy preference overhang
    - Current holders absorb dilution before launch economics are proved
    - Reset supportable value range downward
  - - Government access remains narrow
    - No meaningful post-flight path into Lane 1 or adjacent task-order pools
    - Public-sector diversification stays small relative to headline valuation
    - Keep value anchored to commercial-only execution
  - - Competitors absorb the market window
    - Falcon 9 remains supply leader while Neutron/Vulcan win the incremental missions
    - Scarcity premium collapses and customer alternatives strengthen
    - Treat 2021 benchmark as ceiling, not base case
  notes: These are monitorable triggers rather than vague risks. Each one directly changes the valuation case rather than simply lowering sentiment.
