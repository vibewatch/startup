- id: backlog-is-not-revenue-and-revenue-is-not-proved
  title: Backlog Is Not Revenue and Revenue Is Not Proved
  body: 'Official demand evidence is meaningful, but it is not the same thing as earned economics. Relativity''s March 2025 Terran R update says backlog exceeded $2.9 billion across more than a dozen customers, and the current corporate pages still market more than $3 billion of pre-sold launch contracts. SES and SpaceNews both confirm that customer demand has continued into late 2025. But the public packet does not disclose the launch-year waterfall, deposit percentages, milestone schedule, cancellation protections, rebooking remedies, or customer concentration behind those contracts. That distinction matters because Terran R has not yet flown. Pre-flight launch agreements deserve a haircut relative to ARR or recognized revenue: a satellite operator can be strategically supportive and still rebook around schedule, financing, insurance, or mission-assurance risk. The only revenue-like numbers in the reviewed pack come from GetLatka, which reports $150 million and then $181.5 million for
    2024 while also warning that its figures are company-reported or estimated. Hard-dollar government awards are far smaller than the backlog headline: NASA''s VCLS award is $3.0 million, USAspending shows an $8.77 million AFRL manufacturing award, and OSP-4 is a ceiling pool rather than booked revenue. The valuation case therefore cannot treat backlog as if it were already cash-converted launch revenue.'
