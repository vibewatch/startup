- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Demand
    - Backlog above $2.9B and continuing SES support show real customer demand
    - Backlog can still slip, resize, or rebook before the first operational flight
    - Deposits, launch-year schedule, and cancellation language
  - - Capital support
    - Schmidt control investment likely bought time to reach first flight
    - Exact economics are undisclosed and could still precede another punitive raise
    - Current cap table, security seniority, and remaining cash runway
  - - Revenue proof
    - GetLatka implies the company is no longer pre-revenue
    - No audited revenue, margin, or cash-collection bridge is public
    - Audited FY2024/FY2025 revenue recognition and gross-margin detail
  - - Manufacturing story
    - Hybrid manufacturing may be the pragmatic path to market
    - The shift weakens the original all-printed differentiation story
    - Proof that the hybrid path improves cadence and unit cost
  - - Competitive context
    - Large launch demand can support more than one provider
    - Falcon 9, Vulcan, and Neutron all reduce the scarcity premium
    - Proof of on-time launches and customer stickiness against alternatives
  - - Private pricing
    - Derived 2025 marks suggest the company still has material value
    - Derived and promotional pages are not a reliable enterprise value source
    - Actual secondary transaction data and Schmidt transaction terms
  notes: 'The chapter''s core analytical split is explicit: the company-quality thesis can be true while the current entry price still remains unattractive or under-proved.'
