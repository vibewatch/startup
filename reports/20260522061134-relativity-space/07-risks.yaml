- id: certification-procurement-and-regulatory-gates
  title: Certification, Procurement, and Regulatory Gates
  body: 'Relativity also faces a timing trap between vehicle readiness and procurement eligibility. SpaceNews reported
    that the company delayed its initial NSSL Phase 3 push because Terran R would not be ready inside the first
    on-ramp window, and official government material makes clear why that matters. Lane 1 exists to admit newer
    providers, but SSC and GAO still tie actual task-order eligibility to a successful first launch, while CRS describes
    a certification process that includes flight demonstrations, subsystem reviews, and payload-interface verification.
    Lane 2 is harder still, with more mission assurance, more difficult orbits, and stricter range and integration
    expectations. The effect is adverse but concrete: even if Terran R flies in late 2026, government diversification
    lags behind the first mission rather than arriving with it. The same chapter of risk applies to launch authorization.
    FAA pages and the Terran 1-era LC-16 environmental documents show real regulatory precedent, but they do not
    surface a Terran R-specific vehicle operator license package. FAA rules also separate site authorization from
    vehicle operator licensing and require financial responsibility for mishap damages. That means visible pad progress
    at LC-16 does not by itself prove Terran R is fully cleared to fly on the intended timeline.'
