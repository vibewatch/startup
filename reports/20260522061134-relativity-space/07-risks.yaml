  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash balance
    missingEvidence: Current cash balance, monthly burn, debt headroom, and the exact economics of Schmidt's rescue
      financing are not publicly disclosed.
    whyItMatters: Without a current cash waterfall, investors cannot tell whether Terran R can absorb another major
      slip without a down round or emergency financing.
    diligencePath: Request a monthly cash bridge, 12-18 month burn forecast, debt schedule, and the signed term
      sheet or board materials describing Schmidt's investment.
    relatedQuestionRefs:
    - QR019
    - QR020
    - QR021
    - QR023
  - type: private-evidence-only
    severity: blocking
    topic: contract cancellation clauses
    missingEvidence: Launch service agreements for SES, Intelsat, OneWeb, and other major customers do not publicly
      show deposits, termination-for-delay rights, rebooking rights, or milestone payment schedules.
    whyItMatters: Backlog headline value is not the same as collectible cash, and unknown remedy clauses make attrition
      risk impossible to price.
    diligencePath: Request representative launch service agreements, deposit schedules, and any amendments executed
      after the Terran 1 cancellation.
    relatedQuestionRefs:
    - QR011
    - QR012
    - QR014
  - type: missing-source
    severity: blocking
    topic: root-cause and reliability data
    missingEvidence: A publication-quality Terran 1 root-cause report, corrective-action package, Terran R mission
      assurance plan, integrated hot-fire evidence, and reliability-statistics package are missing from the public
      record.
    whyItMatters: Without these materials, delay risk, failed reuse economics, and customer trust cannot be underwritten
      at aerospace-quality standards.
    diligencePath: Request the Terran 1 failure review, closure evidence for corrective actions, current FMEA or
      mission assurance deck, and integrated stage-test records.
    relatedQuestionRefs:
    - QR001
    - QR003
    - QR025
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: Terran R licensing and environmental status
    missingEvidence: The reviewed public packet shows Terran 1-era FAA and LC-16 documents but not a Terran R-specific
      Part 450 vehicle operator license, supplemental NEPA package, or current permit matrix.
    whyItMatters: A licensing or environmental condition discovered late in the campaign can move first flight,
      add compliance cost, or reduce launch cadence.
    diligencePath: Request the current Terran R authorization matrix covering Part 450 status, NEPA supplements,
      wastewater permits, methane and LOX farm approvals, and range safety signoffs.
    relatedQuestionRefs:
    - QR009
    - QR010
    relatedTableRefs:
    - TR001
  - type: conflicting-data
    severity: material
    topic: private-market valuation signals
    missingEvidence: Public private-market pages disagree on valuation, total capital raised, reverse-split mechanics,
      and the size of the Schmidt financing.
    whyItMatters: Conflicting valuation data obscures dilution risk, preference overhang, and the probability of
      a down round before Terran R reaches recurring service.
    diligencePath: Request the latest cap table, financing chronology, preference stack, and any recapitalization
      documents completed in 2025.
    relatedQuestionRefs:
    - QR020
    - QR021
    - QR022
  - type: private-evidence-only
    severity: material
    topic: manifest phasing and customer concentration
    missingEvidence: The public record does not identify the debut Terran R customer, launch-year phasing by account,
      or the revenue concentration tied to any one operator group.
    whyItMatters: If the first commercial manifest is concentrated in a few satellite operators, a single customer
      rebooking decision can materially impair near-term revenue conversion.
    diligencePath: Request a manifest waterfall by customer and year, including the debut mission, top-customer
      exposure, and rebooking assumptions used in internal planning.
    relatedQuestionRefs:
    - QR011
    - QR013
    - QR014
