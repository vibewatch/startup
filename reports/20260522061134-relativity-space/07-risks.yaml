- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Integrated mission proof gap
    - Terran R stage or vehicle test milestones
    - No integrated stage hot-fire or equivalent mission-assurance disclosure before the debut campaign
    - Treat late-2026 first-flight guidance as too optimistic and re-underwrite schedule risk upward
  - - First-flight schedule risk
    - Public launch target updates
    - First orbital mission slips beyond late 2026 or into a materially later 2027 window
    - Escalate from watchlist risk to thesis damage because backlog, NSSL timing, and financing all worsen together
  - - NSSL access risk
    - Post-flight procurement status
    - No credible path into Lane 1 task-order competition after a successful first flight
    - Assume government diversification is slower than planned and trim long-term revenue-mix expectations
  - - Backlog quality risk
    - Customer announcement cadence
    - Any named customer rebooks, materially downscopes, or publicly reframes Terran R commitments after another
      slip
    - Treat backlog value as non-cash-like and haircut near-term launch-revenue assumptions
  - - Runway risk
    - Capital-raise or recapitalization activity
    - Need for fresh capital before reusable-flight proof or before backlog begins converting into cash
    - Assume dilution and preference-overhang risk is moving from optional to probable
  - - Reuse-economics risk
    - Early mission and refurbishment evidence
    - First flights reach orbit but do not produce a credible booster-recovery and turnaround path
    - Lower margin expectations and treat Terran R as potentially more expendable than the original thesis assumed
  notes: These are kill criteria, not forecasting targets. They identify the observable events that most clearly
    turn adverse possibilities into underwriting facts.
