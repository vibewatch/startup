    - High
    - Annual on-ramp windows and medium-lift demand remain open
    - Government diversification arrives later than the first commercial mission, if at all
  - - Launch and test infrastructure
    - LC-16 and NASA Stennis A-2 ecosystem
    - Enable stage tests, countdown operations, and first-flight campaign
    - High — there is no interchangeable duplicate public path today
    - A-2, Stennis, or LC-16 readiness slips even if vehicle hardware is ready
    - High
    - Relativity continues to invest heavily in both sites
    - Every extra dependency in the Long Beach–Stennis–Cape logistics chain can create a schedule choke point
  - - Incumbent launch benchmark
    - SpaceX Falcon 9
    - Sets customer expectation on reliability, price discipline, and cadence
    - Critical — the vehicle already dominates the addressable benchmark set
    - Customers prefer the flown incumbent or use it to force better terms
    - Critical
    - Relativity can still target missions needing another medium-heavy option
    - Falcon 9's launch, landing, and reflight scale keeps trust pressure permanently elevated
  - - Next-wave medium-lift challengers
    - Rocket Lab Neutron and ULA Vulcan
    - Provide credible alternatives in overlapping mission classes
    - Medium-High — both platforms matter even if their exact overlaps differ
    - Relativity reaches market just as other credible alternatives mature
    - High
    - Terran R still has a payload niche if it launches on time and proves reuse
    - Alternative supply reduces scarcity value and can compress pricing before Terran R proves itself
  - - Rescue-capital and governance concentration
    - Eric Schmidt
    - Provides capital, control, and outside credibility
    - High — one investor became the control pivot at a critical funding moment
    - Additional capital is needed before Terran R proves itself and the only viable path is highly dilutive
    - High
    - Schmidt likely reduced near-term insolvency risk and may help with government relationships
    - Exact terms remain undisclosed, so investors cannot tell whether the next financing event helps or harms minorities
  notes: This register mixes counterparties, facilities, and benchmark competitors because each can independently
