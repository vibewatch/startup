  - Diligence path
  rows:
  - - Part 450 Terran R vehicle operator license and mishap-financial-responsibility package
    - Federal FAA
    - Terran R-specific vehicle license not surfaced in reviewed public packet
    - Medium
    - High
    - LC-16 site work and prior Terran 1 precedent reduce greenfield risk
    - Late-stage licensing conditions or delayed financial-responsibility approval can move first flight and add
      cost
    - Request the current Part 450 application or license status, maximum probable loss analysis, and any unresolved
      FAA action items
  - - LC-16 environmental and permit stack beyond the Terran 1-era EA/FONSI
    - FAA / Space Force / Florida
    - Terran 1 EA and FONSI are public; Terran R-specific supplement not disclosed
    - Medium
    - Medium-High
    - Public LC-16 redevelopment is active and prior environmental baseline exists
    - Pad modifications, water systems, methane or LOX infrastructure, and wastewater conditions can still introduce
      schedule friction
    - Request the Terran R permit matrix, any supplemental NEPA analysis, and current wastewater or hazardous-material
      approvals
  - - NSSL Lane 1 on-ramp and first-task-order eligibility
    - U.S. Space Force
    - Initial bid delayed; actual task-order eligibility only after first successful launch
    - High
    - High
    - Annual on-ramp process remains open to emerging providers
    - Government-revenue diversification stays delayed even if the first mission succeeds late
    - Request the post-first-flight Lane 1 plan, debut mission timing, and the company's internal mission-assurance
      readiness review
  - - NSSL Lane 2 certification and critical-payload access
    - U.S. Space Force
    - Awards already placed with incumbents and barriers are higher than Lane 1
    - Medium-High
    - Critical
    - Long-term path exists if Terran R proves performance and range readiness
    - Relativity can remain excluded from the highest-value national-security missions for years if schedule or
      qualification slips
    - Request the lane-by-lane certification roadmap, range-readiness status, and vertical-integration or dual-range
      milestones
  - - Commercial launch-service contract remedies and cancellation rights
    - Private contracts / multi-jurisdiction
    - Public customer announcements omit deposit, termination, and delay-remedy language
    - High
    - High
    - Customer support remains public and no major public cancellation has been disclosed
    - Backlog may prove less sticky than headline value if customers have flexible rebooking rights
    - Request representative launch service agreements, amendment history after Terran 1 cancellation, and customer-by-customer
      milestone payment schedules
