callouts:
  - calloutType: risk
    title: No customer has yet flown on Terran R
    body: >-
      Relativity's customer proof is currently stronger before launch than after launch. Contracts,
      backlog, and named logos are real, but as of 2026-05-22 the public record still shows zero flown
      Terran R customer missions and therefore zero repeat-use evidence.
    claimRefs:
      - CU031
      - CU032
      - CU033
      - CU037
  - calloutType: insight
    title: SES expansion is the best public durability signal, but still not delivered performance
    body: >-
      The 2025 SES expansion matters because it came after the earlier Intelsat deal and after the
      Terran 1 reset, implying continued confidence from a sophisticated telecom buyer. Even so, the
      expansion remains an agreement-level signal; it does not prove mission execution, payload delivery,
      or customer satisfaction after launch.
    claimRefs:
      - CU009
      - CU010
      - CU012
      - CU038
      - CU047
  - calloutType: risk
    title: Commercial manifest concentration is likely higher than the public backlog headline suggests
    body: >-
      The named commercial proof set is dominated by satellite-network operators, and SES now overlaps
      with the earlier Intelsat relationship through acquisition. Because public sources do not disclose
      top-customer exposure or contract phasing, investors should assume concentration risk is material
      until a backlog-by-customer waterfall is produced.
    claimRefs:
      - CU012
      - CU040
      - CU045
      - CU048
