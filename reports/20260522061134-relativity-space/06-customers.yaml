  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / program
      - Segment
      - Deployment / use case
      - Production vs pilot
      - What it proves
      - Limitation
    rows:
      - - OneWeb
        - Constellation operator
        - Gen 2 LEO satellite launches beginning with early Terran R service
        - Production backlog / future manifest
        - A real broadband operator reserved Terran R for next-generation deployment and may need many launches
        - Exact launch count and contract value remain undisclosed; no Terran R missions flown
      - - Intelsat
        - GEO / MEO telecom operator
        - Multi-launch agreement for future Intelsat satellites as early as 2026
        - Production backlog / future manifest
        - A major fleet operator chose an unflown reusable vehicle for future missions
        - Launch count and contract value were not publicly disclosed
      - - SES
        - GEO / MEO telecom operator
        - Expanded multi-launch relationship for GEO or MEO satellites
        - Production backlog / expansion signal
        - Best public durability proof because the relationship expanded and included unannounced launches
        - Number of launches, timing, and value are still undisclosed and no flight has occurred
      - - Iridium legacy
        - LEO communications operator
        - Up to six dedicated Terran 1 launches for ground spares on an as-needed basis
        - Legacy contract / obsolete vehicle
        - Shows early customer trust in responsiveness and dedicated-launch economics
        - Contract was tied to Terran 1, not Terran R, and no public mission completion is visible
      - - NASA VCLS Demo 2
        - Civil government launch buyer
        - Fixed-price smallsat demo launch contract
        - Pilot / demonstration
        - NASA spent real launch dollars with Relativity
        - Contract was small, Terran 1-era, and risk-tolerant rather than repeat medium-lift demand
      - - U.S. Space Force OSP-4
        - National-security launch pool
        - On-ramp eligibility for responsive launch task orders
        - Procurement access / not a flown mission
        - Relativity is inside a government launch vehicle that can issue future missions
        - Pool ceiling is not company backlog until task orders are actually won
      - - AFRL additive-manufacturing award
        - Government R&D buyer
        - Real-time flaw detection in large-format additive manufacturing
        - Production technical work / non-launch
        - Defense customers trust Relativity enough to buy manufacturing capability
        - Does not prove orbital launch adoption or Terran R manifest durability
    notes: >-
      Enumeration is intentionally partial and limited to named public relationships that directly mention
      Relativity. It is not a full manifest because most of the company's reported dozen-plus customers
      remain anonymous and because some government demand evidence is adjacent to launch rather than a
      booked Terran R mission.
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly named counterparties and programs tied to Relativity in retained 2020-2026 source pack;
        anonymous backlog customers and undisclosed contract amendments are out of scope.
