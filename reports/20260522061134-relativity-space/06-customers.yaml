  - id: segment-map-and-customer-side-demand
    title: Segment Map and Customer-Side Demand
    body: >-
      The named customer set breaks into four economically distinct buckets. First are commercial
      constellation operators, represented by OneWeb and the government-facing OneWeb Technologies
      business, where the buyer is reserving future deployment or communications capacity at scale.
      Second are GEO and MEO telecom fleet operators, represented by Intelsat and SES, where the value
      proposition is a reusable medium-to-heavy launcher sized for single large satellites, multi-orbit
      resilience, and diversification away from a narrow incumbent set. Third are civil and national-
      security launch buyers such as NASA and the U.S. Space Force, where Relativity has won either a
      real launch-services award or eligibility to compete inside a government launch vehicle. Fourth
      are government manufacturing or communications buyers, such as AFRL and the Space Force's PLEO or
      EMSS programs, which do not put payloads on Terran R directly but prove that the end markets in
      which Relativity's customers operate are funded and strategically important. That segmentation
      matters because it shows adoption is broad by mission type while still remaining concentrated in
      satellite-network operators on the commercial side.
    claimRefs:
      - CU016
