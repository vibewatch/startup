  - id: named-customer-proof-and-what-each-proves
    title: Named Customer Proof and What Each Proves
    body: >-
      OneWeb, Intelsat, and SES are the best public Terran R customer logos because each is tied to a
      named multi-launch agreement, a quoted customer executive, and a mission use case that fits the
      vehicle's published market positioning. OneWeb proves early constellation demand and likely large
      manifest appetite, but exact launch counts and value remain officially undisclosed even if
      TechCrunch reported a double-digit launch commitment. Intelsat proves a serious GEO/MEO telecom
      buyer was willing to sign onto an unflown vehicle and publicly framed reliability, efficiency, and
      flexibility as the selection criteria. SES provides the strongest durability signal because it not
      only inherited Intelsat exposure through acquisition but later expanded the relationship with
      previously unannounced launches. The government-side records prove something different. NASA shows
      a real fixed-price launch customer existed in the Terran 1 era, OSP-4 proves eligibility to chase
      future military launch work, and the AFRL additive-manufacturing award shows defense buyers trust
      Relativity enough to buy technical work. None of those records, however, establish flown Terran R
      missions or customer outcomes after delivery.
