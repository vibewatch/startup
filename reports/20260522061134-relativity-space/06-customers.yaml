figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Terran R customer journey from demand formation through selection, manifest holding, first-flight
      proof, and either expansion or attrition. The critical breakpoint is not contracting but the first
      successful payload delivery, because public proof is currently abundant before that point and sparse
      after it.
    data:
      nodes:
        - id: demand
          label: Demand formation
          detail: >-
            Operator or government buyer needs diversified launch capacity, resilient satellite services,
            or manufacturing capability beyond incumbent options.
        - id: fit
          label: Vehicle-fit evaluation
          detail: >-
            Buyer tests whether Terran R's fairing, orbit range, reuse promise, and medium-to-heavy class
            fit constellation, GEO/MEO, or responsive-government missions.
        - id: contract
          label: Contracting or procurement access
          detail: >-
            Relationship takes the form of a multi-launch agreement, fixed-price demo award, IDIQ pool
            entry, or adjacent technical contract.
        - id: wait
          label: Manifest hold while vehicle matures
          detail: >-
            Customer waits through design, engine qualification, infrastructure buildout, and schedule
            revisions because Terran R has not yet entered service.
        - id: first-flight
          label: First successful payload delivery
          detail: >-
            This is the missing proof point that would convert customer trust from roadmap belief into
            demonstrated service credibility.
        - id: outcome
          label: Expansion or reallocation
          detail: >-
            After first-flight proof, customers can add launches, stay in queue, or shift missions away if
            schedules or reliability disappoint.
    approximationNotes: >-
      Stages are analytical and derived from public contract language plus launch-industry buying norms.
      The public source pack documents the path through contracting and waiting very well, but not yet the
      path from first flight into repeat use.
    claimRefs:
      - CU018
      - CU023
      - CU031
      - CU033
      - CU037
      - CU044
      - CU049
