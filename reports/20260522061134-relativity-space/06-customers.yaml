  - id: TU006
    title: Agreement-versus-performance boundary table
    columns:
      - Evidence class
      - Public example
      - What it proves
      - What it does not prove
    rows:
      - - Signed multi-launch agreement
        - OneWeb, Intelsat, SES Terran R announcements
        - A customer reserved future launch capacity and is willing to be named
        - Successful mission execution, on-time delivery, or customer retention after flight
      - - Customer-side endorsement or quote
        - OneWeb CTO, Intelsat SVP, SES CEO comments
        - Named executive willingness to back the provider publicly
        - That launch pricing, schedule, or reliability has been validated in service
      - - Fixed-price government launch award
        - NASA VCLS Demo 2
        - Real government spend on Relativity as a launch provider
        - Terran R-scale recurring revenue or post-flight customer satisfaction
      - - IDIQ / on-ramp eligibility
        - OSP-4
        - Right to compete for future military launch missions
        - A disclosed task order, flown mission, or realized revenue
      - - Non-launch government contract
        - AFRL additive-manufacturing award
        - Defense trust in Relativity technical capability
        - Orbital launch adoption or manifest durability
      - - Delivered Terran R mission performance
        - None public as of 2026-05-22
        - Would prove payload delivery, launch operations, and real schedule execution
        - Not available yet
      - - Repeat flown use / renewal metrics
        - None public as of 2026-05-22
        - Would prove durability, retention, and customer satisfaction
        - Not available yet
    notes: >-
      This boundary table is the chapter's core diligence discipline. Relativity has meaningful demand and
      customer endorsement, but the public evidence still stops well short of delivered Terran R service
      quality.
