  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Expansion driver
      - Concentration risk
      - Impact
      - Current evidence
      - Diligence path
    rows:
      - - SES expansion plus Intelsat acquisition
        - Same corporate family now touches two public telecom relationships
        - High commercial backlog concentration risk
        - SES explicitly expanded in 2025 and Intelsat had already signed in 2023
        - Request backlog and launch-year split by ultimate parent customer
      - - OneWeb as a possible large early anchor
        - Third-party reporting implies a double-digit launch commitment
        - One buyer could absorb meaningful early flight capacity
        - Official sources confirm a multi-launch deal but not the exact count
        - Request minimum purchase schedule, options, and make-good provisions
      - - Late-2026 first-flight target
        - Delays could push customers to alternative launch providers
        - High schedule-driven attrition risk
        - NSSL timing miss and no public Terran R mission as of runDate
        - Request contractual delay remedies, rebooking rights, and launch windows
      - - No flown Terran R missions yet
        - Backlog quality still depends on roadmap credibility more than mission history
        - Very high trust concentration in first-flight execution
        - All public customer proof is pre-flight
        - Request first three mission assignments, payload manifests, and payment milestones
      - - Government work mix
        - Government demand is real but disclosed hard-dollar awards are much smaller than telecom backlog
        - Medium diversification benefit and medium scale mismatch
        - NASA and AFRL awards are real; OSP-4 is opportunity, not booked revenue
        - Request pipeline value by government program and probability of conversion
      - - Anonymous customer majority
        - Most of the claimed dozen-plus customers remain unnamed
        - Medium-to-high transparency risk around top accounts
        - Public source pack names only a handful of counterparties
        - Request top-10 customer concentration, deposits, and cancellation exposure
    notes: >-
      Expansion is visible, but concentration remains hard to quantify. The chapter can identify likely
      pressure points—telecom grouping, large-anchor manifest risk, and first-flight dependence—without
      being able to size them precisely from public evidence.
