slug: relativity-space
runDate: '2026-05-22'
company:
  name: Relativity Space
chapter:
  number: 6
  title: Customers
  summary: >-
    Relativity Space has real named customer proof—OneWeb, Intelsat, SES, an Iridium legacy
    relationship, NASA, and U.S. government programs—but almost all of the public evidence is
    contracted demand, quoted customer endorsement, or eligibility to compete rather than delivered
    Terran R launch performance. The strongest durability signal is SES's 2025 expansion after the
    earlier Intelsat deal, while the central customer risk remains unchanged as of 2026-05-22: no
    public source shows any customer has yet flown on Terran R, and launch counts, contract values,
    concentration, deposits, cancellation rights, and post-Terran-1 attrition remain largely
    undisclosed.
sections:
  - id: contracted-demand-versus-flown-performance
    title: Contracted Demand Versus Flown Performance
    body: >-
      Relativity's customer chapter is strongest when it keeps proof classes separate. Public evidence
      clearly supports that customers have signed onto Terran R: OneWeb did so in 2022, Intelsat in
      2023, and SES expanded its relationship in 2025 after later acquiring Intelsat. Company sources
      also moved the aggregate commercial story from more than $1.2 billion of backlog across five
      customers in 2022 to more than $1.65 billion across seven customers in 2023, more than $2.9
      billion across more than a dozen customers in March 2025, and $3 billion-plus of pre-sold
      launch contracts on the current company site. That is meaningful adoption proof in the sense of
      reserved demand. It is not delivered mission proof. As of the canonical run date, public sources
      still place the first Terran R launch in late 2026, and no public customer payload has yet flown
      on the vehicle. The underwriting conclusion is therefore narrow: Relativity has sold customers on
      future capacity, but it has not yet demonstrated Terran R reliability, schedule execution, or
      repeat-flight satisfaction in service.
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU006
      - CU009
      - CU027
