  - id: concentration-retention-and-open-gaps
    title: Concentration, Retention, and Open Gaps
    body: >-
      The biggest remaining customer questions are not whether anyone wants medium-to-heavy launch
      capacity, but how concentrated, firm, and durable Relativity's backlog really is. Public evidence
      suggests the commercial side is dominated by satellite-network buyers: OneWeb on the constellation
      side and SES-Intelsat on the GEO/MEO telecom side. That creates a plausible concentration problem,
      especially because SES now sits on both its own agreement and the acquired Intelsat relationship.
      Yet the public record still omits top-customer exposure, deposit schedules, launch-year phasing,
      milestone payments, cancellation rights, and whether any contracts were restructured or lost after
      Terran 1 was retired. The same gap exists for retention metrics. There is no public NRR, GRR,
      churn, renewal-rate, satisfaction, or repeat-flight dataset for Terran R customers because no
      public Terran R flights have occurred. Investors should therefore treat today's customer story as a
      mixture of credible demand and unresolved concentration risk: the logo set is real, the segment fit
      is coherent, but the backlog cannot yet be turned into a clean revenue-durability model.
    claimRefs:
      - CU010
      - CU012
      - CU040
      - CU041
      - CU045
      - CU047
      - CU048
      - CU049
    tableRefs:
      - TU005
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Named customers / programs
      - Buyer / user / payer
      - Core use case
      - What the proof actually shows
      - Key gap
    rows:
      - - GEO / MEO telecom operators
        - SES; Intelsat
        - Buyer and payer are satellite-fleet owners; end users are enterprise, video, mobility, and government connectivity customers
        - Launch single large GEO or MEO satellites with diversified medium-to-heavy capacity
        - Named multi-launch agreements and explicit customer quotes on reliability, flexibility, and resilience
        - No public launch counts, contract values, or flown Terran R missions
      - - Constellation operators
        - OneWeb; OneWeb Technologies demand context
        - Buyer is the constellation operator or proxy; payer is operator or government communications customer
        - Deploy Gen 2 LEO broadband capacity and serve government satcom demand
        - OneWeb signed a multi-launch deal and third-party reporting suggests a large launch block
        - Official launch count and value remain undisclosed; no Terran R deployment completed
      - - Civil launch buyers
        - NASA VCLS Demo 2
        - Buyer and payer are NASA programs; users are CubeSat and small mission stakeholders
        - Venture-class demonstration launch for risk-tolerant small satellites
        - NASA spent real dollars on Relativity as a launch provider
        - Small Terran 1-era demo contract, not repeat Terran R revenue
      - - National-security launch pool
        - U.S. Space Force OSP-4
        - Buyer and payer are the Space Force and broader DoD customers
        - Rapid launch procurement for payloads above 400 pounds and responsive missions
        - Relativity is eligible to compete for future task orders in a $986M pool
        - Eligibility is not the same as a disclosed mission award or booked company revenue
      - - Government communications demand anchors
        - OneWeb Technologies p-LEO; Iridium EMSS/SITH
        - Buyer is the communications provider; payer is the U.S. government end customer
        - Resilient LEO communications and military service continuity
        - Customer-side government budgets for LEO and satcom services are material and growing
        - These are market-demand proofs, not direct Terran R launch awards
      - - Government manufacturing / R&D buyers
        - AFRL / USAspending additive-manufacturing award
        - Buyer and payer are defense R&D organizations; user is Relativity's manufacturing team
        - Real-time flaw detection for large-format additive manufacturing
        - Defense customers will pay Relativity for technical manufacturing work
        - Proves manufacturing relevance rather than launch-service adoption
    notes: >-
      This table separates who is buying launch services from who is buying adjacent communications or
      manufacturing capability. The commercial Terran R backlog is still most clearly anchored in
      satellite-network operators, while government records split between launch eligibility, civil demos,
      and non-launch technical work.
