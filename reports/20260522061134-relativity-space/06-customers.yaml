  evidenceGaps:
    - type: missing-source
      severity: material
      topic: launch-count-disclosure
      missingEvidence: Exact launch counts and any minimum-flight commitments for the OneWeb, Intelsat, and SES agreements.
      whyItMatters: Without exact counts, the chapter cannot translate backlog into likely launch cadence, manifest occupancy, or customer concentration.
      diligencePath: Request the launch-count schedule, option structure, and any minimum annual launch obligations for each named telecom and constellation customer.
      relatedQuestionRefs:
        - QU004
      relatedTableRefs:
        - TU003
        - TU006
    - type: private-evidence-only
      severity: material
      topic: customer-retention-metrics
      missingEvidence: NRR, GRR, churn, renewal rate, post-mission references, and any Terran R customer satisfaction metrics.
      whyItMatters: Contract expansions can signal durability, but they are not a substitute for repeat-flight or renewal data that shows customers stay after service is delivered.
      diligencePath: Request renewal cohorts, reference calls, and any internal post-award or post-flight satisfaction dashboards by customer segment.
      relatedQuestionRefs:
        - QU018
      relatedTableRefs:
        - TU004
    - type: private-evidence-only
      severity: blocking
      topic: customer-concentration
      missingEvidence: Backlog and deposit exposure by top customer, including combined SES-Intelsat exposure and any OneWeb anchor share.
      whyItMatters: Customer concentration determines whether a single telecom group or constellation buyer can materially impair revenue if launches slip or contracts are amended.
      diligencePath: Request a customer-by-customer backlog waterfall with launch year, parent entity, cash collected, and cancellation-right protections.
      relatedQuestionRefs:
        - QU023
        - QU024
      relatedTableRefs:
        - TU005
    - type: missing-source
      severity: material
      topic: backlog-attrition-after-terran-1
      missingEvidence: Publicly documented amendments, terminations, or rebookings showing how customer contracts changed after Terran 1 was cancelled.
      whyItMatters: The pivot from Terran 1 to Terran R is the chapter's central trust event, and backlog quality cannot be fully assessed without knowing whether customers stayed on equivalent economics.
      diligencePath: Request redlined contract amendments, customer notices, or signed bridge agreements covering the 2023 program reset.
      relatedQuestionRefs:
        - QU025
      relatedTableRefs:
        - TU004
        - TU005
    - type: private-evidence-only
      severity: material
      topic: contract-terms-and-cancellation-rights
      missingEvidence: Deposit schedules, milestone billing, launch-window protections, and termination-for-delay clauses across the named commercial agreements.
      whyItMatters: Backlog is only as durable as the legal and economic terms behind it; without those terms, signed agreements cannot be translated into reliable future revenue.
      diligencePath: Review the top customer contract set, milestone schedules, refund triggers, and management's internal backlog-aging and cancellation-risk analysis.
      relatedQuestionRefs:
        - QU024
      relatedTableRefs:
        - TU005
        - TU006
