  - CE005
  - CE008
  - CE015
  - CE017
  - CE049
- id: FE002
  title: Terran R Customer Workflow and Operating Flow
  type: flow
  layout: standard
  summary: How a customer mission is supposed to move from contract through build, test, launch, and attempted first-stage recovery.
  data:
    nodes:
    - id: n1
      label: Contract and mission definition
      detail: Customer selects constellation, telecom, or government mission profile and payload-integration concept.
    - id: n2
      label: Payload and fairing configuration
      detail: Relativity matches the 5 m fairing, PAF, and dedicated or rideshare configuration to the mission.
    - id: n3
      label: Long Beach build and integration
      detail: Primary structures, engines, avionics, and major assemblies are produced and integrated at HQ.
    - id: n4
      label: Component and engine testing at Stennis
      detail: E2 and R Complex qualify components and accept flight engines before stage integration.
    - id: n5
      label: Stage qualification and shipment
      detail: Structural qualification, low-voltage checks, and transport prep bridge factory work to flight campaign.
    - id: n6
      label: Florida launch processing
      detail: Vehicle moves through HIF, launch-mount, propellant, and range-readiness activities at LC-16.
    - id: n7
      label: Launch and payload delivery
      detail: Second stage continues to orbit while the customer payload proceeds toward its contracted orbit.
    - id: n8
      label: First-stage entry and landing attempt
      detail: Booster performs flip, entry burn, grid-fin descent, landing burn, and offshore barge touchdown attempt.
    - id: n9
      label: Refurbishment and reuse loop
      detail: Recovered booster returns to Florida refurbishment flow for a future mission if the recovery campaign works.
