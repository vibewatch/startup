  evidenceGaps:
  - type: missing-source
    severity: material
    topic: terran-1-root-cause-disclosure
    missingEvidence: A detailed public technical report that identifies Terran 1's second-stage anomaly root cause, corrective actions, and closure criteria.
    whyItMatters: Without a full postmortem, outside diligence cannot independently judge how much upper-stage risk was actually retired before resources shifted to Terran R.
    diligencePath: Request the internal anomaly review, FAA correspondence, corrective-action matrix, and any hardware or software revalidation package generated after the March 2023 flight.
    relatedQuestionRefs:
    - QE018
    - QE028
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: terran-r-reuse-proof
    missingEvidence: Integrated stage-static-fire results, first-flight recovery telemetry, refurbishment procedures, and measured turnaround assumptions for Terran R Block 1.
    whyItMatters: Terran R's economic thesis depends on reusable first-stage operations, but public evidence stops before any orbital or recovery demonstration.
    diligencePath: Request stage-static-fire data, recovery test plans, TPS inspection criteria, barge-operations procedures, and modeled versus measured turnaround assumptions for Block 1.
    relatedQuestionRefs:
    - QE026
    - QE028
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: launch-readiness-closure
    missingEvidence: A public or shareable launch-readiness package covering maiden payload, integrated vehicle test completion, wet-dress rehearsal closure, and final range-readiness gates.
    whyItMatters: The difference between visible hardware momentum and actual service readiness is what determines whether the late-2026 target is credible.
    diligencePath: Request the integrated master schedule, closure status for vehicle HITL and stage test campaigns, and the critical path from Stennis shipment to LC-16 first launch.
