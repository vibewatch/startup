- id: development-progress-hardware-test-and-launch-infrastructure
  title: 'Development Progress: Hardware, Test, and Launch Infrastructure'
  body: 'The strongest product-tech evidence in this chapter is that Terran R had moved well beyond slides by the 2025-2026 update cadence. Relativity''s March 2025 statement says the program cleared vehicle-level CDR in December 2024 and had already begun first-flight production. Monthly updates from November 2025 through April 2026 then add concrete hardware signals: first-stage tank weld completion, second-stage structural acceptance testing, six engines at Stennis on a single day, stage-two assembly release, a dedicated stage-one qualification article, flight-two hardware beginning in parallel, welded downcomers, and finally shipment of all flight-one Aeon R engines. The locations page strengthens those claims by publishing the current role of each major site: Long Beach as the production and component-test hub, R Complex and E2 as the engine-test backbone, A-2 as the future stage-test stand, and LC-16 as the Florida launch site being rebuilt around Terran R operations. The key distinction
    is between observed progress and completed product proof. The public record now supports that hardware exists, testing is active, and infrastructure is materially advancing; it does not yet support that the integrated vehicle has completed stage static-fire, reached orbit, or recovered a booster.'
