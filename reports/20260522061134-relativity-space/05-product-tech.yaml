  title: Terran R Product Maturity and Capability Map
  type: matrix
  layout: wide
  summary: Maturity assessment across manufacturing, test evidence, flight evidence, reuse evidence, and public transparency for the main Terran R capability blocks.
  data:
    columns:
    - Manufacturing maturity
    - Qualification / test evidence
    - Flight evidence
    - Reuse evidence
    - Public evidence quality
    rows:
    - label: Hybrid primary structures
      values:
      - Medium-high — multiple tank and panel milestones public
      - Medium-high — acceptance testing and qualification article under way
      - None on Terran R
      - N/A
      - Medium
    - label: Aeon R first-stage propulsion
      values:
      - Medium-high — flight-one engines built and shipped
      - Medium-high — runtime, acceptance testing, and 300+ ops at R Complex
      - None on Terran R
      - None
      - Medium
    - label: Upper-stage vacuum engine
      values:
      - Medium — development and manufacturing visible
      - Medium — endurance and service-life milestones public
      - None after Terran 1 anomaly experience
      - None
      - Low-to-medium
    - label: LC-16 launch complex
      values:
      - Medium — hardware deliveries and utility activation visible
      - Medium — pad systems being brought online
      - None for Terran R
      - N/A
      - Medium
    - label: A-2 stage-test capability
      values:
      - Medium — renovation visibly under way
      - Medium — official target and capability range published
      - None
      - N/A
      - Medium
    - label: Terran 1 knowledge transfer
      values:
      - High historical value
      - High — real flight and ground data exist
      - Partial — Max-Q and separation only
      - None
      - Medium
    - label: Horizon / manufacturing commercialization
      values:
      - Low-to-medium — narrative and facility pages are live
      - Low — no public customer qualification package
      - No launch-flight relevance
      - N/A
      - Low
  approximationNotes: 'This matrix is an author judgement based on the depth of public evidence, not a company scorecard. “Flight evidence” is intentionally harsh: nothing in the chapter qualifies as Terran R orbital or reuse proof yet.'
  claimRefs:
  - CE019
  - CE045
  - CE046
  - CE047
  - CE048
  - CE050
  - CE051
  - CE053
callouts:
- calloutType: insight
  title: This is now a hybrid-manufacturing rocket program, not a pure-printing story
  body: The additive moat did not disappear, but it moved down the stack. Tanks and primary structures now lean on welded and machined metal, while printed propulsion hardware and factory software carry the most differentiated parts of the manufacturing thesis.
  claimRefs:
  - CE004
  - CE005
  - CE006
  - CE049
- calloutType: strength
  title: 2025-2026 evidence is substantially more concrete than the 2021-2023 concept phase
  body: Vehicle-level CDR, first-flight hardware, multiple stage milestones, hundreds of engine-test operations, and visible pad activation show that Terran R is now a real hardware campaign rather than a conceptual market slide.
  claimRefs:
  - CE021
  - CE023
  - CE024
  - CE031
  - CE032
  - CE036
- calloutType: risk
  title: No public Terran R orbit, landing, or refurbishment data exists yet
  body: 'The company has described a specific recovery sequence and substantial test activity, but the public record still stops before the proof points that truly determine launch economics: orbit, booster recovery, inspection burden, turnaround time, and repeatability.'
  claimRefs:
  - CE018
  - CE019
  - CE045
  - CE046
  - CE051
- calloutType: risk
  title: Terran 1 taught useful lessons, but the public failure file is still thin
  body: Terran 1 gives Relativity more real flight heritage than many prelaunch peers, yet external diligence still lacks a detailed technical root-cause package for the second-stage anomaly that ended the only mission.
  claimRefs:
  - CE037
  - CE038
  - CE041
