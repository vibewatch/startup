- id: terran-1-postmortem-and-knowledge-transfer
  title: Terran 1 Postmortem and Knowledge Transfer
  body: 'Terran 1 matters here less as a business line than as a pathfinder. Independent coverage and the company''s own retrospective agree on the important positives: the vehicle passed Max-Q, achieved stage separation, and gave Relativity a real flight environment for printed structures, methalox propulsion, avionics, and mission operations. Those are not trivial milestones for a startup launch program. At the same time, the flight did not reach orbit because of a second-stage problem, and the company retired Terran 1 only weeks later in favor of accelerating Terran R. Management and supportive coverage framed the smaller rocket as a concept-car-style proving ground rather than a product that should absorb additional commercial focus. That interpretation is plausible because the Terran 1 page now explicitly lists the engineering domains it says transfer forward to Terran R: propulsion cycle, flight software, GNC, structural dynamics, and aerothermodynamics. What remains missing is a full
    public failure report. The source pack supports summary-level explanations for the anomaly, but not the kind of detailed root-cause, corrective-action, and validation package a technical diligence team would want before confidently extrapolating Terran 1 learnings into Terran R reliability.'
  claimRefs:
  - CE037
  - CE038
  - CE039
  - CE040
