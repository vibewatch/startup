company:
  name: Relativity Space
chapter:
  number: 5
  title: Product & Technology
  summary: Relativity's product story is no longer the 2021 vision of a fully reusable, entirely 3D-printed Terran R. By March 2025 through April 2026, the company had completed vehicle-level CDR, begun flight production, shipped flight-one Aeon R engines, and materially advanced Long Beach, Stennis, A-2, and LC-16 infrastructure, but the public record now shows a hybrid manufacturing stack, a reusable-first-stage plan, and no demonstrated Terran R orbit or recovery yet. Terran 1 provided meaningful propulsion, printed-structure, GNC, and operations learning through Max-Q and stage separation, but the company retired it after one anomaly-hit flight and has not published a full technical root-cause report for the second-stage failure.
sections:
- id: additive-strategy-and-product-surface
  title: Additive Manufacturing Strategy and Product Surface
  body: 'Relativity still sells a combined launch-and-manufacturing identity, but the product story has clearly evolved. The 2021 Terran R reveal promised an entirely 3D-printed, fully reusable rocket and linked that ambition to the company''s software-defined factory thesis. The 2023 architecture update materially revised that posture: Terran R grew in size, first-stage reuse became the explicit priority, and initial vehicles moved to hybrid aluminum tank barrels instead of an all-printed primary structure. The March 2025 update made the trade even clearer by describing friction-stir-welded high-strength aluminum primary structures, in-house machining, and custom tooling for the vehicle, while retaining additive manufacturing where Relativity says it matters most for iteration speed and complexity: Aeon engines and other difficult parts. That does not mean the additive thesis disappeared. The Long Beach headquarters, the Portal R&D center, and the Horizon commercialization page all show
    Stargate and related robotics, simulation, and process-control capabilities still matter strategically. The difference is that additive is now positioned as one tool inside a broader factory system rather than as the literal manufacturing method for the whole launch vehicle.'
