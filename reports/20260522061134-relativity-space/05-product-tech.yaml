- id: TE004
  title: Trust, Quality, and Compliance Controls
  columns:
  - Control / metric
  - Public evidence
  - Status by runDate
  - Scope
  - Gap / implication
  rows:
  - - Vehicle system-level CDR
    - Official March 2025 update says CDR completed in Dec. 2024
    - Completed
    - Whole vehicle architecture and major subsystems
    - Good maturity signal, but not flight proof
  - - Second-stage structural acceptance test
    - Official Nov. 2025 update cites 30+ load cases including pressure proofing and flight loads
    - Completed for stage-two tank article
    - Structure workmanship and margins
    - Does not replace integrated stage static fire or orbital proof
  - - Dedicated stage-one qualification article
    - Late-2025 through early-2026 updates describe dedicated qualification hardware in parallel with flight hardware
    - In progress
    - Primary-structure qualification path
    - No public final qualification report yet
  - - Aeon R acceptance testing at Stennis
    - Official updates and locations page show active acceptance campaigns plus 300+ engine test operations at R Complex
    - In progress
    - Flight engines and reusable-life evidence
    - Clustered stage performance still unproven
  - - E2 component test history
    - Locations page says 900+ component tests and combustion-stability verification with flight-design gas generators and thrust chamber assemblies
    - Established
    - Subscale and component validation
    - Component depth is not the same as mission success
  - - Software HITL / run-for-record
    - Monthly updates cite HOOTL, HITL, low-voltage checkouts, and run-for-record testing progression
    - In progress
    - Avionics, flight software, GNC, and stage control
    - Public summaries do not expose edge-case coverage or fault trees
  - - Entry-aero validation
    - Official updates cite CFD and transonic/supersonic wind-tunnel work on grid fins and first-stage entry configuration
    - In progress
    - Recovery control authority and aerothermal load prediction
    - Still needs real flight correlation
  - - Terran 1 anomaly disclosure
    - Public sources confirm a stage-two anomaly and summary explanations, but no detailed public corrective-action report
    - Incomplete for outside diligence
    - Historical failure learning
    - Limits external confidence in upper-stage closure and management transparency
  notes: 'The table focuses on visible control mechanisms rather than certifications, because Terran R is still preflight. The last row is intentionally negative: disclosure quality is itself a trust control, and the public package is thin.'
