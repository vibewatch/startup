- id: TE001
  title: Relativity Product Module and Asset Matrix
  columns:
  - Product / asset
  - Primary user
  - Current status / maturity
  - Manufacturing basis
  - Differentiation
  - Diligence gap
  rows:
  - - Terran R launch service
    - Constellation, telecom, and government payload buyers
    - Pre-revenue; first launch still targeted for late 2026
    - Hybrid vehicle built in Long Beach, tested in Mississippi, launched from Florida
    - Reusable medium-to-heavy-lift positioning with 5 m fairing and medium-heavy payload class
    - No Terran R orbital flight or payload delivery demonstrated yet
  - - Reusable first stage
    - Relativity launch ops and future launch customers
    - Block 1 in development as the first recovery-learning vehicle
    - Friction-stir-welded aluminum structures plus printed Aeon R engines and reusable entry hardware
    - 13-engine methalox booster sized for barge recovery and future cadence economics
    - No public booster landing, refurbishment, or turnaround data
  - - Upper stage / payload delivery system
    - Satellite operators needing LEO, GTO, or mixed-manifest missions
    - Flight hardware and Aeon V/Aeon Vac testing underway
    - Common-dome stage with vacuum engine sharing major design commonality with Aeon R
    - 5.5 t reusable GTO headline and 33.5 t expendable LEO headline
    - Upper-stage reuse is not a near-term public proof point
  - - Stargate / Portal additive platform
    - Internal vehicle teams plus future industrial customers
    - Active and expanding as R&D and advanced manufacturing base
    - Large-scale additive, robotics, data science, simulation, and quality labs
    - Maintains rapid-iteration capability for engines and complex parts
    - Yield, scrap, and cost-per-part data remain private
  - - Stennis test network (R, E2, A-2)
    - Engineering, qualification, and launch-readiness teams
    - Operational for components and engines; stage-test capacity still being built out
    - Component cells, dual-bay engine complex, and renovated stage stand
    - Tight Long Beach-to-Stennis learning loop for engine and stage development
    - No public integrated Terran R stage hot-fire result by runDate
  - - Horizon manufacturing commercialization
    - Energy, aerospace, and defense hardware buyers
    - Early commercialization narrative visible; customer traction undisclosed
    - AI-enabled Stargate platform adapted for large metal hardware beyond rockets
    - Turns launch-manufacturing R&D into a second strategic asset
    - Named customers, unit economics, and revenue are not public
  notes: This matrix separates the launch product from the manufacturing stack that supports it. Status labels describe public evidence as of 2026-05-22, not management's aspirational end state.
