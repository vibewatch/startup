figures:
- id: FE001
  title: Relativity Product Architecture Map
  type: stack
  layout: wide
  summary: Five-layer view from customer mission demand down to vehicle systems and the industrial base that enables Terran R.
  data:
    layers:
    - label: Customer mission layer
      detail: Terran R is sold as a launch service for constellation, telecom, government, and rideshare missions that need medium-to-heavy lift without going to the heaviest-class providers.
      items:
      - Constellation batches
      - Single GEO or MEO telecom satellites
      - Multi-customer rideshare
      - Government and national-security-adjacent medium lift
    - label: Launch-service operations layer
      detail: Mission design, payload integration, launch execution, and first-stage recovery are treated as one operating system rather than separate products.
      items:
      - Mission design and customer integration
      - PAF / fairing configuration
      - LC-16 launch operations
      - Downrange first-stage recovery and refurbishment loop
    - label: Vehicle systems layer
      detail: Current public architecture centers on a hybrid-built two-stage vehicle with a reusable first stage and a non-proven upper-stage delivery system.
      items:
      - 5 m fairing and payload stack
      - Upper stage with vacuum engine (Aeon Vac / Aeon V)
      - Reusable first stage with 13-engine cluster
      - Grid fins, landing legs, base heat shield, and barge-landing profile
    - label: Propulsion, software, and control layer
      detail: The common thread from Terran 1 to Terran R is methalox propulsion plus in-house guidance, avionics, and test software.
      items:
      - Aeon R LOX-methane gas-generator engines
      - Upper-stage LOX-methane vacuum engine with major design commonality
      - Avionics, GNC, and HITL / run-for-record software path
      - Helium/COPV pressurization and common-dome tank architecture
    - label: Industrial base layer
      detail: 'The product is inseparable from the factory and test network: Long Beach builds, Stennis tests, and LC-16 launches.'
      items:
      - Long Beach HQ, machine shop, cryo yard, and Portal additive R&D center
      - Stennis E2 component cells and R Complex engine stands
      - A-2 stage-test renovation for long-duration hot fire
      - LC-16 HIF, launch mount, tank farm, and recovery-oriented Florida expansion
  approximationNotes: The layer boundaries are analytic rather than official. The figure is meant to show how the launch product, vehicle, and factory system fit together after the shift from all-printed rhetoric to a hybrid operating model.
