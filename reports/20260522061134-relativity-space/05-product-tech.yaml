- id: TE003
  title: Technology and Operating Architecture
  columns:
  - Layer / process
  - Publicly described role
  - 2026 status signal
  - Key dependencies
  - Key risk
  rows:
  - - Hybrid primary structures
    - Tanks, barrels, panels, and major structures for Terran R stages
    - In production with friction-stir welding, machining, paint, and integration work across flight and qualification hardware
    - Long Beach tooling, weld quality, coatings, inspection, and material supply
    - Process-integration risk rises as output scales across multiple vehicles
  - - Aeon R first-stage engines
    - 13-engine methalox booster propulsion and landing-burn system
    - Flight-one engines manufactured, assembled, shipped, and acceptance-tested by spring 2026
    - Printed combustion hardware, valves, avionics, test cadence, and Stennis activation
    - Qualification and cluster-level integrated performance remain to be proven in flight
  - - Upper-stage vacuum engine (Aeon Vac / Aeon V)
    - Orbital insertion after stage separation
    - Development and endurance testing active; mission-duty-cycle and service-life milestones reported
    - Commonality with Aeon R, vacuum interfaces, upper-stage tank integration, HITL software
    - No public in-flight upper-stage proof after Terran 1 anomaly
  - - Avionics, software, and GNC
    - Closed-loop engine control, navigation, trajectory design, HITL and run-for-record validation
    - HOOTL and HITL work described publicly; low-voltage checkouts underway on stage hardware
    - Flight-like boxes, harnesses, actuators, TVC, and software integration
    - Software maturity cannot be underwritten from summaries alone
  - - Reuse hardware
    - Grid fins, heat shield, landing legs, RCS flip, throttle valves, and relight capability
    - Wind-tunnel, CFD, and materials work publicly described; flight proof absent
    - Aerothermal models, actuation systems, TPS materials, barge ops, and refurbishment procedures
    - Recovery concept is credible but economically unproven
  - - Test and inspection stack
    - Reduces risk before engines, stages, and full vehicles reach the pad
    - Cryo yard, structural stands, NDE, modal tests, PAUT, and acceptance campaigns all active
    - Specialized stands, operators, metrology, and analysis workflows
    - Public evidence shows activity, not yield or defect-rate transparency
  - - Launch and transport network
    - Ships hardware from Long Beach to Mississippi to Florida and eventually recovers boosters in Florida
    - Long Beach, Stennis, and LC-16 roles now clearly defined on official locations and update pages
    - Marine transport, A-2 readiness, HIF, launch mount, tank farms, range coordination
    - Every missing handoff can become a schedule bottleneck
  notes: Rows mix directly observed architecture with operational inferences needed to connect factory, test, and launch activities. Risks emphasize what is not yet demonstrated publicly.
