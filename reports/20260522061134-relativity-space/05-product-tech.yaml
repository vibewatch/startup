- id: TE002
  title: Customer Workflow and Use-Case Table
  columns:
  - User job / mission
  - Current workflow pain
  - Relativity solution
  - Claimed / observable benefit
  - Major limitation
  rows:
  - - Megaconstellation batch deployment
    - Operators need frequent medium-heavy lifts without waiting on the busiest incumbents
    - Dedicated Terran R missions with 5 m fairing and reusable first-stage economics goal
    - Architecture explicitly sized for constellation clusters and large backlog discussions
    - Mission economics remain theoretical until first flights and recovery are demonstrated
  - - Single GEO or MEO telecom satellite launch
    - Heavy vehicles can be overscaled or manifest timing can be inflexible
    - Dedicated medium-heavy launch sized around reusable first-stage profile
    - SES describes reusable medium-to-heavy capability as a fit for GEO and MEO satellites
    - SES and Intelsat agreements prove interest, not flown performance
  - - Government medium-lift second source
    - National-security and civil buyers want more launch options than incumbent fleets
    - Terran R positioned for later NSSL on-ramp and broader government demand
    - Relativity is building around LC-16 plus Stennis and already has prior government awards
    - The company delayed initial NSSL entry because readiness was not close enough
  - - Reusable-launch operations loop
    - Expendable vehicles burn a new booster every mission and weaken cadence economics
    - Downrange barge recovery with refurbishment and rapid reflights as design goal
    - If successful, Block 1 and later Block 2 could lower long-run cost and expand cadence
    - No public refurbishment-time or repeatability evidence exists yet
  - - Manufacturing commercialization
    - Large metal hardware buyers face long lead times and brittle supply chains
    - Horizon adapts Stargate and Relativity process control for industrial castings and structures
    - Company claims flexible, software-driven production and shorter CAD-to-component cycles
    - Commercial uptake beyond website narrative is still unproven
  notes: Benefit statements are either explicit company claims or customer-language fit read directly from customer and architecture pages. The table intentionally separates mission fit from proof of execution.
