  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding date
    missingEvidence: A primary corporate record that definitively fixes whether Relativity was founded in 2015 or 2016.
    whyItMatters: The founding year is a core identity fact that later chapters may otherwise repeat inconsistently.
    diligencePath: Request Delaware incorporation documents, early YC materials, or a founder-confirmed legal formation record.
    relatedQuestionRefs:
    - QO001
  - type: private-evidence-only
    severity: material
    topic: governance and ownership
    missingEvidence: A current cap table, board roster, and the legal terms of Eric Schmidt’s 2025 controlling investment.
    whyItMatters: Control rights and board structure matter for governance risk, follow-on financing power, and key-person concentration.
    diligencePath: Ask management for the post-2025 ownership table, board seats, protective provisions, and any observer or veto rights.
    relatedQuestionRefs:
    - QO010
    - QO028
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: financial disclosure
    missingEvidence: Audited 2024-2025 revenue, ARR, burn, cash balance, and runway figures.
    whyItMatters: Without primary financial disclosure, private-market revenue and valuation estimates cannot be treated as canonical diligence inputs.
    diligencePath: Request board materials or investor updates that reconcile backlog, revenue recognition, cash burn, and remaining liquidity.
    relatedQuestionRefs:
    - QO014
    - QO016
    - QO028
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership and governance
    missingEvidence: The complete executive roster and independent director set beyond the few public figures visible in the source pack.
    whyItMatters: A partial leadership table is still useful, but missing governance actors can hide concentration or succession issues.
    diligencePath: Collect the latest org chart, board biographies, and committee structure from management or investor materials.
    relatedQuestionRefs:
    - QO009
    - QO010
    relatedTableRefs:
    - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder map
    missingEvidence: The full cap table, debt stack, and contract value or launch-count detail for the biggest commercial customers.
    whyItMatters: The stakeholder map can show who matters, but not the exact economic concentration without private documents.
    diligencePath: Request a customer backlog schedule and cap table waterfall that link named stakeholders to dollars, missions, and dilution.
