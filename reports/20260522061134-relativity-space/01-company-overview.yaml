- id: capital-stakeholders-and-demand
  title: Capital Base, Stakeholders, and Commercial Demand
  body: >-
    The last fully corroborated financing in the fetched pack is still the June 2021 Series E. Relativity’s own announcement and CNBC both support a $650 million round led by Fidelity with participation from BlackRock, Coatue, Tiger Global, Baillie Gifford, Mark Cuban, and others; CNBC also reported $1.34 billion of total capital raised and a $4.2 billion valuation at that point. After that, the evidence becomes murkier. Secondary-market and profile sites point in different directions on later valuation and financing, so they are useful only as low-confidence context rather than canonical cover metrics.


    Commercial demand is easier to evidence than the current cap table. The backlog progression is visible in public milestone steps: OneWeb lifted Terran R backlog above $1.2 billion across five customers in 2022, Intelsat lifted it above $1.8 billion across nine customers in 2023, Relativity said it exceeded $2.9 billion across more than a dozen customers in March 2025, and the current about page rounds that figure to $3 billion plus. The customer mix is anchored by telecom and government-adjacent relationships rather than consumer markets, with SES, Intelsat, OneWeb, Iridium, NASA, and the U.S. Air Force/Space Force forming the most visible external validation set in this chapter.
