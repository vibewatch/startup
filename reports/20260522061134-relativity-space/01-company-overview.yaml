- id: leadership-and-governance
  title: Founders, Leadership, and Governance
  body: >-
    The accessible source pack supports a high-level founder story but not a clean legal-history record. Official current copy says the company has existed “since 2016,” while multiple independent and private-market profiles place formation in 2015 and identify Tim Ellis and Jordan Noone as the founders. The safest publication-quality conclusion is therefore not a single date but a documented conflict: the business was formed in the 2015-2016 window, and the fetched sources do not conclusively reconcile whether 2015 marks incorporation and 2016 marks operational launch or whether one set of sources is simply imprecise.


    Leadership certainty is much stronger from March 2025 forward. TechCrunch reported that Eric Schmidt made a significant investment, took a controlling stake, and became CEO, while Tim Ellis moved off the chief executive role and remained a board director. Relativity’s about page independently confirms that the company entered a new chapter under Schmidt’s leadership in 2025. Publicly visible functional leaders in the pack include President and CFO Mo Shahzad, Chief Revenue Officer Josh Brost, and CTO Kevin Wu, but the broader board roster, exact post-transaction ownership split, and any special governance rights tied to Schmidt’s investment remain private.
