company:
  name: Relativity Space
chapter:
  number: 1
  title: Company Overview
  summary: Relativity Space is a Long Beach launch company now centered on Terran R after ending Terran 1 following its March 2023 test flight; official materials moved from $1.65 billion of backlog across seven customers in April 2023 to more than $2.9 billion across over a dozen customers by March 2025 and $3 billion-plus in pre-sold launch contracts on the current about page. The company last disclosed a fully corroborated primary financing in June 2021, when it raised $650 million at a $4.2 billion valuation, and then underwent a major control shift in March 2025 when Eric Schmidt became CEO after taking a controlling stake. The core open questions are the exact founding date, the current ownership and board structure, and whether low-confidence private-market revenue and valuation estimates reflect operating reality.
sections:
- id: company-identity
  title: Identity, Footprint, and Product
  body: >-
    Relativity Space presents itself as a launch and advanced-manufacturing company whose current commercial identity is anchored on Terran R, a reusable medium-to-heavy-lift rocket rather than the earlier Terran 1 vehicle. The company’s current about page says it has grown into a team of 2,000 experts across five U.S. locations, with Long Beach as the headquarters and additional activity in Mississippi, Florida, Washington, D.C., and Seattle. That same page says Relativity has more than $3 billion in pre-sold launch contracts and more than a dozen customers, which makes backlog the clearest public traction indicator even though those bookings should not be confused with flown-launch revenue.


    Terran R is the product the rest of this report should treat as canonical. Public technical disclosures now converge around a vehicle sized for 23,500 kilograms to a 200-kilometer LEO with first-stage reuse, 5,500 kilograms to GTO, and up to 33,500 kilograms to LEO in expendable mode, launching from LC-16 at Cape Canaveral beginning in late 2026. A separate inferred stage assessment follows from those same disclosures: Relativity should still be viewed as a late-development, pre-first-flight Terran R company rather than an operator with demonstrated recurring launch revenue.
