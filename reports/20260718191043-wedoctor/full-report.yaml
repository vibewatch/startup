      - number: '1.2'
        title: From internet hospital pioneer to AI-enabled health-service operator
        blocks:
          - type: paragraph
            body: >-
              The strongest current business framing comes from reporting on the 2024 prospectus and 2025 follow-on
              coverage. Those sources say WeDoctor’s operating model is split between AI-powered medical services and a
              digital healthcare platform. The platform side includes digital consultations, follow-up visits,
              medication dispensing, corporate health offerings, and offline medical-center or hospital services. The
              faster-growing engine is the health-service community model built around capitation and value-based
              payment, where WeDoctor works with local governments, hospitals, insurers, and primary-care institutions
              to manage chronic-disease populations and share in outcome- aligned savings. The AI overlay is no longer a
              side narrative. Public sources tied to the filing say the company had already built a WeDoctor medical
              large model, secured multiple national AI algorithm filings, and accumulated tens of millions of
              de-identified clinical records. Later 2026 reporting goes further, describing five nationally filed
              algorithms, more than 70 licensed invention patents, and a human-machine operating model in which one
              health manager can supervise thousands of residents with AI support. The practical point is that WeDoctor
              is now selling a policy-compatible operating system for regional healthcare management rather than only a
              consumer app.
