figures:
  - id: FO001
    title: WeDoctor milestone timeline
    type: timeline
    layout: wide
    summary: >-
      WeDoctor’s history shows a progression from appointment routing to internet hospitals, cloud infrastructure, AI
      health management, and a renewed IPO attempt.
    data:
      items:
        - date: 2010-03
          label: Guahao founded
          detail: Started as a hospital-appointment and patient-routing platform.
          tone: positive
        - date: 2015-09
          label: Rebrand to WeDoctor
          detail: Brand shifted from Guahao to the broader WeDoctor identity.
          tone: positive
        - date: 2015-12
          label: Wuzhen Internet Hospital
          detail: Public milestone sources describe this as China’s first internet hospital.
          tone: positive
        - date: 2017-11
          label: WeDoctor Cloud launch
          detail: Hospital and health-system infrastructure became a formal product line.
          tone: positive
        - date: 2020-01
          label: Tianjin HSC begins
          detail: Regional HMO-style chronic-disease and payment-reform cooperation starts.
          tone: positive
        - date: '2021'
          label: First HK IPO attempt
          detail: Initial public-market push later stalled amid data-regulation pressure.
          tone: warning
        - date: 2022-07
          label: 1B+ RMB financing
          detail: Profile sources describe another large private financing round.
          tone: positive
        - date: 2024-03
          label: Tencent AI/cloud partnership
          detail: Strategic cooperation agreement deepened the AI-health roadmap.
          tone: positive
        - date: 2024-08
          label: Shanghai AI Hospital
          detail: WeDoctor-linked partners announced China’s first AI hospital.
          tone: positive
        - date: 2024-12
          label: Revived HKEX filing
          detail: WeDoctor returned to Hong Kong listing plans with a second attempt.
          tone: warning
        - date: 2025-06
          label: 1H2025 revenue acceleration
          detail: Revenue rose to RMB 3.08B as HSC became the dominant engine.
          tone: positive
        - date: '2026'
          label: Multi-city HSC rollout
          detail: National replication became part of the growth story.
          tone: positive
