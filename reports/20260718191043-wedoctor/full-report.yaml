chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, founding path, and why the company matters
        blocks:
          - type: paragraph
            body: >-
              WeDoctor’s public record is unusually important because the company sits at the intersection of several
              Chinese policy arcs: online triage and appointment booking, internet hospitals, online prescription
              circulation, medical insurance settlement, and now AI-assisted health management. The business traces back
              to Guahao.com in 2010, initially focused on helping hospitals optimize registration and directing patients
              to appropriate doctors. Public milestone sources then show a sharp broadening of ambition: the 2015
              rebrand to WeDoctor, the December 2015 launch of Wuzhen Internet Hospital as China’s first internet
              hospital, and the 2017 launch of WeDoctor Cloud as digital infrastructure for hospitals and regional
              health systems. By the time of the December 2024 Hong Kong filing, the company was describing itself not
              merely as an online consultation marketplace but as a provider of AI-powered medical services plus a
              digital healthcare platform serving providers, payers, enterprises, and patients. That transition matters
              for later chapters because the underwriting question is no longer whether WeDoctor can route patients
              online, but whether it has built a durable system-level role inside China’s medical, insurance, and
              drug-delivery stack.
