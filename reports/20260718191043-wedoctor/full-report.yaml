      - number: '2.4'
        title: Policy support is strong, but trust and implementation frictions still matter
        blocks:
          - type: paragraph
            body: >-
              The market tailwinds are real. China’s central government has spent more than a decade pushing “Internet
              Plus,” Healthy China 2030, internet hospitals, AI-assisted healthcare services, family-doctor support, and
              medical- insurance digitization. The 2018 State Council internet-health opinion explicitly allowed
              internet hospitals, online follow-up visits for common and chronic diseases, online prescription pathways,
              and AI-enabled medical services. The 2020 medical-insurance guidance moved reimbursement in the same
              direction. Yet none of these policies create an unrestricted free-for-all. The same framework embeds
              constraints around medical quality, prescription review, data traceability, domestic storage of sensitive
              patient data, and localized implementation. PIPL and the Data Security Law raise the cost of scaling
              healthcare-data platforms irresponsibly, while market reports continue to flag patient trust and
              motivation as adoption brakes. For WeDoctor, this means the company benefits from a large and supported
              market, but its execution advantage must include regulatory fluency, hospital integration, and the ability
              to prove economic outcomes to payers rather than just consumer engagement.
            claimRefs:
