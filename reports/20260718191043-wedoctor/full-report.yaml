      - number: '2.3'
        title: Buyer, user, and payer roles are fragmented by design
        blocks:
          - type: paragraph
            body: >-
              WeDoctor’s market is structurally multi-sided. The end user may be a patient or chronic-disease member,
              but the buyer can be a hospital system, a primary-care network, a local health commission, a municipal or
              district medical- insurance fund, an enterprise HR department, or a consumer purchasing consultations and
              medicine directly. Peer disclosures help explain the segmentation. Ping An Health emphasizes employers and
              insurance-linked health management. JD Health’s disclosures show a massive pharmacy and consultation user
              base tied to ecommerce demand. Alibaba Health mixes platform merchants, direct online stores,
              consultations, and chronic-disease service tools. DXY’s official profile shows a physician-heavy
              professional network paired with large consumer-health content and consultation traffic. WeDoctor’s own
              positioning is closest to the intersection of payer-sponsored care management, provider digitization,
              internet hospitals, and some consumer and enterprise service layers. That means adoption is less like a
              single app funnel and more like a sequence: policy permission, hospital integration, payer alignment,
              doctor workflow adoption, and then patient engagement.
