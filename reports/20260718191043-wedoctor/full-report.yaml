      - number: '1.4'
        title: Operating scale, policy alignment, and what remains undisclosed
        blocks:
          - type: paragraph
            body: >-
              The operating-scale evidence is strong enough to justify serious diligence. Reporting based on the 2024
              filing says WeDoctor connected roughly 11,500 medical institutions and 318,000 physicians, operated six
              physical hospitals, and had already pushed its Tianjin health-service community to about 900,000 members
              by June 2024. Follow-on 2025 and 2026 reporting shows the same model scaling further: first-half 2025
              revenue reached RMB 3.08 billion, health-management membership revenue reached RMB 2.389 billion, Tianjin
              members surpassed 1.666 million, and the network inside four managed Tianjin regions had expanded to 44
              primary institutions plus 11 secondary or higher hospitals. Those figures matter because they show
              WeDoctor is not just narrating policy alignment; it is monetizing a healthcare-delivery model built to fit
              the state’s internet-health, chronic-disease, and payment- reform agenda. The unresolved issue is
              disclosure quality. Public sources retrieved for this run do not give a clean board roster, ownership
              percentages, preference stack, cash position, or audited user-account denominator comparable to listed
              peers. The company therefore looks real and scaled, but still not fully transparent.
            claimRefs:
