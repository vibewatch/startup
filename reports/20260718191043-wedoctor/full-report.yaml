      - number: '3.3'
        title: DXY and Chunyu show two different substitute pathways
        blocks:
          - type: paragraph
            body: >-
              DXY and Chunyu matter because they reveal two different displacement risks. DXY is a professional-network
              and medical-data competitor with unusually deep doctor reach. Its official about page says it serves 9
              million registered healthcare professionals, representing around 80% of China’s medical workforce, and the
              product surface stretches from medication data and open APIs to professional education, recruiting, and
              patient-facing content and consultation products. That gives DXY strong influence over physician workflow
              and medical knowledge distribution even if it is not the closest payer-integrated peer to WeDoctor. Chunyu
              Doctor represents the other substitute path: lower-complexity online consultation at broad consumer scale.
              Its legal-acquisition coverage says it has over 180 million registered users and 690,000 licensed
              physicians, while its live consumer pages still show fast-question and specialist-consultation flows as
              the product entry point. These two substitutes matter because they show that portions of the
              digital-health job can be won through professional community control or through lighter doctor-marketplace
              aggregation, not only through WeDoctor’s heavier regional-operating model.
            claimRefs:
