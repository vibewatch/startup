      - number: '3.4'
        title: WeDoctor’s moat is institutional depth, but that moat is expensive to prove
        blocks:
          - type: paragraph
            body: >-
              The retained evidence suggests WeDoctor’s most durable advantage is not simple app traffic. It is the
              combination of provider integration, AI-assisted care management, cloud pharmacy orchestration, and
              local-government or payer alignment that shows up in Tianjin and in newer HSC expansion efforts. WHO and
              deployment reporting make the point concrete: WeDoctor has operated community-health-centre capitation
              pilots, AI-assisted prescription review, risk- stratified follow-up, and health-manager workflows inside a
              city-scale public-private operating model. That is a harder capability set than selling online
              consultations or running a large pharmacy storefront. But the same moat is also vulnerable in specific
              ways. Listed peers have more capital, clearer public metrics, and wider consumer or insurer distribution.
              DXY has broader doctor mindshare and data tools. Chunyu shows that a simpler consumer funnel can still
              attract large doctor and user supply without bearing as much implementation complexity. If WeDoctor’s HSC
              and AI-hospital model scales cleanly across cities, it can look structurally differentiated; if scaling
              stalls, investors may instead view it as a less transparent competitor facing stronger capitalized
              incumbents.
            claimRefs:
