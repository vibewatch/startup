  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: What market WeDoctor is actually in
        blocks:
          - type: paragraph
            body: >-
              A useful market definition for WeDoctor has to be narrower than the entire digital-health universe but
              broader than a simple telemedicine app. Public market reports and listed-peer disclosures show at least
              five relevant categories: online consultation, online pharmacy, digital healthcare infrastructure, online
              enterprise services, and consumer-health products. WeDoctor participates in all of them to some degree,
              but its strategic center of gravity is not online drug retail or pure direct-to-consumer wellness.
              Instead, the company sits closest to the overlap of digital healthcare infrastructure, enterprise or
              payer-facing health-management services, and policy- aligned chronic-disease management delivered through
              internet hospitals and regional healthcare networks. That is why the market cannot be understood only
              through user-app downloads or e-commerce GMV. The business is tied to how Chinese governments, hospitals,
              insurers, and large employers adopt digital tools to shift care online, manage chronic disease
              populations, and control reimbursement growth while expanding access.
            claimRefs:
