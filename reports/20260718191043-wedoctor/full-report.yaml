      - number: '1.3'
        title: Capital formation, investors, and the revived Hong Kong IPO path
        blocks:
          - type: paragraph
            body: >-
              The public funding story is directionally clear but numerically messy. Reuters-syndicated coverage
              confirms that WeDoctor submitted a new Hong Kong IPO application on December 31, 2024 after an earlier
              2021 attempt had been derailed during Beijing’s crackdown on private-sector data handling, especially for
              businesses dealing with sensitive medical information. Those same reports say the new flotation was
              expected to target roughly $400 million to $500 million and that China Merchants Bank was the sole
              sponsor. The pre-IPO investor roster named in public reporting includes Tencent, Hillhouse, HongShan, AIA,
              Hermitage, CICCFH, and Qiming. Valuation references cluster around the same level: Premier Alternatives
              puts WeDoctor at $7.0 billion as of December 31, 2024, GetLatka says a 2022 financing valued the company
              at $7 billion, and Hurun’s 2025 China 500 ranking translated into roughly RMB 51 billion. Total funding is
              less clean. Premier Alternatives says $1.6 billion raised, GetLatka says $1.5 billion, while Tracxn’s
              visible record shows only $894 million because it appears to stop at older disclosed rounds. That
              discrepancy does not invalidate unicorn status, but it does mean later valuation work should treat the
              exact historical capital stack as partially unresolved rather than fully settled.
            claimRefs:
