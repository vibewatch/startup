      - number: '8.3'
        title: >-
          The right recommendation is track or research-more at the last mark, with clear entry discipline and downside
          triggers
        blocks:
          - type: paragraph
            body: >-
              The evidence-supported recommendation is not “buy” at the last private mark. It is track or research-more.
              If an investor were offered entry at a valuation that assumes WeDoctor deserves a several-turn premium to
              listed peers, the burden of proof should be extremely high. That proof would need to show not merely
              faster growth, but also superior margins, lower churn, multi-city replication, and manageable policy risk.
              Without that, the better stance is to wait for either improved disclosure or a more attractive price. A
              practical entry framework would require a very large discount to the last known private mark or,
              alternatively, hard evidence that HSC economics and cash conversion are so superior that listed-peer
              multiples are the wrong anchor. Today the second proposition is plausible, but not yet publicly
              demonstrated. That is why entry discipline has to be framed as a range and a diligence condition, not a
              confident fair-value claim.
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
