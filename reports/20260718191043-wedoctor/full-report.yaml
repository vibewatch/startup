      - number: '8.2'
        title: >-
          Public comparable math points to a large discount versus the last private mark unless WeDoctor proves much
          better growth and margins than listed peers
        blocks:
          - type: paragraph
            body: >-
              Retained sources place WeDoctor’s latest widely cited valuation near US$6.7 billion and recent revenue
              around RMB 5–6 billion historically, with H1 2025 revenue of RMB 3.08 billion. Even allowing for rapid
              growth, that implies a revenue multiple well above the roughly 1.4x sales range cited for JD Health and
              Ping An Health and the roughly 2.5x range cited for Alibaba Health. That premium is hard to justify from
              public evidence alone because WeDoctor is still private, more opaque, and more concentrated in flagship
              public-sector deployments. A bull case exists if HSC becomes a nationally replicable, high-margin
              managed-care platform and if public-market conditions reward that uniqueness. But a base case should still
              anchor to public comp compression, governance opacity, and execution risk. The valuation framework
              therefore needs scenarios, not a single point estimate. Public evidence is useful enough for direction,
              but not precise enough for a tight target price.
            claimRefs:
              - CV011
              - CV012
              - CV013
