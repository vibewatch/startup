  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: WeDoctor sells into a multi-sided buyer / user / payer structure led by public-sector demand
        blocks:
          - type: paragraph
            body: >-
              WeDoctor’s customer base is better segmented by buyer, user, and payer than by “consumer versus
              enterprise.” The most economically important buyer in the retained evidence is the city- or region-level
              public system: municipal governments, health commissions, healthcare-security bureaus, and
              community-health networks that adopt the company’s digital-health-community or HSC model. In these
              deployments, the user is a mix of community health centres, hospitals, physicians, health managers, and
              residents, while the payer is often public insurance, local fiscal budgets, or a capitation/shared-savings
              arrangement. A second segment is provider infrastructure customers, such as county hospitals connected
              through Wuzhen Internet Hospital and hospitals using internet-hospital, cloud pharmacy, cloud examination,
              or referral workflows. A third segment is the member or resident base enrolled into chronic-care and
              health-management services. A fourth is the legacy consumer-app and internet-hospital traffic surface,
              which contributes reach but is less richly documented on revenue durability than the HSC model. Taken
              together, the public evidence suggests WeDoctor’s strongest commercial motion is B2G2C and B2B2C rather
              than pure D2C telehealth. That means customer diligence should focus less on raw app reach and more on who
              controls budgets, reimbursement flows, care-pathway permissions, long-term contract renewals, and local
              procurement decisions. It also means different customer metrics matter at each layer: hospital connections
              matter for provider infrastructure, member counts matter for managed-care scale, and renewal rates matter
              most for proving account durability.
            claimRefs:
