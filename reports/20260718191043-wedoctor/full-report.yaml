  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: >-
          WeDoctor has real scale and strategic assets, but the anti-thesis is that public evidence does not justify a
          premium multiple this large
        blocks:
          - type: paragraph
            body: >-
              The pro-thesis is straightforward. WeDoctor appears to have built one of China’s deepest digital-health
              operating systems, with real infrastructure in Tianjin, broad provider connectivity, a growing HSC revenue
              engine, and institutional data and workflow assets that are difficult to reproduce. The 2025 growth
              narrative is strong, and the company arguably deserves to trade above the weakest public peers if the HSC
              model truly compounds across cities. The anti-thesis is more important for valuation. Public comps already
              exist for adjacent internet-health leaders, and those peers trade at far lower revenue multiples despite
              stronger disclosure, listed-company discipline, and broader investor familiarity. At the retained private
              mark, WeDoctor looks priced as if Tianjin-style economics will scale nationally and margins will expand
              materially, yet the public evidence still leaves major gaps on concentration, renewal, cash generation,
              and city-by-city unit economics. That combination supports respect for company quality but skepticism
              about current price. Investors should treat valuation upside as earned, not assumed.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
