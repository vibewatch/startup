      - number: '7.2'
        title: >-
          Operational execution depends on health-manager labor, provider integration, and safety controls that are only
          partially observable
        blocks:
          - type: paragraph
            body: >-
              The second risk cluster is operational. WHO and deployment evidence make clear that WeDoctor’s system is
              not purely software-led; it depends on health managers, provider workflow redesign, prescription review,
              referral logic, population-health data pipelines, and continuous integration with community health centres
              and hospitals. That creates multiple failure modes: slow site activation, uneven provider adoption, weak
              exception handling in AI-supported decisions, privacy or security incidents, and labor-management issues
              in health-manager operations. Public sources do show mitigants. WHO describes structured risk
              stratification and prescription-review controls, while Tianjin and city deployments indicate real-world
              operating discipline. Still, external auditability remains limited. There is no rich public trust center,
              MLPS pack, security-audit summary, or disclosed incident log in the retained source set. Investors
              therefore have to assume meaningful operational sophistication while also accepting that critical control
              evidence remains largely private. That is manageable in private diligence, but it should still raise the
              bar for any public-market style underwriting.
