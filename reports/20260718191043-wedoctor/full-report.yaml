      - number: '7.4'
        title: The central diligence task is to turn narrative strength into monitorable controls and thesis-break criteria
        blocks:
          - type: paragraph
            body: >-
              The good news is that WeDoctor has visible mitigants: scaled Tianjin proof, algorithm filings, benchmark
              wins, city-level expansion demand, and embedding inside public-health systems. The bad news is that those
              mitigants do not eliminate the need for deeper verification. The right investment stance is therefore
              conditional. Investors should ask for city-by-city economics, security and privacy documentation, renewal
              data, license inventory, claim-interception governance, and evidence that newer regions can reach
              Tianjin-like operating quality without excessive subsidy or founder-level intervention. Thesis-break
              triggers are clear: regulatory setbacks, slower expansion conversion, deteriorating payer relationships,
              security incidents, or proof that Tianjin is economically exceptional rather than replicable. Until those
              questions are answered, WeDoctor looks investable only with unusually strong diligence on the operating
              and policy substrate beneath the product narrative, especially outside Tianjin today.
