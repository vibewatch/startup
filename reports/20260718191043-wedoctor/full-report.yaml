  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: >-
          Regulatory and legal exposure is structurally high because WeDoctor sits inside healthcare, insurance, and
          sensitive data flows
        blocks:
          - type: paragraph
            body: >-
              WeDoctor’s most fundamental risk is regulatory complexity. The company does not merely provide software
              for benign back-office use; it intermediates internet-hospital workflows, prescription review,
              health-management programs, medical-insurance interactions, and AI-supported clinical processes. That
              means its operating model is sensitive to internet-hospital licensing rules, online diagnosis and
              treatment supervision, medical-insurance payment policy, algorithm-governance expectations, and China’s
              privacy and data-security laws. Public sources show the company has taken some steps to align with this
              environment, including algorithm filings and licensed deployment structures. But those same sources show
              how much ongoing regulatory cooperation is required for the model to work. If authorities tighten
              supervision on online diagnosis, algorithm use, cross-institution data flows, or insurer-linked
              chronic-care programs, WeDoctor’s customer economics could change quickly. The risk is magnified because
              public diligence cannot yet inspect a full compliance pack covering every city, license, data-governance
              procedure, or audit outcome. In other words, compliance appears directionally credible, but still not
              fully audit-ready from public evidence alone.
            claimRefs:
