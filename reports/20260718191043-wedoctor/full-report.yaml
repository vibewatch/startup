    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation follows a logic chain from real scale and growth into concentration, opacity, and entry price
      discipline.
    data:
      nodes:
        - id: proof
          label: Real platform proof
          detail: Tianjin, HSC, provider connectivity, and 2025 growth improve credibility.
        - id: comps
