            body: >-
              The deepest architecture description comes from WHO and VCBeat. In Tianjin, WeDoctor built a
              health-management platform integrated with health-centre infrastructure and powered by a general-purpose
              large language model refined for medical tasks. WHO describes how the platform ingests structured clinical
              data, generates diagnostic hypotheses, prioritizes examinations, triggers referrals, reviews
              prescriptions, classifies patients into risk tiers, and assigns follow-up cadence. VCBeat adds the broader
              architectural vocabulary: Four Clouds—cloud management, cloud services, cloud pharmacy, and cloud
              examination—plus AI Physician, AI Pharmacist, AI Health Manager, and AI Intelligent Control. The Shanghai
              AI Hospital extends that logic into a licensed physical institution with pre-consultation AI screening, AI
              physician and pharmacist workflows, post-consultation health management, and medical-insurance smart
              control. The architecture is not generic enterprise software. It is a vertically integrated clinical
              workflow that depends on real-world care settings, health-manager labor, insurer rules, prescription
              logic, and direct links to hospitals and primary care institutions.
