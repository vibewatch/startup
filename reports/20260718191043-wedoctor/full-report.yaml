      - number: '3.2'
        title: Listed peers dominate public disclosure and consumer or insurer distribution
        blocks:
          - type: paragraph
            body: >-
              The listed-peer evidence shows why WeDoctor cannot be underwritten as a simple category leader without
              context. Ping An Health reported 2025 revenue of RMB 5.468 billion and explicitly split that base between
              commercial- insurance enablement and corporate health management. JD Health reported 2024 revenue of RMB
              58.16 billion, reflecting overwhelming scale in online pharmacy and healthcare-product distribution plus
              an increasingly broad service loop around consultations, testing, and offline nodes. Alibaba Health
              reported FY2024 revenue of RMB 27.03 billion, 300 million annual active users, more than 35,000 merchants,
              and over 220,000 contracted medical professionals. Those companies are not clean substitutes for
              WeDoctor’s municipal health-service-community model, but they set the standard for customer reach, audited
              disclosure, and investor comparability. Against them, WeDoctor’s strongest differentiator is that it
              appears to monetize integrated chronic-disease management and local reform execution rather than primarily
              retail health consumption. Its weakest point is that public data on pricing, retention, active-user
              denominators, and capital structure remains much thinner than for listed peers.
