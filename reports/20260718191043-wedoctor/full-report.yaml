      - number: '2.2'
        title: Sizing lenses are directionally aligned but numerically wide
        blocks:
          - type: paragraph
            body: >-
              The strongest market signal is consistency of direction rather than agreement on one number. Research and
              Markets distribution coverage pegs China’s online healthcare market at $583.68 billion by 2028 with 36.89%
              CAGR from 2024, while Market Research Future estimates a narrower digital-healthcare market at $16.5
              billion in 2024, rising to $120.67 billion by 2035. IMARC places the broader China digital-health market
              at $94.9 billion in 2025, reaching $359.9 billion by 2034, and GlobalData says China should account for
              roughly one-fifth of the APAC digital- health market with about 30% CAGR through 2033. Statista adds an
              adoption denominator that matters more for WeDoctor’s business than any single revenue estimate: by
              mid-2025 more than 390 million people in China had used online medical services, equal to roughly 35% of
              internet users. The lesson is that China’s digital-health market is already mainstream at the user level,
              but reported TAM depends heavily on whether the analyst includes pharmacy, wearables, SaaS, enterprise
              service, and broader data infrastructure.
