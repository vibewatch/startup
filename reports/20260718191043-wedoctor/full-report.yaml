  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: WeDoctor delivers a multi-layer healthcare operating system, not one SKU
        blocks:
          - type: paragraph
            body: >-
              The product surface breaks into several layers that map to different buyers and workflows. At the top
              level, prospectus-derived reporting says WeDoctor’s business spans AI-powered healthcare services and a
              digital healthcare platform. Under that umbrella, the practical product modules are clearer:
              internet-hospital services, the Health Service Community model, cloud pharmacy, cloud examination, digital
              management tools for hospitals and regions, AI-assisted clinical and administrative agents, and physical
              or AI-enabled hospitals that anchor the online layer in licensed medical institutions. The product is
              therefore best understood as an operating system for “medical care + insurance + pharmaceuticals” linkage
              rather than as a single consumer application. This matters because each module reinforces the others.
              Internet-hospital access creates a patient and doctor workflow. The Four Clouds platform ties data,
              pharmacy, examinations, and coordination together. AI agents automate diagnosis support, medication
              review, follow-up, and cost-control functions. The HSC layer provides the contractual and payment
              mechanism that turns the technology stack into recurring revenue and city-level operating leverage.
