  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The real competition is for control of the care-and-payment workflow
        blocks:
          - type: paragraph
            body: >-
              A superficial competitor list would group WeDoctor with any Chinese telemedicine or online-pharmacy brand.
              That is too narrow. The stronger reading from filings, official product pages, and deployment evidence is
              that Chinese digital-health competition clusters around several different control points. Ping An Health
              controls an insurance- linked service loop built around family doctors, senior care, and employer
              programs. JD Health controls consumer traffic and pharmacy fulfillment at massive scale, then pushes
              outward into online hospital, diagnostics, and AI- enabled medical workflows. Alibaba Health controls a
              similarly large commerce and consultation surface anchored by Tmall traffic, direct pharmacy, and a
              three-cloud strategy spanning cloud pharmacy, cloud hospital, and cloud infrastructure. DXY is different
              again: it owns a deep doctor community, drug-data assets, open-platform tools, and professional education
              distribution that can influence prescribing behavior and hospital workflows. Chunyu Doctor remains the
              classic light-consultation substitute, proving that a lower-complexity, doctor-marketplace model still
              exists. WeDoctor’s position is therefore closest to the subset of competitors trying to intermediate not
              just consumer demand but provider workflow, regional integration, and payer economics. That is
              strategically attractive because it is harder to replicate, but it also means WeDoctor competes in the
              most regulation-heavy and implementation-heavy corner of the landscape.
            claimRefs:
              - CP001
              - CP002
              - CP003
