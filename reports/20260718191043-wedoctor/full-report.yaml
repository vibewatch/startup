  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue now follows managed-care logic more than marketplace logic
        blocks:
          - type: paragraph
            body: >-
              The best current description of WeDoctor’s revenue model comes from prospectus-derived reporting and the
              2026 HSC follow-up coverage. Those sources describe two top-level businesses: AI-powered healthcare
              services and a digital healthcare platform. The AI-powered side includes health-management membership
              services, cloud pharmacy, and value-added services delivered through the Health Service Community model.
              The platform side includes digital medical services, offline medical-center services, and corporate
              membership services. That distinction matters because the economic center of gravity has moved. Earlier
              digital-health models in China often relied on traffic, consultation conversion, or pharmacy distribution.
              WeDoctor’s faster-growing engine instead appears to be capitation-linked membership revenue that pays the
              company for managing population health and improving medical- insurance efficiency. WHO’s Tianjin case
              study reinforces the point: revenue inside the pilot came from shared savings under capitation plus
              value-added preventive services, not just from one-off app transactions. Financially, that means WeDoctor
              should be treated less like a pure consumer marketplace and more like an operating platform that earns
              recurring revenue when contracted populations and provider workflows stay inside its system.
