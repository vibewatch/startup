        title: Trust controls are visible in algorithm filings and workflow guardrails, but not yet fully auditable
        blocks:
          - type: paragraph
            body: >-
              In a healthcare setting, technical capability matters less without compliance and workflow trust. The
              strongest visible control signals are official algorithm filings and real-world safety workflows. VCBeat’s
              CAC-filing coverage says WeDoctor secured national algorithm registration for multiple medical models,
              while WHO describes AI prescription review that checks guidelines, adverse reactions, inventory, formulary
              availability, price, and insurer rules before approving, flagging, or escalating a prescription. Public
              reporting also says Shanghai AI Hospital holds an internet-hospital license and medical-insurance
              designation, and the company’s HSC deployments are built under formal local-government arrangements.
              China’s PIPL, Data Security Law, and 2018 Internet Plus Healthcare rules create the legal envelope for
              sensitive-data handling, internet-hospital operation, and AI service use. The open question is
              auditability. Public sources are strong on control design and regulatory direction, but thin on MLPS
              certification level, breach history, model governance artifacts, and independent security assessment. For
              an investor, the implication is that trust architecture looks serious, but not yet fully inspectable.
