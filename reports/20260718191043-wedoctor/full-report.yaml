      - number: '7.3'
        title: >-
          WeDoctor’s growth model is exposed to flagship-city concentration, partner dependence, and public-market
          timing risk
        blocks:
          - type: paragraph
            body: >-
              WeDoctor’s third risk cluster is dependency concentration. The strongest public evidence points to Tianjin
              as the most mature flagship deployment and, by 2025 reporting, a major performance anchor. That is
              positive because it proves the model can work; it is risky because it implies outsized dependence on one
              region, one sponsor archetype, and one set of reimbursement conditions. The expansion logic also depends
              on local governments, hospitals, and operators being willing to replicate the model. The Partner Program
              shows WeDoctor itself recognized the need for regional operators and standardized rollout capabilities.
              Meanwhile, the company remains exposed to IPO timing and disclosure risk. Reuters reported a revived Hong
              Kong IPO effort after prior delays, and public visibility into capital structure, liquidity buffers, and
              city-level profitability remains incomplete. In short, WeDoctor is not just selling software; it is
              selling a locally embedded reform model, which makes dependency risk more acute. The more embedded the
              model, the more important local sponsor continuity becomes.
