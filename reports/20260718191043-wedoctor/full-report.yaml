companyProfile:
  summary: >-
    WeDoctor is a Hangzhou-based digital-health company founded by Jerry Liao that evolved from the Guahao appointment
    platform into a broader internet-hospital, AI-health-management, and public- sector healthcare-operating platform.
    The strongest public proof sits in Tianjin, where WHO and later reporting describe a live chronic-disease management
    system integrated with community health centres, health managers, and payer-aligned workflows. By 2025 public
    reporting, WeDoctor was also positioning HSC as its core growth engine and carrying a widely cited private valuation
    around US$6.7 billion. The company looks strategically meaningful, but it remains a private, partially disclosed
    business whose public evidence still leaves concentration, valuation support, and control quality incompletely
    resolved.
