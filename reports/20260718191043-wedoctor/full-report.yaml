  - id: FO002
    title: WeDoctor company snapshot logic
    type: flow
    layout: standard
    summary: The core logic connects policy-aligned population health contracts, AI tooling, and hospital network depth.
    data:
      nodes:
        - id: origin
          label: Appointment-routing origin
          detail: Guahao began by matching patients to hospitals and doctors more efficiently.
          tone: positive
        - id: internet-hospital
          label: Internet hospital model
          detail: Wuzhen Internet Hospital expanded the model into follow-up care, e-prescriptions, and online consultations.
          tone: positive
        - id: cloud
          label: Provider infrastructure
          detail: WeDoctor Cloud and regional platforms positioned the company inside hospitals and local health systems.
          tone: positive
        - id: hsc
          label: Health Service Community
          detail: Capitation and value-based payment tied revenue to managed outcomes rather than only transactions.
          tone: positive
        - id: ai
          label: AI medical services
          detail: Algorithms, clinical data, AI physicians, pharmacists, and health managers support the model.
          tone: positive
        - id: risk
          label: Disclosure and regulatory sensitivity
          detail: IPO history, medical-data sensitivity, and incomplete funding decomposition remain live diligence issues.
          tone: warning
      edges:
        - from: origin
          to: internet-hospital
        - from: internet-hospital
