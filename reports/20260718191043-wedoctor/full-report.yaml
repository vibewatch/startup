              - CV007
              - CV023
              - CV024
              - CV032
      - number: '8.4'
        title: The remaining work is to prove whether WeDoctor deserves a strategic premium or a private-company discount
        blocks:
          - type: paragraph
            body: >-
              Final diligence should focus on the handful of variables that would actually move the call. First is
              geography-level concentration: how much of revenue, margin, and member growth comes from Tianjin versus
              newer cities? Second is cash and cap-table reality: what preference overhang, liquidity needs, and
              listing-timeline pressure sit behind the mark? Third is renewal quality: do hospitals, governments, and
              members stay and expand, or is growth still mostly new-city rollout? Fourth is control quality: are
              privacy, security, and clinical-governance systems strong enough for public markets? If answers on those
              points are good, WeDoctor could deserve a higher-than-peer multiple. If not, the right action is to demand
              a much lower price or stay out. The thesis breaks if concentration, policy dependence, or control weakness
              turn out to be materially worse than the growth narrative implies. In valuation terms, uncertainty still
              deserves a discount rate and a multiple discount.
            claimRefs:
