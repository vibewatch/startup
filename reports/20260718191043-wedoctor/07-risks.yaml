      - [Capital-markets / disclosure team, 'IPO readiness and public-market scrutiny require higher disclosure discipline', medium, medium-high, 'IPO process may impose structure', 'Request reporting calendar, disclosure controls, and audit-readiness plan']
    notes: People risk is amplified because WeDoctor’s model is locally operational, not merely software shipped from a central product team.
    claimRefs: [CR014, CR015, CR018, CR026, CR027, CR028, CR029]
  - id: TR005
    title: Mitigation and thesis-break criteria table
    columns: [Risk, Monitorable trigger, Threshold or event, Action implication]
    rows:
      - ['Regulatory setback', 'Internet-hospital, insurer, or AI rules tighten', 'Any rule change that materially limits online care scope, data use, or insurer-linked operations in flagship regions', 'Pause valuation upside and re-underwrite city economics']
      - ['Tianjin concentration', 'Flagship city remains dominant in revenue or members', 'Top city still contributes an outsized share after expansion period', 'Apply heavier concentration discount or require evidence of second flagship']
      - ['Expansion under-conversion', 'Signed cities fail to reach live operational scale', 'Low activation or low member adoption in new regions', 'Downgrade scalability assumptions']
      - ['Security or privacy incident', 'Major breach, enforcement action, or serious control failure', 'Confirmed incident affecting sensitive health data or clinical workflow trust', 'Treat as thesis-breaker until remediated']
      - ['IPO or capital constraint', 'Repeated listing delays or weak disclosure quality', 'Material financing need without better transparency', 'Demand financing downside protection or defer']
      - ['Operational exception risk', 'High override or escalation rates in AI-supported care workflows', 'Evidence that automation quality does not generalize outside flagship zones', 'Reduce confidence in operating leverage thesis']
    notes: These triggers convert the current narrative-heavy diligence picture into an actionable monitoring framework.
    claimRefs: [CR031, CR032, CR033, CR034, CR035, CR036, CR037, CR038, CR039, CR040]
