  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or node, Role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Tianjin flagship region, Tianjin public-health and insurance system, 'Flagship proof, member base, and operating template', high, 'Economics prove non-replicable outside Tianjin', high, 'Use Tianjin as benchmark while building new regions', medium-high]
      - [Local governments and health commissions, Multiple municipalities, 'Authorize and co-build HSC or digital-health-community projects', high, 'Expansion pipeline slows or local support weakens', high, 'Partner program and standardized playbooks', medium-high]
      - [Hospitals and community health centres, Provider nodes, 'Daily workflow adoption and data capture', medium-high, 'Sites sign but do not operationalize deeply', high, 'Onsite operating model and health-manager layer', medium]
      - [Public-insurance logic and claims-control workflows, City payer systems, 'Monetization and savings thesis', high, 'Savings logic changes or incentives weaken', high, 'Documented payer-aligned outcomes in flagship zones', medium-high]
      - [Tencent / university / research ecosystem, Technical partners, 'Model development and ecosystem leverage', medium, 'Technology progress slows or loses strategic support', medium, 'In-house data and deployed workflow feedback loops', medium]
    notes: Dependency risk comes from embeddedness; the model becomes stronger and harder to dislodge, but also less self-contained.
    claimRefs: [CR021, CR022, CR023, CR024, CR025, CR026, CR027]
  - id: TR004
    title: People / execution risk register
    columns: [Role or function, Dependency or gap, Likelihood, Severity, Mitigation, Diligence path]
    rows:
      - [Regional operators, 'Need local public-service execution and sponsor management', medium-high, high, 'Partner program and standardized rollout', 'Request org chart and regional leader productivity by city']
      - [Health-manager workforce, 'Critical human layer in chronic-care operations', medium, high, 'Training and standardized workflow', 'Request hiring, retention, and compensation by city']
      - [Clinical governance leaders, 'Need safe oversight of AI-assisted workflows', medium, high, 'Primary-care and hospital embedding', 'Request clinical governance committee materials and escalation rules']
