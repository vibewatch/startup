  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: Policy, data, and operating risks can flow directly into revenue, retention, and valuation.
    data:
      nodes:
        - id: policy
          label: Policy or rule change
        - id: data
          label: Privacy or data-governance failure
        - id: ops
          label: Operational underperformance
        - id: payer
          label: Payer and public-sector trust
        - id: adoption
          label: Customer activation and renewal
        - id: revenue
          label: Revenue and margin
        - id: valuation
          label: Valuation and IPO outcomes
      edges:
        - {from: policy, to: payer, label: weakens sponsor confidence}
        - {from: data, to: payer, label: creates enforcement or trust shock}
        - {from: ops, to: adoption, label: hurts outcomes and renewals}
        - {from: payer, to: adoption, label: shapes contract continuity}
        - {from: adoption, to: revenue, label: changes member and contract economics}
        - {from: revenue, to: valuation, label: affects IPO narrative and comp support}
    approximationNotes: The map shows how localized operating or compliance failures can propagate beyond one module.
    claimRefs: [CR002, CR012, CR016, CR018, CR023, CR030, CR037]
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: The model depends on regulators, local sponsors, providers, payer logic, and technical partners simultaneously.
    data:
      nodes:
        - {id: regulator, label: Regulators and legal framework}
        - {id: sponsor, label: Local governments and health commissions}
        - {id: payer, label: Insurance and payment systems}
        - {id: provider, label: Hospitals and community health centres}
        - {id: labor, label: Health-manager operations}
        - {id: tech, label: AI stack and technical partners}
        - {id: wedoctor, label: WeDoctor operating platform}
      edges:
        - {from: regulator, to: wedoctor, label: defines legal envelope}
        - {from: sponsor, to: wedoctor, label: authorizes and co-builds}
        - {from: payer, to: wedoctor, label: sets savings and reimbursement incentives}
        - {from: provider, to: wedoctor, label: supplies workflow and adoption}
        - {from: labor, to: wedoctor, label: executes chronic-care operations}
        - {from: tech, to: wedoctor, label: powers AI and tooling}
    approximationNotes: Embeddedness drives both moat and dependency risk.
    claimRefs: [CR003, CR014, CR021, CR024, CR026, CR027, CR038]
