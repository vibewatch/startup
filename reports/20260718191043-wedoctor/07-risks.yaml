    title: Regulatory / legal risk register
    columns: [Rule or legal stack, Jurisdiction, Status, Likelihood, Severity, Mitigation, Residual exposure, Diligence path]
    rows:
      - [PIPL and sensitive health-data processing, China, live, high, high, 'Policy awareness and formal legal baseline are clear', 'Need city-level data-governance proof and incident history', 'Request privacy architecture, consent flows, data minimization, and third-party audits']
      - [Data Security Law and cross-institution data use, China, live, medium-high, high, 'Government-linked deployments may create compliance discipline', 'Model training and inter-institution data sharing remain hard to inspect', 'Request data classification, localization, and model-training governance']
      - [Internet diagnosis and treatment / internet hospital supervision, China, live, medium-high, high, 'Licensed and policy-enabled structures exist in flagship deployments', 'Rule changes could alter scope of online care and e-prescription economics', 'Request full license inventory and compliance owners by site']
      - [Medical-insurance and payment-policy exposure, China, live, medium-high, high, 'HSC aligns with payer cost-control goals where successful', 'Economics may change with reimbursement or capitation rule shifts', 'Request sensitivity analysis by city and policy scenario']
      - [Algorithm governance and AI medical compliance, China, live, medium, medium-high, 'CAC filing narrative and benchmark evidence help', 'Need model-governance, exception-handling, and post-deployment monitoring proof', 'Request model-risk governance pack and regulator correspondence']
      - [Public claims and disclosure risk ahead of IPO, Hong Kong / China, live, medium, medium-high, 'Revived IPO process may impose discipline', 'Public narrative may still outrun inspectable evidence in some areas', 'Request board materials and disclosure committee procedures']
    notes: Rows are ordered by expected residual severity after visible mitigants, not by chronology.
    enumerationScope:
      coverage: partial
      basis: This register captures the most material public legal and regulatory stacks affecting WeDoctor’s current model, not every municipal rule or internal remediation item.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR007, CR008, CR009, CR010]
