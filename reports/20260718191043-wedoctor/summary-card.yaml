  topStrengths:
    - Tianjin and WHO provide unusually strong flagship proof for a private China digital-health company.
    - The HSC model and AI-enabled care workflow look strategically differentiated versus simpler telehealth surfaces.
    - Public evidence shows meaningful provider, hospital, and member scale rather than a purely conceptual platform.
  topRisks:
    - The last known private valuation implies a multiple far above listed China digital-health peers.
    - Tianjin concentration, policy dependence, and reimbursement-linked economics remain major underwriting risks.
    - Public disclosure on cap table, cash generation, retention, and security controls is still incomplete.
  unresolvedGaps:
    - City-level revenue, margin, and member concentration outside Tianjin.
    - Cap-table preference overhang, liquidity needs, and true entry economics at the private mark.
    - Government, hospital, and member renewal quality across newer city deployments.
    - Security, privacy, and model-governance documentation suitable for public-market diligence.
