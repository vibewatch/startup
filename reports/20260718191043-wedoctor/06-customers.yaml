figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: WeDoctor usually lands through public-sector or provider sponsorship, then expands through member enrolment and broader service loops.
    data:
      items:
        - label: 'Sponsor formation: local governments, health commissions, or hospital leaders define a reform or digital-health objective'
        - label: 'Infrastructure deployment: population-health, internet-hospital, pharmacy, and care-coordination systems are installed across provider nodes'
        - label: 'Provider onboarding: community health centres, hospitals, physicians, and health managers begin using the workflow'
        - label: 'Resident or member enrolment: residents are enrolled into chronic-care, family-doctor, or health-management services'
        - label: 'Expansion: disease coverage, districts, hospitals, and payment-linked services expand after the first proof point'
    approximationNotes: Journey reflects common patterns across Tianjin, Wenzhou, Yinchuan, and Tai'an.
    claimRefs: [CU001, CU002, CU010, CU017, CU024, CU025]
  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: wide
    summary: Customer adoption is a staged deployment funnel rather than an instant self-serve conversion path.
    data:
      nodes:
        - id: city
          label: City or health system agreement
          detail: A municipal or institutional sponsor signs a framework or strategic agreement.
        - id: sites
          label: Sites and hospitals connected
          detail: Community health centres, hospitals, pharmacies, and service points are integrated.
        - id: staff
          label: Staff and workflows activated
          detail: Doctors, pharmacists, and health managers adopt the operational process.
        - id: members
          label: Residents and members enrolled
          detail: Chronic disease and health management services move from launch to recurring use.
        - id: expand
          label: Region or disease expansion
          detail: The model expands into new districts, diseases, or adjacent cities.
    approximationNotes: The funnel explains why deployment counts and member counts must be analyzed separately.
    claimRefs: [CU003, CU010, CU013, CU018, CU024, CU032]
