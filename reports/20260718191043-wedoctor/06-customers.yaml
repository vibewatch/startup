  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-metrics
      missingEvidence: City-level renewal rates, NRR/GRR, churn, contract length, and active-member retention by cohort.
      whyItMatters: Deployment proof is strong, but investors need to know whether accounts and members stay and expand economically over time.
      diligencePath: Request cohort tables for Tianjin and the next five largest city deployments, plus renewal schedules for all public-sector contracts.
      relatedQuestionRefs: [QU015, QU016, QU017, QU025]
      relatedTableRefs: [TU004]
    - type: private-evidence-only
      severity: material
      topic: geographic-concentration
      missingEvidence: Revenue, member, and margin mix by city or province.
      whyItMatters: Public evidence suggests Tianjin is strategically central, but the true diversification of the customer base is unknown.
      diligencePath: Request 2023-H1 2026 revenue and member contribution by top 10 geographies.
      relatedQuestionRefs: [QU018, QU019, QU025]
      relatedTableRefs: [TU005]
    - type: missing-source
      severity: material
      topic: paid-vs-connected-sites
      missingEvidence: Distinction between signed, connected, active, and paid hospitals or community health centres.
      whyItMatters: Footprint metrics can exaggerate commercial depth if not paired with site activation and revenue metrics.
      diligencePath: Request implementation funnel data for every major hospital-network deployment.
      relatedQuestionRefs: [QU020, QU021]
      relatedTableRefs: [TU002, TU003]
    - type: missing-source
      severity: material
      topic: account-level-case-studies
      missingEvidence: More named customer case studies with outcome baselines outside Tianjin, Wuzhen, and Tai'an.
      whyItMatters: Expansion quality is still unevenly evidenced across newer cities.
      diligencePath: Request at least three current reference calls or case-study packs from Wenzhou, Yinchuan, and Sanming.
      relatedQuestionRefs: [QU011, QU012, QU022]
      relatedTableRefs: [TU003]
