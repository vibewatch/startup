schemaVersion: report-v2
artifact: customers
slug: wedoctor
runDate: '2026-07-18'
company:
  name: WeDoctor
chapter:
  number: 6
  title: Customers
  summary: >-
    WeDoctor’s customer proof is strongest where local governments, insurers, and provider networks adopted it as operating
    infrastructure rather than as a stand-alone app. The best-documented deployment is Tianjin, where WHO, city-partner
    coverage, and later growth reporting show a live chronic-disease management system running across the community-health
    network. Additional proof exists in Wuzhen county hospitals, Tai’an chronic-disease services, and expansion efforts in
    Wenzhou, Yinchuan, Sanming, and Guiyang. The central customer question is not whether WeDoctor has users, but how
    durable and diversified the revenue base is outside Tianjin, because public retention, cohort, and renewal disclosure
    remains thin.
sections:
  - id: customer-base-segmentation
    title: WeDoctor sells into a multi-sided buyer / user / payer structure led by public-sector demand
    body: >-
      WeDoctor’s customer base is better segmented by buyer, user, and payer than by “consumer versus enterprise.” The
      most economically important buyer in the retained evidence is the city- or region-level public system: municipal
      governments, health commissions, healthcare-security bureaus, and community-health networks that adopt the company’s
      digital-health-community or HSC model. In these deployments, the user is a mix of community health centres,
      hospitals, physicians, health managers, and residents, while the payer is often public insurance, local fiscal
      budgets, or a capitation/shared-savings arrangement. A second segment is provider infrastructure customers, such as
      county hospitals connected through Wuzhen Internet Hospital and hospitals using internet-hospital, cloud pharmacy,
      cloud examination, or referral workflows. A third segment is the member or resident base enrolled into chronic-care
      and health-management services. A fourth is the legacy consumer-app and internet-hospital traffic surface, which
      contributes reach but is less richly documented on revenue durability than the HSC model. Taken together, the public
      evidence suggests WeDoctor’s strongest commercial motion is B2G2C and B2B2C rather than pure D2C telehealth. That
      means customer diligence should focus less on raw app reach and more on who controls budgets, reimbursement flows,
      care-pathway permissions, long-term contract renewals, and local procurement decisions. It also means different customer metrics matter at each
      layer: hospital connections matter for provider infrastructure, member counts matter for managed-care scale, and
      renewal rates matter most for proving account durability.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU001, TU002]
    figureRefs: [FU001]
  - id: named-customer-proof-and-adoption
    title: Named customer proof is real, but it is unevenly distributed between production deployments and early-stage city partnerships
    body: >-
      The highest-quality proof is Tianjin. WHO documents a public–private chronic-disease management reform in which
      WeDoctor managed community-health-centre workflows under a capitation structure, built operational capacity across the
      city, and embedded health managers and AI-assisted processes into care delivery. Later coverage says Tianjin became a
      flagship region with more than 1.666 million members and 44 primary institutions plus 11 higher-level hospitals in
      four districts by mid-2025. Wuzhen provides another strong proof point on the provider side: more than 1,200 county
      hospitals were reportedly connected through a standardized specialty, remote guidance, and cloud-clinic model.
      Tai’an gives a cleaner disease-program proof, with a chronic-disease internet hospital connected to 23 outpatient
      pharmacies and more than 200,000 chronic-disease patients. Beyond those, Wenzhou, Yinchuan, Sanming, and Guiyang
      show expansion demand and named counterparties, but the public evidence often remains one step earlier on production
      metrics, renewal visibility, and economic outcomes than Tianjin does. The chapter therefore distinguishes between
      production-grade proof, rollout-grade proof, and logo-only or agreement-stage evidence for conservatism and clarity throughout externally. That distinction prevents a
      signed municipal agreement from being over-read as equivalent to an already-operating citywide care-management system.
    claimRefs: [CU010, CU011, CU012, CU013, CU014, CU015, CU016, CU017, CU018, CU019, CU020, CU021, CU022]
    tableRefs: [TU003]
    figureRefs: [FU002, FU003]
  - id: durability-expansion-and-concentration
    title: Durability appears promising, but concentration and renewal visibility remain the core diligence issue
    body: >-
      Public sources support the view that WeDoctor can expand once a flagship city proves out: the partner program,
      multi-city announcements, and 2025 coverage all point to a standardized rollout playbook. But public durability proof
      still lags deployment proof. There is no disclosed NRR, GRR, churn, average contract length, renewal rate, or top-10
      customer concentration schedule in the retained source set. Instead, outside investors infer durability from city
      expansion, rising HSC membership revenue, health-manager hiring, and deeper integration into provider and insurance
      workflows. That leaves a concentration question. 36Kr explicitly framed Tianjin as the “ballast stone” of company
      performance, implying WeDoctor’s best-developed customer economics remain anchored in one region even as the company
      expands elsewhere. For diligence purposes, the practical conclusion is that customer reality is well supported,
      expansion logic is credible, and retention economics remain under-disclosed. A complete diligence package should tie
      each flagship deployment to revenue, renewal, active-member behavior, and sponsor dependence by city. Until then,
      the safest interpretation is that WeDoctor has customer reality and adoption momentum, but not yet fully transparent
      diversification proof or a publicly auditable renewal history across its next-tier geographies and buyer classes.
    claimRefs: [CU023, CU024, CU025, CU026, CU027, CU028, CU029, CU030, CU031, CU032, CU033, CU034, CU035, CU036]
    tableRefs: [TU004, TU005]
    figureRefs: [FU004]
callouts:
  - calloutType: strength
    title: The strongest proof is embedded in live care systems, not just user-count marketing
    body: >-
      WHO’s Tianjin case study and named local deployments show WeDoctor operating inside real provider and insurance
      workflows, which is materially stronger than logo-only customer evidence.
    claimRefs: [CU010, CU011, CU012, CU014, CU016, CU020]
  - calloutType: risk
    title: Tianjin is both the best proof point and the clearest concentration warning
    body: >-
      Tianjin demonstrates repeatable value, but public evidence still suggests it is the company’s most important and most
      mature customer geography, making diversification a key diligence ask.
    claimRefs: [CU023, CU030, CU033, CU036]
