            body: >-
              WeDoctor 没有发布干净的单位经济学仪表盘，但几个公开代理指标揭示了机制。WHO 天津论文称，按人头付费预算把产生结余的 30% 分配给 WeDoctor，70% 分配给卫生中心，医院保留自身结余的
              100%。同一篇论文称，WeDoctor 部署了 200 多名健康管理师、90 名联络经理、AI
              系统、筛查设备和处方监测工具；这意味着运营模式重人力、重系统，而不是高毛利的纯软件模式。天津健康管理师平均年薪据报为 ¥70,000；公司称，在 AI 支持下，一名管理师最终可在 2024 年管理约 2,000
              人，2025 年管理 2,600 人。VCBeat 的分部评论显示，会员业务基础层毛利较低，但之后能为更高毛利的增值服务形成大池子。合在一起，证据支持这样一种业务：它能靠 AI
              辅助劳动生产率和理赔控制改善利润率，但不能按天真的 SaaS 毛利率假设来投资判断。
