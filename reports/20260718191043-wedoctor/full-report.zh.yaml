          - type: callout
            title: 头部 TAM 不如支付方组合有用
            body: 对 WeDoctor 而言，决定性市场问题不是中国数字健康是否够大，而是哪些部分可报销、受监管，并能通过健康管理合同变现，而不是只靠消费者流量。
            calloutType: insight
            claimRefs:
              - CM003
              - CM014
              - CM015
              - CM035
              - CM037
          - type: callout
            title: 监管扩大了市场，也收窄了落地路径
            body: 政策支持互联网医疗，但也规定了在线复诊边界、处方控制、报销规则和敏感数据义务；任何缺乏深度合规和地方政府集成的平台都会因此放慢扩张。
            calloutType: risk
