      - number: '8.4'
        title: 剩余工作是证明 WeDoctor 应享有战略溢价，还是应承受私营公司折价
        blocks:
          - type: paragraph
            body: >-
              最终尽调应聚焦少数真正会改变判断的变量。第一是地理集中度：收入、利润率和会员增长中，多少来自天津，多少来自新城市？第二是现金和股权结构现实：估值背后有多少优先权包袱、流动性需求和上市时间表压力？第三是续约质量：医院、政府和会员是否留下并扩大合作，还是增长仍主要来自新城市铺开？第四是控制质量：隐私、安全和临床治理体系是否强到足以进入公开市场？如果这些答案扎实，WeDoctor
              可能配得上高于同行的倍数。否则，合理动作是要求大幅降价或不参与。如果集中度、政策依赖或控制弱点显著坏于增长叙事暗示，投资逻辑就会破裂。用估值语言说，不确定性仍应对应更高折现率和更低倍数。
