  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: WeDoctor 有真实规模和战略资产，但反向逻辑是公开证据不足以支撑这么高的溢价倍数
        blocks:
          - type: paragraph
            body: >-
              正向逻辑很直接。WeDoctor 似乎已搭出中国最深的数字健康运营系统之一：天津有真实基础设施，服务方连接广，HSC 收入引擎在增长，还握有难以复刻的机构数据和工作流资产。2025 年增长叙事很强；如果 HSC
              模式确实能跨城市复利，公司可以高于最弱的公开可比公司交易。估值上，更重要的是反向逻辑。相邻的互联网医疗龙头已经有公开可比对象；这些同行虽然披露更强、有上市公司纪律、也更被投资人熟悉，收入倍数却低得多。按保留的私募估值标记，WeDoctor
              的定价像是在假设天津式经济性会全国铺开、利润率会显著扩大；但公开证据在集中度、续约、现金生成和逐城单位经济性上仍留下大缺口。这个组合支持尊重公司质量，也支持怀疑当前价格。投资人应把估值上行视为需要挣出来，而不是默认存在。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
