  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: WeDoctor 面向多边买方 / 用户 / 支付方结构销售，公立部门需求牵引
        blocks:
          - type: paragraph
            body: >-
              比起“消费者 / 企业”，按买方、用户和支付方来拆 WeDoctor 客户群更准确。留存证据里经济上最重要的买方，是城市或区域级公立系统：市政府、卫健委、医保局，以及采用公司数字健康共同体或 HSC
              模式的社区卫生网络。在这些部署里，用户混合了社区卫生中心、医院、医生、健康管理师和居民；支付方通常是公共保险、地方财政预算，或按人头付费/节余分成安排。第二个分部是医疗机构基础设施客户，例如通过乌镇互联网医院连接的县级医院，以及使用互联网医院、云药房、云检查或转诊工作流的医院。第三个分部是纳入慢病照护和健康管理服务的会员或居民人群。第四个分部是传统消费者应用和互联网医院流量界面，它贡献触达，但收入耐久性不如
              HSC 模式有资料支撑。合在一起，公开证据显示 WeDoctor 最强的商业动作是 B2G2C 和 B2B2C，而不是纯 D2C 远程医疗。因此，客户尽调应少看原始应用
              触达，多看谁控制预算、报销流、诊疗路径许可、长期合同续签和地方采购决策。不同层级也要看不同客户指标：医疗机构连接数衡量基础设施，会员数衡量管理式医疗规模，续签率最能证明客户耐久性。
