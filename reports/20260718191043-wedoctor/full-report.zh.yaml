chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、创业路径，以及公司为何重要
        blocks:
          - type: paragraph
            body: >-
              WeDoctor 的公开记录格外重要，因为公司踩在中国几条政策弧线的交汇处：在线分诊和预约挂号、互联网医院、线上处方流转、医保结算，以及如今的 AI 辅助健康管理。业务可追溯到 2010 年的
              Guahao.com，最初帮助医院优化挂号，并把患者导向合适医生。公开里程碑随后显示，公司的野心快速扩大：2015 年更名为 WeDoctor，2015 年 12 月上线中国首家互联网医院乌镇互联网医院，2017
              年推出 WeDoctor Cloud，作为医院和区域医疗系统的数字基础设施。到 2024 年 12 月香港递表时，公司已经不再只把自己描述为在线问诊市场，而是 AI
              驱动医疗服务和数字医疗平台供应商，服务医疗机构、支付方、企业和患者。这一转变会影响后文判断：尽调问题不再是 WeDoctor
              能否把患者导到线上，而是它是否已经在中国医疗、医保和药品配送链条里搭出持久的系统级位置。
