            body: >-
              第二组风险是运营。WHO 和部署证据清楚显示，WeDoctor
              的系统不是纯软件驱动；它依赖健康管理师、医疗机构工作流重塑、处方审核、转诊逻辑、人群健康数据管道，以及与社区卫生中心和医院的持续集成。这创造了多种失败模式：站点启用慢、医疗机构采用不均、AI
              支持决策里的异常处理薄弱、隐私或安全事件，以及健康管理师运营中的劳动力管理问题。公开来源确实显示了一些缓释因素。WHO
              描述了结构化风险分层和处方审核控制，天津及其他城市部署也指向真实世界运营纪律。外部可审计性仍然有限。留存来源集中没有丰富的公开信任中心、MLPS
              等保材料包、安全审计摘要或已披露事件日志。因此，投资者必须一边假设公司具备有意义的运营成熟度，一边接受关键控制证据大多仍在私域。这在私人尽调中可以处理，但仍应抬高任何公开市场式投资判断的门槛。
