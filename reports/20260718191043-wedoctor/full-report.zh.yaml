        title: 耐久性看起来有希望，但集中度和续签可见度仍是核心尽调问题
        blocks:
          - type: paragraph
            body: >-
              公开来源支持这样的判断：一旦旗舰城市跑通，WeDoctor 就能扩张；伙伴计划、多城公告和 2025 年报道都指向一套标准化推广打法。但公开耐久性证明仍落后于部署证明。保留来源集中没有披露
              NRR、GRR、流失率、平均合同期限、续签率或前 10 大客户集中度表。外部投资者只能从城市扩张、HSC
              会员收入上升、健康管理师招聘，以及更深地嵌入医疗机构和保险工作流来推断耐久性。这留下一个集中度问题。36Kr
              明确把天津称为公司业绩的“压舱石”，暗示即便公司向外扩张，发展最充分的客户经济性仍锚定在一个区域。尽调上的实际结论是：客户真实性有充分支撑，扩张逻辑可信，留存经济性仍披露不足。完整尽调包应按城市把每个旗舰部署和收入、续签、活跃会员行为及发起方依赖绑定起来。在那之前，最稳妥的解读是
              WeDoctor 有客户真实性和采用动能，但还没有充分透明的多元化证明，也没有跨下一梯队地区和买方类别的公开可审计续签历史。
