      - number: '6.2'
        title: 有名有姓的客户证据真实存在，但在生产部署和早期城市合作之间分布不均
        blocks:
          - type: paragraph
            body: >-
              最高质量证据是天津。WHO 记录了一项公私合作慢病管理改革：WeDoctor 在按人头付费结构下管理社区卫生中心工作流，在全市搭建运营能力，并把健康管理师和 AI 辅助流程嵌入照护交付。后续报道称，到 2025
              年中，天津已成为旗舰区域，拥有超过 1.666 million 名会员，四个区内有 44 家基层机构和 11 家较高级别医院。乌镇在医疗机构侧提供另一项强证明：据报道，超过 1,200
              家县级医院通过标准化专科、远程指导和云诊所模式连接。泰安给出更干净的疾病项目证明：一家慢病互联网医院连接 23 家门诊药房和超过 200,000
              名慢病患者。在这些案例之外，温州、银川、三明和贵阳显示扩张需求和有名有姓的合作方，但公开证据通常比天津早一步，生产指标、续签可见度和经济结果更少。因此，本章为了外部表述的保守和清晰，区分生产级证据、推广级证据，以及只有
              标识或协议阶段的证据。这种区分能防止把已签市政协议过度解读为等同于已运营的全市照护管理系统。
