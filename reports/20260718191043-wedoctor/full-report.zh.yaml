            body: >-
              上市同行证据说明，不能不加语境地把 WeDoctor 按简单品类龙头来投资判断。Ping An Health 报告 2025 年收入 RMB 5.468
              billion，并明确把收入基础拆分为商业保险赋能和企业健康管理。JD Health 报告 2024 年收入 RMB 58.16
              billion，反映其在网上药房和健康产品分发上的压倒性规模，以及围绕问诊、检测和线下节点不断扩大的服务闭环。Alibaba Health 报告 FY2024 收入 RMB 27.03 billion、300
              million 年活跃用户、超过 35,000 家商户和超过 220,000 名签约医疗专业人员。这些公司并不是 WeDoctor
              市级健康服务共同体模式的干净替代品，但它们定义了客户触达、经审计披露和投资者可比性的标准。相较之下，WeDoctor
              最强的差异点，是它似乎能把一体化慢病管理和地方改革执行变现，而不是主要变现零售健康消费。最弱的点在于，公开数据对定价、留存、活跃用户底数和资本结构的披露仍远薄于上市同行。
