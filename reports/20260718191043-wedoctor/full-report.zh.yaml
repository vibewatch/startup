        - 纯线下首诊医院护理
        - 消费者、医院、支付方
        - 支撑患者触达，但只是 WeDoctor 模式的一层
      - - 在线药房
        - 处方履约、OTC、慢病用药配送、药品目录匹配
        - 传统纯线下零售药店
        - 消费者、医院、企业、支付方
        - 对 WeDoctor 重要，但不是唯一经济驱动
      - - 数字医疗基础设施
        - 医院 SaaS、互联网医院技术栈、云药房、数据和工作流工具
        - 通用办公软件
        - 医院、卫健委、区域系统
        - 最贴近 WeDoctor 服务方定位
      - - 线上企业服务
        - 员工健康管理、职场诊所、保险联动会员计划
        - 没有医疗工作流的通用健康福利
        - 企业和保险公司
        - 说明大型雇主为何是相关支付方
      - - 人群健康管理
        - 按人头付费、价值医疗、慢病监测、区域 HSC 模式
        - 没有结果责任的按项目付费医疗
        - 医保基金、地方政府、服务方网络
        - WeDoctor 的核心战略楔子
      - - 消费者健康内容和工具
        - 健康教育、分诊、App 入口点、基础自助工具
        - 独立硬件或非医疗健身 App
        - 消费者和广告主
        - 有助于获客，但不是完整承保逻辑
