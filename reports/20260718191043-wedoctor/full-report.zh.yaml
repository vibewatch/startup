  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: WeDoctor 处在医疗、保险和敏感数据流内部，监管与法律暴露在结构上很高
        blocks:
          - type: paragraph
            body: >-
              WeDoctor 最根本的风险是监管复杂度。公司不只是为无害后台流程提供软件；它介入互联网医院工作流、处方审核、健康管理项目、医保互动和 AI
              支持的临床流程。这意味着其运营模式对互联网医院牌照规则、在线诊疗监管、医保支付政策、算法治理预期，以及中国隐私和数据安全法律都很敏感。公开来源显示，公司已经采取一些步骤来适配这一环境，包括算法备案和持牌部署结构。但同一批来源也显示，这一模式要跑通，需要持续监管协作。如果主管部门收紧在线诊疗、算法使用、跨机构数据流或保险方联动慢病项目监管，WeDoctor
              的客户经济性可能快速变化。公开尽调还无法检查覆盖每座城市、每张牌照、每套数据治理流程或每项审计结果的完整合规包，这会放大风险。换句话说，合规方向看起来可信，但仅凭公开证据还没到完全可审计。
