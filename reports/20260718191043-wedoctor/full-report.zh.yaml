  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 真正的竞争是争夺诊疗与支付工作流的控制权
        blocks:
          - type: paragraph
            body: >-
              表层竞品清单会把 WeDoctor 和任何中国远程医疗或网上药房品牌放在一起。这太窄。更强的解读来自招股文件、官方产品页和部署证据：中国数字医疗竞争围绕几个不同控制点集群。Ping An Health
              控制着保险联动服务闭环，核心是家庭医生、养老和雇主项目。JD Health 控制海量消费者流量和药房履约，再向在线医院、诊断和 AI 赋能医疗工作流外扩。Alibaba Health
              控制同样庞大的商业和问诊界面，由 Tmall 流量、直营药房，以及横跨云药房、云医院和云基础设施的三云战略支撑。DXY
              又不同：它拥有深厚医生社区、药品数据资产、开放平台工具和专业教育分发，能影响处方行为和医院工作流。Chunyu Doctor 仍是经典的轻问诊替代品，证明低复杂度医生市场模式仍然存在。因此，WeDoctor
              的位置最接近那些不只中介消费者需求、还试图中介医疗机构工作流、区域整合和支付方经济性的竞品。这在战略上有吸引力，因为更难复制；但也意味着 WeDoctor 处在监管最重、落地最重的竞争角落。
