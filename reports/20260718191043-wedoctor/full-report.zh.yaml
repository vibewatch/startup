      - number: '5.4'
        title: 信任控制能从算法备案和工作流护栏看到，但还不能完全审计
        blocks:
          - type: paragraph
            body: >-
              在医疗场景里，如果没有合规和工作流信任，技术能力价值会打折。最强的可见控制信号，是官方算法备案和真实世界安全工作流。VCBeat 的 CAC 备案报道称，WeDoctor 已为多个医疗模型取得国家算法注册；WHO
              描述的 AI 处方审核会在批准、标记或升级处方前，检查指南、不良反应、库存、药品目录可得性、价格和保险方规则。公开报道还称，上海 AI 医院持有互联网医院牌照和医保定点资质，公司的 HSC
              部署建在正式地方政府安排之下。中国 PIPL、数据安全法和 2018 年互联网+医疗规则，为敏感数据处理、互联网医院运营和 AI 服务使用划出法律边界。开放问题是可审计性。公开来源在控制设计和监管方向上很强，但对
              MLPS 等保等级、泄露历史、模型治理材料和独立安全评估披露很薄。对投资者而言，含义是信任架构看起来严肃，但还不能完全检查。
