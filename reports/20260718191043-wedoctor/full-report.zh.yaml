      - number: '5.3'
        title: 护城河来自数据、工作流和机构依赖的共同作用
        blocks:
          - type: paragraph
            body: >-
              WeDoctor 的差异化主张建立在三块互相强化的要素上。第一是应用数据和基准表现。VCBeat 和 Longport 称，WeDoctor 医疗大模型在 CMB 上以 91.71
              排名第一，并用数亿条对话和病例记录以及大型机构数据集训练。第二是部署深度。WHO 不只描述演示模型，而是记录了一个覆盖 266 个天津社区卫生中心、标准化筛查基础设施、健康管理师和 AI
              引导处方逻辑的运营环境。第三是机构合作。公司的 AI 栈依赖浙江大学睿医 AI 研究中心、省级实验室合作、Tencent
              协作，以及天津、三明、温州、银川等地的地方政府或医院协议。话虽如此，同样的依赖也创造了风险。官方 GitHub
              组织几乎没有公开开发者界面，也没有开源信号；除伙伴或媒体描述外，公开技术文档有限。因此，产品更容易在运行中被观察，而不是从公开代码或 API 表面被反向拆解。
