      - number: '8.3'
        title: 按最后一轮估值，合理建议是观察或继续研究；进入价格纪律和下行触发点必须清楚
        blocks:
          - type: paragraph
            body: >-
              证据支持的建议不是在最后一轮私募估值上“买入”，而是观察或继续研究。如果投资人拿到的进入价格假设 WeDoctor
              应比上市同行高出数个收入倍数，举证门槛就应极高。证据不能只证明增长更快，还要证明利润率更好、流失更低、多城复制可行、政策风险可控。做不到这些，更好的立场是等待披露改善或价格更有吸引力。可操作的进入框架要么要求相对最后已知私募估值有很大折价；要么要求硬证据证明
              HSC 经济性和现金转化强到足以让上市同行倍数失去锚定意义。今天第二个命题有可能成立，但公开层面尚未证明。因此，进入纪律必须写成一个区间和尽调条件，而不是自信的公允价值判断。
            claimRefs:
              - CV021
              - CV022
              - CV023
