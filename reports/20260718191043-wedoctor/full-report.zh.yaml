      - - IPO 或资本约束
        - 反复推迟上市或披露质量薄弱
        - 透明度未改善，却出现重大融资需求
        - 要求融资下行保护，或推迟
      - - 运营例外风险
        - AI 辅助诊疗工作流中人工覆写率或升级率偏高
        - 自动化质量无法推广到旗舰区外的证据
        - 下调对经营杠杆逻辑的信心
    notes: 这些触发点把当前叙事较重的尽调图景转成可执行监测框架。
    claimRefs:
      - CR031
      - CR032
      - CR033
      - CR034
      - CR035
      - CR036
      - CR037
      - CR038
      - CR039
      - CR040
  - id: TV001
    title: 建议摘要表
    columns:
      - 建议
      - 置信度
      - 风险评级
      - 估值立场
      - 决策含义
    rows:
      - - 观察 / 继续研究
        - 中
        - 高
        - 按最近已知私募估值看，吸引力不足
        - 启动投资测算前，要求更好披露或明显更低进入价格
    notes: 建议有意围绕价格敏感度，而不是给公司质量打分。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 改变判断的条件
    rows:
      - - WeDoctor 借天津、HSC 和医疗机构整合，在中国数字健康领域具备少见的战略纵深
        - 多城市复现得到确认且利润率更优，会强化这一判断
      - - AI 加健康管理基础设施，可能支撑其相对基础远程医疗同行的部分溢价
        - 需要验证天津之外的经济性
      - - 公开可比公司已隐含远低于上次私募估值的收入倍数
        - 披露和盈利能力大幅提升，可能收窄差距
      - - 若缺少更强证据，私营公司不透明和政策依赖支持折价，而非溢价
        - 达到上市公司水平的披露会降低折价
    notes: 投资逻辑同时肯定公司质量，也对价格保持纪律。
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV008
      - CV009
      - CV010
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值或回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - HSC 在多个城市复现，利润率改善，投资人更奖励稀缺性，而不是按公开可比公司的倍数压缩定价
        - 战略溢价延续，估值可维持在高个位数十亿美元区间
        - 政策或集中度风险被证明夸大
        - 中低
      - - 基准
        - 增长延续，但公开可比公司估值牵引、集中度和披露限制占主导
        - 若无新证据，估值应明显低于上次私募估值
        - 溢价向高质量上市同行区间压缩
        - 中高
      - - 悲观
        - 天津仍是特例，新城市扩张缓慢，IPO 或政策风险开始反噬
        - 估值可能大幅重置，靠近公开可比公司的低收入倍数
        - 降价轮或流动性延迟风险上升
        - 中
    notes: 概率标签为定性判断，因为公开证据不足以支撑精确点估计。
    claimRefs:
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数或估值
      - 状态
      - 参考意义
      - 局限
    rows:
      - - WeDoctor 私募估值
        - 私募估值
        - ≈US$6.7B
        - 未上市
        - 公司的直接当前价格锚
        - 私募估值可能包含优先权、战略稀缺性和滞后定价
      - - Ping An Health
        - 市销率
        - ≈1.38x
        - 上市
        - 最接近的中国上市互联网健康平台，且有大规模管理式服务敞口
        - 业务组合和上市公司成熟度不同
      - - JD Health
        - 市销率
        - ≈1.40x
        - 上市
        - 大型上市数字健康市场和服务平台
        - 商业组合不同，政策集中度可能更低
      - - Alibaba Health
        - 市销率
        - ≈2.45x
        - 上市
        - 大型上市健康平台，生态支持更强
        - 平台经济性和母生态优势不同
      - - WeDoctor 上次估值隐含的远期销售额
        - 估值 / 2025 年上半年年化收入
        - 大约高个位数倍销售额
        - 隐含
        - 显示私募估值要求多大溢价
        - 取决于年化和汇率假设
    notes: 目的不是追求虚假精确，而是检验公开证据是否支撑相对上市同行支付大幅溢价。
    enumerationScope:
      coverage: partial
      basis: >-
        This comp table focuses on the most relevant retained public and private anchors for entry discipline rather
        than every China health-tech company.
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
  - id: TV005
    title: 投资逻辑破裂触发点表
    columns:
      - 触发点
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 集中度差于预期
        - 天津仍占主导，且没有可信第二旗舰
        - 削弱可复制性和估值倍数支撑
        - 要求大幅折价，或放弃
      - - 政策或报销冲击
        - 规则变化损害线上诊疗、保险方关联服务或核心数据流
        - 降低 HSC 经济性的持久性
        - 立即重新测算
      - - 披露薄弱或 IPO 滑坡
        - 上市延迟持续，透明度没有改善
        - 提高流动性和治理折价
        - 除非进入价格重置，否则推迟
      - - 控制薄弱
        - 出现实质性隐私、安全或治理缺口
        - 损害溢价逻辑和公开市场准备度
        - 视为投资逻辑破裂
      - - 同行倍数压缩
        - 公开可比公司估值区间进一步下移
        - 高私募倍数更难站住脚
        - 下调估值预期
    notes: 当前判断更受价格和披露影响，而不是只随收入质量叙事变化。
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV030
  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 城市经济性
        - 按城市拆分的收入、利润率和会员结构
        - 用来检验天津集中度和可复制性
        - 财务 + 区域 GM 尽调
      - - 股权结构表和优先权负担
        - 优先股堆叠、清算条款、老股定价背景
        - 用来把估值转成真实进入经济性
        - 法务 + CFO 尽调
      - - 续约质量
        - 按队列拆分的政府、医院和会员留存
        - 用来支撑溢价倍数论证
        - 收入运营 + FP&A 尽调
      - - 现金生成
        - 现金、债务、营运资本状况和融资跑道
        - 用来评估稀释和 IPO 压力
        - 财务尽调
      - - 控制环境
        - 安全、隐私和模型治理文件
        - 用来判断公开市场准备度折价
        - CISO + GC 尽调
      - - 天津之后的验证
        - 温州、银川、三明、贵阳及其他新市场的运营看板
        - 需要支撑战略溢价
        - 区域运营复盘
    notes: 这些变量最可能改变投资建议。
    claimRefs:
