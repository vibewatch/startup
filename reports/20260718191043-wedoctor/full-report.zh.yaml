      - number: '3.3'
        title: DXY 和 Chunyu 展示两条不同替代路径
        blocks:
          - type: paragraph
            body: >-
              DXY 和 Chunyu 重要，因为它们揭示了两类不同替代风险。DXY 是专业网络和医疗数据竞品，医生触达异常深。其官方关于页面称，DXY 服务 9 million 名注册医疗专业人员，约代表中国 80%
              的医疗劳动力；产品界面从药品数据和开放 API 延伸到专业教育、招聘，以及面向患者的内容和问诊产品。即便 DXY 不是最接近 WeDoctor
              的支付方集成同行，它仍能强力影响医生工作流和医学知识分发。Chunyu Doctor 代表另一条替代路径：复杂度更低、面向大规模消费者的在线问诊。其法律/收购报道称，它拥有超过 180 million 注册用户和
              690,000 名持证医生；其在线消费者页面仍把快速提问和专家问诊流程作为产品入口。这两个替代品重要，因为它们说明，数字医疗任务的一部分可以靠专业社区控制赢下，也可以靠更轻的医生市场聚合赢下，不只有
              WeDoctor 更重的区域运营模式这一条路。
