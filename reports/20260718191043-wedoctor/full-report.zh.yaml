  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: WeDoctor 实际所在的市场
        blocks:
          - type: paragraph
            body: >-
              适合 WeDoctor
              的市场定义，不能大到整个数字医疗宇宙，也不能窄成单一远程医疗应用。公开市场报告和上市同行披露至少指向五类：在线问诊、网上药房、数字医疗基础设施、线上企业服务和消费者健康产品。WeDoctor
              在这些领域都有一定参与，但战略重心不是网上药品零售，也不是纯 D2C
              健康消费。公司更靠近三者重叠处：数字医疗基础设施、面向企业或支付方的健康管理服务，以及通过互联网医院和区域医疗网络交付、符合政策方向的慢病管理。因此，不能只看用户 应用下载量或电商 GMV
              来理解市场。业务与中国政府、医院、保险方和大型雇主如何采用数字工具有关：把照护迁移到线上、管理慢病人群、在扩大可及性的同时控制报销增长。
