      - number: '2.3'
        title: 买方、用户和支付方角色天生分散
        blocks:
          - type: paragraph
            body: >-
              WeDoctor 的市场结构是多边的。终端用户可能是患者或慢病会员，但买方可以是医院体系、基层医疗网络、地方卫健委、市级或区级医保基金、企业 HR
              部门，也可以是直接购买问诊和药品的消费者。同行披露有助于解释分层。Ping An Health 强调雇主和保险联动的健康管理。JD Health 披露显示，其庞大药房和问诊用户基础与电商需求绑定。Alibaba
              Health 混合了平台商家、直营网店、问诊和慢病服务工具。DXY 官方简介显示，它是医生密集的专业网络，同时配有庞大的消费者健康内容和问诊流量。WeDoctor
              自身定位最接近支付方赞助的照护管理、医疗机构数字化、互联网医院，以及部分消费者和企业服务层的交叉点。这意味着采用过程不像单一 app
              漏斗，更像一串步骤：政策许可、医院集成、支付方对齐、医生工作流采用，随后才是患者参与。
