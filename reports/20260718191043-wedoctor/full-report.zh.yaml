      - number: '2.4'
        title: 政策支持很强，但信任和落地摩擦仍然重要
        blocks:
          - type: paragraph
            body: >-
              市场顺风真实存在。十多年来，中国中央政府持续推动“互联网+”、健康中国 2030、互联网医院、AI 辅助医疗服务、家庭医生支持和医保数字化。2018
              年国务院互联网医疗意见明确允许互联网医院、常见病和慢病在线复诊、线上处方路径，以及 AI 赋能医疗服务。2020
              年医保指导意见把报销也推向同一方向。但这些政策没有创造一个无约束扩张的自由市场。同一框架内嵌了医疗质量、处方审核、数据可追溯、敏感患者数据境内存储和本地化落地约束。PIPL
              和数据安全法抬高了不负责任扩张医疗数据平台的成本，市场报告也持续把患者信任和动机列为采用刹车。对 WeDoctor
              而言，这意味着公司受益于一个大且受支持的市场，但执行优势必须包含监管熟练度、医院集成能力，以及向支付方证明经济结果的能力，而不只是消费者参与。
