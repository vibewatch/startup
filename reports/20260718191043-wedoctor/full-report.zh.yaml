      - number: '1.3'
        title: 资本形成、投资者，以及重启的香港 IPO 路径
        blocks:
          - type: paragraph
            body: >-
              公开融资故事方向清楚，但数字混乱。Reuters 转发报道确认，WeDoctor 在 2021 年早期尝试受挫后，于 2024 年 12 月 31 日重新提交香港 IPO
              申请；此前受挫发生在北京整顿私营部门数据处理期间，尤其影响处理敏感医疗信息的企业。同一批报道称，新上市融资目标约为 $400 million 到 $500 million，China Merchants Bank
              是独家保荐人。公开报道列出的 IPO 前投资者包括 Tencent、Hillhouse、HongShan、AIA、Hermitage、CICCFH 和 Qiming。估值引用集中在同一水平：Premier
              Alternatives 给出 WeDoctor 截至 2024 年 12 月 31 日估值 $7.0 billion；GetLatka 称 2022 年一轮融资把公司估到 $7 billion；Hurun
              2025 China 500 排名折算约为 RMB 51 billion。累计融资更不干净。Premier Alternatives 称已融资 $1.6 billion，GetLatka 称 $1.5
              billion，而 Tracxn 可见记录只有 $894 million，因为它似乎停在较早披露轮次。这一差异不推翻独角兽状态，但意味着后续估值工作应把确切历史资本堆叠视为部分未解，而不是已经完全坐实。
