  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 现在收入更像管理式医疗逻辑，而不是市场平台逻辑
        blocks:
          - type: paragraph
            body: >-
              对 WeDoctor 当前收入模式最好的描述，来自招股书衍生报道和 2026 年 HSC 后续报道。这些来源描述了两个顶层业务：AI 驱动医疗服务和数字医疗平台。AI
              驱动一侧包括健康管理会员服务、云药房，以及通过健康服务共同体模式交付的增值服务。平台一侧包括数字医疗服务、线下医疗中心服务和企业会员服务。这种区分重要，因为经济重心已经移动。中国早期数字医疗模式常依赖流量、问诊转化或药房分发。WeDoctor
              增长更快的引擎似乎变成了与按人头付费挂钩的会员收入：公司因管理人群健康、提升医保效率而获得报酬。WHO
              天津案例研究强化了这一点：试点收入来自按人头付费下的节余分成，加上预防性增值服务，而不只是一次性应用交易。从财务上看，WeDoctor
              不应被当作纯消费者市场平台，而更像一个运营平台：只要签约人群和医疗机构工作流留在系统内，它就能赚取经常性收入。
