        - 推高执行成本，并可能限制跨境或宽松的数据复用
        - 复核数据驻留、同意机制和模型训练控制
      - - 地方报销与落地碎片化
        - 负向
        - 持续
        - 中央政策定方向，但城市落地各不相同
        - 全国可触达市场不是一个同质买方池
        - 梳理哪些城市已经把 WeDoctor 类服务跑起来
      - - 医院集成复杂度
        - 负向
