      - number: '3.4'
        title: WeDoctor 的护城河是机构深度，但证明这条护城河成本很高
        blocks:
          - type: paragraph
            body: >-
              现有证据显示，WeDoctor 最持久的优势不是简单应用流量，而是医疗机构集成、AI 辅助照护管理、云药房编排，以及在天津和新一轮 HSC 扩张中显现的地方政府或支付方对齐。WHO
              和部署报道把这一点落到实处：WeDoctor 已在城市级公私合作运营模式内，运营社区卫生中心按人头付费试点、AI
              辅助处方审核、风险分层随访和健康管理师工作流。这套能力比销售在线问诊或运营大型药房门店更难。但同一条护城河也有具体脆弱点。上市同行资本更多、公开指标更清楚，消费者或保险方分发更广。DXY
              医生心智和数据工具更宽。Chunyu 说明，更简单的消费者漏斗也能吸引大量医生和用户供给，同时承担更少落地复杂度。如果 WeDoctor 的 HSC 和 AI
