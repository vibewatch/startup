            body: >-
              公开收入轨迹很强。招股书衍生报道称，持续经营收入从 2021 年 RMB 962 million、2022 年 RMB 1.368 billion，增至 2023 年 RMB 1.863
              billion。Reuters 和 VCBeat 随后报道，2024 年上半年收入为 RMB 1.818 billion，是去年同期两倍多；36Kr 报道 2025 年上半年收入为 RMB 3.08
              billion，同比接近增长 70%。更大的故事是收入结构变化。VCBeat 称，健康管理会员服务在 2024 年上半年达到 RMB 1.032 billion，已占持续经营收入的 56.8%；36Kr 称
              2025 年上半年 HSC 会员收入达到 RMB 2.389 billion，远高于 RMB 450 million 的云药房收入。这说明 WeDoctor
              找到了能跑的增长引擎，但也说明财务集中度正围绕一个模式、也可能围绕一个旗舰区域上升。如果 HSC 打法能复制，这是利好；如果天津式经济性被证明独特或政治上难以复制，就是危险信号。
