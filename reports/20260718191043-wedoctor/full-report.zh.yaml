  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: WeDoctor 交付的是多层医疗运营系统，不是单一 SKU
        blocks:
          - type: paragraph
            body: >-
              产品界面拆成几层，分别服务不同买方和工作流。顶层上，招股书衍生报道称 WeDoctor 业务横跨 AI
              驱动医疗服务和数字医疗平台。在这把伞下，实际产品模块更清楚：互联网医院服务、健康服务共同体模式、云药房、云检查、医院和区域数字管理工具、AI 辅助临床及行政智能体，以及把线上层锚定在持牌医疗机构里的实体或 AI
              赋能医院。因此，产品更应被理解为“医 + 保 + 药”联动的操作系统，而不是单一消费者应用。模块间强化很关键：互联网医院入口创造患者和医生工作流。四云平台把数据、药房、检查和协同连接起来。AI
              智能体自动化诊断支持、用药审核、随访和控费功能。HSC 层提供合同与支付机制，把技术栈转化为经常性收入和城市级运营杠杆。
