        - 衡量 WeDoctor 需求中真正由慢病照护驱动的占比
      - - 互联网医院与医保支付政策支持
        - 正向
        - 持续
        - 2018 年和 2020 年中央政策
        - 为在线复诊、处方和报销打开更大合法空间
        - 逐地梳理哪些服务可纳入报销
      - - 线下医疗资源分布不均
        - 正向
        - 结构性
        - 政策和市场资料
        - 支撑远程协同和转诊工具需求
        - 核查 WeDoctor 的优势集中在医疗供给不足地区，还是已较发达地区
      - - AI 集成与数据工具
        - 正向
        - 中期
        - GlobalData、MRF 和 WeDoctor 相关报道
        - 如果嵌入临床工作流，可提升效率和标准化
        - 区分真实部署与营销说法
      - - 患者信任与使用动机
        - 负向
        - 持续
        - Research and Markets 分发摘要
        - 可能拖慢从兴趣到重复使用的转化
        - 复核重复使用率和满意度的分母
      - - PIPL 和 DSL 下的敏感数据合规
        - 负向
        - 持续
