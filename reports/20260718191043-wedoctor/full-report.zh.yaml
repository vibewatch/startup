companyProfile:
  summary: >-
    WeDoctor 是一家总部位于杭州的数字医疗公司，由 Jerry Liao 创立，从 Guahao 预约平台发展为更宽的互联网医院、AI 健康管理和公共部门医疗运营平台。最强的公开样板在天津：WHO
    及后续报道描述了一套已经上线的慢病管理系统，接入社区卫生中心、健康管理师，以及与支付方目标一致的工作流。到 2025 年公开报道时，WeDoctor 也在把 HSC 定位为核心增长引擎，并背负被广泛引用的约 US$6.7
    billion 私募估值。公司具有战略意义，但仍是私人且披露不完整的企业；公开证据尚未完全解决集中度、估值支撑和控制质量问题。
