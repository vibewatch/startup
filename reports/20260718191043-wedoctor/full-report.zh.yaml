      - number: '1.2'
        title: 从互联网医院先行者到 AI 赋能的健康服务运营商
        blocks:
          - type: paragraph
            body: >-
              当前最有力的业务框架来自 2024 年招股书报道和 2025 年后续报道。这些来源称，WeDoctor 的运营模式分为 AI
              驱动医疗服务和数字医疗平台两块。平台侧包括数字问诊、复诊、药品调配、企业健康产品，以及线下医疗中心或医院服务。增长更快的引擎，是围绕按人头付费和价值导向支付搭建的健康服务共同体模式；WeDoctor
              与地方政府、医院、保险方和基层医疗机构合作，管理慢病人群，并分享与结果一致的节约收益。AI 叠加层已不再是旁线叙事。围绕递表的公开来源称，公司已搭建 WeDoctor 医疗大模型，取得多项国家 AI
              算法备案，并积累数千万条脱敏临床记录。2026 年后续报道更进一步：公司有 5 个国家备案算法、70 多项授权发明专利，并形成健康管理师在 AI
              支持下管理数千名居民的人机协同运营模式。实际含义是，WeDoctor 现在卖的是一套符合政策方向的区域医疗管理操作系统，而不只是消费端应用。
