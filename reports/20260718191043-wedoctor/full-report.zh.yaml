      - number: '2.2'
        title: 测算口径方向一致，但数值区间很宽
        blocks:
          - type: paragraph
            body: >-
              最强的市场信号不是某一个数，而是方向一致。Research and Markets 分发报道预计，中国在线医疗市场到 2028 年达到 $583.68 billion，2024 年起 CAGR 为
              36.89%；Market Research Future 对更窄的数字医疗市场估计为 2024 年 $16.5 billion，到 2035 年升至 $120.67 billion。IMARC
              将更广的中国数字健康市场放在 2025 年 $94.9 billion，到 2034 年达到 $359.9 billion；GlobalData 称，中国应占 APAC 数字健康市场约五分之一，到 2033 年
              CAGR 约 30%。Statista 补上一个采用底数，对 WeDoctor 的业务比任何单一收入估计都更重要：到 2025 年中，中国使用过在线医疗服务的人数超过 390 million，约等于互联网用户的
              35%。结论是，中国数字健康市场在用户层面已经主流化，但报告里的 TAM 很大程度取决于分析师是否纳入药房、可穿戴设备、SaaS、企业服务和更广的数据基础设施。
