              公开证据指向改善，而不是已经完成。VCBeat 报道，持续经营调整后净亏损从 2021 年 RMB 1.354 billion 降至 2023 年 RMB 505 million，2024 年上半年约为 RMB
              128 million；Reuters 引述的 2024 年上半年调整后亏损数字基本相同。WHO 还补充说，WeDoctor 在 2020-2024 年间通过母公司资本和外部融资筹得约 US$88
              million，用于支持天津模式。此前报道预计，重启的香港上市融资目标约为 US$400 million 至 US$500 million；Reuters 称计划募集资金将用于伙伴关系扩张、AI
              技术和应用、服务质量及营运资金。仍缺失的是核心资产负债表视角：手头现金、债务额度、应收款质量、合同负债，以及优先股或稀释堆叠。缺口不否定运营进展，但阻止外部形成干净的现金跑道或偿付能力判断。正确的投资判断姿态是：WeDoctor
