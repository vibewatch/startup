      - number: '7.5'
        title: 图表
        blocks:
          - type: callout
            title: 最严重的风险不是产品不真实，而是与政策绑定的集中度
            body: 公开证据显示 WeDoctor 确实把东西跑出来了，但旗舰验证、支付逻辑和扩张引擎都高度依赖受监管的地方体系和公共部门协同。
