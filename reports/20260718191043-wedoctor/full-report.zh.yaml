      - number: '1.4'
        title: 运营规模、政策契合，以及仍未披露的内容
        blocks:
          - type: paragraph
            body: >-
              运营规模证据已经足以支持严肃尽调。基于 2024 年递表的报道称，WeDoctor 连接约 11,500 家医疗机构和 318,000 名医生，运营 6 家实体医院，并在 2024 年 6
              月前把天津健康服务共同体推到约 900,000 名会员。2025 年和 2026 年后续报道显示同一模式继续扩张：2025 年上半年收入达到 RMB 3.08 billion，健康管理会员收入达到 RMB
              2.389 billion，天津会员超过 1.666 million，四个托管天津区域内的网络已扩展到 44 家基层机构和 11 家二级及以上医院。这些数字重要，因为它们说明 WeDoctor
              不只是讲述政策契合，而是在把一个适配国家互联网医疗、慢病和支付改革议程的医疗交付模式变现。未解决的问题是披露质量。本次检索到的公开来源没有给出干净的董事会名单、所有权比例、优先股堆叠、现金位置，或可与上市同行比较的经审计用户账户底数。因此，公司真实且有规模，但仍不完全透明。
