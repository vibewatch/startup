              年报道时，它也是主要业绩支点。好处在于证明模式跑得通；风险在于，公司明显依赖一个地区、一类发起方和一组报销条件。扩张逻辑也要靠地方政府、医院和运营方愿意复制这一模式。合作伙伴计划表明，WeDoctor
