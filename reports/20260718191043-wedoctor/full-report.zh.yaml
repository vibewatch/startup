              - CV022
              - CV023
      - number: '8.2'
        title: 公开可比估算显示，除非 WeDoctor 证明增长和利润率远好于上市同行，否则相对最后一轮私募估值应有大幅折价
        blocks:
          - type: paragraph
            body: >-
              留存来源显示，WeDoctor 最新被广泛引用的估值约为 US$6.7 billion，历史近期收入约为 RMB 5–6 billion，H1 2025 收入为 RMB 3.08
              billion。即便计入快速增长，收入倍数也明显高于 JD Health、Ping An Health 约 1.4x 销售额区间，以及 Alibaba Health 约 2.5x
              区间。仅凭公开证据，这种溢价很难成立，因为 WeDoctor 仍是私营公司，更不透明，也更集中在旗舰公共部门部署。乐观情景成立的前提是，HSC
              成为可全国复制、高利润率的管理式医疗平台，且公开市场愿意奖励这种独特性。但基准情景仍应锚定公开可比公司倍数压缩、治理不透明和执行风险。因此，估值框架需要情景，而不是单点估计。公开证据足以判断方向，但不足以给出很窄的目标价。
