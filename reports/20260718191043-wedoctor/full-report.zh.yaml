        - id: adoption
          label: 客户激活与续约
        - id: revenue
          label: 收入与利润率
        - id: valuation
          label: 估值与 IPO 结果
      edges:
        - from: policy
          to: payer
          label: 削弱发起方信心
        - from: data
          to: payer
          label: 引发执法或信任冲击
        - from: ops
          to: adoption
          label: 伤害结果和续约
        - from: payer
          to: adoption
          label: 影响合同延续
        - from: adoption
          to: revenue
          label: 改变会员和合同经济性
        - from: revenue
          to: valuation
          label: 影响 IPO 叙事和可比公司支撑
    approximationNotes: 该图展示，本地运营或合规失误如何外溢到单一模块之外。
    claimRefs:
      - CR002
      - CR012
      - CR016
      - CR018
      - CR023
      - CR030
      - CR037
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: 该模式同时依赖监管方、地方发起方、医疗机构、支付逻辑和技术伙伴。
    data:
      nodes:
        - id: regulator
          label: 监管方与法律框架
        - id: sponsor
          label: 地方政府与卫健委
        - id: payer
          label: 保险与支付系统
        - id: provider
          label: 医院与社区卫生中心
        - id: labor
          label: 健康管理师运营
        - id: tech
          label: AI 技术栈与技术伙伴
        - id: wedoctor
          label: WeDoctor 运营平台
      edges:
        - from: regulator
          to: wedoctor
          label: 界定法律边界
        - from: sponsor
          to: wedoctor
          label: 授权并共同建设
        - from: payer
          to: wedoctor
          label: 设定节省和报销激励
        - from: provider
          to: wedoctor
          label: 提供工作流和采用
        - from: labor
          to: wedoctor
          label: 执行慢病管理运营
        - from: tech
          to: wedoctor
          label: 支撑 AI 和工具链
    approximationNotes: 嵌入性同时带来护城河和依赖风险。
    claimRefs:
      - CR003
      - CR014
      - CR021
      - CR024
      - CR026
      - CR027
      - CR038
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议来自一条逻辑链：真实规模和增长成立后，还要用集中度、不透明度和入场价格纪律来约束。
    data:
      nodes:
        - id: proof
          label: 真实平台验证
          detail: 天津、HSC、医疗服务方连接和 2025 年增长共同撑起可信度。
        - id: comps
          label: 上市可比公司估值锚
          detail: 上市同业给出的销售倍数，明显低于上一轮私募估值。
        - id: discount
          label: 不透明度与集中度
          detail: 私营公司披露不足和天津依赖，支撑折价。
        - id: rec
          label: 建议
          detail: 当前估值下观察或继续研究；需要更强验证或更低价格。
      edges:
        - from: proof
          to: comps
          label: 不能抵消
        - from: comps
          to: discount
          label: 强化
        - from: discount
          to: rec
          label: 驱动
    approximationNotes: null
    claimRefs:
      - CV001
      - CV004
      - CV011
      - CV021
      - CV022
      - CV023
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 最大摆动因素是上市可比公司倍数收缩、天津集中度，以及能否证明更优经济性。
    data:
      items:
        - label: 多城市 HSC 复制得到验证
          value: 2
        - label: 利润率和现金转化披露强劲
          value: 2
        - label: 天津集中度仍占主导
          value: -2
        - label: 上市可比公司倍数收缩占主导
          value: -3
    approximationNotes: 数值是相对当前私募估值的方向性估值影响评分，单位为十亿美元。
    claimRefs:
      - CV014
      - CV017
      - CV018
      - CV023
      - CV025
      - CV033
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据支撑的估值区间很宽，在基准情景下明显低于上一轮私募估值。
    data:
      items:
        - label: 悲观情景
          low: 1
          mid: 1.4
          high: 2
        - label: 基准情景
          low: 2
          mid: 3
          high: 4
        - label: 乐观情景
          low: 4
          mid: 5.5
          high: 7
    approximationNotes: 这些区间是基于同业倍数逻辑和情景假设得出的粗略企业价值带，单位为十亿美元；它们不是 DCF。
    claimRefs:
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: WeDoctor 在平台真实性和战略定位上得分较强，但当前入场吸引力和披露质量较弱。
    data:
      items:
        - label: 平台真实性
          value: 8
        - label: 增长叙事
          value: 8
        - label: 战略独特性
          value: 7
        - label: 披露质量
          value: 3
        - label: 集中度风险
          value: 4
        - label: 当前估值吸引力
          value: 2
    approximationNotes: 评分是基于留存证据给出的 0-10 档尽调判断，不代表管理层指引。
    claimRefs:
      - CV002
      - CV004
      - CV007
      - CV023
      - CV024
      - CV032
