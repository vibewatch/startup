      - number: '5.2'
        title: 架构由四云、AI 智能体和持牌医疗节点定义
        blocks:
          - type: paragraph
            body: >-
              最深的架构描述来自 WHO 和 VCBeat。在天津，WeDoctor 搭建了一个与卫生中心基础设施集成的健康管理平台，由经医疗任务调优的通用大语言模型驱动。WHO
              描述了平台如何吸收结构化临床数据、生成诊断假设、排序检查优先级、触发转诊、审核处方、按风险分层患者，并分配随访节奏。VCBeat 补充了更宽的架构词汇：四云——云管理、云服务、云药房和云检查——加上 AI
              医生、AI 药师、AI 健康管理师和 AI 智能控制。上海 AI 医院把这一逻辑延伸到一家持牌实体机构：问诊前 AI 筛查、AI
              医生和药师工作流、问诊后健康管理，以及医保智能管控。这套架构不是通用企业软件，而是一条垂直整合的临床工作流，依赖真实诊疗场景、健康管理师人力、保险方规则、处方逻辑，以及与医院和基层医疗机构的直接连接。
