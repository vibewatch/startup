figures:
  - id: FO001
    title: WeDoctor 里程碑时间线
    type: timeline
    layout: wide
    summary: WeDoctor 的历史从预约导流起步，随后扩到互联网医院、云基础设施、AI 健康管理，并再次冲刺 IPO。
    data:
      items:
        - date: 2010-03
          label: Guahao 成立
          detail: 最初做医院预约和患者导流平台。
          tone: positive
        - date: 2015-09
          label: 更名为 WeDoctor
          detail: 品牌从 Guahao 升级为覆盖更广的 WeDoctor。
          tone: positive
        - date: 2015-12
          label: Wuzhen Internet Hospital
          detail: 公开里程碑资料称其为中国首家互联网医院。
          tone: positive
        - date: 2017-11
          label: WeDoctor Cloud 上线
          detail: 面向医院和医疗体系的基础设施成为正式产品线。
          tone: positive
        - date: 2020-01
          label: 天津 HSC 启动
          detail: 区域 HMO 式慢病和支付改革合作启动。
          tone: positive
        - date: '2021'
          label: 首次冲刺港股 IPO
          detail: 首次资本市场冲刺后来在数据监管压力下停滞。
          tone: warning
        - date: 2022-07
          label: 1B+ RMB 融资
          detail: 档案资料称，公司又完成一轮大额私募融资。
          tone: positive
        - date: 2024-03
          label: Tencent AI / 云合作
          detail: 战略合作协议进一步加深 AI 健康路线图。
          tone: positive
        - date: 2024-08
          label: 上海 AI 医院
          detail: WeDoctor 关联伙伴宣布中国首家 AI 医院。
          tone: positive
        - date: 2024-12
          label: 重启 HKEX 申报
          detail: WeDoctor 重回香港上市计划，发起第二次尝试。
          tone: warning
        - date: 2025-06
          label: 1H2025 收入加速
          detail: HSC 成为主引擎后，收入升至 RMB 3.08B。
          tone: positive
        - date: '2026'
          label: HSC 多城铺开
          detail: 全国复制进入增长叙事。
          tone: positive
