  topStrengths:
    - Tianjin 和 WHO 给这家中国私营数字医疗公司提供了少见的旗舰案例验证。
    - HSC 模式和 AI 驱动的诊疗流程，相比更简单的远程问诊入口，战略差异化更清楚。
    - 公开证据显示，公司已经接入有意义的医生、医院和会员规模，不只是概念平台。
  topRisks:
    - 最后可见的私募估值隐含倍数，明显高于中国上市数字医疗同业。
    - Tianjin 集中度、政策依赖和医保支付挂钩的经济模型，仍是定价前必须吃透的风险。
    - 股权结构、现金生成、留存和安全控制的公开披露仍不完整。
  unresolvedGaps:
    - Tianjin 以外城市级收入、利润率和会员集中度。
    - 股权结构中的优先权压力、流动性需求，以及按私募标记入场的真实经济账。
    - 新城市部署中，政府、医院和会员续约质量。
    - 足以支撑公开市场尽调的安全、隐私和模型治理文件。
