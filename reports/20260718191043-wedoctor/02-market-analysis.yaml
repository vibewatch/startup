  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: sam-gap
      missingEvidence: A reconciled SAM specific to China internet-hospital infrastructure, payer-sponsored chronic-disease management, and hospital cloud-pharmacy workflows.
      whyItMatters: The broad market is clearly large, but WeDoctor should not be valued against a catch-all digital-health TAM that includes categories it does not directly monetize.
      diligencePath: Build a bottom-up SAM from reimbursable chronic-disease populations, contracted institutions, and provider-software budgets by province.
      relatedQuestionRefs: [QM024, QM025]
      relatedTableRefs: [TM002]
    - type: missing-source
      severity: material
      topic: local-implementation-fragmentation
      missingEvidence: A province-by-province map of reimbursement rules, internet-hospital scope, and live operating approvals for WeDoctor-like services.
      whyItMatters: Central policy is supportive, but practical market access depends on how local governments and insurers implement the rules.
      diligencePath: Pull municipal and provincial implementation notices for WeDoctor’s priority geographies rather than relying only on central-level policy text.
      relatedQuestionRefs: [QM010, QM020]
      relatedTableRefs: [TM004]
    - type: private-evidence-only
      severity: material
      topic: market-penetration-quality
      missingEvidence: Repeat-usage, retention, and monetization denominators by channel for enterprise, payer, hospital, and consumer cohorts.
      whyItMatters: Large user or consultation counts do not by themselves prove durable market quality or economics for WeDoctor.
      diligencePath: Request cohort dashboards by city, payer type, and service line from management or the last IPO working group materials.
      relatedQuestionRefs: [QM015, QM016, QM017, QM022]
    - type: missing-source
      severity: material
      topic: tm003-segmentation-coverage
      missingEvidence: A precise public source set on insurer and employer spending mix inside China digital-health services.
      whyItMatters: Buyer and payer mapping is central to underwriting WeDoctor, but public disclosures are much richer on users than on budget ownership.
      diligencePath: Pull insurer presentations, employer-benefit case studies, and municipal budget disclosures for digital-health pilots.
      relatedQuestionRefs: [QM012, QM013]
      relatedTableRefs: [TM003]
