      - [Statista adoption lens, 'China mid-2025', '390M+ online medical service users', 'Mainstream usage scale', 'User adoption rather than revenue TAM', 'Does not translate directly into revenue per user or managed-care spend']
      - [Peer-revenue lens, 'China 2024-2025', 'JD Health RMB 58.16B; Alibaba Health RMB 27.03B; Ping An Health RMB 5.47B', 'All still growing', 'Listed peer revenue pool across pharmacy, services, and enterprise health', 'Peer revenue is not TAM but proves market depth']
    notes: The sizing spread is wide because the underlying market boundary changes materially from report to report.
    claimRefs: [CM003, CM004, CM005, CM006, CM007, CM016, CM017, CM018, CM033]
  - id: TM003
    title: Segment and buyer map
    columns: [Use case or submarket, Primary buyer, Primary user, Primary payer, Adoption trigger, Relevance to WeDoctor]
    rows:
      - [Internet-hospital follow-up care, Hospital or health system, Patient, Consumer or insurer, 'Policy permission plus physician workflow integration', high]
      - [Regional chronic-disease management, Local government or medical-insurance fund, Resident member, Public payer, 'Pressure to improve outcomes and control reimbursement spend', very-high]
      - [Hospital digitization and cloud pharmacy, Hospital and regional administrators, Doctors and pharmacists, Hospital budget or regional program, 'Need to connect formularies, prescriptions, and care coordination', very-high]
      - [Enterprise employee health, Employer or insurer, Employee, Enterprise budget or insurance, 'Absenteeism, health-benefit optimization, compliance', medium]
      - [Consumer online pharmacy and consultation, Consumer, Consumer, Consumer, 'Convenience, price, delivery, follow-up access', medium]
      - [Professional doctor network and content, Medical professionals or institutions, Doctors, Employer or institution, 'Clinical efficiency, education, data, and workflow support', medium]
    notes: WeDoctor spans multiple buyer and payer types, but the highest-strategic-value cells are the regional and provider-facing ones.
    claimRefs: [CM014, CM015, CM019, CM020, CM029, CM030, CM037]
  - id: TM004
    title: Growth drivers and constraints table
    columns: [Driver or constraint, Direction, Timing, Evidence, Why it matters, Diligence implication]
    rows:
      - ['Aging population and chronic disease burden', positive, ongoing, 'Market reports and policy documents', 'Makes longitudinal management models more valuable', 'Measure what share of WeDoctor demand is truly chronic-care driven']
      - ['Internet-hospital and reimbursement policy support', positive, ongoing, '2018 and 2020 central policies', 'Expands legal room for online follow-up, prescriptions, and reimbursement', 'Map exactly which services are reimbursable by locality']
      - ['Uneven offline medical resource distribution', positive, structural, 'Policy and market sources', 'Sustains demand for remote coordination and referral tools', 'Check whether WeDoctor is strongest in underserved or already-advanced regions']
      - ['AI integration and data tools', positive, medium term, 'GlobalData, MRF, WeDoctor coverage', 'Can improve productivity and standardization if integrated into clinical workflow', 'Separate real deployment from marketing claims']
      - ['Patient trust and motivation', negative, ongoing, 'Research and Markets distribution summary', 'Can slow conversion from interest to repeated use', 'Review repeat-usage and satisfaction denominators']
      - ['Sensitive-data compliance under PIPL and DSL', negative, ongoing, 'NPC law texts and 2018 policy obligations', 'Raises execution cost and can constrain cross-border or loose data reuse', 'Review data residency, consent, and model-training controls']
      - ['Local reimbursement and implementation fragmentation', negative, ongoing, 'Central policy sets direction but cities implement differently', 'National addressable market is not one homogeneous buyer pool', 'Map which cities have already operationalized WeDoctor-like services']
      - ['Hospital integration complexity', negative, ongoing, 'Peer filings and policy documents', 'Adoption depends on workflow, formulary, and physician alignment, not only app downloads', 'Test integration cycle times and renewal economics']
    notes: Several “constraints” are not market killers; they are the implementation bottlenecks that separate real platform operators from surface-level traffic businesses.
    claimRefs: [CM008, CM009, CM010, CM013, CM021, CM022, CM028, CM034, CM038]
figures:
  - id: FM001
    title: China digital-health sizing lens pyramid
    type: pyramid
    layout: standard
    summary: The broad market is huge, but WeDoctor’s practical SAM sits inside narrower provider, payer, and managed-care layers.
    data:
      nodes:
        - id: tam
          label: Broad digital-health / online-healthcare TAM
          detail: Research sources place China in the tens to hundreds of billions of dollars depending on boundary.
          tone: positive
        - id: sam
          label: Addressable service layers for WeDoctor
          detail: Internet hospitals, digital infrastructure, enterprise health, pharmacy coordination, and chronic-disease management.
          tone: positive
        - id: som
          label: Monetizable managed-care and provider contracts
          detail: The highest-value slice depends on local reimbursement, hospital integration, and payer proof.
          tone: warning
    claimRefs: [CM001, CM003, CM004, CM005, CM015, CM035]
  - id: FM002
    title: China digital-health market estimate range
    type: range
    layout: wide
    summary: Public estimates vary widely because the boundary changes from narrower digital healthcare to broader online healthcare.
    data:
      items:
        - label: Narrow lens
          low: 16.5
          high: 19.77
          unit: USD B
          detail: MRF 2024 market size and 2025 market size for a narrower digital-healthcare lens.
        - label: Mid lens
          low: 94.9
          high: 120.67
          unit: USD B
          detail: IMARC 2025 base and MRF 2035 distant outlook for broader digital-health categories.
        - label: Broad lens
          low: 359.9
          high: 583.68
          unit: USD B
          detail: IMARC 2034 and ResearchAndMarkets 2028 online-healthcare estimates.
    approximationNotes: The rows intentionally mix different study boundaries to show dispersion rather than pretend they are directly comparable.
    claimRefs: [CM003, CM004, CM005, CM033]
  - id: FM003
    title: Buyer and payer relationship map
    type: matrix
    layout: wide
    summary: WeDoctor’s most attractive market cells involve institutional buyers and public or enterprise payers rather than only consumers.
    data:
      columns:
        - label: Consumers
        - label: Employers
        - label: Hospitals
        - label: Public payers
        - label: Insurers
      rows:
        - label: Online consultation
          values: [medium, low, high, medium, medium]
        - label: Online pharmacy
          values: [high, low, medium, low, medium]
        - label: Hospital digitization
          values: [low, low, high, medium, low]
        - label: Population health management
          values: [low, medium, high, high, high]
        - label: Professional doctor tools
          values: [low, low, high, low, low]
    claimRefs: [CM014, CM015, CM020, CM029, CM030, CM037]
  - id: FM004
    title: Adoption funnel from policy to patient use
    type: flow
    layout: standard
    summary: Digital-health adoption in China requires policy permission and institution integration before patient usage can scale economically.
    data:
      nodes:
        - id: policy
          label: Policy permission
          detail: Central policies opened internet-hospital, reimbursement, and AI-health pathways.
          tone: positive
        - id: local
          label: Local implementation
          detail: Provinces and cities decide practical reimbursement and approval rules.
          tone: warning
        - id: hospital
          label: Hospital integration
          detail: Formularies, workflows, and provider systems must be integrated before scale is real.
          tone: warning
        - id: doctor
          label: Doctor participation
          detail: Physicians and pharmacists need to trust and regularly use the workflow.
          tone: warning
        - id: patient
          label: Patient engagement
          detail: Repeat usage and managed outcomes convert policy support into durable revenue.
          tone: positive
      edges:
        - from: policy
          to: local
        - from: local
          to: hospital
        - from: hospital
          to: doctor
        - from: doctor
          to: patient
    claimRefs: [CM008, CM010, CM014, CM022, CM034]
