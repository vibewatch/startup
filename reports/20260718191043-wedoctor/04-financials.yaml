      - [Capital raised for Tianjin model, 'About US$88M during 2020-2024', '2020-2024', medium, 'Indicates the capital intensity behind one flagship deployment', 'Separate parent equity, third-party financing, and any project funding']
      - [Planned IPO size, 'Earlier reporting cited US$400M-US$500M target', '2024-12', medium, 'Suggests the scale of external capital still sought', 'Confirm whether range remains live or was revised']
      - [Use of IPO proceeds, 'Expansion of partnerships, AI technologies and applications, service quality, management efficiency, working capital', '2024-12', high, 'Shows what management still says capital is needed for', 'Request detailed use-of-funds schedule']
      - [Cash on hand, null, low, 'No clean public balance-sheet cash figure retained from the 2024 filing', 'Cash determines runway and negotiation leverage', 'Request latest cash, restricted cash, and monthly burn']
      - [Debt facilities, null, low, 'No debt schedule recovered in retained public sources', 'Debt can alter runway and downside', 'Request debt, guarantees, and covenant schedule']
      - [Preference / dilution stack, null, low, 'Private-market overhang not visible in retained sources', 'Needed for valuation and IPO sensitivity', 'Request cap table by round and security type']
    notes: The company looks closer to profitability, but runway still cannot be assessed cleanly from public evidence alone.
    claimRefs: [CI027, CI028, CI029, CI030, CI031, CI032, CI033, CI034]
  - id: TI005
    title: Public financial gaps table
    columns: [Missing private metric, Impact on underwriting, What public evidence does show, Exact diligence path]
    rows:
      - [Gross margin by stream, high, 'AI assistance may improve economics, but stream-level margins are not public', 'Request gross profit by membership, pharmacy, platform, and offline services']
      - [City-level contract concentration, high, 'Tianjin is clearly the flagship and may dominate growth narrative', 'Request revenue by city and payer counterparty']
      - [Working-capital cycle, high, 'Cloud pharmacy and insurer-linked settlement could create receivable or inventory exposure', 'Request AR aging, payables, and inventory turns by stream']
      - [Implementation cycle and payback, high, 'Municipal deployments may take longer than software sales', 'Request sales cycle, implementation cost, and payback by city']
      - [Retention / renewal by cohort, high, 'HSC looks recurring but public renewal rates are missing', 'Request contract renewal and member persistence by cohort']
      - [Balance-sheet liquidity, high, 'No clean cash, debt, or restricted-cash data recovered', 'Request monthly cash bridge and 12-month runway assumptions']
    notes: The missing metrics are exactly the ones needed to move from a narrative of growth to an underwriting decision on quality and durability.
    claimRefs: [CI016, CI017, CI026, CI031, CI034, CI036]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    layout: wide
    summary: Public evidence shows WeDoctor’s monetization shifting from broad digital services toward capitation-backed health-management revenue.
    data:
      nodes:
        - id: population
          label: Covered population and contracted members
          detail: Residents, chronic-disease patients, enterprises, and digital users enter through HSC and platform relationships.
        - id: services
          label: Digital and in-person care workflow
          detail: Consultations, follow-up, prescriptions, cloud pharmacy, and AI-assisted health management generate service activity.
        - id: capitation
          label: Capitation and shared-savings layer
          detail: Health-management membership services monetize through payer-aligned contracts and insurer-cost control.
        - id: addons
          label: Value-added and ancillary services
          detail: Testing, report interpretation, home nursing, and broader service extensions expand wallet share.
        - id: platform
          label: Digital platform and corporate services
          detail: Digital healthcare, offline medical-center, and corporate membership services remain part of the mix.
    approximationNotes: This is a mechanism diagram rather than an audited segment bridge because the live filing PDF was not recovered.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006]
  - id: FI002
    title: Unit economics bridge
    type: flow
    layout: wide
    summary: The public unit-economics logic is labor- and system-intensive at the base, then improves through AI productivity and surplus capture.
    data:
      nodes:
        - id: staff
          label: Health managers + liaison staff + systems
          detail: Base delivery requires trained labor, AI modules, equipment, and coordination overhead.
        - id: risk
          label: Risk stratification and prescription surveillance
          detail: AI aims to improve efficiency, reduce inappropriate spend, and standardize follow-up.
        - id: outcomes
          label: Better utilization and medical-insurance outcomes
          detail: More care shifts to primary settings and preventable spend is reduced.
        - id: surplus
          label: Shared surplus and recurring membership revenue
          detail: WeDoctor captures part of the savings while centres retain the larger share.
        - id: upsell
          label: Higher-margin value-added services
          detail: Deeper member relationships create a base for add-on services over time.
    approximationNotes: Several links are mechanism-level because public sources do not disclose full gross-margin or cohort-profit data.
    claimRefs: [CI004, CI005, CI021, CI022, CI024, CI025]
  - id: FI003
    title: Financial estimate range
    type: range
    layout: standard
    summary: Public revenue evidence supports a broad but clearly upward trajectory.
    data:
      items:
        - label: 2023 revenue
          low: 1.863
          mid: 1.863
          high: 1.863
        - label: H1 2024 revenue
          low: 1.818
          mid: 1.818
          high: 1.82
        - label: H1 2025 revenue
          low: 3.08
          mid: 3.08
          high: 3.08
    approximationNotes: Values are RMB billions and mix annual and half-year periods intentionally to show trajectory, not to imply direct run-rate equivalence.
    claimRefs: [CI009, CI010, CI011, CI012]
  - id: FI004
    title: Capital intensity / cash-flow map
    type: matrix
    layout: wide
    summary: WeDoctor’s operating model looks more capital- and labor-intensive than a pure software platform, but less inventory-heavy than a retail-first pharmacy model.
    data:
      columns:
        - label: Gross-margin pressure
        - label: Working-capital exposure
        - label: Why it matters
      rows:
        - label: HSC membership services
          values:
            - Medium
            - Low to medium
            - Recurring revenue is attractive, but service delivery still relies on staff, AI systems, and implementation work.
        - label: Cloud pharmacy
          values:
            - Medium
            - Medium to high
            - Pharmacy coordination can create inventory and receivable exposure if scale widens.
        - label: Offline medical centers / hospitals
          values:
            - High
            - Medium
            - Physical sites and medical operations add labor and facility intensity.
        - label: Value-added services
          values:
            - Medium
            - Low
            - Can improve monetization but may still require fulfillment and care coordination.
    approximationNotes: Ratings are qualitative because no public stream-level margin or working-capital bridge was recovered.
    claimRefs: [CI005, CI019, CI020, CI024, CI026]
