schemaVersion: report-v2
artifact: financials
slug: wedoctor
runDate: '2026-07-18'
company:
  name: WeDoctor
chapter:
  number: 4
  title: Financials
  summary: >-
    WeDoctor’s public financial record points to a sharp model shift rather than a steady consumer-internet curve.
    Revenue from continuing operations rose from RMB 962 million in 2021 to RMB 1.863 billion in 2023, then to RMB
    1.818 billion in the first half of 2024 and RMB 3.08 billion in the first half of 2025, with health-management
    membership services becoming the dominant growth engine. The strongest positive is that capitation and value-based
    payment appear to have converted from policy theory into monetized recurring revenue. The weakest point is that cash,
    debt, realized margin, and full-company balance-sheet visibility are still far below listed-peer disclosure standards.
sections:
  - id: revenue-model-and-business-mix
    title: Revenue now follows managed-care logic more than marketplace logic
    body: >-
      The best current description of WeDoctor’s revenue model comes from prospectus-derived reporting and the 2026 HSC
      follow-up coverage. Those sources describe two top-level businesses: AI-powered healthcare services and a digital
      healthcare platform. The AI-powered side includes health-management membership services, cloud pharmacy, and
      value-added services delivered through the Health Service Community model. The platform side includes digital
      medical services, offline medical-center services, and corporate membership services. That distinction matters
      because the economic center of gravity has moved. Earlier digital-health models in China often relied on traffic,
      consultation conversion, or pharmacy distribution. WeDoctor’s faster-growing engine instead appears to be
      capitation-linked membership revenue that pays the company for managing population health and improving medical-
      insurance efficiency. WHO’s Tianjin case study reinforces the point: revenue inside the pilot came from shared
      savings under capitation plus value-added preventive services, not just from one-off app transactions. Financially,
      that means WeDoctor should be treated less like a pure consumer marketplace and more like an operating platform that
      earns recurring revenue when contracted populations and provider workflows stay inside its system.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007, CI008]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: growth-trajectory-and-revenue-quality
    title: Growth is real, but concentration inside HSC is rising fast
    body: >-
      The public revenue trajectory is strong. Prospectus-derived coverage says continuing-operations revenue was RMB
      962 million in 2021, RMB 1.368 billion in 2022, and RMB 1.863 billion in 2023. Reuters and VCBeat then reported
      first-half 2024 revenue of RMB 1.818 billion, more than double the prior-year period, while 36Kr reported first-
      half 2025 revenue of RMB 3.08 billion, up nearly 70% year on year. The bigger story is mix shift. VCBeat said
      health-management membership services reached RMB 1.032 billion in first-half 2024, already 56.8% of continuing-
      operations revenue, while 36Kr said first-half 2025 HSC membership revenue reached RMB 2.389 billion, far above
      cloud pharmacy revenue of RMB 450 million. That suggests WeDoctor has found a working growth engine, but it also
      suggests financial concentration is increasing around one model and perhaps one flagship geography. This is good if
      the HSC playbook replicates, and dangerous if Tianjin-type economics prove unique or politically difficult to copy.
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI014, CI015, CI016, CI017, CI018]
    tableRefs: [TI005]
    figureRefs: [FI003]
  - id: unit-economics-cost-structure-and-margin-proxies
    title: Public unit economics are partial, but the operating logic is visible
    body: >-
      WeDoctor does not publish a clean unit-economics dashboard, but several public proxies reveal the mechanics.
      WHO’s Tianjin paper says the capitation budget allocated 30% of generated surpluses to WeDoctor and 70% to the
      health centres, with hospitals keeping 100% of their own surpluses. The same paper says WeDoctor deployed more
      than 200 health managers, 90 liaison managers, AI systems, screening devices, and prescription-surveillance tools,
      which implies a labor-heavy and systems-heavy operating model rather than a high-margin software-only model. Mean
      annual compensation for a Tianjin health manager was reported at ¥70,000, while the company said one manager could
      eventually supervise about 2,000 people in 2024 and 2,600 people in 2025 with AI support. VCBeat’s segment
      commentary suggests the membership business is lower-margin at the base layer but creates a large pool for higher-
      margin value-added services later. Taken together, the evidence supports a business that can improve margin through
      AI-assisted labor productivity and claims control, but not one that should be underwritten with naive SaaS gross-
      margin assumptions.
    claimRefs: [CI019, CI020, CI021, CI022, CI023, CI024, CI025, CI026, CI027]
    tableRefs: [TI003]
    figureRefs: [FI002, FI004]
  - id: capital-adequacy-and-what-still-blocks-underwriting
    title: Profitability is approaching, but capital adequacy is still under-disclosed
    body: >-
      Public evidence implies improvement, not completion. VCBeat reported adjusted net loss from continuing operations
      falling from RMB 1.354 billion in 2021 to RMB 505 million in 2023 and about RMB 128 million in first-half 2024;
      Reuters cited essentially the same first-half 2024 adjusted-loss figure. WHO adds that WeDoctor raised about US$88
      million during 2020-2024 to support the Tianjin model through parent-company capital and external financing. The
      revived Hong Kong listing was expected by prior reporting to target roughly US$400 million to US$500 million, and
      Reuters said planned proceeds would fund partnership expansion, AI technology and applications, service quality,
      and working capital. What is still missing is the core balance-sheet view: cash on hand, debt facilities,
      receivables quality, contract liabilities, and the preference or dilution stack. That absence does not negate the
      operating progress, but it prevents a clean runway or solvency judgment. The right underwriting stance is that
      WeDoctor appears operationally closer to profitability, yet still financially opaque.
    claimRefs: [CI028, CI029, CI030, CI031, CI032, CI033, CI034, CI035, CI036]
    tableRefs: [TI004]
callouts:
  - calloutType: strength
    title: WeDoctor found a real revenue engine where many digital-health platforms stayed conceptual
    body: >-
      The strongest financial signal is not just topline growth; it is that capitation-linked health-management revenue
      became the majority of revenue in first-half 2024 and grew even faster in first-half 2025.
    claimRefs: [CI003, CI013, CI014, CI015, CI016]
  - calloutType: risk
    title: The same HSC concentration that powers growth can become a financial concentration risk
    body: >-
      Public evidence increasingly points to one operating model driving the majority of growth, while cash, debt,
      mature-city margins, and replication economics remain undisclosed.
    claimRefs: [CI014, CI015, CI017, CI031, CI034, CI036]
