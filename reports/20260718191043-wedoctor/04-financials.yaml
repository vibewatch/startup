  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: balance-sheet-liquidity-gap
      missingEvidence: Cash on hand, restricted cash, debt facilities, receivable aging, and contract liabilities for WeDoctor itself.
      whyItMatters: Public revenue growth is strong, but runway and solvency cannot be judged without balance-sheet liquidity.
      diligencePath: Request the latest balance sheet, 13-week cash flow, and debt schedule used for the revived IPO process.
      relatedQuestionRefs: [QI022, QI023, QI025]
      relatedTableRefs: [TI004, TI005]
    - type: private-evidence-only
      severity: material
      topic: stream-margin-gap
      missingEvidence: Gross margin, contribution margin, and working-capital profile by membership, cloud pharmacy, platform, and offline streams.
      whyItMatters: The business may look software-like in narrative, but labor, pharmacy, and physical-care components can change margin quality materially.
      diligencePath: Request a stream-level P&L and working-capital bridge for 2023, 2024, and first-half 2025.
      relatedQuestionRefs: [QI016, QI018]
      relatedTableRefs: [TI003, TI005]
    - type: private-evidence-only
      severity: material
      topic: deployment-payback-gap
      missingEvidence: Sales cycle, implementation cost, payback period, and renewal economics by city and by enterprise contract.
      whyItMatters: Replication economics determine whether Tianjin is a template or a one-off flagship.
      diligencePath: Request payback and renewal data for Tianjin, Wenzhou, Yinchuan, and one enterprise cohort.
      relatedQuestionRefs: [QI017, QI025]
      relatedTableRefs: [TI003, TI005]
    - type: conflicting-data
      severity: material
      topic: growth-normalization-gap
      missingEvidence: Fully comparable filed statements that reconcile annual and half-year revenue, AI-services share, and 2025 HSC revenue across media-derived sources.
      whyItMatters: Public evidence clearly shows rapid growth, but some of the newest 2025 numbers still come from media coverage rather than a filed interim report.
      diligencePath: Reconcile the next official interim or listing update against retained 2024-2026 reporting before issuing a precise valuation model.
      relatedQuestionRefs: [QI006, QI012, QI025]
      relatedTableRefs: [TI001, TI004]
