      - [IPO proceeds plan, 'Public equity financing', medium, 'Expansion, AI applications, service quality, working capital', 'Final raise size, price, and timing remain undisclosed', 'Reuters + TMTPost-derived reporting']
    notes: The monetization picture is visible at the model level but still not priced transparently enough for a clean public-comp-style benchmark.
    claimRefs: [CI003, CI005, CI006, CI020, CI030, CI033]
  - id: TI003
    title: Unit economics table
    columns: [Metric, Public value or null, Confidence, Why it matters, Diligence ask]
    rows:
      - [H1 2024 membership revenue share, '56.8% of continuing-operations revenue', high, 'Shows base-layer monetization now concentrates in managed-care contracts', 'Confirm full-year 2024 and 2025 share in filed statements']
      - [H1 2025 membership revenue share, 'Approx. 77.6% of total revenue (2.389B / 3.08B)', medium, 'Measures concentration around HSC engine', 'Confirm whether total revenue basis is consolidated and comparable']
      - [Capitation surplus split, '30% to WeDoctor / 70% to health centres', high, 'Core clue to value capture in the Tianjin model', 'Request exact contractual terms by city and disease cohort']
      - [Health manager annual compensation, '¥70,000 mean annual compensation', high, 'Useful labor-cost anchor for service delivery', 'Request loaded cost and turnover by region']
      - [Health manager coverage, 'Approx. 2,000 people with AI support in 2024; 2,600 in 2025', medium, 'Key labor-productivity proxy', 'Request by-risk-tier staffing ratios and supervision burden']
      - [Participating health centres, '266 in Tianjin; 238 with standardized screening infrastructure operationalized', high, 'Indicates deployment density and fixed-cost footprint', 'Request incremental cost to activate each additional centre']
      - [Mature-city margin, null, low, 'No public gross margin by stream or city-level EBITDA is disclosed', 'Request contribution-margin bridge for Tianjin and one newer city']
      - [Customer acquisition cost / payback, null, low, 'Institutional sales economics likely differ sharply from consumer-app models', 'Request implementation cycle, selling cost, and payback by deployment type']
    notes: WeDoctor supplies enough public signals to understand the mechanism, but not enough to calculate investor-grade cohort economics.
    claimRefs: [CI014, CI019, CI020, CI021, CI022, CI023, CI024, CI025, CI026]
  - id: TI004
    title: Capital adequacy table
    columns: [Item, Public value or status, Vintage, Confidence, Why it matters, Diligence ask]
    rows:
