    title: IPO revival confirms demand, but disclosure still lags listed-peer standards
    body: >-
      The December 2024 filing and ~$7 billion valuation references are credible, yet public evidence still leaves the
      exact funding stack, governance structure, and current denominator metrics partially unresolved.
