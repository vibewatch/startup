    title: Policy-aligned operating model is the core strategic differentiator
    body: >-
      The strongest positive signal is not just app scale; it is that WeDoctor appears to have built a monetizable model
      around capitation, chronic-disease management, and local-government healthcare reform rather than simple online
      traffic resale.
    claimRefs:
