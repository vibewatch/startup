  - id: capital-investors-and-ipo-context
    title: Capital formation, investors, and the revived Hong Kong IPO path
    body: >-
      The public funding story is directionally clear but numerically messy. Reuters-syndicated coverage confirms that
      WeDoctor submitted a new Hong Kong IPO application on December 31, 2024 after an earlier 2021 attempt had been
      derailed during Beijing’s crackdown on private-sector data handling, especially for businesses dealing with
      sensitive medical information. Those same reports say the new flotation was expected to target roughly $400 million
      to $500 million and that China Merchants Bank was the sole sponsor. The pre-IPO investor roster named in public
      reporting includes Tencent, Hillhouse, HongShan, AIA, Hermitage, CICCFH, and Qiming. Valuation references cluster
      around the same level: Premier Alternatives puts WeDoctor at $7.0 billion as of December 31, 2024, GetLatka says
      a 2022 financing valued the company at $7 billion, and Hurun’s 2025 China 500 ranking translated into roughly
      RMB 51 billion. Total funding is less clean. Premier Alternatives says $1.6 billion raised, GetLatka says $1.5
      billion, while Tracxn’s visible record shows only $894 million because it appears to stop at older disclosed rounds.
      That discrepancy does not invalidate unicorn status, but it does mean later valuation work should treat the exact
      historical capital stack as partially unresolved rather than fully settled.
    claimRefs:
      - CO022
      - CO023
      - CO024
      - CO025
      - CO026
      - CO027
      - CO028
      - CO029
      - CO030
      - CO038
    tableRefs:
      - TO003
    figureRefs:
      - FO003
  - id: scale-policy-fit-and-disclosure-caveats
    title: Operating scale, policy alignment, and what remains undisclosed
    body: >-
      The operating-scale evidence is strong enough to justify serious diligence. Reporting based on the 2024 filing
      says WeDoctor connected roughly 11,500 medical institutions and 318,000 physicians, operated six physical
      hospitals, and had already pushed its Tianjin health-service community to about 900,000 members by June 2024.
      Follow-on 2025 and 2026 reporting shows the same model scaling further: first-half 2025 revenue reached RMB 3.08
      billion, health-management membership revenue reached RMB 2.389 billion, Tianjin members surpassed 1.666 million,
      and the network inside four managed Tianjin regions had expanded to 44 primary institutions plus 11 secondary or
      higher hospitals. Those figures matter because they show WeDoctor is not just narrating policy alignment; it is
      monetizing a healthcare-delivery model built to fit the state’s internet-health, chronic-disease, and payment-
      reform agenda. The unresolved issue is disclosure quality. Public sources retrieved for this run do not give a
      clean board roster, ownership percentages, preference stack, cash position, or audited user-account denominator
      comparable to listed peers. The company therefore looks real and scaled, but still not fully transparent.
    claimRefs:
      - CO009
      - CO010
      - CO011
      - CO012
      - CO015
      - CO016
