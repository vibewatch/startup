company:
  name: WeDoctor
chapter:
  number: 1
  title: Company Overview
  summary: >-
    WeDoctor is a Hangzhou-based digital-health platform founded by Jerry Liao in 2010 that evolved from Guahao's
    appointment marketplace into a broader AI-enabled healthcare and health-management platform. Public evidence strongly
    supports the December 2024 HKEX filing, a valuation around $7 billion, and meaningful operating scale, but public
    disclosure still leaves funding decomposition, governance detail, and current user-account counts incomplete.
sections:
  - id: identity-and-history
    title: Identity, founding path, and why the company matters
    body: >-
      WeDoctor’s public record is unusually important because the company sits at the intersection of several Chinese
      policy arcs: online triage and appointment booking, internet hospitals, online prescription circulation, medical
      insurance settlement, and now AI-assisted health management. The business traces back to Guahao.com in 2010,
      initially focused on helping hospitals optimize registration and directing patients to appropriate doctors.
      Public milestone sources then show a sharp broadening of ambition: the 2015 rebrand to WeDoctor, the December
      2015 launch of Wuzhen Internet Hospital as China’s first internet hospital, and the 2017 launch of WeDoctor
      Cloud as digital infrastructure for hospitals and regional health systems. By the time of the December 2024 Hong
      Kong filing, the company was describing itself not merely as an online consultation marketplace but as a provider
      of AI-powered medical services plus a digital healthcare platform serving providers, payers, enterprises, and
      patients. That transition matters for later chapters because the underwriting question is no longer whether
      WeDoctor can route patients online, but whether it has built a durable system-level role inside China’s medical,
      insurance, and drug-delivery stack.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
      - CO016
      - CO017
    tableRefs:
      - TO001
      - TO004
    figureRefs:
      - FO001
  - id: business-model-and-platform-shift
    title: From internet hospital pioneer to AI-enabled health-service operator
    body: >-
      The strongest current business framing comes from reporting on the 2024 prospectus and 2025 follow-on coverage.
      Those sources say WeDoctor’s operating model is split between AI-powered medical services and a digital healthcare
      platform. The platform side includes digital consultations, follow-up visits, medication dispensing, corporate
      health offerings, and offline medical-center or hospital services. The faster-growing engine is the health-service
      community model built around capitation and value-based payment, where WeDoctor works with local governments,
      hospitals, insurers, and primary-care institutions to manage chronic-disease populations and share in outcome-
      aligned savings. The AI overlay is no longer a side narrative. Public sources tied to the filing say the company
      had already built a WeDoctor medical large model, secured multiple national AI algorithm filings, and accumulated
      tens of millions of de-identified clinical records. Later 2026 reporting goes further, describing five nationally
      filed algorithms, more than 70 licensed invention patents, and a human-machine operating model in which one health
      manager can supervise thousands of residents with AI support. The practical point is that WeDoctor is now selling
      a policy-compatible operating system for regional healthcare management rather than only a consumer app.
    claimRefs:
      - CO007
      - CO008
      - CO013
      - CO014
      - CO015
      - CO016
      - CO017
      - CO018
