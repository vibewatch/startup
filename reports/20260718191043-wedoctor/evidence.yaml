evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-gap
    missingEvidence: A current board roster, committee structure, and any public biographies for independent or non-founder directors.
    whyItMatters: >-
      Governance visibility affects control, oversight quality, IPO readiness, and the risk that a founder-driven
      narrative masks weak board discipline.
    diligencePath: >-
      Pull the live HKEX application proof if it resurfaces, or request the latest shareholder and board pack directly
      from management.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: funding-disclosure-gap
    missingEvidence: >-
      A reconciled round-by-round funding history showing exact dates, amounts, investors, and whether debt or
      structured capital is included.
    whyItMatters: >-
      Valuation and dilution analysis depend on the true capital stack; current public databases disagree by hundreds of
      millions of dollars.
    diligencePath: >-
      Reconcile management-provided cap-table history against archived financing announcements and any surviving
      prospectus schedules.
    relatedQuestionRefs:
      - QO017
      - QO025
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: denominator-metrics
    missingEvidence: >-
