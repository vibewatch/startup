      - [JD Health, strong, strong, moderate, moderate, moderate, strong]
      - [Alibaba Health, strong, strong, moderate, low-to-moderate, low, moderate]
      - [DXY, moderate, low, moderate, low, moderate, moderate]
      - [Chunyu Doctor, strong, low, low, low, low, low-to-moderate]
    notes: Capability grades are ordinal synthesis from retained public evidence rather than a published benchmark.
    claimRefs: [CP005, CP006, CP007, CP016, CP017, CP018, CP022, CP023, CP027, CP033]
  - id: TP003
    title: Pricing / packaging comparison
    columns: [Company, Contract model, Public pricing visibility, Included capabilities, Unknowns, Implication]
    rows:
      - [WeDoctor, 'Managed-care contracts, membership revenue, cloud pharmacy, corporate services', low, 'Population health management plus digital medical services', 'Realized pricing, renewal, and city-level economics are not public', 'Harder to benchmark but potentially more defensible if outcomes hold']
      - [Ping An Health, 'Membership, insurance-linked bundles, family doctor plans, corporate health programs', medium, 'Family doctor, senior care, employer plans, claim-settlement collaboration', 'Per-account realized pricing and margin by bundle', 'Shows how payer-linked packaging can scale with a financial parent']
      - [JD Health, 'Retail transactions, online hospital services, diagnostics, insurance-enabled purchases', low-to-medium, 'Drug fulfillment, online consultation, testing, offline nodes', 'Granular price ladders are mostly on live consumer surfaces', 'Very large top-line can still rely on commerce mechanics more than managed-care pricing']
      - [Alibaba Health, 'Direct pharmacy sales, platform commissions, memberships, digital-health services', medium, 'Cloud pharmacy, cloud hospital, direct-store membership, consultation', 'Service-level pricing and contribution margin by module', 'Broad monetization is visible, but value-based-care pricing is not the core story']
      - [DXY, 'Professional subscriptions, data / open-platform products, education, consumer health services', low, 'Medication Assistant, open platform, content, recruiting, consultation', 'Public package pricing for enterprise or data products is limited', 'Professional reach can monetize through data and workflow tools rather than care delivery']
      - [Chunyu Doctor, 'Quick-ask and specialist consultation flows, consumer-led transactions', medium, 'Fast Q&A, specialist access, disease pages, doctor marketplace', 'Enterprise and institutional economics are largely undisclosed', 'Consumer substitute can be easier to acquire but less defensible institutionally']
    notes: Public pricing visibility is often weaker than public product visibility across China digital-health peers; the key comparison is contract model, not a perfect price list.
    claimRefs: [CP014, CP015, CP017, CP018, CP024, CP025, CP028, CP034]
  - id: TP004
    title: Moat durability / competitive risk register
    columns: [Moat claim, Threat, Severity, Evidence, Likely transmission, Diligence ask]
    rows:
      - ['Municipal HSC operating model', 'City replication proves slower or costlier than Tianjin', high, 'WHO pilot evidence plus 2026 expansion reporting', 'Revenue concentration, slower growth, lower valuation multiple', 'Request city-by-city deployment, payback, and retained-savings economics']
      - ['Provider integration and AI workflow depth', 'Listed peers add similar AI layers on larger user bases', high, 'Ping An, JD, and Alibaba all disclosed AI workflow expansion', 'Moat compresses into feature parity', 'Test whether WeDoctor AI is embedded in contracted care flows rather than just interfaces']
      - ['Payer and local-government relationships', 'Policy or procurement shifts favor state-linked or larger listed peers', high, 'Public evidence shows insurer and employer reach at Ping An plus city partnerships elsewhere', 'WeDoctor loses distribution leverage', 'Review contract renewal terms and exclusivity at city level']
      - ['Doctor and institution network', 'DXY retains stronger doctor mindshare and data influence', medium, 'DXY official professional-user scale and open platform', 'Lower clinician adoption or weaker prescribing influence', 'Check active-doctor usage, not just contracted supply']
      - ['Consumer and pharmacy surface', 'JD or Alibaba outspend WeDoctor on traffic and fulfillment', high, 'JD and Alibaba filings show far larger revenue and user footprints', 'Higher acquisition cost and weaker consumer repeat usage', 'Separate consumer economics from HSC economics']
      - ['Operational complexity as a barrier', 'Complexity becomes a drag instead of a moat', high, 'WHO paper shows staffing, training, liaison, and equipment requirements', 'Margin pressure and scaling friction', 'Obtain mature-city contribution margin and deployment timeline data']
    notes: Severity reflects what would most directly impair WeDoctor’s ability to defend a premium narrative against better-capitalized peers.
    claimRefs: [CP019, CP020, CP030, CP031, CP032, CP035, CP036, CP037, CP038, CP039]
