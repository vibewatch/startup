    title: Competitive positioning map
    type: quadrant
    layout: standard
    summary: Ordinal map of suite breadth against institutional and payer leverage for WeDoctor’s most relevant peers.
    data:
      xAxis: Product and workflow breadth (1 = narrow point solution, 10 = broad integrated-health stack)
      yAxis: Institutional / payer leverage (1 = mostly consumer self-pay, 10 = deep insurer, employer, or public-system access)
      points:
        - label: WeDoctor
          x: 8
          'y': 8
          detail: Strong on provider-payer integration and managed-care workflows, but less transparent publicly.
        - label: Ping An Health
          x: 8
          'y': 9
          detail: Very strong insurer and employer linkage through the Ping An ecosystem.
        - label: JD Health
          x: 9
          'y': 6
          detail: Massive product and service breadth, but payer depth is less central than commerce scale.
        - label: Alibaba Health
          x: 8
          'y': 5
          detail: Broad commerce and cloud-health stack with weaker explicit public-payer positioning.
        - label: DXY
          x: 7
          'y': 4
          detail: Deep doctor-network leverage and data assets, but lower direct payer integration.
        - label: Chunyu Doctor
          x: 4
          'y': 2
          detail: Strong consumer consultation entry point with limited institutional depth.
    approximationNotes: Axes are analyst-derived ordinal scores synthesized from retained public evidence, not market-share measurements.
    claimRefs: [CP002, CP003, CP004, CP007, CP016, CP022, CP026, CP033]
