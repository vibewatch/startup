  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: realized-pricing-gap
      missingEvidence: WeDoctor’s city-level contract pricing, renewal terms, margin split, and churn by HSC deployment.
      whyItMatters: Competitive durability depends on whether WeDoctor’s institutional depth produces better economics than lighter consumer or commerce-led peers.
      diligencePath: Request cohort economics for Tianjin and the first three replication cities, including contract duration and gross-margin bridge.
      relatedQuestionRefs: [QP018, QP024]
      relatedTableRefs: [TP003, TP004]
    - type: missing-source
      severity: material
      topic: apples-to-apples-retention-gap
      missingEvidence: A public retention or renewal metric that allows direct comparison between WeDoctor and listed peers across employer, payer, or member cohorts.
      whyItMatters: Feature breadth and revenue scale do not by themselves prove competitive stickiness.
      diligencePath: Ask management for renewal rates by city, enterprise, and member cohort; compare against public B-end or membership retention disclosures where available.
      relatedQuestionRefs: [QP018, QP024]
      relatedTableRefs: [TP003]
    - type: private-evidence-only
      severity: material
      topic: active-doctor-usage-gap
      missingEvidence: Active monthly or quarterly doctor usage for WeDoctor versus merely connected or contracted doctor counts.
      whyItMatters: DXY’s professional-network strength only matters competitively if WeDoctor’s own doctor engagement is shallower than its network count implies.
      diligencePath: Request MAU or transaction-active physician metrics by workflow type and city.
      relatedQuestionRefs: [QP010, QP021]
      relatedTableRefs: [TP001, TP002]
    - type: missing-source
      severity: material
      topic: consumer-pricing-visibility-gap
      missingEvidence: Clean archived consumer pricing for JD Health, Alibaba Health, and Chunyu Doctor that can be compared on identical services and dates.
      whyItMatters: Public product packaging is visible, but direct price comparisons are unstable on live app surfaces and cannot be normalized confidently from the retained source set.
      diligencePath: Capture dated screenshots or product feeds for identical consultation and membership SKUs across the main competitors.
      relatedQuestionRefs: [QP018, QP024]
      relatedTableRefs: [TP003]
