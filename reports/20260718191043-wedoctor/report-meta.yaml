companyProfile:
  summary: >-
    WeDoctor is a Hangzhou-based digital-health company founded by Jerry Liao that evolved from the
    Guahao appointment platform into a broader internet-hospital, AI-health-management, and public-
    sector healthcare-operating platform. The strongest public proof sits in Tianjin, where WHO and
    later reporting describe a live chronic-disease management system integrated with community health
    centres, health managers, and payer-aligned workflows. By 2025 public reporting, WeDoctor was also
    positioning HSC as its core growth engine and carrying a widely cited private valuation around
    US$6.7 billion. The company looks strategically meaningful, but it remains a private, partially
    disclosed business whose public evidence still leaves concentration, valuation support, and control
    quality incompletely resolved.
  foundedDate: '2010-03-01'
  founders:
    - name: Jerry Liao
      role: Founder
      background: >-
        Founded Guahao / WeDoctor and remains the public architect of the company’s transition from
        appointment marketplace to internet-hospital and AI-enabled health-management platform.
      claimRefs: [CO003]
  foundingLocation: Hangzhou, China
  headquarters: Hangzhou, China
  productSummary: >-
    WeDoctor sells a multi-layer digital-health platform combining internet hospitals, the Health
    Service Community model, cloud pharmacy, cloud examination, AI physician / pharmacist / health-
    manager workflows, and regional operating systems for hospitals, governments, and insurers.
  customerFocus: >-
    Municipal governments, health commissions, healthcare-security bureaus, hospitals, community
    health centres, county hospitals, and enrolled patient or member populations, with the strongest
    current public proof concentrated in payer- and provider-linked city deployments.
  businessModel: >-
    Public evidence supports a mix of AI-powered healthcare services and a digital healthcare platform,
    with monetization increasingly centered on HSC health-management membership services, insurer-
    aligned chronic-care operations, and healthcare workflow infrastructure.
  stage: Late-stage private / pre-IPO
  fundingStatus: >-
    Public sources support a December 2024 Hong Kong listing filing process and a widely cited private
    valuation near US$6.7 billion, but public databases still disagree on lifetime capital raised and
    do not disclose a clean current cap-table or preference stack.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO031, CO032, CE001, CU001, CV011, CV012, CV021]
