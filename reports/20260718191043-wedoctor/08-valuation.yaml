      - [Base, 'Growth continues but public comp gravity, concentration, and disclosure limits dominate', 'Valuation should sit materially below last private mark absent new evidence', 'Premium compresses toward high-quality listed-peer band', medium-high]
      - [Bear, 'Tianjin remains exceptional, new cities scale slowly, and IPO or policy risk bites', 'Valuation could reset sharply toward low public-comp revenue multiples', 'Down-round or delayed-liquidity risk increases', medium]
    notes: Probability labels are qualitative because public evidence is insufficient for tight point estimates.
    claimRefs: [CV014, CV015, CV016, CV017, CV018, CV019, CV020]
  - id: TV004
    title: Comparable valuation table
    columns: [Comparable, Metric, Multiple or valuation, Status, Relevance, Limitation]
    rows:
      - [WeDoctor private mark, 'Private valuation', '≈US$6.7B', private, 'Direct current price anchor for the company', 'Private mark may include preference, strategic scarcity, and stale pricing']
      - [Ping An Health, 'Price-to-sales', '≈1.38x', public, 'Closest listed China internet-health platform with large-scale managed-service exposure', 'Different mix and listed-company maturity']
      - [JD Health, 'Price-to-sales', '≈1.40x', public, 'Large listed digital-health marketplace and service platform', 'Different commerce mix and potentially lower policy concentration']
      - [Alibaba Health, 'Price-to-sales', '≈2.45x', public, 'Large listed health platform with stronger ecosystem support', 'Different platform economics and parent-ecosystem advantages']
      - [WeDoctor implied forward sales at last mark, 'Valuation / annualized H1 2025 revenue', 'Roughly high-single-digit x sales', implied, 'Shows how much premium the private mark demands', 'Depends on annualization and FX assumptions']
    notes: The purpose is not false precision; it is to test whether public evidence supports paying a large premium to listed peers.
    enumerationScope:
      coverage: partial
      basis: This comp table focuses on the most relevant retained public and private anchors for entry discipline rather than every China health-tech company.
    claimRefs: [CV011, CV012, CV013, CV014, CV015, CV016]
  - id: TV005
    title: Thesis-break trigger table
    columns: [Trigger, Threshold, Transmission to thesis, Action implication]
    rows:
      - ['Concentration worse than expected', 'Tianjin remains dominant with no credible second flagship', 'Undermines replicability and multiple support', 'Require steep discount or pass']
      - ['Policy or reimbursement shock', 'Rule changes impair online care, insurer-linked services, or core data flows', 'Reduces durability of HSC economics', 'Re-underwrite immediately']
      - ['Weak disclosure or IPO slippage', 'Listing delays continue without better transparency', 'Raises liquidity and governance discount', 'Defer unless entry price resets']
      - ['Control weakness', 'Material privacy, security, or governance gap emerges', 'Hurts premium thesis and public-market readiness', 'Treat as thesis-breaker']
      - ['Peer multiple compression', 'Public comp band falls further', 'Makes high private multiple even harder to defend', 'Reset valuation expectations downward']
    notes: The current call changes more with price and disclosure than with top-line quality narrative alone.
    claimRefs: [CV025, CV026, CV027, CV028, CV029, CV030]
  - id: TV006
    title: Final diligence asks table
    columns: [Topic, Missing evidence, Why it matters, Owner or diligence path]
    rows:
      - ['City economics', 'Revenue, margin, and member mix by city', 'Required to test Tianjin concentration and replication', 'Finance + regional GM diligence']
      - ['Cap table and preference overhang', 'Preference stack, liquidation terms, secondary pricing context', 'Needed to convert valuation into real entry economics', 'Legal + CFO diligence']
      - ['Renewal quality', 'Government, hospital, and member retention by cohort', 'Needed to support premium multiple arguments', 'Revenue operations + FP&A diligence']
      - ['Cash generation', 'Cash, debt, working-capital profile, and funding runway', 'Needed to assess dilution and IPO pressure', 'Finance diligence']
      - ['Control environment', 'Security, privacy, and model-governance documentation', 'Needed for public-market readiness discount', 'CISO + GC diligence']
      - ['Post-Tianjin proof', 'Operating dashboards for Wenzhou, Yinchuan, Sanming, Guiyang, and other new markets', 'Needed to justify strategic premium', 'Regional operating review']
    notes: These are the variables most likely to change the recommendation.
    claimRefs: [CV031, CV032, CV033, CV034, CV035, CV036, CV037, CV038, CV039, CV040]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: The recommendation follows a logic chain from real scale and growth into concentration, opacity, and entry price discipline.
    data:
      nodes:
        - id: proof
          label: Real platform proof
          detail: Tianjin, HSC, provider connectivity, and 2025 growth improve credibility.
        - id: comps
          label: Public comp gravity
          detail: Listed peers imply materially lower sales multiples than the last private mark.
        - id: discount
          label: Opacity and concentration
          detail: Private-company disclosure and Tianjin dependence justify a discount.
        - id: rec
          label: Recommendation
          detail: Track or research-more at current mark; require better proof or lower price.
      edges:
        - {from: proof, to: comps, label: does not override}
        - {from: comps, to: discount, label: reinforces}
        - {from: discount, to: rec, label: drives}
    approximationNotes: null
    claimRefs: [CV001, CV004, CV011, CV021, CV022, CV023]
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: The biggest swing factors are public comp compression, Tianjin concentration, and proof of superior economics.
    data:
      items:
        - label: Multi-city HSC replication proven
          value: 2
        - label: Margin and cash conversion disclosed strong
          value: 2
        - label: Tianjin concentration remains dominant
          value: -2
        - label: Public comp compression dominates
          value: -3
    approximationNotes: Values are directional valuation-impact scores in US$ billions relative to the current private mark.
    claimRefs: [CV014, CV017, CV018, CV023, CV025, CV033]
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: Public evidence supports a wide valuation range that sits well below the last private mark in the base case.
    data:
      items:
        - label: Bear
          low: 1.0
          mid: 1.4
          high: 2.0
        - label: Base
          low: 2.0
          mid: 3.0
          high: 4.0
        - label: Bull
          low: 4.0
          mid: 5.5
          high: 7.0
    approximationNotes: Ranges are rough enterprise-value bands in US$ billions based on peer-multiple logic plus scenario assumptions; they are not a DCF.
    claimRefs: [CV014, CV015, CV016, CV017, CV018, CV019, CV020]
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: WeDoctor scores strongly on platform reality and strategic positioning, but poorly on current entry attractiveness and disclosure quality.
    data:
      items:
        - label: Platform reality
          value: 8
        - label: Growth narrative
          value: 8
        - label: Strategic uniqueness
          value: 7
        - label: Disclosure quality
          value: 3
        - label: Concentration risk
          value: 4
        - label: Current valuation attractiveness
          value: 2
    approximationNotes: Scores are ordinal 0-10 diligence judgments from retained evidence, not management guidance.
    claimRefs: [CV002, CV004, CV007, CV023, CV024, CV032]
