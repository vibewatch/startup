      - ['Public comps already imply much lower revenue multiples than the last private mark', 'A large step-up in disclosure and profitability could narrow the gap']
      - ['Private-company opacity and policy dependence justify a discount, not a premium, absent better proof', 'Listed-equivalent disclosure would reduce the discount']
    notes: The thesis is company-quality positive and price-disciplined at the same time.
    claimRefs: [CV001, CV003, CV006, CV008, CV009, CV010]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation or return logic, Key risks, Probability signal]
    rows:
