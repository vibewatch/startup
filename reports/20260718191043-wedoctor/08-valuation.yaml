company:
  name: WeDoctor
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports that WeDoctor built a real and potentially valuable digital-health platform, but it does not
    support paying the last widely cited private valuation mark with high confidence. Using retained public information,
    the implied revenue multiple at a roughly US$6.7 billion valuation appears far above listed China digital-health peers
    such as Ping An Health, JD Health, and Alibaba Health. The growth story, Tianjin flagship proof, and AI narrative all
    matter, but the company also carries much higher opacity, concentration risk, and policy dependence than public comps.
    The disciplined call is therefore price-sensitive: track or research more at the last private mark, and only upgrade if
    disclosure improves materially or entry valuation resets much closer to public-comparable logic.
sections:
  - id: thesis-and-anti-thesis
    title: WeDoctor has real scale and strategic assets, but the anti-thesis is that public evidence does not justify a premium multiple this large
    body: >-
      The pro-thesis is straightforward. WeDoctor appears to have built one of China’s deepest digital-health operating
      systems, with real infrastructure in Tianjin, broad provider connectivity, a growing HSC revenue engine, and
      institutional data and workflow assets that are difficult to reproduce. The 2025 growth narrative is strong, and the
      company arguably deserves to trade above the weakest public peers if the HSC model truly compounds across cities.
      The anti-thesis is more important for valuation. Public comps already exist for adjacent internet-health leaders, and
      those peers trade at far lower revenue multiples despite stronger disclosure, listed-company discipline, and broader
      investor familiarity. At the retained private mark, WeDoctor looks priced as if Tianjin-style economics will scale
      nationally and margins will expand materially, yet the public evidence still leaves major gaps on concentration,
      renewal, cash generation, and city-by-city unit economics. That combination supports respect for company quality but
      skepticism about current price. Investors should treat valuation upside as earned, not assumed.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV008, CV009, CV010]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: comparable-logic-and-scenarios
    title: Public comparable math points to a large discount versus the last private mark unless WeDoctor proves much better growth and margins than listed peers
    body: >-
      Retained sources place WeDoctor’s latest widely cited valuation near US$6.7 billion and recent revenue around RMB 5–6
      billion historically, with H1 2025 revenue of RMB 3.08 billion. Even allowing for rapid growth, that implies a
      revenue multiple well above the roughly 1.4x sales range cited for JD Health and Ping An Health and the roughly 2.5x
      range cited for Alibaba Health. That premium is hard to justify from public evidence alone because WeDoctor is still
      private, more opaque, and more concentrated in flagship public-sector deployments. A bull case exists if HSC becomes a
      nationally replicable, high-margin managed-care platform and if public-market conditions reward that uniqueness. But a
      base case should still anchor to public comp compression, governance opacity, and execution risk. The valuation
      framework therefore needs scenarios, not a single point estimate. Public evidence is useful enough for direction, but
      not precise enough for a tight target price.
    claimRefs: [CV011, CV012, CV013, CV014, CV015, CV016, CV017, CV018, CV019, CV020]
    tableRefs: [TV003, TV004]
    figureRefs: [FV002, FV003]
  - id: recommendation-and-entry-discipline
    title: The right recommendation is track or research-more at the last mark, with clear entry discipline and downside triggers
    body: >-
      The evidence-supported recommendation is not “buy” at the last private mark. It is track or research-more. If an
      investor were offered entry at a valuation that assumes WeDoctor deserves a several-turn premium to listed peers, the
      burden of proof should be extremely high. That proof would need to show not merely faster growth, but also superior
      margins, lower churn, multi-city replication, and manageable policy risk. Without that, the better stance is to wait
      for either improved disclosure or a more attractive price. A practical entry framework would require a very large
      discount to the last known private mark or, alternatively, hard evidence that HSC economics and cash conversion are so
      superior that listed-peer multiples are the wrong anchor. Today the second proposition is plausible, but not yet
      publicly demonstrated. That is why entry discipline has to be framed as a range and a diligence condition, not a
      confident fair-value claim.
    claimRefs: [CV021, CV022, CV023, CV024, CV025, CV026, CV027, CV028, CV029, CV030]
    tableRefs: [TV005]
    figureRefs: [FV004]
  - id: final-diligence-and-thesis-breakers
    title: The remaining work is to prove whether WeDoctor deserves a strategic premium or a private-company discount
    body: >-
      Final diligence should focus on the handful of variables that would actually move the call. First is geography-level
      concentration: how much of revenue, margin, and member growth comes from Tianjin versus newer cities? Second is cash
      and cap-table reality: what preference overhang, liquidity needs, and listing-timeline pressure sit behind the mark?
      Third is renewal quality: do hospitals, governments, and members stay and expand, or is growth still mostly new-city
      rollout? Fourth is control quality: are privacy, security, and clinical-governance systems strong enough for public
      markets? If answers on those points are good, WeDoctor could deserve a higher-than-peer multiple. If not, the right
      action is to demand a much lower price or stay out. The thesis breaks if concentration, policy dependence, or control
      weakness turn out to be materially worse than the growth narrative implies. In valuation terms, uncertainty still
      deserves a discount rate and a multiple discount.
    claimRefs: [CV031, CV032, CV033, CV034, CV035, CV036, CV037, CV038, CV039, CV040]
    tableRefs: [TV006]
