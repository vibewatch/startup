slug: wedoctor
runDate: '2026-07-18'
company:
  name: WeDoctor
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    WeDoctor’s product is no longer just a patient app. The retained evidence supports a layered system made up of
    internet-hospital infrastructure, the Four Clouds operating platform, a four-agent AI stack, and the Health Service
    Community model that ties hospitals, insurers, governments, and residents into one workflow. The strongest technical
    proof is not marketing copy but a combination of WHO’s Tianjin case study, CAC algorithm-filing coverage, CMB
    benchmark results, and city-level deployment evidence. The main weakness is that developer-facing surface area is
    minimal: there are no public repositories or clear public API docs, so outside practitioners can verify outcomes more
    easily than code-level implementation.
sections:
  - id: product-scope-and-modules
    title: WeDoctor delivers a multi-layer healthcare operating system, not one SKU
    body: >-
      The product surface breaks into several layers that map to different buyers and workflows. At the top level,
      prospectus-derived reporting says WeDoctor’s business spans AI-powered healthcare services and a digital healthcare
      platform. Under that umbrella, the practical product modules are clearer: internet-hospital services, the Health
      Service Community model, cloud pharmacy, cloud examination, digital management tools for hospitals and regions,
      AI-assisted clinical and administrative agents, and physical or AI-enabled hospitals that anchor the online layer in
      licensed medical institutions. The product is therefore best understood as an operating system for “medical care +
      insurance + pharmaceuticals” linkage rather than as a single consumer application. This matters because each module
      reinforces the others. Internet-hospital access creates a patient and doctor workflow. The Four Clouds platform ties
      data, pharmacy, examinations, and coordination together. AI agents automate diagnosis support, medication review,
      follow-up, and cost-control functions. The HSC layer provides the contractual and payment mechanism that turns the
      technology stack into recurring revenue and city-level operating leverage.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE007, CE008]
    tableRefs: [TE001, TE002]
    figureRefs: [FE001]
  - id: architecture-and-operating-workflow
    title: Architecture is defined by the Four Clouds, AI agents, and licensed care nodes
    body: >-
      The deepest architecture description comes from WHO and VCBeat. In Tianjin, WeDoctor built a health-management
      platform integrated with health-centre infrastructure and powered by a general-purpose large language model refined
      for medical tasks. WHO describes how the platform ingests structured clinical data, generates diagnostic hypotheses,
      prioritizes examinations, triggers referrals, reviews prescriptions, classifies patients into risk tiers, and assigns
      follow-up cadence. VCBeat adds the broader architectural vocabulary: Four Clouds—cloud management, cloud services,
      cloud pharmacy, and cloud examination—plus AI Physician, AI Pharmacist, AI Health Manager, and AI Intelligent
      Control. The Shanghai AI Hospital extends that logic into a licensed physical institution with pre-consultation AI
      screening, AI physician and pharmacist workflows, post-consultation health management, and medical-insurance smart
      control. The architecture is not generic enterprise software. It is a vertically integrated clinical workflow that
      depends on real-world care settings, health-manager labor, insurer rules, prescription logic, and direct links to
      hospitals and primary care institutions.
    claimRefs: [CE009, CE010, CE011, CE012, CE013, CE014, CE015, CE016, CE017, CE018]
    tableRefs: [TE003]
    figureRefs: [FE002, FE003]
  - id: differentiation-data-and-dependencies
    title: The moat comes from data, workflows, and institutional dependencies together
    body: >-
      WeDoctor’s differentiation claim rests on three mutually reinforcing pieces. First is applied data and benchmark
      performance. VCBeat and Longport say the WeDoctor medical large model ranked first on CMB at 91.71 and trained on
      hundreds of millions of dialogue and case records plus large institutional datasets. Second is deployment depth.
      WHO does not just describe a demo model; it documents an operating environment spanning 266 Tianjin community
      health centres, standardized screening infrastructure, health managers, and AI-guided prescription logic. Third is
      institutional partnering. The company’s AI stack depends on Zhejiang University’s Ruiyi AI Research Center,
      provincial lab partnerships, Tencent collaboration, and local-government or hospital agreements in Tianjin, Sanming,
      Wenzhou, Yinchuan, and elsewhere. That said, these same dependencies create risk. There is almost no public
      developer surface, no open-source signal from the official GitHub organization, and limited public technical
      documentation beyond partner or media descriptions. The product can therefore be observed in operation more easily
      than reverse-engineered from public code or API surfaces.
    claimRefs: [CE019, CE020, CE021, CE022, CE023, CE024, CE025, CE026, CE027, CE028]
    tableRefs: [TE004, TE005]
    figureRefs: [FE004]
  - id: trust-safety-and-compliance-controls
    title: Trust controls are visible in algorithm filings and workflow guardrails, but not yet fully auditable
    body: >-
      In a healthcare setting, technical capability matters less without compliance and workflow trust. The strongest
      visible control signals are official algorithm filings and real-world safety workflows. VCBeat’s CAC-filing
      coverage says WeDoctor secured national algorithm registration for multiple medical models, while WHO describes AI
      prescription review that checks guidelines, adverse reactions, inventory, formulary availability, price, and
      insurer rules before approving, flagging, or escalating a prescription. Public reporting also says Shanghai AI
      Hospital holds an internet-hospital license and medical-insurance designation, and the company’s HSC deployments are
      built under formal local-government arrangements. China’s PIPL, Data Security Law, and 2018 Internet Plus
      Healthcare rules create the legal envelope for sensitive-data handling, internet-hospital operation, and AI service
      use. The open question is auditability. Public sources are strong on control design and regulatory direction, but
      thin on MLPS certification level, breach history, model governance artifacts, and independent security assessment.
      For an investor, the implication is that trust architecture looks serious, but not yet fully inspectable.
    claimRefs: [CE029, CE030, CE031, CE032, CE033, CE034, CE035, CE036]
callouts:
  - calloutType: strength
    title: The product looks most credible where software is embedded in licensed care and payment workflows
    body: >-
      WeDoctor’s technical story is strongest not at the model-demo layer but where AI agents, cloud infrastructure,
      hospitals, and health-insurance processes visibly operate together in Tianjin and newer city deployments.
    claimRefs: [CE010, CE012, CE013, CE016, CE021, CE022]
  - calloutType: risk
    title: Public technical observability is weaker than public deployment observability
    body: >-
      Outside analysts can verify city partnerships, benchmark scores, and care workflows, but they cannot inspect a rich
      public code, API, or security-documentation surface.
    claimRefs: [CE024, CE025, CE026, CE033, CE036]
