      - [Prescription review, 'Manual review is slower and less standardized', 'AI Pharmacist + formulary and insurer checks', 'Higher compliance and lower inappropriate-spend risk', 'Independent national error-rate data is limited']
      - [Primary-care diagnostic support, 'Grassroots clinicians lack specialist support', 'AI Physician differential diagnosis and referral triggers', 'Improves plan quality and test prioritization', 'Performance by disease and site is not fully public']
      - [Regional health coordination, 'Medical, pharmacy, insurance, and data systems are fragmented', 'Four Clouds + Three-Medical Linkage platform', 'Creates integrated operating view and payment coordination', 'Integration cycle time by city is not disclosed']
      - [County-hospital specialty uplift, 'County hospitals lack specialty depth and expert access', 'Wuzhen internet-hospital platform and expert networks', 'County partners can add specialty capacity faster', 'Named hospital economics are mostly anecdotal']
      - [Population-health contracting, 'Local governments need cost control without lowering care quality', 'HSC capitation and outcome management', 'Surplus-sharing and medical-insurance savings', 'Depends on policy support and data access']
    notes: Use cases are defined in workflow terms because buyers are hospitals, governments, and insurers as much as patients.
