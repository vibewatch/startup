      - [Cloud services, 'Coordinates online and offline medical and health services', 'Institutional workflow adoption', 'Workflow fragmentation can reduce usage']
      - [Cloud pharmacy, 'Medication supply, formulary alignment, prescription workflow', 'Pharmacy networks, insurer rules, inventory logic', 'Working-capital and compliance complexity']
      - [Cloud examination, 'Shared diagnostics and screening infrastructure', 'Devices, teleradiology, image flows', 'Equipment rollout and quality assurance burden']
