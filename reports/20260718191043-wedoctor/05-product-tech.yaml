      - [Cloud examination, Primary-care institutions, live, 'Standardized screening and shared diagnostics improve grassroots care quality', 'Need utilization and reimbursement metrics']
      - [AI hospital, Hospitals and patients, early-scale, 'Extends full-stack AI workflow into physical licensed institutions', 'Need proof across more than one flagship site']
      - [Digital platform and corporate services, Patients and enterprises, live, 'Broader traffic and service surface around core managed-care engine', 'Need exact module-level revenue and adoption']
    notes: The product is best read as a portfolio of mutually reinforcing care and workflow assets rather than a single app.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006]
