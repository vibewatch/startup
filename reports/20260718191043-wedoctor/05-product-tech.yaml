  evidenceGaps:
    - type: missing-source
      severity: material
      topic: public-security-pack
      missingEvidence: A public trust center or equivalent pack covering MLPS classification, penetration testing, security incidents, model-governance policy, and third-party audits.
      whyItMatters: Healthcare AI systems need more than benchmark results; they need inspectable governance and security proof.
      diligencePath: Request the latest security, privacy, and model-governance documentation used for government and hospital procurement.
      relatedQuestionRefs: [QE018, QE024]
      relatedTableRefs: [TE004]
    - type: private-evidence-only
      severity: material
      topic: api-and-dev-surface-gap
      missingEvidence: Official API documentation, SDKs, release notes, or public developer changelog for external integration.
      whyItMatters: Public integration surface would strengthen confidence that the platform is productized rather than custom-project heavy.
      diligencePath: Request customer-facing API docs, integration architecture, and implementation playbooks.
      relatedQuestionRefs: [QE019, QE020]
      relatedTableRefs: [TE003, TE005]
    - type: conflicting-data
      severity: material
      topic: data-scope-reconciliation
      missingEvidence: A reconciled explanation of how 46 million de-identified institutional records relate to 400 million dialogues and 200 million cases.
      whyItMatters: The moat claim partly depends on what data is proprietary, de-identified, and actually used in model development.
      diligencePath: Request a data taxonomy distinguishing platform interactions, institutional records, and model-training subsets.
      relatedQuestionRefs: [QE009, QE023]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: site-level-maturity-gap
      missingEvidence: Independent performance and adoption data for AI hospitals and HSC deployments outside Tianjin.
      whyItMatters: The platform may be real in one flagship environment yet less mature elsewhere.
      diligencePath: Request operating dashboards for Shanghai, Wenzhou, Yinchuan, and Sanming deployments plus one county-hospital cohort.
      relatedQuestionRefs: [QE012, QE015, QE021]
      relatedTableRefs: [TE005]
