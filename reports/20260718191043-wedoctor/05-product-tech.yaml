figures:
  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: WeDoctor’s public product stack runs from licensed care entry points through cloud infrastructure and AI control layers.
    data:
      layers:
        - label: Care-entry layer
          detail: Internet hospitals, AI hospitals, physical sites, and patient-facing service workflows anchor the system in licensed care.
        - label: Service orchestration layer
          detail: Health Service Community contracts and regional operating workflows coordinate providers, payers, and residents.
        - label: Four Clouds platform
          detail: Cloud management, cloud services, cloud pharmacy, and cloud examination integrate operational data and service delivery.
        - label: AI agent layer
          detail: AI Physician, AI Pharmacist, AI Health Manager, and AI Intelligent Control automate clinical and administrative tasks.
        - label: Data and governance layer
          detail: Medical LLM training data, university partnerships, benchmark feedback, and regulatory filings reinforce the core system.
    approximationNotes: Structured from WHO, VCBeat, and Longport evidence rather than from one official architecture diagram.
    claimRefs: [CE001, CE003, CE009, CE010, CE011, CE019, CE020]
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: The operating flow links resident intake, clinical support, pharmacy logic, follow-up, and payer control.
    data:
      nodes:
        - id: intake
          label: Resident or patient enters via hospital, clinic, or HSC enrolment
          detail: Entry can happen through internet-hospital use, chronic-disease contracting, or local program activation.
        - id: assess
          label: Clinical data captured and risk assessed
          detail: Structured patient information feeds AI-supported evaluation and follow-up planning.
        - id: treat
          label: Diagnosis support and prescription workflow
          detail: AI Physician and AI Pharmacist support clinicians and medication review.
        - id: manage
          label: Health manager follow-up and intervention
          detail: Risk-tier cadence, messaging, education, and care-plan refinement occur over time.
        - id: pay
          label: Insurer or government cost-control and settlement logic
          detail: Shared-savings, capitation, and claims-control outcomes tie the workflow to monetization.
    approximationNotes: Workflow is generalized from Tianjin and related deployment evidence.
    claimRefs: [CE012, CE013, CE014, CE015, CE016, CE029, CE030]
  - id: FE003
    title: Critical dependency map
    type: dag
    layout: wide
    summary: The product depends on institutional, technical, and regulatory nodes working together.
    data:
      nodes:
        - id: gov
          label: Local governments and health commissions
        - id: payer
          label: Medical-insurance bureaus and payer rules
        - id: provider
          label: Hospitals and community health centres
        - id: zju
          label: Zhejiang University / Ruiyi AI Research Center
        - id: tencent
          label: Tencent collaboration and broader ecosystem support
        - id: model
          label: WeDoctor medical LLM and AI agents
        - id: ops
          label: Four Clouds + HSC operating system
        - id: patient
          label: Patients and managed residents
      edges:
        - from: gov
          to: ops
          label: authorizes and co-builds
        - from: payer
          to: ops
          label: defines payment logic
        - from: provider
          to: ops
          label: supplies care workflow
        - from: zju
          to: model
          label: contributes research and training
        - from: tencent
          to: model
          label: accelerates AI ecosystem
        - from: model
          to: ops
          label: powers automation and support
        - from: ops
          to: patient
          label: delivers care and follow-up
    approximationNotes: Dependencies are public and material, but contract depth and commercial exclusivity are still not fully disclosed.
    claimRefs: [CE017, CE021, CE022, CE023, CE024, CE027, CE031]
