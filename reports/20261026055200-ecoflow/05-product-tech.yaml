company:
  name: EcoFlow
chapter:
  number: 5
  title: Product & Technology
  summary: EcoFlow's available product evidence describes a broad portable-to-home energy portfolio, with unusually detailed manufacturer specifications for the DELTA Pro 3 but limited independent performance, reliability, and software-security validation. Residential integration adds certification, installation, and service dependencies, while a reported DELTA Max 2000 recall makes SKU-level safety and remediation evidence material.
sections:
  - id: portfolio-and-user-jobs
    title: Portfolio and user jobs
    body: >-
      Available sources describe EcoFlow across portable stations, solar generation,
      RV systems, and residential backup. A June 2026 reviewer groups RIVER around
      portability, DELTA around heavier-duty use, and DELTA Pro around home backup;
      Baike similarly lists portable stations, solar equipment, and smart-home storage
      while attributing X-Stream and X-Boost technologies to the brand. These are
      third-party descriptions, not a verified census of current SKUs or independent
      tests. The strongest product-level evidence in this pool is EcoFlow's own US
      DELTA Pro 3 page, which gives detailed capacity, input, output, and compatibility
      specifications. Treat those as manufacturer ratings rather than measured
      operating results. [CE001, CE002, CE003, CE016]
    claimRefs: [CE001, CE002, CE003]
    tableRefs: [TE001]
  - id: system-architecture-and-deployment
    title: System architecture and deployment
    body: >-
      The DELTA Pro 3 is presented as a rechargeable LFP power station that combines
      AC and solar inputs, an inverter and multiple AC/DC outputs, and optional
      batteries and home-transfer equipment. EcoFlow lists both a 10 ms unit UPS
      specification and a separate 20 ms Smart Home Panel 2 switchover claim; these
      describe different configurations and should not be collapsed into one
      performance figure. The listing also distinguishes an IP65-rated battery pack
      from an IP20 main unit. For RVs, Campervan HQ describes a separate Power Kits
      architecture with a Power Hub, console, distribution panel, and batteries.
      Connectivity and accessory compatibility imply ecosystem dependencies, but the
      assigned sources do not establish local-control options, cloud dependence, or
      software support duration. [CE004, CE005, CE006, CE007, CE008]
    claimRefs: [CE004, CE005, CE006, CE007, CE008]
    tableRefs: [TE002, TE003]
    figureRefs: [FE001]
  - id: residential-scale-and-differentiation
    title: Residential scale and differentiation
    body: >-
      EcoFlow's differentiating proposition in this evidence set is the attempt to
      extend portable storage into home and RV workflows through modular batteries,
      solar charging, transfer equipment, and app-connected controls. KrASIA's
      September 2025 report describes home systems as combining battery packs,
      inverters, battery-management systems, and energy-management systems; it also
      says certification, logistics, installation, and after-sales support raise the
      bar for new entrants. The same article reports a portable-storage price war
      and few fundamental device breakthroughs, framing home storage as a growth
      direction rather than proof of EcoFlow's technical advantage. These are market
      observations, not a like-for-like benchmark of EcoFlow against competitors.
      [CE009, CE010, CE011]
    claimRefs: [CE009, CE010, CE011]
  - id: safety-reliability-and-evidence-limits
    title: Safety, reliability, and evidence limits
    body: >-
      Safety evidence is specific but incomplete. A November 2025 PV Magazine USA
      reprint of ESS News reports that the CPSC had received six fire reports tied
      to about 25,030 DELTA Max 2000 Model EFD310 units, with property damage above
      $850,000. A later YesPress account says the recall response included firmware
      repair, but the assigned official CPSC text contains only general recall-law
      language and no product-specific notice or remediation readback. The reported
      incident count is not a population failure rate, and the firmware claim is not
      independently verified here. This pool also lacks product-family warranty
      outcomes, failure denominators, test reports, software-security assessments,
      and evidence that any repair program is complete. [CE012, CE013, CE014, CE015]
    claimRefs: [CE012, CE013, CE014, CE015]
