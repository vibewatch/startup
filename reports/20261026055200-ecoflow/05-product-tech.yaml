      - ["Battery and protection", "LFP storage with a manufacturer-rated 4,000-cycle-to-80% figure and battery-pack IP65 rating", "Battery-management controls, temperature limits, compatible expansion batteries", "Cycle life is a controlled-condition rating; the main unit is separately rated IP20"]
      - ["Power conversion and outputs", "Provides AC and DC outputs, including 120/240 V modes and 4,000 W continuous AC rating", "Load demand, inverter limits, thermal management, and configuration", "No independent runtime or sustained-load test is present"]
      - ["Home integration and monitoring", "Connects with Smart Home Panel 2 and exposes Wi-Fi, Bluetooth, and CAN connectivity", "Compatible EcoFlow accessories, firmware versions, and qualified installation", "Security controls, cloud/local control behavior, update policy, and support lifecycle are not documented here"]
    notes: "This is a manufacturer-described product architecture, supplemented by the assigned reporting on residential-system components. It does not establish a full electrical schematic or independent validation."
