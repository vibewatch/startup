    summary: >-
      High-impact scenarios remain conditional where the assigned sources do
      not establish company-specific likelihood or mitigation effectiveness.
    data:
      columns: [Impact if triggered, Evidence and likelihood, Monitorable trigger]
      rows:
        - label: Product safety
          values: ["Potentially high physical, recall, and trust impact if the report is confirmed.", "One low-reputation profile; no denominator or primary notice.", "Verified recall scope, incident rate, and timely corrective-action closure."]
        - label: Cross-border listing
          values: ["Potentially material financing and market-access impact.", "Two Bloomberg-derived reports; clearance and filing status remain unconfirmed.", "Regulatory approval, filed transaction, or documented alternative financing."]
        - label: Supply localization
          values: ["Potentially material landed-cost, availability, or eligibility impact.", "Supplier dependence is reported; EcoFlow SKU origins and tariff treatment are unknown.", "SKU-level sourcing and tariff map, supplier qualification, and facility status."]
        - label: Price and margin
          values: ["Potentially material contribution and cash-conversion impact.", "TMTPost reports 2024 category price declines and company price cuts; no audited margins.", "Sustained SKU-level price erosion, contribution margin, returns, and inventory aging."]
        - label: Home-system deployment
          values: ["Potentially material launch, commissioning, and after-sales impact.", "Product breadth is documented; approval and installer performance are not.", "Approval delays, failed commissioning, service response, and warranty cost by region."]
        - label: Warranty and service
          values: ["Potentially material cost and customer-trust impact if claims recur.", "No product-family claim rate or repair-time cohort is reported in the retained sources.", "SKU-level claim frequency, repair time, and warranty cost by region."]
    approximationNotes: >-
      Qualitative prioritization only; no numeric likelihood, probability, or
      expected loss is estimated.
    claimRefs: [CR015]
