          The company release claims a Frost & Sullivan-backed No. 1 global smart-home storage sales position and
          reports a CES award, but gives no absolute sales denominator or revenue bridge.
        - Verify sell-through, market-share methodology, and contribution margin by product and channel.
      - - Financial visibility
        - >-
          Baidu Baike says 2024 revenue of RMB 8 billion was a projection, not an audited realized result; no assigned
          source gives gross margin or cash flow.
        - >-
          Obtain audited statements and reconcile revenue to gross profit, operating cash flow, inventory, and warranty
          accruals.
      - - Competitive position
        - >-
          Caplight lists similarity-based peers but displays no peer market-cap values; its similarity list is not a
          valuation comp set.
        - Build a peer set from dated transactions with comparable business mix, margins, and capital structure.
      - - Downside / execution
        - >-
          YesPress reports a recall and margin pressure, but neither assertion is corroborated by another source in this
          pool.
        - Verify recall records, claims and remediation, then test warranty costs and price realization.
    notes: >-
      Arguments distinguish reported signals from audited measures. The evidence set is not an exhaustive peer
      transaction or company-risk enumeration.
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV008
      - CV009
      - CV011
      - CV012
  - id: TV003
    title: Bull / base / bear scenarios
    columns:
      - Case and probability signal
      - Explicit assumptions
      - Valuation range / return logic
      - Downside trigger and diligence
    rows:
      - - Bull — low signal; requires proof
        - >-
          Home-energy expansion converts reported category position into durable paid demand; gross margin, service
          costs, and cash conversion prove attractive.
        - >-
          No supportable numeric range or return multiple; value would require verified growth and margin durability at
          the actual entry price.
        - >-
          Fails if sell-through, repeat purchase, or installer economics do not support profitable scale; obtain audited
          product/channel cohorts.
      - - Base — moderate signal; evidence incomplete
        - >-
          Portable and home-storage products continue to sell, but hardware mix, channel costs, warranty exposure, and
          financing dilution remain unresolved.
        - >-
          No numeric range; benchmark the ask only against verified normalized earnings or cash flow and comparable
          dated transactions.
        - >-
          Re-rate only after audited statements, current cap table, debt/preference terms, and validated market-share
          methodology.
      - - Bear — material downside signal
        - >-
          Portable category price competition compresses margins; recall remediation, warranty claims, or a difficult
          listing process consumes cash or delays liquidity.
        - >-
          Downside cannot be bounded without current price, balance sheet, debt, and preference waterfall; assume no
          near-term exit liquidity.
        - >-
          Trigger: material unresolved safety claims, negative contribution economics, deteriorating cash conversion, or
          no credible listing path.
    notes: >-
      Probability signals are qualitative, not estimated probabilities. No absolute valuation ranges or return
      calculations are published because current price, audited financial inputs, and capital-structure terms are
      missing.
    claimRefs:
      - CV002
      - CV003
      - CV007
      - CV008
      - CV011
      - CV012
      - CV014
