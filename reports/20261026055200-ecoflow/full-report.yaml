chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              EcoFlow's own About page dates its origin to 2017 and describes a group of battery engineers building
              portable power, solar technology, and smart home energy products; independent reporting and reference
              pages also place the company in 2017. The product description is consistent across the company page and
              KRAsia's 2025 article, which distinguishes the portable DELTA and RIVER lines and describes a move toward
              home storage. EcoFlow says its ecosystem connects with 15+ brands and advertises presence in 140+
              countries and regions. Those are company-published reach statements, not audited active-customer or
              market-penetration measures. Its one-line model is hardware sales across portable power, solar generation,
              and residential energy storage, with an app-connected ecosystem.
            claimRefs:
              - CO001
              - CO002
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO016
      - number: '1.2'
        title: Leadership, funding, and governance
        blocks:
          - type: paragraph
            body: >-
              TMTPost identifies engineer Wang Lei as EcoFlow's founder, and Baidu Baike also identifies him as founder
              and CEO; the company page describes its origin as a group of battery engineers but does not name a
              complete founding team. The reviewed pool does not establish a current executive roster, board
              composition, founder ownership, or succession plan. Sources describe a 2021 Series B of about US$100
              million, with some reporting it above US$100 million and naming Sequoia China and Hillhouse-related
              investors. Baidu Baike's 2023 valuation figure and TMTPost's roughly US$1 billion estimate are historical
              references, not a current mark. Stakeholder rows therefore identify reported relationships while leaving
              control, security preferences, and present economic interests as diligence items.
            claimRefs:
              - CO003
              - CO005
              - CO006
