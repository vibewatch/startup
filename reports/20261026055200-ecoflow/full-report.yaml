  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Define the market before sizing it
        blocks:
          - type: paragraph
            body: >-
              EcoFlow's own product presentation separates whole-home backup, power stations, and smart-living products;
              independent coverage likewise distinguishes portable units from larger residential systems. This supports
              a two-core boundary: portable battery stations for mobile or backup use, and residential storage installed
              to serve a home. Plug-in balcony solar is an adjacent entry point or substitute, not interchangeable with
              a portable-station sale. Utility-scale battery projects and the entire outdoor-recreation economy sit
              outside the company-specific hardware denominator. BEA's outdoor-recreation value-added measure includes
              supporting industries and activities, so it is context for a potential user cohort rather than a proxy for
              battery demand. The boundary also prevents installation revenue, device revenue, broad recreation
              spending, and grid-project procurement from being combined into one TAM. Market definition and exclusions
              are summarized in the table.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM006
              - CM007
      - number: '2.2'
        title: Available sizing evidence is not an EcoFlow TAM
        blocks:
          - type: paragraph
            body: >-
              The strongest quantified broad-market anchor is BEA's 2024 U.S. outdoor-recreation value added, which is
              economically meaningful but several steps removed from storage-hardware spend. A KRASIA article relays a
              QYResearch estimate of supplier concentration in home storage, not a market value or forecast; its
              underlying denominator and method are not reproduced. Accio publishes a home-backup projection with an
              asserted 2026 value and CAGR, but the fetched page provides no traceable underlying report or transparent
              boundary, so it is only a low-confidence research lead. A Baidu Baike entry also reports EcoFlow's 2024
              share of portable energy storage without disclosing a method in the fetched text. None of these figures
              should anchor valuation or be presented as an independently verified benchmark. U.S. battery-import values
              and German balcony-solar installations illuminate supply exposure and adjacent adoption, respectively, but
              use different populations and units. The exhibit distinguishes those lenses; the pyramid organizes segment
              pathways without assigning relative market size.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM013
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM011
              - CM013
      - number: '2.3'
        title: Buyers and adoption pathways
        blocks:
          - type: paragraph
            body: >-
              The evidence points to several distinct buying jobs rather than one homogeneous energy-storage buyer.
              EcoFlow's employee interview identifies households seeking outage backup as well as campers, overlanders,
              RV users, and off-grid customers; that is company testimony, not independently measured segment demand.
              For portable products, the user and payer are often the same household or recreational buyer. Larger home
              systems add a homeowner or property decision-maker, an installer or electrician, and potentially a
              retailer or distributor in the purchase path. Germany's plug-in solar example shows a lower-complexity
              adjacent path: more than one million devices were reported installed in three years, with policy
              permission, lower upfront prices, and stated payback periods contributing to adoption. These observations
              cannot be generalized to EcoFlow's global sales, but they identify different budget owners, triggers, and
              channel requirements. The buyer map keeps these paths separate.
            claimRefs:
              - CM001
              - CM003
              - CM011
              - CM012
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM011
              - CM012
              - CM014
      - number: '2.4'
        title: Growth drivers meet material adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Home storage may broaden the use case as portable-device upgrades slow, but the move changes the buying
              motion. KRASIA describes home systems as combinations of batteries, inverters, battery-management and
              energy-management systems, with overseas safety certification, logistics, installation, and after-sales
              support raising the bar. The same article reports price-war pressure and limited portable-product
              breakthroughs, while Germany's balcony-solar evidence shows that even simpler household systems are
              sensitive to purchase cost and payback. Separately, S&P Global reports substantial U.S. battery and
              component imports and quotes industry participants warning that tariff uncertainty can pause projects or
              raise costs; that is an upstream exposure, not a measurement of EcoFlow's own landed cost. Until segment
              revenue, channel economics, sell-through, installation conversion, and comparable market denominators are
              disclosed, residential growth should be treated as an opportunity with unproven scale rather than a
              forecast.
            claimRefs:
              - CM004
              - CM006
              - CM008
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Treat broad market proxies as context
            body: >-
              BEA recreation value added, battery-import totals, and home-storage share estimates describe different
              markets and cannot be added into a company TAM.
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM013
          - type: callout
            title: Residential expansion raises execution requirements
            body: >-
              Larger home systems introduce installation, certification, channel, and affordability dependencies that
              are absent from a simple portable-device market comparison.
            calloutType: risk
            claimRefs:
              - CM003
              - CM004
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive set spans portable stations to installed backup
        blocks:
          - type: paragraph
            body: >-
              EcoFlow is not competing against a single substitute. The buyer can choose a small portable station for
              travel, a larger expandable battery for outage coverage, a fixed home-storage system, or a manual
              generator and transfer switch. The evidence in this pool identifies Bluetti, Jackery, Anker SOLIX, Goal
              Zero, Tesla, and Generac as alternatives, but it does not provide comparable sell-through, customer
              cohorts, or audited competitor scale. SolarPlay's comparison is especially useful as a map of named
              alternatives, not as a neutral ranking: SolarPlay sells its own Q-series product and recommends it
              alongside the established brands. Popular Mechanics' hands-on reporting instead supports EcoFlow-specific
              capability observations; it does not test every rival on a common protocol. The resulting profile is a
              breadth map with explicit unknowns, not a market-share league table.
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP008
              - CP009
              - CP011
              - CP012
              - CP016
      - number: '3.2'
        title: Product breadth is visible, but cross-brand comparison is thin
        blocks:
          - type: paragraph
            body: >-
              Independent product testing gives EcoFlow a concrete performance reference: Popular Mechanics reports its
              Delta Pro 3 test output and rated capacity, while Station Arena lists the same model's capacity and
              continuous output. That agreement supports the specification, not a conclusion that EcoFlow outperforms
              rival products. SolarPlay's seller-authored comparison describes alternatives by broad use case, and
              Station Arena publishes its own category medians for price per watt-hour and battery expandability. Those
              figures have different scopes and disclosed commercial incentives, so they should not be treated as an
              audited benchmark. At the system level, the sources show EcoFlow extending from portable stations into
              app-managed home backup and balcony solar. The practical distinction is therefore a documented
              product-system strategy; relative total cost, installation economics, and rival-system interoperability
              remain unresolved.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP004
              - CP003
              - CP006
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP010
              - CP011
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP004
              - CP009
              - CP011
              - CP016
      - number: '3.3'
        title: Ecosystem expansion can also increase switching costs
        blocks:
          - type: paragraph
            body: >-
              EcoFlow's path from portable power into a smart home panel can raise the value of adding compatible
              batteries and energy-management features, but it also makes compatibility and service quality more
              consequential. Battery Skills describes the Smart Home Panel 2 as an EcoFlow-specific hub and notes the
              need for professional installation; its review is a single publisher's account rather than an independent
              electrical-system benchmark. A Reddit discussion contains both positive owner anecdotes and complaints
              about support and a reportedly melted input connection. These posts establish that customers discuss
              support and hardware concerns, not their incidence or comparative failure rate. The assigned pool contains
              no matched warranty, return, repair, or field-failure dataset across EcoFlow and rivals, so durability and
              moat persistence remain diligence questions rather than demonstrated advantages.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: A credible system-breadth position
            body: >-
              Independent product coverage and the assigned product-category sources describe EcoFlow across portable
              power, solar, and whole-home backup; the breadth is visible even though its relative economics are not
              established.
            calloutType: strength
            claimRefs:
              - CP002
              - CP009
              - CP010
          - type: callout
            title: Lock-in and service are material buyer tests
            body: >-
              The Smart Home Panel review describes a closed EcoFlow ecosystem, while a customer discussion includes
              support complaints. Neither source measures prevalence, but together they identify compatibility and
              post-sale support as diligence priorities.
            calloutType: risk
            claimRefs:
              - CP011
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Reported scale is not yet verified revenue quality
        blocks:
          - type: paragraph
            body: >-
              EcoFlow's official US and global pages describe portable power, solar, and home-energy products, but
              disclose no product-family revenue mix (CI001). KrASIA reports 2024 revenue of RMB 8 billion (USD 1.1
              billion), while Baidu Baike describes RMB 8 billion as a 2024 projection with approximately 80%
              year-on-year growth (CI003, CI004). Baike separately reports revenue above RMB 3 billion in the first half
              of 2023 and says more than 95% of revenue came from overseas markets, without specifying the period for
              that share (CI005, CI006). The reported-versus-projected framing is not reconciled in the assigned
              evidence, and none of these secondary figures is accompanied by an audited statement. They support a scale
              hypothesis, not a conclusion about recognized revenue, growth quality, or margins.
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
              - CI006
              - CI014
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
              - CI006
              - CI009
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI014
      - number: '4.2'
        title: Public offers and channel examples do not reveal realized economics
        blocks:
          - type: paragraph
            body: >-
              The assigned sources document EcoFlow's owned US storefront, historical crowdfunding, and third-party
              descriptions of retail and marketplace routes, but do not quantify current channel shares (CI002). The
              storefront advertises a 5% sign-up discount and "$1,000+ exclusive coupons"; those promotions are not an
              average selling price or evidence of discounts actually redeemed (CI007). Campervan HQ lists launch-era
              prices for RIVER, DELTA, and DELTA Pro in 2018, 2019, and 2021, respectively, but these dated figures are
              not current realized prices (CI008). The SolarLab account says a DELTA Pro Kickstarter campaign raised
              more than US$12 million; that campaign total is not reported as recognized sales, gross profit, or cash
              currently available (CI009). Underwriting therefore needs net prices and channel-level sell-through,
              returns, payment terms, and customer acquisition data rather than extrapolation from promotional copy or
              launch campaigns.
            claimRefs:
              - CI002
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI007
              - CI008
      - number: '4.3'
        title: Margin drivers are visible, but company-level costs are not
        blocks:
          - type: paragraph
            body: >-
              KrASIA describes a portable-storage price war and slower upgrade demand, as well as home-storage
              requirements for logistics, on-site installation, and after-sales support (CI012, CI016). These are
              plausible pressure points for pricing and cost-to-serve, but the article does not quantify EcoFlow's
              discounting, installer take rates, or contribution margin. Energy-Storage.news reported a 2024 US policy
              announcement scheduling 25% tariffs on non-EV lithium-ion batteries from China for 2026; the article does
              not establish current implementation or EcoFlow's product- level exposure (CI013). The assigned CPSC URL
              returned general agency information, not product-specific recall details, so recall scope and financial
              impact remain unverified (CI015). The evidence set contains no audited gross margin, CAC/payback,
              working-capital, or cash-conversion figures (CI014); hardware scale alone cannot establish a margin path.
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Historical funding and a possible IPO do not establish liquidity
        blocks:
          - type: paragraph
            body: >-
              Fobi lists US$104 million in total funding, and Tech in Asia reports that EcoFlow last raised more than
              US$100 million in 2021 (CI010). These retrospective records describe capital raised, not cash remaining,
              debt, or runway. Tech in Asia reported on 17 December 2025 that EcoFlow was considering a US IPO that
              might raise at least US$300 million, subject to Chinese regulatory approval and possible changes to the
              details (CI011). That was a reported proposal, not a completed offering or available proceeds. The
              assigned evidence does not establish current cash, operating burn, borrowing or supply-chain finance,
              planned use of proceeds, or the next financing trigger (CI014). Capital adequacy should therefore remain
              unresolved until management records and audited statements reconcile liquidity needs with inventory,
              expansion, and service obligations.
            claimRefs:
              - CI010
              - CI011
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Portfolio and user jobs
        blocks:
          - type: paragraph
            body: >-
              Available sources describe EcoFlow across portable stations, solar generation, RV systems, and residential
              backup. A June 2026 reviewer groups RIVER around portability, DELTA around heavier-duty use, and DELTA Pro
              around home backup; Baike similarly lists portable stations, solar equipment, and smart-home storage while
              attributing X-Stream and X-Boost technologies to the brand. These are third-party descriptions, not a
              verified census of current SKUs or independent tests. The strongest product-level evidence in this pool is
              EcoFlow's own US DELTA Pro 3 page, which gives detailed capacity, input, output, and compatibility
              specifications. Treat those as manufacturer ratings rather than measured operating results. [CE001, CE002,
              CE003, CE016]
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE008
      - number: '5.2'
        title: System architecture and deployment
        blocks:
          - type: paragraph
            body: >-
              The DELTA Pro 3 is presented as a rechargeable LFP power station that combines AC and solar inputs, an
              inverter and multiple AC/DC outputs, and optional batteries and home-transfer equipment. EcoFlow lists
              both a 10 ms unit UPS specification and a separate 20 ms Smart Home Panel 2 switchover claim; these
              describe different configurations and should not be collapsed into one performance figure. The listing
              also distinguishes an IP65-rated battery pack from an IP20 main unit. For RVs, Campervan HQ describes a
              separate Power Kits architecture with a Power Hub, console, distribution panel, and batteries.
              Connectivity and accessory compatibility imply ecosystem dependencies, but the assigned sources do not
              establish local-control options, cloud dependence, or software support duration. [CE004, CE005, CE006,
              CE007, CE008]
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
              - CE009
              - CE010
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
      - number: '5.3'
        title: Residential scale and differentiation
        blocks:
          - type: paragraph
            body: >-
              EcoFlow's differentiating proposition in this evidence set is the attempt to extend portable storage into
              home and RV workflows through modular batteries, solar charging, transfer equipment, and app-connected
              controls. KrASIA's September 2025 report describes home systems as combining battery packs, inverters,
              battery-management systems, and energy-management systems; it also says certification, logistics,
              installation, and after-sales support raise the bar for new entrants. The same article reports a
              portable-storage price war and few fundamental device breakthroughs, framing home storage as a growth
              direction rather than proof of EcoFlow's technical advantage. These are market observations, not a
              like-for-like benchmark of EcoFlow against competitors. [CE009, CE010, CE011]
            claimRefs:
              - CE009
              - CE010
              - CE011
      - number: '5.4'
        title: Safety, reliability, and evidence limits
        blocks:
          - type: paragraph
            body: >-
              Safety evidence is specific but incomplete. A November 2025 PV Magazine USA reprint of ESS News reports
              that the CPSC had received six fire reports tied to about 25,030 DELTA Max 2000 Model EFD310 units, with
              property damage above $850,000. A later YesPress account says the recall response included firmware
              repair, but the assigned official CPSC text contains only general recall-law language and no
              product-specific notice or remediation readback. The reported incident count is not a population failure
              rate, and the firmware claim is not independently verified here. This pool also lacks product-family
              warranty outcomes, failure denominators, test reports, software-security assessments, and evidence that
              any repair program is complete. [CE012, CE013, CE014, CE015]
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Recall signal without a verified fleet-level rate
            body: >-
              Reporting identifies a DELTA Max 2000 fire recall and a firmware-repair response, but the available
              sources do not establish a failure denominator, repair completion, or current residual risk.
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyers, use cases, and route to market
        blocks:
          - type: paragraph
            body: >-
              EcoFlow serves several different purchase contexts rather than one interchangeable customer base.
              TechCrunch's 2022 coverage describes portable stations for outdoor recreation and home backup, and quotes
              the CEO on serving customers in Japan and the United States; it also reports that the company shipped to
              more than 100 markets at that time. A 2023 pv magazine report describes PowerStream as a plug-and-play
              balcony-solar offer available for online purchase, with configurations ranging from no storage to 2 kWh of
              storage. In June 2026, EcoFlow announced residential storage and its first European
              commercial-and-industrial portfolio. Those are different buyers, installation burdens, and use cases; the
              evidence does not support assigning revenue or customer counts to any segment. Public reporting also
              describes online and crowdfunding routes, while installer involvement becomes more relevant to whole-home
              systems. Channel contribution, retail sell-through, and the share of installations completed by partners
              remain undisclosed.
            claimRefs:
              - CU006
              - CU007
              - CU010
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU010
              - CU014
              - CU016
      - number: '6.2'
        title: Adoption signals are not a retention record
        blocks:
          - type: paragraph
            body: >-
              The available indicators describe different populations and cannot be combined into a continuous
              customer-growth series. TechCrunch reported campaign proceeds for three crowdfunding launches:
              approximately $1 million for RIVER, approximately $2.8 million for DELTA, and more than $12 million for
              DELTA Pro. Those are campaign amounts, not counts of shipped or active customers. A TMTPost article
              reports a 25.8% share of global portable-energy-storage sales by revenue in 2024, based on unspecified
              industry data; market share is not a customer denominator. EcoFlow's December 2025 release said it served
              more than 500,000 home-energy users, while a June 2026 release described more than 6 million users across
              140 markets. The latter company-wide user measure is not defined as active, paying, or unique and should
              not be treated as a home customer count. Neither the user claims nor the campaign and share measures
              disclose repeat purchase, product utilization, cohort retention, churn, or expansion rates.
            claimRefs:
              - CU002
              - CU003
              - CU008
              - CU009
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU008
              - CU009
      - number: '6.3'
        title: Customer references and durability gaps
        blocks:
          - type: paragraph
            body: >-
              Named public evidence is thin relative to the scale implied by company-wide user claims. The 2026 Home
              Upgrade Program release names Footprint Project and Convoy of Hope as nonprofit disaster-response partners
              and describes community contributions; it does not present a named household deployment or independently
              measured outcome. EcoFlow's CES page displays user comments under masked handles and a selection of named
              energy commentators, but these are company-hosted promotional references rather than independently
              verified production-customer case studies. A Reddit discussion includes both positive ownership reports
              and critical accounts of support and product issues. It is anecdotal and self-selected, so it cannot
              establish complaint prevalence or company-wide service quality. No assigned source supplies NRR, GRR,
              churn, renewal, repeat-purchase cohorts, customer concentration, or channel economics. Investors should
              treat installed base durability and named deployment outcomes as open diligence items, not as negative or
              positive facts inferred from silence.
            claimRefs:
              - CU001
              - CU004
              - CU011
              - CU012
              - CU013
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
