      - number: '1.3'
        title: Scale and financial visibility
        blocks:
          - type: paragraph
            body: >-
              Public operating scale is harder to underwrite than product breadth. The company page advertises 140+
              countries and regions, but the assigned evidence does not define active markets, unique customers, or the
              period behind that number. On revenue, KRAsia/36Kr reports RMB 8 billion (US$1.1 billion) for 2024, while
              TMTPost describes analysts' projection of around RMB 7 billion (US$980 million) for 2024. The latter is
              expressly a projection, so the figures are not equivalent audited results and should not be collapsed into
              an ARR or current run-rate. No assigned source supplies audited financial statements, gross margin, cash
              flow, inventory or warranty accruals, a reconciled cumulative-funding total, or current headcount and
              customer counts. These private metrics remain material underwriting gaps.
            claimRefs:
              - CO004
              - CO007
              - CO008
              - CO016
      - number: '1.4'
        title: Milestones and operating watchpoints
        blocks:
          - type: paragraph
            body: >-
              The timeline below is a selected chronology from the assigned sources, not an exhaustive corporate
              history; several early entries rely on company-oriented product or retailer narratives and deserve primary
              corroboration. The more recent KRAsia account describes EcoFlow's push from portable stations toward
              residential storage and energy management. An assigned CPSC source is titled as a 2026 recall of EcoFlow
              Delta Max 2000 power stations for serious burn-injury and fire hazards. However, the newly fetched CPSC
              text contains only general agency boilerplate, not the recall scope, affected units, remedy, or incident
              counts. The record is therefore an adverse diligence flag, not evidence for unverified recall details;
              obtain the full notice and company remediation data before sizing product-liability exposure.
