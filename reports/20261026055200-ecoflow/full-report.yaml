  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Capital access, regulation, and trade exposure
        blocks:
          - type: paragraph
            body: >-
              Invezz coverage carried by TradingView (dated December 16, 2025) and an undated TMTPost article describe a
              possible U.S. listing, not a completed financing; both attribute the proposal to Bloomberg reporting, so
              their repetition is not independent confirmation. The articles report a contemplated raise of at least
              $300 million and say Chinese regulatory clearance is a condition. That amount is prospective, not proceeds
              or cash available, and neither article supplies an approval or filing record. TMTPost also describes
              disclosure, audit-oversight, and potential delisting exposure for China-linked issuers, but its undated
              account cannot establish current requirements. Separately, a Mobility Global article describes U.S. tariff
              changes for EVs and specified battery materials in 2024; it does not establish that EcoFlow portable or
              residential products fall under those tariff lines. Treat listing approval and product-level trade
              treatment as high-impact conditional risks, with likelihood and direct cost unquantified pending current
              counsel review and SKU-level classification.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
      - number: '7.2'
        title: Product safety, quality, and connected-system controls
        blocks:
          - type: paragraph
            body: >-
              A YesPress profile dated August 20, 2026 reports that EcoFlow recalled about 25,000 DELTA Max 2000 units
              in the United States in late 2025 over overheating and fire risk, citing six reported fires, more than
              $850,000 in property damage, and no injuries. It says most units were remedied by firmware update, but the
              assigned pool contains no primary recall notice or independently corroborating incident record. Treat this
              as a low-confidence adverse signal, not a verified recall scope or completed remedy; a battery fire could
              be high impact if confirmed, while likelihood cannot be estimated without a denominator. The official
              EcoFlow page and a 2023 Campervan HQ profile describe a portfolio spanning portable and whole-home
              systems, including home-panel integration. That breadth implies more certification, installation, and
              service interfaces, not evidence of failure. EcoFlow's 2024 paid release also says its WattAYear summary
              used global app data and reports user energy and savings figures; methodology and denominator are not
              supplied in that release.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR012
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR012
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR015
      - number: '7.3'
        title: Supplier, channel, and unit-economics dependencies
        blocks:
          - type: paragraph
            body: >-
              TMTPost reports that EcoFlow relies heavily on Chinese suppliers and was evaluating a first U.S.
              manufacturing facility, but it identifies no supplier roster, component-origin shares, or completed
              localization plan. Accio's page offers generic supplier recommendations for related product categories
              rather than documenting EcoFlow's actual vendors. TMTPost also attributes a greater-than-10% global
              portable-energy-storage average-selling-price decline in 2024 to industry estimates and says people
              familiar with the company linked U.S. price cuts to lower gross margins; neither is an audited EcoFlow
              margin series. A third-party tariff article concerns EV batteries and does not resolve treatment of
              EcoFlow's product classifications. For installed systems, the described home-panel and app ecosystem
              creates dependencies on qualified installers and after-sales coverage, yet the sources provide no
              coverage, commissioning, or service-cost metrics. Monitor actual listing filings, approved SKU origins,
              product-level margins, warranty cohorts, and installation outcomes. A material unremediated safety event,
              inability to qualify supply for target markets, or sustained price erosion that overwhelms service
              economics would challenge the thesis; the available evidence cannot set numeric trigger thresholds.
            claimRefs:
              - CR004
              - CR005
              - CR010
              - CR011
              - CR013
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR005
              - CR010
              - CR011
              - CR013
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Recommendation: research-more, with low confidence in any price conclusion and high underwriting risk.
              PolyU's alumni profile reports an over-US$1 billion valuation within four years of founding, while Baidu
              Baike records a 2023 Hurun valuation of RMB 6.9 billion; these are historical reports, not a current entry
              mark (CV002, CV007). The accessible Caplight page now shows a December 2025 "IPO" row without transaction
              terms or a valuation; neither is a usable current entry mark (CV002, CV004). An Alibaba supplier/sourcing
              page repeats an approximately US$1.0 billion estimate but gives no valuation date or method, so it is not
              a verified current mark (CV015, CV016). The 2025 company-issued CES release attributes a No. 1 global
              smart-home energy storage sales position to Frost & Sullivan and reports a 2026 CES award, but supplies no
              absolute sales figure or market-share denominator (CV005, CV006). These are market-position signals, not
              audited revenue, paid-user retention, or unit economics. Do not infer current value from reported
              historical fundraising, category rank, or a vendor page's inaccessible fields. The recommendation-logic
              figure traces these proof limits to the decision. Require a current priced financing or cap-table extract,
              audited trailing financials, and warranty / returns data before setting an entry ceiling or return target.
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV007
              - CV011
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV005
              - CV007
              - CV011
              - CV013
              - CV014
      - number: '8.2'
        title: Thesis, anti-thesis, and comparable evidence
        blocks:
          - type: paragraph
            body: >-
              The positive case is a hardware platform that has expanded from portable stations into residential
              storage, with CKGSB's alumni feature describing an early demand-validation campaign; it reports that RIVER
              raised about US$1 million on Indiegogo, but pledges are not recognized revenue or proof of repeat demand
              (CV001). The countercase is that category position and international reach do not disclose gross margin,
              service costs, channel contribution, or cash conversion. EcoFlow's December 2025 company-issued release
              attributes a number-one global smart-home storage sales ranking to Frost & Sullivan, but gives no share,
              unit denominator, or revenue bridge (CV005). Caplight lists Jackery, Shenzhen Hello Tech, and BLUETTI as
              embedding-similarity comparables, but its visible page shows no market-cap figures; those competitor
              labels are not independent transaction benchmarks (CV009). Alibaba's sourcing article names no suppliers
              or contract terms, so it cannot establish procurement scale or channel economics (CV010). The thesis is
              plausible, not yet priceable.
            claimRefs:
              - CV001
              - CV005
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV008
              - CV009
              - CV011
              - CV012
      - number: '8.3'
        title: Scenarios, exit readiness, and diligence gates
        blocks:
          - type: paragraph
            body: >-
              No numeric bull, base, or bear valuation range or target return can be supported from this assigned public
              evidence: the latest accessible vendor preview omits transaction values, and no source provides audited
              current revenue, margins, cash flow, dilution, or preference terms (CV004, CV008, CV014). The scenario
              table therefore makes its operating assumptions and qualitative probability signals explicit, while
              leaving absolute ranges unestimated rather than manufacturing multiples. The bear case deserves material
              weight in diligence because YesPress reports a 2025 US recall and property damage and separately describes
              portable power as price-competitive with margin pressure; neither report is independently corroborated in
              this pool (CV011, CV012). Baidu Baike says IPO preparations began in 2025, but that report does not
              establish a filed prospectus, listing schedule, or exit liquidity (CV013). Before investment, verify the
              recall scope and remediation, obtain audited segment economics and a fully diluted capitalization table,
              and confirm the issuer's listing status and investor rights.
            claimRefs:
              - CV004
              - CV008
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV008
              - CV011
              - CV012
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: No supportable entry price
            body: >-
              Treat historical marks and company-reported category position as diligence leads, not as valuation inputs;
              require current price, audited economics, and capitalization terms before underwriting a return.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV014
          - type: callout
            title: Verify adverse evidence before underwriting
            body: >-
              The assigned source pool contains a serious but uncorroborated recall account and an unquantified
              margin-pressure assessment; obtain primary records and company remediation data before treating either as
              established.
            calloutType: risk
            claimRefs:
              - CV011
              - CV012
