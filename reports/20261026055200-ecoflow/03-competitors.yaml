  evidenceGaps:
    - type: missing-source
      severity: material
      topic: competitive-benchmark
      missingEvidence: Comparable independent tests of EcoFlow and rival products under the same output, charging, capacity, and reliability protocol.
      whyItMatters: Without like-for-like product tests, claimed capability differences cannot establish a durable performance advantage or support a premium.
      diligencePath: Commission or obtain a third-party test set covering matched EcoFlow, Bluetti, Jackery, and Anker SOLIX configurations with protocols and raw results.
      relatedQuestionRefs:
        - QP008
        - QP009
    - type: private-evidence-only
      severity: material
      topic: customer-experience
      missingEvidence: Comparable product-family warranty claims, return rates, repair turnaround, support-ticket volume, and recall-remediation data.
      whyItMatters: Anecdotal complaints and positive owner reports do not measure incidence, cost, or relative reliability and cannot resolve service-related switching risk.
      diligencePath: Request SKU- and geography-level quality, warranty, return, repair, and customer-support cohorts from EcoFlow and selected competitors.
      relatedQuestionRefs:
        - QP006
    - type: missing-source
      severity: minor
      topic: competitor-pricing
      missingEvidence: Current competitor list and realized prices with matched capacity, output, included accessories, warranty, installation, and channel terms.
      whyItMatters: Public prices and category medians in the pool use different products and scopes, preventing a defensible total-cost comparison.
      diligencePath: Collect dated manufacturer and retailer quotes for matched portable and installed-system configurations across the key markets.
      relatedQuestionRefs:
        - QP003
        - QP004
      relatedTableRefs:
        - TP003
    - type: missing-source
      severity: material
      topic: competitor-scale
      missingEvidence: Comparable audited competitor revenue, funding, margins, installed base, and product-family economics.
      whyItMatters: Without comparable scale and economics, relative pricing power and EcoFlow's competitive durability cannot be underwritten.
      diligencePath: Obtain audited statements or investor materials for EcoFlow and principal peers, reconciling segment definitions and reporting periods.
      relatedQuestionRefs:
        - QP003
