      - - Jackery
        - Portable and outdoor power
        - Named as an alternative by SolarPlay and Campervan HQ
        - SolarPlay positions it around familiarity and simple setup
        - No comparable current lineup, warranty, or realized price evidence
      - - Anker SOLIX
        - Portable to home backup
        - Named by SolarPlay as an alternative
        - SolarPlay describes smart monitoring and high inverter output
        - Seller-authored comparison; no matched independent test
      - - SolarPlay
        - Competing portable/home-backup products
        - Its guide names its Q3600 and Q2501 alongside EcoFlow, Bluetti, Jackery, and Anker SOLIX
        - Directly competing on backup use cases and stated product specifications
        - The publisher sells its own products; its comparison is not an independent benchmark
      - - Tesla Powerwall / Generac PWRcell
        - Fixed home-storage systems
        - Battery Skills presents both as alternatives to the EcoFlow Smart Home Panel 2
        - Installed home-energy systems rather than a direct portable-station substitute
        - No matched installed pricing, service, or performance data in this pool
      - - Manual generator and transfer switch
        - Status-quo backup
        - Battery Skills identifies a manual transfer switch with a portable generator as a lower-cost alternative
        - Lower-cost, manually operated route for essential circuits
        - Fuel, runtime, installation, and buyer preference are not compared on a common basis
    notes: >-
      Non-exhaustive alternatives identified by assigned sources. SolarPlay and
      Campervan HQ have commercial incentives; Battery Skills is a single-site
      review. Product scope and distinctions are source descriptions, not
      independently validated rankings.
