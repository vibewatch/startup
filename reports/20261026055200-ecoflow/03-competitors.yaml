  - id: TP002
    title: Capability and integration evidence matrix
    columns:
      - Buying criterion
      - EcoFlow evidence
      - Portable peer evidence
      - Installed or status-quo alternative
      - Diligence implication
    rows:
      - - Capacity and output
        - DELTA Pro 3 listed at 4,096 Wh and 4,000 W continuous output
        - SolarPlay lists its Q3600 at 3,840 Wh and 3,600 W; no matched test
        - Battery Skills describes the power station as the limit on Smart Home Panel output
        - Rated specifications do not establish usable output or comparative reliability
      - - Charging and product experience
        - Popular Mechanics describes fast charging and app-based monitoring in reviewed models
        - SolarPlay calls out LiFePO4, UPS, and solar support across selected alternatives
        - Manual generator alternative requires manual operation
        - Claims use different products and source protocols; comparative advantage unknown
      - - Expandability
        - Station Arena reports 17 of its 22 listed stations support added batteries
        - SolarPlay describes Bluetti as modular; other peer details are unavailable
        - Fixed home systems use their own hardware ecosystems
        - Compatibility boundaries and expansion cost require model-level review
      - - Home integration
        - Smart Home Panel 2 supports EcoFlow-specific power stations and up to ten circuits per Battery Skills
        - No equivalent integration evidence retained for portable peers
        - Tesla and Generac are identified as installed-system alternatives
        - Installation and whole-home load sizing are not comparable in this pool
      - - Trust and service
        - One Reddit thread contains both positive owner reports and complaints
        - No peer-level warranty or field-failure evidence retained
        - Battery Skills recommends professional installation for the panel
        - Reliability, service levels, and total installed cost remain open
    notes: >-
      Evidence is uneven and source-specific. Blank comparative knowledge is
      stated as unavailable rather than inferred; source-reported specifications
      and anecdotal experience are not normalized benchmarks.
    claimRefs:
      - CP001
      - CP004
      - CP003
      - CP006
      - CP011
      - CP012
