company:
  name: EcoFlow
chapter:
  number: 1
  title: Company Overview
  summary: EcoFlow is a Shenzhen-founded energy-hardware company whose public materials describe a progression from portable power stations into solar and home-energy systems. Public sources establish its 2017 origin and selected financing and product milestones, but current audited economics, ownership, leadership depth, and several scale metrics remain unverified.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      EcoFlow's own About page dates its origin to 2017 and describes a group of
      battery engineers building portable power, solar technology, and smart
      home energy products; independent reporting and reference pages also place
      the company in 2017. The product description is consistent across the
      company page and KRAsia's 2025 article, which distinguishes the portable
      DELTA and RIVER lines and describes a move toward home storage. EcoFlow
      says its ecosystem connects with 15+ brands and advertises presence in
      140+ countries and regions. Those are company-published reach statements,
      not audited active-customer or market-penetration measures. Its one-line
      model is hardware sales across portable power, solar generation, and
      residential energy storage, with an app-connected ecosystem.
    claimRefs:
      - CO001
      - CO002
      - CO004
    tableRefs:
      - TO001
  - id: leadership-and-capital
    title: Leadership, funding, and governance
    body: >-
      TMTPost identifies engineer Wang Lei as EcoFlow's founder, and Baidu
      Baike also identifies him as founder and CEO; the company page describes
      its origin as a group of battery engineers but does not name a complete
      founding team. The reviewed pool does not establish a current executive
      roster, board composition, founder ownership, or succession plan. Sources
      describe a 2021 Series B of about US$100 million, with some reporting it
      above US$100 million and naming Sequoia China and Hillhouse-related
      investors. Baidu Baike's 2023 valuation figure and TMTPost's roughly
      US$1 billion estimate are historical references, not a current mark.
      Stakeholder rows therefore identify reported relationships while leaving
      control, security preferences, and present economic interests as diligence
      items.
    claimRefs:
      - CO003
      - CO005
      - CO006
    tableRefs:
      - TO002
      - TO003
  - id: scale-and-financial-visibility
    title: Scale and financial visibility
    body: >-
      Public operating scale is harder to underwrite than product breadth. The
      company page advertises 140+ countries and regions, but the assigned
      evidence does not define active markets, unique customers, or the period
      behind that number. On revenue, KRAsia/36Kr reports RMB 8 billion
      (US$1.1 billion) for 2024, while TMTPost describes analysts' projection
      of around RMB 7 billion (US$980 million) for 2024. The latter is expressly
      a projection, so the figures are not equivalent audited results and
      should not be collapsed into an ARR or current run-rate. No assigned
      source supplies audited financial statements, gross margin, cash flow,
      inventory or warranty accruals, a reconciled cumulative-funding total, or
      current headcount and customer counts. These private metrics remain
      material underwriting gaps.
    claimRefs:
      - CO004
      - CO007
      - CO008
      - CO016
  - id: milestones-and-adverse-evidence
    title: Milestones and operating watchpoints
    body: >-
      The timeline below is a selected chronology from the assigned sources,
      not an exhaustive corporate history; several early entries rely on
      company-oriented product or retailer narratives and deserve primary
      corroboration. The more recent KRAsia account describes EcoFlow's push
      from portable stations toward residential storage and energy management.
      An assigned CPSC source is titled as a 2026 recall of EcoFlow Delta Max
      2000 power stations for serious burn-injury and fire hazards. However,
      the newly fetched CPSC text contains only general agency boilerplate, not
      the recall scope, affected units, remedy, or incident counts. The record
      is therefore an adverse diligence flag, not evidence for unverified
      recall details; obtain the full notice and company remediation data before
      sizing product-liability exposure.
    claimRefs:
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
    figureRefs:
      - FO001
