    - type: private-evidence-only
      severity: material
      topic: financials
      missingEvidence: "Audited 2024 and trailing-period financial statements, with revenue recognition, gross margin, operating cash flow, inventory, warranty accruals, and debt schedules."
      whyItMatters: "The two assigned 2024 revenue figures use different certainty language and do not establish profitability, cash generation, or a defensible current run-rate."
      diligencePath: "Obtain audited statements and management accounts, reconcile reported revenue to filings and tax records, and inspect working-capital and warranty schedules."
