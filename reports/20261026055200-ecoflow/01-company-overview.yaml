    - type: conflicting-data
      severity: material
      topic: revenue
      missingEvidence: "A reconciled primary-source 2024 revenue figure and a clear distinction between realized revenue, analyst projection, and any forward run-rate."
      whyItMatters: "KRAsia reports RMB 8 billion of 2024 revenue while TMTPost reports an analyst projection around RMB 7 billion; neither source establishes audited results."
      diligencePath: "Request audited financials and a revenue bridge by period, product family, geography, and channel; do not relabel either amount as ARR."
