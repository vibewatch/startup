    columns: [Segment / category, Included use or spend, Excluded or non-comparable scope, Buyer / payer, EcoFlow relevance and evidence]
    rows:
      - [Portable power stations, "Standalone rechargeable battery units for mobile use and short-duration backup", "Fuel generators and utility-scale storage procurement", "Households, campers, RV users, and off-grid operators", "Core portable category; company product presentation and KRASIA distinguish portable systems"]
      - [Residential home storage, "Installed batteries and associated inverter / energy-management equipment for household use", "Grid-scale project equipment and unrelated household energy spend", "Homeowner or property decision-maker; installer participates in delivery", "Adjacent core category; KRASIA describes system components and installation barriers"]
      - [Balcony / plug-in solar, "Small socket-connected PV systems, sometimes paired with storage", "Portable-station sales and full rooftop or utility-scale projects", "Tenant or homeowner; household budget", "Adjacent substitute or acquisition path; DW describes German adoption, not EcoFlow sales"]
      - [Outdoor recreation economy, "Recreation-related activity and supporting-industry value added", "Battery device revenue or storage equipment spend", "Recreation participants and supporting businesses", "Demand context only; BEA scope is much broader than EcoFlow's addressable product market"]
      - [Utility-scale battery storage, "Batteries and components deployed in grid projects", "Residential and portable device purchases", "Project developers, utilities, and ratepayers", "Policy and supply-chain context only; S&P's import data are not EcoFlow demand"]
    notes: Boundary is analytical, not a reported market taxonomy. Residential installation value, product revenue, recreation value added, and grid-project procurement are not comparable or additive.
    claimRefs: [CM001, CM002, CM003, CM005, CM006, CM007]
