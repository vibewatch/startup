    title: Published sizing lenses and their limits
    columns: [Publisher / source, Period, Geography, Reported value or metric, Growth / share metric, Methodology stated in retained text, Confidence, Limitation for EcoFlow sizing]
    rows:
      - [Bureau of Economic Analysis, "2024 data; released in 2026", United States, "$696.7 billion current-dollar value added; 2.4% of U.S. GDP for outdoor recreation", "Real outdoor-recreation GDP grew 2.7% in 2024; not a CAGR", "BEA outdoor-recreation economic statistics using national accounts", High, "Broad recreation value added includes supporting activities and is not storage-hardware spend"]
      - [Accio, 2026 projection, "Not specified in the fetched text", "$1,140M projected high-capacity home-backup market value", "15.4% CAGR asserted; forecast period not specified", "No traceable underlying report or transparent segment denominator in the fetched page", Low, "Unverified secondary estimate; do not use as a base-case TAM"]
      - [KRASIA relaying QYResearch, "December 2024 report cited by article", Global, "Tesla, BYD, and LG reportedly hold about 41% of global home-storage market", "Share only; total market value and forecast not stated", "Article names QYResearch but does not reproduce its sizing method", Low, "Secondary competitor-concentration claim, not an independently evaluated benchmark or market-size estimate"]
      - [Deutsche Welle, "More than 1 million installations in the past three years; article publication date not stated in fetched text", Germany, "More than 1 million plug-in solar devices installed", "No CAGR stated", "Article reports installation count and local payback / price context", Medium, "Adjacent plug-in solar adoption, not EcoFlow unit sales or residential-storage TAM"]
      - [S&P Global Energy, "Since 2021; record in 2024", United States, "More than $100 billion of electric storage batteries and components imported", "Imports reached a record in 2024; no CAGR stated", "S&P Global Market Intelligence Global Trade Analytics Suite, as cited by S&P", High, "Supply-chain exposure across multiple end markets, not buyer spend or EcoFlow revenue"]
    notes: Values retain the publisher's metric, period, geography, and denominator. These are non-comparable lenses; the table intentionally does not sum them or derive TAM / SAM / SOM.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010, CM013]
  - id: TM003
    title: Segment, buyer, and adoption path
    columns: [Segment, Buyer / user, Payer or budget owner, Workflow / channel, Adoption trigger, Evidence limitation]
    rows:
      - [Portable outdoor power, "Camper, overlander, RV user, or mobile professional", "Usually household or individual buyer", "Direct / online purchase of portable station and optional solar accessories", "Mobility and access to power away from an outlet", "Buyer groups are reported by an EcoFlow employee; no segment volumes disclosed"]
      - [Portable outage backup, "Household member managing essential loads", "Household budget owner", "Direct or retail purchase; user charges and connects devices", "Blackout, storm, or other power interruption", "Interview reflects company characterization; outage incidence and conversion are not quantified"]
      - [Plug-in balcony solar, "Tenant or apartment owner with usable outdoor space", "Household", "Retail / online system purchase; self-installation allowed in parts of Europe", "Lower upfront cost, simpler installation, and electricity savings", "German installation counts and payback do not establish EcoFlow share"]
      - [Residential home storage, "Homeowner seeking backup or bill optimization", "Homeowner; electrician / installer may shape purchase", "Equipment sale plus site assessment, installation, certification, and service", "Resilience or time-of-use price optimization", "KRASIA describes the workflow; willingness to pay and conversion rates are not public"]
      - [Off-grid / RV use, "RV owner, off-grid user, or outdoor enthusiast", "Individual or household; actual budget mix is not disclosed", "Portable-system purchase for travel or off-grid power", "Access to electricity away from the grid", "The interview identifies these user types but provides no segment volume or channel economics"]
    notes: Buyer and payer assignments are analytical descriptions of the cited workflows, not measured customer mix. Installation economics, sell-through, and segment-level budgets remain unknown.
    claimRefs: [CM001, CM003, CM004, CM011, CM012, CM014]
