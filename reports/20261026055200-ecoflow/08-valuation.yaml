company:
  name: EcoFlow
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a product and category traction thesis, but does not establish a defensible current entry price. Historical private-market marks are dated and reported second-hand, while audited economics, current financing terms, and a verified exit timetable remain unavailable; the recommendation is research-more.
sections:
  - id: entry-discipline
    title: Recommendation and entry discipline
    body: >-
      Recommendation: research-more, with low confidence in any price conclusion and high
      underwriting risk. PolyU's alumni profile reports an over-US$1 billion valuation
      within four years of founding, while Baidu Baike records a 2023 Hurun valuation of
      RMB 6.9 billion; these are historical reports, not a current entry mark (CV002,
      CV007). The accessible Caplight page now shows a December 2025
      "IPO" row without transaction terms or a valuation; neither is a usable current entry
      mark (CV002, CV004). An Alibaba supplier/sourcing page repeats an approximately
      US$1.0 billion estimate but gives no valuation date or method, so it is not a
      verified current mark (CV015, CV016). The 2025 company-issued CES release attributes a No. 1 global
      smart-home energy storage sales position to Frost & Sullivan and reports a 2026 CES
      award, but supplies no absolute sales figure or market-share denominator (CV005,
      CV006). These are market-position signals, not audited revenue, paid-user retention,
      or unit economics.
      Do not infer current value from reported historical fundraising, category rank, or
      a vendor page's inaccessible fields. The recommendation-logic figure traces these
      proof limits to the decision. Require a current priced financing or cap-table
      extract, audited trailing financials, and warranty / returns data before setting an
      entry ceiling or return target.
    claimRefs: [CV002, CV004, CV005, CV006, CV007, CV014, CV015, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-benchmark
    title: Thesis, anti-thesis, and comparable evidence
    body: >-
      The positive case is a hardware platform that has expanded from portable stations
      into residential storage, with CKGSB's alumni feature describing an early
      demand-validation campaign; it reports that RIVER raised about US$1 million on
      Indiegogo, but pledges are not recognized revenue or proof of repeat demand
      (CV001). The countercase is that category position and international reach do not
      disclose gross margin, service costs, channel contribution, or cash conversion.
      EcoFlow's December 2025 company-issued release attributes a number-one global
      smart-home storage sales ranking to Frost & Sullivan, but gives no share, unit
      denominator, or revenue bridge (CV005). Caplight lists Jackery, Shenzhen Hello Tech, and BLUETTI
      as embedding-similarity comparables, but its visible page shows no market-cap
      figures; those competitor labels are not independent transaction benchmarks
      (CV009). Alibaba's sourcing article names no suppliers or contract terms, so it
      cannot establish procurement scale or channel economics (CV010). The thesis is
      plausible, not yet priceable.
    claimRefs: [CV001, CV005, CV009, CV010, CV012]
    tableRefs: [TV002]
  - id: scenarios-and-exit
    title: Scenarios, exit readiness, and diligence gates
    body: >-
      No numeric bull, base, or bear valuation range or target return can be supported
      from this assigned public evidence: the latest accessible vendor preview omits
      transaction values, and no source provides audited current revenue, margins, cash
      flow, dilution, or preference terms (CV004, CV008, CV014). The scenario table
      therefore makes its operating assumptions and qualitative probability signals
      explicit, while leaving absolute ranges unestimated rather than manufacturing
      multiples. The bear case deserves material weight in diligence because YesPress
      reports a 2025 US recall and property damage and separately describes portable
      power as price-competitive with margin pressure; neither report is independently
      corroborated in this pool (CV011, CV012). Baidu Baike says IPO preparations began
      in 2025, but that report does not establish a filed prospectus, listing schedule,
      or exit liquidity (CV013). Before investment, verify the recall scope and
      remediation, obtain audited segment economics and a fully diluted capitalization
      table, and confirm the issuer's listing status and investor rights.
    claimRefs: [CV004, CV008, CV011, CV012, CV013, CV014]
    tableRefs: [TV003]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Decision item, Assessment, Decision implication]
    rows:
      - [Recommendation, "Research-more", "Do not commit at an unverified price; obtain current financing and operating evidence first."]
      - [Confidence, "Low", "The historical marks and scale indicators do not establish present equity value."]
      - [Risk rating, "High", "Audited economics and current capitalization are absent; one adverse recall account is uncorroborated."]
      - [Valuation stance, "Not rateable from assigned evidence", "Caplight shows no current price; an undated marketplace estimate is not a verified mark."]
      - [Return / hold / exit, "No target return or exit price", "Set only after verifying entry terms, dilution, cash generation, and exit path."]
    notes: >-
      Evidence is limited to assigned prefetched public sources. Historical financing
      reports and company-issued sales-rank claims are not substitutes for audited
      financials or a current financing price.
    claimRefs: [CV002, CV004, CV005, CV007, CV011, CV014, CV015, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Evidence and limitation, What would change the view]
    rows:
      - ["Demand validation", "CKGSB's alumni feature reports about US$1 million raised for the RIVER Indiegogo campaign; campaign proceeds are not revenue or repeat-purchase data.", "Obtain campaign-to-shipment reconciliation, cohort repurchase, and returns data."]
      - ["Category scale", "The company release claims a Frost & Sullivan-backed No. 1 global smart-home storage sales position and reports a CES award, but gives no absolute sales denominator or revenue bridge.", "Verify sell-through, market-share methodology, and contribution margin by product and channel."]
      - ["Financial visibility", "Baidu Baike says 2024 revenue of RMB 8 billion was a projection, not an audited realized result; no assigned source gives gross margin or cash flow.", "Obtain audited statements and reconcile revenue to gross profit, operating cash flow, inventory, and warranty accruals."]
      - ["Competitive position", "Caplight lists similarity-based peers but displays no peer market-cap values; its similarity list is not a valuation comp set.", "Build a peer set from dated transactions with comparable business mix, margins, and capital structure."]
      - ["Downside / execution", "YesPress reports a recall and margin pressure, but neither assertion is corroborated by another source in this pool.", "Verify recall records, claims and remediation, then test warranty costs and price realization."]
    notes: >-
      Arguments distinguish reported signals from audited measures. The evidence set is
      not an exhaustive peer transaction or company-risk enumeration.
    claimRefs: [CV001, CV005, CV006, CV008, CV009, CV011, CV012]
  - id: TV003
    title: Bull / base / bear scenarios
    columns: [Case and probability signal, Explicit assumptions, Valuation range / return logic, Downside trigger and diligence]
    rows:
      - ["Bull — low signal; requires proof", "Home-energy expansion converts reported category position into durable paid demand; gross margin, service costs, and cash conversion prove attractive.", "No supportable numeric range or return multiple; value would require verified growth and margin durability at the actual entry price.", "Fails if sell-through, repeat purchase, or installer economics do not support profitable scale; obtain audited product/channel cohorts."]
      - ["Base — moderate signal; evidence incomplete", "Portable and home-storage products continue to sell, but hardware mix, channel costs, warranty exposure, and financing dilution remain unresolved.", "No numeric range; benchmark the ask only against verified normalized earnings or cash flow and comparable dated transactions.", "Re-rate only after audited statements, current cap table, debt/preference terms, and validated market-share methodology."]
      - ["Bear — material downside signal", "Portable category price competition compresses margins; recall remediation, warranty claims, or a difficult listing process consumes cash or delays liquidity.", "Downside cannot be bounded without current price, balance sheet, debt, and preference waterfall; assume no near-term exit liquidity.", "Trigger: material unresolved safety claims, negative contribution economics, deteriorating cash conversion, or no credible listing path."]
    notes: >-
      Probability signals are qualitative, not estimated probabilities. No absolute
      valuation ranges or return calculations are published because current price,
      audited financial inputs, and capital-structure terms are missing.
    claimRefs: [CV002, CV003, CV007, CV008, CV011, CV012, CV014]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Historical demand and reported scale do not overcome missing current pricing, financial, and risk evidence.
    data:
      nodes:
        - id: historical-proof
          label: "Historical crowdfunding and valuation"
          detail: "Reported RIVER campaign and early private-market marks are historical."
        - id: company-scale
          label: "Company-reported category position"
          detail: "The sales rank is company-issued, not an audited economic measure."
        - id: current-price
          label: "Current entry price unavailable"
          detail: "Caplight's visible page omits transaction values and valuation."
        - id: economics
          label: "Operating economics unverified"
          detail: "Audited margin, cash flow, warranty, and channel data are absent."
        - id: downside
          label: "Adverse signals need verification"
          detail: "Recall and margin-pressure reporting is not independently corroborated here."
        - id: decision
          label: "Research-more before pricing"
          detail: "Obtain current terms, audited economics, recall evidence, and exit status."
    claimRefs: [CV002, CV005, CV007, CV011, CV013, CV014]
callouts:
  - calloutType: recommendation
    title: No supportable entry price
    body: >-
      Treat historical marks and company-reported category position as diligence leads, not as
      valuation inputs; require current price, audited economics, and capitalization
      terms before underwriting a return.
    claimRefs: [CV002, CV004, CV005, CV014]
  - calloutType: risk
    title: Verify adverse evidence before underwriting
    body: >-
      The assigned source pool contains a serious but uncorroborated recall account and
      an unquantified margin-pressure assessment; obtain primary records and company
      remediation data before treating either as established.
    claimRefs: [CV011, CV012]
