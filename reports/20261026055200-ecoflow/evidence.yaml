evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >-
      Audited 2024 and trailing-period financial statements, with revenue recognition, gross margin, operating cash
      flow, inventory, warranty accruals, and debt schedules.
    whyItMatters: >-
      The two assigned 2024 revenue figures use different certainty language and do not establish profitability, cash
      generation, or a defensible current run-rate.
    diligencePath: >-
      Obtain audited statements and management accounts, reconcile reported revenue to filings and tax records, and
      inspect working-capital and warranty schedules.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: revenue
    missingEvidence: >-
      A reconciled primary-source 2024 revenue figure and a clear distinction between realized revenue, analyst
      projection, and any forward run-rate.
    whyItMatters: >-
      KRAsia reports RMB 8 billion of 2024 revenue while TMTPost reports an analyst projection around RMB 7 billion;
      neither source establishes audited results.
    diligencePath: >-
      Request audited financials and a revenue bridge by period, product family, geography, and channel; do not relabel
      either amount as ARR.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: >-
      A complete financing chronology, current cap table, shareholder rights, secondary transactions, and debt or
      supply-chain credit exposures.
    whyItMatters: >-
      Reported 2021 round size and historical valuation do not establish cash available, fully diluted ownership,
      investor control, or liquidation preferences.
    diligencePath: >-
      Review signed financing documents, cap-table history, bank debt, factoring and supplier-finance agreements, and
      current cash statements.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: leadership
    missingEvidence: >-
      Current executive and board roster, named co-founders, reporting lines, founder ownership, and
      succession/retention data.
    whyItMatters: >-
      The sources identify Wang Lei and a founding battery-engineering group but do not show leadership depth or
      governance controls.
    diligencePath: >-
      Obtain the current organization chart, board minutes, executive biographies, equity schedules, and key-person
      succession plans.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
      - TO003
  - type: access-blocked
    severity: material
    topic: product-safety
    missingEvidence: >-
      The full 2026 CPSC recall notice, affected-unit count, incident and injury data, remedy, completion rate, and
      related warranty claims.
    whyItMatters: >-
      The assigned page title signals a serious burn and fire hazard, but the newly fetched body contains only general
      CPSC boilerplate and cannot substantiate operational scope.
    diligencePath: >-
      Review the complete CPSC notice and EcoFlow remediation records, then reconcile units sold, returned, repaired,
      firmware-updated, and still exposed.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: minor
    topic: company-scale
    missingEvidence: >-
      Dated, independently verifiable active-customer and employee counts, plus a definition and period for the
      company's 140+ countries-and-regions statement.
    whyItMatters: >-
      Geographic availability is not a customer denominator, and current scale cannot be compared or translated into
      retention and support burden without definitions.
    diligencePath: >-
      Request audited employee and customer cohorts, country-level sales and active-user definitions, and third-party
      corroboration for each reported date.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      A current, methodologically transparent market estimate for portable power stations and residential storage with
      separable geographies, units, and customer segments.
    whyItMatters: >-
      Without category denominators, public proxies cannot support an EcoFlow TAM/SAM/SOM or a defensible growth
      multiple.
    diligencePath: >-
      Obtain the underlying analyst reports and EcoFlow's segment-level unit, revenue, and channel data; reconcile
      product categories and installation revenue to a defined geography and period.
