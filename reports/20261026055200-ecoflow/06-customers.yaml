company:
  name: EcoFlow
chapter:
  number: 6
  title: Customers
  summary: >-
    EcoFlow's public evidence spans portable-power buyers, residential backup and
    solar users, and a newly announced European commercial segment. First-party
    materials report millions of users but do not establish active or paying
    customers, named production deployments, retention, or channel economics.
sections:
  - id: customer-segments
    title: Buyers, use cases, and route to market
    body: >-
      EcoFlow serves several different purchase contexts rather than one
      interchangeable customer base. TechCrunch's 2022 coverage describes portable
      stations for outdoor recreation and home backup, and quotes the CEO on serving
      customers in Japan and the United States; it also reports that the company
      shipped to more than 100 markets at that time. A 2023 pv magazine report
      describes PowerStream as a plug-and-play balcony-solar offer available for
      online purchase, with configurations ranging from no storage to 2 kWh of
      storage. In June 2026, EcoFlow announced residential storage and its first
      European commercial-and-industrial portfolio. Those are different buyers,
      installation burdens, and use cases; the evidence does not support assigning
      revenue or customer counts to any segment. Public reporting also describes
      online and crowdfunding routes, while installer involvement becomes more
      relevant to whole-home systems. Channel contribution, retail sell-through,
      and the share of installations completed by partners remain undisclosed.
    claimRefs: [CU006, CU007, CU010, CU014]
    tableRefs: [TU001]
  - id: adoption-evidence
    title: Adoption signals are not a retention record
    body: >-
      The available indicators describe different populations and cannot be combined
      into a continuous customer-growth series. TechCrunch reported campaign
      proceeds for three crowdfunding launches: approximately $1 million for RIVER,
      approximately $2.8 million for DELTA, and more than $12 million for DELTA Pro.
      Those are campaign amounts, not counts of shipped or active customers. A
      TMTPost article reports a 25.8% share of global portable-energy-storage sales
      by revenue in 2024, based on unspecified industry data; market share is not a
      customer denominator. EcoFlow's December 2025 release said it served more than
      500,000 home-energy users, while a June 2026 release described more than 6
      million users across 140 markets. The latter company-wide user measure is not
      defined as active, paying, or unique and should not be treated as a home
      customer count. Neither the user claims nor the campaign and share measures
      disclose repeat purchase, product utilization, cohort retention, churn, or
      expansion rates.
    claimRefs: [CU002, CU003, CU008, CU009, CU015]
    tableRefs: [TU002]
  - id: customer-proof-and-durability
    title: Customer references and durability gaps
    body: >-
      Named public evidence is thin relative to the scale implied by company-wide
      user claims. The 2026 Home Upgrade Program release names Footprint Project and
      Convoy of Hope as nonprofit disaster-response partners and describes
      community contributions; it does not present a named household deployment or
      independently measured outcome. EcoFlow's CES page displays user comments
      under masked handles and a selection of named energy commentators, but these
      are company-hosted promotional references rather than independently verified
      production-customer case studies. A Reddit discussion includes both positive
      ownership reports and critical accounts of support and product issues. It is
      anecdotal and self-selected, so it cannot establish complaint prevalence or
      company-wide service quality. No assigned source supplies NRR, GRR, churn,
      renewal, repeat-purchase cohorts, customer concentration, or channel
      economics. Investors should treat installed base durability and named
      deployment outcomes as open diligence items, not as negative or positive
      facts inferred from silence.
    claimRefs: [CU001, CU004, CU011, CU012, CU013, CU015]
    tableRefs: [TU003]
    figureRefs: [FU001]
