schemaVersion: "report-v2"
artifact: financials
slug: ecoflow
runDate: 2026-10-26
company:
  name: EcoFlow
chapter:
  number: 4
  title: Financials
  summary: >-
    Secondary coverage reports EcoFlow's 2024 revenue at RMB 8 billion (USD 1.1
    billion), while another source labels the same figure a projection; neither
    provides audited financial statements. Crowdfunding and a reported IPO
    consideration are financing signals, not recognized revenue or cash on
    hand, leaving profitability, unit economics, and capital adequacy
    un-underwritten.
sections:
  - id: revenue-quality
    title: Reported scale is not yet verified revenue quality
    body: >-
      EcoFlow's official US and global pages describe portable power, solar,
      and home-energy products, but disclose no product-family revenue mix
      (CI001). KrASIA reports 2024 revenue of RMB 8 billion (USD 1.1 billion),
      while Baidu Baike describes RMB 8 billion as a 2024 projection with
      approximately 80% year-on-year growth (CI003, CI004). Baike separately
      reports revenue above RMB 3 billion in the first half of 2023 and says
      more than 95% of revenue came from overseas markets, without specifying
      the period for that share (CI005, CI006). The reported-versus-projected
      framing is not reconciled in the assigned evidence, and none of these
      secondary figures is accompanied by an audited statement. They support a
      scale hypothesis, not a conclusion about recognized revenue, growth
      quality, or margins.
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI005
      - CI006
      - CI014
    tableRefs:
      - TI001
    figureRefs:
      - FI001
  - id: pricing-and-channels
    title: Public offers and channel examples do not reveal realized economics
    body: >-
      The assigned sources document EcoFlow's owned US storefront, historical
      crowdfunding, and third-party descriptions of retail and marketplace
      routes, but do not quantify current channel shares (CI002). The
      storefront advertises a 5% sign-up discount and "$1,000+ exclusive
      coupons"; those promotions are not an average selling price or evidence
      of discounts actually redeemed (CI007). Campervan HQ lists launch-era
      prices for RIVER, DELTA, and DELTA Pro in 2018, 2019, and 2021,
      respectively, but these dated figures are not current realized prices
      (CI008). The SolarLab account says a DELTA Pro Kickstarter campaign
      raised more than US$12 million; that campaign total is not reported as
      recognized sales, gross profit, or cash currently available (CI009).
      Underwriting therefore needs net prices and channel-level sell-through,
      returns, payment terms, and customer acquisition data rather than
      extrapolation from promotional copy or launch campaigns.
    claimRefs:
      - CI002
      - CI007
      - CI008
      - CI009
    tableRefs:
      - TI002
  - id: cost-structure-and-unit-economics
    title: Margin drivers are visible, but company-level costs are not
    body: >-
      KrASIA describes a portable-storage price war and slower upgrade demand,
      as well as home-storage requirements for logistics, on-site installation,
      and after-sales support (CI012, CI016). These are plausible pressure
      points for pricing and cost-to-serve, but the article does not quantify
      EcoFlow's discounting, installer take rates, or contribution margin.
      Energy-Storage.news reported a 2024 US policy announcement scheduling
      25% tariffs on non-EV lithium-ion batteries from China for 2026; the
      article does not establish current implementation or EcoFlow's product-
      level exposure (CI013). The assigned CPSC URL returned general agency
      information, not product-specific recall details, so recall scope and
      financial impact remain unverified (CI015). The evidence set contains
      no audited gross margin, CAC/payback, working-capital, or cash-conversion
      figures (CI014); hardware scale alone cannot establish a margin path.
    claimRefs:
      - CI012
      - CI013
      - CI014
      - CI015
      - CI016
    tableRefs:
      - TI003
  - id: capital-adequacy
    title: Historical funding and a possible IPO do not establish liquidity
    body: >-
      Fobi lists US$104 million in total funding, and Tech in Asia reports that
      EcoFlow last raised more than US$100 million in 2021 (CI010). These
      retrospective records describe capital raised, not cash remaining,
      debt, or runway. Tech in Asia reported on 17 December 2025 that EcoFlow
      was considering a US IPO that might raise at least US$300 million,
      subject to Chinese regulatory approval and possible changes to the
      details (CI011). That was a reported proposal, not a completed offering
      or available proceeds. The assigned evidence does not establish current
      cash, operating burn, borrowing or supply-chain finance, planned use of
      proceeds, or the next financing trigger (CI014). Capital adequacy should
      therefore remain unresolved until management records and audited
      statements reconcile liquidity needs with inventory, expansion, and
      service obligations.
    claimRefs:
      - CI010
      - CI011
      - CI014
tables:
