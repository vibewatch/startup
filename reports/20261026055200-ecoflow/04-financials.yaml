        - Company pages describe the portfolio, not family-level sales
        - Revenue, volume, and gross margin by product family
      - - Reported revenue
        - RMB and USD; 2024
        - RMB 8 billion (USD 1.1 billion), reported by KrASIA
        - Secondary reporting; no audited statement in the assigned text
        - Audited revenue and recognition policy
      - - Projected revenue
        - RMB; 2024
        - RMB 8 billion, approximately 80% year-on-year growth, described as a projection by Baidu Baike
        - Secondary source; status differs from KrASIA's reported framing
        - Reconcile forecast and actual revenue against audited accounts
      - - Revenue
        - RMB; first half of 2023
        - Exceeded RMB 3 billion, according to Baidu Baike
        - Secondary source; no audited period statement
        - Period financials and revenue by geography and channel
      - - Overseas revenue share
        - Percent of revenue; period unspecified
        - More than 95%, according to Baidu Baike
        - Secondary source; period and calculation basis not stated
        - Revenue denominator, period, and regional breakdown
      - - DELTA Pro crowdfunding
        - USD; campaign in 2021
        - More than US$12 million raised, according to The Solar Lab
        - Partner-oriented historical account; not recognized-revenue evidence
        - Reconcile receipts, refunds, delivery obligations, and revenue recognition
    notes: >-
      Public figures are attributed secondary reports, not audited results.
      Null means the assigned sources do not provide a usable figure; the
      crowdfunding amount is kept separate from revenue.
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI005
      - CI006
      - CI009
  - id: TI002
    title: Pricing and monetization evidence
    columns:
      - Route or offer
      - Price basis
      - Public evidence
      - Unknown economics
      - Diligence ask
    rows:
      - - Direct online
        - Current product prices and realized net price
        - Official US storefront is available; product-level realized prices are null in the fetched page
        - Promotions, conversion, returns, fulfillment, and payment fees
        - Net price and contribution by product and customer cohort
      - - Website promotion
        - Advertised sign-up offer
        - 5% off and "$1,000+ exclusive coupons" on the official US page
        - Coupon terms, redemption, eligible products, and realized discount
        - Redemption and net-price data by campaign
      - - Launch-era product prices
        - US dollars; RIVER 2018, DELTA 2019, DELTA Pro 2021
        - Campervan HQ lists $513, $1,760, and $3,600, respectively
        - Historical published prices; current price and discounting not established
        - Current list, realized, and promotional prices by SKU and geography
      - - Retail, marketplace, and installer routes
        - Wholesale, marketplace, or installed-system terms
        - Third-party sources describe such routes but provide no channel shares or fees
        - Sell-through, retailer terms, installer take, service, and warranty costs
        - Revenue, inventory ownership, and fully loaded contribution by channel
    notes: >-
      The historical launch prices are not current realized prices. Website
      promotions are not assumed to be redeemed, and no channel share is
      inferred from examples.
    claimRefs:
      - CI002
      - CI007
      - CI008
  - id: TI003
    title: Unit economics and capital diligence
    columns:
      - Metric
      - Public value
      - Period or basis
      - Underwriting relevance
      - Specific diligence request
    rows:
      - - Gross margin by product family
        - null
        - Not disclosed in assigned sources
        - Tests whether hardware revenue converts into sustainable gross profit
        - Audited gross-margin bridge by SKU, geography, and channel, including warranty accruals
      - - CAC, payback, and channel contribution
        - null
        - Not disclosed in assigned sources
        - Tests whether DTC, retail, and installer routes scale economically
        - Cohort CAC, conversion, promotion, return, fulfillment, and channel-fee data
      - - Inventory and working capital
        - null
        - Not disclosed in assigned sources
        - Battery inventory, deposits, and delivery timing may absorb cash
        - Monthly inventory aging, supplier terms, deposits, and cash-conversion cycle
      - - Cash, burn, runway, and debt
        - null
        - Not disclosed in assigned sources
        - Historical funding and a possible IPO do not establish present liquidity
        - Latest balance sheet, cash-flow forecast, debt and supplier-finance schedules, and use of funds
      - - Recall and warranty exposure
        - null
        - Product-specific CPSC detail missing from fetched text
        - Remediation, warranty, and insurance costs could affect margin and working capital
        - Full recall notice, affected-serial data, remediation status, claims, reserves, and insurance
    notes: >-
      No assigned source provides audited values for these private-company
      metrics. Null means unavailable in the reviewed pool, not zero.
    claimRefs:
      - CI013
      - CI014
      - CI015
      - CI016
