company:
  name: Cosm
chapter:
  number: 6
  title: Customers
  summary: 'Cosm now has stronger external customer proof than in the prior report cycle: independent coverage confirms a three-venue operating network by July 2026, 40 World Cup group-stage matches across those venues, and more than 1,000 fans for one opening-day event. The company also shows some institutional-client reach, but public durability data—repeat visitation, churn, renewals, concentration, and venue-level economics—remains absent, so the customer story is directionally positive rather than fully underwritten.'
sections:
- id: customer-base
  title: The customer base is multi-sided, but owned venues are still the clearest monetization engine
  body: Cosm's public customer story has two layers. The first is the owned-venue model that sells ticketed experiences directly to fans, households, memberships, and group-event organizers; this is the most visible revenue surface because the October 2026 site is built around event calendars, memberships, and venue/group-booking flows. The second is the enterprise/institutional business that sells immersive technology and content into science centers, museums, theaters, attractions, and education operators. That mix matters because it means headline adoption claims combine consumer attendance with B2B deployments. Public materials support the existence of both segments, but only the owned venues currently offer fresh, externally checkable demand signals.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-proof
  title: Independent adoption proof has improved, though the datapoints are still shallow
  body: 'The refresh is stronger than a pure logo story because third-party reporting now shows real, dated activity. By July 2026 Cosm had three operating venues—Los Angeles, Dallas, and Atlanta—and Sports Video Group documented both a 40-match World Cup slate and more than 1,000 fans across the three venues for one opening-day match. Dell''s 2025 partner write-up adds programming breadth across major sports and immersive cinema, while the October 2026 homepage shows the footprint has kept moving with Detroit marketed as live and Cleveland still queued. Even so, these are operating and programming signals, not customer-economics proof: they demonstrate that people and counterparties are showing up, but not how often they return, what they spend, or which customer cohorts are most profitable.'
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  - CU011
  tableRefs:
  - TU002
  - TU003
- id: durability-and-concentration
  title: Durability and concentration remain the central unresolved diligence items
  body: 'The weakest part of the chapter is not top-of-funnel awareness; it is durability. The reviewed sources do not disclose repeat visitation, NRR, GRR, churn, renewal terms, satisfaction cohorts, or venue-level spend behavior, so there is still no public way to separate one-time curiosity from durable habit. Concentration is also opaque. The visible proof still clusters around a small set of owned venues and a short list of marquee counterparties, while the named institutional deployment list is thin. UpMarket''s cautionary framing of the company as a speculative, illiquid private investment reinforces that external observers still lack a rich KPI set. Net: traction is real enough to track, but not yet transparent enough to underwrite on customer quality alone.'
  claimRefs:
  - CU010
  - CU012
  - CU013
  - CU014
tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public proof
  - Strategic value
  - Gap
  rows:
  - - Owned-venue fans
    - 'Buyer=user=payer: individual ticket holder or membership household'
    - Live sports, immersive cinema, arts, and entertainment visits
    - Official event calendars, memberships, and venue FAQs
    - Most visible monetization surface and the clearest recurring-demand engine
    - No repeat-visit, occupancy, or spend-per-capita disclosure
  - - Groups / private events
    - 'Buyer: organizer; users: attendees; payer: corporate or social host'
    - Venue rentals, hospitality, and private event packages
    - Official "Plan Your Event" flows across venue pages
    - Higher-value monetization beyond single-event tickets
    - No disclosed group-sales mix or attach rates
  - - Institutional operators
    - 'Buyer: science center / museum / attraction operator; users: venue guests and students'
    - CX System deployment, dome refresh, and immersive educational programming
    - Official client narrative plus the Fort Worth Omnimax example
    - B2B diversification outside owned sites
    - Named deployment list remains sparse
  - - Media / content counterparties
    - 'Buyer/partner: leagues, broadcasters, and studios; users: venue audiences'
    - Rights, immersive production, and IP extension into venues
    - World Cup with FOX/FIFA/HBS; NBA and Sony-backed content expansion rationale
    - Keeps the venue calendar fresh and can support repeat traffic
    - Economics versus ticket demand are not publicly disclosed
  notes: Partial segmentation from public pages and interviews; rows mix direct-paying consumers with enterprise counterparties because Cosm sells both venue access and immersive infrastructure/content.
