chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              指定证据表明，Cosm 不应被视为一家只经营单一场馆的好奇项目。公司自有材料和独立报道始终将其描述为一家以 Shared Reality
              场馆建立的私营沉浸式技术、媒体与娱乐运营商；其技术网站还显示，管理层销售的体系更广，覆盖穹顶硬件、可视化软件、媒体制作和合作伙伴部署。这个区分会影响后续整篇报告：后续章节不应把 Cosm
              仅仅定义为本地景点生意，因为公司明确试图同时变现自营场馆和底层平台。


              公司起源也解释了为何其叙事同时混合场馆、软件和媒体语言。独立报道将 Cosm 的成立追溯到 2020 年收购 Evans & Sutherland
              及相关沉浸式资产，而不是从一座旗舰场馆白手起家。实际尽调要回答两个相互关联的问题：场馆扩张能否造出持久的消费目的地；技术 / 媒体体系能否产生足够的第三方杠杆，使公司配得上平台估值，而不只是按单一场馆估值。
