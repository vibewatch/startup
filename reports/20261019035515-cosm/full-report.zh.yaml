figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 已分配的公开证据显示，Cosm 从 2020 年的沉浸式技术整合平台，发展为拥有联赛 / 广播合作关系、并完成 Sony 领投 2026 年战略融资轮的双场馆运营商。
    data:
      items:
        - date: '2019'
          label: Jeb Terry 加入 Mirasol
          detail: SBJ 称，Terry 于 2019 年加入 Steve Winn 的 Mirasol，担任董事总经理，之后负责 Cosm。
          tone: neutral
        - date: '2020'
          label: Cosm 围绕 E&S 正式成立
          detail: SBJ 称，Mirasol 的一家关联公司以 $14.5M 收购 Evans & Sutherland，Cosm 于 2020 年正式成立。
          tone: positive
        - date: '2020'
          label: LiveLike VR 加入平台
          detail: SBJ 称，同一关联公司于当年晚些时候收购 LiveLike VR，扩展了沉浸式媒体技术栈。
          tone: positive
        - date: Early 2023
          label: NBA 成为早期旗舰合作伙伴
          detail: SBJ 称，Cosm 于 2023 年初首先与 NBA 签约，之后又加入 UFC 及更多广播合作关系。
          tone: positive
        - date: June 2024
          label: 洛杉矶场馆开业
          detail: SBJ 称，Hollywood Park 场馆于 6 月开业，成为首个面向公众的 Shared Reality 场馆。
          tone: positive
        - date: July 2024
          label: 成长融资扩大铺设规模
          detail: 独立报道显示，Cosm 于 2024 年 7 月融资超过 $250M；SBJ 称，该轮融资对公司的估值超过 $1B。
          tone: positive
        - date: September 2024
          label: The Colony 场馆开业
          detail: SBJ 称，第二座设施在 Dallas 郊外开业，公司由一个场馆扩展至两个。
          tone: positive
        - date: June 2026 report
          label: 据报道 Atlanta 是第三座运营场馆
          detail: Vitrina 报道称，Cosm 在 Inglewood、North Dallas 和 Atlanta 运营场馆。
          tone: positive
        - date: June 2026
          label: Sony 领投 Series C
          detail: NBC 报道称，Sony 进行了 $100M 的战略投资；外部分析称 Ravi Ahuja 加入董事会。
          tone: positive
    approximationNotes: null
