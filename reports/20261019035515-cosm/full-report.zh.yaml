              Cosm
              的财务设置在一个狭窄意义上具有吸引力：公司已筹集有意义的战略资本，并且在入场、接待、媒体和技术之间拥有多个变现杠杆。问题是，这里保留的公开来源都没有足够运营细节，无法把这个故事转化为对收入质量、贡献利润率或自我融资扩张能力的可投资判断。在管理层披露各场馆经济性、合并收入、烧钱和融资义务之前，正确的投资判断是把资本充足性视为尽调阻塞项，而不是已经解决的优势。
