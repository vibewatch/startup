        - 需要披露投后估值、单场馆 EBITDA，以及 Atlanta / Detroit 扩张能转化为可复制经济模型的证据。
      - - 基准情景
        - 增长延续，但公开披露仍然有限，投资者依赖战略验证，而不是单店经济模型证据。
        - 把 2024 年 $1 billion 的标记值当作已经过时的上限，而不是当前投资判断锚点；继续保持观察纪律。
        - 持有周期长、稀释情况不透明、场馆盈利能力不确定。
        - 这是目前与保留证据最一致的情景。
      - - 悲观情景
        - 复访或客均消费令人失望，扩张消耗更多资本，后续投资者要求更苛刻的条款。
