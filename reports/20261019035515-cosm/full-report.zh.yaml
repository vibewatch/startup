              - CV009
              - CV011
              - CV012
              - CV015
      - number: '8.2'
        title: 投资逻辑、反向逻辑与情景框架
        blocks:
          - type: paragraph
            body: >-
              乐观情景依赖平台广度，而非单一穹顶。AV Magazine 称 Cosm 计划用 2024 年资本扩大运营卓越、技术和媒体部门，并加速全球落地；Cosm
              技术网站则称自营场馆是现场环境，先在此打磨表现，再把能力交付给合作伙伴。消费者网站补充了早期团体销售和座位餐饮服务，说明每次到访不止一个变现杠杆；MarketScale
              访谈则认为内容片单可以覆盖体育、戏剧、艺术和自有媒体。反向逻辑是，保留的公开来源都没有披露场馆层面到场人数、重复到访、餐饮贡献、场馆 EBITDA 或 2026
              年投后估值，因此投资者看得到增长雄心，却尚未证明能带来持久的现金回报。
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV015
      - number: '8.3'
        title: 尽调问题、退出触发条件与改变判断的因素
        blocks:
          - type: paragraph
            body: >-
              下一步尽调应把叙事证据替换成投资判断证据。公开来源显示 Cosm 能够筹集战略资本、仍在开设和营销更多场馆，并拥有可将票务与接待结合的消费者模式；但公开来源对 2026
              年融资轮次命名存在分歧，二级市场页面仍警告流动性低、转让限制和不可预测的退出。要从观察升级，必须取得 C
              轮投后估值、出售股权比例、清算及其他优先条款、各场馆建设成本和回本周期，以及重复到访加餐饮附加率能够抵消资本开支和内容版权强度的证据。如果这些披露继续保持私有，持有期过长、稀释风险和倍数压缩仍将是主要下行触发因素。
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.4'
        title: 展品
        blocks:
          - type: callout
            title: 观察，不买入
            body: 最强的公开信号是融资获取，而不是可投资的价格清晰度。在披露 C 轮投后估值和优先股堆叠之前，公开记录支持加入观察清单，而不是激进入场。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
          - type: callout
            title: 上行逻辑是平台逻辑
            body: Cosm 的上行空间取决于证明场馆体验、面向合作伙伴的技术和媒体版权在经济上相互强化，而不只是沉浸式活动能吸引注意力。
            calloutType: insight
            claimRefs:
              - CV004
              - CV009
              - CV010
              - CV011
              - CV014
          - type: callout
            title: 流动性是估值风险的一部分
            body: 即使公司持续增长，当前公开访问似乎仍局限于流动性低的二级交易，可能附带转让限制和较长持有期，因此外部投资者今天不应为多少估值溢价做投资判断。
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV015
