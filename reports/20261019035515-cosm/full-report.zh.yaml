      - number: '1.2'
        title: 领导层、资本与治理
        blocks:
          - type: paragraph
            body: >-
              公开露出的领导层信息高度集中在 CEO Jeb Terry 身上。他的履历结合了体育媒体运营经验、在 Fox 从事新兴技术的经历，以及与早期支持者 Steve Winn
              的密切关系。对于一家试图把现场体育版权、场馆运营和定制制作技术结合起来的公司，这种组合在战略上是连贯的，但也带来明显的关键人物依赖：产品方向、合作伙伴获取和融资的公开叙事，都异常集中于 Terry
              及聚集在他周围的赞助方网络。


              股权结构表也在随时间改变。独立报道显示，Mirasol 和以体育为中心的金融投资者支持了 2024 年超过 $250 million 的融资，随后 Sony Pictures 于 2026 年 6 月领投
              $100 million C 轮。Sony 的加入不只是现金问题：外部分析称 Ravi Ahuja 因此加入董事会，这提高了 Cosm
              内容管线的战略价值，同时也增加治理复杂度，因为一家主要版权方现在对场馆平台拥有董事会影响力。
            claimRefs:
