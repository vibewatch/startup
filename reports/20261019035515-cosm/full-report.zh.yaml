      - number: '4.2'
        title: 资本结构与融资依赖
        blocks:
          - type: paragraph
            body: >-
              最强的公开财务证据是融资势头，而不是运营披露。AV Interactive 报道 Cosm 于 2024 年 7 月融资超过 $250 million，用于扩张场馆、技术和媒体业务；NBC News 报道
              Sony Pictures 于 2026 年 6 月领投 $100 million C 轮，并取得少数股权。这些融资说明公司仍能获得战略资本，但没有解决投资判断最关心的问题：公开证据中没有 2026
              年投后估值、出售股权比例、清算优先权、债务义务和现金跑道。UpMarket 作为市场结构来源很有帮助：它称最新一轮估值未披露，二级市场购股不会为公司带来新资本。因此，融资故事方向积极，但结构上并不完整。
