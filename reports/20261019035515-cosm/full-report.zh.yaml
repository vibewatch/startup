      - number: '1.3'
        title: 里程碑、规模信号与待解问题
        blocks:
          - type: paragraph
            body: >-
              里程碑顺序足以证明公司确实拥有执行势头。指定来源追踪了 Cosm 从 2020 年整合，到联赛和转播交易，再到 2024 年洛杉矶开业以及 The Colony（德州）的第二座场馆。2026 年 6
              月的一篇分析随后称 Atlanta 是 Cosm 的第三座运营场馆。独立报道还记录了激进的扩张意图，包括在本十年末达到 50 个场馆的目标。这一进展方向积极，说明 Cosm
              正从概念验证走向机构融资和多地落地；但指定证据池无法独立核实 2026 年 6 月之后的开业情况。


              同一组证据也保留了核心投资判断缺口。公开来源仍未披露经核实的当前收入运行率、客户数、场馆层面到场经济性、重复到访，或与 2026
              年融资轮相匹配且干净的当前估值。因此，本章建立的是可复用的身份、资本时间线和领导层事实，而不是把缺失的运营指标包装成虚假的精确数字。这些仍是尽调问题，不是本章事实。
