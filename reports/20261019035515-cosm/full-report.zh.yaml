      - number: '3.2'
        title: Sony 支持的分发杠杆是现有玩家的主要压力点
        blocks:
          - type: paragraph
            body: >-
              Cosm 当前最容易守住的优势不在场馆数量，而在 Sony 领投 C 轮和 Ravi Ahuja 获得董事会席位后形成的战略杠杆。Variety 和 NBC 都将该交易描述为一笔带治理权的 $100
              million 少数股权投资；Variety 还称 Sony 希望在这一形式中测试特许经营 IP。Vitrina 将其解读为对 IMAX
              高端放映既有地位的直接挑战，因为一家制片厂合作伙伴现在同时影响内容供给和场馆开发。威胁仍有条件：Cosm 的网络远小于传统院线覆盖范围，且证据池没有显示已披露的排他协议。但证据确实说明，其他影院运营商已不能再把
              Cosm 当作只在屏幕质量上竞争的中立场馆运营商。
