  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Cosm 不销售头戴设备产品，也不是传统电影院的票房生意。公司和第三方报道始终将 Shared Reality
              定义为一种基于场馆的集体沉浸体验，争夺介于现场观赛、高端场外观看和部分沉浸式媒体使用场景之间的消费。官网和公司介绍还把边界从体育扩展到娱乐、艺术、科学与教育以及景点；场馆设计也把变现面从单一售票屏幕扩宽，因为每个场馆都包括
              Dome、Hall 和 Deck。因此，相关替代品不止直接的穹顶竞争者：昂贵或难以获得的现场活动、高端影院、体育酒吧和 VR 式沉浸体验，都在买方比较范围内。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
