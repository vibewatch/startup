  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与公开变现
        blocks:
          - type: paragraph
            body: >-
              公开材料支持一种以场馆为中心的运营模式，而不是纯软件或订阅公司。Cosm 官网销售多个场馆的体育和娱乐售票内容；第三方资料则将主要消费者经济性描述为入场费加场内餐饮消费。同样的来源还指向技术系统、穹顶部署以及媒体
