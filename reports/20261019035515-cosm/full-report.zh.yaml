      - number: '3.3'
        title: 持续性仍取决于版权获取和未披露的场馆经济性
        blocks:
          - type: paragraph
            body: >-
              护城河逻辑目前更多是战略性的，而非已被证明。指定独立分析认为，现场体育版权是谈判取得的准入，而不是自有资产，并明确指出场馆层面的财务回报尚未公开披露。因此，当前优势最容易从买方体验和分发角度描述，最难从重复到访、定价能力或利润率持续性角度做投资判断。官方和行业来源确实显示，其内容组合比只放电影的影院更广，产品体系也比单一场馆连锁更宽，这会提高既需要沉浸式硬件又需要编程的制片厂和场馆伙伴的切换成本。但指定证据仍不足以证明，脱离持续的高端版权、资本和高流量不动产，业务就能规模化。
