              屏幕上。客户购买的是一种高端场外体验，可替代被动居家观看或一次性的特殊活动出行，而不是一个独立应用。官方场馆设计也把接待纳入产品：Dome 是核心观看环境，Hall 和 Deck
              则延长停留时间，支持团体使用，并在同一次到访中承载更多内容。
