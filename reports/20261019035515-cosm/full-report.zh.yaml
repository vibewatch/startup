  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合不止高端影院
        blocks:
          - type: paragraph
            body: >-
              指定来源将 Cosm 同时描述为面向消费者的 Shared Reality
              场馆和沉浸式场馆技术供应商。这一点很重要，因为买方可以用多种方式解决同一需求：去看高端大格式放映，选择以接待为核心的影院或体育酒吧替代品，或者自己投资建设沉浸式场馆，而不是接入 Cosm 的场馆网络。Cosm
              自己的定位也明确带有比较意味。FAQ
              称，这种形式区别于电影院和其他场馆，因为体验是集体的、环绕式的、无需头戴设备；技术页面则销售面向景点、沉浸式影院和活动空间的定制方案。换言之，竞争集合覆盖影院运营商、社交观看替代品，以及自建还是采购的场馆基础设施供应商，而不是单一影院类别。
