  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 公开支持已从资本验证提升至值得观察，但还不足以买入，因为价格和单店经济模型仍未披露。
    data:
      nodes:
        - label: 战略验证
          detail: Sony 领投 2026 年 6 月的 Series C，投资 $100M 并取得少数股权。
          tone: positive
        - label: 增长平台
          detail: Cosm 同时推进场馆铺设、技术扩张和媒体扩张。
          tone: positive
        - label: 变现广度
          detail: 门票、团体销售和座位餐饮构成不止一个需求杠杆。
          tone: positive
        - label: 定价缺口
          detail: 公开来源仍未披露 2026 年投后估值或优先股堆叠。
          tone: risk
        - label: 流动性约束
          detail: 老股交易仅面向合格投资者，缺乏流动性，且面临不确定的退出。
          tone: risk
        - label: 建议
          detail: 在条款和场馆经济模型披露、足以形成可评估的入场点前，继续观察。
          tone: warning
    claimRefs:
