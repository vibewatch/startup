              - CI011
              - CI012
      - number: '4.3'
        title: 单位经济性与披露盲区
        blocks:
          - type: paragraph
            body: >-
              公开记录缺少检验收入质量和利润路径所需的指标。在保留的来源集合中，没有披露当前收入、ARR、毛利率、场馆贡献利润率、烧钱速度、现金余额或现金跑道，也没有公开的场馆层面到场或重复到访数据来帮助投资者建模利用率。最好的运营代理指标是活动规模——运营中的场馆、已宣布的扩张、团体活动销售、接待人员配置，以及第三方招聘网站列出的
              752 名员工——但这些都不能替代经审计财务数据。因此，本章结论很直接：商业模式是可理解的，但单位经济性仍大多属于私有信息。
