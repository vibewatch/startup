          x: 4
          'y': 2
          note: 装机基础庞大，但已分配证据未显示 Sony 治理杠杆
        - label: Alamo Drafthouse
          x: 2
          'y': 3
          note: Sony 持有、经策划并配有餐饮服务的影院，但不是沉浸式穹顶
        - label: 标准多厅影院
          x: 1
          'y': 1
          note: Vitrina 对比中的传统放映基准
        - label: 体育酒吧 / 家庭社交替代方案
          x: 1
          'y': 1
          note: 拥有共享氛围，但没有穹顶沉浸感或渠道控制
        - label: 内部建设 / 沉浸式项目
          x: 4
          'y': 5
          note: 若买方自行出资建设，控制力高，但不包含品牌化观众网络
    approximationNotes: 评分是根据已分配来源综合得出的序数判断，不是实测基准。
    claimRefs:
      - CP001
      - CP003
      - CP010
      - CP011
      - CP014
      - CP015
  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 公开证据支持一条由场馆驱动的收入链：从节目需求转化为门票收入和场内消费，技术与媒体业务是额外收入来源，而非已披露的独立利润引擎。
    data:
      nodes:
        - id: rights-programming
          label: 版权与节目组合
          note: 体育、娱乐和沉浸式内容吸引到访。
        - id: venue-traffic
          label: 购票到场
          note: 活动填满 Dome 及相关空间后，需求转化为门票收入。
        - id: hospitality
          label: 场内餐饮
          note: 餐饮消费提高单次到访收入，但公开信息没有客单价数据。
        - id: tech-media
          label: 技术与媒体服务
          note: 第三方来源描述了穹顶系统、软件和内容业务。
        - id: gross-revenue
          label: 总收入池
          note: 公开来源暗示收入由门票、餐饮、技术和媒体收入构成。
        - id: contribution
          label: 贡献利润率与现金需求
          note: 由于收入、毛利率和烧钱速度均未披露，无法评估利润率转化。
      edges:
        - from: rights-programming
          to: venue-traffic
          label: 驱动需求
        - from: venue-traffic
          to: hospitality
          label: 提高单次到访消费
        - from: venue-traffic
          to: gross-revenue
          label: 门票收入
        - from: hospitality
          to: gross-revenue
          label: 附加消费
        - from: tech-media
          to: gross-revenue
          label: B2B 与内容收入
        - from: gross-revenue
          to: contribution
          label: 利润率转化未知
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI007
      - CI010
      - CI013
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Cosm 的公开产品栈从版权与内容采集开始，经由渲染技术，延伸至自有场馆和合作伙伴部署。
    data:
      layers:
        - label: 内容与版权
          detail: 支撑场馆节目单的节目组合与版权池。
          modules:
            - label: 体育与娱乐版权
            - label: 广播商、球队与联赛
            - label: 原创沉浸式媒体
          outputs:
            - label: Event and content slate
              note: sports, film, art, and branded experiences
        - label: 采集与制作
          detail: 沉浸式制作把现场和原创内容转成适配穹顶的信号流。
          modules:
            - label: C360 Capture Systems
            - label: 现场沉浸式 8K+ 制作
            - label: CX Video Hub
          outputs:
            - label: Dome-ready immersive feeds
        - label: 核心平台
          detail: 负责渲染和控制体验的软件与显示技术栈。
          modules:
            - label: CX System
            - label: Digistar
            - label: 实时渲染引擎
          outputs:
            - label: LED dome and partner playback
        - label: 自有场馆体验
          detail: 实体空间把沉浸体验与餐饮服务、团体销售打包在一起。
          modules:
            - label: Dome
            - label: Hall
            - label: Deck
          outputs:
            - label: Shared Reality ticketed venue
        - label: 场馆运营
          detail: 服务、安全和餐饮流程把技术变成可复制的到访体验。
          modules:
            - label: 餐饮服务
            - label: 安全与酒精服务流程
            - label: 团体与私享活动运营
          outputs:
            - label: In-venue guest experience
        - label: 合作伙伴部署
          detail: B2B 分发把产品栈延伸到机构和合作伙伴场馆。
          modules:
            - label: 天文馆与科学博物馆
            - label: 博物馆 8K / LED 穹顶部署
            - label: 投影穹顶
          outputs:
            - label: Education and attractions footprint
    approximationNotes: 为便于阅读，依据公开产品界面和所引用的部署案例按自上而下排列；这不是公司披露的网络图。
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Cosm 先靠特定活动需求吸引关注，再从自有场馆到访中变现，随后尝试拓展复购型消费行为和机构部署。
    data:
      items:
        - label: 活动驱动的发现
          actor: 体育与娱乐粉丝
          stage: 认知
          touchpoints:
            - 联赛赛程与活动发布
            - 电影与艺术内容发布
            - 场馆社交 / 日历页面
          note: 需求仍由具体内容驱动，而不是通用场馆订阅。
          tone: positive
        - label: 门票或会员转化
          actor: 个人、家庭与团体
          stage: 购买
          touchpoints:
            - 单场活动门票
            - Cosm Club 会员
            - 团体与私享活动咨询
          note: 公开页面显示有多种付费方式，但没有披露转化率或价格结构。
          tone: positive
        - label: 场内共享体验
          actor: 场馆访客
          stage: 使用
          touchpoints:
            - Dome
            - Hall
            - Deck
            - 餐饮环境
          note: 产品定位是社交出行，而不是单屏观看。
          tone: positive
        - label: 重复节目循环
          actor: 回访粉丝
          stage: 留存
          touchpoints:
            - NBA、NFL、MLB、UFC、WWE、足球
            - 沉浸式电影内容
            - 季节性活动节奏
          note: 节目覆盖面意味着有重复到访机会，但公开信息没有复访证据。
          tone: risk
        - label: 机构扩张
          actor: 科学中心、博物馆与景点运营商
          stage: B2B 扩张
          touchpoints:
            - CX System 部署
            - Omnimax / 穹顶升级
            - 教育与景点节目
          note: Fort Worth 是最明确的已点名部署案例，但公开引用仍然稀少。
          tone: neutral
        - label: 地理覆盖扩张
          actor: 新城市观众与场馆主办方
          stage: 网络扩张
          touchpoints:
            - Atlanta 开业
            - 刷新日期时 Detroit 已在营销中
            - Cleveland 储备项目
          note: 更多城市扩大覆盖，但也带来执行和集中度问题。
          tone: risk
    claimRefs:
      - CU004
      - CU005
      - CU008
      - CU009
      - CU010
      - CU013
