      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              消费者需求首先来自球迷和娱乐观众：他们要么无法承受现场活动的成本与出行，要么希望获得比居家观看更具社交性的高端体验。随后，采用会通过团体接待和活动场景扩展，因为 Cosm
              的多空间场馆除了看屏幕，还支持餐饮和聚会。B2B
              机会在结构上不同：公司代表将大学、科学博物馆、主题公园、邮轮和其他场馆运营商描述为底层技术体系及沉浸式编程的买方，这使市场超出自营场馆。媒体合作伙伴和制片厂也很关键，因为版权供给和头部 IP
              会影响客户有多大理由再次到访。
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM011
              - CM015
              - CM016
      - number: '2.4'
        title: 采用驱动因素、约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              乐观情景很直接：现场活动稀缺性、高端粉丝需求，以及新鲜的制片厂或联赛内容，可以打造差异化出行，带动娱乐街区客流。更难的问题是新鲜感消退后重复到访能否持续、头部活动之外的高价是否仍然成立，以及场馆经济性是否支持全国化落地节奏。已报道的票价区间和高昂建设成本估算说明，Cosm
              为什么可能同时具有吸引力和风险。公开证据支持投资者和版权方的战略兴趣，但尚未披露足以让人有信心评估全部雄心所需的到场人数、重复到访、餐饮收入结构或场馆 EBITDA。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM012
              - CM013
              - CM016
