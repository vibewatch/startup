      - number: '2.2'
        title: 受证据约束的市场测算视角
        blocks:
          - type: paragraph
            body: >-
              指定证据池没有沉浸式共享现实场馆的干净第三方 TAM/SAM/SOM 数据，因此最稳妥的测算方式是基于落地和资本。到 2026 年 10 月，公开来源显示 Cosm
              官网列出五个美国场馆市场；此前报道的搜索名单还有 10 个城市；公司称十年内要达到 50 个美国场馆，并进一步设想五到十年内全球可支持超过 100
              个地点。如果概念能够复制，这组目标意味着可观的市场覆盖面，但这仍是由雄心驱动的测算框架，并不能证明终端需求或单位经济性足以支撑完整建设。资本强度同样重要：公开报道出现了 $42.5 million 的
              Dallas 申报估算，并引用 $80 million 至 $90 million 的场馆成本报道，因此规模受融资、选址质量和利用率约束，而不只是受 核心 需求约束。
