        title: 展品
        blocks:
          - type: callout
            title: 真正的可服务市场是混合型的
            body: Cosm 的公开定位支持一种混合市场定义：自营沉浸式场馆直接产生消费者支出，而同一套技术和编程体系也可以销售给机构和景点运营商。
            calloutType: insight
            claimRefs:
