company:
  name: Cosm
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a multi-stream revenue model anchored in ticketed immersive
    venues, food-and-beverage spend, and adjacent technology/media activities, but it
    does not support clean underwriting of revenue quality, margins, or runway. The
    positive signal is fresh financing — more than $250 million in 2024 plus a $100
    million Sony-led Series C in 2026 — while the main blocker is that site-level
    economics, cash burn, and cap-table terms remain undisclosed.
sections:
  - id: revenue-model
    title: Revenue model and public monetization
    body: >-
      Public materials support a venue-centric operating model rather than a pure software
      or subscription company. Cosm's official site markets ticketed sports and
      entertainment programming across multiple venues, while third-party profiles describe
      the primary consumer economics as admission plus on-site food-and-beverage spending.
      The same sources also point to ancillary revenue from technology systems, dome
      deployments, and media/content activities. That matters because underwriting should
      separate highly repeatable software-like revenue from venue- and event-driven revenue:
      the public evidence here supports the latter mix, but not the former. In practice,
      the business looks more like a capital-intensive experiential network with adjacent
      tech and media monetization than a disclosed recurring-software model.
    claimRefs: [CI001, CI002, CI003, CI006, CI007]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: capital
    title: Capital stack and financing dependency
    body: >-
      The strongest public financial evidence is financing momentum, not operating
      disclosure. AV Interactive reported that Cosm raised more than $250 million in July
      2024 to expand venues, technology, and media operations, while NBC News reported a
      $100 million Sony Pictures-led Series C in June 2026 that gave Sony a minority
      stake. Those rounds imply continued access to strategic capital, but they do not
      resolve the questions that matter most for underwriting: the 2026 post-money
      valuation, ownership sold, liquidation preferences, debt obligations, and cash
      runway are still not public. UpMarket is helpful as a market-structure source here
      because it states that the latest round valuation is undisclosed and that secondary
      share purchases are not new capital for the company. The funding story is therefore
      directionally positive but structurally incomplete.
    claimRefs: [CI004, CI005, CI008, CI011, CI012]
  - id: unit-economics
    title: Unit economics and disclosure blind spots
    body: >-
      The public record is thin on the metrics needed to test revenue quality and margin
      path. Within the retained source set, there is no disclosed current revenue, ARR,
      gross margin, venue contribution margin, burn, cash balance, or runway, and no
      public site-level attendance or repeat-visit data that would let an investor model
      venue utilization. The best available operating proxy is scale of activity — active
      venues, announced expansion, group-event selling, hospitality staffing, and a
      third-party job-board page listing 752 employees — but those are not substitutes for
      audited financials. That leaves the chapter's core verdict straightforward: the
      business model is legible, but the unit economics remain largely private.
    claimRefs: [CI007, CI009, CI010, CI013]
    tableRefs: [TI003]
  - id: verdict
    title: Financial verdict
    body: >-
      Cosm's financial setup is attractive in one narrow sense: the company has raised
      meaningful strategic capital and appears to have multiple monetization levers across
      admissions, hospitality, media, and technology. The problem is that none of the
      public sources retained here provide enough operating detail to convert that story
      into an investable view on revenue quality, contribution margins, or self-funded
      expansion capacity. Until management discloses venue-level economics, consolidated
      revenue, burn, and financing obligations, the right underwriting stance is to treat
      capital adequacy as a diligence blocker rather than a solved strength.
    claimRefs: [CI004, CI005, CI010, CI011, CI012, CI013]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Public status
      - Revenue quality
      - Diligence ask
    rows:
      - ["Event tickets", "Ticketed sports and entertainment experiences in Cosm venues", "Publicly observable through official event calendar and venue pages", "Demand-linked; repeatability depends on programming and venue utilization", "Monthly attendance, paid ticket mix, and realized average ticket price by venue"]
      - ["Food and beverage", "On-site hospitality spend tied to Dome, Hall, and Deck experiences", "Publicly described, but no spend-per-cap or margin disclosure", "Potentially important high-margin attachment, but unverified", "Food-and-beverage revenue per attendee and venue-level contribution margin"]
      - ["Media and immersive content", "Programming, production, and content activities tied to leagues, studios, and immersive experiences", "Publicly described, but no standalone revenue disclosure", "Could diversify revenue beyond admissions, but scale is not disclosed", "Segment revenue, rights costs, and gross margin for media/content operations"]
      - ["Technology systems and services", "Dome systems, software, and related immersive-venue technology", "Third-party sources describe ongoing B2B activity", "Potentially steadier than admissions, but public mix is unknown", "Annual bookings, backlog, service revenue, and customer concentration"]
    notes: >-
      Public sources support the existence of these streams, but not segment mix, realized
      pricing, or contribution margins; treat this as business-model mapping, not a
      disclosed segment P&L.
    claimRefs: [CI001, CI002, CI003, CI007]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Surface
      - Public price or unit
      - What is knowable
      - What remains unknown
      - Source posture
    rows:
      - ["General admission / standing access", "$10-$20 examples cited by Brandhopper", "Public list-price examples indicate low entry points for some events", "Realized blended pricing, event-by-event variability, and discounting", "Third-party profile; low confidence for current realized economics"]
      - ["Premium reserved seating", "> $100 for high-profile events, per Brandhopper", "Premium willingness-to-pay appears higher for marquee programming", "Occupancy, yield management, comp tickets, and premium mix", "Third-party profile; useful directional signal only"]
      - ["Group events and memberships", "Publicly marketed on official site; price not disclosed in retained sources", "Cosm is actively selling memberships and group-event bookings", "Contract value, corporate mix, seasonality, and cancellation terms", "Official sales surface without monetization detail"]
      - ["Secondary market shares", "$50K minimum transaction size on UpMarket", "Shares can trade through accredited-investor secondary transactions", "Clearing price, liquidity, company consent, and whether any current offering is live", "Secondary-market access is not company revenue and not a valuation proof point"]
    notes: >-
      This table separates public list-price signals from realized economics. Official and
      marketplace surfaces do not disclose effective ticket yield, discounting, or contract
      terms, so pricing evidence should not be treated as revenue evidence.
    claimRefs: [CI002, CI006, CI008, CI012]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Revenue / ARR", null, "Low", "No current revenue figure means investors cannot judge throughput versus fixed venue costs", "Provide monthly and trailing-twelve-month revenue, with venue/media/technology split"]
      - ["Gross margin / venue contribution", null, "Low", "Admissions, food-and-beverage, rights costs, and tech services can have very different margin structures", "Disclose consolidated gross margin plus site-level contribution margin after programming and labor"]
      - ["Cash burn / runway", null, "Low", "Expansion into additional venues can absorb cash quickly even after fresh funding", "Provide cash on hand, monthly burn, committed capex, debt facilities, and covenant schedule"]
      - ["Venue utilization", null, "Low", "Attendance and repeat visitation are the main bridge from rights/programming into revenue productivity", "Share attendance, occupancy, repeat-visit rate, and per-cap spend by site"]
      - ["Headcount proxy", 752, "Low", "A large operating footprint supports scale but does not prove efficiency or profitability", "Confirm current employee count, contractor usage, and venue versus corporate staffing mix"]
    notes: >-
      Null means not publicly disclosed in the retained sources. Every missing metric here
      is a diligence blocker because the company is scaling physical venues rather than a
      purely digital delivery model.
    claimRefs: [CI009, CI010, CI013]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a venue-led revenue bridge from programming demand to
      admissions and in-venue spending, with technology and media activities as additional
      inputs rather than a disclosed standalone profit engine.
    data:
      nodes:
        - id: rights-programming
          label: Rights and programming slate
          note: Sports, entertainment, and immersive content attract visitation.
        - id: venue-traffic
          label: Ticketed venue attendance
          note: Demand converts into admissions when events fill the Dome and related spaces.
        - id: hospitality
          label: In-venue food and beverage
          note: Hospitality spend increases revenue per visit but no per-cap data is public.
        - id: tech-media
          label: Technology and media services
          note: Third-party sources describe dome systems, software, and content activities.
        - id: gross-revenue
          label: Gross revenue pool
          note: Public sources imply a mix of admissions, hospitality, tech, and media revenue.
        - id: contribution
          label: Contribution margin and cash needs
          note: Margin conversion cannot be underwritten because revenue, gross margin, and burn are undisclosed.
      edges:
        - from: rights-programming
          to: venue-traffic
          label: drives demand
        - from: venue-traffic
          to: hospitality
          label: increases spend per visit
        - from: venue-traffic
          to: gross-revenue
          label: admissions
        - from: hospitality
          to: gross-revenue
          label: ancillary spend
        - from: tech-media
          to: gross-revenue
          label: B2B and content revenue
        - from: gross-revenue
          to: contribution
          label: margin conversion unknown
    claimRefs: [CI001, CI002, CI003, CI007, CI010, CI013]
callouts:
  - calloutType: risk
    title: Capital adequacy is still a diligence blocker
    body: >-
      Fresh capital improves the probability that Cosm can keep opening venues, but the
      public record still does not disclose site-level economics, consolidated revenue,
      cash burn, or runway. That keeps financing dependency as an underwriting risk rather
      than a resolved strength.
    claimRefs: [CI004, CI005, CI010, CI011, CI013]
