  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Venue-level attendance, repeat visitation, per-cap spend, and contribution margin by site.
      whyItMatters: Without site-level economics, investors cannot test whether venue growth adds durable margin or only scale.
      diligencePath: Request monthly operating dashboards for Los Angeles and Dallas, including attendance, ticket yield, food-and-beverage spend, and direct venue costs.
      relatedQuestionRefs: [QI004]
      relatedTableRefs: [TI003]
    - type: missing-source
      severity: material
      topic: capital-adequacy
      missingEvidence: Current cash balance, monthly burn, committed capex, debt facilities, and runway forecast.
      whyItMatters: Financing dependency cannot be judged from fundraising headlines alone when the model involves physical venue rollout.
      diligencePath: Obtain the latest board deck or lender package with cash, burn, capex commitments, and any debt or lease schedule.
      relatedQuestionRefs: [QI004, QI006]
      relatedTableRefs: [TI003]
    - type: missing-source
      severity: material
      topic: funding-terms
      missingEvidence: 2026 Series C valuation, ownership dilution, security terms, and liquidation preferences.
      whyItMatters: The round can change downside protection and return potential even if the headline cash amount is known.
      diligencePath: Request the financing term sheet or cap-table summary covering the Sony-led Series C.
      relatedQuestionRefs: [QI005, QI008]
