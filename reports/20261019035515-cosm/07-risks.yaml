        - Studios, leagues, and media-rights holders
        - Supply the programming that makes Shared Reality worth a premium ticket
        - High
        - Key rights renew at worse economics or marquee inventory shifts elsewhere
        - High
        - Sony and existing partnerships widen the potential content funnel
        - Rights terms, exclusivity, and renewal concentration remain undisclosed
      - - Strategic investor influence over programming and roadmap
        - Sony Pictures Entertainment and existing investor Fox
        - Capital, governance, and possible content leverage
        - Medium
        - Investor priorities distort venue neutrality or limit third-party willingness to commit premium IP
        - Medium
