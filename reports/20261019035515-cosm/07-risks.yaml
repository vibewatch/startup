chapter:
  number: 7
  title: Risks
  summary: >-
    Cosm's highest current risks are not existential demand questions so much as
    underwriting opacity around venue economics, partner concentration, and the
    control terms embedded in a still-undisclosed Series C. The public record
    supports a watchlist view because Sony's $100 million lead investment and
    venue expansion plans validate strategic interest, but they do not yet clear
    the diligence burden on unit economics, rights concentration, or governance.
sections:
  - id: governance-and-financing-opacity
    title: Governance and financing opacity remain the hardest risks to price
    body: >-
      Sony's $100 million Series C lead checks two boxes at once: it validates
      that a strategic buyer with global IP believes Cosm can matter, and it
      also increases governance concentration at a moment when the core terms of
      the round are still private. Public reporting confirms that Sony took a
      minority stake and added Ravi Ahuja to Cosm's board, while independent
      commentary notes Fox was already an investor. That combination can help
      with distribution access and future capital formation, but it also raises
      a control-risk question for outside investors because the stake size,
      preference stack, and any rights around programming priority remain
      undisclosed. Until management discloses the Series C post-money,
      liquidation preferences, governance rights, and any strategic side
      agreements, residual investor downside is harder to quantify than the
      headline round suggests.
    claimRefs: [CR001, CR002, CR008, CR009, CR010]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: operating-model-and-rollout-risk
    title: The venue model adds capital intensity, staffing complexity, and launch risk
    body: >-
      Cosm is not a lightweight software business; the public footprint shows a
      multi-surface venue operator with domes, halls, decks, food and beverage
      service, and a live event calendar that has to stay fresh across multiple
      cities. That model can create differentiation, but it also compounds
      execution risk because the company must staff hospitality operations,
      enforce alcohol-service and payment controls, maintain high-uptime display
      systems, and open new venues on schedule. Public sources show three
      operating sites by mid-2026 with Detroit and Cleveland still in the
      rollout queue, while prior financing was earmarked for operational
      excellence, technology expansion, and global expansion. The risk is that a
      few delayed openings, soft utilization periods, or service-control issues
      can reverberate through a still-private cost structure before investors
      ever get clean venue-level margin data.
    claimRefs: [CR003, CR004, CR005, CR006, CR011, CR012]
    tableRefs: [TR002]
  - id: dependency-risk-mitigations-and-kill-criteria
    title: Partner dependency is manageable only if management can prove durable demand
    body: >-
      The strongest mitigation in the current evidence is that Cosm has
      strategic capital, visible programming, and multiple announced sites
      rather than a single prototype. The weaker point is that demand durability
      and partner concentration are still inferred from calendars, partnerships,
      and investor narratives rather than from disclosed repeat visitation,
      attach-rate, or site EBITDA data. Public evidence ties Cosm's proposition
      to licensed sports and entertainment programming plus strategic investor
      relationships, which means content access, renewal terms, and launch
      cadence matter as much as top-line excitement. A practical investment
      posture is to treat Detroit and Cleveland opening performance, venue-level
      utilization, and any disclosed rights concentration as kill criteria: if
      expansion slips materially, discounting rises to fill the calendar, or key
      counterparties gain de facto control over premium inventory, the bull case
      weakens quickly.
    claimRefs: [CR007, CR008, CR009, CR010, CR011, CR012]
    tableRefs: [TR003]
