callouts:
  - calloutType: risk
    title: Kill criteria before price underwriting
    body: >-
      Do not underwrite a clean price until management discloses the Series C
      preference stack, venue-level attendance and repeat-visit cohorts, food
      and beverage attach rates, site EBITDA or cash contribution, and the
      renewal or termination terms on key rights relationships. A material slip
      in Detroit or Cleveland openings, rising discounting to fill calendars, or
      evidence that a strategic investor can steer premium inventory on
      non-arm's-length terms should be treated as thesis-break triggers.
    claimRefs: [CR009, CR010, CR011, CR012]
