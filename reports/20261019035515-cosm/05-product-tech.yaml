company:
  name: Cosm
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Cosm's product is a hybrid of owned Shared Reality venues and a sell-through
    technology/media stack, with the Dome/Hall/Deck format and CX-system
    surfaces serving both consumer and B2B use cases. The public evidence
    supports differentiated dome/display know-how and rollout momentum, but it
    still leaves material diligence gaps around technical-security controls,
    partner economics, and the durability of content-rights dependencies.
sections:
  - id: shared-reality-offer
    title: Shared Reality is the product, not just a venue brand
    body: >-
      Cosm's public surface frames the product as a Shared Reality experience
      that blends live sports, entertainment, and art inside immersive venues
      rather than as a single software SKU. The official site says the company
      is redefining how people experience and share content and positions the
      experience as communal, real-time, and headset-free, while NBC
      independently describes the same model as live events projected onto
      wraparound curved LED screens. That matters because the customer workflow
      is a premium out-of-home alternative to either passive home viewing or
      one-off special-event travel, not a standalone app. The official venue
      design also makes hospitality part of the product: the Dome is the anchor
      viewing environment, but the Hall and Deck extend dwell time, group use,
      and cross-programming across the same visit.
    claimRefs: [CE001, CE002, CE003, CE011]
    tableRefs: [TE002]
  - id: platform-architecture
    title: The architecture spans venues, tech, and media rights
    body: >-
      Cosm's official site exposes more than a venue front end: it names a
      venue business, a technology surface, and a media surface, and it
      advertises CX System, Projection Domes, Digistar, C360 Capture Systems,
      and CX Video Hub as distinct product pages. In a practitioner-oriented
      interview, a Cosm executive described the company as a three-part
      ecosystem of technology, venues, and media, said it already powers
      hundreds of planetariums and science museums, and explained that rights
      live with broadcasters, teams, and leagues while internal immersive
      production teams create dome-ready feeds. Taken together, the product
      stack looks more like a vertically integrated content-capture-rendering
      platform than a single consumer attraction.
    claimRefs: [CE005, CE006, CE007, CE013, CE015]
    tableRefs: [TE001, TE003]
    figureRefs: [FE001]
  - id: deployment-and-maturity
    title: Public maturity proof is strongest in venue rollout and institutional installs
    body: >-
      Cosm's product maturity is easiest to verify through physical deployment.
      HKS documents a large-format venue footprint with named dimensions and
      capacity, the official site shows live and pipeline city assets beyond Los
      Angeles, and AV Magazine linked earlier funding to technology/media buildout
      plus additional venue rollout. Outside the owned venues, third-party
      evidence also points to B2B deployments in science and education:
      Wikipedia cites the Fort Worth Omni Theater's 8K reopening with Cosm
      technology and says Prague Planetarium's CX System installation combines
      Digistar 7 with Unreal integration. That does not prove attractive unit
      economics, but it does show the platform has been deployed in more than
      one institutional context.
    claimRefs: [CE004, CE008, CE009, CE010, CE012]
  - id: controls-and-open-risks
    title: Public controls are visible, but technical diligence is still thin
    body: >-
      The visible control surface in the assigned evidence set is real but
      limited. The official site links standard legal and privacy pages, and a
      current job post emphasizes recruiting-scam prevention plus venue-safety
      and alcohol-service rules, which is useful for consumer and operational
      trust. What the public chapter evidence does not show is a technical trust
      center, uptime history, security-certification set, or detailed privacy
      architecture for the CX or immersive-capture stack. Combined with the
      heavy dependence on rights, live production, and multi-space venue
      operations, that leaves product reliability and partner-governance
      questions as real diligence blockers rather than cosmetic gaps.
    claimRefs: [CE007, CE010, CE014]
tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / asset
      - Primary user
      - Status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - - Shared Reality venues (Los Angeles, Dallas, Atlanta, Detroit; Cleveland coming)
        - Consumers, groups, sponsors
        - Live footprint with one pipeline site
        - Combines Dome, Hall, and Deck into one visit and monetization surface
        - Unit economics, per-site utilization, and payback are not public in the assigned evidence set
      - - Dome
        - Event-goers / ticket buyers
        - Live core product
        - 12K x 10K LED experience; HKS cites a 60' x 86' dome plus planetarium-derived brightness claims
        - Latency, maintenance cycle, and hardware refresh assumptions are not publicly disclosed here
      - - Hall + Deck
        - Fans, hospitality, sponsors, private events
        - Live supporting surfaces
        - 150-foot-by-15-foot Hall display plus rooftop social space broaden dwell time and event formats
        - Cross-space conversion, sponsorship yield, and attachment rates are not public
      - - Cosm Tech (CX System, Projection Domes, Digistar)
        - Museums, planetariums, partner venues
        - Commercially referenced B2B stack
        - Named product surfaces extend beyond owned venues into science/education installs
        - Pricing, backlog, and support commitments are not visible in the chapter evidence
      - - Cosm Media / C360 / CX Video Hub
        - Leagues, broadcasters, venue partners
        - Operational but contract opaque
        - Rights plus immersive capture make Cosm more than a venue operator
        - Public evidence does not disclose rights duration, exclusivity, or partner concentration
    notes: >-
      This matrix mixes officially named product surfaces with externally
      described venue components; missing values reflect undisclosed economics
      and performance details rather than assumed weakness.
    claimRefs: [CE002, CE003, CE005, CE006, CE007, CE012]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Cosm solution
      - Measurable benefit
      - Limitation
    rows:
      - - Watch premium live sports without traveling to the stadium
        - Home TV, sports bar, or occasional stadium trip
        - Shared Reality event in the Dome or Hall
        - Official site cites a 12K x 10K Dome; NBC describes wraparound curved LED screens for live sports
        - Value depends on venue access, event rights, and ticket willingness to pay
      - - Experience immersive film or art communally
        - Movie theater or one-off exhibit
        - Shared Reality entertainment programming across venue spaces
        - Official site and AV Magazine both show entertainment programming beyond sports
        - Public slate freshness and title economics are not disclosed
      - - Upgrade a museum or planetarium to LED immersive presentation
        - Legacy projection dome
        - CX System / Digistar / LED dome deployment
        - Wikipedia cites Fort Worth's museum reopening with Cosm 8K tech and Prague's Digistar 7 plus Unreal integration
        - Public evidence does not show deployment cost, install timing, or renewal terms
      - - Produce venue-ready immersive media for partners
        - Traditional broadcast or venue screen package
        - C360 capture, CX Video Hub, and live immersive production
        - Marketscale says Cosm negotiates rights and produces live immersive 8K+ feeds
        - Customer references, margins, and attach rates are still opaque
    notes: >-
      Benefits are source-grounded only where the evidence set gives a concrete
      technical or deployment detail; otherwise limitations remain explicit.
    claimRefs: [CE001, CE002, CE007, CE008, CE009, CE011]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - - Content rights and programming
        - Secures sports, entertainment, and studio inventory for Shared Reality venues
        - Broadcasters, teams, leagues, and content partners
        - Renewal, exclusivity, or minimum-guarantee terms are not public, so content continuity is hard to underwrite
      - - Immersive capture and production
        - Turns live events and originals into dome-ready immersive feeds
        - Specialized production crews, capture systems, and rights clearances
        - Scaling live immersive production can be operationally complex and expensive
      - - Core software / rendering / control
        - Coordinates CX engine, CX System, Digistar, and associated media delivery surfaces
        - Legacy planetarium know-how plus ongoing software/hardware integration
        - Public evidence shows product names and heritage but not uptime, latency, or release cadence metrics
      - - Physical venue experience
        - Combines Dome, Hall, Deck, seating, food-and-beverage, and service into the customer visit
        - Site buildout, staffing, safety procedures, and local operations
        - Operational complexity rises with hospitality, crowd flow, and multi-space programming
      - - Partner deployments
        - Extends the platform into museums, planetariums, and other immersive partners
        - Customer capex, venue retrofit work, and partner implementation bandwidth
        - The installed-base story is compelling, but public backlog, churn, and support economics are missing
    notes: >-
      This table separates the operating stack into public-facing layers; it
      does not imply audited system boundaries or disclosed SLAs.
    claimRefs: [CE006, CE007, CE008, CE013, CE014]
