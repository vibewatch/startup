            - label: Food and beverage service
            - label: Safety and alcohol-service procedures
            - label: Group and private-event operations
          outputs:
            - label: In-venue guest experience
        - label: Partner deployments
          detail: B2B distribution extends the stack into institutional and partner venues.
          modules:
            - label: Planetariums and science museums
            - label: Museum 8K / LED dome installs
            - label: Projection domes
          outputs:
            - label: Education and attractions footprint
    approximationNotes: >-
      Ordered top-down for reader clarity using public product surfaces and
      referenced deployments; this is not a disclosed network diagram.
    claimRefs: [CE005, CE006, CE007, CE008, CE009, CE013]
callouts:
  - calloutType: insight
    title: Cosm looks like a vertically integrated platform
    body: >-
      The chapter evidence repeatedly points to a dual-track business: owned
      venues monetized directly to consumers, plus a technology and media stack
      sold or deployed into partner settings.
    claimRefs: [CE005, CE006, CE008, CE015]
  - calloutType: risk
    title: Rights and operations complexity are core product risks
    body: >-
      Product delivery depends on negotiated rights, specialized live
      production, and multi-space venue operations, so execution risk sits far
      beyond ordinary software release risk.
    claimRefs: [CE007, CE010, CE014]
