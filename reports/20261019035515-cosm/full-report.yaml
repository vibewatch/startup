  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >
              Cosm is not selling a headset product or a conventional movie-theater box office. The company and
              third-party coverage consistently frame Shared Reality as communal, venue-based immersion that tries to
              capture spend sitting between live attendance, premium out-of-home viewing, and some immersive-media use
              cases. The official site and company descriptions extend that boundary beyond sports into entertainment,
              art, science and education, and attractions, while venue design also broadens the monetization surface
              beyond one ticketed screen because each site includes the Dome, Hall, and Deck. That makes the relevant
              substitute set wider than direct dome competitors: expensive or inaccessible live events, premium cinemas,
              sports bars, and VR-style immersion are all part of the buyer's comparison set.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM011
              - CM015
              - CM016
      - number: '2.2'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >
              The assigned evidence pool does not contain a clean third-party TAM/SAM/SOM dataset for immersive
              shared-reality venues, so the most defensible sizing approach is rollout- and capital-based. Public
              sources show five named U.S. venue markets on Cosm's official surface by October 2026, a previously
              reported search list of 10 additional cities, a stated ambition for 50 U.S. sites within a decade, and a
              broader aspiration that the market could support more than 100 global locations over five to 10 years.
              That stack implies a meaningful surface area if the concept proves repeatable, but it is still an
              ambition-led sizing frame, not proof that end-market demand or unit economics can support the full
              buildout. Capital intensity is also material: public reporting surfaced a $42.5 million Dallas filing
              estimate and cited venue-cost reports of $80 million to $90 million, so scale is constrained by financing,
              site quality, and utilization, not just headline demand.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >
              Consumer demand starts with fans and entertainment attendees who either cannot justify live-event cost and
              travel or want a more social premium than at-home viewing. Adoption then expands through group hospitality
              and event use, because Cosm's multi-space venue format supports food, beverage, and gathering behavior in
              addition to screen time. The B2B opportunity is structurally different: company representatives describe
              universities, science museums, theme parks, cruise ships, and other venue operators as buyers for the
              underlying technology stack and immersive programming, which extends the market beyond company-owned
              venues. Separately, media partners and studios matter because rights supply and marquee IP affect how
              often customers have a reason to come back.
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM011
              - CM015
              - CM016
      - number: '2.4'
        title: Adoption drivers, constraints, and open diligence gaps
        blocks:
          - type: paragraph
            body: >
              The bull case is straightforward: live-event scarcity, premium fandom, and fresh studio or league
              programming create a differentiated outing that can drive traffic in entertainment districts. The harder
              questions are whether repeat visitation persists once novelty fades, whether premium pricing still works
              outside marquee events, and whether site economics justify a nationwide rollout cadence. Reported ticket
              ranges and high build-cost estimates show why Cosm can be attractive and risky at the same time. Public
              evidence supports strategic interest from investors and rights holders, but it does not yet disclose the
              attendance, repeat visitation, food-and-beverage mix, or venue EBITDA needed to underwrite the full
              ambition with confidence.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM012
              - CM013
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The real addressable market is hybrid
            body: >-
              Cosm's public positioning supports a hybrid market definition: owned immersive venues generate direct
              consumer spend, while the same technology and programming stack can also sell into institutional and
              attraction operators.
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM016
          - type: callout
            title: Rollout ambition is ahead of disclosed unit economics
            body: >-
              Public rollout targets are easy to quote, but the underwriting bottleneck remains repeat visitation and
              site-level profitability rather than whether the concept sounds large in theory.
            calloutType: risk
            claimRefs:
              - CM006
              - CM008
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive set is broader than premium cinema alone
        blocks:
          - type: paragraph
            body: >-
              The assigned sources describe Cosm as both a consumer-facing Shared Reality venue and a supplier of
              immersive-venue technology. That matters because the buyer can solve the same job in several ways: attend
              a premium large-format screening, choose a hospitality-led theater or sports-bar substitute, or fund a
              custom immersive build rather than attach to Cosm's venue network. Cosm's own positioning is explicitly
              comparative. Its FAQ says the format differs from movie theaters and other venues because the experience
              is communal, wraparound, and headset-free, while its technology page markets custom solutions for
              attractions, immersive theaters, and event spaces. In other words, the peer set spans exhibitors,
              social-viewing substitutes, and build-vs-buy venue infrastructure vendors rather than a single theater
              category.
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP009
              - CP013
              - CP014
