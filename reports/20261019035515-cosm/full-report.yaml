  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Public support improves from capital validation to track, but not yet to buy, because price and unit economics
      remain undisclosed.
    data:
      nodes:
        - label: Strategic validation
          detail: Sony led the June 2026 Series C with a $100M investment and minority stake.
          tone: positive
        - label: Growth platform
          detail: Cosm is pairing venue rollout with technology and media expansion.
          tone: positive
        - label: Monetization breadth
          detail: Ticketing, group sales, and in-seat food-and-beverage create more than one demand lever.
          tone: positive
        - label: Pricing gap
          detail: Public sources still do not disclose the 2026 post-money valuation or preference stack.
          tone: risk
        - label: Liquidity constraint
          detail: Secondary access is accredited-only, illiquid, and exposed to uncertain exits.
          tone: risk
        - label: Recommendation
          detail: Track until disclosed terms and venue economics create an underwritable entry.
          tone: warning
