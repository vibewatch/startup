companyProfile:
  summary: >-
    Cosm is a private immersive entertainment company centered on Shared Reality dome venues, with a broader technology,
    media, and venue-deployment stack that extends beyond its own locations. The current public story combines a
    multi-venue rollout, strategic capital from Sony Pictures, and adjacent monetization through ticketing, hospitality,
    content, and technology deployment, but it still leaves core economics and financing terms opaque.
