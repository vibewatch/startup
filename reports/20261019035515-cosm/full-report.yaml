      - number: '4.2'
        title: Capital stack and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The strongest public financial evidence is financing momentum, not operating disclosure. AV Interactive
              reported that Cosm raised more than $250 million in July 2024 to expand venues, technology, and media
              operations, while NBC News reported a $100 million Sony Pictures-led Series C in June 2026 that gave Sony
              a minority stake. Those rounds imply continued access to strategic capital, but they do not resolve the
              questions that matter most for underwriting: the 2026 post-money valuation, ownership sold, liquidation
              preferences, debt obligations, and cash runway are still not public. UpMarket is helpful as a
              market-structure source here because it states that the latest round valuation is undisclosed and that
              secondary share purchases are not new capital for the company. The funding story is therefore
              directionally positive but structurally incomplete.
            claimRefs:
              - CI004
              - CI005
              - CI008
              - CI011
              - CI012
      - number: '4.3'
        title: Unit economics and disclosure blind spots
        blocks:
          - type: paragraph
            body: >-
              The public record is thin on the metrics needed to test revenue quality and margin path. Within the
              retained source set, there is no disclosed current revenue, ARR, gross margin, venue contribution margin,
              burn, cash balance, or runway, and no public site-level attendance or repeat-visit data that would let an
              investor model venue utilization. The best available operating proxy is scale of activity — active venues,
              announced expansion, group-event selling, hospitality staffing, and a third-party job-board page listing
              752 employees — but those are not substitutes for audited financials. That leaves the chapter's core
              verdict straightforward: the business model is legible, but the unit economics remain largely private.
            claimRefs:
              - CI007
              - CI009
              - CI010
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI009
              - CI010
              - CI013
      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              Cosm's financial setup is attractive in one narrow sense: the company has raised meaningful strategic
              capital and appears to have multiple monetization levers across admissions, hospitality, media, and
              technology. The problem is that none of the public sources retained here provide enough operating detail
              to convert that story into an investable view on revenue quality, contribution margins, or self-funded
              expansion capacity. Until management discloses venue-level economics, consolidated revenue, burn, and
              financing obligations, the right underwriting stance is to treat capital adequacy as a diligence blocker
              rather than a solved strength.
            claimRefs:
              - CI004
              - CI005
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital adequacy is still a diligence blocker
            body: >-
              Fresh capital improves the probability that Cosm can keep opening venues, but the public record still does
              not disclose site-level economics, consolidated revenue, cash burn, or runway. That keeps financing
              dependency as an underwriting risk rather than a resolved strength.
            calloutType: risk
            claimRefs:
              - CI004
              - CI005
              - CI010
              - CI011
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Shared Reality is the product, not just a venue brand
        blocks:
          - type: paragraph
            body: >-
              Cosm's public surface frames the product as a Shared Reality experience that blends live sports,
              entertainment, and art inside immersive venues rather than as a single software SKU. The official site
              says the company is redefining how people experience and share content and positions the experience as
              communal, real-time, and headset-free, while NBC independently describes the same model as live events
              projected onto wraparound curved LED screens. That matters because the customer workflow is a premium
              out-of-home alternative to either passive home viewing or one-off special-event travel, not a standalone
              app. The official venue design also makes hospitality part of the product: the Dome is the anchor viewing
              environment, but the Hall and Deck extend dwell time, group use, and cross-programming across the same
              visit.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
