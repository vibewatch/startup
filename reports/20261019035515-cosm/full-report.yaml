        title: The architecture spans venues, tech, and media rights
        blocks:
          - type: paragraph
            body: >-
              Cosm's official site exposes more than a venue front end: it names a venue business, a technology surface,
              and a media surface, and it advertises CX System, Projection Domes, Digistar, C360 Capture Systems, and CX
              Video Hub as distinct product pages. In a practitioner-oriented interview, a Cosm executive described the
              company as a three-part ecosystem of technology, venues, and media, said it already powers hundreds of
              planetariums and science museums, and explained that rights live with broadcasters, teams, and leagues
              while internal immersive production teams create dome-ready feeds. Taken together, the product stack looks
              more like a vertically integrated content-capture-rendering platform than a single consumer attraction.
            claimRefs:
