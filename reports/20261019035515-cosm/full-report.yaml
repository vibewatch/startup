  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Cosm acquires attention through event-specific demand, monetizes the owned venue visit, and then tries to expand
      into repeat consumer behavior and institutional deployments.
    data:
      items:
        - label: Event-led discovery
          actor: Sports and entertainment fans
          stage: Awareness
          touchpoints:
            - League schedules and event launches
            - Film and arts releases
            - Venue social/calendar surfaces
          note: Demand is still driven by named content rather than a generic venue subscription.
          tone: positive
        - label: Ticket or membership conversion
          actor: Individuals, households, and groups
          stage: Purchase
          touchpoints:
            - Single-event tickets
            - Cosm Club memberships
            - Group and private-event inquiries
          note: Public surfaces show several ways to pay, but no conversion or pricing mix.
          tone: positive
        - label: In-venue shared experience
          actor: Venue guests
          stage: Usage
          touchpoints:
            - Dome
            - Hall
            - Deck
            - Food and beverage environment
          note: The product is designed as a social outing, not a single-screen viewing session.
          tone: positive
        - label: Repeat programming loop
          actor: Returning fans
          stage: Retention
          touchpoints:
            - NBA, NFL, MLB, UFC, WWE, soccer
            - Immersive cinema titles
            - Seasonal event cadence
          note: Programming breadth implies repeat opportunities, but repeat-visitation proof is not public.
          tone: risk
        - label: Institutional expansion
          actor: Science centers, museums, and attraction operators
          stage: B2B expansion
          touchpoints:
            - CX System deployments
            - Omnimax / dome upgrades
            - Education and attraction programming
          note: Fort Worth is the clearest named deployment, but public references are still sparse.
          tone: neutral
        - label: Geographic footprint growth
          actor: New city audiences and venue hosts
          stage: Network scaling
          touchpoints:
            - Atlanta launch
            - Detroit marketed at refresh date
            - Cleveland pipeline
          note: More cities expand reach, but they also raise execution and concentration questions.
          tone: risk
    claimRefs:
