  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal scoring from the assigned evidence shows Cosm highest on immersion and near the top on distribution
      leverage after Sony's board-level investment.
    data:
      xAxis:
        label: Immersion / format differentiation
        min: 1
        max: 5
        lowLabel: Commodity or easily substituted viewing
        highLabel: Format is hard to replicate at home
        scale: ordinal
      yAxis:
        label: Strategic control over distribution or venue outcome
        min: 1
        max: 5
        lowLabel: Arms-length or commodity access
        highLabel: Owned, governed, or self-built channel
        scale: ordinal
      points:
        - label: Cosm
          x: 5
          'y': 4
          note: Shared Reality dome plus Sony governance support
        - label: IMAX / PLF
          x: 4
          'y': 2
          note: Large installed base, but no Sony governance leverage in assigned evidence
        - label: Alamo Drafthouse
          x: 2
          'y': 3
          note: Sony-owned curated theater with hospitality, but not an immersive dome
        - label: Standard multiplex
          x: 1
          'y': 1
          note: Conventional exhibition benchmark in Vitrina comparison
        - label: Sports bar / home-social substitute
          x: 1
          'y': 1
          note: Shared atmosphere without dome immersion or channel control
        - label: Internal build / immersive project
          x: 4
          'y': 5
          note: High control if the buyer funds its own build, but no branded audience network included
    approximationNotes: Scores are ordinal judgments synthesized from the assigned sources, not measured benchmarks.
