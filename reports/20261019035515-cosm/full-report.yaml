  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a venue-led revenue bridge from programming demand to admissions and in-venue spending,
      with technology and media activities as additional inputs rather than a disclosed standalone profit engine.
    data:
      nodes:
        - id: rights-programming
          label: Rights and programming slate
          note: Sports, entertainment, and immersive content attract visitation.
        - id: venue-traffic
          label: Ticketed venue attendance
          note: Demand converts into admissions when events fill the Dome and related spaces.
        - id: hospitality
          label: In-venue food and beverage
          note: Hospitality spend increases revenue per visit but no per-cap data is public.
        - id: tech-media
          label: Technology and media services
          note: Third-party sources describe dome systems, software, and content activities.
        - id: gross-revenue
          label: Gross revenue pool
          note: Public sources imply a mix of admissions, hospitality, tech, and media revenue.
        - id: contribution
          label: Contribution margin and cash needs
          note: Margin conversion cannot be underwritten because revenue, gross margin, and burn are undisclosed.
      edges:
        - from: rights-programming
          to: venue-traffic
          label: drives demand
        - from: venue-traffic
          to: hospitality
          label: increases spend per visit
        - from: venue-traffic
          to: gross-revenue
          label: admissions
        - from: hospitality
          to: gross-revenue
          label: ancillary spend
        - from: tech-media
          to: gross-revenue
          label: B2B and content revenue
        - from: gross-revenue
          to: contribution
          label: margin conversion unknown
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI007
      - CI010
      - CI013
