  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: The customer base is multi-sided, but owned venues are still the clearest monetization engine
        blocks:
          - type: paragraph
            body: >-
              Cosm's public customer story has two layers. The first is the owned-venue model that sells ticketed
              experiences directly to fans, households, memberships, and group-event organizers; this is the most
              visible revenue surface because the October 2026 site is built around event calendars, memberships, and
              venue/group-booking flows. The second is the enterprise/institutional business that sells immersive
              technology and content into science centers, museums, theaters, attractions, and education operators. That
              mix matters because it means headline adoption claims combine consumer attendance with B2B deployments.
              Public materials support the existence of both segments, but only the owned venues currently offer fresh,
              externally checkable demand signals.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU010
              - CU011
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU004
              - CU005
              - CU008
              - CU009
              - CU010
              - CU013
      - number: '6.2'
        title: Independent adoption proof has improved, though the datapoints are still shallow
        blocks:
          - type: paragraph
            body: >-
              The refresh is stronger than a pure logo story because third-party reporting now shows real, dated
              activity. By July 2026 Cosm had three operating venues—Los Angeles, Dallas, and Atlanta—and Sports Video
              Group documented both a 40-match World Cup slate and more than 1,000 fans across the three venues for one
              opening-day match. Dell's 2025 partner write-up adds programming breadth across major sports and immersive
              cinema, while the October 2026 homepage shows the footprint has kept moving with Detroit marketed as live
              and Cleveland still queued. Even so, these are operating and programming signals, not customer-economics
              proof: they demonstrate that people and counterparties are showing up, but not how often they return, what
              they spend, or which customer cohorts are most profitable.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU005
              - CU006
              - CU007
              - CU008
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU009
              - CU010
              - CU011
      - number: '6.3'
        title: Durability and concentration remain the central unresolved diligence items
        blocks:
          - type: paragraph
            body: >-
              The weakest part of the chapter is not top-of-funnel awareness; it is durability. The reviewed sources do
              not disclose repeat visitation, NRR, GRR, churn, renewal terms, satisfaction cohorts, or venue-level spend
              behavior, so there is still no public way to separate one-time curiosity from durable habit. Concentration
              is also opaque. The visible proof still clusters around a small set of owned venues and a short list of
              marquee counterparties, while the named institutional deployment list is thin. UpMarket's cautionary
              framing of the company as a speculative, illiquid private investment reinforces that external observers
              still lack a rich KPI set. Net: traction is real enough to track, but not yet transparent enough to
              underwrite on customer quality alone.
            claimRefs:
              - CU010
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Independent activation proof is now real, not just logo-based
            body: >-
              The July 2026 World Cup coverage is the clearest external evidence in the file because it documents three
              operating venues, repeated event delivery, and a disclosed attendance datapoint rather than only partner
              logos.
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
              - CU007
          - type: callout
            title: Durability still cannot be underwritten from public KPIs
            body: >-
              Public materials still do not disclose repeat visitation, churn, renewals, top-customer concentration, or
              venue-level unit economics, so the customer story remains trackable but not yet fully bankable.
            calloutType: risk
            claimRefs:
              - CU012
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Governance and financing opacity remain the hardest risks to price
        blocks:
          - type: paragraph
            body: >-
              Sony's $100 million Series C lead checks two boxes at once: it validates that a strategic buyer with
              global IP believes Cosm can matter, and it also increases governance concentration at a moment when the
              core terms of the round are still private. Public reporting confirms that Sony took a minority stake and
              added Ravi Ahuja to Cosm's board, while independent commentary notes Fox was already an investor. That
              combination can help with distribution access and future capital formation, but it also raises a
              control-risk question for outside investors because the stake size, preference stack, and any rights
              around programming priority remain undisclosed. Until management discloses the Series C post-money,
              liquidation preferences, governance rights, and any strategic side agreements, residual investor downside
              is harder to quantify than the headline round suggests.
            claimRefs:
              - CR001
              - CR002
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR006
              - CR009
              - CR010
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.2'
        title: The venue model adds capital intensity, staffing complexity, and launch risk
        blocks:
          - type: paragraph
            body: >-
              Cosm is not a lightweight software business; the public footprint shows a multi-surface venue operator
              with domes, halls, decks, food and beverage service, and a live event calendar that has to stay fresh
              across multiple cities. That model can create differentiation, but it also compounds execution risk
              because the company must staff hospitality operations, enforce alcohol-service and payment controls,
              maintain high-uptime display systems, and open new venues on schedule. Public sources show three operating
              sites by mid-2026 with Detroit and Cleveland still in the rollout queue, while prior financing was
              earmarked for operational excellence, technology expansion, and global expansion. The risk is that a few
              delayed openings, soft utilization periods, or service-control issues can reverberate through a
              still-private cost structure before investors ever get clean venue-level margin data.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR011
              - CR012
      - number: '7.3'
        title: Partner dependency is manageable only if management can prove durable demand
        blocks:
          - type: paragraph
            body: >-
              The strongest mitigation in the current evidence is that Cosm has strategic capital, visible programming,
              and multiple announced sites rather than a single prototype. The weaker point is that demand durability
              and partner concentration are still inferred from calendars, partnerships, and investor narratives rather
              than from disclosed repeat visitation, attach-rate, or site EBITDA data. Public evidence ties Cosm's
              proposition to licensed sports and entertainment programming plus strategic investor relationships, which
              means content access, renewal terms, and launch cadence matter as much as top-line excitement. A practical
              investment posture is to treat Detroit and Cleveland opening performance, venue-level utilization, and any
              disclosed rights concentration as kill criteria: if expansion slips materially, discounting rises to fill
              the calendar, or key counterparties gain de facto control over premium inventory, the bull case weakens
              quickly.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR007
              - CR008
              - CR009
              - CR010
              - CR012
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Kill criteria before price underwriting
            body: >-
              Do not underwrite a clean price until management discloses the Series C preference stack, venue-level
              attendance and repeat-visit cohorts, food and beverage attach rates, site EBITDA or cash contribution, and
              the renewal or termination terms on key rights relationships. A material slip in Detroit or Cleveland
              openings, rising discounting to fill calendars, or evidence that a strategic investor can steer premium
              inventory on non-arm's-length terms should be treated as thesis-break triggers.
            calloutType: risk
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Cosm's financing context improved in 2026 because Sony Pictures led a $100 million Series C and took a
              minority ownership stake, adding strategic validation to the company's earlier $250 million / $1 billion
              2024 financing marker. Public price support did not improve in parallel, however: UpMarket says the
              valuation is not disclosed and that no reputable outlet has reported one, while the same page frames
              access as an illiquid, accredited-only secondary transaction with no guaranteed exit timeline. Tracxn also
              labels the June 2026 financing Series B rather than Series C, creating a round-designation conflict that
              primary documents must resolve. That mix supports a track decision rather than a buy. Capital access is
              real and the strategic story is getting stronger, but outside investors still cannot underwrite the 2026
              entry price, dilution profile, or downside protection from public materials alone.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV012
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV012
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV015
      - number: '8.2'
        title: Thesis, anti-thesis, and scenario framing
        blocks:
          - type: paragraph
            body: >-
              The bull case rests on platform breadth rather than a single dome. AV Magazine said Cosm intended to use
              the 2024 capital to scale operational excellence, expand technology and media units, and accelerate global
              rollout, while Cosm's technology site says owned venues function as live environments where performance is
              refined before capabilities are delivered to partners. The consumer site adds early group sales and
              in-seat food-and-beverage service, implying more than one monetization lever per visit, and a MarketScale
              interview argues the content slate can span sports, theater, art, and proprietary media. The anti-thesis
              is that none of the retained public sources disclose venue-level attendance, repeat visitation,
              food-and-beverage contribution, site EBITDA, or the 2026 post-money valuation, so investors can see growth
              ambition but not yet prove durable cash-on-cash returns.
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV015
      - number: '8.3'
        title: Diligence asks, exit triggers, and what changes the call
        blocks:
          - type: paragraph
            body: >-
              The next diligence step is to replace narrative proof with underwriting proof. Public sources show that
              Cosm can raise strategic capital, is still opening and marketing additional venues, and has a consumer
              model that can blend ticketing with hospitality, but public sources disagree on the 2026 round designation
              and the secondary-market page still warns about illiquidity, transfer restrictions, and unpredictable
              exits. A move above track would require the Series C post-money valuation, ownership sold, liquidation and
              other preference terms, venue build cost and payback by site, and proof that repeat visitation plus
              food-and-beverage attach can offset capex and content-rights intensity. If those disclosures stay private,
              long hold periods, dilution risk, and multiple compression remain the dominant downside triggers.
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, not buy
            body: >-
              The strongest public signal is financing access, not investable price clarity. Until the Series C
              post-money valuation and preference stack are disclosed, the public record supports a watchlist posture
              rather than an aggressive entry.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
          - type: callout
            title: The upside case is a platform thesis
            body: >-
              Cosm's upside depends on proving that venue experiences, partner-facing technology, and media rights
              reinforce each other economically, not just that immersive events can attract attention.
            calloutType: insight
            claimRefs:
              - CV004
              - CV009
              - CV010
              - CV011
              - CV014
          - type: callout
            title: Liquidity is part of the valuation risk
            body: >-
              Even if the company is growing, current public access appears confined to illiquid secondary transactions
              that can involve transfer restrictions and long hold periods, which limits how much valuation premium
              outside investors should underwrite today.
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV015
