      - number: '3.2'
        title: Sony-backed distribution leverage is the main incumbent pressure point
        blocks:
          - type: paragraph
            body: >-
              The most defensible part of Cosm's current position is not venue count; it is the strategic leverage
              created by Sony's Series C lead investment and Ravi Ahuja's board seat. Variety and NBC both describe the
              deal as a $100 million minority investment with governance rights, and Variety adds that Sony wants to
              test franchise IP in the format. Vitrina interprets that setup as a direct challenge to IMAX's incumbent
              role in premium exhibition, because a studio partner now influences both content supply and venue
              development. The threat is still conditional: Cosm's network is far smaller than legacy theatrical
              footprints, and the pool does not show a disclosed exclusivity agreement. But the evidence does show why
              comparable exhibitors cannot evaluate Cosm as a neutral venue operator anymore.
            claimRefs:
              - CP003
              - CP006
              - CP007
              - CP008
              - CP010
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP010
              - CP012
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP010
              - CP011
              - CP014
              - CP015
      - number: '3.3'
        title: Durability still depends on rights access and undisclosed venue economics
        blocks:
          - type: paragraph
            body: >-
              The moat case remains more strategic than proven. The assigned independent analysis argues that live
              sports rights are negotiated access rather than owned assets, and it explicitly says venue-level financial
              returns have not been publicly disclosed. That means the current edge is easiest to describe in
              buyer-experience and distribution terms, but hardest to underwrite on repeat visitation, pricing power, or
              margin durability. Official and trade sources do show a broader content mix than a film-only exhibitor and
              a broader product stack than a single venue chain, which raises switching costs for studios and venue
              partners that want both immersive hardware and programming. Still, the public evidence in this pool is not
              enough to prove that the format can scale without continued access to premium rights, capital, and
              high-traffic real-estate sites.
            claimRefs:
              - CP004
              - CP008
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Board access changes the competitive frame
            body: >-
              Sony's governance rights matter more than current venue count because they make Cosm a partially aligned
              distribution channel rather than a neutral exhibitor competing only on screen quality.
            calloutType: insight
            claimRefs:
              - CP003
              - CP010
              - CP015
          - type: callout
            title: The moat is not yet publicly underwritten
            body: >-
              Public sources in the assigned pool do not disclose venue-level attendance, utilization, repeat
              visitation, or site EBITDA, so the strongest current bear case is that Cosm has strategic backers before
              it has publicly proven venue economics.
            calloutType: risk
            claimRefs:
              - CP011
              - CP012
          - type: callout
            title: Build-vs-buy is a real alternative
            body: >-
              Because Cosm separately markets immersive-theater and event-space solutions, some buyers can pursue the
              same experiential outcome by funding their own venue build rather than partnering with Cosm's branded
              network.
            calloutType: assumption
            claimRefs:
              - CP001
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public monetization
        blocks:
          - type: paragraph
            body: >-
              Public materials support a venue-centric operating model rather than a pure software or subscription
              company. Cosm's official site markets ticketed sports and entertainment programming across multiple
              venues, while third-party profiles describe the primary consumer economics as admission plus on-site
              food-and-beverage spending. The same sources also point to ancillary revenue from technology systems, dome
              deployments, and media/content activities. That matters because underwriting should separate highly
              repeatable software-like revenue from venue- and event-driven revenue: the public evidence here supports
              the latter mix, but not the former. In practice, the business looks more like a capital-intensive
              experiential network with adjacent tech and media monetization than a disclosed recurring-software model.
            claimRefs:
