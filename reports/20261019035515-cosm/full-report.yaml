      - number: '5.3'
        title: Public maturity proof is strongest in venue rollout and institutional installs
        blocks:
          - type: paragraph
            body: >-
              Cosm's product maturity is easiest to verify through physical deployment. HKS documents a large-format
              venue footprint with named dimensions and capacity, the official site shows live and pipeline city assets
              beyond Los Angeles, and AV Magazine linked earlier funding to technology/media buildout plus additional
              venue rollout. Outside the owned venues, third-party evidence also points to B2B deployments in science
              and education: Wikipedia cites the Fort Worth Omni Theater's 8K reopening with Cosm technology and says
              Prague Planetarium's CX System installation combines Digistar 7 with Unreal integration. That does not
              prove attractive unit economics, but it does show the platform has been deployed in more than one
              institutional context.
            claimRefs:
              - CE004
              - CE008
              - CE009
              - CE010
              - CE012
      - number: '5.4'
        title: Public controls are visible, but technical diligence is still thin
        blocks:
          - type: paragraph
            body: >-
              The visible control surface in the assigned evidence set is real but limited. The official site links
              standard legal and privacy pages, and a current job post emphasizes recruiting-scam prevention plus
              venue-safety and alcohol-service rules, which is useful for consumer and operational trust. What the
              public chapter evidence does not show is a technical trust center, uptime history, security-certification
              set, or detailed privacy architecture for the CX or immersive-capture stack. Combined with the heavy
              dependence on rights, live production, and multi-space venue operations, that leaves product reliability
              and partner-governance questions as real diligence blockers rather than cosmetic gaps.
            claimRefs:
