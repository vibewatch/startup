company:
  name: "Cosm"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    Cosm does not compete only with cinemas: the assigned evidence shows a hybrid of ticketed dome venues,
    hospitality-led social viewing, and a technology platform that can also power third-party immersive spaces.
    The sharpest incumbent threat is IMAX and other premium theatrical formats, but the more important near-term
    differentiation is Sony's board-level alignment with Cosm rather than any already-proven unit-economic moat.
sections:
  - id: "competitive-boundary"
    title: "The competitive set is broader than premium cinema alone"
    body: >-
      The assigned sources describe Cosm as both a consumer-facing Shared Reality venue and a supplier of
      immersive-venue technology. That matters because the buyer can solve the same job in several ways: attend
      a premium large-format screening, choose a hospitality-led theater or sports-bar substitute, or fund a
      custom immersive build rather than attach to Cosm's venue network. Cosm's own positioning is explicitly
      comparative. Its FAQ says the format differs from movie theaters and other venues because the experience is
      communal, wraparound, and headset-free, while its technology page markets custom solutions for attractions,
      immersive theaters, and event spaces. In other words, the peer set spans exhibitors, social-viewing
      substitutes, and build-vs-buy venue infrastructure vendors rather than a single theater category.
    claimRefs: ["CP001", "CP002", "CP005", "CP009", "CP013", "CP014"]
    tableRefs: ["TP001", "TP002"]
  - id: "distribution-leverage"
    title: "Sony-backed distribution leverage is the main incumbent pressure point"
    body: >-
      The most defensible part of Cosm's current position is not venue count; it is the strategic leverage created
      by Sony's Series C lead investment and Ravi Ahuja's board seat. Variety and NBC both describe the deal as a
      $100 million minority investment with governance rights, and Variety adds that Sony wants to test franchise
      IP in the format. Vitrina interprets that setup as a direct challenge to IMAX's incumbent role in premium
      exhibition, because a studio partner now influences both content supply and venue development. The threat is
      still conditional: Cosm's network is far smaller than legacy theatrical footprints, and the pool does not
      show a disclosed exclusivity agreement. But the evidence does show why comparable exhibitors cannot evaluate
      Cosm as a neutral venue operator anymore.
    claimRefs: ["CP003", "CP006", "CP007", "CP008", "CP010", "CP015"]
    tableRefs: ["TP003"]
    figureRefs: ["FP001"]
  - id: "durability-and-weak-points"
    title: "Durability still depends on rights access and undisclosed venue economics"
    body: >-
      The moat case remains more strategic than proven. The assigned independent analysis argues that live sports
      rights are negotiated access rather than owned assets, and it explicitly says venue-level financial returns
      have not been publicly disclosed. That means the current edge is easiest to describe in buyer-experience and
      distribution terms, but hardest to underwrite on repeat visitation, pricing power, or margin durability.
      Official and trade sources do show a broader content mix than a film-only exhibitor and a broader product
      stack than a single venue chain, which raises switching costs for studios and venue partners that want both
      immersive hardware and programming. Still, the public evidence in this pool is not enough to prove that the
      format can scale without continued access to premium rights, capital, and high-traffic real-estate sites.
    claimRefs: ["CP004", "CP008", "CP011", "CP012", "CP013", "CP014"]
callouts:
  - calloutType: "insight"
    title: "Board access changes the competitive frame"
    body: >-
      Sony's governance rights matter more than current venue count because they make Cosm a partially aligned
      distribution channel rather than a neutral exhibitor competing only on screen quality.
    claimRefs: ["CP003", "CP010", "CP015"]
  - calloutType: "risk"
    title: "The moat is not yet publicly underwritten"
    body: >-
      Public sources in the assigned pool do not disclose venue-level attendance, utilization, repeat visitation,
      or site EBITDA, so the strongest current bear case is that Cosm has strategic backers before it has publicly
      proven venue economics.
    claimRefs: ["CP011", "CP012"]
  - calloutType: "assumption"
    title: "Build-vs-buy is a real alternative"
    body: >-
      Because Cosm separately markets immersive-theater and event-space solutions, some buyers can pursue the same
      experiential outcome by funding their own venue build rather than partnering with Cosm's branded network.
    claimRefs: ["CP001", "CP014"]
