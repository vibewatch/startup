company:
  name: Cosm
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Cosm refreshes as a private Los Angeles immersive-entertainment platform with
    three operating venues reported as of June 2026, a broader technology/media
    business, and a cap table that has moved from Mirasol-led incubation to a
    Sony-led strategic Series C. Public traction is real, but current valuation
    terms, venue-level economics, revenue, customer count, and a verified current
    headcount are still too opaque to treat as underwritten facts.
sections:
  - id: identity-and-platform
    title: Identity and operating model
    body: |-
      The assigned evidence supports treating Cosm as more than a single-venue
      curiosity. Across company-controlled and independent reporting, the company
      is consistently described as a private immersive technology, media, and
      entertainment operator built around Shared Reality venues, while its own
      technology site shows that management also markets a broader stack spanning
      dome hardware, visualization software, media production, and partner
      deployments. That distinction matters for the rest of the report: later
      chapters should not frame Cosm purely as a local attractions business, because
      the company is explicitly trying to monetize both owned venues and the
      underlying platform.

      The origin story also helps explain why the company narrative blends venue,
      software, and media language. Independent reporting ties Cosm's formation to
      the 2020 acquisition of Evans & Sutherland and related immersive assets,
      rather than to a clean-sheet founding around one flagship venue. In practice,
      that means the overview can anchor later diligence on two linked questions:
      whether the venue rollout creates a durable consumer destination, and whether
      the technology/media stack produces enough third-party leverage to justify a
      platform valuation rather than a pure-location multiple.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO014]
    tableRefs: [TO001]
  - id: leadership-capital-and-governance
    title: Leadership, capital, and governance
    body: |-
      Publicly surfaced leadership centers heavily on CEO Jeb Terry, whose profile
      blends sports-media operating experience, emerging-technology work at Fox,
      and proximity to early backer Steve Winn. That is strategically coherent for
      a company trying to combine live-sports rights, venue operations, and custom
      production technology, but it also creates visible key-person dependence: the
      public story of product direction, partner access, and fundraising remains
      unusually concentrated around Terry and the sponsor network assembled around
      him.

      The cap table has also changed character over time. Independent reporting
      shows a 2024 funding round of more than $250 million backed by Mirasol and
      sports-centric financial investors, followed by Sony Pictures leading a $100
      million Series C in June 2026. The Sony step matters beyond cash: outside
      analysis indicates the investment came with Ravi Ahuja joining the board,
      which raises the strategic value of Cosm's content pipeline while also
      increasing governance complexity because a major rights-holder now has board
      influence inside the venue platform.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO012, CO015]
    tableRefs: [TO002, TO003]
  - id: milestones-scale-and-open-questions
    title: Milestones, scale signals, and open questions
    body: |-
      The milestone sequence is credible enough to show real execution momentum.
      Assigned sources trace the company from its 2020 roll-up, to league and
      broadcast deals, to a Los Angeles launch in 2024 and a second venue in The
      Colony, Texas. A June 2026 analysis then reported Atlanta as Cosm's third
      operating venue. Independent reporting also captures aggressive expansion
      intent, including a 50-location ambition by the end of the decade. That
      progression is directionally positive because it shows Cosm moving from
      concept validation into institutional fundraising and multi-site rollout,
      although the assigned pool does not independently verify post-June 2026
      openings.

      The same evidence set leaves the core underwriting gaps intact. Public
      sources still do not expose a verified current revenue run-rate, customer
      count, venue-level attendance economics, repeat visitation, or a clean,
      source-aligned current valuation for the 2026 round. The chapter therefore
      establishes identity, capital chronology, and leadership as reusable ground
      truth, but it does not elevate those missing operating metrics into false
      precision. Those remain diligence asks, not chapter facts.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
