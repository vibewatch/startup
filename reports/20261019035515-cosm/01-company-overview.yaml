figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Assigned public evidence shows Cosm progressing from a 2020 immersive-tech
      roll-up into a two-site operator with league/broadcast partnerships and a
      Sony-led 2026 strategic round.
    data:
      items:
        - date: "2019"
          label: Jeb Terry joins Mirasol
          detail: SBJ says Terry joined Steve Winn's Mirasol as a managing director in 2019 before leading Cosm.
          tone: neutral
        - date: "2020"
          label: Cosm is officially formed around E&S
          detail: SBJ says a Mirasol affiliate acquired Evans & Sutherland for $14.5M and Cosm was officially formed in 2020.
          tone: positive
        - date: "2020"
          label: LiveLike VR is added to the platform
          detail: SBJ says the same affiliate acquired LiveLike VR later that year, expanding the immersive-media stack.
          tone: positive
        - date: "Early 2023"
          label: NBA becomes an early flagship partner
          detail: SBJ says Cosm first signed the NBA in early 2023 before adding UFC and more broadcaster relationships.
          tone: positive
        - date: "June 2024"
          label: Los Angeles venue launches
          detail: SBJ says the Hollywood Park location opened in June as the first public Shared Reality venue.
          tone: positive
        - date: "July 2024"
          label: Growth financing scales the rollout
          detail: Independent reporting says Cosm raised more than $250M in July 2024 and SBJ says the round valued the company at more than $1B.
          tone: positive
        - date: "September 2024"
          label: The Colony venue opens
          detail: SBJ says the second facility opened outside Dallas, moving the business from one site to two.
          tone: positive
        - date: "June 2026 report"
          label: Atlanta is reported as the third operating venue
          detail: Vitrina reports that Cosm operates venues in Inglewood, North Dallas, and Atlanta.
          tone: positive
        - date: "June 2026"
          label: Sony leads the Series C
          detail: NBC reports a $100M Sony strategic investment and outside analysis says Ravi Ahuja joined the board.
          tone: positive
    approximationNotes: null
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO012, CO013, CO015, CO016]
callouts:
  - calloutType: insight
    title: Platform story is broader than the two owned venues
    body: >-
      Assigned evidence supports viewing Cosm as a venue operator plus an immersive
      technology/media platform, which is why later chapters should test both
      consumer destination economics and third-party platform leverage.
    claimRefs: [CO003, CO004, CO014]
  - calloutType: risk
    title: Public capitalization is visible, but underwriting economics are not
    body: >-
      The cap table is increasingly strategic, yet the assigned evidence still
      leaves current valuation terms, run-rate, attendance economics, and customer
      density unresolved.
    claimRefs: [CO007, CO009, CO010, CO015]
