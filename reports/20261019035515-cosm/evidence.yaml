evidenceGaps:
  - type: missing-source
    severity: minor
    topic: leadership-bench-completeness
    missingEvidence: >-
      A dated official board roster and fuller executive org chart beyond the handful of leaders named in public
      reporting.
    whyItMatters: >-
      The chapter can name the visible operating bench, but it cannot fully assess governance depth or succession
      resilience from the assigned evidence alone.
    diligencePath: >-
      Request an organization chart, current board list, and bios for the next two layers below the named executive
      team.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: series-c-terms
    missingEvidence: >-
      Exact 2026 post-money valuation, ownership sold, preference stack, and formal board rights for the Sony-led Series
      C.
    whyItMatters: Without the price and terms, later valuation work cannot reconcile dilution, governance, or downside protection.
    diligencePath: Request the Series C term sheet, cap-table bridge, and board observer/director rights package from management.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: operating-metrics
    missingEvidence: >-
      Verified current revenue run-rate, customer count, attendance by venue, repeat visitation, food-and-beverage
      contribution, and venue-level EBITDA.
    whyItMatters: >-
      These are the metrics required to decide whether Cosm underwrites like an entertainment venue network, a media
      platform, or both.
    diligencePath: >-
      Request monthly site-level KPI packs, ticketing cohorts, and management reporting for the Los Angeles and The
      Colony venues.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: venue-unit-economics
    missingEvidence: Venue-level attendance, repeat visitation, food-and-beverage mix, and EBITDA or contribution margin by site.
    whyItMatters: These metrics determine whether the rollout target is economically durable or mostly a capital-markets story.
    diligencePath: >-
      Request site-level operating dashboards or lender/investor materials that reconcile attendance, pricing, ancillary
      spend, and margin by venue cohort.
    relatedQuestionRefs:
      - QM009
  - type: missing-source
    severity: material
    topic: spend-based-market-size
    missingEvidence: >-
      An independent market dataset that splits immersive out-of-home sports and entertainment, institutional domes, and
      third-party venue-tech installs.
    whyItMatters: >-
      Without a real spend-based market model, sizing falls back to footprint and ambition proxies that are weaker than
      buyer-budget data.
    diligencePath: >-
      Collect third-party analyst or trade-association data that isolates immersive out-of-home viewing and
      venue-technology spend by end market.
  - type: missing-source
    severity: minor
    topic: budget-ownership
    missingEvidence: Public procurement examples or contract disclosures showing who signs B2B deals and how large those contracts are.
    whyItMatters: >-
      Budget-owner clarity affects sales-cycle length, channel design, and whether the non-owned-venue opportunity is
      material.
    diligencePath: >-
      Pull customer case studies, procurement notices, or contract exhibits from museums, universities, attractions, or
      public development partners.
  - type: missing-source
    severity: material
    topic: venue-economics
    missingEvidence: Venue-level attendance, repeat visitation, food-and-beverage attach rates, and EBITDA by site.
    whyItMatters: >-
      Without site economics, the chapter can describe strategic leverage but cannot prove durable pricing power or
      returns.
    diligencePath: Request site-level operating KPIs and economics from management or venue-level investor materials.
    relatedQuestionRefs:
      - QP007
      - QP008
    relatedTableRefs:
      - TP001
      - TP003
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: Published per-venue ticket ladders, memberships, and corporate or group pricing terms.
    whyItMatters: >-
      Pricing opacity prevents clean comparison against IMAX, curated theaters, and other premium entertainment
      substitutes.
    diligencePath: Collect official ticketing screenshots across events and venues, plus any membership and group-sales schedules.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: enumeration-incomplete
    severity: minor
    topic: competitive-landscape
    missingEvidence: Named alternative dome operators or immersive venue chains with public scale markers in the assigned pool.
    whyItMatters: >-
      The peer set is category-complete enough for strategic framing but not complete enough to benchmark every named
      rival.
    diligencePath: Expand the next search pass toward named dome or immersive-venue operators and retain public scale disclosures.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: programming-governance
    missingEvidence: Sony/Cosm commercial terms, any preferred access rights, and any event-specific exclusivity provisions.
    whyItMatters: Board influence is clear, but the exact economic or contractual edge over other exhibitors is still unverified.
    diligencePath: >-
      Request shareholder, board-rights, or commercial-agreement summaries that define content or programming
      privileges.
    relatedQuestionRefs:
      - QP006
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Venue-level attendance, repeat visitation, per-cap spend, and contribution margin by site.
    whyItMatters: Without site-level economics, investors cannot test whether venue growth adds durable margin or only scale.
    diligencePath: >-
      Request monthly operating dashboards for Los Angeles and Dallas, including attendance, ticket yield,
      food-and-beverage spend, and direct venue costs.
