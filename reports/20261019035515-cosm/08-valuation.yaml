      - [Decision implication, "Do diligence; do not chase", "Need Series C terms, site-level payback, and exit constraints before moving above the watchlist."]
    notes: "Analyst synthesis from retained funding, platform, and secondary-liquidity evidence; reflects current public disclosure limits rather than a negotiated term sheet."
    claimRefs: [CV001, CV003, CV005, CV006, CV007, CV008, CV012, CV015]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Argument, "What would change the view"]
    rows:
      - ["Sony's lead check and minority stake validate strategic interest in immersive distribution.", "Upgrade only if Cosm also discloses the 2026 post-money valuation, ownership sold, and liquidation preferences."]
      - ["Owned venues plus technology and media units could create several revenue pools from one installed base.", "Upgrade only if site-level attendance, repeat visitation, food-and-beverage attach, and venue EBITDA are shown across at least two venues."]
      - ["Visible venue pages for Los Angeles, Dallas, Atlanta, and Detroit support a believable rollout narrative.", "Upgrade only if capex per venue, financing structure, and time to payback are disclosed alongside the rollout plan."]
      - ["Public secondary access exists, but only through illiquid accredited channels with uncertain exits.", "Valuation becomes actionable only if transfer restrictions, exit paths, and pricing versus the last round are documented."]
    notes: "Rows summarize investability arguments and the disclosure threshold needed to move the recommendation."
    claimRefs: [CV002, CV005, CV006, CV007, CV008, CV009, CV010, CV013, CV015]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, "Valuation / return logic", "Key risks", "Probability signal"]
    rows:
      - ["Bull", "New venues ramp on time, repeat visitation is strong, and technology/media revenue scales alongside venue openings.", "Premium private-market outcome becomes defensible only if the 2026 round repriced above the 2024 marker and site-level payback is disclosed.", "Execution slippage, capex overruns, rights-cost inflation.", "Needs disclosed post-money valuation, site EBITDA, and evidence that Atlanta/Detroit expansion converts into repeatable economics."]
      - ["Base", "Growth continues, but public disclosure stays thin and investors still rely on strategic validation instead of unit-economics proof.", "Use the 2024 $1 billion marker as a stale ceiling, not as a current underwriting anchor; maintain watchlist discipline.", "Long hold period, opaque dilution, uncertain venue profitability.", "This is the state most consistent with the retained evidence today."]
      - ["Bear", "Repeat visitation or spend per guest disappoints, expansion consumes more capital, and later investors demand harder terms.", "Down-round or flat-round risk rises because the company remains private, illiquid, and hard to mark from public evidence.", "Multiple compression, preference overhang, delayed exits.", "Persists until the company discloses venue economics, financing terms, and an exit path stronger than secondary liquidity."]
    notes: "Scenario table is directional because retained public sources do not disclose 2026 pricing, venue-level EBITDA, or detailed cap-table terms."
    claimRefs: [CV001, CV003, CV004, CV005, CV006, CV008, CV009, CV010, CV011, CV013, CV015]
