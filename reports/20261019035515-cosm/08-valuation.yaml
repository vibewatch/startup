callouts:
  - calloutType: recommendation
    title: Track, not buy
    body: >-
      The strongest public signal is financing access, not investable price
      clarity. Until the Series C post-money valuation and preference stack are
      disclosed, the public record supports a watchlist posture rather than an
      aggressive entry.
    claimRefs: [CV001, CV002, CV005, CV006]
  - calloutType: insight
    title: The upside case is a platform thesis
    body: >-
      Cosm's upside depends on proving that venue experiences, partner-facing
      technology, and media rights reinforce each other economically, not just
      that immersive events can attract attention.
    claimRefs: [CV004, CV009, CV010, CV011, CV014]
  - calloutType: risk
    title: Liquidity is part of the valuation risk
    body: >-
      Even if the company is growing, current public access appears confined to
      illiquid secondary transactions that can involve transfer restrictions and
      long hold periods, which limits how much valuation premium outside
      investors should underwrite today.
    claimRefs: [CV006, CV007, CV008, CV015]
