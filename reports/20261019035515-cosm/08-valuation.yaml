chapter:
  number: 8
  title: Valuation
  summary: >-
    Sony Pictures' $100 million lead investment in Cosm's June 2026 Series C is
    meaningful strategic validation, but public evidence still does not disclose
    the round's post-money valuation or preference stack. With only a public
    $1 billion marker from the 2024 round and an illiquid, accredited-only
    secondary path, the supportable stance is to keep Cosm on a track posture
    until venue-level economics and financing terms are disclosed.
sections:
  - id: recommendation-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      Cosm's financing context improved in 2026 because Sony Pictures led a
      $100 million Series C and took a minority ownership stake, adding
      strategic validation to the company's earlier $250 million / $1 billion
      2024 financing marker. Public price support did not improve in parallel,
      however: UpMarket says the valuation is not disclosed and that no
      reputable outlet has reported one, while the same page frames access as
      an illiquid, accredited-only secondary transaction with no guaranteed exit
      timeline. Tracxn also labels the June 2026 financing Series B rather than
      Series C, creating a round-designation conflict that primary documents
      must resolve. That mix supports a track decision rather than a buy. Capital
      access is real and the strategic story is getting stronger, but outside
      investors still cannot underwrite the 2026 entry price, dilution profile,
      or downside protection from public materials alone.
    claimRefs: [CV001, CV002, CV003, CV005, CV006, CV007, CV008, CV012, CV015]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-scenarios
    title: Thesis, anti-thesis, and scenario framing
    body: >-
      The bull case rests on platform breadth rather than a single dome. AV
      Magazine said Cosm intended to use the 2024 capital to scale operational
      excellence, expand technology and media units, and accelerate global
      rollout, while Cosm's technology site says owned venues function as live
      environments where performance is refined before capabilities are
      delivered to partners. The consumer site adds early group sales and
      in-seat food-and-beverage service, implying more than one monetization
      lever per visit, and a MarketScale interview argues the content slate can
      span sports, theater, art, and proprietary media. The anti-thesis is that
      none of the retained public sources disclose venue-level attendance,
      repeat visitation, food-and-beverage contribution, site EBITDA, or the
      2026 post-money valuation, so investors can see growth ambition but not
      yet prove durable cash-on-cash returns.
    claimRefs: [CV003, CV004, CV009, CV010, CV011, CV013, CV014]
    tableRefs: [TV002, TV003]
  - id: diligence-asks-and-triggers
    title: Diligence asks, exit triggers, and what changes the call
    body: >-
      The next diligence step is to replace narrative proof with underwriting
      proof. Public sources show that Cosm can raise strategic capital, is still
      opening and marketing additional venues, and has a consumer model that can
      blend ticketing with hospitality, but public sources disagree on the 2026
      round designation and the secondary-market page still warns about
      illiquidity, transfer restrictions, and unpredictable exits. A move above
      track would require
      the Series C post-money valuation, ownership sold, liquidation and other
      preference terms, venue build cost and payback by site, and proof that
      repeat visitation plus food-and-beverage attach can offset capex and
      content-rights intensity. If those disclosures stay private, long hold
      periods, dilution risk, and multiple compression remain the dominant
      downside triggers.
    claimRefs: [CV001, CV005, CV007, CV008, CV010, CV011, CV012, CV013, CV015]
