              - CP002
              - CP005
              - CP006
              - CP007
      - number: '3.3'
        title: 定价模式、切换成本与运营风险
        blocks:
          - type: paragraph
            body: >-
              跨境支付的商业模式在消费者交易端与批发基础设施端分道扬镳。C 端汇款 App 往往打着免手续费或固定费率的旗号揽客，暗中依靠不透明的零售汇率加价赚取暴利；批发级基础设施提供商则采用阶梯式 API
              交易费，搭配协议约定的外汇点差以及月度最低保底承诺。Thunes 主打 80 至 90
              种货币的透明定价与外汇优化，但公开采购评估指出，企业买方仍面临潜在风险：下游合作机构产生的意外中间费用、超出实际业务量的过高保底门槛，以及走廊业务结构变动触发的惩罚性收费。


              B2B 支付基础设施的切换成本主要源自合规入驻审查、技术 API 集成与资金流动性预付。一旦支付服务商或企业嵌入了网络 API、完成了 webhook
              对账数据模型映射，并在运营浮存金账户中注入资金，更换服务商就会带来巨大阻力。尽管如此，成熟的全球金融科技企业普遍采取多供应商备用（multi-homing）策略，以防范单一走廊服务降级并确保路由冗余。此外，客户满意度评价反映出明显的运营摩擦，尤其在交易异常与合规审查期间，客服响应与争议升级处理经常卡壳。管理层坦言，纯粹死磕交易成本会拖垮服务质量，因此坚持把网络稳定性与合规牌照摆在首位，避免卷入同质化的价格战。
            claimRefs:
              - CP009
