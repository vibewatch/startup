              - CR014
      - number: '7.3'
        title: 伙伴依赖、资金流动性与交易对手风险
        blocks:
          - type: paragraph
            body: >-
              Thunes 的商业模式高度依赖于同高增长新兴经济体中战略清算伙伴、商业银行网络及移动钱包运营商的深度连接。战略联盟的扩充——例如 2026 年 10 月与 Absa Group
              围绕非洲市场达成的多币种清算合作，以及赋能超过 11,000 家 SWIFT 成员机构开展钱包直出付款的全球网络对接——在极大拓宽分发触达的同时，也加剧了结构性的交易对手依赖。针对流动性管理，Thunes 在
              90 种货币中运行自研的 SmartX Treasury System，并与 Circle 整合了稳定币预付能力，支持 EURC、USDC 及 USDT 通道。依据其标准条款第 10 条，Thunes
              可酌情提供后付费和紧急出款垫付机制；若债务人合作伙伴在入境结算到账前发生违约，可能引发无抵押信用风险。尽管 Floris de Kort 于 2025 年 4 月表示 Thunes 在 Series D 轮已实现
              $150 million 收入运行率并取得正向
              EBITDA，但由于未经审计的主体级财务报表尚未公开，外界无法独立验证其烧钱速度、利润率韧性以及抵御外汇波动的营运资本缓冲。投资者必须优先在数据室中审查主要伙伴集中度、资金对冲机制以及信用损失拨备情况。
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: 图表展示
        blocks:
          - type: callout
            title: 美国监管落地与各州 MTL 合规重负
            body: >-
              拿下全美全部 50 个州的资金转账牌照（MTL），是 Thunes 北美扩张具有里程碑意义的商业突破，但也带来了沉重且持续的监管开销。各州对于资本充足率、检查周期和担保债券的要求各不相同，使 Thunes
              面临来自各州银行管理局与 FinCEN 的严密审视。单一州的合规疏漏可能引发跨州监管连锁反应，必须建立严密的集中合规治理机制。
            calloutType: risk
            claimRefs:
              - CR001
              - CR004
          - type: callout
            title: 交易与争议责任的合同化分摊
            body: >-
              Thunes 的主条款与条件将运营、争议及监管责任转嫁给商业客户，从而有效筑起自身平台的防火墙。依据第 7、11 和 18 条，Thunes 免除履行保证，将累计赔偿责任上限限制为 6
              个月内所收取的费用总额，并规定因争议、罚款和撤销导致的客户补偿必须见索即付。这虽然保护了 Thunes 的资产负债表，却大幅推高了一级企业级银行的采购阻力。
            calloutType: insight
            claimRefs:
              - CR007
              - CR008
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、反向逻辑与核心驱动因素
        blocks:
          - type: paragraph
            body: >-
              Thunes 的核心投资逻辑聚焦于其成熟的 Direct Global Network (DGN)。该网络作为传统代理行通道的机构级替代方案，覆盖 140 个国家与 90
              种货币。凭借与本地实时支付网络、移动钱包及境内清算系统的直接集成，Thunes 绕过多级代理行中间环节费用，达成 85% 即时结算，并将 720 多家网络成员连接至 12B 个综合终端。公司在 2025 年 4
              月完成 D 轮融资时，据报道达到 $150M 年化收入运行率并取得正 EBITDA，在固定合规成本极高、早期利润率普遍承压的赛道中验证了运营杠杆。此外，Thunes 取得全美 50
              个州的资金传输牌照，并上线直接境内清算能力（ACH、Same-Day ACH 与实时通道），为其打开高利润率的流入美国机构资金流奠定了基础。


              反之，反向逻辑凸显出关键的结构与信息脆弱性。Thunes 缺乏公开财务披露：其据报道的 $150M 收入运行率与正营业利润仍未经审计，致使净抽成率、毛利率压缩趋势及客户集中度均未公开。尽管
              Uber、Deliveroo、Grab 与 WeChat 等一级企业客户均接入该网络，但核心汇款机构或超级应用流失交易量或重新议价，均可能重创其毛利率与
              EBITDA。此外，其服务条款制定了激进的风险缓释机制——包括单方面交易延迟、预充值付款应急资金费，以及强制赔偿托管要求——反映出新兴市场走廊长期存在的营运资金与欺诈风险敞口。在缺乏对 D
              轮投后估值或优先权负担审计可见度的情况下，以推算的数十亿美元估值入场，将面临实质性的估值下调与股权稀释风险。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV014
      - number: '8.2'
        title: 估值背景、稀释负担与投资建议
        blocks:
          - type: paragraph
            body: >-
              Thunes 历经五轮股权融资累计融资 $292M 至 $362M，最终在 2025 年 4 月完成由 Apis Partners 与 Vitruvian Partners 联合领投的 $150M D
              轮融资。此前，公司在 2023 年 7 月 C 轮融资（由 Marshall Wace 领投，募资 $72M）中达到 $900M 投后估值。尽管 D 轮公告确认估值较 C
              轮基准达成“大幅提升”，但公司及领投方均未公开披露确切的投后股权估值，造成无法准确计算估值倍数的信息空白。市场预估其企业价值介于 $1.2B 至 $1.5B 之间，对应其公开宣称的 $150M
              收入运行率，入场倍数为 8.0x 至 10.0x。


              综合网络基本盘规模与披露缺失现状，对该标的给出“观察”（track）的正式建议，置信度为中，风险评级为中，估值立场为“未知”（unknown）。尽管 Thunes 横跨全美 50 个州、MAS 与 FCA
              的监管牌照构筑了坚实的竞争护城河，但在数据室核实经审计财务数据、优先清算权级次及各走廊抽成率稳定性之前，机构资金切勿盲目投入成长期股权或老股流动性。投委会的决策启示在于：在为投资份额定价前，须直接与管理层对话，审阅
              D 轮股东协议及经审计的 2025–2026 年财务报表。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
