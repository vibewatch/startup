  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户客群细分与机构网络成员画像
        blocks:
          - type: paragraph
            body: >-
              Thunes 在 Direct Global Network（DGN）框架下将机构客户划分为不同参与主体类别，统共汇集了 720
              多家网络成员。主要机构客群涵盖传统商业银行与数字银行、支付服务提供商（PSP）、数字钱包运营商、汇款服务商（MTO）以及数字资产企业。在传统银行与汇款领域，Western Union 及大型区域性银行借助
              Thunes 绕过碎片化的代理行通道，将跨境汇款直接路由至收款人银行账户与本地移动钱包。同时，Grab 和 Uber 等零工经济平台与超级 App
              则利用该网络，为新兴市场的网约车司机和外卖商户提供日内即时出款服务。各大客群之所以采用该服务，核心在于能触达 140 个国家的超过 120 亿个终端，使机构成员仅凭单一 API 或既有 Swift
              报文接口，便能即时接入多币种出款通道。
