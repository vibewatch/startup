              - CM002
              - CM008
              - CM009
              - CM011
      - number: '2.2'
        title: 市场规模的多维视角：全球资金流、区域走廊与变现现实
        blocks:
          - type: paragraph
            body: >-
              跨境支付的市场测算往往存在误区，容易把支付交易总额与可变现的基础设施净收入混为一谈。行业预测常引用全球跨国资金流动高达 $150 trillion
              的总体市场空间。然而，这类庞大资金流绝大部分属于大额银行间结算和企业资金调拨，能榨出的基点（bps）变现空间微乎其微。


              区域走廊数据则揭示了真实的结构性摩擦如何孕育高毛利基础设施机会。在拉美地区，受移动优先浪潮以及巴西 Pix 等实时支付系统的带动（Pix 在 2025 年处理了 630 亿笔交易），区域支付规模预计在 2027
              年突破 $300 billion。2023 年流入拉美的汇款规模超过 $156 billion，其中美墨走廊就占了 $66 billion。不仅如此，截至 2025 年底，全球跨境汇款 $200 的平均费率仍高达
              6.36%——比联合国可持续发展目标设定的 3% 上限高出一倍多——印证了新兴市场终端结算效率低下沉疴未愈，也让直连网络运营商得以守住定价权。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM013
      - number: '2.3'
        title: 买方细分、预算归属与接入路径
        blocks:
          - type: paragraph
            body: >-
              Thunes 服务三类运行程序化、规模驱动型跨境业务的机构客户：全球零工经济平台、汇款服务商（MTO）与金融科技公司，以及商业银行或数字银行。在 Grab、Deliveroo、Uber
              这类平台型企业中，采购预算归属于司库与产品运营高管，他们需要将合同工的每日收入自动、实时分发至当地移动钱包。


              面向 Western Union、Remitly、Ria 等汇款机构，核心诉求是无需在 140
              个目的地市场设立实体运营或铺设资产负债表，即可快速拓展出款走廊。商业银行与数字银行则主要依托两条不同技术路径接入：要么采用标准 JSON 数据载荷直连 REST API，要么借助 Thunes 与 SWIFT
              的战略合作——让超过 11,500 家金融机构无需自建 API 连接，便能直接将款项分发至移动钱包。
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM011
              - CM012
      - number: '2.4'
        title: 驱动因素、结构性阻力与尽调现实
        blocks:
          - type: paragraph
            body: >-
              多重结构性顺风正推动 Thunes 的市场扩张：新兴经济体正迅速从现金转向移动钱包、央行推行实时支付强制指令，以及企业对借助 USDC 与 USDT
              出款实现全天候跨境稳定币流动性的需求激增。公司跨司法管辖区的牌照布局——涵盖新加坡 MAS、英国 FCA、法国 ACPR 以及美国 50 个州的资金转账牌照（MTL）——构筑了高耸的监管壁垒，足以挡住无牌聚合商。


              然而，企业迁移面临明显的落地阻力。客户工程团队接入定制出款 API
              需投入大量研发资源。由于缺乏公开价目表、标准费率卡或公开阶梯定价，商务接洽必须逐家谈判，抬高了采购摩擦。此外，企业用户反馈暴露出运营软肋：Tookitaki AML
              筛查导致的合规审核延迟，以及欧美时区的客服响应脱节，导致交易进入异常处理流程时容易产生客诉摩擦；高度自动化的清算速度往往还是会被人工合规处理进度拖慢。
            claimRefs:
              - CM003
              - CM008
              - CM009
              - CM010
              - CM015
              - CM016
      - number: '2.5'
        title: 图表展示
        blocks:
          - type: callout
            title: 直连清算网络吞食传统汇款固化利润
            body: 截至 2025 年底，全球跨境汇款平均交易摩擦仍高达 6.36%；Thunes 这类现代化直连网络绕开代理行链条，在 140 个国家实现约 85% 的即时结算，在为终端客户降费的同时，吃下了高毛利的批发外汇点差。
            calloutType: insight
            claimRefs:
              - CM003
              - CM007
              - CM008
              - CM013
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 跨境基础设施与竞争格局
        blocks:
          - type: paragraph
            body: >-
              跨境支付生态由传统代理行网络、传统汇款服务商、主打零售的汇款 App 以及现代 B2B 支付基础设施平台共同构成。Thunes 明确将自身定位于 B2B 基础设施提供商，运营自研的 Direct Global
              Network，跳过多跳代理行链路，将银行、支付服务商、移动钱包和数字资产平台串联起来。传统的代理行跨境结算通常需要 3 至 5
              个工作日，且在分散的清算体系中伴随着隐性中间行费用与不可预测的外汇点差。相比之下，批发型互联互通网络将直连能力聚合到国内即时清算轨道、M-Pesa 与 GCash
              等移动货币系统以及实时支付体系中，让全球企业能够高度确定地完成资金划转。


              TapTap Send 这类零售跨境玩家聚焦于特定移民走廊的 C2C 移动汇款，并配有专属消费者端 App；而 Thunes 这类基础设施服务商则提供 API 优先的连接层，服务银行、Grab 与 Uber
              等零工经济平台，以及 Western Union 等全球汇款商。直接竞对与相邻赛道玩家包括 Nium、Airwallex、dLocal 等跨境通道服务商，以及 Swift 等企业级报文网络。通过战略合作（例如赋能
              Swift 成员机构接入钱包终端），Thunes 将自身新兴市场走廊深度与既有金融网络报文系统相结合，而非试图全盘颠覆主流银行合作关系。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP009
      - number: '3.2'
        title: 能力差异化、系统架构与技术护城河
        blocks:
          - type: paragraph
            body: >-
              评估批发型跨境支付平台，需综合考察本地通道连通性、合规自动化程度、结算延迟以及资金流动性调度能力。Thunes 的底层架构依托 Direct Global Network，并与 SmartX Treasury
              System 及 Fortress Compliance Platform 协同运作。平台聚合了超过 550 个直连接口，打通全球 60 多个实时银行系统，移动钱包出款的实时到账率高达
              99%，相比传统代理行数日的结算周期大幅压缩。此外，接入 Swift 将覆盖面拓宽至 11,000 家金融机构，对 USDC 和 USDT 等稳定币的支持则打破了传统银行结算时间窗口，实现 24/7
              不间断的流动性再平衡。


              不过，独立技术评估与采购调研也揭示出明显的权衡取舍。供应商评估打分显示，尽管 Thunes
              在出款结算速度与走廊网络深度上斩获高分，但在具体走廊的交易核准率、自动化资金再平衡工具以及拒付拒收保护流程上，公开透明度仍相对有限。买方在挑选跨境网络时必须审慎拆解走廊级表现，因为抢眼的全球覆盖数据往往掩盖了新兴市场中本地合作伙伴宕机、合规门槛参差不齐以及预付款资金沉淀等实际痛点。该领域真正的技术护城河，源于深扎本地的监管牌照与直连终端关系，而非单纯的自研软件算法。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP007
          - type: figure
            figureRef: FP001
