  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块化能力
        blocks:
          - type: paragraph
            body: >-
              Thunes 定位为专业的跨境支付基础设施提供商，赋能金融机构、数字交易平台、超级 App 及跨国商户开展国际资金划转，摆脱对传统代理行体系的依赖。其核心产品为 Direct Global
              Network（DGN），将网络成员连通至全球 140 个国家、90 种货币覆盖下的超过 7 billion 个移动钱包与银行账户，以及 15 billion 张银行卡。Thunes
              无需企业在每个业务属地逐一与本地银行及移动运营商建立双边清算关系，而是将分散的区域通道抽象为统一的集成接入层。核心交易工作流涵盖双向 B2B
              出款、向零工移动钱包发放薪酬、点对点（P2P）汇款处理以及商业付款收单。企业成员既可通过单一 REST API 发起交易，也可利用标准化的 SWIFT MT/MX 报文连接器对接。此外，Thunes
              还提供多币种虚拟账户专属模块，支持企业资金部门留存资金、开立本地化虚拟 IBAN，并在 SEPA、英国快速支付系统（FPS）及美国 ACH 等本地网络中完成收款，而无需在每个目的地走廊设立属地法人实体。
