          - type: callout
            title: 强硬的合同锁定义务与下行定价风险敞口
            body: >-
              尽管 Thunes 的标准合同条款利用最低交易量承诺与提前解约罚款锁定了收入稳定性，但也暴露出企业客户流失的潜在商业软肋。合同中规定若 3 个月内交易量下滑 20%
              即可单方面调高费率，这虽然在走廊业务萎缩时保住了单位经济模型，却可能加速价格敏感型机构客户转向多备用渠道（multi-homing）。投资者必须仔细甄别：公司宣称的正向
