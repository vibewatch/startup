      - number: '6.4'
        title: 图表展示
        blocks:
          - type: callout
            title: 非对称移动钱包连通性驱动的网络效应
            body: >-
              Thunes 的获客护城河核心源自其深扎新兴经济体新型支付方式的连接能力。通过单一 API 聚合了 145 多个移动钱包品牌和 120 亿个数字账户，Thunes
              攻克了传统代理行无法以经济合理成本解决的“最后一公里”出款难题。Visa、Swift 和 Grab 等全球巨头之所以选择与 Thunes 合作，正是为了直达 M-Pesa、GCash 和 Alipay
              等闭环本土钱包生态，而无需在数十个司法辖区费力开展逐一双边谈判。
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU005
          - type: callout
            title: 合同摩擦、休眠惩罚与流失治理
            body: >-
              根据 Thunes 的标准条款与条件，客户账户若持续 6 个月无交易，将面临周期性休眠费或被暂停服务，非活跃达 12 个月即可被终止合同。此外，若客户纠纷率上升或信用状况恶化，Thunes
              拥有广泛的自由裁量权来扣留出款结算资金、要求提供现金抵押品或更改收费结构。这些强硬的合同保护措施固然捍卫了网络稳定性，但一旦交易量发生波动或监管审查收紧，企业客户便面临业务突然停摆的风险。
            calloutType: risk
            claimRefs:
