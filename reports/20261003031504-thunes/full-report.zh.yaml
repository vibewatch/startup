      - number: '8.3'
        title: 情景分析、可比公司倍数与尽调诉求
        blocks:
          - type: paragraph
            body: >-
              将 Thunes 与公开及私有市场可比公司对标，可为公允价值提供参考边界。在公开市场，跨境支付基础设施提供商的估值分化显著：专精教育与医疗跨境支付的 Flywire 交易估值约 2.6x
              历史营收，而高增长企业级处理机构与支付平台交易估值在 4.0x 至 8.0x EV/Revenue 之间，具体取决于毛利率表现与订阅软件属性。私有市场可比公司如 Paysend（$100M 营收对应 $700M
              估值，7.0x EV/Revenue）表明，成熟的国际汇款与 B2B 出款网络在展现出盈利性扩张时，能获得 6.0x 至 8.0x 的估值倍数。


              情景框架评估了截至 2028 年的三种不同发展路径。在乐观情景（Bull Case，25% 概率）下，Thunes 规模化扩展其美国境内清算与 EURC/USDC 稳定币基础设施，营收增至 $250M 且
              EBITDA 利润率达 25%，支撑 14.0x 倍数与 $2,100M 估值（退出时企业价值为 $3,500M）。在基准情景（Base Case，55% 概率）下，走廊稳步扩张配合 20%
              年化增长，将营收拉升至 $190M 并保持稳定正 EBITDA，支撑 9.0x 倍数与 $1,350M 股权估值。在悲观情景（Bear Case，20%
              概率）下，新兴市场汇率波动、监管执法或客户集中度冲击将营收压缩至 $120M，拖累估值倍数降至 4.0x（$600M 估值）并引发估值下调稀释。投资前尽调须优先确认 D
              轮清算优先权级次、核实经审计的各走廊抽成率，并监控客户集中度。
            claimRefs:
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV010
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 展品
        blocks:
          - type: callout
            title: 在获得完整数据室查阅权限前维持观察态度
            body: >-
              尽管 Thunes 作为拥有全美 50 个州资金传输牌照并取得正营业利润的一流跨境支付基础设施提供商，具备极具吸引力的市场地位，但其 D
              轮估值与经审计财务报表缺乏公开披露，造成过高的定价风险。投委会在配置资金前应持续观察该公司，并要求在数据室中确认收入明细、抽成率持续性及优先权结构。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV010
              - CV012
              - CV013
          - type: callout
            title: 估值下调与清算优先权风险敞口
            body: >-
              从私募股权机构 Apis Partners 与 Vitruvian Partners 处筹集 $150M
              后期成长期资金而未披露投后估值，引发了对潜在清算优先权负担的担忧。若此前估值标杆超出了可持续的估值倍数，老股买方或未来轮次参与者在保守退出情景下将面临股权稀释或次级回报风险。
            calloutType: risk
            claimRefs:
              - CV008
              - CV010
              - CV016
