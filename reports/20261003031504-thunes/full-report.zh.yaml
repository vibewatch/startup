  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险分析
        blocks:
          - type: paragraph
            body: >-
              Thunes 在全球 140 多个国家和 90 种货币间开展业务，需要庞大的跨司法管辖区合规与牌照架构作为支撑。公司在各大主要金融中心持有支付机构牌照与授权，包括新加坡金融管理局（MAS）、根据 2017
              年支付服务条例（Ref. 720167）获英国金融行为监管局（FCA）授权、法国审慎监管与决议局（ACPR），以及香港金钱服务经营者（MSO）牌照与覆盖全美 50
              个州的资金转账牌照（MTL）。根据其主商业条款与条件第 4 条，Thunes
              执行极为严苛的“了解你的客户”（KYC）、反洗钱（AML）与反恐怖融资（CTF）入驻审查，要求商业客户在最终实益所有人（UBO）或监管状态发生任何重大变更前，必须至少提前 30 天发出书面通知。第 7
              条则明确保留了 Thunes 拒绝或中止任何可能违反适用法律、制裁禁令或网络规则之交易的权利，从而使网络免受违规牵连。然而，在 50
              个市场维持多管辖区牌照，带来了持续且严峻的现场检查风险、不断攀升的监管资本要求，以及西方与新兴市场监管机构之间潜在的监管政策分歧。尽调工作必须独立核查主要监管枢纽的现场检查报告，并确认其持续合规报告的履行情况。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
      - number: '7.2'
        title: 运营可靠性、信息安全与技术架构
        blocks:
          - type: paragraph
            body: >-
              考虑到 Thunes 对外宣传具备连通 70 亿个移动钱包与银行账户、150 亿张银行卡及 320 多种支付方式的实时跨境结算能力，业务连续性与技术可靠性构成了公司的关键风险维度。公司持有 ISO 27001
              信息安全认证并符合支付卡行业数据安全标准（PCI DSS），集成了 Fortress Compliance Platform 以及 2022 年 4 月通过收购控股权拿下的 Tookitaki AML
              技术栈。尽管自动化筛查与合规控制体系完备，但 RFP.wiki 整理的独立运营基准测试显示，Thunes
              并未公开发布明确的正规在线率服务等级协议（SLA）、公开故障历史看板或各走廊维度的延迟中位数分位数。此外，Thunes 商业条款与条件第 18
              条明确声明对可用性与适用性不作任何保证，对服务中断、停顿或传输故障概不负责；而第 11
              条则规定所有争议、罚金及交易撤销由客户承担即时赔偿责任。缺乏针对分散本地出款通道容灾测试的公开记录导致了运营透明度不足，有必要在数据室尽调中重点核实核心交易引擎的在线率和历史故障切换耗时。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
