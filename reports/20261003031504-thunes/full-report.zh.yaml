      - number: '6.3'
        title: 生产环境落地、企业成效与客户留存治理
        blocks:
          - type: paragraph
            body: >-
              多项企业生产级案例证实了高频企业级部署所带来的实操收益，同时也伴随着不容忽视的治理警示。针对零工经济出款，GrabPay 引入 Thunes 彻底消除了数天的代理行结算周期，让零工群体每日收入能够即时入账至
              GCash 等本地移动钱包。而在批发流动性与资金结算端，加纳的企业跨境出款预付结算周期由 T+2 缩短至当天，菲律宾由 T+1 压缩至 T+0，南非则借助 USDC 结算从半天降至数分钟。然而，在 Thunes
              的标准条款与条件约束下，企业客户的粘性与账户留存受到严苛的合同限制。其运营协议设定了极强的单方救济权：Thunes 保留在账户休眠 6 个月后收取未启用费或注销账户的权利，连续 12
              个月无交易即可终止合同，且一旦出现负面风险评估、合规争议或信用评级下调，有权立即暂停服务或索要现金抵押。这些实操层面的摩擦表明，尽管行业领军企业的商业采用势头强劲，但公司的净留存率与交易量稳定性依然高度依赖严苛的交易对手合规状态与持续活跃的交易频次。
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
