      - number: '1.3'
        title: 融资历程、企业联盟与市场拓展
        blocks:
          - type: paragraph
            body: >-
              Thunes 的股权结构反映了顶级新兴市场私募股权基金与全球金融科技成长期投资机构的分阶段支持。公司于 2019 年 5 月完成由 GGV Capital 领投的 $10 million Series A
              轮融资；随后于 2020 年 9 月完成由 Helios Investment Partners 领投、Checkout.com 与 Future Shape 跟投的 $60 million Series B
              轮融资。在获得 Insight Partners 的成长资金注资后，Thunes 于 2025 年 4 月完成由 Apis Partners 与 Vitruvian Partners 联合领投的 $150
              million Series D 轮融资，累计融资金额突破 $280 million。公司在公布该轮融资时宣布已实现 EBITDA 转正，年化收入运行率达到 $150 million；融资所得款项用于扩建
              Treasury SmartX 与 Fortress Compliance 引擎、整合稳定币出款通道（USDC/USDT），并在全美 50 个州全面落地资金转账牌照（MTL）。商业落地端，公司与 Absa
              Group 等一级银行、Visa 等全球支付网络，以及 Uber、Deliveroo、Grab 等高频平台建立了深度企业级合作。
