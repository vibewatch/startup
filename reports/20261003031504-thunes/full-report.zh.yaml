  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与商业变现架构
        blocks:
          - type: paragraph
            body: >-
              Thunes 的商业变现模型围绕 Direct Global Network（DGN）产生的交易处理费、外汇（FX）点差以及资金流动性管理费展开。核心变现引擎基于按笔收费及按比例收取的通道费，覆盖 140
              个国家和 90 种货币的进出境跨国转账。由商业银行、汇款服务商（MTO）和数字超级 App 构成的商业网络成员，通过专属订单文件约定基础走廊定价和保底交易量承诺。除基础转账费用外，Thunes 还利用自研的
              Thunes 汇率变现多币种波动，在法定货币与各类钱包终端之间赚取批发外汇兑换点差。标准企业合同条款展现了极为强硬的定价保护机制：Thunes 在合同中设定了月度最低交易量门槛与最低走廊保底承诺。若客户在任意连续
              3 个月的考核期内，总交易量或走廊保底承诺下滑至少两成，Thunes 有单方面法律权利自次月起调高适用费率。此外，连续 6
              个月未发起支付交易的休眠机构账户将面临周期性未启用罚金和休眠管理费，展现出公司对已分配网络容量极为严格的合同化变现。
