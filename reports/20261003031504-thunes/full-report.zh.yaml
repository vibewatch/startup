          label: 公司创立
          detail: 作为 TransferTo 旗下 B2B 跨境支付业务部门在新加坡上线启动。
        - date: '2019-03-18'
          label: 结盟 Western Union
          detail: 携手 Western Union，实现在新兴市场直接向移动钱包代付付款的能力。
        - date: '2019-05-01'
          label: A 轮融资
          detail: 完成由 GGV Capital 领投的 $10 million A 轮融资，确立独立运营地位。
        - date: '2020-09-08'
          label: B 轮融资
          detail: 获得由 Helios Investment Partners 领投、Checkout.com、GGV 及 Future Shape 跟投的 $60 million B 轮融资。
        - date: '2022-10-18'
          label: 结盟 Visa Direct
          detail: 携手 Visa，将 78 家数字钱包服务商及 1.5 billion 个数字钱包接入 Visa Direct 网络。
        - date: '2025-04-28'
          label: D 轮大额融资
          detail: 斩获由 Apis Partners 与 Vitruvian Partners 联合领投的 $150 million D 轮融资，披露 EBITDA 转正且年化收入运行率达 $150M。
        - date: '2025-08-31'
          label: 获得美国全美 50 州牌照
          detail: 拿下全美 50 个州的资金汇划牌照，加速北美业务扩张。
        - date: '2025-09-15'
          label: 接入 Swift 网络
          detail: 上线战略级集成方案，让 11,500+ 家 Swift 金融机构能够接入 Thunes 代付终端。
        - date: '2025-10-20'
          label: 上线稳定币代付功能
          detail: 依托统一 API 架构推出 USDC 和 USDT 稳定币结算能力。
        - date: '2026-03-03'
          label: 推出 Absa Global Pay
          detail: 携手 Absa Group 在非洲全境推出以移动端为核心的国际汇款基础设施。
        - date: '2026-07-22'
          label: 入选 CNBC 全球顶尖金融科技榜单
