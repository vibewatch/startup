        title: 图表展示
        blocks:
          - type: callout
            title: 新兴市场钱包接入所蕴含的非对称定价权
            body: >-
              Thunes 的核心变现优势，在于直连新兴经济体超过 145 个数字钱包品牌和本地清算机构。由于代理行无法以划算的成本直接将资金导入 GCash 或 M-Pesa 等本土移动钱包，Thunes
              在极难打通的出款走廊上掌握着巨大的定价话语权。这种独家通道让公司得以在单笔网关费之外打包批发外汇点差，有效抵御了常见 G10 主流法币对上总费率沦为同质化通道的风险。
