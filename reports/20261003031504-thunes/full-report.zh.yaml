companyProfile:
  summary: >-
    Thunes 总部位于新加坡，是一家成立于 2016 年的跨境支付基础设施公司，由 TransferTo 拆分而来。公司旗下 Direct Global Network 仅凭单一 API 即可连通 140
    个国家和地区的金融机构、电子钱包、银行卡及支付合作伙伴；其 SmartX Treasury 和 Fortress Compliance 平台则依托广泛的牌照布局，提供流动性调度与内嵌合规筛查。公司累计获得 $362 million
    股权融资，包括 2025 年 4 月披露的 $150 million Series D 轮融资，并公开宣布已实现 $150 million 收入运行率且 EBITDA 转正，但经审计财务数据与确切估值仍未公开。
