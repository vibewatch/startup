      - number: '6.2'
        title: 业务采用轨迹、交易规模与终端覆盖
        blocks:
          - type: paragraph
            body: >-
              得益于多年来与全球金融网络的深度战略整合，Thunes 的业务足迹与交易规模实现了显著扩张。自 TransferTo 拆分独立以来，Thunes 累计处理交易额已突破 $65
              billion，有力支撑了非洲、东南亚及拉美新兴走廊的实时跨境资金流动。目前网络覆盖 140 个国家和 90 种法定货币，接入超过 220 种支付方式，覆盖 4 billion 个移动及稳定币钱包、8
              billion 个银行账户和 15 billion 张银行卡。与此同时，与 Circle 合作落地的稳定币基础设施加速了企业资金流动性周转：上线后，DGN 成员使用 USDC
              充值的金额环比增长约三分之一，入驻网络成员与直接接受 USDC 的合作伙伴均在 9 个月内突破两位数。此外，双边渠道联盟——例如 Visa Direct 接入覆盖 108 个钱包打款市场，以及 Swift
              连接助力 11,500 家机构无需定制开发即可发起直出付款——进一步在各全球支付终端拉动了结构性交易需求。
            claimRefs:
