      - number: '4.2'
        title: 成本结构、直接交付费用与运营经济模型
        blocks:
          - type: paragraph
            body: >-
              Thunes 的直接成本主要受下游支付清算费、本地出款合作机构分成、外汇对冲成本以及监管资本留存支配。由于网络连通了超过 40 亿个移动及稳定币钱包、80 亿个银行账户和 150
              亿张银行卡，分发至境内终端的每笔出款指令都会产生本地通道清算费、中间行清算费或移动网络运营商（MNO）出款手续费。在数字钱包占主导的新兴市场，本地清算费构成了与交易规模直接挂钩的可变服务交付成本。除可变结算费外，“合规内嵌设计”还带来了巨额结构性运营开支。Thunes
              运行其专有的 Fortress Compliance
              Platform，将反洗钱（AML）自动化实时筛查、制裁审查以及交易监控直接植入支付路由链路。这种内嵌架构虽然防住了灾难性的监管重罚，但也对持续的工程研发以及覆盖 50 多个自有牌照（包含全美 50
              个州的资金转账牌照）的跨辖区合规支出提出了高额要求。营运资金需求和预付流动性同样是其运营经济模型的核心要素：根据 Thunes
              的法律协议，成员必须维持充足余额或接受严苛的抵押担保条款，否则将被延迟付款或冻结账户。
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
