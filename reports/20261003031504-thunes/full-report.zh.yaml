  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、目标支出与产品范畴
        blocks:
          - type: paragraph
            body: >-
              Thunes 切入专门的 B2B 跨境支付基础设施赛道，定位为替代传统 SWIFT
              代理行网络的新型清算与路由骨干网。其核心商业产品聚焦于碎片化支付终端间的高频、程序化出款与资金划转，将企业端发起机构直接连入各本地国内清算系统。


              Thunes 获取的目标支出包括交易路由费、走廊层面的外汇兑换点差（主要货币对通常按高于银行间利率 0.5% 兑换），以及通过 SmartX Treasury
              系统收取的流动性管理费。不过，其市场边界明确排除了入账多币种储备账户、企业员工发卡、费用管理软件以及实体现金或支票处理业务。公司严格执行商业用途条款、禁止个人零售账户，将自身纯粹定位为 B2B2X
              清算底座，而非端到端的企业财务操作系统。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM010
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
