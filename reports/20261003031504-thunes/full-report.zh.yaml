            body: >-
              Thunes 在全球聚拢了 50 多张监管牌照，拿下全美全部 50 个州的资金转账牌照，并直连 70
              亿个移动钱包与银行账户，构筑了牢固的结构性护城河。这彻底砍掉了中间跳转环节，在传统银行轨道失灵的新兴市场走廊实现了 99% 的实时结算。
