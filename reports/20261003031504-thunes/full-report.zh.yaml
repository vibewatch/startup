  - id: TV002
    title: 投资逻辑与反向逻辑矩阵
    columns:
      - 视角
      - 核心论点
      - 底层运营驱动因素
      - 支撑依据与指标
      - 论点被推翻的触发条件
    rows:
      - - 投资逻辑
        - 自建全球网络基础设施形成壁垒
        - 直连本土清算系统与电子钱包，绕过层层加价的代理行网络。
        - 直连全球网络覆盖 140 个国家、90 种货币、720 家网络成员，触达 12B 个综合终端。
        - 开放银行或央行主导的跨境互联体系崛起，直接架空商业聚合清算网络。
      - - 投资逻辑
        - 经营杠杆与资本使用效率得到验证
        - 合规资质与技术平台固定成本已打底，新增跨境交易量可高效转化为自由现金流。
        - 完成 $150M 的 D 轮融资时，公布年化收入运行率达 $150M，并已实现 EBITDA 转正。
        - 经审计财报披露经营活动现金流为负，或存在严重的收入集中度。
      - - 投资逻辑
        - 战略进军美国市场并打通数字资产互操作性
        - 直连美国本土清算系统（ACH 及实时支付网络），并具备稳定币财资管理能力。
        - 拿下全美 50 州资金汇划牌照，并上线实时美元入境付款清算功能。
        - 监管部门对金融科技跨境清算或稳定币桥接业务出台限制政策。
      - - 反向逻辑
        - 信息不对称与估值不透明
        - 公开财务披露缺位，掩盖了净抽成率真实水平及潜在的清算优先权包袱。
        - 尽管注入 $150M 资金，但 D 轮投后估值仍未公开披露。
        - 管理层在尽调中提供经审计财务报表及完整股权结构表。
      - - 反向逻辑
        - 合作伙伴依赖与固有结算风险
        - 严苛的合同条款将信用风险、交易冲正及预付资金风险转嫁给网络成员承担。
        - 服务条款强制执行紧急调资费用、单方面暂扣款项及交易逆转冲正。
        - 能切实证明具备自动化的实时预付信用评分及零损失合作伙伴抵押品机制。
      - - 反向逻辑
        - 低成本金融科技聚合商引发毛利率挤压
        - 全球收单机构与新兴支付网络持续对企业跨境走廊施加结构性降价压力。
        - 上市对标公司估值倍数较低（如 Flywire 为 2.6x 市销率），反映出公开市场对利润率的严苛审视。
        - 净收入留存率（NRR）持续高于 125%，且在小众冷门走廊具备有据可查的定价权。
    notes: 围绕网络覆盖、财务透明度与走廊风险，全面剖析核心投资支柱及对应的反向论点。
