        blocks:
          - type: callout
            title: 双引擎互操作架构
            body: >-
              Thunes 凭借双通道接入模式，在分发端拉开了与传统代理行及闭环汇款模式的差距。金融机构既可经由 Thunes 的统一 API 直接对接，也能复用既有的 Swift
              连接，无需定制开发即可触达移动钱包、银行账户和稳定币地址等超过 120 亿个综合终端。
            calloutType: insight
