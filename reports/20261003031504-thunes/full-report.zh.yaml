              - CO015
      - number: '1.2'
        title: 高管团队、治理结构与运营扩张
        blocks:
          - type: paragraph
            body: >-
              Thunes 管理层兼具新兴市场支付专业能力与机构级跨境扩张经验，但公司在高速成长期也经历了重大高管更迭。联合创始人 Peter De Caluwe 从早期扩张阶段一直担任首席执行官至 2024
              年初，随后转任副董事长，并于 2025 年 8 月重返 CEO 职位。在此期间，支付行业老牌高管 Floris de Kort 出任 CEO，主导完成了 2025 年 4 月公布的 $150 million
              Series D 轮融资。2025 年 12 月，Chloé Mayenobe 出任副
              CEO，负责战略扩张、算法资金管理与网络优化，进一步强化了治理与运营执行力。中层管理和工程团队把服务质量、风险控制放在单纯价格竞争之前；交易量爆发式增长时，创收型产品项目与客户体验基础设施也在争夺内部资源。
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
