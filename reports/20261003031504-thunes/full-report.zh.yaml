      - number: '4.3'
        title: 资本充足率、融资轨迹与尽调结论
        blocks:
          - type: paragraph
            body: >-
              资本储备端，完成由 Apis Partners 与 Vitruvian Partners 领投的 $150 million Series D 轮融资后，Thunes 拥有极充裕的资产负债表。自 2016 年从
              TransferTo 剥离重组以来，公司历经 5 轮机构融资，累计股权融资金额已达 $362 million。公司披露的信息显示，Thunes 在 Series D 轮完成的同时实现了运营盈利与正向
              EBITDA，跻身极少数摆脱了稀释性烧钱依赖的规模化金融科技基础设施公司之列。Series D
              轮资金正被积极投入资本密集型的地域扩张，其中最显著的动作是在纽约联合广场设立新中心，以补充旧金山与亚特兰大的既有业务。然而，站在投资判断与尽调视角下，核心财务输入项仍完全无法获取。关键指标如净留存率（NRR）、冷门货币走廊与高流动性货币走廊的总费率（take-rate）、经审计的
              EBITDA 利润率，以及 Visa 和 Grab 等核心大客户的集中度，均属于严格保密的未公开数据。在独立审计验证其自述的 EBITDA
              利润率能否承受合规成本与交易对手信用风险冲击之前，机构投资人只能将该公司的财务质量归类为前景向好但尚未得到证实。
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
