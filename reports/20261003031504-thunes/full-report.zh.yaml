      - number: '5.2'
        title: 工作流架构与技术运营模式
        blocks:
          - type: paragraph
            body: >-
              Thunes 的运作机制彻底跳出了传统多跳代理行模式：在传统链路中，跨国转账通常要在多家中间清算机构之间流转 3 至 5 个工作日，且层层扣除无法预测的手续费。相反，Thunes
              采用直连网络拓扑结构，搭配自研的实时账本引擎。当发起方成员通过 REST API 或 Temenos Exchange 适配器等合作连接器提交支付指令时，该笔交易立即进入自动化处理流水线。流水线首先调用
              Fortress Compliance Platform，对照国际制裁名单、反洗钱（AML）框架及属地监管数据库实时筛查汇款人与收款人信息。与此同时，SmartX Treasury System 针对支持的 90
              种货币锁定外汇兑换汇率，并从 Thunes 全球结算账户中调拨预置的日间流动性。一旦合规与流动性校验通过，指令就会直连目标境内的国内清算系统、国家级实时支付系统，或
              GCash、M-Pesa、Airtel、WeChat Pay 等移动钱包交换中心。超过 85% 的交易能够即时结算，移动钱包出款的实时到账率更是高达 99%。这种极高的直通式处理率（STP）相比纯走传统
              SWIFT 代理行路由，可将人工调查核实量削减最高 60%。
