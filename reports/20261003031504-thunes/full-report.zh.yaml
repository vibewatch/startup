  - id: FE001
    title: Thunes 直连全球网络技术架构分层
    type: stack
    summary: 逻辑架构层级涵盖开发者集成接入、交易编排、智能分析引擎以及全球最后一公里清算端点。
    data:
      layers:
        - label: 客户接入与合作伙伴网关层
          detail: 统一接入入口，支持 REST API、SWIFT MT/MX 连接器、Temenos Exchange 核心银行连接器及 Cybersource 支付网关。
        - label: 交易编排与微服务层
          detail: 采用 Golang 编写的低时延分布式路由微服务，统一管理交易状态、幂等性与高并发事件流水线。
        - label: SmartX Treasury 与流动性引擎
          detail: 24/7 全自动多币种流动性优化、覆盖 90 种货币的实时外汇定价，以及日间往来账户（nostro）头寸自动再平衡。
        - label: Fortress Compliance 与风控平台
          detail: 实时反洗钱/反恐怖融资制裁筛查、政治敏感人物（PEP）自动化核查，以及严格落实 50 张运营牌照要求的合规规则引擎。
        - label: 本地清算系统与虚拟账户网络
          detail: 签发虚拟 IBAN 并集成 SEPA、Faster Payments System（FPS）、ACH 及各国本地实时清算系统。
        - label: 全球最后一公里交付端点
          detail: 直连 140 个国家和地区的 7B+ 移动钱包与银行账户、15B 张银行卡，以及 320+ 种本地替代支付方式。
    approximationNotes: 逻辑技术架构抽象整理自官方技术白皮书、合作伙伴通告及工程技术招聘岗位说明。
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE006
      - CE007
      - CE010
      - CE011
      - CE012
  - id: FU001
    title: Thunes 企业客户生命周期与流动性扩张飞轮
    type: journey-map
    summary: 图解直连全球网络中机构入驻审核、多网络集成、实际代付执行及财资流动性扩张的全流程。
    data:
      items:
        - label: 机构资质评估与合规尽调
          stage: 机构资质评估与合规尽调
          touchpoints:
            - 基于 Fortress Compliance 平台完成 KYC 及最终受益人（UBO）穿透核验
            - 核查 50 个市场的本地牌照覆盖广度与合规业务范围
            - 对比评估 API 直连集成与 Swift 网络接入的商业可行性
        - label: 技术集成与沙箱测试
          stage: 技术集成与沙箱测试
          touchpoints:
            - 完成 API 直连集成或 Swift ISO 20022 报文配置
            - 由解决方案交付团队主导工程实施与客户上线辅导
            - 跨银行账户、银行卡与移动钱包开展全走廊路由测试
        - label: 生产环境投产与支付路由
          stage: 生产环境投产与支付路由
          touchpoints:
            - 在 140 个国家和 90 种货币网络中实际执行实时代付
            - 即时确认交易状态，并提供透明的外汇牌价与费用对账
            - 持续监控 SLA 履约达标率，以 85% 即时结算率为基准
        - label: 财资优化与流动性扩张
          stage: 财资优化与流动性扩张
          touchpoints:
            - 接入 SmartX Treasury 以压降往来账户（nostro）沉淀闲置资金占用
            - 启用 24/7/365 全天候 USDC 稳定币结算，规避银行假日资金在途占用
            - 将走廊进一步拓展至新兴市场的小众移动钱包网络
        - label: 账户监控与防休眠管理
          stage: 账户监控与防休眠管理
          touchpoints:
            - 持续监控交易频次与流速，避免触发 6 个月未交易的休眠标记
            - 跟踪交易冲正与争议率，确保结算通道畅通无阻
            - 执行年度资格复审，维系网络活跃成员身份
        - label: 多网络走廊与合作伙伴拓展
          stage: 多网络走廊与合作伙伴拓展
          touchpoints:
            - 在 108 个市场交叉销售直联卡充值（push-to-card）与钱包代付（send-to-wallet）路由
            - 在 145 个数字钱包品牌中开通替代支付方式
            - 将机构代付走廊进一步延伸至拉美、非洲及亚洲
    approximationNotes: 综合梳理自 Thunes 产品技术架构、技术实施文档以及与 Circle 合作的客户案例研究。
    claimRefs:
      - CU001
      - CU009
      - CU011
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 绘制核心风险维度下残留严重程度、发生概率与缓解措施成熟度的风险矩阵。
    approximationNotes: 发生概率与严重程度评级为定性评估，依据监管申报文件、商业合同条款以及第三方运营基准推导得出。
    data:
      columns:
        - 低发生概率
        - 中等发生概率
        - 高发生概率
      rows:
        - label: 监管与法律风险
          values:
            - MAS / FCA 监管合规
            - 美国 50 州 MTL 牌照审查
            - 本地牌照监管差异
        - label: 运营与安全风险
          values:
            - 制裁筛查违规
            - 核心 API 网关宕机
            - 本地支付通道端点中断
        - label: 交易对手集中度风险
          values:
            - SWIFT 网络接口政策
            - Absa 清算依赖
            - 区域出款合作伙伴中断
        - label: 财务与流动性风险
          values:
            - 信息安全入侵
            - 应急资金违约
            - 未对冲外汇波动
        - label: 治理与管理层风险
          values:
            - 继任规划摩擦
            - CEO 连任稳定性
            - 关键人员集中度
        - label: 市场与执行风险
          values:
            - 稳定币脱锚敞口
            - 未经审计 EBITDA 尽调风险
            - 新兴市场外汇管制
    claimRefs:
      - CR001
      - CR005
      - CR009
      - CR014
  - id: FV001
    title: 投资建议决策逻辑
    type: flow
    summary: 将网络规模、合规牌照、财务不确定性与估值不透明度串联起来的决策链，最终导向“观察”建议。
    data:
      nodes:
        - id: network-scale
          label: 直连全球网络规模
          description: 覆盖 140 个国家、90 种货币，触达 12B 复合端点。
        - id: regulatory-moat
          label: 监管与合规护城河
          description: 在 50 个市场持有牌照，包括 MAS、FCA 以及全美 50 个州的 MTL 牌照。
        - id: financial-traction
          label: 披露的财务进展
          description: Series D 轮声称达到 $150M 收入运行率，且 EBITDA 为正。
        - id: valuation-baseline
          label: 前期估值基准
          description: 2023 年 7 月 Series C 轮确立的 $900M 估值基准。
        - id: disclosure-opacity
          label: 审计财务与估值不透明度
          description: Series D 轮估值未披露；未公开经审计的 GAAP 财务报表。
        - id: final-recommendation
          label: “观察”建议
          description: 保持持续尽调；入场前须经数据室验证。
      edges:
        - from: network-scale
          to: regulatory-moat
        - from: regulatory-moat
          to: financial-traction
        - from: financial-traction
          to: valuation-baseline
        - from: valuation-baseline
          to: disclosure-opacity
        - from: disclosure-opacity
          to: final-recommendation
    approximationNotes: 反映从运营优势到一级市场披露限制的逐级分析决策层级。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV010
      - CV012
      - CV013
