chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业定位与 Direct Global Network 基础设施
        blocks:
          - type: paragraph
            body: >-
              Thunes 于 2016 年正式成立，前身为 TransferTo 拆分为独立 B2B 和消费者业务实体后的产物。公司提供跨境支付基础设施，连接各类新型支付方式与传统银行通道。Thunes
              总部设在新加坡，在全球拥有 14 个区域运营中心，其自研的 Direct Global Network 旨在绕开传统代理行模式的瓶颈。该平台将 720 多家网络成员连接至 140 个国家、90
              种法定货币覆盖下的超过 40 亿个移动及稳定币钱包、80 亿个银行账户和 150 亿张银行卡。Thunes 并不依赖费率难以预测且需数日结算的冗长中间链条，其 85%
              的交易实现即时结算，在主要国际走廊中，移动钱包转账的实时到账率达到 99%。网络成员既可借助统一 API 接入，也能利用与 Swift 的战略合作对接——超过 11,500
              家参与的金融机构无需定制技术开发，即可直接向收款人的钱包与账户分发款项。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO001
            claimRefs:
