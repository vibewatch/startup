callouts:
  - calloutType: "insight"
    title: "Network Effects Driven by Asymmetric Mobile Wallet Connectivity"
    body: "Thunes' primary customer acquisition moat stems from its deep connectivity into alternative payment methods across emerging economies. By aggregating over 145 mobile wallet brands and 12 billion digital accounts through a single API, Thunes solves the last-mile payout problem that legacy correspondent banks cannot address economically. Global giants like Visa, Swift, and Grab partner with Thunes specifically to access closed-loop local wallet ecosystems such as M-Pesa, GCash, and Alipay without negotiating bilateral integrations in dozens of separate jurisdictions."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU005"
  - calloutType: "risk"
    title: "Contractual Friction, Inactivity Penalties, and Churn Governance"
    body: "Under Thunes' standard terms and conditions, customer accounts that remain inactive for six months face recurring dormancy fees or service suspension, and contracts may be terminated after twelve months of inactivity. Furthermore, Thunes maintains broad discretion to withhold outward settlements, demand cash collateral, or modify fee structures if a customer's dispute rate rises or credit profile deteriorates. These aggressive contractual protections safeguard network integrity but expose enterprise customers to sudden operational suspension if transaction volumes fluctuate or regulatory scrutiny increases."
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
