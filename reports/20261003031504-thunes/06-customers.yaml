  title: "Customers"
  summary: "Thunes serves over 720 Network Members across financial institutions, digital wallet providers, and global platforms, providing real-time payout connectivity across 140 countries and 90 currencies. Strategic adoption is validated by tier-one partners including Visa, Western Union, Grab, and Circle, though commercial concentration and strict unilateral termination provisions in standard terms present operational risks."
sections:
  - id: "customer-segmentation-and-network-members"
    title: "Customer Segmentation and Institutional Member Profile"
    body: "Thunes groups its institutional customer base into distinct participant classes under its Direct Global Network (DGN) umbrella, collectively encompassing more than 720 Network Members. The primary institutional segments comprise traditional commercial banks and neobanks, payment service providers (PSPs), digital wallet operators, money transfer operators (MTOs), and digital asset enterprises. In traditional banking and money transfer, institutions such as Western Union and major regional banks leverage Thunes to bypass fragmented correspondent banking rails, routing cross-border remittances directly into recipient bank accounts and local mobile wallets. Meanwhile, gig-economy platforms and super-apps such as Grab and Uber utilize the network to power immediate intraday payouts for drivers and delivery merchants in emerging markets. Enterprise adoption across these segments is driven by access to over 12 billion endpoints across 140 countries, enabling institutional members to achieve immediate multi-currency payout connectivity via a single API or existing Swift messaging interfaces."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-trajectory-and-endpoint-scale"
    title: "Adoption Trajectory, Volume Scale, and Endpoint Reach"
    body: "The operational footprint and volume trajectory of Thunes have expanded significantly through multi-year strategic integrations with global financial networks. Since its inception following the corporate spin-out from TransferTo, Thunes has accumulated over $65 billion in cumulative processed volume, supporting real-time cross-border money movement across emerging corridors in Africa, Southeast Asia, and Latin America. Network scale reaches 140 countries and 90 fiat currencies, spanning 4 billion mobile and stablecoin wallets, 8 billion bank accounts, and 15 billion cards accessible via more than 220 payment methods. In parallel, the deployment of stablecoin infrastructure in partnership with Circle has accelerated corporate treasury liquidity: DGN member funding volumes using USDC expanded by approximately one-third month-over-month following launch, with both onboarded network members and partners directly accepting USDC reaching double digits within nine months. Furthermore, bilateral channel alliances, such as Visa Direct's integration covering 108 send-to-wallet markets and Swift's connectivity enabling 11,500 institutions to initiate direct payouts without bespoke integration, have broadened structural transaction demand across global payment endpoints."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
    tableRefs:
      - "TU002"
  - id: "production-deployments-and-customer-durability"
    title: "Production Deployments, Enterprise Outcomes, and Retention Governance"
    body: "Production case studies confirm tangible operational benefits for high-volume enterprise deployments, alongside critical governance caveats. In gig-economy payouts, GrabPay deployed Thunes to eliminate multi-day correspondent banking settlement cycles, enabling gig workers to receive daily earnings credited immediately to local mobile wallets like GCash. In wholesale liquidity and treasury settlement, cross-border corporate payout pre-funding timelines in Ghana contracted from T+2 to same-day, in the Philippines from T+1 to T+0, and in South Africa from half a day to minutes via USDC settlement. However, enterprise customer durability and account retention face rigorous contractual boundaries under Thunes' standard terms and conditions. The operating agreement establishes strict unilateral remedies: Thunes reserves the right to charge non-usage fees or deactivate accounts after six months of dormancy, terminate contracts after twelve months of inactivity, and immediately suspend services or demand cash collateral upon adverse risk assessments, compliance disputes, or credit rating downgrades. These operational frictions underscore that while commercial adoption among market leaders remains robust, net revenue retention and volume consistency remain closely tethered to stringent counterparty compliance and active transaction velocity."
    claimRefs:
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
    tableRefs:
      - "TU003"
