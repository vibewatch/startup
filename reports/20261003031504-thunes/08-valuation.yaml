chapter:
  number: 8
  title: "Valuation"
  summary: "Thunes presents a high-conviction infrastructure asset in cross-border B2B payments with expanding gross margins and positive EBITDA, yet the lack of public disclosure on its Series D post-money valuation, audited financial results, and unit take-rates necessitates a disciplined 'track' stance. Valuing the business across bull ($2,100M, 14.0x run-rate), base ($1,350M, 9.0x run-rate), and bear ($600M, 4.0x run-rate) scenarios highlights significant upside tied to direct US domestic clearing and stablecoin treasury adoption alongside downside risks from platform partner concentration and regulatory exposure."
sections:
  - id: "investment-thesis-and-anti-thesis"
    title: "Investment Thesis, Counter-Thesis, and Fundamental Drivers"
    body: "The core investment thesis for Thunes centers on its established Direct Global Network (DGN), which operates as an institutional alternative to traditional correspondent banking rails across 140 countries and 90 currencies. By integrating directly into local real-time payment networks, mobile wallets, and domestic clearing systems, Thunes bypasses multi-tier intermediary correspondent fees, delivering 85% immediate settlement and connecting over 720 network members to 12 billion composite endpoints. The company's achievement of a reported $150 million annualized revenue run-rate alongside positive EBITDA at its April 2025 Series D validates operational leverage in a sector where high fixed compliance costs traditionally depress early margins. Furthermore, obtaining money transmitter licenses across all 50 US states and introducing direct domestic clearing (ACH, Same-Day ACH, and real-time rails) positions Thunes to unlock high-margin inbound corporate flows into the United States.\n\nConversely, the anti-thesis highlights critical structural and informational vulnerabilities. Thunes operates without public financial disclosures: its reported $150 million revenue run-rate and positive operating profit remain unaudited, leaving net take-rates, gross margin compression, and customer concentration opaque. While Tier-1 enterprises such as Uber, Deliveroo, Grab, and WeChat rely on the network, the loss or renegotiation of volume from a key money transfer operator or super-app could severely impair gross margin and EBITDA. Additionally, its terms of service establish aggressive risk-mitigation measures—including unilateral transaction deferrals, emergency funding fees on pre-funded payments, and required indemnity escrows—reflecting persistent working-capital and fraud exposures across emerging-market corridors. Without audited visibility into the Series D post-money valuation or preference overhang, entering at an imputed multi-billion-dollar valuation presents meaningful down-round and dilution risk."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
    tableRefs:
      - "TV002"
  - id: "recommendation-and-valuation-context"
    title: "Valuation Context, Dilution Overhang, and Investment Recommendation"
    body: "Thunes has raised a cumulative total of between $292 million and $362 million across five equity rounds, culminating in a $150 million Series D in April 2025 co-led by Apis Partners and Vitruvian Partners. Prior to this round, the company achieved a $900 million post-money valuation in its July 2023 Series C ($72 million raised led by Marshall Wace). Although the Series D announcement confirmed a 'substantial valuation increase' over the Series C mark, neither the company nor its lead investors disclosed the exact post-money equity valuation, creating an information gap that precludes definitive multiples calculation. Market estimates suggest an enterprise value ranging from $1.2 billion to $1.5 billion, implying an entry multiple of 8.0x to 10.0x on its stated $150 million revenue run-rate.\n\nSynthesizing fundamental network scale against disclosure deficits yields a formal recommendation of 'track' with medium confidence, a medium risk rating, and an 'unknown' valuation stance. While Thunes' regulatory foundation across 50 US states, MAS, and the FCA provides an immense competitive moat, institutional capital must not commit growth equity or secondary liquidity without data-room verification of audited financials, senior liquidation preferences, and corridor take-rate stability. The decision implication for investment committees is to establish direct dialogue with management to inspect the Series D shareholder agreement and audited 2025–2026 financial statements before pricing an allocation."
    claimRefs:
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV013"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "scenario-analysis-and-comparable-benchmarks"
    title: "Scenario Analysis, Peer Multiples, and Diligence Asks"
    body: "Evaluating Thunes against public and private peers provides guardrails for fair value. In public markets, cross-border payment infrastructure providers trade across wide valuation dispersions: specialized education and healthcare cross-border platform Flywire trades at approximately 2.6x trailing revenue, while high-growth enterprise processors and payment platforms trade between 4.0x and 8.0x EV/Revenue depending on gross margin profile and recurring software attributes. Private market comparables such as Paysend ($700 million valuation on $100 million revenue, 7.0x EV/Revenue) demonstrate that established international remittance and B2B payout networks command 6.0x to 8.0x multiples when demonstrating profitable scaling.\n\nOur scenario framework assesses three distinct trajectories through 2028. In the Bull Case (25% probability), Thunes scales its US domestic clearing and EURC/USDC stablecoin infrastructure, expanding revenue to $250 million with 25% EBITDA margins, supporting a 14.0x multiple and a $2,100 million valuation ($3,500 million enterprise value at exit). In the Base Case (55% probability), steady corridor expansion and 20% annual growth lift revenue to $190 million with stable positive EBITDA, supporting a 9.0x multiple and a $1,350 million equity valuation. In the Bear Case (20% probability), emerging-market FX volatility, regulatory enforcement, or client concentration shocks compress revenue to $120 million, driving multiples down to 4.0x ($600 million valuation) and triggering down-round dilution. Pre-investment diligence must prioritize confirming Series D liquidation preference seniority, verifying audited corridor take-rates, and monitoring customer concentration."
    claimRefs:
      - "CV014"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV003"
