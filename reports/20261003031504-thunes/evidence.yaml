evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Audited confirmation of Series D post-money equity valuation and fully diluted cap table breakdown.
    whyItMatters: >-
      Essential for determining ownership dilution, preference liquidation overhang, and market enterprise value
      multiples.
    diligencePath: >-
      Obtain confidential Series D investment agreements, shareholder registers, or audited cap table from financial
      data room.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: financial-performance
    missingEvidence: Audited financial statements confirming GAAP/IFRS revenue breakdown, net margin, and EBITDA reconciliation.
    whyItMatters: >-
      Reported $150M revenue run-rate and positive EBITDA are unaudited headline statements requiring structural
      validation.
    diligencePath: >-
      Review audited statutory financial filings filed with ACRA (Singapore) or request management accounts during data
      room diligence.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: >-
      Comprehensive directory of VP-level functional leaders and regional managing directors across all 14 operating
      hubs.
    whyItMatters: Helps evaluate regional bench depth, compliance oversight across emerging corridors, and operational redundancy.
    diligencePath: Request executive organizational chart and regional operating roster from company management.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Complete schedule of minority institutional co-investors, debt facility providers, and secondary equity
      participants.
    whyItMatters: Verifies liquidation stack priority, secondary transaction liquidity, and minority shareholder veto rights.
    diligencePath: Review full capital structure and corporate register from ACRA and shareholder rights agreements.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: pricing-schedule
    missingEvidence: Audited rate card, fee tiers, corridor-level basis point margins, and volume discount schedules.
    whyItMatters: >-
      Without published rate cards, unit economics, gross margins, and net take rates cannot be independently
      calculated.
    diligencePath: Request standard member fee schedules and corridor-specific rate cards from Thunes enterprise sales data room.
    relatedQuestionRefs:
      - QM007
  - type: missing-source
    severity: minor
    topic: customer-churn
    missingEvidence: Independent cohort retention, net revenue retention (NRR), and gross revenue retention (GRR) metrics.
    whyItMatters: >-
      Durability of high-volume marketplace and MTO integration volumes cannot be verified from public marketing
      materials alone.
    diligencePath: Inspect audited customer cohort retention logs and historical churn tables during management diligence.
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Audited gross margin percentage and breakdown of direct network clearing costs versus net retained take-rate.
    whyItMatters: >-
      Gross margin defines the unit-level profitability of routing payments across emerging versus developed market
      payout endpoints.
    diligencePath: >-
      Request confidential management financial exhibits showing gross revenue, pass-through network costs, and gross
      profit by corridor.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue-retention
    missingEvidence: >-
      Historical Net Revenue Retention (NRR) and Gross Revenue Retention (GRR) cohorts across institutional customer
      segments.
    whyItMatters: >-
      Retention metrics demonstrate whether existing network members expand transaction throughput organically or
      experience volume attrition.
    diligencePath: Obtain quarterly historical customer cohort retention tables covering the trailing 36 months under NDA.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Share of total revenue and transaction volume concentrated within the top five institutional network members.
    whyItMatters: >-
      Heavy reliance on anchor partners like Visa or Grab poses severe cash flow vulnerability if commercial contracts
      are renegotiated.
    diligencePath: Inspect anonymized customer revenue contribution schedule in the confidential data room.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: minor
    topic: total-funding
    missingEvidence: >-
      Reconciliation between Tracxn-reported $362M cumulative funding across 5 rounds and historical media reports
      citing $280M–$292M.
    whyItMatters: >-
      Discrepancies in total funding figures create ambiguity around secondary share sales versus primary balance-sheet
      capital injections.
    diligencePath: Review the comprehensive institutional capitalization table and historical share subscription agreements.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: corridor-latency-and-uptime
    missingEvidence: >-
      Audited transaction latency distribution and uptime logs disaggregated by specific clearing corridor and mobile
      wallet provider.
    whyItMatters: >-
      Headline 99% real-time metrics mask variance across volatile emerging market mobile network operators and domestic
      payment rails.
    diligencePath: >-
      Request trailing 12-month SLA performance reports and corridor-level success/error logs from the technical data
      room.
    relatedQuestionRefs:
      - QE003
      - QE007
    relatedTableRefs:
      - TE001
  - type: missing-source
    severity: minor
    topic: developer-sdk-and-public-benchmarks
    missingEvidence: >-
      Public developer SDK download statistics and third-party benchmark latency comparisons against competitors such as
      Nium or Airwallex.
    whyItMatters: >-
      Direct developer ecosystem traction and API adoption friction cannot be benchmarked independently from marketing
      claims.
    diligencePath: >-
      Review client developer portal telemetry, postman collection usage, and integration completion timelines for newly
      onboarded enterprise accounts.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE002
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Audited breakdown of revenue concentration among top ten enterprise customers and net revenue retention (NRR)
      rates by customer segment.
    whyItMatters: >-
      Without customer concentration disclosures, investors cannot evaluate revenue durability against potential
      contract renegotiation or churn by major partners like Visa or Western Union.
    diligencePath: >-
      Request customer cohort retention tables, top-ten client revenue share, and contract renewal schedules during
