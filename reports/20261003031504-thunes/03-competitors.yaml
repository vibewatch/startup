    body: "Thunes has established a formidable structural moat by assembling 50+ regulatory licenses globally, securing money transmitter licenses across all 50 US states, and linking directly to 7 billion mobile wallets and bank accounts. This eliminates intermediary hops and yields 99% real-time settlement across emerging market corridors where traditional banking rails fail."
