  title: "Competitors"
  summary: "Thunes operates a proprietary Direct Global Network interconnecting over 130 countries, 80 currencies, and 7 billion mobile wallet and bank endpoints via a single API, establishing defensible corridor depth across emerging markets. While consumer remittance peers and legacy correspondent banking networks compete on retail brand and established treasury relations, Thunes differentiates as B2B wholesale infrastructure, though it faces procurement friction around corridor success visibility, compliance ownership splits, and enterprise support responsiveness."
sections:
  - id: "competitive-landscape-overview"
    title: "Cross-Border Infrastructure and Competitive Landscape"
    body: "The cross-border payments landscape comprises traditional correspondent banking networks, legacy money transfer operators, retail-focused remittance apps, and modern B2B payment infrastructure platforms. Thunes positions itself explicitly as a business-to-business infrastructure player, operating a proprietary Direct Global Network that bypasses multi-hop correspondent banking arrangements to link banks, payment service providers, mobile wallets, and digital asset platforms. Traditional cross-border settlements through correspondent banking typically require three to five business days and incur hidden intermediary fees and unpredictable foreign exchange spreads across fragmented clearing systems. In contrast, wholesale interoperability networks consolidate direct integrations into domestic instant clearing rails, mobile money systems such as M-Pesa and GCash, and real-time payment schemes, allowing global enterprises to execute transfers with high predictability.\n\nWhile retail cross-border specialists like TapTap Send focus on consumer-to-consumer mobile remittances in dedicated immigrant corridors with dedicated consumer mobile applications, infrastructure providers like Thunes deliver an API-first connectivity layer for institutional members including banks, gig-economy platforms like Grab and Uber, and global money transfer operators like Western Union. Direct competitors and adjacencies include cross-border rails providers such as Nium, Airwallex, and dLocal, as well as enterprise messaging networks like Swift. Through strategic partnerships, including enabling Swift member institutions to access wallet endpoints, Thunes combines proprietary emerging-market corridor depth with established financial network messaging rather than attempting to displace primary bank relationships entirely."
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP003"
      - "CP004"
    tableRefs:
      - "TP001"
  - id: "capability-differentiation-matrix"
    title: "Capability Differentiation, Architecture, and Technical Moats"
    body: "Evaluating wholesale cross-border payment platforms requires analyzing local rail connectivity, compliance automation, settlement latency, and treasury liquidity orchestration. Thunes' architectural foundation centers on its Direct Global Network, paired with the SmartX Treasury System and the Fortress Compliance Platform. By aggregating more than 550 direct integrations and connecting to over 60 real-time banking systems globally, the platform delivers 99% real-time delivery rates for mobile wallet payouts, sharply compressing settlement cycles compared to legacy multi-day correspondent transfers. Furthermore, integration with Swift expands reach to 11,000 financial institutions, while support for stablecoins like USDC and USDT allows continuous liquidity rebalancing outside standard banking cut-off windows.\n\nHowever, independent technical and procurement assessments indicate meaningful trade-offs. Vendor scorecards highlight that while Thunes achieves high ratings for payout settlement speed and corridor network depth, public transparency regarding corridor-specific transaction approval rates, automated treasury rebalancing tools, and chargeback protection workflows remains constrained. Buyers evaluating cross-border networks must carefully examine corridor-level performance, because headline global reach can obscure localized partner downtime, disparate compliance thresholds, and pre-funding capital requirements across complex emerging markets. Technical moats in this space stem from deep local regulatory licensing and direct endpoint relationships rather than purely proprietary software algorithms."
    claimRefs:
      - "CP005"
      - "CP006"
      - "CP007"
      - "CP008"
    tableRefs:
      - "TP002"
    figureRefs:
      - "FP001"
  - id: "commercial-models-procurement-switching"
    title: "Pricing Models, Switching Costs, and Operational Risks"
    body: "Commercial models across cross-border payments diverge between consumer transaction fees and wholesale infrastructure pricing. While consumer remittance apps often offer fee-free or flat-rate promotions offset by opaque retail foreign exchange markups, wholesale infrastructure providers employ tiered API transaction fees combined with contracted FX spreads and minimum monthly commitments. Thunes emphasizes transparent pricing and foreign exchange optimization across 80 to 90 currencies, but public procurement evaluations note that enterprise buyers face risks from unexpected intermediary partner charges, minimum commitment thresholds that exceed rollout volumes, and penalty structures triggered by corridor mix shifts.\n\nSwitching costs in B2B payment infrastructure are driven by compliance onboarding, technical API integration, and treasury liquidity pre-funding. Once a payment service provider or enterprise embeds a network API, maps webhook reconciliation data models, and funds operational float accounts, replacing the provider incurs material friction. Nevertheless, multi-homing is standard practice among sophisticated global fintechs to mitigate corridor degradation and secure routing redundancy. Furthermore, customer sentiment reviews reveal notable operational friction, particularly when customer support responsiveness and dispute escalation stall during transaction exceptions and regulatory compliance reviews. Executive leadership acknowledges that competing purely on transaction cost degrades service quality, reinforcing Thunes' strategic posture to prioritize network reliability and compliance licensing over commoditized price competition."
    claimRefs:
      - "CP009"
      - "CP010"
      - "CP011"
      - "CP012"
      - "CP013"
    tableRefs:
      - "TP003"
