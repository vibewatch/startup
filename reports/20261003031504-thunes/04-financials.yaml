callouts:
  - calloutType: "insight"
    title: "Asymmetric Pricing Power Embedded in Emerging Market Wallet Access"
    body: "Thunes' primary monetization strength lies in its direct integration with over 145 digital wallet brands and local payment clearing houses in emerging economies. Because correspondent banks cannot cost-effectively route payments directly into domestic mobile wallets such as GCash or M-Pesa, Thunes commands significant pricing power on hard-to-reach payout corridors. This proprietary access enables the company to bundle wholesale foreign exchange spreads alongside per-transaction gateway fees, protecting gross take-rates against commoditization seen in standard G10 fiat currency pairs."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI006"
  - calloutType: "risk"
    title: "Aggressive Contractual Lock-In and Downside Pricing Exposure"
    body: "While Thunes' standard terms protect revenue stability through minimum volume commitments and early termination penalties, they reveal potential commercial vulnerability to enterprise client churn. The contractual clause permitting unilateral fee increases following a 20% volume drop over three months protects unit economics during corridor slowdowns, but risks accelerating multi-homing defection by price-sensitive institutional clients. Investors must evaluate whether reported positive EBITDA reflects durable structural pricing power or aggressive contractual penalties levied on underperforming member corridors."
    claimRefs:
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI011"
