sections:
  - id: "regulatory-and-legal-risk"
    title: "Regulatory and Legal Risk Analysis"
    body: "Thunes operates across more than 140 countries and 90 currencies, requiring an extensive jurisdictional compliance and licensing framework. The company maintains payment institution licenses and authorisations across major financial hubs including the Monetary Authority of Singapore (MAS), the Financial Conduct Authority (FCA) in the United Kingdom under the Payment Services Regulations 2017 (Ref. 720167), and the French Prudential Supervision and Resolution Authority (ACPR), alongside Hong Kong Money Service Operator (MSO) licensing and money transmitter licenses (MTLs) spanning all 50 US states. Under Section 4 of its master commercial Terms and Conditions, Thunes enforces stringent Know Your Customer (KYC), Anti-Money Laundering (AML), and Counter-Terrorist Financing (CTF) onboarding requirements, requiring commercial customers to provide at least 30 days prior written notice before any material change in beneficial ownership (UBO) or regulatory status. Section 7 explicitly reserves Thunes's right to refuse or halt any transaction that could breach applicable laws, sanctions, or network rules, shielding the network from regulatory infractions. However, maintaining multijurisdictional licensing across 50 markets introduces acute ongoing examination risk, escalating regulatory capital requirements, and potential supervisory divergence between Western and emerging market regulators. Diligence must independently audit supervisory audit findings across primary regulatory hubs and verify ongoing reporting adherence."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
    tableRefs:
      - "TR001"
  - id: "operational-reliability-and-security"
    title: "Operational Reliability, Information Security, and Technical Architecture"
    body: "Operational continuity and technical reliability represent critical risk vectors for Thunes given its advertised capability of real-time cross-border settlements reaching 7 billion mobile wallets and bank accounts, 15 billion cards, and over 320 payment methods. The company maintains ISO 27001 information security certification and Payment Card Industry Data Security Standard (PCI DSS) compliance, incorporating the Fortress Compliance Platform and the Tookitaki AML technology stack acquired via a controlling stake in April 2022. Despite robust automated screening and compliance controls, independent operational benchmarks compiled on RFP.wiki indicate that Thunes does not publicly publish an explicit formal uptime Service Level Agreement (SLA), a public incident history status dashboard, or corridor-by-corridor median latency percentiles. Furthermore, Section 18 of Thunes's commercial Terms and Conditions explicitly disclaims all warranties regarding availability and fitness, disclaiming liability for service interruptions, stoppages, or transmission defects, while Section 11 imposes immediate liability on customers for all disputes, fines, and reversals. The absence of publicly documented disaster recovery testing across fragmented local payout rails creates operational opacity, necessitating targeted data-room verification of core transaction engine uptime and historical failover durations."
    claimRefs:
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR009"
    tableRefs:
      - "TR002"
    figureRefs:
      - "FR001"
  - id: "counterparty-and-financial-exposure"
    title: "Partner Dependency, Treasury Liquidity, and Counterparty Risk"
    body: "Thunes's business model hinges upon deep connectivity with strategic clearing partners, commercial banking networks, and mobile wallet operators across high-growth emerging economies. The expansion of strategic alliances, such as the October 2026 Multicurrency Clearing partnership with Absa Group across African markets and the global network connection enabling over 11,000 SWIFT member institutions to execute direct-to-wallet payouts, significantly broadens distribution but increases structural counterparty dependency. In liquidity management, Thunes operates its proprietary SmartX Treasury System across 90 currencies and has integrated stablecoin prefunding capabilities with Circle, supporting EURC, USDC, and USDT rails. Under Section 10 of its standard terms, Thunes provides discretionary post-paid and emergency funded outward payment facilities, which can introduce uncollateralized credit risk if debtor partners default before inward settlements clear. Although Floris de Kort stated in April 2025 that Thunes achieved a $150 million revenue run-rate and positive EBITDA at its Series D round, unreleased audited entity-level financial statements prevent independent verification of cash burn, margin resilience, and working capital buffers against foreign exchange volatility. Investors must prioritize data-room inspection of top partner concentration, treasury hedging protocols, and credit loss provisions."
    claimRefs:
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR014"
    tableRefs:
      - "TR003"
