callouts:
  - calloutType: "risk"
    title: "US Regulatory Execution and State MTL Compliance Burden"
    body: "Securing money transmitter licenses across all 50 US states represents a transformative commercial milestone for Thunes's North American expansion, yet it introduces significant continuous regulatory overhead. Each state maintains distinct capital adequacy, examination, and surety bond requirements, exposing Thunes to heightened scrutiny from state banking departments and FinCEN. Operational failure in a single state could trigger multistate regulatory contagion, necessitating rigorous centralized compliance governance."
    claimRefs:
      - "CR001"
      - "CR004"
  - calloutType: "insight"
    title: "Contractual Allocation of Transaction and Dispute Liabilities"
    body: "Thunes's master Terms and Conditions effectively insulate the platform by transferring operational, dispute, and regulatory liability onto its commercial customers. Under Sections 7, 11, and 18, Thunes disclaims performance warranties, limits aggregate liability to six months of received fees, and makes customer reimbursement of disputes, fines, and reversals immediately payable on demand. While this protects Thunes's corporate balance sheet, it increases procurement resistance among tier-one enterprise banks."
    claimRefs:
      - "CR007"
      - "CR008"
