companyProfile:
  summary: >-
    Thunes is a Singapore-headquartered cross-border payments infrastructure company founded in 2016 as a spin-out of
    TransferTo. Its Direct Global Network connects financial institutions, wallets, cards, and payment partners across
    140 countries through a single API, while its SmartX Treasury and Fortress Compliance platforms support liquidity
    orchestration and embedded screening across a broad licensing footprint. The company has raised $362 million in
    cumulative equity funding, disclosed a $150 million Series D in April 2025, and publicly stated a $150 million
    revenue run-rate with positive EBITDA, but audited financials and exact valuation remain undisclosed.
  foundedDate: '2016-01-01'
  foundingLocation: Singapore
  headquarters: Singapore
  founders:
    - name: Peter De Caluwe
      role: Co-founder and Chief Executive Officer
      background: Former TransferTo executive who led Thunes through its early expansion and returned as CEO in August 2025.
      claimRefs:
        - CO008
  productSummary: >-
    Thunes sells B2B cross-border payments infrastructure built around the Direct Global Network, SmartX Treasury, and
    Fortress Compliance modules for payouts, collections, liquidity management, and real-time transaction screening.
  customerFocus: Banks, payment service providers, money transfer operators, super-apps, and digital marketplaces
  businessModel: >-
    The company monetizes transaction processing, foreign-exchange spread capture, and treasury or liquidity-related
    service charges across its network rails.
  stage: Late-Stage Private (Series D)
  fundingStatus: Thunes closed a $150 million Series D in April 2025 and has disclosed cumulative equity funding of $362 million.
