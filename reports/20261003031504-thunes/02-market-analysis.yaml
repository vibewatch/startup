    title: "Direct Clearing Networks Exploit Persistent Legacy Remittance Margins"
    body: >-
      With global cross-border remittances still averaging a 6.36% transaction friction as of late 2025, modern direct networks like Thunes bypass correspondent banking chains to achieve roughly 85% instant settlement across 140 countries, capturing high-margin wholesale FX spreads while offering lower end-customer costs.
