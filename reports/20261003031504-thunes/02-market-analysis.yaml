chapter:
  number: 2
  title: "Market Analysis"
  summary: "Thunes targets the high-volume B2B cross-border payouts and interoperability infrastructure market, operating an alternative to correspondent banking across 140 countries. While top-down industry estimates size global cross-border payments at up to $150 trillion, Thunes' addressable monetization is strictly bounded by wholesale outbound disbursements, FX spreads, and transaction routing fees across 720 network members."
sections:
  - id: "market-definition-and-boundaries"
    title: "Market Boundary, Addressable Spend, and Product Scope"
    body: >-
      Thunes operates within the specialized B2B cross-border payments infrastructure sector, functioning as an alternative clearing and routing superhighway to traditional SWIFT correspondent banking networks. The core commercial product focuses exclusively on high-volume, programmatic outbound disbursements and money movement across fragmented payment endpoints, connecting enterprise sending members directly to local domestic clearing systems.


      The addressable spend captured by Thunes encompasses transaction routing fees, corridor-level foreign exchange conversion spreads (typically converting at 0.5% above interbank rates on major currency pairs), and liquidity management charges via its SmartX Treasury system. However, the market boundary strictly excludes inbound multi-currency storage accounts, corporate employee card issuing, spend management software, and physical cash or check handling operations. By enforcing strict commercial-use terms that prohibit retail consumer accounts, Thunes positions itself purely as a B2B2X clearing backbone rather than an end-to-end corporate financial operating system.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM008
      - CM010
      - CM015
    tableRefs:
      - TM001
  - id: "market-sizing-and-tam-lenses"
    title: "Market Sizing Lenses: Global Flows, Regional Corridors, and Monetization Realities"
    body: >-
      Market sizing in cross-border payments often suffers from conflating gross payment transaction volumes with monetizable net infrastructure revenue. At the macro layer, industry forecasts cite a $150 trillion total market opportunity for global cross-border money movement. However, the vast majority of this total flow consists of high-value interbank settlements and corporate treasury transfers that yield minimal basis-point monetization.


      Regional corridor data highlights where actual structural friction creates high-margin infrastructure opportunities. In Latin America, regional payment flows are forecast to exceed $300 billion by 2027, driven by rapid mobile-first adoption and real-time payment rails such as Brazil's Pix, which processed 63 billion transactions in 2025. Remittance inflows into Latin America reached over $156 billion in 2023, with the US-to-Mexico corridor representing $66 billion. Furthermore, sending $200 internationally still costs an average of 6.36% globally as of late 2025—more than double the UN Sustainable Development Goal target of 3%—underscoring persistent clearing inefficiencies in emerging market endpoints that preserve pricing power for direct network operators.
    claimRefs:
      - CM004
      - CM005
      - CM006
      - CM007
      - CM013
      - CM014
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: "buyer-segmentation-and-workflows"
    title: "Buyer Segmentation, Budget Ownership, and Integration Pathways"
    body: >-
      Thunes serves three primary institutional buyer categories running programmatic, scale-driven cross-border operations: global gig economy marketplaces, money transfer operators (MTOs) and fintechs, and commercial banks or neobanks. In marketplace organizations like Grab, Deliveroo, and Uber, budget ownership resides with treasury and product operations executives who require automated, real-time daily earnings payouts to contract workers in local mobile wallets.


      For money transfer operators such as Western Union, Remitly, and Ria, the core driver is payout corridor expansion without establishing physical operations or balance sheets in 140 destination markets. Banks and neobanks integrate through two distinct technical pathways: either direct REST API integration using standard JSON payloads, or via Thunes' strategic partnership with SWIFT, which allows over 11,500 financial institutions to route payouts directly into mobile wallets without building bespoke API connections.
    claimRefs:
      - CM001
      - CM002
      - CM009
      - CM011
      - CM012
    tableRefs:
      - TM003
  - id: "growth-drivers-and-adoption-constraints"
    title: "Adoption Drivers, Structural Friction, and Diligence Realities"
    body: >-
      The expansion of Thunes' market is propelled by structural tailwinds: rapid migration from cash to mobile wallets in emerging economies, central bank real-time payment mandates, and enterprise demand for 24/7 cross-border stablecoin liquidity using USDC and USDT payouts. Its multi-jurisdictional licensing stack—spanning MAS in Singapore, the FCA in the UK, ACPR in France, and 50 US state money transmission licenses—creates a high regulatory barrier to entry against unlicensed aggregators.


      Conversely, substantial adoption constraints govern enterprise migration. Integrating custom payout APIs requires significant engineering commitments from client engineering teams. The absence of published pricing schedules, standard rate cards, or public volume tiers requires one-on-one enterprise negotiations, creating procurement friction. Furthermore, enterprise user feedback reveals operational vulnerabilities: compliance screening delays in Tookitaki AML checks and support response lags across Western time zones create customer friction when transactions enter exception handling, illustrating that automated clearing speed is frequently constrained by manual compliance resolution.
    claimRefs:
      - CM003
      - CM008
      - CM009
      - CM010
      - CM015
      - CM016
    callouts:
      - calloutType: "risk"
        title: "Exception Handling Bottlenecks Limit Theoretical Clearing Velocity"
        body: >-
          While Thunes settles approximately 85% of transactions instantly over direct domestic clearing rails, operational reviews highlight that compliance holds and cross-time-zone support delays introduce material latency when edge-case transactions trigger fraud or AML reviews.
        claimRefs:
          - CM003
          - CM010
          - CM015
