  title: "Product & Technology"
  summary: "Thunes provides cross-border B2B payments infrastructure via its Direct Global Network, connecting enterprise members to over 7 billion mobile wallets and bank accounts, alongside 15 billion cards across 140 countries. The proprietary technology platform centers on the SmartX Treasury System for 24/7 liquidity management and FX pricing, the Fortress Compliance Platform for automated screening across 50 regional regulatory licenses, and single-API integration supported by composable banking connectors and partner payment rails."
sections:
  - id: "product-definition-and-modular-capabilities"
    title: "Product Definition and Modular Capabilities"
    body: "Thunes operates as a specialized cross-border payment infrastructure provider that enables financial institutions, digital marketplaces, super-apps, and multinational merchants to move money internationally without relying on legacy correspondent banking chains. At the core of the offering is the Direct Global Network (DGN), which connects network members to over 7 billion mobile wallets and bank accounts as well as 15 billion cards across 140 countries and 90 currencies. Rather than requiring enterprises to maintain bilateral clearing relationships with local banks and mobile network operators in every operating jurisdiction, Thunes abstracts disparate regional rails behind a unified integration layer. Core transactional workflows encompass bidirectional B2B payouts, gig economy wage disbursements to gig worker mobile wallets, peer-to-peer remittance processing, and commercial payment acceptance. Enterprise members initiate transactions using a single REST API or through standardized SWIFT MT/MX messaging connectors. Furthermore, Thunes provides dedicated modules for multi-currency virtual accounts, allowing corporate treasuries to hold balances, issue localized virtual IBANs, and execute domestic scheme collections across SEPA, Faster Payments System (FPS), and ACH schemes without maintaining local legal entities in each destination corridor."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE007"
    tableRefs:
      - "TE001"
  - id: "workflow-architecture-and-technical-operating-model"
    title: "Workflow Architecture and Technical Operating Model"
    body: "The operational mechanism of Thunes departs substantially from traditional multi-hop correspondent banking, where international transfers traverse multiple intermediary clearing institutions over three to five business days with unpredictable deduction fees. In contrast, Thunes implements a direct connectivity topology coupled with an in-house real-time ledger engine. When an originating member submits a payment instruction via the REST API or partner connectors like the Temenos Exchange adapter, the transaction enters an automated processing pipeline. The pipeline first engages the Fortress Compliance Platform to screen remitter and beneficiary records against international sanctions lists, AML frameworks, and regional watchdogs in real-time. Concurrently, the SmartX Treasury System calculates locked foreign exchange conversion rates across 90 supported currencies and allocates pre-positioned intraday liquidity from Thunes' global settlement accounts. Once compliance and liquidity validations pass, the instruction routes directly into destination domestic clearing rails, national real-time payment schemes, or mobile wallet switches such as GCash, M-Pesa, Airtel, and WeChat Pay. Over 85% of transactions reach immediate settlement, with mobile wallet payouts achieving a 99% real-time delivery rate. This high straight-through processing rate reduces manual investigations by up to 60% compared to legacy SWIFT-only correspondent routing."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE005"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
    tableRefs:
      - "TE002"
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "developer-integration-compliance-and-technical-risks"
    title: "Developer Integration, Compliance, and Technical Risks"
    body: "Enterprise integration with Thunes is facilitated through developer tools and embedded banking connectors. For core banking institutions, pre-integrated adapters such as the Temenos Exchange connector allow licensed lenders to activate Thunes cross-border payout capabilities without building bespoke integration logic, reducing institutional rollout cycles from multi-quarter IT overhauls to approximately four months. For e-commerce and point-of-sale merchants, payment management providers like Visa Cybersource expose Thunes as a specialized alternative payment method (APM) provider, requiring merchant identifiers and country-level API credentials to orchestrate localized checkout methods including digital wallets and Buy Now Pay Later options. Internally, Thunes engineers build and maintain these distributed microservices using high-throughput Golang backend services deployed across continuous delivery pipelines, subject to PCI DSS and ISO 27001 security standards. Despite these technical strengths, diligence reveals notable architectural and operational dependencies. Network resilience depends heavily on the uptime of third-party real-time payment schemes and mobile money operators across emerging markets, where local maintenance windows and network partition outages fall outside Thunes' contractual control. Under standard legal terms, Thunes explicitly disclaims liability for transaction settlement delays or defaults caused by network partner failures, reserves unilateral authority to suspend supported payment methods or currencies upon 30 to 90 days notice, and mandates that members maintain pre-funded collateral or undergo enhanced KYC re-approval if corridor risk profiles shift."
    claimRefs:
      - "CE004"
      - "CE007"
      - "CE008"
      - "CE010"
      - "CE011"
      - "CE014"
      - "CE015"
      - "CE016"
