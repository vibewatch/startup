callouts:
  - calloutType: "insight"
    title: "Pre-Integrated Core Banking Connectors Accelerate Institutional Time-to-Market"
    body: "By developing pre-built adapters for enterprise core banking platforms such as Temenos Exchange, Thunes bypasses the customary 12-to-18-month IT overhaul typical of bank legacy modernization. In production deployments, financial institutions have launched live cross-border remittance corridors across 30 countries in as little as four months from initial engagement."
    claimRefs:
      - "CE007"
      - "CE010"
  - calloutType: "risk"
    title: "Contractual Allocation of Downstream Rail Outage Risk"
    body: "While Thunes achieves 99% real-time execution across mobile wallet corridors, its standard commercial terms explicitly disclaim liability for transaction failures or settlement delays caused by downstream network partners. Enterprise customers remain exposed to local clearing house downtime and mobile network operator operational disruptions."
    claimRefs:
      - "CE008"
      - "CE015"
      - "CE016"
