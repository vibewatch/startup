  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Addressable Spend, and Product Scope
        blocks:
          - type: paragraph
            body: >-
              Thunes operates within the specialized B2B cross-border payments infrastructure sector, functioning as an
              alternative clearing and routing superhighway to traditional SWIFT correspondent banking networks. The
              core commercial product focuses exclusively on high-volume, programmatic outbound disbursements and money
              movement across fragmented payment endpoints, connecting enterprise sending members directly to local
              domestic clearing systems.


              The addressable spend captured by Thunes encompasses transaction routing fees, corridor-level foreign
              exchange conversion spreads (typically converting at 0.5% above interbank rates on major currency pairs),
              and liquidity management charges via its SmartX Treasury system. However, the market boundary strictly
              excludes inbound multi-currency storage accounts, corporate employee card issuing, spend management
              software, and physical cash or check handling operations. By enforcing strict commercial-use terms that
              prohibit retail consumer accounts, Thunes positions itself purely as a B2B2X clearing backbone rather than
              an end-to-end corporate financial operating system.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM010
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM009
              - CM011
      - number: '2.2'
        title: 'Market Sizing Lenses: Global Flows, Regional Corridors, and Monetization Realities'
        blocks:
          - type: paragraph
            body: >-
              Market sizing in cross-border payments often suffers from conflating gross payment transaction volumes
              with monetizable net infrastructure revenue. At the macro layer, industry forecasts cite a $150 trillion
              total market opportunity for global cross-border money movement. However, the vast majority of this total
              flow consists of high-value interbank settlements and corporate treasury transfers that yield minimal
              basis-point monetization.


              Regional corridor data highlights where actual structural friction creates high-margin infrastructure
              opportunities. In Latin America, regional payment flows are forecast to exceed $300 billion by 2027,
              driven by rapid mobile-first adoption and real-time payment rails such as Brazil's Pix, which processed 63
              billion transactions in 2025. Remittance inflows into Latin America reached over $156 billion in 2023,
              with the US-to-Mexico corridor representing $66 billion. Furthermore, sending $200 internationally still
              costs an average of 6.36% globally as of late 2025—more than double the UN Sustainable Development Goal
              target of 3%—underscoring persistent clearing inefficiencies in emerging market endpoints that preserve
              pricing power for direct network operators.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM013
      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Integration Pathways
        blocks:
          - type: paragraph
            body: >-
              Thunes serves three primary institutional buyer categories running programmatic, scale-driven cross-border
              operations: global gig economy marketplaces, money transfer operators (MTOs) and fintechs, and commercial
              banks or neobanks. In marketplace organizations like Grab, Deliveroo, and Uber, budget ownership resides
              with treasury and product operations executives who require automated, real-time daily earnings payouts to
              contract workers in local mobile wallets.


              For money transfer operators such as Western Union, Remitly, and Ria, the core driver is payout corridor
              expansion without establishing physical operations or balance sheets in 140 destination markets. Banks and
              neobanks integrate through two distinct technical pathways: either direct REST API integration using
              standard JSON payloads, or via Thunes' strategic partnership with SWIFT, which allows over 11,500
              financial institutions to route payouts directly into mobile wallets without building bespoke API
              connections.
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM011
              - CM012
      - number: '2.4'
        title: Adoption Drivers, Structural Friction, and Diligence Realities
        blocks:
          - type: paragraph
            body: >-
              The expansion of Thunes' market is propelled by structural tailwinds: rapid migration from cash to mobile
              wallets in emerging economies, central bank real-time payment mandates, and enterprise demand for 24/7
              cross-border stablecoin liquidity using USDC and USDT payouts. Its multi-jurisdictional licensing
              stack—spanning MAS in Singapore, the FCA in the UK, ACPR in France, and 50 US state money transmission
              licenses—creates a high regulatory barrier to entry against unlicensed aggregators.


              Conversely, substantial adoption constraints govern enterprise migration. Integrating custom payout APIs
              requires significant engineering commitments from client engineering teams. The absence of published
              pricing schedules, standard rate cards, or public volume tiers requires one-on-one enterprise
              negotiations, creating procurement friction. Furthermore, enterprise user feedback reveals operational
              vulnerabilities: compliance screening delays in Tookitaki AML checks and support response lags across
              Western time zones create customer friction when transactions enter exception handling, illustrating that
              automated clearing speed is frequently constrained by manual compliance resolution.
            claimRefs:
              - CM003
              - CM008
              - CM009
              - CM010
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Direct Clearing Networks Exploit Persistent Legacy Remittance Margins
            body: >-
              With global cross-border remittances still averaging a 6.36% transaction friction as of late 2025, modern
              direct networks like Thunes bypass correspondent banking chains to achieve roughly 85% instant settlement
              across 140 countries, capturing high-margin wholesale FX spreads while offering lower end-customer costs.
            calloutType: insight
            claimRefs:
              - CM003
              - CM007
              - CM008
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Cross-Border Infrastructure and Competitive Landscape
        blocks:
          - type: paragraph
            body: >-
              The cross-border payments landscape comprises traditional correspondent banking networks, legacy money
              transfer operators, retail-focused remittance apps, and modern B2B payment infrastructure platforms.
              Thunes positions itself explicitly as a business-to-business infrastructure player, operating a
              proprietary Direct Global Network that bypasses multi-hop correspondent banking arrangements to link
              banks, payment service providers, mobile wallets, and digital asset platforms. Traditional cross-border
              settlements through correspondent banking typically require three to five business days and incur hidden
              intermediary fees and unpredictable foreign exchange spreads across fragmented clearing systems. In
              contrast, wholesale interoperability networks consolidate direct integrations into domestic instant
              clearing rails, mobile money systems such as M-Pesa and GCash, and real-time payment schemes, allowing
              global enterprises to execute transfers with high predictability.


              While retail cross-border specialists like TapTap Send focus on consumer-to-consumer mobile remittances in
              dedicated immigrant corridors with dedicated consumer mobile applications, infrastructure providers like
              Thunes deliver an API-first connectivity layer for institutional members including banks, gig-economy
              platforms like Grab and Uber, and global money transfer operators like Western Union. Direct competitors
              and adjacencies include cross-border rails providers such as Nium, Airwallex, and dLocal, as well as
              enterprise messaging networks like Swift. Through strategic partnerships, including enabling Swift member
              institutions to access wallet endpoints, Thunes combines proprietary emerging-market corridor depth with
              established financial network messaging rather than attempting to displace primary bank relationships
              entirely.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP009
      - number: '3.2'
        title: Capability Differentiation, Architecture, and Technical Moats
        blocks:
          - type: paragraph
            body: >-
              Evaluating wholesale cross-border payment platforms requires analyzing local rail connectivity, compliance
              automation, settlement latency, and treasury liquidity orchestration. Thunes' architectural foundation
              centers on its Direct Global Network, paired with the SmartX Treasury System and the Fortress Compliance
              Platform. By aggregating more than 550 direct integrations and connecting to over 60 real-time banking
              systems globally, the platform delivers 99% real-time delivery rates for mobile wallet payouts, sharply
              compressing settlement cycles compared to legacy multi-day correspondent transfers. Furthermore,
              integration with Swift expands reach to 11,000 financial institutions, while support for stablecoins like
              USDC and USDT allows continuous liquidity rebalancing outside standard banking cut-off windows.


              However, independent technical and procurement assessments indicate meaningful trade-offs. Vendor
              scorecards highlight that while Thunes achieves high ratings for payout settlement speed and corridor
              network depth, public transparency regarding corridor-specific transaction approval rates, automated
              treasury rebalancing tools, and chargeback protection workflows remains constrained. Buyers evaluating
              cross-border networks must carefully examine corridor-level performance, because headline global reach can
              obscure localized partner downtime, disparate compliance thresholds, and pre-funding capital requirements
              across complex emerging markets. Technical moats in this space stem from deep local regulatory licensing
              and direct endpoint relationships rather than purely proprietary software algorithms.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP007
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
      - number: '3.3'
        title: Pricing Models, Switching Costs, and Operational Risks
        blocks:
          - type: paragraph
            body: >-
              Commercial models across cross-border payments diverge between consumer transaction fees and wholesale
              infrastructure pricing. While consumer remittance apps often offer fee-free or flat-rate promotions offset
              by opaque retail foreign exchange markups, wholesale infrastructure providers employ tiered API
              transaction fees combined with contracted FX spreads and minimum monthly commitments. Thunes emphasizes
              transparent pricing and foreign exchange optimization across 80 to 90 currencies, but public procurement
              evaluations note that enterprise buyers face risks from unexpected intermediary partner charges, minimum
              commitment thresholds that exceed rollout volumes, and penalty structures triggered by corridor mix
              shifts.


              Switching costs in B2B payment infrastructure are driven by compliance onboarding, technical API
              integration, and treasury liquidity pre-funding. Once a payment service provider or enterprise embeds a
              network API, maps webhook reconciliation data models, and funds operational float accounts, replacing the
              provider incurs material friction. Nevertheless, multi-homing is standard practice among sophisticated
              global fintechs to mitigate corridor degradation and secure routing redundancy. Furthermore, customer
              sentiment reviews reveal notable operational friction, particularly when customer support responsiveness
              and dispute escalation stall during transaction exceptions and regulatory compliance reviews. Executive
              leadership acknowledges that competing purely on transaction cost degrades service quality, reinforcing
              Thunes' strategic posture to prioritize network reliability and compliance licensing over commoditized
              price competition.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Proprietary Endpoint Breadth and Regulatory Density
            body: >-
              Thunes has established a formidable structural moat by assembling 50+ regulatory licenses globally,
              securing money transmitter licenses across all 50 US states, and linking directly to 7 billion mobile
              wallets and bank accounts. This eliminates intermediary hops and yields 99% real-time settlement across
              emerging market corridors where traditional banking rails fail.
            calloutType: strength
            claimRefs:
              - CP002
              - CP005
          - type: callout
            title: Customer Support Responsiveness and Exception Handling Opacity
            body: >-
              Independent procurement reviews and Trustpilot sentiment highlight operational friction in dispute
              resolution, transaction exception handling, and compliance review delays. As enterprise payment volume
              scales, customer service operating on the back foot threatens customer retention against competitors with
              dedicated SLA dashboards.
            calloutType: risk
            claimRefs:
              - CP008
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Commercial Monetization Architecture
        blocks:
          - type: paragraph
            body: >-
              Thunes structures its commercial monetization model around transaction processing fees, foreign exchange
              (FX) spreads, and treasury liquidity charges generated across its Direct Global Network (DGN). The core
              monetization engine relies on per-transaction and percentage-based scheme fees levied on inward and
              outward cross-border transfers routing through 140 countries and 90 currencies. Commercial members,
              comprising commercial banks, money transfer operators (MTOs), and digital super-apps, contract through
              specific order documents that establish baseline corridor pricing and required volume commitments. In
              addition to base transfer fees, Thunes monetizes cross-currency volatility through the proprietary Thunes
              Exchange Rate, capturing wholesale currency conversion spreads across diverse fiat currencies and
              alternative wallet endpoints. Standard enterprise terms reveal aggressive contractual pricing safeguards:
              Thunes incorporates minimum monthly transaction volume thresholds and minimum corridor commitments into
              member contracts. If a customer's aggregate transaction volume or corridor commitment declines by twenty
              percent or more over any three-month measurement window, Thunes retains the unilateral legal authority to
              increase applicable fee schedules from the following calendar month. Furthermore, dormant institutional
              accounts that fail to initiate payment transactions over six consecutive months face recurring non-usage
              penalties and administrative dormancy charges, demonstrating strict contractual monetization of allocated
              network capacity.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI004
              - CI005
          - type: figure
            figureRef: FI001
            claimRefs:
