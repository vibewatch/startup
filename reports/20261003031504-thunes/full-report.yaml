      - number: '7.3'
        title: Partner Dependency, Treasury Liquidity, and Counterparty Risk
        blocks:
          - type: paragraph
            body: >-
              Thunes's business model hinges upon deep connectivity with strategic clearing partners, commercial banking
              networks, and mobile wallet operators across high-growth emerging economies. The expansion of strategic
              alliances, such as the October 2026 Multicurrency Clearing partnership with Absa Group across African
              markets and the global network connection enabling over 11,000 SWIFT member institutions to execute
              direct-to-wallet payouts, significantly broadens distribution but increases structural counterparty
              dependency. In liquidity management, Thunes operates its proprietary SmartX Treasury System across 90
              currencies and has integrated stablecoin prefunding capabilities with Circle, supporting EURC, USDC, and
              USDT rails. Under Section 10 of its standard terms, Thunes provides discretionary post-paid and emergency
              funded outward payment facilities, which can introduce uncollateralized credit risk if debtor partners
              default before inward settlements clear. Although Floris de Kort stated in April 2025 that Thunes achieved
              a $150 million revenue run-rate and positive EBITDA at its Series D round, unreleased audited entity-level
              financial statements prevent independent verification of cash burn, margin resilience, and working capital
              buffers against foreign exchange volatility. Investors must prioritize data-room inspection of top partner
              concentration, treasury hedging protocols, and credit loss provisions.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: US Regulatory Execution and State MTL Compliance Burden
            body: >-
              Securing money transmitter licenses across all 50 US states represents a transformative commercial
              milestone for Thunes's North American expansion, yet it introduces significant continuous regulatory
              overhead. Each state maintains distinct capital adequacy, examination, and surety bond requirements,
              exposing Thunes to heightened scrutiny from state banking departments and FinCEN. Operational failure in a
              single state could trigger multistate regulatory contagion, necessitating rigorous centralized compliance
              governance.
            calloutType: risk
            claimRefs:
              - CR001
              - CR004
          - type: callout
            title: Contractual Allocation of Transaction and Dispute Liabilities
            body: >-
              Thunes's master Terms and Conditions effectively insulate the platform by transferring operational,
              dispute, and regulatory liability onto its commercial customers. Under Sections 7, 11, and 18, Thunes
              disclaims performance warranties, limits aggregate liability to six months of received fees, and makes
              customer reimbursement of disputes, fines, and reversals immediately payable on demand. While this
              protects Thunes's corporate balance sheet, it increases procurement resistance among tier-one enterprise
              banks.
            calloutType: insight
            claimRefs:
              - CR007
              - CR008
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Counter-Thesis, and Fundamental Drivers
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for Thunes centers on its established Direct Global Network (DGN), which
              operates as an institutional alternative to traditional correspondent banking rails across 140 countries
              and 90 currencies. By integrating directly into local real-time payment networks, mobile wallets, and
              domestic clearing systems, Thunes bypasses multi-tier intermediary correspondent fees, delivering 85%
              immediate settlement and connecting over 720 network members to 12 billion composite endpoints. The
              company's achievement of a reported $150 million annualized revenue run-rate alongside positive EBITDA at
              its April 2025 Series D validates operational leverage in a sector where high fixed compliance costs
              traditionally depress early margins. Furthermore, obtaining money transmitter licenses across all 50 US
              states and introducing direct domestic clearing (ACH, Same-Day ACH, and real-time rails) positions Thunes
              to unlock high-margin inbound corporate flows into the United States.


              Conversely, the anti-thesis highlights critical structural and informational vulnerabilities. Thunes
              operates without public financial disclosures: its reported $150 million revenue run-rate and positive
              operating profit remain unaudited, leaving net take-rates, gross margin compression, and customer
              concentration opaque. While Tier-1 enterprises such as Uber, Deliveroo, Grab, and WeChat rely on the
              network, the loss or renegotiation of volume from a key money transfer operator or super-app could
              severely impair gross margin and EBITDA. Additionally, its terms of service establish aggressive
              risk-mitigation measures—including unilateral transaction deferrals, emergency funding fees on pre-funded
              payments, and required indemnity escrows—reflecting persistent working-capital and fraud exposures across
              emerging-market corridors. Without audited visibility into the Series D post-money valuation or preference
              overhang, entering at an imputed multi-billion-dollar valuation presents meaningful down-round and
              dilution risk.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV014
      - number: '8.2'
        title: Valuation Context, Dilution Overhang, and Investment Recommendation
        blocks:
          - type: paragraph
            body: >-
              Thunes has raised a cumulative total of between $292 million and $362 million across five equity rounds,
              culminating in a $150 million Series D in April 2025 co-led by Apis Partners and Vitruvian Partners. Prior
              to this round, the company achieved a $900 million post-money valuation in its July 2023 Series C ($72
              million raised led by Marshall Wace). Although the Series D announcement confirmed a 'substantial
              valuation increase' over the Series C mark, neither the company nor its lead investors disclosed the exact
              post-money equity valuation, creating an information gap that precludes definitive multiples calculation.
              Market estimates suggest an enterprise value ranging from $1.2 billion to $1.5 billion, implying an entry
              multiple of 8.0x to 10.0x on its stated $150 million revenue run-rate.


              Synthesizing fundamental network scale against disclosure deficits yields a formal recommendation of
              'track' with medium confidence, a medium risk rating, and an 'unknown' valuation stance. While Thunes'
              regulatory foundation across 50 US states, MAS, and the FCA provides an immense competitive moat,
              institutional capital must not commit growth equity or secondary liquidity without data-room verification
              of audited financials, senior liquidation preferences, and corridor take-rate stability. The decision
              implication for investment committees is to establish direct dialogue with management to inspect the
              Series D shareholder agreement and audited 2025–2026 financial statements before pricing an allocation.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV008
              - CV011
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV010
              - CV012
              - CV013
      - number: '8.3'
        title: Scenario Analysis, Peer Multiples, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Evaluating Thunes against public and private peers provides guardrails for fair value. In public markets,
              cross-border payment infrastructure providers trade across wide valuation dispersions: specialized
              education and healthcare cross-border platform Flywire trades at approximately 2.6x trailing revenue,
              while high-growth enterprise processors and payment platforms trade between 4.0x and 8.0x EV/Revenue
              depending on gross margin profile and recurring software attributes. Private market comparables such as
              Paysend ($700 million valuation on $100 million revenue, 7.0x EV/Revenue) demonstrate that established
              international remittance and B2B payout networks command 6.0x to 8.0x multiples when demonstrating
              profitable scaling.


              Our scenario framework assesses three distinct trajectories through 2028. In the Bull Case (25%
              probability), Thunes scales its US domestic clearing and EURC/USDC stablecoin infrastructure, expanding
              revenue to $250 million with 25% EBITDA margins, supporting a 14.0x multiple and a $2,100 million
              valuation ($3,500 million enterprise value at exit). In the Base Case (55% probability), steady corridor
              expansion and 20% annual growth lift revenue to $190 million with stable positive EBITDA, supporting a
              9.0x multiple and a $1,350 million equity valuation. In the Bear Case (20% probability), emerging-market
              FX volatility, regulatory enforcement, or client concentration shocks compress revenue to $120 million,
              driving multiples down to 4.0x ($600 million valuation) and triggering down-round dilution. Pre-investment
              diligence must prioritize confirming Series D liquidation preference seniority, verifying audited corridor
              take-rates, and monitoring customer concentration.
            claimRefs:
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV010
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Maintain Track Stance Pending Full Data Room Access
            body: >-
              Despite Thunes' compelling market position as a premier cross-border payments infrastructure provider with
              50 US money transmitter licenses and positive operating profit, the absence of public disclosure on its
              Series D valuation and audited financial statements creates excessive pricing risk. Investment committees
              should track the company and require data-room confirmation of revenue breakdown, take-rate durability,
              and preference structure before deploying capital.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV010
              - CV012
              - CV013
          - type: callout
            title: Down-Round and Liquidation Preference Exposure
            body: >-
              Raising $150 million in late-stage growth capital from private equity sponsors Apis Partners and Vitruvian
              Partners without disclosing the post-money valuation raises potential preference overhang concerns. If
              previous marks exceeded sustainable multiples, secondary buyers or future round participants risk dilution
              or subordinated returns in a conservative exit scenario.
            calloutType: risk
            claimRefs:
              - CV008
              - CV010
              - CV016
