      - number: '5.3'
        title: Developer Integration, Compliance, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              Enterprise integration with Thunes is facilitated through developer tools and embedded banking connectors.
              For core banking institutions, pre-integrated adapters such as the Temenos Exchange connector allow
              licensed lenders to activate Thunes cross-border payout capabilities without building bespoke integration
              logic, reducing institutional rollout cycles from multi-quarter IT overhauls to approximately four months.
              For e-commerce and point-of-sale merchants, payment management providers like Visa Cybersource expose
              Thunes as a specialized alternative payment method (APM) provider, requiring merchant identifiers and
              country-level API credentials to orchestrate localized checkout methods including digital wallets and Buy
              Now Pay Later options. Internally, Thunes engineers build and maintain these distributed microservices
              using high-throughput Golang backend services deployed across continuous delivery pipelines, subject to
              PCI DSS and ISO 27001 security standards. Despite these technical strengths, diligence reveals notable
              architectural and operational dependencies. Network resilience depends heavily on the uptime of
              third-party real-time payment schemes and mobile money operators across emerging markets, where local
              maintenance windows and network partition outages fall outside Thunes' contractual control. Under standard
              legal terms, Thunes explicitly disclaims liability for transaction settlement delays or defaults caused by
              network partner failures, reserves unilateral authority to suspend supported payment methods or currencies
              upon 30 to 90 days notice, and mandates that members maintain pre-funded collateral or undergo enhanced
              KYC re-approval if corridor risk profiles shift.
            claimRefs:
              - CE004
              - CE007
              - CE008
              - CE010
              - CE011
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Pre-Integrated Core Banking Connectors Accelerate Institutional Time-to-Market
            body: >-
              By developing pre-built adapters for enterprise core banking platforms such as Temenos Exchange, Thunes
              bypasses the customary 12-to-18-month IT overhaul typical of bank legacy modernization. In production
              deployments, financial institutions have launched live cross-border remittance corridors across 30
              countries in as little as four months from initial engagement.
            calloutType: insight
            claimRefs:
              - CE007
              - CE010
          - type: callout
            title: Contractual Allocation of Downstream Rail Outage Risk
            body: >-
              While Thunes achieves 99% real-time execution across mobile wallet corridors, its standard commercial
              terms explicitly disclaim liability for transaction failures or settlement delays caused by downstream
              network partners. Enterprise customers remain exposed to local clearing house downtime and mobile network
              operator operational disruptions.
            calloutType: risk
            claimRefs:
              - CE008
