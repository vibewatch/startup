chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Direct Global Network Infrastructure
        blocks:
          - type: paragraph
            body: >-
              Thunes, formally established in 2016 following the structural reorganization of TransferTo into separate
              B2B and consumer operating entities, provides cross-border payment infrastructure connecting diverse
              alternative payment methods and traditional banking rails. Operating from its headquarters in Singapore
              with regional operating hubs across 14 worldwide offices, Thunes designed its proprietary Direct Global
              Network to bypass legacy correspondent banking bottlenecks. The platform links more than 720 network
              members to over 4 billion mobile and stablecoin wallets, 8 billion bank accounts, and 15 billion cards
              across 140 countries in 90 fiat currencies. Rather than relying on multi-day settlement chains that
              introduce unpredictable intermediary fees, Thunes executes 85% of transactions via immediate settlement,
              with mobile wallet transfers achieving a 99% real-time delivery rate across major international corridors.
              Network members integrate through a unified API or connect through a strategic partnership with Swift that
              allows over 11,500 participating financial institutions to route payouts directly into recipient wallets
              and accounts without bespoke technical integrations.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
              - CO014
              - CO015
      - number: '1.2'
        title: Executive Leadership, Governance, and Operational Scaling
        blocks:
          - type: paragraph
            body: >-
              Thunes' executive leadership combines emerging-market payments specialization with institutional
              cross-border scaling experience, though the company has navigated material executive transitions during
              its rapid growth. Co-founder Peter De Caluwe served as Chief Executive Officer from the company's early
              expansion through early 2024, stepped back to the role of Deputy Chairman, and subsequently returned as
              Chief Executive Officer in August 2025. Between these tenures, payments veteran Floris de Kort led the
              organization as CEO through the execution of the $150 million Series D funding round announced in April
              2025. Governance and operational execution were further reinforced with the appointment of Chloé Mayenobe
              as Deputy CEO in December 2025, who directs strategic expansion, algorithmic treasury management, and
              network optimization. Across middle management and engineering, leadership has emphasized service quality
              and risk controls over pure price competition, acknowledging internal resource competition between
              revenue-generating product initiatives and customer experience infrastructure amid rapid transaction
              growth.
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO002
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
      - number: '1.3'
        title: Funding History, Enterprise Alliances, and Market Expansion
        blocks:
          - type: paragraph
            body: >-
              The capitalization of Thunes reflects staged institutional backing from tier-one emerging markets private
              equity and global fintech growth investors. The company closed a $10 million Series A led by GGV Capital
              in May 2019, followed by a $60 million Series B in September 2020 led by Helios Investment Partners with
              participation from Checkout.com and Future Shape. Following a growth capital injection from Insight
              Partners, Thunes secured a $150 million Series D in April 2025 co-led by Apis Partners and Vitruvian
              Partners, lifting cumulative funding past $280 million. The company announced it had achieved positive
              EBITDA and reached an annualized revenue run-rate of $150 million alongside the round, deploying proceeds
              toward expanding its Treasury SmartX and Fortress Compliance engines, integrating stablecoin payouts
              (USDC/USDT), and operationalizing money transmitter licensing across all 50 U.S. states. Commercial
              adoption is anchored by enterprise partnerships with Tier-1 banks including Absa Group, global payments
              networks such as Visa, and high-volume platforms including Uber, Deliveroo, and Grab.
