      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Network Effects Driven by Asymmetric Mobile Wallet Connectivity
            body: >-
              Thunes' primary customer acquisition moat stems from its deep connectivity into alternative payment
              methods across emerging economies. By aggregating over 145 mobile wallet brands and 12 billion digital
              accounts through a single API, Thunes solves the last-mile payout problem that legacy correspondent banks
              cannot address economically. Global giants like Visa, Swift, and Grab partner with Thunes specifically to
              access closed-loop local wallet ecosystems such as M-Pesa, GCash, and Alipay without negotiating bilateral
              integrations in dozens of separate jurisdictions.
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU005
          - type: callout
            title: Contractual Friction, Inactivity Penalties, and Churn Governance
            body: >-
              Under Thunes' standard terms and conditions, customer accounts that remain inactive for six months face
              recurring dormancy fees or service suspension, and contracts may be terminated after twelve months of
              inactivity. Furthermore, Thunes maintains broad discretion to withhold outward settlements, demand cash
              collateral, or modify fee structures if a customer's dispute rate rises or credit profile deteriorates.
              These aggressive contractual protections safeguard network integrity but expose enterprise customers to
              sudden operational suspension if transaction volumes fluctuate or regulatory scrutiny increases.
            calloutType: risk
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk Analysis
        blocks:
          - type: paragraph
            body: >-
              Thunes operates across more than 140 countries and 90 currencies, requiring an extensive jurisdictional
              compliance and licensing framework. The company maintains payment institution licenses and authorisations
              across major financial hubs including the Monetary Authority of Singapore (MAS), the Financial Conduct
              Authority (FCA) in the United Kingdom under the Payment Services Regulations 2017 (Ref. 720167), and the
              French Prudential Supervision and Resolution Authority (ACPR), alongside Hong Kong Money Service Operator
              (MSO) licensing and money transmitter licenses (MTLs) spanning all 50 US states. Under Section 4 of its
              master commercial Terms and Conditions, Thunes enforces stringent Know Your Customer (KYC), Anti-Money
              Laundering (AML), and Counter-Terrorist Financing (CTF) onboarding requirements, requiring commercial
              customers to provide at least 30 days prior written notice before any material change in beneficial
              ownership (UBO) or regulatory status. Section 7 explicitly reserves Thunes's right to refuse or halt any
              transaction that could breach applicable laws, sanctions, or network rules, shielding the network from
              regulatory infractions. However, maintaining multijurisdictional licensing across 50 markets introduces
              acute ongoing examination risk, escalating regulatory capital requirements, and potential supervisory
              divergence between Western and emerging market regulators. Diligence must independently audit supervisory
              audit findings across primary regulatory hubs and verify ongoing reporting adherence.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
      - number: '7.2'
        title: Operational Reliability, Information Security, and Technical Architecture
        blocks:
          - type: paragraph
            body: >-
              Operational continuity and technical reliability represent critical risk vectors for Thunes given its
              advertised capability of real-time cross-border settlements reaching 7 billion mobile wallets and bank
              accounts, 15 billion cards, and over 320 payment methods. The company maintains ISO 27001 information
              security certification and Payment Card Industry Data Security Standard (PCI DSS) compliance,
              incorporating the Fortress Compliance Platform and the Tookitaki AML technology stack acquired via a
              controlling stake in April 2022. Despite robust automated screening and compliance controls, independent
              operational benchmarks compiled on RFP.wiki indicate that Thunes does not publicly publish an explicit
              formal uptime Service Level Agreement (SLA), a public incident history status dashboard, or
              corridor-by-corridor median latency percentiles. Furthermore, Section 18 of Thunes's commercial Terms and
              Conditions explicitly disclaims all warranties regarding availability and fitness, disclaiming liability
              for service interruptions, stoppages, or transmission defects, while Section 11 imposes immediate
              liability on customers for all disputes, fines, and reversals. The absence of publicly documented disaster
              recovery testing across fragmented local payout rails creates operational opacity, necessitating targeted
              data-room verification of core transaction engine uptime and historical failover durations.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
