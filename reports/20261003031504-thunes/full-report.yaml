            body: >-
              Thunes differentiates its distribution from traditional correspondent banking and closed-loop remittance
              models by operating a dual-channel access model. Financial institutions can integrate directly via Thunes'
              unified API or leverage existing Swift connectivity to access over 12 billion composite endpoints across
              mobile wallets, bank accounts, and stablecoin addresses without bespoke development.
