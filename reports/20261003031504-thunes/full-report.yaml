      - number: '5.2'
        title: Workflow Architecture and Technical Operating Model
        blocks:
          - type: paragraph
            body: >-
              The operational mechanism of Thunes departs substantially from traditional multi-hop correspondent
              banking, where international transfers traverse multiple intermediary clearing institutions over three to
              five business days with unpredictable deduction fees. In contrast, Thunes implements a direct connectivity
              topology coupled with an in-house real-time ledger engine. When an originating member submits a payment
              instruction via the REST API or partner connectors like the Temenos Exchange adapter, the transaction
              enters an automated processing pipeline. The pipeline first engages the Fortress Compliance Platform to
              screen remitter and beneficiary records against international sanctions lists, AML frameworks, and
              regional watchdogs in real-time. Concurrently, the SmartX Treasury System calculates locked foreign
              exchange conversion rates across 90 supported currencies and allocates pre-positioned intraday liquidity
              from Thunes' global settlement accounts. Once compliance and liquidity validations pass, the instruction
              routes directly into destination domestic clearing rails, national real-time payment schemes, or mobile
              wallet switches such as GCash, M-Pesa, Airtel, and WeChat Pay. Over 85% of transactions reach immediate
              settlement, with mobile wallet payouts achieving a 99% real-time delivery rate. This high straight-through
              processing rate reduces manual investigations by up to 60% compared to legacy SWIFT-only correspondent
              routing.
            claimRefs:
              - CE001
