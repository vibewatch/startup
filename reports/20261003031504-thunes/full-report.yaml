              - CI011
      - number: '4.2'
        title: Cost Structure, Direct Delivery Expenses, and Operating Economics
        blocks:
          - type: paragraph
            body: >-
              The direct cost profile of Thunes is primarily dictated by downstream payment clearing charges, local
              payout provider partner fees, foreign exchange hedging costs, and regulatory capital maintenance. Because
              the network connects over 4 billion mobile and stablecoin wallets, 8 billion bank accounts, and 15 billion
              cards, each payout instruction routed into a domestic endpoint incurs local scheme interchange, clearing
              intermediary fees, or mobile network operator (MNO) payout tariffs. In emerging markets where digital
              wallets dominate, local clearing tariffs create variable costs of service delivery that scale directly
              with transaction throughput. Beyond variable settlement fees, compliance-by-design requirements impose
              substantial structural operating expenses. Thunes operates its proprietary Fortress Compliance Platform to
              embed automated real-time anti-money laundering (AML), sanctions screening, and transaction monitoring
              directly into payment routing pipelines. While this embedded architecture mitigates catastrophic
              regulatory enforcement penalties, it demands continuous ongoing engineering investments and jurisdictional
              compliance overhead across more than 50 owned-and-operated licenses, including money transmitter licenses
              across all 50 US states. Working capital demands and pre-funding liquidity requirements also form a
              critical component of operating economics: members must maintain adequate balances or submit to strict
              collateralization terms under Thunes' legal agreements to avoid payment deferral or account suspension.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI003
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI014
      - number: '4.3'
        title: Capital Adequacy, Financing Trajectory, and Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              From a capitalization perspective, Thunes maintains an exceptionally well-funded balance sheet following
              the completion of its $150 million Series D financing round led by Apis Partners and Vitruvian Partners.
              Lifetime cumulative equity funding has reached $362 million across five institutional funding rounds since
              the company's 2016 corporate reorganization from TransferTo. Company disclosures announced that Thunes
              achieved operating profitability and positive EBITDA concurrently with the Series D close, positioning it
              among a select cohort of scaled fintech infrastructure providers operating without immediate dilutive
              cash-burn dependency. Proceeds from the Series D are actively deployed into capital-intensive geographical
              expansion, highlighted by the strategic establishment of a new New York City hub in Union Square to
              complement established operations in San Francisco and Atlanta. However, from an underwriting diligence
              perspective, critical financial inputs remain completely inaccessible. Crucial metrics such as net revenue
              retention (NRR), gross revenue take-rate across exotic versus liquid currency corridors, audited EBITDA
              margins, and client concentration among anchor partners like Visa and Grab remain strictly undisclosed
              private data. Until an independent audit verifies the durability of stated EBITDA margins against
              regulatory compliance overhead and counterparty credit risks, institutional underwriters must classify
              financial quality as promising but unconfirmed.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Asymmetric Pricing Power Embedded in Emerging Market Wallet Access
            body: >-
              Thunes' primary monetization strength lies in its direct integration with over 145 digital wallet brands
              and local payment clearing houses in emerging economies. Because correspondent banks cannot
              cost-effectively route payments directly into domestic mobile wallets such as GCash or M-Pesa, Thunes
              commands significant pricing power on hard-to-reach payout corridors. This proprietary access enables the
              company to bundle wholesale foreign exchange spreads alongside per-transaction gateway fees, protecting
              gross take-rates against commoditization seen in standard G10 fiat currency pairs.
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI006
          - type: callout
            title: Aggressive Contractual Lock-In and Downside Pricing Exposure
            body: >-
              While Thunes' standard terms protect revenue stability through minimum volume commitments and early
              termination penalties, they reveal potential commercial vulnerability to enterprise client churn. The
              contractual clause permitting unilateral fee increases following a 20% volume drop over three months
              protects unit economics during corridor slowdowns, but risks accelerating multi-homing defection by
              price-sensitive institutional clients. Investors must evaluate whether reported positive EBITDA reflects
              durable structural pricing power or aggressive contractual penalties levied on underperforming member
              corridors.
            calloutType: risk
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI011
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Modular Capabilities
        blocks:
          - type: paragraph
            body: >-
              Thunes operates as a specialized cross-border payment infrastructure provider that enables financial
              institutions, digital marketplaces, super-apps, and multinational merchants to move money internationally
              without relying on legacy correspondent banking chains. At the core of the offering is the Direct Global
              Network (DGN), which connects network members to over 7 billion mobile wallets and bank accounts as well
              as 15 billion cards across 140 countries and 90 currencies. Rather than requiring enterprises to maintain
              bilateral clearing relationships with local banks and mobile network operators in every operating
              jurisdiction, Thunes abstracts disparate regional rails behind a unified integration layer. Core
              transactional workflows encompass bidirectional B2B payouts, gig economy wage disbursements to gig worker
              mobile wallets, peer-to-peer remittance processing, and commercial payment acceptance. Enterprise members
              initiate transactions using a single REST API or through standardized SWIFT MT/MX messaging connectors.
              Furthermore, Thunes provides dedicated modules for multi-currency virtual accounts, allowing corporate
              treasuries to hold balances, issue localized virtual IBANs, and execute domestic scheme collections across
              SEPA, Faster Payments System (FPS), and ACH schemes without maintaining local legal entities in each
              destination corridor.
