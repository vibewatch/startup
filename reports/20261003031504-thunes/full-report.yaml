      - number: '6.2'
        title: Adoption Trajectory, Volume Scale, and Endpoint Reach
        blocks:
          - type: paragraph
            body: >-
              The operational footprint and volume trajectory of Thunes have expanded significantly through multi-year
              strategic integrations with global financial networks. Since its inception following the corporate
              spin-out from TransferTo, Thunes has accumulated over $65 billion in cumulative processed volume,
              supporting real-time cross-border money movement across emerging corridors in Africa, Southeast Asia, and
              Latin America. Network scale reaches 140 countries and 90 fiat currencies, spanning 4 billion mobile and
              stablecoin wallets, 8 billion bank accounts, and 15 billion cards accessible via more than 220 payment
              methods. In parallel, the deployment of stablecoin infrastructure in partnership with Circle has
              accelerated corporate treasury liquidity: DGN member funding volumes using USDC expanded by approximately
              one-third month-over-month following launch, with both onboarded network members and partners directly
              accepting USDC reaching double digits within nine months. Furthermore, bilateral channel alliances, such
              as Visa Direct's integration covering 108 send-to-wallet markets and Swift's connectivity enabling 11,500
              institutions to initiate direct payouts without bespoke integration, have broadened structural transaction
              demand across global payment endpoints.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
      - number: '6.3'
        title: Production Deployments, Enterprise Outcomes, and Retention Governance
        blocks:
          - type: paragraph
            body: >-
              Production case studies confirm tangible operational benefits for high-volume enterprise deployments,
              alongside critical governance caveats. In gig-economy payouts, GrabPay deployed Thunes to eliminate
              multi-day correspondent banking settlement cycles, enabling gig workers to receive daily earnings credited
              immediately to local mobile wallets like GCash. In wholesale liquidity and treasury settlement,
              cross-border corporate payout pre-funding timelines in Ghana contracted from T+2 to same-day, in the
              Philippines from T+1 to T+0, and in South Africa from half a day to minutes via USDC settlement. However,
              enterprise customer durability and account retention face rigorous contractual boundaries under Thunes'
              standard terms and conditions. The operating agreement establishes strict unilateral remedies: Thunes
              reserves the right to charge non-usage fees or deactivate accounts after six months of dormancy, terminate
              contracts after twelve months of inactivity, and immediately suspend services or demand cash collateral
              upon adverse risk assessments, compliance disputes, or credit rating downgrades. These operational
              frictions underscore that while commercial adoption among market leaders remains robust, net revenue
              retention and volume consistency remain closely tethered to stringent counterparty compliance and active
              transaction velocity.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
