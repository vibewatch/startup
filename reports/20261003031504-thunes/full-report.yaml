  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Institutional Member Profile
        blocks:
          - type: paragraph
            body: >-
              Thunes groups its institutional customer base into distinct participant classes under its Direct Global
              Network (DGN) umbrella, collectively encompassing more than 720 Network Members. The primary institutional
              segments comprise traditional commercial banks and neobanks, payment service providers (PSPs), digital
              wallet operators, money transfer operators (MTOs), and digital asset enterprises. In traditional banking
              and money transfer, institutions such as Western Union and major regional banks leverage Thunes to bypass
              fragmented correspondent banking rails, routing cross-border remittances directly into recipient bank
              accounts and local mobile wallets. Meanwhile, gig-economy platforms and super-apps such as Grab and Uber
              utilize the network to power immediate intraday payouts for drivers and delivery merchants in emerging
              markets. Enterprise adoption across these segments is driven by access to over 12 billion endpoints across
              140 countries, enabling institutional members to achieve immediate multi-currency payout connectivity via
              a single API or existing Swift messaging interfaces.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
