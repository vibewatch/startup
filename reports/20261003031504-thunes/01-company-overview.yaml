callouts:
  - calloutType: "insight"
    title: "Dual-Engine Interoperability Architecture"
    body: "Thunes differentiates its distribution from traditional correspondent banking and closed-loop remittance models by operating a dual-channel access model. Financial institutions can integrate directly via Thunes' unified API or leverage existing Swift connectivity to access over 12 billion composite endpoints across mobile wallets, bank accounts, and stablecoin addresses without bespoke development."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
  - calloutType: "risk"
    title: "Operational Tension Between Growth Velocity and Service Quality"
    body: "As cross-border payment volumes scale rapidly across diverse emerging markets, internal leadership has noted persistent organizational friction where revenue-generating product launches compete for engineering prioritization against customer experience and operational support infrastructure, creating potential service escalation risks during peak volumes."
    claimRefs:
      - "CO011"
      - "CO012"
