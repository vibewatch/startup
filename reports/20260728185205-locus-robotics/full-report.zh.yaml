      - number: '7.4'
        title: 披露、估值与总体结论
        blocks:
          - type: paragraph
            body: >-
              最后一个风险类别贯穿其他所有风险：证据不完整。Locus
              不是典型的监管危机故事，公开资料也没有显示严重的公开法律失败或客户基础崩塌。更棘手的是，关键承销变量仍未披露，而市场正越来越多地用公开倍数和公开披露来横向比较自动化公司。Symbotic
              的季度数据、上市公司现金数字和披露节奏，让 Locus
              作为私营公司的不透明更显眼。即便是同行公开市值的跟踪，也会影响投资人判断一家私营公司值多少钱、应打多少风险折扣。因此，合适的下行情景不是戏剧性丑闻，而是商业化放慢、预算走弱、单位经济性低于假设，或集中度高于里程碑标题暗示。平衡后的结论是：风险高，但可管理。Locus
              有实打实的缓释因素——客户验证、适配存量场地，以及瞄准更高价值工作流的路线图——但投资人仍需要收入质量、集中度和 Array 商业化的一手证据，才能把公司视作风险已充分拆解。
