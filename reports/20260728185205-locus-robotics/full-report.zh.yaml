      - number: '7.2'
        title: 产品、集成与执行风险
        blocks:
          - type: paragraph
            body: >-
              2026 年最重要的运营风险，在于更新的自主化故事能否执行。Locus Array 和 Nexera 收购在战略上顺理成章，但它们把公司从协作式辅助推向更深的自主履约和操作，也抬高了技术门槛。公开来源尚未披露
              Array 正常运行时间、干预率、抓取成功率或生产规模经济性，意味着投资人是在有限公开现场指标下承销一条路线图。存量仓库集成也有两面性。它是 Locus 价值主张的一部分，也制造实施风险，因为每个仓库都有自己的
              WMS、布局限制和工作流特性。信任中心和专利页面在某种意义上有帮助：它们显示 Locus 正认真对待企业就绪度和
              IP。但它们也提醒投资人，技术和合规要求只会变难，不会变简单。更有野心的产品栈可以赢下更大预算；如果商业化滞后，或移动操作比营销材料暗示的更难规模化，它也会更显眼地失败。
