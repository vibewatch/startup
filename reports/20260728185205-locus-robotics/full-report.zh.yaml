      - number: '3.3'
        title: 打包、集成与转换成本
        blocks:
          - type: paragraph
            body: >-
              单靠能力并不能决定仓库自动化结果。打包、集成和渠道结构决定买方能否批准项目。Locus 的 RaaS
              定位居于核心，因为它把自动化决策转成运营预算和爬坡灵活性的讨论，而不是单笔大型资本开支承诺。这仍是真实的商业优势，但并非没有对手。OMRS
              也提出相同的存量仓库集成论证，几乎每个严肃竞争者现在都强调软件编排，以及与既有 WMS 或 ERP
              系统共存。因此，公开价格透明度的战略价值有限：官方网站很少披露标准化的实际成交价、折扣或车队级合同条款。买方真正比较的是部署适配度、时间表、人工节省、系统互操作性和长期锁定。锁定本身因架构不同而变化。AutoStore
              式网格和高密度货架系统往往制造更深的物理转换成本。叠加式 AMR 车队更容易分阶段部署、扩容或部分替换。编排主导系统甚至可能鼓励混合车队。Locus
              位于中间地带。一旦规模化部署，它会带来有意义的工作流和软件摩擦，但不会像专有固定网格那样把客户绝对锁住。
