      - number: '5.3'
        title: Nexera、Array 与商业化路径
        blocks:
          - type: paragraph
            body: >-
              2026 年最重要的产品事件是 Array 发布和 Nexera 收购，两者之间的时间关系有分析意义。Array 宣告 Locus 想从协作式拣货，走向由物理 AI 驱动的自主履约。随后 Nexera
              补上操作层，让这个雄心更可信。收购叙事很清楚：只有移动导航不够，跨多样 SKU 的可靠抓取才是关键瓶颈。Locus 把 NeuraGrasp 描述为专利突破，并在发布后不久交付首批 Array
              单元，说明公司希望外界把故事理解为商业化，而不是概念图。DHL
              作为早期访问客户增加了可信度，因为路线图有了已知企业锚点。风险也正集中在这里。近期发布和收购在文字里往往很有吸引力，但还没证明规模化现场可靠性。产品论点因此不太取决于 Locus 是否有路线图，而更取决于
              Array 转化、SKU 覆盖和可维护性在生产环境中能否顶住。
