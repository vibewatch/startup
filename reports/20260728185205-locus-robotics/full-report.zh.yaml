    title: 执行风险流程图
    type: flow
    layout: compact
    summary: 最新产品路线图要创造价值，集成、可靠性和商业化必须同时跑通。
    data:
      nodes:
        - id: launch
          label: Array 发布
        - id: grasp
          label: Nexera 操作能力
        - id: deploy
          label: 现场部署
        - id: metrics
