      - number: '8.4'
        title: 退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              仅看公开证据，Locus 还没到可退出状态，即便它可能具备战略重要性，也确实已商业化。公开来源仍没有给出一套干净输入，让投资人能把 Locus
              当作已充分承销的上市公司候选标的：账户集中度、净留存、分业务毛利率、当前现金与资金续航期、2022 年后的股权结构更新，以及 Array
              从试点到量产的转化。因此，正确尽调路径要瞄准真正会改变建议的事实。如果管理层能证明 ARR 既大且高质量、客户集中度可控、利润率在改善，且 Array
              正转化为可规模化收入而不是昂贵试验，支付更高价格的理由会增强。如果这些事实仍不透明，或结果弱于暗示，正确估值就应该收缩，而不是扩张。这让最终结论明确但有条件：保持跟进，但不要让动量、奖项或品类热度替代可定价性。Locus
              可以是一家强公司，却仍可能在错误估值点上成为时机很差的入场。
