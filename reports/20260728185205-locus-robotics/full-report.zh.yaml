              客户证据足以支持对需求的信心，但还不足以关闭所有承销问题。缺失最大的指标，恰是投资人最关心的指标：大客户集中度、续约率、流失率、车队扩张批次、按账户收入份额，以及按垂直划分的价值兑现周期。Locus
              不发布这些数字，观察者只能退回到 DHL 扩张等里程碑代理指标，或案例研究档案的广度。这有用但不完美，尤其因为官方客户界面天然会高估成功部署。Jared Watkins
