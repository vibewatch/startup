companyProfile:
  summary: >-
    Locus Robotics 是一家位于 Wilmington, Massachusetts 的仓库自动化公司，源于 2014 年 Quiet Logistics 分拆，业务围绕协作式自主移动机器人、LocusONE 编排和面向
    3PL、零售、医疗健康及工业仓库的机器人即服务模式展开。公开证据显示，这是一家已形成规模的私营运营商，覆盖 150+ 个品牌、350+ 个站点，DHL 采用程度很深，并在 2026 年借助 Locus Array 和收购
    Nexera 将路线图转向自主履约；但它仍缺少投资人做精准定价入场所需的公开财务和股权结构表披露。
