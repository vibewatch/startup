  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 市场、需求与预算风险
        blocks:
          - type: paragraph
            body: >-
              Locus 受益于真实的仓库自动化顺风，但顺风不会消除需求风险。公开市场报告仍指向 AMR
              和仓库自动化的双位数增长，官方劳动力和电商统计也解释了为什么运营商持续寻找生产率工具。但同一批来源也支持更谨慎的解读。仓库自动化距离普遍采用还很远，这意味着许多运营商仍受预算约束、心存怀疑或在运营上谨慎。Locus
              相关的 2024 年裁员报道在这个语境下重要，因为它说明即便规模化玩家，也必须在疫情时期假设正常化后调整成本。这不是推翻论点的事实，但提醒投资人，品类增长不是直线。RaaS 降低了初始资本开支摩擦，却不能消除
              ROI 审视、订阅疲劳，或仓库在订单量、劳动力条件、客户承诺变得不确定时推迟自动化的倾向。因此，第一个风险视角是需求质量：大 TAM 标题提供支撑，但不会让预算无摩擦，也不会让时点必然到来。
