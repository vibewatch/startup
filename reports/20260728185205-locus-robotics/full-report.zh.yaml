      columns:
        - 概率
        - 影响
        - 当前证据深度
      rows:
        - label: 披露不透明
          values:
            - 高
            - 高
            - 中
        - label: Array 商业化
          values:
            - 中高
            - 高
            - 低
        - label: 客户集中度
          values:
            - 中
            - 高
            - 低
        - label: 需求正常化
          values:
            - 中
            - 中高
            - 中
        - label: 合规 / 安全阻碍
          values:
            - 中低
            - 中
            - 中
