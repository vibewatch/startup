  - id: FV004
    title: 情景流程图
    type: flow
    layout: compact
    summary: 关键分叉点在于，下一次重大定价事件前，是否会出现更好的证据。
    data:
      nodes:
        - id: today
          label: 当前观察立场
        - id: evidence
          label: 更好披露 + Array 证明
        - id: bull
          label: 上调至接近投资
        - id: stale
          label: 价格不变、不透明不变
        - id: bear
          label: 折价或放弃
      edges:
        - from: today
          to: evidence
          label: 一手数据改善
        - from: evidence
          to: bull
          label: 质量确认
        - from: today
          to: stale
          label: 无重大新证据
        - from: stale
          to: bear
          label: 下一轮价格过高
    approximationNotes: null
    claimRefs:
      - CV013
      - CV029
      - CV032
      - CV034
  - id: FV005
    title: 下行触发区间
    type: range
    layout: compact
    summary: 下行不是主要来自市场规模，而更来自披露不足和商业化不及预期。
    data:
