      - 核心假设
      - 估值含义
      - 触发切换的证据
    rows:
      - - 乐观
        - ARR 质量改善，Array 扩大钱包份额，集中度可控，披露更充分
        - 可能支持接近或高于上一轮私募式倍数的价格
        - 一手证据补上关键披露缺口
