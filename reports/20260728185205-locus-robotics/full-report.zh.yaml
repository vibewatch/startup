      - number: '2.4'
        title: 约束、矛盾与承销谨慎点
        blocks:
          - type: paragraph
            body: >-
              看多的市场故事需要克制。不同来源的增长预测差异很大，这本身说明品类边界模糊，许多出版方描述的是相互重叠但并不相同的市场。更重要的是，市场增长不会抹掉部署摩擦。MarketsandMarkets、Mordor 和
              Polaris 都保留了同一类谨慎：与传统 WMS 或 ERP 栈集成会拖慢项目，低劳动力成本地区采用可能更慢，即使 ROI 叙事很强，前期部署成本仍然重要。SellersCommerce
              的标题统计也显示，该行业还没有充分渗透：只有约四分之一仓库被描述为拥有某种自动化，只有约 10% 使用高级自动化。这意味着仍有跑道，也意味着许多运营商仍未被说服或受约束。具体到
              Locus，另一个谨慎点是市场定义漂移。如果把整个仓库自动化 TAM 都当成可直接服务市场，公司会显得被人为低估渗透率；如果只看协作式拣货，又会低估编排、运输、补货和 Array
              驱动自主化的作用。平衡看法是，Locus 面向的市场足够大，需求信号也强；但投资人仍需要细分级别的胜率、部署经济性和净扩张数据，才能把市场动能转成持久的公司特定预测。
            claimRefs:
