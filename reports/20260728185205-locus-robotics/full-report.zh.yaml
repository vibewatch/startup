      - number: '3.4'
        title: 护城河耐久性与压缩风险
        blocks:
          - type: paragraph
            body: >-
              平衡后的护城河结论是：Locus 有真实差异化，但不是无人挑战。公开证据中最能证明耐久性的，不是话术，而是运营事实：大型客户名称、长期 DHL
              关系，以及经济性跑通后部署能扩大的里程碑证据。这支撑了围绕存量仓库部署、劳动效率和协作式采用的工作流特定护城河。反向因素同样重要。公开报告显示，市场里有一批可信厂商，并不是一个等待单一赢家的赛场。围绕裁员和后疫情正常化的负面报道提醒投资人，仓库机器人需求会降温，预算会暂停，品类领导者仍要经历成本重置。Berkshire
              Grey 私有化也进一步说明，强机器人技术并不保证持久的独立经济性或公开市场韧性。Locus 推进 Array
              若成功，可能强化护城河；但它也可能压缩护城河，因为公司会被拿来与已经销售更高密度劳动力替代的自主平台比较。因此，投资人应把 Locus
              的护城河承销为取决于持续产品执行、集成质量和扩张行为，而不是抵御竞争性定价或架构替代的永久盾牌。
