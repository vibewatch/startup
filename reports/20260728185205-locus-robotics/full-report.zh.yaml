              Locus 的公开运营证明强于公开财务证明。客户、合作伙伴和里程碑材料显示，平台被大型企业运营商使用，部署也能在初次采用后扩张。DHL
              仍是最有用的公开运营案例。其医疗健康案例研究报告了更少质量问题、更快周期时间和大幅降低的培训成本；更广的 DHL 里程碑新闻稿则显示累计拣货从数亿件推进到超过 10 亿件。HelloFresh 提供了更新案例：在
              Locus 支持下，冷藏 SKU 产能扩大五倍。这些不是收入披露，当然也不等同于 CAC、毛利率或留存表；但它们确实重要。它们说明产品能在规模上解决运营痛点，而这是仓库自动化形成持久收入质量的前提。Sacra 和
              Automated Warehouse 等二手报道随后用这些运营证明估算 ARR 和增长。这些估算有参考价值，但在管理层更完整地开账本前，投资人仍应把它们放在「估算」篮子里。
