      - number: '8.2'
        title: 私募估值背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              核心私募估值背景仍来自 2021 年 Series E 轮和 2022 年 Series F 轮。这两轮把估值从 $1B 推到接近 $2B。2026 年的二级研究随后给出约 $180M ARR
              估计，并暗示最后一轮私募在成交时对应很高的收入倍数。这些信息有用，但若不调整，仍不足以支撑当下买入决定。第一，ARR 数字是估算，不是公司经审计披露。第二，投资人不知道 2022
              年后股权结构、优先权或隐含市场价值发生了什么。第三，自 2021–2022 年私募市场热情顶峰以来，机器人和自动化的市场环境已明显变化。正确回应是入场纪律。如果新融资或流动性事件让 Locus
              接近上一轮私募估值，却没有给出更好披露，投资人应要求有意义的不透明折扣，而不是为旧叙事惯性买单。估值偏贵的公司仍值得跟踪；只是不能因为上一次标题估值就自动值得买入。
