            body: >-
              可辩护的财务结论是平衡的。正面看，Locus
              似乎拥有类似经常性的模式、真实企业牵引、可衡量的客户生产率提升，以及可信的「先落地、再扩张」行为证据。在许多公司止步于试点的机器人品类里，这些都是有意义的质量信号。负面看，公开记录仍缺少真正决定可投资性的变量：经审计收入、收入结构、分业务流毛利率、服务负担、当前现金余额、烧钱、跑道、续约数据和客户集中度细节。即便
              ARR
              或每台机器人定价这类最常被引用的数字，也仍是二手估算。因此，投资人应抵制虚假精确。今天一个稳健模型必须保留宽区间，并明确标注哪些假设来自公司主张、哪些来自二手估算、哪些根本不可得。下一步尽调不是再打一轮市场规模论证，而是拿到收入质量、成本结构和资本充足性的第一手证据，才能把运营规模翻译成持久企业价值。
