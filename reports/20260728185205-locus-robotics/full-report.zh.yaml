      - number: '5.4'
        title: 技术基准与判断
        blocks:
          - type: paragraph
            body: >-
              比较后的技术解读是平衡的。相对 Symbotic 和 AutoStore，Locus 仍更偏向灵活性和存量仓库部署，而不是最大密度或固定系统吞吐。相对 Geek+、GreyOrange、Hai Robotics
              和 Quicktron，它现在更像一个软件厚的平台厂商，而不是单一工作流 AMR 公司。相对 Berkshire Grey 和其他机器人拣货进入者，Array 是公司对「Locus
              能否在不放弃原始装机基础优势的情况下沿自主化曲线上移」这一问题的回答。这个方向可信，但不能自证。越多厂商宣称 AI、编排和自适应自动化，这些口号商品化得越快。因此，最有用的尽调问题必须具体：多少 Array
              试点会转化，系统能处理多少 SKU，真实运营中看到什么可靠性指标，规模化需要多少集成劳动？公开证据支持一个可信且持续演进的产品平台，但尚未消除最新自主化层周围的执行风险。
