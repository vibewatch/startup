      - number: '7.3'
        title: 客户、竞争与扩张风险
        blocks:
          - type: paragraph
            body: >-
              客户和竞争故事最好理解为压缩风险，而不是崩塌风险。Locus 拥有可信客户证明，尤其来自
              DHL；但公开记录没有披露集中度、续约或账户级经济性。这意味着同一批带来信心的旗舰关系，也制造信息不对称。竞争会放大这个问题，因为买方可以用多种方式解决仓库劳动力和吞吐问题：协作式
              AMR、更高密度的货到人系统、交钥匙自动化，或局部流程重设计。Ocado/6 River 和 SoftBank/Berkshire Grey 等近期机器人 M&A
              结果显示，有能力的仓库自动化厂商并不都会成长为占主导地位的独立赢家。内部扩张再加一层风险。Locus
              按地理、工作流和产品深度扩张时，现场支持、培训和实施质量都会成为风险面的一部分。客户证明和装机基础历史降低了这类风险，但不能消除它。真正的问题是，当产品栈和全球野心同时变得更复杂时，Locus
              能否继续保持高质量客户成功。
