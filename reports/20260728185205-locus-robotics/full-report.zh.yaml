      - number: '2.3'
        title: 增长驱动与采用顺风
        blocks:
          - type: paragraph
            body: >-
              最强的市场顺风在公开来源中得到充分交叉验证。美国电商持续增长，核心仓库岗位劳动力市场规模庞大且流动率高，运营商还要在更快服务窗口下交付，同时更不能容忍空走和培训摩擦。Census Bureau 报告称，2026
              年 Q1 美国零售电商销售额为 $326.7 billion，同比增长 9.8%；BLS 仍显示 2024 年手工搬运工和物料搬运工岗位接近 695 万个，预计每年新增空缺超过 100 万个。这些本身不是
              Locus 的直接收入驱动，但解释了为什么仓库运营商持续寻找既能省人工、又能保留灵活性的工具。在此之上，仓库自动化报告反复把 3PL 增长、全渠道履约和软件驱动优化列为持久需求驱动。Locus 的 RaaS
              模式与这些压力匹配度很高：它把前期资本决策转为运营费用，支持旺季车队弹性，并避开固定系统常见的漫长重建周期。新版 Locus Array 故事在这里也重要：如果件拣和自主移动操作在仓库支出中占比提高，Locus
              就能从协作式拣货扩展到同一市场内更广的劳动力替代楔形。
