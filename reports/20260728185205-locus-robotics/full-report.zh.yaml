        title: 领导层厚度、治理信号与运营足迹
        blocks:
          - type: paragraph
            body: >-
              公开的领导层记录明显强于公开的治理记录。Locus 领导层页面列出 Rick Faulk 为 CEO、Mike Johnson 为 President and COO、Dustin Pederson 为
              CFO、Gina Chung 为 Chief Strategy Officer，并展示了覆盖客户成功、法务、技术、商业运营、硬件、软件和产品管理的更大团队。2026 年 4 月的领导层材料新增 Alan
              McDonald 和 Ashley Wallace Jones，说明公司在推向更宽的物理 AI 叙事时，仍在投入行业解决方案和品牌传播。公开来源也支持其地理分布式运营：Wilmington,
              Massachusetts 仍是全球总部，招聘页面仍指向 Amsterdam 作为欧洲总部，2022 年 Series F 新闻稿则提到 Singapore 的 APAC
              布局。这些事实支撑了真实的跨国运营足迹，但拼不出完整治理地图。董事会只能从领导层材料和融资公告里看到一部分：John Hayes 被列为董事长，2022 年 Series F 新闻稿提到 Goldman
              Sachs Asset Management 和 G2 Venture Partners
              增加董事席位。缺口仍是完整的现任董事名单、委员会结构，以及披露过的独立治理框架。公开员工数同样不透明；招聘页面强调全球团队，但没有给出可支撑的当前员工总数。
