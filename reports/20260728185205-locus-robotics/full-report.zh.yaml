  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台架构与工作流范围
        blocks:
          - type: paragraph
            body: >-
              Locus Robotics 不再只把自己营销成一家拣货辅助机器人公司。公开产品边界现在把最初的移动机器人基因，与围绕 LocusONE 和 Locus Array
              的更强软件与自主化故事结合起来。这一点重要，因为产品边界同时决定上行空间和风险。较早的协作模式强调减少行走、加快拣货，并在不大改既有仓库的情况下落地。2026 年平台故事仍保留这种存量仓库
              DNA，但新增了明确野心：把更多巷道环节、更多工作流自动化。公开产品页面和发布材料把 Array
              描述为一个能在库存所在位置直接完成拣货、上架、导入、投放、货位优化和补货的系统。这比「机器人帮助人类更快拣货」宽得多。也就是说，真实技术面现在是机器人、车队编排、集成层和操作质量的组合。任何只盯移动底盘或只盯夹爪的产品尽调，都会错过
