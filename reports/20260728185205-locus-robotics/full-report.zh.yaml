      - number: '1.4'
        title: 里程碑、产品演进与负面背景
        blocks:
          - type: paragraph
            body: >-
              里程碑轨迹连贯，也具备战略意义。Locus
              最初的协作模式聚焦于在既有仓库布局内把机器人带到人身边，减少拣货员行走距离；这仍是装机基础的底座。当前里程碑显示，公司正从协作式拣货明确上探到更广的编排和自主操作。2026 年 4 月发布的 Locus
              Array 引入机器人到货类别，系统可在巷道内直接完成拣货、上架、导入、投放、货位优化和补货。一个月后，收购 Nexera Robotics 把专利 NeuraGrasp 技术和 Vancouver
              操作团队纳入平台，目标明确是扩大 SKU 覆盖并强化移动操作。这些动作在战略上顺理成章，因为它们让 Locus
              尝试在客户既有设施内捕获更多劳动力支出，而不只是销售辅助拣货。负面视角并不是公开丑闻，而是披露和执行上的谨慎。Jared Watkins 的行业评论提到，疫情时期的电商假设正常化后，公司在 2023 和 2024
              年裁员；与此同时，公开来源仍没有给出经审计收入、当前员工数或完整董事会视图。公司的快速扩张叙事可信；真正的问题是，这种规模能以多高利润率、可持续地转化为长期企业价值。
