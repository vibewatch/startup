chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、起源与商业模式
        blocks:
          - type: paragraph
            body: >-
              Locus Robotics 将自己定位为一家「灵活性优先」的仓库自动化公司，帮助运营商在不重建仓库的情况下应对订单量波动、劳动力不稳定和订单结构变化。其核心模式在官网、公司页面、产品 FAQ
              和近期发布材料中保持一致：Locus 把自主移动机器人和 LocusONE 编排层作为统一服务出售，而不是一次性资本设备。关键在这里：公司的商业话术并不押在单台机器人上，而是靠快速部署、接入既有 WMS
              栈，以及把自动化支出转入运营预算的订阅结构，降低采用摩擦。当前平台叙事已经覆盖协作式人到货机器人、更重载的运输机器人，以及用于自主巷道执行的新版 Locus Array
              系统；但商业框架仍强调存量仓库兼容、弹性扩容和最小化基础设施改造，而不是固定系统重建。历史起点同样重要。可信的二手资料和 2025 年 Harvard Business School 案例都把 Locus 描述为
              Quiet Logistics 在 Amazon 收购 Kiva 后于 2014 年分拆出来的公司；那次收购切断了一条原本可用的自动化路径，也解释了为什么 Locus
              长期把命题放在务实的仓库工作流上，而不是研究实验室式的新奇技术。
