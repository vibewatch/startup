  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争边界与范式地图
        blocks:
          - type: paragraph
            body: >-
              Locus Robotics 的正确竞争地图，比「其他 AMR 厂商」更宽，但比「所有仓库自动化」更窄。Locus 的装机基础建立在协作式机器人之上：它们在既有仓库内减少拣货员行走，配合 LocusONE
              编排层，并依靠机器人即服务模式降低采用摩擦。这意味着最相关的替代方案，是任何面向同一买方、解决同一劳动力、吞吐或灵活性问题的系统。其中一些是近亲，比如 6 River 的 Chuck/OMRS 模式，或
              Geek+ 的货架和货到人工作流。另一些则是从不同角度争夺同一预算的替代架构，包括 AutoStore 的高密度立方仓储系统、Symbotic 的端到端箱件处理自动化，以及 GreyOrange
              的重编排履约栈。Locus Array 的出现进一步扩大了竞争圈，因为它把 Locus 从辅助拣货推向更自主的巷道内执行。一旦完成这个转向，买方比较的就不再只是协作式 AMR
              与人工行走，而是不同自动化范式；每一种范式都有不同的锁定特征、部署模式和劳动力削减主张。
