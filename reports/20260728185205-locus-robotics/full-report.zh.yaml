      - number: '2.2'
        title: 买方细分、用户与预算所有者
        blocks:
          - type: paragraph
            body: >-
              Locus 的购买链条更多是运营驱动，而不是纯技术驱动。仓库运营负责人通常最先拥有痛点，因为行走浪费、劳动力波动、SLA 压力和季节性峰值首先落在他们身上。IT 和系统团队也关键，因为移动自动化只有能干净接入既有
              WMS、ERP 和相关自动化，才跑得起来；财务则判断 RaaS、回本周期和爬坡灵活性是否足以支撑项目。公开需求模式也清晰可读。市场报告和 Locus
              客户材料都指向电商、3PL、零售和医疗健康是最相关的细分，其中医疗健康尤其有吸引力，因为可追溯性和劳动力可靠性与原始拣货速度同样重要。3PL
              权重更高，因为它们需要在变化的客户项目之间调配弹性产能，并不总能证明固定、单用途基础设施的投入合理。Locus 的公开客户集与这一模式吻合：DHL、GEODIS、CEVA、UPS
              Healthcare、Cardinal Health、Kenco、Boots 和 Maersk
              都暗示买方重视存量部署、集成，以及更少人工参与的吞吐提升。因此，预算所有者很少只是机器人团队；这是一个跨职能购买动作，运营、IT 和财务必须同时认可适配度和时机。
