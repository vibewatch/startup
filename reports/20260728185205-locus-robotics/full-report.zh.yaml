            body: >-
              DHL 是公开记录中最重要的客户关系，因为它同时证明规模和持续时间。里程碑新闻稿显示，这段关系从数亿件累计拣货，推进到 2026 年在 40+ 个 DHL 设施完成 10
              亿件拣货。只停留在试点的关系不会这样发展。这是多年重复部署和运营信任的证据。DHL 医疗健康案例研究还提供了更细一层：在受监管物流场景中，质量问题、周期时间和培训负担都下降。HelloFresh
              贡献了另一个同样有用的角度：证明 Locus 能在温控食品杂货和多品牌履约中加深价值。公司围绕 Locus Array 与 DHL 建立早期访问关系，说明 Locus
              正尝试通过增加新工作流在既有大客户内部扩张，而不只是交付更多相同协作式机器人。合在一起，公开记录支持「先落地、再扩张」故事；但这种故事是通过里程碑和案例研究衡量的，而不是通过披露的续约或分批收入数据衡量。
