  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模层级
        blocks:
          - type: paragraph
            body: >-
              第一项分析工作，是把 Locus 合理可服务的市场，与涵盖输送机、固定式 AS/RS、分拣和服务的宽口径仓库自动化 TAM 区分开。Locus 自身定位围绕灵活移动机器人、编排软件和 RaaS
              部署模式，适配无需大规模改造的既有仓库。这让它清楚落在自主移动机器人和移动工作流自动化这个楔形市场里，而不是整个仓库资本设备市场。公开市场报告仍有价值，但必须分层看。Mordor
              给出宽口径仓库自动化天花板，Grand View、MarketsandMarkets 和 Polaris 则描述更窄的 AMR 市场。这些数字不应混用。宽口径自动化 TAM 包含许多 Locus
              不销售的方案；AMR 市场又漏掉了相邻的软件和服务池，而这些池子有助于解释为什么编排和 RaaS 经济性重要。务实结论是，Locus 受益于大型品类顺风，但真正的承销视角应放在
              AMR、拣货密集型履约、存量仓库改造，以及多站点企业仓库运营的交集上。
