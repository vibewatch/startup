      - - Ocado OMRS / 6 River
        - 协同 AMR 工作流系统
        - 有官方收购和产品资料，但当前独立指标较薄
        - 中密度零售与物流履约
        - 适配存量仓、Chuck AMR、工作流软件、WMS 兼容性
        - 近期规模披露不如头部上市同业可见
