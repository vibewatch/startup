          high: 40
          point: 25
          unit: '% qualitative band'
        - label: 情景严重度
          low: 1
          high: 5
          point: 3
          unit: ordinal-5
        - label: 执行敏感度
          low: 2
          high: 5
          point: 4
          unit: ordinal-5
        - label: 可比公司倍数压缩风险
          low: 2
          high: 5
          point: 4
          unit: ordinal-5
    approximationNotes: 这些是定性估值风险区间，不来自市场报价，也不是有保证的折价水平。
    claimRefs:
      - CV027
      - CV028
      - CV033
      - CV039
