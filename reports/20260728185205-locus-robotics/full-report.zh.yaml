  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价不透明
        blocks:
          - type: paragraph
            body: >-
              公开证据让商业模式方向清楚，但财务上并不干净。Locus
              把仓库自动化作为服务出售，而不是一次性机器人采购。公司的机器人即服务（RaaS）材料把产品描述为包含机器人、软件、支持和灵活扩容的打包方案，说明经济引擎至少部分具备经常性，也在运营上有黏性。集成材料还显示，交付产品包含软件编排，以及与仓库系统的连接，因此不能把
              Locus 当作纯硬件厂商。更难的问题是量级。公开来源没有把收入拆成硬件、软件、支持和扩展车队，也不发布价目表或标准化实际合同条款。即便最知名的公开基准——Sacra 估算每台机器人每月约
              $2,000——也只是二手估算，不是管理层提交的标价。结果是一个常见的后期私营公司模式：投资人能理解收入机制和商业吸引力，却还无法把它归一化成干净的报告口径收入结构、定价或利润率披露。
