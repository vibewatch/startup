      - 排除支出
      - 买方 / 付款方
      - Locus 适配度
    rows:
      - - 仓库自动化
        - 配送中心和履约中心内的机器人、输送线、AS/RS、分拣、仓库软件和部署服务
        - 仓储之外的工厂车间自动化和最后一公里运输
        - 供应链、运营、IT、财务
        - 可用作 TAM 上限，但比 Locus 当前产品范围更宽
      - - AMR 市场
        - 移动机器人、车队软件和配套移动物料搬运系统
        - 不含移动工作流的重型固定自动化
        - 运营和自动化负责人
        - 最贴近 Locus 传统 Origin/Vector 模型的品类锚点
      - - 拣选密集型履约自动化
        - 拣选、补货、上架和搬运工作流，劳动力行走时间和 SLA 波动在其中至关重要
        - 纯托盘化或非拣选工作流的自动化
        - 仓库运营商和 3PL 项目负责人
        - Locus 最适配的核心运营场景
      - - 存量场地柔性自动化
        - 在现有设施内落地，改造有限且要求快速爬坡
        - 围绕固定基础设施优化的绿地大型项目
        - 运营加财务
        - 契合 Locus 对部署速度和 RaaS 的公开卖点
      - - 自主移动操作
        - 使用 Locus Array 等系统做巷道级机器人拣选、补货和抓取扩展
        - 不含自主抓取的传统协作拣选
        - 创新和先进自动化采购方
        - 是 2026 年以后上行空间的重要新切口，不代表全部现有基座
    notes: 本表把完整仓库自动化 TAM，与更贴合 Locus 公开产品和商业故事的移动、存量场地切口分开。
