      - number: '6.3'
        title: 案例研究指标及其真实证明力
        blocks:
          - type: paragraph
            body: >-
              案例研究有用，但需要正确解读。它们最能证明 Locus 能创造运营价值，并赢得可重复引用的参考账户；在证明收入质量或留存经济性方面则较弱。GEODIS 很能说明这一点。Dallas Vector
              案例不只是客户标识页；它给出工作流层面的证据，说明 Locus 能在重推车 3PL 环境中提升每小时处理件数，同时改善人体工学并降低审计负担。UPS Healthcare
              提供了一个合规敏感的冷链案例，拣选行数提升，推拉伤害减少。Cardinal Health
              则是医疗健康分销商案例，拣货生产率提高三倍，并计划进一步推广。这些信号有价值，因为它们展示了工作流多样性，以及超出减少行走之外的实际收益。但它们仍不披露收入份额、合同条款、续约日期或扩张经济性。因此，正确的承销用途是运营层面：它们证明产品市场匹配和可引用性；但单靠它们，不能证明每账户持久盈利能力或留存质量。
