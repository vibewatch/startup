  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 正方、反方与建议
        blocks:
          - type: paragraph
            body: >-
              Locus 容易让人尊重，却不容易定价。正面逻辑很直接：公司有真实企业客户、大量公开里程碑证据，产品路线图也从协作移动机器人延展到 Array 和 Nexera
              支撑的更自主履约与操作。这些不是玩具公司的信号，而是值得持续主动跟进的信号。问题在于，估值需要的不只是证明产品真实存在，还要看清收入质量、利润率路径、留存、集中度和资本需求。公开证据在这些变量上仍不够。因此，正确判断是观察，而不是投资，也不是放弃。“投资”需要更扎实的依据来承销最新价格；“放弃”会忽视公司显然具备战略价值和有意义的经营牵引。平衡后的建议是观察：中等置信度、高风险、估值偏贵。偏贵，是因为最后已知私募估值已经反映了强预期；观察，是因为业务可信度足以支撑在更好的一手数据出现后继续尽调。
            claimRefs:
