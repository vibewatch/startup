      - number: '8.3'
        title: 可比公司组合与情景区间
        blocks:
          - type: paragraph
            body: >-
              可比组必须由多个不完美视角拼起来，而不是依赖一个万能可比对象。Symbotic 有用，因为它有公开披露、真实规模和实时市值，但产品架构和企业画像不同。AutoStore
              在某些方面是更纯粹的仓库自动化参照，但它也代表更成熟、且不同的系统架构。Geekplus 具备战略意义，因为它是以 AMR
              为核心、近期上市的公开同行；即使地域和上市地不同，品类仍有参考价值。然后是下行参照：Berkshire Grey、Fetch Robotics 和 6 River
              Systems。这些交易提醒投资人，机器人资产可以有战略价值，却仍可能以远低于峰值叙事的结果成交。因此，正确方法是看情景。牛市情景需要证据证明 Array
              显著扩大单客户价值，且披露的经济性改善；基准情景假设稳步扩张，但披露只逐步改善；熊市情景假设风险重定价、商业化走弱，或扩张经济性质量较低。今天无法把任何结果钉在一个精确估值上，这正是区间比点估计更诚实的原因。
