      - number: '1.3'
        title: 融资历史、规模信号与客户牵引
        blocks:
          - type: paragraph
            body: >-
              2021 至 2023 年的融资历史记录足够完整，可以锚定公司的后期画像。Locus 于 2021 年 2 月宣布以 $1B 估值完成 $150 million Series E，随后在 2022 年 11
              月以接近 $2B 的估值完成 $117 million Series F，Goldman Sachs Asset Management 和 G2 Venture Partners 加入董事会。可信的 2022
              年报道在融资规模和估值上基本一致，尽管更新的股权结构表细节缺失。公开运营规模信号也持续扩大。2021 年初材料提到超过 40 个客户、80 个仓库和累计拣货 3 亿件；2022 年 Series F
              新闻稿提到超过 90 个客户、超过 230 个签约站点，以及日均拣货超过 300 万件。到 2024 年，仅 DHL 就在 35+ 个 DHL 管理站点跨过累计拣货 5 亿件；到 2026 年 3 月，DHL 与
              Locus 在 40+ 个 DHL 设施的累计拣货超过 10 亿件。2025 年中至 2026 年中的公司支持来源，又把更广的公司叙事推到超过 150 个品牌、350+ 个站点、50–60
              亿次累计拣货，以及部署数万台机器人。最大的但书是经济性披露。Sacra 估算 2026 年 ARR 约 $180 million、累计一级融资约 $433
              million，但这些数字是二手估算，不是公司提交的财务报表。
