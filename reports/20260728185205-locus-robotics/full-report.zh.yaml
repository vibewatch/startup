            body: >-
              公开证据支持一个拥挤但仍分层的市场。Symbotic 是最清晰的规模基准，因为它披露数十亿美元年化收入、数十套部署中系统、盈利能力进展和大量现金；但它最直接竞争的是高吞吐、交钥匙市场端。AutoStore
