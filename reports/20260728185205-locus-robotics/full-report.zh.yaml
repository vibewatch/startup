              资本故事既亮眼又不完整。Locus 已经在 2021 年 Series E 和 2022 年 Series F 融到大额私募轮次，估值分别达到独角兽和接近
              $2B，确认外部投资人为大规模扩张提供了资金。但公开记录没有披露当前现金、烧钱、跑道、债务或融资契约。因此，资本充足性只能间接评估。来自 The Robot Report 和 Jared Watkins
              的负面报道因此重要，因为它们暗示，疫情时期仓库繁荣降温后，管理层已经不得不调整成本。这并不能证伪公司的质量，却说明增长并非没有摩擦，外部资本纪律仍然重要。与上市同业比较会让问题更尖锐。Symbotic
              披露季度收入、利润、现金和部署数量。AutoStore 维持正式的投资者关系披露界面。Locus 两者都没有。含义并不是 Locus 弱，而是相较最可见的上市自动化可比公司，公开证据对 Locus
