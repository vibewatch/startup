  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 可见客户基础与垂直适配
        blocks:
          - type: paragraph
            body: >-
              在私营仓库机器人公司中，Locus 的客户界面属于更清晰的一类。公司客户页面和案例研究档案展示了覆盖
              3PL、零售、医疗健康和工业工作流的广泛参考账户。这个广度重要，因为它说明产品并不绑定单一狭窄仓库画像。公开记录中最明显的倾斜，仍是物流重、站点多的运营商，尤其是 3PL
              和医疗健康分销；在那里，劳动力可得性、可追溯性、安全和流程一致性都是核心痛点。DHL、GEODIS、CEVA、Cardinal Health、UPS Healthcare、Maersk 和 Boots
              等公开可见名称强化了这一模式。HelloFresh、Fleet Feet、Boulanger 和 Psycho Bunny 等零售与面向消费者的案例，说明 Locus
              也能进入品牌主导的履约环境；但运营重心看起来更偏企业物流，而不是轻量 SMB 电商。务实结论是，Locus
              最强的场景，是仓库负责人需要快速落地存量仓库自动化、无需重建设施即可扩容，并且案例研究级证明比商品化价格比较更重要。
