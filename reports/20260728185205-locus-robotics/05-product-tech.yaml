  name: Locus Robotics
chapter:
  number: 5
  title: Product & Technology
  summary: Locus Robotics now looks like a broader warehouse-automation platform than a single collaborative robot vendor. Official 2026 evidence shows a stack built around LocusONE orchestration, Array for autonomous in-aisle fulfillment, and the Nexera/NeuraGrasp acquisition for mobile manipulation, with patents, integrations, trust-center materials, and hiring surfaces reinforcing technical seriousness. The main open question is no longer whether the roadmap exists; it is whether Array scales from early access into repeatable, field-reliable production.
sections:
- id: platform-architecture-and-workflow-scope
  title: Platform architecture and workflow scope
  body: Locus Robotics no longer markets itself as only a picker-assist robot company. The public product perimeter now combines the original mobile-robot heritage with a stronger software and autonomy story centered on LocusONE and Locus Array. That matters because the product boundary shapes both the upside and the risk. The older collaborative model emphasized reducing walking, speeding picks, and fitting into existing warehouses without heavy redesign. The 2026 platform story still preserves that brownfield DNA, but it adds an explicit ambition to automate more of the aisle and more of the workflow. Public product pages and launch materials describe Array as a system that can pick, put away, induct, drop off, slot, and replenish directly where inventory sits. That is a much broader product claim than “robots help humans pick faster.” It also means the real technical surface is now a combination of robots, fleet orchestration, integration layers, and manipulation quality. Any product
    diligence that focuses only on the mobile base or only on the gripper will miss how Locus is trying to turn its installed base into a fuller automation platform.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE024
  - CE025
  tableRefs:
  - TE001
  - TE002
