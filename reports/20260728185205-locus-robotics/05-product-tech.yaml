- id: technical-benchmarking-and-verdict
  title: Technical benchmarking and verdict
  body: 'The comparative technical read is balanced. Relative to Symbotic and AutoStore, Locus still leans more toward flexibility and brownfield deployment than maximum density or fixed-system throughput. Relative to Geek+, GreyOrange, Hai Robotics, and Quicktron, it now looks closer to a software-rich platform vendor than a narrow one-workflow AMR company. Relative to Berkshire Grey and other robotic-picking entrants, Array is the company’s answer to the question of whether Locus can move up the autonomy curve without abandoning its original installed-base strengths. This is a credible direction, but it is not self-verifying. The more vendors claim AI, orchestration, and adaptive automation, the faster those slogans commoditize. That is why the most useful diligence questions are concrete: how many Array pilots convert, what share of SKUs can the system handle, what reliability metrics are seen in live operations, and how much integration labor is required at scale? Public evidence supports
    a credible and evolving product platform. It does not yet eliminate execution risk around the newest layer of autonomy.'
