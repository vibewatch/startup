    - Prevents direct growth-quality validation
    - Obtain board-approved financial statements or audited management package
  - - Revenue mix by hardware/software/services
    - Blocks margin and durability analysis
    - Request stream-level revenue and gross margin bridge
  - - Current cash, burn, and runway
    - Blocks capital adequacy judgment
    - Request treasury snapshot and 12-month operating plan
  - - Retention, churn, and expansion metrics
    - Blocks recurring-quality underwriting
    - Request NRR, gross retention, and cohort expansion tables
  - - Customer concentration
    - Blocks downside and pricing-power analysis
    - Request top-customer share and site distribution
  - - Realized pricing / discounting
    - Blocks normalized unit-economics modeling
    - Request pricing bands by fleet size, term, and workflow
  notes: These are the minimum missing items that would materially improve confidence in a Locus financial model.
