    - Request current unrestricted cash and revolver availability
  - - Monthly burn
    - Not publicly disclosed
    - Determines self-funding path
    - Cannot be calculated from retained sources
    - Request burn by cash and GAAP basis
  - - Runway months
    - Not publicly disclosed
    - Key for next-round timing
    - Unknown from open evidence
    - Request base / downside runway scenarios
  - - Historical capital raised
    - Series E $150M in 2021; Series F $117M in 2022
    - Shows prior investor support
    - Company has already absorbed substantial growth capital
    - Provide full cap table and any post-2022 financings
  - - Debt / obligations
    - No supportable 2026 public disclosure retained
    - Important for downside modeling
    - Assume unknown rather than zero
    - Request debt schedule, covenants, and leasing obligations
  - - Cost reset evidence
    - 2024 layoffs reported by Robot Report and Jared Watkins
    - Signals discipline and possible demand normalization
    - Management has already adjusted costs to conditions
    - Explain scope, savings, and current hiring plan
  notes: Capital adequacy cannot be modeled precisely from open data, so the table distinguishes confirmed historical financing from unavailable current-liquidity facts.
