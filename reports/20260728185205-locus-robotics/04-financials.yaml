- id: financial-verdict-and-diligence-blockers
  title: Financial verdict and diligence blockers
  body: 'The defensible financial verdict is balanced. On the positive side, Locus appears to have a recurring-style model, real enterprise traction, measurable customer productivity gains, and credible evidence of land-and-expand behavior. Those are meaningful quality signals in a robotics category where many companies never get past pilots. On the negative side, the public record is still missing the variables that actually determine investability: audited revenue, revenue mix, gross margin by stream, services burden, current cash balance, burn, runway, renewal data, and concentration detail. Even the most cited numbers such as ARR or per-robot pricing are still secondary estimates. That means investors should resist false precision. A robust model today has to preserve wide ranges and explicitly tag which assumptions are company-claimed, secondary-estimated, or simply unavailable. The next diligence step is not another market-size argument. It is obtaining primary evidence on revenue
    quality, cost structure, and capital adequacy so that operational scale can be translated into durable enterprise value.'
