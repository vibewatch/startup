- id: traction-unit-economics-and-customer-value
  title: Traction, unit-economics proxies, and customer value
  body: Locus is stronger on public operating proof than on public financial proof. Customer, partner, and milestone materials show that the platform is used by large enterprise operators and that deployments can expand after initial adoption. DHL remains the most useful public operating case. Its healthcare case study reports fewer quality issues, faster cycle time, and sharply lower training effort, while broader DHL milestone releases show hundreds of millions and then more than one billion cumulative picks. HelloFresh adds a more recent example in which chilled SKU capacity expanded fivefold with Locus support. These are not revenue disclosures, and they are certainly not equivalent to CAC, gross margin, or retention tables, but they do matter. They show that the product can solve operational pain at scale, which is a prerequisite for durable revenue quality in warehouse automation. Secondary coverage such as Sacra and Automated Warehouse then uses that operating proof to estimate ARR
    and growth. Those estimates are informative, but investors should still keep them in the “estimated” bucket until management opens the books more fully.
  claimRefs:
