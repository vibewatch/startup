  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and size layers
        blocks:
          - type: paragraph
            body: >-
              The first analytical step is to separate the market Locus can plausibly address from the broad
              warehouse-automation TAM that includes conveyors, fixed AS/RS, sortation, and services. Locus’s own
              positioning is centered on flexible mobile robots, orchestration software, and a RaaS deployment model
              that fits existing warehouses without large redesigns. That places it squarely inside the autonomous
              mobile robot and mobile-workflow automation wedge, not the entirety of warehouse capital equipment. Public
              market reports still matter, but they need to be layered. Mordor offers a broad warehouse-automation
              ceiling, while Grand View, MarketsandMarkets, and Polaris describe a narrower AMR market. Those numbers
              should not be treated as interchangeable. The broad automation TAM captures many solutions Locus does not
              sell, while the AMR market omits adjacent software and service pools that help explain why orchestration
              and RaaS economics matter. The practical conclusion is that Locus benefits from large category tailwinds,
              but its real underwriting lens should be the overlap among AMRs, picking-intensive fulfillment, brownfield
              retrofits, and multi-site enterprise warehouse operations.
