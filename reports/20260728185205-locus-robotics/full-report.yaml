  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive boundary and paradigm map
        blocks:
          - type: paragraph
            body: >-
              The right competitor map for Locus Robotics is broader than “other AMR vendors,” but narrower than “all
              warehouse automation.” Locus built its installed base around collaborative robots that reduce picker
              walking inside existing warehouses, pair with the LocusONE orchestration layer, and rely on a
              Robots-as-a-Service model that lowers adoption friction. That means the most relevant alternatives are any
              systems that solve the same labor, throughput, or flexibility problem for the same buyer. Some of those
              are close cousins, such as 6 River’s Chuck/OMRS model or Geek+ shelf and goods-to-person workflows. Others
              are substitute architectures that attack the same budget from another angle, including AutoStore’s dense
              cube-storage system, Symbotic’s end-to-end case-handling automation, and GreyOrange’s orchestration-heavy
              fulfillment stack. The emergence of Locus Array widens the competitive circle further because it pushes
              Locus from assisted picking toward more autonomous in-aisle execution. Once that shift happens, the buyer
              is no longer just comparing collaborative AMRs against manual walking. The buyer is comparing different
              automation paradigms, each with a different lock-in profile, deployment pattern, and claim to labor
              reduction.
