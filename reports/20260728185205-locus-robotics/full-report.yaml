  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Market, demand, and budget risks
        blocks:
          - type: paragraph
            body: >-
              Locus benefits from a real warehouse-automation tailwind, but that tailwind does not remove demand risk.
              Public market reports still point to double-digit AMR and warehouse-automation growth, while official
              labor and e-commerce statistics explain why operators keep searching for productivity tools. Yet the same
              sources also support a more cautious reading. Warehouse automation is still far from universal adoption,
              which means many operators remain budget-constrained, skeptical, or operationally cautious. The 2024
              layoff reporting around Locus matters in this context because it shows that even a scaled player had to
              resize costs when pandemic-era assumptions normalized. That is not a thesis-killer, but it is a reminder
              that category growth is not a straight line. RaaS reduces initial capex friction, but it does not
              eliminate ROI scrutiny, subscription fatigue, or the tendency of warehouses to defer automation when order
              volumes, labor conditions, or customer commitments become less predictable. The first risk lens is
              therefore a demand-quality lens: large TAM headlines are supportive, but they do not make budgets
              frictionless or timing inevitable.
