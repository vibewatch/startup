      - number: '1.3'
        title: Funding history, scale signals, and customer traction
        blocks:
          - type: paragraph
            body: >-
              The funding history from 2021 through 2023 is well enough documented to anchor the company’s late-stage
              profile. Locus announced a $150 million Series E in February 2021 at a $1 billion valuation, then a $117
              million Series F in November 2022 at a valuation close to $2 billion, with Goldman Sachs Asset Management
              and G2 Venture Partners joining the board. Reputable 2022 coverage aligns on that round size and valuation
              even if newer cap-table details are absent. Public operating-scale signals have also continued to expand.
              Early-2021 materials referenced more than 40 customers, 80 warehouses, and 300 million units picked; the
              2022 Series F release referenced more than 90 customers, more than 230 sites under contract, and average
              daily picks above three million. By 2024 DHL alone had crossed 500 million picks across more than 35
              DHL-managed sites, and by March 2026 DHL and Locus had surpassed one billion picks across more than 40 DHL
              facilities. Mid-2025 to mid-2026 company-backed sources then moved the broader company narrative to more
              than 150 brands, 350+ sites, 5-6 billion cumulative picks, and tens of thousands of robots deployed. The
              biggest caveat is economics disclosure. Sacra estimates about $180 million ARR in 2026 and roughly $433
              million total primary funding, but those figures are secondary estimates rather than company-filed
              financial statements.
