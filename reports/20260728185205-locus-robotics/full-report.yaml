      - number: '2.3'
        title: Growth drivers and adoption tailwinds
        blocks:
          - type: paragraph
            body: >-
              The strongest market tailwinds are well corroborated across public sources. U.S. e-commerce continues to
              grow, the labor market for core warehouse roles remains massive and turnover-prone, and operators are
              under pressure to hit faster service windows with less tolerance for idle walking and training friction.
              The Census Bureau reported U.S. retail e-commerce sales of $326.7 billion in Q1 2026, up 9.8% year over
              year, while BLS still showed nearly 6.95 million hand-laborer and material-mover jobs in 2024 with more
              than one million projected openings per year. Those are not direct Locus revenue drivers by themselves,
              but they explain why warehouse operators keep looking for labor-saving tools that preserve flexibility. On
              top of that, warehouse-automation reports repeatedly point to 3PL growth, omnichannel fulfillment, and
              software-led optimization as durable demand drivers. Locus’s RaaS model maps cleanly to these pressures
              because it converts upfront capital decisions into operating expense, supports fleet elasticity during
              peak seasons, and avoids the long redevelopment cycles associated with fixed systems. The newer Locus
              Array story also matters here: if piece-picking and autonomous mobile manipulation become a larger share
              of warehouse spend, Locus can expand from collaborative picking into a broader labor-replacement wedge
              inside the same market.
