      - number: '1.2'
        title: Leadership bench, governance signals, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              The public leadership record is materially stronger than the public governance record. Locus’s leadership
              page names Rick Faulk as CEO, Mike Johnson as President and COO, Dustin Pederson as CFO, Gina Chung as
              Chief Strategy Officer, and a wider bench covering customer success, legal, technology, commercial
              operations, hardware, software, and product management. April 2026 leadership materials add Alan McDonald
              and Ashley Wallace Jones, showing that the company is still investing in industry solutions and brand
              communications as it pushes into a broader Physical AI narrative. Public sources also support a
              geographically distributed operating posture: Wilmington, Massachusetts remains the global headquarters,
              the careers page still points to Amsterdam as the European headquarters, and the 2022 Series F release
              cited an APAC presence in Singapore. Those facts support a genuine multinational operating footprint, but
              they do not produce a full governance map. The board is only partially visible through leadership
              materials and financing announcements, with John Hayes listed as chairman and the 2022 Series F release
              naming Goldman Sachs Asset Management and G2 Venture Partners board additions. What remains missing is a
              full current board roster, committee structure, and disclosed independent-governance framework. Public
              headcount is similarly opaque; the careers page highlights a global team but does not provide a
              supportable current employee total.
