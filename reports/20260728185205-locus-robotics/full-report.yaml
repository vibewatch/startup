    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, origin, and business model
        blocks:
          - type: paragraph
            body: >-
              Locus Robotics presents itself as a Flexibility-First warehouse automation company that helps operators
              adapt to volume swings, labor variability, and changing order profiles without rebuilding their
              facilities. The core model remains consistent across the homepage, company pages, product FAQs, and recent
              launch materials: Locus sells autonomous mobile robots plus the LocusONE orchestration layer as a unified
              service rather than as one-off capital equipment. That matters because the company’s commercial pitch is
              less about a single robot and more about lowering adoption friction through rapid deployment, integration
              with existing WMS stacks, and a subscription structure that moves automation spending into operating
              budgets. The current platform story now spans collaborative person-to-goods robots, heavier transport
              robots, and the newer Locus Array system for autonomous aisle execution, but the commercial framing still
              emphasizes brownfield compatibility, elastic scaling, and minimal infrastructure change rather than
              fixed-system redesign. The historical origin is also important. Reputable secondary sources and a 2025
              Harvard Business School case describe Locus as a 2014 spinout from Quiet Logistics after Amazon’s Kiva
              acquisition closed off a previously available automation path, which helps explain why Locus has long
              centered its proposition on practical warehouse workflows instead of research-lab novelty.
