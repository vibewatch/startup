      - number: '2.2'
        title: Buyer segments, users, and budget owners
        blocks:
          - type: paragraph
            body: >-
              The buyer chain for Locus is operational rather than purely technical. Warehouse-operations leaders
              usually own the pain because they feel travel waste, labor volatility, SLA pressure, and seasonal spikes
              first. IT and systems teams matter because mobile automation only works if it integrates cleanly with
              existing WMS, ERP, and related automation, while finance underwrites whether RaaS, payback, and ramp
              flexibility justify the program. The public demand pattern is also legible. Market reports and Locus
              customer materials both point to e-commerce, 3PL, retail, and healthcare as the most relevant segments,
              with healthcare particularly attractive where traceability and labor reliability matter as much as raw
              picking speed. 3PLs matter disproportionately because they need flexible capacity across changing customer
              programs and cannot always justify fixed, single-purpose infrastructure. Locus’s public customer set
              aligns well with that pattern: DHL, GEODIS, CEVA, UPS Healthcare, Cardinal Health, Kenco, Boots, and
              Maersk all imply buyers that value brownfield deployment, integration, and labor-light throughput
              improvements. The budget owner is therefore rarely just a robotics team; it is a cross-functional buying
              motion where operations, IT, and finance must agree on both fit and timing.
            claimRefs:
