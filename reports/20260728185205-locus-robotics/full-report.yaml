      - number: '8.4'
        title: Exit readiness and final diligence
        blocks:
          - type: paragraph
            body: >-
              Locus is not exit-ready on a public-evidence basis yet, even though it may be strategically important and
              commercially real. Public sources still do not provide the clean set of inputs that would let an investor
              treat Locus like a fully underwritten public-company candidate: account concentration, net retention,
              gross margin by stream, current cash and runway, a post-2022 cap-table update, and Array
              pilot-to-production conversion. The right diligence path therefore targets what would actually change the
              recommendation. If management can show that ARR is both large and high quality, that customer
              concentration is manageable, that margins are improving, and that Array is converting into scalable
              revenue rather than expensive experimentation, the case for paying more strengthens. If those facts remain
              opaque or turn out weaker than implied, the right valuation should contract, not expand. That makes the
              final verdict decisive but conditional. Stay engaged, but do not let momentum, awards, or category
              excitement substitute for priceability. Locus can be a strong company and still a poorly timed entry at
              the wrong mark.
            claimRefs:
              - CV031
              - CV033
              - CV035
