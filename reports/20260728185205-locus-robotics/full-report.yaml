      - number: '7.3'
        title: Customer, competition, and scaling risks
        blocks:
          - type: paragraph
            body: >-
              The customer and competition story is best understood as a compression risk rather than a collapse risk.
              Locus has credible customer proof, especially through DHL, but the public record does not reveal
              concentration, renewal, or account-level economics. That means the same flagship relationships that
              inspire confidence also create information asymmetry. Competition compounds the issue because buyers can
              solve warehouse labor and throughput problems in multiple ways: collaborative AMRs, denser goods-to-person
              systems, turnkey automation, or partial-process redesign. Recent robotics M&A outcomes such as Ocado/6
              River and SoftBank/Berkshire Grey show that capable warehouse-automation vendors do not all emerge as
              dominant standalone winners. Internal scaling adds another layer. As Locus expands by geography, by
              workflow, and by product depth, field support, training, and implementation quality all become part of the
              risk surface. Customer proof and installed-base history reduce this risk, but they do not remove it. The
              real question is whether Locus can keep customer success quality high while its product stack and global
              ambitions get more complex at the same time.
