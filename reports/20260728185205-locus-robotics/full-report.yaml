  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing opacity
        blocks:
          - type: paragraph
            body: >-
              Public evidence makes the business model directionally clear but not financially clean. Locus sells
              warehouse automation as a service rather than as a one-time robotics purchase. The company’s
              Robots-as-a-Service materials frame the offer as a bundled solution that includes robots, software,
              support, and flexible scaling, which means the economic engine is at least partly recurring and
              operationally sticky. Integrations materials also show that the delivered product includes software
              orchestration and connectivity to warehouse systems, so Locus should not be treated as a pure hardware
              vendor. The harder question is magnitude. Public sources do not break revenue into hardware, software,
              support, and expansion fleets, and they do not publish a pricebook or standardized realized contract
              terms. Even the best-known public benchmark—Sacra’s roughly $2,000 per robot per month estimate—remains a
              secondary estimate rather than a management-filed list price. The result is a familiar late-stage
              private-company pattern: investors can understand the revenue mechanism and the commercial appeal, but
              they cannot yet normalize it into clean reported mix, pricing, or margin disclosures.
