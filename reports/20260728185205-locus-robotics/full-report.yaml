companyProfile:
  summary: >-
    Locus Robotics is a Wilmington, Massachusetts warehouse-automation company that started as a 2014 Quiet Logistics
    spinout and built its business around collaborative autonomous mobile robots, LocusONE orchestration, and a
    Robots-as-a-Service model for 3PL, retail, healthcare, and industrial warehouses. Public evidence shows a scaled
    private operator with 150+ brands, 350+ sites, deep DHL adoption, and a 2026 roadmap shift toward autonomous
    fulfillment through Locus Array and the Nexera acquisition, but it still lacks the public financial and cap-table
    disclosure investors would want for a precision-priced entry.
