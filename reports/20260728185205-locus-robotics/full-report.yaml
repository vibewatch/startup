      - number: '3.4'
        title: Moat durability and compression risk
        blocks:
          - type: paragraph
            body: >-
              The balanced moat conclusion is that Locus has real differentiation, but not an uncontested one. The best
              public evidence for durability is operational rather than rhetorical: large customer names, a long-running
              DHL relationship, and milestone evidence that deployments can expand when the economics work. That
              supports a workflow-specific moat around brownfield deployment, labor efficiency, and collaborative
              adoption. The counterweight is equally important. Public reports show a market crowded with credible
              vendors, not a field waiting for one winner. Adverse coverage around layoffs and post-pandemic
              normalization is a reminder that warehouse-robotics demand can cool, budgets can pause, and category
              leaders still face cost resets. Berkshire Grey’s take-private outcome further demonstrates that strong
              robotics technology does not guarantee durable standalone economics or public-market resilience. Locus’s
              move into Array may strengthen the moat if it succeeds, but it can also compress it by inviting
              comparisons with more autonomous platforms that already sell denser labor replacement. Investors should
              therefore underwrite Locus’s moat as conditional on continued product execution, integration quality, and
              expansion behavior, not as a permanent shield from competitive pricing or architectural substitution.
            claimRefs:
              - CP025
              - CP029
              - CP030
              - CP031
              - CP032
