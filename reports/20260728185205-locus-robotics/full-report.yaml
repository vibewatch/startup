  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis, anti-thesis, and recommendation
        blocks:
          - type: paragraph
            body: >-
              Locus is easier to respect than to price. The positive case is straightforward: the company has real
              enterprise customers, large public milestone evidence, and a product roadmap that is broadening from
              collaborative mobile robots into more autonomous fulfillment through Array and Nexera-backed manipulation.
              Those are not toy-company signals. They are the kinds of signals that justify staying actively interested.
              The problem is that valuation requires more than evidence that the product is real. It requires confidence
              in revenue quality, margin path, retention, concentration, and capital needs. Public evidence still falls
              short on those variables. That is why the right call is watch, not invest and not pass. “Invest” would
              require a stronger basis for underwriting the latest price. “Pass” would ignore the fact that the company
              clearly has strategic value and meaningful operating traction. The balanced call is therefore watch with
              medium confidence, high risk, and a rich valuation stance: rich because the last known private mark
              already reflected strong expectations, and watch because the business is credible enough to justify
              further diligence once better primary data becomes available.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
