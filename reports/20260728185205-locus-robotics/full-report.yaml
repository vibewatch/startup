      - number: '7.4'
        title: Disclosure, valuation, and overall verdict
        blocks:
          - type: paragraph
            body: >-
              The final risk category is the one that cuts across all the others: evidence incompleteness. Locus is not
              an obvious regulatory-crisis story, and open sources do not reveal severe public legal failures or a
              collapsing customer base. The harder issue is that key underwriting variables remain undisclosed just as
              the market increasingly compares automation businesses across public multiples and public disclosures.
              Symbotic’s quarterly numbers, public-company cash figures, and reporting cadence make Locus’s private
              opacity more visible. Even public market-cap tracking for peers can influence how investors frame what a
              private company should be worth or how much risk discount it deserves. The right downside scenario is
              therefore not dramatic scandal. It is slower commercialization, softer budgets, weaker-than-assumed unit
              economics, or greater concentration than milestone headlines imply. That is why the balanced verdict is
              high but manageable risk. Locus has real mitigants—customer proof, brownfield fit, and a roadmap aimed at
              higher-value workflows—but investors still need primary evidence on revenue quality, concentration, and
              Array commercialization before treating the company as de-risked.
