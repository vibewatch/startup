- id: comparable-set-and-scenario-ranges
  title: Comparable set and scenario ranges
  body: 'The comparable set has to be built from several imperfect lenses rather than one magical comp. Symbotic is useful because it offers public disclosure, real scale, and a live market capitalization, but it is a different product architecture and enterprise profile. AutoStore is a better pure-play warehouse-automation reference in some respects, but it also represents a more mature and different system architecture. Geekplus is strategically important because it is a public AMR-centric peer with recent listing data, making it category-relevant even if geography and listing venue differ. Then there are the downside references: Berkshire Grey, Fetch Robotics, and 6 River Systems. Those transactions remind investors that robotics assets can be strategically valuable and still clear at much lower outcomes than peak narratives imply. The right approach is therefore scenario-based. Bull requires evidence that Array materially expands value per account and that disclosed economics improve.
    Base assumes steady scaling with only gradual disclosure improvement. Bear assumes a repricing of risk, weaker commercialization, or lower-quality expansion economics. None of those outcomes can be pinned to a single exact valuation today, which is precisely why ranges are more honest than point estimates.'
