- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Customers
    - Large enterprise references and milestone scale validate product-market fit
    - Public sources do not reveal revenue concentration or retention quality
    - Show account-level revenue mix and renewals
  - - Product
    - Array and Nexera can expand wallet share and workflow coverage
    - New autonomy layers may raise cost and execution risk before they raise value
    - Show Array production metrics and pilot conversions
  - - Business model
    - RaaS can support recurring-like economics and faster adoption
    - Public evidence on realized pricing, margins, and expansion economics remains thin
    - Disclose stream-level margins and pricing
  - - Comparable context
    - Public peers and Geekplus provide useful comp anchors
    - Comps differ by architecture, geography, and disclosure quality
    - Provide enough data to justify whichever premium is asked
  notes: The anti-thesis is not that Locus is fake; it is that its priceability still trails its operating story.
