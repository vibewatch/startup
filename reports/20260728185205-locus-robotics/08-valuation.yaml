- id: TV006
  title: Exit readiness and diligence asks table
  columns:
  - Question
  - Why it matters
  - Current public answer
  - Exact diligence path
  rows:
  - - What is current ARR by definition and cohort?
    - Need real revenue quality, not just estimated scale
    - Unknown publicly
    - Request ARR bridge, gross retention, and NRR
  - - How concentrated is revenue?
    - Largest-customer risk changes valuation support
    - Unknown publicly
    - Request top-10 account share and site distribution
  - - What are gross margins by stream?
    - Determines whether recurring narrative deserves a premium
    - Unknown publicly
    - Request hardware/software/services margin split
  - - What is current cash and runway?
    - Determines financing pressure and downside timing
    - Unknown publicly
    - Request cash, burn, and downside runway
  - - How many Array pilots convert to production?
    - Largest swing factor in future wallet-share upside
    - Unknown publicly
    - Request pilot funnel and production conversion metrics
  notes: These asks focus only on variables that would materially change the recommendation or price discipline.
