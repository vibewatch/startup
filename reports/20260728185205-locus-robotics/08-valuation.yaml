- id: private-mark-context-and-entry-discipline
  title: Private-mark context and entry discipline
  body: The core private valuation context still comes from the 2021 Series E and 2022 Series F rounds. Those rounds established a move from a $1 billion valuation to a mark close to $2 billion. Secondary 2026 research then adds an ARR estimate of roughly $180 million and suggests that the last private round equated to a very high revenue multiple at the time it was struck. This is useful, but not enough to anchor a present-tense buy decision without adjustment. First, the ARR figures are estimates rather than audited company disclosures. Second, investors do not know what has happened to the cap table, preferences, or implied market value since 2022. Third, the market environment for robotics and automation has changed materially since the peak private-market enthusiasm of 2021-2022. The correct response is entry discipline. If a new financing or liquidity event presents Locus near its last private mark without also offering better disclosure, investors should require a meaningful opacity
    discount rather than paying for old narrative momentum. A rich company can still be worth tracking; it is just not automatically worth buying at the last headline valuation.
  claimRefs:
