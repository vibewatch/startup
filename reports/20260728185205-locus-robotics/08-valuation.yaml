- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Current read
  - Why it matters
  - Decision implication
  rows:
  - - Recommendation
    - watch
    - Business quality appears real, but public valuation evidence is incomplete
    - Stay engaged and demand better data before upgrading
  - - Confidence
    - medium
    - There is meaningful operating proof, but too many price-setting variables remain private
    - Use scenarios and wide ranges
  - - Risk rating
    - high
    - Disclosure gaps, customer concentration uncertainty, and Array execution all matter
    - Do not underwrite this like a de-risked public comp
  - - Valuation stance
    - rich
    - The last known private mark already assumed strong growth and economics
    - Require an opacity discount if a new round comes at similar levels
  - - What would improve the call
    - Better ARR quality, margin, concentration, and Array conversion evidence
    - These close the biggest pricing gaps
    - Move from watch toward invest only if primary evidence improves
  notes: Summary converts the available public record into an investability stance as of 2026-07-28.
