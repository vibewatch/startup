chapter:
  number: 6
  title: Customers
  summary: 'Public evidence suggests Locus Robotics has real multi-vertical product-market fit, with its strongest proof set concentrated in 3PL and healthcare logistics. DHL remains the flagship account and the clearest renewal proxy, while HelloFresh, GEODIS, UPS Healthcare, and Cardinal Health show that the platform can also deliver measurable value across grocery, heavy 3PL, and regulated healthcare workflows. The missing piece is not customer relevance but customer economics: concentration, retention, and revenue share by account remain undisclosed.'
sections:
- id: visible-customer-base-and-vertical-fit
  title: Visible customer base and vertical fit
  body: Locus has one of the more legible customer surfaces among private warehouse-robotics companies. The company’s customer page and case-study archive show a broad set of reference accounts spanning 3PL, retail, healthcare, and industrial workflows. That breadth matters because it suggests the product is not tied to one narrow warehouse profile. The strongest tilt in the public record is still toward logistics-heavy and multi-site operators, especially 3PLs and healthcare distribution, where labor availability, traceability, safety, and process consistency are core pain points. Publicly visible names such as DHL, GEODIS, CEVA, Cardinal Health, UPS Healthcare, Maersk, and Boots reinforce that pattern. Retail and consumer-facing examples such as HelloFresh, Fleet Feet, Boulanger, and Psycho Bunny show that Locus can also play in brand-led fulfillment environments, but the operating-center-of-gravity looks more enterprise logistics than lightweight SMB e-commerce. The practical takeaway
    is that Locus seems strongest where warehouse leaders need rapid brownfield automation that can scale without rebuilding the facility and where case-study-level proof matters more than commodity price comparisons.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU015
  - CU017
  - CU018
  - CU034
  tableRefs:
  - TU001
  - TU002
  figureRefs:
  - FU001
- id: flagship-accounts-and-expansion-signals
  title: Flagship accounts and expansion signals
  body: 'DHL is the most important customer relationship in the public record because it demonstrates both scale and duration. Milestone releases show the relationship progressing from hundreds of millions of cumulative picks to one billion picks across more than 40 DHL facilities by 2026. That is not how pilot-only relationships behave. It is evidence of repeated deployment and operating trust over time. The DHL healthcare case study also adds a more granular layer by showing reductions in quality issues, cycle time, and training burden in a regulated logistics context. HelloFresh contributes a different but equally useful angle: proof that Locus can deepen value in temperature-controlled grocery and multi-brand fulfillment. The company’s early-access relationship with DHL around Locus Array suggests that Locus is trying to expand inside existing large accounts by adding new workflows rather than only shipping more of the same collaborative robots. Taken together, the public record supports
    a land-and-expand story, but one measured through milestones and case studies rather than through disclosed renewals or cohort revenue data.'
  claimRefs:
  - CU004
  - CU005
  - CU006
  - CU007
