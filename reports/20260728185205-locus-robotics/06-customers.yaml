- id: case-study-metrics-and-what-they-actually-prove
  title: Case-study metrics and what they actually prove
  body: 'The case studies are useful, but they need to be interpreted correctly. They are strongest as proof that Locus can create operating value and win repeatable reference accounts. They are weaker as proof of revenue quality or retention economics. GEODIS shows this clearly. The Dallas Vector case is not simply a logo slide; it gives workflow-specific evidence that Locus can improve units per hour in a heavy-cart 3PL environment while improving ergonomics and reducing audit burden. UPS Healthcare adds a compliance-sensitive cold-chain example with improved lines picked and fewer push-pull injuries. Cardinal Health adds a healthcare distributor that tripled pick productivity and planned further rollout. These are valuable signals because they show workflow diversity and practical benefits beyond walking reduction. But they still do not disclose revenue share, contract terms, renewal dates, or expansion economics. The correct underwriting use is therefore operational: they prove product-market
    fit and referenceability. They do not, by themselves, prove durable per-account profitability or retention quality.'
  claimRefs:
  - CU011
  - CU012
  - CU013
  - CU014
  - CU023
  - CU024
  - CU025
  - CU033
  tableRefs:
  - TU004
  figureRefs:
  - FU003
- id: durability-gaps-concentration-questions-and-verdict
  title: Durability gaps, concentration questions, and verdict
  body: 'Customer evidence is strong enough to support confidence in demand, but not strong enough to close every underwriting question. The largest missing metrics are exactly the ones investors care about most: top-customer concentration, renewal rates, churn, fleet-expansion cohorts, revenue share by account, and time-to-value by vertical. Because Locus does not publish those figures, observers fall back on milestone proxies such as DHL’s expansion or on the breadth of the case-study archive. That is useful but imperfect, particularly because official customer surfaces naturally overrepresent successful deployments. Adverse commentary from Jared Watkins is helpful here because it reminds investors that strong logos and public growth narratives can coexist with a more difficult budget environment or slower-than-expected commercial normalization. The balanced verdict is still positive. Locus appears to have real multi-vertical product-market fit and credible land-and-expand dynamics, especially
    in 3PL and healthcare. But customer durability has to be inferred rather than measured, and that means any serious diligence process should push for account-level economics rather than stopping at logos and anecdotes.'
