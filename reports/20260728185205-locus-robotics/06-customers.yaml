    - Largest-customer concentration changes pricing power and downside risk
    - Unknown
    - Request top-10 account share and site count
  - - What are renewal and churn rates?
    - Needed to evaluate recurring quality
    - Unknown
    - Request gross and net retention by cohort
  - - How much of growth comes from expansion vs new logos?
    - Separates land-and-expand strength from top-of-funnel reliance
    - Only proxy evidence from milestones and case studies
    - Request bookings bridge by new vs existing customer
  - - Do some verticals ramp faster or retain better?
    - Important for GTM focus and forecasting
    - Unknown
    - Request time-to-value and retention by vertical
  - - How representative are the published case studies?
    - Official sources naturally bias toward wins
    - Partially knowable only from management diligence
    - Request win/loss and failed-deployment review
