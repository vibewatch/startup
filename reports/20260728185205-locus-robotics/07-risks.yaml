- id: TR004
  title: Competition and customer-risk table
  columns:
  - Surface
  - Risk
  - Evidence
  - Mitigant
  - Diligence ask
  rows:
  - - Flagship-account concentration
    - A few visible accounts may dominate economics
    - DHL milestones dominate public proof
    - Broader archive and healthcare/retail examples exist
    - Request top-10 revenue share and renewal rates
  - - Alternative architectures
    - Buyers can choose dense GTP or turnkey systems instead
    - Public comps and peer disclosures show many credible options
    - Locus retains brownfield flexibility and RaaS
    - Measure win/loss rates by competitor class
  - - Vendor consolidation
    - Not every capable robotics vendor stays independent
    - Ocado/6 River and Berkshire/SoftBank outcomes
    - Consolidation can also reduce some rivalry
    - Assess strategic optionality under weaker capital markets
  - - Scaling support quality
    - More geographies and workflows increase service burden
    - Hiring and new-product activity imply more complexity
    - Installed-base experience and DHL longevity help
    - Request deployment staffing and escalation metrics
  notes: Competition and customer risks interact because customer proof alone does not show how wins are defended over time.
