- id: packaging-integration-and-switching-costs
  title: Packaging, integration, and switching costs
  body: 'Capability alone does not decide warehouse-automation outcomes. Packaging, integration, and channel structure shape whether a buyer can approve a project at all. Locus’s RaaS positioning is central because it converts an automation decision into an operating-budget and ramp-flexibility conversation rather than a single large capex commitment. That is still a real commercial edge, but it is not unopposed. OMRS makes the same brownfield integration argument, and nearly every serious rival now emphasizes software orchestration and coexistence with existing WMS or ERP systems. This is why public price transparency remains limited in strategic value: official websites rarely disclose normalized realized pricing, discounting, or fleet-level contract terms. Instead, buyers compare deployment fit, timeline, labor savings, system interoperability, and long-term lock-in. Lock-in itself varies by architecture. AutoStore-style grids and dense rack systems tend to create deeper physical switching
    costs. Overlay AMR fleets can be easier to phase, expand, or partially replace. Orchestration-led systems can even encourage mixed fleets. Locus sits in the middle. Once deployed at scale, it creates meaningful workflow and software friction, but it does not trap customers as absolutely as a proprietary fixed grid would.'
