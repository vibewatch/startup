- id: peer-profiles-and-capability-overlap
  title: Peer profiles and capability overlap
  body: Public evidence supports a crowded but still segmented field. Symbotic is the clearest scale benchmark because it discloses billions of annualized revenue, dozens of systems in deployment, profitability progress, and a large cash balance, but it competes most directly at the high-throughput, turnkey end of the market. AutoStore is a stronger substitute for dense, space-constrained fulfillment where operators will accept a proprietary grid in exchange for extreme storage density and a mature goods-to-person operating model. Geek+, GreyOrange, Hai Robotics, Quicktron, and Berkshire Grey fill the middle with combinations of fleet software, sortation, shelf-to-person, carton handling, pallet workflows, and robotic picking. Ocado’s OMRS keeps 6 River relevant because it preserves the brownfield-friendly Chuck model inside a larger automation portfolio. Locus still stands out for rapid deployment, RaaS packaging, and a historically strong collaborative workflow story, but the distance
    between that story and rivals is smaller than it was a few years ago. Array narrows the capability gap further by letting Locus claim more autonomous tasks, even as it invites harder comparison with denser or more roboticized systems.
