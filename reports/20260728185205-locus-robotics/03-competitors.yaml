- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / disclosure signal
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - Locus Robotics
    - Collaborative AMR + autonomous extension
    - Private; strong site and pick milestones but thin financial disclosure
    - 3PL, retail, healthcare, brownfield warehouses
    - Rapid deployment, RaaS, integration, large collaborative installed base
    - Limited public pricing, revenue, and margin disclosure
  - - Symbotic
    - Turnkey end-to-end warehouse automation
    - Public company with quarterly revenue, cash, and deployment reporting
    - Very large retail, grocery, wholesale, and distribution networks
    - High throughput, dense storage, AI software, public scale disclosure
    - Higher-capex profile and not a like-for-like brownfield overlay
  - - AutoStore
    - Dense cube-storage goods-to-person
    - Public investor surface and extensive report library
    - Dense small-item fulfillment and e-commerce
    - High storage density, mature goods-to-person model, uptime claims
    - Proprietary grid architecture creates deeper physical lock-in
  - - Ocado OMRS / 6 River
    - Collaborative AMR workflow system
    - Official acquisition and product surface, but thinner current stand-alone metrics
    - Medium-density retail and logistics fulfillment
    - Brownfield fit, Chuck AMR, workflow software, WMS compatibility
    - Less visible recent scale disclosure than top public peers
  - - Geek+
    - Broad warehouse AMR suite
    - Large global brand presence via official product surface
    - 3PL, retail, parcel, and mixed warehouse workflows
    - Portfolio breadth across goods-to-person, sortation, and pallet flows
    - Public pricing and realized economics remain opaque
  - - GreyOrange
    - Orchestration-led fulfillment robotics
    - Strong software-and-systems positioning in official materials
    - Large multi-site operators needing mixed-workflow control
    - GreyMatter software, sortation, orchestration, heterogeneous automation
    - Harder to benchmark with one hero metric or one direct architecture
  - - Hai Robotics / Quicktron / Berkshire Grey
    - Dense ACR, modular AMR, and robotic picking substitutes
    - Credible official surfaces plus M&A/IPO signals in adjacent sources
    - Brownfield density, multi-scenario AMR, and robotic picking buyers
    - Each attacks Locus from a different architectural angle
    - Public proof varies by region and disclosure surface
  notes: This table groups the principal direct, adjacent, and substitute competitors that most often overlap with Locus in picking-heavy warehouse automation decisions.
