evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      A full current board roster, committee structure, and investor-control summary after the 2022 Series F and any
      2023 extension activity.
    whyItMatters: Late-stage governance quality affects financing flexibility, exit readiness, and key-person concentration risk.
    diligencePath: Request the current board list, committee charters, and shareholder-rights summary under NDA.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Post-2023 financing detail, including the terms of any Series F extension, debt facilities, or secondary
      transactions.
    whyItMatters: >-
      Without updated capitalization, the 2022 valuation is the only clean public benchmark and could materially
      misstate current investor risk.
    diligencePath: Request the cap table, debt schedule, and financing history update from management.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited or management-certified revenue, ARR definition, gross margin, burn, runway, and headcount data.
    whyItMatters: >-
      Operational milestones are strong, but investment judgment cannot rely on scale milestones alone if unit economics
      and cash needs remain opaque.
    diligencePath: >-
      Request a current board deck or audited financial package under NDA and reconcile it against secondary estimates
      such as Sacra.
    relatedQuestionRefs:
      - QO023
      - QO025
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: TM002 precise sam
    missingEvidence: >-
      A disclosed Locus pricebook, region mix, and workflow mix that would allow a supportable bottom-up SAM instead of
      broad market proxies.
    whyItMatters: Without price and workflow detail, TAM numbers can be mistaken for realistic near-term revenue opportunity.
    diligencePath: Request product-pricing and deployment-scope data by workflow and geography under NDA.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: market share evidence
    missingEvidence: >-
      Segment-level win-rate, pipeline, and net-expansion data that would let public observers estimate Locus-specific
      SOM and budget share.
    whyItMatters: >-
      Valuation and competitive judgments are weak without a view on whether Locus is actually converting category
      growth into share gains.
    diligencePath: Request cohort-level deployment, renewal, and expansion data segmented by 3PL, retail, and healthcare accounts.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM003
  - type: stale
    severity: minor
    topic: TM004 region-specific labor arbitrage
    missingEvidence: Current region-by-region labor-cost and deployment-payback data tied specifically to Locus programs.
    whyItMatters: >-
      Adoption speed can diverge materially by geography, which affects expansion assumptions even when the global
      category is growing.
    diligencePath: >-
      Compare project economics across North America, Europe, and lower-labor-cost markets using customer case data and
      sales pipeline records.
    relatedQuestionRefs:
      - QM020
    relatedTableRefs:
      - TM004
