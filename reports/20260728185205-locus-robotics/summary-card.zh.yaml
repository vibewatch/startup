  topStrengths:
    - 对一家私营机器人公司而言，Locus 的公开运营证据少见地充分：DHL、医疗案例和大量客户部署记录都能支撑判断。
    - Robots-as-a-Service 模式、棕地部署适配能力和 LocusONE 集成姿态，为无法彻底改造设施的大仓库提供了现实落地路径。
    - 2026 年 Array 与 Nexera 动作表明，公司正主动加深钱包份额，并从协作辅助走向更广义的自主履约。
    - Symbotic、AutoStore 和 Geekplus 的公开可比公司语境说明，仓库自动化是真实资本市场品类，不只是私募市场叙事。
  topRisks:
    - 公开证据仍缺少当前现金、烧钱速度、分业务毛利率、客户集中度、留存，以及 2022 年后股权结构条款，精确估值难度高。
    - DHL 是重要验证点，但账号级经济性缺位，客户集中度和续约质量仍披露不足。
    - Array 商业化和 Nexera 集成同时抬高上行空间与执行风险；公开现场可靠性数据仍有限。
    - 仓库自动化需求真实存在，但带周期性；2024 年裁员说明增长仍要和市场条件匹配。
    - 公开市场和并购可比案例显示，一旦披露、毛利率或商业化质量不及预期，机器人资产可能迅速重定价。
  unresolvedGaps:
    - 当前完全摊薄股权结构表、优先股堆叠，以及 2022 年 Series F 后任何融资或老股交易定价
    - 当前现金余额、月度烧钱速度、下行情景现金跑道，以及债务或租赁义务
    - 硬件、软件、支持服务和新自主工作流的收入结构与毛利率
    - 头部客户集中度、总留存率、净留存率和车队扩张队列
    - Array 从试点到量产的转化率、SKU 覆盖、在线率和人工介入指标
