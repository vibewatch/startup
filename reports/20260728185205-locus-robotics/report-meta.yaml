companyProfile:
  summary: Locus Robotics is a Wilmington, Massachusetts warehouse-automation company that started as a 2014 Quiet Logistics spinout and built its business around collaborative autonomous mobile robots, LocusONE orchestration, and a Robots-as-a-Service model for 3PL, retail, healthcare, and industrial warehouses. Public evidence shows a scaled private operator with 150+ brands, 350+ sites, deep DHL adoption, and a 2026 roadmap shift toward autonomous fulfillment through Locus Array and the Nexera acquisition, but it still lacks the public financial and cap-table disclosure investors would want for a precision-priced entry.
  foundedDate: '2014-01-01'
  founders:
  - name: Bruce Welty
    role: Co-founder / original CEO
    background: Quiet Logistics founder who helped incubate Locus as a practical warehouse-automation response after Amazon's Kiva acquisition changed the available robotics landscape.
    claimRefs:
    - CO007
    - CO008
  - name: Rick Faulk
    role: Chief Executive Officer
    background: Enterprise technology operator leading the current scaling phase, financing narrative, and 2026 push from collaborative AMRs toward physical-AI-driven autonomous fulfillment.
