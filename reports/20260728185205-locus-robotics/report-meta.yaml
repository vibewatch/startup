  foundingLocation: Wilmington, Massachusetts, USA
  headquarters: Wilmington, MA
  productSummary: Collaborative AMRs, LocusONE orchestration software, Locus Vector transport workflows, Locus Array autonomous fulfillment, integrations, and related deployment/support services for existing enterprise warehouses.
  customerFocus: Large 3PLs, healthcare distributors, omnichannel retailers, and industrial warehouse operators seeking flexible brownfield automation and labor-productivity improvement.
  businessModel: Robots-as-a-Service subscriptions that bundle robots, software, support, and scaling capacity, with newer opportunity to expand wallet share through additional workflows and more autonomous fulfillment systems.
  stage: growth
  fundingStatus: Late-stage private robotics company with a $1B Series E anchor in 2021 and a near-$2B Series F anchor in 2022; public evidence after that point is stronger on operating milestones than on financing updates, preferences, or current cash.
