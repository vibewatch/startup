    - Operating budget
    - Transport, case movement, replenishment
    - Operations + engineering
    - Need brownfield automation without long shutdowns
  - - Innovation / advanced autonomy team
    - Automation or strategy sponsor
    - Process engineers
    - Pilot or transformation budget
    - Autonomous picking and manipulation pilots
    - Strategy + operations
    - Need to test Array-style labor reduction beyond collaborative picking
