tables:
- id: TM001
  title: Market definition table
  columns:
  - Category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Locus
  rows:
  - - Warehouse automation
    - Robotics, conveyors, AS/RS, sortation, warehouse software, and deployment services inside DCs and fulfillment centers
    - Factory-floor automation outside warehousing and last-mile transportation
    - Supply-chain, operations, IT, finance
    - Useful TAM ceiling but broader than Locus’s current product scope
  - - AMR market
    - Mobile robots, fleet software, and related mobile-material-handling systems
    - Heavy fixed automation without mobile workflows
    - Operations and automation leads
    - Closest category anchor for Locus’s legacy Origin/Vector model
  - - Picking-intensive fulfillment automation
    - Picking, replenishment, putaway, and transport workflows where labor travel time and SLA variability matter
    - Automation for purely palletized or non-picking workflows
    - Warehouse operators and 3PL program owners
    - Core operating context where Locus is most relevant
  - - Brownfield flexible automation
    - Deployments into existing facilities with limited redesign and rapid ramp expectations
    - Greenfield mega-projects optimized around fixed infrastructure
    - Operations plus finance
    - Matches Locus’s stated deployment and RaaS pitch
  - - Autonomous mobile manipulation
    - Aisle-level robotic picking, replenishment, and grasping expansion using systems such as Locus Array
    - Traditional collaborative picking without autonomous grasping
    - Innovation and advanced-automation buyers
    - Important emerging wedge for 2026+ upside rather than the whole current base
  notes: The table separates the full warehouse-automation TAM from the narrower mobile and brownfield wedge that best fits Locus’s public product and commercial story.
