- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - E-commerce growth and fulfillment speed
    - positive
    - current
    - Keeps pressure on throughput and order-cycle compression
    - What share of Locus bookings come from e-commerce-intensive operations?
  - - Warehouse labor scarcity and turnover
    - positive
    - current
    - Supports automation budgets aimed at reducing walking and training friction
    - What labor delta and training savings do customers actually achieve?
  - - RaaS / OPEX-friendly budgeting
    - positive
    - current
    - Expands buyer pool beyond operators willing to fund fixed infrastructure
    - What gross-margin tradeoff does Locus accept for RaaS elasticity?
  - - 3PL demand for flexible automation
    - positive
    - current
    - Favors redeployable fleets over fixed site-specific systems
    - How concentrated is Locus in 3PLs and what are renewal dynamics?
  - - Integration with legacy WMS / ERP
    - negative
    - current
    - Can delay deployment, inflate cost, or cap usable scope
    - How often do integrations slip versus initial project plans?
  - - Upfront implementation and change-management cost
    - negative
    - current
    - Even modular robotics still require layout, process, and IT effort
    - What percent of pipeline stalls on non-hardware implementation work?
  - - Lower-labor-cost geographies
    - negative
    - structural
    - Can slow the urgency of AMR adoption outside high-cost labor markets
    - How does Locus price or prioritize low-cost regions?
  - - Autonomous mobile manipulation upside
    - positive
    - emerging
    - Array and Nexera could broaden the addressable labor pool beyond collaborative picking
    - When does Array become commercially material versus experimental?
  notes: The market tailwinds are real, but the decision to buy mobile warehouse automation remains gated by integration, ROI confidence, and the operator’s appetite for change.
