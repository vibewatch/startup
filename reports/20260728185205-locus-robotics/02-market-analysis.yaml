company:
  name: Locus Robotics
chapter:
  number: 2
  title: Market Analysis
  summary: 'Locus Robotics sells into a real and expanding warehouse-automation market, but the relevant market is narrower than all warehouse-automation spend: it is the flexible mobile-robotics and orchestration layer used in picking-intensive fulfillment environments where brownfield deployment, labor flexibility, and rapid ROI matter. Public 2026 market sources support double-digit growth across both AMRs and warehouse automation, with e-commerce, 3PL, retail, and healthcare driving demand, but they also preserve important constraints around integration, upfront cost, and buyer caution. The right underwriting stance is to treat market size as a range, not a single TAM headline, and to distinguish Locus’s addressable wedge from the whole automation stack.'
sections:
- id: market-boundary-and-size-layers
  title: Market boundary and size layers
  body: The first analytical step is to separate the market Locus can plausibly address from the broad warehouse-automation TAM that includes conveyors, fixed AS/RS, sortation, and services. Locus’s own positioning is centered on flexible mobile robots, orchestration software, and a RaaS deployment model that fits existing warehouses without large redesigns. That places it squarely inside the autonomous mobile robot and mobile-workflow automation wedge, not the entirety of warehouse capital equipment. Public market reports still matter, but they need to be layered. Mordor offers a broad warehouse-automation ceiling, while Grand View, MarketsandMarkets, and Polaris describe a narrower AMR market. Those numbers should not be treated as interchangeable. The broad automation TAM captures many solutions Locus does not sell, while the AMR market omits adjacent software and service pools that help explain why orchestration and RaaS economics matter. The practical conclusion is that Locus benefits
    from large category tailwinds, but its real underwriting lens should be the overlap among AMRs, picking-intensive fulfillment, brownfield retrofits, and multi-site enterprise warehouse operations.
