    - Supply-chain capex or opex budget
    - High-SKU order fulfillment and returns
    - Operations + IT + finance
    - Travel-time reduction and faster SLA execution
  - - Healthcare distribution
    - DC operations leader
    - Pharma / medical-device warehouse teams
    - Operations with compliance overlay
    - Accurate picking, replenishment, controlled workflows
    - Operations + quality/compliance
