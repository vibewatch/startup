- id: constraints-and-underwriting-cautions
  title: Constraints, contradictions, and underwriting cautions
  body: 'The bullish market story needs restraint. Growth forecasts vary widely across sources, which is a signal that category boundaries are fuzzy and that many publishers are describing overlapping but non-identical markets. More importantly, market growth does not erase deployment friction. MarketsandMarkets, Mordor, and Polaris all preserve forms of the same caution: integration with legacy WMS or ERP stacks can slow projects, lower-labor-cost regions may adopt more slowly, and upfront deployment cost still matters even when ROI narratives are strong. SellersCommerce’s headline statistics also show that the sector is not fully penetrated: only about one-quarter of warehouses are described as having some automation and only about 10% as using advanced automation. That means runway exists, but it also means many operators remain unconvinced or constrained. For Locus specifically, another caution is market-definition drift. If one treats the full warehouse-automation TAM as directly addressable,
    the company will look artificially underpenetrated; if one focuses only on collaborative picking, it will understate the role of orchestration, transport, replenishment, and Array-driven autonomy. The balanced view is that Locus addresses a large-enough market with strong demand signals, but investors still need segment-level win rates, deployment economics, and net expansion data to turn market momentum into a durable company-specific forecast.'
