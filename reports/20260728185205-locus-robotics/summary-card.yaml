  topStrengths:
    - >-
      Locus has unusually strong public operating proof for a private robotics company through DHL, healthcare case
      studies, and a broad archive of customer deployments.
    - >-
      The Robots-as-a-Service model, brownfield deployment fit, and LocusONE integration posture create a practical
      adoption path for large warehouses that cannot fully redesign facilities.
    - >-
      The 2026 Array and Nexera moves show an active attempt to deepen wallet share and move from collaborative
      assistance toward broader autonomous fulfillment.
    - >-
      Public comp context from Symbotic, AutoStore, and Geekplus shows that warehouse automation is a real
      capital-markets category rather than a purely narrative private niche.
  topRisks:
    - >-
      Public evidence still lacks current cash, burn, margin by stream, concentration, retention, and post-2022
      cap-table terms, making precise valuation difficult.
    - >-
      DHL is a major proof point, but the absence of account-level economics means customer concentration and renewal
      quality remain under-disclosed.
    - >-
      Array commercialization and Nexera integration increase upside and execution risk at the same time; public
      field-reliability data are still limited.
    - >-
      Warehouse-automation demand remains real but cyclical, and the 2024 layoff episode shows growth still needs to be
      matched to market conditions.
    - >-
      Public and M&A comparables show that robotics assets can reprice sharply when disclosure, margins, or
      commercialization quality disappoint.
  unresolvedGaps:
    - Current fully diluted cap table, preference stack, and any financing or secondary mark after the 2022 Series F
    - Current cash balance, monthly burn, downside runway, and debt or leasing obligations
    - Revenue mix and gross margin by hardware, software, support, and newer autonomous workflows
    - Top-customer concentration, gross retention, net retention, and fleet-expansion cohorts
    - Array pilot-to-production conversion, SKU coverage, uptime, and intervention metrics
