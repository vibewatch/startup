- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Why credible
  - Mitigation / diligence ask
  rows:
  - - Designer-grade speed and control
    - Webflow and Wix Studio are converging on pro design, collaboration, and AI
    - high
    - Direct product surfaces show overlapping governance, CMS, and design workflows
    - Request win/loss data against Webflow and Wix Studio by segment and deal size
  - - Integrated hosted workflow
    - No-export architecture creates portability objections
    - high
    - Framer itself says sites cannot be exported to HTML, and independent review flags lock-in
    - Test churn reasons, migration blockers, and expansion rates for customers with engineering teams
  - - Professional-web focus
    - Buyer jobs often drift toward app logic, commerce, or headless content
    - high
    - Bubble, Shopify, Contentful, and WordPress VIP each own adjacent jobs with stronger specialist depth
    - Segment pipeline by core job to be done instead of using one generic TAM story
  - - Fast PLG packaging
    - Wix and Squarespace keep large self-serve funnels while enterprise platforms move upmarket
    - medium
    - Pricing and installed-base evidence show incumbents combine broad reach with pro tiers
    - Ask management for CAC and conversion by self-serve vs enterprise cohorts
  - - Brand momentum in startups
    - Installed-base giants have more ecosystem trust and procurement familiarity
    - medium
    - WordPress, Shopify, and Wix each have far larger distribution footprints than Framer
    - Quantify enterprise reference density and customer concentration outside venture-backed startups
  - - AI and experimentation narrative
    - Category language is commoditizing quickly
    - medium
    - Most direct peers now market AI, localization, optimization, or experimentation as standard
    - Review product telemetry to confirm whether Framer still wins on activation speed and publish velocity
  notes: The register isolates competitive durability questions that matter for underwriting rather than listing every feature gap; each row points to a concrete diligence follow-up.
