tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding signal
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - Framer
    - Focal company / design-led website platform
    - Private; $100M Series D at $2B valuation; hundreds of thousands of sites and 500k+ monthly users
    - Designers, marketers, startups, and enterprise web teams
    - Designer-grade canvas plus CMS, analytics, A/B testing, and fast publishing in one hosted workflow
    - No HTML export; smaller ecosystem and installed base than major incumbents
  - - Webflow
    - Direct design-led builder
    - 300k+ brands; 0.9% of all websites / 1.2% of known CMS sites
    - Marketing, creative, engineering, and agency teams
    - Strong CMS, governance, localization, experimentation, and enterprise support
    - Enterprise motion can be higher-friction than SMB tools
  - - Wix / Wix Studio
    - Incumbent builder + professional tier
    - Public company with 200M+ users; 4.3% of all websites / 6.1% of known CMS sites
    - Self-creators on Wix; agencies and enterprise teams on Wix Studio
    - Huge distribution plus Studio-specific multi-site, code, and enterprise infrastructure features
    - Pricing is region-variable and the brand spans both DIY and pro tiers
  - - Squarespace
    - Design-driven incumbent SMB suite
    - Private after ~$7.2B Permira acquisition; millions in 200+ countries and territories
    - Entrepreneurs, creators, service businesses, and SMB brands
    - Strong brand, polished design, scheduling, ecommerce, and marketing suite
    - Less public proof of deep enterprise governance than direct upmarket rivals
  - - Bubble
    - No-code app platform
    - Enterprise plan and 6M+ Bubblers signal meaningful platform scale
    - Founders, operators, and teams building web or mobile applications
    - Logic-rich apps, workload-based scaling, hosting controls, and enterprise security
    - Not purpose-built for premium marketing sites
  - - Cargo
    - Creative portfolio builder
    - Niche creative platform with low-cost standard and commerce upgrades
    - Designers, artists, portfolios, and small creative shops
    - Portfolio-native positioning and simple low-cost packaging
    - Narrow feature scope and limited enterprise/governance signals
  - - Ghost
    - Publishing / newsletter platform
    - $100M+ publisher revenue each year; ~0.1% of all websites
    - Publishers, creators, media businesses, and membership-led operators
    - Newsletters, memberships, paid subscriptions, and open-source posture
    - Narrower visual-site design and enterprise-web workflow depth
  - - Shopify
    - Commerce operating system
    - 875M+ shoppers in 2024; 12%+ of US ecommerce; 30.6% of ecommerce systems
    - Merchants, retail operators, B2B/B2C commerce teams
    - Checkout, POS, payments, B2B, global markets, and headless commerce
    - Overbuilt for pure brand sites without serious commerce requirements
  - - Contentful
    - Composable content / DXP
    - Nearly 30% of Fortune 500; 180B+ API calls per month
    - Enterprise marketers, developers, and multi-brand/global teams
    - API-first architecture, governance, localization, personalization, and composability
    - Requires more technical ownership than an all-in-one hosted builder
  - - WordPress / WordPress VIP
    - Open CMS + enterprise content platform
    - 41.9% of all websites / 59.4% of known CMS sites; VIP starts at $25k/year
    - Creators, publishers, enterprise content teams, and multi-site organizations
    - Open ecosystem, plugins, ownership, and an enterprise VIP layer
    - Flexibility often brings more implementation complexity than hosted builders
  notes: The table is exhaustive for the user-specified focus set and mixes public company scale signals, official product positioning, and W3Techs installed-base data.
