- id: direct-builder-incumbents
  title: 'Direct builder incumbents: Webflow, Wix Studio, and Squarespace'
  body: 'Webflow is the most obvious direct rival because its public product surface overlaps heavily with Framer''s target buyer and use case. It markets to marketers, designers, developers, and agencies; says more than 300,000 brands use the platform; and leans hard into governance, localization, experimentation, and CMS depth. That makes Webflow the clearest benchmark for enterprise-web teams that want custom design without a traditional code handoff. It is also more mature than Framer in talking to procurement buyers with ROI, secure integrations, localization, and customer-success language.


    Wix is a more complicated threat because it spans both mass-market DIY and professional production. The core Wix pricing and IR pages still speak to a huge self-serve base, but Wix Studio is explicitly built for designers, developers, and marketers working on client or enterprise projects. Its custom CSS, code, shared content, SSO, and multi-site language mean it can chase many of the same agency and enterprise opportunities as Framer while also benefiting from much larger distribution.


    Squarespace matters differently. The Permira take-private confirms that it remains a scaled and strategically valuable platform, but the retrieved surface still leans more toward entrepreneurs, service businesses, and general online presence than toward the governed enterprise-web motion that Framer, Webflow, Wix Studio, Contentful, and WordPress VIP push hardest.'
