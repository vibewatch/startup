- id: pricing-switching-and-distribution
  title: Pricing, switching costs, and distribution power
  body: 'Packaging and procurement shape competitive pressure almost as much as raw features. Framer, Webflow, Bubble, Cargo, Ghost, and Shopify all expose clear entry packages and mostly self-serve paths, which helps product-led adoption and makes side-by-side trials easy. That is useful for Framer because it can be evaluated quickly against other visual builders without an enterprise sales cycle.


    But transparency also reveals where Framer''s trade-offs become more visible. Bubble makes app logic depth obvious. Ghost makes membership economics obvious. Cargo makes low-cost creative portfolios obvious. Shopify makes commerce depth obvious. Wix and Squarespace create a different problem: their readable pricing surfaces expose package ladders, but not stable globally comparable prices in the fetched text. Contentful and WordPress VIP move further into quote-led or contract-led pricing as enterprise scope rises.


    Framer''s biggest switching-cost lever is its integrated hosting and collaboration stack, yet that is also where buyer caution rises. Framer does not allow HTML export for self-hosting, which increases stickiness for satisfied customers but weakens portability versus WordPress VIP''s open foundation and Shopify''s headless APIs. Distribution also matters: WordPress, Shopify, and Wix can benefit from much larger ecosystems and budget familiarity than Framer.'
