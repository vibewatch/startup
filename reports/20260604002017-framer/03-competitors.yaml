- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Platform
  - Entry package
  - Visible list pricing
  - Contract model
  - Included orientation
  - Implication
  rows:
  - - Framer
    - Basic / Pro / Scale / Enterprise
    - $10 / $30 / $100+ usage / custom
    - Self-serve up to Scale; enterprise custom
    - Design-led websites, CMS, SEO, collaboration, experimentation add-ons
    - Clear entry path helps PLG, but enterprise motion still becomes custom
  - - Webflow
    - Starter / Basic / Premium / Team / Enterprise
    - Free / $15 / $25 / $2,500 annual Team / custom Enterprise
    - Self-serve plus annual-contract Team and custom enterprise
    - Hosted sites, CMS, localization, governance, AI, workflows
    - Most directly comparable visible ladder to Framer among upmarket peers
  - - Wix
    - Free / Light / Core / Business / Business Elite
    - Plan structure visible; exact prices vary by region and billing
    - Self-serve with localized checkout; enterprise conversation via Studio
    - Domain, hosting, AI, ecommerce, scheduling, dev tools on higher tiers
    - Mass-market accessibility with some benchmarking opacity
  - - Squarespace
    - Website plans + Premium services path
    - Trial and billing cadence visible; stable readable list prices not exposed in fetched text
    - Self-serve trial plus higher-touch premium services
    - Sites, domains, scheduling, ecommerce, marketing, service-business tooling
    - Strong SMB positioning, but less clean apples-to-apples price visibility
  - - Bubble
    - Free / Starter / Growth / Team / Enterprise
    - Free / $59 / $209 / $549 / custom
    - Self-serve up to Team; enterprise custom
    - Web and mobile app building with workload-based scaling
    - Good fit when buyers need application logic more than site polish
  - - Cargo
    - Standard / Commerce
    - $14 yearly or $19 monthly / $19.50 yearly or $28 monthly
    - Self-serve
    - Creative sites, portfolios, light commerce, domains, SSL
    - Low-cost niche substitute for creatives rather than a full enterprise-web platform
  - - Ghost
    - Starter / Publisher / Business / Custom
    - $18 / $29 / $199 / custom
    - Self-serve to Business; custom enterprise
    - Newsletters, memberships, paid subscriptions, analytics
    - Very clear packaging for publisher-led businesses
  - - Shopify
    - Core plan + Plus
    - $39 annual plan visible; Plus custom
    - Self-serve for core plans; enterprise via Plus
    - Checkout, POS, payments, B2B, markets, AI assistant, headless storefronts
    - Commerce-led buyers can see much deeper monetization tooling immediately
  - - Contentful
    - Free / Starter / enterprise-customized platform
    - Free and entitlement structure visible; enterprise economics custom
    - Developer/enterprise contract motion
    - API calls, roles, SSO, SCIM, governance, personalization, localization
    - Packaging suits composable content operations, not quick website trials
  - - WordPress VIP
    - Standard / Enhanced / Signature
    - Quote-based and visitor-scaled; annual contract
    - Enterprise sales motion
    - Open enterprise content platform with uptime and support SLAs
    - Strong fit for large organizations, but not PLG-friendly or instantly comparable
  notes: This table compares public packaging signals, not realized ARPU or negotiated enterprise pricing; quote-led and region-variable rows are marked explicitly instead of estimated.
