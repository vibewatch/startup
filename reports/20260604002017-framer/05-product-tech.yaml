chapter:
  number: 5
  title: Product & Technology
  summary: Framer now delivers a broad design-led website stack that spans visual authoring, AI generation, CMS, analytics,
    forms, localization, SEO, hosting, and enterprise controls in one managed product. Public sources show real breadth and
    unusually strong React/Motion lineage for a no-code website platform, but they also confirm hard portability trade-offs
    and leave gaps on public uptime transparency, extension governance, and the CMS ceiling for very complex sites.
sections:
- id: product-workflow-and-module-map
  title: Product workflow and module map
  body: 'Framer now sells more than a visual editor. The official home, pricing, and enterprise surfaces present a bundled
    operating layer for company websites: start with AI or a blank canvas, design responsively, bind content to a CMS, publish
    on managed hosting, and then keep iterating with analytics, forms, localization, and SEO inside the same environment.
    That end-to-end positioning is important because it explains why Framer has moved beyond its design-tool origins and into
    direct competition with professional web-platform vendors. The product''s core promise is that designers and marketers
    can ship and maintain the company .com without a traditional developer handoff for everyday work. Public limits also show
    where the bundle is opinionated rather than open-ended. The product looks strong for brand, campaign, and marketing sites,
    but the published page, event, CMS, and bandwidth ceilings confirm that Framer is still packaging a managed website system
    rather than a general-purpose application platform.'
  claimRefs:
