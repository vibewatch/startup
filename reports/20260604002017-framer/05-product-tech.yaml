    - Adds code components, overrides, plugins, and Fetch endpoints
    - Technical designer skill plus plugin governance
    - Still more constrained than fully self-hosted code
  - - Managed runtime and edge layer
    - Publishes pages, caches traffic, optimizes assets, and serves SEO files
    - AWS core services and Framer hosting stack
    - Customers inherit platform lock-in and rely on Framer for runtime transparency
