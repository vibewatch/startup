- id: limitations-and-underwriting-view
  title: Limitations and underwriting view
  body: 'The central product risk is portability plus ceiling depth. Framer''s own help center is explicit that websites cannot
    be exported to HTML for self-hosting because backend services such as pre-rendering, dynamic image resizing, and font
    subsetting are part of the runtime. That makes the integrated stack powerful, but it also means buyer value has to outweigh
    lock-in. Independent reviews converge on the same boundary condition: Framer is strongest for design-led marketing sites
    and weaker for native ecommerce, app-like workflows, or very large content operations. Even Framer''s own compare page
    frames the trade-off as speed and lower operational overhead on one side versus deeper developer surfaces in Webflow on
    the other. From an underwriting perspective, the product looks complete and differentiated enough to support a premium
    marketing-web thesis. The biggest diligence asks are not whether the bundle exists, but how it behaves at scale: actual
    uptime performance, enterprise support SLAs, extension governance, and where the CMS starts to break compared with headless
    or open-ecosystem alternatives.'
  claimRefs:
