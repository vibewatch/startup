- id: extensibility-ai-and-motion-lineage
  title: Extensibility, AI, and Motion lineage
  body: 'Framer is more technically extensible than a pure template-led builder, but its extensibility is curated rather than
    open-ended. The developer surface explicitly centers on standard React and JavaScript, with code components, overrides,
    plugins, and Fetch as the main extension points. In practice, that means custom logic can be layered into a managed Framer
    workflow instead of forcing teams to leave the platform for every special case. Framer AI broadens the same thesis: Wireframer
    creates first drafts, Workshop helps construct richer components, AI Translate expands localization, and AI Plugins connect
    external model providers for copy, image, and alt-text generation. The Motion lineage matters because it shows Framer
    still has a real bridge into the front-end developer ecosystem. Motion is not just marketing gloss; its public docs and
    npm package describe an actively maintained React and JavaScript animation engine with a direct historical tie back to
    Framer Motion. That lineage helps explain why Framer can market advanced motion and polished interactions as a core differentiator
    rather than as a thin wrapper around templates.'
  claimRefs:
