    - Need uptime SLA, incident history, and precise support terms
  - - Developer surface and marketplace
    - Technical designer / front-end engineer
    - Useful but curated
    - React code components, overrides, Fetch, plugins, marketplace assets
    - React/JS expertise and plugin review workflow
    - Need plugin adoption metrics, rate limits, and security review detail
