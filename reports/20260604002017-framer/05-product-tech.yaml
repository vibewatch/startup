- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Framer solution
  - Measurable / visible benefit
  - Limitation
  rows:
  - - Launch a branded marketing site
    - Prompt or design pages, style breakpoints, publish on managed hosting
    - Wireframer plus visual canvas plus one-click publish
    - Faster path from concept to live site without handoff-heavy front-end work
    - Still optimized for websites rather than app-grade product surfaces
  - - Keep marketing content fresh
    - Edit copy or CMS entries, review on canvas, publish updates
    - CMS with visual editing, collections, filtering, references
    - Content team can update pages without rebuilding layouts
    - Boundary for very complex content models is not publicly documented
  - - Run CRO experiments
    - Track traffic, launch tests, inspect funnels and clicks
    - Integrated analytics with A/B testing and funnel tools
    - Removes dependency on a separate analytics stack for basic experimentation
    - No public detail on statistical methodology or retention settings
  - - Capture demand and route leads
    - Collect submissions and push them into operations systems
    - Forms with email, Sheets, webhook, and Zapier pathways
    - Lead capture stays inside same site-building tool
    - Spam and abuse controls are described but not benchmarked publicly
  - - Localize a global site
    - Add locales, translate content, publish per locale
    - Localization controls with AI translation and CMS support
    - Simplifies international publishing inside same stack
    - Need proof for large-scale localization governance across many teams
  - - Add custom behavior
    - Bring in React components, overrides, plugin logic, or API endpoints
    - Code Components, Overrides, Plugins, Fetch
    - Lets technical designers bridge gaps without abandoning Framer
    - Still narrower than an open codebase or headless architecture
  notes: Benefits are expressed in workflow terms; limitations reflect independent reviews and missing operational transparency.
