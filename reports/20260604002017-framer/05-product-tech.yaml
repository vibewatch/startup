  evidenceGaps:
  - type: missing-source
    severity: material
    topic: uptime-transparency
    missingEvidence: A public uptime SLA, incident-history dataset, or customer-visible status archive for Framer hosting.
    whyItMatters: Hosting and security claims are central to the product thesis, but investors cannot independently benchmark
      reliability without quantitative service-history evidence.
    diligencePath: Request the last 12 months of uptime reports, any contractual SLA schedules, and incident postmortems or
      status-page exports.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: ecosystem-depth
    missingEvidence: Plugin adoption counts, marketplace breadth metrics, API quota documentation, and review-governance detail
      for the extension ecosystem.
    whyItMatters: Framer now markets plugins and developer surfaces as part of the product, so ecosystem health directly affects
      whether customers can stay inside the platform as requirements expand.
    diligencePath: Request marketplace GMV or active-vendor counts, top plugin install numbers, API rate-limit docs, and the
      security review rubric for plugins and Fetch endpoints.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE001
    - TE003
  - type: private-evidence-only
    severity: material
    topic: enterprise-support
    missingEvidence: Detailed onboarding timelines, migration staffing, response SLAs, and rollback entitlements for enterprise
      buyers.
    whyItMatters: Feature parity is only part of enterprise product readiness; support quality and migration execution often
      determine whether a managed platform can replace an incumbent stack.
    diligencePath: Ask sales for implementation playbooks, named support models, escalation paths, and sample order forms
      or MSAs covering support commitments.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE004
    - TE005
  - type: private-evidence-only
    severity: material
    topic: complex-content-boundaries
    missingEvidence: Reference customers showing where Framer's CMS succeeds or fails for high-volume multilingual content,
      deep taxonomies, and complex editorial workflows.
    whyItMatters: Independent reviews identify this as the main ceiling versus WordPress, Webflow, and headless platforms,
      but public first-party pages do not define the operational boundary clearly.
    diligencePath: Request case studies for 100K-item deployments, multi-locale governance patterns, and migration references
      from Webflow, WordPress, or Contentful customers.
    relatedQuestionRefs:
    - QE020
    - QE022
    relatedTableRefs:
    - TE001
    - TE005
