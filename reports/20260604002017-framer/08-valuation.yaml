  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-terms
    missingEvidence: A full Series D term sheet or counsel summary showing liquidation preferences, any secondary component, governance rights, and investor protections.
    whyItMatters: Headline post-money valuation can materially overstate what new capital actually buys if preferences or secondary content are heavy.
    diligencePath: Request financing documents or a legal summary from management and lead counsel.
    relatedQuestionRefs:
    - QV024
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-cashflow
    missingEvidence: Gross margin, hosting-cost burden, support-cost structure, and cash-conversion detail by the latest fiscal period.
    whyItMatters: Without economics quality, it is difficult to judge whether Framer deserves a premium software multiple or only a premium growth story.
    diligencePath: Request audited management financials and detailed operating KPI schedules.
    relatedQuestionRefs:
    - QV025
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: retention-and-churn
    missingEvidence: NRR, GRR, logo churn, and cohort retention by plan tier and customer segment.
    whyItMatters: Premium ARR multiples require confidence that revenue persists and expands efficiently after acquisition.
    diligencePath: Request cohort tables by vintage, plan, and ACV band, plus a churn bridge.
    relatedQuestionRefs:
    - QV026
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: arr-mix
    missingEvidence: ARR split across self-serve, business, and enterprise cohorts with ACV and contract-length detail.
    whyItMatters: The valuation depends heavily on whether Framer is maturing into higher-quality enterprise revenue or still leaning on lower-ARPU volume.
    diligencePath: Request plan-tier revenue mix, contract length distribution, and top-account ACVs.
    relatedQuestionRefs:
    - QV027
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: minor
    topic: current-private-peer-metrics
    missingEvidence: A cleaner 2026 public disclosure set for Webflow or Contentful revenue quality and current valuation rather than older funding headlines.
    whyItMatters: Private reference marks are useful for framing upside but weaker than current public comparables for setting entry price.
    diligencePath: Refresh private-peer fundraising and disclosure research before the next report revision.
    relatedQuestionRefs:
    - QV023
    relatedTableRefs:
    - TV004
