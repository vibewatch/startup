- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric used
  - Multiple / valuation
  - Relevance to Framer
  - Main limitation
  rows:
  - - Wix
    - June 2026 market cap vs 2025 revenue
    - $2.30B market cap / $1.99B revenue = ~1.2x
    - Direct public website-builder reference with full disclosure cadence.
    - Mature public company with slower growth than Framer.
  - - Squarespace
    - 2024 take-private EV vs 2023 revenue
    - $6.9B announced EV on $1.012B revenue = ~6.8x
    - Design-led website platform with disclosed revenue and a recent control transaction.
    - Take-private value is not the same as a live 2026 public multiple.
  - - Shopify
    - June 2026 market cap vs TTM revenue
    - $146.55B market cap / $12.36B TTM revenue = ~11.9x
    - Shows what a scaled, category-defining commerce platform can command in public markets.
    - Broader commerce OS, not a pure website-platform peer.
  - - Webflow
    - 2022 Series C valuation vs near-term ARR
    - $4B valuation as ARR approached $100M = ~40x ARR
    - Closest late-stage no-code website-platform private funding reference.
    - 2022 was a much hotter funding market than 2026.
  - - Contentful
    - 2021 Series F headline valuation
    - $3B private valuation headline
    - Useful upmarket content-platform reference for enterprise software appetite.
    - Retained sources do not disclose revenue, so no clean multiple is available.
  - - Figma / Adobe deal
    - 2022 announced transaction vs exit ARR
    - $20B announced value on >$400M ARR = ~50x ARR
    - Shows the upside investors paid for category-leading design software with elite retention.
    - Strategic design-platform reference, not a direct website-platform comp.
  notes: This enumeration is exhaustive for the six comp families explicitly requested in the chapter brief; rows mix current public multiples with older private or strategic marks, so the relevance and limitation columns matter as much as the raw numbers.
