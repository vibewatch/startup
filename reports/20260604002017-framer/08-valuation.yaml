- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - ARR execution miss
    - Management cannot credibly support the path from $50M ARR toward $100M ARR.
    - Breaks the main argument that Framer can grow into today's forward multiple.
    - Move from Track to Avoid unless price or terms reset materially.
  - - Profitability reversal
    - Break-even narrative fades and burn reappears before enterprise durability is proven.
    - Raises the chance that the next financing is defensive rather than optional.
    - Pause diligence until cash runway and funding plan are explicit.
  - - Financing reset
    - New capital is raised at or below the current mark without clearly better quality metrics.
    - Signals that private markets do not support the Series D narrative.
    - Treat as a valuation reset and rebuild the model from the new terms.
  - - Comp compression
    - Public software and web-platform multiples fall further from the retained June 2026 range.
    - Reduces ceiling for a premium private multiple even if Framer executes operationally.
    - Lower acceptable entry price and widen downside band.
  - - Enterprise-fit slippage
    - Large customers consistently prefer more open or structured alternatives on portability, governance, or content complexity.
    - Undermines the enterprise-upside case that justifies premium valuation.
    - Re-rate Framer closer to builder comps than to premium workflow software.
  notes: Triggers are stated in monitorable operating or financing terms so the investment committee can react before a down-round or strategic stall is obvious in hindsight.
  claimRefs:
  - CV045
  - CV046
  - CV047
  - CV048
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - ARR mix
    - ARR by self-serve, business, and enterprise cohorts plus ACV distribution.
    - Determines whether the current premium is being earned by durable higher-value customers or by broad lower-ARPU adoption.
    - Request management cohort bridge and plan-tier revenue mix.
  - - Retention
    - NRR, GRR, logo churn, and churn by cohort or plan.
    - Premium software multiples are hard to defend without evidence that revenue compounds efficiently.
    - Request cohort tables by vintage and customer tier.
  - - Economics quality
    - Gross margin, hosting cost burden, support cost, and cash conversion.
    - Separates a premium software asset from a growth story with weak unit economics.
    - Request audited management financials and hosting-cost trend.
  - - Round terms
    - Preference stack, secondary content in the Series D, governance rights, and any pay-to-play or ratchet features.
    - Headline post-money valuation can overstate what new money is actually buying.
    - Request financing docs or counsel summary of rights.
  - - Enterprise proof
    - Named customer ACVs, contract length, renewal history, and win/loss reasons against Webflow and open stacks.
    - Tests whether the enterprise thesis is real enough to support a premium multiple.
    - Request top-account pack and pipeline conversion analysis.
  notes: Each ask is tied directly to a valuation uncertainty rather than to generic curiosity; clearing even two or three of these items could move the recommendation meaningfully.
