  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Why
  - Decision implication
  rows:
  - - Recommendation
    - Track
    - The company looks high quality, but the current private mark already prices in strong execution.
    - Keep active coverage, but avoid underwriting upside from the current mark without more disclosure or a better entry point.
  - - Confidence
    - Medium
    - Headline traction is real, but the key valuation drivers beneath it remain private.
    - Do not treat the recommendation as a high-conviction valuation call until management data fills the gaps.
  - - Risk rating
    - High
    - The company is not distressed, but downside asymmetry is elevated because the mark sits well above public web-platform comps.
    - Require explicit kill criteria and post-round monitoring if diligence continues.
  - - Valuation stance
    - Stretched
    - ~40x current ARR and ~20x forward ARR are premium levels for a company with private retention and margin data.
    - Entry discipline matters more than company-quality admiration.
  - - What would improve the view
    - More disclosure or a better price
    - NRR, gross margin, enterprise mix, and clean round terms could justify a higher-quality multiple.
    - A follow-on diligence cycle could move the stance from stretched toward fair if data is strong.
  notes: 'This table is intentionally price-sensitive: recommendation and stance are driven by the retained comp set and by what remains private, not by product quality alone.'
