- id: scenario-underwriting-and-recommendation
  title: Scenario underwriting and recommendation
  body: |
    Framer's bull case is straightforward to articulate. If the company's business-customer shift is real, if enterprise plans convert into materially larger ACVs, and if the team preserves its break-even posture while scaling toward or beyond $100 million of ARR, then the current valuation can be defended as a forward premium on category leadership. In that world, Framer is not “just another website builder”; it becomes a design-led operating layer for professional websites with credible enterprise monetization.

    The base case is more conservative. Framer can still be a strong company and still be a stretched entry. If ARR grows meaningfully but settles below the publicized aspirational path, or if the market stops rewarding premium design and no-code stories like 2021-2022, the valuation logic drifts back toward the upper half of public web and software comps rather than the private-market peaks represented by Webflow and Figma. That still leaves meaningful enterprise value, but not necessarily upside from a $2 billion starting mark.

    The bear case is a transmission story from product and disclosure gaps into multiple compression. Portability concerns, CMS ceilings, or slower enterprise adoption would reduce willingness to underwrite a premium multiple. Because Framer already sits above retained public web-platform comps, any miss on growth or quality would likely compress value faster than the company could grow into the mark. That asymmetry is why the chapter lands on Track rather than Buy.
