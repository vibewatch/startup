- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Current view
  - What would change the view
  rows:
  - - Design-led premium thesis
    - Framer has enough product quality and growth momentum to deserve a premium to slower or more mature website peers.
    - Sustained enterprise ACV proof and retention disclosure would strengthen this thesis materially.
  - - Execution anti-thesis
    - At $2 billion, much of the obvious upside may already be prepaid before cohort quality is proven.
    - A materially lower entry price or exceptional disclosed unit economics would weaken the anti-thesis.
  - - Market-structure thesis
    - The gap between design-led execution and developer-heavy workflows is still valuable for marketing teams.
    - If Webflow, Wix Studio, or open stacks erase the workflow advantage, premium support weakens quickly.
  - - Lock-in anti-thesis
    - No-export architecture can support retention but also creates procurement friction for sophisticated buyers.
    - If management shows that large customers accept lock-in because Framer wins on speed and governance, the risk moderates.
  - - Public-comp thesis
    - Public comps show Framer does not need Shopify-like scale to justify a solid business.
    - They do not show a clear reason for Framer to sit far above the public web-comp range today.
  - - Disclosure anti-thesis
    - Missing NRR, gross margin, cap-table, and ARR-mix data block a higher-conviction buy call.
    - Clean management disclosure on those items is the shortest path to changing the rating.
  notes: Rows pair the investment thesis with the exact evidence or disclosure that would change the call rather than treating conviction as static.
