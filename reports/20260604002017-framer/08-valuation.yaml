- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Valuation logic
  - Implied value
  - Probability signal
  rows:
  - - Bull
    - Framer reaches or exceeds $100M ARR, preserves break-even, and proves enterprise ACV expansion.
    - 22x-28x forward ARR, still below Figma-like strategic premiums but supportive of a premium private mark.
    - $2.2B-$2.8B
    - Needs evidence that business-majority customer mix is converting into durable enterprise revenue.
  - - Base
    - Framer grows meaningfully but below the clean premium narrative, with ongoing disclosure gaps around retention and margins.
    - 14x-18x ARR on an $80M-$90M operating base, closer to premium public software ranges than to 2022 private peaks.
    - $1.1B-$1.6B
    - Most consistent with current public-comp evidence and limited private disclosure.
  - - Bear
    - Growth stalls near current ARR levels or procurement friction around lock-in/CMS fit reduces enterprise conversion.
    - 8x-12x revenue/ARR framing, closer to normalized public-web multiples plus private discount.
    - $0.6B-$1.0B
    - Triggered by missed ARR path, renewed financing need, or worsening public-comp multiples.
  notes: Scenario values are valuation ranges, not management forecasts; they anchor on retained public comps, private reference marks, and the explicit uncertainty around Framer's undisclosed revenue mix.
