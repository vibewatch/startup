- id: gaps-and-final-diligence-asks
  title: What remains private and what would change the call
  body: |
    The central diligence gap is not a missing customer logo or a missing fundraising headline. It is the absence of the metrics that turn a growth story into a defensible entry price. Public materials do not disclose Framer's retention profile, gross margins, cash conversion, ARR mix by plan tier, or round terms such as liquidation preferences and secondary content. That makes it impossible to test whether the company deserves to trade like an outlier software platform or whether the current mark already assumes a best-case monetization path.

    These omissions matter because Framer's current valuation already embeds optimistic execution. A buyer can get comfortable that the company has meaningful product quality, startup pull, and enterprise ambition. What the buyer cannot yet get comfortable with from public evidence is the durability of that revenue, the profitability of scaling it, and the exact contractual rights sitting ahead of new money.

    The practical implication is that the recommendation can improve without the company changing much operationally. If management discloses cohort retention, gross-margin quality, enterprise ACV mix, and clean cap-table terms—and if those disclosures show that the business really is growing into a high-teens or low-twenties forward ARR multiple—then today's stretched mark could move toward fair. Until then, the right move is disciplined monitoring rather than aggressive entry.
