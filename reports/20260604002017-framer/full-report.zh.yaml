  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模
        blocks:
          - type: paragraph
            body: >-
              Framer 处在一个层叠市场里，不是单一、边界干净的类别。最窄的镜头是「网站构建软件」，Custom Market Insights、Global Growth Insights
              等发布方把市场规模定在低个位数十亿美元。最宽的镜头是低代码和无代码开发工具，IDC、Precedence Research 和 MarketsandMarkets
              的口径落在数百亿美元。两种框架都相关，但都不能完全映射 Framer。网站构建工具视角覆盖 Framer
              的直接替代品——Wix、Squarespace、WordPress.com、Webflow，以及其他无需大量工程投入即可发布和运营网站的工具。更宽的无代码 / 低代码视角也重要，因为 AI
              辅助建站、模板、工作流和非技术生产，正越来越多地与应用构建工具、内容平台和开发者效率工具重叠。


              这种分层框架解释了为什么公开估算分歧很大。Custom Market Insights 把网站构建工具市场定为 2025 年 $2.8B、2035 年 $5.5B；Reanin 则把同一标签放在 2025 年超过
              $10B。这些数字并非直接矛盾，而是口径不同：有些发布方指纯 DIY 建站工具，另一些则纳入更多线上存在栈。更宽的低代码数据还要大得多，IDC 估算 2026 年低代码开发平台为
              $21.0B，Precedence Research 对 2026 年低代码开发平台的估算为 $15.81B。


              尽调中正确的结论，不是选一个 TAM 标题就结束。Framer 的真实市场位于狭义 DIY 建站工具和完整低代码宇宙之间：为需要速度、质感和治理、但不想搭建定制栈的团队，提供高级、专业管理的网站。
                      
