              Framer 跨过了具名客户证明门槛，因为保留下来的来源不只是 logo。官方案例页面显示：Perplexity 几乎 所有面向公众的营销页面都跑在 Framer 上；Miro 用 Framer
              独立发布，并带本地化和自定义 CMS 插件；Bilt 扩展了未登录体验的设计系统和落地页；Cal.com 把整个网站迁到 Framer；Mixpanel 把大多数站点改动转给设计
              和营销。这些都是生产使用描述，不是含糊推荐语；其中几家还给出更快上线、降低开发者依赖或扩大页面归属权等 具体工作流结果。

              更广的采用轨迹也看得见。Framer 自己的 Series D 文章称，平台每月用户超过 50 万，最近一届 Y Combinator 中接近一半用 Framer 上线。Business Wire 也佐证了 50
              万月活用户、数十万个活跃网站、新客户多数来自企业， 以及最近 YC 批次 40% 使用 Framer。关键限制是证据深度不均。Perplexity、Miro、Bilt、Cal.com 和 Mixpanel
              有直接案例页面；Scale AI 出现在官方融资材料里，但这个来源集中没有检索到专门案例研究。所以，Framer 的证据足以证明真实生产采用，但公开细节还不足以给每个具名 logo 同等证据权重。
