companyProfile:
  summary: >-
    Framer 是一家在阿姆斯特丹创立、设计驱动的软件公司，正在为专业团队打造托管式网站平台。公司从原型工具起步，后来转向直接发布网站，如今销售的是一套打包工作流：设计画布、CMS、分析、AI 辅助创作、协作和企业安全。2025
    年公开披露显示，Framer 月活用户超过 50 万，活跃站点达数十万，完成 $100M Series D、估值 $2B，并据称运营已达到收支平衡。
