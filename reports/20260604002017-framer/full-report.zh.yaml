chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、定位与产品范围
        blocks:
          - type: paragraph
            body: >-
              Framer 如今把自己定位为「设计师喜爱的」网站构建工具，但它描述的产品早已不只是简单的拖拽式建站器。官网、Series D 文章、Product Hunt
              页面和开发者文档指向同一套卖点：设计师和营销人员可以直接在 Framer 里发布完整网站，不必把工作交给前端团队；技术用户需要时仍可用 React 和 JavaScript
              扩展体验。这个混合定位很关键，因为它解释了 Framer 为什么落在 Wix、Squarespace 等经典模板式建站工具，与 Webflow 这类更偏开发者的工具之间。


              官方材料也说清楚，Framer 卖的是托管式 SaaS 工作流，而不是可下载的设计工具。定价 FAQ 把自定义域名绑定到付费计划；免费计划则作为产品驱动漏斗，并设置 CMS、页面和编辑者上限。公司自己的
              Series D 叙事把 Framer 描述为团队可以「运营整个 .com」的地方，而不只是做一个原型。它重点强调的打包功能——CMS、分析、A/B 测试、漏斗追踪、实时协作、AI
              功能和企业安全——进一步说明，公司如今争夺的是营销和品牌网站的运营层。


              仍需保留的限制是，Framer 的公开定位由公司自己撰写，因此更具方向性，不是中立证据。独立评测大体认可 Framer
              擅长设计感强的营销网站，但也指出它更适合品牌站，而不是复杂电商或重数据库场景。因此，概览章节的核心结论很直接：Framer
              的身份已从设计软件成熟为生产级网站平台，但差异化仍取决于它能否守住最初吸引用户的设计优先工作流。
                      
