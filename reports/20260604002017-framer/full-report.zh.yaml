  - id: TI002
    title: 定价 / 变现表
    columns:
      - 产品或同行
      - 价格或合同
      - 标价 vs. 实现价格
      - 包含能力
      - 折扣或未知项
      - 含义
    rows:
      - - Framer Basic
        - $10/月，年付
        - 标价
        - 自定义域名、AI 设计工具、托管、SEO；额外编辑器另行计费
        - 官方页面未披露月付价格、折扣和席位挂载情况
        - 面向认真做个人网站和小企业网站的低摩擦入口
      - - Framer Pro
        - $30/月，年付
        - 标价
        - 角色和权限、关系型 CMS、重定向，以及 A/B 测试、语言区域和高级托管等付费附加项
        - 实现价格和切入企业的临界点为私有信息
        - 成长型专业网站的主要增购层级
      - - Framer Scale
        - $100/月，年付，另加用量
        - 标价 + 计量用量
        - 高级 CDN、事件和漏斗、弹性限制、优先支持、自定义语言区域
        - 用量组合和实际 ARPU 为私有信息
        - 提示更高价值队列，但也意味着更高基础设施暴露
      - - Framer 席位和附加项
        - $20 额外编辑器、$10 内容编辑器、每个语言区域 $20、超出方案限制的用量包
        - 标价
        - 现有网站内的人员扩张和功能扩张
        - 挂载率和折扣未知；有效支出可能超过头部方案价格
        - 显示无需售出新网站也能扩张 ARPU 的路径
      - - Webflow
        - 免费、$15/月 Basic、$25/月 Premium、$2,500 年付 Team、Enterprise 定制
        - 标价
        - CMS、代码组件、本地化、治理和企业安全随方案层级扩展
        - 企业实现价格为私有信息
        - 专业网站团队最接近的直接定价基准
      - - Shopify
        - $29/月 Basic、$79/月 Grow、$299/月 Advanced，Plus 起价 $2,300/月，另有银行卡费率和 POS 变现
        - 标价
        - 电商栈、支付费率、员工账号限制、POS 附加项和 Plus 企业控制
        - 商户解决方案抽成让实现收入在结构上不同于 Framer
        - 有助于对照，因为 Shopify 同时变现软件访问和交易流
      - - Wix / Squarespace
        - 公开层级阶梯可见，但抓取页面没有披露稳定、全球可比的 USD 方案数字
        - 标价可见度不完整
        - Wix 显示 Free/Light/Core/Business Elite；Squarespace 显示年付 vs. 月付计费、14 天试用和促销驱动包装
        - 价格随地区或动态渲染而变，稳定的 USD 对比仍不完整
        - 确认 Framer 在拥挤的阶梯化市场竞争，但不能证明公开价格点可直接同口径比较
    notes: 选取的可比公司行强调与 Framer 投资判断最相关的直接公开定价界面，而不是每一种可能的网站建设器方案。
