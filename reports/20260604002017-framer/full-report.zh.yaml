      - number: '4.5'
        title: 上市可比、披露不对称与最终承销判断
        blocks:
          - type: paragraph
            body: >-
              解读 Framer 公开经济性的最干净方式，是把它与相邻平台比较披露深度，而不只是比较标题增长。Wix 披露季度预订额、收入、部分 ARR、毛利率说明和资本回报计划。Squarespace
              私有化前披露分部收入、ARRR、订阅数、债务和自由现金流。Shopify 则在巨大规模下完整拆分订阅解决方案和商家解决方案、毛利、GMV 与自由现金流。即便 Webflow
              仍是私营公司，也有第三方收入和客户估算，至少能让投资人三角定位规模。


              Framer
              没有给出这种可见度。它提供的信息足以支持正面的定性判断：真实的免费到付费漏斗、经常性定价、企业客户动能、可信的收支平衡表述，以及近期大额融资。但本章的核心财务结论仍有条件。若企业采用、留存和利润率更像优秀软件可比公司，而不是更重基础设施或更易
              SMB 流失的公司，Framer 最终可能配得上溢价倍数。公开记录还无法证明这一点。因此，投资人应把 Framer
              视为订阅驱动的托管网站平台：经济性有希望，但披露不足；在承销估值信心前，应把现金、烧钱情况、实际成交价、留存和利润率拆解设为硬尽调门槛。
