  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 为什么可信
      - 缓释方式 / 尽调问题
    rows:
      - - 设计师级速度与控制力
        - Webflow 和 Wix Studio 正在向专业设计、协作和 AI 靠拢
        - 高
        - 直接产品界面显示，它们在治理、CMS 和设计工作流上重叠
        - 按细分市场和交易规模索取对 Webflow、Wix Studio 的赢单 / 输单数据
      - - 一体化托管工作流
        - 无法导出的架构会引发可携带性异议
        - 高
        - Framer 自己称网站不能导出为 HTML，独立评测也提示锁定效应
        - 测试有工程团队客户的流失原因、迁移障碍和扩张率
      - - 专业网站聚焦
        - 买方任务常会漂向应用逻辑、电商或无头内容
        - 高
        - Bubble、Shopify、Contentful 和 WordPress VIP 各自占住相邻任务，专业深度更强
        - 按核心待完成任务切分管线，不要用一套泛化 TAM 故事
      - - 快速 PLG 包装
        - Wix 和 Squarespace 仍保有大型自助漏斗，企业平台则继续上行
        - 中
        - 定价和装机基础证据显示，既有玩家把广覆盖与专业层级结合起来
        - 向管理层索取自助与企业队列的 CAC 和转化率
      - - 创业公司中的品牌动能
        - 装机基础巨头拥有更多生态信任和采购熟悉度
        - 中
        - WordPress、Shopify 和 Wix 的分发足迹都远大于 Framer
        - 量化企业参考客户密度，以及风投支持创业公司之外的客户集中度
      - - AI 与实验叙事
        - 品类语言正在快速商品化
        - 中
        - 多数直接同行现在都把 AI、本地化、优化或实验作为标准能力营销
        - 复核产品遥测，确认 Framer 是否仍在激活速度和发布速度上胜出
    notes: 本登记表把影响投资判断的竞争耐久性问题单独拎出，而不是罗列每一个功能缺口；每行都指向一个具体尽调跟进点。
