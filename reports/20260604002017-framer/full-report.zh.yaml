      - number: '1.4'
        title: 规模、足迹与客户信号
        blocks:
          - type: paragraph
            body: >-
              Framer 周围的公开运营信号强于多数欧洲私营 SaaS 公司。公司称，数十万个站点运行在 Framer 上，每月平台用户超过 50 万。公开 Series D 报道还给出具名客户——Scale
              AI、Perplexity、Miro 和 Bilt——并称最近一届 Y Combinator 中接近一半项目用 Framer 发布。合在一起看，Framer
              已不再是小众设计师工具；它已经嵌入风投支持初创公司的发布栈，并试图把这种初创公司可信度转化为更广的企业化打法。


              地理足迹也比公司阿姆斯特丹起源本身更大。Business Wire 和 Sifted
              都指向阿姆斯特丹根基，以及旧金山和巴塞罗那办公室；创始人信还感谢了纽约团队成员。这个模式符合一家把产品和文化留在荷兰根基附近、同时在美国建设更多客户侧能力的公司。


              员工数是仍然噪声很大的主要规模指标。LinkedIn 显示 51–200 人公司规模区间、742 个相关公开档案，以及超过 13 万关注者，但没有内部 HR 数据无法直接对齐。安全读法是：Framer
              已经达到足以支撑严肃市场拓展的规模；但在管理层给出更干净披露前，投资人仍应把准确员工数和职能结构视为未解决问题。
                      
