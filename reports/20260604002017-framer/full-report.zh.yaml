      - number: '3.2'
        title: 直接建站既有玩家：Webflow、Wix Studio 与 Squarespace
        blocks:
          - type: paragraph
            body: >-
              Webflow 是最明显的直接对手，因为它的公开产品表面与 Framer 的目标买家和用例高度重叠。它面向营销人员、设计师、开发者和代理商营销；称超过 300,000 个品牌使用平台；并重押治理、本地化、实验和
              CMS 深度。因此，对于想要自定义设计、但不走传统代码交接的企业网站团队，Webflow 是最清晰的对标对象。它在对采购买家讲 ROI、安全集成、本地化和客户成功时，也比 Framer 更成熟。


              Wix 是更复杂的威胁，因为它横跨大众 DIY 和专业生产。核心 Wix 定价和 IR 页面仍面向庞大自助用户群，但 Wix Studio 明确为参与客户或企业项目的设计师、开发者和营销人员打造。自定义
              CSS、代码、共享内容、SSO 和多站点表述，意味着它可以追逐许多与 Framer 相同的代理商和企业机会，同时还享有大得多的分发。


              Squarespace 的意义不同。Permira 私有化交易确认它仍是有规模、具战略价值的平台，但检索到的产品表面仍更偏创业者、服务业企业和通用线上存在，而不是 Framer、Webflow、Wix
              Studio、Contentful 和 WordPress VIP 最用力推动的受治理企业网站打法。
