      - number: '2.2'
        title: 买家、用户和付费方细分
        blocks:
          - type: paragraph
            body: >-
              网站构建工具的买家地图，已经远超「小企业主做宣传册网站」的旧刻板印象。公开 SMB 调查仍显示该市场关键——Clutch 称 83% 小企业已有网站，Network Solutions 称 73%
              美国小企业已有网站——但品类已经分层。Framer 自身定位面向发布品牌网站的设计师和营销人员。Webflow 明确面向营销、创意、工程和代理团队。Wix 则把栈拆成大众市场 Wix，以及面向代理商和企业的更专业
              Wix Studio。与此同时，Ghost 服务出版方，Shopify 服务以电商为核心的商家，Bubble 服务无代码应用构建者，Contentful 服务企业内容团队。


              这种细分重要，因为买家、用户和付费方并不总是同一个人。在 SMB
              自助层，老板往往同时承担三种角色。初创公司营销团队里，用户可能是设计师或营销人员，付费方则是部门负责人或创始人。企业网站团队中，采购转向营销领导、数字体验团队，或集中 IT
              批准预算；他们更强调权限、治理、本地化和集成，而不是单纯上线速度。代理商处在中间：他们关心协作、可复制性、客户交接和多站点管理。


              Framer 最相关的机会看起来在这条光谱的高级中段。它不是要与 Bubble 争全应用逻辑，也不是与 Shopify
              争深度电商运营。它争的是团队分配给品牌网站、营销活动落地页和内容丰富营销界面的预算：这些界面需要看起来像定制开发，却不能吃掉稀缺开发时间。
                      
