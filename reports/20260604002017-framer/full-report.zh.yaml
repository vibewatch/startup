  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 单位
      - 当前数值或状态
      - 质量
      - 尽调问题
    rows:
      - - 免费方案漏斗
        - 产品驱动获客，不直接产生收入
        - 工作区 / 网站
        - 免费方案包含 CMS、页面、语言区域和编辑器限制；自定义域名需要升级
        - 中：顶部漏斗信号强，但本身不变现
        - 索取按队列划分的免费转付费转化率和首次付费时间
      - - 付费网站方案
        - 经常性网站订阅
        - 按网站方案
        - Basic 年付 $10/月，Pro $30/月，Scale $100/月加用量，Enterprise 定制
        - 高：标价透明，且结构为经常性
        - 索取按方案划分的 ARR、月付与年付组合、以及价格实现情况
      - - 编辑器和内容编辑器席位
        - 付费工作区内的席位扩张
        - 按编辑器
        - 额外编辑器单独计价，内容编辑器也有明确公开定价
        - 中高：初始网站转化后有清晰增购路径
        - 索取按工作区队列划分的席位挂载率和扩张收入
      - - 用量附加项
        - 高复杂度网站上的计量扩张
        - 按语言区域 / 事件 / 容量包
        - 语言区域、分析事件、高级托管、页面、CMS 条目和带宽都可超过基础方案限制继续扩展
        - 中：经常性，但绑定基础设施用量和产品深度
        - 索取附加项贡献的 ARR 占比，以及按附加项家族划分的毛利率
      - - Scale 方案超额用量
        - 订阅 + 可变基础设施支出
        - 按用量增量
        - Scale 仅支持年付，并加入高级 CDN、事件和漏斗、弹性限制、优先支持
        - 中：可能抬高 ARPU，但也抬高交付成本敏感度
        - 索取超额用量发生率、平均超额账单，以及高流量队列的毛利
      - - 企业合同
        - 报价驱动的谈判套餐
        - 合同 / 网站资产组
        - 自定义限制、企业安全和专属支持都走联系销售采购
        - 潜在质量高，但公开条款不透明
        - 索取 ACV、合同期限、续约率、折扣和实施负担
    notes: 本表穷尽了目前明确公开的变现界面，但无法量化各收入流贡献的收入占比。
