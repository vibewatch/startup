      - number: '1.5'
        title: 里程碑、转向时间线与第一批可见风险
        blocks:
          - type: paragraph
            body: >-
              Framer 最强的里程碑叙事不只是「设计工具变成独角兽」，而是公司反复扩大设计师可控制的范围。Framer 前的 Sofa
              退出建立了创始人可信度；早期原型产品让团队在设计组织内部拿到受尊重的切入口；后来转向直接网站发布，则攻击了一个更大的工作流问题：把设计重新用代码实现。到 Series D
              时，这一演进又扩展到分析、页面内编辑、企业安全，以及企业可以在 Framer 上运行完整网站栈的主张。


              这条强叙事里有两个未解问题。第一，公开创始时间线不一致。Sifted 说 2013 年，Tracxn 说 2014 年，Silicon Canals 描述原始原型产品时说 2015
              年。可能解释是，不同来源锚定的是注册成立、首次融资或产品发布，而不是同一事件；但差异真实存在，应保留而不是抹平。


              第二，Framer 的设计驱动集成带来可见锁定效应。帮助中心明确说，Framer 站点不能导出 HTML 自行托管，因为它们依赖预渲染、动态资产优化等后端服务。独立评测也强化了这一点：Framer
              因速度、美感和上线容易受到称赞，但在复杂电商或重数据库场景中匹配度弱。这不否定公司的动能，但为报告其余部分提出了主战略问题：买家究竟有多看重集成工作流，相比之下又愿意承受多少可迁移性损失。
                      
