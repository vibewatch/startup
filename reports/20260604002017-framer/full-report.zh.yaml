      - number: '4.3'
        title: 成本结构、利润率驱动与单位经济可见度
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Framer
              的毛利率潜力应好于按交易抽成的电商平台，但达不到纯协作设计工具近乎零边际成本的特征。它的套餐包含安全托管、SEO、分析、CMS、本地化和协作；公司也明确说，生产网站依赖预渲染、图片缩放和字体子集化等后端服务。Scale
              和高级增购项会加入更多带宽、语言版本、事件、重写规则、安全标头和高级 CDN 容量。换句话说，Framer 卖的是经常性软件，但这个软件产品的交付经济性会实际暴露在流量、存储、AI 推理、分析事件和支持强度之下。


              这就是缺失私有指标重要的原因。公开材料能让我们推断货币化链条和部分成本驱动，却看不到真实毛利率拆解。公开披露中没有毛利率、单站托管成本、AI 点数消耗、CAC、回本周期、流失率、NRR
              或销售效率。Goodspeed 的独立评测也强化了这一点：编辑者席位和增购项累积后，有效支出可能高于标题价格。因此，最安全的读法仍是方向性判断：相比 Shopify 这种交易更重的平台，Framer
              可能有更干净的经常性收入；但与 Wix 或 Squarespace 等上市同行相比，公开证据还不足以证明利润率耐久性。这让单位经济尽调成为信息问题，而不是纯产品质量问题。
