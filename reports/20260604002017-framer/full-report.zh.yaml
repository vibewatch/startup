  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局与真正比较对象
        blocks:
          - type: paragraph
            body: >-
              Framer 真正的竞争集合，不是一个单一的「网站构建工具」市场。按 Framer 2026 年销售的产品来看，最接近的正面对标是 Webflow 和 Wix
              Studio：三者都承诺，设计师和营销人员无需等待前端工程队列，就能发布专业网站；三者现在也都把 CMS、协作、权限、托管和 AI 打包营销。Squarespace
              仍然重要，因为它仍是规模大、注重设计的既有玩家；但公开证据包更像把它框定为面向创业者和服务业企业的精致套件，而不是功能扩张最激进的企业网站运营层。


              在直接圈外，替代集合按待完成任务分裂。真正需要应用逻辑和工作流深度的买家会被 Bubble 吸走。以电商为核心的品牌会被 Shopify 吸走。优先考虑开放架构、本地化、治理和可组合性的企业团队，会转向
              Contentful 和 WordPress VIP。Ghost 和 Cargo 更窄，但仍相关，因为它们用清晰产品—市场匹配解决具体子任务——会员 / 新闻简报和作品集网站。因此，Framer
              的风险是结构性的：买家优先级稍有变化，交易就可能被移入完全不同的产品类别。


              这种碎片化也是双刃剑。它保护 Framer 不被只按最长功能清单衡量，因为许多相邻工具优化的是不同结果。但这也意味着，Framer
              必须持续证明，设计驱动速度和网站工作流足够有价值，能压过竞争对手更大的生态、安装基础或企业采购舒适度。
