    title: 风险传导图
    type: dag
    layout: wide
    summary: 最大杀伤力的下行情景不是单一事件，而是一条链：AI 或定价压力削弱赢单率，继而压低留存，最终降低估值信心。
    data:
      nodes:
        - id: n1
          label: AI 商品化
          detail: 对手建站工具追上后，草稿生成领先幅度收窄。
        - id: n2
          label: 定价压力
          detail: 编辑器和套餐成本越来越难被证明合理。
        - id: n3
          label: 托管锁定顾虑
          detail: 采购中关于可迁移性的异议增加。
        - id: n4
          label: 企业转化摩擦
          detail: 交易放慢，或转向更开放的竞争对手。
        - id: n5
          label: 留存和扩展风险
          detail: 如果 ROI 证明和可靠性仍不透明，续约信心会走弱。
        - id: n6
          label: 估值压缩
          detail: 定价权和耐久性下降，会压低可支撑的倍数。
        - id: n7
          label: 合规事件
          detail: 违规处置或文件质量失误会伤害信任。
        - id: n8
          label: 支持负担
          detail: 摩擦增多会推高服务负载，拖慢响应。
      edges:
        - from: n1
          to: n2
          label: 工作流领先被侵蚀
        - from: n2
          to: n5
          label: 席位或套餐摩擦
        - from: n3
          to: n4
          label: 采购异议
        - from: n4
          to: n5
          label: 赢单更慢、续约更弱
        - from: n5
          to: n6
          label: 耐久性倍数下降
        - from: n7
          to: n4
          label: 尽调中的信任受损
        - from: n7
          to: n8
          label: 事件处理负载上升
        - from: n8
          to: n5
          label: 服务质量影响续约
        - from: n3
          to: n5
          label: 迁移顾虑拖慢扩展
    claimRefs:
      - CR023
      - CR025
      - CR029
      - CR037
      - CR040
      - CR042
      - CR043
      - CR044
      - CR048
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Framer 的运营模型依赖少数基础设施、生态、计费和获客伙伴；这些伙伴都会影响客户体验。
    data:
      nodes:
        - id: d1
          label: AWS
          detail: 在美国多 AZ 基础设施中托管核心服务。
        - id: d2
          label: Framer 控制平面
          detail: 掌握发布、计费规则、支持边界和运行时行为。
        - id: d3
          label: React 生态
          detail: 支撑代码组件和高级扩展性。
        - id: d4
          label: Paddle
          detail: 作为订单、退款和相关服务咨询的登记商户。
        - id: d5
          label: 代理伙伴
          detail: 推动转介绍、实施和客户交付。
        - id: d6
          label: YC 和创业公司漏斗
          detail: 带来早期采用和创始人可信度。
        - id: d7
          label: 客户
          detail: 直接感受 uptime、定价、支持和可迁移性的叠加影响。
      edges:
        - from: d1
          to: d2
          label: 基础设施依赖
        - from: d3
          to: d2
          label: 扩展依赖
        - from: d4
          to: d2
          label: 计费依赖
        - from: d5
          to: d7
          label: 实施和转介绍路径
        - from: d6
          to: d7
          label: 客户 logo 获取漏斗
        - from: d2
          to: d7
          label: 运行时、支持和定价
        - from: d1
          to: d7
          label: 可用性和数据驻留后果
        - from: d3
          to: d7
          label: 定制质量和维护
    claimRefs:
      - CR015
      - CR018
      - CR021
      - CR022
      - CR032
      - CR033
      - CR046
      - CR049
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 推荐逻辑从真实牵引力推到溢价定价，再因披露不足和下行不对称对溢价打折。
    data:
      nodes:
        - id: traction
          label: 牵引力存在
          detail: Series D、盈亏平衡信号和披露的 ARR 显示真实运营进展。
        - id: premium
          label: 溢价有合理性
          detail: 如果增长和企业客户结构保持强劲，Framer 可以相对增长较慢的上市网页平台同业拿到溢价。
        - id: comp-gap
          label: 可比公司差距仍大
          detail: 当前和远期隐含倍数仍高于保留的上市网页平台区间。
        - id: disclosure
          label: 披露缺口
          detail: 留存、利润率、结构和股权结构条款仍未公开。
        - id: asymmetry
          label: 下行不对称
          detail: 若 ARR 路径不达预期或倍数压缩，估值可能比收入增长更快重置。
        - id: call
          label: 建议
          detail: 观察：公司强，价格偏高，仍需尽调。
      edges:
        - from: traction
          to: premium
          label: 支撑
        - from: premium
          to: comp-gap
          label: 但无法抹平
        - from: comp-gap
          to: disclosure
          label: 在以下情况下更棘手
        - from: disclosure
          to: asymmetry
          label: 进而增加
        - from: asymmetry
          to: call
          label: 推动
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV041
      - CV042
      - CV043
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: Framer 当前和远期隐含倍数高于保留的上市网页平台可比公司，仅与早前高溢价私营设计 / no-code 估值标记有重叠。
    data:
      items:
        - label: Wix 收入倍数
          value: 1.2
          unit: x
        - label: Squarespace 私有化倍数
          value: 6.8
          unit: x
        - label: Shopify 收入倍数
          value: 11.9
          unit: x
        - label: Framer 在 $100M ARR 下的远期倍数
          value: 20
          unit: x
        - label: Framer 在 $50M ARR 下的当前倍数
          value: 40
          unit: x
        - label: Webflow 2022 Series C 隐含 ARR 倍数
          value: 40
          unit: x
        - label: Figma 2022 已宣布交易的隐含 ARR 倍数
          value: 50
          unit: x
    approximationNotes: 柱状图混合了收入倍数和 ARR 倍数，因为保留的私营参照披露 ARR，而上市可比公司披露收入；只能看方向，不能当作完全同口径指数。
    claimRefs:
      - CV014
      - CV020
      - CV024
      - CV026
      - CV031
      - CV035
      - CV036
      - CV034
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 情景结果显示，当前估值标记接近乐观情景的下沿，而不是基准情景的中点。
    data:
      items:
        - label: 悲观情景
          low: 0.6
          value: 0.8
          high: 1
          unit: $B
          claimRef: CV041
        - label: 基准情景
          low: 1.1
          value: 1.4
          high: 1.6
          unit: $B
          claimRef: CV040
        - label: 乐观情景
          low: 2.2
          value: 2.4
          high: 2.8
          unit: $B
          claimRef: CV039
    approximationNotes: 区间是基于保留的可比参照和情景假设推导的承销带，不是管理层预测或盯市价值。
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV043
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: Framer 在产品和增长证据上得分高，但在当前估值标记下，估值支撑和披露完整性偏弱。
    data:
      items:
        - label: 产品 / 工作流证据
          value: 8/10
          detail: 设计驱动的速度和客户拉力证据充分。
          tone: positive
        - label: 收入动能
          value: 8/10
          detail: $50M ARR 和 $100M 目标意味着强劲增长动能。
          tone: positive
        - label: 企业客户证据
          value: 6/10
          detail: 向 Business 客户迁移可见，但 ACV 和续约证据仍有限。
          tone: neutral
        - label: 留存可见度
          value: 3/10
          detail: 没有公开 NRR、GRR 或队列流失表。
          tone: warning
        - label: 经济性可见度
          value: 4/10
          detail: 盈亏平衡令人鼓舞，但缺少毛利率和现金转化细节。
          tone: warning
        - label: 估值支撑
          value: 4/10
          detail: 当前估值标记仍高于保留的上市网页平台可比区间。
          tone: warning
        - label: 下行不对称
          value: 4/10
          detail: 如果增长或上市公司倍数不及预期，估值可能迅速重置。
          tone: warning
    approximationNotes: 分数是面向 IC 的判断指标，由保留证据综合而来；不是统计模型。
    claimRefs:
      - CV037
      - CV038
      - CV042
      - CV043
      - CV044
      - CV045
      - CV047
