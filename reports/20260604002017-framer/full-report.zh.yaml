  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与进入价格纪律
        blocks:
          - type: paragraph
            body: >
              Framer 的估值章节从一个异常清晰的私募市场锚点出发：公司自身、TechCrunch 和 Business Wire 对 2025 年 8 月 Series D 核心条款说法一致。Framer 以 $2
              billion 估值融资 $100 million；TechCrunch 报道其 2025 年 ARR 为 $50 million，并称目标是在次年突破 $100
              million；公司和媒体材料都称这轮融资前业务已达到盈亏平衡。这对一家 私营 SaaS 公司是很强的运营叙事，也解释了为什么这轮融资不只是纯粹动量融资。


              问题不在于牵引力是否存在。问题在于核心估值标题已经嵌入了多少预期。在 $50 million 披露 ARR 上对应 $2 billion 估值，Framer 实际上约为当前 ARR 的
              40x。即便管理层达成公开讨论的 $100 million ARR 目标，这轮仍隐含 约 20x 前瞻 ARR。这是高溢价软件倍数，不是普通网站构建器倍数，容错空间很小。


              因此，进入价格纪律必须说清楚。Framer 可能因设计主导增长、企业动能和盈利运营状态而值得溢价，但公开材料仍没有 展示队列留存、毛利率或自助、商业客户与企业客户之间的收入结构。投资问题不是“Framer
              好不好？”， 而是“当前价格是否已经把大部分显而易见的上行都折进去了？”
