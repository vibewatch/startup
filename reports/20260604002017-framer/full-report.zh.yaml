      - number: '8.2'
        title: 可比框架：公开网页平台公司与高溢价私募参照
        blocks:
          - type: paragraph
            body: >
              可比公司集合给出的信息清晰但混合。一边是公开或完全披露的网页平台参照：按照保留下来的 2026 年 6 月市值数据， Wix 约为 1.2x 收入；Squarespace 2024 年私有化交易基于其披露的
              2023 年收入基数，约为 6.8x 到 7.1x 收入。 Shopify 是比 Framer 宽得多的电商操作系统，但仍约为 11.9x 收入。这个公开区间重要，因为它说明，
              面向网站的平台若没有异常增长或品类扩张，很难长期维持高溢价估值。


              另一边是高溢价私募或战略参照。Forbes 报道，Webflow 2022 年 Series C 在接近 $100 million ARR 时把公司估到 $4 billion，隐含约 40x ARR。Adobe
              宣布的 Figma 交易在预计 2022 ARR 超过 $400 million 的基础上隐含约 50x ARR，同时伴随一流留存和毛利率。Contentful 的 $3 billion Series F
              提供了另一个成长阶段软件参照，但没有披露 收入，无法推导干净倍数。


              正确结论不是机械平均这些估值锚。Webflow 和 Figma 说明，在强增长条件下，设计主导或 no-code 工作流可以拿到很高 倍数。公开可比公司说明，市场正常化后这些估值会快速压缩。Framer
              处在两者之间：增长故事强于 Wix 或 Squarespace， 但披露远少于 Shopify，也没有足够公开证据去主张类似 Figma 的质量溢价。
