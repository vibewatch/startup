        - 索取总烧钱、净烧钱、预算 vs. 实际，以及基准 / 下行情景下的现金跑道
      - - 债务或项目融资
        - 未发现公开披露
        - 低
        - 即便股权融资和收支平衡说法看起来健康，债务也会改变风险
        - 索取债务清单、契约包、租赁和任何供应商融资
      - - 下一轮触发因素
        - 公开信息未知
        - 低
        - 投资者需要知道下一次融资是战略性、机会性还是必需
        - 索取再次新股融资、老股流动性或 IPO 路径的明确触发因素
    notes: 本表刻意只间接引用公司概况中的融资时间线，重点放在前瞻资本充足性。
