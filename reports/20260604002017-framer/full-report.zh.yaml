      - number: '4.2'
        title: 免费到付费漏斗、GTM 动作与公开牵引
        blocks:
          - type: paragraph
            body: >-
              Framer 的漏斗足够可见，可以描述，但还不足以建模。免费计划给潜在客户足够空间去设计、尝试 CMS，并与最多 3
              位编辑者协作；一旦严肃公司网站需要自定义域名、更多编辑者、更大限制或更丰富运营，就会被推向付费转化。这让公开产品阶梯本身成为强信号：Framer
              的漏斗顶部是产品驱动；同时，企业页面和报价式层级也表明，当团队超过标准限制时，公司已准备支持销售辅助采购。


              围绕这个漏斗的牵引数据，对私营公司来说异常强。TechCrunch 报道 Framer 2025 年 ARR 为 $50M，2026 年目标为 $100M；Framer 和 Business Wire
              则称公司过去一年一直收支平衡，月活用户超过 50 万，并支撑数十万个站点。官方和独立报道还称，Business 套餐发布后，企业成为新客户多数；最近一届 Y Combinator 中 40% 项目用 Framer
              发布。合起来看，这些点说明免费的设计师采用正在转成业务使用，并且至少在表层转成了有意义的经常性收入。它们没有展示的是转化率、企业 ACV、回本周期、销售周期长度，以及自助和销售介入 GTM 的拆分。
