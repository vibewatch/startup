        blocks:
          - type: paragraph
            body: >-
              Framer 的公开可持续性证据有用，但是间接的。最好的代理指标不是队列表，而是具名客户落地后持续扩大 内部归属权。Perplexity 称几乎所有面向公众的营销页面都在 Framer；Bilt
              称平台从付费流量落地页扩到 首页，再扩到未登录体验的所有落地页；Cal.com 称整个网站现已在 Framer；Mixpanel 则称设计 和营销拥有 90% 的改动，并能在数小时内上线 A/B
              测试。这些都是先落地再扩张或嵌入式工作流信号， 即便它们没有披露续约率。

              社区和从业者证据同样有分歧，但总体偏建设性。Product Hunt 显示 254 条评价给出 4.8 分，并反复称赞速度、 设计质量、动画和类似 Figma 的工作流。但同一个 Product Hunt
              页面，以及 HostAdvice 和 Goodspeed，也 反复露出同样的摩擦：学习曲线比简单拖拽式建站工具更陡，面对更重内容模型时 CMS 深度有限，编辑席位增加后
              定价压力上升，边缘案例里还有支持或账单投诉。这些摩擦重要，因为它们划出了粘性设计主导网站平台与在复杂账号停滞 的工具之间的界线。Framer
