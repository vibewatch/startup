      - number: '8.4'
        title: 仍未公开的内容，以及什么会改变判断
        blocks:
          - type: paragraph
            body: >
              核心尽调缺口不是少一个客户 logo，也不是少一条融资头条。缺的是能把增长故事转成可防守入口价格的指标。公开材料没有 披露 Framer 的留存画像、毛利率、现金转化、按方案档位拆分的 ARR
              结构，或清算优先权和老股交易内容等融资条款。 这使得外部无法测试：公司是否配得上像异常值软件平台那样交易，还是当前估值已经假设了最佳变现路径。


              这些遗漏重要，因为 Framer 当前估值已经嵌入乐观执行。买方可以相信公司有实质产品质量、创业公司拉力和企业野心。但仅凭
              公开证据，买方还无法放心判断收入的可持续性、规模化后的盈利能力，以及新钱前面具体排着哪些合同权利。


              实际含义是，建议可以改善，而不需要公司运营上发生太大变化。如果管理层披露队列留存、毛利率质量、企业 ACV 结构和 干净股权结构条款，并且这些披露显示业务确实能长进十几倍后段或二十倍出头的前瞻 ARR
              倍数，那么今天偏高的标记 可能走向合理。在此之前，正确动作是有纪律地监控，而不是激进入场。
