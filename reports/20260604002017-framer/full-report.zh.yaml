      - number: '7.5'
        title: 治理不透明、缓释成熟度和投资逻辑破裂指标
        blocks:
          - type: paragraph
            body: >-
              治理风险不在于有不当行为证据，而在于投资人需要在 $2 billion 估值上自行推断的内容太多。The Org 和 LinkedIn 支持公司有真实运营足迹和 8
              人领导团队，但无法解决确切员工数、董事会构成或职能深度。这个模糊地带重要，因为 Framer 同时在管理合规、托管基础设施、定价变化、创业公司与代理机构分销，以及企业可信度推进。Series D 隐含的执行门槛，
              因此高于公开治理表面所显示的水平。


              缓释质量有好有坏。Framer 显然有实质安全控制、持续产品迭代和逐渐成熟的合作伙伴生态，但最重要的剩余问题仍是私有信息： 客户集中度、事故历史、数据驻留细节、subprocessor 和 DPA
              访问、董事会可见度，以及支持指标。触发放弃的标准必须可监控， 不是抽象概念：如果定价摩擦比 ROI 证据上升更快；如果大买家因可迁移性或 uptime 拒绝托管模式；如果合规材料继续粗糙；
              或者如果管理层无法补上集中度和治理可见度缺口，投资逻辑就应迅速走弱。
