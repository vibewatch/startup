  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的主要风险及传导路径
        blocks:
          - type: paragraph
            body: >-
              Framer 最高等级的风险不是单一急性缺陷，而是结构性锁定。官方帮助和条款文件说得很清楚：客户买的是托管运行时， 不是可携带代码库；网站不能导出为 HTML，访问要经过 Framer
              托管的访问协议，暂停访问或关闭项目的权利仍掌握 在平台手里。产品顺风时，这可能是优势；但如果采购、uptime、定价或路线图预期滑坡，它就会变成投资判断 问题，因为客户在开放或自托管栈上拥有的体面退出路径更少。


              下一层风险来自竞争与商品化的相互作用。评论仍称赞 Framer 的设计质量和 AI 辅助速度，但也说 AI 输出需要人工 打磨，编辑席位或更重 CMS 用例累积后，定价会更痛。这意味着 Framer
              必须守住有意义的工作流领先，同时 Webflow 等竞争对手还在营销更强的可迁移性、公开 uptime 承诺和企业托管主张。因此，风险章节的判断是累积性的：下行不是
              某一个问题单独爆发，而是锁定效应、定价、可靠性不透明和治理缺口叠在同一个账号上。
