      - number: '1.2'
        title: 创始人、领导层与治理可见度
        blocks:
          - type: paragraph
            body: >-
              Framer 的创始人—市场匹配度异常清楚。公开来源一致指向 Koen Bok 和 Jorn van Dijk 为创始人，多个来源把二人追溯到 Sofa——他们在阿姆斯特丹创办、2011 年卖给 Facebook
              的设计工作室。Bok 个人网站称他在 Facebook 参与消息、广告和视频产品；van Dijk 个人网站和 Framer 自家创始人访谈则强调，他们长期想让网页更有表现力。这个背景给了 Framer
              一条有防御力的叙事：产品设计师为产品设计师打造的工具，也解释了公司为什么能打动视觉要求很高的初创公司和营销团队。


              Framer 自家博客上的创始人访谈尤其有用，因为它记录的是一次艰难转向，而不是直线成功故事。访谈称，Framer 起初是原型产品，花了约一年承认原始切入口太窄，又花了约 9 到 10
              个月围绕网站发布机会重建产品。这个历史重要，因为它说明管理层愿意放弃一个受尊重但受限的产品，去追更大的市场。


              更不透明的是公司当前监督结构。LinkedIn 显示总部地点和宽泛员工信号，The Org 显示 Framer 有 8 人领导团队，但公开记录仍看不到董事会名单，也缺少独立治理细节。对于一家 Series D
              公司，这意味着关键人物依赖仍集中在两位创始人身上，治理尽调缺口也应在后续章节继续提示。
                      
