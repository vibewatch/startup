      - number: '8.3'
        title: 情景投资判断与建议
        blocks:
          - type: paragraph
            body: >
              Framer 的乐观情景很容易讲清楚。如果公司的商业客户转向真实存在，如果企业计划能转化为明显更大的 ACV， 并且团队在向 $100 million ARR
              或更高规模扩张时守住盈亏平衡状态，那么当前估值可以被解释为对品类领导地位的 前瞻溢价。在这种情景下，Framer 不只是“又一个网站构建器”；它会成为专业网站的设计主导运营层， 并具备可信的企业变现。


              基准情景更保守。Framer 可以仍是一家强公司，同时入口价格仍然偏高。如果 ARR 明显增长但低于公开宣传的目标路径， 或者市场不再像 2021-2022 年那样奖励高溢价设计和 no-code
              故事，估值逻辑就会从 Webflow 和 Figma 代表的私募市场峰值， 回落到公开网页和软件可比公司的上半区。这仍意味着有意义的企业价值，但未必能从 $2 billion 起点获得上行。


              悲观情景是产品和披露缺口传导为倍数压缩的故事。可迁移性担忧、CMS 天花板或企业采用放缓，都会降低投资人 承受高溢价倍数的意愿。因为 Framer
              已经高于保留下来的公开网页平台可比公司，任何增长或质量失误都可能让价值压缩快过 公司长进估值。这个不对称性解释了本章为什么落在观察而不是买入。
