      - number: '7.2'
        title: 隐私、监管与合同风险
        blocks:
          - type: paragraph
            body: >-
              Framer 的公开法律页面证明，合规是真实运营负担，不是营销补丁。隐私声明覆盖多个服务界面，描述了广泛的个人数据 收集类别，并承诺采用 SCC 转移保护，以及对符合条件的数据泄露在 72
              小时内通知监管机构。加州总检察长的 CCPA 指引进一步抬高门槛，列明知情、删除、退出、更正和敏感数据限制，以及执法暴露。纸面上，Framer 也向企业买家营销 ISO 27001、SOC 2 Type
              2、GDPR 和 CCPA 能力。

              风险在于责任拆分要求高，而公开证据仍不完整。Framer 条款把终端用户通知、同意和控制者义务放在客户身上；底层
              审计报告和证书只有提出请求后才能获取。同一来源集还显示出法律文件卫生问题：检索到的隐私声明在加州部分 仍残留另一个公司名。这些都不能证明执法麻烦，但意味着投资人应把合规视为仍需尽调的活项，而不是信任页已经
              关闭的勾选框。
