      - number: '2.4'
        title: 约束、碎片化与 Framer 的特定适配
        blocks:
          - type: paragraph
            body: >-
              最清晰的市场风险是，品类正同时变得更拥挤、更可替代。Global Growth Insights 把平台同质化、流失和基于价格的切换列为结构性问题；官方竞品页面也让碎片化一目了然：DIY
              网站、代理商、企业、应用构建者、出版方、电商商家和无头内容团队，各自都有不同产品家族。这意味着「网站构建工具」不再是一个可由单一赢家主导所有用例的市场。


              这种碎片化对 Framer 是双刃剑。一方面，它让公司不必只按大众 DIY 建站工具来评判，因为 Framer 买家往往更看重设计质量、工作流和速度，而不是最长功能清单。另一方面，它也意味着 Framer 的
              SAM 比无代码或网站构建 TAM 标题数字暗示的要窄。广义市场里的许多买家会理性选择 Shopify 做电商、Bubble 做应用、Webflow 承接更重 CMS 需求，或 Contentful
              搭可组合企业栈。


              结果是，Framer 的市场论证在被定义为高级、设计驱动网站平台品类时最强，而不是被包装成泛网站构建 TAM
              故事。公开来源支持这个论点的方向，但尚不能把高级专业网站子细分的规模单独切得足够干净，无法消除全部不确定性。
                      
