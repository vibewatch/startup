      - number: '5.2'
        title: 可扩展性、AI 与 Motion 渊源
        blocks:
          - type: paragraph
            body: >-
              Framer 比纯模板式建站工具更有技术可扩展性，但这种扩展是经过策划的，不是开放式的。开发者接口明确围绕标准 React 和 JavaScript 展开，代码组件、覆盖、插件和 Fetch
              是主要扩展点。实践中，这意味着自定义逻辑可以叠加进受管理的 Framer 工作流，而不是每个特殊场景都迫使团队离开平台。Framer AI 扩展了同一论点：Wireframer 创建第一版草稿，Workshop
              帮助构建更丰富组件，AI Translate 扩展本地化，AI Plugins 连接外部模型提供商生成文案、图片和替代文本。Motion 渊源重要，因为它显示 Framer
              仍与前端开发者生态有真实桥梁。Motion 不只是营销光环；其公开文档和 npm 包将它描述为一个仍在活跃维护的 React 和 JavaScript 动画引擎，并与 Framer Motion
              有直接历史联系。这条渊源解释了为什么 Framer 能把高级动效和精致交互营销成核心差异化，而不是模板外面的一层薄包装。
