      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Framer 最新融资更像加速资本，而不是救援资本。公司 2025 年 8 月以 $2B 估值融资 $100M，管理层同时称 Framer 过去一年已经收支平衡。公开披露的资金用途是美国扩张、更深 AI
              投入，以及继续扩张产品和 GTM。这一组合显著降低了公司只是为了覆盖经营亏损才融资的概率，尤其是相对于仍在明确烧钱寻找产品—市场匹配的早期 AI 或无代码公司。


              但承销缺口仍很大，因为公开记录从未把这次融资事件转成现金跑道计算。没有任何已审阅来源披露现金余额、净烧钱、总烧钱、债务、契约结构或下一轮触发条件。这也是与上市同行比较开始有用的地方。Squarespace
              文件披露现金、债务、预订额、ARRR 和自由现金流；Shopify 文件披露收入结构、毛利和自由现金流；Wix 业绩讨论预订额、利润率、回购和投资能力。Framer
              没有披露这些资产负债表或现金流锚点。因此，正确结论是平衡的：由于公司刚融资且声称收支平衡，近期融资依赖看起来低；但没有管理层关于现金、烧钱情况和义务的材料，资本充足性无法完成判断。
