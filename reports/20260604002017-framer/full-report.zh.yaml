            body: >-
              客户侧最好的公开扩张信号，是网站从开发者归属权转向设计和营销归属权。Perplexity、Miro、Bilt、
              Cal.com、Mixpanel、创业公司计划和代理机构计划都出现了这种模式。它很可能改善扩张，因为网站工作流 一旦嵌入 CMS、本地化、分析、权限、A/B 测试和企业安全，Framer
              就不再只是一次性的落地页工具。 代理机构计划通过补贴合作伙伴采用并提供收入分成，又增加了一个明确扩张杠杆；企业页面突出 SSO、RBAC 和 合规，也让大团队采购更容易。

              风险侧同样重要。Framer 帮助中心明确说，网站不能导出为 HTML 自托管；这很可能提高切换成本，也可能让追求 可迁移性的客户在采购时迟疑。独立评价和产品目录反复提到锁定效应、CMS
              天花板、额外编辑带来的定价爬坡，以及 设计师可控但通才运营者更吃力的学习曲线。不过最大的未解缺口仍是披露。保留下来的公开来源没有给出净留存、总留存、
              流失率、头部客户暴露、合同期限或按客户群拆分的收入。也就是说，投资人可以相信 Framer 有真实客户和 可见扩张路径，但若要有把握地判断集中度风险和可持续性，仍需要管理层数据。
