  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层覆盖自助创作者、合作伙伴、创业公司和上行市场网站团队
        blocks:
          - type: paragraph
            body: >-
              Framer 的客户基础比「设计师工具」这个框架更宽。官方页面显示至少有五类活跃人群：通过免费或低价付费计划 进入的个人创作者和自由职业者；通过正式合作伙伴计划进入的代理机构和工作室；通过专门创业公司计划 与面向
              YC 的创业公司页面进入的创业公司；把 Framer 当作网站构建器使用的 SMB 和小企业买家；以及需要 本地化、权限、分析、安全和销售支持的企业营销、品牌和网站团队。官方案例库进一步印证这种分层：展示
              案例明确切成代理机构、商业、落地页、个人和创业公司等类别；案例中心则称 194 个 国家有 144,000 家公司使用 Framer。

              这组客户组合很关键，因为账号进入高端市场后，购买者、使用者和付款者会分离。自由职业者或创始人可能一个人 买、一个人用；但具名企业式案例里，设计和营销团队往往协同，有时还带上代理机构，之后再叠加安全、本地化或
              CMS 集成。结果是一个混合 GTM：底部靠 PLG 和社区，中段靠结构化合作伙伴动作，顶部靠销售辅助的企业销售动作。 真正没公开的是按数量、ARR 或 ACV
              档位拆分的客户结构。公开证据能说明这些客群存在且活跃；不能说明自由职业者、 创业公司和企业团队各贡献多少收入。
