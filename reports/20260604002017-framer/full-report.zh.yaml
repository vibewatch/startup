        - 可购买额外支持，也有面向代理机构的 Slack 支持
        - 要求提供高级支持 SLA、时区覆盖和升级处理指标
      - - D 轮规模下的执行负担
        - $2B 估值和盈利叙事抬高了预期，但集中度和治理数据仍未披露
        - 中
        - 高
        - 创始人仍握有强叙事和产品市场信誉
        - 要求提供季度 KPI 包、集中度看板和领导层继任厚度
    notes: 这些是执行和治理层面的缺口，不是管理不善的指控；问题在于可见度是否足以支撑投资判断所需的信心。
    claimRefs:
      - CR010
      - CR034
      - CR035
      - CR036
      - CR041
  - id: TR005
    title: 缓释措施与否决标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 锁定与可迁移性风险
        - 企业客户流失或交易延迟，理由是导出、自托管或运行时间透明度
        - 输赢复盘中反复出现异议，或旗舰客户因托管担忧迁移
        - 下调护城河质量，在扩大承销假设前要求流失或迁移数据
      - - 合规与法律文件质量
        - 缺少 DPA、分包处理方或数据驻留证据，或公开文件反复出现文案错误
        - 管理层无法及时提供尽调包，或公开法律材料明显陈旧
        - 暂停企业合规上行假设，并提高剩余法律风险权重
      - - 可靠性与托管基础设施依赖
        - 事故历史或 SLA 数据仍不可得，或出现重大宕机证据
        - 没有事故日志且支持指标偏弱，或出现任何面向客户的重大中断且响应不清晰
        - 将平台集中度视为高严重性，并下调企业采用假设
      - - 定价压力与 AI 商品化
        - 席位成本上涨快于 ROI 证明，竞争对手功能追平也压缩工作流领先
        - 编辑器经济性抱怨增加，或有证据表明 AI 不再显著加速转化
        - 假设定价权更弱、扩张更慢、续约切换风险更高
      - - 客户结构和集中度不透明
        - 管理层无法展示队列留存、NRR 或头部客户敞口
        - 尽调中没有分层收入看板或集中度明细
        - 保持较宽估值敏感区间，并将客户耐久性视为未证实
      - - 治理与梯队厚度
        - 董事会、继任和职能团队人数细节在尽调后仍模糊
        - 未披露董事会、未点名职能负责人，或可见领导层流失
        - 提高执行风险溢价，减少可容忍的投资论点例外
    notes: 这些否决标准设计成可在尽调或投后报告中监控，而不是一次性的叙事判断。
    claimRefs:
      - CR020
      - CR040
      - CR042
      - CR043
      - CR044
      - CR048
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 原因
      - 决策含义
    rows:
      - - 建议
        - 跟踪观察
        - 公司质地看起来较高，但当前私募估值已经计入强执行。
        - 保持主动覆盖；若没有更多披露或更好进入价格，不要基于当前估值承销上行空间。
      - - 置信度
        - 中
        - 公开可见的增长势能是真实的，但底层关键估值驱动仍未公开。
        - 管理层数据补齐缺口前，不要把该建议视为高置信度估值判断。
      - - 风险评级
        - 高
        - 公司并非困境资产，但估值显著高于公开网站平台可比公司，下行不对称性更高。
        - 若继续尽调，需要明确否决标准并做轮后监控。
      - - 估值立场
        - 偏高
        - ~40x 当前 ARR 和 ~20x 远期 ARR 属于高溢价水平，尤其在留存和利润率数据未披露的情况下。
        - 进入价格纪律比欣赏公司质地更重要。
      - - 哪些因素会改善判断
        - 更多披露或更好价格
        - NRR、毛利率、企业客户占比和干净轮次条款，可能支撑更高质量倍数。
        - 若数据强劲，后续尽调可把立场从偏高推向合理。
    notes: 本表刻意保持价格敏感：建议和立场由保留的可比公司集合以及仍未披露的内容驱动，而不只看产品质量。
    claimRefs:
      - CV037
      - CV038
      - CV042
      - CV043
      - CV044
  - id: TV002
    title: 正反投资论点表
    columns:
      - 视角
      - 当前判断
      - 改变判断的因素
    rows:
      - - 设计驱动溢价论点
        - Framer 的产品质量和增长势能足够强，理应相对更慢或更成熟的网站同业获得溢价。
        - 持续的企业 ACV 证明和留存披露，会显著强化这一论点。
      - - 执行反论点
        - 在 $2B 估值下，队列质量尚未证明前，许多显性上行可能已经提前支付。
        - 进入价格明显更低，或披露的单位经济性异常优秀，都会削弱这一反论点。
      - - 市场结构论点
        - 营销团队仍看重设计驱动执行与开发者重工作流之间的缺口。
        - 如果 Webflow、Wix Studio 或开放栈抹平工作流优势，溢价支撑会迅速变弱。
      - - 锁定反论点
        - 不可导出的架构可以支撑留存，也会给成熟买家带来采购摩擦。
        - 如果管理层证明大客户接受锁定，是因为 Framer 在速度和治理上胜出，风险会缓和。
      - - 公开可比论点
        - 公开可比公司显示，Framer 不必达到 Shopify 那样的规模，也能支撑一个扎实的业务。
        - 但这些可比公司并未说明，Framer 今天为何应显著高于公开网站可比区间。
      - - 披露反论点
        - NRR、毛利率、股权结构表和 ARR 结构缺失，挡住了更高置信度的买入判断。
        - 管理层清晰披露这些项目，是改变评级的最短路径。
    notes: 各行把投资论点与会改变结论的确切证据或披露配对，而不是把确信度当成静态变量。
    claimRefs:
      - CV006
      - CV007
      - CV037
      - CV038
      - CV039
      - CV041
      - CV044
  - id: TV003
    title: 上行 / 基准 / 下行情景表
    columns:
      - 情景
      - 核心假设
      - 估值逻辑
      - 隐含价值
      - 概率信号
    rows:
      - - 上行
        - Framer 达到或超过 $100M ARR，守住盈亏平衡，并证明企业 ACV 扩张。
        - 22x-28x 远期 ARR，仍低于 Figma 式战略溢价，但足以支撑高溢价私募估值。
        - $2.2B-$2.8B
        - 需要证明 Business 计划占多数的客户结构正在转化为耐久的企业收入。
      - - 基准
        - Framer 仍有可观增长，但低于干净溢价叙事，留存和利润率披露缺口持续存在。
        - 基于 $80M-$90M 经营基数取 14x-18x ARR，更接近优质公开软件区间，而非 2022 年私募峰值。
        - $1.1B-$1.6B
        - 最符合当前公开可比证据和有限的私募披露。
      - - 下行
        - 增长停在接近当前 ARR 水平，或锁定 / CMS 匹配度引发的采购摩擦削弱企业转化。
        - 8x-12x 收入 / ARR 框架，更接近正常化公开网站平台倍数加私募折价。
        - $0.6B-$1.0B
        - 由 ARR 路径落空、重新融资需求或公开可比倍数恶化触发。
    notes: 情景价值是估值区间，不是管理层预测；它们锚定保留的公开可比公司、私募参考估值，以及围绕 Framer 未披露收入结构的明确不确定性。
    claimRefs:
      - CV035
      - CV036
      - CV039
      - CV040
      - CV041
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 使用指标
      - 倍数 / 估值
      - 与 Framer 的相关性
      - 主要局限
    rows:
      - - Wix
        - 2026 年 6 月市值对比 2025 年收入
        - $2.30B 市值 / $1.99B 收入 = ~1.2x
        - 直接的公开网站搭建器参照，且披露节奏完整。
        - 成熟上市公司，增速慢于 Framer。
      - - Squarespace
        - 2024 年私有化 EV 对比 2023 年收入
        - 公告 EV $6.9B，对应收入 $1.012B = ~6.8x
        - 设计驱动的网站平台，披露收入且近期发生控制权交易。
        - 私有化价格不等于 2026 年实时公开倍数。
      - - Shopify
        - 2026 年 6 月市值对比 TTM 收入
        - $146.55B 市值 / $12.36B TTM 收入 = ~11.9x
        - 展示规模化、品类定义型商业平台在公开市场可获得的定价。
        - 更广义的商业 OS，不是纯网站平台同业。
      - - Webflow
        - 2022 年 C 轮估值对比近期 ARR
        - ARR 接近 $100M 时估值 $4B = ~40x ARR
        - 最接近的后期无代码网站平台私募融资参照。
        - 2022 年融资市场远热于 2026 年。
      - - Contentful
        - 2021 年 F 轮名义估值
        - 名义私募估值为 $3B
        - 可作为上探企业端内容平台需求的参照。
        - 保留来源未披露收入，因此没有干净倍数。
      - - Figma / Adobe 交易
        - 2022 年公告交易对比退出时 ARR
        - 基于 >$400M ARR 的公告价值 $20B = ~50x ARR
        - 展示投资者愿意为品类领先、留存顶尖的设计软件支付的上行溢价。
        - 战略性设计平台参照，不是直接网站平台可比。
    notes: 该枚举完整覆盖章节要求明确列出的六组可比对象；各行混合当前公开倍数与较早的私募或战略估值，因此相关性和局限两列与原始数字同样重要。
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Covers the six valuation reference sets explicitly requested for this chapter using direct public evidence
        retained on 2026-06-04.
    claimRefs:
      - CV014
      - CV020
      - CV024
      - CV025
      - CV026
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
      - CV034
  - id: TV005
    title: 论点失效与否决触发表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - ARR 执行落空
        - 管理层无法可信支撑从 $50M ARR 走向 $100M ARR 的路径。
        - 打破 Framer 能靠增长消化当前远期倍数的核心论据。
        - 除非价格或条款大幅重置，否则从跟踪观察转为回避。
      - - 盈利能力反转
        - 盈亏平衡叙事消退，在企业耐久性得到证明前又出现烧钱。
        - 下一轮融资更可能是防守性融资，而非可选融资。
        - 暂停尽调，直到现金跑道和融资计划明确。
      - - 融资重置
        - 新资本按当前估值或更低估值进入，且质量指标没有明显改善。
        - 表明私募市场不支持 D 轮叙事。
        - 视为估值重置，并基于新条款重建模型。
      - - 可比倍数压缩
        - 公开软件和网站平台倍数较保留的 2026 年 6 月区间进一步下行。
        - 即便 Framer 运营执行到位，高溢价私募倍数的上限也会降低。
        - 下调可接受进入价格，并拓宽下行情景区间。
      - - 企业适配滑坡
        - 大型客户在可迁移性、治理或内容复杂度上持续偏好更开放或结构化的替代方案。
        - 削弱支撑高溢价估值的企业端上行逻辑。
        - 将 Framer 重估到更接近建站器可比公司，而非高溢价工作流软件。
    notes: 触发项用可监控的运营或融资术语表述，使投委会能在下轮降价或战略停滞事后明朗前作出反应。
    claimRefs:
      - CV045
      - CV046
      - CV047
      - CV048
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - ARR 结构
        - 按自助、Business 和企业队列拆分的 ARR，以及 ACV 分布。
        - 判断当前溢价究竟由耐久的高价值客户赚来，还是来自宽泛的低 ARPU 采用。
        - 要求管理层提供队列桥接和按套餐层级拆分的收入结构。
      - - 留存
        - NRR、GRR、logo 流失率，以及按队列或套餐拆分的流失率。
        - 如果没有收入高效复利的证据，高溢价软件倍数很难站住。
        - 要求提供按获客年份和客户层级拆分的队列表。
      - - 经济性质量
        - 毛利率、托管成本负担、支持成本和现金转化。
        - 区分高溢价软件资产，还是单位经济性偏弱的增长故事。
        - 要求经审计的管理层财务数据和托管成本趋势。
      - - 轮次条款
        - 清算优先权结构、D 轮中的老股转让内容、治理权，以及任何 pay-to-play 或 ratchet 条款。
        - 名义投后估值可能高估新资金实际买到的内容。
        - 要求融资文件或律师出具的权利摘要。
      - - 企业端证明
        - 具名客户 ACV、合同期限、续约历史，以及对阵 Webflow 和开放栈的赢 / 输原因。
        - 检验企业端论点是否足够真实，能否支撑高溢价倍数。
        - 要求提供头部客户资料包和销售管线转化分析。
    notes: 每个问题都直接对应一个估值不确定性，而非泛泛好奇；即使只清除其中两三项，也可能明显改变建议。
    claimRefs:
      - CV044
      - CV049
      - CV050
      - CV051
      - CV052
