      - number: '7.3'
        title: 安全、可靠性、托管基础设施与生态依赖
        blocks:
          - type: paragraph
            body: >-
              Framer 的安全页面足够扎实，能说明公司有真实控制体系。公司披露了美国境内 AWS 多可用区托管、加密和密钥管理实践、 网络分段、日志、SIEM
              监控、代码审查、依赖管理和备份恢复测试。问题不是没有控制项，而是依赖和透明度。AWS 仍是 集中的基础设施依赖；条款明确不保证服务不中断；已审阅的 Framer 材料也没有发布可与 Webflow 99.99%
              uptime 主张相比的公开 uptime SLA 或事故历史视图。想把托管网站层标准化的企业会在意这个缺口。


              Framer 的可扩展性叙事又增加了一层依赖。开发者界面绑定 React 和 JavaScript，Motion 文档定位为 React 原生工具，
              条款也收窄了围绕第三方包和组件的支持义务。这种设计给技术型设计师很大能力，但也让 Framer 承受外部生态在技能、 框架方向、插件质量和兼容性上的变化。CSP
              帮助文章在基础设施层面强化了同一模式：更深的安全定制可以做，但更好的 实现常常依赖更高阶托管功能或反向代理变通方案，而不是简单默认设置。
