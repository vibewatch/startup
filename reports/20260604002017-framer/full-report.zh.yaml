  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与定价架构
        blocks:
          - type: paragraph
            body: >-
              Framer 公开的货币化表面像经典托管式 SaaS 阶梯，但比单纯按席位收费的软件工具更受用量影响。免费计划足够慷慨，能让设计师和营销人员在产品内搭建；但它阻断自定义域名，并限制
              CMS、页面、语言版本和编辑者容量。付费变现从年度站点计划开始，经编辑者席位和内容编辑者角色扩张，再通过语言版本、CMS
              条目、带宽、页面、分析事件和高级托管等用量增购项继续放大。企业层则在最上方，以围绕自定义上限、企业安全和专属支持的报价式套餐呈现。


              这一结构关系到收入质量。它意味着 Framer 主要变现的不是广告、交易或服务，而是持续订阅的网站基础设施和工作流使用权。代价是，收入仍部分绑定基础设施密集型用量。Scale 已打包高级
              CDN、事件和漏斗、弹性上限；公司也称站点不能导出，因为生产交付依赖预渲染、图片优化等动态后端服务。因此，同一套提升留存和增售潜力的托管栈，也让托管、带宽、分析、AI
              和支持成为真实成本中心。公开材料对标价机制说明很强，但对实际成交价、折扣，以及收入中基础订阅、席位、增购项和企业合同各占多少仍支持不足。
