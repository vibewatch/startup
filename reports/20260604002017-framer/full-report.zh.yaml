      - number: '3.4'
        title: 定价、切换成本与分发力量
        blocks:
          - type: paragraph
            body: >-
              包装和采购对竞争压力的塑造几乎不亚于原始功能。Framer、Webflow、Bubble、Cargo、Ghost 和 Shopify
              都展示清晰入门套餐，并大多提供自助路径，这有利于产品驱动采用，也让并排试用变容易。对 Framer 有利的是，买家可以不用经历企业销售周期，就快速把它与其他视觉构建工具比较。


              但透明度也暴露出 Framer 的取舍何处更显眼。Bubble 让应用逻辑深度很直观。Ghost 让会员经济账很直观。Cargo 让低成本创意作品集很直观。Shopify 让电商深度很直观。Wix 和
              Squarespace 则制造了另一个问题：可读定价页面展示了套餐阶梯，但抓取文本中没有稳定、全球可比价格。Contentful 和 WordPress VIP
              随着企业范围扩大，更进一步进入报价驱动或合同驱动定价。


              Framer 最大的切换成本杠杆，是集成托管和协作栈；但买家谨慎也在这里上升。Framer 不允许导出 HTML 自行托管，这提高了满意客户的粘性，却相对削弱了与 WordPress VIP 开放基础和
              Shopify 无头 API 相比的可迁移性。分发同样重要：WordPress、Shopify 和 Wix 能受益于比 Framer 大得多的生态和预算熟悉度。
