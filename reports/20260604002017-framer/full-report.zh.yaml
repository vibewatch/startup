      - number: '3.3'
        title: 垂直替代品与相邻平台
        blocks:
          - type: paragraph
            body: >-
              一旦买家的任务不再是「快速发布高质量营销网站」，Framer 的替代集合就会迅速变宽。Bubble 是最清楚的例子。它的按工作负载定价、托管地点选择、SSO、备份和安全控制，都指向逻辑更重的 Web
              和移动应用，而不只是品牌站。初创公司在 Framer 和 Bubble 之间选择时，通常是在决定自己需要的是营销界面，还是应用平台。


              Cargo 和 Ghost 更窄，但并非无足轻重。Cargo 面向想做作品集或轻电商的设计师和艺术家，包装成本相对低。Ghost
              则为出版方、新闻简报、会员和受众变现优化，把付费订阅和分析直接嵌入产品。这些不是每个 Framer 用例的广泛替代品，但当买家的内容模型或变现工作流已经很明确时，它们可能是更好的产品。


              Shopify、Contentful 和 WordPress VIP 位于替代品的上行端。Shopify 是带结账、POS、B2B、支付和多市场能力的电商操作系统。Contentful 是围绕
              API、治理和本地化搭建的可组合内容平台。WordPress 与 WordPress VIP 仍是最宽的替代选择，因为它们把巨大安装基础、企业层和许多大型组织已经理解的开放生态结合在一起。
