  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 品类
      - 规模 / 融资信号
      - 目标客群
      - 差异化
      - 局限
    rows:
      - - Framer
        - 标的公司 / 设计驱动的网站平台
        - 私有公司；$100M Series D 轮，估值 $2B；数十万个网站和 500k+ 月活用户
        - 设计师、营销人员、初创公司和企业网站团队
        - 设计师级画布，加上 CMS、分析、A/B 测试和快速发布，封装在一个托管工作流里
        - 不支持 HTML 导出；生态和装机基数小于主要既有厂商
      - - Webflow
        - 直接设计驱动构建器
        - 300k+ 品牌；占所有网站 0.9% / 已知 CMS 网站 1.2%
        - 营销、创意、工程和代理机构团队
        - CMS、治理、本地化、实验和企业支持较强
        - 企业销售动作可能比 SMB 工具摩擦更高
      - - Wix / Wix Studio
        - 既有构建器 + 专业层
        - 上市公司，200M+ 用户；占所有网站 4.3% / 已知 CMS 网站 6.1%
        - Wix 面向自助创作者；Wix Studio 面向代理机构和企业团队
        - 庞大分发，加上 Studio 专属的多站点、代码和企业基础设施功能
        - 定价因地区而异，品牌横跨 DIY 和专业层
      - - Squarespace
        - 设计驱动的既有 SMB 套件
        - 经 Permira 约 $7.2B 收购后私有化；数百万规模，覆盖 200+ 个国家和地区
        - 创业者、创作者、服务型企业和 SMB 品牌
        - 品牌强、设计打磨好，并带排期、电商和营销套件
        - 深度企业治理的公开证据少于直接上行竞争对手
      - - Bubble
        - 无代码应用平台
        - Enterprise 方案和 6M+ Bubblers 显示平台已有相当规模
        - 构建 Web 或移动应用的创始人、运营者和团队
        - 逻辑丰富的应用、基于工作负载的扩展、托管控制和企业安全
        - 不是为高端营销网站专门打造
      - - Cargo
        - 创意作品集构建器
        - 小众创意平台，提供低成本标准版和电商升级
        - 设计师、艺术家、作品集和小型创意工作室
        - 原生作品集定位和简单低成本打包
        - 功能范围较窄，企业 / 治理信号有限
      - - Ghost
        - 出版 / 邮件通讯平台
        - 每年 $100M+ 出版方收入；约占所有网站 0.1%
        - 出版方、创作者、媒体公司和会员驱动型运营者
        - 邮件通讯、会员、付费订阅和开源定位
        - 视觉网站设计和企业网站工作流深度较窄
      - - Shopify
        - 电商操作系统
        - 2024 年 875M+ 购物者；美国电商 12%+；电商系统 30.6%
        - 商户、零售运营方、B2B/B2C 电商团队
        - 结账、POS、支付、B2B、全球市场和无头电商
        - 对没有重度电商需求的纯品牌站而言过重
      - - Contentful
        - 可组合内容 / DXP
        - 接近 30% 的 Fortune 500；每月 180B+ API 调用
        - 企业营销人员、开发者和多品牌 / 全球团队
        - API-first 架构、治理、本地化、个性化和可组合性
        - 比一体化托管构建器需要更强技术主导
      - - WordPress / WordPress VIP
        - 开放 CMS + 企业内容平台
        - 占所有网站 41.9% / 已知 CMS 网站 59.4%；VIP 起价 $25k/年
        - 创作者、出版方、企业内容团队和多站点组织
        - 开放生态、插件、所有权和企业 VIP 层
        - 灵活性往往也带来比托管构建器更高的实施复杂度
    notes: 该表覆盖用户指定的重点集合，混合使用上市公司规模信号、官方产品定位和 W3Techs 装机基数数据。
