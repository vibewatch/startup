  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 平台
      - 入门套餐
      - 可见标价
      - 合同模式
      - 包含能力取向
      - 含义
    rows:
      - - Framer
        - Basic / Pro / Scale / Enterprise 计划
        - $10 / $30 / $100+ 用量 / 定制
        - Scale 及以下自助；企业定制
        - 设计驱动网站、CMS、SEO、协作、实验插件
        - 清晰入门路径有利于 PLG，但企业销售仍会走向定制
      - - Webflow
        - Starter / Basic / Premium / Team / Enterprise 计划
        - 免费 / $15 / $25 / $2,500 年付 Team / 定制 Enterprise
        - 自助服务，加年度合同 Team 和定制企业
        - 托管网站、CMS、本地化、治理、AI、工作流
        - 在上行同业中，可见价格阶梯与 Framer 最直接可比
      - - Wix
        - Free / Light / Core / Business / Business Elite 计划
        - 方案结构可见；准确价格随地区和计费方式变化
        - 自助服务配本地化结账；企业对话经由 Studio
        - 域名、托管、AI、电商、排期，高阶方案含开发工具
        - 大众市场可触达性强，但基准对比有一定不透明
      - - Squarespace
        - 网站套餐 + 高端服务路径
        - 试用和计费节奏可见；抓取文本未披露稳定、可读的标价
        - 自助试用 + 更重人工触达的高端服务
        - 网站、域名、排期、电商、营销、服务型企业工具
        - SMB 定位很强，但价格可比性不够干净
      - - Bubble
        - 免费 / 入门 / 增长 / 团队 / 企业
        - 免费 / $59 / $209 / $549 / 定制
        - 团队版及以下自助购买；企业版定制
        - Web 和移动应用搭建，按工作负载扩展
        - 买方更看重应用逻辑而不是网站精修时，匹配度更高
      - - Cargo
        - 标准 / 商务
        - $14 年付或 $19 月付 / $19.50 年付或 $28 月付
        - 自助购买
        - 创意网站、作品集、轻量电商、域名、SSL
        - 更像创作者的低价垂直替代品，不是完整企业网站平台
      - - Ghost
        - 入门 / 出版者 / 商业 / 定制
        - $18 / $29 / $199 / 定制
        - 商业版及以下自助购买；企业版定制
        - 简报、会员、付费订阅、分析
        - 面向出版驱动型业务，包装非常清晰
      - - Shopify
        - 核心方案 + Plus
        - 可见 $39 年付方案；Plus 定制
        - 核心方案自助购买；企业通过 Plus
        - 结账、POS、支付、B2B、市场、AI 助手、无头店面
        - 电商驱动型买方一上来就能看到更深的变现工具
      - - Contentful
        - 免费 / 入门 / 企业定制平台
        - 免费层和权益结构可见；企业经济条款定制
        - 开发者 / 企业合同型销售
        - API 调用、角色、SSO、SCIM、治理、个性化、本地化
        - 包装更适合可组合内容运营，不适合快速网站试用
      - - WordPress VIP
        - 标准 / 增强 / 旗舰
        - 按报价、随访客量扩展；年度合同
        - 企业销售模式
        - 开放式企业内容平台，带正常运行时间和支持 SLA
        - 很适合大型组织，但不利于 PLG，也难以即时比价
    notes: 本表比较的是公开包装信号，不是实际 ARPU 或谈判后的企业价格；需要报价、按地区变化的条目已明确标出，而不是估算。
