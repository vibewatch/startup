      - number: '1.3'
        title: 融资历史与利益相关方地图
        blocks:
          - type: paragraph
            body: >-
              2025 年 8 月的 Series D，是 Framer 从快速增长的欧洲设计工具成功案例，变成成长期网站平台故事的关键事件。Framer 自家公告、Business Wire、TechCrunch 和
              Sifted 的核心融资事实相互吻合：公司以 $2B 估值融资 $100M，Meritech 和 Atomico 领投，WiL 与 HV 参投。同样重要的是，公司把融资与私营 SaaS
              中少见的强运营表述放在一起：称自己已达到收支平衡，资金用途是加速美国扩张和 AI 投入，而不是填补经营窟窿。


              回看历史，方向清楚，即便部分细节仍依赖数据库和地区媒体。TechCrunch、Silicon Canals 和 Tracxn 都指向 2023 年由 Meritech 领投的 $27M Series
              C；Silicon Canals 还提到更早由 Atomico 领投的 Series B。Tracxn 统计的五轮累计 $163M
              看起来合理，也与后续披露轮次内部一致，但仍更适合作为数据库估算，而不是经审计的公司披露。


              从利益相关方看，最重要的角色仍是创始人和重复下注的投资人。Meritech 和 Atomico 在这里不只是被动资金方；公司自家博客称，在经历一年盈利增长后，是他们主动接洽 Framer
              讨论新一轮融资。这意味着投资人信心异常强，也意味着外部对执行、企业采用，以及把设计驱动增长扩展成更广网站运营版图的期待更高。
                      
