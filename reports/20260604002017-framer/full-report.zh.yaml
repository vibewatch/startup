              尽调中最重要的产品事实，是 Framer 已从页面搭建扩展到上线后网站运营。CMS 表面如今声称支持动态页面、大量条目、无限引用、画布内编辑、过滤和基于插件的数据同步。分析功能加入 A/B
              测试、漏斗、点击追踪和隐私优先测量。表单功能不再只是联系表：Framer 称提交可以流入 Sheets、电子邮件、自定义 webhook，以及基于 Zapier 的下游系统。SEO
