      - number: '5.5'
        title: 限制与投资判断
        blocks:
          - type: paragraph
            body: >-
              核心产品风险在可迁移性和能力天花板。Framer 自家帮助中心说得很明确：网站不能导出为 HTML 自托管， 因为预渲染、动态图片缩放、字体子集化等后端服务属于运行时的一部分。这样的集成栈很有力，但也意味着买方
              获得的价值必须压过锁定效应。独立评价指向同一条边界：Framer 最适合设计主导的营销网站，对原生电商、 类应用工作流或超大内容运营则弱一些。就连 Framer
              自家的对比页也把取舍说成：一边是速度和更低运营负担， 另一边是 Webflow 更深的开发者接口。按投资判断看，产品足够完整，差异化也足以支撑高溢价的营销网站逻辑。
              最大的尽调问题不是这套产品是否存在，而是规模化之后怎么跑：实际 uptime 表现、企业支持 SLA、扩展治理， 以及 CMS 从哪里开始输给 headless 或开放生态替代品。
