      - number: '5.4'
        title: 托管、安全与企业部署
        blocks:
          - type: paragraph
            body: >-
              Framer 的托管与安全叙事本身就是产品的一部分，不是事后补丁。托管页面写到，它用预热资源池应对流量峰值， 配合全球缓存、按需渲染，以及对图片和其他资产做自动边缘优化。安全页面把信任叙事讲得更具体：多可用区
              AWS 托管、加密、环境隔离、代码审查、依赖管理、Sentry、SIEM 监控、渗透测试，以及经过测试的备份恢复。 企业页面再把这些运行时控制包进治理能力，例如
              SSO、RBAC、自定义权限和销售接洽式采购。对比页和定价页也 显示，暂存、回滚、重写和自定义安全头会成为高端运营套件的一部分。结果是，Framer 看起来已经能支撑严肃的
              营销网站运营，也足以进入相对成熟的企业采购讨论。缺口在透明度：Framer 披露了很多控制项，却没有公开 uptime SLA、事故历史或支持响应指标，投资人因此难以独立把可靠性同成熟基础设施供应商对标。
