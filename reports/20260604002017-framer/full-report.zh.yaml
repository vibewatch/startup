  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失的私有指标
      - 影响
      - 当前公开替代信号
      - 为什么替代信号不够
      - 精确尽调路径
    rows:
      - - 现金余额
        - 阻碍现金跑道分析和下行规划
        - Series D 轮规模和收支平衡说法
        - 融资金额和盈利能力引述无法揭示剩余现金
        - 索取最新资产负债表、银行余额和月度现金瀑布
      - - 净烧钱和总烧钱
        - 阻碍在招聘或放缓情景下判断资本充足性
        - 收支平衡声明
        - 收支平衡不能揭示营运资本波动、资本开支或现金消耗时点
        - 索取过去 12 个月现金流，以及按职能划分的月度烧钱
      - - 按细分市场拆分的 ARR
        - 阻碍对收入质量和 GTM 组合的判断
        - $50M ARR 锚点 + 新客户以企业为多数的说法
        - ARR 总额看不出自助、商业、企业或附加项各占多少
        - 索取按队列、地域和产品家族划分的 ARR 桥
      - - 毛利率与托管 / AI 成本桥
        - 阻碍判断利润率路径
        - 托管功能栈和用量定价
        - 公开功能页面暗示成本驱动因素，但不揭示实际成本结构
        - 索取按托管、CDN、AI、支持和第三方服务划分的 COGS
      - - CAC、回本周期和销售周期数据
        - 阻碍评估企业效率和资本强度
        - 产品驱动漏斗可见性和业务组合说法
        - 表层 PLG 证据无法揭示销售生产率或营销效率
        - 索取按渠道划分的 CAC、按细分划分的回本周期、管线转化率和企业销售周期长度
      - - 留存、流失和 NRR
        - 阻碍给出耐久收入质量判断
        - 企业客户增长和具名 logo 动能
        - 客户 logo 和增长表述很少说明续约耐久性
        - 索取按队列划分的 logo 留存、美元留存、扩张和流失
      - - 实现价格和折扣
        - 阻碍定价权和 ASP 分析
        - 标价和附加项价目表
        - 头部价格无法揭示月付占比、谈判后的企业折扣或净实现
        - 索取折扣瀑布、年度承诺占比和合同最低额
    notes: 这些是主要私有指标，仍把有前景的公开叙事和完整财务投资判断隔开。
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Covers the full set of private metrics that repeatedly prevented the chapter from converting public signals into
        a complete revenue-quality and runway model.
