    - positive
    - current
    - Faster first drafts expand category demand and reduce builder friction
    - Will AI features differentiate Framer or simply become table stakes?
  - - Enterprise web-governance needs
    - positive
    - current
    - Upshifts category from DIY tools into higher-ACV software
