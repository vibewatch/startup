- id: buyers-and-segments
  title: Buyer, user, and payer segments
  body: "The buyer map for website builders is broader than the old “small business owner making a brochure site” stereotype. Public SMB surveys still show that market as critical — Clutch says 83% of small businesses now have websites and Network Solutions says 73% of U.S. small businesses do — but the category has stratified into distinct tiers. Framer’s own positioning is aimed at designers and marketers shipping a brand site. Webflow explicitly addresses marketing, creative, engineering, and agency teams. Wix split its stack between mass-market Wix and the more professional Wix Studio product for agencies and enterprises. Meanwhile, Ghost serves publishers, Shopify serves commerce-led merchants, Bubble serves no-code app builders, and Contentful serves enterprise content teams.\n\nThat segmentation matters because the buyer, user, and payer are not always the same person. In the SMB self-serve tier, the owner often plays all three roles. In startup marketing teams, the user may be a\
    \ designer or marketer while the payer is a department head or founder. In enterprise web teams, procurement shifts toward marketing leadership, digital experience teams, or centralized IT-approved budgets, with stronger emphasis on permissions, governance, localization, and integration rather than simple speed of launch. Agencies sit in between: they care about collaboration, repeatability, client handoff, and multi-site management.\n\nFramer’s most relevant opportunity appears to be the premium middle of this spectrum. It is not trying to compete with Bubble for full application logic, or Shopify for deep commerce operations. It is competing for the budget that teams allocate to branded websites, campaign landing pages, and content-rich marketing surfaces that need to look custom without consuming scarce developer time.\n        "
