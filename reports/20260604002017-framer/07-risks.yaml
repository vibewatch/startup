  evidenceGaps:
  - type: missing-source
    severity: material
    topic: reliability-transparency
    missingEvidence: Public or private uptime SLA, incident history, and support-response metrics for enterprise customers.
    whyItMatters: Without uptime and incident evidence, reliability has to be underwritten from architecture and disclaimers rather than from operating history.
    diligencePath: Request status-page export, SLA-credit history, severity-one incident log, and support KPI dashboard.
    relatedQuestionRefs:
    - QR010
    - QR028
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: blocking
    topic: concentration-gap
    missingEvidence: Top-customer concentration, NRR, GRR, churn, contract length, and revenue mix by cohort.
    whyItMatters: The public source set proves adoption but not durability or concentration, so downside under stress remains hard to quantify.
    diligencePath: Request cohort retention deck, top-10 customer schedule, ARR mix by plan and segment, and churn reasons by cohort.
    relatedQuestionRefs:
    - QR019
    - QR030
  - type: missing-source
    severity: material
    topic: governance-opacity
    missingEvidence: Board roster, committee structure, investor governance rights, and precise headcount by function and geography.
    whyItMatters: A later-stage company with a $2 billion valuation should be underwritten on bench depth and oversight, not only on founder narrative.
    diligencePath: Request board materials summary, cap-table governance rights, org chart, and function-level headcount snapshot.
    relatedQuestionRefs:
    - QR022
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: compliance-burden
    missingEvidence: Signed DPA, subprocessor list, data-residency commitments, and enterprise audit-access process.
    whyItMatters: Public trust claims are directionally positive but enterprise underwriting still depends on the private compliance pack.
    diligencePath: Request the current DPA, subprocessor appendix, residency FAQ, and customer audit-right workflow used in enterprise deals.
    relatedQuestionRefs:
    - QR028
    - QR030
    relatedTableRefs:
    - TR001
