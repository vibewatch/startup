- id: competition-pricing-and-customer-mix
  title: Competition, AI commoditization, pricing pressure, and customer-base risk
  body: |-
    Framer is exposed to both classic competition and a newer commoditization problem. Reviews still describe the product as unusually strong for design-first marketing sites, but they also say AI output is draft quality, CMS flexibility remains narrower than WordPress or Webflow in complex scenarios, and heavier pages or workflows can create friction. If AI-assisted site creation becomes table stakes, differentiation has to come from workflow depth, reliability, support, and total cost of ownership rather than from prompt-based novelty alone. Webflow's public export, uptime, and enterprise-platform language highlights exactly where Framer can lose procurement-driven deals even if designers prefer its canvas.

    Pricing and customer mix make the downside more material. Public sources show low entry pricing and broad reach, but reviews repeatedly say the economics get tougher once teams add editors or more advanced CMS needs. At the same time, external directories and review pages still point to meaningful SMB and self-serve usage even as Business Wire says new-customer mix has shifted toward businesses. That is not inherently bad, but it means Framer may still carry a blended base where pricing sensitivity and support expectations vary sharply by cohort. Without public NRR or concentration disclosure, investors are underwriting that transition with only partial visibility.
