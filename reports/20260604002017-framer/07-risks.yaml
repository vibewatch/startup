- id: legal-privacy-and-compliance
  title: Privacy, regulatory, and contractual risk
  body: |-
    Framer's public legal surface proves that compliance is a real operating burden, not a marketing afterthought. The privacy statement covers multiple service surfaces, describes broad categories of personal-data collection, and commits to SCC-based transfer safeguards and 72-hour supervisory notification for qualifying breaches. The California attorney general's CCPA guidance raises the bar further by spelling out know, delete, opt-out, correction, and sensitive-data limits, plus enforcement exposure. On paper, Framer also markets ISO 27001, SOC 2 Type 2, GDPR, and CCPA posture to enterprise buyers.

    The risk is that the responsibility split is demanding and the public evidence remains incomplete. Framer's terms place end-user notice, consent, and controller obligations on customers, while the underlying audit reports and certificates are available only on request. The same source set also shows a legal-document hygiene concern: the retrieved privacy statement still contains a stray reference to another company name in its California section. None of this proves enforcement trouble, but it does mean investors should treat compliance as a live diligence item rather than as a box already closed by the trust page.
  claimRefs:
