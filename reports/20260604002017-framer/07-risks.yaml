- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Lock-in and portability risk
    - Enterprise losses or delayed deals citing export, self-hosting, or uptime transparency
    - Repeated objections in win-loss review or a flagship customer migration triggered by hosting concerns
    - Downgrade moat quality and require churn or migration data before underwriting expansion
  - - Compliance and legal-document quality
    - Missing DPA, subprocessor, or residency evidence or repeat public-document copy errors
    - Management cannot produce diligence pack promptly or public legal artifacts remain visibly stale
    - Pause enterprise-compliance upside assumptions and increase residual legal-risk weighting
  - - Reliability and hosted-infrastructure dependence
    - Incident history or SLA data remains unavailable, or major outage evidence emerges
    - No incident log plus weak support metrics, or any material customer-facing disruption without crisp response
    - Treat platform concentration as high severity and haircut enterprise adoption assumptions
  - - Pricing pressure and AI commoditization
    - Seat costs rise faster than ROI proof while competitor feature parity narrows the workflow lead
    - More complaints on editor economics or evidence that AI no longer accelerates conversion materially
    - Assume lower pricing power, slower expansion, and greater risk of switching at renewal
  - - Customer-mix and concentration opacity
    - Management cannot show cohort retention, NRR, or top-customer exposure
    - No segmented revenue dashboard or concentration schedule in diligence
    - Keep valuation sensitivity wide and treat customer durability as unproven
  - - Governance and bench depth
    - Board, succession, and functional-headcount detail remain vague after diligence
    - No board disclosure, no named functional leaders, or visible leadership churn
    - Raise execution-risk premium and shorten the list of acceptable thesis exceptions
  notes: These kill criteria are designed to be monitorable in diligence or post-investment reporting rather than as one-time narrative judgments.
