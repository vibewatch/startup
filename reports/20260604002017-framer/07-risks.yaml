- id: governance-mitigations-and-kill-criteria
  title: Governance opacity, mitigation maturity, and thesis-break indicators
  body: |-
    The governance risk is less about evidence of wrongdoing than about the amount investors still have to infer at a $2 billion valuation. The Org and LinkedIn support a real operating footprint and an eight-person leadership team, but they do not resolve exact headcount, board composition, or functional depth. That ambiguity matters because Framer is simultaneously managing compliance, hosted infrastructure, pricing changes, startup and agency distribution, and an enterprise credibility push. The execution bar implied by the Series D is therefore higher than the public governance surface suggests.

    Mitigation quality is mixed. Framer clearly has meaningful security controls, recurring product work, and a maturing partner ecosystem, but the most important remaining asks are still private: customer concentration, incident history, data-residency detail, subprocessor and DPA access, board visibility, and support metrics. The right kill criteria are therefore monitorable, not abstract. If pricing friction rises faster than proof of ROI, if major buyers reject the hosted model on portability or uptime grounds, if compliance artifacts remain sloppy, or if management cannot close the visibility gap on concentration and governance, the investment thesis should weaken quickly.
