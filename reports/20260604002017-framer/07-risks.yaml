company:
  name: Framer
chapter:
  number: 7
  title: Risks
  summary: 'Framer''s risk profile is defined less by a single catastrophic flaw than by several stacked exposures: a no-export hosted model, meaningful GDPR and privacy execution obligations, incomplete reliability transparency versus competitors, pricing sensitivity as teams scale, and still-private concentration and governance data. The company has real mitigations in security, product quality, and distribution, but the right underwriting stance is to treat lock-in, competition, and compliance diligence as first-order risks rather than as footnotes to growth.'
sections:
- id: ranked-top-risks
  title: Severity-ranked top risks and transmission paths
  body: |-
    Framer's highest-ranked risk is structural lock-in rather than a single acute defect. The official help and terms documents make clear that customers are buying a managed runtime, not a portable codebase: sites cannot be exported to HTML, access is mediated through Framer's hosted access protocols, and suspension or project shutdown rights remain with the platform. That can be a strength when the product is winning, but it becomes an underwriting problem if procurement, uptime, pricing, or roadmap expectations slip because customers have fewer graceful exit paths than on open or self-hosted stacks.

    The next tier of risk comes from the interaction between competition and commoditization. Reviews still praise Framer's design quality and AI-assisted velocity, but they also say the AI output needs manual refinement and that pricing gets more painful as editors or heavier CMS use cases accumulate. That means Framer has to preserve a meaningful workflow lead while competitors like Webflow continue to market stronger portability, public uptime commitments, and enterprise hosting claims. The risk chapter's framing is therefore cumulative: the downside appears when lock-in, pricing, reliability opacity, and governance gaps stack on the same account rather than when any one issue fires alone.
