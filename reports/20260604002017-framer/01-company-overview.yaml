- id: funding-and-stakeholders
  title: Funding history and stakeholder map
  body: "Framer’s August 2025 Series D is the event that turns the company from a fast-growing European design-tool success into a growth-stage website-platform story. Across Framer’s own announcement, Business Wire, TechCrunch, and Sifted, the core financing facts line up: the company raised $100M at a $2B valuation, Meritech and Atomico led the round, and WiL plus HV participated. Just as important, the company paired the financing with unusually strong operating language for a private SaaS business, saying it had already reached break-even and was using the capital to accelerate US expansion and AI investment rather than to plug an operating hole.\n\nThe backward-looking record is directionally clear even if some detail still relies on databases and regional coverage. TechCrunch, Silicon Canals, and Tracxn all point to a $27M Series C in 2023 led by Meritech, and Silicon Canals describes an earlier Atomico-led Series B. Tracxn’s running total of $163M across five rounds is plausible and\
    \ internally consistent with the disclosed later rounds, but it is still better treated as a database estimate than as audited company disclosure.\n\nFrom a stakeholder perspective, the most important actors are still the founders and the repeat backers. Meritech and Atomico are not just passive capital providers here; the company’s own blog says they approached Framer about the new round after a year of profitable growth. That suggests unusually strong investor conviction and, by extension, higher expectations around execution, enterprise adoption, and the ability to turn design-led growth into a broader website-operations franchise.\n        "
  claimRefs:
