  - type: conflicting-data
    severity: material
    topic: founding-year
    missingEvidence: A first-party corporate history or legal filing that fixes the founding date and distinguishes company formation from later product launches.
    whyItMatters: The public record conflicts between 2013, 2014, and 2015, which affects milestone chronology and the company's maturity narrative.
    diligencePath: Request incorporation records or an investor-approved company timeline from Framer IR/founders and reconcile against funding databases.
    relatedQuestionRefs:
    - QO001
    - QO021
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board composition, independent director count, and any recent executive changes.
    whyItMatters: Governance quality and key-person dependence are central for a Series D company but the public source set does not expose the full oversight structure.
    diligencePath: Ask management or lead investors for the current board list, committee structure, and any executive changes since the Series C.
