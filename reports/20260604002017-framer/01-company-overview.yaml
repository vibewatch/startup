- id: scale-footprint-and-customers
  title: Scale, footprint, and customer signals
  body: "The public operating signals around Framer are stronger than is typical for a private European SaaS company. The company states that hundreds of thousands of sites run on Framer and that more than half a million people use the platform each month. Public Series D coverage adds named customers — Scale AI, Perplexity, Miro, and Bilt — and says that close to half of the most recent Y Combinator batch launched on Framer. Taken together, those facts indicate that Framer is no longer a niche designer tool; it is already embedded in the launch stack of venture-backed startups and is trying to turn that startup credibility into a broader enterprise motion.\n\nThe geographical footprint also looks bigger than the company’s Amsterdam origins alone would imply. Business Wire and Sifted both point to Amsterdam roots with offices in San Francisco and Barcelona, while the founder letter thanks team members in New York as well. That pattern is consistent with a company keeping product and culture\
    \ close to its Dutch base while building more customer-facing capacity in the United States.\n\nHeadcount is the one major scale metric that remains noisy. LinkedIn exposes a 51–200 company-size band, 742 associated public profiles, and 130k-plus followers, but those numbers are not directly reconcilable without internal HR data. The safe read is that Framer has already achieved enough scale to support a serious go-to-market push, yet investors should treat exact employee count and functional mix as unresolved until management provides a cleaner disclosure.\n        "
  claimRefs:
