- id: founders-and-governance
  title: Founders, leadership, and governance visibility
  body: "Framer’s founder-market fit is unusually clear. Public sources consistently identify Koen Bok and Jorn van Dijk as the founders, and multiple sources link them back to Sofa, the Amsterdam design studio they sold to Facebook in 2011. Bok’s personal site says he worked on messages, ads, and video at Facebook, while van Dijk’s site and Framer’s own founder interview emphasize a long-running ambition to make the web more expressive. That background gives Framer a defensible “designed by product designers for product designers” narrative that helps explain why the company resonates with visually demanding startups and marketing teams.\n\nThe founder interview on Framer’s own blog is especially useful because it documents a hard pivot rather than a straight-line success story. It says Framer began as a prototyping product, spent about a year acknowledging that the original wedge was too narrow, and then spent roughly nine to ten months rebuilding around the website-publishing opportunity.\
    \ That history matters because it shows management was willing to abandon a respected but constrained product in pursuit of a larger market.\n\nWhat is less visible is the company’s current oversight structure. LinkedIn exposes a headquarters location and broad employee signals, and The Org shows that Framer has an eight-person leadership team, but the public record still does not surface a board roster or much detail on independent governance. For a Series D company, that leaves meaningful key-person dependence concentrated in the founding duo and a governance diligence gap that later chapters should continue to flag.\n        "
  claimRefs:
