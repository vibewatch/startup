company:
  name: Framer
chapter:
  number: 1
  title: Company Overview
  summary: Framer has grown from a design-tool origin story into a growth-stage hosted website platform that now claims more than half a million monthly users, hundreds of thousands of active sites, and a $2B post-Series-D valuation. Public sources agree on the 2025 financing, customer momentum, and enterprise push, but still leave noise around founding chronology, exact headcount, and board visibility. The core company-level takeaway is that Framer now looks like a design-led SaaS platform with real scale, repeat-investor conviction, and visible lock-in trade-offs.
sections:
- id: identity-and-positioning
  title: Identity, positioning, and product scope
  body: "Framer now presents itself as the website builder “loved by designers,” but the product it describes is broader than a simple drag-and-drop site creator. The official homepage, Series D post, Product Hunt profile, and developer documentation all converge on the same pitch: designers and marketers can ship a full website directly in Framer without handing work off to a front-end team, while technical users can still extend the experience with React and JavaScript when needed. That hybrid message matters because it explains why Framer sits between classic template-led builders such as Wix or Squarespace and more developer-oriented tools such as Webflow.\n\nThe official materials also make clear that Framer is selling a hosted SaaS workflow rather than a downloadable design tool. The pricing FAQ ties custom domains to paid plans, while the free plan acts as a product-led funnel with CMS, page, and editor limits. The company’s own Series D narrative frames Framer as the place where\
    \ teams can “run their entire .com,” not just prototype one. The bundled feature set it highlights — CMS, analytics, A/B testing, funnel tracking, live collaboration, AI features, and enterprise security — reinforces that the company is now competing for the operating layer of marketing and brand websites.\n\nThe remaining caveat is that Framer’s public positioning is company-authored and therefore directional rather than neutral. Independent reviews broadly agree that Framer excels for design-forward marketing sites, but they also describe a tighter fit for brand sites than for complex commerce or database-heavy use cases. That makes the overview chapter’s core takeaway straightforward: Framer’s identity has matured from design software into a production website platform, but its differentiation still depends on preserving the design-first workflow that made it attractive in the first place.\n        "
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO033
