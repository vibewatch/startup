      - number: '6.3'
        title: Retention looks directionally positive, but public durability proof remains proxy-based
        blocks:
          - type: paragraph
            body: >-
              Public durability evidence for Framer is usable but indirect. The best proxy is not a cohort table; it is
              evidence that named customers keep broadening internal ownership once they land. Perplexity says nearly
              every public-facing marketing page lives in Framer. Bilt says the platform expanded from a paid-traffic
              landing page into the homepage and then into all landing pages for the logged-out experience. Cal.com says
              the whole site is now in Framer, while Mixpanel says design and marketing own 90% of changes and can
              launch A/B tests in hours. These are all land-and-expand or embedded-workflow signals, even though they do
              not disclose contract renewal rates.

              Community and practitioner evidence is similarly mixed but mostly constructive. Product Hunt shows a 4.8
              rating from 254 reviews and repeated praise for speed, design quality, animation, and Figma-like workflow.
              But the same Product Hunt page, plus HostAdvice and Goodspeed, repeatedly surface the same friction
              points: a steeper learning curve than simple drag-and-drop builders, limited CMS depth for heavier content
              models, pricing pressure as editor seats grow, and support or billing complaints at the margin. Those
              frictions matter because they define the line between a sticky design-led web platform and a tool that
              stalls at more complex accounts. Framer's public source set supports positive engagement and expansion
              proxies, but not a true portfolio-level retention claim.
