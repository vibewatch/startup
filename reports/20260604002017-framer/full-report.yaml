  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing
        blocks:
          - type: paragraph
            body: >-
              Framer sits inside a layered market, not a single cleanly defined category. The narrowest lens is “website
              builder software,” where publishers such as Custom Market Insights and Global Growth Insights size the
              market in the low single-digit billions. The broadest lens is low-code and no-code development tooling,
              where IDC, Precedence Research, and MarketsandMarkets land in the tens of billions. Both frames are
              relevant, but neither perfectly maps to Framer. The website-builder view captures Framer’s direct
              substitutes — Wix, Squarespace, WordPress.com, Webflow, and other tools used to launch and operate sites
              without heavy engineering. The broader no-code/low-code view matters because AI-assisted website creation,
              templates, workflows, and non-technical production all increasingly overlap with app builders, content
              platforms, and developer-productivity tools.


              That layered framing explains why public estimates diverge. Custom Market Insights pegs the
              website-builder market at $2.8B in 2025 and $5.5B by 2035, while Reanin places the same label above $10B
              in 2025. Those numbers are not directly contradictory so much as differently scoped: some publishers mean
              pure DIY site builders, while others roll in more of the digital-presence stack. The broader low-code
              figures are larger still, with IDC at $21.0B in 2026 and Precedence Research at $15.81B in 2026 for
              low-code development platforms.


              For diligence purposes, the right conclusion is not to pick one TAM headline and move on. Framer’s real
              market sits between the narrow DIY-builder definition and the full low-code universe: premium,
              professionally managed websites for teams that want speed, polish, and governance without building a
              bespoke stack.
                      
