          The company is not distressed, but downside asymmetry is elevated because the mark sits well above public
          web-platform comps.
        - Require explicit kill criteria and post-round monitoring if diligence continues.
      - - Valuation stance
        - Stretched
        - ~40x current ARR and ~20x forward ARR are premium levels for a company with private retention and margin data.
        - Entry discipline matters more than company-quality admiration.
      - - What would improve the view
        - More disclosure or a better price
        - NRR, gross margin, enterprise mix, and clean round terms could justify a higher-quality multiple.
        - A follow-on diligence cycle could move the stance from stretched toward fair if data is strong.
    notes: >-
      This table is intentionally price-sensitive: recommendation and stance are driven by the retained comp set and by
      what remains private, not by product quality alone.
    claimRefs:
      - CV037
      - CV038
      - CV042
      - CV043
      - CV044
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Current view
      - What would change the view
    rows:
      - - Design-led premium thesis
        - >-
          Framer has enough product quality and growth momentum to deserve a premium to slower or more mature website
          peers.
        - Sustained enterprise ACV proof and retention disclosure would strengthen this thesis materially.
      - - Execution anti-thesis
        - At $2 billion, much of the obvious upside may already be prepaid before cohort quality is proven.
        - A materially lower entry price or exceptional disclosed unit economics would weaken the anti-thesis.
      - - Market-structure thesis
        - The gap between design-led execution and developer-heavy workflows is still valuable for marketing teams.
        - If Webflow, Wix Studio, or open stacks erase the workflow advantage, premium support weakens quickly.
      - - Lock-in anti-thesis
        - No-export architecture can support retention but also creates procurement friction for sophisticated buyers.
        - >-
          If management shows that large customers accept lock-in because Framer wins on speed and governance, the risk
          moderates.
      - - Public-comp thesis
        - Public comps show Framer does not need Shopify-like scale to justify a solid business.
        - They do not show a clear reason for Framer to sit far above the public web-comp range today.
      - - Disclosure anti-thesis
        - Missing NRR, gross margin, cap-table, and ARR-mix data block a higher-conviction buy call.
        - Clean management disclosure on those items is the shortest path to changing the rating.
    notes: >-
      Rows pair the investment thesis with the exact evidence or disclosure that would change the call rather than
      treating conviction as static.
    claimRefs:
      - CV006
      - CV007
      - CV037
      - CV038
      - CV039
      - CV041
      - CV044
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Valuation logic
      - Implied value
      - Probability signal
    rows:
      - - Bull
        - Framer reaches or exceeds $100M ARR, preserves break-even, and proves enterprise ACV expansion.
        - 22x-28x forward ARR, still below Figma-like strategic premiums but supportive of a premium private mark.
        - $2.2B-$2.8B
        - Needs evidence that business-majority customer mix is converting into durable enterprise revenue.
      - - Base
        - >-
          Framer grows meaningfully but below the clean premium narrative, with ongoing disclosure gaps around retention
          and margins.
        - >-
          14x-18x ARR on an $80M-$90M operating base, closer to premium public software ranges than to 2022 private
          peaks.
        - $1.1B-$1.6B
        - Most consistent with current public-comp evidence and limited private disclosure.
      - - Bear
        - >-
          Growth stalls near current ARR levels or procurement friction around lock-in/CMS fit reduces enterprise
          conversion.
        - 8x-12x revenue/ARR framing, closer to normalized public-web multiples plus private discount.
        - $0.6B-$1.0B
        - Triggered by missed ARR path, renewed financing need, or worsening public-comp multiples.
    notes: >-
      Scenario values are valuation ranges, not management forecasts; they anchor on retained public comps, private
      reference marks, and the explicit uncertainty around Framer's undisclosed revenue mix.
    claimRefs:
      - CV035
      - CV036
      - CV039
      - CV040
      - CV041
  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Metric used
      - Multiple / valuation
      - Relevance to Framer
      - Main limitation
    rows:
      - - Wix
        - June 2026 market cap vs 2025 revenue
        - $2.30B market cap / $1.99B revenue = ~1.2x
        - Direct public website-builder reference with full disclosure cadence.
        - Mature public company with slower growth than Framer.
      - - Squarespace
        - 2024 take-private EV vs 2023 revenue
        - $6.9B announced EV on $1.012B revenue = ~6.8x
        - Design-led website platform with disclosed revenue and a recent control transaction.
        - Take-private value is not the same as a live 2026 public multiple.
      - - Shopify
        - June 2026 market cap vs TTM revenue
        - $146.55B market cap / $12.36B TTM revenue = ~11.9x
        - Shows what a scaled, category-defining commerce platform can command in public markets.
        - Broader commerce OS, not a pure website-platform peer.
      - - Webflow
        - 2022 Series C valuation vs near-term ARR
        - $4B valuation as ARR approached $100M = ~40x ARR
        - Closest late-stage no-code website-platform private funding reference.
        - 2022 was a much hotter funding market than 2026.
      - - Contentful
        - 2021 Series F headline valuation
        - $3B private valuation headline
        - Useful upmarket content-platform reference for enterprise software appetite.
        - Retained sources do not disclose revenue, so no clean multiple is available.
      - - Figma / Adobe deal
        - 2022 announced transaction vs exit ARR
        - $20B announced value on >$400M ARR = ~50x ARR
        - Shows the upside investors paid for category-leading design software with elite retention.
        - Strategic design-platform reference, not a direct website-platform comp.
    notes: >-
      This enumeration is exhaustive for the six comp families explicitly requested in the chapter brief; rows mix
      current public multiples with older private or strategic marks, so the relevance and limitation columns matter as
      much as the raw numbers.
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Covers the six valuation reference sets explicitly requested for this chapter using direct public evidence
        retained on 2026-06-04.
    claimRefs:
      - CV014
