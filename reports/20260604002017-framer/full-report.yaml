  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >
              Framer's valuation chapter starts from one unusually clear private-market anchor: the company itself,
              TechCrunch, and Business Wire all line up on the headline August 2025 Series D terms. Framer raised $100
              million at a $2 billion valuation, TechCrunch reported $50 million of ARR in 2025 with a stated goal to
              cross $100 million the following year, and both company and press materials described the business as
              break-even into the round. That is a strong operating narrative for a private SaaS company and explains
              why the round can be discussed as more than pure momentum financing.


              The problem is not the existence of traction. The problem is the amount of valuation already embedded in
              the headline. At $2 billion on $50 million of reported ARR, Framer is effectively marked at about 40x
              current ARR. Even if management reaches the publicly discussed $100 million ARR goal, the round still
              implies about 20x forward ARR. Those are premium software multiples, not ordinary website-builder
              multiples, and they leave little room for disappointment.


              Entry discipline therefore has to be explicit. Framer may deserve a premium for design-led growth,
              enterprise momentum, and a profitable operating posture, but the public pack still does not show cohort
              retention, gross margins, or revenue mix by self-serve versus business versus enterprise. That means the
              investment question is not “is Framer good?” but “does the current price already discount most of the
              obvious upside?”
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
