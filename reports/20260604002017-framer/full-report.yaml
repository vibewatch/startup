          unit: x
        - label: Framer current multiple at $50M ARR
          value: 40
          unit: x
        - label: Webflow 2022 Series C implied ARR multiple
          value: 40
          unit: x
        - label: Figma 2022 announced deal implied ARR multiple
          value: 50
          unit: x
    approximationNotes: >-
      Bars mix revenue and ARR multiples because the retained private references disclose ARR while the public comps
