      - number: '2.3'
        title: Growth drivers and adoption tailwinds
        blocks:
          - type: paragraph
            body: >-
              Several structural forces are expanding demand for Framer-adjacent products at the same time. First is the
              continuing digitization of SMEs and startups. Clutch’s 83% website-adoption figure and Network Solutions’
              81% online-research figure imply that a website is no longer optional for most businesses that want to be
              discoverable and trusted. Second is the ongoing shortage of engineering time. IDC explicitly ties growth
              in low-code and no-code tools to the global shortage of full-time developers, which is exactly the pain
              Framer targets when it promises no handoff from design to code.


              Third is the fact that cloud delivery and AI now compound rather than substitute for one another. IDC says
              cloud deployments will produce more than 75% of LCNCIDT revenue by 2026, and the website-builder reports
              consistently describe cloud SaaS delivery as the dominant model. That matters because cloud builders can
              ship AI features, collaboration, analytics, and hosting improvements continuously. Framer, Webflow, and
              Wix now all market AI as core workflow acceleration rather than a novelty. In practical terms, AI lowers
              the effort to get to a first draft, while cloud infrastructure keeps distribution, updates, and
              optimization centralized.


              For Framer specifically, the most attractive driver mix is the intersection of design-first teams, fast
              launch cycles, and the desire to avoid developer bottlenecks without sacrificing visual control. That is a
              real growth tailwind, but it also invites more competition, because the same underlying trends are making
              adjacent platforms smarter and easier to use.
                      
            claimRefs:
