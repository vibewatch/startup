            body: >
              The comp set supports a clear but mixed message. On one side are public or fully disclosed web-platform
              references: Wix screens at roughly 1.2x revenue using retained June 2026 market-cap data, while
              Squarespace's 2024 take-private works out to roughly 6.8x to 7.1x revenue based on its disclosed 2023
              revenue base. Shopify, which is a much broader commerce operating system than Framer, still screens at
              about 11.9x revenue. That public spread matters because it shows how hard it is for a website-oriented
              platform to sustain premium valuation without either exceptional growth or category expansion.


              On the other side sit premium private or strategic references. Forbes reported that Webflow's 2022 Series
              C valued the company at $4 billion as it neared $100 million of ARR, implying roughly 40x ARR. Adobe's
              announced Figma transaction implied roughly 50x ARR on more than $400 million of expected 2022 ARR, with
              best-in-class retention and gross margin. Contentful's $3 billion Series F gives another growth-stage
              software reference, but without the revenue disclosure needed to derive a clean multiple.


              The right takeaway is not to average these marks mechanically. Webflow and Figma show that design-led or
              no-code workflows can command very high multiples under strong growth conditions. Public comps show that
              those marks can compress sharply when markets normalize. Framer sits between those worlds: better growth
              story than Wix or Squarespace, but far less disclosure than Shopify and not enough public evidence to
              claim a Figma-like quality premium.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
