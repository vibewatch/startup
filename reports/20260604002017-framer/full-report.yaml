      - number: '8.4'
        title: What remains private and what would change the call
        blocks:
          - type: paragraph
            body: >
              The central diligence gap is not a missing customer logo or a missing fundraising headline. It is the
              absence of the metrics that turn a growth story into a defensible entry price. Public materials do not
              disclose Framer's retention profile, gross margins, cash conversion, ARR mix by plan tier, or round terms
              such as liquidation preferences and secondary content. That makes it impossible to test whether the
              company deserves to trade like an outlier software platform or whether the current mark already assumes a
              best-case monetization path.


              These omissions matter because Framer's current valuation already embeds optimistic execution. A buyer can
              get comfortable that the company has meaningful product quality, startup pull, and enterprise ambition.
              What the buyer cannot yet get comfortable with from public evidence is the durability of that revenue, the
              profitability of scaling it, and the exact contractual rights sitting ahead of new money.


              The practical implication is that the recommendation can improve without the company changing much
              operationally. If management discloses cohort retention, gross-margin quality, enterprise ACV mix, and
              clean cap-table terms—and if those disclosures show that the business really is growing into a high-teens
              or low-twenties forward ARR multiple—then today's stretched mark could move toward fair. Until then, the
              right move is disciplined monitoring rather than aggressive entry.
            claimRefs:
              - CV038
              - CV044
              - CV049
              - CV050
              - CV051
              - CV052
          - type: table
            tableRef: TV006
            claimRefs:
              - CV044
              - CV049
              - CV050
              - CV051
              - CV052
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The company can be good and the entry can still be wrong
            body: >-
              Framer has enough traction and product credibility to stay on an investor watchlist. The problem is not
              quality; it is paying a premium price before the private metrics that support that premium are disclosed.
            calloutType: strength
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV038
              - CV042
          - type: callout
            title: The round only looks clean if the business really grows into enterprise-quality revenue
            body: >-
              The retained evidence makes the $2 billion mark easiest to defend if the business-customer shift becomes
              durable enterprise ARR with strong retention and healthy software margins.
            calloutType: assumption
            claimRefs:
              - CV004
              - CV005
              - CV039
              - CV044
              - CV051
          - type: callout
            title: Downside can arrive faster than upside if growth or software multiples wobble
            body: >-
              Because Framer already sits above public web-platform comps, any miss on the path to $100 million ARR or
              any further compression in software multiples could reset value before revenue catches up.
            calloutType: risk
            claimRefs:
              - CV035
              - CV036
              - CV045
              - CV047
