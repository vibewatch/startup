      - number: '4.5'
        title: Public comparables, disclosure asymmetry, and final underwriting view
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to interpret Framer's public economics is by comparing disclosure depth, not just
              headline growth, with adjacent platforms. Wix discloses quarterly bookings, revenue, selective ARR,
              gross-margin commentary, and capital-return programs. Squarespace disclosed revenue by segment, ARRR,
              subscriptions, debt, and free cash flow before its take-private. Shopify publishes a full breakdown across
              subscription and merchant solutions, gross profit, GMV, and free cash flow at enormous scale. Even
              Webflow, while still private, has third-party revenue and customer estimates that at least let investors
              triangulate scale.


              Framer does not offer that level of visibility. It gives enough information to support a positive
              qualitative read: a real free-to-paid funnel, recurring pricing, business-customer momentum, a credible
              break-even statement, and a large recent financing round. But the chapter's central financial conclusion
              is still conditional. Framer may ultimately deserve a premium multiple if enterprise adoption, retention,
              and margins resemble the better software comps rather than the more infrastructure-heavy or
              SMB-churn-prone ones. The public record simply does not prove that yet. Investors should therefore treat
              Framer as a subscription-led hosted web platform with promising economics and insufficient disclosure, and
              make cash, burn, realized pricing, retention, and margin bridges hard diligence gates before underwriting
              valuation confidence.
