      - number: '5.4'
        title: Hosting, security, and enterprise deployment
        blocks:
          - type: paragraph
            body: >-
              Framer's hosting and security story is a meaningful part of the product, not an afterthought. The hosting
              page describes warm pools for traffic spikes, global caching, on-demand rendering, and automatic edge
              optimization for images and other assets. The security page adds a more concrete trust narrative: AWS
              hosting across multiple availability zones, encryption, separation of environments, code review,
              dependency management, Sentry, SIEM monitoring, penetration testing, and tested backup restoration.
              Enterprise pages then wrap those runtime controls in governance features such as SSO, RBAC, custom
              permissions, and contact-led procurement. The compare and pricing surfaces also suggest that staging,
              rollback, rewrites, and custom security headers become part of the higher-end operational package. The net
              result is a product that looks ready for serious marketing-site operations and reasonably mature
              enterprise procurement conversations. The missing piece is transparency: Framer publishes many controls
              but not the sort of public uptime SLA, incident history, or support-response metrics that would let an
              investor independently benchmark reliability against a mature infrastructure vendor.
