            body: >-
              Framer now sells more than a visual editor. The official home, pricing, and enterprise surfaces present a
              bundled operating layer for company websites: start with AI or a blank canvas, design responsively, bind
              content to a CMS, publish on managed hosting, and then keep iterating with analytics, forms, localization,
              and SEO inside the same environment. That end-to-end positioning is important because it explains why
              Framer has moved beyond its design-tool origins and into direct competition with professional web-platform
              vendors. The product's core promise is that designers and marketers can ship and maintain the company .com
              without a traditional developer handoff for everyday work. Public limits also show where the bundle is
              opinionated rather than open-ended. The product looks strong for brand, campaign, and marketing sites, but
              the published page, event, CMS, and bandwidth ceilings confirm that Framer is still packaging a managed
