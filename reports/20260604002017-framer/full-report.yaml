      - number: '3.3'
        title: Specialized substitutes and adjacent platforms
        blocks:
          - type: paragraph
            body: >-
              Once the buyer job stops being “ship a high-quality marketing site fast,” Framer's substitute set widens
              quickly. Bubble is the clearest example. Its workload-based pricing, hosting-location choices, SSO,
              backups, and security controls all point toward logic-heavy web and mobile applications, not just brand
              sites. A startup deciding between Framer and Bubble is usually deciding whether it needs a marketing
              surface or an application platform.


              Cargo and Ghost are narrower but not trivial. Cargo is built for designers and artists who want portfolios
              or light commerce with relatively low-cost packaging. Ghost is optimized for publishers, newsletters,
              memberships, and audience monetization, with paid subscriptions and analytics embedded directly into the
              product. These are not broad substitutes for every Framer use case, but they can be better products for
              buyers whose content model or monetization workflow is already obvious.


              Shopify, Contentful, and WordPress VIP sit at the upmarket end of substitution. Shopify is a commerce
              operating system with checkout, POS, B2B, payments, and markets. Contentful is a composable content
              platform built around APIs, governance, and localization. WordPress and WordPress VIP remain the broadest
              alternative of all because they combine a massive installed base with an enterprise layer and an open
              ecosystem that many large organizations already understand.
