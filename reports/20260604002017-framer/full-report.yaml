chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, positioning, and product scope
        blocks:
          - type: paragraph
            body: >-
              Framer now presents itself as the website builder “loved by designers,” but the product it describes is
              broader than a simple drag-and-drop site creator. The official homepage, Series D post, Product Hunt
              profile, and developer documentation all converge on the same pitch: designers and marketers can ship a
              full website directly in Framer without handing work off to a front-end team, while technical users can
              still extend the experience with React and JavaScript when needed. That hybrid message matters because it
              explains why Framer sits between classic template-led builders such as Wix or Squarespace and more
              developer-oriented tools such as Webflow.


              The official materials also make clear that Framer is selling a hosted SaaS workflow rather than a
              downloadable design tool. The pricing FAQ ties custom domains to paid plans, while the free plan acts as a
              product-led funnel with CMS, page, and editor limits. The company’s own Series D narrative frames Framer
              as the place where teams can “run their entire .com,” not just prototype one. The bundled feature set it
              highlights — CMS, analytics, A/B testing, funnel tracking, live collaboration, AI features, and enterprise
              security — reinforces that the company is now competing for the operating layer of marketing and brand
              websites.


              The remaining caveat is that Framer’s public positioning is company-authored and therefore directional
              rather than neutral. Independent reviews broadly agree that Framer excels for design-forward marketing
              sites, but they also describe a tighter fit for brand sites than for complex commerce or database-heavy
              use cases. That makes the overview chapter’s core takeaway straightforward: Framer’s identity has matured
              from design software into a production website platform, but its differentiation still depends on
              preserving the design-first workflow that made it attractive in the first place.
                      
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO033
              - CO034
              - CO037
              - CO038
              - CO041
              - CO047
              - CO049
      - number: '1.2'
        title: Founders, leadership, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Framer’s founder-market fit is unusually clear. Public sources consistently identify Koen Bok and Jorn van
              Dijk as the founders, and multiple sources link them back to Sofa, the Amsterdam design studio they sold
              to Facebook in 2011. Bok’s personal site says he worked on messages, ads, and video at Facebook, while van
              Dijk’s site and Framer’s own founder interview emphasize a long-running ambition to make the web more
              expressive. That background gives Framer a defensible “designed by product designers for product
              designers” narrative that helps explain why the company resonates with visually demanding startups and
              marketing teams.


              The founder interview on Framer’s own blog is especially useful because it documents a hard pivot rather
              than a straight-line success story. It says Framer began as a prototyping product, spent about a year
              acknowledging that the original wedge was too narrow, and then spent roughly nine to ten months rebuilding
              around the website-publishing opportunity. That history matters because it shows management was willing to
              abandon a respected but constrained product in pursuit of a larger market.


              What is less visible is the company’s current oversight structure. LinkedIn exposes a headquarters
              location and broad employee signals, and The Org shows that Framer has an eight-person leadership team,
              but the public record still does not surface a board roster or much detail on independent governance. For
              a Series D company, that leaves meaningful key-person dependence concentrated in the founding duo and a
              governance diligence gap that later chapters should continue to flag.
                      
