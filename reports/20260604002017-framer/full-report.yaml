  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing private metric
      - Impact
      - Current public substitute
      - Why substitute is insufficient
      - Exact diligence path
    rows:
      - - Cash balance
        - Blocks runway analysis and downside planning
        - Series D size and break-even claim
        - A raise amount and a profitability quote do not reveal cash remaining
        - Request latest balance sheet, bank balances, and monthly cash waterfall
      - - Net and gross burn
        - Blocks capital adequacy under hiring or slowdown scenarios
        - Break-even statement
        - Break-even does not reveal working-capital swings, capex, or cash burn timing
        - Request trailing 12-month cash flow and monthly burn by function
      - - ARR split by segment
        - Blocks revenue-quality and GTM-mix underwriting
        - $50M ARR anchor plus business-majority new customer claim
        - ARR total does not show how much is self-serve, business, enterprise, or add-ons
        - Request ARR bridge by cohort, geography, and product family
      - - Gross margin and hosting / AI cost bridge
        - Blocks margin-path judgment
        - Hosted feature stack and usage pricing
        - Public feature pages imply cost drivers but not actual cost structure
        - Request COGS by hosting, CDN, AI, support, and third-party services
      - - CAC, payback, and sales-cycle data
        - Blocks assessment of enterprise efficiency and capital intensity
        - Product-led funnel visibility and business-mix claims
        - Surface-level PLG evidence does not reveal sales productivity or marketing efficiency
        - Request CAC by channel, payback by segment, pipeline conversion, and enterprise cycle length
      - - Retention, churn, and NRR
        - Blocks durable revenue-quality verdict
        - Business-customer growth and named-logo momentum
        - Customer logos and growth statements say little about renewal durability
        - Request logo retention, dollar retention, expansion, and churn by cohort
      - - Realized pricing and discounting
        - Blocks pricing-power and ASP analysis
        - List pricing and add-on schedule
        - Headline prices do not reveal monthly share, negotiated enterprise discounts, or net realization
        - Request discount waterfall, annual commitment share, and contract minimums
    notes: >-
