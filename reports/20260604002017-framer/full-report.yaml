    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      Framer's current and forward implied multiples sit above retained public web-platform comps and only overlap with
      older premium private design/no-code marks.
    data:
      items:
        - label: Wix revenue multiple
          value: 1.2
          unit: x
        - label: Squarespace take-private multiple
          value: 6.8
          unit: x
        - label: Shopify revenue multiple
