  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing architecture
        blocks:
          - type: paragraph
            body: >-
              Framer's public monetization surface looks like a classic hosted SaaS ladder, but with more usage
              sensitivity than a simple seat-only software tool. The free plan is intentionally generous enough to let
              designers and marketers build inside the product, yet it blocks custom domains and caps CMS, page, locale,
              and editor capacity. Paid monetization then starts with annual site plans, expands through editor seats
              and content-editor roles, and scales further through usage add-ons for locales, CMS items, bandwidth,
              pages, analytics events, and advanced hosting. Enterprise sits on top as a quote-led package built around
              custom limits, enterprise security, and dedicated support.


              That structure matters for revenue quality. It means Framer is not primarily monetizing advertising,
              transactions, or services; it is monetizing recurring website infrastructure and workflow access. The
              trade-off is that revenue is still partly tied to infrastructure-heavy usage. Scale already bundles
              premium CDN, events and funnels, and flexible limits, while the company also states that sites cannot be
              exported because production delivery depends on dynamic backend services such as prerendering and image
              optimization. So the same hosted stack that improves retention and upsell potential also makes hosting,
              bandwidth, analytics, AI, and support real cost centers. Public materials are therefore strong on list
              pricing mechanics but still weak on realized pricing, discounting, and the share of revenue coming from
              base subscriptions versus seats, add-ons, or enterprise contracts.
            claimRefs:
