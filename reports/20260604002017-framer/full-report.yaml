      - number: '4.4'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Framer's latest financing looks more like acceleration capital than rescue capital. The company raised
              $100M at a $2B valuation in August 2025, and management paired that announcement with a statement that
              Framer had already been break-even for the prior year. Publicly disclosed uses of funds were US expansion,
              deeper AI investment, and continued product and go-to-market scaling. That combination materially lowers
              the probability that the company needed the round simply to cover operating losses, especially relative to
              earlier-stage AI or no-code businesses that are still explicitly burning to discover product-market fit.


              But the underwriting gap remains large because the public record never converts that financing event into
              a runway calculation. No reviewed source discloses cash on hand, net burn, gross burn, debt, covenant
              structure, or a next-round trigger. This is where the comparison to public peers becomes useful.
              Squarespace's filings disclose cash, debt, bookings, ARRR, and free cash flow; Shopify's filings disclose
              revenue mix, gross profit, and free cash flow; Wix's results discuss bookings, margins, repurchases, and
              investment capacity. Framer discloses none of those balance-sheet or cash-flow anchors. The right verdict
              is therefore balanced: near-term financing dependency appears low because the company raised fresh capital
              while claiming break-even status, but capital adequacy cannot be completed without management materials on
              cash, burn, and obligations.
