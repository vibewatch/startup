      - number: '7.3'
        title: Security, reliability, hosted infrastructure, and ecosystem dependence
        blocks:
          - type: paragraph
            body: >-
              Framer's security page is substantive enough to show a real control program. The company discloses AWS
              multi-AZ hosting in the United States, encryption and key-management practices, network segmentation,
              logging, SIEM monitoring, code review, dependency management, and backup-restore testing. The problem is
              not absence of controls; it is dependence and transparency. AWS is still a concentrated infrastructure
              dependency, the terms explicitly disclaim uninterrupted service, and the reviewed Framer materials do not
              publish a public uptime SLA or incident-history view comparable to Webflow's 99.99% uptime claim. For
              enterprises that want to standardize on a hosted website layer, that gap matters.


              Framer's extensibility story adds another dependency layer. The developer surface is tied to React and
              JavaScript, Motion is documented as React-native tooling, and the terms narrow support obligations around
              third-party packages and components. That design gives technical designers meaningful power, but it also
              means Framer inherits external ecosystem shifts in skills, framework direction, plugin quality, and
              compatibility. The CSP help article reinforces the same pattern at the infrastructure level: deeper
              security customization is possible, but better implementations often depend on higher-tier hosting
              features or reverse-proxy workarounds rather than simple default settings.
