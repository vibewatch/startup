      - number: '4.3'
        title: Cost structure, margin drivers, and unit-economics visibility
        blocks:
          - type: paragraph
            body: >-
              The public evidence suggests Framer should have better gross-margin potential than a commerce take-rate
              platform, but not the near-zero marginal cost profile of a purely collaborative design tool. Its plans
              include secure hosting, SEO, analytics, CMS, localization, and collaboration, and the company explicitly
              says production websites rely on backend services such as prerendering, image resizing, and font
              subsetting. Scale and advanced add-ons add more bandwidth, locales, events, rewrites, security headers,
              and premium CDN capacity. In other words, Framer is selling recurring software, but a software product
              whose delivery economics are meaningfully exposed to traffic, storage, AI inference, analytics events, and
              support intensity.


              That is why the missing private metrics matter. Public materials let us infer the monetization chain and
              some cost drivers, but not the actual gross-margin bridge. There is no public disclosure for gross margin,
              hosting cost per site, AI credit burn, CAC, payback, churn, NRR, or sales efficiency. Goodspeed's
              independent review also reinforces that effective spend can rise above headline pricing because editor
              seats and add-ons accumulate. The safest read is therefore directional: Framer likely has cleaner
              recurring revenue than a transaction-heavy platform such as Shopify, but less public proof of margin
              durability than public peers such as Wix or Squarespace. That makes unit-economics diligence an
              information problem rather than a pure product-quality problem.
