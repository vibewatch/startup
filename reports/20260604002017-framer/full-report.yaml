  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: >-
      Framer scores well on product and growth proof, but weakly on valuation support and disclosure completeness at the
      current mark.
    data:
      items:
        - label: Product / workflow proof
          value: 8/10
          detail: Design-led speed and customer pull are well evidenced.
          tone: positive
        - label: Revenue momentum
          value: 8/10
          detail: $50M ARR and $100M target imply strong growth momentum.
          tone: positive
        - label: Enterprise proof
          value: 6/10
          detail: Business-customer shift is visible, but ACV and renewal proof are still limited.
          tone: neutral
        - label: Retention visibility
          value: 3/10
          detail: No public NRR, GRR, or cohort churn tables.
          tone: warning
        - label: Economics visibility
          value: 4/10
          detail: Break-even is encouraging, but gross margin and cash-conversion detail are absent.
          tone: warning
        - label: Valuation support
          value: 4/10
          detail: Current mark remains above retained public web-platform comp ranges.
          tone: warning
        - label: Downside asymmetry
          value: 4/10
          detail: A miss on growth or public multiples would likely reset value quickly.
          tone: warning
    approximationNotes: Scores are IC-oriented judgment indicators synthesized from retained evidence; they are not a statistical model.
    claimRefs:
      - CV037
      - CV038
      - CV042
      - CV043
      - CV044
      - CV045
      - CV047
