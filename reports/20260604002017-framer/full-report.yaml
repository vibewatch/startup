      - number: '2.4'
        title: Constraints, fragmentation, and Framer-specific fit
        blocks:
          - type: paragraph
            body: >-
              The clearest market risk is that the category is becoming more crowded and more substitutable at the same
              time. Global Growth Insights flags platform parity, churn, and price-based switching as structural issues,
              and the official competitor pages make the fragmentation obvious: there are distinct product families for
              DIY sites, agencies, enterprises, app builders, publishers, commerce merchants, and headless content
              teams. That means “website builder” is no longer one market where a single winner can dominate every use
              case.


              This fragmentation cuts both ways for Framer. On one hand, it protects the company from being judged
              solely against mass-market DIY builders, because Framer’s buyers often care more about design quality,
              workflow, and speed than about the longest feature checklist. On the other hand, it means Framer’s SAM is
              narrower than the headline no-code or website-builder TAM numbers imply. Many buyers in the broad market
              will rationally choose Shopify for commerce, Bubble for apps, Webflow for heavier CMS needs, or Contentful
              for composable enterprise stacks.


              The result is that Framer’s market case is strongest when framed as a premium, design-led web platform
              category rather than as a generic website-builder TAM story. Public sources support the direction of that
              thesis, but they do not yet isolate the size of the premium professional-web subsegment cleanly enough to
              remove all uncertainty.
                      
            claimRefs:
