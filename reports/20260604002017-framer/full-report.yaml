      - number: '4.2'
        title: Free-to-paid funnel, GTM motion, and public traction
        blocks:
          - type: paragraph
            body: >-
              Framer's funnel is visible enough to describe even if it is not visible enough to model. The free plan
              gives prospects enough room to design, experiment with CMS, and collaborate with up to three editors, but
              pushes any serious company website toward paid conversion once a custom domain, more editors, larger
              limits, or richer operations are needed. That makes the public product ladder itself a strong signal that
              Framer's top of funnel is product-led, while the enterprise page and quote-led tier show that the company
              is also prepared to support sales-assisted procurement once teams outgrow standard limits.


              The traction data around that funnel are unusually strong for a private company. TechCrunch reported $50M
              ARR in 2025 with a $100M target for 2026, while Framer and Business Wire said the company had been
              break-even for the past year, had more than half a million monthly users, and powered hundreds of
              thousands of sites. Official and independent coverage also say businesses became the majority of new
              customers after business plans launched, and 40% of the most recent Y Combinator batch launched on Framer.
              Taken together, those points suggest that free designer adoption is turning into business usage and, at
              least at the surface level, into meaningful recurring revenue. What they do not show is conversion rate,
              enterprise ACV, payback, sales cycle length, or the split between self-serve and managed GTM.
