  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The recommendation follows a clear chain from real traction to premium pricing, then discounts that premium for
      disclosure and downside asymmetry.
    data:
      nodes:
        - id: traction
          label: Traction exists
          detail: Series D, break-even signal, and disclosed ARR show real operating progress.
        - id: premium
          label: Premium is plausible
          detail: Framer can justify a premium to slower public web peers if growth and enterprise mix remain strong.
        - id: comp-gap
          label: Comp gap remains wide
          detail: Current and forward implied multiples still sit above retained public web-platform ranges.
        - id: disclosure
          label: Disclosure gap
          detail: Retention, margin, mix, and cap-table terms remain private.
        - id: asymmetry
          label: Downside asymmetry
          detail: Missed ARR path or multiple compression would likely reset value faster than revenue grows.
        - id: call
          label: Recommendation
          detail: 'Track: strong company, stretched price, diligence still needed.'
      edges:
        - from: traction
          to: premium
          label: supports
        - from: premium
          to: comp-gap
          label: but does not erase
        - from: comp-gap
          to: disclosure
          label: becomes more problematic when
        - from: disclosure
          to: asymmetry
          label: which increases
        - from: asymmetry
          to: call
          label: drives
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV041
      - CV042
      - CV043
