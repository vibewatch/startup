      - number: '1.5'
        title: Milestones, pivot chronology, and the first visible risks
        blocks:
          - type: paragraph
            body: >-
              Framer’s strongest milestone narrative is not simply “design tool becomes unicorn”; it is that the company
              repeatedly widened the scope of what designers could control. The pre-Framer Sofa exit established founder
              credibility, the early prototyping product gave the team a respected wedge inside design organizations,
              and the later pivot toward direct website publishing attacked a much larger workflow problem: rebuilding
              designs in code. By the time of the Series D, that evolution had widened again to include analytics,
              on-page editing, enterprise security, and a claim that businesses can run their full website stack on
              Framer.


              Two open issues sit inside that otherwise strong chronology. First, the public founding timeline is
              inconsistent. Sifted says 2013, Tracxn says 2014, and Silicon Canals says 2015 when describing the
              original prototyping product. The likely explanation is that different sources are keying off
              incorporation, first financing, or product launch rather than the same event, but the discrepancy is real
              and worth preserving rather than smoothing over.


              Second, Framer’s design-led integration comes with visible lock-in. The help center explicitly says Framer
              sites cannot be exported to HTML for self-hosting because they depend on backend services such as
              pre-rendering and dynamic asset optimization. Independent reviews reinforce that this is a meaningful
              trade-off: Framer is praised for speed, aesthetics, and ease of launch, but criticized for weak fit in
              complex ecommerce or database-heavy use cases. That does not negate the company’s momentum, but it frames
              the main strategic question for the rest of the report: how much value buyers place on the integrated
              workflow versus the loss of portability.
                      
