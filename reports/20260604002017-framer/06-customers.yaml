- id: concentration-risks-and-private-gaps
  title: Expansion motion is visible, but concentration, churn, and contract economics remain private
  body: 'The best public customer-side expansion signal is the shift from developer-owned websites to design-and-marketing-owned websites. That pattern appears in Perplexity, Miro, Bilt, Cal.com, Mixpanel, the startup program, and the agency program. It likely improves expansion because once the website workflow is embedded with CMS, localization, analytics, permissions, A/B testing, and enterprise security, Framer becomes more than a one-off landing-page tool. The agency program adds another explicit expansion lever by subsidizing partner adoption and offering revenue share, while enterprise pages highlight SSO, RBAC, and compliance that make larger-team procurement easier.

    The risk side is just as important. Framer''s help center explicitly says sites cannot be exported to HTML for self-hosting, which likely boosts switching costs but can also create procurement friction for customers that want portability. Independent reviews and product listings repeatedly flag lock-in, CMS ceilings, pricing creep from extra editors, and a learning curve that is manageable for designers but tougher for generalist operators. The largest unresolved gap, however, is disclosure. No retained public source gives net retention, gross retention, churn, top-customer exposure, contract length, or revenue by customer cohort. That means investors can get comfortable that Framer has real customers and visible expansion pathways, but they still need management data to underwrite concentration risk and durability with confidence.'
