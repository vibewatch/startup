- calloutType: strength
  title: Named production proof is deep enough for a positive adoption verdict
  body: Framer is not relying on a logo wall alone. Official story pages for Perplexity, Miro, Bilt, Cal.com, and Mixpanel all describe live production usage with workflow outcomes that reduce developer dependence and broaden team ownership.
  claimRefs:
  - CU015
  - CU018
  - CU020
  - CU022
  - CU025
- calloutType: insight
  title: The real expansion loop is ownership transfer from developers to design and marketing
  body: Across the strongest references, Framer expands when the website stops being a developer-maintained artifact and becomes an operating surface controlled by design and marketing. That is the common thread behind Perplexity, Miro, Bilt, Cal.com, and Mixpanel.
  claimRefs:
  - CU015
  - CU018
  - CU021
  - CU022
  - CU025
  - CU044
- calloutType: risk
  title: Durability and concentration still require management data
  body: Reviews and account stories are directionally positive, but public sources still do not disclose NRR, GRR, churn, contract length, top-customer concentration, or segment-level ACV. Lock-in may help retention, yet support, pricing, and CMS ceilings remain visible objections.
