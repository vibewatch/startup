- id: named-proof-and-adoption-trajectory
  title: Named customer proof and adoption signals are strong enough to treat Framer as a real production platform
  body: 'Framer clears the named-customer-proof bar because the retained source set goes beyond logos. Official story pages show Perplexity running nearly every public-facing marketing page in Framer, Miro publishing independently with localization and a custom CMS plugin, Bilt scaling its logged-out design system and landing pages, Cal.com moving its whole site into Framer, and Mixpanel shifting most site changes to design and marketing. Those are all production-use descriptions rather than vague testimonials, and several include specific workflow outcomes such as faster launches, reduced developer dependency, or broader page ownership.

    The broader adoption trajectory is also visible. Framer''s own Series D post says more than half a million people use the platform each month and that close to half of the latest Y Combinator batch launched with Framer. Business Wire corroborates half a million monthly active users, hundreds of thousands of active websites, majority-business new-customer mix, and 40% of the most recent YC batch. The key caveat is proof depth dispersion. Perplexity, Miro, Bilt, Cal.com, and Mixpanel have direct story pages; Scale AI is named in official financing materials but does not have a retrieved dedicated case study in this source set. So Framer has enough proof to establish real production adoption, but not enough public detail to assign every named logo the same evidentiary weight.'
