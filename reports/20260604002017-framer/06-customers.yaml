  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Framer's NRR, GRR, logo churn, contract length, and cohort-retention data by customer segment.
    whyItMatters: Public story pages show adoption and workflow depth, but they cannot prove portfolio-level durability or renewal quality.
    diligencePath: Request renewal, churn, cohort, and contract-duration tables by self-serve, startup, agency, SMB, and enterprise cohorts.
    relatedQuestionRefs:
    - QU019
    - QU020
    - QU025
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-customer concentration, top-10 revenue share, ACV distribution, and customer counts by plan or revenue band.
    whyItMatters: Visible enterprise logos and startup momentum do not reveal whether revenue is broadly distributed or concentrated in a small set of larger accounts.
    diligencePath: Ask management for customer concentration, ACV buckets, plan mix, and top-customer dependency thresholds.
