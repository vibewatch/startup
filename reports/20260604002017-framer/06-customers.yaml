  - - Solo creators and freelancers
    - Buyer, user, and payer often collapse into one person
    - Portfolios, landing pages, small business sites, and rapid client prototypes
    - Free plan supports design-tool exploration, 10 CMS collections, 1,000 pages, and up to three editors; HostAdvice explicitly highlights freelancers
    - High logo volume and community influence, but likely low ACV per account
    - No public customer-count or revenue split for solo accounts
  - - Agencies and studios
    - Agency principal or web lead / designer and client collaborators / agency or client budget
    - Design-build-deliver client sites without developer handoff
    - Dedicated agencies program offers free unlimited access, up to 50% commission, and direct Slack support
    - Important partner and distribution channel with recurring referral economics
    - No public partner-count, partner-sourced ARR, or churn disclosure
  - - Venture-backed startups
    - Founder or growth/design lead / designer-marketer-founder / founder or marketing budget
    - Launch brand site, campaigns, docs-adjacent pages, and early growth surfaces quickly
    - Startup program, YC page, and 40%-plus recent YC batch signal
    - Efficient acquisition wedge and future upmarket pipeline
    - No public conversion from startup accounts to business or enterprise ACVs
  - - SMB and small-business buyers
    - Owner or lean marketing lead / same small team / owner or departmental budget
    - Publish professional website without custom engineering resources
    - Slashdot lists small businesses as the most common user cohort
    - Broad bottom-of-funnel volume likely supports PLG economics
    - No public SMB retention, ARPU, or sector breakdown
  - - Enterprise marketing and web teams
    - VP Marketing, web lead, or brand/design lead / designers, marketers, content editors / marketing, brand, or digital budget
    - Run localized, governed, high-performance brand and campaign sites at scale
    - Enterprise page highlights SSO, RBAC, compliance, localization, and premium hosting; named stories show complex production use
    - Highest likely ACV and strongest expansion opportunity
    - No public enterprise customer count, ACV bands, or top-account exposure
  summary: Official pages support a five-cohort customer map ranging from PLG self-serve users to sales-assisted enterprise teams.
