company:
  name: Framer
chapter:
  number: 6
  title: Customers
  summary: 'Framer''s public customer record is convincing on real adoption across self-serve creators, agencies, startups, SMBs, and enterprise marketing teams. The strongest named proof comes from official story pages for Perplexity, Miro, Bilt, Cal.com, and Mixpanel, plus Series D materials naming Scale AI and strong Y Combinator cohort adoption. The main gaps are on durability quality and concentration: Framer does not publicly disclose NRR, GRR, churn, contract length, customer concentration, or segment-level ACV, so retention must be inferred from review evidence, workflow depth, and visible land-and-expand behavior.'
sections:
- id: customer-segmentation-and-channel-mix
  title: Customer segmentation spans self-serve creators, partners, startups, and upmarket web teams
  body: 'Framer''s customer base is broader than a simple "designer tool" framing suggests. Official surfaces show at least five live cohorts: solo creators and freelancers entering through the free or low-end paid plans; agencies and studios entering through a formal partner program; startups entering through the dedicated startup program and the YC-oriented startup page; SMB and small-business buyers using Framer as a website builder; and enterprise marketing, brand, and web teams that need localization, permissions, analytics, security, and sales support. The official gallery reinforces this segmentation by explicitly carving the showcase into agency, business, landing-page, personal, and startup categories, while the stories hub says 144,000 companies in 194 countries use Framer.

    That mix matters because buyer, user, and payer roles separate as accounts move upmarket. A freelancer or founder may buy and use Framer alone, but the named enterprise-style stories consistently show design and marketing teams collaborating, sometimes with agencies, and then layering on security, localization, or CMS integration. The result is a hybrid go-to-market model: PLG and community-led at the bottom, structured partner motion in the middle, and a sales-assisted enterprise motion at the top. What remains private is the actual customer mix by count, ARR, or ACV band. Public evidence shows the segments exist and are active; it does not show how much revenue comes from freelancers versus startups versus enterprise teams.'
