companyProfile:
  summary: >-
    Framer is an Amsterdam-founded, design-led software company building a hosted website platform for
    professional teams. After starting in prototyping and later pivoting into direct website publishing,
    the company now sells a bundled workflow that combines design canvas, CMS, analytics, AI-assisted
    creation, collaboration, and enterprise security. Public 2025 disclosures show more than half a
    million monthly users, hundreds of thousands of active sites, a $100M Series D at a $2B valuation,
    and reported break-even operations.
  foundedDate: '2013-01-01'
  founders:
    - name: Koen Bok
      role: CEO & co-founder
      background: Former Sofa co-founder and Facebook product designer who worked on messages, ads, and video before building Framer.
      claimRefs: [CO007, CO008, CO009]
    - name: Jorn van Dijk
      role: Co-founder & product/design leader
      background: Former Sofa and Facebook designer who led Framer's pivot from prototyping into website publishing.
      claimRefs: [CO007, CO008, CO010, CO011]
  foundingLocation: Amsterdam, Netherlands
  headquarters: Amsterdam, Netherlands
  productSummary: >-
    Framer is a hosted SaaS website platform that lets designers and marketers build, publish, optimize,
    and operate professional websites without a traditional front-end engineering handoff. The product
    combines a visual canvas with CMS, analytics, A/B testing, localization, forms, AI-assisted site
    generation, collaboration, premium hosting, and enterprise security features.
  customerFocus: >-
    Core buyers are design-led startup and SMB marketing teams, freelancers and agencies shipping client
    websites, and an adjacent enterprise segment that needs permissions, staging, security, and governed
    website operations.
  businessModel: >-
    Subscription SaaS model centered on hosted website plans, editor and content-editor seats, usage-based
    add-ons for capacity and operations, and quote-led enterprise packages for larger teams.
  stage: Series D private
  fundingStatus: >-
    Raised a $100M Series D in August 2025 at a $2B valuation led by Meritech and Atomico, following a
    $27M Series C in 2023 and earlier Atomico-backed funding.
  disclosureProfile: private-undisclosed
  claimRefs: [CO007, CO011, CO014, CO015, CO021, CO022, CO025, CO028, CO037, CI001, CI002, CI016]
summary:
  headline: >-
    Framer looks like a real design-led website-platform winner, but the current $2B valuation already
    prices in strong enterprise conversion and leaves too little disclosure on retention, margins, and
    revenue mix to justify an aggressive entry.
