    - Request conversion by source, time-to-payback, and activation funnel breakpoints
  - - Hosting / AI cost exposure
    - Hosted delivery, analytics events, premium CDN, localization, and AI tools imply real service-delivery costs
    - Medium
    - Gross margin can move materially if traffic, AI, or support costs rise faster than ARPU
    - Request infrastructure COGS, AI inference cost, support cost, and gross margin by plan
  - - CAC / payback / sales cycle
    - 'null'
    - Low
    - Needed to judge GTM efficiency as Framer moves from PLG into enterprise and business plans
