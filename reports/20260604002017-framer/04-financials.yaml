  rows:
  - - Framer Basic
    - $10/mo billed annually
    - List price
    - Custom domain, AI design tools, hosting, SEO; additional editors billed separately
    - Monthly price, discounting, and seat attachment are not disclosed on the official page
    - Low-friction entry point for serious personal and small business sites
  - - Framer Pro
    - $30/mo billed annually
    - List price
    - Roles and permissions, relational CMS, redirects, plus paid add-ons for A/B testing, locales, and advanced hosting
    - Realized pricing and enterprise crossover points are private
    - Primary upsell tier for growing professional sites
  - - Framer Scale
    - $100/mo billed annually plus usage
    - List price plus metered usage
    - Premium CDN, events and funnels, flexible limits, priority support, custom locale regions
    - Usage mix and actual ARPU are private
    - Signals higher-value cohorts but also higher infrastructure exposure
  - - Framer seats and add-ons
    - $20 extra editor, $10 content editor, $20 per locale, usage packs beyond plan limits
    - List price
    - Workforce expansion and feature expansion inside existing sites
    - Attach rate and discounting are unknown; effective spend can exceed headline plan price
