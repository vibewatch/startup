- id: TI004
  title: Capital adequacy table
  columns:
  - Line item
  - Public value or status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Latest disclosed capital
    - $100M Series D at $2B valuation in August 2025
    - High
    - Fresh primary capital materially reduces immediate funding pressure
    - Request cap table, primary versus secondary mix, and post-close cash bridge
  - - Planned use of funds
    - US expansion, AI investment, product scaling, and go-to-market expansion
    - High
    - Signals growth spending rather than an explicitly defensive financing
    - Request budgeted use of proceeds and hiring plan by function
  - - Operating posture
    - Break-even for the past year at the time of the round
    - High
    - Supports the view that the company was not obviously forced to raise for survival
    - Request operating cash flow, EBITDA bridge, and monthly cash conversion
  - - Cash on hand
    - 'null'
    - Low
    - Without ending cash, runway and downside protection cannot be calculated
    - Request current cash, restricted cash, and short-term investments
  - - Monthly burn / runway
    - 'null'
    - Low
    - Needed to translate the Series D into months of operating flexibility
    - Request gross burn, net burn, budget versus actual, and runway under base/downside scenarios
  - - Debt or project finance
    - No public disclosure found
    - Low
    - Debt can change risk even when equity financing and break-even claims look healthy
    - Request debt schedule, covenant package, leases, and any vendor financing
  - - Next-round trigger
    - Unknown publicly
    - Low
    - Investors need to know whether the next financing would be strategic, opportunistic, or required
    - Request explicit triggers for another primary round, secondary liquidity, or IPO path
  notes: The table intentionally references the Company Overview financing chronology only indirectly and focuses on forward capital adequacy.
