  - - Webflow
    - Free, $15/mo Basic, $25/mo Premium, $2,500 annual Team, Enterprise custom
    - List price
    - CMS, code components, localization, governance, and enterprise security scale with plan tier
    - Realized enterprise pricing private
    - Closest direct pricing benchmark for professional website teams
  - - Shopify
    - $29/mo Basic, $79/mo Grow, $299/mo Advanced, Plus from $2,300/mo, plus card-rate and POS monetization
    - List price
    - Commerce stack, payment rates, staff-account limits, POS add-ons, and Plus enterprise controls
    - Merchant-solutions take rates make realized revenue structurally different from Framer
    - Useful contrast because Shopify monetizes both software access and transaction flows
  - - Wix / Squarespace
    - Public tier ladders are visible, but fetched pages do not expose stable globally comparable USD plan numbers
    - List price visibility is partial
    - Wix shows Free/Light/Core/Business Elite; Squarespace shows annual vs monthly billing, a 14-day trial, and promo-led packaging
