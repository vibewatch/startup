tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value or status
  - Quality
  - Diligence ask
  rows:
  - - Free plan funnel
    - Product-led acquisition, not direct revenue
    - Workspace / site
    - Free plan includes CMS, page, locale, and editor limits; custom domain requires upgrade
    - 'Medium: strong top-of-funnel signal but not monetized on its own'
    - Request free-to-paid conversion by cohort and time-to-first-payment
  - - Paid site plans
    - Recurring website subscription
    - Per site plan
    - Basic $10/mo annual, Pro $30/mo, Scale $100/mo plus usage, Enterprise custom
    - 'High: transparent list pricing and recurring structure'
    - Request ARR split by plan, monthly vs annual mix, and price realization
  - - Editor and content-editor seats
    - Seat expansion inside paid workspaces
    - Per editor
    - Additional editors are priced separately and content editors also carry explicit public pricing
    - 'Medium-high: clear upsell path after initial site conversion'
    - Request seat attachment rates and expansion revenue by workspace cohort
  - - Usage add-ons
    - Metered expansion on higher-complexity sites
    - Per locale / event / capacity pack
    - Locales, analytics events, advanced hosting, pages, CMS items, and bandwidth can all expand above base plan limits
    - 'Medium: recurring but tied to infrastructure usage and product depth'
    - Request percentage of ARR from add-ons and gross margin by add-on family
  - - Scale-plan overages
    - Subscription plus variable infrastructure spend
    - Per usage increment
    - Scale is annual only and adds premium CDN, events and funnels, flexible limits, and priority support
    - 'Medium: likely raises ARPU but also raises delivery-cost sensitivity'
    - Request overage incidence, average overage bill, and gross profit by high-traffic cohort
  - - Enterprise contracts
    - Quote-led negotiated package
    - Contract / site estate
    - Custom limits, enterprise security, and dedicated support are sold through contact-led procurement
    - High potential quality, but public terms are opaque
    - Request ACV, contract length, renewal rates, discounts, and implementation burden
  notes: This table is exhaustive for monetization surfaces that are explicitly public today, but it cannot quantify the share of revenue each stream contributes.
