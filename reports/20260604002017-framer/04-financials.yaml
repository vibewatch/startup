  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: gtm-efficiency
    missingEvidence: Segmented CAC, payback, sales-cycle, and win-rate data for self-serve, business, and enterprise motions.
    whyItMatters: Without commercial-efficiency data, investors cannot test whether the business-customer mix is scaling efficiently or only growing because of product momentum.
    diligencePath: Request pipeline conversion, sales-cycle, CAC, payback, and marketing-efficiency dashboards by segment and by geography.
    relatedQuestionRefs:
    - QI009
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin-and-cogs
    missingEvidence: Gross margin by plan plus cost splits for hosting, CDN, AI inference, analytics, support, and third-party services.
    whyItMatters: The hosted stack is a core part of Framer's value proposition, so revenue quality cannot be judged without understanding how much infrastructure and AI costs consume gross profit.
    diligencePath: Request a plan-level gross-margin bridge and the monthly COGS stack behind hosting, media optimization, analytics, and AI.
    relatedQuestionRefs:
    - QI011
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: cash-and-runway
    missingEvidence: Cash on hand, burn, runway, and any debt or lease obligations after the 2025 Series D.
    whyItMatters: The latest raise and break-even claim are directionally positive but still do not let the investor calculate downside resilience or financing dependency.
    diligencePath: Request the latest balance sheet, debt schedule, covenant summary, monthly burn, and runway scenarios under base and downside plans.
    relatedQuestionRefs:
    - QI012
    - QI024
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: revenue-mix-and-pricing-realization
    missingEvidence: ARR and revenue bridges by self-serve site plans, seats, add-ons, business plans, and enterprise contracts, plus monthly versus annual mix and discounting.
    whyItMatters: List prices alone cannot tell investors whether Framer has durable pricing power, enterprise leverage, or a meaningful overage and seat-expansion engine.
    diligencePath: Request ARR and recognized revenue by stream, discount waterfall, annual-commitment share, and average contract value by cohort.
    relatedQuestionRefs:
    - QI016
    - QI023
    relatedTableRefs:
    - TI001
    - TI002
    - TI005
  - type: enumeration-incomplete
    severity: minor
    topic: comp-pricing-precision
    missingEvidence: Stable public USD plan values for Wix and Squarespace from currently fetched official pages.
    whyItMatters: The comp ladder can still be described directionally, but exact list-price benchmarking is incomplete where competitor pages render location-specific or dynamic prices in ways the fetch did not preserve.
    diligencePath: Capture region-specific pricing screenshots or obtain archived static pricing pages for Wix and Squarespace before doing precise price-gap math.
    relatedQuestionRefs:
    - QI017
    - QI026
    relatedTableRefs:
    - TI002
