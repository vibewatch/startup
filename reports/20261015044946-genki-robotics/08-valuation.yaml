    claimRefs: [CV004, CV006, CV011, CV014, CV015]
callouts:
  - calloutType: recommendation
    title: "Current call: track, not buy"
    body: The right posture is to keep Genki on the diligence list while refusing to underwrite the reported unicorn headline until public customer, pricing, and round-term evidence improves.
    claimRefs: [CV011, CV012, CV014]
  - calloutType: risk
    title: Thesis-break trigger
    body: If the first product reaches market without named customers, pricing disclosure, or clearer financing terms, the next valuation event could expose a flat- or down-round risk instead of validating today's scarcity premium.
    claimRefs: [CV006, CV011, CV012, CV015]
