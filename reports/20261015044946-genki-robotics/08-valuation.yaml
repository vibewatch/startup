  evidenceGaps:
    - type: missing-source
      severity: material
      topic: series-a-terms
      missingEvidence: Exact Series A round size, lead investor, cap-table preferences, and dilution terms.
      whyItMatters: Without round economics, outside investors cannot judge whether the reported unicorn headline reflected broad-market price support or a more fragile financing structure.
      diligencePath: Obtain the signed term sheet or a board-approved financing summary and reconcile it against cap-table records.
      relatedQuestionRefs: [QV009]
    - type: private-evidence-only
      severity: material
      topic: commercialization-gap
      missingEvidence: Named pilots or customers, product pricing, and first-deployment economics.
      whyItMatters: Commercial proof is the main bridge between founder narrative and a durable valuation, and its absence keeps downside repricing risk elevated.
      diligencePath: Request customer references, pilot contracts, pricing sheets, and any launch-commitment documentation tied to the first product.
      relatedQuestionRefs: [QV002, QV003, QV008]
    - type: missing-source
      severity: material
      topic: comparable-benchmarks
      missingEvidence: A comp set with product maturity, traction, and financing metrics relevant to Genki's stage.
      whyItMatters: Category symbolism alone is not enough to support entry price discipline when exact revenue and round terms are still absent.
      diligencePath: Build an internal comp sheet using directly sourced private-round data, public humanoid benchmarks, and milestone-adjusted financing precedents.
      relatedQuestionRefs: [QV006]
