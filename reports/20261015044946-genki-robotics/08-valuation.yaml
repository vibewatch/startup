    title: Recommendation summary table
    columns:
      - Lens
      - Assessment
      - Evidence
      - Decision implication
    rows:
      - [Recommendation, track, "Public evidence confirms valuation visibility but not enough underwriting detail.", "Keep the company live; do not underwrite today's headline price as a buy."]
      - [Confidence, medium, "Third-party databases agree on the valuation narrative more than on the exact round economics.", "Wait for primary or higher-quality third-party financing detail before increasing conviction."]
      - [Risk rating, high, "Commercialization, pricing, customer proof, and financing terms remain undisclosed in retained public sources.", "Model downside around post-launch repricing rather than assuming smooth scale-up."]
      - [Valuation stance, expensive, "The price headline is roughly unicorn-level while public operating proof remains early and incomplete.", "Entry discipline matters more than category enthusiasm."]
    notes: Public snapshot synthesized from retained third-party databases and one partner page; rows mix reported facts and valuation judgment, so readers should treat the conclusion as price-sensitive rather than as a company-quality score.
    claimRefs: [CV002, CV003, CV004, CV011, CV014]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - [Founder and platform pedigree, "Andy Rubin's background and Genki's full-stack ambition can attract talent, capital, and ecosystem attention.", "Pedigree is still doing more public work than disclosed operating results.", "Independent product demos, referenceable hires, and execution milestones beyond founder narrative."]
      - [Commercialization path, "An attributed first-product plan and MVP's stated help with customers and partners create a plausible path to first deployments.", "The available syndication is internally inconsistent on timing, and no named contracts, product pricing, or target-industry details are disclosed in retained public sources.", "A dated primary launch statement, named pilots or customers, pricing, and deployment economics."]
      - [Comparable frame, "Humanoid comps such as Figure AI, 1X, Apptronik, Agility Robotics, Sanctuary AI, and Physical Intelligence show investors will pay for category leadership.", "The retained pool does not provide revenue or valuation multiples that would justify paying up for Genki specifically.", "A comp set tied to product maturity, traction, and financing terms rather than category symbolism."]
    notes: The table separates reported facts from investment interpretation; the "What would change the view" column names the minimum incremental evidence needed to move from track toward buy.
    claimRefs: [CV004, CV005, CV006, CV008, CV010, CV012, CV013, CV015, CV016]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "A dated first-product launch lands on its confirmed schedule, disclosed pilots convert into referenceable customers, pricing and product specs become public, and the next round is led by credible investors on clean terms.", "A price above the current unicorn narrative becomes more defensible only after commercial proof catches up with founder and category narrative.", "Hardware execution, customer adoption, and financing-term dilution still have to clear.", "Would require multiple new public proofs that are absent from the retained pool today."]
      - [Base, "Genki launches something meaningful, but customer, pricing, and financing disclosures remain partial.", "The company preserves option value, but outside investors still need entry discipline because valuation remains easier to repeat than to validate.", "Sparse disclosure can keep price discovery wide and preference risk opaque.", "Most consistent with current evidence: visible excitement, incomplete underwriting inputs."]
      - [Bear, "Launch slips or arrives without named customers, pricing, or financing transparency.", "The next price-setting event could be flat to down versus the current headline because narrative no longer outruns missing proof.", "Commercial delay, weak conversion, or round-term overhang can force repricing.", "Directly supported by today's gaps on contracts, pricing, and round economics."]
    notes: Scenario language is analytical rather than company-guided; it anchors on retained public evidence and explicitly avoids false precision because the assigned pool does not disclose revenue, margin, or exact round terms.
    claimRefs: [CV006, CV011, CV012, CV014, CV015, CV016]
