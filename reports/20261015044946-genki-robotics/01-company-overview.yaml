      - [Stage, 'Series A', '2026', medium, null]
      - [Total raised, '$50M over 2 rounds', '2026', medium, 'Round sizing and investor-by-investor check remain incomplete in public sources.']
      - [Valuation, '$1-2.5B range on Dealroom; ~$1B reported for the 2026 Series A', '2026', low, 'Exact post-money and mark-up source are not publicly disclosed in retained evidence.']
      - [Headcount, '<100 current team size', '2026', medium, 'Exact employee count and function mix are not publicly disclosed.']
      - ['Revenue / run-rate', null, '2026-10-15', low, 'No retained source discloses revenue, ARR, or unit economics.']
      - ['Named customers / pilots', null, '2026-10-15', low, 'No retained source names a customer, pilot, LOI, or procurement process.']
    notes: Snapshot mixes official disclosure with secondary databases; null means no supportable public number in the assigned evidence pool as of 2026-10-15.
    claimRefs: [CO002, CO005, CO009, CO010, CO011, CO012]
  - id: TO002
    title: Leadership and founder table
    columns: [Person, Role, Background, 'Founder-market fit or functional coverage', 'Key-person dependency']
    rows:
      - ['Andy Rubin', Founder, 'Android co-founder; former Google robotics leader; later founded Playground Global and Essential.', 'Strong pattern fit for robotics + hardware platform formation, but public evidence still centers on founder pedigree more than on shipped Genki products.', 'High: retained public evidence names Rubin repeatedly, but does not surface a comparable set of named current executives or board members.']
    notes: Partial public enumeration only; retained sources identify Andy Rubin clearly but do not disclose a full current management or board roster.
    enumerationScope:
      coverage: partial
      basis: Public naming was checked across the official site, Dealroom company profile, Dealroom news entry, and startuply profile in the assigned source pool.
    claimRefs: [CO006, CO007]
  - id: TO003
    title: Stakeholder or investor map
    columns: [Stakeholder, Role, 'Control or economic importance', 'Diligence ask']
    rows:
      - ['Andy Rubin', Founder, 'Central public face of the company and the clearest source of founder-market-fit credibility.', 'Clarify equity ownership, board control, vesting, and whether day-to-day product and commercial leadership are shared.']
      - ['MVP Ventures', 'Investor / partner', 'Only directly confirmed active investor-partner page in the retained pool; claims to help with talent, customer introductions, and banking.', 'Confirm check size, board or observer rights, and whether the relationship is lead, co-lead, or strategic minority.']
      - ['Maiora Ventures', 'Institutional investor (reported by Tracxn)', 'Only institution explicitly named by Tracxn on the funding page.', 'Verify entry round, current ownership, and whether Maiora remains active after the Series A.']
      - ['Andreessen Horowitz', 'Reported investor', 'Startuply lists it as a key institutional investor tied to the disclosed funding path.', 'Request primary confirmation from company or investor, plus round-by-round participation and pro rata rights.']
      - [DCM, 'Reported investor', 'Startuply lists DCM among key institutional investors.', 'Confirm whether DCM invested, which vehicle invested, and whether it holds governance rights.']
      - ['Incubate Fund', 'Reported investor', 'Startuply lists Incubate Fund among key institutional investors and it could matter for Japan network access.', 'Confirm whether Incubate invested directly and whether it supports recruiting, partnerships, or follow-on financing.']
    notes: This is a partial public stakeholder map assembled from retained sources; several rows rely on secondary reporting and need primary confirmation before underwriting governance or cap-table conclusions.
    enumerationScope:
      coverage: partial
      basis: Names were retained only when they appeared in the assigned investor, company-profile, or startup-profile sources and were relevant to control, financing, or operating leverage.
    claimRefs: [CO007, CO008, CO009, CO010]
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: Current evidence shows a stealth robotics build that became publicly legible through secondary databases and funding/launch signals during 2025-2026, but with commercial proof still missing.
    data:
      items:
        - date: '2022'
          label: Tracxn founding-year record
          detail: Tracxn lists Genki as founded in 2022 and based in Tokyo.
          claimRefs: [CO002, CO003]
        - date: '2025'
          label: First reported funding round
          detail: Tracxn says the first funding round occurred in 2025, consistent with later two-round funding summaries.
          claimRefs: [CO009]
        - date: '2025-11-13'
          label: Tokyo venture surfaces in late-2025 reporting
          detail: Dealroom-linked news coverage describes Andy Rubin launching a Tokyo robotics venture focused on AI plus physical machines.
          claimRefs: [CO007]
        - date: 'Late 2025'
          label: Team formation and prototype work still in progress
          detail: Dealroom says late-2025 reports indicated active hiring and initial prototype development.
          claimRefs: [CO013]
        - date: '2026-04-21'
          label: Latest reported round is a Series A
          detail: Tracxn dates the latest funding event to April 21, 2026 and still classifies Genki as Series A.
          claimRefs: [CO009]
        - date: '2026-04-30'
          label: Secondary databases show $50M raised
          detail: Tracxn's published company profile reports $50M raised across two rounds.
          claimRefs: [CO009]
        - date: '2026'
          label: Current valuation and scale remain range-based
          detail: Dealroom shows a $1-2.5B valuation bucket and team size under 100 rather than exact current operating metrics.
          claimRefs: [CO011, CO012]
        - date: '2026'
          label: First product launch is signaled but not yet proven
          detail: Low-reputation 2026 news mirrors say the CEO expects a first product this year, while product specifics and customer proof remain undisclosed.
          claimRefs: [CO014, CO015]
    approximationNotes: Several items are year- or period-level because the retained sources disclose only partial dates; the sequence should be treated as a public-evidence chronology, not as a complete corporate history.
    claimRefs: [CO003, CO004, CO007, CO009, CO011, CO012, CO013, CO014, CO015]
