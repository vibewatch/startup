  evidenceGaps:
    - type: missing-source
      severity: material
      topic: governance-disclosure
      missingEvidence: Public disclosure of the current executive bench, board composition, committee structure, and formal governance controls beyond Andy Rubin.
      whyItMatters: Leadership concentration and missing governance detail make it hard to judge execution resilience, succession risk, and investor control protections.
      diligencePath: Request an org chart, board list, governance deck, and current role descriptions from management or the lead investor.
      relatedQuestionRefs: [QO008]
      relatedTableRefs: [TO002]
    - type: enumeration-incomplete
      severity: material
      topic: stakeholder-or-investor-map
      missingEvidence: Round-by-round investor roster, lead investor identity, ownership percentages, board rights, and preference stack terms.
      whyItMatters: The current public evidence identifies only fragments of the cap table, which limits underwriting of control, signaling quality, and follow-on financing risk.
      diligencePath: Obtain the cap table, financing docs, and investor rights summary from management counsel or the current lead investor.
      relatedQuestionRefs: [QO004, QO005]
      relatedTableRefs: [TO003]
    - type: private-evidence-only
      severity: material
      topic: scale-metrics
      missingEvidence: Exact headcount, revenue or ARR, named customers or pilots, pricing model, and number of operating locations.
      whyItMatters: These are core cover metrics for judging commercialization timing, burn efficiency, and whether the valuation is grounded in operating traction.
      diligencePath: Request monthly KPI reporting, customer pipeline detail, pricing sheets, and geography-by-function headcount from management.
      relatedQuestionRefs: [QO007]
      relatedTableRefs: [TO001]
    - type: missing-source
      severity: material
      topic: launch-details
      missingEvidence: Primary confirmation of the first product's exact launch date, product category, technical specifications, pilot customers, and regulatory path.
      whyItMatters: Public launch signaling without specifics does not establish product-market fit, procurement readiness, or manufacturability.
      diligencePath: Ask for the product roadmap, demo materials, pilot pipeline, and any launch or compliance documentation tied to the 2026 release target.
      relatedQuestionRefs: [QO006]
