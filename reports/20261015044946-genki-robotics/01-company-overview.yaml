schemaVersion: report-v2
artifact: company-overview
slug: genki-robotics
runDate: 2026-10-15
company:
  name: Genki Robotics
chapter:
  number: 1
  title: Company Overview
  summary: Genki Robotics is still publicly legible mostly through secondary databases and investor pages rather than through rich primary disclosure. The strongest supported facts are its Tokyo base, humanoid robotics focus, Andy Rubin linkage, and a 2026 Series A profile, while founding year, exact valuation, investor roster, and commercial traction remain only partially supported or openly inconsistent across current sources.
sections:
  - id: identity-and-disclosure
    title: Identity, positioning, and disclosure baseline
    body: >-
      Genki's official website now gives a clear mission statement but still
      functions more as a sparse identity page than as a fully informative
      company profile. The company describes itself as building advanced
      humanoid robotic systems for public safety, urban maintenance, and other
      mission-driven environments, which is consistent with third-party
      databases and investor messaging. Tokyo is the recurring headquarters in
      the retained sources, but the founding year is not cleanly settled:
      Tracxn shows 2022 while Dealroom shows 2025. That inconsistency matters
      because it changes how investors should interpret product maturity,
      fundraising cadence, and whether Genki is still best understood as a
      newly surfaced stealth effort rather than a multi-year operating company
      with already-proven execution.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006]
    tableRefs: [TO001]
  - id: leadership-funding-and-stakeholders
    title: Founder dependence, funding posture, and stakeholder map
    body: >-
      Public leadership visibility remains heavily concentrated around Andy
      Rubin. Current retained evidence ties Rubin to the company repeatedly,
      but it does not surface a comparable set of named operating executives or
      a public board roster, which keeps governance diligence incomplete. The
      funding picture is directionally clear but numerically loose: current
      databases converge on a Series A stage and roughly $50 million raised
      over two rounds, while valuation is framed either as an exact reported
      $1 billion Series A mark or as a broader current range. MVP Ventures'
      own portfolio page is important because it confirms at least one active
      investor-partner relationship and shows the company still benefiting from
      introductions on talent, customers, and banking rather than advertising
      mature commercial infrastructure.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO012]
    tableRefs: [TO002, TO003]
  - id: milestones-and-execution-risk
    title: Milestones, launch signals, and unresolved proof points
    body: The retained timeline supports a company that moved from a quiet robotics build-out into more visible fundraising and launch-oriented signaling during 2025-2026, but not yet into publicly evidenced commercial traction. Dealroom's late-2025 description still framed team formation and prototype development as work in progress. Low-reputation 2026 news mirrors then added a CEO-attributed signal that a first product should arrive this year, while also underscoring that specifications, pricing, target verticals, and customer validation remain undisclosed. Tracxn's competitor count reinforces that Genki is entering a crowded humanoid field, so the central diligence issue is not whether the category is exciting, but whether Genki can convert founder pedigree and financing into product proof, pilot customers, and durable operating leverage.
    claimRefs: [CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
tables:
