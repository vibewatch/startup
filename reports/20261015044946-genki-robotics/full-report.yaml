  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, positioning, and disclosure baseline
        blocks:
          - type: paragraph
            body: >-
              Genki's official website now gives a clear mission statement but still functions more as a sparse identity
              page than as a fully informative company profile. The company describes itself as building advanced
              humanoid robotic systems for public safety, urban maintenance, and other mission-driven environments,
              which is consistent with third-party databases and investor messaging. Tokyo is the recurring headquarters
              in the retained sources, but the founding year is not cleanly settled: Tracxn shows 2022 while Dealroom
              shows 2025. That inconsistency matters because it changes how investors should interpret product maturity,
              fundraising cadence, and whether Genki is still best understood as a newly surfaced stealth effort rather
              than a multi-year operating company with already-proven execution.
