        title: Landscape of alternatives
        blocks:
          - type: paragraph
            body: >
              The retained sources frame Genki around humanoid robotics for public-safety, urban-environment, and other
              mission-critical workflows rather than around a single disclosed product line. That matters because the
              buyer's alternative set is not limited to one humanoid startup peer group. Startuply's overview places
              Genki into a field that includes incumbents such as Boston Dynamics, venture-scale humanoid programs such
              as Figure AI and 1X Technologies, and adjacent specialists; the same evidence base still leaves room for
              status-quo labor and buyer-built integrations because Genki has not publicly disclosed a standard
              commercial package. In practice, the company is competing first for attention and problem framing, and
              only later on measurable product proof.
