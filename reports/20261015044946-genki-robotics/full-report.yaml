  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization remain mostly signaled, not disclosed
        blocks:
          - type: paragraph
            body: >-
              The assigned pool does not provide a public pricing page, contract example, or management disclosure that
              would let diligence break Genki's revenue model into realized hardware, software, service, or
              project-finance components. Secondary sources consistently describe the company as stealth,
              pre-deployment, or still approaching its first product launch, which means the best public evidence is
              about likely monetization paths rather than booked revenue quality. That distinction matters:
              mission-critical humanoid systems could eventually produce a mix of upfront robot sales, integration work,
              recurring support, and possible software/platform revenue, but public sources stop short of proving any
              signed commercial structure. Startuply presents a software-centric flywheel as a likely path rather than a
              disclosed current revenue stream, while two low-reputation market summaries say the CEO has discussed a
              first product launch without disclosing target use case, functionality, or pricing. Financially, that
              leaves Genki with a plausible bridge from product launch to revenue, but not yet a public bridge from
              revenue to gross profit.
