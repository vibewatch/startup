  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Supported market boundary before any TAM claim
        blocks:
          - type: paragraph
            body: >-
              Retained sources support a narrow market definition before any sizing work: Genki is consistently
              described as a humanoid-robotics effort for public safety, urban environments, and other mission-critical
              work, not as a general AI software company or a disclosed horizontal automation platform. The boundary
              still has soft edges. Startuply broadens the story to urban maintenance and logistics, while MVP's own
              framing stays tighter around public-safety and urban-environment use cases. That means the relevant
              substitute set is wider than other humanoid startups alone; it also includes status-quo manual crews,
              conventional industrial automation, cobots, and inspection drones that already solve narrower jobs more
              cheaply.
            claimRefs:
