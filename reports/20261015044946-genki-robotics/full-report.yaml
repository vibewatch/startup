      - number: '1.3'
        title: Milestones, launch signals, and unresolved proof points
        blocks:
          - type: paragraph
            body: >-
              The retained timeline supports a company that moved from a quiet robotics build-out into more visible
              fundraising and launch-oriented signaling during 2025-2026, but not yet into publicly evidenced commercial
              traction. Dealroom's late-2025 description still framed team formation and prototype development as work
              in progress. Low-reputation 2026 news mirrors then added a CEO-attributed signal that a first product
              should arrive this year, while also underscoring that specifications, pricing, target verticals, and
              customer validation remain undisclosed. Tracxn's competitor count reinforces that Genki is entering a
              crowded humanoid field, so the central diligence issue is not whether the category is exciting, but
              whether Genki can convert founder pedigree and financing into product proof, pilot customers, and durable
              operating leverage.
