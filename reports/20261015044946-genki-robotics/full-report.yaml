      - number: '4.2'
        title: Public traction and unit economics are still underwriting blind spots
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports only a narrow set of operating signals. XMAQUINA says there is still no public
              robot demo, product page, disclosed deployment, or revenue. Dealroom shows the company as a unicorn-tier
              startup with disclosed equity funding in a broad $50 million to $100 million range and a team size below
              100, which is directionally consistent with an R&D-stage company rather than a scaled field deployment
              organization. MVP Ventures says it is helping Genki with talent, customer, partner, and banking
              introductions, which implies go-to-market is still relationship-led rather than visible through public
              customer references or disclosed channel economics. As a result, standard metrics such as CAC, payback,
              backlog, gross margin, install cost, utilization, and service burden are not merely weakly corroborated;
              they are absent from the reviewed public record. The chapter can therefore assess the shape of the revenue
              engine, but it cannot underwrite that engine's efficiency.
