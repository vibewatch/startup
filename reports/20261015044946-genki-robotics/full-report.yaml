      - number: '4.3'
        title: Capital access looks stronger than capital visibility
        blocks:
          - type: paragraph
            body: >-
              The financial story is clearest on capital formation and weakest on capital adequacy. Multiple sources
              agree that Genki has already moved from a large seed into a roughly $1 billion Series A valuation before
              public commercialization, which is an unusually aggressive financing outcome for a stealth humanoid
              robotics company. Altis is openly skeptical, describing the valuation as arriving before any public
              product specification or customer proof, and XMAQUINA likewise says the company has no disclosed
              deployment or revenue. Those signals do not prove the business cannot work; they show that today's
              financing case is still anchored more to founder pedigree, investor access, and category heat than to
              public evidence on margin path or cash conversion. Because the assigned pool discloses no cash balance,
              burn rate, debt exposure, or runway, diligence still needs direct management evidence before it can judge
              how much additional equity or non-dilutive capital Genki will need to reach repeatable commercial scale.
