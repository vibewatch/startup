              does not reveal a named customer, pilot counterparty, or retention metric.
            calloutType: risk
            claimRefs:
              - CU011
              - CU014
          - type: callout
            title: The clearest GTM wedge is mission-critical field work, not broad enterprise adoption
            body: >-
              The retained sources consistently position Genki around public-safety, urban-maintenance, and logistics
              workflows, which is more specific than the company's current customer-proof disclosure.
            calloutType: insight
            claimRefs:
              - CU003
              - CU007
          - type: callout
            title: Ask for private customer proof before underwriting expansion
            body: >-
              Management should be asked for named pilots, signed contracts or LOIs, deployment outcomes, and
              concentration or renewal data to convert a credible narrative into a diligenced customer thesis.
            calloutType: recommendation
            claimRefs:
              - CU004
              - CU011
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and liability readiness is still mostly unproved in public
        blocks:
          - type: paragraph
            body: >-
              Genki's stated target markets—public safety, urban maintenance, and other mission-critical
              environments—imply a higher burden of reliability, safety, and operator accountability than a
              consumer-device launch. Yet the retained public record does not show product specifications, named
              certifications, disclosed safety protocols, or published deployment approvals. Robottoday says the company
              had not publicly shipped a robot as of August 2026 and that verifiable technical facts were still limited
              to funding history, leadership, and mission statements. The launch-oriented market-analysis pages also say
              the product's function, target industry, pricing, and any applicable regulatory clearances remain
              unspecified. That leaves legal, safety, export-control, privacy, and public-procurement diligence as live
              underwriting items rather than cleared risks.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR012
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR012
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR004
              - CR008
              - CR009
              - CR010
              - CR012
              - CR013
              - CR014
      - number: '7.2'
        title: Execution risk remains high because commercialization proof is still thin
        blocks:
          - type: paragraph
            body: >-
              Public evidence still describes Genki as pre-product and largely stealth. Robottoday says prototypes were
              still in development while a first product was planned within the year, and Startuply says no commercial
              contracts have been announced. The 2026 launch-analysis pages add that neither product details nor pricing
              nor customer validation are public, while Dealroom places the company in a competitive and
              capital-intensive humanoid robotics market. That combination means investors are being asked to underwrite
              schedule risk, product-market-fit risk, manufacturing and service-readiness risk, and long enterprise or
              public-sector sales cycles before there is public evidence of pilots, production deployments, or reference
              customers.
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR007
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR007
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.3'
        title: Capital, partner, and founder dependencies could tighten the downside path
        blocks:
          - type: paragraph
            body: >-
              Caplight lists a Series A on April 21, 2026 and estimates Genki's valuation at $1 billion, while Dealroom
              shows only broad funding and headcount ranges rather than a complete operating picture. Caplight's public
              page does not disclose the Series A amount and says filing documents are not displayed publicly, so
              outsiders cannot verify round economics, investor rights, or downside protections from public materials
              alone. At the same time, MVP says it is helping Genki with talent, potential customers, strategic
              partners, and banking relationships, which suggests key commercial and financing infrastructure is still
              being assembled around the founder. If launch timing slips or fundraising terms tighten before customer
              proof appears, the valuation could become harder to defend.
            claimRefs:
              - CR006
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR008
              - CR009
              - CR010
              - CR011
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Kill criteria to monitor before underwriting a priced round
            body: >-
              Treat a launch slip beyond the promised first-product window, continued absence of named pilot or customer
              proof, or inability to verify Series A economics and governance terms as thesis-break signals. Any one of
              those would imply that the public valuation has continued to outrun operating proof rather than merely
              preceding it.
            calloutType: risk
            claimRefs:
              - CR002
              - CR005
              - CR008
              - CR009
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Headline valuation is visible, but the underwriting inputs are still thin
        blocks:
          - type: paragraph
            body: |-
              The retained public evidence keeps repeating a familiar headline: Genki reportedly
              reached roughly a $1 billion valuation in an April 2026 Series A, while
              third-party databases still show only approximate funding ranges rather than a
              disclosed post-money, round size, or lead-investor stack. That matters because the
              public bull case is still being asked to underwrite scarcity, founder pedigree,
              and category excitement without the usual financing detail that would let an
              outside investor judge dilution, preference overhang, or how much fresh capital
              actually entered the business. MVP's portfolio page is a real positive signal, but
              it is also partner-issued evidence and therefore cannot by itself clear valuation
              discipline. On today's evidence, the price signal is real, but the disclosure
              needed to validate that price is not.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV009
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV011
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV006
              - CV011
              - CV014
              - CV015
      - number: '8.2'
        title: The upside case is credible, but it still outruns public commercialization proof
        blocks:
          - type: paragraph
            body: |-
              There is a coherent thesis here. Multiple retained sources describe Genki as a
              Tokyo humanoid robotics startup built around Andy Rubin's hardware-and-platform
              pedigree, and MVP explicitly says it invested because it saw the ingredients for
              an important robotics company in physical AI, resilient hardware, and
              mission-critical public-safety use cases. The anti-thesis is just as important:
              Startuply says the business model is still presumed rather than proven, no
              commercial contracts have been announced, and Cagexam says even the first product's
              function, target industry, and pricing remain undisclosed. Dealroom's "<100"
              headcount marker reinforces that this is still early operating scale for a unicorn
              narrative. The launch timing itself is weak evidence: Cagexam attributes the plan
              to the CEO and Nikkei Asia without a direct quote, while its text inconsistently
              refers to both "this year" and 2025. The result is a company that may deserve
              continued attention, but not a valuation-insensitive entry.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV013
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV008
              - CV010
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.3'
        title: Recommendation should stay at track until launch proof and round terms become visible
        blocks:
          - type: paragraph
            body: |-
              The practical recommendation is track, with high risk and an expensive valuation
              stance at the reported headline price. A bull case exists if Genki converts the
              attributed first-product plan into named pilots or customers, discloses pricing and technical
              specifications, and shows that the financing stack was led by credible investors on
              clean terms rather than by scarcity alone. The base case is that the company keeps
              strategic option value but remains hard to price because so much of the operating
              model is still inferred. The bear case is straightforward: if launch slips or lands
              without commercial disclosure, the gap between founder narrative and operating proof
              could turn the next financing into a flat or down-round negotiation. That is why
              the next diligence dollars should go to customer proof, product proof, and term
              sheet proof rather than to abstract market enthusiasm.
            claimRefs:
              - CV006
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Current call: track, not buy'
            body: >-
              The right posture is to keep Genki on the diligence list while refusing to underwrite the reported unicorn
              headline until public customer, pricing, and round-term evidence improves.
            calloutType: recommendation
            claimRefs:
              - CV011
              - CV012
              - CV014
          - type: callout
            title: Thesis-break trigger
            body: >-
              If the first product reaches market without named customers, pricing disclosure, or clearer financing
              terms, the next valuation event could expose a flat- or down-round risk instead of validating today's
              scarcity premium.
            calloutType: risk
            claimRefs:
              - CV006
              - CV011
              - CV012
              - CV015
