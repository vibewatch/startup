      - number: '2.4'
        title: What still controls adoption and valuation underwriting
        blocks:
          - type: paragraph
            body: >-
              The key gating issue is not whether robotics is a large macro category; it is whether Genki can translate
              a compelling founder-and-market narrative into a budget-owned workflow with disclosed proof points. Public
              sources do not yet isolate the buyer for the first product, show which budget line is paying, or disclose
              a named municipality, enterprise, or channel partner progressing from introduction to deployment. Until
              that evidence appears, valuation-relevant adoption will be better judged by customer-specific procurement
              data, pilot conversion, pricing, and service economics than by top-down robotics growth alone.
            claimRefs:
              - CM006
              - CM007
              - CM012
              - CM013
