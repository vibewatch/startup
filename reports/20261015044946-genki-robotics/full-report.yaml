        title: Buyers and drivers are inferable, but commercialization proof is thin
        blocks:
          - type: paragraph
            body: >-
              Demand-side signals are more qualitative than quantitative. Dealroom's Tokyo rationale and later launch
              commentary point to a Japan robotics ecosystem with manufacturing depth, engineering talent, and policy
              support, while Wecklabs frames labor shortages and productivity pressure as recurring automation drivers
              across multiple end markets. Even so, commercialization evidence is still thin: Robotico characterizes the
              company as stealth, Robot24 lists no published robot models, and Cagexam says product function, target
              industry, and pricing remain undisclosed. MVP's portfolio note is also telling because it highlights
              introductions to potential customers and strategic partners rather than named pilots or contract wins.
            claimRefs:
              - CM003
              - CM004
              - CM010
              - CM011
              - CM012
