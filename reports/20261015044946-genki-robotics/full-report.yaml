        title: Evidence-constrained sizing stays broad
        blocks:
          - type: paragraph
            body: >-
              The retained pool does not provide a clean TAM, SAM, and SOM stack for Genki's actual wedge. The only
              numeric lens comes from a Startuply summary that quotes Allied Market Research's broad industrial-robotics
              market at $55.8 billion in 2022 and $165.2 billion by 2032, implying an 11.5% CAGR. That is useful as an
              analog for capital and demand moving into automation, but it is too broad to underwrite a humanoid thesis
              for public-safety or urban-maintenance deployments. Startuply also says a specific TAM for humanoids in
              mission-critical roles is not publicly available, so any narrower sizing still needs original procurement,
              budget, or workflow data.
