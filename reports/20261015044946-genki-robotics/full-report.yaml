        blocks:
          - type: paragraph
            body: >-
              Public leadership visibility remains heavily concentrated around Andy Rubin. Current retained evidence
              ties Rubin to the company repeatedly, but it does not surface a comparable set of named operating
              executives or a public board roster, which keeps governance diligence incomplete. The funding picture is
              directionally clear but numerically loose: current databases converge on a Series A stage and roughly $50
              million raised over two rounds, while valuation is framed either as an exact reported $1 billion Series A
              mark or as a broader current range. MVP Ventures' own portfolio page is important because it confirms at
              least one active investor-partner relationship and shows the company still benefiting from introductions
