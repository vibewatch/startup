    rows:
      - [Startuply quoting Allied Market Research, 2022-2032, Not stated in fetched text, "$55.8B -> $165.2B", 11.5%, Broad industrial robotics analog cited in a secondary company profile, low, Not specific to humanoids or Genki's mission-critical wedge]
      - [Startuply, "As of 2026-10-15", Geography not disclosed, null, null, Narrative assessment of Genki-adjacent market demand, low, Explicitly says specific TAM for humanoids in mission-critical roles is not publicly available]
      - [Dealroom company profile, "As of 2026-10-15", Geography not disclosed, null, null, Company-profile commentary on market structure, medium, Describes the market as competitive and capital-intensive but gives no size estimate]
      - [Cagexam plus Wecklabs launch commentary, 2026, Japan robotics demand context, null, null, News-summary framing around launch timing and sector conditions, low, Company target industry and pricing remain undisclosed]
    notes: >-
      This table mixes one quoted analog market estimate with narrative lenses;
      null means the retained public source did not provide a defensible numeric
      value for that slice.
    claimRefs: [CM006, CM007, CM009, CM011, CM013]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - [Public safety, Agency leadership and procurement teams, Responders and field operators, Government public-safety budgets, Hazardous inspection response and mission-critical field work, Public-safety chief plus procurement, Labor scarcity safety improvement and uptime]
      - [Urban maintenance, Municipal department heads, Inspection and maintenance crews, Public-works or infrastructure budgets, Inspection and upkeep of human-built environments, Public-works director plus procurement, Workforce constraints and service continuity]
      - [Logistics adjacency, Operations leadership, Warehouse and field staff, Private operating budgets, Repetitive movement and site operations, COO or operations excellence owner, Throughput needs and labor shortages]
      - [Manufacturing / industrial adjacency, Plant or automation leaders, Technicians and line staff, Plant capex and opex, Automation inside existing industrial environments, Plant manager or automation budget owner, Productivity pressure and talent gaps]
    notes: >-
      Buyer user and payer roles are inferred from the named end markets in the
      retained sources; no public Genki customer roster or procurement case study
      is disclosed in this pool.
    claimRefs: [CM001, CM002, CM010, CM011, CM012, CM013]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Only the broad industrial-robotics analog is quantified in retained
      sources; every narrower Genki-relevant layer remains publicly undisclosed.
    data:
      items:
        - label: Industrial robotics analog market (2022)
          displayValue: $55.8B
          note: Startuply quotes Allied Market Research; geography is not stated in the fetched text.
        - label: Industrial robotics analog market (2032)
          displayValue: $165.2B
          note: Same secondary source gives a 2032 projection at an 11.5% CAGR.
        - label: Humanoid mission-critical wedge
          displayValue: Undisclosed
          note: Startuply says a specific TAM for humanoids in mission-critical roles is not publicly available.
        - label: Public-safety deployment scope
          displayValue: Undisclosed
          note: MVP names public safety but provides no public budget or deployment counts.
        - label: Urban-maintenance deployment scope
          displayValue: Undisclosed
          note: Secondary profiles mention urban maintenance without a retained spend basis.
        - label: Named Genki customer scope
          displayValue: Undisclosed
          note: MVP discusses introductions to potential customers, not disclosed pilots or contracts.
    approximationNotes: >-
      The figure deliberately mixes one broad analog market estimate with
      narrower undisclosed layers to show where retained public sizing breaks
      down.
    claimRefs: [CM001, CM006, CM007, CM012]
callouts:
  - calloutType: risk
    title: Top-down robotics growth is not yet a Genki SAM
    body: >-
      The retained quantitative evidence says more about broad robotics demand
      than about a verified Genki buying center. Without named customers,
      disclosed pricing, or a first-product workflow, top-down market growth is
      still a loose analog rather than a dependable underwriting base.
    claimRefs: [CM006, CM007, CM012, CM013]
