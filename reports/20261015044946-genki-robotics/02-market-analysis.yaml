company:
  name: Genki Robotics
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Public evidence supports a narrow but still under-specified market wedge for
    Genki Robotics: humanoid robotics for public safety, urban environments, and
    other mission-critical workflows. The only retained quantitative market lens
    is a broad industrial-robotics analog, so the real diligence question is
    whether Genki can prove a customer-ready niche, pricing model, and adoption
    path inside that broader automation spend.
sections:
  - id: supported-market-boundary
    title: Supported market boundary before any TAM claim
    body: >-
      Retained sources support a narrow market definition before any sizing work:
      Genki is consistently described as a humanoid-robotics effort for public
      safety, urban environments, and other mission-critical work, not as a
      general AI software company or a disclosed horizontal automation platform.
      The boundary still has soft edges. Startuply broadens the story to urban
      maintenance and logistics, while MVP's own framing stays tighter around
      public-safety and urban-environment use cases. That means the relevant
      substitute set is wider than other humanoid startups alone; it also
      includes status-quo manual crews, conventional industrial automation,
      cobots, and inspection drones that already solve narrower jobs more
      cheaply.
    claimRefs: [CM001, CM002, CM005, CM008]
    tableRefs: [TM001]
  - id: evidence-constrained-sizing
    title: Evidence-constrained sizing stays broad
    body: >-
      The retained pool does not provide a clean TAM, SAM, and SOM stack for
      Genki's actual wedge. The only numeric lens comes from a Startuply summary
      that quotes Allied Market Research's broad industrial-robotics market at
      $55.8 billion in 2022 and $165.2 billion by 2032, implying an 11.5% CAGR.
      That is useful as an analog for capital and demand moving into automation,
      but it is too broad to underwrite a humanoid thesis for public-safety or
      urban-maintenance deployments. Startuply also says a specific TAM for
      humanoids in mission-critical roles is not publicly available, so any
      narrower sizing still needs original procurement, budget, or workflow data.
    claimRefs: [CM006, CM007]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-and-commercialization-constraints
    title: Buyers and drivers are inferable, but commercialization proof is thin
    body: >-
      Demand-side signals are more qualitative than quantitative. Dealroom's
      Tokyo rationale and later launch commentary point to a Japan robotics
      ecosystem with manufacturing depth, engineering talent, and policy
      support, while Wecklabs frames labor shortages and productivity pressure
      as recurring automation drivers across multiple end markets. Even so,
      commercialization evidence is still thin: Robotico characterizes the
      company as stealth, Robot24 lists no published robot models, and Cagexam
      says product function, target industry, and pricing remain undisclosed.
      MVP's portfolio note is also telling because it highlights introductions
      to potential customers and strategic partners rather than named pilots or
      contract wins.
    claimRefs: [CM003, CM004, CM010, CM011, CM012, CM013]
    tableRefs: [TM003]
  - id: what-still-controls-adoption-underwriting
    title: What still controls adoption and valuation underwriting
    body: >-
      The key gating issue is not whether robotics is a large macro category; it
      is whether Genki can translate a compelling founder-and-market narrative
      into a budget-owned workflow with disclosed proof points. Public sources do
      not yet isolate the buyer for the first product, show which budget line is
      paying, or disclose a named municipality, enterprise, or channel partner
      progressing from introduction to deployment. Until that evidence appears,
      valuation-relevant adoption will be better judged by customer-specific
      procurement data, pilot conversion, pricing, and service economics than by
      top-down robotics growth alone.
    claimRefs: [CM006, CM007, CM012, CM013]
