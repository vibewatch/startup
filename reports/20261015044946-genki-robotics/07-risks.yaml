      - ["Liability and procurement controls for mission-critical field use", "Municipal or enterprise buyers", "No public pilot or production deployment record in retained sources", Medium, High, "Narrow initial use cases and require operator-supervision design controls", High, "Review customer pilots, insurance structure, warranty terms, and procurement language"]
      - ["IP, privacy, and export-control diligence for full-stack robotics and AI stack", "Cross-border hardware and software operations", "No public disclosure in retained sources", Medium, Medium, "Run legal diligence before scaling cross-border sales or partnerships", Medium, "Review patents, supplier export classifications, data-handling docs, and any pending claims"]
    notes: Public sources describe risk surfaces and disclosure gaps, not cleared approvals; blank public evidence should not be treated as approval.
    enumerationScope:
      coverage: partial
      basis: This register covers the public regulatory and legal surfaces explicitly suggested by the retained sources for mission-critical robotics, not an exhaustive legal review of every jurisdiction.
    claimRefs: [CR001, CR002, CR003, CR004, CR012, CR014]
