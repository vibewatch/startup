  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: regulatory / legal risk register coverage
      missingEvidence: Primary-source filings or regulator records covering safety approvals, procurement constraints, export controls, and any claims or investigations tied to Genki's target use cases.
      whyItMatters: The current register is built from public disclosure gaps and market commentary, so it cannot substitute for jurisdiction-specific legal diligence.
      diligencePath: Pull Japanese corporate, court, and regulator records; request the company's certification and compliance roadmap; and verify any export, privacy, and procurement obligations before underwriting deployments.
      relatedQuestionRefs: [QR002, QR008]
      relatedTableRefs: [TR001]
    - type: missing-source
      severity: material
      topic: incident and litigation record
      missingEvidence: Court, regulator, safety, or cybersecurity sources confirming whether any lawsuits, recalls, breaches, outages, or enforcement actions exist.
      whyItMatters: The retained pool does not contain primary adverse records, so absence from this chapter is not evidence that the risk surface is clean.
      diligencePath: Run direct checks of Japanese litigation databases, relevant robotics and safety authorities, cybersecurity incident disclosures, and procurement complaint records before investment committee review.
      relatedQuestionRefs: [QR008]
    - type: private-evidence-only
      severity: blocking
      topic: customer and deployment proof
      missingEvidence: Named pilots, production deployments, customer references, pricing sheets, and support or warranty commitments for the first product.
      whyItMatters: Without third-party-verified customer proof, launch readiness and valuation discipline remain hard to separate from narrative.
      diligencePath: Request pipeline, pilot, and deployment evidence from management and cross-check each claimed customer with procurement or customer-side disclosures.
      relatedQuestionRefs: [QR001, QR004, QR007]
