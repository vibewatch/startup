      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - ["First-product launch slips beyond public timeline", High, High, Low, High, "No public prototype evidence or launch checklist in retained sources"]
      - ["Product reaches market without enough reliability or field-support readiness", High, High, Low, High, "No public after-sales, service, or production-capacity disclosure"]
      - ["Customer adoption stalls because pricing and use-case fit remain unclear", High, High, Low, High, "No public pricing, target-industry detail, or named deployment proof"]
      - ["Small early team struggles to scale manufacturing and deployments", Medium, High, Medium, Medium, "Public headcount signals remain small and imprecise for a hardware-heavy ramp"]
    notes: Likelihood and severity are sourced from public disclosure gaps and industry context; mitigation maturity reflects only what retained sources show publicly.
    claimRefs: [CR002, CR004, CR005, CR007, CR010, CR011, CR012, CR013]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - [Founder concentration, Andy Rubin, Product vision fundraising and external credibility, High, Delay or reputation shock around the founder weakens hiring customer access or fundraising, High, Add experienced operating leaders and independent board oversight, High]
      - [Go-to-market introductions, MVP Ventures and founder network, Customer and strategic-partner sourcing, Medium, Introductions do not convert into signed pilots or revenue, High, Require named pipeline and conversion data, High]
      - [Capital access at current valuation, Existing and next-round investors, Funding commercialization and scale-up, High, Unicorn pricing outruns proof and compresses future round flexibility, High, Verify round terms burn plan and milestone gates, High]
      - [Banking and financial-services support, MVP network and financing partners, Working-capital and transaction support, Medium, Scale-up needs outpace available financing infrastructure, Medium, Confirm debt and banking counterparties before production ramp, Medium]
    notes: Public dependency evidence is strongest for founder and investor-network concentration; customer, supplier, and financing counterparties remain incompletely disclosed.
    claimRefs: [CR006, CR008, CR009, CR010, CR011]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Public evidence clusters Genki's highest residual risk around launch proof, compliance readiness, and valuation-dependent financing.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual exposure
      rows:
        - label: Safety and approval readiness
          note: Mission-critical use cases are public, but approval evidence is not.
          values: [High, High, Low, High]
        - label: Launch without customer proof
          note: Product timing is public; commercial proof is not.
          values: [High, High, Low, High]
        - label: Manufacturing and service scale
          note: Public record lacks production-capacity and support evidence.
          values: [Medium, High, Low, High]
        - label: Valuation and next-round flexibility
          note: Unicorn pricing is visible; round economics remain partially opaque.
          values: [Medium, High, Medium, High]
        - label: Founder and network concentration
          note: Customer access and financing infrastructure still appear founder and investor mediated.
          values: [Medium, High, Medium, High]
        - label: Customer-proof gap
          note: Public sources do not yet show named contracts or production deployments.
          values: [High, High, Low, High]
    approximationNotes: Heatmap levels synthesize retained public evidence and should be updated once management discloses pilots, approvals, and round terms.
    claimRefs: [CR002, CR004, CR008, CR009, CR010, CR012, CR013, CR014]
callouts:
  - calloutType: risk
    title: Kill criteria to monitor before underwriting a priced round
    body: >-
      Treat a launch slip beyond the promised first-product window, continued
      absence of named pilot or customer proof, or inability to verify Series A
      economics and governance terms as thesis-break signals. Any one of those
      would imply that the public valuation has continued to outrun operating
      proof rather than merely preceding it.
    claimRefs: [CR002, CR005, CR008, CR009]
