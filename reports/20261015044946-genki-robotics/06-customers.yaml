        - "2026-10-15"
        - MVP Ventures (SU003)
        - Medium
        - Shows commercial relationship-building is still a visible part of the playbook
        - No conversion from introductions to pilots or contracts disclosed
      - - Named customer disclosure
        - null
        - "2026-10-15"
        - Cross-source review (SU001, SU003-SU008)
        - Medium
        - Public diligence cannot verify a lighthouse account or reference customer today
        - No named customer, pilot, LOI, or procurement counterparty surfaced
      - - Retention / durability disclosure
