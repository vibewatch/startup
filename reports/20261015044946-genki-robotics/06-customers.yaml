    claimRefs: [CU003, CU007, CU009, CU011]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Public evidence shows a plausible commercialization sequence, but every stage after
      market targeting still lacks named customer proof.
    data:
      nodes:
        - label: Sector targeting
          actor: Genki and prospective buyers
          phase: 1
          touchpoints:
            - Public safety
            - Urban environments / maintenance
            - Logistics
          note: Public sources describe target workflows rather than live accounts.
          tone: neutral
        - label: Relationship building
          actor: MVP Ventures and Genki
          phase: 2
          touchpoints:
            - Potential customers
            - Strategic partners
          note: Investor support includes introductions, implying GTM still depends on relationship formation.
          tone: warning
        - label: First product launch window
          actor: Genki
          phase: 3
          touchpoints:
            - Planned 2026 launch
            - Move toward commercial deployment
          note: Commercialization timing is visible even though product specifics are still sparse.
          tone: neutral
        - label: Pilot proof gap
          actor: Prospective users
          phase: 4
          touchpoints:
            - No named pilot in assigned evidence
            - No LOI in assigned evidence
          note: The assigned evidence does not identify a test site or first counterparty.
          tone: risk
        - label: Production proof gap
          actor: Paying customers
          phase: 5
          touchpoints:
            - No named production customer in assigned evidence
            - No outcome metric in assigned evidence
          note: The assigned evidence contains no reference deployment or usage denominator.
          tone: risk
        - label: Expansion economics unproven
          actor: Existing accounts
          phase: 6
          touchpoints:
            - No renewal data
            - No concentration data
          note: Land-and-expand remains thesis because durability metrics are absent.
          tone: risk
    approximationNotes: null
    claimRefs: [CU001, CU003, CU004, CU007, CU011, CU012, CU013, CU016]
callouts:
  - calloutType: risk
    title: Valuation visibility currently exceeds customer-proof visibility
    body: >-
      Public reporting shows a roughly $1 billion post-Series A valuation, but the assigned
      source pool still does not reveal a named customer, pilot counterparty, or retention
      metric.
    claimRefs: [CU011, CU014]
  - calloutType: insight
    title: The clearest GTM wedge is mission-critical field work, not broad enterprise adoption
    body: >-
      The retained sources consistently position Genki around public-safety, urban-maintenance,
      and logistics workflows, which is more specific than the company's current customer-proof
      disclosure.
    claimRefs: [CU003, CU007]
  - calloutType: recommendation
    title: Ask for private customer proof before underwriting expansion
    body: >-
      Management should be asked for named pilots, signed contracts or LOIs, deployment
      outcomes, and concentration or renewal data to convert a credible narrative into a
      diligenced customer thesis.
    claimRefs: [CU004, CU011, CU012, CU013]
