        - Could broaden the TAM beyond civic workflows if commercialization lands
        - No named customer, production proof, or utilization metric surfaced
    notes: >-
      Drawn from retained public descriptions of intended end markets; buyer, user, and payer
      roles are explicitly marked as inferences, and commercial proof is limited to the assigned
      evidence set.
