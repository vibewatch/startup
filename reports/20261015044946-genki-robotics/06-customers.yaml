        - Target segment only; no named agency disclosed
        - Potential lighthouse wedge for high-visibility deployments
        - No named customer, pilot counterparty, or procurement record surfaced
      - - Urban maintenance operators
        - Not disclosed; public-works buyer, field-crew user, and municipal or contractor payer are inferred
        - Urban-environment and maintenance workflows
        - Target segment only; no deployment count disclosed
        - Recurring field-operations use cases could support repeat deployments
        - No disclosed contract structure, pricing, or renewal evidence
      - - Logistics operators
        - Not disclosed; operations buyer, warehouse or field user, and enterprise payer are inferred
        - Humanoid robotics for logistics tasks
