        - Target urban-environment or maintenance workflows
        - Undisclosed
        - None publicly disclosed
        - No deployment outcome, utilization metric, or procurement process is public
      - - No named logistics customer disclosed
        - Logistics
        - Secondary-reporting reference to logistics use cases
        - Undisclosed
        - None publicly disclosed
        - No contract, production rollout, or repeat-purchase evidence surfaced
    notes: >-
      This table records the absence of named public customer proof in the retained pool rather
