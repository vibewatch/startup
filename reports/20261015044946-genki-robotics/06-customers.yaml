        - Medium
        - Confirms the company expects to cross from development into first commercialization
        - No SKU, shipment count, launch date, or backlog disclosed
      - - Commercial stage
        - Moving toward commercial deployment
        - "2026-07-29"
        - Nikkei Asia (SU001)
        - Medium
