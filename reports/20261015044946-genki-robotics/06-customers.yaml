        - "2026-10-15"
        - Cross-source review (SU001, SU003-SU008)
        - Medium
        - Renewal strength and expansion economics are still unproven publicly
        - No customer count, churn, NRR, GRR, contract term, or renewal metric disclosed
    notes: >-
      Null means the retained public record did not disclose the metric; cross-source review
      reflects the assigned pool only, not private diligence materials.
