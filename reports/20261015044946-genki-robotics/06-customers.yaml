  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: named customer proof table coverage
      missingEvidence: Named customers, pilot counterparties, LOIs, or procurement documents tied to the first live deployments.
      whyItMatters: Without named references, the customer chapter cannot verify whether Genki has crossed from introductions into real adoption.
      diligencePath: Ask management for customer names, pilot scopes, contract status, and permission to speak with at least one reference account.
      relatedQuestionRefs: [QU003, QU004]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: retention and durability metrics
      missingEvidence: Customer count, renewals, churn, NRR, GRR, contract terms, and satisfaction evidence.
      whyItMatters: Expansion and concentration judgments remain speculative until recurring-customer behavior is visible.
      diligencePath: Request cohort data, renewal schedules, customer concentration by revenue, and any customer NPS or uptime-backed satisfaction evidence.
      relatedQuestionRefs: [QU005, QU006, QU007]
      relatedTableRefs: [TU002]
    - type: missing-source
      severity: material
      topic: product offer and deployment denominator
      missingEvidence: SKU-level product description, pricing, shipped-unit counts, and active deployment totals by segment.
      whyItMatters: Commercial readiness and market uptake cannot be normalized without a disclosed offer and denominator.
      diligencePath: Request the launch SKU, pricing model, target buyer, unit economics assumptions, and a deployment pipeline broken out by stage.
      relatedQuestionRefs: [QU002, QU005, QU008]
