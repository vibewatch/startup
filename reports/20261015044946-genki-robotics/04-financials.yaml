schemaVersion: "report-v2"
artifact: financials
slug: genki-robotics
runDate: 2026-10-15
company:
  name: Genki Robotics
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence still supports a pre-commercial financial profile: the company has
    attracted unusually strong financing signals, but the assigned source pool still does
    not disclose product pricing, named revenue, customers, burn, or runway. That leaves
    the key underwriting question unchanged from the prior refresh context: Genki looks
    financeable because of founder pedigree and investor appetite, not because public unit
    economics have been proven.
sections:
  - id: revenue-model-and-monetization
    title: Revenue model and monetization remain mostly signaled, not disclosed
    body: >-
      The assigned pool does not provide a public pricing page, contract example, or
      management disclosure that would let diligence break Genki's revenue model into
      realized hardware, software, service, or project-finance components. Secondary
      sources consistently describe the company as stealth, pre-deployment, or still
      approaching its first product launch, which means the best public evidence is about
      likely monetization paths rather than booked revenue quality. That distinction
      matters: mission-critical humanoid systems could eventually produce a mix of upfront
      robot sales, integration work, recurring support, and possible software/platform
      revenue, but public sources stop short of proving any signed commercial structure.
      Startuply presents a software-centric flywheel as a likely path rather than a
      disclosed current revenue stream, while two
      low-reputation market summaries say the CEO has discussed a first product launch
      without disclosing target use case, functionality, or pricing. Financially, that
      leaves Genki with a plausible bridge from product launch to revenue, but not yet a
      public bridge from revenue to gross profit.
    claimRefs: [CI001, CI006, CI007, CI012, CI014]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: public-traction-and-unit-economics
    title: Public traction and unit economics are still underwriting blind spots
    body: >-
      Public evidence supports only a narrow set of operating signals. XMAQUINA says there
      is still no public robot demo, product page, disclosed deployment, or revenue.
      Dealroom shows the company as a unicorn-tier startup with disclosed equity funding in
      a broad $50 million to $100 million range and a team size below 100, which is
      directionally consistent with an R&D-stage company rather than a scaled field
      deployment organization. MVP Ventures says it is helping Genki with talent,
      customer, partner, and banking introductions, which implies go-to-market is still
      relationship-led rather than visible through public customer references or disclosed
      channel economics. As a result, standard metrics such as CAC, payback, backlog,
      gross margin, install cost, utilization, and service burden are not merely weakly
      corroborated; they are absent from the reviewed public record. The chapter can
      therefore assess the shape of the revenue engine, but it cannot underwrite that
      engine's efficiency.
    claimRefs: [CI001, CI004, CI008, CI009, CI013, CI015]
    tableRefs: [TI003]
  - id: capital-needs-and-financial-verdict
    title: Capital access looks stronger than capital visibility
    body: >-
      The financial story is clearest on capital formation and weakest on capital adequacy.
      Multiple sources agree that Genki has already moved from a large seed into a
      roughly $1 billion Series A valuation before public commercialization, which is an
      unusually aggressive financing outcome for a stealth humanoid robotics company.
      Altis is openly skeptical, describing the valuation as arriving before any public
      product specification or customer proof, and XMAQUINA likewise says the company has
      no disclosed deployment or revenue. Those signals do not prove the business cannot
      work; they show that today's financing case is still anchored more to founder
      pedigree, investor access, and category heat than to public evidence on margin path
      or cash conversion. Because the assigned pool discloses no cash balance, burn rate,
      debt exposure, or runway, diligence still needs direct management evidence before it
      can judge how much additional equity or non-dilutive capital Genki will need to
      reach repeatable commercial scale.
    claimRefs: [CI002, CI003, CI005, CI010, CI011, CI015]
callouts:
  - calloutType: risk
    title: Underwriting blocker
    body: >-
      The public record still cannot quantify burn, runway, gross margin, or customer
      conversion, so capital adequacy remains a management diligence item rather than a
      source-backed investment conclusion.
    claimRefs: [CI005, CI009, CI010]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - ["Humanoid system sale", "Upfront sale of a robot or deployed system", "per system", "No public price, contract, or deployment disclosed", "Low - mechanism is plausible but unverified commercially", "Request signed order form, list price, and first delivery schedule"]
      - ["Software / platform layer", "Potential recurring revenue hypothesized in secondary software-flywheel analysis", "per site / per fleet / subscription", "No public monetization terms disclosed", "Low - externally inferred, not contract-backed", "Request pricing architecture and evidence of billable software SKUs"]
      - ["Integration / deployment services", "Installation, workflow configuration, and safety validation for mission-critical environments", "per deployment", "No public statement of service fees or billable scope", "Low - inferred from mission-critical deployment needs", "Request implementation SOW template and professional-services pricing"]
      - ["Support / maintenance", "Ongoing support, field service, and uptime assistance after launch", "annual contract", "No public support pricing or attach rate disclosed", "Low - common for hardware systems but not evidenced here", "Request support packages, SLA terms, and renewal assumptions"]
    notes: "Rows distinguish plausible revenue layers from publicly verified commercialization; null pricing means no assigned source disclosed terms."
    enumerationScope:
      coverage: partial
      basis: "Publicly reviewed sources describe likely monetization layers but do not provide a full customer contract or price sheet."
    claimRefs: [CI001, CI006, CI007, CI014]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Price / contract element
      - Public signal
      - List vs. realized pricing
      - Source quality
      - Implication
    rows:
      - ["Robot / system list price", "Undisclosed in reviewed sources", "Unknown", "Low", "Public evidence cannot translate product launch into revenue per deployment"]
      - ["Software or platform fee", "No public recurring fee disclosed", "Unknown", "Low", "Cannot separate hardware revenue from any future recurring layer"]
      - ["Integration / implementation charge", "No public SOW or implementation fee disclosed", "Unknown", "Low", "Gross-to-net economics remain untestable"]
      - ["Support / maintenance contract", "No public SLA or support pricing disclosed", "Unknown", "Low", "No basis for retention or service-margin assumptions"]
    notes: "This table records pricing absences, not zero prices; each row marks a monetization field the current public record leaves open."
    enumerationScope:
      coverage: partial
      basis: "Coverage is limited to pricing elements a robotics investor would normally request; every reviewed source leaves them undisclosed."
    claimRefs: [CI001, CI006, CI007, CI012]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["CAC / sales payback", null, "Low", "Needed to judge whether founder-led or partner-led GTM can scale economically", "Provide pipeline-to-close funnel, blended CAC, and payback by customer segment"]
      - ["Gross margin / bill of materials", null, "Low", "Humanoid hardware economics depend on component cost, assembly yield, and service burden", "Provide BOM, target gross margin bridge, and sensitivity to volume"]
      - ["Deployment / service cost", null, "Low", "Mission-critical installs can absorb field engineering and support cost before recurring revenue appears", "Provide installation labor model, support staffing, and warranty reserve assumptions"]
      - ["Working capital / inventory financing", null, "Low", "Hardware ramp can require pre-build inventory, supplier deposits, and receivable financing", "Provide manufacturing plan, payment terms, and inventory turn assumptions"]
      - ["Cash burn / runway", null, "Low", "Capital adequacy depends on current cash, monthly burn, and timing to next fundraise", "Provide cash balance, trailing burn, runway, and debt or project-finance facilities"]
    notes: "Null values indicate unavailable public data, not immateriality; each row lists the management evidence required for underwriting."
    enumerationScope:
      coverage: partial
      basis: "The table covers core unit-economics fields needed for underwriting, but the assigned public sources do not publish the numeric values."
    claimRefs: [CI004, CI005, CI008, CI009, CI010, CI013]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: "Public evidence shows a route from launch to revenue, but not yet from revenue to proven gross profit."
    data:
      nodes:
        - id: stage-1
          label: "Prototype / first product milestone"
          detail: "Public 2026 reporting points to a first product launch, but no public specification or pricing sheet is available."
        - id: stage-2
          label: "Pilot or design win"
          detail: "No named pilot, LOI, procurement process, or customer deployment is public in the assigned pool."
        - id: stage-3
          label: "Hardware system sale"
          detail: "Likely first monetization event, but no public per-system price or contract structure is disclosed."
        - id: stage-4
          label: "Deployment / integration work"
          detail: "Mission-critical use cases imply onboarding and field setup costs, yet public fee terms are absent."
        - id: stage-5
          label: "Support / software layer"
          detail: "Secondary analysis hypothesizes a software-centric flywheel, but no recurring layer is publicly priced."
        - id: stage-6
          label: "Gross profit visibility"
          detail: "Margin proof requires BOM, service, warranty, and utilization data that the assigned public evidence does not disclose."
      edges:
        - from: stage-1
          to: stage-2
          label: "Commercial proof starts only if launch converts into a real pilot"
        - from: stage-2
          to: stage-3
          label: "Revenue begins when a pilot becomes a paid deployment"
        - from: stage-3
          to: stage-4
          label: "Implementation work can add service revenue and cost"
        - from: stage-4
          to: stage-5
          label: "Installed fleets can support recurring software or support fees"
        - from: stage-5
          to: stage-6
          label: "Gross profit depends on manufacturing and service cost disclosure"
    approximationNotes: "The sequence reflects public commercialization logic and explicitly marks the undisclosed steps; it is not a claim of realized revenue today."
    claimRefs: [CI001, CI006, CI007, CI010, CI012, CI014]
