      - number: '5.3'
        title: 部署路径与运营依赖
        blocks:
          - type: paragraph
            body: >-
              Genki 的部署路径似乎依赖尚未公开的证明点。二手发布报道称管理层目标是在 2026 年推出首款商业产品，但同一批报道没有披露产品功能、目标垂直行业和价格。同时，MVP
              称其正在帮助招聘并引荐客户和战略伙伴，这说明商业化仍部分依赖投资者网络杠杆，而非成熟的自助服务或渠道界面。指定资料池中唯一可见的开发者界面是很小的公开 GitHub 存在，本章没有保留 API 文档、SDK
              或集成目录。
            claimRefs:
              - CE007
              - CE008
              - CE011
              - CE012
      - number: '5.4'
        title: 差异化与控制缺口
        blocks:
          - type: paragraph
            body: >-
              当前差异化论点更多建立在创始人履历和品类选择上，而非已披露基准。独立资料将 Genki 与 Andy Rubin 的机器人背景联系起来，并将东京描述为有意选择的硬件人才基地；伙伴报道则强调实体 AI
              和先进制造。这为全栈人形机器人公司提供了合理基础，但不等于产品证明。保留来源中仍没有公开基准、正常运行时间统计、已命名认证或正式的安全、隐私和安全控制披露。对尽调而言，产品的核心风险不是论点不连贯，而是公开证据尚未追上这一抱负。
            claimRefs:
              - CE003
              - CE004
              - CE010
              - CE013
              - CE014
      - number: '5.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 公开证明仍落后于论点
            body: 本章可以支持广泛的人形机器人全栈抱负和早期商业化时间线，但仅凭指定公开证据，无法支持关于性能、部署准备度或安全 / 合规成熟度的详细主张。
            calloutType: risk
            claimRefs:
              - CE006
              - CE011
              - CE013
              - CE014
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 商业化临近，但公开采用证据仍薄弱
        blocks:
          - type: paragraph
            body: >-
              当前最强的客户信号不是实际部署指标，而是发布里程碑。Nikkei Asia 于 2026 年 7 月 29 日报道称，Genki
              计划在今年推出首款产品，并在融资后走向商业部署；这说明公司处于市场进入边缘，而不是已明显规模化的收入阶段。独立二手报道反复称产品目标行业、定价和运营细节仍未披露，Dealroom
              也仍将商业模式描述为私有。外部读者可以看到融资势头和商业化时间线，但仍无法查看已命名客户、部署量、客户数增长，甚至无法确认推向市场的具体商业方案。
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU009
              - CU010
