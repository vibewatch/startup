      - number: '4.2'
        title: 公开牵引和单位经济性仍是投资判断盲区
        blocks:
          - type: paragraph
            body: >-
              公开证据仅支持一组有限的运营信号。XMAQUINA 称目前仍没有公开机器人演示、产品页、已披露部署或收入。Dealroom 将公司列为独角兽级初创公司，披露股权融资大致在 $50 million 到 $100
              million 之间，团队规模低于 100 人；这与研发阶段公司相符，而不是规模化现场部署组织。MVP Ventures 称其正在帮助 Genki
              对接人才、客户、伙伴和银行，因此其市场进入仍靠关系推动，而不是通过公开客户背书或已披露的渠道经济性体现。因此，CAC、回本期、积压订单、毛利率、安装成本、利用率和服务负担等标准指标，不只是佐证薄弱，而是在审阅的公开记录中完全缺失。本章可以评估收入引擎的形态，却无法判断其效率。
            claimRefs:
