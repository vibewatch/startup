      - number: '7.3'
        title: 资本、伙伴与创始人依赖可能收紧下行空间
        blocks:
          - type: paragraph
            body: >-
              Caplight 列出 2026 年 4 月 21 日的 Series A，并估计 Genki 估值为 $1 billion；Dealroom 却只显示宽泛的融资和员工数区间，没有完整运营图景。Caplight
              公开页面未披露 Series A 金额，并称备案文件未公开展示，因此外部人士仅凭公开材料无法核实轮次经济条款、投资者权利或下行保护。同时，MVP 称其正在帮助 Genki
              对接人才、潜在客户、战略伙伴和银行关系，这说明关键商业与融资基础设施仍围绕创始人搭建。如果发布延期，或客户证明出现前融资条款收紧，估值将更难辩护。
            claimRefs:
              - CR006
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR008
              - CR009
              - CR010
              - CR011
      - number: '7.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 判断定价轮次前需监测的否决标准
            body: 如果发布晚于承诺的首款产品窗口、已命名试点或客户证明持续缺失，或无法核实 Series A 经济条款和治理条款，应将其视为论点破坏信号。任一情况都意味着公开估值继续跑在运营证明之前，而不只是暂时领先。
            calloutType: risk
            claimRefs:
              - CR002
              - CR005
              - CR008
              - CR009
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 头条估值可见，但投资判断输入仍薄弱
        blocks:
          - type: paragraph
            body: >-
              保留的公开证据不断重复一个熟悉的头条：据报道，Genki 在 2026 年 4 月的 Series A 中达到约 $1 billion
              估值；但第三方数据库仍只显示大致融资区间，没有披露投后估值、轮次规模或领投方组合。这很重要，因为公开的乐观情景仍要求投资者押注稀缺性、创始人履历和品类热度，却没有通常能帮助外部投资者判断稀释、优先权悬置或实际注入多少新资本的融资细节。MVP
              投资组合页面确实是积极信号，但也是合作伙伴提供的证据，不能单独证明估值纪律。按今天的证据，价格信号是真实的，但验证该价格所需的披露并不存在。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV009
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV011
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV006
              - CV011
              - CV014
              - CV015
      - number: '8.2'
        title: 上行论点可信，但仍跑在公开商业化证明之前
        blocks:
          - type: paragraph
            body: >-
              这里存在一套连贯论点。多个保留来源将 Genki 描述为一家位于东京、建立在 Andy Rubin 硬件与平台履历基础上的人形机器人初创公司；MVP 也明确称，投资原因是看到了实体
              AI、韧性硬件和关键任务公共安全用例构成重要机器人公司的要素。反向论点同样重要：Startuply 称商业模式仍是假设而非证明，尚未公布商业合同；Cagexam
              称甚至首款产品的功能、目标行业和价格仍未披露。Dealroom 的“<100”员工数标记进一步说明，独角兽叙事下，公司运营规模仍处早期。发布时点本身也是弱证据：Cagexam 将计划归因于 CEO 和
              Nikkei Asia，却没有直接引语，且文本对“今年”和 2025 年的说法不一致。结论是，公司可能值得持续关注，但不值得不计估值地入场。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV013
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV008
              - CV010
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.3'
        title: 在发布证明和轮次条款明确前，建议维持跟踪
        blocks:
          - type: paragraph
            body: >-
              实际建议是跟踪；按报道的头条价格看，风险高且估值昂贵。若 Genki
              能将归因于公司的首款产品计划转化为已命名试点或客户，披露价格和技术规格，并证明融资由可信投资者按干净条款领投，而不是单靠稀缺性推动，则存在乐观情景。基准情景是，公司保留战略期权价值，但由于运营模式仍大量依赖推断，估值依旧难以确定。悲观情景很直接：如果发布延期，或发布时仍没有商业披露，创始人叙事与运营证明之间的差距可能让下一轮融资变成平轮或下轮谈判。因此，下一笔尽调费用应投向客户证明、产品证明和条款清单证明，而不是抽象的市场热情。
            claimRefs:
              - CV006
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 当前判断：跟踪，不买入
            body: 合适的做法是把 Genki 留在尽调清单上；在公开客户、定价和轮次条款证据改善前，不应据报道的独角兽估值作投资判断。
            calloutType: recommendation
            claimRefs:
              - CV011
              - CV012
              - CV014
          - type: callout
            title: 论点破坏触发条件
            body: 如果首款产品上市时仍没有已命名客户、定价披露或更清晰的融资条款，下一次估值事件可能暴露平轮或下轮风险，而不是验证今天的稀缺性溢价。
            calloutType: risk
            claimRefs:
              - CV006
              - CV011
              - CV012
              - CV015
