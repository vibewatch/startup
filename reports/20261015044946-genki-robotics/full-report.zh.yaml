      - number: '3.3'
        title: 持久性与替代风险
        blocks:
          - type: paragraph
            body: >
              保留资料中最有力的持久性论据不是专有指标，而是关键任务聚焦、Rubin 的机器人履历和东京的人才密度组合。即便如此，这一判断仍属暂定。Wecklabs 的竞争分析称 Genki
              正进入一个成熟的机器人生态；Cagexam 则指出，从开发走向发布只是里程碑，不等于商业适配已被证明。关于 Genki
              成立时间的二手资料互相矛盾，也再次说明公开成熟度指标仍很嘈杂。在公司公布真实部署、定价和客户证据前，商品化和既有厂商反应风险仍高，因为多条替代方案都可以争夺同一批工作。
            claimRefs:
              - CP007
              - CP008
              - CP010
              - CP011
              - CP012
              - CP014
              - CP015
      - number: '3.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 商业比较目前仍主要是一张尽调地图
            body: 保留资料列出了竞争者类别和 Genki 的目标工作流，但没有提供同行直接定价、胜负证据或经验证的客户部署。这使本章适合勾勒市场格局，却无法完成采购级比较。
            calloutType: risk
            claimRefs:
              - CP006
              - CP014
          - type: callout
            title: 在功能证明之前，渠道触达可能更重要
            body: MVP 的投资组合页面称其正在帮助 Genki 招募人才，并连接潜在客户和战略伙伴。这说明在产品尚未披露期间，分销和关系建设是近期竞争切入点的一部分。
            calloutType: insight
            claimRefs:
              - CP009
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式和变现方式大多只是信号，尚未披露
        blocks:
          - type: paragraph
            body: >-
              指定资料池没有公开定价页、合同样本或管理层披露，无法让尽调把 Genki
              的收入模式拆分为已实现的硬件、软件、服务或项目融资部分。二手来源一贯将公司描述为隐身、部署前或仍在接近首款产品发布，因此公开证据最多只能说明可能的变现路径，而不是已确认的收入质量。这一区分很重要：关键任务人形机器人系统未来可能带来一次性机器人销售、集成服务、经常性支持以及潜在软件
              / 平台收入的组合，但公开来源尚未证明任何已签署的商业结构。Startuply 将软件驱动的飞轮描述为可能路径，而非当前已披露的收入流；两篇低信誉市场摘要称 CEO
              谈过首款产品发布，却未披露目标用例、功能或价格。就财务而言，Genki 从产品发布到收入之间有一条合理桥梁，但从收入到毛利之间还没有公开证据。
            claimRefs:
              - CI001
