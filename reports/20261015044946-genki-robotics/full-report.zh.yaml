      - number: '5.2'
        title: 架构与成熟度信号
        blocks:
          - type: paragraph
            body: >-
              Genki 如何构建产品的最佳公开描述来自二手报道，而非一手技术文档。Dealroom News 描述了覆盖硬件、传感器、软件和系统的全栈抱负，Startuply 也将项目描述为围绕双足人形机器人的具身
              AI。这些是有用的方向性信号，但远未构成经验证的技术架构。公开成熟度指标也仍处早期：Dealroom 称 2025 年末报道指向团队组建和初始原型，而 2026
              年二手报道仍将首款商业产品视为即将到来的里程碑，而不是已交付的平台。
