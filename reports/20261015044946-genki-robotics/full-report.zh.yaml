    title: 产品与技术
    sections:
      - number: '5.1'
        title: 当前公开产品范围
        blocks:
          - type: paragraph
            body: >-
              这家据报道瞄准复杂人形机器人工作流的公司，公开记录异常薄弱。Genki
              官网称正在开发结合智能、灵巧性和韧性的先进机器人系统，并明确将其锚定于公共安全和城市维护用例。投资者和数据平台大体重复同一切入点：面向人类环境关键任务的人形机器人。来源没有提供产品目录、SKU
              图谱或量化任务边界。因此，目前最稳妥的判断是，Genki 有清晰的工作流叙事，但产品层面仅披露很少。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE009
              - CE014
