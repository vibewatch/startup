chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、定位与披露基线
        blocks:
          - type: paragraph
            body: >-
              Genki
              官网如今给出了清晰的使命，但更像一页简略的身份介绍，而不是完整的公司画像。公司称正在为公共安全、城市维护及其他使命驱动型环境打造先进人形机器人系统，这与第三方数据库和投资方口径一致。保留来源反复将东京列为总部，但成立年份并未厘清：Tracxn
              显示为 2022 年，Dealroom 显示为 2025 年。这一矛盾会改变投资者对产品成熟度、融资节奏以及公司定位的判断：Genki 究竟是刚浮出水面的隐身项目，还是已经运营多年、执行力经过验证的公司。
            claimRefs:
              - CO001
              - CO002
              - CO003
