      - CR014
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 公开定价的透明度高于公开投资判断细节，因此建议仍为持续跟踪。
    data:
      nodes:
        - id: narrative
          label: 创始人与合作伙伴叙事
          summary: Andy Rubin pedigree, physical AI ambition, and MVP backing create real strategic interest.
        - id: category
          label: 人形机器人赛道稀缺性
          summary: Named comps show investors will pay for category leadership in humanoid robotics.
        - id: price
          label: 独角兽估值头条
          summary: Public databases repeat a roughly $1B valuation narrative.
        - id: terms
          label: 融资条款仍不透明
          summary: Public sources do not disclose round size, lead investor, or preference stack.
        - id: proof
          label: 商业验证缺口
          summary: Round size, lead investor, pricing, customers, and revenue history are still not publicly disclosed.
        - id: call
          label: 严守价格纪律，持续跟踪
          summary: Wait for launch, customer, and round-term proof before underwriting upside.
      edges:
        - from: narrative
          to: category
          label: 背景履历放大赛道关注度
        - from: category
          to: price
          label: 稀缺性与背景履历可能推动价格势能
        - from: price
          to: terms
          label: 头条价格仍缺少融资细节
        - from: terms
          to: proof
          label: 头条估值仍需经营证据
        - from: proof
          to: call
          label: 验证缺失使当前立场显得昂贵
    approximationNotes: 本图是定性决策链，不是估值模型。
    claimRefs:
      - CV004
      - CV006
      - CV011
      - CV014
      - CV015
