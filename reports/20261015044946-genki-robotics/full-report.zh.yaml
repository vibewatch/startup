      - CM006
      - CM007
      - CM012
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 仅使用留存来源中有证据支持的 1-5 综合评分，绘制部署准备度与工作流广度的序数图。
    data:
      xAxis:
        label: 部署准备度（1=披露前，5=已证实现场部署）
        min: 1
        max: 5
        low: 披露前
        high: 已证实部署
        description: Ordinal synthesis from retained source text.
        scale: ordinal
      yAxis:
        label: 工作流广度（1=狭窄任务，5=多环境任务集）
        min: 1
        max: 5
        low: 狭窄任务
        high: 广泛任务集
        description: Ordinal synthesis from retained source text.
        scale: ordinal
      points:
        - label: Genki Robotics
          x: 2
          'y': 4
          note: 关键任务公共安全和城市环境是明确方向，但产品功能与定价仍 未披露。
        - label: 创业公司人形机器人同行
          x: 3
          'y': 4
          note: Startuply 将 Figure AI 和 1X 列为最接近的公开同行层级，但分配材料没有提供 直接规格或定价细节。
        - label: 工业领域既有企业
          x: 4
          'y': 2
          note: 留存来源暗示机器人生态更成熟，但没有提供一对一工作流 重叠细节。
        - label: 相邻领域专业厂商
          x: 4
          'y': 2
          note: 专业化替代方案可以在更窄的工作流上竞争，无需匹配宽泛的人形机器人叙事。
        - label: 内部构建 / 系统集成
          x: 2
          'y': 3
          note: Genki 的全栈定位意味着买方仍可将其与自建或集成自身技术栈比较。
        - label: 现状劳动力 / 手工作流
          x: 5
          'y': 1
          note: 今天已有人工团队承担目标工作，因此 Genki 仍需在替代人工前证明 ROI。
    approximationNotes: 1-5 坐标是分析师根据引用论断编制的序数评分，不是 厂商发布的基准，也不是推断出的市场份额排名。
    claimRefs:
      - CP001
      - CP004
      - CP006
      - CP008
      - CP013
      - CP015
  - id: FI001
    title: 收入模式桥接
    type: flow
    summary: 公开证据显示了从发布到收入的路径，但尚未显示从收入到已证实毛利的路径。
    data:
      nodes:
        - id: stage-1
          label: 原型 / 首款产品里程碑
          detail: 2026 年公开报道指向首款产品发布，但没有公开规格或定价表 可用。
        - id: stage-2
          label: 试点或设计赢单
          detail: 分配材料中没有公开的具名试点、LOI、采购流程或客户部署。
        - id: stage-3
          label: 硬件系统销售
          detail: 可能是首次变现事件，但未披露公开的单系统价格或合同结构。
        - id: stage-4
          label: 部署 / 集成工作
          detail: 关键任务用例意味着会产生上线和现场部署成本，但没有公开费用条款。
        - id: stage-5
          label: 支持 / 软件层
          detail: 二手分析假设存在以软件为中心的飞轮，但没有公开任何经常性收入层的定价。
        - id: stage-6
          label: 毛利可见性
          detail: 利润率证明需要 BOM、服务、保修和利用率数据，而分配到的公开证据 未披露这些数据。
      edges:
        - from: stage-1
          to: stage-2
          label: 只有发布转化为真实试点，商业化证明才开始
        - from: stage-2
          to: stage-3
          label: 试点转化为付费部署时，收入才开始
        - from: stage-3
          to: stage-4
          label: 实施工作可以带来服务收入和成本
        - from: stage-4
          to: stage-5
          label: 已部署机队可以支撑经常性软件或支持费
        - from: stage-5
          to: stage-6
          label: 毛利取决于制造和服务成本披露
    approximationNotes: 该顺序反映公开的商业化逻辑，并明确标出未披露步骤；这不是关于 今天已经实现收入的断言。
    claimRefs:
      - CI001
      - CI006
      - CI007
      - CI010
      - CI012
      - CI014
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据支持六层全栈雄心，但在工作流叙事以下，披露细节明显变薄。
    data:
      layers:
        - label: 任务工作流
          detail: 公开来源一致将产品锚定在公共安全、城市维护及其他 关键任务环境。
          outputs:
            - 公共安全
            - 城市维护
            - 关键任务应用
        - label: 形态
          detail: 第三方描述指向为人类构建的真实环境设计的人形和双足机器人。
          modules:
            - 人形机器人
            - 双足机器人
        - label: 集成技术栈
          detail: Dealroom News 描述了从硬件、传感器到软件和系统的构建。
          modules:
            - 硬件
            - 传感器
            - 软件
            - 系统
        - label: 产品成熟度
          detail: 公开成熟度标志是原型和首款商业产品目标，而非已披露的生产 部署。
          outputs:
            - 初始原型
            - 首款产品目标
        - label: 赋能面
          detail: 外部赋能证据稀薄，目前仅限于极简的公开 GitHub 页面和 投资者协助引荐。
          modules:
            - 公开 README
            - 招聘支持
            - 客户引荐
            - 战略伙伴引荐
        - label: 控制缺口
          detail: 没有留存来源记录认证、正常运行时间指标、正式安全 / 隐私控制或 部署基准。
          outputs:
            - 无公开认证
            - 无公开可靠性指标
            - 无公开安全 / 隐私细节
    approximationNotes: 该技术栈是对留存公开描述的分析综合，而非公司发布的架构 文件。
    claimRefs:
      - CE002
      - CE006
      - CE010
      - CE011
      - CE012
      - CE013
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据显示出合理的商业化顺序，但市场定位之后的每个阶段仍缺少 具名客户证明。
    data:
      nodes:
        - label: 目标行业
          actor: Genki and prospective buyers
          phase: 1
          touchpoints:
            - Public safety
            - Urban environments / maintenance
            - Logistics
          note: 公开资料描述的是目标工作流，而非实际客户账户。
          tone: neutral
        - label: 关系建立
          actor: MVP Ventures and Genki
          phase: 2
          touchpoints:
            - Potential customers
            - Strategic partners
          note: 投资人支持包括牵线搭桥，因此市场拓展（GTM）仍依赖关系建立。
          tone: warning
        - label: 首次产品发布窗口
          actor: Genki
          phase: 3
          touchpoints:
            - Planned 2026 launch
            - Move toward commercial deployment
          note: 尽管产品细节仍然稀少，但商业化时间点已经明确。
          tone: neutral
        - label: 试点验证缺口
          actor: Prospective users
          phase: 4
          touchpoints:
            - No named pilot in assigned evidence
            - No LOI in assigned evidence
          note: 分配到的证据没有指出测试地点或首个交易对手方。
          tone: risk
        - label: 生产验证缺口
          actor: Paying customers
          phase: 5
          touchpoints:
            - No named production customer in assigned evidence
            - No outcome metric in assigned evidence
          note: 分配到的证据没有参考部署案例或使用量分母。
          tone: risk
        - label: 扩张经济性尚未验证
          actor: Existing accounts
          phase: 6
          touchpoints:
            - No renewal data
            - No concentration data
          note: 由于缺少持久性指标，先获客再扩张仍只是投资论点。
          tone: risk
    approximationNotes: null
    claimRefs:
      - CU001
