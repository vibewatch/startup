      - number: '1.2'
        title: 创始人依赖、融资姿态与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              公开领导层信息高度集中在 Andy Rubin 身上。当前保留证据反复将 Rubin
              与公司联系起来，但没有呈现一组同等明确的现任运营高管或公开董事会名单，因此治理尽调仍不完整。融资方向较清楚，但数字较宽泛：数据库普遍指向 Series A 阶段，两轮融资约 $50M；估值则有“据报道
              Series A 为 $1B”的精确说法，也有更宽的当前区间。MVP Ventures
              自身的投资组合页面很关键：它确认至少存在一段活跃的投资方—合作伙伴关系，也显示公司目前仍依靠人才、客户和银行引荐，而不是成熟的商业基础设施。
