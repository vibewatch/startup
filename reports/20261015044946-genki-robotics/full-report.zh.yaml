      - number: '7.2'
        title: 执行风险仍高，因为商业化证据仍薄弱
        blocks:
          - type: paragraph
            body: >-
              公开证据仍将 Genki 描述为产品前、基本处于隐身状态。Robottoday 称原型仍在开发，首款产品计划于年内推出；Startuply 称尚未公布商业合同。2026
              年发布分析页面补充称，产品细节、价格和客户验证均未公开，而 Dealroom
              将公司置于竞争激烈且资本密集的人形机器人市场。因此，在试点、生产部署或参考客户的公开证据出现前，投资者就要判断进度风险、产品市场匹配风险、制造和服务准备度风险，以及漫长的企业或公共部门销售周期。
