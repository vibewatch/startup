  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 留存来源仅量化了宽泛的工业机器人类比市场；所有更窄的 Genki 相关层面 仍未公开披露。
    data:
      items:
        - label: 工业机器人类比市场（2022）
