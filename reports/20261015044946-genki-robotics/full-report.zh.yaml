            - 高
            - 低
            - 高
        - label: 估值与下一轮融资灵活性
          note: 独角兽定价可见，但本轮融资经济条件仍部分不透明。
          values:
            - 中
            - 高
            - 中
            - 高
        - label: 创始人与网络集中度
          note: 客户触达和融资基础设施仍似乎由创始人和投资人居间促成。
          values:
            - 中
            - 高
            - 中
            - 高
