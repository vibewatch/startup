  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 任何 TAM 判断前的支持性市场边界
        blocks:
          - type: paragraph
            body: >-
              在进行任何规模测算前，保留来源支持一个较窄的市场定义：Genki 一贯被描述为面向公共安全、城市环境及其他关键任务工作的​​人形机器人项目，而不是通用 AI
              软件公司或已披露的横向自动化平台。边界仍较模糊。Startuply 将叙事扩展到城市维护和物流，而 MVP
              自身的表述更聚焦公共安全和城市环境用例。因此，相关替代方案不只是其他人形机器人初创公司，还包括现有人工团队、传统工业自动化、协作机器人和已经能以更低成本解决窄任务的巡检无人机。
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM008
      - number: '2.2'
        title: 受证据约束的规模测算仍很宽泛
        blocks:
          - type: paragraph
            body: >-
              保留资料没有为 Genki 的实际切入点提供清晰的 TAM、SAM、SOM 体系。唯一的数字线索来自 Startuply 摘引 Allied Market Research 的摘要：广义工业机器人市场在 2022
              年为 $55.8 billion，到 2032 年为 $165.2 billion，对应 11.5%
              CAGR。这可以作为资本和需求流向自动化的类比，但范围太宽，不能据此评估面向公共安全或城市维护部署的人形机器人论点。Startuply 还称，关键任务岗位的人形机器人专项 TAM
              尚无公开数据，因此更窄的测算仍需一手采购、预算或工作流数据。
            claimRefs:
              - CM006
              - CM007
