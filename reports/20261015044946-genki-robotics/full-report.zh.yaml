      - number: '2.3'
        title: 买方和驱动因素可以推断，但商业化证据薄弱
        blocks:
          - type: paragraph
            body: >-
              需求侧信号更多是定性的，而非定量的。Dealroom 对东京的分析和后续发布评论指向一个具备制造深度、工程人才和政策支持的日本机器人生态；Wecklabs
              则将劳动力短缺和生产率压力视为多个终端市场反复出现的自动化驱动因素。即便如此，商业化证据仍薄弱：Robotico 将公司描述为隐身状态，Robot24 没有列出已发布的机器人型号，Cagexam
              称产品功能、目标行业和价格仍未披露。MVP 的投资组合说明也很有信息量：它强调潜在客户和战略伙伴引荐，而不是已命名的试点或合同签约。
            claimRefs:
              - CM003
              - CM004
              - CM010
              - CM011
              - CM012
              - CM013
