      - number: '6.3'
        title: 持久性、扩张和集中度仍无公开证明
        blocks:
          - type: paragraph
            body: >-
              指定来源集中没有公开的客户持久性证据。保留来源没有披露
              NRR、GRR、流失率、续约率、合同期限、客户集中度，甚至没有基本的客户数分母，因此任何“先落地再扩张”的叙事都仍是投资判断假设，而非已证明的表现。指定记录中最具体的扩张机制仍处于规模化之前：推出首款产品，利用投资者和伙伴网络打开客户入口，再将引荐转化为试点或生产部署。如果
              Genki 获得市政或工业标杆客户，这可以成为可信切入点；但当前披露无法说明公司依赖的是少数引荐、少量潜在客户，还是更广泛且可重复的需求引擎。
            claimRefs:
              - CU004
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 当前估值透明度高于客户证明透明度
            body: 公开报道显示 Series A 后估值约 $1 billion，但指定资料池仍未披露已命名客户、试点对手方或留存指标。
            calloutType: risk
            claimRefs:
              - CU011
              - CU014
          - type: callout
            title: 最清晰的 GTM 切入点是关键任务现场工作，而非广泛企业采用
            body: 保留来源一贯将 Genki 定位于公共安全、城市维护和物流工作流，这比公司当前的客户证明披露更具体。
            calloutType: insight
            claimRefs:
              - CU003
              - CU007
          - type: callout
            title: 判断扩张前应索取私有客户证明
            body: 应要求管理层提供已命名试点、签署合同或 LOI、部署结果以及集中度或续约数据，把可信叙事转化为经过尽调的客户论点。
            calloutType: recommendation
            claimRefs:
              - CU004
              - CU011
              - CU012
              - CU013
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 公开资料仍未证明监管与责任准备度
        blocks:
          - type: paragraph
            body: >-
              Genki
              所称目标市场——公共安全、城市维护及其他关键任务环境——比消费设备发布承担更高的可靠性、安全性和操作方问责要求。然而，保留的公开记录没有产品规格、已命名认证、披露的安全协议或公开部署批准。Robottoday
              称截至 2026 年 8
              月，公司尚未公开交付机器人，可验证的技术事实仍局限于融资历史、领导层和使命陈述。面向发布的市场分析页面也称产品功能、目标行业、价格和任何适用的监管许可仍未说明。因此，法律、安全、出口管制、隐私和公共采购尽调仍是待判断事项，而不是已经排除的风险。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR012
              - CR014
