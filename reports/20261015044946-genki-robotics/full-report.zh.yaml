        - label: 公共安全部署范围
          displayValue: Undisclosed
          note: MVP 点名公共安全，但没有公开预算或部署数量。
        - label: 城市维护部署范围
          displayValue: Undisclosed
          note: 二手简介提及城市维护，但留存材料没有支出依据。
        - label: 具名 Genki 客户范围
          displayValue: Undisclosed
          note: MVP 讨论向潜在客户引荐，但未披露试点或合同。
    approximationNotes: 该图有意将一个宽泛的类比市场估计与更窄的未披露层面混合，以展示 留存公开规模测算在哪些地方失效。
