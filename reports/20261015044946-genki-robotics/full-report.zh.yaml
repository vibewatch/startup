      - number: '4.3'
        title: 资本获取看起来强于资本透明度
        blocks:
          - type: paragraph
            body: >-
              财务故事在资本形成上最清晰，在资本充足性上最薄弱。多个来源一致认为，Genki 在公开商业化前已从较大规模种子轮走到约 $1 billion 的 Series A
              估值；对一家隐身人形机器人公司而言，这是异常激进的融资结果。Altis 公开持怀疑态度，称该估值早于任何公开产品规格或客户证明；XMAQUINA
              也称公司没有披露部署或收入。这些信号并不能证明业务无法成功，只说明今天的融资论点更多锚定于创始人履历、投资者渠道和品类热度，而不是毛利路径或现金转化的公开证据。由于指定资料池没有披露现金余额、烧钱速度、债务敞口或现金跑道，仍需管理层直接证据，才能判断
              Genki 需要多少额外股权或非稀释资本来达到可重复的商业规模。
            claimRefs:
              - CI002
              - CI003
              - CI005
              - CI010
              - CI011
              - CI015
