      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 首款产品按确认的时间表发布，已披露试点转化为可核验 客户，定价和产品规格公开，下一轮由可信投资者以清晰条款领投。
        - 只有当商业化证据追上当前独角兽叙事，价格才更站得住脚；这需要赶上 创始人与品类叙事。
        - 硬件执行、客户采用和融资条款导致的稀释仍需过关。
        - 这需要多项新的公开证明，而这些证明目前都不在留存材料中。
      - - 基准
        - Genki 发布有实质意义的产品，但客户、定价和融资披露仍不完整。
        - 公司保留了期权价值，但外部投资者仍需保持入场纪律，因为估值 容易重复传播，却难以验证。
        - 披露稀疏会让价格发现区间很宽，也让优先权风险不透明。
        - 与当前证据最一致：热度可见，但投资判断输入不完整。
      - - 悲观
        - 发布延期，或在没有具名客户、定价及融资透明度的情况下到来。
        - 下一次定价事件相对当前头条价格可能持平或下调，因为叙事不再 领先于缺失的证明。
        - 商业化延迟、转化疲弱或轮次条款压力都可能迫使重新定价。
        - 直接得到当前合同、定价和轮次经济性缺口的支持。
    notes: 情景表述是分析性的，而非公司指引；它锚定留存公开证据，并明确 避免虚假精确，因为分配到的材料未披露收入、利润率或确切轮次条款。
    claimRefs:
      - CV006
      - CV011
      - CV012
      - CV014
      - CV015
      - CV016
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 当前证据显示，一个隐身状态的机器人项目通过二手数据库及 2025-2026 年融资 / 发布信号变得公开可见，但商业化证明仍缺失。
    data:
      items:
        - date: '2022'
          label: Tracxn 创立年份记录
          detail: Tracxn 列出 Genki 成立于 2022 年，总部位于东京。
          claimRefs:
            - CO002
            - CO003
        - date: '2025'
          label: 首次报道的融资轮次
          detail: Tracxn 称首次融资发生在 2025 年，与后续两轮融资摘要一致。
          claimRefs:
            - CO009
        - date: '2025-11-13'
          label: 东京项目在 2025 年末报道中浮现
          detail: 与 Dealroom 关联的新闻报道描述 Andy Rubin 在东京创办一家聚焦 AI 与 实体机器的机器人项目。
          claimRefs:
            - CO007
        - date: Late 2025
          label: 团队组建和原型工作仍在进行
          detail: Dealroom 称，2025 年末的报道显示公司正在积极招聘并开发初始原型。
          claimRefs:
            - CO013
        - date: '2026-04-21'
          label: 最近报道的轮次为 Series A
          detail: Tracxn 将最近一次融资事件定于 2026 年 4 月 21 日，并仍将 Genki 归类为 Series A。
          claimRefs:
            - CO009
        - date: '2026-04-30'
          label: 二手数据库显示融资额为 $50M
          detail: Tracxn 发布的公司简介称两轮融资共筹得 $50M。
          claimRefs:
            - CO009
        - date: '2026'
          label: 当前估值和规模仍以区间呈现
          detail: Dealroom 显示估值区间为 $1-2.5B、团队规模低于 100 人，而非确切的当前运营 指标。
          claimRefs:
            - CO011
            - CO012
        - date: '2026'
          label: 首款产品发布已有信号但尚未证实
          detail: 低信誉的 2026 年新闻转载称 CEO 预计今年推出首款产品，但产品细节和 客户证明仍未披露。
          claimRefs:
            - CO014
            - CO015
    approximationNotes: 由于留存来源只披露了部分日期，若干项目只能精确到年份或时期；该顺序 应视为公开证据编年，而非完整公司历史。
    claimRefs:
