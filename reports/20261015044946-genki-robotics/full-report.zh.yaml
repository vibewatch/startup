              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: 仍决定采用与估值判断的因素
        blocks:
          - type: paragraph
            body: >-
              关键门槛不是机器人是否属于大型宏观品类，而是 Genki
              能否把有吸引力的创始人—市场叙事，落到由明确预算承担、且有公开证明点的工作流上。公开来源尚未明确首款产品的买方、指出由哪项预算支付，也没有披露任何从引荐走向部署的具体市政机构、企业或渠道合作伙伴。在这些证据出现前，与估值相关的采用情况应更多依据客户采购数据、试点转化、定价和服务经济性判断，而不能只看自上而下的机器人市场增长。
            claimRefs:
              - CM006
              - CM007
              - CM012
              - CM013
      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 自上而下的机器人增长还不是 Genki 的 SAM
            body: 保留的定量证据更多说明广泛的机器人需求，而不是已经验证的 Genki 采购中心。没有已命名客户、公开定价或首款产品工作流，自上而下的市场增长仍只是松散类比，不能作为可靠的投资判断基础。
            calloutType: risk
