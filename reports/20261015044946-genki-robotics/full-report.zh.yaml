  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 替代方案格局
        blocks:
          - type: paragraph
            body: >
              保留来源将 Genki 定位为面向公共安全、城市环境和其他关键任务工作流的人形机器人项目，而不是某条已披露的单一产品线。这一点很重要，因为买方的替代方案并不局限于一组人形机器人初创同行。Startuply
              的概览将 Genki 放入一个包含 Boston Dynamics 等既有厂商、Figure AI 和 1X Technologies 等风险投资规模人形机器人项目以及相邻专业公司的市场；由于 Genki
              尚未公开标准商业方案，同一证据基础也为现有人工和买方自建集成留下空间。实际上，公司首先在争夺注意力和问题定义，之后才会在可量化的产品证明上竞争。
