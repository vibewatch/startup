            title: 投资判断阻碍
            body: 公开记录仍无法量化烧钱速度、现金跑道、毛利率或客户转化，因此资本充足性仍是需要向管理层核实的尽调事项，而不是有来源支持的投资结论。
            calloutType: risk
            claimRefs:
              - CI005
