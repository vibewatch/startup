      - number: '3.2'
        title: 比较与商业取舍
        blocks:
          - type: paragraph
            body: >
              公开差异化仍主要靠叙事，而不是功能。Dealroom News 称 Rubin 希望 Genki 打造覆盖硬件、传感器、软件和系统的全栈；MVP
              则称其帮助招募人才、引荐客户、对接战略伙伴。这些信号有用，但不能替代已披露的吞吐量、安全性、正常运行时间、单位经济性或单任务价格数据。2026
              年发布摘要明确表示功能、目标行业和价格仍未披露，因此买方还无法按常规采购标准将 Genki 与既有厂商或人形机器人同行比较。当前竞争格局由目标用例和渠道触达定义，而非经验证的商业同等性。
