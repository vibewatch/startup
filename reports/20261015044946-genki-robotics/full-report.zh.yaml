      - number: '1.3'
        title: 里程碑、发布信号与未解决的证明点
        blocks:
          - type: paragraph
            body: >-
              保留时间线显示，Genki 在 2025—2026 年间从安静的机器人研发转向更公开的融资和发布信号，但尚未出现公开可验证的商业牵引。Dealroom 在 2025
              年末仍将团队组建和原型开发描述为进行中。2026 年低信誉新闻转载随后加入了一个归因于 CEO 的信号：首款产品应在今年推出；但规格、价格、目标垂直行业和客户验证仍未披露。Tracxn 的竞争者数量也说明
              Genki 正进入拥挤的人形机器人赛道。因此，核心尽调问题不是这个品类是否令人兴奋，而是 Genki 能否把创始人履历和融资转化为产品证明、试点客户和持久的运营杠杆。
