    notes: >-
      This is a synthesized operating model from retained public descriptions; it is not a company-published
      architecture diagram or validated bill of materials.
    claimRefs: [CE005, CE006, CE010, CE011, CE012, CE014]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Public evidence supports a six-layer full-stack ambition, but the disclosed detail thins materially below the workflow narrative.
    data:
      layers:
        - label: Mission workflows
          detail: Public sources consistently anchor the product in public safety, urban maintenance, and other mission-critical environments.
          outputs:
            - Public safety
            - Urban maintenance
            - Mission-critical applications
        - label: Form factor
          detail: Third-party descriptions point to humanoid and bipedal robots designed for real-world environments built for people.
          modules:
            - Humanoid robots
            - Bipedal robots
        - label: Integrated stack
          detail: Dealroom News describes a build from hardware and sensors to software and systems.
          modules:
            - Hardware
            - Sensors
            - Software
            - Systems
        - label: Product maturity
          detail: Public maturity markers are prototypes and a first commercial product target, not disclosed production deployments.
          outputs:
            - Initial prototypes
            - First-product target
        - label: Enablement surface
          detail: External enablement evidence is thin and currently limited to a minimal public GitHub surface plus investor-assisted introductions.
          modules:
            - Public README
            - Hiring support
            - Customer introductions
            - Strategic partner introductions
        - label: Control gaps
          detail: No retained source documents certifications, uptime metrics, formal security/privacy controls, or deployment benchmarks.
          outputs:
            - No public certifications
            - No public reliability metrics
            - No public security/privacy detail
    approximationNotes: >-
      This stack is an analytic synthesis of retained public descriptions rather than a company-published
      architecture artifact.
    claimRefs: [CE002, CE006, CE010, CE011, CE012, CE013, CE014]
