  evidenceGaps:
    - type: missing-source
      severity: material
      topic: architecture-disclosure
      missingEvidence: Public technical specification covering locomotion, manipulation, sensor suite, compute stack, payload, runtime, and integration interfaces.
      whyItMatters: Without a concrete specification, diligence cannot separate a credible humanoid platform from broad full-stack marketing language.
      diligencePath: Request a product spec sheet, engineering walkthrough, demo video, and any architecture or integration documentation shown to customers or investors.
      relatedQuestionRefs: [QE002, QE003]
    - type: private-evidence-only
      severity: material
      topic: deployment-proof
      missingEvidence: Named pilot or customer deployment evidence, target vertical, pricing model, and milestone data for the first commercial product.
      whyItMatters: Product-market fit and readiness cannot be underwritten from a launch target alone; commercialization risk remains largely unbounded.
      diligencePath: Request launch plan materials, pipeline detail, pilot agreements, and the first customer or field-test references.
      relatedQuestionRefs: [QE004, QE007]
    - type: missing-source
      severity: material
      topic: trust-safety-controls
      missingEvidence: Safety case, certifications, privacy or security program, incident process, and any regulatory approvals relevant to public-safety or urban deployments.
      whyItMatters: Mission-critical robotics deployments require proof that the control environment is as mature as the product ambition.
      diligencePath: Request compliance documentation, safety test results, certifications, security policies, and any regulator or standards-body correspondence.
      relatedQuestionRefs: [QE008]
