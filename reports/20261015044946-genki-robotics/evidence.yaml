evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-disclosure
    missingEvidence: >-
      Public disclosure of the current executive bench, board composition, committee structure, and formal governance
      controls beyond Andy Rubin.
    whyItMatters: >-
      Leadership concentration and missing governance detail make it hard to judge execution resilience, succession
      risk, and investor control protections.
    diligencePath: >-
      Request an org chart, board list, governance deck, and current role descriptions from management or the lead
      investor.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Round-by-round investor roster, lead investor identity, ownership percentages, board rights, and preference stack
      terms.
    whyItMatters: >-
      The current public evidence identifies only fragments of the cap table, which limits underwriting of control,
      signaling quality, and follow-on financing risk.
    diligencePath: >-
      Obtain the cap table, financing docs, and investor rights summary from management counsel or the current lead
      investor.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: scale-metrics
    missingEvidence: Exact headcount, revenue or ARR, named customers or pilots, pricing model, and number of operating locations.
    whyItMatters: >-
      These are core cover metrics for judging commercialization timing, burn efficiency, and whether the valuation is
      grounded in operating traction.
    diligencePath: >-
      Request monthly KPI reporting, customer pipeline detail, pricing sheets, and geography-by-function headcount from
      management.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: launch-details
    missingEvidence: >-
      Primary confirmation of the first product's exact launch date, product category, technical specifications, pilot
      customers, and regulatory path.
    whyItMatters: >-
      Public launch signaling without specifics does not establish product-market fit, procurement readiness, or
      manufacturability.
    diligencePath: >-
      Ask for the product roadmap, demo materials, pilot pipeline, and any launch or compliance documentation tied to
      the 2026 release target.
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: material
    topic: customer-validation
    missingEvidence: Named pilots customers LOIs or procurement-stage disclosures tied to a specific Genki workflow.
    whyItMatters: Without customer proof the buyer map and adoption timing remain inferred rather than verified.
    diligencePath: Ask management for pilot documents customer references or procurement pipeline detail by target segment.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: Primary or high-quality independent budget data for humanoid public-safety and urban-maintenance deployments.
    whyItMatters: >-
      The current quantitative lens is a broad industrial-robotics analog, not a defensible SAM or SOM for Genki's
      wedge.
    diligencePath: Pull municipal procurement budgets workload data and competitor deployment counts for the named end markets.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Named price cards, procurement documents, or contract structures for Genki and its closest public humanoid
      alternatives.
    whyItMatters: >-
      Without public pricing and package detail, the chapter can map commercial unknowns but cannot test whether Genki
      is cheaper, richer, or harder to buy than substitutes.
    diligencePath: >-
      Request current sales materials, pilot SOWs, and customer procurement artifacts from management and compare them
      with peer quotations.
    relatedQuestionRefs:
      - QP003
      - QP006
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: customer-proof
    missingEvidence: >-
      Named pilots, deployment references, safety metrics, or proof of repeat usage in public-safety or
      urban-maintenance workflows.
    whyItMatters: >-
      The competitive map cannot move from narrative to validated product-market fit until an actual buyer reference or
      deployment outcome is public.
    diligencePath: >-
      Obtain at least two customer references, pilot KPIs, and a deployment timeline that can be compared with
      substitute workflows.
    relatedQuestionRefs:
      - QP004
      - QP007
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: material
    topic: competitor-benchmark
    missingEvidence: Direct sources for the named peer set covering funding scale, product scope, pricing, and target verticals.
    whyItMatters: >-
      Current evidence identifies the classes of competitors but leaves too many row-level fields unknown to underwrite
      a procurement-grade head-to-head view.
    diligencePath: >-
      Pull direct company pages, pricing docs, and credible third-party benchmarks for Boston Dynamics, Figure AI, 1X,
      and adjacent specialists.
    relatedQuestionRefs:
      - QP002
      - QP005
    relatedTableRefs:
      - TP001
      - TP002
  - type: conflicting-data
    severity: minor
    topic: founding-chronology
    missingEvidence: A primary company or regulatory record that reconciles whether the company was founded in 2022 or 2025.
    whyItMatters: >-
      Company age is not the investment case by itself, but it affects how investors interpret maturity, pace of
      iteration, and competitive timing.
    diligencePath: Confirm incorporation and brand-change dates from management, legal-entity filings, or a primary company profile.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, runway, debt facilities, and planned use of proceeds.
    whyItMatters: Without these figures, investors cannot test financing dependency or timing to the next round.
    diligencePath: Request board deck, monthly cash bridge, debt schedule, and management runway case.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue-model
    missingEvidence: Customer contract examples, realized pricing, discounting policy, and revenue-recognition treatment.
    whyItMatters: Revenue quality cannot be separated into hardware, software, services, and support without contract evidence.
    diligencePath: Request executed MSA or order form, pricing schedule, and controller memo on revenue recognition.
    relatedQuestionRefs:
      - QI001
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: BOM, gross margin targets, deployment labor model, warranty assumptions, and CAC or payback data.
    whyItMatters: Margin path and scaling efficiency are core to underwriting a hardware-plus-software robotics company.
    diligencePath: Request product cost model, field-service staffing plan, and sales funnel metrics by cohort.
    relatedQuestionRefs:
      - QI003
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: financing-precision
    missingEvidence: Named Series A lead, exact round size, co-investors, and security terms.
    whyItMatters: >-
      The capital stack influences dilution, governance, and the amount of capital actually available for
      commercialization.
    diligencePath: Request signed financing documents, cap table, and investor rights summary.
    relatedQuestionRefs:
      - QI006
      - QI007
  - type: missing-source
    severity: material
    topic: architecture-disclosure
    missingEvidence: >-
      Public technical specification covering locomotion, manipulation, sensor suite, compute stack, payload, runtime,
      and integration interfaces.
    whyItMatters: >-
      Without a concrete specification, diligence cannot separate a credible humanoid platform from broad full-stack
      marketing language.
    diligencePath: >-
      Request a product spec sheet, engineering walkthrough, demo video, and any architecture or integration
      documentation shown to customers or investors.
    relatedQuestionRefs:
      - QE002
      - QE003
  - type: private-evidence-only
    severity: material
    topic: deployment-proof
    missingEvidence: >-
      Named pilot or customer deployment evidence, target vertical, pricing model, and milestone data for the first
      commercial product.
    whyItMatters: >-
      Product-market fit and readiness cannot be underwritten from a launch target alone; commercialization risk remains
      largely unbounded.
    diligencePath: Request launch plan materials, pipeline detail, pilot agreements, and the first customer or field-test references.
    relatedQuestionRefs:
      - QE004
      - QE007
  - type: missing-source
    severity: material
    topic: trust-safety-controls
    missingEvidence: >-
      Safety case, certifications, privacy or security program, incident process, and any regulatory approvals relevant
      to public-safety or urban deployments.
    whyItMatters: >-
      Mission-critical robotics deployments require proof that the control environment is as mature as the product
      ambition.
    diligencePath: >-
      Request compliance documentation, safety test results, certifications, security policies, and any regulator or
      standards-body correspondence.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: named customer proof table coverage
    missingEvidence: Named customers, pilot counterparties, LOIs, or procurement documents tied to the first live deployments.
    whyItMatters: >-
      Without named references, the customer chapter cannot verify whether Genki has crossed from introductions into
      real adoption.
    diligencePath: >-
      Ask management for customer names, pilot scopes, contract status, and permission to speak with at least one
      reference account.
    relatedQuestionRefs:
      - QU003
      - QU004
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: retention and durability metrics
    missingEvidence: Customer count, renewals, churn, NRR, GRR, contract terms, and satisfaction evidence.
    whyItMatters: Expansion and concentration judgments remain speculative until recurring-customer behavior is visible.
    diligencePath: >-
      Request cohort data, renewal schedules, customer concentration by revenue, and any customer NPS or uptime-backed
      satisfaction evidence.
    relatedQuestionRefs:
      - QU005
      - QU006
      - QU007
    relatedTableRefs:
      - TU002
  - type: missing-source
    severity: material
    topic: product offer and deployment denominator
    missingEvidence: SKU-level product description, pricing, shipped-unit counts, and active deployment totals by segment.
