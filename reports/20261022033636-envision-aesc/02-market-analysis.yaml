  - calloutType: insight
    title: Scale is visible; monetization is not
    body: Announced plants, customer programs, and geographic reach show an opportunity large enough to support substantial investment. They do not yet establish AESC's serviceable share, realized price, utilization, margin, or valuation.
    claimRefs: [CM004, CM005, CM007, CM016]
  - calloutType: risk
    title: Capacity claims need commissioning proof
    body: Planned and historical GWh figures are not interchangeable with operating output. A diligence-grade market view should reconcile each site to ownership, commissioning, contracted volume, and utilization.
    claimRefs: [CM005, CM006, CM007]
