      - [Other value-chain services, "Recycling, digital energy management and related capabilities", "Service or embedded economics not disclosed", "Announcements describe recycling and AIoT energy-management inputs", "Strategic description; no standalone monetization evidence", "Confirm whether services are separately priced, bundled, or internal cost offsets"]
    notes: "Sources disclose product categories and planned capacity, but not recognized revenue, realized pricing, contract accounting, or stream mix; null-like unavailable fields are deliberately represented as status text rather than zero."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Item, List vs realized pricing, Contract or unit basis, Evidence status, Underwriting implication, Required diligence]
    rows:
      - [EV cell price, "Not disclosed", "$/kWh or contract formula not disclosed", "No public list price in assigned sources", "Revenue cannot be derived from GWh capacity", "Obtain customer price waterfall, commodity pass-through and escalation clauses"]
      - [Energy-storage cell price, "Not disclosed", "Cell size and shipment volume described; price absent", "Product specifications do not establish realized price", "Mix and margin are unobservable", "Obtain quotes, realized ASP by chemistry/format and channel discounting"]
      - [BMW program economics, "Not disclosed", "Multi-year supply relationship; terms absent", "Customer relationship is corroborated by BMW and AESC announcements", "Demand proof does not equal profitability", "Review award letter, minimum volumes, penalties and warranty allocation"]
      - [Public incentives, "Not customer pricing", "$135 million grant and up to $70 million bonds described for South Carolina project", "Government support is project financing/infrastructure support, not operating revenue", "Do not add incentives to revenue or cash available", "Confirm recipient, draw conditions, clawbacks and company co-investment"]
    notes: "No assigned source publishes an Envision AESC price list or realized contract price. Public project support is kept separate from sales and liquidity."
    claimRefs: [CI002, CI003, CI011, CI012]
  - id: TI003
    title: Unit economics and underwriting inputs
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue, null, low, "No consolidated public revenue figure was found in the assigned evidence", "Obtain audited consolidated statements and segment revenue"]
      - [Gross margin, null, low, "Capacity and quality claims do not disclose material, energy, labor or warranty costs", "Obtain gross-margin bridge by plant, chemistry and customer"]
      - [Cash balance and burn, null, low, "Announced investment is not cash on hand and no burn disclosure is retained", "Obtain latest cash, restricted cash, operating cash flow and monthly burn"]
      - [Debt and runway, null, low, "Ownership and project plans do not establish debt, covenants or financing headroom", "Obtain debt schedule, covenants, lease obligations and financing plan"]
      - [CAC, null, low, "OEM supply relationships do not expose commercial acquisition cost or cycle length", "Obtain bid-to-SOP funnel, engineering cost, tooling recovery and payback"]
      - [Utilization and yield, null, low, "Sources describe planned capacity and manufacturing controls but not sustained plant output/yield", "Obtain monthly capacity, utilization, scrap, yield and downtime by site"]
    notes: "Unavailable unit-economics values are null by design. They are not estimates and should not be treated as zero; each row carries a specific request for private diligence."
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI010, CI014]
