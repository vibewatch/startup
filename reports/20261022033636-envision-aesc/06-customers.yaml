company:
  name: Envision AESC
chapter:
  number: 6
  title: Customers
  summary: Envision AESC has credible automotive customer relationships and a growing energy-storage footprint, but the public record is stronger on supply agreements, planned capacity, and named programs than on recurring revenue, retention, or customer concentration. The clearest commercial proof is the long-running Nissan relationship and the BMW-linked South Carolina program; current utilization and economics remain undisclosed.
sections:
  - id: customer-segments-and-buyer-roles
    title: Customer segments and buyer roles
    body: >-
      Envision AESC serves automotive OEMs that buy cells for vehicle programs and energy-storage customers that buy cells or systems for stationary applications. The public evidence identifies Nissan and its alliance partners Renault and Mitsubishi as existing supply relationships, while Reuters also reported discussions with automakers in Japan, Europe, the United States, and China for new supply deals. The South Carolina project gives the buyer/use-case relationship more specificity: the planned Florence facility is tied to BMW Group's Plant Spartanburg and next-generation electric vehicles. This supports a segment view centered on OEM procurement, qualification, and program-level supply rather than a broad consumer customer base. Public materials also describe power-battery products used in more than 1 million electric vehicles, but that is a cumulative deployment claim, not a current active-account or revenue measure. Claims about the full energy-storage customer roster are less independently documented than the automotive relationships.
    claimRefs: [CU001, CU002, CU003, CU004, CU005]
    tableRefs: [TU001]
  - id: adoption-and-named-proof
    title: Adoption trajectory and named customer proof
    body: >-
      Customer proof is strongest where a counterparty, plant, use case, and deployment purpose are named. Xinhua reported that more than 430,000 electric vehicles had installed AESC batteries by April 2019, with no critical malfunction instances reported by the company at that time; later promotional and company-linked materials cite more than 800,000 or 1 million vehicles, but the figures differ by date and source. Reuters confirms that AESC supplied Nissan's Leaf and described planned supply for Honda and Mercedes-Benz, while BMW's own announcement ties future AESC cell production to BMW's next-generation vehicles at Plant Spartanburg. These sources show customer access and program relevance, but not shipment cadence, paid production status, or customer-level economics. The trajectory therefore indicates expanding program reach and manufacturing commitments, with a material gap around how much announced capacity has converted into live, revenue-generating deployments.
    claimRefs: [CU006, CU007, CU008, CU009, CU010]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-expansion-and-concentration
    title: Durability, expansion, and concentration
    body: >-
      Public evidence does not disclose net revenue retention, gross retention, churn, renewal rates, contract length, cohort behavior, or customer-level revenue concentration. The available commercial signals are instead long-term OEM relationships, planned supply expansions, and geographic manufacturing commitments. AESC's 2022 investor-seeking statement said it was speaking with automakers across several regions and could not rely solely on its parent for financing; that financing context raises an execution and concentration question because large customer programs require substantial plant investment before utilization is visible. Nissan remains a historically important anchor, while BMW is a named future-program counterparty and Renault is described as a strategic partner in the assigned material. The diligence conclusion is that customer durability is plausible but not measurable from the public file: investors need contract, shipment, utilization, and concentration schedules before treating announced capacity as durable demand.
    claimRefs: [CU011, CU012, CU013, CU014, CU015, CU016]

