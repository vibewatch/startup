companyProfile:
  summary: >-
    Envision AESC is a Japan-headquartered battery manufacturer with roots in a Nissan-linked venture and current
    control by Envision Group. Its public record shows automotive and stationary-storage products, named OEM
    relationships, and a multi-region manufacturing expansion, while consolidated financial performance, current
    ownership economics, and valuation remain insufficiently disclosed.
  foundingLocation: Yokohama, Japan
  headquarters: Sagamihara, Kanagawa, Japan
  productSummary: EV battery cells and energy-storage battery systems using multiple chemistries and form factors.
  customerFocus: Automotive OEMs and stationary energy-storage customers.
  businessModel: Manufactures and supplies battery cells and related energy-storage products to OEM and energy customers.
  stage: Late-stage private battery manufacturer.
  fundingStatus: Public sources disclose major plant investments and parent-level financing, but not a complete AESC capital history.
  disclosureProfile: private-undisclosed
