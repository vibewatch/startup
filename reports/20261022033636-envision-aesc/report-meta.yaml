  topStrengths:
    - Named OEM relationships and customer-linked plant programs provide substantive commercial proof.
    - Multi-region manufacturing and multiple cell chemistries support strategic relevance.
    - Public project disclosures provide visible capacity and execution milestones to monitor.
  topRisks:
    - Audited consolidated financials, utilization, margins, leverage, and warranty economics are not public.
    - Ownership, foreign-subsidy, and FEOC treatment may affect incentives, customers, and expansion economics.
    - Nissan concentration and large announced capacity create execution and ramp risk.
  unresolvedGaps:
    - Audited consolidated financial statements and plant-level unit economics are not public.
    - Current ownership, preference structure, debt covenants, and Nissan residual-stake economics remain unclear.
    - Public evidence does not establish fair value at any rumored 2026 IPO or private-market mark.
