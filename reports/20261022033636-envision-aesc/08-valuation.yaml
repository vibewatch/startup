    notes: "The customer-concentration item is a dated third-party report and should be verified against current shipment and contract data; it is not treated as a current consolidated KPI."
    claimRefs: [CV001, CV002, CV006, CV007, CV017]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation or return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "BMW-linked capacity ramps; planned plants convert to shipments; financing terms are transparent", "Potentially supports a growth-manufacturer multiple, but no numerical range is supportable", "Low-to-medium until utilization and margins are disclosed", "Program delay, weak utilization, or unfavorable dilution"]
      - [Base, "Capacity expands while cash generation, leverage, and margins remain unverified", "Wait for audited data and price discovery; preserve optionality", "Highest based on current evidence", "No filed terms, opaque cap table, or insufficient cash runway"]
      - [Bear, "Capital intensity outpaces cash generation; customer concentration or delayed plants weakens utilization", "Downside is material because no verified valuation anchor exists", "Material tail risk", "IPO slips, down-round, customer reduction, safety issue, or covenant stress"]
    notes: "Scenarios are qualitative because the assigned sources do not provide audited revenue, EBITDA, free cash flow, net debt, share count, or a transaction price."
    claimRefs: [CV003, CV006, CV007, CV011, CV015, CV016]
