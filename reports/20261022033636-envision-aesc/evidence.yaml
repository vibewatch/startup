    relatedQuestionRefs:
      - QR001
      - QR002
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: net-new-evidence
    missingEvidence: A second usable, independent, net-new source on current risks; the assigned second net-new URL was account-gated.
    whyItMatters: >-
      The chapter gate requires two net-new sources, but one assigned net-new candidate cannot be checked as source
