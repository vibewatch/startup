    diligencePath: Provide or allocate another successful prefetched net-new source in a distinct domain for the risks chapter.
  - type: missing-source
    severity: blocking
    topic: valuation
    missingEvidence: >-
      A filed IPO prospectus or current financing term sheet with offer price, equity value, share count, dilution, and
