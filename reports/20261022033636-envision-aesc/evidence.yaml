    severity: material
    topic: customer-concentration
    missingEvidence: Current customer mix, backlog, renewal terms, and utilization by plant.
    whyItMatters: The 90% Nissan figure is historical and could materially overstate present concentration or diversification.
    diligencePath: Verify current shipment and contract data with management and major-customer disclosures.
