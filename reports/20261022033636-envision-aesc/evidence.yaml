evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: financial-disclosure
    missingEvidence: >-
      Audited consolidated financial statements with revenue, gross margin, operating cash flow, debt, and plant-level
      economics.
    whyItMatters: >-
      Capacity and funding announcements cannot support valuation or solvency underwriting without entity-level
      financial statements.
    diligencePath: >-
      Obtain audited accounts, management accounts, debt schedules, and utilization/cost data under NDA or from IPO
      filings.
    relatedQuestionRefs:
      - QO005
      - QO009
  - type: missing-source
    severity: material
    topic: ownership
    missingEvidence: Current cap table, shareholder agreement, preference terms, Nissan residual stake, and related-party arrangements.
    whyItMatters: The 2019 ownership snapshot may not represent current control or economic priority.
    diligencePath: Request the current capitalization table, constitutional documents, and investor rights schedule.
    relatedQuestionRefs:
      - QO002
      - QO005
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: Complete current board, executive roster, independent-director status, and executive-change history.
    whyItMatters: The named-person roster is insufficient to assess governance quality and key-person concentration.
    diligencePath: Obtain current corporate registry extracts, board minutes, governance policies, and HR turnover data.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: customer-scale
    missingEvidence: A reconciled definition and period for vehicle counts, customers, plants, and capacity.
    whyItMatters: The evidence contains different dates and scopes, so headline scale figures could otherwise be overstated.
    diligencePath: Request a customer-by-customer installed-base schedule and plant commissioning/utilization report.
    relatedQuestionRefs:
      - QO006
      - QO009
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: Independent annual EV-cell and stationary-storage demand by geography, chemistry, and application.
    whyItMatters: Without comparable external demand data, announced plant capacity cannot be translated into share or market power.
    diligencePath: Obtain current analyst, government, or trade-association datasets with definitions and methodology.
    relatedQuestionRefs:
      - QM002
      - QM003
      - QM004
  - type: missing-source
    severity: material
    topic: economics
    missingEvidence: AESC's realized ASP, contracted GWh, utilization, gross margin, warranty cost, and capex by plant.
    whyItMatters: Market growth can coexist with value destruction in a capital-intensive manufacturing cycle.
    diligencePath: Request audited segment KPIs and customer-program economics under NDA.
    relatedQuestionRefs:
      - QM005
      - QM008
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Obtain executed or disclosed AESC and peer cell prices, including chemistry, geography, volume, indexation, and
      realized-versus-list distinctions.
    whyItMatters: >-
      Without comparable prices, the chapter cannot test whether AESC's local manufacturing and qualification advantages
      translate into buyer value or margin durability.
    diligencePath: Request customer contract extracts, pricing schedules, and peer procurement benchmarks under confidentiality.
    relatedQuestionRefs:
      - QP005
      - QP010
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: benchmarking
    missingEvidence: >-
      Obtain independent measurements of peer capacity utilization, yield, warranty incidents, defect rates, and
      customer program wins.
    whyItMatters: >-
      Planned GWh and partner performance claims do not establish a durable advantage against incumbent or regional
      suppliers.
    diligencePath: >-
      Commission technical and commercial reference checks with OEM customers and independent battery supply-chain
      specialists.
    relatedQuestionRefs:
      - QP003
      - QP008
    relatedTableRefs:
      - TP002
      - TP003
  - type: missing-source
    severity: minor
    topic: switching-cost
    missingEvidence: >-
      Obtain contract terms, qualification timelines, tooling ownership, and termination or requalification obligations
      for material OEM programs.
    whyItMatters: >-
      Switching costs are central to moat durability, but public relationship announcements do not show how much lock-in
      exists.
    diligencePath: Review OEM supply agreements, quality agreements, and plant-specific tooling and warranty documentation.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure
    missingEvidence: >-
      Audited consolidated income statements, cash-flow statements, balance sheets and segment revenue for the latest
      fiscal period.
    whyItMatters: >-
      Without recognized revenue, margin and cash-flow data, capacity announcements cannot be translated into valuation
      or solvency.
    diligencePath: Request audited statements, management accounts and a reconciliation of EV and energy-storage revenue.
    relatedQuestionRefs:
      - QI003
      - QI005
  - type: private-evidence-only
    severity: material
    topic: liquidity
    missingEvidence: >-
      Current cash, restricted cash, debt, leases, covenants, capex commitments and parent or shareholder funding
      arrangements.
    whyItMatters: >-
      The announced plant program is capital intensive, but public incentives do not establish the company's liquidity
      or financing headroom.
    diligencePath: Obtain a latest-quarter liquidity bridge, debt schedule, committed capex and next-round trigger analysis.
    relatedQuestionRefs:
      - QI006
  - type: conflicting-data
    severity: material
    topic: ownership
    missingEvidence: Current legal-entity ownership and economic rights after the 2019 Envision/Nissan structure.
    whyItMatters: Historical ownership evidence may not describe current voting, preference, residual-value or financing rights.
    diligencePath: Request the current cap table, shareholder agreements and any Nissan residual-stake documentation.
    relatedQuestionRefs:
      - QI007
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Plant-level realized ASP, material-cost pass-through, yield, scrap, warranty, utilization and customer
      concentration.
    whyItMatters: Battery manufacturing returns can vary materially with commodity inputs, ramp losses and customer-specific terms.
    diligencePath: Request a plant-by-plant unit-economics pack and customer contract waterfall.
    relatedQuestionRefs:
      - QI004
      - QI005
  - type: private-evidence-only
    severity: material
    topic: reliability-and-warranty
    missingEvidence: >-
      Current fleet incident rates, warranty returns, degradation curves, and independent validation for the newest
      790Ah and cylindrical-cell products.
    whyItMatters: >-
      Historical zero-critical-malfunction reporting and company or partner specifications do not establish present
      reliability, field life, or warranty economics across current platforms.
    diligencePath: >-
      Request product qualification packs, failure-mode analyses, warranty cohorts, field-return rates, and third-party
      test reports by cell family.
    relatedQuestionRefs:
      - QE002
      - QE007
  - type: missing-source
    severity: material
    topic: cybersecurity-and-developer-signal
    missingEvidence: >-
      Public software architecture, API documentation, security controls, vulnerability-disclosure process, or credible
      developer-community telemetry.
    whyItMatters: >-
      IoT and digitalization language does not demonstrate software maturity or security readiness in a battery
      manufacturing and storage workflow.
    diligencePath: >-
      Obtain the security questionnaire, product data-flow diagrams, incident-response policy, penetration-test
      summaries, and any customer integration documentation.
    relatedQuestionRefs:
      - QE007
      - QE008
  - type: conflicting-data
    severity: material
    topic: announced-capacity
    missingEvidence: >-
      Plant-by-plant commissioning dates, nameplate versus utilized capacity, yield, and customer qualification status
      for announced expansions.
    whyItMatters: >-
      Reported 15 GWh, 30 GWh, 40 GWh, and broader global-capacity figures mix plans, facilities, and different
      reporting dates.
    diligencePath: >-
      Reconcile the fixed-asset register and production dashboard to customer SOPs, line acceptance certificates, and
      monthly utilization data.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: retention
    missingEvidence: Customer-level contract schedules, renewal rates, churn, GRR/NRR, cohort behavior, and repeat-order data.
    whyItMatters: Named OEM relationships and cumulative vehicle counts do not show whether revenue is durable or concentrated.
    diligencePath: >-
      Request the current top-customer schedule, contract terms, renewal history, shipment volumes, and cohort-level
      retention from management.
    relatedQuestionRefs:
      - QU004
      - QU008
  - type: enumeration-incomplete
    severity: material
    topic: named-customers
    missingEvidence: A complete current customer and deployment register separated into production, pilot, and prospective programs.
    whyItMatters: The assigned public sources name several OEMs but do not establish a complete customer census or current status.
    diligencePath: >-
      Obtain a dated customer pipeline and production-deployment list with geography, program SOP, current status, and
      annualized volume.
    relatedQuestionRefs:
      - QU001
      - QU002
      - QU007
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: utilization
    missingEvidence: Plant commissioning, ramp, utilization, shipment, and order-conversion data for announced capacity.
    whyItMatters: Planned GWh capacity can materially overstate realized adoption and customer economics.
    diligencePath: >-
      Reconcile each announced plant to commissioning milestones, paid customer orders, shipped GWh, and current
      utilization.
    relatedQuestionRefs:
      - QU003
      - QU006
      - QU007
      - QU009
    relatedTableRefs:
      - TU002
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: >-
      Evidence on customer complaints, failed pilots, blocked deployments, cancellations, and top-customer
      concentration.
    whyItMatters: Large OEM programs create qualification and dependency risk that is not visible from positive announcements alone.
    diligencePath: >-
      Request customer-loss and quality-incident logs, concentration by revenue and GWh, and independent procurement or
      warranty evidence.
    relatedQuestionRefs:
      - QU008
  - type: private-evidence-only
    severity: material
    topic: financial-resilience
    missingEvidence: >-
      Audited consolidated accounts, plant-level utilization and yield, warranty reserves, debt terms, and
      working-capital data.
    whyItMatters: >-
      Without these data, announced capacity and customer relationships cannot be translated into downside cash
      resilience or loss severity.
    diligencePath: >-
      Request audited statements, management accounts, plant KPIs, customer contract economics, debt schedules, and
      warranty reports under NDA.
    relatedQuestionRefs:
      - QR006
      - QR009
  - type: missing-source
    severity: material
    topic: regulatory
    missingEvidence: >-
      A current legal determination of FEOC, IRA, foreign-subsidy, and cross-border technology-transfer treatment for
      each relevant entity.
    whyItMatters: >-
      A policy restriction could impair customer eligibility, incentives, or the economics of U.S. and European
      expansion.
    diligencePath: >-
      Obtain current counsel opinions, entity ownership charts, subsidy conditions, and regulator correspondence for
