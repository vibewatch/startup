    relatedQuestionRefs:
      - QV001
      - QV008
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure
    missingEvidence: >-
      Audited consolidated income statement, balance sheet, cash-flow statement, net debt, and plant-level utilization
      and margins.
    whyItMatters: Capacity and customer announcements do not show cash generation, leverage, or return on invested capital.
    diligencePath: >-
      Request audited statements, debt schedules, plant economics, contracted volumes, and working-capital assumptions
