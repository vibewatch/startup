      - ["Cell design and packaging", "Pouch, prismatic, cylindrical, and 790Ah wound-cell formats translate chemistry into customer form factors", "OEM pack design and thermal integration", "Cross-platform yield and service complexity"]
      - ["Manufacturing and quality", "Plants, process equipment, BMS-related engineering, and quality systems convert designs into qualified cells", "Site commissioning, automation, testing, and certified processes", "Capacity announcements may exceed actual throughput"]
      - ["Customer integration and lifecycle", "OEM qualification, storage deployment, recycling, and carbon-footprint management connect cells to use and end of life", "Customer validation, warranty data, logistics, and recycling partners", "Public warranty, incident, cybersecurity, and end-of-life evidence is incomplete"]
    notes: Architecture is synthesized only from source-described products and operating steps; software interfaces and internal controls are not publicly documented in the assigned evidence.
    claimRefs: [CE002, CE005, CE009, CE010, CE015]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Envision AESC's public operating architecture runs from chemistry and cell design through factories, customer qualification, and vehicle or storage deployment.
    data:
      layers:
        - label: Materials and chemistry
          detail: Publicly described chemistry routes used for vehicle and energy-storage cells.
          items:
            - name: Ternary lithium
              detail: High-energy EV-oriented material route reported in the product portfolio.
            - name: LFP
              detail: Alternative material route reported for power and storage batteries.
        - label: Cell formats
          detail: Publicly described packaging formats translate chemistry into customer form factors.
          items:
            - name: Pouch
              detail: Packaging process reported in the product portfolio.
            - name: Prismatic
              detail: Includes the 790Ah wound energy-storage cell.
            - name: Cylindrical
              detail: Includes large cylindrical cells linked to automotive customers.
        - label: Manufacturing and controls
          detail: Global plants and reported quality systems convert designs into qualified cells.
          items:
            - name: Global production bases
              detail: Public sources describe bases across Asia, Europe, and North America.
            - name: Quality and process systems
              detail: IATF 16949, environmental, and occupational-health certifications are reported.
        - label: Customer deployment
          detail: Vehicle and energy-storage customers receive cells through qualification and delivery workflows.
          items:
            - name: EV OEM integration
              detail: BMW and Nissan-linked production and vehicle applications are documented.
            - name: Energy-storage delivery
              detail: Yichang 790Ah cells were reported shipped to overseas storage customers.
        - label: Lifecycle and sustainability
          detail: Public project descriptions connect renewable energy, responsible materials, carbon management, and recycling to the manufacturing model.
        - label: Scale and replication
          detail: Announced plants and capacity projects show a multi-site manufacturing expansion strategy, but not uniform operating utilization.
    approximationNotes: Capacity and performance labels reflect reported or announced values; the figure does not imply a complete internal architecture or operating utilization.
    claimRefs: [CE002, CE005, CE006, CE013]
