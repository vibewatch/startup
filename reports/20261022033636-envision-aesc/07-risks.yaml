callouts:
  - calloutType: risk
    title: Policy eligibility is the highest-consequence unknown
    body: "The public record supports project-level policy acceptance in France but does not prove durable eligibility across changing EU, U.S., and China-linked rules."
    claimRefs: [CR001, CR002, CR003]
  - calloutType: assumption
