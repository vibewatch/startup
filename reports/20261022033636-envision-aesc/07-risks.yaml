      - [Automotive demand and local production, BMW, "South Carolina cell supply", "BMW describes up to 30 GWh planned capacity", "BMW ramp or qualification delay", high, "Local-for-local sourcing and plant-specific agreement", "Plant completion and take-or-pay terms unknown"]
