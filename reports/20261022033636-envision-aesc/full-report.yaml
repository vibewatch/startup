chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, ownership, and operating model
        blocks:
          - type: paragraph
            body: >-
              Envision AESC combines a Japanese operating identity with Chinese control and a multinational
              manufacturing footprint. The business began in 2007 as a Nissan-NEC joint venture for Leaf batteries;
              Xinhua reported that Envision acquired the controlling stake in 2018 while Nissan retained approximately
              20% in the newly established Japanese holding company. The company now develops, manufactures, and sells
              power batteries for electric vehicles and energy-storage battery systems. A company profile describes
              pouch, prismatic, and cylindrical packaging as well as ternary and LFP chemistries, while BMW's customer
              announcement gives a concrete example of the commercial model: Envision AESC is contracted to supply
              next-generation cells to BMW's U.S. vehicle production. The ownership structure and customer relationships
              make this an industrial supply business rather than a software-like recurring-revenue model; public
              sources do not disclose consolidated revenue or plant-level margins.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              The available evidence identifies Zhang Lei as founder and chairman of controlling Envision Group in the
              recent IPO reporting, while the Jiangsu company profile names Zhao Weijun as executive director/legal
              representative, Zhang Lei as general manager, and Han Zhuo as supervisor. Xinhua identified Shoichi
              Matsumoto as Envision AESC Group CEO in the 2019 acquisition announcement, and company project material
              identifies Jeff Deaton as U.S. managing director. This is enough to map operating accountability across
              the parent, group, and U.S. project, but not enough to verify a full board, independent directors,
              committee structure, or recent executive turnover. Control is therefore visibly concentrated in the
              Envision Group and evidence of succession depth remains limited; an investor should obtain the current cap
              table, shareholder agreements, board roster, and executive-departure history.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
      - number: '1.3'
        title: Funding, scale, and disclosure limits
        blocks:
          - type: paragraph
            body: >-
              Public scale indicators are mainly industrial commitments and customer disclosures, not audited financial
              statements. The Next Web reported that GIC-backed Envision was considering a Hong Kong IPO that could
              raise up to $2 billion, while explicitly describing the consideration as early-stage and subject to
              change; the report also said Envision raised more than $1 billion from GIC, Sequoia Capital via Sequoia
              China, and Primavera Capital in 2021. Those figures should not be treated as AESC revenue, cash available,
              or a confirmed valuation. Other sources document a $2 billion U.S. plant plan, a $810 million Florence
              investment, and BMW-linked capacity of up to 30 GWh. A separate 2026 Renewables Now headline reported mass
              production at a 40 GWh factory, but the fetched page did not retain the article body. These are
              commitments, plans, or incompletely retrieved reports with different scopes and dates. Headcount, current
              customer count, consolidated revenue, profitability, debt, and valuation remain unsupported in the public
              file used here.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
