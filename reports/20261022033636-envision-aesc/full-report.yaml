figures:
  - id: FO001
    title: Company milestone timeline
    summary: >-
      Selected dated milestones show Envision AESC's transition from a Nissan-linked venture to a globally expanding EV
      and energy-storage battery manufacturer.
    type: timeline
    data:
      items:
        - date: '2007'
          label: Nissan-NEC venture formed
          detail: AESC was formed to supply batteries for Nissan's Leaf.
          tone: neutral
        - date: '2018'
          label: Envision acquired control
          detail: Envision Group acquired a controlling stake; Nissan retained a minority position.
          tone: neutral
        - date: '2019-04-02'
          label: Acquisition completed
          detail: >-
            Xinhua reported completion of the Nissan battery-unit acquisition and an approximately 80%/20%
            Envision-Nissan holding structure.
          tone: neutral
        - date: '2021'
          label: Capital and customer expansion
          detail: >-
            Envision was reported to have raised more than $1 billion from GIC, Sequoia Capital, and Primavera Capital;
            a separate project disclosure described a 15 GWh Wuxi phase.
          tone: neutral
        - date: '2022'
          label: Florence project announced
          detail: >-
            The Florence, South Carolina project was described as an $810 million investment with 30 GWh annual capacity
            and 1,170 jobs at full capacity.
          tone: positive
        - date: '2023'
          label: Japanese capacity plan reported
          detail: A reported Nissan-Envision AESC plan described a Japan plant scaling from 6 GWh to 18 GWh over five years.
          tone: neutral
        - date: '2026-04-17'
          label: Potential Hong Kong IPO reported
          detail: A preliminary Hong Kong IPO could raise up to $2 billion; timing and size were explicitly uncertain.
          tone: risk
        - date: '2026'
          label: 40 GWh mass-production headline
          detail: >-
            Renewables Now reported the milestone in its headline, but the assigned fetch did not retain the article
            body needed to verify facility scope or output.
          tone: risk
    approximationNotes: >-
      The timeline mixes completed events, reported plans, and company-described targets; it does not imply that
      announced capacity was commissioned or utilized.
    claimRefs:
      - CO002
      - CO009
      - CO010
      - CO011
      - CO013
