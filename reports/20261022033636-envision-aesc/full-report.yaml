            claimRefs:
              - CO002
              - CO009
              - CO010
              - CO011
              - CO012
      - number: '1.4'
        title: Milestones and remaining diligence
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a progression from Nissan-linked EV supply into a geographically diversified
              battery platform. Acquisition and ownership transition were followed by Wuxi expansion, announced U.S. and
              European capacity, a BMW supply relationship, and reported energy-storage production. The evidence is
              strongest for announced projects and disclosed relationships; it is weaker for completion, utilization,
              economics, and governance. A key adverse diligence issue is the mismatch between ambitious capacity plans
              and the absence of public audited consolidated financials. A second is geopolitical and policy exposure:
              the IPO report linked the shift from an earlier U.S. listing ambition to concerns about Chinese ownership
              and Foreign Entities of Concern rules. The practical next step is to obtain audited accounts, current
              ownership and debt documents, plant commissioning and utilization data, customer concentration, and the
              status of any IPO mandate before underwriting scale or value.
            claimRefs:
