  topStrengths:
    - "Consolidating, AI-forward post-purchase platform replacing a fragmented point-solution stack, with 4,100+ brands and ~43% (about 1,750) using more than one module"
    - "Owned international reverse logistics (ReturnBear) plus branded order tracking (Malomo) create a hard-to-replicate moat beyond pure software"
    - "Top-rated product (5.0 Shopify rating across 669 reviews, 98% five-star) with two-to-three-year customer tenures signaling strong gross retention"
    - "Proven, cohesive ex-Divvy leadership team (CEO Sterling Snow) and a well-capitalized June 2026 Series B led by Smash Capital"
  topRisks:
    - "Shopper-paid package protection is exposed to the FTC junk-fee rule, state insurance-law scrutiny, and class-action precedent against comparable vendor Route"
    - "Near-total Shopify dependence for distribution, addressable market, and fee-presentation rules, with Shopify building native returns that could commoditize the entry module"
    - "$1.25B valuation rests on undisclosed ARR, growth, and retention, creating down-round risk if SaaS multiples compress"
    - "Route raised $200M at the identical $1.25B valuation in 2021 on an overlapping shopper-fee model, then retrenched amid backlash and litigation — a direct cautionary comparable"
    - "Rapid acquisition-led expansion (Malomo, ReturnBear in six months) adds integration and physical-logistics execution risk against a small (~73 in 2024) team"
  unresolvedGaps:
    - "Audited ARR, revenue growth, gross margin, and cohort net/gross revenue retention are undisclosed"
    - "Share of revenue derived from shopper-paid protection versus diversified modules (regulatory revenue concentration)"
    - "Legal status of package protection across key jurisdictions (whether it constitutes regulated insurance)"
    - "Shopify partner-relationship terms and exposure to platform policy or native-feature changes"
    - "Security and privacy posture (SOC 2 / ISO 27001 / data-processing map) and the liquidation-preference stack"
