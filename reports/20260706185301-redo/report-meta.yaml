companyProfile:
  summary: "Redo is a Draper, Utah commerce-technology company that provides an AI-powered post-purchase platform for direct-to-consumer brands, overwhelmingly on Shopify. Installed for free, it consolidates returns and exchanges, branded order tracking (via the January 2026 Malomo acquisition), package protection, warranties, chargebacks, post-purchase email/SMS marketing, and AI sales/support into one platform, monetized on usage-based module fees and shopper-paid coverage. Redo serves 4,100+ brands (marketing cites 4,500+), with roughly 1,750 (~43%) using multiple modules, and holds a 5.0 Shopify App Store rating across 669 reviews. In June 2026 it raised an $81M Series B at a $1.25B valuation led by Smash Capital, reaching unicorn status, and acquired international-returns provider ReturnBear to add owned cross-border reverse logistics. Redo discloses no revenue, ARR, or retention figures."
  foundedDate: "2021-01-01"
  founders:
    - name: "Tay Brown"
      role: "Founder & Board Member"
      background: "Originated the Redo concept and built the initial returns-as-a-service MVP before Sterling Snow joined as CEO."
      claimRefs: [CO008]
    - name: "Sterling Snow"
      role: "Co-Founder & CEO"
      background: "Former Chief Revenue Officer of Divvy (2019-2021) before its ~$2.5B acquisition by Bill.com; joined Redo as co-founder and CEO in September 2023."
      claimRefs: [CO009, CO010]
  foundingLocation: "Draper, Utah, USA"
  headquarters: "Draper, Utah, USA"
  productSummary: "A modular post-purchase platform delivered as a free-to-install Shopify app: AI returns/exchange portal, branded order tracking (Malomo), package protection, warranties, chargebacks, order editing, inventory, email/SMS marketing, reviews, AI sales/support agents, an agentic catalog, and international reverse logistics via a ReturnBear 4PL across the US, Canada, UK, and Australia."
  customerFocus: "Direct-to-consumer, physical-goods Shopify brands (apparel, jewelry, swimwear, accessories, consumer goods), skewing small-to-mid-market and US-centric, expanding internationally."
  businessModel: "Free-to-install for merchants; monetized on usage-based fees across adopted modules and on shopper-paid package/shipping protection (a take-rate at checkout). Land-and-expand via multi-module adoption."
  stage: "Series B (Jun 2026, $1.25B valuation)"
