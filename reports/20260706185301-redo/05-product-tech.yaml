company:
  name: "Redo"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Redo is a modular, AI-forward post-purchase platform delivered as a free-to-install Shopify app spanning returns and claims, order editing, order tracking (via acquired Malomo), package protection, warranties, chargebacks, email/SMS marketing, reviews, AI sales/support agents, and an agentic catalog. Architecturally it sits on top of Shopify and other commerce platforms, integrates broadly with marketing, support, 3PL, and carrier tools, and layers AI agents (support resolution, marketing, post-purchase concierge, agentic shopping) plus a global reverse-logistics network from the ReturnBear acquisition (a returns '4PL' across the US, Canada, UK, and Australia). Its differentiation is breadth-plus-consolidation and owned international logistics; its principal technology risks are dependence on Shopify's platform and the compliance burden of shopper-fee and data handling."
sections:
  - id: "product-definition"
    title: "Product Definition in Customer Workflow Terms"
    body: |
      Redo is a post-purchase operating system that a direct-to-consumer brand installs — for free — to manage everything that happens after a shopper clicks "buy." In customer-workflow terms, Redo replaces the fragmented set of tools a brand would otherwise stitch together: a returns/exchange portal, an order-tracking experience, a package-protection widget at checkout, a warranty-claims flow, chargeback handling, and post-purchase email/SMS marketing. The company frames the value as turning post-purchase operations "from a cost center into a profit driver," with headline product metrics it advertises including a 43% lift in exchange rate, 80% AI support-resolution, and average order value up several dollars.

      For the shopper, the core workflows are: initiate a return or exchange through a branded, AI-driven portal that nudges toward exchanges/store credit over refunds; opt into package/shipping protection at checkout; track an order through branded tracking pages (powered by the acquired Malomo); file a warranty or damage claim; and, internationally, return to a local hub rather than shipping cross-border (via ReturnBear). For the merchant, the workflows are configuration and automation: setting return policies and routing rules, automating approvals and fraud checks, running post-purchase marketing, and analyzing return-reason and revenue-retention data in a single dashboard.

      The distributed product surface is deliberately broad. Redo's own site lists modules including Returns & Claims, AI Sales & Support, Conversion Optimization, Email & SMS, Order Editing, Shipping & Fulfillment, Order Tracking, Warranties, Chargebacks, Inventory Management, and an "Agentic Catalog." The Shopify App Store listing (under Redo Tech, Inc.) shows a 5.0 overall rating with 98% five-star reviews, indicating strong merchant satisfaction with the core product even as the module set expands rapidly through both internal build and acquisition.
    claimRefs: [CE001, CE002, CE003, CE004, CE005]
    tableRefs: [TE002]
    figureRefs: [FE002]
  - id: "module-map"
    title: "Module and Product-Line Map"
    body: |
      Redo's product line is best understood as a growing set of post-purchase modules, some built in-house and some acquired, unified by a shared merchant dashboard and shopper experience. The returns-and-claims engine is the origin module and remains the core: an AI-driven returns/exchange portal designed to retain revenue by converting refunds into exchanges and store credit. Around it, Redo has added order editing, package protection (shopper-paid coverage), warranties, and chargeback management — a cluster aimed at protecting and recovering revenue. A second cluster targets growth and engagement: email/SMS marketing, reviews, conversion-optimization tools, and an "Agentic Catalog" for AI-assisted shopping.

      Two capabilities entered through acquisition and materially widened the map. Malomo, acquired in January 2026 (founder-CEO Yaw Aning), brought best-in-class branded order tracking — turning the carrier-tracking moment into an owned, marketable brand touchpoint. ReturnBear, acquired in June 2026, brought an end-to-end international returns and reverse-logistics network operating as a "4PL" that keeps cross-border returns local in the US, Canada, UK, and Australia, verifies refunds instantly, and claims 30–60% return-cost savings and strong fraud reduction. Together these give Redo an unusually complete span from the digital post-purchase interface down to physical global logistics.

      The strategic logic of the map is land-and-expand: returns is the wedge, and each additional module raises revenue per merchant and switching costs. The public evidence that this is working is the 1,750+ of 4,100+ brands (roughly 43%) using more than one module. The risk in the map is breadth without equal depth — several modules (marketing, reviews, inventory) compete against specialized best-of-breed vendors, so the module map's value rests on integration and consolidation economics rather than each module being category-leading.
    claimRefs: [CE006, CE007, CE008, CE009, CE010]
    tableRefs: [TE001]
    figureRefs: [FE004]
  - id: "architecture"
    title: "Architecture and Operating Model"
    body: |
      Redo's operating model is a layered platform sitting on top of commerce platforms rather than replacing them. At the top is the shopper/merchant experience layer (branded returns portal, tracking pages, protection widget, warranty flows, marketing campaigns). Beneath it is the application/module layer described above. An AI/intelligence layer runs across the modules: AI agents for support resolution and sales, a marketing agent for personalized email/SMS, a post-purchase concierge, agentic-shopping/catalog features, plus return-reason analytics, fraud detection, and personalized exchange-offer logic. A data/integration layer connects Redo to the commerce and martech ecosystem, and a logistics layer — new with ReturnBear — handles physical reverse logistics through local return hubs.

      Integration breadth is a defining architectural feature. Redo publicly lists integrations spanning platforms (Shopify, Shop App, BigCommerce, Salesforce Commerce Cloud, CommentSold), support (Gorgias), marketing (Klaviyo, Attentive, Postscript, plus Google/Meta/TikTok ad channels), operations and 3PLs (Recharge, Brightpearl, Deposco, Flexport, NetSuite, ShipBob, ShipHero, fulfil.io, Two Boxes, Inmar), cross-border (Global-e), and carriers (FedEx, UPS, USPS, DHL, Canada Post, AusPost). This positions Redo as a hub in the post-purchase stack. Architecturally, the deepest dependency is Shopify: Redo is distributed through the Shopify App Store, operates within Shopify's checkout and app framework, and inherits Shopify's platform constraints (including checkout-fee presentation rules).

      The operating model blends software and physical operations. The software side is standard multi-tenant SaaS economics (high margin, cloud-hosted, API-integrated). The ReturnBear side adds a physical operation — return hubs, consolidation, carrier relationships, and local refund verification across four countries — which is operationally heavier and lower-margin but hard for a pure-software competitor to replicate. This hybrid architecture is the core of Redo's differentiation and also its main added operational complexity and integration risk.
    claimRefs: [CE011, CE012, CE013, CE014, CE015]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: "deployment-reliability-roadmap"
    title: "Deployment, Integration, Reliability, Support, and Roadmap"
    body: |
      Deployment is low-friction by design: a merchant installs Redo from the Shopify App Store at no cost, connects its store and relevant tools, and configures policies and workflows. Because the software is free and Shopify-native, time-to-value is short relative to enterprise post-purchase suites that require sales cycles and custom integration. Integration with carriers, 3PLs, and martech tools is handled through Redo's published connector set, and support is provided by Redo Tech, Inc., with an extensive help center covering returns setup, analytics, and optimization (dozens of articles per module). The Shopify listing's 5.0 rating across hundreds of reviews is the strongest public reliability/satisfaction signal, though it reflects merchant sentiment rather than measured uptime.

      Reliability and support scale with the module count and the two 2026 acquisitions, which introduce integration risk: merging Malomo's tracking stack and ReturnBear's logistics operations into a unified platform is non-trivial and is an execution watch-item. The company has partnered with ReturnBear for over a year before acquiring it, which reduces integration surprise, and Malomo's team joined intact under its founder — both mitigants.

      The roadmap, funded by the June 2026 Series B, is explicitly AI-and-international. Stated priorities are AI-driven commerce tooling — agentic shopping experiences, a marketing agent for personalized email/SMS, and a post-purchase concierge to lift lifetime value — and international expansion built on ReturnBear's cross-border network. This roadmap aligns with the broader industry shift toward agentic commerce, but much of the AI-agent capability is forward-looking (a use-of-proceeds commitment) rather than fully shipped, so its competitive weight is still to be proven. The development-stage picture is therefore a mature, high-satisfaction core (returns, tracking, protection) with a rapidly expanding, partly-roadmap AI and international frontier.
    claimRefs: [CE016, CE017, CE018, CE019, CE020, CE021]
    tableRefs: [TE005]
    figureRefs: []
  - id: "differentiation-trust-security"
    title: "Differentiation, Trust, Safety, Security, and Compliance"
    body: |
      Redo's technology differentiation rests on four pillars. First, breadth-plus-consolidation: one free platform spanning the whole post-purchase journey, which is hard for any single point vendor to match and raises switching costs as modules stack. Second, owned international reverse logistics via ReturnBear — a physical 4PL network across four countries that a pure-software rival cannot quickly replicate and that Shopify is unlikely to build natively. Third, post-purchase data and AI: because Redo sits across returns, tracking, protection, and marketing, it accumulates cross-module post-purchase data that can train return-reason, fraud, and personalization models, and it is investing the Series B into agentic AI. Fourth, distribution and brand: a top-rated Shopify app with a strong review moat and an ex-Divvy go-to-market machine.

      On trust, safety, and compliance, the most consequential area is the shopper-paid fee mechanism. Package/shipping protection presented at checkout must comply with the FTC's 2025 mandatory-fee-disclosure ("junk fee") rule, Shopify's 2025 ban on pre-checked protection boxes, and state insurance-law questions about whether such protection constitutes regulated insurance — all handled at the presentation and product-configuration layer. How Redo defaults, discloses, and words these fees is a direct compliance-and-quality control point, and ReturnBear's own claim of instant refund verification and fraud reduction speaks to quality controls on the returns side.

      On data security and privacy, Redo processes order, shopper, and payment-adjacent data across many integrations and now handles cross-border returns data subject to multiple jurisdictions (US, Canada, UK, Australia). Redo does not publicly detail its security certifications (e.g., SOC 2) or a formal privacy/compliance program in the sources reviewed, which is a diligence gap for an enterprise-grade platform at a unicorn valuation. Net: Redo's differentiation is real and multi-layered, but its trust/compliance posture — especially around fee presentation and data governance — is the area most in need of documented controls.
    claimRefs: [CE022, CE023, CE024, CE025, CE026, CE027]
    tableRefs: [TE004]
    figureRefs: [FE003]
