callouts:
  - calloutType: strength
    title: "Software-to-Logistics Span Is Hard to Replicate"
    body: "Redo spans the full post-purchase journey from a branded digital interface down to a physical international returns 4PL (ReturnBear across US/CA/UK/AU) — a hybrid software-plus-logistics architecture that a pure-software competitor cannot quickly copy and Shopify is unlikely to build natively."
    claimRefs: [CE012, CE014, CE022]
  - calloutType: strength
    title: "Hub Position via Broad Integrations and Top App Rating"
    body: "Redo integrates across platforms, martech, 3PLs, and carriers (Klaviyo, Gorgias, ShipBob, Global-e, FedEx/UPS/DHL) and holds a 5.0 Shopify App Store rating with 98% five-star reviews, giving it a strong distribution and satisfaction moat in the post-purchase stack."
    claimRefs: [CE005, CE013]
  - calloutType: risk
    title: "Deep Shopify and Fee-Regulation Dependency"
    body: "Redo runs on Shopify's App Store and checkout framework and presents shopper-paid fees governed by the FTC junk-fee rule, Shopify's pre-checked-box ban, and state insurance-law questions — so its most critical dependencies (platform and fee presentation) are outside its control."
    claimRefs: [CE013, CE023, CE024]
  - calloutType: risk
    title: "Undocumented Security/Privacy Posture and AI That Is Partly Roadmap"
    body: "Public sources do not detail Redo's security certifications or a formal privacy program despite cross-border data handling, and much of the marketed AI-agent capability is a Series B use-of-proceeds commitment rather than shipped product — both are diligence watch-items."
    claimRefs: [CE018, CE026, CE027]
