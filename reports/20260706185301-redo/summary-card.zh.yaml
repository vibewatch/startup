  headline: Redo 是增长快、AI 化程度高的售后平台，覆盖面正在变宽，团队来自 Divvy 且履历扎实，还自建跨境逆向物流；但它在财务未披露、买家付费模式承压的情况下，已经按 $1.25B 独角兽估值定价。
