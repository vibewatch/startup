      type: verification
      targets: ["contentRequirements/2"]
      status: answered
      answer: "Made by Mary, Enso Rings, and Mission Belt are confirmed live DTC storefronts associated with Redo via Utah's founder network; commercial terms are undisclosed."
    - id: QU018
      question: "What is Redo's single-customer or top-10 revenue concentration?"
      type: quantification
      targets: ["contentRequirements/4"]
      status: answered
      answer: "Not disclosed, but a ~4,100-brand SMB-skewed base implies low individual-account concentration."
    - id: QU019
      question: "What is Redo's dominant concentration risk?"
      type: verification
      targets: ["contentRequirements/4", "plannedTables/expansion-and-concentration-risk-table"]
      status: answered
      answer: "Platform/channel concentration on Shopify, not customer concentration."
    - id: QU020
      question: "How does the shopper-paid fee model affect customer satisfaction?"
      type: adverse
      targets: ["contentRequirements/3", "contentRequirements/4"]
      status: answered
      answer: "It exposes the shopper (payer) side to junk-fee and insurance-law scrutiny and a comparable-vendor class action (Route), a satisfaction risk invisible in merchant reviews that can feed merchant churn."
    - id: QU021
      question: "Do customers report reliability or product-quality problems?"
      type: adverse
      targets: ["contentRequirements/3"]
      status: answered
      answer: "Yes, mildly — even five-star reviewers cite 'occasional updates/bugs' and AI-to-human handoff friction as the platform expands quickly."
    - id: QU022
      question: "How does Shopify's platform governance affect Redo's customers?"
      type: adverse
      targets: ["contentRequirements/4"]
      status: answered
      answer: "Shopify controls distribution and fee presentation (e.g., its 2025 ban on pre-checked protection boxes), so a policy or native-feature change can alter Redo's monetization directly."
    - id: QU023
      question: "How fresh is the customer-proof evidence?"
      type: freshness
      targets: ["contentRequirements/2"]
      status: answered
      answer: "Current — Shopify reviews are dated May–June 2026, and merchant counts come from the June 2026 Series B."
    - id: QU024
      question: "How does Redo compare to peers on disclosed customer metrics?"
      type: comparison
      targets: ["contentRequirements/1", "contentRequirements/3"]
      status: partial
      answer: "Redo's 4,100+ brand count is a scale signal, but like most private peers it discloses no NRR/churn, so head-to-head retention comparison is not possible."
    - id: QU025
      question: "What partner/integration dependencies do customers rely on?"
      type: enumeration
      targets: ["contentRequirements/4"]
      status: answered
      answer: "Connectors to Klaviyo, Gorgias, Recharge, ShipBob, and carriers underpin the consolidated value proposition."
    - id: QU026
      question: "How do acquisitions expand the customer surface?"
      type: verification
      targets: ["contentRequirements/1", "contentRequirements/4"]
      status: answered
      answer: "Malomo (Jan 2026) adds order tracking and ReturnBear (Jun 2026) adds international returns, expanding the modules and geographies existing customers can adopt."
    - id: QU027
      question: "Is there a public customer-concentration or cohort disclosure to size expansion revenue?"
      type: quantification
      targets: ["contentRequirements/3", "contentRequirements/4"]
      status: unresolved
      answer: "No cohort, concentration, or expansion-revenue disclosure is public; expansion is evidenced only qualitatively via the multi-module rate."
