figures:
  - id: FU001
    title: "Customer journey map"
    type: journey-map
    layout: wide
    summary: "Redo's customer journey runs from free Shopify-App-Store discovery through returns-first activation, multi-module expansion, and long-tenure retention, with a parallel shopper journey through the returns portal and paid protection."
    data:
      nodes:
        - id: discovery
          label: "Discovery via Shopify App Store"
          detail: "A DTC merchant finds Redo as the #1-rated returns app (5.0, 669 reviews) and installs it for free with no upfront commitment."
        - id: activation
          label: "Returns-first activation"
          detail: "The merchant configures the branded returns/exchange portal — the most common entry module — and shoppers begin initiating returns and exchanges."
        - id: monetization
          label: "Shopper-paid protection + usage fees"
          detail: "Shoppers opt into package protection at checkout (shopper-paid take-rate); the merchant begins paying usage-based fees on adopted modules."
        - id: expansion
          label: "Multi-module expansion"
          detail: "The merchant adds order tracking (Malomo), email/SMS marketing, warranties, chargebacks, and AI support — ~1,750 brands (~43%) use more than one product."
        - id: support
          label: "Human + AI support"
          detail: "Merchants cite responsive human reps (named in reviews) alongside AI support agents; AI-to-human handoff is a live friction point."
        - id: retention
          label: "Long-tenure retention"
          detail: "Engaged merchants stay two-to-three years (Goldie Swimwear ~3y, Violate The Dress Code 2y), describing Redo as an easy vendor relationship."
    approximationNotes: "Stages are inferred from Redo's customer/marketing pages and dated Shopify reviews rather than a published Redo customer-lifecycle diagram."
    claimRefs: [CU001, CU007, CU010, CU013, CU021, CU022]
  - id: FU002
    title: "Adoption / expansion funnel"
    type: funnel
    layout: standard
    summary: "The base narrows from the full installed merchant base to multi-module adopters, long-tenure references, and named independently visible production customers."
    data:
      items:
        - label: "Brands served (marketing)"
          value: 4500
        - label: "Brands served (press-reported at Series B)"
          value: 4100
        - label: "Multi-module brands (~43%)"
          value: 1750
        - label: "Shopify App Store reviews (named, dated)"
          value: 669
        - label: "Independently named production reference customers cited"
          value: 5
    approximationNotes: "This funnel layers evidence density (installed base -> multi-module -> reviewed -> independently named references), not an internal sales-conversion pipeline. Marketing counts are unaudited."
    claimRefs: [CU007, CU008, CU009, CU010, CU014]
  - id: FU003
    title: "Customer proof matrix"
    type: matrix
    layout: wide
    summary: "Shopify-review customers score highest on independence and production status; customer-angel brands are confirmed but have undisclosed terms and thinner corroboration."
    data:
      columns: ["Named", "Independent (third-party)", "Production (vs pilot)", "Outcome disclosed"]
      rows:
        - label: "Goldie Swimwear"
          values: ["Yes", "Yes (Shopify)", "Production (~3y)", "Qualitative only"]
        - label: "Violate The Dress Code"
          values: ["Yes", "Yes (Shopify)", "Production (2y)", "Qualitative only"]
        - label: "Creations of Christ"
          values: ["Yes", "Yes (Shopify)", "Production, multi-module", "Qualitative only"]
        - label: "AnaOno"
          values: ["Yes", "Yes (Shopify)", "Production", "Qualitative only"]
        - label: "Zorali"
          values: ["Yes", "Yes (Shopify)", "Production", "Qualitative only"]
        - label: "Made by Mary"
          values: ["Yes", "Partial (live brand)", "Unknown terms", "No"]
        - label: "Enso Rings"
          values: ["Yes", "Partial (live brand)", "Unknown terms", "No"]
    approximationNotes: "Ratings are analyst judgments from each cited source, not a company scorecard. 'Outcome disclosed' is qualitative for review customers because Redo's numeric outcome metrics are aggregate, not account-attributable."
    claimRefs: [CU013, CU014, CU015, CU016, CU017, CU018]
  - id: FU004
    title: "Retention / satisfaction cohort"
    type: cohort
    layout: wide
    summary: "An evidence-depth cohort scoring how much reviewed evidence supports initial satisfaction, expansion, and long-run retention across merchant tenure bands and the shopper payer side."
    data:
      columns: ["Initial satisfaction proof", "Expansion / multi-module proof", "Long-run retention visibility"]
      rows:
        - label: "Long-tenure merchants (2–3 years)"
          values: [95, 70, 60]
        - label: "Mid-tenure merchants (~1 year)"
          values: [90, 80, 40]
        - label: "New merchants (recent installs)"
          values: [85, 30, 15]
        - label: "Shopper payer side (protection buyers)"
          values: [40, 20, 10]
    approximationNotes: "Percentage-style heuristics reflecting evidence depth per layer, not a revenue-retention cohort; Redo discloses no NRR/GRR/churn. The shopper payer row scores low because satisfaction there is unmeasured and contested (junk-fee scrutiny)."
    claimRefs: [CU010, CU020, CU021, CU022, CU023, CU024]
callouts:
  - id: KU001
    type: strength
    title: "Diffuse, sticky, multi-module base"
    body: "With 4,100+ mostly-SMB Shopify brands and ~43% using more than one module, Redo has low single-customer concentration and a working land-and-expand motion, corroborated by two-to-three-year review tenures and a 5.0 / 98% five-star Shopify rating."
    claimRefs: [CU007, CU010, CU021]
  - id: KU002
    type: risk
    title: "Undisclosed retention, contested payer side"
    body: "No NRR/GRR/churn is public, and the shopper-paid protection model exposes the end-user (payer) side of the relationship to junk-fee and insurance-law scrutiny that merchant reviews do not capture — an asymmetric satisfaction picture."
    claimRefs: [CU020, CU024, CU025]
  - id: KU003
    type: risk
    title: "Single-platform channel concentration"
    body: "Nearly all customers are Shopify merchants, so Redo's addressable base, distribution, and fee-presentation rules are governed by one platform; a Shopify policy or native-feature change can alter monetization directly."
    claimRefs: [CU030, CU031, CU033]
  - id: KU004
    type: neutral
    title: "Reference quality: broad and fresh, thin on audited outcomes"
    body: "Hundreds of dated, named, third-party production reviews give strong breadth and freshness, but account-level financial outcomes are not independently audited — Redo's numeric metrics are aggregate and company-published."
    claimRefs: [CU014, CU018, CU019]
