company:
  name: "Redo"
chapter:
  number: 6
  title: "Customers"
  summary: "Redo's customer base is direct-to-consumer Shopify brands — the company cites 4,100+ merchants (marketing says 4,500+) across apparel, jewelry, swimwear, and consumer-goods verticals, concentrated in the US and expanding internationally via ReturnBear. Its defining structural feature is a split buyer/user/payer model: the merchant installs Redo for free and pays usage-based fees, while the shopper is both the end user and, for package protection, the paying party. Named production customers surface through a top-rated Shopify listing (5.0, 669 reviews, 98% five-star) and long-tenure testimonials (Goldie Swimwear ~3 years, Violate The Dress Code 2 years, AnaOno, Creations of Christ, Zorali) plus 'customer-angel' DTC brands Made by Mary, Mission Belt, and Enso Rings. Adoption shows genuine land-and-expand — brands start with returns and add tracking, marketing, and support — with ~1,750 brands (~43%) using multiple modules. No NRR, GRR, churn, or customer-concentration figure is publicly disclosed, and the shopper-paid fee model draws adverse scrutiny (junk-fee complaints, insurance-law questions, Route class action) that is the principal customer-satisfaction risk."
sections:
  - id: "segmentation"
    title: "Customer Base and Segmentation"
    body: |
      Redo sells to direct-to-consumer (DTC) e-commerce brands, overwhelmingly on Shopify, and its customer economics rest on an unusual split of the buyer, user, and payer roles. The merchant is the buyer and the primary account holder, but Redo is free to install; the merchant pays usage-based fees as it adopts paid modules. The shopper is the end user of most surfaces (the returns portal, tracking pages, warranty flows) and, critically, is also the paying party for package/shipping protection, which is monetized as a shopper-paid take-rate at checkout. This free-to-merchant, shopper-monetized structure means Redo's "customer" is really two constituencies whose incentives can diverge — a dynamic that shapes both adoption (low friction for merchants) and satisfaction risk (fees fall on shoppers).

      By segment, Redo's merchants cluster in physical-goods DTC verticals where returns and exchanges are frequent and margin-sensitive: apparel and fashion, jewelry and accessories, swimwear, and consumer goods. Named examples span jewelry (Made by Mary, Enso Rings), accessories (Mission Belt), apparel (Violate The Dress Code, Zorali, Creations of Christ), swimwear (Goldie Swimwear), and specialty intimates (AnaOno). By size, the base skews small-to-mid-market Shopify brands rather than large enterprise retailers, though Redo positions its consolidated platform as a way for growing brands to replace "dozens of point solutions." Geographically the base is US-centric; the June 2026 ReturnBear acquisition extends addressable customers into Canada, the UK, and Australia by adding local return infrastructure. By use case, customers segment along the module they adopt first — most commonly returns and exchanges — before expanding into order tracking, marketing, and support.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: "adoption-trajectory"
    title: "Adoption Trajectory and Multi-Module Expansion"
    body: |
      Redo's adoption trajectory is best evidenced by merchant count and multi-module expansion rather than by disclosed revenue cohorts. At its June 2026 Series B, the company was reported to serve more than 4,100 brands; Redo's own marketing surfaces cite 4,500+ brands, and the customers page headlines a 4.9 rating across 800+ reviews. Of the installed base, Redo states that roughly 1,750 brands — about 43% — use more than one product, a direct signal of land-and-expand adoption within the account base. This multi-module penetration is the core of Redo's growth story: a brand that installs the free returns portal becomes a candidate for order tracking (via the acquired Malomo), post-purchase email/SMS marketing, warranties, chargebacks, and AI support, each of which is separately monetized.

      Testimonial evidence corroborates the expansion pattern qualitatively. AnaOno and Creations of Christ describe starting with returns and exchanges and later adopting customer service, shipping, order-confirmation emails, and marketing "all in one place." Long-tenure reviews — Goldie Swimwear at almost three years, Violate The Dress Code at two years, Creations of Christ at over a year — indicate durable retention among early adopters. The Shopify App Store listing shows 669 reviews at a 5.0 overall rating with 98% five-star, with fresh reviews dated May–June 2026, evidence that adoption and satisfaction remain current rather than historical. Redo's inorganic moves (Malomo in January 2026, ReturnBear in June 2026) expand the surface area over which existing customers can deepen adoption, though the pace of integration will determine how quickly acquired capabilities convert into expansion revenue.
    claimRefs: [CU007, CU008, CU009, CU010, CU011, CU012]
    tableRefs: [TU002]
    figureRefs: [FU002]
  - id: "named-proof"
    title: "Named Customer Proof and Reference Quality"
    body: |
      Redo's named customer proof comes from three sources of differing reference quality. First, the Shopify App Store reviews (669 reviews, 5.0 rating, 98% five-star) name specific production merchants with dated, first-person accounts: Goldie Swimwear (almost three years, praising ongoing support despite occasional update bugs), Creations of Christ (over a year, citing the "$1.99 risk-free buy-and-try" option and expansion into customer service, shipping, and confirmation emails), AnaOno (praising last-minute screen-share support), Violate The Dress Code (two years, "one of the easiest vendor relationships"), and Zorali. These are production references, not pilots, and several are independently visible on the third-party Shopify platform rather than curated by Redo.

      Second, Redo's own customers and homepage pages surface outcome-style testimonials and headline metrics — exchange rate up 43%, AI support resolution 80%, average order value up $4.03, return rate down 38%, retained revenue up 58% — but these are company-published and aggregate, not attributable audited results for a named account. Third, "customer-angel" DTC brands Made by Mary, Mission Belt, and Enso Rings are associated with Redo through Utah's DTC founder network; their live storefronts confirm they are real, operating brands, though the specific commercial terms are not disclosed. Overall, reference quality is strong on breadth and freshness (hundreds of dated, named production reviews) but thin on independently audited, account-level financial outcomes — a common profile for a fast-growing SaaS company whose customers are private brands.
    claimRefs: [CU013, CU014, CU015, CU016, CU017, CU018, CU019]
    tableRefs: [TU003]
    figureRefs: [FU003]
  - id: "retention-durability"
    title: "Retention, Durability, and Satisfaction"
    body: |
      Redo discloses no formal retention metrics — no net revenue retention (NRR), gross revenue retention (GRR), logo churn, renewal rate, or contract length is public. In their absence, durability must be inferred from proxies. The strongest positive proxies are tenure and satisfaction: multiple reviewers report two-to-three-year relationships, the Shopify listing holds a 5.0 rating across 669 reviews with 98% five-star and only 1% one-star, and reviewers repeatedly cite responsive human support (naming individual reps) as the reason they stay. The 43% multi-module rate is itself a retention signal, since customers using more products are structurally stickier. These proxies suggest high gross retention among engaged merchants, consistent with the "easiest vendor relationship" language in reviews.

      The countervailing signals are real but modest. Even five-star reviewers note "occasional updates/bugs that are frustrating" and friction reaching a human rather than the AI support agent, indicating that reliability and AI-handoff quality are live satisfaction issues as the platform expands quickly through acquisition. More materially, the shopper-paid protection model exposes the end-user side of the customer relationship to dissatisfaction that does not show up in merchant reviews: consumer-facing scrutiny of shipping-protection "junk fees," state insurance-law questions, and a class action against a comparable vendor (Route) over allegedly hidden fees all bear on shopper trust, which ultimately feeds merchant churn if shoppers complain. Because retention is undisclosed and the payer is not the reviewer, satisfaction evidence is asymmetric: strong on the merchant side, unmeasured and contested on the shopper side.
    claimRefs: [CU020, CU021, CU022, CU023, CU024, CU025, CU026]
    tableRefs: [TU004]
    figureRefs: [FU004]
  - id: "expansion-concentration"
    title: "Expansion, Concentration, and Channel Dependence"
    body: |
      Redo's expansion motion is land-and-expand within the account (add modules) plus market extension (add geographies via ReturnBear and add capabilities via Malomo). The ~1,750 multi-module brands demonstrate the intra-account motion is working; the international and acquired surfaces are the forward vectors. On concentration, Redo discloses no single-customer or top-10 revenue concentration figure, and its base of 4,100+ small-to-mid brands implies low individual-account concentration — no single DTC brand is likely to be a material share of revenue. That diffuse base is a durability strength relative to enterprise-concentrated peers.

      The dominant concentration risk is channel and platform dependence, not customer dependence. Nearly all of Redo's customers are Shopify merchants, so Redo's addressable base, distribution (the Shopify App Store), and even fee-presentation rules (Shopify's 2025 ban on pre-checked protection boxes) are governed by a single platform. This creates procurement and policy friction outside Redo's control: a Shopify policy change can alter Redo's monetization overnight, and Shopify-native returns or protection features could compress the addressable base. Partner/integration dependence is a secondary vector — customers rely on Redo's connectors to Klaviyo, Gorgias, Recharge, ShipBob, and carriers, so the value proposition assumes those integrations persist. Finally, the shopper-paid model concentrates regulatory exposure (FTC junk-fee rule, insurance-law scrutiny) on the exact mechanism that monetizes the customer base, tying revenue durability to an evolving compliance environment.
    claimRefs: [CU027, CU028, CU029, CU030, CU031, CU032, CU033, CU034, CU035]
    tableRefs: [TU005]
    figureRefs: []
