company:
  name: "Redo"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Redo is a Draper, Utah post-purchase commerce platform for direct-to-consumer brands, co-founded by Tay Brown and CEO Sterling Snow (ex-Divvy CRO). Free for merchants and monetized on usage, it grew to 4,100+ brands and closed an $81M Series B in June 2026 at a $1.25B valuation led by Smash Capital, funding AI and international expansion plus the ReturnBear and Malomo acquisitions."
sections:
  - id: "identity-and-business"
    title: "Identity, Business Model, and Corporate Structure"
    body: |
      Redo is a commerce technology company headquartered in Draper, Utah, that helps direct-to-consumer (DTC) and omnichannel brands manage the entire post-purchase journey. The company began as a returns-and-exchanges platform and has expanded into a broader "post-purchase operating system" spanning returns and claims, order tracking, package protection, fulfillment support, customer service, and email/SMS marketing, increasingly wrapped in AI-powered commerce tools. Its public-facing brand is Redo (websites redo.com and getredo.com), and it markets itself as the "#1 rated ecommerce app" with a 4.9-star rating across 800+ reviews.

      The defining feature of Redo's business model is that its software is free to merchants; the company makes money on the usage that flows through the platform, principally shopper-paid return coverage and package protection selected at checkout, plus paid product usage. CEO Sterling Snow has explicitly framed this as mirroring his prior company Divvy: a huge market, free software that fixes a painful and expensive problem, usage-based monetization, a similar go-to-market motion, and consolidation of point solutions into a single platform. Snow describes the strategy as owning the merchant-shopper relationship across every touchpoint rather than solving returns alone.

      Redo launched its platform in January 2023 and is privately held. It is closely tied to Pelion Venture Partners — it is based in the same Draper building as Pelion, and Snow remains a Venture Partner at the firm. The company positions itself as helping brands consolidate fragmented tech stacks into one intelligent, AI-powered system that turns post-purchase operations from a cost center into a revenue, retention, and loyalty engine.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007]
    tableRefs: [TO001]
    figureRefs: [FO002]
  - id: "leadership-and-governance"
    title: "Founders, Leadership, and Governance"
    body: |
      Redo was co-founded by Tay Brown and Sterling Snow. Tay Brown originated the core concept, "dog-fooded" the idea, built the minimum viable product, raised a seed round, and onboarded the first customers; he serves as Founder and Board Member. Sterling Snow joined officially as co-founder and CEO in September 2023 after the two worked together on the idea for roughly three months. Snow's background is the company's central credential: he rose over nearly five years at Divvy to become Chief Revenue Officer (January 2019–June 2021), a period during which Divvy scaled rapidly before being acquired by Bill.com for approximately $2.5 billion in May 2021 — at the time the largest tech acquisition in Utah history.

      A distinctive governance and talent feature is what local press dubbed the "Divvy Mafia": Snow assembled a handpicked leadership team of former Divvy operators, including Aaron Evett (Chief Commerce Officer), Eric Lepretre, Jordan Bleak, and Jared Cahoon. This concentration of experienced, previously-successful operators is a strength for execution but also a key-person dependency centered on Snow, whose personal brand, network, and Pelion relationship are tightly bound to the company. The reuse of the Divvy playbook (free software, usage monetization, platform consolidation) is both the bull case and a source of pattern-matching risk if the analogy does not hold in commerce.

      Governance detail beyond the founders and board is not publicly disclosed. Pelion Venture Partners, as lead investor across the seed and Series A rounds and a participant in Series B, is the most influential outside stakeholder, with Smash Capital newly added at Series B. No independent board composition, option pool, or formal committee structure has been published, which is typical for a private Series B company but represents a diligence gap.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO002]
  - id: "funding-and-valuation"
    title: "Funding History and Valuation"
    body: |
      Redo has raised approximately $107 million across three disclosed rounds since 2022. Databases indicate a roughly $2 million seed round in 2022 with early backing from Pelion Venture Partners, Signal Peak Ventures, and angel Jack Boren, though seed-round figures are not company-confirmed and should be treated as estimates.

      The Series A closed on August 20, 2024, raising $24 million led by Pelion Venture Partners. Institutional participants included EPIC Ventures, Kickstart Fund, Tandem Venture Partners, Cervin Ventures, Peterson Ventures, Signal Peak Ventures, and AGLAÉ VENTURES (the venture arm of LVMH). A notable feature was participation from Redo's own customers as angels — Mary and Taylor Moody (Made by Mary), Connor MacArthur (Mission Belt), and Aaron Dalley (Enso Rings) — alongside a roster of prominent Utah operators such as Blake Murray, Alex Bean, Adam Edmunds, Jeremy Andrus, and Jeron Paul. At the Series A the company reported roughly 1,500 brands and 73 employees.

      The Series B was announced June 24, 2026: $81 million at a reported $1.25 billion post-money valuation — unicorn status — led by Smash Capital (Paul Szurek), with existing investors Pelion Venture Partners and Cervin Ventures participating. The company stated it had already deployed part of the capital into the acquisition of ReturnBear, an international returns and reverse-logistics provider operating across 100+ countries, following its January 2026 acquisition of branded order-tracking platform Malomo. The step-up from a $24M Series A in August 2024 to a $1.25B valuation less than two years later implies an aggressive re-rating that later chapters test against revenue and comparable multiples. Exact revenue, ARR, and precise total-raised figures are not company-disclosed.
    claimRefs: [CO015, CO016, CO017, CO018, CO019, CO020, CO021, CO022, CO023]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: "milestones-scale-and-cover-metrics"
    title: "Milestones, Scale, and Cover Metrics"
    body: |
      Redo's trajectory compresses a lot of progress into roughly four years. The concept and MVP formed in 2021–2022 with a small seed round; the platform launched in January 2023; Snow joined as co-founder and CEO in September 2023; the $24M Series A closed in August 2024 at ~1,500 brands and 73 employees; Malomo was acquired in January 2026; and the $81M Series B, $1.25B valuation, and ReturnBear acquisition all landed in June 2026 at 4,100+ brands, with more than 1,750 merchants using multiple Redo products.

      On cover metrics, the well-supported figures as of mid-2026 are: a $1.25 billion post-money valuation, $81 million most recent raise, approximately $107 million total raised, 4,100+ brands on the platform, 1,750+ multi-product merchants, and a Draper, Utah headquarters. Revenue and ARR are not disclosed; the last public headcount data point is the 73 employees reported at the Series A (August 2024), and current headcount after two acquisitions and a Series B is almost certainly materially higher but unconfirmed. Some third-party trackers list stale single-digit or "1–10" employee counts that reflect incomplete database coverage rather than reality.

      A material forward-looking element is Redo's stated use of proceeds: AI-driven commerce tools (agentic shopping experiences, a marketing agent for personalized email/SMS, and a post-purchase concierge for higher lifetime value) and international expansion via ReturnBear's cross-border returns network. The most relevant adverse backdrop for the company's monetization is intensifying regulatory and legal scrutiny of checkout package-protection/"shipping protection" fees — including FTC junk-fee rulemaking, state insurance-law questions, and class-action litigation against peers — since shopper-paid coverage is central to how Redo earns revenue on free software.
    claimRefs: [CO024, CO025, CO026, CO027, CO028, CO029, CO030, CO031, CO032]
    tableRefs: [TO004]
    figureRefs: [FO003]
