callouts:
  - calloutType: strength
    title: "Repeat-Operator Team Running a Proven Playbook"
    body: "CEO Sterling Snow and a handpicked ex-Divvy leadership core are re-applying the Divvy model — free software, usage-based monetization, platform consolidation — that produced a $2.5B exit, giving Redo unusual execution credibility for its stage."
    claimRefs: [CO008, CO011, CO013]
  - calloutType: risk
    title: "Aggressive Valuation Step-Up on Undisclosed Revenue"
    body: "A jump from a $24M Series A (Aug 2024) to a $1.25B valuation (Jun 2026) is steep, and Redo does not disclose revenue or ARR, leaving the re-rating unverifiable from public data."
    claimRefs: [CO017, CO023, CO030]
  - calloutType: risk
    title: "Monetization Exposed to Checkout-Fee Regulation"
    body: "Because Redo earns on shopper-paid coverage/package protection, tightening FTC junk-fee rules, state insurance-law scrutiny, and peer class actions over 'shipping protection' fees are a direct model risk."
    claimRefs: [CO032]
  - calloutType: insight
    title: "Post-Purchase as a Land-and-Expand Wedge"
    body: "Returns were the wedge; order tracking (Malomo), international logistics (ReturnBear), marketing, and AI agents are the expansion, with 1,750+ of 4,100+ brands already using multiple products."
    claimRefs: [CO005, CO025, CO026]
