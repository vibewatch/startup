      question: "How efficient is Redo's expansion motion?"
      type: verification
      targets: ["contentRequirements/1"]
      status: answered
      answer: "The 43% multi-module attach is a healthy public proxy, but no magic number or cohort data is disclosed."
    - id: QI012
      question: "What drives Redo's gross margin?"
      type: mechanism
      targets: ["contentRequirements/2", "plannedTables/unit-economics-table"]
      status: answered
      answer: "A high-margin software core diluted by coverage-claims costs and ReturnBear reverse-logistics costs."
    - id: QI013
      question: "Why is Redo's revenue quality lower than pure SaaS?"
      type: verification
      targets: ["contentRequirements/2", "contentRequirements/5"]
      status: answered
      answer: "Protection revenue is a take-rate net of claims on a regulated fee, unlike contracted subscription ARR."
    - id: QI014
      question: "What service-delivery costs does the ReturnBear acquisition add?"
      type: mechanism
      targets: ["contentRequirements/2"]
      status: answered
      answer: "Physical cross-border returns handling across 100+ countries, carrying logistics-style, lower-margin economics."
    - id: QI015
      question: "What is Redo's current headcount and cost base?"
      type: quantification
      targets: ["contentRequirements/2"]
      status: partial
      answer: "Last public figure is 73 employees at the Series A (Aug 2024); current count is higher but unconfirmed."
    - id: QI016
      question: "Does Redo benefit from float on collected shopper fees?"
      type: mechanism
      targets: ["contentRequirements/2"]
      status: unresolved
      answer: "Plausible (fees collected before claims paid) but undisclosed; could be favorable working capital or a claims liability."
    - id: QI017
      question: "What traction metrics does Redo publicly disclose?"
      type: enumeration
      targets: ["contentRequirements/3"]
      status: answered
      answer: "Valuation, raise size, total raised, 4,100+ brands, 1,750+ multi-product merchants, and two acquisitions."
    - id: QI018
      question: "How fast has Redo's brand base grown?"
      type: quantification
      targets: ["contentRequirements/3"]
      status: answered
      answer: "From ~1,500 brands at the Series A (Aug 2024) to 4,100+ by mid-2026, nearly tripling in under two years."
    - id: QI019
      question: "What ARR would the $1.25B valuation imply under 2026 multiples?"
      type: quantification
      targets: ["contentRequirements/3", "plannedFigures/financial-estimate-range"]
      status: answered
      answer: "Roughly $80–250M depending on the multiple (5–15x), but this is a derived estimate, not a disclosure."
    - id: QI020
      question: "What is the best public revenue comparable for Redo?"
      type: comparison
      targets: ["contentRequirements/3"]
      status: answered
      answer: "Loop Returns at ~$53.3M revenue (2024) for a returns specialist; Redo's broader bundle likely exceeds it."
    - id: QI021
      question: "How does fee regulation threaten Redo's revenue base?"
      type: adverse
      targets: ["contentRequirements/3", "contentRequirements/5"]
      status: answered
      answer: "FTC junk-fee rules, insurance-law questions, and peer litigation (Route) directly pressure shopper-paid coverage revenue."
    - id: QI022
      question: "Which core financial metrics are missing from public disclosure?"
      type: enumeration
      targets: ["contentRequirements/3", "plannedTables/public-financial-gaps-table"]
      status: answered
      answer: "Revenue/ARR, take rate, gross margin, NRR, CAC/payback, burn, cash, and runway are all undisclosed."
    - id: QI023
      question: "How much has Redo raised and is it well-capitalized?"
      type: quantification
      targets: ["contentRequirements/4", "plannedTables/capital-adequacy-table"]
      status: answered
      answer: "Approximately $107M total, including an $81M June 2026 Series B; well-funded for its stage."
    - id: QI024
      question: "How much of the Series B was already deployed?"
      type: verification
      targets: ["contentRequirements/4"]
      status: partial
      answer: "Part of it funded the ReturnBear acquisition; the exact amount is undisclosed, reducing available runway."
    - id: QI025
      question: "What is Redo's cash on hand and runway?"
      type: quantification
      targets: ["contentRequirements/4"]
      status: answered
      answer: "Not disclosed and not computable without burn; Series B recency implies low near-term financing need."
    - id: QI026
      question: "What is Redo's stated use of funds?"
      type: verification
      targets: ["contentRequirements/4"]
      status: answered
      answer: "AI-driven commerce tooling (agentic shopping, marketing agent, concierge) and international expansion via ReturnBear."
    - id: QI027
      question: "Does Redo carry debt or project-finance obligations?"
      type: verification
      targets: ["contentRequirements/4"]
      status: partial
      answer: "None disclosed; asset-light software, though ReturnBear logistics may carry undisclosed working-capital commitments."
    - id: QI028
      question: "What are the key financial diligence blockers?"
      type: verification
      targets: ["contentRequirements/5"]
      status: answered
      answer: "No disclosed revenue/margin, a regulation-exposed take-rate revenue base, and an unknown blended gross margin."
