company:
  name: "Redo"
chapter:
  number: 4
  title: "Financials"
  summary: "Redo does not disclose revenue, ARR, gross margin, burn, or runway, so its financial profile must be reconstructed from its business model, funding history, and SaaS benchmarks. The company is free to merchants and monetizes shopper-paid return coverage and package protection plus paid product usage — a usage/take-rate model whose revenue scales with order volume rather than seat count. It has raised roughly $107M (seed ~$2M in 2022, $24M Series A in Aug 2024, $81M Series B in Jun 2026 at a $1.25B valuation), deploying part of the Series B into the ReturnBear and Malomo acquisitions. The central financial gap is that a $1.25B valuation implies (at 2026 vertical-SaaS multiples of roughly 5–15x) an ARR somewhere in the ~$80–250M range that no public source confirms, and the shopper-paid revenue engine faces direct fee-disclosure and insurance-law risk."
sections:
  - id: "revenue-model-and-mix"
    title: "Revenue Streams, Pricing Model, and Revenue Mix"
    body: |
      Redo's defining financial characteristic is that its software is free to the merchant; the company earns money on the transaction usage that flows through the platform rather than on subscription seats. The primary revenue stream is shopper-paid coverage — return coverage and package/shipping protection that a consumer opts into (or is presented with) at checkout — of which Redo retains a take. Secondary streams include paid product usage across the expanding module set (order tracking via the acquired Malomo, email/SMS marketing, warranties, and emerging AI agents) and, following the ReturnBear acquisition, international returns and reverse-logistics services. This mirrors the model CEO Sterling Snow ran at Divvy: free software that fixes an expensive, painful problem, monetized on the usage it unlocks.

      This structure has important accounting and quality implications. Revenue tied to shopper-paid protection resembles an insurance/warranty take-rate more than classic SaaS subscription revenue, which raises questions about recognition (gross vs. net of claims paid), the durability of the fee if regulation forces clearer disclosure or opt-in defaults, and how much of "revenue" is pass-through versus retained margin. Because Redo does not publish a revenue-mix breakdown, the split between protection take, paid modules, and logistics is unknown. What is disclosable is directional: the company reports 4,100+ brands and 1,750+ merchants using multiple products, implying a meaningful and growing cross-sell/attach dynamic that should lift revenue per merchant over time even though absolute figures are withheld.

      For diligence, the model's strength is alignment (revenue grows with GMV/order volume and merchant success) and low adoption friction (free install); the weakness is that a usage/take-rate model on a regulated fee is more exposed to policy and platform changes than a contracted subscription, and the absence of any disclosed revenue mix makes revenue quality unverifiable from public data.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: "gtm-and-sales-efficiency"
    title: "GTM Motion and Sales-Efficiency Proxies"
    body: |
      Redo's go-to-market is a product-led, free-to-install motion distributed primarily through the Shopify App Store and amplified by a heavy-hitting ex-Divvy sales and marketing team and customer-angel references (Made by Mary, Mission Belt, Enso Rings). Because the merchant pays nothing to start, the classic paid-acquisition CAC/payback framing is partly replaced by an activation-and-attach motion: the cost of acquiring a merchant is lower, but the company must then drive shopper-side attach rates and multi-module adoption to convert a free install into revenue. The 1,750+ multi-product merchants out of 4,100+ brands is the best public proxy for expansion efficiency — roughly 43% of brands use more than one module — which is a healthy attach signal if sustained.

      No CAC, payback period, sales cycle, or magic-number figure is disclosed, so sales efficiency can only be benchmarked. In 2026, SaaS medians cited by benchmark aggregators put LTV/CAC around 2.1–3.6:1 (with 3:1 the traditional healthy target), CAC payback around 15–20 months (elite under 12), and net revenue retention near 101–103% for all SaaS but ~112% for vertical SaaS. A usage-monetized, free-to-merchant model with strong multi-module attach could plausibly show above-median NRR and shorter effective payback than a seat-based peer, but this is an inference from the model, not a measured Redo metric. The relevant risk is that if shopper attach rates on protection compress (due to regulation, opt-in defaults, or shopper price sensitivity), the entire revenue-per-merchant assumption weakens even as merchant counts keep rising.

      Channel economics also concentrate distribution risk in Shopify: the App Store is the acquisition funnel, and Shopify governs the checkout surface where the monetizing fee is presented. This is efficient today but means Redo's unit economics are partly a function of a platform it does not control.
    claimRefs: [CI007, CI008, CI009, CI010, CI011]
    tableRefs: [TI003]
    figureRefs: [FI002]
  - id: "cost-structure-and-margins"
    title: "Cost Structure, Gross Margin Drivers, and Service-Delivery Costs"
    body: |
      Redo's cost structure blends software-company economics with logistics and coverage-claims costs that a pure SaaS business does not carry. On the software side, gross margins should be high (hosting, platform, and support), consistent with vertical SaaS. But two elements pull the blended margin down and complicate the picture: (1) coverage/claims costs — if Redo bears or reinsures package-protection and return-coverage claims, the cost of paid claims is a direct offset to protection revenue, making the true gross margin on that stream a net-of-claims number rather than a typical 80%+ software margin; and (2) reverse-logistics costs from the ReturnBear acquisition, which involve physical returns handling across 100+ countries and carry logistics-style, lower-margin economics.

      Operating cost drivers are the ex-Divvy go-to-market team (sales, marketing, and partnerships were the visible spend at Divvy and likely are here), R&D for the AI-agent roadmap funded by the Series B, and integration costs from two 2026 acquisitions (Malomo and ReturnBear). Headcount is a key unknown: the last public figure is 73 employees at the Series A (August 2024), and after two acquisitions and an $81M raise the current count is materially higher but unconfirmed. Working capital and any float dynamics from collecting shopper fees before paying claims are undisclosed but could be a source of favorable timing (fees collected up front, claims paid later) or a liability if claims spike.

      Net: the plausible margin path is a high-margin software core diluted by claims and logistics costs, with the blended gross margin unknowable from public data. This is a material revenue-quality question — a dollar of shopper-protection "revenue" is not economically equivalent to a dollar of subscription SaaS revenue, and the valuation comparison in the valuation chapter must account for that.
    claimRefs: [CI012, CI013, CI014, CI015, CI016]
    tableRefs: []
    figureRefs: [FI004]
  - id: "public-traction-vs-private-gaps"
    title: "Public Traction Versus Private-Metric Gaps"
    body: |
      The publicly supportable traction metrics are: a $1.25 billion post-money valuation (June 2026), an $81 million most-recent raise, approximately $107 million total raised, 4,100+ brands on the platform, 1,750+ multi-product merchants, and two 2026 acquisitions (Malomo, ReturnBear). Growth in brand count is strong — roughly 1,500 brands at the Series A (August 2024) to 4,100+ by mid-2026, implying the platform nearly tripled its merchant base in under two years.

      The private-metric gaps are severe and central to any investment decision. Redo discloses no revenue, ARR, GMV processed, take rate, gross margin, net revenue retention, CAC/payback, burn, cash on hand, or runway. As a triangulation, the closest public comparable is Loop Returns at roughly $53.3 million revenue in 2024 for a returns specialist; if Redo's broader bundle and larger brand base put its revenue above Loop's, a rough ARR band can be inferred from the valuation and 2026 multiples (see the estimate-range figure), but every point in that band is a derived estimate, not a disclosure. The company's own headline metrics are activity metrics (brands, multi-product merchants) rather than financial ones, which is a deliberate disclosure choice common to private companies but a genuine limitation here given the unicorn valuation.

      The one adverse, financially material public thread is regulatory: the FTC's 2025 junk-fee rule requiring clear disclosure of mandatory fees, class-action litigation against peer Route over allegedly hidden shipping-protection fees, and state insurance-law questions about package protection all bear directly on the revenue stream that most plausibly drives Redo's economics. These do not prove a problem at Redo, but they define the downside scenario for its revenue base.
    claimRefs: [CI017, CI018, CI019, CI020, CI021, CI022]
    tableRefs: [TI005]
    figureRefs: [FI003]
  - id: "capital-adequacy-and-verdict"
    title: "Capital Adequacy, Financing Dependency, and Financial Verdict"
    body: |
      On capital adequacy, Redo is well-funded for its stage. The $81 million Series B (June 2026) sits on top of a $24 million Series A (August 2024) and a ~$2 million seed (2022), for roughly $107 million raised. The company explicitly stated it had already deployed part of the Series B into the ReturnBear acquisition (following the January 2026 Malomo deal), so not all of the fresh capital is available runway — an unquantified but real draw. Absent disclosed burn, runway cannot be computed; however, a usage-monetized model that is already at 4,100+ brands and generating shopper-fee revenue is likely closer to self-sustaining than a pre-revenue company, which reduces near-term financing dependency. The stated use of remaining proceeds is AI-driven commerce tooling (agentic shopping, marketing agent, post-purchase concierge) and international expansion via ReturnBear.

      The next-round trigger is not disclosed. Given the June 2026 raise, Redo has no obvious near-term need to return to market; the more likely capital events are further tuck-in acquisitions (the company has shown an appetite for M&A) funded from the Series B or future rounds. No debt or project-finance obligations are disclosed, consistent with an asset-light software company, though the ReturnBear logistics operations may carry some working-capital and facility commitments not visible publicly.

      Financial verdict: Redo's capital position is strong and its business model is genuinely differentiated and revenue-generating, but its financial quality is unverifiable. The three diligence blockers are (1) no disclosed revenue/ARR or margin, making the $1.25B valuation untestable against fundamentals; (2) a take-rate-on-a-regulated-fee revenue base whose durability depends on fee-disclosure and insurance-law outcomes; and (3) an unknown blended gross margin diluted by claims and logistics costs. The bull case is a high-growth, high-attach platform monetizing a massive returns problem; the bear case is that headline "revenue" is lower-quality and more policy-exposed than a SaaS multiple assumes. Resolving this requires audited financials, a revenue-mix and take-rate breakdown, and claims-cost data from the company data room.
    claimRefs: [CI023, CI024, CI025, CI026, CI027, CI028, CI020]
    tableRefs: [TI004]
    figureRefs: []
