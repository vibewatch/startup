      answer: "$66M Series B led by Tiger Global in April 2021 at a reported unicorn valuation."
    - id: QP005
      question: "How much has Narvar raised and who backs it?"
      type: quantification
      targets: ["contentRequirements/1"]
      status: answered
      answer: "Roughly $64M disclosed; backers include Accel, Battery Ventures, and Salesforce Ventures."
    - id: QP006
      question: "What happened to Route after its 2021 peak?"
      type: verification
      targets: ["contentRequirements/4"]
      status: answered
      answer: "Route raised $200M at a $1.25B valuation in June 2021, then retrenched and became a class-action defendant over allegedly hidden fees."
    - id: QP007
      question: "How does Redo's pricing model differ from incumbents?"
      type: comparison
      targets: ["contentRequirements/2", "plannedTables/pricing-packaging-comparison"]
      status: answered
      answer: "Redo is free to merchants and monetizes shopper-paid coverage, whereas Loop, AfterShip, Narvar, and ReturnGO charge merchant subscriptions."
    - id: QP008
      question: "Which competitor has the widest product scope versus Redo?"
      type: comparison
      targets: ["contentRequirements/2", "plannedTables/feature-capability-matrix"]
      status: answered
      answer: "AfterShip and Narvar are broadest among rivals, but none match Redo's combined returns + tracking + protection + marketing + international logistics bundle."
    - id: QP009
      question: "What is the regulatory exposure of the shopper-paid protection cohort?"
      type: adverse
      targets: ["contentRequirements/2", "contentRequirements/4"]
      status: answered
      answer: "FTC junk-fee/UDAP rulemaking, state insurance-law questions, Shopify's pre-checked-box ban, and Route litigation press hardest on Redo, Route, Corso, and Seel."
    - id: QP010
      question: "How high are switching costs in post-purchase software?"
      type: verification
      targets: ["contentRequirements/3"]
      status: answered
      answer: "Moderate and asymmetric; a single app swap is technically routine, but multi-module bundling raises switching costs materially."
    - id: QP011
      question: "How does multi-homing affect Redo's lock-in?"
      type: mechanism
      targets: ["contentRequirements/3"]
      status: answered
      answer: "Brands mix vendors module-by-module, so Redo must win each module on merit; its free price is the counter to multi-homing."
    - id: QP012
      question: "Who holds distribution power in this landscape?"
      type: verification
      targets: ["contentRequirements/3"]
      status: answered
      answer: "Shopify, via the App Store discovery channel, checkout control, and the ability to default native features on for millions of stores."
    - id: QP013
      question: "What partner/supply access does international returns require?"
      type: mechanism
      targets: ["contentRequirements/3"]
      status: answered
      answer: "Physical reverse-logistics networks; Redo acquired ReturnBear (100+ countries), analogous to Happy Returns via UPS."
    - id: QP014
      question: "Is Shopify a competitor or a platform partner to Redo?"
      type: verification
      targets: ["contentRequirements/0", "contentRequirements/4"]
      status: answered
      answer: "Both — Shopify is the distribution platform and, increasingly, a native substitute for returns/tracking, making it Redo's most structural competitor."
    - id: QP015
      question: "How durable is Redo's competitive moat?"
      type: verification
      targets: ["contentRequirements/4", "plannedTables/moat-durability-competitive-risk-register"]
      status: answered
      answer: "Above-average for its stage on breadth, GTM, and logistics, but capped by module commoditization, Shopify power, and monetization regulation."
    - id: QP016
      question: "What does Loop's revenue imply for Redo's valuation?"
      type: comparison
      targets: ["contentRequirements/4"]
      status: answered
      answer: "A pure returns specialist at ~$53M revenue implies Redo's $1.25B valuation must rest on the whole bundle, not returns alone."
    - id: QP017
      question: "How is the post-purchase category consolidating?"
      type: verification
      targets: ["contentRequirements/0", "contentRequirements/4"]
      status: answered
      answer: "Global-e acquired ReturnGO, UPS acquired Happy Returns, and Shopify keeps building native — consolidation around larger platforms."
    - id: QP018
      question: "What differentiates Redo from Route specifically?"
      type: comparison
      targets: ["contentRequirements/1", "contentRequirements/4"]
      status: answered
      answer: "Redo pairs shopper-paid protection with a full returns/tracking/marketing back office, whereas Route was protection-centric and narrower."
    - id: QP019
      question: "Which competitors are strongest on order tracking?"
      type: comparison
      targets: ["contentRequirements/2", "plannedTables/feature-capability-matrix"]
      status: answered
      answer: "AfterShip and Narvar; Redo matched them by acquiring Malomo's branded tracking."
    - id: QP020
      question: "What is Redo's primary distribution channel and its risk?"
      type: verification
      targets: ["contentRequirements/3"]
      status: answered
      answer: "The Shopify App Store; the risk is dependence on a platform that is also a competitor and gatekeeper of checkout."
    - id: QP021
      question: "How does the free-to-merchant model affect displacement of incumbents?"
      type: mechanism
      targets: ["contentRequirements/2", "contentRequirements/3"]
      status: answered
      answer: "It lowers the cost of switching off a paid incumbent, positioning Redo as the low-cost consolidator."
    - id: QP022
      question: "What is the ceiling on a returns-only business model?"
      type: freshness
      targets: ["contentRequirements/4"]
      status: partial
      answer: "Loop's ~$53M 2024 revenue suggests returns-only revenue is modest relative to unicorn valuations, motivating expansion into adjacent modules."
    - id: QP023
      question: "Which competitors have already been acquired, and by whom?"
      type: enumeration
      targets: ["contentRequirements/0"]
      status: answered
      answer: "ReturnGO by Global-e (2025); Happy Returns by UPS (2023, previously PayPal); Malomo by Redo (2026)."
    - id: QP024
      question: "Does Redo's AI-agent capability exceed competitors today?"
      type: verification
      targets: ["contentRequirements/2"]
      status: partial
      answer: "Partly roadmap — AI agents are a stated Series B use of proceeds; most rivals also market AI features, so this is not yet a proven differentiator."
    - id: QP025
      question: "What is the single most important competitive asymmetry?"
      type: verification
      targets: ["contentRequirements/4"]
      status: answered
      answer: "Redo's lower-friction shopper-paid monetization is also its most regulation-sensitive one, unlike subscription-priced rivals."
    - id: QP026
      question: "How replicable is Redo's international reverse-logistics advantage?"
      type: verification
      targets: ["contentRequirements/3", "contentRequirements/4"]
      status: answered
      answer: "Harder to replicate quickly — it requires a physical network (ReturnBear's 100+ countries) that Shopify is unlikely to build natively."
    - id: QP027
      question: "Would incumbents likely respond to Redo's free model with price cuts?"
      type: freshness
      targets: ["contentRequirements/4"]
      status: partial
      answer: "Plausible but unconfirmed; merchant-paid incumbents face margin pressure if free-to-merchant bundling gains share, though none has publicly matched it as of mid-2026."
