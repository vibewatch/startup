              - CR033
          - type: callout
            title: High mark, opaque fundamentals
            body: >-
              A $1.25B valuation against undisclosed ARR/retention, in a compressed-multiple environment, creates
              down-round risk — with Route's 2021 $1.25B raise and subsequent retrenchment a direct cautionary
              comparable.
            calloutType: insight
            claimRefs:
              - CR028
              - CR029
              - CR030
          - type: callout
            title: 'Mitigants: breadth, logistics, and capital'
            body: >-
              Redo mitigates through revenue diversification beyond protection, owned international logistics that
              native features can't easily replicate, an experienced ex-Divvy team, and a well-capitalized 2026 Series
              B.
