            body: >
              Redo's trajectory compresses a lot of progress into roughly four years. The concept and MVP formed in
              2021–2022 with a small seed round; the platform launched in January 2023; Snow joined as co-founder and
              CEO in September 2023; the $24M Series A closed in August 2024 at ~1,500 brands and 73 employees; Malomo
