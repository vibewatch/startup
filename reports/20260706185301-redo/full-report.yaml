  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base and Segmentation
        blocks:
          - type: paragraph
            body: >
              Redo sells to direct-to-consumer (DTC) e-commerce brands, overwhelmingly on Shopify, and its customer
              economics rest on an unusual split of the buyer, user, and payer roles. The merchant is the buyer and the
              primary account holder, but Redo is free to install; the merchant pays usage-based fees as it adopts paid
              modules. The shopper is the end user of most surfaces (the returns portal, tracking pages, warranty flows)
              and, critically, is also the paying party for package/shipping protection, which is monetized as a
              shopper-paid take-rate at checkout. This free-to-merchant, shopper-monetized structure means Redo's
              "customer" is really two constituencies whose incentives can diverge — a dynamic that shapes both adoption
              (low friction for merchants) and satisfaction risk (fees fall on shoppers).


              By segment, Redo's merchants cluster in physical-goods DTC verticals where returns and exchanges are
              frequent and margin-sensitive: apparel and fashion, jewelry and accessories, swimwear, and consumer goods.
              Named examples span jewelry (Made by Mary, Enso Rings), accessories (Mission Belt), apparel (Violate The
              Dress Code, Zorali, Creations of Christ), swimwear (Goldie Swimwear), and specialty intimates (AnaOno). By
              size, the base skews small-to-mid-market Shopify brands rather than large enterprise retailers, though
              Redo positions its consolidated platform as a way for growing brands to replace "dozens of point
              solutions." Geographically the base is US-centric; the June 2026 ReturnBear acquisition extends
              addressable customers into Canada, the UK, and Australia by adding local return infrastructure. By use
              case, customers segment along the module they adopt first — most commonly returns and exchanges — before
              expanding into order tracking, marketing, and support.
