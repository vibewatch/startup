  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Substitutes, and Adjacencies
        blocks:
          - type: paragraph
            body: >
              Redo competes in the market for post-purchase experience software sold to direct-to-consumer (DTC) and
              omnichannel e-commerce brands. The in-scope spend is SaaS and usage-based fees for automating the
              workflows that happen after checkout: returns and exchanges, order tracking and delivery notifications,
              package/shipping protection, warranties and claims, post-purchase support, and post-purchase marketing
              (email/SMS and increasingly AI agents). The relevant buyer is a merchant brand; the relevant payer is a
              blend of the brand (software) and the shopper (opt-in coverage at checkout).


              Explicitly excluded from Redo's addressable software market are the much larger physical layers around it:
              third-party logistics (3PL), warehousing, carrier shipping, and the reverse-logistics freight and
              processing that move and restock returned goods. Those are enormous — the reverse-logistics market alone
              is estimated near $936–955 billion in 2026 — but they are services and freight, not software, and Redo
              participates only at the orchestration/software layer (augmented by ReturnBear's cross-border processing
              network). Also excluded are core commerce platforms (Shopify, BigCommerce), forward-order management
              systems, and general marketing suites, though Redo increasingly overlaps their edges.


              The status-quo substitute for most brands is a fragmented stack of point tools plus manual work: a returns
              app, a separate tracking app, a shipping-protection add-on, a helpdesk, and an email/SMS platform — or,
              for smaller brands, native platform features and spreadsheets. Redo's thesis is that this fragmentation is
              the market: consolidating point solutions into one free-to-merchant platform, monetized on usage, is the
              same wedge its leadership used at Divvy. Key adjacencies Redo can expand into — shipping insurance,
              loyalty, reviews, helpdesk, and marketing automation (e.g. Klaviyo-style) — widen the opportunity but also
              raise the number of incumbents it must displace.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
