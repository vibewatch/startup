      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulation targets the monetization mechanism
            body: >-
              The FTC junk-fee rule, state insurance-law scrutiny, and the Route class-action precedent all bear on
              shopper-paid package protection — the exact mechanism monetizing much of Redo's base — making regulatory
              action the highest-severity, least-mitigable risk.
            calloutType: insight
