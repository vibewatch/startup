  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >
              The bull thesis for Redo is that it is building the consolidating operating layer for post-purchase
              commerce. It replaces a fragmented stack of point solutions — returns, order tracking, package protection,
              warranties, chargebacks, post-purchase marketing, and AI support — with one platform that a DTC brand
              installs for free and expands into over time. The evidence is a base of 4,100+ brands with ~43% (about
              1,750) using more than one module, a top-rated Shopify listing (5.0, 669 reviews, 98% five-star), and two
              2026 acquisitions (Malomo for branded order tracking, ReturnBear for owned international reverse
              logistics) that widen the moat into physical, hard-to-replicate infrastructure. A proven, cohesive
              ex-Divvy leadership team (CEO Sterling Snow) and a well-capitalized June 2026 Series B led by Smash
              Capital give the company the talent and capital to execute an AI-and-international roadmap in a large
              e-commerce-returns market.


              The anti-thesis is that the price rests on an unverified financial base and a structurally exposed
              monetization model. Redo discloses no revenue, ARR, growth, retention, or unit economics, so the $1.25B
              valuation cannot be corroborated from public evidence. Much of the monetization runs through shopper-paid
              package protection — the exact mechanism targeted by the FTC's 2025 junk-fee rule, state insurance-law
              scrutiny, and class-action precedent against comparable vendor Route. Redo is almost entirely dependent on
              Shopify for distribution, addressable market, and fee-presentation rules, and Shopify is building native
              returns that could commoditize the entry module. The most sobering comparable is direct: Route raised
              $200M at the identical $1.25B valuation in 2021, then retrenched amid fee-model backlash and litigation —
              a template for how a post-purchase unicorn built on shopper fees can de-rate. The thesis is therefore
              genuine but conditional, and the condition (durable, well-retained, fast-growing revenue) is precisely
              what the public record does not show.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV001
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV008
              - CV009
              - CV010
      - number: '8.2'
        title: Recommendation, Confidence, and Valuation Stance
        blocks:
          - type: paragraph
            body: >
              The recommendation is research-more at medium confidence, with a valuation stance of stretched. The logic
              is that Redo exhibits several genuine markers of a category-defining company — broad and consolidating
              product, real multi-module adoption, owned international logistics, a proven team, and a large market —
              but the single most important input to any valuation judgment, the financial base, is entirely
              undisclosed. A $1.25B mark is defensible if Redo's ARR is in the upper half of the implied $80-250M range
              and growing quickly with strong net revenue retention; it is stretched-to-expensive if ARR is at the lower
              end or if the shopper-fee revenue that regulation threatens is a large share of the mix. Because public
              evidence cannot distinguish these cases, the disciplined stance is to condition any investment on
              obtaining the financials rather than to underwrite the price now.


              Entry discipline matters acutely here. As a Series B priced at unicorn levels, the round carries the usual
              late-stage preference and dilution overhang, and any secondary or primary entry above $1.25B compounds the
              down-round risk that a compressed-multiple environment already implies. The risk rating is high — driven
              by regulatory exposure to the fee model and by Shopify platform dependence — even though execution risk is
              comparatively moderate given the team and capital. Target return depends entirely on which scenario
              materializes: the base case roughly holds the current mark, the bull case supports a 2.5-4x multiple on
              entry over a multi-year hold, and the bear case implies a down-round and capital impairment. Net, Redo is
              a watch-and-diligence candidate, not a conviction buy at the current price without disclosure.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
