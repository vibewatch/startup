      - number: '7.4'
        title: Partner, Dependency, and People Risk
        blocks:
          - type: paragraph
            body: >
              Redo's single largest dependency is Shopify. Nearly all customers are Shopify merchants, distribution runs
              through the Shopify App Store, and Shopify sets the rules that govern Redo's fee presentation — its 2025
              ban on pre-checked protection boxes altered Redo's opt-in defaults overnight, a concrete demonstration of
              the platform's leverage. The strategic version of this risk is competitive: Shopify is building native
              self-serve returns and exchanges, which could commoditize Redo's entry module and compress the
              low-complexity end of its addressable base, pushing Redo to defend on breadth, international handling,
              fraud prevention, and enterprise workflows. Secondary dependencies include carriers (FedEx, UPS, USPS,
              DHL, Canada Post, Australia Post) for the ReturnBear network and integration partners (Klaviyo, Gorgias,
              Recharge, ShipBob) whose APIs underpin the consolidated value proposition. Capital-provider dependence is
              comparatively low given a well-capitalized June 2026 Series B led by Smash Capital with Pelion and Cervin.


              On people and execution, Redo's leadership is concentrated in an ex-Divvy cohort — CEO Sterling Snow
              (former Divvy CRO) and other "Divvy Mafia" executives — with founder Tay Brown on the board. This
              concentration is an asset (a proven, cohesive team that scaled Divvy to a $2.5B exit) and a key-person
              risk (heavy reliance on Snow and a small senior group whose departure would be materially disruptive).
              Execution risk is elevated by the pace of change: two acquisitions in six months, an aggressive AI roadmap
              funded by the Series B, and international expansion all demand simultaneous execution against a headcount
              that was only ~73 at the last public disclosure (August 2024). The thesis-break triggers here are a
              key-person departure, a botched acquisition integration, or a Shopify policy/product move that
              structurally reprices Redo's monetization.
            claimRefs:
              - CR020
              - CR021
              - CR022
              - CR023
              - CR024
              - CR025
              - CR026
              - CR027
