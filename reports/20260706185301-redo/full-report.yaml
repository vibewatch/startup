            title: Single-platform dependence and native-returns threat
            body: >-
              Shopify governs Redo's distribution, fee rules, and addressable base, and is building native self-serve
              returns that could commoditize Redo's entry module — a potential thesis-break outside Redo's control.
            calloutType: insight
            claimRefs:
