      - number: '7.3'
        title: Operational, Quality, and Security Risk
        blocks:
          - type: paragraph
            body: >
              Redo's operational risk has grown with its acquisition-led expansion. Two 2026 acquisitions — Malomo
              (branded order tracking, January) and ReturnBear (international reverse-logistics 4PL, June) — introduce
              integration execution risk: merging separate codebases, data models, and, in ReturnBear's case, a physical
              network of return hubs and carrier relationships across the US, Canada, the UK, and Australia. Physical
              reverse logistics is structurally lower-margin and harder to scale than software, exposing Redo to
              warehousing, carrier-dependency, and cross-border operational failure modes it did not previously carry.
              Even within the core software, reliability is a live issue: multiple five-star Shopify reviewers cite
              "occasional updates/bugs that are frustrating," and several describe friction reaching a human agent past
              the AI support layer — signals that rapid feature expansion is straining quality and support.


              On security and privacy, the diligence gap is notable. No public SOC 2 attestation, ISO 27001
              certification, formal privacy program, or data-processing map was found in the sources reviewed, despite
              Redo handling order and shopper data across a broad integration surface and, post-ReturnBear, multiple
              jurisdictions. For a company at a $1.25B valuation courting larger brands, an undocumented
              enterprise-security posture is both a sales risk (enterprise procurement requires attestations) and a
              breach-exposure risk. Outage risk is amplified by Shopify dependence: because Redo's experience layer
              lives inside Shopify checkout and admin, platform incidents propagate directly to Redo's merchants.
              Mitigation maturity is difficult to assess precisely because Redo does not publish its security or
              reliability practices — itself a monitoring gap.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
              - CR017
              - CR018
              - CR019
