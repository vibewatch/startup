  - id: FP001
    title: Competitive positioning map
    type: quadrant
    layout: wide
    summary: >-
      Redo occupies a high-breadth, low-merchant-friction position (free-to-merchant plus the widest module bundle)
      versus returns specialists Loop and ReturnGO, the enterprise suites AfterShip and Narvar, the protection-only
      Route, and the Shopify-native baseline.
    data:
      xAxis:
        label: Platform breadth (0=single point solution, 10=full post-purchase suite)
      yAxis:
        label: Merchant adoption friction — inverse of price (0=high merchant cost, 10=free to merchant)
      points:
        - label: Redo
          x: 9
          'y': 10
          detail: >-
            Widest bundle (returns, tracking, protection, marketing, intl returns) and free to merchant; monetizes
            shopper-paid coverage.
          tone: positive
        - label: Loop Returns
          x: 5
          'y': 3
          detail: Deep returns/exchanges but merchant-paid SaaS; ~$53.3M revenue 2024, narrower scope.
          tone: neutral
        - label: AfterShip
          x: 7
          'y': 4
          detail: Broad tracking + returns suite, global carriers; subscription pricing, unicorn-scale.
          tone: neutral
        - label: Narvar
          x: 7
          'y': 2
          detail: Enterprise post-purchase suite; custom contracts, least SMB-accessible pricing.
          tone: neutral
        - label: Route
          x: 4
          'y': 9
          detail: Shopper-paid protection (near-free to merchant) but narrow scope; litigation overhang.
          tone: warning
        - label: ReturnGO
          x: 5
          'y': 4
          detail: AI returns specialist inside Global-e; merchant-paid; 2,500+ Shopify stores.
          tone: neutral
        - label: Shopify native
          x: 3
          'y': 8
          detail: Native returns/tracking at ~zero marginal cost; controls checkout, but shallow feature set.
          tone: warning
    approximationNotes: >-
      Axis placements are evidence-backed ordinal judgments from disclosed product scope and pricing models in this
      chapter's sources, not a single vendor-reported composite; Shopify-native breadth reflects baseline features
      rather than a dedicated app.
