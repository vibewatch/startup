chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Business Model, and Corporate Structure
        blocks:
          - type: paragraph
            body: >
              Redo is a commerce technology company headquartered in Draper, Utah, that helps direct-to-consumer (DTC)
              and omnichannel brands manage the entire post-purchase journey. The company began as a
              returns-and-exchanges platform and has expanded into a broader "post-purchase operating system" spanning
              returns and claims, order tracking, package protection, fulfillment support, customer service, and
              email/SMS marketing, increasingly wrapped in AI-powered commerce tools. Its public-facing brand is Redo
              (websites redo.com and getredo.com), and it markets itself as the "#1 rated ecommerce app" with a 4.9-star
              rating across 800+ reviews.


              The defining feature of Redo's business model is that its software is free to merchants; the company makes
              money on the usage that flows through the platform, principally shopper-paid return coverage and package
              protection selected at checkout, plus paid product usage. CEO Sterling Snow has explicitly framed this as
              mirroring his prior company Divvy: a huge market, free software that fixes a painful and expensive
              problem, usage-based monetization, a similar go-to-market motion, and consolidation of point solutions
              into a single platform. Snow describes the strategy as owning the merchant-shopper relationship across
              every touchpoint rather than solving returns alone.


              Redo launched its platform in January 2023 and is privately held. It is closely tied to Pelion Venture
              Partners — it is based in the same Draper building as Pelion, and Snow remains a Venture Partner at the
              firm. The company positions itself as helping brands consolidate fragmented tech stacks into one
              intelligent, AI-powered system that turns post-purchase operations from a cost center into a revenue,
              retention, and loyalty engine.
