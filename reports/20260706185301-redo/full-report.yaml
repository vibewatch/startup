      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >
              Redo was co-founded by Tay Brown and Sterling Snow. Tay Brown originated the core concept, "dog-fooded"
              the idea, built the minimum viable product, raised a seed round, and onboarded the first customers; he
              serves as Founder and Board Member. Sterling Snow joined officially as co-founder and CEO in September
              2023 after the two worked together on the idea for roughly three months. Snow's background is the
              company's central credential: he rose over nearly five years at Divvy to become Chief Revenue Officer
              (January 2019–June 2021), a period during which Divvy scaled rapidly before being acquired by Bill.com for
              approximately $2.5 billion in May 2021 — at the time the largest tech acquisition in Utah history.


              A distinctive governance and talent feature is what local press dubbed the "Divvy Mafia": Snow assembled a
              handpicked leadership team of former Divvy operators, including Aaron Evett (Chief Commerce Officer), Eric
              Lepretre, Jordan Bleak, and Jared Cahoon. This concentration of experienced, previously-successful
              operators is a strength for execution but also a key-person dependency centered on Snow, whose personal
              brand, network, and Pelion relationship are tightly bound to the company. The reuse of the Divvy playbook
              (free software, usage monetization, platform consolidation) is both the bull case and a source of
              pattern-matching risk if the analogy does not hold in commerce.


              Governance detail beyond the founders and board is not publicly disclosed. Pelion Venture Partners, as
              lead investor across the seed and Series A rounds and a participant in Series B, is the most influential
              outside stakeholder, with Smash Capital newly added at Series B. No independent board composition, option
              pool, or formal committee structure has been published, which is typical for a private Series B company
              but represents a diligence gap.
