      - number: '4.3'
        title: Cost Structure, Gross Margin Drivers, and Service-Delivery Costs
        blocks:
          - type: paragraph
            body: >
              Redo's cost structure blends software-company economics with logistics and coverage-claims costs that a
              pure SaaS business does not carry. On the software side, gross margins should be high (hosting, platform,
              and support), consistent with vertical SaaS. But two elements pull the blended margin down and complicate
              the picture: (1) coverage/claims costs — if Redo bears or reinsures package-protection and return-coverage
              claims, the cost of paid claims is a direct offset to protection revenue, making the true gross margin on
              that stream a net-of-claims number rather than a typical 80%+ software margin; and (2) reverse-logistics
              costs from the ReturnBear acquisition, which involve physical returns handling across 100+ countries and
              carry logistics-style, lower-margin economics.


              Operating cost drivers are the ex-Divvy go-to-market team (sales, marketing, and partnerships were the
              visible spend at Divvy and likely are here), R&D for the AI-agent roadmap funded by the Series B, and
              integration costs from two 2026 acquisitions (Malomo and ReturnBear). Headcount is a key unknown: the last
              public figure is 73 employees at the Series A (August 2024), and after two acquisitions and an $81M raise
              the current count is materially higher but unconfirmed. Working capital and any float dynamics from
              collecting shopper fees before paying claims are undisclosed but could be a source of favorable timing
              (fees collected up front, claims paid later) or a liability if claims spike.


              Net: the plausible margin path is a high-margin software core diluted by claims and logistics costs, with
              the blended gross margin unknowable from public data. This is a material revenue-quality question — a
              dollar of shopper-protection "revenue" is not economically equivalent to a dollar of subscription SaaS
              revenue, and the valuation comparison in the valuation chapter must account for that.
