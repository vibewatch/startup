      - number: '2.3'
        title: Buyers, Users, Payers, and Adoption Path
        blocks:
          - type: paragraph
            body: >
              Redo's market has an unusual three-sided structure. The buyer/decision-maker is the merchant brand —
              typically the founder, head of e-commerce, or operations/CX lead at a DTC brand. The users are two groups:
              the brand's CX and operations team (who run returns, exchanges, and support) and the end shopper (who
              initiates returns, tracks orders, and opts into coverage). The payer is split: the brand pays little or
              nothing for the software itself, while the shopper pays for optional return coverage/package protection at
              checkout, which is how Redo earns. This "free to merchant, monetized on the shopper" structure lowers the
              adoption barrier dramatically and is central to Redo's land-and-expand motion.


              Budget ownership varies by brand size. For SMB DTC brands, the founder or a single e-commerce manager owns
              the decision and can adopt in days because there is no software line item to approve. For mid-market and
              larger brands, the decision involves operations, finance (who scrutinize return costs), and sometimes
              legal (who review checkout-fee compliance). The adoption trigger is usually acute pain — rising return
              rates, ballooning support tickets, or a fragmented tool stack — combined with a growth mandate to improve
              retention. Because 82% of consumers cite free returns as a major purchase factor and 71% won't buy again
              after a bad return experience, post-purchase quality is increasingly a growth lever, not just a cost line.


              The path to adoption is: install the free app (often via the Shopify App Store), migrate returns/exchange
              flows, add tracking and protection, then expand into marketing and AI tools. The multi-product attach rate
              — 1,750+ of 4,100+ brands using more than one Redo product — is the clearest evidence this expansion
              motion works. The risk is that the same low-friction dynamics that help Redo also help competitors and
              Shopify's native features.
            claimRefs:
              - CM014
              - CM015
              - CM016
              - CM017
              - CM018
              - CM019
          - type: table
            tableRef: TM003
            claimRefs:
              - CM014
              - CM015
              - CM016
              - CM017
