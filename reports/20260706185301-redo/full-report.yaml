      - number: '8.3'
        title: Financing and Valuation Context
        blocks:
          - type: paragraph
            body: >
              Redo's June 2026 Series B was $81M at a $1.25B post-money valuation, led by Smash Capital (partner Paul
              Szurek) with continued participation from Pelion Venture Partners and Cervin Ventures; the round was
              announced June 23-24, 2026 from Draper, Utah. It followed a ~$24M Series A led by Pelion in August 2024
              and an estimated ~$2M seed around 2022, bringing total capital raised to roughly $107M. The Series B is
              explicitly earmarked for AI investment (agentic shopping, marketing agents, post-purchase concierge) and
              international expansion, with a portion already deployed into the ReturnBear acquisition that extends
              returns reach internationally. This is a capital-efficient profile on its face — a ~$1.25B valuation on
              ~$107M raised implies strong investor conviction — but the efficiency cannot be confirmed without revenue
              figures.


              On entry discipline, the public evidence does not independently support the price; it supports the fact of
              the price. The $1.25B is corroborated across multiple independent outlets (thesaasnews, pulse2, Utah
              Business, GlobeNewswire/Manila Times), but every one of them reports the company-provided valuation rather
              than an independent financial derivation. Implied-multiple math frames the range: at lower-middle-market
              private SaaS multiples of 3-7x ARR the valuation implies roughly $180-415M ARR, while at high-growth or
              vertical-SaaS multiples of 10-15x it implies roughly $83-125M ARR. The plausible center — a fast-growing
              vertical SaaS at ~10-15x — points to an ARR around $85-125M, but this is inference, not disclosure.
              Dilution and preference overhang are standard for the stage, and no public evidence details the
              liquidation preference stack, which is a diligence item because it materially affects downside recovery in
              a bear scenario.
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV018
              - CV019
              - CV029
      - number: '8.4'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >
              The base case assumes Redo's ARR is around $85-125M growing 50-70% with net revenue retention in the
              vertical-SaaS range (~110-115%), and that the shopper-fee model survives regulation via disclosed opt-in
              and revenue diversification. At a ~10-13x forward multiple this roughly supports the current $1.25B mark,
              implying a hold rather than a step-change; returns come from continued growth and modest multiple
              stability, not re-rating. The base case is the most probable but is contingent on financials the public
              cannot see.


              The bull case assumes ARR toward the upper end (~$150M+) growing 80%+ with strong NRR, successful
              integration of Malomo and ReturnBear into a differentiated international platform, and AI modules that
              lift attach and pricing. If multiples hold at 15x+ on a larger, faster base — and if Redo escapes the
              fee-regulation overhang by diversifying revenue — the equity could support $3-5B over a multi-year hold, a
              2.5-4x return on entry. The bear case assumes a regulatory or platform shock: an FTC/state action or
              insurance-law ruling that forces removal or restructuring of shopper-paid protection, Shopify native
              returns compressing the base, or a growth stumble coinciding with multiple compression to ~5x. Any of
              these could take the valuation to $400-700M — a down-round and capital impairment, with the Route
              2021→retrenchment arc as the explicit precedent. Probability signals lean toward the base case, but the
              bear case carries outsized weight because its triggers (regulation, Shopify) are external and partially
              outside management's control, and because the absence of disclosed retention data removes the strongest
              defense against a de-rating narrative.
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
          - type: table
            tableRef: TV003
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV024
      - number: '8.5'
        title: Comparable Set
        blocks:
          - type: paragraph
            body: >
              Redo's comparable set spans post-purchase peers and broader private SaaS multiples. Among direct peers,
              Route is the most instructive: it raised $200M at the same $1.25B valuation in June 2021, then retrenched
              amid the fee-model backlash and a class action over allegedly hidden shipping-protection fees — a
              cautionary rather than confirmatory comparable given Redo's overlapping shopper-fee model. AfterShip
              reached unicorn status with a $66M Series B (Tiger Global, 2021) on an order-tracking-and-returns
              platform; Narvar has raised roughly $64M (Accel, Battery, Salesforce Ventures) and repositioned toward
              agentic post-purchase; Loop Returns, a closer returns-and-exchanges peer, generated an estimated ~$53M
              revenue in 2024 with no public unicorn valuation, implying that a pure-returns peer at Redo's scale would
              carry a materially lower mark than $1.25B. ReturnGO ($11.3M raised) was acquired by Global-e in 2025, and
              Happy Returns was acquired by UPS in 2023 — evidence of an active M&A path for the category.


              On multiples, private SaaS comparables frame the price rather than confirm it: lower-middle-market SaaS
              trades around 3-7x ARR, broader SaaS medians sit near 10-12x, and high-growth or vertical SaaS can command
              12-15x+ when net revenue retention and growth are strong. Public-market anchors for cross-border commerce
              (e.g., Global-e, whose SEC 20-F filings detail cross-border-commerce risk and economics) trade at revenue
              multiples well below peak-2021 levels, reinforcing that Redo's $1.25B rests on a private, growth-priced
              multiple that would need above-median growth and retention to justify. The comparable evidence therefore
              supports a wide valuation band and a clear message: Redo is priced like a high-growth vertical-SaaS
              winner, and the comparables reward or punish that framing entirely on the strength of the undisclosed ARR
              and NRR.
            claimRefs:
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
          - type: table
            tableRef: TV004
            claimRefs:
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
      - number: '8.6'
        title: Exit Readiness, Kill Triggers, and Diligence Asks
        blocks:
          - type: paragraph
            body: >
              Exit readiness is reasonable for the category but unproven at scale. The post-purchase space has a
              demonstrated M&A path (Happy Returns→UPS, ReturnGO→Global-e) and Redo itself is an active acquirer, which
              signals both strategic value and a possible roll-up exit; an IPO would require the revenue scale,
              retention, and profitability profile that Redo does not disclose. The most likely exit paths are a
              strategic acquisition (by a commerce platform, logistics carrier, or marketing-cloud vendor seeking the
              post-purchase layer) or continued private compounding toward an eventual IPO if ARR and NRR support it. In
              all paths, the value realized turns on the same undisclosed fundamentals.


              Thesis-break (kill) triggers are: (1) a binding FTC/state action or insurance-law ruling that forces
              removal or licensing of shopper-paid protection; (2) Shopify launching native returns/protection that
              materially undercuts Redo's core; (3) evidence of stalled net revenue retention or a down-round; (4) a
              failed acquisition integration or a key-person departure (CEO Snow or the core ex-Divvy cohort). Final
              diligence asks, in priority order: audited ARR, growth, gross margin, and cohort net/gross revenue
              retention; the share of revenue derived from shopper-paid protection versus diversified modules; a legal
              opinion on package protection's regulatory status across key jurisdictions; the Shopify
              partner-relationship terms and any policy exposure; the liquidation-preference and cap-table structure;
              and the security/privacy program (SOC 2, data-processing map). Obtaining these would move the
              recommendation decisively toward buy or avoid; without them, research-more at a stretched stance is the
              disciplined position.
            claimRefs:
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
          - type: table
            tableRef: TV005
            claimRefs:
              - CV036
              - CV037
              - CV038
          - type: table
            tableRef: TV006
            claimRefs:
              - CV039
              - CV040
      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Price is a fact; support for the price is not
            body: >-
              The $1.25B Series B is corroborated across multiple outlets, but every source reports the company-provided
              valuation — no independent financial derivation exists because ARR, growth, and retention are undisclosed.
            calloutType: insight
            claimRefs:
              - CV015
              - CV016
              - CV028
          - type: callout
            title: Route is the cautionary comparable
            body: >-
              Route raised $200M at the identical $1.25B valuation in 2021 on an overlapping shopper-fee model, then
              retrenched amid backlash and litigation — the clearest template for how Redo could de-rate.
            calloutType: insight
            claimRefs:
              - CV030
              - CV031
          - type: callout
            title: Bull case is real if retention is strong
            body: >-
              Owned international logistics, multi-module stickiness, and an AI roadmap could support $3-5B over a
              multi-year hold — but only if undisclosed ARR growth and NRR are in the top tier and fee regulation is
              navigated.
            calloutType: insight
            claimRefs:
              - CV022
              - CV026
              - CV033
          - type: callout
            title: Disclosure would resolve the call
            body: >-
              Audited ARR/retention and the fee-revenue mix would move the recommendation decisively toward buy or
              avoid; absent them, research-more at a stretched stance is the disciplined position.
            calloutType: insight
            claimRefs:
              - CV010
              - CV039
              - CV040
