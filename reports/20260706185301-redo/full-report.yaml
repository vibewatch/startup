  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      A likelihood-by-impact heatmap of Redo's principal risks, with regulatory fee exposure, Shopify dependence, and
      valuation clustering in the high-impact band.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual exposure
      rows:
        - label: Shopper-fee regulation
          values:
            - Medium-High
            - High
            - Partial
            - High
        - label: Shopify platform dependence / native returns
          values:
            - Medium
            - High
            - Partial
            - High
        - label: Valuation / down-round
          values:
