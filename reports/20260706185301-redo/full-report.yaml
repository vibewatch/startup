      - number: '3.2'
        title: 'Competitor Profiles: Scale, Funding, Target Customer, Product Scope, and Direction'
        blocks:
          - type: paragraph
            body: >
              Loop Returns is Redo's most-cited direct competitor. Founded in 2016 and Shopify-focused, Loop reported
              roughly $53.3 million in revenue in 2024 (up from about $31 million in 2023) per third-party tracker
              estimates, and is backed by investors including CRV and FirstMark; reported total funding varies widely
              across trackers (from about $10.5 million on some profiles to a $65 million 2021 Series B reported by CB
              Insights), an unresolved data conflict noted in this chapter's gaps. Loop's positioning is a
              best-in-class, enterprise-grade returns-and-exchanges engine that maximizes exchange-over-refund retention
              — deep but comparatively narrow versus Redo's multi-module suite.


              AfterShip and Narvar are the broad post-purchase suites. AfterShip (Hong Kong) raised a $66 million Series
              B led by Tiger Global in April 2021 at a reported unicorn valuation and runs shipment tracking, returns,
              and delivery/EDD prediction across many carriers globally, selling primarily on SaaS subscriptions. Narvar
              (San Francisco), backed by Accel, Battery Ventures, and Salesforce Ventures among others (roughly $64
              million raised in disclosed rounds), targets large enterprise retailers with tracking, returns, and
              concierge experiences. Both compete with Redo on breadth but monetize through merchant subscriptions
              rather than Redo's free-to-merchant, shopper-paid model.


              The package-protection cohort is where Redo's revenue model is most directly mirrored. Route raised a $200
              million Series B in June 2021 at a $1.25 billion valuation — coincidentally the same headline valuation
              Redo now carries — built on shopper-paid package protection and tracking, but subsequently retrenched and
              became a defendant in class-action litigation over allegedly hidden "shipping protection" fees. Corso and
              Seel offer similar checkout-based protection/returns-coverage products. ReturnGO ($11.3 million raised;
              acquired by Global-e in August 2025; 2,500+ Shopify stores) and reverse-logistics network Happy Returns
              (acquired by UPS in 2023) round out the field. Against all of these, Redo's distinguishing claims are
              4,100+ brands, 1,750+ using multiple modules, and the acquisitions of Malomo (branded tracking) and
              ReturnBear (international returns) to widen the bundle.
