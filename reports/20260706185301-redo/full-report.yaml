  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Pricing Model, and Revenue Mix
        blocks:
          - type: paragraph
            body: >
              Redo's defining financial characteristic is that its software is free to the merchant; the company earns
              money on the transaction usage that flows through the platform rather than on subscription seats. The
              primary revenue stream is shopper-paid coverage — return coverage and package/shipping protection that a
              consumer opts into (or is presented with) at checkout — of which Redo retains a take. Secondary streams
              include paid product usage across the expanding module set (order tracking via the acquired Malomo,
              email/SMS marketing, warranties, and emerging AI agents) and, following the ReturnBear acquisition,
              international returns and reverse-logistics services. This mirrors the model CEO Sterling Snow ran at
              Divvy: free software that fixes an expensive, painful problem, monetized on the usage it unlocks.


              This structure has important accounting and quality implications. Revenue tied to shopper-paid protection
              resembles an insurance/warranty take-rate more than classic SaaS subscription revenue, which raises
              questions about recognition (gross vs. net of claims paid), the durability of the fee if regulation forces
              clearer disclosure or opt-in defaults, and how much of "revenue" is pass-through versus retained margin.
              Because Redo does not publish a revenue-mix breakdown, the split between protection take, paid modules,
              and logistics is unknown. What is disclosable is directional: the company reports 4,100+ brands and 1,750+
              merchants using multiple products, implying a meaningful and growing cross-sell/attach dynamic that should
              lift revenue per merchant over time even though absolute figures are withheld.


              For diligence, the model's strength is alignment (revenue grows with GMV/order volume and merchant
              success) and low adoption friction (free install); the weakness is that a usage/take-rate model on a
              regulated fee is more exposed to policy and platform changes than a contracted subscription, and the
              absence of any disclosed revenue mix makes revenue quality unverifiable from public data.
            claimRefs:
