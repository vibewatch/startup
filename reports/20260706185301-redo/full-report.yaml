      - number: '2.2'
        title: 'Market Sizing: Multiple Lenses'
        blocks:
          - type: paragraph
            body: >
              No single number captures Redo's opportunity, so we triangulate across four lenses. Lens one, the
              narrowest and most directly comparable, is returns-management software: estimated at roughly $1.77–1.93
              billion in 2026 and forecast to reach about $3.5–4.25 billion by the mid-2030s at an ~8.5–9.2% CAGR. A
              broader vendor estimate puts returns-management software at $3.5 billion in 2024 growing to $7.1 billion
              by 2033. This is Redo's core category, and it is a small, competitive software pool.


              Lens two broadens to all post-purchase / reverse-logistics automation software — order tracking,
              protection, claims, analytics — estimated near $9.8 billion in 2025 growing ~9.5% annually. This better
              matches Redo's expanded "post-purchase operating system" scope after the Malomo and ReturnBear
              acquisitions. Lens three is the value-at-stake pool that justifies the software: US retailers processed an
              estimated $849.9 billion of returns in 2025 (about 15.8% of sales; ~19.3% online), down from $890 billion
              in 2024 — the pain Redo monetizes. Lens four is the demand-side installed base: the global DTC e-commerce
              market is projected around $319.6 billion in 2026 (7.8% CAGR), with 110,000+ US DTC brands and Shopify
              powering roughly 5.6 million stores and $378B+ in 2025 GMV.


              Synthesizing, a defensible TAM for Redo's full post-purchase software vision is in the high-single-digit
              to low-double-digit billions and compounding at ~9–10%; the serviceable market (SAM) is the subset of
              DTC/SMB-to-mid-market brands on Shopify-class platforms willing to pay for a bundled post-purchase suite;
              and Redo's current obtained market (SOM) is its 4,100+ brands. The gap between a ~$2–10B software TAM and
              a $1.25B valuation is the central tension the valuation chapter must resolve.
            claimRefs:
              - CM006
              - CM007
              - CM008
