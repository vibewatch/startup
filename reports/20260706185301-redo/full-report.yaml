      - number: '5.4'
        title: Deployment, Integration, Reliability, Support, and Roadmap
        blocks:
          - type: paragraph
            body: >
              Deployment is low-friction by design: a merchant installs Redo from the Shopify App Store at no cost,
              connects its store and relevant tools, and configures policies and workflows. Because the software is free
              and Shopify-native, time-to-value is short relative to enterprise post-purchase suites that require sales
              cycles and custom integration. Integration with carriers, 3PLs, and martech tools is handled through
              Redo's published connector set, and support is provided by Redo Tech, Inc., with an extensive help center
              covering returns setup, analytics, and optimization (dozens of articles per module). The Shopify listing's
              5.0 rating across hundreds of reviews is the strongest public reliability/satisfaction signal, though it
              reflects merchant sentiment rather than measured uptime.


              Reliability and support scale with the module count and the two 2026 acquisitions, which introduce
              integration risk: merging Malomo's tracking stack and ReturnBear's logistics operations into a unified
              platform is non-trivial and is an execution watch-item. The company has partnered with ReturnBear for over
              a year before acquiring it, which reduces integration surprise, and Malomo's team joined intact under its
              founder — both mitigants.


              The roadmap, funded by the June 2026 Series B, is explicitly AI-and-international. Stated priorities are
              AI-driven commerce tooling — agentic shopping experiences, a marketing agent for personalized email/SMS,
              and a post-purchase concierge to lift lifetime value — and international expansion built on ReturnBear's
              cross-border network. This roadmap aligns with the broader industry shift toward agentic commerce, but
              much of the AI-agent capability is forward-looking (a use-of-proceeds commitment) rather than fully
              shipped, so its competitive weight is still to be proven. The development-stage picture is therefore a
              mature, high-satisfaction core (returns, tracking, protection) with a rapidly expanding, partly-roadmap AI
              and international frontier.
