      - number: '4.2'
        title: GTM Motion and Sales-Efficiency Proxies
        blocks:
          - type: paragraph
            body: >
              Redo's go-to-market is a product-led, free-to-install motion distributed primarily through the Shopify App
              Store and amplified by a heavy-hitting ex-Divvy sales and marketing team and customer-angel references
              (Made by Mary, Mission Belt, Enso Rings). Because the merchant pays nothing to start, the classic
              paid-acquisition CAC/payback framing is partly replaced by an activation-and-attach motion: the cost of
              acquiring a merchant is lower, but the company must then drive shopper-side attach rates and multi-module
              adoption to convert a free install into revenue. The 1,750+ multi-product merchants out of 4,100+ brands
              is the best public proxy for expansion efficiency — roughly 43% of brands use more than one module — which
              is a healthy attach signal if sustained.


              No CAC, payback period, sales cycle, or magic-number figure is disclosed, so sales efficiency can only be
              benchmarked. In 2026, SaaS medians cited by benchmark aggregators put LTV/CAC around 2.1–3.6:1 (with 3:1
              the traditional healthy target), CAC payback around 15–20 months (elite under 12), and net revenue
              retention near 101–103% for all SaaS but ~112% for vertical SaaS. A usage-monetized, free-to-merchant
              model with strong multi-module attach could plausibly show above-median NRR and shorter effective payback
              than a seat-based peer, but this is an inference from the model, not a measured Redo metric. The relevant
              risk is that if shopper attach rates on protection compress (due to regulation, opt-in defaults, or
              shopper price sensitivity), the entire revenue-per-merchant assumption weakens even as merchant counts
              keep rising.


              Channel economics also concentrate distribution risk in Shopify: the App Store is the acquisition funnel,
              and Shopify governs the checkout surface where the monetizing fee is presented. This is efficient today
              but means Redo's unit economics are partly a function of a platform it does not control.
