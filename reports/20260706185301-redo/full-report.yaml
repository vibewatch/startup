        title: Funding History and Valuation
        blocks:
          - type: paragraph
            body: >
              Redo has raised approximately $107 million across three disclosed rounds since 2022. Databases indicate a
              roughly $2 million seed round in 2022 with early backing from Pelion Venture Partners, Signal Peak
              Ventures, and angel Jack Boren, though seed-round figures are not company-confirmed and should be treated
              as estimates.


              The Series A closed on August 20, 2024, raising $24 million led by Pelion Venture Partners. Institutional
              participants included EPIC Ventures, Kickstart Fund, Tandem Venture Partners, Cervin Ventures, Peterson
              Ventures, Signal Peak Ventures, and AGLAÉ VENTURES (the venture arm of LVMH). A notable feature was
              participation from Redo's own customers as angels — Mary and Taylor Moody (Made by Mary), Connor MacArthur
              (Mission Belt), and Aaron Dalley (Enso Rings) — alongside a roster of prominent Utah operators such as
              Blake Murray, Alex Bean, Adam Edmunds, Jeremy Andrus, and Jeron Paul. At the Series A the company reported
              roughly 1,500 brands and 73 employees.


              The Series B was announced June 24, 2026: $81 million at a reported $1.25 billion post-money valuation —
              unicorn status — led by Smash Capital (Paul Szurek), with existing investors Pelion Venture Partners and
              Cervin Ventures participating. The company stated it had already deployed part of the capital into the
              acquisition of ReturnBear, an international returns and reverse-logistics provider operating across 100+
              countries, following its January 2026 acquisition of branded order-tracking platform Malomo. The step-up
              from a $24M Series A in August 2024 to a $1.25B valuation less than two years later implies an aggressive
              re-rating that later chapters test against revenue and comparable multiples. Exact revenue, ARR, and
              precise total-raised figures are not company-disclosed.
