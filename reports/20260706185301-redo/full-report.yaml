              compress the addressable base. Partner/integration dependence is a secondary vector — customers rely on
              Redo's connectors to Klaviyo, Gorgias, Recharge, ShipBob, and carriers, so the value proposition assumes
              those integrations persist. Finally, the shopper-paid model concentrates regulatory exposure (FTC junk-fee
              rule, insurance-law scrutiny) on the exact mechanism that monetizes the customer base, tying revenue
