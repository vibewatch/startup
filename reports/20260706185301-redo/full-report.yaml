      - CE022
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Redo's customer journey runs from free Shopify-App-Store discovery through returns-first activation, multi-module
      expansion, and long-tenure retention, with a parallel shopper journey through the returns portal and paid
      protection.
    data:
      nodes:
        - id: discovery
          label: Discovery via Shopify App Store
          detail: >-
            A DTC merchant finds Redo as the #1-rated returns app (5.0, 669 reviews) and installs it for free with no
            upfront commitment.
        - id: activation
          label: Returns-first activation
          detail: >-
            The merchant configures the branded returns/exchange portal — the most common entry module — and shoppers
            begin initiating returns and exchanges.
        - id: monetization
          label: Shopper-paid protection + usage fees
          detail: >-
            Shoppers opt into package protection at checkout (shopper-paid take-rate); the merchant begins paying
            usage-based fees on adopted modules.
        - id: expansion
          label: Multi-module expansion
          detail: >-
            The merchant adds order tracking (Malomo), email/SMS marketing, warranties, chargebacks, and AI support —
            ~1,750 brands (~43%) use more than one product.
        - id: support
          label: Human + AI support
          detail: >-
            Merchants cite responsive human reps (named in reviews) alongside AI support agents; AI-to-human handoff is
            a live friction point.
        - id: retention
          label: Long-tenure retention
          detail: >-
            Engaged merchants stay two-to-three years (Goldie Swimwear ~3y, Violate The Dress Code 2y), describing Redo
            as an easy vendor relationship.
    approximationNotes: >-
      Stages are inferred from Redo's customer/marketing pages and dated Shopify reviews rather than a published Redo
      customer-lifecycle diagram.
    claimRefs:
      - CU001
      - CU007
      - CU010
      - CU013
      - CU021
      - CU022
  - id: FU002
    title: Adoption / expansion funnel
    type: funnel
    layout: standard
    summary: >-
      The base narrows from the full installed merchant base to multi-module adopters, long-tenure references, and named
      independently visible production customers.
    data:
      items:
        - label: Brands served (marketing)
          value: 4500
        - label: Brands served (press-reported at Series B)
          value: 4100
        - label: Multi-module brands (~43%)
          value: 1750
        - label: Shopify App Store reviews (named, dated)
          value: 669
        - label: Independently named production reference customers cited
          value: 5
    approximationNotes: >-
      This funnel layers evidence density (installed base -> multi-module -> reviewed -> independently named
      references), not an internal sales-conversion pipeline. Marketing counts are unaudited.
    claimRefs:
      - CU007
      - CU008
      - CU009
      - CU010
      - CU014
