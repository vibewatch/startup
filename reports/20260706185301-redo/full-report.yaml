  - id: FU004
    title: Retention / satisfaction cohort
    type: cohort
    layout: wide
    summary: >-
      An evidence-depth cohort scoring how much reviewed evidence supports initial satisfaction, expansion, and long-run
      retention across merchant tenure bands and the shopper payer side.
    data:
