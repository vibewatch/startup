      - number: '5.3'
        title: Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >
              Redo's operating model is a layered platform sitting on top of commerce platforms rather than replacing
              them. At the top is the shopper/merchant experience layer (branded returns portal, tracking pages,
              protection widget, warranty flows, marketing campaigns). Beneath it is the application/module layer
              described above. An AI/intelligence layer runs across the modules: AI agents for support resolution and
              sales, a marketing agent for personalized email/SMS, a post-purchase concierge, agentic-shopping/catalog
              features, plus return-reason analytics, fraud detection, and personalized exchange-offer logic. A
              data/integration layer connects Redo to the commerce and martech ecosystem, and a logistics layer — new
              with ReturnBear — handles physical reverse logistics through local return hubs.


              Integration breadth is a defining architectural feature. Redo publicly lists integrations spanning
              platforms (Shopify, Shop App, BigCommerce, Salesforce Commerce Cloud, CommentSold), support (Gorgias),
              marketing (Klaviyo, Attentive, Postscript, plus Google/Meta/TikTok ad channels), operations and 3PLs
              (Recharge, Brightpearl, Deposco, Flexport, NetSuite, ShipBob, ShipHero, fulfil.io, Two Boxes, Inmar),
              cross-border (Global-e), and carriers (FedEx, UPS, USPS, DHL, Canada Post, AusPost). This positions Redo
              as a hub in the post-purchase stack. Architecturally, the deepest dependency is Shopify: Redo is
              distributed through the Shopify App Store, operates within Shopify's checkout and app framework, and
              inherits Shopify's platform constraints (including checkout-fee presentation rules).


              The operating model blends software and physical operations. The software side is standard multi-tenant
              SaaS economics (high margin, cloud-hosted, API-integrated). The ReturnBear side adds a physical operation
              — return hubs, consolidation, carrier relationships, and local refund verification across four countries —
              which is operationally heavier and lower-margin but hard for a pure-software competitor to replicate. This
              hybrid architecture is the core of Redo's differentiation and also its main added operational complexity
              and integration risk.
