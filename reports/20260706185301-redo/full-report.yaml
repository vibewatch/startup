      - number: '6.4'
        title: Retention, Durability, and Satisfaction
        blocks:
          - type: paragraph
            body: >
              Redo discloses no formal retention metrics — no net revenue retention (NRR), gross revenue retention
              (GRR), logo churn, renewal rate, or contract length is public. In their absence, durability must be
              inferred from proxies. The strongest positive proxies are tenure and satisfaction: multiple reviewers
              report two-to-three-year relationships, the Shopify listing holds a 5.0 rating across 669 reviews with 98%
              five-star and only 1% one-star, and reviewers repeatedly cite responsive human support (naming individual
              reps) as the reason they stay. The 43% multi-module rate is itself a retention signal, since customers
              using more products are structurally stickier. These proxies suggest high gross retention among engaged
              merchants, consistent with the "easiest vendor relationship" language in reviews.


              The countervailing signals are real but modest. Even five-star reviewers note "occasional updates/bugs
              that are frustrating" and friction reaching a human rather than the AI support agent, indicating that
              reliability and AI-handoff quality are live satisfaction issues as the platform expands quickly through
              acquisition. More materially, the shopper-paid protection model exposes the end-user side of the customer
              relationship to dissatisfaction that does not show up in merchant reviews: consumer-facing scrutiny of
              shipping-protection "junk fees," state insurance-law questions, and a class action against a comparable
              vendor (Route) over allegedly hidden fees all bear on shopper trust, which ultimately feeds merchant churn
              if shoppers complain. Because retention is undisclosed and the payer is not the reviewer, satisfaction
              evidence is asymmetric: strong on the merchant side, unmeasured and contested on the shopper side.
