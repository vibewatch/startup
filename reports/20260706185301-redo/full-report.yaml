  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Overview
        blocks:
          - type: paragraph
            body: >
              Redo's risk profile is dominated by two structural exposures that compound each other: a shopper-paid fee
              model that sits squarely in the path of tightening consumer-fee regulation, and near-total dependence on a
              single commerce platform, Shopify, for distribution, addressable market, and even the rules governing how
              its fees are presented. Ranked by residual exposure, the highest-severity risks are (1) regulatory/legal
              action against shopper-paid package protection (FTC junk-fee rule, state insurance law, class-action
              precedent), (2) Shopify platform dependence and the prospect of Shopify-native returns/protection
              compressing the addressable base, and (3) valuation/down-round risk given undisclosed ARR against a $1.25B
              mark set in a market where SaaS multiples have compressed from their 2021 peaks.


              Mid-tier risks include integration and operational execution across two 2026 acquisitions (Malomo and the
              physical ReturnBear reverse-logistics network), product reliability and AI-support quality issues surfaced
              even in five-star reviews, and an undocumented public security/privacy posture at a unicorn valuation.
              Lower-tier but monitorable risks include key-person concentration around the ex-Divvy leadership team,
              carrier and integration-partner dependence, and the general opacity of a private company that discloses no
              revenue, retention, or unit-economics data. The investment implication is that Redo's upside
              (breadth-plus-consolidation, owned international logistics) is real but its durability is gated by
              regulatory and platform variables largely outside its control, so the thesis is more sensitive to external
              policy shifts than to internal execution alone.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
