      - number: '4.4'
        title: Public Traction Versus Private-Metric Gaps
        blocks:
          - type: paragraph
            body: >
              The publicly supportable traction metrics are: a $1.25 billion post-money valuation (June 2026), an $81
              million most-recent raise, approximately $107 million total raised, 4,100+ brands on the platform, 1,750+
              multi-product merchants, and two 2026 acquisitions (Malomo, ReturnBear). Growth in brand count is strong —
              roughly 1,500 brands at the Series A (August 2024) to 4,100+ by mid-2026, implying the platform nearly
              tripled its merchant base in under two years.


              The private-metric gaps are severe and central to any investment decision. Redo discloses no revenue, ARR,
              GMV processed, take rate, gross margin, net revenue retention, CAC/payback, burn, cash on hand, or runway.
              As a triangulation, the closest public comparable is Loop Returns at roughly $53.3 million revenue in 2024
              for a returns specialist; if Redo's broader bundle and larger brand base put its revenue above Loop's, a
              rough ARR band can be inferred from the valuation and 2026 multiples (see the estimate-range figure), but
              every point in that band is a derived estimate, not a disclosure. The company's own headline metrics are
              activity metrics (brands, multi-product merchants) rather than financial ones, which is a deliberate
              disclosure choice common to private companies but a genuine limitation here given the unicorn valuation.


              The one adverse, financially material public thread is regulatory: the FTC's 2025 junk-fee rule requiring
              clear disclosure of mandatory fees, class-action litigation against peer Route over allegedly hidden
              shipping-protection fees, and state insurance-law questions about package protection all bear directly on
              the revenue stream that most plausibly drives Redo's economics. These do not prove a problem at Redo, but
              they define the downside scenario for its revenue base.
