            - Low-Medium
    approximationNotes: >-
      Bands are analyst judgments derived from the cited regulatory, platform, and financial sources; Redo publishes no
      risk register, so ratings are external assessments.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR006
      - CR013
      - CR020
      - CR024
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      How external triggers (regulation, Shopify policy, multiple compression) transmit through Redo's shopper-fee and
      single-platform structure into revenue and valuation outcomes.
    data:
      nodes:
        - id: ftc-rule
          label: FTC junk-fee rule / state insurance law
          detail: Regulatory action targeting shopper-paid protection disclosure or classification.
        - id: litigation
          label: Fee-model litigation (Route precedent)
          detail: Class-action theory over allegedly hidden protection fees, applicable to any shopper-paid presentation.
        - id: shopify-policy
          label: Shopify policy / native returns
          detail: Platform fee-presentation rules and native self-serve returns feature.
        - id: fee-revenue
          label: Shopper-paid fee revenue
          detail: The take-rate on package protection that monetizes much of the base.
        - id: addressable-base
          label: Shopify-based addressable base
          detail: Nearly all customers and distribution depend on Shopify.
        - id: multiples
          label: SaaS multiple compression
          detail: Private SaaS multiples down from 2021 peaks (5-15x).
        - id: revenue-durability
          label: Revenue durability
          detail: Stability of monetization and merchant retention.
        - id: valuation
          label: $1.25B valuation / next round
          detail: Down-round risk if revenue or multiples weaken.
      edges:
        - from: ftc-rule
          to: fee-revenue
        - from: litigation
          to: fee-revenue
        - from: shopify-policy
          to: fee-revenue
        - from: shopify-policy
          to: addressable-base
        - from: fee-revenue
          to: revenue-durability
        - from: addressable-base
          to: revenue-durability
        - from: revenue-durability
          to: valuation
        - from: multiples
          to: valuation
    approximationNotes: >-
      A causal transmission map inferred from the regulatory, platform, and valuation evidence; arrows denote direction
      of risk propagation, not quantified elasticities.
    claimRefs:
      - CR006
      - CR007
      - CR021
      - CR028
      - CR029
      - CR031
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      Redo's external dependencies, with Shopify as the concentrated node governing distribution, monetization rules,
      and competition.
    data:
      nodes:
        - id: redo
          label: Redo platform
          detail: The post-purchase platform and its modules.
        - id: shopify
          label: Shopify
          detail: Distribution (App Store), fee-presentation rules, and native-returns competition.
        - id: carriers
          label: Carriers
          detail: FedEx, UPS, USPS, DHL, Canada Post, Australia Post for the ReturnBear network.
        - id: integrations
          label: Integration partners
          detail: Klaviyo, Gorgias, Recharge, ShipBob APIs underpinning consolidation.
        - id: capital
          label: Capital providers
          detail: Smash Capital, Pelion, Cervin (Series B).
        - id: regulators
          label: Regulators
          detail: FTC and state insurance/privacy regulators governing the fee model and data.
        - id: acquisitions
          label: Acquired assets (Malomo, ReturnBear)
          detail: Order tracking and physical reverse-logistics network under integration.
      edges:
        - from: redo
          to: shopify
        - from: redo
          to: carriers
        - from: redo
          to: integrations
        - from: redo
          to: capital
        - from: redo
          to: regulators
        - from: redo
          to: acquisitions
        - from: acquisitions
          to: carriers
        - from: shopify
          to: regulators
    approximationNotes: >-
      Dependency edges denote reliance direction; Shopify and regulators are the highest-leverage nodes because they
      govern both distribution and monetization outside Redo's control.
    claimRefs:
      - CR020
      - CR021
      - CR022
      - CR023
      - CR024
      - CR034
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation flows from strong qualitative markers into the disclosure gap and regulatory/platform risks,
      resolving to research-more at a stretched stance pending financials.
    data:
      nodes:
        - id: markers
          label: Positive markers
          detail: Consolidating product, 4,100+ brands, ~43% multi-module, owned logistics, proven team, large market.
        - id: price
          label: $1.25B Series B price
          detail: Unicorn mark on undisclosed ARR/growth/retention.
        - id: gap
          label: Disclosure gap
          detail: No revenue, growth, retention, or unit economics — price not independently verifiable.
        - id: risks
          label: Regulatory + platform risk
          detail: Shopper-fee regulation (FTC/insurance/Route precedent) and Shopify dependence.
        - id: rec
          label: research-more / stretched
          detail: Condition any investment on obtaining financials rather than underwrite the price now.
      edges:
        - from: markers
          to: price
        - from: price
          to: gap
        - from: gap
          to: rec
        - from: risks
          to: rec
    approximationNotes: A qualitative decision flow; arrows denote reasoning dependency, not weighted scores.
    claimRefs:
      - CV001
      - CV008
      - CV009
      - CV010
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      Implied valuation at a fixed illustrative ARR under different forward revenue multiples, showing how sensitive the
      $1.25B mark is to multiple assumptions.
    data:
      items:
        - label: 5x (bear / compressed)
          value: 500
        - label: 8x (lower-mid)
          value: 800
        - label: 10x (median)
          value: 1000
        - label: 12x (base)
          value: 1200
        - label: 15x (high-growth)
          value: 1500
        - label: 18x (bull premium)
          value: 1800
    approximationNotes: >-
      Illustrative: values are implied valuation in $M at a fixed ~$100M ARR anchor across multiples; actual ARR is
      undisclosed, so this shows multiple sensitivity, not a point estimate.
    claimRefs:
      - CV018
      - CV019
      - CV029
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: Bull/base/bear valuation range for Redo relative to the current $1.25B mark.
    data:
      items:
        - label: Bear (regulatory/Shopify shock, ~5x)
          low: 400
          high: 700
          value: 550
          unit: $M
          detail: Down-round and capital impairment; Route 2021->retrenchment precedent.
        - label: Base (ARR ~$85-125M, ~10-13x)
          low: 1000
          high: 1500
          value: 1250
          unit: $M
          detail: Roughly holds the current mark if retention and growth are strong.
        - label: Bull (ARR ~$150M+, 15x+)
          low: 3000
          high: 5000
          value: 4000
          unit: $M
          detail: 2.5-4x on entry if fee regulation is escaped and international scales.
    approximationNotes: >-
      Ranges are scenario inferences from implied-multiple math against undisclosed ARR; not a discounted-cash-flow
      output.
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: wide
    summary: The headline investment KPIs and the disclosure status of each — highlighting how many key inputs are undisclosed.
    data:
      items:
        - label: Valuation (Series B)
          value: $1.25B
          detail: Post-money, June 2026; corroborated across outlets.
        - label: Total raised
          value: ~$107M
          detail: Seed ~$2M + Series A ~$24M + Series B $81M.
        - label: Brands served
          value: 4,100+
          detail: Marketing cites 4,500+; ~1,750 multi-module.
        - label: Implied ARR
          value: ~$83-250M
          detail: Inferred from 5-15x multiples; not disclosed.
        - label: ARR / growth / NRR
          value: Undisclosed
          detail: The decisive valuation inputs are not public.
        - label: Recommendation
          value: research-more
          detail: Medium confidence; stretched stance; high risk.
    approximationNotes: >-
      KPI values mix disclosed facts (valuation, raised, brands) with inferred/undisclosed items explicitly labeled to
      avoid overstating certainty.
    claimRefs:
      - CV014
      - CV015
      - CV018
      - CV028
