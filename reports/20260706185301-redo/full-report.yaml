      - number: '2.4'
        title: Growth Drivers, Constraints, and Sizing Gaps
        blocks:
          - type: paragraph
            body: >
              Several tailwinds support Redo. E-commerce and DTC continue to grow (global DTC ~7.8% CAGR; Shopify GMV up
              ~35% YoY in Q1 2026), mechanically expanding order — and therefore return — volume. Return rates remain
              structurally high (online ~19.3%), and the cost of processing a single return ($10–45) makes returns
              automation and exchange-conversion directly ROI-positive. The DTC slowdown itself is a driver for
              post-purchase software: as customer-acquisition costs rose ~222% over eight years and second-purchase
              retention sits near 28%, brands must extract more value from existing customers, exactly what
              post-purchase retention tooling promises. Consolidation of point solutions and the AI wave (agentic
              shopping, automated support) further favor an integrated platform.


              The constraints are equally real. The most important is platform risk: Shopify has invested heavily in
              native returns and exchanges and in the Shop app's post-purchase engagement, which can commoditize Redo's
              entry product for smaller brands. Second is regulatory: because Redo monetizes shopper-paid coverage, the
              2025 FTC "junk fee" rule, state insurance-law scrutiny of package-protection products, and peer class
              actions raise compliance and take-rate risk. Third is the DTC slowdown's double edge — a cooling market
              intensifies competition for wallet share and can slow new-merchant formation. Fourth are switching costs
              and incumbent entrenchment (Loop, AfterShip, Narvar, Route) that make displacement in mid-market slower.


              Sizing gaps and contradictions are preserved deliberately. Analyst estimates for "returns management
              software" vs. "reverse logistics automation software" differ by ~5x depending on scope, and none isolate
              the exact bundle Redo sells; there is no independent third-party estimate of the post-purchase-suite SAM
              for Shopify-class DTC brands specifically. The value-at-stake pool ($850B returns) is not Redo's revenue
              pool — it is the problem size, and conflating the two would overstate the opportunity. These gaps make the
              market real and growing but harder to size precisely than the headline returns figure suggests.
            claimRefs:
              - CM020
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
              - CM027
              - CM028
          - type: table
            tableRef: TM004
            claimRefs:
