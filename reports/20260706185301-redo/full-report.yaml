  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Peers, Incumbents, Adjacents, Substitutes, and Entrants'
        blocks:
          - type: paragraph
            body: >
              Redo operates in the post-purchase software market, where the competitive field splits into several
              layers. Its closest direct peers are returns-and-exchanges specialists: Loop Returns (Columbus, Ohio;
              founded 2016; the enterprise Shopify returns leader) and ReturnGO (Herzliya, Israel; acquired by
              cross-border commerce vendor Global-e in 2025). One layer out are broad post-purchase suites that, like
              Redo, aim to own the whole journey: AfterShip (Hong Kong; order tracking plus returns and shipping,
              reportedly a unicorn after its 2021 Tiger Global round) and Narvar (San Francisco; an enterprise
              post-purchase platform used by large retailers). A third layer is the package-protection /
              shipping-protection cohort whose shopper-paid business model most resembles Redo's monetization: Route,
              Corso, and Seel.


              The most consequential competitor is not a startup at all but the platform Redo sits on. Shopify has been
              steadily building native returns, exchanges, and order-tracking features and controls the checkout surface
              through which Redo's shopper-paid coverage is sold — the same surface on which Shopify banned pre-checked
              "shipping protection" boxes in early 2025. Adjacent entrants include reverse-logistics networks such as
              Happy Returns (acquired by UPS in 2023) and carriers moving up the stack, plus branded-tracking tools like
              Malomo (now owned by Redo) and Wonderment.


              Substitutes and status-quo options remain material: many small and mid-sized brands still run returns
              through email, spreadsheets, generic help-desk macros, or a 3PL's manual process, and forgo package
              protection entirely. Likely future entrants include Shopify deepening native post-purchase features,
              Global-e leveraging ReturnGO for cross-border returns, and payment/checkout players (PayPal previously
              owned Happy Returns) re-entering the category. Redo's strategy is explicitly consolidation — collapsing
              this fragmented stack into one free-to-merchant platform — which is both its differentiation and the
              reason it competes with everyone in the landscape at once.
