      - number: '6.5'
        title: Expansion, Concentration, and Channel Dependence
        blocks:
          - type: paragraph
            body: >
              Redo's expansion motion is land-and-expand within the account (add modules) plus market extension (add
              geographies via ReturnBear and add capabilities via Malomo). The ~1,750 multi-module brands demonstrate
              the intra-account motion is working; the international and acquired surfaces are the forward vectors. On
              concentration, Redo discloses no single-customer or top-10 revenue concentration figure, and its base of
              4,100+ small-to-mid brands implies low individual-account concentration — no single DTC brand is likely to
              be a material share of revenue. That diffuse base is a durability strength relative to
              enterprise-concentrated peers.


              The dominant concentration risk is channel and platform dependence, not customer dependence. Nearly all of
              Redo's customers are Shopify merchants, so Redo's addressable base, distribution (the Shopify App Store),
              and even fee-presentation rules (Shopify's 2025 ban on pre-checked protection boxes) are governed by a
              single platform. This creates procurement and policy friction outside Redo's control: a Shopify policy
