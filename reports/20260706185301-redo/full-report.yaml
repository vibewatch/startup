      - number: '3.4'
        title: Switching Costs, Lock-in, Multi-Homing, Distribution Power, and Partner Access
        blocks:
          - type: paragraph
            body: >
              Switching costs in post-purchase software are moderate and asymmetric. For a returns tool, migration means
              re-authoring return policies, workflows, and warehouse routing, and re-training support staff — real
              friction, but a single app swap that Shopify's app architecture makes technically routine. Redo raises
              switching costs deliberately by bundling: a merchant using Redo for returns, tracking, protection, and
              marketing at once faces far more migration pain than one using it for returns alone, which is precisely
              why the 1,750+ multi-product-merchant figure is strategically central. Loop pursues the same lock-in
              through deep workflow customization; AfterShip and Narvar through enterprise integration and multi-year
              contracts.


              Multi-homing is common and works against durable lock-in. Because each module is a separable app, brands
              frequently mix vendors — a Loop returns flow alongside a Route protection widget and a Klaviyo marketing
              stack — so Redo must win each module on merit, not just capture the account once. Redo's counter is the
              free-to-merchant price, which makes displacing incumbent point tools cheaper and makes Redo the low-cost
              consolidator. The company's customer-angel investors (Made by Mary, Mission Belt, Enso Rings) also
              function as reference-account distribution.


              Distribution power ultimately concentrates in Shopify. The App Store is the primary discovery and
              installation channel for Redo and nearly all its rivals, Shopify controls the checkout surface where
              shopper-paid coverage is sold, and Shopify's own native returns/tracking features can be defaulted on for
              millions of stores at zero marginal cost. Partner and supply access differs by layer: package protection
              may require insurance/underwriting partners and exposes players to insurance regulation, while
              international returns require physical reverse-logistics networks — the specific capability Redo bought
              with ReturnBear (100+ countries) and that Happy Returns provides via UPS. Redo's partner moat is therefore
              strongest in international logistics and weakest where Shopify can simply build the feature natively.
            claimRefs:
              - CP025
              - CP026
              - CP027
              - CP028
              - CP029
              - CP030
              - CP031
      - number: '3.5'
        title: Moat Durability, Commoditization Risk, and Adverse Competitor Evidence
        blocks:
          - type: paragraph
            body: >
              Redo's moat is a bundle-plus-distribution story rather than deep technical defensibility. Its durable
              advantages are (1) breadth — one free platform spanning returns, tracking, protection, marketing, and
              international returns, which is genuinely hard for any single point competitor to match; (2) the ex-Divvy
              go-to-market machine and reference-customer network; and (3) an owned international reverse-logistics
              network via ReturnBear. Its fragile advantages are the individual modules: returns, tracking, and
              protection are each independently offered by well-funded specialists, meaning commoditization pressure is
              high on every component even if the bundle is differentiated.


              The most important adverse competitive evidence is Route's trajectory: a package-protection company that
              hit the exact $1.25 billion valuation Redo now carries in 2021, then retrenched and became the target of
              class actions over allegedly hidden shipping-protection fees — a cautionary comparable for a company whose
              revenue depends on the same shopper-paid mechanism. Loop's revenue base (~$53M in 2024) also frames the
              ceiling for a pure returns specialist and implies Redo's $1.25B valuation must be underwritten by the
              whole bundle, not returns alone. Meanwhile the category keeps consolidating around platforms that can
              absorb it: Global-e bought ReturnGO, UPS bought Happy Returns, and Shopify keeps building native.


              The gravest structural risk is displacement by Shopify itself. As the platform natively improves returns,
              exchanges, and tracking and governs checkout-fee presentation, it can compress the value of the very
              modules Redo bundles. Redo's defense is to stay broader and more AI-forward than Shopify's native baseline
              and to anchor in capabilities Shopify is unlikely to build (international reverse logistics, cross-channel
              marketing). Net assessment: Redo has a real, above-average competitive position for its stage — widest
              bundle, strongest GTM, differentiated logistics — but its moat durability is capped by module-level
              commoditization, Shopify platform power, and shared regulatory exposure on the monetization model.
            claimRefs:
              - CP032
              - CP033
