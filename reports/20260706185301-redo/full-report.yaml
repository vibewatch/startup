      - number: '7.2'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >
              Regulatory and legal exposure is Redo's most material risk because it targets the monetization mechanism
              itself. The FTC's Rule on Unfair or Deceptive Fees (the "junk-fee" rule, effective 2025) mandates clear,
              upfront disclosure of mandatory and add-on fees; shopper-paid shipping/package protection presented at
              checkout is precisely the kind of add-on the rule scrutinizes. Separately, legal commentators argue that
              e-commerce package protection may constitute regulated insurance under state insurance law, which — if
              adopted by regulators — could require licensing or restructure the product. The clearest precedent is a
              class action filed against comparable vendor Route (via merchant TA3) over an allegedly hidden
              shipping-protection fee; while Redo is not the named defendant, the theory of harm applies to any
              shopper-paid protection presentation, including Redo's.


              Beyond fees, Redo faces the standard but non-trivial regulatory stack for a data-rich, cross-border SaaS:
              privacy compliance (GDPR in the UK/EU and CCPA/CPRA in California) becomes materially more complex with
              the ReturnBear acquisition adding UK, Canada, and Australia returns data flows; the FTC's fake-reviews
              rule bears on Redo's reviews module; and intellectual property is a quiet risk, as no defensive patent
              portfolio is publicly disclosed and the brand relies on trademark rather than deep IP moats. Mitigation
              maturity here is mixed: Redo can (and per Shopify's 2025 ban on pre-checked protection boxes, must)
              present protection as an explicit opt-in with disclosure, but the underlying insurance-law question is
              unresolved sector-wide and is not something Redo can fully mitigate unilaterally.
