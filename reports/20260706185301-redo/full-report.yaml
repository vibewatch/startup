      - number: '7.5'
        title: Financial/Model Risk, Mitigations, and Kill Criteria
        blocks:
          - type: paragraph
            body: >
              Financially, the defining risk is opacity paired with a high mark. Redo discloses no revenue, ARR, growth
              rate, retention, or unit-economics data, yet carries a $1.25B valuation from its June 2026 Series B. If
              the valuation implies an ARR of roughly $80–250M at prevailing private SaaS multiples (5–15x), the
              down-round risk is real: SaaS multiples have compressed from their 2021 peaks, and a growth stumble or
              multiple contraction could leave the $1.25B mark unsupported at the next round. The cautionary comparable
              is direct — Route raised $200M at the same $1.25B valuation in 2021, then retrenched amid the fee-model
              backlash and litigation, illustrating how quickly a post-purchase unicorn built on shopper-paid protection
              can de-rate. Model risk is compounded by revenue concentration on the shopper-paid mechanism most exposed
              to regulation, and by the capital intensity of absorbing a physical logistics network and funding
              international expansion.


              Mitigations and monitoring indicators follow directly. Redo mitigates fee risk by presenting protection as
              disclosed opt-in and diversifying revenue across paid modules (returns, tracking, marketing, warranties)
              beyond protection; it mitigates platform risk through breadth and owned international logistics that
              Shopify-native features cannot easily replicate; and it mitigates execution risk with an experienced
              leadership team and fresh capital. Key monitoring indicators are: FTC/state enforcement actions on
              shopping-protection fees, Shopify's native-returns rollout and any protection-policy changes, integration
              milestones for Malomo and ReturnBear, security-attestation announcements, and any disclosure of
              ARR/retention. Thesis-break (kill) criteria: (1) a binding regulatory ruling classifying package
              protection as unlicensed insurance or an FTC/state action forcing removal of the fee; (2) Shopify
              launching native returns/protection that materially undercuts Redo's core; (3) a down-round or evidence of
              stalled net revenue retention; (4) a key-person departure or failed acquisition integration. Diligence
              asks: audited ARR/retention cohorts, the security/privacy program, a legal opinion on protection's
              regulatory status, and Shopify-relationship terms.
            claimRefs:
              - CR028
              - CR029
              - CR030
              - CR031
              - CR032
              - CR033
              - CR034
              - CR035
