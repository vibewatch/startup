            title: Small Software Pool on a Huge Pain Pool
            body: >-
              Redo's core software category (~$1.8B in 2026) is tiny relative to the ~$850B of returns it addresses. The
              bull case is that post-purchase software captures a growing slice of that value via retention and
              monetized coverage; the bear case is the software TAM stays small.
            calloutType: insight
            claimRefs:
              - CM006
              - CM008
              - CM009
          - type: callout
            title: Platform and Regulatory Constraints on Both Ends
            body: >-
              Shopify-native returns/exchanges commoditize the entry product while FTC junk-fee rules and insurance-law
              scrutiny pressure the shopper-paid coverage that funds it — squeezing Redo's model from product and
              monetization sides simultaneously.
            calloutType: risk
            claimRefs:
              - CM021
              - CM022
          - type: callout
            title: SAM Depends on Cross-Sell, Not Just Returns
            body: >-
              Redo's addressable revenue only reaches the high-single-digit billions if brands adopt the full
              post-purchase suite (tracking, protection, marketing, AI), not just returns. The 1,750+ multi-product
              attach is early proof but not yet a proven SAM.
            calloutType: assumption
            claimRefs:
