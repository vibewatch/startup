              On cover metrics, the well-supported figures as of mid-2026 are: a $1.25 billion post-money valuation, $81
              million most recent raise, approximately $107 million total raised, 4,100+ brands on the platform, 1,750+
              multi-product merchants, and a Draper, Utah headquarters. Revenue and ARR are not disclosed; the last
              public headcount data point is the 73 employees reported at the Series A (August 2024), and current
              headcount after two acquisitions and a Series B is almost certainly materially higher but unconfirmed.
              Some third-party trackers list stale single-digit or "1–10" employee counts that reflect incomplete
              database coverage rather than reality.


              A material forward-looking element is Redo's stated use of proceeds: AI-driven commerce tools (agentic
              shopping experiences, a marketing agent for personalized email/SMS, and a post-purchase concierge for
              higher lifetime value) and international expansion via ReturnBear's cross-border returns network. The most
              relevant adverse backdrop for the company's monetization is intensifying regulatory and legal scrutiny of
              checkout package-protection/"shipping protection" fees — including FTC junk-fee rulemaking, state
              insurance-law questions, and class-action litigation against peers — since shopper-paid coverage is
              central to how Redo earns revenue on free software.
