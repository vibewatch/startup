      - number: '4.5'
        title: Capital Adequacy, Financing Dependency, and Financial Verdict
        blocks:
          - type: paragraph
            body: >
              On capital adequacy, Redo is well-funded for its stage. The $81 million Series B (June 2026) sits on top
              of a $24 million Series A (August 2024) and a ~$2 million seed (2022), for roughly $107 million raised.
              The company explicitly stated it had already deployed part of the Series B into the ReturnBear acquisition
              (following the January 2026 Malomo deal), so not all of the fresh capital is available runway — an
              unquantified but real draw. Absent disclosed burn, runway cannot be computed; however, a usage-monetized
              model that is already at 4,100+ brands and generating shopper-fee revenue is likely closer to
              self-sustaining than a pre-revenue company, which reduces near-term financing dependency. The stated use
              of remaining proceeds is AI-driven commerce tooling (agentic shopping, marketing agent, post-purchase
              concierge) and international expansion via ReturnBear.


              The next-round trigger is not disclosed. Given the June 2026 raise, Redo has no obvious near-term need to
              return to market; the more likely capital events are further tuck-in acquisitions (the company has shown
              an appetite for M&A) funded from the Series B or future rounds. No debt or project-finance obligations are
              disclosed, consistent with an asset-light software company, though the ReturnBear logistics operations may
              carry some working-capital and facility commitments not visible publicly.


              Financial verdict: Redo's capital position is strong and its business model is genuinely differentiated
              and revenue-generating, but its financial quality is unverifiable. The three diligence blockers are (1) no
              disclosed revenue/ARR or margin, making the $1.25B valuation untestable against fundamentals; (2) a
              take-rate-on-a-regulated-fee revenue base whose durability depends on fee-disclosure and insurance-law
              outcomes; and (3) an unknown blended gross margin diluted by claims and logistics costs. The bull case is
              a high-growth, high-attach platform monetizing a massive returns problem; the bear case is that headline
              "revenue" is lower-quality and more policy-exposed than a SaaS multiple assumes. Resolving this requires
              audited financials, a revenue-mix and take-rate breakdown, and claims-cost data from the company data
              room.
