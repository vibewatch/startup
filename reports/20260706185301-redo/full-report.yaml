      - number: '5.2'
        title: Module and Product-Line Map
        blocks:
          - type: paragraph
            body: >
              Redo's product line is best understood as a growing set of post-purchase modules, some built in-house and
              some acquired, unified by a shared merchant dashboard and shopper experience. The returns-and-claims
              engine is the origin module and remains the core: an AI-driven returns/exchange portal designed to retain
              revenue by converting refunds into exchanges and store credit. Around it, Redo has added order editing,
              package protection (shopper-paid coverage), warranties, and chargeback management — a cluster aimed at
              protecting and recovering revenue. A second cluster targets growth and engagement: email/SMS marketing,
              reviews, conversion-optimization tools, and an "Agentic Catalog" for AI-assisted shopping.


              Two capabilities entered through acquisition and materially widened the map. Malomo, acquired in January
              2026 (founder-CEO Yaw Aning), brought best-in-class branded order tracking — turning the carrier-tracking
              moment into an owned, marketable brand touchpoint. ReturnBear, acquired in June 2026, brought an
              end-to-end international returns and reverse-logistics network operating as a "4PL" that keeps
              cross-border returns local in the US, Canada, UK, and Australia, verifies refunds instantly, and claims
              30–60% return-cost savings and strong fraud reduction. Together these give Redo an unusually complete span
              from the digital post-purchase interface down to physical global logistics.


              The strategic logic of the map is land-and-expand: returns is the wedge, and each additional module raises
              revenue per merchant and switching costs. The public evidence that this is working is the 1,750+ of 4,100+
              brands (roughly 43%) using more than one module. The risk in the map is breadth without equal depth —
              several modules (marketing, reviews, inventory) compete against specialized best-of-breed vendors, so the
              module map's value rests on integration and consolidation economics rather than each module being
              category-leading.
