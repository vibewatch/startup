  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition in Customer Workflow Terms
        blocks:
          - type: paragraph
            body: >
              Redo is a post-purchase operating system that a direct-to-consumer brand installs — for free — to manage
              everything that happens after a shopper clicks "buy." In customer-workflow terms, Redo replaces the
              fragmented set of tools a brand would otherwise stitch together: a returns/exchange portal, an
              order-tracking experience, a package-protection widget at checkout, a warranty-claims flow, chargeback
              handling, and post-purchase email/SMS marketing. The company frames the value as turning post-purchase
              operations "from a cost center into a profit driver," with headline product metrics it advertises
              including a 43% lift in exchange rate, 80% AI support-resolution, and average order value up several
              dollars.


              For the shopper, the core workflows are: initiate a return or exchange through a branded, AI-driven portal
              that nudges toward exchanges/store credit over refunds; opt into package/shipping protection at checkout;
              track an order through branded tracking pages (powered by the acquired Malomo); file a warranty or damage
              claim; and, internationally, return to a local hub rather than shipping cross-border (via ReturnBear). For
              the merchant, the workflows are configuration and automation: setting return policies and routing rules,
              automating approvals and fraud checks, running post-purchase marketing, and analyzing return-reason and
              revenue-retention data in a single dashboard.


              The distributed product surface is deliberately broad. Redo's own site lists modules including Returns &
