      - number: '3.3'
        title: Capability, Pricing, GTM/Distribution, and Trust/Regulatory Comparison
        blocks:
          - type: paragraph
            body: >
              On capability, no single competitor matches Redo's advertised breadth in one product: Loop and ReturnGO
              are strongest on returns/exchanges but thin on protection and marketing; AfterShip and Narvar cover
              tracking and returns broadly but are enterprise-priced and not free; Route and Corso lead on package
              protection but do not offer a full returns-management back office; Malomo (now Redo's) and Wonderment
              specialize in branded tracking alone. Redo's pitch is that it does all of these — returns, exchanges,
              tracking, protection, warranties, email/SMS marketing, and emerging AI agents — inside one app that is
              free to install.


              Pricing and go-to-market are Redo's sharpest wedge. Competitors overwhelmingly charge merchants: Loop,
              AfterShip, ReturnGO, and Corso publish tiered SaaS plans (typically a monthly platform fee plus per-return
              or usage charges), and Narvar sells custom enterprise contracts. Redo instead is free to the merchant and
              monetizes shopper-paid coverage and package protection selected at checkout, plus paid product usage — a
              model that lowers merchant adoption friction and, the company argues, aligns Redo's revenue with order
              volume rather than seat count. Distribution for all of these players runs primarily through the Shopify
              App Store, where ratings and review counts are a key GTM signal; Redo markets a 4.9-star rating across
              800+ reviews.


              On trust and regulatory posture, the shopper-paid cohort carries the most exposure. Route's litigation
              over allegedly undisclosed shipping-protection fees, the FTC's 2025 "junk fee" /
              unfair-and-deceptive-practices rulemaking on mandatory-fee disclosure, state insurance-law questions about
              whether package protection is unlicensed insurance, and Shopify's 2025 ban on pre-checked protection boxes
              together define a regulatory frontier that presses hardest on Redo, Route, Corso, and Seel — and
              comparatively little on subscription-priced Loop, AfterShip, and Narvar. This is the single most important
              competitive asymmetry in the chapter: Redo's lower-friction monetization is also its most
              regulation-sensitive one.
