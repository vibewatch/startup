      targets: ["contentRequirements/3"]
      status: answered
      answer: "Bull ~$3-5B, base ~$1.25B (hold), bear ~$0.4-0.7B (down-round)."
    - id: QV009
      question: "What assumptions drive the base case?"
      type: verification
      targets: ["contentRequirements/3"]
      status: answered
      answer: "ARR ~$85-125M growing 50-70% with NRR ~110-115% and a fee model that survives via disclosed opt-in and diversification, at ~10-13x."
    - id: QV010
      question: "What would trigger the bear case?"
      type: adverse
      targets: ["contentRequirements/3", "contentRequirements/5"]
      status: answered
      answer: "An FTC/state/insurance ruling on protection fees, Shopify native returns, or a growth stumble with multiple compression to ~5x."
    - id: QV011
      question: "How capital-efficient is Redo?"
      type: quantification
      targets: ["contentRequirements/2"]
      status: answered
      answer: "A $1.25B mark on ~$107M raised implies strong investor conviction, but efficiency cannot be confirmed without revenue."
    - id: QV012
      question: "What is the closest cautionary comparable?"
      type: comparison
      targets: ["contentRequirements/4"]
      status: answered
      answer: "Route — $200M at the same $1.25B valuation in 2021 on an overlapping shopper-fee model, followed by retrenchment and litigation."
    - id: QV013
      question: "How do post-purchase peers compare on valuation?"
      type: comparison
      targets: ["contentRequirements/4"]
      status: answered
      answer: "AfterShip is a unicorn; Narvar raised ~$64M (undisclosed valuation); Loop (~$53M revenue 2024) has no public unicorn mark, implying a lower mark for a pure-returns peer."
    - id: QV014
      question: "What private SaaS multiples frame the price?"
      type: quantification
      targets: ["contentRequirements/4"]
      status: answered
      answer: "Lower-middle-market ~3-7x ARR, broader median ~10-12x, and high-growth/vertical SaaS ~12-15x+ when NRR and growth are strong."
    - id: QV015
      question: "What public-market anchor exists for cross-border commerce?"
      type: comparison
      targets: ["contentRequirements/4"]
      status: answered
      answer: "Global-e (GLBE), whose SEC 20-F filings detail cross-border-commerce economics and risk, trades well below peak-2021 revenue multiples."
    - id: QV016
      question: "What is the entry-discipline consideration?"
      type: verification
      targets: ["contentRequirements/2"]
      status: answered
      answer: "Any entry at or above $1.25B compounds down-round risk in a compressed-multiple environment; the round carries standard late-stage preference and dilution overhang."
    - id: QV017
      question: "What is the liquidation-preference overhang?"
      type: quantification
      targets: ["contentRequirements/2"]
      status: unresolved
      answer: "Not disclosed publicly; the preference stack is a diligence item because it materially affects downside recovery."
    - id: QV018
      question: "What are the likely exit paths?"
      type: verification
      targets: ["contentRequirements/5"]
      status: answered
      answer: "Strategic acquisition (commerce platform, carrier, or marketing cloud) or continued private compounding toward an eventual IPO if ARR/NRR support it."
    - id: QV019
      question: "Is there M&A precedent in the category?"
      type: verification
      targets: ["contentRequirements/4", "contentRequirements/5"]
      status: answered
      answer: "Yes — Happy Returns→UPS (2023) and ReturnGO→Global-e (2025), plus Redo's own acquisitions of Malomo and ReturnBear."
    - id: QV020
      question: "What are the thesis-break (kill) triggers?"
      type: enumeration
      targets: ["contentRequirements/5"]
      status: answered
      answer: "Fee regulation forcing removal/licensing of protection; Shopify native returns; stalled NRR or a down-round; failed integration or key-person departure."
    - id: QV021
      question: "What are the top final diligence asks?"
      type: enumeration
      targets: ["contentRequirements/5"]
      status: answered
      answer: "Audited ARR/growth/margin/retention; the protection-fee revenue share; a legal opinion on protection's status; Shopify terms; the preference stack; and the security/privacy program."
    - id: QV022
      question: "How probable is each scenario?"
      type: comparison
      targets: ["contentRequirements/3"]
      status: partial
      answer: "Probabilities lean base-case, but the bear case carries outsized weight because its triggers are external; precise probabilities cannot be set without financials."
    - id: QV023
      question: "Is the shopper-fee revenue share large enough to be a valuation risk?"
      type: quantification
      targets: ["contentRequirements/2", "contentRequirements/3"]
      status: partial
      answer: "Likely material given the free-to-merchant model, but the exact protection-vs-modules revenue split is undisclosed and is a priority diligence ask."
    - id: QV024
      question: "What return does the bull case imply on entry?"
      type: quantification
      targets: ["contentRequirements/1", "contentRequirements/3"]
      status: answered
      answer: "Roughly 2.5-4x over a multi-year hold if ARR reaches ~$150M+ at 15x+ and fee regulation is navigated."
    - id: QV025
      question: "What is the risk rating and why?"
      type: verification
      targets: ["contentRequirements/1"]
      status: answered
      answer: "High — driven by regulatory exposure to the fee model and Shopify platform dependence, even though execution risk is moderate given team and capital."
    - id: QV026
      question: "Does owned international logistics justify a premium?"
      type: verification
      targets: ["contentRequirements/0", "contentRequirements/4"]
      status: answered
      answer: "It is a genuine, hard-to-replicate moat that supports a premium versus pure-software peers, but it does not by itself verify the $1.25B mark."
    - id: QV027
      question: "How does Shopify dependence affect the valuation case?"
      type: adverse
      targets: ["contentRequirements/0", "contentRequirements/3"]
      status: answered
      answer: "It caps the base and adds a native-competition discount; a Shopify policy or product move could reprice the model, weighting the bear case."
    - id: QV028
      question: "How fresh is the valuation evidence?"
      type: freshness
      targets: ["contentRequirements/2"]
      status: answered
      answer: "Current — the Series B was announced June 23-24, 2026, within weeks of the mid-2026 analysis date."
    - id: QV029
      question: "What is the total capital raised and structure?"
      type: quantification
      targets: ["contentRequirements/2"]
      status: answered
      answer: "About $107M total: ~$2M seed (2022), ~$24M Series A (Pelion, Aug 2024), and $81M Series B (Jun 2026)."
    - id: QV030
      question: "What single disclosure would most change the recommendation?"
      type: verification
      targets: ["contentRequirements/1", "contentRequirements/5"]
      status: answered
      answer: "Audited ARR with cohort net revenue retention — it would move the call decisively toward buy or avoid."
