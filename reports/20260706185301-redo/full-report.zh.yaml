          label: 费用模式诉讼（Route 先例）
          detail: 围绕疑似隐藏保障费用的集体诉讼理论，适用于任何消费者付费呈现方式。
        - id: shopify-policy
          label: Shopify 政策 / 原生退货
          detail: 平台费用呈现规则和原生自助退货功能。
        - id: fee-revenue
          label: 消费者付费收入
          detail: 包裹保障的抽成率，支撑大部分基数的货币化。
        - id: addressable-base
          label: 基于 Shopify 的可触达基数
          detail: 几乎所有客户和分发都依赖 Shopify。
        - id: multiples
          label: SaaS 倍数压缩
          detail: 私有 SaaS 倍数较 2021 年峰值回落（5-15x）。
        - id: revenue-durability
          label: 收入韧性
          detail: 货币化和商家留存的稳定性。
        - id: valuation
          label: $1.25B 估值 / 下一轮
          detail: 如果收入或倍数走弱，存在降价融资风险。
