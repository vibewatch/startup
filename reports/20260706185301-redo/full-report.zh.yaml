  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 外部触发因素（监管、Shopify 政策、倍数压缩）如何经由 Redo 的消费者付费和单平台结构，传导到收入与估值结果。
    data:
      nodes:
        - id: ftc-rule
          label: FTC 垃圾费用规则 / 州保险法
          detail: 监管行动瞄准消费者付费保障的披露或分类。
