  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、替代方案与相邻赛道
        blocks:
          - type: paragraph
            body: >
              Redo 竞争的市场，是卖给直面消费者（DTC）和全渠道电商品牌的购后体验软件。纳入范围的支出，是用于自动化结账后工作流的 SaaS 和按使用量费用：退货和换货、订单追踪和配送通知、包裹 /
              运输保护、保修和索赔、购后支持，以及购后营销（email/SMS，且越来越多是 AI agent）。相关买方是商户品牌；付款方则混合了品牌（软件）和买家（结账时选择的保障）。


              Redo 可触达软件市场明确排除了外围更大的物理层：第三方物流（3PL）、仓储、承运配送，以及移动并重新上架退货商品所需的逆向物流货运和处理。这些市场规模巨大——仅逆向物流市场 2026 年估计就接近
              $936–955B——但它们是服务和货运，不是软件；Redo 只参与编排 / 软件层（并用 ReturnBear
              的跨境处理网络增强能力）。核心商业平台（Shopify、BigCommerce）、前向订单管理系统和通用营销套件也被排除在外，尽管 Redo 与它们的边缘越来越重叠。


              对多数品牌而言，现状替代方案是点状工具加手工工作的碎片化组合：一个退货 app、一个独立追踪 app、一个运输保护插件、一个客服台，以及一个 email/SMS 平台；更小品牌则用平台原生功能和电子表格。Redo
              的判断是，这种碎片化本身就是市场：把点状解决方案整合成一个对商户免费的平台、按使用量变现，正是其领导层在 Divvy 用过的楔子。Redo 可继续扩张的相邻赛道——运输保险、忠诚度、评论、客服台和营销自动化（如
              Klaviyo 风格）——会放大机会，也会增加它必须替换的既有玩家数量。
