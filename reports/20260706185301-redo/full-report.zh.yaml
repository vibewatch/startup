          detail: 跨模块的代理与分析
          modules:
            - AI 客服 / 销售代理
            - 营销代理
            - 购后礼宾助手
            - 退货原因与欺诈分析
            - Agentic 目录
          outputs:
            - 自动化
            - 个性化
          tone: neutral
        - label: 数据 / 集成层
          detail: 连接商业与营销科技生态的连接器
          modules:
            - Shopify / BigCommerce / SFCC
            - Klaviyo / Attentive / Postscript
            - Gorgias
            - Recharge / NetSuite / ShipBob
            - Global-e
          outputs:
            - 在购后技术栈中占据枢纽位置
          tone: neutral
        - label: 物流（4PL）层
          detail: 实体逆向物流（ReturnBear）
          modules:
            - 本地退货枢纽（US/CA/UK/AU）
            - 合并集运
            - 即时退款核验
            - 承运商网络（FedEx/UPS/USPS/DHL）
          outputs:
            - 本地化跨境退货
            - 降低成本与欺诈
          tone: warning
    approximationNotes: 层级边界是分析上的简化；Redo 没有发布官方架构图，因此本图综合了产品官网、集成信息和收购披露。物流层因集成和利润率复杂度，属于观察项。
