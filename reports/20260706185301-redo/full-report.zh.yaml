      - number: '2.4'
        title: 增长驱动、约束与规模测算缺口
        blocks:
          - type: paragraph
            body: >
              多股顺风支撑 Redo。电商和 DTC 仍在增长（全球 DTC CAGR 约 7.8%；Shopify GMV 2026 年一季度同比增长约 35%），机械性拉动订单量，也拉动退货量。退货率仍处高位（线上约
              19.3%），处理单次退货的成本（$10–45）让退货自动化和换货转化直接带来正 ROI。DTC 放缓本身也是购后软件的驱动因素：获客成本八年上涨约 222%，二次购买留存接近
              28%，品牌必须从存量客户中挖出更多价值，而这正是购后留存工具承诺解决的问题。点状工具整合和 AI 浪潮（智能体式购物、自动化支持）也进一步利好一体化平台。


              约束同样真实。最重要的是平台风险：Shopify 已重投入原生退货和换货，以及 Shop app 的购后互动，这会让 Redo 面向小品牌的入口产品商品化。第二是监管：Redo 靠买家付费保障变现，2025 年
              FTC「垃圾费」规则、州保险法对包裹保护产品的审查，以及同业集体诉讼，都会提高合规和抽成风险。第三是 DTC
              放缓的双刃剑效应——市场降温会加剧钱包份额竞争，也可能拖慢新商户形成。第四是转换成本和既有玩家扎根（Loop、AfterShip、Narvar、Route），让中端市场替换更慢。


              我们有意保留规模测算缺口和矛盾。「退货管理软件」与「逆向物流自动化软件」的分析师估算会因范围不同相差约 5 倍，且没有一个估算能隔离 Redo 实际销售的精确套件；也没有独立第三方专门估算 Shopify 类
              DTC 品牌的购后套件 SAM。待解决价值池（$850B 退货）不是 Redo 的收入池——那只是问题规模，把两者混为一谈会夸大机会。这些缺口说明市场真实且增长中，但精确测算比头条退货数字暗示的更难。
