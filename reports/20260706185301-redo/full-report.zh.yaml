      - number: '4.4'
        title: 公开牵引力与私有指标缺口
        blocks:
          - type: paragraph
            body: >
              公开可支撑的牵引力指标包括：$1.25B 投后估值（2026 年 6 月）、最近一轮融资 $81M、累计融资约 $107M、平台上 4,100+ 个品牌、1,750+ 个多产品商户，以及 2026
              年两次收购（Malomo、ReturnBear）。品牌数增长强劲——Series A 轮（2024 年 8 月）约 1,500 个品牌，到 2026 年中 4,100+
              个，意味着平台商户基础不到两年几乎翻了三倍。


              私有指标缺口严重，并且是任何投资决策的核心。Redo 未披露收入、ARR、处理 GMV、抽成率、毛利率、净收入留存、CAC / 回本、烧钱、现金余额或现金跑道。作为三角测算，最接近的公开可比公司是 Loop
              Returns，这家退货专家 2024 年收入约 $53.3M；如果 Redo 的更宽套件和更大品牌基础让收入高于 Loop，可从估值和 2026 年倍数推导一个粗略 ARR
              区间（见估算区间图），但区间内每一点都是衍生估计，不是披露。公司自己的头条指标是活动指标（品牌、多产品商户），不是财务指标；这在私人公司中常见，但考虑到独角兽估值，在这里构成真实限制。


              一条不利且有财务实质的公开线索是监管：FTC 2025 年要求明确披露强制费用的垃圾费规则、针对同业 Route 所谓隐藏 shipping-protection
              费用的集体诉讼，以及州保险法对包裹保护的疑问，都直接指向最可能驱动 Redo 经济性的收入流。这些并不能证明 Redo 存在问题，但定义了其收入基础的下行情景。
