      - number: '3.2'
        title: 竞品画像：规模、融资、目标客户、产品范围与方向
        blocks:
          - type: paragraph
            body: >
              Loop Returns 是 Redo 最常被提及的直接竞品。Loop 成立于 2016 年，聚焦 Shopify；按第三方追踪器估算，2024 年收入约 $53.3M（高于 2023 年约
              $31M），背后投资者包括 CRV 和 FirstMark。其已报道总融资额在不同追踪器之间差异很大（部分资料约 $10.5M，CB Insights 则报道 2021 年 $65M Series B
              轮），这是本章缺口中记录的未解决数据冲突。Loop 的定位是最佳同类、企业级退货和换货引擎，最大化换货替代退款带来的留存——深，但相较 Redo 的多模块套件更窄。


              AfterShip 和 Narvar 是宽购后套件。AfterShip（Hong Kong）2021 年 4 月完成 Tiger Global 领投的 $66M Series B
              轮，按报道达到独角兽估值，在全球多承运商上提供货运追踪、退货和配送 / EDD 预测，主要按 SaaS 订阅销售。Narvar（San Francisco）获得 Accel、Battery
              Ventures、Salesforce Ventures 等支持（已披露轮次约融资 $64M），面向大型企业零售商，提供追踪、退货和管家式体验。两者都在广度上与 Redo 竞争，但靠商户订阅变现，而不是 Redo
              的商户免费、买家付费模式。


              包裹保护阵营最直接映射 Redo 的收入模型。Route 在 2021 年 6 月以 $1.25B 估值完成 $200M Series B 轮——巧合的是，这正是 Redo
              当前头条估值——其业务建立在买家付费包裹保护和追踪上，但随后收缩，并成为围绕所谓隐藏「shipping protection」费用的集体诉讼被告。Corso 和 Seel 提供类似的基于结账的保护 /
              退货保障产品。ReturnGO（融资 $11.3M；2025 年 8 月被 Global-e 收购；2,500+ 家 Shopify 店铺）和逆向物流网络 Happy Returns（2023 年被 UPS
              收购）补齐竞争版图。面对所有这些玩家，Redo 的差异化主张是 4,100+ 个品牌、1,750+ 个使用多个模块，以及通过收购 Malomo（品牌化追踪）和 ReturnBear（国际退货）拓宽套件。
