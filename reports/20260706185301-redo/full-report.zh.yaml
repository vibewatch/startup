      - number: '4.3'
        title: 成本结构、毛利驱动与服务交付成本
        blocks:
          - type: paragraph
            body: >
              Redo 的成本结构混合了软件公司经济和纯 SaaS 公司没有的物流、保障索赔成本。软件侧毛利率应较高（托管、平台、支持），符合垂直 SaaS 特征。但两个因素会拉低综合毛利率并让图景复杂：（1）保障 /
              索赔成本——如果 Redo 承担或再保险包裹保护和退货保障索赔，已付索赔成本会直接抵扣保护收入，使该收入流真实毛利成为扣除索赔后的净额，而不是典型 80%+ 软件毛利；（2）ReturnBear
              收购带来的逆向物流成本，涉及 100+ 个国家的实物退货处理，具备物流式、较低毛利经济。


              运营成本驱动包括前 Divvy GTM 团队（销售、营销和合作伙伴支出在 Divvy 时很可见，这里也很可能如此）、Series B 轮资助的 AI agent 路线图研发，以及 2026
              年两次收购（Malomo 和 ReturnBear）的整合成本。员工数是关键未知项：最后一个公开数字是 Series A 轮（2024 年 8 月）的 73 人；在两次收购和 $81M
              融资后，当前人数已显著更高但未确认。公司未披露营运资本以及先收买家费用、后付索赔可能产生的任何浮存金动态；这可能带来有利时点差（先收费用、后付索赔），也可能在索赔激增时变成负债。


              结论：可想象的毛利路径，是高毛利软件核心被索赔和物流成本稀释，但综合毛利率无法从公开数据判断。这是重大收入质量问题——一美元买家保护「收入」在经济上不等同于一美元订阅 SaaS
              收入，估值章节的比较必须计入这一点。
