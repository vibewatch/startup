      - number: '4.2'
        title: GTM 路径与销售效率代理指标
        blocks:
          - type: paragraph
            body: >
              Redo 的 go-to-market 是产品驱动、免费安装的路径，主要通过 Shopify App Store 分发，并由强势的前 Divvy 销售和营销团队及客户天使背书（Made by
              Mary、Mission Belt、Enso Rings）放大。商户开始时不付费，因此经典的付费获客 CAC / 回本框架部分被激活与 attach 动作替代：获客成本更低，但公司随后必须推动买家侧保护
              attach 率和多模块采用，把一次免费安装转化成收入。4,100+ 个品牌中 1,750+ 个为多产品商户，是公开可见的扩张效率最佳代理指标——约 43% 品牌使用不止一个模块——如果能维持，是健康的
              attach 信号。


              公司未披露 CAC、回本期、销售周期或 magic number，因此销售效率只能基准化对照。2026 年，基准聚合机构引用的 SaaS 中位数显示，LTV/CAC 约 2.1–3.6:1（传统健康目标为
              3:1），CAC 回本约 15–20 个月（优秀水平低于 12 个月），全体 SaaS 净收入留存约 101–103%，垂直 SaaS 约 112%。一个按使用量变现、对商户免费的模型，如果多模块 attach
              强，可能比按席位收费的同行有更高 NRR 和更短有效回本期；但这是由模型推断，不是 Redo 已测量披露的指标。相关风险是，如果保护产品的买家 attach
              率因监管、主动选择默认设置或买家价格敏感度而压缩，即使商户数量继续上升，整个单商户收入假设也会变弱。


              渠道经济也把分发风险集中到 Shopify：App Store 是获客漏斗，Shopify 掌握变现费用呈现的结账界面。这在今天很高效，但意味着 Redo 的单位经济有一部分取决于它无法控制的平台。
