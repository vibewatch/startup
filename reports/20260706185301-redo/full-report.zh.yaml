  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Redo 的客户旅程从免费的 Shopify App Store 发现开始，经由退货优先激活、多模块扩展，走向长期留存；消费者侧则并行经过退货门户和付费保障。
    data:
      nodes:
        - id: discovery
          label: 通过 Shopify App Store 发现
          detail: DTC 商家在 Shopify App Store 看到 Redo 是排名第 1 的退货应用（5.0，669 条评论），无需前期承诺即可免费安装。
        - id: activation
          label: 退货优先激活
          detail: 商家配置品牌化退货 / 换货门户——最常见的入口模块；消费者开始发起退货和换货。
        - id: monetization
          label: 消费者付费保障 + 使用费
          detail: 消费者在结账时选择加入包裹保障（由消费者支付的抽成）；商家开始按采用模块支付用量费。
        - id: expansion
          label: 多模块扩展
          detail: 商家增加订单跟踪（Malomo）、Email/SMS 营销、保修、拒付和 AI 客服；约 1,750 个品牌（约 43%）使用不止一个产品。
        - id: support
          label: 人工 + AI 支持
          detail: 商家在评论中点名称赞响应迅速的人工客服，同时使用 AI 客服代理；AI 转人工仍是实时摩擦点。
        - id: retention
          label: 长期留存
          detail: 活跃商家会留存两到三年（Goldie Swimwear 约 3 年，Violate The Dress Code 2 年），并把 Redo 描述为合作轻松的供应商关系。
    approximationNotes: 这些阶段不是来自 Redo 发布的客户生命周期图，而是根据 Redo 客户 / 营销页面和带日期的 Shopify 评论推断。
