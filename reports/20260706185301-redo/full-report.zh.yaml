      - number: '7.5'
        title: 财务 / 模型风险、缓释措施与终止标准
        blocks:
          - type: paragraph
            body: >
              财务上，核心风险是不透明叠加高估值标记。Redo 不披露收入、ARR、增长率、留存或单位经济数据，却在 2026 年 6 月 B 轮拥有 $1.25B 估值。如果该估值按当前私营 SaaS
              倍数（5–15x）隐含约 $80–250M ARR，估值下调融资风险就是真实的：SaaS 倍数已从 2021 年峰值压缩，一旦增长失速或倍数继续收缩，下一轮可能无法支撑 $1.25B
              标记。警示性可比对象很直接——Route 2021 年以同样 $1.25B 估值融资
              $200M，随后在费用模式反弹和诉讼中收缩，说明建立在消费者付费保障上的购后独角兽可以多快被下调估值。模型风险还被两点放大：收入集中在最暴露于监管的消费者付费机制上；同时还要吸收实物物流网络并资助国际扩张，资本强度更高。


              缓释和监控指标也由此推出。Redo 通过把保障呈现为已披露的主动选择加入项，并把收入多元化到保障之外的付费模块（退货、追踪、营销、保修）来缓释费用风险；通过宽产品线和自有国际物流，缓释 Shopify
              原生功能难以复制的部分平台风险；通过有经验的领导团队和新融资，缓释执行风险。关键监控指标包括：FTC / 州层面对购物保障费用的执法行动、Shopify 原生退货推出节奏和任何保障政策变化、Malomo 与
              ReturnBear 集成里程碑、安全认证公告，以及任何 ARR / 留存披露。论点破裂（终止）标准：(1) 有约束力的监管裁定把包裹保障归类为无牌保险，或 FTC / 州行动迫使移除该费用；(2)
              Shopify 推出原生退货 / 保障，并实质削弱 Redo 核心；(3) 估值下调融资或净收入留存停滞的证据；(4) 关键人物离职或收购集成失败。尽调请求：经审计 ARR / 留存队列、安全 /
              隐私项目、关于保障监管状态的法律意见，以及 Shopify 关系条款。
