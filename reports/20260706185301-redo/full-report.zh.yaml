      - number: '6.2'
        title: 采用轨迹与多模块扩张
        blocks:
          - type: paragraph
            body: >
              Redo 的采用轨迹，最能用商户数量和多模块扩张来证明，而不是未披露的收入队列。2026 年 6 月 B 轮时，公司据报道服务超过 4,100 个品牌；Redo 自己的营销页面称 4,500+
              品牌，客户页突出显示 800+ 条评价中的 4.9 评分。已安装基础中，Redo 称约 1,750 个品牌——约 43%——使用不止一个产品，这是账户内先落地再扩张采用的直接信号。多模块渗透是 Redo
              增长叙事的核心：品牌先安装免费的退货门户，随后就成为订单追踪（通过收购的 Malomo）、购后 Email/SMS 营销、保修、拒付和 AI 支持的候选用户，每个模块都可以单独变现。


              客户证言从定性上印证了扩张模式。AnaOno 和 Creations of Christ 描述自己从退货和换货起步，后来又采用客服、配送、订单确认邮件和营销，把这些放在「一个地方」。长期评价——Goldie
              Swimwear 接近三年，Violate The Dress Code 两年，Creations of Christ 超过一年——说明早期采用者中存在耐久留存。Shopify App Store 页面显示
              669 条评价、总体评分 5.0、98% 五星，且 2026 年 5–6 月仍有新评价，证明采用和满意度仍是当下状态，而不是历史遗产。Redo 的非有机动作（2026 年 1 月 Malomo、2026 年 6
              月 ReturnBear）扩大了现有客户深化采用的产品面，不过集成节奏将决定收购能力多快转化为扩张收入。
