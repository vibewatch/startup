      - number: '7.4'
        title: 伙伴、依赖与人员风险
        blocks:
          - type: paragraph
            body: >
              Redo 最大的单一依赖是 Shopify。几乎所有客户都是 Shopify 商户，分发通过 Shopify App Store，Shopify 还制定约束 Redo 费用呈现的规则——其 2025
              年禁止预勾选保障框的政策一夜之间改变了 Redo 的主动选择默认设置，具体展示了平台杠杆。这个风险的战略版本是竞争：Shopify 正在构建原生自助退货和换货，可能把 Redo
              的入口模块商品化，并压缩低复杂度可触达基础，迫使 Redo 在宽度、国际处理、欺诈防控和企业工作流上防守。次级依赖包括 ReturnBear 网络的承运商（FedEx、UPS、USPS、DHL、Canada
              Post、Australia Post）以及支撑整合价值主张的集成伙伴（Klaviyo、Gorgias、Recharge、ShipBob）。考虑到 2026 年 6 月由 Smash Capital
              领投、Pelion 和 Cervin 跟投的 B 轮资金充足，资本提供方依赖相对较低。


              人员和执行方面，Redo 领导层集中在前 Divvy 群体——CEO Sterling Snow（前 Divvy CRO）和其他「Divvy Mafia」高管——创始人 Tay Brown
              在董事会。这种集中既是资产（一支经过验证、凝聚力强、曾把 Divvy 扩到 $2.5B 退出的团队），也是关键人物风险（重度依赖 Snow
              和少数高管，他们离开会造成实质扰动）。变化速度抬高了执行风险：六个月内两项收购、B 轮资助的激进 AI 路线图和国际扩张，都要求公司同步执行，而上一次公开披露时员工数只有约 73 人（2024 年 8
              月）。这里的论点破裂触发点，是关键人物离职、收购集成失手，或 Shopify 的政策 / 产品动作从结构上重定价 Redo 的变现。
