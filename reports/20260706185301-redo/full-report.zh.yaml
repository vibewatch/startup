      - number: '2.2'
        title: 市场规模测算：多重视角
        blocks:
          - type: paragraph
            body: >
              没有一个单一数字能概括 Redo 的机会，因此我们用四个视角交叉测算。第一，也是最窄且最直接可比的视角，是退货管理软件：2026 年规模估计约 $1.77–1.93B，并预计到 2030 年代中期以约
              8.5–9.2% CAGR 增至约 $3.5–4.25B。另一个更宽的供应商估算认为，退货管理软件 2024 年为 $3.5B，到 2033 年增长至 $7.1B。这是 Redo
              的核心品类，也是一个规模小、竞争激烈的软件池。


              第二个视角扩展到所有购后 / 逆向物流自动化软件——订单追踪、保护、索赔、分析——2025 年估计接近 $9.8B，年增速约 9.5%。在 Malomo 和 ReturnBear 收购之后，这更贴近 Redo
              扩展后的「购后操作系统」范围。第三个视角，是支撑软件价值的待解决价值池：2025 年美国零售商处理的退货估计达 $849.9B（约占销售额 15.8%；线上约 19.3%），低于 2024 年的
              $890B——这就是 Redo 变现的痛点。第四个视角，是需求侧装机基础：全球 DTC 电商市场预计 2026 年约 $319.6B（CAGR 7.8%），美国有 110,000+ 个 DTC
              品牌，Shopify 支撑约 560 万家店铺和 2025 年 $378B+ GMV。


              综合来看，Redo 完整购后软件愿景的可辩护 TAM 位于高个位数到低双位数十亿美元，并以约 9–10% 复合增长；可服务市场（SAM）是 Shopify 类平台上愿意为打包购后套件付费的 DTC / SMB
              到中端市场品牌子集；Redo 当前已获得市场（SOM）就是它的 4,100+ 个品牌。约 $2–10B 的软件 TAM 与 $1.25B 估值之间的落差，是估值章节必须解决的核心张力。
