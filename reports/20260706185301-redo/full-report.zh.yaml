  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 客户工作流视角下的产品定义
        blocks:
          - type: paragraph
            body: >
              Redo 是 DTC 品牌免费安装的购后操作系统，用来管理消费者点击「buy」之后发生的一切。从客户工作流看，Redo 取代了品牌原本需要拼在一起的一组碎片工具：退货 /
              换货门户、订单追踪体验、结账时的包裹保障组件、保修理赔流程、拒付处理，以及购后 Email/SMS 营销。公司把价值表述为把购后运营「从成本中心变成利润引擎」，并宣传几项核心产品指标：换货率提升 43%、AI
              支持解决率 80%、平均订单价值提升数美元。


              消费者侧的核心工作流包括：通过品牌化、AI 驱动的门户发起退货或换货，系统会引导消费者选择换货 / 店铺积分而不是退款；结账时选择包裹 / 配送保障；通过品牌化追踪页面（由收购的 Malomo
              提供支持）追踪订单；提交保修或损坏理赔；在国际场景下，借助 ReturnBear
              退到本地枢纽，而不是跨境寄回。商户侧的工作流则是配置与自动化：设定退货政策和路由规则，自动化审批和欺诈检查，开展购后营销，并在单一仪表盘中分析退货原因和收入留存数据。


              Redo 有意把产品触点铺得很宽。Redo 自己的网站列出的模块包括退货与理赔、AI 销售与支持、转化优化、Email & SMS、订单编辑、配送与履约、订单追踪、保修、拒付、库存管理，以及「Agentic
              Catalog」。Shopify App Store 上 Redo Tech, Inc. 的页面显示总体评分 5.0、98% 为五星评价，说明即使模块组合通过自研和收购快速扩张，商户对核心产品的满意度仍然很强。
