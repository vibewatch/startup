  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >
              Redo 面向 DTC 电商品牌销售，客户绝大多数在 Shopify 上；其客户经济性建立在买方、用户和付款方异常分离的结构上。商户是买方和主要账户持有人，但 Redo
              可免费安装；商户在采用付费模块时支付基于使用量的费用。消费者是大多数触点的终端用户（退货门户、追踪页面、保修流程），更关键的是，消费者也是包裹 /
              配送保障的付款方；这部分在结账时以消费者付费抽成变现。这种商户免费、消费者变现的结构意味着，Redo 的「客户」其实是两个群体，激励可能分叉——它同时塑造采用（商户低摩擦）和满意度风险（费用落在消费者身上）。


              按细分看，Redo 的商户集中在退货和换货频繁、对利润率敏感的实物商品 DTC 垂直：服装和时尚、珠宝和配饰、泳装、消费品。具名案例覆盖珠宝（Made by Mary、Enso Rings）、配饰（Mission
              Belt）、服装（Violate The Dress Code、Zorali、Creations of Christ）、泳装（Goldie Swimwear）和特殊内衣（AnaOno）。按规模看，基础更偏中小型
              Shopify 品牌，而不是大型企业级零售商；不过 Redo 把整合平台定位成成长型品牌替代「数十个单点方案」的方式。地域上，客户基础以美国为中心；2026 年 6 月收购 ReturnBear
              后，本地退货基础设施扩展到加拿大、英国和澳大利亚，从而扩大可触达客户。按用例看，客户会按首次采用的模块分层——最常见是退货和换货——然后再扩展到订单追踪、营销和支持。
