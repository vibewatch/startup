      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              Redo 由 Tay Brown 和 Sterling Snow 共同创立。Tay Brown
              提出核心概念，自己先当用户验证这个想法，做出最小可行产品，融到种子轮，并拿下第一批客户；他目前担任创始人兼董事会成员。Sterling Snow 在两人围绕该想法合作约三个月后，于 2023 年 9
              月正式加入，担任联合创始人兼 CEO。Snow 的履历是公司最核心的背书：他在 Divvy 近五年一路做到首席营收官（2019 年 1 月至 2021 年 6 月），Divvy 在这段时间快速扩张，并于 2021
              年 5 月以约 $2.5B 被 Bill.com 收购——当时是 Utah 史上最大科技并购。


              一个有辨识度的治理和人才特征，是当地媒体称为「Divvy Mafia」的班底：Snow 组建了一支亲自挑选的前 Divvy 运营团队，包括 Aaron Evett（首席商务官）、Eric
              Lepretre、Jordan Bleak 和 Jared Cahoon。经验丰富且曾经打过胜仗的运营人员高度集中，提升了执行力，但也带来围绕 Snow 的关键人依赖；他的个人品牌、人脉和 Pelion
              关系都与公司紧紧绑定。复用 Divvy 剧本（免费软件、按使用量变现、平台整合）既是看多逻辑，也是风险来源——一旦这个类比在商业场景里不成立，模式匹配就会失效。


              除创始人和董事会之外，公司未公开更细的治理信息。Pelion Venture Partners 领投种子轮和 Series A 轮，并参投 Series B 轮，是最有影响力的外部股东；Smash Capital
              则在 Series B 轮新进入。公司没有公布独立董事构成、期权池或正式委员会结构，这对一家私人 Series B 公司常见，但仍是尽调缺口。
