      - number: '5.4'
        title: 部署、集成、可靠性、支持与路线图
        blocks:
          - type: paragraph
            body: >
              Redo 的部署有意做得低摩擦：商户免费从 Shopify App Store 安装 Redo，连接店铺和相关工具，再配置政策和工作流。软件免费且 Shopify
              原生，因此相比需要销售周期和定制集成的企业级购后套件，见效时间更短。与承运商、3PL 和 martech 工具的集成通过 Redo 公开的连接器集合完成；支持由 Redo Tech, Inc.
              提供，并配有覆盖退货设置、分析和优化的庞大帮助中心（每个模块都有数十篇文章）。Shopify 页面在数百条评价中保持 5.0，是最强的公开可靠性 / 满意度信号，尽管它反映的是商户情绪，而不是实测可用性。


              可靠性和支持会随着模块数量以及 2026 年两项收购而扩容，也因此引入集成风险：把 Malomo 的追踪栈和 ReturnBear 的物流运营合进统一平台，并不简单，是执行层面的观察项。公司在收购
              ReturnBear 前已与其合作超过一年，降低了集成意外；Malomo 团队也在创始人带领下完整加入——两点都是缓释因素。


              2026 年 6 月 B 轮资助的路线图，明确指向 AI 和国际化。公司列出的优先事项，是 AI 驱动的商业工具——智能体购物体验、用于个性化 Email/SMS
              的营销智能体、提升生命周期价值的购后管家——以及基于 ReturnBear 跨境网络的国际扩张。这一路线图贴合行业向智能体商业转移的大趋势，但不少 AI
              智能体能力仍是前瞻性资金用途承诺，而不是已经完整发布的产品，因此竞争权重还有待证明。研发阶段画像因此是：退货、追踪、保障这些核心已经成熟且满意度高，AI 和国际化边界则扩张很快、且部分仍在路线图上。
