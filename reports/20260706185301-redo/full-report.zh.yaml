      - number: '8.3'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >
              Redo 2026 年 6 月 B 轮融资 $81M，投后估值 $1.25B，由 Smash Capital（合伙人 Paul Szurek）领投，Pelion Venture Partners 和 Cervin
              Ventures 继续参与；该轮于 2026 年 6 月 23–24 日在 Utah Draper 宣布。此前是 2024 年 8 月由 Pelion 领投的约 $24M A 轮，以及 2022 年前后的估计约
              $2M 种子轮，使总融资约 $107M。B 轮明确用于 AI 投资（智能体购物、营销智能体、购后管家）和国际扩张，其中一部分已经投向 ReturnBear
              收购，用来把退货触达扩展到国际市场。表面看，这是资本效率高的画像——约 $107M 融资支撑约 $1.25B 估值，说明投资人信念很强——但没有收入数据，效率无法确认。


              入场纪律上，公开证据无法独立支撑价格；它只能支撑价格这个事实。$1.25B 估值由多个独立媒体相互印证（thesaasnews、pulse2、Utah Business、GlobeNewswire/Manila
              Times），但每一家报道的都是公司提供的估值，而不是独立财务推导。隐含倍数数学给出范围：按低中端私营 SaaS 3–7x ARR 倍数，估值隐含约 $180–415M ARR；按高增长或垂直 SaaS
              10–15x 倍数，隐含约 $83–125M ARR。合理中枢——快速增长的垂直 SaaS、约 10–15x——指向约 $85–125M
              ARR，但这是推断，不是披露。稀释和优先权压力对这个阶段来说是标准问题；公开证据也没有披露清算优先权堆栈，而这会实质影响熊市情景下的下行回收，是尽调项。
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV018
              - CV019
              - CV029
      - number: '8.4'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >
              基准情形假设 Redo 的 ARR 约 $85-125M，增长 50-70%，净收入留存落在垂直 SaaS 区间（约 110-115%）；消费者付费模式靠披露清晰的 opt-in 和收入多元化顶住监管。在约
              10-13x 的前瞻倍数下，当前 $1.25B 估值大体站得住，但含义是持有，而不是估值阶跃；回报来自持续增长和温和的倍数稳定，不是重新定价。基准情形概率最高，但取决于公众看不到的财务数据。


              牛市情形假设 ARR 逼近高端（约 $150M+）、增长 80%+、NRR 强劲，Malomo 和 ReturnBear 顺利并入差异化的国际平台，AI 模块提高附加率和定价。若在更大、更快的收入底座上倍数守住
              15x+，且 Redo 通过收入多元化摆脱费用监管压力，股权在多年持有期内可支撑 $3-5B，对入场价产生 2.5-4x
              回报。熊市情形假设监管或平台冲击：FTC/州层面行动或保险法裁定迫使消费者付费保障下线或重构，Shopify 原生退货功能压缩基本盘，或增长失速叠加倍数压缩至约 5x。任何一个触发因素都可能把估值打到
              $400-700M——形成 down-round 和资本减值；Route
              2021→收缩这条路径就是明确先例。概率信号偏向基准情形，但熊市情形权重异常大，因为触发因素（监管、Shopify）来自外部，部分不受管理层控制；同时，留存数据不披露，也拿掉了反驳降估值叙事的最强防线。
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
