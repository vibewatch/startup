      - number: '6.4'
        title: 留存、耐久性与满意度
        blocks:
          - type: paragraph
            body: >
              Redo 没有披露正式留存指标——公开资料中没有净收入留存（NRR）、总收入留存（GRR）、logo
              流失、续约率或合同期限。缺少这些指标时，只能从代理信号推断耐久性。最强的正向代理信号是使用年限和满意度：多位评价者报告两到三年的合作关系，Shopify 页面在 669 条评价中保持 5.0，98% 为五星、仅
              1% 为一星；评价者还反复提到响应迅速的人工支持（点名具体代表）是留下来的原因。43%
              多模块使用率本身也是留存信号，因为使用更多产品的客户在结构上更黏。这些代理信号暗示，活跃商户中的总留存较高，也符合评价中「最轻松的供应商关系」这类表述。


              反向信号真实存在，但程度有限。即便是五星评价者，也提到「偶发更新 / 缺陷令人沮丧」，以及越过 AI 支持层接触真人时有摩擦，说明平台通过收购快速扩张时，可靠性和 AI
              转人工质量仍是实时满意度问题。更实质的是，消费者付费保障模式让客户关系的终端用户侧暴露在不满中，而这些不满不会出现在商户评价里：围绕配送保障「垃圾费用」的消费者审视、州保险法问题，以及针对可比供应商 Route
              涉嫌隐藏费用的集体诉讼，都会影响消费者信任；如果消费者投诉，最终会传导为商户流失。因为留存未披露，付款方也不是评价者，满意度证据是不对称的：商户侧强，消费者侧未测量且存在争议。
