      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              监管和法律暴露是 Redo 最重大的风险，因为它直接指向变现机制本身。FTC 的《不公平或欺骗性费用规则》（即「垃圾费用」规则，2025 年生效）要求强制费用和附加费用清晰、前置披露；结账时呈现的消费者付费配送
              / 包裹保障，正是该规则审视的附加项。另有法律评论者认为，电商包裹保障在州保险法下可能构成受监管保险；如果监管机构采纳这一观点，Redo 可能需要牌照，或重构产品。最清晰的先例，是针对可比供应商
              Route（通过商户 TA3）的集体诉讼，指控其隐藏配送保障费用；Redo 虽然不是被告，但损害理论适用于任何消费者付费保障呈现，包括 Redo。


              费用之外，Redo 还面临数据丰富、跨境 SaaS 的标准但不轻的监管栈：ReturnBear 收购带来英国、加拿大、澳大利亚退货数据流后，隐私合规（英国 / 欧盟的 GDPR、加州
              CCPA/CPRA）复杂度显著上升；FTC 的虚假评论规则会影响 Redo 的评论模块；知识产权则是安静风险，因为公开资料没有披露防御性专利组合，品牌更多依赖商标，而不是深 IP
              护城河。这里的缓释成熟度有强有弱：Redo 可以（且按照 Shopify 2025 年禁止预勾选保障框的政策，必须）把保障作为明确主动选择加入项并披露，但底层保险法问题在整个行业都未解决，Redo
              也无法单方面完全缓释。
