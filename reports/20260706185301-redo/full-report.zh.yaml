      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >
              Redo 的市场是少见的三边结构。买方 / 决策者是商户品牌，通常是 DTC 品牌的创始人、电商负责人或运营 / CX 负责人。用户分两组：品牌的 CX
              和运营团队（负责退货、换货和支持）以及终端买家（发起退货、追踪订单、选择保障）。付款方被拆开：品牌为软件本身少付或不付费，买家在结账时为可选退货保障 / 包裹保护付费，Redo
              由此赚钱。「商户免费、向买家变现」的结构大幅降低采用门槛，也是 Redo 落地后扩张动作的核心。


              预算归属随品牌规模而变。对 SMB DTC
              品牌，创始人或单一电商经理掌握决策权；因为没有软件预算项要审批，几天内就能采用。对中端和更大品牌，决策会牵涉运营、财务（审查退货成本），有时还有法务（审查结账费用合规）。采用触发点通常是急性痛点——退货率上升、支持工单膨胀，或工具栈碎片化——再叠加改善留存的增长任务。82%
              的消费者把免费退货视为重要购买因素，71% 在糟糕退货体验后不会复购，因此购后质量越来越是增长杠杆，而不只是成本线。


              采用路径是：安装免费 app（通常经由 Shopify App Store），迁移退货 / 换货流程，增加追踪和保护，再扩展到营销和 AI 工具。多产品 attach 率——4,100+ 个品牌中 1,750+
              个使用不止一个 Redo 产品——是这套扩张动作有效的最清晰证据。风险在于，同样的低摩擦动态也会帮到竞品和 Shopify 原生功能。
