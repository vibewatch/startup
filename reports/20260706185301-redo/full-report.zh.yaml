  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >
              Redo 的风险画像由两项会相互放大的结构性暴露主导：一是消费者付费费用模式，正落在趋严消费者费用监管的通道里；二是几乎完全依赖 Shopify
              这一单一电商平台，分发、可触达市场，甚至费用如何呈现的规则都由它决定。按剩余暴露排序，最高严重度风险是：(1) 针对消费者付费包裹保障的监管 / 法律行动（FTC 垃圾费用规则、州保险法、集体诉讼先例）；(2)
              Shopify 平台依赖，以及 Shopify 原生退货 / 保障功能压缩可触达基础的可能；(3) 未披露 ARR 却有 $1.25B 标记，在 SaaS 倍数已从 2021 年峰值压缩的市场里，估值 /
              估值下调融资风险突出。


              中等层级风险包括：2026 年两项收购（Malomo 和实物 ReturnBear 逆向物流网络）的集成与运营执行；即便五星评价中也暴露的产品可靠性和 AI 支持质量问题；以及独角兽估值下公开安全 /
              隐私姿态未文档化。较低但需要监控的风险包括：前 Divvy 领导团队带来的人物集中；承运商和集成伙伴依赖；以及私营公司不披露收入、留存或单位经济数据的一般不透明性。投资含义是，Redo
              的上行空间（宽度加整合、自有国际物流）真实存在，但其耐久性受监管和平台变量卡住，而这些变量大多不在公司控制之内；因此，这个投资论点对外部政策变化的敏感度，高于单纯对内部执行的敏感度。
