      - number: '1.4'
        title: 里程碑、规模与封面指标
        blocks:
          - type: paragraph
            body: >
              Redo 大约四年里压缩了大量进展。2021–2022 年形成概念和 MVP，并完成小额种子轮；平台 2023 年 1 月上线；Snow 2023 年 9 月加入担任联合创始人兼 CEO；$24M Series
              A 轮在 2024 年 8 月完成，当时约 1,500 个品牌、73 名员工；2026 年 1 月收购 Malomo；2026 年 6 月完成 $81M Series B 轮、获得 $1.25B 估值，并收购
              ReturnBear，当时已有 4,100+ 个品牌，其中超过 1,750 个商户使用多个 Redo 产品。


              封面指标里，截至 2026 年中证据最扎实的数字包括：投后估值 $1.25B、最近一轮融资 $81M、累计融资约 $107M、平台上有 4,100+ 个品牌、1,750+ 个多产品商户，以及总部位于 Utah 州
              Draper。收入和 ARR 未披露；最后一个公开员工数是 Series A 轮（2024 年 8 月）时报告的 73 人。在两次收购和 Series B
              轮之后，当前员工数几乎肯定显著更高，但尚未确认。一些第三方追踪器列出的个位数或「1–10 人」员工数已经过时，反映的是数据库覆盖不完整，而不是实际情况。


              一个重要的前瞻因素，是 Redo 对资金用途的表述：AI 驱动的商业工具（智能体式购物体验、个性化 email/SMS 的营销 agent、提高生命周期价值的购后管家）以及借助 ReturnBear
              跨境退货网络推进国际扩张。对公司变现最相关的不利背景，是结账环节包裹保护 /「shipping protection」费用正面对更强的监管和法律审查——包括 FTC
              垃圾费规则制定、州保险法问题，以及针对同业的集体诉讼——因为买家付费保障是 Redo 从免费软件中赚钱的核心。
