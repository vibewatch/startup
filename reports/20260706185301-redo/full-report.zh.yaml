      - number: '5.2'
        title: 模块与产品线图谱
        blocks:
          - type: paragraph
            body: >
              Redo 的产品线最好理解为一组不断扩张的购后模块：部分自研、部分收购，通过共享的商户仪表盘和消费者体验统一起来。退货和理赔引擎是起点模块，也仍是核心：一个 AI 驱动的退货 /
              换货门户，通过把退款转化为换货和店铺积分来留住收入。围绕这个核心，Redo
              加入了订单编辑、包裹保障（消费者付费保障）、保修和拒付管理——这一组模块瞄准的是保护和追回收入。第二组模块面向增长和互动：Email/SMS 营销、评论、转化优化工具，以及用于 AI 辅助购物的「Agentic
              Catalog」。


              两项能力通过收购进入，显著拉宽了这张图谱。2026 年 1 月收购的 Malomo（创始人兼 CEO Yaw Aning）带来了一流的品牌化订单追踪，把承运商追踪这一时刻变成品牌自有、可营销的触点。2026 年
              6 月收购的 ReturnBear 带来端到端国际退货和逆向物流网络，以「4PL」方式运营，让美国、加拿大、英国和澳大利亚的跨境退货留在本地，立即验证退款，并声称能节省 30–60%
              退货成本、显著降低欺诈。合在一起，Redo 从数字化购后界面一路延伸到实物全球物流，跨度异常完整。


              这张图谱的战略逻辑是先落地再扩张：退货是楔子，每增加一个模块，就提高单商户收入和切换成本。公开证据显示这条路正在跑通：4,100+ 品牌中有 1,750+（约
              43%）使用不止一个模块。图谱里的风险是宽度大于深度——多个模块（营销、评论、库存）要和垂直最佳产品竞争，因此模块图谱的价值取决于集成和整合经济性，而不是每个模块都成为品类第一。
