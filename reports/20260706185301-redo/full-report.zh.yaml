chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、商业模式与公司结构
        blocks:
          - type: paragraph
            body: >
              Redo 是一家总部位于 Utah 州 Draper
              的商业科技公司，帮助直面消费者（DTC）和全渠道品牌管理完整购后旅程。公司最初从退货和换货平台切入，随后扩展成更宽的「购后操作系统」：覆盖退货与索赔、订单追踪、包裹保护、履约支持、客服、email/SMS
              营销，并越来越多地包进 AI 驱动的商业工具。对外品牌是 Redo（网站 redo.com 和 getredo.com），公司以「评分第一的电商 app」自我营销，称在 800+ 条评论中获得 4.9 星。


              Redo 商业模式最鲜明的一点，是软件对商户免费；公司从平台跑出的使用量里赚钱，主要是买家在结账时选择的退货保障和包裹保护，另有付费产品使用。CEO Sterling Snow 明确把这套模式类比为他上一家公司
              Divvy：大市场、免费软件解决痛且贵的问题、按使用量变现、相似的 GTM 动作，以及把点状工具整合进一个平台。Snow 对战略的描述不是只解决退货，而是把商户和买家在每个触点上的关系都握在手里。


              Redo 于 2023 年 1 月上线平台，目前仍是私人公司。公司与 Pelion Venture Partners 关系紧密——办公地点就在 Pelion 位于 Draper 的同一栋楼里，Snow
              也仍是该机构的 Venture Partner。Redo 的定位是帮助品牌把碎片化技术栈整合成一个智能、AI 驱动的系统，把购后运营从成本中心变成收入、留存和忠诚度引擎。
