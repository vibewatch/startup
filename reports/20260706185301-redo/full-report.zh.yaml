    approximationNotes: 示意：数值是在固定约 $100M ARR 锚点和不同倍数下推导出的 $M 估值；实际 ARR 未披露，因此本图展示倍数敏感性，不是点估值。
    claimRefs:
      - CV018
      - CV019
      - CV029
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: Redo 相对当前 $1.25B 标记的牛市 / 基准 / 熊市估值区间。
    data:
      items:
        - label: 熊市（监管 / Shopify 冲击，约 5x）
          low: 400
          high: 700
          value: 550
          unit: $M
          detail: 降价融资和资本减值；Route 从 2021 年高点转入收缩可作先例。
        - label: 基准（ARR 约 $85-125M，约 10-13x）
          low: 1000
          high: 1500
          value: 1250
          unit: $M
          detail: 如果留存和增长强劲，大致守住当前估值标记。
        - label: 牛市（ARR 约 $150M+，15x+）
          low: 3000
          high: 5000
          value: 4000
          unit: $M
          detail: 如果避开费用监管且国际业务扩张，入场后可达 2.5-4x。
    approximationNotes: 区间是基于未披露 ARR 的隐含倍数数学推导出的情景判断；不是折现现金流结果。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 关键投资 KPI 及各项披露状态；突出许多关键输入仍未披露。
    data:
      items:
        - label: 估值（Series B 轮）
          value: $1.25B
          detail: 投后，2026 年 6 月；多家媒体互相佐证。
        - label: 累计融资
          value: ~$107M
          detail: 种子轮约 $2M + Series A 轮约 $24M + Series B 轮 $81M。
        - label: 服务品牌数
          value: 4,100+
          detail: 营销口径称 4,500+；约 1,750 个多模块品牌。
        - label: 隐含 ARR
          value: ~$83-250M
          detail: 根据 5-15x 倍数推断；未披露。
        - label: ARR / 增长 / NRR
          value: Undisclosed
          detail: 左右估值的关键输入没有公开。
        - label: 建议
          value: research-more
          detail: 中等置信度；结论偏勉强；风险高。
    approximationNotes: KPI 数值混合了已披露事实（估值、融资额、品牌数）和推断 / 未披露项目；后者均明确标注，避免夸大确定性。
