      - number: '5.3'
        title: 架构与运营模式
        blocks:
          - type: paragraph
            body: >
              Redo 的运营模式是一套叠在电商平台之上的分层平台，而不是替代这些平台。最上层是消费者 / 商户体验层（品牌化退货门户、追踪页面、保障组件、保修流程、营销活动）。下面是前述应用 / 模块层。AI /
              智能层贯穿各模块：用于支持解决和销售的 AI 智能体、个性化 Email/SMS 的营销智能体、购后管家、智能体购物 / 目录功能，以及退货原因分析、欺诈检测、个性化换货推荐逻辑。数据 / 集成层把 Redo
              接入电商和 martech 生态；物流层则是 ReturnBear 带来的新增能力，通过本地退货枢纽处理实物逆向物流。


              集成宽度是 Redo 架构的核心特征。Redo 公开列出的集成覆盖平台（Shopify、Shop App、BigCommerce、Salesforce Commerce
              Cloud、CommentSold）、客服（Gorgias）、营销（Klaviyo、Attentive、Postscript，以及 Google/Meta/TikTok 广告渠道）、运营和
              3PL（Recharge、Brightpearl、Deposco、Flexport、NetSuite、ShipBob、ShipHero、fulfil.io、Two
              Boxes、Inmar）、跨境（Global-e）和承运商（FedEx、UPS、USPS、DHL、Canada Post、AusPost）。这把 Redo 放在购后技术栈的枢纽位置。架构上最深的依赖是
              Shopify：Redo 通过 Shopify App Store 分发，在 Shopify 的 checkout 和 app 框架内运行，也继承 Shopify 的平台约束（包括 checkout
              费用呈现规则）。


              运营模式把软件和实物运营混在一起。软件侧是标准多租户 SaaS 经济性（高毛利、云托管、API 集成）。ReturnBear
              侧加入实物运营——退货枢纽、合单、承运商关系，以及四个国家的本地退款验证——运营更重、毛利更低，但纯软件竞争对手很难复制。这种混合架构是 Redo 差异化的核心，也是新增运营复杂度和集成风险的主要来源。
