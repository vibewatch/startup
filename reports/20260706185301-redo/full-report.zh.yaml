      - number: '6.5'
        title: 扩张、集中度与渠道依赖
        blocks:
          - type: paragraph
            body: >
              Redo 的扩张动作，是账户内先落地再扩张（增加模块）加市场延伸（通过 ReturnBear 增加地域、通过 Malomo 增加能力）。约 1,750
              个多模块品牌证明账户内动作正在跑通；国际化和收购产品面是后续方向。集中度方面，Redo 未披露单一客户或前十大收入集中度；4,100+ 中小品牌的基础意味着单个账户集中度很低——不太可能有单一 DTC
              品牌贡献重大收入占比。相较企业客户集中的同业，这种分散基础是耐久性优势。


              主要集中风险不是客户依赖，而是渠道和平台依赖。Redo 的客户几乎都是 Shopify 商户，因此可触达基础、分发（Shopify App Store），甚至费用呈现规则（Shopify 2025
              年禁止预勾选保障框）都由单一平台控制。这会带来 Redo 控制之外的采购和政策摩擦：Shopify 政策变化可以一夜之间改变 Redo 的变现，Shopify 原生退货或保障功能也可能压缩可触达基础。伙伴 /
              集成依赖是第二条向量——客户依赖 Redo 到 Klaviyo、Gorgias、Recharge、ShipBob 和承运商的连接器，因此价值主张假设这些集成能够持续。最后，消费者付费模式把监管暴露（FTC
              垃圾费用规则、保险法审查）集中到变现客户基础的核心机制上，让收入耐久性绑定在持续演化的合规环境中。
