      - number: '6.3'
        title: 具名客户证明与参考质量
        blocks:
          - type: paragraph
            body: >
              Redo 的具名客户证明来自三类来源，参考质量不同。第一，Shopify App Store 评价（669 条评价、5.0 评分、98% 五星）点名了具体生产商户，并带有日期和第一人称叙述：Goldie
              Swimwear（接近三年，称赞持续支持，尽管偶有更新缺陷）、Creations of Christ（超过一年，提到「$1.99
              无风险试买」选项，并扩展到客服、配送和确认邮件）、AnaOno（称赞临时屏幕共享支持）、Violate The Dress Code（两年，「最轻松的供应商关系之一」）和
              Zorali。这些是生产环境参考，不是试点；其中多条独立出现在第三方 Shopify 平台上，而不是由 Redo 策划。


              第二，Redo 自己的客户页和首页展示结果型证言和头部指标——换货率提升 43%、AI 支持解决率 80%、平均订单价值提升 $4.03、退货率下降 38%、留存收入提升
              58%——但这些由公司发布且是汇总指标，并非某个具名账户的经审计结果。第三，Made by Mary、Mission Belt、Enso Rings 这些「客户天使」DTC 品牌，通过 Utah 的 DTC
              创始人网络与 Redo
              关联；它们的实时店铺确认这些品牌真实运营，但具体商业条款未披露。整体看，参考质量在覆盖面和新鲜度上很强（数百条带日期、具名、第三方生产评价），但独立审计的账户级财务结果偏薄——这也是客户为私有品牌的高增长
              SaaS 公司常见画像。
