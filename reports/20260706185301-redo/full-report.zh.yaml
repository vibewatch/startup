  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源、定价模型与收入结构
        blocks:
          - type: paragraph
            body: >
              Redo 最鲜明的财务特征，是软件对商户免费；公司不是按订阅席位收费，而是从平台流转的交易使用量中赚钱。主要收入流是买家付费保障——消费者在结账时选择（或被呈现）的退货保障和包裹 / 运输保护——Redo
              从中留下一部分。次要收入流包括扩展模块集中的付费产品使用（通过收购 Malomo 获得的订单追踪、email/SMS 营销、保修和新兴 AI agent），以及收购 ReturnBear
              之后的国际退货和逆向物流服务。这与 CEO Sterling Snow 在 Divvy 跑过的模型相似：免费软件解决昂贵且痛的问题，再从它释放出的使用量中变现。


              这一结构带来重要的会计和收入质量影响。与买家付费保护绑定的收入，更像保险 / 保修抽成，而不是经典 SaaS
              订阅收入；它会引出收入确认问题（按总额确认还是扣除已付索赔后的净额）、如果监管要求更清晰披露或主动选择默认设置被改变，费用能否保持，以及「收入」中有多少是转付、有多少是留存毛利。Redo
              未公布收入结构拆分，因此保护抽成、付费模块和物流之间的比例未知。可披露的是方向性信号：公司报告 4,100+ 个品牌、1,750+ 个商户使用多个产品，暗示交叉销售 /
              附加采用动态有意义且在增长，应随时间推高单商户收入，尽管绝对数字仍被保留。


              对尽调而言，该模型的强项是对齐（收入随 GMV / 订单量和商户成功增长）和采用摩擦低（免费安装）；弱点是，受监管费用上的使用量 /
              抽成模型，比合同订阅更暴露于政策和平台变化，而未披露任何收入结构也让公开数据无法验证收入质量。
