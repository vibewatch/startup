      - number: '3.3'
        title: 能力、定价、GTM / 分发与信任 / 监管比较
        blocks:
          - type: paragraph
            body: >
              从能力看，没有单一竞品能在一个产品里匹配 Redo 宣称的广度：Loop 和 ReturnGO 在退货 / 换货上最强，但保护和营销薄弱；AfterShip 和 Narvar
              广泛覆盖追踪和退货，但按企业级价格销售且并非免费；Route 和 Corso 在包裹保护上领先，但不提供完整退货管理后台；Malomo（现属 Redo）和 Wonderment 只专注品牌化追踪。Redo
              的卖点是，所有这些——退货、换货、追踪、保护、保修、email/SMS 营销和新兴 AI agent——都放在一个免费安装的 app 里。


              定价和 go-to-market 是 Redo 最锋利的楔子。竞品绝大多数向商户收费：Loop、AfterShip、ReturnGO 和 Corso 公布分层 SaaS
              方案（通常是月平台费加单次退货或使用量收费），Narvar 则销售定制企业合同。Redo
              反过来对商户免费，通过结账时选择的买家付费保障和包裹保护，以及付费产品使用来变现——该模型降低商户采用摩擦；公司也认为，它让 Redo 的收入与订单量而非席位数对齐。所有这些玩家的分发主要经由 Shopify
              App Store，评分和评论数量是关键 GTM 信号；Redo 对外营销称在 800+ 条评论中获得 4.9 星。


              信任和监管姿态上，买家付费阵营暴露最大。Route 因所谓未披露 shipping-protection 费用引发诉讼、FTC 2025 年围绕强制费用披露的「垃圾费」/
              不公平和欺骗性行为规则制定、州保险法对包裹保护是否属于无牌保险的疑问，以及 Shopify 2025 年禁止预勾选保护选框，共同定义了一条监管前沿；压力最大的是 Redo、Route、Corso 和
              Seel，对按订阅定价的 Loop、AfterShip 和 Narvar 相对较小。这是本章最重要的竞争不对称：Redo 摩擦更低的变现方式，也是它对监管最敏感的环节。
