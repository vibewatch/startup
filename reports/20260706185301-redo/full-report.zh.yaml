      - number: '1.3'
        title: 融资历史与估值
        blocks:
          - type: paragraph
            body: >
              自 2022 年以来，Redo 在三轮已披露融资中合计融到约 $107M。数据库显示，公司 2022 年完成约 $2M 种子轮，早期支持方包括 Pelion Venture Partners、Signal
              Peak Ventures 和天使投资人 Jack Boren；不过种子轮金额未获公司确认，应视为估算。


              Series A 轮于 2024 年 8 月 20 日完成，融资 $24M，由 Pelion Venture Partners 领投。机构投资者包括 EPIC Ventures、Kickstart
              Fund、Tandem Venture Partners、Cervin Ventures、Peterson Ventures、Signal Peak Ventures 和 AGLAÉ VENTURES（LVMH
              旗下创投部门）。一个值得注意的特征，是 Redo 自己的客户也以天使身份参投——Mary 和 Taylor Moody（Made by Mary）、Connor MacArthur（Mission
              Belt）、Aaron Dalley（Enso Rings）——同时还有一批 Utah 知名运营者，包括 Blake Murray、Alex Bean、Adam Edmunds、Jeremy Andrus 和
              Jeron Paul。Series A 时，公司报告约 1,500 个品牌和 73 名员工。


              Series B 轮于 2026 年 6 月 24 日公布：按报道投后估值 $1.25B 融资 $81M——进入独角兽行列——由 Smash Capital（Paul Szurek）领投，老股东 Pelion
              Venture Partners 和 Cervin Ventures 参投。公司称，部分资金已经用于收购 ReturnBear；ReturnBear 是一家覆盖 100+
              个国家的国际退货和逆向物流服务商。此前，Redo 已在 2026 年 1 月收购品牌化订单追踪平台 Malomo。从 2024 年 8 月 $24M Series A 轮到不到两年后 $1.25B
              估值，这次跳升意味着激进重估，后续章节会用收入和可比倍数检验。公司未披露准确收入、ARR 或精确累计融资额。
