  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Public price, net price, and reimbursement assumptions for AGA2118 and AGA2115.
    whyItMatters: Dollar TAM and commercial adoption modeling are weak without any pricing or access guidance
      from the company.
    diligencePath: Request internal launch planning assumptions, payer research, and analog pricing benchmarks.
    relatedQuestionRefs:
    - QM022
  - type: missing-source
    severity: material
    topic: tam-math
    missingEvidence: Management-authored TAM, SAM, or SOM math for Angitia’s osteoporosis and osteogenesis
      imperfecta programs.
    whyItMatters: The chapter can size patient pools, but not revenue opportunity, with high confidence
      using only public sources.
    diligencePath: Request investor deck slides or internal market models used in financing materials.
    relatedQuestionRefs:
    - QM023
  - type: private-evidence-only
    severity: material
    topic: payer-readiness
    missingEvidence: Payer interviews, formulary strategy, and reimbursement readiness work for AGA2118
      and AGA2115.
    whyItMatters: Adoption path and net pricing are ultimately payer-mediated in both osteoporosis and
      rare disease markets.
    diligencePath: Ask management for market research, payer advisory work, and planned HEOR package development.
    relatedQuestionRefs:
    - QM015
    - QM016
    - QM020
    - QM021
