- id: osteoporosis-market-lens
  title: Osteoporosis market lens
  body: 'The osteoporosis market is large in prevalence terms and highly selective in treated-value terms.
    Official U.S. public-health sources say 18.8% of women age 50 and older have osteoporosis of the femur
    neck or lumbar spine, while BHOF says roughly 54 million Americans have low bone mass or osteoporosis.
    Angitia’s own disease page cites more than 200 million people worldwide with osteoporosis. Those statistics
    establish disease burden, but they do not define Angitia’s actual addressable market. The more relevant
    market lens is the high-fracture-risk anabolic segment already shaped by romosozumab. Evenity’s label
    shows the archetype: female patients with postmenopausal osteoporosis at high fracture risk. That
    segment is clinically meaningful and commercially attractive because fracture prevention, treatment
    sequencing, and rapid BMD gain all matter. It is also difficult. The marketed segment already carries
    cardiovascular warning language, monitoring needs, and payer scrutiny. UCB’s real-world evidence suggests
    romosozumab has meaningful bone-density impact and growing first-line use in some settings, but it
    also reinforces how concentrated specialist prescribing and treatment sequencing remain. For Angitia,
    this means AGA2118 competes in a real market with proof of demand, but not an easy or undifferentiated
    one.'
