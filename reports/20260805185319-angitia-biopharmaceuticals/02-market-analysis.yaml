  - - Romosozumab cardiovascular warning and monitoring burden
    - Negative
    - Now
    - Shows the marketed bar for safety and risk-benefit debate in the anabolic segment
    - Assess whether AGA2118 can differentiate on risk profile
  - - Guideline-based sequencing
    - Mixed
    - Now
    - Supports premium use in high-risk patients but narrows use to selected pathways
    - Map where AGA2118 would fit in sequencing logic
  - - No globally approved OI therapy
    - Positive
    - Now
    - Keeps OI as an open opportunity with high unmet need
    - Assess rare-disease pricing, access, and endpoint strategy
  - - Setrusumab Phase 3 fracture miss
    - Mixed
    - Recent
    - Confirms unmet need but raises proof bar beyond BMD gains
    - Demand stronger fracture or clinically meaningful outcome thesis for AGA2115
  - - Specialist-center concentration
    - Negative
    - Now
    - Narrows GTM surface in both osteoporosis and OI
    - Map KOL network and center concentration risk
  - - No public Angitia pricing or TAM math
    - Negative
    - Current diligence gap
    - Limits commercial-model confidence
    - Request internal market model and payer work
  notes: This table blends market growth drivers with adoption constraints because Angitia’s opportunity
