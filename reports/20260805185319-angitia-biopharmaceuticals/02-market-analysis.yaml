    - Adults at high fracture risk
    - Commercial and public insurers
    - Specialist identifies fracture risk and sequences anabolic therapy
    - Primary AGA2118 segment
  - - Treatment-naïve anabolic candidates
    - Same specialist cohort as above
    - Patients for whom rapid bone-building matters
    - Insurers evaluating high-cost therapy against outcomes
    - Guideline-based sequencing and fracture prevention logic
    - Relevant because romosozumab adoption shows pathway already exists
  - - Adult osteogenesis imperfecta
    - Metabolic bone specialists and rare-disease centers
    - Adults living with OI
    - Specialty reimbursement channels
    - Lifelong fracture-management need; limited curative options
    - Potential AGA2115 population
  - - Pediatric osteogenesis imperfecta
    - Pediatric orthopedic and metabolic bone centers
    - Children with OI and families
    - Rare-disease and pediatric reimbursement pathways
    - High specialist concentration and referral dependence
    - Potential expansion logic for AGA2115
