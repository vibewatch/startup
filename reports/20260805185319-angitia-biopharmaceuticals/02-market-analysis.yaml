- id: osteogenesis-imperfecta-submarket
  title: Osteogenesis imperfecta submarket
  body: The osteogenesis imperfecta submarket is much smaller in headcount than osteoporosis but more
    acute in unmet need and specialty intensity. OIF and Stanford materials describe OI as a lifelong,
    fracture-prone rare disease requiring multidisciplinary management, with roughly 25,000 to 50,000
    affected people in the United States. Angitia’s disease page frames global prevalence at roughly 1
    in 10,000 to 20,000 people. Late-stage competitor disclosures sharpen the commercial context. Both
    Ultragenyx and Mereo said in late 2025 that no treatment was globally approved for OI, and both reported
    that setrusumab missed primary fracture endpoints even while improving bone mineral density. That
    is crucial context for AGA2115. It means the market remains medically important and commercially open,
    but it also means that biomarker or BMD improvement alone may not be enough to establish a durable
    commercial standard. The likely buyer and user base is concentrated in rare-disease referral centers,
    pediatric orthopedic networks, and metabolic bone specialists, with payers evaluating a high-cost
    specialty therapy against a very small denominator and very high unmet need.
