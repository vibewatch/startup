- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend or patient pool
  - Excluded spend
  - Buyer / user / payer
  - Why it matters to Angitia
  rows:
  - - High-risk postmenopausal osteoporosis
    - Severe or fracture-prone patients eligible for anabolic / specialist therapy
    - General bone health, supplements, low-risk osteopenia, broad primary-care screening
    - 'Buyer: specialist prescriber; User: patient; Payer: insurer / health system'
    - This is the closest current market analog for AGA2118
  - - Broader osteoporosis burden
    - Prevalence and treatment-gap pool used to size disease burden
    - Entire musculoskeletal or senior-care spending
    - Public-health agencies and foundations define burden, not direct product demand
    - Provides top-of-funnel need but overstates near-term revenue opportunity
  - - Osteogenesis imperfecta
    - Rare-disease patient population under specialty management
    - General pediatric orthopedics or unrelated bone disorders
    - 'Buyer: rare-disease centers; User: patients/families; Payer: specialty reimbursement pathways'
    - This is the core future market for AGA2115
  - - Legacy spinal fusion biologics
    - Hospital / surgeon-led spinal-fusion adjunct market
    - Non-biologic orthopedic hardware and unrelated spine surgery services
    - 'Buyer: hospital systems and surgeons'
    - Relevant historically because AGA111 has been terminated
  notes: The table intentionally separates disease prevalence from the narrower specialist-treated niches
    that matter for Angitia’s two lead bispecific programs.
