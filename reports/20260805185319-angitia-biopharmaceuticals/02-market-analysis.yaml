chapter:
  number: 2
  title: Market Analysis
  summary: 'Angitia’s market is large in disease burden but much smaller in specialist-treated commercial
    reality: AGA2118 targets the high-fracture-risk osteoporosis segment already shaped by romosozumab,
    while AGA2115 targets the concentrated rare-disease osteogenesis imperfecta niche where unmet need
    remains high after setrusumab’s Phase 3 fracture miss. Public sources support patient-count and workflow
    lenses better than broad dollar TAM claims because Angitia does not disclose pricing or management
    SAM/TAM math.'
sections:
- id: market-boundary-and-segmentation
  title: Market boundary and segmentation
  body: 'Angitia does not address the entire musculoskeletal market. Its commercial relevance sits in
    two much narrower therapeutic markets: high-fracture-risk osteoporosis and osteogenesis imperfecta,
    with legacy exposure to spinal fusion from the now-terminated AGA111 program. That distinction matters
    because broad musculoskeletal spending figures would wildly overstate the opportunity. In osteoporosis,
    the relevant comparison set is not vitamins, generic bisphosphonates, or the entire primary-care bone-health
    universe; it is the subset of postmenopausal and otherwise high-risk patients for whom bone-building
    or advanced biologic therapy is clinically justified. In osteogenesis imperfecta, the market is smaller
    still and concentrated in rare-disease referral centers, not community-scale prescribing. Company
    materials are actually relatively disciplined on this point: Angitia’s own disease and product pages
    stay close to clearly defined bone-metabolism indications instead of claiming a generalized musculoskeletal
    platform. The right boundary for this chapter is therefore evidence-constrained and specialty-led:
    a large prevalent osteoporosis burden narrowing into a much smaller severe-treatment niche, plus a
    rare but strategically important osteogenesis imperfecta segment.'
