companyProfile:
  summary: >-
    Angitia Biopharmaceuticals is a private clinical-stage musculoskeletal biotech founded in 2018
    with a Westlake Village-Guangzhou footprint and a specialist investor roster spanning Bain,
    Frazier, Venrock, BlackRock-managed funds, RA Capital, Wellington, Hillhouse, and OrbiMed.
    The company’s current value proposition rests on two Phase 2 bispecific antibody programs —
    AGA2118 in osteoporosis and AGA2115 in osteogenesis imperfecta — after the mid-2026
    termination of the earlier AGA111 spinal-fusion program. Public evidence supports strong
    financing momentum and real scientific option value, but not enough operating and valuation
    disclosure for a high-conviction premium-price underwrite.
