  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: CMC-and-quality-system
    missingEvidence: Detailed manufacturing process, batch-release controls, vendor dependencies, and
      quality-system maturity.
    whyItMatters: Operational failure on biologic supply can break both trials and commercialization.
    diligencePath: Request CMC risk register, QA system summary, and tech-transfer status.
    relatedQuestionRefs:
    - QR011
    - QR021
  - type: private-evidence-only
    severity: material
    topic: cash-burn-runway
    missingEvidence: Current cash balance, monthly burn, debt facilities, and downside runway.
    whyItMatters: Financing risk cannot be sized without the denominator.
    diligencePath: Request cash bridge, debt schedule, and 24-month budget.
    relatedQuestionRefs:
    - QR014
    - QR018
    - QR025
  - type: private-evidence-only
    severity: material
    topic: FTO-and-litigation
    missingEvidence: Counsel memo on patent claim scope, FTO, and any threatened disputes.
