  - TR003
  - TR004
  figureRefs:
  - FR002
  - FR003
- id: financial-customer-and-thesis-break-risk
  title: Financial, customer, and thesis-break risk
  body: 'Financial risk matters, but at this stage it should be treated as concentration and opacity risk
    rather than as obvious capital starvation. Recent rounds prove that Angitia can raise money. What
    they do not prove is that cash, burn, runway, and debt are aligned with the company’s remaining execution
    burden. The company is also more concentrated after AGA111’s exit; more of the whole thesis now sits
    on AGA2118 and AGA2115. Customer-pathway evidence adds to that concentration picture. Future adoption
    is likely to depend on a small number of specialists, centers, and payer decisions rather than on
    a broad, forgiving market. That means weak Phase 2 results, emerging safety concerns, or a hard-to-explain
    regulatory signal could transmit quickly into financing stress and valuation compression. The right
    response is not panic but discipline: milestone-based underwriting, explicit kill criteria, and close
    monitoring of data quality, safety language, IP scope, and commercialization-readiness signals. Angitia
    is promising enough to warrant attention, but not safe enough to underwrite casually. That is the
    hallmark of a high-upside but high-discipline situation, not a set-and-forget growth story. Pricing
    discipline, milestone gating, and fast escalation paths should all be explicit before committing capital.'
  claimRefs:
