chapter:
  number: 7
  title: Risks
  summary: Angitia’s risk profile is dominated by clinical and regulatory fragility rather than by lack
    of investor interest. AGA111’s Phase 3 termination proves late-stage downside is real, comparator
    labels show how safety burden can shape this category, and the company remains under-disclosed on
    CMC, cash, and launch-quality operations.
sections:
- id: regulatory-and-legal-risk
  title: Regulatory and legal risk
  body: 'Regulatory and legal risk sits at the top of the Angitia stack because the company’s value is
    still mostly a claim on future approvals. The clearest adverse evidence already exists inside the
    company’s own history: AGA111 made it to Phase 3 and still failed to remain part of the forward thesis.
    That alone should prevent investors from treating promising bone biology as self-validating. External
    regulatory templates reinforce the point. Evenity’s official label shows that bone-building therapies
    can accumulate major warning-language burdens around cardiovascular events, hypocalcemia, osteonecrosis
    of the jaw, and atypical femoral fractures. TYMLOS and FORTEO show a different but equally important
    template: bone-anabolic therapies can inherit osteosarcoma-oriented warnings and use constraints.
    None of this means Angitia will necessarily face the same outcomes. It does mean regulators and prescribers
    in this category already have a strong risk vocabulary. Legal risk is similar. The 2026 patent grant
    and related application prove real IP progress, but they do not prove freedom to operate, durable
    claim breadth, or immunity from challenges. In other words, Angitia has enough legal and regulatory
    substance to matter, but not enough to relax diligence. Investors should assume label scrutiny will
    be intense because category history already supplies regulators with concrete warning frameworks and
    post-approval cautionary examples. The burden of proof is unforgiving.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR006
