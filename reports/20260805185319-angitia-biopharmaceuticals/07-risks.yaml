- id: operational-and-dependency-risk
  title: Operational and dependency risk
  body: Operational risk is the second pillar because Angitia’s future value still depends on executing
    complicated studies and eventually making biologics reproducibly. Public trial records show at least
    two active interventional programs and a legacy late-stage program that already demonstrated how large
    and unwieldy the execution burden can become. Trial-site coordination, enrollment quality, protocol
    fidelity, and endpoint sensitivity are all real hazards, and they compound once a company is managing
    multiple specialized disease contexts. The public record is also thin on manufacturing, quality systems,
    and supply readiness. That matters more here than it would in a software business because biologic
    production problems can directly interrupt studies or stall regulatory progress. Dependencies therefore
    run through clinical sites, manufacturing readiness, regulators, and a relatively small specialist
    ecosystem. The jobs and culture pages show organizational activity, but they do not prove bench depth
    or reduce key-person risk. Operationally, the right mental model is a science-heavy company with visible
    trial motion and hidden process risk. That is fundable, but only if investors are explicit about which
    missing operational details could become thesis-breaking later. In practice, that means diligence
    has to reach below scientific abstracts into QA, vendor, and study-governance mechanics.
  claimRefs:
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
  - CR024
  - CR025
  - CR026
  - CR027
  - CR028
  - CR034
  - CR038
  tableRefs:
