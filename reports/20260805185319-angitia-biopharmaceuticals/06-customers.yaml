- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Angitia’s likely customer journey starts with disease identification and specialist referral,
    not with consumer demand capture.
  data:
    items:
    - stage: Identify
      label: Patient is diagnosed or flagged as high risk
      detail: Silent-disease or fragility patterns bring the patient into specialist evaluation.
    - stage: Evaluate
      label: Specialist and payer gatekeeping begins
      detail: DXA, fracture history, genetics, and guideline context shape treatment eligibility.
    - stage: Enroll / Initiate
      label: Trial or future treatment starts
      detail: Today this mostly means study enrollment and dosing rather than commercial purchase.
    - stage: Monitor
      label: Safety and outcome follow-up
      detail: Bone density, fractures, symptoms, and specialist follow-up matter.
    - stage: Advocate
      label: Patient and family trust loop forms
      detail: Rare-disease and chronic-bone pathways depend on trust, education, and persistence.
    - stage: Expand
      label: Channel broadens only if evidence wins
      detail: Future growth depends on label strength, payer access, and referral-center adoption.
