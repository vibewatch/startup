chapter:
  number: 6
  title: Customers
  summary: Angitia has clear future customer segments but weak verified adoption. Public sources define
    the physician-patient-payer chains for osteoporosis and OI, and trial milestones prove real clinical
    participation, yet there is no commercial customer list, retention data, or payer-acceptance proof;
    customer diligence must therefore focus on KOLs, centers, and payers rather than logos.
sections:
- id: future-customer-definition
  title: Future customer definition
  body: Angitia is pre-commercial, so the customer question is not “who is paying today?” but “who would
    have to say yes if the science works?” The answer is a three-sided healthcare chain. Physicians and
    specialist centers are the operational users because they diagnose, select, and monitor treatment.
    Patients and families are the lived users because they bear the burden of osteoporosis or osteogenesis
    imperfecta outcomes. Payers are the economic gatekeepers because access to branded biologics will
    almost certainly require coverage support, prior authorization, or other evidence-based review. Public
    provider and foundation sources make this structure clear. Osteoporosis treatment flows through diagnosis,
    fracture risk assessment, DXA measurement, and treatment selection; OI flows through a smaller, more
    concentrated rare-disease ecosystem with genetic context, lifelong fragility management, and heavy
    specialist-center involvement. This is important because Angitia’s future customer base is legible
    even though its current customer base is not. The company is not aiming at a diffuse consumer market.
    It is aiming at physician-mediated adoption inside structured bone-disease pathways. That gives the
    future segment map unusual clarity, but it also means adoption will be gated by a relatively small
    number of specialists, payer reviewers, and community trust nodes. That concentration can accelerate
    focused commercialization, but only if Angitia wins trust quickly.
  claimRefs:
