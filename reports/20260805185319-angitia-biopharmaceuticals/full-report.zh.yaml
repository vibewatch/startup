  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              监管与法律风险处在 Angitia 风险栈顶端，因为公司价值仍主要押在未来获批上。最清楚的不利证据已经存在于公司自身历史：AGA111 走到 3
              期，仍未能留在未来论点里。仅这一点就应阻止投资人把有前景的骨生物学视为自我验证。外部监管模板也强化了这一点。Evenity
              官方标签显示，促骨形成疗法可能在心血管事件、低钙血症、颌骨坏死和非典型股骨骨折上累积重大警示语负担。TYMLOS 和 FORTEO
              则展示另一个同样重要的模板：骨合成代谢疗法可能继承面向骨肉瘤的警示和使用约束。这些都不意味着 Angitia 必然遭遇同样结果。它意味着该品类的监管者和处方医生已经有强风险词汇。法律风险类似。2026
              年专利授权及相关申请证明真实 IP 进展，但不证明自由实施、权利要求宽度持久，或不会遭遇挑战。换句话说，Angitia
              有足够法律和监管实质值得重视，但不足以放松尽调。投资人应假设标签审查会很严，因为品类历史已经为监管者提供了具体警示框架和获批后谨慎案例。证明负担非常苛刻。
