      - number: '6.2'
        title: 当前采用证据及其局限
        blocks:
          - type: paragraph
            body: >-
              最强的公开采用证据是试验参与，而不是商业部署。ARTEMIS 首例患者给药和入组完成，说明 AGA2118 已走到中心启动、合格患者可进入中期研究的阶段。IDUN 首例受试者给药对 OI 场景下的 AGA2115
              起到类似作用。这些里程碑重要。它们是目前最清楚的证据，证明 Angitia 的项目不只是
              PPT。但它们也是很窄的证据。入组和给药验证了研究者兴趣、患者参与意愿和一定程度的中心准备度；它们不验证真实世界需求、支付方接受度，或产品商业化后的持续使用。因此，本章有意把具名客户证明框定为一组代理。最好的公开类比是专科中心、医疗服务路径和患者基金会，它们显示未来采用决策会发生在哪里。它们都不能证明
              Angitia 已经嵌入护理。公开记录也没有披露付费客户名单、商业账户、患者留存数据或重复使用指标。因此，虽然采用图景已经足以显示真实市场表面，但距离经过验证的客户牵引故事仍很远。
