      - number: '6.3'
        title: 留存韧性、扩张与集中度
        blocks:
          - type: paragraph
            body: >-
              Angitia 没有获批产品，因此留存韧性必须作为未来状态风险来评估，而不是当前指标。没有 NRR、GRR、续约或治疗持续性披露可查。投资人只能从渠道结构推理。若 AGA2118
              展示出有说服力的结局和安全性，骨质疏松症机会足够广，可以支撑有意义扩张；但它也被医生信任和支付方审查强力把关。OI
              机会更小，可能更容易按中心逐个绘制，但这种集中本身提高了关键人物和中心依赖风险。两种情况下，未来客户表面都可能窄到让少数意见领袖、转诊中心和支付方决定不成比例地塑造结果。2026 年 6 月 AGA111
              终止又增加了一层集中效应：它减少了 Angitia
              历史上的骨科邻近性，让公司的采用论点更多押在两个双特异性项目上。净结果是，公司有清晰目标细分和可识别未来渠道，但商业留存韧性证明有限，集中度风险也实质存在。客户尽调因此应聚焦
              KOL、中心和支付方，而不是客户标识或泛泛市场规模图。今天，地图比持久使用证明更清楚。
