    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、布局与公司阶段
        blocks:
          - type: paragraph
            body: >-
              Angitia Biopharmaceuticals 是一家私营临床阶段生物技术公司，聚焦严重肌肉骨骼疾病疗法，而不是多元化商业药物组合。公司公开主页和历史材料把成立时间放在 2018
              年，提到早期天使轮支持，并显示其发展路径围绕骨生物学、骨质疏松症、成骨不全症和脊柱融合展开。当前公司联系材料列出双据点：加州 Westlake Village 总部和中国广州办公室。双据点重要，是因为
              Angitia 不是只有美国邮箱的中国起源骨病生物技术公司；公开材料显示它有真实的跨境运营结构，覆盖研究、临床开发和融资渠道。Seedtable、Caplight 等第三方资料也把业务锚定在 Westlake
              Village，并将其归类为仍为私营、仍在运营、最近披露融资为 2026 年 2 月 Series D
              的公司。公开来源没有显示客户数、收入或有定价的投后估值，因此正确概括是：私营、临床活跃、融资能力越来越强，但尚未商业化验证。
