      - number: '2.4'
        title: 增长驱动、约束与采用路径
        blocks:
          - type: paragraph
            body: >-
              Angitia
              所处市场的增长逻辑很直接：人口老龄化、骨折后持续治疗不足，以及真正差异化促骨形成选择稀缺，都让更好疗法的需求保持存在。约束也同样直接：疗效必须转化为与骨折相关的结局，安全性和治疗排序很关键，支付方会审查高价专科疗法，商业采用则流经相对狭窄的处方医生群体。在骨质疏松症里，指南机构和真实世界证据都指向一个已经理解促骨形成治疗、却仍难以大规模弥合治疗缺口的市场。在
              OI 里，市场更窄、更靠关系驱动，专科中心集中；setrusumab 3 期失利后，也没有明显商业模板。因此，本章采用患者数和工作流视角，而不是膨胀的收入 TAM 数学。Angitia
              可能在追逐有吸引力的利基，但真实商业机会取决于两件事：AGA2118 能否跨过既有 romosozumab 市场设下的门槛；AGA2115
              能否把罕见病未满足需求转化为临床上、支付方眼中都相关的护理标准。公开来源尚未披露 Angitia 的定价或准入假设，这些仍是必要尽调问题。
