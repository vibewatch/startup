      - number: '5.3'
        title: 信任、质量与成熟度
        blocks:
          - type: paragraph
            body: >-
              Angitia 产品包里最强的信任信号是流程质量，而不是市场证明。ClinicalTrials.gov 和 ICH GCP 记录显示正式的多中心、盲法、分阶段试验设计；ASBMR 和 AAOS
              会议展示也形成了可见的科学披露节奏。这是真实的开发组织运营证据。它也明显不同于对上市准备度的信任。保留下来的公开材料没有给出详细 CMC
              包、药物警戒系统、商业供应叙事或大规模报销运营打法。这让产品成熟度图景不均衡。AGA2118 看起来是最清楚的近期技术项目，因为它把新颖生物学与广阔专科市场中的活跃 2 期研究结合起来。AGA2115
              有一个有吸引力的罕见病位置，但仍需证明生物学能转化为脆骨患者真正关心的结局。AGA111
              现在更适合作为平台风险教训，而不是价值来源。招聘和文化页面显示一些从业者活动，但它们只是工程或制造真实披露的薄弱代理。正确的成熟度结论因此是混合的：科学上有意思、临床上在推进、运营上依赖重，且就高确信度产品承保而言仍披露不足。
