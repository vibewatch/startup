  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与分层
        blocks:
          - type: paragraph
            body: >-
              Angitia 并不覆盖整个肌肉骨骼市场。它的商业相关性落在两个窄得多的治疗市场：高骨折风险骨质疏松症和成骨不全症，另有已终止 AGA111
              项目带来的历史脊柱融合敞口。这个区分重要，因为宽泛的肌肉骨骼支出数字会极大夸大机会。在骨质疏松症里，相关对照不是维生素、仿制双膦酸盐或整个基层骨健康领域，而是那些临床上有理由使用促骨形成或高级生物制剂治疗的绝经后及其他高风险患者子集。在成骨不全症里，市场更小，集中在罕见病转诊中心，而不是社区规模处方。公司材料在这一点上其实相对克制：Angitia
              自己的疾病和产品页面贴近定义清楚的骨代谢适应症，而不是宣称一个泛化的肌肉骨骼平台。因此，本章的正确边界是证据约束、专科主导：庞大的骨质疏松症患病负担，收窄成小得多的重症治疗利基，加上一个罕见但战略上重要的成骨不全症细分。
