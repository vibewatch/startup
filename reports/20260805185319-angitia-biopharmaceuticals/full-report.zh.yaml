      - number: '3.3'
        title: 护城河耐久性、转换成本与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Angitia 可能的主要护城河是生物学差异化，而不是商业基础设施。如果 AGA2118 的硬化蛋白 / DKK1
              双靶点策略能相对既有促骨形成或抗吸收选择拉开有临床意义的结局差距，它就会重要。setrusumab 失手后，AGA2115
              也可能受益于罕见病领域的开放窗口。但这些仍是假设，不是护城河。今天的市场权力在现有玩家和准备更充分的罕见病运营者手里：Evenity 拥有标签背书的信任，Forteo 和 TYMLOS
              拥有熟悉度与支持项目，Prolia 拥有治疗排序引力，Ultragenyx/Mereo 拥有更深的 OI
              运营成熟度。因此，转换成本是多维的。在骨质疏松症里，它们包括支付方授权、安全性舒适度、医生习惯，以及留在已知品牌上的便利。在 OI 里，它们包括专科中心保守性，以及证明与骨折相关获益的要求。AGA111
              终止后，Angitia 也失去了一部分宽度；公司更聚焦，但也更暴露于双特异性论点成败。竞争尽调因此应少看 PPT 式差异化，多看 Angitia
              能否在规则已由现有玩家定义的细分里赢得信任。因此，真正的竞争问题其实是排序问题：医生或支付方何时会从已知骨质疏松症或罕见病选择转向 Angitia，什么证据会迫使他们改变？答案具体之前，Angitia
              仍是科学主导的挑战者，而不是护城河稳固的未来品类领导者。证明负担因此同时落在商业、临床和组织三条线上。
