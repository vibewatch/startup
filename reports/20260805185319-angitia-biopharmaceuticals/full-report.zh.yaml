      - number: '1.4'
        title: 管线里程碑与当前状态
        blocks:
          - type: paragraph
            body: >-
              Angitia 的公开时间线显示，公司先用早期资本搭建骨病平台，之后转向差异化更强的生物制剂资产。AGA111 是第一个临床推进较深的项目，从 I/II 期进入中国 3 期注册研究，并在 2026
              年初前一直是公司核心项目。与此同时，AGA2118 从首次人体试验推进到全球骨质疏松症 2 期 ARTEMIS 试验，AGA2115 则从首次人体试验推进到成骨不全症全球 2 期 IDUN
              试验。这两个双特异性抗体靶向硬化蛋白和 DKK1，是公司差异化最强的项目。复杂之处在于，公开披露到 2026 年中开始分叉。公司页面和 2 月融资公告仍称有三个临床阶段资产，但 2026 年 6
              月登记库和行业媒体报道显示，AGA111 3 期研究已终止，Angitia 正把注意力转向两个双特异性项目。这个披露时滞本身就是尽调信号。因此，当前公开图景对 AGA2118 和 AGA2115
              的科学动能最强，对 Angitia 在战略变化后更新历史材料的速度则较弱。
