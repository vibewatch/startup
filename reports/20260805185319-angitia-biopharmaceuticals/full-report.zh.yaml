companyProfile:
  summary: >-
    Angitia Biopharmaceuticals 是一家私营临床阶段肌肉骨骼生物技术公司，2018 年成立，布局 Westlake Village 与广州，专科投资人名单覆盖
    Bain、Frazier、Venrock、BlackRock 管理基金、RA Capital、Wellington、Hillhouse 和 OrbiMed。公司当前价值主张押在两个 2 期双特异性抗体项目上——骨质疏松症
    AGA2118 与成骨不全症 AGA2115；较早的 AGA111 脊柱融合项目已在 2026 年中终止。公开证据支持强融资动能和真实科学期权价值，但经营与估值披露仍不足，难以高确信度承保溢价买入。
