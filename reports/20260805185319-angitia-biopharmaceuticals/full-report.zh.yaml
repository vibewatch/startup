  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与披露缺口
        blocks:
          - type: paragraph
            body: >-
              从财务上看，Angitia
              更像临床阶段资产开发商，而不是一家已有可见商业收入的企业。公开材料显示两个主要抗体项目、正在进行的干预性试验，以及按私营生物技术公司标准相当可观的融资历史；但它没有显示获批产品、确认销售额或运营收入细节。这意味着财务故事要从缺失项讲起。AGA2118
              或 AGA2115
              没有公开标价，没有披露合作经济条款，没有里程碑收入流，也没有披露类似经常性收入的项目。换句话说，投资人被要求在缺少通常公开脚手架的情况下，承保未来疗法经济性，而这些脚手架本应把科学连接到实际美元。当前材料中最可信的收入桥接因此是概念性的：推进资产、产出数据、吸引融资，最终把一个或多个项目转化为获批且可报销的产品。在那之前，公司的经济引擎是股权资本。这对临床阶段生物技术公司并不罕见，但它重要，因为承保负担从历史利润表转向资本充足性、项目优先级和里程碑可信度。因此，即使是
              Caplight 这类乐观估值表面，也应被理解为融资渠道或二级市场兴趣信号，而不是收入质量或近期现金生成能力的证据。
