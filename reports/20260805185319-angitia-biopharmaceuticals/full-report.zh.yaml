      - CV042
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 投资人付什么价格，比公司是否有意思更重要。
    data:
      items:
        - label: Mereo 下行视角
          value: 55
          description: 一个弱得多的上市罕见病故事，以百万美元计的近似公开股权价值。
        - label: Ultragenyx 罕见病视角
          value: 2450
          description: 一个更成熟的罕见病业务，以百万美元计的近似公开股权价值。
        - label: 假设独角兽锚点
          value: 1000
          description: 如果这是要价，该示意锚点代表 1B 的私募估值标记。
        - label: 基准情形公开舒适区间中点
          value: 850
          description: 作者判断当前公开证据从哪里开始不再显得那么透支。
        - label: 悲观情形公开舒适区间中点
          value: 600
          description: 作者对不确定性下更保守入场点的判断。
        - label: 乐观情形拉伸区间中点
          value: 1300
          description: 需要比当前公开材料更强的证据。
    approximationNotes: 柱状图混合了公开可比公司点位和作者情景锚点，用来展示价格敏感性，而不是断言某个数值就是今天的真实估值标记。
    claimRefs:
      - CV013
      - CV015
      - CV020
      - CV024
      - CV025
      - CV040
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 情景区间说明，只有证据改善或入场价格改善时，当前定价才会有吸引力。
    data:
      items:
        - label: 悲观情形
          low: 500
          mid: 600
          high: 750
          unit: USD millions
        - label: 基准情形
          low: 700
          mid: 850
          high: 1000
          unit: USD millions
        - label: 乐观情形
          low: 1200
          mid: 1400
          high: 1600
          unit: USD millions
        - label: 示意性当前要价窗口
          low: 1000
          mid: 1100
          high: 1200
          unit: USD millions
    approximationNotes: 区间是作者估算，锚定保留下来的公开可比区间、融资动量以及目前缺少清晰运营分母这一事实。
    claimRefs:
      - CV018
      - CV019
