      - number: '8.2'
        title: 估值语境与情景区间
        blocks:
          - type: paragraph
            body: >-
              公开估值语境最好被读成一组信号，而不是一个干净标记。Series C 和 Series D 明确确认融资动能；Caplight 和 Seedtable
              则暗示这是一家被充分跟踪、累计融资可观、且有一定二级市场兴趣的私营公司。但这些来源也没有给投资人足够材料来证明精确估值。情景框架因此比假装精确的小数点更重要。熊市情景下，混合的 2
              期数据、安全性模糊或融资压力再起，可能把 Angitia
              推向低得多的区间，更像承压开发同业，而不是备受追捧的私营赢家。基准情景下，一个强主要资产和持续融资渠道可能保住相对早期生物技术公司的显著溢价，但仍只能部分支撑当前独角兽级定价。牛市情景下，剩余管线若读出强且有临床意义的数据，可能支撑高溢价的罕见病或骨生物学期权价值。当前公开证据没有告诉投资人，他们已经在为什么状态付钱。正因这种不确定，私募价格可以在叙事上说得通，同时对纪律型买方仍支撑不足。这里不能省掉情景工作；它是避免虚假精确的唯一诚实办法。
