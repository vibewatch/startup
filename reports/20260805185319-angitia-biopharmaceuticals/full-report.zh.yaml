  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 资产图谱与临床使用场景
        blocks:
          - type: paragraph
            body: >-
              Angitia
              的产品故事最好理解为一张面向专科骨病工作流的临床资产图谱。公司不是在销售横向技术平台；它在开发生物制剂候选物，嵌入骨质疏松症、成骨不全症以及历史上的脊柱融合等由医生管理的护理路径。公开来源持续显示三个具名资产：骨质疏松症
              AGA2118、成骨不全症 AGA2115，以及历史 AGA111 脊柱融合项目。这些资产重要，因为它们定义了产品应如何按工作流来读。AGA2118 试图进入高风险骨质疏松症患者的骨构建治疗决策。AGA2115
              试图服务一条由专科转诊中心和长期监测主导的罕见病路径。AGA111
              代表的则是邻近器械的骨科工作流，而非慢性专科生物制剂路径。临床指南进一步说明，这些不是随意使用或面向消费者的疗法；它们处在证据密集、由医生控制的治疗闭环里。这个框架重要，因为它设定了产品成熟度的真实门槛。对
              Angitia
              来说，成熟度不是精致的商业品牌或宽泛功能目录，而是一条链：机制逻辑、可用的临床设计，以及足够穿过受监管专科工作流的运营支持。按这个标准，公开证据显示一张真实的多资产产品图谱，但它仍扎根于试验执行，而不是市场交付。
