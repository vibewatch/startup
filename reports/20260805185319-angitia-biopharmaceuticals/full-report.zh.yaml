      - number: '2.2'
        title: 骨质疏松症市场视角
        blocks:
          - type: paragraph
            body: >-
              骨质疏松症按患病人数看很大，按可治疗价值看却高度筛选。美国官方公共卫生来源称，50 岁及以上女性中 18.8% 存在股骨颈或腰椎骨质疏松症；BHOF 称约 5400 万美国人有低骨量或骨质疏松症。Angitia
              自己的疾病页面引用全球逾 2 亿人患有骨质疏松症。这些统计证明疾病负担，但不定义 Angitia 的真实可服务市场。更相关的市场视角，是已经由 romosozumab 塑形的高骨折风险促骨形成细分。Evenity
              标签给出了原型：处于高骨折风险的绝经后骨质疏松女性患者。这个细分临床意义明确，商业吸引力也强，因为骨折预防、治疗排序和快速 BMD
              提升都重要。它也很难。已上市细分已经带有心血管警示语、监测需求和支付方审查。UCB 的真实世界证据显示 romosozumab
              对骨密度有实质影响，并在部分场景中一线使用增加，但也再次说明专科处方和治疗排序仍然高度集中。对 Angitia 来说，这意味着 AGA2118
              进入的是一个有需求证明的真实市场，但不是容易打穿、也不是无差异化的市场。
