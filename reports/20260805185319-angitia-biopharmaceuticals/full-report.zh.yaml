      - number: '7.3'
        title: 财务、客户与论点失效风险
        blocks:
          - type: paragraph
            body: >-
              财务风险重要，但在当前阶段应被视为集中度和不透明风险，而不是明显缺钱。近期融资证明 Angitia 能筹钱。它们没有证明现金、烧钱速度、跑道和债务与公司剩余执行负担相匹配。AGA111
              退出后，公司也更集中；整个论点更大一部分现在压在 AGA2118 和 AGA2115
              上。客户路径证据进一步放大这种集中图景。未来采用很可能依赖少数专科医生、中心和支付方决定，而不是一个宽泛、容错的市场。这意味着疲弱 2
              期结果、新出现的安全性担忧，或难以解释的监管信号，可能很快传导为融资压力和估值压缩。正确反应不是恐慌，而是纪律：基于里程碑承保，明确终止标准，并紧盯数据质量、安全性语言、IP
              范围和商业化准备度信号。Angitia 有足够吸引力值得关注，但还没安全到可以随手承保。它是高上行但高纪律场景，不是买了就忘的增长故事。投入资本前，定价纪律、里程碑闸门和快速升级路径都应写清楚。
