      - - 公开资料包太薄，无法支撑溢价下的高信心投资判断
        - 经验证的当前估值标记和股权结构可见性会有帮助
      - - 近期融资是优势，也抬高了预期门槛
        - 若能以显著折价进入，建议会改善
    notes: 表格刻意对价格敏感：公司质量和投资质量分开判断。
    claimRefs:
      - CV001
      - CV002
      - CV023
      - CV024
      - CV025
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 悲观
        - Phase 2 数据好坏参半，或执行问题再次出现
        - 估值压向未达独角兽的研发期区间
        - 安全性、疗效、融资压力
        - 数据摇摆时影响重大
      - - 基准
        - 一项核心资产表现良好，另一项仍有希望，融资保持可得
        - 估值可维持较高水平，但公开证据仍只部分支撑溢价
        - 需要更清晰的现金和利润率能见度
        - 最符合当前公开证据
      - - 乐观
        - 读数临床意义强，融资渠道可持续
        - 罕见病 / 骨生物学的溢价期权可支撑更高区间
        - 仍需执行和 CMC 证明
        - 需要多件事同时跑通
    notes: 这些情景不是正式概率；它们只是结构化框架，用来在不同证据状态下思考价格敏感性。
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV026
      - CV027
      - CV028
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Amgen
        - 市值
        - ~$216B
        - 显示品类天花板和骨健康规模
        - 成熟度过高，不能直接作为进入点可比
      - - UCB
        - 市值
        - ~$50.8B
        - 显示一家多元化专科药企掌握 romosozumab 经济权益后的规模
        - 过于成熟且多元化
      - - Ultragenyx
        - 市值
        - ~$2.1B-$2.45B
        - 最好的公开罕见病上行可比视角
        - 已上市，披露更完整
      - - Mereo BioPharma
        - 市值
        - ~$49M-$55M
        - 混合证据后的最佳小盘下行可比
        - 微型市值波动限制精度
      - - Eli Lilly
        - 市值
        - ~$1.04T-$1.1T
        - 更广药企中的品类天花板
        - 只适合证明规模，不适合作为定价锚
    notes: 这组可比对象已覆盖本章保留的公开可比视角。
    enumerationScope:
      coverage: exhaustive
      basis: >-
        This table exhaustively lists the retained public comparable lenses used in the valuation chapter, from downside
        clinical peer to category-scale ceiling.
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
      - CV039
      - CV040
      - CV041
  - id: TV005
    title: 打破投资论点和否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - Phase 2 疗效偏弱
        - 数据未显示足够有说服力的临床相关性
        - 乐观和基准情景失去支撑
        - 转为放弃或高度谨慎
      - - 重大安全性负担
        - 类似标签警示或研究者可见的安全担忧加重
        - 可服务市场和采用逻辑收窄
        - 大幅提高所需折价
      - - 意外融资压力
        - 更早需要新资本，或条款更差
        - 稀释和优先权风险上升
        - 重新定价下行情景
      - - 专利 / FTO 薄弱
        - 法务尽调削弱护城河信心
        - 差异化溢价消退
        - 下调上行空间和信心
      - - CMC / 放大生产意外
        - 生产经济性或就绪度不及预期
        - 利润率路径和时点恶化
        - 延后投资或要求更多证据
    notes: 这些事件最可能比渐进的市场变化更快打破乐观叙事。
    claimRefs:
      - CV027
      - CV028
      - CV035
      - CV036
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前投后估值
        - 直接核验的估值标记
        - 决定当前价格是否值得投
        - 索取融资文件
      - - 现金、消耗、跑道
        - 资产负债表分母
        - 决定融资压力和稀释风险
        - 索取现金桥和预算
      - - 股权结构表和优先权
        - 经济优先级
        - 改变真实股权下行
        - 索取股权结构表和条款清单摘要
      - - CMC 和毛利率路径
        - 商业经济性
        - 避免为单位经济性薄弱的科学资产支付过高价格
        - 索取 CMC 尽调材料
      - - 支付方和上市假设
        - 收入质量和采用速度
        - 批准能否转化为销售取决于它
        - 索取市场准入和上市材料
    notes: 缺少这些材料，价格与证据之间的关系仍太弱，难以下出高信心判断。
    claimRefs:
      - CV022
      - CV029
      - CV032
      - CV035
