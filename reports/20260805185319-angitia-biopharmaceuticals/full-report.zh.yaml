      - number: '7.2'
        title: 运营与依赖风险
        blocks:
          - type: paragraph
            body: >-
              运营风险是第二根支柱，因为 Angitia
              的未来价值仍取决于执行复杂研究，并最终可重复地制造生物制剂。公开试验记录显示至少两个活跃干预性项目，以及一个历史后期项目；后者已经证明执行负担可以变得多大、多笨重。试验中心协调、入组质量、方案忠实度和终点敏感性都是真实危险；当公司同时管理多个专科疾病语境时，这些风险还会叠加。公开记录在制造、质量体系和供应准备度上也很薄。这在这里比软件业务更重要，因为生物制剂生产问题会直接打断研究或拖住监管进展。因此，依赖贯穿临床中心、制造准备度、监管方，以及一个相对小的专科生态。招聘和文化页面显示组织活动，但不能证明台下梯队深度，也不能降低关键人物风险。运营上，正确心智模型是一家科学很重、试验动作可见、流程风险隐蔽的公司。它可以融资，但投资人必须明确哪些缺失的运营细节日后可能打碎论点。实践中，这意味着尽调必须穿透科学摘要，进入
              QA、供应商和研究治理机制。
