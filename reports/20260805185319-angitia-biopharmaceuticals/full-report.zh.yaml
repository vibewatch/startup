      - number: '5.2'
        title: 技术架构与依赖
        blocks:
          - type: paragraph
            body: >-
              Angitia 的技术核心是骨生物学论点。AGA2118 和 AGA2115 被呈现为与硬化蛋白和 DKK1 逻辑绑定的双特异性或双靶点抗体，AGA111 则体现了另一种重组 BMP6
              路径。公开专利记录和受让人页面支持这样的判断：Angitia
              追求过更广的抗硬化蛋白构建体资产，而不只是给单个项目贴营销语言。但这些来源需要谨慎解读。它们证明活动和技术诀窍，不证明自由实施、制造可重复性或商业范围。正确的架构视角因此是分层的：分子和 IP
              设计喂给具体药物资产；药物资产喂给具名临床项目；临床项目再去解决专科治疗任务。这个架构也高度依赖外部执行。Angitia
              依赖制造执行、试验中心表现、监管方，以及把机制差异化转化为持久临床结局的能力。Synapse 和其他 R&D
              跟踪界面有助于确认外部世界能看见并跟踪这条管线，对尽调有帮助；但这些第三方页面不能替代一手技术披露。结果是一套科学结构和依赖项都可见的平台，但支撑科学可规模化复现的运营骨架仍然可见度有限。
