      - number: '2.3'
        title: 成骨不全症子市场
        blocks:
          - type: paragraph
            body: >-
              成骨不全症子市场的人数远小于骨质疏松症，但未满足需求更急，专科密度也更高。OIF 和 Stanford 材料将 OI 描述为一种终身、易骨折的罕见病，需要多学科管理，美国约有 25,000 至 50,000
              名受影响人群。Angitia 的疾病页面把全球患病率表述为约每 10,000 至 20,000 人中 1 人。后期竞争对手披露让商业语境更尖锐。Ultragenyx 和 Mereo 均在 2025
              年底表示，全球尚无获批治疗 OI 的疗法；两家公司也都报告，setrusumab 虽提高骨矿物质密度，却未达到主要骨折终点。这对 AGA2115
              是关键背景。它意味着市场在医学上仍重要、商业上仍开放，但也意味着单靠生物标志物或 BMD
              改善，可能不足以建立持久的商业标准。可能的买方和使用者集中在罕见病转诊中心、儿科骨科网络和代谢骨病专科医生，支付方则会拿一款高价专科疗法，对照极小的患者分母和极高的未满足需求来评估。
