  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 骨质疏松症现有玩家与替代品
        blocks:
          - type: paragraph
            body: >-
              骨质疏松症竞争集合已经很拥挤，获批疗法和已被充分理解的治疗排序都很多。Evenity 是最清楚的现有类比，因为它是一款已上市的促骨形成单克隆抗体，定位于高骨折风险绝经后女性；但它也展示了 Angitia
              想进入的市场有多复杂：心血管警示、监测负担和支付方审查与机会并存。Forteo 和 TYMLOS 扩大了替代品集合。它们不是硬化蛋白 / DKK1
              生物制剂，却已经凭借长期临床使用、品牌支持项目和医生熟悉度占据促骨形成赛道。Prolia
              机制不同，更多是治疗排序竞争对手而非直接功能竞争对手，但它很重要，因为标准骨质疏松症护理有路径依赖；处方医生和支付方不会在真空中评估新进入者。含义是，AGA2118
              不是在和单一产品竞争。它要面对的是一个有标签背书的现有产品、一个促骨形成类别，以及一个已经形成治疗路径、事先授权和风险管理习惯的专科生态。
