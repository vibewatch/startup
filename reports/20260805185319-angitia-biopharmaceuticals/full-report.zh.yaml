      - number: '4.2'
        title: 成本结构与资本强度
        blocks:
          - type: paragraph
            body: >-
              Angitia 仍处开发阶段，因此成本结构由商业化前必须花的钱主导，而不是已入账收入对应的销货成本主导。公开记录指向多个重要成本桶：ARTEMIS 和 IDUN 的临床运营、双特异性抗体项目的生产与 CMC
              放大、监管与质量工作，以及支撑全球开发组织所需的公司管理费用。试验记录和镜像登记库进一步说明，这不是一个单资产壳公司；它是一个至少承载两个活跃中期项目的平台，并且直到 2026 年 6
              月还背着一个同样消耗资本的后期脊柱融合项目。AGA111 终止可能削减部分近期支出，但不会神奇地创造财务灵活性。它主要是把公司敞口从三个披露项目，重新分配到更集中押注 AGA2118 和
              AGA2115。公开来源也没有披露制造经济性、批次收率或毛利率假设，因此即使科学成功，投资人也无法测试放大成本是否会侵蚀未来回报。Caplight 和 Seedtable
              的员工数代理显示，公司已有真实运营足迹，财务、技术、发现和开发职能都在场，这与持续烧钱一致。但缺少烧钱速度和销货成本细节，意味着最佳财务解读仍是定性的：Angitia
              正在资助一个昂贵的临床平台，其成本基础形状可见，金额不可见。
