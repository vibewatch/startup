      - number: '8.3'
        title: 可比公司视角与入场纪律
        blocks:
          - type: paragraph
            body: >-
              可比集合要谨慎使用。Amgen、UCB 和 Eli Lilly 证明骨健康及相关专科药品类别可以创造巨大市值，但这些公司拥有商业系统、获批产品和完全可见的公开财务。它们是天花板，不是入场锚点。Ultragenyx
              是更相关的上行情景可比，因为它展示了一个公开罕见病特许经营如何维持数十亿美元股权价值。Mereo 是更相关的下行情景可比，因为它显示，当开发故事仍狭窄或不确定时，公开市场可能给多低的价格。这个区间才是
              Angitia
              的真实教训。若科学能够转化，公司可能有真实上行；但下行也真实，一旦证明变弱，公开市场会很无情。入场纪律因此必须严格。基于公开证据的最佳姿态，是跟踪或深度尽调；只有在私下信息令人信服地补上现金、CMC、疗效持久性和股权结构缺口时，才支付更高价格。否则，投资人是在为希望加动能付钱，而不是承保真实的价格—证明关系。这种纪律重要，是因为公开市场已经清楚证明，生物技术叙事一旦证明减弱，就能很快从溢价滑向惩罚。换句话说，投资人应要求安全边际，不是因为
              Angitia 没有前景，而是因为价格—证明比仍未稳定。
