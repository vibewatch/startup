      - number: '3.2'
        title: 罕见病 OI 竞争集
        blocks:
          - type: paragraph
            body: >-
              AGA2115 最相关的直接竞争对手是 setrusumab，不是因为它赢下市场，而是因为它触达了 Angitia 尚未触达的证明门槛。Ultragenyx 和 Mereo
              已经围绕成骨不全症搭建出后期罕见病开发与患者社区互动叙事。它们 2025 年底的 3
              期结果正好说明这个市场为什么难：骨矿物质密度大幅改善，并没有转化为骨折终点的统计显著胜利。市场没有因此关闭；未满足需求仍在。但它也说清楚了，罕见病投资人和处方医生应当警惕任何只建立在生物标志物上的商业故事。因此，罕见病竞争集合呈现悖论形态：按产品数量看，它比骨质疏松症没那么拥挤；但科学证明和社区证明门槛更高。Ultragenyx
              和 Mereo 也展示了 Angitia 还未公开证明的能力，尤其是患者社区互动、商业化成熟度和罕见病运营肌肉。这在竞争上重要，因为 Angitia
              不能假设罕见病上市是从零市场。转诊中心、家庭倡导者和专科医生已经有自己的数据解读框架，而 setrusumab
              经历让这些框架更敏感。任何新进入者现在不仅要解释机制为什么优雅，还要解释它为什么能改变脆骨患者的真实骨折、功能和治疗坚持。
