  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、反论点与建议
        blocks:
          - type: paragraph
            body: >-
              Angitia 的吸引力很清楚：近期融资显示可信投资人愿意资助一个差异化的肌肉骨骼生物制剂论点；AGA111
              重置后，公司仍有两个主要资产。谨慎点也同样清楚：公开证据包远远不完整，无法支撑按假定溢价标记进行有把握的买入。没有公开收入桥、没有现金或烧钱披露、没有股权结构可见度，也没有直接验证的公开估值标记能干净确认投资人被要求承保的价格。这个组合导出的建议更受估值敏感度约束，而不是公司质量约束。Angitia
              不是低质量资产；它是不完整可承保资产。因此，基于公开证据的正确建议是继续研究，而不是买入。信心应为中等，风险为高；如果交易真的在或高于独角兽定价成交，估值姿态就是偏紧的。投资人应保持跟踪，但不能让强融资叙事替代入场纪律。换句话说，公司可能值得关注，但当前证据还不值得盲目支付溢价。
