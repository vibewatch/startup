  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 未来客户定义
        blocks:
          - type: paragraph
            body: >-
              Angitia
              尚未商业化，因此客户问题不是“今天谁在付钱？”，而是“如果科学成立，谁必须点头？”答案是一条三方医疗链。医生和专科中心是运营用户，因为它们负责诊断、选择并监测治疗。患者和家庭是生活中的用户，因为他们承受骨质疏松症或成骨不全症结局负担。支付方是经济把关人，因为品牌生物制剂准入几乎肯定需要覆盖支持、事先授权或其他基于证据的审查。公开的医疗服务者和基金会来源把这个结构讲得很清楚。骨质疏松症治疗流经诊断、骨折风险评估、DXA
              测量和治疗选择；OI 则流经一个更小、更集中的罕见病生态，涉及遗传背景、终身脆弱性管理和大量专科中心参与。这一点重要，因为 Angitia
              的未来客户群即使当前还不可见，也已经可读。公司瞄准的不是分散消费者市场，而是结构化骨病路径中的医生介导采用。这让未来细分地图异常清晰，但也意味着采用会受相对少数专科医生、支付方审查员和社区信任节点把关。集中度可以加速聚焦商业化，但前提是
              Angitia 很快赢得信任。
