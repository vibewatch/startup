      - number: '4.3'
        title: 资本充足性与财务结论
        blocks:
          - type: paragraph
            body: >-
              Angitia 财务图景中令人鼓舞的部分，是它确实、且近期拿到了融资。仅 Series C 和 Series D 就合计
              $250M，更广的平台来源暗示早期轮次还带来更多资本。这应足以让公司实质性向前推进，但公开证据仍不足以证明充足性，因为关键分母缺失。没有披露现金余额、月度烧钱速度、债务安排，也没有清晰的下一轮触发条件。Bizprofile
              有助于确认加州实体仍处活跃状态，但实体延续不等于流动性。投资人因此应抵制虚假精确。即使一家融资良好的私营生物技术公司，一旦制造成本上升、时间线滑坡，或一个项目失利并收窄叙事，也可能很快重新依赖融资。2026 年
              6 月 AGA111 停止，也改变了资本故事的读法：它可能减少部分即时现金流出，但提高集中度风险，并让未来融资更依赖双特异性论点。正确结论不是 Angitia
              资本不足；公开证据不能证明这一点。正确结论是，Angitia
              看起来融资相当充分，但透明度不足，若没有私下尽调，无法承保收入质量、跑道或利润率路径。对投资人来说，关键尽调工作是拿到账面和经营计划，而不是再看一条庆祝融资的标题。
