  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 面向 IC 的摘要，概括公开证据今天能支撑什么。
    data:
      items:
        - label: 建议
          value: Research-more
          note: 公司有意思，但公开投资核验不完整
        - label: 置信度
          value: Medium
          note: 证据足以判断方向，不够支撑精确判断
        - label: 风险评级
          value: High
          note: 临床、融资和集中度风险仍然重大
        - label: 估值立场
          value: Stretched
          note: 如果价格已经达到或高于独角兽水平
        - label: 最佳可比视角
          value: Ultragenyx / Mereo sandwich
          note: 罕见病上行空间，对照小盘股下行风险
        - label: 公开估值标记质量
          value: Weak
          note: 未保留直接核验的当前投后估值标记
        - label: 期权价值
          value: Real
          note: 两个活跃核心资产，加上强融资历史
    approximationNotes: KPI 标签是基于保留公开证据集得出的投资判断，而不是公司披露指标。
    claimRefs:
      - CV031
      - CV033
      - CV034
      - CV039
      - CV040
      - CV042
