              首席顾问。治理可见度不够完整。公司在审阅期内只清楚披露了两名董事会新增成员：Norbert Riedel 随 Series C 加入，Kevin Li 随 Series D
              加入。这足以说明有成熟投资人参与，但不足以完整勾勒控制权。尽调含义是，Angitia 的职能覆盖可信，但外部投资人仍需要最新董事会名单，以及 David Ke 之下更清晰的继任梯队。
