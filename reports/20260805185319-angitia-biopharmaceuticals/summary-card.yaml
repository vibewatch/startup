  topStrengths:
    - Two active Phase 2 bone-disease programs give Angitia real scientific option value after the AGA111 reset.
    - Series C and Series D financings show continued support from sophisticated healthcare and crossover investors.
    - >-
      The company’s osteoporosis and osteogenesis imperfecta focus targets real specialist markets with visible unmet
      need and defined care pathways.
    - Patent and construct surfaces support a non-trivial technical/IP story around anti-sclerostin biology.
    - >-
      Public evidence suggests Angitia still has financing access and organizational activity rather than being a
      stalled clinical shell.
  topRisks:
    - AGA111’s Phase 3 termination proves that late-stage clinical disappointment is a live risk, not a theoretical one.
    - >-
      Public sources do not disclose cash, burn, runway, cap-table terms, or a directly verified current post-money
      valuation.
    - >-
      Bone-building therapies face meaningful safety and label-risk precedents, including cardiovascular and
      osteosarcoma-oriented warning frameworks in adjacent products.
    - >-
      Future commercialization appears concentrated in a relatively small set of specialists, centers, and payer
      decisions rather than a broad self-serve market.
    - >-
      CMC, manufacturing, and launch-quality-system disclosure remains too thin to support a clean premium valuation
      underwrite.
  unresolvedGaps:
    - Directly verified current valuation mark and current cap-table / liquidation-preference terms.
    - Current cash balance, monthly burn, downside runway, and financing contingency plan.
    - CMC economics, manufacturing readiness, and gross-margin path for AGA2118 and AGA2115.
    - Payer access assumptions, gross-to-net expectations, and launch account prioritization.
    - >-
      KOL and payer reactions to what would constitute compelling Phase 2 proof in osteoporosis and osteogenesis
      imperfecta.
