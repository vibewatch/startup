- id: technology-architecture-and-dependencies
  title: Technology architecture and dependencies
  body: The technical core of Angitia is its bone-biology thesis. AGA2118 and AGA2115 are presented as
    bispecific or dual-target antibodies tied to sclerostin and DKK1 logic, while AGA111 embodied a different
    recombinant BMP6 approach. Public patent records and assignee pages support the view that Angitia
    has pursued a broader anti-sclerostin construct estate rather than merely attaching marketing language
    to one program. But those sources should be interpreted carefully. They establish activity and know-how,
    not freedom to operate, manufacturing reproducibility, or commercial scope. The right architecture
    lens is therefore layered. Molecular and IP design feed specific drug assets; those assets feed named
    clinical programs; and those clinical programs are supposed to solve specialist treatment jobs. The
    architecture is also dependency-heavy. Angitia depends on manufacturing execution, trial-site performance,
    regulators, and the ability to turn mechanistic differentiation into durable clinical outcomes. Synapse
    and other R&D tracking surfaces help confirm that the outside world can see and track this pipeline,
    which is helpful for diligence, but those third-party pages do not replace primary technical disclosure.
    The result is a platform with visible scientific structure and visible dependencies, but still limited
    visibility into the operational backbone that would make the science repeatable at scale.
  claimRefs:
  - CE006
  - CE007
  - CE008
  - CE009
