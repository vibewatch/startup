- id: trust-quality-and-maturity
  title: Trust, quality, and maturity
  body: 'The strongest trust signal in the Angitia product pack is process quality, not market proof.
    ClinicalTrials.gov and ICH GCP records show formal multicenter, blinded, and staged trial designs,
    while conference presentations at ASBMR and AAOS create a visible cadence of scientific disclosure.
    That is real evidence of an operating development organization. It is also notably different from
    trust in launch readiness. The retained public materials do not give a detailed CMC package, pharmacovigilance
    system, commercial supply story, or large-scale reimbursement operations playbook. That makes the
    product maturity picture uneven. AGA2118 looks like the clearest near-term technical program because
    it combines novel biology with an active Phase 2 study in a broad specialist market. AGA2115 has an
    appealing rare-disease slot, but it still needs to prove that the biology converts into outcomes that
    matter for fragile-bone patients. AGA111 is now more useful as a lesson in platform risk than as a
    source of value. The careers and culture surfaces show some practitioner activity, yet they are thin
    proxies for true engineering or manufacturing disclosure. The right maturity verdict is therefore
    mixed: scientifically interesting, clinically progressing, operationally dependent, and still under-disclosed
    for a high-confidence product underwrite.'
