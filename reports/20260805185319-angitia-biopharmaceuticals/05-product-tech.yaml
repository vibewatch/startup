  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: CMC
    missingEvidence: Manufacturing process, batch yield, release testing, and costed scale-up plan for
      AGA2118 and AGA2115.
    whyItMatters: Biologic differentiation can fail financially or operationally if CMC is fragile.
    diligencePath: Request CMC package, tech-transfer plan, and manufacturing risk register.
    relatedQuestionRefs:
    - QE015
    - QE021
  - type: missing-source
    severity: material
    topic: pharmacovigilance-and-launch-ops
    missingEvidence: Public launch-readiness, pharmacovigilance, or supply-reliability documentation.
    whyItMatters: Technical maturity is only partly about science; launch operations and quality systems
      matter too.
    diligencePath: Request quality-system overview and planned commercialization operations.
    relatedQuestionRefs:
    - QE016
    - QE022
  - type: private-evidence-only
    severity: material
    topic: freedom-to-operate
    missingEvidence: Formal FTO opinion and patent-family strategy by geography.
    whyItMatters: Patent presence does not prove freedom to commercialize globally.
    diligencePath: Request counsel memo, key family map, and expiry schedule.
    relatedQuestionRefs:
    - QE007
    - QE021
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: Specific role postings or technical-talk content showing engineering or manufacturing
      hiring priorities.
    whyItMatters: The repo requires a practitioner/developer proxy, but Angitia’s public surface is thin.
    diligencePath: Pull live job requisitions or conference talks if available.
    relatedQuestionRefs:
    - QE017
    - QE018
  - type: private-evidence-only
    severity: material
    topic: dose-and-admin-details
    missingEvidence: Full dosing, administration, and handling assumptions for the investigational antibodies
      beyond limited public summaries.
    whyItMatters: Workflow burden and differentiation depend on how therapy is actually delivered.
    diligencePath: Request investigator brochure and target product profile.
    relatedQuestionRefs:
    - QE013
    - QE020
