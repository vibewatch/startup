- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Angitia solution
  - Measurable benefit
  - Limitation
  rows:
  - - High-risk osteoporosis management
    - Diagnose, risk-stratify, select therapy, monitor bone response
    - AGA2118 aims to fit the bone-building decision pathway
    - Potential for stronger skeletal response if dual-target thesis works
    - No approved label or real-world workflow proof yet
  - - Adult OI management
    - Specialist referral, baseline fragility assessment, longitudinal monitoring
    - AGA2115 aims to offer a disease-modifying biologic option
    - Potential benefit in a rare-disease unmet-need setting
    - Outcome bar is high and market is specialist-only
  - - Lumbar interbody fusion support
    - Surgical procedure plus bone-healing support
    - AGA111 tried to improve fusion success
    - Technical adjacency into orthopedics
    - Program termination breaks the workflow thesis
  - - Scientific visibility and partnering
    - Generate data and present at society meetings
    - ASBMR / AAOS disclosures create proof points
    - Builds external awareness and diligence surface
    - Conference proof is not the same as registrational proof
  notes: Benefits are directional and contingent because Angitia remains investigational across the retained
    source set.
