            body: >-
              The strongest public evidence of adoption is trial participation, not commercial deployment. ARTEMIS
              first-patient dosing and enrollment completion show that AGA2118 has reached the point where sites are
              activated and eligible patients can be enrolled into a mid-stage study. IDUN first-participant dosing does
              something similar for AGA2115 in the OI setting. Those milestones matter. They are the clearest available
              proof that Angitia’s programs are more than slideware. But they are also narrow proof. Enrollment and
              dosing validate investigator interest, patient willingness to participate, and some degree of site
              readiness; they do not validate real-world demand, payer acceptance, or sustained usage once a product
              becomes commercial. That distinction is why named customer proof in this chapter is intentionally framed
              as a proxy set. The best public analogs are specialist centers, provider care pathways, and patient
              foundations that show where future adoption decisions would occur. None of them prove that Angitia is
              already embedded in care. The public record also discloses no paying customer list, no commercial
              accounts, no patient-retention figures, and no repeat-usage metrics. So while the adoption picture is
              promising enough to show genuine market surfaces, it is still far from a validated customer traction
              story.
