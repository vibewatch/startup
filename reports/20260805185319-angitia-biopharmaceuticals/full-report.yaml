      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Angitia's public leadership surface is deeper than that of a typical early clinical biotech, but it is
              still highly founder-centric. Hua Zhu (David) Ke is listed as founder, chairman, and chief executive
              officer, making him the visible strategic and scientific center of the company. The rest of the disclosed
              executive team covers the major operating functions needed for a late preclinical or clinical biotech:
              Muyu (Luna) Li as co-founder and chief operating officer, Mike Arenberg as chief financial officer, Lei
              Zheng as chief technology officer, Ann Zovein as chief scientific officer, and Willard Dere as chief
              medical officer and chief advisor to the CEO. Governance visibility is less complete. The company publicly
              disclosed only two clear board additions in the reviewed period: Norbert Riedel alongside the Series C
              round and Kevin Li alongside the Series D round. That is enough to show sophisticated investor
              involvement, but not enough to fully map control. The diligence implication is that Angitia has credible
              functional coverage, yet outside investors still need a current board roster and clearer succession depth
              below David Ke.
