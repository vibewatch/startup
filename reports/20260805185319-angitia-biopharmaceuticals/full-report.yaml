    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and company stage
        blocks:
          - type: paragraph
            body: >-
              Angitia Biopharmaceuticals is a private clinical-stage biotechnology company focused on therapies for
              serious musculoskeletal disease rather than a diversified commercial drug portfolio. The company's public
              home page and history materials place its founding in 2018, describe early angel backing, and show a
              development path centered on bone biology, osteoporosis, osteogenesis imperfecta, and spinal fusion.
              Current company contact materials list a dual footprint: a Westlake Village headquarters in California and
              a Guangzhou office in China. That dual presence matters because Angitia is not just a China-origin bone
              biotech with a U.S. mailbox; public materials show a real cross-border operating structure spanning
              research, clinical development, and financing access. Third-party profiles such as Seedtable and Caplight
              also anchor the business in Westlake Village and classify it as a still-private, active company whose last
              disclosed financing was a February 2026 Series D. Public sources do not show customer count, revenue, or a
              priced post-money valuation, so the correct summary is private, clinically active, and increasingly
              well-funded rather than commercially proven.
