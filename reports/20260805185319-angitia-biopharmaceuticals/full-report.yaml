  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis, anti-thesis, and recommendation
        blocks:
          - type: paragraph
            body: >-
              The attraction in Angitia is clear: recent financing shows that credible investors were willing to fund a
              differentiated musculoskeletal-biologics thesis, and the company still has two lead assets after its
              AGA111 reset. The caution is just as clear: the public evidence pack is nowhere near complete enough to
              support a conviction purchase at an assumed premium mark. There is no public revenue bridge, no cash or
              burn disclosure, no cap-table visibility, and no directly verified public valuation mark that cleanly
              confirms the price investors are being asked to underwrite. That combination produces a recommendation
              that is more valuation-sensitive than company-sensitive. Angitia is not a low-quality asset. It is an
              incompletely underwritable asset. For that reason, the right public-evidence recommendation is
              Research-more rather than Buy. Confidence should be medium, risk high, and the valuation stance stretched
              if the deal really clears at or above unicorn pricing. Investors should stay engaged, but they should not
              let a strong financing narrative substitute for entry discipline. Put differently, the company may deserve
              attention, but the current evidence does not yet deserve blind premium pricing.
