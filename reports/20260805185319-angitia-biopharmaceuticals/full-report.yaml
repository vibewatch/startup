      - number: '3.3'
        title: Moat durability, switching costs, and competitive risk
        blocks:
          - type: paragraph
            body: >-
              Angitia’s main potential moat is biological differentiation, not commercial infrastructure. AGA2118’s dual
              sclerostin/DKK1 strategy could matter if it produces clinically meaningful outcome separation from
              existing anabolic or antiresorptive options. AGA2115 could benefit from rare-disease openness after
              setrusumab’s miss. But those are still hypotheses, not moats. Today’s market power sits with incumbents
              and better-prepared rare-disease operators: Evenity owns label-backed trust, Forteo and TYMLOS own
              familiarity and support programs, Prolia owns sequencing gravity, and Ultragenyx/Mereo own deeper OI
              operating maturity. Switching costs are therefore multidimensional. In osteoporosis, they include payer
              authorization, safety comfort, physician habit, and the ease of staying with known brands. In OI, they
              include specialist-center conservatism and the need to prove fracture-relevant benefit. Angitia also lost
              breadth when AGA111 was terminated, which makes the company more focused but also more exposed to success
              or failure of the bispecific thesis. Competitive diligence should therefore focus less on slideware
              differentiation and more on whether Angitia can earn trust in segments where incumbents already define the
              rules. That is why the competitive question is really a sequencing question: when would a physician or
              payer move from a known osteoporosis or rare-disease option to Angitia, and what evidence would force that
              change? Until the answer is concrete, Angitia remains a science-led challenger rather than a moat-secure
              future category leader. The burden of proof is therefore commercial, clinical, and organizational all at
              once.
