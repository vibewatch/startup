  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Osteoporosis incumbents and substitutes
        blocks:
          - type: paragraph
            body: >-
              The osteoporosis competitor set is already crowded with approved therapies and well-understood treatment
              sequences. Evenity is the clearest incumbent analog because it is a marketed bone-forming monoclonal
              antibody positioned for postmenopausal women at high fracture risk, but it also illustrates the complexity
              of the market Angitia wants to enter: cardiovascular warnings, monitoring burdens, and payer scrutiny all
              accompany the opportunity. Forteo and TYMLOS expand the substitute set. They are not sclerostin/DKK1
              biologics, yet they already occupy the anabolic lane with long clinical use, branded support programs, and
              physician familiarity. Prolia is a different mechanism and often a sequencing rather than direct-feature
              competitor, but it matters because standard osteoporosis care is path-dependent; prescribers and payers do
              not evaluate a new entrant in a vacuum. The implication is that AGA2118 is not competing against one
              product. It is competing against an incumbent label, an anabolic class, and a specialist ecosystem that
              already has treatment pathways, prior authorizations, and risk-management habits.
