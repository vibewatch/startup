      - number: '2.4'
        title: Growth drivers, constraints, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The growth case for Angitia’s market is straightforward: aging populations, persistent undertreatment
              after fracture, and the scarcity of truly differentiated bone-building options keep demand for better
              therapies alive. The constraint case is equally straightforward: efficacy has to translate into
              fracture-relevant outcomes, safety and sequencing matter, payers scrutinize expensive specialist
              therapies, and commercial uptake flows through a relatively narrow prescriber base. In osteoporosis,
              guideline bodies and real-world evidence both point to a market that already understands anabolic
              treatment but still struggles with broad treatment-gap closure. In OI, the market is even narrower and
              more relationship-driven, with concentrated specialist centers and no obvious commercial template after
              setrusumab’s Phase 3 disappointment. That is why this chapter uses patient-count and workflow lenses
              rather than inflated revenue TAM math. Angitia may be pursuing attractive niches, but the actual
              commercial opportunity depends on whether AGA2118 can clear the bar set by the existing romosozumab market
              and whether AGA2115 can convert unmet rare-disease need into a clinically and payer-relevant standard of
              care. Public sources do not yet disclose Angitia’s pricing or access assumptions, so those remain
              essential diligence asks.
