      - number: '1.4'
        title: Pipeline milestones and current status
        blocks:
          - type: paragraph
            body: >-
              Angitia's public chronology shows a company that used early capital to build a bone-disease platform and
              then shifted toward increasingly differentiated biologic assets. AGA111 was the first clinically advanced
              program, moving from Phase I/II work into a Phase 3 registrational study in China and remaining a central
              company program through early 2026. Meanwhile, AGA2118 advanced from first-in-human work into the global
              Phase 2 ARTEMIS trial in osteoporosis, and AGA2115 moved from first-in-human work into the global Phase 2
              IDUN trial in osteogenesis imperfecta. Those two bispecific antibodies target sclerostin and DKK1 and are
              the company's most differentiated programs. The complication is that public disclosures diverged by
              mid-2026. Company pages and February financing announcements still described three clinic-stage assets,
              but June 2026 registry and trade-press coverage reported that the AGA111 Phase 3 study had been terminated
              and that Angitia was pivoting attention toward the two bispecific programs. That disclosure lag is itself
              a diligence signal. The current public picture is therefore strongest on scientific momentum for AGA2118
              and AGA2115, and weaker on how quickly Angitia updates legacy materials when strategy changes.
