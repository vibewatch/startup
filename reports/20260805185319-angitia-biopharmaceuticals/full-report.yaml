  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Asset map and clinical use-case
        blocks:
          - type: paragraph
            body: >-
              Angitia’s product story is best understood as a clinical asset map aimed at specialist bone-disease
              workflows. The company is not selling a horizontal technology platform; it is developing biologic
              candidates that slot into physician-managed care pathways for osteoporosis, osteogenesis imperfecta, and
              historically spinal fusion. Public sources consistently show three named assets: AGA2118 in osteoporosis,
              AGA2115 in osteogenesis imperfecta, and the legacy AGA111 spinal-fusion program. Those assets matter
              because they define how the product should be read in workflow terms. AGA2118 is trying to enter the
              bone-building treatment decision for high-risk osteoporosis patients. AGA2115 is trying to serve a
              rare-disease pathway where specialist referral centers and long-term monitoring dominate. AGA111
              represented a device-adjacent orthopedic workflow rather than a chronic specialist biologic pathway.
              Clinical guidelines reinforce that these are not casual or consumer-directed therapies; they live inside
              evidence-heavy, physician-controlled treatment loops. That framing matters because it sets the bar for
              what product maturity really means. For Angitia, maturity is not a polished commercial brand or a broad
              feature catalog. It is a chain of mechanistic logic, usable clinical design, and enough operational
              support to move through regulated specialist workflows. On that basis, the public evidence shows a real
              multi-asset product map, but one still rooted in trial execution rather than market delivery.
