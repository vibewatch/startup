      - number: '6.3'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              Because Angitia has no approved products, durability has to be evaluated as a future-state risk rather
              than a present metric. There is no NRR, GRR, renewal, or persistence disclosure to inspect. Instead,
              investors need to reason from channel structure. The osteoporosis opportunity is broad enough to support
              meaningful expansion if AGA2118 shows compelling outcomes and safety, but it is also intensely gated by
              physician trust and payer review. The OI opportunity is smaller and potentially easier to map center by
              center, but that very concentration raises key-person and center-dependence risk. In both cases, the
              likely future customer surface is narrow enough that a modest number of opinion leaders, referral centers,
              and payer decisions could shape the outcome disproportionately. The June 2026 AGA111 termination adds
              another concentration effect by reducing Angitia’s historical orthopedic adjacency and leaving more of the
              company’s adoption thesis riding on two bispecific programs. The net result is a company with clear target
              segments and identifiable future channels, but limited proof of commercial durability and meaningful
              concentration risk. Customer diligence should therefore focus on KOLs, centers, and payers rather than on
              logos or generic market-size charts. Today, the map is clearer than the proof of durable use.
