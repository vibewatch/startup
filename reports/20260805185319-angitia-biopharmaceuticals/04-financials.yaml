- id: cost-structure-and-capital-intensity
  title: Cost structure and capital intensity
  body: 'Because Angitia is still in development, its cost structure is dominated by what it must spend
    before commercialization rather than by cost of goods sold against booked revenue. The public record
    points to multiple meaningful cost buckets: clinical operations for ARTEMIS and IDUN, manufacturing
    and CMC scale-up for bispecific antibody programs, regulatory and quality work, and the corporate
    overhead required to support a global development organization. Trial records and mirrored registries
    reinforce that this is not a one-asset shell; it is a platform carrying at least two active mid-stage
    programs and, until June 2026, a late-stage spinal-fusion program that also demanded capital. The
    AGA111 termination likely trims some near-term spend, but it does not magically create financial flexibility.
    It mainly reallocates the company’s exposure from three disclosed programs toward a more concentrated
    bet on AGA2118 and AGA2115. Public sources also do not reveal manufacturing economics, batch yields,
    or gross-margin assumptions, so investors cannot test whether scale-up costs would erode future returns
    even if the science succeeds. Headcount proxies from Caplight and Seedtable suggest a real operating
    footprint with finance, technology, discovery, and development functions in place, which is consistent
    with ongoing burn. But the absence of burn and COGS detail means the best financial interpretation
    is qualitative: Angitia is funding an expensive clinical platform whose cost base is visible in shape,
    but not in amount.'
  claimRefs:
  - CI010
  - CI011
  - CI012
  - CI021
  - CI022
