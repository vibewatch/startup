- id: capital-adequacy-and-financial-verdict
  title: Capital adequacy and financial verdict
  body: 'The encouraging part of the Angitia financial picture is that financing access has been real
    and recent. Series C and Series D alone amount to $250 million, and broader platform sources imply
    even more capital across earlier rounds. That should be enough to take the company materially forward,
    but public evidence still falls short of proving adequacy because the essential denominator is missing.
    There is no disclosed cash balance, no disclosed monthly burn, no disclosed debt schedule, and no
    clear next-round trigger. Bizprofile helps confirm that the California entity is active, yet entity
    continuity is not the same as liquidity. Investors should therefore resist false precision. A well-funded
    private biotech can still become financing-dependent very quickly if manufacturing costs rise, timelines
    slip, or one program disappoints and narrows the story. The June 2026 AGA111 stop also changes how
    the capital story should be read: it may reduce some immediate outflows, but it increases concentration
    risk and makes future financing more dependent on the bispecific thesis. The right verdict is not
    that Angitia is undercapitalized; public evidence does not prove that. The right verdict is that Angitia
    appears meaningfully financed, but not sufficiently transparent to underwrite revenue quality, runway,
    or margin path without private diligence. For an investor, that means the key diligence work is balance-sheet
    and operating-plan access, not another celebratory funding headline.'
