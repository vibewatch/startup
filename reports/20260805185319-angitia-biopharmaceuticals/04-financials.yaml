chapter:
  number: 4
  title: Financials
  summary: Angitia looks meaningfully financed but still economically opaque. Public sources support large
    2024-2026 fundraising and a capital-intensive clinical platform, yet they do not disclose cash, burn,
    runway, pricing, manufacturing economics, or revenue; the result is a financing-access story rather
    than a revenue-quality story.
sections:
- id: revenue-model-and-disclosure-gaps
  title: Revenue model and disclosure gaps
  body: 'Angitia is best understood financially as a clinical-stage asset developer, not as a business
    with visible commercial revenue. The public pack shows two lead antibody programs, ongoing interventional
    trials, and a funding history that is substantial by private-biotech standards, but it does not show
    approved products, recognized sales, or operating revenue detail. That means the financial story begins
    with what is absent. There is no public list pricing for AGA2118 or AGA2115, no disclosed partnership
    economics, no milestone-income stream, and no disclosed recurring revenue equivalent. In other words,
    investors are being asked to underwrite future therapeutics economics without the normal public scaffolding
    that would connect the science to realized dollars. The most credible revenue bridge in current materials
    is therefore conceptual: advance assets, create data, attract financing, and eventually convert one
    or more programs into approved and reimbursed products. Until then, the company’s economic engine
    is equity capital. That is not unusual for a clinical-stage biotech, but it matters because it shifts
    the underwriting burden away from historical income statements and toward capital adequacy, program
    prioritization, and milestone credibility. Even optimistic valuation surfaces such as Caplight should
    therefore be interpreted as signals of financing access or secondary-market interest, not as evidence
    of revenue quality or near-term cash generation.'
