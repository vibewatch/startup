  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cash-burn-runway
    missingEvidence: Current cash on hand, historical monthly burn, and base-case runway.
    whyItMatters: Without liquidity disclosure, investors cannot size financing risk or downside timing.
    diligencePath: Request board materials, monthly cash bridge, and 24-month operating plan.
    relatedQuestionRefs:
    - QI006
    - QI019
  - type: private-evidence-only
    severity: material
    topic: pricing-and-revenue
    missingEvidence: Target launch pricing, gross-to-net assumptions, payer mix, and launch-timing model
      for AGA2118 and AGA2115.
    whyItMatters: Revenue quality and gross-margin direction remain unknowable without commercialization
      assumptions.
    diligencePath: Request target product profile economics and market-access model.
    relatedQuestionRefs:
    - QI010
    - QI021
  - type: private-evidence-only
    severity: material
    topic: manufacturing-economics
    missingEvidence: COGS, batch economics, scale-up plan, and tech-transfer assumptions for the antibody
      programs.
    whyItMatters: Clinical-stage biologics can look well funded yet still face margin and capital surprises
      at scale-up.
    diligencePath: Request CMC budget, batch yield history, and cost-down roadmap.
    relatedQuestionRefs:
    - QI014
    - QI020
