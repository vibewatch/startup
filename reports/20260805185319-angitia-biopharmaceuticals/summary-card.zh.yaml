  topStrengths:
    - AGA111 重置之后，两个在研 Phase 2 骨病项目仍给 Angitia 留下真实的科学期权。
    - Series C 和 Series D 融资显示，成熟医疗和跨界投资人仍在支持公司。
    - 公司聚焦骨质疏松和成骨不全，切入的是真实专科市场：未满足需求可见，诊疗路径也相对清晰。
    - 专利和构建体布局支撑了围绕抗硬骨素生物学的技术 / IP 故事，含金量不低。
    - 公开证据显示，Angitia 仍有融资通道和组织活动，并不是一个停摆的临床空壳。
  topRisks:
    - AGA111 的 Phase 3 终止证明，后期临床失利不是理论风险，而是实打实会发生的风险。
    - 公开来源没有披露现金、烧钱速度、现金跑道、股权条款，或经直接核验的当前投后估值。
    - 骨形成疗法面对实质性的安全性和标签风险先例，邻近产品已有心血管和骨肉瘤相关警示框架。
    - 未来商业化更像集中在少数专科医生、中心和支付方决策上，而不是一个宽口径自助型市场。
    - CMC、生产和上市质量体系披露仍太薄，撑不起一笔干净的溢价估值承销。
  unresolvedGaps:
    - 经直接核验的当前估值标记，以及当前股权结构 / 清算优先权条款。
    - 当前现金余额、月度烧钱速度、下行情景现金跑道，以及融资应急方案。
    - AGA2118 和 AGA2115 的 CMC 经济性、生产准备度和毛利率路径。
    - 支付方准入假设、总额到净额预期，以及上市账户优先级。
    - KOL 和支付方如何界定骨质疏松、成骨不全中足够有说服力的 Phase 2 证据。
