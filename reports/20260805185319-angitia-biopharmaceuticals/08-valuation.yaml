  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: Actual cap table, liquidation preferences, and dilution overhang.
    whyItMatters: A superficially attractive company can still be a poor entry if late-round preferences
      are heavy.
    diligencePath: Request current cap table and term summaries.
    relatedQuestionRefs:
    - QV023
    - QV026
  - type: private-evidence-only
    severity: material
    topic: cash-burn-runway
    missingEvidence: Current cash, burn, runway, and financing contingency plan.
    whyItMatters: Valuation confidence is capped without liquidity visibility.
    diligencePath: Request cash bridge and 24-month budget.
    relatedQuestionRefs:
    - QV018
    - QV026
  - type: private-evidence-only
    severity: material
    topic: CMC-and-gross-margin
