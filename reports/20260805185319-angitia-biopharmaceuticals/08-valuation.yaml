- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Weak Phase 2 efficacy
    - Data fail to show compelling clinical relevance
    - Bull and base cases lose support
    - Move to pass or deep caution
  - - Material safety burden
    - Label-like or investigator-visible safety concerns intensify
    - Addressable market and adoption logic narrow
    - Increase required discount sharply
  - - Unexpected financing stress
    - New capital needed sooner or on worse terms
    - Dilution and preference risk rise
    - Reprice downside scenario
  - - Patent / FTO weakness
    - Legal diligence reduces moat confidence
    - Differentiation premium fades
    - Lower upside and conviction
  - - CMC / scale-up surprise
    - Manufacturing economics or readiness disappoint
    - Margin path and timing deteriorate
    - Delay investment or demand more proof
  notes: These are the events most likely to break a bullish narrative faster than gradual market changes
    would.
