- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current post-money valuation
    - Direct verified mark
    - Determines whether current price is investable
    - Request financing documents
  - - Cash, burn, runway
    - Balance-sheet denominator
    - Sets financing pressure and dilution risk
    - Request cash bridge and budget
  - - Cap table and preferences
    - Economic seniority
    - Changes true equity downside
    - Request cap table and term sheet summary
  - - CMC and gross-margin path
    - Commercial economics
    - Prevents overpaying for science with weak unit economics
    - Request CMC diligence
  - - Payer and launch assumptions
    - Revenue quality and uptake
    - Needed to translate approvals into sales
    - Request market-access and launch deck
  notes: Absent these items, the price-to-proof relationship remains too weak for a conviction call.
