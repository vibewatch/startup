- id: valuation-context-and-scenario-bands
  title: Valuation context and scenario bands
  body: The public valuation context is best read as a set of signals rather than a clean mark. Series
    C and D clearly confirm financing momentum, while Caplight and Seedtable suggest a well-followed private
    company with substantial cumulative funding and some secondary-market interest. But those same sources
    stop short of giving investors everything they need to justify a precise value. The scenario framework
    therefore matters more than a pretend decimal point. In a bear case, mixed Phase 2 data, safety ambiguity,
    or renewed financing pressure could push Angitia toward a much lower band that looks more like distressed
    development peers than celebrated private winners. In a base case, one strong lead asset and continued
    financing access could preserve a substantial premium to early-stage biotech, but still leave current
    unicorn-level pricing only partially supported. In a bull case, strong clinically meaningful readouts
    across the remaining pipeline could justify premium rare-disease or bone-biology optionality. The
    current public evidence simply does not tell investors which of those states they are already paying
    for. That uncertainty is exactly why a private price can be both narratively plausible and still insufficiently
    supported for a disciplined buyer. Scenario work is not optional here; it is the only honest way to
    avoid false precision.
  claimRefs:
  - CV003
  - CV004
  - CV005
  - CV006
