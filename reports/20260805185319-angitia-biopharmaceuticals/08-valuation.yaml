- id: comp-lens-and-entry-discipline
  title: Comparable lens and entry discipline
  body: The comp set should be used with care. Amgen, UCB, and Eli Lilly show that bone-health and related
    specialty-pharma categories can create massive market value, but those companies have commercial systems,
    approved products, and fully visible public financials. They are ceilings, not entry anchors. Ultragenyx
    is the more relevant upside comp because it shows how a public rare-disease franchise can sustain
    multi-billion-dollar equity value. Mereo is the more relevant downside comp because it shows how little
    the public market may pay when a development story remains narrow or uncertain. That range is the
    real lesson for Angitia. The company may have genuine upside if its science converts, but the downside
    is also real and public markets are ruthless once proof weakens. Entry discipline should therefore
    be strict. The best public-evidence posture is to track or diligence deeply, and only pay up if private
    information convincingly closes the gaps on cash, CMC, efficacy durability, and cap-table structure.
    Otherwise, the investor is paying for hope plus momentum instead of underwriting a real price-to-proof
    relationship. This discipline matters because the public market offers clear evidence that biotech
    narratives can move from premium to punishment very quickly once proof weakens. In other words, investors
    should demand a margin of safety not because Angitia lacks promise, but because the price-to-proof
    ratio is still unsettled.
