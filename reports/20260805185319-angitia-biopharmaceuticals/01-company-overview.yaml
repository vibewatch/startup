- id: capital-base-and-investor-signal
  title: Capital base and investor signal
  body: The clearest public proof of company quality is the investor syndicate assembled across the 2024
    and 2026 rounds. Angitia closed a $120 million Series C in December 2024 led by Bain Capital Life
    Sciences, then followed with a $130 million Series D in February 2026 co-led by Frazier Life Sciences
    and Venrock Healthcare Capital Partners. The Series D syndicate added crossover and specialist names
    including BlackRock-managed funds, BVF Partners, Logos Capital, RA Capital Management, and Wellington
    Management, while prior backers such as Bain, 3H Health Investment, Hillhouse, OrbiMed, and Legend
    Capital also returned. That is an unusually strong investor roster for a still-private musculoskeletal
    biotech. Public sources do not expose the exact Series A or Series B amounts in primary company materials,
    but Caplight reports $406 million of total funding raised, implying that earlier rounds plus the 2024
    Series B extension accounted for the remaining capital. The strong investor signal does not eliminate
    execution risk, but it materially lowers near-term financing stress and suggests that sophisticated
    healthcare investors believe the science merits continued financing.
