company:
  name: Angitia Biopharmaceuticals
chapter:
  number: 1
  title: Company Overview
  summary: Angitia Biopharmaceuticals is a private, clinical-stage musculoskeletal biotech founded in
    2018 with a dual Westlake Village-Guangzhou footprint and a specialist investor base that backed $120
    million Series C and $130 million Series D financings in 2024 and 2026. The strongest current programs
    are the Phase 2 bispecific assets AGA2118 for osteoporosis and AGA2115 for osteogenesis imperfecta,
    while mid-2026 independent sources show the earlier AGA111 spinal-fusion program was terminated, creating
    a disclosure lag versus older company materials.
sections:
- id: identity-footprint-and-stage
  title: Identity, footprint, and company stage
  body: 'Angitia Biopharmaceuticals is a private clinical-stage biotechnology company focused on therapies
    for serious musculoskeletal disease rather than a diversified commercial drug portfolio. The company''s
    public home page and history materials place its founding in 2018, describe early angel backing, and
    show a development path centered on bone biology, osteoporosis, osteogenesis imperfecta, and spinal
    fusion. Current company contact materials list a dual footprint: a Westlake Village headquarters in
    California and a Guangzhou office in China. That dual presence matters because Angitia is not just
    a China-origin bone biotech with a U.S. mailbox; public materials show a real cross-border operating
    structure spanning research, clinical development, and financing access. Third-party profiles such
    as Seedtable and Caplight also anchor the business in Westlake Village and classify it as a still-private,
    active company whose last disclosed financing was a February 2026 Series D. Public sources do not
    show customer count, revenue, or a priced post-money valuation, so the correct summary is private,
    clinically active, and increasingly well-funded rather than commercially proven.'
