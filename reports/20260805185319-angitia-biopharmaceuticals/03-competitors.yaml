  - - TYMLOS
    - Incumbent anabolic substitute
    - Commercialized with HCP support and access messaging
    - Men and postmenopausal women at high risk for fracture
    - Bone-rebuilding positioning plus support programs
    - No public Angitia-style dual-target story; still class competition
  - - Prolia
    - Status-quo antiresorptive / sequencing substitute
    - Commercialized and embedded in care pathways
    - Broad osteoporosis and bone-loss indications
    - Entrenched reimbursement and physician familiarity
