- id: rare-disease-oi-competitor-set
  title: Rare-disease OI competitor set
  body: 'The most relevant direct competitor to AGA2115 is setrusumab, not because it won the market,
    but because it reached the proof threshold that Angitia has not yet reached. Ultragenyx and Mereo
    have already built a late-stage rare-disease development and community-engagement story around osteogenesis
    imperfecta. Their late-2025 Phase 3 results showed exactly why the market is difficult: substantial
    bone mineral density improvement did not translate into statistically significant fracture-endpoint
    wins. That did not close the market; it preserved unmet need. But it did clarify that rare-disease
    investors and prescribers should be skeptical of any commercial story resting on biomarkers alone.
    The rare-disease competitor set therefore has a paradoxical shape. It looks less crowded than osteoporosis
    on product count, yet the scientific and community proof burden is higher. Ultragenyx and Mereo also
    signal capabilities Angitia has not yet shown publicly, especially around patient-community engagement,
    commercialization maturity, and rare-disease operating muscle. This matters competitively because
    Angitia cannot assume a greenfield rare-disease launch. Referral centers, family advocates, and specialist
    physicians already have lenses through which to interpret new data, and those lenses were sharpened
    by the setrusumab experience. Any new entrant now needs to explain not only why its mechanism is elegant,
    but why it should change how fragile-bone patients actually fracture, function, and persist on therapy.'
  claimRefs:
  - CP014
  - CP015
  - CP016
