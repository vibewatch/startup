    severity: material
    topic: OI-commercial-readiness
    missingEvidence: Angitia’s rare-disease commercialization plan, center strategy, and patient-engagement
      approach for AGA2115.
    whyItMatters: Ultragenyx and Mereo already signal rare-disease operating maturity, while Angitia’s
      public record does not.
    diligencePath: Request planned center map, patient-advocacy strategy, and anticipated launch-resourcing
      assumptions.
