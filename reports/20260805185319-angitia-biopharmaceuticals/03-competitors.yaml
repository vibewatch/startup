    topic: head-to-head-positioning
    missingEvidence: Internal data or KOL work on where dual sclerostin/DKK1 targeting could outperform
      incumbent single-target or anabolic approaches in clinically meaningful practice.
    whyItMatters: Public science suggests possible differentiation, but not enough to prove a commercial
