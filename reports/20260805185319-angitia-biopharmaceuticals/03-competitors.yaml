  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Direct public price, contracting, and reimbursement assumptions for Angitia relative
      to incumbents and rare-disease peers.
    whyItMatters: Without pricing and access assumptions, the competition chapter cannot support a quantified
      undercutting or premium-position thesis.
    diligencePath: Request market-access work, analog pricing analysis, and target product profile economics.
    relatedQuestionRefs:
    - QP019
    - QP020
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: Physician interviews or payer research quantifying how willing prescribers would
      be to switch from existing osteoporosis therapies to a new dual-target biologic.
    whyItMatters: Switching cost is a central competitive variable and public pages mostly describe products
      rather than real adoption friction.
    diligencePath: Run KOL interviews and payer advisory work focused on sequencing thresholds and cardiovascular-risk
      trade-offs.
    relatedQuestionRefs:
    - QP011
    - QP016
