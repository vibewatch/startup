      spinal-fusion biologic landscape after AGA111’s termination.
    whyItMatters: This adjacency is now less central, but still helps explain why Angitia narrowed its
      scope.
    diligencePath: Pull product-specific spinal-fusion biologic sources if legacy AGA111 context becomes
      material again.
