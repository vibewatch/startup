evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      Direct post-money valuation, price per share, and liquidation preference details for the Series C and Series D
      financings.
    whyItMatters: Valuation is a cover metric and later valuation work is weaker without the actual priced round terms.
    diligencePath: Request the latest cap table, term sheet, and investor presentation from management or lead investors.
    relatedQuestionRefs:
      - QO021
  - type: missing-source
    severity: material
    topic: board-composition
    missingEvidence: >-
      A directly accessible current board roster showing all independent and investor directors after Kevin Li joined in
      2026.
    whyItMatters: Board composition affects governance quality, control, and key-person risk assessment.
    diligencePath: Request the current board observer and director list or a recent financing close memo.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: cover-metrics
    missingEvidence: Current customer count, revenue, and commercial partner metrics from a company-authored source.
    whyItMatters: The company overview should distinguish between public traction and unsupported private metrics.
    diligencePath: >-
      Confirm whether the company has any commercialization, collaboration revenue, or customer metrics appropriate for
      disclosure.
    relatedQuestionRefs:
      - QO022
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Debt facilities, venture debt, secondary share sales, or other off-press-release capital structure details.
    whyItMatters: Capital structure details influence dilution risk and later financial analysis.
    diligencePath: Ask management or counsel for debt schedules, side letters, and recent financing documents.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: current-pipeline-status
    missingEvidence: >-
      A refreshed company-authored pipeline page reflecting whether AGA111 is still active after the June 2026
      termination reports.
    whyItMatters: A disclosure lag on the public website affects confidence in the company's current public narrative.
    diligencePath: >-
      Request the latest board-approved pipeline slide or confirm with investor relations whether the website will be
      updated.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Public price, net price, and reimbursement assumptions for AGA2118 and AGA2115.
    whyItMatters: Dollar TAM and commercial adoption modeling are weak without any pricing or access guidance from the company.
    diligencePath: Request internal launch planning assumptions, payer research, and analog pricing benchmarks.
    relatedQuestionRefs:
      - QM022
  - type: missing-source
    severity: material
    topic: tam-math
    missingEvidence: Management-authored TAM, SAM, or SOM math for Angitia’s osteoporosis and osteogenesis imperfecta programs.
    whyItMatters: The chapter can size patient pools, but not revenue opportunity, with high confidence using only public sources.
    diligencePath: Request investor deck slides or internal market models used in financing materials.
    relatedQuestionRefs:
      - QM023
  - type: private-evidence-only
    severity: material
    topic: payer-readiness
