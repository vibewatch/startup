artifact: financials
slug: aviatrix
runDate: 2026-10-18
company:
  name: Aviatrix
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports Aviatrix as a software-first multicloud security vendor that
    later added a managed-service deployment model, but the underwriteable financial view
    remains thin. The best disclosed traction datapoints are a 2022 $62 million ARR figure,
    500-plus customers, and third-party 2024-2026 estimates, while burn, gross margin,
    realized pricing, runway, and customer concentration remain undisclosed.
sections:
  - id: revenue-model
    title: Revenue model and monetization surface
    body: >-
      Public materials point to a software-platform revenue model built around multicloud
      networking and security control, then expanded with a managed-service option rather
      than a hardware appliance sale. Aviatrix documentation describes CNSF as an inline
      cloud security control layer with Terraform and infrastructure-as-code integration,
      while Microsoft Marketplace and the 2024 PaaS launch show a second packaging mode
      where Aviatrix operates more of the management burden itself. That combination
      supports a recurring enterprise-contract model with two deployment forms: a core
      platform sale and a managed-service upsell. What is still missing is the commercial
      denominator that matters most for underwriting: the company does not publicly disclose
      contract metric, ACV, realized discounting, or how much of the business has migrated
      to the managed-service package.
    claimRefs: [CI007, CI008, CI009, CI016]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-efficiency
    title: Public traction and unit-economics proxies
    body: >-
      The strongest public traction datapoints still come from a 2022 Forbes report and
      later company summaries rather than from current company financial statements. Forbes
      reported more than 500 customers, $62 million of ARR at the end of Q2 2022, roughly
      doubling revenue, and 188% net dollar retention, while later company-issued materials
      continued to describe Aviatrix as trusted by more than 500 leading enterprises. Those
      datapoints support demand and some land-and-expand behavior, but they are old and
      sparse. A third-party 2026 company profile estimated 2024 ARR at $63.9 million and
      showed headcount falling from 510 in 2024 to 426 in March 2026; that makes the
      implied ARR-per-employee proxy roughly $150k, but the proxy is weak because it mixes
      an estimated revenue numerator with a later workforce snapshot and says nothing about
      gross profit or sales efficiency.
    claimRefs: [CI004, CI005, CI006, CI010, CI011, CI012]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and cost-structure visibility
    body: >-
      The funding history shows material outside capital but an incomplete public bridge from
      historical rounds to current adequacy. Aviatrix said its 2019 Series C took total
      disclosed funding above $76 million and its 2021 Series E added $200 million at a
      $2 billion valuation, yet later independent profiles disagree on the cumulative total:
      one reports $346 million across six rounds and another reports $275 million plus three
      publicly documented rounds. That inconsistency matters because burn, cash on hand,
      debt facilities, covenant constraints, and working-capital needs are not publicly
      disclosed. Official materials also frame the product as software plus managed service,
      which should be less capex-intensive than hardware, but there is still no public gross
      margin bridge or services-mix disclosure to show whether the PaaS offer lifts or
      dilutes unit economics.
    claimRefs: [CI001, CI002, CI003, CI007, CI009, CI013, CI014]
  - id: verdict
    title: Financial verdict and diligence blockers
    body: >-
      The investable financial story is directionally positive on product monetization but
      not yet underwriteable on economics. Aviatrix appears to have real enterprise demand,
      a recurring software core, and a managed-service wrapper that could widen wallet share
      and reduce customer-operational friction. However, public evidence still leaves the
      decisive investor questions unanswered: current ARR and revenue by product, realized
      pricing, gross margin, services mix, CAC and payback, cash balance, runway, customer
      concentration, and any debt or project-finance obligations. Until management provides
      a current revenue bridge and cash-burn package, the prudent stance is to treat public
      financials as sufficient for product-market-traction validation but insufficient for
      underwriting the next financing trigger or a defensible margin path.
    claimRefs: [CI007, CI010, CI012, CI014]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Core platform software
        - Enterprise cloud networking and security platform sold into multicloud estates
        - Contract metric not publicly disclosed
        - Commercial surface verified; customer count is public, revenue mix is not
        - Medium
        - Current ARR/revenue split by core platform, contract length, and renewal cohorts
      - - Aviatrix PaaS managed service
        - Managed-service deployment model for the same platform
        - Free 30-day trial then enterprise contract; pricing metric undisclosed
        - Launched in Nov 2024 with SLA-backed infrastructure
        - Medium
        - Attach rate, ACV, gross margin, and churn versus self-managed deals
      - - ACE certification and enablement ecosystem
        - Training/certification adjacent to the platform
        - Course or certification seat economics not publicly disclosed
        - Program exists, but revenue contribution is unreported
        - Low
        - Revenue, margin, and GTM role of the certification program
    notes: >-
      Public sources verify the existence of these monetization surfaces, but only the PaaS
      trial is explicitly described; realized pricing and stream-level revenue mix remain
      undisclosed.
    claimRefs: [CI007, CI008, CI016]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - Core platform enterprise contract
        - Solution brief claims flat-rate pricing and predictable billing, but no public rate card
        - Contract basis, discounting, and realized ASP remain unknown
        - Aviatrix solution brief plus independent disclosure-gap note
      - - Aviatrix PaaS managed service; 30-day free trial is public, post-trial terms are not
        - Managed-service value proposition is explicit, realized pricing is not
        - SLA details, implementation fees, and attach rate are undisclosed
        - Microsoft Marketplace and PR Newswire launch materials
      - - Certification / ecosystem monetization; no public schedule located
        - Monetization could be paid training, partner enablement, or marketing subsidy
        - No public revenue contribution or discount structure
        - Company press materials referencing the ACE program
    notes: >-
      This table separates public packaging signals from realized pricing; null economics are
      evidence gaps, not zero values.
    claimRefs: [CI007, CI009, CI016]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - ARR run rate
        - $62M at end of Q2 2022
        - Medium
        - Latest directly cited recurring-revenue datapoint in reviewed public sources
        - Current ARR by quarter, product line, and cohort
      - - Growth and expansion
        - Revenue roughly doubled every year; NDRR 188% y/y
        - Medium
        - Suggests strong cohort expansion if the 2022 event data still reflects the business
        - Trailing eight quarters of ARR growth, GRR, NRR, and logo churn
      - - ARR per employee proxy
        - ~$150k using $63.9M estimated 2024 ARR and 426 Mar 2026 employees
        - Low
        - Rough productivity check when audited efficiency metrics are missing
        - Revenue and headcount by quarter, plus sales and R&D headcount split
      - - Gross margin / burn / runway
        - null
        - Low
        - Core underwriting metric set for capital adequacy and margin-path conviction
        - Gross margin bridge, monthly burn, cash balance, debt schedule, and runway plan
    notes: >-
      Values combine company event disclosures with third-party estimates; where no support
      exists, the cell is intentionally null and paired with a diligence request.
    claimRefs: [CI005, CI006, CI010, CI011, CI012, CI014]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a software platform sold in self-managed and managed-service
      forms, but not a disclosed pricing or margin bridge.
    data:
      nodes:
        - label: Enterprise multicloud and AI workloads
          detail: >-
            Kubernetes, GenAI, and multicloud complexity create the demand pool Aviatrix
            targets.
        - label: CNSF core platform
          detail: >-
            Inline cloud-network security control layer with Terraform and IaC integration.
        - label: Self-managed software deployment
          detail: >-
            Core platform sale where the customer still operates more of the environment.
        - label: Aviatrix PaaS managed service
          detail: >-
            Managed deployment option with AI-enhanced operations and a public 30-day trial.
        - label: Customer value and billing logic
          detail: >-
            Security, visibility, automation, cost optimization, and predictable billing are
            the public economic hooks.
        - label: Public traction and disclosure ceiling
          detail: >-
            500-plus enterprise adoption is visible, but realized pricing, gross margin, burn,
            and runway are not.
      edges:
        - from: Enterprise multicloud and AI workloads
          to: CNSF core platform
          label: creates need for
        - from: CNSF core platform
          to: Self-managed software deployment
          label: sold as
        - from: CNSF core platform
          to: Aviatrix PaaS managed service
          label: extended by
        - from: Self-managed software deployment
          to: Customer value and billing logic
          label: monetized through
        - from: Aviatrix PaaS managed service
          to: Customer value and billing logic
          label: adds managed operations
        - from: Customer value and billing logic
          to: Public traction and disclosure ceiling
          label: partially evidenced by
    approximationNotes: >-
      This is a commercialization flow, not a revenue waterfall; public sources disclose
      packaging and value claims, but not the conversion rates or gross-profit bridge between
      nodes.
    claimRefs: [CI007, CI008, CI009, CI014]
callouts:
  - calloutType: insight
    title: Managed service is the clearest recent monetization update
    body: >-
      The 2024 PaaS launch is financially important because it creates a managed-service
      wrapper around the existing platform, potentially improving deployment velocity and
      broadening recurring revenue surface area without changing the underlying product thesis.
    claimRefs: [CI007, CI008]
  - calloutType: risk
    title: Public financial disclosure is still too thin for capital-adequacy underwriting
    body: >-
      Burn, cash, debt, gross margin, realized pricing, and concentration data are still
      absent from public evidence, so even a real traction story does not yet convert into a
      defensible runway or margin-path conclusion.
    claimRefs: [CI010, CI014]
