      - - FIPS 140-3 validation scope and timing are not independently corroborated in the reviewed set
        - Regulated buyers requiring crypto-module proof
        - Carahsoft says the data plane achieved validation and expected full validation in August 2026
        - Medium
        - High
        - Public partner messaging at least frames a concrete certification path
        - Audit and procurement cycles can still stall if certificate scope changed or slipped
