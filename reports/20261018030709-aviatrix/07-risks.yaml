  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Evidence
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - Distributed enforcement must propagate correctly across clouds, VPCs, Kubernetes, and serverless paths
        - Official PDF and docs say one policy plane governs every workload path and propagates globally
        - High
        - High
        - Medium
        - Any control-plane or policy-drift failure would undermine Aviatrix's central product promise
        - No public uptime, rollback, or incident-history evidence appears in the reviewed set
      - - Migration away from chokepoint security can create high implementation friction for buyers
        - Aviatrix says legacy models miss pod egress, serverless, and east-west traffic; its 2025 survey says 67 percent struggle with firewall integration
        - High
        - High
        - Medium
        - Proof-of-value cycles can lengthen if deployments require major architecture rewrites
        - No independent data on deployment duration, failed pilots, or integration rework
      - - AI and Kubernetes adoption expands east-west traffic faster than governance practices
        - Docs and launch materials frame Shadow AI, ephemeral workloads, and DevOps velocity as current security accelerants
        - High
        - Medium
        - Medium
        - Attack-surface growth can outpace policy coverage and customer operating maturity
        - Need independent production references that measure containment efficacy after rollout
      - - Managed-service packaging concentrates maintenance and upgrade execution inside Aviatrix
        - PRNewswire says PaaS offloads infrastructure maintenance, monitoring, and upgrades to Aviatrix
        - Medium
        - Medium
        - Medium
        - The model lowers customer toil but centralizes service-operator dependence
        - No public SLA metrics or service incident disclosures were found in the assigned pool
    notes: >-
      Public sources describe architecture and product intent more clearly than
      they document production reliability or incident performance.
    claimRefs: [CR001, CR002, CR003, CR005, CR010]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration signal
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Public-sector distribution
        - Carahsoft
        - Government, defense, education distribution partner
        - Carahsoft is named as the public-sector route to market in the reviewed set
        - If this channel stalls, regulated-segment pipeline and contract-vehicle access weaken
        - High
        - State and local plus higher-education demand can still transact without FedRAMP in some cases
        - Federal expansion remains both partner- and authorization-gated
      - - Managed multicloud delivery
        - Orange Business
        - Managed service, private backbone, and enterprise integration partner
        - Orange integrates Aviatrix with Evolution Platform and says the combined offer reduces operational effort
        - If joint delivery underperforms, Aviatrix loses a high-credibility packaged path for large enterprises
        - Medium
        - Orange offers managed, self-managed, and co-managed delivery options
        - Aviatrix still depends on partner sales and delivery quality for this offer
      - - Cross-cloud platform parity
        - AWS / Azure / Google Cloud / OCI
        - Underlying cloud primitives and runtime environments
        - Aviatrix documentation promises the same policy outcomes across all four clouds
        - If provider behavior diverges, Aviatrix must spend engineering effort to preserve abstraction and policy consistency
        - High
        - Single policy plane and IaC-native workflow are explicit product mitigations
        - Hyperscaler changes can reopen parity gaps faster than customers can re-architect
      - - Incumbent-firewall coexistence
        - Existing firewall vendors such as Palo Alto
        - Complementary control stack rather than rip-and-replace alternative
        - Partner messaging explicitly says Aviatrix works alongside existing Palo Alto investments
        - If integrations lag, buyers can fall back to incumbent architectures instead of expanding Aviatrix scope
        - Medium
        - Compatibility with current tooling is part of the partner and product messaging
        - Aviatrix does not fully control the release cadence or roadmap of adjacent security vendors
    notes: >-
      Counterparties are limited to those directly evidenced in the assigned
      source pool; this is a dependency map, not a quantified partner-revenue
      breakdown.
    claimRefs: [CR002, CR004, CR008, CR009, CR010]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Residual risk is highest where compliance gating, multi-cloud execution
      complexity, and financial opacity intersect with only partial public proof.
    data:
      columns:
        - Likelihood
        - Residual severity
        - Mitigation maturity
      rows:
        - label: FedRAMP / regulated-public-sector access
          note: Carahsoft says federal authorization is still absent.
          values:
            - label: High
              tone: high
              note: Federal procurement gate is open in the public record.
            - label: High
              tone: adverse
              note: The gap directly limits segment access until authorization proof changes.
            - label: Medium
              tone: warning
              note: FIPS and framework mapping help, but do not replace FedRAMP.
        - label: Cross-cloud policy propagation
          note: The core product promise depends on universal enforcement across clouds.
          values:
            - label: High
              tone: high
              note: Product claims explicitly span AWS, Azure, GCP, OCI, Kubernetes, and serverless.
            - label: High
              tone: adverse
              note: A propagation or parity failure would hit Aviatrix's main differentiation.
            - label: Medium
              tone: warning
              note: Single-policy-plane messaging is strong, but public reliability proof is thin.
        - label: Managed-service operator dependence
          note: PaaS and partner channels reduce toil while increasing execution concentration.
          values:
            - label: Medium
              tone: medium
              note: Aviatrix and partners own more of the operational surface in packaged offers.
            - label: Medium
              tone: risk
              note: Service or partner underperformance can slow expansion even without a product defect.
            - label: Medium
              tone: warning
              note: Channel breadth helps, but SLA and incident evidence is not public here.
        - label: Financial visibility and price discovery
          note: Public metrics remain secondary-source and partly conflicting.
          values:
            - label: High
              tone: high
              note: The public record still leans on stale 2021 financing data and estimated ARR.
            - label: High
              tone: adverse
              note: Underwriting is fragile when capital raised, burn, and retention are not cleanly disclosed.
            - label: Low
              tone: neutral
              note: Current mitigation maturity is low because the missing proof must come from company disclosure.
        - label: Customer integration and DevOps adoption
          note: Aviatrix's company-issued survey reports material integration and pipeline-security friction.
          values:
            - label: High
              tone: high
              note: Aviatrix reports that 67 percent struggle with firewall integration and 85 percent with DevOps pipeline security.
            - label: Medium
              tone: risk
              note: Adoption friction can lengthen deployment and delay realized security value.
            - label: Medium
              tone: warning
              note: IaC integration and managed packaging mitigate complexity, but independent deployment evidence is absent.
        - label: Partner-channel execution
          note: Orange Business and Carahsoft provide packaged delivery and procurement routes.
          values:
            - label: Medium
              tone: medium
              note: Partner execution matters most in managed multicloud and public-sector deployments.
            - label: Medium
              tone: risk
              note: Weak delivery or contract access would narrow go-to-market reach.
            - label: Medium
              tone: warning
              note: Multiple delivery modes reduce, but do not remove, channel dependence.
    approximationNotes: >-
      Ordinal ratings synthesize only the assigned source pool; they are not a
      statistical model and should be updated if Aviatrix publishes audited or
      regulator-backed evidence.
    claimRefs: [CR005, CR006, CR008, CR009, CR010, CR013, CR016]
