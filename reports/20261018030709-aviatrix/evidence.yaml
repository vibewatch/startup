evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Company-reported ARR, revenue, gross margin, burn, and retention metrics for 2025-2026.
    whyItMatters: The overview can only use customer and headcount proxies until hard financials are disclosed or shared privately.
    diligencePath: Request the current board deck or CFO KPI package with recurring revenue, margin, and burn disclosures.
  - type: missing-source
    severity: minor
    topic: leadership-governance-depth
    missingEvidence: >-
      A current executive org chart, board committee assignments, and explicit succession coverage below the named
      public leadership roster.
    whyItMatters: >-
      The public overview names only a handful of executives and directors, so key-person and governance depth cannot be
      tested from open sources alone.
    diligencePath: >-
      Request the latest board deck or diligence-room org/governance package covering executive responsibilities and
      committee structure.
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: A company-confirmed financing history that reconciles total capital raised, round count, and any extensions.
    whyItMatters: Public datasets disagree on lifetime funding, which weakens valuation context and later ownership analysis.
    diligencePath: Obtain a signed financing schedule or cap-table summary from company counsel.
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: material
    topic: cap-table-and-secondary
    missingEvidence: Publicly verifiable disclosure of post-Series E debt, secondary sales, and current cap-table ownership.
    whyItMatters: Without this, control, liquidation, and entry-price context remain opaque despite the 2021 financing data.
    diligencePath: Request the latest cap table, debt schedule, and board-approved secondary history.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: tam-sam-som
    missingEvidence: >-
      Independent market-sizing research that defines category boundaries and quantifies current TAM, SAM, or SOM for
      multicloud networking plus runtime-security control layers.
    whyItMatters: >-
      Without an independent spend model, valuation and market-share conclusions have to rely on demand proxies instead
      of buyer-scoped revenue pools.
    diligencePath: >-
      Obtain current analyst reports or public-company disclosures that break out multicloud networking, workload
      security, and adjacent control-plane spend with explicit methodology.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: budget-ownership
    missingEvidence: >-
      Public procurement, budget, or customer evidence showing whether security, cloud platform, network operations, or
      FinOps owns the purchase in each segment.
    whyItMatters: >-
      Buyer and payer ambiguity prevents precise SAM isolation, pricing-power assessment, and a clean adoption-path
      model by segment.
    diligencePath: >-
      Collect customer procurement documents, case studies with budget owners, or public RFPs that name the sponsoring
      team and budget line.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Vendor-verified price cards, contract structures, or anonymized proposals for Aviatrix, Alkira, and Prosimo on the
      same workload basis.
    whyItMatters: >-
      Without a common commercial unit, the chapter can compare packaging logic but not true like-for-like economic
      efficiency.
    diligencePath: >-
      Request recent customer proposals or contracts for a matched multicloud use case and normalize them by throughput,
      environment count, and managed-service scope.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: peer-primary-evidence
    missingEvidence: >-
      Primary-source product and packaging materials from Alkira and Prosimo aligned to the same comparison criteria
      used for Aviatrix.
    whyItMatters: >-
      The chapter has richer primary evidence for Aviatrix than for its named direct peers, so some matrix cells remain
      comparison-driven rather than directly corroborated.
    diligencePath: >-
      Retain current official product, architecture, and pricing pages from Alkira and Prosimo, then rerun the feature
      and pricing tables against those primary sources.
    relatedQuestionRefs:
      - QP001
      - QP002
      - QP004
    relatedTableRefs:
      - TP001
      - TP002
      - TP003
  - type: missing-source
    severity: minor
    topic: switching-cost-quantification
    missingEvidence: >-
      Customer migration case studies or procurement records quantifying time-to-value, replacement cost, and
      operating-headcount tradeoffs versus native controls or managed peers.
    whyItMatters: >-
      Competitive durability depends heavily on operational burden and switching cost, but the retained evidence is more
      descriptive than quantified.
    diligencePath: >-
      Collect enterprise case studies, migration statements of work, or procurement summaries that compare self-managed
      and managed deployment models on staffing and elapsed deployment time.
    relatedQuestionRefs:
      - QP002
      - QP007
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-burn
    missingEvidence: Current gross margin, services gross margin, monthly burn, cash balance, and runway plan
    whyItMatters: These metrics determine whether Aviatrix can fund growth internally or needs another round on unattractive terms.
    diligencePath: >-
      Request board deck financials, monthly cash bridge, and a gross-margin decomposition by software versus managed
      service.
    relatedQuestionRefs:
      - QI007
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: ACV, pricing metric, average discounting, and renewal uplift by product and deployment mode
    whyItMatters: List pricing and packaging claims do not show actual monetization quality or pricing power.
    diligencePath: Request current price book, sampled order forms, and cohort analysis for self-managed versus PaaS deals.
    relatedQuestionRefs:
      - QI002
      - QI005
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback, magic number, pipeline conversion, average sales cycle, and channel economics
    whyItMatters: Growth without efficiency data makes it hard to judge whether expansion is durable or subsidy-driven.
    diligencePath: Request finance-approved GTM KPI pack with direct and partner-sourced bookings, win rates, and quota attainment.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: capital-structure
    missingEvidence: Debt facilities, covenant obligations, customer concentration, deferred revenue, and working-capital detail
    whyItMatters: These items materially change downside protection and next-round timing even when top-line demand is healthy.
    diligencePath: Request cap table, debt agreements, top-customer concentration schedule, and deferred-revenue roll-forward.
    relatedQuestionRefs:
      - QI004
      - QI007
      - QI008
  - type: missing-source
    severity: material
    topic: compliance-validation
    missingEvidence: >-
      Independent certification detail, current SLA language, or third-party audit output for the current CNSF/PaaS
      generation.
    whyItMatters: >-
      Official materials reference compliance, trust, and managed-service quality, but investors still need
      independently verifiable proof of controls and service commitments.
