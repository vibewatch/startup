      - number: '6.3'
        title: 持久性与集中度仍大多不透明
        blocks:
          - type: paragraph
            body: >-
              扩张入口清晰可见：当前 marketplace 和新闻材料把 Aviatrix 从多云连接扩展到 Kubernetes、AI 和托管 PaaS 部署选项， 渠道计划则按新 logo
              和收入里程碑奖励伙伴。这些信号支持一个合理的落地扩张故事，却不能替代硬留存证据。入选来源没有披露 毛留存、净留存、logo 流失、合同期限或头部客户集中度。公开证据也偏向公司和伙伴控制的渠道，因此不能只凭
              logo 推断客户持久性。 渠道采访记录了从销售完整平台转向更窄切入点的变化，说明存在采用摩擦，尽管文章正面描述了这一转向。正确的投资判断是：
              采用看起来真实，扩张路径存在，但续约质量和集中度风险仍是待尽调事项，而非已验证优势。
