        title: 展示项
        blocks:
          - type: callout
            title: 架构优势仍可能压缩成采购中心问题
            body: 当客户明确采购多云运行时控制时，Aviatrix 看起来最强。若同一客户优先考虑降低运维负担、利用现有防火墙体系或采用 原生云默认设置，即使技术架构仍有差异化，公司的优势也会迅速收窄。
