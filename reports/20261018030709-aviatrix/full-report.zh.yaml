        - 托管服务、专用骨干网和企业集成合作伙伴
        - Orange 将 Aviatrix 集成到 Evolution Platform，并称组合方案降低了运营工作量
        - 如果联合交付表现不佳，Aviatrix 将失去面向大型企业的高可信度封装路径
        - 中
        - Orange 提供托管、自托管和共同托管交付选项
        - Aviatrix 仍依赖合作伙伴的销售和交付质量来支撑这一方案
      - - 跨云平台一致性
        - AWS / Azure / Google Cloud / OCI
        - 底层云原语和运行时环境
        - Aviatrix 文档承诺四朵云实现相同的策略结果
        - 如果云厂商行为出现差异，Aviatrix 必须投入工程资源，维持抽象层和策略的一致性
        - 高
        - 单一策略平面和原生 IaC 工作流是明确的产品缓释措施
        - 超大规模云厂商的变化可能比客户重构架构更快地重新打开一致性缺口
      - - 与现有防火墙共存
        - 现有防火墙厂商，例如 Palo Alto
        - 互补控制栈，而非推倒重来的替代方案
        - 合作伙伴口径明确表示，Aviatrix 可与现有 Palo Alto 投资并行工作
        - 如果集成滞后，买方可以退回既有架构，而不是扩大 Aviatrix 的范围
        - 中
        - 与现有工具兼容是合作伙伴和产品口径的一部分
        - Aviatrix 无法完全控制相邻安全厂商的发布节奏或路线图
    notes: 对手方仅限于指定来源池中有直接证据支持的对象；这是一张依赖关系图，不是量化的合作伙伴收入拆分。
    claimRefs:
