      - number: '6.2'
        title: 采用广度真实，但具名证明集中
        blocks:
          - type: paragraph
            body: >-
              公开牵引力信号有意义但不均衡。Aviatrix 自己 2024 年底的 PaaS 公告称平台获全球超过 500 家领先企业信任；2025 年 1 月 theCUBE Research 采访则以超过 23,000
              名 ACE 认证工程师提供了较大的生态指标。具名客户证据更窄。资料池中最明确的结果 是 Aviatrix 解决方案简介里引用 Verint 对分段、可视性和自动化收益的评价。Devoteam
              行业文章补充了一则正面的 Splunk 轶事和更长的 Aviatrix 使用组织名单，但没有披露这些客户的合同范围、支出或 rollout 深度。结论是：证据足以确认真实的 企业使用，但不足以判断全体 logo
              已广泛标准化到生产环境。
