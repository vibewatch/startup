      - number: '8.4'
        title: 退出准备度与尽调门槛
        blocks:
          - type: paragraph
            body: >-
              公开证据尚不足以判断退出准备度。保留集合显示平台扩张、品类叙事和已知企业客户，却没有经审计财报、清晰的条款可见度 或治理细节，外部投资人无法仅凭公开记录判断 IPO
              式或溢价二级交易结果。因此，最有用的尽调路径不是再做抽象市场争论， 而是用当前收入质量、利润率和消耗细节、客户集中度与留存、优先股堆叠，以及 2021 年之后任何一手或二手定价证据，重新做
              私有投资判断。如果管理层无法提供这套材料，逻辑应继续处于跟踪模式，而不是进入买入模式。
            claimRefs:
