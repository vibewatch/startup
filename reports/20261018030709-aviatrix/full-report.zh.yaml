      - number: '1.3'
        title: 融资历史、规模代理指标与里程碑
        blocks:
          - type: paragraph
            body: >-
              最强的公开融资标记仍是 2021 年 Series E：Tracxn 记录了由 TCV 领投的 $200 million 轮融资，投后估值 $2 billion，前一轮是 2021 年 2 月的 Series
              D。累计融资额尚未统一：另一份 2026 年 8 月资料将 Aviatrix 概括为三轮融资、$275 million-plus，而 Tracxn 则称六轮共 $346
              million。规模代理指标同样不完美：官方材料 声称拥有超过 500 家企业客户，汇编公开资料显示 2026 年 3 月有 426 名员工，低于 2024 年峰值；收入和 ARR
              仍只见于第三方估算，而非公司披露。里程碑轨迹则足以看出产品从 CoPilot 演进到 Distributed Cloud Firewall 和 Network Insights API，同时伴随一项 2025
              年公开安全事件指控，后续风险工作应以一手报道核验。
