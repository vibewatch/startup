      - number: '7.4'
        title: 财务不透明与止损标准
        blocks:
          - type: paragraph
            body: >-
              财务风险与其说来自明确的资不抵债信号，不如说来自当前运营证据极少公开。Tracxn 仍把最近一轮披露融资锚定为 2021 年 9 月 $200 million 的 Series E、投后估值 $2
              billion；Silicon Valley Investclub 则称大多数公开收入和 ARR 数据是第三方估算，并显示员工数从 2024 年 510 人降至 2026 年 3 月 426
              人。同样两家公开聚合方对累计融资额也有分歧， 使基础资本结构图景都不精确。对投资人而言，最实用的止损标准是可测量的：监管细分没有已验证的联邦授权进展，没有当前 公司报告的收入或留存证明，以及员工或伙伴驱动的
              go-to-market 覆盖继续收缩却没有客户证据抵消。
            claimRefs:
