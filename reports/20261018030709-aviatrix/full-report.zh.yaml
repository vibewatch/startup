  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 覆盖范围与解决方案集合
        blocks:
          - type: paragraph
            body: >-
              竞争集合不止于具名创业公司同行。Aviatrix 仍与 Alkira 和 Prosimo 同处直接多云网络与安全群组，但也要面对 超大规模云原生控制、以边界防火墙为中心的安全栈，以及在内部拼装
              AWS、Azure、GCP 和 Kubernetes 原语的自建方案。 保留证据始终把 Aviatrix 描述为嵌入云的控制平面与数据平面架构，而不是简单的监控工具。买家替代发生在架构层：
              团队可以购买托管骨干网、继续扩展现有防火墙、依赖原生云构件，或自行运行 overlay fabric。
