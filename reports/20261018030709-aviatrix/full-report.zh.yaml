      - number: '8.3'
        title: 情景边界与可比纪律
        blocks:
          - type: paragraph
            body: >-
              用保留的公开证据划出边界即可，不要把它当成精确估值。独立来源显示企业采用、拥挤的竞争赛道和持续的多云安全痛点，这些因素可能支撑持久的品类赢家。同时，最强的公开估值数据点仍是 2021 年的
              $2B，保留集合中最好的当前规模数据点则是第三方对 2024 年 ARR 的估算，而非披露收入。因此，情景表可以说明上行或下行需要哪些条件，但任何硬性估值判断仍取决于管理层开放当前 ARR
              或收入、增长、留存、消耗和融资条款数据。
