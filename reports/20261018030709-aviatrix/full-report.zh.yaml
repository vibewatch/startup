  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 目标细分与初始采购动因
        blocks:
          - type: paragraph
            body: >-
              入选证据始终将 Aviatrix 放在跨多云运营的大企业，而非 SMB 或单云买家身上。Oracle 的云基础设施文章称，2019 年已有 300 多家企业选择 Aviatrix；当前官方及
              marketplace 材料则把平台定位给管理多云、Kubernetes 和 AI 工作负载的企业云管理员、 架构师、安全团队、网络团队，以及 DevOps 或平台运营者。AWS 和 Oracle
              发布的部署叙事也展示了典型入口：客户先在自己的 云账户中启动 Controller 和 CoPilot，再把控制平面延伸到其他云和环境。这说明 Aviatrix 先切入痛苦的基础设施控制问题，
              再扩展到更广的安全和运营工作流。
