      - number: '3.3'
        title: 切换成本、多宿主与采购动因
        blocks:
          - type: paragraph
            body: >-
              相比全面替换，Aviatrix 看起来更容易作为增量控制层落地。其材料反复把平台定位为扩展防火墙和云原生控制，而非
              取代它们；这降低了大企业内部的政治阻力，却也保留了多宿主。对于已经运行多套安全工具的受监管或混合云环境，这种
              共存逻辑有帮助；但买家也可以继续使用原生控制、现有防火墙或托管同行，因此锁定力较弱。运营负担不是次要问题， 而是竞争持久性的核心。
            claimRefs:
              - CP004
              - CP007
              - CP011
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: 护城河持久性与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Aviatrix 的护城河更像架构护城河，而非分销护城河。公司有可信的企业案例和差异化的运行时控制叙事，但保留的独立 证据也突出了两处压力。第一，托管 SaaS
              同行可以吸引只想获得结果、却不想运营客户侧网关或调校云网络构件的团队。 第二，超大规模云厂商的 secure-by-default 动作可能让原生控制更容易被接受，尤其是以单云为主或可以容忍较低跨云一致性
              的买家。因此，Aviatrix 在复杂多云环境中的优势最强；当简单性或原生捆绑主导采购决策时，优势最不持久。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP012
