        title: 公开牵引力与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              最强的公开牵引力数据点仍来自 2022 年 Forbes 报道和后续公司摘要，而非当前公司财务报表。Forbes 报告称客户超过 500 家、2022 年第二季度末 ARR 为 $62
              million、收入大约翻倍，净美元留存为 188%；后续公司材料继续称 Aviatrix 获超过 500 家领先企业信任。这些数据支持需求及一定的落地扩张行为，但时间久远且稀疏。一份 2026 年第三方公司资料
              估算 2024 年 ARR 为 $63.9 million，并显示员工数从 2024 年的 510 人降至 2026 年 3 月的 426 人；据此隐含 ARR/员工约为
              $150k，但该代理指标较弱，因为收入分子是估算值、员工快照来自更晚时点，也没有说明毛利或销售效率。
