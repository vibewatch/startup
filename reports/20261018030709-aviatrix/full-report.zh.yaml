            body: 最难的问题不是 Aviatrix 是否做出了有用产品，而是今天的投资人能否依据仍依赖 2021 年融资标记和不完整经济数据的公开记录， 为今天的入场价格辩护。
            calloutType: risk
            claimRefs:
              - CV001
