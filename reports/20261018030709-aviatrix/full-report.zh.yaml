      columns:
        - 可能性
        - 剩余严重性
        - 缓解成熟度
      rows:
        - label: FedRAMP / 受监管公共部门准入
          note: Carahsoft 称联邦授权仍然缺失。
          values:
            - label: 高
              tone: high
              note: 公开记录显示联邦采购门槛尚未跨过。
            - label: 高
              tone: adverse
              note: 在授权证据发生变化前，这一缺口会直接限制细分市场准入。
            - label: 中
              tone: warning
              note: FIPS 和框架映射有所帮助，但不能替代 FedRAMP。
        - label: 跨云策略传播
          note: 核心产品承诺取决于跨云普遍执行。
          values:
            - label: 高
              tone: high
              note: 产品主张明确覆盖 AWS、Azure、GCP、OCI、Kubernetes 和无服务器环境。
            - label: 高
              tone: adverse
              note: 传播或能力对等失败会打击 Aviatrix 的核心差异化。
            - label: 中
              tone: warning
              note: 单一策略平面的叙事很强，但公开可靠性证据较薄弱。
        - label: 对托管服务运营方的依赖
          note: PaaS 和伙伴渠道减少了琐碎运维，却提高了执行集中度。
          values:
            - label: 中
              tone: medium
              note: 在打包方案中，Aviatrix 和伙伴承担了更多运营环节。
            - label: 中
              tone: risk
              note: 即使产品没有缺陷，服务或伙伴表现不佳也会拖慢扩张。
            - label: 中
              tone: warning
              note: 渠道广度有所帮助，但这里没有公开 SLA 和事故证据。
        - label: 财务可见性与价格发现
          note: 公开指标仍来自二手来源，且部分相互冲突。
          values:
            - label: 高
              tone: high
              note: 公开记录仍依赖过时的 2021 年融资数据和估算 ARR。
            - label: 高
              tone: adverse
              note: 融资额、烧钱速度和留存率未被清晰披露时，投资判断很脆弱。
            - label: 低
              tone: neutral
              note: 当前缓解成熟度较低，因为缺失证据必须来自公司披露。
        - label: 客户集成与 DevOps 采用
          note: Aviatrix 发布的公司调查显示，集成和流水线安全存在明显摩擦。
          values:
            - label: 高
              tone: high
              note: Aviatrix 报告称，67% 的受访者在防火墙集成上遇到困难，85% 的受访者在 DevOps 流水线安全上遇到困难。
            - label: 中
              tone: risk
              note: 采用摩擦会拉长部署周期，推迟安全价值兑现。
            - label: 中
              tone: warning
              note: IaC 集成和托管打包能够缓解复杂度，但没有独立部署证据。
        - label: 伙伴渠道执行
          note: Orange Business 和 Carahsoft 提供打包交付和采购路径。
          values:
            - label: 中
              tone: medium
              note: 在托管多云和公共部门部署中，伙伴执行最为关键。
            - label: 中
              tone: risk
              note: 交付能力弱或合同准入受限，都会缩小市场进入范围。
            - label: 中
              tone: warning
              note: 多种交付模式能降低但无法消除对渠道的依赖。
    approximationNotes: 序数评级仅综合指定来源池；它不是统计模型，若 Aviatrix 发布经审计或监管机构支持的证据，应及时更新。
