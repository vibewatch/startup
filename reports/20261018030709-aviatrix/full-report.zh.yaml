    sections:
      - number: '1.1'
        title: 身份、产品与当前定位
        blocks:
          - type: paragraph
            body: >-
              Aviatrix 仍将自己定位为云原生多云网络与安全平台，而不是狭窄的单点产品。入选的官方材料始终把产品放在云 fabric 内运行、管理 CSP 原生构件，以及控制主要公有云之间的流量这一框架下；2026
              年材料进一步把叙事聚焦到 AI 工作负载、Kubernetes 和东西向流量的隔离。独立资料对公司身份的描述很直接：2014 年成立、总部位于 California 的 Santa Clara，外部仍归类为
              Series E 私营公司。这一身份足够稳定，可供后续章节复用，但大多数 规模说法仍来自公司叙事或第三方资料，而非申报文件。
