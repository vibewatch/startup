  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序
        blocks:
          - type: paragraph
            body: >-
              当前公开记录指向三个一阶风险。第一，Aviatrix 进入监管最严格的公共部门环境的 go-to-market 上行空间，仍受已披露的 FedRAMP 缺口限制，尽管公司和伙伴强调框架对齐及 FIPS
              进展。第二，核心产品承诺对执行极其敏感，因为 Aviatrix 称其价值 在于用一个策略平面，跨云、Kubernetes、无服务器和东西向流量进行内联策略执行；任何控制平面漂移、发布失败或集成延迟，
              都会打击核心差异化，而非边缘功能。第三，当前投资判断仍依赖过时的 2021 年融资数据、下降中的公开员工序列和二手估算， 而不是公司报告的收入、消耗或留存。
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR011
              - CR012
              - CR013
              - CR016
