      - number: '5.3'
        title: 文案中的差异化清晰，但独立验证仍很薄
        blocks:
          - type: paragraph
            body: >-
              Aviatrix 的材料给出了一套连贯的差异化论证：原生云构件和瓶颈式安全架构在东西向流量、Kubernetes 及 AI 相关通信方面 存在缺口，而 Aviatrix 声称能够提供跨云一致的策略执行和更好的
              day-two 可视性。入选资料池的外部证据更薄。Tracxn 至少印证公司处在拥挤赛道，并将其描述为云网络安全和多云网络平台；但资料池没有独立正常运行时间数据、运营者基准或具名 实践者证据来验证当前 CNSF
              和 PaaS 版本。这使投资问题不再是 Aviatrix 有没有产品逻辑，而是买家能否快速部署、证明 运营节省，并在不主要依赖 Aviatrix 自写材料的情况下信任其合规与韧性主张。
            claimRefs:
