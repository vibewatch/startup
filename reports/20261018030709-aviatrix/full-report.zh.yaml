        - 如果客户预算转而不再投向多云安全控制，或原生云工具填补差距，这一判断会走弱。
      - - Aviatrix 在内联多云控制和 Zero Trust 执行方面仍显出技术差异化
        - 正方
        - 如果私人尽调显示生产使用有限，或口径背后的扩张乏力，这一判断会走弱。
      - - 独立报道显示已有可识别的企业采用
        - 正方
        - 如果有可供核验的续约、留存和部署深度信息，这一判断会增强。
      - - 最新公开估值证据已经陈旧，当前经营数据仍不透明
        - 反方
        - 如果披露经审计的 2025 年或 2026 年收入或 ARR、利润率、烧钱和留存，这一判断会改善。
      - - 赛道拥挤，可能压缩定价权和退出倍数假设
        - 反方
        - 如果有针对主要替代方案的赢单率、替代情况或品类份额证据，这一判断会改善。
      - - 公开融资记录在总额和条款上不完整或相互不一致
        - 反方
        - 如果有正式融资台账、优先股堆叠，以及 2021 年之后的一级或二级定价证据，这一判断会改善。
    notes: 该表将业务质量信号与价格支撑弱点分开，因此建议对价格保持敏感，而不是变成笼统的产品质量评分。
