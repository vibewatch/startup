        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              可投资的财务故事在产品变现方向上偏正面，但经济性尚不足以支撑投资判断。Aviatrix 似乎有真实企业需求、经常性软件
              核心，以及能够扩大钱包份额并减少客户运营摩擦的托管服务外壳。然而，公开证据仍未回答关键问题：按产品拆分的当前 ARR 和收入、实际定价、毛利率、服务组合、CAC
              与回收期、现金余额、跑道、客户集中度，以及任何债务或项目融资义务。在管理层提供当前收入桥和现金消耗材料前，审慎做法是：公开财务足以验证产品市场牵引力，但不足以判断下一融资触发点或有说服力的利润率路径。
            claimRefs:
