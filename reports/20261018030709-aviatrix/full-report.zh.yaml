        title: 收入模型与变现空间
        blocks:
          - type: paragraph
            body: >-
              公开材料指向以多云网络和安全控制为核心的软件平台收入模型，随后加入托管服务选项，而不是销售硬件设备。Aviatrix 文档将 CNSF 描述为带 Terraform
              和基础设施即代码集成的内联云安全控制层；Microsoft Marketplace 和 2024 年 PaaS 发布则展示了另一种打包方式：由 Aviatrix
              自己承担更多管理工作。这一组合支持两种部署形式的经常性企业合同模型： 核心平台销售和托管服务增购。对投资判断最关键的商业分母仍缺失：公司没有公开合同计量口径、ACV、实际折扣，或 已有多少业务迁移到托管服务套餐。
