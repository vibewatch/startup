      - number: '7.2'
        title: 监管与合规门槛
        blocks:
          - type: paragraph
            body: >-
              公开证据呈现的是混合监管状态，而非明确通过或不通过。Carahsoft 2026 年公共部门文章明确称，截至发表时 Aviatrix 没有 FedRAMP 授权，因此联邦民用和国防部署仍受限制；同一文章又称
              Aviatrix 数据平面已完成 FIPS 140-3 验证，并预计 2026 年 8 月完成全面验证。Aviatrix 自己的材料更擅长框架映射，而非正式授权证明：公司提到持续审计证据，以及与 CISA
              Zero Trust Maturity Model、NIST CSF、HIPAA、DORA、GDPR 和 NIS2 的映射；但审阅的来源集仍未独立验证模块范围、继承
              控制或准确的客户责任边界。因此，受监管买家的采用仍是尽调事项，而非已关闭的风险。
            claimRefs:
              - CR002
              - CR006
              - CR007
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR006
