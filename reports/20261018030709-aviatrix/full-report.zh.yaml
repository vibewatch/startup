  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台范围已覆盖核心多云 transit、可观测性与较新的 CNSF 安全层
        blocks:
          - type: paragraph
            body: >-
              Aviatrix 的产品仍锚定在核心多云网络平台：较早的解决方案简介描述了一套结合高级网络、安全和运营可视性的统一架构， 包括安全 transit、加密、拓扑映射和 day-two
              运维工具。当前页面在此基础上叠加更广的 Cloud Native Security Fabric （CNSF）叙事，使公司不再像单点网络工具，而更像内联的工作负载通信控制层。范围扩张意味着公开产品已不只是
              transit 加可视性，还包括运行时分段、AI 相关治理语言和托管服务消费选项。若能在生产环境跑通，这种广度是产品优势；但也引出尽调 问题：平台中有多少是成熟核心功能，又有多少只是较新的定位和打包。
            claimRefs:
