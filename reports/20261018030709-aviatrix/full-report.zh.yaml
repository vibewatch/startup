  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资判断
        blocks:
          - type: paragraph
            body: >-
              这里的估值决策更关乎价格支撑，而非产品是否存在。Aviatrix 仍展示出可信的多云安全平台，保留证据也显示明确的买家痛点 和一定的企业 logo
              采用。缺失的是从产品证明连接到当前可辩护估值的新公开桥接。保留来源中最新的融资标记仍是 2021 年 9 月 Series E、$2B；公开来源仍未披露经审计收入、盈利能力或股权结构表
              细节。这足以支持持续跟踪和认真重做投资判断，却不足以 支持按最后披露价格给出买入建议。
