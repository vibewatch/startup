      - number: '2.3'
        title: 买家地图、采用路径与未解市场缺口
        blocks:
          - type: paragraph
            body: >-
              保留证据指向云平台或网络架构团队以及安全领导层作为经济买家；DevOps 和平台工程则是关键用户及实施伙伴，而非 唯一付费方。Microsoft Marketplace listing
              面向企业云管理员和架构师；Aviatrix 的文档与简介持续强调策略一致性、 IaC 集成、Kubernetes 流量、东西向可视性，以及 AI 工作负载或出站控制。这一组合意味着其大企业采用路径与现代化、
              安全和运营项目绑定，而不是轻量开发者工具采购。同一证据也指出本章的硬约束：当前大多数信号由供应商撰写，公开的 买家分部预算缺失，且没有保留的独立来源能划出足够精确的支出边界，在不凭空设定假设的情况下计算 SAM
              或 SOM。
