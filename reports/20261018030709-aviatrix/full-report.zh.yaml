      - number: '8.2'
        title: 价格支撑与融资背景
        blocks:
          - type: paragraph
            body: >-
              融资背景同时显得强劲又过时。独立数据库仍指向 2021 年 $2B 估值和 $200M Series E，证明 Aviatrix 曾达到高增长软件的
              大额估值门槛。但保留的公开证据没有显示更新的一手融资、最新二级标记或当前经审计运营概况，投资人无法在不对不确定性打折的 情况下复用这个数字。累计融资数据也并不完全一致，一份来源为 $341M，另一份为
              $346M。这本身不致推翻逻辑，却强化了 更大的结论：公开证据足以做方向性尽调，不足以精确定价。
