  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 企业采用扩大，当前私人指标明显超过保留的公开代理指标
        - 只有在私人尽调显示当前收入质量强、留存良好且条款干净时，>= $2.0B 才有说服力；仅凭保留的公开证据达不到这一标准。
        - 竞争者拥挤且条款可见性不足
        - 需要经审计的当前指标，以及能验证上行轮融资的条款清单或二级市场证据。
      - - 基准
        - Aviatrix 具备真实的平台价值，但公开定价证据仍然陈旧
        - 如果保留的 2024 年 ARR 估算方向正确，且投资者不愿在没有新证据时支付完整的 2021 年溢价，那么 $1.1B-$2.0B 是大致的公开敏感区间。
        - ARR 不是经审计收入，IPO 标尺也不是完美的交易可比对象
        - 这是最站得住脚的公开立场，因为它同时承认产品有证明、估值仍存在不确定性。
      - - 悲观
        - 增长或利润率质量落后于隐含溢价，且条款结构对投资者不友好
        - 如果当前经营数据令人失望、员工收缩信号进一步加深，或优先权对普通股形成重大压制，<$1.1B 或惩罚性结构就可能出现。
        - 下行轮融资观感不佳，退出灵活性有限
        - 如果管理层无法在尽调中对当前规模、客户健康度和资本结构条款作出一致解释，就会触发。
    notes: 情景区间是粗略敏感性带，不是交易估值。它们锚定于保留的公开证据，其中混合了第三方 ARR 估算和公开市场 IPO 市销率标尺，因此适合划定边界，不适合精确定价。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV011
      - CV015
      - CV016
