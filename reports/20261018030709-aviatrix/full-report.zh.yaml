        title: 架构强调内联执行、多云一致性与多种部署路径
        blocks:
          - type: paragraph
            body: >-
              最清晰的技术主线是：Aviatrix 希望策略在云数据路径中执行，而不只在集中式瓶颈处执行。文档称 CNSF 管理跨区域、账户和云 的工作负载到工作负载及工作负载到互联网流量；Microsoft
              Marketplace listing 则给出 Terraform 集成、嵌入 CI/CD 和 面向 Kubernetes 的可视性等具体部署信号。较早的平台简介也表明，公司仍依赖控制器驱动的运营模式、安全
              transit 网关和 遥测采集，因此架构像是控制平面、内联执行和运营可视性的分层组合。2024 年 PaaS 发布通过把维护和升级转给 Aviatrix
              增加了另一种消费模式，但没有消除对客户云环境、既有安全工具和策略设计选择的集成依赖。
