            body: >-
              入选资料池没有提供独立 TAM、SAM 或 SOM，因此这里唯一可支持的规模判断是需求和采用代理指标，而不是可用于估值的 支出拆解。Aviatrix 的 2025 年调查页面称样本覆盖 400 多名美国企业 IT
              领导者；同一来源称 81% 的人预计 MCN 能简化或加快混合云或多云采用，63% 认为云成本管理紧迫。2025 年 7 月的一份公司新闻稿提供的是摩擦证据而非 支出：67% 难以整合云防火墙，仅 8%
              对云间流量实施零信任，85% 报告 DevOps 流水线安全挑战。Devoteam 保留的 文章只通过 Gartner 更早预期的多云网络供应商收入增长 30% 提供历史方向性背景；这可用于判断品类动能，但仍不是
