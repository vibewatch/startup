            body: >-
              公开领导层叙事仍集中在少数几位具名人士身上。Aviatrix 的周年材料突出创始人 Sherry Wei 的网络背景和创办愿景； 当前公开资料则把 Doug Merritt
              放在公司对外叙事的最前端，担任董事长，并只列出少数公开高管。Tracxn 还列出 5 名活跃董事，这足以说明存在正式治理结构，却不足以推断控制动态、投票权或继任梯队。就尽调而言，Wei 的
              技术创始人角色、Merritt 的 CEO/董事长角色，以及 2021 年融资周期的领投方，仍是需要继续核验的关键人权节点。
