        title: 资本充足性与成本结构可见度
        blocks:
          - type: paragraph
            body: >-
              融资历史显示公司获得了大量外部资本，但从历史轮次到当前充足性的公开桥接并不完整。Aviatrix 称 2019 年 Series C 使累计披露融资超过 $76 million，2021 年 Series E
              又以 $2 billion 估值增加 $200 million；但后来的独立资料对累计总额有分歧：一份称六轮共 $346 million，另一份称三轮公开记录加起来为 $275
              million-plus。这一矛盾很重要，因为消耗速度、现金余额、债务工具、契约约束和营运资金需求都未公开。官方材料还把产品定位为软件加托管服务，资本开支应低于硬件；但仍没有公开毛利率桥或服务组合披露，无法判断
              PaaS 是提升还是稀释单位经济。
