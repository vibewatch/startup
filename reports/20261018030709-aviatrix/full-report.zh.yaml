  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Aviatrix 卖的不是通用终端安全或宽泛的 CNAPP 套件。综合保留的独立资料、官方平台页面、产品文档和解决方案
              简介，公司处在多云网络控制、运行时分段和云安全治理的交汇处。纳入的支出是企业在原生云构件、边界防火墙和 碎片化可视性无法跨 AWS、Azure、GCP、OCI、Kubernetes 及 AI
              关联工作负载提供一致策略时，额外采购的控制平面 和执行层。排除的支出包括终端/XDR、仅做安全态势的工具，以及单云原生网络功能，除非买家把它们当作替代品。 现状替代方案仍是原生云网络加边缘或 transit
              防火墙及手工策略编排；Aviatrix 自己的资料称，这套组合无法完整覆盖 东西向路径、工作负载出站流量和短生命周期运行时流量。
            claimRefs:
              - CM001
