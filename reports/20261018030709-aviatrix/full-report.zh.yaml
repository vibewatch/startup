  - id: FV001
    title: 建议逻辑
    type: flow
    summary: “继续跟踪”来自产品证据、过时的价格支撑和薄弱披露。
    data:
      nodes:
        - label: 市场痛点真实存在
          note: 工具碎片化、可视性缺口和云防火墙成本冲击仍是买方正在面对的问题。
        - label: Aviatrix 解决这一痛点
          note: 官方材料始终将平台定位在多云控制、零信任和可审计性上。
        - label: 存在企业客户证据
          note: 独立报道提到了一些知名企业客户。
        - label: 赛道拥挤
          note: Tracxn 列出 56 家活跃竞争对手，因此估值上行不能忽视竞争压力。
        - label: 价格支撑过时
          note: 最近一次披露的 $2B 估值仍是 2021 年 9 月的 E 轮。
        - label: 建议 = 继续跟踪
          note: 继续关注并等待重新评估，不应以最近披露的估值直接给出买入判断。
