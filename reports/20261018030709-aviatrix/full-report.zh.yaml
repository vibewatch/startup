      - number: '7.3'
        title: 运营模式与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Aviatrix 的架构看起来有差异化，但同一设计也带来很高的执行负担。公司称其平台管理集中式防火墙漏掉的流量，包括 Kubernetes pod 出站、无服务器函数调用和东西向 VPC
              流量，并称策略应在数秒内跨云传播。正因如此，平台可靠性和集成 质量极其重要：如果执行层或 AWS、Azure、Google Cloud、OCI 之上的抽象出现偏差，客户看到的就是产品最重要承诺失效。
              go-to-market 同样受伙伴塑造。Orange Business 把 Aviatrix 打包进托管骨干网，并称组合方案可以降低运营工作；Carahsoft 则把 Aviatrix
              定位为政府和高等教育的采购路径。这些渠道有助于分销，却也让公司依赖伙伴执行、合同工具和超大规模云兼容性。
            claimRefs:
