company:
  name: Aviatrix
chapter:
  number: 1
  title: Company Overview
  summary: 'Aviatrix remains a private Series E multicloud networking and security vendor headquartered in Santa Clara, with official materials claiming more than 500 enterprise customers and a 2026 push toward Cloud Native Security Fabric for AI and east-west traffic. The main uncertainty is disclosure quality rather than identity: public datasets disagree on lifetime capital raised, and revenue or ARR still appear only as third-party estimates rather than company-reported metrics.'
sections:
- id: identity-platform
  title: Identity, product, and current positioning
  body: 'Aviatrix still presents itself as a cloud-native multicloud networking and security platform rather than a narrow point product. The assigned official materials consistently frame the product around operating inside the cloud fabric, managing CSP-native constructs, and controlling traffic across major public clouds, while 2026 material sharpens that story toward containment for AI workloads, Kubernetes, and east-west traffic. Independent profiles keep the corporate identity straightforward: a 2014-founded private company headquartered in Santa Clara, California, still externally categorized as Series E. That identity is stable enough for later chapters to reuse, but most scale claims still come from company narrative or third-party profiles rather than filings.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO014
  - CO015
  tableRefs:
  - TO001
- id: leadership-governance
  title: Leadership, governance, and stakeholder concentration
  body: The public leadership story still concentrates on a small set of named individuals. Aviatrix's anniversary material centers founder Sherry Wei's networking background and founding vision, while current public profiles place Doug Merritt at the front of the company's external narrative as chairman and list only a thin set of public executive names underneath him. Tracxn also surfaces five active board members, which is enough to show a formal governance structure but not enough to infer control dynamics, voting rights, or succession depth. For diligence purposes, Wei's technical founder role, Merritt's CEO/chair role, and the lead investors from the 2021 financing cycle remain the obvious people-and-power nodes to test further.
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO009
  tableRefs:
  - TO002
  - TO003
- id: funding-scale-milestones
  title: Funding history, scale proxies, and milestone record
  body: 'The strongest public financing marker remains the 2021 Series E: Tracxn records a $200 million round led by TCV at a $2 billion post-money valuation, after a February 2021 Series D. What has not converged is cumulative capital raised, because another August 2026 profile summarizes Aviatrix at $275 million-plus over three rounds while Tracxn says $346 million over six rounds. Scale proxies are similarly imperfect: official materials claim more than 500 enterprise customers, and a compiled public profile lists 426 employees as of March 2026 after a 2024 peak, but revenue and ARR still appear only as third-party estimates rather than company disclosure. The milestone trail is otherwise clear enough to show product evolution from CoPilot to Distributed Cloud Firewall to Network Insights API, alongside a 2025 public security-incident allegation that later risk work should verify against primary reporting.'
  claimRefs:
  - CO008
  - CO009
  - CO010
  - CO011
  - CO012
  - CO013
  - CO016
  figureRefs:
  - FO001
