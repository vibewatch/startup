      - number: '6.3'
        title: Durability and concentration are still largely opaque
        blocks:
          - type: paragraph
            body: >-
              Expansion surfaces are visible: current marketplace and press materials extend Aviatrix from multicloud
              connectivity into Kubernetes, AI, and managed PaaS deployment options, while the channel program rewards
              partners for net-new logos and revenue milestones. Those signals support a plausible land-and-expand
              story, but they do not substitute for hard retention proof. None of the assigned sources disclose gross
              retention, net retention, logo churn, contract length, or top-customer concentration. Public evidence is
              also weighted toward company-controlled and partner-controlled surfaces, so customer durability cannot be
              inferred from logos alone. The channel interview records a shift away from selling the comprehensive
              platform toward narrower insertion points, indicating adoption friction even though the article presents
              the pivot positively. The right underwriting posture is that adoption appears genuine, expansion vectors
              exist, but renewal quality and concentration risk remain open diligence items rather than verified
              strengths.
