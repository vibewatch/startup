  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Aviatrix is not selling generic endpoint security or a broad CNAPP bundle. Across the retained independent
              profile, official platform page, product documentation, and solution brief, the company sits where
              multicloud networking control, runtime segmentation, and cloud-security governance meet. The included
              spend is the control plane and enforcement layer enterprises add when native cloud constructs, perimeter
              firewalls, and fragmented visibility no longer provide consistent policy across AWS, Azure, GCP, OCI,
              Kubernetes, and AI-linked workloads. The excluded spend is endpoint/XDR, posture-only tooling, and
              single-cloud-native networking features unless buyers use them as substitutes. The status quo substitute
              is still native-cloud networking plus edge or transit firewalls and manual policy orchestration, which
              Aviatrix's own sources describe as incomplete for east-west paths, workload egress, and ephemeral runtime
              traffic.
            claimRefs:
