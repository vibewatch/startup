  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape coverage and solution set
        blocks:
          - type: paragraph
            body: >-
              The competitive set is broader than named startup peers. Aviatrix still sits in the direct multi-cloud
              networking and security cohort with Alkira and Prosimo, but it also competes against hyperscaler-native
              controls, perimeter-firewall-centric security stacks, and internal-build approaches that assemble AWS,
              Azure, GCP, and Kubernetes primitives in-house. The retained evidence consistently frames Aviatrix as a
              cloud-embedded control plane and data-plane architecture rather than a simple monitoring tool. That
              matters because buyer substitution happens at the architecture level: teams can buy a managed backbone,
              keep extending incumbent firewalls, rely on native cloud constructs, or operate their own overlay fabric.
            claimRefs:
