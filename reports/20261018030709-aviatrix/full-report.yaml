      - number: '3.4'
        title: Moat durability and competitive risks
        blocks:
          - type: paragraph
            body: >-
              Aviatrix's moat looks architectural rather than distribution-led. The company has credible enterprise
              proof points and a differentiated runtime-control narrative, but the retained independent evidence also
              highlights two pressure points. First, managed SaaS peers can appeal to teams that want the outcome
              without operating customer-side gateways or tuning cloud networking constructs. Second, hyperscaler
              secure-by-default moves can make native controls more acceptable, especially for buyers that are mostly
              single-cloud or can tolerate less cross-cloud consistency. That means Aviatrix's advantage is strongest in
              complex multicloud estates and least durable where simplicity or native bundling dominates the buying
              decision.
