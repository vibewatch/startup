        title: Architecture emphasizes inline enforcement, multicloud consistency, and multiple deployment paths
        blocks:
          - type: paragraph
            body: >-
              The strongest technical through-line is that Aviatrix wants policy enforcement in the cloud data path
              rather than only at centralized chokepoints. Its docs describe CNSF as governing workload-to-workload and
              workload-to-internet traffic across regions, accounts, and clouds, while the Microsoft marketplace listing
              adds concrete deployment signals such as Terraform integration, CI/CD embedding, and Kubernetes-oriented
              visibility. The older platform briefs reinforce that the company still depends on a controller-driven
              operating model plus secure transit gateways and telemetry collection, so the architecture appears to be a
              layered mix of control plane, inline enforcement, and operational visibility. The 2024 PaaS launch adds
              another consumption model by moving maintenance and upgrades onto Aviatrix, but it does not remove
              integration dependence on customer cloud estates, existing security tooling, and policy design choices.
