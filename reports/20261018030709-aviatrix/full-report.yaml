      - number: '3.2'
        title: Differentiation, capability emphasis, and packaging
        blocks:
          - type: paragraph
            body: >-
              Aviatrix's differentiation is strongest when a buyer values multicloud policy consistency, inline
              enforcement, and network-centric visibility more than operational simplicity. Current product messaging
              heavily emphasizes runtime Zero Trust, Kubernetes traffic, AI-agent governance, and integration with
              existing firewalls rather than a rip-and-replace posture. That broadens the addressable budget from
              networking into security controls, but it does not erase the competitor tradeoff: Alkira and Prosimo
              package more vendor-managed operating models, while Aviatrix only partially closes that gap through its
              newer PaaS deployment option.
