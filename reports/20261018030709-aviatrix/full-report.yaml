  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a software platform sold in self-managed and managed-service forms, but not a disclosed
      pricing or margin bridge.
    data:
      nodes:
        - label: Enterprise multicloud and AI workloads
          detail: Kubernetes, GenAI, and multicloud complexity create the demand pool Aviatrix targets.
        - label: CNSF core platform
          detail: Inline cloud-network security control layer with Terraform and IaC integration.
        - label: Self-managed software deployment
          detail: Core platform sale where the customer still operates more of the environment.
        - label: Aviatrix PaaS managed service
          detail: Managed deployment option with AI-enhanced operations and a public 30-day trial.
        - label: Customer value and billing logic
          detail: Security, visibility, automation, cost optimization, and predictable billing are the public economic hooks.
        - label: Public traction and disclosure ceiling
          detail: 500-plus enterprise adoption is visible, but realized pricing, gross margin, burn, and runway are not.
      edges:
