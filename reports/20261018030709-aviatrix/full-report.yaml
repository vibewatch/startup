      - number: '5.3'
        title: Differentiation is clear in the copy, but independent validation is still thin
        blocks:
          - type: paragraph
            body: >-
              Aviatrix's materials make a coherent differentiation case: they argue native cloud constructs and
              chokepoint-security architectures leave gaps around east-west traffic, Kubernetes, and AI-related
              communications, while Aviatrix claims cloud-consistent policy enforcement and better day-two visibility.
              External evidence in the assigned pool is thinner. Tracxn at least corroborates that the company is
              competing in a crowded field and describes the business as a cloud network security and multicloud
              networking platform, but the pool does not include independent uptime data, operator benchmarks, or named
              practitioner evidence validating the current CNSF and PaaS generation. That leaves the investment question
              less about whether Aviatrix has a product thesis and more about whether buyers can deploy it quickly,
              prove the operational savings, and trust the compliance and resilience claims without relying mainly on
