  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Target segments and initial buying motion
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence consistently frames Aviatrix around large enterprises operating across multiple
              clouds rather than SMB or single-cloud buyers. Oracle's cloud-infrastructure post says more than 300
              enterprises had already chosen Aviatrix in 2019, while current official and marketplace materials position
              the platform for enterprise cloud administrators, architects, security teams, network teams, and DevOps or
              platform operators managing multicloud, Kubernetes, and AI workloads. AWS- and Oracle-published deployment
              narratives also show the typical entry point: customers launch Controller and CoPilot in their own cloud
              account, then extend that control plane across other clouds and environments. That pattern suggests
              Aviatrix sells first into a painful infrastructure control problem, then expands into broader security and
              operations workflows.
