      - number: '4.3'
        title: Capital adequacy and cost-structure visibility
        blocks:
          - type: paragraph
            body: >-
              The funding history shows material outside capital but an incomplete public bridge from historical rounds
              to current adequacy. Aviatrix said its 2019 Series C took total disclosed funding above $76 million and
              its 2021 Series E added $200 million at a $2 billion valuation, yet later independent profiles disagree on
              the cumulative total: one reports $346 million across six rounds and another reports $275 million plus
              three publicly documented rounds. That inconsistency matters because burn, cash on hand, debt facilities,
              covenant constraints, and working-capital needs are not publicly disclosed. Official materials also frame
              the product as software plus managed service, which should be less capex-intensive than hardware, but
              there is still no public gross margin bridge or services-mix disclosure to show whether the PaaS offer
              lifts or dilutes unit economics.
