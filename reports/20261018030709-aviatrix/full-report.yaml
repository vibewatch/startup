    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and current positioning
        blocks:
          - type: paragraph
            body: >-
              Aviatrix still presents itself as a cloud-native multicloud networking and security platform rather than a
              narrow point product. The assigned official materials consistently frame the product around operating
              inside the cloud fabric, managing CSP-native constructs, and controlling traffic across major public
              clouds, while 2026 material sharpens that story toward containment for AI workloads, Kubernetes, and
              east-west traffic. Independent profiles keep the corporate identity straightforward: a 2014-founded
              private company headquartered in Santa Clara, California, still externally categorized as Series E. That
              identity is stable enough for later chapters to reuse, but most scale claims still come from company
              narrative or third-party profiles rather than filings.
