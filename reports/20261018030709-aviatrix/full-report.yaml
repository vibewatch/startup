  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Aviatrix presents the product as a layered stack spanning workload communications, inline controls, centralized
      policy, managed delivery, and operator enablement.
    data:
      layers:
        - label: Cloud and workload surfaces
          detail: >-
            Protected environments span workloads and traffic paths across AWS, Azure, GCP, OCI, Kubernetes, and
            AI-adjacent services.
          modules:
            - Cloud workloads
            - Kubernetes pods and clusters
            - AI / agentic traffic paths
          outputs:
            - Broad enforcement scope
        - label: Inline enforcement fabric
          detail: >-
            Security is meant to sit in the data path so segmentation, encryption, and policy apply while traffic is
            moving.
          modules:
            - Secure transit
            - Inline Zero Trust enforcement
            - Microsegmentation / policy enforcement
          outputs:
            - Workload-to-workload and workload-to-internet control
        - label: Observability and telemetry
          detail: The platform couples enforcement with day-two visibility, anomaly detection, and topology context.
          modules:
            - Operational telemetry
            - Topology / resource maps
            - Network-health visibility
          outputs:
            - Shared operations context
        - label: Policy and automation plane
          detail: A central control layer declares intent once, pushes policy consistently, and plugs into IaC workflows.
          modules:
            - CNSF policy plane
            - Controller automation
            - Terraform / CI-CD integration
          outputs:
            - Consistent multicloud policy
        - label: Security-stack interop
          detail: >-
            The architecture is positioned as connective tissue that extends, rather than fully replaces, incumbent
            firewalls and adjacent tools.
          modules:
            - Existing firewalls
            - APIs and systems
            - Marketplace onboarding
          outputs:
            - Lower rip-and-replace burden
        - label: Consumption and enablement
          detail: >-
            Customers can consume the stack through self-managed software, Aviatrix PaaS, and training/certification
            support.
          modules:
            - Aviatrix PaaS
            - Existing-tool integrations
            - ACE training / certification
          outputs:
            - Faster onboarding and operating model choices
    approximationNotes: This is a conceptual synthesis of the retained sources, not a vendor-published diagram or packet-flow schematic.
    claimRefs:
      - CE002
      - CE003
      - CE005
      - CE006
      - CE008
      - CE010
