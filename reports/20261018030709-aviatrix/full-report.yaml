      - number: '2.3'
        title: Buyer map, adoption path, and unresolved market gaps
        blocks:
          - type: paragraph
            body: >-
              The retained evidence points to cloud-platform or network-architecture teams and security leadership as
              the economic buyers, with DevOps and platform engineering acting as critical users and implementation
              partners rather than the sole payer. The Microsoft marketplace listing is aimed at enterprise cloud
              administrators and architects, while Aviatrix's documentation and briefs keep emphasizing policy
              consistency, IaC integration, Kubernetes traffic, east-west visibility, and AI workload or egress control.
              That combination implies a large-enterprise adoption path tied to modernization, security, and operations
              programs rather than a lightweight developer tool purchase. The same evidence also highlights the
              chapter's hard limit: most current signals are vendor-authored, public buyer-segment budgets are missing,
              and no retained independent source isolates a spend boundary precise enough to calculate SAM or SOM
              without inventing assumptions.
            claimRefs:
