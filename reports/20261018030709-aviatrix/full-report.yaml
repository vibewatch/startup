  - id: FU001
    title: Customer journey from multicloud entry point to expansion proof gap
    type: journey-map
    summary: >-
      Public evidence shows a repeatable enterprise entry motion and plausible expansion loops, but the final renewal
      and concentration layer is not publicly evidenced.
    data:
      items:
        - label: Multicloud enterprise target
          tone: neutral
          actor: Security, network, and cloud-architecture leaders
          touchpoints:
            - Multicloud and hybrid complexity create the opening problem
            - Target accounts skew toward large enterprises operating across multiple clouds
        - label: Partner-assisted evaluation
          tone: positive
          actor: AWS, Oracle, channel partners, and ACE-certified ecosystem
          touchpoints:
            - AWS and Oracle partner surfaces explain deployment patterns
            - Channel program rewards net-new logos and revenue milestones
        - label: Launch in customer cloud account
          tone: positive
          actor: Cloud administrators and platform operators
          touchpoints:
            - Controller and CoPilot are launched inside the customer's account
            - Initial value centers on visibility, connectivity, and policy control
        - label: Cross-cloud operations
          tone: positive
          actor: Network and security operations teams
          touchpoints:
            - Expansion extends to other clouds, regions, and data centers
            - Named proof emphasizes troubleshooting, segmentation, and control
        - label: Kubernetes and AI security upsell
          tone: positive
          actor: Platform engineering and security teams
          touchpoints:
            - Current materials reposition Aviatrix toward Kubernetes and AI workloads
            - Managed PaaS and marketplace delivery lower incremental adoption friction
        - label: Renewal and concentration proof gap
          tone: risk
          actor: Investors and diligence team
          touchpoints:
            - No public NRR, GRR, churn, contract-length, or top-customer concentration data
            - Logo breadth does not prove durable production standardization
    claimRefs:
      - CU001
      - CU003
      - CU006
      - CU007
      - CU013
      - CU014
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Residual risk is highest where compliance gating, multi-cloud execution complexity, and financial opacity
      intersect with only partial public proof.
    data:
      columns:
        - Likelihood
        - Residual severity
        - Mitigation maturity
      rows:
        - label: FedRAMP / regulated-public-sector access
          note: Carahsoft says federal authorization is still absent.
          values:
            - label: High
              tone: high
              note: Federal procurement gate is open in the public record.
            - label: High
              tone: adverse
              note: The gap directly limits segment access until authorization proof changes.
            - label: Medium
              tone: warning
              note: FIPS and framework mapping help, but do not replace FedRAMP.
        - label: Cross-cloud policy propagation
          note: The core product promise depends on universal enforcement across clouds.
          values:
            - label: High
              tone: high
              note: Product claims explicitly span AWS, Azure, GCP, OCI, Kubernetes, and serverless.
            - label: High
              tone: adverse
              note: A propagation or parity failure would hit Aviatrix's main differentiation.
            - label: Medium
              tone: warning
              note: Single-policy-plane messaging is strong, but public reliability proof is thin.
        - label: Managed-service operator dependence
          note: PaaS and partner channels reduce toil while increasing execution concentration.
          values:
            - label: Medium
              tone: medium
              note: Aviatrix and partners own more of the operational surface in packaged offers.
            - label: Medium
              tone: risk
              note: Service or partner underperformance can slow expansion even without a product defect.
            - label: Medium
              tone: warning
              note: Channel breadth helps, but SLA and incident evidence is not public here.
        - label: Financial visibility and price discovery
          note: Public metrics remain secondary-source and partly conflicting.
          values:
            - label: High
              tone: high
              note: The public record still leans on stale 2021 financing data and estimated ARR.
            - label: High
              tone: adverse
              note: Underwriting is fragile when capital raised, burn, and retention are not cleanly disclosed.
            - label: Low
              tone: neutral
              note: Current mitigation maturity is low because the missing proof must come from company disclosure.
        - label: Customer integration and DevOps adoption
          note: Aviatrix's company-issued survey reports material integration and pipeline-security friction.
          values:
            - label: High
              tone: high
              note: >-
                Aviatrix reports that 67 percent struggle with firewall integration and 85 percent with DevOps pipeline
                security.
            - label: Medium
              tone: risk
              note: Adoption friction can lengthen deployment and delay realized security value.
            - label: Medium
              tone: warning
              note: >-
                IaC integration and managed packaging mitigate complexity, but independent deployment evidence is
                absent.
        - label: Partner-channel execution
          note: Orange Business and Carahsoft provide packaged delivery and procurement routes.
          values:
            - label: Medium
              tone: medium
              note: Partner execution matters most in managed multicloud and public-sector deployments.
            - label: Medium
              tone: risk
              note: Weak delivery or contract access would narrow go-to-market reach.
            - label: Medium
              tone: warning
              note: Multiple delivery modes reduce, but do not remove, channel dependence.
    approximationNotes: >-
      Ordinal ratings synthesize only the assigned source pool; they are not a statistical model and should be updated
      if Aviatrix publishes audited or regulator-backed evidence.
    claimRefs:
      - CR005
      - CR006
      - CR008
      - CR009
      - CR010
      - CR013
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Track follows from product proof plus stale price support and thin disclosure.
    data:
      nodes:
        - label: Market pain is real
          note: Fragmented tooling, visibility gaps, and cloud firewall cost shocks remain active buyer problems.
        - label: Aviatrix addresses the pain
          note: >-
            Official materials consistently position the platform around multicloud control, Zero Trust, and
            auditability.
        - label: Enterprise proof exists
          note: Independent coverage cites recognizable enterprise adopters.
        - label: Category is crowded
          note: Tracxn lists 56 active competitors, so valuation upside cannot ignore competitive pressure.
        - label: Price support is stale
          note: The latest disclosed $2B mark is still the September 2021 Series E.
        - label: Recommendation = Track
          note: Stay engaged for re-underwrite work, not a buy call at the last disclosed valuation.
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV014
      - CV016
