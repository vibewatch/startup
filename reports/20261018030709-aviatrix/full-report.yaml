            title: Enterprise traction looks real, not hypothetical
            body: >-
              The customer story is backed by multiple source classes: Oracle cites more than 300 enterprises in 2019,
              Aviatrix claims more than 500 leading enterprises in late 2024, and third-party or partner sources add
              named references plus a large ACE-certified delivery ecosystem.
            calloutType: strength
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU008
              - CU009
              - CU010
          - type: callout
            title: Durability is the main missing layer
            body: >-
              Public materials support who Aviatrix sells to and how accounts can expand, but they do not disclose
              renewal metrics, contract duration, or customer concentration, so underwriting retention still depends on
              private cohort and account-level diligence.
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              The current public record points to three first-order risks. First, Aviatrix's go-to-market upside into
              the most tightly regulated public-sector environments is still constrained by a disclosed FedRAMP gap even
              while the company and partners emphasize framework alignment and FIPS progress. Second, the core product
              promise is unusually execution-sensitive because Aviatrix says its value comes from enforcing policy
              inline across clouds, Kubernetes, serverless, and east-west traffic with one policy plane; any
              control-plane drift, rollout failure, or integration lag would hit the product's central differentiation
              rather than an adjacent feature. Third, current underwriting still depends on stale 2021 financing data, a
              declining public headcount series, and secondary estimates rather than company-reported revenue, burn, or
              retention.
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR011
              - CR012
              - CR013
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR009
              - CR010
              - CR013
              - CR016
      - number: '7.2'
        title: Regulatory and compliance gating
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a mixed regulatory posture rather than a clean pass or fail. Carahsoft's 2026
              public-sector write-up explicitly says Aviatrix does not hold FedRAMP authorization at the time of
              publication, which keeps federal civilian and defense deployment gated even though the same post says the
              Aviatrix data plane achieved FIPS 140-3 validation and expected full validation in August 2026. Aviatrix's
              own collateral is directionally stronger on framework mapping than on formal authorization proof: the
              company cites continuous audit evidence and mappings to CISA Zero Trust Maturity Model, NIST CSF, HIPAA,
              DORA, GDPR, and NIS2, but the reviewed source set still does not independently verify module scope,
              inherited controls, or the exact customer-responsibility boundary. That leaves regulated-buyer adoption as
              a diligence item, not a closed risk.
            claimRefs:
              - CR002
              - CR006
              - CR007
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR006
              - CR007
      - number: '7.3'
        title: Operating model and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Aviatrix's architecture appears differentiated, but the same design creates a demanding execution burden.
              The company says its platform governs traffic that centralized firewalls miss, including Kubernetes pod
              egress, serverless function calls, and east-west VPC traffic, and that policy should propagate across
              clouds in seconds. That is precisely why platform reliability and integration quality matter so much: if
              the enforcement layer or the abstraction over AWS, Azure, Google Cloud, and OCI slips, the customer sees
              failure in the product's most important promise. Go-to-market is similarly partner-shaped. Orange Business
              packages Aviatrix inside a managed backbone and says the combined approach can reduce operational effort,
              while Carahsoft positions Aviatrix as a procurement path for government and higher education. Those
              channels help distribution, but they also create dependency on partner execution, contract vehicles, and
              hyperscaler compatibility.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR010
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR004
              - CR008
              - CR009
              - CR010
      - number: '7.4'
        title: Financial opacity and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Financial risk is driven less by an identified insolvency signal than by how little current operating
              proof is public. Tracxn still anchors the last disclosed round to a $200 million Series E at a $2 billion
              post-money valuation in September 2021, while Silicon Valley Investclub says most public revenue and ARR
              figures are third-party estimates and shows workforce declining from 510 in 2024 to 426 in March 2026. The
              same two public aggregators disagree on total capital raised, which makes even the baseline
              capital-structure picture imprecise. For an investor, the most practical kill criteria are measurable: no
              verified federal-authorization progress for regulated segments, no current company-reported revenue or
              retention proof, and any continued contraction in workforce or partner-backed route-to-market breadth
              without offsetting customer evidence.
            claimRefs:
              - CR006
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment call
        blocks:
          - type: paragraph
            body: >-
              The valuation decision here is more about price support than product existence. Aviatrix still presents a
              credible multicloud security platform, and the retained evidence shows both clear buyer pain and some
              enterprise-logo adoption. What is missing is a fresh public bridge from that product proof to a defensible
              current valuation. The latest disclosed financing mark in retained sources is still the September 2021
              Series E at $2B, while public sources still do not disclose audited revenue, profitability, or cap-table
              detail. That combination is enough to justify continued tracking and a serious re-underwrite, but not
              enough to justify a buy recommendation at the last disclosed price.
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV009
              - CV014
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
              - CV016
      - number: '8.2'
        title: Price support and financing context
        blocks:
          - type: paragraph
            body: >-
              The financing context is simultaneously strong and stale. Independent databases still point to a $2B
              valuation and a $200M Series E in 2021, which proves Aviatrix once cleared a large-growth-software price
              bar. But the retained public evidence does not show a newer primary financing, updated secondary mark, or
              current audited operating profile that would let an investor reuse that number without a discount for
              uncertainty. Even total-funding figures are not perfectly aligned across retained sources, with one source
              at $341M and another at $346M. That is not thesis-breaking by itself, but it reinforces the broader point
              that public evidence is good enough for directional diligence and not good enough for precise pricing.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.3'
        title: Scenario boundaries and comparable discipline
        blocks:
          - type: paragraph
            body: >-
              The right way to use the retained public evidence is as a boundary-setting exercise, not a precise mark.
              Independent sources show enterprise adoption, a crowded competitive field, and persistent multicloud
              security pain that could support a durable category winner. At the same time, the strongest public
              valuation datapoint is still the 2021 $2B mark, and the best current scale datapoint in the retained set
              is a third-party 2024 ARR estimate rather than disclosed revenue. That means a scenario table can frame
              what would need to be true for upside or downside, but any hard valuation call still depends on management
              opening current ARR or revenue, growth, retention, burn, and round-term data.
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV011
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV011
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness and diligence gates
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not yet support an exit-readiness call. The retained set shows platform expansion,
              category messaging, and known enterprise customers, but it does not show the audited financial reporting,
              clean term visibility, or governance detail that would let an outside investor underwrite an IPO-style or
              premium secondary outcome from the public record alone. The most useful diligence path is therefore not
              another abstract market debate; it is a private re-underwrite with current revenue quality, margin and
              burn detail, customer concentration and retention, preference stack, and any post-2021 primary or
              secondary pricing evidence. If management cannot supply that package, the thesis should stay in track mode
              rather than move into buy mode.
            claimRefs:
              - CV003
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, do not buy
            body: >-
              Aviatrix stays investable as a diligence target, but the public record does not justify paying into the
              2021 mark without fresh private data on current scale, efficiency, and terms.
            calloutType: recommendation
            claimRefs:
              - CV014
              - CV015
              - CV016
          - type: callout
            title: The key underwriting risk is stale pricing evidence
            body: >-
              The hardest question is not whether Aviatrix built something useful; it is whether today's investor can
              defend today's entry price from a public record that still relies on a 2021 financing mark and incomplete
              economics.
            calloutType: risk
            claimRefs:
              - CV001
              - CV003
              - CV012
              - CV013
              - CV016
