  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization surface
        blocks:
          - type: paragraph
            body: >-
              Public materials point to a software-platform revenue model built around multicloud networking and
              security control, then expanded with a managed-service option rather than a hardware appliance sale.
              Aviatrix documentation describes CNSF as an inline cloud security control layer with Terraform and
              infrastructure-as-code integration, while Microsoft Marketplace and the 2024 PaaS launch show a second
              packaging mode where Aviatrix operates more of the management burden itself. That combination supports a
              recurring enterprise-contract model with two deployment forms: a core platform sale and a managed-service
              upsell. What is still missing is the commercial denominator that matters most for underwriting: the
              company does not publicly disclose contract metric, ACV, realized discounting, or how much of the business
              has migrated to the managed-service package.
