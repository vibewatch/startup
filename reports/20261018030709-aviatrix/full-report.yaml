      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The investable financial story is directionally positive on product monetization but not yet
              underwriteable on economics. Aviatrix appears to have real enterprise demand, a recurring software core,
              and a managed-service wrapper that could widen wallet share and reduce customer-operational friction.
              However, public evidence still leaves the decisive investor questions unanswered: current ARR and revenue
              by product, realized pricing, gross margin, services mix, CAC and payback, cash balance, runway, customer
              concentration, and any debt or project-finance obligations. Until management provides a current revenue
              bridge and cash-burn package, the prudent stance is to treat public financials as sufficient for
              product-market-traction validation but insufficient for underwriting the next financing trigger or a
              defensible margin path.
            claimRefs:
