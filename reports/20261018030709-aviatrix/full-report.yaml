  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform scope now spans core multicloud transit, observability, and a newer CNSF security layer
        blocks:
          - type: paragraph
            body: >-
              Aviatrix still anchors its product in a core multicloud network platform: its older solution briefs
              describe a single architecture that combines advanced networking, security, and operational visibility,
              including secure transit, encryption, topology mapping, and day-two operations tooling. Current surfaces
              layer a broader Cloud Native Security Fabric (CNSF) story on top of that base, framing the company less as
              a point networking tool and more as an inline workload-communication control layer. That scope expansion
              matters because the public package is no longer just transit plus visibility; it also includes runtime
              segmentation, AI-related governance language, and a managed-service consumption option. The breadth is a
              product strength if it works in production, but it also raises diligence questions about how much of the
              platform is mature core functionality versus newer positioning and packaging.
            claimRefs:
