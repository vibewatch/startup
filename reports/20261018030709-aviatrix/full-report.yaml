      - number: '2.2'
        title: Evidence-constrained sizing and adoption signals
        blocks:
          - type: paragraph
            body: >-
              The assigned pool does not provide an independent TAM, SAM, or SOM, so the only supportable sizing here is
              a set of demand and adoption proxies rather than a valuation-grade spend stack. Aviatrix's 2025 survey
              page says the sample covered more than 400 U.S. enterprise IT leaders, and the same source reports that
              81% expect MCN to help simplify or accelerate hybrid or multicloud adoption while 63% view cloud-cost
              management as urgent. A July 2025 company release adds friction evidence rather than spend: 67% struggle
              with cloud-firewall integration, only 8% implement zero trust for inter-cloud traffic, and 85% report
              DevOps pipeline security challenges. Devoteam's retained article adds only historical directional context
              through Gartner's earlier expectation of 30% vendor-revenue growth for multi-cloud networking, which is
              useful for category momentum but still not a current, buyer-scoped market-size estimate.
            claimRefs:
