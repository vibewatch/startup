          - type: paragraph
            body: >-
              The strongest public traction datapoints still come from a 2022 Forbes report and later company summaries
              rather than from current company financial statements. Forbes reported more than 500 customers, $62
              million of ARR at the end of Q2 2022, roughly doubling revenue, and 188% net dollar retention, while later
