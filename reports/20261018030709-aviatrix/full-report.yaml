      - number: '3.3'
        title: Switching costs, multi-homing, and buying motion
        blocks:
          - type: paragraph
            body: >-
              Aviatrix appears easier to land as an additive control layer than as a wholesale replacement. Its own
              materials repeatedly position the platform as something that extends firewalls and cloud-native controls
              instead of displacing them, which reduces political friction inside large enterprises but also preserves
              multi-homing. That coexistence logic helps in regulated or hybrid estates that already run multiple
              security tools, yet it also weakens lock-in because buyers can keep native controls, incumbent firewalls,
              or managed peers in the design. Operational burden is therefore central to competitive durability, not a
              side consideration.
