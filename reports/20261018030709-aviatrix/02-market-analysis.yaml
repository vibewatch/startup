  evidenceGaps:
    - type: missing-source
      severity: material
      topic: tam-sam-som
      missingEvidence: Independent market-sizing research that defines category boundaries and quantifies current TAM, SAM, or SOM for multicloud networking plus runtime-security control layers.
      whyItMatters: Without an independent spend model, valuation and market-share conclusions have to rely on demand proxies instead of buyer-scoped revenue pools.
      diligencePath: Obtain current analyst reports or public-company disclosures that break out multicloud networking, workload security, and adjacent control-plane spend with explicit methodology.
      relatedQuestionRefs: [QM002]
      relatedTableRefs: [TM002]
    - type: missing-source
      severity: material
      topic: budget-ownership
      missingEvidence: Public procurement, budget, or customer evidence showing whether security, cloud platform, network operations, or FinOps owns the purchase in each segment.
      whyItMatters: Buyer and payer ambiguity prevents precise SAM isolation, pricing-power assessment, and a clean adoption-path model by segment.
      diligencePath: Collect customer procurement documents, case studies with budget owners, or public RFPs that name the sponsoring team and budget line.
      relatedQuestionRefs: [QM007]
      relatedTableRefs: [TM003]
