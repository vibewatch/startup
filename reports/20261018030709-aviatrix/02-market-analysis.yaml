    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - ["Security architecture / cloud security", "CISO delegates and security architects", "Security engineering and SOC-adjacent cloud teams", "Security program budget", "Set zero-trust, segmentation, and egress policy", "Security leadership", "Need to govern east-west traffic and reduce lateral-movement exposure"]
      - ["Cloud platform / network operations", "Enterprise cloud administrators and architects", "Network operations and cloud-platform teams", "Shared cloud infrastructure budget", "Deploy and run multicloud control plane and telemetry", "Cloud platform or infrastructure VP", "Native constructs are too fragmented for consistent operations"]
      - ["Platform engineering / DevOps", "Platform engineering managers", "DevOps and IaC practitioners", "Usually shared with cloud platform, not standalone", "Embed Terraform-driven networking and guardrails into CI/CD", "Platform engineering with infrastructure approval", "Security must move at deployment speed without manual rework"]
      - ["FinOps / infrastructure leadership", "Cloud infrastructure leadership", "FinOps analysts and cloud operations", "Infrastructure optimization budget", "Evaluate cost transparency, egress, and managed-service tradeoffs", "Cloud infrastructure or finance partner", "Cloud-cost pressure becomes urgent enough to justify a control-layer purchase"]
    notes: >-
      Buyer and payer roles are inferred from stated personas and workflows because the retained pool does not include public procurement records or customer budget documents.
    claimRefs: [CM009, CM010, CM011, CM013, CM014]
