company:
  name: Aviatrix
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Aviatrix is chasing a credible multicloud-networking and cloud-runtime-security
    pain point, but the public evidence in this worker pool supports proxy demand
    signals more strongly than a clean spend boundary. Recent company-authored
    survey data, product documentation, and partner commentary all point to
    adoption drivers around multicloud complexity, firewall integration, east-west
    visibility, Kubernetes, AI-era workloads, and cost control, while leaving
    independent TAM/SAM/SOM and payer-segment budgets unresolved.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      Aviatrix is not selling generic endpoint security or a broad CNAPP bundle.
      Across the retained independent profile, official platform page, product
      documentation, and solution brief, the company sits where multicloud
      networking control, runtime segmentation, and cloud-security governance meet.
      The included spend is the control plane and enforcement layer enterprises add
      when native cloud constructs, perimeter firewalls, and fragmented visibility
      no longer provide consistent policy across AWS, Azure, GCP, OCI, Kubernetes,
      and AI-linked workloads. The excluded spend is endpoint/XDR, posture-only
      tooling, and single-cloud-native networking features unless buyers use them as
      substitutes. The status quo substitute is still native-cloud networking plus
      edge or transit firewalls and manual policy orchestration, which Aviatrix's
      own sources describe as incomplete for east-west paths, workload egress, and
      ephemeral runtime traffic.
    claimRefs: [CM001, CM002, CM013, CM015, CM016]
    tableRefs: [TM001, TM003]
  - id: sizing-lenses
    title: Evidence-constrained sizing and adoption signals
    body: >-
      The assigned pool does not provide an independent TAM, SAM, or SOM, so the
      only supportable sizing here is a set of demand and adoption proxies rather
      than a valuation-grade spend stack. Aviatrix's 2025 survey page says the
      sample covered more than 400 U.S. enterprise IT leaders, and the same source
      reports that 81% expect MCN to help simplify or accelerate hybrid or
      multicloud adoption while 63% view cloud-cost management as urgent. A July
      2025 company release adds friction evidence rather than spend: 67% struggle
      with cloud-firewall integration, only 8% implement zero trust for inter-cloud
      traffic, and 85% report DevOps pipeline security challenges. Devoteam's
      retained article adds only historical directional context through Gartner's
      earlier expectation of 30% vendor-revenue growth for multi-cloud networking,
      which is useful for category momentum but still not a current, buyer-scoped
      market-size estimate.
    claimRefs: [CM003, CM004, CM005, CM006, CM007, CM008, CM012, CM014]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-and-constraints
    title: Buyer map, adoption path, and unresolved market gaps
    body: >-
      The retained evidence points to cloud-platform or network-architecture teams
      and security leadership as the economic buyers, with DevOps and platform
      engineering acting as critical users and implementation partners rather than
      the sole payer. The Microsoft marketplace listing is aimed at enterprise cloud
      administrators and architects, while Aviatrix's documentation and briefs keep
      emphasizing policy consistency, IaC integration, Kubernetes traffic,
      east-west visibility, and AI workload or egress control. That combination
      implies a large-enterprise adoption path tied to modernization, security, and
      operations programs rather than a lightweight developer tool purchase. The
      same evidence also highlights the chapter's hard limit: most current signals
      are vendor-authored, public buyer-segment budgets are missing, and no
      retained independent source isolates a spend boundary precise enough to
      calculate SAM or SOM without inventing assumptions.
    claimRefs: [CM009, CM010, CM011, CM013, CM014]
