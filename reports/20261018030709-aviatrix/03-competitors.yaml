figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal map of cross-cloud runtime breadth versus operational abstraction based
      on the retained public evidence in this worker pool.
    data:
      xAxis:
        label: Cross-cloud runtime breadth (ordinal 1-5)
        min: 1
        max: 5
        low: Point product / perimeter stack
        high: Unified multicloud runtime fabric
        description: >-
          Ordinal score based on retained source-backed positioning, not market-share
          or performance measurements.
        scale: ordinal
      yAxis:
        label: Operational abstraction (ordinal 1-5)
        min: 1
        max: 5
        low: Customer-operated
        high: Vendor-managed
        description: >-
          Higher values indicate more vendor-managed operating responsibility rather
          than better product quality.
        scale: ordinal
      points:
        - label: Aviatrix
          x: 5
          y: 2
          note: Customer-operated multicloud fabric with the broadest retained runtime-control story.
        - label: Alkira
          x: 4
          y: 5
          note: Managed backbone trades some customer control for low operational burden.
        - label: Prosimo
          x: 3
          y: 4
          note: Application-centric overlay favors app experience and Zero Trust over raw transit breadth.
        - label: Native cloud controls
          x: 3
          y: 3
          note: Native-provider features can be simpler to buy but are less unified across clouds.
        - label: Firewall-centric incumbent stack
          x: 2
          y: 2
          note: Familiar perimeter tooling is operationally understood but weakest on cloud-runtime coverage.
        - label: Internal build / DIY
          x: 4
          y: 1
          note: Strong theoretical flexibility, but the buyer owns nearly all integration and operating load.
    approximationNotes: >-
      Scores are ordinal syntheses from retained public positioning evidence; they are
      not measured benchmark outputs or market-share estimates.
    claimRefs: [CP001, CP002, CP004, CP005, CP006, CP007, CP010, CP011]
callouts:
  - calloutType: risk
    title: Architectural strength can still compress into a buying-center problem
    body: >-
      Aviatrix looks strongest when the customer explicitly buys multicloud runtime
      control. When the same account prioritizes lower ops burden, existing firewall
      estates, or native cloud defaults, the company's advantage narrows quickly even
      if its technical architecture remains differentiated.
    claimRefs: [CP007, CP010, CP011]
