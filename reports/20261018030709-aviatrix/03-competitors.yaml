company:
  name: Aviatrix
chapter:
  number: 3
  title: Competitors
  summary: >-
    Aviatrix competes from a distinct position: it offers customer-operated multicloud
    runtime enforcement with a newer managed PaaS wrapper, while direct peers such as
    Alkira and Prosimo emphasize vendor-managed abstraction or application-centric
    overlays. The resulting moat is real in complex multicloud environments, but the
    same architecture leaves Aviatrix exposed when buyers prefer native cloud controls,
    managed backbones, or incumbent firewall stacks over a self-managed fabric.
sections:
  - id: landscape-coverage
    title: Landscape coverage and solution set
    body: >-
      The competitive set is broader than named startup peers. Aviatrix still sits in
      the direct multi-cloud networking and security cohort with Alkira and Prosimo, but
      it also competes against hyperscaler-native controls, perimeter-firewall-centric
      security stacks, and internal-build approaches that assemble AWS, Azure, GCP, and
      Kubernetes primitives in-house. The retained evidence consistently frames Aviatrix
      as a cloud-embedded control plane and data-plane architecture rather than a simple
      monitoring tool. That matters because buyer substitution happens at the
      architecture level: teams can buy a managed backbone, keep extending incumbent
      firewalls, rely on native cloud constructs, or operate their own overlay fabric.
    claimRefs: [CP001, CP002, CP005, CP006, CP009, CP010]
    tableRefs: [TP001]
  - id: differentiation-and-packaging
    title: Differentiation, capability emphasis, and packaging
    body: >-
      Aviatrix's differentiation is strongest when a buyer values multicloud policy
      consistency, inline enforcement, and network-centric visibility more than
      operational simplicity. Current product messaging heavily emphasizes runtime Zero
      Trust, Kubernetes traffic, AI-agent governance, and integration with existing
      firewalls rather than a rip-and-replace posture. That broadens the addressable
      budget from networking into security controls, but it does not erase the
      competitor tradeoff: Alkira and Prosimo package more vendor-managed operating
      models, while Aviatrix only partially closes that gap through its newer PaaS
      deployment option.
    claimRefs: [CP002, CP003, CP004, CP007, CP008, CP011]
    tableRefs: [TP002, TP003]
  - id: switching-costs-and-buying-motion
    title: Switching costs, multi-homing, and buying motion
    body: >-
      Aviatrix appears easier to land as an additive control layer than as a wholesale
      replacement. Its own materials repeatedly position the platform as something that
      extends firewalls and cloud-native controls instead of displacing them, which
      reduces political friction inside large enterprises but also preserves
      multi-homing. That coexistence logic helps in regulated or hybrid estates that
      already run multiple security tools, yet it also weakens lock-in because buyers
      can keep native controls, incumbent firewalls, or managed peers in the design.
      Operational burden is therefore central to competitive durability, not a side
      consideration.
    claimRefs: [CP004, CP007, CP011, CP013, CP014, CP015]
  - id: moat-durability-and-competitive-risks
    title: Moat durability and competitive risks
    body: >-
      Aviatrix's moat looks architectural rather than distribution-led. The company has
      credible enterprise proof points and a differentiated runtime-control narrative,
      but the retained independent evidence also highlights two pressure points. First,
      managed SaaS peers can appeal to teams that want the outcome without operating
      customer-side gateways or tuning cloud networking constructs. Second, hyperscaler
      secure-by-default moves can make native controls more acceptable, especially for
      buyers that are mostly single-cloud or can tolerate less cross-cloud consistency.
      That means Aviatrix's advantage is strongest in complex multicloud estates and
      least durable where simplicity or native bundling dominates the buying decision.
    claimRefs: [CP007, CP008, CP009, CP010, CP012]
    figureRefs: [FP001]
