artifact: customers
slug: aviatrix
runDate: 2026-10-18
company:
  name: Aviatrix
chapter:
  number: 6
  title: Customers
  summary: >-
    Aviatrix's public customer evidence points to a large-enterprise, multicloud
    buyer centered on security, network, and platform teams, with official
    adoption claims moving from more than 300 enterprises in 2019 to more than
    500 in late 2024. The evidence is directionally credible because it spans
    partner, marketplace, company, and independent references, but public proof
    of retention, concentration, and broad production outcomes remains thin.
sections:
  - id: target-segments-and-entry-points
    title: Target segments and initial buying motion
    body: >-
      The assigned evidence consistently frames Aviatrix around large
      enterprises operating across multiple clouds rather than SMB or
      single-cloud buyers. Oracle's cloud-infrastructure post says more than 300
      enterprises had already chosen Aviatrix in 2019, while current official
      and marketplace materials position the platform for enterprise cloud
      administrators, architects, security teams, network teams, and DevOps or
      platform operators managing multicloud, Kubernetes, and AI workloads.
      AWS- and Oracle-published deployment narratives also show the typical
      entry point: customers launch Controller and CoPilot in their own cloud
      account, then extend that control plane across other clouds and
      environments. That pattern suggests Aviatrix sells first into a painful
      infrastructure control problem, then expands into broader security and
      operations workflows.
    claimRefs: [CU001, CU002, CU003, CU007, CU014]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-breadth-and-named-proof
    title: Adoption breadth is real, but named proof is concentrated
    body: >-
      Public traction signals are meaningful but uneven. Aviatrix's own late
      2024 PaaS announcement says the platform is trusted by more than 500 of
      the world's leading enterprises, and the January 2025 theCUBE Research
      interview adds a sizeable ecosystem indicator with more than 23,000 ACE
      certified engineers. Named customer evidence is narrower. The strongest
      explicit outcome in this pool is a Verint quote inside Aviatrix's solution
      brief describing segmentation, visibility, and automation benefits. A
      Devoteam industry article adds a favorable Splunk anecdote and a
      broader list of organizations using Aviatrix, but it does not disclose
      contract scope, spend, or rollout depth for those names. Net: there is
      enough evidence to confirm real enterprise usage, but not enough to
      underwrite broad production standardization across the full logo set.
    claimRefs: [CU004, CU005, CU006, CU008, CU009, CU010, CU011]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-concentration
    title: Durability and concentration are still largely opaque
    body: >-
      Expansion surfaces are visible: current marketplace and press materials
      extend Aviatrix from multicloud connectivity into Kubernetes, AI, and
      managed PaaS deployment options, while the channel program rewards
      partners for net-new logos and revenue milestones. Those signals support a
      plausible land-and-expand story, but they do not substitute for hard
      retention proof. None of the assigned sources disclose gross retention,
      net retention, logo churn, contract length, or top-customer concentration.
      Public evidence is also weighted toward company-controlled and
      partner-controlled surfaces, so customer durability cannot be inferred
      from logos alone. The channel interview records a shift away from selling
      the comprehensive platform toward narrower insertion points, indicating
      adoption friction even though the article presents the pivot positively.
      The right underwriting posture is that adoption appears genuine,
      expansion vectors exist, but renewal quality and concentration risk
      remain open diligence items rather than verified strengths.
    claimRefs: [CU006, CU007, CU011, CU012, CU013, CU014, CU015]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale signal
      - Revenue / strategic value
      - Gap
    rows:
      - - Multicloud enterprise network and security teams
        - Security teams, network teams, and cloud architects typically buy; platform and operations teams use day-to-day
        - Unify visibility, segmentation, encryption, and control across AWS, Azure, GCP, OCI, and data centers
        - Oracle and AWS partner narratives both describe enterprise multicloud deployments; official materials claim 500+ leading enterprises by late 2024
        - Core installed-base segment and the likeliest payer for broad platform adoption
        - No public revenue split by vertical, size band, or geography
      - - Kubernetes and AI workload operators
        - Security leaders and cloud administrators buy; platform teams use to govern pod, service, and AI-agent traffic
        - Extend beyond backbone connectivity into east-west Kubernetes and AI workload governance
        - Current Microsoft marketplace and PR materials emphasize Kubernetes and AI-specific problems
        - Important expansion wedge that can raise seat and workflow breadth inside existing accounts
        - No public attach rate from core networking customers into these newer workloads
      - - Channel and service-provider ecosystem
        - Channel leaders, reseller principals, and delivery engineers influence purchase and deployment
        - Partner-led sourcing, implementation, and expansion into additional accounts or clouds
        - theCUBE Research cites over 23,000 ACE certified engineers and a program tied to net-new logos and revenue milestones
        - Strategic distribution lever that can lower customer acquisition friction and widen coverage
        - No disclosure on the share of bookings sourced or expanded through partners
      - - Large-enterprise reference cohort
        - Enterprise IT and security leaders pay; operations and engineering teams use
        - Production multicloud operations, visibility, troubleshooting, and security automation
        - Devoteam names Splunk, Adobe, Heineken, NASA, Virgin Australia, and Hyatt as users; Aviatrix cites Verint as a customer quote
        - Provides proof that the product reaches recognizable enterprise logos
        - Most named accounts lack deployment depth, contract size, and renewal evidence
    notes: >-
      Synthesized from assigned partner, marketplace, independent, and official
      sources; segment sizing is directional because public materials do not
      break out customer counts or revenue by cohort.
    claimRefs: [CU001, CU002, CU003, CU006, CU007, CU008, CU010, CU014]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Enterprise customer count
        - More than 300 enterprises
        - "2019-11-14"
        - Oracle Cloud Infrastructure blog
        - Medium
        - Shows enterprise adoption was already meaningful years before the current refresh
        - No ARR, active-account, or paying-customer definition
      - - Enterprise customer count
        - Trusted by more than 500 of the world's leading enterprises
        - "2024-11-12"
        - Aviatrix PRNewswire announcement
        - Medium
        - Indicates installed-base growth since the earlier Oracle reference
        - '"Trusted by" is not equivalent to active paid production deployments, and no churn context is given'
      - - Partner enablement scale
        - Over 23,000 certified engineers
        - "2025-01-23"
        - theCUBE Research interview
        - Medium
        - Suggests a sizable partner and practitioner ecosystem around implementation
        - Certification count is not a customer count or proof of partner-sourced revenue
      - - Adoption friction reduction
        - Free 30-day trial for Aviatrix PaaS
        - "2024-11-12"
        - Aviatrix PRNewswire announcement
        - Medium
        - Supports a lower-friction entry path for new customers or new workload expansions
        - No conversion, usage, or renewal data from the trial funnel
    notes: >-
      These signals are not strictly like-for-like: enterprise-count claims,
      certification volume, and trial availability describe different adoption
      layers and should not be turned into a single funnel.
    claimRefs: [CU004, CU005, CU006, CU007, CU011, CU014]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Verint
        - Enterprise software and contact-center technology
        - Uses Aviatrix for network segmentation, visibility, and automation in support of its own customers
        - Implied production reference
        - Official brief quotes Verint saying the platform added segmentation policies, rich visibility, and automation
        - Company-issued source; no contract size, timeline, or renewal detail
      - - Splunk
        - Enterprise observability / security software
        - Multicloud networking and troubleshooting support
        - Production use implied but not formally dated
        - Devoteam says Splunk found Aviatrix exceeded expectations, reduced operational burdens, and provided more functionality than anticipated
        - Single secondary account with no deployment scope, commercial value, or duration
      - - Adobe / Heineken / NASA / Virgin Australia / Hyatt
        - Large-enterprise logo cohort across software, consumer, public-sector, travel, and hospitality
        - Cited as organizations using Aviatrix
        - Unknown
        - Industry article shows logo breadth beyond two detailed references
        - No public outcome, environment size, production status, or buyer context for individual logos
    notes: >-
      This is a representative sample of named public references in the assigned
      pool, not a complete customer roster or a normalized set of case studies.
    enumerationScope:
      coverage: sample
      basis: >-
        Representative sample drawn only from named customer references visible
        in the assigned 2019-2026 official, partner, and independent sources;
        the pool does not contain a complete customer registry.
    claimRefs: [CU008, CU009, CU010, CU011]
figures:
  - id: FU001
    title: Customer journey from multicloud entry point to expansion proof gap
    type: journey-map
    summary: >-
      Public evidence shows a repeatable enterprise entry motion and plausible
      expansion loops, but the final renewal and concentration layer is not
      publicly evidenced.
    data:
      items:
        - label: Multicloud enterprise target
          tone: neutral
          actor: Security, network, and cloud-architecture leaders
          touchpoints:
            - Multicloud and hybrid complexity create the opening problem
            - Target accounts skew toward large enterprises operating across multiple clouds
        - label: Partner-assisted evaluation
          tone: positive
          actor: AWS, Oracle, channel partners, and ACE-certified ecosystem
          touchpoints:
            - AWS and Oracle partner surfaces explain deployment patterns
            - Channel program rewards net-new logos and revenue milestones
        - label: Launch in customer cloud account
          tone: positive
          actor: Cloud administrators and platform operators
          touchpoints:
            - Controller and CoPilot are launched inside the customer's account
            - Initial value centers on visibility, connectivity, and policy control
        - label: Cross-cloud operations
          tone: positive
          actor: Network and security operations teams
          touchpoints:
            - Expansion extends to other clouds, regions, and data centers
            - Named proof emphasizes troubleshooting, segmentation, and control
        - label: Kubernetes and AI security upsell
          tone: positive
          actor: Platform engineering and security teams
          touchpoints:
            - Current materials reposition Aviatrix toward Kubernetes and AI workloads
            - Managed PaaS and marketplace delivery lower incremental adoption friction
        - label: Renewal and concentration proof gap
          tone: risk
          actor: Investors and diligence team
          touchpoints:
            - No public NRR, GRR, churn, contract-length, or top-customer concentration data
            - Logo breadth does not prove durable production standardization
    claimRefs: [CU001, CU003, CU006, CU007, CU013, CU014]
callouts:
  - calloutType: strength
    title: Enterprise traction looks real, not hypothetical
    body: >-
      The customer story is backed by multiple source classes: Oracle cites more
      than 300 enterprises in 2019, Aviatrix claims more than 500 leading
      enterprises in late 2024, and third-party or partner sources add named
      references plus a large ACE-certified delivery ecosystem.
    claimRefs: [CU004, CU005, CU006, CU008, CU009, CU010]
  - calloutType: risk
    title: Durability is the main missing layer
    body: >-
      Public materials support who Aviatrix sells to and how accounts can
      expand, but they do not disclose renewal metrics, contract duration, or
      customer concentration, so underwriting retention still depends on private
      cohort and account-level diligence.
    claimRefs: [CU011, CU012, CU013, CU015]
