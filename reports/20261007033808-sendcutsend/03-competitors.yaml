      topic: "competitor-scale"
      missingEvidence: "Comparable competitor revenue, funding, customer, production-volume, and capacity metrics on a consistent period and denominator."
      whyItMatters: "Without normalized scale evidence, the chapter cannot determine whether SendCutSend's reported volume translates into a durable capacity or cost advantage."
