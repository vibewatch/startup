  - calloutType: "risk"
    title: "Breadth can route spend elsewhere"
    body: "Oversized parts, non-catalog materials, complex processes, and whole-BOM sourcing create openings for direct specialists and supplier networks, while public evidence does not quantify SendCutSend's switching costs or win rates."
