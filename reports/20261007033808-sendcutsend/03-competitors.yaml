    - type: "private-evidence-only"
      severity: "material"
      topic: "switching-and-retention"
      missingEvidence: "Win-loss records, cohort retention, repeat-order frequency, share of wallet, and job-level switching data across direct and adjacent competitors."
      whyItMatters: "Public comparison pages show substitutability by job type but cannot quantify switching costs, loyalty, or distribution power."
      diligencePath: "Request anonymized quote-to-order funnels and customer cohorts, then interview lost and multi-homing accounts using matched job specifications."
