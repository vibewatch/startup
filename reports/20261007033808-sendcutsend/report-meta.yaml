companyProfile:
  summary: >-
    SendCutSend is a Reno-based on-demand custom manufacturing platform founded in 2018 by Jim and Erin Belosic. The
    company combines proprietary quoting and sheet-nesting software with domestic fabrication capacity to sell
    instant-quote metal parts across a broad service catalog that includes laser cutting, waterjet cutting, CNC routing
    and machining, bending, and finishing. The business scaled to roughly 300,000 customers, about 410 employees, and a
    claimed $200M annual revenue run rate before closing a $110M Series A at a $1.01B post-money valuation in May 2026.
    Public disclosures support strong operating breadth, but audited financials, gross margin, debt terms, and
    preference-stack detail remain private.
