  topStrengths:
    - Instant-quote software plus owned domestic capacity creates a differentiated self-serve manufacturing workflow.
    - >-
      Customer breadth is unusually strong: 300,000+ customers and a low top-account concentration reduce classic
      concentration risk.
    - >-
      Growth signals are exceptional for an industrial company, with $100M annual revenue reached in October 2025 and
      roughly $200M claimed by May 2026.
    - >-
      The domestic footprint and broad service catalog support share gain in reshoring, robotics, aerospace, and
      fast-turn prototyping workflows.
    - >-
      High-signal investors and seven years of bootstrapped scaling suggest real operational substance rather than pure
      narrative financing.
  topRisks:
    - >-
      Capex-heavy owned capacity plus JPMorgan equipment-finance dependence can amplify downside if credit or
      utilization weakens.
    - >-
      No public audited financials, gross-margin disclosure, or cap-table detail means the current price cannot be fully
      underwritten from public evidence.
    - >-
      Cybersecurity and regulated-customer qualification remain material risks because defense/aerospace upside depends
      on stronger proof than the public record currently shows.
    - >-
      Speed and reliability are core to the moat, but public uptime, scrap, remake, and late-ship metrics are not
      disclosed.
    - >-
      Leadership and software-stack concentration remain meaningful, with founder and core technical depth still central
      to the story.
  unresolvedGaps:
    - >-
      Audited financial statements and a revenue bridge from the October 2025 $100M milestone to the May 2026 ~$200M
      claim.
    - Gross margin, working-capital profile, and service-line economics by facility and process.
    - JPMorgan debt balances, covenants, maturities, and any constraints on future capacity expansion.
    - Series A cap table, liquidation preferences, anti-dilution mechanics, and post-round board rights.
    - Enterprise / regulated-customer proof including certifications, cyber-audit evidence, and named reference depth.
