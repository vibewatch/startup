  topStrengths:
    - 即时报价软件叠加自有的美国本土产能，拼出差异化的自助制造流程。
    - 客户覆盖面异常广：客户数超过 300,000，头部客户占比低，经典的客户集中度风险因此较小。
    - 对工业企业而言，增长信号非常突出：2025 年 10 月年收入达到 $100M，2026 年 5 月公司口径约为 $200M。
    - 本土产能布局和广泛的服务目录，有利于公司在制造业回流、机器人、航空航天和快速原型流程中抢占份额。
    - 高信号投资人和七年的自力扩张经历，说明公司确有运营底子，而不只是靠叙事融资。
  topRisks:
    - 重资本开支的自有产能叠加对 JPMorgan 设备融资的依赖，一旦信贷或产能利用率走弱，下行幅度可能被放大。
    - 没有公开的经审计财务、毛利率披露或股权结构细节，仅凭公开证据无法充分评估当前价格。
    - 网络安全和受监管客户资质仍是重大风险，因为国防和航空航天业务的上行空间需要比公开记录目前展示的更强证明。
    - 速度和可靠性是护城河的核心，但公开资料没有披露正常运行时间、报废、返工和延迟发货指标。
    - 管理层和软件栈集中度仍值得关注，创始人和核心技术能力依旧是这套故事的关键。
  unresolvedGaps:
    - 经审计财务报表，以及从 2025 年 10 月 $100M 里程碑到 2026 年 5 月据公司声称约为 $200M 的收入桥接。
    - 毛利率、营运资金状况，以及按工厂和工艺拆分的服务线经济性。
    - JPMorgan 债务余额、契约、到期日，以及未来扩充产能可能受到的限制。
    - A 轮股权结构表、清算优先权、反稀释机制和本轮融资后的董事会权利。
    - 企业客户 / 受监管客户的证明，包括认证、网络安全审计证据和具名客户背书的深度。
