      - number: '3.3'
        title: Switching, Trust, and Distribution
        blocks:
          - type: paragraph
            body: >
              The assigned evidence does not establish proprietary file lock-in, exclusive supply access, or measured
              customer switching costs. Instead, competing comparison pages organize alternatives by job type: focused
              flat parts, thicker material, broad multi-process work, oversized parts, or a whole bill of materials
              [CP006, CP009, CP010, CP012]. That makes project-level multi-homing plausible, but it remains an inference
              rather than a measured retention result. SendCutSend's company-hosted testimonials indicate that speed,
              convenience, and the removal of minimum-order and setup friction can become a preferred workflow, yet
              those testimonials cannot establish representative satisfaction or switching resistance [CP013]. Trust
              also has a contractual boundary: SendCutSend's terms place responsibility for design quality, material
              choice, legality, and fitness for purpose on the customer, while the company warrants only substantial
              conformance to the submitted design within process limitations [CP014]. Enterprise diligence therefore
              needs actual quality, certification, loss-rate, and repeat-purchase evidence rather than marketing claims
              alone.
            claimRefs:
              - CP006
              - CP009
              - CP010
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: Moat Durability and Displacement Risk
        blocks:
          - type: paragraph
            body: >
              SendCutSend's defensibility is best framed as execution scale plus reinvestment, not a unique feature set.
              The company reported more than 30 million parts shipped to over 300,000 customers by May 2026 and
              announced that more than $250 million of new capital would expand facilities and add manufacturing hubs
              [CP004, CP005]. Those figures indicate operating scale and an intent to push toward wider capabilities,
              lower prices, and faster production, but both are company-issued and do not reveal utilization, unit
              economics, or service-level performance. Competitive pressure is two-sided: focused shops can attack
              thickness, DFM, or geometry gaps, while networks can absorb broader processes and whole-BOM work [CP007,
              CP009, CP010, CP011, CP012]. The evidence-backed positioning map therefore treats quote immediacy and
              process breadth as ordinal, not measured, dimensions [CP016]. Durability depends on whether planned
              capacity improves price and reliability faster than direct peers copy the digital workflow and adjacent
              platforms improve execution.
            claimRefs:
              - CP004
              - CP005
              - CP007
              - CP009
              - CP010
              - CP011
              - CP012
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Focused self-service advantage
            body: >-
              SendCutSend combines instant quoting, disclosed commercial-account thresholds, and company-reported
              production scale; this is a concrete workflow advantage for repeatable parts that fit its process
              envelope, not proof of universal price or quality leadership.
            calloutType: strength
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP008
          - type: callout
            title: Breadth can route spend elsewhere
            body: >-
              Oversized parts, non-catalog materials, complex processes, and whole-BOM sourcing create openings for
              direct specialists and supplier networks, while public evidence does not quantify SendCutSend's switching
              costs or win rates.
            calloutType: risk
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Monetization Architecture, and Pricing Structure
        blocks:
          - type: paragraph
            body: >-
              SendCutSend operates an on-demand, software-automated rapid custom manufacturing business monetizing
              through transaction-based digital order fulfillment. Standard job pricing displayed on the digital
              platform is fully bundled and inclusive of raw material inputs, cutting/machining labor, deburring, and
              standard parcel shipping. Customers configure parts directly through web CAD uploads or parametric
              templates, receiving algorithmic instant quotes that eliminate traditional manual shop estimating queues.
              While transactional list pricing is fully public, realized average order values, custom job surcharges,
              and volume discount tiers are negotiated ad hoc or opaque to external underwriting. The platform also
              provisions an opt-in designer marketplace where independent creators set end-product prices, receiving
              payment within sixty days after the customer return window closes, while SendCutSend captures a fixed
              percentage production markup.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
