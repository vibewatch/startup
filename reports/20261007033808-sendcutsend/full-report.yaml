  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Taxonomy and Severity Assessment
        blocks:
          - type: paragraph
            body: >-
              SendCutSend's core business model combines proprietary software-driven nesting and quoting with heavy
              physical manufacturing infrastructure. The company operates high-throughput manufacturing hubs running
              around-the-clock shifts to fabricate custom sheet metal and CNC machined parts. While this vertically
              integrated structure enables rapid turnarounds—often delivering parts in two to three days without minimum
              order thresholds—it introduces significant operational, capital, and partner dependencies.


              The primary operational risk stems from owned-capacity asset leverage. Unlike asset-light manufacturing
              brokers or digital marketplaces such as Xometry that route demand dynamically across thousands of
              independent job shops, SendCutSend bears the entire direct burden of equipment financing, physical
              facility leases, maintenance cycles, and direct factory labor. The company has announced aggressive
              capital expenditure programs, including allocating over $250 million toward facility expansion and new
              regional manufacturing hubs as part of a broader $1 billion industrial commitment. When transaction
              volumes fluctuate or economic demand softens, fixed costs in physical machinery, facility leases, and
              skilled labor cannot be curtailed with software-like flexibility, creating direct margin compression.


              Furthermore, SendCutSend's specialized production envelope creates defined market boundaries. Independent
              technical comparisons indicate that SendCutSend is optimized specifically for flat sheet metal cutting,
              CNC routing, bending, and straightforward secondary finishing, whereas multi-process requirements
              involving complex 5-axis milling, micro-machining, injection molding, or additive manufacturing require
              external brokerage platforms. This boundaries-based specialization limits enterprise account consolidation
              while preserving rapid execution in high-velocity prototyping and sheet metal fabrication.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR007
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR011
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
