      - number: '4.2'
        title: Cost Structure Dynamics, Margin Drivers, and Operating Leverage
        blocks:
          - type: paragraph
            body: >-
              The core economic engine of SendCutSend relies on proprietary software nesting that aggregates hundreds of
              discrete customer geometries onto single standard sheets of sheet metal or composite stock. This
              high-density multi-tenant layout minimizes raw stock scrap rates and spreads setup and cutting overhead
              across diverse customer orders, turning high-mix low-volume production into an efficient batch process.
              Capital intensity in the operating facilities is substantial: industrial fiber laser cutters cost
              approximately $1.3 million each, with thirteen cutters deployed across Reno, Paris, and Arlington,
              complemented by multiple robotic CNC milling centers costing roughly $1 million each. While the business
              operated profitably for eight years through organic cash reinvestment and round-the-clock four-shift
              schedules, facility-level gross margins, labor absorption, and freight expense sensitivity remain
              unverified private figures.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
