  - id: TV002
    title: Investment Thesis vs Anti-Thesis
    columns:
      - Dimension
      - Thesis (Positive Driver)
      - Anti-Thesis (Downside Risk)
      - What Would Change View
    rows:
      - - Market Position
        - Dominant self-serve instant quoting platform with over 300,000 customers
        - Customer base skews toward small batch and prototype orders with high churn potential
        - Proof of recurring multi-year enterprise production contracts with high retention
      - - Unit Economics
        - Algorithmic multi-customer nesting on standard sheets drives material efficiency
        - High capital expenditure for 13+ fiber lasers and CNC mills limits free cash flow
        - Audited confirmation of gross margin exceeding 45% and sustained positive operating cash flow
      - - Technology Moat
        - Proprietary automated quoting and fabrication workflow cuts delivery to 24 hours
        - Downstream assembly and post-processing introduce manual bottleneck risks
        - Demonstrated automated inspection and robotic material handling across all hubs
      - - Contractual Terms
        - Frictionless online ordering minimizes sales friction and legal overhead
        - Terms of service strictly limit liability to greater of $100 or fee and disclaim warranties
        - Adoption of enterprise Master Service Agreements with standard commercial warranty protections
    notes: Comparison synthesizes operational disclosures, commercial terms, and independent industry analyses.
