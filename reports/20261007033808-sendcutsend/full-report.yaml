      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is better evidenced than loyalty
            body: >-
              Multiple assigned sources repeat cumulative scale and describe use from makers through enterprise
              industrial teams. That breadth reduces dependence on a single disclosed vertical, but no retained source
              quantifies customer concentration or cohort retention.
            calloutType: strength
