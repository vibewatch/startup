  - id: FE001
    title: SendCutSend End-to-End Technology and Physical Manufacturing Stack
    type: stack
    summary: >-
      Architectural overview detailing the progression from browser-based CAD ingestion down to multi-facility CNC
      physical execution.
    data:
      layers:
        - label: 'Layer 1: Digital Presentation and File Intake'
          detail: >-
            Web application portal running Vue.js and WebGL rendering for instant file ingestion, part preview, and cart
            configuration.
        - label: 'Layer 2: Preflight Geometry Validation Engine'
          detail: >-
            Algorithmic parsers inspecting DXF and STEP geometry for cut profiles, minimum bend flanges, hole
            clearances, and material rules.
        - label: 'Layer 3: Algorithmic Multi-Customer Nesting'
          detail: >-
            Core optimization system packing hundreds of discrete customer parts onto common raw metal sheets to
            minimize waste.
        - label: 'Layer 4: Distributed Factory Coordination System'
          detail: >-
            Relational database and job scheduling services routing cut files across six facilities in Reno, Paris, and
            Arlington.
        - label: 'Layer 5: CNC Hardware and Automated Machining Fleet'
          detail: >-
            13 industrial fiber lasers ($1.3M each), robotic milling centers ($1M each), waterjets, press brakes, and
            finishing shops.
        - label: 'Layer 6: Logistics, Packaging, and Parcel Dispatch'
          detail: >-
            Quality inspection, protective kitting, custom packaging, and nationwide ground shipping achieving 91% 5-day
            delivery.
    approximationNotes: >-
      Stack layer decomposition synthesized from engineering hiring specs, founder interviews, and platform
      documentation.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE007
  - id: FU001
    title: Evidence-based customer adoption and expansion journey
    type: journey-map
    summary: >-
      The public evidence supports a path from self-serve trial to repeat and production use, but not quantified
      conversion or retention between stages.
    data:
      nodes:
        - id: account
          label: Account and design submission
          detail: Terms require an account before a customer can upload a design or place an order.
          touchpoints:
            - Account creation
            - Design upload
        - id: quote
          label: Self-serve quote and first order
          detail: The company positions instant quoting and low-volume access as the entry point.
          touchpoints:
            - Instant quote
            - Single prototype
        - id: validation
          label: Delivery and quality validation
          detail: Testimonials emphasize delivery speed, cut quality, and predictable estimates.
          touchpoints:
            - Part receipt
            - Fit and quality check
        - id: repeat
          label: Repeat project use
          detail: Named users describe regular orders or use across most projects over several years.
          touchpoints:
            - Saved workflow
            - New project orders
        - id: production
          label: Production-volume expansion
          detail: Company evidence describes expansion from prototypes to orders of thousands or tens of thousands of parts.
          touchpoints:
            - Higher quantities
            - Broader processing
        - id: enterprise
          label: Enterprise procurement
          detail: The company claims Fortune 500 use, but contract length, concentration, and renewal evidence remain private.
          touchpoints:
            - Procurement review
            - Recurring program demand
    approximationNotes: The stages are a qualitative synthesis; no source provides conversion rates, stage populations, or time-to-expand.
