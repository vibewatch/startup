              - CU003
              - CU005
              - CU006
              - CU010
      - number: '6.2'
        title: Scale is visible; active usage and cohort quality are not
        blocks:
          - type: paragraph
            body: >
              SendCutSend's May 2026 release says the company had shipped more than 30 million parts to over 300,000
              customers. A 2026 Torchmate supplier case study repeats approximately 300,000 customers and more than 30
              million parts, although it is a commercial supplier story based in part on an interview with SendCutSend's
              CEO rather than an independent audit. ARR Club separately describes a $140 million revenue run rate in
              April 2026; that wording is revenue run rate, not ARR, and it should not be interpreted as recurring
              subscription revenue.


              These figures establish cumulative reach and throughput but omit the denominators needed to assess
              adoption quality. None of the assigned sources provides monthly active customers, orders per active
              account, repeat-purchase rate, cohort frequency, or customer acquisition efficiency. Jirav's vendor case
              study indicates that management tracks average order value, product counts, product types, and orders per
              business day, which suggests the underlying operating data exists, but the case study publishes no values.
            claimRefs:
              - CU001
              - CU007
              - CU008
              - CU009
              - CU014
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU007
              - CU008
              - CU009
              - CU014
              - CU015
      - number: '6.3'
        title: Named references show repeat use, but evidence is company-curated
        blocks:
          - type: paragraph
            body: >
              The strongest named examples in the assigned pool are testimonials published by SendCutSend. Timwelds says
              he has ordered regularly since August 2020; Tyler Bell says he has used the service on almost every
              project for several years; Kuhnhausen Metal Concepts describes order flexibility from one component to
              10,000; and Reversion Raceworks calls the service pivotal to its manufacturing process. These statements
              are consistent with recurring production use rather than isolated pilots, and they cover prototyping,
              brackets, assemblies, finishing, and cross-border delivery.


              Reference quality remains limited because the testimonial page is selected and hosted by the company. The
              retained independent and partner sources corroborate broad customer categories and aggregate scale, but
              they do not validate these named customers' volumes, savings, defect rates, contract terms, or renewal
              behavior. Accordingly, the examples demonstrate plausible repeat usage and workflow fit, not measured
              retention or independently verified customer outcomes.
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU006
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU006
              - CU016
      - number: '6.4'
        title: Expansion is operationally plausible, while durability remains unmeasured
        blocks:
          - type: paragraph
            body: >
              The customer journey can expand along two axes: higher order quantity and broader process use. SendCutSend
              says it supports a single prototype through tens of thousands of production parts, while testimonials
              describe customers progressing from individual brackets to complex assemblies and repeat production.
              Jirav's case study says management models customer segments using average order value, product counts, and
              product types, which are relevant signals for cross-sell and share-of-wallet expansion. No retained
              source, however, discloses NRR, GRR, churn, renewal, contract length, customer concentration, or channel
              dependence.


              Customer terms introduce practical friction. Orders usually cannot be canceled after entering production,
              returns and refunds are decided case by case, prices may change with raw-material and commodity prices,
              and the service is limited to the United States and Canada. The terms also place design fitness and
              lawful-use responsibility on customers and provide limited product warranties. These provisions may be
              standard for custom manufacturing, but the assigned evidence does not show how often they affect
              conversion, disputes, or enterprise procurement.
            claimRefs:
              - CU004
              - CU009
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
