chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Model, and Governance
        blocks:
          - type: paragraph
            body: >-
              SendCutSend Inc. was established in 2018 in Reno, Nevada, operating as an on-demand precision
              manufacturing platform that merges custom software automation with physical metal fabrication [CO001]. The
              platform provides automated quoting, sheet nesting, laser cutting, CNC routing, waterjet cutting, bending,
              and specialized metal finishing services across more than 200 materials [CO001, CO002]. Operating 24/7
              across multiple facilities including its Longley Lane Reno hub, Paris (Kentucky), and Arlington (Texas),
              the company relies on proprietary nesting software developed by co-founder and Chief Technology Officer
              Jacob Graham to combine hundreds of disparate customer cut files onto single material sheets [CO001,
              CO007, CO008]. This batch nesting dramatically lowers setup waste and enables cost-effective single-unit
              custom part production [CO001, CO008]. While co-founder and Chief Executive Officer Jim Belosic and
              President Erin Belosic retain operational and governance leadership, key-person dependency on executive
              leadership and core software architecture remains material as operations scale nationally [CO007, CO009].
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO006
              - CO007
              - CO009
      - number: '1.2'
        title: Capitalization Structure, Valuation, and Financing Trajectory
        blocks:
          - type: paragraph
            body: >-
              From inception in 2018 through early 2026, SendCutSend expanded primarily through organic cash flow
              reinvestment and an initial modest friends-and-family financing round of approximately $6M featuring
              participation from angel investors Sandy Kory and Mark Sugarman [CO003, CO006]. On May 19, 2026,
              SendCutSend closed a $110M Series A institutional financing round co-led by Sequoia Capital (Andrew Reed,
              Shaun Maguire), Paradigm (Matt Wong, Matt Huang), and Stripe founders Patrick Collison and John Collison,
              which established a post-money valuation of $1.01B [CO003, CO004, CO006]. Secondary market intelligence
              from Forge Global indicates lifetime equity funding reached approximately $116.17M following Seed tranches
              priced in September 2022 and the Series A round priced at $50.53 per share [CO006]. The company maintains
              commercial debt arrangements with JPMorgan Chase to finance capital-intensive equipment acquisitions,
              though detailed debt covenants, credit facility limits, and audited financial statements remain private
              [CO001, CO010].
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO006
              - CO010
