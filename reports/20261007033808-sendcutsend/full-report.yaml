            - colId: impact-critical
              value: Equipment financing constraints during expansion
            - colId: impact-high
              value: Parcel delivery logistics bottlenecks
            - colId: impact-moderate
              value: Raw material price volatility and pass-through lag
            - colId: impact-low
              value: Single-machine calibration drift during shift change
            - colId: impact-negligible
              value: Packaging label printing delay
        - id: likelihood-low
          label: Low Likelihood
          values:
            - colId: impact-catastrophic
              value: Major multi-jurisdiction product liability judgment
            - colId: impact-critical
              value: Mission-critical downstream product liability claims
            - colId: impact-high
              value: Catastrophic multi-facility equipment downtime
            - colId: impact-moderate
