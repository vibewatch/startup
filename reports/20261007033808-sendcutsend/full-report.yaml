              - CP012
              - CP013
              - CP015
      - number: '3.2'
        title: Capability and Commercial Trade-offs
        blocks:
          - type: paragraph
            body: >
              SendCutSend's strongest public positioning is a narrow, legible buying experience: standard pricing is
              listed online and the terms say it includes materials, labor, and shipping, while the pricing page offers
              wholesale access at $1,000 of monthly orders or 5,000 parts annually and Net 30 or Net 60 terms for
              pre-qualified customers [CP001, CP002, CP003]. That package directly attacks manual quoting and setup
              friction, although the supporting comparison to local shops is a testimonial selected and published by
              SendCutSend rather than an independent benchmark [CP013]. Direct and adjacent competitors widen the
              decision. OSH Cut is reported to support thicker material and additional manual DFM review; Xometry spans
              more instant-quoted processes; Protolabs covers broader processes at a reportedly higher price; and Jiga
              or OpenSpindle substitute supplier choice and human review for immediate checkout [CP006, CP007, CP010,
              CP011, CP012]. Public sources do not provide normalized, same-part quotes, so no provider can be declared
              the price leader across jobs.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
              - CP007
              - CP010
              - CP011
              - CP012
              - CP013
