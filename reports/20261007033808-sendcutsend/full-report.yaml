figures:
  - id: FO001
    title: SendCutSend Corporate and Operational Milestone Timeline
    type: timeline
    summary: >-
      Chronological milestone progression of SendCutSend from initial warehouse operations in Reno to nationwide
      manufacturing network and unicorn financing.
    data:
      items:
        - date: 2018-11
          label: Company Founding & First Commercial Order
          detail: >-
            Jim Belosic sells software venture ShortStack to launch SendCutSend, receiving first online order for
            pickleball paddle keychains.
          tone: positive
        - date: 2019-05
          label: Commercial Brand Customer Adoption
          detail: >-
            Enterprise and commercial fabrication accounts begin populating online job queue alongside hobbyist
            customers.
          tone: positive
        - date: 2022-09
          label: Seed Capitalization Buffer
          detail: >-
            Secures modest friends-and-family capital buffer ($6M across seed tranches) with Sandy Kory and Mark
            Sugarman.
          tone: neutral
        - date: 2023-06
          label: Multi-Facility Regional Expansion
          detail: >-
            Establishes 50,000-square-foot production hubs in Paris (Kentucky) and Arlington (Texas) to deliver rapid
            regional shipping.
          tone: positive
        - date: 2025-10
          label: $100M Annual Revenue Milestone
          detail: Crosses $100M revenue run-rate mark while maintaining 80% YoY revenue expansion and 410 full-time employees.
          tone: positive
        - date: 2026-01
          label: Finishing & CNC Line Launch
          detail: >-
            Expands Reno operations with additional 20,000 sq ft facility for anodizing, powder coating, and robotic CNC
            milling lines.
          tone: positive
        - date: 2026-05
          label: $110M Series A Financing & Unicorn Valuation
          detail: Raises $110M led by Sequoia, Paradigm, and the Collison brothers at a $1.01B post-money valuation.
          tone: positive
        - date: 2026-06
          label: Standard Terms of Service Liability Caps
          detail: >-
            Updates formal terms with total liability ceiling capped at greater of $100 or 12-month fees, disclaiming
            product warranties.
          tone: warning
    approximationNotes: Dates reflect verified public announcements, local reporting milestones, and formal corporate filings.
    claimRefs:
      - CO001
      - CO003
      - CO005
      - CO006
      - CO011
      - CO012
  - id: FM001
    title: Market sizing layers and addressable spend pyramid
    type: pyramid
    summary: >-
      Visual hierarchy of market sizing layers from total North American metal fabrication down to SendCutSend's core
      web-first obtainable market.
    data:
      items:
        - label: North American Contract Fabrication (TAM)
          value: 50000
          unit: USD Millions
          detail: Broad regional contract metal fabrication, CNC machining, and structural metalwork.
        - label: On-Demand Rapid Fabrication & Prototyping (SAM)
          value: 6000
          unit: USD Millions
          detail: Quick-turn sheet metal cutting, bending, and light machining for commercial and R&D buyers.
        - label: High-Mix Sheet & Plate Machining Subsegment
          value: 2500
          unit: USD Millions
          detail: Precision sheet and plate forming addressable by automated domestic cutting centers.
        - label: Web-First Algorithmic Domestic Fabrication (SOM)
          value: 850
          unit: USD Millions
          detail: Self-service instant-quote sheet cutting and forming delivered in 2 to 4 business days.
        - label: SendCutSend Current Operational Scale
          value: 150
          unit: USD Millions
          detail: Annualized revenue run-rate exceeding $150M with 150k+ customers and 30M+ parts shipped.
        - label: Near-Term High-Volume OEM Expansion Layer
          value: 75
          unit: USD Millions
          detail: Targeted multi-facility production batch and kanban replenishment volume.
