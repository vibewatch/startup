      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Algorithmic Multi-Tenant Nesting Drives Production Margin Leverage
            body: >-
              SendCutSend's core economic moat is rooted in software automation rather than generic metal cutting. By
              aggregating orders from thousands of disparate customers onto unified material sheets, SendCutSend
              dramatically reduces scrap metal waste and setup machine downtime, unlocking high gross contribution
              margins on low-quantity custom jobs.
            calloutType: insight
            claimRefs:
              - CI005
              - CI008
          - type: callout
            title: All-Inclusive Quoting Exposes Realized Margins to Commodity and Freight Volatility
            body: >-
              Because SendCutSend's list pricing includes material inputs, processing labor, and standard shipping fees,
              sudden spikes in sheet metal commodity indices (aluminum, stainless steel) or parcel delivery surcharges
              compress unit margins unless algorithmic quoting dynamically adjusts in real time.
            calloutType: risk
            claimRefs:
              - CI002
              - CI003
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Instant Digital Quoting and File Intake Architecture
        blocks:
          - type: paragraph
            body: >-
              SendCutSend defines its customer experience around frictionless, automated file ingestion that eliminates
              the days-long quoting delays typical of traditional job shops [CE001, CE006]. Customers upload 2D vector
              geometries (DXF, DWG, EPS, AI) or 3D solid models (STEP, STP) directly to the web portal [CE002, CE009].
              The software engine performs instant preflight geometry validation, measuring boundary contours, pierce
              clearances, bend-line spans, hole-to-edge ratios, and internal cutouts against toolpath physics before
              order submission [CE001, CE003]. Traditional technical drawings, PDF callouts, and manual drafting markups
              are deliberately excluded from manufacturing workflows; fabrication runs exclusively from validated
              geometry vectors and customer-selected digital cart parameters [CE009]. If non-standard requirements
              emerge, jobs shift to a manual offline custom quote track, protecting high-velocity automated factory
              queues from human scheduling interruptions [CE009].
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE006
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
              - CE007
              - CE009
      - number: '5.2'
        title: Automated Nesting and Distributed Operating Stack
        blocks:
          - type: paragraph
            body: >-
              The core algorithmic innovation developed by founder Jim Belosic and CTO Jacob Graham is automated
              multi-customer nesting [CE005]. Because single-part custom fabrication typically incurs prohibitive setup
              overhead and raw material scrap, SendCutSend's nesting software dynamically bundles hundreds of customer
              parts across disparate accounts onto standard raw material sheets [CE005]. This achieves high yield,
              lowers unit costs, and eliminates minimum order quantities [CE005, CE007]. The software platform
              coordinates operations across six facilities in Reno, Nevada, Paris, Kentucky, and Arlington, Texas
              [CE004, CE007]. The manufacturing layer integrates 13 high-power CNC fiber laser cutters alongside
              automated robotic milling machines, deploying 24/7 four-shift production rotations that achieve standard
              five-day turnaround and sub-48-hour expedited fulfillment [CE003, CE004, CE005, CE007].
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE007
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE007
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
