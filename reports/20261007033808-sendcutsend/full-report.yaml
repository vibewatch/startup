      - number: '4.3'
        title: Capital Adequacy, Financing Structure, and Underwriting Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              SendCutSend operated largely bootstrapped from inception in 2018 through early 2026, supported by organic
              operating profits, a foundational $6 million friends-and-family financing round, and an active banking and
              credit partnership with JPMorgan Chase. In May 2026, the company completed its first major institutional
              financing round, securing $110 million in fresh equity capital co-led by Sequoia Capital and Paradigm,
              alongside Stripe co-founders Patrick and John Collison, which established a $1.01 billion valuation
              milestone. The company pledged a five-year initiative allocating over $250 million to facility expansions
              and equipment hubs. Despite public claims of $200 million in annual revenue, third-party databases report
              conflicting, highly divergent revenue estimates ranging from $7.1 million to $200 million ARR,
              highlighting the total absence of audited financial statements, GAAP revenue bridges, or verified balance
              sheet disclosure.
            claimRefs:
