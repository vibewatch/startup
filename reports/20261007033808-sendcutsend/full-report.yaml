      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Software-First Factory Model as Unit-Economics Differentiator
            body: >-
              Unlike traditional sheet metal job shops burdened by manual quoting and dedicated machine setup for small
              production volumes, SendCutSend's core advantage stems from its proprietary multi-customer order nesting
              software. By algorithmically aggregating hundreds of independent customer designs onto single 5x10 foot
              metal sheets, the company achieves near-zero marginal setup costs and high raw-material utilization,
              enabling affordable single-unit prototypes while preserving rapid 24/7 turnaround.
            calloutType: insight
            claimRefs:
              - CO001
              - CO008
          - type: callout
            title: Capital Intensity and Lack of Audited Operational Disclosures
            body: >-
              While SendCutSend's $1.01B valuation in May 2026 reflects massive market enthusiasm for software-enabled
              American reindustrialization, the underlying manufacturing business requires intensive capital
              expenditures—including $1.3M per fiber laser cutter and $1M per robotic milling unit across three
              round-the-clock facilities. With audited GAAP statements, gross margins, and JPMorgan debt facility terms
              remaining confidential, outside investors must carefully evaluate equipment depreciation, maintenance
              burdens, and working-capital exposure.
            calloutType: risk
            claimRefs:
              - CO001
              - CO003
              - CO010
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Definitions, and Included Spend
        blocks:
          - type: paragraph
            body: >-
              The addressable market for SendCutSend sits within the broader domestic contract metal fabrication and
              on-demand precision manufacturing sector. Historically, procurement of custom sheet metal, laser cutting,
              CNC routing, and press-brake bending required engineers and buyers to navigate a manual request-for-quote
              (RFQ) workflow. Job shops typically spend days preparing engineering estimates, evaluating CAD prints,
              Remaking drawings for machine tooling, and managing customer approvals before a single beam cuts raw
              metal. SendCutSend fundamentally bounds its market around high-mix, variable-quantity parts where
              front-office information processing represents the primary procurement bottleneck.


              The addressable spend encompasses 2D and 2.5D flat sheet cutting (fiber laser and waterjet), sheet metal
              forming (press brake bending, countersinking, hardware insertion, threading), and rapid CNC routing across
              aluminum, steel, stainless, brass, copper, titanium, composites, and engineered plastics. Included spend
              captures rapid prototyping, aftermarket and replacement components, low-to-medium volume OEM production
              runs, and maintenance, repair, and operations (MRO) fabrication. Crucially, SendCutSend excludes
              ultra-high-volume automotive stamping, heavy structural steel fabrication, complex 5-axis monolithic
              aerospace forgings, and tightly regulated defense articles requiring explicit military certifications or
              classified secure facilities. Status-quo substitutes include traditional regional job shops, in-house
              capital equipment (such as dedicated CNC plasma or waterjet tables), and digital broker marketplaces.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
      - number: '2.2'
        title: 'Market Sizing Lenses: TAM, SAM, and Serviced Operational Realities'
        blocks:
          - type: paragraph
            body: >-
              Evaluating SendCutSend's addressable universe requires multiple distinct sizing lenses rather than a
              single top-down total addressable market (TAM) estimate. The broadest lens encompasses the North American
              contract metal fabrication and machining industry, an established sector representing tens of billions of
              dollars in annual throughput. However, the vast majority of that total reflects captive long-term
              production contracts, structural fabrication, and dedicated supply-chain partnerships that do not transact
              through self-service web portals.


              A more disciplined serviceable addressable market (SAM) isolates quick-turn on-demand fabrication, rapid
              prototyping, and batch production of sheet metal parts for small businesses, engineering teams, and
              regional OEMs. This serviceable layer is constrained by geographic shipping radius, maximum part envelope
              (approximately 56 inches by 44 inches on standard custom cuts), material thickness limits, and
              post-processing capabilities. SendCutSend's serviceable obtainable market (SOM) represents automated
              web-first domestic ordering where parts can be algorithmically quoted, gang-nested on standard sheets, and
              dispatched within 2 to 4 business days. SendCutSend demonstrated the velocity of this obtainable layer by
              crossing the $100 million annualized revenue milestone in October 2025 and projecting over $150 million
              for 2026, fulfilling orders for more than 150,000 customers across robotics, aerospace, automotive, and
              industrial hardware.
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM007
      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Procurement Pathways
        blocks:
          - type: paragraph
            body: >-
              Demand across SendCutSend's platform spans four distinct customer tiers: independent makers and
              professional tinkerers, hardware engineering prototyping teams, specialized small-to-medium fabrication
              shops, and enterprise OEM production departments. Each segment exhibits distinct budget authority,
              purchasing triggers, and tolerance for lead-time friction. Individual makers and hobbyist fabricators
              typically purchase on personal credit cards or departmental expense budgets with transactions between $20
              and $300, motivated by instant pricing and eliminating the setup fees of local machine shops.


              In contrast, professional hardware engineering teams at commercial aerospace, robotics, and industrial
              technology companies utilize SendCutSend for iterative R&D cycles. For these buyers, budget ownership sits
              with mechanical engineering managers or product development leads whose primary economic KPI is
              development velocity rather than raw bill-of-materials cost. The enterprise OEM segment represents the
              fastest-growing volume tier: manufacturing operations managers and corporate procurement buyers integrate
              SendCutSend into repeat supply lines for brackets, enclosures, and equipment mounting hardware. Because
              SendCutSend enforces strict design-for-manufacturability guidelines and prohibits restricted weapons or
              hazardous components, corporate procurement teams can onboard the platform without lengthy supplier audit
              cycles.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Structural Growth Drivers, Adoption Constraints, and Diligence Realities
        blocks:
          - type: paragraph
            body: >-
              SendCutSend's commercial expansion is propelled by macro industrial tailwinds, notably the broader
              reshoring of American manufacturing and the generational retirement of skilled machinist labor. As
              regional job shops struggle with workforce shortages and lengthy quote backlogs, digital self-service
              platforms provide a vital release valve for domestic hardware developers. Automated computational geometry
              algorithms instantly evaluate cut tolerances, bend reliefs, and flange lengths, enabling continuous
              high-mix batch processing across facilities in Nevada, Kentucky, and Texas.


              Simultaneously, material adoption constraints govern the platform's ceiling. Primary friction points
              include capital intensity, material price volatility, and design boundaries. Fiber laser cutting systems
              require upwards of $1.3 million per unit, necessitating high asset utilization (exceeding 88% beam-on
              time) to sustain competitive pricing. Furthermore, parts requiring certified material test reports (MTRs),
              defense ITAR chain-of-custody documentation, or secondary welding and assembly operations often face
              limitations within an automated web-first workflow. Sizing estimates remain subject to uncertainty
              regarding what portion of enterprise spend can permanently migrate from negotiated vendor contracts to
              algorithmic buy-now transactions.
            claimRefs:
              - CM001
              - CM006
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Front-Office Bottleneck in Metal Fabrication
            body: >-
              Traditional custom metal fabrication is fundamentally an information-processing business masquerading as a
              machining business. While a fiber laser can cut complex sheet metal parts in seconds, typical contract
              shops require days of human engineering time to calculate material yields, inspect DXF drawings, and draft
              customer quotes. SendCutSend's core market disruption lies in automating this front-office transaction
              layer, transforming low-volume jobs that are unprofitable for traditional shops into high-velocity,
              high-margin standardized production.
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
          - type: callout
            title: Capital Intensity and High-Volume Cannibalization Risks
            body: >-
              As SendCutSend expands from quick-turn prototype batches into high-volume OEM production runs (10,000+
              units), it encounters structural market constraints. Serving large OEMs requires dedicated floor
              inventory, automated material-handling towers, and robotic welding lines, significantly raising capital
              expenditure. If high-quantity orders clog production flow, the platform risks degrading its core brand
              promise: ultra-fast 2-4 day turnarounds for long-tail engineering innovators.
            calloutType: risk
            claimRefs:
              - CM001
              - CM004
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Business Models
        blocks:
          - type: paragraph
            body: >
              The relevant landscape is broader than a list of online laser cutters. SendCutSend and OSH Cut are direct
              digital-fabrication peers; Xometry and Protolabs broaden the choice set through multi-process marketplace
              or hybrid-network models; Jiga and OpenSpindle sell supplier access and human-assisted sourcing; and local
              job shops remain the status-quo alternative [CP006, CP008, CP010, CP011, CP012, CP013]. Jiga, a
              competitor, calls OSH Cut the closest SendCutSend rival because both emphasize fast quoting, lead times,
              and sheet-metal fabrication [CP006]. OpenSpindle, also a competitor, describes SendCutSend as a single
              U.S. manufacturer rather than a network, which is strategically important: in-house execution can support
              a consistent self-service workflow, but it necessarily confines the catalog to owned equipment and
              approved materials [CP008, CP009]. IncFact's broad industry cohort is not a clean peer set and explicitly
              cautions that listed firms may not compete head-to-head or derive revenue from the same business lines
              [CP015].
            claimRefs:
              - CP006
              - CP008
              - CP010
              - CP011
              - CP012
              - CP013
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
