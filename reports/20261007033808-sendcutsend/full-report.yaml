      - number: '1.3'
        title: Commercial Scale, Milestone Evolution, and Diligence Realities
        blocks:
          - type: paragraph
            body: >-
              SendCutSend achieved a documented $100M revenue run-rate milestone in October 2025, supported by an 80%
              year-over-year expansion rate, 410 full-time employees, and customer diversification where no single
              client accounted for more than 0.59% of revenue [CO001, CO011]. By May 2026, the company reported
              cumulative fulfillment of over 30 million parts to more than 300,000 customers spanning hobbyists,
              robotics developers, and commercial aerospace programs [CO001, CO005]. Alongside aggressive physical
              expansion—committing $250M toward facility rollouts and $1B toward domestic manufacturing initiatives over
              five years—formal service terms impose strict disclaimers, limiting total manufacturer liability to the
              greater of $100 or fees paid in the prior twelve months and disclaiming fitness for particular purposes
              [CO005, CO012]. The milestone timeline illustrates the progression from back-warehouse origins to unicorn
              status while highlighting private audit data gaps [CO001, CO003, CO005, CO006].
