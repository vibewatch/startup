  - id: TV001
    title: Recommendation Summary
    columns:
      - Metric / Dimension
      - Assessment
      - Analytical Basis
      - Decision Implication
    rows:
      - - Recommendation
        - Track
        - Sustained high volume offset by unverified operating cash flow and high capital intensity
        - Do not commit growth equity at $1.01B headline mark until audited margins are disclosed
      - - Confidence Level
        - Medium
        - Primary confirmation of funding rounds and top-line claims, but private unit margins
        - Maintain active monitoring of private secondary marks and facility buildouts
      - - Risk Rating
        - High
        - High fixed-asset intensity, equipment financing debt, and customer prototype concentration
        - Require downside liquidation covenants and senior debt terms in diligence
      - - Valuation Stance
        - Stretched
