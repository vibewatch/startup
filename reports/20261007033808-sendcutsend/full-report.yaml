              - CV012
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV010
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Core Dilemma: Software Velocity vs Physical Capex'
            body: >-
              SendCutSend operates with impressive software-like customer acquisition economics and rapid delivery, but
              physical sheet metal cutting cannot escape equipment depreciation, facility overhead, and material price
              cycles. The May 2026 $1.01B valuation leaves narrow margin for execution error.
            calloutType: recommendation
            claimRefs:
