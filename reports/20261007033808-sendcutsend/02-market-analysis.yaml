callouts:
  - calloutType: "insight"
    title: "The Front-Office Bottleneck in Metal Fabrication"
    body: "Traditional custom metal fabrication is fundamentally an information-processing business masquerading as a machining business. While a fiber laser can cut complex sheet metal parts in seconds, typical contract shops require days of human engineering time to calculate material yields, inspect DXF drawings, and draft customer quotes. SendCutSend's core market disruption lies in automating this front-office transaction layer, transforming low-volume jobs that are unprofitable for traditional shops into high-velocity, high-margin standardized production."
    claimRefs:
      - "CM001"
      - "CM003"
  - calloutType: "risk"
    title: "Capital Intensity and High-Volume Cannibalization Risks"
    body: "As SendCutSend expands from quick-turn prototype batches into high-volume OEM production runs (10,000+ units), it encounters structural market constraints. Serving large OEMs requires dedicated floor inventory, automated material-handling towers, and robotic welding lines, significantly raising capital expenditure. If high-quantity orders clog production flow, the platform risks degrading its core brand promise: ultra-fast 2-4 day turnarounds for long-tail engineering innovators."
    claimRefs:
      - "CM001"
      - "CM004"
      - "CM013"
