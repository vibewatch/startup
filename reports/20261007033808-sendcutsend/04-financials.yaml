callouts:
  - calloutType: "insight"
    title: "Algorithmic Multi-Tenant Nesting Drives Production Margin Leverage"
    body: "SendCutSend's core economic moat is rooted in software automation rather than generic metal cutting. By aggregating orders from thousands of disparate customers onto unified material sheets, SendCutSend dramatically reduces scrap metal waste and setup machine downtime, unlocking high gross contribution margins on low-quantity custom jobs."
    claimRefs:
      - "CI005"
      - "CI008"
  - calloutType: "risk"
    title: "All-Inclusive Quoting Exposes Realized Margins to Commodity and Freight Volatility"
    body: "Because SendCutSend's list pricing includes material inputs, processing labor, and standard shipping fees, sudden spikes in sheet metal commodity indices (aluminum, stainless steel) or parcel delivery surcharges compress unit margins unless algorithmic quoting dynamically adjusts in real time."
    claimRefs:
      - "CI002"
      - "CI003"
