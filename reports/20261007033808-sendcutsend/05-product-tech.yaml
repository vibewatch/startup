callouts:
  - calloutType: "insight"
    title: "Software-First Differentiation in Physical Manufacturing"
    body: "SendCutSend's primary competitive moat is not simply owning laser cutters, but treating metal fabrication as an algorithmic software problem [CE005, CE007]. By combining automated DXF/STEP geometric intake with proprietary multi-tenant nesting algorithms, the platform eliminates upfront programming labor and setup waste, enabling one-off prototype pricing comparable to mass production [CE001, CE005]."
    claimRefs:
      - "CE001"
      - "CE005"
      - "CE007"
  - calloutType: "risk"
    title: "Absence of Drawing Callouts Limits Regulated Enterprise Penetration"
    body: "By explicitly refusing to reference PDF technical drawings, GD&T callouts, and manual documentation during production, SendCutSend streamlines throughput but restricts addressable market scope [CE009]. Enterprise aerospace, defense, and medical buyers requiring formal ballooned inspection drawings and traceable certs must rely on offline quoting or specialized traditional machine shops [CE008, CE009]."
    claimRefs:
      - "CE008"
      - "CE009"
