chapter:
  number: 5
  title: "Product & Technology"
  summary: "SendCutSend operates an on-demand custom metal fabrication platform that substitutes traditional manual quoting with instant CAD geometric preflight, automated multi-customer nesting, and dedicated domestic manufacturing cells. The system delivers 2D laser and waterjet sheet cutting, 3D CNC routing and milling, and post-processing across Reno, Paris, and Arlington, while relying on custom Rails-and-Vue application logic and strict file constraints rather than drawing markups."
sections:
  - id: "workflow-engine"
    title: "Instant Digital Quoting and File Intake Architecture"
    body: "SendCutSend defines its customer experience around frictionless, automated file ingestion that eliminates the days-long quoting delays typical of traditional job shops [CE001, CE006]. Customers upload 2D vector geometries (DXF, DWG, EPS, AI) or 3D solid models (STEP, STP) directly to the web portal [CE002, CE009]. The software engine performs instant preflight geometry validation, measuring boundary contours, pierce clearances, bend-line spans, hole-to-edge ratios, and internal cutouts against toolpath physics before order submission [CE001, CE003]. Traditional technical drawings, PDF callouts, and manual drafting markups are deliberately excluded from manufacturing workflows; fabrication runs exclusively from validated geometry vectors and customer-selected digital cart parameters [CE009]. If non-standard requirements emerge, jobs shift to a manual offline custom quote track, protecting high-velocity automated factory queues from human scheduling interruptions [CE009]."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE006"
      - "CE009"
    tableRefs:
      - "TE002"
  - id: "production-nesting"
    title: "Automated Nesting and Distributed Operating Stack"
    body: "The core algorithmic innovation developed by founder Jim Belosic and CTO Jacob Graham is automated multi-customer nesting [CE005]. Because single-part custom fabrication typically incurs prohibitive setup overhead and raw material scrap, SendCutSend's nesting software dynamically bundles hundreds of customer parts across disparate accounts onto standard raw material sheets [CE005]. This achieves high yield, lowers unit costs, and eliminates minimum order quantities [CE005, CE007]. The software platform coordinates operations across six facilities in Reno, Nevada, Paris, Kentucky, and Arlington, Texas [CE004, CE007]. The manufacturing layer integrates 13 high-power CNC fiber laser cutters alongside automated robotic milling machines, deploying 24/7 four-shift production rotations that achieve standard five-day turnaround and sub-48-hour expedited fulfillment [CE003, CE004, CE005, CE007]."
    claimRefs:
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE007"
    tableRefs:
      - "TE001"
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "governance-compliance"
    title: "Software Infrastructure, Technical Defensibility, and Operational Compliance"
    body: "The platform's software stack relies on Ruby on Rails application backends, relational database architectures, and Vue.js front-end interfaces engineered to process dense spatial order streams [CE003, CE004]. To maintain strict operational integrity, SendCutSend enforces comprehensive terms of service prohibiting the manufacture of weapon components, firearm receivers, illegal substances, and unverified critical flight assemblies [CE008]. While customer satisfaction remains strong across maker, commercial, and enterprise cohorts, third-party feedback reveals operational sensitivities: complex multi-bend tolerances occasionally require support remediation, and facility expansions face physical talent acquisition and labor-scaling bottlenecks [CE010, CE011]. Diligence must evaluate technical debt in custom geometric parsers and the absence of full drawing-callout support for mission-critical aerospace tolerances [CE012, CE013]."
    claimRefs:
      - "CE003"
      - "CE004"
      - "CE008"
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
