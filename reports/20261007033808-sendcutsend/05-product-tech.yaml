        - label: "Layer 2: Preflight Geometry Validation Engine"
          detail: "Algorithmic parsers inspecting DXF and STEP geometry for cut profiles, minimum bend flanges, hole clearances, and material rules."
        - label: "Layer 3: Algorithmic Multi-Customer Nesting"
          detail: "Core optimization system packing hundreds of discrete customer parts onto common raw metal sheets to minimize waste."
        - label: "Layer 4: Distributed Factory Coordination System"
          detail: "Relational database and job scheduling services routing cut files across six facilities in Reno, Paris, and Arlington."
        - label: "Layer 5: CNC Hardware and Automated Machining Fleet"
          detail: "13 industrial fiber lasers ($1.3M each), robotic milling centers ($1M each), waterjets, press brakes, and finishing shops."
        - label: "Layer 6: Logistics, Packaging, and Parcel Dispatch"
          detail: "Quality inspection, protective kitting, custom packaging, and nationwide ground shipping achieving 91% 5-day delivery."
