              平台软件栈依托 Ruby on Rails 应用后端、关系型数据库架构和 Vue.js 前端界面，专门处理密集的空间订单流 [CE003, CE004]。为保持严格的运营完整性，SendCutSend
              执行全面服务条款，禁止制造武器部件、枪械机匣、非法物质和未经验证的关键飞行组件 [CE008]。创客、商业
