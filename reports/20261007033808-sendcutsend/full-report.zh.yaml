      - number: '7.2'
        title: 法律、监管与知识产权敞口
        blocks:
          - type: paragraph
            body: >-
              就法律、监管和知识产权而言，SendCutSend 执行严格的服务条款和上传政策，旨在隔离平台的下游责任。客户保留所提交 CAD 几何图形的全部
              所有权和法律责任，并确认设计不侵犯知识产权、不违反地方或联邦法规，也不触犯武器相关禁令。若发现被禁止的武器部件、非法用具或侵权设计，公司明确保留单方面取消订单、拒绝零件或终止用户账户的裁量权。


              但 SendCutSend 明确否认适销性、特定用途适用性和不侵权的所有默示保证，将制造零件的合同责任限制为已付价格或 $100。对于独立设计师
              分发零件的市场交易，公司要求出具认证，确认产品不会用于车辆结构部件、失效保护环境或危险的关键任务应用。SendCutSend 服务于商用航空
              航天、机器人和国防客户，而这些客户会把切割零件装入飞行硬件和实体系统，因此平台免责声明与下游现场责任之间的法律脱节，是机构投资者持续尽调时必须考虑的问题。公开监管数据库没有显示正在执行的执法行动，但 AS9100
              或 ISO 9001 等质量审计认证未公开披露，正式合规仍只能靠私人尽调验证。
            claimRefs:
              - CR005
              - CR006
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR007
              - CR008
      - number: '7.3'
        title: 合作伙伴、物流与执行依赖
        blocks:
          - type: paragraph
            body: >-
              SendCutSend 的速度优势和低成本获客高度依赖相互连接的外部伙伴和关键运营节点。整个客户价值主张就是快速完成下单到交付，因此第三方包裹物流承运商（如 UPS、FedEx
              和邮政承运商）成为重要瓶颈。SendCutSend 通过自动套料和全天候机器排程控制内部制造交付，
              但运输延迟、包裹丢失或区域物流中断仍超出工厂直接控制范围。根据公司条款，货物交给承运商后所有权和损失风险转移给客户，但客户满意度仍与准时到达密不可分。


              设备融资和原材料分销是次一级的关键依赖。采购工业光纤激光系统、机器人折弯机和 CNC 铣削中心，需要大量设备债务和持续再投资。铝、钢、
              钛和铜的商品价格波动会通过实时报价调整传导给终端用户，但突然的区域供应约束或钢厂短缺可能拉长交付周期。此外，漏斗顶端获客依赖
              在线数字渠道、促销代码，以及汽车、创客和专业创客社区中的创作者口碑推荐。要在数十万笔客户订单中保持品牌完整性和执行可靠性，需要在所有运营地点持续校准机器、严格质控并保持最低废料率。
            claimRefs:
              - CR009
              - CR010
              - CR013
              - CR014
              - CR015
              - CR016
