      - number: '3.3'
        title: 转换、信任与分销
        blocks:
          - type: paragraph
            body: >
              现有证据不能证明专有文件锁定、排他性供应接入或经测量的客户转换成本。相反，竞争对比页面按工作类型安排替代方案：专注平板零件、更厚材料、广泛多工艺工作、超大零件或完整物料清单 [CP006, CP009,
              CP010, CP012]。这使项目层面的多平台使用变得合理，但仍只是推断，不是经过测量的留存结果。SendCutSend 自有证言显示，速度、便利性以及取消最低订单和开机准备摩擦，可能让它成为偏好的工作流；
              但这些证言无法证明代表性满意度或转换阻力 [CP013]。信任也有合同边界：SendCutSend 条款把设计质量、材料选择、合法性和适用性责任放在客户身上，公司只保证在工艺限制内基本符合提交的设计
              [CP014]。因此，企业尽调需要真实的质量、认证、损耗率和重复购买证据，不能只看营销说法。
            claimRefs:
              - CP006
              - CP009
              - CP010
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >
              SendCutSend 的防御力更适合定义为执行规模加再投资，而不是独特功能集合。公司称截至 2026 年 5 月已向超过 300,000 名客户发运 3,000 万以上零件，并宣布新增超过 $250M
              资本用于扩建设施和增加制造枢纽 [CP004,
              CP005]。这些数字说明了运营规模，以及扩大能力、降低价格、加快生产的意图，但都来自公司自身，无法显示利用率、单位经济学或服务水平表现。竞争压力来自两面：专注型加工厂可 攻击厚度、DFM
              或几何覆盖缺口，网络平台则能吸收更多工艺和完整 BOM 工作 [CP007, CP009, CP010, CP011, CP012]。因此，基于证据的定位图把报价即时性和工艺广度视为序数维度，而不是测量维度
              [CP016]。护城河能否持久，取决于计划产能提升价格和可靠性的速度是否快于直接同业复制数字工作流、相邻平台改善执行。
            claimRefs:
              - CP004
              - CP005
              - CP007
              - CP009
              - CP010
              - CP011
              - CP012
              - CP016
