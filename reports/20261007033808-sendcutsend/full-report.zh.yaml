  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 即时数字报价与文件接收架构
        blocks:
          - type: paragraph
            body: >-
              SendCutSend 围绕无摩擦、自动化文件接收打造客户体验，消除了传统加工厂常见的数天报价延迟 [CE001, CE006]。客户可直接在网页门户上传 2D 矢量几何（DXF、DWG、EPS、AI）或 3D
              实体模型（STEP、STP）[CE002, CE009]。下单前，软件引擎即时执行几何预检，依据刀具路径物理条件测量边界轮廓、穿刺间隙、折弯线跨度、孔边比和内部切口 [CE001,
              CE003]。传统技术图纸、PDF 标注和人工制图批注被明确排除在制造流程外；生产完全依据经过验证的几何矢量和客户选择的数字购物车参数执行 [CE009]。若出现非标准要求，订单会转入线下人工定制报价
              路径，避免人工排程打断高速自动化工厂队列 [CE009]。
