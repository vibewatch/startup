            body: >-
              SendCutSend 从 2018 年成立到 2026 年初基本依靠自有资金发展，资金来源包括经营利润、奠基性的 $6M 亲友轮融资，以及与 JPMorgan Chase 的活跃银行和信贷合作。2026 年 5
              月，公司完成首轮大型机构融资，获得 $110M 新股权资本，由 Sequoia Capital 和 Paradigm 共同领投，Stripe 联合创始人 Patrick 和 John Collison
              也参与其中，估值里程碑达到 $1.01B。公司承诺五年计划，向设施扩建和设备枢纽投入超过 $250M。尽管公司公开声称年收入为 $200M，第三方数据库给出的收入估算却相互冲突且差异极大，从 $7.1M 到
