  - id: TV001
    title: 建议摘要
    columns:
      - 指标 / 维度
      - 评估
      - 分析依据
      - 决策含义
    rows:
      - - 建议
        - 跟踪
        - 销量持续走高，但未经验证的经营现金流和高资本密度构成抵消
        - 在披露经审计利润率前，不要按 $1.01B 的账面估值投入成长股权
      - - 信心水平
        - 中
        - 融资轮次和收入规模主张有一手确认，但私人单位利润率未知
        - 持续监测私人二级市场估值和设施扩建情况
      - - 风险评级
        - 高
        - 固定资产密度高、设备融资债务高，客户又集中在原型业务
        - 尽调时要求提供下行情景清算契约和高级债务条款
      - - 估值立场
        - 偏高
        - $200M 运行率收入对应 5.0 倍收入倍数，相当于按软件级别给实体制造扩张定价
        - 寻求更接近收入 3.0–3.5 倍的入场估值，留出安全边际
    notes: 评估基于 2026 年 5 月 $110M 融资轮（投后估值 $1.01B）以及据报道 $200M 的收入运行率。
    claimRefs:
      - CV007
      - CV008
      - CV010
      - CV013
      - CV014
  - id: TV002
    title: 投资论点与反论点
    columns:
      - 维度
      - 论点（正向驱动）
      - 反论点（下行风险）
      - 哪些变化会改变判断
    rows:
      - - 市场地位
        - 占主导地位的自助即时报价平台，客户超过 300,000 名
        - 客户群偏向小批量和原型订单，流失风险较高
        - 证明拥有高留存率的多年期企业生产合同
      - - 单位经济模型
        - 在标准板材上用算法为多家客户排样，提高材料利用率
        - 13+ 台光纤激光器和 CNC 铣床的高额资本支出限制自由现金流
        - 经审计确认毛利率超过 45%，且经营现金流持续为正
      - - 技术护城河
        - 专有自动报价和制造工作流把交付时间压缩至 24 小时
        - 下游组装和后处理带来人工瓶颈风险
        - 证明所有枢纽都部署了自动检查和机器人搬运材料
      - - 合同条款
        - 无摩擦线上下单，降低销售摩擦和法律开销
        - 服务条款严格将责任限定为 $100 或费用中较高者，并免除保证责任
        - 采用带标准商业保修保护的企业级主服务协议
    notes: 综合比较运营披露、商业条款和独立行业分析。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV006
      - CV011
  - id: TV003
    title: 情景估值分析
    columns:
      - 情景
      - 预测收入
      - 假设 EV / 收入倍数
      - 隐含企业价值
      - 概率信号
      - 关键触发因素与假设
    rows:
      - - 乐观情景
        - $350M
        - 6.0x
        - $2,100M
        - 20%
        - 企业生产端快速采用、国防 / 航空航天资质认证、毛利率高于 50%
      - - 基准情景
        - $260M
        - 4.0x
        - $1,040M
        - 55%
        - 有机增长持续 30%、区域设施利用率稳定、自由现金流小幅产生
      - - 悲观情景
        - $180M
        - 2.0x
        - $360M
        - 25%
        - 工业放缓、客户流失且订单回流本地机加工厂、设备债务偿付承压
    notes: 预测以 2026 年 $200M 运行率为基线，展望未来 12 至 24 个月。
    claimRefs:
      - CV008
      - CV010
      - CV012
      - CV015
      - CV016
figures:
  - id: FO001
    title: SendCutSend 公司与运营里程碑时间线
    type: timeline
    summary: 按时间顺序展示 SendCutSend 从 Reno 的初始仓储运营，到全国制造网络和独角兽融资的发展历程。
    data:
      items:
        - date: 2018-11
          label: 公司创立与首笔商业订单
          detail: Jim Belosic 出售软件创业公司 ShortStack，创办 SendCutSend，并接到第一笔在线订单——匹克球拍钥匙扣。
          tone: positive
        - date: 2019-05
          label: 商业品牌客户导入
          detail: 企业和商业制造账户开始与业余爱好者客户一起进入线上作业队列。
          tone: positive
        - date: 2022-09
          label: 种子资本缓冲
          detail: 从 Sandy Kory 和 Mark Sugarman 处获得规模适中的亲友资本缓冲（种子轮分批合计 $6M）。
          tone: neutral
        - date: 2023-06
          label: 多设施区域扩张
          detail: 在 Paris（Kentucky）和 Arlington（Texas）设立 50,000 平方英尺生产枢纽，提供快速区域配送。
          tone: positive
        - date: 2025-10
          label: 年收入 $100M 里程碑
          detail: 年收入运行率突破 $100M，同时保持收入同比增长 80%，全职员工 410 人。
          tone: positive
        - date: 2026-01
          label: 精加工与 CNC 产线启动
          detail: Reno 运营扩展至新增 20,000 平方英尺设施，用于阳极氧化、粉末喷涂和机器人 CNC 铣削产线。
          tone: positive
        - date: 2026-05
          label: $110M A 轮融资与独角兽估值
          detail: Sequoia、Paradigm 和 Collison 兄弟领投 $110M，投后估值 $1.01B。
          tone: positive
        - date: 2026-06
          label: 标准服务条款责任上限
          detail: 更新正式条款，将总责任上限设为 $100 或过去 12 个月费用中较高者，并排除产品质保责任。
          tone: warning
    approximationNotes: 日期反映经核实的公开公告、地方报道里程碑和正式公司申报文件。
    claimRefs:
      - CO001
      - CO003
      - CO005
      - CO006
      - CO011
      - CO012
  - id: FM001
    title: 市场规模层级与可触达支出金字塔
    type: pyramid
    summary: 以视觉层级展示市场规模，从北美金属制造总市场逐层缩小至 SendCutSend 核心的网页优先可获取市场。
    data:
      items:
        - label: 北美合同制造（TAM）
          value: 50000
          unit: USD Millions
          detail: 覆盖区域性合同金属制造、CNC 加工和结构金属工程的广义市场。
        - label: 按需快速制造与原型制作（SAM）
          value: 6000
          unit: USD Millions
          detail: 面向商业和研发买家的快速周转钣金切割、折弯和轻型机加工。
        - label: 高混合钣金与板材加工子市场
          value: 2500
          unit: USD Millions
          detail: 国内自动化切割中心可服务的精密钣金和板材成形市场。
        - label: 网页优先的算法化国内制造（SOM）
          value: 850
          unit: USD Millions
          detail: 自助即时报价的板材切割与成形，2 至 4 个工作日交付。
        - label: SendCutSend 当前运营规模
          value: 150
          unit: USD Millions
          detail: 年化收入运行率超过 $150M，客户超过 150k，已发运零件超过 30M。
        - label: 近期高产量 OEM 扩张层
          value: 75
          unit: USD Millions
          detail: 面向多设施生产批次和看板补货量。
    approximationNotes: TAM 和 SAM 数值代表工业制造基准的中点估计；SOM 和运营运行率反映公司披露。
    claimRefs:
      - CM001
      - CM005
      - CM006
      - CM007
  - id: FP001
    title: “流程广度 vs. 报价即时性”序位定位
    type: quadrant
    summary: 以方向性方式呈现保留来源对运营模式的描述；分数是序位分析定位，不是实测表现。
    xAxis: 流程广度：聚焦至广泛
    yAxis: 报价即时性：人工审核至即时
    data:
      points:
        - label: SendCutSend
          x: 2
          'y': 5
          detail: 内部流程聚焦，提供即时自助定价。
        - label: OSH Cut
          x: 2
          'y': 5
          detail: 聚焦钣金的同业，提供即时自动排样定价。
        - label: Xometry
          x: 5
          'y': 5
          detail: 保留来源中覆盖最广的即时市场平台。
        - label: Jiga
          x: 5
          'y': 2
          detail: 供应商网络广泛，报价经过审核而非即时生成。
        - label: Protolabs
          x: 5
          'y': 4
          detail: 快速制造目录广泛；此处未量化确切报价时长。
        - label: OpenSpindle
          x: 5
          'y': 1
          detail: 覆盖任意工艺的人工撮合采购，报价周期约 48 小时。
    approximationNotes: 序位 1–5 分数仅编码指定来源中的描述；它们不是质量、价格、交付周期或市场份额的测量值。
    claimRefs:
      - CP016
  - id: FI001
    title: SendCutSend 从商业订单到毛利率的运营流程
    type: flow
    summary: 按顺序展示客户上传 CAD 后，经自动排样、工厂制造和收款，最终体现为毛利率的过程。
    data:
      nodes:
        - label: 客户网页 CAD 上传与算法即时报价
        - label: 通过信用卡或 PayPal 收取预付款
        - label: 自动多客户板材排样引擎
        - label: 全天候设施切割与机器人 CNC 加工
        - label: 内部后处理、去毛刺与精加工
        - label: 直连包裹物流与毛利率实现
    approximationNotes: 根据公开服务条款和制造设施报告，展示运营与商业履约架构。
    claimRefs:
      - CI001
      - CI002
      - CI005
      - CI006
  - id: FE001
    title: SendCutSend 端到端技术与实体制造栈
    type: stack
    summary: 展示从基于浏览器的 CAD 接入，到多设施 CNC 实体执行的技术架构演进。
    data:
      layers:
        - label: 第 1 层：数字呈现与文件接入
          detail: 运行 Vue.js 和 WebGL 的网页应用门户，用于即时文件接入、零件预览和购物车配置。
        - label: 第 2 层：几何预检验证引擎
          detail: 算法解析器检查 DXF 和 STEP 几何形状的切割轮廓、最小折弯翼边、孔间隙和材料规则。
        - label: 第 3 层：算法化多客户排样
          detail: 核心优化系统将数百个独立客户零件排布在共用原料金属板上，以减少浪费。
        - label: 第 4 层：分布式工厂协调系统
          detail: 关系数据库和作业调度服务，将切割文件分发至 Reno、Paris 和 Arlington 的六座设施。
        - label: 第 5 层：CNC 硬件与自动化加工设备群
          detail: 13 台工业光纤激光器（每台 $1.3M）、机器人铣削中心（每台 $1M）、水刀、折弯机和精加工车间组成的设备群。
        - label: 第 6 层：物流、包装与包裹发运
          detail: 质量检查、防护套件、定制包装和全国地面运输，5 天交付率达到 91%。
    approximationNotes: 层级拆解综合了工程招聘说明、创始人访谈和平台文档。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE007
  - id: FU001
    title: 基于证据的客户采用与扩张旅程
    type: journey-map
    summary: 公开证据支持从自助试用到重复使用和生产使用的路径，但没有量化各阶段之间的转化率或留存率。
    data:
      nodes:
        - id: account
          label: 账户与设计提交
          detail: 条款要求客户先注册账户，才能上传设计或下单。
          touchpoints:
            - Account creation
            - Design upload
        - id: quote
          label: 自助报价与首笔订单
          detail: 公司将即时报价和小批量采购定位为入口。
          touchpoints:
            - Instant quote
            - Single prototype
        - id: validation
          label: 交付与质量验证
          detail: 客户证言强调交付速度、切割质量和可预测报价。
          touchpoints:
            - Part receipt
            - Fit and quality check
        - id: repeat
          label: 重复项目使用
          detail: 已点名用户描述了多年来的常规订单，或在几乎所有项目中使用该服务。
          touchpoints:
            - Saved workflow
            - New project orders
        - id: production
          label: 生产量扩张
          detail: 公司证据描述业务从原型订单扩展到数千件或数万件的订单。
          touchpoints:
            - Higher quantities
            - Broader processing
        - id: enterprise
          label: 企业采购
          detail: 公司声称有《财富》500 强客户使用，但合同期限、集中度和续约证据仍属非公开信息。
          touchpoints:
            - Procurement review
            - Recurring program demand
    approximationNotes: 各阶段是定性综合；没有来源提供转化率、阶段规模或扩张耗时。
