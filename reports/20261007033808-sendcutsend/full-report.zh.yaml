  - id: FR001
    title: 风险严重性与可能性评估
    type: matrix
    summary: 交叉列示按可能性和剩余业务影响映射的关键运营、财务和法律风险。
    data:
      columns:
        - id: impact-catastrophic
          label: 灾难性影响
        - id: impact-critical
          label: 关键影响
        - id: impact-high
          label: 高影响
        - id: impact-moderate
          label: 中等影响
        - id: impact-low
          label: 低影响
        - id: impact-negligible
          label: 可忽略影响
      rows:
        - id: likelihood-high
          label: 高可能性
          values:
            - colId: impact-catastrophic
              value: Fixed asset depreciation burden during severe industrial slowdown
            - colId: impact-critical
              value: Fixed asset cost leverage during demand contraction
            - colId: impact-high
              value: Customer leakage on non-sheet complex geometries
            - colId: impact-moderate
              value: Promotional coupon fraud and margin dilution
            - colId: impact-low
              value: Temporary website layout or styling bug
            - colId: impact-negligible
              value: Minor template typo without quoting impact
        - id: likelihood-medium
          label: 中等可能性
          values:
            - colId: impact-catastrophic
              value: Comprehensive nationwide credit freeze halting capital equipment delivery
            - colId: impact-critical
              value: Equipment financing constraints during expansion
            - colId: impact-high
              value: Parcel delivery logistics bottlenecks
            - colId: impact-moderate
              value: Raw material price volatility and pass-through lag
            - colId: impact-low
              value: Single-machine calibration drift during shift change
            - colId: impact-negligible
              value: Packaging label printing delay
        - id: likelihood-low
          label: 低可能性
          values:
            - colId: impact-catastrophic
              value: Major multi-jurisdiction product liability judgment
            - colId: impact-critical
              value: Mission-critical downstream product liability claims
            - colId: impact-high
              value: Catastrophic multi-facility equipment downtime
            - colId: impact-moderate
              value: Customer design copyright and IP disputes
            - colId: impact-low
              value: Unsubstantiated customer complaint on social channels
            - colId: impact-negligible
              value: Minor color variation in non-anodized mill finish
        - id: likelihood-unlikely
          label: 不太可能
          values:
            - colId: impact-catastrophic
              value: Complete systemic failure of proprietary nesting software
            - colId: impact-critical
              value: Total supply chain embargo on domestic sheet metal
            - colId: impact-high
              value: Simultaneous multi-hub facility lease cancellation
            - colId: impact-moderate
              value: Localized power outage extending past backup duration
            - colId: impact-low
              value: Minor consumable delivery delay
            - colId: impact-negligible
              value: Transient portal login glitch
        - id: likelihood-rare
          label: 罕见
          values:
            - colId: impact-catastrophic
              value: Uninsured catastrophic facility destruction across multiple states
            - colId: impact-critical
              value: Coordinated multi-facility labor walkout
            - colId: impact-high
              value: Immediate nationwide regulatory ban on rapid sheet metal fabrication
            - colId: impact-moderate
              value: Widespread material distributor bankruptcy
            - colId: impact-low
              value: Discontinuation of specialized CAD file export format
            - colId: impact-negligible
              value: Non-critical internal documentation error
        - id: likelihood-remote
          label: 极低可能
          values:
            - colId: impact-catastrophic
              value: Fundamental global obsolescence of sheet metal fabrication
            - colId: impact-critical
              value: Sovereign nationalization of private industrial equipment
            - colId: impact-high
              value: Total permanent collapse of North American parcel shipping networks
            - colId: impact-moderate
              value: Blanket prohibition of online digital quoting
            - colId: impact-low
              value: Universal customer abandonment of rapid prototyping
            - colId: impact-negligible
              value: Deprecation of legacy email notification service
    approximationNotes: 严重程度和可能性分类是分析师基于公开服务条款、运营披露和竞争基准分析综合得出的定性判断。
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
  - id: FV001
    title: 估值与建议决策流程
    type: flow
    summary: 从运营规模逐步推导出投资立场的分析路径。
    data:
      nodes:
        - id: node-scale
          label: 商业规模：300K 客户对应 $200M 年化收入
          tone: positive
        - id: node-efficiency
          label: 自动报价与算法排版套料软件
          tone: positive
        - id: node-capital
          label: 资本密集度：$250M+ 设施规划与固定资产资本开支
          tone: neutral
        - id: node-terms
          label: 合同摩擦：严格的 $100 责任上限与明确排除的保证责任
          tone: risk
        - id: node-valuation
          label: 估值：投后估值 $1.01B（5.0x 年化收入倍数）
          tone: neutral
        - id: node-recommendation
          label: 投资立场：等待经审计财务数据，持续跟踪
          tone: neutral
      edges:
        - from: node-scale
          to: node-efficiency
          label: 由软件逻辑驱动
        - from: node-efficiency
          to: node-capital
          label: 推动实体产能扩张
        - from: node-capital
          to: node-terms
          label: 支撑生产模式
        - from: node-terms
          to: node-valuation
          label: 界定风险调整后倍数
        - from: node-valuation
          to: node-recommendation
          label: 决定最终立场
    approximationNotes: 该流程图展示尽调关键维度之间的定性关系。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV007
      - CV010
      - CV014
