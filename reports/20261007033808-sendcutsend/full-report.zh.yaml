        title: 资本结构、估值与融资轨迹
        blocks:
          - type: paragraph
            body: >-
              从 2018 年成立到 2026 年初，SendCutSend 主要靠经营现金流再投资扩张，并完成了约 $6M 的小规模亲友融资，天使投资人 Sandy Kory 和 Mark Sugarman 参与其中
              [CO003, CO006]。2026 年 5 月 19 日，SendCutSend 完成 $110M A 轮机构融资，由 Sequoia Capital（Andrew Reed、Shaun
              Maguire）、Paradigm（Matt Wong、Matt Huang）以及 Stripe 创始人 Patrick Collison 和 John Collison 共同领投，投后估值达到 $1.01B
              [CO003, CO004, CO006]。Forge Global 的二级市场信息显示，继 2022 年 9 月定价的种子轮分批融资和每股 $50.53 定价的 A 轮后，公司累计股权融资约为 $116.17M
              [CO006]。公司与 JPMorgan Chase 保持商业债务安排，为资本密集型设备采购融资，但详细债务契约、授信额度和经审计财务报表仍属非公开信息 [CO001, CO010]。
