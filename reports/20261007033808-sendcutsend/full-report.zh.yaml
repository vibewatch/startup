  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险分类与严重程度评估
        blocks:
          - type: paragraph
            body: >-
              SendCutSend 的核心商业模式把专有软件驱动的套料和报价与沉重的实体制造基础设施结合起来。公司运营高吞吐制造枢纽，全天候轮班生产定制钣金和 CNC
              机加工零件。这种垂直整合结构能带来快速交付——通常在两到三天内交货且没有最低订单门槛——但也引入了显著的运营、资本和合作伙伴依赖。


              首要运营风险来自自有产能资产杠杆。与 Xometry 这类轻资产制造经纪商或数字市场不同，后者能把需求动态分配给数千家独立加工厂， SendCutSend
              直接承担设备融资、实体设施租赁、维护周期和工厂人工的全部负担。公司已宣布激进的资本开支计划，其中包括作为更广泛的 $1B 工业承诺的一部分，投入超过 $250M
              扩建设施和新的区域制造枢纽。当交易量波动或经济需求走弱时，实体机器、设施租赁和熟练劳动力的固定成本无法像软件成本那样灵活削减，会直接挤压利润率。


              此外，SendCutSend 的专门生产边界划出了明确的市场范围。独立技术对比显示，SendCutSend 专门优化平板钣金切割、CNC 路由、折弯和简单
              二次表面处理；而涉及复杂五轴铣削、微加工、注塑或增材制造的多工艺需求，则需要外部经纪平台。这种基于边界的专业化限制了企业账户整合，但保留了高速原型和钣金加工中的快速执行能力。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR007
              - CR008
