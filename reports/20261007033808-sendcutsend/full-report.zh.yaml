chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、运营模式与治理
        blocks:
          - type: paragraph
            body: >-
              SendCutSend Inc. 于 2018 年在内华达州里诺成立，是一家把定制软件自动化与实体金属制造结合起来的按需精密制造平台 [CO001]。平台覆盖 200
              多种材料，提供自动报价、板材套料、激光切割、CNC 路由、水刀切割、折弯和专业金属表面处理服务 [CO001, CO002]。公司在多个设施中全天候运营，包括里诺 Longley Lane
              枢纽、Paris（肯塔基州）和 Arlington（德州）。它依靠联合创始人兼 CTO Jacob Graham 开发的专有套料软件，把数百份不同客户的切割文件合并到同一张材料板上 [CO001, CO007,
              CO008]。这种批量套料大幅减少开机准备浪费，让单件定制零件也能以合理成本生产 [CO001, CO008]。联合创始人兼 CEO Jim Belosic 和总裁 Erin Belosic 仍掌握运营与治理，
              但随着业务在全国扩张，对高管领导层和核心软件架构的关键人物依赖仍然显著 [CO007, CO009]。
            claimRefs:
