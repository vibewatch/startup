        blocks:
          - type: paragraph
            body: >
              客户旅程可以沿两个轴扩展：提高订单数量和扩大工艺使用。SendCutSend 称自己既支持单个原型，也支持数万件生产零件；客户证言则描述了从单个支架到复杂组件和重复生产的升级。Jirav
              案例研究称，管理层用平均订单金额、产品数量和产品类型建立客户细分模型，这些都是交叉销售和钱包份额扩大的相关信号。但没有任何留存来源披露 NRR、GRR、流失率、续约、合同期限、客户集中度或渠道依赖。


              客户条款带来实际摩擦。订单进入生产后通常不能取消，退货和退款逐案决定，价格可能随原材料和商品价格变化，服务范围仅限美国和加拿大。
              条款还把设计适用性和合法使用责任交给客户，并提供有限的产品保证。这些规定可能是定制制造的行业标准，但现有证据没有显示它们多常影响转化、争议或企业采购。
            claimRefs:
              - CU004
              - CU009
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
