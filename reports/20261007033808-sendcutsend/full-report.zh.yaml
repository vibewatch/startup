  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、变现架构与定价结构
        blocks:
          - type: paragraph
            body: >-
              SendCutSend 经营按需、软件自动化的快速定制制造业务，通过交易型数字订单履约变现。数字平台展示的标准工单价格是全包价，包含原材料、切割和机加工人工、去毛刺以及标准包裹运输。客户可直接上传网页 CAD
              或使用参数化模板配置零件，接收算法即时报价，从而绕过传统加工厂的人工估价排队。交易型标价完全公开，但实际平均订单金额、定制工单附加费和批量折扣层级会临时协商，或对外部投资判断不透明。平台还
              提供可选择加入的设计师市场，由独立创作者设定成品价格；客户退货窗口关闭后 60 天内向创作者付款，同时 SendCutSend 抽取固定比例的生产加价。
            claimRefs:
