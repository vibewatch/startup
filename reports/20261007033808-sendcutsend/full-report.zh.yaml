      - number: '2.4'
        title: 结构性增长驱动、采用约束与尽调现实
        blocks:
          - type: paragraph
            body: >-
              SendCutSend 的商业扩张受宏观工业顺风推动，尤其是美国制造业回流以及熟练机加工劳动力代际退休。区域加工厂面临人手短缺和报价积压时，
              数字自助平台为美国本土硬件开发者提供了重要泄压阀。自动计算几何算法可即时评估切割公差、折弯避空和法兰长度，让内华达、肯塔基和德州的设施持续处理高混合批次。


              同时，材料与应用约束决定了平台的上限。主要摩擦包括资本密集、材料价格波动和设计边界。光纤激光切割系统每台需要超过 $1.3M，因而必须保持很高的设备利用率（光束开启时间超过
              88%）才能维持有竞争力的价格。此外，需要经认证的材料测试报告（MTR）、国防 ITAR 保管链文件，或二次焊接和装配的零件，在以网页为先的自动化流程中往往受限。规模估算仍有不确定性：企业支出中究竟有多少能永久从
              协商式供应商合同迁移到算法驱动的即时购买。
            claimRefs:
              - CM001
              - CM006
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 金属加工的前台瓶颈
            body: >-
              传统定制金属加工本质上是披着机加工外衣的信息处理生意。光纤激光几秒就能切出复杂钣金件，但普通合同加工厂仍要花数天人工工程时间计算材料利用率、检查 DXF 图纸并拟写客户报价。SendCutSend
              的核心颠覆在于自动化这一前台交易层，把传统加工厂做不赚钱的小批量订单变成高速、高毛利的标准化生产。
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
          - type: callout
            title: 资本密集与大批量订单的蚕食风险
            body: >-
              SendCutSend 从快速交付原型批次扩展到大批量 OEM 生产（10,000+ 件）时，会遇到结构性市场约束。服务大型 OEM 需要专用车间库存、自动化
              物料处理塔和机器人焊接线，显著推高资本开支。如果大批量订单堵塞生产流程，平台就可能损害其对长尾工程创新者的核心承诺：2-4 天超快交付。
            calloutType: risk
            claimRefs:
              - CM001
              - CM004
              - CM013
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与商业模式
        blocks:
          - type: paragraph
            body: >
              竞争格局不只是在线激光切割平台的名单。SendCutSend 和 OSH Cut 是直接的数字制造同业；Xometry 和 Protolabs 通过多工艺市场或混合网络模式扩大选择；Jiga 和
              OpenSpindle 提供供应商接入与人工辅助采购；本地加工厂仍是现状替代方案 [CP006, CP008, CP010, CP011, CP012, CP013]。竞争对手 Jiga 认为 OSH Cut
              是最接近 SendCutSend 的对手，因为两者都强调快速报价、交付周期和钣金加工 [CP006]。另一竞争对手 OpenSpindle 将 SendCutSend
              描述为单一美国制造商，而非网络，这一点具有战略意义：内部执行能支持一致的自助工作流，但也必然把目录限制在自有设备和获批材料内 [CP008, CP009]。IncFact
              的广泛行业样本并不是干净的同业集合，并明确提醒，列出的公司可能不会正面竞争，也可能不从相同业务线获得收入 [CP015]。
            claimRefs:
              - CP006
              - CP008
              - CP010
              - CP011
              - CP012
              - CP013
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP004
              - CP006
              - CP008
              - CP010
              - CP011
              - CP012
              - CP013
              - CP015
      - number: '3.2'
        title: 能力与商业取舍
        blocks:
          - type: paragraph
            body: >
              SendCutSend 最强的公开定位是一种窄而清晰的购买体验：标准价格在线列出，条款说明价格包含材料、人工和运输；定价页面还向月度订单达 $1,000 或年购 5,000
              件的客户提供批发接入，并向预先合格客户提供 Net 30 或 Net 60 账期 [CP001, CP002, CP003]。这一组合直接攻击人工报价和开机准备摩擦，但与本地加工厂的对比来自
              SendCutSend 选择并发布的客户证言，而非独立基准 [CP013]。直接和相邻竞争者让选择更复杂：据报道 OSH Cut 支持更厚材料和额外人工 DFM 审查；Xometry
              覆盖更多可即时报价的工艺；Protolabs 工艺更广但据报价格更高；Jiga 或 OpenSpindle 则用供应商选择和人工审查替代即时结账 [CP006, CP007, CP010, CP011,
              CP012]。公开来源没有提供标准化的同零件报价，因此不能宣布任何供应商在所有订单上都是价格领先者。
