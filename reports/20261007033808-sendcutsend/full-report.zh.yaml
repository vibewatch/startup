      - number: '7.4'
        title: 展示
        blocks:
          - type: callout
            title: 资本密集度对比数字化估值倍数
            body: >-
              与边际扩张成本近乎为零的软件业务不同，SendCutSend 的快速制造模式需要持续再投资实体机器、设施租赁和熟练劳动力。既然已有超过 $250M
              用于设施扩张，估值倍数就必须计入有形固定成本、设备折旧和周期性需求波动，而不能套用纯软件经济学。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: 专业化护城河与几何边界
            body: >-
              SendCutSend 的自动报价和快速履约，为平板切割和成形钣金件提供难以匹敌的速度护城河。但相较 Xometry 等支持复杂多轴 CNC 铣削、成型
              和铸造的广泛制造网络，公司面临结构性的几何边界。要留住企业账户，要么持续扩展服务线，要么与更广泛的制造平台共存。
            calloutType: insight
            claimRefs:
              - CR003
              - CR004
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              SendCutSend 的核心投资论点建立在其专有的网页到工厂自动化引擎上：它把定制金属加工变成类似软件的按需购买体验。公司用即时 CAD 报价和
              自动板材套料取代传统人工竞价周期，已在航空航天、国防、机器人和商用硬件领域吸引超过 300,000 名客户，生产超过 3,000 万个零件。
              但反论点强调了高吞吐定制制造固有的实体约束和资本密集度。扩大工厂版图需要持续投入数百万美元采购先进光纤激光器和 CNC 机器，而公司
              公开条款明确否认保证并限制总责任，说明其暴露于以原型为主的长尾订单，而不是有长期保障的企业订单量。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV011
      - number: '8.2'
        title: 估值与融资背景
        blocks:
          - type: paragraph
            body: >-
              2026 年 5 月，SendCutSend 由 Sequoia Capital、Paradigm Ventures、Patrick Collison 和 John Collison 共同牵头，募得 $110M
              机构资本，投后估值达到 $1.01B。二级私募市场平台和 VC 基准数据将这笔交易对应到约 5.0 倍估值倍数，基于估计约 $200M 的收入运行率。相比高毛利企业 SaaS 平台，5.0
              倍的历史或运行率收入倍数看起来并不高；但对一家资产密集型制造企业而言，这一倍数仍然激进，因为公司暴露于钢材和铝材价格波动以及高额设备折旧。更重要的是，详细的股权结构表安排、银行合作方的优先级债务契约和清算优先权倍数，都未在私募文件中披露，少数股东因此难以看清下行保护的结构。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: 建议与情景分析
        blocks:
          - type: paragraph
            body: >-
              综合较高的营收规模与订单量以及未经验证的单位经济性，我们启动覆盖，给予 Track 建议、高风险评级，并认为估值偏紧。基准情景预计，随着内华达州、得州和肯塔基州扩建后的设施陆续投产，收入将持续增长
              30-40%，支撑 3.5 倍至 4.5 倍收入的合理企业价值倍数。在航空航天和国防生产合同成功渗透的乐观情景下，企业价值倍数可能上行至约 6.0
              倍收入。相反，悲观情景考虑工业劳动力成本上升、设备融资成本增加以及本地工厂竞争加剧带来的利润率压缩，倍数可能降至约 2.0 倍收入。要把建议提升为可执行的
              Buy，需要第三方审计验证毛利率、确认能产生正自由现金流，并确认清算优先权条款不会造成过重负担。
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
