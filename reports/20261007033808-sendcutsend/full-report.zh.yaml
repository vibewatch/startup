      - number: '8.4'
        title: 图表与附录
        blocks:
          - type: callout
            title: 核心矛盾：软件速度 vs 实体资本开支
            body: SendCutSend 获客经济性和交付速度都很像软件公司，但实体钣金切割无法摆脱设备折旧、厂房间接成本和材料价格周期。2026 年 5 月的 $1.01B 估值，给执行失误留下的余地很小。
            calloutType: recommendation
