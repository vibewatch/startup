      - number: '6.5'
        title: 展示
        blocks:
          - type: callout
            title: 广度比忠诚度更有证据支持
            body: 多个现有来源重复了累计规模，并描述了从创客到企业工业团队的使用情况。这种广度降低了对单一已披露垂直行业的依赖，但没有留存来源量化客户集中度或客户群留存。
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU015
          - type: callout
            title: 留存仍是尽调事项
            body: 具名重复用户是有用的定性证据，但公司筛选、缺失的客户群分母和缺失的合同数据，使我们无法基于证据判断 NRR、GRR、流失率或收入持久性。
            calloutType: risk
            claimRefs:
              - CU005
