      - number: '2.3'
        title: 买方细分、预算归属与采购路径
        blocks:
          - type: paragraph
            body: >-
              SendCutSend 平台的需求来自四类客户：独立创客和专业发烧友、硬件工程原型团队、专业中小型加工厂，以及企业 OEM 生产部门。各细分市场的
              预算权限、购买触发因素和对交付周期摩擦的容忍度各不相同。个人创客和业余加工者通常使用个人信用卡或部门费用预算下单，单笔交易在 $20 到 $300 之间，主要看重即时定价以及免去本地加工厂的开机费。


              相比之下，商用航空航天、机器人和工业科技公司的专业硬件工程团队把 SendCutSend 用于反复迭代的研发周期。对这些买方而言，预算由机械工程经理或产品开发负责人掌握，他们的首要经济 KPI
              是开发速度，而不是物料清单成本。企业 OEM 是增长最快的订单量层级：制造运营经理和企业采购人员把 SendCutSend 接入支架、外壳和设备安装硬件的重复供应线。SendCutSend
              严格执行可制造性设计指南，并禁止受限武器或危险部件，因此企业采购团队无需经历漫长的供应商审计周期即可接入平台。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
