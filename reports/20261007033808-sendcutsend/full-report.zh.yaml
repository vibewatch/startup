        blocks:
          - type: paragraph
            body: >-
              SendCutSend 的核心经济引擎是专有套料软件，把数百份独立客户几何图形汇总到单张标准钣金或复合材料板上。这种高密度多租户排版降低原料
              废料率，把开机和切割间接费用分摊到各种客户订单中，将高混合低批量生产变成高效批处理。运营设施资本密集度很高：工业光纤激光切割机每台约 $1.3M，里诺、Paris 和 Arlington 共部署 13
              台，另有多台机器人 CNC 铣削中心，每台约 $1M。尽管公司靠经营现金再投资和全天候四班制排班连续八年实现盈利，但设施层面的毛利率、人工吸收率和运费费用敏感性仍是未经验证的非公开数据。
