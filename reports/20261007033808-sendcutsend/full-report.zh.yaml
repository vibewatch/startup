  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、类别定义与纳入支出
        blocks:
          - type: paragraph
            body: >-
              SendCutSend 的可服务市场属于更广泛的美国国内合同金属加工和按需精密制造行业。过去，采购定制钣金、激光切割、CNC 路由和折弯，
              工程师与采购人员必须走人工询价（RFQ）流程。加工厂通常要花数天准备工程估算、评估 CAD 图纸、为机床加工重制图纸并管理客户审批，之后第一束激光才能切下原料金属。SendCutSend
              把市场边界锁定在高混合、数量可变的零件上，因为前台信息处理才是采购的主要瓶颈。


              可服务支出包括 2D 和 2.5D 平板切割（光纤激光和水刀）、钣金成形（折弯、沉孔、五金嵌入、攻丝），以及铝、钢、不锈钢、黄铜、铜、钛、复合材料和工程塑料的快速 CNC
              路由。纳入支出覆盖快速原型、售后及替换部件、低至中等批量 OEM 生产，以及维护、维修和运营（MRO）加工。SendCutSend
              明确排除超大批量汽车冲压、重型结构钢加工、复杂五轴整体式航空锻件，以及需要明确军用认证或机密安全设施的严格监管国防产品。现状替代方案包括传统区域加工厂、内部资本设备（例如专用 CNC
              等离子或水刀工作台）和数字经纪平台。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
      - number: '2.2'
        title: 市场规模视角：TAM、SAM 与实际可服务范围
        blocks:
          - type: paragraph
            body: >-
              评估 SendCutSend 的潜在市场不能只做一套自上而下的总潜在市场（TAM）估算，而要用多个彼此不同的规模视角。最宽的口径覆盖北美合同金属
              加工和机加工行业，这是一个年吞吐额达数百亿美元的成熟行业。但其中绝大多数来自封闭式长期生产合同、结构件加工和专属供应链合作，并不会通过自助网页门户交易。


              更严谨的可服务市场（SAM）只计算面向小企业、工程团队和区域 OEM 的快速交付按需加工、快速原型和钣金批量生产。这一层受发货半径、最大零件包络尺寸（标准定制切割约为 56 英寸 × 44
              英寸）、材料厚度上限和后处理能力限制。SendCutSend 的可服务可获得市场（SOM）指以网页为先的国内自动化下单：零件可由算法报价，在标准板材上联合套料，并于 2 至 4
              个工作日内发出。SendCutSend 在 2025 年 10 月突破 $100M 年化收入里程碑，并预计 2026 年超过 $150M；它已为机器人、航空航天、汽车和工业硬件领域的 150,000 多名
              客户履行订单，证明了这层市场的交付速度。
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM007
              - CM008
