      - number: '1.4'
        title: 展示
        blocks:
          - type: callout
            title: 以软件为先的工厂模式：单位经济学差异化
            body: >-
              传统钣金加工厂面对小批量生产时，往往要人工报价并为单个订单专门设置机器；SendCutSend 的核心优势则来自专有的多客户订单套料软件。公司用算法把数百名独立客户的设计集中到单张 5x10
              英尺金属板上，几乎把边际开机成本降到零，同时提高原材料利用率，既能低成本生产单件原型，也能保持全天候快速交付。
