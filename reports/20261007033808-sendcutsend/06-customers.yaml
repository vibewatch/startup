chapter:
  number: 6
  title: "Customers"
  summary: "SendCutSend reports broad adoption across more than 300,000 customers and over 30 million shipped parts, with evidence spanning individual makers, small fabrication businesses, and enterprise users in robotics, space, data centers, and other industrial verticals. The public record demonstrates reach and repeat-use examples, but it does not disclose retention cohorts, active-customer denominators, contract durability, or customer concentration."
sections:
  - id: "customer-segments"
    title: "A barbell customer base, from makers to enterprise engineering teams"
    body: |
      The retained evidence supports a broad customer mix rather than a single dominant buyer persona. SendCutSend's own release describes customers ranging from independent inventors to Fortune 500 companies across aerospace, defense, space flight, data centers, robotics, transportation, agriculture, distribution, and manufacturing. Inc. separately reports demand from transportation and defense companies as well as robotics, space-technology, and data-center customers. Company-hosted testimonials add a long tail of welders, automotive builders, fabrication shops, and small product businesses whose buyer, user, and payer are often the same owner-operator.

      The common job is fast access to custom parts without owning every machine or negotiating a manual quote. Enterprise users appear to value iteration speed and production flexibility, while smaller customers emphasize low-volume economics, predictable quotes, and outsourced secondary processing. Public evidence does not quantify segment revenue, order frequency, average order value, or gross margin, so the strategic importance of each segment remains unverified despite the breadth of use cases.
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU010"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory"
    title: "Scale is visible; active usage and cohort quality are not"
    body: |
      SendCutSend's May 2026 release says the company had shipped more than 30 million parts to over 300,000 customers. A 2026 Torchmate supplier case study repeats approximately 300,000 customers and more than 30 million parts, although it is a commercial supplier story based in part on an interview with SendCutSend's CEO rather than an independent audit. ARR Club separately describes a $140 million revenue run rate in April 2026; that wording is revenue run rate, not ARR, and it should not be interpreted as recurring subscription revenue.

      These figures establish cumulative reach and throughput but omit the denominators needed to assess adoption quality. None of the assigned sources provides monthly active customers, orders per active account, repeat-purchase rate, cohort frequency, or customer acquisition efficiency. Jirav's vendor case study indicates that management tracks average order value, product counts, product types, and orders per business day, which suggests the underlying operating data exists, but the case study publishes no values.
    claimRefs:
      - "CU001"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU014"
      - "CU015"
    tableRefs:
      - "TU002"
  - id: "named-customer-proof"
    title: "Named references show repeat use, but evidence is company-curated"
    body: |
      The strongest named examples in the assigned pool are testimonials published by SendCutSend. Timwelds says he has ordered regularly since August 2020; Tyler Bell says he has used the service on almost every project for several years; Kuhnhausen Metal Concepts describes order flexibility from one component to 10,000; and Reversion Raceworks calls the service pivotal to its manufacturing process. These statements are consistent with recurring production use rather than isolated pilots, and they cover prototyping, brackets, assemblies, finishing, and cross-border delivery.

      Reference quality remains limited because the testimonial page is selected and hosted by the company. The retained independent and partner sources corroborate broad customer categories and aggregate scale, but they do not validate these named customers' volumes, savings, defect rates, contract terms, or renewal behavior. Accordingly, the examples demonstrate plausible repeat usage and workflow fit, not measured retention or independently verified customer outcomes.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU005"
      - "CU006"
      - "CU016"
    tableRefs:
      - "TU003"
  - id: "durability-expansion-and-friction"
    title: "Expansion is operationally plausible, while durability remains unmeasured"
    body: |
      The customer journey can expand along two axes: higher order quantity and broader process use. SendCutSend says it supports a single prototype through tens of thousands of production parts, while testimonials describe customers progressing from individual brackets to complex assemblies and repeat production. Jirav's case study says management models customer segments using average order value, product counts, and product types, which are relevant signals for cross-sell and share-of-wallet expansion. No retained source, however, discloses NRR, GRR, churn, renewal, contract length, customer concentration, or channel dependence.

      Customer terms introduce practical friction. Orders usually cannot be canceled after entering production, returns and refunds are decided case by case, prices may change with raw-material and commodity prices, and the service is limited to the United States and Canada. The terms also place design fitness and lawful-use responsibility on customers and provide limited product warranties. These provisions may be standard for custom manufacturing, but the assigned evidence does not show how often they affect conversion, disputes, or enterprise procurement.
    claimRefs:
      - "CU004"
      - "CU009"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
    figureRefs:
      - "FU001"
