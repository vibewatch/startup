company:
  name: "SendCutSend"
chapter:
  number: 1
  title: "Company Overview"
  summary: "SendCutSend is a software-enabled on-demand precision sheet metal and CNC manufacturing platform founded in 2018 in Reno, Nevada by Jim Belosic and Erin Belosic. After scaling largely via reinvested operating cash flow and reaching a $100M revenue milestone in October 2025, the company completed a $110M Series A institutional financing in May 2026 co-led by Sequoia Capital, Paradigm, and Patrick and John Collison at a $1.01B post-money valuation. While operating metrics highlight rapid domestic expansion across 300,000 customers and 410 employees, key financial parameters including audited margins, debt covenant terms, and conversion from private milestone figures remain unverified."
sections:
  - id: "corporate-identity-and-mission"
    title: "Corporate Identity, Operating Model, and Governance"
    body: "SendCutSend Inc. was established in 2018 in Reno, Nevada, operating as an on-demand precision manufacturing platform that merges custom software automation with physical metal fabrication [CO001]. The platform provides automated quoting, sheet nesting, laser cutting, CNC routing, waterjet cutting, bending, and specialized metal finishing services across more than 200 materials [CO001, CO002]. Operating 24/7 across multiple facilities including its Longley Lane Reno hub, Paris (Kentucky), and Arlington (Texas), the company relies on proprietary nesting software developed by co-founder and Chief Technology Officer Jacob Graham to combine hundreds of disparate customer cut files onto single material sheets [CO001, CO007, CO008]. This batch nesting dramatically lowers setup waste and enables cost-effective single-unit custom part production [CO001, CO008]. While co-founder and Chief Executive Officer Jim Belosic and President Erin Belosic retain operational and governance leadership, key-person dependency on executive leadership and core software architecture remains material as operations scale nationally [CO007, CO009]."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO007"
      - "CO008"
      - "CO009"
    tableRefs:
      - "TO002"
    figureRefs: []
  - id: "capitalization-and-funding-history"
    title: "Capitalization Structure, Valuation, and Financing Trajectory"
    body: "From inception in 2018 through early 2026, SendCutSend expanded primarily through organic cash flow reinvestment and an initial modest friends-and-family financing round of approximately $6M featuring participation from angel investors Sandy Kory and Mark Sugarman [CO003, CO006]. On May 19, 2026, SendCutSend closed a $110M Series A institutional financing round co-led by Sequoia Capital (Andrew Reed, Shaun Maguire), Paradigm (Matt Wong, Matt Huang), and Stripe founders Patrick Collison and John Collison, which established a post-money valuation of $1.01B [CO003, CO004, CO006]. Secondary market intelligence from Forge Global indicates lifetime equity funding reached approximately $116.17M following Seed tranches priced in September 2022 and the Series A round priced at $50.53 per share [CO006]. The company maintains commercial debt arrangements with JPMorgan Chase to finance capital-intensive equipment acquisitions, though detailed debt covenants, credit facility limits, and audited financial statements remain private [CO001, CO010]."
    claimRefs:
      - "CO001"
      - "CO003"
      - "CO004"
      - "CO006"
      - "CO010"
    tableRefs:
      - "TO003"
    figureRefs: []
  - id: "operating-scale-and-market-milestones"
    title: "Commercial Scale, Milestone Evolution, and Diligence Realities"
    body: "SendCutSend achieved a documented $100M revenue run-rate milestone in October 2025, supported by an 80% year-over-year expansion rate, 410 full-time employees, and customer diversification where no single client accounted for more than 0.59% of revenue [CO001, CO011]. By May 2026, the company reported cumulative fulfillment of over 30 million parts to more than 300,000 customers spanning hobbyists, robotics developers, and commercial aerospace programs [CO001, CO005]. Alongside aggressive physical expansion—committing $250M toward facility rollouts and $1B toward domestic manufacturing initiatives over five years—formal service terms impose strict disclaimers, limiting total manufacturer liability to the greater of $100 or fees paid in the prior twelve months and disclaiming fitness for particular purposes [CO005, CO012]. The milestone timeline illustrates the progression from back-warehouse origins to unicorn status while highlighting private audit data gaps [CO001, CO003, CO005, CO006]."
    claimRefs:
      - "CO001"
      - "CO003"
      - "CO005"
      - "CO006"
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO001"
