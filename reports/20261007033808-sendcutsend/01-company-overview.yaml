callouts:
  - calloutType: "insight"
    title: "Software-First Factory Model as Unit-Economics Differentiator"
    body: "Unlike traditional sheet metal job shops burdened by manual quoting and dedicated machine setup for small production volumes, SendCutSend's core advantage stems from its proprietary multi-customer order nesting software. By algorithmically aggregating hundreds of independent customer designs onto single 5x10 foot metal sheets, the company achieves near-zero marginal setup costs and high raw-material utilization, enabling affordable single-unit prototypes while preserving rapid 24/7 turnaround."
    claimRefs:
      - "CO001"
      - "CO008"
  - calloutType: "risk"
    title: "Capital Intensity and Lack of Audited Operational Disclosures"
    body: "While SendCutSend's $1.01B valuation in May 2026 reflects massive market enthusiasm for software-enabled American reindustrialization, the underlying manufacturing business requires intensive capital expenditures—including $1.3M per fiber laser cutter and $1M per robotic milling unit across three round-the-clock facilities. With audited GAAP statements, gross margins, and JPMorgan debt facility terms remaining confidential, outside investors must carefully evaluate equipment depreciation, maintenance burdens, and working-capital exposure."
    claimRefs:
      - "CO001"
      - "CO003"
      - "CO010"
