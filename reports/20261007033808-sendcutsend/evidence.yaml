evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-gross-margin
    missingEvidence: >-
      Audited GAAP financial statements, operating gross margin by facility, and a bridge verifying revenue progression
      beyond the October 2025 milestone.
    whyItMatters: >-
      Without certified financial statements, reported revenue run-rate and growth claims cannot be independently
      verified against plant-level equipment depreciation and material input inflation.
    diligencePath: >-
      Request audited annual balance sheets, income statements, and cash flow reports directly from company management
      or lead investors.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-sizing-diligence
    missingEvidence: >-
      Audited segmentation of SendCutSend revenue by customer tier (prototyping vs recurring OEM production) and service
      process.
    whyItMatters: >-
      Determines what portion of revenue reflects high-churn ad-hoc maker demand versus durable, recurring industrial
      OEM manufacturing contracts.
    diligencePath: >-
      Request customer cohort retention data, repeat order rates, and SKU reorder concentration during management
      diligence.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: competitor-scale
    missingEvidence: >-
      Comparable competitor revenue, funding, customer, production-volume, and capacity metrics on a consistent period
      and denominator.
    whyItMatters: >-
      Without normalized scale evidence, the chapter cannot determine whether SendCutSend's reported volume translates
      into a durable capacity or cost advantage.
    diligencePath: >-
      Collect filings or audited disclosures for public peers and request management's dated competitive benchmark with
      definitions for customers, parts, revenue, and installed capacity.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: switching-and-retention
    missingEvidence: >-
      Win-loss records, cohort retention, repeat-order frequency, share of wallet, and job-level switching data across
      direct and adjacent competitors.
    whyItMatters: >-
      Public comparison pages show substitutability by job type but cannot quantify switching costs, loyalty, or
      distribution power.
    diligencePath: >-
      Request anonymized quote-to-order funnels and customer cohorts, then interview lost and multi-homing accounts
      using matched job specifications.
    relatedQuestionRefs:
      - QP005
  - type: missing-source
    severity: material
    topic: normalized-benchmark
    missingEvidence: >-
      Independent same-part benchmarks for price, lead time, dimensional accuracy, defect rate, and support across
      SendCutSend, OSH Cut, Xometry, and Protolabs.
    whyItMatters: >-
      Competitor-authored comparisons and company testimonials cannot establish a reliable cross-provider performance
      ranking.
    diligencePath: >-
      Commission blind matched-part orders with identical files, material, finish, quantity, delivery location, and
      metrology protocol.
    relatedQuestionRefs:
      - QP003
      - QP004
      - QP008
    relatedTableRefs:
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: audited-financial-statements
    missingEvidence: >-
      Audited income statements, balance sheets, and cash flow statements reconciling the October 2025 $100M revenue run
      rate to the May 2026 $200M revenue claim.
    whyItMatters: >-
      External underwriters cannot independently verify gross margin trajectories, net profitability, or working capital
      burn without GAAP financial audits.
    diligencePath: >-
      Request confidential virtual data room access to FY2024-FY2025 reviewed or audited financial statements and 2026
      management accounts.
  - type: private-evidence-only
    severity: material
    topic: debt-covenants-and-credit-balances
    missingEvidence: >-
      Credit facility agreements with JPMorgan Chase detailing total borrowing capacity, drawn debt balances, covenants,
      maturity dates, and encumbered assets.
    whyItMatters: >-
      Debt repayment obligations and restrictive covenants could constrain future capex deployment for facility
      expansion.
    diligencePath: Obtain credit agreements, compliance certificates, and debt service schedules directly from company management.
  - type: private-evidence-only
    severity: material
    topic: cnc-milling-capabilities
    missingEvidence: >-
      Audited machine specifications, spindle configurations, cycle times, and dimensional tolerance limits for the
      newly launched CNC milling and block-forming division.
    whyItMatters: >-
      Determines whether SendCutSend can effectively compete against precision machine shops like Protolabs on complex
      prismatic parts or remains limited to 2.5D machining.
    diligencePath: >-
      Request machine manufacturer model numbers, standard tolerance bands, and representative 3-axis/5-axis sample
      inspection reports under NDA.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: retention-and-cohorts
    missingEvidence: NRR, GRR, logo and revenue churn, renewal rates, repeat-order cohorts, and contract duration by customer segment.
    whyItMatters: >-
      Cumulative customer and part counts cannot distinguish durable repeat demand from one-time transactions or
      continuous acquisition.
    diligencePath: >-
      Request monthly customer-order cohorts, retention bridges, and contract-duration distributions segmented by maker,
      small-business, and enterprise accounts.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top-customer and top-10 revenue shares, vertical concentration, channel contribution, and enterprise program
      exposure.
    whyItMatters: >-
      Broad customer claims do not establish whether revenue is economically diversified or dependent on a small number
      of large programs.
    diligencePath: >-
      Review an anonymized customer revenue concentration schedule and reconcile it to audited revenue for the latest
      twelve months.
    relatedQuestionRefs:
      - QU005
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      An independently verified, complete set of named production customers with deployment status, volumes, measured
      outcomes, and reference dates.
    whyItMatters: Company-selected testimonials cannot establish representative production adoption or outcome quality.
    diligencePath: >-
      Conduct reference calls with a stratified sample of maker, small-business, and enterprise customers and obtain
      order-history support.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: active-adoption
    missingEvidence: >-
      Monthly active customers, orders per active customer, prototype-to-production conversion, and parts per order over
      time.
    whyItMatters: >-
      Cumulative scale and revenue run rate do not reveal utilization, repeat behavior, or whether adoption quality is
      improving.
    diligencePath: >-
      Request operating dashboards and cohort exports with metric definitions, period coverage, and reconciliation to
      order and revenue systems.
    relatedQuestionRefs:
      - QU002
    relatedTableRefs:
      - TU002
  - type: missing-source
    severity: material
    topic: regulatory-enforcement
    missingEvidence: >-
      Audited records of OSHA workplace safety inspections, environmental emission compliance reports, and public court
      docket records across SendCutSend production facilities.
    whyItMatters: >-
      Operating high-powered industrial laser cutters, waterjets, and finishing lines carries chemical and workplace
      safety liabilities that cannot be fully verified from marketing or terms documents.
    diligencePath: >-
      Conduct comprehensive PACER federal court searches, state court docket reviews in Nevada, Texas, and Kentucky, and
      formal FOIA requests with OSHA and state environmental protection agencies.
    relatedQuestionRefs:
      - QR007
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: operational-yield
    missingEvidence: >-
      Facility-level machine utilization logs, scrap rates, remake percentages, and certified quality management system
      documentation (ISO 9001 / AS9100).
    whyItMatters: >-
      As production scales, scrap rates and unbudgeted machine maintenance represent the fastest vector for gross margin
      erosion in custom physical manufacturing.
    diligencePath: >-
      Request management provide monthly facility operating scorecards, first-pass yield metrics, scrap percentage
      trends, and maintenance downtime logs during phase-two diligence.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR002
