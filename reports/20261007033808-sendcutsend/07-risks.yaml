  figureRefs:
  - FR001
- id: section-legal-regulatory
  title: Legal, Regulatory, and Intellectual Property Exposure
  body: >-
    In legal, regulatory, and intellectual property dimensions, SendCutSend enforces strict terms of service and upload policies designed to insulate the platform from downstream liability. Customers retain full ownership and legal responsibility for submitted CAD geometry, certifying that designs do not violate intellectual property rights, local or federal statutes, or weapon-related prohibitions. The company explicitly reserves unilateral discretion to cancel orders, reject parts, or terminate user accounts if prohibited weapon components, illicit paraphernalia, or infringing designs are detected.


    However, SendCutSend explicitly disclaims all implied warranties of merchantability, fitness for a particular purpose, and non-infringement, limiting its contractual liability for manufactured parts to the price paid or $100. For marketplace transactions where individual designers distribute parts, the company mandates certifications that products are not destined for vehicle structural components, fail-safe environments, or hazardous mission-critical applications. Because SendCutSend serves commercial aerospace, robotics, and defense customers that incorporate cut components into flight hardware and physical systems, the legal disconnect between platform disclaimers and downstream field liability represents an ongoing diligence consideration for institutional underwriters. Public regulatory databases show no active enforcement actions, but the absence of publicly disclosed quality audits such as AS9100 or ISO 9001 certifications leaves formal compliance verification to private diligence.
  claimRefs:
  - CR005
  - CR006
  - CR011
  - CR012
  tableRefs:
  - TR002
- id: section-partner-dependency
  title: Partner, Logistics, and Execution Dependencies
  body: >-
    SendCutSend's speed advantage and low-cost customer acquisition rely heavily on an interconnected web of external partners and critical operating nodes. The entire customer value proposition centers on rapid order-to-delivery cycles, making third-party parcel logistics carriers (such as UPS, FedEx, and postal carriers) a vital bottleneck. While SendCutSend controls internal manufacturing turnarounds through automated nesting and round-the-clock machine scheduling, transit delays, lost packages, or regional logistical disruptions remain beyond direct factory control. Under company terms, title and risk of loss transfer to the customer upon delivery to the carrier, yet customer satisfaction remains intrinsically tied to on-time arrival.


    Equipment financing and raw material distribution constitute secondary critical dependencies. Procuring industrial fiber laser systems, robotic press brakes, and CNC milling centers requires substantial equipment debt and ongoing reinvestment. Commodity price swings in aluminum, steel, titanium, and copper are passed through to end-users via real-time quoting adjustments, but sudden regional supply constraints or mill shortages can extend lead times. Moreover, top-of-funnel customer acquisition is driven by online digital channels, promotional codes, and word-of-mouth creator referrals across automotive, maker, and maker-pro communities. Maintaining brand integrity and execution reliability across hundreds of thousands of customer orders requires consistent machine calibration, rigorous quality control, and minimal scrap rates across all operating locations.
