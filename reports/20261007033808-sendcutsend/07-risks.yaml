callouts:
- calloutType: risk
  title: Capital Intensity vs Digital Multiples
  body: >-
    Unlike software businesses that achieve near-zero marginal scaling costs, SendCutSend's rapid manufacturing model requires continuous reinvestment in physical machinery, facility leases, and skilled labor. With more than $250 million earmarked for facility expansion, valuation multiples must account for tangible fixed costs, equipment depreciation, and cyclical demand fluctuations rather than pure software economics.
  claimRefs:
  - CR001
  - CR002
- id: callout-moat-boundaries
  calloutType: insight
  title: Specialization Moat and Geometry Limits
  body: >-
    SendCutSend's automated quoting and rapid-turn fulfillment provide an unmatched speed moat for flat cut and formed sheet metal parts. However, the company faces structural geometry boundaries against broad manufacturing networks like Xometry, which support complex multi-axis CNC milling, molding, and casting. Retaining enterprise accounts will require either continuous service line expansion or coexistence with broader manufacturing platforms.
  claimRefs:
  - CR003
  - CR004
