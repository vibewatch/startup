  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: architecture-disclosure
      missingEvidence: A disclosed Astromech model architecture, training-data provenance, or benchmark result.
      whyItMatters: Without this, the core "Large Life Model" claim cannot be technically evaluated at all.
      diligencePath: >-
        Request a technical architecture briefing, benchmark results, or any peer-reviewed or third-party validation
        study.
      relatedQuestionRefs:
        - QE007
        - QE010
        - QE016
    - type: missing-source
      severity: material
      topic: workflow-and-integration
      missingEvidence: A documented end-to-end Astromech user workflow, API, or integration surface.
      whyItMatters: >-
        Without a documented workflow, it is not possible to assess how any customer would actually use the platform in
        production.
      diligencePath: Request product documentation, API reference, or a live product demonstration.
      relatedQuestionRefs:
        - QE002
        - QE011
      relatedTableRefs:
        - TE002
    - type: private-evidence-only
      severity: material
      topic: developer-signal-proxy
      missingEvidence: A public developer surface (GitHub activity, API forum, or engineering community) for Astromech.
      whyItMatters: The careers-page proxy used in this chapter is a weak substitute for actual public engineering signal.
      diligencePath: Request internal engineering metrics or ask whether any public developer surface is planned.
      relatedQuestionRefs:
        - QE012
        - QE013
    - type: missing-source
      severity: material
      topic: trust-and-compliance
      missingEvidence: >-
        Any security certification, data-governance framework, or biosafety/biosecurity compliance statement for
        Astromech.
      whyItMatters: >-
        Given the platform's biological-modeling scope, the absence of any compliance framework is a
