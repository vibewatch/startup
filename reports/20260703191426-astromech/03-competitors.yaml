      - - Isomorphic Labs
        - Direct — AI drug design platform
        - Large Series B; Alphabet-backed
        - Large pharma (J&J, others)
        - Physics/structure-based modeling lineage from AlphaFold
        - Spin-out stage; commercial deal maturity still developing
      - - Schrödinger
        - Direct — physics-based computational platform
        - 'Public company (Nasdaq: SDGR); disclosed revenue'
        - Pharma, biotech, materials science
        - Long-standing physics-based simulation credibility
        - Software-plus-drug-pipeline dual model dilutes pure-platform comparison
      - - Generate:Biomedicines
        - Adjacent — generative protein design
        - Large private round; disclosed investor relations page
        - Biotech, pharma partners
        - Generative biology for de novo protein design
        - Narrower modality focus than Astromech's broad platform claim
      - - Absci
        - Adjacent — generative protein/antibody design
        - Public company; wet-lab AI integration
        - Pharma partners
        - Integrated wet-lab + generative AI design loop
        - Smaller scale than Recursion/Schrödinger peer set
      - - LabGenius
        - Adjacent — antibody discovery platform
        - £35M Series B; named pharma partner (Sanofi)
        - Biopharma antibody programs
        - Automated evolutionary antibody engineering (EVA platform)
        - Narrower antibody-only scope
      - - BenevolentAI
        - Adjacent/earlier-generation — knowledge-graph platform
        - Public listing; repositioning strategy
        - Pharma partners (e.g., AstraZeneca)
        - Deep knowledge-graph and literature-mining heritage
        - Public reporting shows strategic repositioning after earlier setbacks
      - - Relay Therapeutics
        - Adjacent — dynamics-based structural biology
        - Public company; disclosed pipeline
        - Oncology and other therapeutic pharma
        - Protein-motion/dynamics computational approach
        - Different technical wedge than evolutionary/multi-omics framing
      - - Astromech
        - Direct — biological AI / Large Life Model platform
        - $40.5M disclosed capital; ~$2B reported valuation
        - Undisclosed — framed broadly across medicine, agriculture, biology
        - Multi-species evolutionary and multi-omics modeling claim
        - No disclosed pharma partner, revenue, or benchmark versus peers
    notes: Astromech row included for direct comparison; all competitor rows use only public disclosures.
