        - Large pharma R&D
        - Large-scale phenotypic screening plus AI models
        - Multi-year path to proven clinical translation still developing
      - - Insilico Medicine
        - Direct — AI drug discovery platform
        - Public via Hong Kong listing; disclosed financials
        - Large pharma, biotech
        - End-to-end generative Pharma.AI platform
