  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: benchmark-evidence
      missingEvidence: An independent technical benchmark comparing Astromech's modeling outputs against any named competitor.
      whyItMatters: Without a benchmark, Astromech's core differentiation claim cannot be distinguished from marketing narrative.
      diligencePath: Request any third-party or academic benchmark study, or commission an independent technical evaluation.
      relatedQuestionRefs:
        - QP015
        - QP022
        - QP009
        - QP014
        - QP024
    - type: private-evidence-only
      severity: material
      topic: gtm-and-pricing
      missingEvidence: Astromech's actual deal structure, pricing approach, and current business-development pipeline.
      whyItMatters: >-
        Every pricing and GTM comparison in this chapter is inferred from competitor disclosure, not from Astromech
        itself.
      diligencePath: Request current pipeline, deal-structure templates, and any signed or in-negotiation term sheets.
      relatedQuestionRefs:
        - QP012
        - QP013
      relatedTableRefs:
        - TP003
    - type: missing-source
      severity: material
      topic: named-partnerships
      missingEvidence: Any named Astromech pharma, agbio, or government partnership or pilot.
      whyItMatters: The absence of a single named partner is the single largest disclosure gap versus every profiled competitor.
      diligencePath: Request current partnership pipeline and named-account list.
