        - 见于投资者关系材料
        - 具名可比公司，已披露制药合作伙伴（Bayer）
        - 公司规模更大、阶段比 Astromech 更成熟
      - - Relay Therapeutics
        - 公开市值
        - 见于 SEC EDGAR 文件和股票统计
        - 具名可比公司，已披露制药合作伙伴（Novartis）
        - 临床阶段生物技术模式不同于 Astromech 的纯平台叙事
      - - BenevolentAI
