  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Astromech 的可服务支出落在三个相邻预算池内，而不是一个清晰品类：（1）药企和生物科技研发团队购买的 AI 药物发现和生物制剂设计工具；（2）药企及农业 /
              工业生物技术买家购买的合成生物学与计算生物学基础设施；（3）更广义的预测生物学或生物安全相邻分析，可能服务政府和国防相邻买家。纳入范围包括 R&D 软件授权、计算服务和多组学数据平台；排除范围包括湿实验 CRO
              执行、制造和临床试验运营，Astromech 似乎并不直接提供这些。多数买家的现状替代方案，是内部生物信息学团队、单点 AI
              供应商（Recursion、Insilico、Schrödinger、Isomorphic Labs），以及传统高通量筛选或基于结构的筛选。公开来源没有显示 Astromech
              指名某一目标买家预算科目，所以这里的边界来自平台定位和可比公司归类，而不是公司披露的 TAM 声明。
