      - number: '3.2'
        title: 竞争者画像：规模、融资与战略方向
        blocks:
          - type: paragraph
            body: >-
              几家竞争者在规模和披露上显著高于 Astromech。Recursion 和 Schrödinger 都是上市公司，披露收入、市值和多年药企合作历史。Insilico Medicine
              完成香港上市，并披露财务数据。Generate:Biomedicines 和 Isomorphic Labs 完成了大型后期私募或战略轮融资，披露了具名投资人和药企合作者（Isomorphic Labs 的
              Series B 轮融资报道同时提到 Alphabet 持续支持）。LabGenius 和 Absci 处在更窄的抗体 /
              蛋白设计利基，披露融资额较小，但有具体药企合作验证点（LabGenius-Sanofi；Absci 的上市公司披露）。相对这一组，Astromech
