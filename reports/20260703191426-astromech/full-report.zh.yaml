            body: >-
              如财务章节所述，Astromech 披露了 $30 million 初始 Form D 发行，随后约 $10.5 million 延伸融资，披露资本合计 $40.5 million；对应所称 $2 billion
              估值，但没有披露收入、现金消耗率或可支撑运营期。由此形成实质财务模型风险：在没有披露收入的情况下给出高估值，意味着公司很可能在获得任何商业验证前还需要大量后续资本；下一轮融资的任何延迟都可能带来资金缺口风险。如果
              Astromech 的湿实验验证雄心落地，资本强度很可能进一步上升，放大这一风险。未识别到欺诈、信用或营运资本信号，但这反映的是缺少任何已披露财务报表，而不是一张健康证明。
