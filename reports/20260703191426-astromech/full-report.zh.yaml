  - id: TV005
    title: 论点破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 后续融资失败或估值下调
        - 任何定价融资轮的估值等值不高于已披露的 $40.5M 资本基础
        - 直接削弱 $2B 估值叙事
        - 按新估值重做整套投资论证
      - - 持续没有具名客户
        - 退出隐身状态后 12-18 个月内仍未披露具名客户
        - 证实客户与风险章节中标记的客户获取风险
        - 将建议从观望下调为放弃
      - - 品类层面出现不利监管或生物安全行动
        - 任何影响 AI 生物学序列建模的有约束力执法行动
        - 推高整个品类的监管风险，不只是 Astromech
        - 广泛重估品类论点，而不是只重估 Astromech
      - - 创始人离任且无接班计划
        - 任何披露显示 Ben Lamm 离任且未指定继任者
        - 直接抬高「风险」中标出的关键人风险
        - 立即重新承销判断；按打破投资假设事件处理
    notes: 这些触发项未来都可通过公开来源监测；截至 2026-07-03，尚未观察到任何一项。
