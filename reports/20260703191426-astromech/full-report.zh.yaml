        blocks:
          - type: paragraph
            body: >-
              按任何标准衡量，Astromech 都还不具备退出条件：没有收入、没有具名客户、没有独立财务报表，也没有已披露技术基准，无法支撑未来 IPO
              或战略收购论证。最关键的破坏论点触发项是：后续融资失败或估值显著下调；隐身期结束后的合理窗口过去后，仍没有任何具名客户；或出现对整个品类不利的监管 /
              生物安全行动。最能提升投资判断信心的最终尽调要求是：经审计或审阅的财务报表、具名客户或试点参考、独立技术基准或第三方验证研究，以及已披露合规 / 认证路线图。
