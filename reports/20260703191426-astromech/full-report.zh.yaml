            body: >-
              Astromech
              未披露制造、供应链或设施信息，这与当前阶段的计算平台（而非湿实验平台）一致；不过，公司自身公开材料描述了走向湿实验验证的雄心，届时会引入目前尚未出现的设施、试剂供应和生物安全运营风险。Astromech
              平台没有安全认证、事故历史或正常运行时间 / 可靠性披露。关于双重用途 AI 生物学系统的同行评议治理文献，正是把这类运营缺口——缺少上游风险收益审查流程——标记为品类层面的实质担忧；这不专属于
              Astromech，但因其品类身份适用于它。Center for Health Security 的独立治理研究也强化了这一发现，指出正式运营安全框架在整个 AI 生物学品类中仍不成熟，并非只有
