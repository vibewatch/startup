      - number: '1.2'
        title: 创始人、剥离背景与治理
        blocks:
          - type: paragraph
            body: >-
              Astromech 的公开叙事与 Ben Lamm 和 George Church 深度绑定。Lamm 是 Colossal Biosciences 背后的运营型创业者；Church
              则凭合成生物学、基因组学及更广泛的 Harvard 相关研究提供科学可信度。Colossal 自身文章和外部报道都把 Astromech 描述为有意剥离的公司，而不是偶然的副项目；Colossal
              的去灭绝项目提供了技术和数据富集的母体背景。重要之处在于，Astromech 可能同时继承 Colossal 的声誉杠杆和关键人物集中风险。公开来源确认了 Delaware 注册、Austin 办公地址，以及最初
              Form D
              中披露的投资人数量很少，但没有披露完整董事会、治理权、股权拆分或独立监督结构。尽调含义是，目前治理可信度更多押在创始人质量和母公司声誉上，而不是独立可见的公司控制。公开招聘信号显示职能覆盖较宽，但仍弱于具名高管名单或清晰披露的董事会结构。
