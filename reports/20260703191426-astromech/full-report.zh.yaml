      - number: '3.4'
        title: 切换成本、锁定与分销权力
        blocks:
          - type: paragraph
            body: >-
              该品类的切换成本来自数据集成深度和多年合作结构，而不是简单的软件锁定。一旦药企伙伴把某个竞争者的模型输出接入正在推进的发现项目，即使新进入者提出更强技术主张，替换供应商也会变贵；这在结构上有利于
              Recursion、Schrödinger 和 Isomorphic Labs 等已建立合作的在位者，也不利于包括 Astromech 在内的新进入者。多供应商并用（买家在不同项目中使用多个 AI
              生物学供应商）在大型药企中似乎很常见，从竞争者披露的具名合作多样性即可看出；这降低了 Astromech
              赢得首个试点的门槛，但提高了赢得排他性的门槛。分销权力不对称：上市公司竞争者可以持续利用投资者关系、已发布财务结果和分析师覆盖来提供可信度与漏斗顶部信号，而 Astromech 作为低披露私营公司，目前无法复制。
            claimRefs:
              - CP021
