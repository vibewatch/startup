      - number: '2.2'
        title: 用多重视角测算市场
        blocks:
          - type: paragraph
            body: >-
              这里没有单一 TAM 数字可靠，因此本章用多组视角交叉校准。仅 AI 药物发现细分市场，分析师对 2024-2025 年的估算集中在 $2-3B 区间，并以约 28-46% CAGR 增长；到 2030
              年代早中期，视方法和相邻服务纳入情况不同，规模可达 $10-20B 以上。MarketsandMarkets 使用的 AI 生物技术框架更大，覆盖诊断和制造等超出 Astromech 表观范围的用例。另一个 AI
              合成生物学子细分市场目前估计为数亿美元，到 2030 年代初扩大数倍；同时 OECD 和 BCG 都认为，合成生物学的工业转化真实存在，但速度慢于标题 TAM 暗示。因而，对 Astromech
              这样的商业化前平台而言，可辩护的 SAM 最好被视为一条受证据约束的窄楔子——近期可服务的药企 / 农业生物 R&D 工具支出可能只有低个位数十亿美元——而不是完整的数百亿美元级标题
              TAM；在公司披露首批付费项目之前，SOM 实际上无法定义。
