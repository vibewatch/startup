      - number: '2.5'
        title: 市场规模与采用尽调缺口
        blocks:
          - type: paragraph
            body: >-
              几个市场规模和采用问题无法用公开证据关闭。没有来源像 Astromech 定义自身使命那样单独划出「AI
              预测进化生物学」品类，因此这里所有市场数字都来自相邻品类代理，而不是直接匹配。分析师估算在当前年度市场规模和未来 CAGR 上也相差超过 2
              倍，取决于是否纳入诊断、制造和服务；留存的分析师报告中，没有一份披露足够大的一手调研样本，可独立验证基年数字。采用路径证据完全来自可比公司，而不是 Astromech
              自身披露的销售管线，因此本章的买家分层应被读作行业典型模式，而不是已确认的 Astromech 商业化动作。这些缺口重要，因为它们意味着本报告后面的估值工作不能依赖单一、经来源验证的
              TAM；估值必须从区间推理，并明确标出规模不确定性。
