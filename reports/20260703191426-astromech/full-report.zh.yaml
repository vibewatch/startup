companyProfile:
  summary: >-
    Astromech 是一家位于 Austin 的私营生物 AI 初创公司，从 Colossal Biosciences 剥离出来，由 Ben Lamm 和 George Church 创立。公司称其平台为 Large Life
    Model，结合进化建模、多物种数据、泛基因组学，以及未来的多组学整合，服务医学、农业和可编程生物学应用。公开披露确认其 2025 年融资 $30 million、2026 年种子轮延伸融资约 $10.5 million；多家
    2026 年媒体报道其估值约 $2 billion，但收入、客户和单位经济披露基本缺位。
