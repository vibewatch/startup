            body: >-
              能力层面，竞争者按技术路线分化：Recursion 和 Insilico 强调大规模表型与生成式筛选；Isomorphic Labs 和 Schrödinger
              强调物理和基于结构的建模；Generate:Biomedicines、Absci 和 LabGenius 强调带湿实验反馈循环的生成式蛋白 / 抗体设计；Astromech
              强调多物种进化和多组学建模，基于公开证据，这在同侪中是相对更少验证的角度。整个品类很少公开定价；多数竞争者靠平台授权加里程碑 / 权利金交易结构变现，而不是透明标价，Astromech
              则完全没有披露定价或交易结构信息。GTM 和分销方面，公开披露的竞争者通过具名商务拓展合作触达药企买家；其中几家公司还借助公开市场投资者可见度，形成 Astromech 当前缺少的分销和可信度通道。
