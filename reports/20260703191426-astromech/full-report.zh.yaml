              估值放在一起，称这家很年轻的剥离公司在九个月内达到独角兽状态。融资额与隐含估值之间的差距，是投资判断的核心：它表明投资人承销的是战略期权价值、专有科学背景和 Colossal
              邻近性，而不是当前商业指标。公开来源没有披露收入、ARR、当前客户数或当前员工数。因此，当前可支持的阶段标签不是「已规模化商业生物科技公司」，而是「披露很少的种子轮延伸 /
