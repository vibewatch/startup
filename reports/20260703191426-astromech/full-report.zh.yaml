    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Astromech 将自己定位为一家生物 AI 公司，打造所谓「Large Life
              Model」，而不是传统药物发现单点工具。官网把系统描述为一层自主生物智能，用来建模多物种转录组、进化和结构数据，帮助研究人员理解「生命代码」，不只是做摘要。第三方报道与这一定位一致，称 Astromech
              是一个预测生物学引擎，试图在进化、疾病风险和生物脆弱性变得临床可见之前做出预测。尽调上，实际结论是：Astromech 更适合被理解为一家早期平台公司，站在 AI
              基础设施、计算生物学和合成生物设计的交叉点。这带来异常宽的可选性，但也意味着截至 2026-07-03，公司叙事仍明显更像平台愿景，而非商业验证。
