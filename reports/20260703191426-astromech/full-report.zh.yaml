            body: >-
              这一组竞争者没有哪一家拥有已经稳固且能抵御反证的护城河：BCG 关于工业规模化的研究明确警告，合成生物学和 AI 生物学商业化主张整体跑在已证明工业结果之前；这一提醒适用于整个竞争集合，不只针对
              Astromech。公开证据没有显示任何 AI 原生新进入者正面对面替代在位者；相反，多数具名交易看起来是对现有药企 R&D
              预算的增量，而不是替代。商品化风险正在上升，因为更多资本充足的进入者采用相似的生成式和多组学技术；这可能比任何单家公司路线图更快压缩整个品类的差异化，包括 Astromech。Astromech
              的具体护城河主张——多物种进化建模——没有公开的、相对任何同行的正面对比基准；这本身就是本章最重要的反向发现：差异化被提出了，但还没有被证明。
