  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接与相邻竞争者图谱
        blocks:
          - type: paragraph
            body: >-
              竞争集合覆盖几种不同姿态。直接同行是建设通用 AI 生物学或药物设计平台的公司，包括 Recursion Pharmaceuticals、Insilico Medicine、Isomorphic Labs 和
              Schrödinger。相邻玩家聚焦蛋白 / 抗体设计和生成式生物学，包括 Generate:Biomedicines、Absci 和 LabGenius。BenevolentAI
              代表上一代知识图谱路线，如今转向更窄的药企合作。Relay Therapeutics
              则代表基于动力学的结构生物学替代技术路线，同样瞄准药物发现问题。现状替代仍是药企内部生物信息学团队，以及传统高通量或基于结构的筛选；这在多数在位药企中仍是默认选择。内部自建是现实威胁，因为大型药企 R&D
              组织越来越多招聘内部计算生物学团队，而不是直接购买平台访问。潜在进入者包括转向生物学的资金充足 AI 实验室（沿 Isomorphic Labs 和 NVIDIA BioNeMo 模式），以及其他
              Colossal 相邻剥离公司。
