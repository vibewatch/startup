      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 12 个月内披露具名制药合作伙伴和技术基准
        - 后续融资定价达到或高于当前 $2B 标记
        - 如果披露的基准落后于品类同业，会产生执行风险
        - 低-中——目前没有即将披露的证据
      - - 基准
        - 12-18 个月内继续有限披露；小规模桥接 / 延展融资
        - 下一轮估值持平到下调，等待证明点
        - 披露缺口拖得越久，投资者信心越被侵蚀
        - 中-高——与前面各章呈现的当前轨迹一致
      - - 悲观
        - 未拿下具名客户，也未及时完成后续融资
        - 估值下调到与已披露资本基础相匹配的水平
        - 融资缺口风险，以及潜在困境出售或关停情景
        - 低-中——需要具体负面催化剂，目前未披露
