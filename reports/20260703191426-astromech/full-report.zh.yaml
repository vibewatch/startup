            body: >-
              按严重程度排序，Astromech
              的最高风险是：（1）近乎彻底的公开披露风险——公司没有发布财务数据、具名客户、技术基准或合规认证，几乎所有主张都无法独立核验；（2）品类层面的双重用途和生物安全治理风险，适用于任何能够建模进化或基因组动态的 AI
              生物学平台；（3）如果 Astromech 所称湿实验验证雄心需要越来越昂贵的基础设施，则存在资本强度风险；（4）与创始人 Ben Lamm 及 Colossal Biosciences
              网络绑定的关键人物和单一生态依赖风险；（5）在隐身状态下运营且没有披露 GTM 动作带来的执行风险。上述风险目前都没有 Astromech
              专属的披露缓释措施；缓释成熟度只能从品类模式定性评估，在公司披露更多信息前，几乎所有维度的剩余暴露都高。
