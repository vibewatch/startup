      - CV022
      - CV023
  - id: TV006
    title: 最终尽调追问表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 财务报表
        - 覆盖收入、烧钱速度和资金续航期的审计或审阅财务报表
        - 没有这项证据，无法验证 $2B 估值，也无法评估融资缺口风险
        - 把它列为融资轮前置条件，直接向公司管理层索取
      - - 客户证明
        - 具名客户、试点或意向书
        - 缺少它，本次尽调的客户假设只能靠同类公司类比支撑
        - 要求客户背调电话或披露具名试点
      - - 技术验证
        - 独立技术基准测试或第三方验证研究
        - 没有它，无法从技术上评估核心 “Large Life Model” 主张
        - 要求技术简报，或委托独立基准测试
      - - 合规与治理
        - 公开的合规 / 认证路线图和风险监督流程
        - 整个赛道受到监管关注，这项风险在上升，不是静态风险
        - 要求合规路线图，以及任何董事会层面的风险监督文件
    notes: 按底层披露缺口的严重程度排序。
    claimRefs:
      - CV021
      - CV024
