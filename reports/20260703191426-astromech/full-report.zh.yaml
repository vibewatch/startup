      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              增长驱动因素包括：单次模型训练的计算成本下降，多组学和结构生物学数据集扩大，药企成本压力使 AI 增强发现比蛮力筛选更有吸引力，以及农业和生物防御对可编程生物学的跨行业兴趣上升。约束同样实质：FDA、EMA
              等监管机构仍在为监管决策中的 AI 使用建立共同原则，这会拖慢最高价值治疗用例的采用；药企合作中的切换成本和数据权利谈判很重；ROI 证明需要多年临床或田间验证，多数 AI
              生物学供应商尚未跨过这一关；即便是软件优先的平台，湿实验验证循环的资本强度仍然高。治理研究者也把生物安全和双重用途审查标记为新出现的采用门槛，而不是已经稳定的经营成本；这可能给 Astromech
              自身定位触及的预测进化和病原体相关应用额外增加摩擦。
