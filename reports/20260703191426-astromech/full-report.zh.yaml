      - number: '2.3'
        title: 买家、用户与付款方分层及采用路径
        blocks:
          - type: paragraph
            body: >-
              潜在买家横跨大型药企 R&D 和商务拓展团队（平台授权和联合发现交易的预算持有人）、生物科技和农业生物运营团队（用湿实验结果评估模型输出的用户），以及考虑到治理研究者提出的双重用途框架，可能还有政府 /
              生物安全相邻项目。该领域可比公司呈现可重复的采用路径：先做平台展示和数据合作，再进入付费试点或共同开发里程碑交易，随后转向里程碑 /
              权利金经济或更宽的多年平台授权。公开证据显示，多个可比公司（Recursion、Schrödinger、Isomorphic Labs、LabGenius）正是以这种方式与具名药企伙伴转化；在尚无
              Astromech 已披露客户的情况下，这也是 Astromech 交易结构最清晰的类比。预算归 R&D / BD 领导层，而不是 IT 采购；这通常拉长销售周期，但一旦签约，合同耐久度更高。
