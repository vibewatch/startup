schemaVersion: report-v2
artifact: valuation
slug: astromech
runDate: '2026-07-03'
company:
  name: Astromech
chapter:
  number: 8
  title: Valuation
  summary: >-
    Astromech carries a reported ~$2 billion valuation against $40.5M of disclosed capital, zero disclosed revenue, zero
    disclosed named customers, and a founder-concentrated leadership profile. Weighed against public and private
    comparables (Absci, Schrödinger, Recursion, Relay Therapeutics, BenevolentAI, Insilico Medicine,
    Generate:Biomedicines), the recommendation of this chapter is Watch / Do Not Lead: the category thesis is credible,
    but Astromech-specific proof points are almost entirely absent, and entry discipline should wait for disclosure of
    at least one named customer and an independent financial statement.
sections:
  - id: investment-thesis-and-antithesis
    title: Investment thesis and anti-thesis
    body: >-
      The bull thesis rests on category momentum: AI-biology platforms (Recursion, Isomorphic Labs, Schrödinger,
      Insilico Medicine) have attracted large pharma partnerships and, in several cases, public listings, and
      Astromech's founder-led spinout from Colossal Biosciences gives it credible origination and brand halo within that
      category. The anti-thesis is that every company-specific proof point required to underwrite that thesis — revenue,
      named customers, technical benchmarks, compliance posture, and an independent leadership bench — remains
      undisclosed as of 2026-07-03, and the $2 billion valuation is not obviously supported by the $40.5M of disclosed
      capital raised to date. What would change the bull view: a disclosed named pharma partnership, a technical
      benchmark, or an independent financial statement. What would change the bear view: continued silence on all three
      past a reasonable post-stealth window, or a down-round.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
    tableRefs:
      - TV002
  - id: recommendation-and-stance
    title: Recommendation, confidence, and valuation stance
    body: >-
      This chapter's recommendation is Watch / Do Not Lead, with low-to-medium confidence given the volume of unresolved
      disclosure gaps documented across every prior chapter. Risk rating is High. Valuation stance is
      Unsupported-by-public-evidence: the reported $2 billion figure is a private-round narrative, not a figure
      corroborated by any independent filing, analyst note, or disclosed revenue multiple. No target return, hold
      period, or exit timeline can be responsibly set until Astromech discloses at least a first named customer and
      basic financial metrics; any capital committed today should be sized as a category-optionality bet rather than a
      proof-validated growth investment. This stance should be revisited immediately upon any material new disclosure,
      since the current recommendation reflects an information gap rather than a confirmed negative signal about
      Astromech's underlying technology or team.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
    tableRefs:
      - TV001
    figureRefs:
      - FV001
      - FV004
  - id: financing-and-valuation-context
    title: Financing and valuation context
    body: >-
      Astromech's disclosed financing consists of a $30 million initial Form D offering (2025-08-12) and a roughly $10.5
      million extension (2026-03-26), bringing total disclosed capital to $40.5 million against a reported ~$2 billion
      valuation — an unusually high valuation-to-capital ratio relative to comparable public AI-biology companies such
      as Absci and Schrödinger, whose market capitalizations are grounded in disclosed revenue and clinical/commercial
      milestones. No dilution schedule, liquidation-preference stack, or cap-table detail has been disclosed, so
      preference overhang cannot be assessed. Entry discipline today should assume the full $2 billion figure is
      unverified until an independent data point (a priced follow-on round, a disclosed revenue figure, or a public
      listing) becomes available.
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
  - id: bull-base-bear-scenarios
    title: Bull, base, and bear scenarios
    body: >-
      In the bull scenario, Astromech discloses a named pharma partnership and a technical benchmark within 12 months,
      supporting a follow-on round at or above the current $2 billion mark, consistent with the land-and-expand pattern
      observed at Recursion and Isomorphic Labs. In the base scenario, Astromech remains largely non-disclosing for
      another 12-18 months, raising a modest bridge or extension at a flat-to-down valuation while it builds toward a
      first customer. In the bear scenario, Astromech fails to secure a named customer or timely follow-on financing,
      and its valuation is written down toward a level more consistent with its disclosed capital base, mirroring the
      valuation compression risk flagged for the broader synthetic-biology category. Probability signal favors the base
      case given the volume of currently unresolved disclosure gaps.
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV016
    tableRefs:
      - TV003
    figureRefs:
      - FV002
  - id: comparable-set
    title: Comparable set
    body: >-
      The most relevant comparable set spans public and private AI-biology companies at varying stages: Absci and
      Schrödinger (public, disclosed revenue and market capitalization), Recursion (public, disclosed cash position and
      pharma partnerships), Relay Therapeutics (public, SEC-filed, named pharma partner), BenevolentAI (Euronext-listed,
      disclosed investor materials), Insilico Medicine (HKEX-listed via filing, disclosed IPO valuation), and
      Generate:Biomedicines (private, stock-analysis-style estimates only). Astromech's own $2 billion figure is a
      private-round narrative with no equivalent independent corroboration from any of these reference points, which is
      the central limitation of any comparable-based valuation exercise for this company today. Each comparable also
      differs materially in business-model scope from Astromech's single-platform narrative, meaning any multiple
      derived from this set should be treated as a directional signal rather than a precise valuation anchor.
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV020
    tableRefs:
      - TV004
  - id: exit-readiness-and-diligence-asks
    title: Exit readiness and final diligence asks
    body: >-
      Astromech is not exit-ready by any standard measure: no revenue, no named customer, no independent financial
      statement, and no disclosed technical benchmark exist to underwrite an eventual IPO or strategic-acquisition case.
      The most consequential thesis-break triggers are a failed or materially down-valued follow-on financing round,
      continued absence of any named customer past a reasonable post-stealth window, or an adverse category-wide
      regulatory or biosecurity action. The final diligence asks that would most improve underwriting confidence are: an
      audited or reviewed financial statement, a named customer or pilot reference, an independent technical benchmark
      or third-party validation study, and a disclosed compliance/certification roadmap.
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
    tableRefs:
      - TV005
      - TV006
