          support Astromech's positioning
        - A disclosed named pharma partnership or independent technical benchmark
      - - >-
          Bear: zero disclosed revenue, customers, technical benchmarks, or compliance posture make the $2B valuation
          unverifiable
        - Continued non-disclosure past a reasonable post-stealth window, or a down-round
      - - 'Bull: founder track record (Colossal Biosciences, prior ventures) suggests execution capability'
        - A disclosed independent technical leadership team reducing key-person concentration
      - - 'Bear: valuation-to-capital ratio ($2B vs $40.5M raised) is unusually high relative to public comparables'
        - A priced follow-on round or public listing corroborating the $2B figure independently
    notes: Each row pairs a thesis argument with the specific disclosure that would change the assessment.
    claimRefs:
      - CV001
