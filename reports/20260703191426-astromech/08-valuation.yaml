      - CV003
      - CV004
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation/return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - Named pharma partnership and technical benchmark disclosed within 12 months
        - Follow-on round priced at or above current $2B mark
        - Execution risk if disclosed benchmark underperforms category peers
        - Low-medium — no current evidence of an imminent disclosure
      - - Base
        - Continued limited disclosure for 12-18 months; modest bridge/extension financing
        - Flat-to-down valuation on next round pending proof points
        - Prolonged disclosure gap erodes investor confidence over time
        - Medium-high — consistent with current trajectory across all prior chapters
      - - Bear
        - No named customer or timely follow-on financing secured
        - Valuation written down toward a level consistent with disclosed capital base
        - Financing-gap risk and potential distressed-sale or wind-down scenario
        - Low-medium — would require a specific negative catalyst, none currently disclosed
    notes: >-
      Probability signals are qualitative assessments based on the disclosure trajectory documented across this
      diligence, not a modeled probability distribution.
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV016
  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Metric
      - Multiple/valuation/status
      - Relevance
      - Limitation
    rows:
      - - Astromech (actual)
        - Private-round valuation
        - ~$2B reported, $40.5M disclosed capital raised
        - Direct subject of this diligence
        - Entirely narrative-sourced; no independent corroboration
      - - Absci Corporation
        - Public market capitalization
        - Disclosed via stock-analysis statistics
        - Directly comparable public AI-biology peer
        - Market cap reflects public trading dynamics, not a private-round comparable
      - - Schrödinger
        - Public market capitalization
        - Disclosed via stock-analysis statistics
        - Directly comparable public AI-biology peer with dual software/pipeline model
        - Broader business mix than Astromech's single-platform narrative
      - - Recursion Pharmaceuticals
        - Public market capitalization / cash position
        - Disclosed via investor-relations materials
        - Named comparable with disclosed pharma partnership (Bayer)
        - Larger, more mature company than Astromech at this stage
      - - Relay Therapeutics
        - Public market capitalization
        - Disclosed via SEC EDGAR filings and stock statistics
        - Named comparable with disclosed pharma partnership (Novartis)
        - Clinical-stage biotech model differs from Astromech's platform-only narrative
      - - BenevolentAI
        - Euronext-listed valuation
        - Disclosed via investor materials
        - Comparable public listing outcome for an AI-biology platform
        - Post-repositioning company profile differs materially from Astromech's stage
      - - Insilico Medicine
        - IPO valuation
        - Disclosed via HKEX filing
        - Comparable recent AI-biology IPO
        - Different geography (Hong Kong listing) and business mix
      - - Generate:Biomedicines
        - Private valuation estimate
        - Estimated via stock-analysis-style statistics
        - Comparable private AI-biology platform at a similar funding stage
        - Valuation estimate is a third-party approximation, not a disclosed round figure
    notes: >-
      Coverage is a representative sample of the most relevant public and private AI-biology comparables identified in
      retained sources, not an exhaustive census of every possible comparable company.
    enumerationScope:
      coverage: sample
      basis: >-
        Sample limited to named AI-biology comparables with at least one retained public valuation,
        market-capitalization, or IPO data point as of 2026-07-03.
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV020
  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Failed or down-valued follow-on financing round
        - Any priced round at or below the disclosed $40.5M capital base valuation-equivalent
        - Directly undermines the $2B valuation narrative
        - Re-underwrite the entire investment thesis at the new valuation
      - - Continued absence of a named customer
        - No named customer disclosed within 12-18 months of stealth exit
        - Confirms the customer-acquisition risk flagged in Customers and Risks
        - Downgrade recommendation from Watch to Pass
      - - Adverse category-wide regulatory or biosecurity action
        - Any binding enforcement action affecting AI-biology sequence modeling
        - Elevates regulatory risk across the entire category, not just Astromech
        - Reassess the category thesis broadly, not only Astromech specifically
      - - Founder departure without succession plan
        - Any disclosed departure of Ben Lamm without a named successor
        - Directly elevates the key-person risk flagged in Risks
        - Immediate re-underwriting; treat as a thesis-break event
    notes: >-
      Triggers are monitorable from public sources going forward even though none are currently observed as of
      2026-07-03.
    claimRefs:
      - CV022
      - CV023
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner/diligence path
    rows:
      - - Financial statements
        - Audited or reviewed financial statement covering revenue, burn, and runway
        - Cannot verify the $2B valuation or assess financing-gap risk without this
        - Request directly from company management as a financing-round precondition
      - - Customer proof
        - A named customer, pilot, or letter of intent
        - The entire customer thesis in this diligence relies on category analogy without this
        - Request a customer reference call or named pilot disclosure
      - - Technical validation
        - An independent technical benchmark or third-party validation study
        - The core "Large Life Model" claim cannot be technically evaluated without this
        - Request a technical briefing or commissioned independent benchmark
      - - Compliance and governance
        - A disclosed compliance/certification roadmap and risk-oversight process
        - Category-wide regulatory attention makes this a rising rather than static risk
        - Request a compliance roadmap and any board-level risk-oversight documentation
    notes: Ordered by priority based on the severity of the underlying disclosure gap.
    claimRefs:
      - CV021
      - CV024
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The recommendation logic chains from an unproven scale/proof position, through a high risk rating driven by
      pervasive disclosure gaps, to a Watch/Do-Not-Lead stance pending independent verification.
    data:
      nodes:
        - id: rl1
          label: Category momentum and founder credibility (scale signal)
        - id: rl2
          label: Near-total absence of company-specific proof points
        - id: rl3
          label: High risk rating (regulatory, financial, key-person, disclosure)
        - id: rl4
          label: 'Valuation stance: unsupported by independent evidence'
        - id: rl5
          label: 'Recommendation: Watch / Do Not Lead'
      edges:
        - from: rl1
          to: rl2
          label: category momentum does not substitute for company proof
        - from: rl2
          to: rl3
          label: disclosure gaps drive risk rating higher
        - from: rl3
          to: rl4
          label: high risk undermines confidence in the reported valuation
        - from: rl4
          to: rl5
          label: unsupported valuation plus high risk yields a cautious recommendation
    claimRefs:
      - CV005
      - CV006
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      Astromech's implied valuation is most sensitive to whether a first named customer and an independent financial
      statement are disclosed within the next 12-18 months.
    approximationNotes: >-
      Percentages are illustrative sensitivity signals reflecting the relative importance of each disclosure event, not
      a modeled valuation output.
    data:
      items:
        - label: No new disclosure (base case)
          value: 0
          unit: illustrative valuation change (%)
        - label: Named customer disclosed
          value: 25
          unit: illustrative valuation change (%)
        - label: Independent financial statement disclosed
          value: 15
          unit: illustrative valuation change (%)
        - label: Technical benchmark independently validated
          value: 20
          unit: illustrative valuation change (%)
        - label: Continued non-disclosure past 18 months
          value: -30
          unit: illustrative valuation change (%)
    claimRefs:
      - CV014
      - CV015
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Given the near-total absence of independent verification, this chapter frames Astromech's valuation as a wide,
      low-confidence range rather than a precise estimate.
    approximationNotes: >-
      Range reflects category-comparable multiples and the disclosed $40.5M capital base rather than any
      Astromech-specific financial metric.
    data:
      items:
        - label: Low (capital-base-anchored, no independent corroboration)
          low: 200
          base: 400
          high: 600
          unit: $M
        - label: Base (private-round narrative as reported)
          low: 1500
          base: 2000
          high: 2500
          unit: $M
        - label: High (bull case, category-peer public-comp multiple)
          low: 2500
          base: 3500
          high: 5000
          unit: $M
    claimRefs:
      - CV009
      - CV010
      - CV011
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      Astromech scores lowest on proof and evidence quality and highest on category/market momentum, consistent with the
      chapter's Watch/Do-Not-Lead recommendation.
    data:
      items:
        - label: Market/category momentum
          value: Strong
          unit: qualitative score
        - label: Company-specific proof (customers, revenue, benchmarks)
          value: Very weak
          unit: qualitative score
        - label: Moat/differentiation evidence
          value: Weak — unverified
          unit: qualitative score
        - label: Unit economics visibility
          value: None disclosed
          unit: qualitative score
        - label: Risk profile
          value: High
          unit: qualitative score
        - label: Overall evidence quality
          value: Low
          unit: qualitative score
    claimRefs:
      - CV007
      - CV008
