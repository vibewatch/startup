companyProfile:
  summary: Astromech is a private Austin-based biological AI startup spun out of Colossal Biosciences and founded by Ben Lamm and George Church. The company describes its platform as a Large Life Model that combines evolutionary modeling, multi-species data, pangenomics, and future multi-omics integration to support applications in medicine, agriculture, and programmable biology. Public disclosures confirm a $30 million 2025 financing, a roughly $10.5 million 2026 seed extension, and widespread 2026 reporting of a roughly $2 billion valuation, while leaving revenue, customer, and unit-economics disclosure largely absent.
  founders:
    - name: Ben Lamm
      role: Co-founder / CEO
      background: Colossal Biosciences co-founder and operating entrepreneur behind the parent spinout ecosystem.
      claimRefs: [CO011]
    - name: George Church
      role: Co-founder / advisor
      background: Genomics and synthetic-biology scientist whose reputation anchors the scientific thesis.
      claimRefs: [CO012]
  foundingLocation: Austin, Texas
  headquarters: Austin, Texas
  productSummary: A biological AI platform framed as a Large Life Model for multi-species evolutionary, genomic, and multi-omics prediction rather than a single narrow drug-discovery workflow tool.
  customerFocus: Likely large-pharma, biotech, agbio, and research users seeking predictive biology tooling, though no paying customers are publicly disclosed.
  businessModel: Likely partnership-led platform licensing, milestone, or research-service model, but no public pricing or contract structure is disclosed.
