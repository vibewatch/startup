  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue
      missingEvidence: Current revenue, ARR, bookings, and any pilot-to-paid conversion metrics.
      whyItMatters: The valuation cannot be conventionally underwritten without a commercial denominator.
      diligencePath: Request board deck, KPI packet, and latest operating forecast.
      relatedQuestionRefs:
        - QO017
    - type: private-evidence-only
      severity: material
      topic: customers
      missingEvidence: Named customer or collaboration roster with paid versus exploratory program split.
      whyItMatters: Without customer evidence, the story remains mostly technical aspiration plus founder credibility.
      diligencePath: Request active program list and revenue concentration schedule.
      relatedQuestionRefs:
        - QO018
        - QO019
      relatedTableRefs:
        - TO001
    - type: private-evidence-only
      severity: material
      topic: cap-table
      missingEvidence: Investor identities, price per share, preference stack, and any parent-company ownership or service agreements.
      whyItMatters: The headline valuation may not equal transferable entry value or governance quality.
      diligencePath: Request cap table, charter, SAFE/preferred terms, and intercompany agreements.
      relatedQuestionRefs:
        - QO015
        - QO016
      relatedTableRefs:
        - TO003
    - type: enumeration-incomplete
      severity: minor
      topic: stakeholder-map
      missingEvidence: Full investor and governance roster to complete the stakeholder map.
      whyItMatters: Public visibility covers founders and parent context but not the full control structure.
      diligencePath: Obtain board observer list, investor rights summary, and parent-spinout service schedule.
      relatedQuestionRefs:
        - QO015
      relatedTableRefs:
        - TO003
