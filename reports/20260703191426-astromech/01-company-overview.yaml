company:
  name: Astromech
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Astromech is an Austin-based biological AI startup spun out of Colossal Biosciences in 2025 and publicly valued at
    roughly $2 billion by March-April 2026 despite only $40.5 million of disclosed capital. The public record is
    strongest on the company's technical ambition, founder pedigree, and spinout context, but still weak on revenue,
    customer disclosure, headcount, and cap-table detail.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Astromech presents itself as a biological AI company building what it calls a “Large Life Model” rather than a
      conventional drug-discovery point tool. The official website frames the system as an autonomous biological
      intelligence layer intended to model multi-species transcriptomic, evolutionary, and structural data so
      researchers can navigate the “code of life” rather than merely summarize it. Third-party coverage aligns with that
      positioning, describing Astromech as a predictive-biology engine meant to forecast evolution, disease risk, and
      biological vulnerabilities before they become clinically obvious. In diligence terms, the practical takeaway is
      that Astromech is best understood as an early platform company sitting at the intersection of AI infrastructure,
      computational biology, and synthetic-biology design. That creates unusually broad optionality, but it also means
      the current company story is substantially more platform vision than commercial proof as of 2026-07-03.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
      - CO008
      - CO009
      - CO010
    tableRefs:
      - TO001
    figureRefs:
      - FO002
  - id: founders-spinout-and-governance
    title: Founders, spinout context, and governance
    body: >-
      The public narrative around Astromech is tightly tied to Ben Lamm and George Church. Lamm is the operating
      entrepreneur behind Colossal Biosciences, while Church provides scientific credibility from synthetic biology,
      genomics, and broader Harvard-linked research. Both Colossal’s own write-up and outside reporting describe
      Astromech as a deliberate spinout rather than an incidental side project, with Colossal's de-extinction program
      acting as the technical and data-rich parent context. That matters because Astromech likely inherits both
      reputational leverage and key-person concentration from Colossal. Public sources confirm Delaware incorporation,
      an Austin office address, and a very small disclosed investor count in the original Form D, but they do not
      disclose a full board, governance rights, ownership split, or independent oversight structure. The diligence
      implication is that governance credibility currently rides much more on founder quality and parent-company
      reputation than on independently visible corporate controls. Public hiring signals show functional breadth, but
      those signals are still weaker than a named executive roster or a clearly disclosed board structure.
    claimRefs:
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
      - CO016
      - CO017
      - CO018
    tableRefs:
      - TO002
      - TO003
  - id: funding-stage-and-scale-signals
    title: Funding, stage, and scale signals
    body: >-
      Funding history is the clearest externally verifiable scale signal. Astromech's first public Form D shows a $30
      million equity raise dated August 2025, while the March 2026 Form D adds roughly $10.5 million, bringing disclosed
      capital to $40.5 million. Multiple 2026 media sources pair that modest capital base with a roughly $2 billion
      valuation, describing the company as a very young spinout that achieved unicorn status within nine months. That
      gap between cash raised and implied valuation is central to the investment case: it suggests investors are
      underwriting strategic option value, proprietary scientific context, and Colossal adjacency rather than current
      commercial metrics. Public sources do not disclose revenue, ARR, current customer count, or current headcount. As
      a result, the supportable current-stage label is not “scaled commercial biotech” but “disclosure-light seed
      extension / early platform build” with a valuation that already prices in substantial future success.
    claimRefs:
      - CO019
      - CO020
      - CO021
      - CO022
      - CO023
      - CO024
      - CO025
      - CO026
      - CO027
      - CO028
    figureRefs:
      - FO003
  - id: milestones-and-adverse-screen
    title: Milestones and adverse screen
    body: >-
      The dated public chronology is short but meaningful. By August 2025, Astromech had filed its first Form D and
      associated media coverage framed the company as an AI-biotechnology platform pursuing predictive modeling. By
      March and April 2026, public coverage converged on the same headline facts: the company had added a $10.5 million
      seed extension, reached a $2 billion valuation, and was positioning itself as a platform for medicine,
      agriculture, and programmable biology. The main negative signal is not litigation or a product incident but
      evidence quality itself: the company remains pre-revenue and disclosure-light, while outside coverage often
      repeats founder framing rather than offering independent commercial validation. Public legal sources surfaced
      corporate registration and website policies but no disclosed lawsuits or sanctions through runDate. More broadly,
      external strategy work on synthetic-biology scale-up warns that platform companies can accumulate narrative value
      before they demonstrate durable commercial execution. That should be treated as a light screen, not as proof of
      legal cleanliness or operational maturity.
    claimRefs:
      - CO029
      - CO030
      - CO031
      - CO032
      - CO033
      - CO034
      - CO035
      - CO036
      - CO037
