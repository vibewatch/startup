slug: astromech
runDate: '2026-07-03'
company:
  name: Astromech
chapter:
  number: 6
  title: Customers
  summary: >-
    Astromech has zero disclosed named customers, pilots, or paying accounts as of 2026-07-03. Every named-customer,
    adoption, retention, and expansion pattern in this chapter is drawn from comparable AI-biology competitors'
    disclosed pharma partnerships (Bayer, Johnson & Johnson, Sanofi, Eli Lilly, Novartis, AstraZeneca, Merck) to
    establish what real category-level customer proof looks like, against which Astromech's complete lack of disclosure
    stands in direct contrast.
sections:
  - id: customer-base-segmentation
    title: Customer base segmentation
    body: >-
      Astromech has not disclosed a customer base, so no buyer/user/payer segmentation exists for the company itself. By
      category analogy, comparable AI-biology platforms segment buyers into large pharma R&D organizations (Bayer with
      Recursion, Johnson & Johnson with Isomorphic Labs), mid-cap biopharma (Sanofi with LabGenius, AstraZeneca with
      BenevolentAI, Merck with Absci), and long-term strategic collaborators (Eli Lilly with Schrödinger, Novartis with
      Relay Therapeutics). If Astromech pursues a similar buyer profile, R&D or business-development leadership would
      plausibly be the buyer, bench or computational scientists the users, and R&D budget the payer, consistent with the
      buyer map already established in Market Analysis. No revenue band, geography, or channel segmentation is possible
      for Astromech given the complete absence of disclosed customers.
    claimRefs:
      - CU001
      - CU002
      - CU003
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: adoption-trajectory
    title: Adoption trajectory
    body: >-
      No retained public source discloses any Astromech deployment, pilot, account count, or utilization metric.
      Comparable competitors demonstrate multi-year adoption trajectories: Recursion's Bayer collaboration and NVIDIA
      infrastructure partnership have continued across multiple disclosed phases, and Isomorphic Labs' Johnson & Johnson
      collaboration was structured as a multi-modality, multi-year research program from inception. These patterns
      illustrate that adoption in this category typically begins with a single flagship partnership and expands over
      multiple years rather than through rapid self-serve signup, which is the plausible adoption path for Astromech if
      and when it discloses a first customer. As of 2026-07-03, Astromech sits at the pre-adoption stage of this
      trajectory with zero disclosed accounts.
    claimRefs:
      - CU004
      - CU005
      - CU006
    tableRefs:
      - TU002
    figureRefs:
      - FU002
  - id: named-customer-proof
    title: Named customer proof
    body: >-
      Astromech discloses zero named customers, pilots, or reference accounts in any retained public source. This
      chapter therefore enumerates named customer-proof examples from comparable competitors — Bayer, Johnson & Johnson,
      Sanofi, Eli Lilly, Novartis, AstraZeneca, and Merck — as category reference points, explicitly not as Astromech's
      own customers. Each of these named relationships is corroborated by either the competitor's own disclosure or
      independent press coverage, and most describe production or ongoing research collaborations rather than
      early-stage pilots. Astromech's row in the enumeration table below is included for direct contrast and shows a
      complete absence of any equivalent proof point. This sample is representative rather than exhaustive: each
      competitor plausibly holds additional undisclosed or smaller partnerships beyond the single flagship example used
      here, so the true category-wide partnership count is almost certainly higher than the seven relationships
      enumerated in this chapter.
    claimRefs:
      - CU007
      - CU008
      - CU009
      - CU010
    tableRefs:
      - TU003
    figureRefs:
      - FU003
  - id: retention-durability-and-satisfaction
    title: Retention, durability, and satisfaction
    body: >-
      No retained source discloses an Astromech renewal rate, net or gross revenue retention, churn figure, contract
      length, or customer-satisfaction signal, because no customer relationship has been disclosed to measure. Category
      analogy is again the only available lens: multi-year, renewed pharma collaborations such as Recursion-Bayer and
      Schrödinger-Lilly suggest that once a partnership is established in this category, it tends to be durable and
      multi-phase rather than single-transaction, likely reflecting high switching costs and deep data integration once
      a partner is live. This pattern cannot be verified for Astromech specifically, and no satisfaction or retention
      proxy exists for a company with no disclosed customer relationship to retain.
    claimRefs:
      - CU011
      - CU012
      - CU013
    tableRefs:
      - TU004
    figureRefs:
      - FU004
  - id: expansion-and-concentration-risk
    title: Expansion and concentration risk
    body: >-
      Astromech carries the most extreme possible concentration risk profile in this category: 100% of its customer base
      is currently undisclosed or non-existent, meaning there is no revenue concentration to measure but also no proof
      of any expansion motion. Comparable competitors show a land-and-expand pattern where an initial pharma
      collaboration (e.g., a single program with Bayer or Sanofi) expands into a broader multi-year or multi-program
      relationship over time; if Astromech eventually secures a first named partner, over-reliance on that single
      account would be a material concentration risk until a second and third named relationship are disclosed.
      Astromech's current diligence-relevant expansion risk is therefore not customer concentration but customer absence
      — the inverse of the risk typically assessed in this chapter. Novartis and AstraZeneca each maintain named
      relationships with more than one AI-biology platform vendor, reinforcing that mature buyers in this category
      rarely single-source, which further underscores how early-stage Astromech's go-to-market position remains relative
      to the rest of the profiled competitive set.
    claimRefs:
      - CU014
      - CU015
    tableRefs:
      - TU005
