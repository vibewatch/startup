  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Astromech's addressable spend sits inside three adjacent budget pools rather than one clean category: (1)
              AI-enabled drug discovery and biologics design tooling bought by pharma and biotech R&D groups, (2)
              synthetic-biology and computational-biology infrastructure bought by both pharma and
              agricultural/industrial-biotech buyers, and (3) broader predictive-biology or biosecurity-adjacent
              analytics that could serve government and defense-adjacent buyers. Included spend is R&D software
              licensing, computational services, and multi-omics data platforms; excluded spend is wet-lab CRO
              execution, manufacturing, and clinical-trial operations, which Astromech does not appear to offer
              directly. The status-quo substitute for most buyers today is a mix of in-house bioinformatics teams,
              point-solution AI vendors (Recursion, Insilico, Schrödinger, Isomorphic Labs), and traditional
              structure-based or phenotypic screening. Public sources do not show Astromech naming a specific target
              buyer budget line, so the boundary drawn here is inferred from platform positioning and comparable-company
              categorization rather than a company-disclosed TAM statement.
