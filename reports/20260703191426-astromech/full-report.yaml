        title: Product definition in customer workflow terms
        blocks:
          - type: paragraph
            body: >-
              Astromech positions its Large Life Model as a general-purpose biological AI system intended to model
              evolutionary and multi-omics processes across species, with stated applications spanning medicine,
              agriculture, and biosecurity. In workflow terms, the platform is framed as an input-to-prediction system:
              a user or partner would supply a biological question or dataset and receive a model-generated prediction
              about evolutionary trajectory, trait behavior, or molecular outcome. No retained public source describes a
              concrete user workflow step-by-step, an API, a user interface, or a specific deliverable format, which
              distinguishes Astromech from technical-docs-rich peers such as Schrödinger and Absci that publish detailed
              workflow descriptions alongside their platforms. The absence of a documented workflow is itself a notable
              diligence gap given the platform's broad application claims.
