      - number: '3.4'
        title: Switching cost, lock-in, and distribution power
        blocks:
          - type: paragraph
            body: >-
              Switching costs in this category are driven by data-integration depth and multi-year collaboration
              structures rather than simple software lock-in. Once a pharma partner integrates a competitor's model
              outputs into an active discovery program, replacing that vendor becomes costly regardless of a newer
              entrant's technical claims, which structurally favors already-partnered incumbents such as Recursion,
              Schrödinger, and Isomorphic Labs over any new entrant, including Astromech. Multi-homing (buyers using
              more than one AI-biology vendor across different programs) appears common at large pharma given the
              diversity of named partnerships across competitors, which lowers the bar for Astromech to win a first
              pilot but raises the bar for winning exclusivity. Distribution power is asymmetric: public-company
              competitors can use investor relations, published financial results, and analyst coverage as ongoing
              credibility and top-of-funnel signals that Astromech, as an undisclosed private company, cannot currently
              replicate.
            claimRefs:
              - CP021
              - CP022
              - CP023
              - CP024
      - number: '3.5'
        title: Moat durability and adverse competitor evidence
        blocks:
          - type: paragraph
            body: >-
              No competitor in this set has a settled, adverse-proof moat: BCG's industrial-scale-up research explicitly
              cautions that synthetic-biology and AI-biology commercialization claims broadly outrun demonstrated
              industrial results, a caution that applies to the entire competitive set, not just Astromech. Public
              evidence does not show head-to-head displacement of an incumbent by any of these AI-native entrants;
              instead, most named deals appear additive to existing pharma R&D budgets rather than substitutive.
              Commoditization risk is rising as more well-capitalized entrants adopt similar generative and multi-omics
              techniques, which could compress differentiation for the whole category, including Astromech, faster than
              any single company's roadmap. Astromech's specific moat claim — multi-species evolutionary modeling — has
              no public head-to-head benchmark against any peer, which is itself the most important adverse finding in
              this chapter: differentiation is asserted, not demonstrated.
            claimRefs:
