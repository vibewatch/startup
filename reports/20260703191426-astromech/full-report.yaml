      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Growth drivers include falling compute cost per model-training run, growing multi-omics and
              structural-biology datasets, pharma cost pressure that favors AI-augmented discovery over brute-force
              screening, and rising cross-industry interest in programmable biology for agriculture and biodefense.
              Constraints are equally material: regulators including the FDA and EMA are still building common
              principles for AI use in regulatory decision-making, which slows adoption in the highest-value therapeutic
              use cases; switching costs and data-rights negotiations are heavy in pharma partnerships; ROI proof
              requires multi-year clinical or field validation that most AI-biology vendors have not yet cleared; and
              capital intensity for wet-lab validation loops remains high even for software-forward platforms.
              Governance researchers also flag biosecurity and dual-use review as an emerging adoption gate rather than
              a settled cost of doing business, which could add friction specifically for predictive-evolution and
              pathogen-relevant applications that Astromech's own positioning touches.
