      - CU008
      - CU009
      - CU010
      - CU011
  - id: FU004
    title: Retention / repeat cohort
    type: cohort
    layout: standard
    summary: >-
      This cohort view is an illustrative category model only — no Astromech-specific or exact competitor retention
      percentage exists in any retained source.
    approximationNotes: >-
      Percentages are an illustrative category model built from qualitative multi-year renewal patterns disclosed for
      comparable pharma partnerships; they are not Astromech-specific and not exact disclosed competitor figures.
    data:
