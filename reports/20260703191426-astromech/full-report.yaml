      - number: '4.2'
        title: Go-to-market motion and sales efficiency
        blocks:
          - type: paragraph
            body: >-
              No disclosed source describes Astromech's sales cycle length, customer-acquisition cost, payback period,
              or channel economics. Comparable companies in this category rely on high-touch, long-cycle enterprise
              pharma sales motions rather than self-serve adoption; Isomorphic Labs and Relay Therapeutics both
              structure go-to-market around direct strategic partnerships rather than a transactional sales funnel, and
              Recursion and Schrödinger similarly report multi-year, relationship-driven deal cycles with named pharma
              partners. If Astromech follows this same category pattern, its go-to-market motion would likely require a
              dedicated business-development function and multi-quarter sales cycles rather than a scalable low-touch
              channel, which has capital-efficiency implications given the company's current lack of disclosed
              commercial headcount or partnerships. No CAC, payback, or channel-economics proxy specific to Astromech
              exists in any retained public source.
            claimRefs:
              - CI006
              - CI007
              - CI008
      - number: '4.3'
        title: Cost structure, margins, and capital intensity
        blocks:
          - type: paragraph
            body: >-
              Astromech has not disclosed a cost structure, gross margin, working-capital position, or
              capital-expenditure plan. As a computational biology platform rather than a pure-play wet-lab company, its
              cost base plausibly skews toward compute infrastructure, model-training expense, and specialized research
              headcount rather than manufacturing capex; this is consistent with the pattern at Recursion and
              Schrödinger, both of which report meaningful cloud/compute cost lines alongside R&D headcount as their
              largest cost drivers. Absci's integrated wet-lab-plus-AI model shows materially higher capital intensity
              than pure computational peers because physical experimentation adds facility, reagent, and instrumentation
              costs; if Astromech's stated multi-omics and evolutionary modeling ambitions eventually require wet-lab
              validation loops, its capital intensity could rise toward the Absci pattern rather than staying at the
              lighter-weight Recursion/Schrödinger software-first cost profile. No Astromech-specific gross margin,
              working-capital, or capex figure is available to test either scenario directly.
            claimRefs:
              - CI009
