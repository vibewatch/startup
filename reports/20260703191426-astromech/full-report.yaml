      - CR003
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: standard
    summary: >-
      Illustrates how Astromech's core risks propagate from disclosure and regulatory exposure through to financing,
      customers, and ultimate valuation outcomes.
    approximationNotes: >-
      Edges represent plausible causal transmission paths inferred from category patterns and Astromech's disclosed
      structure, not a company-confirmed risk model.
    data:
      nodes:
        - id: rt1
          label: Disclosure gap (no customers/financials/certifications)
        - id: rt2
          label: Category regulatory/biosecurity risk
        - id: rt3
          label: Capital-intensity / financing risk
        - id: rt4
          label: Customer acquisition risk
        - id: rt5
          label: Financing / runway risk
        - id: rt6
          label: Valuation / exit risk
      edges:
        - from: rt1
          to: rt4
          label: no proof points slow customer acquisition
        - from: rt2
          to: rt4
          label: regulatory uncertainty slows buyer adoption
        - from: rt3
          to: rt5
          label: higher capital intensity shortens runway
        - from: rt4
          to: rt5
          label: slower customer acquisition delays revenue-backed financing
        - from: rt5
          to: rt6
          label: financing stress compresses achievable valuation
    claimRefs:
      - CR026
      - CR027
  - id: FR003
    title: Dependency map
    type: dag
    layout: standard
    summary: >-
      Astromech's most material dependency is its shared ecosystem with Colossal Biosciences; compute/infrastructure and
      capital-provider dependencies are disclosed only at a shallow level.
    approximationNotes: >-
      Nodes and edges reflect the only dependencies identifiable from retained public sources; undisclosed dependencies
      (e.g., a compute provider) are shown as unresolved rather than omitted.
    data:
      nodes:
        - id: d1
          label: Astromech
        - id: d2
          label: Colossal Biosciences (parent/ecosystem)
        - id: d3
          label: Undisclosed compute/infrastructure provider
        - id: d4
          label: Undisclosed seed/extension capital providers
      edges:
        - from: d2
          to: d1
          label: origination, brand, and reputational dependency
        - from: d3
          to: d1
          label: unconfirmed infrastructure dependency
        - from: d4
          to: d1
          label: financing dependency for continued operation
    claimRefs:
      - CR016
      - CR017
      - CR020
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The recommendation logic chains from an unproven scale/proof position, through a high risk rating driven by
      pervasive disclosure gaps, to a Watch/Do-Not-Lead stance pending independent verification.
    data:
      nodes:
        - id: rl1
          label: Category momentum and founder credibility (scale signal)
        - id: rl2
          label: Near-total absence of company-specific proof points
        - id: rl3
          label: High risk rating (regulatory, financial, key-person, disclosure)
        - id: rl4
          label: 'Valuation stance: unsupported by independent evidence'
        - id: rl5
          label: 'Recommendation: Watch / Do Not Lead'
      edges:
        - from: rl1
          to: rl2
          label: category momentum does not substitute for company proof
        - from: rl2
          to: rl3
          label: disclosure gaps drive risk rating higher
        - from: rl3
          to: rl4
          label: high risk undermines confidence in the reported valuation
        - from: rl4
          to: rl5
          label: unsupported valuation plus high risk yields a cautious recommendation
    claimRefs:
      - CV005
      - CV006
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      Astromech's implied valuation is most sensitive to whether a first named customer and an independent financial
      statement are disclosed within the next 12-18 months.
    approximationNotes: >-
      Percentages are illustrative sensitivity signals reflecting the relative importance of each disclosure event, not
      a modeled valuation output.
    data:
      items:
        - label: No new disclosure (base case)
          value: 0
          unit: illustrative valuation change (%)
        - label: Named customer disclosed
          value: 25
          unit: illustrative valuation change (%)
        - label: Independent financial statement disclosed
          value: 15
          unit: illustrative valuation change (%)
        - label: Technical benchmark independently validated
          value: 20
          unit: illustrative valuation change (%)
        - label: Continued non-disclosure past 18 months
          value: -30
          unit: illustrative valuation change (%)
    claimRefs:
      - CV014
      - CV015
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Given the near-total absence of independent verification, this chapter frames Astromech's valuation as a wide,
      low-confidence range rather than a precise estimate.
    approximationNotes: >-
      Range reflects category-comparable multiples and the disclosed $40.5M capital base rather than any
      Astromech-specific financial metric.
    data:
      items:
        - label: Low (capital-base-anchored, no independent corroboration)
          low: 200
          base: 400
          high: 600
          unit: $M
        - label: Base (private-round narrative as reported)
          low: 1500
          base: 2000
          high: 2500
          unit: $M
        - label: High (bull case, category-peer public-comp multiple)
          low: 2500
          base: 3500
          high: 5000
          unit: $M
    claimRefs:
      - CV009
      - CV010
      - CV011
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      Astromech scores lowest on proof and evidence quality and highest on category/market momentum, consistent with the
      chapter's Watch/Do-Not-Lead recommendation.
    data:
      items:
        - label: Market/category momentum
          value: Strong
          unit: qualitative score
        - label: Company-specific proof (customers, revenue, benchmarks)
          value: Very weak
          unit: qualitative score
        - label: Moat/differentiation evidence
          value: Weak — unverified
          unit: qualitative score
        - label: Unit economics visibility
          value: None disclosed
          unit: qualitative score
        - label: Risk profile
          value: High
          unit: qualitative score
        - label: Overall evidence quality
          value: Low
          unit: qualitative score
    claimRefs:
      - CV007
      - CV008
