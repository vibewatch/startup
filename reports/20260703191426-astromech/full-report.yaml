      - number: '1.2'
        title: Founders, spinout context, and governance
        blocks:
          - type: paragraph
            body: >-
              The public narrative around Astromech is tightly tied to Ben Lamm and George Church. Lamm is the operating
              entrepreneur behind Colossal Biosciences, while Church provides scientific credibility from synthetic
              biology, genomics, and broader Harvard-linked research. Both Colossal’s own write-up and outside reporting
              describe Astromech as a deliberate spinout rather than an incidental side project, with Colossal's
              de-extinction program acting as the technical and data-rich parent context. That matters because Astromech
              likely inherits both reputational leverage and key-person concentration from Colossal. Public sources
              confirm Delaware incorporation, an Austin office address, and a very small disclosed investor count in the
              original Form D, but they do not disclose a full board, governance rights, ownership split, or independent
              oversight structure. The diligence implication is that governance credibility currently rides much more on
              founder quality and parent-company reputation than on independently visible corporate controls. Public
              hiring signals show functional breadth, but those signals are still weaker than a named executive roster
              or a clearly disclosed board structure.
