        title: Buyer, user, and payer segmentation and adoption path
        blocks:
          - type: paragraph
            body: >-
              The likely buyer set spans large pharma R&D and business-development groups (budget owners for platform
              licensing and joint-discovery deals), biotech and agbio operating teams (users evaluating model outputs
              against wet-lab results), and potentially government/biosecurity-adjacent programs given the dual-use
              framing raised by governance researchers. Comparable companies in this space show a repeatable adoption
              path: platform demonstration and data partnership, followed by a paid pilot or co-development milestone
              deal, followed by either milestone/royalty economics or a broader multi-year platform license. Public
              evidence shows several comparable companies (Recursion, Schrödinger, Isomorphic Labs, LabGenius)
              converting exactly this way with named pharma partners, which is the clearest analog for how an Astromech
              deal would likely be structured given no disclosed Astromech customers exist yet. Budget ownership sits
              with R&D/BD leadership rather than IT procurement, which typically lengthens sales cycles but increases
              contract durability once signed.
