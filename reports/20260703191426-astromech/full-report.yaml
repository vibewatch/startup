      - number: '2.2'
        title: Sizing the market with multiple lenses
        blocks:
          - type: paragraph
            body: >-
              No single TAM figure is reliable here, so this chapter triangulates across lenses. Analyst estimates for
              the AI-in-drug-discovery segment alone cluster in the $2-3B range for 2024-2025, growing at roughly 28-46%
              CAGR toward $10-20B-plus by the early-to-mid 2030s depending on methodology and inclusion of adjacent
              services. The broader AI-in-biotechnology framing used by MarketsandMarkets is larger still, spanning
              diagnostics and manufacturing use cases beyond Astromech's apparent scope. Separately, the
              AI-in-synthetic-biology sub-segment is estimated in the hundreds of millions today, scaling multiples
              higher by the early 2030s, while OECD and BCG both frame synthetic biology's industrial translation as
              real but slower than headline TAM figures imply. A defensible SAM for a pre-commercial platform like
              Astromech is therefore best treated as a thin evidence-constrained wedge — plausibly
              low-single-digit-billions of near-term serviceable pharma/agbio R&D tooling spend — rather than the full
              multi-tens-of-billions headline TAM, and SOM is effectively undefined until the company discloses its
