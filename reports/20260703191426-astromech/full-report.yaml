  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape of direct and adjacent competitors
        blocks:
          - type: paragraph
            body: >-
              The competitive set spans several distinct postures. Direct peers building general AI-biology or
              drug-design platforms include Recursion Pharmaceuticals, Insilico Medicine, Isomorphic Labs, and
              Schrödinger. Adjacent players focused on protein/antibody design and generative biology include
              Generate:Biomedicines, Absci, and LabGenius. BenevolentAI represents an earlier-generation knowledge-graph
              approach now repositioning around narrower pharma partnerships. Relay Therapeutics represents a
              dynamics-based structural-biology alternative technical approach to the same drug-discovery problem.
              Status-quo substitutes remain in-house pharma bioinformatics teams and traditional high-throughput or
              structure-based screening, which is still the default at most incumbents. Internal build is a live threat
              given that large pharma R&D organizations increasingly hire in-house computational biology teams rather
              than buying platform access outright. Likely entrants include well-funded AI labs pivoting into biology
              (following the Isomorphic Labs and NVIDIA BioNeMo pattern) and other Colossal-adjacent spinouts.
