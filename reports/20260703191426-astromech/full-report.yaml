chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Astromech presents itself as a biological AI company building what it calls a “Large Life Model” rather
              than a conventional drug-discovery point tool. The official website frames the system as an autonomous
              biological intelligence layer intended to model multi-species transcriptomic, evolutionary, and structural
              data so researchers can navigate the “code of life” rather than merely summarize it. Third-party coverage
              aligns with that positioning, describing Astromech as a predictive-biology engine meant to forecast
              evolution, disease risk, and biological vulnerabilities before they become clinically obvious. In
              diligence terms, the practical takeaway is that Astromech is best understood as an early platform company
              sitting at the intersection of AI infrastructure, computational biology, and synthetic-biology design.
              That creates unusually broad optionality, but it also means the current company story is substantially
              more platform vision than commercial proof as of 2026-07-03.
