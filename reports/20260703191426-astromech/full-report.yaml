      - number: '1.3'
        title: Funding, stage, and scale signals
        blocks:
          - type: paragraph
            body: >-
              Funding history is the clearest externally verifiable scale signal. Astromech's first public Form D shows
              a $30 million equity raise dated August 2025, while the March 2026 Form D adds roughly $10.5 million,
              bringing disclosed capital to $40.5 million. Multiple 2026 media sources pair that modest capital base
              with a roughly $2 billion valuation, describing the company as a very young spinout that achieved unicorn
              status within nine months. That gap between cash raised and implied valuation is central to the investment
              case: it suggests investors are underwriting strategic option value, proprietary scientific context, and
              Colossal adjacency rather than current commercial metrics. Public sources do not disclose revenue, ARR,
              current customer count, or current headcount. As a result, the supportable current-stage label is not
              “scaled commercial biotech” but “disclosure-light seed extension / early platform build” with a valuation
              that already prices in substantial future success.
