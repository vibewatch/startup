      - number: '3.3'
        title: Capability, pricing, and go-to-market comparison
        blocks:
          - type: paragraph
            body: >-
              On capability, competitors differ by technical approach: Recursion and Insilico emphasize large-scale
              phenotypic and generative screening; Isomorphic Labs and Schrödinger emphasize physics- and
              structure-based modeling; Generate:Biomedicines, Absci, and LabGenius emphasize generative
              protein/antibody design with wet-lab feedback loops; Astromech emphasizes multi-species evolutionary and
              multi-omics modeling, a comparatively less-proven angle among this peer set based on public evidence.
              Pricing across the category is rarely public; most competitors monetize through platform licensing plus
              milestone/royalty deal structures rather than transparent list pricing, and Astromech has disclosed no
              pricing or deal-structure information at all. On GTM and distribution, publicly disclosed competitors
              reach pharma buyers through named business-development partnerships and, in several cases, public-market
              investor visibility that itself functions as a distribution and credibility channel Astromech currently
              lacks.
