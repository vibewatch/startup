              disclosed revenue and clinical/commercial milestones. No dilution schedule, liquidation-preference stack,
              or cap-table detail has been disclosed, so preference overhang cannot be assessed. Entry discipline today
              should assume the full $2 billion figure is unverified until an independent data point (a priced follow-on
              round, a disclosed revenue figure, or a public listing) becomes available.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              In the bull scenario, Astromech discloses a named pharma partnership and a technical benchmark within 12
              months, supporting a follow-on round at or above the current $2 billion mark, consistent with the
              land-and-expand pattern observed at Recursion and Isomorphic Labs. In the base scenario, Astromech remains
              largely non-disclosing for another 12-18 months, raising a modest bridge or extension at a flat-to-down
              valuation while it builds toward a first customer. In the bear scenario, Astromech fails to secure a named
              customer or timely follow-on financing, and its valuation is written down toward a level more consistent
              with its disclosed capital base, mirroring the valuation compression risk flagged for the broader
              synthetic-biology category. Probability signal favors the base case given the volume of currently
              unresolved disclosure gaps.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV014
              - CV015
      - number: '8.5'
        title: Comparable set
        blocks:
          - type: paragraph
            body: >-
              The most relevant comparable set spans public and private AI-biology companies at varying stages: Absci
              and Schrödinger (public, disclosed revenue and market capitalization), Recursion (public, disclosed cash
              position and pharma partnerships), Relay Therapeutics (public, SEC-filed, named pharma partner),
              BenevolentAI (Euronext-listed, disclosed investor materials), Insilico Medicine (HKEX-listed via filing,
              disclosed IPO valuation), and Generate:Biomedicines (private, stock-analysis-style estimates only).
              Astromech's own $2 billion figure is a private-round narrative with no equivalent independent
              corroboration from any of these reference points, which is the central limitation of any comparable-based
              valuation exercise for this company today. Each comparable also differs materially in business-model scope
              from Astromech's single-platform narrative, meaning any multiple derived from this set should be treated
              as a directional signal rather than a precise valuation anchor.
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
          - type: table
            tableRef: TV004
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
      - number: '8.6'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Astromech is not exit-ready by any standard measure: no revenue, no named customer, no independent
              financial statement, and no disclosed technical benchmark exist to underwrite an eventual IPO or
              strategic-acquisition case. The most consequential thesis-break triggers are a failed or materially
              down-valued follow-on financing round, continued absence of any named customer past a reasonable
              post-stealth window, or an adverse category-wide regulatory or biosecurity action. The final diligence
              asks that would most improve underwriting confidence are: an audited or reviewed financial statement, a
              named customer or pilot reference, an independent technical benchmark or third-party validation study, and
              a disclosed compliance/certification roadmap.
            claimRefs:
