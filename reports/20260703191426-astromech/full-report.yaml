      - number: '2.5'
        title: Sizing and adoption diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Several sizing and adoption questions cannot be closed with public evidence. No source isolates an
              "AI-in-predictive-evolutionary-biology" category the way Astromech frames its own mission, so every market
              number here is a proxy from adjacent categories rather than a direct fit. Analyst estimates also disagree
              by more than 2x on both current-year market size and forward CAGR depending on whether diagnostics,
              manufacturing, and services are included, and none of the retained analyst reports disclose a primary
              research sample large enough to independently verify their base-year figures. Adoption-path evidence is
              drawn entirely from comparable companies rather than from Astromech's own disclosed pipeline, so the buyer
              segmentation in this chapter should be read as an industry-typical pattern, not a confirmed Astromech
              go-to-market motion. These gaps matter because they mean valuation work later in this report cannot lean
              on a single, source-verified TAM; it must instead reason from the range and flag the sizing uncertainty
              explicitly.
