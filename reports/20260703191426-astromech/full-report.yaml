    type: matrix
    layout: standard
    summary: >-
      Astromech scores at the floor on every customer-proof dimension, while named competitor partnerships clear each
      dimension with production-stage, independently corroborated evidence.
    data:
      columns:
        - Astromech
        - Recursion (Bayer)
        - Isomorphic Labs (J&J)
        - Schrödinger/Relay/BenevolentAI/Absci (Lilly/Novartis/AstraZeneca/Merck)
      rows:
        - label: Evidence quality (company-only vs independently corroborated)
          values:
            - No evidence exists
            - Independently corroborated
            - Independently corroborated
            - Independently corroborated
        - label: Outcome specificity
          values:
