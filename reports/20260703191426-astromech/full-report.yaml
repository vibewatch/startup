  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: standard
    summary: >-
      Disclosure risk and category-wide biosecurity/regulatory risk score highest on both likelihood and severity;
      financial and people risk score high on severity but lower on near-term likelihood given the company's early
      stage.
    data:
      columns:
        - Likelihood
        - Severity
        - Mitigation maturity
        - Residual exposure
      rows:
        - label: Disclosure / verification risk
          values:
            - High
            - High
            - None disclosed
            - High
        - label: Regulatory / biosecurity risk (category-wide)
          values:
            - Medium
            - High
            - Category-level only
            - High
        - label: Capital-intensity / financing risk
          values:
            - Medium
            - High
            - None disclosed
            - High
        - label: Key-person / execution risk
          values:
            - Low-Medium
            - High
