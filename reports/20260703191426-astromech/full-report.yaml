companyProfile:
  summary: >-
    Astromech is a private Austin-based biological AI startup spun out of Colossal Biosciences and founded by Ben Lamm
    and George Church. The company describes its platform as a Large Life Model that combines evolutionary modeling,
    multi-species data, pangenomics, and future multi-omics integration to support applications in medicine,
    agriculture, and programmable biology. Public disclosures confirm a $30 million 2025 financing, a roughly $10.5
    million 2026 seed extension, and widespread 2026 reporting of a roughly $2 billion valuation, while leaving revenue,
    customer, and unit-economics disclosure largely absent.
