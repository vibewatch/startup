        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The bull thesis rests on category momentum: AI-biology platforms (Recursion, Isomorphic Labs, Schrödinger,
              Insilico Medicine) have attracted large pharma partnerships and, in several cases, public listings, and
              Astromech's founder-led spinout from Colossal Biosciences gives it credible origination and brand halo
              within that category. The anti-thesis is that every company-specific proof point required to underwrite
              that thesis — revenue, named customers, technical benchmarks, compliance posture, and an independent
              leadership bench — remains undisclosed as of 2026-07-03, and the $2 billion valuation is not obviously
              supported by the $40.5M of disclosed capital raised to date. What would change the bull view: a disclosed
              named pharma partnership, a technical benchmark, or an independent financial statement. What would change
              the bear view: continued silence on all three past a reasonable post-stealth window, or a down-round.
