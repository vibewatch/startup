company:
  name: Astromech
chapter:
  number: 4
  title: Financials
  summary: >-
    Astromech has disclosed $40.5M of total funding and a reported ~$2B valuation but no revenue, pricing, customer, or
    margin data; every financial view in this chapter is built from public-company and disclosed-round comparables
    (Absci, Schrödinger, Recursion, Relay Therapeutics, Insilico Medicine) rather than from Astromech-specific
    reporting.
sections:
  - id: revenue-streams-pricing-and-recognition
    title: Revenue streams, pricing, and recognition
    body: >-
      Astromech has disclosed no named revenue stream, pricing sheet, or recognition policy as of 2026-07-03. Based on
      category norms among comparable AI-biology platforms, plausible revenue mechanisms include direct platform
      licensing to pharma and agbio buyers, co-development and milestone/royalty arrangements tied to joint discovery
      programs, and potential government or biosecurity contract work consistent with Colossal's broader de-extinction
      and biosecurity narrative. Comparable public companies such as Schrödinger disclose a dual
      software-license-plus-internal-pipeline revenue mix, while Absci discloses integrated wet-lab-plus-generative-AI
      service revenue; both patterns are plausible analogues for how Astromech could eventually monetize, but neither is
      confirmed for Astromech itself. Revenue recognition treatment cannot be assessed without a disclosed contract
      structure, and no milestone, royalty, or license-fee schedule has been made public for Astromech to date.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: go-to-market-motion-and-sales-efficiency
    title: Go-to-market motion and sales efficiency
    body: >-
      No disclosed source describes Astromech's sales cycle length, customer-acquisition cost, payback period, or
      channel economics. Comparable companies in this category rely on high-touch, long-cycle enterprise pharma sales
      motions rather than self-serve adoption; Isomorphic Labs and Relay Therapeutics both structure go-to-market around
      direct strategic partnerships rather than a transactional sales funnel, and Recursion and Schrödinger similarly
      report multi-year, relationship-driven deal cycles with named pharma partners. If Astromech follows this same
      category pattern, its go-to-market motion would likely require a dedicated business-development function and
      multi-quarter sales cycles rather than a scalable low-touch channel, which has capital-efficiency implications
      given the company's current lack of disclosed commercial headcount or partnerships. No CAC, payback, or
      channel-economics proxy specific to Astromech exists in any retained public source.
    claimRefs:
      - CI006
      - CI007
      - CI008
  - id: cost-structure-margins-and-capital-intensity
    title: Cost structure, margins, and capital intensity
    body: >-
      Astromech has not disclosed a cost structure, gross margin, working-capital position, or capital-expenditure plan.
      As a computational biology platform rather than a pure-play wet-lab company, its cost base plausibly skews toward
      compute infrastructure, model-training expense, and specialized research headcount rather than manufacturing
      capex; this is consistent with the pattern at Recursion and Schrödinger, both of which report meaningful
      cloud/compute cost lines alongside R&D headcount as their largest cost drivers. Absci's integrated wet-lab-plus-AI
      model shows materially higher capital intensity than pure computational peers because physical experimentation
      adds facility, reagent, and instrumentation costs; if Astromech's stated multi-omics and evolutionary modeling
      ambitions eventually require wet-lab validation loops, its capital intensity could rise toward the Absci pattern
      rather than staying at the lighter-weight Recursion/Schrödinger software-first cost profile. No Astromech-specific
      gross margin, working-capital, or capex figure is available to test either scenario directly.
    claimRefs:
      - CI009
      - CI010
      - CI011
      - CI012
    tableRefs:
      - TI003
    figureRefs:
      - FI002
  - id: public-traction-versus-private-metric-gaps
    title: Public traction versus private-metric gaps
    body: >-
      Public traction for Astromech is limited to funding and valuation figures; no source discloses revenue, ARR, GMV,
      unit volume, active users, utilization, or customer counts. This stands in sharp contrast to public-company peers:
      Schrödinger, Recursion, Absci, and Insilico Medicine all disclose quarterly revenue, and several disclose customer
      or partner counts through investor-relations channels. Datanyze-style estimated-scale data provides an approximate
      employee-headcount proxy for Astromech, but this is a third-party estimate rather than company-disclosed traction,
      and no retained source corroborates it against an official headcount figure. The gap between headline valuation
      and the complete absence of any public traction metric is the single most consequential financial diligence gap in
      this chapter.
    claimRefs:
      - CI013
      - CI014
      - CI015
    tableRefs:
      - TI005
  - id: capital-adequacy-and-financing-dependency
    title: Capital adequacy and financing dependency
    body: >-
      Astromech's funding chronology — culminating in $40.5M of disclosed capital as of its 2026 Form D filing — is
      established in Company Overview and is not restated here; this section instead assesses forward capital adequacy.
      No source discloses Astromech's current cash balance, monthly burn rate, or runway. Using the disclosed $40.5M
      raised as a ceiling and applying a category-typical burn range observed at comparable early-stage
      computational-biology platforms (informed by Absci and Schrödinger's early-stage cost disclosures before scaling),
      a plausible runway estimate falls in the 12-to-24-month range from the most recent disclosed raise, though this is
      a proxy rather than a confirmed figure. No debt facility, project-finance obligation, or credit line has been
      disclosed for Astromech. The next-round trigger is unconfirmed but would plausibly follow either a named
      commercial partnership announcement or approaching the lower bound of the estimated runway window.
    claimRefs:
      - CI016
      - CI017
      - CI018
      - CI019
    tableRefs:
      - TI004
    figureRefs:
      - FI004
  - id: financial-verdict-and-diligence-blockers
    title: Financial verdict on revenue quality, margin path, and diligence blockers
    body: >-
      Astromech's financial profile currently cannot support an independent underwriting view: there is no disclosed
      revenue, margin, unit economics, or capital-runway figure, and every quantitative estimate in this chapter is a
      category proxy rather than a company-specific fact. BCG's industrial-scale-up research reinforces a broader
      caution that synthetic-biology and AI-biology commercialization claims across the category tend to outrun
      demonstrated financial results, which applies directly to Astromech's $2B narrative against $40.5M of disclosed
      capital. The most consequential diligence blockers are the absence of any disclosed revenue or pipeline figure,
      the absence of a disclosed cash/burn position, and the absence of a named paying customer; closing these three
      gaps would be the highest-priority pre-investment request.
    claimRefs:
      - CI020
      - CI021
      - CI022
    figureRefs:
      - FI003
