  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: revenue-disclosure
      missingEvidence: Any disclosed Astromech revenue, ARR, or pipeline figure.
      whyItMatters: Without a revenue figure, the ~$2B reported valuation cannot be sanity-checked against any multiple.
      diligencePath: Request current revenue, ARR, or pipeline-value figures directly from the company.
      relatedQuestionRefs:
        - QI001
        - QI013
        - QI005
        - QI019
        - QI024
    - type: missing-source
      severity: blocking
      topic: capital-adequacy
      missingEvidence: Astromech's current cash balance and monthly burn rate.
      whyItMatters: >-
        Every runway figure in this chapter is a category proxy, not a confirmed number; actual runway could be
        materially shorter.
      diligencePath: Request most recent cash position, burn rate, and monthly operating expense breakdown.
      relatedQuestionRefs:
        - QI016
      relatedTableRefs:
        - TI004
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Astromech-specific gross margin, CAC, or payback data.
      whyItMatters: Unit economics cannot be assessed at all without at least one disclosed contract or cost figure.
      diligencePath: Request cost-of-revenue breakdown and any signed contract economics.
      relatedQuestionRefs:
        - QI009
        - QI011
      relatedTableRefs:
        - TI003
    - type: enumeration-incomplete
      severity: minor
      topic: headcount-verification
      missingEvidence: An official Astromech headcount figure to corroborate the third-party Datanyze estimate.
      whyItMatters: >-
        Headcount is a common proxy for R&D capacity and burn rate; an unverified estimate weakens every downstream
        capital-intensity inference.
      diligencePath: Request official current headcount by function.
      relatedQuestionRefs:
        - QI015
