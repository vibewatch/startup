  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-overhang
    missingEvidence: Liquidation preferences, participation rights, ratchets, secondary terms, and any employee-liquidity overhang from the Series C.
    whyItMatters: Headline valuation can materially overstate what a new investor or acquirer is actually underwriting.
    diligencePath: Request the latest financing documents, cap table, and side letters from counsel and finance.
    relatedQuestionRefs:
    - QV020
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: retention-and-economics
    missingEvidence: Net revenue retention, gross margin, customer concentration, CAC payback, and AI cost burden.
    whyItMatters: These inputs determine whether a premium private multiple is justified or merely narrative-driven.
    diligencePath: Ask for board-level KPI packs with cohort retention, margin by product, and cost-to-serve data.
    relatedQuestionRefs:
    - QV021
    - QV022
    relatedTableRefs:
    - TV006
  - type: conflicting-data
    severity: material
    topic: scale-estimates
    missingEvidence: Management-verified revenue, funding, and headcount figures that reconcile conflicting databases and analyst estimates.
    whyItMatters: Public valuation support is unusually sensitive to denominator accuracy because the current price already embeds a premium.
    diligencePath: Request audited financials or at minimum a management-certified ARR bridge and current headcount schedule.
    relatedQuestionRefs:
    - QV007
  - type: enumeration-incomplete
    severity: minor
    topic: comparable valuation table coverage
    missingEvidence: Direct private marks or M&A values for more workflow-documentation peers beyond the few public or announced transactions available.
    whyItMatters: The comparable set is useful for bounding valuation, but it is not exhaustive for every adjacent workflow or knowledge platform.
    diligencePath: Supplement with banker books, secondary-market indications, and investor references on private peer marks.
    relatedQuestionRefs:
    - QV011
    - QV012
    relatedTableRefs:
    - TV004
