- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - Audited ARR and revenue bridge
    - Recognized revenue, ARR, growth by cohort, and free-to-paid conversion.
    - The current price is highly sensitive to denominator accuracy.
    - Finance diligence, auditor package, and board KPI deck.
  - - Gross margin and AI cost burden
    - Cloud, inference, and support cost detail by product and customer segment.
    - Premium multiples only work if the business keeps attractive software economics.
    - Finance and infrastructure diligence.
  - - Retention and concentration
    - NRR, GRR, top-customer concentration, and expansion by plan / cohort.
    - Enterprise breadth matters more than logo count for valuation durability.
    - Revenue-operations analysis and customer-reference calls.
  - - Cap table and preference terms
    - Liquidation preferences, ratchets, employee-liquidity terms, and participation rights.
    - Economic reality can diverge sharply from headline valuation.
    - Counsel review of financing documents and cap table.
  - - Strategic moat validation
    - Proof that workflow-intelligence and context APIs are driving budget expansion beyond documentation.
    - Without moat evidence, public comp bands dominate the discussion.
    - Product usage analytics, design-partner references, and pipeline by product.
  notes: If these requests cannot be answered cleanly, the right posture is patience rather than aggressive price-taking.
