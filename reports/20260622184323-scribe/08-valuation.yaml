- id: S802
  title: Financing context and comparable discipline
  body: 'The 2025 Series C proves there is real investor appetite for Scribe’s workflow-intelligence vision, and the company’s customer and usage signals make that understandable. But public software references remain a necessary discipline tool. As of June 2026, Atlassian screens at roughly 3.2x revenue, Asana at about 2.0x using SEC-backed fiscal 2026 revenue, and GitLab at roughly 4.5x. Those are imperfect comparables, but they still tell investors something important: even high-quality workflow or developer software is not getting double-digit public multiples by default. Strategic and private references such as WalkMe’s $1.5 billion sale or Notion’s $11 billion tender show that premium assets can command more, yet Scribe’s current mark still needs stronger evidence on retention and economics before it can be called outright attractive. That gap does not prove Scribe is overvalued, but it does mean the company must earn a private premium with harder evidence than the market has to date.'
  claimRefs:
