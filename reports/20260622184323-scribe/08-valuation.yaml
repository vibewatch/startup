- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - thesis
  - what would change the view
  rows:
  - - Workflow context wedge
    - Scribe has a broad top-of-funnel wedge that starts with free capture and expands toward enterprise workflow intelligence.
    - If paid conversion and retention are weaker than user growth suggests, the wedge becomes less valuable.
  - - Enterprise proof
    - Fortune-500 penetration, named customers, and ROI claims suggest real enterprise pull.
    - If large-account usage is shallow or heavily piloted, the enterprise story weakens.
  - - Dataset and AI expansion
    - Ten million plus workflows across forty thousand applications create a potential intelligence layer that ordinary documentation tools do not have.
    - If Optimize fails to monetize or incumbents bundle similar context, the premium fades quickly.
  - - Valuation support
    - A one-point-three-billion-dollar mark can be defensible if ARR is already near one hundred million with strong retention and margins.
    - If ARR is materially lower or gross margin / NRR are ordinary, the price screens too rich.
  - - Competition and bundling
    - Strategic interest in DAP assets suggests there is real platform value here.
    - If customers can get enough workflow guidance from Atlassian, Microsoft, Salesforce, or SAP bundles, standalone value compresses.
  notes: The anti-thesis is primarily denominator risk plus bundling risk, not a claim that Scribe lacks product-market fit.
