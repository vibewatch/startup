  - FV003
- id: S804
  title: What must be proven next
  body: 'The decisive diligence path is straightforward. Investors need audited ARR or at least a management-certified revenue bridge, proof of retention and concentration, gross-margin visibility after AI and support costs, and a clear picture of cap-table economics. Public evidence is strong enough to show that Scribe matters; it is not strong enough to show that a new investor should accept the 2025 price without those materials. The same logic applies to exit readiness. WalkMe’s sale and Notion’s tender show that the market will pay for strategically valuable workflow and knowledge assets, but those outcomes require stronger proof of durability than Scribe’s public package currently provides. Until those missing inputs arrive, the chapter’s message is simple: stay interested, but make the company earn the premium. Until those materials exist, the prudent investor response is to keep the company in active diligence while refusing to convert public admiration into automatic price acceptance.'
