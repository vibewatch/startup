- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Audited ARR misses the public estimate
    - Verified ARR materially below ~$100M without exceptional margins
    - The current valuation loses its denominator support immediately.
    - Do not underwrite at the 2025 headline price.
  - - Retention or margin disappoints
    - NRR near public-software averages and AI or support costs compress margin
    - Premium multiple logic weakens because the quality premium disappears.
    - Re-cut valuation closer to public comp bands.
  - - Bundling pressure rises
    - Major platform owners release native workflow capture or guidance bundled into existing contracts
    - Standalone willingness to pay and strategic scarcity both fall.
    - Lower bull-case probability and widen downside scenarios.
  - - Cap-table terms are investor-unfriendly
    - Preference stack, participation, or secondary economics materially reduce common-equivalent upside
    - Headline valuation stops representing investable economics.
    - Pause until terms or price reset.
  - - Customer complaints become a retention trend
    - Support or billing complaints recur across large accounts or renewal cycles
    - Word-of-mouth and enterprise expansion become less reliable.
    - Reduce confidence and treat retention assumptions as suspect.
  notes: These triggers are deliberately linked to valuation transmission rather than broad operating risk.
