chapter:
  number: 8
  title: Valuation
  summary: Scribe is clearly more than a toy workflow recorder, but the current public record is still not strong enough to underwrite the 2025 $1.3 billion price with high conviction. The scale story is impressive—millions of users, broad Fortune-500 penetration, a freemium-to-enterprise wedge, and a workflow-intelligence expansion narrative—but the best public denominator is still a third-party ~$100 million ARR estimate rather than audited disclosure. That leaves Scribe trading at roughly a 13x implied multiple versus a current public workflow-software band closer to ~2x-4.5x, so the disciplined public-evidence call is research-more with a stretched valuation stance.
