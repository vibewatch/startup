  - value
  - rationale
  rows:
  - - Recommendation
    - research-more
    - The business quality story is real, but public valuation support still depends on estimated rather than audited denominators.
  - - Confidence
    - medium
    - Multiple independent sources agree on the financing headline, but key operating inputs remain estimated or conflicting.
  - - Risk Rating
    - high
    - Premium valuation meets platform, bundling, and disclosure risk before audited economics are available.
  - - Valuation Stance
    - stretched
    - A roughly 13x ARR anchor can work only if Scribe’s growth and retention stay materially better than public software comps.
  - - Decision implication
    - Stay engaged only if diligence can validate ARR quality, retention, and cap-table economics.
    - The gating issue is evidence quality, not product relevance.
  notes: This summary is price-sensitive rather than company-quality-only; a lower entry or stronger data room could move the call.
