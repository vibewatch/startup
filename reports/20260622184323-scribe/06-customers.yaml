- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / durability risk
  - Impact
  - Diligence path
  rows:
  - - Freemium browser capture
    - Large top-of-funnel may not convert proportionally into durable paid enterprise revenue
    - Could overstate practical monetization if free usage dominates
    - Request active-paid-user conversion and expansion rates by cohort
  - - Enterprise governance and AI integrations
    - Higher-value enterprise features may deepen accounts over time
    - Positive if governance and AI budgets convert to multi-team deals
    - Review expansion ARR by feature family and number of teams per account
  - - Optimize cross-sell into existing customers
    - Current public proof centers on TXNM Energy
    - If cross-sell is narrow, AI narrative may outpace revenue reality
    - Request pipeline and closed-won data for Optimize versus Capture-only accounts
  - - Named enterprise references in regulated sectors
    - Large-logo concentration may hide dependence on a small set of flagship accounts
    - High if a few logos drive disproportionate ARR or narrative value
    - Request top-10 customer concentration and reference-account revenue share
  - - Bottoms-up adoption motion
    - Department-led spread can be powerful but also uneven and reversible
    - Medium if grassroots adoption does not lock into central budget ownership
    - Review team-to-enterprise conversion rate and net seat expansion over time
  notes: Risks are derived from the shape of the public customer evidence rather than disclosed concentration statistics; where public proof is absent, the diligence path names the exact private dataset needed.
