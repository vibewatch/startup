- id: adverse-signals-and-proof-quality
  title: Adverse signals, proof quality, and remaining concentration risk
  body: 'Public adverse evidence is thinner than positive proof, but it is not absent. Both SourceForge and Slashdot carry a June 2026 review describing poor desktop-app screenshot capture and difficult cancellation or refund resolution. One review does not overturn the broader customer story, yet it matters because Scribe’s value proposition depends on low-friction capture and trust in workflow tooling. More structurally, the proof set is still mostly company-controlled. Case studies are detailed, but almost all outcomes come from Scribe’s own publishing channels. Public customer economics are also underdeveloped: there is no top-customer concentration disclosure, no public contract-duration data, and no retention metrics. The result is a mixed diligence picture. Scribe clearly has named customers and credible ROI anecdotes, but investors still need private cohort, renewal, and concentration data before underwriting the business as a highly durable enterprise platform purely from public
    evidence. That missing durability data remains the central customer diligence blocker.'
