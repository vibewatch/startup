  - - Regulated financial and insurance organizations
    - Risk, training, and operations teams
    - Process standardization, audit support, and compliance-aligned training
    - 'Named proofs: New York Life and Northern Trust'
    - High strategic value because errors and audit costs are expensive
    - No public contract terms or renewal data
  - - Transformation / AI-readiness buyers
    - Continuous improvement, automation, and cyber teams
    - Use Optimize to map workflows and prioritize AI automation
    - 'Named proof: TXNM Energy'
    - Expansion vector beyond documentation seats
    - Only one detailed public Optimize case study
  - - Mid-market and team-led adopters
    - Individual creators and small teams
    - Free or low-friction capture for docs and onboarding
    - Free Basic tier, Product Hunt, Chrome Web Store, and customer quotes
    - Feeds bottoms-up expansion motion
    - Paid conversion rates are undisclosed
  - - Customer-facing enablement and implementation teams
    - CS, implementation, support, and training functions
    - Reduce ticketing, improve onboarding, deliver how-to guidance
    - DigitalOcean, Learning Pool, Mindbody stories
    - Supports horizontal usage across departments
    - No public per-function spend data
