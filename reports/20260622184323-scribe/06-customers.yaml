chapter:
  order: 6
  number: 6
  title: Customers
  summary: Public evidence shows Scribe selling into large enterprises and regulated organizations with named stories from New York Life, Northern Trust, TXNM Energy, DigitalOcean, and others, plus broad headline adoption claims around Fortune 500 usage, users, and organizations. The strengths are real named references and quantifiable workflow outcomes; the weaknesses are sparse public retention metrics, concentration opacity, and at least one recent adverse review about desktop capture quality and cancellation friction.
sections:
- id: customer-base-and-segmentation
  title: Customer base segmentation and public footprint
  body: 'Scribe’s public customer picture is unmistakably enterprise-oriented, but it still combines several different adoption lenses. Official materials talk about 94% of the Fortune 500, 90,000 enterprises, more than 5 million users, and 45% of the Fortune 500 as paying customers. Third-party coverage adds another layer, with TechCrunch reporting 78,000 paid organizations and Sacra estimating roughly 80,000 customers. Named users on the public site cluster in large organizations and regulated sectors: New York Life, Northern Trust, TXNM Energy, Coronis Health, and DigitalOcean sit alongside broader stories from Mindbody, Simplot, Kubota, and Learning Pool. That mix suggests Scribe is not selling into one narrow departmental niche; it spans onboarding, SOPs, compliance, software rollout, and process improvement. The main segmentation limitation is that Scribe does not publicly break out revenue mix by vertical, geography, department, or seat band, so the public story is strong on logos
    and outcomes but weak on customer economics.'
