- id: retention-and-expansion
  title: Retention visibility and expansion mechanics
  body: Scribe’s public materials make the expansion motion easier to see than retention durability. The pricing page preserves a classic freemium entry point, while enterprise packaging adds governance, AI integration, and central administration. TechCrunch explicitly describes adoption as bottoms-up before spreading upward to team leads and central functions, and Sacra frames the model as free capture that spreads internally and later converts into enterprise governance spend. The TXNM Energy case study is especially important here because it shows Scribe selling an expansion product—Optimize—into an existing workflow problem rather than only more documentation seats. What public materials do not show is the contractual durability of that motion. There is no disclosed NRR, GRR, churn, contract-length, or renewal-rate data. That means public evidence supports a credible land-and-expand narrative, but not yet a quantified retention thesis. Investors can see why accounts may deepen over time,
    but not how consistently they actually do reliably.
  claimRefs:
  - CU024
  - CU025
  - CU027
  - CU034
