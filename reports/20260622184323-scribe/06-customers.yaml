- id: named-customer-proof
  title: Named customer proof and observable deployment outcomes
  body: 'The best public proof comes from customer stories, not abstract logo walls. New York Life and Northern Trust each have dedicated case-study pages, and TXNM Energy has a named Optimize story. Those pages are detailed enough to show more than pilot experiments: New York Life scaled from a 40-person pilot to enterprise-wide implementation across 80-plus teams, while Northern Trust ties Scribe to SOPs, global collaboration, training, and risk management. The customer hub adds additional named stories with quantitative outcome claims for Simplot, Mindbody, Kubota, Coronis Health, DigitalOcean, and Learning Pool. Importantly, this evidence is still mostly vendor-published. It proves that Scribe has real reference accounts and concrete use cases, but it does not carry the same evidentiary weight as audited customer references, procurement disclosures, or customer-written ROI studies. The strongest customer-side corroboration in the fetched corpus is New York Life’s own newsroom post, which
    independently confirms the partnership and rollout.'
