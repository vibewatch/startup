  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof table
    missingEvidence: A complete current customer roster with deployment stage, contract scope, and named references by segment.
    whyItMatters: Public customer stories prove real usage but do not show whether the top public logos represent the bulk of revenue or only a curated sample.
    diligencePath: Request a top-customer list with ARR, renewal status, deployment stage, referenceability, and segment tags; reconcile against logo pages and case-study usage.
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention and concentration metrics
    missingEvidence: Historical NRR, GRR, logo churn, contract duration, seat expansion, and top-10 customer concentration data.
    whyItMatters: Without retention and concentration data, the public customer story supports adoption but not durability or downside underwriting.
    diligencePath: Request cohort tables, renewal dashboards, customer concentration schedules, and sample order forms with cancellation terms.
    relatedQuestionRefs:
    - QU010
    - QU020
    - QU022
    - QU025
