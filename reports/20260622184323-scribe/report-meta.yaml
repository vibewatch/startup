companyProfile:
  summary: Scribe is a private San Francisco software company founded in 2019 that started with automatic workflow capture and has expanded into a broader workflow-AI platform. Its core products turn completed work into step-by-step guides, SOPs, and in-context workflow knowledge through browser, desktop, API, and MCP surfaces. Public evidence supports real enterprise traction, strong PLG distribution, and a 2025 Series C at a $1.3 billion valuation, but the company still discloses only partial operating denominators and limited audited financial detail.
  foundedDate: '2019-01-01'
  founders:
    - name: Jennifer Smith
      role: Co-founder & CEO
      background: Former McKinsey operator and Greylock product/enterprise leader who built Scribe around the pain of documenting business processes manually.
      claimRefs: [CO008, CO010]
    - name: Aaron Podolny
      role: Co-founder & CTO
      background: Technical co-founder whose prior automation-company exit to Google supports the product and workflow-automation thesis.
      claimRefs: [CO009, CO010]
  foundingLocation: San Francisco, California, USA
  headquarters: San Francisco, California, USA
  productSummary: Workflow AI platform centered on Scribe Capture and Scribe Optimize, combining automatic guide creation, desktop and browser capture, enterprise search/API access, and MCP-delivered workflow context for AI agents.
  customerFocus: Mid-market and enterprise teams that need governed process documentation, onboarding, training, enablement, and workflow-optimization insights.
  businessModel: Freemium-to-enterprise SaaS with free capture, paid seat tiers, and enterprise upsell around governance, redaction, SSO, API/MCP access, and broader workflow-intelligence use cases.
  stage: Series C private
  fundingStatus: $75M Series C led by StepStone in November 2025 at a $1.3B valuation; Sacra reconstructs total funding at about $130M across seed through Series C.
  disclosureProfile: private-undisclosed
  claimRefs: [CO007, CO012, CO013, CO044, CE013, CE025, CI012, CV012]
summary:
  headline: Scribe has credible enterprise workflow adoption and a differentiated AI-context wedge, but public evidence still supports only a cautious underwriting view at the 2025 $1.3B valuation.
