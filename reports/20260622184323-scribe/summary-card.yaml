summary:
  headline: >-
    Scribe has credible enterprise workflow adoption and a differentiated AI-context wedge, but public evidence still
    supports only a cautious underwriting view at the 2025 $1.3B valuation.
  overallScore: 6.3
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: stretched
