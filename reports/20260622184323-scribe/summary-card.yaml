  topStrengths:
    - Strong PLG distribution through browser and desktop capture with a clear freemium-to-enterprise conversion path.
    - Broad workflow dataset and Scribe Optimize expansion create a credible AI-context and process-intelligence wedge.
    - >-
      Public enterprise proof includes 94% Fortune 500 usage claims and marquee customer references such as New York
      Life and Northern Trust.
    - >-
      Security and governance packaging is more mature than many lightweight documentation peers, including DPA,
      redaction, SSO, and AI opt-out controls.
    - >-
      The company reached meaningful claimed scale at roughly 120 employees, suggesting efficient commercial leverage if
      the disclosed metrics hold.
  topRisks:
    - The 2025 $1.3B valuation implies a premium multiple versus current public workflow-software benchmarks.
    - >-
      Public scale metrics mix users, organizations, enterprises, and paying customers, making denominator quality a
      core diligence risk.
    - >-
      Scribe captures sensitive workflow content, creating privacy, compliance, and AI-vendor-governance exposure in
      regulated accounts.
    - >-
      Platform and bundling pressure from Atlassian, Salesforce, ServiceNow, WalkMe, Whatfix, Notion, and other suites
      could compress standalone value.
    - >-
      Public complaints about cancellation friction and desktop-capture quality suggest expansion and retention risk if
      support depth does not keep pace.
  unresolvedGaps:
    - Audited ARR, gross margin, burn, runway, and NRR remain unavailable in the public record.
    - >-
      The bridge between 5M users, 6M users, 600K organizations, 90K enterprises, and 78K/80K paying customers is still
      not publicly reconciled.
    - Board composition, liquidation preferences, and detailed cap-table economics are not publicly disclosed.
    - Public evidence does not provide incident logs, SLA-credit data, or churn cohorts by customer segment.
    - The attach rate and monetization curve for Scribe Optimize versus the legacy documentation product remain unclear.
