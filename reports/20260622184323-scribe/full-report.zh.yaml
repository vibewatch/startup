  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局与替代集合
        blocks:
          - type: paragraph
            body: >-
              Scribe 并不在一个干净品类里竞争。最近的重叠来自 Tango、Guidde
              等浏览器和桌面辅助工作流捕捉工具，它们承诺把实时工作流转成精修指南，同时大幅减少手工截图和写作。但真实买方任务很快会超出捕捉。WalkMe 和 Whatfix
              从企业数字采用角度切入同一问题，强调跨多种关键业务应用的治理、分析和引导式执行。当团队更需要耐用 SOP 或知识库，而不是即时记录时，Trainual、Process Street、Notion、Guru 和
              Whale 就变得重要。Loom 和更宽的异步视频现状方案仍可用于轻量解释。也就是说，Scribe 不仅要赢过直接捕捉同业，还要赢过把文档任务吸收到更宽工作系统里的知识库、赋能套件和转型平台。
