      - number: '1.2'
        title: 创始人、领导层与公司足迹
        blocks:
          - type: paragraph
            body: >-
              创始叙事异常连贯。Jennifer Smith 在 2021 年融资信中说，她 2019 年遇到 Aaron Podolny，并围绕自己在 McKinsey、后来在 Greylock 亲历的痛点创办
              Scribe：流程知识仍靠手工捕捉，成本高、速度慢。TechCrunch、Craft 和 Redpoint 都印证 2019 年成立，并确认 Smith 为 CEO、Podolny 为
              CTO。同一封官方信还补充了创始人与市场匹配度：Smith 多年记录运营工作流，Podolny 曾将一家自动化公司出售给 Google。


              更宽的高管梯队可见，但不完全透明。Craft 列出 VP of Engineering 和 VP of Design，安全页面呈现大量安全运营表述，Chrome Web Store 则把 Colony Labs,
              Inc. 标为开发者。这些信息支持其为真实运营公司，而非单薄产品壳，但公开董事会构成仍稀疏。Redpoint 页面确认它在 2024 年 Series B 首次与 Scribe
              合作，但本报告审阅的公开材料没有给出完整董事名单或董事观察员图谱。


              总部证据比许多风险投资支持的初创公司更一致，但仍要精确。2025 年 Series C 新闻稿、TechCrunch、Craft、Redpoint 和 Chrome Web Store 都把公司放在 San
              Francisco。Craft 与 Chrome Web Store 各自发布了具体 San Francisco 地址，法律和隐私材料则显示运营主体名称为 Colony Labs, Inc.
              最可辩护的公开判断是：Scribe 是一家通过 Colony Labs, Inc. 运营、总部在 San Francisco 的私营公司。
