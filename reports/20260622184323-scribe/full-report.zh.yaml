            body: >-
              法律栈纸面扎实，但仍带来真实敞口。Scribe 公开声称支持 GDPR、HIPAA 和其他全球隐私标准；DPA
              和隐私政策对处理者姿态、审计权、留存和传输机制给出异常具体的语言。这是正面因素。同一批文件也确认了风险为何重要：工作流捕捉可包含受监管内容，数据可能在美国和其他地区处理，法律条款依赖强制仲裁、自动续约和有限存储义务。企业持有敏感个人信息时，欧盟和美国监管机构期待数据最小化、保护措施和事故预案。没有监管沟通、泄露通知或大客户合同
              carve-out 的直接证据时，正确姿态是把合规当作顶级尽调项，而不是已打勾事项。
