        - 正在规范 SOP 和入职培训的 SMB
        - 归属权、模板、测验和资料库深度
        - 不以工作发生时的被动捕获为中心
      - - Process Street
        - 工作流和合规替代品
        - 官网声称 1M+ 用户
        - 运营、审计和合规团队
        - 工作流自动化和审计就绪证明
        - 对单一操作者工作流的即时捕获优化较少
      - - Whale / Notion / Guru
        - 知识库替代品
        - 定位是知识平台，而非原生捕获
        - 优先建设一个可搜索事实源的团队
        - 集中检索和持续治理
        - 捕获可能变成手工编写步骤，而不是自动完成
    notes: 各行按买方任务比较最可能的公开替代方案，不只比较同形态产品；除非另有说明，融资和用户数均为发布方说法。
