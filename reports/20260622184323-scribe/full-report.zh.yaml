      - number: '2.2'
        title: 规模测算视角与公开 SAM 逻辑的边界
        blocks:
          - type: paragraph
            body: >-
              对 Scribe 来说，最干净的自下而上公开视角是流程文档软件。Business Research Insights 估计该市场 2026 年为 $2.34 billion，2035 年达到 $6.28
              billion，CAGR 为 11.3%。这并非完美匹配，但在已审阅来源中，这是最窄且直接相关的分析师品类，因为它明确围绕流程的记录、管理和优化。


              如果 Scribe 成功从文档扩张到工作流基础设施，两个更宽品类展示了上行空间。Global Growth Insights 估计 2026 年工作流软件市场为 $9.53 billion；The
              Business Research Company 估计 2026 年业务工作流自动化市场为 $14.96 billion，到 2030 年为 $25.5 billion。这些更大的资金池重要，因为 Scribe
              越来越多地推销 AI 上下文、工作流可观测性和流程改进，而不只是漂亮的 how-to 指南。


              问题在于，这些品类没有一个能隔离出干净的 Scribe 专属 SAM 或 SOM。已审阅报告混合了文档、协作、工作流编排、审批、合规和更宽的自动化。公开市场视角能给机会划边界，但不能支撑一页干净
              TAM。最稳妥的尽调结论是：Scribe 拿到了一个真实的数十亿美元级切口，并可信地邻接更大预算；但任何精确 SAM 仍需要管理层分拆，而公开记录没有提供。
