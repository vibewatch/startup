  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Scribe（标的）
        - 2025 年 Series C + Sacra ARR 估计
        - 基于 $1.3B 估值和约 $100M ARR，隐含倍数约 13.0x
        - 当前估值的最佳公开桥梁。
        - ARR 来自第三方估算，并未审计。
      - - Atlassian
        - 2026 年 6 月市值 / TTM 收入
        - 收入约 3.2x
        - 具备大型企业覆盖的规模化工作流软件可比公司。
        - 比 Scribe 大得多，也更多元。
      - - Asana
        - 2026 年 6 月市值 / SEC 支撑的 FY2026 收入
        - 收入约 2.0x
        - 有文件支撑收入和留存背景，是有用的上市工作流可比公司。
        - 上市公司，增长更慢，产品深度也不同。
      - - GitLab
        - 2026 年 6 月市值 / TTM 收入
        - 收入约 4.5x
        - PLG 企业软件可比公司，开发者工作流可信度强。
        - DevSecOps 平台不是纯粹的流程文档同业。
      - - WalkMe
        - 已宣布战略收购
        - $1.5B 收购价值
        - 相关的 DAP 退出基准，接近 Scribe 当前私有估值。
        - 收购价值不能直接与少数股增长轮相比。
      - - Notion
        - 2025 年私有二级交易
        - $11B 估值
        - 展示了当 AI 变现可信时，规模化知识工作平台如何守住私有市场溢价。
        - 产品范围不同，规模也远大于 Scribe。
    notes: 该表混合了上市倍数、私有市场和战略交易参照，因为没有一组可比公司能完全匹配 Scribe 的工作流上下文定位。
