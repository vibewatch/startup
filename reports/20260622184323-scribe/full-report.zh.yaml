            body: >-
              最可支持的承销观点是：Scribe 已跨过从有趣 PLG 产品到合法规模化软件平台的门槛，但还没跨过从动人故事到可完全承销私营公司的门槛。正面因素有意义：公开标价可见，企业变现可信，ARR 现在公开声称达到
              $100
              million，公司似乎在上一轮资金耗尽前就完成了融资。风险同样有意义。现金、burn、留存、毛利率和真实客户组合等公开指标缺失；组织与员工数并不完全一致；一条负面评论显示边缘服务质量仍会产生影响。换句话说，公开记录支持对收入模型清晰度和融资可得性的信心，对增长效率的信心中等，对资产负债表耐久性的信心较低。因此，任何投资案例都应把毛利路径、留存质量和
