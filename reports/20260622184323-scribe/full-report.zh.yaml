  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 判断仍然谨慎：估值标题真实存在，但分母和护城河证据还没补齐。
    data:
      nodes:
        - id: a
          label: 真实市场拉力
          detail: 数百万用户、具名企业客户和工作流 ROI 说法。
          tone: positive
        - id: b
          label: 数据集和 AI 期权价值
          detail: 工作流智能扩张可能撬宽预算池。
          tone: positive
        - id: c
          label: 溢价定价锚
          detail: $1.3B Series C 已经假设经济性很强。
          tone: warning
        - id: d
          label: 证据缺口
          detail: ARR、利润率、留存和股权结构条款仍未公开审计。
          tone: negative
        - id: e
          label: 决策
          detail: 继续研究；尽调补上缺口前，把价格视为偏紧。
          tone: neutral
      edges:
        - from: a
          to: e
        - from: b
          to: e
        - from: c
          to: e
        - from: d
          to: e
    approximationNotes: null
    claimRefs:
      - CV003
      - CV006
      - CV007
      - CV011
      - CV013
      - CV041
      - CV042
      - CV043
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 只有 ARR 已经足够大、市场还愿意支付溢价倍数时，Scribe 当前估值标题才更容易守住。
    data:
      items:
        - label: 5x 所需 ARR
          value: 260
          detail: 以成熟上市公司式倍数支撑 $1.3B 估值所需的 ARR / 收入，单位为 USD 百万。
          tone: negative
        - label: 8x 所需 ARR
          value: 162.5
          detail: 如果 Scribe 维持溢价软件倍数，对应的支撑门槛。
          tone: warning
        - label: 10x 所需 ARR
          value: 130
          detail: 如果市场给出异常强的溢价，对应门槛。
          tone: neutral
        - label: Sacra ARR 估算
          value: 100
          detail: 作为最佳公开分母的第三方 ARR 估算。
          tone: warning
        - label: 上市可比区间中点
          value: 3.2
          detail: 来自 Atlassian / Asana / GitLab 的近似上市倍数锚。
          tone: negative
    approximationNotes: 敏感性条形图把所需 ARR 门槛、当前公开分母和上市可比倍数区间放在一起；它们是估值纪律工具，不是预测。
    claimRefs:
      - CV011
      - CV020
      - CV024
      - CV027
      - CV040
      - CV041
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 只看公开证据，区间中枢低于当前估值；除非增长、留存和护城河都落在偏乐观一侧。
    data:
      items:
        - label: 熊市情形
          low: 280
          mid: 420
          high: 600
          displayValue: $280M-$600M
          detail: ARR 卡在 $70M-$100M 附近，上市公司式倍数主导定价。
          tone: negative
        - label: 基准情形
          low: 900
          mid: 1150
          high: 1440
          displayValue: $900M-$1.44B
          detail: 健康的企业增长延续，但市场仍保持估值纪律。
          tone: warning
        - label: 牛市情形
          low: 1800
          mid: 2200
          high: 2640
          displayValue: $1.8B-$2.64B
          detail: 工作流智能扩大预算，护城河也被证明耐久。
          tone: positive
    approximationNotes: 区间是基于公开证据的简单情景输出；有意避免虚假的 DCF 精确感。
    claimRefs:
      - CV003
      - CV011
      - CV040
      - CV043
      - CV044
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Scribe 在产品拉力和可选性上得分不错，但证据充分性和当前价格支撑只在中游。
    data:
      items:
        - label: 产品拉力
          score: 8
          detail: 案例研究、付费客户和工作流 ROI 说法显示需求真实存在。
          tone: positive
        - label: 扩张可选性
          score: 8
          detail: 如果工作流智能和 AI 上下文属实，预算池可以被撬宽。
          tone: positive
        - label: 证据质量
          score: 4
          detail: 核心估值输入仍来自估算或公司说法，而不是经审计披露。
          tone: warning
        - label: 估值支撑
          score: 5
          detail: 13x ARR 锚点可能成立，但已经假设溢价执行。
          tone: warning
        - label: 竞争隔离
          score: 5
          detail: 已融资对手和套件捆绑都具有实质影响。
          tone: warning
        - label: 下行保护
          score: 3
          detail: 公开证据很少覆盖股权结构、客户集中度或毛利率，难以缓冲承销错误。
          tone: negative
    approximationNotes: 评分是锚定引用公开证据的 0-10 序数判断，不是公司披露的管理层 KPI。
    claimRefs:
      - CV006
      - CV007
      - CV011
      - CV013
      - CV028
      - CV029
      - CV033
      - CV041
      - CV042
      - CV045
