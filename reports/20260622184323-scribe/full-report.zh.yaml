chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与商业模式
        blocks:
          - type: paragraph
            body: >-
              Scribe 的公开定位已明显越过简单截屏捕捉。官网现在把产品描述为面向团队和 AI agent 的工作流上下文，2025 年 11 月融资材料则称其为 Workflow AI 平台，核心产品 Scribe
              Capture 能把已完成的工作自动转换成带截图和文字的分步骤指南。产品通过浏览器扩展和桌面应用分发；Chrome Web Store 列表延续同一套叙事，称组织可用 Scribe 培训团队、训练 AI
              agent、搭建 SOP，并自动化手工工作。


              商业模式是从免费增值走向企业级。Scribe 提供免费的 Basic 层级、付费的 Pro Personal 和 Pro Team
              层级，以及定制定价的企业层级。公开套餐文案把上行路径说得很清楚：桌面和移动端捕捉、导出、截图编辑、品牌化、协作、治理、SSO、角色控制、语言翻译，以及自动 PII/PHI
              遮盖。也就是说，变现逻辑不只是卖更多席位，而是从个人生产力工具切入受治理的组织知识。


              最值得注意的未披露项，是这套产品动作背后的财务转化。公司愿意公布用户、组织和工作流数量，但官方公开页面仍不披露
              ARR、收入、毛利率或企业合同组合。因此，后续估值论证更多依赖采用度和效率信号，而不是已审计运营指标。
