      - - Guidde
        - 视频优先的文档同类产品
        - $50M Series B；4,500+ 客户
        - 客户教育、外部赋能、培训团队
        - AI 视频、配音和多媒体输出
        - 对可搜索、文本优先的 SOP 治理优化不够明显
      - - WalkMe
        - 企业数字化采用老牌厂商
        - 战略价值足以被 SAP 收购
