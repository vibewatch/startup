            body: >-
              公开技术证据显示，Scribe 通过多个接口交付工作流上下文。Capture 从浏览器扩展或桌面应用开始，再把内容交给网页文档层，用户可在其中编辑、遮盖、组合并分享指南。Sidekick
              作为浏览器侧边栏存在，会随当前站点刷新，并呈现相关 Scribe 或 Pages。Guide Me 再把已存储的 Scribe 转成引导式执行体验。面向机器访问时，Scribe 记录了两个不同接口：位于
              public-api.scribehow.com 的 key-based 企业搜索 API，用于文档搜索和检索；以及位于 mcp.scribe.com/mcp 的托管 MCP server，面向使用 OAuth
              的 AI client。这个拆分重要。搜索 API 是面向应用或内部工具的经典集成界面，MCP 则是直接面向 AI assistant
              的更新上下文交付层。因此，架构看起来不像单体应用，更像一个通过浏览器、桌面端、API 和 agent connector 暴露的工作流内容系统。
