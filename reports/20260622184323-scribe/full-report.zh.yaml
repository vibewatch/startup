  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Scribe 当前市场边界比经典 SOP 软件更宽，但比整个工作流自动化宇宙更窄。公司销售自动工作流捕捉、可分享文档、企业治理，以及如今面向 AI 的工作流上下文。其用例页面把产品连接到
              CRM、ERP、计费和项目管理采用；Series C 新闻稿加入客户赋能和软件采用；企业页面又把叙事延展到 AI 路线图和工作流优化用例。实际看，Scribe
              位于流程文档和数字采用之内，并有一条可见路径通向工作流智能。


              因此，纳入的支出应覆盖工作流与流程文档、入职和培训内容、情境指导、机构知识捕捉，以及大规模分发这些资产所需的治理层。不应自动把 BPM、RPA、项目管理、通用 wiki 或异步视频的每一美元都算进去。Notion
              和 Loom 重要，是因为它们说明买家可用更宽的工作空间或视频沟通套件解决同一问题的部分环节，但它们并不能证明这些完整品类都是 Scribe 的 TAM。


              现状替代品仍然强大。团队仍可在文档、wiki、幻灯片或视频里手工记录流程。Trainual、Process Street、Guidde、Tango、WalkMe 和 Whatfix
              等竞争者也从不同角度定义问题：培训、合规运营、AI 视频文档、引导式 walkthrough，或数字采用基础设施。因此，Scribe 的市场最好理解为一个 job-to-be-done
              集群，而不是一个完全标准化的软件品类。
