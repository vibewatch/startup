      - number: '5.3'
        title: 信任、隐私与可靠性控制
        blocks:
          - type: paragraph
            body: >-
              Scribe 的公开控制集比典型轻量浏览器扩展更厚，但记录仍不均衡。最强的已发布材料是安全页面、隐私政策、DPA
              和定价界面。合起来看，它们记录了活跃时段捕捉边界、静态和传输中加密、管理员强制和用户触发的遮盖、企业 SSO 与角色控制，以及带明确恢复目标的备份承诺。隐私和 DPA
              材料还确认，捕捉的客户内容可包括截图、击键和其他工作流工件，这解释了为什么遮盖和治理不是边缘功能，而是核心产品要求。较弱的一侧是公开信任透明度。Trust Center 抓取只得到 landing
              page，状态页在当前 uptime 窗口之外几乎没有历史叙事。对采购很重的买家来说，结果是：有法律文件支撑的安全基线可信，但还不是完全自助式的公开尽调包。
