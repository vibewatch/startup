      - number: '8.3'
        title: 情景、上行与下行
        blocks:
          - type: paragraph
            body: >-
              Scribe 的牛市情景不难想象。如果公司 ARR 已接近 $100 million，如果增长确实已经翻倍以上，如果工作流智能层把预算从文档扩展到更大范围，那么当前价格仍可能跑通。基准情景更窄：Scribe
              是逐步长进估值，而不是大幅穿越估值，因此现在的入场价只能算勉强站得住。熊市情景严厉但合理，因为估值风险对分母质量高度敏感。如果真实 ARR 低于第三方估计，如果 AI
              成本或支持负担挤压利润率，或者更大套件的捆绑压力上升，公开可比区间就会变得更有参考意义，下行空间会迅速放大。只有运营质量被证明异常强，溢价才守得住。换句话说，当前轮次价格已经计入很多好消息，留给执行、留存或市场倍数失望的空间，比叙事暗示的更少。
