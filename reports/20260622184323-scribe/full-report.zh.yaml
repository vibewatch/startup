      - number: '8.2'
        title: 融资背景与可比公司纪律
        blocks:
          - type: paragraph
            body: >-
              2025 年 Series C 证明，投资人确实愿意押注 Scribe 的工作流智能愿景；结合公司的客户和使用信号，这种热度也不难理解。但公开软件公司仍是必要的价格纪律工具。截至 2026 年 6
              月，Atlassian 约为 3.2x 收入，Asana 按 SEC 支撑的 2026 财年收入约为 2.0x，GitLab 约为
              4.5x。这些可比对象并不完美，但仍传递了一个重要信号：即便是高质量工作流或开发者软件，也不会默认拿到两位数公开市场倍数。WalkMe 以 $1.5 billion 出售、Notion 以 $11 billion
              进行 tender 等战略和私募参照说明，优质资产可以拿到更高价格；但在 retention 和经济性上拿出更硬证据之前，Scribe 当前估值还不能直接称为有吸引力。这个缺口不能证明 Scribe
              被高估，却意味着公司必须用比目前市场可见信息更扎实的证据，赚到私募溢价。
