              公开证据指向软件式经济性，但不足以证明。Scribe
              叠在客户软件之上，可通过扩展分发，而不是依赖重实施项目，这通常支持有吸引力的毛利率和高效获客。同时，公司明确营销企业级安全、遮盖、隐私和治理，而这些能力的交付和支持并非零成本。公开记录因此支持一个合理图景：这是一家强软件业务，叠加企业服务层；但权衡无法量化。毛利率、支持负担、CAC、回本期、流失或净收入留存都没有直接披露。即便
              Sacra 的 blended ARR-per-customer 估计，也只是方向性代理。用于承销时，主要结论很简单：商业模式看起来有吸引力，但单位经济大多仍是尽调室问题，而不是公开申报问题。
