      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              公开数字采用来源比通用市场报告更能看清买方地图。Whatfix 明确把需求映射到 L&D 和赋能团队、IT 与应用负责人、运营和流程 owner、质量与合规团队，以及支持团队。这些角色与 Scribe
              自身用例高度贴合：入职、软件采用、培训指南、流程标准化和 AI agent 上下文。产品由个人知识工作者和团队使用，但企业扩张取决于赢下这些有组织预算 owner 中的一个。


              替代品集合解释了买方意图为何不同。Trainual 销售集中式培训、知识和学习管理平台。Process Street 销售合规运营和受治理工作流。Guidde 销售 AI 视频文档和培训内容。Tango
              强调应用内指南和数字采用。WalkMe 与 Whatfix 把数字采用平台定义为企业应用之上的赋能和测量层。Scribe 与它们都有重叠，但不会完全归入任何一个。


              实际含义是，用户常常是流程 owner 或一线员工，付款方可能是团队负责人、运营职能、赋能团队、IT owner，或集中式企业软件预算。这在战略上有吸引力，因为它打开多条需求路径；但如果 Scribe
              不能在每个细分里持续锚定一个可复用价值主张，采购也会变得分散。
