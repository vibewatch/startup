        title: 依赖、竞争与放弃标准
        blocks:
          - type: paragraph
            body: >-
              公开记录中最大的战略风险是依赖密度。Scribe 叠在浏览器和客户应用之上，加入 AI provider 功能，并在 DAP 和协作 incumbent 资本更充足的同时继续推进工作流智能。Sacra
              明确提示对浏览器权限和第三方应用开放性的依赖。竞争证据指向同一方向：WalkMe、Whatfix、Guidde 和 Tango 等融资对手持续扩张，SAP 等战略买家也已为 DAP 资产支付真金白银。这并不意味着
              Scribe 被封死。它意味着投资者应非常仔细地观察产品独立性。如果平台 owner 捆绑足够多原生工作流捕捉，或 Scribe
              不能在集中度、支持深度和真实规模上补齐企业证明，下行会先体现在估值支撑里，之后才体现在增长叙事里。因此，本章的实际放弃标准聚焦可验证尽调输出——事故日志、集中度数据、客户合同和 cap-table-quality
