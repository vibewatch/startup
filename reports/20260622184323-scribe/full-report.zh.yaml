companyProfile:
  summary: >-
    Scribe 是一家位于 San Francisco 的私营软件公司，成立于 2019 年，最初做自动工作流捕捉，如今已扩展为更宽的 workflow-AI 平台。其核心产品通过浏览器、桌面端、API 和 MCP
    界面，把已完成的工作转成分步骤指南、SOP 和嵌入场景的工作流知识。公开证据支持真实企业牵引力、强 PLG 分发，以及 2025 年 Series C 轮 $1.3 billion
    估值，但公司仍只披露部分运营分母，已审计财务细节也有限。
