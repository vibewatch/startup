  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              以今天的公开证据看，Scribe 应继续研究，而不是回避。产品和分发故事足够强，不能轻易否定：Scribe 有庞大的免费用户楔子、有分量的企业客户背书，也能讲通一个判断——在 AI
              优先的企业技术栈里，工作流上下文会越来越值钱。问题在价格纪律。最新公开估值锚点是 2025 年 11 月的 Series C，投后估值 $1.3 billion；最好的公开 ARR 桥接仍是 Sacra 约
              $100 million 的估计。这个分母真实可参考，但未经审计。它意味着当前倍数约 13x，显著高于 Asana、Atlassian、GitLab 所体现的公开工作流软件区间。Scribe
              也许因增长和私募市场稀缺性应拿到一定溢价，但举证责任现在落在尽调上，而不是叙事上。本章给出谨慎建议，因为公开记录里尚未解决的核心问题是估值纪律，而不是市场相关性。
