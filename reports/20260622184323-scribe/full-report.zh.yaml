      - number: '5.4'
        title: 差异化、成熟度与产品风险
        blocks:
          - type: paragraph
            body: >-
              Scribe 最好的公开差异化不在任何单一捕捉功能，而在广泛工作流捕捉、分层创作和 AI-ready 检索界面的组合。Pages、Sidekick、Guide Me、企业搜索 API、MCP 和 Optimize
              都延展同一个底层资产：已记录的工作流上下文。这支持一条可信的 land-and-expand 动作：从自助捕捉切入，再扩张到企业治理和 AI 工具。同时，公开记录也显示真实约束。Scribe
              依赖浏览器扩展权限、桌面捕捉质量，以及客户是否愿意信任一家会观察工作模式的供应商。评论网站包含一条近期关于桌面截图和取消摩擦的负面投诉，提醒投资者跨界面可靠性仍然重要。竞争也很活跃：Scribe 自己反复与
              Tango、Guidde 和 UserGuiding 对比，说明该品类拥挤到需要防御性对比营销。总体看，工作流捕捉和企业包装的成熟度扎实，但 AI 优化和完全透明的信任证据仍在早期。
