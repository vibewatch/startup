  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: 公开记录显示，Scribe 依赖一套分层栈：浏览器、AI 供应商、相邻套件和企业客户。
    data:
      nodes:
        - id: core
          label: Scribe 核心平台
          description: 采集、指南、演练和工作流上下文。
        - id: browser
          label: 浏览器 / 桌面访问
          description: 扩展权限和屏幕采集。
        - id: ai
          label: AI 供应商
          description: 支撑 AI 功能和优化。
        - id: apps
          label: 已观察的企业应用
          description: 第三方应用的开放度和稳定性。
        - id: suites
          label: 平台巨头
          description: Atlassian、Microsoft、Salesforce、SAP、ServiceNow 等套件。
        - id: customers
          label: 企业客户
          description: 付费组织和受监管买家。
        - id: rivals
          label: 已融资竞争对手
          description: WalkMe、Whatfix、Guidde、Tango 及同类公司。
      edges:
        - from: browser
          to: core
        - from: ai
