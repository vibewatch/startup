            body: >-
              Scribe 的公开收入模型比许多私营工作流软件同业更清楚。定价页明确显示免费 Basic 层级、付费 Pro Personal 和 Pro Team 层级，以及定制 Enterprise
              动作。这足以支撑可信的免费增值到企业级叙事：浏览器优先用户可低成本发现产品；协作和桌面捕捉变重要后，团队可一起升级；企业随后购买治理、权限和工作流上下文功能。更新的 Optimize 和 AI
              上下文界面暗示另一条扩张路径：进入更高价值的企业预算，而不只是卖更多席位。同样重要的是未公开内容。记录没有显示实际折扣、合同期限、企业 ACV、Optimize attach rate，或 ARR
              中长尾与大客户各占多少。因此，收入模型可见，但收入质量仍只部分可见。
