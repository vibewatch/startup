      - number: '2.4'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              最强增长驱动是可衡量的采用痛点和可衡量的工作流价值。WalkMe 认为，没有数字采用，数字化转型就会失败。Whatfix 的 2026 年材料称，采用不佳会让企业无法量化 ROI；其 KPI 指南称，一家
              1,000 人的中型企业每年可能因数字采用不佳损失估计 $10.9 million。同一批 Whatfix 材料声称，DAP 用户的价值实现时间快 64%，三个月后用户熟练度高 37%，价值实现高
              67%。这些虽是厂商赞助主张，但直接解释了为什么工作流文档、情境指导和流程可见性已变成可采购的业务结果，而不是软性的协作收益。


              Scribe 自身 ROI 叙事契合这种市场拉力。官方材料声称每人每月节省 35-plus 小时，新员工 ramping 快 40%，并打入大型企业。这让关注入职、支持工单减少、软件采用、错误减少和
              AI-ready 的买家更容易理解该品类。


              主要刹车同样清楚。免费或低价替代品很多。公开标价覆盖免费套餐、低价视频工具、更宽的 wiki 套件，以及定制化企业 DAP 采购。评论网站仍主要把 Scribe
              描述为文档和培训工具，而不是完整的流程挖掘或企业自动化平台。因此，投资者应把 Scribe 承销为一家拥有强工作流文档切口和可信扩张路径的公司，但不应假设今天就能触达每一美元工作流软件或自动化预算。
