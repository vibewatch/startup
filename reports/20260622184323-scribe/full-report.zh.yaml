        - 使用分析、采用度衡量和可治理引导流程
        - 部署更重，范围也比快速捕获工具更宽
      - - Whatfix
        - 企业数字化采用老牌厂商
        - $125M Series E
        - 全球企业软件上线
        - 治理较重的 DAP，带报告和环境控制
        - 可能通过更长、更昂贵的企业销售动作成交
