            body: >-
              Scribe 的公开客户图景明显偏企业，但仍混合了几种不同采用视角。官方材料谈到 94% 的 Fortune 500、90,000 家企业、超过 5 million 用户，以及 45% 的 Fortune 500
              是付费客户。第三方报道又叠加一层：TechCrunch 称有 78,000 个付费组织，Sacra 估计约 80,000 名客户。公开网站上的具名用户集中在大型组织和受监管行业：New York
              Life、Northern Trust、TXNM Energy、Coronis Health 和 DigitalOcean，与 Mindbody、Simplot、Kubota、Learning Pool
              等更宽故事并列。这个组合说明 Scribe 并不是只卖给一个狭窄部门 niche；它跨入职、SOP、合规、软件 rollout 和流程改进。主要分层限制在于，Scribe
              没有公开按垂直行业、地域、部门或席位带拆分收入组合，所以公开故事在 logo 和结果上强，在客户经济性上弱。
