        This comparable set prioritizes decision-useful public and announced references that bound Scribe’s current
        private mark, but it is not exhaustive because comparable private marks are largely non-public.
  - id: TV005
    title: 论点破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 经审计 ARR 低于公开估计
        - 经验证 ARR 明显低于约 $100M，且没有异常出色的利润率
        - 当前估值会立刻失去分母支撑。
        - 不按 2025 年头条价格承销。
      - - 留存或利润率令人失望
        - NRR 接近上市软件平均水平，且 AI 或支持成本挤压利润率
        - 质量溢价消失，溢价倍数逻辑随之变弱。
        - 将估值重切到更接近上市可比区间。
      - - 捆绑压力上升
        - 主要平台方发布原生工作流捕获或指导，并捆绑进现有合同
        - 独立付费意愿和战略稀缺性都会下降。
        - 下调牛市概率，并扩大下行情景。
      - - Cap table 条款不利于投资者
        - 优先清算权、棘轮条款、二级交易经济性或参与权显著削弱普通股等效上行
        - 头条估值不再代表可投资经济性。
        - 暂停，直到条款或价格重置。
      - - 客户投诉演变为留存趋势
        - 支持或计费投诉在大客户或续约周期中反复出现
        - 口碑和企业扩张会变得不那么可靠。
        - 降低信心，并将留存假设视为可疑。
    notes: 这些触发项刻意连接到估值传导，而不是泛泛的经营风险。
    claimRefs:
      - CV023
      - CV033
      - CV039
      - CV040
      - CV041
      - CV044
      - CV045
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 议题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 经审计 ARR 与收入桥接
        - 已确认收入、ARR、按 cohort 划分的增长，以及免费转付费转化。
        - 当前价格对分母准确性高度敏感。
        - 财务尽调、审计师材料和董事会 KPI deck。
      - - 毛利率与 AI 成本负担
        - 按产品和客户分群拆分的云、推理和支持成本细节。
        - 只有业务守住有吸引力的软件经济性，溢价倍数才成立。
        - 财务和基础设施尽调。
      - - 留存与集中度
        - NRR、GRR、大客户集中度，以及按套餐 / cohort 划分的扩张。
        - 对估值耐久性来说，企业使用广度比 logo 数更重要。
        - 收入运营分析和客户访谈。
      - - Cap table 与优先权条款
        - 清算优先权、棘轮、员工流动性条款和参与权。
        - 经济现实可能与头条估值严重背离。
        - 律师审查融资文件和 cap table。
      - - 战略护城河验证
        - 证明工作流智能和上下文 API 正在把预算扩到文档之外。
        - 如果没有护城河证据，上市可比区间会主导讨论。
        - 产品使用分析、设计伙伴访谈，以及按产品拆分的 pipeline。
    notes: 如果这些要求无法被清楚回答，正确姿态是耐心等待，而不是激进接受价格。
    claimRefs:
      - CV011
      - CV013
      - CV023
      - CV039
      - CV042
      - CV043
      - CV044
      - CV045
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: 追踪 Scribe 从 2019 年创立，到 2025 年 Series C 和 2026 年扩展更新，同时保留可见的客户支持摩擦。
    data:
      items:
        - date: '2019'
          label: 创立
          detail: Jennifer Smith 和 Aaron Podolny 围绕流程文档痛点开始搭建 Scribe。
          tone: positive
        - date: 2021-10
          label: Series A 阶段
          detail: 官方和第三方来源显示，累计融资已超过 $30M，且 Series A 由 Tiger 领投。
          tone: positive
        - date: 2024-02
          label: Series B / Redpoint 合作
          detail: Redpoint 称其最早在 2024 年 Series B 时与 Scribe 合作。
          tone: positive
        - date: '2025-03-05'
          label: 支持投诉公开
          detail: Trustpilot 记录了一条偏企业客户的投诉，指向缓慢、依赖邮件的支持。
          tone: warning
        - date: '2025-11-10'
          label: 独立规模快照
          detail: TechCrunch 报道 500 万+用户、7.8 万个付费组织和约 120 名员工。
          tone: neutral
        - date: '2025-11-12'
          label: Series C
          detail: Scribe 完成 $75M 融资，估值 $1.3B，由 StepStone 领投。
          tone: positive
        - date: '2025-11-12'
          label: Optimize 发布
          detail: 公司从工作流捕获推进到工作流智能和 AI ROI 定位。
          tone: positive
        - date: '2026-06-17'
          label: 扩展更新
          detail: Chrome Web Store 更新让分发继续锚定在浏览器驱动的捕获上。
          tone: positive
