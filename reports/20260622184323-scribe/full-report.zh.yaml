              结果也显示，融资记录背后至少有一些 primary filing 历史。但公开图景在资产负债表之前就结束了。现金余额、月度 burn、runway
              和债务义务都未披露。员工数也没有完全勾稽，官方和聚合器来源报告的数字差异很大。因此，公开判断是：资本可得性为正，资产负债表可见度为负。Scribe
              看起来并不缺钱，但也没有给外部投资者足够材料，来干净承销偿付能力或经营杠杆。
