        - 软件质量有溢价但不极端，按 7x-9x ARR / 收入
        - $0.9B-$1.4B
      - - 熊市
        - 增长降温、捆绑加剧，或真实 ARR 低于当前第三方估计。
        - $70M-$100M
        - 更接近上市工作流软件区间，按 4x-6x ARR / 收入
        - $0.28B-$0.60B
      - - 决策锚点
        - 按当前 $1.3B 头条估值，投资者已经至少在承销基准情景的上半区。
        - 当前披露的公开锚点
        - 今天的价格意味着分母几乎不能令人失望
        - $1.3B
    notes: 这些情景是公开证据下的纪律工具，而不是管理层指引；由于分母仍是估算值，区间被有意拉宽。
