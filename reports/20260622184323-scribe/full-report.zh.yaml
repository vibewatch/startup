      - number: '1.3'
        title: 融资历史、投资方与规模
        blocks:
          - type: paragraph
            body: >-
              Scribe 公开历史中最清楚的硬数据点，是 2025 年 11 月 12 日 Series C。Scribe、TechCrunch、Yahoo 转发的新闻稿和 Pulse 2 都报道，这轮 $75
              million 融资由 StepStone 领投，投后估值 $1.3 billion，Amplify Partners、Redpoint Ventures、Tiger Global、Morado
              Ventures、New York Life Ventures 等参投。Redpoint 另称其在 2024 年 Series B 首次与 Scribe 合作；Sacra 则将更早融资重构为 2021 年 10
              月 $22 million Series A、2024 年 2 月 $25 million Series B。


              更早资本历史可见，但并不完全干净。Smith 的 2021 年信称公司已低调融资超过 $30 million，并感谢 Tiger Global、Amplify Partners、Morado
              Ventures、XYZ、Haystack 和 AME Cloud。也就是说，轮次顺序方向上清楚，但官方 >$30 million 表述与后来第三方融资总额之间的精确勾稽，仍取决于私有 cap table 细节。


              规模主张强，但对分母敏感。官方和独立来源分别称 Scribe 有超过 5 million 用户、6 million 使用者、平台上 600,000 个组织、90,000 家企业，以及 78,000 或约
              80,000 名付费客户。这些数字不一定矛盾，但也不是同一个 KPI。公开记录支持有意义的规模和高效增长，尤其与约 120
              名员工的员工数主张放在一起看更是如此；但尽调应先要求指标桥接，再把任何单一计数视为标准口径。
