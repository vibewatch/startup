  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品界面与工作流覆盖
        blocks:
          - type: paragraph
            body: >-
              Scribe 现在把自己呈现为工作流上下文平台，而不是狭窄的截屏记录器。公开界面从 Capture 开始，它记录浏览器或桌面端工作，并转成带截图和文字的分步骤指南。围绕这个核心，Scribe 搭建了
              Pages，用来把多个指南组合成更大的流程文档；Sidekick 可在用户当前应用旁边浮出相关文档；Guide Me 可提供浏览器内交互式 walkthrough；Optimize 则做工作流分析和
              AI-ready 建议。同一批材料也清楚表明，Scribe 想进入日常运营工作流：它把入职、软件 rollout、客户支持和 SOP
              创建作为可复用用例来营销，并强调分发到许多其他工具。实际产品定义是：“捕捉一次工作，然后把它复用为人和 AI 系统都能搜索的工作流上下文。”
              这比基础屏幕录制更宽、更耐久，但也意味着产品质量取决于多个相连界面，而不是单一模块。
