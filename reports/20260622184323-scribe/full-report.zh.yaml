      - number: '1.4'
        title: 里程碑、安全姿态与负面信号
        blocks:
          - type: paragraph
            body: >-
              Scribe 近期里程碑叙事内部一致。2025 年发布材料称，公司过去五年从自动化工作流捕捉，建设到更宽的 workflow-AI 平台。同一批材料推出 Scribe
              Optimize，把它放在大型专有工作流数据集之上的下一层；集成页面则称 Scribe 现在可把工作流上下文送入 AI 聊天机器人、助手、知识库、wiki 和 LMS 工具。2026 年 6 月更新的
              Chrome Web Store 列表进一步强化产品扩张，把 Scribe 营销为文档、SOP 和流程智能基础设施，而不只是记录器。


              对一家私营 SaaS 公司来说，Scribe 的安全姿态也异常可见。公开安全材料描述静态 AES-256 加密、传输中 TLS 1.2+、年度安全培训、背景调查、渗透测试，以及覆盖 SOC 2 Type
              II、HIPAA、GDPR 和 FERPA 的合规主张。Scribe 还称企业客户可选择退出 AI 功能，第三方 AI 提供商不会用客户数据训练，并会在 30 天内删除处理过的数据。


              主要负面证据是运营性的，不是生死级。Trustpilot 评论称赞入职和文档效果，但也有取消摩擦、企业响应弱和功能缺口的投诉。SourceForge 显示一条极负面的单条评分。同时，抓取时 Scribe
              的公开状态页在过去七天没有更新。由此得到的图景是：产品增长快、企业包装可信，但仍应尽调客户支持质量、指标纪律和治理透明度。
