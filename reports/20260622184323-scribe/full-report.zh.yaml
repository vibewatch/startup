      - number: '8.4'
        title: 下一步必须证明什么
        blocks:
          - type: paragraph
            body: >-
              决定性的尽调路径很直接。投资人需要经审计 ARR，或至少由管理层认证的收入桥接；还需要留存与客户集中度证明、扣除 AI 和支持成本后的毛利率可见度，以及 cap table 经济条款的清晰图景。公开证据足以说明
              Scribe 重要；但还不足以说明新投资人应在没有这些材料的情况下接受 2025 年价格。退出准备也适用同一逻辑。WalkMe 出售和 Notion tender
              说明，市场愿意为具备战略价值的工作流和知识资产付费，但这些结果需要比 Scribe
              当前公开材料更强的耐久性证据。在缺失输入到位之前，本章信息很简单：保持兴趣，但让公司自己赚到溢价。在这些材料出现之前，审慎投资人的做法是把公司留在主动尽调名单里，同时拒绝把公开层面的欣赏自动转化为价格接受。
