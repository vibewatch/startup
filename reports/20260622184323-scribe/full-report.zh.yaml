            body: >-
              相比留存耐久性，Scribe 的公开材料更容易看清扩张动作。定价页保留了经典免费增值入口，企业包装则加入治理、AI 集成和集中管理。TechCrunch
              明确描述采用先自下而上，再向团队负责人和中枢职能扩散；Sacra 则把模型概括为免费捕捉在内部传播，随后转化为企业治理支出。TXNM Energy 案例研究在这里尤其重要，因为它显示 Scribe 把扩张产品
              Optimize 卖进了既有工作流问题，而不只是卖更多文档席位。公开材料没有显示的是这套动作的合同耐久性。NRR、GRR、流失、合同期限或续约率数据都未披露。因此，公开证据支持可信的
              land-and-expand 叙事，但还不支持量化留存论点。投资者能看到账户为何可能随时间加深，但看不到它们实际可靠加深的频率。
