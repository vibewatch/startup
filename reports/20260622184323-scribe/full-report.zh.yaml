        - 匹配 Scribe 的入职、赋能和即时帮助用例
      - - 工作流软件 / 工作流自动化
        - 审批、工作流编排、流程可见性、自动化、跨应用任务管理
        - 仅咨询式流程重设计，或无关业务线应用
        - 运营、共享服务、企业软件或转型预算
