  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重度排序的风险姿态
        blocks:
          - type: paragraph
            body: >-
              Scribe 的公开材料显示，公司有真实产品拉力，信任栈也比典型工作流捕捉初创公司更成熟。这很重要，因为产品不是被动笔记工具。Scribe 自身隐私和 DPA
              文件称，平台可处理点击、击键、截图、邮件正文和其他客户内容；其营销又明确瞄准企业
              AI、工作流治理和受监管数据用例。这些主张相应带来严肃承销负担：一旦出错，法律和运营下行大于简单知识库。最高剩余风险因此落在敏感数据捕捉、AI
              供应商治理和平台依赖的交叉处。公开案例研究和融资新闻支持商业故事，但不能替代面向监管的事故、集中度或企业补救证据。因此，即便今天没有显示生死级法律困境，公开证据仍支持高剩余风险评级，因为单点失败的下行大于简单文档功能中断。
