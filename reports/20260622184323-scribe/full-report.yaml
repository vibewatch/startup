      - number: '1.4'
        title: Milestones, security posture, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              Scribe's recent milestone narrative is internally consistent. The 2025 launch materials say the company
              has spent the last five years building from automated workflow capture into a broader workflow-AI
              platform. The same materials launch Scribe Optimize as the next layer on top of a large proprietary
              workflow dataset, while the integrations page says Scribe can now feed workflow context into AI chatbots,
              assistants, knowledge bases, wikis, and LMS tools. The Chrome Web Store listing, updated in June 2026,
              reinforces that product expansion by marketing Scribe as documentation, SOP, and process-intelligence
              infrastructure rather than just a recorder.


              The company's security posture is also unusually visible for a private SaaS business. Public security
              materials describe AES-256 encryption at rest, TLS 1.2+ in transit, annual security training, background
              checks, penetration testing, and compliance claims spanning SOC 2 Type II, HIPAA, GDPR, and FERPA. Scribe
              also says enterprise customers can opt out of AI features and that third-party AI providers do not train
              on customer data and delete processed data within 30 days.


              The main adverse evidence is operational rather than existential. Trustpilot reviews praise onboarding and
              documentation impact but also include complaints about cancellation friction, weak enterprise
              responsiveness, and feature gaps. SourceForge shows a sharply negative single-review rating. At the same
              time, Scribe's public status page showed no updates in the last seven days when fetched. The resulting
              picture is of a fast-growing product with credible enterprise packaging, but one that still merits
              diligence on customer support quality, metric discipline, and governance transparency.
