      - number: '3.2'
        title: Product and pricing comparison
        blocks:
          - type: paragraph
            body: >-
              Public product pages make the segmentation logic clear even when they do not reveal perfect economics.
              Scribe is the most legible self-serve offering in the retained evidence, with explicit free, Pro Personal,
              Pro Team, and Enterprise tiers plus a team-level packaging rule that forces upgrades to happen
              collectively. Tango is visibly close in form factor but less transparent after the free workspace tier,
              which makes it harder to prove a pure pricing advantage from public data. Guidde changes the conversation
              by leaning into video creation, voiceover, and richer presentation layers. The substitutes further widen
              the budget map: Trainual and Process Street lean into ownership, workflows, and compliance; Notion and
              Guru lead with knowledge retrieval; WalkMe and Whatfix point buyers toward analytics-heavy adoption
              programs. The result is that list pricing alone is not enough to explain who wins. The real decision often
              turns on whether the buyer wants speed, multimedia polish, governed rollout, or a long-lived source of
              truth.
