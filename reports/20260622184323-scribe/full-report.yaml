  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The right public-evidence posture on Scribe today is research-more, not avoid. The product and
              distribution story are too strong for dismissal: Scribe has a large free wedge, meaningful enterprise
              references, and a credible argument that workflow context is becoming more valuable in an AI-first
              enterprise stack. The problem is price discipline. The latest public valuation anchor is the November 2025
              Series C at $1.3 billion, and the best public ARR bridge is still Sacra’s roughly $100 million estimate.
              That is a real denominator, but it is not audited. It implies a current multiple around 13x—well above the
              public workflow-software range visible in Asana, Atlassian, and GitLab. Scribe might deserve some premium
              for growth and private-market scarcity, but the burden of proof now sits on diligence rather than
              narrative. The recommendation is cautious because valuation discipline, not market relevance, is the
              central unresolved question in the public record.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV011
