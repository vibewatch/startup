      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The strongest growth drivers are measurable adoption pain and measurable workflow value. WalkMe argues
              digital transformation fails without digital adoption. Whatfix's 2026 material says poor adoption leaves
              enterprises unable to quantify ROI, while its KPI guide says a 1,000-employee mid-sized enterprise can
              lose an estimated $10.9 million annually from poor digital adoption. The same Whatfix material claims DAP
              users see 64% faster time-to-value, 37% higher user proficiency after three months, and 67% higher value
              realization. Even though those are vendor-sponsored claims, they directly explain why workflow
              documentation, contextual guidance, and process visibility have become purchasable business outcomes
              rather than soft collaboration benefits.


              Scribe's own ROI messaging fits that market pull. Official materials claim 35-plus hours saved per person
              per month, 40% faster new-hire ramping, and large-enterprise penetration. That makes the category legible
              to buyers who care about onboarding, support-ticket reduction, software adoption, error reduction, and
              AI-readiness.


              The main brakes are just as clear. Free or cheap substitutes are plentiful. Public list prices span free
              plans, low-cost video tools, broader wiki suites, and custom enterprise DAP procurement. Review sites also
              still describe Scribe primarily as a documentation and training tool, not a full process-mining or
              enterprise-automation platform. Investors should therefore underwrite Scribe as a company with a strong
              workflow-documentation wedge and credible expansion path, but not assume every workflow-software or
              automation dollar is accessible today.
