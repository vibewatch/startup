chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and business model
        blocks:
          - type: paragraph
            body: >-
              Scribe's public positioning has clearly moved beyond simple screen capture. The homepage now describes the
              product as workflow context for teams and AI agents, while the November 2025 financing materials describe
              a Workflow AI platform whose core product, Scribe Capture, automatically converts completed work into
              step-by-step guides with screenshots and text. The product is distributed through a browser extension and
              desktop app, and the Chrome Web Store listing extends that same pitch by claiming organizations can use
              Scribe to train teams, train AI agents, build SOPs, and automate manual work.


              The commercial model is freemium-to-enterprise. Scribe offers a free Basic tier, paid Pro Personal and Pro
              Team tiers, and a custom-priced enterprise tier. Public plan copy shows the upsell path clearly: desktop
              and mobile capture, exports, screenshot editing, branding, collaboration, governance, SSO, role controls,
              language translation, and automatic PII/PHI redaction. That means the monetization logic is not just more
              seats; it is also a move from individual productivity into governed organizational knowledge.


              What remains notably undisclosed is the financial conversion behind that product motion. The company is
              happy to publish user, organization, and workflow counts, but it still does not disclose ARR, revenue,
              gross margin, or enterprise contract mix on official public pages. Later valuation arguments therefore
              depend on adoption and efficiency signals more than audited operating metrics.
