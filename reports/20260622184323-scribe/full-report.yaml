            body: >-
              On traction, Scribe now looks like a real scaled software business rather than a pure usage story. The
              company announced that it surpassed $100 million ARR in May 2026, while earlier official and independent
              coverage described more than 5 million users, tens of thousands of paying organizations, and very broad
              Fortune 500 penetration. Those claims are directionally impressive, but they are not all defined the same
