      - number: '5.2'
        title: Architecture, interfaces, and delivery model
        blocks:
          - type: paragraph
            body: >-
              Public technical evidence shows Scribe delivering workflow context through multiple interfaces. Capture
              starts in a browser extension or desktop app, then hands content into a web document layer where guides
              can be edited, redacted, combined, and shared. Sidekick sits in the browser as a side panel that refreshes
              with the current site and surfaces relevant Scribes or Pages. Guide Me then turns a stored Scribe into a
              guided execution experience. For machine-facing access, Scribe documents two distinct interfaces: a keyed
              enterprise search API at public-api.scribehow.com for document search and retrieval, and a hosted MCP
              server at mcp.scribe.com/mcp for AI clients using OAuth. That split matters. The search API is a classic
              integration surface for apps or internal tools, while MCP is a newer context-delivery layer aimed directly
              at AI assistants. The architecture therefore looks less like a monolithic app and more like a
              workflow-content system exposed through browser, desktop, API, and agent connectors.
