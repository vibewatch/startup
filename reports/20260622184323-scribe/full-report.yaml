              - CP006
              - CP007
              - CP021
              - CP022
              - CP027
              - CP029
              - CP030
              - CP035
              - CP037
      - number: '3.4'
        title: Moat durability and risk register
        blocks:
          - type: paragraph
            body: >-
              The durable question is whether Scribe has built enough beyond automated screenshots to defend a
              meaningful budget line. The evidence supports a yes-but. Yes, because Scribe clearly has a sharper product
              than a generic wiki, video recorder, or manually maintained SOP repository, and because its
              workflow-context story gives it a route into AI, search, and transformation budgets that direct peers do
              not articulate as clearly. But only with caveats. WalkMe and Whatfix remain more credible for governed
              enterprise-adoption programs, while Notion-, Guru-, Trainual-, and Process Street-style substitutes can
              absorb process knowledge into a broader system of work. Meanwhile, the core capture step is increasingly
              easy for competitors to imitate. The adverse SourceForge review is a reminder that product-quality or
              support issues could narrow Scribe's PLG advantage if they persist. On balance, Scribe looks
              differentiated enough to win capture-centric use cases and to expand into workflow context, but not
              insulated from displacement if larger suites or DAPs solve the adjacent jobs more completely.
