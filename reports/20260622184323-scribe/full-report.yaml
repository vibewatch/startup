              workflow capture, layered authoring, and AI-ready retrieval surfaces. Pages, Sidekick, Guide Me, the
              enterprise search API, MCP, and Optimize all extend the same underlying asset: recorded workflow context.
              That supports a credible land-and-expand motion from self-serve capture into enterprise governance and AI
