  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and workflow coverage
        blocks:
          - type: paragraph
            body: >-
              Scribe now presents itself as a workflow-context platform rather than a narrow screenshot recorder. The
              public surface starts with Capture, which records browser or desktop work and turns it into step-by-step
              guides with screenshots and text. Around that core, Scribe has built Pages for combining multiple guides
              into larger process documents, Sidekick for surfacing relevant documentation next to the user’s current
              app, Guide Me for interactive in-browser walkthroughs, and Optimize for workflow analysis and AI-readiness
              recommendations. The same materials also make clear that Scribe wants to sit inside everyday operating
              workflows: it markets onboarding, software rollout, customer support, and SOP creation as repeatable use
              cases, and it highlights distribution into many other tools. In practice, the product definition is
              “capture work once, then reuse it as searchable workflow context for humans and AI systems.” That is a
              broader and more durable story than basic screen recording, but it also means product quality depends on
              several linked surfaces, not a single module.
