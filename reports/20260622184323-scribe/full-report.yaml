    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Sensitive workflow capture / privacy
          values:
            - label: medium-high
              tone: negative
              detail: Capture can include clicks, keystrokes, screenshots, and cross-border transfers.
            - label: high
              tone: negative
              detail: Regulated data leakage would directly impair enterprise trust and legal posture.
            - label: medium
              tone: warning
              detail: Policies, DPA, redaction, and encryption exist but real-world error rates are undisclosed.
            - label: high
              tone: negative
              detail: Residual exposure stays elevated until incident history and regulated deployments are verified.
        - label: AI-governance and vendor controls
          values:
            - label: medium
              tone: warning
              detail: Opt-out and no-training controls help but depend on partner execution.
            - label: high
              tone: negative
              detail: Failures would hit compliance narratives and enterprise expansion.
            - label: medium
              tone: warning
              detail: Deletion and provider boundaries are described, not independently verified.
            - label: medium-high
              tone: warning
              detail: Residual risk comes from opaque vendor routing and future product change.
        - label: Platform and bundling dependence
          values:
            - label: high
              tone: negative
              detail: Scribe sits on top of browsers, operating systems, and third-party apps.
            - label: high
              tone: negative
              detail: A policy or bundle shift could compress both product reach and valuation.
            - label: low-medium
              tone: warning
              detail: Workflow dataset and enterprise governance help but do not remove platform power.
            - label: high
              tone: negative
              detail: This is the clearest strategic risk in the public record.
        - label: Execution and evidence quality
          values:
            - label: medium
              tone: warning
              detail: Conflicting databases and limited disclosure keep scale underwriting fuzzy.
            - label: moderate-high
              tone: warning
              detail: This mostly harms valuation support and diligence confidence rather than immediate solvency.
            - label: medium
              tone: neutral
              detail: Recent funding, case studies, and adoption claims provide some cushion.
            - label: medium-high
              tone: warning
              detail: Residual exposure remains until private data closes the proof gap.
    approximationNotes: null
    claimRefs:
