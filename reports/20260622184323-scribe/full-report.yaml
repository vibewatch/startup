  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The call stays cautious because the valuation headline is real, but the denominator and moat proofs remain
      incomplete.
    data:
      nodes:
        - id: a
          label: Real market pull
          detail: Millions of users, named enterprise customers, and workflow ROI claims.
          tone: positive
        - id: b
          label: Dataset and AI option value
          detail: Workflow-intelligence expansion could widen the budget set.
          tone: positive
        - id: c
          label: Premium price anchor
          detail: $1.3B Series C already assumes strong economics.
          tone: warning
        - id: d
          label: Evidence gap
          detail: ARR, margin, retention, and cap-table terms are still not publicly audited.
          tone: negative
        - id: e
          label: Decision
          detail: Research-more and treat the price as stretched until diligence closes the gap.
          tone: neutral
      edges:
        - from: a
          to: e
        - from: b
          to: e
        - from: c
          to: e
        - from: d
          to: e
    approximationNotes: null
    claimRefs:
      - CV003
      - CV006
      - CV007
      - CV011
      - CV013
      - CV041
      - CV042
      - CV043
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      Scribe’s current headline becomes much easier to defend only if ARR is already large and the market continues to
      pay a premium multiple.
    data:
      items:
        - label: ARR needed at 5x
          value: 260
          detail: USD millions of ARR / revenue required to support a $1.3B value at a mature public-style multiple.
          tone: negative
        - label: ARR needed at 8x
          value: 162.5
          detail: Support threshold if Scribe keeps a premium software multiple.
          tone: warning
        - label: ARR needed at 10x
          value: 130
          detail: Threshold if the market grants an unusually strong premium.
          tone: neutral
        - label: Sacra ARR estimate
          value: 100
          detail: Third-party ARR estimate used as the best public denominator.
          tone: warning
        - label: Public comp band midpoint
          value: 3.2
          detail: Approximate public multiple anchor from Atlassian / Asana / GitLab.
          tone: negative
    approximationNotes: >-
      Sensitivity bars mix required ARR thresholds with the current public denominator and public-comp multiple band;
      they are valuation-discipline tools, not forecasts.
    claimRefs:
      - CV011
      - CV020
      - CV024
      - CV027
      - CV040
      - CV041
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Using only public evidence, the range centers below the current mark unless growth, retention, and moat all land
      in the optimistic half of outcomes.
    data:
      items:
        - label: Bear case
          low: 280
          mid: 420
          high: 600
          displayValue: $280M-$600M
          detail: ARR stalls near $70M-$100M and public-style multiples dominate.
          tone: negative
        - label: Base case
          low: 900
          mid: 1150
          high: 1440
          displayValue: $900M-$1.44B
          detail: Healthy enterprise growth continues but the market still enforces discipline.
          tone: warning
        - label: Bull case
          low: 1800
          mid: 2200
          high: 2640
          displayValue: $1.8B-$2.64B
          detail: Workflow intelligence expands budgets and the moat proves durable.
          tone: positive
    approximationNotes: Ranges are simple scenario outputs using public evidence; they intentionally avoid false DCF precision.
    claimRefs:
      - CV003
      - CV011
      - CV040
      - CV043
      - CV044
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      Scribe scores well on product pull and optionality, but only middling on evidence sufficiency and current price
      support.
    data:
      items:
        - label: Product pull
          score: 8
          detail: Case studies, paid customers, and workflow ROI claims indicate genuine demand.
          tone: positive
        - label: Expansion optionality
          score: 8
          detail: Workflow-intelligence and AI context can expand the budget set if real.
          tone: positive
        - label: Evidence quality
          score: 4
          detail: Core valuation inputs still come from estimates or company claims rather than audited disclosures.
          tone: warning
        - label: Valuation support
          score: 5
          detail: A 13x ARR anchor is possible but already assumes premium execution.
          tone: warning
        - label: Competitive insulation
          score: 5
          detail: Funded rivals and suite bundling both matter materially.
          tone: warning
        - label: Downside protection
          score: 3
          detail: Little public evidence exists on cap table, concentration, or gross margin to cushion underwriting errors.
          tone: negative
    approximationNotes: Scores are ordinal 0-10 judgments anchored to cited public evidence, not company-disclosed management KPIs.
    claimRefs:
      - CV006
      - CV007
      - CV011
      - CV013
      - CV028
      - CV029
      - CV033
      - CV041
      - CV042
      - CV045
