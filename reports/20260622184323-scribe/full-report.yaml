      - number: '4.4'
        title: Capital adequacy and balance-sheet visibility
        blocks:
          - type: paragraph
            body: >-
              Capital access is one of the strongest parts of Scribe's public financial picture. The company raised a
              $75 million Series C at a $1.3 billion valuation in late 2025, and multiple sources said it had not
              materially drawn down the prior Series B before doing so. Combined with the ARR milestone announced in
              2026, that suggests management had enough financing flexibility to raise from a position of strength
              rather than necessity. The SEC browse-EDGAR result for Colony Labs also shows that there is at least some
              primary filing history behind the financing record. But the public picture still ends before the balance
              sheet starts. Cash on hand, monthly burn, runway, and debt obligations are not disclosed. Headcount is
              also not perfectly reconciled, with official and aggregator sources reporting very different figures. The
              public verdict is therefore positive on capital access and negative on balance-sheet visibility: Scribe
              does not look starved for capital, but it also does not give outside investors enough to underwrite
              solvency or operating leverage cleanly.
