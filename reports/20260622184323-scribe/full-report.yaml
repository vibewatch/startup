  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Scribe's current market boundary is wider than classic SOP software but narrower than the whole
              workflow-automation universe. The company sells automatic workflow capture, shareable documentation,
              enterprise governance, and now AI-oriented workflow context. Its own use-cases page ties the product to
              CRM, ERP, billing, and project-management adoption; the Series C release adds customer enablement and
              software adoption; and the enterprise page extends the story into AI-roadmap and workflow-optimization use
              cases. In practical terms, Scribe sits inside process documentation and digital adoption, with a visible
              path toward workflow intelligence.


              That means included spend should cover workflow and process documentation, onboarding and training
              content, contextual guidance, institutional-knowledge capture, and the governance layer required to
              distribute those assets at scale. It should not automatically include every dollar of BPM, RPA,
              project-management, generic wiki, or async-video spend. Notion and Loom are important because they show
              how buyers can solve parts of the same problem through a broader workspace or video-communication suite,
              but they do not prove those entire categories are Scribe's TAM.


              Status-quo substitutes remain powerful. Teams can still document procedures manually in docs, wikis,
              slides, or video. Competitors such as Trainual, Process Street, Guidde, Tango, WalkMe, and Whatfix also
              frame the problem differently: training, compliance operations, AI video documentation, guided
              walkthroughs, or digital-adoption infrastructure. Scribe's market is therefore best understood as a
              job-to-be-done cluster rather than one perfectly standardized software category.
