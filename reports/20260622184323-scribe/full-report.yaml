              rest, keeps backup regions with published recovery targets, supports AI opt-out, and contractually
              restricts providers from training on customer data. Those mitigants lower the probability of a simple
              control failure. They do not eliminate the operational risk created by a product that must observe real
              workflows across browsers, desktops, and third-party applications. A recent adverse review on SourceForge
