      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              Public digital-adoption sources make the buyer map clearer than generic market reports do. Whatfix
              explicitly maps demand to L&D and enablement teams, IT and application owners, operations and process
              owners, quality and compliance teams, and support teams. Those roles line up closely with Scribe's own use
              cases: onboarding, software adoption, training guides, process standardization, and AI-agent context. The
              product is used by individual knowledge workers and teams, but enterprise expansion depends on winning one
              of those organized budget owners.


              The substitute set shows why buyer intent varies. Trainual sells a centralized training, knowledge, and
              learning-management platform. Process Street sells compliance operations and governed workflows. Guidde
              sells AI video documentation and training content. Tango emphasizes in-app guides and digital adoption.
              WalkMe and Whatfix define a digital-adoption platform as the enablement and measurement layer on top of
              enterprise applications. Scribe overlaps with all of them, but does not fully collapse into any single
              one.


              The practical implication is that the user is often a process owner or frontline employee, while the payer
              can be a team lead, operations function, enablement team, IT owner, or centralized enterprise software
              budget. That is strategically attractive because it opens several demand paths, but it also means
              procurement can become diffuse unless Scribe consistently anchors to one repeatable value proposition per
              segment.
