      - number: '1.2'
        title: Founders, leadership, and corporate footprint
        blocks:
          - type: paragraph
            body: >-
              The founding narrative is unusually coherent. Jennifer Smith's 2021 fundraise letter says she met Aaron
              Podolny in 2019 and built Scribe around a frustration she knew first-hand from McKinsey and later
              Greylock: process knowledge was still being captured manually, expensively, and too slowly. TechCrunch,
              Craft, and Redpoint all corroborate the 2019 founding year and identify Smith as CEO and Podolny as CTO.
              The same official letter adds color on founder-market fit by describing Smith's years documenting
              operations workflows and Podolny's prior sale of an automation company to Google.


              The broader executive bench is visible but not fully transparent. Craft names a VP of Engineering and VP
              of Design, the security page shows substantial security operations language, and the Chrome Web Store
              identifies Colony Labs, Inc. as the developer. That supports the picture of a real operating company
              rather than a thin product shell, but public board composition is still sparse. Redpoint's page confirms
              its first partnership came at the 2024 Series B, yet public materials reviewed here do not provide a full
              board roster or board-observer map.


              Headquarters evidence is more consistent than many venture-backed startups but still deserves precision.
              The 2025 Series C release, TechCrunch, Craft, Redpoint, and the Chrome Web Store all place the company in
              San Francisco. Craft and the Chrome Web Store each publish a specific San Francisco address, while the
              legal and privacy materials show the operating entity name Colony Labs, Inc. The most defensible public
              read is that Scribe is a San Francisco-based private company operating through Colony Labs, Inc.
