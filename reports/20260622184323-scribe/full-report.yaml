companyProfile:
  summary: >-
    Scribe is a private San Francisco software company founded in 2019 that started with automatic workflow capture and
    has expanded into a broader workflow-AI platform. Its core products turn completed work into step-by-step guides,
    SOPs, and in-context workflow knowledge through browser, desktop, API, and MCP surfaces. Public evidence supports
    real enterprise traction, strong PLG distribution, and a 2025 Series C at a $1.3 billion valuation, but the company
    still discloses only partial operating denominators and limited audited financial detail.
