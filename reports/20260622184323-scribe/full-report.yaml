      - number: '3.3'
        title: Distribution, trust, and switching costs
        blocks:
          - type: paragraph
            body: >-
              Scribe's best public moat is less about the initial capture moment than about what happens after the guide
              exists. The company pushes integrations, enterprise search, and workflow-context language that aim to move
              Scribe from a one-off recorder into a layer that can sit inside knowledge bases, AI tools, and enterprise
              enablement flows. Its security page and enterprise packaging also show that Scribe wants to be evaluated
              as a trust-sensitive enterprise tool, not just a lightweight extension. That matters because switching
              costs in this category are rarely driven by one guide alone; they come from where guides are embedded, who
              governs them, and how much downstream process context accumulates around them. Still, DAP incumbents are
              stronger where change-management analytics and controlled in-app guidance dominate the purchase, while
              knowledge suites are stronger when the buyer wants a canonical repository. Scribe can hold ground where
              capture speed and downstream reuse both matter, but it has to avoid being trapped as a narrow authoring
              utility.
            claimRefs:
