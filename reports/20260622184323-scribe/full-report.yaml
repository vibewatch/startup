  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Pricing and revenue architecture
        blocks:
          - type: paragraph
            body: >-
              Scribe's public revenue model is clearer than that of many private workflow-software peers. The pricing
              page explicitly shows a free Basic tier, paid Pro Personal and Pro Team tiers, and a custom Enterprise
              motion. That is enough to support a credible freemium-to-enterprise story: a browser-first user can
              discover the product cheaply, a team can upgrade together once collaboration and desktop capture matter,
              and an enterprise can later buy governance, permissions, and workflow-context features. The newer Optimize
              and AI-context surfaces suggest an additional expansion path into higher-value enterprise budgets, not
              just more seats. What is not public is just as important. The record does not show realized discounting,
              contract duration, enterprise ACV, attach rates for Optimize, or how much ARR comes from the long tail
              versus large accounts. So the revenue model is visible, but the quality of that revenue remains only
              partially visible.
