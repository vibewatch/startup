            body: >-
              The largest strategic risk in the public record is dependency density. Scribe sits on top of browsers and
              customer applications, layers in AI-provider functionality, and now pushes further into workflow
              intelligence at the same time that DAP and collaboration incumbents are getting better capitalized. Sacra
              explicitly flags dependence on browser permissions and the openness of third-party apps. Competitive
              evidence points in the same direction: funded rivals such as WalkMe, Whatfix, Guidde, and Tango keep
              expanding, while strategic buyers like SAP have already paid real money for DAP assets. That does not mean
              Scribe is boxed in. It means investors should watch the product’s independence very closely. If platform
              owners bundle enough native workflow capture or if Scribe cannot reconcile enterprise proof on
              concentration, support depth, and real scale, the downside will show up first in valuation support and
              only later in growth narratives. That is why the practical kill criteria in this chapter focus on
              verifiable diligence outputs—incident logs, concentration data, customer contracts, and cap-table-quality
              scale evidence—rather than on more speculative market storytelling.
            claimRefs:
