            body: >-
              Scribe’s public control set is more substantial than a typical lightweight browser extension, but it is
              still unevenly documented. The strongest published material is the security page, privacy policy, DPA, and
              pricing surface. Together they document active-period capture boundaries, encryption at rest and in
              transit, admin-enforced and user-triggered redaction, enterprise SSO and role controls, and backup
