  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              Scribe’s public materials show a company with real product pull and a more mature trust stack than a
              typical workflow-capture startup. That matters because the product is not a passive note-taking tool.
              Scribe’s own privacy and DPA documents say the platform can process clicks, keystrokes, screenshots, email
              bodies, and other customer content, while its marketing explicitly targets enterprise AI, workflow
              governance, and regulated-data use cases. Those claims create a correspondingly serious underwriting
              burden: the legal and operational downside of a mistake is larger than the downside for a simple knowledge
              base. The highest residual risks therefore sit where sensitive-data capture, AI-vendor governance, and
              platform dependence overlap. Public case studies and funding news support the commercial story, but they
              do not replace regulator-ready evidence on incidents, concentration, or enterprise remedies. The public
              evidence therefore supports a high residual-risk rating even though it does not show existential legal
              distress today, because the downside of a single failure is larger than the downside of a simple
              documentation feature outage.
