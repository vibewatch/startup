  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Scribe’s main risks all flow through a small number of transmission channels: trust, continuity, expansion, and
      valuation support.
    data:
      nodes:
        - id: n1
          label: Sensitive workflow capture
          description: Screens, clicks, keystrokes, and regulated data.
        - id: n2
          label: AI provider controls
          description: Opt-out, deletion, and no-training commitments.
        - id: n3
          label: Platform dependence
          description: Browser, desktop, and third-party application openness.
        - id: n4
          label: Enterprise trust
          description: Security reviews, legal terms, and reliability confidence.
        - id: n5
          label: Adoption and expansion
          description: Seat growth, paid conversion, and regulated use cases.
        - id: n6
          label: Next-round support
          description: Ability to defend premium valuation and growth narrative.
      edges:
        - from: n1
          to: n4
        - from: n2
          to: n4
        - from: n3
          to: n4
        - from: n3
          to: n5
        - from: n4
          to: n5
        - from: n5
