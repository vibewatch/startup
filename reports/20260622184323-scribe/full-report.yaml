      - number: '1.3'
        title: Funding history, investors, and scale
        blocks:
          - type: paragraph
            body: >-
              The clearest hard datapoint in Scribe's public history is the November 12, 2025 Series C. Scribe,
              TechCrunch, Yahoo's carried press release, and Pulse 2 all report a $75 million round led by StepStone at
              a $1.3 billion post-money valuation, with participation from Amplify Partners, Redpoint Ventures, Tiger
              Global, Morado Ventures, New York Life Ventures, and others. Redpoint separately says it first partnered
              with Scribe at the 2024 Series B, while Sacra reconstructs the earlier stack as a $22 million Series A in
              October 2021 and a $25 million Series B in February 2024.


              Earlier capital history is visible but not perfectly clean. Smith's 2021 letter says the company had
              already quietly raised more than $30 million, and thanks Tiger Global, Amplify Partners, Morado Ventures,
              XYZ, Haystack, and AME Cloud. That means the round chronology is directionally clear, but the exact
              reconciliation between the official >$30 million statement and later third-party funding totals still
              depends on private cap-table detail.


              Scale claims are strong but denominator-sensitive. Official and independent sources variously say Scribe
              has more than 5 million users, 6 million people who use it, 600,000 organizations on the platform, 90,000
              enterprises, and 78,000 or about 80,000 paying customers. These numbers are not necessarily contradictory,
              but they are not the same KPI either. The public record supports meaningful scale and efficient growth,
              especially when paired with the ~120-employee headcount claim, but diligence should demand a metric bridge
              before treating any single count as canonical.
