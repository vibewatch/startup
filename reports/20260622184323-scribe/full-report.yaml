  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and alternative set
        blocks:
          - type: paragraph
            body: >-
              Scribe is not competing inside one clean category. The nearest overlap comes from browser- and
              desktop-assisted workflow capture tools such as Tango and Guidde, which promise to turn a live workflow
              into a polished guide with much less manual screenshotting and writing. But the actual buyer job quickly
              broadens beyond capture. WalkMe and Whatfix attack the same problem from an enterprise digital-adoption
              angle, emphasizing governance, analytics, and guided execution across many business-critical applications.
              Trainual, Process Street, Notion, Guru, and Whale matter when a team wants a durable SOP or knowledge
              repository more than it wants instant recording. Loom and the broader async-video status quo remain viable
              for lightweight explanation. That means Scribe has to win not only against direct capture peers, but also
              against repositories, enablement suites, and transformation platforms that absorb the documentation job
              into a wider system of work.
