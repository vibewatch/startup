      - number: '4.3'
        title: Cost structure and unit-economics gaps
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to software-like economics but stops short of proving them. Scribe is layered on
              top of customer software and can distribute through an extension rather than through a heavy
              implementation project, which usually supports attractive gross margins and efficient acquisition. At the
              same time, the company clearly markets enterprise-grade security, redaction, privacy, and governance, and
              those capabilities are not costless to deliver or support. The public record therefore supports a
              plausible picture of a strong software business with enterprise-service overlays, but it cannot quantify
              the trade-off. There is no direct disclosure of gross margin, support burden, CAC, payback, churn, or net
              revenue retention. Even Sacra's blended ARR-per-customer estimate is only a directional proxy. For
              underwriting, the main conclusion is simple: the business model looks attractive, but the unit economics
              are still mostly a diligence-room problem rather than a public-filing problem.
