      - number: '8.3'
        title: Scenarios, upside, and downside
        blocks:
          - type: paragraph
            body: >-
              The bull case for Scribe is not hard to imagine. If the company is already near $100 million of ARR, if
              growth really has more than doubled, and if the workflow-intelligence layer expands budgets beyond
              documentation, the current price can still work. The base case is narrower: Scribe grows into the
              valuation rather than dramatically through it, leaving the present entry price only modestly defensible.
              The bear case is harsh but plausible because valuation risk is highly sensitive to denominator quality. If
              real ARR is below third-party estimates, if AI cost or support burden compress margin, or if bundling
              pressure from larger suites increases, the public comp band becomes much more relevant and downside
              expands quickly. The premium can survive only if operating quality proves unusually strong. In other
              words, the current round price already discounts a lot of good news and leaves less room for execution,
              retention, or market-multiple disappointment than the narrative might suggest.
            claimRefs:
              - CV008
