  topStrengths:
    - 浏览器与桌面端捕获带来强 PLG 分发，免费到企业版的转化路径清楚。
    - 宽工作流数据集和 Scribe Optimize 扩张，拼出可信的 AI 上下文与流程智能楔子。
    - 公开企业证据包括 94% Fortune 500 使用声明，以及 New York Life、Northern Trust 等标杆客户引用。
    - 安全与治理打包比许多轻量文档同行更成熟，覆盖 DPA、脱敏、SSO 和 AI 退出控制。
    - 公司在约 120 名员工时就达到有分量的宣称规模；如果披露指标站得住，商业杠杆效率不错。
  topRisks:
    - 2025 年 $1.3B 估值相对当前公开工作流软件基准隐含溢价倍数。
    - 公开规模指标混用了用户、组织、企业和付费客户，分母质量成为核心尽调风险。
    - Scribe 会捕获敏感工作流内容，在受监管账户里带来隐私、合规和 AI 供应商治理暴露。
    - Atlassian、Salesforce、ServiceNow、WalkMe、Whatfix、Notion 等套件的平台化和捆绑压力，可能挤压独立产品价值。
    - 公开投诉提到取消摩擦和桌面端捕获质量；如果支持深度跟不上，扩张和留存都会承压。
  unresolvedGaps:
    - 经审计 ARR、毛利率、烧钱速度、现金跑道和 NRR 仍未进入公开记录。
    - 5M 用户、6M 用户、600K 组织、90K 企业，以及 78K/80K 付费客户之间的桥接口径仍未公开调和。
    - 董事会构成、清算优先权和详细股权结构经济条款没有公开披露。
    - 公开证据没有给出事故日志、SLA 抵扣数据，或按客户分层拆分的流失队列。
    - Scribe Optimize 相对传统文档产品的附加率和变现曲线仍不清楚。
