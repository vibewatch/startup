- id: S703
  title: Operational, product-quality, and trust risk
  body: Public security disclosure is directionally encouraging. Scribe says it encrypts data in transit and at rest, keeps backup regions with published recovery targets, supports AI opt-out, and contractually restricts providers from training on customer data. Those mitigants lower the probability of a simple control failure. They do not eliminate the operational risk created by a product that must observe real workflows across browsers, desktops, and third-party applications. A recent adverse review on SourceForge and Slashdot specifically complained about desktop-capture quality and hard-to-resolve billing cancellation issues. That is only one data point, but it is still a useful reminder that workflow-capture reliability and support quality matter disproportionately in this category because one bad deployment can sour expansion inside an account. The public status page and customer stories are helpful, yet they do not substitute for incident logs, SLA credits, or postmortems.
  claimRefs:
  - CR007
  - CR008
  - CR009
  - CR010
  - CR011
  - CR012
  - CR026
  - CR031
  - CR042
  - CR043
  tableRefs:
  - TR004
  figureRefs:
  - FR002
- id: S704
  title: Dependency, competition, and kill criteria
  body: 'The largest strategic risk in the public record is dependency density. Scribe sits on top of browsers and customer applications, layers in AI-provider functionality, and now pushes further into workflow intelligence at the same time that DAP and collaboration incumbents are getting better capitalized. Sacra explicitly flags dependence on browser permissions and the openness of third-party apps. Competitive evidence points in the same direction: funded rivals such as WalkMe, Whatfix, Guidde, and Tango keep expanding, while strategic buyers like SAP have already paid real money for DAP assets. That does not mean Scribe is boxed in. It means investors should watch the product’s independence very closely. If platform owners bundle enough native workflow capture or if Scribe cannot reconcile enterprise proof on concentration, support depth, and real scale, the downside will show up first in valuation support and only later in growth narratives. That is why the practical kill criteria
    in this chapter focus on verifiable diligence outputs—incident logs, concentration data, customer contracts, and cap-table-quality scale evidence—rather than on more speculative market storytelling.'
