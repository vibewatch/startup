  evidenceGaps:
  - type: missing-source
    severity: material
    topic: regulator-history
    missingEvidence: Direct regulator or court records showing whether Scribe or Colony Labs has any privacy complaints, subpoenas, or enforcement matters outstanding.
    whyItMatters: The public legal stack is polished, but investor risk changes if there are hidden complaints or investigations.
    diligencePath: Request legal docket search results, outside counsel letter, and any regulator correspondence log for the last thirty-six months.
    relatedQuestionRefs:
    - QR005
    - QR029
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: incident-history
    missingEvidence: Incident postmortems, SLA credits, customer-severity history, and any breach notifications.
    whyItMatters: Public uptime scaffolding does not reveal whether reliability or security incidents are frequent enough to impair enterprise trust.
    diligencePath: Ask for the last twelve months of Sev-1/Sev-2 incidents, enterprise SLA terms, and any security-incident disclosure register.
    relatedQuestionRefs:
    - QR010
  - type: private-evidence-only
    severity: blocking
    topic: customer-concentration
    missingEvidence: Top-customer revenue concentration, renewal status, and concentration by industry or regulated segment.
    whyItMatters: Without concentration data, it is hard to know whether the apparent enterprise penetration is broad or dependent on a few flagship accounts.
    diligencePath: Request cohort revenue tables, top-20 account concentration, and renewal calendars segmented by plan and industry.
    relatedQuestionRefs:
    - QR024
    relatedTableRefs:
    - TR004
  - type: conflicting-data
    severity: material
    topic: operating-scale-data
    missingEvidence: A management-verified employee count, revenue bridge, and funding history that reconciles conflicting third-party databases.
    whyItMatters: Headcount, funding, and revenue disagreement lowers confidence in execution and valuation underwriting.
    diligencePath: Request current org chart totals, payroll headcount by function, and a financing history cap-table summary.
    relatedQuestionRefs:
    - QR019
    - QR020
    - QR021
