company:
  name: Scribe
chapter:
  number: 7
  title: Risks
  summary: Scribe’s public risk profile is shaped less by obvious distress than by sensitive-data exposure, platform dependence, and evidence gaps around enterprise quality. The company presents a credible legal and security stack for workflow capture, but its own policies confirm that customer content can include screenshots, keystrokes, and other regulated information, while the product still depends on browser, desktop, AI-vendor, and third-party application access. Publicly available complaints, conflicting scale databases, and limited disclosure on incidents, concentration, and contracted remedies keep residual exposure elevated even after the 2025 Series C.
