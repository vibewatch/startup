sections:
- id: S701
  title: Severity-ranked risk posture
  body: 'Scribe’s public materials show a company with real product pull and a more mature trust stack than a typical workflow-capture startup. That matters because the product is not a passive note-taking tool. Scribe’s own privacy and DPA documents say the platform can process clicks, keystrokes, screenshots, email bodies, and other customer content, while its marketing explicitly targets enterprise AI, workflow governance, and regulated-data use cases. Those claims create a correspondingly serious underwriting burden: the legal and operational downside of a mistake is larger than the downside for a simple knowledge base. The highest residual risks therefore sit where sensitive-data capture, AI-vendor governance, and platform dependence overlap. Public case studies and funding news support the commercial story, but they do not replace regulator-ready evidence on incidents, concentration, or enterprise remedies. The public evidence therefore supports a high residual-risk rating even though
    it does not show existential legal distress today, because the downside of a single failure is larger than the downside of a simple documentation feature outage.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR013
  - CR018
  - CR032
  - CR033
  - CR036
  tableRefs:
  - TR002
  figureRefs:
  - FR001
- id: S702
  title: Regulatory and legal exposure
  body: 'The legal stack is solid on paper but still creates real exposure. Scribe publicly claims support for GDPR, HIPAA, and other global privacy standards; the DPA and privacy policy provide unusually specific language on processor posture, audit rights, retention, and transfer mechanics. That is a positive. The same documents also confirm why the risk is material: workflow capture can include regulated content, data may be processed in the United States and elsewhere, and legal terms rely on mandatory arbitration, auto-renewal, and limited storage obligations. EU and U.S. regulators expect data minimization, safeguards, and incident planning when businesses hold sensitive personal information. Without direct evidence on regulator correspondence, breach notices, or large-customer contract carve-outs, the right posture is to treat compliance as a top-tier diligence item rather than a box already checked.'
  claimRefs:
  - CR006
  - CR013
  - CR015
  - CR016
  - CR017
