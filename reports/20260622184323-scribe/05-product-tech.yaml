- id: trust-controls-and-reliability
  title: Trust, privacy, and reliability controls
  body: Scribe’s public control set is more substantial than a typical lightweight browser extension, but it is still unevenly documented. The strongest published material is the security page, privacy policy, DPA, and pricing surface. Together they document active-period capture boundaries, encryption at rest and in transit, admin-enforced and user-triggered redaction, enterprise SSO and role controls, and backup commitments with stated recovery objectives. The privacy and DPA materials also confirm that captured customer content can include screenshots, keystrokes, and other workflow artifacts, which explains why redaction and governance are not side features but core product requirements. The weaker side is public trust transparency. The Trust Center fetch yielded only a landing page, and the status page offers very little historical narrative beyond current uptime windows. For procurement-heavy buyers, the result is a credible baseline security story backed by legal documents, but not
    a fully self-service public diligence package.
  claimRefs:
  - CE015
  - CE016
  - CE017
  - CE018
  - CE019
  - CE020
  - CE021
  - CE022
  - CE031
  - CE032
