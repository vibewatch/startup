- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Current status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Capture (browser / desktop)
    - Individual creator or team lead
    - Live core product
    - Turns live work into guides without manual screenshotting
    - Capture quality by complex desktop app is not publicly benchmarked
  - - Pages
    - Team leads and documentation owners
    - Live feature surface
    - Combines multiple guides, media, and context into one process document
    - No public limits or adoption split versus standard Scribes
  - - Sidekick
    - Knowledge consumer in another app
    - Live on all plans per support docs
    - Surfaces relevant docs in-context on the current website
    - Relevance ranking quality is not independently validated
  - - Guide Me
    - End user following a live process
    - Live for post-Oct-2023 Scribes
    - Converts docs into interactive browser walkthroughs
    - Coverage appears browser-centric in public docs
  - - Enterprise search API
    - Enterprise app / internal tool builder
    - Live enterprise feature
    - Programmatic search over organization documents
    - No public throughput, SLA, or pricing details
  - - MCP server
    - AI assistant / agent operator
    - Live enterprise feature
    - OAuth-based access for major AI clients without custom connector work
    - Permissions and rate limits are documented, but scale limits are not
  - - Optimize
    - Ops leader / transformation owner
    - Live but newer than Capture
    - Uses workflow data to rank automation and AI opportunities
    - Public proof relies heavily on company narrative and one named case study
  notes: Rows are reconstructed from official product, support, and launch materials rather than a single canonical SKU sheet; maturity labels reflect visible public evidence, not private roadmap access.
