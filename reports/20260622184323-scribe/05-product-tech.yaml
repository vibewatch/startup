- id: differentiation-maturity-and-risks
  title: Differentiation, maturity, and product risks
  body: 'Scribe’s best public differentiation is not any single capture feature; it is the combination of broad workflow capture, layered authoring, and AI-ready retrieval surfaces. Pages, Sidekick, Guide Me, the enterprise search API, MCP, and Optimize all extend the same underlying asset: recorded workflow context. That supports a credible land-and-expand motion from self-serve capture into enterprise governance and AI tooling. At the same time, the public record shows real constraints. Scribe depends on browser extension permissions, desktop capture quality, and the willingness of customers to trust a vendor that observes work patterns. Review sites include a recent adverse complaint about desktop screenshots and cancellation friction, reminding investors that cross-surface reliability still matters. Competition is also active: Scribe itself repeatedly compares against Tango, Guidde, and UserGuiding, which implies the category is crowded enough to require defensive comparison marketing.
    Overall, maturity looks solid for workflow capture and enterprise packaging, but still emergent for AI optimization and fully transparent trust evidence.'
