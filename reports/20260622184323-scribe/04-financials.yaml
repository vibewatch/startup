- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Current public proxy
  - Exact diligence path
  rows:
  - - Cash balance
    - Cannot size runway or cushion
    - Unused-Series-B narrative plus new Series C
    - Request latest balance sheet and monthly cash bridge
  - - Net burn
    - Cannot test capital adequacy against hiring plans
    - Headcount growth plans only
    - Request trailing 12-month burn and forward budget
  - - Gross margin
    - Cannot test software economics quality
    - Product is software-like but enterprise support may be meaningful
    - Request gross margin by product and segment
  - - Retention / NRR
    - Cannot underwrite durable compounding
    - Case studies and usage claims only
    - Request logo retention, gross retention, and NRR by cohort
  - - Sales efficiency
    - Cannot compare PLG efficiency with enterprise spend needs
    - Browser-extension distribution and customer ROI claims
    - Request CAC, S&M payback, and sales cycle by channel
  - - Revenue mix
    - Cannot tell how much ARR comes from long-tail teams versus enterprise contracts
    - List pricing plus broad customer-count claims
    - Request ARR split by self-serve, team, enterprise, and Optimize
  notes: Every row names a specific diligence path so nulls remain actionable rather than decorative.
