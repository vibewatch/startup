chapter:
  number: 4
  title: Financials
  summary: Scribe now has a clear public monetization surface and has crossed a meaningful ARR threshold, but the public record is still much stronger on pricing, fundraising, and growth headlines than on the core underwriting inputs of burn, margin, retention, and cash.
sections:
- id: pricing-and-revenue-architecture
  title: Pricing and revenue architecture
  body: 'Scribe''s public revenue model is clearer than that of many private workflow-software peers. The pricing page explicitly shows a free Basic tier, paid Pro Personal and Pro Team tiers, and a custom Enterprise motion. That is enough to support a credible freemium-to-enterprise story: a browser-first user can discover the product cheaply, a team can upgrade together once collaboration and desktop capture matter, and an enterprise can later buy governance, permissions, and workflow-context features. The newer Optimize and AI-context surfaces suggest an additional expansion path into higher-value enterprise budgets, not just more seats. What is not public is just as important. The record does not show realized discounting, contract duration, enterprise ACV, attach rates for Optimize, or how much ARR comes from the long tail versus large accounts. So the revenue model is visible, but the quality of that revenue remains only partially visible.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  - CI033
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: public-traction-and-sales-efficiency-proxies
  title: Public traction and sales-efficiency proxies
  body: On traction, Scribe now looks like a real scaled software business rather than a pure usage story. The company announced that it surpassed $100 million ARR in May 2026, while earlier official and independent coverage described more than 5 million users, tens of thousands of paying organizations, and very broad Fortune 500 penetration. Those claims are directionally impressive, but they are not all defined the same way. Official pages talk about 600,000 organizations and 90,000 enterprises, while TechCrunch described 78,000 paid organizations; each number may be true in context, but together they still leave some ambiguity about what is free usage versus paid depth. Sales-efficiency proxies are better than nothing but weaker than a full data room. The browser extension, free tier, and customer ROI case studies all support a low-friction PLG motion, yet CAC, payback, and revenue concentration remain private. That means scale is visible, while efficiency is still inferred.
  claimRefs:
  - CI008
  - CI009
  - CI010
  - CI011
  - CI012
  - CI013
  - CI023
  - CI026
  - CI027
  - CI034
  tableRefs:
  - TI003
  figureRefs:
  - FI002
  - FI003
- id: cost-structure-and-unit-economics-gaps
  title: Cost structure and unit-economics gaps
  body: 'Public evidence points to software-like economics but stops short of proving them. Scribe is layered on top of customer software and can distribute through an extension rather than through a heavy implementation project, which usually supports attractive gross margins and efficient acquisition. At the same time, the company clearly markets enterprise-grade security, redaction, privacy, and governance, and those capabilities are not costless to deliver or support. The public record therefore supports a plausible picture of a strong software business with enterprise-service overlays, but it cannot quantify the trade-off. There is no direct disclosure of gross margin, support burden, CAC, payback, churn, or net revenue retention. Even Sacra''s blended ARR-per-customer estimate is only a directional proxy. For underwriting, the main conclusion is simple: the business model looks attractive, but the unit economics are still mostly a diligence-room problem rather than a public-filing
    problem.'
  claimRefs:
  - CI024
  - CI025
  - CI027
  - CI028
  - CI029
  - CI033
- id: capital-adequacy-and-balance-sheet-visibility
  title: Capital adequacy and balance-sheet visibility
  body: 'Capital access is one of the strongest parts of Scribe''s public financial picture. The company raised a $75 million Series C at a $1.3 billion valuation in late 2025, and multiple sources said it had not materially drawn down the prior Series B before doing so. Combined with the ARR milestone announced in 2026, that suggests management had enough financing flexibility to raise from a position of strength rather than necessity. The SEC browse-EDGAR result for Colony Labs also shows that there is at least some primary filing history behind the financing record. But the public picture still ends before the balance sheet starts. Cash on hand, monthly burn, runway, and debt obligations are not disclosed. Headcount is also not perfectly reconciled, with official and aggregator sources reporting very different figures. The public verdict is therefore positive on capital access and negative on balance-sheet visibility: Scribe does not look starved for capital, but it also does not give
    outside investors enough to underwrite solvency or operating leverage cleanly.'
  claimRefs:
  - CI014
  - CI015
  - CI016
  - CI017
