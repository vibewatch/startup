- id: financial-verdict-and-blockers
  title: Financial verdict and blockers
  body: 'The most supportable underwriting view is that Scribe has crossed the threshold from interesting PLG product to legitimate scaled software platform, but has not crossed the threshold from compelling story to fully underwritable private company. The positives are meaningful: list pricing is visible, enterprise monetization is credible, ARR is now publicly claimed at $100 million, and the company appears to have raised capital without running out of its prior round. The risks are equally meaningful. Public metrics for cash, burn, retention, gross margin, and true customer mix are missing; organization and headcount counts are not perfectly consistent; and an adverse review shows that service quality at the edge can still matter. Put differently, the public record supports confidence in revenue model clarity and financing access, moderate confidence in growth efficiency, and low confidence in balance-sheet durability. Any investment case should therefore treat margin path, retention
    quality, and runway as first-order diligence blockers rather than cleanup questions.'
  claimRefs:
  - CI019
  - CI022
  - CI030
  - CI032
  - CI033
  - CI034
  - CI035
  - CI036
  - CI038
