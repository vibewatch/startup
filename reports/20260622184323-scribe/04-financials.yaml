  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: runway
    missingEvidence: Current cash balance, monthly burn, and runway by base and downside case.
    whyItMatters: Capital adequacy cannot be underwritten from funding headlines alone.
    diligencePath: Request the latest board package with cash, burn, hiring plan, and downside scenario runway.
    relatedQuestionRefs:
    - QI019
    - QI020
  - type: private-evidence-only
    severity: blocking
    topic: retention
    missingEvidence: Logo retention, gross retention, and net revenue retention by cohort and segment.
    whyItMatters: Without retention, it is impossible to tell whether Scribe is a durable compounder or a high-churn PLG business with enterprise outliers.
    diligencePath: Request cohort retention tables and NRR by self-serve, team, and enterprise segment.
    relatedQuestionRefs:
    - QI017
  - type: private-evidence-only
    severity: material
    topic: margin
    missingEvidence: Gross margin and support / infrastructure cost breakdown by product line.
    whyItMatters: The underwriting case changes materially if enterprise compliance and service layers dilute software-like margins.
    diligencePath: Request revenue less COGS split by self-serve, enterprise, and Optimize products.
    relatedQuestionRefs:
    - QI016
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A reconciled employee-count definition and date.
    whyItMatters: Revenue-per-employee and burn estimates change materially depending on whether headcount is about 120 or above 200.
    diligencePath: Request month-end employee counts for the last twelve months and clarify whether contractors are included.
    relatedQuestionRefs:
    - QI014
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback, channel mix, and sales-cycle data by segment.
    whyItMatters: PLG distribution can still mask expensive enterprise conversion if sales assist or support intensity is high.
    diligencePath: Request marketing spend, sales headcount productivity, CAC, and payback split by self-serve and enterprise.
    relatedQuestionRefs:
    - QI009
    - QI016
  - type: missing-source
    severity: minor
    topic: obligations
    missingEvidence: Debt schedules, lease obligations, and any contingent liabilities are not visible publicly.
    whyItMatters: Public absence of debt is not proof that balance-sheet obligations are immaterial.
    diligencePath: Request debt, lease, and off-balance-sheet obligation schedules from the finance data room.
    relatedQuestionRefs:
    - QI018
