evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, observer rights, and any special governance terms attached to the 2024 or 2025 rounds.
    whyItMatters: >-
      Investor quality is clear, but governance transparency remains thin, which limits judgment on control and
      oversight.
    diligencePath: Request the latest board deck, investor rights agreement, and cap table summary.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Current ARR, revenue growth, gross margin, and enterprise mix.
    whyItMatters: >-
      The company is valued at unicorn levels, but public evidence does not expose the economic conversion behind its
      large user base.
    diligencePath: Request audited financials or board reporting on revenue, ARR, retention, and margin.
    relatedQuestionRefs:
      - QO014
      - QO025
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: metric-discipline
    missingEvidence: A management bridge reconciling users, people, organizations, enterprises, and paying-customer counts.
    whyItMatters: Without denominator discipline, traction claims can be overstated or compared incorrectly across time.
    diligencePath: Ask management to define each metric, last-updated date, and overlap between free and paid cohorts.
    relatedQuestionRefs:
      - QO015
      - QO025
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: legal-incidents
    missingEvidence: >-
      A more systematic legal, regulatory, and security-incident scan than the public pages and review sites currently
      provide.
    whyItMatters: >-
      The reviewed public record did not reveal major incidents, but absence of evidence on public pages is not the same
      as confirmed absence.
    diligencePath: Run targeted docket, regulator, and breach-database searches in the next refresh.
    relatedQuestionRefs:
      - QO024
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-coverage
    missingEvidence: A fuller executive roster beyond the handful of publicly named leaders.
    whyItMatters: Key-person dependence and bench depth are important for a fast-scaling private company.
    diligencePath: Request org chart, executive bios, and department heads during management diligence.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: sam
    missingEvidence: >-
      A management-quality breakdown of revenue or pipeline by documentation, guidance, governance, and AI-context
      products.
    whyItMatters: >-
      Without a product or segment revenue split, public market lenses bracket the opportunity but do not produce a
      clean Scribe-specific SAM or SOM.
    diligencePath: Request segment revenue, ACV by motion, and win-rate data by buyer type.
    relatedQuestionRefs:
      - QM007
      - QM023
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-economics
    missingEvidence: A repeatable budget-owner map showing which functions actually buy Scribe and how deals are funded.
    whyItMatters: >-
      The market is attractive, but procurement can be diffuse across ops, IT, enablement, compliance, and
      transformation teams.
    diligencePath: Ask management for top ten customer archetypes, budget owner, and expansion path by segment.
    relatedQuestionRefs:
      - QM009
      - QM010
    relatedTableRefs:
      - TM003
      - TM004
  - type: conflicting-data
    severity: minor
    topic: pricing-realization
    missingEvidence: Net realized pricing, discounting, and enterprise packaging detail rather than public list prices alone.
    whyItMatters: >-
      The substitute set spans free to custom enterprise, so list prices alone do not reveal actual competitive pricing
      power.
    diligencePath: Request packaging architecture, typical discount ranges, and expansion behavior by segment.
    relatedQuestionRefs:
      - QM017
      - QM018
  - type: missing-source
    severity: minor
    topic: geography-vertical-mix
    missingEvidence: A clearer view of vertical and geographic mix for Scribe's enterprise customer base.
    whyItMatters: >-
      Public adjacent-market reports show regional and industry patterns, but not how much of that demand Scribe has
      captured.
    diligencePath: Request customer mix by vertical, geography, and regulated versus unregulated workflows.
    relatedQuestionRefs:
      - QM021
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Realized ACV, discounting, and seat-expansion data for Scribe and direct peers.
    whyItMatters: List prices alone do not show whether Scribe wins on economics or only on product shape.
    diligencePath: >-
      Request anonymized recent quotes, average contract value by segment, and win-loss pricing notes versus Tango,
      Guidde, WalkMe, and Whatfix.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: material
    topic: win-loss-data
    missingEvidence: Actual win-loss and displacement data by buyer job and segment.
    whyItMatters: Public competitor pages show positioning but not where Scribe truly wins or loses in market.
    diligencePath: >-
      Ask for a segmented win-loss report covering direct capture peers, DAP incumbents, and knowledge-suite
      substitutes.
    relatedQuestionRefs:
      - QP025
  - type: missing-source
    severity: minor
    topic: competitor-trust-surface
    missingEvidence: Consistent third-party proof on competitor security depth and compliance scope.
    whyItMatters: Enterprise trust posture is part of the buying decision but public competitor evidence is uneven.
    diligencePath: >-
      Collect each top competitor's trust-center, SOC, DPA, and security-overview pages plus security questionnaire
      snippets where available.
    relatedQuestionRefs:
      - QP010
  - type: conflicting-data
    severity: minor
    topic: scale-definitions
    missingEvidence: A normalized definition of users, enterprises, and paying customers across Scribe and peers.
    whyItMatters: Public numbers often mix free usage, logo counts, and paid accounts, which can overstate competitive position.
    diligencePath: >-
      Request exact definitions and reporting dates for users, teams, customers, and paying enterprises in the diligence
      room.
    relatedQuestionRefs:
      - QP012
      - QP013
      - QP014
  - type: private-evidence-only
    severity: blocking
    topic: runway
    missingEvidence: Current cash balance, monthly burn, and runway by base and downside case.
    whyItMatters: Capital adequacy cannot be underwritten from funding headlines alone.
    diligencePath: Request the latest board package with cash, burn, hiring plan, and downside scenario runway.
    relatedQuestionRefs:
      - QI019
      - QI020
  - type: private-evidence-only
    severity: blocking
    topic: retention
    missingEvidence: Logo retention, gross retention, and net revenue retention by cohort and segment.
    whyItMatters: >-
      Without retention, it is impossible to tell whether Scribe is a durable compounder or a high-churn PLG business
      with enterprise outliers.
    diligencePath: Request cohort retention tables and NRR by self-serve, team, and enterprise segment.
    relatedQuestionRefs:
      - QI017
  - type: private-evidence-only
    severity: material
    topic: margin
    missingEvidence: Gross margin and support / infrastructure cost breakdown by product line.
    whyItMatters: The underwriting case changes materially if enterprise compliance and service layers dilute software-like margins.
    diligencePath: Request revenue less COGS split by self-serve, enterprise, and Optimize products.
    relatedQuestionRefs:
      - QI016
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A reconciled employee-count definition and date.
    whyItMatters: >-
      Revenue-per-employee and burn estimates change materially depending on whether headcount is about 120 or above
      200.
    diligencePath: Request month-end employee counts for the last twelve months and clarify whether contractors are included.
    relatedQuestionRefs:
      - QI014
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback, channel mix, and sales-cycle data by segment.
    whyItMatters: PLG distribution can still mask expensive enterprise conversion if sales assist or support intensity is high.
    diligencePath: Request marketing spend, sales headcount productivity, CAC, and payback split by self-serve and enterprise.
    relatedQuestionRefs:
      - QI009
      - QI016
  - type: missing-source
    severity: minor
    topic: obligations
    missingEvidence: Debt schedules, lease obligations, and any contingent liabilities are not visible publicly.
    whyItMatters: Public absence of debt is not proof that balance-sheet obligations are immaterial.
    diligencePath: Request debt, lease, and off-balance-sheet obligation schedules from the finance data room.
    relatedQuestionRefs:
      - QI018
  - type: private-evidence-only
    severity: material
    topic: enterprise-performance-metrics
    missingEvidence: >-
      Public SLA metrics, API throughput limits, and independent quality audits for desktop capture, Sidekick relevance,
      and Optimize recommendations.
    whyItMatters: >-
      Without performance and quality data, investors can validate positioning but not operating reliability at
      enterprise scale.
    diligencePath: >-
      Request customer-facing SLA language, product telemetry summaries, and internal QA / error-rate dashboards for
      desktop capture, guide execution, and API usage.
    relatedQuestionRefs:
      - QE017
      - QE022
      - QE024
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof table
    missingEvidence: A complete current customer roster with deployment stage, contract scope, and named references by segment.
    whyItMatters: >-
      Public customer stories prove real usage but do not show whether the top public logos represent the bulk of
      revenue or only a curated sample.
    diligencePath: >-
      Request a top-customer list with ARR, renewal status, deployment stage, referenceability, and segment tags;
      reconcile against logo pages and case-study usage.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: retention and concentration metrics
    missingEvidence: Historical NRR, GRR, logo churn, contract duration, seat expansion, and top-10 customer concentration data.
    whyItMatters: >-
      Without retention and concentration data, the public customer story supports adoption but not durability or
      downside underwriting.
    diligencePath: >-
      Request cohort tables, renewal dashboards, customer concentration schedules, and sample order forms with
      cancellation terms.
    relatedQuestionRefs:
      - QU010
      - QU020
      - QU022
      - QU025
  - type: missing-source
    severity: material
    topic: regulator-history
    missingEvidence: >-
      Direct regulator or court records showing whether Scribe or Colony Labs has any privacy complaints, subpoenas, or
      enforcement matters outstanding.
    whyItMatters: The public legal stack is polished, but investor risk changes if there are hidden complaints or investigations.
    diligencePath: >-
      Request legal docket search results, outside counsel letter, and any regulator correspondence log for the last
      thirty-six months.
    relatedQuestionRefs:
      - QR005
      - QR029
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: incident-history
    missingEvidence: Incident postmortems, SLA credits, customer-severity history, and any breach notifications.
    whyItMatters: >-
      Public uptime scaffolding does not reveal whether reliability or security incidents are frequent enough to impair
      enterprise trust.
    diligencePath: >-
      Ask for the last twelve months of Sev-1/Sev-2 incidents, enterprise SLA terms, and any security-incident
      disclosure register.
    relatedQuestionRefs:
      - QR010
  - type: private-evidence-only
    severity: blocking
    topic: customer-concentration
    missingEvidence: Top-customer revenue concentration, renewal status, and concentration by industry or regulated segment.
    whyItMatters: >-
      Without concentration data, it is hard to know whether the apparent enterprise penetration is broad or dependent
      on a few flagship accounts.
    diligencePath: Request cohort revenue tables, top-20 account concentration, and renewal calendars segmented by plan and industry.
    relatedQuestionRefs:
      - QR024
    relatedTableRefs:
      - TR004
  - type: conflicting-data
    severity: material
    topic: operating-scale-data
    missingEvidence: >-
      A management-verified employee count, revenue bridge, and funding history that reconciles conflicting third-party
      databases.
    whyItMatters: Headcount, funding, and revenue disagreement lowers confidence in execution and valuation underwriting.
    diligencePath: Request current org chart totals, payroll headcount by function, and a financing history cap-table summary.
    relatedQuestionRefs:
      - QR019
      - QR020
      - QR021
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-overhang
    missingEvidence: >-
      Liquidation preferences, participation rights, ratchets, secondary terms, and any employee-liquidity overhang from
      the Series C.
    whyItMatters: Headline valuation can materially overstate what a new investor or acquirer is actually underwriting.
    diligencePath: Request the latest financing documents, cap table, and side letters from counsel and finance.
    relatedQuestionRefs:
      - QV020
    relatedTableRefs:
      - TV006
  - type: private-evidence-only
    severity: blocking
    topic: retention-and-economics
    missingEvidence: Net revenue retention, gross margin, customer concentration, CAC payback, and AI cost burden.
    whyItMatters: These inputs determine whether a premium private multiple is justified or merely narrative-driven.
    diligencePath: Ask for board-level KPI packs with cohort retention, margin by product, and cost-to-serve data.
    relatedQuestionRefs:
      - QV021
      - QV022
    relatedTableRefs:
      - TV006
  - type: conflicting-data
    severity: material
    topic: scale-estimates
    missingEvidence: >-
      Management-verified revenue, funding, and headcount figures that reconcile conflicting databases and analyst
      estimates.
    whyItMatters: >-
      Public valuation support is unusually sensitive to denominator accuracy because the current price already embeds a
      premium.
    diligencePath: Request audited financials or at minimum a management-certified ARR bridge and current headcount schedule.
    relatedQuestionRefs:
      - QV007
  - type: enumeration-incomplete
    severity: minor
    topic: comparable valuation table coverage
    missingEvidence: >-
      Direct private marks or M&A values for more workflow-documentation peers beyond the few public or announced
      transactions available.
    whyItMatters: >-
      The comparable set is useful for bounding valuation, but it is not exhaustive for every adjacent workflow or
      knowledge platform.
    diligencePath: Supplement with banker books, secondary-market indications, and investor references on private peer marks.
    relatedQuestionRefs:
      - QV011
      - QV012
    relatedTableRefs:
      - TV004
