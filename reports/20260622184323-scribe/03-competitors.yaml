- id: distribution-trust-and-switching-costs
  title: Distribution, trust, and switching costs
  body: Scribe's best public moat is less about the initial capture moment than about what happens after the guide exists. The company pushes integrations, enterprise search, and workflow-context language that aim to move Scribe from a one-off recorder into a layer that can sit inside knowledge bases, AI tools, and enterprise enablement flows. Its security page and enterprise packaging also show that Scribe wants to be evaluated as a trust-sensitive enterprise tool, not just a lightweight extension. That matters because switching costs in this category are rarely driven by one guide alone; they come from where guides are embedded, who governs them, and how much downstream process context accumulates around them. Still, DAP incumbents are stronger where change-management analytics and controlled in-app guidance dominate the purchase, while knowledge suites are stronger when the buyer wants a canonical repository. Scribe can hold ground where capture speed and downstream reuse both matter,
    but it has to avoid being trapped as a narrow authoring utility.
  claimRefs:
  - CP005
  - CP006
  - CP007
  - CP021
  - CP022
  - CP027
  - CP029
  - CP030
  - CP035
  - CP037
- id: moat-durability-and-risk-register
  title: Moat durability and risk register
  body: The durable question is whether Scribe has built enough beyond automated screenshots to defend a meaningful budget line. The evidence supports a yes-but. Yes, because Scribe clearly has a sharper product than a generic wiki, video recorder, or manually maintained SOP repository, and because its workflow-context story gives it a route into AI, search, and transformation budgets that direct peers do not articulate as clearly. But only with caveats. WalkMe and Whatfix remain more credible for governed enterprise-adoption programs, while Notion-, Guru-, Trainual-, and Process Street-style substitutes can absorb process knowledge into a broader system of work. Meanwhile, the core capture step is increasingly easy for competitors to imitate. The adverse SourceForge review is a reminder that product-quality or support issues could narrow Scribe's PLG advantage if they persist. On balance, Scribe looks differentiated enough to win capture-centric use cases and to expand into workflow context,
    but not insulated from displacement if larger suites or DAPs solve the adjacent jobs more completely.
  claimRefs:
