chapter:
  number: 3
  title: Competitors
  summary: Scribe competes most directly with Tango and Guidde for fast workflow capture, but its larger strategic challenge comes from enterprise digital-adoption incumbents and knowledge-suite substitutes that can pull budget away once buyers care more about governance, analytics, or repository depth than pure authoring speed.
sections:
- id: landscape-and-alternative-set
  title: Landscape and alternative set
  body: Scribe is not competing inside one clean category. The nearest overlap comes from browser- and desktop-assisted workflow capture tools such as Tango and Guidde, which promise to turn a live workflow into a polished guide with much less manual screenshotting and writing. But the actual buyer job quickly broadens beyond capture. WalkMe and Whatfix attack the same problem from an enterprise digital-adoption angle, emphasizing governance, analytics, and guided execution across many business-critical applications. Trainual, Process Street, Notion, Guru, and Whale matter when a team wants a durable SOP or knowledge repository more than it wants instant recording. Loom and the broader async-video status quo remain viable for lightweight explanation. That means Scribe has to win not only against direct capture peers, but also against repositories, enablement suites, and transformation platforms that absorb the documentation job into a wider system of work.
  claimRefs:
  - CP009
  - CP010
  - CP013
  - CP016
  - CP017
  - CP018
  - CP019
  - CP020
  - CP024
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: product-and-pricing-comparison
  title: Product and pricing comparison
  body: 'Public product pages make the segmentation logic clear even when they do not reveal perfect economics. Scribe is the most legible self-serve offering in the retained evidence, with explicit free, Pro Personal, Pro Team, and Enterprise tiers plus a team-level packaging rule that forces upgrades to happen collectively. Tango is visibly close in form factor but less transparent after the free workspace tier, which makes it harder to prove a pure pricing advantage from public data. Guidde changes the conversation by leaning into video creation, voiceover, and richer presentation layers. The substitutes further widen the budget map: Trainual and Process Street lean into ownership, workflows, and compliance; Notion and Guru lead with knowledge retrieval; WalkMe and Whatfix point buyers toward analytics-heavy adoption programs. The result is that list pricing alone is not enough to explain who wins. The real decision often turns on whether the buyer wants speed, multimedia polish, governed
    rollout, or a long-lived source of truth.'
  claimRefs:
