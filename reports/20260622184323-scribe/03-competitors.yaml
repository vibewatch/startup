- id: TP001
  title: Competitor profile table
  columns:
  - competitor
  - category
  - scale / funding signal
  - target segment
  - differentiation
  - limitation
  rows:
  - - Scribe
    - Auto-capture workflow documentation
    - 5M+ users; 94% of Fortune 500 usage claims
    - Ops, enablement, support, transformation teams
    - Fast browser and desktop capture plus enterprise workflow context
    - Realized pricing, win rates, and retention are still private
  - - Tango
    - Direct capture peer
    - $19.7M total funding; 100k users; 25k teams
    - Internal enablement and process-adoption teams
    - In-context nuggets and automation framing
    - Paid pricing is less transparent and enterprise controls are less visible
  - - Guidde
    - Video-first documentation peer
    - $50M Series B; 4,500+ customers
    - Customer education, external enablement, training teams
    - AI video, voiceover, and multimedia output
    - Less obviously optimized for searchable text-first SOP governance
  - - WalkMe
    - Enterprise digital-adoption incumbent
    - Strategic enough for SAP acquisition
    - Large enterprises with IT-led transformation programs
    - Usage analytics, adoption measurement, and governed walkthroughs
    - Heavier deployment and broader scope than a quick-capture tool
  - - Whatfix
    - Enterprise digital-adoption incumbent
    - $125M Series E
    - Global enterprise software rollouts
    - Governance-heavy DAP with reporting and environment controls
    - Likely sold through longer and more expensive enterprise motions
  - - Trainual
    - Training and knowledge-suite substitute
    - Focused on 25-1000 employee businesses
    - SMBs formalizing SOPs and onboarding
    - Ownership, templates, quizzes, and repository depth
    - Not centered on passive capture while work happens
  - - Process Street
    - Workflow and compliance substitute
    - 1M+ users claim on homepage
    - Operations, audit, and compliance teams
    - Workflow automation and audit-ready proof
    - Less optimized for instant capture from a single operator workflow
  - - Whale / Notion / Guru
    - Knowledge-base substitutes
    - Knowledge-platform rather than capture-native positioning
    - Teams prioritizing one searchable source of truth
    - Centralized retrieval and ongoing governance
    - Capture can become a manual authoring step instead of an automatic one
  notes: Rows compare the most plausible public alternatives by buyer job, not only same-form-factor products; funding and user numbers are publisher claims unless otherwise noted.
