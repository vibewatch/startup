- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Digital-adoption failure after software rollouts
    - driver
    - current
    - Poor workflow adoption makes documentation and contextual guidance economically legible.
    - Which product motions win when a rollout already has high ticket volume or low completion?
  - - Pressure to show ROI from enterprise transformation and AI
    - driver
    - current
    - Buyers increasingly want workflow visibility, time-to-value, and measurable productivity gains.
    - How often does Scribe sell through transformation or AI budgets versus documentation budgets?
  - - Need for governed knowledge in regulated environments
    - driver
    - near-term
    - Compliance, auditability, and redaction features expand the value of the enterprise tier.
    - Which regulated verticals convert best and what features drive close rates?
  - - Free and low-cost substitutes
    - constraint
    - current
    - Wikis, docs, video tools, and freemium competitors make experimentation cheap and pricing power harder.
    - What retention or expansion metrics prove Scribe wins beyond the free layer?
  - - Diffuse budget ownership
    - constraint
    - current
    - IT, ops, enablement, compliance, and support can all claim parts of the problem, slowing procurement.
    - Who is the repeatable economic buyer by segment?
  - - Category mismatch across market reports
    - constraint
    - current
    - Public TAM arguments are fragile because market categories blur documentation, DAP, workflow software, and automation.
    - Can management disclose segment revenue that grounds a cleaner SAM?
  - - AI-context expansion
    - driver
    - medium-term
    - If Scribe becomes a workflow data layer for AI tools, it can access larger budgets than SOP software alone.
    - What measurable attach or monetization does Optimize generate today?
  - - Support-quality and product-gap complaints
    - constraint
    - current
    - Adverse reviews show product and service execution still matter even with strong ROI messaging.
    - How does the company measure and improve support responsiveness and enterprise onboarding?
  notes: 'The same macro forces that create budget also raise the standard for proof: Scribe must convert grassroots utility into measurable enterprise outcomes.'
