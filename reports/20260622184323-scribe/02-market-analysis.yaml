    - Captures substitute products like Guidde and Loom but should not be treated as full Scribe TAM
  - - Enterprise AI context / workflow intelligence
    - Workflow data used to analyze, improve, or train AI against real work patterns
    - General-purpose AI assistant spend without workflow capture or context
    - Transformation, ops, or enterprise AI budgets
    - Represents Scribe's expansion thesis rather than its entire monetized category today
