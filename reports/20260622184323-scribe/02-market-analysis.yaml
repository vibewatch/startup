- id: sizing-lenses-and-sam-limits
  title: Sizing lenses and the limits of public SAM logic
  body: 'The cleanest bottom-up public lens for Scribe is process documentation software. Business Research Insights sizes that market at $2.34 billion in 2026 and $6.28 billion by 2035, with an 11.3% CAGR. That is not a perfect fit, but it is the narrowest directly relevant analyst category among the reviewed sources because it explicitly centers on documenting, managing, and optimizing processes.


    Two broader categories show the upside if Scribe successfully expands from documentation into workflow infrastructure. Global Growth Insights sizes workflow software at $9.53 billion in 2026, while The Business Research Company sizes business workflow automation at $14.96 billion in 2026 and $25.5 billion by 2030. Those bigger pools matter because Scribe is increasingly pitching AI context, workflow observability, and process improvement rather than just beautiful how-to guides.


    The catch is that none of these categories isolate a clean Scribe-specific SAM or SOM. The reviewed reports mix documentation, collaboration, workflow orchestration, approvals, compliance, and broader automation. Public market lenses therefore bracket the opportunity, but they do not justify a single clean TAM slide. The safest diligence conclusion is that Scribe has a real multi-billion-dollar wedge with credible adjacency into larger budgets, while any precise SAM still requires management segmentation that the public record does not provide.'
