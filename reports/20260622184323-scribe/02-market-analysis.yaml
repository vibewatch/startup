  - - Digital adoption / in-app guidance
    - Contextual guidance, software adoption, self-help, role-based workflow support, analytics
    - General software training that is detached from real workflows
    - IT/app owners, L&D, support, compliance
    - Matches Scribe's onboarding, enablement, and point-of-need help use cases
  - - Workflow software / workflow automation
    - Approvals, workflow orchestration, process visibility, automation, and cross-app task management
    - Consulting-only process redesign or unrelated line-of-business apps
    - Operations, shared-services, enterprise software, or transformation budgets
