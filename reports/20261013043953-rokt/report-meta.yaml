companyProfile:
  summary: >-
    Rokt is a late-stage private commerce-media platform that monetizes checkout, cart, payment, and post-purchase
    transaction moments for merchants and advertisers. The business combines a large enterprise partner network with
    AI-driven decisioning, a closed first-party data model, and adjacent products such as Rokt Ads, Rokt Ecommerce, Rokt
    mParticle, Canal, and Aftersell. Public evidence supports strong scale and continued growth, but the company still
    withholds audited financials, detailed retention cohorts, and cap-table specifics that would support a higher
    conviction underwriting call.
  foundedDate: '2012-01-01'
  founders:
