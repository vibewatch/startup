callouts:
  - calloutType: "recommendation"
    title: "Underwriting Stance: Track Pending IPO-Ready Audit Disclosures"
    body: "Public evidence confirms Rokt's strong topline momentum, reaching US$600 million in 2024 revenue with over 40% annual growth, and its validated transaction-moment scale across enterprise commerce leaders. However, private-market opacity around true gross margin contribution, take-rate sustainability, and preference overhang necessitates a disciplined Track stance rather than an unhedged Buy at the US$3.5 billion mark."
    claimRefs:
      - "CV001"
      - "CV003"
      - "CV012"
      - "CV013"
  - calloutType: "risk"
    title: "Secondary Valuation Disconnect and Governance Overhang"
    body: "While select secondary sales in January 2025 cleared at a US$3.5 billion valuation, public secondary platforms such as Forge Global indicate constrained liquidity with no actively matched trades above the 2021 Series E price. Compounded by workplace gender pay gap reporting, executive turnover, and ongoing employment arbitration, governance risks remain elevated heading into a targeted 2026 listing."
    claimRefs:
      - "CV002"
      - "CV008"
      - "CV009"
      - "CV010"
