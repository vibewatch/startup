  name: "Rokt"
chapter:
  number: 8
  title: "Valuation"
  summary: "Rokt warrants a Track underwriting recommendation with a High risk rating and Fair valuation stance at its US$3.5 billion secondary valuation. While robust commercial traction and US$600 million in reported 2024 revenue substantiate substantial scale, significant private-company financial opacity and ongoing arbitration risks prevent an outright Buy call ahead of a targeted 2026 Nasdaq IPO."
sections:
  - id: "investment-thesis-and-conviction"
    title: "Investment Thesis and Underwriting Conviction"
    body: "Rokt presents an attractive commercial profile grounded in its specialized command of the post-purchase transaction moment. By positioning its machine learning recommendation engine directly on the confirmation and checkout pages of tier-one enterprise partners including Uber, Lyft, and AMC Theatres, Rokt captures high-intent consumer attention after core purchase commitments are finalized. Reported 2024 revenue expanded by more than 40% year over year to US$600 million, demonstrating strong momentum and validation across major digital commerce ecosystems. However, because Rokt operates as a private company without audited GAAP disclosures, top-line figures must be interpreted with caution. The core marketplace model distributes approximately 50% of gross ad revenue back to enterprise inventory hosts, leaving an estimated 7% net gross margin on gross merchandise flow after technology and sales delivery expenses. Balancing this verified operating scale against take-rate dependencies and disclosure constraints leads to an underwriter recommendation of Track, paired with a High risk classification and a Fair valuation stance at secondary transaction marks."
    claimRefs:
      - "CV001"
      - "CV003"
      - "CV012"
      - "CV013"
    tableRefs:
      - "TV001"
  - id: "valuation-context-and-pricing-support"
    title: "Current Valuation Context and Secondary Pricing Support"
    body: "Rokt's capital structure and pricing marks have evolved through several structured primary rounds and liquidity tenders. In December 2021, the company closed a US$325 million Series E primary round led by Tiger Global at a post-money valuation of US$1.95 billion. Subsequently, in late 2022, an initial US$750 million secondary transaction re-priced the business at US$2.4 billion. In January 2025, Rokt completed a structured US$335 million secondary tender offer valuing the enterprise at US$3.5 billion, with participation from Square Peg Capital, Tiger Global, Barrenjoey, and SecondQuarter. Approximately US$122 million of this transaction provided liquidity to early employees and seed backers, while long-tenured venture funds rebalanced mature vehicle allocations. At US$3.5 billion, Rokt trades at an implied multiple of 5.8x reported 2024 revenues. While unconfirmed market rumors have cited indicative term sheets at higher figures, broader secondary market tracking on platforms such as Forge Global demonstrates thin liquidity and limited matched transaction depth above the historical primary mark. Given general multiple compression across late-stage software assets, public evidence supports the US$3.5 billion valuation as fair but fully priced."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV006"
      - "CV008"
      - "CV012"
    tableRefs:
      - "TV002"
  - id: "scenario-analysis-and-returns"
    title: "Scenario Analysis, Multiple Ranges, and Downside Triggers"
    body: "Evaluating forward equity returns requires disaggregating enterprise multiple expectations across retail media networks and ad-tech platforms. Company leadership has targeted crossing a US$1 billion annualized revenue run-rate during late 2025, supported by the integration of its US$300 million mParticle customer data platform acquisition. In our base case, assuming Rokt achieves US$800 million in fiscal 2025 revenue with normalized EBITDA margins of 12% to 15%, a forward enterprise multiple of 4.5x to 5.5x yields an equity valuation range between US$3.6 billion and US$4.4 billion, delivering modest upside against current secondary entry prices. A bull case requires organic revenue acceleration beyond US$950 million with EBITDA margins expanding toward 20%, supporting a multiple re-rating to 7.0x to 8.0x revenue and an equity value of US$6.5 billion to US$7.5 billion. Conversely, our bear case models deceleration toward 15% to 20% annual growth, compressed net margins below 8% under partner contract renegotiation, and broader ad-tech peer multiple compression, yielding a downside valuation range of US$1.8 billion to US$2.1 billion."
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV011"
      - "CV012"
    tableRefs:
      - "TV003"
  - id: "recommendation-decision-logic"
    title: "Decision Logic and Recommendation Framework"
    body: "The synthesis connecting operational scale to our final investment stance follows a clear analytical chain. Commercial adoption is well documented, with over 7.5 billion network transactions powered in 2025 and 3,000 active retail partners verifying product utility. Strategic expansion via the acquisitions of mParticle and Canal has deepened first-party data capture within checkout flows. However, this business momentum is counterbalanced by structural risks. Private reporting conceals vital balance-sheet fundamentals, gross profit retention, customer concentration, and advertiser retention cohorts. Additionally, governance and cultural friction—including ongoing employment arbitration and Australian Workplace Gender Equality Agency disclosures—introduce reputational and execution overhangs. Because current secondary pricing of US$3.5 billion leaves little margin of safety if partner take-rates compress or market multiples contract, institutional allocators should maintain a Track discipline until comprehensive S-1 registration statements are filed ahead of the targeted 2026 Nasdaq listing."
    claimRefs:
      - "CV001"
      - "CV003"
      - "CV007"
      - "CV010"
      - "CV013"
      - "CV014"
    figureRefs:
      - "FV001"
  - id: "exit-readiness-and-diligence-asks"
    title: "Exit Readiness, Governance, and Final Diligence Asks"
    body: "Rokt has taken concrete operational steps to prepare for a public market debut, establishing seasoned governance by appointing prominent non-executive directors including Anita Sands and Datadog Chief Financial Officer David Obstler to chair its audit committee. An initial public offering on the Nasdaq exchange remains targeted for 2026, serving as the essential liquidity vehicle for employee option pools that have received roughly 27% of lifetime equity allocations. Before capital can be committed with high conviction, critical diligence hurdles must be cleared. Key requirements include reviewing audited multi-year GAAP income statements to verify net revenue accounting, auditing partner take-rate contracts to ensure long-term exclusivity, inspecting cap-table liquidation preference seniority across Series A through E shares, and assessing the resolution of ongoing former-employee arbitration claims. Thesis-break triggers that would compel an immediate Avoid downgrade include any down-round secondary pricing below US$2.5 billion, adverse litigation rulings, or the loss of cornerstone enterprise checkout inventory."
    claimRefs:
      - "CV007"
      - "CV009"
      - "CV010"
      - "CV014"
