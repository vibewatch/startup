schemaVersion: report-v2
artifact: customers
slug: rokt
runDate: 2026-10-13
company:
  name: Rokt
chapter:
  number: 6
  title: Customers
  summary: >-
    Rokt shows broad enterprise adoption through billions of annual transactions, thousands
    of ecommerce partners, and named checkout relationships, but most scale and outcome
    metrics remain company-issued. Public evidence is materially weaker on current retention,
    contract durability, customer concentration, and customer-specific realized outcomes.
sections:
  - id: customer-base-and-buyers
    title: Customer base and buying centers
    body: >-
      Rokt serves a two-sided transaction network rather than a single homogeneous customer
      cohort. Ecommerce businesses and commerce platforms provide checkout or post-purchase
      inventory and buy monetization, optimization, retention, or distributed-commerce
      capabilities; advertisers and product providers buy access to shoppers with confirmed
      purchase intent. The company also markets a catalogue of more than 1.2 million
      third-party products from over 4,600 brands, widening the provider side beyond
      conventional advertisers. Named testimonials on Rokt's own solutions page identify
      partnership, digital-strategy, customer-experience, and advertising executives as
      stakeholders, which suggests procurement spans commercial, media, ecommerce, and
      product teams. This breadth creates multiple expansion surfaces, but the retained
      sources do not disclose revenue by segment, who signs or pays under each product,
      or whether any one platform contributes a disproportionate share of volume or gross
      profit. The segmentation is therefore operational rather than a verified revenue mix.
    claimRefs: [CU001, CU002, CU007, CU008, CU011]
    tableRefs: [TU001]
  - id: adoption-and-reference-quality
    title: Adoption trajectory and named customer proof
    body: >-
      The clearest adoption signal is transaction throughput: Rokt said its network powered
      more than 7.5 billion transactions in 2025 across thousands of ecommerce businesses
      and forecast more than 10 billion for 2026. Sacra separately estimates roughly 3,000
      ecommerce partners, but that figure is not a company filing and its active, paying,
      and integrated denominators are not defined. Reference quality varies. The Silicon
      Review reported that Fanatics returned to the network after trying alternatives and
      that Cineplex integrated Rokt into checkout, while Rokt publishes attributed
      testimonials from PayPal Ads, Cinemark, Petco, and Mindbody. These examples are more
      probative than an undifferentiated logo wall, yet most lack deployment dates,
      controlled outcome data, contract terms, or a clear pilot-versus-production label.
      The advertised uplifts of up to 25% for in-cart revenue and up to 30% for
      post-purchase revenue are company claims, not customer-specific independently
      verified outcomes, so they should not be used as portfolio-wide realized returns.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU008, CU009, CU010, CU011]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-risk
    title: Durability, expansion, and concentration risk
    body: >-
      Public evidence supports an expansion mechanism but not a current retention rate.
      Sacra describes a land-and-expand model that begins with checkout optimization and
      broadens into advertising, loyalty, customer-data infrastructure, and distributed
      commerce. GetLatka's account of a 2021 management interview reported that roughly
      half of underlying growth came from existing-client expansion and that ecommerce
      supply-side churn was net negative, but the observation is historical and cannot
      substitute for current NRR, GRR, logo churn, or cohort data. Merchant durability also
      depends on preserving core conversion and customer trust. Sacra warns that tighter
      privacy regulation or negative consumer sentiment could reduce merchants' willingness
      to integrate Rokt, and Enterprise Times says future use cases are still needed to
      demonstrate effectiveness. The retained public record does not reveal contract
      length, renewal schedules, switching costs, top-customer revenue, top-platform volume,
      or advertiser repeat spend. Those omissions prevent a confident conclusion about
      concentration or recurring durability despite credible scale and named adoption.
    claimRefs: [CU012, CU013, CU014, CU015, CU016]
    figureRefs: [FU001]
tables:
  - id: TU001
    title: Customer segmentation by role and value proposition
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Public scale signal
      - Revenue or strategic value
      - Diligence gap
    rows:
      - - Ecommerce merchants
        - Ecommerce, digital, and customer-experience leaders; commercial payer not disclosed
        - Monetize, optimize, and retain at checkout or post-purchase
        - Thousands of businesses claimed across the network
        - Incremental transaction revenue and customer engagement
        - Active paying count, revenue mix, contracts, and concentration unavailable
      - - Advertisers and brands
        - Growth and performance-media teams; advertiser pays for outcomes
        - Acquire high-intent customers through native transaction placements
        - Named brands and hundreds of millions of customers claimed, denominator undefined
        - Performance acquisition within merchant transaction flows
        - Repeat spend, advertiser retention, pricing, and return on ad spend unavailable
      - - Commerce and payment platforms
        - Ads, partnerships, digital-product, and app-ecosystem teams
        - Add relevant offers or messages after booking, payment, or purchase
        - PayPal and other large platforms named publicly
        - New monetization inventory and partner engagement
        - Relationship scope, exclusivity, take rate, and volume share unavailable
      - - Product and offer providers
        - Brand, merchandising, and channel teams; payer mechanics not disclosed
        - Place third-party products and offers inside the transaction
        - More than 1.2 million products from over 4,600 brands claimed
        - Distributed-commerce assortment without merchant-owned inventory
        - Active catalogue share, sell-through, returns, and provider concentration unavailable
    notes: >-
      Segments are synthesized from Rokt's official product surfaces and independent analyst
      descriptions; scale figures are company claims or third-party estimates, not audited
      customer counts or revenue segmentation.
    claimRefs: [CU001, CU002, CU007, CU008, CU011]
  - id: TU002
    title: Customer adoption and outcome signals
    columns:
      - Metric or event
      - Value
      - Period
      - Evidence character
      - Confidence
      - Implication and missing denominator
    rows:
      - - Network transactions
        - More than 7.5 billion
        - "2025"
        - Company-issued release, repeated by Enterprise Times
        - Medium
        - Large usage surface; transaction definition and unique shopper or merchant counts absent
      - - Forecast network transactions
        - More than 10 billion
        - "2026"
        - Company forecast in syndicated release
        - Low
        - Suggests continued growth ambition; actual full-year result is not yet available
      - - Ecommerce partner network
        - Approximately 3,000
        - "2025"
        - Sacra estimate
        - Medium
        - Broad supply network; active, paying, and production-integrated denominator absent
      - - In-cart upsell revenue uplift
        - Up to 25%
        - Current website claim
        - Company marketing claim
        - Low
        - Potential merchant value; baseline, sample, methodology, and realized customer distribution absent
      - - Post-purchase upsell revenue uplift
        - Up to 30%
        - Current website claim
        - Company marketing claim
        - Low
        - Potential expansion value; baseline, sample, methodology, and realized customer distribution absent
      - - Fanatics network relationship
        - Returned after exploring alternatives
        - December 2025
        - Independent publication reporting a renewed relationship
        - Medium
        - Supports product durability for one large account; contract economics and duration absent
    notes: >-
      Values preserve the source period and metric wording. Forecasts, estimates, and
      maximum-uplift claims are not treated as audited actuals; null denominators are stated
      rather than inferred.
    claimRefs: [CU003, CU004, CU005, CU006, CU009, CU011]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment or use case
      - Production vs. pilot
      - Public outcome
      - Limitation
    rows:
      - - Fanatics
        - Sports ecommerce
        - Rokt Network checkout relationship
        - Renewal / return reported; production scope not quantified
        - Returned after exploring alternatives
        - No customer-authored announcement, contract term, or measured outcome in retained evidence
      - - Cineplex
        - Entertainment
        - Relevant non-endemic offers in ecommerce checkout
        - Integration reported in January 2026
        - Designed to create incremental value during transaction
        - No realized uplift, deployment coverage, or renewal evidence
      - - PayPal
        - Payments and commerce platform
        - Post-purchase engagements and advertiser offers
        - Active use implied by named executive testimonial
        - Testimonial says engagements add value for consumers and advertisers
        - No deployment date, volume, contract, or controlled performance result
      - - Cinemark
        - Entertainment
        - Relevant messages based on customer habits and interests
        - Active partnership implied by named executive testimonial
        - Testimonial describes meaningful audience engagement
        - No quantified outcome, duration, or independent customer publication
      - - Petco
        - Retail
        - Relevant offers and resources for online customers
        - Active use implied by named executive testimonial
        - Testimonial describes enhanced customer experience
        - No quantified outcome, deployment coverage, or renewal evidence
    notes: >-
      This is a representative sample of named public references in the assigned evidence,
      not a complete customer roster. Production status is reported only where the source
      describes an integration, return, or active use; testimonials hosted by Rokt remain
      company-controlled evidence.
    enumerationScope:
      coverage: sample
      basis: >-
        Named customer relationships and testimonials visible in the assigned prefetched
        sources through the 2026-10-13 access date.
    claimRefs: [CU008, CU009, CU010]
figures:
  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      Rokt's public customer journey runs from merchant integration to transaction activation
      and multi-product expansion, with retention and concentration proof remaining private.
    data:
      nodes:
        - id: integration
          label: Integrate merchant or platform
          detail: Embed Rokt into checkout or post-purchase inventory.
          touchpoints:
            - Ecommerce and digital teams
            - Platform partnership teams
        - id: governance
          label: Configure inventory controls
          detail: Set offer, competitor, and brand-alignment rules.
          touchpoints:
            - Merchant controls
            - Quality thresholds
        - id: activation
          label: Activate transaction traffic
          detail: Apply first-party and contextual signals at purchase intent.
          touchpoints:
            - Checkout
            - Confirmation
        - id: outcome
          label: Optimize transaction outcome
          detail: Select an offer, product, message, or no placement.
          touchpoints:
            - Monetization
            - Acquisition
        - id: expansion
          label: Expand product footprint
          detail: Add loyalty, data, advertising, or distributed-commerce capabilities.
          touchpoints:
            - Additional modules
            - More transaction surfaces
        - id: renewal
          label: Prove durability
          detail: Renewal and concentration remain the least visible stages publicly.
          touchpoints:
            - Retention metrics
            - Contract and cohort evidence
    approximationNotes: >-
      The sequence is an analytical synthesis of documented product surfaces and
      land-and-expand descriptions; it is not a disclosed contractual implementation plan.
    claimRefs: [CU001, CU012, CU013, CU014, CU015, CU016]
callouts:
  - calloutType: strength
    title: Enterprise use is visible, even if economics are not
    body: >-
      Billions of transactions, thousands of partners, and named integrations provide
      credible adoption signals beyond a logo list, but do not establish retention or
      customer-level profitability.
    claimRefs: [CU005, CU006, CU008, CU009, CU010, CU011]
  - calloutType: risk
    title: Durability remains an underwriting gap
    body: >-
      Current NRR, GRR, logo churn, contract length, cohort expansion, and top-customer or
      top-platform concentration are not disclosed in the retained public evidence.
    claimRefs: [CU013, CU014, CU015, CU016]
