chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、平台架构与变现引擎
        blocks:
          - type: paragraph
            body: >-
              Rokt 由 Justin Viles 和 Bruce Buchanan 于 2012 年创立。Buchanan 在 Jetstar Airways
              任职期间观察到，客户交易时刻是尚未充分利用的高意向流量入口，由此萌生了公司的方向 [CO001]。公司法律实体为 ROKT Pte.
              Ltd.，全球总部位于纽约；它提供电商技术平台，利用机器学习在购物车、支付和购后确认环节编排个性化优惠 [CO002, CO014]。不同于打断漏斗上游浏览行为的传统数字广告平台，Rokt
              运营着一个封闭式双边市场：商户合作方通过相关的第三方优惠或原生产品交叉销售，让最终结账页面产生收入 [CO014]。核心引擎名为 Rokt AI
              Brain，在毫秒级延迟预算内实时决策，优化每笔交易收入，同时守住商户的核心转化率 [CO014]。
            claimRefs:
              - CO001
              - CO002
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO005
              - CO006
              - CO008
              - CO010
              - CO011
      - number: '1.2'
        title: 管理层、AI 专长与董事会治理
        blocks:
          - type: paragraph
            body: >-
              Rokt 的管理层仍由联合创始人兼 CEO Bruce Buchanan 主导；他的航空商业背景塑造了公司对交易后变现的关注 [CO001, CO003]。核心技术差异化由首席 AI 官 Claire
              Southey 负责，她管理决定优惠相关性和数据隐私的机器学习模型与推理系统 [CO003]。为筹备计划中的上市并强化公司治理，Rokt 于 2025 年末扩大董事会顾问结构，任命 Datadog CFO
              David Obstler 担任审计委员会主席，并聘任前 Wise CFO Matt Briers 为董事会顾问 [CO004]。这些任命带来了面向公开市场的财务报告监督和审计控制，降低关键人物运营风险，并在未来
              IPO 前建立正式的委员会流程 [CO004]。
            claimRefs:
              - CO001
              - CO003
              - CO004
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO003
              - CO006
      - number: '1.3'
        title: 资本化历程、老股估值与机构支持
        blocks:
          - type: paragraph
            body: >-
              Rokt 在多轮融资中筹得超过 $480 million 一级股权资本，其中包括 2021 年 12 月完成的 $325 million E 轮融资 [CO005]。2025 年 1 月，公司完成一笔 $335
              million 的老股流动性交易，将 Rokt 估值定为 $3.5 billion；Tiger Global Management 与长期早期投资方 Square Peg Capital 共同领投
              [CO006]。股东包括一线风险投资机构、后期成长型 crossover 基金和耐心的机构养老金资本，如 Whale Rock Capital、TDM Growth Partners 及 Hostplus
              [CO007]。这种多层次的所有权结构让员工和早期股东获得了充分流动性，又避免发行稀释性一级股权，同时吸引了公开市场 crossover 投资者的机构支持 [CO006, CO007]。
            claimRefs:
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
      - number: '1.4'
        title: 运营规模、战略收购与结构性逆风
        blocks:
          - type: paragraph
            body: >-
              Rokt 的运营网络在 2025 年处理超过 7.5 billion 笔交易，达到巨大的商业规模；公司披露的 2024 年收入为 $600 million，预计 2025 年年化收入规模为 $800
              million 至 $900 million [CO008, CO009, CO010]。全球业务覆盖 17 个国际市场，在 8 个公司办公室拥有超过 700 名员工，工程中心位于纽约、悉尼和西雅图
              [CO011]。不过，历史运营披露也揭示了明显的结构性风险：在其核心广告产品中，扣除合作方分成和运营成本后，每美元广告总支出，公司仅保留约 7 美分毛利 [CO012]。此外，2020
              年疫情期间，娱乐和旅游行业的垂直集中导致收入下滑 65%，说明公司对行业交易量冲击高度敏感 [CO013]。
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO010
              - CO013
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 封闭网络在大规模交易中的变现
            body: Rokt 直接将 SDK 集成到超过 3,000 个企业结账流程中，无需依赖第三方跟踪 Cookie 即可激活第一方数据，每年支持超过 7.5 billion 笔交易 [CO010, CO014]。
            calloutType: strength
            claimRefs:
              - CO010
              - CO014
          - type: callout
            title: 广告支出的毛利留存较低
            body: 合作商户拿走每美元广告支出中的 50 美分，技术交付再吸收 43 美分，因此 Rokt 仅保留 7 美分毛利；单位经济性高度依赖总交易量持续扩张 [CO012]。
            calloutType: risk
            claimRefs:
              - CO012
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、支出分类与替代方案
        blocks:
          - type: paragraph
            body: >-
              交易时刻商业媒体市场在数字广告和电商软件中形成了清晰的结构边界。不同于 Google、Meta
              等通过搜索、社交信息流和漏斗上游展示竞价，将购买前用户意向变现的传统数字广告平台，交易时刻平台只在高意向结账及订单确认阶段运营。纳入的支出包括封闭网络效果营销、商户附加收入展示位、支付方式激励，以及直接嵌入确认流程的分布式商业增值服务；不纳入的支出包括站外再营销横幅、漏斗上游程序化展示广告和核心支付收单费用。内部工程开发及静态确认页优惠券是主要的现状替代方案，但企业商户越来越偏好机器学习决策，在不增加结账摩擦的情况下动态排序优惠。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
      - number: '2.2'
        title: 市场规模视角：TAM、SAM 与 SOM 的约束
        blocks:
          - type: paragraph
            body: >-
              评估交易时刻商业媒体的市场规模，不能只给出一个宽泛估计，而要从多个受约束的分析视角切入。宏观经济天花板是全球电商年商品交易总额超过 6 万亿美元，由此形成巨大的交易基数。Sacra 的分析师基准估计，Rokt 到
              2025 年 10 月的年化收入约为 $900 million，企业网络覆盖 3,000 个合作伙伴；公司披露则显示，2025 年网络处理量达到 7.5 billion 笔，预计 2026 年将超过 10
              billion 笔。Latka 的历史披露显示，公司 2021 年已有可扩展的 $200 million 底层收入和 $90 million
              毛利。将宽泛的商业媒体支出收窄到购后交易时刻后，现实可服务的可获取市场约为 $15 billion 至 $25 billion，受商户分成率和非行业广告主需求制约。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM009
              - CM010
      - number: '2.3'
        title: 买方分层、工作流集成与预算归属
        blocks:
          - type: paragraph
            body: >-
              交易时刻市场由企业电商商户和非行业效果广告主组成双边商业结构。供给侧包括企业零售商、票务市场平台和网约车运营商，它们部署 Rokt
              的软件开发套件，从确认页中获得纯增量利润；决策者包括寻求扩大利润率的首席商务官、电商副总裁和零售媒体网络负责人。需求侧则是客户获取团队和效果媒体买家，它们按每次推荐成本或每次获客成本分配增长预算，面向处于实际购物状态的高意向消费者。商业协议主要采取效果导向的收入分成：广告总支出约
              50% 支付给商户合作方，Rokt 在扣除数据、托管和运营开销后留存利润。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: 增长驱动、采用约束与尽调风险
        blocks:
          - type: paragraph
            body: >-
              交易时刻变现由行业结构性催化因素推动，同时受到运营约束牵制。第三方跟踪 Cookie
              逐渐被弃用，迫使效果广告主寻找经过认证的第一方客户环境，使封闭网络结账库存变得更有价值。企业零售商的零售产品利润率受到挤压，也会优先寻找能直接流入利润底线的附加收入。反过来，商户担心购物车放弃和品牌受损，限制了采用意愿。交易时刻是购买漏斗最后一个关键环节，不相关或打扰性过强的优惠会惹恼消费者。因此，商户要求严格治理、封闭网络数据隔离及算法质量阈值；无法确保相关性时，系统必须不展示第三方优惠。
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 交易时刻：尚未被争夺的流量位置
            body: 搜索和社交巨头主导购买前发现环节，而交易时刻属于购买后的流量位置；消费者的购买意向已得到验证，Rokt 因此无需直接参与 Google 和 Meta 的竞价，就能实现变现。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM008
          - type: callout
            title: 对摩擦的敏感性与购物车放弃风险
            body: 结账既是电商转化意向最高、也最脆弱的阶段。第三方优惠若分散购物者注意力，就会带来结构性的摩擦风险，因此商户必须设置严格的 AI 质量阈值，避免核心转化率下滑。
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
              - CM014
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与分类
        blocks:
          - type: paragraph
            body: >
              Rokt 所处的竞争格局覆盖结账优化技术、卡关联优惠网络、企业零售媒体平台及商户内部工程团队。历史上的结账解决方案主要追求支付速度，而不是广告变现。Bolt 和 Fast
              等平台通过一键结账消除购物车摩擦，并收取软件即服务费用或支付处理加价。相比之下，Cardlytics
              运营于数字银行应用内，利用金融机构交易记录提供返现优惠，而不是将优惠原生嵌入电商购买流程。除单点解决方案外，企业商业媒体网络让零售商建立私有广告流量位置，Moloco
              等机器学习广告技术平台则为效果营销提供竞价基础设施。Rokt 直接作用于高交易量商户的确认页和感谢页，把购后时刻视为由封闭网络第一方数据驱动的增量收入位置，从而形成了独特定位。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP009
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
      - number: '3.2'
        title: 能力对比与交易时刻差异化
        blocks:
          - type: paragraph
            body: >
              评估交易时刻技术，需要在商户增量收入和结账转化风险之间取得平衡。结账和订单确认是消费者旅程中意向最高的阶段，侵入式促销可能增加购物车放弃，或与商户品牌发生冲突。Rokt
              用机器学习相关性评分和合作方库存治理应对这一问题，并提供细粒度的开启与关闭控制，确保直接竞争对手不会出现在商户结账体验中。此外，Rokt
              在推荐竞价中设置保留质量阈值；候选优惠达不到严格的相关性标准时，系统会完全抑制展示，以保护用户体验。借助分布式商业能力，Rokt
              让客户可以在购物流程内直接把第三方产品加入购物车，而不必将购物者导向站外。独立技术评论指出，高度贴合场景的购后推荐能简化产品发现，并减少消费者在购买意向最强时的决策疲劳。
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP008
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP008
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP005
              - CP011
      - number: '3.3'
        title: 定价模式、商业包装与合作方权衡
        blocks:
          - type: paragraph
            body: >
              软件提供商与商户的商业协同方式，在交易生态中存在明显差异。传统结账平台按月收取固定 SaaS 订阅费，或按商品交易总额收取基点费用，商户需要把结账软件视为运营支出。相比之下，Rokt
              作为双边市场，采用效果导向的收入分成结构。市场分析显示，Rokt 从网络产生的每美元广告支出中约获取 50 美分，之后合作商户每笔交易获得估计 25 至 40
              美分的增量利润。对于活动停车或旅行保险等分布式商业增值服务，分成率约为百分之三，接近支付商户费用。这种效果导向模式免除了企业商户的前期软件支出，让双方围绕附加率提升保持一致，但也让商户收入暴露于宏观经济广告预算波动。
            claimRefs:
              - CP002
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP010
      - number: '3.4'
        title: 护城河持久性、平台侵入与替代风险
        blocks:
          - type: paragraph
            body: >
              Rokt 的竞争持久性依赖网络密度、企业集成惯性，以及由 4,600 个品牌的超过 1.2 million 个第三方产品构成的双边流动性。Ticketmaster、Uber 和 PayPal
              等高交易量商户建立了规模壁垒，抑制商户单独开发内部系统，因为后者缺乏跨商户广告主需求。不过，替代风险仍是尽调重点。Google 和 Meta
              等主要数字广告巨头掌握购买前发现渠道的竞价定价；若它们推出标准化的交易后 SDK 或浏览器级商业扩展，Rokt
              的分发优势可能被压缩。企业商户扩大自有零售媒体网络后，也可能优先推广第一方供应商优惠，而不是第三方网络广告。公开市场资本配置者还会遇到名称和筛选歧义：无关的 SPDR S&P Kensho Final
              Frontiers ETF 以 ROKT 为股票代码交易，这凸显出区分 Rokt 私有企业商业业务和公开基金工具的重要性。
            claimRefs:
              - CP008
              - CP011
              - CP012
              - CP013
              - CP014
