  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与定价架构
        blocks:
          - type: paragraph
            body: >-
              Rokt 围绕购后和结账交易时刻建立多层变现架构，服务超过 3,000
              家企业电商合作伙伴。公司的主要收入引擎是结账广告网络，在订单确认和购物车复核期间投放相关的第三方优惠及品牌信息。在这一核心广告业务中，广告主按每次推荐或完成互动付费，Rokt
              按效果收费。该模式将创造的大部分价值——名义上每 $8 交易总价值返还 $7——直接给到承载商户，以协调合作方激励。在核心网络之外，Rokt 通过收购 Canal
              等方式扩大分布式商业，让商户在结账流程内直接提供精选的第三方库存，并收取约 3% 的交换费式交易费用。通过收购 mParticle
              扩展的软件订阅和客户数据平台基础设施费用，提供了经常性软件收入层，但交易型广告仍是收入增长的主要来源。
