              4,600 个品牌的 1.2 million 多种第三方产品，将供应商侧扩展到传统广告主之外。Rokt
              自有解决方案页面上的具名推荐显示，合作、数字战略、客户体验和广告高管都是相关方，说明采购覆盖商务、媒体、电商和产品团队。这种广度创造了多个扩张入口，但现有来源没有披露分部门收入、各产品由谁签约或付款，或任何一个平台是否贡献了不成比例的交易量或毛利。因此，这种分层是运营视角，而非经验证的收入结构。
