        title: 产品组合与交易时刻架构
        blocks:
          - type: paragraph
            body: >-
              Rokt 围绕 Transaction Moment 组织产品，把它定义为客户从产品发现、购物车复核、支付处理到购后确认的完整旅程。公司将商业能力分成三条核心产品线：Rokt Ecommerce、Rokt Ads
              和 Rokt mParticle。Rokt Ecommerce 在商户购买流程中部署原生前端模块，包括用于发现非库存第三方产品的 Rokt Catalog、购物车内推荐的 Rokt Upcart、支付页激励的
              Rokt Pay+，以及购后确认优惠的 Rokt Thanks。通过 2024 年收购 Aftersell，Rokt 将购物车内和购后加售能力扩展到 Shopify
              上的中小企业和中型商户。不同于传统广告超链接把购物者导向站外，Rokt 的分布式商业架构支持流程内加购，让合作方交易保持连续的转化路径。
