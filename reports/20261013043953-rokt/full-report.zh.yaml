      - number: '5.3'
        title: 数据治理、网络隐私与合规基础设施
        blocks:
          - type: paragraph
            body: >-
              在企业电商结账时刻运营，需要强健的数据治理和监管合规控制。Rokt 将 Rokt Ads 定位为封闭式效果营销渠道，完全依靠第一方交易信号，而不是第三方跟踪 Cookie
              或开放广告交易所。公司实施严格的数据治理框架，并公开承诺：商户合作方数据不会在外部网络租户之间共享、出售或汇集。商户保留细粒度的库存治理控制，可指定品类排除、竞争对手黑名单及展示关闭。从安全和监管角度看，Rokt
              遵守 SOC 2 Type II、ISO 27001、GDPR 和 CCPA 标准，将企业可用性目标设为 99.9% 可用率，并通过自动化工具让消费者查看和撤回数据同意。
            claimRefs:
              - CE003
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: 技术依赖、延迟风险与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              尽管商业规模强劲，Rokt 的架构仍存在明确的技术依赖和尽调缺口。SDK 和 API 钩子直接运行于高意向结账路径中，任何网络延迟尖峰或客户端 JavaScript
              执行失败，都会给承载商户带来严重的购物车放弃风险。此外，公开开发者遥测、开源代码库和独立 API 延迟基准实际上都无法取得，反映出 Rokt 对专有闭源 SDK
              和企业集成的依赖。尽调投资人无法通过公开材料独立验证生产环境推理延迟分布、模型漂移频率或客户端页面加载开销。这些未经验证的性能特征，以及对 Shopify 结账 API
              等承载平台扩展框架的依赖，构成需要直接核验生产 SLA 和遥测数据的重大技术风险。
            claimRefs:
              - CE006
              - CE011
              - CE014
      - number: '5.5'
        title: 展示项
        blocks:
          - type: callout
            title: 零展示质量保留机制
            body: >-
              Rokt Brain
              的关键架构保护是严格的保留质量阈值：候选广告主或加售优惠无法达到较高的预测相关性或互动分数时，推理引擎会选择完全不渲染任何内容。这一设计优先保障商户核心结账完成，而不是追求短期广告展示变现，从而缓解购物车放弃。
            calloutType: insight
            claimRefs:
              - CE007
              - CE008
          - type: callout
            title: 客户端依赖与延迟逆风
            body: >-
              Rokt 组件直接运行在高意向结账和确认环节中，因此任何网络延迟尖峰或客户端脚本争用都会威胁商户转化率。尽管 Rokt 维持低延迟推理预算和 99.9%
              可用率，企业商户仍暴露于浏览器脚本拦截器和严格隐私沙盒约束带来的架构风险。
            calloutType: risk
            claimRefs:
