      - number: '5.2'
        title: 技术栈与 Rokt Brain 决策引擎
        blocks:
          - type: paragraph
            body: >-
              Rokt 平台的技术核心是 Rokt Brain：这是专有的机器学习和实时决策基础设施，旨在严格的延迟预算内为每位客户选出价值最高的单一动作。Rokt Brain 每年处理超过 7.5 billion
              笔交易，利用语义嵌入和长期行为建模——纳入购物车历史、放弃商品及浏览过的产品目录——估计个人客户的转化意向。决策闭环的关键保护措施是 Rokt
              的最低保留质量阈值：竞价候选无法超过严格的预测相关性和互动基准时，引擎会完全抑制展示，以零优惠避免干扰结账完成。Rokt mParticle 于 2025
              年收购，充当客户数据平台层；它采用流式与原生数仓结合的架构解析客户身份，并将持久化受众画像直接输送到推理集群。
