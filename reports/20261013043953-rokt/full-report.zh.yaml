              2025 年的 7.5 billion 笔交易增长，并预计 2026 年达到 10 billion 笔。              Sacra 的私人市场基准估计，Rokt 到 2025 年末的收入运行率为
              $900 million，EBITDA 约 $100 million。资产负债表方面，FundedIQ 记录了公司在三轮披露的一级融资中累计获得 $405 million 股权资金；2025 年 1 月完成的
