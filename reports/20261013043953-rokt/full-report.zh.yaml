            body: >-
              从机构投资判断角度看，Rokt 拥有可观的收入规模、快速的内生及收购驱动增长，以及无需偿债的资产负债表偿付能力。然而，几项严重障碍阻止我们做出明确的投资判断。公司 7%
              的毛利留存率让财务表现高度敏感于广告周期波动；宏观收缩时，消费者交易量和数字营销预算会同步下降。若优惠质量恶化或结账干扰导致购物车放弃，交叉销售展示还可能损害合作方品牌资产。最关键的是，Rokt
