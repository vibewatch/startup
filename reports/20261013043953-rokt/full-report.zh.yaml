      - number: '4.2'
        title: 单位经济性、分成率与成本结构
        blocks:
          - type: paragraph
            body: >-
              对 Rokt 核心广告单位经济性的拆解显示，这是一个高交易量但净分成留存率受压的市场。管理层披露称，广告主在平台上每支出一美元，总额中的 50
              美分直接作为供给侧收入分成给到出版商商户。服务交付、数据获取、实时机器学习基础设施和企业获客成本进一步吸收 43 美分。因此，Rokt 每美元仅保留约 7
              美分的公司毛利。分布式商业在无需承担持货风险的情况下，从第三方商品销售中产生约 3% 的增量分成率，但混合模式仍需要巨大的交易吞吐量才能支撑公司管理费用。Rokt 每年投入超过 $100 million
              用于研发，以维持低于 200 毫秒的决策和模型再训练；这带来显著的固定资本消耗，需要网络持续保持两位数扩张。
            claimRefs:
              - CI005
              - CI007
