figures:
  - id: FO001
    title: Rokt 增长与融资里程碑（2012–2026）
    type: timeline
    summary: 从成立到二级市场估值期间的主要融资轮次、地域扩张、收购和规模化里程碑时间线。
    data:
      items:
        - date: '2012'
          label: 成立与收购 Rocklive
          detail: Justin Viles 和 Bruce Buchanan 在悉尼创立 Rokt，并收购 Rocklive，改造电商交易场景。
          tone: positive
        - date: '2013'
          label: A 轮与区域扩张
          detail: 完成 $8M A 轮融资，并扩展至墨尔本、新加坡和新西兰。
          tone: positive
        - date: 2014-2015
          label: 进入美国与欧洲
          detail: 2014 年在纽约设立总部，2015 年扩展至伦敦，并与 Ticketmaster 达成标志性集成。
          tone: positive
        - date: 2019-2020
          label: C 轮与 D 轮扩张
          detail: 2019 年完成 $48M C 轮、2020 年完成 $80M D 轮融资，同时收购 OfferLogic，扩大零售和 B2B 覆盖。
          tone: positive
        - date: '2020'
          label: COVID-19 垂直行业冲击
          detail: 票务娱乐交易量下降 97%，旅游交易量下降 60%–70%；零售业反弹前，收入一度下降 65%。
          tone: negative
        - date: '2021'
          label: E 轮融资（$325M）
          detail: 以 $1.9B 估值完成 $325M E 轮融资（随后于 2022 年达到 $2.4B）。
          tone: positive
        - date: 2024-2025
          label: 主要战略收购
          detail: 收购 Aftersell（2024 年）、mParticle（2025 年初以 $300M 收购 CDP）和 Canal（2025 年 7 月收购，用于分布式商业目录）。
          tone: positive
        - date: 2025-2026
          label: $3.5B 二级估值与规模化
          detail: 以 $3.5B 估值完成 $335M 二级交易，推动 7.5B+ 笔交易，并宣布 Brain v4 引擎。
          tone: positive
    approximationNotes: 里程碑日期和融资规模汇总自公司公告、SEC 申报摘要和市场数据库。
    claimRefs:
      - CO001
      - CO005
      - CO006
      - CO010
      - CO013
  - id: FM001
    title: 交易场景可服务市场规模金字塔
    type: pyramid
    summary: 从电商总 GMV 到可服务的交易后效果广告支出的受限分层规模。
    approximationNotes: 各层反映综合 Sacra、Latka 和行业基准得出的估算市场深度；基础层代表净可服务抽成变现。
    claimRefs:
      - CM002
      - CM004
      - CM005
      - CM009
      - CM010
    data:
      items:
        - label: 全球电商商品交易总额（USD 6T+）
        - label: 在线企业交易场景（年交易 10B+ 笔）
        - label: 零售与商业媒体广告网络支出（USD 100B+ TAM）
        - label: 结账与交易后变现（USD 15B–25B SAM）
        - label: 按效果计费的转介广告（USD 3B–5B SOM）
        - label: 嵌入式分布式商业与附加销售（USD 1B–2B SOM）
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 跨竞争者与替代方案，评估交易场景变现能力与结账集成深度的战略定位图。
    approximationNotes: 坐标基于公开文件、集成架构和分析师报告得出的定性序数定位；分数限制在 1–10 区间。
    data:
      points:
        - label: Rokt
          x: 8.5
          'y': 9
          detail: 专注交易后的变现，以及闭环网络 AI 决策
        - label: Bolt
          x: 2.5
          'y': 7.5
          detail: 一键结账优化，但不具备广告变现功能
        - label: Cardlytics
          x: 7
          'y': 3.5
          detail: 与商户购买页面解耦的银行卡关联银行优惠
        - label: Mirakl
          x: 5.5
          'y': 6
          detail: 企业零售市场与零售媒体网络平台
        - label: Moloco
          x: 6.5
          'y': 5
          detail: 机器学习效果广告基础设施
        - label: 内部自建
          x: 2
          'y': 2.5
          detail: 定制化内部商户规则，缺少多租户广告主需求
    claimRefs:
      - CP001
      - CP005
      - CP011
  - id: FI001
    title: Rokt 收入模型与单位经济瀑布图
    type: waterfall
    summary: 以其电商网络每 $1.00 的广告总支出为例，展示 Rokt 的示意性单位经济。
    data:
      items:
        - label: 广告总支出
          value: 1
        - label: 合作商户分成
          value: -0.5
        - label: 技术与托管交付
          value: -0.25
        - label: 销售、数据与运营
          value: -0.18
        - label: 留存净营业利润
          value: 0.07
        - label: 分布式商业利润增量
          value: 0.03
    approximationNotes: 瀑布图为示意，依据 CEO 对 50/43/7 广告收入拆分和 3% 分布式商业抽成率的运营披露。
    claimRefs:
      - CI005
      - CI007
      - CI014
  - id: FE001
    title: Rokt 模块化技术与决策架构栈
    type: stack
    summary: 六层架构栈将商户结账场景连接到实时 AI 决策引擎和封闭式广告主网络。
    approximationNotes: 逻辑架构表示基于已发布的开发者文档、技术概览和工程高管披露。
    claimRefs:
      - CE006
      - CE007
      - CE008
      - CE010
    data:
      layers:
        - label: 客户端集成层
          detail: 嵌入式商户 SDK、REST API 和基于标签的集成钩子，原生运行于网页和移动端结账流程。
        - label: 交易场景编排层
          detail: 捕捉发现、购物车审阅、付款和订单确认状态，以识别高意向转化场景。
        - label: Rokt Brain 实时机器学习决策引擎
          detail: 低延迟推理引擎使用语义嵌入、纵向行为建模和最低储备质量阈值。
        - label: Rokt mParticle 客户数据平台
          detail: 混合实时流式与仓库原生的身份解析引擎，统一客户档案、预测 LTV 和事件信号。
        - label: Rokt 网络与封闭式库存市场
          detail: 闭环市场将商户广告位库存与精选的第三方效果广告主及目录商品匹配。
        - label: 治理、安全与合规基础
          detail: 细粒度的合作伙伴选择加入 / 退出控制、SOC 2 Type II、ISO 27001、GDPR/CCPA 执行和自动撤回同意。
  - id: FU001
    title: 客户采用与扩张旅程
    type: journey-map
    summary: Rokt 的公开客户旅程从商户集成延伸至交易激活和多产品扩张，但留存与集中度证据仍属私有信息。
    data:
      nodes:
        - id: integration
          label: 集成商户或平台
          detail: 将 Rokt 嵌入结账或交易后库存。
          touchpoints:
            - Ecommerce and digital teams
            - Platform partnership teams
        - id: governance
          label: 配置库存控制
          detail: 设置优惠、竞争对手和品牌匹配规则。
          touchpoints:
            - Merchant controls
            - Quality thresholds
        - id: activation
          label: 激活交易流量
          detail: 在购买意向阶段应用第一方和上下文信号。
          touchpoints:
            - Checkout
            - Confirmation
        - id: outcome
          label: 优化交易结果
          detail: 选择优惠、商品、消息，或不放置任何内容。
          touchpoints:
            - Monetization
            - Acquisition
        - id: expansion
          label: 扩大产品覆盖
          detail: 增加忠诚度、数据、广告或分布式商业能力。
          touchpoints:
            - Additional modules
            - More transaction surfaces
        - id: renewal
          label: 证明持久性
          detail: 续约和集中度是公开信息中最不透明的阶段。
          touchpoints:
            - Retention metrics
            - Contract and cohort evidence
    approximationNotes: 该顺序综合了有文档记录的产品界面与土地扩张描述；并非已披露的合同实施计划。
    claimRefs:
      - CU001
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 矩阵评估主要风险类别的发生可能性、严重性、缓释成熟度和剩余风险。
    data:
      columns:
        - 可能性
        - 影响严重性
        - 缓释成熟度
        - 剩余风险
      rows:
        - label: 监管合规与隐私
          values:
            - 中
            - 高
            - 已建立
            - 中等
        - label: 结账延迟与技术中断
          values:
            - 低
            - 高
            - 先进
            - 低
        - label: 商户合作伙伴集中度
          values:
            - 中
            - 高
            - 中等
            - 较高
        - label: 宏观经济与广告支出周期性
          values:
            - 高
            - 高
            - 早期
            - 高
        - label: 购物车弃购与用户分心
          values:
            - 中
            - 高
            - 已建立
            - 中等
        - label: 抽成率压缩与收入分成
          values:
            - 中
            - 高
            - 早期
            - 较高
        - label: 集成与 SDK 治理
          values:
            - 低
            - 中
            - 先进
            - 低
    approximationNotes: 可能性和严重性评级是综合公司披露、历史冲击和独立市场数据得出的定性判断。
    claimRefs:
      - CR012
      - CR013
      - CR014
      - CR015
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 决策链将企业交易规模和单位经济连接到私有市场信息不透明，最终得出“跟踪”建议。
    data:
      nodes:
        - id: market-scale
          label: 企业交易覆盖
          detail: 在 3,000+ 个合作伙伴中推动超过 7.5B 笔交易，2024 年收入增长 >40% 至 US$600M
        - id: unit-economics
          label: 已验证的结账后变现
          detail: 核心市场模式从交易流中产生 50% 的合作伙伴分成和估算 $100M EBITDA
        - id: strategic-mna
          label: 产品层扩张
          detail: 收购 mParticle（$300M）和 Canal，将第一方客户数据接入结账环节
        - id: opacity-gap
          label: 私有财务不透明
          detail: 缺少经审计的 GAAP 财务数据、详细留存群组和股权结构表，存在清算优先权悬置
        - id: governance-risk
          label: 治理与文化拖累
          detail: 不公平解雇仲裁仍在进行，WGEA 性别薪酬差距存在，高管持续更替
        - id: valuation-discipline
          label: 二级估值纪律
          detail: US$3.5B 二级估值（5.8 倍收入）在缺少公开审计时留下有限安全边际
        - id: final-stance
          label: “投资判断：跟踪”
          detail: 保持“跟踪”建议和高风险评级；在提交 S-1 前暂缓资本部署
    approximationNotes: 综合主要增长数据和治理披露的示意性顺序决策框架。
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV010
      - CV012
      - CV013
      - CV014
