companyProfile:
  summary: >-
    Rokt 是一家后期私人商业媒体平台，围绕商户和广告主在结账、购物车、支付及购后环节的交易时刻变现。公司把庞大的企业合作网络、AI 驱动的决策系统、封闭式第一方数据模型，与 Rokt Ads、Rokt Ecommerce、Rokt
    mParticle、Canal 和 Aftersell 等相邻产品结合起来。公开证据支持其规模和持续增长，但公司仍未提供经审计财务报表、详细留存队列及股权结构细节，因此投资判断的确定性仍不足以进一步提高。
