  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险：隐私框架和 Cookie 弃用
        blocks:
          - type: paragraph
            body: >-
              Rokt 处在交易数据、消费者身份和购后广告的敏感交界面。公司将直接的第一方软件开发套件（SDK）集成定位为第三方 Cookie
              弃用的结构性受益者，但独立行业分析强调，这一模式高度依赖不断变化的隐私法规，以及商户分享结账遥测数据的意愿。遵守欧盟《通用数据保护条例》（GDPR）和《加州消费者隐私法案》（CCPA）等州级消费者隐私法律，需要严格的同意治理、可验证的数据主体访问请求流程和严密的数据分区。为降低监管暴露，Rokt
              执行封闭网络数据政策：隔离客户第一方信号，并通过合同承诺确保数据不会在商户之间出售或共享，同时采用单向摄取管道处理数据。不过，联邦贸易委员会（FTC）持续关注数字结账中的负选计费、隐藏披露和暗黑模式，因此公司必须持续监测交易后优惠展示、同意说明的清晰度和客户取消机制。
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
      - number: '7.2'
        title: 运营与安全韧性：延迟预算和质量阈值
        blocks:
          - type: paragraph
            body: >-
              交易时刻是数字商业中意向最高但也最脆弱的流量入口之一。把第三方优惠或产品推荐嵌入结账和确认页，会带来显著运营风险：延迟尖峰或干扰性内容若损害消费者体验，商户会立即面临购物车放弃和核心转化损失。Rokt 通过 AI
              Brain 支持的、以测量为先的机器学习框架来应对运营摩擦。平台在严格的亚秒级延迟约束下实时决策优惠，在全球边缘部署中每秒处理数千次相关性算法。此外，Rokt
              设置竞价保留质量阈值：候选优惠无法超过最低相关性和预期价值标准时，系统显示零推荐，确保非增值展示不会打断结账流程。分布式商业功能支持流程内原生加购，避免会损害商户信任的站外跳转。不过，独立安全审计、渗透测试结果和
              SOC 2 Type II 合规报告的外部可见性仍然受限，企业买方只能依赖私下尽调。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
      - number: '7.3'
        title: 合作方与依赖集中度：收入分成和关键商户平台
        blocks:
          - type: paragraph
            body: >-
              Rokt 的企业业务模式是一个多边市场，将超过 3,000 家零售、票务、旅游和按需服务合作伙伴与广告主及交易消费者连接起来。这种架构天然带来交易对手和平台集中度风险。供给侧依赖 Live
              Nation、PayPal、Uber 和 Macy's 等旗舰企业客户持续部署
              SDK。由于商户最终控制结账流量位置，若它们转向自建零售媒体网络或简化购后流程，就会构成去中介化威胁。经济上，该市场采用效果导向的收入分成结构：广告总额每美元中约 50
              美分直接支付给商户合作方，技术、数据、托管和销售开销约吸收 43 美分，Rokt 每美元仅留下约 7 美分经营利润。这一低净分成率放大了合同费用重新谈判、合作方解除集成以及企业续约期间利润率受压的脆弱性。
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
      - number: '7.4'
        title: 宏观周期性、模型暴露与剩余风险综合
        blocks:
          - type: paragraph
            body: >-
              除平台依赖外，Rokt 对更广泛的宏观周期和消费者可选支出量高度敏感。广告收入直接随电商交易数量和企业营销预算增长，严重经济下行会压缩交易吞吐量，同时降低广告主竞价价格。2020
              年经济冲击证明了这种依赖交易量模式的脆弱性：娱乐和票务行业交易量下降 97%，旅游交易量收缩 60% 至 70%。此后，公司通过收购 mParticle、Aftersell 和
              Canal，扩展零售、直接面向消费者目录和客户数据基础设施（CDP），扩大了垂直行业多样性，但零售媒体支出仍具有周期性。总体剩余风险来自较高的合作方集中度和宏观经济波动；成熟的运营延迟保护及既有第一方数据隐私保护则提供了平衡。
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 商户去中介化与分成率敏感性
            body: Rokt 每美元广告支出仅约有 7 美分净经营分成率，同时还要向商户供给合作方支付 50 美分，因此头部商户重新谈判或迁移到自有零售媒体网络，会让经营利润率高度暴露。
            calloutType: risk
            claimRefs:
              - CR009
              - CR010
          - type: callout
            title: IPO 前隐私与延迟尽调重点
            body: 投资人和机构投资者应以未删节的 SOC 2 Type II 报告、按展示位记录的 FTC 合规审计日志，以及商户合同续约队列为承诺前提，以验证留存持久性和监管韧性。
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR002
              - CR006
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资主题与投资判断确定性
        blocks:
          - type: paragraph
            body: >-
              Rokt 的商业画像颇具吸引力，核心在于它对购后交易时刻的专业掌控。公司将机器学习推荐引擎直接部署在 Uber、Lyft 和 AMC Theatres
              等一线企业合作伙伴的确认页和结账页，在核心购买承诺完成后捕获高意向消费者注意力。公司披露 2024 年收入同比增长超过 40%，达到 US$600
              million，显示主要数字商业生态中的强劲势头和验证。不过，Rokt 是一家没有经审计 GAAP 披露的私人公司，因此收入数据必须谨慎解读。核心市场模式将约 50%
              的广告总收入分给企业库存承载方，在扣除技术和销售交付费用后，商品流动总额上的净毛利率估计为 7%。综合已验证的运营规模、分成率依赖和披露约束，投资人建议维持跟踪，风险评级为高，并在老股交易价格上给予合理估值判断。
            claimRefs:
              - CV001
              - CV003
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV012
              - CV013
      - number: '8.2'
        title: 当前估值背景与老股定价支持
        blocks:
          - type: paragraph
            body: >-
              Rokt 的资本结构和定价标记经历了几轮结构化一级融资与流动性要约。2021 年 12 月，公司完成由 Tiger Global 领投的 US$325 million E 轮一级融资，投后估值为 US$1.95
              billion。随后，2022 年末的一笔初始 US$750 million 老股交易将公司重新定价至 US$2.4 billion。2025 年 1 月，Rokt 完成结构化 US$335 million
              老股要约，企业估值为 US$3.5 billion；Square Peg Capital、Tiger Global、Barrenjoey 和 SecondQuarter 参与其中。该交易约 US$122
              million 为早期员工和种子投资人提供流动性，长期持有的风险投资基金则重新平衡成熟基金的资产配置。按 US$3.5 billion 估值计算，Rokt 相当于 2024 年披露收入的
              5.8x。未经确认的市场传闻称，有意向条款给出了更高数字，但 Forge Global 等平台的广泛二级市场追踪显示，历史一级市场价格之上流动性很薄，匹配交易深度有限。鉴于后期软件资产整体倍数压缩，公开证据支持将
              US$3.5 billion 估值视为合理，但价格已充分反映价值。
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV008
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: 情景分析、倍数区间与下行触发因素
        blocks:
          - type: paragraph
            body: >-
              评估前瞻性股权回报，需要拆分零售媒体网络和广告技术平台的企业倍数预期。管理层目标是在 2025 年末实现 US$1 billion 的收入运行率，背后有 US$300 million 的 mParticle
              客户数据平台收购整合支持。在基准情景中，假设 Rokt 2025 财年收入达到 US$800 million，正常化 EBITDA 利润率为 12% 至 15%，则 4.5x 至 5.5x 的前瞻企业倍数对应
              US$3.6 billion 至 US$4.4 billion 的股权估值，较当前老股进入价格有温和上行空间。乐观情景要求有机收入加速超过 US$950 million，EBITDA 利润率向 20%
              扩张，推动收入倍数重估至 7.0x 至 8.0x，股权价值达到 US$6.5 billion 至 US$7.5 billion。相反，悲观情景假设年增长放缓至 15% 至
              20%，合作方合同重新谈判使净利润率压低至 8% 以下，同时广告技术同业倍数进一步压缩，最终下行估值区间为 US$1.8 billion 至 US$2.1 billion。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV012
      - number: '8.4'
        title: 决策逻辑与建议框架
        blocks:
          - type: paragraph
            body: >-
              从运营规模到最终投资判断，整套分析链条十分清晰。商业采用情况已有充分记录：2025 年网络交易量超过 75 亿笔，3,000 家活跃零售合作伙伴也验证了产品价值。通过收购 mParticle 和
              Canal，公司进一步把第一方数据采集嵌入结账流程。但业务动能也被结构性风险抵消。私有披露掩盖了资产负债表关键指标、毛利留存、客户集中度和广告主留存队列。持续的雇佣仲裁，以及澳大利亚职场性别平等机构的披露，又带来声誉与执行层面的拖累。当前二级市场定价为
              US$3.5 billion；一旦合作伙伴 take rate 被压缩或市场倍数收缩，安全边际将所剩无几。因此，在目标 2026 年登陆纳斯达克之前、完整 S-1 注册声明提交前，机构配置者应维持 Track
              纪律。
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV010
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV010
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: 上市准备、治理与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              Rokt 已采取具体运营措施筹备公开市场上市：任命 Anita Sands、Datadog 首席财务官 David Obstler 等知名非执行董事，并由 David Obstler
              主持审计委员会，治理基础已经成熟。公司仍以 2026 年在纳斯达克首次公开募股为目标，为员工期权池提供关键流动性；该期权池约占历次股权分配的
              27%。在能够高确信度投入资本前，关键尽调门槛必须逐一跨过：审阅多年经审计的 GAAP 损益表，核实净收入确认；审计合作伙伴 take rate 合同，确认长期排他性；检查 A 至 E
              轮股份的股权结构表清算优先权层级；评估持续中的前员工仲裁索赔如何解决。任何低于 US$2.5 billion 的下轮二级定价、不利诉讼裁决，或失去核心企业结账库存，都将触发论点破坏，迫使评级立即下调至
              Avoid。
            claimRefs:
              - CV007
              - CV009
              - CV010
              - CV014
      - number: '8.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 投资判断：等待 IPO 就绪审计披露，维持 Track
            body: >-
              公开证据确认 Rokt 的营收端动能强劲：2024 年收入达到 US$600 million，年度增长超过 40%；其在企业级商业领导者中的交易时刻规模也已得到验证。不过，私有市场对真实毛利率贡献、take
              rate 可持续性和清算优先权负担仍不透明，因此在 US$3.5 billion 定价下，应维持有纪律的 Track 判断，而不是无条件 Buy。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV012
              - CV013
          - type: callout
            title: 二级估值脱节与治理拖累
            body: >-
              2025 年 1 月，部分二级出售以 US$3.5 billion 估值成交；但 Forge Global 等公开二级平台显示流动性受限，2021 年 E
              轮价格以上没有主动撮合的交易。再叠加职场性别薪酬差距披露、管理层更替和持续中的雇佣仲裁，公司在目标 2026 年上市前的治理风险仍处于高位。
            calloutType: risk
            claimRefs:
              - CV002
              - CV008
              - CV009
              - CV010
