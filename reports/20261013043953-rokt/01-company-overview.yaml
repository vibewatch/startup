callouts:
- calloutType: strength
  title: Closed-Network Transaction Monetization at Scale
  body: Rokt's direct SDK integration into more than 3,000 enterprise checkout flows enables first-party data activation without
    reliance on third-party tracking cookies, powering over 7.5 billion transactions annually [CO010, CO014].
  claimRefs:
  - CO010
  - CO014
- calloutType: risk
  title: Low Gross Profit Retention on Advertising Spend
  body: Because partner merchants receive 50 cents of every advertising dollar and technical delivery absorbs 43 cents, Rokt
    retains only 7 cents in gross profit, making unit economics highly dependent on continuous gross volume expansion [CO012].
  claimRefs:
  - CO012
