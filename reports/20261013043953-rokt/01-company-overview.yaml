company:
  name: Rokt
chapter:
  number: 1
  title: Company Overview
  summary: Rokt is an ecommerce technology company founded in 2012 that uses machine learning to monetize and optimize transaction
    moments across a network of over 3,000 enterprise partners. The business reached an estimated $3.5 billion valuation via
    a $335 million secondary transaction in January 2025 and reported $600 million in 2024 revenue, while public disclosures
    demonstrate low margin retention on gross advertising spend and structural exposure to transaction-volume cyclicality.
sections:
- id: identity-and-business-model
  title: Corporate Identity, Platform Architecture, and Monetization Engine
  body: Rokt was founded in 2012 by Justin Viles and Bruce Buchanan, originating from Buchanan's observation at Jetstar Airways
    that customer transaction moments represent underleveraged high-intent surfaces [CO001]. Legally operating as ROKT Pte.
    Ltd. with global headquarters in New York City, Rokt provides an ecommerce technology platform that uses machine learning
    to orchestrate personalized offers during cart, payment, and post-purchase confirmation steps [CO002, CO014]. Unlike traditional
    digital advertising platforms that interrupt top-of-funnel browsing, Rokt operates a closed two-sided marketplace where
    merchant partners monetize final checkout screens through relevant third-party offers or native product cross-sells [CO014].
    The core engine, known as the Rokt AI Brain, calculates real-time decisioning within millisecond latency budgets to optimize
    revenue per transaction while preserving core merchant conversion [CO014].
  claimRefs:
  - CO001
  - CO002
  - CO014
  tableRefs:
  - TO001
- id: leadership-and-governance
  title: Executive Leadership, AI Specialization, and Board Governance
  body: Executive leadership at Rokt remains anchored by co-founder and Chief Executive Officer Bruce Buchanan, whose background
    in airline commerce shaped the company's focus on post-transaction monetization [CO001, CO003]. Core technical differentiation
    is led by Chief AI Officer Claire Southey, who directs the machine learning models and inference systems governing offer
    relevance and data privacy [CO003]. To prepare for a planned public offering and strengthen corporate governance, Rokt
    expanded its board advisory structure in late 2025 by appointing Datadog Chief Financial Officer David Obstler as audit
    committee chair and former Wise CFO Matt Briers as board advisor [CO004]. These additions provide public-market financial
    reporting oversight and audit controls, mitigating key-person operational risks while instituting formal committee procedures
    ahead of an eventual initial public offering [CO004].
  claimRefs:
  - CO001
  - CO003
  - CO004
  tableRefs:
  - TO002
- id: capitalization-and-stakeholders
  title: Capitalization History, Secondary Valuation, and Institutional Backing
  body: Rokt has raised more than $480 million in primary equity capital across multiple financing stages, headlined by a
    $325 million Series E round in December 2021 [CO005]. In January 2025, the company completed a $335 million secondary
    liquidity transaction that valued Rokt at $3.5 billion, co-led by Tiger Global Management and longstanding early backer
    Square Peg Capital [CO006]. The shareholder base combines tier-one venture capital, late-stage growth crossover funds,
    and patient institutional superannuation capital, including Whale Rock Capital, TDM Growth Partners, and Hostplus [CO007].
    This multi-tiered ownership structure has enabled extensive employee and early-stage liquidity without issuing dilutive
    primary equity, while establishing institutional sponsorship from public-market crossover investors [CO006, CO007].
  claimRefs:
  - CO005
  - CO006
  - CO007
  tableRefs:
  - TO003
- id: milestones-and-adverse-trajectory
  title: Operational Scale, Strategic Acquisitions, and Structural Headwinds
  body: 'Rokt''s operational network achieved massive commercial scale by processing over 7.5 billion transactions in 2025,
    supporting reported 2024 revenues of $600 million and estimated 2025 annualized revenue run rates of $800 million to $900
    million [CO008, CO009, CO010]. Global operations encompass over 700 employees across 8 corporate offices in 17 international
    markets, anchored by engineering hubs in New York, Sydney, and Seattle [CO011]. However, historical operating disclosures
    reveal material structural risks: in its primary advertising product, Rokt retains only approximately 7 cents of gross
    profit per dollar of gross ad spend after partner payouts and operational costs [CO012]. Furthermore, during the 2020
    pandemic, vertical concentration in entertainment and travel triggered a 65% revenue drawdown, demonstrating acute sensitivity
    to vertical volume shocks [CO013].'
  claimRefs:
  - CO008
  - CO009
  - CO010
  - CO011
  - CO012
  - CO013
  figureRefs:
  - FO001
