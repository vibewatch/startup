    rows:
      - - Post-Purchase Commerce Media
        - Confirmation page offers, post-transaction rewards, cross-brand vouchers
        - Pre-purchase search ads, social feeds, off-site programmatic banners
        - Performance marketing brands & direct advertisers
        - Core monetization engine powering 50% merchant revenue share
      - - In-Flow Distributed Commerce
        - Native in-cart upsells, event parking, warranties, travel add-ons
        - Wholesale inventory purchasing, physical warehousing logistics
        - Consumer buyers checking out on partner platforms
        - High-growth transaction attach rate taking ~3% take rate
      - - Payment Method Incentives
        - Co-branded card promotions, alternative payment incentives, merchant rewards
        - Interchange processing fees, card network clearing, acquiring gateways
        - Fintech issuers, payment processors, digital wallets
        - Converts checkout payment selection from cost center to profit engine
      - - First-Party Customer Data Infrastructure
        - Real-time identity resolution, customer event routing, consent management
        - Third-party cookie brokering, syndicated external data marketplaces
        - Enterprise marketing technology & data engineering leads
        - Integrated through mParticle acquisition to power real-time AI relevance
    notes: Taxonomy delineates transaction-moment solutions from upstream ad-tech and core payment rails based on Rokt product disclosures and analyst categorization.
