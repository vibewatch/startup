callouts:
  - calloutType: insight
    title: The Transaction Moment as Uncontested Real Estate
    body: While search and social giants dominate pre-purchase discovery, the transaction moment represents post-purchase real estate where consumer buying intent is verified, allowing Rokt to monetize without competing directly against Google and Meta auction pricing.
    claimRefs:
      - CM001
      - CM002
      - CM008
  - calloutType: risk
    title: Friction Sensitivity and Cart Abandonment Risk
    body: Because checkout remains the highest-intent yet most delicate stage of ecommerce conversion, merchants face structural friction risks if third-party offers distract shoppers, necessitating strict AI quality thresholds to avoid core conversion degradation.
    claimRefs:
      - CM012
      - CM013
      - CM014
