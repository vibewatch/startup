chapter:
  number: 2
  title: Market Analysis
  summary: Rokt monetizes the high-intent post-purchase transaction moment across an enterprise network of over 3,000 ecommerce partners, unlocking ancillary performance advertising revenue and distributed commerce upsells. While tailwinds from third-party cookie deprecation expand addressable demand for closed-network first-party data monetization, merchant adoption remains constrained by cart abandonment sensitivity, checkout friction concerns, and macroeconomic cyclicality.
sections:
  - id: market-boundary-and-spend-taxonomy
    title: Market Boundary, Spend Taxonomy, and Substitutes
    body: The transaction-moment commerce media market occupies a distinct structural boundary within digital advertising and ecommerce software. Unlike traditional digital advertising platforms such as Google and Meta that monetize pre-purchase user intent via search, social feeds, and top-of-funnel display auctions, transaction-moment platforms operate exclusively during the high-intent checkout and order confirmation phases. Included spend comprises closed-network performance marketing, merchant ancillary revenue placements, payment-method incentives, and distributed commerce add-ons embedded directly in confirmation workflows. Excluded spend includes traditional off-site retargeting banners, upper-funnel programmatic display, and core payment acquiring fees. In-house engineering rules and static confirmation coupons represent the primary status-quo substitutes, but enterprise merchants increasingly favor machine learning decisioning to dynamically rank offers without introducing checkout friction.
    claimRefs:
      - CM001
      - CM002
      - CM003
    tableRefs:
      - TM001
  - id: market-sizing-and-constrained-lenses
    title: 'Market Sizing Lenses: TAM, SAM, and SOM Constraints'
    body: Evaluating the market size for transaction-moment commerce media requires multiple constrained analytical lenses rather than a single broad estimate. At the macroeconomic ceiling, global ecommerce gross merchandise volume exceeds six trillion dollars annually, establishing an enormous transaction baseline. Analyst benchmarks from Sacra estimate Rokt achieved approximately $900 million in annualized revenue by October 2025 across an enterprise network spanning 3,000 partners, while company disclosures indicate network throughput reached 7.5 billion transactions in 2025 with projections exceeding 10 billion in 2026. Latka historical disclosures reflect a scalable $200 million underlying revenue base in 2021 with $90 million in gross profit. Constraining broad commerce media spend down to the post-purchase transaction moment yields a realistic serviceable addressable market between $15 billion and $25 billion, governed by merchant take-rates and non-endemic advertiser appetite.
    claimRefs:
      - CM004
      - CM005
      - CM006
      - CM009
      - CM010
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: buyer-personas-and-budget-ownership
    title: Buyer Segmentation, Workflow Integration, and Budget Ownership
    body: The transaction-moment marketplace exhibits a two-sided commercial structure uniting enterprise ecommerce merchants and non-endemic performance advertisers. On the supply side, enterprise retailers, ticketing marketplaces, and ride-hailing operators deploy Rokt's software development kit to unlock pure incremental profit from confirmation screens. Decision-makers include Chief Commercial Officers, VP of Ecommerce, and retail media network leads seeking margin expansion. On the demand side, customer acquisition teams and performance media buyers allocate growth budgets on a cost-per-referral or cost-per-acquisition basis, targeting high-intent consumers in an active shopping mindset. Commercial agreements operate largely on performance-based revenue sharing, where approximately 50 percent of gross advertising spend is disbursed to the merchant partner, while Rokt captures margin after data, hosting, and operational overhead.
    claimRefs:
      - CM007
      - CM008
      - CM009
      - CM010
    tableRefs:
      - TM003
  - id: growth-drivers-and-adoption-constraints
    title: Growth Drivers, Adoption Constraints, and Diligence Risks
    body: Adoption of transaction-moment monetization is propelled by systemic industry catalysts and counterbalanced by operational constraints. The depreciation of third-party tracking cookies has forced performance advertisers to seek authenticated, first-party customer environments, elevating closed-network checkout inventory to premium status. Furthermore, enterprise retailers facing compressed retail product margins prioritize ancillary revenue streams that flow directly to bottom-line profitability. Conversely, adoption is constrained by merchant apprehension regarding cart abandonment and brand erosion. Because the transaction moment represents the final critical leg of the purchase funnel, irrelevant or disruptive offers risk frustrating consumers. Consequently, merchants demand strict governance, closed-network data isolation, and algorithmic quality thresholds that withhold third-party offers whenever relevance criteria cannot be guaranteed.
    claimRefs:
      - CM011
      - CM012
      - CM013
      - CM014
      - CM015
