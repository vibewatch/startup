callouts:
  - calloutType: "insight"
    title: "The Zero-Impression Quality Reserve Fallback"
    body: "A pivotal architectural safeguard in the Rokt Brain is its strict reserve quality threshold: when candidate advertiser or upsell offers fail to meet high predicted relevance or engagement scores, the inference engine chooses to render nothing at all. This design prioritizes core merchant checkout completion over short-term ad impression monetization, mitigating checkout abandonment."
    claimRefs:
      - "CE007"
      - "CE008"
  - calloutType: "risk"
    title: "Client-Side Dependency and Latency Headwinds"
    body: "Because Rokt's components execute directly within high-intent checkout and confirmation steps, any network latency spike or client-side script contention threatens merchant conversion rates. While Rokt maintains low-latency inference budgets and 99.9% uptime, enterprise merchants face architectural exposure to browser script blockers and strict privacy sandbox constraints."
    claimRefs:
      - "CE006"
      - "CE011"
      - "CE014"
