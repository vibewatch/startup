chapter:
  number: 5
  title: "Product & Technology"
  summary: "Rokt provides an AI-driven transaction relevance engine and commerce media network operating across checkout, cart, payment, and post-purchase confirmation moments. Its core technical surface integrates the Rokt Brain real-time ML decisioning infrastructure with an enterprise customer data platform (Rokt mParticle) and modular ecommerce application suite, achieving sub-second low-latency inference across billions of transactions while enforcing strict reserve quality thresholds."
sections:
  - id: "product-portfolio-transaction-moments"
    title: "Product Portfolio and Transaction Moment Architecture"
    body: >-
      Rokt organizes its product offering around the Transaction Moment, defining it as the customer journey through product discovery, cart review, payment processing, and post-purchase confirmation. The company segments its commercial capabilities into three core product lines: Rokt Ecommerce, Rokt Ads, and Rokt mParticle. Rokt Ecommerce deploys native front-end modules within the merchant's purchase flow, including Rokt Catalog for non-inventory third-party product discovery, Rokt Upcart for in-cart recommendations, Rokt Pay+ for payment-page incentives, and Rokt Thanks for post-purchase confirmation offers. Through its 2024 acquisition of Aftersell, Rokt extended these in-cart and post-purchase upsell capabilities to SMB and mid-market merchants on Shopify. Rather than routing shoppers off-site via traditional advertising hyperlinks, Rokt's distributed commerce architecture facilitates in-flow add-to-cart actions, preserving conversion continuity across partner transactions.
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
    tableRefs:
      - "TE001"
      - "TE002"
  - id: "technology-architecture-ai-brain"
    title: "Technology Stack and the Rokt Brain Decisioning Engine"
    body: >-
      The technological cornerstone of Rokt's platform is the Rokt Brain, a proprietary machine learning and real-time decisioning infrastructure engineered to select the single highest-value action for each customer within strict latency budgets. Operating at scale across more than 7.5 billion transactions annually, the Rokt Brain utilizes semantic embeddings and longitudinal behavioral modeling—incorporating cart history, abandoned items, and explored product catalogs—to estimate individual customer conversion intent. A critical operational safeguard of the decisioning loop is Rokt's minimum reserve quality threshold: when auction candidates cannot surpass stringent predicted relevance and engagement baselines, the engine suppresses placements entirely, displaying zero offers to avoid disrupting checkout completion. Acquired in 2025, Rokt mParticle functions as the customer data platform layer, utilizing a hybrid streaming and warehouse-native architecture to resolve customer identities and pipe persistent audience profiles directly into the inference cluster.
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "data-governance-security-compliance"
    title: "Data Governance, Network Privacy, and Compliance Infrastructure"
    body: >-
      Operating across enterprise ecommerce checkout moments requires robust data governance and regulatory compliance controls. Rokt positions Rokt Ads as a closed-network performance marketing channel running exclusively on first-party transaction signals rather than third-party tracking cookies or open ad exchanges. The company implements a strict data governance framework, enforcing a declared policy that merchant partner data is never shared, sold, or pooled across external network tenants. Merchants retain granular inventory governance controls to specify category exclusions, competitor blacklists, and placement opt-outs. From a security and regulatory perspective, Rokt maintains compliance with SOC 2 Type II, ISO 27001, GDPR, and CCPA standards, operating on an enterprise availability target of 99.9 percent uptime with automated tools enabling consumers to inspect and unwind data consent.
    claimRefs:
      - "CE003"
      - "CE011"
      - "CE012"
      - "CE013"
  - id: "technical-risks-diligent-gaps"
    title: "Technical Dependencies, Latency Risks, and Diligence Deficiencies"
    body: >-
      Despite robust commercial scale, Rokt's architectural surface exhibits distinct technical dependencies and diligence deficits. Because the SDK and API hooks operate directly within high-intent checkout paths, any network latency spike or client-side JavaScript execution failure creates severe cart abandonment risks for host merchants. Furthermore, public developer telemetry, open-source repositories, and independent API latency benchmarks remain effectively unavailable, reflecting Rokt's reliance on proprietary closed-source SDKs and enterprise integrations. Diligence underwriters cannot independently verify production inference latency distributions, model drift frequencies, or client-side page load overhead from public artifacts. These unverified performance characteristics, alongside reliance on host platform extensibility frameworks such as Shopify checkout APIs, represent material technical risks requiring direct production SLA and telemetry verification.
    claimRefs:
      - "CE006"
      - "CE011"
      - "CE014"
