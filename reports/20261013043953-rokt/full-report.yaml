  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Regulatory and Legal Risk: Privacy Frameworks and Cookie Deprecation'
        blocks:
          - type: paragraph
            body: >-
              Rokt operates at the sensitive intersection of transaction data, consumer identity, and post-purchase
              advertising. While the company positions its direct first-party software development kit (SDK) integration
              as a structural beneficiary of third-party cookie deprecation, independent industry analyses emphasize
              that this model introduces acute dependencies on evolving privacy statutes and merchant willingness to
              share checkout telemetry. Compliance with the European Union General Data Protection Regulation (GDPR) and
              state-level consumer privacy laws such as the California Consumer Privacy Act (CCPA) requires rigorous
              consent governance, verifiable data subject access request workflows, and strict data partitioning. To
              mitigate regulatory exposure, Rokt enforces a closed-network data policy under which client first-party
              signals are isolated, governed by contractual commitments that data is neither sold nor shared across
              merchants, and processed via one-way ingestion pipelines. However, regulatory scrutiny from the Federal
              Trade Commission (FTC) regarding negative option billing, hidden disclosures, and dark patterns across
              digital checkouts necessitates constant monitoring of post-transaction offer presentation, consent
              clarity, and customer cancellation mechanics.
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
      - number: '7.2'
        title: 'Operational and Security Resilience: Latency Budgets and Quality Thresholds'
        blocks:
          - type: paragraph
            body: >-
              The transaction moment represents one of the highest-intent yet most delicate surfaces in digital
              commerce. Embedding third-party offers or product recommendations into checkout and confirmation pages
              introduces significant operational risk: if latency spikes or distracting content impairs the consumer
              experience, merchants face immediate cart abandonment and lost core conversion. Rokt addresses this
              operational friction through a measurement-first machine learning framework powered by its AI Brain. The
              platform executes real-time offer decisioning under tight sub-second latency constraints, processing
              relevance algorithms thousands of times per second across global edge deployments. Furthermore, Rokt
              enforces an auction reserve quality threshold whereby the system displays zero recommendations if
              candidate offers fail to surpass minimum relevance and expected value bars, ensuring that non-additive
              placements do not disrupt the checkout flow. Distributed commerce features enable native in-flow
              add-to-cart actions, avoiding off-site redirects that degrade merchant trust. Nonetheless, external
              visibility into independent security audits, penetration test results, and SOC 2 Type II compliance
              reports remains restricted, leaving enterprise buyers dependent on private due diligence.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
      - number: '7.3'
        title: 'Partner and Dependency Concentration: Revenue Shares and Key Merchant Platforms'
        blocks:
          - type: paragraph
            body: >-
              Rokt's enterprise business model operates as a multi-sided marketplace connecting more than 3,000 retail,
              ticketing, travel, and on-demand partners with advertisers and transacting consumers. This architecture
              creates inherent counterparty and platform concentration risks. On the supply side, the platform relies on
              ongoing SDK deployments across flagship enterprise clients, including Live Nation, PayPal, Uber, and
              Macy's. Because merchants hold ultimate control over their checkout real estate, any strategic shift
              toward building in-house retail media networks or simplifying post-purchase flows represents a
              disintermediation threat. Economically, the marketplace operates on a performance-based revenue-sharing
              structure: approximately 50 cents of every gross advertising dollar is remitted directly to the merchant
              partner, while technology, data, hosting, and sales overhead consume roughly 43 cents, leaving Rokt with
              approximately 7 cents in operating profit per dollar. This low net take-rate amplifies vulnerability to
              contractual fee renegotiations, partner de-integrations, and margin compression across enterprise
              renewals.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
      - number: '7.4'
        title: Macroeconomic Cyclicality, Model Exposure, and Residual Risk Synthesis
        blocks:
          - type: paragraph
            body: >-
              Beyond platform dependencies, Rokt exhibits acute sensitivity to broader macroeconomic cycles and consumer
              discretionary spending volumes. Because advertising revenue scales directly with e-commerce transaction
              counts and corporate marketing budgets, severe economic downturns compress transaction throughput while
              simultaneously reducing advertiser bid pricing. The fragility of this volume-dependent model was
              demonstrated during the 2020 economic shock, when entertainment and ticketing vertical volumes dropped by
              97% and travel transaction volumes contracted by 60% to 70%. Although subsequent expansion into retail,
              direct-to-consumer catalogs, and customer data infrastructure (CDP) through acquisitions such as
              mParticle, Aftersell, and Canal has broadened vertical diversification, retail media spending remains
              cyclical. Overall residual risk reflects elevated partner concentration and macroeconomic volatility,
              counterbalanced by mature operational latency safeguards and established first-party data privacy
              protections.
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Merchant Disintermediation and Take-Rate Sensitivity
            body: >-
              Rokt's low net operating take-rate of approximately 7 cents per advertising dollar, combined with
              remitting 50 cents to merchant supply partners, leaves operating margins highly exposed to enterprise
              renegotiations or in-house retail media network migrations by top-tier merchants.
            calloutType: risk
            claimRefs:
              - CR009
              - CR010
          - type: callout
            title: Pre-IPO Diligence Priorities on Privacy and Latency
            body: >-
              Underwriters and institutional investors should condition commitment on unredacted SOC 2 Type II reports,
              placement-level FTC compliance audit logs, and merchant contract renewal cohorts to verify retention
              durability and regulatory resilience.
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR002
              - CR006
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Underwriting Conviction
        blocks:
          - type: paragraph
            body: >-
              Rokt presents an attractive commercial profile grounded in its specialized command of the post-purchase
              transaction moment. By positioning its machine learning recommendation engine directly on the confirmation
              and checkout pages of tier-one enterprise partners including Uber, Lyft, and AMC Theatres, Rokt captures
              high-intent consumer attention after core purchase commitments are finalized. Reported 2024 revenue
              expanded by more than 40% year over year to US$600 million, demonstrating strong momentum and validation
              across major digital commerce ecosystems. However, because Rokt operates as a private company without
              audited GAAP disclosures, top-line figures must be interpreted with caution. The core marketplace model
              distributes approximately 50% of gross ad revenue back to enterprise inventory hosts, leaving an estimated
              7% net gross margin on gross merchandise flow after technology and sales delivery expenses. Balancing this
              verified operating scale against take-rate dependencies and disclosure constraints leads to an underwriter
              recommendation of Track, paired with a High risk classification and a Fair valuation stance at secondary
              transaction marks.
            claimRefs:
              - CV001
              - CV003
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV012
              - CV013
      - number: '8.2'
        title: Current Valuation Context and Secondary Pricing Support
        blocks:
          - type: paragraph
            body: >-
              Rokt's capital structure and pricing marks have evolved through several structured primary rounds and
              liquidity tenders. In December 2021, the company closed a US$325 million Series E primary round led by
              Tiger Global at a post-money valuation of US$1.95 billion. Subsequently, in late 2022, an initial US$750
              million secondary transaction re-priced the business at US$2.4 billion. In January 2025, Rokt completed a
              structured US$335 million secondary tender offer valuing the enterprise at US$3.5 billion, with
              participation from Square Peg Capital, Tiger Global, Barrenjoey, and SecondQuarter. Approximately US$122
              million of this transaction provided liquidity to early employees and seed backers, while long-tenured
              venture funds rebalanced mature vehicle allocations. At US$3.5 billion, Rokt trades at an implied multiple
              of 5.8x reported 2024 revenues. While unconfirmed market rumors have cited indicative term sheets at
              higher figures, broader secondary market tracking on platforms such as Forge Global demonstrates thin
              liquidity and limited matched transaction depth above the historical primary mark. Given general multiple
              compression across late-stage software assets, public evidence supports the US$3.5 billion valuation as
              fair but fully priced.
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV008
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: Scenario Analysis, Multiple Ranges, and Downside Triggers
        blocks:
          - type: paragraph
            body: >-
              Evaluating forward equity returns requires disaggregating enterprise multiple expectations across retail
              media networks and ad-tech platforms. Company leadership has targeted crossing a US$1 billion annualized
              revenue run-rate during late 2025, supported by the integration of its US$300 million mParticle customer
              data platform acquisition. In our base case, assuming Rokt achieves US$800 million in fiscal 2025 revenue
              with normalized EBITDA margins of 12% to 15%, a forward enterprise multiple of 4.5x to 5.5x yields an
              equity valuation range between US$3.6 billion and US$4.4 billion, delivering modest upside against current
              secondary entry prices. A bull case requires organic revenue acceleration beyond US$950 million with
              EBITDA margins expanding toward 20%, supporting a multiple re-rating to 7.0x to 8.0x revenue and an equity
              value of US$6.5 billion to US$7.5 billion. Conversely, our bear case models deceleration toward 15% to 20%
              annual growth, compressed net margins below 8% under partner contract renegotiation, and broader ad-tech
              peer multiple compression, yielding a downside valuation range of US$1.8 billion to US$2.1 billion.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV012
      - number: '8.4'
        title: Decision Logic and Recommendation Framework
        blocks:
          - type: paragraph
            body: >-
              The synthesis connecting operational scale to our final investment stance follows a clear analytical
              chain. Commercial adoption is well documented, with over 7.5 billion network transactions powered in 2025
              and 3,000 active retail partners verifying product utility. Strategic expansion via the acquisitions of
              mParticle and Canal has deepened first-party data capture within checkout flows. However, this business
              momentum is counterbalanced by structural risks. Private reporting conceals vital balance-sheet
              fundamentals, gross profit retention, customer concentration, and advertiser retention cohorts.
              Additionally, governance and cultural friction—including ongoing employment arbitration and Australian
              Workplace Gender Equality Agency disclosures—introduce reputational and execution overhangs. Because
              current secondary pricing of US$3.5 billion leaves little margin of safety if partner take-rates compress
              or market multiples contract, institutional allocators should maintain a Track discipline until
              comprehensive S-1 registration statements are filed ahead of the targeted 2026 Nasdaq listing.
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV010
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV010
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: Exit Readiness, Governance, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Rokt has taken concrete operational steps to prepare for a public market debut, establishing seasoned
              governance by appointing prominent non-executive directors including Anita Sands and Datadog Chief
              Financial Officer David Obstler to chair its audit committee. An initial public offering on the Nasdaq
              exchange remains targeted for 2026, serving as the essential liquidity vehicle for employee option pools
              that have received roughly 27% of lifetime equity allocations. Before capital can be committed with high
              conviction, critical diligence hurdles must be cleared. Key requirements include reviewing audited
              multi-year GAAP income statements to verify net revenue accounting, auditing partner take-rate contracts
              to ensure long-term exclusivity, inspecting cap-table liquidation preference seniority across Series A
              through E shares, and assessing the resolution of ongoing former-employee arbitration claims. Thesis-break
              triggers that would compel an immediate Avoid downgrade include any down-round secondary pricing below
              US$2.5 billion, adverse litigation rulings, or the loss of cornerstone enterprise checkout inventory.
            claimRefs:
              - CV007
              - CV009
              - CV010
              - CV014
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Underwriting Stance: Track Pending IPO-Ready Audit Disclosures'
            body: >-
              Public evidence confirms Rokt's strong topline momentum, reaching US$600 million in 2024 revenue with over
              40% annual growth, and its validated transaction-moment scale across enterprise commerce leaders. However,
              private-market opacity around true gross margin contribution, take-rate sustainability, and preference
              overhang necessitates a disciplined Track stance rather than an unhedged Buy at the US$3.5 billion mark.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV012
              - CV013
          - type: callout
            title: Secondary Valuation Disconnect and Governance Overhang
            body: >-
              While select secondary sales in January 2025 cleared at a US$3.5 billion valuation, public secondary
              platforms such as Forge Global indicate constrained liquidity with no actively matched trades above the
              2021 Series E price. Compounded by workplace gender pay gap reporting, executive turnover, and ongoing
              employment arbitration, governance risks remain elevated heading into a targeted 2026 listing.
            calloutType: risk
            claimRefs:
              - CV002
              - CV008
              - CV009
              - CV010
