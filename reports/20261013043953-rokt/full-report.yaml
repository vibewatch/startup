      - number: '5.3'
        title: Data Governance, Network Privacy, and Compliance Infrastructure
        blocks:
          - type: paragraph
            body: >-
              Operating across enterprise ecommerce checkout moments requires robust data governance and regulatory
              compliance controls. Rokt positions Rokt Ads as a closed-network performance marketing channel running
              exclusively on first-party transaction signals rather than third-party tracking cookies or open ad
              exchanges. The company implements a strict data governance framework, enforcing a declared policy that
              merchant partner data is never shared, sold, or pooled across external network tenants. Merchants retain
              granular inventory governance controls to specify category exclusions, competitor blacklists, and
              placement opt-outs. From a security and regulatory perspective, Rokt maintains compliance with SOC 2 Type
              II, ISO 27001, GDPR, and CCPA standards, operating on an enterprise availability target of 99.9 percent
              uptime with automated tools enabling consumers to inspect and unwind data consent.
            claimRefs:
              - CE003
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Technical Dependencies, Latency Risks, and Diligence Deficiencies
        blocks:
          - type: paragraph
            body: >-
              Despite robust commercial scale, Rokt's architectural surface exhibits distinct technical dependencies and
              diligence deficits. Because the SDK and API hooks operate directly within high-intent checkout paths, any
              network latency spike or client-side JavaScript execution failure creates severe cart abandonment risks
              for host merchants. Furthermore, public developer telemetry, open-source repositories, and independent API
              latency benchmarks remain effectively unavailable, reflecting Rokt's reliance on proprietary closed-source
              SDKs and enterprise integrations. Diligence underwriters cannot independently verify production inference
              latency distributions, model drift frequencies, or client-side page load overhead from public artifacts.
              These unverified performance characteristics, alongside reliance on host platform extensibility frameworks
              such as Shopify checkout APIs, represent material technical risks requiring direct production SLA and
              telemetry verification.
            claimRefs:
              - CE006
              - CE011
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Zero-Impression Quality Reserve Fallback
            body: >-
              A pivotal architectural safeguard in the Rokt Brain is its strict reserve quality threshold: when
              candidate advertiser or upsell offers fail to meet high predicted relevance or engagement scores, the
              inference engine chooses to render nothing at all. This design prioritizes core merchant checkout
              completion over short-term ad impression monetization, mitigating checkout abandonment.
            calloutType: insight
            claimRefs:
              - CE007
              - CE008
          - type: callout
            title: Client-Side Dependency and Latency Headwinds
            body: >-
              Because Rokt's components execute directly within high-intent checkout and confirmation steps, any network
              latency spike or client-side script contention threatens merchant conversion rates. While Rokt maintains
              low-latency inference budgets and 99.9% uptime, enterprise merchants face architectural exposure to
              browser script blockers and strict privacy sandbox constraints.
            calloutType: risk
            claimRefs:
              - CE006
              - CE011
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and buying centers
        blocks:
          - type: paragraph
            body: >-
              Rokt serves a two-sided transaction network rather than a single homogeneous customer cohort. Ecommerce
              businesses and commerce platforms provide checkout or post-purchase inventory and buy monetization,
              optimization, retention, or distributed-commerce capabilities; advertisers and product providers buy
              access to shoppers with confirmed purchase intent. The company also markets a catalogue of more than 1.2
              million third-party products from over 4,600 brands, widening the provider side beyond conventional
              advertisers. Named testimonials on Rokt's own solutions page identify partnership, digital-strategy,
              customer-experience, and advertising executives as stakeholders, which suggests procurement spans
              commercial, media, ecommerce, and product teams. This breadth creates multiple expansion surfaces, but the
              retained sources do not disclose revenue by segment, who signs or pays under each product, or whether any
              one platform contributes a disproportionate share of volume or gross profit. The segmentation is therefore
              operational rather than a verified revenue mix.
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU008
              - CU011
          - type: table
