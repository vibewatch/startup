  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Revenue & Growth Assumption
      - EBITDA Margin & Multiples
      - Valuation Range
      - Downside & Probability Signal
    rows:
      - - Bull Case (30% Probability)
        - Revenues cross US$950M in 2025 (>50% YoY growth); mParticle CDP drives enterprise expansion
        - EBITDA margin expands to 18-20%; trades at 7.0x-8.0x forward revenue
        - US$6.5B - US$7.5B
        - Requires flawless 2026 Nasdaq IPO window and zero top-partner churn
      - - Base Case (50% Probability)
        - Revenues achieve US$800M in 2025 (33% YoY growth); transaction volumes exceed 10B
        - EBITDA margin stabilizes at 12-15%; trades at 4.5x-5.5x forward revenue
        - US$3.6B - US$4.4B
        - Supported by current US$3.5B secondary baseline and steady enterprise renewal
      - - Bear Case (20% Probability)
        - Growth decelerates to 15-20% (US$700M); partner take-rates compress under merchant renegotiation
        - EBITDA margin compresses below 8%; trades at 2.5x-3.0x revenue (ad-tech multiple)
        - US$1.8B - US$2.1B
        - Triggered by IPO delay, adverse arbitration outcome, or broad ad-tech compression
    notes: >-
      Forward valuation scenarios projecting 2025-2026 performance based on retail media multiples and reported
      take-rate structures.
