  - id: FE001
    title: Rokt modular technology and decisioning architecture stack
    type: stack
    summary: >-
      Six-layer architectural stack connecting host merchant checkout moments to the real-time AI decisioning engine and
      closed advertiser network.
    approximationNotes: >-
      Logical architectural representation based on published developer documentation, technical overviews, and
      executive engineering disclosures.
    claimRefs:
      - CE006
      - CE007
      - CE008
      - CE010
    data:
      layers:
        - label: Client Integration Layer
          detail: >-
            Embedded merchant SDKs, REST APIs, and tag-based integration hooks operating natively in web and mobile
            checkout flows.
        - label: Transaction Moment Orchestration Layer
          detail: >-
            Event capture capturing discovery, cart review, payment, and order confirmation states to identify
            high-intent conversion moments.
        - label: Rokt Brain Real-Time ML Decisioning Engine
          detail: >-
            Low-latency inference engine utilizing semantic embeddings, longitudinal behavioral modeling, and minimum
            reserve quality thresholds.
        - label: Rokt mParticle Customer Data Platform
          detail: >-
            Hybrid real-time streaming and warehouse-native identity resolution engine unifying customer profiles,
            predicted LTV, and event signals.
        - label: Rokt Network & Closed Inventory Marketplace
          detail: >-
            Closed-loop marketplace matching merchant placement inventory with curated third-party performance
            advertisers and catalog products.
        - label: Governance, Security & Compliance Foundation
          detail: >-
            Granular partner opt-in/opt-out controls, SOC 2 Type II, ISO 27001, GDPR/CCPA enforcement, and automated
            consent unwinding.
  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      Rokt's public customer journey runs from merchant integration to transaction activation and multi-product
      expansion, with retention and concentration proof remaining private.
    data:
      nodes:
        - id: integration
          label: Integrate merchant or platform
          detail: Embed Rokt into checkout or post-purchase inventory.
          touchpoints:
            - Ecommerce and digital teams
            - Platform partnership teams
        - id: governance
          label: Configure inventory controls
          detail: Set offer, competitor, and brand-alignment rules.
          touchpoints:
            - Merchant controls
            - Quality thresholds
        - id: activation
          label: Activate transaction traffic
          detail: Apply first-party and contextual signals at purchase intent.
          touchpoints:
            - Checkout
            - Confirmation
        - id: outcome
          label: Optimize transaction outcome
          detail: Select an offer, product, message, or no placement.
          touchpoints:
            - Monetization
            - Acquisition
        - id: expansion
          label: Expand product footprint
          detail: Add loyalty, data, advertising, or distributed-commerce capabilities.
          touchpoints:
            - Additional modules
            - More transaction surfaces
        - id: renewal
          label: Prove durability
          detail: Renewal and concentration remain the least visible stages publicly.
          touchpoints:
            - Retention metrics
            - Contract and cohort evidence
    approximationNotes: >-
      The sequence is an analytical synthesis of documented product surfaces and land-and-expand descriptions; it is not
