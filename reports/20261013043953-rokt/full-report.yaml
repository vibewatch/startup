  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Spend Taxonomy, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              The transaction-moment commerce media market occupies a distinct structural boundary within digital
              advertising and ecommerce software. Unlike traditional digital advertising platforms such as Google and
              Meta that monetize pre-purchase user intent via search, social feeds, and top-of-funnel display auctions,
              transaction-moment platforms operate exclusively during the high-intent checkout and order confirmation
              phases. Included spend comprises closed-network performance marketing, merchant ancillary revenue
              placements, payment-method incentives, and distributed commerce add-ons embedded directly in confirmation
              workflows. Excluded spend includes traditional off-site retargeting banners, upper-funnel programmatic
              display, and core payment acquiring fees. In-house engineering rules and static confirmation coupons
              represent the primary status-quo substitutes, but enterprise merchants increasingly favor machine learning
              decisioning to dynamically rank offers without introducing checkout friction.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
      - number: '2.2'
        title: 'Market Sizing Lenses: TAM, SAM, and SOM Constraints'
        blocks:
          - type: paragraph
            body: >-
              Evaluating the market size for transaction-moment commerce media requires multiple constrained analytical
              lenses rather than a single broad estimate. At the macroeconomic ceiling, global ecommerce gross
              merchandise volume exceeds six trillion dollars annually, establishing an enormous transaction baseline.
              Analyst benchmarks from Sacra estimate Rokt achieved approximately $900 million in annualized revenue by
              October 2025 across an enterprise network spanning 3,000 partners, while company disclosures indicate
              network throughput reached 7.5 billion transactions in 2025 with projections exceeding 10 billion in 2026.
              Latka historical disclosures reflect a scalable $200 million underlying revenue base in 2021 with $90
              million in gross profit. Constraining broad commerce media spend down to the post-purchase transaction
              moment yields a realistic serviceable addressable market between $15 billion and $25 billion, governed by
              merchant take-rates and non-endemic advertiser appetite.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM009
              - CM010
      - number: '2.3'
        title: Buyer Segmentation, Workflow Integration, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              The transaction-moment marketplace exhibits a two-sided commercial structure uniting enterprise ecommerce
              merchants and non-endemic performance advertisers. On the supply side, enterprise retailers, ticketing
              marketplaces, and ride-hailing operators deploy Rokt's software development kit to unlock pure incremental
              profit from confirmation screens. Decision-makers include Chief Commercial Officers, VP of Ecommerce, and
              retail media network leads seeking margin expansion. On the demand side, customer acquisition teams and
              performance media buyers allocate growth budgets on a cost-per-referral or cost-per-acquisition basis,
              targeting high-intent consumers in an active shopping mindset. Commercial agreements operate largely on
              performance-based revenue sharing, where approximately 50 percent of gross advertising spend is disbursed
              to the merchant partner, while Rokt captures margin after data, hosting, and operational overhead.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and Diligence Risks
        blocks:
          - type: paragraph
            body: >-
              Adoption of transaction-moment monetization is propelled by systemic industry catalysts and
              counterbalanced by operational constraints. The depreciation of third-party tracking cookies has forced
              performance advertisers to seek authenticated, first-party customer environments, elevating closed-network
              checkout inventory to premium status. Furthermore, enterprise retailers facing compressed retail product
              margins prioritize ancillary revenue streams that flow directly to bottom-line profitability. Conversely,
              adoption is constrained by merchant apprehension regarding cart abandonment and brand erosion. Because the
              transaction moment represents the final critical leg of the purchase funnel, irrelevant or disruptive
              offers risk frustrating consumers. Consequently, merchants demand strict governance, closed-network data
              isolation, and algorithmic quality thresholds that withhold third-party offers whenever relevance criteria
              cannot be guaranteed.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Transaction Moment as Uncontested Real Estate
            body: >-
              While search and social giants dominate pre-purchase discovery, the transaction moment represents
              post-purchase real estate where consumer buying intent is verified, allowing Rokt to monetize without
              competing directly against Google and Meta auction pricing.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM008
          - type: callout
            title: Friction Sensitivity and Cart Abandonment Risk
            body: >-
              Because checkout remains the highest-intent yet most delicate stage of ecommerce conversion, merchants
              face structural friction risks if third-party offers distract shoppers, necessitating strict AI quality
              thresholds to avoid core conversion degradation.
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Categorization
        blocks:
          - type: paragraph
            body: >
              The competitive landscape surrounding Rokt spans checkout optimization technology, card-linked offer
              networks, enterprise retail media platforms, and internal merchant engineering teams. Point solutions in
              the checkout space historically focused on payment velocity rather than advertising monetization.
              Platforms such as Bolt and Fast sought to eliminate cart friction through one-click checkout mechanisms,
              charging software-as-a-service fees or payment processing markups. Conversely, Cardlytics operates within
              digital banking applications, leveraging financial institution transaction records to deliver cash-back
              offers rather than embedding natively within the e-commerce purchase flow. Beyond point solutions,
              enterprise commerce media networks enable retailers to build private advertising real estate, while
              machine learning ad tech platforms like Moloco provide bidding infrastructure for performance marketing.
              Rokt carves out a distinct position by operating directly on the confirmation and thank-you pages of
              high-volume merchants, treating the post-purchase moment as incremental revenue real estate powered by
              closed-network first-party data.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP009
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
      - number: '3.2'
        title: Capability Comparison and Transaction-Moment Differentiation
        blocks:
          - type: paragraph
            body: >
              Evaluating transaction-moment technologies requires balancing incremental merchant revenue against
              checkout conversion risk. Because checkout and order confirmation represent the highest-intent stages of
              the consumer journey, intrusive promotions risk increasing cart abandonment or creating merchant brand
              conflict. Rokt addresses this dynamic through machine-learning relevance scoring and partner inventory
              governance, providing granular opt-in and opt-out controls that ensure direct competitors never appear in
              a merchant's checkout experience. Furthermore, Rokt enforces a reserve quality threshold in its
              recommendation auctions; when candidate offers fail to meet strict relevance standards, the system
              suppresses display entirely to protect the user experience. Through its distributed commerce capabilities,
              Rokt enables customers to add third-party products directly into their cart in-flow rather than
              redirecting shoppers off-site. Independent technology commentary notes that targeted, highly contextual
              post-purchase recommendations simplify product discovery and reduce consumer decision fatigue during peak
              purchasing intent.
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP008
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP008
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP005
              - CP011
      - number: '3.3'
        title: Pricing Models, Commercial Packaging, and Partner Tradeoffs
        blocks:
          - type: paragraph
            body: >
              Commercial alignment between software providers and merchants diverges sharply across the transaction
              ecosystem. Traditional checkout platforms charge fixed monthly SaaS subscription fees or basis-point fees
              on gross merchandise volume, requiring merchants to treat checkout software as an operating expense. In
              contrast, Rokt operates as a two-sided marketplace on a performance-based revenue-share structure. Market
              analysis indicates that Rokt captures approximately fifty cents of every advertising dollar generated
              across its network, after which partner merchants receive incremental profit estimated between twenty-five
              and forty cents per transaction. For distributed commerce add-ons such as event parking or travel
              insurance, take-rates mirror payment merchant fees of roughly three percent. This performance-oriented
              model removes upfront software expenditure for enterprise merchants, aligning incentives around attach
              rate lift, although it exposes merchant revenue to macroeconomic advertising budget volatility.
            claimRefs:
              - CP002
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP010
      - number: '3.4'
        title: Moat Durability, Platform Encroachment, and Displacement Risks
        blocks:
          - type: paragraph
            body: >
              Rokt's competitive durability relies on network density, enterprise integration inertia, and two-sided
              liquidity across its catalog of over 1.2 million third-party products from 4,600 brands. High-volume
              merchants including Ticketmaster, Uber, and PayPal create scale barriers that discourage single-tenant
              in-house builds, which lack cross-merchant advertiser demand. Nevertheless, displacement risks remain a
              primary diligence consideration. Major digital advertising incumbents such as Google and Meta set auction
              pricing across pre-purchase discovery channels; should these platforms launch standardized
              post-transaction SDKs or browser-level commerce extensions, Rokt's distribution advantage could face
              compression. Additionally, enterprise merchants expanding proprietary retail media networks could
              prioritize first-party supplier promotions over third-party network ads. Public market capital allocators
              also encounter naming and screening ambiguity with the unrelated SPDR S&P Kensho Final Frontiers ETF
              trading under the ticker ROKT, reflecting the importance of distinguishing Rokt's private enterprise
              commerce footprint from public fund vehicles.
            claimRefs:
              - CP008
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Checkout Flow Protection vs. Ancillary Monetization
            body: >-
              Merchants face a core tradeoff between incremental advertising profit and checkout conversion integrity.
              Rokt addresses this through partner inventory controls and reserve quality thresholds where the system
              suppresses offers entirely if relevance criteria are unmet.
            calloutType: insight
            claimRefs:
              - CP004
              - CP006
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams & Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Rokt operates a multi-tiered monetization architecture centered around the post-purchase and checkout
              transaction moment across more than 3,000 enterprise ecommerce partners. The company's principal revenue
              engine is its checkout advertising network, which places relevant third-party offers and brand messages
              during order confirmation and cart review. In this primary advertising stream, Rokt functions on a
              performance basis where advertisers pay per referral or completed engagement. The model aligns partner
              incentives by returning the vast majority of generated value—nominally $7 of every $8 of gross transaction
              value—directly to the host merchant. Complementing this core network, Rokt has scaled distributed commerce
              through acquisitions such as Canal, allowing merchants to offer curated third-party inventory directly
              in-checkout for an approximate 3% interchange-style transaction fee. Software subscriptions and customer
              data platform infrastructure fees, expanded via the acquisition of mParticle, provide a recurring software
              layer, although transaction-based advertising remains the predominant top-line driver.
            claimRefs:
              - CI001
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
      - number: '4.2'
        title: Unit Economics, Take Rates & Cost Structure
        blocks:
          - type: paragraph
            body: >-
              A granular dissection of Rokt's core advertising unit economics reveals a high-volume marketplace with
              compressed net take-rate retention. Disclosures by leadership indicate that for every gross dollar spent
              by advertisers on the platform, 50 cents is distributed directly to the publisher merchant as a
              supply-side revenue share. An additional 43 cents is absorbed by service delivery, data acquisition,
              real-time machine learning infrastructure, and enterprise go-to-market costs. Consequently, Rokt retains
              approximately 7 cents per dollar as net company gross profit. While distributed commerce generates an
              additive take rate of approximately 3% on third-party merchandise sales without inventory holding risk,
              the blended model requires massive transaction throughput to support corporate overhead. Rokt commits more
              than $100 million annually to research and development to sustain sub-200 millisecond decisioning and
              model retraining, creating significant fixed capital absorption that demands sustained double-digit
              network expansion.
            claimRefs:
              - CI005
              - CI007
              - CI014
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI005
              - CI007
              - CI014
      - number: '4.3'
        title: Commercial Traction, Valuation & Capital Adequacy
        blocks:
          - type: paragraph
            body: >-
              Public and secondary market indicators demonstrate considerable commercial acceleration across Rokt's
              footprint. The company reported revenue expanding from $600 million in 2024 to more than $800 million in
              2025, representing greater than 40% year-over-year top-line growth. Network throughput scaled from 7.5
              billion transactions in 2025 toward a projected 10 billion transactions in 2026. Private market benchmarks
              from Sacra estimated an annualized revenue run rate of $900 million by late 2025 with approximately $100
              million in EBITDA. On the balance sheet, FundedIQ records $405 million in cumulative equity funding across
              three disclosed primary rounds, while a $335 million secondary transaction in January 2025 established a
              $3.5 billion valuation. Rokt states that it operates with zero long-term corporate debt, providing
              substantial balance sheet resilience ahead of potential public listing milestones, though lack of public
              filings leaves actual unrestricted cash reserves unverified.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI005
              - CI006
              - CI014
      - number: '4.4'
        title: Financial Verdict & Diligence Underwriting Blockers
        blocks:
          - type: paragraph
            body: >-
              From an institutional underwriting perspective, Rokt exhibits compelling revenue scale, rapid organic and
              acquisitive growth, and balance-sheet solvency unencumbered by debt service. However, serious underwriting
              blockers prevent a definitive conviction call. The company's 7% retained gross profit margin makes
              financial performance highly sensitive to advertising cycle fluctuations; during macro contractions,
              consumer transaction volume and digital marketing budgets decline in tandem. Furthermore, cross-sell
              placements risk partner brand equity if offer quality deteriorates or checkout distraction drives cart
              abandonment. Most crucially, because Rokt remains a private entity, critical underwriting
              fundamentals—including audited GAAP financial statements, net revenue retention rates, customer
              concentration metrics, and precise cash burn figures—remain inaccessible private data that must be
              formally requested and audited during confirmatory due diligence.
            claimRefs:
              - CI003
              - CI009
              - CI012
              - CI013
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: High Operating Scale With Debt-Free Balance Sheet
            body: >-
              Rokt has demonstrated rapid top-line expansion, growing revenue from $600M in 2024 to over $800M in 2025
              while powering over 7.5 billion transactions. The company maintains an estimated $3.5 billion private
              valuation with zero reported debt obligations.
            calloutType: strength
            claimRefs:
              - CI001
              - CI002
              - CI009
          - type: callout
            title: Thin Net Margin Buffer and High Cyclical Sensitivity
            body: >-
              Rokt's performance advertising engine retains an estimated 7 cents of net gross profit on the dollar after
              partner splits and operating infrastructure costs. This thin net margin leaves the business vulnerable to
              macro downturns when consumer transaction volume and advertiser budgets contract.
            calloutType: risk
            claimRefs:
              - CI005
              - CI012
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Transaction Moment Architecture
        blocks:
          - type: paragraph
            body: >-
              Rokt organizes its product offering around the Transaction Moment, defining it as the customer journey
              through product discovery, cart review, payment processing, and post-purchase confirmation. The company
              segments its commercial capabilities into three core product lines: Rokt Ecommerce, Rokt Ads, and Rokt
              mParticle. Rokt Ecommerce deploys native front-end modules within the merchant's purchase flow, including
              Rokt Catalog for non-inventory third-party product discovery, Rokt Upcart for in-cart recommendations,
              Rokt Pay+ for payment-page incentives, and Rokt Thanks for post-purchase confirmation offers. Through its
              2024 acquisition of Aftersell, Rokt extended these in-cart and post-purchase upsell capabilities to SMB
              and mid-market merchants on Shopify. Rather than routing shoppers off-site via traditional advertising
              hyperlinks, Rokt's distributed commerce architecture facilitates in-flow add-to-cart actions, preserving
              conversion continuity across partner transactions.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE009
      - number: '5.2'
        title: Technology Stack and the Rokt Brain Decisioning Engine
        blocks:
          - type: paragraph
            body: >-
              The technological cornerstone of Rokt's platform is the Rokt Brain, a proprietary machine learning and
              real-time decisioning infrastructure engineered to select the single highest-value action for each
              customer within strict latency budgets. Operating at scale across more than 7.5 billion transactions
              annually, the Rokt Brain utilizes semantic embeddings and longitudinal behavioral modeling—incorporating
              cart history, abandoned items, and explored product catalogs—to estimate individual customer conversion
              intent. A critical operational safeguard of the decisioning loop is Rokt's minimum reserve quality
              threshold: when auction candidates cannot surpass stringent predicted relevance and engagement baselines,
              the engine suppresses placements entirely, displaying zero offers to avoid disrupting checkout completion.
              Acquired in 2025, Rokt mParticle functions as the customer data platform layer, utilizing a hybrid
              streaming and warehouse-native architecture to resolve customer identities and pipe persistent audience
              profiles directly into the inference cluster.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
