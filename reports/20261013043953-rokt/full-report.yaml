      - number: '6.2'
        title: Adoption trajectory and named customer proof
        blocks:
          - type: paragraph
            body: >-
              The clearest adoption signal is transaction throughput: Rokt said its network powered more than 7.5
              billion transactions in 2025 across thousands of ecommerce businesses and forecast more than 10 billion
              for 2026. Sacra separately estimates roughly 3,000 ecommerce partners, but that figure is not a company
              filing and its active, paying, and integrated denominators are not defined. Reference quality varies. The
              Silicon Review reported that Fanatics returned to the network after trying alternatives and that Cineplex
              integrated Rokt into checkout, while Rokt publishes attributed testimonials from PayPal Ads, Cinemark,
              Petco, and Mindbody. These examples are more probative than an undifferentiated logo wall, yet most lack
              deployment dates, controlled outcome data, contract terms, or a clear pilot-versus-production label. The
              advertised uplifts of up to 25% for in-cart revenue and up to 30% for post-purchase revenue are company
              claims, not customer-specific independently verified outcomes, so they should not be used as
              portfolio-wide realized returns.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
