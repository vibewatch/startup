figures:
  - id: FO001
    title: Rokt Growth and Financing Milestones (2012-2026)
    type: timeline
    summary: >-
      Timeline of major financing rounds, geographic expansions, acquisitions, and scaling milestones from founding to
      secondary valuation.
    data:
      items:
        - date: '2012'
          label: Founding & Rocklive Acquisition
          detail: >-
            Justin Viles and Bruce Buchanan found Rokt in Sydney, acquiring Rocklive to transform ecommerce transaction
            moments.
          tone: positive
        - date: '2013'
          label: Series A & Regional Expansion
          detail: Raised $8M Series A and expanded into Melbourne, Singapore, and New Zealand.
          tone: positive
        - date: 2014-2015
          label: US & European Entry
          detail: >-
            Opened New York headquarters (2014), expanded to London (2015), and launched landmark integration with
            Ticketmaster.
          tone: positive
        - date: 2019-2020
          label: Series C & D Expansion
          detail: >-
            Raised $48M Series C (2019) and $80M Series D (2020) while acquiring OfferLogic to expand retail and B2B
            footprint.
          tone: positive
        - date: '2020'
          label: COVID-19 Vertical Shock
          detail: >-
            Ticketing entertainment volume fell 97% and travel fell 60-70%, temporarily reducing revenue by 65% before
            retail surge.
          tone: negative
        - date: '2021'
          label: Series E Financing ($325M)
          detail: Closed $325M Series E round at a $1.9B valuation (subsequently reaching $2.4B in 2022).
          tone: positive
        - date: 2024-2025
          label: Major Strategic Acquisitions
          detail: >-
            Acquired Aftersell (2024), mParticle ($300M CDP acquisition in early 2025), and Canal (July 2025) for
            distributed commerce catalog.
          tone: positive
        - date: 2025-2026
          label: $3.5B Secondary Valuation & Scale
          detail: >-
            Completed $335M secondary round at $3.5B valuation, powered 7.5B+ transactions, and announced Brain v4
            engine.
          tone: positive
    approximationNotes: Milestone dates and round sizes compiled from corporate announcements, SEC-filing summaries, and market databases.
