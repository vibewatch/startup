      - number: '6.3'
        title: Durability, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports an expansion mechanism but not a current retention rate. Sacra describes a
              land-and-expand model that begins with checkout optimization and broadens into advertising, loyalty,
              customer-data infrastructure, and distributed commerce. GetLatka's account of a 2021 management interview
              reported that roughly half of underlying growth came from existing-client expansion and that ecommerce
              supply-side churn was net negative, but the observation is historical and cannot substitute for current
              NRR, GRR, logo churn, or cohort data. Merchant durability also depends on preserving core conversion and
              customer trust. Sacra warns that tighter privacy regulation or negative consumer sentiment could reduce
              merchants' willingness to integrate Rokt, and Enterprise Times says future use cases are still needed to
              demonstrate effectiveness. The retained public record does not reveal contract length, renewal schedules,
              switching costs, top-customer revenue, top-platform volume, or advertiser repeat spend. Those omissions
              prevent a confident conclusion about concentration or recurring durability despite credible scale and
              named adoption.
            claimRefs:
              - CU012
