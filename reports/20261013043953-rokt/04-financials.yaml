chapter:
  number: 4
  title: "Financials"
  summary: "Rokt has scaled reported revenues past $800 million on 10 billion annual transactions with zero debt, but operates on a thin 7% retained take rate after partner rev-share and delivery costs, while key audit and retention metrics remain undisclosed."
sections:
  - id: "revenue-streams-and-pricing-model"
    title: "Revenue Streams & Pricing Architecture"
    body: "Rokt operates a multi-tiered monetization architecture centered around the post-purchase and checkout transaction moment across more than 3,000 enterprise ecommerce partners. The company's principal revenue engine is its checkout advertising network, which places relevant third-party offers and brand messages during order confirmation and cart review. In this primary advertising stream, Rokt functions on a performance basis where advertisers pay per referral or completed engagement. The model aligns partner incentives by returning the vast majority of generated value—nominally $7 of every $8 of gross transaction value—directly to the host merchant. Complementing this core network, Rokt has scaled distributed commerce through acquisitions such as Canal, allowing merchants to offer curated third-party inventory directly in-checkout for an approximate 3% interchange-style transaction fee. Software subscriptions and customer data platform infrastructure fees, expanded via the acquisition of mParticle, provide a recurring software layer, although transaction-based advertising remains the predominant top-line driver."
    claimRefs:
      - "CI001"
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI008"
    tableRefs:
      - "TI001"
      - "TI002"
  - id: "unit-economics-and-cost-structure"
    title: "Unit Economics, Take Rates & Cost Structure"
    body: "A granular dissection of Rokt's core advertising unit economics reveals a high-volume marketplace with compressed net take-rate retention. Disclosures by leadership indicate that for every gross dollar spent by advertisers on the platform, 50 cents is distributed directly to the publisher merchant as a supply-side revenue share. An additional 43 cents is absorbed by service delivery, data acquisition, real-time machine learning infrastructure, and enterprise go-to-market costs. Consequently, Rokt retains approximately 7 cents per dollar as net company gross profit. While distributed commerce generates an additive take rate of approximately 3% on third-party merchandise sales without inventory holding risk, the blended model requires massive transaction throughput to support corporate overhead. Rokt commits more than $100 million annually to research and development to sustain sub-200 millisecond decisioning and model retraining, creating significant fixed capital absorption that demands sustained double-digit network expansion."
    claimRefs:
      - "CI005"
      - "CI007"
      - "CI014"
    figureRefs:
      - "FI001"
  - id: "scale-metrics-and-capital-adequacy"
    title: "Commercial Traction, Valuation & Capital Adequacy"
    body: "Public and secondary market indicators demonstrate considerable commercial acceleration across Rokt's footprint. The company reported revenue expanding from $600 million in 2024 to more than $800 million in 2025, representing greater than 40% year-over-year top-line growth. Network throughput scaled from 7.5 billion transactions in 2025 toward a projected 10 billion transactions in 2026. Private market benchmarks from Sacra estimated an annualized revenue run rate of $900 million by late 2025 with approximately $100 million in EBITDA. On the balance sheet, FundedIQ records $405 million in cumulative equity funding across three disclosed primary rounds, while a $335 million secondary transaction in January 2025 established a $3.5 billion valuation. Rokt states that it operates with zero long-term corporate debt, providing substantial balance sheet resilience ahead of potential public listing milestones, though lack of public filings leaves actual unrestricted cash reserves unverified."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI009"
      - "CI010"
      - "CI011"
    tableRefs:
      - "TI003"
  - id: "financial-verdict-and-diligence-blockers"
    title: "Financial Verdict & Diligence Underwriting Blockers"
    body: "From an institutional underwriting perspective, Rokt exhibits compelling revenue scale, rapid organic and acquisitive growth, and balance-sheet solvency unencumbered by debt service. However, serious underwriting blockers prevent a definitive conviction call. The company's 7% retained gross profit margin makes financial performance highly sensitive to advertising cycle fluctuations; during macro contractions, consumer transaction volume and digital marketing budgets decline in tandem. Furthermore, cross-sell placements risk partner brand equity if offer quality deteriorates or checkout distraction drives cart abandonment. Most crucially, because Rokt remains a private entity, critical underwriting fundamentals—including audited GAAP financial statements, net revenue retention rates, customer concentration metrics, and precise cash burn figures—remain inaccessible private data that must be formally requested and audited during confirmatory due diligence."
    claimRefs:
      - "CI003"
      - "CI009"
      - "CI012"
      - "CI013"
