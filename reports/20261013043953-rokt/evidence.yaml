evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >-
      Audited GAAP financial statements covering FY2023-FY2025, including gross margin, EBITDA, net income, and cash
      flow.
    whyItMatters: >-
      Essential to underwrite profitability, gross margin retention, and unit economics ahead of an IPO or secondary
      transaction.
    diligencePath: Request audited financial disclosure packets and management accounts under NDA.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: governance
    missingEvidence: Complete board of directors roster, voting agreements, and committee charter memberships.
    whyItMatters: Determines shareholder governance rights, dual-class share structures, and key-person controls.
    diligencePath: Review pre-IPO registration draft statements and corporate registry filings in Singapore and Delaware.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: cap-table
    missingEvidence: >-
      Full capitalization table detailing exact ownership percentages, liquidation preferences, and employee option pool
      size.
    whyItMatters: Necessary to evaluate dilution risk, payout waterfalls, and secondary seller discount dynamics.
    diligencePath: Obtain fully diluted cap table and investor rights agreement from company treasury.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Audited breakdown of transaction-moment TAM versus broad retail media spend, reconciling private secondary
      valuations with public ad-tech multiples.
    whyItMatters: >-
      Broad commerce media TAM figures often inflate Rokt's immediate addressable market by conflating sponsored search
      with post-purchase transaction monetization.
    diligencePath: >-
      Review S-1 registration statement disclosures or audited financial reports detailing gross merchandise volume,
      take rates, and vertical concentration.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: adoption-constraints
    missingEvidence: >-
      Empirical third-party benchmark data measuring cart abandonment rates across varying levels of in-checkout
      third-party offer density.
    whyItMatters: >-
      Validates merchant claims that real-time AI filtering prevents conversion degradation during the transaction
      moment.
    diligencePath: >-
      Request merchant-partner A/B test telemetry and SDK placement abandonment metrics across retail and ticketing
      cohorts.
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: Competitor Contract Terms and Margin Structures
    missingEvidence: >-
      Audited merchant contract take-rates, revenue-share splits, and net take-rate realization across private checkout
      optimization competitors.
    whyItMatters: >-
      Direct comparisons rely on public company disclosures and analyst estimates; private competitors like Bolt do not
      disclose realized take-rate or merchant churn metrics.
    diligencePath: >-
      Request redacted enterprise customer contracts and bilateral partner agreement summaries during management
      meetings.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: >-
      Audited GAAP/IFRS financial statements, audited gross margins, cash balances, and segment revenue breakdowns for
      2024 through 2026.
    whyItMatters: >-
      Private disclosures provide high-level revenue run rates and illustrative unit economics, but lack verified cash
      burn, working capital requirements, and balance-sheet liquidity essential for institutional underwriting.
    diligencePath: >-
      Request audited financial statements, board-approved P&L, and verified bank statements during confirmatory
      diligence under non-disclosure agreement.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Independent public developer telemetry, open-source repository benchmarks, and third-party engineering audit logs
      evaluating Rokt SDK client-side performance.
    whyItMatters: >-
      Client-side checkout script latency directly impacts merchant cart conversion, and absence of public developer
      signals obscures technical integration friction.
    diligencePath: >-
      Request production synthetic monitoring traces, merchant-side Core Web Vitals impact reports, and third-party
      penetration and code audit certifications under NDA.
    relatedQuestionRefs:
      - QE004
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: >-
      Current NRR, GRR, logo churn, gross churn, renewals, contract terms, and cohort expansion by product and customer
      segment.
    whyItMatters: Historical expansion anecdotes cannot establish present customer durability or recurring economics.
    diligencePath: >-
      Request monthly customer cohorts, renewal schedules, churn bridges, and NRR and GRR calculations reconciled to
      billed revenue for 2024-2026.
    relatedQuestionRefs:
      - QU005
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: Top-10 customer and platform shares of revenue, gross profit, transaction volume, and advertiser spend.
    whyItMatters: A large network can still carry material counterparty concentration and platform bargaining risk.
    diligencePath: >-
      Obtain anonymized concentration schedules by merchant, platform, advertiser, geography, and product for the last
      eight quarters.
    relatedQuestionRefs:
      - QU007
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table
    missingEvidence: >-
      A complete customer roster with production status, deployment date, products used, renewal date, and realized
      customer-specific outcomes.
    whyItMatters: >-
      Selected testimonials and announcements cannot establish deployment breadth, conversion from pilot, or
      representative customer value.
    diligencePath: >-
      Reconcile CRM and billing exports to the public reference list, then sample contracts and outcome studies across
      the largest customer cohorts.
    relatedQuestionRefs:
      - QU003
      - QU009
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: customer-outcomes
    missingEvidence: >-
      Independent methodology and customer-level distributions behind the up-to-25% in-cart and up-to-30% post-purchase
      revenue claims.
    whyItMatters: Maximum claims without baselines, samples, or distributions do not establish typical merchant ROI.
    diligencePath: >-
      Request experiment designs, holdout results, confidence intervals, merchant-level distributions, and references
      willing to validate realized outcomes.
    relatedQuestionRefs:
      - QU004
      - QU008
  - type: private-evidence-only
    severity: material
    topic: operational-resilience
    missingEvidence: Audited SOC 2 Type II reports, real-time status page historical uptime, and third-party penetration test reports.
    whyItMatters: Without independent audits, checkout latency spikes and outage risk cannot be verified independently.
    diligencePath: Request unredacted SOC 2 Type II compliance reports and multi-region disaster recovery runbooks in IPO data room.
    relatedQuestionRefs:
      - QR009
  - type: missing-source
    severity: material
    topic: partner-concentration
    missingEvidence: Audited breakdown of top-10 partner revenue concentration and contract renewal terms across enterprise merchants.
    whyItMatters: >-
      High reliance on key retailers like Live Nation, PayPal, and Uber leaves Rokt vulnerable to partner
      de-integration.
    diligencePath: Review top customer cohort disclosures and enterprise merchant contract durations during commercial diligence.
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-audited-financials
    missingEvidence: >-
      Audited GAAP financial statements covering FY2023-FY2025, detailed gross profit margin breakdowns, customer
      retention cohorts, and complete cap-table liquidation preferences.
    whyItMatters: >-
      Without audited gross margin and preference stack disclosures, private-equity secondary marks cannot be rigorously
      underwritten against public market multiple compression risks.
    diligencePath: >-
      Obtain pre-IPO S-1 registration draft, audited balance sheet and cash flow statements, and secondary shareholder
      purchase agreement terms during formal pre-IPO diligence.
    relatedQuestionRefs:
      - QV009
