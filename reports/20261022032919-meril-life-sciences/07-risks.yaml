  - id: TR001
    title: Regulatory / legal risk register
    columns: [Risk, Jurisdiction or scope, Likelihood, Severity, Mitigation maturity, Residual exposure, Diligence path]
    rows:
      - [Pricing controls and device approvals, India and export markets, Ongoing, High, Partial - existing approvals and compliance infrastructure, "Price caps and approval timing remain outside management control", "Obtain a current product-by-product price-cap, approval, renewal, and compliance matrix"]
      - [Myval patent proceedings, United States and certain European countries, Active in some geographies, High, Partial - favorable U.S. safe-harbor outcome and active defense, "Other jurisdictions, remedies, and settlement economics remain unresolved", "Obtain every docket, injunction, royalty claim, settlement range, and affected-revenue schedule"]
      - [Faulty-device liability or recall, All implanted and diagnostic device families, Not quantified publicly, Critical, Partial - product-liability insurance reported by ICRA, "Insurance does not remove recall, remediation, approval, or reputation exposure", "Review adverse-event, complaint, recall, audit, and insurance-coverage histories by device family"]
    notes: "Severity reflects the financial or patient-impact channels disclosed by ICRA and the retained legal analyses; likelihood is shown as ongoing, active, or unquantified rather than as an unsupported probability."
    enumerationScope:
      coverage: partial
      basis: "Publicly disclosed regulatory, patent, and product-liability risks in the assigned October 2026 evidence pool"
    claimRefs: [CR005, CR006, CR007, CR008, CR009, CR010]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Inventory and receivables absorb cash, Existing condition, High, Partial - growth and available liquidity provide capacity, "NWC/OI and inventory days remain elevated", "Monthly aging, SKU turns, distributor credit, write-offs, and customer collections"]
      - [Expansion facilities ramp below plan, Forward monitorable, High, Partial - capex program and primary equity infusion are funded or available, "Debt and underutilized capacity could pressure returns", "Commissioning dates, utilization, yield, and incremental contribution margin by facility"]
      - [Device-quality or approval failure, Not quantified publicly, Critical, Partial - approvals and liability insurance cover only part of the exposure, "Recall, remediation, and reputation effects remain possible", "Approval pipeline, deviations, recalls, complaints, and audit findings by device family"]
      - [Portfolio complexity weakens controls, Existing operating complexity, Medium, Partial - in-house manufacturing and broad product infrastructure, "Cross-product quality and documentation performance are not disclosed", "Quality-system KPIs, supplier exceptions, cybersecurity controls, and CAPA closure aging"]
    notes: "No assigned source provides a complete incident, recall, cybersecurity, or product-quality history; the missing records are diligence gaps and are not evidence that no event occurred."
    claimRefs: [CR002, CR003, CR004, CR008, CR013, CR015]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Concentration or exposure, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Export markets and foreign exchange, International customers and subsidiaries, About 61% of FY2025 consolidated revenue from exports, Currency or market disruption reduces realized profitability, High, Geographic diversification and established overseas presence, "Country and product contribution and hedge effectiveness are not disclosed"]
      - [Dealers and distributors, Channel partners, Extended credit and multi-geography stocking, Receivables stretch or channel inventory becomes obsolete, High, Broad channel footprint and product-availability strategy, "Distributor concentration, termination rights, and sell-through are unverified"]
      - [Expansion capital, ADIA and debt providers, Rs. 860 crore primary infusion in H1 FY2026 plus incremental term-debt plans, Funding cost or covenants constrain expansion, Medium, Primary proceeds were reported in bank fixed deposits and ICRA rated liquidity adequate, "Use restrictions, preference rights, covenants, and future funding needs require review"]
      - [Myval franchise, Cardiovascular customers and legal counterparties, Export-heavy product with continuing proceedings in some geographies, Ruling or restriction reduces revenue or raises settlement costs, High, Favorable rulings in some countries and continuing legal defense, "Affected revenue, margin, inventory, and substitute-product capacity are not quantified"]
    notes: "The table separates consolidated export exposure, channel-credit dependence, expansion funding, and Myval-specific legal exposure; reported values retain ICRA's periods and denominators."
    claimRefs: [CR002, CR003, CR004, CR010, CR011, CR012, CR014]
