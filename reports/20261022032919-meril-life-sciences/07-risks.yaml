  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: "Customer and distributor concentration, sell-through, realized pricing, and product-level revenue exposure."
      whyItMatters: "A broad country and channel footprint does not show whether a small number of accounts or distributors control cash conversion."
      diligencePath: "Request FY2025-FY2026 customer and distributor cohorts, top-10 concentration, contract terms, sell-through, and receivable aging."
      relatedQuestionRefs: [QR006]
      relatedTableRefs: [TR003]
    - type: enumeration-incomplete
      severity: material
      topic: regulatory-risk-register
      missingEvidence: "A complete inventory of legal, regulatory, recall, and product-liability matters across all jurisdictions and device families."
      whyItMatters: "The public pool contains selected disclosures rather than an exhaustive register, so the severity ordering may omit a matter."
      diligencePath: "Request a management-certified legal and regulatory schedule with matter status, maximum exposure, affected products, and accountable owner."
      relatedQuestionRefs: [QR003, QR004]
      relatedTableRefs: [TR001]
    - type: missing-source
      severity: material
      topic: product-quality
      missingEvidence: "Recall, adverse-event, complaint, cybersecurity, audit, and quality-deviation history by device family."
      whyItMatters: "Medical-liability and regulatory risk can be nonlinear, and insurance or product-page claims do not establish historical performance."
      diligencePath: "Obtain the quality-management dashboard, complaint and recall register, cybersecurity incident log, audit findings, CAPA aging, and claims history."
      relatedQuestionRefs: [QR005, QR009]
      relatedTableRefs: [TR002]
    - type: private-evidence-only
      severity: material
      topic: cash-conversion
      missingEvidence: "Facility-level returns, monthly working-capital bridge, debt covenants, and the use of primary investment proceeds."
      whyItMatters: "Revenue growth and adequate reported liquidity do not prove that expansion will produce free cash flow."
      diligencePath: "Request a monthly FY2025-FY2027 cash-flow bridge, covenant model, capex schedule, commissioning evidence, and utilization by facility."
      relatedQuestionRefs: [QR001, QR002, QR008]
      relatedTableRefs: [TR002, TR003]
