    title: Risk heatmap
    summary: Current cash-intensity risk and forward legal, regulatory, and capacity-ramp risks carry the largest disclosed downside.
    type: matrix
    data:
      columns: [Low residual impact, Medium residual impact, High residual impact]
      rows:
