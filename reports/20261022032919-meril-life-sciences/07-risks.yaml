        - label: Myval patent proceedings
          values: [null, null, "Active in some geographies"]
        - label: Pricing and approval restrictions
          values: [null, null, "Recurring exposure"]
        - label: Export and foreign-exchange movement
          values: [null, "Current exposure", null]
        - label: Faulty-device liability or recall
          values: [null, null, "Likelihood unquantified"]
    approximationNotes: "Residual-impact placement is a qualitative synthesis of disclosed impact channels; status labels distinguish current, active, monitorable, recurring, and unquantified exposures without assigning calibrated probabilities."
    claimRefs: [CR002, CR003, CR005, CR007, CR008, CR010, CR011, CR015]
callouts:
  - calloutType: risk
    title: Primary thesis-break combination
    body: A material adverse Myval ruling or settlement combined with weaker cash conversion or delayed capacity ramp-up would challenge both revenue durability and expansion economics.
    claimRefs: [CR002, CR003, CR010, CR014]
  - calloutType: assumption
    title: Public-evidence boundary
    body: Customer and distributor concentration, recall history, cybersecurity incidents, product-level legal exposure, and facility-level cash returns are not established by the assigned public evidence.
    claimRefs: [CR012, CR015]
