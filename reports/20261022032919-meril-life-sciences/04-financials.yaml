company:
  name: Meril Life Sciences
chapter:
  number: 4
  title: Financials
  summary: Meril combines rapid reported growth, improving operating profitability and substantial export reach with unusually high working-capital intensity, litigation costs and continuing debt-funded capacity investment. Public evidence supports a financially scaled platform, but does not disclose realized pricing, product-level margins, customer concentration, burn or a reliable runway calculation.
sections:
  - id: revenue-quality
    title: Revenue quality and monetization
    body: >-
      ICRA's December 2025 consolidated review reports operating income of Rs. 4,902.9 crore in FY2025,
      up from Rs. 3,494.7 crore in FY2024. It describes a diversified mix led by vascular products at
      about 35% of group revenue and orthopaedics at about 30%, with the remainder from diagnostics,
      endo-surgery and the standalone entity. The same review reports that exports contributed about
      61% of group revenue and products were sold in more than 150 countries; Meril's own undated blog
      separately claims a footprint above 100 countries. For the narrower Meril Life Sciences Private
      Limited perimeter, ICRA reports 84% export revenue, so the percentages are not interchangeable.
      A Meril-issued clinical release supports Myval's product relevance, but does not establish sales or
      long-term durability. This is evidence of scale and reach, not ARR or recurring revenue.
    claimRefs: [CI001, CI003, CI004, CI006, CI011]
    tableRefs: [TI001, TI002]
  - id: margin-and-cost-structure
    title: Margin path and cost structure
    body: >-
      ICRA reports consolidated operating profitability of 26.4% in FY2025 versus 20.6% in FY2024,
      attributing the improvement to operating leverage, product mix, backward integration, higher Myval
      capacity utilization and better export realizations. The report separately says Meril Life Sciences
      Private Limited's operating margin reached 37.9%, so the consolidated and subsidiary figures should
      not be conflated. Cost pressure remains visible: ICRA identifies multi-SKU inventory, dealer and
      government receivables, foreign-exchange exposure, sales promotion and commissions, and continuing
      Myval litigation costs. The FY2025 litigation cost was Rs. 106 crore, following Rs. 137 crore in
      FY2024, with cumulative costs of Rs. 500-550 crore through March 31, 2025. Gross margin, contribution
      margin, service cost and product-level profitability are not publicly established.
    claimRefs: [CI005, CI006, CI008, CI017, CI018]
    tableRefs: [TI003]
  - id: capital-intensity-and-liquidity
    title: Working capital, capex and financing dependency
    body: >-
      The latest ICRA assessment describes net working capital intensity of about 53.8% of operating
      income in FY2025, inventory holding of 212 days and working-capital debt of Rs. 1,690.5 crore at
      March 31, 2025. It reports roughly Rs. 600 crore of FY2025 capex and planned FY2026 capex of
      Rs. 500-600 crore, expected to be funded through incremental term debt and internal accruals.
      Total debt rose to Rs. 2,592.5 crore from Rs. 1,808.0 crore, while net debt/OPBDITA was 1.0x and
      interest coverage 6.7x. Liquidity included approximately Rs. 593 crore of free cash and liquid
      investments at March 31, 2025, plus Rs. 315.1 crore of undrawn working-capital limits as of July
      31, 2025. These balances are dated and are not a current runway estimate.
    claimRefs: [CI010, CI012, CI013, CI014]
  - id: financial-verdict
    title: Underwriting verdict and diligence blockers
    body: >-
      The financial case is strongest on reported scale, export-led growth, operating leverage and access
      to institutional capital. ADIA's H1 FY2026 investment was $200 million, but ICRA says only about
      Rs. 860 crore was primary infusion and that the balance was a stake sale; the primary proceeds were
      held in bank fixed deposits at the review date. That distinction matters because transaction value is
      not cash available to the operating company. The main underwriting risk is the interaction of high
      inventory and receivables, ongoing capex, export-currency exposure, litigation and uncertain product
      economics. A lender-style view can use ICRA's reported ratios, but an equity underwriting view still
      needs a current cash-flow bridge, segment margins, realized pricing, customer concentration, debt
      maturities and litigation downside scenarios.
    claimRefs: [CI013, CI014, CI015, CI016, CI017, CI018]
    figureRefs: [FI001]
