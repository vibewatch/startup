      - [Meril Life Sciences Private Limited, "Exports represented 84% of revenue and better export realizations aided margin", "FY2025 subsidiary perimeter", "Not comparable with group export share", "Subsidiary revenue, intercompany sales and geographic mix"]
    notes: "ICRA's FY2025 consolidated and subsidiary disclosures use different reporting perimeters; residual category shares are unavailable rather than assumed."
    claimRefs: [CI001, CI003, CI004, CI006, CI011]
  - id: TI002
    title: Pricing and monetization visibility
    columns: [Monetization element, Public evidence, Value or status, Confidence, Diligence ask]
    rows:
      - [Device sales, "Meril describes products manufactured in-house and innovations developed for unmet clinical needs", "Commercial device sales; realized pricing undisclosed", "Medium", "List versus realized ASP by SKU and geography"]
      - [Export commercialization, "ICRA links higher Myval capacity utilization and export realizations to margin expansion", "Revenue contribution and ASP undisclosed", "Medium", "Volume, realized ASP and gross profit by country"]
      - [Distributor and dealer channel, "ICRA cites extended credit periods to dealers and distributors", "Channel economics undisclosed", "Medium", "Distributor discounts, rebates, returns and payment terms"]
      - [Government and institutional receivables, "ICRA cites receivables from Government organisations as extending the cycle", "Receivable exposure undisclosed", "Medium", "Aging, concentration and collection history"]
      - [Regulated domestic pricing, "ICRA reports pricing pressure and NPPA regulation for stents and knee implants", "Current realized prices undisclosed", "Medium", "Price caps, realized discounts and margin sensitivity"]
      - [Recurring or service revenue, "No assigned source discloses a recurring-revenue or service-revenue schedule", null, "Low", "Installed base, service contracts, consumables and renewal economics"]
    notes: "Public materials establish product sales and channel/receivable mechanics but not realized prices or recurring revenue; null is intentionally unavailable, not zero."
    claimRefs: [CI006, CI009, CI016, CI017, CI018]
  - id: TI003
    title: Unit-economics and capital-adequacy inputs
    columns: [Metric, Value or null, Period, Confidence, Why it matters and diligence ask]
    rows:
      - [Operating income, 4902.9, FY2025, High, "Scale anchor; reconcile group perimeter and intercompany sales"]
      - [Operating profitability, 26.4%, FY2025, High, "Margin path; obtain EBITDA-to-cash conversion and segment bridge"]
      - [Net working capital / operating income, 53.8%, FY2025, High, "Working-capital drag; obtain inventory and receivables aging"]
      - [Inventory holding period, 212 days, FY2025, High, "Cash tied in multi-SKU stocking; test obsolescence and turns"]
      - [Working-capital debt, 1690.5, March 31 2025, High, "Liquidity dependence; obtain borrowing-base and covenant detail"]
      - [Total debt, 2592.5, March 31 2025, High, "Leverage anchor; obtain current debt and security schedule"]
      - [Free cash and liquid investments, 593, March 31 2025, High, "Starting liquidity only; refresh current bank and restricted cash"]
      - [FY2026 planned capex, "Rs. 500-600 crore", FY2026 plan, Medium, "Capital intensity; obtain committed versus discretionary capex"]
      - [Monthly burn and runway, null, Current, Low, "Required for financing dependency assessment; obtain monthly cash-flow bridge"]
    notes: "Amounts are in Rs. crore unless a percent, day count or null is shown; ICRA reported values are dated, while the runway field is unavailable publicly and must not be inferred."
    claimRefs: [CI005, CI010, CI012, CI013, CI014, CI018]
