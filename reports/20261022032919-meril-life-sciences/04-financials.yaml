callouts:
  - calloutType: strength
    title: Scale with improving reported profitability
    body: "ICRA reports 40.3% FY2025 operating-income growth and 26.4% operating profitability, with better capacity utilization, product mix and backward integration supporting the improvement."
    claimRefs: [CI001, CI005]
  - calloutType: risk
    title: Cash conversion is the central financial risk
    body: "Working-capital intensity, multi-SKU inventory, long receivable cycles, ongoing litigation and heavy capex can consume cash even while reported revenue and operating profit grow."
    claimRefs: [CI008, CI010, CI012, CI016, CI017]
  - calloutType: recommendation
    title: Underwrite only with current cash-flow evidence
    body: "Before relying on a premium growth case, obtain current monthly cash flows, segment margins, realized ASPs, customer concentration, debt maturities and litigation downside scenarios."
    claimRefs: [CI017, CI018]
