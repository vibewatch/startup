company:
  name: Meril Life Sciences
chapter:
  number: 1
  title: Company Overview
  summary: Meril is a privately held, Bilakhia-promoted medical-device group with diversified cardiovascular, orthopaedic, diagnostics, and endo-surgery operations. ICRA reports FY2025 consolidated revenue of Rs. 4,902.9 crore, 61% export exposure, and a $200 million ADIA investment, while also identifying working-capital intensity, patent litigation, and expansion execution as material constraints.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: Meril Life Sciences is presented in the retained material as an Indian medical-device group headquartered in Vapi, Gujarat, and associated with the Bilakhia Group. Its operating scope spans cardiovascular and structural-heart products, orthopaedic implants, endo-surgery, diagnostics, and surgical robotics. ICRA evaluates Micro Life Sciences and its Meril subsidiaries on a consolidated basis because of common management and significant financial linkages, describing the subsidiaries as operational arms with separate legal existence. Retained company pages describe an internally manufactured portfolio intended to address unmet clinical needs, while ICRA's December 2025 report states that the group's cardio and orthopaedic products were sold in more than 150 countries and exports represented 61% of consolidated FY2025 revenue.
    claimRefs: [CO001, CO002, CO003, CO004, CO011]
    tableRefs: [TO001]
  - id: leadership-capital-and-scale
    title: Leadership, capital, and operating scale
    body: The available evidence supports Bilakhia Group as the promoter group and identifies extensive promoter experience, but it does not provide a complete current founder, executive, or board roster. ICRA reports consolidated revenue growth of 40.3% year over year to Rs. 4,902.9 crore in FY2025. The same report records a $200 million ADIA investment in H1 FY2026, split between about Rs. 860 crore of primary infusion and a Bilakhia Holdings stake sale, with the primary proceeds then held in bank fixed deposits. A separate news account describes the transaction as a 3% stake at a $6.6 billion valuation, subject to regulatory approval. The valuation is therefore transaction-implied, and the full post-transaction ownership and shareholder-rights map remains unavailable.
    claimRefs: [CO005, CO006, CO007, CO008, CO009]
    tableRefs: [TO002, TO003]
  - id: milestones-and-diligence
    title: Milestones, risks, and diligence priorities
    body: >-
      Meril's reported trajectory combines product development, international regulatory progress, export expansion, and capacity investment. Retained material records MeRes100 approval and a 2019 EuroPCR evidence milestone, a 2023 Japan Lifeline agreement, and FY2025 capex of about Rs. 600 crore followed by planned FY2026 capex of Rs. 500-600 crore. The risk picture is not theoretical: ICRA identifies elevated working-capital intensity, foreign-exchange sensitivity, and ongoing Myval patent litigation that had accumulated Rs. 500-550 crore of legal costs by March 2025. An Economic Times index entry dated 20 October 2026 reports withdrawal of three Meril coronary-stent models in Sri Lanka after performance issues and an investigation; this item requires direct regulatory and product-level follow-up rather than a conclusion about the entire group.
    claimRefs: [CO010, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
