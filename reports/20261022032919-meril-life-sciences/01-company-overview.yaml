callouts:
  - calloutType: strength
    title: Diversified, export-oriented platform
    body: ICRA reports four major device segments, 61% export revenue in FY2025, and improved operating margin alongside revenue growth.
    claimRefs: [CO003, CO005, CO011]
  - calloutType: risk
    title: Growth is capital- and litigation-intensive
    body: High working-capital intensity, planned capex, foreign-exchange exposure, and ongoing patent litigation constrain the otherwise strong operating profile.
    claimRefs: [CO011, CO013, CO014, CO016]
  - calloutType: assumption
    title: Current governance remains under-disclosed
    body: The retained pool identifies the promoter group and major capital events but does not establish a complete current board, executive roster, or shareholder-rights map.
    claimRefs: [CO002, CO009]
