evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current cap table, board roster, executive biographies, and shareholder-rights documents.
    whyItMatters: >-
      Promoter control, key-person dependence, and ADIA or other investor protections cannot be assessed from the
      retained public summaries.
    diligencePath: >-
      Request the latest statutory ownership records, shareholder agreement extracts, board minutes, and executive
      organization chart under NDA.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: funding
    missingEvidence: >-
      Closing and regulatory-approval evidence for the ADIA transaction plus a current reconciliation of primary and
      secondary proceeds.
    whyItMatters: >-
      The transaction-implied valuation and the amount of new cash available to Meril are distinct and affect liquidity
      analysis.
    diligencePath: >-
      Obtain the signed transaction announcement, CCI approval status, cap-table update, and bank evidence for primary
      proceeds.
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: material
    topic: regulatory-risk
    missingEvidence: Primary NMRA/CDSCO notices and product-level revenue exposure for the reported Sri Lankan stent withdrawals.
    whyItMatters: >-
      The current adverse report may represent a localized product event or a broader quality-system issue; the retained
      index text cannot distinguish them.
    diligencePath: >-
      Collect regulator notices, corrective-action reports, affected SKU volumes, geography exposure, and post-market
      surveillance records.
    relatedQuestionRefs:
      - QO007
  - type: private-evidence-only
    severity: material
    topic: scale
    missingEvidence: Audited segment revenue, cash conversion, customer concentration, headcount, and product-level margins.
    whyItMatters: >-
      Consolidated revenue and exports show scale but do not establish recurring revenue, customer quality, or unit
      economics.
    diligencePath: >-
      Request audited FY2025/FY2026 financials, segment notes, customer concentration schedule, employee count, and
      working-capital ageing.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
      - TO002
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: A product-by-product SAM and SOM bridge by geography, approval status, channel, and realised selling price.
    whyItMatters: >-
      Broad industry estimates and a coronary-stent subset do not establish the revenue pool Meril can actually serve or
      capture.
    diligencePath: >-
      Request management's SKU-level market model, approved-country list, tender pipeline, channel economics, and
      realised ASPs by segment.
    relatedQuestionRefs:
      - QM008
  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: A reconciled market-size series using one publisher, definition, currency basis, and forecast vintage.
    whyItMatters: IBEF presents 2023, 2025, and 2030 values from different vintages that should not be treated as one time series.
    diligencePath: >-
      Obtain the underlying IBEF source notes and reconcile them against a second market-data provider on a common base
      year.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-map
    missingEvidence: Customer concentration, procurement win rates, reimbursement mix, and budget ownership by product line.
    whyItMatters: Adoption drivers do not prove conversion into recurring demand, pricing power, or durable channel access.
    diligencePath: >-
      Request anonymised customer cohorts, tender outcomes, distributor terms, reimbursement exposure, and product-level
      retention data.
    relatedQuestionRefs:
      - QM005
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Comparable tender prices, realized ASPs, rebates, distributor margins and service contracts by product category.
    whyItMatters: >-
      Without realized economics, feature and approval advantages cannot be translated into pricing power or durable
      gross margin.
    diligencePath: Obtain anonymized hospital tenders, distributor agreements and product-level sales bridge.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: switching
    missingEvidence: >-
      Installed-base, renewal, clinician preference and workflow-switching evidence across cardiac, orthopaedic and
      robotics products.
    whyItMatters: Switching cost and lock-in determine whether distribution and approvals create durable moat or only access.
    diligencePath: Request product-level installed-base, reorder, service and account-retention cohorts.
    relatedQuestionRefs:
      - QP006
  - type: conflicting-data
    severity: material
    topic: exports
    missingEvidence: A reconciled current export percentage and perimeter after the 2026 amalgamation.
    whyItMatters: >-
      CARE and ICRA report different fiscal periods and entities, so export mix should not be compared as if it were a
      single-period KPI.
    diligencePath: Reconcile consolidated FY26 and post-amalgamation segment reporting.
    relatedQuestionRefs:
      - QP004
  - type: access-blocked
    severity: minor
    topic: competitor-scale
    missingEvidence: Comparable product-level scale, share and pricing disclosures from Medtronic and other global incumbents.
    whyItMatters: The incumbent comparison is directional without matched scale and commercial metrics.
    diligencePath: Collect current annual reports, segment filings and public tender data for each material category.
    relatedQuestionRefs:
      - QP002
      - QP010
  - type: private-evidence-only
    severity: blocking
    topic: diligence-gaps
    missingEvidence: Current monthly cash-flow bridge, cash restrictions, debt maturities, covenant headroom and base/downside runway.
    whyItMatters: >-
      Reported cash and liquidity are dated and cannot establish whether the current capex and working-capital cycle
      require another financing round.
    diligencePath: >-
      Obtain FY2026 management accounts, 24-month monthly cash flow, bank statements, debt schedule and covenant
      certificates.
    relatedQuestionRefs:
      - QI005
      - QI007
      - QI008
  - type: private-evidence-only
    severity: material
    topic: segment-margins
    missingEvidence: Revenue, realized ASP, gross margin, contribution margin and operating profit by product line and geography.
    whyItMatters: >-
      Consolidated growth and operating margin may conceal loss-making or cash-intensive businesses and do not establish
      revenue quality.
    diligencePath: >-
      Request audited segment schedules, SKU-level price-volume-mix analysis, rebate files and distributor settlement
      data.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI003
      - QI007
  - type: conflicting-data
    severity: material
    topic: exports
    missingEvidence: A reconciled definition and denominator for the reported 61% and 84% FY2025 export shares.
    whyItMatters: >-
      The two percentages describe different perimeters or measures; using them interchangeably would distort geographic
      concentration and FX exposure.
    diligencePath: >-
      Reconcile consolidated and subsidiary financial statements to a country-by-country revenue and intercompany-sales
      schedule.
    relatedQuestionRefs:
      - QI003
      - QI008
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Current list prices, realized prices, discounts, rebates, distributor margins and contract terms for the main
      product families.
    whyItMatters: Official product pages establish portfolio scope but do not show monetization or price realization.
    diligencePath: Obtain current price books, top-customer contracts, distributor agreements and credit-note history.
    relatedQuestionRefs:
