    notes: "Values are not additive: broad industry estimates, a diagnostic-equipment subset, a coronary-stent subset, company revenue mix, and conflicting drug-eluting-stent shares use different populations, periods, units, and methodologies."
    claimRefs: [CM004, CM005, CM006, CM007, CM008, CM015, CM016]
  - id: TM003
    title: Buyer segments, triggers, and constraints
    columns: [Segment, Buyer, User, Payer / budget owner, Adoption trigger, Principal constraint]
    rows:
      - ["Cardiac hospitals", "Hospital procurement and cardiology leadership", "Interventional cardiologist", "Hospital or insurer", "Clinical evidence, approval, and procedure demand", "NPPA pricing and competition"]
      - ["Orthopaedic hospitals", "Hospital procurement and orthopaedic leadership", "Orthopaedic surgeon", "Hospital or patient", "Implant fit, certification, and surgeon preference", "Pricing controls and incumbent competition"]
      - ["Diagnostic laboratories", "Lab procurement", "Laboratory operator", "Hospital, lab chain, or payer", "Throughput, reliability, and validated kits", "Early-stage economics and scale"]
      - ["Public hospitals", "Tendering authority", "Clinician", "Public health budget", "Compliant bid and local availability", "Tender cycles and reimbursement limits"]
      - ["Private hospitals", "Procurement group", "Clinician", "Hospital operating budget", "Total cost and service levels", "Switching and evidence requirements"]
      - ["Overseas distributors", "Distributor management", "Local clinician", "Local payer or hospital", "Regulatory clearance and margin", "FX, inventory, and channel credit"]
      - ["Medical-device parks and manufacturing partners", "Corporate operations", "Manufacturing and R&D teams", "Corporate capex or policy support", "Localisation and cost reduction", "Capex execution and ramp-up"]
    notes: Buyer, user, and payer roles are inferred from device procurement workflows and the cited market evidence; public sources do not disclose Meril's customer-level budget ownership or realised ASPs.
    claimRefs: [CM003, CM010, CM011, CM012, CM013, CM014]
