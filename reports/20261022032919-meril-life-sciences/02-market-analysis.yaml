  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sizing-gap
      missingEvidence: A product-by-product SAM and SOM bridge by geography, approval status, channel, and realised selling price.
      whyItMatters: Broad industry estimates and a coronary-stent subset do not establish the revenue pool Meril can actually serve or capture.
      diligencePath: Request management's SKU-level market model, approved-country list, tender pipeline, channel economics, and realised ASPs by segment.
      relatedQuestionRefs: [QM008]
    - type: conflicting-data
      severity: material
      topic: market-size
      missingEvidence: A reconciled market-size series using one publisher, definition, currency basis, and forecast vintage.
      whyItMatters: IBEF presents 2023, 2025, and 2030 values from different vintages that should not be treated as one time series.
      diligencePath: Obtain the underlying IBEF source notes and reconcile them against a second market-data provider on a common base year.
      relatedQuestionRefs: [QM009]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: buyer-map
      missingEvidence: Customer concentration, procurement win rates, reimbursement mix, and budget ownership by product line.
      whyItMatters: Adoption drivers do not prove conversion into recurring demand, pricing power, or durable channel access.
      diligencePath: Request anonymised customer cohorts, tender outcomes, distributor terms, reimbursement exposure, and product-level retention data.
      relatedQuestionRefs: [QM005]
