  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: "Customer-level cohorts showing active accounts, renewal or repeat-purchase rates, churn, GRR/NRR, and contract duration by product line."
      whyItMatters: "Clinical use and geographic reach do not establish recurring commercial durability or the quality of revenue."
      diligencePath: "Request anonymised cohort tables, renewal schedules, order-frequency data, and realised ASPs for the last three fiscal years."
      relatedQuestionRefs: [QU004]
    - type: enumeration-incomplete
      severity: material
      topic: named-customers
      missingEvidence: "At least three independently verifiable named hospital or healthcare-provider deployments with production-versus-pilot status and outcomes."
      whyItMatters: "The available evidence describes clinical trial participants and broad market reach but does not provide account-level production references."
      diligencePath: "Obtain customer reference letters, procurement records, or named hospital announcements that identify deployment status and measured outcomes."
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: concentration
      missingEvidence: "Top-10 customer and distributor revenue shares, channel terms, and receivable ageing by geography."
      whyItMatters: "High export exposure and extended channel credit can conceal concentration and cash-conversion risk."
