chapter:
  number: 6
  title: Customers
  summary: Meril sells a broad medical-device portfolio through hospitals, clinicians, distributors, and export markets, with customer proof strongest for Myval and orthopaedic products. The available evidence supports international clinical adoption and market reach, but does not disclose a customer-level revenue mix, retention rate, or concentration profile.
sections:
  - id: buyer-and-use-case-segments
    title: Buyer, user, and use-case segments
    body: >-
      Meril's customer system is multi-sided: hospitals and healthcare centres
      are the direct institutional buying surface, clinicians and surgeons are
      the product users and important adoption gatekeepers, and patients are
      the ultimate beneficiaries. The company describes direct sales to
      hospitals, clinics, and healthcare professionals, while also identifying
      distribution partnerships and government contracts as additional routes
      to market. ICRA's December 2025 credit report provides a more concrete
      segmentation of the portfolio: vascular intervention contributed about
      35% of consolidated revenue, orthopaedics about 30%, with diagnostics,
      endo-surgery, and the standalone entity supplying the remainder. That
      segment mix is a revenue view rather than a customer-count view. Meril
      also sells mainly cardio and orthopaedic products in more than 150
      countries, with exports at about 61% of FY2025 consolidated revenue.
      These facts indicate a geographically diversified institutional model,
      but the evidence does not identify active accounts, payer mix, average
      order size, or customer concentration.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-clinical-proof
    title: Adoption trajectory and named customer proof
    body: >-
      The clearest adoption evidence is product- and procedure-specific rather
      than a recurring customer KPI. ICRA reports that Myval is sold in
      European and domestic markets, that 84% of Myval revenue came from
      exports in FY2025, and that Meril's products are sold in more than 150
      countries. A 2026 report on the LANDMARK trial describes a prospective,
      randomised 1:1 non-inferiority study enrolling 768 patients across 31
      centres in 16 countries; the two-year event-free survival result was
      79.1% for Myval versus 81.9% for contemporary valves, with no
      statistically significant difference reported in the article. This is
      clinical-use and comparative-outcome evidence, not proof of paid
      customer retention. A customer-journey source reports surgeon training
      through Meril Academy and a global network, while official company
      material says orthopaedic implants are used in over 50 countries. The
      source set does not independently verify the number of active hospitals,
      repeat purchasing, renewal, or production-versus-pilot status for named
      accounts.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-expansion-and-concentration
    title: Durability, expansion, and concentration risk
    body: >-
      Meril's expansion engine appears to combine broader geography, new
      products, clinical evidence, and clinician training. ICRA says increased
      penetration in existing markets and improving geographic presence drove
      FY2025 growth, while new products such as IVL and Mitral Clip provide
      revenue visibility. The same report identifies a customer-side working
      capital burden: multi-SKU stocking across geographies and extended
      credit to channel partners contributed to net working capital equal to
      about 53.8% of operating income in FY2025, with inventory holding of
      212 days. It also notes pricing pressure in some stents and orthopaedic
      implants and regulatory exposure. These are important limits on
      expansion quality: geographic reach can require inventory and receivable
      funding, and channel penetration can reduce cash conversion. There is no
      disclosed NRR, GRR, churn, contract-length, cohort, account-level
      concentration, or distributor economics in the assigned evidence.
      Those missing denominators prevent a durable-retention or
      land-and-expand conclusion.
      Independent news indexing also shows scrutiny of Meril's stent-pricing
      request and product-improvement claims, but the available index does not
      establish a complaint outcome or failed deployment.
    claimRefs: [CU010, CU011, CU012, CU013, CU015]
callouts:
  - calloutType: strength
    title: Clinical and geographic reach are real adoption signals
    body: Myval has reported use across a 31-centre, 16-country randomised trial, while ICRA reports product sales in more than 150 countries and high export contribution; these support reach, but not account-level retention.
    claimRefs: [CU003, CU006, CU007]
  - calloutType: risk
    title: Customer durability is not measurable from disclosed data
    body: No assigned source discloses active customer count, revenue concentration, repeat-purchase or renewal cohorts, NRR/GRR, churn, or contract length; these are material diligence gaps for an institutional device supplier.
    claimRefs: [CU013, CU014]
