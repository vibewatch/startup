      - ["MISSO surgical robot", "Knee-replacement hospitals and surgeons", "Launched; report says CDSCO-approved and CE/USFDA approvals pending", "Indigenous and compact system positioned for smaller hospitals", "Independent validation of performance, approvals, and installed base"]
    notes: Public descriptions combine company claims, rating-agency reporting, and third-party reporting; status is not a substitute for a complete regulatory register or commercial installed-base schedule.
    claimRefs: [CE001, CE003, CE006, CE011]
  - id: TE002
    title: Workflow / use-case table
    columns: [User job, Current workflow, Company solution, Measurable benefit, Limitation]
    rows:
      - ["Treat coronary disease", "Interventional procedure using imported or conventional devices", "Stents, scaffolds, balloons, and valves", "Clinical-use and approval evidence exists for selected products", "Comparative outcomes and realized procedure economics unavailable"]
      - ["Treat aortic stenosis", "Transcatheter valve replacement pathway", "Myval transcatheter heart-valve system", "DCGI and CE status cited by ICRA", "Patent litigation and country-specific approval scope require review"]
      - ["Replace a knee joint", "Orthopaedic implant surgery", "Knee implants and MISSO robotic assistance", "Product approvals and company-reported planning or cost benefits for MISSO", "Independent clinical and adoption evidence incomplete"]
      - ["Perform minimally invasive surgery", "Conventional laparoscopic surgery with trocar and instrument constraints", "HandX handheld articulated robotic platform", "Product page reports 540-degree tip rotation and compact setup", "Claims are product-page assertions and outcomes are not independently benchmarked"]
      - ["Control bleeding and close tissue", "Surgical team uses separate consumables and closure tools", "Sutures, tissue sealants, hemostats, and mechanical closure devices", "Broad integrated endosurgery range", "SKU-level evidence, pricing, and quality data not public"]
      - ["Diagnose disease", "Provider uses diagnostic equipment and assays", "Meril diagnostics vertical", "Diagnostics included in group portfolio", "Assay validation, installed base, and utilization gaps"]
    notes: The rows describe distinct clinical jobs and retain the source limitations; they are not a conversion funnel or a claim of comparative clinical benefit.
    claimRefs: [CE001, CE002, CE006, CE009, CE010]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - ["R&D and clinical development", "Design products and generate clinical support", "Engineering, clinical investigators, and regulatory submissions", "Development timelines and evidence quality"]
      - ["Backward integration", "Manufacture selected critical components and support new products", "Dedicated manufacturing subsidiaries and facilities", "Capacity ramp and capex execution"]
      - ["Regulatory and quality", "Permit sale and continued use across jurisdictions", "DCGI, CE, USFDA and other country-specific regimes", "Approval delays, recalls, and compliance obligations"]
      - ["Manufacturing", "Produce multi-SKU devices at scale", "Facilities, process controls, and qualified suppliers", "Utilization, yield, inventory, and product liability"]
      - ["Distribution and regional entities", "Sell and support products in domestic and export markets", "Country subsidiaries, distributors, and local registrations", "Service consistency and working-capital intensity"]
      - ["Post-market support", "Monitor safety and maintain clinical workflow", "Complaint handling, training, maintenance, and product liability insurance", "Public service, incident, and surveillance data are sparse"]
    notes: This is an evidence-based operating model, not a disclosed software architecture; each dependency needs primary quality-system and operational documentation in diligence.
    claimRefs: [CE005, CE007, CE008, CE013]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Meril's product platform links development, manufacturing, regulatory clearance, and clinical distribution across multiple device verticals.
    data:
      layers:
        - label: Clinical product verticals
          detail: Cardiovascular, orthopaedics, endosurgery, diagnostics, and ENT products address distinct clinical workflows.
          modules: [Cardiovascular devices, Orthopaedic implants, Endosurgery, Diagnostics and ENT]
        - label: Product and technology development
          detail: R&D, clinical evidence, and robotics support product design and procedure-specific workflows.
          modules: [R&D and clinical evidence, MISSO robotics, HandX robotics]
        - label: Industrial and quality backbone
          detail: Manufacturing and backward integration supply products and selected critical components under regulatory controls.
          modules: [Manufacturing and backward integration, Regulatory and quality controls]
        - label: Clinical and regulatory evidence
          detail: Clinical studies, approvals, and certifications enable product commercialization but require product-level reconciliation.
          modules: [Clinical studies, DCGI, CE, USFDA]
        - label: Post-market support
          detail: Complaint handling, training, maintenance, and vigilance are required to sustain safe clinical use.
          modules: [Service, complaint handling, post-market surveillance]
        - label: Market delivery
          detail: Regional entities and distributors deliver products to hospitals, clinicians, and patients across domestic and export markets.
          modules: [Domestic distribution, Export distribution, Training and support]
    approximationNotes: The map is a synthesis of disclosed product and operating layers; it does not imply that every product uses every layer or that all controls are publicly verified.
    claimRefs: [CE001, CE005, CE006, CE007, CE008]
callouts:
  - calloutType: recommendation
    title: Diligence priority
    body: Underwrite Meril as a scaled, vertically integrated device platform, but require product-level regulatory files, clinical outcomes, complaint and recall history, installed-base and service data, and independent validation of newer robotic systems before treating the technology platform as a durable moat.
    claimRefs: [CE005, CE011, CE012, CE013]
