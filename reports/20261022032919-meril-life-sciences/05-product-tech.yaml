  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: reliability
      missingEvidence: Product-level failure rates, complaints, recalls, corrective actions, and post-market surveillance by major SKU and geography.
      whyItMatters: A broad portfolio and regulatory clearance do not establish real-world reliability or quality-system performance.
      diligencePath: Obtain the quality dashboard, complaint log, recall and field-action history, vigilance reports, and audit findings for the material product lines.
      relatedQuestionRefs: [QE004, QE006, QE009]
    - type: missing-source
      severity: material
      topic: robotics
      missingEvidence: Independent clinical, adoption, service, and economic validation for MISSO and HandX.
      whyItMatters: Newer robotics products could be strategically important, but current public evidence is mainly company or company-attributed claims.
      diligencePath: Request regulatory submissions, clinical study reports, installed-base and utilization data, service-level metrics, and named hospital references.
      relatedQuestionRefs: [QE008, QE009]
    - type: conflicting-data
      severity: material
      topic: regulatory
      missingEvidence: A current product-by-product regulatory matrix distinguishing approvals, certificates, jurisdictions, and expiry dates.
      whyItMatters: Public descriptions use different dates and scopes, and a product's clearance in one jurisdiction does not establish authorization elsewhere.
      diligencePath: Reconcile the current regulatory register to certificates, approval letters, renewals, and distribution geographies.
      relatedQuestionRefs: [QE002, QE006]
