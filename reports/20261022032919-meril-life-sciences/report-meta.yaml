companyProfile:
  summary: >-
    Meril Life Sciences is a privately held Indian medical-device group associated with the Bilakhia Group. It operates
    across cardiovascular and structural-heart products, orthopaedics, diagnostics, endo-surgery, and surgical robotics,
    with a substantial export footprint and consolidated financial reporting across related entities.
  foundingLocation: Vapi, Gujarat, India
  headquarters: Vapi, Gujarat, India
  productSummary: >-
    Medical devices spanning vascular intervention, transcatheter heart valves, orthopaedic implants, endo-surgery,
    diagnostics, ENT, and surgical robotics.
  customerFocus: >-
    Hospitals, clinicians, distributors, laboratories, surgical providers, and patients across India and international
    markets.
  businessModel: >-
    Design, manufacture, obtain regulatory approvals for, and sell medical devices through direct and distributor-led
    hospital and clinical channels.
  stage: Late-stage private / pre-IPO
