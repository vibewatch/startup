  topStrengths:
    - Diversified medical-device portfolio with cardiovascular and orthopaedic scale.
    - Reported FY2025 revenue growth and operating-margin improvement.
    - Export reach across more than 150 countries.
  topRisks:
    - Ongoing Myval patent litigation and broader regulatory exposure.
    - High working-capital intensity and substantial expansion capex.
    - Private-company disclosure gaps around cap table, customer concentration, and cash conversion.
  unresolvedGaps:
    - Full cap table, CCPS / preference waterfall, and ADIA shareholder-rights terms.
    - >-
      Revenue, gross profit, and backlog exposure for Myval products and geographies affected by litigation
      restrictions.
    - >-
      Customer concentration, distributor economics, realised ASPs, and revenue-recognition policy by major product
      line.
    - Monthly burn, runway, and FY2026-FY2027 cash-flow bridge after current capex and working-capital demands.
    - Installed-base, service-economics, and recurring-revenue profile for the robotics business.
