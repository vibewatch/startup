figures:
  - id: FO001
    title: Selected Meril milestones and diligence triggers
    type: timeline
    summary: >-
      The timeline pairs disclosed operating milestones with the current adverse product-quality signal and unresolved
      diligence requirements.
    data:
      items:
        - date: '2006'
          label: Bilakhia Group enters healthcare
          details: ICRA reports that the Bilakhia Group entered the healthcare sector in 2006.
          tone: neutral
          claimRefs:
            - CO002
        - date: '2017'
          label: MeRes100 approval
          details: Economic Times index material reports Drug Controller General of India approval for MeRes100.
          tone: positive
          claimRefs:
            - CO010
        - date: '2019'
          label: EuroPCR evidence milestone
          details: >-
            Meril's historical account says 14 medical studies were presented and cites CE-approved MeRes100 and Myval
            devices.
          tone: positive
          claimRefs:
            - CO010
        - date: '2023'
          label: Institutional equity infusion
          details: ICRA reports Rs. 1,900 crore of equity and CCPS investment in FY2023.
          tone: positive
          claimRefs:
            - CO008
        - date: '2023'
          label: Japan Lifeline agreement
          details: Retained secondary sources record an agreement to promote Myval Octacor in Japan.
          tone: neutral
          claimRefs:
            - CO012
        - date: FY2025
          label: Scale and export expansion
          details: ICRA reports Rs. 4,902.9 crore revenue, 26.4% operating margin, and 61% export revenue.
          tone: positive
          claimRefs:
            - CO005
            - CO011
        - date: H1 FY2026
          label: ADIA investment
          details: ICRA reports a $200 million investment split between primary infusion and a Bilakhia Holdings stake sale.
          tone: positive
          claimRefs:
            - CO006
        - date: 20 Oct 2026
          label: Sri Lankan stent withdrawal report
          details: Economic Times index material reports three models withdrawn after performance issues and an investigation.
          tone: negative
          claimRefs:
            - CO015
    approximationNotes: >-
      The timeline is an ordered evidence display, not a complete corporate history; secondary-source milestones and the
      2026 withdrawal report require primary-document confirmation.
    claimRefs:
      - CO002
      - CO006
      - CO008
      - CO010
      - CO012
      - CO015
  - id: FM001
    title: Evidence-constrained market sizing lenses
    type: pyramid
    summary: An ordered scale view of public India market estimates; the layers are separate lenses, not additive TAM/SAM/SOM.
    data:
      items:
        - label: India medical devices projection
          value: US$50.1bn (2030)
          detail: IBEF projection; not Meril SAM
          tone: positive
        - label: India medical devices market
          value: US$15.2bn (2025)
          detail: IBEF base used with its 2030 projection
          tone: positive
        - label: India diagnostic equipment
          value: US$6bn (2027)
          detail: IBEF forecast; subset of broad devices
          tone: neutral
        - label: India diagnostic equipment
          value: US$4bn (CY2023)
          detail: IBEF estimate; subset of broad devices
          tone: neutral
        - label: India coronary stents
          value: US$1.3bn (2035)
