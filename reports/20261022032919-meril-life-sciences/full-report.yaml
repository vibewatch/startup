  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer system
        blocks:
          - type: paragraph
            body: >-
              The relevant market is medical devices and related clinical equipment sold into hospitals, cardiac-care
              centres, laboratories, surgical providers, and distributors, with India as the demand anchor and exports
              as a material extension. It includes cardiovascular intervention devices, orthopaedic implants,
              diagnostics, endo-surgery, surgical robotics, and adjacent consumables that Meril manufactures or
              distributes. It excludes pharmaceuticals, general hospital services, and the entire healthcare budget;
              those are upstream or adjacent spending pools rather than directly addressable device revenue. GlobalData
              describes Meril as designing, developing, and manufacturing vascular devices, orthopaedic implants,
              diagnostics, sutures, biosurgicals, and related solutions, while ICRA places the company in four major
              device segments. The buyer is usually an institution or distributor, the user is a clinician or laboratory
              operator, and the payer is a hospital, insurer, public program, or patient. This separation matters
              because clinical approval and workflow fit can determine adoption even when a device has a lower purchase
              price.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Sizing lenses and market structure
        blocks:
          - type: paragraph
            body: >-
              No single public figure cleanly represents Meril's serviceable market across all product lines. IBEF
              reports an India medical-devices market of US$15.35 billion in 2023 and a projection above US$50 billion
              by 2030, while its page also reports a US$15.2 billion 2025 base and US$50.1 billion 2030 projection. The
              same page places diagnostic equipment at US$4 billion in CY2023 and US$6 billion by 2027. Future Market
              Insights provides a narrower India coronary-stent lens of US$0.9 billion in 2025 and US$1.3 billion in
              2035 at a 3.5% CAGR, but its page separately assigns drug-eluting stents both 52.4% and 77.9% shares for
              2025 without reconciling the definitions. ICRA supplies a company-specific allocation lens: about 35% of
              FY2025 consolidated revenue from vascular intervention and about 30% from orthopaedics. These values are
              not additive TAM/SAM/SOM layers; a credible company SAM and SOM requires product-level approvals,
              geographies, tender access, realised prices, and channel economics that are not publicly enumerated.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM015
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM010
      - number: '2.3'
        title: Adoption drivers, constraints, and budget ownership
        blocks:
          - type: paragraph
            body: >-
              Demand is supported by non-discretionary healthcare consumption, rising lifestyle disease incidence,
              health-awareness and affordability improvements, insurance penetration, hospital expansion, and public
              support for domestic manufacturing. IBEF describes India as still importing 70–80% of medical devices and
              identifies the Production-Linked Incentive scheme, medical-device parks, and 100% foreign direct
              investment as supply-side supports. Meril's official material frames local manufacturing as improving
              cost-benefit performance and describes orthopaedic implants used in more than 50 countries, but those are
              company claims. On the constraint side, ICRA identifies stiff domestic and international competition,
              pricing pressure on stents and orthopaedic implants, NPPA pricing regulation, high inventory and debtor
              intensity, and approval timelines. Meril's Myval site says its THV systems are not approved for sale in
              the United States and describes product-specific unavailability across multiple European countries. Buyer
              adoption therefore depends on clinical evidence and regulatory clearance for clinicians, procurement
              budgets and reimbursement for hospitals, and reliable supply and service for distributors. The market
              thesis is attractive, but the company-level capture rate remains unproven without product, geography, and
              customer-level data.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The investable market is segmented, not a single TAM
            body: >-
              The strongest market case combines a broad India medical-devices growth pool with narrower cardiovascular
              and orthopaedic product lenses; the public evidence does not isolate Meril's SAM or SOM.
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: callout
            title: Capture depends on regulated execution
            body: >-
              Pricing controls, approval timelines, competition, working-capital intensity, and product-specific market
              access can limit conversion of sector growth into Meril earnings.
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and categories
        blocks:
          - type: paragraph
            body: >-
              Meril's relevant competitive set spans several jobs-to-be-done. CARE Ratings describes the group across
              cardiac implants, orthopaedic implants, diagnostics and endo-surgery, while its product and distribution
              surfaces also show robotics and ENT. That makes a single peer list misleading: a structural-heart buyer
              may compare Meril with Abbott and other global valve specialists, an orthopaedic hospital may compare
              Freedom or DESTIKNEE with incumbent implant vendors, and a diagnostics or stapling buyer may evaluate a
              different set of suppliers. The status quo is not only another branded device; it includes imported
              devices, incumbent hospital protocols, distributor-led procurement, and internal clinical preference.
              Bharat MedXpo lists vascular intervention, orthopaedic implants, robotics, ENT, endo-surgery and
              diagnostics, and CARE identifies more than 35 overseas subsidiaries and sales in over 150 countries. These
              facts support platform breadth and route-to-market reach, but do not establish category leadership in
              every segment. The competitor profile table therefore separates issuer-supported facts from unknown price,
              share and customer-scale fields.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP010
      - number: '3.2'
        title: Capability, distribution and trust trade-offs
        blocks:
          - type: paragraph
            body: >-
              Meril's strongest defensible elements are regulatory access, manufacturing depth, product breadth and
              distribution. CARE reports that most products are CE marked, that balloon catheters have US approval, and
              that the group has more than 500 R&D professionals; ICRA separately describes Myval as an indigenous heart
              valve with DCGI approval and CE certification. CARE also reports approximately 61% of FY26 sales from
              exports and a 36% orthopaedic share alongside cardiac, diagnostics and endo-surgery contributions. Those
              indicators are more relevant to switching and trust than a generic feature checklist: hospitals need
              approvals, clinical evidence, service availability and dependable supply. However, the same expansion
              creates exposure. ICRA reports pricing pressure for some stents and orthopaedic implants, while CARE flags
              intense competition from established global players. The feature matrix marks unsupported competitor cells
              as unknown; Abbott's own Navitor page demonstrates how a global incumbent can differentiate with a
              specific design feature and regulatory approval, but competitor marketing claims are not independent proof
              of superiority.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP004
              - CP010
              - CP011
              - CP015
              - CP016
      - number: '3.3'
        title: Pricing pressure, lock-in and moat durability
        blocks:
          - type: paragraph
            body: >-
              Moat durability is conditional rather than proven. Meril can compound distribution and regulatory
              approvals across countries, and its portfolio can cross-sell products into existing channels. Yet
              medical-device switching is governed by clinician familiarity, procurement rules, installed equipment,
              clinical evidence, reimbursement and after-sales support; the assigned evidence does not quantify Meril's
              switching costs, contract renewal rates, realized ASPs, or distributor exclusivity. ICRA notes that stents
              and some orthopaedic implants have faced pricing pressure, and that NPPA inclusion can reduce pricing
              flexibility. CARE reports a 210-day net operating cycle in FY26, higher debt and planned two-year capex of
              approximately ₹1,500–1,600 crore, which may fund capacity and breadth but also raises execution
              dependence. The adverse case is therefore a combination of incumbent response, price commoditization,
              litigation restricting a cardiac product, and slow capacity ramp-up. ICRA identifies ongoing patent
              litigation and says an adverse outcome could affect Myval revenue and business prospects; this is material
              displacement risk, not proof that the product is defective. A buyer or investor should underwrite each
              product category separately until realized pricing, clinical outcomes, installed base, channel economics
              and litigation exposure are disclosed.
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Portfolio breadth with export reach
            body: >-
              CARE reports sales in over 150 countries and a diversified mix across cardiac, orthopaedic, diagnostics
              and endo-surgery, giving Meril more routes to grow than a single-product specialist.
            calloutType: strength
            claimRefs:
              - CP003
              - CP005
              - CP008
          - type: callout
            title: Incumbent and legal pressure
            body: >-
              Established global competition, domestic pricing pressure and ongoing cardiac-product patent litigation
              can weaken the value of Meril's regulatory and distribution investments.
            calloutType: risk
            claimRefs:
              - CP011
              - CP013
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue quality and monetization
        blocks:
          - type: paragraph
            body: >-
              ICRA's December 2025 consolidated review reports operating income of Rs. 4,902.9 crore in FY2025, up from
              Rs. 3,494.7 crore in FY2024. It describes a diversified mix led by vascular products at about 35% of group
              revenue and orthopaedics at about 30%, with the remainder from diagnostics, endo-surgery and the
              standalone entity. The same review reports that exports contributed about 61% of group revenue and
              products were sold in more than 150 countries; Meril's own undated blog separately claims a footprint
              above 100 countries. For the narrower Meril Life Sciences Private Limited perimeter, ICRA reports 84%
              export revenue, so the percentages are not interchangeable. A Meril-issued clinical release supports
              Myval's product relevance, but does not establish sales or long-term durability. This is evidence of scale
              and reach, not ARR or recurring revenue.
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI006
              - CI011
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI006
              - CI011
          - type: table
            tableRef: TI002
            claimRefs:
              - CI006
              - CI009
              - CI016
              - CI017
              - CI018
      - number: '4.2'
        title: Margin path and cost structure
        blocks:
          - type: paragraph
            body: >-
              ICRA reports consolidated operating profitability of 26.4% in FY2025 versus 20.6% in FY2024, attributing
              the improvement to operating leverage, product mix, backward integration, higher Myval capacity
              utilization and better export realizations. The report separately says Meril Life Sciences Private
              Limited's operating margin reached 37.9%, so the consolidated and subsidiary figures should not be
              conflated. Cost pressure remains visible: ICRA identifies multi-SKU inventory, dealer and government
              receivables, foreign-exchange exposure, sales promotion and commissions, and continuing Myval litigation
              costs. The FY2025 litigation cost was Rs. 106 crore, following Rs. 137 crore in FY2024, with cumulative
              costs of Rs. 500-550 crore through March 31, 2025. Gross margin, contribution margin, service cost and
              product-level profitability are not publicly established.
            claimRefs:
              - CI005
              - CI006
              - CI008
              - CI017
              - CI018
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI010
              - CI012
              - CI013
              - CI014
              - CI018
      - number: '4.3'
        title: Working capital, capex and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The latest ICRA assessment describes net working capital intensity of about 53.8% of operating income in
              FY2025, inventory holding of 212 days and working-capital debt of Rs. 1,690.5 crore at March 31, 2025. It
              reports roughly Rs. 600 crore of FY2025 capex and planned FY2026 capex of Rs. 500-600 crore, expected to
              be funded through incremental term debt and internal accruals. Total debt rose to Rs. 2,592.5 crore from
              Rs. 1,808.0 crore, while net debt/OPBDITA was 1.0x and interest coverage 6.7x. Liquidity included
              approximately Rs. 593 crore of free cash and liquid investments at March 31, 2025, plus Rs. 315.1 crore of
              undrawn working-capital limits as of July 31, 2025. These balances are dated and are not a current runway
              estimate.
            claimRefs:
              - CI010
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Underwriting verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial case is strongest on reported scale, export-led growth, operating leverage and access to
              institutional capital. ADIA's H1 FY2026 investment was $200 million, but ICRA says only about Rs. 860
              crore was primary infusion and that the balance was a stake sale; the primary proceeds were held in bank
              fixed deposits at the review date. That distinction matters because transaction value is not cash
              available to the operating company. The main underwriting risk is the interaction of high inventory and
              receivables, ongoing capex, export-currency exposure, litigation and uncertain product economics. A
              lender-style view can use ICRA's reported ratios, but an equity underwriting view still needs a current
              cash-flow bridge, segment margins, realized pricing, customer concentration, debt maturities and
              litigation downside scenarios.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
              - CI017
              - CI018
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI003
              - CI005
              - CI010
              - CI011
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale with improving reported profitability
            body: >-
              ICRA reports 40.3% FY2025 operating-income growth and 26.4% operating profitability, with better capacity
              utilization, product mix and backward integration supporting the improvement.
            calloutType: strength
            claimRefs:
              - CI001
              - CI005
          - type: callout
            title: Cash conversion is the central financial risk
            body: >-
              Working-capital intensity, multi-SKU inventory, long receivable cycles, ongoing litigation and heavy capex
              can consume cash even while reported revenue and operating profit grow.
            calloutType: risk
            claimRefs:
              - CI008
              - CI010
              - CI012
              - CI016
              - CI017
          - type: callout
            title: Underwrite only with current cash-flow evidence
            body: >-
              Before relying on a premium growth case, obtain current monthly cash flows, segment margins, realized
              ASPs, customer concentration, debt maturities and litigation downside scenarios.
            calloutType: recommendation
            claimRefs:
              - CI017
              - CI018
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Portfolio and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Meril delivers medical devices through a broad clinical workflow rather than a single software product.
              Its disclosed portfolio includes vascular-intervention devices such as stents, scaffolds, balloon
              catheters, and transcatheter valve systems; orthopaedic implants; endosurgery consumables and instruments;
              diagnostics; ENT products; and robotics. The company describes patients, doctors, hospitals, and
              distributors as users or route-to-market participants, while ICRA describes a group structure spanning
              cardiovascular, orthopaedic, endosurgery, diagnostics, and medical-device distribution subsidiaries. This
              breadth can diversify clinical demand, but it also creates a multi-SKU, multi-regulator support burden.
              Public evidence shows international reach, yet does not establish product-by-product active utilization,
              customer concentration, service response, or realized clinical outcomes.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE006
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE009
              - CE010
      - number: '5.2'
        title: Operating architecture and maturity
        blocks:
          - type: paragraph
            body: >-
              The operating architecture is best understood as a vertically integrated medtech platform: research and
              development and clinical work feed product design; manufacturing and backward integration supply critical
              components; regulatory approvals enable domestic and export sales; and subsidiaries and regional entities
              distribute and support products. ICRA reports that Meril Medical Innovations began manufacturing certain
              critical components and is expected to house new products, while the rating agency links margin
              improvement to product mix, capacity utilization, and cost efficiencies from backward integration. Myval
              is a mature flagship with DCGI and CE status in the cited ICRA material, while MISSO and newer products
              are less fully evidenced in public sources. The architecture therefore has a real manufacturing and
              regulatory backbone, but the public record is not a substitute for design history files, validation
              reports, installed-base data, or service-level evidence.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE007
              - CE008
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE007
              - CE008
      - number: '5.3'
        title: Differentiation, trust, and execution risk
        blocks:
          - type: paragraph
            body: >-
              Differentiation rests on local product development, broad manufacturing capability, export approvals, and
              workflow-specific devices. ICRA identifies Myval as an indigenous heart valve and notes that many knee
              implants are CE-certified and USFDA-approved; the HandX product page describes a compact, handheld robotic
              laparoscopic system with articulated instruments, multiple end-effectors, and a workflow intended to
              remain close to conventional laparoscopy. These are concrete design and regulatory signals, not proof of
              superiority. The main diligence risks are regulatory expansion for new products, clinical and
              product-liability exposure, supply and inventory complexity, and patent litigation around Myval. MISSO
              coverage is based on a news report of company-reported performance and approvals, so its cost,
              success-rate, AI, and future-approval statements require independent validation. Reliability,
              cybersecurity, complaint handling, recall history, and post-market surveillance data are not sufficiently
              disclosed in the assigned sources.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Diligence priority
            body: >-
              Underwrite Meril as a scaled, vertically integrated device platform, but require product-level regulatory
              files, clinical outcomes, complaint and recall history, installed-base and service data, and independent
              validation of newer robotic systems before treating the technology platform as a durable moat.
            calloutType: recommendation
            claimRefs:
              - CE005
              - CE011
              - CE012
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and use-case segments
        blocks:
          - type: paragraph
            body: >-
              Meril's customer system is multi-sided: hospitals and healthcare centres are the direct institutional
              buying surface, clinicians and surgeons are the product users and important adoption gatekeepers, and
              patients are the ultimate beneficiaries. The company describes direct sales to hospitals, clinics, and
              healthcare professionals, while also identifying distribution partnerships and government contracts as
              additional routes to market. ICRA's December 2025 credit report provides a more concrete segmentation of
              the portfolio: vascular intervention contributed about 35% of consolidated revenue, orthopaedics about
              30%, with diagnostics, endo-surgery, and the standalone entity supplying the remainder. That segment mix
              is a revenue view rather than a customer-count view. Meril also sells mainly cardio and orthopaedic
              products in more than 150 countries, with exports at about 61% of FY2025 consolidated revenue. These facts
              indicate a geographically diversified institutional model, but the evidence does not identify active
              accounts, payer mix, average order size, or customer concentration.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU011
      - number: '6.2'
        title: Adoption trajectory and named customer proof
        blocks:
          - type: paragraph
            body: >-
              The clearest adoption evidence is product- and procedure-specific rather than a recurring customer KPI.
              ICRA reports that Myval is sold in European and domestic markets, that 84% of Myval revenue came from
              exports in FY2025, and that Meril's products are sold in more than 150 countries. A 2026 report on the
              LANDMARK trial describes a prospective, randomised 1:1 non-inferiority study enrolling 768 patients across
              31 centres in 16 countries; the two-year event-free survival result was 79.1% for Myval versus 81.9% for
              contemporary valves, with no statistically significant difference reported in the article. This is
              clinical-use and comparative-outcome evidence, not proof of paid customer retention. A customer-journey
              source reports surgeon training through Meril Academy and a global network, while official company
              material says orthopaedic implants are used in over 50 countries. The source set does not independently
              verify the number of active hospitals, repeat purchasing, renewal, or production-versus-pilot status for
              named accounts.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU006
              - CU014
      - number: '6.3'
        title: Durability, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Meril's expansion engine appears to combine broader geography, new products, clinical evidence, and
              clinician training. ICRA says increased penetration in existing markets and improving geographic presence
              drove FY2025 growth, while new products such as IVL and Mitral Clip provide revenue visibility. The same
              report identifies a customer-side working capital burden: multi-SKU stocking across geographies and
              extended credit to channel partners contributed to net working capital equal to about 53.8% of operating
              income in FY2025, with inventory holding of 212 days. It also notes pricing pressure in some stents and
              orthopaedic implants and regulatory exposure. These are important limits on expansion quality: geographic
              reach can require inventory and receivable funding, and channel penetration can reduce cash conversion.
              There is no disclosed NRR, GRR, churn, contract-length, cohort, account-level concentration, or
              distributor economics in the assigned evidence. Those missing denominators prevent a durable-retention or
              land-and-expand conclusion. Independent news indexing also shows scrutiny of Meril's stent-pricing request
              and product-improvement claims, but the available index does not establish a complaint outcome or failed
              deployment.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Clinical and geographic reach are real adoption signals
            body: >-
              Myval has reported use across a 31-centre, 16-country randomised trial, while ICRA reports product sales
              in more than 150 countries and high export contribution; these support reach, but not account-level
              retention.
            calloutType: strength
            claimRefs:
              - CU003
              - CU006
              - CU007
          - type: callout
            title: Customer durability is not measurable from disclosed data
            body: >-
              No assigned source discloses active customer count, revenue concentration, repeat-purchase or renewal
              cohorts, NRR/GRR, churn, or contract length; these are material diligence gaps for an institutional device
              supplier.
            calloutType: risk
            claimRefs:
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Financial and operational exposure
        blocks:
          - type: paragraph
            body: >-
              ICRA's December 2025 rationale depicts rapid growth alongside structurally heavy cash absorption.
              Consolidated FY2025 revenue rose 40.3% year over year and operating margin reached 26.4%, but net working
              capital was 53.8% of operating income, inventory holding was 212 days, and working-capital debt was Rs.
              1,690.5 crore. Meril also incurred about Rs. 600 crore of FY2025 capital expenditure and planned another
              Rs. 500-600 crore for FY2026, with timely commissioning and ramp-up identified as monitorables. The
              relevant downside is therefore not an accounting loss today; it is that inventory, dealer credit, and new
              capacity absorb cash faster than operating growth releases it. Monthly SKU turns, receivable aging,
              facility commissioning, utilization, and incremental contribution margin are the decisive monitoring
              indicators.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR008
              - CR013
              - CR015
      - number: '7.2'
        title: Regulatory and product exposure
        blocks:
          - type: paragraph
            body: >-
              Meril operates across device categories whose approval, pricing, and liability regimes can directly affect
              economics. ICRA identifies price restrictions, approval timelines, compliance requirements, and medical
              liability from faulty products as recurring exposures; it also reports that India's NPPA regulates stents
              and knee implants. Independent background on India's Medical Devices Rules describes a risk-based approval
              structure in which higher-risk devices face more stringent review. Product-liability insurance mitigates
              only part of this exposure: it does not eliminate recall costs, remediation, approval delays, or
              reputational damage. Because the assigned evidence does not provide a complete recall, complaint,
              cybersecurity, or quality-deviation history, those matters remain unverified rather than presumed absent.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
      - number: '7.3'
        title: Myval patent litigation
        blocks:
          - type: paragraph
            body: >-
              The retained legal evidence supports a mixed assessment. Fenwick and WilmerHale describe a favorable U.S.
              Federal Circuit outcome: importing two Myval systems to recruit investigators for an FDA clinical trial
              fell within the statutory safe harbor, and rehearing en banc was declined. That outcome narrows one U.S.
              issue but is not a global clearance. ICRA reported continuing Myval proceedings in some other geographies
              and cumulative legal costs of Rs. 500-550 crore as of March 31, 2025, with future revenue and liquidity
              consequences possible after an adverse ruling or significant settlement. Underwriting therefore requires a
              jurisdiction-by-jurisdiction docket, injunction, royalty, settlement, and product-revenue map rather than
              extrapolation from the U.S. decision.
            claimRefs:
              - CR009
              - CR010
      - number: '7.4'
        title: Dependencies, residual exposure, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              Export and channel scale broaden Meril's opportunity while increasing execution dependencies. ICRA
              reported that exports generated about 61% of consolidated FY2025 revenue and warned that adverse
              foreign-currency movements could affect profitability. Meril's European site separately claims operations
              in more than 100 countries, 9,000-plus customers, and 2,600-plus channel partners, while official product
              pages show a portfolio spanning multiple regulated device families. None of those company-issued scale
              claims establishes country, distributor, or customer concentration. The clearest thesis-break indicators
              are a material adverse Myval decision or settlement, sustained weakening in debt protection or
              working-capital intensity, failure to ramp funded capacity, or evidence that channel credit and inventory
              are not converting to cash.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR010
              - CR011
              - CR012
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR007
              - CR008
              - CR010
              - CR011
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break combination
            body: >-
              A material adverse Myval ruling or settlement combined with weaker cash conversion or delayed capacity
              ramp-up would challenge both revenue durability and expansion economics.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR010
              - CR014
          - type: callout
            title: Public-evidence boundary
            body: >-
              Customer and distributor concentration, recall history, cybersecurity incidents, product-level legal
              exposure, and facility-level cash returns are not established by the assigned public evidence.
            calloutType: assumption
            claimRefs:
              - CR012
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case is an unusually broad private medtech platform with cardiovascular, orthopaedics,
              diagnostics and endo-surgery exposure, a global export footprint and evidence of operating leverage. ICRA
              reports consolidated FY2025 revenue of Rs. 4,902.9 crore, up 40.3% year over year, with operating margin
              of 26.4%; it also reports Q1 FY2026 revenue of Rs. 1,416 crore, up about 30.6% year over year. The
              counter-case is that growth consumes capital and working capital: FY2025 capex was about Rs. 600 crore,
              net working capital to operating income was about 53.8%, and total debt was Rs. 2,592 crore at March 31,
              2025. Myval patent litigation, pricing regulation, foreign-exchange exposure and incomplete
              private-company disclosure make a price-insensitive quality judgment unsafe.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV012
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV012
              - CV013
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The financing record supports balance-sheet resilience but not a complete valuation conclusion. ICRA
              states that ADIA invested $200 million in H1 FY2026, of which about Rs. 860 crore was primary infusion and
              the balance was a stake sale by Bilakhia Holdings; the primary proceeds were held in bank fixed deposits
              at the report date. Earlier ICRA coverage records Rs. 1,900 crore of FY2023 private-equity investment,
              including CCPS, but the current pool does not provide a complete cap table, conversion terms or the price
              per share. A buyer should therefore require the fully diluted ownership schedule, CCPS preferences, ADIA
              rights, debt-like obligations and current transaction price before underwriting a return. Public medtech
              references can frame scale, not establish a private Meril multiple: Medtronic's October 2026 market
              capitalization is a large-company benchmark with materially different disclosure, scale and liquidity.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
              - CV008
              - CV012
              - CV013
              - CV015
              - CV017
      - number: '8.3'
        title: Scenarios, recommendation and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              The bull case requires sustained export growth, successful capacity ramp-up, durable Myval
              commercialization and legal containment while the ADIA primary cash is converted into productive growth
              without leverage deterioration. The base case assumes continued revenue growth but recognizes high
              inventory and receivable intensity, planned FY2026 capex of Rs. 500–600 crore, pricing pressure and
              ongoing litigation cost. The bear case is an adverse Myval outcome or commercialization setback combined
              with weaker margins, slower working-capital turns or additional debt-funded capex. Because the current
              pool does not disclose an investable entry price or a reliable exit multiple, scenario ranges would create
              false precision; the recommendation is track, with a potential upgrade only after price and preference
              diligence. Thesis-break triggers are a sustained deterioration in debt protection, an adverse litigation
              outcome affecting Myval revenue, or failure to ramp new capacity.
            claimRefs:
              - CV012
              - CV013
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs: []
      - number: '8.4'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Meril has credible strategic and public-market comparability inputs, but exit readiness is not the same as
              IPO readiness. The evidence shows a private group with international regulatory approvals, diversified
              devices and a recent institutional investment, while leaving material questions on audited segment
              economics, shareholder rights, customer concentration, realised pricing and litigation reserves. The next
              diligence package should reconcile consolidated ICRA figures to audited statements, obtain the current
              capitalization and preference waterfall, test Myval revenue by affected geography, and review capacity
              utilization, inventory aging and distributor receivables. Until that package is complete, capital should
              be staged or priced with a substantial information discount rather than justified by headline growth.
            claimRefs:
              - CV017
              - CV018
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale is investable evidence, not a valuation
            body: >-
              ICRA's FY2025 revenue, margin and export data support a scaled operating platform, while the recent ADIA
              primary infusion supports funding capacity.
            calloutType: strength
            claimRefs:
              - CV001
              - CV003
              - CV007
          - type: callout
            title: Price discovery is the gating issue
            body: >-
              A current transaction price, fully diluted ownership schedule and preference waterfall are not disclosed
              in the assigned evidence, so a precise multiple or return target would be misleading.
            calloutType: risk
            claimRefs:
              - CV009
              - CV010
          - type: callout
            title: Track pending price-sensitive diligence
            body: >-
              Maintain a Track stance until audited segment economics, legal exposure, cash conversion and
              investor-rights terms can support a price-sensitive underwriting decision.
            calloutType: recommendation
            claimRefs:
              - CV015
              - CV017
              - CV018
