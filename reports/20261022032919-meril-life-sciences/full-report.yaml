      Items are ordered by reported dollar scale and are not a mathematical funnel or additive market bridge; the broad
      market, diagnostic-equipment subset, and coronary-stent subset use different periods and methodologies.
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM010
  - id: FP001
    title: Competitive evidence positioning
    type: quadrant
    summary: >-
      The ordinal map compares breadth and depth in the retained evidence, not actual market share or product
      performance.
    data:
      points:
        - label: 'Meril: independent rating evidence'
          x: 9
          'y': 8
          detail: Broad portfolio and current commercial evidence across CARE and ICRA reports
        - label: 'Meril: official product evidence'
          x: 7
          'y': 4
          detail: Broad company-issued product claims with limited independent comparison
        - label: Abbott Navitor
          x: 3
          'y': 5
          detail: Product-specific approval and design evidence from Abbott only
        - label: Medtronic
          x: 1
          'y': 1
          detail: Retained page provides meeting logistics but no comparable product evidence
        - label: Domestic competitor class
          x: 2
          'y': 3
          detail: ICRA confirms domestic competition without naming or quantifying peers
        - label: Imported-device status quo
          x: 4
          'y': 2
          detail: Meril cites high import reliance; product-level comparisons are unavailable
    approximationNotes: >-
      x is an ordinal 1-10 score for breadth in the retained source set and y is an ordinal 1-10 score for depth of
      commercial or regulatory evidence. Coordinates are analyst synthesis, not market share, price or performance
      measurements.
    claimRefs:
      - CP002
      - CP004
      - CP010
      - CP011
      - CP015
      - CP016
  - id: FI001
    title: Evidence-backed revenue-to-cash conversion
    type: flow
    summary: >-
      Meril's reported device scale converts through export and distributor channels into operating profit, but working
      capital and capex absorb substantial cash.
    data:
      nodes:
        - id: activity
          label: Device demand and market penetration
          value: FY2025 operating income Rs. 4,902.9 crore
          tone: positive
        - id: portfolio
          label: Cardio, orthopaedic and other medical devices
          value: Products sold in more than 150 countries
          tone: neutral
        - id: channels
          label: Export, dealer and distributor channels
          value: Exports about 61% of consolidated FY2025 revenue
          tone: neutral
        - id: margin
          label: Operating profit
          value: 26.4% operating profitability in FY2025
          tone: positive
        - id: working-capital
          label: Inventory and receivables
          value: NWC/OI 53.8%; inventory 212 days
          tone: risk
        - id: reinvestment
          label: Capacity expansion
          value: FY2026 planned capex Rs. 500-600 crore
          tone: risk
    claimRefs:
      - CI001
      - CI003
      - CI005
      - CI010
      - CI011
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Meril's product platform links development, manufacturing, regulatory clearance, and clinical distribution across
      multiple device verticals.
    data:
      layers:
        - label: Clinical product verticals
          detail: >-
            Cardiovascular, orthopaedics, endosurgery, diagnostics, and ENT products address distinct clinical
            workflows.
          modules:
            - Cardiovascular devices
            - Orthopaedic implants
            - Endosurgery
            - Diagnostics and ENT
        - label: Product and technology development
          detail: R&D, clinical evidence, and robotics support product design and procedure-specific workflows.
          modules:
            - R&D and clinical evidence
            - MISSO robotics
            - HandX robotics
        - label: Industrial and quality backbone
          detail: >-
            Manufacturing and backward integration supply products and selected critical components under regulatory
            controls.
          modules:
            - Manufacturing and backward integration
            - Regulatory and quality controls
        - label: Clinical and regulatory evidence
          detail: >-
            Clinical studies, approvals, and certifications enable product commercialization but require product-level
            reconciliation.
          modules:
            - Clinical studies
            - DCGI
            - CE
            - USFDA
        - label: Post-market support
          detail: Complaint handling, training, maintenance, and vigilance are required to sustain safe clinical use.
          modules:
            - Service
            - complaint handling
            - post-market surveillance
        - label: Market delivery
          detail: >-
            Regional entities and distributors deliver products to hospitals, clinicians, and patients across domestic
            and export markets.
          modules:
            - Domestic distribution
            - Export distribution
            - Training and support
    approximationNotes: >-
      The map is a synthesis of disclosed product and operating layers; it does not imply that every product uses every
      layer or that all controls are publicly verified.
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE007
      - CE008
  - id: FU001
    title: Customer journey from clinical evidence to expansion
    type: journey-map
    summary: >-
      Clinical validation and clinician enablement can support institutional adoption and geographic expansion, but
      retention and concentration remain unobserved.
    data:
      nodes:
        - id: clinical-need
          label: Unmet clinical need
          detail: Meril's official product surface frames the portfolio around unmet clinical needs.
        - id: clinician-evaluation
          label: Clinician evaluation
          detail: Clinicians and surgeons are professional users and adoption gatekeepers.
        - id: clinical-proof
          label: Clinical proof
          detail: LANDMARK enrolled 768 patients across 31 centres in 16 countries.
        - id: hospital-procurement
          label: Hospital procurement
          detail: Hospitals and healthcare centres are described as channels.
        - id: channel-expansion
          label: Geographic/channel expansion
          detail: ICRA reports products sold in over 150 countries and 61% export revenue in FY2025.
        - id: retention-gap
          label: Retention and concentration gap
          detail: NRR, churn, renewal, active accounts, and top-customer shares are not disclosed.
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU006
      - CU014
  - id: FR001
    title: Risk heatmap
    summary: >-
      Current cash-intensity risk and forward legal, regulatory, and capacity-ramp risks carry the largest disclosed
      downside.
    type: matrix
    data:
