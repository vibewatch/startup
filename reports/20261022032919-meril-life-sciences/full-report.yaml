        title: Leadership, capital, and operating scale
        blocks:
          - type: paragraph
            body: >-
              The available evidence supports Bilakhia Group as the promoter group and identifies extensive promoter
              experience, but it does not provide a complete current founder, executive, or board roster. ICRA reports
              consolidated revenue growth of 40.3% year over year to Rs. 4,902.9 crore in FY2025. The same report
              records a $200 million ADIA investment in H1 FY2026, split between about Rs. 860 crore of primary infusion
              and a Bilakhia Holdings stake sale, with the primary proceeds then held in bank fixed deposits. A separate
              news account describes the transaction as a 3% stake at a $6.6 billion valuation, subject to regulatory
              approval. The valuation is therefore transaction-implied, and the full post-transaction ownership and
              shareholder-rights map remains unavailable.
