chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Meril Life Sciences is presented in the retained material as an Indian medical-device group headquartered
              in Vapi, Gujarat, and associated with the Bilakhia Group. Its operating scope spans cardiovascular and
              structural-heart products, orthopaedic implants, endo-surgery, diagnostics, and surgical robotics. ICRA
              evaluates Micro Life Sciences and its Meril subsidiaries on a consolidated basis because of common
              management and significant financial linkages, describing the subsidiaries as operational arms with
              separate legal existence. Retained company pages describe an internally manufactured portfolio intended to
              address unmet clinical needs, while ICRA's December 2025 report states that the group's cardio and
              orthopaedic products were sold in more than 150 countries and exports represented 61% of consolidated
              FY2025 revenue.
            claimRefs:
