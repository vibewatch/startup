  - id: TV003
    title: Bull, base and bear scenario logic
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation or return logic
      - Probability signal
      - Key risk
    rows:
      - - Bull
        - Export growth persists; new products scale; capacity ramps; Myval litigation is contained
        - Higher-quality growth could support a premium medtech multiple, but entry price remains required
        - Low-to-medium
        - Legal or regulatory reversal
      - - Base
        - Growth continues; margins remain healthy; working capital and capex stay elevated
        - Track until price, dilution and cash conversion support an acceptable return
        - Medium
        - Working-capital drag and capex execution
      - - Bear
        - Myval restrictions or adverse outcome; pricing pressure; slower ramp; leverage rises
        - Downside protection requires a lower entry price and contractual protections
        - Medium
        - Revenue loss, settlement or margin compression
      - - Price test
        - Current transaction price and fully diluted shares are obtained
        - Compare implied EV/revenue and EV/operating-profit with appropriate public and private references
        - Required
        - False precision without audited denominators
      - - Capital test
        - Preference, liquidation and ADIA rights are reviewed
        - Model ordinary-equity proceeds after preference waterfall and dilution
        - Required
        - Preference overhang
      - - Cash test
        - Inventory, receivables and capex bridge reconcile to cash
        - Use cash conversion rather than revenue growth alone in return underwriting
        - Required
        - Funding need exceeds headline cash
      - - Legal test
        - Affected Myval geographies and costs are quantified
        - Haircut affected revenue and add expected legal cash costs to downside
        - Required
        - Unpriced litigation tail
      - - Exit test
        - Audited reporting and exit route become credible
        - Stage capital against milestones rather than assume IPO liquidity
        - Required
        - No reliable exit window
    notes: >-
      These are directional scenario gates, not model-derived valuation ranges, because the assigned evidence does not
      disclose a current Meril equity price, fully diluted share count or complete preference terms.
    claimRefs:
