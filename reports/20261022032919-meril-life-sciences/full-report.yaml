      - number: '1.3'
        title: Milestones, risks, and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              Meril's reported trajectory combines product development, international regulatory progress, export
              expansion, and capacity investment. Retained material records MeRes100 approval and a 2019 EuroPCR
              evidence milestone, a 2023 Japan Lifeline agreement, and FY2025 capex of about Rs. 600 crore followed by
              planned FY2026 capex of Rs. 500-600 crore. The risk picture is not theoretical: ICRA identifies elevated
              working-capital intensity, foreign-exchange sensitivity, and ongoing Myval patent litigation that had
              accumulated Rs. 500-550 crore of legal costs by March 2025. An Economic Times index entry dated 20 October
              2026 reports withdrawal of three Meril coronary-stent models in Sri Lanka after performance issues and an
              investigation; this item requires direct regulatory and product-level follow-up rather than a conclusion
              about the entire group.
