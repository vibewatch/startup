  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与采纳视角
        blocks:
          - type: paragraph
            body: >-
              Monzo
              的市场不止于“银行应用”：公司先争取客户的活期账户关系，再叠加储蓄、借贷、投资、养老金和商业银行等产品。因此，它瞄准的范围比单一数字银行更广，却没有扩展到整个消费金融市场。关键不在应用下载量，而在有多少客户把
              Monzo 作为主力银行、并把多少日常金融需求放进应用里。这也是公司重视转介绍、服务质量和产品广度的原因。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM010
      - number: '2.2'
        title: 增长驱动与制约因素
        blocks:
          - type: paragraph
            body: >-
              便利、信任和产品深度推动增长。免费活期账户、24/7 客服、以应用为先的设计和良好服务评价降低了使用门槛；转介绍增长也说明客户愿意推荐
              Monzo。与此同时，传统银行的客户忠诚度、监管复杂性和欧洲本地化要求仍是限制。Monzo
              还需证明英国模式能在爱尔兰、西班牙等市场落地，同时保住让品牌脱颖而出的简洁体验。因此，具体执行表现比“数字银行”这一宽泛标签更重要。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM006
      - number: '2.3'
        title: 市场测算的尽调研判
        blocks:
          - type: paragraph
            body: >-
              衡量 Monzo 的市场空间，最好同时看渗透率、变现能力和资产负债表规模，而不是只看一个自上而下的 TAM。公司报告的用户数从 2024 年的 12.1 million 增至 FY2026 的 15
              million，活跃客户中约半数已将 Monzo
              作为主力银行，说明增长重点正转向提升客户钱包份额。下一步机会在于提升现有客户的使用深度，并把模式复制到新市场，而不只是增加首次注册。估值更看重执行，而非赛道热度；承销则更应关注客户经济性和跨市场落地，而非市场总量的表面数字。
            claimRefs:
              - CM002
              - CM003
              - CM011
              - CM012
