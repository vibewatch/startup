            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE011
              - CE012
      - number: '5.3'
        title: 技术成熟度与系统风险
        blocks:
          - type: paragraph
            body: >-
              Monzo 的技术成熟度较高，但也有代价。Looker 的内部采用率超过 80%，公司也能推出类似 Year in Monzo
              的产品体验，说明内部工具成熟、数据使用面广。另一方面，架构复杂到让可靠性、可观测性和备份系统都成为战略议题，而非日常运维细节。尽调要看的是：Monzo
              能否在现有技术栈上继续增加产品，同时避免埋下只在故障或快速扩张时才暴露的脆弱依赖。风险不只是缺少某项功能，更在于运维复杂度不断累积；受监管的技术栈中，许多小的流程和平台取舍也可能逐渐变成显著成本。
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
