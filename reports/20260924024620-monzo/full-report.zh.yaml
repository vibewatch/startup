chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司定位与治理架构
        blocks:
          - type: paragraph
            body: >-
              Monzo 仍是一家总部位于伦敦的数字银行，但集团架构较上次更新时更为正式。FY2026 年报和董事会资料显示，Monzo Bank Holding Group Limited 是母公司，MBHG 与 MBL
              各有独立董事会；Diana Layfield 接任集团 CEO，TS Anil 转任副董事长。Monzo
              已不只是高速增长的应用品牌，而是治理边界更清晰、董事会更完整、接班安排更明确的受监管银行集团。公司定位未变，治理格局则较上次报告有了实质变化。
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
              - CO013
              - CO014
      - number: '1.2'
        title: 业务规模、商业化与资产负债表根基
        blocks:
          - type: paragraph
            body: >-
              Monzo 已从增长型应用发展成一家规模化盈利的银行。FY2026 营收为 £1.7 billion，调整后税前利润为 £172.6 million；四条不同收入线各自超过 £300 million，存款达到
              £25.7 billion。公司报告称，个人和商业银行客户合计约 15 million，活跃客户中约半数把 Monzo
              作为主力银行。客户关系加深有利于扩大钱包份额，但产品越铺越广，服务中断、监管审查和资本配置的影响也越大。
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO008
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO007
              - CO009
      - number: '1.3'
        title: 里程碑与尽调研判
        blocks:
          - type: paragraph
            body: >-
              FY2026 的几项进展改变了尽调重点：Monzo 持爱尔兰银行牌照进入欧洲、收购 Habito，并继续拓展商业银行、投资、养老金和 16 岁以下账户业务。公开资料仍将最新披露估值列在约 $5.2
              billion。该估值可作参考，但 Monzo
              仍未上市，融资轮也已是一年多前，不能视为当前承销定价。本次评估因此要同时权衡更扎实的盈利基础、跨国扩张的执行与监管风险，以及估值仍依据第三方报道、并非公司最新申报这一事实。
