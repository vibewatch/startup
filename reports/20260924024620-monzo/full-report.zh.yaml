        title: 用户体验、客服支持与摩擦节点
        blocks:
          - type: paragraph
            body: >-
              用户体验仍是 Monzo 最突出的差异化优势之一。免费账户、24/7
              客服、简便开户和整体正面的评价都为品牌加分。但高曝光也让服务问题更难掩盖：当用户把它作为主力账户时，宕机、应用故障或客服延迟都会迅速公开，影响也更大。尽调要问的是，Monzo
