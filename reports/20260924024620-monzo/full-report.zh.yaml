              - CE011
  - number: 6
    title: 客户群体
    sections:
      - number: '6.1'
        title: 客群细分与采纳趋势
        blocks:
          - type: paragraph
            body: >-
              Monzo 的客户群覆盖个人消费者、企业、借款人、储户，也通过 Monzo for Under 16s 服务年轻客群。FY2026 的变化不只是客户数达到约 15 million，更是越来越多客户把 Monzo
              当作主力银行，而非备用消费应用。主力银行客户可能留存更多存款、使用更多产品，也更愿意推荐服务，这些因素会逐步积累客户价值。客户群还包括领薪人群、线上交易用户和家庭，各类客户的行为未必相同。客群也并非一成不变：从偶尔消费转向工资入账，通常才是账户价值持久化的关键。
