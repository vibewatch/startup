  - id: FV001
    title: 投资建议逻辑
    type: flow
    summary: 规模、盈利与风险信号共同支撑当前的估值立场。
    data:
      nodes:
        - id: scale
          label: 规模
          type: source
          detail: 15m 客户 / £1.7bn 收入
        - id: profit
          label: 盈利能力
          type: process
          detail: £172.6m 调整后税前利润
        - id: growth
          label: 增长
          type: process
          detail: 欧洲市场 + 产品拓展
        - id: risk
          label: 风险
          type: process
          detail: 系统中断 / 监管合规 / 业务执行
        - id: valuation
          label: 一级市场估值
          type: sink
          detail: 约 $5.2bn
        - id: decision
          label: 观察 / 合理
          type: sink
          detail: 估值未见明显低估
      edges:
        - from: scale
          to: profit
        - from: profit
          to: growth
        - from: growth
          to: valuation
        - from: risk
          to: valuation
        - from: valuation
          to: decision
    approximationNotes: 该流程图仅作为估值决策辅助，并非 DCF 定价模型。
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV007
      - CV008
      - CV009
      - CV012
