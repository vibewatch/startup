        title: 用户留存与变现深度
        blocks:
          - type: paragraph
            body: >-
              多项指标显示客户关系正在加深：付费订阅用户不少，储蓄产品采用率高，借贷使用也已具规模，说明客户关系不再局限于刷卡消费。企业客户增长很快，也让 Monzo
              多了一个不只依赖消费者情绪的核心客群。尽调要看的不只是用户多不多，而是更多用户能否变得更有经济价值；客户基础的价值取决于交叉销售和留存，而非注册人数。
