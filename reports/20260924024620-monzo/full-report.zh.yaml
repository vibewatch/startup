    title: 主要风险热力图
    type: matrix
    summary: 梳理 Monzo 各项核心风险的发生概率、冲击度与残留风险程度。
    data:
      columns:
        - 可能性
        - 冲击度
        - 残留风险
      rows:
        - label: 服务宕机 / 系统降级
          values:
            - 中
            - 高
            - 高
        - label: 金融犯罪 / AML
          values:
            - 中
            - 高
            - 高
        - label: 信用坏账损失
          values:
            - 中
            - 中
            - 中
        - label: 市场竞争
          values:
            - 高
            - 中
            - 中
        - label: 欧洲业务执行
          values:
            - 中
            - 高
            - 高
        - label: 多云与自研架构
          values:
            - 中
            - 高
            - 高
    approximationNotes: 残余风险排序综合了公开披露信息与服务中断记录。
