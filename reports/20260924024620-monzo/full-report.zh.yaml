  - id: TV002
    title: 核心论点与反论点对比表
    columns:
      - 论点
      - 转向条件
    rows:
      - - 正方论点：Monzo 是已实现盈利且具规模的数字银行
        - 若利润率或营收增速大幅收窄，该论点将削弱
      - - 正方论点：主力银行份额与产品广度铸就高用户黏性
        - 若用户流失加剧或交叉销售停滞，该论点将削弱
      - - 反方论点：当前估值已充分计入成功预期
        - 若欧洲市场拓展不及预期，该担忧将加剧
      - - 反方论点：系统宕机与监管风险或削弱用户信任
        - 若宕机事件重演或风控建设滞后，该担忧将加剧
    notes: 本表属于投资决策对照表，非量化可比公司分析表。
    claimRefs:
      - CV004
      - CV007
      - CV008
      - CV009
      - CV012
    enumerationScope:
      coverage: sample
      basis: Representative subset of public evidence for Valuation as of 2026-09-24.
  - id: TV003
    title: 乐观 / 基准 / 悲观情景分析表
    columns:
      - 情景
      - 核心假设
      - 估值与回报逻辑
      - 主要风险
      - 发生概率评估
    rows:
      - - 乐观
        - 欧洲业务成功起势、主力银行份额攀升、交叉销售持续深化
        - 盈利增长驱动估值倍数扩张
        - 落地执行与监管风险
        - 取决于海外扩张验证成果
      - - 基准
        - 英国大盘稳固、欧洲推进节奏温和、估值维持在当前一级市场区间
        - 估值合理，维持跟踪
        - 主要受落地节奏影响
        - 概率最高
      - - 悲观
        - 宕机或监管冲击显现、增长放缓、欧洲业务不及预期
        - 虽有盈利但估值倍数受挤压收缩
        - 运营及监管层面的突发冲击
        - 概率低，但并非为零
    notes: 由于缺乏直接可比的公开市场标的，各情景取值主要具方向参考意义。
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV007
      - CV008
      - CV009
      - CV012
    enumerationScope:
      coverage: sample
      basis: Representative subset of public evidence for Valuation as of 2026-09-24.
figures:
  - id: FO001
    title: 公司发展里程碑时间线
    type: timeline
    summary: 记录自创立至 2026 年管理层更迭与欧洲扩张的关键节点。
    data:
      items:
        - date: '2015'
          label: 创立
          detail: Monzo 于伦敦创立，定位消费金融科技平台。
          tone: positive
        - date: '2017'
          label: 取得银行牌照
          detail: Monzo 成为受英国监管的持牌银行。
          tone: positive
        - date: 2023-04
          label: MBHG 设立
          detail: Monzo Bank Holding Group Limited 成为集团控股母公司。
          tone: neutral
        - date: 2024-05
          label: 融资轮次
          detail: CNBC 报道融资 $610m，估值约 $5.2bn。
          tone: positive
        - date: 2026-02
          label: CEO 交接
          detail: Diana Layfield 接任集团 CEO。
          tone: neutral
        - date: 2026-FY
          label: 进军欧洲市场
          detail: 爱尔兰银行牌照、收购 Habito 和西班牙扩张规划共同勾勒下一阶段。
          tone: positive
    approximationNotes: 本时间线仅为公开披露里程碑的简明纪年，并非详尽的企业编年史。
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO009
      - CO010
  - id: FM001
    title: 市场规模分层测算视角
    type: pyramid
    summary: 从英国银行业大盘逐层聚焦到 Monzo 的主力银行渗透和欧洲扩张机会。
    data:
      items:
        - label: 英国成年人
          value: TAM
          detail: 有活期账户需求且偏好移动优先体验的消费客群。
        - label: 已触达的英国个人与企业客群
          value: ~1 in 5 / ~1 in 7
          detail: Monzo 当前披露的渗透客群基数。
        - label: 将 Monzo 视作主力银行的活跃客户
          value: ~50%
          detail: 核心账户采用深度的关键指标。
        - label: 储蓄、信贷与投资等相邻业务
          value: 3.5m+ / 4.1m / 1.6m+
          detail: 英国存量客群内部的交叉销售层次。
        - label: 中小企业银行业务
          value: 905k
          detail: 商业银行业务立足点。
        - label: 进军欧洲市场
          value: Ireland + Spain
          detail: 下一层级地域扩张。
    approximationNotes: 这是受边界约束的市场分析视角，并非正式 TAM 模型。
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM007
      - CM011
  - id: FP001
    title: 竞争格局定位图
    type: quadrant
    summary: 依 App 功能宽度与主力银行黏性深度描绘竞品分布。
    data:
      xAxis:
        label: App 业务广度 / 产品组合深度
      yAxis:
        label: 主力银行黏性深度 / 信任度
      points:
        - label: Monzo
          x: 8
          'y': 8
          detail: 主力银行黏性深厚，业务广度持续扩张
        - label: Revolut
          x: 9
          'y': 7
          detail: 产品矩阵宽广，兼具国际化规模优势
        - label: Starling
          x: 7
          'y': 8
          detail: 具有深厚银行业信誉的英国挑战者银行
        - label: Barclays / NatWest / HSBC
          x: 9
          'y': 9
          detail: 传统大行兼具广度与信任，但交互体验陈旧
        - label: 维持现状
          x: 2
          'y': 1
          detail: 无 App 差异化能力
        - label: 现金 / 卡片 / 网点
          x: 4
          'y': 3
          detail: App 深度有限的传统兜底渠道
    approximationNotes: 坐标位置依据证据按序评分，并非实测基准。
    claimRefs:
      - CP001
      - CP002
      - CP004
      - CP005
      - CP006
      - CP011
  - id: FI001
    title: 商业变现模式推演图
    type: flow
    summary: 展现客户行为如何转化为 Monzo 营收与利润。
    data:
      nodes:
        - id: customers
          label: 客户基数
          type: source
          detail: 15m 客户总数
        - id: spend
          label: 刷卡消费与存款沉淀
          type: process
          detail: 刷卡手续费和存款资金收益
        - id: subs
          label: 订阅业务
          type: process
          detail: 付费套餐及增值升级
        - id: lend
          label: 信贷业务
          type: process
          detail: 透支额度、信用卡与个人贷款
        - id: other
          label: 资金运作及其他
          type: process
          detail: 利息收入及其他资产负债表收益
        - id: profit
          label: 调整后税前利润（PBT）
          type: sink
          detail: FY2026 达 £172.6m
      edges:
        - from: customers
          to: spend
        - from: customers
          to: subs
        - from: customers
          to: lend
        - from: customers
          to: other
        - from: spend
          to: profit
        - from: subs
          to: profit
        - from: lend
          to: profit
        - from: other
          to: profit
    approximationNotes: 该图展现业务逻辑架构，未对各项具体收入占比进行精确拆分。
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI011
      - CI012
  - id: FE001
    title: 产品架构分层图
    type: stack
    summary: 从用户交互界面到底层基础设施分层呈现 Monzo 的产品与技术架构。
    data:
      layers:
        - label: 客户端 App 与客服支持
          detail: 手机银行、即时客服与开户注册
        - label: API 与服务层
          detail: 后端微服务与鉴权体系
        - label: 数据摄取与流处理
