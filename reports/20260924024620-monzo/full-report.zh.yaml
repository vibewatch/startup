  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品功能矩阵
        blocks:
          - type: paragraph
            body: >-
              Monzo 仍以应用体验为产品核心，但服务范围已明显扩大。客户可以使用免费活期账户、24/7 应用内客服、储蓄工具和
              Pots、ISA，也能存入现金与支票；整个流程强调快捷、少折腾。年报显示，这套应用如今支撑的是规模庞大的银行业务，而非单一消费卡产品。要深化客户关系、扩大主力银行份额，关键已不只是界面设计，还包括产品覆盖面。
            claimRefs:
              - CE001
              - CE002
              - CE012
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE012
      - number: '5.2'
        title: 工程与数据平台
        blocks:
          - type: paragraph
            body: >-
              Monzo 公开的工程资料显示，其平台建设已相当成熟。后端服务由 API 驱动，数据架构以流处理为先，技术栈横跨 AWS 生产环境和 GCP 分析环境。规模也不小：有 4,700 多个 dbt 模型、约
              600,000 行 SQL；每日重建模型时可能涉及数十 TB 数据。这套平台有利于快速试验和迭代，但要持续守住可靠性、数据治理和开发者体验，团队也得投入相当精力。
