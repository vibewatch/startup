  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接与邻近替代方案
        blocks:
          - type: paragraph
            body: >-
              Monzo 面对的不是单一类型的竞争者。对手既有拥有网点和广泛产品线的传统银行，也有 Starling、Revolut 等应用原生挑战者；现金、信用卡和“继续用原来的主力银行”也都是替代选择。Monzo
              年报明确指出，竞争来自传统银行和挑战者两方。竞争关键不是“银行应用对老牌银行”，而是谁能赢得主力银行关系、客户信任和更多产品使用。
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
      - number: '3.2'
        title: Monzo 的差异化优势
        blocks:
          - type: paragraph
            body: >-
              Monzo
              的优势仍是用户体验和使用习惯。免费账户、清晰收费、良好服务评价和以应用为中心的流程，有助于获客并保持活跃。但这项优势并不稳固：传统银行能捆绑更多产品，挑战者可以复制功能，服务中断也会迅速招致不满。真正的问题不是
              Monzo 的应用好不好，而是它能否把用户偏好转成主力银行关系，并在对手追上之前加深多产品使用。借贷和中小企业业务尤其如此：表面功能容易模仿，信任和分销能力却未必相同。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP006
      - number: '3.3'
        title: 护城河韧性与风险
        blocks:
          - type: paragraph
            body: >-
              Monzo 的护城河靠客户信任、产品广度和转换成本支撑。Trustpilot 评论和社区反馈总体有利于品牌，Monzo Business
              的增长也显示它能拓展相邻客群。但借贷、商业银行和欧洲市场竞争最激烈，对手已有规模或本地牌照优势。竞争风险会随业务而变：价格和功能容易复制的领域风险最高；主力银行关系和独特客服模式能持续累积的领域风险较低。这样的护城河不是永久壁垒，而是每年都要靠执行力续上的差距。
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
