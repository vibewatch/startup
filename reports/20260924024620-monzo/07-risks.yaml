company:
  name: Monzo
chapter:
  number: 7
  title: Risks
  summary: Monzo’s biggest risks are operational continuity, regulatory and financial-crime scrutiny, and the visibility of
    outages as the bank becomes more primary-bank dependent.
sections:
- id: risk-landscape
  title: Risk landscape
  body: The risk story is broader than outages, but outages are the most visible symptom. Monzo’s annual report explicitly
    calls out competition, financial crime, credit, conduct, and operational risk. That means the company is not only managing
    a consumer app; it is managing a regulated bank whose failures can affect deposits, payments, and customer trust. As primary-bank
    share rises, every incident matters more because customers rely on Monzo for everyday financial operations rather than
    for a niche spend category.
  claimRefs:
  - CR001
  - CR005
  - CR006
  - CR007
  - CR011
  tableRefs:
  - TR001
- id: operational-fragility
  title: Operational fragility and outages
  body: Recent outage coverage reinforces that the service-risk bucket is real. Monzo has had incidents where customers saw
    degraded app performance, platform issues, and backup-bank activation, and customers quickly took to forums and social
    channels to complain. That is not unusual for a digital bank, but it is more damaging when the company is increasingly
    a primary account. The relevant diligence question is not whether outages happen at all; it is whether Monzo can recover
    quickly enough and communicate clearly enough to keep trust from eroding over time.
  claimRefs:
  - CR002
  - CR003
  - CR004
  - CR010
  - CR012
  tableRefs:
  - TR002
- id: mitigation-and-priorities
  title: Mitigations and priorities
  body: 'Monzo does have mitigations: a stand-in bank, a visible status posture, and a risk framework that the annual report
    says is actively managed. But the mitigation story only works if the company keeps improving resilience while expanding
    internationally and adding more lending and SME complexity. That is why the best risk view is a prioritization exercise.
    The highest priority risks are operational continuity, financial crime, and competitive pressure because those can hit
    both trust and economics at the same time. The practical priority order is to harden the highest-frequency failure modes
    first, keep remediation owners explicit, and measure whether controls actually reduce repeat incidents over time rather
    than just creating more documentation. That framing is especially important in a bank because small process failures can
    cascade into complaints, regulatory scrutiny, and remediation cost. Repeatable controls matter.'
  claimRefs:
  - CR003
  - CR005
  - CR006
  - CR008
  - CR009
  - CR011
  tableRefs:
  - TR003
  figureRefs:
  - FR001
