company:
  name: Monzo
chapter:
  number: 4
  title: Financials
  summary: Monzo is now a profitable, deposit-funded bank with diversified revenue streams, but investors still need better
    visibility into unit economics and capital return durability.
sections:
- id: revenue-model
  title: Revenue model and monetization
  body: Monzo’s financial profile has clearly moved beyond a simple interchange story. FY2026 revenue of £1.7 billion came
    from a diversified mix of interchange, subscriptions, lending, and other interest-bearing or treasury-driven streams,
    and the company says four separate revenue streams each cleared £300 million. That matters because it reduces dependence
    on any single product and gives the business more room to absorb pricing pressure in one line while growing another. The
    key financial question is now not whether Monzo can make money, but how durable each revenue stream is as competition,
    regulation, and product mix evolve.
  claimRefs:
  - CI001
  - CI003
  - CI004
  - CI011
  tableRefs:
  - TI001
  figureRefs:
  - FI001
- id: margin-and-capital
  title: Margin profile and capital footing
  body: The margin story is favorable but not finished. Gross profit of about £1.0 billion and adjusted profit before tax
    of £172.6 million show meaningful operating leverage, yet the company still spends heavily on growth, support, and product
    development. Deposits of £25.7 billion and the bank’s profit trajectory suggest that capital is less of an existential
    issue than it once was, but precise stress metrics and runway data are not public. The financial diligence takeaway is
    that Monzo can fund a lot of its own expansion, but investors still need to understand how much of the current margin
    profile is structural versus cyclical.
  claimRefs:
  - CI002
  - CI007
  - CI008
  - CI012
  tableRefs:
  - TI003
- id: pricing-and-gaps
  title: Pricing, unit economics, and gaps
  body: The published unit-economics picture is stronger than in prior refreshes, but there are still gaps. ARPAC rose to
    £167 for personal banking and £484 for business banking, suggesting the platform gets more valuable as customers adopt
    more products. At the same time, the private-company valuation remains a third-party estimate, and the exact path from
    gross profit to long-run capital returns is still not fully disclosed. This means the underwriting job is less about proving
    that Monzo can grow and more about proving that growth can keep compounding through higher-value products without introducing
    hidden credit or operational drag. The valuation question is therefore mostly about sustainment and execution, not survival.
  claimRefs:
  - CI005
  - CI006
  - CI009
  - CI010
  - CI011
  - CI013
  tableRefs:
  - TI002
