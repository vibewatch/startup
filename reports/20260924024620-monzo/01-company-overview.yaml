company:
  name: Monzo
chapter:
  number: 1
  title: Company Overview
  summary: Monzo has become a profitable, multi-product digital bank with a more formal group structure, refreshed leadership,
    and continued expansion into Europe.
sections:
- id: identity-governance
  title: Identity and governance
  body: Monzo remains a London-based digital bank with a more formal group structure than in the prior refresh. The FY2026
    annual report and board page show Monzo Bank Holding Group Limited as the parent, separate MBHG and MBL boards, and a
    leadership transition in which Diana Layfield became Group CEO while TS Anil moved into a vice-chair role. That combination
    matters because the company is no longer only a fast-growing app brand; it is a regulated banking group with clearer governance
    boundaries, a broader board, and more obvious succession coverage. The identity picture is therefore stable, but the governance
    picture is materially different from the prior report.
  claimRefs:
  - CO001
  - CO002
  - CO003
  tableRefs:
  - TO002
- id: scale-and-footing
  title: Scale, monetization, and balance sheet footing
  body: 'The business now looks like a scaled, profitable bank rather than a pure growth story. FY2026 revenue of £1.7 billion
    and adjusted profit before tax of £172.6 million are supported by a broader revenue mix, including four revenue streams
    above £300 million each, while deposits reached £25.7 billion. Customer counts also matter: Monzo reported roughly 15
    million customers across personal and business banking, with around half of active users treating Monzo as their primary
    bank. Those figures imply deeper wallet share, but they also raise the stakes for outages, regulatory scrutiny, and capital
    allocation as the product suite widens.'
  claimRefs:
  - CO004
  - CO005
  - CO006
  - CO008
  tableRefs:
  - TO001
- id: milestones-and-diligence
  title: Milestones and diligence takeaways
  body: FY2026 added several milestones that change the diligence posture. Monzo entered Europe with a banking licence in
    Ireland, acquired Habito, and kept pushing into business banking, investments, pensions, and under-16s accounts. At the
    same time, public trackers still place the latest disclosed valuation at about $5.2 billion, which is useful but not definitive
    for underwriting because the company remains private and the round is now over a year old. The refreshed thesis therefore
    needs to weigh the stronger earnings base against expansion execution, regulatory risk, and the fact that valuation is
    still sourced from third-party reporting rather than a new company filing.
  claimRefs:
  - CO009
  - CO010
  - CO011
  - CO012
  tableRefs:
  - TO003
  figureRefs:
  - FO001
