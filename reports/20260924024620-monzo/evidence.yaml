    whyItMatters: >-
      The sampled table should not be mistaken for a full cohort analysis, especially given the diversity of customer
      usage patterns.
    diligencePath: Pull more cohort or retention evidence from product analytics, customer interviews, or independent usage studies.
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: TR001 outage-risk register
    missingEvidence: A fuller set of independently reported outage and complaint examples to complete the risk register.
    whyItMatters: >-
