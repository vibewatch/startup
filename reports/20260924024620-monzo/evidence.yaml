  - type: missing-source
    severity: minor
    topic: investor-map
    missingEvidence: A current cap-table or investor disclosure that enumerates all economic stakeholders.
    whyItMatters: Investor mapping is directional rather than exhaustive.
    diligencePath: Confirm with a current corporate registry or shareholder disclosure.
    relatedTableRefs:
