  title: Valuation
  summary: Monzo’s valuation remains anchored to a 2024 private round, but the stronger 2026 earnings base supports a fair-value
    hold rather than a cheap-entry view.
sections:
- id: valuation-anchor
  title: Current valuation anchor
  body: The current public valuation anchor is still the May 2024 fundraise, which CNBC reported at roughly $5.2 billion post-money.
    Business of Apps and Sacra continue to cite a value in the £4.5 billion / $5.9 billion range, which is close enough to
    function as the live reference point for a private company but not close enough to treat as fully current market pricing.
    The important point is that Monzo is now a profitable, scaled bank, so the valuation debate is less about whether the
    business works and more about how much execution and international expansion are already priced in.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
- id: valuation-drivers
  title: What drives the valuation debate
  body: 'The bull case is straightforward: better earnings, more product depth, more primary-bank share, and a credible path
    into Europe. The bear case is equally clear: the company is still mostly UK-based, operational incidents remain highly
    visible, and international expansion can consume capital without immediately converting into return on equity. That makes
    Monzo a “good business, timing-sensitive valuation” story rather than a simple deep value or hypergrowth story. For diligence,
    that means the key question is not whether Monzo deserves a premium, but whether the premium should be smaller or larger
    than the market’s latest private round implies.'
  claimRefs:
  - CV004
  - CV007
  - CV008
  - CV009
  tableRefs:
  - TV002
  - TV003
- id: decision-and-stance
  title: Decision stance
  body: 'On the evidence available in this refresh, the valuation stance remains fair rather than obviously cheap or stretched.
    Profitability, customer depth, and product breadth argue against a discount multiple, but the company still needs to prove
    that Europe and broader product expansion can translate into sustained return on capital. Because valuation evidence is
    still third-party-driven and the company is private, a track recommendation is still the most defensible outcome: it recognizes
    the improved fundamentals without pretending the current private round is a precise public-market equivalent. That stance
    is intentionally conservative because the report should privilege durable execution evidence over optimistic multiple
    expansion. It also leaves room for upside if execution stays strong.'
