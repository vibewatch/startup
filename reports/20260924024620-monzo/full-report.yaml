  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct and adjacent alternatives
        blocks:
          - type: paragraph
            body: >-
              Monzo does not compete against a single rival class. The real landscape includes incumbent banks with
              branches and broad product suites, app-native challengers such as Starling and Revolut, and substitutes
              such as cash, credit cards, and “do nothing / stay with my main bank.” Monzo’s own annual report
              explicitly says competition comes from both traditional and challenger banks. That is important because it
              means the moat is not a binary “bank app vs. old bank” story; it is a continuous competition for
              primary-bank share, trust, and product breadth.
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
      - number: '3.2'
        title: What Monzo does differently
        blocks:
          - type: paragraph
            body: >-
              Monzo’s edge is still user experience and habit formation. Free accounts, clear fees, strong service
              perception, and app-led workflows help it attract customers and keep them active. But the same sources
              also show why this advantage is fragile: incumbent banks can bundle more products, challengers can mirror
              features, and outage episodes create visible dissatisfaction. The right competitive question is therefore
              not whether Monzo has a good app, but whether it can keep turning app preference into primary banking and
              then into multi-product depth faster than rivals can copy the experience. That is especially true in
              lending and SME workflows, where competitors can copy visible features but still differ on trust and
              distribution.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP006
      - number: '3.3'
        title: Moat durability and risk
        blocks:
          - type: paragraph
            body: >-
              The moat depends on a mix of trust, breadth, and switching friction. Trustpilot and community feedback
              generally support the brand, while Monzo Business growth suggests the company can extend into adjacent
              segments. Still, the most exposed battlegrounds are lending, business banking, and Europe, where rivals
              already have scale or local licenses. Competitive risk should therefore be treated as dynamic: it is
              strongest where price and features are easy to replicate and weakest where Monzo can compound primary-bank
              relationships and a distinctive support model. The moat should therefore be read as an execution gap that
              must be renewed every year, not a permanent structural wall.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
