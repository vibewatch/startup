  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What Monzo ships
        blocks:
          - type: paragraph
            body: >-
              Monzo’s product is still anchored in the app experience, but the surface area has widened meaningfully.
              Customers get a free current account, 24/7 in-app support, savings tools, pots, an ISA, cash and cheque
              deposit options, and a banking experience that is designed to feel fast and low-friction. The annual
              report shows that this surface now sits on top of a much larger banking business, not just a consumer card
              play. That matters because product breadth, not just design quality, is now what determines whether Monzo
              can deepen relationships and keep primary-bank share growing.
            claimRefs:
              - CE001
              - CE002
              - CE012
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE012
      - number: '5.2'
        title: Engineering and data platform
        blocks:
          - type: paragraph
            body: >-
              Monzo’s public engineering material shows a mature platform orientation. The company uses API-driven
              backend services, a streaming-first data architecture, and a multi-cloud stack that spans AWS production
              and GCP analytics. The scale numbers are material: more than 4,700 dbt models, roughly 600,000 lines of
              SQL, and model rebuilds that can touch tens of terabytes per day. This is the sort of platform that can
              support rapid experimentation, but it is also the sort of platform that requires constant attention to
              reliability, data governance, and developer experience.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
          - type: table
            tableRef: TE002
            claimRefs:
