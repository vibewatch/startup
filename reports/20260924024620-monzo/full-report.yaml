  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segments and adoption
        blocks:
          - type: paragraph
            body: >-
              Monzo’s customer base is broad but not uniform. The company serves personal consumers, business customers,
              borrowers, savers, and a younger cohort through Monzo for Under 16s. The important shift in FY2026 is not
              just that the total customer count reached about 15 million, but that Monzo is increasingly used as a
              primary bank and not only as a secondary spending app. That change matters because primary-bank customers
              are more likely to keep deposits, adopt more products, and recommend the service to others, which
              compounds the customer base over time. A stable customer base is still a mix of wage earners, digital
              transactors, and households that may not all behave like one cohort. These segments are not static;
              migration from casual usage to salary-routing is what usually defines durable account value.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU006
              - CU007
      - number: '6.2'
        title: Retention and monetization
        blocks:
          - type: paragraph
            body: >-
              Customer depth is reflected in several conversion signals. A large base of paid subscribers, strong
              savings adoption, and meaningful borrowing usage all show that the relationship is moving beyond simple
              card spend. Business customers are also growing quickly, which gives Monzo a second core segment that is
              less dependent on consumer sentiment alone. The current customer thesis is therefore not just “lots of
              users” but “more users are becoming more economically valuable.” That is the right lens for underwriting,
              because the value of the base depends on cross-sell and retention more than raw registrations.
            claimRefs:
              - CU005
              - CU006
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU007
      - number: '6.3'
        title: Experience, support, and friction
        blocks:
          - type: paragraph
            body: >-
              The customer experience story is still one of Monzo’s strongest differentiators. Free accounts, 24/7
              support, simple onboarding, and generally positive review sentiment all support the brand. Still, the same
              visibility that makes Monzo powerful also makes it fragile: outages, app problems, or support delays are
              immediately public and disproportionately painful when the bank is a primary account. The right customer
              diligence question is whether Monzo can continue to scale service quality at the same time it pushes
              deeper into business banking, lending, and European expansion.
            claimRefs:
