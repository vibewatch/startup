      - number: '1.3'
        title: Milestones and diligence takeaways
        blocks:
          - type: paragraph
            body: >-
              FY2026 added several milestones that change the diligence posture. Monzo entered Europe with a banking
              licence in Ireland, acquired Habito, and kept pushing into business banking, investments, pensions, and
              under-16s accounts. At the same time, public trackers still place the latest disclosed valuation at about
              $5.2 billion, which is useful but not definitive for underwriting because the company remains private and
              the round is now over a year old. The refreshed thesis therefore needs to weigh the stronger earnings base
              against expansion execution, regulatory risk, and the fact that valuation is still sourced from
              third-party reporting rather than a new company filing.
