  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current valuation anchor
        blocks:
          - type: paragraph
            body: >-
              The current public valuation anchor is still the May 2024 fundraise, which CNBC reported at roughly $5.2
              billion post-money. Business of Apps and Sacra continue to cite a value in the £4.5 billion / $5.9 billion
              range, which is close enough to function as the live reference point for a private company but not close
              enough to treat as fully current market pricing. The important point is that Monzo is now a profitable,
              scaled bank, so the valuation debate is less about whether the business works and more about how much
              execution and international expansion are already priced in.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
      - number: '8.2'
        title: What drives the valuation debate
        blocks:
          - type: paragraph
            body: >-
              The bull case is straightforward: better earnings, more product depth, more primary-bank share, and a
              credible path into Europe. The bear case is equally clear: the company is still mostly UK-based,
              operational incidents remain highly visible, and international expansion can consume capital without
              immediately converting into return on equity. That makes Monzo a “good business, timing-sensitive
              valuation” story rather than a simple deep value or hypergrowth story. For diligence, that means the key
              question is not whether Monzo deserves a premium, but whether the premium should be smaller or larger than
              the market’s latest private round implies.
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
      - number: '8.3'
        title: Decision stance
        blocks:
          - type: paragraph
            body: >-
              On the evidence available in this refresh, the valuation stance remains fair rather than obviously cheap
              or stretched. Profitability, customer depth, and product breadth argue against a discount multiple, but
              the company still needs to prove that Europe and broader product expansion can translate into sustained
              return on capital. Because valuation evidence is still third-party-driven and the company is private, a
              track recommendation is still the most defensible outcome: it recognizes the improved fundamentals without
              pretending the current private round is a precise public-market equivalent. That stance is intentionally
              conservative because the report should privilege durable execution evidence over optimistic multiple
              expansion. It also leaves room for upside if execution stays strong.
            claimRefs:
