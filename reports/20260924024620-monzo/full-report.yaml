              - CE006
              - CE011
              - CE012
      - number: '5.3'
        title: Maturity and technical risk
        blocks:
          - type: paragraph
            body: >-
              The technical maturity story is good, but not free. Looker adoption above 80% and the ability to ship Year
              in Monzo-like experiences show that Monzo has strong internal tooling and broad data access. At the same
              time, the architecture is complex enough that reliability, observability, and backup systems become
              strategic rather than purely operational issues. The main diligence question is whether Monzo can keep
              layering new products on top of this stack without introducing brittle dependencies that show up only
              during outages or periods of rapid expansion. In that sense, technical risk is less about a missing
              feature and more about operational complexity compounding over time. The main risk is not a single failure
              mode but the cumulative cost of many small process and platform tradeoffs across a regulated stack.
            claimRefs:
