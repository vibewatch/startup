chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and governance
        blocks:
          - type: paragraph
            body: >-
              Monzo remains a London-based digital bank with a more formal group structure than in the prior refresh.
              The FY2026 annual report and board page show Monzo Bank Holding Group Limited as the parent, separate MBHG
              and MBL boards, and a leadership transition in which Diana Layfield became Group CEO while TS Anil moved
              into a vice-chair role. That combination matters because the company is no longer only a fast-growing app
              brand; it is a regulated banking group with clearer governance boundaries, a broader board, and more
              obvious succession coverage. The identity picture is therefore stable, but the governance picture is
              materially different from the prior report.
            claimRefs:
              - CO001
              - CO002
              - CO003
