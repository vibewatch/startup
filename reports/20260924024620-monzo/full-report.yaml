  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk landscape
        blocks:
          - type: paragraph
            body: >-
              The risk story is broader than outages, but outages are the most visible symptom. Monzo’s annual report
              explicitly calls out competition, financial crime, credit, conduct, and operational risk. That means the
              company is not only managing a consumer app; it is managing a regulated bank whose failures can affect
              deposits, payments, and customer trust. As primary-bank share rises, every incident matters more because
              customers rely on Monzo for everyday financial operations rather than for a niche spend category.
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR007
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR006
              - CR008
              - CR013
      - number: '7.2'
        title: Operational fragility and outages
        blocks:
          - type: paragraph
            body: >-
              Recent outage coverage reinforces that the service-risk bucket is real. Monzo has had incidents where
              customers saw degraded app performance, platform issues, and backup-bank activation, and customers quickly
              took to forums and social channels to complain. That is not unusual for a digital bank, but it is more
              damaging when the company is increasingly a primary account. The relevant diligence question is not
              whether outages happen at all; it is whether Monzo can recover quickly enough and communicate clearly
              enough to keep trust from eroding over time.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR010
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR010
              - CR012
      - number: '7.3'
        title: Mitigations and priorities
        blocks:
          - type: paragraph
            body: >-
              Monzo does have mitigations: a stand-in bank, a visible status posture, and a risk framework that the
              annual report says is actively managed. But the mitigation story only works if the company keeps improving
              resilience while expanding internationally and adding more lending and SME complexity. That is why the
              best risk view is a prioritization exercise. The highest priority risks are operational continuity,
              financial crime, and competitive pressure because those can hit both trust and economics at the same time.
              The practical priority order is to harden the highest-frequency failure modes first, keep remediation
              owners explicit, and measure whether controls actually reduce repeat incidents over time rather than just
              creating more documentation. That framing is especially important in a bank because small process failures
              can cascade into complaints, regulatory scrutiny, and remediation cost. Repeatable controls matter.
            claimRefs:
              - CR003
              - CR005
              - CR006
              - CR008
              - CR009
