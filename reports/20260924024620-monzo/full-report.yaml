              - CO003
              - CO013
              - CO014
      - number: '1.2'
        title: Scale, monetization, and balance sheet footing
        blocks:
          - type: paragraph
            body: >-
              The business now looks like a scaled, profitable bank rather than a pure growth story. FY2026 revenue of
              £1.7 billion and adjusted profit before tax of £172.6 million are supported by a broader revenue mix,
              including four revenue streams above £300 million each, while deposits reached £25.7 billion. Customer
              counts also matter: Monzo reported roughly 15 million customers across personal and business banking, with
              around half of active users treating Monzo as their primary bank. Those figures imply deeper wallet share,
              but they also raise the stakes for outages, regulatory scrutiny, and capital allocation as the product
              suite widens.
