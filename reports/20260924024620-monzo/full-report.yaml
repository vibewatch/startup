  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Monzo’s financial profile has clearly moved beyond a simple interchange story. FY2026 revenue of £1.7
              billion came from a diversified mix of interchange, subscriptions, lending, and other interest-bearing or
              treasury-driven streams, and the company says four separate revenue streams each cleared £300 million.
              That matters because it reduces dependence on any single product and gives the business more room to
              absorb pricing pressure in one line while growing another. The key financial question is now not whether
              Monzo can make money, but how durable each revenue stream is as competition, regulation, and product mix
              evolve.
            claimRefs:
