      - number: '4.2'
        title: Margin profile and capital footing
        blocks:
          - type: paragraph
            body: >-
              The margin story is favorable but not finished. Gross profit of about £1.0 billion and adjusted profit
              before tax of £172.6 million show meaningful operating leverage, yet the company still spends heavily on
              growth, support, and product development. Deposits of £25.7 billion and the bank’s profit trajectory
              suggest that capital is less of an existential issue than it once was, but precise stress metrics and
              runway data are not public. The financial diligence takeaway is that Monzo can fund a lot of its own
              expansion, but investors still need to understand how much of the current margin profile is structural
              versus cyclical.
            claimRefs:
              - CI002
              - CI007
              - CI008
