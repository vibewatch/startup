  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and adoption lens
        blocks:
          - type: paragraph
            body: >-
              Monzo’s market is not just “banking apps.” The company is aiming at the current-account relationship first
              and then layering adjacent products such as savings, borrowing, investing, pensions, and business banking.
              That makes the market boundary broader than a simple neobank category but narrower than all consumer
              finance. The practical adoption metric is not app downloads; it is how many customers choose Monzo as a
              primary bank and how much of their financial life they place inside the app. That framing also explains
              why the company cares so much about referral growth, service quality, and product breadth.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM010
      - number: '2.2'
        title: Growth drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              Growth is being pulled by convenience, trust, and product depth. Monzo’s free current account, 24/7
              support, app-first design, and strong service ratings all reduce adoption friction, while referral-led
              growth shows that customers are willing to recommend it. The market is still constrained by incumbent
              loyalty, regulatory complexity, and the need to localize offerings in Europe. In other words, Monzo can
              keep expanding the market it serves, but it still has to prove that the UK playbook translates cleanly to
              Ireland, Spain, and beyond without losing the product simplicity that made the brand work in the first
              place. That also means relative execution quality matters more than generic “digital banking” category
              labels.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM006
      - number: '2.3'
        title: Sizing implications for diligence
        blocks:
          - type: paragraph
            body: >-
              The best sizing lens for Monzo combines penetration, monetization, and balance-sheet depth rather than a
              single top-down TAM number. With 12.1 million users reported in 2024, 15 million customers in FY2026, and
              around half of active customers using Monzo as their primary bank, the company is already deep into the
              “share of wallet” phase. That means market opportunity is now more about expanding usage among existing
              customers and replicating the model in adjacent geographies than simply adding first-time app sign-ups.
              The valuation implication is that execution quality matters more than category hype. The underwriting
              implication is that customer economics and geographic execution matter more than headline category size.
            claimRefs:
              - CM002
              - CM003
              - CM011
              - CM012
