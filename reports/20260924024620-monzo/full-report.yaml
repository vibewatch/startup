      - number: '4.3'
        title: Pricing, unit economics, and gaps
        blocks:
          - type: paragraph
            body: >-
              The published unit-economics picture is stronger than in prior refreshes, but there are still gaps. ARPAC
              rose to £167 for personal banking and £484 for business banking, suggesting the platform gets more
              valuable as customers adopt more products. At the same time, the private-company valuation remains a
              third-party estimate, and the exact path from gross profit to long-run capital returns is still not fully
              disclosed. This means the underwriting job is less about proving that Monzo can grow and more about
              proving that growth can keep compounding through higher-value products without introducing hidden credit
              or operational drag. The valuation question is therefore mostly about sustainment and execution, not
              survival.
            claimRefs:
