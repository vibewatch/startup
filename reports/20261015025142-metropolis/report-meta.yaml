  topStrengths:
    - Large installed parking footprint with strong transaction-scale signals.
    - Fresh institutional financing and a demonstrated ability to acquire and migrate operating assets.
    - Clear optionality to extend the platform into adjacent physical-commerce workflows.
  topRisks:
    - Revenue quality, gross margin, and covenant headroom remain opaque despite the scale narrative.
    - The latest capital step-up added a meaningful debt burden alongside the equity raise.
    - Legal, privacy, and customer-friction issues remain part of the public record.
    - Non-parking expansion is strategic, but contracted revenue from those verticals is still not disclosed.
  unresolvedGaps:
    - Verified bridge from transaction volume and usage metrics to recognized revenue and gross profit.
    - Debt terms, covenant headroom, amortization schedule, and refinancing exposure under downside scenarios.
    - Revenue mix across managed parking, software/licensing, reservations, validations, and new verticals.
    - Customer concentration, renewal behavior, and software-subscription penetration within the location base.
    - Evidence that non-parking vertical expansion is converting into material contracted revenue.
