callouts:
  - calloutType: insight
    title: Distribution matters more than a demo
    body: The decisive contrast in the assigned evidence is access to live operating locations and migration rights, not just the existence of computer vision or checkout-free UX.
    claimRefs: [CP004, CP009, CP012]
  - calloutType: risk
    title: Expansion exposes adjacent benchmarks
    body: Moving into retail, hospitality, and fueling expands the TAM, but it also imports the cost, privacy, and rollout skepticism already visible in adjacent frictionless-commerce systems.
    claimRefs: [CP005, CP010, CP011]
