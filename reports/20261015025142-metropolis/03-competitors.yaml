      - ["Buyer switching friction", "High once a site is migrated into member billing and operations", "Medium from existing operator contracts and manual processes", "Medium because deployment complexity can be high", "High implementation burden for the owner", "Low-to-medium unless bundled with a broader operating stack"]
    notes: "Unsupported cells are kept explicit because the assigned pool does not include direct competitor documentation for every column."
