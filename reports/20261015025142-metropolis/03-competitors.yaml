    columns:
      - Option
      - Public price / unit
      - Contract model
      - Included capabilities
      - Implication
    rows:
      - ["Metropolis parking network", "Unknown publicly", "Operator and platform relationship embedded in managed parking footprint", "Recognition-based entry, automated billing, member identity layer", "Competitive win case must be inferred from workflow change and footprint, not list price"]
      - ["Metropolis non-parking expansion", "Unknown publicly", "Licensing to operators rather than asset ownership", "Recognition software, identity / member graph, and workflow automation", "Could scale faster than owned-location rollouts if partners adopt"]
      - ["Legacy manual parking", "Site-specific and usually unpublished in the assigned pool", "Labor, cash handling, tickets, kiosks, validations", "Operational continuity and exception handling", "Status quo can persist where buyers prefer known process over automation risk"]
      - ["Adjacent checkout-free automation", "Unknown publicly in the assigned pool", "Technology deployment / licensing", "Checkout-free or recognition-led commerce workflow", "Technology ambition alone is not proof of parking-style deployment economics"]
    notes: "The evidence gap is pricing transparency, not packaging direction: the sources describe contract shape, but not usable apples-to-apples public price points."
    claimRefs: [CP005, CP006, CP010, CP011]
