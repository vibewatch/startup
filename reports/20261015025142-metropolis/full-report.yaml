      - number: '3.3'
        title: Expansion path and adverse competitor evidence
        blocks:
          - type: paragraph
            body: >-
              The company is explicitly pushing the platform beyond parking into retail, hospitality, fueling, office,
              and restaurant workflows, usually through a licensing motion rather than buying the downstream operator.
              That broadens the competitive frame to include adjacent checkout-free commerce stacks and component
              recognition vendors. The same expansion thesis carries execution risk: external reporting already cites
              lawsuits and complaints over billing practices, while adjacent-market evidence highlights that even
              well-funded frictionless-checkout systems can hit cost and complexity limits outside their initial wedge.
              Expansion creates more surface area for buyer skepticism from landlords, merchants, and privacy-sensitive
              end customers.
