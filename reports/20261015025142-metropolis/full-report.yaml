chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Metropolis presents itself as applied AI for the physical world, with parking still functioning as the
              company’s most concrete operating wedge. The homepage and parking-specific materials both frame the
              product as an intelligence layer that recognizes vehicles and context in real time rather than as a simple
              payments point solution, which matters because later product, customer, and valuation work should treat
              parking as the installed base for a broader recognition platform. Identity facts are relatively stable
              across the assigned evidence: the company traces its launch to 2017, describes Los Angeles roots, and
              still uses parking as the place where it can prove a seamless, checkout-free user experience before
              pushing into other physical-commerce workflows.
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO008
              - CO009
              - CO010
              - CO013
              - CO014
      - number: '1.2'
        title: Leadership, capital, and control points
        blocks:
          - type: paragraph
            body: >-
              The named leadership bench in the assigned evidence is still concentrated around founders and a small
              number of operating executives. Alex Israel remains the public face of the company as CEO and co-founder,
              while Courtney Fukuda appears as another co-founder with an integration remit. On capitalization, the
              story has clearly shifted from venture build-out to a much heavier late-stage structure: Metropolis moved
              from a $41 million Series A in 2021 to a November 2025 package combining a $1.1 billion term loan and
              roughly $500 million of Series D equity at an approximately $5 billion valuation. That capital base is
              substantial, but the public materials here still do not expose the board, voting rights, or covenant
              detail needed to underwrite governance cleanly.
            claimRefs:
              - CO004
              - CO005
              - CO007
