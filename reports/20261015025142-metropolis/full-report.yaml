  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              The observable model starts with checkout-free parking and location operations, then extends into adjacent
              physical-commerce endpoints that Metropolis says it wants to serve through the same recognition stack.
              Public disclosures are consistent that parking remains the proven wedge: the 2021 Series A launch letter
              framed parking as an under-monetized asset class and described Metropolis as the layer that recognizes
              vehicles, automates checkout, and removes manual payment friction. By late 2025 the company was disclosing
              more than $5 billion of annual transaction volume, nearly 20 million Members, and 50 million customers,
              while a January 2026 local-market report suggested the footprint had continued expanding after the
              financing close. That is meaningful commercial scale, but it is still a usage and processing story rather
              than a disclosed recognized-revenue story.
            claimRefs:
              - CI002
              - CI003
              - CI006
              - CI008
              - CI016
              - CI018
