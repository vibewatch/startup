  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a usage-to-transaction-to-expansion chain, but the bridge from transaction volume to
      recognized revenue and gross profit is not publicly disclosed.
    data:
      nodes:
        - id: members
          label: Members and customers
          value: Nearly 20M Members; 50M customers
          detail: Company-reported network scale as of Nov. 2025.
        - id: network
          label: Enabled locations
          value: 4,200+ to 4,600+ locations
          detail: Parking footprint expanded via acquisition and location migration.
        - id: checkout
          label: Recognized visits and automated checkout
          detail: Computer vision replaces manual ticketing and payment friction at the point of use.
        - id: gtv
          label: Annual transaction volume
          value: $5B+
          detail: Disclosed payment throughput, not recognized revenue.
        - id: monetization
          label: Revenue capture paths
          detail: Managed parking operations today, with adjacent-vertical operator licensing positioned as the next layer.
        - id: visibility-gap
          label: Gross-profit visibility gap
          detail: Public sources do not disclose take rate, recognized revenue, gross margin, CAC, payback, or runway.
          tone: risk
      edges:
        - from: members
          to: network
          relationship: Member activity occurs inside the operating footprint.
        - from: network
          to: checkout
          relationship: Locations deploy vehicle recognition and automated billing.
        - from: checkout
          to: gtv
          relationship: Parking sessions create payment throughput.
        - from: gtv
          to: monetization
          relationship: Throughput must convert into revenue by stream and contract.
        - from: monetization
          to: visibility-gap
          relationship: Public evidence stops before revenue-quality and margin disclosure.
    claimRefs:
      - CI002
      - CI003
      - CI005
      - CI012
      - CI016
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence supports a layered operating model from member enrollment through recognition, billing, site
      deployment, and adjacent-vertical licensing.
    data:
      layers:
        - label: Member enrollment
          detail: Driver or member pre-registers a vehicle, payment method, and account identity.
        - label: Vehicle recognition
          detail: Cameras identify the vehicle or a vehicle fingerprint at entry and exit.
        - label: Event logging
          detail: Entry and exit events are matched so the stay can be priced without a ticket.
        - label: Billing and personalization
          detail: The platform charges the stored account and pitches a more personalized recognition layer.
        - label: Site migration and operator tooling
          detail: Acquired operator footprints are migrated onto the Metropolis digital platform over time.
        - label: Adjacent-vertical licensing
          detail: >-
            Management says the same recognition/payment layer will be licensed into fueling, retail, hospitality, and
            office use cases.
    approximationNotes: >-
      Layer order and scope are derived from public workflow descriptions and management statements, not from detailed
      technical documentation or source code.
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE007
      - CE009
      - CE010
