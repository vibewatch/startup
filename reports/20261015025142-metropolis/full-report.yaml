      - number: '4.3'
        title: Capital structure and adequacy
        blocks:
          - type: paragraph
            body: >-
              The strongest current fact in the chapter is the capital structure itself. Metropolis said in November
              2025 that it closed a $1.6 billion package consisting of a $1.1 billion Term Loan B and approximately $500
              million of Series D equity at an approximately $5 billion valuation. Tracxn separately records the same
              date as a $500 million Series D plus $1.1 billion of conventional debt, which is helpful because it
              separates equity funding from the broader financing headline. The implication is double-edged: Metropolis
              has clearly been able to raise very large sums to fund expansion, but the latest round added a material
              debt layer at the same time. Without public burn, free-cash-flow, covenant, or debt-service disclosures,
              capital adequacy cannot be underwritten from the public record alone.
            claimRefs:
              - CI001
              - CI007
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI005
              - CI008
              - CI014
              - CI016
      - number: '4.4'
        title: Verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Financially, Metropolis looks like a scaled but still opaque platform roll-up. The positive read is that
              the company has built a very large physical network, disclosed meaningful transaction volume, and appears
              to be trying to use software-style licensing to expand beyond parking without buying every adjacent
              vertical outright. The negative read is that public sources still do not show recognized revenue, margin
              structure, CAC or payback, or covenant headroom, while adverse evidence already points to
              customer-friction and legal-cost risk in some markets. That leaves the current investment case dependent
              on management proof that location migration, software penetration, and adjacent-vertical contracts can
              produce revenue quality worthy of a $5 billion valuation and a billion-dollar debt stack.
            claimRefs:
              - CI001
              - CI012
              - CI013
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What the delivered product actually does
        blocks:
          - type: paragraph
            body: >-
              The best-supported product definition is still the parking workflow rather than a generic AI platform
              claim. Public reporting and company materials consistently describe a no-stop parking experience in which
              a driver pre-registers, cameras recognize the vehicle on entry and exit, and billing happens automatically
              against the stored account rather than through gates, kiosks, or attendants. The 2021 Series A narrative
              already framed parking as the first wedge for a broader mobility platform, and the 2025 financing
              narrative keeps the same positioning while showing materially more scale. In other words, Metropolis is
              not selling abstract AI; it is selling a production workflow that removes payment friction for drivers and
              replaces legacy operational steps for parking owners.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE012
