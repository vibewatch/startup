      - number: '3.2'
        title: Distribution, migration, and switching cost
        blocks:
          - type: paragraph
            body: >-
              Metropolis's clearest advantage in the current source set is not pure feature depth but control of a live
              operating network. The SP+ acquisition gave it incumbent customer relationships, a large base of active
              locations, while Baltimore reporting indicates that migrating those locations onto the Metropolis digital
              layer is still an active execution program rather than a finished conversion. That creates meaningful
              switching friction for buyers already inside the network, but it also means durability depends on rollout
              quality, collections practices, and partner trust as much as on computer-vision accuracy. The moat is
              therefore partly contractual and operational, not just technical.
