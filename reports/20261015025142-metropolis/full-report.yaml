          - type: callout
            title: Controls trail lags the ambition of the recognition thesis
            body: >-
              Expansion into retail, hospitality, and broader biometric recognition is currently better evidenced by
              financing narratives than by independent proof of controls, privacy governance, or scaled production
              references.
            calloutType: risk
            claimRefs:
