  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segmentation and commercial surface
        blocks:
          - type: paragraph
            body: >-
              The clearest current customer picture is still parking-first. Metropolis markets to real-estate owners and
              parking operators that want to replace legacy equipment with a zero-upfront-cost deployment, while the end
              user is the driver or visitor whose vehicle is recognized and billed automatically. The official parking
              page anchors the present-day segment map across office and mixed use, residential, retail, events and
              venues, healthcare, universities, hospitality, and aviation. On public scale metrics, the company is
              clearly not pre-product: official November 2025 financing materials say the network serves 50 million
              customers, counts nearly 20 million Members, and adds more than one million new Members per month, while
              independent 2026 reporting still describes a national footprint above 4,200 locations.
