      - number: '5.2'
        title: How the platform scales and where it is trying to expand
        blocks:
          - type: paragraph
            body: >-
              Product maturity is strongest where Metropolis can pair software with acquired operating distribution. The
              SP+ acquisition gave it a large installed footprint, and Baltimore reporting shows a real migration
              example where local inherited sites were moved onto the Metropolis digital platform. Current financing
              materials claim the platform already supports more than $5 billion in annual transactions and nearly 20
              million Members, while management is now pitching the same recognition layer into fueling, retail,
              hospitality, mobility, and office environments. That expansion appears to be a licensing strategy rather
              than a plan to own thousands of non-parking sites directly, which makes the product story more scalable
              than a pure operator roll-up but also means the non-parking thesis still needs more independent deployment
              proof.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
              - CE009
              - CE010
