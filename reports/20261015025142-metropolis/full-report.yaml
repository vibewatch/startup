      - number: '4.2'
        title: Pricing surface and distribution
        blocks:
          - type: paragraph
            body: >-
              Pricing visibility is weak even though monetization surfaces are identifiable. The company clearly
              automates per-visit parking payments and has begun describing future licensing into retail, hospitality,
              fueling, and other operator workflows, but no assigned public source discloses the realized fee split
              between site operators and Metropolis, contract lengths, implementation charges, software subscription
              rates, or gross-margin contribution by stream. Distribution also appears unusually acquisition-assisted
              rather than purely direct-sales-led: the SP+ acquisition gave the company a scaled operating network to
              migrate onto its platform, and Baltimore reporting suggests that this migration is still an active
              operational program. For diligence, that makes the key commercial question less “can Metropolis sell
              parking tech?” and more “how much of the installed base can it convert into higher-quality software or
              network revenue without absorbing service-heavy economics?”
            claimRefs:
