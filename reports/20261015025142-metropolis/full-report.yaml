              - CE011
      - number: '5.3'
        title: Product risk, controls, and unresolved technical diligence
        blocks:
          - type: paragraph
            body: >-
              The main technical diligence issue is not whether Metropolis can run automated parking at scale; the
              public record supports that it can. The open questions sit around trust and control surfaces that matter
              once recognition moves beyond parking: billing disputes, privacy expectations, biometric scope after the
              Oosto acquisition, and the absence of public technical evidence on security, uptime, or developer
              adoption. Local reporting shows active complaints and litigation over charges and collections, which is a
              meaningful product risk because the business model depends on invisible billing and consumer trust.
              Management's broader "recognition economy" thesis may be strategically attractive, but investors should
              treat controls, incident history, and live non-parking references as diligence items rather than proven
              capabilities.
            claimRefs:
              - CE008
              - CE011
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Proven parking workflow, not just concept marketing
            body: >-
              The assigned evidence pool supports a real deployed parking product with no-stop payment, large
              operational footprint, and concrete migration examples after SP+.
            calloutType: strength
            claimRefs:
