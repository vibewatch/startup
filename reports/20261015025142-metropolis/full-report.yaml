      - number: '2.3'
        title: 'Buyer map: owners pay, drivers use, operators distribute'
        blocks:
          - type: paragraph
            body: >-
              The current buyer logic is asset-owner and operator led. Public materials repeatedly pitch parking as a
              monetization and operational-efficiency tool for owners, asset managers, and management teams that need
              leakage control, dynamic pricing, and lower staffing or hardware overhead, while drivers experience the
              product as ticketless, cashless access. That creates a familiar enterprise pattern: property or operating
              budgets fund deployment, end users are motorists or tenants, and adoption depends on whether the location
              has recurring throughput and pricing complexity worth instrumenting. Outside parking, the next step
              appears to be a licensing model into operators in gas, hospitality, retail, office, and drive-through
              settings instead of Metropolis owning those venues directly.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM012
              - CM013
      - number: '2.4'
        title: Drivers, constraints, and what remains unproven
        blocks:
          - type: paragraph
            body: >-
              Adoption drivers are straightforward: faster user throughput, reduced cash leakage, dynamic pricing, and
              higher asset utilization for owners. The harder question is whether those parking economics translate
              cleanly into adjacent verticals before regulatory, trust, and pricing scrutiny slow expansion. Fortune
              tied the story to privacy and consumer-trust balancing after legal and regulatory issues, while local
              reporting still surfaces user complaints about confusing charges even as the company touts positive
              reviews. The public narrative for expansion is therefore credible enough to support a broader opportunity
              frame, but still short of proving segment-level revenue conversion, budget durability, or a measurable
              non-parking SOM.
            claimRefs:
              - CM006
              - CM007
              - CM012
              - CM013
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: What the public record really supports
            body: >-
              Metropolis has enough disclosed network scale to argue that parking is a validated deployment wedge, but
              not enough segmented disclosure to prove that retail, hospitality, fueling, or office adjacencies already
              support the same underwriting logic.
            calloutType: insight
            claimRefs:
              - CM008
              - CM011
              - CM012
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and substitute set
        blocks:
          - type: paragraph
            body: >-
              The competitive set is broader than "parking tech" alone. The sources consistently describe the status quo
              as staffed booths, ticket machines, cash handling, validations, and fragmented local operating practices,
              which means Metropolis is trying to replace both software and operating labor. That widens the benchmark
              from direct software peers to incumbent parking operators, owner-operated facilities, and manual
              status-quo workflows. The strongest evidence also shows that the company is using parking as an entry
              point into a larger recognition-and-payments infrastructure thesis, so adjacent checkout-free and
              biometrics vendors matter even when they do not own parking inventory. In practice, buyers are comparing
              operational disruption tolerance as much as application features.
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP008
