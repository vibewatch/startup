      - number: '1.4'
        title: Risks, contradictions, and open diligence
        blocks:
          - type: paragraph
            body: >-
              The main caution from the overview chapter is not that Metropolis lacks momentum; it is that some of the
              numbers and risk disclosures remain hard to normalize from public evidence alone. Location and member
              counts vary across official pages, syndicated announcements, and independent reporting, which means later
              chapters should cite the exact source-specific metric rather than collapse them into one supposedly
              canonical company-wide figure. In parallel, the Baltimore Banner shows that scale has come with
              customer-friction and litigation risk around business practices, while the assigned pool still does not
              provide audited revenue, EBITDA reconciliation, board composition, or a current cap-table-quality
              ownership view. Those omissions do not negate the scale story, but they materially limit how much
              precision this chapter should project onto revenue quality, governance, or control.
            claimRefs:
              - CO001
              - CO006
              - CO008
              - CO013
              - CO014
              - CO016
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: parking first, physical commerce second'
        blocks:
          - type: paragraph
            body: >-
              The clearest supported market boundary is still parking operations and payments rather than a fully
              disclosed cross-vertical commerce platform. Metropolis itself described parking as an under-monetized
              real-estate layer and the first practical deployment zone for its computer-vision system, while current
              operating descriptions still center on automated entry, exit, and billing for drivers across parking
              facilities. The broader “recognition economy” thesis matters for valuation, but public evidence places it
              in adjacencies such as retail, hospitality, fueling, mobility, office, and related roadside workflows
              rather than as a separately disclosed revenue base today.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
              - CM012
              - CM014
