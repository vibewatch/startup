              - CO012
              - CO015
      - number: '1.3'
        title: Scale, acquisitions, and milestone progression
        blocks:
          - type: paragraph
            body: >-
              Scale is no longer theoretical. By late 2025 the company and its syndication surfaces were claiming a
              network in the low-thousands of locations, annual transaction volume above $5 billion, and member/customer
              reach measured in the tens of millions. The path to that scale was not purely organic: the SP+
              take-private materially expanded the operating base, and the Oosto acquisition broadened the recognition
              stack beyond vehicle-centric parking use cases. The milestone pattern therefore matters for the rest of
              the report: Metropolis is increasingly a roll-up plus platform story, where acquisitions and new vertical
              deployment are part of the business model rather than incidental corporate events.
            claimRefs:
              - CO001
              - CO006
              - CO009
              - CO012
              - CO013
              - CO014
              - CO015
