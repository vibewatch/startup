      - number: '6.2'
        title: Named proof and rollout quality
        blocks:
          - type: paragraph
            body: >-
              Named deployment proof exists, but it is thinner than the topline scale story. The strongest direct
              customer proof in the assigned pool is still company-controlled: a testimonial from Unico Properties on
              the current parking page. Independent operating proof is better at the site and regional level than at the
              account level. The Baltimore Banner reported that Metropolis had almost 100 locations in the Baltimore
              metro area and had migrated about 80% of those locations onto the Metropolis digital platform, which is
              useful evidence that the SP+ estate can be converted market by market after acquisition. Finance Yahoo
              also reported that Blade, Joby's urban air mobility subsidiary, was already using Metropolis's Bags VIP
              service at JFK and Newark, but that adjacency is better read as a narrow deployment proof than as evidence
              of broad non-parking customer monetization.
