      - number: '2.2'
        title: 'Sizing lenses: proxy metrics are stronger than TAM math'
        blocks:
          - type: paragraph
            body: >-
              Metropolis does not disclose a conventional public TAM/SAM/SOM stack, so the usable sizing evidence is
              lens-based. The company’s 2021 market narrative used urban surface-area share to argue that parking is a
              large, structurally neglected asset class, while 2025-2026 disclosures give current scale proxies such as
              annual transaction volume, location count, customers, and members. Those metrics show meaningful adoption,
              but they are not interchangeable denominators, and they do not isolate the serviceable share of retail,
              hospitality, fueling, or mobility adjacencies. Investors can underwrite momentum and platform reach from
              the public record; they cannot yet underwrite a source-backed non-parking SAM from it.
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM010
              - CM011
              - CM016
