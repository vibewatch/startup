company:
  name: Metropolis
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Metropolis has a verifiable, live parking product built around computer-vision-based
    vehicle recognition, account-linked billing, and checkout-free entry/exit. The
    stronger proof is in parking rollout and migration of acquired operating footprints;
    the weaker proof is around security controls, developer ecosystem, and material
    production deployments outside parking, which still depend mostly on company claims.
sections:
  - id: current-product
    title: What the delivered product actually does
    body: >-
      The best-supported product definition is still the parking workflow rather than a
      generic AI platform claim. Public reporting and company materials consistently
      describe a no-stop parking experience in which a driver pre-registers, cameras
      recognize the vehicle on entry and exit, and billing happens automatically against
      the stored account rather than through gates, kiosks, or attendants. The 2021
      Series A narrative already framed parking as the first wedge for a broader mobility
      platform, and the 2025 financing narrative keeps the same positioning while
      showing materially more scale. In other words, Metropolis is not selling abstract
      AI; it is selling a production workflow that removes payment friction for drivers
      and replaces legacy operational steps for parking owners.
    claimRefs: [CE001, CE002, CE003, CE012]
    tableRefs: [TE001, TE002]
    figureRefs: [FE001]
  - id: operating-model
    title: How the platform scales and where it is trying to expand
    body: >-
      Product maturity is strongest where Metropolis can pair software with acquired
      operating distribution. The SP+ acquisition gave it a large installed footprint,
      and Baltimore reporting shows a real migration example where local inherited sites
      were moved onto the Metropolis digital platform. Current financing materials claim
      the platform already supports more than $5 billion in annual transactions and
      nearly 20 million Members, while management is now pitching the same recognition
      layer into fueling, retail, hospitality, mobility, and office environments. That
      expansion appears to be a licensing strategy rather than a plan to own thousands
      of non-parking sites directly, which makes the product story more scalable than a
      pure operator roll-up but also means the non-parking thesis still needs more
      independent deployment proof.
    claimRefs: [CE004, CE005, CE006, CE007, CE009, CE010]
    tableRefs: [TE003]
  - id: trust-controls
    title: Product risk, controls, and unresolved technical diligence
    body: >-
      The main technical diligence issue is not whether Metropolis can run automated
      parking at scale; the public record supports that it can. The open questions sit
      around trust and control surfaces that matter once recognition moves beyond
      parking: billing disputes, privacy expectations, biometric scope after the Oosto
      acquisition, and the absence of public technical evidence on security, uptime, or
      developer adoption. Local reporting shows active complaints and litigation over
      charges and collections, which is a meaningful product risk because the business
      model depends on invisible billing and consumer trust. Management's broader
      "recognition economy" thesis may be strategically attractive, but investors should
      treat controls, incident history, and live non-parking references as diligence
      items rather than proven capabilities.
    claimRefs: [CE008, CE011]
