  evidenceGaps:
    - type: missing-source
      severity: material
      topic: controls-transparency
      missingEvidence: Public trust-center style documentation for security controls, privacy posture, uptime commitments, certifications, and incident history.
      whyItMatters: Recognition-based billing and any move toward broader biometrics increase the diligence burden on privacy, security, and operational resilience.
      diligencePath: Request SOC or ISO materials, privacy and biometric-governance policies, uptime or dispute-rate reporting, and any public incident disclosures.
      relatedQuestionRefs: [QE008]
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: Developer-signal or practitioner-community evidence such as public docs usage, repositories, package adoption, partner implementation detail, or forum traffic.
      whyItMatters: The assigned pool supports a deployed operator product, but it does not show whether Metropolis has a broader technical ecosystem or reusable platform depth.
      diligencePath: Review any public API or docs portal, public repositories, package registries, integrator forums, or partner engineering writeups; if none exist, document that the product is closed-deployment only.
      relatedQuestionRefs: [QE008]
    - type: missing-source
      severity: material
      topic: non-parking-proof
      missingEvidence: Named live customers, deployment metrics, and contracted revenue evidence for retail, hospitality, fueling, or office use cases outside parking.
      whyItMatters: The current valuation and product narrative rely on a recognition platform thesis that is materially broader than the parking business already in production.
      diligencePath: Request named reference accounts, go-live dates, transaction volumes, and revenue contribution by non-parking vertical.
