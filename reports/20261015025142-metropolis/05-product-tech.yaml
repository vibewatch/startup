      - [Vehicle recognition and billing, Operator and property owner, Live and central to current product, Computer-vision identification plus account-linked payment, Need public error-rate and exception-handling metrics]
      - [SP+ migration and operator footprint, Parking owner and operations team, Live but uneven by site, Acquisition-led distribution shortens deployment time versus site-by-site sales, Need region-by-region migration and retrofit timetable]
      - [Recognition platform outside parking, Retail and hospitality operators, Expansion-stage and mostly management-claimed, Reuses recognition and payment layer across new verticals, Need named production deployments and contracted revenue outside parking]
    notes: >-
      Public sources distinguish mature parking operations from announced adjacent
      verticals; no public source in the assigned pool gives independent reliability or
      unit-economics metrics for each module.
    claimRefs: [CE001, CE004, CE005, CE007, CE009, CE010]
  - id: TE002
    title: Workflow / use-case table
    columns:
