      - Current workflow
      - Metropolis solution
      - Measurable benefit
      - Limitation
    rows:
      - [Pay for parking without stopping, Register once then drive in and out, Cameras recognize the vehicle and billing runs automatically, No tickets kiosk or card interaction at exit, Requires account setup and public evidence on dispute handling is limited]
      - [Operate acquired parking sites on one platform, Migrate inherited locations from legacy operator processes, Move sites onto Metropolis digital platform after acquisition, Baltimore reporting says about 80 percent of local inherited sites migrated, One local market does not prove full-network migration quality]
      - [Extend recognition to adjacent physical commerce, Offer the same recognition/payment experience in new venues, License software to fueling retail hospitality and office operators, Lower capital intensity than buying and operating each venue directly, Public proof of scaled non-parking deployments is still thin]
    notes: >-
      Benefits come from company descriptions and local operating examples; the assigned
      pool does not provide independent conversion, retention, or uptime denominators.
    claimRefs: [CE001, CE006, CE007, CE009]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process
      - Role
      - Dependency
      - Risk
    rows:
      - [Computer-vision capture, Identifies vehicles on entry and exit and triggers the workflow, Camera coverage site setup and model accuracy, Error rates and edge-case handling are not publicly quantified in the assigned pool]
      - [Member identity and payment graph, Links vehicle account and stored payment to a no-stop experience, Enrollment billing rails and customer support, Invisible billing raises complaint and trust sensitivity when charges are disputed]
      - [Expansion and biometrics layer, Extends recognition logic into new venues and potentially broader identity use cases after Oosto, Partner adoption privacy posture and controls evidence, Public sources do not verify security certifications incident history or biometric governance]
    notes: >-
      This architecture is reconstructed from public descriptions rather than technical
      documentation; missing control evidence is treated as a diligence gap, not as proof
      of absence.
    claimRefs: [CE002, CE008, CE009, CE011]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence supports a layered operating model from member enrollment through
      recognition, billing, site deployment, and adjacent-vertical licensing.
    data:
      layers:
        - label: Member enrollment
          detail: Driver or member pre-registers a vehicle, payment method, and account identity.
        - label: Vehicle recognition
          detail: Cameras identify the vehicle or a vehicle fingerprint at entry and exit.
        - label: Event logging
          detail: Entry and exit events are matched so the stay can be priced without a ticket.
        - label: Billing and personalization
          detail: The platform charges the stored account and pitches a more personalized recognition layer.
        - label: Site migration and operator tooling
          detail: Acquired operator footprints are migrated onto the Metropolis digital platform over time.
        - label: Adjacent-vertical licensing
          detail: Management says the same recognition/payment layer will be licensed into fueling, retail, hospitality, and office use cases.
    approximationNotes: >-
      Layer order and scope are derived from public workflow descriptions and management
      statements, not from detailed technical documentation or source code.
    claimRefs: [CE001, CE002, CE005, CE007, CE009, CE010]
callouts:
  - calloutType: strength
    title: Proven parking workflow, not just concept marketing
    body: >-
      The assigned evidence pool supports a real deployed parking product with no-stop
      payment, large operational footprint, and concrete migration examples after SP+.
    claimRefs: [CE001, CE004, CE005, CE006]
  - calloutType: risk
    title: Controls trail lags the ambition of the recognition thesis
    body: >-
      Expansion into retail, hospitality, and broader biometric recognition is currently
      better evidenced by financing narratives than by independent proof of controls,
      privacy governance, or scaled production references.
    claimRefs: [CE007, CE008, CE011]
