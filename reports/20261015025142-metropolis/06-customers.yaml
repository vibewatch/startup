  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-gap
      missingEvidence: Public or management-supplied NRR, GRR, churn, renewal-rate, and contract-duration disclosures by cohort or segment.
      whyItMatters: Scale and member growth do not prove durable recurring economics or healthy renewals after the SP+ integration.
      diligencePath: Request customer cohort reporting, renewal schedules, churn by location cohort, and any lender or board materials that bridge member growth to paid recurring revenue.
      relatedQuestionRefs: [QU004]
    - type: missing-source
      severity: material
      topic: concentration-gap
      missingEvidence: Top-customer share, vertical revenue mix, channel dependence, and software-subscription penetration within the managed parking estate.
      whyItMatters: Concentration can make revenue and renewal quality materially worse than the headline location count implies.
      diligencePath: Request customer concentration schedules, revenue by vertical, software attach by acquired SP+ locations, and any account-level churn or expansion dashboards.
      relatedQuestionRefs: [QU007]
    - type: enumeration-incomplete
      severity: material
      topic: named customer proof table
      missingEvidence: Additional named production deployments with customer identity, use case, date, and measurable outcome.
      whyItMatters: The chapter can prove broad scale, but the current named proof set is too thin to validate expansion quality across segments and adjacent verticals.
      diligencePath: Request customer references, case studies, procurement records, or public partner announcements that identify live accounts and quantified operating outcomes.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
