      -
        - Member growth pace
        - 1+ million new Members per month
        - "2025-11-06"
        - PRNewswire
        - High
        - Adoption is still compounding after the SP+ acquisition
        - No disclosed acquisition cost, retention, or cohort conversion
      -
        - Baltimore rollout
        - "~100 metro locations and ~80% migrated to the digital platform"
        - "2026-01-13"
        - The Baltimore Banner
        - Medium
        - Shows one concrete post-acquisition conversion market rather than only logo-level claims
        - Single-market example rather than portfolio-wide conversion rate
    notes: Metrics are management-disclosed or independently reported snapshots, not a cohort table; public definitions and denominators remain limited.
    claimRefs: [CU004, CU005, CU006, CU007, CU008]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / proof surface
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      -
        - Unico Properties
        - Office real estate
        - Named testimonial on the current parking page
        - Production reference implied
        - Official current-page endorsement supports live usage and operator satisfaction
        - Company-controlled testimonial with no quantified contract or rollout scope
      -
        - Blade Urban Air Mobility at JFK / Newark
        - Mobility-adjacent hospitality / airport service
        - Finance Yahoo says Blade is already using Metropolis's Bags VIP service
        - Production use reported
        - Shows the platform can support recognition-linked services outside core parking payment
        - Narrow service proof and not evidence of scaled non-parking revenue
      -
        - Baltimore portfolio examples (Harbor Point / Camden Yards)
        - Urban parking estate
        - The Baltimore Banner documents local Metropolis-operated sites and migration from SP+ footing
        - Production regional deployment
        - Independent evidence of estate conversion and local operating density
        - Site-level proof rather than a named enterprise customer contract
    notes: Rows capture the strongest named or site-specific proofs in the assigned pool; generic logos and undated vertical claims were excluded.
    enumerationScope:
      coverage: partial
      basis: Assigned pool reviewed for named deployments, customer quotes, and site-specific operating proof; only three evidence-backed rows met the threshold without inventing logos or unsupported account names.
    claimRefs: [CU008, CU009, CU010, CU012]
figures:
  - id: FU001
    title: Customer journey from parking beachhead to adjacent vertical expansion
    type: journey-map
    summary: Metropolis's public customer motion starts with parking owners and drivers, then tries to widen usage into adjacent physical-commerce surfaces.
    data:
      items:
        - label: Win asset owner or parking operator
          actor: "Buyer: asset owner / operator"
          phase: Initial sale
          touchpoints:
            - Zero CapEx commercial pitch
            - Live in 30 days onboarding promise
          tone: positive
        - label: Enroll drivers and visitors as Members
          actor: "User / payer: driver, visitor, tenant, guest"
          phase: Adoption
          touchpoints:
            - Checkout-free entry and exit
            - Automatic payment tied to vehicle recognition
          tone: positive
        - label: Prove uptime and local conversion
          actor: "Operator + location staff"
          phase: Early proof
          touchpoints:
            - 99.9% uptime claim
            - Baltimore example with about 80% migration onto the digital platform
          tone: neutral
        - label: Build repeat identity graph
          actor: "Network member base"
          phase: Expansion base
          touchpoints:
            - Nearly 20 million Members
            - More than 1 million new Members each month
          tone: positive
        - label: Extend into adjacent physical commerce
          actor: "Retail, hospitality, fueling, mobility operators"
          phase: Adjacent expansion
          touchpoints:
            - Official roadmap into retail, hospitality, fueling, and quick-service restaurants
            - Blade / Joby mobility proof is still narrow
          tone: opportunity
        - label: Defend trust and renewal quality
          actor: "Customer success, compliance, partner management"
          phase: Durability gate
          touchpoints:
            - Fee disputes, complaints, and litigation can slow adoption
            - No public NRR, churn, renewal, or concentration disclosures in this pool
          tone: risk
    claimRefs: [CU003, CU005, CU008, CU010, CU011, CU012, CU014, CU015]
