schemaVersion: report-v2
artifact: customers
slug: metropolis
runDate: 2026-10-15
company:
  name: Metropolis
chapter:
  number: 6
  title: Customers
  summary: >-
    Metropolis can evidence broad parking-market adoption and a large member base, but the assigned pool is much stronger on network scale than on verified retention or named non-parking customers. Public materials and independent coverage support meaningful deployment breadth and a credible adjacent-vertical expansion path, while complaints, litigation, and inconsistent location disclosures limit confidence in durability.
sections:
  - id: segmentation-and-reach
    title: Segmentation and commercial surface
    body: >-
      The clearest current customer picture is still parking-first. Metropolis markets to real-estate owners and parking operators that want to replace legacy equipment with a zero-upfront-cost deployment, while the end user is the driver or visitor whose vehicle is recognized and billed automatically. The official parking page anchors the present-day segment map across office and mixed use, residential, retail, events and venues, healthcare, universities, hospitality, and aviation. On public scale metrics, the company is clearly not pre-product: official November 2025 financing materials say the network serves 50 million customers, counts nearly 20 million Members, and adds more than one million new Members per month, while independent 2026 reporting still describes a national footprint above 4,200 locations.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007, CU013]
    tableRefs: [TU001, TU002]
  - id: deployment-proof
    title: Named proof and rollout quality
    body: >-
      Named deployment proof exists, but it is thinner than the topline scale story. The strongest direct customer proof in the assigned pool is still company-controlled: a testimonial from Unico Properties on the current parking page. Independent operating proof is better at the site and regional level than at the account level. The Baltimore Banner reported that Metropolis had almost 100 locations in the Baltimore metro area and had migrated about 80% of those locations onto the Metropolis digital platform, which is useful evidence that the SP+ estate can be converted market by market after acquisition. Finance Yahoo also reported that Blade, Joby's urban air mobility subsidiary, was already using Metropolis's Bags VIP service at JFK and Newark, but that adjacency is better read as a narrow deployment proof than as evidence of broad non-parking customer monetization.
    claimRefs: [CU008, CU009, CU010, CU012]
    tableRefs: [TU003]
    figureRefs: [FU001]
  - id: durability-and-concentration
    title: Durability, expansion, and concentration caveats
    body: >-
      The durability case remains the weakest part of the public record in this pool. Metropolis discloses scale, onboarding speed, uptime, and expansion ambition, but it does not disclose NRR, GRR, churn, renewal rates, contract duration, top-customer share, or software-subscription penetration within the acquired parking base. That makes it hard to distinguish recurring platform depth from a large but still unevenly converted location footprint. Expansion beyond parking is directionally credible because both official and third-party sources place retail, hospitality, fueling, and quick-service restaurants on the roadmap, yet none of the assigned sources quantify how many of those accounts are live or what portion of revenue they represent. Customer-experience friction is also non-trivial: both Finance Yahoo and The Baltimore Banner surface complaints, fee disputes, and litigation, so underwriting should treat adoption breadth as proven while retention quality and concentration remain open diligence items.
    claimRefs: [CU006, CU011, CU012, CU014, CU015]
