evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: A full management-team and board roster with roles, tenure, and committee structure.
    whyItMatters: The overview can identify named executives, but not the actual governance bench or succession depth.
    diligencePath: Request the board deck, governance materials, and a current org chart.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholders
    missingEvidence: >-
      A cap-table-quality list of current equity holders, lenders, acquired assets, and any concentrated commercial
      counterparties.
    whyItMatters: The financing package is large enough that control rights, covenants, and concentration need explicit mapping.
    diligencePath: Request the latest cap table, debt term sheet, and investor rights summary.
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: A current management-certified KPI cut for active locations, members, customers, and geographic coverage.
    whyItMatters: Public location and member counts vary enough that later chapters could otherwise overstate precision.
    diligencePath: Ask management for a current operating KPI pack with definitions and as-of dates.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: financial-profile
    missingEvidence: Audited revenue, run-rate, EBITDA reconciliation, and current covenant headroom.
    whyItMatters: Transaction volume and financing size do not reveal revenue quality, cash generation, or debt service resilience.
    diligencePath: Request the latest audited financials, lender deck, and monthly management reporting pack.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Management-quality TAM/SAM/SOM bridge by parking, retail, hospitality, fueling, and other named adjacencies with
      clear denominators and geography.
    whyItMatters: >-
      Without segment-level denominators, investors can see platform momentum but cannot pressure-test which parts of
      the narrative are realistically serviceable in the medium term.
    diligencePath: >-
      Request board or financing materials that break out market sizing assumptions, target segments, and expected
      penetration by vertical.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: non-parking-monetization
    missingEvidence: >-
      Contracted revenue, customer count, or gross merchandise / transaction volume for non-parking verticals such as
      retail, hospitality, fueling, or drive-through deployments.
    whyItMatters: >-
      The valuation narrative depends on expansion beyond parking, but public sources reviewed here do not show whether
      those adjacencies are already material or still pre-revenue experiments.
    diligencePath: >-
      Ask for signed-customer counts, live-location counts, and segment revenue or pilot-conversion metrics for each
      named non-parking vertical.
  - type: stale
    severity: minor
    topic: scale-metric-comparability
    missingEvidence: >-
      A dated bridge that reconciles members, customers, locations, and transaction volume across the 2025 and 2026
      disclosure set.
    whyItMatters: >-
      The public record uses multiple denominators and dates, which makes unsupported apples-to-apples growth math easy
      to overstate.
    diligencePath: >-
      Build a management-reviewed operating-metrics timeline with exact as-of dates and definitions for members,
      customers, locations, and annualized transaction volume.
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Public list pricing, minimum contract terms, discount norms, and realized economics for both parking and
      non-parking deployments.
    whyItMatters: >-
      Without published pricing or contract structure detail, the chapter cannot convert workflow differentiation into a
      hard unit-economics or win-rate benchmark.
    diligencePath: >-
      Request customer contracts, pricing decks, or procurement exhibits and compare them with landlord / operator
      alternatives by cohort and site type.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: named-competitor-benchmark
    missingEvidence: >-
      Direct product, pricing, and deployment evidence from named third-party parking-tech and checkout-free competitors
      in the current refresh window.
    whyItMatters: >-
      The chapter can map competitor classes and substitutes, but the assigned pool does not support a reliable
      named-vendor scorecard across price, capabilities, and win rates.
    diligencePath: >-
      Add retained competitor product pages, pricing pages, procurement records, and independent deployment reporting in
      the next refresh cycle.
  - type: private-evidence-only
    severity: blocking
    topic: recognized-revenue
    missingEvidence: GAAP or management-reported revenue, revenue mix, and gross profit by stream after the SP+ integration.
    whyItMatters: >-
      Public transaction volume does not show revenue quality, take rate, or whether software economics are improving
      the mix.
    diligencePath: >-
      Request monthly revenue bridge, segment P&L, and management reporting that separates managed parking,
      software/licensing, and adjacent-vertical activity.
    relatedQuestionRefs:
      - QI001
      - QI004
      - QI007
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: debt-service
    missingEvidence: Debt terms, amortization schedule, covenant package, cash balance, and downside runway under the 2025 Term Loan B.
    whyItMatters: >-
      A billion-dollar debt layer can dominate equity value creation if cash conversion or refinancing flexibility is
      weaker than management implies.
    diligencePath: >-
      Obtain the credit agreement, latest lender package, cash-flow forecast, and covenant model used by finance
      leadership.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: software-unit-economics
    missingEvidence: >-
      CAC, implementation cost, payback period, renewal behavior, and contribution margin for software or licensing
      deployments.
    whyItMatters: The expansion thesis depends on software-style economics rather than service-heavy parking operations.
    diligencePath: >-
      Request cohort and channel-level sales-efficiency reporting for legacy parking, migrated SP+ sites, and
      non-parking vertical pilots.
    relatedQuestionRefs:
      - QI002
      - QI006
      - QI007
    relatedTableRefs:
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: adjacent-vertical-revenue
    missingEvidence: >-
      Contracted revenue, live-customer count, and realized pricing for retail, hospitality, fueling, and restaurant
      deployments.
    whyItMatters: >-
      Management's adjacent-vertical narrative could be meaningful upside, but without booked revenue it remains
      strategically interesting rather than underwritten.
    diligencePath: >-
      Request signed customer list, contracted ARR or transaction commitments, implementation status, and case studies
      for each non-parking vertical.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: controls-transparency
    missingEvidence: >-
      Public trust-center style documentation for security controls, privacy posture, uptime commitments,
      certifications, and incident history.
    whyItMatters: >-
      Recognition-based billing and any move toward broader biometrics increase the diligence burden on privacy,
      security, and operational resilience.
    diligencePath: >-
      Request SOC or ISO materials, privacy and biometric-governance policies, uptime or dispute-rate reporting, and any
      public incident disclosures.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Developer-signal or practitioner-community evidence such as public docs usage, repositories, package adoption,
      partner implementation detail, or forum traffic.
    whyItMatters: >-
      The assigned pool supports a deployed operator product, but it does not show whether Metropolis has a broader
      technical ecosystem or reusable platform depth.
    diligencePath: >-
      Review any public API or docs portal, public repositories, package registries, integrator forums, or partner
      engineering writeups; if none exist, document that the product is closed-deployment only.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
