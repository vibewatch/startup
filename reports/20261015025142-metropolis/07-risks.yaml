      they are not model-derived probabilities or quantified loss estimates.
    claimRefs: [CR001, CR005, CR006, CR013, CR014, CR015, CR016]
callouts:
  - calloutType: risk
    title: Most credible downside path
    body: >-
      The clearest downside path is a compounding one: billing or collections
      scrutiny escalates while location migration is still incomplete and the
      debt-funded expansion into new verticals remains commercially underproved.
    claimRefs: [CR005, CR006, CR014, CR015]
  - calloutType: recommendation
    title: Fastest de-riskers
    body: >-
      The fastest evidence-based de-riskers would be cohort-level complaint and
      refund data, covenant and cash-flow disclosures around the term loan,
      privacy / biometric-governance artifacts, and customer-backed proof that
      non-parking deployments are producing contracted revenue.
    claimRefs: [CR013, CR014, CR016]
