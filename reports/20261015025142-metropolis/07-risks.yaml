      - ["Inherited SP+ operating base", "SP+ locations, airport/commercial customers, and field workforce", "Provides footprint, labor, and enterprise relationships", "Transaction materials referenced 20,000+ team members, 3,300 commercial locations, 160+ airports, and 360+ cities", "Migration delays or service issues slow synergy capture and client retention", "High", "Baltimore migration evidence shows progress, but not full completion", "Medium-High"]
      - ["Owner / channel / partner ecosystem", "Real-estate owners, mobility partners, retailers, fuel and hospitality operators", "Needed to deploy recognition software outside core parking assets", "Public profile sources list Bilt, Joby Aviation, Uber, CBRE, Cushman & Wakefield, and Brookfield, while expansion plans depend on operator adoption", "Large counterparties delay rollouts or compress economics / data access", "Medium-High", "Software licensing is less capital intensive than buying end assets", "Medium-High"]
    notes: >-
