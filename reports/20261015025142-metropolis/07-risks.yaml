  evidenceGaps:
    - type: missing-source
      severity: material
      topic: privacy-regulation
      missingEvidence: Public or management-provided detail on privacy architecture, biometric consent, retention, audit scope, and regulator or enterprise-customer reviews for recognition deployments.
      whyItMatters: Recognition-led expansion into fueling, hospitality, retail, and restaurants raises compliance and reputational risk that cannot be underwritten from ambition statements alone.
      diligencePath: Request privacy policies, DPIAs, customer security schedules, certification reports, and any regulator or enterprise audit correspondence tied to non-parking deployments.
      relatedQuestionRefs: [QR007]
      relatedTableRefs: [TR001, TR002]
    - type: private-evidence-only
      severity: material
      topic: leverage
