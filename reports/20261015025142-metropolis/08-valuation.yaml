  evidenceGaps:
    - type: missing-source
      severity: material
      topic: financing-terms
      missingEvidence: The 2025 debt package covenant schedule, interest burden, maturity profile, and any liquidation-preference or dilution terms attached to the Series D.
      whyItMatters: These terms determine whether the headline $5 billion valuation leaves enough downside protection for a new investor or instead hides leverage and preference overhang.
      diligencePath: Request the debt commitment materials, cap table, investor rights summary, and board financing deck from management and counsel.
      relatedQuestionRefs:
        - QV007
    - type: missing-source
      severity: material
      topic: comparable-benchmarking
      missingEvidence: Revenue, margin, and growth disclosures that would let diligence benchmark Metropolis against public software, payments, parking, or physical-commerce AI comparables and relevant M&A precedents.
      whyItMatters: Without comparable economics or milestone data, the public record cannot determine whether the $5 billion mark is conservative, fair, or still ahead of proof.
      diligencePath: Obtain audited revenue and margin detail, identify the right peer set by revenue mix, and rebuild valuation on transaction, software, and leverage-adjusted frameworks.
      relatedQuestionRefs:
        - QV008
    - type: private-evidence-only
      severity: material
      topic: non-parking-proof-gap
      missingEvidence: Contracted revenue, pilot-to-rollout conversion, and retention data for retail, hospitality, fueling, and other non-parking deployments.
      whyItMatters: The upside case depends on cross-vertical monetization, but the retained public sources mostly show narrative ambition and partnerships rather than monetization proof.
