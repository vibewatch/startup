      - CV003
      - CV008
      - CV013
      - CV014
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Public-evidence read
      - What would change the view
    rows:
      - [Thesis, Metropolis already operates at meaningful scale with >$5B annual transaction volume and a large member base., Verified segment economics and retention data would make scale more valuation-relevant.]
      - [Thesis, Management is trying to extend recognition infrastructure into retail hospitality fueling and mobility through licensing rather than asset ownership., Signed contracts and disclosed non-parking revenue would strengthen this upside path.]
      - [Anti-thesis, Independent evidence suggests growth has depended heavily on acquisitions and financing rather than purely organic software adoption., Evidence of organic same-location growth and lower acquisition dependence would reduce this concern.]
      - [Anti-thesis, Public materials still do not tie the $5B valuation to disclosed revenue margin or cap-table economics., A revenue bridge margin profile and financing terms package would materially improve price support.]
    notes: This table separates the company-quality thesis from the entry-price question; the view changes on evidence and price, not on narrative alone.
    claimRefs:
      - CV003
      - CV006
      - CV007
      - CV012
      - CV013
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, Licensing beyond parking converts into real contracted revenue while leverage stays serviceable and disclosure quality improves., Current valuation could be earned into and potentially expand if non-parking software economics become visible., Non-parking adoption stalls or debt service absorbs operating gains., Requires proof not yet disclosed in retained public evidence.]
      - [Base, Parking scale remains durable and adjacent vertical expansion is real but gradual with mixed disclosure., Current valuation remains hard to chase so upside depends more on disciplined entry than on business collapse., Price can stay ahead of economics for longer than public investors expect., Best fit with today's evidence set.]
      - [Bear, Revenue quality and leverage prove weaker than the headline financing suggests while complaints litigation or rollout friction worsen., The $5B mark compresses because public evidence never catches up to the narrative., Debt overhang customer friction and limited downside protection for new equity., Plausible because current proof gaps are still material.]
    notes: Scenario logic is milestone-based rather than model-derived because the retained public sources do not disclose revenue run rate, margins, or financing-term detail needed for precision valuation work.
    claimRefs:
      - CV004
      - CV008
      - CV009
      - CV012
      - CV013
      - CV014
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: The call stays cautious because real scale and financing access are offset by leverage and missing public economic proof.
    data:
      nodes:
        - id: price
          label: $5B headline valuation
          value: Set by the 2025 Series D plus term-loan package.
        - id: scale
          label: Real operating reach
          value: '>$5B annual transactions, ~20M members, 4,200+ locations.'
        - id: expansion
          label: Expansion option
          value: Retail, hospitality, fueling, mobility, and licensing ambition.
        - id: proof-gap
          label: Economics proof gap
          value: No disclosed revenue run rate, margin bridge, or cap-table terms.
        - id: risk
          label: Residual downside
          value: Debt load plus complaints and litigation risk.
        - id: call
          label: 'Recommendation: research-more / stretched'
          value: Wait for stronger evidence or a better entry price.
      edges:
        - from: price
          to: scale
          label: price assumes scale is durable
        - from: scale
          to: expansion
          label: upside needs cross-vertical adoption
        - from: expansion
          to: proof-gap
          label: ambition still exceeds disclosed monetization proof
        - from: proof-gap
          to: risk
          label: opaque economics amplify downside
        - from: risk
          to: call
          label: entry discipline remains tight
    approximationNotes: Figure logic is qualitative because the retained public evidence does not provide the modeled revenue or cash-flow detail needed for a quantified valuation bridge.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV008
      - CV009
      - CV013
