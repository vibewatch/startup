- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer / budget owner
  - Workflow
  - Adoption trigger
  rows:
  - - Surface lots and garages
    - Parking operators / owners
    - Drivers
    - Parking operations or asset-management budget
    - Ticketless entry, exit, billing, and occupancy control
    - High-throughput sites with visible leakage or queue friction.
  - - Office / multifamily / mixed-use properties
    - Property managers / real-estate owners
    - Residents, workers, guests
    - Property operations / NOI optimization budget
    - Recurring-access control plus differentiated pricing by user type
    - Owners want better utilization without new gate hardware or staffing overhead.
  - - Retail corridor / destination assets
    - Asset managers and retail landlords
    - Shoppers and transient parkers
    - Asset-level commercial operations budget
    - Demand-based pricing and customer-flow management tied to visits
    - Peak-period underpricing and poor capture of transient demand.
  - - Adjacent physical-commerce venues
    - Fueling, hospitality, drive-through, office, and similar operators
    - Consumers on site
    - Operator software / digital-infrastructure budget
    - Recognition-led checkout and identity workflows beyond parking
    - Operators want lower friction without owning the enabling AI stack themselves.
  notes: Rows separate buyer, user, and payer because the public sources describe enterprise-funded deployments even when the end-user benefit is driver or consumer convenience.
