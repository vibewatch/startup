      - number: '3.3'
        title: 扩张路径与不利竞争证据
        blocks:
          - type: paragraph
            body: >-
              公司 是 explicitly pushing 平台 beyond 停车 进入 retail, hospitality, fueling, office, 、 restaurant 工作流, usually 通过
              a licensing motion 而不是 buying downstream 运营商. 该 broadens competitive frame to include adjacent
              checkout-free commerce stacks 、 component recognition vendors. same 扩张 thesis carries execution 风险:
              external 报告ing 已经 cites lawsuits 、 complaints over 计费 practices, 而 adjacent-市场 证据 高lights 该 even
              well-funded frictionless-checkout systems 可以 hit cost 、 complexity limits 之外 其 initial wedge. 扩张 creates
              更多 surface area for 买方 skepticism 从 房东, merchants, 、 隐私-sensitive end 客户.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP010
              - CP011
