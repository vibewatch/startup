      - CV014
  - id: TV002
    title: 正 / 反论点表
    columns:
      - 论点
      - 公开证据解读
      - 改变判断的因素
    rows:
      - - 正论点
        - Metropolis 已达到有意义的运营规模，年交易额超过 $5B，会员基础庞大。
        - 经核实的细分经济性和留存数据会让规模更具估值意义。
      - - 正论点
        - 管理层正尝试把识别基础设施延伸至零售、酒店、加油和出行领域，采取许可模式而非持有资产。
        - 已签署合同和已披露的非停车收入会强化这条上行路径。
      - - 反论点
        - 独立证据表明，增长高度依赖收购和融资，而非纯粹依靠软件的自然采用。
        - 同店自然增长及较低收购依赖的证据会缓解这一担忧。
      - - 反论点
        - 公开材料仍未将 $5B 估值与已披露的收入、利润率或资本表经济性联系起来。
        - 收入桥接、利润率画像及融资条款包将显著改善价格支撑。
    notes: 本表将公司质量论点与入场价格问题分开；判断会随证据和价格改变，而不是只随叙事改变。
    claimRefs:
      - CV003
      - CV006
      - CV007
      - CV012
      - CV013
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 停车之外的许可转化为真实合同收入，同时杠杆保持可偿付、披露质量提升。
        - 如果非停车软件经济性变得可见，当前估值可能靠业绩兑现，甚至进一步扩张。
        - 非停车采用停滞，或偿债吞噬运营收益。
        - 需要留存公开证据中尚未披露的证明。
      - - 基准
        - 停车规模保持韧性，相邻垂直领域确有扩张，但速度渐进且披露参差。
        - 当前估值仍难追高，因此上行更多取决于有纪律的入场，而非业务崩溃。
        - 价格可能在比公开投资者预期更长的时间里领先于经济性。
        - 最符合当前证据集。
      - - 悲观
        - 收入质量和杠杆被证明弱于表面融资所暗示的水平，同时投诉、诉讼或推广摩擦恶化。
        - 由于公开证据始终追不上叙事，$5B 估值下修。
        - 债务负担、客户摩擦，以及新股权有限的下行保护。
        - 这一情景合理，因为当前证据缺口仍很大。
    notes: 情景逻辑基于里程碑而非模型推导，因为留存公开来源未披露精确估值所需的收入运行率、利润率或融资条款细节。
    claimRefs:
      - CV004
      - CV008
      - CV009
      - CV012
      - CV013
      - CV014
