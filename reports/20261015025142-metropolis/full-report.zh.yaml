      - - 安全与隐私控制透明度
        - 中
        - 高
        - 低
        - 高
        - 需要审计、认证、留存政策、事件历史及生物识别治理文件
    notes: 缓释成熟度标签是定性的，反映该来源池中的公开证据，而非内部控制审计。
