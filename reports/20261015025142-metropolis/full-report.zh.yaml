      - number: '3.2'
        title: 分发、迁移与切换成本
        blocks:
          - type: paragraph
            body: >-
              在当前来源中，Metropolis 最清晰的优势不是功能深度，而是掌控一张正在运营的网络。SP+ 收购带来了既有客户关系和大量活跃场点；Baltimore 报道显示，这些场点迁移到 Metropolis
              数字层仍在进行，并未完成。对已处于该网络中的买方而言，这会形成有意义的转换阻力；但也意味着壁垒能否维持，取决于上线质量、收费实践和合作伙伴信任，不只是计算机视觉准确率。因此，壁垒一部分来自合同和运营，而非纯技术。
