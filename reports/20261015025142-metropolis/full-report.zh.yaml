        title: 定价空间与分发
        blocks:
          - type: paragraph
            body: >-
              尽管变现入口清晰，定价透明度仍然很弱。公司已经明确自动化按次停车支付，也开始描述未来以许可方式进入零售、酒店、加油和其他运营商工作流；但指定公开来源没有披露场站运营商与 Metropolis
              的实际费用分成、合同期限、实施费、软件订阅费或各收入流的毛利率贡献。分发似乎也异常依赖收购，而非纯粹依靠直销：SP+ 收购带来一张可迁移到平台的规模化运营网络，Baltimore
              报道表明迁移仍在进行。对尽调而言，关键商业问题不再是“Metropolis 能否卖停车科技”，而是“它能把多少已安装基础转化为更高质量的软件或网络收入，同时不陷入服务密集型经济性”。
