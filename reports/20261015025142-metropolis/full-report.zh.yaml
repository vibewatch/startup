        title: 领导层、资本与控制点
        blocks:
          - type: paragraph
            body: >-
              现有证据中的领导班子仍主要由创始人和少数运营高管组成。Alex Israel 仍以 CEO 兼联合创始人的身份担任公司公开代表，Courtney Fukuda
              则是另一位负责整合工作的联合创始人。资本结构已从风险投资建设转向更重的后期结构：Metropolis 从 2021 年 4,100 万美元的 A 轮，走到 2025 年 11 月由 11 亿美元定期贷款和约 5
              亿美元 D 轮股权组成、估值约 50 亿美元的融资包。资本规模不小，但现有公开材料仍未披露足以清晰评估治理的董事会、投票权或契约细节。
