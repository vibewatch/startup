              - CV009
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation
            body: Research-更多 at 当前公开price; 业务 looks 更多 可信 than 估值 支持.
            calloutType: recommendation
            claimRefs:
