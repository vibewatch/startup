      - number: '2.3'
        title: 买方图谱：所有者付费、司机使用、运营商分发
        blocks:
          - type: paragraph
            body: >-
              当前买方逻辑由资产所有者和运营商主导。公开材料反复把停车包装成所有者、资产管理者和管理团队的变现及运营效率工具，解决漏损控制、动态定价、人员配置和硬件开支问题；对司机而言，产品则提供无票、无现金通行。这形成了典型的企业采购模式：物业或运营预算承担部署成本，最终用户是司机或租户，而采用与场站是否有持续客流、是否值得为定价复杂度配置系统有关。停车之外，下一步似乎是通过许可模式进入加油、酒店、零售、办公和免下车场景，而不是由
              Metropolis 直接拥有这些场所。
