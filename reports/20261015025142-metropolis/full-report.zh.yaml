          - type: callout
            title: 扩张会引入相邻市场基准
            body: >-
              Moving 进入 retail, hospitality, 、 fueling 扩大 TAM, but it 也 imports cost, 隐私, 、 rollout skepticism 已经
              visible in adjacent frictionless-commerce systems.
            calloutType: risk
            claimRefs:
