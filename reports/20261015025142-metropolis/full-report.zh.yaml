      - number: '1.3'
        title: 规模、收购与里程碑进展
        blocks:
          - type: paragraph
            body: >-
              规模已不再只是理论。到 2025 年底，公司及其分销渠道声称已覆盖数千个地点，年度交易额超过 50 亿美元，会员/客户触达达到数千万。规模增长并非完全靠自然扩张：SP+ 收购显著扩大了运营基础，Oosto
              收购则把识别能力从以车辆为中心的停车场景拓展出去。因此，Metropolis 越来越像“收购整合 + 平台”的故事：收购和新垂直领域部署是商业模式的一部分，而非偶发公司事件。
