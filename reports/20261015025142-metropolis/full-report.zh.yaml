      - number: '1.4'
        title: 风险、矛盾与待核查事项
        blocks:
          - type: paragraph
            body: >-
              概览章节的核心提醒不是 Metropolis
              缺乏动能，而是部分规模数据和风险披露仅凭公开证据仍难以统一口径。官方页面、分销公告和独立报道中的地点数及会员数并不一致，因此后续章节应引用具体来源的指标，而不是压缩成一个所谓公司统一口径。与此同时，Baltimore
              Banner 显示，规模扩张伴随着围绕经营方式的客户摩擦和诉讼风险；现有材料也没有经审计收入、EBITDA
              对账、董事会构成或当前足以支撑资本结构分析的所有权视图。这些缺口不否定规模故事，却显著限制了本章对收入质量、治理和控制权的判断精度。
