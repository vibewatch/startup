  - id: TR003
    title: 合作伙伴 / 依赖风险登记表
    columns:
      - 依赖项
      - 对手方 / 场景
      - 作用
      - 集中度信号
      - 失败情景
      - 严重性
      - 缓释措施
      - 剩余暴露
    rows:
      - - 资本提供方与贷款方
        - JPMorgan、LionTree 牵头的股权投资方及更广泛的投资者银团
        - 为扩张和收购提供资金，并保持资产负债表灵活性
        - 2025 年资本结构包含约 $1.1B 债务和约 $500M 新股权
        - 新垂直领域形成规模前，契约收紧或再融资变贵
        - 高
        - 新增股权及机构支持者降低近期流动性风险
        - 中-高
      - - 继承的 SP+ 运营基础
        - SP+ 地点、机场 / 商业客户及一线员工队伍
        - 提供覆盖范围、人力及企业关系
        - 交易材料提到 20,000+ 名团队成员、3,300 个商业地点、160+ 个机场和 360+ 个城市
        - 迁移延误或服务问题会拖慢协同兑现及客户留存
        - 高
        - Baltimore 迁移证据显示已有进展，但尚未完成
        - 中-高
      - - 所有者 / 渠道 / 合作伙伴生态
        - 房地产所有者、出行合作伙伴、零售商、燃料及酒店运营商
        - 在核心停车资产之外部署识别软件所必需
        - 公开简介来源列出 Bilt、Joby Aviation、Uber、CBRE、Cushman & Wakefield 和 Brookfield，而扩张计划取决于运营商采用
        - 大型对手方延迟推广，或压缩经济性 / 数据访问
        - 中-高
        - 软件许可比购买终端资产更省资本
        - 中-高
    notes: 集中度信号基于留存来源池中的公开对手方和融资披露；这些信号不量化各伙伴收入份额，因为这里未披露该分母。
