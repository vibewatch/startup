        title: 资本结构与充足性
        blocks:
          - type: paragraph
            body: >-
              强est 当前fact in chapter 是 资本 structure itself. Metropolis said in November 2025 该 it closed a $1.6 billion
              package consisting of a $1.1 billion Term 贷款 B 、 约$500 million of Series D 股权 at an 约$5 billion 估值. Tracxn
              separately records same 日期 as a $500 million Series D plus $1.1 billion of conventional 债务, 这 是 helpful 因为
              it separates 股权 funding 从 更广泛 融资 标题. implication 是 double-edged: Metropolis 有 clearly 曾 able to raise very
              大型 sums to fund 扩张, but 最新 round added a 重大 债务 layer at same time. 没有 公开burn, free-cash-f低, covenant, 或
              债务-service 披露s, 资本 adequacy cannot 是 underwritten 从 公开记录 alone.
