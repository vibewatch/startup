        title: 结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              从财务角度看，Metropolis
              像一家规模化但仍不透明的平台型整合者。积极的一面是，公司已建立庞大的实体网络，披露了有意义的交易额，并似乎希望通过软件式许可进入停车之外的领域，而不是直接收购每个相邻垂直市场。消极的一面是，公开来源仍未显示确认收入、利润率结构、CAC、回本周期或契约余量；不利证据还指向部分市场中的客户摩擦和法律成本风险。因此，当前投资判断取决于管理层能否证明场点迁移、软件渗透和相邻垂直合同，足以在
              $5 billion 估值及 billion-dollar 债务负担下产生相称的收入质量。
            claimRefs:
              - CI001
              - CI012
              - CI013
              - CI016
