  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开进展
        blocks:
          - type: paragraph
            body: >-
              可观察的模式从免结账停车和场点运营起步，再延伸到 Metropolis 希望用同一识别技术栈服务的相邻实体商业场景。公开披露一致表明，停车仍是经过验证的切口：2021 年 A
              轮公开信将停车描述为尚未充分变现的资产类别，并把 Metropolis 定义为识别车辆、自动结账、消除人工支付摩擦的基础层。到 2025 年末，公司披露年度交易额超过 $5 billion、会员近 20
              million、客户 50 million；2026 年 1 月的一篇地方市场报道则暗示，融资完成后网络仍在扩张。这是有意义的商业规模，但仍是使用量和处理量故事，而不是已披露的确认收入故事。
            claimRefs:
