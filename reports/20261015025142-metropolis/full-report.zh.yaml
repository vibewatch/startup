  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与替代方案
        blocks:
          - type: paragraph
            body: >-
              竞争集合不止“停车科技”。来源一致把现状描述为人工岗亭、取票机、现金处理、优惠核销和零散的本地运营流程，因此 Metropolis
              试图同时替代软件和运营人力。比较对象不仅是直接软件同行，也包括传统停车运营商、自营场站和人工流程。最有力的证据还显示，公司把停车作为更大识别与支付基础设施命题的入口；即使相邻的免结账和生物识别厂商不拥有停车资产，也值得纳入比较。实际采购中，买方比较的不只是应用功能，也包括对运营扰动的容忍度。
