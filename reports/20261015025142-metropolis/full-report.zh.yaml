        title: Exhibits
        blocks:
          - type: callout
            title: 分发比演示更重要
            body: >-
              decisive contrast in assigned 证据 是 access to live operating 地点 、 迁移 权利, 不just existence of 计算机视觉 或
              checkout-free UX.
            calloutType: insight
