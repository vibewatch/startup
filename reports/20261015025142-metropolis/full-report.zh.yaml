      - number: '2.4'
        title: 需求驱动、约束与尚未验证之处
        blocks:
          - type: paragraph
            body: >-
              对司机而言，采用理由很直接：提高通行效率、减少现金漏损、支持动态定价，并帮助所有者提高资产利用率。更难回答的是，在监管、信任和定价审查加剧之前，这套停车经济性是否能顺利复制到相邻垂直领域。Fortune
              将这一故事与隐私和消费者信任之间的平衡、以及随之而来的法律和监管问题联系起来；地方报道仍不断出现用户对费用难以理解的投诉，即使公司强调正面评价。因此，扩张叙事足以支撑更广泛的机会框架，但还不能证明分部收入转化、预算持续性或可量化的非停车
              SOM。
            claimRefs:
              - CM006
              - CM007
              - CM012
              - CM013
              - CM015
              - CM016
