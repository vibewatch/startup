        title: 市场边界：先看停车，再看实体商业
        blocks:
          - type: paragraph
            body: >-
              目前最有证据支持的市场边界仍是停车运营和支付，而不是已充分披露的跨垂直商业平台。Metropolis
              将停车描述为尚未充分变现的房地产层，也是计算机视觉系统最先实际部署的场景；当前运营描述仍围绕停车设施中司机的自动进场、离场和计费。更广义的“识别经济”对估值有意义，但公开证据目前只把它放在零售、酒店、加油、出行、办公及相关路边流程等相邻领域，并未显示其已形成单独披露的收入基础。
