chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Metropolis 将自己定位为服务实体世界的应用型
              AI，而停车仍是公司最具体的落地切口。官网和停车专项材料都把产品描述为一层识别基础设施：它能实时识别车辆及其上下文，而不只是提供支付这一项功能。这一点很重要，因为后续分析产品、客户和估值时，应把停车视为更广泛识别平台的已安装基础。现有证据中的身份信息相对稳定：公司将启动时间追溯至
              2017 年，强调源自 Los Angeles，并继续把停车作为验证无缝、免结账体验的场景，然后再进入其他实体商业工作流。
