  - id: TV001
    title: 建议摘要表
    columns:
      - 指标
      - 评估
      - 决策含义
    rows:
      - - 建议
        - research-more
        - 在获得更完整的经济性披露前，不要按当前公开报价做投资判断。
      - - 置信度
        - medium
        - 运营规模真实存在，但估值支撑仍不完整。
      - - 风险评级
        - high
        - 债务、法律 / 客户摩擦及执行风险都可能压缩上行情景。
      - - 估值立场
        - stretched
        - 就已披露的公开经济性而言，$5B 估值更像一个引用数字，难以得到论证。
      - - 入场纪律
        - 等待证据或更低价格
        - 更明确的判断需要经核实的收入、利润率、杠杆细节及非停车变现证据。
    notes: 截至 2026-10-15 的公开证据综合；本表不是条款清单分析，也无法获取私人债务、优先权或现金流计划。
