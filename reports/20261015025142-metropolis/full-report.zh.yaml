              和现金流。公司还需要证明，停车之外的扩张能带来签约收入和经常性经济性，而不只是合作伙伴新闻稿。如果尽调显示现金转化强、杠杆可控，且非停车采用可以重复，即使价格没有下降，建议也可能改善；如果这些要求无法满足，法律或客户摩擦扩大，或者增长仍主要依赖收购和资本市场融资，当前估值就应被视为论点失效，而不是信心增强。
            claimRefs:
