callouts:
- title: First and Largest Supply Chain Visibility Unicorn
  body: project44 was the first supply chain visibility platform to achieve unicorn status, reaching $2.7B in February 2022.
    Its 1,300+ carrier network and 180+ country coverage create a data network that is extremely difficult for competitors
    to replicate — each new carrier added increases the platform's value for all existing shippers, creating a classic two-sided
    marketplace network effect.
  calloutType: strength
  claimRefs:
  - CO003
  - CO008
  - CO014
- title: CEO Transition Introduces Execution Risk
  body: The May 2023 departure of founder Jett McCandless from the CEO role is the most significant adverse event in project44's
    recent history. McCandless was the company's primary customer relationship builder and external evangelist during the
    high-growth phase. Lucas Mansfield brings enterprise SaaS scaling experience, but maintaining cultural momentum and customer
    trust during the leadership transition period carries inherent risk.
  calloutType: risk
  claimRefs:
  - CO015
  - CO002
