callouts:
- title: Three-Year Financing Gap Is the Biggest Financial Risk Signal
  body: project44 has not raised new capital since February 2022 — a 3+ year gap through 2025. This is either a strong positive
    signal (approaching cash-flow breakeven) or a risk signal (unable to raise at $2.7B valuation in reset market). The ambiguity
    cannot be resolved without access to financials. The $420M raise at estimated $30-50M annual burn implies runway extending
    through 2024-2026, suggesting near-breakeven is the more likely interpretation.
  calloutType: risk
  claimRefs:
  - CI004
  - CI005
- title: 30% Growth and Strong Investor Quality Support $2.7B Carry
  body: project44's 30%+ growth rate, Goldman Sachs-led institutional investor base, and Bessemer's 8-15x ARR benchmark for
    comparable platforms provide reasonable support for the $2.7B carrying value. However, the absence of publicly disclosed
    NRR, gross margin, and churn creates material underwriting uncertainty, and the 2022 peak-market valuation carries compression
    risk in a secondary transaction.
  calloutType: insight
  claimRefs: []
