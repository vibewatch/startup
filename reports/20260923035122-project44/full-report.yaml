chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Platform Overview
        blocks:
          - type: paragraph
            body: >-
              project44 is a Chicago-based logistics technology company founded in 2014 by Jett McCandless, building the
              world's largest real-time supply chain visibility network. The company's flagship product, the Movement
              platform, provides enterprise shippers with real-time shipment tracking, predictive ETA calculations, and
              exception management across all major transportation modes — ocean, air, rail, and trucking. The platform
              integrates with 1,300+ carriers and brokers across 180+ countries, creating a network scale that is the
              company's primary competitive moat. project44's Movement platform is API-first and architecture-agnostic,
              connecting to carrier APIs, EDI feeds, IoT sensor data, and port authority information to create a unified
              shipment data layer. The platform's AI capabilities center on predictive ETA technology — using historical
              carrier performance data, weather signals, and real-time congestion information to improve arrival time
              accuracy by up to 40% versus traditional carrier-provided ETAs. Exception management — proactive alerts on
              delays, port congestion, and carrier underperformance — is the highest-value feature cited by enterprise
              customers, reducing manual supply chain analyst work by an estimated 30-50%. Gartner named project44 a
              Leader in its 2024 Magic Quadrant for Real-Time Transportation Visibility Platforms, confirming its
              market-leading position in a category it helped define. The platform serves 1,200+ enterprise accounts
              across CPG, automotive, pharmaceutical, and retail sectors, including reference customers 3M, AB InBev,
              Pfizer, Walmart, and Unilever.
            claimRefs: []
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO006
              - CO008
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO005
              - CO003
      - number: '1.2'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              project44 underwent a significant leadership transition in May 2023 when founder and CEO Jett McCandless
              stepped down and was replaced by Lucas Mansfield, who joined from a board position. McCandless built
              project44 from a Chicago logistics data startup to a $2.7B unicorn over 8 years, establishing the
              company's carrier network strategy and key enterprise customer relationships. The founder departure is a
              noted adverse event — McCandless was the company's primary customer relationship anchor during the
              high-growth phase, and leadership transitions in founder-led B2B companies carry execution continuity
              risk. Lucas Mansfield brings enterprise SaaS scaling experience to the CEO role and has the backing of the
              board and growth equity investors to manage the next phase of expansion. The board includes representation
              from IVP (Institutional Venture Partners), Goldman Sachs, and other institutional investors who provide
              financial oversight and strategic guidance. The leadership team includes a CTO responsible for the
              Movement platform architecture and AI roadmap, and a Chief Revenue Officer overseeing global enterprise
              sales.
            claimRefs: []
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO011
              - CO014
      - number: '1.3'
        title: Funding History and Scale Metrics
        blocks:
          - type: paragraph
            body: >-
              project44 achieved unicorn status with its $420M Series F round in February 2022, led by Goldman Sachs at
              a $2.7B valuation — becoming the first supply chain visibility platform to reach that milestone. Total
              funding raised is approximately $698M+ across Series A through Series F, with investors including Goldman
              Sachs, IVP, Emergence Capital, Sapphire Ventures, and strategic logistics investors. The Series F funding
              was used to expand carrier network coverage globally, accelerate product development on AI-powered
              predictive analytics, and pursue acquisition targets to fill modal coverage gaps (Ocean Insights was
              acquired in September 2022). As of 2024, project44 has reached approximately $210M+ in revenue (30%+ YoY
              growth from ~$160M in 2023), based on third-party industry analyst estimates from FreightWaves and Modern
              Shipper. This revenue trajectory demonstrates consistent growth across the post-Series F period despite
              the CEO transition in 2023, suggesting the business model and platform economics remain resilient to
              leadership change. Headcount is approximately 900 employees globally, with offices in Chicago (HQ),
              Amsterdam, Atlanta, London, Paris, and Bangalore. The $2.7B Series F valuation from February 2022 remains
              the last publicly confirmed financing reference point, with no subsequent equity rounds announced through
              May 2026. PitchBook confirms the company's unicorn status is maintained as of 2024 with no evidence of a
              down-round. The absence of new financing rounds over 3+ years (2022-2025) while maintaining 30%+ growth
              and an estimated $210M revenue base suggests the company may be approaching cash flow breakeven or
              profitability — consistent with a trajectory toward an eventual IPO or strategic exit. Revenue growth has
              been fueled by the structural macro tailwind of enterprise supply chain digitalization post-COVID, with
              large multinationals increasingly mandating real-time visibility from logistics providers as a standard
              supply chain operations requirement.
            claimRefs: []
          - type: table
            tableRef: TO003
            claimRefs:
              - CO007
              - CO008
              - CO011
              - CO014
              - CO016
      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: First and Largest Supply Chain Visibility Unicorn
            body: >-
              project44 was the first supply chain visibility platform to achieve unicorn status, reaching $2.7B in
              February 2022. Its 1,300+ carrier network and 180+ country coverage create a data network that is
              extremely difficult for competitors to replicate — each new carrier added increases the platform's value
              for all existing shippers, creating a classic two-sided marketplace network effect.
            calloutType: strength
            claimRefs:
              - CO003
              - CO008
              - CO014
          - type: callout
            title: CEO Transition Introduces Execution Risk
            body: >-
              The May 2023 departure of founder Jett McCandless from the CEO role is the most significant adverse event
              in project44's recent history. McCandless was the company's primary customer relationship builder and
              external evangelist during the high-growth phase. Lucas Mansfield brings enterprise SaaS scaling
              experience, but maintaining cultural momentum and customer trust during the leadership transition period
              carries inherent risk.
            calloutType: risk
