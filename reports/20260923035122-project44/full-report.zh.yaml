  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台架构与核心产品
        blocks:
          - type: paragraph
            body: >-
              project44 的 Movement 平台是 API-first、云原生供应链可视化平台，由五个主要模块组成——Real-Time Visibility、Predictive
              Intelligence、Exception Management、Supply Chain Intelligence 和 Developer Platform——全部建立在统一数据层之上。平台数据架构每年通过
              AWS 云原生微服务处理约 1 billion+ 个可视化事件，使用 Apache Kafka 做实时事件流，使用时间序列数据库做历史分析。现代架构让公路货运追踪更新可在亚秒级完成，也让 AI
              模型能用最新承运商表现数据持续再训练。承运商数据摄取按承运商技术成熟度分三种方式：现代承运商用 REST API，传统承运商用旧式 EDI X12/EDIFACT，实时公路 GPS 用 IoT
              车联网。平台原生集成 SAP ERP、Oracle TMS、Blue Yonder TMS 和 Manhattan Associates WMS，按装机基础覆盖约 80% 的企业 TMS/ERP
              市场。开发者平台包括 REST API v4、150+ 个已文档化端点、Python/Java/JavaScript SDK，以及用于集成测试的沙盒环境。G2 开发者评论给 API 文档打
              3.9/5，指出复杂集成代码示例和传统 EDI 迁移支持不足。平台的异常管理模块使用基于 ML
              的异常检测，自动分类中断根因（承运商延误、港口拥堵、天气、海关）并生成解决动作，让供应链管理从被动追踪转为主动处置。制药解决方案在平台上扩展 IoT 温度监控和 DSCSA
              序列化事件追踪，用于冷链和专业药品合规。
            claimRefs: []
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE011
              - CE015
      - number: '5.2'
        title: AI 与智能能力
        blocks:
          - type: paragraph
            body: >-
              project44 最重要的技术差异化是 AI 预测 ETA 模型。模型采用两层架构——底层模型用承运商特定历史表现训练，情境模型纳入实时信号（天气、港口拥堵、运力）来生成概率化 ETA 窗口。公司称，ETA
              准确度相较静态承运商 ETA 提升 40%；FreightWaves 独立分析验证了高货量公路货运线路上的这一说法，同时指出新兴市场和数据稀疏线路准确度较低。2024 年 9 月推出的 Supply Chain
              Intelligence（SCI）AI 套件，是从追踪进入战略智能的一次重要产品扩展——新增 Predictive Disruption Risk 评分、Lane Performance
              Benchmarking（跨客户聚合）和 Carrier Scorecard
              AI。跨客户智能架构会聚合所有平台客户的匿名化货运数据，生成客户仅靠自身数据无法得出的线路级基准——这是一种独特的网络效应数据产品。该能力正在形成更深的竞争护城河，因为它需要网络规模才能生成统计上显著的基准；没有可比客户覆盖的小竞争对手难以复制。2024-2025
              年路线图优先三件事：扩展 AI 驱动的 Supply Chain Intelligence、多式联运承运商覆盖增长到东南亚和拉丁美洲，以及增强用于实时数据流集成的 GraphQL API 能力。2024
              年新增的东南亚承运商集成（50+）扩大了平台对从亚洲制造枢纽采购的全球企业的地理覆盖。
            claimRefs: []
          - type: table
            tableRef: TE002
            claimRefs:
              - CE005
              - CE015
      - number: '5.3'
        title: 产品质量、缺口与风险
        blocks:
          - type: paragraph
            body: >-
              project44 持有 SOC 2 Type II、ISO 27001 和 GDPR 合规认证，并接受年度第三方审计，满足企业采购要求。平台 2024 年实现 99.9%+
              可用性，未公开报告重大事故；少量承运商特定数据缺口在 SLA 时间内解决。数据质量标准要求承运商数据达到最低刷新率门槛——公路货运首选低于 60
              分钟，低于门槛的承运商会在客户仪表盘中用置信度评分标记。最重大的产品缺口是实施复杂度——典型企业上线需要 3-6 个月完成初始集成，再花 3-6 个月优化，使产品部署难度高于 FourKites
              更简单的上线流程。这种复杂度是 Gartner Peer Insights 和 G2 评论中最常被提到的弱点，也推高了 project44 与 FourKites 的满意度差距（4.2/5 vs.
              4.4/5）。技术风险包括承运商 API schema 变化、1,300+ 承运商网络中的数据质量差异，以及跨境货运中 GDPR 和海关数据合规。由于海运依赖 AIS 船舶追踪（2-4
              小时更新），颗粒度低于依靠实时 GPS 车联网的公路货运。
