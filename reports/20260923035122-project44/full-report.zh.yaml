              2024 年 9 月推出的 Supply Chain Intelligence AI 套件，标志着 project44 从追踪工具进化为战略智能平台。跨客户基准模块会聚合 1,200+
              企业客户的匿名化货运数据，形成独特的数据网络效应。单客户分析平台无法复制来自多托运方数据的线路级基准。这让 project44 有机会把价值主张从运营追踪扩展到战略采购和承运商管理智能，并可能显著提高单客户
