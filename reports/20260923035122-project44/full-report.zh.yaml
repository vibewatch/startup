            title: 首个且最大的供应链可视化独角兽
            body: >-
              project44 是首个达到独角兽状态的供应链可视化平台，2022 年 2 月估值达到 $2.7B。其 1,300+ 承运商网络和 180+
              国家覆盖形成竞争对手极难复制的数据网络——每新增一家承运商，都会提升平台对所有现有托运方的价值，形成典型双边市场网络效应。
            calloutType: strength
            claimRefs:
              - CO003
              - CO008
              - CO014
          - type: callout
            title: CEO 交接带来执行风险
            body: >-
              2023 年 5 月，创始人 Jett McCandless 卸任 CEO，是 project44 近期历史中最重大的反向事件。高增长阶段，McCandless
              是公司最主要的客户关系搭建者和外部布道者。Lucas Mansfield 带来企业 SaaS 扩张经验，但在领导层交接期守住文化势能和客户信任，本身就有风险。
            calloutType: risk
            claimRefs:
              - CO015
              - CO002
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与规模
        blocks:
          - type: paragraph
            body: >-
              实时供应链可视化平台市场 2024 年全球规模估计为 $7.6B；到 2028 年，按分析师定义范围不同，将以 15-24% CAGR 增至 $18.2B。Gartner 对 RTTVP 品类的定义更窄，聚焦带
              AI 预测分析的多式联运追踪平台，对应软件市场 2024 年约 $3.1B。更广义的供应链管理技术市场（包括 TMS、WMS、规划和可视化）2024 年约 $24B，CAGR 为
              14-16%；可视化平台占企业供应链 IT 支出的 8-12%，相对于运营关键性仍然渗透不足。供应链可视化的关键子市场包括最后一公里配送可视化（全球 $12B，18% CAGR，面向
              B2C）和海运货运可视化（$2.4B，随红海危机后的需求激增而增长）。project44 的总可用市场（TAM）是完整的 $7.6B+ 全球市场；可服务市场（SAM）约
              $4.2B，聚焦有复杂多式联运需求的大型企业托运方。按 $210M ARR 计算，project44 已拿下约 5% SAM，后续增长仍有大量空白。
            claimRefs: []
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
