      - number: '4.2'
        title: 资本结构与财务位置
        blocks:
          - type: paragraph
            body: >-
              project44 于 2022 年 2 月完成 Series F，按 $2.7B 估值融资 $420M 新股资本，由 Goldman Sachs Equity Partners 领投，Emergence
              Capital 和 Sapphire Ventures 参与。自 2016 年 Series A 以来，截至 Series F 累计融资约 $698M+。公司自 2022 年 2 月以来没有再融资——到 2025
              年已超过 3 年——也没有提交 IPO 文件。超过 3 年的融资空窗有两种解读：project44 可能已接近现金流盈亏平衡、无需资本（正向信号）；也可能无法以等于或高于 2022 年 $2.7B
              账面估值的价格融资（反向信号）。如果 $420M 按估计每年 $30-50M 烧钱速度投入 36-48 个月，现金跑道可延伸至 2024 年末到 2026 年，说明公司在 2026
              年中可能已经或接近现金流盈亏平衡。投资人基础质量（Goldman Sachs、Emergence Capital）提供弱信心，表明公司不处于财务困境。重大财务数据缺口包括毛利率、NRR、EBITDA、流失率和
              CAC——这些都未公开披露，使严谨财务承销必须依赖分析师估计。
