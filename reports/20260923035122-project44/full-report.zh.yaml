      - number: '3.2'
        title: 竞争定位与护城河
        blocks:
          - type: paragraph
            body: >-
              project44 最可防守的竞争护城河是 1,300+ 承运商网络。这代表 10+ 年的承运商关系建设投入，FourKites 若要复制需要 3-5
              年。该网络形成数据网络效应——每新增一家承运商，都会为所有现有托运方增加价值；聚合的承运商表现数据，又驱动 project44 的关键产品差异化能力：AI 预测 ETA
              模型。集成锁定是第二层护城河——一旦托运方把 project44 配置为 SAP、Oracle 或 Blue Yonder TMS 中的数据源，移除它就需要重做所有已连接工作流，估计耗时 3-6 个月并消耗
              $150K+ IT 资源。project44 的跨客户供应链智能基准数据形成第三项竞争优势——基于多托运方数据得出的独特线路表现洞察，小竞争对手没有可比规模就无法提供。在竞争赢单 /
              输单动态中，project44 赢在复杂、全球、多式联运评估中；在更简单的中端市场账户中，若易用性是首要标准，则会输给 FourKites。ERP
              厂商威胁（SAP、Oracle）在各自装机基础内最尖锐，捆绑式可视化功能可能降低客户为独立平台付费的意愿。
