chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份与平台概览
        blocks:
          - type: paragraph
            body: >-
              project44 是一家总部位于 Chicago 的物流科技公司，由 Jett McCandless 于 2014 年创立，搭建全球最大的实时供应链可视化网络。旗舰产品 Movement
              平台为企业托运方提供实时货运追踪、预测 ETA 计算和异常管理，覆盖海运、空运、铁路和公路等所有主要运输方式。平台接入 180 多个国家的 1,300
              多家承运商和经纪商，网络规模就是公司的首要竞争护城河。Movement 采用 API-first、架构无关设计，连接承运商 API、EDI 信息流、IoT 传感器数据和港口管理机构信息，形成统一货运数据层。AI
              能力以预测 ETA 技术为核心——用历史承运商表现数据、天气信号和实时拥堵信息，将到达时间准确度相对传统承运商 ETA 最高提升
              40%。异常管理会主动提示延误、港口拥堵和承运商履约不佳，是企业客户提到价值最高的功能，估计可减少 30-50% 的人工供应链分析工作。Gartner 在 2024 年 Real-Time
              Transportation Visibility Platforms Magic Quadrant 中将 project44 评为 Leader，确认其在这一由自身参与定义的品类中的市场领先地位。平台服务
              1,200 多个企业账户，覆盖 CPG、汽车、制药和零售行业，包括 3M、AB InBev、Pfizer、Walmart 和 Unilever 等标杆客户。
            claimRefs: []
