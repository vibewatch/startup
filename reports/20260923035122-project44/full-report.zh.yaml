      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              project44 在 2023 年 5 月经历重大领导层交接：创始人兼 CEO Jett McCandless 离任，由此前在董事会任职的 Lucas Mansfield 接任。McCandless 用 8
              年把一家 Chicago 物流数据初创公司建成 $2.7B 独角兽，确立了承运商网络策略和关键企业客户关系。创始人离任是明确的反向事件——高增长阶段，McCandless 是公司最核心的客户关系锚点；创始人主导的
              B2B 公司换帅，本身就有执行连续性风险。Lucas Mansfield 带来企业 SaaS 扩张经验，并获得董事会和成长型股权投资人的支持，负责管理下一阶段扩张。董事会有 IVP（Institutional
              Venture Partners）、Goldman Sachs 和其他机构投资人代表，提供财务监督和战略指导。领导团队包括负责 Movement 平台架构与 AI 路线图的
              CTO，以及负责全球企业销售的首席收入官（CRO）。
            claimRefs: []
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO011
              - CO014
      - number: '1.3'
        title: 融资历史与规模指标
        blocks:
          - type: paragraph
            body: >-
              project44 在 2022 年 2 月由 Goldman Sachs 领投的 $420M Series F 轮中，以 $2.7B 估值跻身独角兽，成为首个达到这一里程碑的供应链可视化平台。Series A
              至 Series F 累计融资约 $698M+，投资人包括 Goldman Sachs、IVP、Emergence Capital、Sapphire Ventures 和战略物流投资人。Series F
              资金用于全球扩展承运商网络覆盖、加速 AI 驱动预测分析产品开发，并寻找并购目标补齐运输方式覆盖缺口（Ocean Insights 于 2022 年 9 月被收购）。截至 2024 年，基于
              FreightWaves 和 Modern Shipper 等第三方行业分析师估计，project44 收入约 $210M+（较 2023 年约 $160M 同比增长 30%+）。尽管 2023 年更换
              CEO，这条收入曲线在 Series F 之后仍保持稳定增长，说明商业模式和平台经济性对领导层变化有韧性。全球员工约 900 人，办公室位于
              Chicago（总部）、Amsterdam、Atlanta、London、Paris 和 Bangalore。2022 年 2 月的 $2.7B Series F 估值仍是最后一次公开确认的融资参考点，截至
              2026 年 5 月没有后续股权融资公告。PitchBook 确认公司截至 2024 年仍保持独角兽身份，没有降轮迹象。2022-2025 年超过 3 年没有新融资，同时保持 30%+ 增长和估计 $210M
              收入基础，说明公司可能正接近现金流盈亏平衡或盈利——这与最终 IPO 或战略退出路径一致。收入增长受益于 COVID
              后企业供应链数字化这一结构性宏观顺风：大型跨国公司越来越把物流服务商提供实时可视化视为标准供应链运营要求。
            claimRefs: []
