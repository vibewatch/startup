        title: 客户基础与企业牵引力
        blocks:
          - type: paragraph
            body: >-
              project44 服务 1,200+ 企业客户，覆盖 180+ 国家和 1,300+ 承运商，客户基础包括多个垂直行业的 Fortune 500 标杆客户。公开点名客户包括 3M（Fortune 100
              制造商）、ABInBev（全球 CPG）、Pfizer（制药）、Walmart（全球零售商）和 Unilever（CPG/消费品）——这些都是高价值锚定账户，验证了平台在不同垂直用例中的适用性。Wall
              Street Journal 2024 年报道独立确认了 project44 的 Fortune 500 客户名单质量，不仅仅依赖公司自撰案例。客户增长轨迹确认了 30%+ 收入增长：账户数从 2021 年约
              800 个增至 2024 年 1,200+，由企业标杆客户有机获取和 Convey、Ocean Insights 收购带来的约 400+ 客户增加共同推动。平台每年处理约 1 billion+ 货运事件，产生支撑
              AI 预测模型和跨客户供应链智能的数据量。垂直行业拆分约为 25% CPG/FMCG、20% 零售、15% 制药 / 生命科学、15% 汽车 / 工业和 10% 科技 / 电子——其中制药是增长最快的垂直，受
              DSCSA 合规顺风和温控链监控要求驱动。按地域看，北美估计贡献收入 55-65%，西欧为 25-30%，亚太为 10-15%；考虑到 APAC 占全球制造业 40%+，渗透不足很明显。
