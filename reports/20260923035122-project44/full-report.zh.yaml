        title: 单位经济与估值背景
        blocks:
          - type: paragraph
            body: >-
              project44 估计毛利率为 65-75%，因承运商集成基础设施成本低于纯 SaaS 基准；上市可比公司 Descartes 的毛利率为 75-78%。基于增长轨迹和客户基础扩张模式，NRR 估计为
              115-125%。按 SaaS Capital 的物流 SaaS 基准，获客成本回本周期估计为 24-36 个月。估计每员工收入 $230K，落后于企业 SaaS
              基准，但符合一家处于网络扩张模式公司的特征。按当前轨迹，2022 年 $2.7B 估值意味着 2024 年 ARR 的 12-13x，与供应链 SaaS 上市可比倍数上沿一致。Bessemer 基准显示，30%+
              增长的供应链 SaaS 公司 ARR 倍数为 8-15x，支持 $2.7B 账面估值处在区间高端。不过，2022 年估值是在私募市场倍数高点设定；若发生二级市场交易，基于当前公开市场可比公司，公允价值估计可能为
              $1.8-2.4B。NRR、毛利率和流失率缺乏披露，仍是财务承销中最重大的风险。
