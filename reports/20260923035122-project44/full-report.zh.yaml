              - CM003
              - CM004
      - number: '2.2'
        title: 需求驱动与市场增长
        blocks:
          - type: paragraph
            body: >-
              COVID-19 从结构上加速了供应链可视化需求——McKinsey 2024 年调查显示，85% 的 Fortune 500 供应链高管在 COVID 后增加技术投入，并把实时可视化列为首要事项。2023
              年末红海航运危机重新抬高了动态海运追踪的紧迫性，带来新一波平台采用。近岸化和回流趋势正在形成新的美国—墨西哥、美国—东欧供应链通道，企业监控新建立的供应商关系时，会产生增量追踪需求。监管要求是关键的合规驱动需求：FDA
              的 DSCSA 药品可追溯要求（2024 年 11 月生效）要求制药公司进行批号级序列化追踪，由此形成一波规模可观的监管驱动采购。AI 正在重塑价值主张——Forrester 预计，到 2026 年，AI
              增强可视化平台会比传统追踪收取 30-50% 的价格溢价；McKinsey 估计，AI 驱动预测 ETA 可为大型制造商减少 15-25% 的中断成本。Fortune 1000 渗透率仍只有
              55-65%，意味着还有 35-45% 的大型企业依赖人工追踪，市场扩张空间仍在。
            claimRefs: []
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
      - number: '2.3'
        title: 市场约束与不利因素
        blocks:
          - type: paragraph
            body: >-
              供应链可视化采用的主要市场约束是集成复杂度——60%+ 未采用者把连接承运商 API、传统 EDI 系统和 ERP 平台的技术开销列为首要障碍。中端市场公司缺少专门企业 IT 资源，这种集成负担最重，也解释了为何
              Fortune 100 采用率（80%+）远高于 Fortune 500-1000（30-40%）。市场面临来自 TMS 平台厂商（SAP、Oracle、Blue
              Yonder）的长期结构性风险：如果可视化变成标准 TMS 功能，而不是独立平台，市场可能被商品化，project44 当前能收取的溢价也会被压缩。不过，project44 的 1,300+
              承运商网络广度是一项差异化能力，TMS 厂商仅靠内部开发很难复制。市场整合正在加速——Descartes 已完成多笔收购，SAP/Oracle 也在投入原生可视化——这意味着独立平台溢价窗口可能在 5-7
              年维度收窄。WTO 数据显示全球贸易量仅增长 2.7-3.3%，确认可视化市场增长来自技术采用率，而不是底层贸易扩张。市场也出现双速采用：Fortune 100 公司在推动 AI 原生预测平台，而 Fortune
              500-1000 买家仍主要看承运商网络广度和 ERP 集成便利性——这给 project44 创造了天然市场分层机会，可通过合适的产品分层同时赢下高端和中端市场。Federal Reserve
              工业生产数据显示，2024 年美国制造业利用率为 77-78%，对应一个温和增长环境，足以支持供应链效率 IT 的稳定投资，但没有 2020-2022
              危机期的急迫性。需求驱动回归常态后，供应链可视化厂商必须靠产品差异化和 ROI 证明竞争，而不能再依赖 COVID 后采用浪潮中的紧迫性销售。
            claimRefs: []
          - type: table
            tableRef: TM003
            claimRefs:
              - CM015
      - number: '2.4'
        title: 重点证据
        blocks:
          - type: callout
            title: FDA DSCSA 合规是短期需求催化剂
            body: >-
              FDA 的 Drug Supply Chain Security Act 序列化要求于 2024 年 11 月全面生效，在制药行业为供应链可视化平台制造了一波集中的监管驱动采购。project44 的
              Movement 平台具备多式联运追踪和深承运商网络，有能力拿下由合规要求驱动的制药企业合同；这一要求一旦实施，不会自行消退。
            calloutType: insight
            claimRefs:
              - CM007
          - type: callout
            title: TMS 原生集成是主要长期市场风险
            body: >-
              SAP、Oracle 和 Blue Yonder 将原生实时可视化集成进自家 TMS 平台，从而取消独立可视化层需求，这是供应链可视化平台市场增长率面临的主要结构性威胁。project44 的 1,300+
              承运商网络提供了 TMS 厂商难以复制的数据护城河，但 5-7 年维度的风险真实存在，需要持续监控。
            calloutType: risk
            claimRefs: []
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              实时供应链可视化平台市场呈寡头竞争格局：project44 和 FourKites 是共同领先者，Descartes Systems 是上市公司挑战者，SAP/Oracle 则从 ERP
              层构成结构性威胁。Gartner 2024 年 Magic Quadrant 将 project44 和 FourKites 列为共同 Leaders，其中 project44 在 Ability to
              Execute 上排名更高，FourKites 在 Completeness of Vision 上领先。Forrester Wave 给出相反视角——将 FourKites 评为
              Leader、project44 评为 Strong Performer，并指出用户体验存在缺口。project44 的 1,300+ 承运商和经纪商网络相较 FourKites 估计 1,000+
              的网络，是最可触摸的差异化——网络广度形成数据飞轮，随着时间推高 AI 模型质量。不过，FourKites 在 Gartner Peer Insights 上评分更高（4.4/5 vs.
              4.2/5），说明网络深度并不能完全弥补客户体验差距。上市竞争对手 Descartes 通过多次收购搭建了一个碎片化组合，覆盖可视化、海关、合规和路径规划——这与 project44
              的一体化平台打法不同；Descartes 可视化产品估计贡献其 $600M+ 收入基础中的 $80-120M 子板块。Blue Yonder、Overhaul 和专业制药平台，则作为行业专用或 TMS
              集成型替代方案补齐竞争版图。
            claimRefs: []
