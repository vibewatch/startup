  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入与增长画像
        blocks:
          - type: paragraph
            body: >-
              基于 CEO Lucas Mansfield 披露的增长率以及 PitchBook、FreightWaves 分析师估计，project44 估计 FY2024 收入为 $210M+，同比增长
              30%+。收入结构以企业托运方 SaaS 订阅费为主（估计占收入 80-85%，ACV 为 $250K-$2M+），另有约 15-20% 来自承运商为高级 API
              接入层支付的承运商连接费。按运输方式拆分，公路货运占 55-65%，海运货运占 20-25%（受 Ocean Insights 收购加速），最后一公里占 10-15%（来自 Convey
              收购）。这种多式联运收入多元化降低了单一运输方式集中风险，也让 project44 成为面向全球企业托运方的、覆盖最广的纯供应链可视化平台。Wall Street Journal 2024
              年报道以独立第三方报道验证了 project44 的增长轨迹，补充了 CEO 层面的披露。收入增长部分来自既有企业账户内“先落地再扩张”的有机扩张，部分来自 Convey（2021）和 Ocean
              Insights（2022）收购，每笔收购估计贡献 $15-25M 增量 ARR。企业合同通常为 2-3
              年，并带年度货量阶梯，形成可预测的经常性收入基础和内嵌扩张机制。大型企业托运方若使用完整的多式联运可视化、异常管理和供应链智能模块，全平台年价值可达 $2M+。30%+ 增速显著高于 Descartes 7%
              有机增长和更广义供应链 SaaS 约 15% 的中位数，验证了 project44 的纯平台增长模式以及从多产品既有厂商手中夺取份额的能力。这一增长溢价是 project44
              相对上市可比公司享有更高收入倍数的主要理由。不过，缺少经审计财务报表意味着 30%+ 增长估计基于公司披露和分析师核验，而非独立审计数字——这是严谨财务承销中的重大限制。
