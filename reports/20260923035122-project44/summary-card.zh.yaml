  topStrengths:
    - 1,300+ 承运商和 175,000+ 运输服务商网络，沉淀出 10 年结构性数据护城河；复制需要 3–5 年和 $300M+。
    - Fortune 500 客户名单包括 3M、ABInBev、Pfizer、Walmart、Unilever，多年期 SaaS 合同证明企业级 PMF 强。
    - ARR 保持 30%+ YoY 增长，规模已达 $210M+；3+ 年没有新融资后仍接近现金流中性。
    - 连续 4 年入选 Gartner Magic Quadrant RTTVP 领导者，验证了持续市场领导力和分析师认可。
    - Supply Chain Intelligence AI 模块支持跨客户 benchmark，形成网络效应 AI 层；单一供应商 ERP 平台难以复制。
    - Goldman Sachs Equity Partners 领投并积极参与董事会，提供机构背书和 IPO 路径支持。
  topRisks:
    - ERP 原生功能商品化：SAP LBN 和 Oracle OTM 预计到 2026–2027 年会覆盖 SAP 标准化企业里 70%+ 的 RTTVP 功能。
    - CEO 交接带来执行风险——Lucas Mansfield 于 2023 年 5 月接替创始人 Jett McCandless，正值增长转盈利的关键拐点。
    - 自 2022 年 2 月 Series F 后已有 3+ 年融资空窗，实际现金、烧钱速度，以及 2025 年是否可能被迫 down round 都不清楚。
    - 客户满意度落后 FourKites：Gartner Peer Insights 为 4.2/5，FourKites 为 4.5/5，Fortune 500 客户续约存在竞争风险。
    - 中国 PIPL 数据本地化合规状态未披露；对有中国供应链敞口的货主，这是重大监管风险。
    - 财务披露不透明——NRR、毛利率、EBITDA 和流失率都未披露，投资承保只能给到中等置信度。
  unresolvedGaps:
    - FY2023 和 FY2024 经审计 NRR——估计为 115–125%，但未确认；这是最关键的 SaaS 质量指标。
    - 分收入流毛利率——估计为 65–75%，但未披露；确认 SaaS 毛利质量离不开它。
    - EBITDA margin 和现金消耗轨迹未披露；它决定 down round 风险严重程度，以及公司离 breakeven 还有多远。
    - 按 ACV 档位划分的客户流失率未披露；验证中端市场留存风险假设需要该数据。
    - Goldman Sachs 基金生命周期时间线和二级市场持仓情况；评估退出时点的流动性压力必须看这些信息。
