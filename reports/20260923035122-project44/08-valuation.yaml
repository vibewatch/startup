  body: 'project44''s 1,300+ carrier network moat, 30%+ growth rate, and Fortune 500 customer base provide a credible foundation
    for a conditional buy recommendation at secondary market prices of $1.8-2.2B. The 19-33% discount to the $2.7B carry appropriately
    prices private market illiquidity and information risk. The bull case of SAP acquisition at $4-6B provides asymmetric
    upside vs. the bear case of a $1.5-2.0B down-round. Critical condition: audited NRR and gross margin must be obtained
    before committing full position.'
