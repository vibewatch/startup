callouts:
- title: ERP-Native Commoditization Is the Highest-Probability Strategic Risk
  body: Gartner's projection that SAP LBN will cover 70%+ of RTTVP functionality within SAP-standardized enterprises by 2026
    is the most credible long-term strategic risk for project44. The countermeasure — project44's AI-powered supply chain
    intelligence and cross-customer benchmarking — creates a capability gap that SAP/Oracle cannot replicate without comparable
    multi-customer data network scale. This risk requires continuous monitoring via Gartner MQ position and SAP feature parity
    tracking.
  calloutType: risk
  claimRefs:
  - CR007
- title: Information Vacuum Risk Requires Active Transparency Investment
  body: The combination of CEO transition, 3+ year financing gap, and absent financial disclosures creates an "information
    vacuum" that makes independent assessment of project44's financial health difficult. Without NRR, gross margin, or profitability
    indicators, investors and customers must rely on third-party analyst estimates. project44 should proactively disclose
    key SaaS metrics (NRR, Rule of 40 score) to reduce investor uncertainty and pre-empt FourKites from exploiting the information
    gap in competitive situations.
  calloutType: recommendation
  claimRefs:
  - CR010
