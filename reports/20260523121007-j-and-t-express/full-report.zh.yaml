  - id: TV001
    title: 投资建议摘要表
    columns:
      - 维度
      - 当前判断
      - 公开证据
      - 决策含义
      - 改变判断的条件
    rows:
      - - 投资建议
        - 买入
        - 当前公开市场价值低于本章基准情景中点，也低于分析师共识。
        - 支持在公开市场建仓。
        - 如果中国盈利或平台集中度比公开证据显示的更差，降至观察。
      - - 置信度
        - 中
        - 股价、市值和 FY2025 财务数据可见，但关键商业驱动仍不透明。
        - 仓位应反映证据缺口。
        - 披露客户集中度和中国单票收入后，置信度会上升。
      - - 风险评级
        - 高
        - 中国定价、平台依赖和创始人控制都会影响估值倍数。
        - 不要把这只股票当作低波动复利资产。
        - 只有中国利润率稳定、平台集中度低于市场担心的水平，风险才会下降。
      - - 估值判断
        - 有吸引力
        - 过去十二个月收入倍数低于 1x，2026 EV/EBITDA 为 7.05x；对一家盈利、区域领先的运营商并不贵。
        - 当前定价给上行留出空间，不需要激进假设。
        - 如果中国价格压力再次加速，或共识预期被大幅下调，估值判断降至合理。
      - - 主要上行驱动
        - 东南亚领先地位 + 非中国占比
        - FY2025 东南亚份额达 34.4%，2026 Q1 非中国包裹占比达 35.1%。
        - 增长质量更高，市场就可能穿越中国噪音继续买单。
        - 需要中国以外包裹密度和利润率持续兑现的证据。
      - - 主要下行驱动
        - 中国单票收入压缩
        - 公开文件已描述竞争激烈，且中国 EBIT 远低于东南亚 EBIT。
        - 新一轮价格战可能抹掉当前大部分估值安全垫。
        - 关注实际单票收入、返利和中国调整后 EBIT。
    notes: 这是一个价格敏感的决策摘要。它把公开证据转化为当前立场，而不是假装自己做了完整的内在价值模型。
