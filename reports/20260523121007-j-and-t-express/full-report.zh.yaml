      - number: '5.4'
        title: 技术护城河来自自动化密度和商家连接，而不是前沿软件
        blocks:
          - type: paragraph
            body: >-
              最站得住的产品技术判断是，J&T 靠运营技术和集成密度取胜。服务页描述了数字物流平台，但监管文件和年报透露的信息更关键：管理层反复强调分拣中心、自动化设备、车队所有权、网点和设备才是业务的基础设施。2026
              年一季度材料也把车队建设和分拣升级明确列为效率投资。这是实打实的技术叙事，只是不是前沿软件叙事。


              商家连接构成第二层。开发者门户向合作伙伴开放下单和轨迹 API，马来西亚 FAQ 展示 VIP 商家工具，新加坡 TikTok 案例说明平台伙伴物流，新加坡零售公告则增加 B2B 运输选项。与此同时，Rest
              of World 称增长主要依赖电商平台，因此护城河应评为中等，而不是主导性。J&T
              看起来有有意义的运营技术和生态集成，但公开材料没有展示自研软件资产、开放开发者心智，或在实体网络和既有平台关系之外异常深的切换成本机制。
