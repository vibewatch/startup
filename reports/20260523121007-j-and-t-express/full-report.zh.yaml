  - id: TV006
    title: 最终尽调问题与投资逻辑失效表
    columns:
      - 主题
      - 缺失证据或触发因素
      - 重要性
      - 行动含义
      - 尽调路径或监测项
    rows:
      - - 头部平台集中度
        - 按主要电商平台或商家拆分的准确收入和包裹组合
        - 这是判断平台折价问题时最明确缺失的输入。
        - 没有这项证据，不要给完整乐观情景定价。
        - 向管理层索取头部客户集中度表和非平台组合。
      - - 中国实际单票收入桥接
        - 按产品层级拆分的包裹价格、返利和成本桥接
        - 中国是股权逻辑的主要下行传导通道。
        - 如果单票收入弱于隐含水平，下调基准情景区间。
        - 在 NDA 下获取逐季中国定价和 EBIT 桥接数据。
      - - 新市场国家经济性
        - 国家层面贡献利润率、回本周期和现金使用数据
        - 乐观情景假设这些地区创造价值，而不是吸收资本。
        - 在国家回报可见前，保留启动曲线折价。
        - 审阅每个新市场地区的国家 P&L 和启动曲线仪表盘。
      - - SF 交叉持股经济性
        - 具体协同目标、回报门槛和治理条款
        - 战略验证是正面信号，但缺少硬经济性时，估值加分应封顶。
        - 在经济性明确前，把这笔交易视作支撑，而非充分重估证据。
        - 阅读最终交易文件和后续实施 KPI。
      - - 投资逻辑失效触发因素：中国盈利
        - 中国调整后 EBIT 再次显著下滑，或单票收入恶化
        - 这会说明最大收入池仍无法在竞争中赚到钱。
        - 将股票从有吸引力下调，并削减估值区间。
        - 跟踪年度、中期和季度 EBIT 评论，以及单票收入披露。
      - - 投资逻辑失效触发因素：合作伙伴或监管冲击
        - 新的大型平台自建物流事件，或正式监管升级
        - 会同时削弱需求可见性和投资者愿意支付的倍数。
        - 立即下调建议。
        - 监测平台新闻流、合作伙伴变化，以及美国或当地监管动作。
    notes: 前四行是尽调问题，最后两行是明确的击穿触发因素。合在一起，它们界定哪些因素会提升买入逻辑，哪些因素会推翻它。
    claimRefs:
      - CV019
      - CV030
      - CV031
      - CV033
      - CV051
      - CV052
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: 2015 年至 2026 Q1 的关键创立、扩张、收购、上市和负面里程碑。
    data:
      items:
