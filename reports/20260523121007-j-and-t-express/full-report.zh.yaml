      - number: '6.3'
        title: 耐久性可从工作流嵌入和支持入口看见，但公开服务质量信号混杂
        blocks:
          - type: paragraph
            body: >
              J&T 展示了几个耐久性代理指标。马来西亚商家页面和 FAQ 描述了重复使用的卖家工作流，包括集中管理、支付支持、批量下单、发票查询、EWB、揽收和更便宜的 VIP 定价。开发者文档增加了从协议到测试 API
              再到生产的结构化接入流程；OnePacific 页面则说明，一旦商家把 COD 结算、追踪、运费数据和履约对账接入 ERP 流程，就未必愿意随意更换承运商。虽然没有披露正式留存指标，这些仍是可信的粘性信号。


              问题在于，留存只能靠嘈杂代理来判断，而不是硬性的队列数据。Trustpilot 存档的 jtexpress.ph 页面有 134 条评价，评分为
              1.2/5，投诉集中在延误、派送失败说法、错误地点和沟通差。ComplaintsBoard 又提供了更多操纵派送状态和未上门行为的例子。马来西亚和新加坡的官方投诉及联系页面说明 J&T
              确实有问题解决基础设施，但不能证明解决速度快或满意度强。最终是混合的耐久性图景：商家工作流嵌入可能真实存在，但收件人痛点仍会侵蚀平台和卖家信任。
