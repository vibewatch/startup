          note: 快递基础设施、网点、分拣机和车队运力
        - id: lastmile
          label: 本地末端配送与 COD / 退货处理
          note: 上门配送、妥投失败管理和逆向物流
        - id: consumer
          label: 终端消费者与反馈闭环
          note: 配送体验影响评分、复购和平台分单
        - id: insource
          label: 平台自建物流分流
          note: 大型平台把日常包裹流内化时形成的流失路径
