      - number: '8.5'
        title: 最终尽调问题和投资逻辑破坏点
        blocks:
          - type: paragraph
            body: >-
              本章可以给出建设性建议，因为公开记录已经足够丰富，能框定一个可支撑区间；但它不能把剩余证据缺口压缩成确定性。最大阻碍仍是商业透明度。投资者需要知道，收入和包裹量到底有多少来自最大平台，中国实际单票收益率和返利按产品层级长什么样，以及
              New Markets 是否在国家层面产生足以证明继续投钱合理的回报。SF
              交易也需要后续验证：公开公告的战略语言很强，但显性协同或回报测算很弱。最后，治理折价今天已经可见，却还没有被完整映射到未来，因为未来发行或库存股使用可能改变控制权动态。


              如果少数仍有效的公开指标开始转头，投资逻辑应迅速破裂。中国盈利能力再次明显下滑、新的平台内化事件、正式监管升级，或 New Markets
              盈利能力逆转，都会把股票移出当前「偏有吸引力」区间。因此，本章的买入判断在方向上明确，但气质上有条件：上行真实存在，但仍取决于管理层证明今天的公开市场折价过度，而不是应得。
