      - number: '8.2'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              正向逻辑从一组公开投资者通常想要、但最近上市物流公司未必能给出的事实开始。J&T 已经越过单纯规模剧场：FY2025 收入达到 US$12.158 billion，利润达到 US$225.3
              million，调整后净利润达到 US$425.4 million，调整后 EBITDA 达到 US$1.049 billion。东南亚仍是质量引擎，市场份额 34.4%，调整后 EBIT 为 US$537.5
              million，而中国仅为 US$93.9 million。2026 年一季度又显示，年末之后故事没有停滞：总包裹量升至 8.33 billion，非中国包裹量达到组合的 35.1%。SF
              交叉持股提供了另一个支撑点，因为一家亚洲大型物流运营商愿意以规模买入 J&T 的网络。


              反向逻辑同样具体。公开来源没有描述一家受客户锁定保护、能够收取溢价的运营商；它们描述的是一家仍高度依赖平台流量、仍在价格可被武器化的市场竞争的快递公司。Rest of World
              引述管理层称增长主要依赖电商平台，并报道 Shopee 移走了多数印尼日常订单。ION 描述低于本地水平的定价是该地区市场进入工具。与此同时，J&T
              自身文件称中国竞争仍然激烈，治理记录也仍指向创始人投票权集中。这就是为什么正确判断是价格敏感型买入，而不是毫无借口的质量倍数。
