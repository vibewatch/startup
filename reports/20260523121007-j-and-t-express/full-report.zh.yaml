      - number: '8.3'
        title: 可比公司语境，以及为什么自身历史仍重要
        blocks:
          - type: paragraph
            body: >-
              可比公司集合可用，但前提是诚实标注。SF 是质量和广度上最接近的上市物流参考；当前材料显示，它是规模大得多、已盈利的综合运营商，市值 CNY173.06 billion，TTM 收入 CNY312.52
              billion，前瞻 P/E 为 14.20x。Sea 和 Alibaba 只能作为相邻参考，因为两者在销售额和 EV/EBITDA 筛选上都高得多，同时也嵌入 J&T 不拥有的非物流业务。Stock
              Analysis 的 J&T 页面还显示，香港围绕公司有真实的物流股票群体，包括 JD Logistics 和 Sinotrans；这一点重要，因为它把估值讨论放在上市行业框架里，而不是风投框架里。


              自身历史仍重要，因为 J&T 自己的压缩路径就是投资逻辑的一部分。Reuters 和 BusinessToday 把 2023 年 IPO 估值放在约 US$13 billion，Reuters 关联报道也把
              2021 年融资轮与约 US$20 billion 估值相连。今天约 US$9.8 billion 的公开市场价值明显低于两者，尽管 FY2025 基本面远好于上市前。SF 认购价 HK$10.10
              进一步说明，公司没有被市场当作已经坏掉，但这仍不是纯粹市场出清价格，因为交易来自一笔协商战略交易，带有明确产业逻辑，并相对现货收盘价有折价。
