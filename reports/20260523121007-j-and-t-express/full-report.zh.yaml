      - number: '7.3'
        title: 劳资关系、服务质量和运营可靠性
        blocks:
          - type: paragraph
            body: >-
              运营风险图景是混合的：J&T 有可见投诉渠道，甚至为关键投诉设定了一小时回访流程，但公开反向入口显示，这些控制并不能消除配送摩擦或劳资冲突。在菲律宾，CTUHR 和 The Manila Times
              报道了与被指不公平劳动实践和集体谈判争议有关的罢工或罢工威胁。这些不是经裁判确认的结论，来源也是劳工倡议组织和新闻报道，而不是法院判决。即便如此，它们太具体，不能忽略，因为事件涉及具名工会、DOLE 或 NCMB
              调解，以及围绕劳动密集型网络中断的主张。


              公平的平衡点是，后续报道也支持降温判断。Pinoy Aksyon 描述了随后获批准的
              CBA、薪酬和福利改善，以及管理层对和解的确认。这说明风险不是「永久性劳工崩盘」，而是骑手、分拣工、司机和网点员工都对运营至关重要的业务里，劳资关系会反复波动。服务质量证据也应同样谨慎处理。Trustpilot
              和 ComplaintsBoard 是自选择投诉入口，不是经审计的 SLA，但两者都指向反复出现的收件人痛点：配送延误、派送失败、包裹丢失、COD
              争议和支持响应弱。对投资者来说，信息是：即便公司已经盈利，执行风险仍面向客户、也对劳工敏感。
