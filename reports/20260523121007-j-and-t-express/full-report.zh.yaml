            body: >
              J&T 公司概况里最强的证据，如今是运营规模，而不只是增长叙事。官方 FY2025 业绩披露收入 US$12.16 billion、全年利润 US$225.3 million、调整后净利润 US$425.4
              million，2024 年已经盈利。运营上，公司 2025 年包裹量跨过 30.1 billion 件，其中东南亚 7.6588 billion 件、中国 22.066 billion 件、新市场 403.9
