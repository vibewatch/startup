      - number: '3.3'
        title: 即便 J&T 领先东南亚件量，中国既有玩家和高端服务标杆仍然重要
        blocks:
          - type: paragraph
            body: >-
              如果只看东南亚，J&T 的竞争地图就不完整。集团 2025 年在中国仍运输 22.066 billion 件包裹，因此其经营现实很大一部分仍受中国快递市场塑造。SF 是高端标杆。SF
              官方概览称，其是中国和亚洲最大的综合物流服务商、全球第四大，服务超过 2.35 million 企业客户和 800 million 个人消费者，覆盖 95 个国家，并提供 200 国小包覆盖。J&T 自己的
              2024 年报实际上承认了 SF 的标杆地位，称公司希望海外服务标准达到中国 SF Express 的水平。这一点有用，因为它显示管理层把高端服务和信任也视为竞争门槛，而不仅是低成本包裹吞吐量。


              YTO 代表另一类威胁：广泛国内密度和相邻服务宽度。其官网称，网络拥有超过 5,000 家分公司和 90,000
              个服务网点，覆盖全国县级城市，并包括仓储、供应链、COD、预约配送及相关增值服务。因此，即便已审阅来源包没有像 SF 那样暴露同等国际细节，YTO 仍是有规模的国内既有玩家。SF 和 YTO 合在一起说明，J&T
              的中国位置不应被看作东南亚故事的简单延伸。J&T 在中国有实质份额，但仍在与高端服务信任更强、国内网点密度更广，或二者兼具的玩家竞争。
