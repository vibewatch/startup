      - number: '6.2'
        title: 具名客户证据真实存在，但 TikTok 与其他平台的可信度差异很大
        blocks:
          - type: paragraph
            body: >
              本次最清晰的具名客户证据是 TikTok Shop。J&T 新加坡案例页称 J&T 是 TikTok Shop 的官方物流伙伴，并包含卖家评价式表述，提到配送获得客户正面反馈。菲律宾证据也很具体：Manila
              Times 和 MegaBites 都描述了与 TikTok Shop
              的合作、全国运费券、基于应用的追踪，以及围绕快速配送的联合品牌活动。这些页面合在一起，足以支撑真实平台关系，即便它们仍未披露包裹份额、商业条款或续约历史。


              TikTok 之外，证据基础就变软。J&T 在沙特阿拉伯的 LEAP 新闻稿点名 Salla、Temu、Noon、SHEIN 和 TikTok 为合作或伙伴对象，Rest of World 也独立把 J&T
              放进推动 Shein、TikTok、Temu 和 Shopee 在东南亚履约的中国电商浪潮之中。这些引用很重要，但分量不一样：Salla 通过明确协议描述，其他多数只是生态提及。马来西亚的商家侧工具、API
              文档和 OnePacific NetSuite 集成页增强了真实商家通过 J&T 重复跑工作流的判断，但仍没有给出一张按支出披露的清晰客户名单。
