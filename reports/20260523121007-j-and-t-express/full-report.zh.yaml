  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: standard
    summary: 公开盈利能力、东南亚领导地位和战略验证支撑建设性判断；但中国定价、平台依赖和创始人控制让这只股票还不该享受完整溢价倍数。
    approximationNotes: 这是分析决策流，不是概率树，也不是机械估值模型。
    data:
      nodes:
        - id: earnings
          label: FY2025 盈利验证
          detail: 已盈利，调整后 EBITDA 超过 US$1B
          tone: positive
        - id: sea
          label: 东南亚领导地位
          detail: 34.4% 份额，利润池最强
          tone: positive
        - id: sf
          label: 战略验证
          detail: SF 交叉持股支撑产业契合度
          tone: neutral
        - id: china
          label: 中国定价风险
          detail: 最大收入池仍是关键压缩通道
          tone: adverse
        - id: platforms
          label: 平台依赖
          detail: 大型平台可以重新分配包裹量或压价
          tone: adverse
        - id: control
          label: 创始人控制
          detail: 加权投票权支持一定治理折价
          tone: warning
        - id: call
          label: 当前建议
          detail: 买入，中等信心，观点为有吸引力
          tone: neutral
      edges:
        - from: earnings
          to: call
