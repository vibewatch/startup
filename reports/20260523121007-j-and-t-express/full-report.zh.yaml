  - id: TV005
    title: 估值语境表
    columns:
      - 信号
      - 当前值或参照
      - 重要性
      - 主要注意点
    rows:
      - - 当前公开市场价值
        - ~US$9.8B / HK$76.64B 市值
        - 设定投资者今天真正的入场点。
        - 物流板块情绪和中国竞争新闻都可能让市值快速波动。
      - - 最新收盘价
        - 2026-05-22 收于 HK$8.64
        - 确认上行测算背后的当前交易参照。
        - 单日收盘价无法覆盖完整波动区间。
      - - 分析师共识
        - US$1.682 平均目标价；较上一收盘价 +52.54%
        - 显示卖方仍认为当前水平有实质上行空间。
        - 共识基于估算，不是公司指引，也不保证回报。
      - - 远期筛选
        - 0.65x 市值 / 收入；0.62x EV / 收入；7.05x EV/EBITDA；18.9x P/E
        - 按公开市场启发式指标看，J&T 估值不高。
        - 所有远期数字都取决于分析师模型和会变化的假设。
      - - 战略认购价格
        - SF 交易中 HK$10.10
        - 表明产业交易对手愿意以高于最新收盘价的价格认购 J&T。
        - 谈判形成的战略认购价不等于公开市场出清价。
      - - 控制结构
        - 创始人家族以 10.92% 经济权益掌握 55.07% 投票权
        - 支持在估值判断中保留治理折价。
        - 投票权快照来自 2025 年中，未来发行可能改变。
    notes: 该表混合市场价格、分析师估算、谈判达成的战略条款和治理事实，因为这些都会影响公开市场投资者愿意支付的价格。
