  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 真正战场是中立包裹网络对阵平台自有物流
        blocks:
          - type: paragraph
            body: >-
              J&T 并不处在一个干净单一的同业集合里。一类对手是仍要逐线路争夺件量的中立第三方包裹承运商：Ninja Van、Flash Express、Lalamove，以及 SF、YTO
              等中国既有玩家。另一类是平台自有或嵌入平台的物流系统，优势不只在配送执行，还在于控制订单流、补贴、商家工具、默认承运商选择和交易平台可见度。第二类对定价权更关键。J&T 自己的年报称，公司与
              Shopee、Lazada、Pinduoduo、Taobao、Tmall、SHEIN、Mercado Libre、Temu 等领先平台合作；Rest of World
              另行引用管理层称，增长主要依赖电商平台。这个组合既是优势，也是脆弱点。


              证据包指向 Shopee Xpress 和 Lazada 自有物流生态，认为它们是把握最高的威胁，因为它们可以先移走日常订单量，而不必先在开放市场商家获客上击败 J&T。Rest of World
              报道称，Shopee 自有快递 SPX 在 2025 年 4 月放弃 J&T 承接印尼多数日常订单；ION 则把 SPX、LEX、Tokopedia/Gojek 和 TikiNOW
              描述为挤压第三方运营商的自有末端能力案例。因此，本章将直接东南亚同业与平台自有物流分开处理。J&T 仍能凭规模跑赢许多中立承运商，但平台一旦手握自有需求，就能把需求导入内部，从而改写竞争规则。
