      - - Shopee Xpress / SPX
        - 平台自有物流
        - 所审阅来源未披露公开包裹量；到 2025 年，其能力足以把印尼大多数日常订单收进自有体系
        - Shopee 商家和买家
        - 封闭订单流、平台默认选项、补贴控制、卖家工具锁定
        - 所审阅材料中，规模和经济性不透明；Shopee 生态之外的触达结构性更窄
      - - Lazada / LEX / Alibaba ecosystem（平台物流生态）
        - 平台自有物流
        - 所审阅来源确认 Alibaba 支持及自有物流角色，但未给出包裹量
        - Lazada 商家和买家
        - 平台自有分发、卖家流量杠杆、生态资金能力
        - 所审阅来源未找到开放市场价卡和服务指标
      - - Ninja Van
        - 区域第三方包裹同行
        - 新加坡官网显示支持包裹、跨境、取件 / 投递、RTS；Cloud 称覆盖菲律宾 75 个省和 800+ 个网点
        - 中小企业、电商平台卖家、包裹寄件方
        - 追踪、海关支持、技术导向定位、区域布局
        - 披露规模小于 J&T；没有封闭平台需求
      - - Flash Express
        - 区域第三方挑战者
        - 泰国官网强调免费揽收、COD、每日结算；Cloud 称覆盖菲律宾 68 个省和 600+ 个服务中心
        - 价格敏感卖家、COD 占比高的商家
        - 激进商家经济性、COD 工作流、低成本姿态
        - 所审阅来源中，跨境和服务质量细节不如 J&T 或 Ninja 充分验证
      - - Lalamove
        - 邻近当日达替代方案
        - 官方定位为当日快递，加厢式货车和卡车租用
        - 中小企业、按需城市寄件方、当日派送需求
        - 城内和本地大件任务速度快；紧急线路上的商家价值高
        - 在所审阅证据中，并不是完全同类的全国包裹网络替代品
      - - SF Express
        - 中国高端在位者
        - 2.35M 企业客户；800M+ 消费者；服务覆盖 95 个国家；小包业务覆盖 200 个国家
        - 高端企业和零售客户、国内及跨境线路
        - 高端品牌、宽服务栈、强信任和服务口碑
        - 高服务定位难以复制；J&T 尚未被定义为高端标杆
      - - YTO
        - 中国规模型在位者
        - 5,000+ 个分支机构、90,000+ 个服务网点，覆盖全国县级城市
        - 中国国内包裹、仓储和企业用户
        - 国内密度叠加仓储、供应链和增值服务
        - 所审阅材料披露的国际化和高端品牌细节少于 SF
    notes: 平台自有行更依赖分发权，而不是披露包裹总量，因为所审阅来源包未找到 SPX 或 LEX 的官方包裹量。 Cloud Ecommerce 和 EasyParcel 数字是国家或工作流层面的例子，不是通用公司 KPI。
