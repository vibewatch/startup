  productSummary: >
    J&T 销售的是由数字物流工具支撑的快递和跨境物流服务，而不是单一快递 App。公开界面展示了消费者寄件与查询、商家 / VIP 工作流、用于订单和轨迹集成的合作伙伴 API、围绕 COD
    的商家流程，以及由网点、分拣中心、机器和干线资产组成的高度自动化实体网络。
  customerFocus: |
    东南亚、中国以及较新的中东 / 拉美走廊中的平台生态、SME 卖家、大型商家和品牌、跨境商家以及末端收件人。
  businessModel: |
