  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开市场切入点和建议
        blocks:
          - type: paragraph
            body: >-
              应把 J&T 当作上市快递运营商来承销，而不是当作旧有风险投资估值的代理。当前市场参考足够集中，支持这一框架：Stock Analysis 显示，2026 年 5 月 22 日公司市值为 HK$76.64
              billion、企业价值为 HK$79.47 billion；CompaniesMarketCap 将市值折算为约 US$9.82 billion；Financial Times 显示同日收盘价为
              HK$8.64。对应 FY2025 收入 US$12.158 billion 和调整后 EBITDA US$1.049 billion，在未调整净债务前，以股权价值口径计算约为 0.81x 过去收入、约 9.4x
              历史 EBITDA。MarketScreener 的 2026 年筛选用前瞻口径得出同样结论：约 0.65x 市值 / 收入、0.62x EV / 收入、7.05x EV / EBITDA 和 18.9x 前瞻
              P/E。这些不是创业公司光环倍数，而是公开市场物流倍数，既有上行空间，也有失望空间。


              建议是买入，但只能作为高风险公开市场切入点，而不是干净的复利质量判断。股价已经较 2021 年私募参考和 2023 年 IPO 语境大幅压缩，同时 FY2025
              基本面明显改善，分析师筛选仍显示有意义的上行。这一组合足以支持「偏有吸引力」的估值立场，而不是合理或偏高。但还不足以给出强信念上调，因为公开记录仍留下真实不确定性：中国产品单票收益率、头部平台集中度，以及少数股东在双重股权结构下应承担多少治理折价。
