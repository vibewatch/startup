      - number: '5.3'
        title: 部署和支持确实存在，但各国入口很碎片化
        blocks:
          - type: paragraph
            body: >-
              J&T 的公开部署证据，强在服务承诺，弱在一致性。官方服务页承诺 7x24/365 运营，并通过热线、网站、应用和社交渠道提供 24 小时客服。马来西亚 FAQ
              增加了热线和在线聊天支持，印尼应用商店页面强调下单、追踪、查价和附近寄件点发现，VIP
              应用页面则展示更高级的商家工作流，包括扫码、多包裹发货、打印和预约揽收。这些都比静态宣传网站更可信，说明产品已经面向多类用户部署。


              需要警惕的是碎片化。本章材料包含多个国家域名、多个移动应用版本，以及参差不齐的支持入口。印尼帮助中心 URL 抓取结果为 Page Not Found，新加坡电商解决方案 URL 返回类似 404 的页面，菲律宾
              FAQ 在本次运行中虽多次尝试浏览器档案，仍没有得到可读正文。这些并不能证明核心运营坏掉，但说明 J&T
              的数字产品入口由本地管理，维护不一致。做承销判断时，这一点重要：公司可能运营着很强的实体网络，却仍在各国交付参差不齐的自助 UX、文档质量和支持可发现性。
