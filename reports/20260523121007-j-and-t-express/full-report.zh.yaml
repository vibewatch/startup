chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、阶段与网络版图
        blocks:
          - type: paragraph
            body: >
              J&T Express 将自己呈现为围绕快递服务和跨境物流搭建的全球物流运营商，而不是狭窄的本土快递公司。官方介绍和服务材料称公司创立于 2015 年，投资者关系材料把成立时间收窄到 2015 年 8 月；截至
              2024-12-31，网络覆盖 13 个国家。该日期披露的官方版图已经很大：238 个转运中心、19,100 个网点、超过 400,000 名服务人员和 7,200 个网络合作伙伴。上市母公司为 J&T
              Global Express Limited，这是一家香港上市的开曼公司，2023 年 10 月 27 日起以 1519.HK 交易。官方页面还把服务定义为 7x24、365
              天配送，加上跨境和数字物流工具。一个尽调保留点是：官方材料强调服务人员和合作伙伴数量，而非干净的常规员工数，第三方劳动力估计因此很难直接比较。
