      - number: '4.3'
        title: 成本结构与利润率推进
        blocks:
          - type: paragraph
            body: >-
              财务逻辑最强的一段已不再是单纯收入增长，而是利润率路径。官方 FY2024 和 FY2025 披露显示，IFRS 毛利润从 US$1.08 billion 升至 US$1.46 billion，调整后
              EBITDA 从 US$778 million 增至 US$1.05 billion。利润率趋势谈不上高端而干净，但方向正确。关键在东南亚。J&T 明确称，东南亚单票成本从 2024 年 US$0.57 降至
              2025 年 US$0.48；推导的分部测算显示，东南亚只贡献约 37% 收入，却贡献约三分之二调整后 EBIT。这是最清晰的公开信号：公司网络内部某处已有真实的规模-成本引擎。


              弱点也看得见。管理层称，H1 2025 中国在激烈价格竞争中保持韧性，这是一种委婉说法：规模并没有在那里创造强价格保护伞。中国仍是最大收入池，但调整后 EBIT 利润率远低于东南亚。新市场明显改善，并在 H1
              2025 实现正 EBITDA，但 H1 EBIT 仍为负，FY2025 EBIT 也只是勉强转正，固定成本吸收仍不完整。换句话说，J&T 现在有可信的利润率改善故事，但首先是降本故事，其次才是定价权故事。
