      - number: '1.3'
        title: 融资历史、上市与所有权集中
        blocks:
          - type: paragraph
            body: >
              在已审阅来源中，J&T 的资本故事有三个可见阶段：快速私募融资、规模缩小但完成的香港 IPO，以及之后的公开市场重定价。独立融资报道称，J&T 2021 年从包括 Boyu、Hillhouse、Sequoia
              China/HongShan、Tencent 和 SIG 在内的投资方募资约 US$2.5 billion，估值约 US$20 billion；招股书则确认，IPO 前投资者名单还包括 GLP、SF
              Express、ATM、D1、CMBI 等。2023 年香港 IPO 定价为每股 HK$12；SCMP 报道称，该交易对应发行后市值约 HK$105.75 billion 或 US$13.5
              billion，并在后续报道中称本地和离岸配售部分均有温和超额认购。到 2026 年 5 月，CompaniesMarketCap 显示公开市值降至 US$9.82 billion，低于 IPO 期间口径，也低于
              2025 年末 US$12.13 billion。所有权和投票权仍然集中：ETNet 显示，由于双重股权结构，Li Jie Jet & Family 保留的投票权比例远高于经济权益。
