      - number: '7.2'
        title: 监管、法律和数据治理风险
        blocks:
          - type: paragraph
            body: >-
              描述 J&T 的监管和治理暴露，最干净的方式是把已记录事实与指控分开。已记录的一侧，集团公开网站的法律栈扎根于一家中国运营主体，网站争议适用中国法律，隐私政策称网站收集 IP 地址、位置、页面历史、cookie
              关联行为等技术和使用数据。同一政策写明，数据可能与关联方共享，并在法律要求下向行政或司法机关披露。这不能证明任何滥用，但确立了一个事实：J&T
              运营的是带集中治理语言的跨境数字入口，而不是清晰本地化、逐市场的数据架构。


              外部政策环境已经变硬。DOJ 称其 Data Security Program（数据安全计划）自 2025 年 4 月 8
              日起生效，并限制某些可能让关注国家或受覆盖人员访问美国人大规模敏感个人数据的交易。Cotton 参议员 2026 年 5 月信函明确点名 J&T，是他希望 DOJ
              审查的外国承运商之一。投资者应把这封信视为调查请求，而不是不当行为证据，但它仍然重要，因为在任何正式案件出现前，政策审查就能抬高尽调、合作和扩张摩擦。承销含义是治理阴影，而不是已证实的合规违规。
