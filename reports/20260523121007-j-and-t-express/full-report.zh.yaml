        title: 架构是实体网络编排加受控商家集成
        blocks:
          - type: paragraph
            body: >-
              抓取材料没有给出内部软件系统图，但已经足够看清 J&T 的运营架构。关于页面称，J&T 在 13 个国家靠智能基础设施和数字物流网络搭起业务；监管文件则量化了实体控制面：截至 2024 年底，公司拥有 238
              个大型分拣中心、19,100 个网点，到 2026 年一季度增至 255 个分拣中心、19,500 个网点和 422 台自动化分拣设备。同一批一季度材料显示，东南亚干线车辆有 6,200 辆，其中 3,200
              辆为自有；2025 年年报称，年末干线车队超过 13,300 辆，自有车辆超过 8,500 辆。这是本章最强的公开架构信号。


              数字层更窄，但仍有意义。J&T 的开发者门户开放下单、轨迹查询、运费查询和取消订单功能，文档写明集成流程从合作协议开始，进入测试 API、字段映射，之后才投产使用。Rest of World
              对区域负责人管理本地运营、网络伙伴和直营网点的描述，也强化了混合架构这一判断：软件和 API
              轨道负责协调需求入口，但真正的系统优势来自这些轨道如何接入设施、自动化、车队和各地运营实体。如果存在护城河，也在运营控制和密度，而不是面向公众的软件原创性。
