  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 投资逻辑
      - 反向逻辑
      - 改变判断的条件
    rows:
      - - 盈利证明
        - FY2025 已证明真实盈利，调整后 EBITDA 超过 US$1 billion。
        - 如果价格竞争回潮，物流利润可能快速逆转。
        - 需要证明中国单票收入能撑住，集团现金生成能扛过又一轮定价周期。
      - - 地域质量
        - 东南亚已有领先份额，也已成为可见利润引擎。
        - 中国仍是最大收入池，也是主要压缩通道。
        - 披露国家层面利润桥接，让投资者更清楚看见组合质量。
      - - 战略验证
        - SF 交叉持股投资释放出产业契合度和网络价值信号。
        - 战略交易靠谈判定价，不等于干净的现货市场价格发现。
        - 发布 SF 关系的协同目标、完成里程碑和回报门槛。
      - - 平台敞口
        - 规模和服务宽度让 J&T 对头部市场平台和商家仍有价值。
        - 同样的依赖也让平台在激励变化时可以改派件量或压价。
        - 证明非平台收入和包裹占比显著高于市场担忧。
      - - 公司治理
        - 双重股权控制可支持长周期网络建设。
        - 少数股东仍必须把创始人控制作为折价因素纳入定价。
        - 说明未来发行或治理变化会进一步稀释控制权，还是强化控制权。
      - - 公开市场入场点
        - 当前估值已计入相对私募轮和 IPO 时期估值的大幅压缩。
        - 如果业务组合恶化，仅有历史估值压缩并不能保证上行。
        - 只有公开经营证据持续改善且倍数仍温和时，才进一步转向建设性。
    notes: 这里的拆分很明确：公司质量投资逻辑可以成立，但反向逻辑仍会限制公开市场投资者愿意支付的溢价。
