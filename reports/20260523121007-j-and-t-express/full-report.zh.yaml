      - number: '3.5'
        title: 护城河结论：规模和基础设施真实存在，但定价权并不深
        blocks:
          - type: paragraph
            body: >-
              支持 J&T 的最强证据是规模加运营宽度。官方 2025 年材料显示 30.1 billion 件包裹、东南亚 34.4% 份额、中国 22.066 billion 件包裹和 13 国网络；Q1 2026
              披露则显示网点、分拣中心和自动化深度继续提升。Rest of World 还补充，J&T
              的本地赞助人模式和建设基础设施的意愿，使其区别于无法快速吸收亏损或为实体扩张投入资金的对手。这些优势并不轻。它们支持一个判断：J&T 是区域内少数具备密度和组织肌肉、能够顶住多国竞争的中立第三方承运商之一。


              护城河较弱的一段在价格和需求控制。平台自有物流系统可以把订单转回内部，直接同业可以在特定线路上低价切入，SF 在中国和近跨境服务预期中仍占据更高端的信任位置。J&T
              自己认为，第三方承运商会继续胜出，因为它们聚合所有平台以及电商之外渠道的包裹；这个论点有合理性。但已审阅证据没有显示，公司对最关键定价杠杆有持久控制。因此，能支撑的结论是中等，而非主导：J&T
              确有网络和自动化优势，但仍暴露于交易平台去中介化、价格战纪律和高端品牌竞争。
