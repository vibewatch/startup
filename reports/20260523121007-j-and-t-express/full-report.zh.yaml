        - 具战略意义，因为平台既能供给包裹量，也能移走包裹量
      - - 更宽泛的物流和 3PL 类别
        - 只有在拉动包裹需求或跨境订单履约时才纳入视野
        - 海运、空运、合同仓储、包裹逻辑之外的卡车运输
