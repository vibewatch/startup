      - number: '7.5'
        title: 财务模型和资本强度风险
        blocks:
          - type: paragraph
            body: >-
              J&T 不再像经典烧钱故事，但上市公司的风险模型仍然资本密集。监管文件显示，2025 年和 2025
              年上半年经营现金流都超过资本开支（capex），这是该风险排在价格战和平台依赖之后、而不是之前的主要原因。即便如此，同一批文件也说明容错空间并非无限：公司持续增加自动化和车队能力，到 2025 年底运营超过
              13,300 辆干线车辆，并在 2026 年继续扩充车辆、分拣线、网点和分拣中心。包裹密度保持高位时，这些投入会支撑业务；如果收益率下滑或新市场爬坡假设落空，它们也会变成拖累。


              中国仍是关键财务传导通道。管理层称 2025 年上半年竞争激烈，单票收入下降；年度材料显示，中国调整后 EBIT 从 2024 年的 US$147.2 million 降至 2025 年的 US$93.9
              million，尽管包裹量仍在增长。New Markets 明显改善，并在 2025 年上半年实现正 EBITDA，后续报道称 FY2025 调整后 EBIT
              转正，但这还没有消除启动曲线风险。正确的投资解读是，J&T 现在有足够现金生成继续建设，但股权故事仍取决于维持成本纪律，并让规模投资领先于变现——但不能领先太多。
