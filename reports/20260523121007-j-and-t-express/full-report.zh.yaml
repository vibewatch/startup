coverageNotes: >
  本报告覆盖在香港上市的公开公司 J&T Express（HKEX: 1519），依据公开监管文件、投资者关系材料，以及截至 FY2025 年度业绩和 Q1 2026 经营更新可取得的市场数据。最新明确财务覆盖到
  FY2025，最新经营新鲜度核验覆盖 Q1 2026 的包裹、网点、分拣中心和自动化指标。保留章节证据确认公司 2015 年创立于印尼，投资者关系（IR）文案将成立时间收窄到 2015 年 8
  月，但没有给出一个干净统一的总部标签：上市母公司是香港上市的开曼发行人，全球站隐私技术栈则识别出一家上海运营主体。官方来源披露的是服务人员和合作伙伴，而非常规员工口径，因此员工规模比较仍只能近似。
