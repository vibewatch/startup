          - type: callout
            title: Shopee Xpress 和 Lazada 物流比任何单一直接第三方同业都更难应对
            body: Ninja Van 或 Flash 这样的承运商仍必须争取需求。平台自有物流可以从交易平台内已经锁定的需求出发，再围绕快递选择、补贴设计和卖家可见度优化。
            calloutType: risk
            claimRefs:
              - CP007
              - CP008
              - CP010
              - CP021
              - CP023
              - CP046
          - type: callout
            title: 规模不会自动转化为定价权
            body: ION 和 Rest of World 从不同角度呈现了同一种失效模式：区域承运商可能增长很快，却仍面对低于本地的定价、平台压力和利润率压缩。J&T 可以在包裹上领先，却仍缺少深度可防守的价格伞。
            calloutType: risk
            claimRefs:
              - CP006
              - CP009
              - CP039
              - CP040
              - CP046
              - CP047
          - type: callout
            title: 定价样本是单一市场证据，不是通用资费
            body: Malaysia EasyParcel 和 Philippines 比较博客的数字可作为方向性证据，但不能替代官方合同价卡或按线路实现的商家定价。本章把它们当作背景，而不是全球标准化价格真相。
            calloutType: assumption
            claimRefs:
              - CP029
              - CP034
              - CP037
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与区域组合
        blocks:
          - type: paragraph
            body: >-
              J&T 应被当作披露已经相当充分的上市快递运营商来分析，而不是隐藏变现方式的初创公司。官方服务和投资者关系 界面显示出一个直接模型：包裹处理收入是核心产品，跨境物流和数字物流工具围绕其附着。FY2025
              确认该模型仍高度集中。集团收入达到 US$12.16 billion，仅快递服务就贡献 US$11.81 billion，约为报告收入的 97%。跨境收入只有 US$76.1
              million，这让已披露业务压倒性地绑定在国内和区域包裹密度上，而不是更高利润率的跨境变现叙事。


              收入组合在地域上也明显偏斜，而这种偏斜有分析价值。中国仍是最大收入池，FY2025 收入 US$6.71 billion，约占 55%；东南亚贡献 US$4.50 billion，约占
              37%。新市场仍相对较小，为 US$870 million。这个组合重要，因为 J&T
              的收入质量不取决于抽象多元化，而取决于东南亚能否继续复合件量和利润率，同时中国保持足够规模、又不摧毁经济性。最能支撑的解读是：J&T
              如今已有真实的公开收入可见度，但披露的收入流仍由低货币化率的快递主导，而不是更丰厚的附加产品。
