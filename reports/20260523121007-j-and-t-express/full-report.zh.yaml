  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入口径
        blocks:
          - type: paragraph
            body: >-
              不能把 J&T
              放进整条全球物流价值链来分析。公司自己的服务页面、招股书和年报披露强调快递、跨境物流和与电商相连的包裹流转。因此，纳入的支出应是东南亚和中国的国内快递包裹、与平台和商家订单流相连的最后一公里和揽收服务，以及跨境电商交接中相互绑定的清关、干线、分拣和末端履约。同一批来源并不支持把本章扩展到海运、合同仓储、重型
              B2B 货代或全部第三方物流支出。


              件量结构进一步强化这个较窄边界。FY2025 披露显示，东南亚包裹 7.6588 billion 件、中国包裹 22.066 billion 件、新市场只有 403.9 million 件，因此超过 98%
              的包裹量仍在东南亚加中国核心区。这就是为什么最有用的市场镜头是包裹网络：密度、单票成本和平台关系才是关键，而不是自上而下的全球物流支出数字。跨境电商应纳入边界，因为 J&T 明确把自己定位为
              Shein、Temu、TikTok、Shopee、AliExpress 等平台在新市场的物流伙伴，且这些流量进入的是同一套配送和分拣网络逻辑。被排除的板块仍是有用邻近业务，但不是 J&T 目前正在证明的市场。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM016
              - CM045
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM023
              - CM024
              - CM045
      - number: '2.2'
        title: 规模口径：数字需求、包裹市场与 J&T 份额
        blocks:
          - type: paragraph
            body: >-
              最宽的需求镜头是东南亚数字商业。Temasek 和 Bain 称，该地区数字经济 2024 年达到 US$263 billion GMV、US$89 billion 收入和 US$11 billion
              利润。其中，同一项目估算电商 GMV 约 US$159 billion，并称视频电商已占电商 GMV 的 20%。McKinsey 较早但仍有用的结构性研究解释了包裹需求为什么快速加速：2016 至 2021
              年，东南亚电商销售额增长 5 倍，零售渗透率从 5% 跳到 20%。


              包裹口径更窄，也更贴近运营。J&T 官方 FY2025 材料显示，东南亚包裹 7.6588 billion 件、份额 34.4%，意味着 2025 年东南亚快递市场约 22.29 billion
              件。同一公司图表显示，中国包裹 22.066 billion 件、份额 11.1%，与中国 2025 年公开总量 199 billion 件大体一致。合并来看，2025 年东南亚加中国核心包裹机会约 221.29
              billion 件。这不是收入 TAM，也不是同等可争夺的市场，但这是 J&T 实际竞争市场中最佳的公开活动口径。


              本章还需要保留一个真实的方法论错位，而不是把它抹平。J&T 2025 年报引用 Frost & Sullivan，给出 2024 年东南亚电商零售交易额 US$238.25 billion，显著高于
              e-Conomy SEA 的 US$159 billion 电商口径。差异很可能来自范围和定义，并非只有一个正确答案，因此市场估算区间应被理解为对边界敏感，而不是精确值。
