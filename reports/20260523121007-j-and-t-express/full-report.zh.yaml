  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 因果图展示平台、劳工和治理风险如何传导到增长质量、利润率、现金流和估值。
    data:
      nodes:
        - id: platforms
          label: 平台依赖
          detail: 大型电商渠道仍贡献可观包裹流量。
        - id: pricing
          label: 低价竞争
          detail: 抢份额可能牺牲单票经济性。
        - id: service
          label: 服务和劳工波动
          detail: 工会冲突和投诉抬高执行风险。
        - id: data
          label: 数据 / 治理审查
          detail: 隐私姿态和美国数据安全背景增加尽调负担。
        - id: volume
          label: 包裹量质量
          detail: 增长可以保持高位，同时集中度和定价质量恶化。
        - id: margin
          label: 利润率和现金流
          detail: 单票收入压力和固定成本投入影响回报。
        - id: valuation
          label: 估值 / 投资测算
          detail: 正式问题解决前，公开市场倍数和信心会先反应。
      edges:
        - from: platforms
          to: volume
          label: 获取订单流
        - from: platforms
          to: pricing
          label: 平台议价权
        - from: pricing
          to: margin
          label: 单票收入压力
        - from: service
          to: volume
          label: 客户信任和留存
        - from: service
          to: margin
          label: 返工、退款和低效
        - from: data
          to: valuation
          label: 政策悬顶和尽调摩擦
        - from: data
          to: platforms
          label: 合作伙伴合规敏感度
        - from: volume
          to: margin
          label: 只有经济性守住，规模才有用
        - from: margin
          to: valuation
          label: 公开股权敏感性
