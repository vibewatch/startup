              31 日，包裹量 8.3258 billion 件、网点 19,500 个、分拣中心 255 个、自动分拣机器 422 台。官方里程碑把这些规模追溯到一连串国家启动、Best China 和 Fengwang
              收购、2023 年 10 月香港上市，以及非中国量占比的继续提升。
