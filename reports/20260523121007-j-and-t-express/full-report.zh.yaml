      - number: '6.4'
        title: 采纳和扩张最适合用平台合作和商家入口增长来衡量，而不是客户数披露
        blocks:
          - type: paragraph
            body: >
              公开客户采纳证据最强的不是已披露账户数，而是里程碑和运营代理指标。新加坡资源中心到 2026 年 5 月仍活跃，并持续更新电商发货内容，说明 J&T
              还在投入商家教育和需求捕获，而不是把这个渠道视为成熟业务。在菲律宾，COD 从既有用例扩展到到店和上门揽收客户，并明确面向微型、小型和中型企业。在沙特阿拉伯，LEAP 新闻稿把 J&T 与 Salla
              及多个大型电商平台绑定，显示东南亚之外，跨境商家和平台扩张仍是客户叙事的一部分。


              更广泛的公司披露也间接支持这一采纳叙事。2026 年一季度运营公告和材料显示，公司有极大的包裹量、非中国业务占比扩张，以及密集实体网络资产。另一篇 2026 年一季度 PRNewswire
              新闻稿把东南亚增长部分归因于与主要电商平台合作深化。这些都没有给投资者一座按细分客户数搭起的整洁桥，但说明 J&T 的客户基础仍由平台连接、走廊扩张和商家工具塑造，而不是纯到店寄件模式。
