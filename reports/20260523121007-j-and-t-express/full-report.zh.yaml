      - number: '1.5'
        title: 需求依赖与反向信号
        blocks:
          - type: paragraph
            body: >
              概况中的主要战略风险不是缺少规模，而是依赖外部平台、合作伙伴和监管容忍度。Rest of World 报道称，J&T 早期在印尼借助 OPPO 零售网络和区域赞助人模式扩张，之后又高度依赖包括
              TikTok、Temu、Shein、Shopee 在内的电商平台。同一报道称，Shopee 在 2025
              年将许多印尼订单转入自有体系，说明大型平台既能成为增长引擎，也会带来去中介化风险。定价和政治审查也有反向信号。Rest of World 报道称，印尼竞争对手指控 J&T 掠夺性定价；Senator Tom
              Cotton 2026 年 5 月致函，敦促 DOJ 审查 J&T 和其他中资关联物流公司，理由是涉嫌收集敏感数据、掠夺性定价和逃避关税。这些是指控和调查请求，不是裁决结论。另行而言，J&T
              自身网站隐私政策确认收集 IP 地址、设备信息、访问行为等技术和使用数据，这提供相关背景，但不是不当行为证据。
