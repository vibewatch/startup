      - number: '4.5'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              能支撑的财务结论偏有利，但并未完全去风险。收入质量比第一眼更好，因为 J&T 现在按接近成熟上市物流运营商、而非轻披露增长公司的节奏，披露经审计 IFRS
              结果、分部组合、季度经营声明和现金流数据。利润率路径也真实：2024 和 2025 年显示 IFRS 盈利、调整后盈利能力增强，且经营现金流超过 资本开支。这让自筹资金增长变得可信。


              剩余谨慎点在于，公开披露仍描绘的是一家靠规模、成本和折扣纪律取胜的快递公司，而不是一家拥有持久定价权的公司。Rest of World 和 ION 都指向平台内化和价格逐底竞争这类结构性风险；Cotton
              信则增加了政策压力，即便它只是指控。MarketScreener 的 2026
              年利润率筛选可能方向正确，但仍是卖方风格市场数据，不是公司指引。因此，最大的尽调阻塞项位于财务报表之下：实际包裹定价、头部平台集中度、CAC 和商家回本，以及银团债务背后的契约条款组合。
