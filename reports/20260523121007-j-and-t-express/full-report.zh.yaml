      - number: '4.4'
        title: 现金生成、杠杆与资本充足性
        blocks:
          - type: paragraph
            body: >-
              J&T 的资本充足性故事，比历史上的高速增长叙事暗示的要好得多。FY2025 经营现金流为 US$1.09 billion，对应资本开支（capex）US$593.6 million；H1 2025 经营现金流为
              US$421.1 million，对应资本开支 US$230.3 million。按简单公开数据计算，两个时期经营现金流覆盖 资本开支约 1.8x。这不意味着 J&T
              是轻资产；实际上恰好强化了相反观点。公司仍在为分拣自动化、车队和网络密度投入资金，但现在看来可以靠经营来支持，而不是依赖可见的近期股权融资。


              杠杆仍然重要。2025 年末现金及现金等价物为 US$2.01 billion，另有 US$130 million 受限现金，对应借款 US$2.41 billion。材料还称，J&T 已再融资为一笔 2028
              年 10 月到期的 RMB10 billion 银团贷款，此前持有一笔 2027 年 10 月到期的 US$1.25 billion
              融资。在当前现金生成下，这可管理，但意味着资产负债表并非净现金且完全干净。投资判断含义是中等信心，而非自满：J&T 看起来不像面临典型烧钱与现金跑道悬崖的公司，但仍依赖维持正经营现金流和有序再融资条件。
