  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户结构是多边的：平台和商家付费，收件人评判服务质量
        blocks:
          - type: paragraph
            body: >
              不能把 J&T 理解成只有一种客户。保留下来的 2025–2026 年来源显示，至少有五类经济属性不同的群体：能大规模路由或影响包裹需求的电商平台，需要简单下单和现金流支持的中小企业社交电商卖家，需要更广泛
              B2B 运输选项的大型零售和企业发货方，进入沙特阿拉伯等走廊的跨境商家，以及不一定直接选择承运商、但会决定满意度和平台复购行为的最终收件人。最强的官方商家证据来自新加坡和马来西亚，J&T
              明确向企业和消费者同时营销物流解决方案，也宣传卖家 / 商家管理、集中支付、EWB、揽收和其他重复使用工作流。


              这一拆分对尽调很重要，因为买方、用户和付款方并不总是同一个主体。电商平台可能谈判或影响物流关系，商家操作发货工具并承担服务后果，收件人才真正感受配送速度、派送失败或客服摩擦。因此，J&T
              的客户章节不是一张干净的企业客户名单，而是看密集运营网络如何同时接入平台需求、商家工具和收件人体验。
