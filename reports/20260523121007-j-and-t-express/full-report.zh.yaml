      - number: '4.2'
        title: 件量增长与 GTM 效率代理指标
        blocks:
          - type: paragraph
            body: >-
              公开披露在包裹吞吐量上很充分，在教科书式 SaaS 销售效率上很薄，因此正确做法是使用运营代理指标。FY2025 包裹量达到 30.13 billion 件，高于 FY2024 的 24.65 billion
              件；东南亚市场份额从 28.6% 升至 34.4%。H1 2025 的东南亚仍呈高速增长，Q1 2026 更新延续了这种模式：东南亚同比增长接近 80%，非中国包裹升至集团件量的
              35.1%。这些数字比任何单一公开客户名 更重要，因为它们说明 J&T 仍能把平台和商家需求转化为网络密度。


              GTM 的保留点是定价。J&T 称，公司用灵活定价和按量阶梯折扣吸引电商平台件量，同时扩大来自社交电商卖家、品牌商家、连锁门店和个人的非平台包裹。这有用，但不等于披露
              获客成本（CAC）、货币化率或商家回本。每票收入看起来从 FY2024 约 US$0.416 下降到 FY2025 约 US$0.404、H1 2025 约
              US$0.393，与竞争市场中的量优先策略一致。由此可给出的代理结论是：在网络层面，需求获取仍显得有效率，但公开记录没有暴露为维持增长需要多少折扣。
