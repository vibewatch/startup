      - number: '7.4'
        title: 平台依赖和竞争传导风险
        blocks:
          - type: paragraph
            body: >-
              理解 J&T 的竞争风险，最好把它看作对大型需求聚合方的依赖，而不是与其他快递公司简单竞争。Rest of World 报道称，管理层自己把增长描述为主要依赖包括 TikTok、Temu、Shein 和
              Shopee 在内的电商平台。这一点重要，因为平台既可以是客户，也可以是未来竞争对手。最清晰的可见例子是 Shopee 在印尼的动作：J&T 称自己失去了多数日常订单，同时管理层认为收入影响有限，因为
              Shopee 在当地已经变成较小客户。即便这一安抚方向上成立，事件也证明包裹量可能比公开投资者建模更快迁入平台自营体系。


              ION 的区域报道从外部强化了同一机制。顾问和运营商描述的市场是，区域 3PL 以低于本地水平的价格进入新国家、争夺平台包裹量，本地玩家则难以匹配补贴或规模。这让 J&T
              的收入韧性部分取决于平台生态在多大程度上继续向第三方快递开放。缓释逻辑确实存在：J&T
              一直在增加非平台客户、跨境伙伴和直接品牌合同，多国布局也带来一定分散。但在没有披露头部平台收入集中度的情况下，投资者仍只能从公开轶事承销伙伴风险，而不是依靠干净的暴露表。
