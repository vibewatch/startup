      - number: '8.4'
        title: 情景区间和驱动因素
        blocks:
          - type: paragraph
            body: >-
              估值工作应保持启发式，不要伪装成精确 DCF。这里的悲观、基准和乐观情景由少数真正重要的公开变量驱动：中国是否至少保持小幅盈利，东南亚是否继续复合份额和密度，New Markets
              是否继续走向正经济性，以及市场是否继续把 J&T 当作低于 1x 销售额的物流公司，还是开始为盈利轨迹支付更高价格。约 US$7.5 billion 到 US$8.5 billion
              的悲观情景假设，中国定价再次受损，平台集中度担忧重燃，并重估至约 0.5x–0.55x 2026 年收入或约 6x 前瞻 EBITDA。这不是崩盘情景，只是反向逻辑开始占上风时会发生的事。


              约 US$10.5 billion 到 US$12.0 billion 的基准情景假设当前事实大体成立：东南亚仍是最佳利润池，中国竞争激烈但保持正利润，投资者继续支付约 0.7x–0.8x 2026 年收入或
              7x–8x 前瞻 EBITDA。约 US$13.0 billion 到 US$15.0 billion 的乐观情景需要的不只是包裹量增长。它需要更多证据证明新地理市场能赚回资本成本、SF
              关系有战略价值，并且公开投资者更愿意越过中国定价压力，看集团层面的现金生成。正因为有这一范围，建议可以偏正面，但不能把股票说成低风险。
