      - number: '2.5'
        title: 证据缺口与投资解读
        blocks:
          - type: paragraph
            body: >-
              最重要的未解问题，不是 J&T
              是否参与一个大市场；答案显然是参与。未解的是，在计入平台议价权和地理因素后，这个市场有多少是持久、有利润且可争夺的。本章可以支撑一个由边界驱动的包裹机会区间，但还无法拆出客户集中度、东南亚逐国份额，或国内与跨境收入组合；缺少这些，就很难把区间变成干净可变现的
              SAM。公开来源包也让国家级服务基准偏薄，因为 Parcel Perform 暴露了这些指标的存在，却没有发布完整表格。


              缺失的细节会影响估值。绑定交易平台件量的公司，在平台补贴需求时可能看起来有结构性优势；一旦平台扩建自有网络，日常订单流就可能流失。同样，公司可以显示强区域份额，却仍在群岛型或低密度线路上面对薄弱的本地经济性。现有证据支持对需求和规模的乐观看法，但对定价权只能给出带限定的判断。尽调上，更合适的姿态是把
              J&T 的市场视为庞大、快速变化且运营上有吸引力，同时把利润率耐久性、平台集中度和跨境组合保留为开放的投资假设问题，而不是已解输入。
