companyProfile:
  summary: >
    J&T Express 是一家创立于印尼的快递物流运营商，业务围绕快递、跨境物流和面向平台、商家、消费者的数字物流工具展开。官方材料称公司成立于 2015 年，投资者关系文案将成立时间收窄到 2015 年 8 月。治理材料把 Jet
    Jie Li 置于创始人、CEO、董事长核心位置，一些独立媒体也把 Tony Chen Mingyong 写入早期故事。公司从东南亚起步，扩到覆盖中国、中东和拉美的 13 国网络；商家 API、围绕 COD
    的工作流、网点密度、分拣自动化和跨境服务层共同支撑运营模型。2023 年以每股 HK$12 完成 IPO 后，J&T 以 1519.HK 在香港上市；此前据报道，2021 年私募融资约 US$2.5 billion、估值约
    US$20 billion。FY2025 已经证明公开市场层面的盈利和现金生成，但投资逻辑仍被中国价格竞争、平台依赖和创始人控制风险框住。
