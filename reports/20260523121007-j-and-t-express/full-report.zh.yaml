  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 指示性股权价值区间
      - 回报逻辑
      - 概率信号
      - 关键失效模式
    rows:
      - - 悲观
        - 中国竞争再次加剧，平台集中度仍高，投资者把股票重估到物流倍数低端。
        - US$7.5B 至 US$8.5B
        - 公开市场下行空间不小，但并非灾难性，因为公司已盈利且已上市。
        - 如果中国 EBIT 转弱，或另一家大型平台抽走日常件量，就会显现。
        - 又一轮价格战会把利润变成低质量、低倍数的收益流。
      - - 基准
        - 东南亚领先地位延续，中国保持小幅盈利，新市场继续改善，股票按约 0.7x 至 0.8x 2026 年收入，或 7x 至 8x 远期 EBITDA 交易。
        - US$10.5B 至 US$12.0B
        - 上行空间足以支撑建设性的公开市场建议，不需要英雄式重估。
        - 与当前文件、市场倍数和共识语气最一致。
        - 如果中国或平台风险被证明比公开记录结构性更差，基准情景会迅速下滑。
      - - 乐观
        - 东南亚增长保持强劲，新市场贡献有利润的规模，SF 关系被证明具备战略价值，投资者愿意支付更接近目标价或 IPO 时期语境的估值。
        - US$13.0B 至 US$15.0B
        - 当前市值起点已经压缩，上行因此变得可观。
        - 需要非中国占比继续提升，并拿出盈利质量改善的证据。
        - 如果新地区只消耗资本，却无法交付可持续贡献利润率，乐观情景测算就失效。
    notes: 这些区间是公开市场启发式估算，基于当前市值、历史压缩、分析师目标价语境和远期倍数筛选；不是 DCF。
