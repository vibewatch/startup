      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              需求逻辑真实存在。Roland Berger 将该地区最后一公里扩张与电商增长、城市化、收入提升和公共基础设施投资相连。Temasek 和 Bain 又增加了新一层：视频电商已经占电商 GMV
              的重要份额，会制造更尖峰化、以活动驱动的包裹流。McKinsey 认为，与早期只围绕交易平台的阶段相比，物流玩家也面对更广的商品组合和更多元的渠道，这会抬高网络广度和运营灵活性的价值。J&T 自身 Q1 2026
              数据显示，公司仍在把这些驱动转化为件量，尤其是东南亚，包裹同比增速接近 80%，峰值日单量达到 47 million 件。


              约束同样重要。Maersk 强调，印尼、菲律宾等市场地理破碎、岛屿众多、道路网络较弱、海运线路更慢。McKinsey
              又补充了货到付款和退货摩擦，两者都会提高配送失败概率，推高端到端服务成本。国家级服务设计也重要，因为 Parcel Perform 将运输时效和成功率框定为因国家而异，而不是区域平均数。


              最大的战略风险是定价和平台权力。ION 描述区域承运商以低于本地的价格跨境扩张以抢份额，Roland Berger 则称毛利率已承压。Rest of World 给出更尖锐的公司层面警告：印尼竞争对手指控 J&T
              掠夺性定价，Shopee 将许多印尼日常订单转向自有网络。Q1 2026 自动化和车队指标显示 J&T 正在投入以保持效率，但保持效率不等于控制需求。
