      - number: '3.4'
        title: 定价权受交易平台锁定、补贴和逐线路竞争约束
        blocks:
          - type: paragraph
            body: >-
              已审阅定价证据是碎片化的，但碎片仍有用。EasyParcel 的马来西亚比较显示，J&T 国内配送起价 RM5.42 并支持 COD，而相关交易平台工作流中的 Ninja Van 被定位为 RM22
              起的国际运输且不支持 COD。Cloud Ecommerce 的菲律宾比较给出 2026 年国家级视角：Flash 在基础和批量费率上看起来最便宜，J&T 居中，Ninja Van
              是定价更高、技术更强的选项。这些数字不能当作通用资费，因为它们取决于线路和语境，但确实展示了 J&T 的实际问题：直接同业可以用更便宜或更专门的服务进攻，平台自有物流则能不发布公开市场价卡，就改变商家经济性。


              因此，切换成本和锁定效应比标价更重要。ION 称，泛 ASEAN 承运商最容易摘到的低垂果实，一直是 Shopee、Lazada 等大型电商平台；但它也说，一些运营商退出平台服务，是因为价格实在太低。Rest
              of World 更进一步，展示 Shopee 如何通过 SPX 将印尼件量内部化。一旦交易平台控制运费补贴、默认快递和卖家可见度，商家的选择集就会变窄，J&T
              这样的中立第三方承运商既要争包裹执行，也要争平台入口。J&T 横跨多平台的中立性，对多平台商家和非平台客户仍有价值，但平台自有生态是公司可能拥有规模优势、却难有完全持久定价权的最清晰原因。
