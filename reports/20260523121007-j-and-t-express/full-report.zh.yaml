          tone: warning
        - label: 创始人控制折价
          value: 7
          detail: 治理集中限制公开市场愿意支付的溢价。
          tone: warning
        - label: 分析师情绪
          value: 6
          detail: 一致预期可能把股价拉向或推离基准情形。
          tone: neutral
        - label: SF 战略执行
          value: 6
          detail: 交易有帮助，但协同必须走出信号层面才算数。
