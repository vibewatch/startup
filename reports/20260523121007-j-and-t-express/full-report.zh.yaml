      - number: '6.5'
        title: 主要客户风险是集中度和脱媒，服务质量摩擦会放大这一风险
        blocks:
          - type: paragraph
            body: >
              最关键的分析错误，是把可见电商平台关系误认为持久议价权。Rest of World 描述了 J&T 的崛起如何绑定中国电商浪潮，也展示了下行面：Shopee
              一直在印尼建设更多自有物流能力，并把卖家推向该网络。这正是投资者该担心的客户风险模式。如果 J&T 最大的流量来源是电商平台，这些平台同样可以改变分配、挤压经济性，或在密度足够后把物流内化。


              公开披露没有解决这个问题。保留来源没有披露 NRR、GRR、合同期限、头部客户集中度，或按 GMV 计算的伙伴包裹份额。TikTok Shop
              之外的具名证据也更弱，因为多个平台关系只是生态提及，而不是独立验证的生产案例。再叠加反向评价强度，说明即便商家和平台获客叙事看起来很强，收件人体验仍可能崩塌。因此，客户章节落在谨慎结论上：J&T
              显然有真实客户和重复商家工作流，但集中度、续约和平台依赖的经济性仍明显披露不足。
