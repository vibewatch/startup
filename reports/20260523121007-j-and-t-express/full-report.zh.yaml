  - id: TV004
    title: 可比估值表
    columns:
      - 参照
      - 指标
      - 倍数 / 估值 / 状态
      - 对 J&T 的意义
      - 主要局限
    rows:
      - - J&T 当前公开市场定价
        - 当前市值 + 远期指标筛选
        - ~US$9.8B 市值；~0.81x 过去十二个月收入；2026E EV/EBITDA 7.05x
        - 当前入场决策最干净的锚。
        - 仍只是市场当下给一家高波动物流公司定价的快照。
      - - SF Holding
        - 综合物流上市可比公司
        - CNY173.06B 市值；CNY312.52B TTM 收入；14.20 远期 P/E
        - 亚洲最接近的大型上市物流质量参照。
        - 综合物流组合更宽，高端定位也强于 J&T。
      - - Sea Limited
        - 平台相邻上市可比公司
        - US$53.45B 市值；2.21x 收入；19.24x EV/EBITDA
        - 显示东南亚平台敞口可获得更高公开市场倍数。
        - 游戏和金融科技使其只能作为相邻可比，而非纯包裹业务。
      - - Alibaba
        - 平台 + 物流相邻参照
        - ~US$311.13B 市值；2.08x 收入；11.17x EV/EBITDA
        - 可用于理解生态系统和 Cainiao 式物流语境。
        - 集团估值主要由商业和云业务主导，而非独立快递经济性。
      - - J&T 2023 IPO
        - 自身历史估值参照
        - 计划 IPO 启动时约 US$13B
        - 显示上市时公开市场愿意以什么价格出清股票。
        - 所处市场环境不同，且早于 FY2025 盈利可见。
      - - J&T 2021 私募轮
        - 自身历史后期私募估值
        - 约 US$20B，融资约 US$2.5B
        - 有助于判断公开市场已把预期压缩到什么程度。
        - 私募轮热情不能作为可靠的实时公开市场可比。
    notes: 这是基准参照表，不是纯直接可比倍数表。保留的最佳参照混合了直接物流同业、相邻可比公司和 J&T 自身历史估值。
    enumerationScope:
