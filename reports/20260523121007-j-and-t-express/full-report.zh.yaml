      - number: '1.6'
        title: 图表
        blocks:
          - type: callout
            title: 东南亚领先地位如今有利润支撑，而不只是增长
            body: |
              概况中最强的一点是，J&T 的东南亚故事已不再只是补贴驱动的扩张叙事。官方 2025 年披露同时给出领先市场份额、庞大绝对包裹基数和有意义的分部盈利。
            calloutType: strength
            claimRefs:
              - CO028
              - CO029
              - CO031
              - CO048
          - type: callout
            title: J&T 的运营基因来自渠道搭建，而不是传统邮政资产
            body: |
              公司看起来是把 Jet Jie Li 在 OPPO 时期的市场知识、区域赞助人和本地伙伴拼在一起，再叠加集中式基础设施和资本。该组合有助于解释，为何网络能在公司上市前快速铺开到碎片化的东南亚市场。
            calloutType: insight
            claimRefs:
              - CO013
              - CO036
          - type: callout
            title: 平台依赖同时创造增长和去中介化风险
            body: |
              J&T 受益于大型电商平台，但同一批平台也能把物流内化或重新分配件量。Shopee 在印尼的调整就是一个具体例子：增长质量取决于平台关系，而不只是包裹吞吐量。
            calloutType: risk
            claimRefs:
              - CO037
              - CO038
              - CO039
          - type: callout
            title: 定价与数据指控带来地缘政治压力，但尚未证明不当行为
            body: |
              已审阅的反向来源提出两个独立担忧：印尼定价行为，以及美国政治层面对数据和关税做法的担心。本章材料中，两类来源都没有确立经裁决的不当行为，但二者都重要，因为它们会影响监管、合作伙伴意愿和估值。
            calloutType: risk
            claimRefs:
