      - number: '1.2'
        title: 创始人主导的治理与高级管理层
        blocks:
          - type: paragraph
            body: >
              官方治理记录把 J&T 的中心放在 Jet Jie Li 身上。公司治理材料将他列为创始人、执行董事、首席执行官和董事长，并描述其背景来自 OPPO 在印尼及更广泛亚洲市场的扩张。这个创始人-市场匹配重要，因为
              J&T 早期运营逻辑靠的是本地渠道搭建、快速执行和跨境复制，而不是单一国家资产基础。披露出的其他高管团队更薄，但仍有相关性：Steven Suzhou Fan 为执行总裁，Charles Junyi Hou
              为副总裁，Dylan Say Keong Tey 自 2021 年 8 月起任 CFO。截至 Q1 2026 经营声明，董事会包括 1 名执行董事、3 名非执行董事和 3
              名独立非执行董事。复杂之处在于创始人归属：官方材料对 Jet Jie Li 使用单数创始人表述，几家独立媒体也把 Tony Chen Mingyong
              写入创始叙事。该模糊点不改变当前运营控制权，但会影响对早期经济安排、关系和影响力的理解。
