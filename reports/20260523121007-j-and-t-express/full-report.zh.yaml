          label: 流量生成与订单创建
        - from: platform
          to: customs
          label: 跨境订单路由 / 卖家履约选择
        - from: customs
          to: jnt
          label: 清关后的包裹注入本地包裹网络
        - from: jnt
          to: lastmile
          label: 分拣、干线与配送执行
        - from: lastmile
          to: consumer
          label: 配送、COD 与退货体验
        - from: platform
          to: insource
          label: 日常单量转入自建网络
        - from: insource
          to: consumer
          label: 平台自有末端履约
        - from: consumer
          to: platform
          label: 评分、复购需求与政策反馈
