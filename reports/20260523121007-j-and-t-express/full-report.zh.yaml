  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的风险结论
        blocks:
          - type: paragraph
            body: >-
              J&T 的风险栈不是由单一生死缺陷主导，而是一组规模型业务暴露；这些风险压缩公开股票上行空间的速度，可能快于它们损害运营连续性的速度。一阶风险仍是价格战和利润率压力。官方 2025
              年及中期披露显示，中国业务仍盈利但竞争激烈，2025
              年上半年单票收入同比下降。独立报道补上了传导机制：区域末端配送玩家愿意以低于本地既有玩家的价格争夺电商包裹量，平台运营商也越来越愿意在规模足够时内化物流。这种组合会让包裹继续增长，却封住经济上行。


              二阶问题是依赖。J&T 自己对 Rest of World
              表示，增长主要依赖电商平台，尽管公司也在尝试多元化到直接品牌和非平台业务。劳工和服务质量风险排在后面，因为公开可见的投诉和工会冲突入口显示，规模并不保证执行顺滑。隐私、数据治理和地缘政治审查是真风险，但必须谨慎表述：当前美国证据是政策风险框架和调查请求，不是针对
              J&T 的认定。执行和资本强度风险贯穿其后，因为公司仍以上市公司规模投入车辆、自动化、枢纽和新市场铺设。
