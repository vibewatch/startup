  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品是一套物流工作流栈，而不是单一快递 App
        blocks:
          - type: paragraph
            body: >-
              J&T 应按工作流很重的物流产品来评估，而不是薄薄一层消费者寄件小工具。官方全球和中国服务页面描述的是一家公司：核心业务为快递服务和国际物流，提供 7x24/365 运营、24
              小时客服、门到门跨境处理，以及一个旨在帮助客户管理库存和经营状态的数字物流平台。这些表述重要，因为它把产品框定为跨越揽收、路由、运输、客服和商家运营的网络化服务系统，而不只是最后一公里配送。


              国家级界面把这个工作流讲得更具体。马来西亚 FAQ 展示了到网点现场寄件流程，叠加面向批量下单、发票搜索、揽收和更低费率的 VIP 层。印尼消费者 App 强调下单、追踪、查价和网点发现；面向泰国的 VIP
              App 增加条码扫描、多包裹管理、打印和网点搜索。新加坡则通过 TikTok 物流案例研究和零售 / B2B
              运输发布，提供面向合作伙伴的证据。因此，可支撑的产品定义很宽，但内部一致：消费者寄件和追踪、商家订单接入、枢纽与干线编排、跨境配送和客服，都在同一套运营栈里。
