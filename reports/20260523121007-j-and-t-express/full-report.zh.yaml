      - number: '3.2'
        title: 东南亚直接同业真实存在，但攻击的不是同一项任务
        blocks:
          - type: paragraph
            body: >-
              在中立第三方同业中，Ninja Van 是已审阅来源包里最接近的区域包裹对手。其新加坡网站强调门到门包裹配送、实时追踪、带清关支持的指定目的地国际运输、揽收和投递点选项，以及三次尝试后的退回寄件人流程。Flash
              Express 更积极地围绕商家便利和 COD 经济性定位：其泰国网站突出免费上门揽收、自注册 COD、每日结算、2.5% COD 费、网点查询和运费估算。Lalamove
              是邻近但重要的替代者，因为其官方定位是当日达加面包车和卡车租用，尤其适合优先考虑即时或城内调度、而非纯预约包裹网络的商家。


              第三方比较进一步说明，这些同业赢在不同维度。EasyParcel 的马来西亚比较把 J&T 描述为带 COD 和多平台集成的更便宜国内选项，而在相关交易平台工作流中，Ninja Van
              被呈现为仅做国际。Cloud Ecommerce 的 2026 年菲律宾比较把 J&T 描述为规模领先者，Ninja Van 是更偏技术的选项，Flash
              是低成本挑战者。这不意味着这些比较博客里的每个统计都权威，但它符合来源包的更大模式：J&T 的核心直接同业威胁，不是另一个中立承运商拥有比 J&T
              更多锁定需求，而是竞争对手能在特定国家和城市，以线路经济性、特定能力或商家体验发起低价或差异化攻击。
