            title: J&T 在竞争仍发生于开放市场的地方最强
            body: 公司拥有足够规模、自动化和多国密度，能跑赢许多中立第三方承运商。在商家和多平台线路上，这点最重要，因为没有单一交易平台能直接把包裹路由走。
