      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              J&T 的包裹需求是多边的。第一类、也是最有力的买方，是大型交易平台和平台生态：Shopee、Lazada、TikTok Shop、Temu、Shein
              以及其他聚合订单流，并能按线路、季节和补贴逻辑分配量的渠道。这些买方关心 SLA 覆盖、包裹价格、峰值准备和集成深度。用户通常是物流或商家运营团队，付款方可以是平台本身、商家，或双方共用的补贴池。Sea
              的投资者关系页面确认 Shopee 作为独立平台生态的核心地位，这一点重要，因为即便 J&T 拿到大件量，这部分需求也不在 J&T 控制之内。


              第二类是商家和品牌。大型品牌和企业卖家往往为可靠性、结算纪律和跨境覆盖买单；SME 和线上卖家对价格更敏感，也常愿意在多个承运商之间多归属。ION
              的报道在这里有帮助，因为它显示本地运营商试图在最大平台之外建立可持续经济性，并描述了一些市场里 SME 占比较高的客户组合。第三类是跨境卖家，其工作流越来越像 B2B2C 链条，而不是简单的国内揽收。Maersk
              对履约、清关、最后一公里和退货的讨论说明，哪怕 J&T 对组合披露有限，跨境卖家仍具战略重要性。终端消费者很少是买方，但他们是服务质量的裁判；配送失败率和退货行为会影响平台分配决策。
