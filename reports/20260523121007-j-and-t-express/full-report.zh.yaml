      - number: '5.5'
        title: 信任、隐私和质量控制的公开呈现偏通用
        blocks:
          - type: paragraph
            body: >-
              J&T 确实发布了与信任相关的材料，但更接近基础法律合规，而不是差异化技术保证。隐私政策称，网站收集大量设备和使用数据，包括 IP 地区、操作系统、网络服务商、屏幕分辨率、cookie
              支持、搜索词、访问时长和访问页面。条款页面把网站使用纳入合同关系，说明网站由 J&T 拥有并管理，并要求 18
              岁以下未成年人在监护人陪同下审阅。这些都是真实的控制面，说明公司有法律和数据处理姿态，而不是完全忽视隐私。


              局限在于没有公开的部分。抓取材料没有暴露状态页、公开服务质量仪表盘、SOC 式安全材料，或带清晰限速和认证细节的开放开发者访问政策。最显眼的隐私材料日期是 2021-10-15，商家 API
              仍需要关系准入，而不是透明自助。结合区域入口碎片化，结论是混合的：J&T 可能有足够的运营流程支撑大规模物流，但外部可见的信任和产品质量控制看起来通用，而非异常强。
