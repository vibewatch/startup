    - 2025 annual report
    - Customer categories expanded, but size not disclosed
    - Suggests some diversification away from large marketplaces
    - Quantify non-platform revenue and parcel mix
  - - Revenue per parcel trend
    - Derived from official revenue and volume
    - Approx. US$0.416 in FY2024 to US$0.404 in FY2025 to US$0.393 in H1 2025
    - Suggests mix and pricing pressure remain active even while profits improve
    - Reconcile country mix, discounting, and yield changes
