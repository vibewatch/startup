- id: SI005
  title: Financial verdict and diligence blockers
  body: 'The supportable financial verdict is favorable but not fully de-risked. Revenue quality is better than it first appears because J&T now discloses audited IFRS results, segment mix, quarterly operating statements, and cash-flow data at a cadence closer to a mature public logistics operator than a disclosure-light growth company. The margin path is also real: 2024 and 2025 showed positive IFRS earnings, stronger adjusted profitability, and operating cash flow exceeding capex. That makes self-funded growth plausible.


    The remaining caution is that public disclosures still describe a courier winning with scale, cost, and discount discipline rather than with durable pricing power. Rest of World and ION both point to platform insourcing and race-to-the-bottom pricing as structural risks, while the Cotton letter adds policy overhang even if it is only an allegation. MarketScreener''s 2026 margin screen may prove directionally right, but it is still sell-side-style market data, not company guidance. The biggest diligence blockers therefore sit below the financial statements: realized parcel pricing, top-platform concentration, CAC and merchant payback, and the covenant package behind the syndicated debt.'
