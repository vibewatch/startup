tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream / lens
  - Mechanism / payer
  - Disclosed 2025 value / mix
  - Revenue quality
  - Diligence ask
  rows:
  - - Express delivery services
    - Parcel fees paid by marketplaces, merchants, brands, and consumers
    - US$11.81bn; 97.1% of FY2025 revenue
    - High volume and clearly disclosed, but pricing power is limited
    - Disclose realized revenue per parcel by geography and customer class
  - - SEA express delivery
    - Regional parcel delivery across seven Southeast Asian markets
    - US$4.50bn FY2025 revenue; 37.0% of group
    - Best disclosed profit pool and strongest share gains
    - Provide country-level realized yield and rebate data
  - - China express delivery
    - Domestic parcel delivery in China
    - US$6.71bn FY2025 revenue; 55.2% of group
    - Largest revenue base, but price-war exposure is highest
    - Disclose merchant mix and parcel yield by lane or product tier
  - - New Markets express delivery
    - Parcel operations in Saudi Arabia, UAE, Mexico, Brazil, and Egypt
    - US$870m FY2025 revenue; 7.2% of group
    - Still scaling; EBITDA positive but EBIT thin
    - Show country-level contribution margins and launch economics
  - - Cross-border logistics
    - Cross-border parcel and logistics services
    - US$76.1m FY2025 revenue; 0.6% of group
    - Strategically interesting but immaterial in disclosed revenue
    - Separate customers, corridors, and gross margin
  - - Non-platform parcels
    - Social-commerce sellers, chain stores, brands, and individuals
    - Customer category disclosed; revenue not separately disclosed
    - Helpful diversification signal, but size is opaque
    - Quantify non-platform parcel share, revenue share, and growth
  notes: Mix is built from official FY2025 segment disclosure; non-platform parcels are disclosed qualitatively but not as a separate revenue line.
