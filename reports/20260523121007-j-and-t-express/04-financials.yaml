  - - Q1 2026 non-China mix
    - Q1 2026 filing and deck
    - 35.1% of parcels came from outside China; SEA grew 79.9% YoY
    - Signals that the higher-growth geographies still matter after FY2025
    - Provide revenue and margin mix for non-China parcels
  - - Pricing mechanism
    - 2025 annual report
    - Flexible pricing plus tiered volume discounts to platforms
    - Explains why volume can grow faster than revenue per parcel
    - Share realized discount ladders and rebate true-ups
