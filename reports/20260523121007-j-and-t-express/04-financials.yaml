- id: TI003
  title: Cost-structure table
  columns:
  - Cost or margin driver
  - Public evidence
  - 2024-2025 signal
  - Implication
  - Diligence ask
  rows:
  - - Group gross margin
    - Official FY2024 and FY2025 filings
    - 10.5% in FY2024 to 12.0% in FY2025
    - Margin path is improving even without obvious premium pricing power
    - Bridge the improvement by region and major cost bucket
  - - SEA cost per parcel
    - 2025 annual report
    - US$0.57 in 2024 to US$0.48 in 2025
    - Best public evidence that scale and automation are lowering unit cost
    - Disclose country-level parcel cost by labor, transport, and sorting
  - - China price competition
    - H1 2025 commentary plus FY2025 segments
    - China stayed margin-positive, but adjusted EBIT margin was only about 1.4% in FY2025
    - China is a scale engine more than a profit engine
    - Show parcel yield and cost by product tier in China
  - - New Markets breakeven path
    - H1 2025 and FY2025 segments
    - EBITDA positive by H1 2025, but EBIT still negative in H1 and only barely positive in FY2025
    - New Markets still need fixed-cost absorption and network maturity
    - Provide country-level launch curves and depot utilization
  - - Automation footprint
    - Q4 2024 and FY2025 year-end updates
    - Automated sorting machines rose from 279 at 2024 year-end to 413 at 2025 year-end
    - Automation likely supports lower handling cost and better throughput
    - Tie capex projects to cost-per-parcel reductions
  - - Fleet ownership
    - FY2025 annual report and 4Q2025 deck
    - More than 13,300 line-haul vehicles, including more than 8,500 self-owned
    - Owning more infrastructure can improve control but keeps capital intensity high
    - Split owned versus leased fleet economics and maintenance burden
  notes: Cost structure is reconstructed from management commentary and segment results because J&T does not publish a full public cost-bucket bridge by geography.
