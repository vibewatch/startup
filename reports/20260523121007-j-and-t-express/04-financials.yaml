  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cac-payback
    missingEvidence: Customer-acquisition cost, sales productivity, and payback by geography, platform, and non-platform cohort.
    whyItMatters: The chapter can show growth and parcel density proxies, but it cannot underwrite true sales efficiency without CAC and payback disclosure.
    diligencePath: Request cohort-level CAC, sales headcount productivity, merchant activation funnel, and payback by SEA, China, and New Markets.
    relatedQuestionRefs:
    - QI009
    - QI026
  - type: missing-source
    severity: material
    topic: realized-pricing-and-rebates
    missingEvidence: Realized price per parcel, rebate schedules, and top-platform discount ladders by market.
    whyItMatters: List pricing is not the economic truth for a courier facing marketplace bargaining power; realized pricing determines whether scale gains are durable.
    diligencePath: Obtain merchant contracts or rate cards showing base price, volume discounts, rebate true-ups, and lane-level exceptions.
    relatedQuestionRefs:
    - QI008
    - QI026
  - type: access-blocked
    severity: material
    topic: syndicated-loan-terms
    missingEvidence: Full covenant, collateral, and interest-spread package for the syndicated borrowings replacing the older US$1.25 billion facility.
    whyItMatters: Public decks identify maturities, but not the triggers that would matter if China pricing or platform concentration weakened cash flow.
    diligencePath: Pull the full loan agreement or lender presentation and test covenants under downside volume and margin scenarios.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI005
  - type: missing-source
    severity: material
    topic: platform-concentration
    missingEvidence: Revenue, parcel, and rebate concentration by top platforms such as Shopee, Temu, SHEIN, Lazada, and TikTok-linked sellers.
    whyItMatters: Platform concentration is the cleanest way to judge how much of current revenue quality depends on counterparties that can in-source logistics.
    diligencePath: Ask for top-10 customer concentration by revenue and parcel volume, with separate disclosure for marketplace affiliates and non-platform merchants.
    relatedQuestionRefs:
    - QI010
    - QI025
  - type: missing-source
    severity: minor
    topic: maintenance-vs-growth-capex
    missingEvidence: Split between maintenance capex and growth capex, plus country-level capital commitments.
    whyItMatters: Positive operating cash flow is encouraging, but runway analysis is still cleaner when maintenance requirements are separated from expansion spend.
    diligencePath: Request maintenance versus growth capex split, expected automation roll-out by market, and committed spend by facility and fleet class.
    relatedQuestionRefs:
    - QI017
    - QI020
    relatedTableRefs:
    - TI005
