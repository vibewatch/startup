company:
  name: J&T Express
chapter:
  number: 4
  title: Financials
  summary: 'J&T''s public filings now describe a profitable, cash-generative express operator rather than a disclosure-light hypergrowth story. FY2025 revenue reached US$12.16 billion with US$1.09 billion of operating cash flow, and the main economic pattern is clear: SEA is the profit engine, China is the biggest revenue base but margin-thin, and self-funded growth looks plausible so long as platform-driven price pressure does not re-intensify.'
sections:
- id: SI001
  title: Revenue model and regional mix
  body: 'J&T should be analyzed as a listed express operator with meaningful disclosure, not as a startup hiding its monetization. The official service and IR surfaces show a straightforward model: parcel-handling revenue is the core product, with cross-border logistics and digital logistics tools attached around it. FY2025 confirmed how concentrated that model still is. Group revenue reached US$12.16 billion, and express delivery services alone accounted for US$11.81 billion, or about 97% of reported revenue. Cross-border revenue was only US$76.1 million, which keeps the disclosed business overwhelmingly tied to domestic and regional parcel density rather than to a higher-margin cross-border monetization story.


    The revenue mix is also geographically lopsided in an analytically useful way. China remained the largest revenue pool at US$6.71 billion, or about 55% of FY2025 revenue, while SEA contributed US$4.50 billion, or about 37%. New Markets were still relatively small at US$870 million. That mix matters because J&T''s quality of revenue depends less on abstract diversification and more on whether SEA can keep compounding volume and margin while China stays large enough to provide scale without destroying economics. The main supportable read is that J&T now has real public revenue visibility, but the disclosed stream mix is still dominated by low-take-rate express delivery rather than by richer ancillary products.'
