summary:
  headline: >
    J&T Express is a scaled, profitable HKEX-listed express operator trading below prior private and IPO-era reference
    points; Buy for valuation, but only with medium confidence because China pricing, platform concentration, and
    governance risk keep the risk rating high.
  overallScore: 7
  recommendation: buy
  confidence: medium
  riskRating: high
  valuationStance: attractive
