  - id: SP004
    title: Pricing power is constrained by marketplace lock-in, subsidies, and lane-specific competition
    body: >-
      The reviewed pricing evidence is fragmented, but the fragments are still useful. EasyParcel's Malaysia comparison
      shows J&T starting from RM5.42 for domestic delivery and supporting COD, while Ninja Van on that marketplace
      workflow was positioned as international shipping from RM22 without COD. Cloud Ecommerce's Philippines comparison
      gives a country-specific 2026 lens in which Flash appears cheapest on base and bulk rates, J&T sits in the middle,
      and Ninja Van is the premium-priced tech-forward option. Those numbers should not be read as universal tariffs,
      because they are lane- and context-specific, but they do show the practical problem for J&T: direct peers can
      attack with cheaper or more specialized offers, while platform-owned logistics can change merchant economics
      without publishing an open-market rate card at all.


      That is where switching cost and lock-in become more important than list prices. ION says the low-hanging fruit
      for pan-ASEAN carriers has been large e-commerce platforms such as Shopee and Lazada, but it also says some
      operators exited platform-servicing because the prices were simply too low. Rest of World goes further by showing
      how Shopee internalized Indonesia volume through SPX. Once the marketplace controls shipping subsidies, courier
      defaults, and seller visibility, the merchant's choice set narrows and a neutral third-party carrier like J&T
      competes for access as much as for parcel execution. J&T's neutrality across platforms is still valuable for
      multi-platform merchants and non-platform customers, but the platform-owned ecosystems are the clearest reason the
      company likely has scale advantages without fully durable pricing power.
