      Malaysia EasyParcel and Philippines comparison-blog figures are useful directional evidence, but they do not
      substitute for official contracted rate cards or realized merchant pricing by lane. The chapter uses them as
      context, not as globally normalized price truth.
    claimRefs:
      - CP029
      - CP034
      - CP037
