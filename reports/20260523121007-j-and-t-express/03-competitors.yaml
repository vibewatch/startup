    title: J&T is strongest where competition still happens in the open market
    body: >-
      The company has enough scale, automation, and multi-country density to outrun many neutral third-party carriers.
      That matters most in merchant and multi-platform lanes where no marketplace can simply route the parcel away.
    claimRefs:
