  - id: SP005
    title: "Moat verdict: scale and infrastructure are real, but pricing power is not deeply defensible"
    body: >-
      The strongest evidence in J&T's favor is scale plus operating breadth. Official 2025 materials show 30.1 billion
      parcels, 34.4% Southeast Asia share, 22.066 billion China parcels, and a 13-country network, while Q1 2026
      disclosures show further outlet, sorting-center, and automation depth. Rest of World adds that J&T's local-sponsor
      model and willingness to build infrastructure differentiated it from rivals that could not absorb losses or fund
      physical expansion quickly. These are not trivial advantages. They support the view that J&T is one of the few
      neutral third-party carriers in the region with the density and organizational muscle to survive multi-country
      competition.


      The weaker part of the moat is price and demand control. Platform-owned logistics systems can reroute orders
      in-house, direct peers can undercut on specific lanes, and SF still occupies a more premium trust position than
      J&T in China and cross-border-adjacent service expectations. J&T itself argues that third-party carriers should
      keep winning because they aggregate parcels across all platforms and outside e-commerce channels, and that
      argument is plausible. But the reviewed evidence does not show durable control over the most important levers of
      pricing. The supportable verdict is therefore moderate rather than dominant: J&T has a genuine network and
      automation advantage, yet the company remains exposed to marketplace disintermediation, price-war discipline, and
      premium-brand competition.
