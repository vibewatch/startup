  evidenceGaps:
    - type: access-blocked
      severity: material
      topic: official-rate-cards
      missingEvidence: >-
        Official public rate cards or merchant contract terms for Shopee Xpress, LEX/Cainiao, Lalamove, and SF in the
        reviewed local source pack.
      whyItMatters: >-
        Without official tariffs or contract structures, the chapter can compare pricing posture only through contextual
        examples rather than fully normalized list pricing.
      diligencePath: >-
        Recover official merchant rate cards or contract templates by market, especially for marketplace-owned logistics
        and same-day providers.
      relatedQuestionRefs:
        - QP019
    - type: private-evidence-only
      severity: material
      topic: platform-concentration
      missingEvidence: >-
        A public breakdown of J&T parcel volume or revenue by platform, including Shopee, Lazada, TikTok, Temu, and
        SHEIN.
      whyItMatters: >-
        The real moat question is how much demand J&T controls versus merely services, and that cannot be sized cleanly
        without concentration data.
      diligencePath: >-
        Request management disclosure on top platforms by parcel volume, revenue, rebate structure, and share of
        non-platform volume.
      relatedQuestionRefs:
        - QP020
    - type: enumeration-incomplete
      severity: material
      topic: china-incumbent-completeness
      missingEvidence: Usable official fetches for ZTO, STO, and Yunda comparable to the SF and YTO materials retained in this chapter.
      whyItMatters: >-
        The China-incumbent map is directionally useful but not exhaustive; missing major official comparables can
        distort how crowded the China battlefield really is.
      diligencePath: >-
        Refresh the broken competitor fetches and add official IR or annual-report evidence for ZTO, STO, and Yunda
        before treating the China profile table as comprehensive.
      relatedQuestionRefs:
        - QP021
    - type: missing-source
      severity: material
      topic: service-level-benchmarks
      missingEvidence: >-
        Audited or operator-reported apples-to-apples SLA, damage-rate, and return-rate metrics across J&T, Ninja Van,
        Flash, platform-owned logistics, and China incumbents.
      whyItMatters: Comparison-blog metrics are directionally useful but too weak for underwriting service superiority by market.
      diligencePath: Obtain merchant dashboards, carrier scorecards, or audited marketplace SLA data by country and lane.
      relatedQuestionRefs:
        - QP026
    - type: missing-source
      severity: minor
      topic: marketplace-logistics-scale
      missingEvidence: >-
        Official parcel counts, service-point counts, and country-by-country network metrics for Shopee Xpress and
        Lazada/LEX.
      whyItMatters: >-
        Platform-owned logistics clearly matter, but the chapter still compares them more by distribution power than by
        audited operational scale.
      diligencePath: >-
        Collect marketplace disclosures, regulator submissions, or local operating pages that quantify SPX and LEX
        network scale by country.
      relatedQuestionRefs:
        - QP019
        - QP020
