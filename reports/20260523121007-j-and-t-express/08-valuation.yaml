- id: thesis-versus-antithesis
  title: Thesis versus anti-thesis
  body: |-
    The constructive case starts with the fact pattern that public investors usually want but do not always get from a recently listed logistics name. J&T has moved beyond pure scale theater: FY2025 revenue reached US$12.158 billion, profit reached US$225.3 million, adjusted net profit reached US$425.4 million, and adjusted EBITDA reached US$1.049 billion. Southeast Asia remains the quality engine, with 34.4% market share and US$537.5 million of adjusted EBIT versus only US$93.9 million in China. Q1 2026 then showed that the story did not stall after year-end, as total parcels rose to 8.33 billion and non-China volume reached 35.1% of the mix. The SF cross-shareholding adds another supportive datapoint because a major Asian logistics operator was willing to buy into J&T's network at scale.

    The anti-thesis is equally concrete. Public sources do not describe a premium-price operator protected by customer captivity; they describe a courier that still depends heavily on platform traffic and still competes in markets where price can be weaponized. Rest of World quoted management saying growth depended primarily on e-commerce platforms and reported that Shopee removed most everyday Indonesian orders. ION described below-local pricing as a market-entry tool across the region. Meanwhile, J&T's own filings say China remained intensely competitive, and the governance record still points to concentrated founder voting control. That is why the right call is a price-sensitive buy, not a no-excuses quality multiple.
