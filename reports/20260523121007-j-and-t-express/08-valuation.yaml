- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Earnings proof
    - FY2025 established real profit and more than US$1 billion of adjusted EBITDA.
    - Logistics earnings can reverse quickly if price competition returns.
    - Show durable China yield and group cash-generation resilience through another pricing cycle.
  - - Geographic quality
    - Southeast Asia is now a visible profit engine with leading share.
    - China is still the largest revenue pool and the main compression channel.
    - Disclose country-level profit bridges so investors can see mix quality more clearly.
  - - Strategic validation
    - SF's cross-share investment signals industrial relevance and network value.
    - Strategic deals are negotiated and do not equal clean spot-market price discovery.
    - Publish synergy targets, completion milestones, and return hurdles for the SF relationship.
  - - Platform exposure
    - Scale and service breadth make J&T relevant to leading marketplaces and merchants.
    - The same dependence lets platforms reroute volume or squeeze price when incentives change.
    - Prove non-platform revenue and parcel mix are materially larger than the market fears.
  - - Governance
    - Dual-class control can support long-horizon network buildout.
    - Minority investors still have to underwrite founder control as a discount factor.
    - Show whether future issuance or governance changes will dilute or entrench control further.
  - - Public entry point
    - Current valuation already embeds heavy compression from private and IPO-era marks.
    - Historical compression alone does not guarantee upside if the business mix deteriorates.
    - Move more constructive only if public operating evidence keeps improving while the multiple stays modest.
  notes: 'The split is explicit: the company-quality thesis can be true while the anti-thesis still limits how much premium
    a public investor should pay.'
