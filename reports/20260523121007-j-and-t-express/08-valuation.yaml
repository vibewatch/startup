- id: TV006
  title: Final diligence asks and thesis-break table
  columns:
  - Topic
  - Missing evidence or trigger
  - Why it matters
  - Action implication
  - Diligence path or monitor
  rows:
  - - Top-platform concentration
    - Exact revenue and parcel mix by major marketplace or merchant
    - This is the clearest missing input behind the platform-discount question.
    - Do not underwrite the full bull case without it.
    - Request top-customer concentration tables and non-platform mix from management.
  - - China realized yield bridge
    - Parcel price, rebates, and cost bridge by product tier
    - China is the main downside transmission channel for the equity case.
    - If yields are weaker than implied, cut the base-case band.
    - Obtain quarter-by-quarter China pricing and EBIT bridge data under NDA.
  - - New Markets country economics
    - Country-level contribution margin, payback, and cash-use data
    - The bull case assumes these geographies add value rather than absorb capital.
    - Keep a launch-curve discount until country returns are visible.
    - Review country P&Ls and launch-curve dashboards for each New Markets geography.
  - - SF cross-share economics
    - Specific synergy targets, return hurdles, and governance terms
    - Strategic validation is positive, but valuation credit should be capped without hard economics.
    - Treat the deal as support rather than full re-rating evidence until the economics are explicit.
    - Read definitive deal documents and any follow-up implementation KPIs.
  - - 'Thesis-break trigger: China earnings'
    - Another meaningful drop in China adjusted EBIT or parcel-yield deterioration
    - Would show that the largest revenue pool still cannot earn through competition.
    - Move the stock out of Attractive and cut the range.
    - Track annual, interim, and quarterly EBIT commentary plus revenue-per-parcel disclosures.
  - - 'Thesis-break trigger: partner or regulatory shock'
    - A new large platform-insourcing event or formal regulatory escalation
    - Would weaken both demand visibility and the multiple investors are willing to pay.
    - Downgrade the recommendation immediately.
    - Monitor platform news flow, partner changes, and U.S. or local regulatory actions.
  notes: The first four rows are diligence asks and the last two are explicit kill triggers. Together they define what would
    either upgrade the buy case or invalidate it.
