- id: TV004
  title: Comparable valuation table
  columns:
  - Reference
  - Metric
  - Multiple / valuation / status
  - Relevance to J&T
  - Key limitation
  rows:
  - - J&T current public mark
    - Current market cap plus forward screens
    - ~US$9.8B market cap; ~0.81x trailing revenue; 2026E EV/EBITDA 7.05x
    - Cleanest current anchor for the entry decision.
    - Still only a snapshot of how the market prices a volatile logistics name today.
  - - SF Holding
    - Integrated logistics public comp
    - CNY173.06B market cap; CNY312.52B TTM revenue; 14.20 forward P/E
    - Closest large listed logistics-quality reference in Asia.
    - Broader integrated-logistics mix and stronger premium positioning than J&T.
  - - Sea Limited
    - Platform-adjacent public comp
    - US$53.45B market cap; 2.21x sales; 19.24x EV/EBITDA
    - Shows how Southeast Asian platform exposure can command higher public multiples.
    - Gaming and fintech make it an adjacency comp, not a parcel pure-play.
  - - Alibaba
    - Platform plus logistics adjacency
    - ~US$311.13B market cap; 2.08x sales; 11.17x EV/EBITDA
    - Useful for ecosystem and Cainiao-style logistics context.
    - Group valuation is dominated by commerce and cloud, not stand-alone courier economics.
  - - J&T 2023 IPO
    - Self-history valuation reference
    - About US$13B at planned IPO launch
    - Shows where public markets were willing to clear the stock at listing.
    - Came in a different market regime and before FY2025 profitability was visible.
  - - J&T 2021 private round
    - Self-history late-stage private mark
    - About US$20B with ~US$2.5B raised
    - Useful for judging how far the public market has already compressed expectations.
    - Private-round euphoria is not a reliable live public comp.
  notes: This is a benchmark table rather than a pure direct-comps multiple table. The best retained references mix direct
    logistics peers, adjacency comps, and J&T's own historical marks.
