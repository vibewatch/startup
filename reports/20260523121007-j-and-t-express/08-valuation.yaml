- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Core assumptions
  - Indicative equity-value range
  - Return logic
  - Probability signal
  - Key failure mode
  rows:
  - - Bear
    - China competition intensifies again, platform concentration stays high, and investors re-rate the stock toward the low
      end of logistics multiples.
    - US$7.5B to US$8.5B
    - Public downside is meaningful but not catastrophic because the company is already profitable and listed.
    - Visible if China EBIT weakens or another major platform removes daily volume.
    - Another pricing war turns profits into a low-quality, low-multiple earnings stream.
  - - Base
    - SEA leadership persists, China stays modestly profitable, New Markets keep improving, and the stock trades around 0.7x
      to 0.8x 2026 revenue or 7x to 8x forward EBITDA.
    - US$10.5B to US$12.0B
    - Enough upside for a constructive public-market recommendation without needing a heroic rerating.
    - Most consistent with current filings, current market multiples, and current consensus tone.
    - If China or platform risk proves structurally worse than the public record, the base case slips quickly.
  - - Bull
    - SEA growth remains strong, New Markets add profitable scale, the SF relationship proves strategically useful, and investors
      pay closer to target-price or IPO-era context.
    - US$13.0B to US$15.0B
    - Upside becomes meaningful because the current market cap starts from a compressed base.
    - Requires continued non-China mix shift and evidence that earnings quality is improving.
    - Bull-case math fails if new geographies consume capital without delivering durable contribution margins.
  notes: Ranges are public-market heuristics built from current market capitalization, historical compression, analyst target
    context, and forward-multiple screens. They are not a DCF.
