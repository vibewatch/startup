  evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set-coverage
    missingEvidence: A fuller direct-comp current multiple set for JD Logistics, ZTO, and other listed parcel operators that
      match J&T more tightly than platform-adjacent names.
    whyItMatters: The current comparable table is decision-useful but still mixes direct logistics peers with adjacency and
      self-history anchors, which widens the range around fair value.
    diligencePath: Pull current quote and multiple pages for JD Logistics, ZTO, and any remaining listed China parcel peers,
      then rebuild the direct-comparable subset.
    relatedQuestionRefs:
    - QV018
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: material
    topic: platform-concentration
    missingEvidence: A current revenue or parcel-volume split by top platforms, top merchants, and non-platform customers.
    whyItMatters: Without concentration disclosure, investors cannot quantify how much of the current valuation depends on
      a small set of e-commerce demand aggregators.
    diligencePath: Request top-customer and top-platform concentration tables from management or infer them from merchant
      billing and parcel-volume cohorts under NDA.
    relatedQuestionRefs:
    - QV030
  - type: private-evidence-only
    severity: blocking
    topic: china-yield-bridge
    missingEvidence: A bridge from reported China parcel volume to realized yield, rebates, and cost buckets by major product
      tier.
    whyItMatters: China is the biggest revenue pool and the main downside transmission channel, so the valuation cannot be
      underwritten tightly without knowing what actually sustains profitability there.
    diligencePath: Request country-level pricing, rebate, and adjusted-EBIT bridges for 2025 and the latest quarter, then
      test sensitivity to another round of industry price cuts.
    relatedQuestionRefs:
    - QV031
  - type: private-evidence-only
    severity: material
    topic: new-markets-country-economics
    missingEvidence: Country-by-country revenue, contribution margin, and payback data for Saudi Arabia, UAE, Mexico, Brazil,
      and Egypt.
    whyItMatters: The bull case assumes New Markets can add profitable growth rather than simply absorb more capital, but
      public disclosure only gives regional rollups.
    diligencePath: Obtain country P&Ls, outlet density, and launch-curve dashboards for each New Markets geography and compare
      them with management's hurdle rates.
    relatedQuestionRefs:
    - QV011
    - QV032
  - type: private-evidence-only
    severity: material
    topic: sf-synergy-economics
    missingEvidence: Specific synergy targets, return thresholds, governance terms, and completion mechanics for the SF cross-shareholding.
    whyItMatters: The transaction is strategically supportive, but without synergy economics investors cannot tell whether
      it is mostly signaling, financing, or genuinely accretive industrial logic.
    diligencePath: Review the definitive subscription agreement, investor-call materials, and any post-announcement implementation
      KPIs once available.
    relatedQuestionRefs:
    - QV033
  - type: stale
    severity: minor
    topic: future-control-evolution
    missingEvidence: A current post-June-2025 view of how future issuance, treasury-share use, or strategic placements could
      change voting control.
    whyItMatters: Today's control discount is observable, but the next valuation step also depends on whether governance concentration
      is hardening or diluting over time.
    diligencePath: Track updated shareholding filings, treasury-share movements, and any post-cross-shareholding governance
      amendments after the next annual report.
    relatedQuestionRefs:
    - QV034
