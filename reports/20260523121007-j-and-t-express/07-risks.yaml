- id: financial-execution
  title: Financial model and capital-intensity risk
  body: 'J&T no longer looks like a classic cash-burn story, but the public-company risk model is still capital intensive. Filings show that operating cash flow exceeded capex in 2025 and in the first half of 2025, which is the main reason the risk ranks below price-war and platform dependence rather than above them. Even so, the same filings show why the margin for error is not unlimited: the company kept adding automation and fleet capacity, ran more than 13,300 line-haul vehicles by year-end 2025, and continued expanding vehicles, sorting lines, outlets, and sorting centers in 2026. That is supportive when parcel density stays high, but it can become a drag if yields fall or new-market ramp assumptions slip.


    China remains the key financial transmission channel. Management described intense competition in H1 2025, revenue per parcel fell, and annual materials show China adjusted EBIT dropping to US$93.9 million in 2025 from US$147.2 million in 2024 even as parcel volume kept growing. New Markets improved materially and reached positive EBITDA in H1 2025, with later reporting saying adjusted EBIT turned positive in FY2025, but that does not yet eliminate launch-curve risk. The right investment read is that J&T now has enough cash generation to keep building, yet the equity story still depends on maintaining cost discipline and keeping scale investment ahead of — but not too far ahead of — monetization.'
