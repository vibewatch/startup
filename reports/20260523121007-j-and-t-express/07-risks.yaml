  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: platform-concentration
    missingEvidence: Top-platform and top-customer revenue, parcel, and margin concentration by country.
    whyItMatters: Without concentration data, partner-dependence risk is inferred from anecdotes instead of underwritten directly.
    diligencePath: Request channel-mix disclosure by country and a top-10 customer or platform concentration table from management.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR001
    - TR004
  - type: private-evidence-only
    severity: material
    topic: service-kpis
    missingEvidence: Audited on-time-delivery, failed-attempt, damage, loss, and complaint-resolution metrics by country.
    whyItMatters: Review-surface signal may overstate or understate true operating quality; investors need operating KPIs to calibrate it.
    diligencePath: Request monthly service dashboards, complaint-resolution SLAs, and quality trend data by market.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: data-localization
    missingEvidence: A data-flow map showing what personal or route data is stored where, which entities access it, and whether any U.S.-person transactions are in scope for DOJ rules.
    whyItMatters: The policy risk cannot be sized precisely without knowing whether J&T engages in covered data transactions involving U.S. persons.
    diligencePath: Request data-residency architecture, entity-level control maps, and counsel's view on DOJ Data Security Program applicability.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR002
  - type: conflicting-data
    severity: material
    topic: labor-status
    missingEvidence: Primary records on the current status of Philippine labor disputes, any open cases, and the scope of union coverage beyond the reported settlements.
    whyItMatters: The public record shows both conflict and later settlement, but not a complete multi-site labor-risk register.
    diligencePath: Request NCMB or DOLE case references, current union agreements by site, and management commentary on unresolved labor matters.
    relatedQuestionRefs:
    - QR007
    - QR008
    relatedTableRefs:
    - TR003
  - type: enumeration-incomplete
    severity: minor
    topic: risk-register-coverage
    missingEvidence: A management-owned enterprise-risk register covering all countries, legal entities, and insured vs uninsured risk categories.
    whyItMatters: The chapter can rank the highest-severity public risks, but it cannot claim exhaustive enterprise-risk coverage from public materials alone.
    diligencePath: Request board or audit-committee risk materials and country risk dashboards under NDA.
    relatedQuestionRefs:
    - QR001
    - QR025
    relatedTableRefs:
    - TR001
