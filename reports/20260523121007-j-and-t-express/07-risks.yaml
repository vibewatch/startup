- id: dependency-competition
  title: Platform dependence and competitive transmission risk
  body: 'J&T''s competitive risk is best understood as dependence on large demand aggregators rather than as simple rivalry with other couriers. Rest of World reported that management itself described growth as primarily reliant on e-commerce platforms including TikTok, Temu, Shein, and Shopee. That matters because a platform can behave as both customer and future competitor. The clearest visible example is Shopee''s move in Indonesia, where J&T said it lost most everyday orders while management argued that the revenue effect was limited because Shopee had already become a smaller customer there. Even if that reassurance is directionally true, the event demonstrates that volume can migrate in-house faster than public investors can model.


    ION''s regional reporting reinforces the same mechanism from the outside. Advisors and operators described a market where regional 3PLs entered new countries at below-local pricing to win platform volume, while local players struggled to match subsidies or scale. That makes J&T''s top-line resilience partly a function of how far platform ecosystems remain open to third-party couriers. The mitigating case is real: J&T has been adding non-platform customers, cross-border partners, and direct-brand contracts, and its multi-country footprint gives it some diversification. But without disclosed top-platform revenue concentration, investors still have to underwrite partner risk from public anecdotes rather than from a clean exposure table.'
