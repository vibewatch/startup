- id: regulatory-governance
  title: Regulatory, legal, and data-governance risk
  body: 'The cleanest way to frame J&T''s regulatory and governance exposure is to separate what is documented from what is alleged. On the documented side, the group''s public website legal stack is rooted in a China-based operator, governed by PRC law for website disputes, and its privacy policy says the site collects technical and usage data such as IP addresses, location, page history, and cookie-linked behavior. The same policy states that data may be shared with affiliates and disclosed to administrative or judicial authorities when legally required. That does not prove any misuse, but it does establish that J&T runs a cross-border digital surface with centralized governance language rather than a clearly localized, market-by-market data architecture.


    The external policy context has hardened. DOJ says its Data Security Program has been in force since April 8, 2025 and restricts certain transactions that could give countries of concern or covered persons access to Americans'' bulk sensitive personal data. Senator Cotton''s May 2026 letter explicitly named J&T among foreign carriers he wants DOJ to review. Investors should treat that letter as a request for investigation rather than as evidence of wrongdoing, but it still matters because policy scrutiny can raise diligence, partnership, and expansion friction before any formal case exists. The underwriting implication is governance overhang, not a proven compliance breach.'
  claimRefs:
  - CR030
  - CR031
  - CR032
  - CR033
  - CR034
  - CR035
  tableRefs:
  - TR002
- id: labor-service
  title: Labor relations, service quality, and operational reliability
  body: 'The operational-risk picture is mixed: J&T has visible complaint channels and even a stated one-hour callback process for critical complaints, but public adverse surfaces suggest those controls do not eliminate delivery friction or labor conflict. In the Philippines, CTUHR and The Manila Times reported strikes or threatened strikes tied to alleged unfair labor practices and collective-bargaining disputes. Those are not adjudicated findings, and the sourcing is labor-advocacy and news reporting rather than a court judgment. Still, they are too specific to ignore because they involve named unions, DOLE or NCMB mediation, and claimed disruption across a labor-intensive network.


    The fair balancing point is that later reporting also supports de-escalation. Pinoy Aksyon described a subsequently ratified CBA, pay and benefit improvements, and management acknowledgment of the settlement. That suggests the risk is not "permanent labor breakdown" but recurring labor-relations volatility in a business where riders, sortation workers, drivers, and outlet staff are operationally critical. Service-quality evidence should be handled with similar caution. Trustpilot and ComplaintsBoard are self-selected complaint surfaces, not audited SLAs, but both point to repeated recipient pain points around delayed delivery, failed attempts, missing parcels, COD disputes, and weak support responsiveness. For investors, the message is that execution risk remains customer-facing and labor-sensitive even after the company reached profitability.'
