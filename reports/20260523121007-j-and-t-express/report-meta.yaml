companyProfile:
  summary: >
    J&T Express is an Indonesia-founded express-logistics operator built around express delivery,
    cross-border logistics, and digital logistics tools for marketplaces, merchants, and consumers.
    Official materials place founding in 2015 and investor-relations copy narrows establishment to
    August 2015. Governance materials center Jet Jie Li as founder, CEO, and chairman, while some
    independent media also credit Tony Chen Mingyong in the origin story. The business has scaled
    from its Southeast Asia roots into a 13-country network spanning China, the Middle East, and
    Latin America, with merchant APIs, COD-adjacent workflows, outlet density, sorting automation,
    and cross-border service layers supporting the operating model. J&T is now a public company
    listed in Hong Kong as 1519.HK after a 2023 IPO at HK$12 per share, following a reported 2021
    private round of about US$2.5 billion at roughly a US$20 billion valuation. FY2025 established
    real public-market earnings and cash generation, but the underwriting case still sits inside
    China price competition, platform dependence, and founder-control risk.
  foundedDate: "2015-08-01"
  founders:
    - name: "Jet Jie Li"
      role: "Founder, CEO, chairman"
      background: "Former OPPO Indonesia and broader Asia expansion executive who remains J&T's central operating and control figure."
      claimRefs: [CO012, CO013]
    - name: "Tony Chen Mingyong"
      role: "Media-linked co-founder / origin-network figure"
      background: "Independent media reports credit him alongside Jet Jie Li in J&T's origin story, but official governance materials do not present him as current management."
      claimRefs: [CO019]
  foundingLocation: "Indonesia"
  headquarters: "Indonesia-founded; Hong Kong-listed parent with Shanghai-based global-site operator"
  productSummary: >
    J&T sells express-delivery and cross-border logistics services supported by digital logistics
    tools rather than a single courier app. Public surfaces show consumer send-and-track flows,
    merchant/VIP workflows, partner APIs for order and tracking integration, COD-adjacent merchant
    processes, and a heavily automated physical network of outlets, sorting centers, machines, and
    line-haul assets.
  customerFocus: >
    Marketplace ecosystems, SME sellers, larger merchants and brands, cross-border merchants, and
    end-recipients across Southeast Asia, China, and newer Middle East/Latin America corridors.
  businessModel: >
    Parcel-delivery fees are the core economic engine, with express delivery contributing about 97%
    of FY2025 revenue. J&T supplements this with cross-border logistics and digital/logistics tools,
    using marketplace integrations, merchant workflows, and flexible pricing or tiered discounts to
    drive parcel density while trying to expand non-platform volume.
  stage: "Public (HKEX: 1519)"
  fundingStatus: >
    Public company since the October 2023 Hong Kong IPO at HK$12 per share, which implied roughly
    US$13.5 billion of post-issue market capitalization. Before listing, independent reporting tied
    J&T's 2021 financing to roughly US$2.5 billion raised at about a US$20 billion valuation.
  disclosureProfile: public
  claimRefs: [CO001, CO005, CO006, CO012, CO013, CO019, CO021, CO024, CO026, CO029, CO031, CO032, CO033, CR031, CU001, CU018]

