evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founder-narrative
    missingEvidence: >-
      A definitive primary-source statement clarifying whether Tony Chen is a formal founder, co-founder, major
      shareholder only, or historical backer without founder status.
    whyItMatters: >-
      Founder attribution affects origin economics, relationship mapping, and interpretation of current control and
      related-party influence.
    diligencePath: >-
      Review fuller prospectus history and shareholder sections, then seek an explicit company clarification or
      investor-presentation language that resolves the founder label.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: investor-control
    missingEvidence: >-
      A current, primary-source breakdown of which non-founder pre-IPO investors still hold material stakes or
      governance rights after listing.
    whyItMatters: >-
      Economic ownership is visible only partially in reviewed sources, but board rights, observer rights, vetoes, and
      exit overhang influence control and valuation.
    diligencePath: >-
      Review the latest annual report substantial-shareholder note, shareholder filings, and any post-IPO lock-up or
      convertible-bond disclosures.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: predatory-pricing
    missingEvidence: >-
      A regulator or court record showing whether Indonesian pricing accusations resulted in a formal case, remedy, or
      closure.
    whyItMatters: >-
      The difference between accusation and official finding changes how much weight investors should put on adverse
      pricing behavior.
    diligencePath: >-
      Search Indonesian competition-regulator releases and court dockets for named J&T matters tied to pricing or
      courier platform conduct.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: us-regulatory-follow-up
    missingEvidence: >-
      A public DOJ or other U.S. agency statement confirming whether the Cotton letter led to an investigation, inquiry,
      or no action.
    whyItMatters: >-
      Political pressure alone is lower-signal than an actual investigation, but a formal probe would materially affect
      risk framing and valuation.
    diligencePath: >-
      Check DOJ, DHS, CBP, and congressional follow-up releases after 2026-05-21 and review any company response in
      later disclosures.
    relatedQuestionRefs:
      - QO026
  - type: missing-source
    severity: minor
    topic: headcount-gap
    missingEvidence: >-
      A conventional employee headcount directly disclosed by J&T in a primary source and clearly distinguished from
      service personnel or partner workforce.
    whyItMatters: >-
      Workforce scale is a standard company-overview metric, but the current evidence mixes employees, service
      personnel, and partner-linked labor.
    diligencePath: >-
      Review the annual report notes on employees, sustainability or ESG staffing tables, and any investor-presentation
      headcount disclosures.
    relatedQuestionRefs:
      - QO027
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: sea-ecommerce-gmv
    missingEvidence: >-
      Publisher-level methodology that reconciles the e-Conomy SEA US$159 billion 2024 e-commerce GMV lens with the
      Frost & Sullivan / J&T US$238.25 billion 2024 retail-transaction lens.
    whyItMatters: >-
      The market-size story moves materially depending on whether the analyst is measuring GMV, broader retail
      transaction value, or another retail definition.
    diligencePath: >-
      Obtain the full e-Conomy SEA and Frost & Sullivan methodology notes or workbook and normalize both figures to the
      same definition.
    relatedQuestionRefs:
      - QM005
      - QM012
  - type: missing-source
    severity: material
    topic: sea-country-share-data
    missingEvidence: >-
      Country-level parcel volumes and market-share tables for Indonesia, Malaysia, Singapore, Thailand, Vietnam, and
      the Philippines from local industry sources.
    whyItMatters: Regional leadership can hide weak national positions, and country mix affects both pricing power and capex needs.
    diligencePath: >-
      Acquire the full Parcel Monitor / Parcel Perform report, national postal statistics, or local-operator disclosures
      for each major Southeast Asian market.
    relatedQuestionRefs:
      - QM026
  - type: private-evidence-only
    severity: material
    topic: platform-concentration
    missingEvidence: >-
      Top-platform or top-customer concentration data that shows what proportion of J&T parcel volume or revenue comes
      from Shopee, TikTok, Temu, Shein, Lazada, or other large channels.
    whyItMatters: >-
      Platform insourcing risk is hard to size without concentration data, and bargaining power can move faster than
      parcel growth.
    diligencePath: >-
      Request management disclosure on top-10 customers by parcel volume and revenue, plus any minimum-volume or rebate
      arrangements.
    relatedQuestionRefs:
      - QM027
  - type: private-evidence-only
    severity: material
    topic: cross-border-mix
    missingEvidence: >-
      A public split of J&T parcel and revenue mix between domestic and cross-border flows inside Southeast Asia and
      inside New Markets.
    whyItMatters: >-
      Cross-border parcels may carry different margins, service levels, customs friction, and durability than domestic
      platform traffic.
    diligencePath: >-
      Request lane-level or segment-level management reporting that separates domestic, cross-border, and returns
      volumes by geography.
    relatedQuestionRefs:
      - QM028
  - type: access-blocked
    severity: minor
    topic: delivery-performance-benchmarks
    missingEvidence: >-
      The full set of country-level transit-time, success-rate, and failure-rate metrics that Parcel Perform references
      but does not disclose on its public teaser page.
    whyItMatters: >-
      Buyer switching often depends on country-specific service quality, especially in fragmented archipelagic markets
      where generic regional averages are misleading.
    diligencePath: >-
      Access the full Parcel Perform report or merchant dashboards, then compare J&T service metrics against local
      incumbents by country.
    relatedQuestionRefs:
      - QM029
  - type: access-blocked
    severity: material
    topic: official-rate-cards
    missingEvidence: >-
      Official public rate cards or merchant contract terms for Shopee Xpress, LEX/Cainiao, Lalamove, and SF in the
      reviewed local source pack.
    whyItMatters: >-
      Without official tariffs or contract structures, the chapter can compare pricing posture only through contextual
      examples rather than fully normalized list pricing.
    diligencePath: >-
      Recover official merchant rate cards or contract templates by market, especially for marketplace-owned logistics
      and same-day providers.
    relatedQuestionRefs:
      - QP019
  - type: private-evidence-only
    severity: material
    topic: platform-concentration
    missingEvidence: A public breakdown of J&T parcel volume or revenue by platform, including Shopee, Lazada, TikTok, Temu, and SHEIN.
    whyItMatters: >-
      The real moat question is how much demand J&T controls versus merely services, and that cannot be sized cleanly
      without concentration data.
    diligencePath: >-
      Request management disclosure on top platforms by parcel volume, revenue, rebate structure, and share of
      non-platform volume.
    relatedQuestionRefs:
      - QP020
  - type: enumeration-incomplete
    severity: material
    topic: china-incumbent-completeness
    missingEvidence: Usable official fetches for ZTO, STO, and Yunda comparable to the SF and YTO materials retained in this chapter.
    whyItMatters: >-
      The China-incumbent map is directionally useful but not exhaustive; missing major official comparables can distort
      how crowded the China battlefield really is.
    diligencePath: >-
      Refresh the broken competitor fetches and add official IR or annual-report evidence for ZTO, STO, and Yunda before
      treating the China profile table as comprehensive.
    relatedQuestionRefs:
      - QP021
  - type: missing-source
    severity: material
    topic: service-level-benchmarks
    missingEvidence: >-
      Audited or operator-reported apples-to-apples SLA, damage-rate, and return-rate metrics across J&T, Ninja Van,
      Flash, platform-owned logistics, and China incumbents.
    whyItMatters: Comparison-blog metrics are directionally useful but too weak for underwriting service superiority by market.
    diligencePath: Obtain merchant dashboards, carrier scorecards, or audited marketplace SLA data by country and lane.
    relatedQuestionRefs:
      - QP026
  - type: missing-source
    severity: minor
    topic: marketplace-logistics-scale
    missingEvidence: >-
      Official parcel counts, service-point counts, and country-by-country network metrics for Shopee Xpress and
      Lazada/LEX.
    whyItMatters: >-
      Platform-owned logistics clearly matter, but the chapter still compares them more by distribution power than by
      audited operational scale.
    diligencePath: >-
      Collect marketplace disclosures, regulator submissions, or local operating pages that quantify SPX and LEX network
      scale by country.
    relatedQuestionRefs:
      - QP019
      - QP020
  - type: private-evidence-only
    severity: material
    topic: cac-payback
    missingEvidence: Customer-acquisition cost, sales productivity, and payback by geography, platform, and non-platform cohort.
    whyItMatters: >-
      The chapter can show growth and parcel density proxies, but it cannot underwrite true sales efficiency without CAC
      and payback disclosure.
    diligencePath: >-
      Request cohort-level CAC, sales headcount productivity, merchant activation funnel, and payback by SEA, China, and
      New Markets.
    relatedQuestionRefs:
      - QI009
      - QI026
  - type: missing-source
    severity: material
    topic: realized-pricing-and-rebates
    missingEvidence: Realized price per parcel, rebate schedules, and top-platform discount ladders by market.
    whyItMatters: >-
      List pricing is not the economic truth for a courier facing marketplace bargaining power; realized pricing
      determines whether scale gains are durable.
    diligencePath: >-
      Obtain merchant contracts or rate cards showing base price, volume discounts, rebate true-ups, and lane-level
      exceptions.
    relatedQuestionRefs:
      - QI008
      - QI026
  - type: access-blocked
    severity: material
    topic: syndicated-loan-terms
    missingEvidence: >-
      Full covenant, collateral, and interest-spread package for the syndicated borrowings replacing the older US$1.25
      billion facility.
    whyItMatters: >-
      Public decks identify maturities, but not the triggers that would matter if China pricing or platform
      concentration weakened cash flow.
    diligencePath: Pull the full loan agreement or lender presentation and test covenants under downside volume and margin scenarios.
    relatedQuestionRefs:
      - QI021
    relatedTableRefs:
      - TI005
  - type: missing-source
    severity: material
    topic: platform-concentration
    missingEvidence: >-
      Revenue, parcel, and rebate concentration by top platforms such as Shopee, Temu, SHEIN, Lazada, and TikTok-linked
      sellers.
    whyItMatters: >-
      Platform concentration is the cleanest way to judge how much of current revenue quality depends on counterparties
      that can in-source logistics.
    diligencePath: >-
      Ask for top-10 customer concentration by revenue and parcel volume, with separate disclosure for marketplace
      affiliates and non-platform merchants.
    relatedQuestionRefs:
      - QI010
      - QI025
  - type: missing-source
    severity: minor
    topic: maintenance-vs-growth-capex
    missingEvidence: Split between maintenance capex and growth capex, plus country-level capital commitments.
    whyItMatters: >-
      Positive operating cash flow is encouraging, but runway analysis is still cleaner when maintenance requirements
      are separated from expansion spend.
    diligencePath: >-
      Request maintenance versus growth capex split, expected automation roll-out by market, and committed spend by
      facility and fleet class.
    relatedQuestionRefs:
      - QI017
      - QI020
    relatedTableRefs:
      - TI005
  - type: missing-source
    severity: material
    topic: security-assurance-artifacts
    missingEvidence: >-
      A public status page, uptime history, security whitepaper, SOC-style attestation, ISO certification, or other
      external assurance artifact for J&T's digital and support surfaces.
    whyItMatters: >-
      Without external assurance, the chapter can only describe legal/privacy posture and public workflow promises, not
      whether the product stack is operated to unusually strong security or reliability standards.
    diligencePath: >-
      Ask management for customer-facing SLA documents, security-certification evidence, incident-response commitments,
      and any public or private uptime reporting used for large merchants.
    relatedQuestionRefs:
      - QE022
      - QE027
  - type: private-evidence-only
    severity: material
    topic: service-quality-kpis
    missingEvidence: >-
      Country-level on-time delivery rates, lost-or-damaged parcel rates, first-response times, resolution times, app
      usage, and CSAT/NPS for self-serve support surfaces.
    whyItMatters: >-
      The physical network may be strong while the customer experience is uneven; without KPI disclosure it is hard to
      judge whether fragmented digital surfaces are merely cosmetic or operationally important.
    diligencePath: >-
      Request internal service dashboards by country, monthly complaint rates, app adoption metrics, and
      parcel-exception statistics for consumer versus merchant workflows.
    relatedQuestionRefs:
      - QE023
      - QE027
  - type: private-evidence-only
    severity: material
    topic: api-governance-and-usage
