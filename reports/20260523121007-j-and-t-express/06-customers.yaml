  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-metrics
      missingEvidence: Cohort retention, NRR, GRR, logo churn, renewal cadence, and contract-length data by platform, merchant, and country segment.
      whyItMatters: Without these metrics, public merchant-tooling and complaint signals cannot be translated into customer durability or gross-profit resilience.
      diligencePath: Request customer-cohort dashboards, renewal files, and contract-term distributions segmented by marketplace, SME, enterprise, and geography.
      relatedQuestionRefs:
        - QU016
        - QU025
    - type: private-evidence-only
      severity: material
      topic: concentration-disclosure
      missingEvidence: Top-customer and top-platform exposure by parcel volume, revenue, gross profit, and country, including dependence on TikTok Shop, Shopee, Temu, SHEIN, Noon, or Salla-linked flows.
      whyItMatters: Concentration determines how damaging platform internalization or allocation changes could be to J&T's customer economics.
      diligencePath: Request a top-10 customer waterfall and platform exposure bridge from management, then test it against country-level parcel mix and pricing data.
      relatedQuestionRefs:
        - QU017
      relatedTableRefs:
        - TU005
    - type: enumeration-incomplete
      severity: material
      topic: named customer proof table coverage
      missingEvidence: A fuller roster of named merchants, platforms, or enterprise shippers with clear production status, spend, and deployment depth outside TikTok Shop.
      whyItMatters: The current named proof set may over-index to marketing-friendly platform references and understate either diversification or customer concentration.
      diligencePath: Request named-reference lists, live-account examples, and customer case studies broken out by geography and customer type.
      relatedQuestionRefs:
        - QU020
      relatedTableRefs:
        - TU003
