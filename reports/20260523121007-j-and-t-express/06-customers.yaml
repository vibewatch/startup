figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: J&T's visible customer journey runs from marketplace or merchant acquisition into order ingestion, tracked fulfillment, support, and repeat workflow embedding.
    data:
      nodes:
        - id: discover
          label: Marketplace or merchant discovery
          description: Platforms, sellers, or business shippers encounter J&T through official marketplace partnerships, merchant pages, or shipping-content surfaces.
        - id: onboard
          label: Merchant onboarding
          description: The customer sets up VIP, shipping-account, or partner workflows and learns pickup, EWB, payment, and pricing rules.
        - id: integrate
          label: Order and data integration
          description: Higher-value customers connect API, tracking, COD, or ERP-reconciliation workflows so shipping becomes part of operations.
        - id: deliver
          label: Parcel fulfillment and tracking
          description: J&T's physical network handles collection, routing, delivery, and recipient-facing status updates.
        - id: support
          label: Service recovery and complaints
          description: FAQ, complaint centre, app tracking, hotline, or sales-support surfaces are used when delivery needs escalation.
        - id: expand
          label: Repeat shipping and expansion
          description: If the workflow works, merchants repeat volume, add COD or system integrations, and may deepen platform-linked shipping demand.
    approximationNotes: The stages are synthesized from retained merchant, platform, FAQ, and review sources rather than from a disclosed internal funnel dashboard.
    claimRefs:
      - CU002
      - CU007
      - CU009
      - CU010
      - CU017
      - CU021
      - CU026
      - CU034
  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: wide
    summary: Public evidence suggests J&T customer adoption moves from platform or merchant acquisition into repeat shipping only when operational and support workflows hold up.
    data:
      nodes:
        - id: f1
          label: Platform or merchant demand appears
          type: input
          detail: TikTok Shop, Salla, marketplace traffic, or direct merchant outreach creates the initial logistics opportunity.
        - id: f2
          label: Account / service onboarding
          type: process
          detail: Merchant learns pricing, payment, VIP, pickup, or B2B transport options and begins shipping through J&T surfaces.
        - id: f3
          label: Tracking and API workflows attach
          type: process
          detail: More sophisticated customers add app tracking, API order flow, EWB, COD, and ERP reconciliation.
        - id: f4
          label: Recipient delivery experience occurs
          type: process
          detail: Speed, failed attempts, communication quality, and support responsiveness become visible to the end user.
        - id: f5
          label: Repeat shipping or churn pressure
          type: process
          detail: Good service supports repeat merchant use; poor service creates complaints and platform-risk pressure.
        - id: f6
          label: Expansion or concentration outcome
          type: output
          detail: J&T either deepens merchant and platform ties or faces allocation risk, internalization, and concentration pressure.
      edges:
        - from: f1
          to: f2
          label: acquires
        - from: f2
          to: f3
          label: operationalizes
        - from: f3
          to: f4
          label: ships
        - from: f4
          to: f5
          label: determines
        - from: f5
          to: f6
          label: compounds into
    approximationNotes: The flow is qualitative and designed to show how merchant tooling, delivery quality, and platform dependence interact; it is not a disclosed numeric conversion funnel.
    claimRefs:
