    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Representative proof
      - Primary job-to-be-done
      - Strategic value
      - Key gap
    rows:
      - - Marketplace platforms
        - Platform or partner team influences routing; merchants and recipients use; platform and/or merchant economics pay indirectly
        - TikTok Shop SG case study, PH TikTok campaign, LEAP platform list
        - Convert marketplace demand into fast tracked delivery at scale
        - High parcel-volume driver and customer-acquisition engine
        - No disclosed parcel-share, pricing, or renewal by platform
      - - SME social-commerce sellers
        - Seller buys or operates account; seller and staff use; seller pays
        - Malaysia e-commerce page, MY FAQ VIP tools, PH COD expansion
        - Simple shipping, payment support, pickup, EWB, and COD-friendly cash flow
        - Large recurring long-tail merchant base if workflows stick
        - No disclosed merchant count or seller cohort retention
      - - Larger retail / enterprise shippers
        - Business logistics manager buys; operations staff use; company pays
        - Singapore B2B transportation release
        - Broader delivery-option coverage for shifting retail needs
        - Moves J&T beyond pure parcel storefront traffic
        - Public proof is generic and not tied to named enterprise spend
      - - Cross-border merchants
        - Merchant or marketplace partner buys; merchant ops teams use; merchant/platform pays
        - Salla cooperation agreement plus Middle East platform mentions
        - Cross-border delivery and after-sales logistics support into Saudi Arabia
        - Extends customer mix beyond domestic SEA corridors
        - Production scale by corridor is not disclosed
      - - ERP-integrated merchants
        - Finance and operations teams buy; merchant staff use; merchant pays
        - OnePacific NetSuite integration plus J&T API docs
        - Push COD settlements, tracking, shipping cost, and fulfillment data into systems of record
        - Highest workflow stickiness in the visible proof set
        - Named merchant deployments are not disclosed
      - - End-recipients
        - Usually do not choose carrier; recipients use tracking and support; merchant/platform effectively pays
        - Trustpilot PH, ComplaintsBoard, SG contact page
        - Receive parcel, track shipment, escalate failed or delayed delivery
        - Strong determinant of marketplace trust and repeat purchase behavior
        - Satisfaction signal is materially weaker than merchant-facing marketing
    notes: Segments synthesize the retained 2025-2026 source set and separate economic buyer, workflow user, and service recipient rather than forcing one monolithic customer definition.
