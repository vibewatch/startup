  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Expansion driver or risk
      - Current public reading
      - Potential impact
      - Diligence path
    rows:
      - - TikTok Shop and broader marketplace relationships
        - Clearly positive for customer acquisition, especially in SG and PH, but economics are undisclosed
        - Can drive meaningful parcel volume, yet can also create bargaining-power asymmetry if platform allocation changes
        - Request parcel share, GMV-linked share, and gross margin by top marketplace partner
      - - Merchant workflow integration
        - API, EWB, payment, COD, and NetSuite-style reconciliation suggest repeat operational embedding
        - Can improve merchant retention and raise switching cost for active sellers
        - Request active API merchants, VIP merchant count, and merchant cohort retention
      - - COD expansion to MSMEs
        - Broadens J&T's value proposition for cash-flow-sensitive sellers and walk-in users
        - Could deepen SME penetration where COD remains important
        - Request COD penetration, COD parcel loss rates, and COD-related dispute metrics
      - - Shopee internalization in Indonesia
        - Independent coverage shows Shopee building in-house logistics and steering sellers toward it
        - Direct disintermediation risk against third-party couriers like J&T
        - Request marketplace exposure by country and contingency plans if key platforms internalize more delivery
      - - Top-customer / top-platform concentration
        - Not publicly disclosed in retained sources
        - A few large platforms or merchants could account for outsized parcel flow and pricing power
        - Request top-10 customer share by parcel volume, revenue, and gross profit
      - - Recipient service-quality risk
        - Trustpilot and ComplaintsBoard show meaningful adverse sentiment around delays, failed attempts, and communication
        - Poor recipient experience can damage seller loyalty and marketplace relationships even if platform partnerships stay live
        - Request complaint trend, failed-delivery rates, refund / redelivery cost, and marketplace scorecards
    notes: The table separates visible expansion levers from under-disclosed concentration and quality risks; the biggest diligence need is exposure data, not more branding evidence.
    claimRefs:
