  - id: SU003
    title: Durability is visible through workflow embedding and support surfaces, but public service-quality signal is mixed
    body: |
      J&T does show several durability proxies. Malaysia's merchant pages and FAQ describe repeat-use seller workflows such as centralized management, payment support, bulk ordering, invoice search, EWB, pickup, and cheaper VIP pricing. The developer documentation adds a structured onboarding sequence from agreement to test API to production, while the OnePacific page shows why merchants integrating COD settlements, tracking, shipping cost data, and fulfillment reconciliation into ERP processes may be reluctant to swap carriers casually. Those are all credible stickiness signals even though no formal retention metric is disclosed.

      The problem is that retention has to be judged through noisy proxies rather than hard cohorts. Trustpilot's archived jtexpress.ph page carries a 1.2/5 rating from 134 reviews, with complaints centering on delays, failed delivery claims, wrong locations, and poor communication. ComplaintsBoard adds more examples of manipulated delivery status and no-show behavior. Official complaint and contact pages in Malaysia and Singapore show that J&T has real issue-resolution infrastructure, but they do not prove fast resolution or strong satisfaction. The result is a mixed durability picture: merchant workflow embedding may be real, yet end-recipient pain can still erode marketplace and seller trust.
