company:
  name: J&T Express
chapter:
  number: 6
  title: Customers
  summary: |
    J&T Express's customer proof is strongest where marketplaces and merchants intersect: Singapore and Philippines materials show explicit TikTok Shop logistics relationships, Malaysia surfaces merchant workflow tooling, and Middle East releases show platform-partner expansion into Salla, Temu, SHEIN, Noon, and TikTok-linked trade lanes. The practical customer stack is multi-sided: marketplaces and larger merchants drive parcel volume, SME sellers operate accounts and merchant tools, and end-recipients experience delivery quality through tracking, COD, support, and complaints.

    The underwriting caution is durability rather than top-of-funnel access. Public sources show merchant integrations, COD expansion, complaint infrastructure, and broad network scale, but they do not disclose NRR, contract length, renewal, or top-customer concentration. Independent coverage and review surfaces also show real disintermediation and service-quality risk: Shopee has internalized more logistics in Indonesia, while Trustpilot and ComplaintsBoard show meaningful end-recipient dissatisfaction.
sections:
  - id: SU001
    title: Customer structure is multi-sided, with platforms and merchants paying while recipients judge service quality
    body: |
      J&T should not be read as having a single customer type. The retained 2025-2026 source set shows at least five economically distinct groups: marketplace platforms that route or influence parcel demand at scale, SME social-commerce sellers that need simple order intake and cash-flow support, larger retail and enterprise shippers that need broader B2B transportation options, cross-border merchants entering corridors such as Saudi Arabia, and end-recipients who may not choose the carrier directly but still determine satisfaction and repeat marketplace behavior. The strongest official merchant evidence comes from Singapore and Malaysia, where J&T explicitly markets logistics solutions to both businesses and consumers, while also advertising seller/merchant management, centralized payment, EWB, pickup, and other repeat-usage workflows.

      That split matters for diligence because buyer, user, and payer are not always the same. A marketplace may negotiate or influence the logistics relationship, merchants operate the shipping tools and bear service consequences, and recipients are the ones who actually feel delivery speed, failed attempts, or customer-service friction. J&T's customer chapter is therefore less about one clean enterprise-logo roster and more about how a dense operational network plugs into platform demand, merchant tooling, and recipient experience at the same time.
