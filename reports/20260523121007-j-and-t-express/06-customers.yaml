  - id: SU004
    title: Adoption and expansion are best measured through platform cooperation and merchant-surface growth rather than customer-count disclosure
    body: |
      Public customer-adoption evidence is strongest in milestones and operating proxies rather than in disclosed account counts. The Singapore resources hub was still active in May 2026 with fresh e-commerce shipping content, which suggests J&T continues to invest in merchant education and demand capture rather than treating the channel as mature. In the Philippines, COD was expanded beyond existing use cases to walk-in and door-to-door pickup customers, explicitly pitched toward micro, small, and medium enterprises. In Saudi Arabia, the LEAP release tied J&T to Salla and to several major e-commerce platforms, indicating that cross-border merchant and marketplace expansion remains part of the customer story outside Southeast Asia.

      Broader company disclosures support this adoption narrative indirectly. The Q1 2026 operating statement and deck show very large parcel volumes, non-China mix expansion, and dense physical-network assets. A separate Q1 2026 PRNewswire release attributes Southeast Asia growth partly to deeper cooperation with major e-commerce platforms. None of that gives an investor a neat customer-count bridge by segment, but it does show that J&T's customer base is still being shaped by platform connectivity, corridor expansion, and merchant tooling rather than by a purely walk-in parcel model.
