summary:
  headline: |
    J&T Express 是有规模、已盈利的港交所上市快递运营商，当前交易价格低于此前私募和 IPO 时代参考点；估值支撑买入，但中国定价、平台集中度和治理风险让风险评级维持高位，信心只能给到中等。
