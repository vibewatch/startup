      - number: '5.5'
        title: Trust, privacy, and quality controls are publicly generic
        blocks:
          - type: paragraph
            body: >-
              J&T does publish trust-relevant materials, but they are closer to baseline legal compliance than to
              differentiated technical assurance. The privacy policy says the website collects extensive device and
              usage data including IP region, operating system, network provider, screen resolution, cookie support,
              search terms, visit duration, and visited pages. The terms page makes website use contractual, says the
              site is owned and managed by J&T, and tells minors under 18 to review with a guardian. These are real
              control surfaces, and they show the company has a legal and data-handling posture rather than ignoring
              privacy altogether.


              The limitation is what is not surfaced. The fetched pack does not expose a status page, public
              service-quality dashboard, SOC-style security artifact, or open developer-access policy with clear rate
              limits and auth detail. The most visible privacy artifact is dated 2021-10-15, and the merchant API
              remains relationship-gated instead of transparently self-serve. Combined with the fragmented regional
              surfaces, that supports a mixed verdict: J&T likely has enough operational process to run logistics at
              scale, but its externally visible trust and product-quality controls look generic rather than unusually
              strong.
