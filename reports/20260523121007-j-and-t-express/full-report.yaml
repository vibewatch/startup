      - number: '1.2'
        title: Founder-led governance and senior leadership
        blocks:
          - type: paragraph
            body: >
              The official governance record centers J&T on Jet Jie Li. Corporate-governance materials identify him as
              founder, executive director, chief executive officer, and chairman, and describe a background built in
              OPPO's Indonesia and broader Asian expansion. That founder-market fit matters because J&T's early
              operating logic depended on local channel-building, fast execution, and cross-border replication rather
              than a single-country asset base. The rest of the disclosed senior team is thinner but still relevant:
              Steven Suzhou Fan is executive president, Charles Junyi Hou is vice president, and Dylan Say Keong Tey has
              served as CFO since August 2021. As of the Q1 2026 operating statement, the board comprised one executive
              director, three non-executive directors, and three independent non-executive directors. A complicating
              point is founder attribution: official materials use singular founder language for Jet Jie Li, while
              several independent media reports also credit Tony Chen Mingyong. That ambiguity does not change current
              operating control, but it does matter for understanding origin economics, relationships, and influence.
            claimRefs:
