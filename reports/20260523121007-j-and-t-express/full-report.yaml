  - id: TV005
    title: Valuation context table
    columns:
      - Signal
      - Current value or reference
      - Why it matters
      - Main caveat
    rows:
      - - Current public value
        - ~US$9.8B / HK$76.64B market cap
        - Sets the actual entry point for investors today.
        - Market cap can move quickly with logistics sentiment and China competition headlines.
      - - Latest close
        - HK$8.64 on 2026-05-22
        - Confirms the current trading reference behind upside calculations.
        - Single-day close does not capture full volatility range.
      - - Analyst consensus
        - US$1.682 average target; +52.54% vs last close
        - Shows that the sell side still sees material upside from current levels.
        - Consensus is estimate-based, not company guidance or guaranteed return.
      - - Forward screen
        - 0.65x cap/revenue; 0.62x EV/revenue; 7.05x EV/EBITDA; 18.9x P/E
        - Frames J&T as modestly valued on public-market heuristics.
        - All forward figures depend on analyst models and changing assumptions.
      - - Strategic subscription price
        - HK$10.10 in SF transaction
        - Suggests an industrial counterparty was willing to underwrite J&T above the latest close.
        - Negotiated strategic subscriptions are not the same as open-market clearing prices.
      - - Control structure
        - 55.07% voting rights for the founder family on 10.92% economic ownership
        - Justifies keeping a governance discount in the valuation stance.
        - Voting snapshot is from mid-2025 and could change with future issuance.
    notes: >-
      The context table mixes market prices, analyst estimates, negotiated strategic terms, and governance facts because
      all of them influence how much public investors should pay.
