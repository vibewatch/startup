      - number: '8.4'
        title: Scenario ranges and what moves them
        blocks:
          - type: paragraph
            body: >-
              The valuation work should stay heuristic, not pretend to a false-precision DCF. The bear, base, and bull
              cases here are driven by the few public variables that actually matter: whether China stays at least
              modestly profitable, whether Southeast Asia keeps compounding share and density, whether New Markets keep
              moving toward positive economics, and whether the market keeps treating J&T like a sub-1x-sales logistics
              name or begins to pay more for the earnings trajectory. The bear case of roughly US$7.5 billion to US$8.5
              billion assumes another round of China pricing damage, renewed concern over platform concentration, and a
              re-rating toward about 0.5x to 0.55x 2026 revenue or about 6x forward EBITDA. That is not a collapse
              scenario; it is simply what happens if the anti-thesis starts winning.


              The base case of roughly US$10.5 billion to US$12.0 billion assumes the current facts broadly hold:
              Southeast Asia remains the best profit pool, China remains competitive but positive, and investors
              continue paying around 0.7x to 0.8x 2026 revenue or 7x to 8x forward EBITDA. The bull case of roughly
              US$13.0 billion to US$15.0 billion requires more than volume growth. It needs further evidence that new
              geographies can earn their cost of capital, that the SF relationship is strategically useful, and that
              public investors become more willing to look through China pricing toward group-level cash generation.
              That range is why the recommendation can be constructive without pretending the stock is low-risk.
            claimRefs:
