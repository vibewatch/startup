        title: Named customer proof is real, but confidence differs sharply between TikTok and the rest of the platform set
        blocks:
          - type: paragraph
            body: >
              The clearest named customer proof in this run is TikTok Shop. J&T Singapore's case-study page calls J&T
              the official logistics partner to TikTok Shop and includes seller-style testimonial language about
              receiving positive customer feedback on delivery. The Philippines evidence is also concrete: Manila Times
              and MegaBites both describe a TikTok Shop collaboration, a nationwide shipping voucher, app-based
              tracking, and a co-branded campaign around speedy delivery. Those pages together are enough to support a
              real platform relationship, even if they still do not disclose parcel share, commercial terms, or renewal
              history.


              Beyond TikTok, the evidence base becomes softer. J&T's LEAP release in Saudi Arabia names Salla, Temu,
              Noon, SHEIN, and TikTok as cooperation or partnership counterparts, and Rest of World independently
              situates J&T inside the Chinese e-commerce wave that powered Shein, TikTok, Temu, and Shopee fulfillment
              across Southeast Asia. Those references are important, but they are not all equal: Salla is described
              through an explicit agreement, while the others are mostly ecosystem mentions. Merchant-side tooling
              evidence in Malaysia, the API documentation, and the OnePacific NetSuite integration page strengthen the
              case that real merchants run repeat workflows through J&T, but they still stop short of giving a clean
              disclosed customer roster by spend.
