  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk verdict
        blocks:
          - type: paragraph
            body: >-
              J&T's risk stack is not dominated by a single existential defect, but by a cluster of scale-business
              exposures that could compress public-equity upside faster than they impair operational continuity. The
              first-order risk is still price-war and margin pressure. Official 2025 and interim disclosures show that
              China remained profitable but faced intense competition, while revenue per parcel in the first half of
              2025 fell year on year. Independent reporting adds the missing transmission mechanism: regional last-mile
              players have been willing to price below local incumbents to win e-commerce volume, and platform operators
              are increasingly willing to internalize logistics when scale justifies it. That combination can keep
              parcels growing while capping economic upside.


              The second-order issue is dependency. J&T itself told Rest of World that its growth has relied primarily
              on e-commerce platforms, even as it tries to diversify into direct-brand and non-platform work. Labor and
              service-quality risk ranks next because publicly visible complaint and union-conflict surfaces show that
              scale does not guarantee smooth execution. Privacy, data-governance, and geopolitical scrutiny are real
              but should be framed carefully: the current U.S. evidence is a policy-risk setup and an investigation
              request, not a finding against J&T. Execution and capital-intensity risk sit behind all of this because
              the company is still funding vehicles, automation, hubs, and new-market rollout at public-company scale.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR010
              - CR013
