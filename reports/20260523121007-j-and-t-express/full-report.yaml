companyProfile:
  summary: >
    J&T Express is an Indonesia-founded express-logistics operator built around express delivery, cross-border
    logistics, and digital logistics tools for marketplaces, merchants, and consumers. Official materials place founding
    in 2015 and investor-relations copy narrows establishment to August 2015. Governance materials center Jet Jie Li as
    founder, CEO, and chairman, while some independent media also credit Tony Chen Mingyong in the origin story. The
    business has scaled from its Southeast Asia roots into a 13-country network spanning China, the Middle East, and
    Latin America, with merchant APIs, COD-adjacent workflows, outlet density, sorting automation, and cross-border
    service layers supporting the operating model. J&T is now a public company listed in Hong Kong as 1519.HK after a
    2023 IPO at HK$12 per share, following a reported 2021 private round of about US$2.5 billion at roughly a US$20
    billion valuation. FY2025 established real public-market earnings and cash generation, but the underwriting case
    still sits inside China price competition, platform dependence, and founder-control risk.
