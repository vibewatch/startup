      - number: '2.2'
        title: 'Sizing lenses: digital demand, parcel markets, and J&T share'
        blocks:
          - type: paragraph
            body: >-
              The broadest demand lens is Southeast Asia digital commerce. Temasek and Bain say the region's digital
              economy reached US$263 billion of GMV in 2024, with US$89 billion of revenue and US$11 billion of profit.
              Within that, the same program pegs e-commerce GMV at roughly US$159 billion and says video commerce
              already represents 20% of e-commerce GMV. McKinsey's older but still useful structural work shows why
              parcel demand accelerated so quickly: from 2016 to 2021, Southeast Asia e-commerce sales grew fivefold and
              retail penetration jumped from 5% to 20%.


              The parcel lens is narrower and more operationally relevant. Official FY2025 J&T materials show 7.6588
              billion Southeast Asia parcels at 34.4% share, implying a roughly 22.29 billion parcel Southeast Asia
              express market in 2025. The same company charts show 22.066 billion China parcels at 11.1% share, which is
              broadly consistent with public China totals of 199 billion parcels in 2025. Put together, the core
              Southeast Asia-plus-China parcel opportunity is roughly 221.29 billion parcels for 2025. That is not a
              revenue TAM and it is not equally contestable, but it is the best public activity lens for the markets
              where J&T actually competes.


              There is also a real methodology mismatch the chapter should preserve instead of smoothing away. J&T's
              2025 annual report cites Frost & Sullivan for a US$238.25 billion Southeast Asia e-commerce
              retail-transaction figure in 2024, materially above the e-Conomy SEA US$159 billion e-commerce lens. The
              difference likely reflects scope and definitions, not a single right answer, so the market estimate range
              should be read as boundary-sensitive rather than precise.
