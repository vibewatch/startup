  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Current verdict
      - Public support
      - Decision implication
      - What would change the view
    rows:
      - - Recommendation
        - Buy
        - Current public value sits below the chapter's base-case midpoint and below analyst consensus.
        - Constructive public-market entry is supportable.
        - Downgrade to Track if China earnings or platform concentration look worse than public evidence suggests.
      - - Confidence
        - Medium
        - Price, market cap, and FY2025 financials are visible, but key commercial drivers remain opaque.
        - Position sizing should reflect evidence gaps.
        - Confidence rises with customer-concentration and China-yield disclosure.
      - - Risk rating
        - High
        - China pricing, platform dependence, and founder control all matter to the multiple.
        - Do not treat the stock like a low-volatility compounder.
        - Risk falls only if China margins stabilize and platform concentration proves lower than feared.
      - - Valuation stance
        - Attractive
        - Sub-1x trailing sales and 7.05x 2026 EV/EBITDA are modest for a profitable, region-leading operator.
        - Current pricing leaves room for upside without requiring heroic assumptions.
        - The stance slips to Fair if China price pressure re-accelerates or consensus expectations are cut materially.
      - - Primary upside driver
        - Southeast Asia leadership plus non-China mix
        - SEA share reached 34.4% in FY2025 and non-China parcels reached 35.1% in Q1 2026.
        - Higher-quality growth can keep the market paying through China noise.
        - Need sustained parcel density and margin evidence outside China.
      - - Primary downside driver
        - China yield compression
        - Public filings already describe intense competition and much thinner China EBIT than SEA EBIT.
        - A new price-war round could erase most of the current valuation cushion.
        - Watch realized parcel yield, rebates, and China adjusted EBIT.
    notes: >-
      This is a price-sensitive decision summary. It translates public evidence into current posture rather than
      pretending to a full intrinsic-value model.
