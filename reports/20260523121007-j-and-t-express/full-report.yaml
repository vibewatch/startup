      - number: '4.3'
        title: Cost structure and margin progression
        blocks:
          - type: paragraph
            body: >-
              The strongest part of the financial case is no longer simple top-line growth; it is the margin path.
              Official FY2024 and FY2025 disclosures show IFRS gross profit rising from US$1.08 billion to US$1.46
              billion, while adjusted EBITDA increased from US$778 million to US$1.05 billion. The margin trend is not
              cleanly premium, but it is moving in the right direction. SEA is the key reason. J&T explicitly said SEA
              cost per parcel fell from US$0.57 in 2024 to US$0.48 in 2025, and derived segment math shows SEA
              contributing only about 37% of revenue but roughly two-thirds of adjusted EBIT. That is the clearest
              public sign that the company has a real scale-and-cost engine somewhere inside the network.


              The weak points are also visible. Management said China remained resilient amid intense price competition
              in H1 2025, which is a polite way of saying scale has not created strong price umbrellas there. China
              still delivered only a low adjusted EBIT margin relative to SEA despite being the largest revenue pool.
              New Markets improved materially and reached positive EBITDA in H1 2025, but H1 EBIT remained negative and
              FY2025 EBIT was only barely positive, so fixed-cost absorption is still incomplete. In other words, J&T
              now has a credible margin-improvement story, but it remains a cost-down story first and a pricing-power
              story second.
