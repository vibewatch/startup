      - number: '4.2'
        title: Volume growth and GTM efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              Public disclosure is strong on parcel throughput and weak on textbook SaaS-style sales efficiency, so the
              right move is to use operational proxies. FY2025 parcel volume reached 30.13 billion, up from 24.65
              billion in FY2024, and market share in SEA climbed from 28.6% to 34.4%. H1 2025 still showed high-velocity
              growth in SEA, and the Q1 2026 update kept that pattern intact with nearly 80% year-on-year SEA growth and
              non-China parcels rising to 35.1% of group volume. Those figures matter more than any single public
              customer logo because they show J&T still converts platform and merchant demand into network density.


              The GTM caveat is pricing. J&T says it uses flexible pricing and tiered volume discounts to attract parcel
              volume from e-commerce platforms, while also expanding non-platform parcels from social-commerce sellers,
              branded merchants, chain stores, and individuals. That is useful, but it is not the same as disclosing
              CAC, take rate, or merchant payback. Revenue per parcel appears to have drifted down from roughly US$0.416
              in FY2024 to US$0.404 in FY2025 and about US$0.393 in H1 2025, which is consistent with a volume-first
              strategy in a competitive market. The result is a workable proxy verdict: demand acquisition still looks
              efficient at the network level, but the public record does not expose how much discounting is required to
              sustain that growth.
