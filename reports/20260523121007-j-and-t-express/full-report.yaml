chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and network footprint
        blocks:
          - type: paragraph
            body: >
              J&T Express presents itself as a global logistics operator built around express delivery services and
              cross-border logistics rather than a narrow domestic courier business. Official about and service
              materials say the company was founded in 2015, with investor-relations materials narrowing establishment
              to August 2015, and that its network covered 13 countries as of 2024-12-31. The official footprint
              disclosed for that date was already large: 238 transit centers, 19,100 outlets, more than 400,000 service
              personnel, and 7,200 network partners. The listed parent is J&T Global Express Limited, a Hong Kong-listed
              Cayman company trading as 1519.HK since 27 October 2023. Official pages also frame the offer as 7x24,
              365-day delivery service plus cross-border and digital logistics tools. One diligence caveat is that
              official materials emphasize service personnel and partner counts rather than a clean conventional
              employee headcount, making third-party workforce estimates difficult to compare directly.
