      - number: '7.3'
        title: Labor relations, service quality, and operational reliability
        blocks:
          - type: paragraph
            body: >-
              The operational-risk picture is mixed: J&T has visible complaint channels and even a stated one-hour
              callback process for critical complaints, but public adverse surfaces suggest those controls do not
              eliminate delivery friction or labor conflict. In the Philippines, CTUHR and The Manila Times reported
              strikes or threatened strikes tied to alleged unfair labor practices and collective-bargaining disputes.
              Those are not adjudicated findings, and the sourcing is labor-advocacy and news reporting rather than a
              court judgment. Still, they are too specific to ignore because they involve named unions, DOLE or NCMB
              mediation, and claimed disruption across a labor-intensive network.


              The fair balancing point is that later reporting also supports de-escalation. Pinoy Aksyon described a
              subsequently ratified CBA, pay and benefit improvements, and management acknowledgment of the settlement.
              That suggests the risk is not "permanent labor breakdown" but recurring labor-relations volatility in a
              business where riders, sortation workers, drivers, and outlet staff are operationally critical.
              Service-quality evidence should be handled with similar caution. Trustpilot and ComplaintsBoard are
              self-selected complaint surfaces, not audited SLAs, but both point to repeated recipient pain points
              around delayed delivery, failed attempts, missing parcels, COD disputes, and weak support responsiveness.
              For investors, the message is that execution risk remains customer-facing and labor-sensitive even after
              the company reached profitability.
