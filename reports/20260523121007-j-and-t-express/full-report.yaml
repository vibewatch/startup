      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              J&T's parcel demand is multi-sided. The first and most powerful buyer cohort is large marketplace and
              platform ecosystems: Shopee, Lazada, TikTok Shop, Temu, Shein, and other channels that aggregate order
              flow and can allocate volume by lane, season, and subsidy logic. These buyers care about SLA coverage,
              parcel price, peak readiness, and integration depth. The user is usually a logistics or
              merchant-operations team, while the payer can be the platform itself, the merchant, or a subsidy pool
              shared across both. Sea's investor-relations page confirms Shopee's centrality as a standalone platform
              ecosystem, which matters because this demand sits outside J&T's control even when J&T wins large volumes.


              The second cohort is merchants and brands. Large brands and enterprise sellers tend to buy for
              reliability, settlement discipline, and cross-border reach, while SMEs and online sellers are more price
              sensitive and are often willing to multi-home across carriers. ION's reporting is helpful here because it
              shows local operators trying to build sustainable economics outside the largest platforms and describes
              SME-heavy customer mixes in some markets. The third cohort is cross-border sellers, whose workflow
              increasingly looks like a B2B2C chain rather than a simple domestic pickup. Maersk's discussion of
              fulfillment, customs, last-mile, and returns clarifies why cross-border sellers are strategically
              important even when J&T discloses limited mix detail. End-consumers are rarely the buyer, but they are the
              service-quality judge whose failed-delivery rates and return behavior shape platform allocation decisions.
            claimRefs:
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
          - type: table
            tableRef: TM003
            claimRefs:
