    J&T sells express-delivery and cross-border logistics services supported by digital logistics tools rather than a
    single courier app. Public surfaces show consumer send-and-track flows, merchant/VIP workflows, partner APIs for
    order and tracking integration, COD-adjacent merchant processes, and a heavily automated physical network of
    outlets, sorting centers, machines, and line-haul assets.
  customerFocus: >
    Marketplace ecosystems, SME sellers, larger merchants and brands, cross-border merchants, and end-recipients across
