      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The demand case is real. Roland Berger links the region's last-mile expansion to e-commerce growth,
              urbanization, rising incomes, and public infrastructure investment. Temasek and Bain add a newer layer:
              video commerce is now a meaningful share of e-commerce GMV, which can create more spiky, campaign-driven
              parcel flows. McKinsey argues that logistics players also face a broader product mix and more diversified
              channels than in the earlier marketplace-only phase, which raises the value of network breadth and
              operational flexibility. J&T's own Q1 2026 data suggests it is still converting those drivers into volume,
              especially in Southeast Asia where parcel growth ran near 80% year over year and peak daily volume reached
              47 million parcels.


              The constraint side is just as important. Maersk emphasizes fragmented geography, islands, weaker road
              networks, and slower maritime routes across markets such as Indonesia and the Philippines. McKinsey adds
              cash-on-delivery and returns friction, both of which raise the probability of failed deliveries and
              increase the cost of end-to-end service. Country-level service design also matters because Parcel Perform
              frames transit times and success rates as country specific rather than regional averages.


              The biggest strategic risk is pricing and platform power. ION describes regional carriers expanding across
              borders at below-local prices to win share, while Roland Berger says gross margins are already under
              pressure. Rest of World adds a sharper company-specific warning: Indonesia rivals accused J&T of predatory
              pricing, and Shopee shifted many everyday Indonesia orders to its own network. Q1 2026 automation and
              fleet metrics show that J&T is investing to stay efficient, but staying efficient is not the same as
              controlling demand.
            claimRefs:
              - CM017
              - CM018
              - CM019
              - CM020
              - CM027
