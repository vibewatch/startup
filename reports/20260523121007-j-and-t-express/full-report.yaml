      - number: '8.5'
        title: Final diligence asks and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              The chapter can issue a constructive recommendation because the public record is already rich enough to
              frame a supportable range, but it cannot collapse the remaining evidence gaps into certainty. The biggest
              blocker is still commercial transparency. Investors need to know how much revenue and parcel volume
              actually comes from the largest platforms, what realized China parcel yields and rebates look like by
              product tier, and whether New Markets are generating country-level returns that justify more capital. The
              SF transaction also needs follow-through: public releases are strong on strategic language and weak on
              explicit synergy or return math. Finally, the governance discount is observable today but not fully mapped
              forward, since future issuance or treasury-share use could alter control dynamics.


              The thesis should break quickly if the few public indicators that still work start rolling over. Another
              clear decline in China profitability, a new platform-insourcing event, formal regulatory escalation, or a
              reversal in New Markets profitability would all move the stock out of the current Attractive bucket. That
              is why the chapter's buy call is conditional in temperament even though it is explicit in direction: the
              upside is real, but it still depends on management proving that today's public-market discount is overdone
              rather than deserved.
            claimRefs:
