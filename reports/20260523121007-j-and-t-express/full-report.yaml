      - number: '4.4'
        title: Cash generation, leverage, and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              J&T's capital-adequacy story is much better than the historical hypergrowth narrative would imply. FY2025
              operating cash flow was US$1.09 billion against US$593.6 million of capex, while H1 2025 operating cash
              flow was US$421.1 million against US$230.3 million of capex. On a simple public-data basis, operating cash
              flow covered capex about 1.8x in both periods. That does not make J&T asset-light; it actually reinforces
              the opposite point. The company continues to fund sorting automation, fleet, and network density, but it
              now appears able to do so from operations rather than from a visible near-term equity dependency.


              Leverage still matters. Year-end 2025 cash and cash equivalents were US$2.01 billion, with another US$130
              million of restricted cash, against US$2.41 billion of borrowings. The deck also says J&T refinanced into
              a RMB10 billion syndicated facility due in October 2028 after carrying a US$1.25 billion facility due in
              October 2027. That is manageable given current cash generation, but it means the balance sheet is not
              net-cash pristine. The underwriting implication is moderate confidence rather than complacency: J&T does
              not look like a business facing a classic burn-and-runway cliff, yet it still depends on maintaining
              positive operating cash flow and orderly refinancing conditions.
