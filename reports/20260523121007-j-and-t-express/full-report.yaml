  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Public-market entry and recommendation
        blocks:
          - type: paragraph
            body: >-
              J&T should be underwritten as a listed express operator, not as a proxy for its old venture marks. Current
              market references cluster tightly enough to support that framing: Stock Analysis showed a HK$76.64 billion
              market cap and HK$79.47 billion enterprise value on May 22, 2026, CompaniesMarketCap translated the market
              cap to about US$9.82 billion, and the Financial Times showed a HK$8.64 close on the same date. Against
              FY2025 revenue of US$12.158 billion and adjusted EBITDA of US$1.049 billion, that works out to about 0.81x
              trailing revenue and about 9.4x historical EBITDA on an equity-value basis before net debt adjustment.
              MarketScreener's 2026 screen pushes the same conclusion in forward language: about 0.65x
              capitalization-to-revenue, 0.62x EV-to-revenue, 7.05x EV-to-EBITDA, and 18.9x forward P/E. Those are not
              startup glamour multiples. They are public-market logistics multiples with room for both upside and
              disappointment.


              The recommendation is Buy, but only as a high-risk public-market entry rather than a clean
              compounding-quality call. The price already reflects heavy compression from both the 2021 private
              reference and the 2023 IPO context, while FY2025 fundamentals improved materially and analysts still
              screen meaningful upside. That combination is enough for an Attractive valuation stance rather than Fair
              or Stretched. It is not enough for a strong conviction upgrade because the public record still leaves real
              uncertainty around China parcel yields, top-platform concentration, and how much governance discount
              minority investors should carry in a dual-class structure.
            claimRefs:
              - CV001
