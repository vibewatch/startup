      - number: '2.5'
        title: Evidence gaps and investment readthrough
        blocks:
          - type: paragraph
            body: >-
              The most important unresolved issue is not whether J&T participates in a large market; it clearly does.
              The unresolved issue is how much of that market is durable, profitable, and contestable once platform
              bargaining power and geography are accounted for. The chapter can support a boundary-driven parcel
              opportunity range, but it cannot yet isolate customer concentration, country-by-country Southeast Asia
              shares, or the domestic-versus-cross-border revenue mix that would turn that range into a clean
              monetizable SAM. The public source pack also leaves country-level service benchmarks thin because Parcel
              Perform exposes the existence of those metrics without publishing the full tables.


              That missing detail matters for valuation. A business tied to marketplace volume can look structurally
              advantaged while the marketplace is subsidizing demand, then lose everyday order flow once the platform
              scales its own network. Likewise, a company can show strong regional share while still facing weak local
              economics in archipelagic or low-density corridors. The evidence so far supports a bullish view on demand
              and scale, but only a qualified view on pricing power. For diligence purposes, the right posture is to
              treat J&T's market as large, fast-moving, and operationally attractive, but to keep margin durability,
              platform concentration, and cross-border mix as open underwriting questions rather than solved inputs.
            claimRefs:
              - CM009
              - CM016
              - CM021
              - CM024
              - CM033
              - CM034
              - CM036
              - CM037
              - CM038
              - CM039
              - CM040
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: J&T's real economic arena is parcel-density, not abstract logistics spend
            body: >-
              The strongest public market lens is parcel volume in Southeast Asia and China, because those are the
              geographies where J&T has disclosed share, infrastructure, and cost context. Generic global-logistics TAMs
              overstate what J&T can monetize today.
            calloutType: insight
            claimRefs:
              - CM002
              - CM016
              - CM045
          - type: callout
            title: Platform concentration can remove volume faster than it built it
            body: >-
              Large platforms remain both the fastest growth channel and the clearest disintermediation risk. Public
              reporting already shows platform insourcing and customer concentration pressure in Indonesia and other
              Southeast Asian markets.
            calloutType: risk
            claimRefs:
              - CM021
              - CM036
              - CM037
              - CM038
          - type: callout
            title: The range is boundary-driven, not probabilistic
            body: >-
              This chapter uses scope-sensitive parcel ranges because public data mixes GMV, retail transaction value,
              and parcel counts. The right takeaway is not one precise TAM but the spread between narrow, core, and
              expanded market definitions.
            calloutType: assumption
            claimRefs:
              - CM009
              - CM016
