      - number: '1.4'
        title: Scale, profitability, and expansion milestones
        blocks:
          - type: paragraph
            body: >
              J&T's strongest company-overview evidence is now operating scale rather than just growth narrative.
              Official FY2025 results disclosed US$12.16 billion of revenue, US$225.3 million of profit for the year,
              and US$425.4 million of adjusted net profit, following an already profitable 2024. Operationally, the
              company crossed 30.1 billion parcels in 2025, with 7.6588 billion in Southeast Asia, 22.066 billion in
              China, and 403.9 million in New Markets. The FY2025 and Q1 2026 decks also show market-share leadership in
              Southeast Asia at 34.4% and meaningful share in China at 11.1%. That scale continued into 2026: the Q1
              2026 operating statement reported 8.3258 billion parcels, 19,500 outlets, 255 sorting centers, and 422
              automated sorting machines as of 31 March 2026. The official milestone trail ties this scale back to a
              sequence of country launches, the Best China and Fengwang acquisitions, the October 2023 Hong Kong
              listing, and continued expansion of non-China volume share.
