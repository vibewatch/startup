      - number: '1.5'
        title: Demand dependencies and adverse signals
        blocks:
          - type: paragraph
            body: >
              The main strategic risk in the overview is not lack of scale but dependence on external platforms,
              partners, and regulatory tolerance. Rest of World reported that J&T scaled early in Indonesia by using
              OPPO's retail network and a regional-sponsor model, then later relied heavily on e-commerce platforms
              including TikTok, Temu, Shein, and Shopee. The same reporting says Shopee moved many Indonesia orders
              in-house in 2025, illustrating that large platforms can be both growth engines and disintermediation
              risks. Adverse signals also exist around pricing and political scrutiny. Rest of World reported
              accusations from Indonesian rivals that J&T used predatory pricing, while Senator Tom Cotton's May 2026
              letter urged DOJ review of J&T and other Chinese-linked logistics firms over alleged sensitive-data
              collection, predatory pricing, and tariff evasion. Those are allegations and requests for investigation,
              not adjudicated findings. Separately, J&T's own website privacy policy confirms collection of technical
              and usage data such as IP address, device information, and visit behavior, which is relevant context but
              not evidence of misconduct.
            claimRefs:
              - CO036
              - CO037
              - CO038
              - CO039
              - CO040
              - CO041
              - CO042
              - CO043
              - CO044
              - CO045
      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Southeast Asia leadership is now backed by profit, not just growth
            body: >
              The overview's strongest point is that J&T's Southeast Asia story is no longer merely a subsidized
              expansion narrative. Official 2025 disclosures show leadership market share, a large absolute parcel base,
              and meaningful segment profitability at the same time.
            calloutType: strength
            claimRefs:
              - CO028
              - CO029
              - CO031
              - CO048
          - type: callout
            title: J&T's operating DNA came from channel-building rather than legacy postal assets
            body: >
              The company appears to have scaled by combining Jet Jie Li's OPPO-era market knowledge with regional
              sponsors and local partners, then layering centralized infrastructure and capital on top. That helps
              explain why the network spread quickly across fragmented Southeast Asian markets before becoming a public
              company.
            calloutType: insight
            claimRefs:
              - CO013
              - CO036
          - type: callout
            title: Platform dependence creates both growth and disintermediation risk
            body: >
              J&T benefited from large e-commerce platforms, but those same platforms can internalize logistics or
              redirect volume. Shopee's Indonesia shift is a concrete example that growth quality depends on platform
              relationships, not just parcel throughput.
            calloutType: risk
            claimRefs:
              - CO037
              - CO038
              - CO039
          - type: callout
            title: Pricing and data allegations add geopolitical overhang without yet proving wrongdoing
            body: >
              The reviewed adverse sources raise two separate concerns: pricing behavior in Indonesia and U.S. political
              concern about data and tariff practices. Neither source establishes adjudicated misconduct in the
              materials reviewed for this chapter, but both matter because they can shape regulation, partner appetite,
              and valuation.
            calloutType: risk
            claimRefs:
              - CO041
              - CO042
              - CO043
