      - number: '8.3'
        title: Comparable context and why self-history still matters
        blocks:
          - type: paragraph
            body: >-
              The comparable set is usable, but only if it is labeled honestly. SF is the closest listed logistics
              reference in quality and breadth, and the current pack shows it as a much larger, profitable integrated
              operator at CNY173.06 billion market cap, CNY312.52 billion of TTM revenue, and 14.20x forward P/E. Sea
              and Alibaba are useful only as adjacency references because both sit much higher on sales and EV/EBITDA
              screens while also embedding non-logistics businesses that J&T does not own. Stock Analysis's J&T page
              also shows that Hong Kong has a real logistics equity cohort around the company, including JD Logistics
              and Sinotrans, which matters because it keeps the valuation discussion in a listed-sector frame instead of
              a venture-capital frame.


              Self-history still matters because J&T's own compression arc is part of the investment case. Reuters and
              BusinessToday put the 2023 IPO around US$13 billion, while Reuters-linked coverage also tied the 2021
              funding round to about US$20 billion. Today's roughly US$9.8 billion public value is well below both, even
              though FY2025 fundamentals are much better than they were before listing. The SF subscription price at
              HK$10.10 reinforces that the company is not being treated as broken, but it still is not a pure
              market-clearing mark because it came through a negotiated strategic transaction with explicit industrial
              logic and a discount to the spot close.
            claimRefs:
