      - number: '1.3'
        title: Funding history, listing, and ownership concentration
        blocks:
          - type: paragraph
            body: >
              J&T's capital story has three visible phases in the reviewed sources: rapid private funding, a downsized
              but completed Hong Kong IPO, and then public-market repricing. Independent funding reports say J&T raised
              roughly US$2.5 billion in 2021 at about a US$20 billion valuation from a group that included Boyu,
              Hillhouse, Sequoia China/HongShan, Tencent, and SIG, while the prospectus confirms a broad pre-IPO
              investor roster that also included names such as GLP, SF Express, ATM, D1, and CMBI. The 2023 Hong Kong
              IPO was priced at HK$12 per share; SCMP reported the deal implied roughly HK$105.75 billion or US$13.5
              billion of post-issue market capitalization and later reported modest oversubscription in both the local
              and offshore tranches. By May 2026, CompaniesMarketCap showed the public market value down to US$9.82
              billion, below both the IPO-era figure and the US$12.13 billion 2025 year-end level. Ownership and voting
              rights also remain concentrated: ETNet shows Li Jie Jet & Family retaining a much larger share of voting
              rights than economic ownership because of the dual-class structure.
