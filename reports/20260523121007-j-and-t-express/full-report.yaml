      - number: '6.5'
        title: The main customer risk is concentration and disintermediation, amplified by service-quality friction
        blocks:
          - type: paragraph
            body: >
              The key analytical mistake would be to confuse visible marketplace relationships with durable bargaining
              power. Rest of World describes how J&T's rise was tied to the Chinese e-commerce wave and also shows the
              downside: Shopee has been building more in-house logistics capacity in Indonesia and pushing sellers onto
              that network. That is exactly the customer-risk pattern investors should worry about. If J&T's largest
              traffic sources are platform marketplaces, then those same platforms can change allocation, squeeze
              economics, or internalize logistics once enough density exists.


              Public disclosure does not solve that problem. The retained source set does not disclose NRR, GRR,
              contract length, top-customer concentration, or partner parcel-share by GMV. Named proof outside TikTok
              Shop is also weaker, because several platform relationships are disclosed as ecosystem mentions rather
              than as independently verified production case studies. On top of that, adverse review intensity shows
              that recipient experience can break down even while merchant and platform acquisition messaging looks
              strong. The customer chapter therefore lands with a cautious verdict: J&T clearly has real customers and
              repeat merchant workflows, but the economics of concentration, renewal, and platform dependence remain
              materially under-disclosed.
