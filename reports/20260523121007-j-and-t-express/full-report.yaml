      - number: '3.3'
        title: China incumbents and premium-service benchmarks matter even when J&T leads Southeast Asia volume
        blocks:
          - type: paragraph
            body: >-
              J&T's competitor map is incomplete if it is limited to Southeast Asia. The group still moved 22.066
              billion parcels in China in 2025, so a large share of its operating reality remains shaped by China's
              courier market. SF stands out as the premium benchmark. SF's official overview says it is the largest
              integrated logistics provider in China and Asia, the fourth largest globally, serves over 2.35 million
              corporate clients and more than 800 million individual consumers, and reaches 95 countries plus
              200-country small-parcel coverage. J&T's own 2024 annual report effectively concedes SF's benchmark status
              by saying the company wants overseas service standards like SF Express in China. That is useful because it
              shows management sees premium service and trust as part of the competitive bar, not just low-cost parcel
              throughput.


              YTO represents a different kind of threat: broad domestic density and adjacent service breadth. Its
              official site says the network has more than 5,000 branches and 90,000 service outlets, covers
              county-level cities nationwide, and includes warehousing, supply-chain, COD, appointment delivery, and
              related value-added services. That makes YTO relevant as a scaled domestic incumbent even if the reviewed
              source pack does not expose the same international detail as SF. Together, SF and YTO show why J&T's China
              position should not be treated as a generic extension of its Southeast Asia story. J&T has meaningful
              share in China, but it is still competing against players with either stronger premium-service trust,
              broader domestic outlet density, or both.
