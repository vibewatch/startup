      - number: '7.2'
        title: Regulatory, legal, and data-governance risk
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to frame J&T's regulatory and governance exposure is to separate what is documented from
              what is alleged. On the documented side, the group's public website legal stack is rooted in a China-based
              operator, governed by PRC law for website disputes, and its privacy policy says the site collects
              technical and usage data such as IP addresses, location, page history, and cookie-linked behavior. The
              same policy states that data may be shared with affiliates and disclosed to administrative or judicial
              authorities when legally required. That does not prove any misuse, but it does establish that J&T runs a
              cross-border digital surface with centralized governance language rather than a clearly localized,
              market-by-market data architecture.


              The external policy context has hardened. DOJ says its Data Security Program has been in force since April
              8, 2025 and restricts certain transactions that could give countries of concern or covered persons access
              to Americans' bulk sensitive personal data. Senator Cotton's May 2026 letter explicitly named J&T among
              foreign carriers he wants DOJ to review. Investors should treat that letter as a request for investigation
              rather than as evidence of wrongdoing, but it still matters because policy scrutiny can raise diligence,
              partnership, and expansion friction before any formal case exists. The underwriting implication is
              governance overhang, not a proven compliance breach.
            claimRefs:
              - CR030
              - CR031
              - CR032
              - CR033
              - CR034
              - CR035
