  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The real battlefield is neutral parcel networks versus captive platform logistics
        blocks:
          - type: paragraph
            body: >-
              J&T is not competing in a single clean peer set. One class of rivals consists of neutral third-party
              parcel carriers that still have to win volume lane by lane: Ninja Van, Flash Express, Lalamove, and China
              incumbents such as SF and YTO. The other class consists of platform-owned or platform-embedded logistics
              systems whose advantage is not only delivery execution but control over order flow, subsidies, merchant
              tooling, default courier selection, and marketplace visibility. That second class matters more for pricing
              power. J&T's own annual report says it works with leading platforms such as Shopee, Lazada, Pinduoduo,
              Taobao, Tmall, SHEIN, Mercado Libre, and Temu, but Rest of World separately quotes management saying
              growth has relied primarily on e-commerce platforms. That combination is simultaneously a strength and a
              vulnerability.


              The evidence pack points to Shopee Xpress and Lazada's in-house logistics ecosystem as the
              highest-conviction threats because they can remove everyday order volume without first beating J&T on
              open-market merchant acquisition. Rest of World reports that Shopee's in-house courier SPX dropped J&T for
              most everyday orders in Indonesia in April 2025, while ION describes SPX, LEX, Tokopedia/Gojek, and
              TikiNOW as examples of in-house last-mile capabilities that squeeze third-party operators. This is why the
              chapter treats direct SEA peers and platform-owned logistics separately. J&T can still outrun many neutral
              carriers on scale, but captive platforms can change the rules of competition by routing demand internally.
