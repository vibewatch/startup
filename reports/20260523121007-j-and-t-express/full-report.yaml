  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what counts
        blocks:
          - type: paragraph
            body: >-
              J&T should not be analyzed against the entire global logistics value chain. Its own service pages,
              prospectus, and annual disclosures emphasize express delivery, cross-border logistics, and
              e-commerce-linked parcel movement. That means the included spend is domestic express parcels in Southeast
              Asia and China, last-mile and pickup services connected to marketplace and merchant order flow, and
              cross-border e-commerce handoffs where customs, line-haul, sorting, and last-mile execution are linked.
              The same sources do not support stretching the chapter into ocean freight, contract warehousing, heavy B2B
              freight forwarding, or all third-party logistics spend.


              The volume mix reinforces that narrower boundary. FY2025 disclosures show 7.6588 billion Southeast Asia
              parcels, 22.066 billion China parcels, and only 403.9 million parcels in New Markets, so more than 98% of
              parcel volume still sits in the Southeast Asia-plus-China core. This is why the most useful market lens is
              parcel networks where density, cost per parcel, and platform relationships matter, not a top-down
              global-logistics spend number. Cross-border e-commerce belongs inside the boundary because J&T explicitly
              positions itself as a logistics partner to platforms such as Shein, Temu, TikTok, Shopee, and AliExpress
              in New Markets and because those flows feed the same delivery and sorting network logic. Excluded segments
              remain useful adjacencies, but they are not the market J&T is currently proving.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM016
              - CM045
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
