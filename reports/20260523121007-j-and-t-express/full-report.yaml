      - number: '3.2'
        title: Direct Southeast Asia peers are real, but they do not all attack the same job
        blocks:
          - type: paragraph
            body: >-
              Among the neutral third-party peers, Ninja Van is the closest like-for-like regional parcel competitor in
              the reviewed source pack. Its Singapore site emphasizes door-to-door parcel delivery, real-time tracking,
              selected-destination international shipping with customs support, pickup and drop-off options, and a
              three-attempt return-to-sender process. Flash Express is positioned more aggressively around merchant
              convenience and COD economics: its Thailand site highlights free pickup, self-registered COD, daily
              settlement, a 2.5% COD fee, branch discovery, and shipping-cost estimation. Lalamove is an adjacent but
              important substitute because its official positioning is same-day delivery plus van and truck hire, making
              it especially relevant for merchants who prioritize instant or city-scale dispatch rather than a pure
              scheduled parcel network.


              Third-party comparisons reinforce that these peers win on different dimensions. EasyParcel's Malaysia
              comparison frames J&T as the cheaper domestic option with COD and multi-platform integrations, while Ninja
              Van on that marketplace workflow was presented as international-only in the relevant workflow. Cloud
              Ecommerce's 2026 Philippines comparison portrays J&T as the scale leader, Ninja Van as the more
              tech-forward option, and Flash as the lower-cost challenger. That does not make every statistic in those
              comparison blogs authoritative, but it does fit the broader pattern in the source pack: J&T's core
              direct-peer threat is not that another neutral carrier owns more captive demand than J&T, but that rivals
              can undercut on lane economics, selected capabilities, or merchant experience in specific countries and
              cities.
