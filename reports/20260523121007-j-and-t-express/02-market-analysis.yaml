tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to J&T
  rows:
  - - Southeast Asia domestic express parcel delivery
    - Pickup, sorting, line-haul, last-mile delivery for domestic parcels across J&T's Southeast Asia markets
    - Ocean freight, contract warehousing, heavy freight forwarding
    - Platforms, merchants, brands; shipping may be funded by platform subsidy, merchant, or consumer
    - Core current market with company-leading regional share
  - - China domestic express parcel delivery
    - National courier and express parcels moving through hub-and-spoke and last-mile networks
    - Broader freight brokerage, contract logistics, non-parcel industrial freight
    - Marketplaces, merchants, brands, consumers
    - Core current market by absolute parcel volume
  - - Cross-border e-commerce logistics
    - Customs clearance, line-haul handoff, fulfillment-to-last-mile flows for e-commerce orders
    - Pure international freight forwarding divorced from parcel delivery, customs advisory sold standalone
    - Cross-border sellers, platforms, importers
    - Included adjacency because J&T explicitly markets and serves these flows
  - - Platform-integrated social / live commerce traffic
    - Orders generated by Shopee, TikTok Shop, Temu, Shein, and similar channels that route into parcel networks
    - Advertising spend or marketplace take-rate revenue unrelated to physical delivery
    - Platforms and merchants
    - Strategically important because platforms can both supply and remove parcel volume
  - - Broader logistics and 3PL categories
    - Only relevant where they feed parcel demand or cross-border order fulfillment
    - Ocean shipping, air cargo, contract warehousing, trucking outside parcel logic
    - Enterprise procurement buyers
    - Context only; not the core market used for TAM/SAM reasoning
  notes: The chapter defines J&T's market by operating model rather than by every logistics category the company could theoretically enter. Cross-border logistics is included only where it feeds e-commerce parcel workflows; broader global 3PL spend is excluded from core sizing.
