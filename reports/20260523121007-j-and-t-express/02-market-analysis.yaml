  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: sea-ecommerce-gmv
    missingEvidence: Publisher-level methodology that reconciles the e-Conomy SEA US$159 billion 2024 e-commerce GMV lens with the Frost & Sullivan / J&T US$238.25 billion 2024 retail-transaction lens.
    whyItMatters: The market-size story moves materially depending on whether the analyst is measuring GMV, broader retail transaction value, or another retail definition.
    diligencePath: Obtain the full e-Conomy SEA and Frost & Sullivan methodology notes or workbook and normalize both figures to the same definition.
    relatedQuestionRefs:
    - QM005
    - QM012
  - type: missing-source
    severity: material
    topic: sea-country-share-data
    missingEvidence: Country-level parcel volumes and market-share tables for Indonesia, Malaysia, Singapore, Thailand, Vietnam, and the Philippines from local industry sources.
    whyItMatters: Regional leadership can hide weak national positions, and country mix affects both pricing power and capex needs.
    diligencePath: Acquire the full Parcel Monitor / Parcel Perform report, national postal statistics, or local-operator disclosures for each major Southeast Asian market.
    relatedQuestionRefs:
    - QM026
  - type: private-evidence-only
    severity: material
    topic: platform-concentration
    missingEvidence: Top-platform or top-customer concentration data that shows what proportion of J&T parcel volume or revenue comes from Shopee, TikTok, Temu, Shein, Lazada, or other large channels.
    whyItMatters: Platform insourcing risk is hard to size without concentration data, and bargaining power can move faster than parcel growth.
    diligencePath: Request management disclosure on top-10 customers by parcel volume and revenue, plus any minimum-volume or rebate arrangements.
    relatedQuestionRefs:
    - QM027
  - type: private-evidence-only
    severity: material
    topic: cross-border-mix
    missingEvidence: A public split of J&T parcel and revenue mix between domestic and cross-border flows inside Southeast Asia and inside New Markets.
    whyItMatters: Cross-border parcels may carry different margins, service levels, customs friction, and durability than domestic platform traffic.
    diligencePath: Request lane-level or segment-level management reporting that separates domestic, cross-border, and returns volumes by geography.
    relatedQuestionRefs:
    - QM028
  - type: access-blocked
    severity: minor
    topic: delivery-performance-benchmarks
    missingEvidence: The full set of country-level transit-time, success-rate, and failure-rate metrics that Parcel Perform references but does not disclose on its public teaser page.
    whyItMatters: Buyer switching often depends on country-specific service quality, especially in fragmented archipelagic markets where generic regional averages are misleading.
    diligencePath: Access the full Parcel Perform report or merchant dashboards, then compare J&T service metrics against local incumbents by country.
    relatedQuestionRefs:
    - QM029
