callouts:
- calloutType: insight
  title: J&T's real economic arena is parcel-density, not abstract logistics spend
  body: The strongest public market lens is parcel volume in Southeast Asia and China, because those are the geographies where J&T has disclosed share, infrastructure, and cost context. Generic global-logistics TAMs overstate what J&T can monetize today.
  claimRefs:
  - CM002
  - CM016
  - CM045
- calloutType: risk
  title: Platform concentration can remove volume faster than it built it
  body: Large platforms remain both the fastest growth channel and the clearest disintermediation risk. Public reporting already shows platform insourcing and customer concentration pressure in Indonesia and other Southeast Asian markets.
  claimRefs:
  - CM021
  - CM036
  - CM037
  - CM038
- calloutType: assumption
  title: The range is boundary-driven, not probabilistic
  body: This chapter uses scope-sensitive parcel ranges because public data mixes GMV, retail transaction value, and parcel counts. The right takeaway is not one precise TAM but the spread between narrow, core, and expanded market definitions.
  claimRefs:
  - CM009
  - CM016
  - CM043
  - CM044
- calloutType: strength
  title: Current growth still argues for scale advantages in Southeast Asia
  body: Q1 2026 Southeast Asia volume growth near 80%, plus rising non-China mix and peak daily density, suggest J&T still converts market growth into network scale better than many subscale rivals.
  claimRefs:
  - CM017
