- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - E-commerce growth and digital-economy scale
    - Positive
    - Current / structural
    - Raises parcel demand baseline across Southeast Asia and supports network density
    - Validate whether platform parcel growth is still outpacing offline recovery by country
  - - Video commerce and social-commerce adoption
    - Positive
    - Current / medium term
    - Creates burstier parcel demand and deeper dependence on platform incentives
    - Test whether live-commerce order flow is profitable after promotional subsidies
  - - Cross-border platform expansion
    - Positive
    - Current / medium term
    - Adds parcel growth in New Markets and increases need for customs-to-last-mile integration
    - Request domestic versus cross-border parcel mix and margin by lane
  - - Automation and fleet density
    - Positive
    - Current / ongoing capex
    - Can lower unit costs and improve SLA resilience at peak volumes
    - Benchmark automation intensity and capex payback by geography
  - - Fragmented archipelagic geography
    - Negative
    - Structural
    - Raises delivery cost and complexity, especially in Indonesia and the Philippines
    - Measure lane-level cost and service quality in lower-density corridors
  - - COD and returns friction
    - Negative
    - Current
    - Higher failed-delivery and reverse-logistics costs can erode unit economics
    - Request prepaid versus COD mix and failure-rate deltas by market
  - - Price wars and gross-margin pressure
    - Negative
    - Current
    - Volume growth may not translate into durable profit if price competition remains irrational
    - Stress-test EBIT per parcel under normalized pricing scenarios
  - - Platform insourcing and concentration risk
    - Negative
    - Current / medium term
    - Large channels can remove volume quickly once their in-house networks scale
    - Request customer concentration and exposure to Shopee, TikTok, Temu, Shein, and Lazada
  notes: The driver/constraint register ties public market narratives to underwriting questions. Several positive drivers are real, but almost all of them are mediated by platform power, geography, and service-quality execution rather than by abstract market size.
