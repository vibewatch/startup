- id: evidence-gaps-and-investment-readthrough
  title: Evidence gaps and investment readthrough
  body: 'The most important unresolved issue is not whether J&T participates in a large market; it clearly does. The unresolved issue is how much of that market is durable, profitable, and contestable once platform bargaining power and geography are accounted for. The chapter can support a boundary-driven parcel opportunity range, but it cannot yet isolate customer concentration, country-by-country Southeast Asia shares, or the domestic-versus-cross-border revenue mix that would turn that range into a clean monetizable SAM. The public source pack also leaves country-level service benchmarks thin because Parcel Perform exposes the existence of those metrics without publishing the full tables.


    That missing detail matters for valuation. A business tied to marketplace volume can look structurally advantaged while the marketplace is subsidizing demand, then lose everyday order flow once the platform scales its own network. Likewise, a company can show strong regional share while still facing weak local economics in archipelagic or low-density corridors. The evidence so far supports a bullish view on demand and scale, but only a qualified view on pricing power. For diligence purposes, the right posture is to treat J&T''s market as large, fast-moving, and operationally attractive, but to keep margin durability, platform concentration, and cross-border mix as open underwriting questions rather than solved inputs.'
