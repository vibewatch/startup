company:
  name: J&T Express
chapter:
  number: 2
  title: Market Analysis
  summary: J&T's investable market is not generic global logistics but the Southeast Asia and China express-parcel networks and adjacent cross-border e-commerce flows where it already has operating density. Official FY2025 materials show 7.6588 billion Southeast Asia parcels at 34.4% share and 22.066 billion China parcels at 11.1% share, implying a core 2025 parcel opportunity of roughly 221 billion parcels across the two anchor geographies before narrower boundary choices. Demand remains supported by Southeast Asia digital-commerce growth and cross-border platform expansion, but price wars, fragmented geography, COD and returns friction, and platform insourcing keep margin quality and bargaining power under pressure.
sections:
- id: market-boundary
  title: Market boundary and what counts
  body: 'J&T should not be analyzed against the entire global logistics value chain. Its own service pages, prospectus, and annual disclosures emphasize express delivery, cross-border logistics, and e-commerce-linked parcel movement. That means the included spend is domestic express parcels in Southeast Asia and China, last-mile and pickup services connected to marketplace and merchant order flow, and cross-border e-commerce handoffs where customs, line-haul, sorting, and last-mile execution are linked. The same sources do not support stretching the chapter into ocean freight, contract warehousing, heavy B2B freight forwarding, or all third-party logistics spend.


    The volume mix reinforces that narrower boundary. FY2025 disclosures show 7.6588 billion Southeast Asia parcels, 22.066 billion China parcels, and only 403.9 million parcels in New Markets, so more than 98% of parcel volume still sits in the Southeast Asia-plus-China core. This is why the most useful market lens is parcel networks where density, cost per parcel, and platform relationships matter, not a top-down global-logistics spend number. Cross-border e-commerce belongs inside the boundary because J&T explicitly positions itself as a logistics partner to platforms such as Shein, Temu, TikTok, Shopee, and AliExpress in New Markets and because those flows feed the same delivery and sorting network logic. Excluded segments remain useful adjacencies, but they are not the market J&T is currently proving.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM016
  - CM045
  tableRefs:
  - TM001
- id: sizing-lenses
  title: 'Sizing lenses: digital demand, parcel markets, and J&T share'
  body: 'The broadest demand lens is Southeast Asia digital commerce. Temasek and Bain say the region''s digital economy reached US$263 billion of GMV in 2024, with US$89 billion of revenue and US$11 billion of profit. Within that, the same program pegs e-commerce GMV at roughly US$159 billion and says video commerce already represents 20% of e-commerce GMV. McKinsey''s older but still useful structural work shows why parcel demand accelerated so quickly: from 2016 to 2021, Southeast Asia e-commerce sales grew fivefold and retail penetration jumped from 5% to 20%.


    The parcel lens is narrower and more operationally relevant. Official FY2025 J&T materials show 7.6588 billion Southeast Asia parcels at 34.4% share, implying a roughly 22.29 billion parcel Southeast Asia express market in 2025. The same company charts show 22.066 billion China parcels at 11.1% share, which is broadly consistent with public China totals of 199 billion parcels in 2025. Put together, the core Southeast Asia-plus-China parcel opportunity is roughly 221.29 billion parcels for 2025. That is not a revenue TAM and it is not equally contestable, but it is the best public activity lens for the markets where J&T actually competes.


    There is also a real methodology mismatch the chapter should preserve instead of smoothing away. J&T''s 2025 annual report cites Frost & Sullivan for a US$238.25 billion Southeast Asia e-commerce retail-transaction figure in 2024, materially above the e-Conomy SEA US$159 billion e-commerce lens. The difference likely reflects scope and definitions, not a single right answer, so the market estimate range should be read as boundary-sensitive rather than precise.'
