callouts:
  - calloutType: strength
    title: Southeast Asia leadership is now backed by profit, not just growth
    body: >
      The overview's strongest point is that J&T's Southeast Asia story is no longer merely a subsidized expansion narrative. Official 2025 disclosures show leadership market share, a large absolute parcel base, and meaningful segment profitability at the same time.
    claimRefs: [CO028, CO029, CO031, CO048]

  - calloutType: insight
    title: J&T's operating DNA came from channel-building rather than legacy postal assets
    body: >
      The company appears to have scaled by combining Jet Jie Li's OPPO-era market knowledge with regional sponsors and local partners, then layering centralized infrastructure and capital on top. That helps explain why the network spread quickly across fragmented Southeast Asian markets before becoming a public company.
    claimRefs: [CO013, CO036]

  - calloutType: risk
    title: Platform dependence creates both growth and disintermediation risk
    body: >
      J&T benefited from large e-commerce platforms, but those same platforms can internalize logistics or redirect volume. Shopee's Indonesia shift is a concrete example that growth quality depends on platform relationships, not just parcel throughput.
    claimRefs: [CO037, CO038, CO039]

  - calloutType: risk
    title: Pricing and data allegations add geopolitical overhang without yet proving wrongdoing
    body: >
      The reviewed adverse sources raise two separate concerns: pricing behavior in Indonesia and U.S. political concern about data and tariff practices. Neither source establishes adjudicated misconduct in the materials reviewed for this chapter, but both matter because they can shape regulation, partner appetite, and valuation.
    claimRefs: [CO041, CO042, CO043, CO044]

