company:
  name: J&T Express
chapter:
  number: 1
  title: Company Overview
  summary: >
    J&T Express is a Hong Kong-listed global logistics company founded in Indonesia in 2015 and scaled into a 13-country network spanning Southeast Asia, China, the Middle East, and Latin America. Official FY2025 results show US$12.16 billion of revenue, 30.1 billion parcels, and continued market-share leadership in Southeast Asia, while Q1 2026 volumes remained strong. The overview is favorable on scale and profitability but still shaped by founder-centric control, platform-dependence risk, and unadjudicated pricing and data-related allegations.
sections:
  - id: identity-and-footprint
    title: Identity, stage, and network footprint
    body: >
      J&T Express presents itself as a global logistics operator built around express delivery services and cross-border logistics rather than a narrow domestic courier business. Official about and service materials say the company was founded in 2015, with investor-relations materials narrowing establishment to August 2015, and that its network covered 13 countries as of 2024-12-31. The official footprint disclosed for that date was already large: 238 transit centers, 19,100 outlets, more than 400,000 service personnel, and 7,200 network partners. The listed parent is J&T Global Express Limited, a Hong Kong-listed Cayman company trading as 1519.HK since 27 October 2023. Official pages also frame the offer as 7x24, 365-day delivery service plus cross-border and digital logistics tools. One diligence caveat is that official materials emphasize service personnel and partner counts rather than a clean conventional employee headcount, making third-party workforce estimates difficult to compare directly.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO009, CO010, CO011]
    tableRefs: [TO001]
    figureRefs: [FO002]

  - id: governance-and-leadership
    title: Founder-led governance and senior leadership
    body: >
      The official governance record centers J&T on Jet Jie Li. Corporate-governance materials identify him as founder, executive director, chief executive officer, and chairman, and describe a background built in OPPO's Indonesia and broader Asian expansion. That founder-market fit matters because J&T's early operating logic depended on local channel-building, fast execution, and cross-border replication rather than a single-country asset base. The rest of the disclosed senior team is thinner but still relevant: Steven Suzhou Fan is executive president, Charles Junyi Hou is vice president, and Dylan Say Keong Tey has served as CFO since August 2021. As of the Q1 2026 operating statement, the board comprised one executive director, three non-executive directors, and three independent non-executive directors. A complicating point is founder attribution: official materials use singular founder language for Jet Jie Li, while several independent media reports also credit Tony Chen Mingyong. That ambiguity does not change current operating control, but it does matter for understanding origin economics, relationships, and influence.
    claimRefs: [CO012, CO013, CO014, CO015, CO016, CO017, CO018, CO019, CO020]
    tableRefs: [TO002]

  - id: capital-markets-and-ownership
    title: Funding history, listing, and ownership concentration
    body: >
      J&T's capital story has three visible phases in the reviewed sources: rapid private funding, a downsized but completed Hong Kong IPO, and then public-market repricing. Independent funding reports say J&T raised roughly US$2.5 billion in 2021 at about a US$20 billion valuation from a group that included Boyu, Hillhouse, Sequoia China/HongShan, Tencent, and SIG, while the prospectus confirms a broad pre-IPO investor roster that also included names such as GLP, SF Express, ATM, D1, and CMBI. The 2023 Hong Kong IPO was priced at HK$12 per share; SCMP reported the deal implied roughly HK$105.75 billion or US$13.5 billion of post-issue market capitalization and later reported modest oversubscription in both the local and offshore tranches. By May 2026, CompaniesMarketCap showed the public market value down to US$9.82 billion, below both the IPO-era figure and the US$12.13 billion 2025 year-end level. Ownership and voting rights also remain concentrated: ETNet shows Li Jie Jet & Family retaining a much larger share of voting rights than economic ownership because of the dual-class structure.
    claimRefs: [CO017, CO018, CO020, CO021, CO022, CO023, CO024, CO025, CO026]
    tableRefs: [TO003]
    figureRefs: [FO003]

  - id: operating-scale-and-milestones
    title: Scale, profitability, and expansion milestones
    body: >
      J&T's strongest company-overview evidence is now operating scale rather than just growth narrative. Official FY2025 results disclosed US$12.16 billion of revenue, US$225.3 million of profit for the year, and US$425.4 million of adjusted net profit, following an already profitable 2024. Operationally, the company crossed 30.1 billion parcels in 2025, with 7.6588 billion in Southeast Asia, 22.066 billion in China, and 403.9 million in New Markets. The FY2025 and Q1 2026 decks also show market-share leadership in Southeast Asia at 34.4% and meaningful share in China at 11.1%. That scale continued into 2026: the Q1 2026 operating statement reported 8.3258 billion parcels, 19,500 outlets, 255 sorting centers, and 422 automated sorting machines as of 31 March 2026. The official milestone trail ties this scale back to a sequence of country launches, the Best China and Fengwang acquisitions, the October 2023 Hong Kong listing, and continued expansion of non-China volume share.
    claimRefs: [CO027, CO028, CO029, CO030, CO031, CO032, CO033, CO034, CO035, CO046, CO047, CO048]
    tableRefs: [TO004]
    figureRefs: [FO001]

  - id: strategic-dependencies-and-adverse-signals
    title: Demand dependencies and adverse signals
    body: >
      The main strategic risk in the overview is not lack of scale but dependence on external platforms, partners, and regulatory tolerance. Rest of World reported that J&T scaled early in Indonesia by using OPPO's retail network and a regional-sponsor model, then later relied heavily on e-commerce platforms including TikTok, Temu, Shein, and Shopee. The same reporting says Shopee moved many Indonesia orders in-house in 2025, illustrating that large platforms can be both growth engines and disintermediation risks. Adverse signals also exist around pricing and political scrutiny. Rest of World reported accusations from Indonesian rivals that J&T used predatory pricing, while Senator Tom Cotton's May 2026 letter urged DOJ review of J&T and other Chinese-linked logistics firms over alleged sensitive-data collection, predatory pricing, and tariff evasion. Those are allegations and requests for investigation, not adjudicated findings. Separately, J&T's own website privacy policy confirms collection of technical and usage data such as IP address, device information, and visit behavior, which is relevant context but not evidence of misconduct.
    claimRefs: [CO036, CO037, CO038, CO039, CO040, CO041, CO042, CO043, CO044, CO045]

