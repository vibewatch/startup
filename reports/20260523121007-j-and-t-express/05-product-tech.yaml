- id: operating-architecture
  title: Architecture is physical-network orchestration plus gated merchant integration
  body: 'The fetched pack does not expose an internal software-system diagram, but it does expose the operating architecture
    clearly enough. The about page says J&T is built on intelligent infrastructure and digital logistics networks across 13
    countries, while filings quantify the physical control plane: 238 large sorting centers and 19,100 outlets at 2024 year-end,
    then 255 sorting centers, 19,500 outlets, and 422 automated sorting machines by Q1 2026. The same Q1 materials show 6,200
    Southeast Asia line-haul vehicles, including 3,200 self-owned, and the 2025 annual report says the year-end fleet exceeded
    13,300 line-haul vehicles with more than 8,500 self-owned. That is the strongest public architecture signal in the whole
    chapter.


    The digital layer is narrower but still meaningful. J&T''s developer portal exposes order, tracking, tariff-check, and
    cancel-order functions, and the documentation says integrations move from cooperation agreement to test API, mapping,
    and only then production usage. Rest of World''s description of regional sponsors managing local operations, network partners,
    and directly operated outlets reinforces that the architecture is hybrid: software and API rails coordinate demand intake,
    but the real system advantage comes from how those rails plug into facilities, automation, fleets, and region-specific
    operating entities. The moat, if any, is operational control and density, not public-facing software originality.'
