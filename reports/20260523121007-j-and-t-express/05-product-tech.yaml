company:
  name: J&T Express
chapter:
  number: 5
  title: Product & Technology
  summary: 'J&T''s public product is a multi-lane logistics workflow rather than a single courier app: consumer parcel sending
    and tracking, merchant/VIP tooling, partner API intake, cross-border movement, and a heavily automated physical network
    all appear in the fetched pack. The strongest technology signal is operational technology and integration discipline —
    sorting automation, fleet control, outlet density, and gated merchant workflows — while the weakest is public software
    assurance, because regional digital surfaces are fragmented and trust disclosures are mostly generic legal pages.'
sections:
- id: scope-workflows
  title: The product is a logistics workflow stack, not a single courier app
  body: 'J&T should be underwritten as a workflow-heavy logistics product, not as a thin consumer shipping widget. The official
    global and China service pages describe a company whose core businesses are express services and international logistics,
    with 7x24/365 operations, 24-hour customer support, door-to-door cross-border handling, and a digital logistics platform
    that is meant to help customers manage inventory and operating status. That language matters because it frames the product
    as a networked service system spanning intake, routing, transport, customer service, and merchant operations rather than
    as just last-mile delivery.


    The country-level surfaces make that workflow more concrete. Malaysia''s FAQ shows a walk-in parcel flow at drop points
    plus a VIP layer for bulk ordering, invoice search, pickup, and cheaper rates. Indonesia''s consumer app emphasizes order
    creation, tracking, rate lookup, and drop-point discovery, while the Thailand-focused VIP app adds barcode scanning, multi-parcel
    management, printing, and branch search. Singapore adds partner-facing evidence through a TikTok logistics case study
    and a retail/B2B transport launch. The supportable product definition is therefore broad but coherent: consumer sending
    and tracking, merchant order ingestion, hub-and-line-haul orchestration, cross-border delivery, and customer support all
    sit inside one operating stack.'
