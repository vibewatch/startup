- id: differentiation-moat
  title: The technology moat is automation density and merchant connectivity, not frontier software
  body: 'The most supportable product-technology thesis is that J&T wins with operating technology and integration density.
    The service pages describe a digital logistics platform, but the filings and annual report are much more revealing: management
    keeps highlighting sorting centers, automated machines, fleet ownership, outlets, and equipment as the infrastructure
    foundation of the business. The Q1 2026 deck also frames fleet buildout and sorting upgrades as explicit efficiency investments.
    That is a real technology story, just not a frontier-software one.


    Merchant connectivity adds a second layer. The developer portal makes partner APIs available for order intake and shipment
    tracking, the Malaysia FAQ exposes VIP merchant tooling, the Singapore TikTok case study shows platform-partner logistics,
    and the Singapore retail release adds B2B transport options. At the same time, Rest of World says growth relied primarily
    on e-commerce platforms, which is why the moat should be scored as moderate rather than dominant. J&T appears to have
    meaningful operational technology and ecosystem integration, but it does not publicly show proprietary software assets,
    open developer mindshare, or unusually deep switching-cost mechanics outside the physical network and platform relationships
    it has already built.'
