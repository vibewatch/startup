  title: Differentiation / trust-controls table
  columns:
  - Capability or control
  - What public evidence shows
  - Why it matters
  - Gap or caution
  - Source lens
  rows:
  - - Automation density
    - 422 automated sorting machines by Q1 2026 and 413 at 2025 year-end
    - Supports throughput and lower handling cost at network scale
    - No public error-rate, accuracy, or utilization disclosure
    - Filing
  - - Fleet control
    - 6,200 SEA line-haul vehicles in Q1 2026, including 3,200 self-owned; >13,300 group line-haul vehicles at 2025 year-end
      with >8,500 self-owned
    - Improves routing control and peak-season flexibility
    - Capital intensity remains high and lane economics stay opaque
    - Filing
  - - Merchant and platform connectivity
    - API portal, VIP merchant tooling, TikTok partnership, and Singapore B2B transport
    - Expands J&T beyond ad-hoc consumer parcels into embedded logistics workflows
    - Public evidence is country-specific and usage metrics are private
    - Technical docs + partner proof
  - - Gated onboarding and mapping
    - Production API access follows agreement, testing, mapping, and operations notification
    - Can improve control over integration quality and shipping readiness
    - Also makes the ecosystem less open and harder to evaluate externally
    - Technical docs
  - - Legal and privacy controls
    - Published privacy policy and terms govern data collection, cookies, ownership, and user obligations
    - Shows baseline compliance posture and formal control surfaces
    - Artifacts are generic and the visible privacy page dates back to 2021-10-15
    - Legal
