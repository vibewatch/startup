  evidenceGaps:
  - type: missing-source
    severity: material
    topic: security-assurance-artifacts
    missingEvidence: A public status page, uptime history, security whitepaper, SOC-style attestation, ISO certification,
      or other external assurance artifact for J&T's digital and support surfaces.
    whyItMatters: Without external assurance, the chapter can only describe legal/privacy posture and public workflow promises,
      not whether the product stack is operated to unusually strong security or reliability standards.
    diligencePath: Ask management for customer-facing SLA documents, security-certification evidence, incident-response commitments,
      and any public or private uptime reporting used for large merchants.
    relatedQuestionRefs:
    - QE022
    - QE027
  - type: private-evidence-only
    severity: material
    topic: service-quality-kpis
    missingEvidence: Country-level on-time delivery rates, lost-or-damaged parcel rates, first-response times, resolution
      times, app usage, and CSAT/NPS for self-serve support surfaces.
    whyItMatters: The physical network may be strong while the customer experience is uneven; without KPI disclosure it is
      hard to judge whether fragmented digital surfaces are merely cosmetic or operationally important.
    diligencePath: Request internal service dashboards by country, monthly complaint rates, app adoption metrics, and parcel-exception
      statistics for consumer versus merchant workflows.
    relatedQuestionRefs:
    - QE023
    - QE027
  - type: private-evidence-only
    severity: material
    topic: api-governance-and-usage
    missingEvidence: Authentication model, rate limits, sandbox coverage, production approval criteria, error budgets, partner
      count, and API transaction volume for the J&T integration surface.
    whyItMatters: The portal proves integration exists, but not whether it is broadly adopted, tightly governed, or resilient
      enough to create real switching costs for merchant customers.
    diligencePath: Ask for API reference exports, auth and rate-limit policies, change logs, uptime/error reporting, partner
      logos, and cohort data for active integrated merchants.
    relatedQuestionRefs:
    - QE024
    - QE027
  - type: private-evidence-only
    severity: minor
    topic: merchant-solution-adoption
    missingEvidence: Merchant counts, GMV or parcel mix from TikTok and other platform integrations, Singapore B2B transportation
      adoption, and usage of VIP tools by country.
    whyItMatters: Public case studies and releases show breadth, but not whether these merchant-facing products are small
      showcases or large repeatable parts of the group offering.
    diligencePath: Request merchant- and partner-level adoption figures, revenue or parcel contribution, retention, and country
      rollout roadmaps for VIP, API, TikTok, and B2B solutions.
    relatedQuestionRefs:
    - QE012
    - QE027
