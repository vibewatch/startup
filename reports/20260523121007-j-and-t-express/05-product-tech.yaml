- id: deployment-support
  title: Deployment and support are real, but country surfaces are fragmented
  body: 'J&T''s public deployment evidence is strongest on service promises and weakest on consistency. The official service
    pages promise 7x24/365 operations and 24-hour customer service through hotline, website, app, and social channels. Malaysia''s
    FAQ adds hotline and live-chat support, the Indonesia app store listing emphasizes ordering, tracking, rate checks, and
    nearby drop-point discovery, and the VIP app listings show more advanced merchant workflows such as barcode scanning,
    multi-parcel shipping, printing, and pickup scheduling. Those are credible signs of product deployment across multiple
    user types rather than a static brochure site.


    The caution is fragmentation. The chapter pack contains separate country domains, separate mobile-app variants, and uneven
    support surfaces. The Indonesia help-center URL fetched as Page Not Found, the Singapore e-commerce-solution URL returned
    a 404-style page, and the Philippines FAQ did not yield a readable body during this run despite repeated browser-profile
    attempts. None of that proves the core operation is broken, but it does show that J&T''s digital product surface is locally
    managed and inconsistently maintained. For underwriting, that matters because the company may run a strong physical network
    while still delivering uneven self-serve UX, documentation quality, and support discoverability across countries.'
