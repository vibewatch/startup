evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: Audited income statements, revenue recognition schedules, ARR, and cash burn for Sunfire GmbH.
    whyItMatters: >-
      Sunfire is an unlisted German entity; without audited financial statements, underwriting cannot independently
      verify commercial margins or operational burn.
    diligencePath: >-
      Request audited German GAAP / IFRS financial statements and management accounts directly under non-disclosure
      agreement.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: cap-table-governance
    missingEvidence: Fully diluted cap table, share class rights, liquidation preferences, and board governance structure.
    whyItMatters: >-
      While Series E and EIB financing amounts are public, preference waterfalls and voting control rights determine
      equity risk.
    diligencePath: >-
      Inspect Sunfire GmbH's German commercial register (Handelsregister) articles of association and investor
      shareholder agreements.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-enumeration
    missingEvidence: Full enumeration of senior executive vice presidents, supervisory board members, and advisory board composition.
    whyItMatters: >-
      Complete executive and supervisory board enumeration enables assessment of functional coverage across scaling
      operations.
    diligencePath: >-
      Review commercial register filings for current managing directors (Geschäftsführer) and supervisory board
      appointments.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: uncommitted-project-backlog
    missingEvidence: >-
      Granular breakdown of Sunfire's multi-gigawatt pipeline delineating between non-binding memorandums of
      understanding (MoUs) and fully funded binding final investment decision (FID) contracts.
    whyItMatters: >-
      Without contractual visibility into conversion rates and cancellation provisions, obtainable market projections
      remain vulnerable to macro project cancellations and deferrals.
    diligencePath: >-
      Review audited order book disclosures, customer project milestones, and EPC contractor confirmation filings during
      formal diligence.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: competitive-evidence-gap
    missingEvidence: >-
      A verified list of direct electrolyzer peers, industrial incumbents, adjacent technologies, status-quo
      substitutes, internal-build options, and likely entrants.
    whyItMatters: Without a clean peer set, market position, displacement risk, and relative scale cannot be underwritten.
    diligencePath: >-
      Obtain management's win-loss set, buyer shortlists, recent procurement records, and current official product pages
      for each verified peer.
    relatedQuestionRefs:
      - QP004
      - QP009
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: commercial-evidence-gap
    missingEvidence: Comparable bids, contract structures, discounts, warranty terms, service attachment, and lifecycle-cost data.
    whyItMatters: Product breadth cannot establish buyer economics, pricing power, switching cost, or gross-margin durability.
    diligencePath: Review recent signed contracts and lost bids on a normalized capacity, scope, geography, and delivery-date basis.
    relatedQuestionRefs:
      - QP005
      - QP006
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: product-benchmark-gap
    missingEvidence: >-
      Independent, like-for-like efficiency, degradation, availability, delivery, and service benchmarks for Sunfire and
      verified peers.
    whyItMatters: Company-issued technology descriptions do not demonstrate relative performance or moat durability.
    diligencePath: >-
      Commission technical diligence using customer operating data and third-party test results for comparable system
      boundaries.
    relatedQuestionRefs:
      - QP001
      - QP009
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: audited-revenue-and-margins
    missingEvidence: >-
      Audited annual financial statements showing recognized revenue, product gross margins, and cost of goods sold
      breakdowns.
    whyItMatters: >-
      Without audited revenue and margin disclosures, long-term unit profitability and operating leverage cannot be
      modeled.
    diligencePath: >-
      Request three years of audited German GAAP (HGB) or IFRS financial reports directly from company management under
      NDA.
    relatedQuestionRefs:
      - QI008
  - type: private-evidence-only
    severity: material
    topic: cash-burn-and-runway
    missingEvidence: Detailed monthly operating cash flow statements, capex schedules, and current unrestricted cash balances.
    whyItMatters: >-
      Determines how long the Series E equity and EIB debt facilities will sustain operations before additional capital
      is required.
    diligencePath: >-
      Obtain current treasury reports, debt covenant schedules for the EIB loan, and 24-month forward liquidity
      forecasts.
    relatedQuestionRefs:
      - QI008
  - type: private-evidence-only
    severity: material
    topic: stack-degradation
    missingEvidence: >-
      Multi-year commercial stack degradation rates, voltage efficiency decay curves, and cell replacement schedules
      under dynamic renewable power cycling for HyLink Alkaline 23.
    whyItMatters: >-
      Dynamic intermittent renewable power operations accelerate alkaline membrane and catalyst degradation, directly
      impacting multi-year levelized cost of hydrogen (LCOH).
    diligencePath: >-
      Request customer operational stack log telemetry, guaranteed degradation thresholds from EPC contracts, and
      factory accelerated life testing data.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      Direct public developer-facing APIs, open-source repositories, or programmer community forums for Sunfire
      electrolyzers.
    whyItMatters: >-
      As heavy industrial equipment, electrolyzers integrate via proprietary industrial automation protocols rather than
      developer ecosystems, restricting software practitioner visibility.
    diligencePath: >-
      Examine Aucotec Engineering Base schema integration documentation and plant SCADA gateway interface protocols
      during technical diligence.
    relatedQuestionRefs:
      - QE005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Audited customer revenue breakdown, top-5 client share of total order backlog, and commercial cancellation penalty
      terms.
    whyItMatters: >-
      High counterparty concentration in capital-intensive energy projects poses severe revenue volatility if a single
      flagship buyer delays commercial installation.
    diligencePath: Request customer-level revenue schedules and signed equipment supply agreements during management diligence.
    relatedQuestionRefs:
      - QU007
    relatedTableRefs:
      - TU001
  - type: missing-source
    severity: material
    topic: stack-durability-and-retention
    missingEvidence: >-
      Empirical field operational data regarding electrolyzer cell degradation rates, operating hours between
      maintenance overhauls, and realized service attachment rates.
    whyItMatters: >-
      Buyer repeat purchasing and ongoing maintenance contract cash flows depend on demonstrable operational durability
      under intermittent industrial duty cycles.
    diligencePath: Review independent engineering technical reports, field trial logs, and warranty claim histories under NDA.
    relatedQuestionRefs:
      - QU006
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: soec-field-degradation
    missingEvidence: >-
      Multi-thousand-hour empirical degradation rates and cell replacement logs from commercial customer SOEC
      deployments.
    whyItMatters: >-
      SOEC commercial viability hinges on cell stack longevity; unmodeled degradation directly inflates customer LCOH
      and warranty liabilities.
    diligencePath: >-
      Request customer site operational logs and accelerated lifetime testing documentation during confidential
      diligence.
    relatedQuestionRefs:
      - QR001
      - QR006
    relatedTableRefs:
      - TR002
  - type: missing-source
    severity: material
    topic: contractual-litigation-register
    missingEvidence: >-
      Complete schedule of material customer disputes, warranty claims, and IP freedom-to-operate litigation
      assessments.
    whyItMatters: >-
      Public registries capture only formal unsealed filings and miss confidential arbitration or pending commercial
      claims.
    diligencePath: Review Sunfire's confidential disclosure schedule and internal litigation audit letters.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-cancellation
    missingEvidence: >-
      Binding contract terms, cancellation provisions, and top-customer revenue concentration data for the
      multi-megawatt order book.
    whyItMatters: >-
      Delays or cancellations by anchor industrial customers would severely impair forward revenue trajectory and
      factory utilization.
    diligencePath: Audit master service agreements, firm order backlogs, and milestone payment terms under NDA.
    relatedQuestionRefs:
      - QR004
      - QR008
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: audited-financial-metrics
    missingEvidence: >-
      Audited income statements detailing net revenue, cost of goods sold, gross margin, operating cash burn, and
      warranty provisions.
    whyItMatters: >-
      Without verified financial performance and margin delivery, pricing equity risk at headline multiples relies on
      speculation.
    diligencePath: Request audited annual financial statements and management accounts under confidential disclosure agreement.
    relatedQuestionRefs:
      - QV001
  - type: missing-source
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: >-
      Fully diluted capitalization table detailing preference stacks, participation rights, and liquidation waterfalls
      across Series A through E.
    whyItMatters: >-
      Multi-hundred-million debt and equity tranches can severely impair common equity value in downside or moderate
      exit scenarios.
    diligencePath: Obtain current cap table and shareholder agreement from lead investors or legal counsel.
    relatedQuestionRefs:
      - QV001
