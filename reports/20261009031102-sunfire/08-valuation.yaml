    title: "Capital Allocation Guidance: Research-More"
    body: "Sunfire represents an impressive industrial clean-technology platform with substantial institutional backing. However, allocating new capital at implied unicorn valuations cannot be justified without private confirmatory diligence covering audited gross margins, unit economics, warranty reserve liabilities, and senior liquidation preferences."
    claimRefs:
      - "CV002"
      - "CV004"
      - "CV009"
  - calloutType: "risk"
    title: "Entity Brand Confusion in Public Channels"
    body: "Investors conducting automated sentiment or public web checks must filter out unrelated entities such as Sunfire Construction Inc (a California residential installer with consumer pricing disputes) and Sunfire Solar to avoid corrupting diligence signals regarding German industrial electrolyzer manufacturer Sunfire GmbH."
    claimRefs:
      - "CV011"
      - "CV012"
