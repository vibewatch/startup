  - id: FI001
    title: 收入模型桥接图
    type: flow
    summary: 从首次接触工业客户，到资本设备部署和长期服务变现的商业转化流程。
    data:
      nodes:
        - id: N1
          label: 工业客户需求
          description: 寻求氢能脱碳的炼油厂、化工厂和钢铁企业
        - id: N2
          label: FEED 与工程研究
          description: 初步现场工程和厂务配套设计集成
        - id: N3
          label: 约束性设备采购
          description: 兆瓦级碱性电解或 SOEC 电解槽的资本开支合同承诺
        - id: N4
          label: 制造与交付
          description: 工厂制造、电解槽组装、质量测试和交付
        - id: N5
          label: 投产与里程碑开票
          description: 现场安装、电网接入和主要进度收入确认
        - id: N6
          label: 长期服务与电解槽更换
          description: 来自运营维护、备件和电解槽翻新的经常性收入
    approximationNotes: 流程展示工业资本设备的运营转化顺序；里程碑付款分配因客户而异。
    claimRefs:
      - CI001
      - CI002
      - CI003
  - id: FE001
    title: Sunfire 电解槽技术与系统架构
    type: stack
    summary: 六层工业架构覆盖电化学电解槽核心、机械厂务配套、电力转换、安全自动化、控制遥测和数字工程数据管理。
    data:
      layers:
        - label: 工程与数据层
          detail: Aucotec Engineering Base 合作平台管理面向对象的工厂数据、电气原理图和跨学科变更跟踪
        - label: 工厂自动化与控制层
          detail: 工业 SCADA 遥测网关、现场总线接口、远程监控和运行序列自动化
        - label: 工厂安全与保护层
          detail: 冗余安全 PLC、符合 ATEX 标准的气体检测、自动泄压和紧急遏制联锁
        - label: 电力转换层
          detail: 中压变压器和多脉波整流器，将电网 / 可再生能源交流电转换为受控的大电流直流电解槽供电
        - label: 厂务配套（BoP）层
          detail: 30-bar 气液分离、KOH 电解液循环、集成式风冷散热器和脱氧干燥单元
        - label: 电化学电解槽核心层
          detail: 第二代加压碱性电解槽在 30 bar(g) 下运行，直接以压力状态输送工业绿色氢气
    approximationNotes: 基于已发布的 Sunfire HyLink 系统边界和 Aucotec 工程平台集成规格，对架构进行逻辑呈现。
    claimRefs:
      - CE003
      - CE006
      - CE007
      - CE008
      - CE009
  - id: FU001
    title: 工业客户采购与扩张旅程图
    type: journey-map
    summary: 多阶段采购流程，展示重工业买家如何从工程可行性推进至电解槽规模化部署和经常性服务附加。
    approximationNotes: 各阶段反映公用事业规模绿色氢能基础设施的标准资本资产采购流程。
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU012
      - CU013
    data:
      nodes:
        - id: stage-1
          label: 可行性与预 FEED 工程
          phase: 'Stage 1: Pre-FEED'
          actor: Plant Engineering & Innovation Team
          touchpoints: Technical specifications, renewable power availability review, preliminary CAPEX assessment.
        - id: stage-2
          label: 公共补贴资格与资助申请
          phase: 'Stage 2: Public Funding'
          actor: Corporate Strategy & Government Affairs
          touchpoints: EU IPCEI / national hydrogen grant application, carbon reduction certification filing.
        - id: stage-3
          label: 详细 FEED 工程与约束性 FID
          phase: 'Stage 3: Binding Commitment'
          actor: Board of Directors & Executive Sponsors
          touchpoints: Contract signing, balance-of-plant EPC alignment, long-term PPA execution.
        - id: stage-4
          label: 硬件交付与工厂投产
          phase: 'Stage 4: Factory Commissioning'
          actor: Plant Operations & Site EPC
          touchpoints: Electrolyzer stack installation, grid interconnect synchronization, safety verification.
        - id: stage-5
          label: 生命周期运营与服务附加
          phase: 'Stage 5: Asset Expansion'
          actor: Site Asset Manager & Maintenance Lead
          touchpoints: Long-term service agreement, stack refurbishment monitoring, follow-on module orders.
        - id: stage-6
          label: 商业工厂多电解槽扩张
          phase: 'Stage 6: Multi-Hundred MW Scaling'
          actor: Executive Leadership & Plant Expansion Committee
          touchpoints: Replication across sibling refinery/chemical sites, multi-module volume procurement.
  - id: FR001
    title: 风险严重程度与可能性评估矩阵
    type: matrix
    summary: 从发生可能性、影响和缓释成熟度评估主要风险维度。
    data:
      columns:
        - 低可能性
        - 中低可能性
        - 中等可能性
        - 中高可能性
        - 高可能性
        - 极高可能性
      rows:
        - label: 严重程度：极高
          values:
            - 严重的灾难性工厂故障
            - 关键 IP 权利丧失
            - 高 SOEC 衰减失控
            - 重大客户项目取消
            - 欧盟补贴授予被撤回
            - 致命流动性短缺
        - label: 严重程度：高
          values:
            - 加压设备缺陷
            - 自动化堆叠工具延误
            - 厂务配套 EPC 延误
            - 特种材料采购瓶颈
            - 承购方 FID 长期延误
            - 工厂持续高速烧钱
        - label: 严重程度：中
          values:
            - 电网接入时间表推迟
            - 零部件质量轻微偏差
            - 数字遥测停机
            - 老股流动性不足
            - 分包商范围沟通失误
            - 更广泛的宏观经济清洁技术逆风
        - label: 严重程度：低
          values:
            - 轻微行政延误
            - 常规合规申报修订
            - 非关键备件交付周期
            - 现场安装小幅调整
            - 常规客户状态询问
            - 标准供应商合同重新谈判
    approximationNotes: 可能性和严重程度分类是基于商业化里程碑及工业运营特征得出的定性评估。
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR006
      - CR010
  - id: FV001
    title: 估值评估逻辑与决策框架
    type: flow
    summary: 依次连接技术证明、已核实资本承诺和披露缺口的决策流程，最终导向继续研究的建议。
    data:
      nodes:
        - id: tech_proof
          label: 双电解槽技术（碱性电解与 SOEC）
        - id: capital_backing
          label: EUR 500M+ 融资方案（Series E、EIB、资助）
        - id: market_demand
          label: 据报道收入增长 10 倍（HydrogenOne 报告）
        - id: disclosure_gap
          label: 未核实的损益表、利润率和烧钱速度披露
        - id: valuation_hurdle
          label: 未经佐证的 $1.1B headline 估值倍数
        - id: recommendation_stance
          label: 估值偏高下的继续研究立场
      edges:
        - from: tech_proof
          to: capital_backing
        - from: capital_backing
          to: market_demand
        - from: market_demand
          to: disclosure_gap
        - from: disclosure_gap
          to: valuation_hurdle
        - from: valuation_hurdle
          to: recommendation_stance
    approximationNotes: 流程展示决定估值立场的定性关卡因素。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV009
