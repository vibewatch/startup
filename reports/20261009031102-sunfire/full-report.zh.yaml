      - number: '5.2'
        title: 技术架构与运行堆栈
        blocks:
          - type: paragraph
            body: >-
              Sunfire 的技术架构覆盖两类不同的电化学平台：加压碱性电解和高温固体氧化物电解电池（SOEC）[CE001]。主流兆瓦级商业主力是 HyLink Alkaline 平台，核心为 Sunfire 自研的第二代
              30-bar(g) 加压碱性电堆 [CE006]。电堆直接在 30 bar 压力下运行，是关键的机械和热力学 设计选择：它让绿氢从电堆直接以较高管道压力输出，从而省去或大幅缩小下游机械压缩设备
              [CE006]。实体硬件堆栈由五个集成层组成： 电堆电化学部分（双极板、隔膜和电极）、工厂配套机械系统（气液分离器、碱液循环泵、换热器和集成风冷）、电力转换（整流器和中压变压器）、 工业仪表与安全控制（故障安全
              PLC、气体检测、超压排放）以及工程数据层 [CE007]。为统一工厂设计并加快电气、机械和管道等多学科项目工程， Sunfire 将工程工具链迁移到 Aucotec 面向对象的 Engineering
              Base（EB）协作平台 [CE008]。这一数据驱动的工程架构让 Sunfire 可以用开放 API 设计标准化、模块化的功能组件，并自动管理变更和配置控制 [CE009]。
            claimRefs:
