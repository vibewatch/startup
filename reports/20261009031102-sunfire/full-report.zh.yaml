  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 商业收入模式、设备销售与定价现实
        blocks:
          - type: paragraph
            body: >
              Sunfire 的商业模式以工业级 B2B 资本设备销售为核心，产品包括加压碱性（AEL）和固体氧化物电解（SOEC）系统。系统部署在高能耗转型设施、 炼厂和合成燃料工厂，用于生产可再生氢、e-methane 和
              e-chemicals。实际单价按合同确定，通常以兆瓦为单位谈判多年期价格，而不是公布标准 目录价。商业合同通常按 FEED
              研究、工程设计、电堆制造、工厂测试、现场调试和工厂配套交付等里程碑分阶段收款。除初始硬件销售外， Sunfire 还从多年维护协议、专有 SOEC
              电堆翻新、远程工厂监控和消耗性部件更换中获取经常性收入。但实际收入组合、经常性合同期限、 客户取消保护和经审计收入确认时间表，仍未在公开文件中披露。
