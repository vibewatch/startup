  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、类别范围与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Sunfire 工业电解系统的可服务市场包括部署在难以减排的工业制造场景中的兆瓦级加压碱性和高温固体氧化物电解电池（SOEC）设备。
              纳入范围包括核心电解堆、工厂配套（BoP）工程包、电力电子设备和高温蒸汽集成硬件的资本设备支出。主要买方包括一体化钢铁制造商、
              炼化运营商和商业电子燃料项目开发商，他们希望替代通过未经减排的蒸汽甲烷重整（SMR）生产的化石基灰氢。范围排除分布式乘用车
              加氢站、住宅供暖以及兆瓦级以下的小型实验室电解槽。直接的现状替代方案仍是以天然气为原料、通过 SMR 生产的传统灰氢，以及采用
              碳捕集与封存（CCS）的低碳蓝氢。天然气价格的高波动和严格的欧洲排放处罚推动工业采购，但在无补贴的平准化成本基础上，灰氢仍明显更便宜。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 市场测算视角、工业细分与可服务需求
        blocks:
          - type: paragraph
            body: >-
              评估工业电解槽的可服务市场，必须区分不受约束的全球氢需求与工业电解设备的现实资本支出。更广义的工业氢消费规模极大，
              目前主要由未经减排的化石来源满足。但可服务的设备市场受限于直接面临监管脱碳要求的工业部门，具体包括欧洲钢铁、基础化工合成和
              合成航空燃料项目。在这一可服务空间内，可获取市场指的是已作出最终投资决定（FID）、具备承诺的资产负债表资本和具有约束力的承购协议的项目。
              市场增长预测在乐观的监管驱动情景与保守的资本部署周期之间差异很大。已宣布的管线产能要转化为实际交付的兆瓦数，仍受到区域输电容量、 可再生电力购买协议（PPA）定价和各国援助拨付的严格限制。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
      - number: '2.3'
        title: 买方分层、采购决策经济学与预算归属
        blocks:
          - type: paragraph
            body: >-
              工业电解槽采购以多年基础设施资本支出项目的形式进行，由企业执行委员会、首席采购官和项目融资银团牵头。主要买方分为三类：
              用氢基直接还原铁（H-DRI）替代冶金煤的基础金属和钢铁企业；用氢气进行加氢处理和脱硫、替代灰氢的石化炼厂；以及生产合成煤油和 e-methanol 的专门 Power-to-X
              联盟。在初级钢铁生产中，资本配置由董事会层面的脱碳承诺和公共共同融资机制共同决定。在炼化行业，
              采购速度取决于可再生燃料掺混配额和碳合规门槛。所有细分市场的首要财务障碍都是氢气平准化成本（LCOH），其中电力投入成本占生命周期运营支出的七成以上，因此相比电堆效率，获得廉价可再生电力更重要。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 宏观增长驱动、资本密集度与结构性采用约束
        blocks:
          - type: paragraph
            body: >-
              具有约束力的超国家监管框架正在加速工业采用绿氢电解，包括欧盟可再生能源指令（RED III）的工业子目标和排放交易体系（ETS）碳价配额。
              反过来，资本支出通胀、电网并网延迟、债务融资基础设施的高资本成本以及赠款拨付的官僚延误，又严重限制商业部署。对高温 SOEC 系统而言， 工业余热蒸汽可带来相对于低温碱性或 PEM
              设备的显著热力学电效率优势，但客户仍担心电堆衰减速度、热循环耐久性和更换计划。长期承购合同 和补贴无法弥合其与既有化石燃料供应商之间的成本差距前，项目开发商仍不愿作出未对冲的数百兆瓦资产负债表承诺。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 电力 PPA 经济性对采用的影响大于电堆 CAPEX
            body: >-
              在各类工业买方中，氢气平准化成本测算显示，电力运营支出占 30 年工厂总成本的七成至八成。虽然每千瓦电解槽资本支出决定前期融资规模，
              但工业客户推迟最终投资决定，主要是因为购电协议（PPA）价格波动和电网拥堵，而不是 OEM 设备成本差异。
            calloutType: insight
            claimRefs:
              - CM011
              - CM012
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 产品定位在架构上有差异，但尚未完成市场基准验证
        blocks:
          - type: paragraph
            body: >-
              Sunfire 将自己定位为覆盖加压碱性电解和固体氧化物电解的工业电解槽制造商。公司 2021 年公告还称，SOEC 能生产合成气，并表示收购
              使产品组合从高温电解扩展到加压碱性系统。这一组合意味着其技术选择可能比单一化学体系供应商更宽，既能服务传统氢气，也能服务下游 Power-to-Liquids
              流程。但这些都是公司发布的定位主张。现有证据没有独立性能基准、成本曲线、衰减对比或指定竞争对手产品页， 无法检验效率、耐久性、交付或服务主张。因此，产品广度只是合理的差异化因素，还不能称为经验证的护城河。
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP007
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP007
              - CP009
      - number: '3.2'
        title: 历史融资和产能计划体现雄心，不代表当前竞争规模
        blocks:
          - type: paragraph
            body: >-
              Sunfire 披露 2021 年 10 月完成 EUR 109 million 的 Series D 融资，在德国、挪威和瑞士拥有 270 多名员工，并计划到 2023 年形成 500 MW
              的年度碱性电解槽制造能力，同时考虑扩展到吉瓦级。这些披露表明公司追求的是工业规模，而非停留在实验室开发阶段。但它们不能证明 宣布的产能已经投产、得到利用、按时交付或具备成本竞争力。Seedtable
              另列出最后融资日期为 2024 年 3 月 5 日，但抓取页面未披露金额。 这只是较晚的融资信号，不能衡量当前现金、收入、订单质量、装机基础或相对市场份额。因此，竞争评估必须依赖当前运营证据，不能把历史融资
              和产能意向当成已经实现的规模。
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
      - number: '3.3'
        title: 定价、产品打包、分销与锁定效应仍不可见
        blocks:
          - type: paragraph
            body: >-
              留存的目标公司页面没有披露设备价格、计价单位、合同模式、保修经济性、服务附加率、折扣结构或已实现项目价格，也没有说明渠道集中度、
              首选供应商安排、稀缺零部件获取、客户集成成本、多重供应商使用或更换已部署电堆的成本。因此无法从买方角度比较总拥有成本，也无法区分 技术偏好和商业锁定。正确的竞争结论不是 Sunfire
              的价格高于或低于同行，而是指定证据池中的公开证据无法支持任一说法。下一步需要客户投标、 框架协议、保修计划、服务合同和失单分析。
            claimRefs:
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP016
      - number: '3.4'
        title: 同名冲突会显著削弱自动竞争对手发现
        blocks:
          - type: paragraph
            body: >-
              分配到的六条记录都不是德累斯顿电解槽公司的证据：LeadIQ 描述的是堪萨斯州房地产企业，SolarReviews 报道的是加州太阳能安装商， Sunfire Sensei 是软件代理商，Tracxn 介绍的是
              Fairfax 软件服务商，GetLatka 覆盖的是 Medicare 软件平台，而 SunFire 状态页列出的是 注册、HRA、API
              和报告服务。这些记录只能用于排除身份。若把它们当作同行，会污染规模、定价、客户、事故和融资比较。排除这些记录后，留存池中没有有效的具名竞争对手画像。这种缺失属于研究覆盖方面的反向证据，不证明 Sunfire
              没有竞争。在获得干净的同行集合和 独立基准前，投资流程不应给其定位溢价。
            claimRefs:
