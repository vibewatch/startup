        title: 监管与法律风险架构
        blocks:
          - type: paragraph
            body: >-
              Sunfire 处于工业能源脱碳框架内，高度依赖欧盟绿氢指令、跨境补贴审批和严格的工业设备安全标准。公司的核心技术任务是向钢铁、炼化和化工制造
              等高碳行业交付碱性和固体氧化物（SOEC）电解槽，以替代化石燃料。由于工业级绿氢项目的资本支出承诺与区域政策机制和清洁能源要求紧密相连，
              监管时间表变化、认证延迟或贸易定义不统一，都会立即阻碍商业管线落地。Sunfire 总部位于德国德累斯顿，必须确保所有已部署设施遵守 CE 标志、 欧洲压力设备指令和区域电网并网规范。现有二手跟踪数据没有记录针对
              Sunfire SE 的在审公开执法诉讼，但非结构化二手来源缺少公开诉讼记录， 并不能排除私下合同或合规调查，因此必须直接审阅项目合同和知识产权契约。
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR008
      - number: '7.2'
        title: 运营、质量与技术规模化风险
        blocks:
          - type: paragraph
            body: >-
              Sunfire 的运营风险主要由双电解平台的技术成熟度和工业制造爬坡决定。加压碱性系统代表相对成熟、衰减曲线可预测的电解路径；但 Sunfire
              的高温固体氧化物电解电池（SOEC）运行在苛刻的热工况下，需要先进陶瓷、专用密封材料和持续的高温蒸汽集成。要让电堆在数千小时运行中
              保持耐久、同时不出现过度电化学衰减，仍是基础性技术挑战，直接影响客户的氢气平准化成本（LCOH）和保修风险。此外，将电堆组装从试点线
              扩展到每年数百兆瓦的制造运行，会带来零部件供应链瓶颈，尤其涉及专用冶金、电池涂层和精密工厂配套电力电子设备。客户示范现场若发生计划外
              电堆维护或电池过早衰减，将产生高额修复成本并损害商业势头。尽调需要直接审阅加速寿命测试数据、电堆故障率和各商业部署的现场衰减日志。
            claimRefs:
              - CR001
              - CR003
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR003
              - CR009
              - CR010
