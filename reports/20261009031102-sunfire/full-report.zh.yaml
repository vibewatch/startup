      - number: '1.4'
        title: 工业规模指标、核心数据与里程碑演进
        blocks:
          - type: paragraph
            body: >
              在十五年的运营历程中，Sunfire 从实验室规模的电化学演示发展为工业制造商，在德累斯顿、索林根和马格德堡的基地拥有 700 多名员工， 并瞄准多吉瓦产能。公司积累了十五年以上工业绿氢项目经验，目标是在
              2030 年前实现多吉瓦总装机容量。主要里程碑包括 2015 年 Handelsblatt Energy Award 可逆电解奖、2016 年 Fast Company Most Innovative
              Companies 榜单、2017 年 Kanthal Award 电子燃料合成奖， 以及七届 Global Cleantech 100 的持续入选。尽管工业布局广泛，Sunfire
              的公开披露仍然有限：经审计年度收入、ARR、客户账户数和毛利率 均未披露。尽调应审阅保密的项目里程碑计划、设备群衰减曲线和补贴拨付时间表，而不是未经验证的商业聚合数据。
            claimRefs:
              - CO014
              - CO015
              - CO016
      - number: '1.5'
        title: 展示材料
        blocks:
