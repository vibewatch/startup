            title: 准确承销必须先解决实体识别歧义
            body: >
              自动财务抓取工具和网络搜索聚合器经常把 Sunfire GmbH 与无关实体混为一谈，尤其是美国 Medicare 软件公司 SunFire Inc （getlatka.com 报告 ARR 为
              $169.6M）、加州住宅安装商 Sunfire Construction Inc（solarreviews.com 上的消费者定价投诉）以及 弗吉尼亚 IT 公司 Sunfire
              Solutions（Tracxn）。分析师和投资评估人员必须严格隔离 Sunfire GmbH（德国德累斯顿；sunfire.de）， 并通过德国商业登记文件和官方 Series E 披露核验所有财务指标。
