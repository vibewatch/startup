      - number: '5.3'
        title: 产品组合、技术差异化与规模化成熟度
        blocks:
          - type: paragraph
            body: >-
              Sunfire 的商业产品组合分为高容量加压碱性系统（HyLink Alkaline）和高效率固体氧化物系统（HyLink SOEC）[CE001]。面向吉瓦级项目管线 工业招标的商业重点是 HyLink
              Alkaline 23：单模块容量扩大至 50 MW，同时保持 30-bar 加压运行 [CE003, CE006]。Sunfire 管理层指出， 技术差异化依托五项核心工程杠杆：模块容量从 10 MW 增至
              50 MW，提升五倍；完全室外运行，省去昂贵的遮蔽厂房；工厂接口与风冷标准化集成； 高度工厂预制；以及在欧洲运营工业客户现场完成验证 [CE010]。Sunfire
              声称，在客户安装中，这些杠杆合计可相较前代安装将总安装成本（TIC） 降低最高 50% [CE003, CE010]。此外，公司现有欧洲工业客户的重复订单，体现出其 16
              年部署经验积累的成熟度：从千瓦级演示一路发展到三位数 兆瓦级工业工厂 [CE011]。但开发商和软件集成仍由传统工业自动化协议主导，而非面向开发者公开的 API；关于间歇性可再生负荷下运行电堆
              衰减曲线的公开披露仍然有限 [CE012]。
