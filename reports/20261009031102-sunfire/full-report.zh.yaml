      - number: '1.2'
        title: 高管领导、治理与关键人物结构
        blocks:
          - type: paragraph
            body: >
              Sunfire 的执行管理由联合创始人兼 CEO Nils Aldag 与联合创始人兼 CTO Christian Olshausen 共同负责。领导团队既有固态电化学和工艺工程
              的深厚技术能力，也有在欧洲清洁技术生态中执行资本市场事务的专长。在过去十五年间，他们带领公司从德累斯顿早期研究机构分拆项目， 发展为拥有 700
              多名专业人员的规模化工业设备供应商。治理和董事会监督反映出一家资本高度充足的德国 GmbH/SE 实体所具有的复杂资本结构， 背后有国际气候科技风险基金、战略工业企业和主权开发银行支持。由于高温 SOEC
              陶瓷和工业电堆制造高度专业化，技术领导层存在明显的关键人物 集中风险，尤其涉及专有制造工艺和欧洲战略项目合作。
