chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、成立背景与工业使命
        blocks:
          - type: paragraph
            body: >
              Sunfire（Sunfire GmbH）是一家成立于 2010 年、总部位于德国德累斯顿的工业电解设备制造商。公司开发并制造公用事业级和工业级电解槽系统， 旨在帮助重工业、化工和能源基础设施脱碳。Sunfire
              围绕两类核心电化学技术平台运营：一是经过验证、可大规模制氢的加压碱性电解； 二是高温固体氧化物电解电池（SOEC），利用工业余热和蒸汽，以更高的电效率生产氢气或合成气。公司的使命是用工业方案替代化石
              石油和天然气，具体包括可再生 e-Fuels、e-Gas 和 e-Chemicals，并直接接入现有管道和炼化基础设施。作为一家处于 Series E 阶段的清洁技术规模化企业，Sunfire
              在德国布局制造和工程能力，设施分布于德累斯顿、索林根和马格德堡，并在柏林设有战略企业办公室。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
