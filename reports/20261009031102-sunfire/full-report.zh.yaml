      - number: '6.2'
        title: 采用路径、项目转化与商业规模化
        blocks:
          - type: paragraph
            body: >-
              Sunfire 兆瓦级加压碱性和高温固体氧化物电解槽的采用路径，是多年项目孕育，而非高速度、可重复的软件部署。虽然公司公开强调与合作伙伴和客户
              一起推动工业摆脱化石燃料，但商业规模仍受少数旗舰工业演示项目和前端工程协议限制。项目采用多阶段推进模式：初始技术可行性和小规模演示电堆 必须运行数千小时，工业客户才会承诺 100 MW
              或更大的商业设施。此外，市场发现显示全球商业登记中存在严重的身份歧义，多个名为 Sunfire 的无关运营实体——包括 Medicare SaaS
              平台、住宅太阳能承包商和离岸投资项目——产生大量交易量和消费者反馈，必须与这家德国工业电解槽制造商明确分开。
