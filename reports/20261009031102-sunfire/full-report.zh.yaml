      - number: '5.4'
        title: 可靠性、工业安全、合规与技术风险
        blocks:
          - type: paragraph
            body: >-
              工业绿氢生产涉及严格的工艺安全、化学合规和电网并网标准。Sunfire 的加压碱性设备在 30 bar 压力下使用浓氢氧化钾（KOH）电解液， 因而需要严格遵守压力设备合规要求（PED / ASME）、ATEX
              / IECEx 防爆要求和多层功能安全架构（SIL 等级）[CE006, CE007]。运营风险 主要包括动态热管理、隔膜衰减、部分负荷循环下的气体交叉以及高压碱性系统固有的高机械应力 [CE012]。虽然
              Aucotec Engineering Base 平台集中管理工程文档，确保各学科电气和工艺工程跟踪一致 [CE008, CE009]，Sunfire 没有公开的开发者软件代码库或开源 SDK [CE012]。
              与下游客户 SCADA 系统的技术集成依赖工业现场总线协议，需要定制现场集成而非即插即用连接 [CE012]。此外，一般技术搜索经常抓到印度 IT 服务商 Sunfire Technologies、国防承包商
              Sunfire Solutions 和旧 Sun Microsystems 服务器硬件（Oracle SunFire X4170）等同名实体， 说明必须将 Sunfire GmbH 的专业电解业务与无关 IT
              服务隔离 [CE013, CE014, CE015]。
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE012
              - CE013
              - CE014
              - CE015
      - number: '5.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 30-Bar 加压运行省去首级压缩
            body: >-
              Sunfire 第二代碱性电堆选择 30 bar 直接运行压力，相比大气压系统具有显著的运营和资本优势；后者需要复杂的多级气体压缩机才能达到工业管道
              压力。省去初始机械压缩可削减工厂资本支出，降低寄生能量损失，并消除重工业氢气运营中出了名的维护瓶颈。
            calloutType: strength
            claimRefs:
              - CE006
          - type: callout
            title: 工业工程现实限制开发者社区信号
            body: >-
              与软件规模化企业不同，Sunfire 处于重工业工厂工程领域，技术通过 EPC 合同、专有 PLC 控制和 Aucotec Engineering Base 等专业 CAE 平台交付。 公司没有公开开发者 SDK
              或开源代码库；开发者信号应通过专业工程软件合作关系解读，而技术尽调则必须仔细审查间歇性可再生能源循环下的专有电堆衰减数据。
            calloutType: risk
            claimRefs:
              - CE008
              - CE012
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与买方画像
        blocks:
          - type: paragraph
            body: >-
              Sunfire 的主要客户是资本密集型工业运营商，他们正从化石原料转向绿氢和合成碳氢化合物。目标买方所在行业具有连续的热工和化工流程，
              主要包括化工合成、石化炼制、化肥制造和直接还原铁炼钢。由于电解槽属于工厂配套基础设施，需要数亿欧元资本支出，购买中心通常需要董事会
              层面的资本配置审批、工厂运营批准，以及与区域输电系统运营商联合协调。除商业工业承购方外，市政公用事业和清洁技术项目联盟也是次级买方，
              寻求区域脱碳资产。商业化受漫长工程周期支配，项目必须先后经过可行性研究、前端工程设计、公共补贴资格审核和双边购电合同，才会作出具有约束力 的最终投资决定。
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: table
            tableRef: TU001
            claimRefs:
