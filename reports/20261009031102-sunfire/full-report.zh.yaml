figures:
  - id: FO001
    title: Sunfire 公司基础、技术创新与规模里程碑
    type: timeline
    summary: 按时间梳理 Sunfire 自 2010 年在德累斯顿成立以来，发展至数千兆瓦级 Series E 规模化阶段的里程碑。
    data:
      items:
        - label: '2010'
          title: Corporate Foundation in Dresden
          detail: Nils Aldag 和 Christian Olshausen 在德国德累斯顿创立公司，开发高温电解技术。
        - label: '2015'
          title: Handelsblatt Energy Award
          detail: 凭借开创性可逆电解系统，赢得 Handelsblatt Energy Award 工业类别奖项。
        - label: '2016'
          title: Fast Company & Climate Awards
          detail: 被 Fast Company 评为最具创新力能源公司第 8 名；赢得 ASUE Innovation & Climate Protection Award。
        - label: '2017'
          title: Kanthal Award for e-Fuel Synthesis
          detail: 凭借利用 CO2、蒸汽和可再生电力生产工业电子燃料，获得 Kanthal Award。
        - label: '2020'
          title: Multi-Site German Footprint
          detail: 扩大德国制造网络，在索林根和马格德堡设立生产基地。
        - label: '2024'
          title: EUR 500M+ Financing Milestone
          detail: 获得具有里程碑意义的 EUR 215M Series E 股权融资、EUR 100M EIB 风险债务和 EUR 200M 公共资助。
        - label: '2026'
          title: Industrial Deployment & 700+ Team
          detail: 员工规模超过 700 人，推进兆瓦级加压碱性电解和 SOEC 部署。
        - label: '2030'
          title: Multi-Gigawatt Installation Target
          detail: 公司战略目标是在重工业领域部署数千兆瓦级电解槽系统。
    approximationNotes: 时间线里程碑整理自 Sunfire 官方公司历史和经核实的行业奖项档案；省略中间阶段的私有试点投产日期。
    claimRefs:
      - CO001
      - CO004
      - CO006
      - CO009
      - CO014
      - CO015
  - id: FM001
    title: 工业电解的受限市场规模测算架构
    type: pyramid
    summary: 六层规模测算结构，展示从不受约束的全球氢能需求到近期已签约设备采购的漏斗。
    data:
      items:
        - label: 理论全球需求
          detail: 重工业领域以全球不受约束的工业氢能需求替代为目标的规模
        - label: 总可用市场（TAM）
          detail: 加压碱性电解和高温 SOEC 系统可覆盖的全球工业设备资本开支
        - label: 可服务市场（SAM）
          detail: 受欧盟 RED III 和 IPCEI 要求约束的欧洲兆瓦级工业设备支出
        - label: 可获取市场（SOM）
          detail: 即将达到 FID、已确认公共共同融资且签有约束性承购合同的项目
        - label: 近期合格项目储备
          detail: 已完成前端工程设计（FEED）研究的活跃工业投标
        - label: 已签约执行积压
          detail: 正在制造、进行工厂验收或现场交付的确定性采购订单
    approximationNotes: 工业电解槽市场层级的概念性结构；规模反映项目推进关卡，而非单点预测。
    claimRefs:
      - CM005
      - CM006
      - CM007
  - id: FP001
    title: 竞争证据置信度图
    type: quadrant
    summary: 序数评分显示现有证据的广度和时效性是否足以支撑竞争分析。
    data:
