  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与工业客户工作流
        blocks:
          - type: paragraph
            body: >-
              Sunfire 提供公用事业级和工业级电解硬件，旨在替代石油炼化、化工合成和绿氨生产等高碳行业使用的化石来源氢气。核心工业客户工作流从
              大规模可再生电力采购和去矿化水进水开始，经过高压电解堆运行、气体分离、脱氧干燥，最终输送至管道 [CE001]。过去，工业工厂运营商
              面临显著的工厂配套（BoP）集成难题，需要定制室内设施、独立气体压缩机和复杂的现场管道网络 [CE002]。随着 Sunfire 于 2026 年 4 月 发布 HyLink Alkaline
              23，公司将主要产品从离散的室内 10-MW 模块转为统一的预制 50-MW 室外电解槽系统 [CE003]。该设计把中央冷却和 工厂配套接口直接集成进预制撬装，直接回应项目开发商的工程和 EPC 工作流
              [CE004]。因此，对于标准 100-MW 绿氢项目，客户工程团队部署 两台 50-MW 室外设备，而不是十个 10-MW 室内模块，完全省去专用电解槽厂房的资本成本和土建延误。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
