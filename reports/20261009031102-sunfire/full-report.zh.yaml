      - number: '1.3'
        title: 资本化历程、主权债务工具与利益相关方图谱
        blocks:
          - type: paragraph
            body: >
              Sunfire 的资产负债表和融资能力通过一揽子超过 EUR 500 million 的标志性 Series E 融资大幅扩张。该结构包括 EUR 215 million 的直接风险
              股权、欧洲投资银行（EIB）提供的最高 EUR 100 million 风险债务授信，以及约 EUR 200 million 已预分配但尚未提取的主权赠款。股权银团
              包括机构气候投资者和战略资产管理机构；EquityZen 等二级平台则跟踪 IPO 前投资者兴趣。外部市场情报机构将 Sunfire 的投后估值评为约 $1.1 billion 至 $1.7
              billion，但公司对精确股权结构表、清算优先权和持股比例严格保密。公开市场检索经常把这家德国工业 OEM 与无关实体 混淆，包括美国医疗 SaaS 公司 SunFire Inc、住宅承包商 Sunfire
              Construction Inc 和 IT 服务商 Sunfire Solutions；严谨尽调必须隔离德累斯顿实体 的主权支持工业业务。
