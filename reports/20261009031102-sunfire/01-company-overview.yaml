company:
  name: "Sunfire"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Sunfire is a German industrial cleantech manufacturer founded in 2010 in Dresden, specializing in pressurized alkaline and high-temperature solid oxide electrolysis cells (SOEC) for green hydrogen and syngas production. The company has secured over EUR 500 million in Series E equity, European Investment Bank debt, and grant commitments to expand multi-gigawatt manufacturing capacity across Germany, led by co-founder and CEO Nils Aldag and CTO Christian Olshausen. While its industrial footprint spans over 700 employees and multi-hundred-megawatt order books, audited financial figures including ARR, cash burn, and customer counts remain private."
sections:
  - id: "corporate-identity-and-mission"
    title: "Corporate Identity, Foundation, and Industrial Mission"
    body: >
      Sunfire (Sunfire GmbH) is an industrial electrolysis manufacturer founded in 2010 and headquartered in Dresden,
      Germany. The company develops and manufactures utility- and industrial-scale electrolyzer systems engineered to
      decarbonize heavy industry, chemicals, and energy infrastructure. Sunfire operates across two core electrochemical
      technology platforms: pressurized alkaline electrolysis for proven, large-scale green hydrogen generation, and
      high-temperature solid oxide electrolysis cells (SOEC), which utilize industrial waste heat and steam to produce
      hydrogen or syngas at superior electrical efficiency. The corporate mission centers on providing industrial
      substitutes for fossil oil and natural gas—specifically renewable e-Fuels, e-Gas, and e-Chemicals—integrating directly
      into existing pipelines and refining infrastructure. Operating as a Series E cleantech scale-up, Sunfire positions
      its manufacturing and engineering base across Germany, maintaining facilities in Dresden, Solingen, and Magdeburg,
      alongside a strategic corporate office in Berlin.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance"
    title: "Executive Leadership, Governance, and Key-Person Architecture"
    body: >
      Sunfire's executive management is directed by co-founder and Chief Executive Officer Nils Aldag, alongside co-founder
      and Chief Technology Officer Christian Olshausen. The leadership team combines deep technical expertise in solid-state
      electrochemistry and process engineering with specialized capital-markets execution across the European cleantech
      ecosystem. Under their direction over the past decade and a half, Sunfire transitioned from an early Dresden research
      spin-out into a scaled industrial equipment supplier with over 700 dedicated specialists. Governance and board oversight
      reflect the complex capital structure of a heavily capitalized German GmbH/SE entity backed by leading international
      climate-tech venture funds, strategic industrial corporates, and sovereign development banks. Given the highly
      specialized nature of high-temperature SOEC ceramics and industrial stack fabrication, technical leadership exhibits
      material key-person concentration around its founding team, particularly regarding proprietary manufacturing processes
      and strategic European project partnerships.
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-stakeholder-map"
    title: "Capitalization History, Sovereign Debt Facilities, and Stakeholder Mapping"
    body: >
      Sunfire's balance sheet and capital access expanded significantly through a landmark Series E financing package
      totaling more than EUR 500 million. This milestone structure integrated EUR 215 million in direct venture equity,
      up to EUR 100 million in venture debt credit lines extended by the European Investment Bank (EIB), and approximately
      EUR 200 million in pre-allocated, undrawn sovereign grants. The equity syndicate features institutional climate
      investors and strategic asset managers, while secondary platforms like EquityZen track pre-IPO investor interest.
      External market intelligence profiles evaluate Sunfire's post-money valuation at approximately $1.1 billion to $1.7 billion,
      though the company maintains strict confidentiality regarding its precise cap table, liquidation preferences, and
      ownership percentages. Public-market search queries frequently confuse the German industrial OEM with unrelated entities
      including US healthcare SaaS firm SunFire Inc, residential contractor Sunfire Construction Inc, or IT provider Sunfire
      Solutions; rigorous diligence requires isolating the Dresden entity's sovereign-backed industrial accounts.
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
  - id: "scale-indicators-and-operational-milestones"
    title: "Industrial Scale Indicators, Core Metrics, and Milestone Evolution"
    body: >
      Across its fifteen-year operational history, Sunfire evolved from bench-scale electrochemical demonstrations to an
      industrial manufacturer maintaining over 700 employees and multi-gigawatt target production capacity across its Dresden,
      Solingen, and Magdeburg sites. The company has accumulated fifteen-plus years of industrial green hydrogen project
      experience, targeting multi-gigawatt total installed capacity by 2030. Key milestones span the 2015 Handelsblatt Energy
      Award for reversible electrolysis, the 2016 Fast Company Most Innovative Companies ranking, the 2017 Kanthal Award for
      e-Fuel synthesis, and recurring recognition across seven editions of the Global Cleantech 100. Despite its extensive
      industrial footprint, Sunfire operates under a private disclosure profile: audited annual revenues, ARR, customer account
      counts, and gross margins remain undisclosed. Diligence requires auditing confidential project milestone schedules,
      fleet degradation curves, and subsidy disbursement timelines rather than unverified commercial aggregators.
    claimRefs:
      - "CO014"
      - "CO015"
      - "CO016"
