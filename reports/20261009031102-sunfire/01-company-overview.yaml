callouts:
  - calloutType: "insight"
    title: "Strategic Entity Disambiguation Is Essential for Underwriting Accuracy"
    body: >
      Automated financial scrapers and web search aggregators frequently conflate Sunfire GmbH with unrelated entities,
      notably US Medicare software firm SunFire Inc (getlatka.com reporting $169.6M ARR), California residential installer
      Sunfire Construction Inc (consumer pricing complaints on solarreviews.com), and Virginia IT shop Sunfire Solutions
      (Tracxn). Analysts and underwriters must strictly isolate Sunfire GmbH (Dresden, Germany; sunfire.de), verifying
      all financial metrics against German commercial registry filings and official Series E disclosures.
    claimRefs:
      - "CO011"
      - "CO012"
      - "CO013"
