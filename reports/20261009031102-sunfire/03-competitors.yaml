callouts:
  - calloutType: "risk"
    title: "Do not price a competitive moat from this public evidence set"
    body: >-
      Dual-technology breadth is visible, but named-peer economics, current scale, distribution
      power, switching costs, and independent performance evidence are not. A clean peer dataset
      and customer-level commercial evidence are prerequisites for a moat conclusion.
    claimRefs: ["CP002", "CP005", "CP009", "CP016"]
