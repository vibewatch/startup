      - ["Contract and discount model", null, null, "Unsupported", "Framework terms, milestone payments, discounts, cancellation rights, and escalation clauses"]
      - ["Warranty, service, and lifecycle cost", null, null, "Unsupported", "Warranty schedules, availability guarantees, service attachment, replacement cost, and degradation data"]
    notes: "No retained target-company source discloses comparable commercial terms; null means undisclosed in this evidence set."
    claimRefs: ["CP016"]
