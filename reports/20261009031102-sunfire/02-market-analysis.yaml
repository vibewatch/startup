callouts:
  - calloutType: "insight"
    title: "Power PPA Economics Exert Greater Influence on Adoption Than Stack CAPEX"
    body: "Across industrial buyer segments, levelized cost of hydrogen calculations reveal that electricity operating expenditure comprises seventy to eighty percent of total thirty-year plant cost. While electrolyzer capital expenditure per kilowatt determines upfront financing scale, industrial customers delay final investment decisions primarily due to volatile power purchase agreement (PPA) pricing and grid congestion rather than OEM equipment cost differences."
    claimRefs:
      - "CM011"
      - "CM012"
      - "CM015"
