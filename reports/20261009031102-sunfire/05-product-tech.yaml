chapter:
  number: 5
  title: "Product & Technology"
  summary: "Sunfire manufactures industrial-scale green hydrogen electrolyzer systems utilizing pressurized alkaline and high-temperature solid oxide electrolysis cell (SOEC) technologies. In 2026, the company introduced its next-generation HyLink Alkaline 23 50-MW outdoor module based on proven 30-bar pressurized stack technology to dramatically reduce total installed costs for multi-hundred-megawatt projects. While its hardware scale-up and enterprise engineering standardization via Aucotec's Engineering Base provide strong industrial differentiation, broader software, developer interfaces, and customer-side automation remain constrained by industrial plant engineering realities."
sections:
  - id: "product-definition-workflow"
    title: "Product Definition and Industrial Customer Workflow"
    body: "Sunfire delivers utility- and industrial-scale electrolysis hardware designed to replace fossil-derived hydrogen in carbon-heavy sectors such as petroleum refining, chemical synthesis, and green ammonia production. The core industrial customer workflow transitions from large-scale renewable power sourcing and demineralized water intake through high-pressure electrolysis stack operations, gas separation, and deoxygenation drying to pipeline delivery [CE001]. Historically, industrial plant operators faced significant balance-of-plant (BoP) integration hurdles, requiring custom indoor facilities, separate gas compressors, and complex field piping networks [CE002]. With the launch of the HyLink Alkaline 23 system in April 2026, Sunfire shifted its primary product definition from discrete indoor 10-MW building blocks to a unified, prefabricated 50-MW outdoor electrolyzer system [CE003]. This system design directly addresses the plant developer's engineering and EPC workflow by integrating central cooling and balance-of-plant interfaces directly into the prefabricated skid [CE004]. Consequently, for a standard 100-MW green hydrogen project, customer engineering teams deploy two 50-MW outdoor units rather than ten 10-MW indoor modules, completely eliminating the capital cost and civil construction delay of a dedicated electrolyzer building [CE005]."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
    tableRefs:
      - "TE002"
  - id: "architecture-and-operating-model"
    title: "Technology Architecture and Operating Stack"
    body: "Sunfire's technology architecture spans two distinct electrochemical platforms: pressurized alkaline electrolysis and high-temperature solid oxide electrolysis cells (SOEC) [CE001]. The mainstream multi-megawatt commercial workhorse is the HyLink Alkaline platform, centered on Sunfire's proprietary second-generation 30-bar(g) pressurized alkaline stack [CE006]. Operating at 30 bar direct stack pressure represents a critical mechanical and thermodynamic design choice: it delivers green hydrogen at elevated pipeline pressures directly from the stack, thereby eliminating or drastically downsizing downstream mechanical compression equipment [CE006]. The physical hardware stack comprises five integrated layers: stack electrochemistry (bipolar plates, diaphragms, and electrodes), balance-of-plant mechanical systems (gas-liquid separators, lye circulation pumps, heat exchangers, and integrated air cooling), power conversion (rectifiers and medium-voltage transformers), industrial instrumentation and safety control (fail-safe PLCs, gas detection, overpressure vents), and an engineering data layer [CE007]. To standardize plant design and accelerate multi-discipline project engineering across electrical, mechanical, and piping domains, Sunfire transitioned its engineering toolchain to Aucotec's object-oriented Engineering Base (EB) cooperation platform [CE008]. This data-driven engineering architecture allows Sunfire to design standardized, modularized functional assemblies with open APIs for automated change management and configuration control [CE009]."
    claimRefs:
      - "CE001"
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "product-portfolio-and-differentiation"
    title: "Product Portfolio, Technical Differentiation, and Scale-up Maturity"
    body: "Sunfire's commercial portfolio is segmented across high-capacity pressurized alkaline systems (HyLink Alkaline) and high-efficiency solid oxide systems (HyLink SOEC) [CE001]. The commercial focus for gigawatt-pipeline industrial tenders is HyLink Alkaline 23, which scales unit capacity to 50 MW per module while maintaining 30-bar pressurized operation [CE003, CE006]. Technical differentiation rests on five core engineering levers identified by Sunfire management: a fivefold increase in module capacity (from 10 MW to 50 MW), complete outdoor operating capability that removes costly shelter buildings, standardized integration of plant interfaces and air cooling, a high degree of factory prefabrication, and validation on operating industrial customer sites across Europe [CE010]. In customer installations, Sunfire claims these levers combine to decrease total installed costs (TIC) by up to 50 percent compared to predecessor installations [CE003, CE010]. In addition, Sunfire's repeat order profile from existing European industrial accounts reflects a maturity level built over 16 years of deploying systems from kilowatt demonstrations to triple-digit megawatt industrial plants [CE011]. However, developer and software integration remains governed by classical industrial automation protocols rather than public developer-facing APIs, and public disclosure regarding operating stack degradation curves under intermittent renewable load profiles remains limited [CE012]."
    claimRefs:
      - "CE001"
      - "CE003"
      - "CE006"
      - "CE010"
      - "CE011"
      - "CE012"
    tableRefs:
      - "TE001"
  - id: "reliability-compliance-and-risks"
    title: "Reliability, Industrial Safety, Compliance, and Technical Risks"
    body: "Industrial green hydrogen generation involves stringent process safety, chemical compliance, and electrical grid interconnection standards. Sunfire's pressurized alkaline units operate with concentrated potassium hydroxide (KOH) electrolyte under 30 bar pressure, requiring rigorous pressure equipment compliance (PED / ASME), ATEX / IECEx explosion protection, and multi-layered functional safety architectures (SIL ratings) [CE006, CE007]. Operational risks center on dynamic thermal management, diaphragm degradation, gas crossover under partial load cycling, and high mechanical stresses inherent in high-pressure alkaline systems [CE012]. While Aucotec's Engineering Base platform centralizes engineering documentation and ensures consistent electrical and process engineering tracking across disciplines [CE008, CE009], Sunfire maintains zero public developer software repositories or open-source SDKs [CE012]. Technical integration with downstream customer SCADA systems relies on industrial fieldbus protocols, requiring customized site integration rather than plug-and-play connectivity [CE012]. In parallel, general technical searches frequently pick up homonymous entities such as IT services provider Sunfire Technologies in India, defense contractor Sunfire Solutions, and legacy Sun Microsystems server hardware (Oracle SunFire X4170), highlighting the necessity of isolating Sunfire GmbH's specialized electrolysis operations from unrelated IT services [CE013, CE014, CE015]."
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE012"
      - "CE013"
      - "CE014"
      - "CE015"
