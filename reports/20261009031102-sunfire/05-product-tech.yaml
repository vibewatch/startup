callouts:
  - calloutType: "strength"
    title: "Pressurized 30-Bar Operation Eliminates First-Stage Compression"
    body: "Sunfire's choice of 30 bar direct operating pressure in its second-generation alkaline stack provides a major operational and capital advantage over atmospheric systems, which require complex multi-stage gas compressors to reach industrial pipeline pressures. Eliminating initial mechanical compression cuts plant capital expenditure, lowers parasitic energy losses, and removes a notorious maintenance bottleneck in heavy industrial hydrogen operations."
    claimRefs:
      - "CE006"
  - calloutType: "risk"
    title: "Industrial Engineering Realities Constrain Developer Community Signal"
    body: "Unlike software scale-ups, Sunfire operates within the heavy industrial plant engineering domain where technology is delivered through EPC contracts, proprietary PLC controls, and specialized CAE platforms like Aucotec Engineering Base. There are no public developer SDKs or open-source repositories; developer-signal requirements must be interpreted through professional engineering software partnerships, while technical diligence must scrutinize proprietary stack degradation data under intermittent renewable cycling."
    claimRefs:
      - "CE008"
      - "CE012"
