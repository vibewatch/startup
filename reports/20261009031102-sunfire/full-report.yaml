            body: >
              Sunfire's capital structure was substantially fortified on March 5, 2024, through a capital package
              exceeding EUR 500 million. This package comprised EUR 215 million in Series E equity financing led by LGT
              Private Banking, GIC, Ahren Innovation Capital, and Carbon Equity (with follow-on participation from
              Lightrock, Planet First Partners, Carbon Direct Capital, Amazon Climate Pledge Fund, and Blue Earth
              Capital), up to EUR 100 million in venture debt credit facilities from the European Investment Bank (EIB),
              and approximately EUR 200 million in pre-approved, undrawn public grant funding. The business remains
              highly capital intensive, requiring continuous capital expenditure for automated stack manufacturing lines
              and test benches. Because public data lacks ongoing cash burn rates, operational cash flows, and covenant
              details for the EIB term loan, Sunfire's financial profile presents high strategic relevance but remains
