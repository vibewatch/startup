      - number: '5.3'
        title: Product Portfolio, Technical Differentiation, and Scale-up Maturity
        blocks:
          - type: paragraph
            body: >-
              Sunfire's commercial portfolio is segmented across high-capacity pressurized alkaline systems (HyLink
              Alkaline) and high-efficiency solid oxide systems (HyLink SOEC) [CE001]. The commercial focus for
              gigawatt-pipeline industrial tenders is HyLink Alkaline 23, which scales unit capacity to 50 MW per module
              while maintaining 30-bar pressurized operation [CE003, CE006]. Technical differentiation rests on five
              core engineering levers identified by Sunfire management: a fivefold increase in module capacity (from 10
              MW to 50 MW), complete outdoor operating capability that removes costly shelter buildings, standardized
              integration of plant interfaces and air cooling, a high degree of factory prefabrication, and validation
              on operating industrial customer sites across Europe [CE010]. In customer installations, Sunfire claims
              these levers combine to decrease total installed costs (TIC) by up to 50 percent compared to predecessor
              installations [CE003, CE010]. In addition, Sunfire's repeat order profile from existing European
              industrial accounts reflects a maturity level built over 16 years of deploying systems from kilowatt
              demonstrations to triple-digit megawatt industrial plants [CE011]. However, developer and software
              integration remains governed by classical industrial automation protocols rather than public
              developer-facing APIs, and public disclosure regarding operating stack degradation curves under
              intermittent renewable load profiles remains limited [CE012].
            claimRefs:
              - CE001
              - CE003
              - CE006
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE001
            claimRefs:
