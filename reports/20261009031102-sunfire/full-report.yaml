  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Commercial Revenue Model, Equipment Sales, and Pricing Realities
        blocks:
          - type: paragraph
            body: >
              Sunfire's commercial model centers on industrial-scale B2B capital equipment sales of pressurized alkaline
              (AEL) and solid oxide electrolysis (SOEC) systems. Systems are deployed in energy-intensive transformation
              facilities, refineries, and synthetic fuel plants to produce renewable hydrogen, e-methane, and
              e-chemicals. Realized unit pricing is contract-specific and negotiated on a per-megawatt multi-year basis
              rather than published as standard list prices. Commercial contracts typically feature milestone-based
              progress billing across FEED study, engineering, stack manufacturing, factory testing, site commissioning,
              and balance-of-plant delivery. In addition to initial hardware sales, Sunfire models recurring revenue
              streams from multi-year maintenance agreements, proprietary SOEC stack refurbishment, remote plant
              monitoring, and consumable component replacement. However, realized revenue mix, recurring contract
              duration, customer cancellation protections, and audited revenue recognition schedules remain strictly
              undisclosed in public domain documents.
