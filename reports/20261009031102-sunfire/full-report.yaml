  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Industrial Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Sunfire delivers utility- and industrial-scale electrolysis hardware designed to replace fossil-derived
              hydrogen in carbon-heavy sectors such as petroleum refining, chemical synthesis, and green ammonia
              production. The core industrial customer workflow transitions from large-scale renewable power sourcing
              and demineralized water intake through high-pressure electrolysis stack operations, gas separation, and
              deoxygenation drying to pipeline delivery [CE001]. Historically, industrial plant operators faced
              significant balance-of-plant (BoP) integration hurdles, requiring custom indoor facilities, separate gas
              compressors, and complex field piping networks [CE002]. With the launch of the HyLink Alkaline 23 system
              in April 2026, Sunfire shifted its primary product definition from discrete indoor 10-MW building blocks
              to a unified, prefabricated 50-MW outdoor electrolyzer system [CE003]. This system design directly
              addresses the plant developer's engineering and EPC workflow by integrating central cooling and
              balance-of-plant interfaces directly into the prefabricated skid [CE004]. Consequently, for a standard
              100-MW green hydrogen project, customer engineering teams deploy two 50-MW outdoor units rather than ten
              10-MW indoor modules, completely eliminating the capital cost and civil construction delay of a dedicated
              electrolyzer building [CE005].
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE008
              - CE009
              - CE010
      - number: '5.2'
        title: Technology Architecture and Operating Stack
        blocks:
          - type: paragraph
            body: >-
              Sunfire's technology architecture spans two distinct electrochemical platforms: pressurized alkaline
              electrolysis and high-temperature solid oxide electrolysis cells (SOEC) [CE001]. The mainstream
              multi-megawatt commercial workhorse is the HyLink Alkaline platform, centered on Sunfire's proprietary
              second-generation 30-bar(g) pressurized alkaline stack [CE006]. Operating at 30 bar direct stack pressure
              represents a critical mechanical and thermodynamic design choice: it delivers green hydrogen at elevated
              pipeline pressures directly from the stack, thereby eliminating or drastically downsizing downstream
              mechanical compression equipment [CE006]. The physical hardware stack comprises five integrated layers:
              stack electrochemistry (bipolar plates, diaphragms, and electrodes), balance-of-plant mechanical systems
              (gas-liquid separators, lye circulation pumps, heat exchangers, and integrated air cooling), power
              conversion (rectifiers and medium-voltage transformers), industrial instrumentation and safety control
              (fail-safe PLCs, gas detection, overpressure vents), and an engineering data layer [CE007]. To standardize
              plant design and accelerate multi-discipline project engineering across electrical, mechanical, and piping
              domains, Sunfire transitioned its engineering toolchain to Aucotec's object-oriented Engineering Base (EB)
              cooperation platform [CE008]. This data-driven engineering architecture allows Sunfire to design
              standardized, modularized functional assemblies with open APIs for automated change management and
              configuration control [CE009].
            claimRefs:
              - CE001
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
