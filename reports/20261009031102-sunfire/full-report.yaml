      - number: '4.2'
        title: Manufacturing Cost Structure, Margin Drivers, and Unit Economics
        blocks:
          - type: paragraph
            body: >
              The cost structure for industrial electrolyzers is dominated by high-precision electrochemical components,
              specialized metallurgical inputs, automated stack assembly tooling, cleanroom fabrication, and
              balance-of-plant integration. Gross margins are highly sensitive to manufacturing capacity utilization
              across the Dresden facilities, yield rates on ceramic cell production for high-temperature solid oxide
              stacks, and warranty allocations against field degradation. While early-stage and pilot industrial
              deployments often incur high service-delivery overhead and negative project gross margins, scaled
              multi-megawatt systems target positive unit contribution margins once tooling amortization is absorbed.
              Neither Sunfire nor its lead venture backers have publicly disclosed audited unit gross margin
              percentages, bill-of-materials breakdowns, or standardized customer acquisition cost metrics. Underwriting
              the company's long-term margin path requires direct diligence access to plant-level cost accounting, stack
              durability degradation curves, and warranty reserve provisions.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
