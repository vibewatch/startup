        - Complex capital structure, heavy liquidation preferences, and high capital intensity of gigafactory ramp
        - Operating cash burn and gross margin trajectory
      - - Commercial Trajectory
        - HydrogenOne reports 10x revenue expansion from 2021 to 2023 with robust pipeline
        - Revenue figures lack audited margin breakdown, warranty reserve provisions, and recurring service share
        - Audited income statements and contribution margin disclosure
    notes: Pillars contrast affirmative industrialization potential against private market financial and execution risks.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
  - id: TV003
    title: Multi-Scenario Valuation and Return Framework
    columns:
      - Scenario
      - Operating and Market Assumptions
      - Implied Valuation Stance
      - Key Trigger Events
    rows:
      - - Bull Case
        - Accelerated European hydrogen rollouts; SOEC reaches gigawatt commercial scale; sustained gross margins >20%
        - Substantial premium to prior round; attractive exit via industrial trade sale or strategic IPO
        - Mandatory green fuel quotas enforced; repeat megawatt-scale orders from steel and chemical clients
      - - Base Case
        - >-
          Steady alkaline capacity ramp; SOEC deployed in select flagship projects; gradual revenue growth with
          break-even post-2027
        - Valuation in line with Series E baseline; moderate dilution from working capital debt facilities
        - Execution of committed backlogs; utilization of EIB EUR 100M facility without distress
      - - Bear Case
        - Power-to-X project cancellations; high electricity prices delay green hydrogen parity; high warranty claims
        - Stretched or down-round valuation; senior debt and preference overhang severely impair common equity
        - Subsidy rollbacks; loss of key industrial off-takers; failure to achieve positive unit margins
    notes: Scenarios map operating dependencies to return profiles under unverified private baseline valuations.
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV009
figures:
  - id: FO001
    title: Sunfire Corporate Foundation, Technology Innovation, and Scale Milestones
    type: timeline
    summary: >-
      Chronological milestone sequence tracing Sunfire's evolution from 2010 founding in Dresden to multi-gigawatt
      Series E scale-up.
    data:
      items:
        - label: '2010'
          title: Corporate Foundation in Dresden
          detail: Founded in Dresden, Germany, by Nils Aldag and Christian Olshausen to develop high-temperature electrolysis.
        - label: '2015'
          title: Handelsblatt Energy Award
          detail: Wins Handelsblatt Energy Award in the Industry category for pioneering reversible electrolysis systems.
        - label: '2016'
          title: Fast Company & Climate Awards
          detail: Ranked 8th most innovative energy company by Fast Company; wins ASUE Innovation & Climate Protection Award.
        - label: '2017'
          title: Kanthal Award for e-Fuel Synthesis
          detail: Awarded Kanthal Award for industrial e-Fuel production utilizing CO2, steam, and renewable power.
        - label: '2020'
          title: Multi-Site German Footprint
          detail: Expands manufacturing network across Germany, establishing production sites in Solingen and Magdeburg.
        - label: '2024'
          title: EUR 500M+ Financing Milestone
          detail: Secures landmark EUR 215M Series E equity, EUR 100M EIB venture debt, and EUR 200M in public grants.
        - label: '2026'
          title: Industrial Deployment & 700+ Team
          detail: Scales workforce beyond 700 employees, executing multi-megawatt pressurized alkaline and SOEC deployments.
        - label: '2030'
          title: Multi-Gigawatt Installation Target
          detail: >-
            Strategic corporate target to install several gigawatts of electrolyzer systems across heavy industrial
            sectors.
    approximationNotes: >-
      Timeline milestones compiled from official Sunfire corporate history and verified industry award archives;
      intermediate private pilot commissioning dates omitted.
