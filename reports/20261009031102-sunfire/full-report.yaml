  - id: FM001
    title: Constrained Market Sizing Architecture for Industrial Electrolysis
    type: pyramid
    summary: >-
      Six-tiered sizing structure illustrating the funnel from unconstrained global hydrogen demand to contracted
      near-term equipment procurement.
    data:
      items:
        - label: Theoretical Global Demand
          detail: Global unconstrained industrial hydrogen demand replacement across heavy industries
        - label: Total Addressable Market (TAM)
          detail: Global industrial equipment capex addressable by pressurized alkaline and high-temperature SOEC systems
        - label: Serviceable Available Market (SAM)
          detail: European multi-megawatt industrial equipment spend governed by EU RED III and IPCEI mandates
        - label: Serviceable Obtainable Market (SOM)
          detail: Near-term projects reaching FID with confirmed public co-funding and binding off-take contracts
        - label: Near-Term Qualified Pipeline
          detail: Active industrial bids with completed front-end engineering design (FEED) studies
        - label: Contracted Execution Backlog
          detail: Firm purchase orders undergoing manufacturing, factory acceptance, or site delivery
    approximationNotes: >-
      Conceptual structuring of industrial electrolyzer market tiers; sizing reflects project progression gates rather
      than single point forecasts.
