      - number: '1.4'
        title: Industrial Scale Indicators, Core Metrics, and Milestone Evolution
        blocks:
          - type: paragraph
            body: >
              Across its fifteen-year operational history, Sunfire evolved from bench-scale electrochemical
              demonstrations to an industrial manufacturer maintaining over 700 employees and multi-gigawatt target
              production capacity across its Dresden, Solingen, and Magdeburg sites. The company has accumulated
              fifteen-plus years of industrial green hydrogen project experience, targeting multi-gigawatt total
              installed capacity by 2030. Key milestones span the 2015 Handelsblatt Energy Award for reversible
              electrolysis, the 2016 Fast Company Most Innovative Companies ranking, the 2017 Kanthal Award for e-Fuel
              synthesis, and recurring recognition across seven editions of the Global Cleantech 100. Despite its
              extensive industrial footprint, Sunfire operates under a private disclosure profile: audited annual
              revenues, ARR, customer account counts, and gross margins remain undisclosed. Diligence requires auditing
              confidential project milestone schedules, fleet degradation curves, and subsidy disbursement timelines
              rather than unverified commercial aggregators.
