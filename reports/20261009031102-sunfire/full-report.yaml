  - id: FE001
    title: Sunfire electrolyzer technology and systems architecture
    type: stack
    summary: >-
      Six-layer industrial architecture spanning electrochemical stack core, mechanical balance of plant, electrical
      conversion, safety automation, control telemetry, and digital engineering data management.
    data:
      layers:
        - label: Engineering & Data Layer
          detail: >-
            Aucotec Engineering Base cooperation platform managing object-oriented plant data, electrical schematics,
            and cross-disciplinary change tracking
        - label: Plant Automation & Control Layer
          detail: >-
            Industrial SCADA telemetry gateways, fieldbus interfaces, remote monitoring, and operating sequence
            automation
        - label: Plant Safety & Protection Layer
          detail: >-
            Redundant safety PLCs, ATEX-compliant gas detection, automated pressure relief, and emergency containment
            interlocks
        - label: Power Conversion Layer
          detail: >-
            Medium-voltage transformers and multi-pulse rectifiers converting grid/renewable AC power to regulated
            high-current DC stack supply
        - label: Balance of Plant (BoP) Layer
          detail: >-
            30-bar gas-liquid separation, KOH electrolyte circulation, integrated air-cooling radiators, and
            deoxygenation drying units
        - label: Electrochemical Stack Core Layer
          detail: >-
            Second-generation pressurized alkaline stack operating at 30 bar(g) delivering industrial green hydrogen
            directly at pressure
    approximationNotes: >-
      Logical architectural representation based on published Sunfire HyLink system boundaries and Aucotec engineering
      platform integration specifications.
    claimRefs:
      - CE003
      - CE006
      - CE007
      - CE008
      - CE009
