    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Industrial Mission
        blocks:
          - type: paragraph
            body: >
              Sunfire (Sunfire GmbH) is an industrial electrolysis manufacturer founded in 2010 and headquartered in
              Dresden, Germany. The company develops and manufactures utility- and industrial-scale electrolyzer systems
              engineered to decarbonize heavy industry, chemicals, and energy infrastructure. Sunfire operates across
              two core electrochemical technology platforms: pressurized alkaline electrolysis for proven, large-scale
              green hydrogen generation, and high-temperature solid oxide electrolysis cells (SOEC), which utilize
              industrial waste heat and steam to produce hydrogen or syngas at superior electrical efficiency. The
              corporate mission centers on providing industrial substitutes for fossil oil and natural gas—specifically
              renewable e-Fuels, e-Gas, and e-Chemicals—integrating directly into existing pipelines and refining
              infrastructure. Operating as a Series E cleantech scale-up, Sunfire positions its manufacturing and
              engineering base across Germany, maintaining facilities in Dresden, Solingen, and Magdeburg, alongside a
              strategic corporate office in Berlin.
