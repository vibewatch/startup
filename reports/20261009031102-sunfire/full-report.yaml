          phase: 'Stage 6: Multi-Hundred MW Scaling'
          actor: Executive Leadership & Plant Expansion Committee
          touchpoints: Replication across sibling refinery/chemical sites, multi-module volume procurement.
  - id: FR001
    title: Risk Severity and Likelihood Assessment Matrix
    type: matrix
    summary: Evaluation of primary risk dimensions across likelihood, impact, and mitigation maturity.
    data:
      columns:
        - Low Likelihood
        - Medium-Low Likelihood
        - Medium Likelihood
        - Medium-High Likelihood
        - High Likelihood
        - Very High Likelihood
      rows:
        - label: Critical Severity
          values:
            - Severe Catastrophic Plant Failure
            - Loss of Key IP Rights
            - Unchecked High SOEC Degradation
            - Major Customer Project Cancellation
            - Withdrawal of EU Subsidy Awards
            - Terminal Liquidity Shortfall
        - label: High Severity
          values:
            - Pressurized Equipment Defect
            - Automated Stacking Tooling Delay
            - Balance-of-Plant EPC Delays
            - Specialized Material Sourcing Bottleneck
            - Protracted Off-Taker FID Delays
            - Sustained High Factory Cash Burn
        - label: Medium Severity
          values:
            - Grid Interconnection Timeline Slips
            - Minor Component Quality Variances
            - Digital Telemetry Downtime
            - Secondary Share Liquidity Illiquidity
            - Subcontractor Scope Miscommunications
            - Broader Macroeconomic Cleantech Headwinds
        - label: Low Severity
          values:
            - Minor Administrative Delay
            - Routine Compliance Filing Revisions
            - Non-Critical Spare Part Lead Times
            - Minor Site Installation Adjustments
            - Routine Customer Status Inquiries
            - Standard Vendor Contract Re-Negotiations
    approximationNotes: >-
      Likelihood and severity classifications are qualitative assessments derived from commercialization milestones and
      industrial operating characteristics.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR006
      - CR010
