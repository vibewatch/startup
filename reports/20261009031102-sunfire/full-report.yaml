  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The addressable market for Sunfire's industrial electrolysis systems comprises multi-megawatt pressurized
              alkaline and high-temperature solid oxide electrolysis cell (SOEC) equipment deployed for hard-to-abate
              industrial manufacturing. The included market boundary encompasses capital equipment expenditure for core
              electrolysis stacks, balance of plant (BoP) engineering packages, power electronics, and high-temperature
              steam integration hardware. The primary buyer universe consists of integrated steel manufacturers,
              refining operators, and commercial e-fuel project developers seeking to replace fossil-based grey hydrogen
              produced via unabated steam methane reforming (SMR). Excluded from this boundary are distributed passenger
              mobility stations, residential heating, and small-scale laboratory electrolyzers below multi-megawatt
              scale. Direct status-quo substitutes remain conventional grey hydrogen from SMR with natural gas, and
              low-carbon blue hydrogen utilizing SMR coupled with carbon capture and storage (CCS). High natural gas
              price volatility and stringent European emissions penalties drive industrial procurement, but grey
              hydrogen remains significantly cheaper on an unsubsidized levelized basis.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Market Sizing Lenses, Industrial Segments, and Addressable Demand
        blocks:
          - type: paragraph
            body: >-
              Evaluating the addressable market for industrial electrolyzers requires delineating between unconstrained
              global hydrogen demand and realistic capital expenditure on industrial electrolysis equipment. The broader
              industrial hydrogen consumption landscape represents an immense total volume, predominantly satisfied
              today by unabated fossil sources. However, the serviceable addressable equipment market is bounded by
              industrial sectors facing direct regulatory decarbonization mandates—specifically European steel, basic
              chemical synthesis, and synthetic aviation fuel projects. Within this serviceable space, the obtainable
              market represents projects reaching final investment decision (FID) with committed balance-sheet capital
              and binding off-take agreements. Market growth projections exhibit wide dispersion between optimistic
              mandate-driven scenarios and conservative capital deployment horizons. Conversion from announced pipeline
              capacity to delivered operational megawattage remains heavily gate-kept by regional electricity
              transmission capacity, renewable power purchase agreement (PPA) pricing, and national state-aid
              disbursements.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
      - number: '2.3'
        title: Buyer Segmentation, Procurement Decision Economics, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              Purchasing decisions for industrial electrolyzers are conducted as multi-year infrastructure capital
              expenditure programs led by corporate executive committees, chief procurement officers, and project
              finance syndicates. Primary buyers fall into three core segments: basic metals and primary steelmakers
              replacing metallurgical coal with hydrogen direct reduced iron (H-DRI); petrochemical refiners
              substituting grey hydrogen for hydrotreating and desulfurization; and dedicated Power-to-X consortiums
              manufacturing synthetic kerosene and e-methanol. In primary steelmaking, capital allocation is governed by
              board-level decarbonization commitments alongside public co-financing mechanisms. In refining, procurement
              velocity is dictated by renewable fuel blending quotas and carbon compliance thresholds. Across all
              segments, the chief financial barrier is levelized cost of hydrogen (LCOH), wherein electricity input
              costs represent over seventy percent of lifecycle operating expenditure, subordinating equipment stack
              efficiency to cheap renewable power access.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Macro Growth Drivers, Capital Intensity, and Structural Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Industrial adoption of green hydrogen electrolysis is accelerated by binding supranational regulatory
              frameworks, including European Union Renewable Energy Directive (RED III) industrial sub-targets and
              emissions trading system (ETS) carbon pricing allowances. Conversely, commercial deployment is constrained
              by severe macro headwinds: capital expenditure inflation, power grid interconnection delays, high cost of
              capital for debt-financed infrastructure, and bureaucratic delays in grant disbursements. For
              high-temperature SOEC systems, industrial waste steam availability delivers substantial thermodynamic
              electrical efficiency advantages over low-temperature alkaline or PEM units, yet faces heightened customer
              risk aversion regarding stack degradation rates, thermal cycling durability, and replacement schedules.
              Until long-term off-take contracts and subsidization bridges the cost gap against fossil incumbents,
              project developers remain hesitant to execute unhedged multi-hundred-megawatt balance-sheet commitments.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Power PPA Economics Exert Greater Influence on Adoption Than Stack CAPEX
            body: >-
              Across industrial buyer segments, levelized cost of hydrogen calculations reveal that electricity
              operating expenditure comprises seventy to eighty percent of total thirty-year plant cost. While
              electrolyzer capital expenditure per kilowatt determines upfront financing scale, industrial customers
              delay final investment decisions primarily due to volatile power purchase agreement (PPA) pricing and grid
              congestion rather than OEM equipment cost differences.
            calloutType: insight
            claimRefs:
              - CM011
              - CM012
              - CM015
