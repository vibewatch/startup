              - CU008
      - number: '6.3'
        title: Named Deployments, Operational Proof, and Platform Dependencies
        blocks:
          - type: paragraph
            body: >-
              Enterprise verification of Sunfire's engineering execution reveals deep internal dependencies on core CAD,
              PDM, and ERP infrastructure to deliver complex multi-discipline electrolyzer systems. Independent vendor
              case studies verify that Sunfire GmbH deployed Dassault Systèmes SOLIDWORKS Electrical Schematics,
              Electrical 3D, and PDM Professional to unify mechanical and electrical design, cut physical prototype
              generation by 30%, and automate bill-of-materials synchronization with enterprise resource planning
              systems. On the downstream commercial front, public documentation indicates that while landmark
              multi-megawatt demonstration installations have been publicized with energy majors, binding off-take
              commitments and recurring aftermarket revenues remain closely held. Customer satisfaction and operational
              durability data are limited by the nascent state of scaled commercial installations, where
              balance-of-plant integration, stack degradation rates under intermittent renewable loads, and specialized
              maintenance requirements represent unresolved commercial hurdles for prospective buyers.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
