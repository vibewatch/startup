companyProfile:
  summary: >-
    Sunfire is a Dresden-based industrial cleantech manufacturer founded in 2010 that builds pressurized alkaline and
    high-temperature SOEC electrolyzer systems for green hydrogen, e-fuels, and other power-to-X applications. The
    business is led by co-founder and CEO Nils Aldag and co-founder and CTO Christian Olshausen, and it has amassed a
    multi-site German manufacturing footprint plus more than EUR 500 million in combined equity, debt, and grant-backed
    financing. Public disclosures still leave core operating economics opaque, including audited revenue, cash burn,
    gross margin, and customer concentration.
