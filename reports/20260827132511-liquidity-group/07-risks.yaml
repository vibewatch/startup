  title: Risks
summary: Liquidity Group's core risk is not a single bad loan; it is a stack of interacting control risks around AI-enabled underwriting, sensitive-data handling, capital-partner dependence, and late-stage technology credit quality. Public sources show that the company understands many of these issues — it publishes extensive legal notices, emphasizes explainability and human oversight, and has attracted institutional partners such as MUFG and KeyBank. But public evidence remains much stronger on policy statements than on measured control effectiveness. There are no public cohort credit tables, no independent cyber attestations, no disclosed model-validation cadence, and no clear public answer on regulatory scope questions such as U.S. small-business lending data rules.
sections:
- id: risk-stack-overview
  title: Highest-conviction risk stack
  body: 'The most material risk stack starts with model and data quality. Liquidity''s value proposition depends on faster, more scalable private-credit decisions, which means errors in data ingestion, scenario design, or monitoring logic could propagate directly into underwriting losses or delayed interventions. The second layer is legal and regulatory exposure: the company publicly handles sensitive due-diligence, KYC, and investment data across multiple jurisdictions, while financial-services regulators continue to tighten expectations around privacy, cybersecurity, explainability, and recordkeeping. The third layer is dependency risk. Liquidity''s scale is intertwined with institutional capital partners such as MUFG and KeyBank, with third-party data and banking integrations, and with the availability of high-caliber product, data, and credit talent. The final layer is plain old credit cyclicality. Public BDC data and private-credit commentary in 2026 show that software and smaller-company
    credits can reprice quickly even before realized defaults appear. Liquidity may be technologically differentiated, but it is not exempt from the transmission mechanisms of private credit.'
  claimRefs:
  - CR011
  - CR012
  - CR018
  - CR019
  - CR026
  - CR027
  - CR032
  - CR033
  - CR034
  - CR035
