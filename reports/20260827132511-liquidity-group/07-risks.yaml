- id: FR002
  title: Risk transmission map
  type: dag
  layout: wide
  summary: Shows how control failures can transmit into credit losses, partner pullback, and valuation compression.
  data:
    nodes:
    - id: r1
      label: Data / model failure
      detail: Bad inputs, drift, or opaque logic weaken decisions.
    - id: r2
      label: Weak underwriting / monitoring
      detail: Errors propagate into origination and watchlist timing.
    - id: r3
      label: Borrower underperformance
      detail: Losses, restructurings, or marks rise.
    - id: r4
      label: Partner confidence shock
      detail: Funding partners or co-lenders retrench.
    - id: r5
      label: Growth slows
      detail: Less capacity and weaker market signaling reduce origination.
    - id: r6
      label: Valuation pressure
      detail: Investors discount growth and credibility.
    - id: r7
      label: Regulatory / litigation event
      detail: Privacy, AML, or explainability issue compounds the shock.
    edges:
    - from: r1
      to: r2
      label: degrades
    - from: r2
      to: r3
      label: causes
    - from: r3
      to: r4
      label: spooks
    - from: r4
      to: r5
      label: limits
    - from: r5
      to: r6
      label: compresses
    - from: r7
      to: r4
      label: amplifies
    - from: r7
      to: r6
      label: penalizes
  approximationNotes: Transmission links are causal hypotheses based on public market analogues and Liquidity's operating model.
