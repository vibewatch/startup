- id: operational-and-dependency-risk
  title: Operational, partner, and dependency risk
  body: Operational risk follows naturally from the business model. Liquidity positions itself as a lender that can originate, structure, and monitor bespoke facilities at speed, but that speed relies on clean data, reliable workflow orchestration, and institutional funding that stays available across cycles. The public partner map is encouraging yet concentrated. KeyBank anchors the North American facility, while MUFG and Liquidity's Mars Growth Capital joint venture appear central to broader regional scale and signaling power. Terms also reference Salt Edge and other third-party connectivity, while privacy disclosures mention cloud, hosting, and processing vendors. If any of those dependencies fail — a capital partner retrenches, a banking integration breaks, a critical vendor is breached, or borrower reporting quality slips — Liquidity's promise of faster and safer underwriting weakens quickly. The company also operates across Tel Aviv, New York, London, Abu Dhabi and other markets, which
    increases the coordination burden for compliance, incident response, and investment governance.
