- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Credit deterioration
    - Watchlist migration or non-accrual rate
    - Any sustained move above management baseline without transparent explanation
    - Pause underwriting enthusiasm and demand loan-book detail
  - - Funding-partner retrenchment
    - Facility scale-back, pricing shock, or non-renewal by major partners
    - Material reduction in KeyBank or MUFG-linked capacity
    - Re-rate growth assumptions and downside valuation
  - - Privacy / security failure
    - Breach, enforcement action, or material incident disclosure
    - Any confirmed unauthorized exposure of diligence or portal data
    - Move to avoid unless incident handling and remediation are exceptional
  - - Model-governance failure
    - Bias issue, unexplained loss cluster, or validation exception
    - Evidence that humans cannot explain or override key decisions
    - Treat thesis as broken until controls are independently validated
  - - AML / sanctions lapse
    - Control failure involving high-risk geographies, stablecoin rails, or beneficial ownership screening
    - Regulatory inquiry, partner remediation demand, or enforcement action
    - Escalate to high-risk posture and review all cross-border assumptions
  - - Execution slippage
    - Missed hiring, delayed monitoring rollout, or control fragmentation across offices
    - Repeated governance exceptions or unresolved ownership gaps
    - Reduce confidence and require staged milestones before new capital exposure
  notes: Kill criteria focus on events that directly invalidate Liquidity's promise of faster, safer, and scalable private-credit decisions.
