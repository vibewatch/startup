evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: >-
      Audited 2024-2026 revenue, net income, and fee-versus-interest revenue mix for the operating company and managed
      funds.
    whyItMatters: >-
      Without audited financials, later underwriting and valuation chapters cannot reconcile scale claims with actual
      earnings power.
    diligencePath: >-
      Request audited consolidated statements and management accounts; compare corporate revenue to fund-management and
      interest-income lines.
    relatedQuestionRefs:
      - QO024
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A current employee count by office and function.
    whyItMatters: >-
      Headcount is required to judge operating leverage, R&D concentration, and cost efficiency behind the AI-led
      lending narrative.
    diligencePath: Request HR census or organization chart; triangulate with payroll or benefits filings.
    relatedQuestionRefs:
      - QO024
  - type: private-evidence-only
    severity: material
    topic: ownership
    missingEvidence: >-
      Current fully diluted cap table, board rights, liquidation preferences, and any repurchase or downside protection
      clauses linked to MUFG or other investors.
    whyItMatters: Public ownership data stops in early 2023, which is insufficient for governance or valuation analysis in 2026.
    diligencePath: Request cap table, shareholder agreement, and side letters from counsel or management.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: loss-rate-methodology
    missingEvidence: >-
      Independent audit or external methodology note explaining how the 0.00% credit loss rate since 2019 is defined and
      measured.
    whyItMatters: >-
      The zero-loss claim is central to the firm’s moat narrative but currently rests on management communications
      rather than independent validation.
    diligencePath: Request realized-loss vintage data, impairment policy, and portfolio-level default definitions from management.
  - type: conflicting-data
    severity: minor
    topic: founders
    missingEvidence: A reconciled founder roster and current role status for Yaron Sela versus the current official team page.
    whyItMatters: Founder continuity affects governance, succession, and historical credit for platform development.
    diligencePath: Confirm directly with management or obtain a current corporate leadership register.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: minor
    topic: aum-composition
    missingEvidence: >-
      Breakdown of firm-level equity, managed-fund AUM, warehouse lines, and partner capital underlying the
      “multibillion” and Mars AUM claims.
    whyItMatters: >-
      Public materials blend balance-sheet and fund-platform scale, which can overstate directly controlled capital for
      valuation purposes.
    diligencePath: Request fund-by-fund AUM schedule, warehouse commitments, and ownership of GP economics.
  - type: missing-source
    severity: minor
    topic: milestone-chronology
    missingEvidence: >-
      Exact closing dates, legal entities, and facility-level terms for some 2022 capital-commitment milestones that are
      only visible through retrospective references.
    whyItMatters: >-
      The milestone table is directionally complete but still partial on exact chronology for the Apollo-linked 2022
      financing wave and some vehicle launches.
    diligencePath: >-
      Request a corporate financing history schedule from management or locate archived press releases and fund
      documents.
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: tam-gap
    missingEvidence: >-
      A source-backed market-size estimate specific to AI-enabled private credit for late-stage and mid-market
      technology companies.
    whyItMatters: Without a category-specific TAM, market-share and penetration claims remain directional instead of investable.
    diligencePath: >-
      Build bottom-up borrower counts by geography, funding stage, and facility-size band using PitchBook or lender
      portfolio data.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: borrower-count
    missingEvidence: Liquidity’s total active borrower count, cohort mix, and annual new-origination count.
