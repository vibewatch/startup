chapter:
  number: 2
  title: Market Analysis
  summary: 'Liquidity Group operates inside a fast-growing but harder-to-define market boundary: global private credit for growth-stage and mid-market technology-heavy companies seeking large, non-dilutive capital. Public evidence supports the macro tailwind — private credit above $2 trillion of AUM and still growing — but the company’s true serviceable market is narrower and driven by borrowers that want $10 million to $200 million, move too quickly for traditional banks, and prefer structured debt over dilution. The best judgment is that the addressable market is large and improving as public markets thaw, but no retained source isolates a clean one-number TAM for AI-driven private credit to late-stage tech borrowers.'
sections:
- id: market-boundary
  title: Market boundary and status-quo substitutes
  body: 'Liquidity is not operating in all of private credit, all venture debt, or all business lending. The official product pages place it in a narrower corridor: non-dilutive private credit for growth-stage and mid-market companies, especially technology-heavy borrowers that need $10 million to $200 million, value speed, and often lack the hard assets preferred by traditional banks. Public sources repeatedly frame the company around late-stage and mid-market technology companies, bespoke facilities, and structured growth capital rather than seed lending, card-like SME credit, or broad sponsor buyout financing. That means the included market is best described as large-ticket growth credit for tech and tech-enabled companies across North America, Europe, APAC, and MENA.


    The status quo remains diverse. SVB represents the bank-led innovation-economy route; Capchase shows how vendor financing attacks software budgets from the buyer side; Lighter Capital and Fundbox represent smaller-ticket revenue-based or working-capital substitutes; and traditional venture or growth equity remains the default option whenever founders can still raise without intolerable dilution. Liquidity’s value proposition is therefore not simply “debt instead of equity,” but faster, more bespoke, larger-scale debt than most of those alternatives can provide to later-stage operators.'
