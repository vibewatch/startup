  evidenceGaps:
  - type: missing-source
    severity: material
    topic: tam-gap
    missingEvidence: A source-backed market-size estimate specific to AI-enabled private credit for late-stage and mid-market technology companies.
    whyItMatters: Without a category-specific TAM, market-share and penetration claims remain directional instead of investable.
    diligencePath: Build bottom-up borrower counts by geography, funding stage, and facility-size band using PitchBook or lender portfolio data.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: borrower-count
    missingEvidence: Liquidity’s total active borrower count, cohort mix, and annual new-origination count.
    whyItMatters: Customer-count and origination-flow denominators are required to estimate SOM and penetration.
    diligencePath: Request portfolio statistics and annual origination counts from management.
    relatedQuestionRefs:
    - QM025
  - type: missing-source
    severity: minor
    topic: regional-sam
    missingEvidence: A public regional split of the serviceable market across North America, Europe, APAC, and MENA for facilities in the $10M-$200M band.
    whyItMatters: Regional SAM visibility would improve hiring, competition, and yield assumptions.
    diligencePath: Compile lender deal databases and sponsor-backed private-credit issuance by region.
  - type: private-evidence-only
    severity: minor
    topic: yield-and-pricing
    missingEvidence: Realized borrower pricing, approval rates, and loss-adjusted yields by vertical.
    whyItMatters: A market can be large and still unattractive if pricing is competed away or losses consume spread.
    diligencePath: Request vintage-level origination and yield data from management.
  - type: missing-source
    severity: minor
    topic: substitute-share
    missingEvidence: Observed mix of how often Liquidity wins against banks, growth equity, embedded finance, or internal cash use.
    whyItMatters: The most relevant competition question is substitution frequency, not abstract competitor lists.
    diligencePath: Interview portfolio CFOs and request competitive-win-loss data.
acknowledgedWarnings:
- dimension: tableNotes
  reason: All market exhibits include scope notes, but factual tables still emit the standard table-notes warning under strict validation.
