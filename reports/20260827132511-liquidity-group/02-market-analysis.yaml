    - CFO / treasury / board / company balance sheet
    - Core category Liquidity explicitly targets
  - - Late-stage venture debt adjacency
    - Debt used to reduce dilution for venture-backed companies
    - Seed-stage venture loans and founder personal guarantees
    - Finance team plus existing equity sponsors
    - Important substitute and feeder channel
  - - Revenue-linked or software financing adjacency
    - MRR lines, vendor financing, and software budget smoothing
    - Tiny-ticket SMB working capital or card products
    - CFO, procurement, FP&A
    - Competes at the edge but usually smaller than Liquidity
  - - Traditional innovation banking
    - Bank revolvers, venture debt, treasury relationships
    - Retail or mass-market commercial lending
    - CFO / banking relationship owner
    - Status-quo alternative and pricing benchmark
  - - Growth equity / internal cash generation
    - Dilutive capital or self-funded growth instead of debt
    - Public follow-ons and mega-cap M&A financing
    - CEO, board, equity investors
    - Substitute when dilution is acceptable
  notes: 'Boundary is intentionally narrow: private credit for technology-heavy and growth-stage corporate borrowers, not all private credit globally.'
