  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 谁付费、谁使用，以及可见客户基础长什么样
        blocks:
          - type: paragraph
            body: >-
              Liquidity 的客户不是终端消费者，也不是普通小企业借款人。可见买方通常是已经具规模的科技或科技赋能公司的创始人、CFO、司库负责人或运营团队，他们需要非稀释性资本来完成定义清楚的扩张任务。公开证据覆盖
              NALA 的跨境支付基础设施、Perk 的 AI 原生差旅和支出软件、Butternut Box 的消费宠物食品制造扩张、Eruditus 的全球高管教育，以及 Infra.Market
              的建筑供应链扩张。这个跨度重要，因为它说明承销模型能跨业务模式保持灵活，同时仍瞄准运营复杂度较高的公司。与此同时，公开样本是经过筛选的。Liquidity
              披露品牌标识、叙事型案例研究和部分融资公告，但没有披露这些案例背后的分母。结果是：细分客群证明可信，但组合广度披露不完整。这个缺口很重要，因为贷款机构即便品牌标识看起来分散，风险敞口、提款使用或借款人年份批次仍可能集中。
