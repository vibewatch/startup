              Liquidity 自身材料显示，信任和合规不是边缘议题。公司的隐私政策描述了为尽调、验证、法律或监管合规以及服务交付而处理个人数据；CCPA
              通知涵盖敏感财务标识符；条款强调内部使用权、平台所有权和用户义务。在模型治理侧，公司明确反对黑箱放贷，主张可解释 AI、由人类最终掌握信号，以及假设可追溯。外部来源也说明为什么这很重要：法律评论和 OCC
              指引都指向 AI
              赋能金融工作流中更强的模型风险预期、持续监控和可解释性。这些是正面的设计信号，但不能替代经审计质量指标。公开证据没有揭示模型验证频率、独立公平性测试、渗透测试或生产事故历史。因此，公司的公开理念与实测控制有效性之间仍有重要缺口。
