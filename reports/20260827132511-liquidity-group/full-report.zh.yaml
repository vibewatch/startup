  - id: TV005
    title: 投资逻辑破裂与放弃触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 信用损失核验失败
        - 年份批次数据显示，重大不计息资产或损失远高于公开声称的 0.00%
        - 差异化不再抵消不透明性，乐观情景和基准情景都会被削弱
        - 放弃，或按低于上一次公开估值的水平重做投资测算。
      - - 资金供给收缩
        - 合作伙伴支持的放款能力明显下降，或融资设施条款收紧
        - 削弱 MUFG 和 KeyBank 带来的规模与信心信号
        - 下调估值区间，提高下行情景折扣。
      - - 经济性资料不达预期
        - 管理人层面的收入、费用或现金生成无法支撑溢价估值
        - 投资人没有理由再突破上市贷款机构的估值纪律支付溢价
        - 维持观察，或坚持设置结构化下行保护。
      - - 控制 / 监管事件
        - 出现重大数据、合规或治理事件
        - 把 Liquidity 推向承压上市贷款机构经历过的倍数压缩区间
        - 在完全补救前，投资逻辑立即破裂。
      - - 缺少证据仍要求溢价
        - 新股融资价格显著高于约 US$1.8B，且没有同时拿出储备、NAV 逻辑或优先权证明
        - 把叙事上行变成没有补偿的定价风险
        - 拒绝，或等尽调证据改善后再议。
    notes: 每个触发项都对应可观察的尽调事件，而不是含糊的不适感。
