    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、地域布局与运营模式
        blocks:
          - type: paragraph
            body: >-
              Liquidity Group 如今把自己定位为 AI 原生私募信贷机构，而不是泛化的金融科技撮合市场。官方主页和私募信贷页面称，公司向成长期和中型市场公司投放灵活资本，单笔规模从 $10 million 到
              $200 million，覆盖 35+ 个国家和 45+ 个业务垂直领域，自 2019 年以来信用损失率为
              0.00%。官方材料描述的运营模式是一套覆盖完整信贷生命周期的系统：获客、分析、结构设计、监控和拓展新信贷垂直领域，都由自研机器学习基础设施支撑，最终判断仍由人工投资团队掌握。公开列出的产品结构包括定期贷款、循环授信、收购融资和与
              MRR 挂钩的授信额度。


              单一国家标签不足以描述公司的地域身份。第三方资料和伦敦总部公告把当前总部锚定在纽约；更早的报道和阿布扎比合作材料则称，公司创立于以色列，历史上以特拉维夫为基地。到 2025
              年中，公司称其在伦敦、纽约、新加坡、特拉维夫、阿布扎比和旧金山运营，这与其全球覆盖叙事一致，也与 2026 年奖项页面关于组织横跨五大枢纽、拥有 26
              个国籍员工的说法相吻合。因此，最稳妥的表述是：公司创立于以色列，当前企业中心在纽约，在 EMEA、APAC 和海湾地区有实质运营枢纽。
