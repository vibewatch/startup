      - number: '2.2'
        title: 从宏观、可服务与已观察口径测算规模
        blocks:
          - type: paragraph
            body: >-
              最强的宏观口径来自 PwC 和 SG Analytics，而不是 Liquidity 自己。PwC 2026 年调查称，私募信贷当前管理资产（AUM）超过 $2 trillion，到 2030 年可能达到
              $3.4 trillion；SG Analytics 则把 2026 年描述为从纯防御性投放转向新周期的过渡期，违约和业绩分化正在上升，承销纪律和结构控制更重要。这些数字过宽，不能直接当作 Liquidity
              的总可用市场（TAM），但足以说明这一资产类别已经很深、全球化，并具有机构重要性。


              Liquidity 的可服务市场比整体私募信贷窄得多。官方页面和交易公告指向成长期和中型市场公司，融资规模大致在 $10 million 到 $200 million；Mars Growth Capital 在
              APAC 和 EMEA 的常见区间是 $20 million 到 $100 million。与 NALA、Perk、Eruditus、Butternut Box、Infra.Market
              的具名融资显示了实际可获取市场（SOM）：软件、金融科技、教育、基础设施和消费品类冠军，用定制化信贷支持营运资本、再融资、资本开支、扩张或类似收购的增长。由此得到一个有边界的结论：这个市场显然足够支撑多十亿美元平台，但公开证据仍支持区间判断，而不是单一精确
              TAM 数字。
