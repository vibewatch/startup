  - id: TV006
    title: 最终尽调材料要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 年份批次表现
        - 2019 年以来，按年份批次列示季度和年度的放款、不计息资产、重组、损失与回收情况
        - 这是最快判断核心损失口径到底经得起时间检验、还是选择性披露的办法。
        - 直接向管理层、信贷委员会和审计师索取。
      - - 管理人层面经济性
        - 收入结构、费用收入、已实现净收益率、运营费用、EBITDA / 现金生成，以及基金与管理人的拆分
        - 没有这些，投资人看不出规模是否转化为有吸引力的股权经济性。
        - 索取董事会材料包和经审计的管理账。
      - - 股权结构表与优先权
        - 当前完全稀释后股权、清算瀑布、反稀释条款及任何优先权利
        - 私募轮回报测算高度取决于谁先拿到钱。
        - 索取法律口径股权结构表和股东权利摘要。
      - - 当前估值材料
        - 2026 年董事会估值备忘录、第三方公允性工作、老股交易或投资人更新
        - 这些材料能补上陈旧 2023 年价格与当下间接信号之间的缺口。
        - 直接向 CFO / 财务负责人索取。
      - - 退出准备度
        - 任何投行聘任、IPO 准备度评估，或上市公司控制体系建设计划
        - 退出可选性要有证据支撑，不能只靠规模推断。
        - 索取战略财务路线图和治理准备度材料包。
    notes: 这些要求按其对推荐结论、估值立场和下行保护的直接影响排序。
    claimRefs:
      - CV015
      - CV016
