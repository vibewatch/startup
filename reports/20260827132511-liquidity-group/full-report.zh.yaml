  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用贷款人与借款人工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              Liquidity 的产品最好被理解为私募信贷决策操作系统，而不是独立软件
              SKU。公司当前材料反复把技术嵌入完整信贷生命周期：筛选机会、设计交易结构、支持投资决策、监控组合，并帮助金融机构把决策科学嵌入从获客到合规的流程。对借款人而言，可见产出是更快、更定制的非稀释性资本。对
              Liquidity 自身和合作机构而言，产品似乎是一组内部和半内部工作流，用来压缩决策时间、拓宽情景分析，并让持续组合监控更可扩展。AI
              产品经理岗位也强化了这种解读：它把产品工作描述为覆盖数据摄取、建模，以及面向投资工作流和财务分析搭建的用户应用。换句话说，技术不是信贷业务之外的东西；它就是这门生意运转的机器。
