  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与变现逻辑
        blocks:
          - type: paragraph
            body: >-
              Liquidity 的经济引擎最好理解为私募信贷平台，而不是 SaaS
              供应商，尽管技术是其叙事核心。留存来源暗示了几类变现通道：自营发放贷款的利息或利差收入；定制化信贷通常伴随的结构设计费、承诺费和其他交易费用；资本形成活动或关联载体带来的潜在上行；部分结构中还可能存在类似认股权证或股权挂钩的经济收益，虽然
              Liquidity 没有公开披露标准工具菜单。最接近且透明的类比对象，是 Hercules 和 TriplePoint
              这类公开创业贷款机构；它们的申报文件显示，模型建立在债务当前收益、附带费用和股权参与之上。Liquidity
              很可能用类似方式赚钱，但公开证据没有披露费用收入与经常性收益的实际组合，也没有说明经济收益主要落在基金层面、管理人层面，还是两者都有。这个缺失的组合，是第一项重大承销阻碍。
