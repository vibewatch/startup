              仍是经常性收入软件公司的重要替代方案，但其公开目标客群和资质要求指向的借款人，比 Liquidity 通常服务的群体更早期、规模更小。公开创业贷款机构更接近。Hercules 将自己定位为专注创业贷款的最大
              BDC，TriplePoint 的管理层谱系也深植于科技金融和创业贷款。这些公司在承销可信度和资本可得性上更直接竞争，但在明确的 AI 赋能全生命周期叙事上弱一些；Liquidity
