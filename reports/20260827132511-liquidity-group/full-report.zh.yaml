      - number: '8.4'
        title: 退出准备度、投资逻辑破裂触发点与最后尽调清单
        blocks:
          - type: paragraph
            body: >-
              Liquidity 规模已经足够大，理论上可以争取 IPO 或战略退出，但公开证据没有验证退出时间表。保留来源没有显示 2025 或 2026
              年有定价股权轮、投行委任、正式选择上市地流程，或二级市场价格发现。因此，投资者不应只靠叙事性的退出可选性来承保投资逻辑。
              正确的收尾动作是一份硬尽调清单。第一，拿到逐分期组合的信用表现、停息历史、回收情况和储备方法。第二，拿到管理人层面经济性：
              经常性费用收入、已实现收益率、费用和现金生成。第三，检查当前股权结构表和清算优先权，因为如果优先条款或反稀释保护很重， 回报测算会大幅变样。第四，索取任何 2026 年董事会材料或第三方估值分析，用来连接过时的
              2023 年独角兽标记与今天更强但仍间接的 运营信号。在这些材料到手之前，估值投资逻辑本来就不完整，推荐也应保持有条件，而不是带宣传口吻。
