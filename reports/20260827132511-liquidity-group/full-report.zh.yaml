  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Liquidity Group（2023 轮）
        - 同公司私募锚点
        - MUFG 投入 US$40M 股权后，声称投后估值为 US$1.4B
        - Liquidity 自身最好的直接公开股权锚点。
        - 到 2026 年已过时，也没有披露今天的优先股条款或内部指标。
      - - Ares Capital（ARCC）
        - 大型公开直接贷款方
        - 2026 年 8 月市值约 US$14.29B；按市值计为最大公开 BDC
        - 展示成熟公开直接贷款工具的规模天花板。
        - 有公开披露的中端市场 BDC，不是 AI 原生私募贷款机构。
      - - Blackstone Secured Lending Fund (BXSL) 可比公司
        - 大型上市私募信贷 BDC
        - 2026 年 8 月市值约 US$5.8B；2025 年 11 月快照约 US$6.1B
        - 可作为强背书、高溢价直接贷款平台的有用参照。
        - 上市 BDC 的经济性和分红结构不同于 Liquidity 的私募模式。
      - - Hercules Capital (HTGC)
        - 上市创投贷款专家
        - 2026 年 8 月市值约 US$3.28B
        - 更接近面向科技公司的非稀释贷款参照。
        - 仍是上市贷款机构，披露更充分，组合构建也不同。
      - - TriplePoint Venture Growth (TPVG)
        - 较小的上市创投贷款机构
        - 2026 年 8 月市值约 US$218M
        - 说明较小创投贷款机构在公开市场上可能被严厉定价。
        - 规模远小于 Liquidity 今天声称的水平，市场对背书强度的感知也更弱。
      - - Infra.Market 融资标记
        - 借款方私募估值参照
        - Mars 支持的新融资中，借款人估值为 US$2.5B
        - 显示 Liquidity 正在给自身估值高于 Liquidity 上一次公开估值的公司提供融资。
        - 借款人估值不是贷款机构估值，只能作为间接质量信号。
    notes: 这组参照混合了同公司锚点、成熟上市直接贷款机构、上市创投贷款机构，以及借款方私募估值参照，用来框定公开证据能支持什么、不能支持什么。
