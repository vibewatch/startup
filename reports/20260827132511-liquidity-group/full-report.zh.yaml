  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值锚、资本通道与披露现实
        blocks:
          - type: paragraph
            body: >-
              Liquidity 的公开估值故事有一个清楚起点，也有一个混乱的后续。清楚的部分是 2023 年：官方和第三方报道都指向一轮由 MUFG 领投的 $40 million 股权融资，公司称该轮将 Liquidity
              估值定在 $1.4 billion，并把累计股权融资推至约 $120 million。混乱的是此后的所有内容。此后公开证据有大量规模信号，却缺少价格发现。Liquidity 增加了 KeyBank
              牵头、面向北美最高 $450 million 的授信额度；Mars Growth Capital 管理资产（AUM）增至 $1.1 billion，完成 80+
              笔投资；伦敦扩张公告也释放持续部署野心。但这些事实没有告诉投资者，如果 2026
              年进行一轮新的普通股融资，会以什么价格成交。它们说明的是融资通道和战略重要性，不是当前股权价格。因此，核心估值问题是披露不对称：相较可见的资本伙伴动能，公开收入、储备、NAV、优先股堆叠和管理人现金生成披露异常稀薄。这让
              2023 年独角兽估值成为有用锚点，却不足以回答当前估值。
