      - number: '8.2'
        title: 公开可比组与客户质量真正证明了什么
        blocks:
          - type: paragraph
            body: >-
              这里必须看公开可比公司，但也要克制使用。Ares Capital、BXSL、Hercules Capital 和 TPVG 说明，上市直接贷款机构和 创投贷款机构在公开市场实际能定到什么水平：创投贷款小端约
              $218M，最大的上市 BDC 约 $14.3B。这些公司不是完美参照， 因为它们披露监管文件、资产负债表指标、股息政策，很多还披露净资产值（NAV）细节；Liquidity 并没有。但它们确立了正确纪律。
              贷款机构不会只因为在承销中使用软件或 AI，就获得永久溢价。到 2026 年，上市 BDC 行情仍受利率压力、信用质量分化，以及市场对 私募估值标记的怀疑牵动。这个点很关键，因为 Liquidity
              今天最好的上行证据不是经审计经济性，而是质量较高的借款人验证： NALA、Perk、Butternut Box、Eruditus 和 Infra.Market
              都显示，公司在为有规模的运营企业融资。它提升了对资产生成质量的信心， 但不能替代组合分期、储备或集中度披露。客户标识可以支撑投资逻辑，却不能单独弥合估值缺口。
