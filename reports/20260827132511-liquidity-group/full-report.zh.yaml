      - 投资逻辑论据
      - 反向逻辑信号
      - 什么会改变观点
    rows:
      - - 资金获取
        - MUFG 和 KeyBank 支持的结构显示，机构愿意与 Liquidity 一起扩容。
        - 融资额度和合作伙伴支持的 AUM 证明了资金获取能力，而不是普通股估值支撑。
        - 新的第三方定价轮，或经审计的经济性资料包。
      - - 借款人质量
        - NALA、Perk、Butternut、Eruditus 和 Infra.Market 暗示资产发起筛选较强。
        - 成功案例可能掩盖账簿其他部分的集中度、观察名单迁移和损失严重性。
        - 组合层面的借款人、年份和非应计数据。
      - - 技术 / 流程
        - AI 加持的承销和监控可能支撑更快、更高效的信贷决策。
        - 公开证据没有证明 AI 能形成值得公开市场定价的护城河，或带来更好的损失调整后回报。
        - 独立验证损失率、人工覆盖和已实现收益。
      - - 市场背景
        - 私募信贷仍是大且增长中的市场，差异化贷款方仍有空间。
        - 2026 年，公开 BDC 仍显示估值分化和市场对估值标记的怀疑。
        - 证明 Liquidity 能跑赢更广泛的估值下调压力。
