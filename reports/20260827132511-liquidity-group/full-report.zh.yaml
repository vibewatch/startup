      - number: '3.4'
        title: 护城河耐久性、商品化风险与反向证据
        blocks:
          - type: paragraph
            body: >-
              Liquidity 确实有真实差异化，但护城河并非不可攻破。最能支持耐久性的证据，是机构融资关系、跨区域放贷经验，以及覆盖从获客到监控的完整信贷生命周期产品叙事。如果 AI
              工具真的能在不牺牲纪律的前提下提升决策速度和组合可见度，就可能形成复利式数据优势。反向观点是，私募信贷越来越像一个规模和资金成本生意。PIMCO 认为，公开 BDC
              投资者仍怀疑估值标记和未来回报；BDCInvestor 则显示 NAV 压力、股息覆盖变薄，以及对软件或 AI
              暴露的敏感性上升。在这种环境里，资金更充足的既有机构可以用更便宜的资本、更保守的信贷姿态或更强品牌来缩小任何技术差距。因此，Liquidity
              的竞争优势看起来真实，但取决于执行，而非永久稳固。审慎的尽调立场是：Liquidity 有差异化楔子，但还必须证明这根楔子经得住更便宜资本和更长信贷周期的冲击。
