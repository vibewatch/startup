  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 建议来自两股力量拉扯：资本获取能力和借款人质量很强，但股权定价发现陈旧，财务披露也偏薄。
    data:
      nodes:
        - id: anchor
          label: 2023 公开股权锚点（声称估值 US$1.4B）
        - id: scale
          label: 2025-2026 规模信号（KeyBank 授信额度、Mars AUM、全球扩张）
        - id: customers
          label: 借款人质量证据（NALA、Perk、Butternut、Eruditus、Infra.Market）
        - id: gaps
          label: 披露缺口（收入、准备金、NAV、优先权、没有最新定价轮）
        - id: comps
          label: 公开可比公司约束（ARCC、BXSL、HTGC、TPVG、BDC 市场信号）
        - id: bull
          label: 乐观触发：年份批次数据 + 管理人经济模型强劲
        - id: bear
          label: 悲观风险：亏损、融资或控制问题压缩估值
        - id: result
          label: 建议：观察，严守价格敏感的入场纪律
      edges:
        - from: anchor
          to: scale
        - from: scale
          to: customers
        - from: customers
          to: result
        - from: gaps
          to: result
        - from: comps
          to: result
        - from: bull
          to: result
        - from: bear
          to: result
    claimRefs:
      - CV001
      - CV005
      - CV008
      - CV018
      - CV023
      - CV032
      - CV038
      - CV045
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 估值争论最敏感的两点：入场价相对陈旧的 2023 轮锚点定在哪里，以及 2026 可比公司隐含的上市贷款机构定价纪律有多强。
    data:
      series:
        - name: USD 十亿
          points:
            - label: 2020 官方股权估值标记
              value: 0.1
            - label: 2023 最后一次公开股权估值
              value: 1.4
            - label: 新资金优选入场上限
              value: 1.8
            - label: 基准情景中点
              value: 1.9
            - label: 乐观情景中点
              value: 3.1
    claimRefs:
      - CV001
      - CV003
      - CV038
      - CV043
      - CV046
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 情景区间显示，只有入场价贴近陈旧的公开锚点，或私下尽调显著补强证据，回报才有吸引力。
    data:
      items:
        - label: 悲观情景估值
          low: 0.8
          mid: 1
          high: 1.2
          unit: USD B
          note: 融资收缩、损失率不及预期，或控制权问题
        - label: 基准情景估值
          low: 1.6
          mid: 1.9
          high: 2.2
          unit: USD B
          note: 继续增长，但没有软件式倍数扩张
        - label: 乐观情景估值
          low: 2.6
          mid: 3.1
          high: 3.6
          unit: USD B
          note: 损失率得到验证、管理人经济模型强劲，退出选择更好
        - label: 优选接触区间
          low: 1.4
          mid: 1.6
          high: 1.8
          unit: USD B
          note: 能补偿当前公开证据缺口的区间
    claimRefs:
      - CV038
      - CV042
      - CV043
      - CV044
      - CV046
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 评分卡认可公司的资金获取能力和借款人质量，同时因披露完整度和估值支撑不足扣分。
    data:
      items:
        - label: 资金获取能力
          value: 8
          note: 私人贷款机构拿到 MUFG 和 KeyBank 支持，机构信号强得少见
        - label: 借款人质量证据
          value: 7
          note: 具名融资案例显示，公司具备实质筛选能力，也服务已有规模的客户
        - label: 市场机会
          value: 7
          note: 私人信贷规模仍大、流动性仍足，足以容纳差异化非银贷款机构
        - label: 流程 / 技术差异化
          value: 6
          note: AI 加持的工作流主张可信，但独立证据尚未证明其能变现
        - label: 经济性披露
          value: 3
          note: 收入、准备金、NAV 逻辑和现金生成仍未充分公开
        - label: 估值支撑
          value: 4
          note: 间接信号强，但直接定价发现陈旧
        - label: 退出准备度
          value: 3
          note: 路径可行，但证据不足以据此承销退出时间点
    claimRefs:
      - CV005
      - CV008
      - CV024
      - CV036
      - CV037
      - CV039
      - CV045
