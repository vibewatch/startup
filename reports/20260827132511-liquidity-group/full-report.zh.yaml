      - number: '3.3'
        title: 定价、分发杠杆与切换成本
        blocks:
          - type: paragraph
            body: >-
              竞争压力不只来自功能。真正的压力来自谁掌握客户关系、谁能以最低成本提供资金。SVB 带来银行关系、存款和司库产品；Arc 试图在更小规模上成为科技公司的司库操作系统；Capchase 和 Pipe
              争取嵌入采购或平台工作流；Hercules 和 TriplePoint 等公开创业贷款机构受益于成熟投资人基础和公开市场披露。Liquidity
              的应对是速度、灵活结构，以及愿意承销标准银行产品难以覆盖的复杂或跨境成长故事。因此，切换成本并不单一。借款人可以同时使用多家资本提供方；但一旦贷款机构嵌入报表、契约设计、组合监控和后续授信，关系就会变黏。风险在于，最便宜或分发能力最强的提供方往往赢得第一通电话；只有当复杂性、速度或定制化结构真正重要时，Liquidity
