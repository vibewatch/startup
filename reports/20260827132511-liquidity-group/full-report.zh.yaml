      - number: '1.2'
        title: 领导层、创始人延续性与治理可见度
        blocks:
          - type: paragraph
            body: >-
              相比许多私募信贷机构，Liquidity 的公开领导层信息更多，但不同来源对创始人归属仍不完全一致。官方“我们是谁”页面明确列出 Ron Daniel 为联合创始人兼 CEO、Oron Maymon
              为联合创始人兼 CSO，同时列出 Udi Gvirts、Oshri Harari、Carmen James、Roma Bronstein、Paul Brodie、Omri Meitav 等高管。同一页面还列出
              Eli Barkat 为董事长，Santo Politi、Ilan Raviv、Nobutake Suzuki 为董事。这足以说明公司不是只有创始人的组织，而是已有覆盖投资、数据科学、运营、财务和战略的真实班底。


              剩下的治理模糊点是 Yaron Sela。Startup Intros 仍把他列为联合创始人兼
              COO，但本轮抓取的当前官方领导层页面没有出现他。这不能证明他已经离开，但意味着公开来源对当前可见创始人名单存在分歧。治理经济性也少见地有部分可见：Calcalistech 报道称，2023 年 2 月 MUFG
              领投后，Meitav 仍是最大股东，持股 33.3%；Spark 持股 18%；MUFG 按完全稀释口径持股 12.5%；Ron Daniel 持股略低于
              10%。这些披露有价值，但仍未给出当前完全稀释股权结构表、董事会权利安排或投资人否决权图谱。
