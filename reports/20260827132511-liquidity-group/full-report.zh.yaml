      - number: '5.4'
        title: 差异化、依赖项与产品风险
        blocks:
          - type: paragraph
            body: >-
              Liquidity 最可信的产品差异化不是某个单一算法主张，而是领域专属工作流设计、机构资本语境，以及真实信贷部署持续积累的数据。交易结构设计和监控文章认为，公司在私募信贷信息密集、时间受限的环节使用
              AI：情景分析、基准比较、契约设计、早期预警信号和组合层面的模式识别。如果属实，这比泛泛的“金融 AI”叙事更有战略价值。护城河仍有条件。生成式 AI 和智能体 AI
              工具越来越容易采购，监管机构也在提高对可解释性和模型风险的要求。因此，依赖图谱包括第三方数据提供商、模型基础设施、隐私合规，以及解释输出的人类专家。Liquidity
              的技术或许能让它比传统贷款机构更快，但仅凭公开证据，护城河仍是工作流深度，而不是明显不可复制。
