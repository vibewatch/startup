companyProfile:
  summary: >-
    Liquidity Group 是一家 2018 年创立于以色列、现总部位于纽约的私募信贷平台。公司借助 AI 辅助的承销、结构设计和组合监控，为成长期、后期和中型市场公司提供定制化非稀释性资本，包括定期贷款、循环授信、收购融资和与
    MRR 挂钩的授信额度。公开证据显示，MUFG 关联载体持续支持公司，2025 年又有 KeyBank 牵头的北美授信额度；但在管理人层面经济性、组合年份批次表现和资本结构细节上，公司披露仍明显不足。
