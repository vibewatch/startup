      - number: '8.3'
        title: 乐观 / 基准 / 悲观情景与推荐纪律
        blocks:
          - type: paragraph
            body: >-
              由于当前没有公开定价的新一轮融资，给出单点公允价值会制造虚假精确。区间法更站得住脚。乐观情景下，Liquidity 最终证明 0.00%
              损失率声明有扎实分期数据支撑，管理人层面的收入和现金生成强于当前公开证据，机构合作伙伴也继续放大平台。那种情况下， 明显高于 2023 年 $1.4B 标记的估值就有支撑。基准情景下，Liquidity
              正是现有记录呈现的样子：一个有前景、越来越机构化的 私募信贷平台，融资渠道成熟度领先于披露成熟度。该情景支持相对 2023 年锚点有所升值，但不足以获得完整的软件式重估。悲观情景下，
              公开市场式纪律重新生效：融资成本上升，损失表现不如营销说法那么干净，或治理与控制缺口扩大。价值会被压到最后一个公开标记以下。
              这些分支指向「观察」建议。公司足够有意思，值得继续尽调；但在价格溢价且未明确的情况下，透明度还不足以支持买入。
