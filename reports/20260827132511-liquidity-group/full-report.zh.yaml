      - number: '2.5'
        title: 矛盾、品类重叠与未解决的规模缺口
        blocks:
          - type: paragraph
            body: >-
              本章最大的矛盾不是数字，而是定义。Liquidity 有时听起来像贷款机构，有时像服务贷款机构的技术提供商，有时又像基金平台。CB Insights 和 VCBacked
              也加深了这种模糊性：它们用债务融资和信贷创业公司来描述公司，同时呈现的竞争者和投资者集合又与嵌入式金融、创业债和专业信贷重叠。这个模糊点很重要，因为不同可比公司会导向完全不同的 TAM 和倍数框架。


              尽调上，正确做法是保留这些失败路径，而不是强行捏出一个虚假的单一数字。广义私募信贷 TAM 真实存在，但太粗。创业债 TAM 又太窄，因为 Liquidity 也服务中型市场和非 SaaS 垂直领域。软件融资
              TAM 同样不完整，因为客户基础还包括基础设施、支付和教育。更合适的判断是，Liquidity 位于全球私募信贷、非稀释性成长融资和 AI
              赋能承销的交汇处；需求证明足以支持继续研究，但公开披露不足以支撑精确的市场份额模型。
