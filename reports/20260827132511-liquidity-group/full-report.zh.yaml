      - number: '4.3'
        title: 成本结构、资本强度与资产负债表依赖
        blocks:
          - type: paragraph
            body: >-
              Liquidity 的成本结构由资本、承销人力和监控能力驱动，而不是轻软件式利润率。公司必须锁定放贷能力，管理仓储融资或 LP
              关系，维护技术和组合监控基础设施，配置信贷、法务和运营团队，并在交易表现不佳时吸收损失或计提拨备。KeyBank 授信额度本身就展示了分层负债结构：高级债加夹层和股权，这意味着混合资金成本和载体复杂度。公开
              BDC 可比组在这里有用：Hercules 申报文件展示了创业贷款机构如何从利息、费用和股权上行中赚钱，同时还必须遵守资产覆盖、监控和契约管理纪律。PIMCO 和 BDCInvestor
              补上反向视角：当估值标记维持高位而公开投资者要求折价，或当相对公开贷款的发放溢价收窄时，私募信贷经济性会被压缩。AI 赋能监控可能让 Liquidity
              具备结构性优势；但如果资金成本或损失波动恶化，毛利差可能很快收窄。
