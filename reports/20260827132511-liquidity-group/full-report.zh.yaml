  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与存量替代方案
        blocks:
          - type: paragraph
            body: >-
              Liquidity 既不是覆盖全部私募信贷，也不是覆盖全部创业债或所有企业贷款。官方产品页面把公司放在更窄的走廊里：面向成长期和中型市场公司的非稀释性私募信贷，尤其是需要 $10 million 到 $200
              million、看重速度、且往往缺少传统银行偏好硬资产的科技重度借款人。公开来源反复围绕后期和中型市场科技公司、定制化授信和结构化成长资本来描述公司，而不是种子期贷款、类似信用卡的中小企业信贷，或广泛的财务发起人收购融资。因此，被纳入的市场最好定义为：面向北美、欧洲、APAC
              和 MENA 科技及科技赋能公司的大额成长信贷。


              存量方案仍然很分散。SVB 代表银行主导的创新经济路线；Capchase 展示了供应商融资如何从买方侧切入软件预算；Lighter Capital 和 Fundbox
              代表小额收入型或营运资本替代方案；只要创始人仍能在可承受稀释下融资，传统风险股权或成长股权仍是默认选项。因此，Liquidity
              的价值主张不只是“用债替代股”，而是相比多数替代方案，为后期运营公司提供更快、更定制、更大规模的债务资本。
