  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 最高确信度风险栈
        blocks:
          - type: paragraph
            body: >-
              最重要的风险栈从模型和数据质量开始。Liquidity
              的价值主张依赖更快、更可扩展的私募信贷决策，这意味着数据摄取、情景设计或监控逻辑中的错误，可能直接传导为承销损失或干预延迟。第二层是法律和监管暴露：公司公开处理跨多辖区的敏感尽调、KYC
              和投资数据，而金融服务监管机构继续收紧隐私、网络安全、可解释性和记录保存要求。第三层是依赖风险。Liquidity 的规模与 MUFG、KeyBank
              等机构资本伙伴、第三方数据和银行集成，以及高水平产品、数据和信贷人才供给交织在一起。最后一层是传统信贷周期性。公开 BDC 数据和 2026
              年私募信贷评论显示，即便实际违约尚未出现，软件和小公司信贷也可能很快重新定价。Liquidity 可能有技术差异化，但并不免疫私募信贷的传导机制。
