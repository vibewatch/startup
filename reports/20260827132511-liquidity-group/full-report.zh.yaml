      - number: '4.4'
        title: 披露缺口、资本充足性与财务结论
        blocks:
          - type: paragraph
            body: >-
              核心财务问题不是缺少增长证据，而是缺少财务披露纪律。公开来源没有提供经审计收入、净息差、费用收益率、非应计率、储备政策、支出、EBITDA、烧钱速度或现金跑道。因此，无法检验 Liquidity
              的平台快速扩张是在转化为耐久的管理人经济性，还是增长消耗资本的速度快于费用和利差补充资本的速度。公司确实反复获得机构资本，这是正面信号；客户证据也显示，它能吸引质量高于困境贷款人的借款人。但信贷业务失败不只因为发放放缓，也会因为资金收紧、估值标记不再可信，或损失经验偏离增长叙事。按当前公开证据，Liquidity
              的资本充足性看起来强于披露充足性。正确的财务结论是：平台似乎有融资能力且具战略重要性；但在形成高确信财务承销前，进一步尽调必须聚焦已实现收益率、年份批次表现、储备和管理人层面的现金生成。
