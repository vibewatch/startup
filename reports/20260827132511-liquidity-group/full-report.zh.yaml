      - number: '1.4'
        title: 规模信号、扩张里程碑与有记录的时间线
        blocks:
          - type: paragraph
            body: >-
              Liquidity 近期最强的里程碑，是从区域性的以色列金融科技故事，转为可见的全球运营版图。阿布扎比合作让 Liquidity 成为首家加入 ADIO 创新计划的以色列公司，并在 ADGM
              设立聚焦机器学习赋能放贷科技的研发中心。2025 年 6 月的伦敦公告进一步确定欧洲总部、位于 Soho 的 5,000 平方英尺办公室、14 人投资团队、已投向 12 家英国公司的超过 £350
              million，以及五年内再部署 £1.5 billion 的计划。随后，公司在 2025 年和 2026 年通过品类重塑和 2026 年 Transatlantic Growth Awards
              的跨境认可继续强化叙事。


              时间线还显示，公司银行信用持续拓宽。早期股权来自 Spark 和 MUFG 关联投资者，2023 年融资让独角兽地位成形，2025 年 KeyBank
              授信额度标志着公司首次与美国银行建立合作。公开案例研究和官方页面还列出与 Butternut Box、Perk、Infra.Market、NALA、Eruditus 等公司的交易，覆盖欧洲、APAC
              和新兴市场通道。合在一起，里程碑记录支持真实规模和触达能力；但许多运营主张，尤其是违约表现、AUM 构成和收入增长，仍更多由管理层材料支撑，而非独立文件验证。
