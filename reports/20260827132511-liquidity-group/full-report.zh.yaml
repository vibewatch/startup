              客户故事中最难用公开证据证明的是耐久性。Liquidity 不发布净收入留存、总留存、重复提款统计，或组合层面首次借款人与重复借款人的拆分。现有的是代理信号。Eruditus
              描述其与多所大学的合作持续超过五年，与 Liquidity 的关系可追溯到 2022 年。Infra.Market 的 2025 年授信明确建立在既有成功合作之上，并延长了早前授信额度。Perk
