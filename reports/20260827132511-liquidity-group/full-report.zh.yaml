      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              Liquidity 的买方并不统一。在软件和金融科技公司，买方通常是 CFO
              或财务团队，使用者是管理层或司库，付款方则是要在稀释和流动性需求之间优化的公司资产负债表。在基础设施、教育和跨境支付领域，管理团队使用债务不只是过桥资本，也把它当作结构性工具，为库存、应收账款、预付款、资本开支或国际扩张融资。官方交易集显示，同一平台可以覆盖再融资、营运资本、制造扩张、国际发布和产品投资，同时不改变“非稀释性规模资本”这一核心承诺。


              采用路径同时受供给和工作流摩擦影响。Liquidity 自己的页面强调，创始人等待传统决策的时间过长，而其流程把条款清单时间从数周压缩到数天。Capchase
              和银行竞争者显示，买方越来越期待嵌入式或定制化融资，而不是通用贷款。与此同时，Rob Amato 和 Sonia Peterson 的市场访谈明确指出，区域胃口并不一致：美国出现更多带价格的 Series C+
              活动，银行对头部 SaaS 公司的定价也更激进；欧洲受益于股权市场解冻和收购机会；APAC 仍更谨慎，也更看重估值。
