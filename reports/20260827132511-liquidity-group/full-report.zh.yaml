  - id: FP001
    title: 竞争定位地图
    type: quadrant
    layout: wide
    summary: Liquidity 处在融资额度深度高、自动化程度也相对高的位置；银行和 BDC 既有玩家在信任与资金成本可信度上领先，小型金融科技公司则在嵌入式工作流便利性上领先。
    data:
      xAxis:
        label: 分销 / 关系杠杆（0-10 序数）
      yAxis:
        label: 定制化融资额度深度（0-10 序数）
      points:
        - label: Liquidity Group
          x: 7
          'y': 8
          detail: 大额定制化融资额度，加上 AI / 速度叙事。
          tone: positive
        - label: SVB
          x: 10
          'y': 8
          detail: 覆盖创新经济的银行关系和规模。
          tone: warning
        - label: Hercules Capital
          x: 8
          'y': 9
          detail: 公开上市的创投贷款专家，信任度强。
          tone: warning
        - label: TriplePoint
          x: 6
          'y': 8
          detail: 成熟的创投成长债务流程，品牌广度低于 SVB / HTGC。
          tone: neutral
        - label: Capchase
          x: 7
          'y': 4
          detail: 工作流嵌入极强，但用例更窄。
          tone: neutral
        - label: Lighter Capital
          x: 5
          'y': 4
          detail: 面向 SaaS、对创始人友好的较小规模融资。
          tone: neutral
        - label: Clearco
          x: 6
          'y': 4
          detail: 聚焦 DTC 的收入融资。
          tone: neutral
        - label: Fundbox
          x: 5
          'y': 2
          detail: SMB 营运资本获取，而非战略性成长债务。
          tone: warning
        - label: Pipe
          x: 6
          'y': 3
          detail: 嵌入式金融替代方案，不是深度定制信贷。
          tone: neutral
        - label: Arc
          x: 6
          'y': 3
          detail: 财资主导的替代方案，具备债务通道。
          tone: neutral
    approximationNotes: 坐标轴是根据公开产品页、披露的单笔规模线索和分销姿态推导的序数评估；比较的是相对定位，不是市场份额。
    claimRefs:
      - CP001
      - CP002
      - CP005
      - CP007
      - CP009
      - CP010
      - CP011
      - CP012
      - CP013
      - CP015
      - CP020
      - CP021
