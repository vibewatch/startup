      - number: '4.2'
        title: 公开牵引力与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              公开可见的是规模，不是损益表精度。Liquidity 称其已在 45+ 个垂直领域和 35+ 个国家部署超过 $2 billion；MUFG 支持的 Mars Growth Capital
              合资公司称，其管理资产（AUM）四年内从 $80 million 增至 $1.1 billion，并完成 80+ 笔投资。2025 年 KeyBank 授信额度又增加最高 $450 million
              的北美专项放贷能力，其中 $75 million 已初始承诺，并预计扩至 $250 million。客户融资也暗示借款人质量和经济性：NALA 增加 Liquidity 债务时，2024
              年股权融资中仍有一半以上在账；Perk 称其年化收入越过 $300 million，2025 年增长 48%，毛利率处于 70% 多中段，并在 Liquidity 加入时获得 $300 million
              授信；Butternut Box 为欧洲扩张融资超过 $80 million。这些信号显示，Liquidity 偏好有规模且经营动能强的借款人，有助于支撑信贷质量；但它们都没有揭示 Liquidity
              自身净收益率、抽成率、经损失调整后的回报或销售效率。
