      - number: '5.2'
        title: 架构、数据流与运营模式
        blocks:
          - type: paragraph
            body: >-
              公开架构细节很薄，但现有来源支持一个分层模型。底层是从借款人报告、市场信号、新闻流和其他非结构化输入中摄取并汇聚数据。其上是模型层，负责综合信息、排序可能性、测试结构情景，并标记组合中浮现的风险。再上层的工作流或应用层，把这些输出以决策支持形式呈现给信贷专业人士，而不是交给机器完全自主决策。最有信息量的公开信号，是招聘市场语言中出现的数据管道、模型层、应用层、RAG、评估、幻觉缓解和智能体系统。这些词汇指向现代
              AI 产品架构，但不能证明哪些模型是自研的、哪些供应商来自外部，或生产环境里有哪些治理控制。因此，运营模式在概念上清楚，在落地细节上模糊。
