  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同业、既有机构、相邻玩家与替代方案
        blocks:
          - type: paragraph
            body: >-
              不能只拿 Liquidity 和其他私募信贷机构对标。真实格局至少横跨五条赛道。第一类是直接或近似直接的信贷竞争者，例如 Hercules Capital、TriplePoint，以及 SVB
              这类创新银行平台，它们同样为有风投背景或成长期科技公司提供结构化债务。第二类是相邻的非稀释性融资方，如 Lighter Capital、Clearco、Fundbox 和
              Capchase，它们解决部分资本问题，但通常票面更小、期限更短，或承销更标准化。第三类是 Pipe 和 Arc
              这类软件或司库替代方案，它们把融资或现金管理嵌入既有工作流，从而降低客户对定制化债务工具的需求。第四类是内部替代方案，包括成长股权、自身现金生成和财务发起人主导的资产负债表支持。实际结果是，Liquidity
              的竞争边界在创业债、私募信贷和金融基础设施交界处，而不是一个单一商品化资金池。
