              Liquidity 客户基础中最清晰的扩张模式不是按席位扩张的 SaaS，而是授信规模扩张。随着通道扩张，NALA 的授信额度包含扩容能力。Eruditus 获得的初始再融资带有扩容选项。Infra.Market
              的授信延长既有额度，并增加增量能力。Perk
              用条件更好的新授信替换早前授信，本身也是重复关系的一种形式。这正是私募信贷投资者希望看到的客户行为，但有一个重要前提：公开的只有成功故事。没有头部借款人集中度表，没有按风险敞口列示的行业集中度，没有被拒续约披露，也没有问题重组的公开名单。2026
              年独立私募信贷评论也显示，软件和小公司信贷承压分化更广。这意味着 Liquidity
              精选借款人样本是产品市场匹配的好证据，但不是组合韧性的完整证据。在管理层分享风险敞口表和重复行为队列前，客户质量和客户集中度只能被视为部分有证据，而不是完全验证。
