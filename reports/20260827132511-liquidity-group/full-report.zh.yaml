      - number: '3.2'
        title: 能力对比：Liquidity 哪里更宽，竞争者哪里更锋利
        blocks:
          - type: paragraph
            body: >-
              最清楚的功能差异是覆盖范围。Liquidity 对外销售的是定制化成长期私募信贷、资本形成支持，以及横跨 35+ 个国家和 45+ 个行业的 AI 赋能监控。这与 Capchase 差异很大，后者更适配 B2B
