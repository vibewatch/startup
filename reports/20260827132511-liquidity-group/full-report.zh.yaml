              公开客户证据显示 Liquidity
              向具规模公司放贷，这是正面因素，但不能解决集中度或周期风险。公司没有发布头部借款人敞口、观察名单迁移、非应计趋势或重复提款队列。因此，投资者只能从成功案例和伙伴背书中推断组合韧性。在 2026 年公开 BDC
              出现估值标记分化、股息压力和借款人压力的市场里，这还不够。Liquidity 自己的资本形成营销主张，包括自 2019 年以来 0% 损失率、16%
              年化无杠杆收益率和多十亿美元机构平台，让上行情景更强，也把证据门槛抬得更高。如果这些主张没有强健的未公开报告支撑，任何监管摩擦、数据泄露、伙伴退出或信贷表现不佳的迹象，都可能让信心迅速恶化。因此，正确的投资立场应是有条件的：把
              Liquidity 视为有前景的标的，但要求与信贷质量、控制和融资韧性绑定的具体否决标准。
