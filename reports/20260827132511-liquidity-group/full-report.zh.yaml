      - number: '1.3'
        title: 融资历史、战略投资者与外部资本基础
        blocks:
          - type: paragraph
            body: >-
              公开融资脉络显示，公司机构化速度很快。2020 年 10 月，Liquidity 宣布获得 Spark Capital 和 MUFG Innovation Partners 的 $20 million
              股权融资，估值约 $100 million，投资人取得 20% 股本，Meitav Dash 持股降至 44.6%。2022 年和 2023
              年，公司不再只依赖风险股权融资，而是加深了与更大资产负债表伙伴的关系。公司和媒体资料称，2022 年初 Apollo 关联方和 MUFG 牵头提供约 $775 million 资本承诺，同年晚些时候 MUFG
              又向更广泛的基金架构投入 $250 million，2023 年公司进一步完成 $40 million 股权融资，并称估值达到 $1.4 billion。


              投资人质量与头部金额同样重要。MUFG 反复以股权投资人、LP 和 Mars Growth Capital 合资伙伴身份出现；Spark 提供股权资本，也带来技术商业化关系；Apollo 出现在 2022
              年融资浪潮中；KeyBank 则牵头了 2025 年 3 月的北美授信额度。官方 2026 年材料称，Mars Growth Capital 在四年内从成立时的 $80 million 增至 $1.1
              billion 管理资产（AUM），并完成 80+ 笔投资，说明 Liquidity
              已经从孤立的一次性授信，走向可重复的机构平台。未解的问题是，这些资本中有多少是公司层面股权，多少是合作伙伴或基金资本；公开材料经常把公司规模和受托基金规模混在一起。
