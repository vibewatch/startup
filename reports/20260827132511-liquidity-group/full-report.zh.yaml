      - number: '2.4'
        title: 增长驱动、采用约束与证据边界
        blocks:
          - type: paragraph
            body: >-
              最强的增长驱动，是科技公司对缓慢或僵硬融资方式的结构性不满。Liquidity 官方材料围绕速度、定制化结构、监控和人工引导的 AI
              承销来定位公司；第三方市场来源则显示，私募信贷管理人仍预期资金流入，资产负债表更强的公司继续举债以降低稀释。公开和私募股权市场部分重启，反而利好这一品类：接近盈亏平衡的公司更容易获得融资，收购机会改善，借款人也有更多选择来混合使用债务和股权。


              约束同样清晰。PwC 称私募信贷已进入压力更高的阶段，违约、监管关注和赎回压力上升；SG Analytics 认为承销纪律已经成为分水岭；FINRA 强调流动性缓冲和压力测试；Liquidity
              自己的产品理念也明确警惕黑箱 AI 和薄弱监控。换句话说，这个品类吸引人，是因为它大且低效；但它也容错很低。留存证据没有给出清晰的市场份额分母、单一公认 TAM，或 Liquidity
              自身的借款人数量序列，所以审慎的分析立场应是“大、扩张中、但证据受限”，而不是“无边界”。
