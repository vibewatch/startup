  - id: FP003
    title: 护城河 / 准备度 KPI
    type: kpi
    layout: standard
    summary: 紧凑评分卡：仅凭公开证据看 Liquidity 的竞争位置有多耐久。
    data:
      items:
        - label: 融资额度规模竞争力
          value: 8
          unit: /10
          note: 官方公开区间显著大于 SMB 或 DTC 替代方案。
        - label: 速度 / 自动化叙事
          value: 8
          unit: /10
          note: 几天内给出条款清单，AI 驱动工作流，都是强卖点。
        - label: 分销杠杆
          value: 6
          unit: /10
          note: 机构背书有帮助，但银行既有玩家仍掌握更多第一通电话关系。
        - label: 资金成本优势
          value: 4
          unit: /10
          note: 在标准化交易中，上市银行和 BDC 很可能保留更低成本资本。
        - label: 产品广度
          value: 7
          unit: /10
          note: 从获客到监控的叙事比多数金融科技替代方案更宽。
        - label: 披露 / 信任可见度
          value: 4
          unit: /10
          note: 公开证据对已实现信用表现和单位经济性仍有限。
        - label: 护城河耐久性
          value: 5
          unit: /10
          note: 护城河真实存在，但仍取决于执行，还没到显然永久的程度。
    approximationNotes: 评分是基于公开证据的投委会式判断，不是公司披露的 KPI。
    claimRefs:
      - CP013
      - CP020
      - CP031
      - CP032
      - CP033
      - CP034
      - CP037
      - CP038
  - id: FI001
    title: 收入模型桥
    type: flow
    layout: wide
    summary: 公开证据显示，Liquidity 的收入栈从机构资本开始，最终落到利差、费用，以及可能与股权挂钩的上行，但披露的结构仍很薄。
    data:
      nodes:
        - id: n1
          label: 机构资本基础
          detail: MUFG 支持的载体、KeyBank 融资额度、夹层债和股权提供放款能力。
        - id: n2
          label: 获客 / 承保
          detail: AI 驱动筛选和定制化结构设计，用来识别并塑造成长信贷交易。
        - id: n3
          label: 贷款投放
          detail: 资本投向后期和中端市场公司的融资额度。
        - id: n4
          label: 当期收入
          detail: 利息或利差收入，以及可能的承诺费 / 安排费。
        - id: n5
          label: 监控 / 修订
          detail: 生命周期监督可以产生额外经济性，或守住信用质量。
        - id: n6
          label: 已实现回报
          detail: 净回报取决于资金成本、损失、回收，以及任何股权挂钩上行。
      edges:
        - from: n1
          to: n2
          label: 为平台供资
        - from: n2
          to: n3
          label: 发起
        - from: n3
          to: n4
          label: 累积
        - from: n3
          to: n5
          label: 需要
        - from: n5
          to: n6
          label: 守住
        - from: n4
          to: n6
          label: 贡献
    approximationNotes: 这座桥来自 Liquidity 定位和上市创投贷款机构文件的推断；Liquidity 不公布收入瀑布。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI028
  - id: FI002
    title: 单位经济性可见度桥
    type: flow
    layout: wide
    summary: 从资本可得性到借款人质量，公开链条可见；但最终如何转化为 Liquidity 管理人收益仍缺失。
    data:
      nodes:
        - id: u1
          label: 资本可得性
          detail: Mars 管理资产（AUM）、KeyBank 支持的融资额度和机构背书形成放款能力。
        - id: u2
          label: 借款人筛选
          detail: Liquidity 瞄准具备运营动能的成长和后期公司。
        - id: u3
          label: 组合质量
          detail: 公开叙事强调 2019 年以来 0.00% 信用损失，以及人工指导的监控。
        - id: u4
          label: 费用 / 利差获取
          detail: 已投放资本如何转化为管理人收入，公开信息未知。
        - id: u5
          label: 管理人盈利能力
          detail: 未披露公开的 EBITDA、NII 或现金生成数据。
      edges:
        - from: u1
          to: u2
          label: 为资产生成供资
        - from: u2
          to: u3
          label: 驱动
        - from: u3
          to: u4
          label: 支撑
        - from: u4
          to: u5
          label: 应转化为
    approximationNotes: 组合规模如何转化为管理人收益缺少公开桥接数据，是本章的关键尽调缺口。
    claimRefs:
      - CI013
      - CI014
      - CI016
      - CI023
      - CI024
