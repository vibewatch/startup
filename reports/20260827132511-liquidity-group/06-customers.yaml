- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Factor
  - Expansion driver / concentration risk
  - Magnitude / impact
  - Diligence path
  rows:
  - - Structured scale-up options
    - NALA, Eruditus, and Infra.Market all show scale-up tranches or extensions
    - High upside — expansion can compound without equity dilution
    - Review amendment history, utilization, and pricing step-ups
  - - Repeat relationship signal
    - Perk replaced a prior line on better terms; Infra and Eruditus deepened existing ties
    - Positive for customer stickiness
    - Request repeat-borrow share and borrower lifetime value
  - - Operationally dense borrowers
    - Facilities fund manufacturing lines, treasury pre-funding, AI product rollout, and supply chains
    - High strategic value but high underwriting complexity
    - Map monitoring KPIs by borrower archetype
  - - Top-borrower opacity
    - No public top-10 borrower, top-sector, or top-geography exposure disclosures
    - Potentially material downside if book is concentrated
    - Request exposure tables by borrower, sector, geography, and vintage
  - - Survivorship bias
    - Only successful named customers are public; no declined renewals or troubled restructurings disclosed
    - Medium-High information risk
    - Request loss cases, restructurings, and watchlist migration data
  - - Macro credit dispersion
    - 2026 private-credit commentary shows software and smaller-company credits can reprice quickly
    - Medium portfolio-risk amplifier
    - Stress test concentration against slower growth, spread widening, and non-accrual scenarios
  notes: The visible expansion loop is facility scaling and refinancing, not a self-serve usage upsell motion.
