      detail: Company has a defined capital use case and enough operating data for underwriting.
    - id: a2
      label: Bottom-up diligence
      detail: Liquidity stresses scenarios, working-capital needs, and sector-specific operating drivers.
    - id: a3
      label: Tailored facility
      detail: Structure may be a term loan, revolving line, refinancing, or scale-up option.
    - id: a4
      label: Production deployment
      detail: Capital is used for pre-funding, product expansion, manufacturing, M&A, or distribution growth.
    - id: a5
      label: Milestone validation
      detail: Borrower scale is reinforced by public operating metrics or partner/customer quotes.
    - id: a6
      label: Extension / repeat relationship
      detail: Some customers refinance, extend, or replace earlier facilities on better terms.
