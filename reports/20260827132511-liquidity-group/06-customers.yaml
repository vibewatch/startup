company:
  name: Liquidity Group
chapter:
  number: 6
  title: Customers
summary: 'Liquidity Group''s customer proof is strongest where it should matter most for a private-credit lender: the company can point to named, scaled borrowers operating across payments, travel and spend software, consumer subscriptions, executive education, and building materials. NALA, Perk, Butternut Box, Eruditus, and Infra.Market all appear to be real production customers using sizable, purpose-built facilities rather than pilot borrowers. The weakness is portfolio transparency. Public materials show why these borrowers took credit and how large they are, but they do not show Liquidity''s active customer count, top-borrower concentration, repeat-draw rates, renewal behavior, or any loss-adjusted cohort retention view.'
sections:
- id: segment-and-buyer-map
  title: Who pays, who uses, and what the visible customer base looks like
  body: Liquidity's customers are not end consumers and they are not generic small-business borrowers. The visible buyer is usually a founder, CFO, treasury lead, or operating team at a scaled technology or tech-enabled company that needs non-dilutive capital for a clearly defined expansion task. Public evidence spans cross-border payments infrastructure at NALA, AI-native travel-and-spend software at Perk, consumer pet-food manufacturing expansion at Butternut Box, global executive education at Eruditus, and construction supply-chain scaling at Infra.Market. That spread matters because it suggests the underwriting model is flexible across business models while still targeting companies with substantial operating complexity. At the same time, the public set is curated. Liquidity discloses logos, narrative case studies, and selected financing announcements, but not the denominator behind them. The result is credible segmentation proof with incomplete portfolio breadth disclosure. That gap
    matters because a lender can look diversified in logos while still being concentrated in exposure, draw usage, or borrower vintage.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: named-customer-proof-and-adoption
  title: Named customer proof and adoption trajectory signals
  body: 'The named customer proof is much better than a simple logo wall. Each highlighted borrower comes with a financing purpose that matches a real operating need: NALA needed working capital to pre-fund wallets and enterprise payouts, Perk wanted product, AI, and U.S. expansion capital, Butternut needed manufacturing and refinancing support, Eruditus refinanced to support profitable global expansion, and Infra.Market extended a long-term facility to scale distribution and production. Public adoption trajectory is still indirect because Liquidity does not disclose active borrower counts or quarterly net additions. Instead, the evidence comes from the scale of the customers themselves: NALA''s banking and wallet footprint, Perk''s 12,000-company base, Butternut''s hundreds of thousands of pets served, Eruditus''s million-plus learners and 80-plus university partners, and Infra.Market''s thousands of touchpoints. That does not quantify Liquidity''s own installed base, but it does validate
    that the lender is financing production-scale operators.'
