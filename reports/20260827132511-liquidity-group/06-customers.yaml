- id: expansion-concentration-and-risk
  title: Expansion loops exist, but concentration and adverse outcomes remain opaque
  body: 'The clearest expansion pattern in Liquidity''s customer base is not seat-based SaaS expansion but facility scaling. NALA''s line includes scale-up capacity as corridors expand. Eruditus received an initial refinancing with a scale-up option. Infra.Market''s facility extends an existing line and adds incremental capacity. Perk replaced a prior facility on improved terms, which is its own form of repeat relationship. This is exactly the kind of customer behavior a private-credit investor wants to see, but it comes with an important caveat: only the successful stories are public. There is no top-borrower concentration table, no sector concentration by exposure, no declined renewal disclosure, and no public list of troubled restructurings. Independent private-credit commentary from 2026 also shows broader stress dispersion across software and smaller-company credit. That means Liquidity''s curated borrower set is good evidence of product-market fit, but incomplete evidence of portfolio
    resilience. Until management shares exposure tables and repeat-behavior cohorts, customer quality and customer concentration must be treated as partially evidenced rather than fully verified.'
