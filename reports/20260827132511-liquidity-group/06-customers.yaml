- id: retention-and-durability
  title: Retention, repeat usage, and durability are only partly visible
  body: Durability is the hardest part of the customer story to prove from public evidence. Liquidity does not publish net revenue retention, gross retention, repeat-draw statistics, or a portfolio-level split between first-time and repeat borrowers. What does exist are proxy signals. Eruditus describes a partnership with many universities lasting more than five years and a Liquidity relationship dating to 2022. Infra.Market's 2025 facility explicitly builds on a successful existing partnership and extends an earlier line. Perk's migration materials say customer contracts, data, and integrations continue unchanged through the rebrand, which suggests account continuity for an installed base rather than a reset. NALA shows active enterprise demand and at least one named enterprise customer through MoneyGram. These are helpful signals, but they are survivorship-biased and cannot substitute for cohort tables. Public proof supports ongoing customer activity; it does not prove portfolio retention
    quality.
  claimRefs:
  - CU014
  - CU021
  - CU022
  - CU027
  - CU030
  - CU032
