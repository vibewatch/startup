      - number: '2.2'
        title: Sizing through macro, serviceable, and observed lenses
        blocks:
          - type: paragraph
            body: >-
              The strongest macro lens comes from PwC and SG Analytics rather than from Liquidity itself. PwC’s 2026
              survey says private credit now manages more than $2 trillion in AUM and could reach $3.4 trillion by 2030,
              while SG Analytics describes 2026 as a transition out of purely defensive deployment into a cycle where
              underwriting discipline and structural control matter more because defaults and performance dispersion are
              rising. Those numbers are far too broad to call Liquidity’s TAM, but they do establish that the relevant
              asset class is now deep, global, and institutionally important.


              The serviceable market for Liquidity is narrower than total private credit. Official pages and transaction
              announcements point to growth-stage and mid-market companies taking facilities from roughly $10 million to
              $200 million, with Mars Growth Capital often working in the $20 million to $100 million range across APAC
              and EMEA. Named financings with NALA, Perk, Eruditus, Butternut Box, and Infra.Market show the practical
              SOM: software, fintech, education, infrastructure, and consumer-category champions using tailored credit
              for working capital, refinancing, capex, expansion, or acquisition-like growth. That yields a bounded
              conclusion: the market is clearly big enough for a multi-billion platform, but public evidence still
              supports a range view rather than a single precise TAM figure.
