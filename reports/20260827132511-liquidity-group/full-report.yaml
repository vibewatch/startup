        - label: Bull case valuation
          low: 2.6
          mid: 3.1
          high: 3.6
          unit: USD B
          note: Validated losses, strong manager economics, and better exit optionality
        - label: Preferred engagement zone
          low: 1.4
          mid: 1.6
          high: 1.8
          unit: USD B
          note: Range that compensates for today's public evidence gap
    claimRefs:
      - CV038
      - CV042
      - CV043
      - CV044
      - CV046
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      The scorecard gives the company real credit for funding access and borrower quality while penalizing disclosure
      completeness and valuation support.
    data:
