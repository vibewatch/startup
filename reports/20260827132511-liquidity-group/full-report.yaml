  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Liquidity is not operating in all of private credit, all venture debt, or all business lending. The
              official product pages place it in a narrower corridor: non-dilutive private credit for growth-stage and
              mid-market companies, especially technology-heavy borrowers that need $10 million to $200 million, value
              speed, and often lack the hard assets preferred by traditional banks. Public sources repeatedly frame the
              company around late-stage and mid-market technology companies, bespoke facilities, and structured growth
              capital rather than seed lending, card-like SME credit, or broad sponsor buyout financing. That means the
              included market is best described as large-ticket growth credit for tech and tech-enabled companies across
              North America, Europe, APAC, and MENA.


              The status quo remains diverse. SVB represents the bank-led innovation-economy route; Capchase shows how
              vendor financing attacks software budgets from the buyer side; Lighter Capital and Fundbox represent
              smaller-ticket revenue-based or working-capital substitutes; and traditional venture or growth equity
              remains the default option whenever founders can still raise without intolerable dilution. Liquidity’s
              value proposition is therefore not simply “debt instead of equity,” but faster, more bespoke, larger-scale
              debt than most of those alternatives can provide to later-stage operators.
