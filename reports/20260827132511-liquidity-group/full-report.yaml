      - number: '4.3'
        title: Cost structure, capital intensity, and balance-sheet dependency
        blocks:
          - type: paragraph
            body: >-
              Liquidity’s cost structure is driven by capital, underwriting labor, and monitoring capability rather than
              by lightweight software margins. The company must secure lending capacity, manage warehouse or LP
              relationships, maintain technology and portfolio-surveillance infrastructure, staff credit, legal, and
              operations teams, and absorb losses or provisioning when deals underperform. The KeyBank facility
              structure itself shows a layered liability stack with senior debt plus mezzanine and equity, which implies
              blended funding costs and vehicle complexity. The public BDC comparator set is useful here: Hercules
              filings show how venture lenders make money from interest, fees, and equity upside but also operate under
              asset-coverage, monitoring, and covenant-management disciplines. PIMCO and BDCInvestor add the adverse
              lens by showing that private-credit economics can compress when marks stay elevated but public investors
              demand discounts, or when origination premiums over public loans shrink. Liquidity may be structurally
              advantaged by AI-enabled monitoring, but if its cost of funds or loss volatility worsens, gross spreads
              could narrow quickly.
