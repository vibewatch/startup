  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Liquidity’s public product story reads like a layered private-credit decision stack from data ingestion to
      governance and institutional deployment.
    data:
      layers:
        - label: Data and signal layer
          modules:
            - Borrower reporting
            - News and market signals
            - Comparable transaction benchmarks
            - Institutional workflow data
        - label: Model and analytics layer
          modules:
            - Opportunity ranking
            - Scenario analysis
            - Structure simulation
            - Anomaly and correlation detection
        - label: Workflow application layer
          modules:
            - Investment decision support
            - Credit-committee preparation
            - Portfolio watchlist / exception views
            - User-facing internal applications
        - label: Governance layer
          modules:
            - Human-in-the-loop review
            - Explainability / challengeability
            - Override and judgment controls
            - Policy and compliance handling
        - label: Deployment layer
          modules:
            - Liquidity-managed lending book
            - Institution partner use cases
            - Cross-vertical borrower workflows
            - Global operating teams
    approximationNotes: >-
