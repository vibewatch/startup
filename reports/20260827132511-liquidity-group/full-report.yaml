      - number: '2.5'
        title: Contradictions, category overlap, and unresolved sizing gaps
        blocks:
          - type: paragraph
            body: >-
              The biggest contradiction in this chapter is definitional rather than numerical. Liquidity sometimes
              sounds like a lender, sometimes like a technology provider for lenders, and sometimes like a fund
              platform. CB Insights and VCBacked reinforce that ambiguity by describing the company in debt-financing
              and credit-startup terms while also surfacing competitor and investor sets that overlap with embedded
              finance, venture debt, and specialty credit. That ambiguity matters because different comparables imply
              very different TAM and multiple frameworks.


              For diligence, the solution is to preserve the failed paths instead of forcing a false one-number
              estimate. A broad private-credit TAM is real but too coarse. A venture-debt TAM is too narrow because
              Liquidity also funds mid-market and non-SaaS verticals. A software-financing TAM is also incomplete
              because the customer base includes infrastructure, payments, and education. The right view is that
              Liquidity sits at the intersection of global private credit, non-dilutive growth financing, and AI-enabled
              underwriting, with enough demand proof to justify further work but not enough public disclosure to support
              a precise market-share model.
            claimRefs:
