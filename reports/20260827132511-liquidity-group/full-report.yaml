  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization logic
        blocks:
          - type: paragraph
            body: >-
              Liquidity’s economic engine is best understood as a private-credit platform rather than a SaaS vendor,
              even though technology is central to its pitch. The retained sources imply several monetization channels:
              interest or spread income on originated loans; structuring, commitment, and other transaction fees that
              typically accompany bespoke credit; potential upside from capital-formation activities or affiliated
              vehicles; and possibly warrant-like or equity-linked economics in some structures, although Liquidity does
              not disclose a standard instrument menu publicly. The closest transparent analogues are public venture
              lenders such as Hercules and TriplePoint, whose filings show a model built around current income from debt
              plus ancillary fees and equity participation. Liquidity likely earns in a related way, but public evidence
              does not disclose its realized blend of fee income versus recurring yield, nor whether economics sit
              primarily at the fund level, manager level, or both. That missing mix is the first major underwriting
              blocker.
