  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Highest-conviction risk stack
        blocks:
          - type: paragraph
            body: >-
              The most material risk stack starts with model and data quality. Liquidity's value proposition depends on
              faster, more scalable private-credit decisions, which means errors in data ingestion, scenario design, or
              monitoring logic could propagate directly into underwriting losses or delayed interventions. The second
              layer is legal and regulatory exposure: the company publicly handles sensitive due-diligence, KYC, and
              investment data across multiple jurisdictions, while financial-services regulators continue to tighten
              expectations around privacy, cybersecurity, explainability, and recordkeeping. The third layer is
              dependency risk. Liquidity's scale is intertwined with institutional capital partners such as MUFG and
              KeyBank, with third-party data and banking integrations, and with the availability of high-caliber
              product, data, and credit talent. The final layer is plain old credit cyclicality. Public BDC data and
              private-credit commentary in 2026 show that software and smaller-company credits can reprice quickly even
              before realized defaults appear. Liquidity may be technologically differentiated, but it is not exempt
              from the transmission mechanisms of private credit.
