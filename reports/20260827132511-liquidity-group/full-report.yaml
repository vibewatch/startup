chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and operating model
        blocks:
          - type: paragraph
            body: >-
              Liquidity Group presents itself today as an AI-native private credit lender rather than a generic fintech
              marketplace. The official homepage and private-credit page state that the firm deploys flexible capital in
              tickets from $10 million to $200 million to growth-stage and mid-market companies, operates across 35+
              countries and 45+ business verticals, and has recorded a 0.00% credit loss rate since 2019. The operating
              model described across official materials is a full credit-lifecycle stack: origination, analysis,
              structuring, monitoring, and expansion into new credit verticals are all supported by proprietary
              machine-learning infrastructure, while human investment staff retain final judgment. Product structures
              publicly listed include term loans, revolving credit facilities, acquisition financing, and MRR-linked
              lines.


              The geographic identity is more nuanced than a single-country label. Third-party profiles and the London
              headquarters announcement anchor current headquarters in New York, while earlier reporting and the Abu
              Dhabi partnership materials describe the company as Israeli-founded and historically Tel Aviv-based. By
              mid-2025 the company said it operated from London, New York, Singapore, Tel Aviv, Abu Dhabi, and San
              Francisco, which is consistent with its own claim to global reach and with the 2026 award-page statement
              that the organization works across five major hubs and 26 nationalities. The most defensible framing is
              therefore Israeli-founded with a current New York corporate center and meaningful operating hubs in EMEA,
              APAC, and the Gulf.
