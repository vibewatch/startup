      - number: '3.2'
        title: 'Capability comparison: where Liquidity is broader and where rivals are sharper'
        blocks:
          - type: paragraph
            body: >-
              The clearest functional difference is scope. Liquidity markets bespoke growth-stage private credit,
              capital-formation support, and AI-enabled monitoring across 35-plus countries and 45-plus sectors. That is
              very different from Capchase, which is optimized for vendor financing in B2B software and hardware
              purchases, or from Clearco and Fundbox, which focus on smaller-ticket working-capital or revenue-linked
              financing. Lighter Capital remains a meaningful substitute for recurring-revenue software companies, but
              its public targeting and qualification criteria imply a much earlier and smaller borrower cohort than
              Liquidity usually serves. Public venture lenders sit closer. Hercules positions itself as the largest BDC
              focused on venture lending, while TriplePoint’s management lineage is deeply rooted in technology finance
              and venture lending. Those firms compete more directly on underwriting credibility and capital
              availability, but less on the explicit AI-enabled lifecycle narrative that Liquidity now uses to frame
              origination, structuring, and monitoring.
