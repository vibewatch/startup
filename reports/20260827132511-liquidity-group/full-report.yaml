            body: >-
              Liquidity's customers are not end consumers and they are not generic small-business borrowers. The visible
              buyer is usually a founder, CFO, treasury lead, or operating team at a scaled technology or tech-enabled
              company that needs non-dilutive capital for a clearly defined expansion task. Public evidence spans
              cross-border payments infrastructure at NALA, AI-native travel-and-spend software at Perk, consumer
              pet-food manufacturing expansion at Butternut Box, global executive education at Eruditus, and
              construction supply-chain scaling at Infra.Market. That spread matters because it suggests the
              underwriting model is flexible across business models while still targeting companies with substantial
              operating complexity. At the same time, the public set is curated. Liquidity discloses logos, narrative
              case studies, and selected financing announcements, but not the denominator behind them. The result is
              credible segmentation proof with incomplete portfolio breadth disclosure. That gap matters because a
              lender can look diversified in logos while still being concentrated in exposure, draw usage, or borrower
