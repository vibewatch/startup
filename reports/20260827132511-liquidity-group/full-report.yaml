  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, adjacents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              Liquidity should not be benchmarked only against other private-credit firms. The real landscape spans at
              least five lanes. First are direct or near-direct credit competitors such as Hercules Capital,
              TriplePoint, and innovation-banking platforms like SVB that also serve venture-backed or growth-stage
              technology companies with structured debt. Second are adjacent non-dilutive financers such as Lighter
              Capital, Clearco, Fundbox, and Capchase, which solve parts of the capital problem but mostly at smaller
              ticket sizes, shorter durations, or more standardized underwriting. Third are software or treasury
              substitutes like Pipe and Arc, which can reduce the need for a bespoke debt facility by embedding
              financing or cash management into existing workflows. Fourth are internal alternatives, including growth
              equity, internal cash generation, and sponsor-led balance-sheet support. The practical result is that
              Liquidity competes on the edge of venture debt, private credit, and financial infrastructure rather than
              in a single commoditized pool.
