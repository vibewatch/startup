      - CV032
      - CV038
      - CV045
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      The valuation debate is most sensitive to where investors anchor entry relative to the stale 2023 round and the
      public-lender discipline implied by 2026 comparables.
