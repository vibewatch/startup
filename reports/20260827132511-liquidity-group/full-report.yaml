              Public architecture detail is thin, but the available sources support a layered model. At the foundation
              is data ingestion and aggregation from borrower reporting, market signals, news flow, and other
              unstructured inputs. Above that sits a model layer that synthesizes information, ranks possibilities,
              tests structure scenarios, and flags emerging portfolio risks. A workflow or application layer then
              presents these outputs to credit professionals in decision-support form rather than as a fully autonomous
              machine. The most revealing public signal is the job-market language around data pipelines, model layers,
              application layers, RAG, evaluation, hallucination mitigation, and agent-based systems. That vocabulary
              suggests a modern AI product architecture, but it does not prove which models are proprietary, which
              vendors are external, or what governance controls exist in production. The operating model is therefore
