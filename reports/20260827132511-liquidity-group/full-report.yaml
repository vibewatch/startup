      - number: '2.4'
        title: Growth drivers, adoption constraints, and evidence limits
        blocks:
          - type: paragraph
            body: >-
              The strongest growth driver is structural dissatisfaction with slow or inflexible financing for technology
              companies. Official Liquidity materials position the firm around speed, bespoke structuring, monitoring,
              and human-guided AI underwriting, while third-party market sources show that private credit managers still
              expect inflows and that companies with stronger balance sheets continue to raise debt to reduce dilution.
              The reopening of parts of the public and private equity markets paradoxically helps the category:
              near-breakeven companies become more financeable, acquisition opportunities improve, and borrowers have
              more optionality to blend debt and equity.


              The constraints are just as visible. PwC says private credit has entered a more pressured phase with
              defaults, regulatory focus, and redemption stress; SG Analytics argues underwriting discipline has become
              the differentiator; FINRA emphasizes liquidity buffers and stress testing; and Liquidity’s own product
              philosophy now explicitly warns against black-box AI and weak monitoring. Put differently, the category is
              attractive because it is large and inefficient, but it is also unforgiving. No retained evidence supplies
              a clean market-share denominator, a single accepted TAM, or a borrower-count series for Liquidity itself,
              so the prudent analytical stance is “large, expanding, and evidence-constrained,” not “boundless.”
            claimRefs:
