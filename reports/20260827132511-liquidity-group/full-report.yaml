      - number: '8.4'
        title: Exit readiness, thesis-break triggers, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Liquidity is large enough to plausibly aspire to an IPO or strategic outcome, but public evidence does not
              validate an exit timeline. Retained sources did not show a 2025 or 2026 priced equity round, banker
              mandate, formal listing venue process, or secondary-market price discovery. That means investors should
              not underwrite the thesis on narrative exit optionality alone. Instead, the right finishing move is a hard
              diligence list. First, obtain vintage-by-vintage credit performance, non-accrual history, recoveries, and
              reserve methodology. Second, get manager-level economics: recurring fee income, realized yield, expenses,
              and cash generation. Third, inspect the current cap table and liquidation preferences because return math
              changes meaningfully if senior terms or anti-dilution protections are heavy. Fourth, ask for any 2026
              board materials or third-party valuation analyses that could bridge the gap between the stale 2023 unicorn
              mark and today’s stronger but still indirect operating signals. Until those items are in hand, the
              valuation thesis is incomplete by design, and the recommendation should remain conditional rather than
              promotional.
            claimRefs:
