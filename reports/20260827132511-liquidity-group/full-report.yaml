  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation anchor, capital access, and disclosure reality
        blocks:
          - type: paragraph
            body: >-
              Liquidity’s public valuation story has a clean starting point and a messy continuation. The clean part is
              2023: official and third-party coverage line up around a $40 million MUFG-led equity round that the
              company said valued Liquidity at $1.4 billion, bringing total equity raised to roughly $120 million. The
              messy part is everything after that. Public evidence since then is rich on scale signals but poor on price
              discovery. Liquidity added a KeyBank-anchored credit facility of up to $450 million for North America,
              Mars Growth Capital grew to $1.1 billion of AUM with 80-plus investments, and the London expansion
              announcement signaled continuing deployment ambition. Yet none of those facts tells investors what a fresh
              common-equity round would clear at in 2026. They speak to funding access and strategic relevance, not to
              current equity price. The core valuation problem is therefore disclosure asymmetry: compared with the
              visible capital-partner momentum, public revenue, reserve, NAV, preference-stack, and
              manager-cash-generation disclosures remain unusually thin. That makes the 2023 unicorn mark useful as an
              anchor, but insufficient as a current answer.
            claimRefs:
              - CV001
              - CV002
              - CV003
