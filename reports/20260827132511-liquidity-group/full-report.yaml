    type: flow
    layout: wide
    summary: >-
      The lender-side workflow begins with signal aggregation, moves through human-guided structuring, and continues
      into telemetry-driven monitoring after close.
    data:
      nodes:
        - id: w1
          label: Ingest signals
          detail: Borrower, market, and qualitative data enter the workflow.
        - id: w2
          label: Rank opportunity
          detail: AI prioritizes relevance, patterns, and comparable signals.
        - id: w3
          label: Structure facility
          detail: Scenarios test covenants, repayment profile, and capital structure.
        - id: w4
          label: Human decision
          detail: Credit professionals challenge the output and make the call.
        - id: w5
          label: Deploy capital
          detail: Facility is originated for borrower use case such as expansion or prefunding.
        - id: w6
          label: Monitor portfolio
          detail: Telemetry and exception handling continue through the life of the deal.
