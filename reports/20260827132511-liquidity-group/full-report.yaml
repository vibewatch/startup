            body: >-
              Liquidity’s own materials show that trust and compliance are not peripheral topics. The company’s privacy
              policy describes personal-data processing for due diligence, validation, legal or regulatory compliance,
              and service delivery; the CCPA notice contemplates sensitive financial identifiers; and the terms
              emphasize internal-use rights, platform ownership, and user obligations. On the model-governance side, the
