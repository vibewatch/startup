      - number: '1.4'
        title: Scale signals, expansion milestones, and chronology of record
        blocks:
          - type: paragraph
            body: >-
              Liquidity’s strongest recent milestone is the move from a regional Israeli fintech story into a visibly
              global operating footprint. The Abu Dhabi partnership made Liquidity the first Israeli company to join
              ADIO’s innovation programme and established an R&D center at ADGM focused on machine-learning-enabled
              lendtech. The June 2025 London announcement then formalized a European headquarters, a 5,000 square-foot
              Soho office, a 14-person investment team, more than £350 million already invested across 12 UK companies,
              and a stated plan to deploy another £1.5 billion over five years. The company then used 2025 and 2026
              communications to reinforce the narrative with a category rebrand and cross-border recognition at the 2026
              Transatlantic Growth Awards.


              The chronology also shows the company steadily broadening its banking credibility. Early equity came from
              Spark and MUFG-linked investors, the 2023 round crystallized unicorn status, and the 2025 KeyBank facility
              marked the first partnership with a US-based bank. Public case studies and official pages also place named
              transactions with companies such as Butternut Box, Perk, Infra.Market, NALA, and Eruditus across Europe,
              APAC, and emerging-market corridors. Taken together, the milestone record supports real scale and reach,
              but many operating claims — especially default performance, AUM composition, and revenue growth — remain
              far better documented by management than by independent filings.
