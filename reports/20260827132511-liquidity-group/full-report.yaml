  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Credit-loss reality check fails
        - Vintage data shows material non-accruals or losses far above the public 0.00% claim
        - Bull and base cases both weaken because differentiation no longer offsets opacity
        - Walk away or re-underwrite below the last public mark.
      - - Funding retrenchment
        - Meaningful reduction in partner-backed lending capacity or tougher facility terms
        - Undermines the scale and confidence signal from MUFG and KeyBank
        - Cut valuation corridor and increase downside discount.
      - - Economics packet disappoints
        - Manager-level revenue, fees, or cash generation fail to justify premium valuation
        - Removes the main reason to pay above public-lender discipline
        - Hold track posture or insist on structured downside.
      - - Control / regulatory event
        - Material data, compliance, or governance event surfaces
        - Pushes Liquidity toward the same multiple-compression regime seen in stressed public lenders
        - Immediate thesis break pending full remediation.
      - - Premium ask without proof
        - Fresh-money ask is materially above ~US$1.8B with no accompanying proof on reserves, NAV logic, or preferences
        - Converts narrative upside into uncompensated pricing risk
        - Decline or defer until diligence improves.
    notes: Each trigger is tied to an observable diligence event rather than to a vague sense of discomfort.
    claimRefs:
      - CV010
      - CV016
      - CV017
      - CV033
      - CV034
      - CV035
      - CV036
      - CV044
      - CV046
      - CV048
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Vintage performance
        - >-
          Quarterly and annual tables for originations, non-accruals, restructurings, losses, and recoveries by vintage
          since 2019
        - This is the fastest way to test whether the headline loss claim is durable or selective.
        - Request directly from management, credit committee, and auditors.
      - - Manager-level economics
        - >-
          Revenue mix, fee income, realized net yield, operating expenses, EBITDA / cash generation, and fund-manager
          split
        - Without this, investors cannot tell whether scale is creating attractive equity economics.
        - Request board pack plus audited management accounts.
      - - Cap table and preferences
        - Current fully diluted ownership, liquidation waterfall, anti-dilution, and any senior rights
        - Return math on a private round depends heavily on who gets paid first.
        - Request legal cap table and shareholder-rights summary.
      - - Current valuation materials
        - 2026 board valuation memos, third-party fairness work, secondary trades, or investor updates
        - These materials would bridge the gap between the stale 2023 price and today’s indirect signals.
        - Request directly from CFO / finance lead.
      - - Exit readiness
        - Any banker mandate, IPO readiness assessment, or public-company-control build plan
        - Exit optionality should be evidenced, not assumed from size alone.
        - Request strategic finance roadmap and governance-readiness packet.
    notes: These asks are ordered by how directly they can move recommendation, valuation stance, and downside protection.
    claimRefs:
      - CV015
      - CV016
      - CV017
      - CV039
      - CV047
      - CV048
