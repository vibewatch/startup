              policy and CCPA notice contemplate investor-portal accounts, due-diligence records, IDs, bank and payment
              details, KYC and AML information, and cross-border processing obligations. Its terms describe a platform
              that assesses companies, provides ongoing monitoring, and can connect to billing systems, bank accounts,
              and third-party services. That is already a meaningful privacy and vendor-management burden before
              considering AI-specific issues. Model governance adds another complication. Regulators updated model-risk
              guidance in 2026, but that guidance explicitly excludes generative and agentic AI, leaving a partially
              defined perimeter exactly where Liquidity is pushing technologically. Liquidity's own essays show healthy
              awareness of black-box and bias risk, yet public evidence still lacks the artifacts investors would really
              want: model inventories, validation cadence, override logs, bias testing, incident reporting, or
              independent cyber attestations. This is a manageable risk only if the unpublished controls are materially
              stronger than the public evidence suggests.
