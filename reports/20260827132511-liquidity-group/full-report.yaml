      - number: '7.4'
        title: Credit-cycle risk, concentration opacity, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Public customer evidence shows that Liquidity lends to scaled companies, which is positive, but it does
              not solve concentration or cycle risk. The company has not published top-borrower exposure, watchlist
              migration, non-accrual trends, or repeat-draw cohorts. Investors are therefore forced to infer portfolio
              resilience from success stories and partner endorsements. That is not enough in a 2026 market where public
              BDCs are showing wide dispersion in marks, dividend pressure, and borrower stress. Liquidity's own
              capital-formation marketing claims — including a 0% loss rate since 2019, 16% annual unlevered yield, and
              a multibillion institutional platform — make the upside case stronger, but also raise the evidentiary bar.
              If those claims are not backed by robust unpublished reporting, confidence can deteriorate quickly with
              any sign of regulatory friction, data breaches, partner withdrawal, or credit underperformance. The right
              investment stance is therefore conditional: treat Liquidity as promising but demand concrete kill criteria
              tied to credit quality, controls, and funding resilience.
            claimRefs:
