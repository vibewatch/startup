      - number: '2.3'
        title: Buyer segmentation, budget ownership, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Liquidity’s buyers are not uniform. In software and fintech, the buyer is usually the CFO or finance team,
              the user is management or treasury, and the payer is the corporate balance sheet being optimized against
              dilution and liquidity needs. In infrastructure, education, and cross-border payments, management teams
              use debt not only as bridge capital but as a structural tool to fund inventory, receivables, prefunding,
              capex, or international scaling. The official transaction set shows that the same platform can address
              refinancing, working capital, manufacturing expansion, international launch, and product investment
              without changing the core promise of non-dilutive scale capital.


              Adoption is shaped by both supply and workflow friction. Liquidity’s own pages emphasize that founders
              wait too long for conventional decisions and that its process compresses term-sheet timing to days rather
              than weeks. Capchase and bank competitors show that buyers increasingly expect embedded or tailored
              financing rather than generic loans. At the same time, Rob Amato and Sonia Peterson’s market interviews
              make clear that regional appetite varies: the US is seeing more priced Series C+ activity and aggressive
              bank pricing for top SaaS names, Europe is benefiting from thawing equity markets and acquisition
              opportunities, and APAC remains more cautious and valuation-sensitive.
