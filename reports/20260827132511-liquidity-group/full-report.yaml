  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The recommendation flows from strong capital access and borrower quality being offset by stale equity price
      discovery and thin financial disclosures.
    data:
      nodes:
        - id: anchor
          label: 2023 public equity anchor (US$1.4B claimed valuation)
        - id: scale
          label: 2025-2026 scale signals (KeyBank facility, Mars AUM, global expansion)
        - id: customers
          label: Borrower quality proof (NALA, Perk, Butternut, Eruditus, Infra.Market)
        - id: gaps
          label: Disclosure gaps (revenue, reserves, NAV, preferences, no current priced round)
        - id: comps
          label: Public comp discipline (ARCC, BXSL, HTGC, TPVG, BDC market signals)
        - id: bull
          label: 'Bull unlock: vintage data + strong manager economics'
        - id: bear
          label: 'Bear risk: compression from losses, funding, or control issues'
        - id: result
          label: 'Recommendation: Track with price-sensitive entry discipline'
      edges:
        - from: anchor
          to: scale
        - from: scale
          to: customers
        - from: customers
          to: result
        - from: gaps
          to: result
        - from: comps
          to: result
        - from: bull
          to: result
        - from: bear
          to: result
    claimRefs:
