  evidenceGaps:
  - id: GP001
    question: What are Liquidity’s actual competitive win rates versus banks, BDCs, and vendor-finance platforms by borrower segment?
    impact: Without win/loss data it is hard to separate brand strength from market tailwind.
    nextStep: Request CRM-level pipeline outcomes by competitor and borrower stage.
    relatedClaimRefs:
    - CP017
    - CP034
    relatedQuestionRefs:
    - QP025
  - id: GP002
    question: What blended cost of funds does Liquidity carry relative to SVB, Hercules, and TriplePoint?
    impact: Funding-cost disadvantage could erase software-led differentiation.
    nextStep: Obtain warehouse, mezzanine, equity, and LP stack economics by vehicle.
    relatedClaimRefs:
    - CP034
  - id: GP003
    question: How much of Liquidity’s AI stack is proprietary versus built on third-party vendors or commodity models?
    impact: True moat durability depends on defensibility of the tooling.
    nextStep: Request architecture, vendor, and model-governance documentation.
    relatedClaimRefs:
    - CP031
    - CP033
  - id: GP004
    question: How often do borrowers multi-home Liquidity alongside banks or other venture lenders?
    impact: Switching-cost assumptions remain speculative without borrower behavior data.
    nextStep: Ask for syndication, club-deal, and refinance history.
    relatedClaimRefs:
    - CP020
    - CP036
