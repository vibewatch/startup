company:
  name: Liquidity Group
chapter:
  number: 3
  title: Competitors
  summary: Liquidity Group competes across several overlapping lanes rather than inside one clean peer set. The closest direct alternatives are venture-debt and growth-credit lenders that finance technology companies without demanding immediate dilution, but adjacent players such as Capchase, Pipe, Clearco, Fundbox, SVB, Arc, Hercules Capital, and TriplePoint each attack different parts of the same budget or treasury problem. Liquidity’s strongest differentiation is the combination of larger bespoke facilities, global cross-border reach, and an AI-enabled underwriting and monitoring narrative; its weakest point is that banks and scaled public venture lenders still have cheaper funding, more established brands, or broader distribution.
sections:
- id: landscape-map
  title: 'Landscape: direct peers, incumbents, adjacents, and substitutes'
  body: Liquidity should not be benchmarked only against other private-credit firms. The real landscape spans at least five lanes. First are direct or near-direct credit competitors such as Hercules Capital, TriplePoint, and innovation-banking platforms like SVB that also serve venture-backed or growth-stage technology companies with structured debt. Second are adjacent non-dilutive financers such as Lighter Capital, Clearco, Fundbox, and Capchase, which solve parts of the capital problem but mostly at smaller ticket sizes, shorter durations, or more standardized underwriting. Third are software or treasury substitutes like Pipe and Arc, which can reduce the need for a bespoke debt facility by embedding financing or cash management into existing workflows. Fourth are internal alternatives, including growth equity, internal cash generation, and sponsor-led balance-sheet support. The practical result is that Liquidity competes on the edge of venture debt, private credit, and financial infrastructure
    rather than in a single commoditized pool.
