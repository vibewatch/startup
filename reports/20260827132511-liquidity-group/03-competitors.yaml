    - Lets partners embed financial tools for customers
    - Indirect substitute; not the same underwriting product
  - - Arc
    - Treasury / debt-capital platform
    - Unified platform positioning
    - Technology companies managing cash and debt
    - Combines cash management and debt access in one surface
    - More treasury-led than dedicated growth-credit specialist
