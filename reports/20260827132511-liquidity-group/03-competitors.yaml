- id: pricing-distribution-and-switching-costs
  title: Pricing, distribution leverage, and switching costs
  body: Competitive pressure does not come only from features. It comes from who owns the customer relationship and who can fund most cheaply. SVB brings banking relationships, deposits, and treasury products; Arc tries to become that treasury operating system for technology companies on a smaller scale; Capchase and Pipe aim to sit inside procurement or platform workflows; and public venture lenders like Hercules and TriplePoint benefit from established investor bases and public-market disclosure. Liquidity counters with speed, flexible structuring, and a willingness to underwrite complex or cross-border growth stories that standard bank products may not serve well. Switching costs are therefore mixed. A borrower can multi-home capital providers, but once a lender is embedded in reporting, covenant design, portfolio monitoring, and follow-on facilities, the relationship can become sticky. The risk is that the cheapest or most distribution-rich provider often wins the first call, while Liquidity
    may win later only if complexity, speed, or bespoke structuring truly matter.
