- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Why it matters
  - Mitigation signal
  - Diligence ask
  rows:
  - - AI-enabled underwriting and monitoring
    - Rivals can buy similar tools or build internal models
    - high
    - Technology alone may not be exclusive in credit markets
    - Liquidity ties AI to full lifecycle workflow and own credit book
    - Need third-party proof that outcomes exceed peers
  - - Speed and bespoke structuring
    - Banks or scaled lenders can match speed for top credits
    - high
    - Best borrowers attract the cheapest capital
    - Official term-sheet speed claim and complex-structure positioning
    - Measure win/loss rates by borrower quality tier
  - - Institutional funding relationships
    - Cheaper balance sheets from banks and public BDCs
    - high
    - Cost of capital can overwhelm software differentiation
    - MUFG/KeyBank backing helps funding credibility
    - Need liability stack detail and blended funding cost
  - - Cross-border reach
    - Local specialists may out-execute in specific corridors
    - medium
    - Global breadth is useful only if underwriting stays disciplined
    - Liquidity cites 35+ countries and broad sectors
    - Need corridor-level performance by geography
  - - Data advantage from monitoring
    - Public-market rivals disclose more and can learn across cycles
    - medium
    - Disclosure trust affects fundraising and customer confidence
    - Lifecycle narrative is coherent, but public evidence is thin
    - Need vintage loss, recovery, and watchlist data
  - - Brand as AI-private-credit pioneer
    - Market skepticism about private-credit marks and software exposure
    - medium
    - Adverse investor sentiment can restrict expansion and comparables
    - Public BDC stress may create discipline tailwind too
    - Need evidence that borrowers prefer Liquidity for reasons beyond speed
