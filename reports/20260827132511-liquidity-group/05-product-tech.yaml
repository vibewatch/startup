- id: trust-compliance-and-quality
  title: Trust, privacy, compliance, and quality controls
  body: 'Liquidity’s own materials show that trust and compliance are not peripheral topics. The company’s privacy policy describes personal-data processing for due diligence, validation, legal or regulatory compliance, and service delivery; the CCPA notice contemplates sensitive financial identifiers; and the terms emphasize internal-use rights, platform ownership, and user obligations. On the model-governance side, the company explicitly argues against black-box lending and for explainable AI, human final ownership of the signal, and traceable assumptions. External sources reinforce why that matters: legal commentary and OCC guidance both point toward stronger model-risk expectations, continuous monitoring, and explainability for AI-enabled financial workflows. These are positive design signals, but they are not substitutes for audited quality metrics. Public evidence does not reveal model validation frequency, independent fairness testing, penetration testing, or production incident history.
    That leaves an important gap between stated philosophy and measured control effectiveness.'
  claimRefs:
