company:
  name: Liquidity Group
chapter:
  number: 5
  title: Product & Technology
  summary: Liquidity Group does not sell a consumer app or a narrow finance widget; it appears to operate an AI-enabled decision infrastructure for private credit that spans origination, underwriting, structuring, monitoring, and compliance-sensitive data handling. Public evidence is strongest on operating philosophy — explainable AI, human-in-the-loop governance, scenario-based structuring, and portfolio telemetry — and weakest on the exact internal model stack, vendors, or production reliability metrics. The product looks differentiated enough to matter commercially, but its technical defensibility rests more on proprietary workflow integration and accumulated credit data than on any single published algorithm.
sections:
- id: workflow-product-definition
  title: Product definition in lender and borrower workflow terms
  body: 'Liquidity’s product is best framed as an operating system for private-credit decision making rather than as a standalone software SKU. The company’s current materials repeatedly place its technology inside the full credit lifecycle: screening opportunities, structuring deals, supporting investment decisions, monitoring portfolios, and helping financial institutions embed decision science across origination to compliance. For the borrower, the visible output is faster, more bespoke non-dilutive capital. For Liquidity itself and for partner institutions, the product seems to be a set of internal and semi-internal workflows that compress decision time, broaden scenario analysis, and make ongoing portfolio surveillance more scalable. The AI Product Manager role reinforces that reading by describing product work across data ingestion, modeling, and user-facing applications built for investment workflows and financial analysis. In other words, the technology is not separate from the credit
    business; it is the machinery through which the business runs.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE002
- id: architecture-and-operating-model
  title: Architecture, data flows, and operating model
  body: Public architecture detail is thin, but the available sources support a layered model. At the foundation is data ingestion and aggregation from borrower reporting, market signals, news flow, and other unstructured inputs. Above that sits a model layer that synthesizes information, ranks possibilities, tests structure scenarios, and flags emerging portfolio risks. A workflow or application layer then presents these outputs to credit professionals in decision-support form rather than as a fully autonomous machine. The most revealing public signal is the job-market language around data pipelines, model layers, application layers, RAG, evaluation, hallucination mitigation, and agent-based systems. That vocabulary suggests a modern AI product architecture, but it does not prove which models are proprietary, which vendors are external, or what governance controls exist in production. The operating model is therefore clear in concept and blurry in implementation detail.
  claimRefs:
  - CE001
  - CE004
  - CE005
  - CE006
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
