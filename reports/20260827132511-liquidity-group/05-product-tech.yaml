    - Too much unstructured information for manual review
    - AI-supported screening and ranking
    - Term sheets in days, not weeks
    - No public precision / recall metrics
  - - Design resilient bespoke facility
    - Trade-off between investor protection and borrower flexibility
    - Scenario-based structuring and benchmark comparison
    - Potentially faster, more defensible IC decisions
    - No public outcome study versus legacy process
  - - Monitor illiquid private-credit book
    - Quarterly manual review misses weak signals
    - Portfolio telemetry and exception-driven oversight
    - Earlier intervention and portfolio-level pattern recognition
    - No public alert-quality metrics
  - - Maintain explainable lending governance
    - Black-box models are hard to justify to ICs or regulators
    - Human-in-the-loop XAI workflow
    - Higher trust and challengeability of model output
    - No public governance audit
  - - Support institution partners
    - Traditional lenders need private-credit tooling and speed
    - Bespoke technology infrastructure for banks and asset managers
    - Potential platform leverage beyond own book
    - External product scope is not publicly defined
  notes: Benefits are directional and workflow-based; public sources do not disclose controlled A/B performance data.
