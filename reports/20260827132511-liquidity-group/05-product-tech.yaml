  - FE001
  - FE003
- id: deployment-reliability-and-roadmap
  title: Deployment, reliability, integrations, and roadmap clues
  body: 'The clearest deployment story is that Liquidity is building production-grade AI systems for internal investment workflows and for institution-facing credit products, not shipping a mass-market self-serve tool. The AI Product Manager description points to live product delivery across product, data-science, and engineering teams, while the portfolio-monitoring and structuring essays show the use cases such systems are meant to support once deployed. Customer-side evidence from NALA, Perk, Infra.Market, and Eruditus shows that the platform is used in real credit decisions across different verticals, which implies a degree of generalizability. But public reliability metrics are almost nonexistent: no uptime, latency, model-approval cadence, false-positive rate, drift management, or incident-response statistics are disclosed. The roadmap is visible only indirectly through hiring, the Abu Dhabi R&D center, and the expanding language around agentic systems and institution-grade AI. That
    supports a view of active product maturation, but not of independently verified technical performance.'
  claimRefs:
