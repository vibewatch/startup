- id: differentiation-and-tech-moat
  title: Differentiation, dependencies, and product risk
  body: 'Liquidity’s most credible product differentiation is not a single algorithmic claim. It is the combination of domain-specific workflow design, institutional capital context, and compounding data from real credit deployment. The deal-structuring and monitoring essays argue that the company uses AI where private credit is information-dense and time-constrained: scenario analysis, benchmark comparison, covenant design, early warning signals, and portfolio-level pattern recognition. If true, that is strategically stronger than a generic “AI for finance” pitch. The moat is still conditional. Generative and agentic AI tools are becoming easier to buy, and regulators are tightening expectations around explainability and model risk. The dependency map therefore includes third-party data providers, model infrastructure, privacy compliance, and the human experts who interpret outputs. Liquidity’s technology may help it move faster than traditional lenders, but the moat remains workflow-deep
    rather than visibly uncopyable from public evidence alone.'
  claimRefs:
  - CE004
  - CE005
  - CE006
  - CE012
