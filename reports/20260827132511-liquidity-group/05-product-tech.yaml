  rows:
  - - Opportunity screening / data aggregation
    - Internal credit teams
    - production-like
    - Aggregates borrower, market, and unstructured signals for analysis
    - Supports faster triage across many inputs
    - Need exact data sources and refresh cadence
  - - Underwriting / scenario engine
    - Investment professionals
    - production-like
    - Synthesizes scenarios and possibility spaces for credit decisions
    - Positions AI as decision support rather than autopilot
    - Need model architecture, back-testing, and override logs
  - - Deal-structuring workflow
    - Credit + legal + IC
    - production-like
    - Tests covenant, repayment, and structure alternatives
    - Bespoke structuring is central to Liquidity’s value proposition
    - Need examples of before/after structuring outcomes
  - - Portfolio telemetry / monitoring
    - Portfolio managers
    - production-like
    - Flags anomalies, correlations, and early-warning signals across the book
    - Moves review from periodic to exception-driven oversight
    - Need false-positive / miss-rate metrics
  - - Capital-formation / institution interface
    - Partner institutions and internal management
    - maturing
    - Embeds decision science across funds, facilities, and financial-institution workflows
    - Could create stickiness beyond single loans
    - Need exact productization for external institutions
  - - Governance / explainability layer
    - Credit leadership and risk oversight
    - policy-visible, implementation-obscure
    - Keeps humans in the loop and makes causal chains interpretable
    - Important regulatory and trust differentiator
    - Need validation artifacts and committee controls
  notes: The matrix reflects logical modules implied by retained sources; Liquidity does not publish a formal module catalog.
