  topStrengths:
    - 作为私人贷款机构，Liquidity 获取机构资本的能力异常强：多次获得 MUFG 支持的载体，还拿到 KeyBank 牵头的 US$450M 授信。
    - 公开借款人案例包括 NALA、Perk、Butternut Box、Eruditus、Infra.Market 等具备规模的公司。
    - Liquidity 的差异化更像是在 AI 辅助承销和组合监控工作流里，而不是一家普通 venture-debt 机构。
    - 公司已经搭出清晰的多枢纽布局，覆盖 New York、London、Tel Aviv、Abu Dhabi 等市场。
  topRisks:
    - 公开披露仍没有审计收入、管理人层面现金生成、准备金方法、NAV 逻辑和组合年份表现。
    - 最近一次清晰公开股权估值，是公司声称的 2023 年 US$1.4B；当前公允价值仍然模糊。
    - 如果已实现损失、集中度或控制质量不及预期，融资能力和估值可能很快被压缩。
    - 当前股权结构表和清算优先权堆叠未公开披露。
    - 留存公开来源里，退出准备度和 IPO 时点仍更像叙事，证据不足。
  unresolvedGaps:
    - 2019 年以来按年份拆分的损失、非应计资产、回收和准备金政策。
    - 管理人层面的收入结构、已实现净收益率、运营费用和现金生成。
    - 当前完全稀释股权结构表、反稀释保护和清算优先权。
    - 任何能把过时的 2023 年估值锚点衔接到当前环境的 2026 年董事会、老股交易或第三方估值材料。
    - 正在执行的投行委任、IPO 准备工作流或其他具体退出流程证据。
