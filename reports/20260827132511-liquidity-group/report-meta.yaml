companyProfile:
  summary: Liquidity Group is an Israeli-founded, now New York-headquartered private
    credit platform founded in 2018. It uses AI-assisted underwriting, structuring,
    and portfolio monitoring to provide bespoke non-dilutive capital — including term
    loans, revolving facilities, acquisition financing, and MRR-linked lines — to
    growth-stage, late-stage, and mid-market companies. Public evidence shows repeat
    institutional backing from MUFG-linked vehicles and a 2025 KeyBank-anchored North
    American facility, but the company remains highly under-disclosed on manager-level
    economics, portfolio-vintage performance, and capital-structure detail.
