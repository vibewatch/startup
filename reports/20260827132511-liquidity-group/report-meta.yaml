  topStrengths:
  - Institutional capital access is unusually strong for a private lender, with repeated
    MUFG-backed vehicles and a US$450M KeyBank-anchored facility.
  - Public borrower examples include scaled companies such as NALA, Perk, Butternut
    Box, Eruditus, and Infra.Market.
  - Liquidity appears differentiated in AI-assisted underwriting and portfolio-monitoring
    workflows rather than acting as a generic venture-debt shop.
  - The company has built a visible multi-hub footprint spanning New York, London,
    Tel Aviv, Abu Dhabi, and other markets.
  topRisks:
  - Public disclosures still omit audited revenue, manager-level cash generation,
    reserve methodology, NAV logic, and portfolio-vintage performance.
  - The last clear public equity mark is the company-claimed US$1.4B valuation from
    2023, leaving current fair value ambiguous.
  - Funding and valuation could compress quickly if realized losses, concentration,
    or control quality disappoint.
  - The current cap table and liquidation-preference stack are not publicly disclosed.
  - Exit readiness and IPO timing remain more narrative than evidenced in retained
    public sources.
  unresolvedGaps:
  - Vintage-level losses, non-accruals, recoveries, and reserve policy since 2019.
  - Manager-level revenue mix, realized net yield, operating expenses, and cash generation.
  - Current fully diluted cap table, anti-dilution protections, and liquidation preferences.
  - Any 2026 board, secondary, or third-party valuation materials bridging the stale
    2023 mark to current conditions.
  - Evidence of a live banker mandate, IPO-readiness workstream, or other concrete
    exit process.
