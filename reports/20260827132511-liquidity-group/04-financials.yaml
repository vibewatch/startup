    - Blended cost of capital and covenants on the facility
    - Funding access is strong, but economics may be layered and expensive
  - - Customer facilities like NALA / Perk / Butternut
    - Large disclosed ticket sizes, custom purposes
    - Working capital, expansion, prefunding, product investment
    - Flexible non-dilutive capital
    - Interest rate, fees, security package, warrant coverage
    - Borrower-quality proof exists, pricing proof does not
  notes: The table isolates monetization clues that are visible publicly; realized borrower APRs or spreads remain undisclosed.
