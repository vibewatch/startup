- id: traction-and-unit-economics
  title: Public traction and unit-economics proxies
  body: 'What is visible publicly is scale, not income-statement precision. Liquidity says it has deployed over $2 billion across 45-plus verticals and 35-plus countries, while the MUFG-backed Mars Growth Capital joint venture says it grew from $80 million to $1.1 billion of AUM in four years and completed 80-plus investments. The 2025 KeyBank facility added up to $450 million of dedicated North American lending capacity, with $75 million initially committed and expected to scale to $250 million. Customer financings also hint at borrower quality and economics: NALA had more than half of its 2024 equity still on hand when it added Liquidity debt; Perk said it crossed $300 million annualized revenue, grew 48% in 2025, and had gross margins in the mid-70s when Liquidity joined a $300 million facility; Butternut Box raised more than $80 million for European expansion. These signals suggest Liquidity prefers sizable borrowers with operating momentum, which supports credit quality, but none of
    them reveal Liquidity’s own net yield, take rate, loss-adjusted return, or sales efficiency.'
