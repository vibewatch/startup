  rows:
  - - Interest / spread income
    - Yield earned on private-credit facilities
    - Core private-credit positioning plus public venture-lender analogues
    - Economically central but undisclosed
    - medium
    - Need realized gross yield, net yield, and benchmark spread by vintage
  - - Upfront / structuring fees
    - Origination, diligence, commitment, amendment, or arrangement fees
    - Bespoke structured-credit model implies fee layer
    - Not publicly quantified
    - low
    - Need fee share of revenue and fee-recognition policy
  - - Monitoring / amendment economics
    - Ongoing covenant, reporting, extension, and waiver economics
    - Lifecycle monitoring and bespoke structures imply service intensity
    - Not publicly quantified
    - low
    - Need recurring fee schedule and amendment incidence
  - - Capital-formation / management fees
    - Manager economics tied to affiliated funds or vehicles
    - Capital-formation page and MUFG-backed vehicles suggest manager layer
    - Not publicly disclosed
    - low
    - Need fee-bearing AUM, management fees, incentive fees, and vehicle splits
  - - Equity / warrant-style upside
    - Potential ancillary upside from structured credit or partnerships
    - Public comparator filings show this is common in venture lending
    - Unknown for Liquidity specifically
    - low
    - Need instrument mix and equity-upside contribution to realized returns
  notes: Public sources reveal likely revenue mechanics but not the realized mix between interest, fees, and manager economics.
