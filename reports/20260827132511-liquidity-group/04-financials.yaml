- id: public-gaps-and-verdict
  title: Disclosure gaps, capital adequacy, and financial verdict
  body: The central financial issue is not a lack of growth evidence; it is a lack of financial disclosure discipline. Public sources do not provide audited revenue, net interest margin, fee yield, non-accrual rate, reserve policy, expenses, EBITDA, burn, or cash runway. That makes it impossible to test whether Liquidity’s rapid platform expansion is translating into durable manager economics or whether growth is consuming capital faster than fees and spreads can replenish it. The company does show repeated access to institutional capital, which is a positive signal, and the customer evidence suggests it can attract better-quality borrowers than a distressed lender would. But credit businesses fail not only because originations slow; they fail when funding tightens, marks become less trusted, or loss experience diverges from the growth narrative. On current public evidence, Liquidity’s capital adequacy looks better than its disclosure adequacy. The right financial verdict is that the platform
    appears fundable and strategically relevant, but further diligence must focus on realized yield, vintage performance, reserves, and cash-generation at the manager level before any high-conviction financial underwriting is possible.
