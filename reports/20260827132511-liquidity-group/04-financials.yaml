company:
  name: Liquidity Group
chapter:
  number: 4
  title: Financials
  summary: 'Liquidity Group’s public financial picture is unusually asymmetric: there are strong signals on capital availability, facility size, platform scale, and partner confidence, but very weak disclosure on revenue, yields, fee mix, loss-reserve methodology, burn, or runway. The company clearly operates a capital-intensive private-credit model with meaningful warehouse or LP dependence, evidenced by MUFG-backed Mars Growth Capital, the 2025 KeyBank-anchored facility, and repeated large disclosed transactions. But unlike listed venture lenders, Liquidity does not publish enough recurring metrics to underwrite revenue quality or margin durability from public evidence alone, so the financial verdict remains “strategically interesting, disclosure-constrained.”'
sections:
- id: revenue-model
  title: Revenue model and monetization logic
  body: 'Liquidity’s economic engine is best understood as a private-credit platform rather than a SaaS vendor, even though technology is central to its pitch. The retained sources imply several monetization channels: interest or spread income on originated loans; structuring, commitment, and other transaction fees that typically accompany bespoke credit; potential upside from capital-formation activities or affiliated vehicles; and possibly warrant-like or equity-linked economics in some structures, although Liquidity does not disclose a standard instrument menu publicly. The closest transparent analogues are public venture lenders such as Hercules and TriplePoint, whose filings show a model built around current income from debt plus ancillary fees and equity participation. Liquidity likely earns in a related way, but public evidence does not disclose its realized blend of fee income versus recurring yield, nor whether economics sit primarily at the fund level, manager level, or both. That
    missing mix is the first major underwriting blocker.'
