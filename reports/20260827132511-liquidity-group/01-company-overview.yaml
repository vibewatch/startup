company:
  name: Liquidity Group
chapter:
  number: 1
  title: Company Overview
  summary: Liquidity Group is an Israeli-founded, now New York-headquartered private credit platform that uses proprietary AI and decision science to lend $10 million to $200 million to growth-stage and mid-market companies. Public sources support a step-change from a roughly $100 million valuation in 2020 to a $1.4 billion mark in February 2023, followed by larger institutional facilities with MUFG and KeyBank, but they still leave audited revenue, exact current AUM, and the fully current cap table under-disclosed. The company’s strongest visible signals are global expansion, repeat bank partnerships, and a broad senior team; the main diligence caveat is that many scale and loss claims remain management-supplied rather than independently audited.
sections:
- id: identity-and-operating-model
  title: Identity, footprint, and operating model
  body: 'Liquidity Group presents itself today as an AI-native private credit lender rather than a generic fintech marketplace. The official homepage and private-credit page state that the firm deploys flexible capital in tickets from $10 million to $200 million to growth-stage and mid-market companies, operates across 35+ countries and 45+ business verticals, and has recorded a 0.00% credit loss rate since 2019. The operating model described across official materials is a full credit-lifecycle stack: origination, analysis, structuring, monitoring, and expansion into new credit verticals are all supported by proprietary machine-learning infrastructure, while human investment staff retain final judgment. Product structures publicly listed include term loans, revolving credit facilities, acquisition financing, and MRR-linked lines.


    The geographic identity is more nuanced than a single-country label. Third-party profiles and the London headquarters announcement anchor current headquarters in New York, while earlier reporting and the Abu Dhabi partnership materials describe the company as Israeli-founded and historically Tel Aviv-based. By mid-2025 the company said it operated from London, New York, Singapore, Tel Aviv, Abu Dhabi, and San Francisco, which is consistent with its own claim to global reach and with the 2026 award-page statement that the organization works across five major hubs and 26 nationalities. The most defensible framing is therefore Israeli-founded with a current New York corporate center and meaningful operating hubs in EMEA, APAC, and the Gulf.'
