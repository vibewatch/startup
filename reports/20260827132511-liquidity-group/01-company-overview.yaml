- id: funding-history-and-capital-base
  title: Funding history, strategic investors, and external capital base
  body: 'The public funding story shows fast institutionalization. In October 2020 Liquidity announced a $20 million equity round from Spark Capital and MUFG Innovation Partners at an approximately $100 million valuation, with the investors receiving 20% of the share capital and Meitav Dash falling to 44.6%. In 2022 and 2023 the company deepened relationships with larger balance-sheet partners rather than relying only on venture equity. Company and press sources describe approximately $775 million of capital commitments led by Apollo affiliates and MUFG in early 2022, an additional $250 million from MUFG later that year into the broader fund architecture, and a further $40 million equity round in 2023 that the company said valued it at $1.4 billion.


    The quality of the investor base matters as much as the headline amounts. MUFG appears repeatedly as equity investor, LP, and joint-venture partner through Mars Growth Capital; Spark provided both equity capital and a technology-commercialization relationship; Apollo is cited in the 2022 financing wave; and KeyBank anchored the March 2025 North America facility. Official 2026 materials say Mars Growth Capital grew from $80 million at launch to $1.1 billion of AUM in four years and 80+ investments, which suggests that Liquidity has moved beyond isolated one-off facilities into a repeatable institutional platform. The open question is how much of that capital is firm-level equity versus partner or fund capital, because public materials often blend corporate and managed-fund scale.'
