- id: leadership-and-governance
  title: Leadership, founder continuity, and governance visibility
  body: 'Liquidity has more public leadership detail than many private lenders, but founder attribution is still imperfect across sources. The official who-we-are page clearly identifies Ron Daniel as Co-Founder and CEO and Oron Maymon as Co-Founder and CSO, while also naming senior executives including Udi Gvirts, Oshri Harari, Carmen James, Roma Bronstein, Paul Brodie, and Omri Meitav. The same page identifies Eli Barkat as chairman and Santo Politi, Ilan Raviv, and Nobutake Suzuki as board members. This is enough to show a real bench spanning investments, data science, operations, finance, and strategy rather than a founder-only organization.


    A remaining governance ambiguity is Yaron Sela. Startup Intros still lists him as Co-Founder and COO, but he is absent from the current official leadership page captured for this run. That does not prove departure, but it does mean public sources diverge on the currently visible founder roster. Governance economics are also unusually partially visible: Calcalistech reported that after the February 2023 MUFG-led round, Meitav remained the largest shareholder at 33.3%, Spark held 18%, MUFG held 12.5% on a fully diluted basis, and Ron Daniel held slightly less than 10%. Those disclosures are valuable, yet they stop short of a current fully diluted cap table, board-rights schedule, or investor veto map.'
