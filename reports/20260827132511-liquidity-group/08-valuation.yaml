- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Credit-loss reality check fails
    - Vintage data shows material non-accruals or losses far above the public 0.00%
      claim
    - Bull and base cases both weaken because differentiation no longer offsets opacity
    - Walk away or re-underwrite below the last public mark.
  - - Funding retrenchment
    - Meaningful reduction in partner-backed lending capacity or tougher facility
      terms
    - Undermines the scale and confidence signal from MUFG and KeyBank
    - Cut valuation corridor and increase downside discount.
  - - Economics packet disappoints
    - Manager-level revenue, fees, or cash generation fail to justify premium valuation
    - Removes the main reason to pay above public-lender discipline
    - Hold track posture or insist on structured downside.
  - - Control / regulatory event
    - Material data, compliance, or governance event surfaces
    - Pushes Liquidity toward the same multiple-compression regime seen in stressed
      public lenders
    - Immediate thesis break pending full remediation.
  - - Premium ask without proof
    - Fresh-money ask is materially above ~US$1.8B with no accompanying proof on reserves,
      NAV logic, or preferences
    - Converts narrative upside into uncompensated pricing risk
    - Decline or defer until diligence improves.
  notes: Each trigger is tied to an observable diligence event rather than to a vague
    sense of discomfort.
