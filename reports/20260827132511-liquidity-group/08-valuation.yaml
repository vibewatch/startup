company:
  name: Liquidity Group
chapter:
  number: 8
  title: Valuation
summary: 'Liquidity Group looks more credible as a credit platform in 2026 than it
  did at the 2023 unicorn round, but the public valuation evidence did not improve
  nearly as much as the funding and customer proof did. The last clear equity anchor
  remains the company-claimed $1.4 billion mark from 2023; everything newer in the
  retained record is indirect — larger debt capacity, bigger partner-backed AUM, and
  stronger borrower case studies, but still no audited revenue, reserve, NAV, or cap-table
  data. That combination supports a price-sensitive Track recommendation rather than
  a buy call: the business may deserve more than the stale 2023 mark, but public evidence
  does not justify paying a large AI or scarcity premium without deeper diligence.'
sections:
- id: valuation-anchor-and-disclosure-reality
  title: Valuation anchor, capital access, and disclosure reality
  body: 'Liquidity’s public valuation story has a clean starting point and a messy
    continuation. The clean part is 2023: official and third-party coverage line up
    around a $40 million MUFG-led equity round that the company said valued Liquidity
    at $1.4 billion, bringing total equity raised to roughly $120 million. The messy
    part is everything after that. Public evidence since then is rich on scale signals
    but poor on price discovery. Liquidity added a KeyBank-anchored credit facility
    of up to $450 million for North America, Mars Growth Capital grew to $1.1 billion
    of AUM with 80-plus investments, and the London expansion announcement signaled
    continuing deployment ambition. Yet none of those facts tells investors what a
    fresh common-equity round would clear at in 2026. They speak to funding access
    and strategic relevance, not to current equity price. The core valuation problem
    is therefore disclosure asymmetry: compared with the visible capital-partner momentum,
    public revenue, reserve, NAV, preference-stack, and manager-cash-generation disclosures
    remain unusually thin. That makes the 2023 unicorn mark useful as an anchor, but
    insufficient as a current answer.'
