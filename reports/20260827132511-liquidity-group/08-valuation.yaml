- id: scenarios-recommendation-and-entry-discipline
  title: Bull / base / bear scenarios and recommendation discipline
  body: 'Because there is no current public priced round, a single-point fair value
    would be false precision. A corridor approach is more defensible. In the bull
    case, Liquidity eventually proves that the 0.00% loss claim is backed by robust
    vintage data, that manager-level revenues and cash generation are stronger than
    public evidence currently suggests, and that institutional partners continue scaling
    the platform. In that world, a valuation materially above the 2023 $1.4 billion
    mark becomes supportable. In the base case, Liquidity is exactly what the record
    currently suggests: a promising, increasingly institutional private-credit platform
    whose funding access is ahead of its disclosure maturity. That case supports some
    appreciation over the 2023 anchor, but not a full software-style re-rating. In
    the bear case, public-market-style discipline reasserts itself: funding costs
    rise, losses prove less pristine than marketing claims imply, or governance and
    control gaps widen. That would compress value below the last public mark. Those
    branches lead to a Track recommendation. The company is interesting enough to
    keep diligencing, but not transparent enough to buy at an unspecified premium
    price.'
