  evidenceGaps:
  - id: GV001
    question: 'What current 2026 board, secondary, or third-party valuation materials
      exist between the stale 2023 round and today? '
    impact: Without a newer valuation artifact, investors are forced to extrapolate
      too much from indirect scale signals.
    nextStep: Request any 2026 valuation memos, secondary trades, fairness work, or
      investor updates from finance leadership.
    relatedClaimRefs:
    - CV014
    - CV038
    - CV046
    relatedQuestionRefs:
    - QV004
    - QV023
    - QV016
  - id: GV002
    question: What do vintage-level originations, non-accruals, restructurings, losses,
      recoveries, and reserve policies show since 2019?
    impact: These metrics determine whether the headline loss-rate claim deserves
      valuation credit or a discount.
    nextStep: Request quarterly vintage tables, internal risk ratings, reserve methodology,
      and realized loss history by fund / vehicle.
    relatedClaimRefs:
    - CV010
    - CV016
    - CV042
    - CV044
    relatedQuestionRefs:
    - QV007
    - QV008
    - QV021
  - id: GV003
    question: What manager-level revenue, fee mix, realized net yield, expenses, and
      cash generation does Liquidity actually produce?
    impact: Without manager-level economics, investors cannot know whether the platform
      deserves a premium over public-lender discipline.
    nextStep: Request audited management-company P&L, fee-bearing AUM, incentive-fee
      mechanics, and multi-year cash-flow statements.
    relatedClaimRefs:
    - CV015
    - CV037
    - CV041
    - CV048
    relatedQuestionRefs:
    - QV015
    - QV024
    - QV026
  - id: GV004
    question: What is the current fully diluted cap table, preference stack, and shareholder-rights
      waterfall?
    impact: An attractive headline valuation can still deliver weak common-equity
      outcomes if senior rights or anti-dilution are heavy.
    nextStep: Request the legal cap table, financing terms by round, and summary of
      liquidation and participation rights.
    relatedClaimRefs:
    - CV017
    - CV046
    - CV048
    relatedQuestionRefs:
    - QV017
    - QV026
  - id: GV005
    question: How real is exit readiness beyond narrative references to scale and
      future listing ambition?
    impact: Exit timing cannot be underwritten from implication alone; it affects
      holding period and acceptable entry price.
    nextStep: Request banker materials, IPO-readiness workstreams, governance readiness,
      and any board-approved exit planning.
    relatedClaimRefs:
    - CV039
    - CV047
    relatedQuestionRefs:
    - QV018
    - QV027
