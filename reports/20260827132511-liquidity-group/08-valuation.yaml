  - - Risk rating
    - High
    - high
    - Credit businesses can re-rate quickly when disclosures, funding, or loss experience
      disappoint.
    - Demand downside protections or wait for more proof.
  - - Valuation stance
    - Stretched above ~US$1.8B without private data
    - medium
