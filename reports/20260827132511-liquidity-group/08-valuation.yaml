- id: public-comparables-and-borrower-quality
  title: Public comparable set and what customer quality really proves
  body: 'Public comparables are necessary here, but they must be used with humility.
    Ares Capital, BXSL, Hercules Capital, and TPVG show where listed direct lenders
    and venture lenders actually clear in public markets: from roughly $218 million
    at the small end of the venture-lending set to about $14.3 billion for the largest
    public BDC. Those companies are not perfect analogues because they publish filings,
    balance-sheet metrics, dividend policy, and in many cases NAV detail that Liquidity
    does not. Still, they establish the right discipline. A lender does not receive
    a permanent premium simply because it uses software or AI in underwriting. In
    2026 the public BDC tape is still sensitive to rate pressure, credit-quality dispersion,
    and skepticism toward private marks. That matters because Liquidity’s best upside
    evidence today is not audited economics but high-quality borrower proof: NALA,
    Perk, Butternut Box, Eruditus, and Infra.Market all suggest the company is financing
    scaled operating businesses. That improves confidence in origination quality,
    but it does not substitute for portfolio-vintage, reserve, or concentration disclosure.
    Customer logos can support the thesis; they cannot close the valuation gap by
    themselves.'
