- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Category
  - Thesis argument
  - Anti-thesis signal
  - What would change the view
  rows:
  - - Funding access
    - MUFG- and KeyBank-backed structures show institutional willingness to scale
      Liquidity.
    - Facilities and partner-backed AUM show funding access, not common-equity valuation
      support.
    - A new third-party priced round or audited economics packet.
  - - Borrower quality
    - NALA, Perk, Butternut, Eruditus, and Infra.Market suggest strong origination
      selectivity.
    - Success stories can hide concentration, watchlist migration, and loss severity
      elsewhere in the book.
    - Portfolio-level borrower, vintage, and non-accrual data.
  - - Technology / process
    - AI-enabled underwriting and monitoring may support faster, more efficient credit
      decisions.
    - Public evidence does not prove that AI creates public-market-worthy moat or
      superior loss-adjusted returns.
    - Independent validation of loss rates, overrides, and realized yield.
  - - Market backdrop
    - Private credit remains a large and growing market with room for differentiated
      lenders.
    - Public BDCs still show valuation dispersion and mark skepticism in 2026.
    - Evidence that Liquidity can outrun the broader de-rating pressure.
  - - Valuation
    - The stale 2023 unicorn mark may understate today’s platform scale.
    - No retained public source proves what fresh equity would clear at in 2026 or
      how the preference stack distorts returns.
    - 2026 valuation memo, cap table, and any secondary or board marks.
  notes: The pro case is real, but every pro argument still maps to a specific evidence
    gap that must be closed before a buy recommendation becomes defensible.
