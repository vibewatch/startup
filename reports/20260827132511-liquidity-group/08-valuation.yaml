- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Liquidity Group (2023 round)
    - Same-company private anchor
    - US$1.4B claimed post-money after US$40M equity from MUFG
    - Best direct public equity anchor for Liquidity itself.
    - Stale by 2026 and does not reveal today's preferences or internal metrics.
  - - Ares Capital (ARCC)
    - Large public direct lender
    - About US$14.29B market cap in Aug 2026; largest public BDC by market cap
    - Shows the scale ceiling for a mature public direct-lending vehicle.
    - Middle-market BDC with public disclosures, not an AI-native private lender.
  - - Blackstone Secured Lending Fund (BXSL)
    - Large public private-credit BDC
    - About US$5.8B market cap in Aug 2026; ~US$6.1B in Nov 2025 snapshot
    - Useful comp for premium direct-lending platforms with strong sponsorship.
    - Public BDC economics and dividend structure differ from Liquidity’s private
      model.
  - - Hercules Capital (HTGC)
    - Public venture-lending specialist
    - About US$3.28B market cap in Aug 2026
    - Closer analogue for tech-oriented non-dilutive lending.
    - Still a listed lender with fuller disclosures and different portfolio construction.
  - - TriplePoint Venture Growth (TPVG)
    - Smaller public venture lender
    - About US$218M market cap in Aug 2026
    - Illustrates how harsh public pricing can be for smaller venture lenders.
    - Much smaller scale and weaker sponsor perception than Liquidity claims today.
  - - Infra.Market financing marker
    - Borrower-side private valuation proxy
    - US$2.5B borrower valuation on new Mars-backed financing
    - Shows Liquidity is financing companies whose own valuations exceed Liquidity’s
      last public mark.
    - Borrower valuation is not lender valuation; only an indirect quality signal.
  notes: The set mixes same-company anchor, mature public direct lenders, public venture
    lenders, and a borrower-side private valuation proxy to bracket what the public
    evidence can and cannot support.
  enumerationScope:
