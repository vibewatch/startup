- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Vintage performance
    - Quarterly and annual tables for originations, non-accruals, restructurings,
      losses, and recoveries by vintage since 2019
    - This is the fastest way to test whether the headline loss claim is durable or
      selective.
    - Request directly from management, credit committee, and auditors.
  - - Manager-level economics
    - Revenue mix, fee income, realized net yield, operating expenses, EBITDA / cash
      generation, and fund-manager split
    - Without this, investors cannot tell whether scale is creating attractive equity
      economics.
    - Request board pack plus audited management accounts.
  - - Cap table and preferences
    - Current fully diluted ownership, liquidation waterfall, anti-dilution, and any
      senior rights
    - Return math on a private round depends heavily on who gets paid first.
    - Request legal cap table and shareholder-rights summary.
  - - Current valuation materials
    - 2026 board valuation memos, third-party fairness work, secondary trades, or
      investor updates
    - These materials would bridge the gap between the stale 2023 price and today’s
      indirect signals.
    - Request directly from CFO / finance lead.
  - - Exit readiness
    - Any banker mandate, IPO readiness assessment, or public-company-control build
      plan
    - Exit optionality should be evidenced, not assumed from size alone.
    - Request strategic finance roadmap and governance-readiness packet.
  notes: These asks are ordered by how directly they can move recommendation, valuation
    stance, and downside protection.
