company:
  name: Wayve
chapter:
  number: 2
  title: Market Analysis
  summary: Wayve sells autonomy software into a market defined less by vehicle sales than by OEM software licensing, fleet
    deployment, and regulatory approval. The 2026 source pack points to a large and expanding physical-AI opportunity, but
    also shows that demand conversion is gated by safety, integration, and approval friction.
sections:
- id: market-boundary
  title: Market boundary and substitutes
  body: Wayve is not trying to sell a consumer app or a vehicle platform. It is selling driving intelligence to automakers,
    fleet operators, and mobility platforms that want software-defined autonomy. The relevant market therefore includes OEM
    software licensing, deployment integration, validation services, and ongoing model updates, while excluding vehicle manufacturing
    and purely aftermarket driver-assist gadgets. The main substitutes are in-house OEM autonomy stacks, Mobileye-style supplier
    solutions, and vertically integrated robotaxi programs that keep the full stack inside one operator. In practice, Wayve
    can therefore be read as a horizontal autonomy supplier whose revenue opportunity depends on how many OEM programs and
    fleet programs convert from trial to production.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  tableRefs:
  - TM001
- id: sizing-and-demand
  title: Sizing lenses and adoption path
  body: 'The public evidence supports a large opportunity but not a precise company-specific TAM. Wayve itself frames the
    market as “every vehicle that moves,” while third-party coverage says the broader AI-platforms opportunity is already
    in the hundreds of billions. The practical adoption path is narrower: start with supervised and L2+ OEM programs, then
    move to L3/L4 in a few launch markets, then scale across platforms once safety and integration are repeatable. The market
    size therefore depends on how quickly OEMs convert technical demos into paid production programs. That makes the market
    conversation less about a static TAM and more about how quickly procurement teams can absorb safety cases, integrations,
    and rollout support.'
  claimRefs:
  - CM005
  - CM006
  - CM007
  - CM008
  tableRefs:
  - TM002
  figureRefs:
  - FM001
- id: drivers-and-constraints
  title: Drivers, friction, and diligence gaps
  body: 'Adoption is helped by software-defined vehicles, better onboard compute, and customer appetite for automation that
    feels human-like. It is slowed by the need for certification, the lack of public pricing, and the fact that every geography
    and vehicle platform brings new edge cases. The latest London reporting makes the regulatory bottleneck concrete: trials
    can be announced faster than permits can be written. That means the company can look strategically important before it
    becomes economically legible. The mismatch between public enthusiasm and operational permissions is the key reason the
    market remains strategically exciting but commercially hard to underwrite.'
  claimRefs:
  - CM009
  - CM010
  - CM011
  - CM012
  tableRefs:
  - TM003
