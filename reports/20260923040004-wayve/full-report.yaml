  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Wayve is not trying to sell a consumer app or a vehicle platform. It is selling driving intelligence to
              automakers, fleet operators, and mobility platforms that want software-defined autonomy. The relevant
              market therefore includes OEM software licensing, deployment integration, validation services, and ongoing
              model updates, while excluding vehicle manufacturing and purely aftermarket driver-assist gadgets. The
              main substitutes are in-house OEM autonomy stacks, Mobileye-style supplier solutions, and vertically
              integrated robotaxi programs that keep the full stack inside one operator. In practice, Wayve can
              therefore be read as a horizontal autonomy supplier whose revenue opportunity depends on how many OEM
              programs and fleet programs convert from trial to production.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Sizing lenses and adoption path
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a large opportunity but not a precise company-specific TAM. Wayve itself
              frames the market as “every vehicle that moves,” while third-party coverage says the broader AI-platforms
              opportunity is already in the hundreds of billions. The practical adoption path is narrower: start with
              supervised and L2+ OEM programs, then move to L3/L4 in a few launch markets, then scale across platforms
              once safety and integration are repeatable. The market size therefore depends on how quickly OEMs convert
              technical demos into paid production programs. That makes the market conversation less about a static TAM
              and more about how quickly procurement teams can absorb safety cases, integrations, and rollout support.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM008
              - CM009
              - CM010
      - number: '2.3'
        title: Drivers, friction, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Adoption is helped by software-defined vehicles, better onboard compute, and customer appetite for
              automation that feels human-like. It is slowed by the need for certification, the lack of public pricing,
              and the fact that every geography and vehicle platform brings new edge cases. The latest London reporting
              makes the regulatory bottleneck concrete: trials can be announced faster than permits can be written. That
              means the company can look strategically important before it becomes economically legible. The mismatch
              between public enthusiasm and operational permissions is the key reason the market remains strategically
              exciting but commercially hard to underwrite.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM004
              - CM009
              - CM010
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct peers, incumbents, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Wayve is not competing in a vacuum. Direct competitors include autonomous-driving and driver-assist
              suppliers such as Mobileye, Waymo, Tesla, WeRide, Pony.ai, Nuro, and other AV developers, while the
              real-world substitute is often an internal OEM stack that tries to solve the same problem with in-house
              engineering. Wayve’s field is crowded enough that market position depends on whether the company can show
              a repeatable deployment path, not just an elegant architecture. The market is still young enough that many
              buyers are evaluating multiple architectures in parallel, which means competitive position is as much
              about process and trust as it is about technical purity. This competitive field is dynamic enough that a
              one-quarter delay can materially change who looks ahead.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
      - number: '3.2'
        title: Capability and distribution differences
        blocks:
          - type: paragraph
            body: >-
              Wayve’s pitch is that end-to-end embodied AI generalizes better than rule-heavy or map-heavy stacks. That
              matters because the company is trying to sell an autonomy platform that works across vehicles and
              geographies, not a one-off robotaxi pilot. In practice, the best differentiation signal is not just model
              architecture; it is the combination of data, deployment experience, OEM trust, and the ability to move
              from trials to production agreements. Wayve also benefits from being able to point to a
              research-to-product narrative, which can matter when OEMs want evidence that a stack can survive the jump
              from demos to production.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP010
              - CP012
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Wayve’s moat is plausible but not yet proven. The company has funding depth, high-profile partners, and a
              growing software-defined vehicle story, but end-to-end AI is becoming the industry consensus rather than a
              proprietary novelty. That creates a real commoditization risk: if OEMs treat autonomy software as a
              modular layer, they may multi-home across suppliers or bring more of the stack in-house. Wayve needs
              production wins, not just technical praise, to avoid that outcome. That is why the hardest question is
              whether the company can turn its current recognition into sticky program wins before the architectural
              debate becomes table stakes.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP007
              - CP008
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams and monetization
        blocks:
          - type: paragraph
            body: >-
              Wayve appears to monetize through software licensing, OEM program work, and rollout support rather than
              through vehicle manufacturing or a consumer subscription product. The public materials point to a platform
              sold into automakers and fleet operators, but they do not disclose list prices, minimum commitments, or
              customer-level revenue. That keeps the revenue picture directionally understandable while still preventing
              a clean forecast of annual recurring revenue, gross margin, or payback timing. The practical result is
              that the business can be described, but not yet fully modeled, from public sources alone. The absence of
              public operating metrics means that even a good product narrative does not yet translate into a
              disciplined financial forecast.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
