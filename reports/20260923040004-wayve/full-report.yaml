              - CC012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CC003
              - CC006
              - CC008
              - CC011
      - number: '6.3'
        title: Commercial conversion and risk
        blocks:
          - type: paragraph
            body: >-
              The customer verdict is cautiously constructive. Wayve has enough external proof to show that leading OEMs
              and fleets are willing to engage, but the company still needs to prove that those engagements become
              repeatable programs rather than one-off pilots. The main diligence question is conversion speed: how
              quickly can public partnerships turn into production agreements, and how much engineering work is required
              to support each new customer. Until that is answered, the customer base looks promising but not yet fully
              anchored. That makes the chapter a story of early traction rather than a completed commercial base. That
              distinction matters because investors pay for repeatability, not just introductions. That is the key
              conversion test.
            claimRefs:
              - CC009
              - CC010
              - CC011
              - CC012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and launch risk
        blocks:
          - type: paragraph
            body: >-
              The most obvious risk is regulatory timing. Wayve’s public rollouts depend on approvals, local operating
              rules, and the pace at which authorities are willing to accept supervised autonomy. That means even strong
              product progress can translate into slow revenue realization if launch permissions move more slowly than
              engineering milestones. In a business this capital intensive, launch delay is not a side issue; it is the
              main determinant of when the market can see repeatable revenue. Even when approvals arrive, operational
              limits can still vary by city and by route, which keeps timing uncertain.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR007
              - CR010
      - number: '7.2'
        title: Commercial and execution risk
        blocks:
          - type: paragraph
            body: >-
              A second risk is conversion. The company has visible partners, but the public record still does not show
              how quickly pilots become production deployments or how much bespoke work each customer requires. If every
              new program demands significant integration, then gross margin and scaling efficiency will remain under
              pressure longer than the fundraising headlines suggest. The customer story is therefore encouraging but
              not yet de-risked. That means the path from pilot to production is not linear and can be interrupted by
              procurement, support, or safety review delays.
            claimRefs:
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR008
              - CR010
      - number: '7.3'
        title: Concentration and diligence risk
        blocks:
          - type: paragraph
            body: >-
              The final risk is concentration: concentration of capital, concentration of attention, and concentration
              of outcomes in a handful of large OEM or mobility relationships. Wayve can still succeed with that
              structure, but it means the company’s future depends on a relatively small number of large counterparties
              converting on time. For diligence, that makes the most important unknowns very concrete: delay,
              dependency, and disclosure quality. The concentration point is not just a revenue issue; it is also a
              governance issue because the company must keep multiple large stakeholders aligned. Investors should
              expect that dynamic to matter most in the next financing or launch cycle. It is the central risk driver.
              That is the main thing to watch. For now, patience matters.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current valuation signals
        blocks:
          - type: paragraph
            body: >-
              The strongest public anchor is the February 2026 Series D, which priced the company at $8.6 billion
              post-money. That number is reinforced by the employee tender offer and by several private-market
              references that cluster in the same general zone. The implication is that investors are still willing to
              pay a strategic premium for autonomy optionality, but the market is not yet pricing Wayve as a steady
              cash-flow business. Valuation is therefore being set more by scarcity and belief than by measurable
              earnings power.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV010
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV009
      - number: '8.2'
        title: Private-market comparison lens
        blocks:
          - type: paragraph
            body: >-
              Comparable references are imperfect, but they still help bound the discussion. The private-market data
              sources in the refresh pack point to a range that is broadly consistent with the Series D valuation, while
              media and investor commentary suggest the market is treating Wayve as one of the few autonomous-driving
              platforms with real strategic leverage. That is encouraging for the company, yet it also means the next
              valuation step will depend on proof of customer conversion and launch progress rather than on headline
              investor enthusiasm alone. That makes the gap between public enthusiasm and measured fundamentals the key
              valuation risk.
            claimRefs:
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
              - CV008
              - CV012
      - number: '8.3'
        title: Valuation verdict and downside case
        blocks:
          - type: paragraph
            body: >-
              The valuation verdict is constructive but fragile. Wayve appears to have strong private-market support,
              but its value is still tied to a small set of assumptions: that customers convert, that launches happen on
              schedule, and that the company can turn research differentiation into durable economics. If those
              assumptions slip, the private market could mark the company down quickly because the current number
              already embeds a lot of future success. In short, the stock-like upside is real, but so is the reset risk.
              The company has not yet given the market a clean operating basis for a more conservative number. That is
              why downside matters so much. The reset risk is therefore real and measurable. That is the core issue.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
