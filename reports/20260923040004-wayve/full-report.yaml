figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Wayve's timeline shows the transition from Cambridge research startup to heavily financed, production-oriented
      autonomy supplier.
    data:
      items:
        - date: '2017'
          label: Founded in Cambridge
          detail: Alex Kendall and Amar Shah launch Wayve around end-to-end embodied AI for driving.
          tone: positive
        - date: '2019'
          label: Series A and London expansion
          detail: Early financing supports public-road testing and growth beyond the Cambridge lab.
          tone: positive
        - date: '2021'
          label: Ocado and Asda collaborations
          detail: Grocery-delivery pilots help prove commercial relevance beyond pure research.
          tone: positive
        - date: '2022'
          label: Series B
          detail: Eclipse-led round accelerates AV2.0 and scaling.
          tone: positive
        - date: 2024-05
          label: Series C
          detail: SoftBank-led $1.05B round takes Wayve into the late-stage autonomy category.
          tone: positive
        - date: 2025-06
          label: Uber L4 trials announced
          detail: Wayve and Uber outline UK public-road trials and a broader ride-hailing plan.
          tone: positive
        - date: 2026-02
          label: Series D and $8.6B valuation
          detail: The company raises $1.2B and adds OEM, semiconductor, and mobility investors.
          tone: positive
        - date: 2026-06
          label: Employee tender offer
          detail: Secondary liquidity suggests internal price discovery near the Series D valuation.
          tone: neutral
        - date: 2026-08
          label: London robotaxi delay risk
          detail: Public reporting shows regulatory guidance and approvals are still gating launch timing.
          tone: adverse
    claimRefs:
      - CO001
      - CO011
      - CO012
      - CO013
      - CO016
      - CO008
  - id: FM001
    title: Market sizing lens
    type: timeline
    summary: >-
      A compact timeline shows the market moving from research credibility toward OEM commercialization and regulatory
      gating.
    data:
