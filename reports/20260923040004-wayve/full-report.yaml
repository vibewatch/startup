              - CI003
              - CI012
      - number: '4.2'
        title: Funding, valuation, and capital intensity
        blocks:
          - type: paragraph
            body: >-
              The funding sequence shows a business that is being built with unusually deep patient capital. Wayve
              raised a billion-dollar-plus Series C in 2024, followed by a $1.2 billion Series D in February 2026 and a
              separate employee tender offer later in 2026. That financing pattern matters because autonomy
              commercialization requires training data, safety engineering, simulation, integration work, and long OEM
              cycles before revenue can become predictable. It also gives the company room to keep hiring and to absorb
              delay risk while launch timing and regulatory approvals work themselves out. That is why the company can
              keep attracting capital even while operating disclosures stay thin.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI009
              - CI013
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI005
              - CI006
              - CI009
              - CI011
      - number: '4.3'
        title: Financial quality and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is positive on funding support but still weak on operating visibility. Wayve has
              enough capital and investor backing to continue product development, yet public disclosures still do not
              show the data an analyst would need to build a reliable margin model. The main diligence blocker is
              therefore not solvency but the absence of public pricing, cash-burn, and customer economics. Until those
              inputs appear, any profitability case remains a scenario rather than a model. It is also why public
              investors keep focusing on strategic optionality instead of near-term earnings power.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Model architecture and training loop
        blocks:
          - type: paragraph
            body: >-
              Wayve describes its system as an end-to-end driving intelligence that learns from data rather than from
              hand-authored rules. The public technical narrative emphasizes large-scale learning, video and fleet data,
              and a single model that can generalize across vehicles and geographies. That is an elegant product thesis
              because it reduces dependency on bespoke maps and brittle logic, but it also shifts the hard work into
              data scale, evaluation quality, and safety validation. In practice, the architecture only matters if the
              model can keep improving while remaining stable enough for regulated deployment.
            claimRefs:
              - CJ001
              - CJ002
              - CJ003
              - CJ004
          - type: table
            tableRef: TE001
            claimRefs:
              - CJ001
              - CJ002
              - CJ004
          - type: figure
            figureRef: FE001
            claimRefs:
              - CJ003
              - CJ005
              - CJ006
              - CJ010
      - number: '5.2'
        title: Deployment stack and productization
        blocks:
          - type: paragraph
            body: >-
              Wayve’s public materials show the company packaging the model into OEM and fleet programs rather than
              selling a single consumer app. That means the product is as much an integration stack as a neural network:
              sensors, software interfaces, safety layers, deployment workflows, and customer support all matter. The
              company also seems to be using partnerships to prove that the system can move from research demo to
              repeatable commercial workflow. The product risk is not that the model cannot drive at all; it is that
              each deployment still takes enough bespoke work to slow scale.
            claimRefs:
              - CJ005
              - CJ006
              - CJ007
          - type: table
            tableRef: TE002
            claimRefs:
              - CJ005
              - CJ007
          - type: table
            tableRef: TE003
            claimRefs:
              - CJ006
              - CJ008
              - CJ009
              - CJ010
      - number: '5.3'
        title: Technical moat and current limitations
        blocks:
          - type: paragraph
            body: >-
              The technical verdict is favorable but conditional. Wayve has a differentiated architecture story,
              credible research talent, and enough public proof points to remain one of the better-known autonomy
              platforms. But the public record still leaves open the hardest questions: how much of the stack is truly
              reusable, how much deployment customization remains, and whether the safety case can scale beyond pilots.
              Those uncertainties make the technology promising, but not yet fully de-risked. This is still a company
              where the product narrative is ahead of the operating evidence. In that sense, the company still has to
              prove that the architecture is not merely impressive in demos but durable in production. That gap is the
              difference between a promising research system and a durable software platform.
            claimRefs:
              - CJ008
              - CJ009
              - CJ010
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and use cases
        blocks:
          - type: paragraph
            body: >-
              Wayve’s public customer narrative spans OEMs, fleet operators, and mobility platforms, which is exactly
              where an autonomy platform needs to start if it wants broad commercial reach. The company’s materials
              suggest a mix of licensing, integration, and deployment support rather than a single one-size-fits-all
              product. That can be a strength because it opens multiple entry points, but it also means the company must
              tailor its message to very different buying committees. The customer problem is therefore not demand
              generation alone; it is whether each segment sees enough operational value to adopt the same core
              platform.
            claimRefs:
              - CC001
              - CC002
              - CC003
              - CC004
          - type: table
            tableRef: TU001
            claimRefs:
              - CC001
              - CC002
      - number: '6.2'
        title: Lighthouse accounts and proof points
        blocks:
          - type: paragraph
            body: >-
              The customer evidence is strongest where Wayve can point to named partners and program announcements.
              Uber, Nissan, Mercedes-Benz, and Foxglove all signal that the company is moving through the
              credibility-building phase that matters before mass deployment. That said, most public evidence is still
              partnership-oriented rather than contract-oriented, so the market knows who is interested but not how much
              revenue each relationship generates. The practical interpretation is that customer momentum is real, yet
              not fully monetized or disclosed. The lack of pricing detail is the main reason the customer story still
              feels early.
            claimRefs:
              - CC005
              - CC006
              - CC007
              - CC008
          - type: table
            tableRef: TU002
            claimRefs:
              - CC003
              - CC011
          - type: table
