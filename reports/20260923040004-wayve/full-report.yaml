chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating model
        blocks:
          - type: paragraph
            body: >-
              Wayve positions itself as a general-purpose driving intelligence company rather than a vehicle
              manufacturer. Its core product is the Wayve AI Driver, a mapless and hardware-agnostic embodied-AI stack
              sold to automakers, fleet owners, and mobility platforms that want to move from assisted driving toward
              L3/L4 autonomy. The current public story is consistent across the company website, leadership page, and
              2026 financing materials: the business is built around licensing software, integrating with OEM vehicle
              programs, and using data-driven foundation models to generalize across vehicle platforms and geographies.
              The company describes this as an autonomy layer that can power any vehicle, anywhere, which makes the
              operating model closer to an enterprise software supplier with deep automotive integration than a
              vertically integrated robotaxi operator.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO003
              - CO011
              - CO013
              - CO014
      - number: '1.2'
        title: Founders, leadership, and control
        blocks:
          - type: paragraph
            body: >-
              Wayve was founded in Cambridge in 2017 by Alex Kendall and Amar Shah. Kendall now leads the company as
              co-founder and chief executive, while the current operating team includes Erez Dagan as president, Elisa
              de Martel as CFO, Jamie Shotton as chief scientist, Simone Fabris in product and delivery, and additional
              commercial, safety, and engineering leaders supporting production-readiness. The leadership roster matters
              because execution depends on a small number of people who bridge research, automotive quality, and OEM
              commercialization. The company is also now more visibly shaped by strategic investors and
              customer-partners, which broadens its credibility but increases the importance of maintaining alignment
              across OEMs, hyperscalers, and ride-hailing partners.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
