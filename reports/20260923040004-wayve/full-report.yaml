          label: End-to-end AI gains credibility
          detail: Large-model advances make end-to-end autonomy more legible to OEM buyers.
          tone: positive
        - date: '2025'
          label: Uber and OEM partnerships
          detail: Commercial trials show buyer interest before scaled public deployment.
          tone: positive
        - date: 2026-02
          label: Series D and $8.6B valuation
          detail: Capital inflow signals market belief in the autonomy platform thesis.
          tone: positive
        - date: 2026-08
          label: London guidance delays
          detail: Regulatory process slows the conversion from trial announcements to live service.
          tone: adverse
        - date: 2026-09
          label: Physical AI expansion
