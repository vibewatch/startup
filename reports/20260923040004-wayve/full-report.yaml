companyProfile:
  summary: >-
    Wayve is a London-based autonomy company building embodied-AI driving software for OEMs, fleets, and mobility
    platforms. The company has moved from research novelty to late-stage platform commercialization, but public evidence
    still shows an organization that is better funded than it is financially transparent.
