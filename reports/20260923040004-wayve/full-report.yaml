      - number: '1.3'
        title: Funding, scale, and operating milestones
        blocks:
          - type: paragraph
            body: >-
              Wayve moved from an early research lab to a late-stage platform company through a sequence of financing
              and commercial milestones that now include a May 2024 Series C, a February 2026 Series D, a 2026 employee
              tender offer, and public road-trial activity with Uber in London. The February 2026 round priced the
              business at $8.6B post-money and brought in a broad mix of strategic and financial investors, including
              Microsoft, NVIDIA, Uber, Mercedes-Benz, Nissan, Stellantis, Eclipse, Balderton, and SoftBank Vision Fund
              2. Public reporting in 2026 also places headcount near 1,200 and underscores the shift from research
              validation toward production deployment, but core operating metrics such as revenue and customer count
              remain undisclosed.
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
