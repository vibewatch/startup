company:
  name: Wayve
chapter:
  number: 5
  title: Product and Technology
  summary: Wayve’s product story is a coherent bet on end-to-end embodied AI, but the technical question is no longer whether
    the stack is novel. It is whether the model, sensor, safety, and deployment layers can survive real-world complexity fast
    enough to become a repeatable product for OEMs and fleets.
sections:
- id: architecture
  title: Model architecture and training loop
  body: Wayve describes its system as an end-to-end driving intelligence that learns from data rather than from hand-authored
    rules. The public technical narrative emphasizes large-scale learning, video and fleet data, and a single model that can
    generalize across vehicles and geographies. That is an elegant product thesis because it reduces dependency on bespoke
    maps and brittle logic, but it also shifts the hard work into data scale, evaluation quality, and safety validation. In
    practice, the architecture only matters if the model can keep improving while remaining stable enough for regulated deployment.
  claimRefs:
  - CJ001
  - CJ002
  - CJ003
  - CJ004
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: deployment
  title: Deployment stack and productization
  body: 'Wayve’s public materials show the company packaging the model into OEM and fleet programs rather than selling a single
    consumer app. That means the product is as much an integration stack as a neural network: sensors, software interfaces,
    safety layers, deployment workflows, and customer support all matter. The company also seems to be using partnerships
    to prove that the system can move from research demo to repeatable commercial workflow. The product risk is not that the
    model cannot drive at all; it is that each deployment still takes enough bespoke work to slow scale.'
  claimRefs:
  - CJ005
  - CJ006
  - CJ007
  tableRefs:
  - TE002
  - TE003
- id: tech-verdict
  title: Technical moat and current limitations
  body: 'The technical verdict is favorable but conditional. Wayve has a differentiated architecture story, credible research
    talent, and enough public proof points to remain one of the better-known autonomy platforms. But the public record still
    leaves open the hardest questions: how much of the stack is truly reusable, how much deployment customization remains,
    and whether the safety case can scale beyond pilots. Those uncertainties make the technology promising, but not yet fully
    de-risked. This is still a company where the product narrative is ahead of the operating evidence. In that sense, the
    company still has to prove that the architecture is not merely impressive in demos but durable in production. That gap
    is the difference between a promising research system and a durable software platform.'
  claimRefs:
  - CJ008
  - CJ009
  - CJ010
  tableRefs: []
