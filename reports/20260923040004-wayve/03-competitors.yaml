  name: Wayve
chapter:
  number: 3
  title: Competitors
  summary: Wayve competes against both direct autonomy stacks and status-quo OEM approaches. The public source pack shows
    a crowded field where technical differentiation, regulatory readiness, and partner access matter as much as raw model
    quality.
sections:
- id: competitive-landscape
  title: Direct peers, incumbents, and substitutes
  body: Wayve is not competing in a vacuum. Direct competitors include autonomous-driving and driver-assist suppliers such
    as Mobileye, Waymo, Tesla, WeRide, Pony.ai, Nuro, and other AV developers, while the real-world substitute is often an
    internal OEM stack that tries to solve the same problem with in-house engineering. Wayve’s field is crowded enough that
    market position depends on whether the company can show a repeatable deployment path, not just an elegant architecture.
    The market is still young enough that many buyers are evaluating multiple architectures in parallel, which means competitive
    position is as much about process and trust as it is about technical purity. This competitive field is dynamic enough
    that a one-quarter delay can materially change who looks ahead.
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
  tableRefs:
  - TP001
- id: differentiation
  title: Capability and distribution differences
  body: Wayve’s pitch is that end-to-end embodied AI generalizes better than rule-heavy or map-heavy stacks. That matters
    because the company is trying to sell an autonomy platform that works across vehicles and geographies, not a one-off robotaxi
    pilot. In practice, the best differentiation signal is not just model architecture; it is the combination of data, deployment
    experience, OEM trust, and the ability to move from trials to production agreements. Wayve also benefits from being able
    to point to a research-to-product narrative, which can matter when OEMs want evidence that a stack can survive the jump
    from demos to production.
  claimRefs:
  - CP005
  - CP006
  - CP007
  - CP008
  tableRefs:
  - TP002
- id: moat-and-risks
  title: Moat durability and displacement risk
  body: 'Wayve’s moat is plausible but not yet proven. The company has funding depth, high-profile partners, and a growing
    software-defined vehicle story, but end-to-end AI is becoming the industry consensus rather than a proprietary novelty.
    That creates a real commoditization risk: if OEMs treat autonomy software as a modular layer, they may multi-home across
    suppliers or bring more of the stack in-house. Wayve needs production wins, not just technical praise, to avoid that outcome.
    That is why the hardest question is whether the company can turn its current recognition into sticky program wins before
    the architectural debate becomes table stakes.'
  claimRefs:
  - CP009
  - CP010
  - CP011
  - CP012
  tableRefs:
  - TP003
  figureRefs:
  - FP001
