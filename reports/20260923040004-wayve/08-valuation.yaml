company:
  name: Wayve
chapter:
  number: 8
  title: Valuation
  summary: Wayve’s valuation story is anchored by a very large recent financing round, but the more interesting question is
    what the private market thinks the company is worth between financing events. Public signals from secondaries, private-market
    data, and investor coverage suggest the market still views Wayve as a premium strategic asset with wide uncertainty around
    eventual operating value.
sections:
- id: market-signal
  title: Current valuation signals
  body: The strongest public anchor is the February 2026 Series D, which priced the company at $8.6 billion post-money. That
    number is reinforced by the employee tender offer and by several private-market references that cluster in the same general
    zone. The implication is that investors are still willing to pay a strategic premium for autonomy optionality, but the
    market is not yet pricing Wayve as a steady cash-flow business. Valuation is therefore being set more by scarcity and
    belief than by measurable earnings power.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  tableRefs:
  - TV001
  figureRefs:
  - FV001
- id: comparables
  title: Private-market comparison lens
  body: Comparable references are imperfect, but they still help bound the discussion. The private-market data sources in
    the refresh pack point to a range that is broadly consistent with the Series D valuation, while media and investor commentary
    suggest the market is treating Wayve as one of the few autonomous-driving platforms with real strategic leverage. That
    is encouraging for the company, yet it also means the next valuation step will depend on proof of customer conversion
    and launch progress rather than on headline investor enthusiasm alone. That makes the gap between public enthusiasm and
    measured fundamentals the key valuation risk.
  claimRefs:
  - CV005
  - CV006
  - CV007
  tableRefs:
  - TV002
  - TV003
- id: valuation-verdict
  title: Valuation verdict and downside case
  body: 'The valuation verdict is constructive but fragile. Wayve appears to have strong private-market support, but its value
    is still tied to a small set of assumptions: that customers convert, that launches happen on schedule, and that the company
    can turn research differentiation into durable economics. If those assumptions slip, the private market could mark the
    company down quickly because the current number already embeds a lot of future success. In short, the stock-like upside
    is real, but so is the reset risk. The company has not yet given the market a clean operating basis for a more conservative
    number. That is why downside matters so much. The reset risk is therefore real and measurable. That is the core issue.'
  claimRefs:
  - CV008
  - CV009
  - CV010
  - CV011
  - CV012
  tableRefs: []
