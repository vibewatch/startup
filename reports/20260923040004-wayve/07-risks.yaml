company:
  name: Wayve
chapter:
  number: 7
  title: Risks
  summary: Wayve’s risks are now less about whether the company can attract attention and more about whether it can clear
    the regulatory, deployment, and monetization hurdles that sit between a promising autonomy stack and a scaled business.
    The public record shows enough momentum to justify interest, but also enough delay and uncertainty to keep the risk profile
    elevated.
sections:
- id: regulatory
  title: Regulatory and launch risk
  body: The most obvious risk is regulatory timing. Wayve’s public rollouts depend on approvals, local operating rules, and
    the pace at which authorities are willing to accept supervised autonomy. That means even strong product progress can translate
    into slow revenue realization if launch permissions move more slowly than engineering milestones. In a business this capital
    intensive, launch delay is not a side issue; it is the main determinant of when the market can see repeatable revenue.
    Even when approvals arrive, operational limits can still vary by city and by route, which keeps timing uncertain.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: commercial
  title: Commercial and execution risk
  body: A second risk is conversion. The company has visible partners, but the public record still does not show how quickly
    pilots become production deployments or how much bespoke work each customer requires. If every new program demands significant
    integration, then gross margin and scaling efficiency will remain under pressure longer than the fundraising headlines
    suggest. The customer story is therefore encouraging but not yet de-risked. That means the path from pilot to production
    is not linear and can be interrupted by procurement, support, or safety review delays.
  claimRefs:
  - CR005
  - CR006
  - CR007
  tableRefs:
  - TR002
  - TR003
- id: risk-verdict
  title: Concentration and diligence risk
  body: 'The final risk is concentration: concentration of capital, concentration of attention, and concentration of outcomes
    in a handful of large OEM or mobility relationships. Wayve can still succeed with that structure, but it means the company’s
    future depends on a relatively small number of large counterparties converting on time. For diligence, that makes the
    most important unknowns very concrete: delay, dependency, and disclosure quality. The concentration point is not just
    a revenue issue; it is also a governance issue because the company must keep multiple large stakeholders aligned. Investors
    should expect that dynamic to matter most in the next financing or launch cycle. It is the central risk driver. That is
    the main thing to watch. For now, patience matters.'
  claimRefs:
  - CR008
  - CR009
  - CR010
  - CR011
  - CR012
  tableRefs: []
