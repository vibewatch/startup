company:
  name: Wayve
chapter:
  number: 1
  title: Company Overview
  summary: Wayve is a London-headquartered embodied-AI autonomy company founded in 2017 by Alex Kendall and Amar Shah. The
    company has moved from research to scaled commercial deployment with a $1.2B Series D in February 2026, an $8.6B post-money
    valuation, a roughly 1,200-person team, and a growing OEM/ride-hailing partnership footprint that now includes Uber, Nissan,
    Mercedes-Benz, Stellantis, Qualcomm, Microsoft, and NVIDIA.
sections:
- id: identity-and-business-model
  title: Identity, product, and operating model
  body: 'Wayve positions itself as a general-purpose driving intelligence company rather than a vehicle manufacturer. Its
    core product is the Wayve AI Driver, a mapless and hardware-agnostic embodied-AI stack sold to automakers, fleet owners,
    and mobility platforms that want to move from assisted driving toward L3/L4 autonomy. The current public story is consistent
    across the company website, leadership page, and 2026 financing materials: the business is built around licensing software,
    integrating with OEM vehicle programs, and using data-driven foundation models to generalize across vehicle platforms
    and geographies. The company describes this as an autonomy layer that can power any vehicle, anywhere, which makes the
    operating model closer to an enterprise software supplier with deep automotive integration than a vertically integrated
    robotaxi operator.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  tableRefs:
  - TO001
- id: leadership-and-governance
  title: Founders, leadership, and control
  body: Wayve was founded in Cambridge in 2017 by Alex Kendall and Amar Shah. Kendall now leads the company as co-founder
    and chief executive, while the current operating team includes Erez Dagan as president, Elisa de Martel as CFO, Jamie
    Shotton as chief scientist, Simone Fabris in product and delivery, and additional commercial, safety, and engineering
    leaders supporting production-readiness. The leadership roster matters because execution depends on a small number of
    people who bridge research, automotive quality, and OEM commercialization. The company is also now more visibly shaped
    by strategic investors and customer-partners, which broadens its credibility but increases the importance of maintaining
    alignment across OEMs, hyperscalers, and ride-hailing partners.
  claimRefs:
  - CO006
  - CO007
  - CO008
  - CO009
  - CO010
  tableRefs:
  - TO002
  - TO003
- id: financing-and-milestones
  title: Funding, scale, and operating milestones
  body: Wayve moved from an early research lab to a late-stage platform company through a sequence of financing and commercial
    milestones that now include a May 2024 Series C, a February 2026 Series D, a 2026 employee tender offer, and public road-trial
    activity with Uber in London. The February 2026 round priced the business at $8.6B post-money and brought in a broad mix
    of strategic and financial investors, including Microsoft, NVIDIA, Uber, Mercedes-Benz, Nissan, Stellantis, Eclipse, Balderton,
    and SoftBank Vision Fund 2. Public reporting in 2026 also places headcount near 1,200 and underscores the shift from research
    validation toward production deployment, but core operating metrics such as revenue and customer count remain undisclosed.
  claimRefs:
  - CO011
  - CO012
  - CO013
  - CO014
  - CO015
  - CO016
