  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: revenue-model
    missingEvidence: Public pricing, contract size, and recurring revenue disclosure for Wayve's OEM software licensing model.
    whyItMatters: Without pricing or contract disclosure, the report cannot translate product traction into revenue quality
      or durable customer economics.
    diligencePath: Obtain an OEM contract, investor memo, or management disclosure that states pricing mechanics, minimum
      volumes, or booked revenue.
    relatedQuestionRefs:
    - QO002
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: safety-approval
    missingEvidence: A formal, publicly documented approval path for fully driverless UK deployment and any Wayve-specific
      certification evidence.
    whyItMatters: Commercialization speed and regulatory risk both depend on whether Wayve can obtain the necessary operating
      permits.
    diligencePath: Review DVSA/TfL permit guidance, Wayve safety filings, and any public operating approvals tied to the London
      launch.
    relatedQuestionRefs:
    - QO007
  - type: missing-source
    severity: minor
    topic: customer-count
    missingEvidence: Public customer count or active-production vehicle count by program.
    whyItMatters: Investor diligence needs a clearer read on whether the 2026 deployments are pilots, paid production programs,
      or pre-commercial trials.
    diligencePath: Request a management KPI pack or OEM program update covering active vehicles and commercial status by partner.
    relatedQuestionRefs:
    - QO008
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: minor
    topic: leadership-enumeration
    missingEvidence: Full board composition and any undisclosed governance or observer rights tied to strategic investors.
    whyItMatters: The public leadership page does not fully enumerate governance control, so the investor and leadership tables
      remain intentionally partial.
    diligencePath: Review board consents, cap-table schedules, or a management presentation that lists all governance rights.
    relatedTableRefs:
    - TO002
    - TO003
  acknowledgedWarnings:
