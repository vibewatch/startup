companyProfile:
  summary: Wayve 是一家总部位于伦敦的自动驾驶公司，为 OEM、车队和出行平台开发具身 AI 驾驶软件。公司已从研究型新秀走向后期平台商业化，但公开证据仍显示，它的资金实力强于财务透明度。
  foundedDate: '2017-01-01'
  founders:
    - name: Alex Kendall
      role: 联合创始人兼 CEO
      background: 专注端到端驾驶系统的自动驾驶与机器学习研究员。
    - name: Amar Shah
      role: 联合创始人
      background: 参与 Wayve 早期开发的机器学习与机器人技术建设者。
  foundingLocation: Cambridge, UK
  headquarters: London, UK
  productSummary: Wayve 销售 Wayve AI Driver，这是一套软件平台，用于在多种车型和地理区域支撑辅助驾驶和自动驾驶。
  customerFocus: OEM、车队运营商和出行平台
