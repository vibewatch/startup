              - CR010
      - number: '7.2'
        title: 商业与执行风险
        blocks:
          - type: paragraph
            body: >-
              第二个风险是转化。公司有可见伙伴，但公开记录仍没有说明试点会多快变成生产部署，也没有说明每个客户需要多少定制工作。如果每个新项目都需要大量集成，毛利率和规模化效率就会比融资标题暗示的更久承压。因此，客户故事令人鼓舞，但尚未去风险。这意味着从试点到生产的路径不是线性的，可能被采购、支持或安全审查延误打断。
            claimRefs:
              - CR005
              - CR006
              - CR007
