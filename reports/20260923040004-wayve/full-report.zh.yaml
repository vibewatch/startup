figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Wayve 的时间线显示，公司如何从剑桥研究型创业公司，转向重资本支持、面向量产的自动驾驶供应商。
    data:
      items:
        - date: '2017'
          label: 创立于剑桥
          detail: Alex Kendall 和 Amar Shah 围绕用于驾驶的端到端具身 AI 创立 Wayve。
          tone: positive
        - date: '2019'
          label: Series A 轮与伦敦扩张
          detail: 早期融资支持公共道路测试，并让公司走出剑桥实验室。
          tone: positive
        - date: '2021'
          label: Ocado 与 Asda 合作
          detail: 食品杂货配送试点帮助证明，Wayve 不只是研究项目，也有商业用途。
          tone: positive
        - date: '2022'
          label: Series B 轮
          detail: Eclipse 领投的轮次加速 AV2.0 和规模化。
          tone: positive
        - date: 2024-05
          label: Series C 轮
          detail: SoftBank 领投的 $1.05B 融资把 Wayve 推入后期自动驾驶公司行列。
          tone: positive
        - date: 2025-06
          label: Uber L4 试验公布
          detail: Wayve 与 Uber 勾勒英国公共道路试验和更大范围的网约车计划。
          tone: positive
        - date: 2026-02
          label: Series D 轮与 $8.6B 估值
          detail: 公司融资 $1.2B，并引入 OEM、半导体和出行领域投资方。
          tone: positive
        - date: 2026-06
          label: 员工要约收购
          detail: 二级市场流动性显示，内部价格发现接近 Series D 轮估值。
          tone: neutral
        - date: 2026-08
          label: 伦敦自动驾驶出租车延期风险
          detail: 公开报道显示，监管指引和审批仍在卡住上线时间。
          tone: adverse
    claimRefs:
      - CO001
      - CO011
      - CO012
      - CO013
      - CO016
      - CO008
  - id: FM001
    title: 市场规模判断视角
    type: timeline
    summary: 精简时间线显示，市场正从研究可信度走向 OEM 商业化，同时受监管门槛卡住。
    data:
      items:
        - date: '2017'
          label: AV2.0 逻辑浮现
          detail: Wayve 把自动驾驶定义成基础模型问题，而不是手写规则的机器人技术栈。
          tone: positive
        - date: '2024'
          label: 端到端 AI 可信度上升
          detail: 大模型进展让 OEM 买方更容易看懂端到端自动驾驶。
          tone: positive
        - date: '2025'
          label: Uber 与 OEM 合作
          detail: 商业试点显示，在大规模公开部署前，买方已经有兴趣。
          tone: positive
        - date: 2026-02
          label: Series D 轮与 $8.6B 估值
          detail: 资本流入说明市场认可自动驾驶平台逻辑。
          tone: positive
        - date: 2026-08
          label: 伦敦监管指引延迟
          detail: 监管流程拖慢了试点公告转为实际服务上线的节奏。
          tone: adverse
        - date: 2026-09
          label: 物理 AI 拓展
          detail: Wayve Labs 的招聘显示，平台可以扩展到汽车之外。
          tone: positive
    claimRefs:
      - CM004
      - CM005
      - CM007
      - CM008
      - CM009
      - CM010
  - id: FP001
    title: 竞争定位图
    type: timeline
    summary: 这条紧凑时间线显示，自动驾驶从研究层面的差异化走向量产验证后，竞争门槛还在不断抬高。
    data:
      items:
        - date: '2017'
          label: Wayve 创立
          detail: 端到端具身 AI 成为自动驾驶里的逆向押注。
          tone: positive
        - date: '2020'
          label: 既有技术栈成熟
          detail: 传统 AV 玩家把地图、传感器和基于规则的系统打磨得更稳。
          tone: neutral
        - date: '2024'
          label: 端到端 AI 变得可信
          detail: 行业开始向更整体化的架构靠拢。
          tone: positive
        - date: 2026-02
          label: Wayve Series D 轮
