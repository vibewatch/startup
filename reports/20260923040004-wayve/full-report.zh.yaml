      - number: '5.2'
        title: 部署栈与产品化
        blocks:
          - type: paragraph
            body: >-
              Wayve 的公开材料显示，公司是在把模型打包进 OEM
              和车队项目，而不是销售单一消费端应用。因此，产品既是神经网络，也是集成栈：传感器、软件接口、安全层、部署工作流和客户支持都很重要。公司似乎也在借助伙伴关系证明，系统可以从研究演示走向可重复的商业工作流。产品风险不在于模型完全不能开车，而在于每次部署仍需要足够多的定制工作，从而拖慢规模化。
            claimRefs:
              - CJ005
              - CJ006
              - CJ007
          - type: table
            tableRef: TE002
            claimRefs:
              - CJ005
              - CJ007
          - type: table
            tableRef: TE003
            claimRefs:
              - CJ006
              - CJ008
              - CJ009
              - CJ010
      - number: '5.3'
        title: 技术护城河与当前限制
        blocks:
          - type: paragraph
            body: >-
              技术结论偏正面，但有条件。Wayve
              有差异化的架构故事、可信的研究人才，以及足够的公开验证点，仍是较知名的自动驾驶平台之一。但公开记录仍留下最难的问题：栈中到底有多少真正可复用、还剩多少部署定制，以及安全论证能否跨过试点规模化。这些不确定性让技术显得有前景，但尚未完全去风险。Wayve
              仍是一家产品叙事领先于运营证据的公司。换句话说，公司还必须证明这套架构不只是演示中好看，而是在生产中也耐用。这个缺口，就是有前景的研究系统和耐用软件平台之间的差别。
            claimRefs:
              - CJ008
              - CJ009
              - CJ010
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与使用场景
        blocks:
          - type: paragraph
            body: >-
              Wayve 的公开客户叙事覆盖
              OEM、车队运营商和出行平台；如果一个自动驾驶平台想获得广泛商业触达，就必须从这些地方起步。公司材料显示，它提供的是授权、集成和部署支持的组合，而不是一刀切产品。这可能是优势，因为它打开了多个切入点；但也意味着公司必须向差异很大的采购委员会分别讲清价值。客户问题因此不只是需求生成，而是每个细分领域是否都看到足够运营价值，从而采用同一个核心平台。
            claimRefs:
              - CC001
              - CC002
