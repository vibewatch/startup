      - number: '4.3'
        title: 财务质量与尽调阻断点
        blocks:
          - type: paragraph
            body: >-
              财务结论是：融资支持为正面，但运营可见度仍弱。Wayve
              有足够资本和投资者背书来继续产品开发，但公开披露仍没有给出分析师建立可靠利润率模型所需的数据。因此，主要尽调阻断点不是偿付能力，而是公开定价、现金消耗和客户经济性缺失。在这些输入出现之前，任何盈利能力论证都只是情景，而不是模型。这也解释了为什么公开市场投资者仍把重点放在战略可选性，而不是短期盈利能力。
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 模型架构与训练闭环
        blocks:
          - type: paragraph
            body: >-
              Wayve
              将其系统描述为端到端驾驶智能，靠数据学习，而不是靠手写规则。公开技术叙事强调大规模学习、视频和车队数据，以及一个能够跨车辆和地理区域泛化的单一模型。这是一个优雅的产品论点，因为它降低了对定制地图和脆弱逻辑的依赖；但它也把难点转移到数据规模、评估质量和安全验证上。实际看，只有当模型能持续改进，同时保持足够稳定以满足监管部署时，架构才真正重要。
            claimRefs:
              - CJ001
              - CJ002
              - CJ003
              - CJ004
