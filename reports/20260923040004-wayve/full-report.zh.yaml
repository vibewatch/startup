          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV009
      - number: '8.2'
        title: 私募市场比较视角
        blocks:
          - type: paragraph
            body: >-
              可比参考并不完美，但仍能帮助框定讨论。刷新包中的私募市场数据源指向一个与 Series D 估值大体一致的区间，媒体和投资者评论则表明，市场把 Wayve
              视为少数具有真实战略杠杆的自动驾驶平台之一。这对公司是利好，但也意味着下一步估值上行将取决于客户转化和上线进展的证明，而不只是醒目的投资者热情。公众热情和可衡量基本面之间的缺口，因此是关键估值风险。
            claimRefs:
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
              - CV008
              - CV012
      - number: '8.3'
        title: 估值结论与下行情景
        blocks:
          - type: paragraph
            body: >-
              估值结论是建设性但脆弱。Wayve
              看起来拥有强劲的私募市场支持，但它的价值仍绑定在少数假设上：客户会转化、上线会如期发生、公司能把研究差异化转成耐用经济性。如果这些假设滑坡，私募市场可能很快下调公司，因为当前数字已经嵌入了大量未来成功。简言之，类股票上行是真实的，重估风险也是真实的。公司还没有给市场一个干净的运营基础，让更保守的数字站得住。这就是为什么下行如此重要。重估风险因此真实且可衡量。这是核心问题。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
