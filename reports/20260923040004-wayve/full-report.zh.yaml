chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与运营模式
        blocks:
          - type: paragraph
            body: >-
              Wayve 把自己定位成通用驾驶智能公司，而不是车辆制造商。核心产品 Wayve AI Driver 是一套无地图、硬件无关的具身 AI 栈，卖给希望从辅助驾驶迈向 L3/L4
              自动驾驶的车企、车队所有者和出行平台。公司网站、领导团队页面和 2026 年融资材料讲出的公开故事一致：业务围绕软件授权、与 OEM
              车型项目集成，以及用数据驱动的基础模型跨车型平台和地理区域泛化。公司称这是一层可驱动任何车辆、覆盖任何地点的自动驾驶层，因此它的运营模式更接近深度嵌入汽车体系的企业软件供应商，而不是垂直整合的自动驾驶出租车运营商。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO003
              - CO011
              - CO013
              - CO014
      - number: '1.2'
        title: 创始人、管理层与控制权
        blocks:
          - type: paragraph
            body: >-
              Wayve 由 Alex Kendall 和 Amar Shah 于 2017 年在剑桥创立。Kendall 现在以联合创始人兼 CEO 身份领导公司；当前运营团队还包括总裁 Erez Dagan、CFO
              Elisa de Martel、首席科学家 Jamie Shotton、负责产品与交付的 Simone
              Fabris，以及支撑量产就绪的商务、安全和工程负责人。领导团队名单重要，因为执行要靠少数同时懂研究、汽车质量和 OEM
              商业化的人来串起。战略投资者和客户型伙伴如今也更明显地塑造公司，可信度因此扩大，但公司也更需要让 OEM、超大规模云厂商和网约车伙伴保持一致。
            claimRefs:
