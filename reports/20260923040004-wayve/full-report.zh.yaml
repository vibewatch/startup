  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Wayve 不是在卖消费端应用，也不是在卖车辆平台。它向车企、车队运营商和出行平台销售驾驶智能，而这些客户想要的是软件定义的自动驾驶。因此，这个市场包括 OEM
              软件授权、部署集成、验证服务和持续模型更新，但不包括整车制造和纯后装辅助驾驶硬件。主要替代方案是 OEM 自研自动驾驶栈、Mobileye
              式供应商方案，以及把全栈留在单一运营方内部的垂直整合自动驾驶出租车项目。实际看，Wayve 可以被理解成横向自动驾驶供应商；它的收入机会取决于有多少 OEM 项目和车队项目能从试验转为生产。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 规模测算视角与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个大机会，但还支撑不了精确到公司的 TAM。Wayve 自己把市场描述为“每一辆会移动的车”，第三方报道则称更广义的 AI 平台机会已经达到数千亿美元。实际采用路径更窄：先从有人监管和 L2+
              OEM 项目切入，再在少数首发市场推进到 L3/L4，等安全性和集成可重复之后，再跨平台放大。因此，市场规模取决于 OEM 把技术演示转成付费生产项目的速度。市场讨论的核心不是静态
              TAM，而是采购团队吸收安全论证、集成和上线支持的速度。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
