              - CR005
              - CR006
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR008
              - CR010
      - number: '7.3'
        title: 集中度与尽调风险
        blocks:
          - type: paragraph
            body: >-
              最后一项风险是集中度：资本集中、注意力集中，以及结果集中在少数大型 OEM 或出行关系中。Wayve
              仍可能在这种结构下成功，但这意味着公司未来取决于相对少数大型交易对手能否按时转化。对尽调而言，最重要的未知数因此非常具体：延误、依赖和披露质量。集中度不只是收入问题，也是治理问题，因为公司必须让多个大型利益方保持一致。投资者应预期，这种动态会在下一轮融资或上线周期中最重要。它是核心风险驱动因素。这是最需要盯住的事。眼下，耐心很重要。
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前估值信号
        blocks:
          - type: paragraph
            body: >-
              最强的公开锚点是 2026 年 2 月 Series D，该轮把公司投后估值定在
              $8.6B。员工要约收购以及几个私募市场参考也强化了这个数字，它们大体聚集在同一区间。含义是，投资者仍愿意为自动驾驶可选性支付战略溢价，但市场还没有把 Wayve
              定价成稳定现金流业务。因此，估值更多由稀缺性和信念决定，而不是由可衡量的盈利能力决定。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
