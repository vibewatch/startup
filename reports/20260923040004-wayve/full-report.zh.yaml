      - number: '6.2'
        title: 标杆客户与验证点
        blocks:
          - type: paragraph
            body: >-
              客户证据最强的地方，是 Wayve 能指向具名伙伴和项目公告。Uber、Nissan、Mercedes-Benz 和 Foxglove
              都表明，公司正在穿过大规模部署前最重要的可信度建设阶段。话虽如此，大多数公开证据仍偏伙伴关系，而非合同，因此市场知道谁感兴趣，却不知道每段关系贡献多少收入。实际解读是，客户势头真实，但尚未完全变现或披露。缺少定价细节，是客户故事仍显早期的主要原因。
            claimRefs:
              - CC005
              - CC006
              - CC007
              - CC008
