      - number: '6.3'
        title: 商业转化与风险
        blocks:
          - type: paragraph
            body: >-
              客户结论是谨慎正面。Wayve 有足够外部证据说明，领先 OEM
              和车队愿意接触；但公司仍需证明这些接触会变成可重复项目，而不是一次性试点。主要尽调问题是转化速度：公开伙伴关系能多快转成生产协议，每个新客户又需要多少工程工作支持。在答案明确之前，客户基础看起来有希望，但还没有完全锚定。因此，本章讲的是早期牵引，而不是已经完成的商业基础。这个区别重要，因为投资者为可重复性付费，而不只是为引荐付费。这就是关键转化测试。
            claimRefs:
              - CC009
              - CC010
              - CC011
              - CC012
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与上线风险
        blocks:
          - type: paragraph
            body: >-
              最明显的风险是监管时点。Wayve
              的公开上线依赖审批、本地运营规则，以及监管机构接受有人监管自动驾驶的速度。这意味着即便产品进展强劲，只要上线许可慢于工程里程碑，收入实现就会放慢。在这类资本强度很高的业务里，上线延误不是边角问题，而是市场何时能看到可重复收入的主要决定因素。即便审批到位，运营限制仍可能因城市和路线而异，时点因此继续不确定。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: figure
