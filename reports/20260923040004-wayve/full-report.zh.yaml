  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与变现
        blocks:
          - type: paragraph
            body: >-
              Wayve 看起来通过软件授权、OEM
              项目工作和上线支持变现，而不是靠造车或消费端订阅产品。公开材料指向一个卖给车企和车队运营商的平台，但没有披露标价、最低承诺或客户层面的收入。收入图景因此方向上可理解，却仍无法干净预测年经常性收入（ARR）、毛利率或回本周期。实际结果是，只靠公开来源可以描述业务，但还无法完整建模。公开运营指标缺失，意味着再好的产品叙事也还不能转成严谨的财务预测。
