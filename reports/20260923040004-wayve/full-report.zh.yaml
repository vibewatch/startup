      - number: '4.2'
        title: 融资、估值与资本强度
        blocks:
          - type: paragraph
            body: >-
              融资序列表明，这是一家公司正在用异常深厚的耐心资本建设业务。Wayve 在 2024 年完成十亿美元以上的 Series C，随后在 2026 年 2 月完成 $1.2B Series D，并在 2026
              年晚些时候另行启动员工要约收购。这种融资节奏重要，因为自动驾驶商业化需要训练数据、安全工程、仿真、集成工作和漫长 OEM
              周期，收入才可能变得可预测。它也给公司留下继续招聘、吸收延期风险的空间，等待上线时点和监管批准逐步落地。这就是为什么即便运营披露仍薄，公司仍能持续吸引资本。
