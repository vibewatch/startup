  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接同行、既有玩家与替代方案
        blocks:
          - type: paragraph
            body: >-
              Wayve 并不是在真空中竞争。直接竞争者包括 Mobileye、Waymo、Tesla、WeRide、Pony.ai、Nuro 等自动驾驶和辅助驾驶供应商，以及其他 AV 开发者；现实中的替代方案往往是 OEM
              内部栈，用自研工程解决同一个问题。Wayve
              所在赛道已经足够拥挤，市场位置取决于公司能否展示可重复的部署路径，而不只是优雅的架构。市场仍足够年轻，许多买方会并行评估多种架构，这意味着竞争位置既取决于流程和信任，也取决于技术纯度。这个竞争场足够动态，一个季度的延误就可能实质改变谁看起来领先。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
      - number: '3.2'
        title: 能力与分发差异
        blocks:
          - type: paragraph
            body: >-
              Wayve 的主张是，端到端具身 AI
              比依赖规则或地图的栈更容易泛化。这一点重要，因为公司想卖的是跨车辆和地理区域运行的自动驾驶平台，而不是一次性的自动驾驶出租车试点。实际看，最好的差异化信号不只是模型架构，而是数据、部署经验、OEM
              信任，以及从试验推进到生产协议的能力组合。Wayve 还能讲出从研究走向产品的叙事；当 OEM 想确认一个栈能否挺过从演示到量产的跳跃时，这种叙事会有用。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP010
              - CP012
      - number: '3.3'
        title: 护城河韧性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Wayve 的护城河有合理性，但尚未证明。公司有深厚资金、高知名度伙伴，以及不断强化的软件定义汽车故事；但端到端 AI 正从专有新意变成行业共识。这带来真实的商品化风险：如果 OEM
              把自动驾驶软件视作模块化层，它们可能在多个供应商之间多栖，或把更多栈带回内部。Wayve
              需要量产胜利，而不只是技术赞誉，才能避开这一结果。因此，最难的问题是：在架构辩论变成入场门槛之前，公司能否把当前认可转成粘性项目胜利。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
