      - number: '1.3'
        title: 融资、规模与运营里程碑
        blocks:
          - type: paragraph
            body: >-
              Wayve 通过一系列融资和商业里程碑，从早期研究实验室走到后期平台公司；这些节点包括 2024 年 5 月 Series C、2026 年 2 月 Series D、2026 年员工要约收购，以及与 Uber
              在伦敦开展的公开道路试验。2026 年 2 月融资把公司投后估值定在 $8.6B，并引入了广泛的战略与财务投资者，包括
              Microsoft、NVIDIA、Uber、Mercedes-Benz、Nissan、Stellantis、Eclipse、Balderton 和 SoftBank Vision Fund 2。2026
              年的公开报道还把员工数放在接近 1,200，并凸显公司正从研究验证转向生产部署；但收入和客户数等核心运营指标仍未披露。
