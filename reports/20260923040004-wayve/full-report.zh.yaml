              - CM008
              - CM009
              - CM010
      - number: '2.3'
        title: 驱动因素、摩擦与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              软件定义汽车、更好的车载计算，以及客户对类人自动化的需求，都在推动采用。阻力来自认证需求、公开定价缺失，以及每个地理区域和车辆平台都会带来新的长尾场景。最新伦敦报道把监管瓶颈具体化：试验可以先宣布，许可却要慢慢写出来。这意味着公司可能先显得战略重要，之后才变得经济上可读。公众热情与运营许可之间的错位，是市场仍具战略吸引力却很难商业承保的关键原因。
            claimRefs:
