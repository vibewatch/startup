company:
  name: Wayve
chapter:
  number: 4
  title: Financials
  summary: Wayve remains hard to underwrite as a conventional operating business because pricing, revenue, and margin disclosure
    are still sparse. What is visible instead is a very large capital base, repeated late-stage financing, and enough public
    liquidity events to suggest the market values the company more like a strategic platform than a near-term cash-flow story.
sections:
- id: revenue-model
  title: Revenue streams and monetization
  body: Wayve appears to monetize through software licensing, OEM program work, and rollout support rather than through vehicle
    manufacturing or a consumer subscription product. The public materials point to a platform sold into automakers and fleet
    operators, but they do not disclose list prices, minimum commitments, or customer-level revenue. That keeps the revenue
    picture directionally understandable while still preventing a clean forecast of annual recurring revenue, gross margin,
    or payback timing. The practical result is that the business can be described, but not yet fully modeled, from public
    sources alone. The absence of public operating metrics means that even a good product narrative does not yet translate
    into a disciplined financial forecast.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  tableRefs:
  - TI001
  - TI002
- id: capital-structure
  title: Funding, valuation, and capital intensity
  body: The funding sequence shows a business that is being built with unusually deep patient capital. Wayve raised a billion-dollar-plus
    Series C in 2024, followed by a $1.2 billion Series D in February 2026 and a separate employee tender offer later in 2026.
    That financing pattern matters because autonomy commercialization requires training data, safety engineering, simulation,
    integration work, and long OEM cycles before revenue can become predictable. It also gives the company room to keep hiring
    and to absorb delay risk while launch timing and regulatory approvals work themselves out. That is why the company can
    keep attracting capital even while operating disclosures stay thin.
  claimRefs:
  - CI005
  - CI006
  - CI007
  - CI008
  - CI009
  tableRefs:
  - TI003
  figureRefs:
  - FI001
  acknowledgedWarnings: []
- id: financial-verdict
  title: Financial quality and diligence blockers
  body: The financial verdict is positive on funding support but still weak on operating visibility. Wayve has enough capital
    and investor backing to continue product development, yet public disclosures still do not show the data an analyst would
    need to build a reliable margin model. The main diligence blocker is therefore not solvency but the absence of public
    pricing, cash-burn, and customer economics. Until those inputs appear, any profitability case remains a scenario rather
    than a model. It is also why public investors keep focusing on strategic optionality instead of near-term earnings power.
  claimRefs:
  - CI010
  - CI011
  - CI012
  - CI013
  tableRefs: []
