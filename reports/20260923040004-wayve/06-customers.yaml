company:
  name: Wayve
chapter:
  number: 6
  title: Customers
  summary: Wayve’s customer story is credible because it already extends beyond a single headline partnership, but the company
    still has to prove that pilots can convert into durable multi-year programs. The question is less whether OEMs and fleets
    are curious and more whether they will standardize on Wayve at scale.
sections:
- id: segments
  title: Customer segments and use cases
  body: Wayve’s public customer narrative spans OEMs, fleet operators, and mobility platforms, which is exactly where an autonomy
    platform needs to start if it wants broad commercial reach. The company’s materials suggest a mix of licensing, integration,
    and deployment support rather than a single one-size-fits-all product. That can be a strength because it opens multiple
    entry points, but it also means the company must tailor its message to very different buying committees. The customer
    problem is therefore not demand generation alone; it is whether each segment sees enough operational value to adopt the
    same core platform.
  claimRefs:
  - CC001
  - CC002
  - CC003
  - CC004
  tableRefs:
  - TU001
- id: evidence
  title: Lighthouse accounts and proof points
  body: The customer evidence is strongest where Wayve can point to named partners and program announcements. Uber, Nissan,
    Mercedes-Benz, and Foxglove all signal that the company is moving through the credibility-building phase that matters
    before mass deployment. That said, most public evidence is still partnership-oriented rather than contract-oriented, so
    the market knows who is interested but not how much revenue each relationship generates. The practical interpretation
    is that customer momentum is real, yet not fully monetized or disclosed. The lack of pricing detail is the main reason
    the customer story still feels early.
  claimRefs:
  - CC005
  - CC006
  - CC007
  - CC008
  tableRefs:
  - TU002
  - TU003
  figureRefs:
  - FU001
- id: customer-verdict
  title: Commercial conversion and risk
  body: 'The customer verdict is cautiously constructive. Wayve has enough external proof to show that leading OEMs and fleets
    are willing to engage, but the company still needs to prove that those engagements become repeatable programs rather than
    one-off pilots. The main diligence question is conversion speed: how quickly can public partnerships turn into production
    agreements, and how much engineering work is required to support each new customer. Until that is answered, the customer
    base looks promising but not yet fully anchored. That makes the chapter a story of early traction rather than a completed
    commercial base. That distinction matters because investors pay for repeatability, not just introductions. That is the
    key conversion test.'
  claimRefs:
  - CC009
  - CC010
  - CC011
  - CC012
  tableRefs: []
