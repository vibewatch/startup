callouts:
  - calloutType: risk
    title: Pre-Revenue $2B Valuation Requires Thesis-Stage Discipline
    body: >-
      Cowboy Space carries a $2 billion valuation with zero disclosed revenue, no customer contracts, no operational hardware,
      and a rocket that does not yet exist. ArsTechnica and IEEE Spectrum have both flagged the unproven physics of 1 MW
      radiative cooling in a vacuum as a fundamental risk to the ODC thesis. Comparable pre-revenue aerospace companies
      (Relativity, ABL) failed to convert venture capital into sustainable operations. Investors should apply significant
      milestone-contingent discount to the current valuation and require verifiable technical gates (static fire, thermal
      test, first payload integration) before full commitment.
    claimRefs:
      - CI001
      - CI004
      - CI023
      - CI039
      - CI040

  - calloutType: insight
    title: SAIC and DoD Channel Provide Credible Near-Term Revenue Anchor
    body: >-
      Unlike most deep-tech space startups, Cowboy Space has a credible government revenue pathway via the SAIC strategic
      investment and prior OECIF proof-of-concept contract. Defense and intelligence customers have established procurement
      frameworks for emerging orbital capabilities, tolerance for prototype risk, and multi-year budgets that can anchor
      a pre-commercial stage startup. If SAIC and the DoD convert strategic interest into procurement contracts, government
      revenue could meaningfully extend runway and provide independent financial validation before the first commercial
      satellite is operational.
    claimRefs:
      - CI009
      - CI010
      - CI032
      - CI041

  - calloutType: recommendation
    title: Five Financial Diligence Gates Must Be Cleared Before Investment Commitment
    body: >-
      Before any investment commitment, diligence should confirm: (1) audited or reviewed financials showing current cash
      balance and monthly burn; (2) a program-level use-of-funds breakdown for the $275M Series B; (3) the OECIF contract
      value and any SAIC procurement framework or MOU; (4) a credible capital recycling strategy for constellation scale-up
      beyond Series B; and (5) an independent engineering validation of the satellite thermal management approach. Without
      these five inputs, no financial model of Cowboy Space can be considered underwritten.
    claimRefs:
      - CI037
      - CI031
      - CI032
      - CI007
      - CI044

