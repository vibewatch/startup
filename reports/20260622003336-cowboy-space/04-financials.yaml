        - Request CFO-level budget breakdown by rocket program, satellite program, regulatory, and overhead
      - - Government contract dollar amounts (OECIF + SAIC)
        - SAIC and DoD are potential anchor customers; undisclosed amounts prevent revenue probability modeling
