figures:
  - id: FI001
    title: Revenue Model Bridge — From Customer Activity to Gross Profit
    type: flow
    layout: standard
    summary: >-
      Depicts the sequential gates between potential customer demand and realized orbital compute revenue, identifying
      four critical dependencies that must be cleared before any gross-profit moment occurs.
    data:
      nodes:
        - id: customer_need
          label: Customer Compute Demand
          description: >-
            AI labs, defense agencies, earth-observation operators unable to access terrestrial grid or seeking
            latency-native orbital compute
        - id: satellite_availability
          label: Operational Satellite in Orbit
          description: >-
            Requires rocket development (2028+), satellite manufacturing, launch cadence, and FCC spectrum authorization
            for Stampede constellation
        - id: access_window
          label: LEO Access Window
          description: >-
            Orbital mechanics constrain ground-contact windows; intermittency is a key unit-economics risk vs. always-on
            terrestrial compute
        - id: compute_provisioning
          label: Compute Job Provisioning
          description: >-
            Scheduling, orchestration, and data routing for GPU workloads running during orbital pass; no software stack
            publicly demonstrated
        - id: revenue_event
          label: Revenue Recognition Event
          description: >-
            Per-GPU-hour or per-kWh charge recognized upon job completion; pricing model not yet published by company
        - id: gross_profit
          label: Gross Profit
          description: >-
            Revenue minus amortized satellite capex, launch cost, NVIDIA Space-1 module procurement, and orbital operations;
            all inputs estimated, none confirmed
      edges:
        - from: customer_need
          to: satellite_availability
          label: Gate 1 — Hardware
        - from: satellite_availability
          to: access_window
          label: Gate 2 — Orbital Mechanics
        - from: access_window
          to: compute_provisioning
          label: Gate 3 — Software
        - from: compute_provisioning
          to: revenue_event
          label: Gate 4 — Pricing Model
        - from: revenue_event
          to: gross_profit
          label: Gate 5 — Unit Economics
    approximationNotes: >-
      All nodes reflect the inferred operating model based on public descriptions of the Stampede constellation and
      comparable orbital compute ventures. No software stack, pricing schedule, or operational satellite exists as of
      June 2026; this bridge is illustrative of the dependency chain, not a confirmed product flow.
    claimRefs:
      - CI036
      - CI017
      - CI018
      - CI011

  - id: FI002
    title: Unit Economics Bridge — From Per-Satellite Deployment to Revenue
    type: flow
    layout: standard
    summary: >-
      Qualitative unit-economics flow from satellite procurement cost through to per-unit revenue contribution, using
      approximate benchmarks where direct data is unavailable.
    data:
      nodes:
        - id: satellite_capex
          label: Per-Satellite Capex Input
          description: >-
            GPU hardware ($2.25M–$30M est.), satellite bus, thermal management, power system; space-grade premium
            estimated at 3–10x terrestrial equivalent
        - id: launch_cost
          label: Per-Satellite Launch Cost
          description: >-
            $5M–$25M estimated depending on satellite mass and launch vehicle; Falcon 9 rideshare at ~$2,500/kg is the
            current market reference; Cowboy's own rocket targets cost reduction
        - id: total_deployment_cost
          label: Total Deployment Cost Per Unit
          description: >-
            $7.25M–$55M per satellite (capex + launch); amortized over satellite lifetime (estimated 5–7 years for LEO)
        - id: orbital_revenue_per_unit
          label: Revenue Per Satellite Per Year
          description: >-
            Undisclosed; at $5/GPU-hr for 800 GPUs × 2,000 contact-hours/yr = ~$8M/yr per satellite (illustrative only)
        - id: unit_payback
          label: Estimated Unit Payback Period
          description: >-
            At illustrative $8M/yr revenue per satellite vs. $7.25M–$55M deployment cost: 0.9–6.9 year payback;
            shorter end requires favorable hardware cost and Cowboy's own launch vehicle
        - id: gross_contribution
          label: Gross Contribution Margin
          description: >-
            Negligible until satellite operational costs (thermal control, comms, software licensing) are subtracted;
            no confirmed margin data available
    approximationNotes: >-
      All inputs are estimates derived from publicly available hardware benchmarks (NVIDIA pricing analogues, SpaceX
      rideshare rates) and illustrative revenue scenarios not confirmed by the company. The 800 GPU figure per satellite
      is taken from company FCC filings and media coverage; actual deployed capacity may differ. Revenue-per-satellite
