  - id: cost-structure-and-capital-intensity
    title: Cost Structure and Capital Intensity
    body: >-
      Cowboy Space faces a cost structure that is unusual even within the capital-intensive aerospace sector: it must simultaneously
      fund rocket propulsion R&D, satellite bus development, space-qualified GPU compute integration, FCC regulatory compliance for
      a 20,000-satellite constellation, and a physical Seattle manufacturing hub for both rockets and satellites. Each element alone
      represents a multi-year, hundred-million-dollar program. Comparable small-to-medium launch vehicle programs — Relativity Space,
      ABL Space Systems, and Stoke Space — consumed between $100 million and $650 million before reaching first operational milestones,
      and several failed to reach them at all. NVIDIA's Space-1 Vera Rubin LEO-optimized GPU modules, a likely hardware building block,
      are engineered for sub-1 MW per satellite power budgets and radiation-hardened operation, but their space-grade procurement cost
      is estimated at three to ten times terrestrial hyperscale equivalents — potentially $750K to $3M per satellite for GPU
      infrastructure alone. The ArsTechnica analysis of orbital data center physics highlighted that radiative cooling of a 1 MW
      compute payload in vacuum requires approximately 200 square meters of radiator surface, an undemonstrated engineering constraint
      at production scale. A full 20,000-satellite constellation at an estimated $5 million per unit in manufacturing and launch
      costs would require approximately $100 billion in total capex — a figure roughly fifty times the current capital raised. The
      company's near-term capital plan is therefore a staged wedge: use the $275 million Series B to build a credible rocket-and-
      satellite proof of concept, then use demonstrated capability to unlock project financing, sovereign capital, or further equity
      rounds for constellation scaling. No public confirmation of this staged financing strategy exists; it is inferred from the
      scale mismatch between current capital and stated ambition.
    claimRefs:
      - CI014
