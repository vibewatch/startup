  name: Cowboy Space Corporation

chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Cowboy Space's defining architectural bet is to eliminate the boundary between launch vehicle and orbital data center: the
    rocket's second stage is the satellite, integrating 1 MW solar power generation, NVIDIA Space-1 Vera Rubin compute modules,
    active thermal management, and optical inter-satellite links into a single 20,000–25,000 kg vehicle designed from the ground
    up. The Stampede FCC filing for up to 20,000 dawn-dusk sun-synchronous satellites is the most ambitious orbital data center
    deployment plan on record, with optical-only ISLs distinguishing it from spectrum-congested rivals. Roadmap milestones run
    from a 2026 power-beaming demo built with Apex to early-2027 first compute node and end-2028 first proprietary rocket launch,
    but the FCC filing itself acknowledges the satellite design is unfinished, and no rocket engine, test facility, or manufacturing
    line for the production vehicle has been demonstrated as of June 2026.

sections:
  - id: core-architecture-upper-stage-as-data-center
    title: Core Architecture — Upper-Stage-as-Data-Center
    body: >-
      Cowboy Space's central product insight is that the conventional aerospace model of launch vehicle plus separate satellite
      payload imposes structural redundancy — duplicated avionics, inter-stage adapters, separation systems, and load-bearing
      structure that contribute mass without adding compute or power. The company's solution is to treat the rocket's upper stage
      as the orbital data center itself: a single vehicle that ascends to low Earth orbit and then operates in place as a
      megawatt-class compute node. Each Stampede unit is designed to weigh 20,000 to 25,000 kilograms, generate 1 MW of power
      from solar panels deployed in a dawn-dusk sun-synchronous orbit between 700 and 1,000 kilometers altitude, and host
      approximately 800 GPUs. The chosen compute hardware is NVIDIA's Space-1 Vera Rubin module, purpose-built for LEO AI
      workloads and unveiled at GTC in March 2026. The Vera Rubin module pairs an 88-core CPU with two Rubin graphics chips;
      a single Rubin chip delivers 50 petaflops of NVFP4 performance. Cowboy Space was named on NVIDIA's launch-partner slate
      for the Space-1 program, confirmed by both NVIDIA's press materials and multiple independent media sources. The stage
      structure itself is intended to double as a radiator, with active thermal management systems dissipating waste heat
      generated by the compute payload — a design necessity in vacuum, where convective cooling is unavailable. CEO Baiju Bhatt
      described the architecture as: "each upper stage leverages the full mass and volume of the vehicle to package power
      generation, cooling, and compute together — including using the stage structure itself as a radiator." This concept
      reduces the number of separately manufactured, tested, and launched components for each orbital data center unit and
      is the company's primary engineering and economic differentiation claim versus competitors building satellite payloads
      for third-party rockets. The rocket is sized to be somewhat larger than SpaceX's Falcon 9 in payload capacity but
      smaller than Starship, targeting 20,000–25,000 kg to orbit. Reusability is described as a design goal "where it makes
      economic sense," but is explicitly subordinated to maximizing compute mass to orbit efficiency. The degree to which
      eliminating the payload adapter and secondary structure actually improves mass fraction versus a conventional two-stage
      rocket with a purpose-built satellite payload has not been independently quantified; it remains a company-claimed benefit
      supported by architectural logic but without demonstrated hardware.
