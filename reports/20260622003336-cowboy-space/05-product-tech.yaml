  - id: nvidia-space-1-and-technology-stack
    title: NVIDIA Space-1 Partnership and Technology Stack
    body: >-
      The compute foundation of every Stampede satellite is NVIDIA's Space-1 Vera Rubin module, a LEO-optimized GPU
      inference and training system unveiled at NVIDIA GTC in March 2026. NVIDIA's space computing product page confirms
      that Cowboy Space Corporation is integrating three distinct NVIDIA components — the Vera Rubin Space-1 Module for
      primary GPU workloads, the IGX Thor edge AI processor for local control and inference orchestration, and the Jetson
      Orin for autonomous satellite operations management. This layered compute stack is designed to partition workloads:
      large-scale GPU batch inference or training on the Vera Rubin modules, real-time edge processing on IGX Thor, and
      autonomous housekeeping on Jetson Orin. However, the specific hardware interfaces, module count per satellite, and
      thermal envelope per module are not publicly disclosed. The Space-1 module is presented as a radiation-tolerant
      design for LEO operations, though the degree of radiation hardening — whether it meets full military space-grade
      standards or a lighter commercial LEO tolerance — has not been independently verified. NVIDIA's space computing
      initiative represents a significant market validation signal: it is the first major GPU vendor to release a
      product line specifically positioned for orbital AI infrastructure, and Cowboy Space being a named launch partner
      adds commercial credibility to the hardware roadmap. Cowboy's optical inter-satellite link architecture requires
      proprietary or third-party free-space optical terminal hardware to connect Stampede satellites into a constellation
      network. The FCC filing describes optical ISLs as the primary data transport layer, but does not specify terminal
      specifications, link budget, availability targets, or pointing/acquisition/tracking approach — all critical
      unknowns for actual operational performance. On the ground-segment side, the filing requests Ka-band spectrum for
      TT&C; ground station infrastructure for data downlink to customers is not described. The satellite bus for the
      first demonstration mission is being built by Apex Space, a Los Angeles-based high-rate satellite manufacturer
      that as of mid-2026 operates a production facility capable of over 200 buses per year and is scaling to
      100,000+ square feet by end of 2026. Apex uses its proprietary "Octopus" manufacturing OS to manage assembly
      scheduling and work instructions. Apex's role is confirmed for the first demo satellite but its role in
      production-rate Stampede manufacturing is not contractually confirmed in public filings.
