callouts:
  - calloutType: risk
    title: Thermal Rejection Is the Physics Gate
    body: >-
      Dissipating 1 MW of compute waste heat in vacuum via radiation only has no published hardware precedent at this
      scale in a commercial satellite. The stage-as-radiator approach is logical but undemonstrated. If the thermal
      architecture fails validation, the 1 MW compute specification cannot be met at the satellite mass and form factor
      described — forcing either a lower compute density or a fundamentally different thermal design.
    claimRefs:
      - CE032
      - CE033

  - calloutType: strength
    title: Optical-Only ISL is a Genuine Spectrum Innovation
    body: >-
      Designing Stampede to operate primarily through optical links rather than radiofrequency spectrum eliminates the
      ITU coordination burden facing every other large constellation. This is not merely a differentiation claim — it is
      the factual basis for the FCC waiver request and, if granted, would allow Cowboy to build and license its
      constellation faster than RF-dependent competitors in the same orbit regime.
    claimRefs:
      - CE016
      - CE017
      - CE021

  - calloutType: risk
    title: Rocket Development Is Pre-Hardware and Concurrent with All Other Timelines
    body: >-
      The 2028 first launch requires completing propulsion R&D, engine testing, manufacturing facility buildout, and launch
      site licensing — simultaneously with satellite design, NVIDIA hardware integration, and FCC license prosecution.
      TechCrunch confirmed the company is "still working through key development needs, like facilities to test,
      manufacture, and launch its rockets" as of May 2026. No comparable startup has compressed this timeline below
      five to seven years from inception.
    claimRefs:
      - CE039
      - CE043
      - CE048

