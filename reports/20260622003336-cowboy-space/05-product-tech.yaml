      - CE004
      - CE005
      - CE015
      - CE016

  - id: FE002
    title: Customer Workflow — From AI Compute Request to Orbital Processing
    type: flow
    layout: standard
    summary: >-
      Data flow from an AI infrastructure customer through the Stampede ground system, satellite uplink, orbital compute,
      and optical downlink to result delivery.
    data:
      nodes:
        - id: "customer"
          label: "AI / Defense Customer"
          description: "Submits compute job or data stream; receives processed output"
        - id: "ground_station"
          label: "Ground Station (optical + Ka-band)"
          description: "Uplinks job data or sensor stream via optical or TT&C link; downlinks results"
        - id: "stampede_satellite"
          label: "Stampede Satellite (Galactic Brain)"
          description: "Receives data during pass window; processes on NVIDIA GPUs; stores results"
        - id: "isl_network"
          label: "Optical ISL Network"
          description: "Routes data between Stampede satellites to extend effective coverage window"
        - id: "optical_downlink"
          label: "Optical Downlink Beam"
          description: "High-bandwidth free-space optical link delivers processed results to ground station"
