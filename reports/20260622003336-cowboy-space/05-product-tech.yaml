figures:
  - id: FE001
    title: Stampede Satellite Product Architecture Stack
    type: stack
    layout: standard
    summary: >-
      Layered architecture of a single Stampede satellite showing how power generation, compute, thermal management,
      communications, and propulsion are integrated into the rocket upper stage.
    data:
      layers:
        - label: "Solar Power Generation"
          detail: "1 MW target; dawn-dusk SSO maximizes daily sun exposure; deployable panels on stage structure"
        - label: "Power Distribution and Management"
          detail: "Onboard power electronics; regulates DC bus power to compute, thermal, and avionics loads"
        - label: "Compute Payload (NVIDIA Space-1)"
          detail: "~800 Vera Rubin GPU chips; IGX Thor for inference orchestration; Jetson Orin for autonomy"
        - label: "Active Thermal Management"
          detail: "Stage structure as primary radiator surface; active heat pipes; supplemental deployable radiators TBD"
        - label: "Optical Communications (ISL + Downlink)"
          detail: "Free-space optical ISLs to neighboring Stampede satellites; optical high-bandwidth downlink to ground"
        - label: "TT&C and Housekeeping (Ka-band)"
          detail: "Narrowband Ka-band 18.8–19.3 GHz downlink / 28.6–29.1 GHz uplink for emergency command and telemetry"
        - label: "Propulsion (Upper Stage)"
          detail: "Proprietary engine for orbital insertion; station-keeping and end-of-life deorbit thrusters"
    approximationNotes: "Architecture reflects company-stated design goals; no hardware has been built or tested at this configuration."
