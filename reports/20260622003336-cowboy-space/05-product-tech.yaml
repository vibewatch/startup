  - id: stampede-constellation-and-fcc-regulatory-framework
    title: Stampede Constellation and FCC Regulatory Framework
    body: >-
      Three days after closing the Series B, Cowboy Space filed FCC application SAT-LOA-20260323-00135 for the Stampede
      constellation: authority to launch and operate up to 20,000 non-geostationary orbit satellites in dawn-dusk
      sun-synchronous orbit between 700 and 1,000 kilometers, making it the largest orbital data center deployment plan
      filed with the FCC as of June 2026. The filing architecture is technically distinctive: Stampede is designed to
      operate primarily through optical inter-satellite links and optical downlinks rather than radiofrequency spectrum,
      with narrowband Ka-band (18.8–19.3 GHz downlink, 28.6–29.1 GHz uplink) reserved only for telemetry, tracking, and
      command during mission-critical phases and emergencies. This optical-first design is the basis for Cowboy's waiver
      request from the FCC's standard deployment bond and milestone framework: the company argues those rules were designed
      to prevent spectrum warehousing, which is inapplicable to a system that by design avoids congested RF bands. The
      company further asserts that commercial services can begin with as few as one satellite, allowing a staged build-out
      driven by economics rather than regulatory mandates. The FCC's Schedule S form data lists four representative satellites
      in four orbital planes at 830–860 km apogee/perigee with a five-year estimated operational lifetime. However, the
      Technical Annex and legal narrative — which carry the full 20,000-satellite concept — explicitly acknowledge that the
      "satellite design is unfinished and will require a license modification before service begins." That admission is
      unusual in FCC filings and reflects that Stampede is a regulatory reservation and concept-of-record filing, not a
      construction-ready proposal. The FCC application has not been granted as of June 2026; it is under review. Stampede
      competes in the FCC queue with SpaceX's filing for up to one million orbital data center satellites and Starcloud's
      filing for up to 88,000 — the entire orbital compute application landscape is regulatory-first, with no constellation
      yet in commercial operation at the scales proposed. The dawn-dusk sun-synchronous orbit choice is deliberate: it
      maximizes solar exposure duration per day, which supports continuous power generation for compute workloads without
      the eclipse periods that affect other LEO regimes. Altitude selection at 700–1,000 km involves a trade-off:
      increased drag-free operational life versus longer orbital decay times that increase end-of-life debris exposure if
      active deorbit systems fail. The FCC filing does not detail the deorbit or collision avoidance approach.
