      - number: '6.3'
        title: Go-to-Market Motion and Sales Infrastructure
        blocks:
          - type: paragraph
            body: >
              Cowboy Space has not disclosed a go-to-market strategy, sales organization, or customer acquisition
              roadmap as of June 2026. No enterprise sales leaders, account executives, or business development hires
              appear in public job postings or press coverage. The GeekWire article on the company's Seattle hiring
              notes 40-60 planned employees focused on satellite design and rocket/propulsion engineering —
              predominantly technical roles, not commercial ones.

              The implied GTM motion is B2B enterprise direct sales. Given the scale of the addressable customer
              segments (hyperscalers, defense contractors, space station operators), any meaningful commercial
              engagement would require long sales cycles, complex procurement processes, and deep enterprise integration
              expertise. For defense customers specifically, procurement workflows typically run 12–24 months from
              requirement identification to contract award, and compliance prerequisites — ITAR authorization, likely
              FedRAMP moderate or high, and CMMC certification — add substantial lead time before a DoD entity could
              deploy workloads on a third-party orbital platform.

              SAIC's strategic investment is the most plausible anchor for a channel or co-sell arrangement into the
              defense segment. SAIC has established relationships with DoD CIO organizations and defense prime
              contractors that could accelerate Cowboy's procurement pathway. However, no formal reseller, channel
              partner, or co-sell agreement with SAIC has been disclosed. The entire commercial entry strategy remains
              an open diligence item.
