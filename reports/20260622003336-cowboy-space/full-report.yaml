      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Grid Bottleneck Is Real but Temporary
            body: >-
              The terrestrial power grid interconnection backlog is the strongest near-term tailwind for orbital data
              centers. However, it is a temporary structural friction, not a permanent market condition. Utilities are
              investing billions in new generation capacity, and data center operators are pursuing grid-bypass
              solutions (nuclear PPAs, co-located solar, liquid cooling) that do not require orbital infrastructure.
              Cowboy Space's value proposition is most durable if it can prove unit economics before terrestrial
              alternatives close the gap.
            calloutType: insight
            claimRefs:
              - CM005
              - CM009
              - CM033
          - type: callout
            title: Thermal and Debris Risks Are Unresolved Pre-Revenue
            body: >-
              Cooling one megawatt in vacuum at Stampede's proposed scale has not been demonstrated. The combination of
              unfinished satellite design (per FCC filing), debris liability at 700–1,000 km, and no commercial revenue
              as of June 2026 means the market thesis rests on engineering bets that have not cleared. Investors should
              treat the orbital TAM as aspirational until at least one Stampede satellite completes an end-to-end
              compute mission.
            calloutType: risk
            claimRefs:
              - CM034
              - CM035
              - CM036
              - CM044
          - type: callout
            title: No Independent ODC Market Sizing Exists
            body: >-
              All market sizes cited for orbital data centers as of June 2026 are either company-claimed projections or
              extrapolations from the terrestrial compute market. No independent analyst firm has published a
              peer-reviewed orbital data center TAM/SAM/SOM as of this run date. Sizing presented here uses an
              evidence-constrained framework anchored to documented terrestrial demand and power constraints, not a
              single top-down estimate.
            calloutType: assumption
