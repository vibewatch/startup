              Cowboy has raised serious money, but the financing gap between today's balance sheet and tomorrow's
              ambition is still wide. The company closed a $275 million Series B at a $2 billion valuation, bringing
              disclosed equity to roughly $325 million. That is meaningful capital for a proof and staffing phase, yet
