          - type: callout
            title: Optical-Only ISL is a Genuine Spectrum Innovation
            body: >-
              Designing Stampede to operate primarily through optical links rather than radiofrequency spectrum
              eliminates the ITU coordination burden facing every other large constellation. This is not merely a
              differentiation claim — it is the factual basis for the FCC waiver request and, if granted, would allow
              Cowboy to build and license its constellation faster than RF-dependent competitors in the same orbit
              regime.
            calloutType: strength
            claimRefs:
