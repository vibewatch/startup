      - number: '7.2'
        title: Launch and manufacturing risk
        blocks:
          - type: paragraph
            body: >-
              The second risk layer is execution at rocket scale. Cowboy is not merely procuring launch; it is
              attempting to stand up its own rocket program because each data center satellite is also the upper stage
              of the launch vehicle. TechCrunch says Bhatt expects the first proprietary launch before the end of 2028,
              while SpaceNews says the hybrid vehicle would be larger than Falcon 9 but smaller than Starship and target
              20,000-25,000 kilograms of payload capacity. That is not a modest hardware program. It implies engines,
              structures, avionics, guidance, qualification, stage integration, and reuse assumptions all moving
              together. FAA licensing adds a separate regulatory gate on top of the FCC filing, because launch and
              reentry authority sit outside spectrum approval. Public reporting also makes clear that Cowboy plans to
              build its own rocket engine and has recruited experienced personnel, but the current public corpus still
              does not show engine-test results, a factory, a dedicated test facility, or a demonstrated path from an
              initial launch in 2028 to the sustained cadence required for a 20,000-unit constellation. Even if the
              first vehicle flies on time, the scale problem remains: manufacturing and orbiting thousands of 20-25 ton
              satellites demands a launch system and industrial base that are both much larger than anything Cowboy has
              yet demonstrated. Until its own launcher exists, the company also remains exposed to third-party launch
              market pricing and availability.
