  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct Orbital Data Center Competitors
        blocks:
          - type: paragraph
            body: >
              Four companies are racing Cowboy Space in the direct orbital data center category: Starcloud, SpaceX, Blue
              Origin, and Sophia Space. Each targets the AI-power-bottleneck thesis but pursues a different
              architecture, scale, and launch strategy.

              Starcloud (formerly Lumen Orbit) is the most operationally mature pure-play ODC startup. Its first
              satellite, Starcloud-1, launched in November 2025 carrying an NVIDIA H100 GPU—the first high-end AI
              accelerator verified in orbit. The mission ran a version of Google's Gemma language model and trained a
              nanoGPT model onboard, demonstrating that GPU-class inference is physically possible in LEO. Starcloud-2,
              its first commercial mission, is expected to offer GPU clusters, persistent storage, and 24/7 access. In
              February 2026 the company filed with the FCC for authority to operate up to 88,000 satellites in
              sun-synchronous orbits at 600–850 km, making it the second-largest ODC filing by count. Crusoe Energy
              announced in October 2025 that it would deploy Crusoe Cloud on a Starcloud satellite scheduled for late
              2026, the first announced commercial cloud tenant on an orbital platform. Starcloud's lead over Cowboy is
              real: hardware in orbit, AI workloads run, a commercial mission planned for 2026, and a major cloud
              customer on board—all before Cowboy expects its first proprietary launch.

              SpaceX entered the ODC discussion at an entirely different scale. On January 30, 2026 Space Exploration
              Holdings filed with the FCC for the "SpaceX Orbital Data Center System," a non-geostationary constellation
              of up to 1 million satellites at altitudes of 500–2,000 km relying principally on optical intersatellite
              links, potentially connected to existing first- and second-generation Starlink systems. SpaceX's
              structural advantages over every other ODC entrant are decisive: it controls Starship, the only vehicle
              that can cost-effectively lift the 20-to-25-tonne satellites Cowboy is planning; it runs the world's
              largest commercial satellite constellation; and it has manufacturing volume and launch cadence no startup
              can match in the near term. If SpaceX commercializes its ODC system, it could simultaneously supply launch
              capacity to rivals and compete for the same workloads.

              Blue Origin's Project Sunrise is the third large-scale entry. Blue Origin filed with the FCC for a system
              of up to 51,600 satellites in sun-synchronous orbits between 500 and 1,800 km, routing traffic through
              optical links and its TeraWave broadband architecture. Blue Origin has the New Glenn heavy-lift vehicle
              and propulsion heritage, giving it launch independence that Sophia Space and most ODC startups lack.
              Project Sunrise pairs compute with connectivity, potentially offering an integrated
              AI-data-center-plus-broadband bundle that Cowboy's narrower proposal cannot match today.

              Sophia Space targets the same dawn-dusk solar orbit thesis as Cowboy but with a different hardware
              architecture. Its Thermal Integrated LEO Edge (TILE) design places compute modules adjacent to radiative
              heat-rejection panels at the point of heat generation, reducing mass and complexity compared with
              traditional data-center thermal plants. NVIDIA lists Sophia Space among its Space-1 Vera Rubin
              partners—the same supplier relationship Cowboy holds—but Sophia's focus on modular thermal design
              addresses one of the hardest unsolved problems in orbital AI. Sophia Space has not announced a launch date
              or funding equivalent to Cowboy's $325M disclosed capital.
