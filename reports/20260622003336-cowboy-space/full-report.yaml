      - number: '5.4'
        title: Thermal Management and Critical Technical Constraints
        blocks:
          - type: paragraph
            body: >-
              The single most difficult verified engineering problem for orbital data centers at the 1 MW power scale is
              heat rejection. In a terrestrial data center, power usage effectiveness is defined in part by the ability
              to move waste heat into air or water — neither of which exist in orbit. The only available mechanism is
              thermal radiation, governed by the Stefan-Boltzmann law: a surface at 300 K radiates approximately 460
              W/m². Dissipating 1 MW of thermal load at that temperature requires approximately 2,170 square meters of
              radiator surface area at perfect emissivity — in practice, the requirement approaches 3,000–4,000 m²
              accounting for geometric view factor constraints and real emissivity. Technical analyses published in 2026
              on the "physics wall" for orbital data centers placed the requirement at roughly 200 square meters as a
              minimum for a well-optimized single-MW node operating at higher temperatures (around 500–600 K, which
              itself stresses GPU thermal tolerances). Cowboy Space's design answer is to use the rocket stage structure
              as a radiator — a concept that exploits the large surface area of a full 20,000+ kg stage but has not been
              demonstrated at any intermediate scale. No publicly available thermal model, prototype test result, or
              third-party engineering review of this approach has been published. A second unresolved constraint is
              radiation hardening. LEO at 700–1,000 km altitude passes through the South Atlantic Anomaly and the
              fringes of the Van Allen radiation belt, exposing hardware to energetic protons and electrons. Commercial
              GPU architectures are susceptible to single-event upsets and total ionizing dose degradation; NVIDIA's
              Space-1 modules are described as radiation-tolerant for LEO, but no independent qualification data sheet
              or MIL-SPEC equivalent has been published. A third constraint is data gravity: orbital compute workloads
              must either move large datasets to orbit (implying high uplink bandwidth to the satellite), process
              streamed data from LEO sensors (a naturally co-located use case), or accept significant latency for
              ground-to-orbit round trips. The optical downlink design addresses throughput potential but not the
              ingestion economics. TechCrunch reported in May 2026 that Cowboy Space is "still working through key
              development needs, like facilities to test, manufacture, and launch its rockets" — confirming that rocket
              engine testing infrastructure does not yet exist. These combined uncertainties — thermal, radiation,
              data-link, and propulsion test infrastructure — mean that the 2028 first launch milestone depends on
              resolving multiple concurrent first-of-kind engineering challenges without demonstrated hardware at
              intermediate scale.
