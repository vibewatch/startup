      - number: '8.2'
        title: Valuation Context, Round Pricing, and Comparable Analysis
        blocks:
          - type: paragraph
            body: >
              Cowboy Space raised $275 million at a $2 billion post-money valuation in May 2026, implying approximately
              13.8% dilution from the Series B tranche alone and a pre-money value of roughly $1.725 billion. The
              company had raised approximately $365 million in total by the Series B close across its seed, $50M Series
              A (April 2025), and Series B. No cap table, liquidation preferences, or fully diluted share count have
              been disclosed publicly, making precise dilution and option-value analysis impossible from outside the
              data room.

              Within the orbital data center category, Cowboy's valuation is the highest among the peers with disclosed
              or inferred round prices. Starcloud reached unicorn status ($1.1B) at its $170M Series A in March 2026 and
              was reportedly pursuing $200M more at $2.2B, per sources cited by SpaceNews and BlackNight Space Labs.
              Lonestar Data Holdings — a lunar data center concept — had raised only ~$12.4M total by late 2025,
              illustrating the wide funding dispersion within space-compute startups.

              Against AI infrastructure anchors, public neocloud and data center companies trade at a median 11.8x
              forward revenue as of June 2026 (multiples.vc). CoreWeave, the sector leader, has a market cap of
              approximately $64 billion against $6.2B TTM revenue. Crusoe AI raised $1.37B at a $10B+ valuation in
              October 2025 — with actual data center revenue. These comps show what the market pays for AI compute
              infrastructure that already produces revenue. Cowboy's $2B with zero revenue is a different instrument: it
              prices the strategic option on ODC market creation, backed by a top-tier investor syndicate (Index
              Ventures, a16z, Breakthrough Energy, IVP) in a favorable Q1 2026 SpaceTech investment climate where $8.0B
              was deployed globally in a single quarter (Seraphim Space Index). Finro's Q1 2026 analysis cautions,
              however, that the private AI market has begun sharply repricing "growth now, business model later"
              narratives toward companies with repeatable monetization and durable demand — a direct risk to Cowboy's
              current multiple if milestones slip.
