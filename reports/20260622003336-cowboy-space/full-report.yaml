              The concentration risk associated with a first commercial customer is extreme. Should SAIC or any single
              defense customer be the first paying entity, that customer would represent 100% of revenue at launch — an
              acute dependency that would give the customer disproportionate negotiating leverage on pricing and
              contract terms. Defense contract structures would typically mitigate this through multi-year commitments,
              but those contracts come with compliance burdens (ITAR, FedRAMP, CMMC) that take substantial time to
              satisfy and can be revoked if requirements are not maintained.

              The expansion story is theoretically compelling: Cowboy's Stampede constellation scales from a single
              satellite to 20,000, each adding one megawatt of compute capacity. Land-and- expand dynamics could emerge
