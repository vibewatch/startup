      - number: '4.2'
        title: Revenue Model and Monetization Path
        blocks:
          - type: paragraph
            body: >-
              Cowboy Space has not disclosed any revenue, annual recurring revenue, customer contracts, letters of
              intent, or financial projections as of its Series B close in May 2026. The company is explicitly
              pre-revenue by any public measure. The planned revenue model centers on leasing orbital data center
              capacity — compute time and power — to customers in the earth observation analytics, defense, commercial
              AI training, and sovereign data compliance segments. Rather than selling hardware, the company intends to
              charge on a per-compute-unit or per-kilowatt-hour basis, analogous to cloud infrastructure pricing but
              adapted for intermittent LEO access windows and thermal constraints. The Series B press release cited
              three priority use-of-funds categories: rocket engine R&D, satellite-embedded compute integration, and
              regulatory compliance (FCC and spectrum licensing). No pricing schedules, list rates, or reference
              customer pilots have been published. Government and defense contracts — anchored by the SAIC strategic
              investment and the prior OECIF proof-of-concept — represent the most credible near-term revenue pathway,
              given established defense procurement infrastructure and tolerance for emerging technology risk.
              Commercial revenue from hyperscale AI customers would require demonstrating competitive latency,
              reliability, and cost advantages over terrestrial colocation, none of which have been independently
              validated. The Construct Capital blog post framed the company's market entry around solving an "energy
              bottleneck," suggesting the early revenue thesis centers on customers who cannot access terrestrial grid
              capacity on the required timeline. Without disclosed contracts or pilots, the revenue model must be
              assessed as open-question territory.
