          - type: callout
            title: Vertical Integration Is Cowboy's Defensible Thesis—If the Rocket Works
            body: >
              No other pure-play ODC startup is building its own rocket. If Cowboy successfully develops a launch
              vehicle by 2028–2029, it will control the single most constrained resource in orbital compute: launch
              slots at competitive cost. That supply bottleneck—confirmed by Cowboy's CEO after surveying commercial
              launch providers—will not resolve through market forces alone in the critical 2026–2032 window. The thesis
              is sound; the execution risk is enormous.
