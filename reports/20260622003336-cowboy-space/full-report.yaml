  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer Landscape and Potential Customer Segments
        blocks:
          - type: paragraph
            body: >
              Cowboy Space targets customers whose AI compute and data processing needs are constrained by terrestrial
              infrastructure — primarily power availability and grid interconnection queues — and who could benefit from
              orbital compute that harvests abundant solar energy in low Earth orbit. The NewSpaceEconomy analysis of
              the ODC market identifies five early customer archetypes: Earth observation operators, defense and
              security agencies, space station users, lunar infrastructure firms, and AI developers facing unusual
              energy or location constraints. These segments share a narrow but financially capable profile: budgets
              aligned with specialized high-performance infrastructure, tolerance for novel supply chains, and mission
              needs that cannot be fully served by terrestrial alternatives.

              AI hyperscalers (AWS, Azure, GCP, Oracle) represent the largest theoretical market but face the highest
              adoption uncertainty. Latency-sensitive consumer and enterprise workloads are structurally unsuitable for
              orbital compute due to round-trip propagation delays, narrowing the viable use case to batch AI training
              jobs and non-latency-critical inference. Microsoft's Azure Orbital product line and Planetary Computer
              platform show hyperscaler investment in space infrastructure more broadly, but neither confirms interest
              in renting orbital compute from a third party like Cowboy Space. OpenAI's Stargate program, committing up
              to $500 billion to terrestrial AI infrastructure, suggests at least some hyperscaler demand will be
              absorbed by ground-based capacity expansion before orbital alternatives come online. Defense and
              intelligence buyers present a more near-term conversion path: SAIC's strategic investment is the clearest
              signal in the public record, and the prior DoD OECIF grant to Aetherflux establishes a government-side
              familiarity with Cowboy's predecessor technology.
