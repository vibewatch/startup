            body: >-
              The 2028 first launch requires completing propulsion R&D, engine testing, manufacturing facility buildout,
              and launch site licensing — simultaneously with satellite design, NVIDIA hardware integration, and FCC
              license prosecution. TechCrunch confirmed the company is "still working through key development needs,
              like facilities to test, manufacture, and launch its rockets" as of May 2026. No comparable startup has
              compressed this timeline below five to seven years from inception.
