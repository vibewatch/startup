      - number: '7.4'
        title: Orbital debris, collision, and astronomy risk
        blocks:
          - type: paragraph
            body: >-
              A 20,000-satellite plan would land in an orbital environment that is already becoming more crowded and
              operationally brittle. ESA's 2025 space environment report says not enough satellites leave heavily
              congested orbits at end of life, creating collision risk, and that 2024 saw several major fragmentation
              events that added thousands of new debris objects. NASA's Orbital Debris Program Office maintains
              dedicated tools such as ORDEM and LEGEND precisely because debris risk is not theoretical; it is an
              engineering, operations, and safety problem that must be modeled and managed. Cowboy's proposed scale
              amplifies that burden. Each satellite is heavy, each must maneuver safely, and each ultimately needs
              disposal under the FCC's five-year benchmark. That means Cowboy would eventually inherit a standing
              conjunction-management and end-of-life queue problem, not a one-time cleanup task. Astronomy adds another
              externality. The AAS warns that even a fraction of the more than one million filed satellite applications
              could substantially harm optical, infrared, and radio observations while worsening orbital sustainability.
              SATCON1 and the JASON/NSF constellation report both reinforce that these impacts are serious enough to
              warrant dedicated mitigation work. Even if Cowboy is smaller than some competitor filings, it still adds
              materially to the cumulative burden faced by observatories and the orbital commons.
            claimRefs:
