chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Cowboy Space Corporation is an orbital infrastructure company incorporated in San Carlos, California. It
              was founded in 2024 by Baiju Bhatt under the name Aetherflux, with an original thesis of beaming solar
              power from low Earth orbit to terrestrial receivers via infrared lasers. In May 2026, coinciding with its
              $275 million Series B close, the company rebranded to Cowboy Space Corporation and pivoted its primary
              business toward orbital AI data centers and vertically integrated launch vehicles, while retaining
              space-based solar power as a core architectural building block rather than the end product. The company's
              website describes its mission as "powering humanity from the high frontier"—building what it frames as a
              power grid in outer space for artificial intelligence.

              The central business model is vertically integrated orbital infrastructure: Cowboy Space designs and
              builds its own rockets, satellite upper stages, and on-orbit compute payloads as one unified system. The
              rocket's upper stage is not discarded after delivering a payload; instead, the upper stage IS the
              satellite-data-center payload. Once in orbit, each unit generates 1 megawatt of solar power in dawn-dusk
              sun-synchronous orbit and runs approximately 800 GPUs using NVIDIA Space-1 Vera Rubin Modules. This design
              eliminates redundant structure and mass versus traditional architectures that treat rocket and satellite
              as separate systems. Revenue will come from selling orbital AI compute capacity to hyperscalers and
              enterprises priced against the terrestrial alternative, which faces multi-year grid interconnection
              queues. The company is pre-revenue as of the run date.

              Cowboy Space frames its market opportunity around a concrete terrestrial bottleneck: average grid
              connection lead times for new data centers run five to seven years or more in major US markets, while AI
              compute demand is growing far faster. By placing compute next to continuous LEO solar power and using
              natural vacuum cooling, Cowboy argues it can bypass both the power and cooling constraints that are
              limiting terrestrial expansion. The company's "Stampede" constellation, for which it filed an FCC
              application in May 2026, envisions up to 20,000 satellites providing data center services.
