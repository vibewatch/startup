      - number: '6.4'
        title: Deployment Blockers, Switching Costs, and Customer Demand Skepticism
        blocks:
          - type: paragraph
            body: >
              The most coherent skeptical case against Cowboy Space's customer thesis is not that orbital compute is
              technically impossible, but that terrestrial alternatives are expanding fast enough to close the
              addressable customer gap before Cowboy reaches first launch. OpenAI's Stargate program represents a $500
              billion commitment to terrestrial AI infrastructure. Hyperscalers are pursuing nuclear power agreements,
              co-location with energy assets, and improved cooling technologies that together reduce the energy-scarcity
              argument for orbital alternatives. The Ars Technica analysis of the AI power crisis framing explicitly
              raised the question of whether orbital data centers could be economically competitive by the time they are
              deployable.

              Deployment blockers are compounded by a chicken-and-egg demand problem: enterprise customers are unlikely
              to commit to orbital compute before the technology is demonstrated at scale, yet demonstrating technology
              at scale requires capital that is difficult to raise without customer commitments. This is a structural
              pre-commercial risk that Cowboy has navigated on the equity side through SAIC's strategic investment, but
              has not resolved on the commercial demand side. The Next Platform's technical analysis noted that orbital
              data centers face physics constraints on heat dissipation in vacuum — one megawatt of thermal load — that
              are engineering challenges Cowboy's own FCC filing acknowledges remain unfinished.

              For customers who do eventually adopt Cowboy Space's platform, switching costs would be substantial.
              Workloads optimized for orbital processing — leveraging continuous solar power, radiative cooling, and
              near-zero latency to co-located satellites — would require significant re-engineering to migrate to
              terrestrial alternatives. This is a long-term moat, but it only materializes after customers have
              committed and deployed, creating a high barrier to initial adoption rather than a retention advantage.
