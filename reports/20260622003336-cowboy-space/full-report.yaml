  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Financing History and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              Cowboy Space Corporation has completed three distinct financing rounds since its founding as Aetherflux in
              late 2024, culminating in a $275 million Series B closed in May 2026 at a $2 billion post-money valuation.
              CEO Baiju Bhatt confirmed total capital of approximately $365 million as of the Series B close, implying a
              seed and bridge tranche of roughly $40 million raised at inception alongside Breakthrough Energy Ventures,
              Andreessen Horowitz, NEA, and angel investors. The $50 million Series A (April 2025), led by Index
              Ventures and Interlagos, funded the company's space-based solar power phase under the Aetherflux brand.
              The Series B, co-led by Index Ventures with participation from IVP, Blossom Capital, SAIC, and all major
              existing investors, financed the pivot to orbital data centers and a proprietary launch vehicle. Fenwick
              and West LLP confirmed it represented Cowboy Space in the Series B, providing independent legal
              corroboration. SAIC's participation as a new strategic investor is notable: SAIC is one of the largest US
              defense IT contractors, and its check signals potential future procurement interest in orbital compute for
              government and military applications. The company also secured a pre-Series B contract from the US
              Department of Defense Operational Energy Capability Improvement Fund (OECIF) for a proof-of-concept
              wireless power transmission demonstration — the only publicly confirmed government revenue signal. Prior
              government contracts and grants remain unquantified in public disclosures, leaving the true extent of
              non-venture revenue unclear. The capital table is entirely equity-financed; no debt, convertible notes, or
              project-finance facilities have been publicly disclosed.
