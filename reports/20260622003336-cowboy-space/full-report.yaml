              broader adoption. Planet Labs' role as both a Google Project Suncatcher partner and an NVIDIA space
              computing partner positions it as a technically credible early adopter analog — though no specific
              engagement with Cowboy has been disclosed. Data sovereignty customers (sovereign nations, financial
              entities, government agencies requiring off-Earth storage) represent a longer-term expansion segment with
