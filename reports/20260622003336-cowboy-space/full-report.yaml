      - number: '5.5'
        title: Roadmap and Development Milestones
        blocks:
          - type: paragraph
            body: >-
              Cowboy Space has published a three-step roadmap with progressively larger vehicles and compute densities.
              The first milestone is a small satellite built with Apex Space in 2026 (later this year from the June 2026
              run date) to demonstrate wireless power beaming from LEO to a ground receiver using infrared lasers. Bhatt
              described this as "a subscale technology demonstrator" sized to prove the physics and validate the
              approach, explicitly noting that "it's a building block, but the long-term business focus is on using that
              power in orbit for AI compute, not just beaming it to Earth." Cowboy Space was still finalizing
              specifications for this mission as of the May 2026 Series B announcement, implying limited design maturity
              for a mission planned to launch within the same calendar year. The second milestone, targeted for early
              2027, is the first "Galactic Brain" orbital data center node using NVIDIA Space-1 Vera Rubin modules —
              described as the first demonstration of orbital AI compute powered by solar energy. Whether this is a
              dedicated Apex-built satellite or a different vehicle is not publicly specified. The third milestone is
              the first launch of Cowboy Space's proprietary rocket carrying a full 1-megawatt data center, targeted for
              before the end of 2028. This is the most technically ambitious milestone: it requires completing
              propulsion development, rocket engine testing, manufacturing facility setup, launch site selection and
              licensing, and first-stage integration — all of which are at pre-hardware stages as of June 2026. The
              rocket development is led by Warren Lamont (former Blue Origin propulsion engineer) and Tyler Grinnell
              (former SpaceX director of launch operations), with satellite engineering in Seattle led by David Larson
              (SpaceX and Amazon veteran). Cowboy has advertised 18 open positions across avionics, mechanical
              engineering, spacecraft design, and software as of the GeekWire report, and targets 40–60 employees in its
              Seattle satellite engineering center. A fourth phase — progressive constellation build-out toward 20,000
              satellites — is described in the FCC filing but carries no specific launch dates or per-year cadence
              commitments. The company has stated it will begin commercial services once performance, reliability, and
              economics are validated at scale, with constellation size driven by market economics rather than
              regulatory milestones. The gap between the 2028 first launch and a commercially meaningful constellation
              of hundreds to thousands of satellites implies a mid-2030s timeline for material revenue from Stampede —
              consistent with other orbital data center ventures targeting the same window.
