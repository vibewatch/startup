          insufficient
        - Company CTO / engineering team; third-party test report or witness test preferred
      - - Customer pipeline and LOIs
        - Named customers, letters of intent, or memoranda with disclosed commercial terms or pricing signals
        - >-
          Validates demand thesis beyond government pilot interest; SAIC investment is strategic, not yet
          revenue-generating
        - Company CEO / BD team; customer reference calls if LOIs cannot be disclosed
      - - FCC approval timeline and regulatory risk assessment
        - Expected FCC ruling timeline for Stampede constellation; legal analysis of debris-mitigation waiver likelihood
        - >-
          FCC authorization is on the critical path to constellation deployment; uncertainty here is material to base
