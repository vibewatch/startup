              the company does not expect to be revenue-generating before its first proprietary rocket launch, targeted
              before the end of 2028. This is the defining customer-risk posture of the report: a $2 billion valuation
              with zero commercial validation.

              The closest named demand proxy is SAIC. SAIC participated in the Series B as a new strategic investor
              alongside IVP and Blossom Capital. Washington Technology — which covers government contractor investment
              activity — specifically flagged SAIC as the key GovCon investor name to watch. SAIC's strategic rationale
