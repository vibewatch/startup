        title: Exhibits
        blocks:
          - type: callout
            title: Thermal Rejection Is the Physics Gate
            body: >-
              Dissipating 1 MW of compute waste heat in vacuum via radiation only has no published hardware precedent at
              this scale in a commercial satellite. The stage-as-radiator approach is logical but undemonstrated. If the
              thermal architecture fails validation, the 1 MW compute specification cannot be met at the satellite mass
              and form factor described — forcing either a lower compute density or a fundamentally different thermal
              design.
            calloutType: risk
