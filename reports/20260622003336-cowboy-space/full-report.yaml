              fleet. Management itself still frames commercial services as downstream of validating performance,
              reliability, and economics at scale. That means revenue does not arrive before proof; proof must be
              financed first. The commercial side is also narrower than the headline orbital-data-center framing
              suggests. NewSpaceEconomy explicitly describes early orbital customers as edge-processing, defense,
              Earth-observation, or other specialized users whose workloads can tolerate space-to-ground latency.
              NVIDIA's own space-computing page emphasizes minimal downlink latency and edge ground-station processing
              rather than a direct like-for-like replacement of terrestrial hyperscale clusters. Gartner's view is
              harsher: orbital data centers will not serve terrestrial needs for decades, if ever. Breaking Defense adds
              that Pentagon and intelligence buyers are still waiting to see whether capability and business case can be
