  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Anti-Thesis, and Analytical Framework
        blocks:
          - type: paragraph
            body: >
              Cowboy Space sits at the intersection of two macro forces: the AI compute capacity crisis and the
              structural argument that orbital infrastructure offers constraint relief that terrestrial alternatives
              cannot quickly replicate. The investment thesis hinges on three layered bets — (1) that AI compute demand
              continues to outpace terrestrial deployment, (2) that orbital data centers are physically and economically
              viable at production scale, and (3) that Cowboy's vertically integrated rocket-plus-compute architecture
              captures enough of that market to justify a sub-$2 billion entry price. All three bets remain unproven as
              of June 2026.

              The anti-thesis is equally substantial. The company is pre-revenue with no disclosed customer pipeline.
              The thermal-rejection problem for a 1 MW orbital data center has not been publicly validated at production
              scale. The rocket program is early-stage; comparable programs at Relativity Space and ABL Space Systems
              consumed $100M–$650M+ before their first operational milestones, and several failed to reach them.
              Gartner, cited by The Register in February 2026, called orbital data centers a "pie in the sky" idea, and
              a separate April 2026 Register report cited an orbital data center startup that admitted launch economics
              "don't fly." SpaceX's January 2026 FCC filing for up to 1 million orbital data center satellites
              constitutes an existential competitive threat.

              Given these asymmetries, standard DCF and revenue-multiple frameworks cannot be applied — there is no
              revenue, no ARR, no financial model in the public domain. The appropriate analytical lens is
              scenario-based option valuation: what is the implied price of the embedded call option on ODC market
              existence and Cowboy execution, and does that option price match what a disciplined investor should pay?
              The recommendation summary and thesis/anti-thesis tables below capture this framing directly.
