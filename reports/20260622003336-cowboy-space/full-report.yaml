      - number: '4.4'
        title: Unit Economics and Runway Scenarios
        blocks:
          - type: paragraph
            body: >-
              No unit-economics data — gross margin, CAC, payback period, net revenue retention, or per-satellite
              contribution margin — have been publicly disclosed by Cowboy Space. All estimates in this chapter are
              inferred from comparable companies and publicly available hardware cost benchmarks, and must be verified
              through direct financial diligence. Headcount-based burn modeling provides the primary near-term financial
              lens: with 40–60 planned employees by end-2026 in an aerospace context (hardware engineers, rocket
              scientists, regulatory counsel, software teams), fully-loaded compensation costs of $250K–$350K per head
              imply approximately $1.0–$1.75 million per month in salary burden alone. Adding facility costs, cloud
              compute for simulations, procurement of test hardware, and regulatory/legal spend, a plausible monthly
              operating burn range is $3–$8 million at current team size, escalating toward $8–$15 million as
              development programs ramp. Against the $275 million Series B, a midpoint $5 million per month burn yields
              approximately 55 months (4.6 years) of runway without capex peaks; at $10 million per month (heavy
              development phase), runway contracts to approximately 27 months. These scenarios assume no additional
              revenue or capital inflows. The implied Series A to Series B valuation step-up is substantial: assuming a
              $150–200 million post-money Series A (consistent with Index Ventures leading a $50M round at typical
              ownership targets), the $2 billion Series B represents a roughly 10–13x step-up in approximately 12 months
              — aggressive even in the AI space investment climate of 2025–2026 and consistent with thesis-stage rather
              than traction-stage pricing. SAIC's investment as a strategic industrial partner, not just a financial
