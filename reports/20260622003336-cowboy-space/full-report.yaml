  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Thermal / cooling qualification failure
        - >-
          1 MW orbital data center fails to demonstrate thermal-vacuum qualification at production-representative
          conditions
        - Core product premise invalidated; cannot proceed to commercial ODC deployment
        - Exit or restructure; thesis requires physical product to exist
      - - Rocket program slippage >24 months beyond plan
        - Proprietary rocket first flight pushed past 2030 without a credible interim launch-as-a-service bridge
        - >-
          Vertical integration thesis fails; launch dependency costs accrue; capital runway consumed faster than
          milestones justify
        - Reassess with updated bridge-launch economics; consider secondary exit if available
      - - FCC denial or material restriction of Stampede constellation
        - >-
          FCC refuses to authorize 20,000-satellite Stampede or conditions approval on uneconomic debris-mitigation
          requirements
        - Core market-access premise invalidated for at-scale ODC deployment
        - Evaluate regulatory path and timeline; may restructure around government-only constellation
      - - Down-round at Series C
        - Series C priced below $2B post-money, representing a mark-down from current entry price
        - Investor confidence in milestone trajectory lost; future dilution worsens
        - Evaluate thesis continuity; assess whether milestone slip is recoverable within reasonable capital
      - - SpaceX ODC at commercial terms before Cowboy first revenue
        - >-
          SpaceX deploys orbital data center infrastructure available to commercial customers before Cowboy's first
          customer contract
        - Addressable market effectively captured by a better-capitalized, launch-integrated competitor
        - Exit; SpaceX competitive displacement is structurally non-recoverable for Cowboy at this stage
      - - Departure of key propulsion / thermal engineering leads
        - Lead propulsion or thermal-management engineers depart without named successors within 60 days
        - Execution risk on the two highest-uncertainty technical layers increases materially
        - Request management briefing; assess pipeline and retention plan before next capital deployment
