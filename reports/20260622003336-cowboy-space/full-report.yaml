        - >-
          Quantified unit economics for a production-scale 1 MW ODC: launch cost, hardware cost, power generation cost,
          vs. terrestrial competitive TCO
        - >-
          Validates whether ODC achieves commercial cost-competitiveness under Starship or interim launch economics;
