      - number: '4.5'
        title: Financial Diligence Gaps and Verdict
        blocks:
          - type: paragraph
            body: >-
              The financial case for Cowboy Space cannot be underwritten from public information alone. Five structural
              gaps define the diligence agenda: (1) no disclosed revenue, ARR, backlog, or LOIs mean there is no
              demonstrated willingness-to-pay evidence; (2) the Series B use-of-funds is described at a high level but
              not broken down by program, making independent capex tracking impossible; (3) no independent financial
              audit, S-1, SPAC prospectus, or regulatory financial statement has been filed, so all financial claims
              rest on company statements and media coverage; (4) the DoD OECIF contract and SAIC investment imply
              government revenue pathways, but neither the dollar amounts nor procurement timelines are disclosed; (5)
              no capital recycling or project-finance strategy for constellation scale-up has been publicly articulated.
              Collectively, these gaps mean an investor cannot independently verify the burn rate, gross margin path,
              unit economics, or total capital requirement for commercial launch. The verdict on revenue quality is N/A
              — there is no revenue to quality-assess. The capital intensity verdict is extreme by any benchmark: $275
              million is a credible amount to build a prototype rocket and a handful of demonstration satellites, but is
              orders of magnitude below what full constellation deployment requires. The financial diligence blockers
              are not unusual for a deep-tech seed-to-Series-B company, but they are material and should inform
              valuation discipline. ArsTechnica's skeptical analysis of orbital data center economics — noting unproven
              cooling physics at scale — provides the key adverse signal that the thesis-stage valuation may not survive
