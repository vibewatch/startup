      - number: '3.5'
        title: Adverse Evidence and Competitive Risk Assessment
        blocks:
          - type: paragraph
            body: >
              Multiple adverse competitive signals deserve weight in any diligence assessment of Cowboy Space. First,
              the only commercial cloud operator that has publicly committed to an orbital compute partnership—Crusoe
              Energy—chose Starcloud, not Cowboy, for its first space deployment. This does not preclude future Cowboy
              partnerships, but it is a leading indicator of which platform the market's early commercial customers are
              validating.

              Second, Cowboy's combination of rocket development, spacecraft design, thermal management, optical
              communications, and customer acquisition simultaneously mirrors the execution profile of companies that
              have historically run over budget and behind schedule. TechCrunch's editorial characterization—"also
              nuts"—was colorful but captures a real risk: only SpaceX, Rocket Lab, and Arianespace are consistently
              launching commercial rockets in the West, and each took a decade or more to reach operational cadence.
              Stoke Space, Firefly Aerospace, and Relativity Space have worked for years without delivering operational
              systems as of the report date.

              Third, the Stargate buildout and similar terrestrial hyperscale programs funded by SoftBank, OpenAI,
              Microsoft, and Oracle directly address the power-and-land bottleneck that is Cowboy's core value
              proposition. If the terrestrial power problem is solved through nuclear, distributed grid agreements, or
              new data center regions in power-abundant geographies over the 2026–2032 window, the orbital compute case
              depends on edge-latency and data-sovereignty arguments that are narrower, lower-revenue, and harder to
              sell.

              Fourth, the competitive landscape in space-based computing is converging on NVIDIA hardware as a common
              platform. NVIDIA's announcement of Space-1 Vera Rubin modules for LEO simultaneously validated the market
              and commoditized the hardware differentiator. If every serious ODC player uses the same NVIDIA GPUs,
              competition will shift to launch cost, thermal efficiency, orbit selection, network topology, and
              software—areas where Cowboy has the most unproven claims.

              Fifth, the SpaceBelt case (Cloud Constellation Corporation) illustrates a cautionary precedent: a
              specialist orbital data storage company with a credible consortium of partners (IBM, SSTL, MindCraft,
              various banking sector) has operated since at least 2020 without reaching commercial scale. Orbital data
              infrastructure has consistently taken longer and cost more than initial projections across multiple
              attempts.
