      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: No DCF or Revenue Multiple Is Applicable
            body: >
              Cowboy Space is pre-revenue with no disclosed ARR, backlog, financial model, or unit economics as of June
              2026. Standard DCF, revenue multiple, and EBITDA multiple frameworks cannot be applied. This chapter uses
              scenario-based option-value framing anchored on comparable private round prices and public AI
              infrastructure multiples as benchmarks — not as direct valuation inputs. Any precise figure implied by
              this analysis should be read as a range estimate with wide error bounds, not as a point estimate.
            calloutType: assumption
            claimRefs:
              - CV006
              - CV007
              - CV020
          - type: callout
            title: Down-Round Risk Is Elevated Under Milestone Slippage
            body: >
              The Finro Q1 2026 AI valuation analysis and the BlackNight Space Labs ODC race analysis both warn that the
              private AI infrastructure market is repricing "growth now, business model later" narratives sharply. If
              Cowboy's 2026–2028 milestones slip materially, the risk of a down-round at the Series C is real. A
              down-round would crystallize losses for current investors, worsen employee equity dilution, and signal to
              the market that the thesis has not validated — compounding the capital-raise challenge at a point when the
              company would need maximum capital to fund rocket development. This is the defining financial risk of the
              current entry price.
            calloutType: risk
            claimRefs:
              - CV032
