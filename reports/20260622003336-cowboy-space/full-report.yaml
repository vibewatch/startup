      - number: '2.4'
        title: Growth Drivers and Timing
        blocks:
          - type: paragraph
            body: >-
              The strongest growth driver is the documented terrestrial grid interconnection backlog. Construct Capital
              and the Cowboy Space FCC filing both assert that AI data center demand is outpacing grid capacity in major
              markets, creating a multi-year window in which alternatives—including orbital—are structurally advantaged.
              Goldman Sachs projects US data centers to use 8% of US power by 2030 and AI to represent 19% of data
              center power demand by 2028, amplifying the urgency. The EIA's monthly tracking confirms aggregate US
              electricity demand has grown 4.5% year-on-year through March 2026, a rate consistent with the data center
              buildout narrative.


              A secondary driver is launch cost deflation. Reusable launch vehicles have reduced the cost per kilogram
              to LEO substantially since 2010, and Cowboy Space's integrated upper-stage architecture is designed to
              compress launch cost further by eliminating the boundary between rocket and payload. The company's
              architecture—an upper stage that becomes the data center—is premised on continued commercial launch
              competition. A third driver is the NVIDIA partnership: the Space-1 Vera Rubin module is NVIDIA's
              purpose-built LEO AI accelerator, announced at GTC in March 2026, and Cowboy's first-mover partnership
              with NVIDIA signals hardware ecosystem readiness.


              Timing is uncertain. The first Stampede launch is targeted for 2028, and the satellite design is
              explicitly unfinished per Cowboy's own FCC filing. The power-grid bottleneck is real but not permanent:
              utilities are investing, and terrestrial operators are co-locating data centers with renewable generation,
              using liquid cooling, and pursuing nuclear power purchase agreements. The competitive window may be
              narrower than the current queue implies.
