      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Vertical Integration as Moat
            body: >-
              Owning the launch vehicle, the satellite upper stage, and the orbital compute platform as a single
              integrated system is Cowboy Space's primary competitive differentiator. By designing the rocket and data
              center together from day one, the company eliminates redundant mass that degrades compute-per-dollar in
              other architectures, and removes dependence on third-party launch capacity that is projected to remain
              scarce for the foreseeable future. If executed, this integration could create durable unit economics
              advantages over orbital data center competitors relying on SpaceX Starship.
            calloutType: strength
            claimRefs:
              - CO033
              - CO004
              - CO038
          - type: callout
            title: Material Technical and Execution Risks
            body: >-
              SatNews and TechCrunch independently flagged two structural challenges the company has not yet publicly
              resolved: (1) dissipating one megawatt of thermal load in vacuum without active cooling infrastructure is
              a non-trivial engineering problem the FCC filing acknowledges is unfinished, and (2) a 20,000-satellite
              shell at 700-1,000 km altitude creates a debris liability that optical-only architecture mitigates but
              does not eliminate. Compounding these is the challenge of independently developing a new rocket engine and
              launch vehicle—an endeavor that has taken well-funded Western companies many years. Only a handful of
              private companies in the West consistently launch commercial rockets, and Cowboy is adding this vertical
              from a standing start.
            calloutType: risk
            claimRefs:
              - CO037
              - CO038
              - CO039
          - type: callout
            title: SAIC Investment Signals Defense Applications
            body: >-
              SAIC's participation as a new investor in the Series B, combined with the DoD OECIF grant awarded during
              the Series A, suggests Cowboy Space is positioning orbital compute and space-solar power delivery as a
              defense capability. SAIC's government contracting relationships could provide access to DoD procurement
              channels for resilient, grid-independent compute infrastructure in contested environments—a market segment
              that could generate near-term revenue before broader commercial hyperscaler adoption.
            calloutType: insight
            claimRefs:
