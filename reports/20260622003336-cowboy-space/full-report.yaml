      - number: '1.2'
        title: Founding History and Strategic Pivot from Aetherflux
        blocks:
          - type: paragraph
            body: >-
              Baiju Bhatt began building what would become Cowboy Space in late 2023 or early 2024, formally
              incorporating as Aetherflux in March 2024 in San Carlos, California, and self-funding the seed phase with
              approximately $10 million of his own capital. Bhatt had departed Robinhood Markets in early 2024 after
              serving as co-CEO through 2020 and then Chief Creative Officer; he retained a roughly 6% stake in
              Robinhood, providing a substantial personal balance sheet to underwrite early development. His father's
              career at NASA Langley Air Force Base and his own Stanford physics and mathematics degrees informed a
              lifelong interest in space commercialization.

              Aetherflux emerged from stealth in October 2024 with a small-satellite SBSP thesis: a constellation of LEO
              satellites equipped with solar arrays and near-optical infrared lasers would accumulate solar energy at
              scale and beam it to compact terrestrial receivers. The company described this approach as meaningfully
              different from earlier geostationary megastructure concepts—smaller, more modular, and iterable. In April
              2025, Aetherflux raised a $50 million Series A led by Index Ventures, bringing total capital to
              approximately $60 million, and concurrently won government backing through the US Department of Defense's
              Operational Energy Capability Improvement Fund for a proof-of-concept wireless power transmission system.
              The team also demonstrated power transmission in the laboratory during 2025.

              The pivot that produced Cowboy Space emerged from a brutal economic constraint: Bhatt told TechCrunch he
              spoke to multiple launch providers and could not find enough capacity to scale an orbital data center
              business at competitive unit economics. The company decided to add an in-house rocket program, treating
              launch as a vertical integration layer rather than a third-party cost. The original space-solar thesis was
              preserved but reframed—rather than beaming power to Earth, Cowboy would use it to run orbital compute in
              situ. The rebrand, new name, and $275 million Series B were announced together on May 11, 2026, marking
              the public debut of the combined orbital data center and launch vehicle strategy.
