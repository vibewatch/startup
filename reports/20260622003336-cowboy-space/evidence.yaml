    whyItMatters: >-
      If 1 MW radiative cooling is not achievable within the proposed satellite mass budget, the Stampede constellation
      design is not viable. This is the primary technical risk SatNews identifies.
    diligencePath: >-
      Review SBIR/STTR awards in high-power satellite thermal management; ask Cowboy Space for a thermal design review
