evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Company revenue, ARR, and any existing customer contracts or letters of intent
    whyItMatters: >-
      Pre-revenue status means valuation is entirely based on expected future cash flows; any early revenue signals
      would materially change risk assessment
    diligencePath: >-
      Request full financial model, data room access, and any signed commercial agreements or letters of intent from
      prospective hyperscaler customers
    relatedQuestionRefs:
      - QO005
  - type: private-evidence-only
    severity: material
    topic: burn-rate
    missingEvidence: Monthly burn rate, cash runway, and capital allocation plan for $275M Series B proceeds
    whyItMatters: >-
      Without burn rate, it is impossible to assess whether the Series B provides adequate runway to the 2028 rocket
      launch milestone; hardware programs routinely exceed budget
    diligencePath: >-
      Request audited financials, CFO presentation on capital plan, and sensitivity analysis on milestone slippage
      scenarios
    relatedQuestionRefs:
      - QO025
  - type: private-evidence-only
    severity: minor
    topic: headcount
    missingEvidence: Total company headcount across all offices as of June 2026; breakdown by function
    whyItMatters: >-
