summary:
  headline: Cowboy Space 拿到 Tier-1 投资人、创始人履历可信，也踩中真实的结构性市场驱动；但 $2B 入场估值仍完全停在论证阶段：公司尚未产生收入，火箭还没造出来，1 MW 轨道数据中心的核心热物理也没有公开验证。
