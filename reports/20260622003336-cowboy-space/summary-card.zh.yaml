  topStrengths:
    - >-
      Tier-1 投资人组合（Index Ventures 领投 A、B 轮，a16z、Breakthrough Energy Ventures、SAIC 参投）加上 Baiju Bhatt 在 Robinhood
      量级的执行履历，让这笔无收入深科技押注拥有异常强的融资通道和叙事可信度。
    - NVIDIA Space-1 Vera Rubin 发射合作伙伴身份验证了轨道 AI 计算硬件逻辑，也给 Cowboy 一块多数竞争对手拿不到的专用 GPU 模块。
    - 地面 AI 计算瓶颈（电网互连排队 5–7 年、Goldman Sachs 预测数据中心用电到 2030 年增长 160%）为轨道电力与计算创造了真实结构性需求，前提是单位经济性能跑通。
    - 发射与计算纵向整合在架构上很特别：Cowboy 把上面级和卫星合并，减少冗余结构质量，也在规模化后摆脱外部发射商依赖。
  topRisks:
    - 公司完全处于无收入阶段，没有披露客户合同、LOI 或商业试点；相比地面方案实现价格平价时，客户付费意愿和单位经济性仍未验证。
    - 真空中排出 1 MW GPU 计算废热，是最核心的未解工程难题；ArsTechnica 估算每颗卫星约需 200 m² 散热器面积，公开资料没有任何鉴定或测试数据。
    - 一边自研 Falcon-9 级火箭，一边做轨道数据中心，对资本和执行要求极端；可比项目（Relativity Space、ABL Space Systems）在首个运营里程碑前消耗 $100M–$650M，且多家彻底失败。
    - SpaceX 2026 年 1 月向 FCC 申请最多 1 million 颗轨道数据中心卫星，带来生存级竞争威胁；只有它具备足够发射节奏和 Starship 载荷能力，能以成本有效方式部署 20–25 tonne 卫星。
  unresolvedGaps:
    - 没有收入、ARR、积压订单、LOI 或具名客户；所有商业需求信号都停留在行业层面的 thesis，而非公司自身证据。
    - 公开记录缺少 700–1,000 km 轨道带的热真空鉴定数据和抗辐射方案。
    - 火箭发动机设计、推进测试结果、制造设施和 FAA 发射许可路径均未公开披露。
    - 完整股权结构表、优先股堆叠、Series B 清算条款，以及任何老股或债务组成均未公开。
