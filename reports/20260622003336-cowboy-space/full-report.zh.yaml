  - id: FI001
    title: 收入模型桥——从客户活动到毛利润
    type: flow
    layout: standard
    summary: 展示潜在客户需求到实际轨道算力收入之间的连续关口，指出出现任何毛利时点前必须跨过的四个关键依赖。
    data:
      nodes:
        - id: customer_need
          label: 客户算力需求
          description: AI 实验室、国防机构、地球观测运营商无法接入地面电网，或寻求天然低延迟的轨道算力
        - id: satellite_availability
          label: 在轨运行卫星
          description: Stampede 星座需要火箭研发（2028+）、卫星制造、发射节奏和 FCC 频谱授权
        - id: access_window
          label: LEO 接入窗口
          description: 轨道力学限制地面接触窗口；与始终在线的地面算力相比，间歇性是关键单位经济风险
        - id: compute_provisioning
          label: 算力任务调度
          description: GPU 工作负载在过境期间运行，需要调度、编排和数据路由；公司尚未公开演示软件栈
        - id: revenue_event
          label: 收入确认事件
          description: 按每 GPU 小时或每 kWh 收费，在任务完成时确认；公司尚未发布定价模型
        - id: gross_profit
          label: 毛利润
          description: 收入扣除摊销后的卫星资本开支、发射成本、NVIDIA Space-1 模块采购和轨道运营费用；所有输入均为估算，均未确认
