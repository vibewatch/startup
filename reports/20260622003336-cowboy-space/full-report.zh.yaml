      - number: '4.3'
        title: 成本结构与资本强度
        blocks:
          - type: paragraph
            body: >-
              Cowboy Space 的成本结构即便放在资本密集的航空航天行业里也不寻常：它必须同时资助火箭推进研发、卫星平台开发、航天级 GPU 计算集成、20,000 颗卫星星座的 FCC
              监管合规，以及同时服务火箭和卫星的西雅图实体制造中心。单独任何一项，都是多年期、数亿美元级项目。Relativity Space、ABL Space Systems 和 Stoke Space
              等可比中小型运载火箭项目，在达到首次运营里程碑前消耗了 $100M–$650M，其中数家公司根本没有达到。NVIDIA 的 Space-1 Vera Rubin LEO 优化 GPU
              模块可能是硬件基石，按每颗卫星低于 1 MW 的电力预算和抗辐射运行设计，但其航天级采购成本估计为地面超大规模等价产品的三到十倍——仅 GPU 基础设施就可能达到每颗卫星
              $750K–$3M。ArsTechnica 对轨道数据中心物理的分析指出，在真空中为 1 MW 计算载荷做辐射冷却，需要约 200 平方米散热器表面；这是一项尚未在生产规模验证的工程约束。若完整部署 20,000
              颗卫星星座，并按制造和发射成本每颗约 $5M 估算，总资本开支约需 $100B——大约是当前已融资额的 50 倍。因此，公司近期资本计划只能是分阶段楔入：用 $275M Series B
              做出可信的火箭加卫星概念验证，再用已展示的能力撬开项目融资、主权资本或后续股权轮，支撑星座扩张。公开信息没有确认这套分阶段融资策略；它是从当前资本与既定野心之间的规模错配推断出来的。
