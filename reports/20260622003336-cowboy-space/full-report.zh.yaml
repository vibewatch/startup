      - number: '5.5'
        title: 路线图与开发里程碑
        blocks:
          - type: paragraph
            body: >-
              Cowboy Space 发布了一条三步路线图，车辆规模和计算密度逐步提高。第一个里程碑是 2026 年（按 2026 年 6 月运行日期，即今年晚些时候）与 Apex Space 建造一颗小卫星，用红外激光从
              LEO 向地面接收器演示无线能量传输。Bhatt 将其称为「亚尺度技术演示器」，用来证明物理学并验证方案，同时明确指出「这是一个构件，但长期业务重点是在轨道上把那部分电力用于 AI
              计算，而不只是把电力传回地球」。截至 2026 年 5 月 Series B 公告，Cowboy Space 仍在敲定该任务规格，意味着一个计划同年发射的任务设计成熟度有限。第二个里程碑目标在 2027
              年初，是首个使用 NVIDIA Space-1 Vera Rubin 模块的「Galactic Brain」轨道数据中心节点——被描述为太阳能供电轨道 AI 计算的首次演示。公开信息没有说明它是 Apex
              建造的专用卫星，还是另一种飞行器。第三个里程碑是在 2028 年底前首次发射 Cowboy Space 自有火箭，搭载完整 1 MW
              数据中心。这是技术上最激进的里程碑：它要求完成推进开发、火箭发动机测试、制造设施建设、发射场选择和许可、一级集成——截至 2026 年 6 月，这些全部处于硬件前阶段。火箭开发由 Warren Lamont（前
              Blue Origin 推进工程师）和 Tyler Grinnell（前 SpaceX 发射运营总监）领导，西雅图卫星工程由 David Larson（SpaceX 和 Amazon 老兵）负责。GeekWire
              报道时，Cowboy 发布了 18 个开放岗位，覆盖航电、机械工程、航天器设计和软件，并计划在西雅图卫星工程中心达到 40–60 名员工。第四阶段——逐步建设至 20,000 颗卫星星座——在 FCC
              申报中有所描述，但没有具体发射日期或年度节奏承诺。公司表示，一旦规模化验证性能、可靠性和经济性，就会启动商业服务；星座规模由市场经济性而非监管里程碑驱动。从 2028
              年首次发射到数百乃至数千颗卫星的商业有效星座，中间的差距意味着 Stampede 产生实质收入可能要到 2030 年代中期——这与其他瞄准同一窗口的轨道数据中心项目一致。
            claimRefs:
