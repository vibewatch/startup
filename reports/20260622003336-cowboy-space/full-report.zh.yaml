              - CE021
          - type: callout
            title: 火箭开发仍处硬件前阶段，且与所有其他时间线并行
            body: >-
              2028 年首次发射要求完成推进研发、发动机测试、制造设施建设和发射场许可，同时还要推进卫星设计、NVIDIA 硬件集成和 FCC 许可审理。TechCrunch 确认，截至 2026 年 5
              月，公司仍「在解决关键开发需求，比如测试、制造和发射火箭的设施」。没有可比初创公司把从创立到发射的时间压缩到五到七年以下。
