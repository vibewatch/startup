      - number: '7.2'
        title: 发射与制造风险
        blocks:
          - type: paragraph
            body: >-
              第二层风险是火箭规模的执行。Cowboy 不只是采购发射服务；由于每颗数据中心卫星本身也是运载火箭上面级，公司试图自建火箭项目。TechCrunch 称 Bhatt 预计首次自研发射会在 2028
              年底前完成；SpaceNews 则称混合飞行器将大于 Falcon 9、小于 Starship，目标载荷能力为 20,000-25,000
              公斤。这不是一个温和的硬件项目。它意味着发动机、结构、航电、制导、鉴定、级段集成和复用假设必须一起推进。除 FCC 申请外，FAA
              许可又增加了一个独立监管关口，因为发射和再入权限不属于频谱审批。公开报道也明确显示，Cowboy 计划自研火箭发动机，并已招募有经验人员；但当前公开资料仍没有展示发动机测试结果、工厂、专用测试设施，也没有展示从
              2028 年首次发射走向 20,000 颗星座所需持续节奏的路径。即使首枚飞行器按时发射，规模问题仍在：制造并入轨数千颗 20-25 吨卫星，需要一套发射系统和工业基础，两者都远超 Cowboy
              已证明的能力。在自有发射器出现前，公司也仍暴露在第三方发射市场的定价和可用性风险下。
