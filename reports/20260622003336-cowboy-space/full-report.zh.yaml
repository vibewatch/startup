      - number: '7.5'
        title: 资本、融资与商业采用风险
        blocks:
          - type: paragraph
            body: >-
              Cowboy 已经融到可观资金，但今天资产负债表与明天野心之间的融资缺口仍然很宽。公司以 $2 billion 估值完成 $275 million Series B，使已披露股权融资达到约 $325
              million。对于验证和扩编阶段，这是一笔有意义的资本；但相较于开发新火箭、验证 1
              兆瓦轨道计算平台、以工业规模制造卫星并运营大型主动离轨舰队的隐含需求，它仍然有限。管理层自己仍把商业服务放在大规模验证性能、可靠性和经济性之后。也就是说，收入不会先于证明到来；证明本身必须先被融资。商业侧也比「轨道数据中心」的标题叙事更窄。NewSpaceEconomy
              明确把早期轨道客户描述为边缘处理、防务、地球观测或其他专业用户，这些用户的工作负载可以容忍天基到地面的时延。NVIDIA 自己的空间计算页面强调的是最小下行时延和边缘地面站处理，而不是对地面 hyperscale
              集群的一比一替代。Gartner 的观点更严厉：轨道数据中心几十年内都不会服务地面需求，甚至可能永远不会。Breaking Defense 补充称，Pentagon
              和情报买方仍在等待能力和商业案例能否被证明。公开层面，Cowboy 仍没有具名客户或披露收入。
