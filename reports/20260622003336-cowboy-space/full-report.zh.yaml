  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 买方格局与潜在客户分层
        blocks:
          - type: paragraph
            body: >
              Cowboy Space 瞄准那些 AI 计算和数据处理需求受地面基础设施限制的客户——主要是电力可得性和电网互联排队——并可能从低地球轨道采集充足太阳能的轨道计算中受益。NewSpaceEconomy 对
              ODC 市场的分析识别了五类早期客户原型：地球观测运营商、国防和安全机构、空间站用户、月球基础设施公司，以及面对特殊能源或位置约束的 AI
              开发者。这些群体共同呈现窄而有支付能力的画像：预算匹配专用高性能基础设施，能够容忍新型供应链，且任务需求无法被地面替代方案完全满足。

              AI 超大规模云厂商（AWS、Azure、GCP、Oracle）代表最大的理论市场，但采用不确定性也最高。受往返传播时延影响，时延敏感的消费者和企业工作负载在结构上不适合轨道计算，可行用例收窄到批量 AI
              训练任务和非时延关键推理。Microsoft 的 Azure Orbital 产品线和 Planetary Computer 平台显示，超大规模云厂商更广泛地投资太空基础设施，但二者都不能证明其有兴趣向
              Cowboy Space 这样的第三方租用轨道计算。OpenAI Stargate 计划承诺投入最多 $500B 建设地面 AI 基础设施，说明在轨道替代方案上线前，至少一部分超大规模云厂商
              需求会被地面容量扩张吸收。国防和情报买方提供更近期的转化路径：SAIC 的战略投资是公开记录中最清晰的信号，此前 DoD OECIF 给 Aetherflux 的拨款也说明政府端已熟悉 Cowboy 的前身技术。
