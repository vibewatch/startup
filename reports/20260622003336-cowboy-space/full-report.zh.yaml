  - id: FI002
    title: 单位经济桥——从单星部署到收入
    type: flow
    layout: standard
    summary: 定性梳理从卫星采购成本到单元收入贡献的单位经济流，在缺少直接数据处使用近似基准。
    data:
      nodes:
        - id: satellite_capex
          label: 单星资本开支输入
          description: GPU 硬件（估计 $2.25M–$30M）、卫星平台、热管理、电力系统；航天级溢价估计为地面等效方案的 3–10 倍
        - id: launch_cost
          label: 单星发射成本
          description: 估计 $5M–$25M，取决于卫星质量和发射载具；Falcon 9 拼车约 $2,500/kg 是当前市场参考；Cowboy 自有火箭目标是降低成本
        - id: total_deployment_cost
          label: 单元总部署成本
          description: 每颗卫星 $7.25M–$55M（资本开支 + 发射）；按卫星寿命摊销（LEO 估计 5–7 年）
        - id: orbital_revenue_per_unit
          label: 单星年收入
          description: 未披露；若按 $5/GPU-hr、800 个 GPU × 每年 2,000 个接触小时计算，约为每星每年 $8M（仅作示例）
        - id: unit_payback
          label: 估计单元回本周期
          description: 在每星年收入 $8M 的示例下，对比 $7.25M–$55M 部署成本：回本 0.9–6.9 年；短端需要有利的硬件成本和 Cowboy 自有发射载具
        - id: gross_contribution
          label: 毛贡献利润率
