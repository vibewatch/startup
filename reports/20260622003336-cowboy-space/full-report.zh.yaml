      - number: '3.5'
        title: 负面证据与竞争风险评估
        blocks:
          - type: paragraph
            body: >
              评估 Cowboy Space 时，几组反向竞争信号必须给足权重。第一，唯一公开承诺与轨道计算合作的商业云运营商 Crusoe Energy，首个太空部署选择了 Starcloud，而不是 Cowboy。未来
              Cowboy 仍可能拿到合作，但这个选择已经说明，早期商业客户正在验证哪一个平台。

              第二，Cowboy 同时推进火箭研发、航天器设计、热管理、光通信和客户获取，执行曲线很像那些历史上持续超支、延期的公司。TechCrunch 用「也很疯狂」形容这件事，措辞夸张，却点中了真实风险：在西方，只有
              SpaceX、Rocket Lab 和 Arianespace 能稳定发射商业火箭，而且每家公司都花了十年甚至更久才跑出运营节奏。截至报告日期，Stoke Space、Firefly Aerospace 和
              Relativity Space 已经做了多年，仍未交付可运营系统。

              第三，Stargate 建设以及 SoftBank、OpenAI、Microsoft 和 Oracle 出资的类似地面超大规模项目，正面切入 Cowboy 核心价值主张里的电力和土地瓶颈。如果 2026–2032
              年间，地面电力问题靠核能、分布式电网协议，或电力充足地区的新数据中心区域解决，轨道计算的论证就只剩边缘时延和数据主权，市场更窄、收入更低，也更难销售。

              第四，太空计算竞争格局正在向 NVIDIA 硬件这个共同平台收敛。NVIDIA 发布面向 LEO 的 Space-1 Vera Rubin 模块，一边验证了市场，一边把硬件差异做成了商品化。如果每个严肃的 ODC
              玩家都用同一批 NVIDIA GPU，竞争就会转向发射成本、热效率、轨道选择、网络拓扑和软件——这些恰恰是 Cowboy 最缺乏验证的主张。

              第五，SpaceBelt（Cloud Constellation
              Corporation）提供了一个警示先例：一家专做轨道数据存储、拥有可信合作方联盟（IBM、SSTL、MindCraft、若干银行业参与方）的公司，至少从 2020
              年起运营至今，仍未达到商业规模。多次尝试都显示，轨道数据基础设施总是比最初预测花更久、成本更高。
