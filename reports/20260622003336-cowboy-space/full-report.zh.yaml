  - id: TU005
    title: 扩张与集中度风险
    columns:
      - 扩张驱动
      - 集中度风险
      - 风险兑现后的影响
      - 尽调路径
    rows:
      - - SAIC 作为锚定客户 / 国防渠道背书
        - SAIC 是唯一具名的客户相邻实体；如果它成为首个商业客户，单一实体集中度会极端偏高
        - 如果 SAIC 不部署，国防收入论点就没有验证；估值承压
        - 要求 SAIC 提供有约束力的 LOI 或 MOA，确认部署意向；确认 Cowboy 是否配备专门 BD 资源
      - - 借星座规模先落地再扩张（Stampede → 20,000 颗卫星）
        - 没有可供扩张的收入基础；扩张叙事要求先拿到首批客户再规模化
        - 没有客户承诺却重资本增长，会造成灾难性的资金续航风险
        - 确认支撑商业发射的最低可行客户名单；要求提供 2028–2030 财务模型
      - - 地球观测客群（Planet、Maxar、Capella 类比）
        - EO 运营商技术能力强，但数量少；行业 TAM 偏窄
        - 如果 EO 客户主导早期收入，会形成集中度风险；仅靠 EO 无法支撑 $2B 估值
        - 梳理全部可触达 EO 客户；要求提供合格 EO 管线和支付意愿数据
      - - 数据主权与主权计算客群
        - 国家机构采购缓慢，且受政治变量影响；很可能延迟多年
        - 无论 Cowboy 发射时间线如何，主权客群收入都可能推迟到 2030 年之后
        - 找出拥有活跃 ODC 预算权限的具体政府机构；厘清法律状态
      - - AI 超大规模云厂商采用（AWS、Azure、GCP）
        - 需要超大规模云厂商放弃快速扩张的地面产能，转而采用新颖且未经验证的轨道基础设施
        - 如果超大规模云厂商不采用，Stampede 星座的核心收入论点就会坍塌
        - 确认是否有任何超大规模云厂商发布 RFI，或参与正式技术评估
    notes: 集中度风险以零客户基线衡量；任何首个客户都会立刻代表 100% 收入集中。影响评估假设 Cowboy 在商业发射时没有其他收入流。尽调路径可在正式资料室流程中处理。
