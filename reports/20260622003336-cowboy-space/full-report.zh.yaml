      - number: '6.2'
        title: 具名客户信号与商业化前需求证据
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，Cowboy Space 未披露任何具名客户、已签收入合同、意向书或试点协议。公司 CEO Baiju Bhatt
              明确表示，「一旦我们在规模上验证性能、可靠性和经济性，初始商业服务就会随后启动」，确认公司并不预期在首次自有火箭发射前产生收入；该发射目标是在 2028 年底前完成。这是本报告定义客户风险的核心姿态：$2B
              估值，却没有商业验证。

              最接近具名需求代理的是 SAIC。SAIC 作为新战略投资人，与 IVP 和 Blossom Capital 一同参与 Series B。报道政府承包商投资活动的 Washington Technology
              特别点出，SAIC 是值得关注的关键 GovCon 投资人。SAIC 的战略理由已有公开表述：作为大型 DoD IT 服务承包商，它认为 Cowboy Space
              的轨道计算能力与未来国防工作负载相关。不过，SAIC 尚未确认与 Cowboy Space 存在任何商业协议、服务级承诺或试点部署计划。

              行业层面，SpaceNews 报道称，AI 公司 Anthropic 有兴趣把 SpaceX 拟议轨道数据中心纳入更广泛的计算访问协议——这说明 AI 实验室正在探索 ODC 需求，但该信号指向 SpaceX
              系统，而不是 Cowboy。NVIDIA 将 Cowboy Space 列为 Space-1 Vera Rubin Module 项目的伙伴，这是供给侧技术合作，不是客户关系。运营两年、融资 $365M
              之后仍没有任何具名买方关系，是本次尽调中最重要的客户缺口。
