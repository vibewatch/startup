      - number: '1.3'
        title: 领导层与关键技术团队
        blocks:
          - type: paragraph
            body: >-
              Baiju Bhatt 担任创始人兼 CEO，也是 Cowboy Space 唯一的公开代表。他的创始人—市场匹配建立在三根柱子上： 物理学资历（Stanford 物理与数学 BA/MS）、个人资本投入风险（约
              $10 million 种子资金并参与 Series B）， 以及从零把 Robinhood 做成数十亿美元上市金融平台的既有记录。他公开表示，Cowboy Space 的野心规模
              ——同时造火箭、建星座、搭轨道计算平台——需要创始人愿意押注非常规的第一性原理。关键人风险很高： 公司的品牌、融资叙事和投资人关系，都紧密绑定 Bhatt 的信誉和个人愿景。

              Bhatt 组建的技术领导层，很大程度来自成熟商业航天产业。Tyler Grinnell 曾任 SpaceX 发射运营总监， 负责发射运营。Warren Lamont 曾在 Blue Origin
              领导火箭发动机和助推级开发，现在从新的 Seattle 办公室牵头推进工程。 David Larson 曾任职 SpaceX 和 Amazon Kuiper，担任卫星工程总监，同样位于
              Seattle。更广泛的团队履历覆盖 NASA/JPL、Astranis、Anduril、Lockheed Martin 和美国海军，让公司在推进、航电、航天器设计和国防应用上有相关纵深。 截至 2026 年 5
              月，GeekWire 报道仅 Seattle 就有 18 个开放职位，管理层预计近期 Seattle 员工总数达到 40–60 人。 公司总人数未公开披露。
