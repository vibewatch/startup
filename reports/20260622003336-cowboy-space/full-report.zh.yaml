      - number: '6.5'
        title: 扩张潜力、集中风险与留存缺口
        blocks:
          - type: paragraph
            body: >
              Cowboy Space 还没有客户，留存、NRR、GRR 和满意度指标都结构性缺失。现有客户基数尚不存在，公司无法证明 cohort 留存、合同续约或净收入扩张。这是底层尽调缺口，只有商业运营启动后才能解决；按
              Cowboy 当前发射节奏，最早也要到 2028 年末。

              首个商业客户带来的集中度风险极高。如果 SAIC 或任何单一防务客户成为第一个付费实体，收入启动时该客户就占
              100%，并会在定价和合同条款上获得不成比例的议价权。防务合同通常会用多年期承诺缓和这种风险，但这类合同也带来 ITAR、FedRAMP、CMMC
              等合规负担，需要大量时间满足；一旦要求无法持续维持，资格也可能被撤销。

              扩张故事在理论上很有吸引力：Cowboy 的 Stampede 星座可从单颗卫星扩到 20,000 颗，每颗增加 1 兆瓦算力。初始地球观测或防务客户若跑通轨道处理经济性，可能催化更广泛采用，进而出现
              land-and-expand 动态。Planet Labs 同时是 Google Project Suncatcher 伙伴和 NVIDIA 空间计算伙伴，因此可作为技术可信的早期采用者类比——但没有披露任何与
              Cowboy 的具体合作。数据主权客户，包括主权国家、金融机构、需要地外存储的政府机构，代表更长期的扩张板块，其采购机制与 AI 算力板块结构不同。
