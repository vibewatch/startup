        title: 展示材料
        blocks:
          - type: callout
            title: Starcloud 的硬件领先是结构性的，不是单靠资金就能追上
            body: >
              Starcloud 已经把 NVIDIA H100 送入轨道，跑过 AI 推理和训练工作负载，并拿下了首个轨道云租户 Crusoe。Cowboy Space
              不能只靠资本补上这道成熟度缺口——差距体现在硬件开发年限、监管审批和已证明的可靠性上。投资人应把 Cowboy 的竞争位置看作 2028–2030 年的故事，而不是 2026 年的故事。
            calloutType: risk
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP033
          - type: callout
            title: SpaceX 的 ODC 申报构成生存级规模威胁
            body: >
              SpaceX 100 万颗卫星的 ODC 申报，加上 Starship 在成本和发射节奏上的优势，构成了其他轨道新进入者无法中和的生存级扩张威胁。如果 SpaceX 在 2030 年代初商业化其 ODC
              系统，Cowboy 的 20,000 颗卫星计划在卫星数量上只是零头，在发射经济性上则处于倍数级劣势。Cowboy 维持独立价值的唯一场景，是 SpaceX 不向第三方客户提供 ODC
              服务——这合理，但不能保证。
            calloutType: risk
