      - number: '1.5'
        title: 技术架构、路线图与监管状态
        blocks:
          - type: paragraph
            body: >-
              核心技术押注，是把发射和计算纵向整合。传统轨道架构把火箭当作运送工具、把卫星当作货物； Cowboy Space 则把火箭上面级和计算载荷合并成单一飞行器。每个 Stampede 卫星数据中心模块预计重
              20,000-25,000 kg，在晨昏太阳同步轨道持续受光并产生 1 MW 可用电力，通过 NVIDIA Space-1 Vera Rubin Modules 搭载约 800 个 GPU——NVIDIA
              将该产品定位为专为 LEO AI 基础设施打造。该飞行器将大于 SpaceX 的 Falcon 9，但小于 Starship。

              计划中的技术演示分三步。第一步，由 Apex Space 建造的缩比电力波束测试卫星计划于 2026 年发射， 用于验证太空到地面的红外激光电力传输——这沿用了 Aetherflux 路线图。第二步，搭载
              NVIDIA 模块的早期 「Galactic Brain」数据中心节点计划于 2027 年初进行，演示太阳能驱动的轨道 AI 计算。第三步， 首次自研火箭发射将携带完整 1 MW 数据中心上面级，目标时间不早于
              2028 年底。公司还计划开发自研火箭发动机 ——这是资本和时间消耗最高的组件——并仍在敲定测试、制造和发射设施需求。

              监管方面，Cowboy Space 于 2026 年 5 月提交 FCC 申请 SAT-LOA-20260323-00135，请求授权以 Stampede 名义部署和运营最多 20,000
              颗非地球静止轨道卫星。根据 FCC 2026 年 6 月 12 日公共通知，该申请已获受理公示。Stampede 将主要通过光学星间链路运行， 只为遥测、跟踪和指令请求窄 Ka-band 频谱。公司寻求豁免若干
              FCC 规则，包括部署进度要求；其理由是光学架构不会带来频谱囤积风险， 且只要一颗卫星入轨就可开始商业服务。关键在于，FCC 申请本身承认卫星设计尚未最终确定，商业服务启动前还需要修改许可。 SatNews
              对两个实质问题提出担忧：如何在真空中耗散 1 MW 热负荷的物理问题仍未解决；700-1,000 km 高度、20,000 颗卫星壳层的碎片责任也未解决。 这些工程问题，公司尚未公开回答。
