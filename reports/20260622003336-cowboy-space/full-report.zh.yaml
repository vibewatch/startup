              - CM043
      - number: '2.6'
        title: 展示项
        blocks:
          - type: callout
            title: 电网瓶颈真实但阶段性
            body: >-
              地面电网并网积压，是轨道数据中心近期最强顺风。但它是阶段性结构摩擦，不是永久市场条件。 公用事业正在投入数十亿美元新增发电能力，数据中心运营商也在推进不需要轨道基础设施的绕网方案 （核电
              PPA、共址太阳能、液冷）。只有在地面替代方案缩小差距前证明单位经济性，Cowboy Space 的价值主张才最稳。
            calloutType: insight
            claimRefs:
              - CM005
              - CM009
              - CM033
          - type: callout
            title: 热与碎片风险在收入前仍未解决
            body: >-
              在 Stampede 拟定规模上，真空中冷却 1 MW 尚未得到验证。卫星设计未完成（按 FCC 申请）、700–1,000 km 高度的碎片责任，以及截至 2026 年 6
              月没有商业收入，这三者叠加，意味着市场论点建立在尚未过关的工程押注上。 投资人应把轨道 TAM 视为愿景，直到至少一颗 Stampede 卫星完成端到端计算任务。
            calloutType: risk
            claimRefs:
              - CM034
              - CM035
              - CM036
              - CM044
          - type: callout
            title: 尚无独立 ODC 市场规模测算
            body: >-
              截至 2026 年 6 月，轨道数据中心引用的所有市场规模，要么来自公司自称预测，要么从地面计算市场外推。 截至本报告日期，没有独立分析机构发布经过同行评审的轨道数据中心
              TAM/SAM/SOM。本文给出的规模测算， 使用证据约束框架，锚定已有文件支持的地面需求和电力约束，而不是单一自上而下估算。
            calloutType: assumption
            claimRefs:
              - CM011
              - CM018
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 直接轨道数据中心竞争者
        blocks:
          - type: paragraph
            body: >
              四家公司正在直接轨道数据中心类别中与 Cowboy Space 赛跑：Starcloud、SpaceX、Blue Origin 和 Sophia Space。 它们都瞄准 AI
              电力瓶颈论点，但架构、规模和发射策略各不相同。

              Starcloud（前身为 Lumen Orbit）是运营成熟度最高的纯 ODC 初创公司。其首颗卫星 Starcloud-1 于 2025 年 11 月发射， 搭载一块 NVIDIA H100
              GPU——这是首个在轨验证的高端 AI 加速器。该任务运行了 Google Gemma 语言模型的一个版本， 并在星上训练 nanoGPT 模型，证明 GPU 级推理在 LEO 物理上可行。Starcloud-2
              是其首次商业任务，预计将提供 GPU 集群、 持久存储和 24/7 访问。2026 年 2 月，公司向 FCC 申请授权，在 600–850 km 的太阳同步轨道运营最多 88,000 颗卫星， 按数量计是第二大
              ODC 申请。Crusoe Energy 于 2025 年 10 月宣布，将在计划于 2026 年底发射的 Starcloud 卫星上部署 Crusoe
              Cloud，这是首个公开宣布的轨道平台商业云租户。Starcloud 对 Cowboy 的领先是真实的：硬件已入轨、AI 工作负载已运行、 2026 年有商业任务计划、且已拿到主要云客户——这些都发生在
              Cowboy 预计首次自研发射之前。

              SpaceX 以完全不同的规模进入 ODC 讨论。2026 年 1 月 30 日，Space Exploration Holdings 向 FCC 提交 「SpaceX Orbital Data Center
              System」申请，计划建设最多 1 million 颗卫星的非地球静止轨道星座， 高度 500–2,000 km，主要依靠光学星间链路，并可能连接既有第一代和第二代 Starlink 系统。SpaceX
              相比所有其他 ODC 进入者的结构优势很明确： 它控制 Starship，这是唯一能以划算成本把 Cowboy 计划中的 20 至 25 吨卫星送上天的飞行器；
              它运营全球最大商业卫星星座；它拥有任何初创公司近期都无法匹配的制造规模和发射节奏。如果 SpaceX 将其 ODC 系统商业化， 它既可能向对手供应发射运力，也会争夺同一批工作负载。

              Blue Origin 的 Project Sunrise 是第三个大规模进入者。Blue Origin 向 FCC 申请建设最多 51,600 颗卫星的系统， 分布在 500 至 1,800 km
              的太阳同步轨道，通过光学链路和 TeraWave 宽带架构路由流量。Blue Origin 拥有 New Glenn 重型运载火箭和推进传承， 这带来 Sophia Space 和多数 ODC
              初创公司缺少的发射独立性。Project Sunrise 把计算与连接捆绑， 可能提供 AI 数据中心加宽带的一体化组合，而 Cowboy 当前更窄的方案无法匹配。

              Sophia Space 瞄准与 Cowboy 相同的晨昏太阳轨道论点，但硬件架构不同。其 Thermal Integrated LEO Edge（TILE）设计，
              把计算模块放在产热点旁边的辐射散热板附近，相比传统数据中心热系统减少质量和复杂度。NVIDIA 把 Sophia Space 列入 Space-1 Vera Rubin 合作伙伴——这与 Cowboy
              的供应商关系相同——但 Sophia 对模块化热设计的关注，直接对应轨道 AI 最难解决的问题之一。Sophia Space 尚未宣布发射日期，也未宣布与 Cowboy 已披露 $325M 资本等量的融资。
