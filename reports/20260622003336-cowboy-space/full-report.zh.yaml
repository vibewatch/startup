            title: 没有具名客户是单一最大风险
            body: >
              截至 2026 年 6 月，Cowboy Space 已融资 $365 million、估值达到 $2 billion，但没有一个具名客户、已签 LOI 或披露试点。公开记录中，SAIC
              的战略投资是唯一贴近客户的信号，却不带任何有约束力的商业义务。收入假设的每个环节——hyperscaler 需求、防务采购、EO 处理——都完全没有商业证据验证。首笔商业收入取决于首次自研火箭发射，目标是在
              2028 年底前完成，但没有客户承诺支撑这条时间线。
