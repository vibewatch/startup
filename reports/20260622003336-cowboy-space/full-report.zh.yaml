  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心架构——上面级即数据中心
        blocks:
          - type: paragraph
            body: >-
              Cowboy Space
              的核心产品洞察是，传统航空航天模式把运载火箭和独立卫星载荷分开，带来结构性冗余——重复的航电、级间适配器、分离系统和承力结构增加了质量，却不增加计算或电力。公司的解法是把火箭上面级本身当作轨道数据中心：一个单一飞行器进入低地球轨道后，直接在原位作为兆瓦级计算节点运行。每个
              Stampede 单元设计重量 20,000–25,000 公斤，在 700–1,000 公里高度的晨昏太阳同步轨道中展开太阳能板产生 1 MW 电力，并搭载约 800 块 GPU。所选计算硬件是 NVIDIA
              的 Space-1 Vera Rubin 模块，专为 LEO AI 工作负载打造，并于 2026 年 3 月 GTC 发布。Vera Rubin 模块把 88 核 CPU 与两颗 Rubin 图形芯片配对；单颗
              Rubin 芯片可提供 50 petaflops 的 NVFP4 性能。NVIDIA 发布 Space-1 项目启动伙伴名单时点名 Cowboy Space，NVIDIA
              新闻材料和多家独立媒体均确认了这一点。级段结构本身计划兼作散热器，通过主动热管理系统排出计算载荷产生的废热——在真空中没有对流冷却，这是设计必需。CEO Baiju Bhatt
              将该架构描述为：「每个上面级利用飞行器的全部质量和体积，把发电、冷却和计算打包在一起——包括把级段结构本身用作散热器。」这个概念减少了每个轨道数据中心单元需要单独制造、测试和发射的部件数量，也是公司相较那些为第三方火箭建造卫星载荷的竞争者，最主要的工程与经济差异化主张。火箭按入轨载荷能力设计为略大于
              SpaceX Falcon 9、但小于 Starship，目标是把 20,000–25,000 kg
              送入轨道。可重复使用被描述为「在经济上合理时」的设计目标，但明确从属于最大化计算质量入轨效率。取消载荷适配器和次级结构，究竟能比传统两级火箭加专用卫星载荷提升多少质量分数，尚未得到独立量化；它仍是公司声称的收益，有架构逻辑支撑，但没有已展示硬件。
