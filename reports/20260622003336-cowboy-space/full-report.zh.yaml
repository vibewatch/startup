  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与 AI 算力电力需求
        blocks:
          - type: paragraph
            body: >-
              Cowboy Space 面向的市场，位于两个已有独立文献支撑的趋势交汇处：AI 算力需求指数级增长，以及地面电力基础设施的系统性约束。 Goldman Sachs Research 预计，到 2030
              年，数据中心电力需求将增长 160%，主要由 AI 工作负载驱动。一次 ChatGPT 查询约消耗 2.9 watt-hours，约为一次 Google 搜索 0.3 watt-hours
              的十倍；模型规模和查询量增长后，总用电量也随之上升。 数据中心目前消耗全球 1–2% 电力；Goldman Sachs 估计，到 2030 年这一比例将升至 3–4%，仅美国数据中心就将消耗国内 8%
              电力（2022 年为 3%）。International Energy Agency 的 Electricity 2024 分析同样把数据中心用电量列为结构性加速趋势。


              眼前瓶颈不是硅片，而是电力接入。Cowboy Space 的 FCC 申请明确写道：「公用事业和地面电网的传统并网节奏， 已无法满足 AI 的基础设施需求。」投资人 Construct Capital
              称，主要市场的数据中心拿电网接入需要等待多年。 按 Goldman Sachs 估算，仅为支持数据中心，美国公用事业就需要投入约 $50 billion 新增发电能力。 土地许可延误、冷却用水约束，以及 AI
              枢纽地区的电网拥堵，进一步拉长了时间线。


              Cowboy Space 对市场边界的主张是：能够容忍卫星链路延迟的工作负载——大批量 AI 训练、地球观测分析、 国防边缘处理和太空原生计算——可以由太阳能轨道基础设施承载，并完全绕开地面电网。公司的 FCC
              申请称： 「把硅片放到阳光旁边，Stampede 就能完全跳过地面电网。」该市场被定义为面向无法或不愿等待地面电网容量的客户的 高功率 AI
              计算和存储基础设施，交付机制是轨道部署。对延迟敏感的消费者服务、金融交易和大多数实时企业应用被明确排除。
