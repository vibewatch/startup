      - number: '2.5'
        title: 采用约束与怀疑视角分析
        blocks:
          - type: paragraph
            body: >-
              多个采用壁垒足以重塑整个市场论点。SatNews 编辑 Nick David 在 Cowboy Series B 后撰写详细分析，
              指出公司必须同时解决四个未解瓶颈：发射供给、热管理、数据重力和单位经济性。热管理尤其不是简单问题： 在真空中耗散 1 MW 热量，需要把大型散热器指向寒冷太空；兆瓦级辐射冷却所需质量、面积和指向要求， 尚未在
              Stampede 拟定规模上得到验证。真空散热的物理机制与地面冷却根本不同，也还没有运营中的 ODC 证明过 1 MW 热吞吐。


              数据重力是第二个结构性约束。大多数 AI 训练数据源自地球，且已经存放在地面云基础设施中；把训练数据集送上轨道再传回的成本和延迟， 公开材料并未说明。低地球轨道会带来 10–500 ms
              往返延迟，具体取决于架构；这会完全排除对延迟敏感的推理和交互式应用。 FCC 申请承认 700–1,000 km 高度、20,000 颗卫星星座存在碎片风险，SatNews
              也指出，纯光学架构只能缓解该责任，无法消除。 Secure World Foundation 对 SpaceX 和 Starcloud FCC
              申请的评论，要求分阶段授权、系统级风险分析，以及更清晰的任务后处置标准； 这些先例也可能影响 Cowboy 的监管路径。按 Cowboy 自己的 FCC 申请，卫星设计明确尚未完成，服务开始前还需要修改许可。
              合在一起，这些约束让可信的空头情形并不难表述：在轨道基础设施达到商业规模之前，地面数据中心可能已经通过与可再生能源共址和核电 PPA 解决电力问题。
            claimRefs:
              - CM034
              - CM035
              - CM036
              - CM037
              - CM038
