  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              Cowboy Space Corporation 自 2024 年末以 Aetherflux 创立以来，完成了三轮不同融资，最终在 2026 年 5 月以 $2B 投后估值完成 $275M Series
              B。CEO Baiju Bhatt 确认，截至 Series B 关闭时总资本约 $365M，意味着公司创立时还从 Breakthrough Energy Ventures、Andreessen
              Horowitz、NEA 和天使投资人处筹集了约 $40M 种子及过桥资金。2025 年 4 月由 Index Ventures 和 Interlagos 领投的 $50M Series A，支持了公司在
              Aetherflux 品牌下的太空太阳能阶段。Series B 由 Index Ventures 共同领投，IVP、Blossom Capital、SAIC
              以及所有主要既有投资人参与，资金用于转向轨道数据中心和自有运载火箭。Fenwick and West LLP 确认其代表 Cowboy Space 参与 Series B，提供了独立法律佐证。SAIC
              作为新战略投资人的参与值得注意：SAIC 是美国最大的国防 IT 承包商之一，其出资释放了未来政府和军事应用采购轨道计算的潜在兴趣。公司还在 Series B 前获得美国国防部 Operational
              Energy Capability Improvement
              Fund（OECIF）的一份概念验证无线输电演示合同——这是唯一公开确认的政府收入信号。此前政府合同和拨款在公开披露中未量化，非风险投资收入的真实规模仍不清楚。资本表完全由股权融资构成；没有公开披露债务、可转债或项目融资工具。
