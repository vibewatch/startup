      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: DCF 或收入倍数均不适用
            body: >
              截至 2026 年 6 月，Cowboy Space 处于收入前阶段，没有披露 ARR、backlog、财务模型或单位经济性。标准 DCF、收入倍数和 EBITDA
              倍数框架都不能适用。本章采用基于情景的期权价值框架，以可比私人轮次价格和公开 AI 基础设施倍数为基准——不是把它们作为直接估值输入。本分析隐含的任何精确数字，都应被理解为误差边界很宽的区间估计，而不是点估计。
            calloutType: assumption
            claimRefs:
              - CV006
              - CV007
              - CV020
          - type: callout
            title: 里程碑滑坡时，下轮降估值风险升高
            body: >
              Finro 2026 年 Q1 AI 估值分析和 BlackNight Space Labs ODC 竞赛分析都警告，私人 AI 基础设施市场正在尖锐重定价「先增长、商业模式以后再说」的叙事。如果 Cowboy
              的 2026–2028 年里程碑出现实质滑坡，Series C 发生 down-round 的风险真实存在。down-round
              会让当前投资者损失结晶，恶化员工股权稀释，并向市场发出论点尚未验证的信号——而公司在这个节点恰恰需要最多资本来资助火箭开发，融资挑战会进一步叠加。这是当前进入价格下最核心的财务风险。
            calloutType: risk
            claimRefs:
