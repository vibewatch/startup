  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 技术与工程风险
        blocks:
          - type: paragraph
            body: >-
              Cowboy Space 的核心技术押注仍停留在概念阶段，而不是经过飞行验证。公司及相关报道现在描述了一套非常具体的目标架构：20,000 颗由上面级衍生的卫星，运行在晨昏太阳同步轨道；每颗约
              20,000-25,000 公斤，产生约 1 兆瓦可用电力，并搭载接近 800 个围绕 NVIDIA Space-1 Vera Rubin 模块构建的
              GPU。具体化有帮助，但不能改变中心问题：公司想建的系统仍未完成。SpaceNews 和 SatNews 都报道称，Cowboy 向 FCC
              表示卫星设计尚未完成，服务开始前还需要修改许可证。相同来源还称，该设计预计让级段结构本身充当散热器。这带来一阶热风险：真空环境消除了对流冷却，废热排放必须靠散热面积、发射率和可靠性假设，而这些假设尚未针对 1
              兆瓦轨道数据中心公开验证。辐射是第二个主要工程未知数。NASA 和 NOAA 都把辐射带描述为由高能粒子构成的恶劣环境，可能损伤航天器电子设备。因此，Cowboy 计划的 700-1,000 km
              工作带，在公司正依赖一款新发布的空间计算模块和「级段即数据中心」一体化设计时，提出了位错误、闩锁和组件寿命问题。公开来源描述了计划和合作，但尚未给出一体化飞行器、散热器概念或完整计算栈的鉴定数据。
