      - number: '1.2'
        title: 创立历程与从 Aetherflux 的战略转向
        blocks:
          - type: paragraph
            body: >-
              Baiju Bhatt 在 2023 年底或 2024 年初开始搭建后来成为 Cowboy Space 的公司，并于 2024 年 3 月在加州 San Carlos 以 Aetherflux
              名义正式注册，用个人约 $10 million 资金支持种子阶段。Bhatt 在 2024 年初离开 Robinhood Markets；此前他任联席 CEO 至 2020 年，随后任首席创意官。他保留约 6%
              Robinhood 股份， 足以用个人资产负债表托住早期开发。他父亲曾在 NASA Langley Air Force Base 工作，加上他本人在 Stanford 的物理和数学训练，
              共同塑造了他对太空商业化的长期兴趣。

              Aetherflux 于 2024 年 10 月走出隐身，提出小卫星 SBSP 论点：一组装有太阳能阵列和近光学红外激光器的 LEO 卫星，
              能够规模化收集太阳能，并把能量传给紧凑型地面接收端。公司称这一方案与早期地球静止轨道巨构设想显著不同： 更小、更模块化，也更容易迭代。2025 年 4 月，Aetherflux 完成由 Index
              Ventures 领投的 $50 million Series A， 累计资本增至约 $60 million；同时，公司通过美国国防部 Operational Energy Capability
              Improvement Fund 获得政府支持， 用于概念验证型无线电力传输系统。团队也在 2025 年完成了实验室电力传输演示。

              催生 Cowboy Space 的转向，来自残酷的经济约束：Bhatt 告诉 TechCrunch，他接触了多家发射服务商，
              但找不到足够运力，无法以有竞争力的单位经济性扩展轨道数据中心业务。公司决定加入内部火箭项目， 把发射视为纵向整合层，而不是第三方成本。原有太空太阳能论点被保留，但重新定义——Cowboy 不再把电力传回地球，
              而是在轨道现场用它运行计算。2026 年 5 月 11 日，改名、新品牌和 $275 million Series B 同时公布， 标志着轨道数据中心与运载火箭组合战略正式亮相。
