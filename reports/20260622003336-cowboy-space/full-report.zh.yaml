      - number: '1.6'
        title: 展示项
        blocks:
          - type: callout
            title: 纵向整合就是护城河
            body: >-
              Cowboy Space 最主要的竞争差异点，是把运载火箭、卫星上面级和轨道计算平台作为一个整合系统全部掌握在自己手里。
              公司从第一天就把火箭和数据中心一起设计，减少其他架构中拉低每美元算力的冗余质量，也摆脱了对第三方发射运力的依赖； 该运力在可预见未来预计仍会稀缺。如果能够落地，这种整合可能让 Cowboy 相比依赖 SpaceX
              Starship 的轨道数据中心竞争者， 拥有更持久的单位经济性优势。
            calloutType: strength
            claimRefs:
              - CO033
              - CO004
              - CO038
          - type: callout
            title: 重大技术与执行风险
            body: >-
              SatNews 和 TechCrunch 分别指出了公司尚未公开解决的两个结构性挑战：（1）在没有主动冷却基础设施的情况下， 在真空中耗散 1 MW 热负荷并非简单工程问题，FCC
              申请也承认设计尚未完成；（2）700-1,000 km 高度的 20,000 颗卫星壳层会产生碎片责任，纯光学架构只能缓解，不能消除。更难的是，公司还要独立开发新火箭发动机和运载火箭
              ——即便资金充足的西方公司，也往往需要多年才能完成。西方只有少数私营公司能持续发射商业火箭，而 Cowboy 是从零加入这个垂直领域。
            calloutType: risk
            claimRefs:
              - CO037
              - CO038
              - CO039
          - type: callout
            title: SAIC 投资释放国防应用信号
            body: >-
              SAIC 作为 Series B 新投资人参投，加上 Series A 期间获得的 DoD OECIF grant，说明 Cowboy Space 正把轨道计算和太空太阳能供能定位为国防能力。 SAIC
              的政府合同关系，可能让 Cowboy 接触到 DoD 采购渠道，服务于对抗环境中有韧性、脱离电网的计算基础设施； 在更广泛商业超大规模云厂商采用之前，这一细分市场可能带来近期收入。
