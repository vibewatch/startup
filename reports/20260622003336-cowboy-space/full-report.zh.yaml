          - type: callout
            title: 地面 AI 产能扩张直接冲击 ODC 价值主张
            body: >
              Cowboy Space 的核心客户假设是，地面 AI 算力容量已不可逆地受限；但正在推进的缓解措施规模很大，直接挑战这一前提。OpenAI 的 Stargate 计划承诺最高 $500 billion 投向地面
              AI 基础设施；hyperscaler 也在推进核电协议，并与能源资产共址。如果地面算力供给扩张快于轨道基础设施达到商业可用，Cowboy Space
              可触达的客户需求池将显著小于市场层面「能源瓶颈」叙事所暗示的规模。
