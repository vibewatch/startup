      - number: '6.4'
        title: 部署阻碍、切换成本与客户需求怀疑
        blocks:
          - type: paragraph
            body: >
              反对 Cowboy Space 客户论点的最连贯怀疑，不是轨道计算技术上不可能，而是地面替代方案扩张得足够快，在 Cowboy 首次发射前就会缩小可寻址客户缺口。OpenAI Stargate 计划代表对地面
              AI 基础设施的 $500B 承诺。超大规模云厂商正在推进核能协议、与能源资产共址，以及更好的冷却技术，这些动作合在一起削弱了轨道替代方案的能源稀缺论证。Ars Technica 对 AI
              电力危机叙事的分析明确提出疑问：等轨道数据中心可部署时，它们是否还能在经济上具备竞争力。

              部署阻碍还叠加了鸡生蛋式的需求问题：企业客户不太可能在技术规模化展示前承诺使用轨道计算，但规模化展示技术又需要资本，而没有客户承诺时资本很难筹集。Cowboy 通过 SAIC
              战略投资，在股权侧穿过了这种结构性商业化前风险，但在商业需求侧尚未解决。The Next Platform 的技术分析指出，轨道数据中心在真空中排出一兆瓦热负载面临物理约束——这些工程挑战，Cowboy 自己的
              FCC 申报也承认尚未完成。

              最终采用 Cowboy Space
              平台的客户，切换成本会很高。为轨道处理优化的工作负载——利用连续太阳能、辐射冷却，以及与共址卫星之间近乎零时延——迁回地面替代方案需要大量重构。这是长期护城河，但只有客户已经承诺并部署后才会兑现，因此在初期更多是采用门槛，而不是留存优势。
