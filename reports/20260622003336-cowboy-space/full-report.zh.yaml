      - number: '8.2'
        title: 估值背景、轮次定价与可比分析
        blocks:
          - type: paragraph
            body: >
              Cowboy Space 于 2026 年 5 月以 $2 billion 投后估值融资 $275 million，仅 Series B 这一轮就隐含约 13.8% 稀释，投前估值约 $1.725
              billion。到 Series B 交割时，公司从种子轮、$50M Series A（2025 年 4 月）到 Series B，合计已融资约 $365 million。公司没有公开披露 cap
              table、清算优先权或完全稀释股数，因此外部无法精确分析稀释和期权价值。

              在轨道数据中心品类内，Cowboy 的估值是已披露或可推断轮次价格的同行中最高的。Starcloud 在 2026 年 3 月的 $170M Series A 达到独角兽状态（$1.1B），据 SpaceNews
              和 BlackNight Space Labs 引用的消息来源，其后据称还在寻求以 $2.2B 再融 $200M。Lonestar Data Holdings 是一个月球数据中心概念，到 2025 年末总融资仅约
              ~$12.4M，显示空间计算初创公司内部融资分散度很大。

              与 AI 基础设施锚点相比，截至 2026 年 6 月，公开 neocloud 和数据中心公司按未来收入交易的中位倍数为 11.8x（multiples.vc）。行业龙头 CoreWeave 市值约 $64
              billion，对应 $6.2B TTM revenue。Crusoe AI 在 2025 年 10 月以 $10B+ 估值融资 $1.37B——且拥有真实数据中心收入。这些可比公司展示了市场愿意为已经产生收入的
              AI 算力基础设施支付什么。Cowboy 零收入却估值 $2B，是另一种工具：它在给 ODC 市场创造的战略期权定价，并由顶级投资者 syndicate（Index
              Ventures、a16z、Breakthrough Energy、IVP）背书；同时，2026 年 Q1 SpaceTech 投资气候有利，全球单季部署 $8.0B（Seraphim Space
              Index）。不过，Finro 的 2026 年 Q1 分析提醒，私人 AI 市场已开始把「先增长、商业模式以后再说」的叙事大幅重定价，转向拥有可重复变现和持久需求的公司——如果里程碑滑坡，这会直接威胁
              Cowboy 当前倍数。
