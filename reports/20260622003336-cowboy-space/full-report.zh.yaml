      - number: '5.4'
        title: 热管理与关键技术约束
        blocks:
          - type: paragraph
            body: >-
              对 1 MW 功率规模的轨道数据中心而言，已验证的最难工程问题是排热。地面数据中心的电力使用效率，部分取决于把废热转移到空气或水中的能力——轨道上两者都不存在。唯一机制是热辐射，受
              Stefan-Boltzmann 定律支配：300 K 表面每平方米约辐射 460 W。若在该温度下排出 1 MW 热负载，完美发射率下需要约 2,170
              平方米散热器表面积；实际考虑几何视角因子约束和真实发射率后，需求接近 3,000–4,000 平方米。2026 年发布的轨道数据中心「物理墙」技术分析，把优化良好的单 MW 节点在更高温度（约 500–600
              K，本身就会压迫 GPU 热容忍度）运行时的最低需求定在约 200 平方米。Cowboy Space 的设计答案是把火箭级段结构用作散热器——这个概念利用完整 20,000+ kg
              级段的大表面积，但尚未在任何中间尺度验证。公开信息中没有热模型、原型测试结果或第三方工程评审。第二个未解约束是抗辐射。700–1,000 km 高度的 LEO 会穿越南大西洋异常区和 Van Allen
              辐射带边缘，使硬件暴露在高能质子和电子中。商用 GPU 架构容易遭遇单粒子翻转和总电离剂量退化；NVIDIA 的 Space-1 模块被描述为适用于 LEO 的抗辐射产品，但没有发布独立资格认证数据表或
              MIL-SPEC 等价证明。第三个约束是数据重力：轨道计算工作负载必须把大数据集传到轨道上（意味着卫星需要高上行带宽）、处理来自 LEO
              传感器的流式数据（这是天然共址用例），或接受地面到轨道往返带来的显著时延。光学下行设计解决了吞吐潜力，但没有解决摄取经济性。TechCrunch 2026 年 5 月报道称，Cowboy Space
              仍「在解决关键开发需求，比如测试、制造和发射火箭的设施」——确认火箭发动机测试基础设施尚不存在。这些叠加的不确定性——热、辐射、数据链路和推进测试基础设施——意味着 2028
              年首次发射里程碑，要在没有中间尺度已展示硬件的情况下，同时解决多项首次出现的工程挑战。
