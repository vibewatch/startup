  - id: TP004
    title: 护城河耐久度与竞争风险登记表
    columns:
      - 护城河主张
      - 具体竞争威胁
      - 严重程度
      - 尽调问题 / 缓释路径
    rows:
      - - 垂直整合（自有火箭 + 计算）消除发射供给约束
        - SpaceX 可能永远不会为 20 吨级 ODC 载荷提供第三方发射；没有火箭的 ODC 竞品创业公司仍会卡在发射瓶颈
        - 护城河价值高——但前提是 Cowboy 成功造出有竞争力的运载火箭
        - 核验推进系统测试里程碑、FAA 许可时间线，以及相对 Falcon 9 等效方案的单次发射成本目标
      - - NVIDIA Space-1 Vera Rubin 合作释放计算差异化信号
        - Starcloud、Sophia Space 和 Axiom Space 也共享该合作；NVIDIA 并未独家绑定 Cowboy
        - 低（非独家）——NVIDIA 硬件会成为轨道计算里的商品化部件
        - 不要把 NVIDIA 合作当作差异化主张；应转而识别软件或工作负载集成层面的护城河
      - - 20,000 颗卫星规模相对 Axiom / Kepler 边缘节点形成计算密度优势
        - SpaceX（1M）和 Starcloud（88K）申报的星座更大；Cowboy 是巨型星座进入者里规模最小的一家
        - 中等——相对边缘玩家有规模优势，但资源雄厚的同行规模更大
        - 跟踪四项 FCC 申请的处理时间线；监管结果可能压缩规模主张
      - - 专有的“上面级即数据中心”设计降低集成开销
        - Cowboy 自己的 FCC 申请写明，卫星设计尚未完成，投入服务前需要修改许可证
        - 高风险——FCC 申报阶段设计未完成，意味着还要承担数年的额外开发风险
        - 要求完成硬件 CDR（关键设计评审），再升级至买入 / 跟踪
      - - 先发轨道 AI 计算优势带来客户锁定
        - Starcloud 已经在轨演示 AI 工作负载；Axiom 的 ISS 硬件已经上线；Cowboy 最早也要到 2027 年才有首次演示
        - 高风险——Cowboy 不是先发者；在硬件部署上，它排在 Starcloud、Axiom / Kepler 以及潜在其他玩家之后，至少第四
        - 澄清客户管线——是否有地球观测或国防客户明确承诺使用 Cowboy？
      - - 地面 AI 电力瓶颈为轨道计算创造持续结构性需求
        - 在 Cowboy 首次商业发射前，Stargate（$500B）、电网升级、核能协议和能效更高的芯片可能削弱电力瓶颈的紧迫性
        - 中等风险——需求论点今天成立，但必须在 2028–2030 年窗口得到验证；地面建设正在加速
        - 每年跟踪地面电网并网排队进展和核能数据中心协议
    notes: 严重程度评估是作者基于来源证据作出的判断；不是量化评分。护城河主张改写自 Cowboy Space 的 FCC 申请和投资人沟通。
