companyProfile:
  summary: >-
    Cowboy Space Corporation（前身为 Aetherflux）是一家位于加州 San Carlos 的 Series B 轨道基础设施公司， 由 Robinhood 联合创始人 Baiju Bhatt 于 2024
    年创立。公司的核心论点，是把自研 Falcon-9 级运载火箭与 20,000–25,000 kg、同时作为 1 MW 太阳能 AI 数据中心的卫星上面级纵向整合，拼出计划中的「Stampede」 20,000 颗卫星星座。2026
    年 5 月，公司以 $2B 估值融资 $275M，并从太空太阳能起点（Aetherflux）改名后， Cowboy 转向服务被地面电网多年并网队列卡住的 AI 超大规模云厂商和国防客户。公司尚未产生收入；热管理、
    辐射加固和发射节奏等关键技术风险仍未在公开资料中解决。
