      - number: '5.3'
        title: NVIDIA Space-1 合作与技术栈
        blocks:
          - type: paragraph
            body: >-
              每颗 Stampede 卫星的计算底座都是 NVIDIA 的 Space-1 Vera Rubin 模块，这是面向 LEO 优化的 GPU 推理和训练系统，2026 年 3 月在 NVIDIA GTC
              发布。NVIDIA 太空计算产品页确认，Cowboy Space Corporation 正在集成三类不同 NVIDIA 组件：用于主要 GPU 工作负载的 Vera Rubin Space-1
              Module、用于本地控制和推理编排的 IGX Thor 边缘 AI 处理器，以及用于自主卫星运营管理的 Jetson Orin。这套分层计算栈把工作负载拆开：Vera Rubin 模块承担大规模 GPU
              批量推理或训练，IGX Thor 做实时边缘处理，Jetson Orin 管自主在轨运维。不过，具体硬件接口、每颗卫星的模块数量，以及每个模块的热包络都没有公开披露。Space-1 模块被介绍为适用于 LEO
              运行的抗辐射设计，但抗辐射程度——是达到完整军用航天级标准，还是较轻的商业 LEO 容忍度——尚未独立验证。NVIDIA 的太空计算计划是一个重要的市场验证信号：这是首个主要 GPU 供应商发布专门定位于轨道
              AI 基础设施的产品线，Cowboy Space 作为被点名的启动伙伴，也为硬件路线图增加了商业可信度。Cowboy 的光学星间链路架构需要自有或第三方自由空间光终端硬件，把 Stampede
              卫星连成星座网络。FCC 申报把光学 ISL 描述为主要数据传输层，但没有说明终端规格、链路预算、可用性目标，或指向 / 捕获 / 跟踪方案——这些都是实际运营性能的关键未知数。地面段方面，申报请求
              Ka-band 频谱用于 TT&C；面向客户的数据下行地面站基础设施没有描述。首个演示任务的卫星平台由 Apex Space 建造。Apex Space 位于洛杉矶，是一家高产率卫星制造商；截至 2026
              年中，其生产设施年产能超过 200 个平台，并计划到 2026 年底扩至 100,000+ 平方英尺。Apex 使用自有「Octopus」制造 OS 管理装配排期和作业指导。Apex
              已确认参与首颗演示卫星，但其在量产 Stampede 制造中的角色没有在公开文件中得到合同确认。
