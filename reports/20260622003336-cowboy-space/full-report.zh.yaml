  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、反论点与分析框架
        blocks:
          - type: paragraph
            body: >
              Cowboy Space 位于两股宏观力量的交点：AI 算力容量危机，以及轨道基础设施能提供地面替代方案无法快速复制的约束缓解。投资论点建立在三层押注之上——(1) AI 算力需求继续超过地面部署速度，(2)
              轨道数据中心在生产规模上具备物理和经济可行性，(3) Cowboy 垂直整合的「火箭 + 计算」架构能捕获足够市场，支撑低于 $2 billion 的进入价格。截至 2026 年 6 月，三项押注都尚未被证明。

              反论点同样有分量。公司处于收入前阶段，没有披露客户管线。1 MW 轨道数据中心的散热问题尚未在生产规模公开验证。火箭项目仍处早期；Relativity Space 和 ABL Space Systems
              的可比项目在首个运营里程碑前消耗了 $100M–$650M+，其中数个未能达成。The Register 在 2026 年 2 月引用 Gartner 称，轨道数据中心是「pie in the
              sky」式想法；另一篇 2026 年 4 月 Register 报道引用了一家轨道数据中心初创公司承认发射经济性「don't fly」。SpaceX 2026 年 1 月向 FCC 申请最多 100
              万颗轨道数据中心卫星，构成生存级竞争威胁。

              面对这些不对称，标准 DCF 和收入倍数框架无法适用——没有收入、没有 ARR、公开领域也没有财务模型。合适的分析镜头是基于情景的期权估值：嵌入式看涨期权对 ODC 市场存在和 Cowboy
              执行的隐含价格是多少？这个期权价格是否符合有纪律投资者应支付的水平？下方的推荐摘要和论点 / 反论点表直接呈现这一框架。
