      - number: '3.3'
        title: 地面 AI 云替代方案
        blocks:
          - type: paragraph
            body: >
              对 Cowboy 所称市场——受电力约束的 AI 算力——最直接的竞争威胁，不来自轨道对手，而来自今天已经运营的地面替代方案。 CoreWeave、Crusoe、Voltage Park 和 Stargate
              项目合起来服务 Cowboy 想要捕获的工作负载， 延迟更低、成本更低，也没有发射风险。

              CoreWeave 自称全球 #1 AI 云平台，通过 Kubernetes 原生环境提供 GPU 计算，下一代基础设施包括 NVIDIA Vera Rubin NVL72 机架级系统。它提供快速推理启动、托管
              Kubernetes 和 Slurm 集群，以及企业级 24/7 支持。 CoreWeave 今天已经商业可用，客户包括主要 AI 模型开发者和企业。作为地面运营商，CoreWeave 没有 Cowboy
              的延迟挑战， 能够物理接触并升级硬件，也能基于已知基础设施成本签署多年合同——这些优势至少会持续到 2030 年代初。

              Crusoe 提供 AI 云基础设施，声称正常运行时间为 99.98%，硬件包括 NVIDIA 和 AMD 的 GB200 NVL72、HGX B200 和 MI355x； 其托管推理服务称可让首 token
              时间最高快 9.9×。Crusoe 还宣布将在 2026 年底把 Crusoe Cloud 部署到 Starcloud 卫星上——它因此既是地面替代者，也是选择 Starcloud 而非 Cowboy
              的轨道计算客户。这一合作释放出的信号是： 愿意尝试轨道计算的领先 AI 云运营商，已经承诺给了 Cowboy 的竞争者。

              Voltage Park 运营超过 36,000 个 NVIDIA Hopper、Blackwell 和 Grace Blackwell GPU，按需定价从 $1.99/hr 起， 专用预留合同期限为 12+
              个月。其客户包括领先 AI 实验室和快速扩张初创公司。Voltage Park 的价格点和即时可用性， 会直接压制未来任何 Cowboy 定价模型：如果轨道计算无法低于或显著优于 $1.99/hr H100
              访问，太空 AI 的经济性论证就完全依赖那些地面访问不可用或被禁止的用例。

              Stargate Project 宣布计划在四年内投资 $500 billion 建设美国 AI 基础设施，由 SoftBank、OpenAI、Oracle 和 MGX 支持， 并从 Texas 开始立即部署
              $100 billion。Arm、Microsoft、NVIDIA、Oracle 和 OpenAI 是关键技术伙伴。传统意义上， Stargate 不是 Cowboy
              的竞争者——它建设地面数据中心——但它吸收的正是 Cowboy 融资叙事依赖的需求信号。 随着 Stargate
              和类似超大规模地面项目爬坡，电力瓶颈论点的紧迫性会下降，并网时间线会缩短，轨道计算的相对论证会变弱。 这是对 Cowboy 中期需求论点最不利的外部战略进展。

              AWS Ground Station 把云基础设施延伸到卫星运营，但不把计算放到轨道；Azure Orbital 提供类似的地面卫星处理服务。
              两者都不是直接的轨道计算竞争，但都会降低客户为避开地面基础设施支付的溢价：任何能够通过 AWS 或 Azure 容忍地面处理的任务， 都不需要 Cowboy 的轨道计算服务。
