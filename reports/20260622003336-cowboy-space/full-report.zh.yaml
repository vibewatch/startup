      - number: '7.4'
        title: 轨道碎片、碰撞与天文风险
        blocks:
          - type: paragraph
            body: >-
              20,000 颗卫星计划将进入一个已经更拥挤、运营更脆弱的轨道环境。ESA 2025 年空间环境报告称，寿命结束时离开高度拥堵轨道的卫星还不够多，正在制造碰撞风险；2024
              年还发生了数起重大碎裂事件，新增数千个碎片物体。NASA 的 Orbital Debris Program Office 维护 ORDEM、LEGEND
              等专用工具，正是因为碎片风险不是理论问题，而是必须建模和管理的工程、运营与安全问题。Cowboy 的拟议规模会放大这项负担。每颗卫星都很重，都必须安全机动，最终也都需要按 FCC 五年基准处置。这意味着
              Cowboy 最终会继承一个持续存在的会合管理和寿命末期排队问题，而不是一次性清理任务。天文观测又增加了外部性。AAS
              警告，超过一百万颗已申请卫星中哪怕只有一小部分发射，也可能显著损害光学、红外和射电观测，并恶化轨道可持续性。SATCON1 和 JASON/NSF
              星座报告也都强化了这一点：这些影响足够严重，需要专门的缓解工作。即使 Cowboy 小于部分竞争对手的申请规模，它仍会显著增加天文台和轨道公域承受的累积负担。
