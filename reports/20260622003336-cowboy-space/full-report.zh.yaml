      - number: '4.4'
        title: 单位经济与现金续航情景
        blocks:
          - type: paragraph
            body: >-
              Cowboy Space
              未公开披露任何单位经济数据——毛利率、CAC、回本期、净收入留存，或单星贡献利润。本章所有估算都来自可比公司和公开硬件成本基准，必须通过直接财务尽调验证。基于人数的烧钱建模，是近期最主要的财务视角：到 2026
              年底计划 40–60 名员工，在航空航天语境下（硬件工程师、火箭科学家、监管法律顾问、软件团队），每人全成本薪酬 $250K–$350K，意味着仅工资负担每月约
              $1.0M–$1.75M。加上场地成本、仿真用云计算、测试硬件采购以及监管 / 法务支出，当前团队规模下合理月运营烧钱区间为 $3M–$8M；随着开发项目加速，可能升至 $8M–$15M。以 $275M
              Series B 计算，若按每月 $5M 的中位烧钱且不出现资本开支峰值，现金续航约 55 个月（4.6 年）；若每月 $10M（重开发阶段），现金续航 收缩至约 27
              个月。这些情景假设没有额外收入或资本流入。隐含的 Series A 到 Series B 估值跃升相当大：若假设 Series A 投后 $150M–$200M（符合 Index Ventures 领投 $50M
              轮次的典型持股目标），$2B Series B 意味着约 12 个月内跃升约 10–13 倍——即便在 2025–2026 年 AI 太空投资气候下也很激进，更像论点阶段而非牵引阶段定价。SAIC
              作为战略产业伙伴而不只是财务投资人的参与，增加了一个纯 VC 无法仅凭公开数据完全定价的期权维度。
