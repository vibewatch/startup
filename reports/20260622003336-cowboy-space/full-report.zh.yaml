      - number: '2.4'
        title: 增长驱动与时点
        blocks:
          - type: paragraph
            body: >-
              最强增长驱动，是已有文件证明的地面电网并网积压。Construct Capital 和 Cowboy Space 的 FCC 申请都称， 主要市场的 AI
              数据中心需求正在超过电网容量，形成一个持续多年的窗口期，让包括轨道方案在内的替代路径拥有结构性优势。 Goldman Sachs 预计，到 2030 年美国数据中心将使用美国 8% 电力，到 2028 年 AI
              将占数据中心电力需求的 19%， 紧迫性进一步上升。EIA 的月度跟踪确认，截至 2026 年 3 月，美国总用电需求同比增长 4.5%，与数据中心建设叙事相符。


              第二个驱动是发射成本下降。可重复使用运载火箭自 2010 年以来显著降低了每公斤 LEO 成本， Cowboy Space 的一体化上面级架构则试图通过消除火箭与载荷之间的边界，进一步压缩发射成本。
              公司架构——变成数据中心的上面级——建立在商业发射竞争持续存在的前提上。第三个驱动是 NVIDIA 合作： Space-1 Vera Rubin 模块是 NVIDIA 在 2026 年 3 月 GTC
              上发布的专用 LEO AI 加速器， Cowboy 与 NVIDIA 的先发合作释放出硬件生态已准备好的信号。


              时点仍不确定。首次 Stampede 发射目标是 2028 年，且按 Cowboy 自己的 FCC 申请，卫星设计明确尚未完成。
              电网瓶颈真实存在，但并非永久：公用事业正在投资，地面运营商也在把数据中心与可再生能源共址、使用液冷， 并推进核电购买协议。竞争窗口可能比当前排队情况暗示的更窄。
