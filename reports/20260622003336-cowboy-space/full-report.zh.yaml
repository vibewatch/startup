            title: 垂直整合是 Cowboy 可防守的论点——前提是火箭跑得通
            body: >
              没有其他纯 ODC 初创公司在造自己的火箭。如果 Cowboy 到 2028–2029 年成功开发运载火箭，就能控制轨道计算里最紧缺的一项资源：成本有竞争力的发射舱位。Cowboy CEO
              在调研商业发射供应商后确认了这个供给瓶颈；在关键的 2026–2032 年窗口，市场力量本身解决不了它。论点成立，但执行风险极高。
