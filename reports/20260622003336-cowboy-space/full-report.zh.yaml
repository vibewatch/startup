          description: TAM 最大，但近期准备度最低；地面扩张（Stargate）会吃掉近期需求
    approximationNotes: >-
      评分为分析师给出的定性评级（1=最低，5=最高），依据截至 2026 年 6 月公开证据中已点名需求信号、 付费意愿指标和采购路径清晰度。未取得 Cowboy Space 的管线或 CRM 数据；评分反映市场分析，
      而非公司自身数据。
    claimRefs:
      - CU005
      - CU006
      - CU008
      - CU036
      - CU037
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 在可见公开缓释措施之后，横向比较 Cowboy Space 最高的剩余风险。
    data:
      columns:
        - 热验证
        - 火箭研发
        - FCC 路径
        - 碎片 / 离轨
        - 客户采用
      rows:
        - label: 发生概率
          values:
            - 高
            - 高
            - 中
            - 高
            - 高
        - label: 影响
          values:
            - 高
            - 高
            - 高
            - 高
            - 高
        - label: 缓释成熟度
          values:
            - 低
            - 低
            - 低
            - 低
            - 低
        - label: 剩余严重性
          values:
            - 高
            - 高
            - 高
            - 高
            - 高
    claimRefs:
      - CR004
      - CR011
      - CR019
      - CR031
      - CR043
      - CR045
  - id: FR002
    title: 风险传导图
    type: dag
    summary: 未完成的架构、发射执行和监管关口如何传导为进度和估值压力。
    data:
      nodes:
        - id: n1
          label: 卫星设计未完成
        - id: n2
          label: 热 / 辐射验证缺口
        - id: n3
          label: 火箭研发计划
        - id: n4
          label: FCC / FAA 审批路径
        - id: n5
          label: 全尺寸演示推迟
        - id: n6
          label: 收入前周期拉长
        - id: n7
          label: 后续融资需求
        - id: n8
          label: 估值压力
      edges:
        - from: n1
          to: n2
          label: 新颖集成需要证明
        - from: n1
          to: n5
          label: 改装和测试仍未完成
        - from: n2
          to: n5
          label: 资质缺口拖慢准备度
        - from: n3
          to: n5
          label: 运载工具延误拖后全尺寸任务
        - from: n4
          to: n5
          label: 审批卡住部署
        - from: n5
          to: n6
          label: 商业化启动后移
        - from: n6
          to: n7
          label: 收入前烧钱更多
        - from: n7
          to: n8
          label: 执行折价扩大
    claimRefs:
      - CR003
      - CR010
      - CR013
      - CR019
      - CR023
      - CR038
      - CR050
  - id: FR003
    title: 依赖关系图
    type: dag
    summary: 供应商、监管机构、演示和客户之间的关键依赖。
    data:
      nodes:
        - id: d1
          label: NVIDIA Space-1 栈
        - id: d2
          label: 自有火箭
        - id: d3
          label: FCC 和 FAA 批准
        - id: d4
          label: 光网络和地面站
        - id: d5
          label: Galactic Brain 演示
        - id: d6
          label: 锚定客户
        - id: d7
          label: 20,000 颗卫星扩张
      edges:
        - from: d1
          to: d5
          label: 计算载荷依赖
        - from: d2
          to: d7
          label: 发射节奏依赖
        - from: d3
          to: d7
          label: 法定权限依赖
        - from: d4
          to: d6
          label: 服务质量依赖
        - from: d5
          to: d6
          label: 演示必须转化为信任
        - from: d6
          to: d7
          label: 需求必须支撑扩张
    claimRefs:
      - CR011
      - CR019
      - CR042
      - CR044
      - CR046
      - CR050
      - CR051
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: |
      从市场现实、产品状态、风险结构和估值，推导出审慎推进建议。
    data:
      nodes:
        - id: mkt
          label: AI 计算需求：结构性且增长中（真正驱动因素）
        - id: odc
          label: ODC 结构性论点：说得通，但规模化尚未证明
        - id: tech
          label: 技术状态：收入前；1 MW 热管理未验证；火箭未造出
        - id: risk
          label: 风险栈：极高——技术、监管、资本强度、SpaceX 竞争
        - id: val
          label: 估值：$2B 投机溢价；无收入倍数可套用
        - id: comp
          label: 可比对象：ODC 类别仍早期；Starcloud $1.1B；CoreWeave 需要收入支撑
        - id: rec
          label: 建议：继续研究 / 审慎轨道——按里程碑重新评估
      edges:
        - from: mkt
          to: odc
        - from: odc
          to: tech
        - from: tech
          to: risk
        - from: risk
          to: val
        - from: val
          to: comp
        - from: comp
          to: rec
    approximationNotes: 流程代表分析链条；不是因果模型。
    claimRefs:
      - CV007
      - CV021
      - CV022
  - id: FV002
    title: 估值敏感性——里程碑和收入情景
    type: bar
    layout: standard
    summary: |
      以 $2B Series B 入场价和 AI 基础设施可比倍数为锚，展示不同里程碑和收入结果下的示意隐含估值。
    data:
      items:
        - label: 熊市：技术失败 / 下轮降估值
          value: 0.65
        - label: 当前：Series B（2026 年 5 月，无收入）
          value: 2
        - label: 基准：里程碑延后 12–24 个月
          value: 3
        - label: 基准+：首个 ODC 客户合同（2028E）
          value: 4.5
        - label: 牛市：$100M ARR，按 30x AI 基础设施倍数
          value: 8
        - label: 牛市+：$500M ARR，按 20x neocloud 倍数
          value: 11
    approximationNotes: |
      数值单位为十亿美元。收入倍数（20–30x）来自 Finro 和 multiples.vc 公开 AI 基础设施基准； 该倍数被投机性套用于假设中的未来 ARR；不是 DCF，也不是一致预期。
    claimRefs:
      - CV019
      - CV027
      - CV028
      - CV029
      - CV008
  - id: FV003
    title: 各情景估值 / 回报区间
    type: range
    layout: standard
    summary: |
      基于里程碑情景假设，给出 Cowboy Space 到 2029 年牛市、基准和熊市隐含估值区间。
    data:
      items:
        - label: 熊市：技术失败或被 SpaceX 挤出
          low: 0.3
          mid: 0.65
          high: 1
        - label: 基准：延误、竞争格局碎片化
          low: 2
          mid: 3
          high: 4
        - label: 牛市：里程碑准时达成、拿下首批客户
          low: 8
          mid: 11
          high: 15
    approximationNotes: |
      区间为截至 2029 年时间点的情景估算，单位为十亿美元。无 DCF 基础； 锚定可比私人轮次倍数和示意 ARR 情景。公司仍是收入前深科技企业，信息不对称极高，因此区间很宽。
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV036
  - id: FV004
    title: 投资 KPI 记分卡
    type: kpi
    layout: standard
    summary: |
      面向 IC 的七维评分；分数反映截至 2026 年 6 月公开证据质量。
    data:
      items:
        - label: 市场机会
          value: 4
          max: 5
          note: AI 计算需求具备结构性；ODC TAM 到 2030 年为 $2–10B+（MarketsandMarkets）；但不确定性很高
        - label: 技术证明
          value: 1
          max: 5
          note: 1 MW 热管理未验证；火箭未造出；Starcloud 已有首颗卫星，Cowboy 还没有
        - label: 商业牵引
          value: 0
          max: 5
          note: 截至 2026 年 6 月，未公开收入、积压订单、客户或 LOI
        - label: 竞争护城河
          value: 2
          max: 5
          note: 垂直整合论点有差异化；但 SpaceX 的 100 万颗卫星 ODC 计划构成生存级风险
        - label: 团队质量
          value: 4
          max: 5
          note: Baiju Bhatt（Robinhood 联合创始人）；SpaceX、NASA、Astranis、NVIDIA 工程师；顶级投资人董事会
        - label: 资本效率风险
          value: 2
          max: 5
          note: 已融资 $365M；火箭+星座在收入前还需要 $1B+；可比项目消耗 $100–650M
        - label: 估值纪律
          value: 1
          max: 5
          note: 零收入深科技公司，物理验证未跑通，却给到 $2B；Finro 2026 年 Q1 警告， 市场正在重估叙事驱动型 AI 公司
        - label: 证据质量
          value: 2
          max: 5
          note: 融资公开报道充分；财务、单位经济、股权结构或技术验证数据均未公开
    approximationNotes: |
      分数是基于截至 2026-06-22 公开证据的定性评估。量表：5 = 可达到的最佳水平； 0 = 没有正向信号证据；不是模型输出。
    claimRefs:
      - CV006
      - CV007
      - CV026
      - CV031
      - CV040
