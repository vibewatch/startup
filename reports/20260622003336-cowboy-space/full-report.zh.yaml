        title: 情景分析、敏感性与下行触发因素
        blocks:
          - type: paragraph
            body: >
              缺少收入、披露财务模型或客户合同，所有估值判断都被迫进入情景分析。三个情景覆盖了合理结果区间，核心取决于 Cowboy 能否打中 2026–2028 年里程碑序列：能量传输演示、首个 Galactic Brain
              ODC 节点、首次自研火箭发射。

              牛市情景：2026 年能量传输演示成功，2027 年 Galactic Brain ODC 节点部署，并在商业吞吐下证明热真空性能；自研火箭在 2028 年底前发射；首个商业或政府客户合同在 2028
              年中前签署。在这条路径下，Cowboy 将成为最早经过验证、且拥有自有发射能力的商业轨道数据中心基础设施运营商。到 2029 年末，隐含估值达到 $8–15B 是合理的，锚点是 CoreWeave 在收入确认后
              IPO 后倍数扩张 3.5x 的类比。

              基准情景：里程碑延迟 12–24 个月，来自 Starcloud 和 Blue Origin Project Sunrise 的竞争加剧，Cowboy 在 2029 年末以温和规模取得首笔收入。$2B
              投后标记按实际价值大致持平（$2–4B 区间），与投资者评估里程碑进展相对原始论点后，二级价格持平或温和变化的趋势一致。

              熊市情景：重大技术失败——1 MW ODC 单元热鉴定失败，或火箭项目成本膨胀超过可用资本——迫使重组或下轮降估值。如果 SpaceX 轨道数据中心大规模部署成真，并在 Cowboy 达到收入前出现，独立 ODC
              运营商的可服务市场将坍缩。在这一情景下，$0.3–1B 的下轮估值标记是合理的，与此前未能同时跨过物理和经济性闸门的深科技基础设施品类在 hype 后重定价一致。

              所有情景下，稀释路径都很重要。达到牛市里程碑序列，很可能需要在收入前再融资 $500M–$1B+；取决于后续轮次估值，从当前 Series B 后基础起算，累计稀释隐含为 40–60%+。清算优先权悬置和
              liquidation stack 仍未知。
