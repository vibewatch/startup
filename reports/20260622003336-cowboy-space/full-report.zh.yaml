      - number: '2.2'
        title: 市场规模（证据约束）
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，轨道数据中心作为独立类别，并不存在独立权威的市场规模测算。该类别尚未产生收入，
              也尚未实现规模化商业化；套用传统自上而下市场规模测算，需要假设工作负载迁移，而这些假设目前没有足够证据支撑。 本文采用证据约束方法：先锚定决定上限的地面计算和电力市场，再结合上述约束推演合理的轨道份额。


              在地面层面，AI 数据中心基础设施建设涉及超大规模云厂商每年数千亿美元级资本开支。Goldman Sachs 估计， 仅数据中心就需要美国公用事业新增 $50 billion
              发电能力；未来十年，欧洲为数据中心增长所需的电网投资超过 €800 billion。这些数字界定了 Cowboy Space 试图解决问题的量级。


              轨道 TAM 无法从公开来源推导。ODC 类别更适合被理解为一个新生子细分市场，来自两类来源：（1）AI 训练和批量推理工作负载中，
              既能容忍延迟、又高功率的部分；（2）目前缺少在轨解决方案的太空原生数据处理。SpaceX（最多 1 million 颗卫星）、 Blue Origin（最多 51,600 颗卫星）、Starcloud（最多
              88,000 颗卫星）和 Cowboy Space（最多 20,000 颗卫星） 的多份竞争性 FCC 申请，合起来说明资源充足的参与者把该类别视为可行；但这些申请是监管占位，不是市场验证。 截至本报告日期，任何
              ODC 公司都未披露收入、客户数量或签约容量。没有商业验证数据，就无法单独拆出 Cowboy Space 的 SAM 和 SOM；这一缺口已在证据缺口章节明确列出。
