              - CP006
              - CP007
              - CP008
              - CP028
          - type: callout
            title: 近期竞争来自地面 AI 云，而不是 Starcloud
            body: >
              任何在 2026–2027 年考虑轨道计算的客户，真正的选择都是今天可用的 CoreWeave/Crusoe/Voltage Park（GPU 约 $1.99/hr）与等待多年后的轨道方案。Cowboy
              的竞争叙事应承认这一点，只定位在地面方案结构性不足的用例：靠近传感器的空间处理、几乎无时延的地球观测下行数据压缩，以及主权性的非地面数据需求。若把自己定位成通用地面 AI 替代品，将输给已经商业化的 GPU 云。
