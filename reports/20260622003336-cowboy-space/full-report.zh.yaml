              投资暗示政府收入路径，但金额和采购时间表均未披露；（5）公开信息没有阐明星座扩张所需的资本循环或项目融资策略。合在一起，这些缺口意味着投资人无法独立验证商业发射所需的烧钱速度、毛利路径、单位经济或总资本需求。收入质量结论是
              N/A——没有收入可供评估质量。资本强度结论按任何基准都极端：$275M 足以支持一枚原型火箭和少数演示卫星，但比完整星座部署所需低数个数量级。这些财务尽调阻碍对于深科技种子到 Series B
