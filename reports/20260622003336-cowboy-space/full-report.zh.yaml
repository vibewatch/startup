      - number: '7.3'
        title: 监管、法律与出口管制风险
        blocks:
          - type: paragraph
            body: >-
              Cowboy 的监管路径仍未封口。关键星座申请尚未获批；FCC 公告只说已接受备案，并列出一组广泛豁免，涉及里程碑、保证金和运营规则条款。媒体报道称，Cowboy 主张这些规则是为 RF
              密集型星座设计的，并不适合一个主要依赖光学星间链路和下行链路的系统。这个论点也许自洽，但制造了明确的闸门风险：如果 FCC 拒绝、收窄或附条件批准所请求的豁免，Cowboy
              的部署时间表会更难执行。处置制度同样关键。FCC 2022 年命令把低地球轨道任务后处置基准从 25 年缩短到 5 年，原因是让卫星在轨停留数十年已不再被认为可持续。因此，一个位于 700-1,000 km、拥有
              20,000 颗卫星的系统，依赖常规主动离轨能力，而不是温和自然衰减。除 FCC 问题外，Cowboy 仍需要 FAA 发射批准；其火箭、卫星和相关技术数据也带来出口管制敞口。BIS 维护 EAR 框架，DDTC
              的 ITAR 概述也明确指出，当硬件和 know-how 与敏感航空航天类别重叠时，美国防务物项和防务服务出口管制仍然相关。公开来源尚未披露 Cowboy 的出口合规姿态、外国客户限制或内部筛查流程。
