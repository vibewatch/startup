      - number: '5.6'
        title: 技术差异化与可行性评估
        blocks:
          - type: paragraph
            body: >-
              Cowboy Space
              的差异化论点建立在三项主张上：（1）发射与计算垂直整合，消除传统火箭加卫星架构带来的质量分数损失；（2）光学星间链路避开射频星座面临的频谱拥挤；（3）自研火箭打破限制所有其他轨道数据中心项目的发射瓶颈，使其不再受制于
              SpaceX Starship 发射窗口。第一项主张有架构逻辑，但没有已展示硬件验证。第二项在技术上合理，FCC
              豁免请求也反映了真正的政策创新——光学系统不必与其他星座做频率协调。第三项是公司最大胆、也最不确定的主张：Cowboy 正进入一个由 SpaceX、Rocket Lab 和 Blue Origin
              竞争的发射市场，这些公司都有多年运营先发。TechCrunch 指出，「西方只有少数私营公司——主要是 SpaceX、Rocket Lab 和 Arianespace——能稳定发射商业火箭」，而 Blue
              Origin 的 New Glenn 在 2026 年 4 月第三次发射中未能交付载荷。相较最成熟的轨道数据中心竞争者 Starcloud（已发射首颗 H100 GPU 卫星并在 2026
              年达到独角兽地位），Cowboy 的优势是拟议规模和垂直整合；Starcloud 的优势是硬件已经在轨运行。与地面 AI 计算相比，Cowboy 在时延（LEO 过境窗口、光学下行约束）和成本（航天级 GPU
              硬件估计为地面成本的 3–10 倍）上不利，但在电力可得性和美国主要市场 5–7 年的电网互联排队时间上可能有利。SiliconAngle 指出，每颗卫星 1 MW「只相当于地面 AI
              环境处理能力的一小部分」，意味着 Cowboy 需要把许多卫星互联，才能服务超大规模训练工作负载。公司没有说明面向超过单节点容量的大模型推理或训练作业的星间集群架构。从可行性看，可以独立验证的事实是：FCC
              申报存在，NVIDIA 点名 Cowboy 为 Space-1 伙伴，Apex 确认首颗卫星合作，且公司已聘用有经验的航空航天工程师。尚未展示的主张包括：热-计算-推进一体化架构、光学 ISL
              网络性能、任何规模的轨道 AI 计算运行，以及火箭推进硬件。
            claimRefs:
              - CE050
              - CE051
              - CE052
              - CE053
              - CE054
              - CE055
      - number: '5.7'
        title: 展示材料
        blocks:
          - type: callout
            title: 排热是物理关口
            body: >-
              商业卫星在这个规模上，仅靠辐射在真空中排出 1 MW 计算废热，没有公开硬件先例。级段即散热器方案有逻辑，但未验证。如果热架构验证失败，卫星将无法在所描述的质量和外形尺寸下达到 1 MW
              计算规格——只能降低计算密度，或转向根本不同的热设计。
            calloutType: risk
            claimRefs:
              - CE032
              - CE033
          - type: callout
            title: 纯光学 ISL 是真正的频谱创新
            body: >-
              Stampede 设计上主要通过光学链路而非射频频谱运行，消除了其他大型星座都要面对的 ITU 协调负担。这不只是差异化说法——它是 FCC 豁免请求的事实基础；若获批，Cowboy 可以比同一轨道制度中依赖
              RF 的竞争者更快建设并获许运营其星座。
            calloutType: strength
            claimRefs:
              - CE016
