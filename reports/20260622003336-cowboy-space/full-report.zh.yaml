      - number: '6.3'
        title: 商业化打法与销售基础设施
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，Cowboy Space 未披露商业化打法、销售组织或客户获取路线图。公开招聘和媒体报道中没有企业销售负责人、客户经理或业务拓展岗位。GeekWire
              关于公司西雅图招聘的文章提到，计划中的 40–60 名员工聚焦卫星设计和火箭 / 推进工程——主要是技术角色，不是商业角色。

              隐含打法是 B2B
              企业直销。鉴于可寻址客户分层的规模（超大规模云厂商、国防承包商、空间站运营商），任何有意义的商业接触都需要长销售周期、复杂采购流程和深厚企业集成能力。尤其是国防客户，从需求识别到合同授予，采购流程通常需要
              12–24 个月；合规前置条件——ITAR 授权、很可能需要 FedRAMP Moderate 或 High 级，以及 CMMC 认证——会在 DoD 机构把工作负载部署到第三方轨道平台前增加大量提前期。

              SAIC 的战略投资，是进入国防分层的渠道或联合销售安排中最合理的锚点。SAIC 与 DoD CIO 组织和国防主承包商有既有关系，可能加速 Cowboy 的采购路径。不过，公开信息没有披露与 SAIC
              的正式转售、渠道伙伴或联合销售协议。整个商业进入策略仍是开放尽调项。
