      - number: '7.6'
        title: 集中度、时间线与淘汰标准
        blocks:
          - type: paragraph
            body: >-
              最后一层风险是集中度。Cowboy 的公开叙事高度集中在 Baiju Bhatt 身上，他既是创始人、资金来源，也是品类叙事者；叙事也集中在 NVIDIA 身上，它是首批轨道 AI
              节点已披露的计算伙伴。任何一个集中度本身都不致命，但叠加后会提高执行脆弱性。如果 Bhatt 的愿景、融资能力或招聘杠杆减弱，公司失去的将不只是一个普通 CEO。如果 NVIDIA
              的空间计算路线图、供给或经济性发生变化，Cowboy
              首个可见计算架构要么围绕替代栈重做，要么放慢。时间风险会放大这两项依赖。许多轨道数据中心公司仍处在申请、组件发布或早期演示阶段，而不是规模收入阶段。如果地面电力瓶颈比 Cowboy
              达到商业规模更快缓解，可服务市场可能在公司证明最难技术环节之前收窄。因此，承销框架必须有纪律。投资者不应把 20,000
              颗卫星愿景当成产品；应把它视为一个期权，只有在二元里程碑达成后才变得可信：成功的轨道计算演示、热与辐射性能证据、穿过 FCC 和 FAA
              关口的可信监管路径，以及能经受尽调的客户承诺。任何一个检查点失败，都应同时压缩时间线信心和估值。
