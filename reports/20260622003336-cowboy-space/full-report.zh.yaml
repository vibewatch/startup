      - number: '8.4'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >
              Cowboy Space 看不到近期退出路径。公司没有收入、没有披露客户合同，首个运营里程碑（Galactic Brain ODC 节点）预计在 2027 年。IPO
              或战略收购至少需要首笔商业收入和已证明的轨道数据中心运营；在基准情景下，现实窗口是 2029–2031 年。Baiju Bhatt 的机构投资者基础和此前 Robinhood 履历提供声誉背景，但不保证退出时间。

              战略收购风险不对称：SAIC 的投资释放了防务客户兴趣信号，并在商业牵引仍慢时创造潜在政府战略收购方情景。这为熊市情景下的退出价值提供了非商业底部，但更可能是部分
              acquihire，而不是全价退出。如果技术验证通过但商业模式挣扎，Blue Origin、Amazon 和 Microsoft 都是合理的战略收购方；不过公开信号尚不支持这一点。

              下方最终尽调要求，是从「继续研究」立场转向正式投资考虑所需的最低证据集。结构上最重要的缺口是 cap table 和清算优先权悬置：没有这些信息，就无法做精确回报建模。对论点最关键的缺口，是 1 MW
              规模下经过验证的热冷却概念证明，以及一套量化的单位经济模型，用来比较轨道与地面数据中心 TCO。
            claimRefs:
