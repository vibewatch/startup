          to: satellite_availability
          label: 关口 1——硬件
        - from: satellite_availability
          to: access_window
          label: 关口 2——轨道力学
        - from: access_window
          to: compute_provisioning
          label: 关口 3——软件
        - from: compute_provisioning
          to: revenue_event
          label: 关口 4——定价模型
        - from: revenue_event
          to: gross_profit
          label: 关口 5——单位经济
    approximationNotes: 所有节点都基于 Stampede 星座公开描述和可比轨道算力项目推断运营模型。截至 2026 年 6 月，没有软件栈、价格表或在轨运行卫星；这座桥只是说明依赖链，并非已确认的产品流程。
