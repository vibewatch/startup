      - number: '3.2'
        title: 邻近平台与专门型竞争者
        blocks:
          - type: paragraph
            body: >
              第二层竞争者把既有轨道平台——空间站、运营中的通信卫星、光学中继网络——用作计算节点。这些玩家不需要从零建造运载火箭或新航天器， 运营时间线快于任何从零建设的 ODC 初创公司。

              Axiom Space 是最先进的平台型竞争者。2025 年秋，它在 International Space Station 上部署 Data Center Unit-1（AxDCU-1）， 基于 Red Hat
              Device Edge 支持云计算、AI、机器学习、数据融合、存储和太空网络安全。2026 年 1 月 11 日， Axiom 将首两个专用轨道数据中心节点发射至 LEO，与 Kepler
              Communications 光学中继网络星座首批部署同步。 这些节点面向卫星、星座和航天器，设计用于支持云化数据存储和处理。Axiom 与 Spacebilt 于 2025 年 9 月宣布合作， 计划在
              2027 年交付 AxODC Node ISS，硬件来自 Spacebilt（Large In-Space Servers）、Skyloom（光学）、 Phison Electronics（Pascari
              SSD）和 Microchip Technology（PIC64 航天计算）。 这些合作说明，轨道边缘计算正在形成供应商生态；Cowboy 的一体化上面级模式绕过了该生态，但最终仍要为同一批早期采用客户竞争：
              卫星运营商、地球观测公司和空间站研究人员。

              Kepler Communications 提供光学中继原生计算。其星座在 10 颗卫星上部署 40 个 NVIDIA Jetson Orin 模块， 每个模块都是支持 AI
              和加速工作负载的计算节点，嵌在商业运营中的光学数据中继网络里。对地球观测卫星和带宽受限的航天器而言， 在 Kepler 既有基础设施上做在轨处理，可能比等待未来 Cowboy
              星座达到规模更快交付结果。Kepler 的模式 ——把计算作为网络功能，而不是专用数据中心——直接争夺 Cowboy 需要先赢下的边缘工作负载细分市场。

              Lonestar Data Holdings 瞄准存储和韧性细分市场，而不是 GPU 级 AI 计算。其 StarVault 平台把太空数据存储与加密密钥托管结合，
              定位为超出地面触达范围的主权级、灾备级备份。Lonestar 正接受其首个轨道 StarVault 的容量预订，发射时间为 2026 年 10 月。 Cloud Constellation Corporation
              运营的 SpaceBelt 至少自 2020 年以来也在推进类似的存储与连接论点，但商业规模有限， 说明轨道数据市场执行难度很高。这些专门型公司争夺安全存储和数据主权细分市场，Cowboy
              偏计算的定位并不直接覆盖该市场； 但它们也说明，近期轨道数据客户范围有多窄。

              Spacebilt 明确把自己描述为类别定义者：其网站称，公司希望「定义」太空多租户 AI 计算类别，而不是在类别内竞争， 这表明它把自己视为衡量其他玩家的基础设施标准。Spacebilt
              的多租户服务器设计，把可在轨维修系统与边缘 AI 计算结合， 代表了一条不同于 Cowboy 纵向整合单运营商上面级的市场进入路径。
