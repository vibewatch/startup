  - id: TV005
    title: 论点破裂与止损触发因素
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 热工 / 冷却认证失败
        - 1 MW 轨道数据中心未能在生产代表性条件下完成热真空认证。
        - 核心产品前提失效；无法推进商业 ODC 部署。
        - 退出或重组；该论点要求物理产品真实存在。
      - - 火箭项目较计划滑延超过 24 个月
        - 自研火箭首飞推迟到 2030 年以后，且没有可信的临时发射即服务桥接方案。
        - 垂直整合论点失效；发射依赖成本累积；资本消耗快于里程碑所能支撑的速度。
        - 用更新后的桥接发射经济性重新评估；若有机会，考虑二级市场退出。
      - - FCC 拒绝或实质性限制 Stampede 星座
        - FCC 拒绝授权 20,000 颗卫星的 Stampede，或把批准条件绑定到经济性不可承受的碎片缓解要求上。
        - 面向规模化 ODC 部署的核心市场准入前提失效。
        - 评估监管路径和时间线；可能围绕仅服务政府的星座重组。
      - - Series C 下调估值
        - Series C 定价低于 $2B 投后估值，较当前入场价格出现减记。
        - 投资者对里程碑路径的信心丧失；未来稀释加重。
        - 评估论点是否还能延续；判断里程碑滑延能否在合理资本内追回。
      - - Cowboy 首批收入前，SpaceX 已按商业条款推出 ODC
        - SpaceX 在 Cowboy 签下首个客户合同前，已部署可供商业客户使用的轨道数据中心基础设施。
        - 可服务市场实际上被资本更充足、发射一体化的竞争者抢占。
        - 退出；在当前阶段，SpaceX 的竞争替代对 Cowboy 来说是结构性不可逆。
      - - 关键推进 / 热工工程负责人离职
        - 首席推进或热管理工程师离职，且 60 天内没有指定继任者。
        - 两个不确定性最高的技术层执行风险显著上升。
        - 要求管理层说明；下一次出资前评估人才管线和留任计划。
    notes: null
    claimRefs:
      - CV039
      - CV026
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 股权结构和优先权安排
        - 按轮次列明股份数量、清算优先权、反稀释条款和参与权的完整股权结构表。
        - 不理解优先权堆叠和转换机制，就无法建模投资者回报或有效入场价格。
        - 公司法务 / 财务团队；在尽调资料室要求提供。
      - - 单位经济性和收入模型
        - 生产规模 1 MW ODC 的量化单位经济性：发射成本、硬件成本、发电成本，以及相对地面竞争 TCO。
        - 验证 ODC 在 Starship 或临时发射经济性下能否达到商业成本竞争力；这是区分牛市与基准情景的核心。
        - 公司 CFO / 业务拓展；要求提供技术和财务模型。
      - - 热工冷却技术概念验证
        - 物理测试数据，证明在热真空条件下接近或达到 1 MW 规模的散热能力。
        - 这是核心物理难题已被解决的唯一外部验证；截至目前公开证据不足。
        - 公司 CTO / 工程团队；优先要求第三方测试报告或见证测试。
      - - 客户管线和 LOI
        - 具名客户、意向书，或披露商业条款 / 定价信号的备忘录。
        - 验证政府试点兴趣之外的需求论点；SAIC 投资具有战略意义，但尚未产生收入。
        - 公司 CEO / BD 团队；若 LOI 无法披露，则安排客户背调电话。
      - - FCC 批准时间线和监管风险评估
        - Stampede 星座预计 FCC 裁定时间线；碎片缓解豁免可能性的法律分析。
        - FCC 授权位于星座部署的关键路径；这里的不确定性会显著影响基准与熊市情景。
        - 监管法律顾问；监控 FCC 案卷；跟踪 IBFS 申报。
      - - 火箭开发预算和项目风险
        - 详细火箭研发预算、烧钱速度，以及与可比小 / 中型运力项目（Relativity、Stoke、ABL）的对比。
        - 火箭开发的资本强度，是下一轮稀释或下调估值压力最可能的来源。
        - 公司 CEO / VP Engineering；要求披露项目里程碑跟踪和预算。
      - - SAIC 合同细节和政府管线
        - SAIC 战略投资的范围、金额和排他性条款，以及任何相关商业协议。
        - 政府 / 国防收入底线是近期最可信的商业上行空间；当前证据尚未量化。
        - SAIC 合作团队；公司 IR；政府合同数据库（如适用）。
    notes: null
    claimRefs:
      - CV037
      - CV030
      - CV031
