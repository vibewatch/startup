      - number: '2.3'
        title: 买方与客户细分
        blocks:
          - type: paragraph
            body: >-
              The NewSpace Economy 于 2026 年 5 月对 ODC 公司进行的综合调查，识别出五类采用画像明显不同的客户。
              地球观测运营商是最近期客户：它们在轨道上通过合成孔径雷达、高光谱成像和视频产生大量数据， 在轨处理能够减少下行负载，并加快产品交付。国防和情报客户看重韧性、前沿部署传感器的延迟降低，
              以及在地面网络中断时的基础设施韧性；SAIC 参与 Cowboy 的 Series B 被引用为国防领域兴趣信号。 空间站运营商（Axiom Space 及 ISS
              的商业继任者）需要在舱计算支持研究、乘组和空间站运营。 Lonestar Space 的「StarVault」模式瞄准第四类客户：受监管行业和政府的数据主权及安全异地存储。 最后，前沿 AI
              实验室和超大规模云厂商是长期最大目标，但摩擦也最大：数据重力、延迟、网络带宽和安全认证， 都会形成采用壁垒，近期轨道基础设施无法完全解决。


              各细分市场的预算归属和采购路径差异很大。地球观测公司通常采用商业服务合同或托管载荷协议。 国防采购集中，认证周期长；SAIC 投资可能意味着公司有意加速这条路径。超大规模云厂商有内部资本预算，
              最可能先以合作伙伴或投资人身份进入，而不是成为早期客户——Google 的 Project Suncatcher （计划到 2027 年初与 Planet
              发射两颗原型卫星）体现了这种探索姿态。轨道数据主权客户付费购买的是合规级保证， 不是原始计算密度。
