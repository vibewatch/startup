      - number: '1.4'
        title: 资本结构与投资人联盟
        blocks:
          - type: paragraph
            body: >-
              Cowboy Space 通过一系列融资，累计拿到约 $365 million 资本。种子阶段（$10 million，Bhatt 个人出资） 支撑公司从创立走到隐身期。2025 年 4 月 Series
              A（$50 million，Index Ventures 和 Interlagos 领投） 带来机构信誉和 DoD 验证。2026 年 5 月 Series B（后估值 $2 billion，融资 $275
              million，Index 再次领投） 把公司推入独角兽行列，也提供了同时扩充火箭项目、卫星工程能力和轨道计算开发所需资本。Fenwick and West LLP 在 Series B 交易中代表 Cowboy
              Space。

              投资人联盟混合了通用科技风投、深科技资本、国防战略投资人和气候资本，组合并不常见。Index Ventures 连续领投两轮机构融资， 释放出罕见信心；合伙人 Jan Hammer 在官方新闻稿中称，公司认为
              Bhatt 拥有「以第一性原理重新想象巨大市场的成熟记录」。 Breakthrough Energy Ventures（Bill Gates）带来清洁技术和能源使命，与最初 SBSP
              论点匹配，也仍然契合供能架构。 Andreessen Horowitz 和 NEA 增加通用一线品牌。Construct Capital 是一家关注实体 AI 的基金，也是公司首个机构支持者；
              该基金发文称，轨道数据中心战略正是其寻找的基础设施押注类型。SAIC 作为国防承包商投资人参投，暗示 Cowboy 可能获得 DoD 市场入口，政府对轨道计算的采购兴趣也可能延续 OECIF grant 建立的
              DoD 落点。IVP 和 Blossom Capital 则补上成长阶段资本和欧洲 VC 代表性。

              已报道总额存在小幅差异：SatNews 称已披露股权融资约 $325 million，SpaceNews 则基于 CEO 直接说法报道约 $365 million。较高数字与 TechCrunch
              的说法一致：Series B 前已从投资人融资 $80 million，再加上 Bhatt 的个人资本。 收入和烧钱速度未公开披露。
