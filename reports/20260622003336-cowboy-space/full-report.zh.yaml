  - id: FO002
    title: 垂直整合架构逻辑
    type: flow
    layout: standard
    summary: 公司的集成系统把太阳能发电、上面级数据中心设计、轨道计算运营，以及把数据传回地球企业客户串在一起。
    data:
      nodes:
        - id: solar
          label: LEO 太阳能发电
          detail: 晨昏 SSO 提供更长太阳照射；每颗卫星在 700-1000 km 轨道约发电 1 MW。
        - id: rocket
          label: 一体化运载火箭
          detail: 专用火箭；助推器和上面级按单一系统设计；载荷与运载器不分离。
        - id: upper_stage
          label: 上面级 = 数据中心
          detail: 上面级留在轨道；变成配有约 800 块 NVIDIA GPU 的 1 MW 数据中心；消除冗余质量。
        - id: compute
          label: 轨道 AI 计算（NVIDIA Space-1）
          detail: NVIDIA Space-1 Vera Rubin 模块运行 AI 工作负载；靠真空散热器做热管理。
        - id: optical_link
          label: 光学数据链路
          detail: 星间光链路作为主要数据通道；Ka-band 仅保留给 TT&C。
        - id: ground
          label: 地面站与企业
          detail: AI 工作负载结果通过光学下行链路交付给 hyperscaler 和企业客户。
        - id: stampede
          label: Stampede 星座（最多 20,000 颗卫星）
          detail: FCC 申请待批；晨昏 SSO 700-1000 km；每次发射都增加计算和电力，从而扩展规模。
