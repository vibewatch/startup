  - id: TV002
    title: 论点与反论点
    columns:
      - 论点
      - 类型
      - 证据
      - 什么会改变判断
    rows:
      - - AI 计算需求在结构上跑赢地面供给
        - 正方论点
        - Goldman Sachs、McKinsey、IEA 关于电网排队的数据；AI CapEx 超过企业收入
        - 地面建设快于预期追上；AI scaling laws 进入平台期
      - - 轨道环境提供太阳能、真空冷却，并绕开许可
        - 正方论点
        - IEEE Spectrum 和 ArsTechnica 的物理分析；Seraphim Q1 2026 ODC 投资激增
        - 地面近清洁能源替代方案以更低成本更快规模化
      - - 垂直整合（火箭 + 数据中心）消除发射依赖溢价
        - 正方论点
        - BusinessWire Series B 公告；BlackNight Space Labs 竞争分析
        - 单一环节故障（火箭或冷却）击穿整个整合溢价
      - - 顶级投资人财团（Index、a16z、BEV、IVP）验证市场创造论点
        - 正方论点
        - BusinessWire Series B；a16z 公告；Fenwick 法律确认
        - 财团集中在收入前叙事；迄今没有战略客户收入
      - - 截至 2026 年 6 月，无收入、积压订单、客户合同或披露 ARR
        - 反方论点
        - BusinessWire Series B；GeekWire；TechCrunch；IEEE Spectrum 均确认收入前状态
        - 首份披露经济条款的商业合同或 LOI
      - - ODC 物理在生产规模尚未验证：1 MW 排热未解决
        - 反方论点
        - Gartner/Register 2026 年 2 月；ArsTechnica 物理分析；SatNews 冷却问题
        - 在代表生产条件下完成 1 MW 单元热真空鉴定
      - - SpaceX 向 FCC 申请最多 100 万颗 ODC 卫星，构成生存级竞争风险
        - 反方论点
        - SpaceNews；TechCrunch 2026 年 1 月 SpaceX FCC 申请；BlackNight 分析
        - SpaceX 宣布仅供内部使用，不提供商业云服务
      - - 可比火箭项目在首个运营里程碑前已消耗 $100M–$650M+
        - 反命题
        - 财务章节；ArsTechnica；The Register 发射经济性报道
        - Cowboy 自研火箭以低于预算、早于 2029 年完成首次发射
    notes: 证据列引用的是来源类别，而非具体 claim ID；详细归因见章节 claimRefs 和可比表。
