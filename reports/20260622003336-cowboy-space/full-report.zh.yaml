        title: 收入模式与商业化路径
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 5 月 Series B 关闭，Cowboy Space
              未披露任何收入、ARR、客户合同、意向书或财务预测。按任何公开口径，公司都明确处于收入前阶段。规划中的收入模式，是向地球观测分析、国防、商业 AI
              训练和主权数据合规客户出租轨道数据中心容量——计算时间和电力。公司不卖硬件，而是打算按每计算单元或每千瓦时收费，类似云基础设施定价，但要适配 LEO 间歇接入窗口和热约束。Series B
              新闻稿列出三类优先资金用途：火箭发动机研发、卫星内嵌计算集成，以及监管合规（FCC 和频谱许可）。公司没有发布定价表、标价或参考客户试点。政府和国防合同——由 SAIC 战略投资及此前 OECIF
              概念验证锚定——是近期最可信的收入路径，因为国防采购基础设施成熟，也更能容忍新兴技术风险。来自超大规模 AI
              客户的商业收入，需要证明相较地面托管具备时延、可靠性和成本优势；这些优势目前均未得到独立验证。Construct Capital
              博文把公司的市场切入点定义为解决「能源瓶颈」，说明早期收入论点围绕那些无法在所需时间内获得地面电网容量的客户。没有已披露合同或试点，收入模式只能被视为未解题。
