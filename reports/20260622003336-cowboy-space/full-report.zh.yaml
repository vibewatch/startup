      - number: '5.2'
        title: Stampede 星座与 FCC 监管框架
        blocks:
          - type: paragraph
            body: >-
              Series B 关闭三天后，Cowboy Space 向 FCC 提交 SAT-LOA-20260323-00135 申请，针对 Stampede 星座：请求授权在 700–1,000
              公里晨昏太阳同步轨道发射并运营最多 20,000 颗非地球静止轨道卫星。按 2026 年 6 月口径，这是已向 FCC 申报的最大轨道数据中心部署计划。申报架构在技术上很独特：Stampede
              设计上主要通过光学星间链路和光学下行链路运行，而不是射频频谱；窄带 Ka-band（18.8–19.3 GHz 下行、28.6–29.1 GHz
              上行）仅保留给关键任务阶段和紧急情况下的遥测、跟踪与指令。这种光学优先设计，是 Cowboy 请求豁免 FCC 标准部署保证金和里程碑框架的基础：公司认为这些规则原本是为防止频谱囤积而设，套用到一个按设计避开拥挤
              RF 频段的系统并不适用。公司进一步主张，只需少至一颗卫星即可启动商业服务，因此可以由经济性而非监管强制推动分阶段建设。FCC Schedule S 表格数据列出四颗代表性卫星，分布在四个轨道面，远地点 /
              近地点 830–860 km，预计运营寿命五年。不过，Technical Annex 和法律叙述——承载完整 20,000 颗卫星概念——明确承认「卫星设计尚未完成，服务开始前需要修改许可证」。这种承认在 FCC
              申报中并不常见，也说明 Stampede 是监管预留和登记概念，而不是已可施工的方案。截至 2026 年 6 月，FCC 尚未批准该申请，仍在审查中。Stampede 在 FCC 队列中面对 SpaceX 最多
              100 万颗轨道数据中心卫星的申报，以及 Starcloud 最多 88,000
              颗的申报——整个轨道计算申请版图都先走监管，尚无任何星座按拟议规模进入商业运营。选择晨昏太阳同步轨道是有意为之：它最大化每日太阳照射时长，支持计算工作负载连续发电，避免其他 LEO
              轨道制度中的食季影响。700–1,000 km 的高度选择有取舍：无阻力运营寿命更长，但若主动离轨系统失效，轨道衰减时间也更长，寿命末期碎片暴露随之增加。FCC 申报没有详细说明离轨或碰撞规避方案。
