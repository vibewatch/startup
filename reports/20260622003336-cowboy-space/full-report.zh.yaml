chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与商业模式
        blocks:
          - type: paragraph
            body: >-
              Cowboy Space Corporation 是一家注册于加州 San Carlos 的轨道基础设施公司。Baiju Bhatt 于 2024 年以 Aetherflux
              之名创立公司，最初论点是用红外激光把低地球轨道的太阳能传回地面接收端。2026 年 5 月，随着 $275 million Series B 完成，公司改名为 Cowboy Space
              Corporation，并把主业转向轨道 AI 数据中心和纵向整合运载火箭； 太空太阳能不再是终端产品，而是保留下来的核心架构积木。公司网站把使命表述为「从高边疆为人类供能」 ——也就是为人工智能建设外太空电网。

              核心商业模式是纵向整合的轨道基础设施：Cowboy Space 把自研火箭、卫星上面级和在轨计算载荷设计成一个统一系统。
              火箭上面级送达载荷后不丢弃；相反，上面级本身就是卫星数据中心载荷。进入轨道后，每个单元在晨昏太阳同步轨道产生 1 MW 太阳能，并用 NVIDIA Space-1 Vera Rubin Modules 运行约
              800 个 GPU。传统架构把火箭和卫星拆成两个系统， 会产生冗余结构和质量；这一设计试图把这些冗余拿掉。收入将来自向超大规模云厂商和企业出售轨道 AI 算力容量，
              定价对标需要排多年队才能并网的地面替代方案。截至本报告日期，公司尚未产生收入。

              Cowboy Space 把市场机会锚定在一个具体的地面瓶颈：美国主要市场里，新数据中心平均并网前置时间达到五到七年甚至更久， 而 AI 算力需求增长快得多。Cowboy 认为，把计算放到连续 LEO
              太阳能旁边，并利用天然真空冷却，就能绕开限制地面扩张的 电力和冷却约束。公司 2026 年 5 月向 FCC 递交申请的「Stampede」星座，设想最多由 20,000 颗卫星提供数据中心服务。
