  - id: FE002
    title: 客户工作流——从 AI 算力请求到轨道处理
    type: flow
    layout: standard
    summary: 数据从 AI 基础设施客户进入 Stampede 地面系统、卫星上行、轨道计算，再经光下行交付结果的流程。
    data:
      nodes:
        - id: customer
          label: AI / 国防客户
          description: 提交计算任务或数据流；接收处理后的输出
        - id: ground_station
          label: 地面站（光学 + Ka-band）
          description: 通过光链路或 TT&C 链路上行任务数据或传感器流；下行结果
        - id: stampede_satellite
          label: Stampede 卫星（Galactic Brain）
          description: 在过境窗口接收数据；用 NVIDIA GPU 处理；存储结果
        - id: isl_network
          label: 光学 ISL 网络
          description: 在 Stampede 卫星之间路由数据，扩大有效覆盖窗口
        - id: optical_downlink
          label: 光下行波束
          description: 高带宽自由空间光链路把处理结果送至地面站
      edges:
        - from: customer
          to: ground_station
          label: 任务提交 / API 请求
        - from: ground_station
          to: stampede_satellite
          label: 通过光学或 Ka-band 上行
        - from: stampede_satellite
          to: isl_network
          label: 数据交接至相邻节点
        - from: isl_network
          to: stampede_satellite
          label: 汇总结果路由
        - from: stampede_satellite
          to: optical_downlink
          label: 结果传输
        - from: optical_downlink
          to: ground_station
          label: 光数据交付
        - from: ground_station
          to: customer
          label: 结果交付
    approximationNotes: 客户工作流根据 FCC 申请、公司网站和媒体描述推断；没有可运行系统；过境窗口和集群细节未说明。
