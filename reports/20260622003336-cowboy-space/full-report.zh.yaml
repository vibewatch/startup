      - number: '3.4'
        title: 竞争定位与护城河分析
        blocks:
          - type: paragraph
            body: >
              Cowboy Space 主张的主要护城河是纵向整合：掌握火箭、上面级、计算载荷、电力系统和星座后， 它能以纯卫星 ODC 竞争者做不到的方式控制成本和节奏。TechCrunch 确认，Cowboy CEO
              Baiju Bhatt 曾专门接触多家发射服务商， 并得出结论：商业发射市场过于稀缺且昂贵，轨道数据中心若没有内部发射能力，就无法在规模上实现有竞争力的单位经济性。 鉴于当前 Starship
              尚未面向第三方客户可用，以及 SpaceX 自己的 ODC 意图，这一结论在结构上成立。

              但护城河论点有明显弱点。第一，作为差异化亮点宣布的 NVIDIA Space-1 Vera Rubin 模块合作，并非 Cowboy 独占； Starcloud、Sophia Space 和 Axiom
              Space 同时也拥有该合作。NVIDIA 把四家公司都列为 Space-1 合作伙伴， 说明它没有对 Cowboy 做独家押注。第二，Cowboy 自己的 FCC
              申请明确称卫星设计尚未完成，服务开始前需要修改许可。 对一家声称在纵向整合上拥有先发优势的公司而言，这一承认并不寻常。第三，SpaceX 的 ODC 申请规模为 1 million 颗卫星， 远高于 Cowboy
              的 20,000 颗计划；SpaceX 还拥有现成 Starship 飞行器优势，Cowboy 在研火箭至少五到七年内难以匹配。

              按 FCC 申请规模排序，Cowboy 位居第三：SpaceX 为 1 million 颗卫星，Starcloud 为 88,000，Blue Origin 为 51,600， Cowboy 为
              20,000。较小星座如果率先以兆瓦级计算节点进入市场，仍可具备商业可行性；但 Starcloud 已有硬件部署先发， 说明 Cowboy 守的是时点，而不是领先地位。正面表述——20,000 颗比 1
              million 或 88,000 更有望在近期达成——是成立的， 但需要目前尚不存在的执行记录支撑。

              Cowboy 的发射自有策略，也是一把用于竞争护城河的双刃剑。要做成有竞争力的轨道数据中心业务，公司必须同时在多个领域取得突破： 火箭开发（许多资金更充足的公司都失败过的类别）、真空中 1 MW
              计算负载的热管理、NVIDIA GPU 太空级认证、 光通信网络，以及客户获取。任何单一领域执行失败，都会让纵向整合论点整体坍塌；而 Starcloud 借助既有运载火箭的模式， 每次只暴露一个执行风险。

              Cowboy 最强的结构性护城河情形，是其整合系统率先以有竞争力成本在轨道证明兆瓦级 AI 训练，并由此形成网络效应锁定。
              客户围绕特定轨道计算平台搭建数据管线、模型和工作流后，会产生切换成本——但前提是平台已经存在且商业化运营； 最早也预计要到 2028 年底以后。
