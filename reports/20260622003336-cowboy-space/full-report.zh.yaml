  - id: TV003
    title: 牛市 / 基准 / 熊市情景分析
    columns:
      - 情景
      - 关键假设
      - 隐含估值区间（2029）
      - 概率信号
      - 主要下行触发因素
    rows:
      - - 牛市
        - >-
          2026 年电力束流演示成功；2027 年 Galactic Brain ODC 部署，并跑出商业级吞吐量；自研火箭早于 2028 年发射；首批客户合同在 2028 年中签署；ODC 市场发展快于 SpaceX
          商业化进入。
        - $8–15B
        - 所有近期里程碑都必须按期兑现；此前没有 ODC 在这一规模完成验证。
        - 三层里程碑中任一层技术失败；SpaceX 在 Cowboy 之前发射商业 ODC。
      - - 基准
        - 里程碑延迟 12–24 个月；Starcloud 和 Blue Origin 竞争加剧；2029 年末实现小规模首批收入；ODC 经济性得到验证，但市场碎片化；追加融资以持平到小幅溢价完成。
        - $2–4B
        - 这与可比深科技行业在技术验证阶段历史轮次价格维持持平的情况一致。
        - 首批收入前资金耗尽；发射成本曲线恶化。
      - - 熊市
        - 热工认证失败或火箭项目成本升级；Cowboy 尚未实现收入前，SpaceX 已规模化部署 ODC；下一轮被迫下调估值； 市场未按预计时间线发展。
        - $0.3–1B
        - 这与此前深科技基础设施失败后，市场从炒作中重定价的情况一致；若市场实际上被 SpaceX 抢占，冲击会很严重。
        - FCC 拒绝 Stampede；火箭研发失败；SpaceX 率先商业化。
    notes: |
      估值区间是基于可比私募市场轮次定价和公开 AI 基础设施公司倍数推导的情景估计；并不代表 DCF 预测或分析师一致目标价。 鉴于公司尚未产生收入且私有信息不对称，概率信号只能定性判断，无法赋予精确权重。
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV040
  - id: TV004
    title: 可比估值表
    columns:
      - 公司
      - 阶段 / 状态
      - 最新估值
      - 累计融资
      - 收入 / ARR
      - 主要相关性
      - 作为可比公司的关键局限
    rows:
      - - CoreWeave (CRWV)
        - 上市公司（Nasdaq，2025 年 3 月 IPO）
        - 约 $64B 市值（2026 年 6 月）
        - $1.5B IPO + 此前股权融资
        - $6.2B TTM 收入（2026 年 6 月）
        - 领先的公开 AI 计算基础设施公司；neocloud 交易倍数为 11.8x NTM 远期收入。
        - 已有大量经常性收入和积压订单；Cowboy 收入为零——比较时必须对未经验证的里程碑路径大幅折价。
      - - Crusoe AI
        - 私营，Series E（2025 年 10 月）
        - $10B+ 投后估值
        - 累计 $3.7B+（股权 + 债务）
        - 收入可观（未披露）
        - 已具规模的私营 AI 计算基础设施；融资阶段和投资者画像直接可比。
        - 地面业务为主，且已有客户；与轨道业务风险画像不同；收入基础不可比。
      - - Starcloud（前称 Lumen Orbit）
        - 私营，Series A（2026 年 3 月）
        - $1.1B 投后估值；正寻求 $2.2B
        - 累计融资 $200M
        - 尚无收入，2025 年 11 月发射首颗卫星
        - 直接 ODC 可比：同一赛道、相近的收入前阶段、投资者基础重叠。
        - 在可比融资水平下，阶段更早、规模更小；Cowboy 的 $2B 估值比 Starcloud $1.1B 高 1.8x， 且累计融资更低。
      - - SpaceX
        - 2026 年 6 月 IPO
        - $1.75T IPO 估值
        - 数十亿美元（股权 + 债务）
        - $18–22B 收入（2025 年估计）
        - 轨道基础设施龙头；ODC 已申报 100 万颗卫星；为轨道计算竞争环境设定上限。
        - 业务高度多元；Starlink + 发射 + xAI 收入占主导；ODC 目前不是收入线；规模 / 阶段不可精确可比。
      - - Lonestar Data Holdings
        - 私营早期阶段
        - 未披露；隐含低于 $100M
        - 累计约 $12.4M（截至 2025 年末）
        - 尚无收入
        - 太空原生数据存储概念；行业同类公司。
        - 聚焦月球而非 LEO 计算；资本体量和野心小几个数量级；无法与 Cowboy 的一体化 ODC / 火箭论点直接相比。
    notes: >
      估值取最近一次公开披露融资事件；CoreWeave 市值截至 2026 年 6 月。AI neocloud / 数据中心上市公司的 NTM 远期收入倍数中位数为 11.8x（multiples.vc，2026 年 6
      月）；Cowboy 没有收入基础，无法套用收入倍数。
    enumerationScope:
      coverage: partial
      basis: >-
        Orbital data center and AI infrastructure companies with disclosed or inferred valuation; June 2026 horizon;
        excludes undisclosed rounds and non-ODC-adjacent AI infrastructure
