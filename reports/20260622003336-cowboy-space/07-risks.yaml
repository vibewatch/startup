company:
  name: Cowboy Space Corporation
chapter:
  number: 7
  title: Risks
  summary: 'Cowboy Space''s risk stack is unusually concentrated: an unfinished orbital-compute architecture, a not-yet-built Falcon-9-class rocket, a pending FCC constellation filing with requested waivers, a debris-heavy 20,000-satellite deployment concept, and a pre-revenue commercial model that depends on narrow early customers tolerating latency and regulatory friction. The company has ambition, capital, and marquee partners, but nearly every enabling layer—thermal validation, radiation hardening, launch cadence, active deorbit operations, export-control readiness, and customer conversion—still requires proof rather than extrapolation.'
sections:
- id: technical-engineering
  title: Technical and engineering risk
  body: 'Cowboy Space''s core technical bet remains concept-stage rather than flight-proven. The company and its coverage now describe a very specific target architecture: 20,000 upper-stage-derived satellites in dawn-dusk sun-synchronous orbit, each roughly 20,000-25,000 kilograms, generating about one megawatt of usable power and hosting just under 800 GPUs built around NVIDIA''s Space-1 Vera Rubin module. That specificity is helpful, but it does not change the central problem: the system the company wants to build is still unfinished. SpaceNews and SatNews both report that Cowboy told the FCC the satellite design is unfinished and will require a license modification before service begins. The same sources say the design expects the stage structure itself to act as a radiator. That creates first-order thermal risk because vacuum eliminates convective cooling and pushes waste-heat rejection into radiator area, emissivity, and reliability assumptions that have not been publicly validated
    for a one-megawatt orbital data center. Radiation is the second major engineering unknown. NASA and NOAA both describe the radiation belts as a harsh environment of energetic particles that can damage spacecraft electronics. Cowboy''s planned 700-1,000 km operating band therefore raises bit-error, latch-up, and component-lifetime questions at exactly the moment the company is depending on a newly announced space-compute module and an integrated stage-as-data-center design. Public sources describe plans and partnerships, but they do not yet provide qualification data for the integrated vehicle, radiator concept, or full compute stack.'
