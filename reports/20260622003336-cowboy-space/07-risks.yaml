- id: concentration-timing-mitigations
  title: Concentration, timing, and kill criteria
  body: 'The final risk layer is concentration. Cowboy''s public story is highly centralized around Baiju Bhatt as founder, capital source, and category narrator; it is also centralized around NVIDIA as the disclosed compute partner for the first orbital AI nodes. Neither concentration is fatal by itself, but together they increase execution fragility. If Bhatt''s vision, fundraising capacity, or recruiting leverage weakens, the company loses more than an ordinary CEO. If NVIDIA''s space-computing roadmap, supply, or economics shift, Cowboy''s first visible compute architecture must either rework around a substitute stack or slow down. Timing risk compounds both dependencies. Many orbital-data-center companies are still at the stage of filings, component announcements, or early demonstrations, not scaled revenue. If terrestrial power bottlenecks ease faster than Cowboy reaches commercial scale, the addressable market could narrow before the company proves the hardest technical pieces. That
    suggests a disciplined underwriting frame. Investors should not treat the 20,000-satellite vision as the product; they should treat it as an option that only becomes credible after binary milestones are met: a successful orbital compute demo, evidence of thermal and radiation performance, a credible regulatory path through FCC and FAA gates, and customer commitments that survive diligence. Failure at any one of those checkpoints should compress timeline confidence and valuation simultaneously.'
