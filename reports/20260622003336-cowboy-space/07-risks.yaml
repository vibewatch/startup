- id: regulatory-legal-export
  title: Regulatory, legal, and export-control risk
  body: 'Cowboy''s regulatory pathway is still open-ended. The key constellation application is not granted; the FCC public notice only says it was accepted for filing, and it lists a broad waiver package touching milestone, bond, and operating-rule provisions. Press coverage says Cowboy argues those rules were built for RF-heavy constellations and are a poor fit for a system that relies primarily on optical inter-satellite and downlink links. That argument may be coherent, but it creates a clear gating risk: if the FCC denies, narrows, or conditions the requested waivers, Cowboy''s deployment schedule becomes harder to execute. The disposal regime is similarly consequential. The FCC''s 2022 order shortened the low-Earth-orbit post-mission disposal benchmark from 25 years to 5 years because leaving satellites in orbit for decades was no longer considered sustainable. A 20,000-satellite system at 700-1,000 km therefore depends on routine active deorbit capability rather than benign natural
    decay. Separate from FCC issues, Cowboy still needs FAA launch approvals, and its rockets, satellites, and related technical data create export-control exposure. BIS maintains the EAR framework, and DDTC''s ITAR overview makes clear that U.S. defense-article and defense-service export controls remain relevant when hardware and know-how overlap sensitive aerospace categories. Public sources do not yet disclose Cowboy''s export-compliance posture, foreign-customer limits, or internal screening processes.'
