  - - Radiation tolerance
    - Qualification or flight-test results
    - No public compute-stack hardening evidence after first demo window
    - Assume higher failure rates and shorter asset life
  - - Rocket execution
    - Propulsion and vehicle milestones
    - First proprietary launch target slips materially beyond 2028
    - Haircut constellation timing and capex assumptions
  - - Regulatory path
