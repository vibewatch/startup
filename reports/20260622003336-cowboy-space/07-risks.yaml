  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: qualification-data
    missingEvidence: Integrated thermal-vacuum, radiation-hardening, and reliability test results for the full orbital data-center vehicle.
    whyItMatters: Thermal and radiation are first-order failure modes and remain the least publicly substantiated parts of the architecture.
    diligencePath: Request component qualification reports, test plans, and any integrated hardware demo data.
    relatedQuestionRefs:
    - QR009
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: rocket-industrialization
    missingEvidence: Factory plan, engine-test history, and milestone schedule for the proprietary rocket and upper-stage integration program.
    whyItMatters: A 2028 launch target is difficult to underwrite without evidence of propulsion and manufacturing readiness.
    diligencePath: Request engine-test logs, manufacturing plan, facility map, and launcher critical-path review.
    relatedQuestionRefs:
    - QR007
    relatedTableRefs:
    - TR003
    - TR004
  - type: private-evidence-only
    severity: material
    topic: deorbit-operations
    missingEvidence: Detailed conjunction-management model, disposal throughput plan, and casualty-risk analysis for a 20,000-satellite fleet.
    whyItMatters: The constellation only works if active maneuvering and post-mission disposal scale operationally.
    diligencePath: Request conjunction automation design, propellant reserves, deorbit sequencing model, and reentry-safety analysis.
    relatedQuestionRefs:
    - QR019
    relatedTableRefs:
    - TR006
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-risk-register
    missingEvidence: Customer-specific contractual, insurance, and cross-border compliance obligations beyond the public regime-level risks in TR001.
    whyItMatters: Public law and rulemaking are only part of the legal exposure for a rocket-and-satellites company selling critical infrastructure.
    diligencePath: Review customer templates, insurance placement, and any export / debris annexes that would attach to real commercial contracts.
    relatedTableRefs:
    - TR001
