  - id: expansion-concentration
    title: Expansion Potential, Concentration Risk, and Retention Gaps
    body: >
      Because Cowboy Space has no customers, all retention, NRR, GRR, and satisfaction metrics
      are structurally unavailable. The company cannot demonstrate cohort retention, contract
      renewals, or net revenue expansion from a current base that does not yet exist. This is a
      fundamental diligence gap that cannot be resolved until commercial operations begin, which
      is earliest late 2028 under Cowboy's current launch timeline.

      The concentration risk associated with a first commercial customer is extreme. Should SAIC
      or any single defense customer be the first paying entity, that customer would represent
      100% of revenue at launch — an acute dependency that would give the customer disproportionate
      negotiating leverage on pricing and contract terms. Defense contract structures would
      typically mitigate this through multi-year commitments, but those contracts come with
      compliance burdens (ITAR, FedRAMP, CMMC) that take substantial time to satisfy and can be
      revoked if requirements are not maintained.

      The expansion story is theoretically compelling: Cowboy's Stampede constellation scales
      from a single satellite to 20,000, each adding one megawatt of compute capacity. Land-and-
      expand dynamics could emerge as an initial Earth observation or defense customer proves
      out orbital processing economics and catalyzes broader adoption. Planet Labs' role as both
      a Google Project Suncatcher partner and an NVIDIA space computing partner positions it as a
      technically credible early adopter analog — though no specific engagement with Cowboy has
      been disclosed. Data sovereignty customers (sovereign nations, financial entities, government
      agencies requiring off-Earth storage) represent a longer-term expansion segment with
      structurally different procurement dynamics than the AI compute segment.
