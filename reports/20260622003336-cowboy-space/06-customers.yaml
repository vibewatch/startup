callouts:
  - calloutType: risk
    title: Zero Named Customers Is the Single Largest Risk
    body: >
      Cowboy Space has raised $365 million and reached a $2 billion valuation without a single
      named customer, signed LOI, or disclosed pilot as of June 2026. SAIC's strategic investment
      is the only customer-adjacent signal in the public record, and it carries no binding commercial
      obligation. Every element of the revenue thesis — hyperscaler demand, defense procurement,
      EO processing — remains entirely unvalidated by commercial evidence. The first commercial
      revenue is contingent on a first proprietary rocket launch targeted before end of 2028, with
      no customer commitment underpinning that timeline.
    claimRefs:
      - CU011
      - CU023
      - CU025
      - CU031

  - calloutType: risk
    title: Terrestrial AI Capacity Expansion Competes Directly With the ODC Value Proposition
    body: >
      The core Cowboy Space customer thesis — that terrestrial AI compute capacity is irreversibly
      constrained — is challenged by the scale of active mitigation. OpenAI's Stargate program
      commits up to $500 billion to terrestrial AI infrastructure; hyperscalers are pursuing
      nuclear power agreements and co-location with energy assets. If terrestrial compute supply
      expands faster than orbital infrastructure reaches commercial viability, the addressable
      customer demand pool for Cowboy Space will be materially smaller than the market-level
      energy bottleneck narrative implies.
    claimRefs:
      - CU026
      - CU027
      - CU045

  - calloutType: assumption
    title: SAIC as Strategic Anchor Customer Requires Validation
    body: >
      The bull case for Cowboy Space's defense customer segment rests substantially on SAIC's
      strategic investment evolving into a commercial anchor deployment. This is a plausible but
      entirely unconfirmed assumption. SAIC has not disclosed any commercial agreement, service
      architecture, or deployment timeline with Cowboy Space. Confirming the nature and timeline
      of SAIC's intended engagement — whether as a channel partner, prime contractor, or direct
      compute buyer — is a material diligence requirement before the defense revenue thesis can
      be underwritten.
    claimRefs:
      - CU012
      - CU013
      - CU014
      - CU035

