  - id: customer-signals
    title: Named Customer Signals and Pre-Commercial Demand Evidence
    body: >
      As of June 2026, Cowboy Space has not disclosed any named customers, signed revenue contracts,
      letters of intent, or pilot agreements. The company's CEO Baiju Bhatt stated explicitly that
      "initial commercial services will follow once we've validated performance, reliability, and
      economics at scale," confirming the company does not expect to be revenue-generating before
      its first proprietary rocket launch, targeted before the end of 2028. This is the defining
      customer-risk posture of the report: a $2 billion valuation with zero commercial validation.

      The closest named demand proxy is SAIC. SAIC participated in the Series B as a new strategic
      investor alongside IVP and Blossom Capital. Washington Technology — which covers government
      contractor investment activity — specifically flagged SAIC as the key GovCon investor name
      to watch. SAIC's strategic rationale is publicly stated: as a major DoD IT services contractor,
      it sees Cowboy Space's orbital compute capabilities as relevant to future defense workloads.
      However, SAIC has not confirmed any commercial agreement, service-level commitment, or pilot
      deployment plan with Cowboy Space.

      At the sector level, SpaceNews reported that AI company Anthropic expressed interest in using
      SpaceX's proposed orbital data centers as part of a broader compute access agreement — a
      signal that AI labs are exploring ODC demand, but one that is specific to SpaceX's system,
      not Cowboy's. NVIDIA named Cowboy Space as a partner in its Space-1 Vera Rubin Module
      program, which is a supply-side technology partnership, not a customer relationship. The
      absence of any named buyer-side relationship after two years of operation and $365 million
      raised is the most material customer gap in this diligence.
