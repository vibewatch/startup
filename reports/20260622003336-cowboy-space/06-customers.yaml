company:
  name: Cowboy Space Corporation
chapter:
  number: 6
  title: Customers
  summary: >
    Cowboy Space Corporation has zero named customers, zero disclosed contracts, and zero letters of
    intent as of June 2026. The company is entirely pre-commercial; its only named customer-adjacent
    relationship is SAIC's strategic equity investment, which signals defense-sector demand intent but
    carries no binding commercial obligation. Sector-level demand signals — including Anthropic's
    expressed interest in SpaceX orbital data centers and grid-interconnection queues stretching years
    into the future — confirm structural AI compute demand that underpins the ODC thesis, but none are
    specific to Cowboy Space. Five plausible buyer segments exist: AI hyperscalers, AI labs, defense
    and intelligence agencies, Earth observation operators, and space station/sovereign compute
    customers. All five remain entirely in the awareness-to-qualification phase; willingness to pay,
    procurement pathways, and switching dynamics are unvalidated.

sections:
  - id: buyer-segments
    title: Buyer Landscape and Potential Customer Segments
    body: >
      Cowboy Space targets customers whose AI compute and data processing needs are constrained by
      terrestrial infrastructure — primarily power availability and grid interconnection queues — and
      who could benefit from orbital compute that harvests abundant solar energy in low Earth orbit.
      The NewSpaceEconomy analysis of the ODC market identifies five early customer archetypes:
      Earth observation operators, defense and security agencies, space station users, lunar
      infrastructure firms, and AI developers facing unusual energy or location constraints. These
      segments share a narrow but financially capable profile: budgets aligned with specialized
      high-performance infrastructure, tolerance for novel supply chains, and mission needs that
      cannot be fully served by terrestrial alternatives.

      AI hyperscalers (AWS, Azure, GCP, Oracle) represent the largest theoretical market but face
      the highest adoption uncertainty. Latency-sensitive consumer and enterprise workloads are
      structurally unsuitable for orbital compute due to round-trip propagation delays, narrowing
      the viable use case to batch AI training jobs and non-latency-critical inference. Microsoft's
      Azure Orbital product line and Planetary Computer platform show hyperscaler investment in
      space infrastructure more broadly, but neither confirms interest in renting orbital compute
      from a third party like Cowboy Space. OpenAI's Stargate program, committing up to $500 billion
      to terrestrial AI infrastructure, suggests at least some hyperscaler demand will be absorbed
      by ground-based capacity expansion before orbital alternatives come online. Defense and
      intelligence buyers present a more near-term conversion path: SAIC's strategic investment is
      the clearest signal in the public record, and the prior DoD OECIF grant to Aetherflux
      establishes a government-side familiarity with Cowboy's predecessor technology.
    claimRefs:
