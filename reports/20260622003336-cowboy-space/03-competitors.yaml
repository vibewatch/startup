callouts:
  - calloutType: risk
    title: Starcloud's Hardware Lead Is Structural, Not Closeable by Funding Alone
    body: >
      Starcloud has an NVIDIA H100 in orbit, has run AI inference and training workloads, and has secured the first orbital cloud tenant (Crusoe). Cowboy Space cannot close this maturity gap through capital alone—the gap is measured in years of hardware development, regulatory approvals, and demonstrated reliability. Investors should treat Cowboy's competitive position as a 2028–2030 story, not a 2026 story.
    claimRefs:
      - CP001
      - CP002
      - CP005
      - CP033

  - calloutType: risk
    title: SpaceX ODC Filing Represents an Existential Scale Threat
    body: >
      SpaceX's 1-million-satellite ODC filing, combined with Starship cost and cadence advantages, creates an existential scaling threat that no other orbital entrant can neutralize. If SpaceX commercializes its ODC system in the early 2030s, Cowboy's 20,000-satellite plan is a rounding error in satellite count and a multiple disadvantage in launch economics. The only scenario where Cowboy maintains independent value is if SpaceX does not offer ODC services to third-party customers—a plausible but not guaranteed outcome.
    claimRefs:
      - CP006
      - CP007
      - CP008
      - CP028

  - calloutType: insight
    title: Terrestrial AI Cloud Is the Near-Term Competition, Not Starcloud
    body: >
      For any customer considering orbital compute in 2026–2027, the real decision is between CoreWeave/Crusoe/Voltage Park (available today at ~$1.99/hr GPU) and waiting years for orbital options. Cowboy's competitive framing should acknowledge this and position exclusively for use cases where terrestrial is structurally inadequate: near-sensor space processing, latency-free Earth observation downlink reduction, and sovereign non-terrestrial data requirements. Positioning as a general terrestrial AI substitute will fail against commercially available GPU clouds.
    claimRefs:
      - CP019
      - CP021
      - CP022
      - CP025

  - calloutType: strength
    title: Vertical Integration Is Cowboy's Defensible Thesis—If the Rocket Works
    body: >
      No other pure-play ODC startup is building its own rocket. If Cowboy successfully develops a launch vehicle by 2028–2029, it will control the single most constrained resource in orbital compute: launch slots at competitive cost. That supply bottleneck—confirmed by Cowboy's CEO after surveying commercial launch providers—will not resolve through market forces alone in the critical 2026–2032 window. The thesis is sound; the execution risk is enormous.
    claimRefs:
      - CP026
      - CP028
      - CP030

