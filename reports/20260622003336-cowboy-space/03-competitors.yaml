  - id: terrestrial-substitutes
    title: Terrestrial AI Cloud Substitutes
    body: >
      The most immediate competitive threat to Cowboy's stated market—power-constrained AI compute—comes not from orbital rivals but from terrestrial alternatives that are operating today. CoreWeave, Crusoe, Voltage Park, and the Stargate initiative collectively serve the workloads Cowboy intends to capture, at lower latency, lower cost, and with no launch risk.

      CoreWeave bills itself as the world's #1 AI cloud platform and offers GPU compute via Kubernetes-native environments with next-generation infrastructure including NVIDIA Vera Rubin NVL72 rack-scale systems. It delivers fast inference spin-up, managed Kubernetes and Slurm clusters, and enterprise-grade 24/7 support. CoreWeave is commercially available today, with customers including major AI model developers and enterprises. As a terrestrial operator, CoreWeave has none of Cowboy's latency challenges, can physically access and upgrade hardware, and can sign multi-year contracts against known infrastructure costs—all advantages that persist through at least the early 2030s.

      Crusoe offers AI cloud infrastructure with 99.98% claimed uptime, NVIDIA and AMD hardware including GB200 NVL72, HGX B200, and MI355x, and a managed inference service that it says delivers up to 9.9× faster time-to-first-token. Crusoe also announced a partnership to deploy Crusoe Cloud on a Starcloud satellite in late 2026—positioning it simultaneously as a terrestrial substitute and as an orbital compute customer that chose Starcloud, not Cowboy. That partnership signals that the leading AI cloud operator willing to experiment with orbital compute has already committed to a competitor.

      Voltage Park operates more than 36,000 NVIDIA Hopper, Blackwell, and Grace Blackwell GPUs with on-demand pricing starting at $1.99/hr and dedicated reserve contracts at 12+ month terms. Its customers include leading AI labs and fast-scaling startups. Voltage Park's price point and immediate availability put direct competitive pressure on any future Cowboy pricing model: if orbital compute cannot undercut or significantly outperform $1.99/hr H100 access, the economic argument for space-based AI depends entirely on use cases where terrestrial access is unavailable or prohibited.

      The Stargate Project announced $500 billion in planned US AI infrastructure investment over four years, backed by SoftBank, OpenAI, Oracle, and MGX, with immediate deployment of $100 billion beginning in Texas. Arm, Microsoft, NVIDIA, Oracle, and OpenAI are key technology partners. Stargate is not a competitor to Cowboy in the traditional sense—it builds terrestrial data centers—but it absorbs exactly the demand signal Cowboy's fundraising narrative relies on. As Stargate and similar hyperscale terrestrial programs ramp up, the urgency of the power-bottleneck thesis diminishes, grid interconnection timelines shorten, and the relative case for orbital compute weakens. This is the most strategically adverse external development for Cowboy's medium-term demand argument.

      AWS Ground Station extends cloud infrastructure into satellite operations but does not place compute in orbit; Azure Orbital offers similar ground-based satellite processing services. Neither represents orbital compute competition directly, but both reduce the premium a customer pays to avoid terrestrial infrastructure: any mission that can tolerate ground processing via AWS or Azure will not need Cowboy's orbital compute services.
