  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: competitor-pricing
      missingEvidence: No orbital data center player—Starcloud, Axiom, or Cowboy—has published pricing for orbital GPU compute services as of June 2026.
      whyItMatters: Without pricing data, it is impossible to determine whether orbital compute can undercut or meaningfully complement the $1.99/hr terrestrial GPU floor or the enterprise pricing CoreWeave/Crusoe charge. The pricing model determines the addressable market and the competitive moat.
      diligencePath: Request signed LOIs or indication-of-price from Cowboy Space for pilot customers; track Starcloud-2 commercial pricing when announced.
      relatedQuestionRefs: [QP005]
      relatedTableRefs: [TP003]

    - type: private-evidence-only
      severity: material
      topic: Starcloud-funding-status
      missingEvidence: Starcloud's total disclosed funding as of June 2026 is not publicly confirmed; the company has not announced a Series B or equivalent round comparable to Cowboy's $325M.
      whyItMatters: Funding determines whether Starcloud can sustain its commercial satellite program through 2027–2028 and whether its head start in hardware maturity will compound or erode relative to Cowboy's larger capital base.
      diligencePath: Monitor Starcloud press releases and Crunchbase filings; note whether Crusoe partnership includes equity.
      relatedQuestionRefs: [QP018]

    - type: missing-source
      severity: material
      topic: SpaceX-ODC-commercial-intent
      missingEvidence: SpaceX has not made a public statement on whether its ODC constellation is intended for internal use, third-party commercial service, or both, and has not disclosed any satellite specifications for the system.
      whyItMatters: If SpaceX ODC is intended for internal workloads only, its competitive impact on Cowboy is indirect (launch scarcity). If SpaceX intends commercial service, it would become Cowboy's most threatening direct competitor given its scale and cost advantages.
      diligencePath: Monitor SpaceX FCC application amendments and any earnings or investor commentary from SpaceX leadership; track Starlink enterprise announcements for compute bundling signals.
      relatedQuestionRefs: [QP010, QP013]

    - type: enumeration-incomplete
      severity: minor
      topic: Blue-Origin-Project-Sunrise-specs
      missingEvidence: Blue Origin's FCC filing details for Project Sunrise are not directly confirmed; reporting is based on secondary sources describing the application, not the primary filing document.
      whyItMatters: Blue Origin's actual satellite specifications, compute density, timeline, and regulatory status would clarify how directly it competes with Cowboy Space versus pursuing a broadband-plus-compute bundling strategy.
      diligencePath: Retrieve the Blue Origin FCC application from FCC IBFS once accessible; monitor Blue Origin press releases on Project Sunrise.
      relatedQuestionRefs: [QP016]
      relatedTableRefs: [TP001]

