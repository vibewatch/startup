  - id: TP004
    title: "Moat Durability and Competitive Risk Register"
    columns:
      - Moat Claim
      - Specific Competitive Threat
      - Severity
      - Diligence Ask / Mitigation Path
    rows:
      - - Vertical integration (own rocket + compute) eliminates launch supply constraint
        - SpaceX may never offer third-party launch for 20-tonne ODC payloads; competing ODC startups without rockets remain bottlenecked
        - High moat value – but contingent on Cowboy successfully developing a competitive launch vehicle
        - Verify propulsion test milestones, FAA license timeline, and per-launch cost target vs. Falcon 9 equivalent
      - - NVIDIA Space-1 Vera Rubin partnership signals compute differentiation
        - Shared with Starcloud, Sophia Space, and Axiom Space; NVIDIA is not exclusive with Cowboy
        - Low (not exclusive) – NVIDIA hardware will be a commodity in orbital compute
        - Do not rely on NVIDIA partnership as a differentiation claim; identify software or workload integration moats instead
      - - 20,000-satellite scale creates compute density advantage over Axiom/Kepler edge nodes
        - SpaceX (1M) and Starcloud (88K) filed larger constellations; Cowboy is smallest mega-constellation entrant
        - Medium – scale advantage over edge players, but Cowboy is outscaled by well-resourced peers
        - Track FCC processing timelines for all four filings; regulatory outcome may compress scale claims
      - - Proprietary upper-stage-as-data-center design reduces integration overhead
        - Cowboy's own FCC filing states the satellite design is unfinished and requires a license modification before service
        - High risk – unfinished design at FCC filing stage introduces years of additional development risk
        - Require hardware CDR (critical design review) completion before upgrade to buy/track
      - - First-mover orbital AI compute advantage creates customer lock-in
        - Starcloud is already demonstrating AI workloads in orbit; Axiom has ISS hardware live; Cowboy's first demo is 2027 at earliest
        - High risk – Cowboy is not first mover; it is fourth to hardware deployment behind Starcloud, Axiom/Kepler, and potentially others
        - "Clarify customer pipeline — are any Earth observation or defense customers committed to Cowboy specifically?"
      - - Terrestrial AI power bottleneck creates persistent structural demand for orbital compute
        - Stargate ($500B), grid upgrades, nuclear agreements, and energy-efficient chips may reduce the power-bottleneck urgency before Cowboy's first commercial launch
        - Medium risk – demand thesis is valid today but the 2028–2030 window is when it must be proven; terrestrial buildout is accelerating
        - Track terrestrial power grid interconnection queue progress and nuclear data center agreements annually
    notes: "Severity assessments are author judgment based on sourced evidence; they are not quantitative scores. Moat claims are paraphrased from Cowboy Space FCC filing and investor communications."
