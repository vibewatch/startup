- id: customer-segments
  title: Buyer and Customer Segments
  body: >-
    The NewSpace Economy's comprehensive May 2026 survey of ODC companies identifies five customer segments
    with meaningfully different adoption profiles. Earth observation operators are the nearest-term customers:
    they generate large data volumes in orbit from synthetic aperture radar, hyperspectral imaging, and
    video, and processing in orbit reduces downlink load while accelerating product delivery. Defense
    and intelligence customers value resilience, latency reduction for forward-deployed sensors, and infrastructure
    resilience against ground-network disruption; SAIC's participation in Cowboy's Series B is cited as
    a signal of defense-sector interest. Space station operators (Axiom Space and commercial successors
    to ISS) require onboard compute for research, crew support, and station operations. The Lonestar Space
    "StarVault" model targets a fourth segment: data sovereignty and secure off-site storage for regulated
    industries and governments. Finally, frontier AI labs and hyperscalers represent the largest long-run
    prize but face the greatest friction: data gravity, latency, network bandwidth, and security accreditation
    all create adoption barriers that near-term orbital infrastructure cannot fully address.


    Budget ownership and procurement paths differ sharply across segments. Earth observation companies
    typically operate on commercial service contracts or hosted-payload agreements. Defense procurement
    is centralized with long accreditation cycles; the SAIC investment may signal an intent to accelerate
    that path. Hyperscalers have internal capital budgets and are most likely to enter as partners or
    investors rather than early customers—Google's Project Suncatcher (two prototype satellites planned
    with Planet by early 2027) exemplifies this exploratory posture. Orbital data sovereignty customers
    pay for compliance-grade assurance, not raw compute density.
