- id: market-sizing
  title: Market Sizing (Evidence-Constrained)
  body: >-
    No independent authoritative market sizing for orbital data centers as a distinct category existed
    as of June 2026. The category is pre-revenue and pre-commercial at scale, and applying conventional
    top-down market sizing would require speculative assumptions about workload migration that are not
    yet supportable. The approach here is evidence-constrained: anchor on the terrestrial compute and
    power markets that define the ceiling, then reason about the plausible orbital share given the constraints
    documented above.


    At the terrestrial level, the AI data center infrastructure buildout involves hundreds of billions
    in annual capex from hyperscalers. Goldman Sachs estimates US utilities need $50 billion in new generation
    capacity for data centers alone; European grid investment requirements for data center growth exceed
    €800 billion over the coming decade. These figures bound the scale of the problem Cowboy Space is
    trying to solve.


    The orbital TAM is not derivable from public sources. The ODC category is best understood as a nascent
    sub-segment carved from two sources: (1) the share of AI training and batch-inference workloads that
    are latency-tolerant and high-power, and (2) space-native data processing that currently lacks an
    in-orbit solution. Multiple competing FCC filings from SpaceX (up to 1 million satellites), Blue Origin
    (up to 51,600 satellites), Starcloud (up to 88,000 satellites), and Cowboy Space (up to 20,000 satellites)
    collectively indicate that well-resourced actors treat the category as viable, but these filings are
    regulatory placeholders, not market validation. No revenue, customer count, or contracted capacity
    has been disclosed by any ODC company as of this run date. The SAM and SOM for Cowboy Space cannot
    be isolated without commercial validation data, and this gap is noted explicitly in the evidence gaps
    section.
