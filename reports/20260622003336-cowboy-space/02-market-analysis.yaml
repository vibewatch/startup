  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: market sizing gap
    missingEvidence: >-
      Independent analyst market sizing for the orbital data center segment (TAM, SAM, SOM) from a firm
      with a track record in infrastructure or space markets (e.g., Grand View Research, IDC, Gartner,
      SpaceWorks).
    whyItMatters: >-
      Without independent sizing, all valuation and market narrative rests on the company's own projections
      and terrestrial analogies. The absence prevents any rigorous SAM/SOM derivation.
    diligencePath: >-
      Commission or purchase orbital compute market study; alternatively, triangulate from hyperscaler
      capex deferrals, Earth observation market size, and defense edge compute procurement budgets.
    relatedQuestionRefs:
    - QM001
    - QM009
  - type: private-evidence-only
    severity: material
    topic: ODC unit economics
    missingEvidence: >-
      Cost per GPU-hour for Stampede orbital compute versus terrestrial alternatives (AWS, Azure GCP spot
      instances; Crusoe energy-co-located). No public cost modeling or pro-forma has been released.
    whyItMatters: >-
      Unit economics determine whether hyperscaler customers will migrate batch AI training to orbit and
      define the pricing ceiling for ODC services. Without this, the business model is unvalidatable from
      public sources.
    diligencePath: >-
      Request from Cowboy Space under NDA; compare to Starcloud's published white paper cost model at
      starcloud.com/wp.
    relatedQuestionRefs:
    - QM025
  - type: missing-source
    severity: material
    topic: thermal management
    missingEvidence: >-
      Engineering data or published analysis on thermal management for 1 MW of processor load in vacuum
      using large-area passive radiators; no peer-reviewed study or operational precedent at this scale.
    whyItMatters: >-
      If 1 MW radiative cooling is not achievable within the proposed satellite mass budget, the Stampede
      constellation design is not viable. This is the primary technical risk SatNews identifies.
    diligencePath: >-
      Review SBIR/STTR awards in high-power satellite thermal management; ask Cowboy Space for a thermal
      design review or comparison to existing high-power satellite precedents (e.g., Solar Power Satellite
      studies).
    relatedQuestionRefs:
    - QM007
  - type: missing-source
    severity: material
    topic: grid interconnection data
    missingEvidence: >-
      Quantitative data on US and European grid interconnection queue lengths, wait times per ISO/RTO,
      and projected clearance timelines. FERC and LBNL publish queue data but current-year authoritative
      URL was not accessible during this research run.
    whyItMatters: >-
      The length and rate of clearance of the interconnection backlog sets the duration of Cowboy Space's
      competitive window. If queues clear by 2026–2027, the 2028 first-launch timeline may be too late
      to capture the window.
    diligencePath: >-
      Access LBNL Interconnection Queue Tracker (emp.lbl.gov/interconnection_queues) directly; review
      FERC Form 728 filings for major ISOs; obtain GridStrategies LLC annual queue analysis.
    relatedQuestionRefs:
    - QM006
  - type: enumeration-incomplete
    severity: minor
    topic: customer segments
    missingEvidence: >-
      Named customer commitments, letters of intent, or demand reservation agreements from any buyer segment
      (Earth observation, defense, commercial stations). All segment analysis is inferred from company
      communications and market commentary.
    whyItMatters: >-
      The buyer/segment map rests entirely on stated strategy and investor rationale, not confirmed demand.
      Without even early indications of customer intent, the segment priorities are speculative.
    diligencePath: >-
      Request from Cowboy Space any signed LOIs, MoUs, or hosted-payload agreements; check FCC application
      exhibits for named partners.
    relatedQuestionRefs:
    - QM004
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: minor
    topic: regulatory
    missingEvidence: >-
      Secure World Foundation's formal public comments on Cowboy Space's Stampede FCC application were
      not available as of June 2026 (application filed May 14, 2026; comment period may not have closed).
    whyItMatters: >-
      SWF's comments on SpaceX and Starcloud set precedent for the regulatory scrutiny large constellations
      will face. Cowboy Space's own regulatory path depends on how the FCC responds to the same issues
      raised in those proceedings.
    diligencePath: >-
      Monitor FCC docket for Stampede (IBFS filing SAT-PDR-20260514-00022) comment filings; subscribe
      to SWF and ITU mailing lists.
    relatedQuestionRefs:
    - QM021
    - QM026
  - type: missing-source
    severity: material
    topic: data gravity
    missingEvidence: >-
      Quantitative analysis of what fraction of AI training datasets could practically be staged to orbit
      versus those that must remain terrestrial, and what additional data pipeline cost and latency would
      result.
    whyItMatters: >-
      Data gravity determines the realistic size of the AI training workload addressable by orbital compute.
      If the transfer cost and latency are prohibitive for most training data, the largest potential customer
      segment (frontier AI labs) is effectively locked out.
    diligencePath: >-
      Review Cowboy Space's data ingestion architecture documentation; ask for a worked example of a specific
      model-training pipeline end-to-end including data staging costs; compare to terrestrial batch-transfer
      costs.
    relatedQuestionRefs:
    - QM020
  - type: missing-source
    severity: minor
    topic: switching costs
    missingEvidence: >-
      Analysis of the switching costs and lock-in dynamics for customers who commit workloads to orbital
      infrastructure versus terrestrial alternatives; no public precedent exists for orbital compute contracts.
    whyItMatters: >-
      High switching costs could benefit Cowboy Space once a customer adopts (lock-in moat), but they
      also impede initial adoption since customers face high commitment risk with unproven technology.
    diligencePath: >-
      Request sample term sheet or indicative service agreement from Cowboy Space; compare to terrestrial
      co-location and cloud reserved-instance contract structures.
    relatedQuestionRefs:
    - QM024
  - type: missing-source
    severity: material
    topic: orbital debris risk
    missingEvidence: >-
      Independent analysis of cumulative collision probability and post-mission disposal performance for
      a 20,000-satellite constellation at 700–1,000 km; Secure World Foundation's comment on Cowboy's
      FCC docket not yet filed as of June 2026.
    whyItMatters: >-
      Debris risk affects insurance pricing, regulatory approval timeline, and third-party liability—all
      of which affect the total cost of capital and the regulatory path for the Stampede constellation.
    diligencePath: >-
      Monitor FCC Stampede docket (SAT-PDR-20260514-00022) for SWF comments; review NASA Orbital Debris
      Program Office conjunction risk analysis; request Cowboy Space collision avoidance and disposal
      plan.
    relatedQuestionRefs:
    - QM013
acknowledgedWarnings:
- dimension: tableNotes
  reason: >-
    TM003 (Segment/Buyer Map) and TM001 (Market Definition) are partly analytical constructs synthesized
    from multiple sources rather than pure factual snapshots. Notes are provided on both tables explicitly
    flagging the analytical basis, consistent with the tableNotes guidance for tables containing estimates
    or partial coverage. The acknowledgedWarnings entry is added because the segment-level adoption readiness
    ratings in TM003 are qualitative analyst assessments, not independently audited metrics.
