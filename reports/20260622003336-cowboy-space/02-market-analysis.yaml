- calloutType: assumption
  title: No Independent ODC Market Sizing Exists
  body: >-
    All market sizes cited for orbital data centers as of June 2026 are either company-claimed projections
    or extrapolations from the terrestrial compute market. No independent analyst firm has published a
    peer-reviewed orbital data center TAM/SAM/SOM as of this run date. Sizing presented here uses an evidence-constrained
    framework anchored to documented terrestrial demand and power constraints, not a single top-down estimate.
