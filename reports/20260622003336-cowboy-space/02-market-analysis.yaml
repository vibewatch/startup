callouts:
- calloutType: insight
  title: Grid Bottleneck Is Real but Temporary
  body: >-
    The terrestrial power grid interconnection backlog is the strongest near-term tailwind for orbital
    data centers. However, it is a temporary structural friction, not a permanent market condition. Utilities
    are investing billions in new generation capacity, and data center operators are pursuing grid-bypass
    solutions (nuclear PPAs, co-located solar, liquid cooling) that do not require orbital infrastructure.
    Cowboy Space's value proposition is most durable if it can prove unit economics before terrestrial
    alternatives close the gap.
  claimRefs:
  - CM005
  - CM009
  - CM033
- calloutType: risk
  title: Thermal and Debris Risks Are Unresolved Pre-Revenue
  body: >-
    Cooling one megawatt in vacuum at Stampede's proposed scale has not been demonstrated. The combination
    of unfinished satellite design (per FCC filing), debris liability at 700–1,000 km, and no commercial
    revenue as of June 2026 means the market thesis rests on engineering bets that have not cleared. Investors
    should treat the orbital TAM as aspirational until at least one Stampede satellite completes an end-to-end
    compute mission.
  claimRefs:
  - CM034
  - CM035
  - CM036
