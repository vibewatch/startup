- id: adoption-constraints
  title: Adoption Constraints and Skeptical Analysis
  body: >-
    Several adoption barriers are significant enough to condition the entire market thesis. SatNews editor
    Nick David, writing a detailed analysis after Cowboy's Series B, identified four unresolved bottlenecks
    that the company must solve simultaneously: launch supply, thermal management, data gravity, and unit
    economics. Thermal management is singled out as particularly non-trivial: dissipating one megawatt
    of heat in vacuum requires large radiators pointed into cold space, and the mass, area, and pointing
    requirements for radiative cooling at megawatt scale have not been demonstrated at Stampede's proposed
    scale. The physics of heat rejection in vacuum is fundamentally different from terrestrial cooling,
    and no operational ODC has demonstrated 1 MW thermal throughput.


    Data gravity is the second structural constraint. Most AI training data originates on Earth and is
    already stored in terrestrial cloud infrastructure; the cost and latency of moving training datasets
    to orbit and back is not addressed in public materials. Low Earth Orbit introduces round-trip latencies
    of 10–500 ms depending on architecture, which precludes latency-sensitive inference and interactive
    applications entirely. The debris risk of a 20,000-satellite constellation at 700–1,000 km is acknowledged
    in the FCC filing and flagged by SatNews as a liability that the optical-only architecture mitigates
    but cannot eliminate. Secure World Foundation comments on the SpaceX and Starcloud FCC filings call
    for phased authorization, system-level risk analysis, and clearer post-mission disposal standards—precedents
    that may govern Cowboy's regulatory path as well. The satellite design is explicitly unfinished, per
    Cowboy's own FCC filing, which states a license modification will be required before service begins.
    Taken together, these constraints mean that a credible bear case is not hard to articulate: terrestrial
    data centers may solve the power problem through co-location with renewables and nuclear PPAs before
    orbital infrastructure reaches commercial scale.
