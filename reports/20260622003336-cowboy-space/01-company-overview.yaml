  - id: leadership-team
    title: Leadership and Key Technical Team
    body: >-
      Baiju Bhatt serves as Founder and CEO and is the singular public face of Cowboy Space. His founder-market
      fit rests on three pillars: physics credentials (Stanford BA/MS in physics and mathematics), personal
      capital at risk (approximately $10 million seed plus participation in the Series B), and a prior track
      record of building Robinhood from zero to a multi-billion-dollar public financial platform. He has
      stated publicly that the scale of Cowboy Space's ambition—building a rocket, a constellation, and an
      orbital compute platform simultaneously—requires a founder willing to make unconventional first-principles
      bets. Key-person risk is high: the company's brand, fundraising narrative, and investor relationships are
      closely tied to Bhatt's credibility and personal vision.

      The technical leadership Bhatt has assembled draws heavily from the established commercial space
      industry. Tyler Grinnell, former SpaceX director of launch operations, is responsible for launch
      operations. Warren Lamont, who led rocket engine and booster stage development at Blue Origin, heads
      propulsion engineering out of the new Seattle office. David Larson, with backgrounds at both SpaceX
      and Amazon Kuiper, serves as Director of Satellite Engineering, also in Seattle. Broader team
      backgrounds span NASA/JPL, Astranis, Anduril, Lockheed Martin, and the US Navy, giving the company
      relevant depth across propulsion, avionics, spacecraft design, and defense applications. As of May 2026,
      GeekWire reported 18 open positions in Seattle alone, with management projecting 40-60 total Seattle
      employees over the near term. The full company headcount was not publicly disclosed.
