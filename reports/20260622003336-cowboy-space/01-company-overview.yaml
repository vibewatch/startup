  - id: capital-investors
    title: Capital Structure and Investor Syndicate
    body: >-
      Cowboy Space has accumulated approximately $365 million in total capital through a structured progression
      of rounds. The seed phase ($10 million, Bhatt personal) funded the founding through stealth. The April
      2025 Series A ($50 million, Index Ventures and Interlagos leading) added institutional credibility and
      DoD validation. The May 2026 Series B ($275 million at $2 billion post-money, Index leading again)
      vaulted the company to unicorn status and provided the capital needed to simultaneously staff a rocket
      program, satellite engineering capability, and an orbital compute development effort. Fenwick and West
      LLP represented Cowboy Space in the Series B transaction.

      The investor syndicate reflects an unusual mix of generalist tech venture, deep-tech, defense-strategic,
      and climate capital. Index Ventures leading both institutional rounds signals unusual conviction; partner
      Jan Hammer is quoted in the official press release saying the firm sees Bhatt as having "a proven track
      record of reimagining massive markets from first principles." Breakthrough Energy Ventures (Bill Gates)
      brings a cleantech and energy mandate that aligned with the original SBSP thesis and remains relevant
      to the power-delivery architecture. Andreessen Horowitz and NEA add generalist tier-one brand. Construct
      Capital, a physical-AI-focused fund that was the company's first institutional supporter, authored a
      blog post describing the orbital data center strategy as the kind of foundational infrastructure bet
      the fund seeks. SAIC's participation as a defense contractor investor signals potential DoD market
      access and government contracting interest in orbital compute, extending the DoD foothold established
      by the OECIF grant. IVP and Blossom Capital round out the growth-stage and European VC representation.

      There is a minor discrepancy in reported totals: SatNews cited approximately $325 million in disclosed
      equity, while SpaceNews reported approximately $365 million based on a direct CEO statement. The higher
      figure is consistent with TechCrunch's account of $80 million raised from investors prior to the Series B
      plus Bhatt's personal capital. Revenue and burn rate are not publicly disclosed.
