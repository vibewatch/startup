  - id: technology-regulatory
    title: Technology Architecture, Roadmap, and Regulatory Status
    body: >-
      The core technology bet is vertical integration of launch and compute. Traditional orbital architectures
      treat rockets as workhorse delivery vehicles and satellites as cargo; Cowboy Space merges the rocket's
      upper stage with the compute payload into a single vehicle. Each Stampede satellite-data-center module
      is projected to weigh 20,000-25,000 kilograms, generate 1 megawatt of usable power from continuous
      solar exposure in dawn-dusk sun-synchronous orbit, and host approximately 800 GPUs via NVIDIA Space-1
      Vera Rubin Modules—a product that NVIDIA has positioned as purpose-built LEO AI infrastructure. The
      vehicle would be larger than SpaceX's Falcon 9 but smaller than Starship.

      The planned technology demonstration sequence has three stages. First, a subscale power-beaming test
      satellite built by Apex Space is targeted for launch in 2026 to validate space-to-Earth infrared laser
      power transmission—carried over from the Aetherflux roadmap. Second, an early "Galactic Brain" data
      center node using NVIDIA modules is planned for early 2027 to demonstrate orbital AI compute powered
      by solar energy. Third, the first proprietary rocket launch carrying a full 1-megawatt data center
      upper stage is targeted no earlier than end of 2028. The company also intends to develop its own rocket
      engine—the most capital- and time-intensive component—and is still finalizing test, manufacturing, and
      launch facility requirements.

      On the regulatory front, Cowboy Space filed FCC application SAT-LOA-20260323-00135 in May 2026 for
      authority to deploy and operate up to 20,000 non-geostationary orbit satellites under the Stampede
      designation. The application was accepted for filing per FCC public notice dated June 12, 2026.
      Stampede would operate primarily via optical inter-satellite links, requesting narrow Ka-band spectrum
      only for telemetry, tracking, and command. The company seeks waivers from several FCC rules, including
      deployment schedule requirements, arguing its optical architecture does not create spectrum warehousing
      risk and that commercial service can begin with as few as one satellite in orbit. Critically, the FCC
      filing itself acknowledges the satellite design is not yet final and will require a license modification
      before commercial service commences. SatNews raised material concerns about the unresolved physics of
      dissipating one megawatt of thermal load in vacuum and the debris liability of a 20,000-satellite
      shell at 700-1,000 km altitude—engineering questions the company has not publicly answered.
