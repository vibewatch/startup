companyProfile:
  summary: >-
    Cowboy Space Corporation (formerly Aetherflux) is a San Carlos, California-based Series B orbital
    infrastructure company founded in 2024 by Robinhood co-founder Baiju Bhatt. The company's core thesis
    is vertical integration of a proprietary Falcon-9-class launch vehicle with 20,000–25,000 kg satellite
    upper stages that double as 1 MW solar-powered AI data centers, forming its planned "Stampede"
    20,000-satellite constellation. After raising $275M at a $2B valuation in May 2026 and rebranding from
    its space-solar roots (Aetherflux), Cowboy is targeting AI hyperscalers and defense customers blocked
    by multi-year terrestrial grid interconnection queues. The company is pre-revenue; key technical risks
    around thermal management, radiation hardening, and launch cadence remain publicly unresolved.
  foundedDate: "2024-03-01"
  founders:
    - name: Baiju Bhatt
      role: Founder & CEO
      background: Robinhood Markets co-founder (co-CEO 2013–2020, Chief Creative Officer 2020–2024); Stanford physics and mathematics; ~6% Robinhood stake at founding.
