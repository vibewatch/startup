  topStrengths:
    - Tier-1 investor syndicate (Index Ventures leading both A and B, a16z, Breakthrough Energy Ventures, SAIC) and Baiju Bhatt's Robinhood-scale execution record provide unusually strong capital access and narrative credibility for a pre-revenue deep-tech bet.
    - NVIDIA Space-1 Vera Rubin launch-partner designation validates the orbital AI compute hardware thesis and gives Cowboy a purpose-built GPU module unavailable to most competitors.
    - The terrestrial AI compute bottleneck (5–7 year grid interconnection queues, Goldman Sachs 160% data center power growth projection to 2030) creates a structurally real demand case for orbital power-and-compute if unit economics prove viable.
    - "Vertical integration of launch and compute is architecturally distinctive: by merging upper stage and satellite, Cowboy eliminates redundant structure mass and removes dependence on external launch providers at scale."
  topRisks:
    - The company is entirely pre-revenue with no disclosed customer contracts, LOIs, or commercial pilots; willingness to pay and unit economics at price parity with terrestrial alternatives remain unvalidated.
    - Thermal rejection of 1 MW of waste heat from GPU compute in vacuum is the central unresolved engineering challenge; ArsTechnica estimated ~200 m² of radiator surface per satellite, and no public qualification or test data exists.
    - Developing a proprietary Falcon-9-class rocket in parallel with an orbital data center is extreme in capital and execution demands; comparable programs (Relativity Space, ABL Space Systems) consumed $100M–$650M before first operational milestones, and several failed entirely.
    - SpaceX's January 2026 FCC filing for up to 1 million orbital data center satellites creates an existential competitive threat from the only provider with sufficient launch cadence and Starship payload capacity to cost-effectively deploy 20–25 tonne satellites.
  unresolvedGaps:
    - No revenue, ARR, backlog, LOIs, or named customers; all commercial demand signals are thesis-level and sector-wide, not company-specific.
    - Thermal-vacuum qualification data and radiation-hardening approach for the 700–1,000 km orbital band are absent from the public record.
    - Rocket engine design, propulsion test results, manufacturing facility, and FAA launch license pathway have not been publicly disclosed.
    - Full capitalization table, preference stack, Series B liquidation terms, and any secondary or debt components are not publicly available.
