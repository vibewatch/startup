summary:
  headline: >-
    Cowboy Space has Tier-1 backers, a credible founder, and a genuine structural market driver, but the
    $2B entry mark is entirely thesis-stage: the company is pre-revenue, its rocket is unbuilt, and the
    core thermal physics of a 1 MW orbital data center remain publicly unvalidated.
