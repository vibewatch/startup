  - id: exit-readiness-diligence
    title: Exit Readiness and Final Diligence Asks
    body: >
      No near-term exit pathway is visible for Cowboy Space. The company has no revenue, no disclosed
      customer contracts, and the first operational milestone (Galactic Brain ODC node) is projected for
      2027. An IPO or strategic acquisition would require at minimum first commercial revenue and
      demonstrated orbital data center operations — a realistic horizon of 2029–2031 under the base
      case. Baiju Bhatt's institutional investor base and prior Robinhood track record provide
      reputational context but not exit timing assurance.

      Strategic acquisition risk is asymmetric: SAIC's investment signals defense-customer interest
      and creates a potential government-strategic acquirer scenario if commercial traction remains slow.
      This represents a non-commercial floor on exit value in the bear case, but would likely represent
      a partial acquihire rather than a full-value exit. Blue Origin, Amazon, and Microsoft are
      plausible strategic acquirers if the technology validates but the commercial model struggles, though
      no public signaling supports this.

      The final diligence asks below represent the minimum evidence set required to move from a
      research-more stance to a formal investment consideration. The most structurally important gap
      is the cap table and preference overhang: without this information, no precise return modeling
      is possible. The most thesis-critical gap is a validated thermal-cooling proof of concept at 1 MW
      scale and a quantified unit-economics model comparing orbital vs. terrestrial data center TCO.
