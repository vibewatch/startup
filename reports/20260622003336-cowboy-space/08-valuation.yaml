  - id: scenario-analysis-sensitivity
    title: Scenario Analysis, Sensitivity, and Downside Triggers
    body: >
      The absence of revenue, a disclosed financial model, or customer contracts forces all valuation
      judgment into scenario analysis. Three scenarios capture the range of plausible outcomes, keyed
      to whether Cowboy hits its 2026–2028 milestone sequence (power-beaming demo, first Galactic Brain
      ODC node, first proprietary rocket launch).

      Bull case: The 2026 power-beaming demo succeeds, the 2027 Galactic Brain ODC node deploys and
      demonstrates thermal-vacuum performance at commercial throughput, the proprietary rocket launches
      before end of 2028, and the first commercial or government customer contracts are signed by
      mid-2028. Under this trajectory, Cowboy would be the earliest verified operator of commercial
      orbital data center infrastructure with a captive launch capability. A $8–15B implied valuation
      by late 2029 is plausible, anchored by the analogy to CoreWeave's 3.5x post-IPO multiple
      expansion on revenue confirmation.

      Base case: Milestones slip 12–24 months, competition from Starcloud and Blue Origin
      Project Sunrise intensifies, and Cowboy achieves first revenue in late 2029 at modest scale.
      The $2B post-money mark holds roughly flat in real terms ($2–4B range), consistent with flat
      or modest secondary price trends as investors assess milestone progress versus original thesis.

      Bear case: A significant technical failure — thermal-qualification failure of the 1 MW ODC
      unit, or rocket program cost escalation beyond available capital — forces a restructuring or
      down-round. SpaceX's orbital data center deployment at scale (should it materialize before
      Cowboy reaches revenue) would collapse the addressable market for independent ODC operators.
      A down-round at $0.3–1B mark is plausible in this scenario, consistent with the post-hype
      repricing seen in prior deep-tech infrastructure categories that failed to clear physics and
      economics gates simultaneously.

      Across all scenarios, the dilution trajectory is material. Reaching the bull-case milestone
      sequence likely requires $500M–$1B+ in additional capital before revenue, implying cumulative
      dilution of 40–60%+ from the current post-Series B base depending on valuation at subsequent
      rounds. Preference overhang and liquidation stack are unknown.
