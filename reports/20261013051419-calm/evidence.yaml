evidenceGaps:
  - type: missing-source
    severity: material
    topic: leadership-succession
    missingEvidence: >-
      Public disclosure of the permanent Chief Executive Officer appointment, revised board committee roster, and
      executive management restructuring following David Ko's April 2026 departure.
    whyItMatters: >-
      Executive leadership direction determines product roadmap prioritization and enterprise healthcare contracting
      velocity.
    diligencePath: >-
      Monitor corporate press releases, state filings, and LinkedIn executive leadership disclosures for announced
      permanent CEO appointments.
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: material
    topic: cap-table-ownership
    missingEvidence: >-
      Audited post-Series C capitalization table detailing liquidation preferences, option pool size, and secondary
      share transaction pricing.
    whyItMatters: >-
      Prevents independent determination of common share value and preferred downside protection following the December
      2020 Series C.
    diligencePath: >-
      Request secondary market clearing prices and shareholder rights agreements directly from company investor
      relations.
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: market-sizing-reconciliation
    missingEvidence: >-
      Audited financial breakdown reconciling consumer mobile app store billings ($210M-$277M third-party estimates)
      against total reported enterprise and B2B platform revenue ($596M claimed scale).
    whyItMatters: >-
      Assessing true addressable market capture and Calm valuation multiple requires verifying whether enterprise health
      contracts represent recurring revenue or gross contractual value.
    diligencePath: >-
      Obtain audited revenue breakdown by segment (Calm B2C consumer vs Calm Business / Calm Health B2B) and renewal
      cohort retention rates during management diligence.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing-gap
    missingEvidence: >-
      Comparable Calm, Spring Health, Lyra, Dialogue, and incumbent EAP contract prices, discounts, utilization
      guarantees, and renewal terms.
    whyItMatters: Without realized contract economics, enterprise price positioning and switching costs cannot be underwritten.
    diligencePath: >-
      Obtain recent anonymized proposals, customer contracts, renewal cohorts, and broker or benefits-consultant
      benchmarks.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: competitive-outcomes
    missingEvidence: >-
      Independent head-to-head retention, engagement, clinical outcome, and win-loss evidence across consumer and
      employer alternatives.
    whyItMatters: Feature breadth and funding do not establish durable preference, efficacy, or distribution power.
    diligencePath: >-
      Commission customer reference calls and cohort comparisons using consistent populations, periods, and outcome
      definitions.
    relatedQuestionRefs:
      - QP003
      - QP005
      - QP007
  - type: private-evidence-only
    severity: blocking
    topic: cash-and-burn
    missingEvidence: >-
      Audited financial statements detailing current unrestricted cash balances, monthly net burn rate, credit facility
      obligations, and operating runway.
    whyItMatters: >-
      Without audited balance sheet data, underwriters cannot determine whether Calm is self-funding from operating cash
      flows or facing capital dependency at a stale 2020 valuation.
    diligencePath: >-
      Request confidential audited FY2024-FY2025 financial statements, bank account cash verifications, and
      board-approved FY2026 operating budgets.
    relatedQuestionRefs:
      - QI008
  - type: conflicting-data
    severity: material
    topic: revenue-and-arr-reconciliation
    missingEvidence: >-
      Audited GAAP revenue, ARR bridge, and revenue breakdown segmented across consumer B2C, Calm for Business, and Calm
      Health clinical contracts.
    whyItMatters: >-
      Public third-party revenue estimates diverge wildly between $164 million and nearly $600 million, preventing
      reliable multiple valuation and margin analysis.
    diligencePath: Obtain company revenue bridge and segment accounting schedules reconciled to audited tax and financial filings.
    relatedQuestionRefs:
      - QI007
  - type: private-evidence-only
    severity: material
    topic: churn-and-nrr
    missingEvidence: >-
      Audited monthly and annual logo retention, gross churn, and Net Revenue Retention (NRR) schedules across B2C and
      enterprise tiers.
    whyItMatters: >-
      Evaluating the sustainability of Calm's unit economics requires knowing whether enterprise growth offsets
      estimated 60-80% annual consumer churn.
    diligencePath: Request historical monthly subscription cohort retention data and Calm for Business logo/dollar retention reports.
    relatedQuestionRefs:
      - QI004
  - type: private-evidence-only
    severity: material
    topic: clinical-efficacy-and-compliance
    missingEvidence: >-
      Independent clinical validation trials, published peer-reviewed outcomes data, and SOC 2 Type II or HIPAA
      third-party compliance audit reports for Calm Health.
    whyItMatters: >-
      Without independent clinical efficacy trials and compliance audits, underwriters cannot verify whether Calm Health
      meets healthcare reimbursement thresholds or withstands regulatory audit scrutiny.
    diligencePath: >-
      Request unredacted SOC 2 Type II audit reports, HIPAA security assessments, and institutional review board (IRB)
      approved clinical trial outcomes from Calm's clinical affairs team.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE001
      - TE003
  - type: missing-source
    severity: material
    topic: infrastructure-reliability-and-outages
    missingEvidence: >-
      Historical system uptime metrics, service-level agreement (SLA) performance reports, and incident post-mortems for
      the Calm Partner API and core streaming infrastructure.
    whyItMatters: >-
      Enterprise health plans and employer partners depend on reliable real-time provisioning; unmonitored
      infrastructure downtime risks breach of contract and partner member dissatisfaction.
    diligencePath: >-
      Obtain historical uptime dashboards from status.calm.com or AWS CloudWatch logs, SLA compliance records, and
      business continuity architecture documentation.
    relatedQuestionRefs:
      - QE010
    relatedTableRefs:
      - TE002
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: >-
      Audited cohort retention curves, gross revenue retention (GRR), net revenue retention (NRR), and annualized churn
      figures across direct consumer and enterprise employer segments.
    whyItMatters: >-
      Direct-to-consumer wellness apps frequently experience steep drop-offs after initial annual renewals; without
      cohort data, long-term customer lifetime value cannot be verified.
    diligencePath: Request audited cohort retention schedules and renewal waterfall data by vintage under NDA from management.
    relatedQuestionRefs:
      - QU009
  - type: enumeration-incomplete
    severity: minor
    topic: Named customer proof table
    missingEvidence: >-
      Comprehensive listing of enterprise employer logos, healthcare plan partners, contract values, and active
      covered-lives counts under Calm Health.
    whyItMatters: >-
      Public sources only reveal sporadic conference co-appearances and marketing mentions; full enterprise customer
      penetration and account concentration remain opaque.
    diligencePath: >-
      Review employer account rosters, top customer concentration percentages, and health-plan sponsor schedules in
      dataroom.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: Regulatory / legal risk register enumeration completeness
    missingEvidence: >-
      Audited regulatory classification filings, state healthcare compliance reviews, and formal business associate
      agreement audit reports for Calm Health commercial payer integrations.
    whyItMatters: >-
      Calm's expansion into enterprise healthcare distribution requires rigorous regulatory compliance beyond consumer
      wellness exemptions.
    diligencePath: >-
      Request Calm Health compliance documentation, SOC 2 Type II reports, HIPAA third-party attestations, and state
      digital health regulatory filings during management diligence.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: conflicting-data
    severity: material
    topic: Secondary valuation pricing versus primary capital marks
    missingEvidence: >-
      Audited capitalization table, liquidation preference seniority schedules, and verified secondary transaction
      volume records.
    whyItMatters: >-
      Secondary pricing estimates range widely between $4.54 and $15.81 per share, obscuring current fair market
      valuation relative to the $2 billion 2020 Series C post-money valuation.
    diligencePath: >-
      Obtain official 409A valuation reports, secondary transaction settlement confirmations, and cap-table preference
      stack directly from company management.
    relatedQuestionRefs:
      - QR003
  - type: enumeration-incomplete
    severity: minor
    topic: Leadership transition and executive committee roster
    missingEvidence: >-
      Formal executive roster and board of directors governance structure following David Ko's 2026 leadership
      transition.
    whyItMatters: >-
      Clarity on operating executive ownership and strategic continuity is essential for assessing operational execution
      risk.
    diligencePath: >-
      Conduct diligence interviews with board members and incoming executive leadership to confirm organizational
      reporting structures.
    relatedQuestionRefs:
      - QR008
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      Audited post-2020 cap table, liquidation preference seniority across Series A through C, and actual clearing
      prices on secondary transactions.
    whyItMatters: >-
      Without senior liquidation preference terms, common shareholders and new secondary investors cannot determine
      downside payout priority in a sale below $2.0 billion.
    diligencePath: >-
      Request the comprehensive capitalization table, share class certificate of incorporation amendments, and recent
      secondary transaction closing notices under NDA.
    relatedQuestionRefs:
      - QV009
    relatedTableRefs:
      - TV003
