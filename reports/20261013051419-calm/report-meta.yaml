companyProfile:
  summary: >-
    Calm is a private digital mental-wellness company founded in 2012 that built a consumer meditation and sleep app
    into a broader wellness platform spanning Calm Premium, audio content, and the Calm Health employer and payer
    distribution business. The company combines a recognizable consumer brand with enterprise wellness sponsorship, but
    it remains constrained by private-company disclosure limits and an unresolved leadership transition after David Ko's
    April 2026 departure.
