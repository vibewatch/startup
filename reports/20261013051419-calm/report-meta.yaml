  topStrengths:
    - Broad consumer brand reach with a large installed base and durable sleep / meditation product recognition.
    - Calm Health gives the company an enterprise and payer distribution channel beyond direct consumer subscriptions.
    - The business has demonstrated meaningful fundraising access and a long operating history in a crowded category.
  topRisks:
    - Leadership transition and governance uncertainty after David Ko's April 2026 departure.
    - Stale 2020 valuation anchor and limited private-company financial transparency.
    - Competitive pressure and renewal risk across consumer subscriptions and sponsor-backed health distribution.
  unresolvedGaps:
