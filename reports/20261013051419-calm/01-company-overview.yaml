    title: Unresolved CEO Leadership Succession
    body: The departure of David Ko in April 2026 leaves operating leadership in transition as Calm seeks a permanent chief executive to balance its direct-to-consumer core with enterprise healthcare expansion.
    claimRefs:
      - CO003
      - CO004
      - CO005
  - calloutType: insight
    title: Valuation Anchor vs. Private Opacity
    body: Calm's benchmark $2.0 billion post-money valuation has remained static since December 2020 without subsequent public financing rounds, creating valuation risk given the lack of updated financial disclosures.
    claimRefs:
      - CO007
      - CO008
      - CO010
