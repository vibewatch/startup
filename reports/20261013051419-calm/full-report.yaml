        - 3.5x EV / Revenue
        - $1.12B
        - Modest consumer subscriber growth offset by competitive pressure; Calm Health contributes incremental margin
        - '55% probability: Consistent with secondary market discounts and prevailing consumer digital health comps'
      - - Bear Case
        - $220M run rate
        - 2.0x EV / Revenue
        - $440M
        - Consumer subscriber churn increases following price increases; big tech platforms commoditize audio content
        - '25% probability: Triggered by enterprise sponsor cancellations or further executive instability'
    notes: >-
      Scenarios assume normalized private software and digital health EV/Revenue multiples applied to projected
      operating run rates.
    claimRefs:
      - CV001
      - CV009
      - CV011
      - CV014
