      - number: '1.3'
        title: Executive Leadership and Board Governance
        blocks:
          - type: paragraph
            body: >-
              Calm's executive governance is undergoing a pivotal transition following the April 2026 departure of David
              Ko, who led the business as Chief Executive Officer for four years. Ko's tenure focused on
              institutionalizing Calm Health and deepening clinical employer and payer relationships. In candid
              post-exit interviews, Ko pointed to executive burnout in the high-pressure wellness sector alongside the
              accelerating disruption of generative artificial intelligence as primary drivers of his exit. Board
              governance continues under founders Michael Acton Smith and Alex Tew, while Ko transitioned to a senior
              advisory role to assist with board continuity during the active search for a permanent operating chief
              executive.
