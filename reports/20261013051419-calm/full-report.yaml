      - number: '3.4'
        title: Brand and library scale help, but distribution and free substitutes cap durability
        blocks:
          - type: paragraph
            body: >-
              Calm's defensibility appears strongest where brand, a large professionally produced library,
              sleep-specific formats, and broad device availability reinforce one another. Those assets can raise the
              cost of recreating the same experience, yet users can multi-home across low-cost apps, free content, and
              employer-provided benefits without migrating proprietary data. The adverse case is therefore not that Calm
              lacks product quality; it is that content can be sampled elsewhere, structured guidance may be better
              supplied by Headspace, and employer buyers can choose more clinically oriented, better-funded platforms.
              Built In's AI-generated synthesis also flags softer consumer momentum and dependence on enterprise
              execution, a directional warning that requires primary retention and contract evidence before it can
