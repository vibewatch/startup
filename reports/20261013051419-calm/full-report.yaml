      - number: '5.2'
        title: Customer Workflows, User Jobs, and Clinical Behavioral Integration
        blocks:
          - type: paragraph
            body: >-
              From a customer workflow perspective, Calm addresses distinct behavioral jobs across varied time horizons
              and institutional settings. In the consumer domain, the primary user job is rapid evening decompression
              and insomnia mitigation, where users initiate long-form Sleep Stories or ambient soundscapes that minimize
              cognitive activation. During daytime hours, the platform promotes daily habit formation through the Daily
              Calm, a ten-minute guided micro-meditation refreshed each morning, complemented by structured multi-week
              habit resets like the Just One Step program. For enterprise employers, Calm Business shifts the workflow
              toward benefits administration, allowing HR teams to distribute subsidized mental-wellness access to
              employee workforces. Within clinical environments, Calm Health serves as an invitation-only behavioral
              intervention accessible via health plan sponsorship, routing patients with anxiety or depression toward
              condition-specific clinical modules. This workflow bridges digital self-care with formal clinical care
              navigation, though actual patient engagement durability remains shielded from independent auditing.
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
