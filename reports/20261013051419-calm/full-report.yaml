chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Founding Mission
        blocks:
          - type: paragraph
            body: >-
              Calm was founded in 2012 by Michael Acton Smith and Alex Tew in San Francisco, California, establishing an
              early consumer foothold in digital mindfulness, guided meditation, and audio sleep content. Operating
              legally as Calm.com, Inc., the company pairs high-production ambient soundscapes and celebrity-narrated
              Sleep Stories with structured cognitive breathing exercises. Over its decade-long evolution, Calm
              transitioned from a direct-to-consumer mobile utility into a multi-channel digital health and wellness
              brand with corporate presences in San Francisco and Palo Alto. The company's long-term product trajectory
              reflects a continuous progression from mobile mindfulness novelty to institutional behavioral health
              integration.
            claimRefs:
              - CO001
              - CO002
              - CO011
