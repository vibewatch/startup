      - number: '5.3'
        title: Technical Architecture, Partner APIs, and Infrastructure Dependencies
        blocks:
          - type: paragraph
            body: >-
              Calm technical operating architecture separates public consumer client distribution from private
              enterprise and clinical integration layers. Client applications on iOS and Android rely on native platform
              media players, supplemented by proprietary utilities such as the open-source PersistentStreamPlayer helper
              for background audio continuity. For enterprise and health plan partners, Calm exposes the Calm Partner
              API hosted on Amazon Web Services infrastructure at auth.calm.com/v0. This RESTful service uses OAuth 2.0
              client-credentials authentication to manage partner member subscription linking, provisioning, and
              revocation. In addition to REST endpoints, Calm supports SAML 2.0 IdP-initiated single sign-on and batch
              eligibility ingestion via inbound SFTP CSV file drops. While Calm maintains selected open-source front-end
              utilities on GitHub, it exposes no public consumer API, preserving closed platform governance over its
              proprietary content catalog and user analytics pipeline.
            claimRefs:
              - CE002
              - CE003
              - CE009
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
