  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Multi-layered technology and delivery architecture supporting Calm consumer apps, B2B enterprise portals, and
      clinical Calm Health distribution.
    data:
      layers:
        - label: User Access & Client Tier
          detail: >-
            Native iOS and Android mobile applications, responsive web application, and standalone Calm Sleep iOS
            utility.
          tone: neutral
        - label: Content Presentation & Engagement Tier
          detail: >-
            Daily Calm 10-minute micro-sessions, Sleep Stories bedtime audio, music catalog, mindful movement video, and
            soundscapes.
          tone: positive
        - label: Enterprise Partner Integration Tier
          detail: >-
            Calm Partner API (OAuth 2.0 client-credentials at auth.calm.com/v0), SAML 2.0 IdP-initiated SSO, and SFTP
            eligibility file sync.
          tone: neutral
        - label: Clinical Healthcare Platform Tier
          detail: >-
            Calm Health invitation-only application, condition-specific anxiety and depression modules, and healthcare
            provider referral bridges.
          tone: opportunity
        - label: Audio & Media Processing Engine
          detail: >-
            Persistent stream player utilities, background audio looping, audio mastering pipeline, and experimental AI
            voice-cloning models.
          tone: neutral
        - label: Core Cloud Infrastructure & Compliance Tier
          detail: >-
            AWS cloud hosting, global content delivery network distribution, encryption in transit and at rest, and
            HIPAA privacy controls.
          tone: warning
    approximationNotes: >-
      Architectural layers reflect public technical disclosures and API Evangelist profile specifications; internal
      microservices topologies and proprietary audio compression algorithms are unobserved.
