      - number: '4.2'
        title: Cost Structure and Unit Economics Treadmill
        blocks:
          - type: paragraph
            body: >-
              Because Calm delivers proprietary audio and digital experiences via cloud infrastructure without physical
              distribution costs, gross margins for its software core exceed 85%. Historical unit economics reflected
              strong organic acquisition loops, generating blended customer acquisition costs between $5 and $7 against
              lifetime value estimates of approximately $60, delivering a 10:1 LTV-to-CAC ratio during early growth
              phases. However, the consumer subscription model faces severe structural headwinds from category churn:
              broader mobile wellness benchmarks suggest annual attrition rates of 60% to 80%. This attrition forces
              ongoing marketing reinvestment and premium celebrity licensing expenditures to replenish lapsing cohorts.
              Calm Health counters this consumer treadmill by establishing institutional engagement benchmarks,
              reporting 38% clinical program engagement and 77% screening completion across sponsored populations.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
