      accessStatus: "ok"
      stance: "adverse"
      sourceType: "review"
      reputationTier: "medium"
      independence: "independent"
      topics:
        - "revenue-model"
        - "churn"
        - "pricing"
      keyQuote: "The deeper problem is that meditation, as a product category, has not solved the retention problem that defines all habit-formation apps. The data is sparse — Calm is a private company and does not disclose subscriber counts or churn rates — but industry benchmarks for consumer wellness apps suggest annual churn rates of 60–80%. If Calm's churn is anywhere near that range, the company is on a treadmill: acquiring new subscribers to replace the ones who lapse, spending more and more on content and marketing to maintain equilibrium. The economics of this treadmill are sustainable only as long as the brand remains strong enough to command premium pricing and the content library remains differentiated enough to resist free alternatives."
