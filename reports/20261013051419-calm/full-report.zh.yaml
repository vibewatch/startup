      - number: '4.3'
        title: 资本充足性与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Calm 通过多轮股权融资筹得 $192 million 至 $225 million，核心是 2020 年 12 月由 Lightspeed Venture Partners、Insight Partners
              和 TPG 领投的 $75 million Series C；该轮把峰值投后估值定在 $2.0 billion。由于 Calm
              仍是特拉华州私营公司，经审计的损益表、分部利润率、准确公司现金余额和未来净现金消耗均未公开披露。公开第三方追踪机构给出的业务进展估计互相冲突，从 Sacra 对 2024 年收入 $164.14 million
              的估计，到 SVIC 对 2024 年 ARR $596.4 million 的预测。近期监管和公司文件显示员工人数在 290 至 572 人之间，战略性缩编后低于历史峰值。评估 Calm
              股权价值，需要直接取得经核实的 B2C 留存群组、企业合同 ARR 和付款方人均收费表。
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: 展示项
        blocks:
          - type: callout
            title: B2B 与临床业务：逃离消费者订阅跑步机
            body: >-
              Calm 超过 85% 的数字毛利率，受到移动消费者订阅者持续流失的结构性约束；整个健康品类的年流失率估计为 60% 至 80%。把分发转向 Calm for Business 和 Calm
              Health，是关键战略出口：雇主福利合同和健康计划成员协议，用合同型经常性收入、更低的企业流失和雇主补贴分发，替代应用商店交易的波动。
