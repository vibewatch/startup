  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管边界、健康分类与医疗数据治理
        blocks:
          - type: paragraph
            body: >-
              Calm 主要在消费者健康领域运营，提供非临床正念、冥想、呼吸练习和睡眠内容，而不是处方数字疗法。这一运营范围过去使 Calm 不受严格的 FDA 上市前通知要求和软件医疗器械（SaMD）监管。但 Calm
              Health 向企业雇主福利、医疗付款方网络和临床研究合作扩张后，监管合规暴露显著提高。Calm 在研究披露中明确说明，其消费者应用是健康工具，而不是诊断或精神科治疗工具。随着 Calm Health
              更直接地接入赞助方健康计划，公司将受到《健康保险可携性和责任法案》（HIPAA）、《加州消费者隐私法案》（CCPA）等州消费者隐私法，以及新兴州级健康数据隐私法规的更严格审查。如果无法严格隔离消费者健康日志和受保护健康信息（PHI），公司将面临重大的监管执法、诉讼和品牌声誉风险。
            claimRefs:
              - CR001
              - CR007
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR007
              - CR011
      - number: '7.2'
        title: 运营执行、高管继任与内容参与持久性
        blocks:
          - type: paragraph
            body: >-
              Calm 的运营模式依赖于维持高用户参与度、持续生产内容库，并为数百万活跃移动订阅者提供稳定的云流媒体交付。公司在 2026
              年高管交接和运营重组后，经历了显著的领导层演变。一个关键运营失效模式是用户留存衰减：消费者健康应用在促销引导或季节性新年注册后，常出现较高订阅流失。为抵消参与度流失，Calm 推出了 2026 年 “Just
              One Step”
              活动等结构化习惯强化项目，旨在降低用户每日启动门槛。大学研究群组的学术研究显示，稳定的冥想时间有助于持续使用应用，但规模更小的随机试验在标准化心理压力指标上的结果并不一致。在扩张音频内容、名人旁白和音景的同时保持临床研究完整性，会给多平台交付带来质量保证开销、内容授权成本和运营利润率摩擦。
            claimRefs:
              - CR004
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR008
              - CR009
      - number: '7.3'
        title: 移动应用商店瓶颈与 B2B 医疗渠道依赖
        blocks:
          - type: paragraph
            body: >-
              Calm 的分发架构高度依赖 Apple App Store 和 Google Play Store 生态。虽然 Calm 已达到累计移动下载超过 180 million、五星评价 3 million
              的规模，但这种依赖让业务暴露于移动操作系统的准入控制。Apple 和 Google 控制移动用户发现算法，收取平台内购交易费，并管理设备级数字健康追踪权限。此外，Apple 和 Google
              推出的平台原生数字健康和屏幕时间管理功能，也对第三方智能手机参与形成竞争摩擦。与此同时，Calm Health 的商业分发带来 B2B
              交易对手集中度风险。与大型企业雇主、商业付款方和医疗聚合商的合同关系，使公司暴露于多年采购续约周期、福利预算收缩和企业服务级别协议（SLA）罚款。应用商店计费政策变化或企业赞助合同终止，都是核心运营瓶颈。
            claimRefs:
              - CR005
              - CR010
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR010
              - CR014
      - number: '7.4'
        title: 财务模型持久性、估值锚点悬置与二级市场流动性不足
        blocks:
          - type: paragraph
            body: >-
              从投资角度看，Calm 的估值和流动性风险很大，根源在于历史融资路径和私营公司结构。Calm 最近一次主要风险资本融资是 2020 年 12 月的 Series C，当时投后估值为 US$2
              billion，投资人包括 Lightspeed Venture Partners、Insight Partners 和 TPG 等机构。五年多后，公司仍是私营企业，没有确定的 IPO
              或明确流动性时间表。面向合格投资人的私募二级交易市场价格分化很大，股价指示从约 $4.54 的深度折价，到模型化历史定价 $15.81
              不等。投资人面临严重流动性不足、需要公司批准的转让限制，以及后续融资轮或交易出售价格低于 2020 年估值基准时可能出现的清算优先权悬置。在更广泛的竞争格局中，Calm 还要与 Headspace
              以及资金充足的企业行为健康平台竞争，而消费者订阅业务整体倍数正在压缩。
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR012
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 2020 年估值锚点陈旧，二级流动性折价
            body: >-
              Calm 最近一次主要股权估值为 US$2 billion，于 2020 年 12
              月数字健康扩张周期高峰确立。私募二级市场交易显示深度折价，且没有公开上市时间表；因此，新资本入场面临显著估值压缩和清算优先权悬置。
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR012
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与建议框架
        blocks:
          - type: paragraph
            body: >-
              Calm 是数字心理健康领域定义品类的品牌，但评估其投资价值，必须把强大的消费者触达与陈旧的估值基准拆开看。公司最近一次正式私募市场估值在 2020 年 12 月确立，当时由 Lightspeed Venture
              Partners 领投 $75 million 的 Series C，投后估值 $2.0 billion。该轮融资继 2019 年 $1.0 billion 的 Series B 估值后巩固了 Calm
              的独角兽地位，但发生在数字健康估值倍数扩张高峰，当时 Calm 的收入倍数约为 6.67，对应 2020 年 $300 million 的收入运行率。随后六年，私营数字健康市场经历结构性倍数压缩，Calm
              还要面对包括 215 家获融资健康和临床行为平台在内的 1,639 家活跃竞争者。鉴于 UpMarket
              等二级市场平台报告的是未经确认的估值，且缺少近期定价轮披露，审慎的投资立场应是高风险评级下的跟踪，估值判断偏高。在经核实的审计财务和清晰的股权结构表条款出现前推迟新增资本，可保护投资人免受后续倍数正常化冲击。
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV010
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV010
              - CV013
      - number: '8.2'
        title: 核心投资论点与反论点驱动因素
        blocks:
          - type: paragraph
            body: >-
              Calm 的核心投资论点建立在品牌规模、变现转型和转向机构医疗分发的战略路径上。Calm 累计下载量超过 180 million、付费订阅用户 4
              million，已证明消费者采用达到前所未有的规模。此外，公司把内容目录从 90% 免费内容激进转向 95% 付费访问，在 2026 年 2 月提高年度订阅价格，并以每年 $69.99 推出 Calm Sleep
              等专门睡眠订阅，证明了定价能力。为克服直接面向消费者的订阅流失，Calm Health 已扩展到 39 million 名覆盖人群；2026 年 1 月接入 Solera 网络，又增加了 16 million
              名符合条件的人。但反论点强调了严重的抵消性脆弱点：Spotify、Amazon 和 Netflix 等大型科技平台以更低的边际获客成本分发竞品冥想和睡眠音频，而 Target
              的床品系列等实体零售尝试又带来运营分心。如果近期涨价后订阅流失加速，或企业健康计划未能续约，Calm 独立的消费者订阅现金流可能大幅收缩。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: 情景分析与估值纪律
        blocks:
          - type: paragraph
            body: >-
              要对 Calm 保持估值纪律，需要根据当前数字健康市场现实，对乐观、基准和悲观运营情景进行严格建模。Calm 的历史资本效率很明显：2018 年以 $250 million 的投前估值融资 $27
              million，而 2017 年收入为 $22 million，最终累计风险融资超过 $218 million。在基准情景中，假设 Calm 的收入运行率约为 $320 million，采用正常化的 3.5x
              企业价值/收入倍数，隐含估值为 $1.12 billion。这较峰值 $2.0 billion 的 Series C 定价折价 44%，与观察到的二级市场折价和上市软件同业倍数一致。在 Calm Health
              企业合同推动高毛利增长至 $450 million、倍数为 5.0x 的乐观情景中，企业价值达到 $2.25 billion。相反，在消费者订阅衰减和赞助商流失的悲观情景中，收入为 $220
              million、倍数为 2.0x，隐含估值为 $440 million。下行保护要求二级投资定价不高于我们的基准估值。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV009
              - CV011
              - CV014
      - number: '8.4'
        title: 治理、决策逻辑与尽调要求
        blocks:
          - type: paragraph
            body: >-
              最终建议把 Calm 的运营指标、组织领导力和退出准备里程碑，转成投资委员会可执行的指令。Calm 的运营执行正处于高管交接期：曾领导企业医疗扩张的 CEO David Ko 于 2026 年 4 月卸任。要在
              LifeStance Health 等主要付款方和医院网络中维持商业动能，需要稳定的高管领导和严格的公司治理。由于私营 IPO 前股份只能在二级经纪网络以流动性差、持有风险高的条款交易，Calm
              不足以支持买入建议。除非 Calm 展示持续 GAAP 盈利、解决最高层任命并提供经审计的股权结构表透明度，否则 IPO 或战略收购的退出准备仍停滞。优先尽调事项包括索取 Series A 至 C
              优先股完整的清算优先权结构、审计 Calm Health 付款方群组续约留存率，以及核实 2026 年消费者涨价后的单位流失。在这些条件满足前，Calm 仍是跟踪标的。
            claimRefs:
              - CV005
              - CV007
              - CV010
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV010
              - CV012
              - CV013
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 估值纪律需要耐心跟踪
            body: >-
              Calm 已建立了难得的品牌认知度，消费者下载量也很可观，但其 $2.0 billion 峰值估值锚点已经近六年没有更新。在没有经审计的 2026
              年融资轮次或经验证的机构二级市场定价之前，投资者应继续跟踪，而不是按过去独角兽倍数评估 IPO 前二级交易的投资价值。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV010
              - CV013
          - type: callout
            title: 管理层更替与商业执行风险
            body: Calm 正试图把复杂的 Calm Health B2B2C 支付方分销模式扩展到机构健康计划和雇主网络之际，CEO David Ko 于 2026 年 4 月卸任，带来了管理层过渡风险。
            calloutType: risk
            claimRefs:
              - CV007
              - CV012
