          unit: USD M
          detail: 数字正念、冥想和睡眠应用的总可服务市场
        - label: Calm Health 覆盖人数
          value: 26
          unit: M Lives
          detail: Calm Health 医疗和赞助方合作覆盖的企业人群
        - label: 全球活跃付费订阅用户群
          value: 4
          unit: M Subscribers
          detail: 消费者和企业账户的预计付费订阅用户群
        - label: Calm 年度商业收入区间
          value: 596
          unit: USD M
          detail: 包括直接企业健康平台合同在内的已实现收入上限
  - id: FP001
    title: 按内容深度和照护强度划分的方向性竞争定位
    type: quadrant
    summary: 序数定位将内容驱动应用与雇主照护平台区分开来，不代表已测量的市场份额。
    data:
      xAxis:
        label: 内容库深度（序数，从低到高）
        min: 1
        max: 5
      yAxis:
        label: 临床或引导式照护强度（序数，从低到高）
        min: 1
        max: 5
      points:
        - label: Calm
          x: 5
          'y': 2
          detail: 睡眠和冥想内容库深厚；本组证据不足以完整证明 Calm Health 的照护范围。
        - label: Headspace
          x: 4
          'y': 3
          detail: 直接应用同业；留存审查中显示其新手路径更结构化。
        - label: Insight Timer
          x: 3
          'y': 1
          detail: 免费优先的消费者替代品；此处没有更广维度的证据。
        - label: Spring Health
          x: 1
          'y': 5
          detail: 雇主心理健康照护平台，而非内容库同业。
        - label: Lyra Health
          x: 1
          'y': 5
          detail: 雇主福利与人工照护平台。
        - label: Dialogue
          x: 1
          'y': 4
          detail: 照护范围更广的员工远程医疗平台。
    approximationNotes: 作者赋予的 1-5 序数分数概括所引产品描述；它们不是测量基准，重复坐标是有意安排。
    claimRefs:
      - CP003
      - CP005
      - CP006
      - CP007
      - CP013
      - CP015
      - CP016
  - id: FI001
    title: Calm 变现与毛利润转化瀑布图
    type: waterfall
    summary: 示意性瀑布图追踪 B2C 订阅总账单扣除应用商店平台费、托管费和内容摊销后转化为公司已实现毛利润的过程。
    data:
      items:
        - label: B2C 订阅总标价
          value: 70
        - label: 移动应用商店平台佣金（Apple/Google 15-30%）
          value: -15
        - label: 开发者已实现净账单收入
          value: 55
        - label: 云托管、CDN 与流媒体分发（COGS）
          value: -3
        - label: 内容版税与人才制作摊销（COGS）
          value: -4
        - label: 预计直接贡献利润率
          value: 48
    approximationNotes: 示意性瀑布图基于 Calm Premium 年度 $69.99 标价建模，假设移动平台平均混合佣金约 21%，数字分发标准毛利率结构约 85%。
    claimRefs:
      - CI001
      - CI002
      - CI005
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 支撑 Calm 消费者应用、B2B 企业门户和临床 Calm Health 分发的多层技术与交付架构。
    data:
      layers:
        - label: 用户访问与客户端层
          detail: 原生 iOS 和 Android 移动应用、响应式 Web 应用，以及独立的 Calm Sleep iOS 工具。
          tone: neutral
        - label: 内容呈现与参与层
          detail: Daily Calm 10 分钟微课程、Sleep Stories 睡前音频、音乐目录、正念运动视频和音景。
          tone: positive
        - label: 企业合作伙伴集成层
          detail: Calm Partner API（auth.calm.com/v0 上的 OAuth 2.0 客户端凭证）、SAML 2.0 IdP 发起的 SSO，以及 SFTP 资格文件同步。
          tone: neutral
        - label: 临床医疗平台层
          detail: Calm Health 邀请制应用、针对特定病症的焦虑和抑郁模块，以及医疗服务提供者转诊桥接。
          tone: opportunity
        - label: 音频与媒体处理引擎
          detail: 持久流播放器工具、后台音频循环、音频母带处理流程，以及实验性 AI 声音克隆模型。
          tone: neutral
        - label: 核心云基础设施与合规层
          detail: AWS 云托管、全球内容分发网络、传输中和静态加密，以及 HIPAA 隐私控制。
          tone: warning
    approximationNotes: 架构层反映公开技术披露和 API Evangelist 档案规格；内部微服务拓扑和专有音频压缩算法尚未被观察到。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE007
      - CE009
      - CE011
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 覆盖获客发现、习惯驱动的试用转化、留存挑战和企业医疗扩张的客户生命周期演进。
    approximationNotes: 生命周期阶段综合订阅变现研究和企业医疗定位。
    claimRefs:
      - CU002
      - CU006
      - CU010
      - CU011
    data:
      items:
        - label: 发现与深夜搜索
          description: 失眠或压力触发的自然搜索、口碑传播和应用商店查询
          touchpoints:
            - App Store 和 Google Play 搜索
            - 社交媒体推荐
            - 深夜失眠 Google 搜索
        - label: 免费引导与首次见效
          description: 无需预先付费即可带来即时情绪缓解的低门槛初次体验
          touchpoints:
            - 入门呼吸练习
            - 免费 Sleep Story 试用
            - 个性化目标和提醒设置
        - label: 付费墙转化触发点
          description: 用户展现参与度后，在特定时点展示订阅提示
          touchpoints:
            - 课程结束后的升级弹窗
            - 受限名人睡眠故事访问
            - 年度订阅试用提示
        - label: 高级版习惯养成
          description: 内容多样性、音轨和连续打卡强化日常参与习惯
          touchpoints:
            - 睡前推送提醒
            - 冥想连续打卡计数
            - Daily Calm 10 分钟课程
        - label: 留存风险与疲劳点
          description: 年度续约决策点；内容重复或习惯中断可能导致订阅流失
          touchpoints:
            - 年度订阅续约通知
            - 静音通知或卸载
            - 取消流程和折扣优惠
        - label: 企业与临床扩张
          description: 将个人用户转为雇主赞助的访问，并导入临床 Calm Health 支持
          touchpoints:
            - 雇主健康门户激活
            - 医疗计划福利报销
            - Calm Health 临床项目引导
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 定性风险矩阵映射 Calm 关键战略领域的可能性、影响、缓解措施成熟度和剩余风险评级。
    approximationNotes: 风险评估是定性尽调判断，依据公开运营披露、二级市场交易数据和数字健康平台比较分析得出。
    claimRefs:
      - CR002
      - CR003
      - CR006
      - CR012
    data:
      columns:
        - label: 可能性
        - label: 影响
        - label: 缓解措施成熟度
        - label: 剩余风险评级
      rows:
        - label: 高管继任与治理不透明
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 发展中
              tone: warning
            - label: 偏高
              tone: risk
        - label: 数字健康监管边界
          values:
            - label: 低
              tone: low
            - label: 高
              tone: high
            - label: 已建立
              tone: positive
            - label: 中等
              tone: neutral
        - label: 移动应用商店平台集中度
          values:
            - label: 中
              tone: medium
            - label: 关键
              tone: critical
            - label: 部分
              tone: warning
            - label: 高
              tone: risk
        - label: 临床疗效与用户留存衰退
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 中等
              tone: neutral
            - label: 偏高
              tone: risk
        - label: 2020 年估值锚点与二级市场流动性不足
          values:
            - label: 高
              tone: high
            - label: 高
              tone: high
            - label: 低
              tone: risk
            - label: 关键
              tone: critical
        - label: B2B 医疗赞助方续约风险
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 发展中
              tone: warning
            - label: 偏高
              tone: risk
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 从运营规模和医疗扩张推进至估值现实及最终监测立场的分析决策序列。
    claimRefs:
      - CV001
      - CV005
      - CV007
      - CV010
      - CV012
      - CV013
    data:
      nodes:
        - id: scale
          label: 消费者规模基础
          detail: 180M+ 次终身下载和 4M+ 名付费订阅用户，构成强大的品牌资产
        - id: b2b2c
          label: B2B2C 健康业务转向
          detail: Calm Health 和 Solera 扩张覆盖 39M 名成员，分散对直接面向消费者业务的依赖
        - id: headwinds
          label: 竞争与平台压力
          detail: 1,639 家竞争者，以及 Spotify、Amazon 和 Netflix 推动的音频商品化，威胁利润率
        - id: governance
          label: 领导层交接
          detail: CEO David Ko 于 2026 年 4 月离任，在企业扩张期间带来运营摩擦
        - id: valuation-gap
          label: 过时的估值倍数
          detail: 2020 年 Series C 的 $2.0B 估值锚点（收入的 6.67x）高于当前数字健康行业 3.5x 的中位数
        - id: stance
          label: 跟踪建议
          detail: 在经审计单位经济模型和股权结构表披露之前，维持高风险评级下的监测立场
      edges:
        - from: scale
          to: b2b2c
        - from: b2b2c
          to: headwinds
        - from: headwinds
          to: governance
        - from: governance
          to: valuation-gap
        - from: valuation-gap
          to: stance
    approximationNotes: 按顺序推进的分析过程，将证据门槛综合为投资委员会建议。
