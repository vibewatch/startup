            body: >-
              Calm 的基准投后估值 $2.0 billion 于 2020 年 12 月确立，当时正值疫情消费需求高峰和近零利率。由于没有更新后的主要融资轮或公开经审计财务披露，第三方追踪机构对 2024 年规模的估计从
              $164 million 到接近 $600 million，分化极大。若不能直接取得公司资产负债表、债务义务和经审计现金消耗，投资人无法评估资本充足性或估值倍数的防御力。
