chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与创立使命
        blocks:
          - type: paragraph
            body: >-
              Calm 于 2012 年由 Michael Acton Smith 和 Alex Tew 在加利福尼亚州旧金山创立，早早切入数字正念、引导式冥想和助眠音频内容。公司法律实体为 Calm.com,
              Inc.，把高制作水准的环境音景和名人讲述的 Sleep Stories 与结构化认知呼吸练习结合起来。经过十余年发展，Calm
              从面向消费者的移动工具转为多渠道数字健康与保健品牌，并在旧金山和帕洛阿尔托设有公司办公点。十余年来，Calm 从新奇的移动正念应用一路走到机构化的行为健康整合。
            claimRefs:
              - CO001
              - CO002
              - CO011
