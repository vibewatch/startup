  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Calm 从 2012 年至 2026 年的基础、融资、产品和领导层里程碑年表。
    data:
      items:
        - date: 2012-05
          label: 公司成立
          detail: Alex Tew 和 Michael Acton Smith 在旧金山创办 Calm，打造数字正念和睡眠音频产品。
          claimRefs:
            - CO001
        - date: 2015-02
          label: Series A 融资
          detail: 获得 $4M 早期机构资本，用于扩大音频制作工作室和移动工程团队。
          claimRefs:
            - CO001
            - CO008
        - date: 2018-06
          label: Series A 扩张与收入运行率
          detail: 达到 $75M 年收入运行率后，由 Insight Partners 领投融资 $27M，估值 $250M。
          claimRefs:
            - CO008
            - CO010
        - date: 2019-02
          label: 独角兽地位（Series B）
          detail: 完成由 TPG Growth 领投的 $88M Series B 轮融资，投后估值达到 $1.0B。
          claimRefs:
            - CO006
        - date: 2020-12
          label: Series C 估值峰值
          detail: 由 Lightspeed Venture Partners 领投融资 $75M，疫情期间用户采用达到峰值，私人估值升至 $2.0B。
          claimRefs:
            - CO007
        - date: 2022-04
          label: CEO 交接与 Calm Health
          detail: David Ko 出任 CEO，推动医疗支付方合作和机构 B2B 企业产品加速发展。
          claimRefs:
            - CO003
            - CO011
        - date: 2024-07
          label: 规模里程碑
          detail: 全球移动端累计下载量超过 180 million，五星应用评价达到 3 million 条。
          claimRefs:
            - CO009
        - date: 2026-04
          label: 高管离任
          detail: David Ko 任 CEO 四年后，在高管倦怠和 AI 颠覆浮现之际卸任，转任董事会顾问。
          claimRefs:
            - CO003
            - CO004
