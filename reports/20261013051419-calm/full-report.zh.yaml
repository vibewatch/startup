              - CO008
              - CO009
              - CO010
              - CO011
      - number: '1.2'
        title: 运营规模与关键绩效指标
        blocks:
          - type: paragraph
            body: >-
              Calm 的商业扩张带来了巨大的消费者触达：累计移动下载量超过 180 million，并在 iOS 和 Android 生态中获得超过 3 million
              条高评级用户评价。商业化依靠免费增值架构，把入门冥想与订阅解锁的 Calm Premium、企业赞助的 Calm Health 结合起来。但私营公司披露边界让财务可见度大幅受限。经核实的历史收入在 2017
              年达到 $22 million，2018 年年中年化收入运行率达到 $75 million；此后的收入顶线、客户留存率和现金消耗指标仍是严格保密的私有数据。
            claimRefs:
