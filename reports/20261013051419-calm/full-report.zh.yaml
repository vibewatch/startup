        title: 产品范围、交付机制与模块架构
        blocks:
          - type: paragraph
            body: >-
              Calm 通过三种分发路径提供数字正念和行为健康解决方案：直接面向消费者的移动应用、通过 Calm Business 提供的企业雇主福利，以及通过 Calm Health
              提供的临床健康计划解决方案。消费者平台以引导式冥想、呼吸练习、环境音景、专注音乐和名人讲述的 Sleep Stories 为核心，旨在缓解急性压力并帮助入睡。移动端以 iOS 和 Android
