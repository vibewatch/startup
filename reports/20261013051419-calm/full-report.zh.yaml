          - type: callout
            title: 消费者流失与企业转型摩擦
            body: 随着新鲜感减弱，直接面向消费者的订阅持续承受流失压力；转向临床 Calm Health 则必须应对复杂的健康计划销售周期、临床疗效试验和严格的雇主采购。
            calloutType: risk
            claimRefs:
              - CU010
