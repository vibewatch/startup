  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与变现动态
        blocks:
          - type: paragraph
            body: >-
              Calm 的变现架构有三根支柱：消费者订阅、雇主健康福利和医疗整合。在直接面向消费者的 B2C 分发中，Calm 采用免费增值获客模式，提供有限的入门呼吸和冥想练习，并以每年 $69.99 或每月 $14.99
              的价格销售付费层级。通过 Apple 和 Google 应用商店分发，会让数字总账单承担 15% 至 30% 的平台渠道费，直接影响订阅的净实现利润率。为降低消费者波动和平台抽成，Calm 扩展了 Calm
              for Business，直接向企业人力资源部门销售多年期企业合同和批量员工许可证。此外，Calm Health 通过健康计划接入，把变现延伸到承担临床风险的人群，例如与 UnitedHealthcare
              等全国性付款方签订商业协议。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
