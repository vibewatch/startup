  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与现状替代品
        blocks:
          - type: paragraph
            body: >-
              数字心理健康市场涵盖消费者自助应用、助眠工具和雇主赞助的预防性行为健康工具。Calm 把正念产品化为消费者软件，由此建立品类领导地位，从传统冥想扩展到成人 Sleep
              Stories、音景和呼吸训练。可服务品类严格包括面向消费者的数字健康订阅、企业预防性心理健康项目和雇主数字健康福利；市场边界则排除临床精神科干预、需要 FDA
              许可的处方数字疗法及住院精神健康机构。关键邻接市场包括健身追踪穿戴设备、虚拟门诊远程治疗网络和高管教练平台。重要的是，Calm 的主要现状替代品不只是 Headspace 等竞品应用，还包括 YouTube
              上免费的助眠内容、有声书、播客、非处方助眠补充剂，以及未处理的员工倦怠。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
      - number: '2.2'
        title: 市场规模视角：TAM、SAM 与 SOM 的约束
        blocks:
          - type: paragraph
            body: >-
              评估心理健康机会，需要同时看宏观疾病负担和可服务的数字软件支出。先看最宽的宏观口径，根据 Calm Health 披露中引用的卫生机构数据，抑郁和焦虑每年给全球经济造成估计 $1 trillion
              的生产力损失。但把这一社会负担转化为可服务的软件支出后，市场要窄得多。全球数字健康和冥想应用细分市场在 2017 年后快速增长，2018 年增长 74 percent，达到 $140 million，主要由
              Calm 和 Headspace 等品类领导者贡献。疫情期高速增长之后，Business of Apps 的独立移动应用数据表明，消费者健康应用账单增速放缓；其估计 Calm 2025 年收入为 $210
              million，较此前峰值下降 24 percent，付费订阅用户稳定在约 3.5 million。相反，YesPress 的二手商业报道将 2024 年包含企业业务的收入记为约 $596 million，对应
              4 million 订阅用户，显示纯消费者应用商店收入与扩大的企业医疗合同价值之间存在显著差异。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM006
              - CM009
              - CM014
              - CM015
      - number: '2.3'
        title: 消费者与 B2B2C 渠道中的买方、用户和付款方分层
        blocks:
          - type: paragraph
            body: >-
              Calm 的商业引擎覆盖三个截然不同的买方群体，其采购周期和预算归属也完全不同。直接面向消费者的业务由个人移动用户组成，他们自费购买年订阅（每年 $40 至 $70），需求来自睡眠困扰、焦虑或新年计划重启。企业
              B2B 业务面向首席人力资源官和员工福利经理，他们采购 Calm Business 以应对职场缺勤，并向企业员工提供雇主补贴的订阅。以 Calm Health 及其接入 Solera Health
              等网络为支点的医疗付款方和临床网络业务，则面向商业健康计划和自保雇主。Calm 声称 Calm Health 已支持超过 3,500 个组织、覆盖 26 million 名参保人；二手报道则称覆盖人数最高达 39
              million。消费者获客靠名人旁白和应用商店曝光，企业扩张则取决于临床参与指标、覆盖人群接入，以及企业医疗理赔成本是否出现可证明的下降。
            claimRefs:
              - CM002
              - CM003
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: 采用驱动因素、结构性约束与证据缺口
        blocks:
          - type: paragraph
            body: >-
              数字心理健康工具的采用，受到心理医疗污名持续消退、企业广泛采用预防性健康福利，以及消费者智能手机高渗透率推动。但市场也面临明显的结构性逆风。订阅疲劳和疫情后消费者参与度正常化，压低了直接移动应用的增长。在企业市场，买方越来越要求严格的投资回报证据，审视员工是否在初次注册活动之后仍主动使用覆盖的福利。由于
              Calm 是预防性健康平台，而非获 FDA
              许可的医疗器械，健康计划报销仍依赖雇主自愿提供的健康津贴，而不是强制医疗福利覆盖。消费者应用商店账单与企业合同之间的经审计收入拆分仍存在关键证据缺口，因而无法确定性地调和 $210 million 与 $596
              million 两个相互冲突的市场估计。
            claimRefs:
              - CM001
              - CM006
              - CM010
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 消费者应用商店估计与企业合同规模分化
            body: >-
              Calm 的市场估计因分发范围不同而大幅分化。应用追踪分析师根据移动应用商店内购，把 2025 年收入估为 $210 million，反映后疫情常态化。相反，财务画像估计把多年期企业合同、Calm
              Business 许可证以及 Calm Health 覆盖人群付款方合作纳入后，将 2024 年收入估到 $596 million。
            calloutType: insight
            claimRefs:
              - CM005
              - CM010
              - CM013
          - type: callout
            title: 订阅疲劳与企业 ROI 审查威胁留存
            body: 随着可选消费收紧，消费者冥想应用面临更高流失，需要持续高成本获取名人内容来刷新参与度。同时，企业买方在续发健康津贴前越来越要求有可证明的医疗成本下降；如果员工使用率走低，留存就会承压。
            calloutType: risk
            claimRefs:
              - CM004
              - CM014
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争集合覆盖内容应用、护理平台与现状方案
        blocks:
          - type: paragraph
            body: >-
              Calm 参与的不止一个市场。面向消费者，Headspace 是最直接的付费冥想同类，Insight Timer
              是优先免费的替代品；免费音频、播客、设备原生健康工具和自助习惯也会降低订阅必要性。面向雇主和付款方，Tracxn 将 Spring Health、Lyra Health 和 Dialogue 列为 Calm
              的主要竞争者，但这些公司把数字入口与临床或远程医疗服务结合起来，并非完全相同的产品替代品。内部福利团队和既有员工援助计划也可能是现状替代方案，但现有证据没有量化其使用率或经济性。因此，Tracxn 列出的
              1,639 家活跃竞争者更适合作为分类信号，而不是买方层面的市场份额分母。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP011
              - CP013
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
