              - CP014
      - number: '3.2'
        title: 内容深度与睡眠是最清晰的消费者切入口
        blocks:
          - type: paragraph
            body: >-
              Calm 自有渠道介绍了超过 500 个 Sleep
              Stories、冥想、音乐、音景、呼吸工具，以及移动端、网页、手表和电视设备上的每月新增内容。广度支持发现和重复使用，而高级订阅解锁完整内容库。一份由联盟资助的独立评测认为 Sleep Stories
              和制作质量处于品类领先位置，但也指出初学者可能觉得内容库缺乏结构；在引导路径上，Headspace 更强。同一评测认为 Insight Timer
              是更好的优先免费选择。这些观察支持差异化消费者体验，但不是受控基准，也不能证明留存、临床疗效或独家内容权利。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP006
              - CP007
              - CP013
      - number: '3.3'
        title: 消费者定价透明，企业经济性不透明
        blocks:
          - type: paragraph
            body: >-
              可获得的消费者对比报告显示，Calm Premium 每月 $16.99、每年 $69.99-$79.99，Headspace 每年 $69.99；Calm
              自有页面则确认应用可免费下载、提供有限免费路径，完整访问需订阅。Calm 还用 30-day New Year Reset 等免费项目获客和提升参与度。在企业端，Calm Health
              推销组织级项目；一个独立但明确由 AI 生成的 Built In 页面描述了业务向付款方和雇主分发转移。现有来源没有披露 Calm
              或其护理平台竞争者可比的企业合同价格、折扣、续约条款或实际人均经济性，因此这些单元格保持未知，而不是估算值。
            claimRefs:
              - CP002
              - CP004
              - CP010
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP004
              - CP006
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: 品牌与内容库规模有帮助，但分发和免费替代品限制持久性
        blocks:
          - type: paragraph
            body: >-
              Calm
              的防御力最强之处，似乎在于品牌、大型专业制作内容库、睡眠专用形式和广泛设备覆盖彼此强化。这些资产会提高复制同等体验的成本，但用户可以同时使用低价应用、免费内容和雇主提供的福利，无需迁移专有数据。因此，负面情景并不是
              Calm 缺少产品质量，而是内容可以在别处试用、Headspace 可能提供更好的结构化引导，雇主买方也可以选择临床导向更强、资金更充足的平台。Built In 的 AI
              生成综合分析还提示消费者动能走弱、依赖企业执行；要形成投资判断，仍需先取得主要留存和合同证据。
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP010
              - CP015
