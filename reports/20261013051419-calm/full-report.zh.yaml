        title: 采用轨迹与漏斗转化
        blocks:
          - type: paragraph
            body: >-
              Calm 先用以习惯为中心的免费增值模式做大消费者漏斗顶部，再把触达转成用户。历史披露称累计移动下载量超过 180 million、应用商店五星评价达到 3 million，使 Calm
              成为数字健康领域的头部品牌。Calm 不强迫用户立即预付，而是通过免费的睡眠故事样本或引导式呼吸课程，在入门漏斗中先交付一次具体收益。用户形成日常或晚间习惯后，应用再提示订阅，以解锁更大的音频库。30-day
              New Year Reset 等季节性再参与活动，持续唤醒沉睡用户，并转化免费试用群组。但即便漏斗顶部移动下载和历史收入跑速在 2018 年达到 75 million 美元，2020
              年后的现代付费订阅用户数仍是严格保密的私有数据。
