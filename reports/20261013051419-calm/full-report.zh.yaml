  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层与买方经济性
        blocks:
          - type: paragraph
            body: >-
              Calm 把客户生态分为两类主要商业群体：直接面向消费者的个人订阅用户和机构 B2B 买方。直接面向消费者的群体是历史规模和现金创造的绝对基础，估计贡献整体收入的
              约九成。消费者通常在压力或失眠急性发作时发现平台，主要通过应用商店和网页直接结账支付月费或年费。相反，机构业务包括归入 Calm Health
              的企业健康项目和健康计划赞助。企业买方购买面向全体员工的访问权来应对倦怠，医疗付款方则寻求接入临床级行为健康资源。虽然企业合同金额更大、续约稳定性也可能更高，但消费者订阅者仍主导整体用户量和现金流。
            claimRefs:
              - CU002
