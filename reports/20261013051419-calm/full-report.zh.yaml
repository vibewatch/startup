      - number: '1.3'
        title: 管理层与董事会治理
        blocks:
          - type: paragraph
            body: >-
              David Ko 于 2026 年 4 月离任后，Calm 的高管治理正经历关键转折；他曾担任首席执行官四年。Ko 任内重点推动 Calm Health
              机构化，并深化与临床机构、雇主及付款方的关系。在坦率的离任后访谈中，Ko 将高压健康行业中的高管倦怠，以及生成式人工智能加速带来的冲击，列为离任的主要原因。董事会治理仍由 Michael Acton Smith
              和 Alex Tew 两位创始人负责；在积极寻找长期运营负责人期间，Ko 转任高级顾问，协助维持董事会连续性。
