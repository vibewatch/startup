            body: >-
              Calm 的技术运营架构把公开消费者客户端分发与私有企业、临床整合层分开。iOS 和 Android 客户端依靠原生平台媒体播放器，并用开源 PersistentStreamPlayer
              等专有工具维持后台音频连续性。对企业和健康计划合作伙伴，Calm 暴露托管在 Amazon Web Services 基础设施上的 Calm Partner API，地址为 auth.calm.com/v0。该
              REST 服务使用 OAuth 2.0 客户端凭证认证，管理合作伙伴成员订阅关联、开通和撤销。除 REST 端点外，Calm 支持 SAML 2.0 IdP 发起的单点登录，并通过入站 SFTP CSV
