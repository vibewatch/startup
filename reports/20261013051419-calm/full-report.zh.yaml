      - number: '4.2'
        title: 成本结构与单位经济性跑步机
        blocks:
          - type: paragraph
            body: >-
              Calm 依托云基础设施交付专有音频和数字体验，不承担实体分发成本，因此软件核心毛利率超过 85%。历史单位经济性显示自然获客循环强劲：综合客户获取成本为 $5 至 $7，客户终身价值估计约 $60，早期增长阶段
              LTV-to-CAC 比率达到 10:1。但消费者订阅模式受到品类流失的严重结构性逆风影响：更广泛的移动健康基准显示年流失率为 60% 至
              80%。这种流失迫使公司持续追加营销投入和高端名人授权支出，以补充正在流失的用户群。Calm Health 则建立机构参与基准，借此对冲这台消费者跑步机；报告称赞助人群的临床项目参与率为 38%，筛查完成率为
              77%。
