        title: 资本化历史与投资人联合体
        blocks:
          - type: paragraph
            body: >-
              Calm 的资产负债表由多轮机构融资搭建，最终在 2020 年 12 月完成 $75 million 的 Series C 融资，确定标志性投后估值 $2.0 billion。累计股权融资额在 $192
              million 至 $225 million 之间，涵盖种子轮、Series A、Series B 和 Series C。投资人联合体包括 Lightspeed Venture Partners、TPG
              Growth 和 Insight Partners 等一线机构赞助商，也有 Marc Benioff、Ashton Kutcher 等知名战略天使。尽管资本支持层级很高，2020
              年后没有新的定价轮，估值已经陈旧，投资人需要谨慎尽调。
