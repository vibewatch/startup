            title: 企业对比仍不足以完成投资判断
            body: >-
              现有证据没有为 Calm、Spring Health、Lyra、Dialogue
              或内部替代方案提供可比的合同价格、续约率、使用率、临床结果或买方胜负数据。该渠道的竞争结论仍只能作为方向性判断，直到取得主要采购和群组证据。
            calloutType: risk
            claimRefs:
