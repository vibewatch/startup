      - number: '6.4'
        title: 留存持久性、流失脆弱性与扩张摩擦
        blocks:
          - type: paragraph
            body: >-
              客户留存持久性是 Calm 最关键的运营脆弱点。在直接面向消费者的数字健康业务中，初始新鲜感消退、冥想习惯中断后，年订阅流失率通常很高。为了对抗流失，Calm
              高度依赖推送通知、睡前提醒、连续打卡和定期名人内容发布等参与机制。但对遭遇订阅疲劳的用户，游戏化的边际回报会下降。为建立持久的企业净收入留存，Calm 正积极通过 Calm Health
              转向雇主福利计划和临床医疗分发。该扩张策略需要在消费者式参与和严格临床结果测量、漫长医疗销售周期及复杂保险报销框架之间取得平衡。由于 Calm
              采用私营公司披露标准，经审计的净收入留存和多年订阅用户群留存曲线仍未披露。
            claimRefs:
              - CU003
              - CU010
              - CU011
              - CU015
      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 睡眠驱动的自然转化引擎
            body: Calm 把睡眠故事和睡前放松放在战略中心，将急性夜间失眠转化为强大的自然获客和转化漏斗，也因此区别于临床冥想应用。
