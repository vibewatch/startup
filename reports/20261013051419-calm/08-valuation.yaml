callouts:
  - calloutType: recommendation
    title: Valuation Discipline Requires Patient Monitoring
    body: >-
      While Calm has achieved rare brand recognition and impressive consumer download volume, its $2.0 billion peak
      valuation anchor is nearly six years stale. In the absence of an audited 2026 financing round or verified
      institutional secondary market pricing, investors should maintain a track posture rather than underwriting pre-IPO
      secondary transactions at legacy unicorn multiples.
    claimRefs:
      - CV001
      - CV010
      - CV013
  - calloutType: risk
    title: Leadership Transition and Commercial Execution Risk
    body: >-
      The April 2026 step-down of CEO David Ko introduces executive transition risk precisely as Calm attempts to scale
      its complex Calm Health B2B2C payer distribution model across institutional health plans and employer networks.
    claimRefs:
      - CV007
      - CV012
