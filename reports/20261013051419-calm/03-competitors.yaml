callouts:
  - calloutType: risk
    title: Enterprise comparison remains underwriting-incomplete
    body: >-
      The assigned evidence does not provide comparable contract prices, renewal rates,
      utilization, clinical outcomes, or buyer win-loss data for Calm, Spring Health, Lyra,
      Dialogue, or internal alternatives. Competitive conclusions in that channel remain
      directional until primary procurement and cohort evidence is obtained.
    claimRefs: [CP010, CP014, CP016]
