company:
  name: Calm
chapter:
  number: 3
  title: Competitors
  summary: >-
    Calm's strongest evidenced differentiation is a broad, polished sleep-and-meditation
    library distributed across major consumer platforms, while Headspace is positioned as
    the more structured beginner option and Insight Timer as the free-first substitute.
    In employer and payer channels, Calm also faces better-funded care-platform competitors,
    but comparable contract pricing, retention, and outcome data remain unavailable.
sections:
  - id: competitive-set
    title: The competitive set spans content apps, care platforms, and the status quo
    body: >-
      Calm competes in more than one market. For consumers, Headspace is the clearest paid
      meditation peer, Insight Timer is the free-first substitute, and free audio, podcasts,
      device-native wellness tools, and self-directed routines reduce the need to subscribe.
      For employers and payers, Tracxn places Spring Health, Lyra Health, and Dialogue among
      Calm's leading competitors, although those businesses combine digital entry points with
      clinical or telemedicine services and are not exact product substitutes. Internal
      benefits teams and incumbent employee-assistance programs are also plausible status-quo
      alternatives, but the assigned evidence does not quantify their usage or economics.
      Tracxn's unusually broad count of 1,639 active competitors is therefore best read as a
      taxonomy signal, not a buyer-level market-share denominator.
    claimRefs: [CP007, CP008, CP009, CP011, CP013, CP014]
    tableRefs: [TP001]
  - id: product-and-buying-criteria
    title: Content depth and sleep are the clearest consumer wedge
    body: >-
      Calm's owned surfaces describe more than 500 Sleep Stories, meditations, music,
      soundscapes, breathing tools, and monthly additions across mobile, web, watches, and
      television devices. That breadth supports discovery and repeat use, while the premium
      subscription gates the complete library. An affiliate-funded independent review
      characterizes Sleep Stories and production quality as category-leading, but also says
      the library can feel unstructured for beginners, where Headspace has the stronger guided
      path. The same review identifies Insight Timer as the better free-first choice. These
      observations support a differentiated consumer experience, but they are not controlled
      benchmarks and do not establish retention, clinical efficacy, or exclusive content rights.
    claimRefs: [CP001, CP002, CP003, CP005, CP006, CP015]
    tableRefs: [TP002]
  - id: pricing-and-distribution
    title: Consumer pricing is visible; enterprise economics are not
    body: >-
      The available consumer comparison reports Calm Premium at $16.99 per month or
      $69.99-$79.99 per year, with Headspace at $69.99 per year, while Calm's own pages confirm
      a free download, a limited free pathway, and subscription-gated full access. Calm also
      uses free programs such as its 30-day New Year Reset as an acquisition and engagement
      surface. On the enterprise side, Calm Health markets organization-level programs and an
      independent but explicitly AI-generated Built In page describes a shift toward payer and
      employer distribution. No assigned source discloses comparable enterprise contract
      prices, discounts, renewal terms, or realized per-member economics for Calm or its care
      platform competitors, so those cells remain unknown rather than estimated.
    claimRefs: [CP002, CP004, CP010, CP012, CP013, CP014]
    tableRefs: [TP003]
  - id: moat-and-displacement
    title: Brand and library scale help, but distribution and free substitutes cap durability
    body: >-
      Calm's defensibility appears strongest where brand, a large professionally produced
      library, sleep-specific formats, and broad device availability reinforce one another.
      Those assets can raise the cost of recreating the same experience, yet users can
      multi-home across low-cost apps, free content, and employer-provided benefits without
      migrating proprietary data. The adverse case is therefore not that Calm lacks product
      quality; it is that content can be sampled elsewhere, structured guidance may be better
      supplied by Headspace, and employer buyers can choose more clinically oriented,
      better-funded platforms. Built In's AI-generated synthesis also flags softer consumer
      momentum and dependence on enterprise execution, a directional warning that requires
      primary retention and contract evidence before it can support an underwriting conclusion.
    claimRefs: [CP005, CP006, CP008, CP010, CP015, CP016]
    figureRefs: [FP001]
