  claims:
    - id: CV001
      statement: Kylinsoft is the policy-anointed leader of China's domestic-OS substitution, holding roughly 70% of the party-government desktop segment and fourteen consecutive years atop China's Linux market.
      type: third-party-reported
      topic: market-position
      sourceRefs: [SV024, SV017]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QV001]
    - id: CV002
      statement: Kylinsoft reported 2024 revenue of 1.438 billion yuan and net profit of 502 million yuan, a roughly 35% net margin.
      type: third-party-reported
      topic: financials
      sourceRefs: [SV013, SV009]
      confidence: high
      freshness: current
      answersQuestionRefs: [QV001, QV028]
    - id: CV003
      statement: A deep-pocketed state parent injected 3 billion yuan into Kylinsoft in 2025, de-risking funding.
      type: third-party-reported
      topic: capital
      sourceRefs: [SV022, SV014]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QV001]
    - id: CV004
      statement: Demand is administratively manufactured through Xinchuang procurement mandates rather than competitively won, so the durable moat is policy rather than product.
      type: inferred
      topic: anti-thesis
      sourceRefs: [SV017, SV015]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QV002]
    - id: CV005
      statement: Private-sector and consumer penetration is negligible and Windows still dominates China's open desktop market.
      type: third-party-reported
      topic: anti-thesis
      sourceRefs: [SV016, SV015]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QV002, QV029]
    - id: CV006
      statement: Kylinsoft's installed base exceeds 16 million deployments across banks, grids, telecoms and aerospace.
      type: third-party-reported
      topic: traction
      sourceRefs: [SV024, SV015]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QV001, QV028]
    - id: CV007
      statement: The portfolio is a downstream Linux distribution whose domestic-silicon supply chain is constrained by US export controls on CEC-affiliated CPUs.
      type: inferred
      topic: anti-thesis
      sourceRefs: [SV015, SV008]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QV002, QV026]
    - id: CV008
      statement: Large buyers multi-home with UnionTech UOS and increasingly Huawei openEuler/HarmonyOS, so Kylinsoft has no exclusive lock even inside the protected market.
      type: third-party-reported
      topic: competition
      sourceRefs: [SV029, SV030, SV028]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QV029]
    - id: CV009
      statement: The investable question is whether Kylinsoft's profitability is organic and durable or policy-contingent and stranded if the mandate eases.
      type: open-question
      topic: thesis-framing
      sourceRefs: [SV017, SV021]
      confidence: low
      freshness: current
      answersQuestionRefs: [QV003]
    - id: CV010
