chapter:
  number: 8
  title: Valuation
  summary: >-
    Kylinsoft is the rare frontier-tech asset that is already profitable, but the
    investment case is a bet on the durability of state sponsorship rather than on
    market-tested demand. The thesis: a structurally protected #1 position in
    China's mandated domestic-OS substitution (Xinchuang), 16M+ deployments, a
    modern Linux 6.6-based V11 stack, ~1.6 billion yuan of revenue at a ~35% net
    margin, and a deep-pocketed state parent. The anti-thesis: demand is
    administratively created, private-sector penetration is negligible, the OS is
    a downstream Linux distribution exposed to export controls on the domestic
    silicon it runs on, disclosure is thin (no audited standalone accounts), and
    the 8.355 billion yuan headline is a related-party appraisal, not a market
    clearing price. On multiples the mark (~5x trailing revenue) is broadly in
    line with listed Xinchuang software comparables (China Software ~4.8x, sector
    3-6x) and below faster-growing UnionTech, so it is not egregious — but it is
    not independently validated and carries an unquantified subsidy component.
    Recommendation: TRACK / research-more, low-to-medium confidence, high risk
    rating, valuation stance full-to-stretched on a risk-adjusted basis. The
    decision pivots on three diligence asks: audited standalone accounts, the
    subsidy share of profit, and a market-tested valuation reference.
sections:
  - id: thesis-and-antithesis
    title: Investment Thesis and Anti-Thesis
    body: >-
      The bull thesis rests on six reinforcing facts established across this
      report. Kylinsoft is the policy-anointed leader of China's domestic-OS
      substitution, with roughly 70% of the party-government desktop segment and
      fourteen consecutive years atop China's Linux market; its installed base
      exceeds 16 million deployments across banks, grids, telecoms and aerospace;
      Galaxy Kylin V11 is a modern, certified Linux 6.6-based stack with an
      integrated security and AI architecture; the company is genuinely profitable
      (about 1.6 billion yuan revenue at a ~35% net margin), unlike most venture
      assets; it is funded and de-risked by a deep-pocketed state parent that just
      injected 3 billion yuan; and the addressable Xinchuang migration still has
      years of mandated runway. The anti-thesis is equally structural: demand is
      administratively manufactured rather than competitively won, so the durable
      moat is policy, not product; private-sector and consumer penetration is
      negligible and Windows still dominates the open market; the portfolio is a
      downstream Linux distribution whose silicon supply chain is throttled by US
      export controls on CEC-affiliated CPUs; large buyers multi-home with
      UnionTech UOS and increasingly Huawei openEuler/HarmonyOS, so there is no
      exclusive lock even inside the protected market; and financial disclosure is
      thin, with no audited standalone statements and an unquantified government-
      subsidy share of profit. The investable question is therefore not whether
      Kylinsoft makes money today — it does — but whether that profitability is
      organic and durable or policy-contingent and stranded if the mandate eases.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV008, CV009]
    tableRefs: [TV002]
    figureRefs: [FV001]
  - id: recommendation-and-entry-discipline
    title: Recommendation, Confidence, and Entry Discipline
    body: >-
      The recommendation is TRACK / research-more at low-to-medium confidence with
      a high risk rating. The rationale is that the asset is fundamentally sound
      but the entry price cannot be independently underwritten: the 8.355 billion
      yuan mark is an end-2023 appraisal filed for a related-party capital
      increase, not a competitively cleared round, and the headline 47.23% stake
      lift and 3 billion yuan injection both flow from the same state group, so
      there is no arm's-length price discovery and no third-party preference or
      dilution structure to anchor entry. On a multiples basis the mark is
      defensible — roughly 5x trailing revenue against listed Xinchuang software
      peers at 3-6x and below faster-growing UnionTech — but multiples on
      mandate-driven revenue overstate quality if a material share of profit is
      subsidy. Entry discipline therefore requires a discount to the appraisal mark
      to compensate for non-market price formation, disclosure opacity and
      geopolitical tail risk, plus contractual information rights to obtain
      standalone accounts. For a state or strategic investor the asset is a
      hold/accumulate within the national-champion mandate; for an independent
      financial investor without information rights, the correct posture is to
      track pending the three gating diligence items rather than to underwrite the
      headline valuation at face value.
    claimRefs: [CV010, CV011, CV012, CV013, CV014, CV015, CV016, CV017]
    tableRefs: [TV001]
    figureRefs: [FV004]
  - id: financing-context-and-comparables
    title: Financing Context and Comparable Valuation
    body: >-
      The reference set for Kylinsoft is the listed and pre-IPO Xinchuang software
      cohort. Its listed parent, China National Software (CSS, 600536), trades near
      28 billion yuan of market capitalization on roughly 5.9 billion yuan of
      forward revenue — about 4.8x sales — at a ~52% gross margin, having only just
      returned to breakeven. Direct OS peer UnionTech (UOS) is preparing a STAR
      Market IPO, was valued in the 6-10 billion yuan range on 2025 revenue of
      about 718 million yuan (up ~62%) and a first-time net profit near 239 million
      yuan, implying a much richer 8-14x sales multiple that the market is willing
      to pay for higher growth and an imminent liquidity event. Broader
      application-software comparables bracket the range: Kingsoft Office trades
      around 16x sales on a >30% net margin, while Yonyou and Taiji sit at roughly
      3-4x. Against this set, Kylinsoft's 8.355 billion yuan appraisal on about 1.6
      billion yuan of revenue (~5x trailing sales) is mid-cohort — richer than the
      slow-growth ERP/integrator names, cheaper than UOS and Kingsoft — and is
      supported by genuine profitability that several peers lack. The caveats are
      that the Xinchuang sector has de-rated from 10-20x sales in 2020-2022 to 3-6x
      by 2026, that the Kylinsoft mark is an appraisal rather than a market round,
      and that its revenue is more mandate-concentrated than the diversified
      comparables, so the like-for-like multiple should arguably carry a
      concentration discount rather than a premium.
    claimRefs: [CV018, CV019, CV020, CV021, CV022, CV023, CV024, CV025, CV026]
    tableRefs: [TV004]
    figureRefs: [FV002]
  - id: scenarios-and-valuation-range
    title: Bull / Base / Bear Scenarios and Valuation Range
    body: >-
      The base case assumes the Xinchuang mandate persists through the late-2020s,
      revenue compounds at the disclosed low-teens rate, the ~35% margin holds with
      a modest subsidy tail, and the multiple stays in the peer 4-5x band; that
      supports a valuation of roughly 8-10 billion yuan, essentially validating the
      appraisal mark. The bull case adds genuine private-sector and overseas
      traction, AI-OS and smart-connected (Kylin 100) monetization, and a re-rating
      toward 6-8x on UOS-style growth optics or an eventual public listing, lifting
      value to roughly 12-18 billion yuan. The bear case is a loosening of
      procurement mandates or a successor-policy gap after 2025 targets, intensified
      multi-homing with UOS and HarmonyOS, an export-control shock to the domestic
      silicon roadmap, or a disclosure event revealing subsidy-dependent rather than
      organic profit; any of these compresses the multiple to a 2-3x distressed-
      Xinchuang level and value to roughly 4-6 billion yuan. The distribution is
      asymmetric to the downside because the upside requires the company to do
      something it has not yet demonstrated — win unmandated demand — while the
      downside requires only that the policy tailwind it already depends on weakens.
      Probability signals favor the base case in the near term given entrenched
      policy, but the bear scenario's triggers are more controllable by external
      forces (US export policy, Chinese procurement policy) than by management.
    claimRefs: [CV027, CV028, CV029, CV030, CV031, CV032, CV033, CV034]
    tableRefs: [TV003]
    figureRefs: [FV003]
  - id: exit-readiness-and-diligence-asks
    title: Exit Readiness, Kill Triggers, and Final Diligence Asks
    body: >-
      Exit readiness is moderate and improving but indirect. The clearest liquidity
      path is a domestic public listing — either a STAR Market IPO mirroring
      UnionTech's audit-and-restructure track or continued value crystallization
      inside listed parent CSS — but no Kylinsoft filing exists, so a near-term
      arm's-length exit is unconfirmed and state ownership constrains control
      transfers. The thesis breaks on four monitorable triggers: a loosening or
      successor-gap in Xinchuang procurement mandates; new US export controls that
      choke the Phytium/Kunpeng/Loongson silicon the OS certifies against; a
      credible "套壳" or security finding that damages certification standing; or
      standalone disclosure showing a government-subsidy share of profit above ~50%.
      Each trigger maps to a concrete valuation action, from re-rating the multiple
      down to walking away. The three priority diligence asks that gate the
      recommendation are: audited standalone Kylinsoft financial statements (to
      verify the single consolidated revenue line and cash position); a
      reconciliation of net profit to government grants and tax incentives (to test
      organic profitability); and a market-tested valuation reference or updated
      appraisal with the full capital-increase agreement (to underwrite the
      8.355 billion yuan mark). Until those are answered, the asset is a
      high-conviction strategic hold for the state and a track-and-monitor for an
      independent investor.
    claimRefs: [CV035, CV036, CV037, CV038, CV039, CV040, CV041, CV042]
    tableRefs: [TV005, TV006]
