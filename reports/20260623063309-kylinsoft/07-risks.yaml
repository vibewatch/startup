  claims:
    - id: CR001
      statement: Kylinsoft's most material risks are geopolitical and policy-structural rather than operational, led by export-control exposure and mandate dependence.
      type: inferred
      topic: risk-ranking
      sourceRefs: [SR001, SR016, SR022]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QR001]
    - id: CR002
      statement: Likelihood is highest for ecosystem and disclosure risks that are already partly realized, and lower but higher-impact for an abrupt geopolitical or policy shift.
      type: estimated
      topic: risk-likelihood
      sourceRefs: [SR018, SR022, SR011]
      confidence: low
      freshness: current
      answersQuestionRefs: [QR002]
    - id: CR003
      statement: Mitigation maturity is strongest on security certification and weakest on private-market diversification and financial disclosure.
      type: inferred
      topic: mitigation-maturity
      sourceRefs: [SR022, SR014]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QR003]
    - id: CR004
      statement: Residual exposure is concentrated in mandate dependence, export controls, ecosystem gaps and profit-quality opacity.
      type: inferred
      topic: residual-exposure
      sourceRefs: [SR001, SR016, SR013]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QR001]
    - id: CR005
      statement: Operational continuity risk is comparatively low because the product is field-proven across banks, power grids and aerospace deployments.
      type: inferred
      topic: operational-continuity
      sourceRefs: [SR023, SR025]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QR013]
    - id: CR006
      statement: The thesis is concentrated on continued state sponsorship, which both creates demand and constitutes the principal single point of failure.
      type: inferred
      topic: thesis-concentration
      sourceRefs: [SR007, SR022]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QR014]
    - id: CR007
      statement: Competitive multi-homing means the installed base is policy-protected but not market-proven against rivals.
      type: inferred
      topic: market-validation
      sourceRefs: [SR020, SR021, SR016]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QR017]
    - id: CR008
      statement: The financial-disclosure band carries real underwriting risk from a loss-making parent, undisclosed standalone accounts and an appraisal-based valuation.
      type: inferred
      topic: financial-disclosure
      sourceRefs: [SR012, SR014]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QR018, QR022]
    - id: CR009
      statement: China Electronics Corporation (CEC), Kylinsoft's ultimate state parent, is designated on the US Commerce Department's Entity List and tracked as a sanctioned/debarred entity.
      type: observed
      topic: geopolitical-risk
      sourceRefs: [SR001, SR004, SR007]
      confidence: high
      freshness: current
      answersQuestionRefs: [QR004]
    - id: CR010
      statement: US Bureau of Industry and Security rules through 2024-2026 tightened controls on advanced chips and semiconductor tooling reaching Chinese state-electronics groups, including Foreign Direct Product Rule extensions.
      type: third-party-reported
      topic: export-control
      sourceRefs: [SR004, SR015]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QR004, QR027]
    - id: CR011
      statement: Export controls indirectly cap the performance ceiling of the domestic CPUs (Phytium, Kunpeng, Loongson) that Kylin certifies against by constraining their access to leading-edge silicon and EDA tooling.
      type: inferred
      topic: silicon-supply-risk
      sourceRefs: [SR029, SR026]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QR005, QR011]
    - id: CR012
      statement: Phytium, a key Kylin-certified ARM CPU vendor, is itself subject to US export-control listing, illustrating the silicon-supply exposure.
      type: third-party-reported
      topic: silicon-supply-risk
      sourceRefs: [SR029]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QR005]
    - id: CR013
      statement: The Galaxy Kylin portfolio is a derivative of the GPLv2 Linux kernel and inherits its copyleft obligations to distribute corresponding source and avoid additional restrictions.
      type: observed
      topic: license-risk
      sourceRefs: [SR002, SR005, SR030]
      confidence: high
      freshness: current
      answersQuestionRefs: [QR006]
    - id: CR014
      statement: GPLv2 obligations both constrain proprietary lock-in and underpin recurring "套壳" criticism that the system is customized Linux rather than autonomous IP.
      type: inferred
      topic: license-risk
      sourceRefs: [SR003, SR031]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QR006, QR012]
    - id: CR015
      statement: China's Cybersecurity Law, Data Security Law, classified-protection (等保) regime and Critical Information Infrastructure rules mandate secure-and-controllable domestic software in priority sectors.
      type: third-party-reported
      topic: regulatory-tailwind
      sourceRefs: [SR008, SR009]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QR007]
    - id: CR016
      statement: Because demand is administratively created by Xinchuang and localization policy, a change in procurement rules, certification criteria or political priority is itself a regulatory risk to the revenue base.
      type: inferred
      topic: mandate-dependence
      sourceRefs: [SR010, SR022]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QR008]
    - id: CR017
      statement: Made-in-China-2025-style localization targets are time-bounded policy, so a post-2025 shift in successor targets introduces uncertainty for mandated demand.
      type: inferred
      topic: policy-horizon
      sourceRefs: [SR010, SR015]
      confidence: low
      freshness: current
      answersQuestionRefs: [QR008]
    - id: CR018
      statement: Galaxy Kylin V11 is built on the Linux 6.6 LTS kernel, tethering its security and roadmap to that upstream branch.
      type: observed
      topic: kernel-dependency
      sourceRefs: [SR023, SR005]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QR009]
    - id: CR019
      statement: The Linux 6.6 LTS maintenance window, originally scheduled to end in December 2026, was extended to end-2027, easing the immediate end-of-life cliff.
      type: observed
      topic: kernel-lts-horizon
      sourceRefs: [SR006, SR005]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QR009]
    - id: CR020
      statement: Hardware enablement, security fixes and driver coverage are inherited from upstream and from domestic-CPU vendors, fragmenting testing across at least six instruction-set targets.
      type: inferred
      topic: compatibility-risk
      sourceRefs: [SR026, SR029, SR030]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QR010]
    - id: CR021
      statement: Xinchuang migrations produce recurring field complaints of drivers that will not install and unstable application compatibility across CPU architectures.
      type: third-party-reported
      topic: compatibility-risk
      sourceRefs: [SR022]
      confidence: low
      freshness: current
      answersQuestionRefs: [QR010]
    - id: CR022
      statement: The application ecosystem remains far thinner than Windows for professional design, engineering and gaming software, and peripheral driver coverage is uneven.
      type: third-party-reported
      topic: ecosystem-gap
      sourceRefs: [SR022, SR016]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QR011]
    - id: CR023
      statement: The "套壳" critique holds that Kylin's differentiation is integration and UI rather than kernel-level innovation, a reputational and procurement-credibility risk.
      type: conflicting
      topic: autonomy-credibility
      sourceRefs: [SR031, SR016]
      contradictsClaimRefs: [CR025]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QR012]
    - id: CR024
      statement: The critique is partially conceded by Kylinsoft's own documentation that the system is Linux-based and compatible with mainstream Linux ecosystems.
      type: observed
      topic: autonomy-credibility
      sourceRefs: [SR031, SR023]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QR012]
    - id: CR025
      statement: Kylinsoft counters the shell-over-Linux framing with self-developed components such as the Panshi immutable architecture and the UKUI desktop environment.
      type: conflicting
      topic: autonomy-credibility
      sourceRefs: [SR023, SR027]
      contradictsClaimRefs: [CR023]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QR012]
    - id: CR026
      statement: A credible security or originality finding could tighten localization criteria toward genuine root-technology autonomy and threaten certification standing.
      type: inferred
      topic: certification-risk
      sourceRefs: [SR016, SR031]
      confidence: low
      freshness: current
      answersQuestionRefs: [QR030]
    - id: CR027
      statement: Kylinsoft's controlling shareholder and principal capital provider is China National Software, itself controlled by CEC, concentrating ownership, channel and funding in one state group.
      type: observed
      topic: ownership-concentration
      sourceRefs: [SR007, SR014]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QR014]
    - id: CR028
      statement: The portfolio depends on the upstream Linux kernel community and the OpenAtom Foundation for openKylin governance, neither of which Kylinsoft controls.
      type: inferred
      topic: upstream-dependency
      sourceRefs: [SR030, SR024, SR028]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QR015]
    - id: CR029
      statement: The portfolio depends on a handful of domestic CPU vendors whose own roadmaps are export-control constrained.
      type: inferred
      topic: silicon-dependency
      sourceRefs: [SR026, SR029]
      confidence: medium
      freshness: current
