        - { from: openatom, to: kylin }
        - { from: cpus, to: kylin }
        - { from: kylin, to: buyers }
        - { from: competitors, to: buyers }
    approximationNotes: >-
      Nodes show principal dependencies; the demand edge from rivals reflects
