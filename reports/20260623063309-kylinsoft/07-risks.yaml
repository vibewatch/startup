    - type: quantification-gap
      severity: material
      topic: risk-likelihood
      missingEvidence: Quantified probabilities and impact magnitudes for each risk category.
      whyItMatters: The heatmap relies on qualitative bands that cannot be converted into expected-loss estimates.
      diligencePath: Build a scored risk model with management input and external base rates.
