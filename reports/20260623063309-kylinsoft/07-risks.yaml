    - type: private-evidence-only
      severity: material
      topic: profit-quality
      missingEvidence: The government-subsidy and tax-incentive share of Kylinsoft's net profit.
      whyItMatters: A high subsidy share would reclassify the company as subsidy-dependent and lower the multiple.
      diligencePath: Reconcile net profit to government-grant and tax-relief notes in audited standalone accounts.
      relatedQuestionRefs: [QR019]
