schemaVersion: "report-v2"
artifact: risks
slug: kylinsoft
runDate: 2026-06-23
company:
  name: Kylinsoft
chapter:
  number: 7
  title: Risks
  summary: >-
    Kylinsoft's risk profile is dominated by the same state-and-policy machinery
    that powers its growth. The most material exposures are geopolitical and
    structural rather than operational: its ultimate parent, China Electronics
    Corporation (CEC), sits on the US Entity List, capping access to leading-edge
    foreign silicon and tooling; demand is overwhelmingly manufactured by
    Xinchuang substitution mandates, so private-market validation is thin and a
    policy reversal would hit revenue directly; and the entire portfolio is built
    on the GPLv2 Linux kernel, bounding "self-developed" claims and tethering the
    flagship Galaxy Kylin V11 to the upstream Linux 6.6 LTS maintenance horizon
    (now extended to end-2027). Operationally the product is mature and certified,
    but ecosystem breadth, cross-CPU compatibility and "套壳" (shell-over-Linux)
    criticism remain open. Financially the operating company is profitable, yet
    its listed parent China National Software (CSS, 600536) is loss-making, R&D
    intensity exceeds 22% of revenue, and the 8.355 billion yuan valuation is an
    appraisal mark, not a market test. None of these are near-term solvency
    threats, but together they cap the underwritable upside and concentrate the
    thesis on continued state sponsorship.
sections:
  - id: risk-overview-and-ranking
    title: Severity-Ranked Risk Overview
    body: >-
      Ranked by residual exposure, Kylinsoft's risks cluster into four bands. The
      top band is geopolitical and policy-structural: CEC's Entity-List status and
      the broader US-China technology war constrain the domestic-silicon supply
      chain the OS must run on, while the company's revenue depends on the
      durability of state procurement mandates rather than competitive demand. The
      second band is technical-dependency risk: the portfolio is a downstream
      Linux distribution, so its security, hardware enablement and roadmap inherit
      the GPLv2 Linux kernel and the Linux 6.6 LTS support window, and any lapse in
      upstream tracking or a "套壳" credibility shock would erode the autonomy
      narrative that justifies the premium. The third band is commercial and
      ecosystem risk: low private-sector penetration, application and peripheral
      compatibility gaps, fragmentation across six-plus domestic CPU architectures,
      and head-to-head multi-homing against UnionTech UOS and Huawei's openEuler/
      HarmonyOS leave the installed base policy-protected but not market-proven.
      The fourth band is financial-disclosure risk: a loss-making listed parent,
      undisclosed standalone accounts, an appraisal-based valuation, and an
      unquantified government-subsidy share of profit. Likelihood is highest for
      the ecosystem and disclosure risks (already realized in part) and lower but
      higher-impact for an abrupt geopolitical or policy shift. Mitigation maturity
      is strongest on certification and least developed on private-market
      diversification and disclosure transparency.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR007, CR008]
    figureRefs: [FR001]
  - id: regulatory-legal-and-geopolitical
    title: Regulatory, Legal, and Geopolitical Risk
    body: >-
      The defining external risk is geopolitical. CEC, Kylinsoft's ultimate
      state owner through China National Software, is designated on the US
      Commerce Department's Entity List, and successive 2024-2026 Bureau of
      Industry and Security rules have tightened controls on advanced chips and
      semiconductor tooling reaching Chinese state-electronics groups, including
      Foreign Direct Product Rule extensions. This restricts the leading-edge
      silicon and EDA tooling available to the domestic CPUs (Phytium, Kunpeng,
      Loongson) that Kylin certifies against, indirectly capping the performance
      ceiling of the hardware-plus-OS stack. Legally, the entire portfolio is a
      derivative of the GPLv2 Linux kernel: Kylinsoft must distribute corresponding
      source for kernel modifications and cannot impose additional restrictions,
      which both constrains proprietary lock-in and underpins recurring "套壳"
      criticism that the system is a customized Linux rather than autonomous IP.
      Domestically the regulatory backdrop is a tailwind that doubles as a
      dependency: the Cybersecurity Law, Data Security Law, classified-protection
      (等保) regime, Critical Information Infrastructure rules and the Xinchuang
      procurement framework mandate secure-and-controllable domestic software in
      party-government, finance, telecom and energy systems. That demand is
      administratively created, so a change in procurement policy, certification
      criteria, or the political priority attached to Made-in-China-2025-style
      localization targets is itself a regulatory risk to the revenue base.
    claimRefs: [CR009, CR010, CR011, CR012, CR013, CR014, CR015, CR016, CR017]
    tableRefs: [TR001]
    figureRefs: [FR002]
  - id: operational-technical-and-ecosystem
    title: Operational, Technical, and Ecosystem Risk
    body: >-
      Operationally Kylinsoft ships a mature, certified product, but its technical
      risks are those of a downstream distribution. Galaxy Kylin V11 is built on
      the Linux 6.6 LTS kernel; that branch's upstream maintenance was scheduled to
      end in December 2026 but was extended to end-2027, so the immediate
      end-of-life cliff has eased while the structural dependency on upstream
      maintainers remains. Hardware enablement, security fixes and driver coverage
      are inherited from upstream and from domestic-CPU vendors, which fragments
      testing across at least six instruction-set targets (x86 via Zhaoxin/Hygon,
      ARM via Phytium/Kunpeng, LoongArch via Loongson) and produces the recurring
      field complaints — drivers that will not install, unstable application
      compatibility — reported during Xinchuang migrations. The application
      ecosystem, though growing, remains far thinner than Windows for professional
      design, engineering and gaming software, and peripheral driver coverage is
      uneven. The "套壳" critique — that the differentiation is integration and UI
      rather than kernel-level innovation — is partially conceded by the company's
      own documentation that the system is Linux-based, and is a reputational and
      procurement-credibility risk if localization criteria tighten toward
      genuine root-technology autonomy. Operational continuity risk is otherwise
      low: the product is field-proven in banks, grids and aerospace deployments.
    claimRefs: [CR018, CR019, CR020, CR021, CR022, CR023, CR024, CR025, CR026]
    tableRefs: [TR002]
  - id: partner-dependency-and-concentration
    title: Partner, Dependency, and Concentration Risk
    body: >-
      Kylinsoft's dependency graph is unusually concentrated on the state. Its
      controlling shareholder and capital provider is China National Software,
      itself controlled by CEC, so ownership, distribution channel, key-customer
      sponsorship and a large share of equity funding all route through a single
      state group — a concentration that is stabilizing in the current policy
      regime but a single point of failure if state priorities shift. Technically
      the portfolio depends on the upstream Linux kernel community and the OpenAtom
      Foundation (for openKylin governance), neither of which Kylinsoft controls,
      and on a handful of domestic CPU vendors whose own roadmaps are export-control
      constrained. Commercially, demand is concentrated in party-government,
      finance, telecom and energy buyers procuring under mandate, with the company
      itself acknowledging negligible private-sector and individual-consumer
      penetration; this customer concentration means the installed base is durable
      only as long as the mandate persists. Competitive multi-homing compounds the
      dependency: large buyers routinely qualify both Kylin and UnionTech UOS (and
      increasingly Huawei openEuler/HarmonyOS), so Kylinsoft does not have
      exclusive lock on its own protected market and competes on adaptation depth
      and certification rather than switching cost alone.
    claimRefs: [CR027, CR028, CR029, CR030, CR031, CR032, CR033, CR034]
    tableRefs: [TR003, TR004]
    figureRefs: [FR003]
  - id: financial-model-mitigations-and-kill-criteria
    title: Financial-Model Risk, Mitigations, and Kill Criteria
    body: >-
      The operating company is profitable, but the financial-disclosure picture
      carries real underwriting risk. Kylinsoft's standalone accounts are not
      published; its results reach the market only as a segment line inside listed
      parent China National Software (CSS, 600536), which is itself loss-making —
      CSS reported a 2025 net loss of about 41 million yuan (sharply narrowed from
      the prior year) on roughly 5.1 billion yuan of revenue, with party-government
      solution revenue declining and basic-software (the Kylin line) the main
      growth engine. R&D intensity above 22% of revenue pressures near-term margin,
      operating cash flow has been volatile at the parent, and the implied
      government-subsidy and tax-incentive share of Kylinsoft's ~35% net margin is
      unquantified, so true operating profitability cannot be isolated. The 8.355
      billion yuan valuation is an end-2023 appraisal mark filed for a related-party
      capital increase, not a market-tested price. Mitigations are real but
      partial: deep certification and a sticky mandated base protect revenue;
      a 3 billion yuan 2025 raise and positive net income fund R&D without external
      debt; and ecosystem programs are expanding the application base. The thesis
      breaks if procurement mandates loosen, if a credible "套壳" or security
      finding damages certification standing, if export controls choke the domestic
      silicon the OS depends on, or if standalone disclosure reveals subsidy-
      dependent rather than organic profitability. Priority diligence asks are the
      audited standalone accounts, the subsidy reconciliation, and a market-tested
      valuation reference.
    claimRefs: [CR035, CR036, CR037, CR038, CR039, CR040, CR041, CR042]
    tableRefs: [TR005]
