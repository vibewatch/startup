    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      How an external policy or geopolitical shock propagates through the
      dependency chain into Kylinsoft's revenue and valuation.
    data:
      nodes:
        - { id: entitylist, label: "CEC on US Entity List / export controls" }
        - { id: silicon, label: "Constrained domestic CPU roadmaps" }
        - { id: mandate, label: "Xinchuang procurement mandate" }
        - { id: demand, label: "Administratively created demand" }
        - { id: ecosystem, label: "Ecosystem / compatibility gaps" }
        - { id: revenue, label: "Mandate-protected revenue" }
        - { id: valuation, label: "Appraisal-based valuation (8.355B)" }
      edges:
        - { from: entitylist, to: silicon }
        - { from: silicon, to: ecosystem }
        - { from: mandate, to: demand }
        - { from: demand, to: revenue }
        - { from: ecosystem, to: revenue }
        - { from: revenue, to: valuation }
        - { from: entitylist, to: valuation }
    approximationNotes: >-
      Edges trace principal transmission paths from external shocks to financial
      outcomes; magnitudes are not modeled.
    claimRefs: [CR009, CR010, CR013, CR020, CR037, CR039]
