      - number: '4.4'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              从收入质量看，Kylinsoft 在持久性上得分高，在透明度上得分低：收入具有经常性、受命令保护且盈利，但只披露为一条合并口径，分部和授权对服务结构未知，约 35%
              净利率无法拆分为经营利润、政府补贴和税收减免。从利润率路径看，高隐含软件利润率令人鼓舞，但多架构适配成本上升和生态补贴（5 亿元人民币伙伴基金）可能挤压利润；亏损的上市母公司也强化了这一点——CSS 2024
              年收入 51.98 亿元人民币，同比下降 22.69%，净亏损约 4.13 亿元人民币——Kylinsoft 是集团利润引擎，承载着较弱关联公司。资本强度上，模式轻资产且目前可自我供血，但 30
              亿元人民币融资表明，维持前沿 OS 研发需要周期性大额国资注入，而非纯靠内生现金。决定性承销阻塞项是估值证据：83.55 亿元人民币标记是 2023
