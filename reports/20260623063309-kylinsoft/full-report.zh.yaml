      - number: '7.4'
        title: 伙伴、依赖与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Kylinsoft 的依赖图异常集中在国家体系上。控股股东和资本提供方是 China National Software，后者又由 CEC
              控制，因此所有权、分销渠道、关键客户背书和很大一部分股权资金都穿过同一个国有集团——在当前政策周期里，这种集中度提供稳定性；一旦国家优先级变化，它也是单点故障。技术上，产品组合依赖上游 Linux kernel
              社区和 OpenAtom Foundation（openKylin 治理），Kylinsoft 都不控制；还依赖少数国产 CPU
              厂商，而这些厂商自己的路线图也受出口管制约束。商业上，需求集中在党政、金融、通信和能源等按政策要求采购的买方；公司自己也承认民营部门和个人消费者渗透率很低。这意味着装机基础只有在政策要求延续时才耐久。竞争性多供应商部署又放大依赖：大买方通常同时认证
              Kylin 和 UnionTech UOS（并越来越多纳入 Huawei openEuler/HarmonyOS），所以 Kylinsoft
              即便在受保护市场里也没有独占锁定，竞争靠的是适配深度和认证，而不只是切换成本。
