      - number: '6.2'
        title: 采用轨迹与具名客户证据
        blocks:
          - type: paragraph
            body: >-
              Kylinsoft 披露的装机盘子很大，而且仍在增长：截至 2025 年 8 月行业大会，部署量超过 1600 万（1,600万）；不同来源给出的累计口径超过 2000 万套，服务组织数从 70,000+ 到
              210,000+ 不等；按装机量算，它已连续 14 年位居中国 Linux 第一。具名生产案例——不是试点——支撑了覆盖广度。能源侧，State Grid 某下属单位管理 2,000 多座变电站，称 Galaxy
              Kylin 与 UnionTech UOS 在国产终端中的部署率达到 85%；China Southern Power Grid 旗下 Xingyi Power Supply 基于 Kylin 适配平台，拿到
              2025 年电力行业本地化案例奖。金融侧，Galaxy Kylin 支撑 ICBC 与 Agricultural Bank 的密钥管理和核心系统；Jiangdu Rural Commercial Bank 新
              OA 栈包含 200+ 个业务组件和 100+ 个生态套件，全栈跑在 Kylin 上，据称效率提升 35%。医疗侧，Ruijin Hospital 基于 Galaxy Kylin Advanced Server
              V10 搭起 HR、OA 和「Patient 360」平台。制造（FAW）、通信（China Mobile/Telecom 数据中心和分支终端）与航天（Tianwen、空间站和 Chang'e
              项目，100,000+ 小时无故障）补齐了证据集；OEM 伙伴也在加固背书，包括 China Greatwall（Kylin「卓越级」伙伴，D3000M 笔记本、D80F3 台式机和 Qingtian
              RF6260 V5 服务器均随 V11 出货）和 Lenovo Kaitian（率先在 V11 上做到 9 秒启动）。这条增长轨迹在概括层面可信，但分母并不一致披露：席位还是组织、桌面还是服务器、强制还是自愿。
