  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与客户定义
        blocks:
          - type: paragraph
            body: >-
              Kylinsoft 的产品是一套国产操作系统，服务两个客户任务：在政府、金融和国企桌面替换 Windows，以及为关键任务服务器和工业系统提供安全、已认证的 Linux 基础。旗舰产品是 Galaxy
              Kylin（银河麒麟）V11，2025 年 8 月 26 日在 2025 China Operating System Industry Conference 上发布；首席科学家 Han Naiping
              将其定位为首个基于 Linux 6.6 LTS kernel 构建的商业级 OS，并推出「新体验、智能化」桌面版和「算力赋能、稳定安全」服务器版。商业旗舰周围是 openKylin（开放麒麟），这是由
              OpenAtom Foundation 治理的开源社区发行版，2.0 SP2 版本于 2026 年落地；另有嵌入式、工业，以及面向 IoT 和边缘场景的「Kylin 100」智能互联线——不过 Kylin 100
              公开技术披露有限，本文将其视为公司声称的路线图项目。支撑资产包括 Kylin SDK（V11 中 2,200+ 个开发者接口）、Kylin App Store、Kylin
              Tianyu（天御）安全域管理平台，以及与 openKylin 共享的 UKUI 桌面环境。成熟度在各产品线之间差异很大：Galaxy Kylin V11
              桌面和服务器版已普遍可用，并在现场大规模验证；openKylin 2.0 SP2 是已发布的社区版本，2026 年 5 月有 3.0 Alpha；工业 / 智能互联变体阶段更早，文档也更少。
