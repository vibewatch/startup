      - number: '1.3'
        title: 融资、估值与财务快照
        blocks:
          - type: paragraph
            body: >-
              2025 年 6 月，Kylinsoft 完成 30 亿元人民币（约 $417 million）增资，是当年规模较大的国产软件股权事件之一。本轮包括控股股东 China National Software
              通过非公开协议认购 20 亿元人民币，以及通过交易所流程选定的合格战略投资人认购 10 亿元人民币。战略部分由 Greater Bay Area Fund 牵头并组织，参与方包括 China Mobile
              Capital、Sinopec Capital、CCB Investment、CSSC Capital、Huihua Fund、Haihe Industrial Fund、China Internet
              Investment Fund，以及 Binhai New Area 科技金融平台。交易让 CSS 持股大约提高 17.6 个百分点至 47.23%。定价基于已向 SASAC 备案的评估：截至 2023 年 12
              月 31 日，Kylinsoft 全部股权估值 83.55 亿元人民币，公司因此成为天津 2025 年首家独角兽。与这个体量相比，公开底层财务异常稀薄：与增资相关的披露显示，2024 年收入为 14.38
              亿元人民币，净利润为 5.02 亿元人民币；2025 年注册资本升至 3.02 亿元人民币。现金、烧钱、当前收入节奏，以及募集资金在移动 /
              固定终端、云服务器和嵌入式系统之间的用途拆分，都没有细颗粒度披露。因此，若干封面指标被列为缺口，并附上明确尽调路径。
