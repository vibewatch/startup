  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价与结构
        blocks:
          - type: paragraph
            body: >-
              Kylinsoft 通过四条相互咬合的收入流变现操作系统组合：永久或定期软件授权（Galaxy Kylin 等桌面版按席位，服务器版按 socket / 节点）、经常性支持和维护订阅、付费定制与
              Windows-to-Kylin 迁移服务，以及由 5 亿元人民币「Kylin Partner 5.0」基金支撑的生态 / 伙伴计划，用于补贴 ISV
              和硬件适配。需求几乎全部通过政府和国企采购招标流转，而不是公开价目表，因此实际定价不透明，并由批量招标决定。已披露的财务外壳显示公司盈利且增长：母公司 China National
              Software（CSS，Shanghai 600536）披露 Kylinsoft 2024 年收入 14.38 亿元人民币、净利润 5.02 亿元人民币；第三方 2025 年数据称收入约 16.32
              亿元人民币（约 +13.5%）、净利润约 5.5 亿元人民币。不过，桌面、服务器、嵌入式、工业和智能计算线之间的收入结构，以及授权、订阅和服务之间的拆分，都没有公开；这些数字也只是通过 CSS
              披露中的单条合并口径进入市场，而非经审计的 Kylinsoft 独立报表。约 35% 的隐含净利率对 OS 供应商而言偏高，可能既反映真实软件经济性，也包含无法从公开数据拆分的政府补贴和税收优惠成分。
