    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、结构与产品
        blocks:
          - type: paragraph
            body: >-
              Kylinsoft Co., Ltd.（麒麟软件有限公司，也写作「Kylin Software」）是一家中国安全、国产可控操作系统开发商，总部位于天津滨海高新区。公司处在一条完全国有的股权链条里：China
              Electronics Corporation（CEC，中国最大的国有电子信息集团）控制上海上市公司 China National Software & Service Co.（CSS，600536），CSS 是
              Kylinsoft 的控股股东。Kylinsoft 承接了中国两条历史上最重要的安全 OS 脉络：Galaxy Kylin（银河麒麟）一脉，源自 National University of Defense
              Technology 在 863 Program 下 2001 年启动的研究；NeoKylin / Zhongbiao Kylin 桌面一脉，来自 China Standard
              Software。Kylinsoft 的前身 Tianjin Kylin Information Technology Co. 于 2014 年 12 月成立，是 CEC 与天津的战略部署；2020 年 2
              月，Tianjin Kylin 通过换股吸收 China Standard Software，并更名为 Kylinsoft，2020 年 3 月 20
              日召开创立大会。产品覆盖服务器、桌面、嵌入式和万物互联操作系统，以 Galaxy Kylin、NeoKylin、Starlight Kylin 等品牌销售，另有 openKylin 开源社区版和较新的 Kylin
              100 Smart Connected OS。收入来自授权、支持 / 维护合同以及政府和国企采购，使公司成为中国「信创」IT 国产化推进中的核心工具。
