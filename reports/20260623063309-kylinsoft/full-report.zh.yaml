      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              最主要的增长驱动是政策：SASAC 指令要求中央国企到 2027 年实现 100% 信创替代，党政核心系统目标是在 2025
              年底前完成全面国产化，由此锁定多年强制需求。次级驱动包括中美科技紧张下的国家安全和自主可控要求、数字中国 / 新基建投资周期，以及 2025 年 10 月 Windows 10
              终止生命周期带来的硬件滞留和迁移窗口。约束同样具体，且部分偏负面。生态和应用缺口仍在——专业行业软件、开发者工具链、外设兼容性都落后于
              Windows——存量迁移摩擦也拖慢全面替代。关键在于，采用仍高度依赖命令：政府和受监管国企之外，私营和消费者需求很薄，因此市场增长是行政创造，而非竞争赢得；供应商暴露于采购强度或预算变化。Windows
              仍占中国桌面基础的 70-80%，macOS 约 13%，包括国产版本在内的 Linux 仅约 1.2-3.4%，凸显真实世界渗透率远低于政府部门头部数字。这些矛盾和分母差异被保留为明确尽调缺口。
