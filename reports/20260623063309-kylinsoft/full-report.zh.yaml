      - number: '8.4'
        title: 牛 / 基准 / 熊情景与估值区间
        blocks:
          - type: paragraph
            body: >-
              基准情景假设信创政策要求延续到 2020 年代后期，收入按已披露的低双位数速度复合增长，约 35% 利润率在适度补贴尾巴下守住，倍数维持在同业的 4-5x 区间；这支撑约 8-10 billion yuan
              估值，基本验证评估值。牛情景叠加真正的民营和海外进展、AI-OS 与智能互联（Kylin 100）变现，以及因 UOS 式增长观感或最终上市带来的 6-8x 重估，把价值抬到约 12-18 billion
              yuan。熊情景是采购政策要求放松，或 2025 目标之后出现后续政策缺口；与 UOS 和 HarmonyOS
              的多供应商部署加剧；国产硅路线图遭遇出口管制冲击；或披露事件显示利润靠补贴而非有机经营。任一触发都会把倍数压到 2-3x 的受压信创水平，价值降至约 4-6 billion
              yuan。分布向下不对称，因为上行要求公司做到尚未证明的事——赢得非政策要求需求；下行只需要它已经依赖的政策顺风变弱。既有政策惯性让近期概率信号偏向基准情景，但熊情景触发因素更多由外部力量（美国出口政策、中国采购政策）控制，而不是管理层。
