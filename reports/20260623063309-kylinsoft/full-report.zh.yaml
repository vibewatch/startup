      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Kylinsoft 的治理更像中央管理的国有资产，而不是创始人主导的创业公司。董事长兼党委书记是 Chen Zhihua（谌志华），他同时担任母公司 China National Software &
              Service Co. 董事长；这项双重任命让 Kylinsoft 的战略与 CSS 乃至 CEC
              紧密对齐，但也把决策权集中在一位党组织任命的领导者手中，形成明显的关键人物和政治对齐依赖。总经理（CEO）Kong Jinzhu（孔金珠）长期参与 Galaxy Kylin
              操作系统核心开发，负责研发、生态建设和国产替代推进。Kylinsoft 未上市且由国资控制，董事会、独立董事和完整高管名单的公开程度不及风投支持公司；公司也没有创始人股权或经典的创始人 -
              市场匹配叙事。治理权力从 SASAC 经 CEC、CSS 向下传导。内核选择、生态投入、采购定位等战略方向，都与母集团和国家产业政策协同制定。领导层在安全 OS
              开发上的深厚技术履历确实是优势，但更广管理梯队不透明、单一董事长集中权力，是实质性的治理尽调项。
