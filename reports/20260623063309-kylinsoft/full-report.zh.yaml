  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反方论点
        blocks:
          - type: paragraph
            body: >-
              看多论点建立在本报告反复验证的六个事实上。Kylinsoft 是中国国产 OS 替代中被政策点名扶持的龙头，在党政桌面约占 70%，连续 14 年位居中国 Linux 市场第一；装机基础超过 1600
              万，覆盖银行、电网、通信和航天；Galaxy Kylin V11 是基于 Linux 6.6、已认证的现代技术栈，集成安全和 AI 架构；公司确实盈利（收入约 1.6 billion yuan，净利率约
              35%），不同于多数风险投资资产；资金和风险由资金雄厚的国有母公司托底，后者刚注入 3 billion
              yuan；可服务的信创迁移仍有多年强制空间。反方论点同样是结构性的：需求是行政制造，不是竞争赢来，所以耐久护城河是政策，不是产品；民营和消费者渗透几乎可以忽略，Windows 仍主导开放市场；产品组合是下游
              Linux 发行版，硅供应链受美国对 CEC 关联 CPU 的出口管制压制；大买方会同时上 UnionTech UOS，并越来越多纳入 Huawei
              openEuler/HarmonyOS，保护市场内部也没有独占锁定；财务披露很薄，没有经审计独立报表，政府补贴占利润比例也未量化。因此，可投资问题不是 Kylinsoft
              今天赚不赚钱——它确实赚钱——而是盈利究竟有机且耐久，还是依赖政策，一旦政策要求放松就会搁浅。
            claimRefs:
              - CV001
              - CV002
              - CV003
