      - number: '5.3'
        title: 部署、路线图与差异化
        blocks:
          - type: paragraph
            body: >-
              部署上，Galaxy Kylin 是带付费支持、迁移工具和伙伴生态的打包认证 OS，而不是自助下载产品。Kylinsoft 披露，某国有银行运行 100,000+ 席位，累计部署超过 2000 万套，服务
              70,000+ 家组织，连续 14 年按装机基础位居中国 Linux 第一，并用于 Tianwen 火星、空间站、Chang'e 等国家航天工程，故障自由运行超过 100,000 小时。服务器版增加 AI
              环境自动配置、线上 / 离线负载混部以提高利用率、高性能用户态网络栈，以及面向低延迟证券交易负载的 MPTCP 多路径工具。路线图锚定 2025 年 8 月 V11 发布、2026 年 openKylin 2.0
              SP2 版本和 2026 年 5 月 3.0 Alpha，以及若干认证里程碑，包括首个通过中国 Operating-System Government-Procurement Requirement
              Standard 的 Linux 6.6-kernel OS 和 2026 CITE 创新奖。差异化建立在四根支柱上：安全与认证深度、最深的国产软硬件生态（首个适配超过 100 万项的国产 OS，总量 700
              万+）、集成 Panshi+AI+security 栈，以及国资所有权 / CEC 渠道触达。尽调 caveat 是，这些支柱都不是可防御的内核级技术护城河：UnionTech 可匹配桌面广度，openEuler
