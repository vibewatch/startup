      - number: '7.2'
        title: 监管、法律与地缘政治风险
        blocks:
          - type: paragraph
            body: >-
              最核心的外部风险是地缘政治。CEC 通过 China National Software 成为 Kylinsoft 的最终国有股东，并被列入 US Commerce Department Entity
              List；2024-2026 年 Bureau of Industry and Security 连续收紧先进芯片和半导体工具流向中国国家电子集团的控制，包括扩展 Foreign Direct Product
              Rule。这限制了 Kylin 适配的国产 CPU（Phytium、Kunpeng、Loongson）能够获得的前沿硅和 EDA 工具，间接压住硬件加 OS 堆栈的性能天花板。法律上，整个产品组合都是 GPLv2
              Linux kernel 的衍生品：Kylinsoft 必须分发 kernel 修改的对应源码，且不能施加额外限制。这既限制了专有锁定，也支撑了反复出现的「套壳」批评——系统更像定制 Linux，而非自主
              IP。国内监管环境既是顺风，也是依赖：Cybersecurity Law、Data Security Law、classified-protection（等保）体系、Critical Information
              Infrastructure 规则和信创采购框架，都要求党政、金融、通信和能源系统使用安全可控的国产软件。需求由行政创造，因此采购政策、认证标准，或 Made-in-China-2025
              式本地化目标的政治优先级变化，本身就是收入基础的监管风险。
            claimRefs:
