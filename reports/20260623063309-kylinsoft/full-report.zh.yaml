      - number: '6.3'
        title: 留存与耐久性
        blocks:
          - type: paragraph
            body: >-
              Kylinsoft
              没有公开直接留存指标——NRR、GRR、流失率、续约率或满意度评分都缺位，因此只能从需求结构倒推耐久性。党政和监管行业的强制部署里，切换成本很高：机构一旦迁移终端和核心系统、重新认证应用、培训员工并适配外设，回退或换供应商既贵，也不合政治偏好，装机基础的事实留存因此偏高。连续
              14 年市场第一、航天 100,000+ 小时无故障、多年多系统扩容（如 Ruijin Hospital 从 OA 分阶段扩到 Patient
              360），都指向账户耐久、还能扩张。但有三点会削弱判断：买方会有意同时上 Galaxy Kylin 和 UnionTech
              UOS，以免被单一供应商锁住，所以账户不「流失」也可能压低单一厂商份额；续约取决于信创预算和政策延续，这是 Kylinsoft 控制不了的宏观变量；一线案例本身也暴露了持续的应用兼容摩擦——CAD 和
              Office 渲染滞后、跨平台迁移的数据丢失、外设驱动不均衡——如果不解决，会压住满意度。因此，留存结构上偏高，但证据很薄；未披露分组留存数据本身就是尽调缺口。
