      - number: '3.4'
        title: 护城河持久性与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Kylinsoft 的持久优势包括国资所有权和 CEC 渠道、在党政和安全服务器负载中 14 年装机基础领先、认证深度，以及国产供应商中最高的生态成熟度。但每项优势都有可信威胁。桌面护城河受到 UnionTech
              挑战，后者现在在开箱 UX 和应用广度上领先，并在 2025 年实现首次年度盈利（收入 ¥718M、利润 ¥238M），同比增长 62%，而 Kylinsoft
              只有十几个百分点增长。服务器护城河有结构性上限，因为 Galaxy Kylin 服务器版构建在 Huawei openEuler 之上，Kylin 拿到的是集成和支持利润，并不拥有根生态，还要在同一上游上与
              UOS 和 KylinSec 竞争。长期桌面威胁来自 HarmonyOS PC，其微内核、Huawei 硬件触达和消费者生态，可能在大众市场乃至最终在政府场景中替代 Linux 桌面。更尖锐的是，国产
              OS——包括 Kylin——持续面临「shell/套壳」质疑：它们被指只是 Debian / Ubuntu / openEuler
              的二次定制，独立内核创新有限；同时存在有记录的生态缺口，包括外设和打印机驱动滞后，Adobe、AutoCAD、SolidWorks 等专业设计软件只能通过 Wine 运行且性能损失 30-50%，内核级 L3
              支持响应慢于 Red Hat，已迫使部分银行自建支持团队。KylinSec 2025 年转为净亏损且经营现金流为负，也说明即便认证丰富的安全 OS 垂直领域，商业化仍然艰难。整体看，Kylinsoft
              的护城河真实存在，但依赖国家条件且部分共享，并非专有技术领先。
