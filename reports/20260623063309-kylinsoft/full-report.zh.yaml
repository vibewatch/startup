      - number: '2.2'
        title: 机会规模测算
        blocks:
          - type: paragraph
            body: >-
              规模测算必须用多重镜头，因为边界定义差异很大。最宽口径下，整个信创产业（芯片、OS、数据库、中间件、应用）预计到 2026 年达到约 1.8 万亿元人民币，复合增速约 28.5%，2025 年已经超过 1.5
              万亿元人民币；也有分析师引用 2.2 万亿元人民币，显示口径分散。操作系统切片要小得多：中国整体 OS 市场（PC 加服务器）2025 年估计约 450 亿元人民币，其中服务器约 250 亿元人民币、桌面约
              200 亿元人民币。可直接触达的信创 OS 市场——党政加八大重点监管行业——估计每年仅约 97.5 亿至 205 亿元人民币，增速 30%+；信创服务器约 57.5 亿元人民币（≈115 万台），信创 PC 约
              40 亿元人民币（≈800 万台）。对照这些数字，Kylinsoft 2024 年约 14.4 亿元人民币收入意味着它已经拿下可触达信创 OS 支出中的可观份额，但只占广义 OS 或信创总量的极小一部分。450
              亿元人民币 OS 口径与 100 亿至 200 亿元人民币信创 OS 口径之间的巨大差距，本身就是关键尽调信号：到底该用哪个分母。
