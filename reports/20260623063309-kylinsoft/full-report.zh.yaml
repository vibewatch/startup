        title: 资本充足性、融资与牵引力
        blocks:
          - type: paragraph
            body: >-
              Kylinsoft 的资本位置由 2025 年 6 月增资支撑。按 CSS 2024 年 12 月关联交易文件，Kylinsoft 最多融资 30 亿元人民币：CSS 通过非公开协议最多认购 20
              亿元人民币，合格外部投资人通过上海联合产权交易所公开挂牌最多认购 10 亿元人民币；定价依据 Beijing Zhongtonghua 的评估，即截至 2023 年 12 月 31 日 Kylinsoft
              100% 股权价值为 83.55 亿元人民币（已向国资监管机构备案）。本轮于 2025 年 6 月 30 日前完成，使 CSS 持股从 40.25% 升至 47.23%（若只有母公司认购，备用路径会升至
              51.79%）。外部 10 亿元人民币由 Greater Bay Area fund 牵头，China Mobile Capital、Sinopec Capital、CCB Investment、China
              Internet Investment Fund、天津 Haihe Industrial Fund 以及 CEC 关联平台参与——名单几乎全是国资。公司盈利（2024 年净利润 5.02
              亿元人民币），因此没有风投意义上的烧钱，也未披露重大第三方债务或项目融资义务；实际 runway 由国有母公司背书。公开牵引力指标偏运营而非财务——累计部署 1600 万+、服务组织
              210,000+、党政桌面份额约 70%——外部讨论最多的下一融资触发点是可能上市，但没有文件确认。这里仅在本章复述融资事实；逐轮时间线放在 Company Overview 章节。
