  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              Kylinsoft
              的核心市场是中国国产操作系统行业，也就是国家「信创」（信息技术应用创新）计划的基础软件层；该计划旨在政府和关键行业中替换外国软硬件。纳入口径的支出包括党政机关、国企、银行、电信运营商及其他受监管行业在桌面、服务器、嵌入式和智能终端部署中的付费
              OS 授权、维护和支持。服务市场不包括庞大的消费和私营商业 PC 基础，这部分仍以 Windows 为中心，也不在采购命令范围内。Kylinsoft 替代的现状方案是桌面的 Microsoft
              Windows、服务器上的国际 Linux 发行版（Red Hat、SUSE、Ubuntu）和 Unix；在中国服务器市场，国产 Linux 现在出货量约为国际品牌的 10
              倍，外资供应商被自主可控要求挤到边缘。同一全栈信创推进中的相邻层——国产 CPU（Loongson、Kunpeng、Phytium）、数据库、中间件和应用软件——是互补支出，会影响 OS 兼容性要求，但不是 OS
              收入。因此，这个市场更像行政划定的替代市场，而不是开放竞争市场。
