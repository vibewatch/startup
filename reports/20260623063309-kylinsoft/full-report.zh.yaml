      - number: '5.2'
        title: 架构与运行机制
        blocks:
          - type: paragraph
            body: >-
              Galaxy Kylin V11 基于 Linux 6.6 LTS kernel，带 120+ 项自研内核特性，并引入 Panshi（Rock，磐石）架构作为标志性技术层。Panshi 让核心系统不可变：基础
              OS 与应用解耦，更新采用原子化且可回滚的方式（类似 OSTree 部署）；两个配套技术——KARE 兼容环境和 Kaiming（开明）包格式——在不可变基础之上保留既有应用生态，实现「一次构建，跨版本运行」。在
              openKylin 2.0 SP2 上，同一套 Panshi 栈默认启用，由不可变系统、KARE 3.0（切换到轻量 CRUN 容器引擎）和重构为 base+runtime+app 模型的 Kaiming
              包格式组成。基础之上是自研 WLCOM（Kylin-WLCOM）显示框架，同时兼容 X11 和 Wayland；Kylinsoft 称其可实现无损高清视频和百窗口流畅。AI 子系统和 AI
              助手提供一键唤醒、本地与云端算力调度、本地图片 / 文本生成，以及池化本地和云端算力的「算力共享」能力，并面向 Ascend、Cambricon 等国产 NPU；openKylin 2.0 SP2 集成
              DeepSeek、Tongyi Qianwen 和 SenseTime 模型，并可安装端侧 Qwen2.5-3B 离线使用。架构按多架构设计，适配
              Phytium、Kunpeng、Loongson（LoongArch）、Hygon、Zhaoxin 和 Sunway 处理器以及国产 GPU；但它仍是下游 Linux
              发行版，kernel、Wayland、容器引擎和大量 userspace 都来自上游开源组件，这限制了 Kylinsoft 的自主 IP 叙事。
