companyProfile:
  summary: >-
    Kylinsoft（麒麟软件有限公司）是中国领先的国产操作系统开发商，也是信创技术自主化推进中的国家队。公司由 China National Software（CSS，600536）控股，CSS 本身隶属于国有集团 China
    Electronics Corporation（CEC）。Kylinsoft 面向政府和关键基础设施客户打造商业化 Galaxy Kylin 系列，运营 OpenAtom Foundation 治理下的 openKylin
    开源社区操作系统，并推出面向工业和 IoT 的 Kylin 100 智能互联操作系统。它连续 14 年位居中国 Linux 市场第一，部署量超过 1600 万套。2025 年 6 月，公司按 83.55 亿元人民币评估值增资 30
    亿元，成为天津首家国产 OS 独角兽。
  foundedDate: '2020-02-01'
