  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              Kylinsoft 卖给中国信创国产化命令创造出来的买方、用户和付款方；采购实体（部委、国企、银行或医院）通常也是用户，预算来自国家或行业 IT
              国产化项目，而不是可自由支配的商业支出。客户基础按垂直行业分成八个主要集群：党政管理（锚定板块，Galaxy Kylin 桌面份额约 70%）、金融和国有银行、三大电信运营商（China Mobile、China
              Telecom、China Unicom）、能源和电网（State Grid、China Southern Power Grid）、医疗、教育、交通，以及航天 /
              国防。地域上几乎全部在国内，集中于中央部委、省级政府和国企总部；交付通过认证系统集成商和「Kylin Partner」硬件
              OEM，而非直接自助服务。采用按国家「2+8+N」推进——两个核心党政场景、八个优先监管行业（金融、能源、电信、交通、教育、医疗、航天等）以及更广行业的 N
              长尾——这同时决定谁购买以及购买顺序。这个分层具备战略价值，但商业面狭窄：价值最高、最持久的需求在强制行业，开放私营市场（制造、互联网、消费者）渗透很轻，才是主要增长问题。
