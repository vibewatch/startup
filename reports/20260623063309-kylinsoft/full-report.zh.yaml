      - number: '3.2'
        title: 能力、定价与 Go-to-Market 对比
        blocks:
          - type: paragraph
            body: >-
              从能力看，市场按负载清晰分层。Galaxy Kylin 领先于关键任务可靠性——声称可用性达到 99.9999% 级、拥有业内领先数量的 EAL4 /
              等保四级安全认证，并在航天任务、电网调度和银行核心交易网关中有标杆部署——同时运营最深的生态，适配数接近 1000 万（约 736 万软件加 100 万硬件），并提供 2,200+ 个 Kylin SDK
              开发者接口。UnionTech UOS 领先于桌面用户体验：其 Deepin Desktop Environment 高度模仿 Windows 10，据称把迁移培训时间从数天压缩到数小时，并拥有 15,000+
              个原生应用和最大的软件 / 硬件适配总量（10M+）。openEuler 领先服务器和云原生广度，但它是社区根而非交钥匙发行版，企业通常采用商业衍生版本（Kylin、UOS 或 KylinSec）来获得 SLA
              支持。定价上，所有国产供应商都通过永久或订阅授权加付费支持和迁移服务变现，而不是公布标价；交易靠政府和国企采购招标拿下，有一份来源指出订阅授权在部分省级预算审查中引发过合规争议。Go-to-market
              上，Kylin 通过 China Electronics 的国资渠道和党政命令触达买家，UOS 通过增长更快的商业、教育和电信桌面迁移推进，openEuler 依靠 2,100+
              成员社区向下游商业发行版供给，HarmonyOS 则借 Huawei 的硬件装机基础。结果是重度多宿主：大型政府买家通常会认证并部署 Kylin 和 UOS，限制任何单一供应商的定价权。
