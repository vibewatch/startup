      - number: '3.3'
        title: 切换成本、锁定与分发权力
        blocks:
          - type: paragraph
            body: >-
              一旦系统完成认证并部署，这个市场的切换成本就很高：应用适配、硬件驱动认证、安全测评和用户再培训共同形成多年锁定，保护每个在位者的装机基础——包括 Kylin 累计 2000 万+ 部署和 210,000+
              服务组织。Kylin 最深的锁定来自集成的「PKS」栈（Phytium ARM CPU + Kylin OS +
              安全子系统），它把党政和国防买家绑定到一个国产可控组合上，并由认证广度强化。不过，分发权力集中在国家手里：采购由命令驱动，China Electronics 的渠道准入是 Kylin
              的主要结构性优势，而非独立商业需求。两个动态削弱定价权。第一，多宿主是常态——中央机构、银行和运营商会认证多套国产 OS，避免依赖单一供应商，因此 Kylin 与 UOS
              常在同一买方内部共存。第二，供应和伙伴准入是共享的：Kylin、UOS 和 KylinSec 的服务器版都构建在 Huawei openEuler 根上，也都依赖同一批国产 CPU
              供应商（Phytium、Kunpeng、Loongson、Hygon、Zhaoxin），因此在集成和认证层之下，几乎没有专有供应优势。实际含义是，竞争不是争夺政策已保证的净新增需求，而是争夺买方有意拆分的强制预算份额。
            claimRefs:
              - CP022
              - CP023
              - CP024
              - CP025
