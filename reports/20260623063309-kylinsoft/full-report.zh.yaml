      - number: '1.4'
        title: 规模、里程碑与负面信号
        blocks:
          - type: paragraph
            body: >-
              Kylinsoft 最亮眼的牵引力是装机基础：截至 2025 年 8 月，Galaxy Kylin 部署量超过 1600 万套，集中在政府、金融、电信、能源和教育领域；公司称其在中国政府核心应用 OS
              市场份额超过 70%。其软件支撑了 Chang'e 探月和 Tianwen 火星等国家工程，公司也获得过 National Science and Technology Progress
              Award。产品迭代很快：Galaxy Kylin V10 于 2020 年 8 月基于 Linux kernel 4.19 发布；openKylin 根社区 2022 年 7 月开放；Galaxy Kylin
              V11 于 2025 年 8 月 26 日发布，是中国首个基于 Linux 6.6 kernel 的商业 OS，带 120+ 项自研增强、新的「Rock/磐石」架构、AI 助手，并支持 AMD、Intel、8
              款国产 CPU 和 7 款国产 GPU；同日还推出 5 亿元人民币「Kylin Partner 5.0」生态基金。V11 于 2026 年 4 月获得 CITE2026 创新金奖，Kylin 100 Smart
              Connected OS 于 2026 年 5 月随后发布。看多逻辑之外也有真实负面信号。The Register 指出，在 14 亿人口市场里，1600 万安装量只是「minuscule」份额，并提醒
              Linux 6.6 LTS 基础将在 2026 年 12 月失去上游支持——距离 V11 发布约 16 个月——这呼应了 Kylinsoft 早先把 V10 留在已终止生命周期的 4.19 kernel
              上的选择。采用仍高度依赖政策命令，而非竞争赢得。
