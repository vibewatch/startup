      - number: '4.2'
        title: 单位经济与 Go-to-Market 效率
        blocks:
          - type: paragraph
            body: >-
              销售效率在结构上有利，但公开数据缺少仪表盘。Kylinsoft 通过 China Electronics
              的国资渠道卖给政策强制买方，客户获取成本低于商业企业软件供应商——需求由信创替代命令创造，而不是靠付费需求生成拉动——同时切换成本（认证、应用适配、再培训）让装机基础黏性强，支持收入更持久。毛利率没有披露，但可比中国安全
              OS 经济性暗示软件线毛利率很高（一家上市同业披露 OS 产品毛利率超过 90%），部分被低毛利服务以及维护 8+ 国产 CPU、7+ 国产 GPU 适配目标的成本抵消。成本结构偏重研发：公司明确把 2025
              年融资定位为支持持续、高强度 OS 研究、产品线扩展和生态建设；母公司称这是其 40 多年历史中首次集中、大规模投入 OS 研发现金。CAC、回本周期、净收入留存、递延收入余额、服务附着率、1600 万+
              装机基础的单部署收入等标准单位经济输入均未公布，因此底层客户经济性必须视为尽调缺口，而非已测量结果。
