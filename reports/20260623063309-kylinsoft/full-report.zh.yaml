  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              按剩余风险暴露排序，Kylinsoft 的风险集中在四档。第一档是地缘政治和政策结构风险：CEC 位列 Entity List，叠加更广泛的中美技术战，限制了 OS
              必须适配的国产硅供应链；公司收入依赖国家采购政策要求的延续，而不是竞争性需求。第二档是技术依赖风险：产品组合本质是下游 Linux 发行版，安全、硬件适配和路线图都继承 GPLv2 Linux kernel 与
              Linux 6.6 LTS 支持窗口；一旦上游跟踪掉队，或「套壳」质疑造成可信度冲击，支撑溢价的自主叙事就会被削弱。第三档是商业和生态风险：民营部门渗透率低，应用和外设兼容仍有缺口，六种以上国产 CPU
              架构造成碎片化；大客户又会同时认证 UnionTech UOS 和 Huawei
              openEuler/HarmonyOS，装机基础虽受政策保护，却尚未被市场验证。第四档是财务披露风险：上市母公司亏损、独立报表未披露、估值来自评估、政府补贴占利润比例未量化。生态和披露风险的发生概率最高（部分已经兑现）；突发地缘政治或政策转向概率较低，但冲击更大。缓释手段里，认证最成熟，民营市场多元化和披露透明度最弱。
            claimRefs:
