  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与对手
        blocks:
          - type: paragraph
            body: >-
              中国国产操作系统市场已在信创国产化推进下整合为少数与国家方向对齐的供应商；Kylinsoft 和 UnionTech 常被描述为桌面「双寡头」，Huawei 的 openEuler
              则主导服务器根层。竞争集合可分为五类。直接桌面对手是 UnionTech（Tongxin Software，统信软件），其 Unity Operating System（UOS）2019
              年作为北京创业项目成立，2020 年 1 月发布首个稳定版本，基于 Debian 衍生的 Deepin 桌面；它是领先的通用市场桌面 OS，并在 2025 年完成超过 1000
              万项生态适配，成为首个做到这一点的中国 OS 供应商。共同的服务器底座是 Huawei openEuler，这是一个 Apache 许可的社区根操作系统，2021 年 11 月捐赠给 OpenAtom
              Foundation，2025 年约占中国新增服务器 OS 安装量的 57.3%；Kylinsoft 自己的 Galaxy Kylin 服务器版也构建在 openEuler 之上，因此 openEuler
              既是上游依赖，也是战略制衡。新兴替代品是 Huawei HarmonyOS PC，这是一个微内核桌面 OS，首款笔记本于 2025 年 5 月发货；它移除了所有 Linux / Android 代码，不运行原生
              Windows 应用，被定位为长期最可信的 Windows 桌面挑战者。垂直安全 OS 专家包括独立上市的 KylinSec（麒麟信安，与 Kylinsoft 不同）在电力和航天领域，以及 ChinaSoft
              FangDe（中科方德，NFSChina）在 Windows 兼容桌面领域。现状替代方案仍是 Microsoft Windows，它仍约占中国桌面基础的 70-80%，也是主要替换目标；国际 Linux /
              Unix（Red Hat Enterprise Linux、Ubuntu、SUSE）作为存量企业参照，正从强制替代行业退出。deepin 是 UnionTech 拥有的社区发行版，可追溯到 2004
              年，作为上游和面向消费者的选项补齐版图。
