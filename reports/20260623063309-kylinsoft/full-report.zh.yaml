      - number: '6.4'
        title: 扩张、集中度与采购风险
        blocks:
          - type: paragraph
            body: >-
              扩张沿两条线展开。存量强制账户里，Kylinsoft 先拿下一个滩头阵地（桌面或某个核心系统），再横向扩到更多系统、更多站点和服务器版——Ruijin 从 OA 到 Patient 360、Jiangdu 全栈
              OA，都是先落地再扩张的样本。市场层面，「2+8+N」把可服务基础从党政扩到八大重点行业，再延伸到长尾；OEM 伙伴计划（China Greatwall、Lenovo Kaitian
              等）则拉宽硬件触达。反向问题是集中度。需求高度依赖政策要求下的政府和国企采购；民营部门，尤其制造和互联网采用率相对低，分析师反复把这种模式概括为「吃政府饭」，市场自发拉力有限。集中度风险有三类：如果信创支出收紧，或从「硬替换」转向「软兼容」，就形成政策
              /
              预算风险；少数国有渠道主导收入，形成买方类型风险；类单一来源的国产化招标会引发定价审查，省级层面也偶有订阅合规质疑，带来采购摩擦风险。净判断是：客户资产质量高，但基础窄；政策要求内耐久性真实，政策要求外仍未验证。
