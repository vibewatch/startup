      - number: '7.3'
        title: 运营、技术与生态风险
        blocks:
          - type: paragraph
            body: >-
              运营上，Kylinsoft 交付的是成熟且通过认证的产品，但技术风险仍是下游发行版的风险。Galaxy Kylin V11 基于 Linux 6.6 LTS kernel；该分支上游维护原计划 2026 年 12
              月结束，后延至 2027 年底，因此眼前的生命周期终止悬崖缓和了，但对上游维护者的结构性依赖仍在。硬件适配、安全修复和驱动覆盖继承自上游与国产 CPU
              厂商，测试被拆到至少六类指令集目标（Zhaoxin/Hygon 的 x86、Phytium/Kunpeng 的 ARM、Loongson 的
              LoongArch），也带来信创迁移中反复出现的一线抱怨——驱动装不上、应用兼容不稳。应用生态虽然在长，但面向专业设计、工程和游戏软件，仍远薄于
              Windows；外设驱动覆盖也不均衡。「套壳」批评认为差异化来自集成和 UI，而非 kernel 级创新；公司文档承认系统基于
              Linux，某种程度上也承认了这一点。如果国产化标准收紧，转向真正的根技术自主，这会变成声誉和采购可信度风险。除此之外，运营连续性风险较低：产品已在银行、电网和航天部署中跑过一线。
