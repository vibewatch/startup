      - number: '8.5'
        title: 退出准备度、否决触发器与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              退出准备度中等且在改善，但路径间接。最清晰的流动性路径是境内上市——要么复制 UnionTech 的审计和重组路径冲刺科创板 IPO，要么继续在上市母公司 CSS 内部实现价值兑现——但 Kylinsoft
              尚无申报文件，因此近期公平交易退出未确认，国有所有权也限制控制权转让。投资逻辑会被四个可监控触发器打破：信创采购政策要求放松或后续政策出现断档；新的美国出口管制卡住 OS 适配的
              Phytium/Kunpeng/Loongson 硅；可信「套壳」或安全发现损害认证地位；或独立披露显示政府补贴占利润超过约
              50%。每个触发器都对应明确估值动作，从下调倍数到直接放弃。卡住建议的三项优先尽调问题是：经审计的 Kylinsoft
              独立财务报表（验证单一合并收入线和现金状况）；净利润与政府补助、税收优惠的对账（测试有机盈利）；市场验证的估值参照，或附完整增资协议的更新评估（承销判断 8.355 billion yuan
              估值）。这些问题解决前，该资产对国家是高确信度战略持有，对独立投资者则是跟踪观察。
