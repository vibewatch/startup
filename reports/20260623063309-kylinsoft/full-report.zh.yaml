      - number: '8.2'
        title: 建议、置信度与入场纪律
        blocks:
          - type: paragraph
            body: >-
              建议是跟踪 / 继续研究，置信度低到中等，风险评级高。逻辑是：资产基本面过关，但入场价格无法独立承销判断。8.355 billion yuan 是 2023
              年底为关联方增资备案的评估值，不是竞争性清算的融资轮；表面的 47.23% 持股提升和 3 billion yuan
              注资都来自同一个国有集团，因此没有公平交易下的价格发现，也没有第三方优先权或稀释结构来锚定入场。按倍数看，这个估值可辩护——约为过去 12 个月收入的 5x，上市信创软件同业为 3-6x，且低于增长更快的
              UnionTech——但如果利润有实质部分来自补贴，政策要求驱动收入的倍数会高估质量。因此，入场纪律要求相对评估值打折，以补偿非市场化定价、披露不透明和地缘政治尾部风险，并通过合同拿到独立报表的信息权。对国家或战略投资者，资产可在国家冠军政策要求下持有
              / 增持；对没有信息权的独立财务投资者，正确姿态是等三项卡点尽调解决后继续跟踪，而不是按表面估值照单承销。
            claimRefs:
