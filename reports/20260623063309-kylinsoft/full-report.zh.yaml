      - number: '8.3'
        title: 融资背景与可比估值
        blocks:
          - type: paragraph
            body: >-
              Kylinsoft 的参照系是上市和上市前信创软件同组公司。其上市母公司 China National Software（CSS, 600536）市值约 28 billion yuan，对应前瞻收入约 5.9
              billion yuan，约 4.8x 销售额，毛利率约 52%，刚刚回到盈亏平衡。直接 OS 同业 UnionTech（UOS）正在准备科创板 IPO；按 2025 年约 718 million yuan
              收入（增长约 62%）和首次净利润约 239 million yuan 计算，估值区间为 6-10 billion yuan，隐含更高的 8-14x
              销售额倍数，市场愿意为更高增长和临近流动性事件付溢价。更宽的应用软件可比公司给出区间边界：Kingsoft Office 在 >30% 净利率下约 16x 销售额，Yonyou 和 Taiji 约
              3-4x。放在这组里，Kylinsoft 以约 1.6 billion yuan 收入对应 8.355 billion yuan 评估值（约 5x 过去 12 个月销售额），处在同组中段——高于低增长
              ERP/集成商，低于 UOS 和 Kingsoft——并有若干同业缺乏的真实盈利支撑。需要扣除的是：信创板块已从 2020-2022 年的 10-20x 销售额降到 2026 年的 3-6x；Kylinsoft
              估值是评估值而非市场融资轮；收入比多元化可比公司更集中在政策要求，因此同口径倍数理应带集中度折价，而不是溢价。
