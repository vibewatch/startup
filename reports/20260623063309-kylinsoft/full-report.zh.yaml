      - number: '7.5'
        title: 财务模型风险、缓释与否决标准
        blocks:
          - type: paragraph
            body: >-
              运营公司盈利，但财务披露给承销判断带来真实风险。Kylinsoft 没有发布独立报表；业绩只以分部线进入上市母公司 China National Software（CSS,
              600536），而母公司本身亏损——CSS 2025 年收入约 5.1 billion yuan，净亏损约 41 million yuan（较上一年大幅收窄），其中党政解决方案收入下滑，基础软件（Kylin
              线）是主要增长引擎。R&D 强度超过收入 22%，压住短期利润率；母公司经营现金流波动；Kylinsoft 约 35% 净利率里隐含的政府补贴和税收优惠占比没有量化，真实经营盈利无法拆出。8.355
              billion yuan 估值是 2023 年底为关联方增资备案的评估值，不是市场验证价格。缓释因素存在但不完整：深度认证和粘性政策要求基础保护收入；2025 年 3 billion yuan
              融资和正净利润可以在没有外债的情况下支持 R&D；生态计划正在扩大应用基础。若采购政策要求放松，可信「套壳」或安全发现损害认证地位，出口管制卡住 OS
              依赖的国产硅，或独立披露显示盈利靠补贴而非有机经营，投资逻辑就会破。优先尽调问题是：经审计的独立报表、补贴对账、市场验证的估值参照。
