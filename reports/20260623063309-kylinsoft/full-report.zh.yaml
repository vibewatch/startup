      - number: '2.3'
        title: 买方、用户与付款方
        blocks:
          - type: paragraph
            body: >-
              买方、用户和付款方常常是同一个国家机构，这塑造了整条 go-to-market。主要预算所有者是党政 IT 部门，以及国企、银行和三大电信运营商（China Mobile、China Telecom、China
              Unicom）的 CIO / 采购职能；三大运营商也是最大的服务器 OS 买家之一。采购靠招标驱动，并向国产供应商加权，因此政府和国企采购占国产 OS 需求的 60%
              以上。采用遵循官方「2+8+N」推进：先是两个党政场景，再到八个优先行业（金融、能源、电信、教育、医疗、交通等），最后扩展到更广的「N」类中小企业和地区。替换深度按板块差异很大：党政桌面替代已达约
              78-80%，金融约 45-50%，能源 52%，教育 65%，电信 38%。用户是公共部门办公室人员和后台 / 服务器运维人员，他们对 Windows 的熟悉度决定迁移摩擦；采用触发点几乎总是采购命令或安全 /
              自主可控指令，而不是自下而上的技术偏好。这让销售动作成为政策和关系驱动的企业招标流程，而非产品驱动漏斗。
