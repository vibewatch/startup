      - number: '5.4'
        title: 安全、合规与质量控制
        blocks:
          - type: paragraph
            body: >-
              安全是 Kylinsoft 最主要的对外差异化。Galaxy Kylin V11
              宣称具备「安全可信内生双体系架构」，覆盖硬件、系统和应用层，提供实时威胁监控、病毒扫描和自愈能力，并有可编程安全框架（KSAF）和双因素认证来执行分层静态 +
              动态策略。文件级控制包括文件保护箱、防截屏、加密文件传输和文件粉碎机；应用上架、安装、更新、移除全生命周期受保护，并通过 Kylin Tianyu（天御）安全域管理平台实施分级策略，服务企业端点控制。系统还加入
              AI 模型安全，目标是实时阻断模型投毒和 jailbreak 尝试，并对敏感输出做脱敏。合规定位依托中国等保和商密体系，以及首个通过政府采购需求标准认证的 Linux 6.6-kernel
              OS。尽调缺口在于，具体认证等级、范围和日期并未在英文可访问来源中一致公开；双体系和 AI-security 主张来自供应商表述，而非独立基准测试；国产 OS
              反复受到的外部批评——关于内核自主性的「shell-OS/套壳」质疑、专业设计软件经 Wine 运行损失 30-50% 性能、外设驱动覆盖不均——同样适用于 Kylinsoft 产品组合，并不会被其安全宣传解决。
