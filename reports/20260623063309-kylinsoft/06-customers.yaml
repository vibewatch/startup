schemaVersion: "report-v2"
artifact: customers
slug: kylinsoft
runDate: 2026-06-23
company:
  name: Kylinsoft
chapter:
  number: 6
  title: Customers
  summary: >-
    Kylinsoft's customer base is the spine of China's state-mandated Xinchuang
    (信创) localization program: party-government agencies, state-owned banks,
    the three telecom carriers, power and energy SOEs, healthcare, education and
    aerospace/defense, served largely through directed procurement rather than
    open-market competition. Reported scale is large — more than 16 million
    deployments by August 2025 (cumulative figures of 20 million-plus and 70,000+
    to 210,000+ served organizations appear in different sources), roughly 70%
    party-government desktop share, and 14 consecutive years as China's top
    Linux. Named production references span FAW, State Grid/CSG, ICBC and rural
    commercial banks, Ruijin Hospital, China Mobile/Telecom, and OEM partners
    such as China Greatwall and Lenovo Kaitian. The dominant risk is
    concentration and policy dependence: demand is mandate-driven, private-sector
    and overseas adoption is thin, and field references themselves document
    application-compatibility friction (CAD/Office rendering, peripheral drivers)
    that tempers the localization story.
sections:
  - id: base-and-segmentation
    title: Customer Base and Segmentation
    body: >-
      Kylinsoft sells to the buyers, users and payers created by China's
      Xinchuang localization mandate, where the procuring entity (a ministry,
      SOE, bank or hospital) is typically also the user, and budget flows from
      state or sector IT-localization programs rather than discretionary
      commercial spend. The base segments by vertical into eight principal
      clusters: party-government administration (the anchor segment, where Galaxy
      Kylin holds roughly 70% desktop share); finance and state-owned banks;
      the three telecom carriers (China Mobile, China Telecom, China Unicom);
      energy and power grids (State Grid, China Southern Power Grid); healthcare;
      education; transportation; and aerospace/defense. Geographically the base
      is overwhelmingly domestic, concentrated in central ministries and
      provincial governments and in SOE headquarters, with channel delivery
      through certified system integrators and "Kylin Partner" hardware OEMs
      rather than direct self-service. Adoption is staged through the national
      "2+8+N" rollout — two core party-government scenarios, eight priority
      regulated industries (finance, energy, telecom, transport, education,
      healthcare, aerospace, and others), and an N-tail of broader sectors —
      which structures both who buys and in what sequence. The segmentation is
      strategically valuable but commercially narrow: the highest-value, most
      durable demand sits in mandated sectors, while the open private market
      (manufacturing, internet, consumer) remains lightly penetrated and is the
      principal growth question.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007, CU036]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-and-named-proof
    title: Adoption Trajectory and Named Customer Proof
    body: >-
      Kylinsoft reports a large and growing installed base: more than 16 million
      (1,600万) deployments as of the August 2025 industry conference, with
      cumulative figures of 20 million-plus sets and served-organization counts
      ranging from 70,000+ to 210,000+ across sources, plus 14 consecutive years
      as China's top Linux by installed base. Named production references — not
      pilots — substantiate the breadth. In energy, a State Grid sub-division
      managing more than 2,000 substations reports an 85% domestic-terminal
      deployment rate on Galaxy Kylin and UnionTech UOS, and Xingyi Power Supply
      (China Southern Power Grid) won a 2025 power-sector localization case award
      on a Kylin-adapted platform. In finance, Galaxy Kylin underpins ICBC and
      Agricultural Bank key-management and core systems, and Jiangdu Rural
      Commercial Bank's new OA stack — 200+ business components and 100+ ecosystem
      kits — runs full-stack on Kylin with a reported 35% efficiency gain. In
      healthcare, Ruijin Hospital built HR, OA and a "Patient 360" platform on the
      Galaxy Kylin Advanced Server V10. Manufacturing (FAW), telecom (China
      Mobile/Telecom data centers and branch terminals), and aerospace (Tianwen,
      space-station and Chang'e programs, 100,000+ fault-free hours) round out the
      proof set, reinforced by OEM partners China Greatwall (an "excellence-tier"
      Kylin partner whose D3000M notebook, D80F3 desktop and Qingtian RF6260 V5
      server ship on V11) and Lenovo Kaitian (first to deliver 9-second boot on
      V11). The trajectory is credible at the headline level but the denominators
      — seats versus organizations, desktop versus server, mandated versus
      voluntary — are not consistently disclosed.
    claimRefs: [CU008, CU009, CU010, CU011, CU012, CU013, CU014, CU015, CU016, CU017, CU037]
    tableRefs: [TU002, TU003]
    figureRefs: [FU002, FU003]
  - id: retention-durability
    title: Retention and Durability
    body: >-
      Direct retention metrics — net revenue retention, gross retention, churn,
      renewal rates or satisfaction scores — are not publicly disclosed by
      Kylinsoft, so durability must be inferred from the structure of demand.
      In mandated party-government and regulated-industry deployments, switching
      costs are high: once an agency has migrated terminals and core systems,
      re-certified applications, retrained staff and adapted peripherals, reverting
      or switching vendors is costly and politically disfavored, which implies
      high de-facto retention within the installed base. The 14-year market-
      leadership streak, the 100,000+ fault-free aerospace hours, and multi-year
      multi-system rollouts (e.g., Ruijin Hospital's staged OA-to-Patient-360
      expansion) are consistent with durable, expanding accounts. However, three
      caveats weaken the picture: buyers deliberately multi-home Galaxy Kylin and
      UnionTech UOS to avoid single-vendor lock-in, so per-vendor share within an
      account can erode without the account "churning"; renewals depend on
      continued Xinchuang budget and policy, a macro variable outside Kylinsoft's
      control; and field references themselves surface persistent
      application-compatibility friction — CAD and Office rendering lag, data-loss
      incidents on cross-platform transfer, and uneven peripheral drivers — that
      could pressure satisfaction if not resolved. Retention is therefore
      structurally high but evidentially thin, and the absence of disclosed cohort
      data is itself a diligence gap.
    claimRefs: [CU018, CU019, CU020, CU021, CU022, CU023, CU024, CU038]
    tableRefs: [TU004]
    figureRefs: [FU004]
  - id: expansion-concentration
    title: Expansion, Concentration and Procurement Risk
    body: >-
      Expansion runs along two axes. Within mandated accounts, Kylinsoft lands a
      beachhead (desktop or one core system) and expands across systems, sites
      and to the server edition — the Ruijin OA-to-Patient-360 and Jiangdu
      full-stack OA patterns illustrate land-and-expand. Across the market, the
      "2+8+N" program widens the addressable base from party-government into the
      eight priority industries and then the long tail, and the OEM partner
      program (China Greatwall, Lenovo Kaitian and others) broadens hardware
      reach. The countervailing concern is concentration. Demand is heavily
      dependent on government and SOE procurement under policy mandate; private-
      sector and especially manufacturing/internet adoption is comparatively low,
      and analysts repeatedly characterize the model as "living off government"
      with limited market-driven pull. This creates three concentration risks: a
      policy/budget risk if Xinchuang spending tightens or shifts from "hard
      replacement" to "soft compatibility"; a buyer-type risk where a few state
      channels dominate revenue; and a procurement-friction risk, since
      sole-source-style localization tenders can attract pricing scrutiny and
      occasional subscription-compliance queries at provincial level. The net
      assessment is a high-quality but narrowly based customer franchise whose
      durability is real inside the mandate and unproven outside it.
    claimRefs: [CU025, CU026, CU027, CU028, CU029, CU030, CU031, CU032, CU033, CU034, CU035]
    tableRefs: [TU005]
    figureRefs: []
