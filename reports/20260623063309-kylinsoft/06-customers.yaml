figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Stages from Xinchuang mandate through procurement, migration, production
      and cross-system expansion for a typical government/SOE account.
    data:
      items:
        - { label: "Mandate trigger: Xinchuang '2+8+N' localization requirement", value: "Policy" }
        - { label: "Procurement: directed tender via certified integrators", value: "Buy" }
        - { label: "Migration: terminals + core systems, app re-certification", value: "Deploy" }
        - { label: "Production: secure desktop/server in daily operations", value: "Run" }
        - { label: "Expand: more systems, sites, and server edition", value: "Expand" }
        - { label: "Renew: contingent on continued Xinchuang budget/policy", value: "Renew" }
    approximationNotes: >-
      A representative mandated-account journey synthesized from case reporting;
      individual accounts vary by sector and procurement model.
    claimRefs: [CU003, CU006, CU019, CU025]
  - id: FU002
    title: Adoption / deployment funnel
    type: funnel
    layout: standard
    summary: >-
      Illustrative narrowing from the addressable mandated base to deployed seats,
      using disclosed installed-base and share figures (estimated stage values).
    data:
      items:
        - { label: "Addressable mandated orgs (party-gov + 8 industries)", value: 100 }
        - { label: "Served organizations (70k+)", value: 70 }
        - { label: "Accounts in active production", value: 55 }
        - { label: "Accounts expanded to multi-system/server", value: 35 }
        - { label: "Party-gov desktop share (~70% of segment)", value: 20 }
    approximationNotes: >-
      Stage values are indexed illustrative proportions, not disclosed counts;
      they visualize the mandate-to-deployment narrowing, not measured conversion.
    claimRefs: [CU001, CU010, CU019, CU026]
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      Evidence quality of named references across production maturity, outcome
      specificity and retention visibility.
    data:
      columns: ["Production maturity", "Outcome specificity", "Retention visibility", "Reference quality"]
      rows:
        - { label: "State Grid sub-division", values: ["Production", "Quantified (85%)", "Low", "Strong"] }
        - { label: "Jiangdu Rural Commercial Bank", values: ["Production", "Quantified (+35%)", "Low", "Strong"] }
        - { label: "Ruijin Hospital", values: ["Production", "Qualitative", "Medium", "Strong"] }
        - { label: "ICBC / ABC", values: ["Production", "Qualitative", "Low", "Medium"] }
        - { label: "China Greatwall (OEM)", values: ["Production (OEM)", "Quantified (perf)", "n/a", "Medium"] }
        - { label: "Lenovo Kaitian (OEM)", values: ["Production (OEM)", "Quantified (boot)", "n/a", "Medium"] }
    claimRefs: [CU011, CU012, CU024, CU037, CU019]
  - id: FU004
    title: Retention / repeat cohort
    type: cohort
    layout: standard
    summary: >-
      Illustrative retention by segment under mandate-driven switching costs;
      values are estimates, not disclosed cohort data.
    data:
      columns: ["Year 1", "Year 2", "Year 3", "Year 4"]
      rows:
        - { label: "Party-government desktop", values: [100, 99, 98, 97] }
        - { label: "State banks / finance", values: [100, 98, 96, 95] }
        - { label: "Telecom / energy SOE", values: [100, 97, 95, 93] }
        - { label: "Healthcare / education", values: [100, 96, 93, 90] }
    approximationNotes: >-
      Retention percentages are illustrative estimates inferred from high
      mandated switching costs, NOT disclosed cohort metrics; treated as a
      diligence gap pending actual renewal data.
    claimRefs: [CU018, CU019, CU021]
callouts:
  - calloutType: strength
    title: Anchor franchise in China's mandated OS market
    body: >-
      Galaxy Kylin holds ~70% party-government desktop share, 16M+ deployments,
      14-year Linux leadership, and named production references across energy,
      finance, healthcare, manufacturing and aerospace, reinforced by tier-one
      OEM partners.
    claimRefs: [CU001, CU008, CU011, CU017]
  - calloutType: risk
    title: Concentration and policy dependence
    body: >-
      Demand is mandate-driven with thin private-sector and overseas adoption;
      analysts characterize the model as policy-dependent, exposing revenue to
      Xinchuang budget shifts and a few dominant state channels.
    claimRefs: [CU026, CU028, CU029, CU030]
  - calloutType: assumption
    title: Retention inferred, not disclosed
    body: >-
      No NRR/GRR/churn/CSAT data is published; durability is inferred from high
      switching costs while field references themselves document compatibility
      friction that could pressure satisfaction.
    claimRefs: [CU018, CU020, CU024]
