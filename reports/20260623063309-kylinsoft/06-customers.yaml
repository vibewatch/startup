      - ["Energy / power grids", "State Grid, CSG, energy SOEs", "Substation terminals, dispatch, IIoT", "Sub-division 85% terminal localization; 2,000+ substations", "Critical-infrastructure anchor", "Shared with UOS; Kylin-only share unclear"]
      - ["Healthcare", "Tertiary hospitals (e.g., Ruijin)", "OA, HR, patient platforms on Kylin server", "Hundreds of institutions; 2,000+ app adaptations", "High-reliability reference vertical", "Mostly server V10; V11 migration pending"]
      - ["Education", "Universities, schools", "Teaching/research workstations", "Multi-province deployments", "Broad but lower-value base", "Volume and revenue undisclosed"]
      - ["Aerospace / defense", "Space and defense programs", "Mission systems (Tianwen, space station, Chang'e)", "100k+ fault-free hours", "Prestige reliability proof", "Classified; details limited"]
    notes: >-
      Segments are vertical clusters under the Xinchuang "2+8+N" rollout; scale
      figures are vendor- or case-reported and mix seats, organizations and
      adaptation counts on differing bases. Energy share is shared with UnionTech
      UOS.
    enumerationScope:
      coverage: partial
      basis: >-
        Principal mandated and regulated-industry segments compiled from Kylinsoft,
        Sohu, Sina, NetEase and IT Home reporting through June 2026; long-tail
        commercial, manufacturing and consumer segments are lightly covered and
        omitted from the principal set.
