company:
  name: Kylinsoft
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Kylinsoft sells into China's policy-driven domestic operating-system market,
    a roughly 45 billion yuan (2025) slice of the ~1.8 trillion yuan Xinchuang
    localization program. Demand is overwhelmingly created by SASAC mandates
    (100% SOE substitution by 2027), with party-government desktop replacement
    near 78-80% but private-sector and consumer adoption still trailing a
    Windows base that holds 70-80% of China's desktop market.
sections:
  - id: market-boundary
    title: Market Boundary and Substitutes
    body: >-
      Kylinsoft's core market is China's domestic operating-system industry, the
      basic-software layer of the national "Xinchuang" (信息技术应用创新)
      IT-application-innovation program that aims to replace foreign hardware and
      software across government and critical industries. The included spend is
      paid OS licensing, maintenance and support across desktop, server, embedded
      and intelligent-terminal deployments inside party-government bodies,
      state-owned enterprises, banks, telecom operators and other regulated
      sectors. Excluded from the served market is the large consumer and private
      commercial PC base, which remains Windows-centric and outside procurement
      mandates. The status-quo substitutes Kylinsoft displaces are Microsoft
      Windows on the desktop and international Linux distributions (Red Hat,
      SUSE, Ubuntu) plus Unix on servers; in China's server market domestic
      Linux now ships roughly ten times the volume of international brands, while
      foreign vendors have been pushed to the margins by self-controllable
      requirements. Adjacent layers in the same full-stack Xinchuang push —
      domestic CPUs (Loongson, Kunpeng, Phytium), databases, middleware and
      application software — are complementary spend that shapes OS compatibility
      requirements but is not OS revenue. The market is therefore best understood
      as an administratively bounded substitution market rather than an openly
      contested one.
    claimRefs: [CM001, CM016, CM017, CM018, CM029, CM035]
    tableRefs: [TM001]
    figureRefs: [FM004]
  - id: market-sizing
    title: Sizing the Opportunity
    body: >-
      Sizing must use multiple lenses because boundary definitions vary widely.
      At the broadest level, the full Xinchuang industry (chips, OS, database,
      middleware, applications) is projected to reach about 1.8 trillion yuan by
      2026 at roughly a 28.5% compound rate, with 2025 already above 1.5 trillion
      yuan; some analysts cite 2.2 trillion yuan, illustrating the dispersion. The
      operating-system slice is far smaller: China's total OS market (PC plus
      server) is estimated near 45 billion yuan in 2025, split roughly 25 billion
      yuan server and 20 billion yuan desktop. The directly addressable Xinchuang
      OS market — party-government plus the eight key regulated industries — is
      estimated at only about 9.75 to 20.5 billion yuan per year, growing 30%+,
      with the Xinchuang server segment near 5.75 billion yuan (≈1.15M units) and
      the Xinchuang PC segment near 4 billion yuan (≈8M units). Against these,
      Kylinsoft's own 2024 revenue of roughly 1.44 billion yuan implies it
      already captures a meaningful share of the addressable Xinchuang OS spend,
      but a tiny fraction of the broad OS or Xinchuang totals. The wide gap
      between the 45-billion-yuan OS lens and the 10-to-20-billion-yuan Xinchuang
      OS lens is itself a key diligence flag about which denominator applies.
    claimRefs: [CM002, CM003, CM004, CM005, CM006, CM024, CM025, CM033]
    tableRefs: [TM002]
    figureRefs: [FM001, FM002]
  - id: buyers-and-segmentation
    title: Buyers, Users, and Payers
    body: >-
      The buyer, user and payer are frequently the same state institution, which
      shapes the entire go-to-market. The primary budget owners are
      party-government IT departments and the CIO/procurement functions of
      state-owned enterprises, banks, and the three telecom operators (China
      Mobile, China Telecom, China Unicom), which are among the largest server-OS
      buyers. Procurement is tender-driven and weighted toward domestic vendors,
      so government and SOE purchasing accounts for over 60% of domestic OS
      demand. Adoption follows the official "2+8+N" rollout: first the two
      party-government segments, then eight priority industries (finance, energy,
      telecom, education, healthcare, transport, etc.), then a broader "N" of
      smaller enterprises and regions. Replacement depth varies sharply by
      segment: party-government desktop substitution has reached roughly 78-80%,
      while finance sits near 45-50%, energy 52%, education 65%, and telecom 38%.
      Users are public-sector office workers and back-office/server operators
      whose familiarity with Windows shapes switching friction; the adoption
      trigger is almost always a procurement mandate or a security/self-control
      directive rather than a bottom-up technical preference. This makes the sales
      motion a policy- and relationship-led enterprise tender process, not a
      product-led funnel.
    claimRefs: [CM014, CM019, CM030, CM036, CM037, CM020]
    tableRefs: [TM003]
    figureRefs: [FM003]
  - id: drivers-and-constraints
    title: Growth Drivers and Adoption Constraints
    body: >-
      The dominant growth driver is policy: a SASAC directive requires central
      state-owned enterprises to reach 100% Xinchuang substitution by 2027, and
      party-government core systems are targeted for full localization by the end
      of 2025, guaranteeing multi-year mandated demand. Secondary drivers include
      national-security and self-controllable imperatives amid US-China tech
      tensions, the digital-China / new-infrastructure investment cycle, and the
      October 2025 Windows 10 end-of-life that strands hardware and creates a
      migration moment. The constraints are equally concrete and partly adverse.
      Ecosystem and application gaps persist — professional industry software,
      developer toolchains and peripheral compatibility lag Windows — and legacy
      migration friction slows full replacement. Critically, adoption remains
      heavily mandate-dependent: outside government and regulated SOEs, private
      and consumer demand is thin, so the market's growth is administratively
      created rather than competitively won, leaving vendors exposed to any
      change in procurement intensity or budget. Windows still holds 70-80% of
      China's desktop base, macOS about 13%, and Linux including domestic builds
      only about 1.2-3.4%, underscoring how far real-world penetration trails the
      government-sector headline figures. These contradictions and the divergent
      sizing denominators are preserved as explicit diligence gaps.
    claimRefs: [CM011, CM012, CM013, CM015, CM021, CM022, CM023, CM031, CM032, CM038]
    tableRefs: [TM004]
callouts:
  - calloutType: insight
    title: Mandated demand, narrow base
    body: >-
      Kylinsoft's market is a guaranteed multi-year substitution program inside
      government and SOEs, but penetration outside the mandate is minimal, so the
      durable opportunity is large in policy terms yet narrow in free-market
      terms.
    claimRefs: [CM013, CM022, CM032]
  - calloutType: risk
    title: Denominator ambiguity
    body: >-
      Headline TAM figures span from ~10 billion yuan (Xinchuang OS) to 1.8
      trillion yuan (whole Xinchuang stack); choosing the wrong denominator can
      overstate Kylinsoft's runway by two orders of magnitude.
    claimRefs: [CM003, CM005, CM033]
