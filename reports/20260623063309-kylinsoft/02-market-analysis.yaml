  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: sizing-gap
      missingEvidence: A reconciled, methodology-transparent TAM for the Xinchuang OS segment.
      whyItMatters: The 45B-yuan OS lens and 10-20B-yuan Xinchuang OS lens differ enough to change the investment thesis.
      diligencePath: Obtain IDC/CCID primary OS market reports with segment definitions.
      relatedQuestionRefs: [QM019, QM025]
    - type: missing-source
      severity: material
      topic: server-os
      missingEvidence: Independent IDC/Canalys server-OS CAGR and share verification through 2030.
      whyItMatters: Long-run market growth underpins valuation runway.
      diligencePath: Purchase IDC China server OS tracker; cross-check vendor disclosures.
      relatedQuestionRefs: [QM024]
    - type: access-blocked
      severity: minor
      topic: market-share
      missingEvidence: Granular StatCounter and analyst datasets behind JS-only pages.
      whyItMatters: Precise domestic-OS desktop penetration is obscured in aggregate "Linux" buckets.
      diligencePath: Use API/exported datasets or paid analyst subscriptions.
      relatedQuestionRefs: [QM023]
