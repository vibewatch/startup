      - ["SOE / industry OS", "Finance, energy, telecom, education OS spend", "Foreign-JV private systems", "SOE/bank/telecom procurement", "Largest growth segment"]
      - ["Embedded / IoT OS", "Industrial, terminal, intelligent-connect OS", "General consumer IoT", "OEMs, integrators", "Kylin 100 expansion area"]
      - ["International Linux/Unix", "Legacy enterprise server OS", "n/a (being displaced)", "MNCs in China", "Status-quo substitute"]
      - ["Windows desktop", "Consumer/commercial desktops", "n/a (incumbent)", "Enterprises, consumers", "Primary displacement target"]
