    type: flow
    layout: standard
    summary: How the 2025 raise and internal profit fund R&D and ecosystem without external debt.
    data:
      nodes:
        - { id: parent, label: "CSS parent (2B subscription)" }
        - { id: syndicate, label: "State investor syndicate (1B)" }
        - { id: profit, label: "Internal net profit (502M/yr)" }
        - { id: cash, label: "Kylinsoft capital pool (3B raise)" }
        - { id: rd, label: "OS R&D + product lines" }
        - { id: ecosystem, label: "Ecosystem fund (500M)" }
      edges:
        - { from: parent, to: cash }
        - { from: syndicate, to: cash }
        - { from: profit, to: cash }
        - { from: cash, to: rd }
        - { from: cash, to: ecosystem }
    approximationNotes: >-
      Asset-light model: no material external debt disclosed; capital intensity
      sits in R&D and ecosystem subsidy rather than capex or inventory.
    claimRefs: [CI020, CI021, CI023, CI026]
