schemaVersion: "report-v2"
artifact: financials
slug: kylinsoft
runDate: 2026-06-23
company:
  name: Kylinsoft
chapter:
  number: 4
  title: Financials
  summary: >-
    Kylinsoft is unusually profitable for a frontier-tech company — 2024 revenue
    of 1.438 billion yuan and net profit of 502 million yuan (a ~35% net margin),
    rising to roughly 1.632 billion yuan and 550 million yuan in 2025 — monetized
    through OS licensing, support subscriptions and migration services sold
    largely into mandated government and SOE procurement. In June 2025 it closed a
    3 billion yuan equity increase (2 billion from parent China National Software
    plus 1 billion from a state-investor syndicate) at an 8.355 billion yuan
    pre-money appraisal, lifting the parent's stake from 40.25% to 47.23%.
    Underwriting is constrained by thin disclosure: only a single consolidated
    revenue line, an appraisal-based (not market-tested) valuation, an undisclosed
    revenue mix and cash position, and a loss-making listed parent.
sections:
  - id: revenue-model-and-mix
    title: Revenue Model, Pricing, and Mix
    body: >-
      Kylinsoft monetizes a portfolio of operating systems through four
      interlocking streams: perpetual or term software licensing (per-seat for
      desktop editions such as Galaxy Kylin, per-socket/per-node for server
      editions), recurring support and maintenance subscriptions, paid
      customization and Windows-to-Kylin migration services, and an
      ecosystem/partner program anchored by a 500 million yuan "Kylin Partner 5.0"
      fund that subsidizes ISV and hardware adaptation. Demand is overwhelmingly
      channeled through government and state-owned-enterprise procurement tenders
      rather than published price lists, so realized pricing is opaque and
      volume-tender-driven. The disclosed financial envelope is profitable and
      growing: parent China National Software (CSS, Shanghai 600536) reported
      Kylinsoft 2024 revenue of 1.438 billion yuan and net profit of 502 million
      yuan, and third-party 2025 figures put revenue at roughly 1.632 billion yuan
      (up about 13.5%) and net profit near 550 million yuan. However, the revenue
      mix across desktop, server, embedded, industrial and intelligent-computing
      lines — and the split between license, subscription and services — is not
      publicly broken out, and the figures reach the market only as a single
      consolidated line inside CSS disclosures rather than audited standalone
      Kylinsoft statements. The implied ~35% net margin is high for an OS vendor
      and likely reflects both genuine software economics and an undisclosed
      government-subsidy and tax-incentive component that cannot be isolated from
      public data.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007, CI008, CI009]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: unit-economics-and-gtm
    title: Unit Economics and Go-to-Market Efficiency
    body: >-
      Sales efficiency is structurally favorable but poorly instrumented in public
      data. Because Kylinsoft sells into a policy-mandated buyer base through China
      Electronics' state channels, customer-acquisition cost is low relative to a
      commercial enterprise-software vendor — demand is created by Xinchuang
      substitution mandates rather than by paid demand generation — while
      switching costs (certification, application adaptation, retraining) make the
      installed base sticky and support revenue durable. Gross margin is not
      disclosed, but comparable Chinese secure-OS economics imply high
      software-line gross margins (a listed peer reported OS-product gross margins
      above 90%), partly offset by lower-margin services and the cost of
      maintaining adaptation across eight-plus domestic CPU and seven-plus domestic
      GPU targets. The cost structure is R&D-heavy: the company frames the 2025
      raise explicitly as funding sustained, high-intensity OS research, product-
      line expansion and ecosystem building, and the parent called it the first
      concentrated, large-scale cash investment in OS R&D in its 40-plus-year
      history. None of the canonical unit-economics inputs — CAC, payback period,
      net revenue retention, deferred-revenue balance, services attach rate, or
      revenue-per-deployment across the 16-million-plus installed base — is
      published, so the underlying customer economics must be treated as a
      diligence gap rather than a measured result.
    claimRefs: [CI010, CI011, CI012, CI013, CI014, CI015, CI016]
    tableRefs: [TI003]
    figureRefs: [FI002]
  - id: capital-adequacy-and-financing
    title: Capital Adequacy, Financing, and Traction
    body: >-
      Kylinsoft's capital position is anchored by the June 2025 equity increase. As
      documented in CSS's December 2024 related-party-transaction filing, Kylinsoft
      raised up to 3 billion yuan: CSS subscribed up to 2 billion yuan via a
      non-public agreement, and qualified external investors subscribed up to 1
      billion yuan through a public listing on the Shanghai United Assets and Equity
      Exchange, at a price based on a Beijing Zhongtonghua appraisal valuing 100%
      of Kylinsoft equity at 8.355 billion yuan as of 31 December 2023 (filed with
      state-asset regulators). The round closed by 30 June 2025, lifting CSS's stake
      from 40.25% to 47.23% (with a fallback path to 51.79% had only the parent
      subscribed). The external 1 billion yuan tranche was led by the Greater Bay
      Area fund and joined by China Mobile Capital, Sinopec Capital, CCB Investment,
      the China Internet Investment Fund, Tianjin's Haihe Industrial Fund and
      CEC-affiliated vehicles — a roster that is almost entirely state capital.
      Because the company is profitable (502 million yuan net in 2024), it is not
      burning cash in the venture sense, and no material third-party debt or
      project-finance obligation is disclosed; effective runway is underwritten by
      the state parent. Public traction metrics are operational rather than
      financial — 16-million-plus cumulative deployments, 210,000-plus served
      organizations, ~70% party-government desktop share — and the next financing
      trigger most discussed externally is a potential public listing, though no
      filing confirms one. The financing facts here are restated locally; the
      round-by-round chronology lives in the Company Overview chapter.
    claimRefs: [CI017, CI018, CI019, CI020, CI021, CI022, CI023, CI024, CI025, CI026, CI027]
    tableRefs: [TI004]
    figureRefs: [FI003, FI004]
  - id: financial-verdict-and-gaps
    title: Financial Verdict and Diligence Blockers
    body: >-
      On revenue quality, Kylinsoft scores well on durability and poorly on
      transparency: revenue is recurring, mandate-protected and profitable, but it
      is disclosed only as a single consolidated line, its segment and license-
      versus-services mix is unknown, and the ~35% net margin cannot be decomposed
      into operating profitability versus government subsidy and tax relief. On the
      margin path, the high implied software margins are encouraging, but rising
      multi-architecture adaptation costs and ecosystem subsidies (the 500 million
      yuan partner fund) could compress them, and the loss-making listed parent —
      CSS reported 2024 revenue of 5.198 billion yuan, down 22.69%, with a net loss
      of about 413 million yuan — underscores that Kylinsoft is the group's profit
      engine carrying weaker affiliates. On capital intensity, the model is
      asset-light and currently self-funding, but the 3 billion yuan raise signals
      that sustaining frontier OS R&D requires periodic large state capital
      injections rather than purely organic cash generation. The decisive
      underwriting blocker is valuation evidence: the 8.355 billion yuan mark is an
      end-2023 appraisal accepted by related parties and state regulators, not a
      market-cleared price, and the bulk of the round was an intra-group
      subscription. Audited standalone statements, a segmented revenue bridge, the
      cash balance, deferred-revenue detail, and the subsidy share of profit are
      all required before the valuation can be independently underwritten.
    claimRefs: [CI028, CI029, CI030, CI031, CI032, CI033, CI034, CI035, CI036, CI037, CI038]
    tableRefs: [TI005]
callouts:
  - calloutType: strength
    title: Profitable and growing, rare for the category
    body: >-
      Kylinsoft earned 502 million yuan net on 1.438 billion yuan revenue in 2024
      (~35% margin), growing to ~1.632 billion yuan and ~550 million yuan in 2025 —
      profitability most frontier-tech peers lack, backed by recurring mandated
      demand.
    claimRefs: [CI002, CI003, CI008]
  - calloutType: risk
    title: Appraisal-based, intra-group valuation
    body: >-
      The 8.355 billion yuan mark is an end-2023 appraisal, and two-thirds of the
      3 billion yuan round was a parent subscription — so the valuation is
      state-set and related-party, not market-cleared.
    claimRefs: [CI018, CI019, CI021]
  - calloutType: assumption
    title: Profit quality is unverifiable from public data
    body: >-
      The ~35% net margin cannot be split between operating profit and
      government subsidy/tax relief, and revenue reaches the market only as one
      consolidated line inside the loss-making parent's accounts.
    claimRefs: [CI009, CI030, CI032]
