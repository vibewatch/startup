      - ["Support subscription", "Annual recurring fee", "Undisclosed", "Bundled in multi-year contracts", "Inferred"]
      - ["Migration services", "Fixed-bid project fee", "Undisclosed", "Negotiated per engagement", "Inferred"]
      - ["openKylin community", "Free open-source edition", "Zero list price", "Monetized indirectly via commercial upsell", "Company/official"]
