      topic: capital-adequacy
      missingEvidence: Cash balance, burn rate, working capital and a full cash-flow statement.
      whyItMatters: Without these, runway and capital intensity cannot be independently confirmed.
      diligencePath: Request the balance sheet and statement of cash flows.
      relatedQuestionRefs: [QI017, QI019]
    - type: conflicting-evidence
      severity: minor
      topic: valuation
      missingEvidence: A post-money, market-tested valuation rather than an end-2023 appraisal.
      whyItMatters: The mark underpins the unicorn label but is related-party and stale.
      diligencePath: Obtain the public listing record and any updated appraisal.
      relatedQuestionRefs: [QI021]
    - type: enumeration-incomplete
      severity: minor
      topic: unit economics
      missingEvidence: Full set of unit-economics metrics (CAC, payback, retention, deferred revenue).
      whyItMatters: Customer economics cannot be underwritten from operational metrics alone.
      diligencePath: Request a cohort-level revenue and retention dataset.
      relatedTableRefs: [TI003]
    - type: enumeration-incomplete
      severity: minor
      topic: public financial gaps
      missingEvidence: A complete data-room checklist beyond the principal blockers listed.
      whyItMatters: Additional items may surface in diligence.
      diligencePath: Issue a standard financial data-room request list.
      relatedTableRefs: [TI005]
