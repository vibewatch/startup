    claimRefs: [CI017, CI018, CI019, CI020, CI002, CI024, CI025]
  - id: TI005
    title: Public financial gaps table
    columns: [Missing private metric, Impact, Exact diligence path]
    rows:
      - ["Audited standalone financial statements", "Cannot verify the single consolidated revenue line", "Request Kylinsoft audited accounts via CSS related-party disclosure"]
      - ["Segmented revenue mix", "Cannot assess concentration or growth quality", "Obtain license/subscription/services and product-line breakdown"]
      - ["Subsidy / tax-incentive share of profit", "Cannot judge true operating profitability", "Reconcile profit to government-grant and tax-relief notes"]
      - ["Cash balance and cash-flow statement", "Cannot confirm runway or working capital", "Request balance sheet and statement of cash flows"]
      - ["Deferred revenue and backlog", "Cannot gauge forward visibility", "Obtain deferred-revenue and contract-backlog schedule"]
      - ["Post-money valuation and round terms", "Cannot underwrite the 8.355B mark", "Review capital-increase agreement and exchange listing record"]
    notes: >-
      Each gap blocks a specific underwriting step; the diligence path names the
      document that would close it.
    enumerationScope:
      coverage: partial
      basis: >-
        Principal undisclosed private metrics that block valuation underwriting,
        compiled against public CSS and Kylinsoft disclosures through June 2026;
        not an exhaustive data-room checklist.
    claimRefs: [CI028, CI029, CI030, CI031, CI032, CI033]
