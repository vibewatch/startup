      - ["CAC / payback", "null", low, "Tests demand-generation efficiency", "Assess channel/sales cost vs mandate-driven demand"]
      - ["Net revenue retention", "null", low, "Captures expansion within installed base", "Request renewal and upsell data"]
      - ["Revenue per deployment", "null (1.438B / 16M+ = rough proxy)", low, "Distinguishes paid seats from total installs", "Separate paid licenses from free installs"]
      - ["Deferred revenue / backlog", "null", low, "Signals forward revenue visibility", "Obtain deferred-revenue schedule"]
    notes: >-
      Most unit-economics inputs are undisclosed; null marks metrics with no
      reliable public value. The revenue-per-deployment proxy mixes paid and free
      installs and is illustrative only.
    enumerationScope:
      coverage: partial
      basis: >-
        Standard SaaS/OS unit-economics metrics assessed against Kylinsoft public
        disclosures through June 2026; most are unpublished for this state entity
        and recorded as gaps rather than values.
    claimRefs: [CI008, CI010, CI012, CI013, CI016]
