companyProfile:
  summary: >-
    Kylinsoft (麒麟软件有限公司) is China's leading developer of domestic operating
    systems and the national champion of the Xinchuang technology-autonomy drive.
    Controlled by China National Software (CSS, 600536), itself a subsidiary of
    state group China Electronics Corporation (CEC), it builds the commercial
    Galaxy Kylin family for government and critical-infrastructure buyers, the
    openKylin open-source community OS governed under the OpenAtom Foundation, and
    the Kylin 100 smart-connected OS for industrial and IoT use. It is the
    fourteen-year leader of China's Linux market with more than 16 million
    deployments. In June 2025 it raised 3 billion yuan at an 8.355 billion yuan
    appraisal, becoming Tianjin's first domestic-OS unicorn.
  foundedDate: "2020-02-01"
  founders:
    - name: China Electronics Corporation (CEC)
      role: State parent / founding sponsor
      background: >-
        Formed Kylinsoft in February 2020 by merging Tianjin Kylin Information
        Technology with China Standard Software under its software subsidiary.
      claimRefs: [CO004, CO005]
  foundingLocation: Tianjin, China
  headquarters: Tianjin, China (with Guangdong presence)
  productSummary: >-
    Operating systems sold as per-seat (desktop) and per-socket/per-node (server)
    licenses plus support subscriptions and migration services: Galaxy Kylin V11
    (Linux 6.6-based, with the Panshi immutable architecture and an integrated
    security and AI stack), the openKylin community OS, and the Kylin 100
    smart-connected OS. Certified across domestic CPUs (Phytium, Kunpeng, Loongson,
    Hygon, Zhaoxin).
  customerFocus: >-
    Party-government ministries, state-owned banks, telecom carriers, energy/grid
    operators and SOEs procuring under domestic-substitution mandates; negligible
    private-sector and consumer penetration.
  businessModel: >-
    OS licensing, support and maintenance subscriptions, customization/migration
    services and an ecosystem/partner program, sold overwhelmingly through
    mandated government and SOE procurement tenders rather than published pricing.
  stage: Late-stage / state-backed private
  fundingStatus: >-
    3 billion yuan equity increase closed June 2025 (2 billion from parent CSS plus
    1 billion from a state-investor syndicate led by the Greater Bay Area Fund) at
    an 8.355 billion yuan end-2023 appraisal; parent stake rose from 40.25% to
    47.23%.
  disclosureProfile: private-undisclosed
  claimRefs: [CV001, CV002, CV003, CU008, CI017]
summary:
  headline: >-
    A genuinely profitable, policy-protected national OS champion whose
    appraisal-based valuation and mandate-dependent demand can be tracked but not
    independently underwritten without standalone disclosure.
  overallScore: 5.5
  recommendation: track
  confidence: low
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 1160
    revenueRunRateUsdM: 227
    arrUsdM: null
    revenueGrowthYoYPct: 13.5
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 417
    customerCount: null
    headcount: null
  topStrengths:
    - >-
      Policy-anointed #1 in China's mandated domestic-OS substitution (~70% of the
      party-government desktop segment; fourteen consecutive years atop China's
      Linux market) with 16M+ deployments across banks, grids, telecoms and
      aerospace.
    - >-
      Genuinely profitable (2024 revenue 1.438 billion yuan at a ~35% net margin),
      unlike most frontier-tech assets, and funded by a deep-pocketed state parent
      that injected 3 billion yuan in 2025.
    - >-
      Modern, certified product (Galaxy Kylin V11 on Linux 6.6 with the Panshi
      immutable architecture and an integrated security-plus-AI stack) spanning
      desktop, server, embedded and smart-connected lines across six-plus domestic
      CPU architectures.
  topRisks:
    - >-
      Geopolitical and supply-chain exposure: ultimate parent CEC sits on the US
      Entity List, capping the leading-edge silicon and tooling the domestic CPUs
      Kylin certifies against can access.
    - >-
      Mandate dependence: demand is administratively created by Xinchuang
      procurement policy, with negligible private-market validation, so a policy
      loosening or successor-policy gap would hit revenue directly.
    - >-
      Valuation and disclosure opacity: the 8.355 billion yuan mark is a
      related-party appraisal, no audited standalone accounts exist, and the
      government-subsidy share of profit is unquantified.
    - >-
      Ecosystem and competitive risk: thin application/peripheral compatibility
      versus Windows, persistent "套壳" (shell-over-Linux) criticism, and buyer
      multi-homing with UnionTech UOS and Huawei openEuler/HarmonyOS.
  unresolvedGaps:
    - >-
      Audited standalone Kylinsoft financial statements to verify the single
      consolidated revenue line and the undisclosed cash position.
    - >-
      A reconciliation of net profit to government grants and tax incentives to
      test whether profitability is organic or policy-contingent.
    - >-
      A market-tested valuation reference or updated appraisal with the full
      capital-increase agreement (preference, dilution and control terms).
    - >-
      A credible arm's-length exit path (STAR Market IPO intent or SOE
      control-transfer terms) for an independent investor.
