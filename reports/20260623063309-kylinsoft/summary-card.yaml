  topStrengths:
    - >-
      Policy-anointed #1 in China's mandated domestic-OS substitution (~70% of the party-government desktop segment;
      fourteen consecutive years atop China's Linux market) with 16M+ deployments across banks, grids, telecoms and
      aerospace.
    - >-
      Genuinely profitable (2024 revenue 1.438 billion yuan at a ~35% net margin), unlike most frontier-tech assets, and
      funded by a deep-pocketed state parent that injected 3 billion yuan in 2025.
    - >-
      Modern, certified product (Galaxy Kylin V11 on Linux 6.6 with the Panshi immutable architecture and an integrated
      security-plus-AI stack) spanning desktop, server, embedded and smart-connected lines across six-plus domestic CPU
      architectures.
  topRisks:
    - >-
      Geopolitical and supply-chain exposure: ultimate parent CEC sits on the US Entity List, capping the leading-edge
      silicon and tooling the domestic CPUs Kylin certifies against can access.
    - >-
      Mandate dependence: demand is administratively created by Xinchuang procurement policy, with negligible
      private-market validation, so a policy loosening or successor-policy gap would hit revenue directly.
    - >-
      Valuation and disclosure opacity: the 8.355 billion yuan mark is a related-party appraisal, no audited standalone
      accounts exist, and the government-subsidy share of profit is unquantified.
    - >-
      Ecosystem and competitive risk: thin application/peripheral compatibility versus Windows, persistent "套壳"
      (shell-over-Linux) criticism, and buyer multi-homing with UnionTech UOS and Huawei openEuler/HarmonyOS.
  unresolvedGaps:
    - >-
      Audited standalone Kylinsoft financial statements to verify the single consolidated revenue line and the
      undisclosed cash position.
    - >-
      A reconciliation of net profit to government grants and tax incentives to test whether profitability is organic or
      policy-contingent.
    - >-
      A market-tested valuation reference or updated appraisal with the full capital-increase agreement (preference,
      dilution and control terms).
    - >-
      A credible arm's-length exit path (STAR Market IPO intent or SOE control-transfer terms) for an independent
      investor.
