company:
  name: Kylinsoft
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Kylinsoft (麒麟软件有限公司) is the state-backed flagship of China's domestic
    operating-system industry, a Tianjin-headquartered subsidiary of China
    Electronics Corporation that develops the Galaxy Kylin, NeoKylin and
    openKylin systems. In June 2025 it raised 3 billion yuan (~$417M) at an
    appraised equity value of 8.355 billion yuan, becoming Tianjin's first
    unicorn of the year, with 16M+ deployments concentrated in government,
    finance and telecom.
sections:
  - id: identity-and-structure
    title: Identity, Structure, and Products
    body: >-
      Kylinsoft Co., Ltd. (麒麟软件有限公司, also rendered "Kylin Software") is a
      Chinese developer of secure, domestically controlled operating systems
      headquartered in the Binhai High-Tech Zone of Tianjin. It sits inside a
      fully state-owned ownership chain: China Electronics Corporation (CEC),
      China's largest state-owned electronic-information group, controls the
      Shanghai-listed China National Software & Service Co. (CSS, 600536), which
      is Kylinsoft's controlling shareholder. The company is the consolidation
      vehicle for China's two historically dominant secure-OS lineages — the
      Galaxy Kylin (银河麒麟) line that traces to National University of Defense
      Technology research begun in 2001 under the 863 Program, and the NeoKylin
      / Zhongbiao Kylin desktop line from China Standard Software. Kylinsoft's
      predecessor, Tianjin Kylin Information Technology Co., was established in
      December 2014 as a joint CEC/Tianjin strategic deployment; in February
      2020 Tianjin Kylin absorbed China Standard Software through a share swap
      and was renamed Kylinsoft, holding its founding conference on 20 March
      2020. Its product portfolio spans server, desktop, embedded and
      Internet-of-Everything operating systems, marketed under the Galaxy Kylin,
      NeoKylin and Starlight Kylin brands, plus the openKylin open-source
      community edition and the newer Kylin 100 Smart Connected OS. Revenue comes
      from licensing, support/maintenance contracts and government and
      state-enterprise procurement, making the company a core instrument of
      China's "Xinchuang" IT-localization drive.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO009, CO038, CO039]
    tableRefs: [TO001]
    figureRefs: [FO002]
  - id: leadership-and-governance
    title: Leadership and Governance
    body: >-
      Kylinsoft's governance reflects its status as a centrally administered
      state asset rather than a founder-led startup. The chairman and Communist
      Party secretary is Chen Zhihua (谌志华), who concurrently chairs the parent
      China National Software & Service Co.; this dual mandate tightly aligns
      Kylinsoft's strategy with CSS and ultimately CEC, but concentrates
      decision rights in a single party-appointed leader and creates evident
      key-person and political-alignment dependency. The general manager (CEO)
      is Kong Jinzhu (孔金珠), a long-time core developer of the Galaxy Kylin
      operating system who leads R&D, ecosystem build-out and the domestic-
      substitution push. Because Kylinsoft is unlisted and state-controlled, the
      board, independent directors and full executive roster are not publicly
      disclosed to the degree expected of a venture-funded company, and there is
      no founder equity or classic founder-market-fit narrative; instead,
      governance authority flows from SASAC through CEC and CSS. Strategic
      direction — kernel choices, ecosystem funding, procurement positioning —
      is set in coordination with the parent group and national industrial
      policy. The leadership's deep technical pedigree in secure OS development
      is a genuine strength, but the opacity of the wider management bench and
      the single-chair concentration are material governance diligence items.
    claimRefs: [CO016, CO017, CO018, CO001]
    tableRefs: [TO002]
  - id: funding-and-valuation
    title: Funding, Valuation, and Financial Snapshot
    body: >-
      In June 2025 Kylinsoft completed a capital increase raising 3 billion yuan
      (about $417 million), one of the larger domestic-software equity events of
      the year. The round comprised 2 billion yuan from controlling shareholder
      China National Software, subscribed via non-public agreement, and 1 billion
      yuan from qualified strategic investors selected through an on-exchange
      process. The strategic tranche was led and organised by the Greater Bay
      Area Fund and included China Mobile Capital, Sinopec Capital, CCB
      Investment, CSSC Capital, Huihua Fund, Haihe Industrial Fund, the China
      Internet Investment Fund and Binhai New Area technology-finance vehicles.
      The deal lifted CSS's stake by roughly 17.6 points to 47.23%. Pricing
      rested on a SASAC-filed appraisal that valued Kylinsoft's total equity at
      8.355 billion yuan as of 31 December 2023, making the company Tianjin's
      first unicorn of 2025. Underlying public financials are unusually thin for
      a company of this profile: a disclosure tied to the raise put 2024 revenue
      at 1.438 billion yuan and net profit at 502 million yuan, and 2025
      registered capital rose to 302 million yuan. Cash, burn, current run-rate
      and the use-of-proceeds split across mobile/fixed terminals, cloud servers
      and embedded systems are not granularly disclosed, so several cover metrics
      are carried as gaps with explicit diligence paths.
    claimRefs: [CO019, CO020, CO021, CO022, CO023, CO024, CO025, CO026, CO027]
    tableRefs: [TO003]
  - id: scale-milestones-and-flags
    title: Scale, Milestones, and Adverse Flags
    body: >-
      Kylinsoft's headline traction is its installed base: Galaxy Kylin
      deployments exceeded 16 million sets as of August 2025, concentrated in
      government, finance, telecom, energy and education, and the company claims
      more than 70% share of China's government core-application OS market. Its
      software underpins national projects including the Chang'e lunar and
      Tianwen Mars programs, and the firm holds a National Science and Technology
      Progress Award. The product cadence is brisk: Galaxy Kylin V10 launched in
      August 2020 on Linux kernel 4.19; the openKylin root community opened in
      July 2022; Galaxy Kylin V11 — China's first commercial OS on the Linux 6.6
      kernel, with 120+ proprietary enhancements, a new "Rock/磐石" architecture,
      an AI assistant and support for AMD, Intel, eight domestic CPUs and seven
      domestic GPUs — shipped on 26 August 2025 alongside a 500-million-yuan
      "Kylin Partner 5.0" ecosystem fund; V11 won a CITE2026 innovation gold
      award in April 2026 and the Kylin 100 Smart Connected OS followed in May
      2026. The bull case is offset by genuine adverse signals. The Register
      noted that 16 million installs is a "minuscule" share in a 1.4-billion-
      person market, and flagged that the Linux 6.6 LTS base loses upstream
      support in December 2026 — roughly 16 months after V11 launched — echoing
      Kylinsoft's earlier choice to keep V10 on an end-of-life 4.19 kernel.
      Adoption remains heavily mandate-driven rather than competitive.
    claimRefs: [CO008, CO010, CO011, CO012, CO013, CO014, CO015, CO028, CO029, CO030, CO031, CO032, CO033, CO034, CO035, CO036, CO037]
    tableRefs: [TO004]
    figureRefs: [FO001, FO003]
