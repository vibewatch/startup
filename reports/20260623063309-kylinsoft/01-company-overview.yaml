callouts:
  - calloutType: strength
    title: State-backed category leader
    body: >-
      Kylinsoft consolidates China's two dominant secure-OS lineages under CEC,
      with 16M+ deployments and majority government-sector share, giving it a
      structurally protected demand base inside the Xinchuang localization drive.
    claimRefs: [CO008, CO028, CO029]
  - calloutType: risk
    title: Mandate-dependent, thin disclosure
    body: >-
      Traction is policy-driven rather than competitively won, and public
      financials are sparse — a single 2024 revenue/profit disclosure and an
      end-2023 appraisal underpin the unicorn valuation.
    claimRefs: [CO024, CO026, CO035]
  - calloutType: assumption
    title: Kernel-support overhang
    body: >-
      V11 ships on a Linux 6.6 LTS base whose upstream support lapses in
      December 2026, repeating the V10-on-4.19 end-of-life pattern and implying
      a recurring maintenance burden.
    claimRefs: [CO036]
