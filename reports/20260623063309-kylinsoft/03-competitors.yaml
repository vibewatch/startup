company:
  name: Kylinsoft
chapter:
  number: 3
  title: Competitive Landscape
  summary: >-
    Kylinsoft competes in a state-shaped Chinese OS market against one principal
    desktop rival (UnionTech UOS), a shared server root community it depends on
    (Huawei openEuler), an emerging consumer-led challenger (Huawei HarmonyOS
    PC), niche secure-OS vendors (KylinSec, ChinaSoft FangDe), and the displaced
    foreign incumbent (Microsoft Windows). Kylin leads the party-government and
    secure-server segments — 14 consecutive years as China's top Linux by
    installed base — but its moat rests on state ownership and security
    certification rather than product or ecosystem superiority, where UOS now
    leads on desktop UX and app breadth and openEuler underpins Kylin's own
    server line.
sections:
  - id: landscape-and-rivals
    title: Competitive Landscape and Rivals
    body: >-
      China's domestic operating-system market has consolidated into a small set
      of state-aligned vendors operating under the Xinchuang localization drive,
      with Kylinsoft and UnionTech widely framed as a desktop "dual monopoly" and
      Huawei's openEuler dominating the server root layer. The competitive set
      spans five archetypes. The direct desktop peer is UnionTech (Tongxin
      Software, 统信软件), whose Unity Operating System (UOS) was founded as a
      Beijing venture in 2019, released its first stable build in January 2020,
      and is built on the Debian-derived Deepin desktop; it is the leading
      general-market desktop OS and crossed ten million ecosystem adaptations in
      2025, the first Chinese OS vendor to do so. The shared server substrate is
      Huawei's openEuler, an Apache-licensed community root operating system
      donated to the OpenAtom Foundation in November 2021 that holds roughly
      57.3% of China's new server-OS installations in 2025 — and on which
      Kylinsoft's own Galaxy Kylin server edition is built, making openEuler both
      an upstream dependency and a strategic counterweight. The emerging
      substitute is Huawei's HarmonyOS PC, a microkernel desktop OS whose first
      notebook shipped in May 2025; it removes all Linux/Android code, runs no
      native Windows applications, and is positioned as the most credible
      long-run Windows desktop challenger. Niche secure-OS specialists include
      the separately listed KylinSec (麒麟信安, distinct from Kylinsoft) in power
      and aerospace, and ChinaSoft FangDe (中科方德, NFSChina) in
      Windows-compatible desktop. The status-quo alternative remains Microsoft
      Windows, still roughly 70-80% of China's desktop base and the primary
      displacement target, with international Linux/Unix (Red Hat Enterprise
      Linux, Ubuntu, SUSE) as the legacy enterprise reference being phased out of
      mandated sectors. deepin, a UnionTech-owned community distribution dating to
      2004, rounds out the field as an upstream and consumer-facing option.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006, CP007, CP008, CP009, CP010, CP011]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability-pricing-gtm
    title: Capability, Pricing, and Go-to-Market Comparison
    body: >-
      On capability, the field segments cleanly by workload. Galaxy Kylin leads
      mission-critical reliability — claiming 99.9999%-class availability,
      industry-leading number of EAL4/等保四级 security certifications, and
      reference deployments in space missions, power-grid dispatch and core bank
      transaction gateways — and operates the deepest ecosystem, with adaptation
      counts approaching ten million (roughly 7.36 million software plus one
      million hardware) and 2,200+ Kylin SDK developer interfaces. UnionTech UOS
      leads desktop user experience: its Deepin Desktop Environment closely mimics
      Windows 10, cutting reported migration training time from days to hours, and
      it carries 15,000+ native applications and the largest software/hardware
      adaptation total (10M+). openEuler leads server and cloud-native breadth but
      is a community root rather than a turnkey distribution, so enterprises adopt
      a commercial derivative (Kylin, UOS, or KylinSec) for SLA support. On
      pricing, all domestic vendors monetize through perpetual or subscription
      licensing plus paid support and migration services rather than published
      list prices; deals are won through government and SOE procurement tenders,
      and one source flags that subscription licensing has triggered compliance
      disputes in some provincial budget reviews. On go-to-market, Kylin reaches
      buyers through China Electronics' state channels and party-government
      mandates, UOS through faster-growing commercial, education and telecom
      desktop migrations, openEuler through its 2,100+-member community feeding
      downstream commercial distros, and HarmonyOS through Huawei's hardware
      installed base. The result is heavy multi-homing: large government buyers
      routinely certify and deploy both Kylin and UOS, limiting any single
      vendor's pricing power.
    claimRefs: [CP012, CP013, CP014, CP015, CP016, CP017, CP018, CP019, CP020, CP021]
    tableRefs: [TP002, TP003]
    figureRefs: [FP002]
  - id: switching-distribution-lockin
    title: Switching Costs, Lock-in, and Distribution Power
    body: >-
      Switching costs in this market are high once a system is certified and
      deployed: application adaptation, hardware-driver qualification, security
      accreditation and user retraining create multi-year lock-in, which protects
      every incumbent's installed base — including Kylin's 20-million-plus
      cumulative deployments and 210,000+ served organizations. Kylin's deepest
      lock-in is the integrated "PKS" stack (Phytium ARM CPUs plus Kylin OS plus
      its security subsystem) that binds party-government and defense buyers to a
      domestically controlled combination, reinforced by certification breadth.
      Distribution power, however, is concentrated in the state: procurement is
      mandate-driven, and China Electronics' channel access is Kylin's primary
      structural advantage rather than independent commercial demand. Two dynamics
      erode pricing power. First, multi-homing is the norm — central agencies,
      banks and operators qualify multiple domestic OSes to avoid single-vendor
      dependence, so Kylin and UOS frequently coexist inside the same buyer.
      Second, supply and partner access is shared: Kylin, UOS and KylinSec all
      build their server editions on Huawei's openEuler root, and all depend on
      the same domestic CPU vendors (Phytium, Kunpeng, Loongson, Hygon, Zhaoxin),
      so few proprietary supply advantages exist below the integration and
      certification layer. The practical implication is that competition is less
      about winning net-new demand — which policy guarantees — than about share of
      a mandated wallet that buyers deliberately split.
    claimRefs: [CP022, CP023, CP024, CP025, CP026, CP027, CP028, CP029]
  - id: moat-durability-adverse
    title: Moat Durability and Competitive Risk
    body: >-
      Kylinsoft's durable advantages are its state ownership and CEC channel, its
      14-year installed-base leadership in party-government and secure-server
      workloads, its certification depth, and the highest ecosystem maturity among
      domestic vendors. Each, however, faces a credible threat. The desktop moat is
      contested by UnionTech, which now leads on out-of-box UX and app breadth and
      turned its first annual profit (¥238M on ¥718M revenue) in 2025, growing 62%
      year on year versus Kylinsoft's mid-teens growth. The server moat is
      structurally capped because Galaxy Kylin server is built on Huawei's
      openEuler, so Kylin captures integration and support margin but does not own
      the root ecosystem and competes there with UOS and KylinSec on identical
      upstream. The long-run desktop threat is HarmonyOS PC, whose microkernel,
      Huawei hardware reach and consumer ecosystem could displace Linux-based
      desktops in mass-market and eventually government segments. Most pointedly,
      domestic OSes — Kylin included — face persistent "shell/套壳" criticism that
      they are second-stage customizations of Debian/Ubuntu/openEuler with limited
      independent kernel innovation, alongside documented ecosystem gaps: peripheral
      and printer-driver lag, professional design software (Adobe, AutoCAD,
      SolidWorks) running only through Wine with 30-50% performance loss, and
      slower kernel-level L3 support response than Red Hat that has pushed some
      banks to self-build support teams. KylinSec's 2025 swing to a net loss with
      negative operating cash flow illustrates that even certification-rich secure-OS
      niches struggle to commercialize. Net, Kylinsoft's moat is real but
      state-contingent and partly shared, not a proprietary technology lead.
    claimRefs: [CP030, CP031, CP032, CP033, CP034, CP035, CP036, CP037, CP038, CP039, CP040]
    tableRefs: [TP004]
    figureRefs: [FP003]
