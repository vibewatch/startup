    title: Category leader in secure and party-government OS
    body: >-
      Galaxy Kylin holds 14 consecutive years as China's top Linux by installed
      base, ~70% party-government desktop share and the deepest domestic ecosystem,
      anchored by certification depth and the integrated PKS stack.
    claimRefs: [CP012, CP022, CP030]
  - calloutType: risk
    title: Moat is shared and state-contingent
    body: >-
      Kylin's server line runs on Huawei's openEuler root, its desktop UX trails
      UnionTech UOS, and buyers deliberately multi-home Kylin and UOS — so demand
      is mandate-driven rather than competitively won.
    claimRefs: [CP024, CP031, CP034]
