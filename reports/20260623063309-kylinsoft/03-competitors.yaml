    - type: missing-source
      severity: material
      topic: competitor-financials
      missingEvidence: Audited revenue and unit-share data for UnionTech and FangDe on a comparable basis to Kylinsoft.
      whyItMatters: Comparable financials are needed to judge whether Kylin's lead is widening or eroding.
      diligencePath: Obtain CCID/IDC unit-share datasets and audited competitor statements.
      relatedQuestionRefs: [QP002, QP019]
    - type: missing-source
      severity: material
      topic: pricing
      missingEvidence: Actual per-seat and per-socket contract prices and discount levels across vendors.
      whyItMatters: Pricing transparency determines real competitive intensity and margin pressure.
      diligencePath: Review awarded government tender documents and procurement price disclosures.
      relatedQuestionRefs: [QP007]
    - type: conflicting-evidence
      severity: minor
      topic: competitor-profile new entrants
      missingEvidence: Whether HarmonyOS PC or RISC-V entrants will materially enter government/enterprise OS within the forecast window.
      whyItMatters: New entrants could reshape the desktop landscape Kylin currently co-leads.
      diligencePath: Track HarmonyOS PC enterprise pilots and RISC-V procurement signals.
      relatedQuestionRefs: [QP025]
    - type: enumeration-incomplete
      severity: minor
      topic: competitor profile table
