  topStrengths:
    - 政策钦定的中国国产 OS 替代第一名（约占党政桌面市场 70%；连续 14 年位居中国 Linux 市场第一），在银行、电网、电信、航天等场景部署 16M+ 套。
    - 2024 年收入 14.38 亿元、净利率约 35%，是真盈利，不同于多数前沿科技资产；资金也来自口袋很深的国资母公司，2025 年注入 30 亿元。
    - 产品现代且已获认证：Galaxy Kylin V11 基于 Linux 6.6，搭载 Panshi 不可变架构和安全 + AI 一体化栈，覆盖桌面、服务器、嵌入式和智能连接产品线，并适配六种以上国产 CPU 架构。
  topRisks:
    - 地缘政治和供应链暴露：最终母公司 CEC 在美国 Entity List 上，限制麒麟所适配国产 CPU 可获得的先进芯片和工具。
    - 需求依赖政策：需求由信创采购政策行政创造，几乎没有私营市场验证；一旦政策放松或接续政策断档，收入会直接受冲击。
    - 估值和披露不透明：83.55 亿元标记来自关联方评估，没有审计后的独立报表，政府补贴占利润多少也未量化。
    - 生态和竞争风险：应用 / 外设兼容性较 Windows 薄弱，长期被批评「套壳」Linux，买方也在 UnionTech UOS、Huawei openEuler / HarmonyOS 之间多栖。
  unresolvedGaps:
    - 需要审计后的 Kylinsoft 独立财报，以核验单一合并收入线和未披露现金余额。
    - 需要把净利润拆到政府补助和税收优惠，判断盈利来自经营本身，还是依赖政策。
    - 需要经市场检验的估值参考，或带完整增资协议的更新评估（优先权、稀释和控制条款）。
    - 需要独立投资人可信的公平退出路径（STAR Market IPO 意向或 SOE 控制权转让条款）。
