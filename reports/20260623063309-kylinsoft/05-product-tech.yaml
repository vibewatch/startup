callouts:
  - calloutType: strength
    title: First commercial OS on Linux 6.6 with an integrated security+AI stack
    body: >-
      Galaxy Kylin V11 pairs a modern Linux 6.6 base with the Panshi immutable
      architecture, a self-developed display framework, an AI subsystem with
      local/cloud compute-sharing, and a dual-system security model — productized
      and certified for government procurement.
    claimRefs: [CE002, CE009, CE015, CE028]
  - calloutType: risk
    title: Differentiation is integration, not autonomous kernel IP
    body: >-
      The kernel, Wayland, container engines and core userspace are upstream
      open-source; the server edition leans on the openEuler root; and AI features
      wrap third-party models — bounding "self-developed" claims and exposing the
      portfolio to the Linux 6.6 LTS maintenance horizon.
    claimRefs: [CE010, CE034, CE037, CE016]
  - calloutType: assumption
    title: Compatibility and certification gaps remain vendor-stated
    body: >-
      Wine performance loss of 30-50% on professional design software, uneven
      peripheral drivers, and security/certification claims that are not
      independently benchmarked persist as open diligence items across the line.
    claimRefs: [CE032, CE033, CE030, CE035]
