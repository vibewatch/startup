company:
  name: Kylinsoft
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Kylinsoft ships a layered operating-system portfolio: the commercial Galaxy
    Kylin V11 desktop and server editions (released 26 August 2025 as the first
    commercial OS built on the Linux 6.6 LTS kernel), the OpenAtom-governed
    openKylin community distribution (2.0 SP2, 2026), and embedded/industrial and
    smart-connected variants. The technical centrepiece is the new "Panshi"
    (Rock, 磐石) architecture — an immutable base system plus the KARE
    compatibility layer and the Kaiming package format ("build once, run across
    versions") — paired with an AI subsystem, the WLCOM display framework, a
    dual-system intrinsic-security model, and deep adaptation to domestic CPUs
    (Phytium, Kunpeng, Loongson, Hygon, Zhaoxin, Sunway) and NPUs. Maturity is
    real in mission-critical server and party-government desktop deployments, but
    differentiation rests heavily on certification, security integration and
    state ecosystem reach rather than autonomous kernel IP, and the portfolio
    inherits Linux/Wayland upstream dependencies, persistent Wine/peripheral
    compatibility gaps, and a 2026 Linux 6.6 LTS upstream-maintenance horizon.
sections:
  - id: portfolio-and-definition
    title: Product Portfolio and Customer Definition
    body: >-
      Kylinsoft's product is a domestic operating system delivered to two
      customer jobs: replacing Windows on government, finance and SOE desktops,
      and providing a secure, certified Linux base for mission-critical servers
      and industrial systems. The flagship is Galaxy Kylin (银河麒麟) V11, unveiled
      on 26 August 2025 at the 2025 China Operating System Industry Conference and
      positioned by chief scientist Han Naiping as the first commercial-grade OS
      built on the Linux 6.6 LTS kernel, shipped in a "fresh-experience,
      intelligent" desktop edition and a "compute-enabling, stable-secure" server
      edition. Around the commercial flagship sit openKylin (开放麒麟), the
      OpenAtom-Foundation-governed open-source community distribution whose 2.0
      SP2 release landed in 2026, plus embedded, industrial and the
      "Kylin 100" smart-connected line aimed at IoT and edge scenarios — though
      Kylin 100 has limited public technical disclosure and is treated here as a
      company-claimed roadmap item. Supporting assets include the Kylin SDK
      (2,200+ developer interfaces in V11), the Kylin App Store, the Kylin Tianyu
      (天御) security-domain management platform, and the UKUI desktop environment
      shared with openKylin. Maturity differs sharply across the line: Galaxy
      Kylin V11 desktop and server are generally available and field-proven at
      scale, openKylin 2.0 SP2 is a shipping community build with a 3.0 Alpha in
      May 2026, while the industrial/smart-connected variants are earlier-stage
      and less documented.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE007, CE008, CE036]
    tableRefs: [TE001]
    figureRefs: [FE001]
  - id: architecture-and-mechanism
    title: Architecture and Operating Mechanism
    body: >-
      Galaxy Kylin V11 is built on the Linux 6.6 LTS kernel with more than 120
      self-developed kernel features, and introduces the Panshi (Rock, 磐石)
      architecture as its defining technical layer. Panshi makes the core system
      immutable: the base OS and applications are decoupled, updates are atomic
      and roll-back-safe (using OSTree-style deployment), and two companion
      technologies — the KARE compatibility environment and the Kaiming (开明)
      package format — preserve the existing application ecosystem on top of the
      immutable base, delivering "build once, run across versions" portability.
      On openKylin 2.0 SP2 the same Panshi stack ships enabled by default,
      composed of an immutable system, KARE 3.0 (switched to the lightweight CRUN
      container engine), and the Kaiming package format restructured to a
      base+runtime+app model. Above the base sits the self-developed WLCOM
      (Kylin-WLCOM) display framework, compatible with both X11 and Wayland, which
      Kylinsoft credits for lossless HD video and hundred-window smoothness. An
      AI subsystem and AI assistant provide one-key wake, scheduling of local and
      cloud compute, local image/text generation, and a "compute-sharing"
      capability that pools local and cloud power and targets domestic NPUs such
      as Ascend and Cambricon; openKylin 2.0 SP2 integrates DeepSeek, Tongyi
      Qianwen and SenseTime models with an installable on-device Qwen2.5-3B for
      offline use. The architecture is multi-arch by design, adapting Phytium,
      Kunpeng, Loongson (LoongArch), Hygon, Zhaoxin and Sunway processors plus
      domestic GPUs, but it remains a downstream Linux distribution: the kernel,
      Wayland, container engines and much of userspace are upstream open-source
      components, which bounds Kylinsoft's autonomous-IP claims.
    claimRefs: [CE009, CE010, CE011, CE012, CE013, CE014, CE015, CE016, CE017, CE018, CE037]
    tableRefs: [TE003]
    figureRefs: [FE002, FE003]
  - id: deployment-roadmap-differentiation
    title: Deployment, Roadmap and Differentiation
    body: >-
      In deployment, Galaxy Kylin is a packaged, certified OS sold with paid
      support, migration tooling and a partner ecosystem rather than as a
      self-service download. Kylinsoft reports a single state-owned bank running
      100,000-plus seats, cumulative deployments above 20 million sets, more than
      70,000 served organizations, 14 consecutive years as China's top Linux by
      installed base, and use in national aerospace programs (Tianwen Mars,
      space-station, Chang'e) with over 100,000 hours of fault-free operation.
      The server edition adds AI-environment auto-configuration, online/offline
      workload co-location to raise utilization, a high-performance user-space
      network stack, and an MPTCP multi-path tool aimed at latency-sensitive
      securities-trading workloads. The roadmap is anchored by the August 2025
      V11 launch, the 2026 openKylin 2.0 SP2 release and a 3.0 Alpha in May 2026,
      and certification milestones including being the first Linux 6.6-kernel OS
      to pass China's Operating-System Government-Procurement Requirement Standard
      and a 2026 CITE innovation award. Differentiation rests on four pillars:
      security and certification depth, the deepest domestic hardware/software
      ecosystem (first domestic OS past one million adaptations, 7 million-plus
      total), the integrated Panshi+AI+security stack, and state ownership/CEC
      channel reach. The diligence caveat is that none of these pillars is a
      defensible kernel-level technology moat: UnionTech matches desktop breadth,
      openEuler underpins the server root, and the "build once run cross-version"
      and AI features are productization of upstream and third-party model
      technology.
    claimRefs: [CE019, CE020, CE021, CE022, CE023, CE024, CE025, CE026, CE027, CE038]
    tableRefs: [TE002, TE005]
    figureRefs: [FE004]
  - id: security-compliance-quality
    title: Security, Compliance and Quality Controls
    body: >-
      Security is Kylinsoft's primary stated differentiator. Galaxy Kylin V11
      advertises a "secure-trusted intrinsic dual-system architecture" spanning
      hardware, system and application layers with real-time threat monitoring,
      virus scanning and self-healing, plus a programmable security framework
      (KSAF) and two-factor authentication for layered static-and-dynamic policy.
      File-level controls include a file protection box, anti-screenshot, encrypted
      file transfer and a file shredder, with whole-lifecycle protection across
      app listing, installation, update and removal, governed through the Kylin
      Tianyu (天御) security-domain management platform with graded policy
      enforcement for enterprise endpoint control. The system adds AI-model
      security that aims to block model poisoning and jailbreak attempts in real
      time and to redact sensitive output. Compliance positioning leans on China's
      classified-protection (等保) and commercial-cryptography (商密) regimes and on
      being the first Linux 6.6-kernel OS certified against the government
      procurement requirement standard. The diligence gaps are that specific
      certification levels, scopes and dates are not consistently published in
      English-accessible sources, the dual-system and AI-security claims are
      vendor-stated rather than independently benchmarked, and recurring external
      criticism of domestic OSes — "shell-OS/套壳" doubts about kernel autonomy,
      30-50% Wine performance loss on professional design software, and uneven
      peripheral-driver coverage — applies to Kylinsoft's portfolio and is not
      resolved by its security messaging.
    claimRefs: [CE028, CE029, CE030, CE031, CE032, CE033, CE034, CE035]
    tableRefs: [TE004]
    figureRefs: []
