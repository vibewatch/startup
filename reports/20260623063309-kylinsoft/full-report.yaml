      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Mandated demand, narrow base
            body: >-
              Kylinsoft's market is a guaranteed multi-year substitution program inside government and SOEs, but
              penetration outside the mandate is minimal, so the durable opportunity is large in policy terms yet narrow
              in free-market terms.
            calloutType: insight
            claimRefs:
              - CM013
              - CM022
              - CM032
          - type: callout
            title: Denominator ambiguity
            body: >-
              Headline TAM figures span from ~10 billion yuan (Xinchuang OS) to 1.8 trillion yuan (whole Xinchuang
              stack); choosing the wrong denominator can overstate Kylinsoft's runway by two orders of magnitude.
            calloutType: risk
            claimRefs:
