      - number: '1.2'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              Kylinsoft's governance reflects its status as a centrally administered state asset rather than a
              founder-led startup. The chairman and Communist Party secretary is Chen Zhihua (谌志华), who concurrently
              chairs the parent China National Software & Service Co.; this dual mandate tightly aligns Kylinsoft's
              strategy with CSS and ultimately CEC, but concentrates decision rights in a single party-appointed leader
              and creates evident key-person and political-alignment dependency. The general manager (CEO) is Kong
              Jinzhu (孔金珠), a long-time core developer of the Galaxy Kylin operating system who leads R&D, ecosystem
              build-out and the domestic- substitution push. Because Kylinsoft is unlisted and state-controlled, the
              board, independent directors and full executive roster are not publicly disclosed to the degree expected
              of a venture-funded company, and there is no founder equity or classic founder-market-fit narrative;
              instead, governance authority flows from SASAC through CEC and CSS. Strategic direction — kernel choices,
              ecosystem funding, procurement positioning — is set in coordination with the parent group and national
              industrial policy. The leadership's deep technical pedigree in secure OS development is a genuine
              strength, but the opacity of the wider management bench and the single-chair concentration are material
              governance diligence items.
            claimRefs:
              - CO016
              - CO017
              - CO018
              - CO001
