      - number: '8.5'
        title: Exit Readiness, Kill Triggers, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is moderate and improving but indirect. The clearest liquidity path is a domestic public
              listing — either a STAR Market IPO mirroring UnionTech's audit-and-restructure track or continued value
              crystallization inside listed parent CSS — but no Kylinsoft filing exists, so a near-term arm's-length
              exit is unconfirmed and state ownership constrains control transfers. The thesis breaks on four
              monitorable triggers: a loosening or successor-gap in Xinchuang procurement mandates; new US export
              controls that choke the Phytium/Kunpeng/Loongson silicon the OS certifies against; a credible "套壳" or
              security finding that damages certification standing; or standalone disclosure showing a
              government-subsidy share of profit above ~50%. Each trigger maps to a concrete valuation action, from
              re-rating the multiple down to walking away. The three priority diligence asks that gate the
              recommendation are: audited standalone Kylinsoft financial statements (to verify the single consolidated
              revenue line and cash position); a reconciliation of net profit to government grants and tax incentives
              (to test organic profitability); and a market-tested valuation reference or updated appraisal with the
              full capital-increase agreement (to underwrite the 8.355 billion yuan mark). Until those are answered, the
              asset is a high-conviction strategic hold for the state and a track-and-monitor for an independent
              investor.
