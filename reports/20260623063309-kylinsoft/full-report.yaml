chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Structure, and Products
        blocks:
          - type: paragraph
            body: >-
              Kylinsoft Co., Ltd. (麒麟软件有限公司, also rendered "Kylin Software") is a Chinese developer of secure,
              domestically controlled operating systems headquartered in the Binhai High-Tech Zone of Tianjin. It sits
              inside a fully state-owned ownership chain: China Electronics Corporation (CEC), China's largest
              state-owned electronic-information group, controls the Shanghai-listed China National Software & Service
              Co. (CSS, 600536), which is Kylinsoft's controlling shareholder. The company is the consolidation vehicle
              for China's two historically dominant secure-OS lineages — the Galaxy Kylin (银河麒麟) line that traces to
              National University of Defense Technology research begun in 2001 under the 863 Program, and the NeoKylin /
              Zhongbiao Kylin desktop line from China Standard Software. Kylinsoft's predecessor, Tianjin Kylin
              Information Technology Co., was established in December 2014 as a joint CEC/Tianjin strategic deployment;
              in February 2020 Tianjin Kylin absorbed China Standard Software through a share swap and was renamed
              Kylinsoft, holding its founding conference on 20 March 2020. Its product portfolio spans server, desktop,
              embedded and Internet-of-Everything operating systems, marketed under the Galaxy Kylin, NeoKylin and
              Starlight Kylin brands, plus the openKylin open-source community edition and the newer Kylin 100 Smart
              Connected OS. Revenue comes from licensing, support/maintenance contracts and government and
              state-enterprise procurement, making the company a core instrument of China's "Xinchuang" IT-localization
              drive.
