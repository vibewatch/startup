      - number: '2.2'
        title: Sizing the Opportunity
        blocks:
          - type: paragraph
            body: >-
              Sizing must use multiple lenses because boundary definitions vary widely. At the broadest level, the full
              Xinchuang industry (chips, OS, database, middleware, applications) is projected to reach about 1.8
              trillion yuan by 2026 at roughly a 28.5% compound rate, with 2025 already above 1.5 trillion yuan; some
              analysts cite 2.2 trillion yuan, illustrating the dispersion. The operating-system slice is far smaller:
              China's total OS market (PC plus server) is estimated near 45 billion yuan in 2025, split roughly 25
              billion yuan server and 20 billion yuan desktop. The directly addressable Xinchuang OS market —
              party-government plus the eight key regulated industries — is estimated at only about 9.75 to 20.5 billion
              yuan per year, growing 30%+, with the Xinchuang server segment near 5.75 billion yuan (≈1.15M units) and
              the Xinchuang PC segment near 4 billion yuan (≈8M units). Against these, Kylinsoft's own 2024 revenue of
              roughly 1.44 billion yuan implies it already captures a meaningful share of the addressable Xinchuang OS
              spend, but a tiny fraction of the broad OS or Xinchuang totals. The wide gap between the 45-billion-yuan
              OS lens and the 10-to-20-billion-yuan Xinchuang OS lens is itself a key diligence flag about which
              denominator applies.
            claimRefs:
              - CM002
              - CM003
