  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Customer Definition
        blocks:
          - type: paragraph
            body: >-
              Kylinsoft's product is a domestic operating system delivered to two customer jobs: replacing Windows on
              government, finance and SOE desktops, and providing a secure, certified Linux base for mission-critical
              servers and industrial systems. The flagship is Galaxy Kylin (银河麒麟) V11, unveiled on 26 August 2025 at the
              2025 China Operating System Industry Conference and positioned by chief scientist Han Naiping as the first
              commercial-grade OS built on the Linux 6.6 LTS kernel, shipped in a "fresh-experience, intelligent"
              desktop edition and a "compute-enabling, stable-secure" server edition. Around the commercial flagship sit
              openKylin (开放麒麟), the OpenAtom-Foundation-governed open-source community distribution whose 2.0 SP2
              release landed in 2026, plus embedded, industrial and the "Kylin 100" smart-connected line aimed at IoT
              and edge scenarios — though Kylin 100 has limited public technical disclosure and is treated here as a
              company-claimed roadmap item. Supporting assets include the Kylin SDK (2,200+ developer interfaces in
              V11), the Kylin App Store, the Kylin Tianyu (天御) security-domain management platform, and the UKUI desktop
              environment shared with openKylin. Maturity differs sharply across the line: Galaxy Kylin V11 desktop and
              server are generally available and field-proven at scale, openKylin 2.0 SP2 is a shipping community build
              with a 3.0 Alpha in May 2026, while the industrial/smart-connected variants are earlier-stage and less
              documented.
