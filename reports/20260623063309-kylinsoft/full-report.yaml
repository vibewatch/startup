              billion yuan via a non-public agreement, and qualified external investors subscribed up to 1 billion yuan
              through a public listing on the Shanghai United Assets and Equity Exchange, at a price based on a Beijing
              Zhongtonghua appraisal valuing 100% of Kylinsoft equity at 8.355 billion yuan as of 31 December 2023
              (filed with state-asset regulators). The round closed by 30 June 2025, lifting CSS's stake from 40.25% to
              47.23% (with a fallback path to 51.79% had only the parent subscribed). The external 1 billion yuan
              tranche was led by the Greater Bay Area fund and joined by China Mobile Capital, Sinopec Capital, CCB
              Investment, the China Internet Investment Fund, Tianjin's Haihe Industrial Fund and CEC-affiliated
              vehicles — a roster that is almost entirely state capital. Because the company is profitable (502 million
              yuan net in 2024), it is not burning cash in the venture sense, and no material third-party debt or
              project-finance obligation is disclosed; effective runway is underwritten by the state parent. Public
              traction metrics are operational rather than financial — 16-million-plus cumulative deployments,
              210,000-plus served organizations, ~70% party-government desktop share — and the next financing trigger
