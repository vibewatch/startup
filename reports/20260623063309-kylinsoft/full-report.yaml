      - number: '7.3'
        title: Operational, Technical, and Ecosystem Risk
        blocks:
          - type: paragraph
            body: >-
              Operationally Kylinsoft ships a mature, certified product, but its technical risks are those of a
              downstream distribution. Galaxy Kylin V11 is built on the Linux 6.6 LTS kernel; that branch's upstream
              maintenance was scheduled to end in December 2026 but was extended to end-2027, so the immediate
              end-of-life cliff has eased while the structural dependency on upstream maintainers remains. Hardware
              enablement, security fixes and driver coverage are inherited from upstream and from domestic-CPU vendors,
              which fragments testing across at least six instruction-set targets (x86 via Zhaoxin/Hygon, ARM via
              Phytium/Kunpeng, LoongArch via Loongson) and produces the recurring field complaints — drivers that will
              not install, unstable application compatibility — reported during Xinchuang migrations. The application
              ecosystem, though growing, remains far thinner than Windows for professional design, engineering and
              gaming software, and peripheral driver coverage is uneven. The "套壳" critique — that the differentiation is
              integration and UI rather than kernel-level innovation — is partially conceded by the company's own
              documentation that the system is Linux-based, and is a reputational and procurement-credibility risk if
              localization criteria tighten toward genuine root-technology autonomy. Operational continuity risk is
              otherwise low: the product is field-proven in banks, grids and aerospace deployments.
            claimRefs:
              - CR018
              - CR019
              - CR020
              - CR021
              - CR022
              - CR023
              - CR024
              - CR025
              - CR026
