      - number: '1.3'
        title: Funding, Valuation, and Financial Snapshot
        blocks:
          - type: paragraph
            body: >-
              In June 2025 Kylinsoft completed a capital increase raising 3 billion yuan (about $417 million), one of
              the larger domestic-software equity events of the year. The round comprised 2 billion yuan from
              controlling shareholder China National Software, subscribed via non-public agreement, and 1 billion yuan
              from qualified strategic investors selected through an on-exchange process. The strategic tranche was led
              and organised by the Greater Bay Area Fund and included China Mobile Capital, Sinopec Capital, CCB
              Investment, CSSC Capital, Huihua Fund, Haihe Industrial Fund, the China Internet Investment Fund and
              Binhai New Area technology-finance vehicles. The deal lifted CSS's stake by roughly 17.6 points to 47.23%.
              Pricing rested on a SASAC-filed appraisal that valued Kylinsoft's total equity at 8.355 billion yuan as of
              31 December 2023, making the company Tianjin's first unicorn of 2025. Underlying public financials are
              unusually thin for a company of this profile: a disclosure tied to the raise put 2024 revenue at 1.438
              billion yuan and net profit at 502 million yuan, and 2025 registered capital rose to 302 million yuan.
              Cash, burn, current run-rate and the use-of-proceeds split across mobile/fixed terminals, cloud servers
              and embedded systems are not granularly disclosed, so several cover metrics are carried as gaps with
              explicit diligence paths.
