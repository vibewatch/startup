      - number: '7.4'
        title: Partner, Dependency, and Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              Kylinsoft's dependency graph is unusually concentrated on the state. Its controlling shareholder and
              capital provider is China National Software, itself controlled by CEC, so ownership, distribution channel,
              key-customer sponsorship and a large share of equity funding all route through a single state group — a
              concentration that is stabilizing in the current policy regime but a single point of failure if state
              priorities shift. Technically the portfolio depends on the upstream Linux kernel community and the
              OpenAtom Foundation (for openKylin governance), neither of which Kylinsoft controls, and on a handful of
              domestic CPU vendors whose own roadmaps are export-control constrained. Commercially, demand is
              concentrated in party-government, finance, telecom and energy buyers procuring under mandate, with the
              company itself acknowledging negligible private-sector and individual-consumer penetration; this customer
              concentration means the installed base is durable only as long as the mandate persists. Competitive
              multi-homing compounds the dependency: large buyers routinely qualify both Kylin and UnionTech UOS (and
              increasingly Huawei openEuler/HarmonyOS), so Kylinsoft does not have exclusive lock on its own protected
              market and competes on adaptation depth and certification rather than switching cost alone.
            claimRefs:
