      - number: '5.4'
        title: Security, Compliance and Quality Controls
        blocks:
          - type: paragraph
            body: >-
              Security is Kylinsoft's primary stated differentiator. Galaxy Kylin V11 advertises a "secure-trusted
              intrinsic dual-system architecture" spanning hardware, system and application layers with real-time threat
              monitoring, virus scanning and self-healing, plus a programmable security framework (KSAF) and two-factor
              authentication for layered static-and-dynamic policy. File-level controls include a file protection box,
              anti-screenshot, encrypted file transfer and a file shredder, with whole-lifecycle protection across app
              listing, installation, update and removal, governed through the Kylin Tianyu (天御) security-domain
              management platform with graded policy enforcement for enterprise endpoint control. The system adds
              AI-model security that aims to block model poisoning and jailbreak attempts in real time and to redact
              sensitive output. Compliance positioning leans on China's classified-protection (等保) and
              commercial-cryptography (商密) regimes and on being the first Linux 6.6-kernel OS certified against the
              government procurement requirement standard. The diligence gaps are that specific certification levels,
              scopes and dates are not consistently published in English-accessible sources, the dual-system and
              AI-security claims are vendor-stated rather than independently benchmarked, and recurring external
              criticism of domestic OSes — "shell-OS/套壳" doubts about kernel autonomy, 30-50% Wine performance loss on
              professional design software, and uneven peripheral-driver coverage — applies to Kylinsoft's portfolio and
