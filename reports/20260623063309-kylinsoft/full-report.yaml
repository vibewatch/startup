      - number: '3.2'
        title: Capability, Pricing, and Go-to-Market Comparison
        blocks:
          - type: paragraph
            body: >-
              On capability, the field segments cleanly by workload. Galaxy Kylin leads mission-critical reliability —
              claiming 99.9999%-class availability, industry-leading number of EAL4/等保四级 security certifications, and
              reference deployments in space missions, power-grid dispatch and core bank transaction gateways — and
              operates the deepest ecosystem, with adaptation counts approaching ten million (roughly 7.36 million
              software plus one million hardware) and 2,200+ Kylin SDK developer interfaces. UnionTech UOS leads desktop
              user experience: its Deepin Desktop Environment closely mimics Windows 10, cutting reported migration
              training time from days to hours, and it carries 15,000+ native applications and the largest
              software/hardware adaptation total (10M+). openEuler leads server and cloud-native breadth but is a
              community root rather than a turnkey distribution, so enterprises adopt a commercial derivative (Kylin,
              UOS, or KylinSec) for SLA support. On pricing, all domestic vendors monetize through perpetual or
              subscription licensing plus paid support and migration services rather than published list prices; deals
              are won through government and SOE procurement tenders, and one source flags that subscription licensing
              has triggered compliance disputes in some provincial budget reviews. On go-to-market, Kylin reaches buyers
              through China Electronics' state channels and party-government mandates, UOS through faster-growing
              commercial, education and telecom desktop migrations, openEuler through its 2,100+-member community
              feeding downstream commercial distros, and HarmonyOS through Huawei's hardware installed base. The result
              is heavy multi-homing: large government buyers routinely certify and deploy both Kylin and UOS, limiting
              any single vendor's pricing power.
