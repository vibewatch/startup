  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base and Segmentation
        blocks:
          - type: paragraph
            body: >-
              Kylinsoft sells to the buyers, users and payers created by China's Xinchuang localization mandate, where
              the procuring entity (a ministry, SOE, bank or hospital) is typically also the user, and budget flows from
              state or sector IT-localization programs rather than discretionary commercial spend. The base segments by
              vertical into eight principal clusters: party-government administration (the anchor segment, where Galaxy
              Kylin holds roughly 70% desktop share); finance and state-owned banks; the three telecom carriers (China
              Mobile, China Telecom, China Unicom); energy and power grids (State Grid, China Southern Power Grid);
              healthcare; education; transportation; and aerospace/defense. Geographically the base is overwhelmingly
              domestic, concentrated in central ministries and provincial governments and in SOE headquarters, with
              channel delivery through certified system integrators and "Kylin Partner" hardware OEMs rather than direct
              self-service. Adoption is staged through the national "2+8+N" rollout — two core party-government
              scenarios, eight priority regulated industries (finance, energy, telecom, transport, education,
              healthcare, aerospace, and others), and an N-tail of broader sectors — which structures both who buys and
              in what sequence. The segmentation is strategically valuable but commercially narrow: the highest-value,
              most durable demand sits in mandated sectors, while the open private market (manufacturing, internet,
              consumer) remains lightly penetrated and is the principal growth question.
            claimRefs:
