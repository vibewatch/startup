              In deployment, Galaxy Kylin is a packaged, certified OS sold with paid support, migration tooling and a
              partner ecosystem rather than as a self-service download. Kylinsoft reports a single state-owned bank
              running 100,000-plus seats, cumulative deployments above 20 million sets, more than 70,000 served
              organizations, 14 consecutive years as China's top Linux by installed base, and use in national aerospace
              programs (Tianwen Mars, space-station, Chang'e) with over 100,000 hours of fault-free operation. The
              server edition adds AI-environment auto-configuration, online/offline workload co-location to raise
              utilization, a high-performance user-space network stack, and an MPTCP multi-path tool aimed at
              latency-sensitive securities-trading workloads. The roadmap is anchored by the August 2025 V11 launch, the
              2026 openKylin 2.0 SP2 release and a 3.0 Alpha in May 2026, and certification milestones including being
              the first Linux 6.6-kernel OS to pass China's Operating-System Government-Procurement Requirement Standard
              and a 2026 CITE innovation award. Differentiation rests on four pillars: security and certification depth,
              the deepest domestic hardware/software ecosystem (first domestic OS past one million adaptations, 7
              million-plus total), the integrated Panshi+AI+security stack, and state ownership/CEC channel reach. The
              diligence caveat is that none of these pillars is a defensible kernel-level technology moat: UnionTech
              matches desktop breadth, openEuler underpins the server root, and the "build once run cross-version" and
              AI features are productization of upstream and third-party model technology.
