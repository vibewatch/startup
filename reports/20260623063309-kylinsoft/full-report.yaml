      - number: '6.4'
        title: Expansion, Concentration and Procurement Risk
        blocks:
          - type: paragraph
            body: >-
              Expansion runs along two axes. Within mandated accounts, Kylinsoft lands a beachhead (desktop or one core
              system) and expands across systems, sites and to the server edition — the Ruijin OA-to-Patient-360 and
              Jiangdu full-stack OA patterns illustrate land-and-expand. Across the market, the "2+8+N" program widens
              the addressable base from party-government into the eight priority industries and then the long tail, and
              the OEM partner program (China Greatwall, Lenovo Kaitian and others) broadens hardware reach. The
              countervailing concern is concentration. Demand is heavily dependent on government and SOE procurement
              under policy mandate; private- sector and especially manufacturing/internet adoption is comparatively low,
              and analysts repeatedly characterize the model as "living off government" with limited market-driven pull.
              This creates three concentration risks: a policy/budget risk if Xinchuang spending tightens or shifts from
              "hard replacement" to "soft compatibility"; a buyer-type risk where a few state channels dominate revenue;
              and a procurement-friction risk, since sole-source-style localization tenders can attract pricing scrutiny
              and occasional subscription-compliance queries at provincial level. The net assessment is a high-quality
              but narrowly based customer franchise whose durability is real inside the mandate and unproven outside it.
