  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing, and Mix
        blocks:
          - type: paragraph
            body: >-
              Kylinsoft monetizes a portfolio of operating systems through four interlocking streams: perpetual or term
              software licensing (per-seat for desktop editions such as Galaxy Kylin, per-socket/per-node for server
              editions), recurring support and maintenance subscriptions, paid customization and Windows-to-Kylin
              migration services, and an ecosystem/partner program anchored by a 500 million yuan "Kylin Partner 5.0"
              fund that subsidizes ISV and hardware adaptation. Demand is overwhelmingly channeled through government
              and state-owned-enterprise procurement tenders rather than published price lists, so realized pricing is
              opaque and volume-tender-driven. The disclosed financial envelope is profitable and growing: parent China
              National Software (CSS, Shanghai 600536) reported Kylinsoft 2024 revenue of 1.438 billion yuan and net
              profit of 502 million yuan, and third-party 2025 figures put revenue at roughly 1.632 billion yuan (up
              about 13.5%) and net profit near 550 million yuan. However, the revenue mix across desktop, server,
              embedded, industrial and intelligent-computing lines — and the split between license, subscription and
              services — is not publicly broken out, and the figures reach the market only as a single consolidated line
              inside CSS disclosures rather than audited standalone Kylinsoft statements. The implied ~35% net margin is
              high for an OS vendor and likely reflects both genuine software economics and an undisclosed
              government-subsidy and tax-incentive component that cannot be isolated from public data.
