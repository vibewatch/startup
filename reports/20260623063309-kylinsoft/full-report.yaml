      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The dominant growth driver is policy: a SASAC directive requires central state-owned enterprises to reach
              100% Xinchuang substitution by 2027, and party-government core systems are targeted for full localization
              by the end of 2025, guaranteeing multi-year mandated demand. Secondary drivers include national-security
              and self-controllable imperatives amid US-China tech tensions, the digital-China / new-infrastructure
              investment cycle, and the October 2025 Windows 10 end-of-life that strands hardware and creates a
              migration moment. The constraints are equally concrete and partly adverse. Ecosystem and application gaps
              persist — professional industry software, developer toolchains and peripheral compatibility lag Windows —
              and legacy migration friction slows full replacement. Critically, adoption remains heavily
              mandate-dependent: outside government and regulated SOEs, private and consumer demand is thin, so the
              market's growth is administratively created rather than competitively won, leaving vendors exposed to any
              change in procurement intensity or budget. Windows still holds 70-80% of China's desktop base, macOS about
              13%, and Linux including domestic builds only about 1.2-3.4%, underscoring how far real-world penetration
              trails the government-sector headline figures. These contradictions and the divergent sizing denominators
              are preserved as explicit diligence gaps.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM015
              - CM021
              - CM022
              - CM023
              - CM031
              - CM032
              - CM038
          - type: table
            tableRef: TM004
