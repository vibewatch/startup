  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Overview
        blocks:
          - type: paragraph
            body: >-
              Ranked by residual exposure, Kylinsoft's risks cluster into four bands. The top band is geopolitical and
              policy-structural: CEC's Entity-List status and the broader US-China technology war constrain the
              domestic-silicon supply chain the OS must run on, while the company's revenue depends on the durability of
              state procurement mandates rather than competitive demand. The second band is technical-dependency risk:
              the portfolio is a downstream Linux distribution, so its security, hardware enablement and roadmap inherit
              the GPLv2 Linux kernel and the Linux 6.6 LTS support window, and any lapse in upstream tracking or a "套壳"
              credibility shock would erode the autonomy narrative that justifies the premium. The third band is
              commercial and ecosystem risk: low private-sector penetration, application and peripheral compatibility
              gaps, fragmentation across six-plus domestic CPU architectures, and head-to-head multi-homing against
              UnionTech UOS and Huawei's openEuler/ HarmonyOS leave the installed base policy-protected but not
              market-proven. The fourth band is financial-disclosure risk: a loss-making listed parent, undisclosed
              standalone accounts, an appraisal-based valuation, and an unquantified government-subsidy share of profit.
              Likelihood is highest for the ecosystem and disclosure risks (already realized in part) and lower but
              higher-impact for an abrupt geopolitical or policy shift. Mitigation maturity is strongest on
              certification and least developed on private-market diversification and disclosure transparency.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR009
              - CR018
              - CR035
      - number: '7.2'
        title: Regulatory, Legal, and Geopolitical Risk
        blocks:
          - type: paragraph
            body: >-
              The defining external risk is geopolitical. CEC, Kylinsoft's ultimate state owner through China National
              Software, is designated on the US Commerce Department's Entity List, and successive 2024-2026 Bureau of
              Industry and Security rules have tightened controls on advanced chips and semiconductor tooling reaching
              Chinese state-electronics groups, including Foreign Direct Product Rule extensions. This restricts the
              leading-edge silicon and EDA tooling available to the domestic CPUs (Phytium, Kunpeng, Loongson) that
              Kylin certifies against, indirectly capping the performance ceiling of the hardware-plus-OS stack.
              Legally, the entire portfolio is a derivative of the GPLv2 Linux kernel: Kylinsoft must distribute
              corresponding source for kernel modifications and cannot impose additional restrictions, which both
              constrains proprietary lock-in and underpins recurring "套壳" criticism that the system is a customized
              Linux rather than autonomous IP. Domestically the regulatory backdrop is a tailwind that doubles as a
              dependency: the Cybersecurity Law, Data Security Law, classified-protection (等保) regime, Critical
              Information Infrastructure rules and the Xinchuang procurement framework mandate secure-and-controllable
              domestic software in party-government, finance, telecom and energy systems. That demand is
              administratively created, so a change in procurement policy, certification criteria, or the political
              priority attached to Made-in-China-2025-style localization targets is itself a regulatory risk to the
              revenue base.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
