companyProfile:
  summary: >-
    Kylinsoft (麒麟软件有限公司) is China's leading developer of domestic operating systems and the national champion of the
    Xinchuang technology-autonomy drive. Controlled by China National Software (CSS, 600536), itself a subsidiary of
    state group China Electronics Corporation (CEC), it builds the commercial Galaxy Kylin family for government and
    critical-infrastructure buyers, the openKylin open-source community OS governed under the OpenAtom Foundation, and
    the Kylin 100 smart-connected OS for industrial and IoT use. It is the fourteen-year leader of China's Linux market
    with more than 16 million deployments. In June 2025 it raised 3 billion yuan at an 8.355 billion yuan appraisal,
    becoming Tianjin's first domestic-OS unicorn.
  foundedDate: '2020-02-01'
  founders:
    - name: China Electronics Corporation (CEC)
      role: State parent / founding sponsor
      background: >-
        Formed Kylinsoft in February 2020 by merging Tianjin Kylin Information Technology with China Standard Software
        under its software subsidiary.
      claimRefs:
        - CO004
        - CO005
  foundingLocation: Tianjin, China
  headquarters: Tianjin, China (with Guangdong presence)
  productSummary: >-
    Operating systems sold as per-seat (desktop) and per-socket/per-node (server) licenses plus support subscriptions
    and migration services: Galaxy Kylin V11 (Linux 6.6-based, with the Panshi immutable architecture and an integrated
    security and AI stack), the openKylin community OS, and the Kylin 100 smart-connected OS. Certified across domestic
    CPUs (Phytium, Kunpeng, Loongson, Hygon, Zhaoxin).
  customerFocus: >-
    Party-government ministries, state-owned banks, telecom carriers, energy/grid operators and SOEs procuring under
    domestic-substitution mandates; negligible private-sector and consumer penetration.
  businessModel: >-
    OS licensing, support and maintenance subscriptions, customization/migration services and an ecosystem/partner
    program, sold overwhelmingly through mandated government and SOE procurement tenders rather than published pricing.
  stage: Late-stage / state-backed private
  fundingStatus: >-
    3 billion yuan equity increase closed June 2025 (2 billion from parent CSS plus 1 billion from a state-investor
    syndicate led by the Greater Bay Area Fund) at an 8.355 billion yuan end-2023 appraisal; parent stake rose from
    40.25% to 47.23%.
