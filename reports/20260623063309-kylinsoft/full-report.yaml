  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Kylinsoft's core market is China's domestic operating-system industry, the basic-software layer of the
              national "Xinchuang" (信息技术应用创新) IT-application-innovation program that aims to replace foreign hardware
              and software across government and critical industries. The included spend is paid OS licensing,
              maintenance and support across desktop, server, embedded and intelligent-terminal deployments inside
              party-government bodies, state-owned enterprises, banks, telecom operators and other regulated sectors.
              Excluded from the served market is the large consumer and private commercial PC base, which remains
              Windows-centric and outside procurement mandates. The status-quo substitutes Kylinsoft displaces are
              Microsoft Windows on the desktop and international Linux distributions (Red Hat, SUSE, Ubuntu) plus Unix
              on servers; in China's server market domestic Linux now ships roughly ten times the volume of
              international brands, while foreign vendors have been pushed to the margins by self-controllable
              requirements. Adjacent layers in the same full-stack Xinchuang push — domestic CPUs (Loongson, Kunpeng,
              Phytium), databases, middleware and application software — are complementary spend that shapes OS
              compatibility requirements but is not OS revenue. The market is therefore best understood as an
              administratively bounded substitution market rather than an openly contested one.
            claimRefs:
              - CM001
              - CM016
              - CM017
              - CM018
              - CM029
              - CM035
