      - number: '8.4'
        title: Bull / Base / Bear Scenarios and Valuation Range
        blocks:
          - type: paragraph
            body: >-
              The base case assumes the Xinchuang mandate persists through the late-2020s, revenue compounds at the
              disclosed low-teens rate, the ~35% margin holds with a modest subsidy tail, and the multiple stays in the
              peer 4-5x band; that supports a valuation of roughly 8-10 billion yuan, essentially validating the
              appraisal mark. The bull case adds genuine private-sector and overseas traction, AI-OS and smart-connected
              (Kylin 100) monetization, and a re-rating toward 6-8x on UOS-style growth optics or an eventual public
              listing, lifting value to roughly 12-18 billion yuan. The bear case is a loosening of procurement mandates
              or a successor-policy gap after 2025 targets, intensified multi-homing with UOS and HarmonyOS, an
              export-control shock to the domestic silicon roadmap, or a disclosure event revealing subsidy-dependent
              rather than organic profit; any of these compresses the multiple to a 2-3x distressed- Xinchuang level and
              value to roughly 4-6 billion yuan. The distribution is asymmetric to the downside because the upside
              requires the company to do something it has not yet demonstrated — win unmandated demand — while the
              downside requires only that the policy tailwind it already depends on weakens. Probability signals favor
              the base case in the near term given entrenched policy, but the bear scenario's triggers are more
              controllable by external forces (US export policy, Chinese procurement policy) than by management.
            claimRefs:
              - CV027
              - CV028
              - CV029
