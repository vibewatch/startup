      - number: '3.3'
        title: Switching Costs, Lock-in, and Distribution Power
        blocks:
          - type: paragraph
            body: >-
              Switching costs in this market are high once a system is certified and deployed: application adaptation,
              hardware-driver qualification, security accreditation and user retraining create multi-year lock-in, which
              protects every incumbent's installed base — including Kylin's 20-million-plus cumulative deployments and
              210,000+ served organizations. Kylin's deepest lock-in is the integrated "PKS" stack (Phytium ARM CPUs
              plus Kylin OS plus its security subsystem) that binds party-government and defense buyers to a
              domestically controlled combination, reinforced by certification breadth. Distribution power, however, is
              concentrated in the state: procurement is mandate-driven, and China Electronics' channel access is Kylin's
              primary structural advantage rather than independent commercial demand. Two dynamics erode pricing power.
              First, multi-homing is the norm — central agencies, banks and operators qualify multiple domestic OSes to
              avoid single-vendor dependence, so Kylin and UOS frequently coexist inside the same buyer. Second, supply
              and partner access is shared: Kylin, UOS and KylinSec all build their server editions on Huawei's
              openEuler root, and all depend on the same domestic CPU vendors (Phytium, Kunpeng, Loongson, Hygon,
              Zhaoxin), so few proprietary supply advantages exist below the integration and certification layer. The
              practical implication is that competition is less about winning net-new demand — which policy guarantees —
              than about share of a mandated wallet that buyers deliberately split.
