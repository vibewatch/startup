      - number: '2.3'
        title: Buyers, Users, and Payers
        blocks:
          - type: paragraph
            body: >-
              The buyer, user and payer are frequently the same state institution, which shapes the entire go-to-market.
              The primary budget owners are party-government IT departments and the CIO/procurement functions of
              state-owned enterprises, banks, and the three telecom operators (China Mobile, China Telecom, China
              Unicom), which are among the largest server-OS buyers. Procurement is tender-driven and weighted toward
              domestic vendors, so government and SOE purchasing accounts for over 60% of domestic OS demand. Adoption
              follows the official "2+8+N" rollout: first the two party-government segments, then eight priority
              industries (finance, energy, telecom, education, healthcare, transport, etc.), then a broader "N" of
              smaller enterprises and regions. Replacement depth varies sharply by segment: party-government desktop
              substitution has reached roughly 78-80%, while finance sits near 45-50%, energy 52%, education 65%, and
              telecom 38%. Users are public-sector office workers and back-office/server operators whose familiarity
              with Windows shapes switching friction; the adoption trigger is almost always a procurement mandate or a
              security/self-control directive rather than a bottom-up technical preference. This makes the sales motion
              a policy- and relationship-led enterprise tender process, not a product-led funnel.
            claimRefs:
              - CM014
              - CM019
              - CM030
              - CM036
              - CM037
              - CM020
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
