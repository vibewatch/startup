      - number: '3.4'
        title: Moat Durability and Competitive Risk
        blocks:
          - type: paragraph
            body: >-
              Kylinsoft's durable advantages are its state ownership and CEC channel, its 14-year installed-base
              leadership in party-government and secure-server workloads, its certification depth, and the highest
              ecosystem maturity among domestic vendors. Each, however, faces a credible threat. The desktop moat is
              contested by UnionTech, which now leads on out-of-box UX and app breadth and turned its first annual
              profit (¥238M on ¥718M revenue) in 2025, growing 62% year on year versus Kylinsoft's mid-teens growth. The
              server moat is structurally capped because Galaxy Kylin server is built on Huawei's openEuler, so Kylin
              captures integration and support margin but does not own the root ecosystem and competes there with UOS
              and KylinSec on identical upstream. The long-run desktop threat is HarmonyOS PC, whose microkernel, Huawei
              hardware reach and consumer ecosystem could displace Linux-based desktops in mass-market and eventually
              government segments. Most pointedly, domestic OSes — Kylin included — face persistent "shell/套壳" criticism
              that they are second-stage customizations of Debian/Ubuntu/openEuler with limited independent kernel
              innovation, alongside documented ecosystem gaps: peripheral and printer-driver lag, professional design
              software (Adobe, AutoCAD, SolidWorks) running only through Wine with 30-50% performance loss, and slower
              kernel-level L3 support response than Red Hat that has pushed some banks to self-build support teams.
              KylinSec's 2025 swing to a net loss with negative operating cash flow illustrates that even
              certification-rich secure-OS niches struggle to commercialize. Net, Kylinsoft's moat is real but
              state-contingent and partly shared, not a proprietary technology lead.
