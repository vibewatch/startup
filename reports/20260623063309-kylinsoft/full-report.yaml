            body: >-
              Sales efficiency is structurally favorable but poorly instrumented in public data. Because Kylinsoft sells
              into a policy-mandated buyer base through China Electronics' state channels, customer-acquisition cost is
              low relative to a commercial enterprise-software vendor — demand is created by Xinchuang substitution
              mandates rather than by paid demand generation — while switching costs (certification, application
              adaptation, retraining) make the installed base sticky and support revenue durable. Gross margin is not
              disclosed, but comparable Chinese secure-OS economics imply high software-line gross margins (a listed
              peer reported OS-product gross margins above 90%), partly offset by lower-margin services and the cost of
              maintaining adaptation across eight-plus domestic CPU and seven-plus domestic GPU targets. The cost
              structure is R&D-heavy: the company frames the 2025 raise explicitly as funding sustained, high-intensity
              OS research, product- line expansion and ecosystem building, and the parent called it the first
              concentrated, large-scale cash investment in OS R&D in its 40-plus-year history. None of the canonical
              unit-economics inputs — CAC, payback period, net revenue retention, deferred-revenue balance, services
              attach rate, or revenue-per-deployment across the 16-million-plus installed base — is published, so the
              underlying customer economics must be treated as a diligence gap rather than a measured result.
