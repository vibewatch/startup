      - number: '8.2'
        title: Recommendation, Confidence, and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is TRACK / research-more at low-to-medium confidence with a high risk rating. The
              rationale is that the asset is fundamentally sound but the entry price cannot be independently
              underwritten: the 8.355 billion yuan mark is an end-2023 appraisal filed for a related-party capital
              increase, not a competitively cleared round, and the headline 47.23% stake lift and 3 billion yuan
              injection both flow from the same state group, so there is no arm's-length price discovery and no
              third-party preference or dilution structure to anchor entry. On a multiples basis the mark is defensible
              — roughly 5x trailing revenue against listed Xinchuang software peers at 3-6x and below faster-growing
              UnionTech — but multiples on mandate-driven revenue overstate quality if a material share of profit is
              subsidy. Entry discipline therefore requires a discount to the appraisal mark to compensate for non-market
              price formation, disclosure opacity and geopolitical tail risk, plus contractual information rights to
              obtain standalone accounts. For a state or strategic investor the asset is a hold/accumulate within the
              national-champion mandate; for an independent financial investor without information rights, the correct
              posture is to track pending the three gating diligence items rather than to underwrite the headline
              valuation at face value.
            claimRefs:
              - CV010
