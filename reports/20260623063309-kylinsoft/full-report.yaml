      - number: '1.4'
        title: Scale, Milestones, and Adverse Flags
        blocks:
          - type: paragraph
            body: >-
              Kylinsoft's headline traction is its installed base: Galaxy Kylin deployments exceeded 16 million sets as
              of August 2025, concentrated in government, finance, telecom, energy and education, and the company claims
              more than 70% share of China's government core-application OS market. Its software underpins national
              projects including the Chang'e lunar and Tianwen Mars programs, and the firm holds a National Science and
              Technology Progress Award. The product cadence is brisk: Galaxy Kylin V10 launched in August 2020 on Linux
              kernel 4.19; the openKylin root community opened in July 2022; Galaxy Kylin V11 — China's first commercial
              OS on the Linux 6.6 kernel, with 120+ proprietary enhancements, a new "Rock/磐石" architecture, an AI
              assistant and support for AMD, Intel, eight domestic CPUs and seven domestic GPUs — shipped on 26 August
              2025 alongside a 500-million-yuan "Kylin Partner 5.0" ecosystem fund; V11 won a CITE2026 innovation gold
              award in April 2026 and the Kylin 100 Smart Connected OS followed in May 2026. The bull case is offset by
              genuine adverse signals. The Register noted that 16 million installs is a "minuscule" share in a
              1.4-billion- person market, and flagged that the Linux 6.6 LTS base loses upstream support in December
              2026 — roughly 16 months after V11 launched — echoing Kylinsoft's earlier choice to keep V10 on an
              end-of-life 4.19 kernel. Adoption remains heavily mandate-driven rather than competitive.
