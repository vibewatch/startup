      - number: '6.3'
        title: Retention and Durability
        blocks:
          - type: paragraph
            body: >-
              Direct retention metrics — net revenue retention, gross retention, churn, renewal rates or satisfaction
              scores — are not publicly disclosed by Kylinsoft, so durability must be inferred from the structure of
              demand. In mandated party-government and regulated-industry deployments, switching costs are high: once an
              agency has migrated terminals and core systems, re-certified applications, retrained staff and adapted
              peripherals, reverting or switching vendors is costly and politically disfavored, which implies high
              de-facto retention within the installed base. The 14-year market- leadership streak, the 100,000+
              fault-free aerospace hours, and multi-year multi-system rollouts (e.g., Ruijin Hospital's staged
              OA-to-Patient-360 expansion) are consistent with durable, expanding accounts. However, three caveats
              weaken the picture: buyers deliberately multi-home Galaxy Kylin and UnionTech UOS to avoid single-vendor
              lock-in, so per-vendor share within an account can erode without the account "churning"; renewals depend
              on continued Xinchuang budget and policy, a macro variable outside Kylinsoft's control; and field
              references themselves surface persistent application-compatibility friction — CAD and Office rendering
              lag, data-loss incidents on cross-platform transfer, and uneven peripheral drivers — that could pressure
              satisfaction if not resolved. Retention is therefore structurally high but evidentially thin, and the
              absence of disclosed cohort data is itself a diligence gap.
