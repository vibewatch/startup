  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The bull thesis rests on six reinforcing facts established across this report. Kylinsoft is the
              policy-anointed leader of China's domestic-OS substitution, with roughly 70% of the party-government
              desktop segment and fourteen consecutive years atop China's Linux market; its installed base exceeds 16
              million deployments across banks, grids, telecoms and aerospace; Galaxy Kylin V11 is a modern, certified
              Linux 6.6-based stack with an integrated security and AI architecture; the company is genuinely profitable
              (about 1.6 billion yuan revenue at a ~35% net margin), unlike most venture assets; it is funded and
              de-risked by a deep-pocketed state parent that just injected 3 billion yuan; and the addressable Xinchuang
              migration still has years of mandated runway. The anti-thesis is equally structural: demand is
              administratively manufactured rather than competitively won, so the durable moat is policy, not product;
              private-sector and consumer penetration is negligible and Windows still dominates the open market; the
              portfolio is a downstream Linux distribution whose silicon supply chain is throttled by US export controls
              on CEC-affiliated CPUs; large buyers multi-home with UnionTech UOS and increasingly Huawei
              openEuler/HarmonyOS, so there is no exclusive lock even inside the protected market; and financial
              disclosure is thin, with no audited standalone statements and an unquantified government- subsidy share of
              profit. The investable question is therefore not whether Kylinsoft makes money today — it does — but
              whether that profitability is organic and durable or policy-contingent and stranded if the mandate eases.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
