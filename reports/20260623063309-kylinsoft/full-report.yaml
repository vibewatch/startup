      - number: '7.5'
        title: Financial-Model Risk, Mitigations, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              The operating company is profitable, but the financial-disclosure picture carries real underwriting risk.
              Kylinsoft's standalone accounts are not published; its results reach the market only as a segment line
              inside listed parent China National Software (CSS, 600536), which is itself loss-making — CSS reported a
              2025 net loss of about 41 million yuan (sharply narrowed from the prior year) on roughly 5.1 billion yuan
              of revenue, with party-government solution revenue declining and basic-software (the Kylin line) the main
              growth engine. R&D intensity above 22% of revenue pressures near-term margin, operating cash flow has been
              volatile at the parent, and the implied government-subsidy and tax-incentive share of Kylinsoft's ~35% net
              margin is unquantified, so true operating profitability cannot be isolated. The 8.355 billion yuan
              valuation is an end-2023 appraisal mark filed for a related-party capital increase, not a market-tested
              price. Mitigations are real but partial: deep certification and a sticky mandated base protect revenue; a
              3 billion yuan 2025 raise and positive net income fund R&D without external debt; and ecosystem programs
              are expanding the application base. The thesis breaks if procurement mandates loosen, if a credible "套壳"
              or security finding damages certification standing, if export controls choke the domestic silicon the OS
              depends on, or if standalone disclosure reveals subsidy- dependent rather than organic profitability.
              Priority diligence asks are the audited standalone accounts, the subsidy reconciliation, and a
              market-tested valuation reference.
