      - number: '8.3'
        title: Financing Context and Comparable Valuation
        blocks:
          - type: paragraph
            body: >-
              The reference set for Kylinsoft is the listed and pre-IPO Xinchuang software cohort. Its listed parent,
              China National Software (CSS, 600536), trades near 28 billion yuan of market capitalization on roughly 5.9
              billion yuan of forward revenue — about 4.8x sales — at a ~52% gross margin, having only just returned to
              breakeven. Direct OS peer UnionTech (UOS) is preparing a STAR Market IPO, was valued in the 6-10 billion
              yuan range on 2025 revenue of about 718 million yuan (up ~62%) and a first-time net profit near 239
              million yuan, implying a much richer 8-14x sales multiple that the market is willing to pay for higher
              growth and an imminent liquidity event. Broader application-software comparables bracket the range:
              Kingsoft Office trades around 16x sales on a >30% net margin, while Yonyou and Taiji sit at roughly 3-4x.
              Against this set, Kylinsoft's 8.355 billion yuan appraisal on about 1.6 billion yuan of revenue (~5x
              trailing sales) is mid-cohort — richer than the slow-growth ERP/integrator names, cheaper than UOS and
              Kingsoft — and is supported by genuine profitability that several peers lack. The caveats are that the
              Xinchuang sector has de-rated from 10-20x sales in 2020-2022 to 3-6x by 2026, that the Kylinsoft mark is
              an appraisal rather than a market round, and that its revenue is more mandate-concentrated than the
              diversified comparables, so the like-for-like multiple should arguably carry a concentration discount
              rather than a premium.
            claimRefs:
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
