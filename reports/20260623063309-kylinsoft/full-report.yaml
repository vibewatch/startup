      - number: '5.2'
        title: Architecture and Operating Mechanism
        blocks:
          - type: paragraph
            body: >-
              Galaxy Kylin V11 is built on the Linux 6.6 LTS kernel with more than 120 self-developed kernel features,
              and introduces the Panshi (Rock, 磐石) architecture as its defining technical layer. Panshi makes the core
              system immutable: the base OS and applications are decoupled, updates are atomic and roll-back-safe (using
              OSTree-style deployment), and two companion technologies — the KARE compatibility environment and the
              Kaiming (开明) package format — preserve the existing application ecosystem on top of the immutable base,
              delivering "build once, run across versions" portability. On openKylin 2.0 SP2 the same Panshi stack ships
              enabled by default, composed of an immutable system, KARE 3.0 (switched to the lightweight CRUN container
              engine), and the Kaiming package format restructured to a base+runtime+app model. Above the base sits the
              self-developed WLCOM (Kylin-WLCOM) display framework, compatible with both X11 and Wayland, which
              Kylinsoft credits for lossless HD video and hundred-window smoothness. An AI subsystem and AI assistant
              provide one-key wake, scheduling of local and cloud compute, local image/text generation, and a
              "compute-sharing" capability that pools local and cloud power and targets domestic NPUs such as Ascend and
              Cambricon; openKylin 2.0 SP2 integrates DeepSeek, Tongyi Qianwen and SenseTime models with an installable
              on-device Qwen2.5-3B for offline use. The architecture is multi-arch by design, adapting Phytium, Kunpeng,
              Loongson (LoongArch), Hygon, Zhaoxin and Sunway processors plus domestic GPUs, but it remains a downstream
              Linux distribution: the kernel, Wayland, container engines and much of userspace are upstream open-source
              components, which bounds Kylinsoft's autonomous-IP claims.
