  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Rivals
        blocks:
          - type: paragraph
            body: >-
              China's domestic operating-system market has consolidated into a small set of state-aligned vendors
              operating under the Xinchuang localization drive, with Kylinsoft and UnionTech widely framed as a desktop
              "dual monopoly" and Huawei's openEuler dominating the server root layer. The competitive set spans five
              archetypes. The direct desktop peer is UnionTech (Tongxin Software, 统信软件), whose Unity Operating System
              (UOS) was founded as a Beijing venture in 2019, released its first stable build in January 2020, and is
              built on the Debian-derived Deepin desktop; it is the leading general-market desktop OS and crossed ten
              million ecosystem adaptations in 2025, the first Chinese OS vendor to do so. The shared server substrate
              is Huawei's openEuler, an Apache-licensed community root operating system donated to the OpenAtom
              Foundation in November 2021 that holds roughly 57.3% of China's new server-OS installations in 2025 — and
              on which Kylinsoft's own Galaxy Kylin server edition is built, making openEuler both an upstream
              dependency and a strategic counterweight. The emerging substitute is Huawei's HarmonyOS PC, a microkernel
              desktop OS whose first notebook shipped in May 2025; it removes all Linux/Android code, runs no native
              Windows applications, and is positioned as the most credible long-run Windows desktop challenger. Niche
              secure-OS specialists include the separately listed KylinSec (麒麟信安, distinct from Kylinsoft) in power and
              aerospace, and ChinaSoft FangDe (中科方德, NFSChina) in Windows-compatible desktop. The status-quo alternative
              remains Microsoft Windows, still roughly 70-80% of China's desktop base and the primary displacement
              target, with international Linux/Unix (Red Hat Enterprise Linux, Ubuntu, SUSE) as the legacy enterprise
              reference being phased out of mandated sectors. deepin, a UnionTech-owned community distribution dating to
              2004, rounds out the field as an upstream and consumer-facing option.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
