  - id: competitor-profiles
    title: Competitor Profiles and Analysis
    body: >
      xMEMS (founded 2018, private) is Frore's closest technology analog and the most strategically important competitive watch. The XMC-2400 chip pivots xMEMS' MEMS speaker IP—already commercialized in products like the Creative Aurvana Ace 2 earbuds—into ultrasonic airflow generation. Like AirJet, it creates pulsating air jets via vibrating membranes; unlike AirJet, it does so in a package that is roughly one-tenth the volume. The XMC-2400 draws 20–30 mW versus AirJet Mini G2's ~1.2 W, and xMEMS claims 500 airflow-efficiency units per volume against Frore's claimed 31.3. However, xMEMS has not disclosed the raw wattage of heat the chip dissipates, and as of June 2026 no commercial customer device has been announced. xMEMS is dual-sourced at TSMC and Bosch—the same fabs Frore uses—limiting any fab-level manufacturing moat differentiation.

      Phononic is a private company focused on software-defined thermoelectric (TEC/Peltier) cooling for AI data centers. Phononic's "Thermal Fabric" provides millisecond-response TEC control across GPU chips, DIMMs, switch ASICs, and CDUs. The TEC mechanism is distinct from MEMS—TECs pump heat via the Peltier effect using semiconductor junctions, delivering precise temperature control but at lower efficiency (COP typically below 1) compared to convective cooling. Phononic reportedly entered sale talks at a valuation above $1.5B in 2026, signaling investor appetite for solid-state data center cooling. Its technology overlaps minimally with AirJet for edge devices today but could compete with LiquidJet in localized hotspot cooling in AI racks.

      Boyd Corporation Thermal (recently acquired by Eaton for $9.5B, deal announced November 2025) is the dominant incumbent thermal management company. With $1.7B in projected 2026 revenues (of which ~$1.5B is liquid cooling), Boyd/Aavid supplies OEM-grade vapor chambers, heat pipes, and liquid cooling systems to the consumer electronics, data center, aerospace, and automotive markets. The Eaton acquisition brings scale and balance-sheet backing, positioning the combined entity as a formidable competitor in data center liquid cooling. Boyd vapor chambers remain the standard incumbent passive solution in thin laptops; their passive nature (no active airflow generation) is the gap AirJet exploits, but Boyd's installed OEM base is substantial and switching costs are non-trivial.

      Nidec (Japan, large-cap) leads the miniature fan market for notebooks. Its ultra-thin fans (<3 mm) have been validated across generations of thin-and-light laptops by HP, Dell, Lenovo, and Asus. Nidec competes on precision manufacturing, noise optimization (unequal blade spacing), and decades of OEM qualification. Delta Electronics (Taiwan, large-cap) offers passive and active notebook thermal modules including heat-pipe-integrated fan assemblies and passive sealed-system modules. Both companies compete primarily on price and supply chain reliability, not technological differentiation for the sealed/silent performance gap.

      In the data center liquid cooling arena, traditional 2D-microchannel coldplate manufacturers (including legacy Vertiv, Laird, and CoolIT) represent the dominant status quo. LiquidJet's 3D short-loop jet-channel microstructures, manufactured using semiconductor techniques on metal wafers, claim 2× hotspot power density, 50% higher KW/lpm, and 4× lower pressure drop versus these incumbents for NVIDIA Blackwell Ultra (1,400 W). The upcoming NVIDIA Rubin and Feynman (>4,000 W) generations are expected to expose traditional coldplate limitations further, providing a growth window for LiquidJet if design wins can be secured at hyperscaler procurement cycles.
