callouts:
  - calloutType: strength
    title: xMEMS Market Entry Validates Solid-State Cooling as a Category
    body: >
      xMEMS' pivot into solid-state MEMS cooling chips using its existing piezo IP is widely interpreted as validation that Frore created a real and growing market. Moor Insights noted that xMEMS "validates the market that Frore has created," and its dual-sourcing at TSMC and Bosch signals credible execution intent. In the near term, xMEMS targets smartphones and SSDs—segments where AirJet is currently too large—which means competition is more complementary than substitutive for Frore's existing laptop/tablet wedge.
    claimRefs:
      - CP001
      - CP005
      - CP036

  - calloutType: risk
    title: Limited Consumer Laptop Adoption and Data-Transparency Gap Create Execution Uncertainty
    body: >
      Despite industry awards (CES 2026, COMPUTEX Best Choice), commercial AirJet adoption remained concentrated in industrial edge AI and reference designs as of early 2026, with Lenovo's collaboration the primary consumer-market signal. NotebookCheck flagged the absence of variable power-heat efficiency curves in Frore's G2 datasheet, an omission that complicates OEM thermal budgeting. If Tier-1 consumer laptop design wins do not materialize by 2027, Frore's $1.64B unicorn valuation—which prices in mass-market adoption—faces meaningful downside risk.
    claimRefs:
      - CP009
      - CP010
      - CP025
      - CP026
      - CP041

  - calloutType: insight
    title: Boyd/Eaton Acquisition Concentrates Incumbent Thermal Power
    body: >
      Eaton's $9.5B acquisition of Boyd Thermal creates a combined entity with deep OEM relationships, liquid cooling manufacturing scale, and Eaton's power management distribution network. This concentration elevates the incumbent threat to LiquidJet in data centers. However, the acquisition also signals that legacy cooling infrastructure is maturing into a commodity business—creating an opening for Frore's differentiated 3D jet-channel approach if it can demonstrate hyperscaler-scale reliability.
    claimRefs:
      - CP013
      - CP014
