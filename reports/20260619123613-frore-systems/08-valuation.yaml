  - id: valuation-context-and-entry-analysis
    title: Valuation Context, Entry Analysis, and Comparable Multiples
    body: >-
      At $1.64B post-money, Frore is valued at approximately 149x estimated 2026 revenue of ~$11M
      — a multiple that is extreme even by AI-era venture standards. For context, Vertiv Holdings
      (the leading public data center thermal management company) trades at a trailing PS ratio of
      11.8x on $10.2B in 2025 revenue, or approximately 8.7–9.5x forward revenue based on $13.5–
      14.0B 2026 guidance. Modine Manufacturing, a thermal management specialist pivoting aggressively
      to data centers, trades at approximately 3.25x trailing EV/revenue on $3.2B in FY2026 revenue.
      The Eaton-Boyd Thermal M&A transaction ($9.5B for $1.7B in 2026 revenue) implies a 5.6x
      revenue multiple for an established, profitable liquid cooling business at scale. Even Cerebras
      Systems, a high-profile AI semiconductor unicorn that IPO'd in 2026, commanded 51x trailing
      revenue — but on a $510M revenue base.

      Frore's 149x multiple is partially justified by the option value embedded in the LiquidJet
      data-center opportunity: if Frore can achieve $100M+ in revenue by FY2027–28, the implied
      forward multiple collapses to ~16x, approaching Vertiv's trailing range. However, there is no
      public evidence that LiquidJet has cleared the hyperscaler procurement threshold, meaning the
      current price is entirely a bet on future execution. Entry discipline therefore requires
      independently verified LiquidJet design wins with named accounts before the valuation becomes
      justifiable at current price. No secondary market pricing data is available publicly for Frore
      shares; Forge Global lists Frore but provides no transaction history. The dilution overhang
      from $340M in total capital raised at progressively higher valuations (seed ~$30M pre-money;
      Series C ~$650M; Series D $1.64B post-money) implies that early investors hold the most upside
      optionality while late entrants must rely on a major step-up in evidence for favorable risk-
      adjusted returns.
