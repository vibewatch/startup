  - id: partner-customer-competitive-risks
    title: Partner, Customer, and Competitive Risks
    body: >-
      Frore's commercial model depends heavily on a concentrated set of OEM and platform partnerships.
      The Qualcomm Snapdragon X2 Elite reference design incorporating AirJet Mini G2 is the single
      highest-leverage design-win multiplier available to the company: if Qualcomm OEM licensees
      adopt AirJet as a standard cooling component, Frore gains leverage across many devices without
      direct selling costs. But this creates a dual concentration risk—Qualcomm Ventures is both
      an equity investor and a design partner, creating potential misalignment if Qualcomm's platform
      strategy changes or if commercial terms become a point of tension.

      LiquidJet and LiquidJet Nexus are explicitly architected around NVIDIA's Kyber (half-U) form
      factor and GB300/Rubin GPU platforms. A change in NVIDIA's GPU packaging architecture,
      thermal envelope, or coolant loop design could strand Frore's data-center product investment
      and require costly re-engineering. As of June 2026, no hyperscaler (AWS, Azure, Google Cloud,
      or equivalent) has publicly announced a production deployment of LiquidJet, leaving the
      data-center revenue thesis unproven.

      In the edge cooling market, xMEMS represents an emerging MEMS competitor that directly
      compares its XMC-2400 chip against Frore's AirJet. xMEMS claims 16x better airflow efficiency
      per volume in its current form factor, though the XMC-2400 targets smartphones and SSDs rather
      than the laptop/PC segment Frore has prioritized. In the broader data-center thermal management
      space, established players such as Vertiv, Nidec, Delta, and now Boyd (acquired by Eaton in
      2025) are scaling liquid cooling offerings with far greater manufacturing scale and
      hyperscaler relationships. Frore's differentiated technology may not be sufficient to
      displace incumbent thermal suppliers without demonstrated hyperscaler production deployments.
