callouts:
  - calloutType: risk
    title: Taiwan Single-Fab Concentration — Maximum Residual Exposure
    body: >-
      Frore's entire production of AirJet and LiquidJet chips flows through a single, undisclosed
      Taiwan-based MEMS fabrication facility with no publicly disclosed backup fab, geographic
      diversification plan, or business continuity protocol. At a stage where the company is pivoting
      to hyperscaler data-center revenue and building on a $1.64B valuation, a full production halt
      from a Taiwan Strait escalation, major seismic event, or fab-specific disruption would
      immediately threaten the investment thesis with no near-term mitigation path. This is the
      single highest-priority diligence ask.
    claimRefs:
      - CR003
      - CR004
      - CR005
      - CR046

  - calloutType: risk
    title: Founder Key-Person Dependency — Unmitigated IP and Commercial Concentration
    body: >-
      CEO Dr. Seshu Madhavapeddy and CTO Dr. Surya Ganti together hold the MEMS IP portfolio
      (with Dr. Ganti as inventor on 50+ patents), all primary investor relationships, and all
      major commercial negotiations. No succession plan, key-man insurance disclosure, or
      retention agreement has been publicly described. At the Series D stage and $1.64B valuation,
      this concentration represents an unmitigated risk that institutional investors should explicitly
      address in term sheets.
    claimRefs:
      - CR015
      - CR016
      - CR039

  - calloutType: recommendation
    title: Priority Diligence Asks Before Committing Capital
    body: >-
      Before committing to an investment at the $1.64B valuation, five diligence items are essential:
      (1) Taiwan fab business continuity plan and alternate fab feasibility; (2) named hyperscaler
      LiquidJet pipeline with deal stage and expected announcement timeline; (3) founder retention
      agreements with vesting cliffs; (4) current cash balance and monthly burn rate; (5) ECCN
      classification of AirJet and LiquidJet under the Commerce Control List. These five items
      together address the blocking unknowns in the Frore risk profile.
    claimRefs:
      - CR041
      - CR042
      - CR044
      - CR048
      - CR049
      - CR050

