  - id: mitigations-and-kill-criteria
    title: Mitigations, Kill Criteria, and Diligence Asks
    body: >-
      Frore's mitigations are meaningful but incomplete. ISO 9001/14001 certification at the Taiwan
      fab provides a quality baseline; Qualcomm Ventures' dual investor-partner role creates aligned
      incentives to sustain the edge-AI design-win flywheel; and the 200+ patent portfolio creates
      a meaningful IP moat against reverse-engineering. The Series D syndicate (Fidelity, MVP
      Ventures, Top Tier) implies institutional confidence in the commercial trajectory. However,
      no mitigation has been disclosed for the single most important risk: Taiwan manufacturing
      concentration with no alternate fab.

      The thesis-break scenarios that should be monitored are: (1) failure to announce a hyperscaler
      LiquidJet design win by Q4 2026, indicating the data-center pivot has stalled; (2) Qualcomm
      discontinuing the Snapdragon X reference design with AirJet, removing the primary edge-AI
      design-win multiplier; and (3) a down round or failed Series E, signaling valuation repricing
      from missed commercial milestones. A founder departure event would also constitute a material
      trigger requiring immediate diligence escalation, given the concentrated IP and relationship
      dependencies.

      Primary diligence asks for an investor considering a position are: (1) What is the Taiwan fab's
      business continuity and geographic diversification plan? (2) What is the named hyperscaler
      pipeline for LiquidJet, with pipeline stage and expected timing? (3) Are founder retention
      agreements in place with vesting cliffs extending beyond Series D? (4) What is the current
      cash balance and monthly burn rate? (5) What is the ECCN classification of AirJet and LiquidJet
      under the Commerce Control List?

      The geopolitical context adds a time dimension to these diligence asks: the US-China technology
      competition and associated export control tightening in 2022-2026 have created precedents for
      rapidly imposed constraints on Taiwan-sourced semiconductor products serving Chinese-linked
      supply chains. CSIS identifies Taiwan's fabrication dominance as a key strategic chokepoint in
      global technology security, and the Atlantic Council's GeoTech Center tracks this as an ongoing
      risk dimension for semiconductor hardware companies. Frore should have explicit policies for
      customer screening and export compliance documentation.
