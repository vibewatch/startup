  - id: evidence-gaps
    title: Evidence Gaps and Diligence Paths
    body: >
      Several key market facts remain unresolved after primary source research. First, Frore Systems
      does not publicly disclose revenue, ARR, customer count, or market share, making it impossible
      to triangulate from bottom-up evidence what fraction of the data center liquid cooling market
      the company currently addresses. Analyst estimates for Frore's specific SAM penetration are
      absent from all reviewed sources.

      Second, Frore's claim of 75% more heat removal versus conventional cooling is a company-stated
      performance figure that has not been independently benchmarked in any publicly available
      technical publication. This claim is central to the LiquidJet value proposition and its
      validation would materially strengthen diligence confidence.

      Third, there is no publicly available independent market sizing study for the piezoelectric
      or solid-state active cooling market specifically—only the broader thermal management and
      liquid cooling market reports. This makes it difficult to size AirJet's TAM with precision.

      Fourth, the contradictory data center cooling market estimates across analysts ($5.52B at Mordor
      narrow vs. $81.88B at Precedence Research broad) indicate definitional inconsistency. Diligence
      should require Frore to specify which analyst's market definition they use internally, and to
      provide proprietary market intelligence supporting their SAM estimate.

      Diligence paths include: (1) require Frore to share anonymized customer pipeline data and any
      signed LiquidJet Nexus design wins; (2) commission an independent thermal performance test
      of LiquidJet vs. competing direct-to-chip solutions; (3) request Frore's internal TAM/SAM model
      with methodology disclosure; (4) interview 3–5 hyperscale infrastructure VPs on their cooling
      technology evaluation process and likelihood of adopting a startup vendor.
    claimRefs:
      - CM048
      - CM049

