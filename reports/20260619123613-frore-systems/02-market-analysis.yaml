  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: "frore-market-share"
      missingEvidence: >
        Frore's actual LiquidJet design wins, customer pipeline, deployed unit count, and revenue
        by segment are not publicly disclosed. Without this data, Frore's SAM penetration cannot
        be triangulated from bottom-up evidence.
      whyItMatters: >
        Market share and customer traction are the key indicators of commercial validation for
        a deep-tech startup. Absence of this data means the market opportunity size is entirely
        based on top-down analyst estimates, not corroborated by Frore's actual commercial activity.
      diligencePath: >
        Request anonymized customer pipeline data, signed design-win count by OEM tier, and any
        available NDA-covered revenue or ARR data from Frore during diligence. Cross-reference
        against independent interviews with 3–5 hyperscale infrastructure decision-makers.
      relatedQuestionRefs:
        - QM022

    - type: missing-source
      severity: material
      topic: "liquidjet-performance-benchmark"
      missingEvidence: >
        No independent third-party thermal performance benchmark or published technical paper
        comparing LiquidJet against competing direct-to-chip solutions (Asetek, CoolIT, Boyd)
        was found in any public source as of June 2026.
      whyItMatters: >
        Frore's 75% superior heat removal claim is central to its LiquidJet value proposition.
        Without independent validation, buyers and investors cannot assess whether the performance
        advantage is genuine, marginal, or conditionally true (e.g., specific workloads only).
      diligencePath: >
        Commission an independent thermal test laboratory (e.g., ASHRAE-compliant) to benchmark
        LiquidJet Nexus vs. two competing direct-to-chip modules at identical rack power densities.
        Alternatively, request Frore's internal test data with methodology disclosure and engage
        a thermal engineering firm to assess the methodology.
      relatedQuestionRefs:
        - QM012
        - QM026
        - QM027

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >
      TM003 (Buyer Segmentation Map) contains qualitative procurement-path information derived from
      industry practice patterns and company website descriptions, not from primary-source buyer
      interviews. Notes field documents this limitation; the table is a structural analysis, not
      an enumeration of verified customer data.
