company:
  name: Frore Systems
chapter:
  number: 1
  title: Company Overview
  summary: >
    Frore Systems, a San Jose, CA semiconductor startup founded in 2018, develops solid-state active cooling
    chips (AirJet) for edge and consumer AI devices and direct liquid cooling platforms (LiquidJet/LiquidJet Nexus)
    for AI data centers. The company raised $143M in a March 2026 Series D at a $1.64B valuation, reaching unicorn
    status with $340M in total funding. Co-founders Dr. Seshu Madhavapeddy (CEO) and Dr. Surya P. Ganti (CTO)
    bring deep MEMS manufacturing and go-to-market pedigree from Qualcomm, with confirmed OEM relationships
    including Sonim/AT&T FirstNet, a Qualcomm reference design, and a Lenovo Innovation Accelerator collaboration.

sections:
  - id: identity-and-overview
    title: Identity and Business Model
    body: >
      Frore Systems is a Silicon Valley semiconductor company that designs advanced thermal management
      technologies for the AI era. Founded in 2018 in San Jose, California, the company develops two
      distinct product lines: AirJet, the world's first solid-state active cooling chip for edge, consumer,
      and industrial AI devices; and LiquidJet, a direct liquid cooling platform for hyperscale AI data
      centers. Both product lines use semiconductor manufacturing processes—specifically MEMS-based
      piezoelectric actuation—to deliver cooling performance that traditional fans and heatsinks cannot
      match in compact, high-density environments. Frore Systems is at Series D stage with a $1.64B
      unicorn valuation. The company is headquartered in Silicon Valley with manufacturing operations in
      Taiwan and additional offices in South Korea. Its patented cooling technologies are integrated into
      products from major OEMs and system builders worldwide, spanning consumer electronics, industrial
      IoT, mission-critical communications, and AI data center infrastructure. The business model is
      B2B: Frore licenses and sells cooling chips and integrated thermal modules to OEMs and system
      builders who embed them in final products. Revenue and ARR are not publicly disclosed.
    claimRefs:
      - CO001
      - CO002
      - CO005
      - CO035
      - CO036
    tableRefs:
      - TO001
    figureRefs:
      - FO003

  - id: leadership-and-governance
    title: Leadership and Governance
    body: >
      Frore Systems was co-founded by two engineers with deep roots in MEMS research and commercialization
      at Qualcomm. Dr. Seshu Madhavapeddy (CEO) holds a Bachelor of Technology from IIT Kharagpur and a
      PhD in Computer Science from the University of Texas at Dallas. Before Frore, he built and exited
      two startups—Spatial Wireless and Sipera Systems—and served as VP/GM at Qualcomm, where he led
      the in-display fingerprint sensor business from demo stage to commercial success. Dr. Surya P. Ganti
      (CTO) holds a BTech from IIT Madras and a PhD in Mechanical Engineering from MIT. At Qualcomm he
      was CTO and engineering head for the Mirasol reflective display and ultrasonic fingerprint sensor
      products. Surya holds over 50 patents in MEMS, sensors, and flexible electronics. The executive
      team also includes Brandon Jung (VP Business Development) and Sue Ryan (VP Marketing). Key-person
      dependency is high: both founders hold the core technical IP and commercial relationships. Board
      composition and investor governance rights are not publicly disclosed. No material leadership changes
      or executive departures have been reported as of June 2026. Employee count is estimated at
      51–250 per Equilar, with Tracxn estimating approximately 79 employees; the exact figure is
      not publicly confirmed.
    claimRefs:
      - CO014
      - CO015
      - CO016
      - CO017
      - CO018
      - CO019
    tableRefs:
      - TO002

  - id: funding-and-investors
    title: Funding History and Capital Structure
    body: >
      Frore Systems has raised a total of $340M across multiple rounds since founding. Early backing came
      from Mayfield Fund and Clear Ventures in a seed round circa 2019 and a Series A around 2021. A
      Series A-II follow-on was completed in December 2021. A Series B was raised in December 2022. The
      company's first large institutional round was a $80M Series C in May 2024, led by Fidelity Management
      and Research Company (with Prosperity7 Ventures making a significant co-investment), bringing total
      raised to $196M. In March 2026, Frore completed a $143M Series D led by MVP Ventures, with participation
      from Fidelity, Top Tier, Mayfield Fund, Clear Ventures, Addition, Qualcomm Ventures, StepStone Group,
      and Alumni Ventures, valuing the company at $1.64 billion. The Series D inclusion of Qualcomm Ventures
      alongside the continued participation of Mayfield (with managing partner Navin Chaddha quoted in the
      announcement) signals strong strategic alignment with major semiconductor ecosystem players. Equity
      stakes, board seat allocation, and any debt or credit facilities are not publicly disclosed. No
      secondary transactions have been reported.
    claimRefs:
      - CO003
      - CO004
      - CO020
      - CO021
      - CO033
      - CO034
    tableRefs:
      - TO003

  - id: products-and-technology
    title: Products and Technology
    body: >
      Frore Systems has three primary products as of mid-2026. AirJet Mini G2 is the second-generation
      solid-state active cooling chip for edge and consumer devices. It removes 7.5W of heat per module
      at a silent 21 dBA noise level, drawing only 1.2W of power, and fits in a 27mm × 41.5mm × 2.65mm
      form factor at 7 grams. It generates 1,750 Pa back pressure—approximately 10× higher than a fan—
      enabling dustproof and water-resistant device designs. Multiple G2 chips can be stacked: four chips
      remove ~30W collectively. The G2 represents a 50% improvement over the original AirJet Mini G1
      (5.25W). LiquidJet is a multi-stage 3D short-loop jetchannel direct liquid cooling (DLC) coldplate
      for data centers that claims 75% higher heat transfer efficiency, 8°C cooler GPUs, 4% higher AI
      tokens per second, and 10% lower PUE compared to standard coldplates. LiquidJet Nexus is an
      integrated coldplate system for NVIDIA Kyber ½U compute trays that enables 2× compute density per
      rack, reduces thermal stack weight by 65%, eliminates hoses and manifolds, and supports 53°C inlet
      temperatures. All Frore products are based on MEMS piezoelectric actuation technology, with
      underlying patents including US12635413B2, US12581620B2, and US12565419B2 granted in 2026.
      Frore articulates "Frore's Law"—a goal to double thermal performance every two years.
    claimRefs:
      - CO006
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO026
      - CO027
