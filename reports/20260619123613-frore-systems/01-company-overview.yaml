  - id: milestones-and-traction
    title: Key Milestones and Traction
    body: >
      Frore Systems has progressed from a stealth MEMS cooling startup in 2018 to a unicorn in just eight
      years, driven by a series of product and financing milestones. The AirJet Mini G2, launched at
      Computex 2025, earned a third consecutive CES Innovation Award at CES 2026 and a Best Choice Award
      at Computex 2026 in June 2026. Key deployments confirmed as of mid-2026 include the Sonim MegaConnect—
      the world's first ultra-compact Power Class 1 5G HPUE mobile hotspot on AT&T's FirstNet network,
      which uses AirJet Mini G2 to deliver six times the transmission power of standard hotspots in a
      palm-sized package. A Qualcomm 2-in-1 reference design leverages three AirJet Mini G2 chips to
      sustain 18W TDP in a 6mm chassis, and a Samsung Galaxy Book5 Pro retrofit demo demonstrated 24W
      sustained CPU power (vs. 20W with a standard fan). In June 2026, Frore announced a collaboration
      with Lenovo's Innovation Accelerator to explore integrating AirJet Mini into future Lenovo products.
      Frore also demonstrated LiquidJet cooling for a 1,950W NVIDIA Rubin GPU at Computex 2026. Despite
      strong momentum, enterprise customers (cloud providers, governments) remain undisclosed, and
      specific revenue metrics are not public.
    claimRefs:
