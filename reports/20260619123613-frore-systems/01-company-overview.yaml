callouts:
  - calloutType: strength
    title: Dual-Platform Thermal Strategy Across AI Stack
    body: >
      Frore Systems addresses thermal management at both ends of the AI compute spectrum: AirJet targets
      edge and consumer AI devices (thin laptops, industrial IoT gateways, 5G hotspots) where fans
      are impractical, while LiquidJet and LiquidJet Nexus target hyperscale AI data centers cooling
      NVIDIA GPUs. This dual-market positioning means Frore can capture value from the consumer AI
      device wave and the infrastructure AI build-out simultaneously, reducing single-segment dependency.
    claimRefs:
      - CO005
      - CO006
      - CO009
      - CO012
      - CO036

  - calloutType: risk
    title: Key-Person Dependency and Customer Opacity
    body: >
      Both co-founders hold the core MEMS IP and commercial relationships; the loss of either Dr.
      Madhavapeddy or Dr. Ganti would be materially disruptive. Additionally, Frore Systems does not
      publicly disclose its enterprise customer list—confirmed OEM deployments as of June 2026 are
      limited to Sonim/AT&T FirstNet, the Qualcomm 2-in-1 reference design, and the anticipated
      Lenovo collaboration. Revenue is undisclosed. This opacity limits independent verification of
      commercial traction and customer concentration risk.
    claimRefs:
      - CO014
      - CO017
      - CO029
      - CO038
      - CO039

  - calloutType: insight
    title: "Frore's Law: Doubling Thermal Performance Every Two Years"
    body: >
      Frore Systems articulates "Frore's Law" as its strategic commitment to doubling the thermal
      performance of its cooling chips every two years, analogous to Moore's Law in semiconductor
      scaling. The AirJet Mini G2 represents a 50% improvement over G1 within a one-to-two-year
      product cycle. If Frore sustains this roadmap, it signals a defensible innovation rate that
      incumbent fan and heatsink vendors cannot easily replicate, reinforcing the durability of
      its technology moat.
    claimRefs:
      - CO026
      - CO037

