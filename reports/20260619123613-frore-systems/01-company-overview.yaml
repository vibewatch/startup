  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: headcount
      missingEvidence: >
        Exact employee count as of mid-2026; current estimates range from ~79 (Tracxn) to 51–250 (Equilar).
      whyItMatters: >
        Headcount is a proxy for R&D capacity, manufacturing scale, and burn rate; imprecise estimates
        limit independent assessment of the company's operational leverage.
      diligencePath: >
        Request current headcount from investor relations or management; cross-check with LinkedIn
        job board and recent job postings on froresystems.com.
      relatedQuestionRefs:
        - QO015

    - type: private-evidence-only
      severity: material
      topic: revenue
      missingEvidence: >
        Revenue, ARR, gross margin, burn rate, and runway for Frore Systems; no financial disclosures
        are publicly available.
      whyItMatters: >
        Without revenue data, it is impossible to assess capital efficiency, path to profitability,
        and sustainability of the growth thesis at the $1.64B valuation.
      diligencePath: >
        Request audited financials from company under NDA as part of formal due diligence process.

    - type: private-evidence-only
      severity: material
      topic: customers
      missingEvidence: >
        Full list of OEM customers integrating AirJet and LiquidJet; confirmed deployments limited
        to Sonim/AT&T FirstNet, Qualcomm reference design, and anticipated Lenovo collaboration.
      whyItMatters: >
        Customer concentration risk and commercial traction cannot be assessed without knowing
        the breadth and depth of the customer base; undisclosed customers may represent a small
        pipeline or a large concentrated set.
      diligencePath: >
        Obtain customer list under NDA; conduct primary reference calls with at least three
        confirmed OEM customers; inquire about contract structure, exclusivity, and reorder rates.

    - type: missing-source
      severity: minor
      topic: funding-history
      missingEvidence: >
        Exact dollar amounts and precise dates for the Series A (2021), Series A-II (December 2021),
        and Series B (December 2022) rounds.
      whyItMatters: >
        Incomplete early funding history limits understanding of cumulative dilution, capital
        efficiency, and early investor economics.
      diligencePath: >
        Access PitchBook or Crunchbase premium subscription data; request cap table summary from
        management during diligence.
      relatedQuestionRefs:
        - QO021

    - type: private-evidence-only
      severity: material
      topic: leadership-roster
      missingEvidence: >
        Full executive team roster, board member identities and affiliations, investor board seat
        allocations, and any recent leadership changes not reflected in press releases.
      whyItMatters: >
        Board composition and governance structure affect strategic decision-making and investor
        oversight; TO002 covers only co-founders and two named VPs, leaving the full governance
        picture opaque.
      diligencePath: >
        Request board composition, governance rights, and full executive roster from management
        under NDA; check Delaware corporate filings for director names.
      relatedTableRefs:
        - TO002

    - type: private-evidence-only
      severity: material
      topic: investor-economics
      missingEvidence: >
        Exact equity stakes, board seats, anti-dilution rights, liquidation preferences, and
        pro-rata rights for investors across all rounds listed in TO003.
      whyItMatters: >
        Without cap table details, investor economics and governance control cannot be assessed;
        early investor (Mayfield, Clear Ventures) dilution and preferences relative to late-stage
        investors (Fidelity, MVP) affect exit value distribution.
      diligencePath: >
        Request cap table and investor rights agreement from management; review Delaware formation
        documents under NDA.
      relatedTableRefs:
        - TO003

    - type: missing-source
      severity: minor
      topic: milestone-history
      missingEvidence: >
        Undisclosed or private milestones including internal product development phases, regulatory
        filings, adverse events, or Board decisions not covered in TO004 public press release record.
      whyItMatters: >
        Public press release record may omit product delays, early-stage pivots, or adverse events
        that would materially affect diligence conclusions about milestone integrity.
      diligencePath: >
        Review internal company timeline during management presentation; cross-reference with
        patent filing dates (USPTO), LinkedIn employee tenure changes, and third-party databases.
      relatedTableRefs:
        - TO004

