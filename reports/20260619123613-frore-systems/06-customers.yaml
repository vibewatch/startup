  - id: named-customer-deployments
    title: Named Customer Deployments and Adoption Evidence
    body: >
      The strongest customer-proof evidence available publicly centres on four confirmed or commercially
      announced deployments.

      The Sonim MegaConnect—launched commercially in late 2024 via AT&T FirstNet—is the highest-confidence
      production reference: available today at $99 promotional / $499 MSRP, marketed to first responders
      and enterprise field teams, with AT&T and FirstNet independently confirming the deployment. The
      MegaConnect is the world's first ultra-compact Power Class 1 5G HPUE mobile hotspot and transmits
      6× the power of standard devices in a palm-sized rugged design made possible by AirJet solid-state
      cooling; without AirJet, the heat generated by full HPUE operation would have prevented miniaturisation.
      Parsec is developing the MegaReach Dock accessory that will extend the MegaConnect's power to 12×,
      also using AirJet thermal management, reinforcing the platform relationship.

      YUAN High-Tech's EYE6N0 Series AI cameras with AirJet PAK 5C are in production serving industrial
      automation customers across AOI inspection, metal part detection, and packaging integrity. YUAN's GM
      explicitly described production deployment of AirJet PAK in a PR Newswire customer-quoted release.
      Frore announced AirJet PAK 5C G2 (45W capability, up from 33W) alongside the YUAN relationship,
      with YUAN's cameras demonstrated in Frore's CES 2026 showroom.

      Qualcomm's Snapdragon X2 Elite 2-in-1 notebook and Mini-PC reference designs were demonstrated with
      three AirJet Mini G2 chips at CES 2026. Qualcomm reference designs function as templates for global
      OEMs, enabling any downstream OEM to adopt AirJet in a Qualcomm-based device without a new design
      engagement with Frore. This expands the potential adoption surface significantly, though it is a
      design-ready platform, not a shipping consumer device.

      Crevis (South Korea) shipped the first AirJet Mini G2-cooled product at Computex 2025: an industrial
      SWIR camera for production-line inspection, demonstrating real-world deployment of the second-generation
      chip at commercial scale. Iodyne's Pro Mini SSD integrates AirJet for sustained high-speed data transfer,
      targeting media, defense, and cybersecurity edge workflows—described on Frore's official website as
      delivering "over 3× the sustained performance of the typical Pro SSD."

      The SnowGoose Developers' Kit enables OEM engineers to evaluate AirJet integration before production
      commitment, suggesting a funnel of development-stage customers beyond the confirmed shippers.
