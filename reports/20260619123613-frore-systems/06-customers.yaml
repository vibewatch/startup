  - id: retention-expansion-concentration
    title: Retention, Expansion, and Concentration Risk
    body: >
      Frore Systems does not publicly disclose net revenue retention (NRR), gross revenue retention (GRR),
      churn rates, cohort data, or individual customer revenue contribution. This opacity is inherent to
      its business model: chip suppliers to OEMs typically treat customer relationships as confidential
      commercial agreements. Revenue, ARR, and customer counts are likewise undisclosed.

      Despite limited transparency, several factors suggest durable customer relationships. AirJet's integration
      is a hardware design decision—once an OEM embeds AirJet in a product platform, switching cooling solutions
      requires full mechanical and thermal redesign, creating high switching costs. The Sonim/FirstNet relationship
      has a clear expansion path via the Parsec MegaReach Dock accessory. YUAN and Frore announced expanded
      collaboration coincident with the AirJet PAK 5C G2 launch, suggesting renewal and product upgrade
      cycles. Qualcomm's Snapdragon X2 Elite reference design explicitly cited three AirJet Mini G2 chips
      per device and at CES 2026 demonstrated desktop-class (25W+ sustained TDP) performance in a 10mm
      chassis—an OEM validation that anchors future Snapdragon platform opportunities.

      The Lenovo collaboration was framed by Lenovo's Innovation Accelerator GM Vico Song as evaluation
      of future premium products, not confirmed production. Until a Lenovo product ships, this relationship
      provides strategic credibility but not revenue certainty.

      Concentration risk is elevated. Only four to five named OEMs have been publicly tied to AirJet
      production or near-production deployments as of June 2026. If any single customer (Sonim/FirstNet
      in particular) represents a large share of current revenue, the loss or delay of that customer
      would be highly material. LiquidJet/LiquidJet Nexus data center customers are completely undisclosed,
      making it impossible to assess whether they are in production, pilot, or pre-revenue engagement.
      The entrance of well-funded competitors—particularly xMEMS, which raised capital and targets similar
      OEM customers in the smartphone and SSD markets—creates customer-poaching risk in segments where
      Frore's AirJet Mini Slim has a smaller footprint advantage.
