callouts:
  - calloutType: strength
    title: Production-Validated Mission-Critical Deployment
    body: >
      The Sonim MegaConnect — sold via AT&T FirstNet for first-responder use — is a production, commercially
      available product with endorsements from both AT&T's VP of FirstNet Products and Sonim's CCO. Mission-
      critical communications is one of the most demanding deployment environments (IP rating, MIL-SPEC, 24/7
      operation), validating AirJet reliability claims that no test-bench or lab demo can fully replicate.
    claimRefs:
      - CU012
      - CU013

  - calloutType: risk
    title: Data-Center Customer Opacity — Material Valuation Gap
    body: >
      LiquidJet and LiquidJet Nexus are positioned as the higher-value, faster-growing product lines, yet not
      a single data-center customer has been named publicly. At a $1.64B unicorn valuation, investors are
      implicitly pricing significant LiquidJet pipeline. The absence of any named production or pilot
      hyperscaler customer is the single largest unresolved diligence gap in this chapter.
    claimRefs:
      - CU009
      - CU034
      - CU035

  - calloutType: risk
    title: Customer Concentration — Small Named Production Base
    body: >
      With only four to five confirmed production-stage OEM relationships publicly documented, any disruption
      to the Sonim/FirstNet relationship or delay in Lenovo/Qualcomm pipeline conversion to shipping products
      would be highly material to near-term revenue. Frore has not disclosed revenue, customer count, or ARR,
      making concentration risk impossible to size independently.
    claimRefs:
      - CU031
      - CU032
      - CU033

  - calloutType: insight
    title: AirJet Hardware Lock-in Creates Durable OEM Relationships
    body: >
      Once an OEM embeds AirJet in a product platform (requiring custom chassis geometry, airflow ducting,
      and firmware integration), the switching cost to an alternative solid-state cooling solution is
      effectively a full mechanical redesign — estimated at 3–12 months of engineering effort. This structural
      stickiness benefits Frore's retention profile even in the absence of contractual lock-in, particularly
      for mission-critical and industrial deployments where re-qualification is expensive.
    claimRefs:
      - CU026
      - CU027
      - CU028

