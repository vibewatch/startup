company:
  name: Frore Systems
chapter:
  number: 6
  title: Customers
  summary: >
    Frore Systems sells cooling chips and modules exclusively to B2B OEM/system-builder customers across
    three segments: public-safety and mission-critical communications (Sonim/AT&T FirstNet MegaConnect,
    shipping), industrial edge AI (YUAN High-Tech AI cameras, Crevis machine-vision cameras), and consumer
    AI devices (Qualcomm reference design platforms, Lenovo Innovation Accelerator exploration). The Iodyne
    Pro Mini SSD is the first commercial data-storage product with solid-state AirJet cooling. LiquidJet
    data-center customers remain entirely undisclosed. No customer count, NRR, GRR, or retention metrics
    are publicly available; concentration risk is high given the small number of named production deployments
    and the opacity surrounding enterprise pipeline.
sections:
  - id: customer-base-segmentation
    title: Customer Base and Market Segmentation
    body: >
      Frore Systems operates a pure B2B chip-and-module supply model: it designs and manufactures AirJet
      solid-state active cooling chips and LiquidJet/LiquidJet Nexus liquid coldplates, then sells or
      licenses them to OEM device manufacturers and system builders who integrate the technology into
      their own branded products. End-users (first responders, factory operators, laptop consumers, data
      center operators) interact with Frore's technology only through the products of these OEM customers.
      There are no direct-to-consumer channels, no SaaS subscription model, and no pricing or volume
      figures disclosed publicly.

      As of June 2026, Frore's documented customer segments span three primary markets. In public safety
      and mission-critical communications, Sonim Technologies deployed AirJet Mini in the MegaConnect 5G
      HPUE mobile hotspot sold via AT&T FirstNet at $99–$499, targeting first responders, utilities, and
      enterprises needing high-power Band 14 connectivity. In industrial edge AI, YUAN High-Tech's
      EYE6N0 Series AI cameras (CES 2026 EE Times Asia Award winner) run AirJet PAK for AOI inspection,
      metal part defect detection, packaging verification, automated sorting, and barcode/OCR recognition.
      Crevis, a South Korean machine-vision camera manufacturer, was the first OEM to ship a product with
      AirJet Mini G2 at Computex 2025, targeting short-wave infrared (SWIR) industrial imaging. In consumer
      and edge AI devices, Qualcomm provided 2-in-1 notebook and Mini-PC reference designs incorporating
      three AirJet Mini G2 chips, validating the chip for Snapdragon X2 Elite-class thin devices. Lenovo
      announced an Innovation Accelerator collaboration at Computex 2026 to explore AirJet in future
      premium products, though no production device has shipped. Iodyne offers the Pro Mini, marketed as
      the world's first SSD with solid-state active cooling via AirJet, targeting media-and-entertainment,
      defense, and cybersecurity professionals.

      Frore claims its technology appears in products from "major OEMs and system builders worldwide" but
      does not disclose the full customer list. Data-center customers for LiquidJet and LiquidJet Nexus
      remain entirely undisclosed as of June 2026, representing a material gap for diligence on the
      company's faster-growing product line.
