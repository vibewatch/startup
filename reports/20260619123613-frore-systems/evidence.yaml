evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: |
      Exact employee count as of mid-2026; current estimates range from ~79 (Tracxn) to 51–250 (Equilar).
    whyItMatters: >
      Headcount is a proxy for R&D capacity, manufacturing scale, and burn rate; imprecise estimates limit independent
      assessment of the company's operational leverage.
    diligencePath: >
      Request current headcount from investor relations or management; cross-check with LinkedIn job board and recent
      job postings on froresystems.com.
    relatedQuestionRefs:
      - QO015
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: >
      Revenue, ARR, gross margin, burn rate, and runway for Frore Systems; no financial disclosures are publicly
      available.
    whyItMatters: >
      Without revenue data, it is impossible to assess capital efficiency, path to profitability, and sustainability of
      the growth thesis at the $1.64B valuation.
    diligencePath: |
      Request audited financials from company under NDA as part of formal due diligence process.
  - type: private-evidence-only
    severity: material
    topic: customers
    missingEvidence: >
      Full list of OEM customers integrating AirJet and LiquidJet; confirmed deployments limited to Sonim/AT&T FirstNet,
      Qualcomm reference design, and anticipated Lenovo collaboration.
    whyItMatters: >
      Customer concentration risk and commercial traction cannot be assessed without knowing the breadth and depth of
      the customer base; undisclosed customers may represent a small pipeline or a large concentrated set.
    diligencePath: >
      Obtain customer list under NDA; conduct primary reference calls with at least three confirmed OEM customers;
      inquire about contract structure, exclusivity, and reorder rates.
  - type: missing-source
    severity: minor
    topic: funding-history
    missingEvidence: >
      Exact dollar amounts and precise dates for the Series A (2021), Series A-II (December 2021), and Series B
      (December 2022) rounds.
    whyItMatters: >
      Incomplete early funding history limits understanding of cumulative dilution, capital efficiency, and early
      investor economics.
    diligencePath: >
      Access PitchBook or Crunchbase premium subscription data; request cap table summary from management during
      diligence.
    relatedQuestionRefs:
      - QO021
  - type: private-evidence-only
    severity: material
    topic: leadership-roster
    missingEvidence: >
      Full executive team roster, board member identities and affiliations, investor board seat allocations, and any
      recent leadership changes not reflected in press releases.
    whyItMatters: >
      Board composition and governance structure affect strategic decision-making and investor oversight; TO002 covers
      only co-founders and two named VPs, leaving the full governance picture opaque.
    diligencePath: >
      Request board composition, governance rights, and full executive roster from management under NDA; check Delaware
      corporate filings for director names.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: investor-economics
    missingEvidence: >
      Exact equity stakes, board seats, anti-dilution rights, liquidation preferences, and pro-rata rights for investors
      across all rounds listed in TO003.
    whyItMatters: >
      Without cap table details, investor economics and governance control cannot be assessed; early investor (Mayfield,
      Clear Ventures) dilution and preferences relative to late-stage investors (Fidelity, MVP) affect exit value
      distribution.
    diligencePath: |
      Request cap table and investor rights agreement from management; review Delaware formation documents under NDA.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: milestone-history
    missingEvidence: >
      Undisclosed or private milestones including internal product development phases, regulatory filings, adverse
      events, or Board decisions not covered in TO004 public press release record.
    whyItMatters: >
      Public press release record may omit product delays, early-stage pivots, or adverse events that would materially
      affect diligence conclusions about milestone integrity.
    diligencePath: >
      Review internal company timeline during management presentation; cross-reference with patent filing dates (USPTO),
      LinkedIn employee tenure changes, and third-party databases.
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: frore-market-share
    missingEvidence: >
      Frore's actual LiquidJet design wins, customer pipeline, deployed unit count, and revenue by segment are not
      publicly disclosed. Without this data, Frore's SAM penetration cannot be triangulated from bottom-up evidence.
    whyItMatters: >
      Market share and customer traction are the key indicators of commercial validation for a deep-tech startup.
      Absence of this data means the market opportunity size is entirely based on top-down analyst estimates, not
      corroborated by Frore's actual commercial activity.
    diligencePath: >
      Request anonymized customer pipeline data, signed design-win count by OEM tier, and any available NDA-covered
      revenue or ARR data from Frore during diligence. Cross-reference against independent interviews with 3–5
      hyperscale infrastructure decision-makers.
    relatedQuestionRefs:
      - QM022
  - type: missing-source
    severity: material
    topic: liquidjet-performance-benchmark
    missingEvidence: >
      No independent third-party thermal performance benchmark or published technical paper comparing LiquidJet against
      competing direct-to-chip solutions (Asetek, CoolIT, Boyd) was found in any public source as of June 2026.
    whyItMatters: >
      Frore's 75% superior heat removal claim is central to its LiquidJet value proposition. Without independent
      validation, buyers and investors cannot assess whether the performance advantage is genuine, marginal, or
      conditionally true (e.g., specific workloads only).
    diligencePath: >
      Commission an independent thermal test laboratory (e.g., ASHRAE-compliant) to benchmark LiquidJet Nexus vs. two
      competing direct-to-chip modules at identical rack power densities. Alternatively, request Frore's internal test
      data with methodology disclosure and engage a thermal engineering firm to assess the methodology.
    relatedQuestionRefs:
      - QM012
      - QM026
      - QM027
  - type: private-evidence-only
    severity: material
    topic: xmems-commercial-status
    missingEvidence: >-
      Confirmed commercial device designs integrating xMEMS XMC-2400, disclosed customer names, and independently
      verified cooling wattage per chip.
    whyItMatters: >-
      Without confirmed commercial traction or verified wattage data, it is difficult to assess whether xMEMS represents
      an imminent threat or a longer-horizon risk to Frore's competitive position.
    diligencePath: >-
      Monitor xMEMS product launch announcements and CES/MWC press releases through 2026; request evaluation samples for
      independent thermal benchmarking if available.
    relatedQuestionRefs:
      - QP016
  - type: private-evidence-only
    severity: material
    topic: frore-patent-portfolio
    missingEvidence: >-
      Frore's patent portfolio claims relative to xMEMS' piezoelectric MEMS cooling IP, freedom-to-operate analysis, and
      any active licensing or litigation between the two companies.
    whyItMatters: >-
      If xMEMS' XMC-2400 design infringe Frore patents, it represents a significant competitive barrier or licensing
      revenue opportunity; if Frore's IP does not cover the specific piezo architecture xMEMS uses, it reduces the
      durability of Frore's technical moat.
    diligencePath: >-
      Commission a patent landscape analysis (USPTO, WIPO, EPO) covering MEMS solid-state cooling chip claims from both
      Frore and xMEMS; assess scope of exclusivity.
    relatedQuestionRefs:
      - QP024
  - type: missing-source
    severity: minor
    topic: xmems-pricing
    missingEvidence: Public pricing or go-to-market structure for xMEMS XMC-2400 when it reaches commercial availability.
    whyItMatters: >-
      xMEMS pricing relative to Frore AirJet will determine whether it creates ASP pressure on the broader solid-state
      cooling chip segment as market volumes grow.
    diligencePath: >-
      Track xMEMS commercial announcements, distribution partnerships, and OEM press releases in 2026; compare against
      Nidec and Delta fan module pricing benchmarks.
  - type: enumeration-incomplete
    severity: material
    topic: xmems-commercial-production
    missingEvidence: >-
      Confirmed mass-production status and commercial customer device integration timeline for xMEMS XMC-2400 as of
      mid-2026; no public customer announcement found.
    whyItMatters: >-
      xMEMS' status as a sampling-phase competitor versus a production-stage one fundamentally changes the near-term
      threat level to Frore's market position in smartphones and SSDs.
    diligencePath: >-
      Monitor xMEMS website, press releases, and trade shows (MWC, CES) through H2 2026 for commercial device launch
      announcements; request evaluation samples for independent testing.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: xmems-benchmark-verification
    missingEvidence: >-
      Independent third-party thermal benchmark comparing xMEMS XMC-2400 and Frore AirJet Mini G2 cooling performance
      under identical test conditions.
    whyItMatters: >-
      xMEMS' claim of 16× greater airflow efficiency per volume is vendor-stated and unverified; if accurate, it could
      represent a significant long-run competitive threat to Frore in devices below laptop scale.
    diligencePath: >-
      Commission independent thermal performance testing of evaluation samples from both vendors; request test data from
      OEM engineering teams qualifying solid-state cooling options.
    relatedQuestionRefs:
      - QP012
  - type: private-evidence-only
    severity: blocking
    topic: financial-opacity
    missingEvidence: >-
      Audited or management-certified income statement showing revenue by product line, gross margin, operating expense
      breakdown, and EBITDA for fiscal year 2025 and TTM 2026.
    whyItMatters: >-
      Without revenue and margin data, the $1.64 billion valuation cannot be independently underwritten; the 149x
      estimated revenue multiple is unverifiable and the financial path to breakeven is entirely opaque.
    diligencePath: >-
      Request audited financials or management accounts under NDA from Frore Systems; verify with independent auditor
      confirmation or investor data-room access.
    relatedQuestionRefs:
      - QI012
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Monthly burn rate trend for the 12 months preceding June 2026, current cash balance, and forward runway estimate
