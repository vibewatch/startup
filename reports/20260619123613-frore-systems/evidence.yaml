  - type: missing-source
    severity: material
    topic: liquidjet-independent-benchmark
    missingEvidence: >
      An independent third-party benchmark comparing LiquidJet DLC coldplate thermal performance against incumbent
      coldplate solutions (Aavid, Boyd/Eaton, Vertiv, Laird) under identical GPU workload conditions at defined inlet
