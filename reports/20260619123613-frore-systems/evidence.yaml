    whyItMatters: >-
      The data-center revenue thesis underpinning the $1.64 billion valuation is unverifiable without a named customer
      reference; Frore declined to identify any in the SiliconANGLE Series D coverage.
    diligencePath: >-
      Request customer reference under NDA; review any customer case studies, purchase orders, or deployment
