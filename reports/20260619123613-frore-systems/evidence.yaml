    whyItMatters: >-
      Without burn rate and runway data, it is impossible to assess whether the $143 million Series D provides adequate
      capital to reach LiquidJet revenue milestones or whether a follow-on raise is imminent.
    diligencePath: >-
      Request monthly cash flow summary and projected runway calculation from CFO or investor relations; cross-check
      with board-level financial package.
    relatedQuestionRefs:
      - QI019
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      At least one publicly named hyperscaler or major cloud provider confirming commercial deployment of LiquidJet or
