companyProfile:
  summary: >-
    Frore Systems is a privately held semiconductor and thermal-management
    company founded in 2018 in Silicon Valley by former Qualcomm MEMS leaders
    Dr. Seshu Madhavapeddy and Dr. Surya P. Ganti. The company sells AirJet, a
    solid-state active cooling chip for thin PCs, edge AI devices, and rugged
    embedded systems, and is extending the same MEMS heat-transfer approach into
    LiquidJet cold-plate systems for AI data centers. Frore positions itself as
    a new thermal-stack infrastructure company rather than a conventional fan or
    heatsink vendor. Public evidence supports strong product differentiation,
    growing OEM/reference-design validation, and a March 2026 Series D that
    valued the company at $1.64B post-money, but audited revenue, margin,
    customer concentration, and named hyperscaler LiquidJet deployments remain
    undisclosed.
  foundedDate: "2018-01-01"
  founders:
    - name: "Dr. Seshu Madhavapeddy"
      role: "CEO and co-founder"
      background: >-
        Former Qualcomm VP/GM and repeat founder who previously built Spatial
        Wireless and Sipera Systems before leading fingerprint-sensor
        commercialization programs at Qualcomm.
      claimRefs: [CO014, CO016]
    - name: "Dr. Surya P. Ganti"
      role: "CTO and co-founder"
      background: >-
        Former Qualcomm MEMS/display and ultrasonic-sensor technology leader
        with an MIT mechanical-engineering PhD and a large personal patent base
        in MEMS, sensors, and flexible electronics.
      claimRefs: [CO015, CO017]
  foundingLocation: "San Jose, California, USA"
  headquarters: "San Jose, California, USA"
  productSummary: >-
    Solid-state MEMS cooling chips and modules (AirJet Mini G2) for compact AI
    devices plus direct liquid cooling cold plates and system integrations
    (LiquidJet / LiquidJet Nexus) for high-density AI servers and racks.
  customerFocus: >-
    Laptop and edge-device OEMs, rugged/industrial system builders, telecom and
    mission-critical communications hardware vendors, and eventually hyperscale
    AI data-center operators.
  businessModel: >-
    B2B component and module sales to OEMs and system builders, supported by
    reference designs, partner integrations, and productized thermal modules;
    pricing is largely quote-based and not publicly disclosed.
  stage: "Private, Series D unicorn"
  fundingStatus: >-
