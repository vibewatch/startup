  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与收入来源
        blocks:
          - type: paragraph
            body: >-
              Frore Systems 采用纯硬件收入模式：公司以 B2B 方式向企业客户销售专有固态散热芯片和冷板系统，并在交付时确认收入。三条不同产品线产生收入。AirJet 是旗舰固态主动散热芯片，销售给消费电子和工业
              OEM——例如 ZOTAC（ZBOX PI430AJ mini PC）、AT&T Sonim（FirstNet 上的 MegaConnect 5G 热点）和 Qualcomm
              参考设计——用于集成进超薄、静音、无风扇设备。LiquidJet 和 LiquidJet Nexus 是数据中心液冷平台，销售给 AI 基础设施运营商，包括大型云服务商、企业和政府计算网络，用于直达芯片 GPU
              冷却。AirJet PAK 是兼容 NVIDIA Jetson Orin 的模块化多芯片散热单元，服务边缘 AI 网关制造商。未公开披露任何订阅、授权或服务合同收入层；所有牵引力证据都指向单位硬件销售。Frore
              不运营 SaaS 模式，也没有公开披露 ARR 或 GMV 指标。消费边缘与数据中心板块之间的收入结构未披露，但自 2025 年初以来，公司叙事明显转向数据中心应用，说明 LiquidJet
              线现在是主要增长押注。收入确认遵循标准硬件模式：所有权和风险在发货或交付时转移，与 OEM 芯片供货协议一致。
