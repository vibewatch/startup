      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 建议：research-more——入场需要 LiquidJet 证据
            body: >-
              Frore Systems 投后估值 $1.64B，约为预估 2026 年收入的 149x；市场已经按一个仍未被公开证实的颠覆性执行故事给它定价。AI 冷却逻辑在结构上成立——GPU
              密度确实在挑战风冷上限，IDC 的 TAM 预测也支撑市场机会。但估值已经跑在证据前面。research-more 的结论，反映的是 LiquidJet 数据中心叙事的二元性：如果 Frore
              能在六个月内说出两个 hyperscaler 客户，并证明收入超过 $30M，当前标记下的建议可上调至 track 或 buy。没有这组证据，投资者就是在为一个尚未披露的收入基数，支付相对可比热管理公司
              30–75x、相对成熟 M&A 先例 3–7x 的溢价。
