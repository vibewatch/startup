      - number: '7.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 台湾单一晶圆厂集中——最大剩余敞口
            body: >-
              Frore 的全部 AirJet 和 LiquidJet 芯片生产都流经一家未披露的台湾 MEMS 制造设施，没有公开披露备用晶圆厂、地域多元化计划或业务连续性协议。在公司转向 hyperscaler
              数据中心收入、并建立在 $1.64B 估值之上的阶段，若台海升级、重大地震或晶圆厂特定扰动导致全面停产，投资论点会立即受威胁，且短期内没有缓释路径。这是优先级最高的尽调问题。
