      - number: '3.3'
        title: 定价、GTM 与分销对比
        blocks:
          - type: paragraph
            body: >
              Frore 未公开 AirJet 模组定价；公司在 NDA 下直接卖给 OEM。市场普遍理解其价格相对传统微型风扇模组有溢价，后者中 Nidec 和 Sunon 组件在规模出货时大致为每件 $3–10。Frore
              呈现的价值主张不是价格平价，而是整个平台经济性：OEM 可以设计更轻、更薄、更安静的设备，并宣称持续性能达到风扇无法实现的水平。溢价被定位为支撑产品差异化叙事，从而在设备层面获取更高 ASP。

              相比之下，传统风扇和均热板供应商采用竞争性大宗商品模式。Nidec、Sunon、Delta 和 Boyd/Aavid 都靠规模定价、长期 OEM
              认证关系，以及百万级出货供应能力竞争。这些关系会随时间复利：一家笔记本 OEM 若已连续三代产品认证 Nidec 风扇，其工程流程、热仿真库和供应链基础设施都沉淀在这些关系中。即便 Frore
              技术明显更好，也必须克服相当高的惯性成本，才能替换既有供应商。

              xMEMS 尚未公布 XMC-2400 的商业定价。鉴于其形态更小、功耗显著更低（30 mW vs. Frore 的 1.2 W），它可能在智能手机 BOM 中以更低 ASP 竞争。如果 xMEMS
              拿下大规模智能手机 design win（类似其 MEMS 扬声器芯片进入市场的路径），可能确立价格先例，对更广泛的固态散热市场形成 ASP 压力，并潜在影响 Frore
              在平板和轻薄笔记本等收敛细分中的溢价定位。

              传统散热供应商通过成熟组件分销网络（Arrow、Avnet、Mouser）和 OEM 直销分销。Frore 的 GTM 主要是直接对接 OEM，瞄准消费电子、工业 IoT 和边缘 AI
              平台公司的硬件工程团队。LiquidJet 的数据中心 GTM 需要对接超大规模云厂商采购和硬件设计团队，销售周期显著长于消费电子 OEM。Frore 在 CES 2026 和 COMPUTEX 2026 展示
              LiquidJet，说明企业 GTM 动作已经启动。
