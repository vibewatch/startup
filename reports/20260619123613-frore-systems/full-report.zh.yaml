      - number: '4.2'
        title: 定价架构与 GTM 效率
        blocks:
          - type: paragraph
            body: >-
              Frore 没有为任何产品发布价格表。AirJet 芯片定价由公司直接与 OEM 设计团队谈判，并嵌入批量供货协议；在保留证据集中，任何新闻稿、产品页或分析师笔记都没有出现单件零售价格。AirJet Mini
              G2 产品页强调技术规格（7.5 W 散热、2.65 mm 厚度、1,750 Pa 背压），而不是定价；这符合通过 B2B design-win 渠道销售半导体组件的惯例。LiquidJet 和
              LiquidJet Nexus 面向数据中心客户的定价按项目确定，与每家超大规模云厂商或基础设施运营商单独谈判；考虑 AI 基础设施采购的竞争敏感性，极不可能公开。GTM 依赖直接企业销售和战略 OEM
              伙伴渠道；Qualcomm Ventures 同时作为投资人和参考设计伙伴，体现了「工程 + 商业」双轨接触模式。该品类硬件 design win 的销售周期通常从初始演示到规模出货需要 12–24
              个月，对销售效率指标构成实质拖累。保留证据中没有公开 CAC、回本周期或销售周期数据。Qualcomm 的 Snapdragon X2 Elite 参考设计采用 AirJet Mini G2，是重要 GTM
              乘数——如果 Qualcomm 平台的 OEM 授权方把 AirJet 作为标准组件，Frore 无需为每台下游设备直接销售，也能获得杠杆。
