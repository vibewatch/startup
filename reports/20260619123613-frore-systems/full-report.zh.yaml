  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >
              Frore Systems 处理的是两个不同产品层的热管理问题。第一层是数据中心直接液冷，LiquidJet 冷板用于带走高密度 AI GPU 和计算托盘产生的热量。第二层是消费和边缘 AI
              主动散热，AirJet 压电芯片让轻薄笔记本、平板和工业边缘设备可以做到无风扇或少风扇形态。这两个市场在买方类型、采购路径、收入规模和竞争动态上差异很大。

              数据中心板块的相关支出边界，是卖给数据中心运营商和服务器 OEM
              的直达芯片及模组级液冷硬件，而不是更宽泛的数据中心建设、供电或设施冷却（HVAC/CRAC）市场。可服务支出包括冷板、冷却液分配单元（CDU）、机架内液体歧管，以及基于半导体的散热模组。Frore 直接 SAM
              不包括：传统空气冷却风扇和散热片、浸没式液冷槽（竞争技术）、区域供热基础设施，以及机架级精密冷却系统。

              消费板块的边界，是嵌入最终产品（笔记本、平板、IoT 设备）的固态主动散热芯片和模组，Frore 向 OEM
              销售组件。该边界不包括更宽泛的消费电子市场、零售笔记本销售，以及被动热解决方案（均热板、石墨垫、热界面材料）。邻近替代方案包括音圈驱动风扇、TEC（Peltier）芯片，以及轻薄设备中的均热板组件。

              现状替代品按板块不同而变化：数据中心里，既有方案是精密空气冷却（架空地板 CRAC
              机组、冷热通道封闭），以及来自成熟供应商（Asetek、CoolIT、Boyd/Aavid）的传统直达芯片液冷；消费设备里，替代品是高速薄型风扇、石墨导热垫，以及以性能降档为代价的被动散热。
