      - number: '5.6'
        title: 产品风险、缺口与路线图
        blocks:
          - type: paragraph
            body: >
              Frore Systems 的主要产品层面风险集中在三处。第一，LiquidJet 宣称的性能优势（2× 热点功率密度、50% kW/lpm 提升、4× 压降降低、75% 热传递提升）全部来自公司自述；截至
              2026 年 6 月，尚未与 Aavid、Boyd 或 Vertiv 等竞品方案做独立基准测试。评估 LiquidJet 的数据中心客户需要自行开展资格测试。第二，AirJet 集成要求 OEM
              伙伴投入大量硬件设计工作；这项技术不是即插即用，SnowGoose developer kit 是唯一正式入口，商业化节奏完全取决于 OEM 采用周期。第三，Frore 制造集中在台湾；一旦地缘政治扰动、TSMC
              产能约束或出口限制出现，供应链集中风险会显性化。路线图上，Frore 已在 Computex 2026 展示 LiquidJet Nexus 为 1,950W NVIDIA Rubin GPU
              散热，并确认工程上已为 Feynman 级 GPU（>4,000W）做好准备。「Frore's Law」轨迹预计下一代 AirJet Mini G3 或等效产品将在约 2027 年把热性能翻倍。不过，公司尚未披露
              G3 或下一代 LiquidJet 变体的明确发布时间。截至 2026 年 6 月，公司也未披露任何与 AirJet 嵌入式控制电子相关的安全、隐私或安全漏洞披露。
