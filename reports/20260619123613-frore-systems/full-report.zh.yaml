      - number: '3.4'
        title: 护城河耐久度与竞争风险评估
        blocks:
          - type: paragraph
            body: >
              Frore 的竞争护城河建立在四根支柱上：（1）专有 MEMS 薄膜和喷射通道架构，并由持续扩张的专利组合保护；（2）在密封、防尘、防水形态中产生主动对流气流的独特能力——风扇或均热板无法复制；（3）在工业边缘
              AI OEM 中拥有先发优势（YUAN AI 摄像头、Qualcomm 参考设计、Lenovo 合作），通过机箱级气流通道工程制造切换成本锁定；（4）TSMC 的半导体级制造质量，支撑风扇无法达到的 IP58
              级可靠性标准。

              但护城河存在实质脆弱点。最具结构性的威胁是 xMEMS 的平行 MEMS 平台，它证明压电超声气流机制可以被复制。xMEMS 声称单位体积气流效率高 16×；若该指标获得独立验证，意味着 Frore 要守住笔记本
              / 平板细分，主要必须依靠更高绝对散热瓦数（7.5 W/chip vs. xMEMS 未披露瓦数）和既有 OEM 关系。Frore 与 xMEMS 都使用 TSMC 和 Bosch
              作为制造伙伴，也限制了任何来自晶圆厂的制造护城河。

              第二项风险是消费笔记本采用速度。NotebookCheck 在 2025 年 5 月指出，Frore 在 Computex 上主要聚焦工业应用，且 AirJet Mini G2 数据表缺少可变功率 /
              热效率曲线。截至 2026 年初，消费笔记本采用仍处萌芽期，Lenovo 是唯一具名 OEM 合作，多数商业部署局限在工业边缘 AI 网关和参考设计。如果主流 OEM 采用滞后，Frore 的高估值（$1.64B
              独角兽）所反映的是更广泛放量将出现的预期；若到 2027 年无法拿下多个 Tier-1 消费笔记本 design win，将构成显著下行风险。

              数据中心侧，Boyd/Eaton 和成熟液冷既有厂商已经与超大规模云厂商建立关系。LiquidJet 的技术论点（3D
              喷射通道、半导体制造）有吸引力，但尚未在超大规模云厂商规模下验证。赢下超大规模云厂商设计席位，通常需要多年认证周期、可靠性保证和地理冗余供应能力——这些方面，Eaton 支持下的 Boyd
              实体相对创业公司具备结构优势。Frore 的关键缓释因素是 GPU 瓦数攀升（NVIDIA Rubin 1,950 W，Feynman 预计 4,000+
              W）将压迫传统冷板架构并制造采购紧迫性，可能压缩认证时间线。
