      - number: '5.2'
        title: 核心技术架构
        blocks:
          - type: paragraph
            body: >
              AirJet 的底层机制是 MEMS（Micro-Electro-Mechanical Systems）压电驱动。芯片内的微膜片以高频振动，产生压力波，推动气流穿过设备外壳，背压达到 1,750
              Pascals，约为传统风扇的 10 倍。这种固态方案不产生机械噪音（Mini SKU ≤21 dBA）、没有磨损部件，并支持「air
              sculpting」——把冷却空气从设备机身另一侧的过滤通风口导入，以降低表面温度。高背压也让芯片进气口和主机设备进气口都能加装在线防尘滤网，从而支持 IP53 和 IP68 设备设计。Frore 已发布多项详细
              MEMS 驱动专利，包括 US12581620B2（MEMS-based actuator systems 的出口通道配置）和 US12565419B2（active MEMS cooling systems
              的撞击缓解），两项均于 2026 年获批，印证了 Frore 技术 IP 的深度。公司 CTO 在 CES 2024 表示，AirJet 已通过主要 OEM 客户严格的 5
              年寿命可靠性测试。面向数据中心，LiquidJet 走的是完全不同的路径：Frore 不采用传统 skived 2D microchannel coldplate，而是把半导体制造工艺适配到金属晶圆上，生产 3D
              short-loop jet channel 微结构，并按每颗 GPU die 的精确功率密度地图定制。该架构让 LiquidJet 可以优先把流量集中到 GPU 热点区域，在 40°C 入口温度下实现最高
              600 W/cm² 热点冷却，kW/lpm 冷却效率比传统方案高 50%，压降低 4 倍。LiquidJet Nexus 将多个 LiquidJet coldplate 集成到单一 compute-tray
              级平台，去掉软管、歧管和连接器，降低集成复杂度，并支持 53°C 入口温度运行。
