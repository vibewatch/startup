      - number: '3.2'
        title: 竞争对手画像与分析
        blocks:
          - type: paragraph
            body: >
              xMEMS（2018 年成立，私营）是 Frore 最接近的技术类比，也是最值得战略关注的竞争对象。XMC-2400 芯片把 xMEMS 的 MEMS 扬声器 IP——已在 Creative Aurvana
              Ace 2 耳机等产品中商业化——转向超声气流生成。它像 AirJet 一样通过振动薄膜产生脉冲气流；不同的是，封装体积约为 AirJet 的十分之一。XMC-2400 功耗 20–30 mW，而 AirJet
              Mini G2 约 1.2 W；xMEMS 声称单位体积气流效率为 500，相比 Frore 声称的 31.3。不过，xMEMS 未披露芯片可散出的原始热瓦数，截至 2026 年 6
              月也未宣布任何商用客户设备。xMEMS 在 TSMC 和 Bosch 双源生产，与 Frore 使用同一批晶圆厂，削弱了任何晶圆厂层面的制造护城河差异。

              Phononic 是一家私营公司，聚焦面向 AI 数据中心的软件定义热电（TEC/Peltier）冷却。Phononic 的「Thermal Fabric」可在 GPU 芯片、DIMM、交换 ASIC 和 CDU
              上提供毫秒级 TEC 控制。TEC 机制不同于 MEMS：TEC 利用半导体结的 Peltier 效应泵送热量，可提供精确温控，但效率低于对流冷却（COP 通常低于 1）。据报道，Phononic 在 2026
              年以超过 $1.5B 估值讨论出售，显示投资人对固态数据中心冷却有兴趣。其技术目前与边缘设备 AirJet 重叠很少，但可能在 AI 机架局部热点冷却上与 LiquidJet 竞争。

              Boyd Corporation Thermal（最近由 Eaton 以 $9.5B 收购，交易于 2025 年 11 月宣布）是占主导地位的既有热管理公司。Boyd/Aavid 预计 2026 年收入为
              $1.7B（其中约 $1.5B 来自液冷），向消费电子、数据中心、航空航天和汽车市场供应 OEM 级均热板、热管和液冷系统。Eaton
              收购带来规模和资产负债表支持，使合并后实体成为数据中心液冷领域的强大竞争者。Boyd 均热板仍是轻薄笔记本中的标准被动方案；其被动属性（不产生主动气流）正是 AirJet 利用的缺口，但 Boyd 已安装 OEM
              基础深厚，切换成本并不低。

              Nidec（日本，大盘股）领先笔记本微型风扇市场。其超薄风扇（<3 mm）已经在 HP、Dell、Lenovo 和 Asus 多代轻薄笔记本中获得验证。Nidec 靠精密制造、噪声优化（不等距叶片）和数十年
              OEM 认证竞争。Delta Electronics（台湾，大盘股）提供被动和主动笔记本热模组，包括热管集成风扇组件和被动密封系统模组。两家公司主要拼价格和供应链可靠性，而不是在密封 /
              静音性能缺口上拼技术差异化。

              数据中心液冷战场中，传统 2D 微通道冷板制造商（包括老牌 Vertiv、Laird 和 CoolIT）代表主导性既有方案。LiquidJet 采用 3D
              短回路喷射通道微结构，并用半导体工艺在金属晶圆上制造；公司宣称，相较这些既有方案，在 NVIDIA Blackwell Ultra（1,400 W）上可实现热点功率密度 2×、KW/lpm 高 50%、压降低
              4×。即将到来的 NVIDIA Rubin 和 Feynman（>4,000 W）世代预计会进一步暴露传统冷板限制；若 LiquidJet 能在超大规模云厂商采购周期中拿下 design win，将获得增长窗口。
