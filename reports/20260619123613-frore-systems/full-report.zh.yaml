      - number: '7.2'
        title: 运营与供应链风险
        blocks:
          - type: paragraph
            body: >-
              Frore 最尖锐的运营风险，是对一家未披露的台湾 MEMS 制造设施形成单一来源依赖。AirJet 和 LiquidJet
              芯片全部通过这一设施生产；没有替代晶圆厂、地域多元化或公开披露的业务连续性计划。台湾在全球先进半导体制造产能中占比不成比例；一旦两岸地缘政治升级、自然灾害（台湾平均每年发生多次显著地震）或监管扰动出现，Frore
              可能全面停产，恢复周期按季度计，而不是按周计。

              制造质量有部分缓释：Frore 的台湾晶圆厂在 2024 年 9 月和 10 月取得 ISO 9001（质量管理）和 ISO 14001（环境管理）认证，提供了基础质量框架。不过，MEMS
              制造涉及压电材料、特殊工艺气体以及继承自平板显示和航空航天制造的光刻技术，围绕危险材料产生环境合规义务。OSHA 的半导体制造标准列出了溶剂、酸性溶液和辐射设备的暴露风险，这些风险适用于 Frore
              在美国的工程和测试运营。

              一项技术可靠性风险来自振动 MEMS 膜片在持续 AI 工作负载下的长期耐久性。AirJet 芯片在激活时会持续驱动压电膜片；公司尚未为任何一代 AirJet 发布经独立验证的 MTBF（Mean Time
              Between Failures）或加速寿命测试资格数据。随着 Frore 通过 LiquidJet 进入企业 AI 和数据中心细分市场，hyperscaler
              采购团队会要求正式可靠性资格，而这些尚未披露。MEMS 制造的良率波动历史上高于大宗 CMOS；在缺少财务披露的情况下，这增加了尚未解决的利润率不确定性。
