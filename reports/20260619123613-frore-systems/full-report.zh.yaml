      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              直冷液冷需求的核心驱动是机架功率密度持续上升。Mordor Intelligence 报告称，随着大语言模型训练集群扩散，机架密度正从 8–12 kW 迈向 120 kW。NVIDIA H200 GPU
              单卡带来约 700W 热负载；当单机架超过 20 kW 后，空气冷却难以以有成本效率的方式大规模带走热量。Amazon 承诺投入 $150B 建设 AI
              优化数据中心容量，显示基础设施投资会持续，而液冷将成为基线能力，不再是可选项。

              监管顺风加速采用：European Energy Efficiency Directive 要求 1 MW
              以上数据中心评估热回收选项，使液冷既是合规架构，也是效率策略。相较传统空气系统，液冷在超大规模设施中估计可节能 20%。IEA 数据显示，2022 年全球数据中心用电量为 240–340
              TWh（占全球终端用电需求的 1–1.3%），Amazon、Microsoft、Google 和 Meta 合计用电量在 2017–2021 年间翻倍以上，达到每年约 72 TWh。

              消费板块里，AI PC 的 40 TOPS 要求抬高了热管理复杂度：轻薄设备中的 NPU 工作负载会产生传统风扇无法在无风扇形态下安静处理的热量分布。游戏笔记本以 9.16% CAGR 增长，是 AirJet
              当下可服务的直接细分。中国控制全球约 70% 稀土产量，使散热风扇组件暴露在出口配额风险下，可能提升 AirJet 等固态替代方案的相对竞争力。

              这些驱动因素之外，也存在实质约束。存量数据中心改造液冷需要安装歧管和二级回路，前期改造成本高，常常接近或超过新建资本开支。3M 计划退出 PFAS
              基冷却液，正在重塑流体供应链；中国特种化学品厂商在补位，但质量一致性尚未验证。全球液冷现场经验有限，限制部署速度。Infineon CEO 称功率半导体供应长期投资不足，可能影响冷却控制系统所用组件的可得性。中国
              PC 市场预计 2026 年下滑约 10%，内存价格在 2026 年 Q1 上涨约 90%，挤压笔记本 OEM 利润率，并可能推迟 AirJet 采用。
