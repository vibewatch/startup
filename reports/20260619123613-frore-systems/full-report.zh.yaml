      - number: '4.3'
        title: 成本结构与毛利率
        blocks:
          - type: paragraph
            body: >-
              Frore 的成本结构主要由台湾晶圆厂（ISO 9001 和 ISO 14001 认证）的 MEMS 半导体制造 COGS
              驱动。制造流程吸收了半导体、平板显示、航空航天和汽车制造技术——比大宗风扇生产更复杂、资本强度更高，但若在规模上跑通，凭借高性能溢价定位，有机会获得有吸引力的利润率。公司没有公开经审计财务或毛利率披露；分析师和市场数据聚合商估计，高价值半导体散热组件在规模生产时毛利率为
              40–60%，但该数字未针对 Frore 验证。MEMS 制造每次晶圆运行承担实质固定成本；公司约 200 篇相关专利公开反映出大量累积 R&D 投入，且多数已沉没。R&D 和工程人员（总员工约 70–79
              人）是 COGS 之外的主要经营费用。营运资本需求包括台湾晶圆厂的原材料库存和在制品；LiquidJet Nexus 集成冷板的材料含量高于 AirJet
              芯片，随着数据中心单位出货增长，库存敞口会上升。资本开支持续存在：Series D 募资部分指定用于扩大制造产能，说明当前台湾产能不足以满足预计需求。折旧时间表、资本租赁细节或资产负债表项目均未公开。
