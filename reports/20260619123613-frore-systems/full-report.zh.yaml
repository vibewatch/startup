  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司 / 交易
      - 类型
      - 指标
      - 倍数 / 估值
      - 与 Frore 的相关性
      - 局限
    rows:
      - - Vertiv Holdings (VRT)
        - 上市公司 — 数据中心热管理与电力
        - EV $128.7B；FY2025 收入 $10.2B；2026e $13.5–14.0B
        - 11.8x 过去十二个月 PS；8.7–9.5x 远期 PS
        - 最可比的大规模液冷上市公司；数据中心热管理直接竞争对手
        - Frore 尚未规模化收入；Vertiv 在 $10B+ 收入上已盈利 — 收入差距 1,000x
      - - Modine Manufacturing (MOD)
        - 上市公司 — 热管理转向数据中心
        - EV $10.4B；FY2026 收入 $3.2B（DC 收入 $1.1B，YoY +73%）
        - 3.25x 过去十二个月 EV/收入；DC 分部 YoY 增长 73%
        - 中型热管理可比公司，正转向 AI；DC 冷却使命类似
        - Modine 有传统工业收入；仅 DC 分部也约 $1.1B，而 Frore 估计约 $11M
      - - Eaton–Boyd Thermal 并购
        - 私有并购 — 液冷战略收购
        - $9.5B 交易，对应 2026 年收入 $1.7B；2026 年 EBITDA 22.5x
        - 约 5.6x 收入（EV/收入）；22.5x EBITDA
        - 为已有验证收入的液冷资产设定战略溢价基准
        - Boyd 收入 $1.7B；Frore 约为 Boyd 规模的 1% — 战略价值尚未验证
      - - Asetek（液冷 — 现为私有）
        - 曾上市 — 数据中心液冷
        - FY2025 收入 $41.5M；2026 年由 CQXA Holdings 私有化退市
        - 历史 0.5–1.5x EV/收入；以战略折价被收购
        - 具备适度规模的液冷公司；展示次规模玩家的低倍数结果
        - Asetek 缺少高溢价 AI 热管理定位；产品架构不同（消费液冷循环）
      - - Iceotope（Series B）
        - 私有 — 面向 AI 的精密液冷
        - $26M Series B（2026 年 5 月）；累计融资 $33.8M
        - 估值未披露；可比早期 AI 冷却初创公司
        - 最接近的私有可比：Series B 阶段、AI 聚焦液冷供应商
        - 未披露估值；机箱级方案不同于芯片级方案
      - - Corintis（Series A）
        - 私有 — 芯片上液冷
        - $25M Series A（2025 年 12 月）；Microsoft 合作
        - 估计投后 $100M+（未披露）
        - 芯片内冷却初创公司，IP 密集且收入前阶段相近
        - 阶段更早；芯片上方案不同于外置冷板方案
      - - Cerebras Systems IPO（2026）
        - IPO — AI 半导体
        - 估值 $26–27B；2025 年收入约 $510M
        - IPO 时约 51x 往绩收入
        - AI 时代高倍数深科技硬件 IPO 的基准
        - Cerebras 收入 $510M，Frore 约 $11M；收入成熟度根本不同
    notes: >-
      上市公司倍数来自 StockAnalysis 和 MarketBeat，截至 2026 年 6 月 18–19 日。私募轮估值按公告口径；并购倍数来自 MergerSight / MarketChameleon 分析。Frore
      2026 年收入为分析师估算，并非公司披露。
    enumerationScope:
