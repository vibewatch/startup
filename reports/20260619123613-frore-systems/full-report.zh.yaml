      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Frore 在 2026 年 3 月 16 日完成 $143 million Series D 融资，由 MVP Ventures 领投，Fidelity Management & Research、Top
              Tier、Mayfield Fund、Clear Ventures、Addition、Qualcomm Ventures、StepStone Group 和 Alumni Ventures
              参投。该轮使公司累计融资达到 $340 million，并以 $1.64 billion 投后估值进入独角兽行列。上一轮 Series C（2024 年 5 月 $80 million）将累计资本推至 $196
              million，对应约 $650 million 投前估值。2018 至 2023 年，公司还通过种子轮、Series A 和 Series B 分批完成了合计约 $116 million
              的早期融资。公司未公开披露现金余额、月度 burn rate 或 runway 估算。考虑到 Series D 明确用于全球制造扩产，公司几乎肯定仍在以显著高于盈亏平衡的速度烧钱。以这个阶段深科技硬件创业公司每月
              $3–8 million 的粗略基准看，$143 million 新资金可支撑 18–48 个月 runway，但这完全只是估算。公司未公开披露任何债务、项目融资义务、信贷额度或可转债。Frore
              对资本高度依赖：它是一家亏损硬件制造商，下一次融资能否推进，将取决于 LiquidJet 是否拿出与具名 hyperscaler 客户相关的 design-win
              动能；保留来源均未按名称确认这些客户。Fidelity Management & Research 同时参与 Series C 和 Series D，是机构信心的重要信号，但 Fidelity
              未必会领投未来轮次。
