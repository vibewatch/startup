  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与模块地图
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，Frore Systems 的产品组合包括两条平台家族，分别服务不同热管理市场。AirJet 边缘 / 消费端平台有四个在售 SKU：AirJet Mini
              Slim（5.25W、2.65mm、最薄；用于超薄笔记本）、AirJet Mini G2（7.5W、2.65mm；当前笔记本、平板、IoT 旗舰）、AirJet Mini Sport（5.25W、IP68
              防水；用于智能手机和运动相机）以及 AirJet PAK G2（即插即用多芯片模块，每个 PAK 最高 34W，IP53；用于工业边缘 AI）。LiquidJet 数据中心平台包括 LiquidJet DLC
              coldplate（面向 AI GPU 的 direct-to-chip 3D jet channel coldplate，从 NVIDIA Blackwell Ultra 起步）和 LiquidJet
              Nexus（面向 NVIDIA Kyber ½U compute tray 的一体化 coldplate 系统）。所有 AirJet SKU 都基于 MEMS 压电驱动，没有机械运动部件；所有 LiquidJet
              产品都使用 Frore 将半导体制造工艺改造到金属晶圆上的流程。NotebookCheck 报道称，AirJet Mini G1（最初的 5W 芯片）已不再出现在官网主推位置，但仍部署在 Sonim
              MegaConnect 等产品中。Frore 的产品路线图瞄准 NVIDIA Rubin、Rubin Ultra 和 Feynman（>4,000W）GPU 的未来 LiquidJet 迭代，并以「Frore's
              Law」承诺为锚：每两年把热性能翻倍。
