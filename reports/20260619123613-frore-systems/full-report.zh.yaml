      - number: '6.3'
        title: 留存、扩张与集中风险
        blocks:
          - type: paragraph
            body: >
              Frore Systems 未公开披露净收入留存（NRR）、总收入留存（GRR）、流失率、cohort 数据或单个客户收入贡献。这种不透明内生于其商业模式：面向 OEM
              的芯片供应商通常会把客户关系视为保密商业协议。收入、ARR 和客户数量同样未披露。

              尽管透明度有限，几个因素指向较稳固的客户关系。AirJet 集成是一项硬件设计决策——一旦 OEM 把 AirJet
              嵌入产品平台，切换散热方案就需要完整的机械和热设计重做，形成高切换成本。Sonim/FirstNet 关系通过 Parsec MegaReach Dock 配件拥有明确扩张路径。YUAN 与 Frore 在
              AirJet PAK 5C G2 发布时同步宣布扩大合作，暗示续约和产品升级周期。Qualcomm 的 Snapdragon X2 Elite 参考设计明确写入每台设备三颗 AirJet Mini G2
              芯片，并在 CES 2026 展示了 10mm 机身中的桌面级（25W+ 持续 TDP）性能，这一 OEM 验证锚定了未来 Snapdragon 平台机会。

              Lenovo 合作由 Lenovo Innovation Accelerator GM Vico Song 定位为评估未来高端产品，而非确认量产。在 Lenovo
              产品出货之前，这段关系提供战略可信度，但不提供收入确定性。

              集中风险偏高。截至 2026 年 6 月，公开与 AirJet 量产或近量产部署相关的具名 OEM 只有四到五家。如果任一单一客户（尤其是
              Sonim/FirstNet）占当前收入很大比例，该客户流失或延迟都会具有高度实质性。LiquidJet/LiquidJet Nexus
              数据中心客户完全未披露，无法判断其处于量产、试点还是收入前接洽阶段。资金充足的竞争者进入，尤其是 xMEMS——它已融资，并瞄准智能手机和 SSD 市场中的相似 OEM 客户——在 Frore 的 AirJet
              Mini Slim 足迹优势较小的细分市场带来客户挖角风险。
