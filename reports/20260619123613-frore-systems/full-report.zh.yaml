              burn-rate 趋势；（3）至少一个具名 hyperscaler 参考客户，确认 LiquidJet 已批量部署；（4）AirJet Mini G2
              当前台湾晶圆厂单位成本与毛利率瀑布。没有这四项数据，估值就完全是前瞻性的，公开来源无法验证。
