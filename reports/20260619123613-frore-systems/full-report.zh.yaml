        Seven publicly or partially disclosed comparables across public equity, M&A, and private financing spanning the
        thermal management and AI semiconductor sectors as of Q2 2026. Coverage excludes non-public private valuations
        for CoolIT, LiquidStack, and other liquid cooling vendors whose terms are undisclosed.
