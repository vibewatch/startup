      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >
              Frore Systems 由两位在 Qualcomm 深耕 MEMS 研究和商业化的工程师共同创办。Dr. Seshu Madhavapeddy（CEO）拥有 IIT Kharagpur 技术学士学位和
              University of Texas at Dallas 计算机科学博士学位。加入 Frore 前，他创办并退出了 Spatial Wireless 和 Sipera Systems 两家公司，并曾任
              Qualcomm VP/GM，主导屏下指纹传感器业务从演示阶段走向商业成功。Dr. Surya P. Ganti（CTO）拥有 IIT Madras BTech 学位和 MIT 机械工程博士学位。在
              Qualcomm 任职期间，他曾担任 Mirasol 反射式显示和超声波指纹传感器产品的 CTO 与工程负责人。Surya 在 MEMS、传感器和柔性电子领域持有 50 多项专利。高管团队还包括 Brandon
              Jung（业务发展 VP）和 Sue Ryan（市场 VP）。关键人物依赖较高：两位创始人掌握核心技术 IP 和商业关系。董事会构成和投资人治理权利未公开披露。截至 2026 年 6
              月，未见重大领导层变动或高管离职报道。员工数按 Equilar 估计为 51–250 人，Tracxn 估计约 79 人；准确数字未获公开确认。
