  - id: TP001
    title: 竞争对手概况表
    enumerationScope:
      coverage: partial
      basis: >-
        Covers commercially active or publicly announced competitors in solid-state active cooling, thin-device
        incumbent cooling, and data center liquid cooling segments as of June 2026; excludes purely academic or
        stealth-stage projects.
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资
      - 目标细分市场
      - 核心差异化
      - 相对 Frore 的关键短板
    rows:
      - - xMEMS (XMC-2400)
        - 直接竞争 – MEMS 固态散热
        - 私营初创公司；2018 年成立；未披露公开融资
        - 智能手机、平板电脑、SSD
        - 9.26 × 7.60 × 1.08 mm；功耗 30 mW；声称单位体积气流为 AirJet Mini Slim 的 16×；IP58 评级
        - 截至 2026 年 6 月未确认客户设备设计定点；单芯片绝对散热瓦数低于 AirJet Mini G2
      - - Phononic
        - 相邻 – TEC 固态散热
        - 私营；据报道 2026 年出售谈判估值约 $1.5B
        - AI 数据中心 GPU 热点、机架散热
        - 软件定义 TEC 平台；毫秒级热响应；可跨 GPU/DPU/NIC 扩展
        - TEC 机制不适合超薄密封边缘设备；能效低于主动气流方案
      - - Boyd Corporation / Aavid (Eaton)
        - 既有厂商 – 均热板、液冷
        - 2026 年预计收入 $1.7B；2025 年 11 月被 Eaton 以 $9.5B 收购
        - 轻薄本、数据中心、航空航天、汽车
        - 产品组合最全；Eaton $9.5B 背书；OEM 认证关系深
        - 均热板不能产生对流气流；密封系统中只能被动散热
      - - Nidec Group
        - 既有厂商 – 微型风扇
