      - number: '6.2'
        title: 具名客户部署与采用证据
        blocks:
          - type: paragraph
            body: >
              公开可得的最强客户证明，集中在四个已确认或已商业发布的部署上。

              2024 年末通过 AT&T FirstNet 商业发布的 Sonim MegaConnect，是置信度最高的量产参考：当前以 $99 促销价 / $499 MSRP 销售，面向急救人员和企业外勤团队，并由
              AT&T 与 FirstNet 独立确认部署。MegaConnect 是全球首款超紧凑 Power Class 1 5G HPUE 移动热点，以掌上尺寸的加固设计发射标准设备 6 倍功率，这一设计由 AirJet
              固态散热支撑；没有 AirJet，满功率 HPUE 运行产生的热量会阻止设备小型化。Parsec 正在开发 MegaReach Dock 配件，将把 MegaConnect 的功率扩展至 12 倍，并同样使用
              AirJet 热管理，进一步巩固平台关系。

              YUAN High-Tech 搭载 AirJet PAK 5C 的 EYE6N0 Series AI cameras 已投入生产，服务 AOI 检测、金属部件检测和包装完整性等工业自动化客户。YUAN GM
              在一篇带客户引述的 PR Newswire 新闻稿中，明确描述了 AirJet PAK 的生产部署。Frore 在宣布与 YUAN 合作的同时发布 AirJet PAK 5C G2（能力从 33W 提升至
              45W），并在 CES 2026 展厅演示了 YUAN 的相机。

              Qualcomm 的 Snapdragon X2 Elite 2-in-1 笔记本和 Mini-PC 参考设计在 CES 2026 展示了三颗 AirJet Mini G2 芯片。Qualcomm
              参考设计可作为全球 OEM 模板，让任何下游 OEM 无需与 Frore 重新开展设计接洽，就能在基于 Qualcomm 的设备中采用
              AirJet。这显著扩大了潜在采用面，不过它仍是设计就绪平台，不是已出货消费设备。

              Crevis（韩国）在 Computex 2025 出货了首款采用 AirJet Mini G2 散热的产品：用于生产线检测的工业 SWIR 相机，证明第二代芯片已在商业规模下真实部署。Iodyne 的 Pro
              Mini SSD 集成 AirJet，用于持续高速数据传输，目标场景是媒体、国防和网络安全边缘工作流；Frore 官网称其可提供「over 3× the sustained performance of the
              typical Pro SSD」。

              SnowGoose Developers' Kit 让 OEM 工程师能在生产承诺前评估 AirJet 集成，暗示除已确认出货客户外，还有一批开发阶段客户漏斗。
