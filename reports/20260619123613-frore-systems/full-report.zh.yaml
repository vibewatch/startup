      - number: '7.5'
        title: 缓释措施、否决标准与尽调请求
        blocks:
          - type: paragraph
            body: >-
              Frore 的缓释措施有意义，但不完整。台湾晶圆厂的 ISO 9001/14001 认证提供质量基线；Qualcomm Ventures 同时担任投资人与伙伴，形成持续推动边缘 AI design-win
              飞轮的激励一致性；200+ 专利组合构成有意义的 IP 护城河，抵御 reverse-engineering。Series D 投资人组合（Fidelity、MVP Ventures、Top
              Tier）暗示机构对商业轨迹有信心。不过，最重要的风险没有披露任何缓释：制造集中在台湾，且没有替代晶圆厂。

              需要监控的 thesis-break 场景包括：（1）到 2026 年 Q4 仍未宣布 hyperscaler LiquidJet design win，表明数据中心转型停滞；（2）Qualcomm 停止搭载
              AirJet 的 Snapdragon X 参考设计，移除主要边缘 AI design-win 放大器；（3）down round 或 Series E 失败，意味着商业里程碑落空后估值被重定价。鉴于 IP
              与关系依赖高度集中，创始人离职也会构成重大触发事件，需要立即升级尽调。

              投资人若考虑建仓，首要尽调请求包括：（1）台湾晶圆厂的业务连续性和地域多元化计划是什么？（2）LiquidJet 的具名 hyperscaler pipeline
              如何，分别处于什么阶段、预计何时落地？（3）是否已有创始人留任协议，且 vesting cliffs 延伸到 Series D 之后？（4）当前现金余额和月度 burn rate 是多少？（5）AirJet 和
              LiquidJet 在 Commerce Control List 下的 ECCN 分类是什么？

              地缘政治背景让这些尽调请求带有时间维度：2022–2026 年的美中技术竞争及相关出口管制收紧，已经为面向中国关联供应链、来自台湾的半导体产品迅速施加限制提供先例。CSIS
              将台湾制造主导地位视为全球技术安全的关键战略 chokepoint，Atlantic Council 的 GeoTech Center 也将其作为半导体硬件公司的持续风险维度跟踪。Frore
              应当制定明确的客户筛查和出口合规文件政策。
