      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >
              Frore 采用 B2B 模式，数据中心和消费板块的最终买方差异显著。数据中心里，三类主要买方是超大规模云服务商（AWS、Azure、GCP、Meta）、托管机房运营商，以及部署本地私有 AI
              基础设施的企业组织。超大规模云厂商在 2025 年占数据中心液冷市场收入的 38.92%，是最主要的即时买方；其采购决策是跨多年的基础设施级承诺。托管运营商是次级买方，会预装可支持液冷的套间，以吸引 AI
              工作负载租户。企业 AI 团队（金融服务、医疗、国防）通常通过服务器 OEM（Dell、HPE、Lenovo）采购，而不是直接购买散热组件。

              数据中心预算通常由大型超大规模云厂商的基础设施 VP 或 CTO 掌握；托管和企业场景则由设施工程或数据中心运营团队掌握。冷却方案通常在服务器机箱选择阶段被指定，因此 Frore
              的主要商业关系不是直接面对超大规模云厂商，而是服务器 OEM，由后者把 LiquidJet 集成进机箱设计。考虑到 OEM 集成认证要求，采购周期很长（12–24+ 个月）。

              消费板块的买方是 PC OEM 产品工程团队。采用触发点来自形态要求：当新笔记本 SKU 追求薄到容不下风扇的尺寸，并承载 AI PC NPU 工作负载时，OEM 工程师会评估 AirJet
              是否能支撑这种尺寸。预算由产品工程 VP 掌握，芯片按单位出货量定价。Frore 必须在产品周期早期赢下参考设计（产品发布前 18–24 个月）。Omdia 预计 2026 年约 50% 的 PC 出货将包含
              NPU，验证了轻薄设备 AI 热管理的市场拉力。

              边缘设备 OEM（工业 IoT、坚固型计算、智能摄像头）构成第三类买方，采购周期更短（约 6–12 个月），决策更集中在 CTO 或工程 VP 手中。这类买方对新技术容忍度更高，但单个 SKU 体量更低。
