            body: >-
              Vertiv $15B 订单积压（同比增长 109%）、Modine $4B 长期数据中心供货协议，以及 Gartner 对 2026 年数据中心系统支出同比增长 55.8% 的预测，都确认 AI
              基础设施建设是真实的，热管理也是关键瓶颈。这股结构性顺风利好 Frore，也支持它相对传统热管理倍数获得战略溢价。问题不在于市场是否存在，而在于 Vertiv、Eaton-Boyd
