  - id: TV005
    title: 论点破裂与终止触发器
    columns:
      - 触发器
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - LiquidJet 收入未能落地
        - FY2027 年底前收入低于 $20M，且没有具名超大规模客户
        - 核心数据中心论点无法验证；收入停滞时 149x 倍数压缩到 75–100x
        - 升级为回避；退出二级仓位；不按当前估值参与 Series E
      - - Series E 下轮融资
        - Series E 投后估值低于 Series D 的 $1.64B 标记
        - 证实市场下修超大规模客户牵引预期；投资人基础开裂
        - 论点立即破裂；复核股权结构中的结构性保护；跟踪困境退出可能
      - - Qualcomm Snapdragon 参考设计关系终止
        - 下一代 Snapdragon 平台不再搭载 AirJet Mini G2
        - AirJet 放量失去最大 OEM 拉动倍增器；边缘端收入停滞
        - 部分负面；重估乐观情形概率；跟踪 Lenovo/ZOTAC design-win 管线
      - - Series D 资金跑道耗尽且没有规模证据
        - LiquidJet 部署确认前现金储备低于约 $30M（估计到 2027 年末）
        - 资本危机；融资选项只剩困境收购方或惩罚性条款过桥
        - 立即退出或回避；运营烧钱超过预期模型的信号
      - - 现有竞争对手推出等效固态散热产品
        - Vertiv、Eaton 或 Honeywell 在 24 个月路线图内宣布基于 MEMS 的主动散热
        - IP 护城河叙事削弱；规模化前定价权被侵蚀
        - 从跟踪降至继续研究；加大 IP 自由实施审查
    notes: 终止触发器基于定性证据风险评估；未分配概率权重。阈值为指示性口径，需要投资人级别尽调后才能操作化。
    claimRefs:
      - CV004
      - CV005
      - CV009
      - CV022
      - CV028
  - id: TV006
    title: 最终尽调问题
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - LiquidJet 收入与客户身份
        - 具名超大规模客户、合同金额和 2026 年收入运行率
        - 整个数据中心论点和 149x 倍数，都取决于 LiquidJet 能否证明超大规模客户采用
        - 公司 IR 披露；与投资人直接沟通；向 Nvidia/AMD 参考客户做渠道核查
      - - 毛利率与 MEMS 制造经济性
        - 每颗 AirJet 芯片和 LiquidJet 冷板的单位经济性；当前产量下的毛利率 %
        - 深科技硬件公司即使规模化也可能不盈利；毛利结构决定 IPO 准备度
        - 经审计财务或管理账；来自 TSMC/制造伙伴的晶圆厂级成本数据
      - - 股权结构、优先权栈与清算瀑布
        - 投资人持股 %、优先权倍数、参与权、反稀释条款
        - 在 $1.64B 标记下，后期投资人回报取决于优先权栈与普通股待遇
        - 股权结构分析；投资条款清单复核；Series D 投资人材料
      - - Series D 后资金跑道与烧钱率
        - 截至 2026 年 Q2 的实际月度现金烧钱率和现金头寸
        - 估计 $143M 可支撑 18–48 个月（区间很宽）；实际数字决定下一轮融资紧迫度
        - 管理账；CFO 访谈；用员工数交叉验证（约 79 名员工对应 $3–8M/月基准）
      - - 相对 Vertiv/Eaton-Boyd 的竞争护城河耐久性
        - Frore 工程路线图，对比 Vertiv 液冷管线和 Eaton-Boyd 的 $9.5B 能力收购
        - 既有厂商资本实力更强；护城河耐久性决定溢价收购还是被替代风险
        - 产品路线图披露；专利版图分析；Vertiv/Eaton 产品目录复核
      - - 董事会构成与治理
        - 董事会成员身份、投资人治理权利以及任何关联方冲突
        - 未披露治理让战略决策和潜在流动性事件变得不透明
        - 公司披露；SEC Form D 文件；LinkedIn 董事会搜索；投资人公告新闻稿
    notes: 尽调事项按对投资建议的重要性排序；第 1–3 项为阻断项，缺少这些证据，建议无法上调到继续研究以上。
    claimRefs:
      - CV001
      - CV003
      - CV022
      - CV027
      - CV046
