            title: Frore's Law：热性能每两年翻倍
            body: >
              Frore Systems 把「Frore's Law」定义为一项战略承诺：每两年让散热芯片的热性能翻倍，类似半导体缩放中的 Moore's Law。AirJet Mini G2 在一到两年的产品周期内相较 G1
              提升 50%。如果 Frore 能守住这条路线图，就意味着其创新速度具备防御性，传统风扇和散热片厂商难以轻易复制，从而强化技术护城河的耐久度。
