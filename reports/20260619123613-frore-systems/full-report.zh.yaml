      - number: '8.2'
        title: 估值背景、入场分析与可比倍数
        blocks:
          - type: paragraph
            body: >-
              按 $1.64B 的投后估值计算，Frore 的估值约为预估 2026 年收入 ~$11M 的 149x——即便放在 AI 时代的风险投资标准里，这个倍数也极端。作参照，领先的上市数据中心热管理公司 Vertiv
              Holdings，2025 年收入 $10.2B，过去十二个月 PS 为 11.8x；按 2026 年 $13.5– 14.0B 指引计算，前瞻收入倍数约为 8.7–9.5x。正激进转向数据中心的热管理专家
              Modine Manufacturing，FY2026 收入 $3.2B，过去十二个月 EV / revenue 约为 3.25x。Eaton-Boyd Thermal 并购交易（以 $9.5B 收购 2026
              年收入 $1.7B 的业务）意味着，一个成熟、盈利且有规模的液冷业务，收入倍数为 5.6x。即使是 2026 年 IPO 的明星 AI 半导体独角兽 Cerebras Systems，也只拿到 51x
              的过去十二个月收入倍数——而它的收入基数是 $510M。

              Frore 的 149x 倍数，一部分来自 LiquidJet 数据中心机会里嵌入的期权价值：如果 Frore 到 FY2027–28 能做到 $100M+ 收入，隐含前瞻倍数会降到 ~16x，接近 Vertiv
              的过去十二个月区间。但没有公开证据显示 LiquidJet 已跨过 hyperscaler 采购门槛，因此当前价格完全是在押注未来执行。入场纪律要求：估值要在当前价格下说得通，必须先独立核验 LiquidJet
              在具名客户中的设计定点。Frore 股份没有公开可得的二级市场定价数据；Forge Global 列出了 Frore，但没有提供交易历史。公司累计融资 $340M，估值一路抬升（种子轮投前约
              ~$30M；Series C 约 ~$650M；Series D 投后 $1.64B），带来稀释压力：早期投资者握有最大的上行期权，后进投资者则必须依赖证据大幅跃迁，才能拿到有吸引力的风险调整回报。
