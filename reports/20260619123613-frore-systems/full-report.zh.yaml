      - number: '8.5'
        title: 最终尽调问题与打破投资判断的触发项
        blocks:
          - type: paragraph
            body: >-
              核心尽调缺口是 LiquidJet 的商业化进展：如果没有公开或保密披露的具名 hyperscaler 客户及对应收入 run rate，$1.64B
              估值就完全是叙事倍数。第二层尽调重点包括：规模化后的毛利率与制造经济性（判断 MEMS 冷板模型在收入 >$50M 时是否盈利）、股权结构和优先权栈（理解清算优先权以及后期投资者的回报门槛）、Vertiv 与
              Eaton-Boyd 的竞争回应（它们有资本在不受初创公司收入约束的情况下匹配 Frore 的技术主张）。放弃标准包括：（1）到 FY2027，LiquidJet 收入未超过
              $20M，且没有披露具名客户；（2）Series E 以低于 $1.64B 的估值 down-round；（3）AirJet 失去 Qualcomm Snapdragon 参考设计关系；（4）Frore 到
              2026 年底仍未建立 hyperscaler 部署合同，却已烧完 Series D 资金；（5）某大型 incumbent 宣布固态冷却产品，并在 24 个月路线图内复制 AirJet
              在边缘设备上的性能。任一触发项出现，建议都应从 research-more 转为 avoid。
