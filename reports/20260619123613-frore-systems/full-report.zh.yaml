      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >
              Frore Systems 自成立以来多轮累计融资 $340M。早期支持来自 Mayfield Fund 和 Clear Ventures，约 2019 年参与种子轮，约 2021 年参与 Series A。公司
              2021 年 12 月完成 Series A-II 追加融资，2022 年 12 月完成 Series B。首个大型机构轮是 2024 年 5 月的 $80M Series C，由 Fidelity
              Management and Research Company 领投（Prosperity7 Ventures 作为重要共同投资方），使累计融资达到 $196M。2026 年 3 月，Frore 完成由 MVP
              Ventures 领投的 $143M Series D，Fidelity、Top Tier、Mayfield Fund、Clear Ventures、Addition、Qualcomm
              Ventures、StepStone Group 和 Alumni Ventures 参投，公司估值达到 $1.64 billion。Series D 中 Qualcomm Ventures 加入，同时
              Mayfield 持续参投（管理合伙人 Navin Chaddha 在公告中被引用），显示公司与主要半导体生态参与者的战略协同较强。股权比例、董事席位分配，以及任何债务或授信安排均未公开披露。未见二级交易报道。
