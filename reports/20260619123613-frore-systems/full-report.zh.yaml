            body: >
              Frore Systems 同时覆盖 AI 计算谱系的两端：AirJet 瞄准边缘和消费 AI 设备（轻薄笔记本、工业 IoT 网关、5G 热点），适用于风扇不现实的场景；LiquidJet 和
              LiquidJet Nexus 则瞄准冷却 NVIDIA GPU 的超大规模 AI 数据中心。这种双市场定位让 Frore 可同时承接消费 AI 设备浪潮和 AI 基础设施建设，降低对单一细分市场的依赖。
