      - number: '5.5'
        title: 信任、安全与质量控制
        blocks:
          - type: paragraph
            body: >
              Frore Systems 对产品线采用行业标准认证和测试体系。AirJet Mini Sport 达到 IP68 认证（在 >1.5m 水中浸泡 30 分钟后可完全恢复性能），官网产品页已确认。AirJet
              PAK G2 符合 IP53（防尘、防水）要求。Sonim MegaConnect 是公开资料最充分的 AirJet 部署，满足加固通信硬件的 MIL-STD-810G 耐久性要求。AirJet Mini G2
              连续三年获得 CES Innovation Awards（2024、2025、2026），其中防水 AirJet Mini Sport 被评为「most innovative
              technology」。Embedded World 2025 评委会将 AirJet PAK 与 NXP Semiconductors、Texas Instruments 一同列入 SoC/IP/IC
              设计类别候选。截至 CES 2024，Frore CTO 确认 AirJet 在商业 design-in 之前，已通过主要 OEM 客户的 5 年寿命可靠性测试。截至 2026 年 6 月，未发现针对 Frore
              Systems 或 AirJet 产品的公开 CVE 报告、产品安全召回、FCC 违规或监管执法行动。LiquidJet
              的信任成熟度较低：除公司声明外，该产品没有独立认证清单；数据中心客户需要自行做资格测试。Frore 位于台湾的半导体制造流程受晶圆代工运营内生的 TSMC 式质量控制约束，但 Frore
              未公开具体制造伙伴或质量审计报告。
