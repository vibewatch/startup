      - number: '1.4'
        title: 产品与技术
        blocks:
          - type: paragraph
            body: >
              截至 2026 年中，Frore Systems 有三款主要产品。AirJet Mini G2 是第二代固态主动散热芯片，面向边缘和消费设备。单个模组可带走 7.5W 热量，噪声仅 21 dBA，功耗
              1.2W，尺寸为 27mm × 41.5mm × 2.65mm，重量 7 克。它产生 1,750 Pa 背压，约为风扇的 10×，从而支持防尘、防水设备设计。多个 G2 芯片可堆叠使用：四颗芯片合计带走约 30W
              热量。相较第一代 AirJet Mini G1（5.25W），G2 提升 50%。LiquidJet 是面向数据中心的多级 3D 短回路喷射通道直接液冷（DLC）冷板，宣称相较标准冷板，传热效率高 75%，GPU
              温度低 8°C，AI tokens per second 高 4%，PUE 低 10%。LiquidJet Nexus 是面向 NVIDIA Kyber ½U 计算托盘的集成冷板系统，可让单机架计算密度提升
              2×，热堆栈重量降低 65%，取消软管和歧管，并支持 53°C 入口温度。Frore 所有产品都基于 MEMS 压电驱动技术，底层专利包括 2026 年获授权的 US12635413B2、US12581620B2
              和 US12565419B2。Frore 提出「Frore's Law」：目标是每两年让热性能翻倍。
