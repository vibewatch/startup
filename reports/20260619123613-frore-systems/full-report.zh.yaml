      - number: '4.5'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              Frore Systems 的核心财务结论是：这是一家站在拐点上的深科技硬件公司，正在从面向消费端边缘设备的芯片业务（AirJet）转向数据中心基础设施平台（LiquidJet）；收入真实存在，但相对 $1.64
              billion 估值仍然很小。收入质量的矛盾很根本：公司唯一经公开验证的收入来自消费电子和边缘 AI 领域的具名 OEM design wins，而估值溢价几乎全部压在尚未公开确认大规模 hyperscaler
              部署的数据中心散热机会之上。若 2026 年收入估算约为 $11 million，隐含收入倍数约 149x，即便放在 AI 时代的创投市场也极高；TheCoolingReport 明确称 $1.64
              billion 估值「对这个品类而言非同寻常」，并指出整个浸没式冷却市场预计到 2032 年也只有 $2.54 billion。资本密集会长期嵌在这个商业模式里——MEMS
              半导体制造、台湾晶圆厂运营、数据中心硬件集成，都天然需要 CAPEX 和库存，难以走轻资本盈利路径。两个主要尽调阻断项是：（1）没有任何具名 hyperscaler 或云客户公开确认 LiquidJet
              部署，外部无法验证数据中心收入爬坡；（2）burn rate、现金余额和单位经济性完全不透明，无法独立判断 runway 是否充足。
