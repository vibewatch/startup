      - number: '5.4'
        title: 差异化、IP 与竞争护城河
        blocks:
          - type: paragraph
            body: >
              Frore Systems 在 AirJet 上的主要技术差异化来自四项叠加优势：（1）固态运行、无运动部件，让无风扇设备也能保持持续性能；（2）行业领先的 1,750 Pa 背压，支持防尘、防水的 IP
              等级集成，这是风扇散热无法做到的能力；（3）可扩展芯片架构，多个芯片堆叠可线性提升散热能力；（4）自主 Thermoception，可在不接入主机设备传感器的情况下完成温度感知和优化。LiquidJet
              的差异化根植于半导体制造工艺：该工艺能做出传统 skiving 或 stamping 无法制造的 3D 微结构，带来按 GPU 功率地图定制的设计和可扩展制造能力。Frore 的专利组合覆盖多项 2026
              年获批专利，包括 US12581620B2、US12565419B2 和 US12635413B2；CTO Dr. Surya Ganti 个人持有 50 多项 MEMS 专利。第三方验证包括连续三年 CES
              Innovation Awards（2024、2025、2026）、Embedded World 2025 提名（与 NXP Semiconductors、Texas Instruments 同列）以及
              Intel VP of Mobile Platforms 背书。AirJet Mini G2 获得 Computex 2026 Best Choice Award。Qualcomm Ventures 参与
              Series D 投资，进一步凸显其与半导体生态领导者的战略协同。不过，LiquidJet 的竞争性主张尚未与 Aavid、Boyd（被 Eaton 收购）、Vertiv 或 Laird
              等既有厂商做独立基准测试；75% 热传递效率提升这一具体数字仍由公司自行声称，缺少第三方验证。
