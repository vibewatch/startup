            title: 反向发现：未确认的数据中心收入，却按完美执行定价
            body: >-
              独立分析指出，考虑到 Series C 时 Frore 所处规模对应的整个浸没 / 液冷细分市场预计只有 $2.54B，$1.64B 估值对这个品类来说“异常”。从 $680M 投前（Series C）跳到
              $1.64B 投后（Series D），不到两年提升 141%，隐含资本效率比为 4.8x——只有 LiquidJet hyperscaler 叙事几乎完美落地，才能避免未来下调估值。在收入估计约
              ~$11M、Eaton–Boyd M&A 基准为成熟液冷业务收入 5.6x 的背景下，当前标记与证据支撑价值之间的缺口很大。
