  - id: FR001
    title: 风险热力图 — Frore Systems 严重性与可能性矩阵
    type: matrix
    layout: wide
    summary: 按影响程度（行）和发生可能性（列）绘制 Frore 的主要风险，并在单元格文字中标出缓释成熟度；未缓释的关键 / 高可能性风险位于右上角。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 关键影响
          values:
            - —
            - 下轮降估值 / Series E 失败
            - 台湾晶圆厂中断（单一来源，无 BCP）
        - label: 高影响
          values:
            - IP 诉讼（xMEMS FTO 缺口）；产品可靠性召回
            - CEO/CTO 离职；Qualcomm 参考设计撤回；NVIDIA 平台变化；xMEMS 进入笔记本
            - 数据中心 LiquidJet 转向失败；超大规模客户管线未验证
        - label: 中等影响
          values:
            - 环境 / OSHA 监管缺口
            - ECCN 出口管制违规；OEM 设计周期延误；资本充足性短缺
            - 既有液冷厂商（Vertiv、Eaton/Boyd）的竞争压力
        - label: 低影响
          values:
            - 台湾环境合规审计缺口
            - 数据中心销售团队缺口；Lenovo 合作停滞
            - 人才获取风险（湾区竞争）
    approximationNotes: 可能性和影响仅基于公开证据做定性评估；实际概率分布需要内部运营和财务数据。
