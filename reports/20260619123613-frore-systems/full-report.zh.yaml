  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Frore Systems 的投资论点建立在三条互相扣合的主张上。第一，散热已经成为 AI 计算扩展的硬约束：GPU rack 密度逼近 100 kW，传统风冷在物理上不再够用；Frore 的固态 MEMS
              技术同时服务边缘端（AirJet）和数据中心（LiquidJet）。第二，Frore 已积累显著可防御 IP——约 200 篇相关公开文献和专利、8 年 MEMS 制造经验，以及经验证的 Qualcomm
              参考设计关系——为快速跟随者设置障碍。第三，热管理市场正在快速扩张：IDC 预计 AI 数据中心液冷市场 2026 年为 $6.41B，到 2033 年增长至 $29.5B，CAGR 为
              20–26%；Gartner 预计 2026 年数据中心系统支出同比增长 55.8%。

              反论点同样有力。LiquidJet 收入尚未被任何具名 hyperscaler 或云运营商公开确认，数据中心论点无法验证。AirJet 消费 / 边缘细分市场虽已商业验证，但相对于 $1.64B
              估值，绝对收入规模有限。既有液冷玩家——Vertiv（$128.7B EV、$15B backlog）和 Eaton（2025 年 11 月以 $9.5B、22.5x EBITDA 收购 Boyd
              Thermal）——在资本、渠道关系和 hyperscaler 采购信任上都远大于 Frore。4.8x 的资本效率比（估值 /
              累计融资）说明投资人正在为极激进的增长爬坡定价，而这种爬坡尚未在公开记录中兑现。AI 基础设施建设若放缓，或 LiquidJet 细分市场出现竞争替代，当前 $1.64B 估值就缺少支撑。
