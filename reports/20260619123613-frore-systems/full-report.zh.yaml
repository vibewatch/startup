      - number: '5.3'
        title: 部署、集成与开发者生态
        blocks:
          - type: paragraph
            body: >
              OEM 集成 AirJet 需要硬件级设计工作：OEM 先按热包络、外形尺寸和目标 IP 等级选择 AirJet SKU，再把导热扩散片、风道、防尘滤网和 4-pin 电源 /
              控制接口设计进设备。为支持原型验证，Frore 提供 SnowGoose AirJet Developer's Kit——面向计划未来商业化产品集成的制造商——内含原型评估所需全部组件，并为未来 AirJet
              产品提供升级包。这是一套专有硬件开发者套件；截至 2026 年 6 月，AirJet 没有公开 GitHub 仓库、npm 包或开放 API 文档，与其 B2B OEM 模式一致。开发者社区层面的验证来自
              Linus Tech Tips（LTT）：该频道独立把三颗 AirJet Mini 芯片装入一台 MacBook Air 并全程拍摄，确认性能提升
              67%，向实践者受众展示了技术的真实集成潜力。同样，armdevices.net 的视频评测者在 CES Las Vegas 2026 独立评估了面向 Jetson Orin NX Super 级设计的
              AirJet PAK 5C-G2，确认其在目标 40W 运行下具备「fanless-like industrial attributes」，并将散热硬件体积降低 80%。两项验证均被 Frore
              公开引用。Intel Evo 合作——由 Intel VP/GM Mobile Platforms 背书——表明 AirJet 已进入未来 Intel Evo 轻薄笔记本路线图。截至 2026 年 6
              月，已确认的商业部署包括 Sonim MegaConnect HPUE 5G hotspot（AT&T FirstNet）、Qualcomm Snapdragon X2 Elite 2-in-1 参考设计（6mm
              机身内 18W TDP）以及 Lenovo Innovation Accelerator 面向未来 Lenovo 产品的合作。LiquidJet 方面，SnowGoose
              套件不面向数据中心客户；数据中心集成需要直接与 Frore 接洽。
