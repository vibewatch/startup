      - number: '2.2'
        title: 市场规模与估算
        blocks:
          - type: paragraph
            body: >
              评估 Frore 可服务机会需要多重视角，因为分析师定义从很窄（只看数据中心液冷模组）到很宽（整个热管理硬件加软件市场）跨度很大。下方数字按范围列出关键市场规模估算，并明确说明定义分歧。

              主要 SAM（数据中心液冷）方面，Mordor Intelligence（2026）估计该市场 2025 年为 $5.52B，到 2031 年增至 $18.79B，CAGR 为 22.65%。直达芯片冷却占
              2025 年支出的 42.85%（$2.37B），是与 LiquidJet 最相关的子板块。MarketsandMarkets 估计数据中心热管理市场（略宽，包含部分基础设施冷却）2025 年为
              $12.28B，到 2032 年增至 $24.00B，CAGR 为 10.1%。Allied Market Research 估计更宽泛的数据中心冷却市场（包含设施级冷却）2023 年为 $18.7B，到
              2033 年增至 $80.1B，CAGR 为 15.7%。

              消费 / 边缘 AI 板块方面，Precedence Research 估计 AI PC 市场 2025 年价值 $58.07B，并预计到 2035 年达到 $321.41B，CAGR 为
              18.66%。AirJet 芯片会作为嵌入 AI PC 的组件，只是该市场的子组件，不等于整个市场。全球笔记本市场为 $171.89B（2025，Mordor Intelligence），CAGR 为
              8.24%；游戏笔记本 CAGR 为 9.16%，是 AirJet 凭热余量切入的关键目标细分。

              相互矛盾的估算反映的是范围差异：Precedence Research 的数据中心冷却数字（2025 年 $81.88B）包含设施 HVAC 和精密冷却，不只是芯片级模组。投资人应把 Mordor 的
              $5.52B 估算（窄口径，仅液冷模组）作为 Frore 的主要 SAM，只把更宽口径数字用作上限参照。
