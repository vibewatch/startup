  - id: TV002
    title: 投资论点 vs. 反论点
    columns:
      - 论点
      - 支持证据
      - 何种证据会改变判断
    rows:
      - - 论点：冷却是 AI 算力扩展的硬约束
        - GPU 机架密度接近 100 kW；Vertiv $15B 积压订单显示需求
        - 竞争性冷却方案（后门式、浸没式）以相当成本替代 direct-to-chip MEMS 的证据
      - - 论点：Frore 拥有可防御的半导体级冷却 MEMS IP
        - 约 200 篇发表物 / 专利；AirJet 获 CES Innovation Awards 2024–2026；Qualcomm 参考设计
        - xMEMS 或其他固态进入者通过专利规避实现同等性能
      - - 论点：LiquidJet 可触达市场大，且增长很快
        - IDC：AI DC 液冷 2026 年 $6.41B，2033 年达 $29.5B；direct-to-chip 约占 47%
        - 市场规模兑现，但老牌厂商（Vertiv、Eaton-Boyd）拿走 >90% 出货量
      - - 论点：战略投资者阵容释放持久支持信号
        - Qualcomm Ventures（参考设计伙伴）、Fidelity（机构信心）、MVP Ventures（领投）
        - 关键投资者退出；跨轮内部支持消失
      - - 反论点：LiquidJet hyperscaler 收入尚未确认
        - 未具名 hyperscaler 客户、无收入披露；AirJet 边缘收入不高，估计约 $11M
        - 公开确认 ≥2 个 hyperscaler 设计导入胜单，且收入 >$20M
      - - 反论点：老牌厂商在资本和渠道上压过 Frore
        - Vertiv EV $128.7B、积压订单 $15B；Eaton 斥资 $9.5B 收购 Boyd Thermal 以锁定液冷 IP
        - Frore 证明单位经济性和毛利率优于成熟供应商
      - - 反论点：149x 收入倍数已定价近乎完美执行
        - 分析师估计 2026 年收入约 $11M，对比 $1.64B 估值；即便 Cerebras IPO 也只是 $510M 收入上的 51x
        - 收入爬坡至 $100M+，IPO 时远期倍数压缩到 15–20x
    notes: 论点 / 反论点配对来自公开证据；所有 Frore 收入数字都是分析师估计，不是披露数字。
