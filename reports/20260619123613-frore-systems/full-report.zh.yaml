      - number: '8.3'
        title: 情景分析与概率加权展望
        blocks:
          - type: paragraph
            body: >-
              三个情景刻画了 LiquidJet 与 AirJet 在不同执行路径下的远期估值。牛市情景假设：LiquidJet 在 2026 年赢下两个或更多具名 hyperscaler 部署，AirJet 借助
              Snapdragon 参考设计的 OEM 拉动加速渗透。若 FY2027–28 收入达到 $50–100M，并按 30–40x 前瞻收入计价，IPO 或被收购时的企业价值可达 $1.5–4.0B，相比 2026
              年末投资者面对的 $1.64B 标记仍有可观上行。基准情景假设：LiquidJet 进展温和（一个已确认 hyperscaler 参考客户），AirJet 在边缘 AI 和轻薄 PC
              形态中稳步推进，FY2027–28 收入达到 $20–30M。按 10–15x 前瞻收入倍数计算（反映执行不确定性折价），隐含 EV 为 $200–450M——较当前标记明显下调。Series E
              大概率以平轮或小幅上调完成。熊市情景假设：LiquidJet 在 hyperscaler 液冷市场被 Vertiv / Eaton-Boyd 挤压，AirJet 消费端采用在大宗化 PC
              下行周期中停滞，收入无法证明持续高于 $15M。按 $3–8M / 月的烧钱速度，$143M Series D 资金可支撑 18–48 个月跑道（估算）；若缺少 hyperscaler
              采用证据，之后就可能进入困境融资或 down-round。这个反向结果少见，但在 incumbent 资本优势下，结构上并非不可能。

              市场环境支撑一个不可忽视的牛市概率：Gartner 称 2026 年数据中心系统支出同比增长 55.8%；JLL 预计到 2030 年将出现 $1–2 trillion 的 IT 基础设施浪潮；Vertiv 的
              $15B 积压订单也说明需求信号真实存在。核心不确定性在于 Frore 在这波浪潮中的位置——LiquidJet 会成为下一代 Nvidia Rubin / Blackwell Ultra
              的优选冷却方案，还是把企业市场让给既有 HVAC 与液冷巨头。
