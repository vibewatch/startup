chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >
              Frore Systems 是一家硅谷半导体公司，面向 AI 时代设计先进热管理技术。公司 2018 年成立于加州圣何塞，开发两条清晰产品线：AirJet，面向边缘、消费和工业 AI
              设备的全球首款固态主动散热芯片；以及 LiquidJet，面向超大规模 AI 数据中心的直接液冷平台。两条产品线都采用半导体制造工艺，核心是基于 MEMS
              的压电驱动，在紧凑、高密度环境里提供传统风扇和散热片难以匹配的散热性能。Frore Systems 目前处于 Series D 阶段，独角兽估值为
              $1.64B。公司总部位于硅谷，在台湾设有制造业务，并在韩国设有办公室。其专利散热技术已集成进全球主要 OEM 和系统制造商产品，覆盖消费电子、工业 IoT、关键任务通信和 AI 数据中心基础设施。商业模式是
              B2B：Frore 向 OEM 和系统制造商授权并销售散热芯片与集成热模组，由后者嵌入最终产品。收入和 ARR 未公开披露。
