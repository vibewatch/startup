      - number: '8.4'
        title: 退出准备度与流动性路径
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，Frore Systems 仍是私营公司。二级市场已有活动迹象——Forge Global 列出 Frore，并给出每股 $46.26 的占位价格，意味着 IPO
              前二级市场存在兴趣——但没有公开可确认的二级交易量。TechStackIPO 给 Frore 的 IPO 准备度评分为 64 /
              100，理由是技术实力和融资背书较强，同时指出规模化收入不可见、hyperscaler 客户披露缺失，是准备度缺口。主要退出路径有两条：（1）由电力 / 热管理
              incumbent（Vertiv、Eaton、Schneider Electric）战略收购，以补齐半导体级 MEMS 冷却能力；退出倍数大概率锚定在已验证收入 run rate 的收入倍数（5–10x）或
              EBITDA 倍数（15–25x）；（2）以高于 Series D 标记的估值 IPO，最低要求是连续两到三个季度证明 LiquidJet 收入增长，并有具名 hyperscaler 部署。M&A
              路径更接近短期可行：Eaton-Boyd 交易（$9.5B，22.5x EBITDA）证明，热管理资产一旦在规模上被验证，就能获得高额战略溢价。但 Frore 的收入基数仍太早期，如果没有商业化显著加速，很难支撑
              $1.64B 的溢价收购。IPO 路径至少需要 $50–100M 年化收入，以及可信的 EBITDA 盈亏平衡路径。截至 2026 年 6 月，两项门槛都没有公开确认。17 家投资者名单（MVP
              Ventures、Fidelity、Qualcomm Ventures、Mayfield、StepStone、Addition、Top Tier、Alumni Ventures、Clear
              Ventures）会制造流动性压力；到 2028 年，随着基金期限窗口临近，压力还会加大。
