      - number: '7.3'
        title: 伙伴、客户与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Frore 的商业模式高度依赖一组集中的 OEM 和平台伙伴。集成 AirJet Mini G2 的 Qualcomm Snapdragon X2 Elite 参考设计，是公司目前杠杆最高的 design-win
              放大器：如果 Qualcomm OEM 被授权方把 AirJet 作为标准散热组件采用，Frore 就能在无需直接销售成本的情况下撬动大量设备。但这也形成双重集中风险——Qualcomm Ventures
              既是股权投资人，也是设计伙伴；如果 Qualcomm 平台战略变化，或商业条款成为张力点，双方可能出现错位。

              LiquidJet 和 LiquidJet Nexus 明确围绕 NVIDIA 的 Kyber（half-U）外形和 GB300/Rubin GPU 平台架构设计。如果 NVIDIA 的 GPU
              封装架构、热包络或冷却液回路设计变化，Frore 的数据中心产品投入可能被搁浅，并需要高成本重新工程化。截至 2026 年 6 月，没有任何 hyperscaler（AWS、Azure、Google Cloud
              或同类客户）公开宣布量产部署 LiquidJet，数据中心收入论点仍未被证明。

              在边缘散热市场，xMEMS 是一个新兴 MEMS 竞争者，并直接拿 XMC-2400 芯片与 Frore 的 AirJet 对比。xMEMS 称其当前外形下单位体积气流效率高 16x，不过 XMC-2400
              瞄准智能手机和 SSD，而不是 Frore 优先布局的笔记本 / PC 细分市场。在更广泛的数据中心热管理领域，Vertiv、Nidec、Delta，以及现已被 Eaton 于 2025 年收购的 Boyd
              等既有玩家，正在以远大于 Frore 的制造规模和 hyperscaler 关系扩张液冷产品。若没有展示出 hyperscaler 量产部署，Frore 的差异化技术未必足以替代既有热管理供应商。
