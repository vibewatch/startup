  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Frore Systems 的产品组合横跨两个不同战场。在边缘设备战场，AirJet（Mini G2、Mini Slim、PAK 变体）与超薄笔记本、平板、智能手机、边缘 AI 网关和工业 IoT
              设备中的传统主动与被动散热方案竞争。在数据中心战场，LiquidJet 和 LiquidJet Nexus 与用于超大规模和托管设施 AI GPU 冷却的传统 2D 微通道冷板供应商竞争。

              边缘战场最关键的竞争类别是既有方案：轻薄笔记本 OEM 主要依赖微型鼓风风扇（Nidec、Sunon、Delta Electronics），并结合热管和均热板（Boyd/Aavid、Fujikura、Asia
              Vital Components）。这些既有厂商成本优化充分，拥有多年 OEM design-win 关系，并受益于台湾、日本和中国的大型成熟供应链。它们的根本限制是物理层面的：微型风扇会产生机械噪声（通常
              30–50 dBA）、积灰、随时间磨损，并且无法在密封或 IP 等级外壳内维持散热性能。

              AirJet 唯一直接的固态 MEMS 竞争对手是 xMEMS，其 XMC-2400 µCooling 芯片采用压电 MEMS 薄膜，与 AirJet 操作原理相同，但形态尺寸小得多（9.26 × 7.60 ×
              1.08 mm，相比 AirJet Mini G2 的 27 × 41.5 × 2.65 mm）。xMEMS 瞄准智能手机、平板和 SSD，AirJet 目前尺寸过大，难以覆盖这些场景。第二个潜在进入者是
              Phononic，这是一家热电（TEC）制冷公司，瞄准 AI 数据中心 GPU 热点冷却，采用软件定义 TEC 模组；Phononic 的机制和目标市场与 Frore 根本不同，但长期可能在边缘 AI
              设备上收敛。

              邻近威胁来自数据中心领域的大型企业液冷供应商——Boyd Thermal（将以 $9.5B 被 Eaton 收购）、CoolIT Systems、Submer 和
              LiquidStack——它们拥有既有基础设施服务能力和超大规模云厂商关系，是 LiquidJet 采用面临的主要竞争门槛。下文按规模、差异化和威胁严重度梳理各类供应商。
