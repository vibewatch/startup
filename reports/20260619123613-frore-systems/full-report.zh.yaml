      - number: '2.5'
        title: 证据缺口与尽调路径
        blocks:
          - type: paragraph
            body: >
              一手来源研究后，几项关键市场事实仍未解决。第一，Frore Systems
              不公开披露收入、ARR、客户数量或市场份额，无法从自下而上的证据三角验证公司当前覆盖了数据中心液冷市场的多大比例。所有已审阅来源都没有给出 Frore 具体 SAM 渗透率的分析师估算。

              第二，Frore 宣称相较传统冷却多带走 75% 热量，这是公司自述的性能数字，尚未在任何公开技术出版物中获得独立基准测试验证。该主张是 LiquidJet 价值主张的核心；若获验证，将实质增强尽调信心。

              第三，目前没有公开可得、专门针对压电或固态主动散热市场的独立市场规模研究，只有更宽泛的热管理和液冷市场报告。这使得 AirJet TAM 难以精确量化。

              第四，不同分析师给出的数据中心冷却市场估算相互冲突（Mordor 窄口径 $5.52B，Precedence Research 宽口径 $81.88B），说明定义并不一致。尽调应要求 Frore
              说明内部采用哪家分析师的市场定义，并提供支持其 SAM 估算的自有市场情报。

              尽调路径包括：（1）要求 Frore 分享匿名化客户管线数据，以及任何已签署的 LiquidJet Nexus design win；（2）委托独立机构测试 LiquidJet
              与竞争性直达芯片方案的热性能；（3）要求 Frore 提供内部 TAM/SAM 模型并披露方法；（4）访谈 3–5 位超大规模云基础设施 VP，了解其冷却技术评估流程以及采用创业公司供应商的可能性。
            claimRefs:
              - CM048
              - CM049
