  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与 IP 风险
        blocks:
          - type: paragraph
            body: >-
              Frore Systems 所处监管环境主要受美国 Export Administration Regulations（EAR）约束，由 Bureau of Industry and
              Security（BIS）管理。作为一家设计 MEMS-based 主动散热芯片并向全球 OEM 销售的半导体硬件公司，Frore 产品可能带有 Export Control Classification
              Number（ECCN）分类，对受控目的地出货需要出口许可。AirJet 和 LiquidJet 的具体 ECCN 尚未公开披露；公司在向敏感市场做跨境商业扩张前，必须通过内部法律审查补齐这一缺口。2022 年
              CHIPS and Science Act 对与美国相关的半导体制造商带来额外义务，包括对 CHIPS Act 资金接受方设置 10 年护栏，限制其在中国半导体扩张中的新增投资；虽然 Frore 未确认收到
              CHIPS Act 资金，但这一监管体系会塑造其台湾晶圆厂伙伴关系和未来美国本土制造考虑的竞争环境。

              知识产权方面，Frore 持有庞大且仍在增长的专利组合，200 多篇相关公开文献覆盖 MEMS 驱动、压电驱动、防水和制造方法。2025–2026 年获批的核心专利包括 US 12,635,413（MEMS
              cooling systems 的压电驱动）、US 12,581,620（出口通道配置）和 US 12,538,450（防水 MEMS flow systems）。截至 2026 年 6 月，公开记录中未发现涉及
              Frore Systems 的专利诉讼、inter partes review（IPR）程序或已知 IP 挑战。不过，xMEMS 作为直接 MEMS 散热竞争者出现，带来了前瞻性的
              freedom-to-operate（FTO）风险，需要主动分析双方专利组合的权利要求重叠。

              政府客户方面，Frore 部署在 FirstNet 公共安全网络上的 AT&T Sonim MegaConnect 中，使公司连接到受 CISA 管辖的关键通信基础设施。这让 Frore 面临超出普通商业 OEM
              合同的供应链安全要求，包括潜在安全评估，以及用于美国联邦网络的台湾制造部件的原产地审查。
