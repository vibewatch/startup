  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与市场分层
        blocks:
          - type: paragraph
            body: >
              Frore Systems 采用纯 B2B 芯片与模块供应模式：公司设计并制造 AirJet 固态主动散热芯片和 LiquidJet/LiquidJet Nexus 液冷 coldplate，再销售或授权给
              OEM 设备制造商和系统构建商，由后者把技术集成到自有品牌产品中。终端用户（急救人员、工厂操作员、笔记本消费者、数据中心运营商）只会通过这些 OEM 客户的产品接触 Frore 技术。公司没有
              direct-to-consumer 渠道，没有 SaaS 订阅模式，也没有公开披露定价或销量。

              截至 2026 年 6 月，Frore 有文件支持的客户分布在三大市场。公共安全和任务关键通信领域，Sonim Technologies 在 MegaConnect 5G HPUE 移动热点中部署 AirJet
              Mini，该产品通过 AT&T FirstNet 以 $99–$499 销售，面向急救人员、公用事业和需要高功率 Band 14 连接的企业。工业边缘 AI 领域，YUAN High-Tech 的 EYE6N0
              Series AI cameras（CES 2026 EE Times Asia Award 获奖产品）运行 AirJet PAK，用于 AOI 检测、金属部件缺陷检测、包装验证、自动分拣以及
              barcode/OCR 识别。韩国机器视觉相机制造商 Crevis 是首家在 Computex 2025 出货搭载 AirJet Mini G2 产品的 OEM，目标场景是短波红外（SWIR）工业成像。消费和边缘
              AI 设备领域，Qualcomm 提供了集成三颗 AirJet Mini G2 芯片的 2-in-1 笔记本和 Mini-PC 参考设计，验证该芯片可用于 Snapdragon X2 Elite
              级轻薄设备。Lenovo 在 Computex 2026 宣布与 Innovation Accelerator 合作，探索在未来高端产品中采用 AirJet，但尚无量产设备出货。Iodyne 提供 Pro
              Mini，号称全球首款采用 AirJet 固态主动散热的 SSD，目标客户是媒体与娱乐、国防和网络安全专业人士。

              Frore 称其技术已出现在「全球主要 OEM 和系统构建商」产品中，但未披露完整客户名单。截至 2026 年 6 月，LiquidJet 和 LiquidJet Nexus
              的数据中心客户仍完全未披露，这对公司增长更快产品线的尽调构成重大缺口。
