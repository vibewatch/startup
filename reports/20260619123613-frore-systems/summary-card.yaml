  topStrengths:
    - >-
      Differentiated MEMS-based thermal IP with granted 2026 patents, strong founder-market fit, and clear technical
      advantages over legacy fan-based cooling in thin edge devices.
    - >-
      Fresh capital support from a blue-chip investor set including MVP Ventures, Fidelity, Qualcomm Ventures, Mayfield,
      and others, which extends runway and validates strategic relevance.
    - >-
      Commercial proof spans Qualcomm reference designs, Sonim/AT&T FirstNet hardware, and multiple OEM and
      embedded-system deployments that show AirJet is beyond lab-demo stage.
    - >-
      Large and growing AI-compute thermal-management opportunity across both edge inference devices and data-center
      liquid cooling.
  topRisks:
    - >-
      The $1.64B Series D valuation implies an extreme multiple on estimated 2026 revenue and leaves little room for
      execution misses.
    - >-
      The core upside thesis depends on LiquidJet winning named hyperscaler or major OEM deployments that are still not
      publicly confirmed.
    - >-
      Incumbent thermal-management companies such as Vertiv, Eaton-Boyd, and other liquid-cooling vendors have more
      channel power, manufacturing scale, and procurement trust.
    - >-
      Private-company disclosure is thin: audited revenue, margin, burn, customer concentration, and
      cap-table/preference terms remain unavailable.
    - >-
      Manufacturing and supply-chain concentration in Taiwan and a narrow founder-led technical base increase
      operational and key-person risk.
  unresolvedGaps:
    - Named LiquidJet customer list, design wins, and associated revenue contribution.
    - Audited revenue, gross margin, burn rate, and runway by product line.
    - Cap-table mechanics, liquidation preferences, and any debt or credit facilities.
    - Customer concentration, renewal behavior, and production-vs-pilot mix across AirJet deployments.
    - >-
      Independent benchmarking of LiquidJet and AirJet versus incumbent thermal-management alternatives at production
      scale.
