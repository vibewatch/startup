  - id: trust-safety-compliance
    title: Trust, Safety, and Quality Controls
    body: >
      Frore Systems applies industry-standard certification and testing regimes to its product line. The
      AirJet Mini Sport meets IP68 certification (submersion in >1.5m water for 30 minutes with full
      performance recovery), confirmed on the official product page. The AirJet PAK G2 carries IP53 (dust
      and water resistant) compliance. The Sonim MegaConnect—the most publicly documented AirJet deployment—
      meets MIL-STD-810G durability requirements for ruggedized communications hardware. AirJet Mini G2 has
      received three consecutive CES Innovation Awards (2024, 2025, 2026), including recognition as a
      "most innovative technology" for the waterproof AirJet Mini Sport. The Embedded World 2025 jury
      shortlisted AirJet PAK alongside NXP Semiconductors and Texas Instruments in the SoC/IP/IC design
      category. As of CES 2024, Frore's CTO confirmed that AirJet passed 5-year lifetime reliability
      testing with major OEM customers prior to commercial design-ins. No public CVE reports, product
      safety recalls, FCC violations, or regulatory enforcement actions against Frore Systems or AirJet
      products have been identified as of June 2026. LiquidJet's trust posture is less mature: the product
      has no independent certification listings beyond company claims; data center customers would require
      their own qualification testing. Frore's semiconductor manufacturing process in Taiwan is subject to
      TSMC-style quality controls inherent to semiconductor foundry operations, but Frore has not publicly
      disclosed its specific manufacturing partner or quality audit reports.
