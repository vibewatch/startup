callouts:
  - calloutType: strength
    title: Solid-State Architecture Enables Dustproof, Waterproof, and Silent Deployments
    body: >
      AirJet's MEMS piezoelectric design—with no mechanical moving parts, 1,750 Pa backpressure
      (10× fan), and autonomous Thermoception—creates a category advantage that fan-based cooling
      cannot replicate: dustproof IP53/IP68 device designs at sustained thermal performance. The Sonim
      MegaConnect deployment proves this at MIL-STD-810G standards in a mission-critical environment.
      No competitor in solid-state cooling has achieved comparable multi-generational commercial deployments.
    claimRefs:
      - CE002
      - CE008
      - CE009
      - CE021
      - CE029

  - calloutType: risk
    title: LiquidJet Performance Claims Lack Independent Corroboration
    body: >
      Frore Systems' LiquidJet claims—2× hotspot power density, 50% kW/lpm efficiency, 4× lower pressure
      drop, 75% higher heat transfer—are entirely company-stated as of June 2026. No independent third-party
      benchmark comparing LiquidJet to incumbent coldplate vendors (Aavid, Boyd, Vertiv, Laird) has been
      published. Data center customers must run their own qualification testing before commitment. Until
      independent validation is available, LiquidJet's claimed performance advantage cannot be confirmed
      by external diligence.
    claimRefs:
      - CE010
      - CE011
      - CE033

  - calloutType: insight
    title: SnowGoose Developer Kit and OEM B2B Model Limit Public Developer Footprint
    body: >
      Frore Systems has no public GitHub repositories, open SDK, or API documentation—consistent with
      its B2B OEM hardware model. Developer access is gated through the proprietary SnowGoose kit and
      direct OEM engagement. This limits the public developer community signal (GitHub stars, HN activity,
      npm downloads) that software-native companies accumulate. Frore's developer ecosystem is evaluated
      through OEM design-win traction, not open-source community metrics.
    claimRefs:
      - CE032
      - CE034
      - CE035

  - calloutType: risk
    title: Single-Country Manufacturing Concentration in Taiwan
    body: >
      All AirJet and LiquidJet production is conducted through MEMS semiconductor manufacturing in
      Taiwan. Frore has not disclosed its foundry partner. Geopolitical disruption, capacity constraints,
      or U.S.–China export controls affecting Taiwan's semiconductor ecosystem would directly impact
      Frore's ability to supply chips to OEM customers.
    claimRefs:
      - CE028

