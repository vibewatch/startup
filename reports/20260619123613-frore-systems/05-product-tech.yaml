  - id: product-risks-and-roadmap
    title: Product Risks, Gaps, and Roadmap
    body: >
      The primary product-level risks for Frore Systems center on three areas. First, LiquidJet's claimed
      performance advantages (2× hotspot power density, 50% kW/lpm improvement, 4× pressure drop reduction,
      75% heat transfer improvement) are entirely company-stated and have not been independently benchmarked
      against competing solutions from Aavid, Boyd, or Vertiv as of June 2026. Data center customers
      evaluating LiquidJet will need to conduct their own qualification testing. Second, AirJet integration
      requires significant hardware design effort by OEM partners; the technology is not plug-and-play and
      the SnowGoose developer kit is the only formal onramp, meaning commercialization timelines depend
      entirely on OEM adoption cycles. Third, Frore's manufacturing is concentrated in Taiwan, creating
      supply chain concentration risk if geopolitical disruptions, TSMC capacity constraints, or export
      restrictions materialize. On the roadmap, Frore has demonstrated LiquidJet Nexus cooling a 1,950W
      NVIDIA Rubin GPU at Computex 2026 and confirmed engineering readiness for Feynman-class GPUs (>4,000W).
      The "Frore's Law" trajectory projects next-generation AirJet Mini G3 or equivalent doubling thermal
      performance by approximately 2027. However, no confirmed product launch dates for G3 or next-generation
      LiquidJet variants have been disclosed. The company has not disclosed any security, privacy, or safety
      vulnerability disclosures related to AirJet's embedded control electronics as of June 2026.
