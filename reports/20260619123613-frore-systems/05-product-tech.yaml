  - id: core-technology-architecture
    title: Core Technology Architecture
    body: >
      AirJet's underlying mechanism is MEMS (Micro-Electro-Mechanical Systems) piezoelectric actuation.
      Micro-membranes inside the chip vibrate at high frequency, creating pressure waves that drive airflow
      through the device enclosure at 1,750 Pascals of back pressure—approximately 10× greater than a
      conventional fan. This solid-state approach generates no mechanical noise (≤21 dBA for Mini SKUs),
      has no wear parts, and enables "air sculpting"—directing cooled air through filtered vents on the
      opposite side of the device chassis to reduce surface temperatures. The high backpressure also supports
      inline dust filters on both the chip inlet and host device air inlets, enabling IP53 and IP68 device
      designs. Frore has published detailed MEMS actuation patents including US12581620B2 (exit channel
      configuration for MEMS-based actuator systems) and US12565419B2 (crash mitigation in active MEMS
      cooling systems), both granted in 2026, confirming the depth of Frore's technical IP. The company CTO
      noted at CES 2024 that AirJet passed rigorous 5-year lifetime reliability testing by major OEM customers.
      For data centers, LiquidJet takes an entirely different approach: rather than traditional skived 2D
      microchannel coldplates, Frore adapts semiconductor manufacturing to metal wafers, producing 3D short-loop
      jet channel microstructures that are customized to the precise power density map of each GPU die. This
      architecture enables LiquidJet to concentrate flow at GPU hotspot regions first, achieving up to 600 W/cm²
      hotspot cooling at 40°C inlet temperature, 50% higher kW/lpm cooling efficiency, and 4× lower pressure
      drop versus legacy coldplates. The LiquidJet Nexus integrates multiple LiquidJet coldplates into a
      single compute-tray-level platform, eliminating hoses, manifolds, and connectors to reduce integration
      complexity and enable 53°C inlet temperature operation.
