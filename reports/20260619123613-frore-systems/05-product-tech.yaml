chapter:
  number: 5
  title: Product & Technology
  summary: >
    Frore Systems has a fully commercialized dual-platform portfolio: AirJet (four active SKUs for edge and
    consumer devices) and LiquidJet (two early-commercial SKUs for AI data centers). AirJet's MEMS
    piezoelectric solid-state cooling, with 1,750 Pa backpressure and no moving parts, enables dustproof/waterproof
    devices with documented OEM deployments at AT&T FirstNet (Sonim MegaConnect) and Qualcomm's Snapdragon
    X2 Elite 2-in-1 reference design. LiquidJet's semiconductor-derived 3D short-loop jet channel architecture
    claims 2× hotspot power density and 4× lower pressure drop versus legacy coldplates, but independent
    third-party benchmarking remains absent. Developer access is limited to the proprietary SnowGoose OEM
    development kit; no public GitHub or API surface exists, consistent with Frore's B2B hardware OEM model.

sections:
  - id: product-portfolio-overview
    title: Product Portfolio and Module Map
    body: >
      Frore Systems' product portfolio as of June 2026 comprises two platform families serving distinct
      thermal management markets. The AirJet edge/consumer platform includes four active SKUs: AirJet Mini
      Slim (5.25W, 2.65mm, thinnest; for ultra-thin notebooks), AirJet Mini G2 (7.5W, 2.65mm; current flagship
      for notebooks, tablets, IoT), AirJet Mini Sport (5.25W, IP68 waterproof; for smartphones and action
      cameras), and AirJet PAK G2 (plug-and-play multi-chip module, up to 34W per PAK, IP53; for industrial
      edge AI). The LiquidJet data center platform includes the LiquidJet DLC coldplate (direct-to-chip 3D
      jet channel coldplate for AI GPUs starting with NVIDIA Blackwell Ultra) and LiquidJet Nexus (integrated
      coldplate system for NVIDIA Kyber ½U compute trays). All AirJet SKUs are based on MEMS piezoelectric
      actuation with no mechanical moving parts; all LiquidJet products use Frore's semiconductor manufacturing
      process adapted to metal wafers. The AirJet Mini G1 (original 5W chip) is no longer actively featured
      on the official website per NotebookCheck's reporting, though it remains in deployed products such as
      the Sonim MegaConnect. Frore's product roadmap targets NVIDIA Rubin, Rubin Ultra, and Feynman (>4,000W)
      GPUs with future LiquidJet iterations, anchored in the "Frore's Law" commitment to doubling thermal
      performance every two years.
