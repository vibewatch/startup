      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              The primary driver of demand for direct liquid cooling is the escalation of rack power density. Mordor
              Intelligence reports rack densities rising from 8–12 kW toward 120 kW as large language model training
              clusters proliferate. NVIDIA H200 GPUs impose approximately 700W thermal load per device; air cooling
              cannot cost-effectively remove heat above 20 kW per rack at volume. Amazon's $150B commitment to
              AI-optimized data center capacity signals sustained infrastructure investment that will require liquid
              cooling as a baseline capability, not an option.

              Regulatory tailwinds accelerate adoption: the European Energy Efficiency Directive requires data centers
              above 1 MW to evaluate heat recovery options, making liquid cooling a compliance architecture as well as
              an efficiency strategy. Liquid cooling provides an estimated 20% energy reduction versus legacy air
              systems in hyperscale facilities. IEA data shows global data center electricity consumption was 240–340
              TWh in 2022 (1–1.3% of global final electricity demand), with Amazon, Microsoft, Google, and Meta combined
              more than doubling their electricity use 2017–2021 to approximately 72 TWh annually.

              For the consumer segment, the AI PC 40 TOPS requirement drives thermal management complexity: NPU
              workloads in thin devices generate heat profiles that traditional fans cannot handle silently at fanless
              form factors. Gaming laptops growing at 9.16% CAGR represent an immediate AirJet addressable segment.
              China controls approximately 70% of global rare-earth production, exposing cooling fan assemblies to
              export-quota risk that could increase relative competitiveness of solid-state alternatives like AirJet.

              Against these drivers stand meaningful constraints. Brownfield data centers face high upfront retrofit
              costs to install manifolds and secondary loops for liquid cooling, often matching or exceeding the capex
              of new builds. 3M's scheduled exit from PFAS-based coolants reshapes fluid supply chains; Chinese
              specialty chemical makers are stepping in but quality consistency is unverified. Limited field expertise
              in liquid cooling constrains deployment velocity globally. Power semiconductor supply faces chronic
              underinvestment per Infineon's CEO, which could affect availability of components used in cooling control
              systems. China's PC market is forecast to decline approximately 10% in 2026, and memory prices rose
              approximately 90% in Q1 2026, pressuring laptop OEM margins and potentially deferring AirJet adoption.
