  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Streams
        blocks:
          - type: paragraph
            body: >-
              Frore Systems operates a pure hardware revenue model: it sells proprietary solid-state cooling chips and
              coldplate systems to business customers on a B2B basis and recognizes revenue upon delivery. Three
              distinct product lines generate revenue. AirJet, the flagship solid-state active cooling chip, is sold to
              consumer electronics and industrial OEMs — such as ZOTAC (ZBOX PI430AJ mini PC), AT&T Sonim (MegaConnect
              5G hotspot on FirstNet), and Qualcomm reference designs — for integration into ultra-thin, silent, fanless
              devices. LiquidJet and LiquidJet Nexus, the data-center liquid-cooling platforms, are sold to AI
              infrastructure operators including large cloud providers, enterprises, and government computing networks
              for direct-to-chip GPU cooling. AirJet PAK, a modular multi-chip cooling unit compatible with NVIDIA
              Jetson Orin, serves edge-AI gateway manufacturers. No subscription, licensing, or service-contract revenue
              layer has been publicly disclosed; all traction evidence points to unit hardware sales. Frore does not
              operate a SaaS model and has no publicly disclosed ARR or GMV metric. Revenue mix between the
              consumer-edge and data-center segments is undisclosed, but company messaging since early 2025 has shifted
              substantially toward data-center applications, suggesting the LiquidJet line is now the primary growth
              bet. Revenue recognition is standard hardware: title and risk transfer at shipment or delivery, consistent
              with OEM chip supply agreements.
