      - number: '4.4'
        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              Frore raised $143 million in Series D financing closed on March 16, 2026, led by MVP Ventures, with
              participation from Fidelity Management & Research, Top Tier, Mayfield Fund, Clear Ventures, Addition,
              Qualcomm Ventures, StepStone Group, and Alumni Ventures. This brought total capital raised to $340 million
              and conferred unicorn status at a $1.64 billion post-money valuation. The prior Series C ($80 million in
              May 2024) brought total capital to $196 million at an approximately $650 million pre-money valuation.
              Earlier rounds totalling approximately $116 million were closed between 2018 and 2023 through seed, Series
              A, and Series B tranches. The company has not publicly disclosed its cash position, monthly burn rate, or
              runway estimate. Given the stated purpose of the Series D — global manufacturing scale-up — the company is
              almost certainly burning at a rate materially above breakeven. At a rough benchmark of $3–8 million per
              month for a deep-tech hardware startup at this stage, the $143 million tranche would provide 18–48 months
              of runway, but this is entirely an estimate. No debt, project-finance obligation, credit facility, or
              convertible note has been publicly disclosed. Frore's capital dependency is high: it is a loss-making
              hardware manufacturer whose next funding event will be driven by evidence of LiquidJet design-win momentum
              with named hyperscaler customers, which none of the retained sources confirm by name. The participation of
              Fidelity Management & Research in both Series C and Series D is a meaningful signal of institutional
              confidence, but Fidelity's capacity to lead a future round is not guaranteed.
