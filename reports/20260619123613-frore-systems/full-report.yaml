      - number: '1.4'
        title: Products and Technology
        blocks:
          - type: paragraph
            body: >
              Frore Systems has three primary products as of mid-2026. AirJet Mini G2 is the second-generation
              solid-state active cooling chip for edge and consumer devices. It removes 7.5W of heat per module at a
              silent 21 dBA noise level, drawing only 1.2W of power, and fits in a 27mm × 41.5mm × 2.65mm form factor at
              7 grams. It generates 1,750 Pa back pressure—approximately 10× higher than a fan— enabling dustproof and
              water-resistant device designs. Multiple G2 chips can be stacked: four chips remove ~30W collectively. The
              G2 represents a 50% improvement over the original AirJet Mini G1 (5.25W). LiquidJet is a multi-stage 3D
              short-loop jetchannel direct liquid cooling (DLC) coldplate for data centers that claims 75% higher heat
              transfer efficiency, 8°C cooler GPUs, 4% higher AI tokens per second, and 10% lower PUE compared to
              standard coldplates. LiquidJet Nexus is an integrated coldplate system for NVIDIA Kyber ½U compute trays
              that enables 2× compute density per rack, reduces thermal stack weight by 65%, eliminates hoses and
              manifolds, and supports 53°C inlet temperatures. All Frore products are based on MEMS piezoelectric
              actuation technology, with underlying patents including US12635413B2, US12581620B2, and US12565419B2
              granted in 2026. Frore articulates "Frore's Law"—a goal to double thermal performance every two years.
