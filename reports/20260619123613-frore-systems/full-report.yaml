            body: >-
              The core financial verdict is that Frore Systems is a deep-tech hardware company at an inflection point —
              transitioning from a consumer-edge chip business (AirJet) to a data-center infrastructure platform
              (LiquidJet), with revenue that is real but small relative to its $1.64 billion valuation. The revenue
              quality dilemma is fundamental: the company's only publicly verified revenue comes from named OEM design
              wins in consumer electronics and edge AI, while the valuation premium is entirely attributed to the
              data-center cooling opportunity that has not yet generated publicly confirmed hyperscaler deployments at
              scale. At an estimated ~$11 million in 2026 revenue, the implied revenue multiple of approximately 149x is
              exceptional even by AI-era venture standards; the TheCoolingReport explicitly called the $1.64 billion
              valuation "extraordinary for this category" and noted that the entire immersion cooling segment is only
              projected to reach $2.54 billion by 2032. Capital intensity is a permanent feature of this business model
              — MEMS semiconductor manufacturing, Taiwan fab operations, and data-center hardware integration each carry
              structural CAPEX and inventory requirements that preclude a capital-light path to profitability. The two
              primary diligence blockers are: (1) the absence of any named hyperscaler or cloud customer publicly
              confirming LiquidJet deployment, which makes the data-center revenue ramp unverifiable from the outside;
              and (2) the complete opacity of burn rate, cash position, and unit economics, which prevents an
              independent assessment of runway adequacy.
