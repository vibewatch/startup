      - number: '8.4'
        title: Exit Readiness and Path to Liquidity
        blocks:
          - type: paragraph
            body: >-
              Frore Systems remains private as of June 2026. Secondary market activity is present — Forge Global lists
              Frore with a placeholder price of $46.26 per share, implying pre-IPO secondary interest — but no confirmed
              secondary transaction volumes are publicly available. TechStackIPO rates Frore at 64/100 for IPO
              readiness, citing technology strength and funding credentials but flagging the absence of visible revenue
              at scale and missing hyperscaler customer disclosures as readiness gaps. Two primary exit paths exist: (1)
              strategic acquisition by a power/thermal management incumbent (Vertiv, Eaton, Schneider Electric) seeking
              to add a semiconductor-grade MEMS cooling capability, with a likely exit multiple anchored to revenue
              (5–10x) or EBITDA (15–25x) on a demonstrated revenue run rate; or (2) IPO at a valuation step-up over the
              Series D mark, requiring at minimum two or three quarters of demonstrable LiquidJet revenue growth with
              named hyperscaler deployments. The M&A path is the more near-term option: the Eaton-Boyd transaction
              ($9.5B at 22.5x EBITDA) demonstrated that thermal management assets command high strategic premiums when
              proven at scale. However, Frore's revenue base is too early-stage for a premium acquisition at $1.64B
              without dramatic commercial acceleration. The IPO path requires at minimum $50–100M in annualized revenue
              and a credible path to EBITDA breakeven. Neither threshold is publicly confirmed as of June 2026. The
              17-investor roster (MVP Ventures, Fidelity, Qualcomm Ventures, Mayfield, StepStone, Addition, Top Tier,
              Alumni Ventures, Clear Ventures) creates liquidity pressure that will intensify by 2028 as fund life
              windows approach.
