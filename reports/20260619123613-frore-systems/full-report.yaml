      - number: '3.3'
        title: Pricing, GTM, and Distribution Comparison
        blocks:
          - type: paragraph
            body: >
              Frore's pricing for AirJet modules is not publicly disclosed; the company sells directly to OEMs under
              NDA. Pricing is widely understood to carry a premium relative to traditional miniature fan modules, where
              Nidec and Sunon components range from roughly $3–10 per unit at volume. The value proposition Frore
              presents is not price parity but total-platform economics: OEMs can design lighter, thinner, quieter
              devices with sustained performance claims that they cannot achieve with fans. The premium is positioned as
              enabling a product differentiation story that commands a higher ASP at the device level.

              In contrast, traditional fan and vapor chamber vendors operate on a competitive commodity model. Nidec,
              Sunon, Delta, and Boyd/Aavid all compete on volume pricing, long-standing OEM qualification relationships,
              and the ability to supply at the scale of millions of units. These relationships compound over time: a
              laptop OEM that has qualified Nidec fans for three product generations has engineering processes, thermal
              simulation libraries, and supply chain infrastructure invested in those relationships. Frore must overcome
              a substantial inertia cost to displace an incumbent even when its technology is demonstrably superior.

              xMEMS has not announced commercial pricing for XMC-2400. Given its smaller form factor and dramatically
              lower power draw (30 mW vs. Frore's 1.2 W), it is likely to compete at lower ASPs in the smartphone
              bill-of-materials. If xMEMS achieves high-volume smartphone design wins (analogous to how its MEMS speaker
              chips entered the market), it could establish a pricing precedent that creates ASP pressure on the broader
              solid-state cooling market, potentially affecting Frore's premium positioning in converging segments like
              tablets and thin laptops.

              Distribution for traditional cooling vendors is through established component distributor networks (Arrow,
              Avnet, Mouser) and direct OEM sales. Frore's GTM is primarily direct OEM engagement, targeting hardware
              engineering teams at consumer electronics, industrial IoT, and edge AI platform companies. LiquidJet's
              data center GTM requires engagement with hyperscaler procurement and hardware design teams—a significantly
              longer and more complex sales cycle than consumer electronics OEMs. Frore demonstrated LiquidJet at CES
              2026 and COMPUTEX 2026, indicating an active enterprise GTM motion.
            claimRefs:
              - CP029
              - CP030
              - CP033
              - CP037
              - CP038
              - CP040
