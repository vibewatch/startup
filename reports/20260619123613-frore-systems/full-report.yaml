      - number: '2.3'
        title: Buyer Segmentation and Adoption Path
        blocks:
          - type: paragraph
            body: >
              Frore operates in a B2B model where end buyers vary significantly between the data center and consumer
              segments. In data centers, the three primary buyer archetypes are hyperscale cloud providers (AWS, Azure,
              GCP, Meta), colocation facility operators, and enterprise organizations deploying private AI on-prem
              infrastructure. Hyperscale players held 38.92% of data center liquid cooling market revenue in 2025 and
              are the dominant immediate buyers; their procurement decisions are infrastructure-scale commitments
              spanning multiple years. Colocation operators are secondary buyers who pre-install liquid-cool-ready
              suites to attract AI workload tenants. Enterprise AI teams (financial services, healthcare, defense)
              procure through server OEMs (Dell, HPE, Lenovo) rather than buying cooling components directly.

              Budget ownership in data centers sits with the VP of Infrastructure or CTO for large hyperscalers, and
              with Facilities Engineering or the data center operations team for colocations and enterprise. The cooling
              solution is typically specified during server chassis selection, meaning Frore's primary commercial
              relationship is with server OEMs (who integrate LiquidJet into chassis designs) rather than directly with
              hyperscalers. Procurement cycles are long (12–24+ months) given integration certification requirements
              from OEMs.

              In the consumer segment, the buyer is the PC OEM product engineering team. Adoption trigger is form-factor
              requirement: when a new laptop SKU targets thinner-than-fan dimensions and AI PC NPU workloads, OEM
              engineers evaluate AirJet as an enabler of those dimensions. Budget owners are VP Product Engineering with
              chips priced per unit volume. Frore must win reference designs early in a product cycle (18–24 months
              ahead of product launch). Omdia projects that approximately 50% of PCs shipped in 2026 will include NPUs,
              validating the market pull for AI thermal management in thin devices.

              Edge device OEMs (industrial IoT, rugged computing, smart cameras) are a third buyer class where the
              procurement cycle is shorter (~6–12 months) and decision-making is more concentrated in the CTO or VP
              Engineering. These buyers have higher tolerance for new technology but lower volume per SKU.
