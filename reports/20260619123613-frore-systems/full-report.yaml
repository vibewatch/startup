      - number: '8.5'
        title: Final Diligence Asks and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              The central diligence gap is LiquidJet's commercial traction: without a publicly or confidentially named
              hyperscaler customer and associated revenue run rate, the $1.64B valuation is entirely a narrative
              multiple. Secondary diligence priorities are gross margin and manufacturing economics at scale (to assess
              whether the MEMS cold-plate model is profitable at >$50M revenue), cap table composition and preference
              stack (to understand liquidation preferences and return hurdles for late investors), and the competitive
              response from Vertiv and Eaton-Boyd (who have the capital to match Frore's technology claims without the
              startup revenue constraint). Kill criteria include: (1) LiquidJet revenue failing to exceed $20M by FY2027
              with no named customer disclosed; (2) a down-round Series E at a valuation below $1.64B; (3) AirJet losing
              the Qualcomm Snapdragon reference design relationship; (4) Frore burning through the Series D proceeds
              without establishing hyperscaler deployment contracts by end of 2026; (5) a major incumbent announcing a
              solid-state cooling product that replicates AirJet's edge-device performance within a 24-month roadmap.
              Any one of these triggers would shift the recommendation from research-more to avoid.
