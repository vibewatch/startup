      - number: '5.3'
        title: Deployment, Integration, and Developer Ecosystem
        blocks:
          - type: paragraph
            body: >
              OEM integration of AirJet requires hardware-level design work: OEMs select an AirJet SKU based on thermal
              envelope, form factor, and target IP rating, then design a thermal spreader, air duct, dust filters, and a
              4-pin power/control interface into their device. To support prototyping, Frore offers the SnowGoose AirJet
              Developer's Kit—targeted at manufacturers intending future commercial product integration—which includes
              all components for prototype evaluation, with upgrade packs for future AirJet products. This is a
              proprietary hardware developer kit; no public GitHub repositories, npm packages, or open API documentation
              exist for AirJet as of June 2026, consistent with the B2B OEM model. For developer-community validation,
              the Linus Tech Tips (LTT) channel independently integrated three AirJet Mini chips into a MacBook Air on
              camera and confirmed a 67% performance increase, demonstrating the technology's real-world integration
              potential to a practitioner audience. Similarly, an armdevices.net video reviewer at CES Las Vegas 2026
              independently evaluated the AirJet PAK 5C-G2 for Jetson Orin NX Super class designs, confirming the
              "fanless-like industrial attributes" with targeted 40W operation and 80% reduction in thermal hardware
              volume. Both validations are cited publicly by Frore. The Intel Evo collaboration—endorsed by Intel VP/GM
              Mobile Platforms—signals that AirJet is on the roadmap for future Intel Evo thin laptops. Confirmed
              commercial deployments as of June 2026 include the Sonim MegaConnect HPUE 5G hotspot (AT&T FirstNet), the
              Qualcomm Snapdragon X2 Elite 2-in-1 reference design (18W TDP in 6mm chassis), and the Lenovo Innovation
              Accelerator collaboration for future Lenovo products. For LiquidJet, the SnowGoose kit does not extend to
              data center customers; data center integration requires direct engagement with Frore.
