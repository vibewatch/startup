      - number: '8.3'
        title: Scenario Analysis and Probability-Weighted Outlook
        blocks:
          - type: paragraph
            body: >-
              Three scenarios frame the forward valuation under different LiquidJet and AirJet execution paths. The bull
              case assumes LiquidJet wins two or more named hyperscaler deployments during 2026 and AirJet adoption
              accelerates via Snapdragon reference design OEM pull-through. Revenue reaching $50–100M by FY2027–28 at
              30–40x forward revenue could support a $1.5–4.0B enterprise value at IPO or acquisition, with meaningful
              upside vs. the $1.64B mark for late-2026 investors. The base case assumes modest LiquidJet traction (one
              confirmed hyperscaler reference), AirJet steady in edge AI and thin PC form factors, and revenue reaching
              $20–30M by FY2027–28. At a 10–15x forward revenue multiple (reflecting the execution uncertainty
              discount), the implied EV is $200–450M — a material step down from the current mark. A Series E at flat or
              a modest step-up would be the likely financing outcome. The bear case assumes LiquidJet faces competitive
              displacement by Vertiv/Eaton-Boyd in hyperscaler liquid cooling, AirJet consumer adoption stalls in a
              commodity PC downturn, and revenue fails to demonstrate sustained growth above $15M. Burn rate at
              $3–8M/month implies the $143M Series D provides 18–48 months of runway (est.), after which distressed
              financing or a down-round becomes plausible absent hyperscaler adoption evidence. The adversarial outcome
              is rare but structurally possible given the incumbent capital advantage.

              The market context supports a non-trivial bull probability: Gartner cites a 55.8% YoY rise in data center
              systems spending in 2026; JLL projects a $1–2 trillion IT infrastructure wave through 2030; Vertiv's $15B
              backlog underscores the genuine demand signal. The central uncertainty is Frore's positioning within that
              wave — whether LiquidJet becomes a preferred coolant for the next Nvidia Rubin/Blackwell Ultra generation
              or cedes the enterprise market to established HVAC and liquid cooling incumbents.
