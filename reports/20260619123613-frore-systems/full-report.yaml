      - number: '1.3'
        title: Funding History and Capital Structure
        blocks:
          - type: paragraph
            body: >
              Frore Systems has raised a total of $340M across multiple rounds since founding. Early backing came from
              Mayfield Fund and Clear Ventures in a seed round circa 2019 and a Series A around 2021. A Series A-II
              follow-on was completed in December 2021. A Series B was raised in December 2022. The company's first
              large institutional round was a $80M Series C in May 2024, led by Fidelity Management and Research Company
              (with Prosperity7 Ventures making a significant co-investment), bringing total raised to $196M. In March
              2026, Frore completed a $143M Series D led by MVP Ventures, with participation from Fidelity, Top Tier,
              Mayfield Fund, Clear Ventures, Addition, Qualcomm Ventures, StepStone Group, and Alumni Ventures, valuing
              the company at $1.64 billion. The Series D inclusion of Qualcomm Ventures alongside the continued
              participation of Mayfield (with managing partner Navin Chaddha quoted in the announcement) signals strong
              strategic alignment with major semiconductor ecosystem players. Equity stakes, board seat allocation, and
              any debt or credit facilities are not publicly disclosed. No secondary transactions have been reported.
