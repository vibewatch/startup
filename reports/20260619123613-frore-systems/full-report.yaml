      - number: '2.2'
        title: Market Sizing and Estimates
        blocks:
          - type: paragraph
            body: >
              Market sizing for Frore's addressable opportunity requires multiple lenses because analyst definitions
              span from narrow (specific to data center liquid cooling modules) to very broad (entire thermal management
              hardware plus software market). The figures below present the key sizing estimates by scope, with explicit
              notes on definitional divergence.

              For the primary SAM (data center liquid cooling), Mordor Intelligence (2026) estimates the market at
              $5.52B in 2025, growing to $18.79B by 2031 at a 22.65% CAGR. Direct-to-chip cooling holds 42.85% of 2025
              spending ($2.37B), the most relevant sub-segment for LiquidJet. MarketsandMarkets estimates the data
              center thermal management market (slightly broader, includes some infrastructure cooling) at $12.28B in
              2025 growing to $24.00B by 2032 at 10.1% CAGR. Allied Market Research estimates the broader data center
              cooling market (including facility-level cooling) at $18.7B in 2023 growing to $80.1B by 2033 at 15.7%
              CAGR.

              For the consumer/edge AI segment, the AI PC market was valued at $58.07B in 2025 by Precedence Research
              and is projected to reach $321.41B by 2035 at 18.66% CAGR. AirJet chips would be embedded components
              within AI PCs—a sub-component of this market, not the full market. The global laptop market is $171.89B
              (2025, Mordor Intelligence) growing at 8.24% CAGR; gaming laptops grow at 9.16% CAGR, a key AirJet target
              segment for its thermal headroom.

              Contradictory estimates reflect scope differences: the Precedence Research data center cooling figure
              ($81.88B in 2025) includes facility HVAC and precision cooling, not just chip-level modules. Investors
              should apply the Mordor $5.52B estimate (narrow, liquid cooling modules only) as Frore's primary SAM, and
              use the broader figures only as a ceiling benchmark.
