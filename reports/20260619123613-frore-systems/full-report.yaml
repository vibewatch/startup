      - number: '4.3'
        title: Cost Structure and Gross Margin
        blocks:
          - type: paragraph
            body: >-
              Frore's cost structure is dominated by cost of goods sold for MEMS-based semiconductor manufacturing at
              its Taiwan fab (ISO 9001 and ISO 14001 certified). The fabrication process draws from semiconductor,
              flat-panel display, aerospace, and automotive manufacturing techniques — making it more complex and
              capital-intensive than commodity fan production but potentially capable of achieving attractive margins at
              scale given the premium performance positioning. No audited financials or gross margin disclosures are
              available; analyst and market-data aggregator estimates place gross margin for high-value semiconductor
              cooling components in the 40–60% range at production scale, but this figure is unverified for Frore
              specifically. MEMS fabrication carries meaningful fixed-cost overhead per wafer run; the company's patent
              portfolio of approximately 200 related publications reflects significant cumulative R&D investment that is
              largely sunk. R&D and engineering headcount (approximately 70–79 total employees) represent the primary
              operating expense beyond COGS. Working capital requirements include raw-material inventory and
              work-in-progress at the Taiwan fab; LiquidJet Nexus integrated coldplates have higher materials content
              than AirJet chips, increasing inventory exposure as data-center unit volumes grow. Capex is ongoing: the
              Series D proceeds are earmarked in part for expanded manufacturing capacity, suggesting the current Taiwan
              footprint is insufficient to meet projected demand. No depreciation schedules, capital-lease details, or
              balance-sheet items are public.
