      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation: research-more — Entry Requires LiquidJet Evidence'
            body: >-
              At $1.64B post-money and ~149x estimated 2026 revenue, Frore Systems is priced for transformative
              execution of a thesis that remains publicly unconfirmed. The AI cooling thesis is structurally sound — GPU
              densities are genuinely challenging air-cooled limits and the IDC TAM projection supports the market
              opportunity. But the valuation has run ahead of the evidence base. A research-more verdict reflects the
              binary nature of the LiquidJet data-center thesis: if Frore can name two hyperscaler customers and
              demonstrate revenue above $30M within six months, the recommendation would move to track or buy at the
              current mark. Absent that evidence, investors are paying a 30–75x premium over comparable thermal
              management companies and a 3–7x premium over established M&A precedents for a revenue base that has not
              been disclosed.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV009
              - CV022
          - type: callout
            title: 'Adverse Finding: Valuation Priced for Perfection on Unconfirmed Data-Center Revenue'
            body: >-
              Independent analysis flagged the $1.64B valuation as "extraordinary for this category" given that the
              entire immersion/liquid cooling segment for Frore's scale was projected at only $2.54B at the time of the
              Series C. The jump from $680M pre-money (Series C) to $1.64B post-money (Series D) represents a 141%
              step-up in under two years, implying a capital efficiency ratio of 4.8x — a level that requires
              near-perfect execution of the LiquidJet hyperscaler thesis to avoid a future mark-down. With revenue
              estimated at ~$11M and the Eaton–Boyd M&A benchmark at 5.6x revenue for an established liquid cooling
              business, the gap between the current mark and evidence-supported value is substantial.
            calloutType: risk
            claimRefs:
              - CV005
              - CV006
              - CV016
              - CV027
              - CV028
          - type: callout
            title: 'Structural Tailwind: AI Infrastructure Super-Cycle Supports Long-Term Thermal Management Premium'
            body: >-
              Vertiv's $15B order backlog (up 109% YoY), Modine's $4B long-term data center supply agreement, and
              Gartner's forecast of 55.8% YoY growth in data center systems spending in 2026 all confirm that the AI
              infrastructure buildout is real and that thermal management is a critical bottleneck. This structural
              tailwind benefits Frore and justifies a strategic premium over traditional thermal management multiples.
              The question is not whether the market exists, but whether Frore can capture enough of it before Vertiv,
              Eaton-Boyd, and new entrants consolidate the premium positions.
