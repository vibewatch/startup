  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              Frore Systems competes across two distinct arenas with its product portfolio. In the edge device arena,
              AirJet (Mini G2, Mini Slim, PAK variants) competes against traditional active and passive cooling
              solutions used in ultra-thin laptops, tablets, smartphones, edge AI gateways, and industrial IoT devices.
              In the data center arena, LiquidJet and LiquidJet Nexus compete against conventional 2D microchannel
              coldplate vendors for AI GPU cooling in hyperscale and colocated facilities.

              The most consequential competitive category in the edge arena is the status quo: thin-laptop OEMs
              predominantly rely on miniature blower fans (Nidec, Sunon, Delta Electronics) combined with heat pipes and
              vapor chambers (Boyd/Aavid, Fujikura, Asia Vital Components). These incumbents are cost-optimized, have
              multi-year OEM design-win relationships, and benefit from large established supply chains across Taiwan,
              Japan, and China. Their fundamental limitation is physical: miniature fans generate mechanical noise
              (typically 30–50 dBA), accumulate dust, wear over time, and cannot maintain cooling performance in sealed
              or IP-rated enclosures.

              The one direct solid-state MEMS competitor to AirJet is xMEMS, whose XMC-2400 µCooling chip uses
              piezoelectric MEMS membranes—the same operating principle as AirJet—but in a dramatically smaller form
              factor (9.26 × 7.60 × 1.08 mm vs. AirJet Mini G2's 27 × 41.5 × 2.65 mm). xMEMS targets smartphones,
              tablets, and SSDs, where AirJet's footprint is too large. A second potential entrant is Phononic, a
              thermoelectric (TEC) cooling company targeting AI data center GPU hotspot cooling with software-defined
              TEC modules; Phononic's approach differs fundamentally in mechanism and target market but could converge
              on edge AI devices over time.

              Adjacent threats include large-scale enterprise liquid cooling vendors in the data center space—Boyd
              Thermal (being acquired by Eaton for $9.5B), CoolIT Systems, Submer, and LiquidStack—whose established
              infrastructure services and hyperscaler relationships represent the primary competitive hurdle for
              LiquidJet adoption. Each vendor category is profiled below with scale, differentiation, and threat
              severity.
