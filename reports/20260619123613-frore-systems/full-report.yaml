      - number: '7.2'
        title: Operational and Supply Chain Risks
        blocks:
          - type: paragraph
            body: >-
              Frore's most acute operational risk is its single-source dependence on an undisclosed Taiwan-based MEMS
              fabrication facility. All production of AirJet and LiquidJet chips flows through this one facility; no
              alternative fab, geographic diversification, or publicly disclosed business continuity plan has been
              reported. Taiwan accounts for a disproportionate share of advanced global semiconductor fabrication
              capacity, making any geopolitical escalation between China and Taiwan, natural disaster (Taiwan averages
              multiple significant seismic events per year), or regulatory disruption a potential full production halt
              for Frore with a recovery horizon measured in quarters, not weeks.

              Manufacturing quality is partially mitigated: Frore's Taiwan fab achieved ISO 9001 (quality management)
              and ISO 14001 (environmental management) certifications in September and October 2024, providing a
              baseline quality framework. However, MEMS manufacturing involves piezoelectric materials, specialty
              process gases, and lithographic techniques inherited from flat-panel display and aerospace manufacturing,
              creating environmental compliance obligations around hazardous materials. OSHA's semiconductor
              manufacturing standards identify exposure risks from solvents, acid solutions, and radiation-emitting
              equipment that apply to Frore's US engineering and testing operations.

              A technical reliability risk concerns the long-term durability of vibrating MEMS membranes under sustained
              AI workloads. AirJet chips actuate piezoelectric membranes continuously when active; no independently
              verified MTBF (Mean Time Between Failures) or accelerated life-test qualification data has been published
              for any AirJet generation. As Frore moves into the enterprise AI and data-center segment with LiquidJet,
              hyperscaler procurement teams will require formal reliability qualifications that have not yet been
              disclosed. Manufacturing yield variability in MEMS is historically higher than commodity CMOS, adding
              margin uncertainty that is unresolved without financial disclosure.
