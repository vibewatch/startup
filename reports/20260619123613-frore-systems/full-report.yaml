chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >
              Frore Systems is a Silicon Valley semiconductor company that designs advanced thermal management
              technologies for the AI era. Founded in 2018 in San Jose, California, the company develops two distinct
              product lines: AirJet, the world's first solid-state active cooling chip for edge, consumer, and
              industrial AI devices; and LiquidJet, a direct liquid cooling platform for hyperscale AI data centers.
              Both product lines use semiconductor manufacturing processes—specifically MEMS-based piezoelectric
              actuation—to deliver cooling performance that traditional fans and heatsinks cannot match in compact,
              high-density environments. Frore Systems is at Series D stage with a $1.64B unicorn valuation. The company
              is headquartered in Silicon Valley with manufacturing operations in Taiwan and additional offices in South
              Korea. Its patented cooling technologies are integrated into products from major OEMs and system builders
              worldwide, spanning consumer electronics, industrial IoT, mission-critical communications, and AI data
              center infrastructure. The business model is B2B: Frore licenses and sells cooling chips and integrated
              thermal modules to OEMs and system builders who embed them in final products. Revenue and ARR are not
              publicly disclosed.
