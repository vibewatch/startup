            body: >-
              Frore has not published a price list for any product. AirJet chip pricing is negotiated directly with OEM
              design teams and is embedded in volume supply agreements; no per-unit retail price has appeared in any
              press release, product page, or analyst note in the retained evidence set. The AirJet Mini G2 product page
              focuses on technical specifications (7.5 W heat dissipation, 2.65 mm thickness, 1,750 Pa backpressure)
              rather than pricing, which is typical for semiconductor components sold through B2B design-win channels.
              LiquidJet and LiquidJet Nexus pricing for data-center customers is project-based, negotiated with each
              hyperscaler or infrastructure operator, and is highly unlikely to be public given the competitive
              sensitivity of AI infrastructure procurement. GTM relies on direct enterprise sales and strategic OEM
              partner channels; Qualcomm Ventures' role as both investor and reference-design partner illustrates the
              dual-track engineering-plus-commercial engagement model. Sales cycles for hardware design wins in this
              category are typically 12–24 months from initial demo to volume shipment, which is a material drag on
              sales efficiency metrics. No published CAC, payback period, or sales cycle data exists in the retained
              evidence. Qualcomm's Snapdragon X2 Elite reference design adopting AirJet Mini G2 signals a major GTM
              multiplier — if OEM licensees of the Qualcomm platform adopt AirJet as a standard component, Frore gains
              leverage without direct selling costs per downstream device.
