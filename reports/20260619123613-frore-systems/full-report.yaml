  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Module Map
        blocks:
          - type: paragraph
            body: >
              Frore Systems' product portfolio as of June 2026 comprises two platform families serving distinct thermal
              management markets. The AirJet edge/consumer platform includes four active SKUs: AirJet Mini Slim (5.25W,
              2.65mm, thinnest; for ultra-thin notebooks), AirJet Mini G2 (7.5W, 2.65mm; current flagship for notebooks,
              tablets, IoT), AirJet Mini Sport (5.25W, IP68 waterproof; for smartphones and action cameras), and AirJet
              PAK G2 (plug-and-play multi-chip module, up to 34W per PAK, IP53; for industrial edge AI). The LiquidJet
              data center platform includes the LiquidJet DLC coldplate (direct-to-chip 3D jet channel coldplate for AI
              GPUs starting with NVIDIA Blackwell Ultra) and LiquidJet Nexus (integrated coldplate system for NVIDIA
              Kyber ½U compute trays). All AirJet SKUs are based on MEMS piezoelectric actuation with no mechanical
              moving parts; all LiquidJet products use Frore's semiconductor manufacturing process adapted to metal
              wafers. The AirJet Mini G1 (original 5W chip) is no longer actively featured on the official website per
              NotebookCheck's reporting, though it remains in deployed products such as the Sonim MegaConnect. Frore's
              product roadmap targets NVIDIA Rubin, Rubin Ultra, and Feynman (>4,000W) GPUs with future LiquidJet
              iterations, anchored in the "Frore's Law" commitment to doubling thermal performance every two years.
