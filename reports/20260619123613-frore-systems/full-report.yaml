  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and IP Risks
        blocks:
          - type: paragraph
            body: >-
              Frore Systems operates in a regulatory environment governed primarily by the US Export Administration
              Regulations (EAR), managed by the Bureau of Industry and Security (BIS). As a semiconductor hardware
              company designing MEMS-based active cooling chips and selling to global OEMs, Frore's products may carry
              Export Control Classification Number (ECCN) designations that require export licenses for shipments to
              controlled destinations. The specific ECCN for AirJet and LiquidJet has not been publicly disclosed; this
              gap must be closed through internal legal review before any cross-border commercial scale-up into
              sensitive markets. The CHIPS and Science Act of 2022 creates additional obligations for US-linked
              semiconductor manufacturers, including a 10-year guardrail restricting new investment in Chinese
              semiconductor expansion for CHIPS Act recipients; while Frore has not confirmed receipt of CHIPS Act
              funds, the regulatory regime shapes the competitive landscape for its Taiwan fab partnerships and any
              future US domestic manufacturing considerations.

              On intellectual property, Frore holds a large and growing patent portfolio with over 200 related
              publications covering MEMS actuation, piezoelectric driving, waterproofing, and manufacturing methods.
              Core patents granted in 2025-2026 include US 12,635,413 (piezoelectric driving of MEMS cooling systems),
              US 12,581,620 (exit channel configurations), and US 12,538,450 (waterproof MEMS flow systems). No patent
              litigation, inter partes review (IPR) proceeding, or known IP challenge involving Frore Systems has been
              identified in publicly available records as of June 2026. However, the emergence of xMEMS as a direct MEMS
              cooling competitor creates forward-looking freedom-to-operate (FTO) risk that warrants a proactive
              analysis of claim overlap between the two portfolios.

              For government customers, Frore's deployment in the AT&T Sonim MegaConnect on the FirstNet public-safety
              network connects the company to CISA-governed critical communications infrastructure. This exposes Frore
              to supply chain security requirements that go beyond standard commercial OEM contracting, including
              potential security assessments and country-of-origin scrutiny for Taiwan- manufactured components used in
              US federal networks.
