      - number: '7.4'
        title: Financial and Execution Risks
        blocks:
          - type: paragraph
            body: >-
              Frore has raised $340 million in total capital through its March 2026 Series D, achieving a $1.64 billion
              post-money valuation. Analyst estimates place 2026 revenue at approximately $11 million, implying a ~149x
              revenue multiple that demands sustained hyper-growth to justify. Burn rate and cash runway are not
              publicly disclosed; with MEMS manufacturing capital intensity, dual product line development (edge AI +
              data center), and a small ~79-person team expanding rapidly, the forward capital requirement before
              profitability is material and opaque to investors.

              Long OEM design cycles create revenue unpredictability: hardware design wins in the semiconductor cooling
              segment typically take 12 to 24 months from initial engineering engagement to volume production. This
              means the commercial pipeline Frore is building today in data centers will not translate into meaningful
              revenue for at least one to two years, placing significant strain on the post-Series-D runway if the burns
              rates are high. The strategic pivot to data-center liquid cooling—inspired by NVIDIA CEO Jensen
              Huang—represents a direction change that requires building entirely different distribution channels,
              hyperscaler procurement relationships, and system-level support capabilities that Frore's current
              79-person team has not yet demonstrated.

              Key-person concentration is the single most important execution risk: CEO Dr. Seshu Madhavapeddy and CTO
              Dr. Surya Ganti together hold the primary commercial relationships, the core technical architecture, and
              the IP prosecution pipeline for 200+ patent publications. Dr. Ganti alone holds over 50 individual
              patents. No successor for either role has been disclosed, and no key-man insurance or succession
              arrangement has been publicly described. Loss of either founder would likely impair not only the technical
              roadmap but also the strategic investor relationships (Fidelity, Qualcomm Ventures, Mayfield) that were
              built on the founders' specific industry credibility.
