      - number: '1.2'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >
              Frore Systems was co-founded by two engineers with deep roots in MEMS research and commercialization at
              Qualcomm. Dr. Seshu Madhavapeddy (CEO) holds a Bachelor of Technology from IIT Kharagpur and a PhD in
              Computer Science from the University of Texas at Dallas. Before Frore, he built and exited two
              startups—Spatial Wireless and Sipera Systems—and served as VP/GM at Qualcomm, where he led the in-display
              fingerprint sensor business from demo stage to commercial success. Dr. Surya P. Ganti (CTO) holds a BTech
              from IIT Madras and a PhD in Mechanical Engineering from MIT. At Qualcomm he was CTO and engineering head
              for the Mirasol reflective display and ultrasonic fingerprint sensor products. Surya holds over 50 patents
              in MEMS, sensors, and flexible electronics. The executive team also includes Brandon Jung (VP Business
              Development) and Sue Ryan (VP Marketing). Key-person dependency is high: both founders hold the core
              technical IP and commercial relationships. Board composition and investor governance rights are not
              publicly disclosed. No material leadership changes or executive departures have been reported as of June
              2026. Employee count is estimated at 51–250 per Equilar, with Tracxn estimating approximately 79
              employees; the exact figure is not publicly confirmed.
