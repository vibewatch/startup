  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >
              Frore Systems addresses thermal management challenges at two distinct product layers. The first is data
              center direct liquid cooling, where LiquidJet cold plates are designed to remove heat from high-density AI
              GPU and compute trays. The second is consumer and edge AI active cooling, where AirJet piezoelectric chips
              enable fanless or reduced-fan form factors in thin laptops, tablets, and industrial edge devices. These
              two markets differ substantially in buyer type, procurement route, revenue scale, and competitive
              dynamics.

              For the data center segment, the relevant spend boundary is direct-to-chip and module-level liquid cooling
              hardware sold to data center operators and server OEMs—not the broader data center construction, power
              delivery, or facility cooling (HVAC/CRAC) markets. The addressable spend includes cold plates, coolant
              distribution units (CDUs), in-rack liquid manifolds, and semiconductor-based cooling modules. Excluded
              from Frore's direct SAM are: traditional air cooling fans and heatsinks, immersion baths (a competing
              technology), district heating infrastructure, and rack-level precision cooling systems.

              For the consumer segment, the boundary is solid-state active cooling chips and modules embedded in end
              products (laptops, tablets, IoT devices) where Frore sells components to OEMs. This excludes the broader
              consumer electronics market, retail laptop sales, and passive thermal solutions (vapor chambers, graphite
              pads, thermal interface materials). Adjacencies include voice-coil actuated fans, TEC (Peltier) chips, and
              vapor chamber assemblies as substitute thermal solutions in thin form-factor devices.

              Status-quo substitutes vary by segment: in data centers, the incumbent is precision air cooling
              (raised-floor CRAC units, hot/cold aisle containment) and increasingly conventional direct-to-chip liquid
              cooling from established vendors (Asetek, CoolIT, Boyd/Aavid); in consumer devices, the substitutes are
              high-speed thin fans, graphite spreading pads, and passive heat dissipation at reduced performance.
            claimRefs:
