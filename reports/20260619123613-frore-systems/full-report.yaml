  - id: TP001
    title: Competitor Profile Table
    enumerationScope:
      coverage: partial
      basis: >-
        Covers commercially active or publicly announced competitors in solid-state active cooling, thin-device
        incumbent cooling, and data center liquid cooling segments as of June 2026; excludes purely academic or
        stealth-stage projects.
    columns:
      - Competitor
      - Category
      - Scale / Funding
      - Target Segment
      - Key Differentiation
      - Key Limitation vs. Frore
    rows:
      - - xMEMS (XMC-2400)
        - Direct – MEMS solid-state cooling
        - Private startup; founded 2018; no public funding disclosed
        - Smartphones, tablets, SSDs
        - 9.26 × 7.60 × 1.08 mm; 30 mW power; 16× claimed airflow/volume vs. AirJet Mini Slim; IP58-rated
        - No confirmed customer device wins as of June 2026; lower absolute cooling wattage per chip than AirJet Mini G2
      - - Phononic
        - Adjacent – TEC solid-state cooling
        - Private; ~$1.5B reported sale-talks valuation (2026)
        - AI data center GPU hotspot, rack cooling
        - Software-defined TEC platform; millisecond thermal response; scalable across GPU/DPU/NIC
        - TEC mechanism unsuited to ultra-thin sealed edge devices; lower power efficiency than active airflow
      - - Boyd Corporation / Aavid (Eaton)
        - Incumbent – vapor chambers, liquid cooling
        - $1.7B projected 2026 revenue; acquired by Eaton for $9.5B (Nov 2025)
        - Thin laptops, data centers, aerospace, automotive
        - Broadest portfolio; $9.5B Eaton backing; deep OEM qualification relationships
        - Vapor chambers cannot generate convective airflow; passive in sealed systems
      - - Nidec Group
        - Incumbent – miniature fans
        - Large-cap, Japan; ~¥2T revenue overall
        - Thin laptops, consumer electronics globally
        - Ultra-thin fans <3 mm; noise-optimized blade spacing; proven mass-production quality
        - Mechanical noise (30–50 dBA); dust accumulation; wear; no IP-rating capability
      - - Delta Electronics
        - Incumbent – fan + passive modules
        - Large-cap, Taiwan; ~$10B revenue overall
        - Notebooks, edge AI, data center modules
        - Integrated passive/active thermal modules; broad notebook OEM supply relationships
        - Passive modules hit thermal limits in sustained AI edge workloads; sealed-device performance gap
      - - Traditional Coldplate Makers (Vertiv, CoolIT, Laird)
        - Incumbent – data center liquid cooling
        - Vertiv $7B+ revenue; CoolIT and Laird private
        - Hyperscale and colocation data centers
        - Established supply relationships; proven reliability; drop-in upgrades
        - 2D microchannel design inadequate for non-uniform high power density of next-gen GPUs
      - - 'Status-quo: fan + vapor chamber (OEM integrated)'
        - Substitute – combined passive-active
        - N/A – integrated into laptop OEM BOM
        - Most consumer and commercial laptop OEMs
        - Low cost; wide component availability; no qualification risk for OEM
        - Acoustic noise; dust; mechanical wear; convection-limited in sealed thin designs (~12–20 W TDP ceiling)
      - - Red Magic / Nubia gaming phone fans
        - Substitute – high-speed fan
        - Private (ZTE subsidiary)
        - Gaming smartphones
        - 20,000 RPM active fan; effective sustained gaming performance
        - Loud (35+ dBA); adds thickness; impractical for mainstream, ultra-thin or industrial form factors
