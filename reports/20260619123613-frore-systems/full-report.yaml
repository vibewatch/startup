              implied revenue multiple of approximately 149x — a level that TheCoolingReport explicitly flagged as
              "extraordinary for this category," noting that Frore is already valued at 65% of the entire projected
              immersion cooling market by 2032 before its data-center product is widely deployed. With no public
              revenue, gross margin, burn rate, or cash position, the key financial inputs required to independently
              underwrite the valuation are entirely absent. This opacity is standard for private companies but creates a
              severe due-diligence gap at this valuation level.
