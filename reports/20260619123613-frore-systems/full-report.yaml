          - type: callout
            title: Prioritize Revenue and Burn Transparency Before Committing to Valuation
            body: >-
              Any investor evaluating Frore at or above the $1.64 billion mark must obtain, under NDA, (1) audited or
              management-certified trailing-twelve-month revenue by product line, (2) monthly P&L and burn-rate trend
              for the preceding twelve months, (3) at least one named hyperscaler reference confirming LiquidJet
              deployment at volume, and (4) the current Taiwan fab unit cost and gross-margin waterfall for AirJet Mini
              G2. Without these four data points, the valuation is entirely forward-looking and unverifiable from public
              sources.
