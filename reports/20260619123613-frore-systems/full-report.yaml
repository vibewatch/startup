  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - LiquidJet revenue and customer identity
        - Named hyperscaler customer, contract value, and 2026 revenue run rate
        - Entire data-center thesis and 149x multiple depend on LiquidJet proving hyperscaler adoption
        - Company IR disclosure; direct investor conversation; channel check with Nvidia/AMD reference accounts
      - - Gross margin and MEMS manufacturing economics
        - Unit economics per AirJet chip and LiquidJet cold-plate; gross margin % at current volume
        - Deep-tech hardware companies can be unprofitable at scale; margin structure determines IPO readiness
        - Audited financials or management accounts; fab-level cost data from TSMC/manufacturing partner
      - - Cap table, preference stack, and liquidation waterfall
        - Investor stake %, preference multiples, participation rights, anti-dilution provisions
        - Late investor returns at the $1.64B mark depend on preference stack vs. common stock treatment
        - Cap table analysis; term sheet review; Series D investor presentations
      - - Runway and burn rate post-Series D
        - Actual monthly cash burn rate and cash position as of Q2 2026
        - Estimated $143M provides 18–48 months (wide range); actual figure determines urgency of next financing
        - Management accounts; CFO interview; triangulate from headcount ($3–8M/month benchmark for ~79 employees)
      - - Competitive moat durability vs. Vertiv/Eaton-Boyd
        - Frore's engineering roadmap vs. Vertiv's liquid cooling pipeline and Eaton-Boyd's $9.5B capability acquisition
        - Incumbents are now better capitalized; moat durability determines premium acquisition vs. displacement risk
        - Product roadmap disclosure; patent landscape analysis; Vertiv/Eaton product catalog review
      - - Board composition and governance
        - Board member identities, investor governance rights, and any related-party conflicts
        - Undisclosed governance creates opacity around strategic decisions and potential liquidity events
        - Company disclosure; SEC Form D filings; LinkedIn board search; investor announcement press releases
    notes: >-
      Diligence items are prioritized by materiality to the investment recommendation; items 1–3 are blocking without
      which the recommendation cannot be upgraded above research-more.
    claimRefs:
      - CV001
      - CV003
      - CV022
      - CV027
      - CV046
