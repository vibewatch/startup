  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to thesis
      - Action implication
    rows:
      - - LiquidJet revenue fails to materialize
        - Revenue below $20M with no named hyperscaler customer by end of FY2027
        - Core data-center thesis unverifiable; 149x multiple collapses to 75–100x on stagnant revenue
        - Escalate to avoid; exit secondary positions; do not participate in Series E at current mark
      - - Down-round Series E financing
        - Series E post-money valuation below $1.64B Series D mark
        - Confirms market re-rating of hyperscaler traction expectations; investor base fractured
        - Immediate thesis break; review cap table for structural protection; monitor for distressed exit
      - - Qualcomm Snapdragon reference design relationship terminated
        - No AirJet Mini G2 in next Snapdragon platform generation
        - Removes largest OEM pull-through multiplier for AirJet volume; edge revenue stalls
        - Partially negative; reassess bull probability; monitor Lenovo/ZOTAC design-win pipeline
      - - Series D runway exhausted with no scale evidence
        - Cash reserves below ~$30M before LiquidJet deployments confirmed (est. by late 2027)
        - Capital crisis; financing options limited to distressed acquirer or bridge at punitive terms
        - Immediate exit or avoid; signal of operational burn exceeding expected model
      - - Incumbent competitor launches equivalent solid-state cooling product
        - Vertiv, Eaton, or Honeywell announces MEMS-based active cooling within 24-month roadmap
        - IP moat narrative weakened; pricing power eroded before scale achieved
        - Shift from track to research-more; increase scrutiny of IP freedom-to-operate
    notes: >-
      Kill triggers are based on qualitative evidence risk assessment; no probability weightings are assigned.
      Thresholds are indicative and require investor-level diligence to operationalize.
