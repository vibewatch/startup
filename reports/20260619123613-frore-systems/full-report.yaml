companyProfile:
  summary: >-
    Frore Systems is a privately held semiconductor and thermal-management company founded in 2018 in Silicon Valley by
    former Qualcomm MEMS leaders Dr. Seshu Madhavapeddy and Dr. Surya P. Ganti. The company sells AirJet, a solid-state
    active cooling chip for thin PCs, edge AI devices, and rugged embedded systems, and is extending the same MEMS
    heat-transfer approach into LiquidJet cold-plate systems for AI data centers. Frore positions itself as a new
    thermal-stack infrastructure company rather than a conventional fan or heatsink vendor. Public evidence supports
