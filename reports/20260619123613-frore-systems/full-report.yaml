  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The investment thesis for Frore Systems rests on three interlocking claims. First, cooling has become the
              binding constraint for AI compute scaling: GPU rack densities approaching 100 kW make traditional air
              cooling physically inadequate, and Frore's solid-state MEMS technology addresses this for both the edge
              (AirJet) and the data center (LiquidJet). Second, Frore has accumulated significant defensible IP — a
              portfolio of approximately 200 related publications and patents, eight years of MEMS manufacturing
              knowledge, and a validated Qualcomm reference design relationship — that creates barriers to fast
              followership. Third, the thermal management market is expanding rapidly: IDC projects the AI data center
              liquid cooling market at $6.41B in 2026, growing to $29.5B by 2033 at a 20–26% CAGR, and Gartner projects
              a 55.8% YoY increase in data center systems spending in 2026.

              The anti-thesis is equally compelling. LiquidJet revenue has not been publicly confirmed by any named
              hyperscaler or cloud operator, making the data-center thesis unverifiable. The AirJet consumer/edge
              segment, while commercially validated, addresses a market that generates modest absolute revenue relative
              to the $1.64B valuation. Incumbent liquid cooling players — Vertiv ($128.7B EV, $15B backlog) and Eaton
              (which paid $9.5B for Boyd Thermal at 22.5x EBITDA in November 2025) — dwarf Frore in capital, channel
              relationships, and hyperscaler procurement trust. The capital efficiency ratio of 4.8x (valuation/total
              funding) signals that investors are pricing in an extremely aggressive growth ramp that has yet to
              materialize in the public record. Any slowdown in AI infrastructure buildout or competitive displacement
              in the LiquidJet segment would leave the current $1.64B mark unsupported.
