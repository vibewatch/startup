            title: Analyst Scope Divergence Creates 15x Market Size Range for 'Data Center Cooling'
            body: >
              Investors and founders citing $81.88B (Precedence Research) or $80.1B (Allied Market Research) as Frore's
              addressable market are using a figure that includes facility-level HVAC, precision air conditioning, and
              chiller plants—segments where Frore has no product. The narrow, relevant SAM (direct liquid cooling
              modules, Mordor Intelligence) is $5.52B in 2025. The 15x gap between the widest and narrowest estimate is
              entirely definitional, not forecasting uncertainty. Applying the wrong denominator inflates perceived
              market opportunity by an order of magnitude.
            calloutType: risk
            claimRefs:
              - CM011
              - CM017
              - CM023
          - type: callout
            title: Liquid Cooling Growing 3x Faster Than Broader Thermal Management Market
            body: >
              The data center liquid cooling market's 22.65% CAGR (Mordor) is nearly three times the 7.85% CAGR of the
              broader electronics thermal management market. This means Frore's primary segment is growing substantially
              faster than the overall thermal management hardware sector, driven by AI GPU density escalation. The AI PC
              market at 18.66% CAGR adds a second fast-growth segment. Both of Frore's target markets are in the
              fastest-growing tier of electronics infrastructure.
            calloutType: insight
            claimRefs:
