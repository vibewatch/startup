            title: Dual-Platform Thermal Strategy Across AI Stack
            body: >
              Frore Systems addresses thermal management at both ends of the AI compute spectrum: AirJet targets edge
              and consumer AI devices (thin laptops, industrial IoT gateways, 5G hotspots) where fans are impractical,
              while LiquidJet and LiquidJet Nexus target hyperscale AI data centers cooling NVIDIA GPUs. This
              dual-market positioning means Frore can capture value from the consumer AI device wave and the
              infrastructure AI build-out simultaneously, reducing single-segment dependency.
