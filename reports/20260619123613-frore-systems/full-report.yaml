              With only four to five confirmed production-stage OEM relationships publicly documented, any disruption to
              the Sonim/FirstNet relationship or delay in Lenovo/Qualcomm pipeline conversion to shipping products would
              be highly material to near-term revenue. Frore has not disclosed revenue, customer count, or ARR, making
