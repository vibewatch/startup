              In June 2026, Frore announced a collaboration with Lenovo's Innovation Accelerator to explore integrating
              AirJet Mini into future Lenovo products. Frore also demonstrated LiquidJet cooling for a 1,950W NVIDIA
              Rubin GPU at Computex 2026. Despite strong momentum, enterprise customers (cloud providers, governments)
              remain undisclosed, and specific revenue metrics are not public.
