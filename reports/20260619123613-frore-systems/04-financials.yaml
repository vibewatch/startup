  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-opacity
      missingEvidence: >-
        Audited or management-certified income statement showing revenue by product line, gross
        margin, operating expense breakdown, and EBITDA for fiscal year 2025 and TTM 2026.
      whyItMatters: >-
        Without revenue and margin data, the $1.64 billion valuation cannot be independently
        underwritten; the 149x estimated revenue multiple is unverifiable and the financial
        path to breakeven is entirely opaque.
      diligencePath: >-
        Request audited financials or management accounts under NDA from Frore Systems; verify
        with independent auditor confirmation or investor data-room access.
      relatedQuestionRefs:
        - QI012

    - type: private-evidence-only
      severity: material
      topic: capital-adequacy
      missingEvidence: >-
        Monthly burn rate trend for the 12 months preceding June 2026, current cash balance,
        and forward runway estimate prepared by Frore management after the Series D close.
      whyItMatters: >-
        Without burn rate and runway data, it is impossible to assess whether the $143 million
        Series D provides adequate capital to reach LiquidJet revenue milestones or whether a
        follow-on raise is imminent.
      diligencePath: >-
        Request monthly cash flow summary and projected runway calculation from CFO or investor
        relations; cross-check with board-level financial package.
      relatedQuestionRefs:
        - QI019

    - type: missing-source
      severity: material
      topic: customer-concentration
      missingEvidence: >-
        At least one publicly named hyperscaler or major cloud provider confirming commercial
        deployment of LiquidJet or LiquidJet Nexus at production volume.
      whyItMatters: >-
        The data-center revenue thesis underpinning the $1.64 billion valuation is unverifiable
        without a named customer reference; Frore declined to identify any in the SiliconANGLE
        Series D coverage.
      diligencePath: >-
        Request customer reference under NDA; review any customer case studies, purchase orders,
        or deployment confirmations in the data-room.
      relatedTableRefs:
        - TI005

    - type: missing-source
      severity: material
      topic: unit-economics-oemvsdc
      missingEvidence: >-
        Per-unit ASP, COGS, and gross margin data for AirJet consumer/edge and LiquidJet
        data-center product lines separately, along with volume shipped per product line.
      whyItMatters: >-
        Without product-level unit economics it is impossible to compare margin profiles
        or assess which product line will drive profitability at scale.
      diligencePath: >-
        Request a product-line P&L or gross-margin bridge from management; review bill-of-
        materials and foundry contracts under NDA.
      relatedQuestionRefs:
        - QI011
        - QI014

    - type: missing-source
      severity: informational
      topic: oem-cac-salesCycle
      missingEvidence: >-
        Published or management-disclosed customer acquisition cost and average design-win
        sales cycle length for AirJet OEM engagements.
      whyItMatters: >-
        OEM design-win cycles of 12–24 months imply high upfront selling expense and delayed
        cash payback; CAC payback visibility is necessary to evaluate capital efficiency.
      diligencePath: >-
        Request average sales-cycle length and CAC metrics from the sales team; review any
        existing OEM contracts for design-win incentive structures.
      relatedQuestionRefs:
        - QI015

