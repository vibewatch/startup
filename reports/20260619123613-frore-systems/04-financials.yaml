callouts:
  - calloutType: strength
    title: Strong Investor Syndicate and Strategic Alignment
    body: >-
      Frore's Series D syndicate includes Fidelity Management & Research (institutional capital at
      scale), Qualcomm Ventures (strategic alignment with a major chip OEM customer), and Mayfield
      Fund (early lead investor maintaining conviction through four rounds). The presence of
      institutional investors like Fidelity signals that the investment thesis has survived due
      diligence at a level beyond typical venture-only funding. Qualcomm Ventures' participation
      across both Series C and Series D creates a strategic moat: Qualcomm's reference designs
      featuring AirJet give Frore embedded distribution into the Snapdragon ecosystem.
    claimRefs:
      - CI004
      - CI031
      - CI035

  - calloutType: risk
    title: Extraordinary Revenue Multiple With Undisclosed Financial Fundamentals
    body: >-
      At an estimated ~$11 million in 2026 revenue and a $1.64 billion post-money valuation, Frore
      carries an implied revenue multiple of approximately 149x — a level that TheCoolingReport
      explicitly flagged as "extraordinary for this category," noting that Frore is already valued at
      65% of the entire projected immersion cooling market by 2032 before its data-center product is
      widely deployed. With no public revenue, gross margin, burn rate, or cash position, the key
      financial inputs required to independently underwrite the valuation are entirely absent. This
      opacity is standard for private companies but creates a severe due-diligence gap at this
      valuation level.
    claimRefs:
      - CI016
      - CI017
      - CI014
      - CI037

  - calloutType: recommendation
    title: Prioritize Revenue and Burn Transparency Before Committing to Valuation
    body: >-
      Any investor evaluating Frore at or above the $1.64 billion mark must obtain, under NDA,
      (1) audited or management-certified trailing-twelve-month revenue by product line,
      (2) monthly P&L and burn-rate trend for the preceding twelve months,
      (3) at least one named hyperscaler reference confirming LiquidJet deployment at volume,
      and (4) the current Taiwan fab unit cost and gross-margin waterfall for AirJet Mini G2.
      Without these four data points, the valuation is entirely forward-looking and unverifiable
      from public sources.
    claimRefs:
      - CI030
      - CI037
      - CI023

