callouts:
  - calloutType: insight
    title: The Procurement Bifurcation in Enterprise AI
    body: >-
      Writer's enterprise sales motion bypasses departmental software budgets by targeting central IT and InfoSec stakeholders [CP001]. While point solutions like Jasper and Maestrix offer faster departmental time-to-value for marketing teams, Writer's focus on Palmyra LLM transparency, HIPAA/SOC 2 compliance, and knowledge-graph grounding establishes high switching costs once deployed across multiple business units [CP001, CP003, CP005].
    claimRefs:
      - CP001
      - CP003
      - CP005
  - calloutType: risk
    title: Configuration Overhead and Mid-Market Displacement
    body: >-
      Writer's platform breadth creates an ongoing adoption trade-off: marketing-specific depth requires extensive configuration and weeks of deployment time, creating vulnerabilities to agile, opinionated marketing operating systems that offer immediate out-of-the-box utility [CP003].
    claimRefs:
      - CP003
