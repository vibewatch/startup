      - ["Bespoke applications", "Custom delivery or services component", "Project, milestone, or labor unit not disclosed", "Price and recognition policy unavailable", "Company confirms bespoke delivery, not its economics", "Provide services backlog, attach rate, utilization, and gross margin"]
