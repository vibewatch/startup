      - ["APIs", "Usage-based; metering unit unavailable", "Neither list nor realized rate disclosed", "Committed use, overage, and model mix unknown", "Dexter-reported strategy; Writer confirms APIs and SDKs"]
      - ["Bespoke applications", "Custom contract; amount unavailable", "No public price", "Scope, staffing, and change-order economics unknown", "Writer confirms bespoke apps are designed and built for customers"]
      - ["Human-authored business-plan substitute", "$1,500-$5,000 for most startups", "Supplier-published market range, not Writer pricing", "Scope and complexity drive the range", "Narrow substitute benchmark only; not directly comparable to enterprise AI"]
    notes: "Pricing coverage is partial. The substitute benchmark is issuer-provided and is included only to illustrate the cost of one human-service alternative, not to estimate Writer revenue."
    claimRefs: ["CI002", "CI003", "CI015"]
  - id: "TI003"
    title: "Traction and unit-economics underwriting grid"
    columns:
      - "Metric"
      - "Public value"
      - "Confidence"
      - "Why it matters"
      - "Diligence ask"
    rows:
      - ["2024 revenue", "$47M", "Low-to-medium; one third-party profile", "Establishes a historical scale marker but is not ARR", "Reconcile to audited GAAP revenue and recurring-revenue schedule"]
      - ["Customer count", "More than 300", "Medium; third-party count aligns directionally with official 'hundreds'", "Provides adoption context but no concentration or spend distribution", "Provide paid-customer definition, ACV distribution, and top-10 concentration"]
      - ["Customer ROI", "9x average", "Low-to-medium; company-claimed", "May support value-based selling but methodology is undisclosed", "Provide sample, period, denominator, and independently validated case data"]
      - ["Gross margin", null, "Unavailable", "Core test of inference, hosting, support, and services burden", "Provide gross margin by subscription, API, and services stream"]
      - ["CAC payback and retention", null, "Unavailable", "Tests direct-sales efficiency and expansion durability", "Provide CAC, payback, logo retention, GRR, NRR, and cohort expansion"]
      - ["Cash, burn, and runway", null, "Unavailable", "Determines financing dependency and downside resilience", "Provide current cash, monthly burn, debt, committed spend, and board-approved plan"]
    notes: "Reported revenue is preserved as revenue, not ARR. Null values denote missing public evidence and each is paired with a specific diligence request."
    claimRefs: ["CI005", "CI006", "CI007", "CI008", "CI009", "CI016"]
