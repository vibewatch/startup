evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure-gap
    missingEvidence: >-
      Company-issued current ARR, recognized revenue, gross margin, net burn, cash balance, runway, debt, customer
      concentration, and net retention with periods and definitions.
    whyItMatters: >-
      Without these metrics, the current scale, capital efficiency, liquidity, and durability of the $1.9 billion
      valuation cannot be evaluated.
    diligencePath: >-
      Request audited financial statements, monthly management accounts, bank and debt schedules, cohort retention, and
      a customer-concentration report from the company data room.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: funding-and-headcount-conflicts
    missingEvidence: >-
      A reconciled financing schedule and dated payroll census explaining the $326 million versus $369 million funding
      totals and the 145, 602, and 1,376 employee figures.
    whyItMatters: The conflicts prevent reliable estimates of dilution, organizational scale, and operating expense.
    diligencePath: >-
      Reconcile the certified cap table and cash ledger to financing announcements, and obtain a dated employee roster
      by function and geography.
    relatedQuestionRefs:
      - QO003
      - QO007
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance-and-cap-table
    missingEvidence: >-
      Complete executive biographies and succession plans, the current full board roster, founder and investor
      ownership, the option pool, voting agreements, liquidation preferences, and secondary transactions.
    whyItMatters: >-
      Role titles, announced participation, and two incoming directors do not establish management depth, succession
      readiness, current control, economic seniority, or fully diluted ownership.
    diligencePath: >-
      Obtain executive biographies and succession plans plus the charter, bylaws, board minutes, voting agreements,
      investor rights agreements, and certified fully diluted cap table.
    relatedQuestionRefs:
      - QO002
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: minor
    topic: adverse-events
    missingEvidence: >-
      An eligible assigned source establishing whether Writer has faced material lawsuits, regulatory actions,
      sanctions, recalls, security breaches, or outages.
    whyItMatters: >-
      The assigned adverse query produced no retained URL, and that evidence gap cannot be interpreted as proof that no
      incident occurred.
    diligencePath: >-
      In a later authorized search cycle, review court dockets, regulator databases, security disclosures, status
      history, and reputable adverse reporting.
    relatedQuestionRefs:
      - QO007
