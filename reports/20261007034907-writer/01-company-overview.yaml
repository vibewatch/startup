company:
  name: "Writer"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Writer is a San Francisco enterprise AI company launched in 2020 by May Habib and Waseem AlShikh, with a proprietary-model and agent platform sold to large enterprises. Its last disclosed financing was a $200 million Series C at a $1.9 billion valuation in November 2024; current operating scale is materially less certain because public trackers conflict on funding, headcount, customers, and revenue."
sections:
  - id: "identity-product-and-business-model"
    title: "Identity, Product, and Business Model"
    body: >-
      Writer was launched in 2020 by May Habib and Waseem AlShikh after the pair had worked
      together on enterprise localization since 2013. The company lists its headquarters at
      111 Maiden Lane in San Francisco and additional offices in New York, London, Chicago,
      and Austin. Its present positioning is an enterprise AI agent platform: company-issued
      materials emphasize agents, proprietary Palmyra language models, company-data grounding,
      governance controls, and integrations with enterprise systems. An independent company
      profile likewise describes a full-stack platform for building, activating, and supervising
      AI applications, workflows, and agents. A third-party profile reports a per-user seat model
      plus usage-based API pricing, but the reviewed evidence does not disclose current contract
      sizes, seat mix, consumption mix, or recognized revenue. The product identity is therefore
      well supported, while the economics of the commercial model remain a diligence item.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO013"
    tableRefs:
      - "TO001"
  - id: "leadership-governance-and-capital"
    title: "Leadership, Governance, and Capital"
    body: >-
      Writer remains founder-led: Habib is chief executive and AlShikh is chief technology
      officer. The official roster also identifies functional leaders across revenue, marketing,
      finance, operations, people, security, strategy, legal, engineering, research, and product.
      That breadth reduces obvious functional vacancies, but public biographies are too thin to
      independently assess each executive's tenure or prior results. Founder-market fit is
      strongest in the pair's long operating history in language technology and enterprise
      content, while key-person dependence remains meaningful because the chief executive and
      chief technologist are also the founders. In the November 2024 Series C, Writer said
      Premji Invest's Sandesh Patnam and Radical Ventures' Rob Toews would join the board.
      Other investors span growth funds, corporate venture arms, and customers, but public
      disclosures do not establish voting control, ownership percentages, liquidation
      preferences, or the full current board composition.
    claimRefs:
      - "CO001"
      - "CO007"
      - "CO008"
      - "CO009"
    tableRefs:
      - "TO002"
      - "TO003"
  - id: "funding-scale-and-milestones"
    title: "Funding, Scale, and Milestones"
    body: >-
      Writer's last company-announced financing was a $200 million Series C on November 12,
      2024 at a $1.9 billion valuation. One company profile reconstructs four priced rounds
      totaling $326 million, while Everything-PR reports $369 million across 12 rounds; the
      difference is not reconciled in the assigned evidence and could reflect additional
      financings, classification choices, or tracker error. Scale indicators are even less
      stable. Company materials say hundreds of enterprises use Writer, DexterAgent reports
      more than 300 customers, and independent profiles display incompatible employee counts
      of 145, about 602, and 1,376. These figures should not be blended into a precise operating
      estimate. The product timeline nevertheless shows continued execution after the Series C,
      including AI HQ in 2025 and a May 2026 brand-governance release. Everything-PR also flags
      the strategic trade-off in proprietary models: deployment and data-control benefits come
      with a lower general-benchmark capability ceiling than frontier general-purpose models.
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO014"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
