            body: >-
              企业席位和 API 使用可以带来经常性收入及扩张收入，因此该模式具备软件业务的吸引力；但定制应用和企业直销也可能增加实施人力、拉长销售周期。指定公开证据无法量化这些影响。UpMarket 的 $2.08
              billion 模型估值明确依赖多项外部输入，可能偏离二级市场可执行价格；其对 Writer 股份流动性不足的警告，也进一步说明私营公司应计入信息不对称折价。目前，这套投资逻辑的财务论证只到品类和
              traction 为止。做出决策还需要经审计收入、按收入流拆分的毛利率、留存率、集中度、CAC 回收期、现金消耗、现金余额、债务和下行融资计划。
