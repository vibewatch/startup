      - number: '8.4'
        title: 投资判断建议、流动性期限与止损标准
        blocks:
          - type: paragraph
            body: >-
              综合现有实证证据，对 Writer 的正式投资建议是继续跟踪；置信度中等、总体风险高，估值也已偏贵 [CV006, CV014]。Writer
              拥有世界级企业客户、顶级机构投资者，以及区别于浅层封装工具的自有模型能力 [CV001、 CV004、CV005]。但 $1.9B 的一级市场估值和 $1.69B 的二级市场价格，已经把完美执行的超高速增长计入
              价格，却忽略了关键基本面仍未得到验证 [CV002、CV006、CV010]。由于公开记录无法确认毛利率、现金消耗率、客户流失率和真实 ARR
              增长，按当前价格买入会让资金暴露于严重的下行不对称风险，且没有安全边际 [CV006、CV008、CV011]。


              退出准备度目前受限；Forge 的 IPO 跟踪显示，Writer 尚未提交保密或公开的 Form S-1 注册声明，潜在上市至少还要等 18 至 36 个月
              [CV002、CV015]。触发降级为规避的关键论点失效条件包括：（1）Vanguard 或 Accenture 等锚定客户的企业账户年流失率超过 10%；（2）主要分销伙伴 Salesforce 或 Adobe
              原生捆绑竞争性智能体能力；或（3）GPU 计算和推理成本上涨，导致毛利率跌破 60% [CV001、CV007、CV014]。在投入机构资本前，投资者必须解决强制尽调事项，包括经审计的 ARR
              桥接表、按客户划分的 cohort 留存表，以及完整的股权结构表披露 [CV006、CV014、CV016]。
            claimRefs:
