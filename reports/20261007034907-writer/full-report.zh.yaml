chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与商业模式
        blocks:
          - type: paragraph
            body: >-
              Writer 于 2020 年由 May Habib 和 Waseem AlShikh 创办；两人自 2013 年起共同从事企业本地化。公司将总部列为旧金山 111 Maiden
              Lane，并在纽约、伦敦、芝加哥和奥斯汀设有办公室。如今，公司将自己定位为企业 AI agent 平台：公司材料强调 agents、自研 Palmyra 语言模型、公司数据
              grounding、治理控制以及与企业系统的集成。独立公司简介同样将其描述为用于构建、启用和监督 AI 应用、工作流及 agents 的全栈平台。第三方简介称其采用按用户席位计费，并叠加按使用量计费的 API
              价格；但审阅证据没有披露当前合同金额、席位组合、用量组合或确认收入。因此，产品定位有充分支撑，但商业模式的经济性仍是尽调事项。
            claimRefs:
