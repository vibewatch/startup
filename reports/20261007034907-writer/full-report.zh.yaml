      - number: '2.4'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              企业工作流覆盖面广，有机会替代分散的内容创作、研究、提案和协同任务，这些因素支持采用。Writer 报告称客户节省了数百万小时，平均投资回报率达到
              9x，并计划在医疗、零售和金融服务领域扩展快速启动应用。两者都是公司发布的信号，不是独立证明。与之相对的是不透明的企业定价，以及可能相当可观的
              API、专业服务、支持、安全和部署成本；审批与来源维护也会给组织带来负担。因此，估值应建立在独立验证的生产环境采用、净留存和单位经济性上，而不是仅看使用场景广度或声称的 ROI。
            claimRefs:
              - CM003
              - CM004
              - CM010
              - CM011
