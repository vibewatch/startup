            body: >-
              Writer 于 2024 年 11 月宣布以 $1.9B 估值完成 $200M Series
              C，资金拟用于产品开发、工作流扩展和团队增长。这笔融资证明公司在当时能够获得机构资本，但已募集资金不等于当前可用现金。没有留存来源报告 2026 年 10
              月的现金余额、月度净现金消耗、债务便利、营运资金需求或现金跑道估计。累计融资同样未解决：Tracxn 报告 12 轮合计 $369M，Dexter 报告
