      - number: '7.3'
        title: 平台依赖、生态合作方与渠道集中度
        blocks:
          - type: paragraph
            body: >-
              Writer 的平台架构高度依赖与外部企业软件套件、超大规模云基础设施和战略生态伙伴的深度集成。公司的 agent 工作流直接接入 Salesforce、Adobe、Snowflake、Google
              Workspace 和 Microsoft Teams 等第三方企业工具。Salesforce Ventures、Adobe Ventures、IBM Ventures 和 Citi Ventures
              等战略企业创投者，虽然验证了 Writer 的商业足迹，但这些平台合作方也在运营竞争性的内部生成式 AI 能力，并掌握平台把关权。合作方 API 的技术弃用、单方面改变数据连接器权限，或超大规模云厂商优先捆绑原生
              AI copilot，都会立即给 Writer 的多系统 agent 工作流带来运营摩擦。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
