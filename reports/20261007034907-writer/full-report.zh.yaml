              Writer 仍由创始人主导：Habib 任首席执行官，AlShikh
              任首席技术官。官方名册还列出收入、营销、财务、运营、人力、安全、战略、法务、工程、研究和产品等职能负责人。这样的覆盖面降低了明显职能空缺，但公开简历过于简略，无法独立评估每位高管的任期或过往业绩。两人的创始人—市场匹配度，主要来自其在语言技术和企业内容领域的长期运营经历；但关键人物依赖仍然显著，因为
