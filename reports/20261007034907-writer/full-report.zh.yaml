        title: 证据图表
        blocks:
          - type: callout
            title: 跟踪立场强化估值买入纪律
            body: >-
              Writer 对蓝筹企业的渗透和自有全栈 AI 能力，说明其在企业智能体市场执行力很强。但要按 $1.9B 一级估值买入——甚至按二级市场折价后的 $1.69B Forge Price
              买入——就必须接受未经确认的 20x 至 40x 追踪收入倍数，且毛利率或现金消耗完全没有经验证的可见度。投资者应密切跟踪 Writer，只有在已验证 ARR 超过 $120M
              或二级市场价格重估时，才应考虑买入。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV010
              - CV014
          - type: callout
            title: 二级市场 Forge 折价预示倍数下行压力
            body: >-
              Forge Global 的二级交易指示价为 Writer 股票 $46.33，较 $52.03 的 Series C 价格折价 11%，对应隐含 估值
              $1.69B。清算优先权层级虽能保护高级优先股资本，但二级市场缺乏流动性、交易频率低，以及伙伴渠道风险，都让后期投资者面临显著的倍数收缩风险。
