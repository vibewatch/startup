      - number: '7.4'
        title: 财务不透明、资本配置与尽调监控框架
        blocks:
          - type: paragraph
            body: >-
              Writer 的资本结构和运营指标高度不透明，限制了独立财务核验。尽管公司于 2024 年 11 月以 $1.9B 投后估值完成 $200M Series C，使包括 Premji Invest、Radical
              Ventures 和 ICONIQ Growth 在内的机构支持者累计融资达到 $326M，但关键运营指标仍完全私有。公开二级来源报告的员工数无法勾稽，从私募创业数据库中的 145 人，到联合企业目录中的
              1,376 人；净现金消耗率、毛利率和年度客户流失率也没有披露。要为当前估值溢价做投资判断，必须建立明确的论点破坏型止损标准，例如多家企业账户流失、未缓解的监管制裁或 API 利润率长期受压。
            claimRefs:
