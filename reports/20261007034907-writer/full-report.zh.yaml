  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 企业生成式 AI 格局与定位
        blocks:
          - type: paragraph
            body: >-
              企业生成式 AI 市场已经从早期模型试验，走向分层明确的运营阶段 [CP001]。企业软件买方不再只看底层 LLM 参数量，而是评估平台的品牌语气治理、知识图谱集成、agent 工作流深度和信息安全认证
              [CP001]。在这一环境下，Writer 以全栈平台占据差异化位置，提供自研 Palmyra 大语言模型、基于图的检索增强生成（RAG）和严格的企业护栏 [CP005, CP008]。


              市场替代方案分为几类：以营销为核心的老牌写作助手（最典型的是 Jasper）、灵活的工作流构建平台（如 Copy AI）、专门的品牌管理系统（如 BrandHalo）和垂直营销操作系统（如
              Maestrix）[CP001, CP002, CP003]。专业工具服务于部门级营销速度，而 Writer 面向横向、由 IT 赞助的部署，覆盖营销、法务、运营和客户支持 [CP003,
              CP005]。现状替代方案还包括直接基于前沿模型 API（如 OpenAI 或 Anthropic）的内部开发，以及通用型企业
              copilot；但面对受监管数据环境，企业买方越来越要求开箱即用的数据驻留、可审计性和基于角色的访问控制 [CP001, CP003, CP008]。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
