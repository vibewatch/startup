        title: 监管、知识产权与数据合规敞口
        blocks:
          - type: paragraph
            body: >-
              企业生成式 AI 平台正因训练数据来源、版权责任和跨境数据隐私标准而受到越来越严格的审查。Writer 通过自研 Palmyra 大语言模型和企业护栏应对这些合规问题，强制模型训练不保留数据，并配合 SOC 2
              和 GDPR 控制。不过，欧盟新兴 AI 监管框架及美国联邦层面的审查，带来了明显的运营不确定性。部署直接接入客户企业知识图谱的自主 agent 系统，会让 Writer 及其《财富》500
              强客户暴露于潜在的数据驻留冲突和知识产权争议。尽调必须确认模型赔偿、监管审计准备度，以及金融服务和医疗等受监管垂直领域的持续合规监控安排。
            claimRefs:
              - CR001
