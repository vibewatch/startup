      - number: '1.3'
        title: 融资、规模与里程碑
        blocks:
          - type: paragraph
            body: >-
              Writer 最近一次由公司宣布的融资，是 2024 年 11 月 12 日以 $1.9B 估值完成的 $200M Series C。一份公司简介重构出四轮定价融资、合计 $326M；Everything-PR
              则报告 12 轮合计 $369M。指定证据没有勾稽这项差异，可能反映额外融资、分类口径或追踪器错误。规模指标更加不稳定。公司材料称有数百家企业使用 Writer，DexterAgent 报告客户超过 300
              家，而独立简介显示员工数分别为 145、约 602 和 1,376。不能把这些数字拼成一个精确的运营估计。不过，产品时间线仍显示 Series C 后持续执行，包括 2025 年的 AI HQ 和 2026 年
              5 月的品牌治理发布。Everything-PR 也指出自研模型存在战略取舍：部署和数据控制有优势，但相较前沿通用模型，其通用基准能力上限更低。
