            title: 不要把最宽泛的市场叙事资本化
            body: 现有来源支持广泛的工作流适用性和较宽的合同金额区间，但不支持全市场收入池、Writer 可获得的份额或独立验证的部署经济性。在把叙事转化为估值倍数前，投资判断应先使用客户层面的 cohort 和生产环境扩张数据。
            calloutType: risk
