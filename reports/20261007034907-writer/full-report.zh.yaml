      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开信号指向多利益相关方销售。Dexter 将首席营销官、内容经理和 IT 负责人列为买方画像，而 Writer
              当前定位面向营销人员、销售人员、运营人员，以及负责批准集成和控制措施的技术团队。提案工作流展示了采用路径：写作者需要协调销售、产品、财务、法务、安全和技术专家，因此平台必须把获准知识集中起来，同时不削弱专家审核。预算归属因此可能在营销或收入运营，与集中式
              IT 或 AI 转型项目之间变化。这个机制从工作流证据看是合理的，但来源池没有披露实际预算拆分、席位激活、扩张率、采购周期或从试点转入生产的转化率。
            claimRefs:
