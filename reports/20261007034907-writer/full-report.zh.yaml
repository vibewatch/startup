              - CP006
      - number: '3.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 企业 AI 采购的分流
            body: >-
              Writer 的企业销售绕开部门软件预算，直接面向中央 IT 和 InfoSec 利益相关方 [CP001]。Jasper 和 Maestrix 等点解决方案能让营销团队更快获得部门级价值，而 Writer 聚焦
              Palmyra LLM 透明度、HIPAA/SOC 2 合规和知识图谱 grounding；一旦部署到多个业务单元，就会形成较高迁移成本 [CP001, CP003, CP005]。
            calloutType: insight
            claimRefs:
              - CP001
              - CP003
              - CP005
          - type: callout
            title: 配置负担与中型市场替代
            body: Writer 的平台广度带来持续的采用取舍：营销专用深度需要大量配置和数周部署，因此容易被能够开箱即用、快速提供价值的灵活且强观点的营销操作系统替代 [CP003]。
            calloutType: risk
            claimRefs:
