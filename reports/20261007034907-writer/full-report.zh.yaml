        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              相关市场比全部生成式 AI 支出更窄。Writer 将产品定位为覆盖营销和收入工作流的企业 agent 平台，产品边界内还包括知识、治理、连接器和工作流执行。相关支出可能包括席位、平台访问、API
              消耗、集成、定制、支持和变更管理工作。人工技术写作人员、提案专家、白皮书机构、通用生产力工具和原始模型 API，属于替代方案或邻接市场，不能自动算作 Writer
              可触达的收入。这一区分很重要：劳动力和服务基准能说明买方目前为部分工作支付多少，但不能把它们当作互不重叠的 TAM，直接加到软件合同金额上。
