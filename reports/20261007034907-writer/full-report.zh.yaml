        - 已验证的机构 C 轮融资（$200M）和 Forge 二级市场信号，与未经验证的 ARR、现金消耗和员工数指标形成对比。
        - 在经过审计并核实一手会计记录前，尽调信心上限受限。
      - - 风险评级
        - 高
        - 面临原生软件巨头（Salesforce、Adobe）的高竞争暴露、平台把关以及计算成本导致的利润率波动。
        - 要求较高回报门槛（>2.5 倍 MOIC），以抵消平台和合作伙伴集中风险。
      - - 估值立场
        - 偏高
        - C 轮主估值 $1.9B（$52.03/股）和 Forge 二级价格 $1.69B（$46.33/股）对应 20 倍至 40 倍历史收入倍数。
        - 投资前应等待入场估值重估，或收入大幅增长（同比 >70%）。
      - - 流动性 / 退出期限
        - 36-48 个月（IPO/M&A）
        - 未提交保密 S-1；二级股份成交量低、缺乏流动性，且在 Forge 上有 11% 价格折让。
        - 按非流动性私募成长资产的持有期评估；不要依赖近期公开市场流动性。
    notes: 基于 C 轮条款、Forge 二级价格和尽调披露的事实性投资评估综合；避免使用 null 值。
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV010
      - CV014
      - CV015
  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 支柱
      - 投资论点（乐观情景）
      - 反论点（悲观情景脆弱点）
      - 哪些变化会改变判断
    rows:
      - - 技术与架构
        - 自有 Palmyra LLM、图 RAG 和护栏绕开商业封装依赖，形成较高技术差异化。
        - 前沿基础模型（OpenAI、Anthropic）持续进步，可能使定制自有模型商品化。
        - 独立基准证明 Palmyra 在推理成本低 50% 的情况下，仍保持明确的企业任务准确率优势。
      - - 商业 GTM 与客户
        - 已打入财富 500 强企业账户（Vanguard、Intuit、Uber、Salesforce），并报告客户 ROI 达 9 倍。
        - 试点部署可能用户参与度低、席位流失高，或难以扩展到营销部门之外。
        - 经审计的净收入留存率（NRR）数据显示企业账户队列扩张超过 125%。
      - - 平台与渠道生态
        - 与 Salesforce、Adobe 和 Snowflake 深度连接，并获得直接的企业风投战略投资支持。
        - 渠道合作伙伴运营竞争性 AI 代理，并掌握 API、连接器数据和原生捆绑的准入权。
        - 正式多年期 OEM 分销协议，保证 API 同等能力和非歧视性平台访问。
      - - 资本结构与估值
        - 资产负债表资本充足，已融资 $305.5M-$326M，并获优质成长型投资方（Premji、Radical、ICONIQ）支持。
        - $1.9B 估值对应 23 倍至 40 倍收入倍数；Forge 二级市场 $1.69B 价格反映 11% 折让和流动性不足。
        - 经核实的年度收入加速超过 $120M ARR，且有文件证明毛利率高于 75%。
    notes: 从四个核心运营和战略维度，对投资论点与反论点进行结构化比较。
