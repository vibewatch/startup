            body: >-
              Salesforce Ventures、Adobe Ventures 和 IBM Ventures 的战略企业创投参与，提供了有价值的商业验证，但也掩盖了战略平台风险。由于这些企业母公司同时在开发自有的企业
              agent 生态，Writer 容易受到平台把关和 API 政策突然变化的影响。
