companyProfile:
  summary: >-
    Writer is a founder-led enterprise AI platform that combines proprietary Palmyra models, governance controls,
    knowledge-graph grounding, and agentic workflow tools for large enterprises. The company sells into marketing,
    revenue, and broader knowledge-work functions, with public evidence pointing to a direct enterprise sales motion,
    API usage, packaged applications, and bespoke delivery. Public traction is credible, but the economics remain
    opaque: current ARR, margin profile, burn, runway, and fully reconciled capital structure are not publicly
    disclosed.
