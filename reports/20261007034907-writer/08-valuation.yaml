callouts:
  - calloutType: "recommendation"
    title: "Track Stance Enforces Valuation Entry Discipline"
    body: "Writer's blue-chip enterprise adoption and proprietary full-stack AI capabilities represent high-quality execution in the enterprise agent market. However, underwriting an entry at a $1.9B primary valuation—or even the secondary market's discounted $1.69B Forge Price—requires accepting an unconfirmed 20x to 40x trailing revenue multiple with zero verified visibility into gross margins or cash burn. Investors should track Writer closely, establishing entry discipline around either verified ARR scaling beyond $120M or secondary pricing re-rating."
