      - number: '4.2'
        title: Traction is visible, but revenue quality is not
        blocks:
          - type: paragraph
            body: >-
              Writer's November 2024 release said hundreds of large companies used the platform and claimed customers
              achieved a nine-times average return on investment. Dexter separately reports more than 300 customers and
              $47 million of 2024 revenue. These figures should not be conflated: customer count is not paid-seat count,
              the ROI figure is company-issued, and the $47 million figure is third-party-reported revenue rather than
              ARR. The evidence set provides no revenue-recognition policy, recurring-revenue mix, net retention,
              customer concentration, bookings, remaining performance obligations, or cohort data. Consequently, public
              traction supports commercial adoption but does not establish durability, predictability, or the margin
              quality of that revenue.
            claimRefs:
              - CI005
              - CI006
