              - CO011
              - CO012
              - CO013
              - CO016
      - number: '1.2'
        title: Leadership, Governance, and Capital
        blocks:
          - type: paragraph
            body: >-
              Writer remains founder-led: Habib is chief executive and AlShikh is chief technology officer. The official
              roster also identifies functional leaders across revenue, marketing, finance, operations, people,
              security, strategy, legal, engineering, research, and product. That breadth reduces obvious functional
              vacancies, but public biographies are too thin to independently assess each executive's tenure or prior
              results. Founder-market fit is strongest in the pair's long operating history in language technology and
              enterprise content, while key-person dependence remains meaningful because the chief executive and chief
              technologist are also the founders. In the November 2024 Series C, Writer said Premji Invest's Sandesh
              Patnam and Radical Ventures' Rob Toews would join the board. Other investors span growth funds, corporate
              venture arms, and customers, but public disclosures do not establish voting control, ownership
              percentages, liquidation preferences, or the full current board composition.
