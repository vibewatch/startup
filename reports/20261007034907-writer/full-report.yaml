      - number: '4.3'
        title: Capital adequacy cannot be inferred from the last round
        blocks:
          - type: paragraph
            body: >-
              Writer announced a $200 million Series C at a $1.9 billion valuation in November 2024, with proceeds
              intended for product development, workflow expansion, and team growth. That financing demonstrates access
              to institutional capital at the time of the round, but funding raised is not cash currently available. No
              retained source reports the October 2026 cash balance, monthly net burn, debt facilities, project-finance
              obligations, working-capital needs, or a runway estimate. Aggregate funding is also unresolved: Tracxn
              reports $369 million across twelve rounds, while Dexter reports $326 million. Underwriting therefore
              requires a current balance sheet and cash-flow bridge rather than extrapolation from the historical
              financing announcement.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The model has attractive software-like elements because enterprise seats and API usage can create
              recurring and expansion revenue, but bespoke applications and a direct enterprise motion may add
              implementation labor and long sales cycles. Those effects cannot be quantified from the assigned public
              evidence. UpMarket's $2.08 billion model estimate is explicitly based on several external inputs and may
              differ from executable secondary prices; its warning that Writer shares are illiquid reinforces the
              information-asymmetry discount appropriate for a private company. The investment case remains financially
              underwritten only at the category and traction level. A decision requires audited revenue, gross margin by
              stream, retention, concentration, CAC payback, burn, cash, debt, and a downside financing plan.
            claimRefs:
              - CI001
              - CI002
              - CI008
              - CI013
              - CI014
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The financing headline is not a runway measure
            body: >-
              The $200 million Series C was announced in November 2024 and earmarked for expansion. Without current
              cash, burn, debt, and spending data, it cannot establish October 2026 liquidity or the date of the next
              financing need.
            calloutType: risk
            claimRefs:
              - CI009
              - CI010
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Workflow and Product Surface
        blocks:
          - type: paragraph
            body: >-
              Writer's current homepage positions the product as an agent platform for marketing and revenue work rather
              than as a stand-alone text editor. The described workflow begins with research and campaign briefs, moves
              through on-brand content and sales personalization, and extends to account preparation, meeting capture,
              CRM updates, and campaign optimization. The same surface names Memory, Knowledge Graph, Playbooks, Voice,
              Terms, Style Guide, Skills, Triggers, and Templates as enabling features. This is a broad workflow
              proposition, but it remains company-issued positioning: the reviewed pool does not provide task-level
              adoption, time-to-value, or production-versus-pilot evidence for these modules.
