              applications built by Writer, suggesting potential subscription, consumption, and services components.
              Public evidence does not show contract length, minimum commitments, discounting, implementation fees,
              overage mechanics, or the allocation of consideration among software and services. The human
              business-plan-writing benchmark below is only a narrow substitute-cost reference; it is not evidence of
              Writer's pricing or addressable market.
