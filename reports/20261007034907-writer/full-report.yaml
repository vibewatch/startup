      - number: '6.3'
        title: Named Customer Proof, Production Deployments, and Reference Quality
        blocks:
          - type: paragraph
            body: >-
              Writer's customer portfolio is anchored by verified reference deployments across financial services,
              consumer goods, enterprise technology, and management consulting. Key reference customers include
              Vanguard, which deployed Writer's enterprise-grade models for regulated investment communications; Intuit,
              which leverages the platform for automated financial workflows; Salesforce, which operates simultaneously
              as a strategic Series C investor and commercial customer accelerating product marketing workflows; and
              Mars, which orchestrates global brand compliance. In addition, enterprise technology leaders such as
              CloudSphere have deployed Writer's Palmyra-X language models alongside acoustic processing pipelines to
              automate customer discovery transcription and cross-reference enterprise CRM records in real time.
              Nevertheless, reference quality across the broader customer base is stratified between deeply integrated
              production deployments and departmental exploratory licenses. Public disclosures rarely provide auditable
              contract values or seat counts for individual accounts, making it critical to distinguish broad logo
              endorsements from wall-to-wall production adoption.
            claimRefs:
              - CU001
              - CU007
              - CU009
              - CU014
              - CU015
