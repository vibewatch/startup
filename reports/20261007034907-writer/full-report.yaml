  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation, Buyer Personas, and Economic Value
        blocks:
          - type: paragraph
            body: >-
              Writer segments its commercial customer footprint across high-governance Fortune 500 enterprises,
              regulated financial institutions, healthcare providers, and high-growth technology corporations. Primary
              economic buyers are Chief Marketing Officers, Chief Revenue Officers, and Heads of Enterprise Digital
              Transformation who seek to accelerate content supply chains, automate proposal generation, and coordinate
              cross-functional revenue workflows. However, procurement dynamics require mandatory technical and
              compliance approvals from Enterprise Architecture, Information Security, and central IT leadership to
              satisfy strict data governance, SOC 2 certifications, and model isolation standards. While marketing teams
              prioritize speed to value and brand voice consistency, IT leaders focus on private cloud deployments, API
              overage controls, and data residency guarantees. This dynamic creates distinct buying tiers: departmental
              teams deploying 10 to 50 seats for initial content governance, mid-market business units expanding into
              custom agent workflows, and global enterprise contracts where hundreds of seats across marketing, sales,
              and operations connect to corporate systems via Writer's Knowledge Graph.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
          - type: table
            tableRef: TU001
            claimRefs:
