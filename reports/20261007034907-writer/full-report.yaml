        title: Funding, Scale, and Milestones
        blocks:
          - type: paragraph
            body: >-
              Writer's last company-announced financing was a $200 million Series C on November 12, 2024 at a $1.9
              billion valuation. One company profile reconstructs four priced rounds totaling $326 million, while
              Everything-PR reports $369 million across 12 rounds; the difference is not reconciled in the assigned
              evidence and could reflect additional financings, classification choices, or tracker error. Scale
              indicators are even less stable. Company materials say hundreds of enterprises use Writer, DexterAgent
              reports more than 300 customers, and independent profiles display incompatible employee counts of 145,
              about 602, and 1,376. These figures should not be blended into a precise operating estimate. The product
              timeline nevertheless shows continued execution after the Series C, including AI HQ in 2025 and a May 2026
              brand-governance release. Everything-PR also flags the strategic trade-off in proprietary models:
              deployment and data-control benefits come with a lower general-benchmark capability ceiling than frontier
              general-purpose models.
