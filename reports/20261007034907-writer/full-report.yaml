  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is narrower than all generative-AI spend. Writer positions the product as an
              enterprise agent platform spanning marketing and revenue workflows, with knowledge, governance,
              connectors, and workflow execution inside the product boundary. The associated spend can include seats,
              platform access, API consumption, integration, customization, support, and change-management work. Human
              technical writers, proposal specialists, white-paper agencies, generic productivity tools, and raw model
              APIs are substitutes or adjacencies rather than automatically addressable Writer revenue. This distinction
              matters because labor and service benchmarks show what buyers already pay to complete portions of the job,
              but they cannot be added to software contract values as if they were one non-overlapping TAM.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM009
              - CM014
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM009
              - CM012
              - CM014
              - CM015
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The assigned source set contains no independently documented market-wide revenue pool, penetration rate,
              or buyer count from which to derive TAM, SAM, and SOM. Vendr instead provides a useful purchase-size lens:
              it describes annual contract values of $10,000-$50,000 for small teams, $75,000-$250,000 for mid-market
              deployments, and $500,000 or more for large enterprises, with some deals reaching $1 million or more.
              Those bands are not additive and do not reveal sample size, customer mix, geography, or a Writer-specific
              win rate. They therefore indicate contract scale and valuation sensitivity, not a market total. The
              roughly 100-fold difference between cited low and high endpoints also makes customer mix a critical
              missing variable.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM016
