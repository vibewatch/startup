      - number: '7.3'
        title: Platform Dependencies, Ecosystem Counterparties, and Channel Concentration
        blocks:
          - type: paragraph
            body: >-
              Writer's platform architecture depends heavily upon deep integrations with external enterprise software
              suites, hyperscaler cloud infrastructure, and strategic ecosystem partners. The company's agentic
              workflows connect directly into third-party enterprise tools including Salesforce, Adobe, Snowflake,
              Google Workspace, and Microsoft Teams. While strategic corporate venture investors including Salesforce
              Ventures, Adobe Ventures, IBM Ventures, and Citi Ventures validate Writer's commercial footprint, these
              same platform counterparties operate competing internal generative AI capabilities and maintain platform
              gatekeeping power. Any technical deprecation of partner APIs, unilateral changes to data connector
              permissions, or preferential bundling of native AI copilots by hyperscalers poses immediate operational
              friction for Writer's multi-system agent workflows.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
