chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Writer was launched in 2020 by May Habib and Waseem AlShikh after the pair had worked together on
              enterprise localization since 2013. The company lists its headquarters at 111 Maiden Lane in San Francisco
              and additional offices in New York, London, Chicago, and Austin. Its present positioning is an enterprise
              AI agent platform: company-issued materials emphasize agents, proprietary Palmyra language models,
              company-data grounding, governance controls, and integrations with enterprise systems. An independent
              company profile likewise describes a full-stack platform for building, activating, and supervising AI
              applications, workflows, and agents. A third-party profile reports a per-user seat model plus usage-based
              API pricing, but the reviewed evidence does not disclose current contract sizes, seat mix, consumption
              mix, or recognized revenue. The product identity is therefore well supported, while the economics of the
              commercial model remain a diligence item.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
