  evidenceGaps:
    - type: "missing-source"
      severity: "material"
      topic: "TAM SAM SOM"
      missingEvidence: >-
        An independent estimate of relevant enterprise AI-agent spend with geography,
        category boundaries, buyer counts, methodology, and growth rate.
      whyItMatters: >-
        Contract values alone cannot establish total market size, Writer's serviceable
        segment, or an attainable share for valuation.
      diligencePath: >-
        Obtain current analyst market datasets and triangulate them with enterprise counts,
        eligible functions, production adoption, and like-for-like annual contract values.
      relatedQuestionRefs: [QM009]
      relatedTableRefs: [TM002]
    - type: "private-evidence-only"
      severity: "material"
      topic: "production adoption"
      missingEvidence: >-
        Writer cohort data for pilots, activated seats, API use, production conversion,
        expansion, renewal, churn, sales-cycle duration, and budget ownership.
      whyItMatters: >-
        Adoption timing and attainable share depend on movement from initial purchase to
        repeatable production expansion rather than broad workflow applicability.
      diligencePath: >-
        Review anonymized customer cohorts, contract schedules, usage telemetry, renewal
        records, and buyer interviews segmented by deployment size and vertical.
      relatedQuestionRefs: [QM010]
      relatedTableRefs: [TM003]
    - type: "missing-source"
      severity: "material"
      topic: "customer ROI"
      missingEvidence: >-
        Independent validation of the population, period, baseline, distribution, and cost
        assumptions behind Writer's reported average 9x return on investment.
      whyItMatters: >-
        A company-issued average cannot establish repeatable customer economics or justify a
        premium valuation without denominator and cohort detail.
      diligencePath: >-
        Request the underlying ROI study and validate a representative sample against customer
        finance records, implementation costs, adoption levels, and realized savings.
      relatedQuestionRefs: [QM007]
