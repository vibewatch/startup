      - "Included spend"
      - "Excluded or substitute spend"
      - "Buyer or payer"
      - "Relevance to Writer"
    rows:
      - ["Enterprise AI-agent platform", "Seats, platform access, API consumption, governance, integrations", "Raw model API spend purchased outside Writer", "Marketing, revenue, and IT leaders", "Core market"]
      - ["Marketing and revenue workflow automation", "Applications and agents deployed through Writer", "Point tools and manual coordination not migrated to Writer", "CMO, revenue operations, functional leaders", "Core workflow wedge"]
      - ["Proposal and RFP response", "AI software, knowledge reuse, and workflow tooling", "In-house proposal labor and competing RFP software", "Proposal leader, sales enablement, procurement", "Adjacent use case"]
      - ["Long-form commercial content", "Writer seats or agents used to produce governed content", "Standalone white-paper agencies and freelancers", "Marketing and content leaders", "Substitute benchmark, not additive TAM"]
      - ["Technical documentation labor", "Writer usage only where the platform replaces or augments the workflow", "Internal technical-writer compensation", "Product, engineering, and documentation leaders", "Status-quo benchmark"]
      - ["Regulated-enterprise deployment", "Security, support, customization, and deployment premiums paid to Writer", "Internal compliance work and third-party infrastructure outside the contract", "IT, security, compliance, and business-unit leaders", "Higher-value deployment lens"]
    notes: >-
      Boundary synthesized from Writer positioning, Vendr pricing components, and observed
      labor/service substitutes; excluded spend is not counted as Writer-addressable revenue.
    claimRefs: [CM001, CM002, CM003, CM008, CM009, CM012, CM014, CM015]
  - id: "TM002"
    title: "Sizing and purchase-cost lenses"
    columns:
      - "Publisher"
      - "Period"
      - "Geography"
      - "Value"
      - "CAGR"
      - "Methodology"
      - "Confidence"
      - "Limitation"
    rows:
      - ["Vendr", "2026", "Not disclosed", "$10K-$50K annual contract value for small teams", null, "Anonymized Writer transactions; 10-50 users with basic usage", "Medium", "Sample size, percentiles, and included services are not disclosed"]
      - ["Vendr", "2026", "Not disclosed", "$75K-$250K annual contract value for mid-market deployments", null, "Anonymized Writer transactions; 100-500 users with moderate API use and customization", "Medium", "Not a market total; customer and contract mix are undisclosed"]
      - ["Vendr", "2026", "Not disclosed", "$500K+ annual contract value for large deployments; some reach $1M+", null, "Anonymized Writer transactions; 500+ users or extensive customization", "Medium", "Upper tail is open-ended and may include professional services"]
      - ["Vendr", "2026", "Not disclosed", "$18-$25 per user per month for Team tier when billed annually", null, "Published list-pricing summary", "Medium", "Entry tier is not comparable with custom enterprise scope"]
      - ["Startup Jobs", "October 2026 page", "Not disclosed", "$109,106 median annual salary for a technical writer", null, "Role page states a median based on 674 jobs", "Medium", "Labor benchmark is not software spend and geography mix is absent"]
      - ["W Marketing", "Accessed 2026-10-07", "UK pricing in GBP", "GBP 4,000 starter white-paper service", null, "Supplier's published package price", "Low", "One project service is not recurring platform spend or a market estimate"]
    notes: >-
      Values preserve each publisher's unit and scope; no CAGR was available, currencies are
      not converted, and transaction, salary, and project-service figures must not be summed.
    claimRefs: [CM003, CM004, CM005, CM006, CM007, CM008, CM009]
  - id: "TM003"
    title: "Segment and buyer map"
    columns:
      - "Segment"
      - "Buyer"
      - "User"
      - "Payer"
      - "Workflow"
      - "Budget owner"
      - "Adoption trigger"
    rows:
      - ["Marketing", "Chief marketing officer", "Marketers and content teams", "Enterprise", "Research, campaign, and governed content production", "Marketing", "Need to scale approved, on-brand output"]
      - ["Revenue", "Revenue or sales leader", "Sellers and revenue teams", "Enterprise", "Account preparation, personalization, meetings, and proposals", "Revenue operations or sales", "Need to reduce manual preparation and coordination"]
      - ["IT and AI platform", "IT leader", "Developers, administrators, and functional teams", "Enterprise", "Integrations, access controls, model and agent supervision", "IT or AI-transformation office", "Governance and integration approval"]
      - ["Proposal operations", "Proposal or sales-enablement leader", "RFP writers and subject-matter experts", "Enterprise", "Intake, drafting, review, compliance, and knowledge reuse", "Sales enablement or revenue operations", "Content sprawl and SME bottlenecks"]
      - ["Regulated business units", "Functional and technology leaders", "Healthcare, retail, and financial-services teams", "Enterprise", "Mission-critical industry workflows", "Business unit with IT and compliance", "Requirement for secure, reliable, adaptable automation"]
    notes: >-
      Buyer and workflow roles combine current Writer positioning with Dexter's buyer-persona
      listing and AutoRFP's cross-functional process description; actual Writer budget splits
      and procurement paths remain undisclosed.
    claimRefs: [CM001, CM002, CM011, CM012, CM014]
figures:
