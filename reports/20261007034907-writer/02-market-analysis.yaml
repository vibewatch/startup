    title: "Observed annual contract benchmark endpoints, not TAM"
    type: "pyramid"
    summary: >-
      Vendr's cited annual contract endpoints span from $10,000 to $1 million or more, showing
      deployment-scope sensitivity rather than a market-wide opportunity.
    data:
      nodes:
        - label: "Some large deployments"
          value: 1000000
          unit: "USD annual contract value or more"
          detail: "Open-ended upper observation; scope may include extensive customization."
        - label: "Large-deployment floor"
          value: 500000
          unit: "USD annual contract value"
          detail: "Cited starting point for large-scale deployments."
        - label: "Mid-market upper endpoint"
          value: 250000
          unit: "USD annual contract value"
          detail: "Upper endpoint for cited 100-500 user deployments."
        - label: "Mid-market lower endpoint"
          value: 75000
          unit: "USD annual contract value"
          detail: "Lower endpoint for cited 100-500 user deployments."
        - label: "Small-team upper endpoint"
          value: 50000
          unit: "USD annual contract value"
          detail: "Upper endpoint for cited 10-50 user deployments."
        - label: "Small-team lower endpoint"
          value: 10000
          unit: "USD annual contract value"
          detail: "Lower endpoint for cited 10-50 user deployments."
    approximationNotes: >-
      Endpoint values are transcribed from Vendr's bands, are not summed, and do not represent
      nested TAM/SAM/SOM layers; $1M+ is plotted at $1M solely as the stated lower bound.
    claimRefs: [CM005, CM006, CM007, CM016]
