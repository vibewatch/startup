    title: Customer segmentation table
    columns: [Segment, Buyer/user/payer, Use case, Scale or strategic value, Evidence gap]
    rows:
      - [Buyers, "Consumers and collectors", "Acquire scarce or high-demand goods with market pricing and authentication", "Demand-side liquidity and trust-sensitive purchases", "No current active-buyer or repeat-purchase denominator"]
      - [Sellers, "Owners, dealers, and resellers", "List goods, match bids and asks, and receive payout after verification", "Supply-side inventory and category breadth", "No current seller count, sell-through, or concentration disclosure"]
      - [Commercial data partners, "External exchanges and platforms", "Use aggregated and anonymized StockX market data for product-linked contracts", "Extends price-discovery utility beyond the core marketplace", "No disclosed contract value, renewal, or partner revenue"]
      - [High-value or disputed buyers, "Named purchasers and investigators", "Test authenticity, condition, and buyer remedies", "Stress-tests the trust promise and refund process", "Adverse cases are not representative retention evidence"]
    notes: "Sources describe marketplace roles and one data partnership; no source provides a current denominator for active buyers, sellers, or partner revenue."
    claimRefs: [CU001, CU002, CU003, CU009]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns: [Metric, Value, Date, Source, Confidence, Implication, Missing denominator]
    rows:
      - ["Marketplace launch", "Launched in 2016", "2016", "Kalshi announcement", "medium", "Long enough operating history to support a scaled-marketplace hypothesis", "No annual active-account series"]
      - ["Workforce / operating footprint", "1,000 employees across offices and verification centers", "2025-11-19 announcement", "Kalshi announcement", "medium", "Indicates material operational infrastructure for authentication", "No productivity, throughput, or customer-service denominator"]
      - ["Partner price windows", "Average resale price measured 7 or 30 days after release", "2025-11-19 announcement", "Kalshi announcement", "medium", "Shows market data can support externally defined product outcomes", "No partner volume, fee, or renewal data"]
      - ["Processing friction", "Authentication can add a week or more during high-demand drops", "Undated guide accessed 2026-10-22", "Cove guide", "low", "Peak demand can trade off against delivery speed and satisfaction", "No service-level or cohort-impact data"]
    notes: "Values retain their source periods; null denominators mean the assigned public evidence does not establish current adoption, retention, or operational conversion."
    claimRefs: [CU005, CU006, CU007, CU008]
  - id: TU003
    title: Named customer proof table
    enumerationScope:
      coverage: partial
      basis: "Publicly documented named relationships and cases found in the assigned 2026 refresh pool; not a complete customer or partner census."
    columns: [Customer or counterparty, Segment, Deployment/use case, Production vs pilot, Outcome, Limitation]
    rows:
      - [Kalshi, "Commercial data partner", "Aggregated, anonymized StockX market data informs product event contracts", "Announced live contracts", "External use of StockX price and brand data", "No disclosed economics, volume, or renewal"]
      - [Nike, "Brand counterparty / investigator", "Purchased or investigated sneakers in the authentication dispute", "Litigation evidence, not customer deployment", "Court found StockX liable for distributing 37 counterfeit pairs", "Adverse counterparty evidence; not proof of normal customer experience"]
      - [Roy Kim, "Named high-value buyer", "Bought 62 high-demand Jordan 1 pairs and tested authenticity", "Completed purchases", "38 pairs were reported to have failed third-party checks; refund and gift card were provided", "Single adverse case cannot establish population-level failure rate"]
    notes: "This is a partial public enumeration of named proof and counterparty evidence, not a customer logo list; production status is explicit where the source supports it."
    claimRefs: [CU009, CU010, CU011, CU012]
figures:
  - id: FU001
    title: Customer journey from market discovery to expansion
    summary: StockX's customer path combines price discovery, authenticated fulfillment, and optional data-partner expansion, with trust and service friction at the verification step.
    type: journey-map
    data:
      items:
        - label: Discover
          touchpoints: ["Browse scarce products, historical prices, and market trends"]
        - label: Match
          touchpoints: ["Buyer bid meets seller ask or buyer purchases at the listed ask"]
        - label: Verify
          touchpoints: ["Seller ships to a StockX authentication center for inspection"]
        - label: Receive
          touchpoints: ["Passed item is forwarded to buyer; seller payout follows authentication"]
        - label: Repeat
          touchpoints: ["Use price history and category breadth for another transaction"]
        - label: Expand
          touchpoints: ["Aggregated, anonymized market data supports partner products such as event contracts"]
    claimRefs: [CU001, CU005, CU006, CU007]
callouts:
  - calloutType: strength
    title: Trust is the product surface
    body: StockX's differentiated customer workflow is not merely listing inventory; it inserts centralized authentication and fulfillment between seller and buyer, making verification a visible part of the transaction promise.
    claimRefs: [CU001, CU005]
  - calloutType: risk
    title: Retention and concentration remain unmeasured
    body: Public sources establish marketplace activity and named relationships but do not establish current active customers, repeat purchase, cohort retention, seller concentration, category contribution, or partner economics.
    claimRefs: [CU008, CU012]
