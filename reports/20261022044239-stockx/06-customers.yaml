slug: stockx
runDate: 2026-10-22
company:
  name: StockX
chapter:
  number: 6
  title: Customers
  summary: StockX serves buyers and sellers of high-demand consumer goods through a bid/ask marketplace whose central customer promise is authenticated fulfillment. The public record supports broad category reach, partner use of its market data, and named buyer experiences, but it does not disclose a reliable current cohort, retention, or concentration denominator.
sections:
  - id: customer-segments
    title: Buyer, seller, and partner segments
    body: >-
      StockX operates a two-sided marketplace rather than a conventional recurring-software
      customer base. Buyers seek scarce, high-demand goods and price discovery; sellers seek
      liquidity, access to global demand, and a controlled authentication-and-payout workflow.
      The platform's public descriptions cover sneakers, apparel, accessories, electronics,
      collectibles, and trading cards, while its bid/ask mechanics serve both sides of the
      transaction. A separate partner segment can consume aggregated market intelligence:
      Kalshi announced that it would use aggregated, anonymized StockX data to create event
      contracts tied to product prices and brand performance. This is evidence of data value
      and an external distribution surface, not evidence of recurring customer revenue or
      retention.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption, transaction trust, and durability
    body: >-
      The strongest public adoption evidence is operational rather than cohort-based. StockX
      routes sold items from sellers to authentication centers before forwarding them to
      buyers, and its marketplace displays bids, asks, transaction history, and volume. A
      2025 partner announcement describes contracts based on average resale prices seven or
      thirty days after releases, showing that the market produces sufficiently legible
      price signals for an adjacent regulated exchange. The customer experience still has
      measurable friction: an independent consumer guide reports that authentication can add
      a week or more during high-demand drops and that customer service can be slow in
      disputes. No public source in this pool supplies current repeat-purchase, renewal,
      cohort, or net-retention data.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
  - id: named-proof-and-risks
    title: Named proof, expansion, and concentration limits
    body: >-
      Named proof is mixed in quality and should not be collapsed into a customer-count
      claim. Kalshi is a named commercial partner using anonymized StockX data, while Nike
      is a counterparty and investigator in litigation rather than a customer reference.
      The public record also identifies a large buyer case involving Roy Kim, but that case
      is adverse evidence about authentication controls, not durable adoption. StockX has
      expanded beyond sneakers into apparel, electronics, collectibles, and trading cards,
      yet the assigned sources do not disclose category-level revenue, seller concentration,
      repeat-purchase rates, active accounts, or channel mix. These missing denominators
      limit confidence in expansion and durability claims even though the marketplace model
      and partner surface are externally observable.
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
    figureRefs: [FU001]
tables:
