chapter:
  number: 4
  title: Financials
  summary: StockX has a transaction-fee marketplace model with authentication and logistics costs, but public evidence does not establish current revenue quality, contribution margin, cash, burn, or runway. Historical funding and valuation are documented, while the underwriting conclusion remains research-more because private-company financial statements and operating cohorts are unavailable.
sections:
  - id: monetization-and-revenue-quality
    title: Monetization and revenue quality
    body: >-
      StockX monetizes completed transactions rather than selling owned inventory. The strongest current public description is a bid/ask marketplace in which StockX intermediates the transaction, authenticates the item, and ships it to the buyer. One market-data profile reports that buyers and sellers transact through a bid/ask marketplace and that products are authenticated before delivery; a separate business-model description says the seller fee starts around 9% and that buyers pay payment-processing and market-adjustment fees. Those are fee-model descriptions, not audited net revenue or realized take rate. The marketplace can generate repeatable transaction revenue when liquidity and category demand persist, but the authentication and fulfillment steps also create variable service-delivery cost. Public sources describe historical price and volume data and expansion into electronics, collectibles, watches, and handbags, yet they do not disclose category-level revenue mix, refunds, fraud reserves, or contribution margin. Accordingly, the financial quality case is plausible but not underwritable from the assigned public evidence.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: operating-leverage-and-capital-needs
    title: Operating leverage and capital needs
    body: >-
      StockX appears capital-light in inventory ownership but operationally intensive in authentication, facilities, customer support, shipping, and trust-and-safety. A funding profile describes the company as private and reports about $690 million raised, while another funding tracker reports a $275 million Series E in December 2020 at a $2.8 billion post-money valuation and says lifetime GMV had surpassed $3 billion by Q3 2020. These figures are not interchangeable: funding is capital raised, GMV is transaction volume, and neither is revenue or cash available. A separate source reports a $3.8 billion April 2021 valuation and a 1,493-employee March 2026 estimate, but labels its research AI-generated and not independently verified. The available evidence therefore supports a history of substantial financing and operational scale, not current runway or profitability. No assigned source provides cash on hand, debt, working-capital obligations, cap-table preferences, burn, or a next-round trigger.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: underwriting-verdict-and-diligence-blockers
    title: Underwriting verdict and diligence blockers
    body: >-
      The core underwriting risk is measurement opacity. StockX's business depends on trusted authentication and market liquidity, but legal coverage reports that a court found the company liable for selling 37 counterfeit Nike pairs in March 2025; separate coverage says the parties settled on confidential terms and dismissed the case with prejudice in August 2025. A buyer-focused review says fakes have slipped through authentication and describes fees around 8–10% for buyers and around 9% for sellers, while a low-reputation legal-marketing article reports seller complaints about fee changes and payout delays. These are adverse signals, not audited estimates of loss. Trust failures can increase refunds, reinspection, support, insurance, and reserve costs; the public record does not quantify those effects. The financial verdict is therefore research-more: the model has identifiable transaction revenue and financing history, but current revenue, gross margin, loss rates, cash runway, and cohort economics remain open diligence items. Any valuation analysis should scenario-test take rate, authentication cost per order, fraud/refund reserve, repeat purchase, seller concentration, and category mix instead of treating reported funding or prior valuation as current value.
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI014]
    tableRefs: []
    figureRefs: []
tables:
  - id: TI001
    title: Revenue streams and quality
    columns: [Stream, Mechanism, Unit, Current value/status, Quality, Diligence ask]
    rows:
      - [Marketplace transaction fees, "Fee charged on completed bid/ask sales", "Per completed transaction", "Seller fee described as starting around 9%; buyer fees also described", "Public fee description; not realized net revenue", "Obtain realized take rate and net revenue by category and geography"]
      - [Buyer service and market-adjustment fees, "Buyer-side charges around transaction and payment processing", "Per buyer order", "Described publicly; exact schedule and realized mix unavailable", "List/description only", "Reconcile fee schedule to revenue recognition and refunds"]
      - [Authentication and logistics service, "Physical receipt, verification, and shipment", "Per item/order", "Operational step described; cost per order unavailable", "Mechanism observed, economics unknown", "Obtain labor, facility, shipping, reinspection, and failed-authentication cost"]
      - [Portfolio and market-data engagement, "Historical price/volume data and portfolio tracking", "Per account or feature", "Feature described; monetization not disclosed", "Product signal, no revenue evidence", "Confirm whether any subscription, advertising, or data revenue exists"]
    notes: "Public descriptions identify mechanisms and fee indications; they do not establish GAAP revenue, realized pricing, revenue mix, or margin. Null or unavailable values require company financial statements."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Price or contract item, List versus realized, Source-backed value/status, Discount or unknown, Implication]
    rows:
      - [Seller transaction fee, "Indicative/list description", "Starts around 9% in a business-model profile; review says around 9%", "Tiering and realized fee after incentives unknown", "Take-rate sensitivity is central to revenue quality"]
      - [Buyer service fee, "Indicative/list description", "Around 8–10% in a buyer review", "Exact category, geography, and order-level realization unknown", "Gross fee does not equal net revenue or contribution margin"]
      - [Shipping and processing, "Pass-through or mixed economics unclear", "Buyer review says buyers also pay shipping; accounting treatment unavailable", "Subsidies, refunds, and chargebacks unknown", "May materially affect net revenue and working capital"]
      - [Enterprise or data monetization, "Unknown", "No assigned source documents a paid enterprise/data contract", "No public contract terms", "Treat as an evidence gap rather than a revenue stream"]
    notes: "Fee percentages are public descriptions from third-party sources, not audited realized pricing. The table intentionally separates list or indicative charges from revenue recognition."
    claimRefs: [CI002, CI010]
  - id: TI003
    title: Unit economics and underwriting inputs
    columns: [Metric, Value/null, Confidence, Why it matters, Diligence ask]
    rows:
      - [Gross merchandise value, "$3B+ lifetime by Q3 2020", "Medium; third-party profile attributes it to a company release", "Shows historical transaction scale but is not revenue", "Obtain current annual GMV and category mix"]
      - [Net revenue, null, "Unavailable", "Determines valuation multiple and operating leverage", "Provide monthly and annual revenue bridge by stream"]
      - [Realized take rate, null, "Unavailable", "Converts GMV into platform revenue", "Reconcile list fees, discounts, refunds, and payment costs"]
      - [Gross margin, null, "Unavailable", "Tests whether authentication/logistics scale economically", "Provide audited gross margin and cost-of-revenue detail"]
      - [Fraud/refund reserve, null, "Unavailable", "Trust failures can create variable losses and liabilities", "Provide counterfeit, dispute, refund, chargeback, and reserve history"]
      - ["Cash, burn, and runway", null, "Unavailable", "Determines financing dependency", "Provide latest balance sheet, monthly burn, debt, covenants, and runway case"]
    notes: "Values marked null are not estimates; they are specific requests for private-company evidence. GMV and funding must not be substituted for revenue or cash."
    claimRefs: [CI005, CI006, CI009, CI011, CI012]
figures:
  - id: FI001
    title: Marketplace revenue model bridge
    type: flow
    summary: Customer bids and seller asks create a transaction, after which StockX collects marketplace fees while incurring authentication and fulfillment costs.
    data:
      nodes:
        - id: demand
          label: "Buyer bid / market demand"
          detail: "Buyer places a bid at a market price."
        - id: supply
          label: "Seller ask / supply"
          detail: "Seller lists an asking price."
        - id: match
          label: "Matched transaction"
          detail: "A bid and ask match; the transaction executes."
        - id: fees
          label: "Marketplace fees"
          detail: "Seller and buyer-side fee descriptions exist; realized net revenue is not public."
        - id: trust
          label: "Authentication and logistics"
          detail: "Item is received, checked, and shipped; cost per order is unavailable."
        - id: gross-profit
          label: "Gross profit / loss"
          detail: "Depends on realized fees less authentication, shipping, support, fraud, and refund costs."
      edges:
        - from: demand
          to: match
        - from: supply
          to: match
        - from: match
          to: fees
        - from: match
          to: trust
        - from: fees
          to: gross-profit
        - from: trust
          to: gross-profit
    approximationNotes: "Conceptual bridge only; no unsupported conversion rate, dollar value, or margin is inferred."
    claimRefs: [CI001, CI002, CI003, CI004]
callouts:
  - calloutType: insight
    title: Revenue mechanism is identifiable, economics are not
    body: "StockX has a legible transaction-fee mechanism, but public evidence does not disclose realized take rate, cost per authenticated order, or contribution margin."
    claimRefs: [CI001, CI002, CI003]
  - calloutType: risk
    title: Trust costs are a financial variable
    body: "The Nike litigation record and documented counterfeit concerns make fraud, refunds, reserves, and verification costs material diligence items rather than qualitative footnotes."
    claimRefs: [CI009, CI011]
  - calloutType: recommendation
    title: Underwrite with scenarios, not historical funding
    body: "Use current financial statements and cohort-level data to test take rate, repeat purchase, category mix, trust losses, and runway; do not treat funding or prior valuation as current cash or value."
    claimRefs: [CI005, CI006, CI012]
