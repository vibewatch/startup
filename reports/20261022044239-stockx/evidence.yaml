evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Audited 2025-2026 income statements, cash-flow statements, balance-sheet cash, debt, and margin data.
    whyItMatters: >-
      Historical financing-era revenue and GMV do not establish current revenue quality, profitability, liquidity, or
      cash burn.
    diligencePath: Request audited financial statements, management accounts, KPI definitions, and a bridge from GMV to net revenue.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current cap table, liquidation preferences, investor rights, board roster, and executive roster.
    whyItMatters: Ownership, control, and key-person dependence cannot be assessed from historical funding summaries.
    diligencePath: >-
      Request the latest capitalization table, charter or preferred terms, board materials, and current leadership
      biographies.
    relatedQuestionRefs:
      - QO003
      - QO006
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: A reconciled definition and date for funding, employees, customers, buyers, sellers, and active users.
    whyItMatters: >-
      Provider estimates range from $495M to $690M funding and from 655 legal-entity employees to approximately 1.5K
      directory employees.
    diligencePath: Obtain management KPI definitions and reconcile provider records to legal-entity and consolidated-company scope.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: legal
    missingEvidence: Primary court docket, settlement filing, and current litigation or regulatory disclosure.
    whyItMatters: >-
      Secondary legal summaries establish a material event but do not fully establish continuing obligations or
      operational remediation.
    diligencePath: >-
      Review the docket, settlement stipulation, insurance disclosures, and current legal reserve or compliance
      materials.
    relatedQuestionRefs:
      - QO007
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Current StockX GMV and revenue by category and geography, take rate, eligible supply, active buyer and seller
      cohorts, and attainable share.
    whyItMatters: >-
      These inputs are required to convert a broad and disputed category estimate into a defensible StockX SAM, SOM, and
      valuation growth case.
    diligencePath: >-
      Obtain management data-room extracts and reconcile them to payment-processor, marketplace-ledger, and audited
      financial records.
    relatedQuestionRefs:
      - QM003
      - QM010
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      An independent category estimate with a stable definition, transparent historical series, and reconciled base and
      forecast values.
    whyItMatters: >-
      The assigned quantitative market page contains conflicting headline values, which prevents reliable use of its
      CAGR or endpoints in valuation.
    diligencePath: >-
      Commission or obtain two independent market datasets and reconcile definitions, transaction-value versus revenue
      denominators, geographies, and forecast periods.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-segmentation
    missingEvidence: >-
      StockX-specific cohort shares, repeat purchase, seller concentration, acquisition costs, authentication failure
      rates, dispute rates, and category contribution margin.
    whyItMatters: >-
      Public segment labels do not establish who drives durable liquidity or whether adoption remains economic after
      trust and fulfillment costs.
    diligencePath: >-
      Review cohort and category dashboards, seller concentration schedules, dispute and refund logs, and
      contribution-margin bridges with finance and marketplace operations.
    relatedQuestionRefs:
      - QM004
      - QM005
      - QM009
    relatedTableRefs:
      - TM003
