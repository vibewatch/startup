  - id: FI001
    title: Marketplace revenue model bridge
    type: flow
    summary: >-
      Customer bids and seller asks create a transaction, after which StockX collects marketplace fees while incurring
      authentication and fulfillment costs.
    data:
      nodes:
        - id: demand
          label: Buyer bid / market demand
          detail: Buyer places a bid at a market price.
        - id: supply
          label: Seller ask / supply
          detail: Seller lists an asking price.
        - id: match
          label: Matched transaction
          detail: A bid and ask match; the transaction executes.
        - id: fees
          label: Marketplace fees
          detail: Seller and buyer-side fee descriptions exist; realized net revenue is not public.
        - id: trust
          label: Authentication and logistics
          detail: Item is received, checked, and shipped; cost per order is unavailable.
        - id: gross-profit
          label: Gross profit / loss
          detail: Depends on realized fees less authentication, shipping, support, fraud, and refund costs.
      edges:
        - from: demand
          to: match
        - from: supply
          to: match
        - from: match
          to: fees
        - from: match
          to: trust
        - from: fees
          to: gross-profit
        - from: trust
          to: gross-profit
    approximationNotes: Conceptual bridge only; no unsupported conversion rate, dollar value, or margin is inferred.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
  - id: FE001
    title: StockX product and operating architecture
    type: stack
    summary: >-
      StockX layers market discovery, transaction handling, physical verification, and delivery into one authenticated
      resale workflow.
    data:
      layers:
        - label: Market discovery
          detail: The customer-facing layer exposes bids, asks, and recent sale information.
          items:
            - label: Bid/ask interface
              detail: Buyers submit bids and sellers submit asks; a trade executes when they match.
            - label: Price history
              detail: Published completed-sale data helps participants evaluate a listed item.
        - label: Transaction orchestration
          detail: The transaction layer coordinates matching, payment, and the buyer-seller handoff.
          items:
            - label: Payment and fees
              detail: Transaction and processing fees are part of the marketplace workflow.
            - label: Seller/buyer handoff
              detail: The platform coordinates the matched transaction before physical delivery.
        - label: Trust operations
          detail: The physical-control layer receives inventory and applies category-specific verification.
          items:
            - label: Authentication centers
              detail: Sellers send items for physical inspection before shipment to buyers.
            - label: Category QA
              detail: Verification depends on trained staff and category-specific criteria.
        - label: Fulfillment and remedies
          detail: The service layer moves verified goods to buyers and handles exceptions and remedies.
          items:
            - label: Shipping
              detail: Verified products move from the facility to the buyer.
            - label: Refund or exception handling
              detail: Public accounts describe buyer remedies when products fail or are misrepresented.
        - label: Security and privacy
          detail: Account and transaction protection is material to the marketplace, but current assurance is not public.
          items:
            - label: Account controls
              detail: Current identity, credential, and monitoring controls are not documented in the assigned pool.
        - label: Developer and integration surface
          detail: No assigned source documents a public API, engineering release stream, or practitioner adoption signal.
          items:
            - label: Public developer evidence
              detail: Architecture, integration, and reliability evidence remain diligence requests.
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE013
  - id: FU001
    title: Customer journey from market discovery to expansion
    summary: >-
      StockX's customer path combines price discovery, authenticated fulfillment, and optional data-partner expansion,
      with trust and service friction at the verification step.
    type: journey-map
    data:
      items:
        - label: Discover
          touchpoints:
            - Browse scarce products, historical prices, and market trends
        - label: Match
          touchpoints:
            - Buyer bid meets seller ask or buyer purchases at the listed ask
        - label: Verify
          touchpoints:
            - Seller ships to a StockX authentication center for inspection
        - label: Receive
          touchpoints:
            - Passed item is forwarded to buyer; seller payout follows authentication
        - label: Repeat
          touchpoints:
            - Use price history and category breadth for another transaction
        - label: Expand
          touchpoints:
            - Aggregated, anonymized market data supports partner products such as event contracts
    claimRefs:
      - CU001
      - CU005
      - CU006
      - CU007
