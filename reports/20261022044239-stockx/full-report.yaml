        title: Identity, product, and operating model
        blocks:
          - type: paragraph
            body: >-
              StockX is described across the retained sources as a Detroit-based, privately held marketplace for
              high-demand consumer goods. Its core mechanism is a bid/ask market in which buyers place bids and sellers
              list asks, followed by inspection at a StockX facility before delivery. The catalog has expanded beyond
              sneakers into apparel, streetwear, electronics, collectibles, and trading cards. This is a marketplace and
              authentication model rather than a subscription software model: the available source describes commission
              revenue, while the exact take rate and category-level margin are not disclosed. The company’s identity is
              therefore clear, but current operating scale should not be inferred from older financing-era metrics.
