      - number: '2.3'
        title: Buyer, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The transaction has two economic decision makers. Collectors and end buyers fund discretionary purchases
              and accept service fees, shipping, and waiting time in exchange for liquidity, price history, and
              authentication. Resellers supply inventory and pay transaction and processing fees out of proceeds; their
              adoption depends on the expected resale spread remaining attractive after fees, shipping,
              failed-verification risk, and settlement time. A market report separately describes individual collectors,
              retail speculators, and institutional investors as end-user segments, but the assigned evidence does not
              establish their shares in StockX's current activity. The practical adoption path is therefore product
              discovery, bid/ask matching, seller shipment to verification, authentication, and delivery or payout.
              Cohort mix, repeat behavior, seller concentration, and category-level contribution economics remain
              private-evidence diligence items.
            claimRefs:
              - CM008
              - CM009
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM014
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is supported by scarce releases, social-media-driven culture, transparent pricing, and cross-border
              access. These forces can increase liquidity and attract participants who view products as collectibles or
              tradable assets. The same market structure creates cyclicality: hype can reverse, discretionary spending
              can weaken, and brand anti-bot, raffle, loyalty, or direct-channel strategies can reduce resale supply and
              margins. Trust is the critical constraint because authentication is part of the paid value proposition.
              Two legal summaries report that a federal court found StockX liable for distributing 37 counterfeit Nike
              pairs before the parties reached a confidential 2025 settlement; the remaining claims were not tried, and
              no undisclosed operational remedy should be assumed. Valuation should therefore depend on verified current
              GMV, take rate, repeat cohorts, dispute and fraud losses, and contribution margin rather than a broad
              forecast CAGR.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Headline TAM is not decision-grade
            body: >-
              The only assigned quantitative market page contains conflicting headline values and does not isolate
              StockX's categories, geographies, or attainable share.
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM016
          - type: callout
            title: Build the valuation case from operating cohorts
            body: >-
              Request current GMV by category and geography, take rate, repeat cohorts, seller concentration, fraud and
              refund losses, and contribution margin before applying a market-growth multiple.
            calloutType: recommendation
            claimRefs:
              - CM007
              - CM009
              - CM011
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The competitive set is broader than sneaker marketplaces. StockX's closest direct alternatives are
              authenticated resale platforms such as GOAT and specialty luxury resale services; generalist marketplaces
              such as eBay compete on breadth, seller reach, and convenience; and category specialists such as Grailed
              compete where community identity and apparel expertise matter. The source record describes StockX as a
              two-sided marketplace with bids and asks, standardized listings, authentication, and centralized
              logistics, while a separate review describes the same model as a stock-market-style exchange. These
              mechanics make StockX useful when a buyer values a transparent reference price and a seller values a
              liquid route to demand, but they do not eliminate substitutes. A buyer can purchase at retail, use a local
              consignment store, trade directly within a community, or keep an existing item rather than pay resale
              fees. An internal-build alternative is also plausible for brands that want authenticated resale, customer
              data, and inventory control inside their own commerce stack.

              Category expansion increases the addressable competitive field. The assigned reporting describes movement
              from sneakers and streetwear into watches, handbags, electronics, and trading cards, and says the platform
              operates across more than 200 countries; those descriptions are third-party accounts rather than audited
              operating disclosures. Expansion can improve cross-category demand and seller reach, but it also makes
              specialist expertise and consistent verification harder to maintain. The comparison implication is
              therefore conditional: StockX has a credible liquidity-and-trust proposition in standardized, high-demand
              items, while specialists may retain an advantage in product knowledge, community distribution, or
              high-touch service.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: Capability, distribution, and switching economics
        blocks:
          - type: paragraph
            body: >-
              StockX's defensible surface is the combination of a normalized catalog, bid/ask matching, historical price
              data, and an authentication step before fulfillment. Miracuves characterizes the model as a hybrid
              marketplace and exchange with a centralized authentication and logistics layer; Atop Legal likewise
              identifies verification before shipment as the platform's defining safeguard. That combination can reduce
              trust friction for buyers and make prices easier to compare than negotiated listings. It also creates a
              cost and execution burden: every transaction that needs physical inspection, exception handling, or
              dispute resolution consumes operational capacity. Generalists can undercut that burden through lower-touch
              listings, while specialists can compete by offering deeper expertise or stronger community access.

              The public evidence does not disclose comparable realized take rates, seller acquisition costs, repeat
              purchase, category contribution margin, or verified fulfillment economics for StockX and its peers.
              Public-facing fee references should therefore be treated as list or transaction terms, not as proof of
              margin or switching cost. The practical switching cost is mixed: seller reputation, transaction history,
              and buyer familiarity may create habit, but inventory is generally portable and sellers can multi-home
              across eBay, GOAT, Grailed, consignment, and direct channels. StockX's data and liquidity may be more
              durable than its interface, yet the counterparty can move when fees, dispute outcomes, or authentication
              confidence deteriorate.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
      - number: '3.3'
        title: Moat durability and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The strongest moat hypothesis is a reinforcing loop: more buyers and sellers improve liquidity; completed
              transactions create price history; price history improves discovery; and authentication makes the market
              more credible for scarce goods. The loop is not the same as a permanent barrier. A competitor with
              comparable liquidity can copy exchange-style presentation, a brand can internalize authenticated resale,
              and a generalist can subsidize acquisition with a broader marketplace. StockX's category expansion may
              also dilute the specialist signal that made sneakers its clearest use case.

              Adverse evidence is material to the trust thesis. A court-focused account reports that a judge found
              StockX liable for selling 37 counterfeit Nike pairs in March 2025, while the case later settled
              confidentially. A separate buyer-facing review states that authentication is not infallible and that
              expertise can be thinner in newer categories. These sources do not establish the frequency or current
              level of failures, but they show that the core differentiator carries legal, reputational, and
              quality-control exposure. The competitive conclusion is consequently balanced: StockX appears
              differentiated where liquidity, market data, and authentication matter together, but its durability
              depends on proving low exception rates and credible remediation at scale.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP007
              - CP008
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
              - CP006
              - CP011
              - CP012
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation is a system, not a single feature
            body: >-
              The defensible proposition combines liquidity, price discovery, standardized listings, and verification; a
              peer must reproduce the operating system rather than only copy the interface.
            calloutType: strength
            claimRefs:
              - CP005
              - CP006
          - type: callout
            title: Trust failures directly attack the moat
            body: >-
              The Nike litigation record and buyer-facing dispute evidence mean authentication quality should be
              underwritten as a measurable cost and retention driver, not assumed from the existence of a verification
              program.
            calloutType: risk
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and revenue quality
        blocks:
          - type: paragraph
            body: >-
              StockX monetizes completed transactions rather than selling owned inventory. The strongest current public
              description is a bid/ask marketplace in which StockX intermediates the transaction, authenticates the
              item, and ships it to the buyer. One market-data profile reports that buyers and sellers transact through
              a bid/ask marketplace and that products are authenticated before delivery; a separate business-model
              description says the seller fee starts around 9% and that buyers pay payment-processing and
              market-adjustment fees. Those are fee-model descriptions, not audited net revenue or realized take rate.
              The marketplace can generate repeatable transaction revenue when liquidity and category demand persist,
              but the authentication and fulfillment steps also create variable service-delivery cost. Public sources
              describe historical price and volume data and expansion into electronics, collectibles, watches, and
              handbags, yet they do not disclose category-level revenue mix, refunds, fraud reserves, or contribution
              margin. Accordingly, the financial quality case is plausible but not underwritable from the assigned
              public evidence.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI010
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
      - number: '4.2'
        title: Operating leverage and capital needs
        blocks:
          - type: paragraph
            body: >-
              StockX appears capital-light in inventory ownership but operationally intensive in authentication,
              facilities, customer support, shipping, and trust-and-safety. A funding profile describes the company as
              private and reports about $690 million raised, while another funding tracker reports a $275 million Series
              E in December 2020 at a $2.8 billion post-money valuation and says lifetime GMV had surpassed $3 billion
              by Q3 2020. These figures are not interchangeable: funding is capital raised, GMV is transaction volume,
              and neither is revenue or cash available. A separate source reports a $3.8 billion April 2021 valuation
              and a 1,493-employee March 2026 estimate, but labels its research AI-generated and not independently
              verified. The available evidence therefore supports a history of substantial financing and operational
              scale, not current runway or profitability. No assigned source provides cash on hand, debt,
              working-capital obligations, cap-table preferences, burn, or a next-round trigger.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI009
              - CI011
              - CI012
      - number: '4.3'
        title: Underwriting verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The core underwriting risk is measurement opacity. StockX's business depends on trusted authentication and
              market liquidity, but legal coverage reports that a court found the company liable for selling 37
              counterfeit Nike pairs in March 2025; separate coverage says the parties settled on confidential terms and
              dismissed the case with prejudice in August 2025. A buyer-focused review says fakes have slipped through
              authentication and describes fees around 8–10% for buyers and around 9% for sellers, while a
              low-reputation legal-marketing article reports seller complaints about fee changes and payout delays.
              These are adverse signals, not audited estimates of loss. Trust failures can increase refunds,
              reinspection, support, insurance, and reserve costs; the public record does not quantify those effects.
              The financial verdict is therefore research-more: the model has identifiable transaction revenue and
              financing history, but current revenue, gross margin, loss rates, cash runway, and cohort economics remain
              open diligence items. Any valuation analysis should scenario-test take rate, authentication cost per
              order, fraud/refund reserve, repeat purchase, seller concentration, and category mix instead of treating
              reported funding or prior valuation as current value.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Revenue mechanism is identifiable, economics are not
            body: >-
              StockX has a legible transaction-fee mechanism, but public evidence does not disclose realized take rate,
              cost per authenticated order, or contribution margin.
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI003
          - type: callout
            title: Trust costs are a financial variable
            body: >-
              The Nike litigation record and documented counterfeit concerns make fraud, refunds, reserves, and
              verification costs material diligence items rather than qualitative footnotes.
            calloutType: risk
            claimRefs:
              - CI009
              - CI011
          - type: callout
            title: Underwrite with scenarios, not historical funding
            body: >-
              Use current financial statements and cohort-level data to test take rate, repeat purchase, category mix,
              trust losses, and runway; do not treat funding or prior valuation as current cash or value.
            calloutType: recommendation
            claimRefs:
              - CI005
              - CI006
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Customer workflow and product surface
        blocks:
          - type: paragraph
            body: >-
              StockX connects buyers and sellers through a market-style interface rather than a conventional fixed-price
              storefront. Buyers submit bids, sellers submit asks, and a transaction occurs when the prices match;
              published price history gives participants a reference point for a particular item. The seller then sends
              the item to StockX for inspection and verification before the authenticated product is shipped onward.
              This workflow makes trust operations part of the product, not merely a back-office function. StockX began
              with sneakers and expanded into streetwear, electronics, collectibles, handbags, and trading cards, but
              public evidence does not show whether the same verification depth or service levels apply uniformly across
              categories. The buyer-facing promise therefore combines liquidity and price transparency with a physical
              control point that can add time and cost.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE009
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE009
              - CE013
      - number: '5.2'
        title: Operating architecture and maturity
        blocks:
          - type: paragraph
            body: >-
              The observable operating model has four linked layers — market matching and price display; payment and
              transaction handling; inbound logistics and physical authentication; and outbound delivery plus customer
              support. A public description says every item passes through a physical verification step and that trained
              authenticators assess products against brand-specific criteria before forwarding them. Historical
              reporting also describes a distributed network of authentication centers, while a 2025 industry analysis
              reports more than one million products inspected per month across regional hubs; that throughput figure is
              not independently audited here. The model can scale without StockX owning the inventory, but it remains
              dependent on labor quality, category-specific expertise, shipping partners, payment processors, and
              accurate catalog and pricing data. No assigned source documents APIs, cloud services, matching-engine
              design, observability, or recovery-time objectives, so those are diligence gaps rather than inferred
              capabilities.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE015
              - CE016
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE013
      - number: '5.3'
        title: Differentiation, category expansion, and roadmap evidence
        blocks:
          - type: paragraph
            body: >-
              StockX's defensible surface is most visible in the combination of authentication know-how, accumulated
              bid/ask and completed-sale data, and a consumer brand associated with authenticated resale. The product
              also extended into Vault NFTs, described by StockX as tokens tied to physical sneakers stored by the
              company, which introduced a digital-asset and trademark layer beyond ordinary resale listings. That
              extension was legally contested and the remaining claims settled confidentially, leaving no public proof
              that the NFT program became a durable product line. Category expansion into electronics, collectibles, and
              trading cards increases the addressable assortment but may require different counterfeit signatures,
              condition standards, and specialist training. Public sources do not establish launch success, roadmap
              sequencing, integration depth, or a measurable benefit from newer categories.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Trust, safety, privacy, and reliability controls
        blocks:
          - type: paragraph
            body: >-
              Authentication is a central trust control, but available evidence shows it is not infallible. A court
              found StockX liable for distributing 37 counterfeit Nike pairs in March 2025, while the remaining
              trademark, NFT, false-advertising, and consumer-confusion issues settled before trial. A separate account
              of the litigation reports that StockX changed from “100% Authentic” language to “Verified,” and described
              rejection of counterfeit products as an explicit part of the process; those descriptions do not establish
              current false-negative or false-positive rates. Historical reporting also records a 2019 data breach, and
              a 2026 legal summary alleges exposure of 6.8 million user records, though the latter is not a primary
              court or company record in this pool. There is no assigned public security audit, current uptime report,
              incident postmortem, privacy-control certification, or category-level quality dashboard. Investors should
              request those records before treating authentication, privacy, and operational resilience as mature
              controls.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Product is a trust-and-operations system
            body: >-
              StockX's differentiation is not just software matching; it depends on the repeatability of physical
              inspection, catalog data, logistics, and buyer remedies at marketplace scale.
            calloutType: insight
            claimRefs:
              - CE005
              - CE006
              - CE009
          - type: callout
            title: Verification and security remain diligence blockers
            body: >-
              The public record supports a real authentication workflow but also documents counterfeit leakage and a
              historical breach; current control metrics and independent assurance are unavailable in the assigned
              evidence.
            calloutType: risk
            claimRefs:
              - CE013
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, seller, and partner segments
        blocks:
          - type: paragraph
            body: >-
              StockX operates a two-sided marketplace rather than a conventional recurring-software customer base.
              Buyers seek scarce, high-demand goods and price discovery; sellers seek liquidity, access to global
              demand, and a controlled authentication-and-payout workflow. The platform's public descriptions cover
              sneakers, apparel, accessories, electronics, collectibles, and trading cards, while its bid/ask mechanics
              serve both sides of the transaction. A separate partner segment can consume aggregated market
              intelligence: Kalshi announced that it would use aggregated, anonymized StockX data to create event
              contracts tied to product prices and brand performance. This is evidence of data value and an external
              distribution surface, not evidence of recurring customer revenue or retention.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
      - number: '6.2'
        title: Adoption, transaction trust, and durability
        blocks:
          - type: paragraph
            body: >-
              The strongest public adoption evidence is operational rather than cohort-based. StockX routes sold items
              from sellers to authentication centers before forwarding them to buyers, and its marketplace displays
              bids, asks, transaction history, and volume. A 2025 partner announcement describes contracts based on
              average resale prices seven or thirty days after releases, showing that the market produces sufficiently
              legible price signals for an adjacent regulated exchange. The customer experience still has measurable
              friction: an independent consumer guide reports that authentication can add a week or more during
              high-demand drops and that customer service can be slow in disputes. No public source in this pool
              supplies current repeat-purchase, renewal, cohort, or net-retention data.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: Named proof, expansion, and concentration limits
        blocks:
          - type: paragraph
            body: >-
              Named proof is mixed in quality and should not be collapsed into a customer-count claim. Kalshi is a named
              commercial partner using anonymized StockX data, while Nike is a counterparty and investigator in
              litigation rather than a customer reference. The public record also identifies a large buyer case
              involving Roy Kim, but that case is adverse evidence about authentication controls, not durable adoption.
              StockX has expanded beyond sneakers into apparel, electronics, collectibles, and trading cards, yet the
              assigned sources do not disclose category-level revenue, seller concentration, repeat-purchase rates,
              active accounts, or channel mix. These missing denominators limit confidence in expansion and durability
              claims even though the marketplace model and partner surface are externally observable.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU007
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Trust is the product surface
            body: >-
              StockX's differentiated customer workflow is not merely listing inventory; it inserts centralized
              authentication and fulfillment between seller and buyer, making verification a visible part of the
              transaction promise.
            calloutType: strength
            claimRefs:
              - CU001
              - CU005
          - type: callout
            title: Retention and concentration remain unmeasured
            body: >-
              Public sources establish marketplace activity and named relationships but do not establish current active
              customers, repeat purchase, cohort retention, seller concentration, category contribution, or partner
              economics.
            calloutType: risk
            claimRefs:
              - CU008
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Authentication is a core control with documented failure modes
        blocks:
          - type: paragraph
            body: >-
              StockX's marketplace promise depends on an inspection step between seller and buyer, but the available
              evidence shows that this control is not infallible. A 2025 court account reports liability for 37
              counterfeit Nike pairs, while other reviewed accounts describe counterfeit pairs receiving verification
              tags and note that sophisticated replicas can defeat visual inspection. StockX's stated scale-based
              defense—that the affected pairs were 0.0004% of 17.8 million Nike sneakers reviewed during the litigation
              period—puts the event in context but does not quantify current counterfeit loss rates or prove that the
              same failure mode has been eliminated. The operating risk is therefore not simply “fakes exist”; it is
              that a low-frequency control failure can impose disproportionate reputational, refund, legal, and
              repeat-purchase costs on high-value transactions. Current diligence should obtain category-level
              false-negative rates, fraud-loss and reserve data, re-authentication outcomes, and control changes since
              2025.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR005
              - CR010
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR005
              - CR010
              - CR013
              - CR015
      - number: '7.2'
        title: Privacy history and buyer remedies create residual trust exposure
        blocks:
          - type: paragraph
            body: >-
              The 2019 breach remains a material operational and privacy risk because the reviewed account describes
              exposure of approximately 6.8 million user records and criticism of the company's initial disclosure
              approach. The same source says StockX later stated that it made infrastructure changes and engaged
              forensic experts, but the public file does not include an independent security audit, a current incident
              rate, or a control-test result. Buyer remedies are also bounded: eligible U.S. purchases may have a 14-day
              return window, the item must remain unused with its tag or sticker attached, and the return is issued as
              StockX Credit; other problems are handled through a separate Buyer Promise process. These limitations can
              increase support load and dispute costs when authentication, condition, or timing expectations fail.
              Management should provide incident-response evidence, current penetration-test or assurance reports,
              claims and refund cohorts, and support-resolution metrics.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: Legal uncertainty and dependency risk remain incompletely quantified
        blocks:
          - type: paragraph
            body: >-
              Nike's litigation produced a concrete adverse finding but not a complete resolution of the underlying
              business and legal questions. The reviewed legal summary says the federal court found StockX liable for
              selling 37 counterfeit Nike sneakers, while the remaining claims were dismissed with prejudice after an
              August 29, 2025 confidential settlement; no public source reviewed here discloses monetary terms or
              whether business-practice changes were required. A separate 2026 legal-summary page alleges additional
              privacy, counterfeit, authentication, and fee disputes, but its status claims should be independently
              verified rather than treated as adjudicated fact. StockX also depends on authenticators, payment
              processors, logistics, brands, and seller supply; the public evidence does not quantify counterparty
              concentration or service-level failure exposure. Diligence should reconcile the docket, settlement
              documents, insurance coverage, vendor concentration, and contingency plans.
            claimRefs:
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: Monitoring plan and thesis-break conditions
        blocks:
          - type: paragraph
            body: >-
              The most decision-relevant risk indicators are measurable control outcomes rather than broad assurances.
              Investors should monitor counterfeit-confirmation rates by category and channel, refunds and reserves per
              transaction, authentication turnaround during peak demand, support aging, privacy incidents, and legal
              claims. A thesis-break event would be a repeat pattern of confirmed counterfeits after verification, a
              material breach without timely containment and disclosure, or a settlement, judgment, or regulatory action
              that materially constrains the marketplace model. Evidence of sustained improvement would require a
              current control report, reconciled loss metrics, and transparent remediation testing rather than relying
              on the absence of a newly reported incident. Until those records are supplied, residual exposure remains
              high even though the reviewed sources also describe process upgrades, refunds, and payment escrow as
              mitigations.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Trust-control risk is the binding issue
            body: >-
              The 2025 counterfeit finding and the earlier breach history both concern controls that sit beneath
              StockX's trust proposition; current loss, testing, and remediation data are not public in the reviewed
              pool.
            calloutType: risk
            claimRefs:
              - CR001
              - CR005
              - CR013
          - type: callout
            title: Require measurable remediation evidence
            body: >-
              Before underwriting a lower risk rating, request current false-negative, fraud-loss, reserve,
              incident-response, support-aging, and dependency-concentration metrics with denominators and reporting
              periods.
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR006
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is that StockX built a recognizable, authenticated resale marketplace around bid/ask
              price discovery, a model that can create liquidity and trusted pricing in scarce consumer goods. Multiples
              reports more than 15 million buyers, 1.7 million sellers, and over 50 million lifetime trades, while its
              historical financing record shows institutional willingness to fund category expansion. The anti-thesis is
              that the public valuation file is not a coherent current financial dataset. Multiples records a $3.8B
              April 2021 valuation against $400M of recorded revenue, whereas Venture Capital Tracker calls the December
              2020 Series E the latest funding and cites a $2.8B valuation. DeFiLlama displays a $1.07B estimate as of
              October 20, 2026 but explicitly does not show a latest funding valuation. Those are different
              observations, not a reliable current mark. The Nike litigation record also found StockX liable for 37
              counterfeit pairs at summary judgment before the parties settled confidentially; this makes authentication
              quality an economic and brand-underwriting variable, not only a legal footnote.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV010
              - CV015
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The financing history supports scale but does not establish cash available today or the rights attached to
              any current securities. Multiples records a $195M April 2021 Series E transaction at a $3.8B post-money
              valuation and a $60M Series E-1 primary component, while also describing a secondary tender offering.
              Venture Capital Tracker instead presents a $275M December 2020 Series E at $2.8B and approximately $490M
              of disclosed equity funding after that round; its editorial snapshot is explicitly not a live quote.
              DeFiLlama lists a $2M June 2022 seed entry and a $1.07B estimated valuation, but the page does not explain
              the estimation method in the assigned text. IPOs.fyi says no IPO has been announced as of April 2, 2026.
              Together, these sources justify an entry-discipline rule rather than a price target: obtain the current
              cap table, primary-versus-secondary proceeds, liquidation preferences, option pool, debt, cash, and any
              recent secondary marks before applying a multiple. Historical financing totals are not cash on the balance
              sheet, and an estimated valuation is not a transactible price.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV003
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
      - number: '8.3'
        title: Scenarios and comparable signals
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more defensible than a single-point valuation because current revenue quality,
              margins, retention, and loss rates are not disclosed in the assigned evidence. The bull case requires
              current revenue to be corroborated, authentication losses to remain immaterial at scale, and new
              categories to add contribution profit rather than dilute trust economics. The base case assumes a durable
              marketplace but applies a material information discount until audited financials and transaction terms are
              available. The bear case assumes multiple compression, weaker resale demand, or higher verification and
              refund costs; the Nike record demonstrates why that downside is operationally plausible, even though
              settlement terms and later remediation are not public here. Multiples lists private and public
              comparables, including GOAT Group at a $3.7B 2021 valuation, Weee! at 10.3x revenue, and several
              public-company revenue multiples from 0.3x to 4.8x. Those are directional reference points, not a
              like-for-like comp set: the businesses differ in geography, category, profitability, and revenue
              definition. No probability is assigned as a false precision; management and investor diligence should
              replace these signals with current cohort, margin, and transaction data.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV013
              - CV014
      - number: '8.4'
        title: Decision, exit readiness, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more with low-to-medium confidence in the valuation conclusion, not a
              judgment that StockX lacks strategic value. The evidence supports a scaled private marketplace with brand
              and liquidity advantages, but it does not support a current valuation range that can survive scrutiny over
              accounting basis, margins, cash conversion, dilution, or preferences. The decision should move toward
              track only if current financials show durable contribution economics and the cap table is clean; it should
              move toward avoid if verification losses, refunds, disputes, or category expansion materially worsen unit
              economics, or if a financing requires punitive preferences. Exit readiness is also unproven: IPOs.fyi
              reports no announced IPO, and the assigned evidence contains no audited public-company preparation or
              liquidity timetable. Immediate diligence should request monthly GMV and revenue bridges, take rate, gross
              margin after authentication and shipping, fraud and reserve losses, cohort retention, seller
              concentration, cash and debt, current cap table, preference stack, recent secondary prices, and the legal
              remediation record after the Nike settlement. A thesis break is a verified deterioration in those
              measures, not a stale headline valuation.
            claimRefs:
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Decision
            body: >-
              Research-more: StockX merits continued underwriting, but current public evidence does not support a
              confident valuation stance or precise entry price.
            calloutType: recommendation
            claimRefs:
              - CV013
              - CV014
          - type: callout
            title: Thesis-break trigger
            body: >-
              A verified increase in authentication losses, refunds, reserves, or punitive financing preferences would
              break the underwriting case even if marketplace volume remains high.
            calloutType: risk
            claimRefs:
              - CV004
              - CV015
