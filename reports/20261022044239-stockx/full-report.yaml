  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Scale and historical financing support interest, but valuation opacity and trust-cost uncertainty lead to
      research-more.
    data:
      nodes:
        - id: scale
          label: Marketplace scale
          detail: 15M+ buyers, 1.7M sellers, and 50M+ lifetime trades reported by Multiples
        - id: financing
          label: Historical financing
          detail: $3.8B April 2021 valuation and $195M Series E transaction reported by Multiples
        - id: opacity
          label: Current valuation opacity
          detail: $1.07B estimate, historical $2.8B/$3.8B marks, and no current priced round in assigned evidence
        - id: trust
          label: Trust-cost uncertainty
          detail: 37 counterfeit Nike pairs liability before confidential settlement
        - id: diligence
          label: Required diligence
          detail: Audited financials, cap table, preferences, loss rates, and current transaction evidence
        - id: decision
          label: Research-more
          detail: Track upside without underwriting an unsupported price
    approximationNotes: The flow expresses analytical dependency, not a quantified probability or valuation bridge.
