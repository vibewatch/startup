  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable boundary is narrower than all resale or all e-commerce. StockX's core market is
              authenticated, platform-mediated secondary trade in scarce sneakers, streetwear, collectibles,
              electronics, and adjacent consumer goods, with bid/ask price discovery and fulfillment integrated into the
              transaction. Primary retail, brand direct-to-consumer sales, and unauthenticated peer-to-peer trades are
              not part of that revenue pool, although they are important substitutes. The available category report is
              narrower in some respects and broader in others: it centers sneaker and streetwear resale but also
              discusses hypothetical financial products. Accordingly, its headline values should not be treated as a
              clean measure of StockX's addressable transaction volume. Competing authenticated marketplaces,
              consignment stores, broad marketplaces, and private trades all solve parts of the same buyer job while
              changing trust, liquidity, fee, and delivery tradeoffs.
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM011
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Intel Market Research states a global category value of $3.6 billion in 2025 and forecasts $4.6 billion in
              2026 and $34 billion in 2034, a 28.6% CAGR. It describes a bottom-up and top-down process reconciled
              against company data, but the same page later states a different $8 billion 2024 value and $25 billion
              2032 endpoint. That internal inconsistency materially weakens confidence in the forecast. A separate
              historical scale marker says StockX had surpassed $3 billion in lifetime GMV by Q3 2020; lifetime GMV is
              cumulative platform throughput, not annual revenue, current market size, or cash available. No assigned
              source discloses current StockX GMV, geographic or category mix, take rate, eligible supply, or attainable
              share. Therefore the sizing exhibit is an evidence ladder, not a nested TAM/SAM/SOM model, and no
              valuation multiple should be applied to its category totals.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM015
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM015
          - type: figure
            figureRef: FM001
