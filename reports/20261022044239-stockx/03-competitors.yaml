        - {label: eBay, x: 4, y: 2, detail: "Broad generalist reach; authentication scope varies"}
        - {label: Grailed, x: 2, y: 2, detail: "Community/category specialist; breadth and scale not evidenced"}
        - {label: Brand-owned resale, x: 3, y: 3, detail: "Potentially strong brand trust and control; cross-brand liquidity unproven"}
        - {label: Direct trade, x: 1, y: 1, detail: "Relationship-based trust and narrow reach"}
      xAxis: "Category breadth and cross-category liquidity (ordinal 1-4)"
      yAxis: "Trust infrastructure and verification (ordinal 1-4)"
    approximationNotes: "Coordinates are ordinal analyst assessments derived from the assigned source descriptions, not measured market shares or benchmark scores."
    claimRefs: [CP005, CP006, CP011, CP012]
callouts:
  - calloutType: strength
    title: Differentiation is a system, not a single feature
    body: "The defensible proposition combines liquidity, price discovery, standardized listings, and verification; a peer must reproduce the operating system rather than only copy the interface."
    claimRefs: [CP005, CP006]
  - calloutType: risk
    title: Trust failures directly attack the moat
    body: "The Nike litigation record and buyer-facing dispute evidence mean authentication quality should be underwritten as a measurable cost and retention driver, not assumed from the existence of a verification program."
    claimRefs: [CP009, CP010, CP011, CP013]
