      - [StockX buyer, "Cove reports a service fee around 8%-10% plus shipping", "Market-price access, price history, and authentication workflow", "Official current category and geography schedule not retained", "All-in cost can encourage comparison shopping and multi-homing"]
      - [GOAT, "Not available in the assigned evidence", "Authenticated marketplace alternative", "Discounts, seller tiers, shipping, and realized pricing unknown", "No evidence-supported fee advantage can be claimed"]
      - [eBay, "Not available in the assigned evidence", "Broad marketplace reach and authentication programs", "Category coverage and all-in fee comparison unknown", "Breadth may compete even without identical packaging"]
      - [Grailed, "Not available in the assigned evidence", "Community-oriented fashion and streetwear marketplace", "Current fees and buyer-protection terms unknown", "Community distribution may offset weaker price standardization"]
      - [Direct trade or local consignment, "Negotiated or locally set rather than a common platform package", "Direct handoff or relationship-based service", "Counterparty risk, authentication cost, and commissions vary", "Lower visible platform fees can shift trust costs back to the user"]
    notes: "Only third-party indicative 2026 StockX fees were retained; competitor pricing is marked unavailable rather than estimated, and reported list fees are not realized take rate or margin."
    claimRefs: [CP003, CP007, CP008, CP013]
