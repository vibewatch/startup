  - calloutType: risk
    title: Current disclosure remains thin
    body: The assigned evidence does not establish current audited financials, cap-table terms, a complete leadership roster, or whether historical scale metrics remain active and comparable.
    claimRefs: [CO004, CO007, CO011, CO014]
