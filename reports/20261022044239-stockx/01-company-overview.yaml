company:
  name: StockX
chapter:
  number: 1
  title: Company Overview
  summary: StockX is a Detroit-founded private marketplace for authenticated resale, with a bid/ask model spanning sneakers, apparel, electronics, collectibles, and trading cards. Publicly available evidence supports a $3.8 billion April 2021 valuation and substantial historical scale, but current financial quality, cap-table detail, and leadership disclosure remain incomplete.
sections:
  - id: identity-and-model
    title: Identity, product, and operating model
    body: >-
      StockX is described across the retained sources as a Detroit-based, privately held marketplace for high-demand consumer goods. Its core mechanism is a bid/ask market in which buyers place bids and sellers list asks, followed by inspection at a StockX facility before delivery. The catalog has expanded beyond sneakers into apparel, streetwear, electronics, collectibles, and trading cards. This is a marketplace and authentication model rather than a subscription software model: the available source describes commission revenue, while the exact take rate and category-level margin are not disclosed. The company’s identity is therefore clear, but current operating scale should not be inferred from older financing-era metrics.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Founders, leadership, and governance
    body: >-
      The retained evidence identifies Dan Gilbert and Chris Kaufman as founders and records Scott Cutler’s 2019 appointment as CEO, replacing co-founder Josh Luber, who remained on the board and as a public-facing figure at that time. This establishes a material founder-to-professional-management transition, but the assigned sources do not provide a reliable 2026 executive roster or a complete board list. Key-person dependence is consequently a diligence issue: the business depends on marketplace trust, authentication operations, and category expansion, yet current accountability for those functions cannot be mapped from the available public material. A current cap table, board roster, and executive biographies should be requested directly.
    claimRefs: [CO005, CO006, CO007]
    tableRefs: [TO002]
  - id: financing-scale-and-risk
    title: Financing, scale, and unresolved exposure
    body: >-
      StockX’s financing history shows rapid valuation expansion through 2021: the retained financing summaries describe a $110 million Series C at a valuation above $1 billion in June 2019, a $275 million Series E at $2.8 billion in December 2020, and an April 2021 transaction associated with a $3.8 billion post-money valuation. The same evidence distinguishes primary financing from a $195 million secondary tender, so funding raised is not equivalent to cash available. Historical sources also report millions of buyers, sellers, trades, and gross merchandise value, but do not supply audited current revenue, cash, debt, or profitability. Legal evidence adds a material trust and governance risk: a court finding covered 37 counterfeit Nike pairs before a confidential 2025 settlement.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO003]
    figureRefs: [FO001]
