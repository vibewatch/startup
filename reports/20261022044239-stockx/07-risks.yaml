callouts:
  - calloutType: risk
    title: Trust-control risk is the binding issue
    body: The 2025 counterfeit finding and the earlier breach history both concern controls that sit beneath StockX's trust proposition; current loss, testing, and remediation data are not public in the reviewed pool.
    claimRefs: [CR001, CR005, CR013]
  - calloutType: recommendation
    title: Require measurable remediation evidence
    body: Before underwriting a lower risk rating, request current false-negative, fraud-loss, reserve, incident-response, support-aging, and dependency-concentration metrics with denominators and reporting periods.
    claimRefs: [CR003, CR006, CR014]
