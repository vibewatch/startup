schemaVersion: "report-v2"
artifact: valuation
slug: stockx
runDate: 2026-10-22
company:
  name: StockX
chapter:
  number: 8
  title: Valuation
  summary: "StockX has demonstrated meaningful authenticated-marketplace scale and previously attracted a $3.8B private-market valuation, but the assigned current evidence is too inconsistent and too thin on audited profitability, cap-table terms, and current financing to support a precise mark. The appropriate posture is research-more: preserve upside optionality while requiring current financial and transaction evidence before underwriting a price."
sections:
  - id: investment-thesis
    title: Investment thesis and anti-thesis
    body: >-
      The positive thesis is that StockX built a recognizable, authenticated resale
      marketplace around bid/ask price discovery, a model that can create liquidity
      and trusted pricing in scarce consumer goods. Multiples reports more than 15
      million buyers, 1.7 million sellers, and over 50 million lifetime trades,
      while its historical financing record shows institutional willingness to fund
      category expansion. The anti-thesis is that the public valuation file is not
      a coherent current financial dataset. Multiples records a $3.8B April 2021
      valuation against $400M of recorded revenue, whereas Venture Capital Tracker
      calls the December 2020 Series E the latest funding and cites a $2.8B
      valuation. DeFiLlama displays a $1.07B estimate as of October 20, 2026 but
      explicitly does not show a latest funding valuation. Those are different
      observations, not a reliable current mark. The Nike litigation record also
      found StockX liable for 37 counterfeit pairs at summary judgment before the
      parties settled confidentially; this makes authentication quality an
      economic and brand-underwriting variable, not only a legal footnote.
    claimRefs: [CV001, CV002, CV003, CV004]
    tableRefs: [TV001, TV002]
  - id: financing-and-entry-discipline
    title: Financing context and entry discipline
    body: >-
      The financing history supports scale but does not establish cash available
      today or the rights attached to any current securities. Multiples records a
      $195M April 2021 Series E transaction at a $3.8B post-money valuation and a
      $60M Series E-1 primary component, while also describing a secondary tender
      offering. Venture Capital Tracker instead presents a $275M December 2020
      Series E at $2.8B and approximately $490M of disclosed equity funding after
      that round; its editorial snapshot is explicitly not a live quote. DeFiLlama
      lists a $2M June 2022 seed entry and a $1.07B estimated valuation, but the
      page does not explain the estimation method in the assigned text. IPOs.fyi
      says no IPO has been announced as of April 2, 2026. Together, these sources
      justify an entry-discipline rule rather than a price target: obtain the
      current cap table, primary-versus-secondary proceeds, liquidation
      preferences, option pool, debt, cash, and any recent secondary marks before
      applying a multiple. Historical financing totals are not cash on the balance
      sheet, and an estimated valuation is not a transactible price.
    claimRefs: [CV005, CV006, CV007, CV008]
    tableRefs: [TV003]
  - id: scenarios-and-comparables
    title: Scenarios and comparable signals
    body: >-
      A scenario framework is more defensible than a single-point valuation because
      current revenue quality, margins, retention, and loss rates are not disclosed
      in the assigned evidence. The bull case requires current revenue to be
      corroborated, authentication losses to remain immaterial at scale, and new
      categories to add contribution profit rather than dilute trust economics. The
      base case assumes a durable marketplace but applies a material information
      discount until audited financials and transaction terms are available. The
      bear case assumes multiple compression, weaker resale demand, or higher
      verification and refund costs; the Nike record demonstrates why that downside
      is operationally plausible, even though settlement terms and later remediation
      are not public here. Multiples lists private and public comparables, including
      GOAT Group at a $3.7B 2021 valuation, Weee! at 10.3x revenue, and several
      public-company revenue multiples from 0.3x to 4.8x. Those are directional
      reference points, not a like-for-like comp set: the businesses differ in
      geography, category, profitability, and revenue definition. No probability
      is assigned as a false precision; management and investor diligence should
      replace these signals with current cohort, margin, and transaction data.
    claimRefs: [CV009, CV010, CV011, CV012]
    figureRefs: [FV001]
  - id: decision-and-diligence
    title: Decision, exit readiness, and thesis breaks
    body: >-
      The recommendation is research-more with low-to-medium confidence in the
      valuation conclusion, not a judgment that StockX lacks strategic value. The
      evidence supports a scaled private marketplace with brand and liquidity
      advantages, but it does not support a current valuation range that can survive
      scrutiny over accounting basis, margins, cash conversion, dilution, or
      preferences. The decision should move toward track only if current financials
      show durable contribution economics and the cap table is clean; it should move
      toward avoid if verification losses, refunds, disputes, or category expansion
      materially worsen unit economics, or if a financing requires punitive
      preferences. Exit readiness is also unproven: IPOs.fyi reports no announced
      IPO, and the assigned evidence contains no audited public-company preparation
      or liquidity timetable. Immediate diligence should request monthly GMV and
      revenue bridges, take rate, gross margin after authentication and shipping,
      fraud and reserve losses, cohort retention, seller concentration, cash and
      debt, current cap table, preference stack, recent secondary prices, and the
      legal remediation record after the Nike settlement. A thesis break is a
      verified deterioration in those measures, not a stale headline valuation.
    claimRefs: [CV013, CV014, CV015]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Current assessment, Decision implication]
    rows:
      - [Recommendation, research-more, "Do not underwrite a precise entry price yet"]
      - [Confidence, low-to-medium, "Evidence is directionally useful but financially incomplete"]
      - [Risk rating, high, "Trust-cost and information risks remain material"]
      - [Valuation stance, unknown, "Require current primary transaction and financial evidence"]
    notes: "Assessment synthesizes the assigned public sources; no current audited financial statements or cap-table terms were supplied."
    claimRefs: [CV010, CV015, CV009]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Evidence, What would change the view]
    rows:
      - ["Scaled authenticated marketplace", "More than 15M buyers, 1.7M sellers, and 50M lifetime trades reported by Multiples", "Cohort and contribution-margin data showing durable repeat economics"]
      - ["Institutional financing validation", "$3.8B April 2021 valuation and $195M Series E transaction reported by Multiples", "Current primary round or secondary mark with terms"]
      - ["Valuation opacity", "$1.07B DeFiLlama estimate versus historical $2.8B/$3.8B marks", "Audited current revenue, margin, cash, and a priced transaction"]
      - ["Trust-cost downside", "Court Docket reports liability for 37 counterfeit Nike pairs before confidential settlement", "Verified post-settlement loss, refund, and remediation metrics"]
    notes: "Historical marks, estimates, and legal outcomes are not interchangeable valuation inputs; the final column identifies diligence that could change the investment view."
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Key trigger]
    rows:
      - [Bull, "Current revenue and margins corroborate scale; trust losses remain controlled; categories add profit", "Re-rate toward a supported marketplace multiple; upside requires a current priced anchor", "Unassigned pending evidence", "Audited growth, margin, retention, and clean financing terms"]
      - [Base, "Marketplace remains durable but financial quality and cap-table terms remain partly opaque", "Apply an information discount; no precise target is supportable", "Most defensible today", "Current statements and cap table arrive without material surprises"]
      - [Bear, "Multiple compression, weaker demand, or higher authentication/refund costs", "Downside to an unverified historical mark; preserve capital until evidence improves", "Material downside cannot be quantified", "Rising loss/reserve rates, adverse financing terms, or failed commercialization"]
      - [Exit-ready, "Public-company controls, audited reporting, and a credible liquidity timetable", "Potential public-market underwriting; not established in assigned sources", "Not supported", "IPO filing, audited disclosures, or documented secondary liquidity"]
    notes: "These are qualitative scenarios because current revenue basis, margins, cash conversion, and transaction terms are not sufficiently disclosed in the assigned evidence; no probabilities or fabricated valuation ranges are supplied."
    claimRefs: [CV009, CV010, CV011, CV013, CV014, CV015]
