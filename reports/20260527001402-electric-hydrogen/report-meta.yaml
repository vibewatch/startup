companyProfile:
  summary: Electric Hydrogen is a Massachusetts-founded green hydrogen equipment company building advanced PEM electrolyzer plants for industrial-scale hydrogen, ammonia, and e-fuels projects. Rather than selling small containerized units, the company packages proprietary high-power stacks, balance-of-plant systems, and modular fabrication into its HYPRPlant platform, aiming to lower total installed cost enough to unlock refinery, fertilizer, steel, and advanced-fuels decarbonization projects.
