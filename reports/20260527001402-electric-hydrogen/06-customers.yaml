- id: adoption-trajectory-and-pipeline
  title: Adoption Trajectory and Project Pipeline
  body: |-
    Electric Hydrogen's adoption trajectory follows an industrial project-development arc rather than a traditional SaaS
    or consumer adoption curve. Progress is measured not in monthly active users or ARR cohorts but in project stages:
    from FEED selection to engineering FEED, to FID, to equipment delivery, to commissioning, to commercial operation.
    Each stage takes months to years, and public evidence must be read accordingly.

    The internal proof progression started with a 1 MW electrolyzer plant operating since 2022, which developed plant-wide
    controls and safety design. The Pioneer plant—at roughly one-tenth commercial scale—has operated since January 2024
    using the same electrolyzers, power systems, and process design as HYPRPlant, and was delivered, assembled, and
    commissioned in under five months, serving as the primary de-risking milestone for commercial delivery speed. The
    first commercial-scale deployment, a 100 MW HYPRPlant for Infinium, has shipped to Pecos, Texas, been hydro-tested
    and quality-checked, and is currently in site commissioning as of 2026—making it the first real proof of commercial
    manufacturing and field delivery execution.

    Beyond Roadrunner, the named project pipeline spans four additional relationships at progressively earlier stages.
    HIF Global selected EH2 in September 2025 for its Matagorda, Texas e-fuels facility; no FEED or FID date is yet
    public. Synergen Green Energy signed a FEED agreement in December 2025 for two 120 MW HYPRPlants; FID is targeted
    for 2026 with facility operations by end-2028. Uniper began pre-FEED work with EH2 in October 2024 for a 200 MW
    project in Wilhelmshaven, Germany; the project has EU Project of Common Interest status. AES holds a framework
    supply reservation for up to 1 GW, providing a pipeline placeholder rather than a committed project.

    A February 2024 Utility Dive report cited EH2's SVP of Global Commercial noting 5 GW of orders lined up for the
    factory, but no subsequent public disclosure has confirmed or updated that reported figure, and the same executive
    acknowledged industry-wide uncertainty. The Ambient Fuels acquisition (closed May 2025) added approximately 15
    in-house projects across 10+ US states with a stated potential of over 600 TPD, but these are internal development
    assets rather than signed customer contracts.
