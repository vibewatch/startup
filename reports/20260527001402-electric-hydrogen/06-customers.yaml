  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-count-and-backlog
    missingEvidence: Total contracted customer count, committed MW backlog, and revenue pipeline by project stage and segment.
    whyItMatters: Without a backlog figure, concentration risk and near-term revenue sustainability cannot be quantified; the
      five public accounts may represent most or all of the active pipeline.
    diligencePath: Request full customer list, project stage (FEED/pre-FEED/FID), contracted MW, and probability-weighted
      revenue estimate for each project in the pipeline.
    relatedQuestionRefs:
    - QU010
    - QU027
    relatedTableRefs:
    - TU002
    - TU005
  - type: missing-source
    severity: material
    topic: nrr-grr-retention
    missingEvidence: No NRR, GRR, re-order rate, customer churn, or cohort engagement data has been publicly disclosed.
    whyItMatters: Durability of EH2's customer relationships cannot be assessed without knowing whether early-stage project
      selections convert to FIDs and whether customers return for subsequent projects.
    diligencePath: Request re-engagement rate (selection to FID conversion, FEED to FID conversion) and track post-Roadrunner
      commissioning whether Infinium or other customers begin a second project.
    relatedQuestionRefs:
    - QU021
    - QU022
    - QU024
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: post-commissioning-service-model
    missingEvidence: No public disclosure of warranty length, service-level agreements, remote-monitoring model, or lifecycle
      service pricing for HYPRPlant once commissioned.
    whyItMatters: Long-term customer value and equipment differentiation depend partly on the quality of the service relationship
      post-commissioning; absent service terms, a buyer cannot evaluate total lifecycle risk.
    diligencePath: Request the standard service and warranty agreement, field-service response-time commitments, and terms
      for the Roadrunner plant to establish the base case service model.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: minor
    topic: heavy-industry-named-customers
    missingEvidence: No named customers from the refinery, steel, or chemicals segments that appear prominently in EH2's
      marketing materials and intake form.
    whyItMatters: If the largest potential total addressable market (refinery hydrogen replacement, green steel) has no
      named customers yet, segment diversification risk is higher than the pipeline breadth suggests.
    diligencePath: Ask whether any refinery, steel, or chemical company has signed a supply agreement or FEED; if so, request
      basis for confidentiality.
    relatedQuestionRefs:
    - QU006
    relatedTableRefs:
    - TU001
  - type: stale
    severity: minor
    topic: order-pipeline-staleness
    missingEvidence: The 5 GW orders figure cited in a February 2024 Utility Dive article has not been publicly confirmed
      or updated by EH2 in any reviewed source since; the current order pipeline figure is not publicly disclosed.
    whyItMatters: If the 5 GW order figure was aspirational or has not materialized into signed contracts, the
      growth trajectory implied at that time may overstate near-term commercial momentum.
    diligencePath: Request current signed order backlog (MW), conversion rate from pipeline to signed FEED, and
      whether any of the cited 5 GW order pipeline has been cancelled or deferred.
    relatedQuestionRefs:
    - QU011
    relatedTableRefs:
    - TU002
  - type: missing-source
    severity: material
    topic: roadrunner-deployment-outcomes
    missingEvidence: No post-commissioning operational data, uptime metrics, hydrogen output rates, or efficiency
      measurements for the Infinium Project Roadrunner 100 MW HYPRPlant have been publicly disclosed as of May 2026;
      the plant entered commissioning in 2026 but commercial operation data is not yet available.
    whyItMatters: Roadrunner is EH2's only production-grade customer deployment; its operational performance is the
      primary basis for verifying that HYPRPlant commercial guarantees can be met at scale. Absence of performance
      data means all downstream customer proof rests on a still-commissioning asset.
    diligencePath: Request commissioning milestones, first hydrogen production date, actual vs. rated efficiency,
      availability metrics, and any warranty claims or performance deviations since site delivery.
    relatedQuestionRefs:
    - QU020
    relatedTableRefs:
    - TU003
