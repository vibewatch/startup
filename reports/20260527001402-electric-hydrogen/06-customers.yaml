- id: named-customer-proof
  title: Named Customer Proof and Reference Quality
  body: |-
    Electric Hydrogen's most valuable public proof asset is the Infinium Project Roadrunner deployment. It is the
    only relationship in the public pack where equipment has shipped, been assembled and hydro-tested at a third-party
    Texas skid shop, physically transported to a customer site, and entered commissioning—a sequence documented by both
    EH2's own website and independent third-party news coverage. Project Roadrunner also reached financial close with
    Brookfield Asset Management and Breakthrough Energy Catalyst, and carries a binding 10-year eSAF offtake agreement
    with IAG (British Airways, Aer Lingus, Iberia). These credentials—project financing, institutional equity, and named
    offtaker—give the Infinium relationship a level of bankability verification absent from the other four named accounts.
    Infinium CEO Robert Schuetzle provided a confirmatory quote about HYPRPlant design and commercial package quality.

    The HIF Global relationship (announced September 2025) is a credible second proof point: it was announced jointly
    through EH2's own channel and through GlobeNewswire, is cited in EH2's LATAM announcement as an example of existing
    customer deployments, and involves a well-capitalized counterparty (HIF produced the world's first commercial eFuels
    in Chile in 2023). However, no FEED, FID, or delivery timeline is public, making its current stage opaque.

    Synergen's FEED agreement (December 2025) and Uniper's pre-FEED (announced October 2024) are earlier-stage but
    credible precisely because they involve engineering commitments, not just letters of interest. Synergen CEO Pranav
    Tanti cited the target of achieving total installed costs below $1,000/kW as the reason for selecting EH2. Uniper,
    as an exclusive partner, signals a high-confidence counterparty relationship for EH2's first major European project.

    The AES framework agreement is the least committal of the five named relationships: it is a supply reservation for
    up to 1 GW contingent on AES developing specific projects. Investors should note that United Airlines Ventures is
    a financial investor in EH2; United Airlines is not named as an electrolyzer customer in any reviewed source, and
    the downstream eSAF customers of Infinium (American Airlines, IAG) are buying fuel from Infinium, not hydrogen
    equipment from EH2.
