figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Customers follow a multi-year project-development journey from concept to commercial hydrogen production. EH2
    engages at the technology-selection stage and delivers through commissioning; lifecycle service is not publicly detailed.
  data:
    items:
    - id: concept
      label: "Stage 1: Project concept and site selection"
      description: Customer developer assessing renewable resource, site, and hydrogen project economics; EH2 not yet engaged
    - id: qualification
      label: "Stage 2: Vendor qualification and LCOH modeling"
      description: Customer uses EH2 intake form and model-your-project tool; commercial term sheet exchange; AES and Synergen quotes reference cost targets
    - id: selection
      label: "Stage 3: Technology selection / pre-FEED"
      description: Exclusive or preferred partner selection; preliminary engineering; pre-FEED studies (Uniper exclusive pre-FEED; HIF Global selection)
    - id: feed
      label: "Stage 4: Front-end engineering and design (FEED)"
      description: FEED agreement signed; plant integration design; EPC contractor selection (Synergen FEED; Weitz EPC for Roadrunner)
    - id: fid
      label: "Stage 5: Final investment decision"
      description: Equipment supply contract finalized; project financing closed (Infinium FID with Brookfield and BE Catalyst; IAG offtake)
    - id: fabrication
      label: "Stage 6: Equipment fabrication and delivery"
      description: Devens stacks and Texas skids manufactured; factory acceptance test; road-shippable modules dispatched to site (Roadrunner skids hydro-tested, shipped)
    - id: commissioning
      label: "Stage 7: Site installation and commissioning"
      description: Modules assembled on-site by EPC partner; plant tested and handed over (Roadrunner in commissioning 2026)
    - id: operations
      label: "Stage 8: Commercial hydrogen production"
      description: Customer operator runs plant; EH2 service / support (terms not publicly disclosed); Roadrunner commercial e-fuels production targeted 2027
  approximationNotes: Journey is constructed from public sources and press releases. Timeline durations between stages
    are not publicly disclosed. EH2 post-commissioning service model is not publicly documented.
