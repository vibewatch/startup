- id: retention-expansion-and-concentration
  title: Retention, Durability, Expansion, and Concentration Risk
  body: |-
    No conventional SaaS-style retention metrics—NRR, GRR, cohort renewal rates, or customer satisfaction scores—exist
    in the public pack. This is structurally expected for an industrial capital-equipment business where each project is
    a multi-year, multi-hundred-million-dollar contract rather than a recurring subscription. "Retention" in this context
    means whether a customer re-engages for a second project; there is no public evidence of a second engagement or
    re-order from any of the five named relationships, all of which are first-project selections. Durability indicators
    like contract length are implied (the Infinium eSAF offtake with IAG is 10 years, for example, but that governs fuel
    sales not EH2 equipment) and post-commissioning service terms are not publicly disclosed by EH2.

    Expansion dynamics operate at two levels. Geographically, EH2 hired a Europe/MENA GM (Bruno Forget, September 2025)
    and a LATAM GM (Maria Gabriela da Rocha Oliveira, December 2025), signaling serious commercial effort to build a
    non-US pipeline—particularly important given the CEO's acknowledgment that the US domestic green-hydrogen market
    is economically challenged under current gas prices and policy conditions. The Ambient Fuels acquisition and Generate
    Capital partnership create a second commercial motion (project co-development and hydrogen-as-a-service), enabling
    EH2 to engage customers who cannot or will not build and operate their own renewable hydrogen plant.

    Customer concentration risk is the most material structural concern. Five publicly named relationships, all very
    large projects with multi-year FID-to-commissioning cycles, means that a financing failure, policy reversal, or
    FID delay at any one account could significantly affect near-term revenue. The 2026 macro context reinforces this
    concern: the ING 2026 hydrogen outlook describes green hydrogen as "stuck in the pilot phase" and expects only 1.8
    million TPA global production in 2026—less than 2% of total hydrogen use. The OBBBA's acceleration of the 45V
    construction-start deadline to January 1, 2028 compresses the window for US green hydrogen projects, particularly
    large-scale ones that struggle to secure offtake quickly. IEA data shows global electrolyzer manufacturing capacity
    exceeded 50 GW by 2025 against a small installed base, creating a supply-glut pricing environment that could erode
    EH2's competitive position if differentiation is not sustained.
