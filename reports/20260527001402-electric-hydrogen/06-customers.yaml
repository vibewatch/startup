- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver or risk factor
  - Type
  - Current status
  - Impact
  - Diligence path
  rows:
  - - Europe and MENA commercial expansion
    - Expansion driver
    - Bruno Forget hired as GM Europe/MENA, September 2025; Uniper project as anchor; additional German project hinted
    - Positive — EU gas prices and carbon mandates make green hydrogen more economic than US domestic market
    - Confirm pipeline of European projects beyond Uniper; assess EU RED III compliance demand
  - - Latin America commercial expansion
    - Expansion driver
    - Maria Gabriela da Rocha Oliveira hired as GM LATAM, December 2025; focus on green fertilizer and heavy industry
    - Positive optionality — Brazil has strong renewables and fertilizer import dependency
    - No named customer or project in LATAM; pipeline is speculative at current stage
  - - Ambient Fuels acquisition / project co-development model
    - Expansion driver
    - Closed May 2025; ~15 US projects across 10+ states; 600+ TPD potential; $400M Generate Capital project finance
    - Positive — enables new customer segment (hydrogen-as-a-service buyers); broadens addressable buyer universe
    - Assess Ambient pipeline conversion rate to signed customers and Generate Capital capital deployment
  - - Top-customer concentration risk
    - Concentration risk
    - Five named accounts; Infinium is the only one in commissioning; remaining four are pre-production milestones
    - High risk — delay or cancellation at any single account materially impacts near-term revenue
    - Obtain confidential customer list, backlog by MW and revenue stage, and FID probability assessment per project
  - - 45V tax credit construction deadline compression
    - Policy risk
    - OBBBA moved start-of-construction deadline from 2033 to January 1, 2028; five-year compression creates urgency
    - Mixed — accelerates US projects that can move quickly; creates FID-failure risk for large projects still in FEED
    - Monitor which named customer projects have confirmed construction-start timelines before January 2028
  - - Global electrolyzer oversupply
    - Competitive risk
    - "IEA: >50 GW manufacturing capacity vs ~2 GW installed at end-2024; Cummins exited electrolyzer commercial efforts in 2025"
    - High risk — pricing pressure and alternative-supplier availability undermine EH2's differentiation argument
    - Track customer selection decisions; assess whether EH2 wins through cost or total-cost-of-project story
