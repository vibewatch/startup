tables:
- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Rule / license / case
  - Jurisdiction
  - Status (as of May 2026)
  - Likelihood of adverse outcome
  - Severity to EH2
  - Mitigation
  - Residual exposure
  - Diligence path
  enumerationScope:
    coverage: partial
    basis: Rows cover confirmed regulatory and policy risks identifiable from public sources; not a legal opinion on every
      applicable regulation.
  rows:
  - - 45V hydrogen tax credit construction-start deadline (OBBBA Jan 2028 cutoff)
    - U.S. federal
    - Enacted — construction must start by January 1 2028; prior deadline was January 2033
    - Already occurred — policy enacted
    - "Critical: compresses timeline for all pending U.S. FIDs by 5 years"
    - European pipeline diversification; expediting Synergen/HIF pre-FEED-to-FEED conversion
    - High — any U.S. project that cannot break ground by end-2027 loses 45V eligibility
    - Confirm which EH2 pipeline projects have binding construction start commitments before Jan 2028
  - - H2Hubs DOE funding review (4 of 7 hubs at risk of reduction)
    - U.S. federal / DOE
    - Active — DOE indicated possible reduction for 4 hubs (CA, Mid-Atlantic, PNW, Midwest) representing ~60% of $7B
    - High — policy already in motion under current administration
    - "Moderate: EH2's named projects (HIF, Synergen) are not directly hub-funded, but hub sentiment affects sector FIDs"
    - HIF and Synergen projects are export-oriented (fuels to Europe); reduce exposure to domestic demand policy
    - Moderate — broad investor-confidence chilling effect on U.S. H2 sector
    - Confirm EH2 projects' direct exposure or non-exposure to H2Hub funding obligations
  - - European RED III hydrogen quota compliance (EU mandated hydrogen use by industry)
    - EU / member states
    - Active — RED III mandates renewable hydrogen use in industry; enforcement depends on member state transposition
    - "Low: regulation favors EH2's target market"
    - "Positive: creates mandatory demand for European projects (Uniper, future pipeline)"
    - Localization of supply chain to meet content requirements
    - Low residual legal risk; execution risk from supply-chain localization is separate
    - Verify Uniper Green Wilhelmshaven satisfies RED III and European Hydrogen Bank criteria
  - - Hydrogen safety and process permitting (NFPA 2, ATEX, PSSR)
    - U.S. and EU
    - Ongoing — Pioneer and Roadrunner demonstrate prior permitting; European deployments require EU Machinery Directive,
      ATEX, PED compliance
    - Low for U.S. (prior permits obtained); medium for EU first deployment
    - "Moderate: permitting delay or design modification requirement for European plants"
    - Modular factory-tested design reduces site-specific permitting risk; DNV validation supports safety case
    - Moderate — first European commercial plant permitting path not publicly confirmed
    - Obtain copies of Roadrunner environmental and H2 safety permits; request Uniper project permitting status
  - - Export-control / domestic content (IRA domestic content, tariffs on Chinese inputs)
    - U.S. federal / customs
    - Active — IRA domestic content rules apply; tariffs on Chinese electrolyzer components and materials in effect
    - "Medium: EH2 must maintain U.S.-manufactured claims to preserve domestic-content advantages"
    - "Moderate: if titanium or PGM supply chains rely on sanctioned or tariff-affected imports, cost structure and eligibility\
      \ are affected"
    - Devens MA stack manufacturing and Texas skid fabrication support domestic-content narrative
    - Moderate — supply chain transparency below component level is unverified
    - Request full bill-of-materials domestic-content audit and tariff exposure analysis
  notes: Risk ratings are analyst estimates based on policy and market signals as of Q2 2025; legislative outcomes may shift
    ratings materially.
