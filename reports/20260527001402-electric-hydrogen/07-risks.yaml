    - Critical — single first-plant deployment
    - Infinium financing collapses; IAG SAF offtake agreement falls through; project abandoned
    - Critical — failure of Roadrunner as a project would damage EH2's bankability across all follow-on customers
    - Infinium backed by Brookfield AM and Breakthrough Energy Catalyst; 10-year IAG SAF offtake in place
    - Moderate — project-sponsor concentration on one first-of-kind plant
  - - European power systems supplier
    - Ingeteam (Spain)
    - Power electronics and systems technology for European HYPRPlant deployments
    - Medium — European deployments appear to rely on Ingeteam power systems per reference in EH2 announcements
    - Ingeteam supply disruption or exclusivity conflict delays European plant delivery
    - Moderate — affects timeline for Uniper and future European projects
    - No exclusivity or fallback disclosed; relationship mentioned in press release only
    - Medium — supply chain transparency gap for Europe power systems
  - - Project developer / FID gatekeeper
    - Synergen Green Energy (Houston, founded 2022)
    - Project sponsor for 240 MW ammonia FEED; FID targeted 2026
    - High — youngest and least-proven sponsor in EH2's pipeline
    - Synergen fails to secure offtake, financing, or permitting; FID misses 2026 target
    - High — represents EH2's largest single U.S. project by MW in the known pipeline
    - Synergen has Tanti family renewable energy heritage (30+ years); project economics require sub-$1,000/kW TIC
    - High — developer maturity risk for a 2022 startup with a $1B+ project
  notes: Partner revenue concentration estimates derived from public contract disclosures; undisclosed offtake terms may alter
    percentages.
- id: TR004
  title: People / execution risk register
  columns:
  - Role / function
  - Dependency or gap
  - Likelihood
  - Severity
  - Mitigation
  - Diligence path
  rows:
  - - CEO / co-founder (Raffi Garabedian)
    - Primary public face, strategic vision, and investor/customer relationship anchor; no identified COO-level backup
    - Low — no adverse signals
    - Critical — departure would create customer and investor uncertainty during critical scale-up
    - Founder-led culture is an asset at this stage; board and executive team being built out
    - Request succession plan, board composition, and depth of executive bench
  - - European commercial leadership (Bruno Forget, GM Europe/MENA, hired Sept 2025)
    - New hire; no track record within EH2; prior roles at Air Liquide, Cummins, Plug Power
    - Low-medium — greenfield role in a new geography
    - High — European revenue track entirely depends on this hire's ability to execute pipeline
    - Experienced hydrogen executive with 20+ years across the value chain
    - Request European pipeline status and early commercial progress metrics
  - - LatAm commercial leadership (da Rocha Oliveira, GM LatAm, hired Dec 2025)
    - Very new hire; LatAm market entry still in earliest stage; prior Shell, First Solar, Bloomberg NEF background
    - Low — at very early stage, departure has limited near-term impact
    - Low-medium — LatAm revenue not expected in 2026–2027 horizon; mainly strategic optionality
    - Strong sector and regional background; first local hydrogen manufacturer relationships being built
    - Monitor LatAm pipeline build-out; limited near-term diligence urgency
  - - Project-finance and development team (Jacob Susman, head of project development, ex-Ambient Fuels CEO)
    - Acquired capability; only one named leader for this function; deep project-development knowledge embedded in one person
    - Low-medium — integration risk post-Ambient Fuels acquisition
    - High — loss of Susman would severely impair the Generate Capital project co-development pipeline
    - Acquisition announced September 2025 (closed May 2025); team transition underway
    - Confirm retention arrangements for Susman and Ambient Fuels development team
  - - Manufacturing quality and scale-up leadership
    - No named Chief Manufacturing Officer or VP Manufacturing publicly identified
    - Medium — 1.2 GW/year gigafactory ramp requires deep manufacturing management
    - Moderate — quality failures at Devens would cascade into all plant deliveries
    - DNV validated manufacturing quality; EH2 uses end-of-line testing of every stack
    - Request manufacturing leadership biography and Devens quality-management certifications (ISO 9001 etc.)
  notes: Dilution projections assume linear growth; actual terms depend on market conditions and investor preferences at time
    of raise.
- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold or event
  - Action implication
  rows:
  - - Roadrunner first-plant execution
    - Commissioning completion date and 30/90-day performance data versus guaranteed specs
    - Any availability <85% or hydrogen purity failure in first 90 days post-commissioning
    - Stop follow-on financing until root-cause resolved; all lender bankability assessment paused
  - - U.S. project FID freeze
    - Synergen 2026 FID announcement or formal FID deferral announcement
    - Synergen FID does not occur by December 31 2026 AND HIF also provides no engineering-contract milestone
    - Thesis-break on U.S. demand track; recalibrate to Europe-only revenue model
  - - Capital runway
    - Any new equity raise or credit facility amendment; executive comments on cash runway
    - Down-round equity or credit-facility waiver requested before Roadrunner performance data published
    - Evaluate whether pre-revenue burn exceeds plan; consider dilution risk and financial health
  - - 45V policy risk
    - Congressional action on IRA clean energy provisions or executive-branch enforcement interpretation
    - Additional restriction or repeal of 45V credit in 2026 legislation
    - Full re-underwriting of U.S. project pipeline viability; European strategy becomes primary thesis
  - - PGM supply or pricing shock
    - Iridium spot price (London fix); any EH2 public commentary on materials cost
    - Iridium price above $8,000/troy oz for 90+ days or confirmed supply-allocation constraint from Heraeus or Johnson Matthey
    - Request immediate procurement contract disclosure; evaluate stack-cost impact on project economics
  - - Competitor bankability event
    - Nel, ITM, Plug quarterly order intake and backlog disclosures; any major Western OEM insolvency or restructuring
    - Any investment-grade Western PEM OEM files for insolvency or receives government rescue financing
    - Sector-level signal that demand destruction is structural; re-evaluate timeline for all hydrogen thesis
  - - European supply-chain localization failure
    - EH2 press release announcing first European fabrication partner; Uniper pre-FEED completion announcement
    - No named European fabrication partner by Q4 2026 and Uniper project stalls in pre-FEED
    - European revenue track at risk; thesis must rely on LatAm and U.S. pipeline recovery
  - - Customer-concentration implosion
    - Public announcement of project cancellation by Infinium, HIF, Synergen, or Uniper
    - Any named flagship project publicly cancels or announces indefinite deferral
    - Revenue pipeline concentration creates acute near-term revenue gap; seek confirmed pipeline diversification evidence
  notes: Kill thresholds are analyst-defined; actual board trigger levels are not publicly disclosed.
