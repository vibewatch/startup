- id: TR002
  title: Operational / quality / security risk register
  columns:
  - Failure mode
  - Likelihood
  - Severity
  - Mitigation maturity
  - Residual exposure
  - Unresolved gap
  rows:
  - - First commercial 100 MW HYPRPlant (Roadrunner) operational underperformance or delayed commissioning
    - Medium — first-of-kind; Pioneer proved 10 MW stack but not 100 MW integrated plant full-cycle
    - Critical — would halt bankability of all follow-on EH2 projects immediately
    - Developing — DNV validated design, Pioneer proved stack, skids pre-tested; no post-commissioning data yet
    - High — single data point; no performance history at commercial scale
    - Independent performance audit post-commissioning; warranty claim history
  - - PEM stack degradation exceeding guarantee beyond year 1–2 of operation
    - Medium — industry-wide issue; EH2 has not publicly disclosed expected degradation curve or guarantee terms
    - High — warranty obligations are undefined in public record; financial exposure is unquantified
    - Partial — DOE targets provide benchmark; EH2 claims industry-leading performance but has not published data
    - High — no public stack lifetime or degradation data for EH2's specific membrane and catalyst system
    - Full warranty and performance-guarantee term disclosure; stack lifetime test data
  - - Iridium or PGM supply shortage or price spike
    - Medium — global iridium supply ~7 mt/year; historically volatile; supply dominated by South Africa and Russia
    - Moderate — cost pressure and potential stack delivery delays; EH2 claims lower iridium use
    - Low — no public procurement contract, hedging, or supply chain disclosure
    - High — undisclosed supply chain creates unquantifiable cost risk
    - Iridium procurement contract terms, hedging approach, and usage per MW disclosure
  - - Titan Production Equipment fabrication failure or counterparty distress
    - Low-medium — PE-backed single-source fabricator (Castle Harlan); 350 peak employees in 2024
    - High — sole-source Texas skid fabricator; loss of Titan would halt all U.S. plant fabrication
    - Partial — Titan deployed Texas O&G expertise and completed Roadrunner skids successfully
    - Moderate — no publicly disclosed fallback fabrication partner or dual-source strategy
    - Titan financial health check; identify backup fabrication alternatives
  - - Weitz EPC quality or cost overrun at Roadrunner
    - Low-medium — large general contractor with industrial experience but limited hydrogen-specific track record
    - Moderate — EPC failure delays commissioning and imposes cost overruns; EH2 VP of Deployment on site
    - Partial — Weitz selected for industrial expertise; modular skids reduce site work versus stick-built
    - Moderate — first commissioning milestone by a specific EPC team in hydrogen
    - Request commissioning schedule, current budget status, and Weitz hydrogen experience references
  - - European supply-chain localization execution failure
    - Medium — CEO acknowledged need to move supply chain to Europe; no European fabrication partner disclosed
    - Moderate-High — failure to localize delays European project revenue and threatens Uniper delivery timeline
    - Low — strategy announced but not yet executed; no named European fabrication partner
    - High — unexecuted strategic dependency for entire European revenue track
    - European fabrication partner qualification status and Uniper pre-FEED milestone timeline
  notes: Stack cost benchmarks sourced from NEL and ITM annual reports; EH2-specific cost structure is proprietary and may
    differ.
