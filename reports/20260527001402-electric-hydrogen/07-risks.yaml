- id: operational-and-technical-risk
  title: Operational, Technical, and Supply-Chain Risk
  body: 'Electric Hydrogen''s single largest operational risk is that its commercial technology exists at

    first-of-kind scale. The first 100 MW HYPRPlant is still in commissioning at Infinium''s Project

    Roadrunner as of early 2026. No full commercial-scale HYPRPlant has completed a full operating

    cycle, demonstrated long-duration performance, or been measured against its warranty and performance

    guarantees in the field. DNV''s comprehensive technical diligence — covering stack technology, plant

    design, performance, reliability, manufacturing, quality, and commercial assurances — concluded

    that HYPRPlant is "highly competitive" and can be "highly reliable," and the Pioneer plant

    (operating since January 2024 at one-tenth scale) validated stack performance. However, DNV''s

    work was largely prospective, not a post-commissioning performance audit. Roadrunner commissioning

    is the first real proof point, and any material underperformance — degradation rates, availability,

    water purity requirements, power conversion losses — would reset the bankability narrative for

    all follow-on projects.


    Supply-chain concentration risk is substantial. PEM electrolyzers depend on platinum-group metal

    (PGM) catalysts, most critically iridium at the anode. Global annual iridium production is

    approximately 7 metric tons; at 2022-era loading rates of 200–300 g/MW for leading PEM OEMs,

    the entire annual supply would support only 23–35 GW of PEM deployment per year. EH2 has publicly

    claimed significantly lower iridium usage than competitors, which, if accurate, reduces but does

    not eliminate this bottleneck. The company does not publicly disclose its iridium consumption

    per MW, its procurement arrangements, or its hedging strategy for PGM prices.


    Beyond PGMs, HYPRPlant uses titanium components and proton-exchange membranes whose principal

    suppliers are concentrated. Titanium is dominated by Russian, Chinese, and Japanese supply chains;

    EH2''s U.S. manufacturing model provides some insulation but does not guarantee domestic sourcing

    for all specialty materials. Nafion-type membranes are largely supplied by Chemours (DuPont

    heritage), creating single-supplier dependency at a critical stack component level.


    Manufacturing operational risk centers on the Devens, MA gigafactory and the Titan Production

    Equipment facility in Columbus, TX. Titan is PE-backed (Castle Harlan) and deployed up to 350

    people in 2024 across its Texas facility. Single-source fabrication from one Texas partner creates

    a capacity bottleneck and counterparty risk if Titan encounters financial stress, workforce

    issues, or capacity conflicts with O&G sector demand. The Weitz Company, selected as EPC for

    Roadrunner installation, is a large general contractor with industrial experience, but hydrogen-

    specific commissioning expertise on 100 MW integrated PEM systems is still thin across the entire

    industry; execution slippage or commissioning failures at Roadrunner would be visible to all

    prospective buyers.


    Reliability and degradation risk is inherent to PEM at scale. PEM stacks degrade over time;

    performance guarantees and warranty obligations carry financial exposure EH2 does not publicly

    size. Nel''s TRIR of 6.1 and ITM''s "safety at the heart of everything we do" claims both reflect

    the industry-wide awareness that hydrogen processing is a process-safety environment, not a

    conventional electronics manufacturing floor. Recalls or safety incidents at any large PEM

    facility — including those not built by EH2 — could trigger regulatory scrutiny or insurance

    premium increases that affect the entire sector.


    A European supply-chain localization burden was publicly confirmed by the CEO: delivering

    HYPRPlant to European customers requires shifting supply chain partners to Europe. This adds

    a ramp-up phase, quality-management complexity, and execution risk to EH2''s European growth

    narrative, particularly given that no European commercial plant has yet been fabricated under

    this model.

    '
