- id: financial-and-model-risk
  title: Financial, Model, and Capital-Adequacy Risk
  body: 'Electric Hydrogen''s financial risk profile is that of a pre-revenue capital-intensive industrial

    manufacturer with a long and uncertain sales cycle. The company does not publicly disclose revenue,

    gross margin, cash burn, backlog conversion metrics, or inventory levels. All known financing

    through May 2026 totals more than $750 million, comprising equity rounds, a $100 million corporate

    credit facility (led by HSBC, with JPMorgan, Stifel, and Hercules Capital), $65 million in DOE

    support ($50 million equipment financing from Trinity Capital plus approximately $15 million in

    grants), and up to $400 million in project finance from Generate Capital (off-balance-sheet for

    specific projects). The credit facility was announced as supporting manufacturing and deployment,

    and the DOE equipment financing was for the Devens gigafactory ramp.


    The core financial risk is runway adequacy relative to project-conversion timelines. EH2''s sales

    cycle from first selection to recognized equipment revenue is publicly observable at 24–36+ months:

    Infinium selection was disclosed in May 2025, first plant shipped in early 2026, commissioning

    ongoing. Synergen FEED signed December 2025 with FID targeted 2026 and operations targeted end

    2028 — implying equipment-revenue recognition at earliest 2027–2028. Uniper pre-FEED started

    October 2024 with no FID date, implying potential equipment revenue in 2028 at earliest. If

    manufacturing costs run through 2026 and 2027 with limited equipment-revenue recognition,

    the company will require additional financing.


    Capital intensity of the manufacturing model is high. Running a 1.2 GW/year gigafactory in

    Devens with inventory, labor, and tooling costs — without disclosed order backlog binding multiple

    customers — creates working-capital risk. Comparator data from Nel (operating loss NOK 1,365M on

    revenue NOK 963M in 2025) and ITM (EBITDA loss £33M on revenue £26M, cash £207M) illustrates

    that even operationally credible PEM companies carry substantial negative margins during scale-up.

    EH2''s cost structure is not public, but it is unlikely to be materially better than ITM''s until

    Devens reaches significant throughput.


    The sector-wide context amplifies model risk. The ING analysis for 2026 notes that U.S. government

    support for clean hydrogen was effectively reduced from approximately $90 billion to $28 billion

    under the OBBBA. The E2 clean energy tracking showed nearly $35 billion in clean energy investment

    cancelled in 2025, the worst year since 2022. Global manufacturing capacity for electrolyzers

    exceeds 50 GW per year against roughly 2 GW deployed globally as of end-2024; this structural

    oversupply will pressure pricing and margin for every OEM in the sector. PV Magazine analysis

    shows Chinese PEM/AWE systems offered at roughly $303/kW in 2021 while Western alternatives ran

    at $1,200–$1,400/kW; EH2''s total-installed-cost-reduction narrative must hold against increasing

    Chinese export ambition and the 25–30% export premium that historically applied to Chinese

    electrolyzers may compress under future trade dynamics.


    Working-capital risk from the project-finance model is significant. EH2 needs project-level FIDs

    to recognize equipment revenue, but FIDs depend on offtake agreements, renewable power contracts,

    permitting, and lender diligence cycles that are outside EH2''s control. A prolonged FID freeze —

    whether from 45V uncertainty, offtake market weakness, or bank-level hydrogen risk aversion —

    would directly defer EH2''s equipment revenue.


    No evidence of fraud, earnings mismanagement, or unauthorized capital deployment has been

    identified. EH2 is a private company with no SEC filing obligations, which means financial

    controls cannot be independently verified from public sources.

    '
