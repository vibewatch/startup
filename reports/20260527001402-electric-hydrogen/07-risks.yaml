  claims:
  - id: CR001
    statement: The OBBBA moved the 45V hydrogen tax credit construction-start deadline from January 1, 2033 to January 1,
      2028, compressing the window for large-scale green hydrogen projects by five years.
    type: third-party-reported
    topic: regulatory-risk
    sourceRefs:
    - SR002
    - SR024
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR001
    - QR003
  - id: CR002
    statement: The DOE confirmed it was considering reducing or eliminating funding for four of seven originally selected
      H2Hubs — California, Mid-Atlantic, Pacific Northwest, and Midwest — representing nearly 60% of the $7 billion federal
      commitment.
    type: third-party-reported
    topic: regulatory-risk
    sourceRefs:
    - SR002
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR002
  - id: CR003
    statement: The OBBBA's 45V deadline compression is expected to divert green hydrogen investment to Europe and Asia, which
      have more stable incentive frameworks, a shift explicitly acknowledged by industry groups and consistent with EH2 CEO
      comments about targeting Europe.
    type: inferred
    topic: regulatory-risk
    sourceRefs:
    - SR001
    - SR002
    - SR024
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR003
  - id: CR004
    statement: EH2 CEO Raffi Garabedian publicly acknowledged in 2025 that the company was looking at "another year and a
      half of muted activity" from the market, and that green hydrogen in the U.S. is roughly three times more expensive than
      gray hydrogen even with 45V credits.
    type: third-party-reported
    topic: demand-risk
    sourceRefs:
    - SR001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR011
  - id: CR005
    statement: Approximately 50 green hydrogen projects were publicly cancelled globally in 2025, with ING noting the real
      number was higher because many cancellations happen silently; actual dismantling of built plants returned millions in
      government grants.
    type: third-party-reported
    topic: demand-risk
    sourceRefs:
    - SR024
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR011
  - id: CR006
    statement: The OBBBA simultaneously strengthened 45Q carbon-sequestration credits, tilting the competitive balance toward
      blue hydrogen; ING projects over 90% of clean hydrogen in 2030 will be blue, not green, narrowing EH2's addressable
      market.
    type: third-party-reported
    topic: regulatory-risk
    sourceRefs:
