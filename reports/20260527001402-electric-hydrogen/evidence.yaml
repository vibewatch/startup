evidenceGaps:
  - id: EGO001
    topic: Equity round history and sizes below Series C
    type: private-evidence-only
    severity: material
    description: >-
      Pre-Series C round names, sizes, and closing dates have never been publicly disclosed by EH2. Only the combined
      post-Series C total of >$600M is stated in the Series C press release.
    diligencePath: Request cap-table summary and Series A/B closing documents in due diligence.
  - id: EGO002
    topic: Current post-Series C valuation
    type: private-evidence-only
    severity: material
    description: >-
      No equity event has been publicly announced since October 2023. The ~$1B valuation is the last publicly attached
      mark. Any 409A or secondary transaction data would be private.
    diligencePath: Request most recent 409A valuation report and any secondary transaction documentation.
  - id: EGO003
    topic: Revenue, run-rate, and gross margin
    type: private-evidence-only
    severity: blocking
    description: >-
      EH2 is private and has disclosed no revenue figures, ASP per MW, margin structure, or recognized-revenue policy.
      These are critical for valuation chapter.
    diligencePath: Request audited financial statements and management accounts for 2023-2025.
  - id: EGO004
    topic: Updated customer backlog or pipeline beyond 5 GW (2023 figure)
    type: stale
    severity: material
    description: >-
      The last backlog disclosure was ">5 GW reserved" in October 2023. No subsequent pipeline update has been issued
      despite multiple named 2025 wins.
    diligencePath: Request current order book, signed contracts vs. LOIs, and cancellation provisions.
  - id: EGO005
    topic: Board composition and investor governance rights (TO002)
    type: private-evidence-only
    severity: material
    description: >-
      EH2 does not disclose board members, investor board seats, or protective provisions in its public materials. The
      breadth and strategic diversity of the Series C syndicate makes governance structure a material diligence item.
    diligencePath: Request certificate of incorporation, investor rights agreement, and voting agreement.
    relatedTableRefs:
      - TO002
  - id: EGO006
    topic: Investor ownership percentages and pre-Series-C cap table (TO003)
    type: private-evidence-only
    severity: material
    description: >-
      Ownership stakes, preference stack, and pro-rata rights are not disclosed publicly. Only investor names are known
      from press releases; no equity percentages or liquidation preferences have been shared.
    diligencePath: Request cap-table summary and Series A/B closing documents in due diligence.
    relatedTableRefs:
      - TO003
  - id: EGO007
    topic: Pre-Series-C financing rounds, dates, and round sizes (TO004)
    type: private-evidence-only
    severity: moderate
    description: >-
      Series A and B round names, sizes, and closing dates have never been publicly disclosed. The milestone table
      reflects only publicly verifiable events; pre-2023 financing milestones are incomplete.
    diligencePath: Request full financing history with closing dates, amounts, and lead investors from company.
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      An independent analyst estimate for the annual capex market for large-scale (≥75 MW) Western PEM electrolyzers,
      segmented from the broader clean hydrogen or electrolyzer market.
    whyItMatters: >-
      Without a credible SAM estimate, it is impossible to assess EH2's market penetration rate or evaluate whether the
      company's pipeline and factory utilization represent strong or weak market share. All sizing in TM002 relies on
      proxy lenses, not a direct market survey.
    diligencePath: >-
      Commission or identify a primary market sizing study from Hydrogen Council, BloombergNEF, or Wood Mackenzie that
      specifically sizes the Western large-scale PEM electrolyzer capex market annually through 2030. Cross-check
      against EH2's stated pipeline.
    relatedQuestionRefs:
      - QM005
      - QM006
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-segmentation
    missingEvidence: >-
      Confirmed conversion status of the AES Corporation 1 GW framework supply agreement into firm project procurement
      orders; no project-level milestone or FID announcement has been made since the framework was signed in October
      2023.
    whyItMatters: >-
      If the AES 1 GW framework has not progressed to any project procurement, it represents a pipeline claim that may
      be stale; understanding conversion rate of framework agreements to firm orders is critical for evaluating EH2's
      backlog quality.
    diligencePath: >-
      Request from EH2 or AES an update on the project development status of each project within the 1 GW framework,
      including whether any projects have reached pre-FEED or procurement stage.
    relatedQuestionRefs:
      - QM015
  - type: stale
    severity: minor
    topic: market-sizing
    missingEvidence: >-
      An updated EH2 customer pipeline or backlog figure; the last public disclosure was >5 GW of reservations as of
      October 2023, more than two and a half years before the run date.
    whyItMatters: >-
      Given the substantial deterioration in green hydrogen project activity in 2024–2025, the October 2023 pipeline
      figure is likely stale; without an updated figure, it is unclear how much of the 5 GW reservation has cancelled,
      been deferred, or advanced to FEED.
    diligencePath: >-
      Request a current customer pipeline update from EH2 management including FEED, pre-FEED, and reservation stages;
      cross-reference with named project announcements to identify which of the original 5 GW reservation volume remains
      active.
  - type: missing-source
    severity: minor
    topic: market-sizing
    missingEvidence: >-
      A 2025–2026 electrolyzer capex pricing benchmark from an independent source for large-scale Western PEM systems at
      75–120 MW to validate the $800–1,200/kW total installed cost range used in TM002 and FM001.
    whyItMatters: >-
      The $800–1,200/kW range is derived from the Synergen <$1,000/kW target (company claim) and the Repsol €292M/100 MW
      benchmark (European refinery context); neither is an arms-length Western PEM pricing study, creating uncertainty
      in the SOM revenue ceiling estimate.
    diligencePath: >-
      Identify or commission a 2025–2026 electrolyzer capex benchmarking study from BNEF, Lazard, or equivalent covering
      75–120 MW PEM systems in U.S. and EU markets.
  - type: private-evidence-only
    severity: material
    topic: realized-oem-pricing
    missingEvidence: >-
      Current realized ASPs, warranty pricing, service attach rates, and discount structures for EH2, Nel, ITM, nucera,
      Plug, and SOEC alternatives.
    whyItMatters: >-
      Public price opacity makes it impossible to underwrite whether EH2's claimed total-installed-cost edge survives
      actual negotiated contracts.
    diligencePath: >-
      Request current customer proposals, service-term sheets, and lender models under NDA and normalize them into a
      like-for-like total installed cost workbook.
    relatedQuestionRefs:
      - QP020
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: factory-utilization-and-backlog-conversion
    missingEvidence: Current factory-utilization, delivery conversion, and backlog-risk data for EH2 and the most relevant peer set.
    whyItMatters: >-
      Nel and ITM already show utilization pressure publicly; without comparable EH2 utilization and shipment data, it
      is hard to know whether EH2 is structurally stronger or simply earlier in the same cycle.
    diligencePath: >-
      Obtain monthly utilization, shipment cadence, backlog aging, cancellation clauses, and plant-level delivery
      schedule data from management and compare against peer public disclosures.
    relatedQuestionRefs:
      - QP024
      - QP025
    relatedTableRefs:
      - TP001
      - TP004
  - type: missing-source
    severity: material
    topic: post-feed-switching-costs
    missingEvidence: >-
      Public lender, insurer, or customer scorecards showing how hard it is to switch OEM or technology choice after
      FEED, pre-FEED, or early FID work has begun.
    whyItMatters: >-
      This chapter can infer lock-in from engineering and financing logic, but not quantify whether EH2's bankability
      advantage is enough to create durable retention.
    diligencePath: >-
      Interview project-finance lenders, EPC partners, and hydrogen insurers; collect redlined EPC or warranty packages
      from recent deals; and map exactly which approvals restart when the OEM changes.
    relatedQuestionRefs:
      - QP021
      - QP022
    relatedTableRefs:
      - TP002
      - TP004
  - type: private-evidence-only
    severity: critical
    topic: revenue-and-gross-margin
    missingEvidence: >-
      No public disclosure of recognized revenue (any period), gross margin, COGS, or unit economics exists for EH2; the
      company is private and does not file public financial statements.
    whyItMatters: >-
      Without revenue and margin data, the financial thesis rests entirely on technology differentiation and pipeline
      size; a critical investor cannot model returns without at least a data-room level of financial visibility.
    diligencePath: >-
      Request audited financial statements (income statement, balance sheet, cash-flow statement) for all years since
      founding; obtain monthly P&L for the most recent 12 months; request COGS breakdown by plant, revenue by customer,
      and gross margin bridge to target scale.
