      - QI007
      - QI024
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: critical
    topic: cash-burn-and-runway
    missingEvidence: >-
      Current cash position, monthly burn, credit-facility draw status, and runway in months are not publicly disclosed;
      the last major capital event was the 2023 Series C.
    whyItMatters: >-
      A factory ramp plus the Ambient acquisition plus multi-continent commercial operations creates material burn; if
      the runway is shorter than the timeline to first meaningful equipment-revenue recognition, an interim financing
      round may be needed.
    diligencePath: >-
      Request monthly cash position from January 2024 through the run date; confirm credit-facility available balance
      and covenant compliance; obtain a 24-month forward cash-flow model from management.
    relatedQuestionRefs:
      - QI016
      - QI017
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: backlog-and-order-book
    missingEvidence: >-
      The 5+ GW reservation figure has not been updated since October 2023; no order-book aging, FID-triggered order
      conversion, or cancellation data is public.
    whyItMatters: >-
      Reservations are not revenue; converting reservations to binding purchase orders depends on customers reaching
      FID, which requires offtake contracts, power PPAs, and project financing — all subject to the same sector
      headwinds that the CEO acknowledged.
    diligencePath: >-
      Request current pipeline segmented by stage (reservation → FEED → FID → PO); backlog aging; FID probability by
