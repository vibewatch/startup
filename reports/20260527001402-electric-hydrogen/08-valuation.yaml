- id: bull-base-bear-scenarios
  title: Bull, Base, and Bear Scenarios
  body: 'Three scenarios bracket the plausible valuation range for EH2 over a 3–5 year investment horizon.


    The bull scenario requires that the Infinium Roadrunner 100 MW plant demonstrates strong operational data in
    H1 2026 (availability >92%, output at nameplate), that Synergen and HIF both reach FID by year-end 2026,
    that policy headwinds stabilize (no further 45V tightening after OBBBA), and that EH2 books its first
    significant commercial equipment revenue by 2027. Under these conditions, a 2028–2029 financing round or
    M&A event at 8–12× projected 2028 revenue ($200–400M) would imply a $1.6–4.8B enterprise value. Return
    on a $750M entry would be approximately 2–6×.


    The base scenario assumes Infinium operational data is positive but muted (no major failures), that one of
    Synergen or HIF reaches FID in 2026–2027 while the other slips to 2027–2028, and that EH2 continues
    pre-revenue operations supported by project finance and DOE grants through 2027. A 2029 strategic transaction
    or Series D at 4–6× 2029 revenue ($50–120M) implies a $200–720M enterprise value. Return on a $750M entry
    is approximately 0.3–1×; a near-break-even or modest loss for equity investors.


    The bear scenario involves either the Infinium plant encountering significant commissioning issues that damage
    bankability, or two or more named projects slipping beyond 2028 (the OBBBA 45V window), or EH2 requiring
    a bridge financing round to sustain operations before commercial revenue. A distressed recapitalization or
    down-round in the $300–600M range implies a loss of 20–60% on a $750M entry.'
