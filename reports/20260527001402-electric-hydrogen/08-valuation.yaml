- id: recommendation-and-valuation-stance
  title: Recommendation and Valuation Stance
  body: 'The recommendation is research-more. The evidence base is sufficient to characterize the opportunity and the
    primary risks, but it is not sufficient to support an entry decision at the current $1B reference price. The central
    issue is that EH2''s valuation was set in October 2023 under assumptions—full 45V credit availability through 2033,
    sector-wide demand approaching commercial inflection, and no major policy reversal—that have since materially eroded.
    The $1B mark is stretched relative to the current operating environment.


    Confidence is medium. The technology differentiation and manufacturing scale are real, as confirmed by DNV and
    demonstrated by the Devens gigafactory ribbon cutting. The financial risks are also real and well-evidenced. What
    cannot be resolved without additional evidence is whether EH2 can convert its named project pipeline into FID-positive
    revenue events before its current financing runway is exhausted.


    Risk rating is high. The combination of no disclosed revenue, stale equity mark, compressed 45V timeline,
    sector-wide demand destruction, and concentration in fewer than five named pre-FID projects creates a high-risk
    profile even for infrastructure-growth investors.


    The valuation stance is stretched. A $1B pre-revenue mark implies investors assigned significant technology premium
    at a time when green hydrogen appeared to be approaching commercialization. That premium must now absorb OBBBA
    policy headwinds, peer-multiple compression, and the passage of 2.5 years without a new equity catalyst. A fair
    entry range for a new investor would be $600–750M conditional on confirmation of Infinium Roadrunner operating
    data and at least one additional FID by year-end 2026.'
