- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Category
  - Materiality
  - Impact on underwriting
  - Diligence path
  enumerationScope:
    coverage: exhaustive
    basis: Derived from all standard financial underwriting inputs that EH2, as a private company, has not publicly disclosed; ordered by approximate impact on valuation and investment thesis.
  rows:
  - - Revenue (recognized, period), backlog, and backlog conversion rate
    - Revenue quality
    - Critical
    - Without recognized revenue or a credible revenue-run-rate, all DCF, comparables, and milestones-to-revenue models are speculative
    - Request audited revenue by year since founding; backlog aging schedule; cancellation and modification history; FID-triggered milestone schedule for all active contracts
  - - Gross margin by revenue stream (equipment, services, development)
    - Margin path
    - Critical
    - Public peers (Nel, ITM) imply deeply negative gross margin at sub-scale; without EH2 actuals, the base case must be materially negative; any positive-margin claim must be verified
    - Request COGS and gross-profit by revenue type; factory overhead absorption schedule; margin bridge from current run-rate to target scale
  - - Cash on hand, monthly burn, and runway in months
    - Capital adequacy
    - Critical
    - Series C was 2023; factory has been ramping since 2024; burn is material; current liquidity determines whether a new round is needed before projects reach FID
    - Request latest quarterly cash position; monthly burn by cost category; 12-month forward cash flow projection; draw status on credit facility
  - - Factory utilization at Devens (% of 1.2 GW/year nameplate)
    - Operating leverage
    - High
    - Factory cost structure is substantially fixed; low utilization amplifies per-unit cost and widens gross-margin gap; utilization below ~50% likely implies significant negative gross margin
    - Request monthly stack production volume, shipment cadence, and utilization versus nameplate for all months since factory opening in 2024
  - - ASP per MW and order economics (contract values, payment milestones, LD provisions)
    - Revenue model
    - High
    - All revenue forecasting requires a unit-economics anchor; without ASP, any model is unconstrained
    - Request contract summaries for all signed purchase orders including MW value, total contract value, payment milestone schedule, and liquidated damages or cancellation provisions
  - - Project development pipeline stage-gate and probability-weighted funnel
    - GTM efficiency
    - Medium
    - Post-Ambient, EH2 has two revenue mechanisms; the project-development funnel is entirely opaque with only a "15 projects across 10+ U.S. states" description available
    - Request project pipeline by stage (prospecting, feasibility, FEED, pre-FID, FID), MW, geography, expected FID date, customer, and probability weighting
  notes: >-
    All gaps listed above are standard financial-diligence requests for a pre-IPO industrial company.
    Their absence from public sources is expected given EH2's private-company status, but they
    collectively represent the minimum data required to underwrite the company's current equity
    valuation or structure a new financing instrument. The Generate Capital $400M should be
    analyzed as a project-finance facility and modeled separately from EH2's corporate liquidity.
  claimRefs:
  - CI037
  - CI038
  - CI039
  - CI040
  - CI041
  - CI043
  - CI044

figures:
- id: FI001
  title: Revenue model bridge
  type: flow
  layout: wide
  summary: >-
    How customer project activity converts into EH2 revenue and gross profit. EH2 participates
    at the equipment procurement and commissioning stage; recognized revenue is conditional on
    FID and milestone payments. The project-development channel (post-Ambient) adds a second
    conversion path that bypasses the customer-project-finance dependency by originating the
    project itself.
  data:
    nodes:
    - id: customer-project
      label: "Customer project (developer: Infinium / HIF / Synergen / Uniper / AES)"
    - id: feed-prefeed
      label: "FEED / pre-FEED engagement (EH2 engineering service; small/no revenue)"
    - id: fid-trigger
      label: "Customer reaches FID (power PPA + offtake + project finance close)"
    - id: equipment-order
      label: "Binding HYPRPlant purchase order triggered (EH2 milestone billing begins)"
    - id: manufacturing-delivery
      label: "Stack manufacturing (Devens) + skid fabrication (Texas) + FAT + shipment"
    - id: commissioning-handover
      label: "Field commissioning + plant handover (final milestone payment)"
    - id: revenue-gp
      label: "EH2 recognizes equipment and commissioning revenue / gross profit"
    - id: ambient-path
      label: "Project co-development path (EH2 originates + finances via Generate Capital)"
    - id: dev-fee
      label: "Development fee / asset sale / equity carry → separate revenue stream"
    edges:
    - from: customer-project
      to: feed-prefeed
      label: "Selection / FEED award"
    - from: feed-prefeed
      to: fid-trigger
      label: "Engineering de-risking (12–36+ months)"
    - from: fid-trigger
      to: equipment-order
      label: "FID triggers binding order"
    - from: equipment-order
      to: manufacturing-delivery
      label: "Manufacturing ramp; milestone billing"
    - from: manufacturing-delivery
      to: commissioning-handover
      label: "Plant delivery and site assembly"
    - from: commissioning-handover
      to: revenue-gp
      label: "Final acceptance; remaining milestone payment"
    - from: ambient-path
      to: dev-fee
      label: "Project origination → capital deployment → fee / carry"
  approximationNotes: >-
    The FID-trigger node is where most pipeline risk concentrates: policy compression (45V
    deadline), offtake economics, and project finance availability can all stall conversion.
    No recognized revenue data is available to calibrate conversion timing.
  claimRefs:
  - CI001
  - CI006
  - CI007
  - CI009
  - CI034
  - CI035

- id: FI002
  title: Unit economics bridge
  type: flow
  layout: wide
  summary: >-
    Qualitative cost-stack nodes for a single 100 MW HYPRPlant from manufacturing inputs to
    delivered gross profit. All margin nodes are marked as unavailable; peer-company data from
    Nel and ITM provide the only public proxies, both of which imply deeply negative near-term
    economics at sub-scale utilization.
  data:
    nodes:
    - id: direct-materials
      label: "Direct materials: PGM catalyst, MEA, titanium components, balance-of-plant materials (cost unknown)"
    - id: stack-manufacturing
      label: "Devens stack manufacturing: labor, facility overhead, testing (cost unknown; ~1.2 GW/year nameplate)"
    - id: skid-fabrication
      label: "Texas skid fabrication: process modules, power conversion, water treatment (cost unknown)"
    - id: logistics-commissioning
      label: "Logistics, field assembly, and commissioning labor (cost unknown)"
    - id: warranty-service-provision
      label: "Warranty provision and post-delivery service obligation (cost unknown)"
    - id: cogs-total
      label: "Total COGS per plant (not disclosed; peer proxies: Nel and ITM deeply negative; EH2 null)"
    - id: asp
      label: "Realized ASP per 100 MW plant (not disclosed; proxy: Synergen sub-$1,000/kW TIC claim)"
    - id: gross-profit
      label: "Gross profit per plant (not disclosed; peers strongly imply negative at current scale)"
    edges:
    - from: direct-materials
      to: cogs-total
      label: "Materials cost-of-sales"
    - from: stack-manufacturing
      to: cogs-total
      label: "Manufacturing overhead absorption"
    - from: skid-fabrication
      to: cogs-total
      label: "Fabrication and sub-assembly"
    - from: logistics-commissioning
      to: cogs-total
      label: "Field cost"
    - from: warranty-service-provision
      to: cogs-total
      label: "Warranty accrual"
    - from: asp
      to: gross-profit
      label: "Revenue minus COGS"
    - from: cogs-total
      to: gross-profit
      label: "Cost deducted"
  approximationNotes: >-
    All dollar values in this bridge are null; only structural cost flow is known from public
    sources. Nel's 2025 operating loss of NOK 1,365M on NOK 963M revenue and ITM's £33M EBITDA
    loss on £26M revenue are the best available proxies for a similar-stage PEM OEM, both showing
    deeply negative near-term margins. EH2's manufacturing-scale ambition and Devens capacity would
    — if fully utilized — imply meaningfully different unit economics, but utilization data is not public.
