- id: cost-structure-and-unit-economics
  title: Cost Structure, Gross Margin Drivers, and Unit Economics
  body: |
    Electric Hydrogen's cost structure is capital-intensive and asset-heavy at every stage of the
    value chain. The primary cost centers are stack manufacturing at the Devens gigafactory
    (facility capital, manufacturing labor, direct materials including platinum-group metal catalysts,
    membrane electrode assemblies, and titanium components), process-module fabrication in Texas
    (contracted with local O&G-sector fabrication partners who bring skid-building expertise),
    power-conversion and balance-of-plant systems integration, end-of-line stack testing unique to
    EH2's manufacturing model, and field commissioning labor. Warranty and service obligations
    after plant delivery add a further liability that may be classified as deferred cost or
    provision on the balance sheet, depending on recognition policy.

    EH2 does not publicly disclose gross margin, manufacturing cost per MW, cost of goods sold,
    or operating expenses. The company claims HYPRPlant reduces total installed project costs by
    up to 60% versus alternative electrolyzer solutions and targets cost parity with fossil-fuel
    hydrogen by approximately $1.50/kg in high-renewable states by 2030 and $1/kg by 2031 (the DOE
    Hydrogen Shot target). These are levelized cost of hydrogen (LCOH) targets for the customer,
    not gross-margin disclosures for EH2.

    Public comparable peers confirm that large-scale PEM electrolyzer manufacturers currently
    operate at negative or thin gross margins while scaling. Nel reported 2025 revenue of NOK 963
    million with an operating loss of NOK 1,365 million — a deeply negative margin driven by
    low utilization, project cancellations, and a fixed manufacturing cost base. ITM Power reported
    FY2025 revenue of £26.0 million with an adjusted EBITDA loss of £33.0 million, including
    approximately £9.6 million of under-absorbed factory costs and £13.2 million of inventory
    write-offs. Plug Power shipped more than 185 MW of electrolyzers in 2025 — 203% year-over-year
    growth — yet remained loss-making, with strategic repositioning under Project Quantum Leap.
    Topsoe reported DKK 8,197 million in 2025 revenue but noted that low-carbon project
    postponements and market uncertainty slowed SOEC order conversion.

    These comparables collectively imply that an early-stage PEM OEM at sub-full-utilization likely
    carries negative gross margins until manufacturing throughput reaches a meaningful fraction of
    nameplate capacity. EH2's 1.2 GW/year Devens factory opened in 2024; the first commercial
    HYPRPlant has shipped to Infinium but is still in commissioning as of 2026. A factory running at
    a fraction of nameplate capacity will absorb fixed overhead over a small revenue base, producing
    substantial negative gross margins in the near term. Factory utilization percentage is not
    publicly disclosed.

    Working capital dynamics are adverse for a project OEM at this stage. Capital equipment
    customers at large hydrogen projects typically pay milestones tied to engineering completion,
    factory-acceptance testing, and commissioning — meaning EH2 must front-load manufacturing
    costs before milestone payments arrive. Inventory of partially fabricated stacks, skids awaiting
    customer-order confirmation, and in-process engineering contracts all represent working-capital
    drags. The offsite fabrication model (stacks in Massachusetts, skids in Texas) adds geographic
    logistics costs.

    Service and warranty obligations are standard for industrial OEM equipment but their scale at
    EH2 is unknown. The DNV technical due-diligence review published in July 2025 confirmed that
    HYPRPlant is "highly reliable" and "highly competitive on cost and current commercial
    guarantees," implying that warranty terms are market-standard and bankable — but the financial
    provisioning or premium structure for post-delivery service is not publicly disclosed.
