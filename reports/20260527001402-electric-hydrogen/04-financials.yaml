- id: FI003
  title: Financial estimate range
  type: range
  layout: standard
  summary: >-
    Source-backed estimate ranges for key financial inputs. All EH2-specific values are estimated
    from public information or inferred from peer benchmarks; they are explicitly labeled
    "estimated" or "unavailable" and must be replaced with management-provided actuals in any
    formal underwriting model.
  data:
    items:
    - label: "Monthly operating burn — EH2 (estimated from headcount and factory peers)"
      low: 8.0
      mid: 15.0
      high: 22.0
      unit: "USD million/month"
      note: "Estimated from 300+ employee base, Devens factory operations, Texas fabrication, and multi-continent commercial teams. Peer PEM OEMs (Nel, ITM) with similar headcount have shown comparable burn levels. No public EH2 disclosure. Wide range reflects uncertainty."
    - label: "Implied gross margin per HYPRPlant — EH2 near-term (peer-proxy range)"
      low: -60.0
      mid: -30.0
      high: -10.0
      unit: "% of revenue"
      note: "Derived from Nel 2025 operating loss / revenue ratio (~-142%) and ITM EBITDA loss / revenue ratio (~-127%); EH2 likely in better position given newer factory and standardized-plant focus, but sub-scale utilization implies significantly negative near-term gross margin. No EH2 disclosure."
    - label: "Cumulative equity capital available at time of Series C close (Oct 2023)"
      low: 590.0
      mid: 610.0
      high: 630.0
      unit: "USD million"
      note: "EH2 stated 'over $600M raised' at Series C close; Series C was $380M. Pre-Series C equity estimated at $220-250M from prior rounds (Series A, B). Narrow range because EH2's own press release anchors the midpoint."
    - label: "Remaining cash runway from Series C close to FID for first large project (estimated)"
      low: 18.0
      mid: 30.0
      high: 48.0
      unit: "months from Oct 2023 close"
      note: "Depends entirely on burn rate and capital deployment rate. At $15M/month burn with $600M in the bank, runway is 40 months from Oct 2023 (~Feb 2027). At $22M/month, runway is ~27 months (~Jan 2026). Actual runway extended by credit facility draws, DOE grant disbursements, and 48C monetization. Not a prediction — illustrates burn sensitivity."
  approximationNotes: >-
    All estimates are labeled as such and should not be used as forward projections without management
    confirmation. The monthly burn estimate is particularly uncertain because it conflates total
    financing received with spending rate, which is not linear. The gross-margin range is based on
    peers who have different scale, product mix, and utilization than EH2.
  claimRefs:
  - CI022
  - CI026
  - CI028
  - CI029
  - CI017
  - CI018
  - CI019

- id: FI004
  title: Capital intensity and cash-flow map
  type: flow
  layout: wide
  summary: >-
    Maps EH2's capital stack against its primary capital uses. Illustrates the multi-source
    nature of the financing structure and the sequential relationship between capital sources
    and major cash outflows. The Generate Capital channel sits outside EH2's corporate balance
    sheet and is shown separately.
  data:
    nodes:
    - id: equity-stack
      label: "Equity rounds (Seed through Series C; > $600M cumulative by Oct 2023)"
    - id: credit-facility
      label: "$100M corporate credit facility (HSBC-led; 2024)"
    - id: doe-instruments
      label: "$65M DOE support: $46.3M grant + $18.3M transferable 48C tax credit"
    - id: trinity-equipment
      label: "$50M Trinity Capital equipment financing (manufacturing-asset secured)"
    - id: corporate-liquidity
      label: "EH2 corporate liquidity pool (sum of above; burn-rate dependent)"
    - id: factory-capex
      label: "Devens gigafactory capex + equipment (sunk and ongoing)"
    - id: manufacturing-burn
      label: "Manufacturing operations + Texas fabrication (ongoing fixed overhead)"
    - id: opex-commercial
      label: "R&D, G&A, and commercial team burn (ongoing)"
    - id: working-capital
      label: "Working capital: WIP inventory, receivables, customer-milestone lag"
    - id: ambient-acquisition
      label: "Ambient Fuels acquisition cost (not publicly disclosed)"
    - id: generate-channel
      label: "Generate Capital: up to $400M project finance (off-balance-sheet; deployed 2026+)"
    - id: project-revenue
      label: "Project milestone receipts (FID-triggered; first expected ~2026–2027)"
    edges:
    - from: equity-stack
      to: corporate-liquidity
      label: "Primary capital source"
    - from: credit-facility
      to: corporate-liquidity
      label: "Revolving liquidity buffer"
    - from: doe-instruments
      to: corporate-liquidity
      label: "Non-dilutive inflows (milestone-linked + transferable credit)"
    - from: trinity-equipment
      to: corporate-liquidity
      label: "Equipment-secured debt; adds leverage"
    - from: corporate-liquidity
      to: factory-capex
      label: "One-time capital investment"
    - from: corporate-liquidity
      to: manufacturing-burn
      label: "Ongoing fixed cost"
    - from: corporate-liquidity
      to: opex-commercial
      label: "Ongoing variable cost"
    - from: corporate-liquidity
      to: working-capital
      label: "WIP and milestone timing"
    - from: corporate-liquidity
      to: ambient-acquisition
      label: "M&A capital (amount undisclosed)"
    - from: project-revenue
      to: corporate-liquidity
      label: "Returns capital as projects commission (2026–2028 horizon)"
    - from: generate-channel
      to: project-revenue
      label: "Project finance enables more projects to reach FID faster"
  approximationNotes: >-
    The corporate-liquidity node cannot be quantified because current cash and credit-facility
    draw status are not publicly disclosed. The generate-channel is explicitly modeled as
    off-balance-sheet because EH2 stated Generate Capital's capital is deployed at the project
    level, not as corporate capital. The feedback loop from project-revenue to corporate-liquidity
    is the critical pathway for the company to become self-sustaining — and its timing depends
    entirely on the named projects reaching FID and commercial operations.
