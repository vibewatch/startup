- id: TI004
  title: Capital adequacy table
  columns:
  - Capital instrument
  - Disclosed amount
  - Date / provider
  - Nature and conditions
  - Forward implication
  enumerationScope:
    coverage: exhaustive
    basis: Covers all publicly disclosed financing instruments; the Company Overview funding chronology provides additional context on round-by-round equity history not duplicated here.
  rows:
  - - Series C equity round
    - $380 million
    - October 2023; led by Fortescue, Fifth Wall, Energy Impact Partners; syndicate of 14+ investors
    - Unrestricted equity; described as oversubscribed; established ~$1B valuation; the company stated total raised exceeds $600M at time of close
    - Largest single capital event; assumed to be substantially deployed into Devens factory ramp, headcount, and commercial build-out by 2026; current remaining balance not disclosed
  - - Corporate credit facility
    - $100 million
    - 2024; led by HSBC; J.P. Morgan, Stifel Bank, Hercules Capital participating
    - Revolving or term credit facility; CFO described it as a "step-change in Electric Hydrogen's access to capital and overall maturity as a business"; covenant terms not public
    - Provides liquidity buffer; availability subject to covenants and lender review; does not represent fully drawn capital unless EH2 has borrowed against it
  - - DOE Clean Electrolysis grant
    - $46.3 million
    - Selected under Bipartisan Infrastructure Law; announced pre-2024 ramp; milestone-linked
    - Non-dilutive government grant; tied to manufacturing scale-up milestones at Devens; not unconditional cash
    - Represents meaningful non-dilutive capital but milestone conditions introduce delivery risk; H2Hubs political uncertainty is a separate policy risk for customers, not this instrument
  - - DOE 48C transferable tax credit
    - $18.3 million
    - Inflation Reduction Act; announced alongside DOE grant
    - Transferable tax credit; EH2 can sell or transfer this credit to a third-party buyer to monetize it as cash; value is relatively certain and near-term
    - Provides definite near-term cash inflow; monetization route is straightforward for a company with sophisticated CFO; adds to effective liquidity
  - - Trinity Capital equipment financing
    - $50 million
    - 2024; Trinity Capital (specialty finance)
    - Secured equipment financing; backed by manufacturing assets at Devens; debt-like instrument
    - Adds leverage to the balance sheet; repayment obligations add fixed-cost burden; reduces net free cash versus gross financing figure; terms not publicly disclosed
  - - Generate Capital project finance partnership
    - Up to $400 million
    - Announced September 2025 alongside Ambient acquisition
    - Generate Capital's own infrastructure investment capital; deployed at project level, not on EH2's corporate balance sheet; EH2 earns project-development economics rather than receiving capital directly
    - Creates demand-side leverage but is not EH2 corporate liquidity; mislabeling this as EH2 capital in a model would substantially overstate liquidity
  notes: >-
    EH2 states publicly that it has secured "over $750 million in financing." That figure aggregates
    equity, debt, grants, tax credits, and equipment financing across multiple instruments with
    different liquidity profiles, maturity dates, and conditions. The Generate Capital $400M is
    separately additive to the $750M corporate figure and does not flow to EH2's corporate balance
    sheet. Burn rate, current cash, and runway are not publicly available and represent the single
    most important capital-adequacy diligence request.
