- id: traction-evidence-gaps-and-verdict
  title: Public Traction, Evidence Gaps, and Financial Verdict
  body: |
    EH2 has the deepest named-project pipeline of any green-hydrogen PEM startup as of the 2026
    run date, but all publicly evidenced project wins remain in pre-revenue stages. The Infinium
    Project Roadrunner 100 MW HYPRPlant is the furthest along: the plant shipped, went through
    hydro-testing and quality processes at EH2's Texas fabrication facility, and is in commissioning
    at the Pecos, Texas site as of 2026. Commercial e-fuels production is targeted for 2027. The
    HIF Global Texas e-Fuels facility selection was announced in September 2025, with no FID date
    disclosed. Synergen's 240 MW FEED agreement (two 120 MW HYPRPlants) targets FID in 2026 and
    commercial operations by end-2028. Uniper's Green Wilhelmshaven pre-FEED began October 2024
    with production targeted by 2028. In all four cases, recognized equipment revenue is conditional
    on the customer reaching FID and triggering milestone-based payment schedules.

    The 5+ GW reservation figure disclosed at the October 2023 Series C has not been updated. No
    pipeline update, backlog figure, order-book breakdown, or booking-to-bill ratio has been
    publicly released. The AES 1 GW framework supply agreement from early 2024 gives AES the
    right to order — it is not a binding purchase order. Framework supply agreements and FEED
    agreements are contractual stage-gates, not revenue-recognizable events in most accounting
    treatments. Their conversion to actual FID-dependent purchase orders constitutes the
    fundamental commercial execution risk for EH2's financial model.

    The financial verdict across the six content requirements is as follows. Revenue quality: EH2
    has the right mix of equipment sales, services, and — post-Ambient — project development, but
    the revenue is deeply pre-commercial. Named project wins at pre-FEED and FEED stages with
    multi-year commissioning timelines mean that material revenue recognition is likely 2027 or
    later in most cases. Margin path: the absence of any disclosed margin and the clear negative-
    gross-margin pattern of public PEM peers (Nel, ITM) at sub-scale utilization strongly suggest
    EH2 is currently burning on a negative gross-margin basis. The path to positive gross margin
    requires factory utilization well above current levels and cost reduction from high-throughput
    manufacturing — the same path First Solar took in solar, which took several years. Capital
    intensity: EH2's model is extremely capital intensive; every HYPRPlant requires manufacturing
    capital before milestone payments arrive, and the project-development channel requires even
    more patient capital. Diligence blockers: the top blockers are (1) no visibility into current
    burn, cash, or runway; (2) no backlog-to-revenue conversion data or order-book granularity;
    (3) no customer pricing, realized ASP, or gross-margin data; (4) no factory utilization rate
    showing whether Devens is ramping toward cost leverage; and (5) no project-finance or asset-
    sale economics for the Ambient/Generate channel.

    Sector context from ING's 2026 hydrogen analysis reinforces the verdict: global government
    support for hydrogen fell 20% in 2025 to $222 billion; demand remains severely underfunded
    at about 3% of total support; most proposed clean hydrogen suppliers have yet to find buyers;
    and the U.S. market is structurally disadvantaged by cheap natural gas and compressed policy
    timelines. EH2's financing depth and technology differentiation provide a credible runway, but
    the company is clearly in a capital-consumption phase before commercial scale, and any
    underwriting must treat both the revenue and the margin as material evidence gaps until a
    full-access diligence review is completed.
