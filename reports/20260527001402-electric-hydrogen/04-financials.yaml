- id: TI002
  title: Pricing / monetization table
  columns:
  - Pricing element
  - List vs. realized
  - Available proxy or benchmark
  - Source
  - Diligence ask
  enumerationScope:
    coverage: partial
    basis: No list pricing has been publicly released; entries derive from public project benchmarks, competitor proxy data, and EH2's own cost-reduction claims.
  rows:
  - - HYPRPlant total installed cost (TIC) per kW
    - Company-claimed, not list pricing; EH2 asserts up to 60% lower TIC than alternatives; Synergen publicly linked project viability to sub-$1,000/kW TIC
    - "Repsol Petronor 100 MW refinery electrolyzer benchmark: EUR 292M for 100 MW = approx EUR 2,920/kW total installed; EH2 claims up to 60% reduction implies approx $1,200/kW or below"
    - EH2 official site; Synergen press release; Chapter 3 comp context (Repsol not restated here)
    - Request actual contract value per MW for all named projects; normalize TIC benchmark independently
  - - HYPRPlant ASP per MW (equipment only, excluding installation)
    - Not disclosed; no list price published; negotiated per-project
    - ITM Power implies rough £26M revenue for 2025 across a multi-MW portfolio as a very rough reference; Nel's per-MW implied revenue is distorted by project-mix; no clean EH2 ASP proxy
    - Nel Annual Report 2025; ITM Annual Report 2025; EH2 press releases
    - Request EH2 average realized ASP per MW across all contracts signed to date; obtain payment milestone schedule and any liquidated damages or cancellation provisions
  - - Service / warranty premium
    - Not disclosed; DNV review confirmed standard commercial guarantees exist but did not price them
    - Industrial PEM OEM service typically 1–3% of capital cost per year; at $1,000/kW for 100 MW, that implies roughly $1–3M/year per plant in service revenue
    - DNV validation press release; industry proxy inference
    - Request warranty provision rate, service-contract pricing, and renewal rates for any commissioned plant
  - - Project development fee (Ambient channel)
    - Not disclosed; typical renewable project development fees range from 0.5–2% of project capital
    - At $400M Generate Capital facility, a 1% origination fee implies $4M; per-project economics unknown
    - Generate Capital / Ambient acquisition press release; no public fee schedule
    - Obtain development agreement term sheet showing fee structure, co-investment rights, and preferred return on project capital
  notes: >-
    Pricing opacity is structural in this market; all customers are large industrial project
    developers with bespoke engineering requirements that preclude standard catalog pricing. The
    absence of any disclosed realized pricing or ASP is expected but materially limits financial
    underwriting for an investor who needs to model revenue at any scenario utilization rate.
