- id: capital-adequacy-and-financing-dependency
  title: Capital Adequacy, Financing Stack, and Runway
  body: |
    EH2's capital position is described in the Company Overview funding chronology; this section
    addresses forward capital adequacy and financing dependency for underwriting purposes, minting
    local claims from the same public source pack rather than copying prior chapter IDs.

    The public record establishes a financing stack that exceeds $750 million in total: an
    oversubscribed $380 million Series C in October 2023 (which established EH2 as green
    hydrogen's first unicorn at approximately $1 billion valuation), a $100 million corporate
    credit facility closed in 2024 and led by HSBC with participation from J.P. Morgan, Stifel
    Bank, and Hercules Capital, a $46.3 million DOE grant under the Bipartisan Infrastructure Law's
    Clean Electrolysis Program, an $18.3 million transferable 48C tax credit under the Inflation
    Reduction Act, and $50 million in equipment financing from Trinity Capital. Additionally, the
    Generate Capital partnership provides up to $400 million in project finance for customer
    hydrogen projects — this capital sits on Generate Capital's balance sheet and is deployed at
    the project level, not as EH2 corporate equity.

    Despite the large nominal financing stack, EH2 does not publicly disclose current cash on hand,
    monthly burn rate, or runway in months. The $380 million Series C closed in October 2023; the
    $100 million credit facility closed in 2024; the DOE grant and 48C credit are tied to
    manufacturing milestones. Given that EH2 has more than 300 employees, a 1.2 GW/year factory
    in full operation since 2024, a Texas fabrication facility, and commercial teams across multiple
    continents, monthly operating burn is substantial — conservatively estimated in the range of
    $10–20 million per month based on peer burn rates for comparably-sized cleantech manufacturers,
    though no public confirmation exists. At that burn rate, and assuming the full Series C remains
    available, runway would be measured in years from the 2023 close. However, manufacturing
    scale-up, first-plant commissioning, the Ambient Fuels acquisition, and working capital for
    in-progress projects all draw on that capital.

    The CEO's public acknowledgment that EH2 "built the company for growth" and sees "another year
    and a half of muted activity" from 2025/2026 is the most direct adverse signal for capital
    adequacy. In an OEM business model, revenue arrives when projects reach FID and milestone
    payments are triggered. If Synergen's FID slips past 2026, if Uniper's Green Wilhelmshaven
    green hydrogen economics do not pencil under current EU hydrogen policy, or if the 45V deadline
    compression redirects U.S. projects, EH2 could face a prolonged period of burn without
    meaningful equipment revenue inflows.

    The $100 million credit facility provides a revolving liquidity buffer, but credit-facility
    availability typically depends on covenants, borrowing-base constraints, and lender review
    cycles. The DOE grant is tied to manufacturing milestones that must be demonstrated at Devens.
    The 48C tax credit is transferable — EH2 could monetize it in the market — providing a known
    cash inflow. The Trinity Capital equipment financing is secured against manufacturing assets.
    Together, these instruments suggest that EH2's liquidity access is diversified but not
    unlimited, and that a prolonged demand pause would require either additional equity raises or
    efficiency measures.

    The H2Hubs funding rollback — with the DOE proposing to reduce or eliminate funding for four
    of seven original hubs representing nearly 60% of the $7 billion committed — and the OBBBA's
    compression of the 45V construction-start deadline from 2033 to January 1, 2028, both reduce
    the near-term pipeline of commercially viable U.S. green hydrogen projects. EH2's European
    push (Uniper, potential second German project cited by CEO) partially offsets this risk but
    introduces currency, supply-chain, and local-content complexity that the CEO acknowledged
    openly: "it does mean moving a lot of our supply chain to Europe for European suppliers."
