tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit / contract type
  - Current status
  - Revenue quality
  - Diligence ask
  enumerationScope:
    coverage: partial
    basis: Streams identified from public press releases, company website, and inferred from product architecture; no internal financial breakdown has been disclosed.
  rows:
  - - Capital equipment sales — HYPRPlant
    - One-time payment for fully integrated electrolyzer plant (75/100/120 MW); milestone-based recognition tied to engineering, FAT, delivery, and commissioning
    - Per-plant contract; MW-denominated reservation then firm order post-FID
    - First commercial plant (Infinium 100 MW) in commissioning 2026; subsequent plants (HIF, Synergen, Uniper) in FEED or pre-FEED
    - Low near-term; revenue recognition deferred to project FID and commissioning milestones; high strategic quality if projects convert
    - Obtain signed purchase orders, contract value, payment milestones, cancellation clauses, and milestone-payment schedule for all named projects
  - - Engineering, integration, and commissioning services
    - Professional-services revenue accompanying each plant sale; covers project engineering, skid integration, field commissioning, and owner's engineer support
    - T&M or lump-sum per project; typically bundled with equipment sale
    - Active for Infinium Roadrunner; embedded in current FEED/pre-FEED engagements
    - Medium; services revenue recognized over project period; lower capital intensity than equipment
    - Unbundle engineering and commissioning fee economics from equipment ASP; obtain attach rate and margin per MW
  - - Project co-development and development fees (post-Ambient acquisition)
    - EH2 originates, develops, and potentially sells or refinances hydrogen projects; fee income on development milestones and project-level asset sales
    - Development fee events; potential equity carry on asset sale; 15+ projects across 10+ U.S. states
    - Targeting deployment of project capital beginning 2026; no publicly announced development transaction completed
    - Speculative; no recognized revenue event public as of 2026 run date
    - Request development pipeline status, stage-gate schedule, fee economics, and whether any project has reached financial close under the Generate Capital facility
  - - Project finance facilitation (Generate Capital channel)
    - EH2 introduces projects to Generate Capital for up to $400M in project finance; may receive origination fee, preferred economics, or reduced LCOH for customers
    - Per-project origination; structured as infrastructure investment on Generate's balance sheet
    - Partnership announced September 2025; project capital deployment targeting 2026+
    - Low near-term; non-equity mechanism; economic sharing structure not publicly disclosed
    - Obtain term-level economics of Generate partnership — origination fee, co-investment rights, recourse structure, and minimum-deployment obligation
  - - Service, warranty, and performance monitoring
    - Post-delivery service contracts, warranty-reserve monetization, and potential subscription monitoring of operating plants
    - Annual recurring or per-event; tied to multi-year warranty periods
    - Not publicly sized; inferred from DNV review confirming standard commercial guarantees
    - Unknown; recurring service revenue is structurally attractive but is not disclosed
    - Request warranty provisioning, service-contract attach rate, term, and annual recurring value per plant
  - - Equipment financing facilitation (Trinity Capital channel)
    - EH2 may assist customers in accessing equipment financing from Trinity Capital or similar lenders
    - Not publicly characterized as a revenue stream; may be demand-enablement only
    - $50M Trinity Capital equipment financing was structured for EH2 manufacturing scale-up, not customer equipment loans
    - Low or zero; appears to be balance-sheet support rather than a customer-revenue channel
    - Clarify whether EH2 earns fees or economics from customer access to equipment financing or whether the Trinity facility is solely for EH2's own manufacturing
  notes: >-
    No publicly disclosed revenue mix, revenue concentration, or revenue-recognition policy is available for underwriting. All stream descriptions derive from press releases, the Ambient acquisition announcement, and product architecture inference.
