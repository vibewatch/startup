- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / available proxy
  - Confidence
  - Why it matters
  - Diligence ask
  enumerationScope:
    coverage: exhaustive
    basis: All financially material unit-economics inputs for an industrial OEM equipment company; null entries reflect genuinely private data, not research failure.
  rows:
  - - Average selling price per MW (equipment)
    - Not publicly disclosed; null
    - Not applicable — unavailable
    - ASP drives top-line revenue model at any utilization scenario
    - Request signed contract values, MW booked, and realized ASP for all plants delivered or under contract
  - - Total installed cost (TIC) per kW (customer-facing)
    - Claimed at or below $1,000/kW based on Synergen's public statement and EH2's 60% cost-reduction claim; not verified
    - Low (company-claimed, unverified)
    - Sets competitive positioning and informs whether projects can reach FID under prevailing LCOH economics
    - Obtain independent third-party TIC audit; compare against post-commissioning actual capex at Infinium Roadrunner
  - - Gross margin per plant
    - Not publicly disclosed; peer proxies (Nel, ITM) imply deeply negative at sub-scale; null for EH2
    - Not applicable — unavailable
    - Most critical indicator of whether the revenue model is viable at scale
    - Request COGS breakdown per plant, factory overhead absorption schedule, and gross margin bridge from current to target utilization
  - - Manufacturing cost per MW (stack)
    - Not publicly disclosed; DOE PEM 2026 target implies ~$300/kW stack cost; EH2 claims to be on path to DOE Hydrogen Shot targets; null for actual EH2
    - Low (inferred from DOE targets only)
    - Stack cost is the single largest COGS driver; DOE targets $300/kW stack by 2026
    - Request actual versus targeted stack manufacturing cost per MW at Devens; compare against DOE 2026 and 2031 cost milestones
  - - Monthly operating burn
    - Not disclosed; estimated $10–20M per month based on 300+ employee headcount, Devens factory operations, and peer burn-rate benchmarks; null for verified figure
    - Very low (inference only)
    - Determines runway from current cash position; if burn is at high end of range, 2023 Series C capital would be substantially consumed by 2026
    - Request audited cash flow statement and monthly burn by cost category (manufacturing, R&D, G&A, commercial)
  - - LCOH at target utilization ($1.50/kg, $1/kg)
    - EH2 targets $1.50/kg H2 in high-renewable states by 2030; DOE Hydrogen Shot targets $1/kg by 2031; green H2 in the U.S. currently roughly 3× the cost of gray H2 under current gas prices
    - Medium (company-claimed and DOE-corroborated for the target; current LCOH much higher)
    - LCOH target determines whether projects can close offtake without subsidy; critical for FID timing and order-book conversion
    - Request project-level LCOH model for each named customer; compare against 45V incentive stack, EU RED III value, and actual renewable PPA pricing
  notes: >-
    The null entries in this table are not research failures; they are structural features of
    EH2's private-company status. Each null entry represents a diligence-only information gap
    that cannot be resolved without accessing EH2's internal financial records. Peer proxies from
    Nel and ITM are materially adverse signals that should be treated as the base case until EH2
    provides evidence of a meaningfully different margin profile.
