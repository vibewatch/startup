  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Electric Hydrogen 的乐观投资逻辑建立在四根支柱上。第一，到 2026 年，EH2 是唯一已投运 100 MW 级项目、总部在美国的 PEM 电解槽
              OEM；在这一规模上，它比所有西方竞品更早积累有意义的运行数据。第二， HYPRPlant 设计在 2025 年 7 月获得 DNV
              独立验证，被确认为“在市场上非常有竞争力且独特”——这项背书降低了项目开发商为项目融资设施采购设备时的可融资性风险。第三，Devens 超级工厂年产能 1.2 GW，带来小型同行无法复制的制造杠杆：Nel ASA
              2025 年收入 NOK 963M，经营亏损 NOK 1,365M；ITM Power H1 FY2026 收入只有 £26M。EH2
              从电堆到工厂整合的模式，使其比单纯技术授权方更有机会吃到单个项目里的更多价值。第四，Generate Capital 合作（最高 $400M 项目融资，2025 年 9
              月）解决了近期项目可融资性，同时不在公司层面稀释股权。


              反向逻辑同样沉重。EH2 未披露收入、毛利率或 EBITDA，因此估值天然带有推测性。CEO 在 2025 年末公开承认需求约 18 个月偏弱，意味着商业管线推进速度慢于原 Series C
              投资人预期。OBBBA 将 45V 开工期限从 2033 年 1 月压缩到 2028 年 1 月，构成结构性逆风：大型项目（200–240 MW）在 FEED 之后还需要 18–36 个月项目融资尽调，因此符合
              OBBBA 要求的项目实际 FID 窗口大约在 2026 年中关闭，直接威胁 Synergen 以及未来任何美国项目中标。与此同时，即便完整适用 45V 抵免，美国灰氢与绿氢的成本差仍约为 3×；OBBBA
              同时强化 45Q 抵免，又在边际上提高了蓝氢竞争力。合并看，这不是周期低谷，而是行业需求发生结构性错位。
