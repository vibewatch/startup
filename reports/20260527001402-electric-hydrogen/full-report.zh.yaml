      - 尽调路径
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover confirmed regulatory and policy risks identifiable from public sources; not a legal opinion on every
        applicable regulation.
    rows:
      - - 45V 氢税收抵免开工截止期（OBBBA 2028 年 1 月截止）
        - 美国联邦
        - 已生效——必须在 2028 年 1 月 1 日前开工；此前截止期为 2033 年 1 月
        - 已发生——政策已生效
        - 关键：所有待定美国 FID 的时间线压缩 5 年
        - 分散到欧洲项目管线；加快 Synergen/HIF 从 pre-FEED 转入 FEED
        - 高——任何无法在 2027 年底前破土的美国项目都会失去 45V 资格
        - 确认哪些 EH2 管线项目在 2028 年 1 月前有具约束力的开工承诺
      - - H2Hubs DOE 资金审查（7 个枢纽中 4 个面临削减风险）
        - 美国联邦 / DOE
        - 进行中——DOE 表示可能削减 4 个枢纽（CA、Mid-Atlantic、PNW、Midwest），约占 $7B 的 60%
        - 高——当前政府已推动政策动作
        - 中等：EH2 的具名项目（HIF、Synergen）并非由枢纽直接资助，但枢纽情绪会影响行业 FID
        - HIF 和 Synergen 项目偏出口（燃料销往欧洲），降低对国内需求政策的暴露
        - 中等——对美国 H2 行业形成广泛投资人信心降温效应
        - 确认 EH2 项目是否直接暴露于 H2Hub 资金义务
      - - 欧洲 RED III 氢配额合规（EU 强制工业使用氢）
        - EU / 成员国
        - 生效中——RED III 强制工业使用可再生氢；执行取决于成员国转置
        - 低：监管有利于 EH2 的目标市场
        - 正向：为欧洲项目（Uniper、未来管线）创造强制性需求
        - 供应链本地化，以满足本地含量要求
        - 剩余法律风险低；供应链本地化的执行风险另算
        - 核验 Uniper Green Wilhelmshaven 是否满足 RED III 和 European Hydrogen Bank 标准
      - - 氢安全与工艺许可（NFPA 2、ATEX、PSSR）
        - 美国和 EU
        - 持续——Pioneer 和 Roadrunner 证明此前拿到许可；欧洲部署需要符合 EU 机械指令、ATEX、PED
        - 美国低（已取得过许可）；EU 首次部署中等
        - 中等：欧洲工厂可能因许可延迟或设计修改要求受影响
        - 模块化、工厂测试过的设计降低单站点许可风险；DNV 验证支撑安全论证
        - 中等——首座欧洲商业工厂的许可路径未公开确认
        - 获取 Roadrunner 环境和 H2 安全许可副本；要求披露 Uniper 项目许可状态
      - - 出口管制 / 本土含量（IRA 本土含量、针对中国输入的关税）
