      - number: '1.3'
        title: 融资历史、估值与投资者基础
        blocks:
          - type: paragraph
            body: >-
              Electric Hydrogen 已搭出电解槽行业最大的私募融资堆叠之一。自 2020 年创立以来，公司先完成多轮股权融资，背后是深耕清洁技术的投资人（Breakthrough Energy
              Ventures、Capricorn Partners、Energy Impact Partners、Fifth Wall、Prelude Ventures、S2G Ventures），随后在 2023 年 10
              月完成超额认购的 $380 million Series C——这轮融资让 EH2 以约 $1 billion 估值成为绿氢领域首个独角兽。Series C 由 Fortescue、Fifth Wall 和
              Energy Impact Partners 领投，并引入一大批战略投资者，包括 bp Ventures、Oman Investment Authority、Temasek、Microsoft's Climate
              Innovation Fund、United Airlines Sustainable Flight Fund、Kajima Ventures、Fatima Holdings USA、Amazon's
              Climate Pledge Fund、Equinor Ventures、Mitsubishi Heavy Industries 和 Rio Tinto。


              除了股权，EH2 还叠加了政府和机构资本。U.S. Department of Energy 根据 Bipartisan Infrastructure Law 的 Clean Electrolysis
              Program 授予 $46.3 million 补助，并根据 Inflation Reduction Act 第 48C 条授予 $18.3 million 可转让税收抵免，DOE 支持合计 $65
              million。2024 年，公司完成由 HSBC 牵头的 $100 million 公司信贷额度，J.P. Morgan、Stifel Bank 和 Hercules Capital 参投——CFO
              Warnick 称这是“Electric Hydrogen 获取资本能力和整体成熟度的一次阶跃式变化”。公司还从 Trinity Capital 获得 $50 million 设备融资。


              EH2 面向公众的材料称累计融资超过 $750 million，公司网站写明“来自领先投资者和银行的融资超过 $700M”。Series C 以下各轮的精确规模和当前 Series C
              后估值没有公开披露。没有公开报道老股交易或可转债活动。股权结构表中战略方占比高——既有 Fortescue 和 Rio Tinto 等工业终端用户，也有 Microsoft 和 United Airlines
              等气候使命投资人——反映 EH2 想同时锁定股权资本和客户市场入口。
