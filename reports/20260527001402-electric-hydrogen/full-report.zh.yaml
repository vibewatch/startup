      - number: '7.2'
        title: 运营、技术与供应链风险
        blocks:
          - type: paragraph
            body: >
              Electric Hydrogen 最大的单一运营风险，是其商业技术仍处在首套同类规模。首套 100 MW HYPRPlant 截至 2026 年初仍在 Infinium Project Roadrunner
              调试。没有任何全商业规模 HYPRPlant 完成完整运行周期、证明长周期性能，或在现场对照保修和性能保证接受测量。DNV 的全面技术尽调——覆盖电堆技术、工厂设计、性能、可靠性、制造、质量和商业保证——结论认为
              HYPRPlant「高度有竞争力」且可以「高度可靠」，Pioneer 工厂（自 2024 年 1 月以十分之一规模运行）也验证了电堆性能。不过，DNV
              工作很大程度上是前瞻性的，不是调试后的性能审计。Roadrunner 调试才是第一个真实证明点；任何重大表现不达标——衰减率、可用率、水纯度要求、电力转换损失——都会重置所有后续项目的可融资性叙事。


              供应链集中风险很高。PEM 电解槽依赖铂族金属（PGM）催化剂，其中最关键的是阳极铱。全球铱年产量约 7 metric tons；按 2022 年前后领先 PEM OEM 的 200–300 g/MW
              载量计算，全年供应量只能支持每年 23–35 GW PEM 部署。EH2 公开声称其铱使用量显著低于竞争对手；如果准确，这会降低但不能消除瓶颈。公司没有公开披露每 MW 铱消耗、采购安排或 PGM 价格对冲策略。


              PGM 之外，HYPRPlant 还使用钛部件和质子交换膜，核心供应商集中。钛由俄罗斯、中国和日本供应链主导；EH2 的美国制造模式提供了一定隔离，但不能保证所有特种材料都来自美国本土。Nafion 型膜主要由
              Chemours（DuPont 传承）供应，在关键电堆组件层面形成单一供应商依赖。


              制造运营风险集中在 Massachusetts Devens 吉瓦工厂和 Texas Columbus 的 Titan Production Equipment 设施。Titan 由 PE 支持（Castle
              Harlan），2024 年在其 Texas 设施投入最多 350 人。单一 Texas 合作方提供单源制造，会在 Titan
              遭遇财务压力、劳动力问题或与油气行业需求产生产能冲突时形成产能瓶颈和交易对手风险。The Weitz Company 被选为 Roadrunner 安装的 EPC，是拥有工业经验的大型总承包商，但整个行业在
              100 MW 一体化 PEM 系统上的氢专项调试经验仍然很薄；Roadrunner 的执行滑坡或调试失败会被所有潜在买家看到。


              PEM 在规模化下天然存在可靠性和衰减风险。PEM 电堆会随时间衰减；性能保证和保修义务带来财务敞口，EH2 没有公开量化。Nel 的 TRIR 6.1 和
              ITM「安全是一切工作的核心」的说法，都反映出全行业意识到氢处理是流程安全环境，而不是常规电子制造车间。任何大型 PEM 设施的召回或安全事故——包括非 EH2
              建造的设施——都可能触发监管审查或保险费上升，影响整个行业。


              CEO 已公开确认欧洲供应链本地化负担：向欧洲客户交付 HYPRPlant 需要把供应链伙伴转向欧洲。这会给 EH2
              的欧洲增长叙事增加爬坡阶段、质量管理复杂度和执行风险，尤其是在这种模式下尚无欧洲商业工厂完成制造。
