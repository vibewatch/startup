  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻市场与现状替代
        blocks:
          - type: paragraph
            body: >
              Electric Hydrogen 的可服务市场不是宽泛的氢经济，而是大型（75 MW
              及以上）工业电解制氢工厂这一细分市场，客户是需要成本有竞争力的绿氢来生产衍生品、处理难以减排工业流程或生产出口燃料的项目开发商和工业终端用户。这一区分很关键：全球氢市场由每年约 90 million tonnes
              的灰氢主导，灰氢通过天然气蒸汽甲烷重整（SMR）生产，不经过电解槽，也不是 EH2 的近期市场。截至 2026 年，清洁氢（绿氢 + 蓝氢）仍低于全球氢使用量的 2%。


              纳入的支出是 75 MW
              及以上电解制氢工厂的工业资本开支，包括全部工厂配套集成、电力转换和调试。目标终端用途包括用于化肥和海运燃料的绿氨、可持续航空燃料（e-SAF）、e-methanol、钢铁用直接还原铁（DRI），以及炼厂氢替代。这些相邻场景共享一个上游投入——成本有竞争力的绿氢——并合在一起代表那些无法仅靠电气化脱碳的行业。


              EH2 的目标市场不包括：用于交通或现场工业应用的小规模（<10 MW）电解槽；资本成本更低但灵活性优势较少的碱性电解槽；走不同政策路径（45Q 而非 45V）的蓝氢（SMR plus
              CCS）；以及燃料电池交通电堆。竞争替代品是美国 $1–2/kg 的灰氢和蓝氢——在当前条件下，即便有 45V 生产税收抵免，也大约比绿氢便宜三倍——这造成持久的制氢成本缺口，也定义了最关键的采用约束。


              EH2 瞄准的买方类别是有项目融资支持的开发商，而不是直接工业用户。Infinium、HIF Global、Synergen 和 Uniper 都是项目开发商或工业运营方，它们组装资本开支堆叠（股权 + 债务 +
              承购 + 电力 PPA），再采购电解制氢工厂作为制氢核心。因此，EH2 的市场不只取决于工业绿氢需求，还取决于项目融资结构愿不愿意支持它——这严重依赖政策稳定性、承购合同确定性和电力成本。
