      - number: '4.3'
        title: 资本充足性、融资结构与现金跑道
        blocks:
          - type: paragraph
            body: >
              EH2 的资本状况已在「公司概况」的融资时间线中说明；本节从承销视角评估前瞻资本充足性和融资依赖，用同一套公开来源包生成本节证据主张，而不是复用前文章节 ID。


              公开记录显示，EH2 的融资栈总额超过 $750 million：2023 年 10 月完成超额认购的 $380 million Series C（使 EH2 成为绿氢领域首家独角兽，估值约 $1
              billion）；2024 年完成由 HSBC 牵头、J.P. Morgan、Stifel Bank 和 Hercules Capital 参与的 $100 million
              公司信贷额度；根据《两党基础设施法》的清洁电解计划获得 $46.3 million DOE 拨款；根据《通胀削减法案》获得 $18.3 million 可转让 48C 税收抵免；以及 Trinity
              Capital 提供的 $50 million 设备融资。此外，Generate Capital 合作安排为客户氢项目提供最高 $400 million 项目融资——这笔资本留在 Generate Capital
              的资产负债表上，在项目层面投放，并不是 EH2 公司股权。


              名义融资栈很大，但 EH2 并未公开披露当前现金余额、月度烧钱速度或以月计的现金跑道。$380 million Series C 于 2023 年 10 月完成；$100 million 信贷额度于 2024
              年完成；DOE 拨款和 48C 抵免都绑定制造里程碑。考虑到 EH2 员工超过 300 人，1.2 GW/year 工厂自 2024 年起全面运行，另有 Texas
              制造设施和横跨多大洲的商业团队，月度运营烧钱规模很高——参考同等规模清洁技术制造商的烧钱速度，保守估计约为每月 $10–20 million，但没有公开确认。按这一烧钱速度，并假设 Series C
              全额仍可动用，从 2023 年交割时点看，现金跑道可按年计算。不过，制造爬坡、首座工厂调试、Ambient Fuels 收购以及在建项目的营运资本都会消耗这笔资金。


              CEO 公开承认 EH2「按增长来搭建公司」，并认为 2025/2026 年起还会有「一年半的活动低迷期」，这是资本充足性最直接的负面信号。在 OEM 商业模式下，项目达到 FID
              并触发里程碑付款之后，收入才会进账。如果 Synergen 的 FID 延后到 2026 年之后，如果 Uniper 的 Green Wilhelmshaven 绿氢经济性在当前 EU 氢能政策下算不过账，或如果
              45V 截止期限压缩改变美国项目流向，EH2 可能长期烧钱，却没有有意义的设备收入流入。


              $100 million 信贷额度提供了循环流动性缓冲，但信贷可用性通常取决于契约条款、借款基数约束和贷款人审查周期。DOE 拨款绑定必须在 Devens 证明的制造里程碑。48C 税收抵免可转让——EH2
              可以在市场上变现——提供了一笔可识别现金流入。Trinity Capital 设备融资以制造资产作抵押。合在一起，这些工具说明 EH2
              的流动性来源多元，但并非无限；如果需求长期停顿，公司将需要追加股权融资或推进效率措施。


              H2Hubs 资金回撤——DOE 提议减少或取消原七个枢纽中四个的资金，涉及已承诺 $7 billion 中近 60%——以及 OBBBA 将 45V 开工截止期从 2033 年压缩到 January 1,
              2028，都削弱了美国近期商业可行绿氢项目管线。EH2 在欧洲推进（Uniper，以及 CEO 提到的潜在第二个德国项目）部分对冲了这一风险，但也引入汇率、供应链和本地化内容复杂度；CEO
              公开承认：「这确实意味着要把我们大量供应链转到欧洲，交给欧洲供应商。」
