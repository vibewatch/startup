  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价与市场进入动作
        blocks:
          - type: paragraph
            body: >
              Electric Hydrogen 的收入模式围绕三条相互交叉的机制：销售完整集成的 HYPRPlant 电解制氢工厂等资本设备；每次工厂销售附带的工程和调试服务；以及 2025 年整合 Ambient
              Fuels 和 Generate Capital 合作后形成的项目联合开发与项目融资协助。第四条潜在收入流——投运后的服务、质保和性能监控合同——可从产品架构推断存在，但公司没有公开测算或描述。


              核心交易是在项目层面销售 HYPRPlant：EH2 在 Massachusetts Devens 的 1.2 GW/year gigafactory 制造电解槽电堆，同时由当地合作伙伴在 Texas
              设施制造化工流程模块。电堆和撬装模块随后发运，由当地 EPC 团队现场组装并调试。75 MW、100 MW 和 120 MW 三种容量版本构成合同规模梯队；Synergen FEED 中的 120 MW
              HYPRPlant 由两套单元配对组成，意味着更大订单可模块化堆叠。定价按项目谈判，不发布标价。EH2 不披露平均售价、每 MW 收入或任何已实现合同价值。


              市场进入动作完全由企业和项目开发驱动。所有具名客户关系都先经历数月到数年的 FEED、pre-FEED 或框架供货协议，然后才出现商业交付义务。AES 1 GW
              框架供货协议是一项有条件预订，不是有约束力的订单。Infinium 在 Project Roadrunner 的 100 MW 合作从 pre-FEED 走到工程、工厂发货，再到 2026
              年当前调试——从选型到调试至少跨越两年。Uniper 200 MW 合作于 2024 年 10 月启动 pre-FEED，未公布 FID 日期。Synergen 的 240 MW FEED 协议目标在 2026
              年 FID。这一模式意味着从首次选型到确认设备收入，销售周期为 18 到 36+ 个月。


              2025 年 9 月宣布收购 Ambient Fuels（交易于 2025 年 5 月完成）以及关联的 Generate Capital 合作后，EH2 增加了项目联合开发渠道。公司正在美国 10+
              个州积极开发约 15 个项目，潜力超过 600 tonnes per day。Generate Capital 提供最高 $400 million 项目融资解决方案，让 EH2
              可以作为开发商发起、开发，并可能出售或再融资氢项目，而不只是设备供应商。这创造了潜在第二条收入路径——开发费、资产销售和股权收益——但经济性没有公开披露；公司称目标是从 2026 年开始部署项目资本。


              收入确认在设备流和项目开发流之间会有实质差异。设备销售可能在主要里程碑交付和验收时确认收入；项目开发收入则会在开发费事件、资产销售或与商业运营绑定的生产承购时确认。因此，两条流的领先指标、资本强度和利润率结构不同——但两者都没有公开规模。
