      - number: '8.2'
        title: 建议与估值立场
        blocks:
          - type: paragraph
            body: >-
              建议为继续研究。证据已经足以刻画机会和主要风险，但不足以支持按当前 $1B 参考价格入场。核心问题是，EH2 的估值在 2023 年 10 月形成，当时假设包括：45V 抵免可完整延续至 2033
              年、行业需求接近商业化拐点、没有重大政策反转；这些假设此后都已明显削弱。相对当前经营环境，$1B 标记偏高。


              置信度为中。技术差异化和制造规模真实存在，DNV 已确认，Devens 超级工厂剪彩也已展示。财务风险同样真实且证据充分。缺口在于，没有额外证据，无法判断 EH2
              能否在当前融资跑道耗尽前，把已具名项目管线转化为达成 FID 并带来收入的事件。


              风险评级为高。未披露收入、上一轮估值标记已陈旧、45V 时间表被压缩、行业需求被摧毁、具名 FID 前 项目少于五个且高度集中；这些因素叠加，即便对基础设施增长投资者也构成高风险。


              估值立场为偏高。$1B 的收入前估值意味着，在绿氢看似即将商业化时，投资者给了显著技术溢价。现在这份溢价必须吸收 OBBBA 政策逆风、同行倍数压缩，以及 2.5
              年没有新股权催化的时间成本。新投资者更合理的入场区间是 $600–750M，前提是确认 Infinium Roadrunner 运行数据，并且 2026 年底前至少再有一个项目达成 FID。
            claimRefs:
