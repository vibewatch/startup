        - 披露铱采购合同条款、对冲做法和每 MW 用量
      - - Titan Production Equipment 制造失败或交易对手承压
        - 中低——PE 支持的单一来源制造商（Castle Harlan）；2024 年峰值员工 350 人
        - 高——得克萨斯唯一撬装制造商；Titan 出问题会叫停所有美国工厂制造
        - 部分——Titan 调用了得克萨斯 O&G 专长，并成功完成 Roadrunner 撬装
        - 中等——未公开披露备选制造伙伴或双来源战略
        - 核查 Titan 财务健康；识别备份制造替代方
      - - Roadrunner 上 Weitz EPC 质量问题或成本超支
        - 中低——大型总包商，有工业经验，但氢领域专项记录有限
        - 中等——EPC 失败会延误调试并造成成本超支；EH2 部署 VP 在现场
        - 部分——Weitz 因工业专长入选；模块化撬装相比现场散建减少现场工作
        - 中等——特定 EPC 团队在氢项目上的首个调试里程碑
        - 要求提供调试时间表、当前预算状态和 Weitz 氢项目经验背书
      - - 欧洲供应链本地化执行失败
        - 中——CEO 承认需要将供应链迁至欧洲；未披露欧洲制造伙伴
        - 中高——本地化失败会延误欧洲项目收入，并威胁 Uniper 交付时间线
        - 低——战略已宣布但尚未落地；没有具名欧洲制造伙伴
        - 高——整个欧洲收入路径依赖尚未执行的战略前提
        - 欧洲制造伙伴资质状态和 Uniper pre-FEED 里程碑时间线
    notes: 电堆成本基准来自 NEL 和 ITM 年报；EH2 特定成本结构为专有信息，可能不同。
