      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >
              EH2 商业上活跃的买方分层有两个共同结构特征：项目规模大（单套 100 MW 或以上），以及承购面向出口或与欧洲挂钩。四类主要已确认买方原型是：（1）把绿氢用作航空或海运燃料原料的先进 e-fuels
              开发商，（2）瞄准化肥或海运出口市场的绿氨项目开发商，（3）为工业脱碳承诺寻求绿氢或氨的欧洲公用事业公司，（4）围绕未来政策选择权建设绿氢项目管线的美国能源和电力公司。


              四类买方的预算主要由项目开发商或发起方股权堆叠承担，并由项目融资债务支持。电解槽本身是整体项目的一项资本开支，通常与电力转换基础设施并列为最大的单项设备之一。EH2
              的典型采购路径包括：（a）表达兴趣和初步工程沟通，（b）FEED（front-end engineering design，前端工程设计）或 pre-FEED
              协议，（c）下游产品商业承购合同，（d）与项目融资贷方完成财务交割，（e）电解槽采购合同和设备交付，（f）调试。这条六步路径意味着 EH2 的收入相对多年项目开发周期后置。


              Infinium Project Roadrunner 展示了完整采用路径：Infinium 先从 NextEra 获得可再生电力 PPA，再获得 American Airlines 和 IAG
              的承购协议、Brookfield Asset Management 和 Breakthrough Energy Catalyst 的项目股权，然后选择 EH2 的 100 MW HYPRPlant
              并完成财务交割。EH2 工厂目前正在 2026 年调试。这条从概念到调试的路径耗时约三年。


              EH2 还通过收购 Ambient Fuels 以及与 Generate Capital 合作搭建联合开发模式，为无法自行承担完整开发堆叠的客户提供最高 $400 million 项目融资。这让 EH2
              不只是设备供应商，也成为规模较小或更早期、缺少资产负债表能力来独自走完多年开发周期的买方的项目开发伙伴。EH2 公开称开发管线约有 15 个活跃项目，分布在美国 10+ 个州，合计氢气潜力超过 600
              tonnes per day。
