      - number: '5.2'
        title: 架构、制造与部署模式
        blocks:
          - type: paragraph
            body: >-
              在技术层，HYPRPlant 是质子交换膜（PEM）系统。DOE 的 PEM
              入门材料和目标表给出了公开技术基准：固体聚合物膜传导质子，电流通过外部电路流动，性能由电流密度、能效、衰减、寿命和电堆成本来判断。Electric Hydrogen
              自己的公开材料停留在更高一层。公司声称拥有最高功率的先进 PEM 电堆，但不披露逐电池材料清单或工厂控制系统架构。公开材料真正清楚展示的是围绕该电堆搭出的运营模式。

              制造分布在两个地区。Massachusetts Devens 生产并组装自研电化学电堆，Texas 合作方设施制造工艺模块和工厂撬装模块。Electric Hydrogen
              表示，每套全尺寸电堆都会做产线末端测试，撬装模块会做激光扫描以确认装配匹配，工厂出货前会完成工厂测试，每个撬装模块都可公路运输。Roadrunner 提供了迄今最好的现场证明：出货前，其撬装模块在 Texas
              完成组装、水压测试和质量流程；到场后，由 Weitz 负责现场安装。结果是，一套硬件架构与制造和部署架构不可分割：工厂经济性依赖标准化制造和尽量减少现场工作，而不只是电化学效率。
