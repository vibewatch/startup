    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与商业模式
        blocks:
          - type: paragraph
            body: >-
              Electric Hydrogen Co.（以 Electric Hydrogen 名义经营，简称 EH2）于 2020 年在 San Francisco Bay Area 和 Massachusetts
              创立，公开使命很单一：制造全球功率最高、成本最低的电解槽，让绿氢成为重工业在经济上绕不开的选择。公司官方标语 “Making Molecules to Decarbonize Our World”
              也指向同一件事：把质子交换膜（PEM）电解做到工业规模，瞄准钢铁、化肥、氨、航运、航空和化工。


              核心产品是 HYPRPlant，一座完整集成的电解制氢工厂，以工厂预制撬装模块交付，涵盖所有工厂配套组件：电力转换、气体处理、水处理和热管理。HYPRPlant 提供三种标准容量：75 MW、100 MW 和
              120 MW。100 MW 版本每天约生产 50 吨绿氢。公司称，与其他电解槽方案相比，HYPRPlant 可把项目总安装成本最多降低 60%，并把交付到投运压缩到 6 个月以内。


              EH2 的商业模式把三件事拼在一起：产品销售（向项目开发商出售完整集成的 HYPRPlant 系统）、制造即服务（在 Devens 超级工厂生产电堆，同时在 Texas 制造工艺模块），以及在 2025 年收购
              Ambient Fuels 后，借助 Generate Capital 的 $400 million 融资安排支持联合开发和项目融资渠道。公司把自己放在既有 PEM
              竞争者和成本更低的中国碱性电解槽对面，主张其来自太阳能降本的工程经验能形成持久的效率和制造成本优势。截至 2026 年运行日期，EH2 总部位于 Massachusetts 的 Devens，在
              California 的 San Jose 有先导示范工厂，在 West Texas 有制造设施，并在 Spain、Denmark、Germany、Belgium、Australia 和 Brazil
              配有商业团队。
