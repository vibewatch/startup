  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群细分
        blocks:
          - type: paragraph
            body: >-
              Electric Hydrogen 的市场从设计上就很窄：产品是一座完整的 75 MW 到 120 MW
              电解槽工厂，只有大型资本项目才撑得起其单位经济性，因此买方画像限于有能力融资并运营百兆瓦级清洁氢设施的项目开发商、能源公司、公用事业公司和工业
              IPP。公司公开引流表单明确要求填写项目规模（MW）和行业类型，而表单中最小的项目规模区间（1–5 MW）远低于商业销售的 HYPRPlant 单元——这说明 EH2 更像是在筛选线索，而不是来者不拒。

              本次审阅的公开来源包中出现五类不同买方。eFuels 开发商（Infinium、HIF Global）购买完整制氢工厂，把它作为可持续航空燃料、e-methanol 或 e-diesel
              的原料生产资产。绿氨开发商（Synergen Green
              Energy）用产出的氢合成面向海运燃料和化肥出口市场的氨，尤其是欧洲和亚洲市场。欧洲能源公用事业公司（Uniper）寻求大规模电解能力，把它作为国家或区域氢能骨干网战略的基石。IPP
              和多元化能源公司（AES）在具体项目 FID
              之前，通过框架协议预留供应能力。第五类——炼厂、钢铁生产商、化工制造商等直接重工业用户——出现在引流表单和官网市场应用板块中，但本次审阅的公开材料没有出现这一类别的具名客户。

              从地域看，五个具名关系要么是美国注册项目，要么是一个大型欧洲项目（德国 Wilhelmshaven 的 Uniper）。不过，2025 年 Q3–Q4 公布的商业招聘显示，公司正在欧洲 / MENA
              和拉美积极开发管线。EH2 CEO Garabedian 在 2025 年底确认，欧洲天然气价格和 EU
              碳政策强制要求，使欧洲项目在近期比美国本土脱碳更有经济吸引力；几个美国注册客户项目（HIF、Synergen）实际上是在向欧洲买家出口氢产品。渠道触达完全依赖直接企业销售；公司未披露分销商、系统集成商或市场平台渠道。
