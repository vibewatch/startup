      - number: '7.4'
        title: 财务、模式与资本充足性风险
        blocks:
          - type: paragraph
            body: >
              Electric Hydrogen 的财务风险画像，是一家收入前、资本密集型工业制造商，销售周期长且不确定。公司不公开披露收入、毛利、现金烧钱、积压订单转化指标或库存水平。截至 2026 年 5
              月，所有已知融资合计超过 $750 million，包括股权轮、$100 million 公司信贷额度（HSBC 牵头，JPMorgan、Stifel 和 Hercules Capital 参与）、$65
              million DOE 支持（Trinity Capital 的 $50 million 设备融资加约 $15 million 拨款），以及 Generate Capital 提供的最高 $400 million
              项目融资（针对具体项目，表外）。公司称信贷额度用于支持制造和部署，DOE 设备融资用于 Devens 吉瓦工厂爬坡。


              核心财务风险，是现金跑道是否足以覆盖项目转化时间线。EH2 从首次入选到确认设备收入的销售周期，从公开证据看为 24–36+ 个月：Infinium 入选于 2025 年 5 月披露，首座工厂于 2026
              年初发货，目前仍在调试。Synergen FEED 于 2025 年 12 月签署，目标 2026 年 FID、2028 年底运营——意味着设备收入确认最早在 2027–2028 年。Uniper
              pre-FEED 于 2024 年 10 月启动，未给出 FID 日期，意味着潜在设备收入最早也在 2028 年。如果制造成本在 2026 和 2027 年持续发生，而设备收入确认有限，公司将需要追加融资。


              制造模式资本强度高。在没有披露绑定多个客户的订单积压情况下，运营 Devens 1.2 GW/year 吉瓦工厂并承担库存、人工和工装成本，会带来营运资本风险。Nel 对照数据（2025 年收入 NOK
              963M、经营亏损 NOK 1,365M）和 ITM 对照数据（收入 £26M、EBITDA 亏损 £33M、现金 £207M）说明，即便运营可信的 PEM 公司，在规模化期间也承受显著负利润率。EH2
              的成本结构不公开，但在 Devens 达到显著吞吐量之前，不太可能实质性好于 ITM。


              全行业背景放大了模式风险。ING 2026 年分析指出，OBBBA 之下，美国政府对清洁氢的支持实际上从约 $90 billion 降至 $28 billion。E2 清洁能源跟踪显示，2025 年取消了近
              $35 billion 清洁能源投资，是 2022 年以来最糟一年。全球电解槽制造能力每年超过 50 GW，而截至 2024 年底全球部署约 2 GW；这种结构性过剩会压低行业每个 OEM 的定价和毛利。PV
              Magazine 分析显示，2021 年中国 PEM/AWE 系统报价约 $303/kW，而西方替代方案为 $1,200–$1,400/kW；EH2
              降低总安装成本的叙事，必须顶住日益增强的中国出口野心，而且过去适用于中国电解槽的 25–30% 出口溢价可能在未来贸易动态下压缩。


              项目融资模式带来的营运资本风险很高。EH2 需要项目层面的 FID 来确认设备收入，但 FID 取决于承购协议、可再生电力合同、许可和贷款人尽调周期，这些都不在 EH2 控制之内。FID 若长期冻结——无论源于
              45V 不确定性、承购市场疲弱，还是银行层面对氢风险的回避——都会直接推迟 EH2 的设备收入。


              没有发现欺诈、利润操纵或未经授权资本部署的证据。EH2 是私营公司，没有 SEC 备案义务，这意味着外部无法用公开来源独立验证其财务控制。
