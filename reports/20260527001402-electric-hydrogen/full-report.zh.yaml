  - id: FI001
    title: 收入模型桥
    type: flow
    layout: wide
    summary: >-
      客户项目活动如何转化为 EH2 收入和毛利。EH2 在设备采购和调试阶段参与；确认收入取决于 FID 和里程碑付款。项目开发渠道（收购 Ambient 后）增加了第二条转化路径：由 EH2
      自己发起项目，从而绕开客户项目融资依赖。
    data:
      nodes:
        - id: customer-project
          label: 客户项目（开发商：Infinium / HIF / Synergen / Uniper / AES）
        - id: feed-prefeed
          label: FEED / pre-FEED 接洽（EH2 工程服务；收入很小或没有收入）
        - id: fid-trigger
          label: 客户达到 FID（电力 PPA + 承购 + 项目融资完成）
        - id: equipment-order
          label: 触发有约束力的 HYPRPlant 采购订单（EH2 开始里程碑开票）
        - id: manufacturing-delivery
          label: 电堆制造（Devens）+ 撬装模块制造（Texas）+ FAT + 发货
        - id: commissioning-handover
          label: 现场调试 + 装置移交（最终里程碑付款）
        - id: revenue-gp
          label: EH2 确认设备和调试收入 / 毛利
        - id: ambient-path
          label: 项目联合开发路径（EH2 发起 + 通过 Generate Capital 融资）
        - id: dev-fee
          label: 开发费 / 资产出售 / 股权收益分成 → 独立收入流
      edges:
        - from: customer-project
          to: feed-prefeed
          label: 入选 / 获得 FEED
        - from: feed-prefeed
          to: fid-trigger
          label: 工程降险（12–36+ 个月）
        - from: fid-trigger
          to: equipment-order
          label: FID 触发绑定订单
        - from: equipment-order
          to: manufacturing-delivery
          label: 制造爬坡；里程碑开票
        - from: manufacturing-delivery
          to: commissioning-handover
          label: 装置交付和现场组装
        - from: commissioning-handover
          to: revenue-gp
          label: 最终验收；剩余里程碑付款
        - from: ambient-path
          to: dev-fee
          label: 项目发起 → 资本部署 → 费用 / 收益分成
    approximationNotes: FID 触发节点是管线风险最集中的位置：政策窗口压缩（45V 截止日期）、承购经济性、项目融资可得性都可能卡住转化。没有可用于校准转化时间的已确认收入数据。
    claimRefs:
      - CI001
      - CI006
      - CI007
      - CI009
      - CI034
      - CI035
  - id: FI002
    title: 单位经济性桥
    type: flow
    layout: wide
    summary: 一座 100 MW HYPRPlant 从制造投入到交付毛利的定性成本栈节点。所有利润率节点均标为不可得；Nel 和 ITM 的同业公司数据是唯一公开代理，两者都指向低利用率阶段短期经济性深度为负。
    data:
      nodes:
        - id: direct-materials
          label: 直接材料：PGM 催化剂、MEA、钛组件、辅助系统材料（成本未知）
        - id: stack-manufacturing
          label: Devens 电堆制造：人工、设施开销、测试（成本未知；名义产能约 1.2 GW/年）
        - id: skid-fabrication
          label: Texas 撬装模块制造：工艺模块、电力转换、水处理（成本未知）
        - id: logistics-commissioning
          label: 物流、现场组装和调试人工（成本未知）
        - id: warranty-service-provision
          label: 质保准备和交付后服务义务（成本未知）
        - id: cogs-total
          label: 单座装置总 COGS（未披露；同业代理：Nel 和 ITM 深度为负；EH2 为空）
        - id: asp
          label: 每座 100 MW 装置已实现 ASP（未披露；代理：Synergen 声称 TIC 低于 $1,000/kW）
        - id: gross-profit
          label: 单座装置毛利（未披露；同业强烈暗示当前规模下为负）
      edges:
        - from: direct-materials
          to: cogs-total
          label: 材料销售成本
        - from: stack-manufacturing
          to: cogs-total
          label: 制造开销吸收
        - from: skid-fabrication
          to: cogs-total
          label: 制造与子组件装配
        - from: logistics-commissioning
          to: cogs-total
          label: 现场成本
        - from: warranty-service-provision
          to: cogs-total
          label: 质保计提
        - from: asp
          to: gross-profit
          label: 收入减 COGS
        - from: cogs-total
          to: gross-profit
          label: 扣除成本
    approximationNotes: >-
      这座桥中所有美元值均为空；公开来源只披露了结构性成本流。Nel 2025 年收入 NOK 963M、经营亏损 NOK 1,365M，ITM 收入 £26M、EBITDA 亏损 £33M，是同阶段 PEM OEM
      最可用的代理，两者都显示短期利润率深度为负。若 EH2 的制造规模目标和 Devens 产能能完全利用，单位经济性会明显不同，但利用率数据并不公开。
    claimRefs:
