      - number: '1.2'
        title: 创始人、领导梯队与治理信号
        blocks:
          - type: paragraph
            body: >-
              Electric Hydrogen 的三位创始人行业履历很硬。Raffi Garabedian（CEO 兼联合创始人）曾在 First Solar 担任 CTO，任内推动组件成本从 $0.65/watt 降到
              $0.20/watt，并把年产量从 1.9 GW 扩到 5.5 GW。David Eaglesham（CTO 兼创始人）是连续清洁技术技术人，曾任 Breakthrough Energy Ventures
              驻场创业者；在 1.9 GW 时代，他先于 Garabedian 担任 First Solar CTO。Derek Warnick（CFO 兼联合创始人）曾任 FGE Power CFO，并在
              Breakthrough Energy Ventures 担任公司孵化岗位。三位创始人来自相同机构背景，商业化、技术和资本职责互补，和 EH2 试图在电解槽制造中复刻太阳能行业降本纪律的目标相吻合。


              更广的领导层公开可查且分工清晰。Beth Deane（Chief Legal Officer）在 First Solar 和 Leeward Renewables 做过 10 年项目开发法律工作。Jason
              Mortimer（SVP Commercial）曾在 Level10 Energy 负责销售，并在 SunPower 工作 10 年。Renata Naoumov（Chief People Officer）曾把
              HeartFlow 从 100 人扩到 500 人。Jigish Trivedi（SVP Manufacturing）负责 Devens 生产。Jacob Susman 在 EH2 于 2025 年收购
              Ambient Fuels 前创立了该公司，如今以 SVP Development 身份负责项目开发。


              治理披露有限。EH2 通过 Governance and Sustainability 页面发布 Supplier Code of Conduct、Code of Business Conduct 和 2024
              Sustainability Report，但没有公开董事会构成、投资者投票权，也没有披露其庞大战略投资者财团所附带的具体治理条款。关键人风险集中在创始三人组，尤其是
              Garabedian；他是商业战略和市场定位的公开门面。
