      - number: '8.3'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              EH2 在 2023 年 10 月 Series C 中融资约 $380M；这是当时绿氢领域单笔最大融资，并以约 $1B 隐含估值确立了公司独角兽身份。Series C 之前，EH2 在 Series A 和 B
              合计融资约 $170M。若合并股权、DOE 补助（$46.3M AACI 补助加 $18.3M 可转让制造业税收抵免）、设备融资贷款方提供的 $100M 信贷额度（2024 年 7 月），以及 Generate
              Capital 项目融资合作（最高 $400M，2025 年 9 月公告），公司成立以来累计融资超过 $750M。


              分层融资结构释放的是双面信号。正面看，成熟机构资本（Breakthrough Energy Ventures、Equinor、早期轮次中的 Rio Tinto，以及通过信贷额度进入的设备融资方）愿意在多个阶段承销
              EH2。Generate Capital 合作明确设计为项目层融资，而非公司股权；这限制了股权稀释，同时为原本可能因 EH2 仍无收入而犹豫的项目开发商提供可融资性支持。


              负面看，自 2023 年 10 月以来没有披露任何股权轮，意味着股权结构表和优先权堆叠不透明。新投资者看不到清算优先权、反稀释保护，或信贷额度附带限制性条款的程度。入场纪律需要：谈妥完整股权结构透明度、相对
              $1B 参考价至少折价 20–35%，并在投放全部资金前，把合同里程碑绑定到 Infinium Roadrunner 运行数据和首个 FID。
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV021
              - CV030
      - number: '8.4'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              未来 3–5 年投资周期里，三种情景框定了 EH2 可能的估值区间。


              乐观情景要求：Infinium Roadrunner 100 MW 工厂在 2026 年 H1 交出强运行数据（可用率 >92%、产量达到铭牌），Synergen 和 HIF 均在 2026 年底前达成
              FID，政策逆风企稳（OBBBA 后 45V 不再进一步收紧），且 EH2 到 2027 年确认首笔重要商业设备收入。上述条件成立时，2028–2029 年融资轮或 M&A 事件若按 2028
              年预计收入（$200–400M）的 8–12× 定价，将对应 $1.6–4.8B 企业价值。以 $750M 入场，回报约 2–6×。


              基准情景假设 Infinium 运行数据为正但不惊艳（无重大故障），Synergen 或 HIF 中一个在 2026–2027 年达成 FID，另一个滑到 2027–2028 年，且 EH2 依靠项目融资和
              DOE 补助支撑，2027 年仍处于收入前运营。2029 年战略交易或 Series D 若按 2029 年收入（$50–120M）的 4–6× 定价，将对应 $200–720M 企业价值。$750M
              入场的回报约 0.3–1×；股权投资者接近打平或小幅亏损。


              悲观情景包括：Infinium 工厂遇到重大投运问题并损害可融资性；或者两个及以上具名项目滑过 2028 年（OBBBA 45V 窗口）；或者 EH2 在商业收入到来前需要过桥融资维持运营。$300–600M
              区间的困境重组或降估值轮，意味着 $750M 入场亏损 20–60%。
