      - number: '3.2'
        title: 竞争者画像、规模信号与战略定位
        blocks:
          - type: paragraph
            body: >
              最相关的直接同行群体成熟度不同，但野心相近。Nel 仍是装机基础领导者，全球有超过 3,800 台电解槽，但其 2025 年年报明显不利：收入下降 31% 至 NOK 963 million，订单积压下降 18%
              至 NOK 1,319 million，项目取消叠加低订单流入，迫使 Heroya 碱性产线临时停产。thyssenkrupp nucera 从相反角度切入市场：超过 600 个项目、超过 10 GW
              已安装产能、超过 3 GW 合同产能、从 FEED 到运营的服务，以及新披露的 Spain 300 MW 项目，金额为低三位数百万欧元。ITM 仍是有分量的 PEM 专家，而非边缘创业公司：公司称已被委托数个
              100 MW 工厂，FY2025 结束时有 £145.1 million 积压订单和 £207 million 现金，已交付或在建超过 400 MW，尽管仍因工厂成本吸收不足而录得毛亏。


              Plug 和 Accelera 展示了综合氢平台如何与电解业务相交。Plug 在 Project Quantum Leap 下把 2025 年战略收窄到电解槽、物料搬运和氢燃料，并在当年出货超过 185
              MW，但其官方回顾读起来更像是在艰难市场中的重新聚焦求生故事。Accelera 以油气级安全、数字监控和 Cummins 背书的财务实力做营销，拥有超过 500,000 小时运行电堆时间和 60 多套已部署
              HyLYZER；但同样的市场疲弱推动 Cummins 停止约 1 GW 产能的商业电解槽努力，Canary 对此有报道。这是强反向证据，说明可信度和制造履历本身并不能创造持久需求。


              相邻和既有企业层同样强。Bloom 的攻击点是电力效率，不是交钥匙工厂标准化：公司称 Bloom Electrolyzer 是效率最高的商业规模电解槽，Bloom 年制造能力超过 2 GW。Topsoe
              的攻击点是下游集成：其 SOEC 面向氨、甲醇和 SAF 设计，在有余热时承诺比低温电解效率高 20-30%，并获得 500 MW Herning 工厂支持。Linde 和 Air Products 更难被
              EH2 撬动，因为它们的竞争主张不只是电解槽本身，而是外围的工业气体系统、物流和客户信任。
