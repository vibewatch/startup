      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >
              EH2 市场的增长驱动因素在美国之外更有利：EU Renewable Energy Directive（RED III）、欧盟成员国 IPCEI 计划和英国可持续航空燃料强制令（2030 年 10%
              SAF）等欧洲监管要求创造了有约束力的承购义务，能支撑带溢价的绿氢项目经济性。欧洲天然气价格经常是美国价格的三到四倍，压缩了绿氢与灰氢的成本差；在美国，如果不激进使用 45V 生产税收抵免，目前还做不到这一点。


              美国市场面临多层约束，EH2 CEO 已明确承认。2025 年生效的 One Big Beautiful Bill Act（OBBBA）把 45V 开工截止日期从 2033 年 1 月 1 日提前到 2028 年
              1 月 1 日——项目开发窗口被压缩了五年。这在结构上不利于大型绿氢项目，因为这类项目在破土动工前需要两到三年完成许可、FEED 和项目融资。同时，DOE 提议削减或取消七个 Regional Clean
              Hydrogen Hubs 中四个的资金，涉及原定 $7 billion 承诺中近 60%。


              中国碱性电解槽制造商在国内提供约 $303/kW 的设备（2021 vintage），大约是西方 PEM 系统 $1,200–1,400/kW
              的四分之一，且交付后的项目经济性可比。虽然贸易限制压低了中国厂商对寻求本土内容要求或政府补贴的美国和欧盟项目的直接竞争，但价差长期威胁西方电解槽利润率。BloombergNEF 预测，已公告全球制造产能为
              52.6 GW（2024），而近期需求预测只有约 5 GW，说明供给严重过剩，将持续压低西方 OEM 定价。


              反向信号还得到多项事实印证：Cummins Inc. 在 2024 年 11 月退出商业电解业务（美国和 Spain 合计 1 GW 制造产能）、2025 年约 50 个公开宣布的项目取消，以及 2025
              年美国清洁能源投资放弃总额达 $34.8 billion。用 ING 的话说，绿氢行业仍处在“试点阶段”——采用路径更像多年商业成熟过程，而不是政府高目标暗示的短期增长曲线。
