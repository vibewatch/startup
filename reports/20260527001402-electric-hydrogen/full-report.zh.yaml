          low: 3
          mid: 5
          high: 8
          unit: mtpa
          note: 由 IEA >200 个已承诺项目推导；项目流失不确定性带来宽区间
        - label: 各国政府合计目标 — 2030 年愿景
          low: 20
          mid: 25
          high: 30
          unit: mtpa
          note: 各国政府承诺汇总；ING 指出这些目标“很可能需要重置”；高度乐观
