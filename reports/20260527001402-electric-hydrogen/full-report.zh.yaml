      - number: '7.3'
        title: 合作伙伴、客户集中与依赖风险
        blocks:
          - type: paragraph
            body: >
              Electric Hydrogen 的整个近期商业管线集中在少于五个具名项目关系中。Infinium Project Roadrunner（100 MW，首个商业工厂，2026
              年调试）是唯一已经发货并到达现场的工厂。HIF 的 Texas e-fuels 设施、Synergen 240 MW（两套 120 MW 工厂）氨 FEED（目标 2026 年 FID）以及 Uniper 200
              MW Green Wilhelmshaven pre-FEED（2024 年 10 月启动，未公布 FID）共同构成全部公开已知近期管线。AES 1 GW 框架协议是有条件预留，不是有约束力的采购订单；EH2
              还通过收购 Ambient Fuels 在 10+ 个美国州开发约 15 个项目，但这些项目没有具名，也没有公开处在高级 FEED 阶段。


              因此，按任何私营公司标准看，客户集中风险都极端。单个具名项目的流失——无论原因是项目发起方财务失败、失去承购、许可失败，还是 FEED 到 FID
              转化失败——都会移除近期潜在设备收入中的相当大一部分。Infinium Roadrunner 背靠 Brookfield Asset Management 和 Breakthrough Energy
              Catalyst；HIF Global 背靠 Porsche AG 和大型能源投资者；Synergen 是相对年轻的 Houston 开发商（成立于 2022 年）；Uniper
              是大型欧洲公用事业公司。Synergen 作为最新、最小的项目发起方，比 Brookfield 或 Uniper 承担更高的开发商执行和融资风险。


              Generate Capital 合作关系提供最高 $400 million 项目融资，但其结构是由基础设施投资者（自 2014 年以来募集 >$14B）承诺向与 EH2 共同开发的氢项目投放资本，而不是给
              EH2 自身提供股权兜底。合作关系取决于 Generate 自己的投放决定、市场条件以及承销项目经济性的能力。Generate Capital 作为单一主导项目融资交易对手，在项目资本层面形成集中风险。


              关键供应商依赖包括 Titan Production Equipment（Texas 撬装制造，单源）、The Weitz Company（Roadrunner EPC）和
              Ingeteam（欧洲部署中提及的西班牙电力系统技术供应商）。作为欧洲电力电子合作伙伴，Ingeteam 的排他性、最低承诺或可替代性没有公开说明。针对欧洲项目，EH2
              已确认正在开发本地供应链伙伴，以满足本地内容预期，但这些关系没有披露。


              云和数字平台依赖没有公开说明；EH2 不披露其工厂监控、SCADA 或远程诊断架构，形成未验证的网络安全和运营韧性缺口。大型工业氢工厂是流程安全关键环境，控制系统漏洞可能造成不成比例的物理后果。


              劳动力和关键人物风险在高层有意义。CEO 兼联合创始人 Raffi Garabedian 是主要公开声音、技术愿景持有者和投资者关系负责人。全球商务 SVP Jason Mortimer 以及新聘的 Europe
              和 LatAm 总经理，代表公司在 2025 年押注地域扩张，但他们在 EH2 内部的公开履历相对有限。公司员工 >300 人，但对一家资本密集型、规模化工业制造商而言，高管团队偏小。Nel 到 2025
              年底把员工削减至 346 人——这是一个基准警示，说明行业会惩罚相对于订单转化过度招聘的公司。
