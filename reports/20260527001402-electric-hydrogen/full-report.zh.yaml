  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 技术验证、制造规模、财务风险和政策逆风四个输入因素共同指向继续研究建议；若要上调为正向入场建议，必须连续穿过两道门槛：Infinium 运营数据，以及至少一个 FID。
    data:
      nodes:
        - id: tech
          label: 技术验证（正向）
          description: DNV 验证的 HYPRPlant；美国首个 100 MW PEM 于 2026 年在 Infinium Roadrunner 投运
        - id: scale
          label: 制造规模（正向）
          description: Devens 工厂 1.2 GW / 年；从电堆到制氢厂的垂直一体化模式
        - id: finance
          label: 财务风险（负向）
          description: 未披露收入；$1B 估值标记已陈旧；股权结构表不透明；信贷额度有契约约束
        - id: policy
          label: 政策逆风（负向）
          description: OBBBA 将 45V 截止期设在 2028 年；约 50 个项目取消；蓝氢竞争力更强
        - id: rec
          label: 建议：继续研究（中等置信度，高风险）
          description: 证据支持把机会纳入研究，但不足以按 $1B 参考价格入场
        - id: gate1
          label: 门槛 1 — Infinium 运营数据
          description: 可用率 >92%，达到铭牌产量，前 90 天无重大衰减
        - id: gate2
          label: 门槛 2 — 首个 FID（Synergen 或 HIF）
          description: 2026 年底前或 2027 年上半年完成项目融资关闭，并确认 FID
        - id: upgrade
          label: 上调至有条件正向（按 $600–750M 入场）
          description: 两道门槛均已跨过；按较 $1B 参考标记折让 20–35% 谈价格
      edges:
        - from: tech
          to: rec
          label: 支持判断，但单独不够
        - from: scale
          to: rec
          label: 制造杠杆真实存在，但 FID 前产能闲置
        - from: finance
          to: rec
          label: 财务不透明，挡住高置信度入场
        - from: policy
          to: rec
          label: OBBBA 逆风压缩美国项目窗口
        - from: rec
          to: gate1
          label: 首要跟踪催化剂
        - from: gate1
          to: gate2
          label: 运营数据降低 FID 决策风险
        - from: gate2
          to: upgrade
          label: 以克制价格确认入场
    claimRefs:
      - CV001
      - CV009
      - CV010
      - CV027
      - CV028
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: EH2 隐含企业价值从 $300M（困境悲观情景）到 $4.8B（多个 FID 且取得首笔商业收入的乐观情景）不等；基准情景为 $200–720M，意味着按 $750M 入场会亏损或接近打平。
    data:
      items:
        - label: 悲观：困境重组 / 下轮融资
          value: 450
          unit: $M (midpoint of $300–600M range)
        - label: 悲观上沿：部分恢复
          value: 600
          unit: $M
        - label: Series C 参考估值（2023 年 10 月）
          value: 1000
          unit: $M
        - label: 基准：2029 年收入 4–6×
          value: 460
          unit: $M (midpoint of $200–720M)
        - label: 乐观下沿：2028 年 $200M 收入 8×
          value: 1600
          unit: $M
        - label: 乐观上沿：2028 年 $400M 收入 12×
          value: 4800
          unit: $M
    claimRefs:
      - CV032
      - CV033
      - CV034
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 从悲观到乐观的估值区间为 $300M–$4.8B；建议入场价走廊 $600–750M 介于悲观和基准情景之间，将下行限制在约 0.5–0.8×，同时保留乐观情景下 2–6× 的上行。
    data:
      items:
        - label: 悲观情景退出价值
          low: 300
          mid: 450
          high: 600
          unit: $M
        - label: 基准情景退出价值（最可能）
          low: 200
          mid: 460
          high: 720
          unit: $M
        - label: 乐观情景退出价值
          low: 1600
          mid: 3200
          high: 4800
          unit: $M
        - label: 建议入场价走廊
          low: 600
          mid: 675
          high: 750
          unit: $M
    approximationNotes: 区间端点是基于可比 OEM 收入倍数（Nel、ITM、Plug）和假设的 EH2 收入轨迹推导的情景估计。没有公司指引或私有财务数据。不确定性区间很宽；所有数值都应视为方向性判断，而非投资级预测。
    claimRefs:
      - CV032
      - CV033
      - CV034
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: EH2 在技术差异化和制造规模上得分较强，但在财务透明度、FID 转化和政策环境上偏弱；综合投资就绪度为中低，仍需等待 Infinium 投运数据和首个 FID。
    data:
      items:
        - label: 技术差异化
          value: High
          note: DNV 验证；美国首个 100 MW PEM 于 2026 年投运
        - label: 制造规模
          value: Strong
          note: Devens Gigafactory 1.2 GW / 年；垂直一体化
        - label: 具名项目管线
          value: 4 pre-FID projects
          note: Infinium、HIF、Synergen、Uniper；截至 2026 年中均未达到 FID
        - label: 财务透明度
          value: Low
          note: 未披露收入、EBITDA 或股权结构表
        - label: 政策环境（美国）
          value: Deteriorating
          note: OBBBA 2028 年 45V 截止期；全球约 50 个项目取消
        - label: 可比同行健康度
          value: Poor
          note: Nel / ITM / Plug 均处于经营亏损；板块情绪为负
        - label: 退出可选性
          value: Medium
          note: M&A 可行；IPO 窗口最早到 2028 年以后才会重开
        - label: 整体投资就绪度
          value: Medium-Low
          note: 继续研究；入场需要 Infinium 数据 + FID 催化剂
    claimRefs:
      - CV001
      - CV009
      - CV010
      - CV015
      - CV016
      - CV017
      - CV031
      - CV035
