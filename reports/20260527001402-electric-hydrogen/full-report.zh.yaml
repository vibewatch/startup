  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 产品 / 模式
      - 公开价格或资本开支信号
      - 已包含能力
      - 合同 / 商业模式
      - 公开未知项
      - 竞争含义
    rows:
      - - Electric Hydrogen HYPRPlant
        - 声称总安装成本最高比替代电解槽方案低 60%；无公开标价
        - 完整工厂、辅助系统、模块化制造、调试叙事
        - 项目定制 OEM 合同，含开发支持；确切保修条款和收入实现条款未公开
        - 未公开披露实际 ASP、保修定价或服务毛利
        - 竞争点在整厂经济性，而不是透明的电堆价格
      - - Nel
        - 来源包未披露公开标价；年报展示的是订单流入、在手订单和取消订单，而不是目录价
        - PEM 与碱性产品组合，并可搭配 EPC 合作方案
        - 项目定制订单、FEED 研究、明确口径的在手订单
        - 实际定价、折扣和服务绑定率仍未披露
        - 规模不能消除定制化商务谈判
      - - thyssenkrupp nucera
        - 300 MW 西班牙订单仅描述为低三位数百万欧元区间
        - 电解槽、FEED、LCOH 测算、撬装工厂、生命周期服务
        - 大型工业供货合同，收入确认绑定项目 FID 和多年节奏
        - 模块级价格未公开透明
        - 工业买家看起来愿意为集成服务和交付买单，不只看低电堆资本开支
      - - ITM Power
        - 未公开标价；年报通过产品销售、维护和咨询合同变现
        - PEM 产品加维护和咨询
        - 产品销售、维护合同、可行性 / FEED 工作的组合
        - 按 MW 区间的确切定价或保修结构未公开
        - 上市公司披露好于 EH2，但客户层面的定价仍不透明
      - - SOEC 替代方案（Bloom / Topsoe）
        - 竞争点是更低 LCOH 和效率主张，而不是可见目录价
        - 效率叙事、废热整合、性能保证、下游电子燃料整合
        - 项目定制商务条款，强依赖工艺配置
        - 未公开可比的每 MW 交钥匙价格
        - 只要工艺经济性主导买方测算，即使没有标价透明度也能赢单
      - - Repsol 自建基准
        - Petronor 一座 100 MW 炼厂一体化工厂为 €292m
        - 电解槽嵌入既有工业综合体和氢气需求底盘
        - 业主主导资本开支分配，而不是购买供应商目录产品
        - OEM 拆分、服务包和运营假设未披露
        - 说明大型既有企业会把交钥匙 OEM 报价同自集成资本开支对标
      - - 灰氢 / 蓝氢现状
        - 在需求疲弱地区，灰氢仍显著便宜于绿氢；美国部分地区的蓝氢受益于更强的政策经济性
        - 既有工厂、原料获取和工业运营基础
        - 继续运营现有资产，或用 CCS 改造，而不是现在购买绿色电解设备
        - 碳成本轨迹和长期政策韧性因司法辖区而异
        - 最强基准竞争者，因为它完全不需要购买新的电解槽
