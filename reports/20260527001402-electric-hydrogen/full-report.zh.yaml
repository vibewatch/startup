  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、政策与法律风险
        blocks:
          - type: paragraph
            body: >
              Electric Hydrogen 处在十年来最波动的清洁能源政策交叉点。公司的商业模式预设项目能够在支持性的美国激励结构下达到最终投资决策，尤其依赖《通胀削减法案》引入的 45V 氢气生产税收抵免。2025
              年签署的 One Big Beautiful Bill Act（OBBBA）从根本上改变了这一假设。


              OBBBA 将 45V 开工截止期从 January 1, 2033 提前到 January 1,
              2028，五年压缩同时挤压许可、设计定稿、融资和采购时间表。行业组织警告，截止期变化会把绿氢投资导向激励框架更稳定的欧洲和亚洲。对 EH2 管线中的大型 PEM 项目而言——单是 FEED
              就可能需要六到十二个月，一个 100–240 MW 设施的项目融资通常还需要 18–36 个月商业和技术尽调——压缩后的窗口是重大的执行和 FID 风险，不只是政策不便。


              H2Hubs 项目增加了第二层政策风险。DOE 在 2025 年初确认，正在考虑减少或取消原先入选七个枢纽中四个的资金——California、Mid-Atlantic、Pacific Northwest 和
              Midwest——涉及原 $7 billion 联邦承诺中近 60%。H2Hubs 计划的总项目成本从约 $14 billion 上升到近 $50 billion；OIG 在 2025 年 6
              月发布批评性报告，指出尽管有超过 250 名联邦员工和 165 名承包商管理该计划，却缺少正式的项目级风险评估和劳动力计划。EH2 近期美国管线包括 HIF 的 Texas e-fuels 设施和
              Synergen 的氨项目，两者都不直接属于 H2Hub，但都依赖同一广泛政策环境和投资者信心，而 H2Hubs 原本正是为了锚定这些信心。


              OBBBA 同时加强了 45Q 碳封存抵免，使蓝氢相对绿氢更具竞争力；ING 分析据此预计，到 2030 年清洁氢构成中超过 90%
              将为蓝氢。这种向蓝氢倾斜的结构性变化，会缩小一家纯绿氢设备公司的可服务项目市场。


              监管风险不止美国联邦政策。EH2 正积极推进欧洲项目——德国 Uniper 200 MW pre-FEED、2025 年 9 月任命的总经理 Bruno Forget 负责的欧洲和 MENA 潜在管线项目，以及
              2025 年 12 月任命的总经理 da Rocha Oliveira 负责的 LatAm 扩张。欧洲 RED III 强制要求和欧洲氢能银行提供更稳定的需求信号，但本地化要求是真实存在的：CEO
              明确表示，EH2 必须「把我们大量供应链转到欧洲，交给欧洲供应商」，这会带来供应链重构成本和执行风险。EH2 没有公开披露任何商业项目的环境许可、安全论证或危险区域分类批准；这些尽调项仍未验证。


              目前没有发现 EH2 特定的活跃诉讼、监管执法行动、知识产权纠纷、OSHA 或 EPA 制裁的公开证据。不过，公司运营的氢气处理设备受氢安全规范约束（NFPA 2、控制系统适用 IEC 62443），而调试首套
              100 MW 级工厂自带事故和责任风险，可能在 Roadrunner 调试期间或之后暴露。需要持续监测。
