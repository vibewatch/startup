  - id: TI004
    title: 资本充足性表
    columns:
      - 资本工具
      - 披露金额
      - 日期 / 提供方
      - 性质和条件
      - 前瞻影响
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Covers all publicly disclosed financing instruments; the Company Overview funding chronology provides additional
        context on round-by-round equity history not duplicated here.
    rows:
      - - Series C 股权轮
        - $380 million
        - October 2023；Fortescue、Fifth Wall、Energy Impact Partners 领投；14+ 家投资者组成的财团
        - 非受限股权；据称超额认购；确立约 $1B 估值；公司称截至关闭时累计融资超过 $600M
        - 最大单笔资本事件；假定到 2026 已大部分投入 Devens 工厂爬坡、员工扩张和商业化建设；当前剩余余额未披露
      - - 公司信用额度
        - $100 million
        - 2024；HSBC 牵头；J.P. Morgan、Stifel Bank、Hercules Capital 参与
        - 循环或定期信用额度；CFO 称其是 “Electric Hydrogen 获得资本的能力和整体业务成熟度的一次阶跃变化”；契约条款未公开
        - 提供流动性缓冲；可用性受契约和贷款方审查约束；除非 EH2 已提款，否则不代表完全已提取资本
      - - DOE Clean Electrolysis 赠款
        - $46.3 million
        - Bipartisan Infrastructure Law 项下入选；pre-2024 爬坡前宣布；绑定里程碑
        - 非稀释性政府赠款；绑定 Devens 制造扩产里程碑；不是无条件现金
        - 代表有意义的非稀释性资本，但里程碑条件带来交付风险；H2Hubs 政治不确定性是客户的单独政策风险，不属于该工具
      - - DOE 48C 可转让税收抵免
        - $18.3 million
        - Inflation Reduction Act；与 DOE 赠款同步宣布
        - 可转让税收抵免；EH2 可出售或转让给第三方买家变现；价值相对确定且偏短期
        - 提供明确的短期现金流入；对拥有成熟 CFO 的公司来说，变现路径直接；增加有效流动性
      - - Trinity Capital 设备融资
        - $50 million
        - 2024；Trinity Capital（专业金融）
        - 有担保设备融资；由 Devens 制造资产支持；债务类工具
        - 为资产负债表增加杠杆；还款义务带来固定成本负担；相对融资总额减少净自由现金；条款未公开披露
      - - Generate Capital 项目融资合作
        - 最高 $400 million
        - 随 Ambient 收购于 September 2025 宣布
        - Generate Capital 自有基础设施投资资本；部署在项目层面，不进入 EH2 公司资产负债表；EH2 赚取项目开发经济权益，而不是直接收到资本
        - 制造需求侧杠杆，但不是 EH2 公司流动性；如果在模型中把它误标为 EH2 资本，会大幅高估流动性
    notes: >-
      EH2 公开称已获得“融资超过 $750 million”。该数字把多个流动性画像、到期日和条件不同的工具汇总在一起，包括股权、债务、赠款、税收抵免和设备融资。Generate Capital $400M 另行加在 $750M
      公司融资数字之外，且不会流入 EH2 公司资产负债表。烧钱速度、当前现金和现金跑道未公开，是资本充足性尽调中最重要的一项请求。
