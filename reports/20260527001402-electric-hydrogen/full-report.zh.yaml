  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 乐观论点
      - 悲观反驳
      - 哪些证据会改变判断
    rows:
      - - 美国首座 100 MW PEM 工厂投产（Infinium Roadrunner 2026）
        - 单一数据点；尚未确认收入；一座商业工厂不能证明经济性可复制
        - 3+ 座工厂达到铭牌产出，并披露正毛利率
      - - DNV 独立验证：HYPRPlant“在市场上非常有竞争力且独特”（2025 年 7 月）
        - 技术验证 ≠ 商业可融资性；项目开发商仍需要 FID 融资
        - 首个全规模（≥100 MW）FID，并完成第三方项目融资交割
      - - 1.2 GW/year Devens 超级工厂让制造成本领先所有西方同行
        - 订单兑现前工厂闲置；收入前固定成本负担会放大亏损
        - 工厂利用率 >50%，并披露确定积压订单 > $500M
      - - Generate Capital 最高 $400M 项目融资降低公司稀释风险
        - 项目融资结构增加共同投资复杂度，并可能给 Generate Capital 带来同意权
        - 首笔项目融资提款公布，且项目经济性为正
      - - 4 个具名项目合作（Infinium、HIF、Synergen、Uniper）覆盖美国和欧洲
        - 4 个项目均处于 FID 前；CEO 在 2025 年承认需求已低迷 18 个月
        - 到 2026 年底，两个或更多项目达成 FID，并披露合同金额
      - - 累计融资 >$750M，包括 DOE 拨款和信贷额度
        - 未披露收入；融资来源可能有契约，限制战略灵活性
        - 首次商业设备交付实现正毛利率
      - - 电解槽安装成本目标 ≤$400/kW；相对 Repsol/Linde/Accelera 规模具备竞争力
        - 成本目标由公司声明，未经审计；没有独立 COGS 披露
        - 融资包中披露第三方成本审计或可比项目定价
      - - 欧洲扩张（Uniper 200 MW、拉美）分散美国政策集中风险
        - 欧洲需求同样取决于项目 FID；EH2 还没有欧洲制造基地
        - 欧洲项目达成 FID，或 EH2 建立欧盟制造合作关系
    notes: 论点来自公开披露；财务主张基于公司公告和可比 OEM 文件；无法获得私有财务数据。
