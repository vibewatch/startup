      - number: '4.4'
        title: 公开牵引力、证据缺口与财务结论
        blocks:
          - type: paragraph
            body: >
              截至 2026 年本报告生成时，EH2 拥有绿氢 PEM 初创公司中最深的具名项目管线，但所有有公开证据的项目订单仍处在收入前阶段。Infinium Project Roadrunner 的 100 MW
              HYPRPlant 进展最远：该工厂已发货，在 EH2 的 Texas 制造设施完成水压测试和质量流程，并截至 2026 年在 Texas Pecos 现场调试。商业 e-fuels 生产目标为 2027
              年。HIF Global Texas e-Fuels 设施的选择结果于 2025 年 9 月公布，但未披露 FID 日期。Synergen 的 240 MW FEED 协议（两套 120 MW
              HYPRPlant）目标是在 2026 年完成 FID，并在 2028 年底前商业运营。Uniper 的 Green Wilhelmshaven pre-FEED 于 2024 年 10 月启动，目标 2028
              年投产。四个项目都一样：确认设备收入取决于客户达到 FID，并触发按里程碑付款的时间表。


              2023 年 10 月 Series C 披露的 5+ GW 预留数字没有更新。公司没有公开发布管线更新、积压订单数字、订单簿拆分或订单出货比。2024 年初 AES 的 1 GW 框架供应协议给予 AES
              下单权利——它不是有约束力的采购订单。在多数会计处理下，框架供应协议和 FEED 协议是合同阶段门，而不是可确认收入的事件。它们能否转化为真正依赖 FID 的采购订单，是 EH2 财务模型的根本商业执行风险。


              围绕六项内容要求，财务结论如下。收入质量：EH2 拥有设备销售、服务以及收购 Ambient 后的项目开发这一正确组合，但收入仍深处商业化前阶段。具名项目处在 pre-FEED 和 FEED
              阶段，调试时间线跨多年，意味着大多数情况下，重大收入确认很可能要到 2027 年或更晚。毛利路径：公司没有披露任何毛利，公开 PEM 同业（Nel、ITM）在低利用率阶段呈现清晰的负毛利模式，这强烈说明 EH2
              当前大概率仍在以负毛利烧钱。转正毛利需要工厂利用率远高于当前水平，并靠高吞吐制造降成本——这也是 First Solar 在光伏中走过的路径，耗时数年。资本强度：EH2 模式资本强度极高；每套 HYPRPlant
              都要先投入制造资本，之后才收到里程碑付款，而项目开发渠道需要更有耐心的资本。尽调阻碍：最大阻碍包括：(1) 当前烧钱速度、现金和现金跑道不可见；(2) 没有积压订单到收入的转化数据，也没有订单簿颗粒度；(3)
              没有客户定价、实际 ASP 或毛利数据；(4) 没有能显示 Devens 是否向成本杠杆爬坡的工厂利用率；(5) 没有 Ambient/Generate 渠道的项目融资或资产出售经济性。


              ING 2026 年氢能分析给出的行业背景进一步强化这一结论：2025 年全球政府对氢能的支持下降 20% 至 $222 billion；需求侧资金仍严重不足，仅约占总支持的
              3%；多数拟建清洁氢供应商尚未找到买家；美国市场又被廉价天然气和压缩后的政策时间线结构性削弱。EH2
              的融资深度和技术差异化提供了可信现金跑道，但公司显然仍处在商业规模化前的资本消耗阶段；在完成全权限尽调之前，任何承销都必须把收入和毛利都视为重大证据缺口。
