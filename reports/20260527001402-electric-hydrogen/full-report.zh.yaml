      - 尽调请求
    enumerationScope:
      coverage: partial
      basis: >-
        Streams identified from public press releases, company website, and inferred from product architecture; no
        internal financial breakdown has been disclosed.
    rows:
      - - 资本设备销售——HYPRPlant
        - 一次性支付完整一体化电解槽工厂（75/100/120 MW）；按工程、FAT、交付和调试里程碑确认收入
        - 按工厂签约；先以 MW 计价预留，FID 后转为确定订单
        - 首座商业工厂（Infinium 100 MW）将在 2026 调试；后续工厂（HIF、Synergen、Uniper）处于 FEED 或 pre-FEED
        - 短期低；收入确认推迟到项目 FID 和调试里程碑；若项目转化，战略质量高
        - 获取所有已命名项目的签署采购订单、合同价值、付款里程碑、取消条款和里程碑付款计划
      - - 工程、集成和调试服务
        - 随每座工厂销售而来的专业服务收入；覆盖项目工程、撬块集成、现场调试和业主工程师支持
        - 按项目 T&M 或总价；通常与设备销售打包
        - Infinium Roadrunner 已在执行；嵌入当前 FEED/pre-FEED 合作
        - 中等；服务收入按项目周期确认；资本强度低于设备
        - 拆出工程和调试费用经济性，不同于设备 ASP；获取每 MW 绑定率和利润率
      - - 项目联合开发和开发费（Ambient 收购后）
        - EH2 发起、开发，并可能出售或再融资氢项目；收入来自开发里程碑费用和项目层面资产出售
        - 开发费事件；资产出售时可能有股权收益分成；覆盖美国 10+ 个州的 15+ 个项目
        - 目标从 2026 开始部署项目资本；未公开宣布已完成开发交易
        - 投机性；截至 2026 本次报告日期未公开任何已确认收入事件
        - 要求提供开发管线状态、阶段门时间表、费用经济性，以及是否已有项目在 Generate Capital 融资安排下完成融资关闭
      - - 项目融资撮合（Generate Capital 渠道）
        - EH2 将项目引荐给 Generate Capital，获得最高 $400M 项目融资；可能收取发起费、享有优先经济权益，或为客户降低 LCOH
        - 按项目发起；结构上是 Generate 资产负债表上的基础设施投资
        - 合作于 September 2025 宣布；项目资本目标在 2026+ 部署
        - 短期低；非股权机制；经济分成结构未公开披露
        - 获取 Generate 合作的条款级经济性——发起费、共同投资权、追索结构和最低部署义务
      - - 服务、保修和性能监控
        - 交付后服务合同、保修准备金变现，以及对运营中工厂的潜在订阅式监控
        - 年经常性或按事件计费；绑定多年保修期
        - 未公开量化；由 DNV 审查确认标准商业保证而推断
        - 未知；经常性服务收入结构上有吸引力，但未披露
        - 要求提供保修计提、服务合同绑定率、期限和每座工厂年经常性价值
      - - 设备融资撮合（Trinity Capital 渠道）
        - EH2 可能协助客户从 Trinity Capital 或类似贷款方获得设备融资
        - 未公开被描述为收入来源；可能只是促成需求
        - $50M Trinity Capital 设备融资用于 EH2 制造扩产，而不是客户设备贷款
        - 低或为零；看起来是资产负债表支持，而非客户收入渠道
