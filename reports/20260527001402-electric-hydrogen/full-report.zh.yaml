      - number: '1.5'
        title: 里程碑、合作伙伴与反向背景
        blocks:
          - type: paragraph
            body: >-
              EH2 的公开里程碑从 2020 年创立延伸到 2025 年，覆盖一系列融资事件、制造建设、具名客户斩获和地域扩张。产品侧，公司在 2025 年从最初 100 MW 工厂品牌转向 “HYPRPlant”
              产品名，并把产品扩展到 75 MW 和 120 MW 版本。客户侧，已公告管线包括：Uniper 在 Germany 的 200 MW Green Wilhelmshaven pre-FEED
              项目（pre-FEED 于 2024 年 10 月启动）、Infinium 位于 Texas Pecos 的 100 MW Project Roadrunner（部署进行中）、HIF Global 的 Texas
              e-fuels 设施，以及 Synergen Green Energy 的 240 MW FEED 协议（两套 120 MW HYPRPlant，目标 2026 年 FID）。Ambient Fuels 收购和
              Generate Capital 合作于 2025 年 9 月宣布，交易已于 2025 年 5 月完成，为 EH2 的客户方案增加项目联合开发和最高 $400 million 项目融资。


              地域扩张包括 2025 年 9 月任命 Bruno Forget 为 Europe and MENA GM，以及 2025 年 12 月任命 Maria Gabriela da Rocha Oliveira 为
              LATAM GM，反映公司有意转向欧洲需求；欧洲需求由 RED-III 合规要求和更高天然气价格驱动。2025 年 7 月，独立工程公司 DNV 完成对 HYPRPlant
              的全面技术尽调，结论是该产品“在市场上非常有竞争力且独特”。


              主要反向信号是市场需求疲软。在 2026 年 5 月 Canary Media 访谈中，CEO Garabedian 承认 EH2
              曾“为增长而建设公司”，但现在面对低于预期的需求，并预计还会有“一年半的低迷活动”。他指出，即便有 45V 税收
              抵免，美国绿氢仍大约比灰氢贵三倍，而且美国政治和天然气价格让绿氢在经济上与灰氢正面竞争“困难到几乎不可能”。IEA 数据证实，到 2024 年底全球电解装机仅约 2 GW，而制造产能超过 50
              GW，意味着全行业利用率压力严重。EH2 的战略回应是转向欧洲和联合开发模式，但截至运行日期，实质收入和交付执行仍是前瞻性风险。
