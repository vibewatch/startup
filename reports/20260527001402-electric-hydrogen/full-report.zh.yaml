  - id: FM001
    title: 绿色氢能市场规模金字塔——从 TAM 到 SOM 产能上限
    type: pyramid
    layout: standard
    summary: 三层指示性规模测算从全球清洁氢资本开支（TAM），到 EH2 可触达的大规模西方 PEM 电解槽（SAM），再到受 EH2 工厂约束的可获取市场（SOM）；所有数值均为约略年度资本开支，单位为十亿美元。三层都高度不确定。
    data:
      items:
        - label: TAM — 全球清洁氢生产资本开支（2030E，所有技术）
          value: 50
          unit: $B/year (approx.)
          note: 基于 ING 2025 年估计的 $222B 政府支持总额（2025 年起）+ 项目管线；在 BNEF 基准情景下，预计到 2030 年实际私人资本开支部署为 $30–70B/year。未包括基础设施和储存。
        - label: SAM — ≥75 MW 大规模西方 PEM 电解槽（美国 + 欧洲）
          value: 10
          unit: $B/year (est. 2028–2030)
          note: 根据公开项目管线和 Repsol/Synergen 项目资本开支基准（安装成本约 $800–1,200/kW）估算。高度不确定；没有独立分析师对这一细分市场的估算。与供给侧过剩形成矛盾。
        - label: SOM — EH2 受工厂产能约束的可获取市场（Devens 1.2 GW/year）
          value: 1.2
          unit: $B/year (full utilization ceiling)
          note: >-
            EH2 工厂铭牌产能 1.2 GW/year × 安装总成本（TIC）约 $1,000/kW（Synergen 基准）= 满产时最高收入约 $1.2B/year。实际利用率未公开；CEO 承认已有 1.5
            年活动低迷。
    approximationNotes: >-
      三层都是低可靠性估算。TAM 来自政府支持和项目管线代理指标，而非直接资本开支调查。SAM 从四个具名项目基准插值得出，无法独立验证。SOM
      是工厂产出上限，不是预测。未经独立尽调，不要把这些数值用作目标价输入。供给和需求视角之间的矛盾被保留；要获得更高信度的规模测算，需要一手市场调研。
    claimRefs:
      - CM007
      - CM012
      - CM025
      - CM036
      - CM037
  - id: FM002
    title: 市场估算区间——2030 年绿色氢气产量预测
    type: range
    layout: standard
    summary: 2030 年全球清洁氢产量的公开估算从 5.5 mtpa（BNEF 基准）到 25 mtpa（政府目标）不等，相差 4.5×；差距反映政策执行和成本下降假设彼此难以调和。所有数值单位均为每年百万吨（mtpa）。
