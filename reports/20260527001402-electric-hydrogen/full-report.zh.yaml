  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - Infinium Roadrunner 调试数据
        - 前 90 天实际可用率、单位能耗和衰减曲线
        - HYPRPlant 在 100 MW 规模的首个且唯一证据；决定可融资性溢价或折价
        - EH2 管理层；Infinium 运营团队；直接现场走访
      - - 股权结构表和优先股堆叠
        - 完整资本结构表：所有类别、清算优先权、反稀释条款、信贷额度契约
        - 决定所有情景下的实际投资者稀释和回报曲线，包括降估值轮
        - EH2 CFO；法律顾问；审阅投资条款清单和股东协议
      - - 100 MW 规模单位经济性
        - COGS、毛利率、每 kW 安装贡献毛利、100 MW 工厂成本结构
        - 没有毛利披露，所有估值情景都建立在不确定性很宽的假设上
        - EH2 CFO；第三方成本审计；供应链定价条款
      - - Synergen 和 HIF 的 FID 时间线
        - 有约束力或有条件的 FID 承诺；项目融资条款清单状态；包销合同披露
        - FID 转化是最重要的近期估值催化剂；滑入 2027 年以后会压缩 OBBBA 窗口
        - Synergen / HIF 项目发起方；EH2 商务团队；项目融资银行
      - - 烧钱速度和现金跑道
        - 月度现金消耗、当前现金余额、$100M 信贷额度契约合规状态
        - 决定下一轮融资的紧迫性和条款；现金跑道低于 18 个月会触发谈判劣势
        - EH2 CFO；设备融资贷方；如有则独立审计
      - - EPC 和供应链集中度
        - Weitz Company 之外的 EPC 替代方；PEM 膜和铱采购协议；单一来源依赖
        - 前 3–4 座工厂的执行风险集中在单一 EPC 和有限供应链
        - EH2 运营团队；Weitz Company 产能披露；供应链尽调
    notes: 六项均归为重大或阻断项。只能靠私有证据解决的项目（股权结构表、单位经济性、烧钱速度）无法从公开来源解决；需要投资者访问权限。
