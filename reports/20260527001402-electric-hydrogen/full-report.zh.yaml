      - number: '6.2'
        title: 采用轨迹与项目管线
        blocks:
          - type: paragraph
            body: >-
              Electric Hydrogen 的采用轨迹遵循工业项目开发弧线，而不是传统 SaaS 或消费者采用曲线。进展不是用月活用户或 ARR 队列衡量，而是看项目阶段：从 FEED 选择到工程 FEED，到
              FID，到设备交付，到调试，再到商业运营。每个阶段都要数月到数年，公开证据也必须按这个节奏解读。

              内部证明路径从一座自 2022 年运行的 1 MW 电解槽工厂开始，该工厂开发了全厂控制和安全设计。Pioneer 工厂约为商业规模的十分之一，自 2024 年 1 月运行，使用与 HYPRPlant
              相同的电解槽、电力系统和工艺设计，并在不到五个月内完成交付、组装和调试，成为商业交付速度的主要去风险里程碑。首个商业规模部署是 Infinium 的 100 MW HYPRPlant，已发往 Texas
              Pecos，完成水压测试和质量检查，截至 2026 年正在现场调试——这是商业制造和现场交付执行的第一个真实证明。

              Roadrunner 之外，具名项目管线还包括四个处于更早阶段的关系。HIF Global 于 2025 年 9 月选择 EH2，用于其 Texas Matagorda e-fuels 设施；FEED 或 FID
              日期尚未公开。Synergen Green Energy 于 2025 年 12 月签署 FEED 协议，购买两套 120 MW HYPRPlant；目标 2026 年 FID，2028
              年底前设施运营。Uniper 于 2024 年 10 月与 EH2 启动德国 Wilhelmshaven 一个 200 MW 项目的 pre-FEED；该项目拥有 EU 共同利益项目地位。AES 持有最高 1
              GW 的框架供应预留，它提供的是管线占位，而不是已承诺项目。

              2024 年 2 月 Utility Dive 报道引用 EH2 全球商务 SVP 的说法，称工厂已有 5 GW
              订单排队，但之后没有公开披露确认或更新这一报道数字，同一位高管也承认全行业存在不确定性。Ambient Fuels 收购（2025 年 5 月完成）新增了约 15 个内部项目，分布在 10+
              个美国州，声明潜力超过 600 TPD；但这些是内部开发资产，不是已签客户合同。
