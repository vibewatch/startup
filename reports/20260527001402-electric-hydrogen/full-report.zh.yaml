  - id: TI002
    title: 定价 / 变现表
    columns:
      - 定价元素
      - 标价 vs. 实际
      - 可用代理指标或基准
      - 来源
      - 尽调请求
    enumerationScope:
      coverage: partial
      basis: >-
        No list pricing has been publicly released; entries derive from public project benchmarks, competitor proxy
        data, and EH2's own cost-reduction claims.
    rows:
      - - HYPRPlant 每 kW 总安装成本（TIC）
        - 公司主张，不是标价；EH2 称 TIC 最多比替代方案低 60%；Synergen 公开将项目可行性与低于 $1,000/kW 的 TIC 绑定
        - Repsol Petronor 100 MW 炼厂电解槽基准：100 MW 为 EUR 292M，即总安装成本约 EUR 2,920/kW；EH2 主张最多降本 60%，意味着约 $1,200/kW 或更低
        - EH2 官方网站；Synergen 新闻稿；第 3 章竞品语境（此处不重述 Repsol）
        - 要求所有已命名项目的每 MW 实际合同价值；独立校准 TIC 基准
      - - HYPRPlant 每 MW ASP（仅设备，不含安装）
        - 未披露；未发布标价；按项目谈判
        - ITM Power 的 2025 年多 MW 组合粗略对应约 £26M 收入，只能作为极粗参考；Nel 的每 MW 隐含收入受项目组合扭曲；没有干净的 EH2 ASP 代理指标
        - Nel Annual Report 2025；ITM Annual Report 2025；EH2 新闻稿
        - 要求 EH2 截至目前所有已签合同的平均实际 ASP/MW；获取付款里程碑时间表，以及任何违约金或取消条款
      - - 服务 / 保修溢价
        - 未披露；DNV 审查确认存在标准商业保证，但未定价
        - 工业 PEM OEM 服务通常为资本成本每年 1–3%；按 100 MW、$1,000/kW 计算，意味着每座工厂每年大约 $1–3M 服务收入
        - DNV 验证新闻稿；行业代理指标推断
        - 要求任何已调试工厂的保修计提率、服务合同定价和续约率
      - - 项目开发费（Ambient 渠道）
        - 未披露；典型可再生项目开发费为项目资本的 0.5–2%
        - 按 $400M Generate Capital 融资安排计算，1% 发起费意味着 $4M；单项目经济性未知
        - Generate Capital / Ambient 收购新闻稿；无公开费用表
        - 获取开发协议条款清单，显示费用结构、共同投资权和项目资本优先回报
    notes: 这个市场的定价不透明是结构性的；客户都是大型工业项目开发商，有定制工程需求，无法采用标准目录价。未披露任何实际定价或 ASP 属于预期之内，但对需要在任意利用率情景下建模收入的投资人来说，会实质性限制财务承销。
