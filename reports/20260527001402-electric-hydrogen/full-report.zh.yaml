  - id: TR005
    title: 缓释措施与叫停标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值或事件
      - 行动含义
    rows:
      - - Roadrunner 首座工厂执行
        - 调试完成日期，以及相对保证规格的 30/90 天性能数据
        - 投产后前 90 天内，任何可用率 <85% 或氢气纯度不达标
        - 暂停后续融资，直到根因解决；所有贷方可融资性评估暂停
      - - 美国项目 FID 冻结
        - Synergen 2026 年 FID 公告，或正式宣布推迟 FID
        - Synergen 未在 2026 年 12 月 31 日前达成 FID，且 HIF 也没有工程合同里程碑
        - 美国需求线投资逻辑破裂；按仅欧洲收入模型重新校准
      - - 资本跑道
        - 任何新股权融资或信贷额度修订；高管对现金跑道的评论
        - Roadrunner 性能数据发布前，要求降估值融资或信贷额度豁免
        - 评估收入前烧钱是否超出计划；考虑稀释风险和财务健康度
      - - 45V 政策风险
        - 国会对 IRA 清洁能源条款的动作，或行政部门执法口径
        - 2026 年立法进一步限制或废除 45V 抵免
        - 对美国项目管线可行性全面重新承保；欧洲策略成为主要投资逻辑
      - - PGM 供应或价格冲击
        - 铱现货价格（伦敦定盘价）；EH2 公开评论材料成本
        - 铱价连续 90+ 天高于 $8,000/troy oz，或 Heraeus、Johnson Matthey 确认供应配额约束
        - 要求立即披露采购合同；评估电堆成本对项目经济性的影响
      - - 竞争对手可融资性事件
        - Nel、ITM、Plug 季度订单获取和积压订单披露；任何大型西方 OEM 破产或重组
        - 任何投资级西方 PEM OEM 申请破产，或获得政府救助融资
        - 行业层面的信号表明需求破坏是结构性的；重新评估整个氢能投资逻辑的时间线
      - - 欧洲供应链本地化失败
        - EH2 新闻稿宣布首个欧洲制造合作伙伴；Uniper 宣布完成 pre-FEED
        - 到 2026 年 Q4 仍没有具名欧洲制造合作伙伴，且 Uniper 项目卡在 pre-FEED
        - 欧洲收入线承压；投资逻辑必须依赖拉美和美国管线恢复
      - - 客户集中度坍塌
        - Infinium、HIF、Synergen 或 Uniper 公开宣布项目取消
        - 任何具名旗舰项目公开取消，或宣布无限期推迟
        - 收入管线集中带来迫切的近期收入缺口；需要确认管线多元化证据
    notes: 叫停阈值由分析师定义；实际董事会触发水平未公开披露。
