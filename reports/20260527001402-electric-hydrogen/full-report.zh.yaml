      - number: '3.3'
        title: 能力、定价、市场进入能力与切换成本
        blocks:
          - type: paragraph
            body: >
              关键比较点是项目整体执行，而不是孤立的铭牌电堆性能。EH2 明确销售标准化工厂架构带来的总安装成本降低和更快调试；nucera 强调 FEED 研究、LCOH 分析、可维护性和生命周期服务；ITM 强调模块化
              PEM 产品和质量提升；Topsoe 和 Bloom 强调在热集成有意义的场景下降低电耗；Linde 和 Air Products
              销售更宽的工业气体解决方案，包含运营、物流或承购。换句话说，大买方比较电池化学路线，也同样比较可融资性组合、质保组合和执行模式。


              公开定价透明度很差。当前材料中没有任何来源给出 EH2、Nel、ITM、nucera 或 Plug 的清晰标价表。公开记录只暴露了项目资本开支代理值：EH2 声称总安装成本最多降低 60%，Synergen
              公开把可行性与低于 $1,000/kW 的总安装成本绑定，Repsol 的 100 MW Petronor 项目给出了大型炼厂集成工厂 €292 million
              的具体基准。这种不透明本身就有战略意义：这是一个议价的 EPC 和项目融资市场，不是透明目录市场。


              切换成本也不对称。在 FEED 或 pre-FEED 之前，买方可以相对低摩擦地比较 PEM、碱性、SOEC 和集成商主导路线。FEED 之后，所选 OEM
              的质保、安全方案、工厂配套假设、融资模型，有时还有本土内容计划，都会嵌入贷方和客户尽调。到那时，单个项目多归属的可能性低且成本高。组合层面的多源采购仍然可能——开发商可以在一个 PEM 项目选择
              EH2，在一个炼厂规模碱性项目选择 nucera，在一个有余热的 e-fuels 项目选择 Topsoe——但单个工厂通常会锁定一条设计路径。这一动态有利于具备成熟认证、服务网络和下游控制力的既有企业和集成商。
