    rows:
      - - 高阶电子燃料（eSAF / e-甲醇）
        - Infinium、HIF Global 等客户
        - 航空公司或航运运营商
        - 项目股本 + 项目融资（Brookfield、BEC）
        - 电力 PPA → 电解槽 → H2 → Fischer-Tropsch 或甲醇合成 → 电子燃料
        - 开发商 CFO；项目 SPV
        - 约束性 SAF 强制要求（英国、EU RED III）；相对化石燃料的出口溢价
      - - 绿氨出口
        - Synergen Green Energy
        - 欧洲 / 亚洲化肥或航运承购方
        - 项目股本 + 债务；供应链锚定投资者
        - 风 / 光 PPA → 电解槽 → H2 → Haber-Bosch → NH3 出口码头
        - 开发商 CEO / 项目发起人
        - EU 氢进口目标；航运脱碳强制要求；氨溢价
      - - 欧洲公用事业 / 工业 H2
        - Uniper（德国）
        - 德国工业与化工客户
        - 公用事业公司资产负债表 + EU IPCEI 补助 + OECD 贷款方支持
        - 可再生电力 → 大规模电解 → H2 管道注入或 NH3 码头
        - 公用事业公司氢业务 VP / CIO
        - EU RED III 合规；碳价敞口；电网脱碳目标
      - - 炼油 / 石化脱碳
        - Repsol, AES
        - 用绿 H2 替代灰 H2 做加氢处理的炼厂运营商
        - 炼厂资本开支预算 + EU IPCEI / NextGenEU 补助
        - 现场电解 → H2 直接注入炼厂流程
        - 炼厂运营 / 工程 VP
        - EU 碳边境调节机制（CBAM）；IPCEI 资格；范围 1 减排
      - - 美国能源公司管线选择权
        - AES Corporation
        - 未来公用事业级客户（未说明）
        - AES 公司资产负债表；无确定资本开支承诺的框架预留
        - 待项目越过 pre-FEED 和项目融资阶段后确定
        - AES Chief Innovation Officer
        - 45V PTC 可得性（OBBBA 下窗口期至 2028 年 1 月）；政策选择权
    notes: 买方数据来自 EH2 新闻稿（官方）和第三方项目公告。AES 框架基于 2023 年预留；截至 2026 年运行日期，尚无已确认的下游项目部署。预算数字为项目级资本开支；EH2 未公开披露单台定价。
