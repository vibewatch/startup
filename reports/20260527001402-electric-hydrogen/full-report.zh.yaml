      - number: '7.5'
        title: 缓释措施、监控指标与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >
              Electric Hydrogen 的可投资逻辑建立在一组当前看似可行但尚未确认的条件上。用明确的淘汰阈值来量化监测每个条件，比叙事式风险评估更可执行。


              截至 2026 年，记录中最强的风险缓释包括：(a) DNV 独立技术验证（2025 年 7 月），覆盖电堆、工厂设计、制造、可靠性、质量和保修，实质性提升贷款人的可融资性；(b)
              模块化、工厂测试部署模式（Pioneer 在 10 MW 证明，Roadrunner 在 100 MW 调试，所有撬装模块出货前预测试），相较现场散建替代方案，结构性减少现场调试失败模式；(c)
              大型且多元的融资基础（$750M+），如果制造节奏与管线匹配，可为至少一到两年的收入前运营提供现金跑道；(d) 欧洲本地化策略，已聘 Europe/MENA 总经理，且 Uniper 项目处于
              pre-FEED，降低对美国政策的依赖；(e) Generate Capital 合作关系，把部分需求风险从「项目能否达到 FID？」转为「EH2 和 Generate
              能否共同开发项目？」——移除了对外部开发商的一层依赖。


              已被主张但尚不可验证的缓释包括：EH2 声称铱使用量显著低于同业（未获独立确认）；声称总安装成本降低 60%（提出过，但没有在完整已完成项目上独立审计）；以及欧洲供应链本地化（已宣布，但尚未在商业项目规模执行）。


              投资者应监测的关键指标包括：(1) Roadrunner 调试完成日期，以及首月运营表现数据相对于保证性能规格的差异；(2) Synergen 在 2026 年 FID——如果滑到 2027
              年，说明需求条件连续第二年仍冻结；(3) HIF Texas 设施 FID 或正式工程合同转化；(4) Generate Capital $400M 项目融资额度的提款活动——2026
              年任何资本投放都会验证需求赋能逻辑；(5) EH2 收入披露或 Roadrunner 设备验收里程碑信号；(6) Uniper Green Wilhelmshaven FID 或有意义的 pre-FEED
              完成；(7) Roadrunner 之外任何第二个商业项目达到调试或交付的公开信号；(8) 按季度监测 Nel、ITM 和 Plug 的订单与积压订单转化，作为行业 FID 动能的领先指标。


              投资逻辑破裂触发点——需要重新承销或计提投资减值的条件——包括：(a) Roadrunner 运营失败，或调试后前六个月持续可用率低于 85%，这会阻断所有后续 EH2 工厂的可融资性；(b) Synergen
              到 2026 年底未完成 FID，且 HIF 也延迟——说明所有近期美国项目同时冻结；(c) EH2 以显著更低估值追加股权融资（down-round），意味着 $750M
              融资栈已被消耗，却没有相匹配的收入转化；(d) 后续立法进一步限制或完全取消 45V 抵免，消除美国绿氢项目经济性；(e) Roadrunner 或同业设施发生安全事故，引发新的监管要求，延迟所有大型 PEM
              项目。


              任何投资者在 2026 年尽调时都应提出的关键要求包括：(1) 完整经审计财务、现金跑道和烧钱速度；(2) Roadrunner 性能测试数据和保修索赔状态；(3) 铱和膜采购合同及对冲安排；(4) Titan
              和 Weitz 商业条款及可替代性；(5) Generate Capital 投放管线和任何已承诺氢项目条款；(6) Uniper 和 Synergen 项目 FID 时间线及当前可融资性状态；(7) EH2
              欧洲供应链本地化计划、里程碑时间线，以及相对于美国模式的成本差；(8) 网络和流程安全架构，尤其是 SCADA/ICS 加固。
            claimRefs:
