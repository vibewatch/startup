      - CI021
  - id: FI003
    title: 财务估算区间
    type: range
    layout: standard
    summary: 有来源支撑的关键财务输入估算区间。所有 EH2 特定数值都来自公开信息估算或从同业基准推断；均明确标注为“估算”或“不可得”，正式承销模型必须用管理层提供的实际数据替换。
    data:
      items:
        - label: 月度运营烧钱额——EH2（按员工数和工厂同业估算）
          low: 8
          mid: 15
          high: 22
          unit: USD million/month
          note: 按 300+ 名员工、Devens 工厂运营、Texas 制造以及跨洲商务团队估算。员工规模相近的 PEM OEM 同业（Nel、ITM）显示过类似烧钱水平。EH2 没有公开披露。区间很宽，反映不确定性。
        - label: 单座 HYPRPlant 隐含毛利率——EH2 短期（同业代理区间）
          low: -60
          mid: -30
          high: -10
          unit: '% of revenue'
          note: >-
            根据 Nel 2025 年经营亏损 / 收入比（约 -142%）和 ITM EBITDA 亏损 / 收入比（约 -127%）推导；考虑到更新的工厂和标准化装置重点，EH2
            处境可能更好，但低利用率意味着短期毛利率显著为负。EH2 没有披露。
        - label: Series C 交割时可用累计股权资本（2023 年 10 月）
          low: 590
          mid: 610
          high: 630
          unit: USD million
          note: >-
            EH2 在 Series C 交割时称“已融资超过 $600M”；Series C 为 $380M。根据此前轮次（Series A、B）估算，Series C 前股权融资为 $220-250M。区间较窄，因为 EH2
            自己的新闻稿锚定了中点。
        - label: 从 Series C 交割到首个大型项目 FID 的剩余现金跑道（估算）
          low: 18
          mid: 30
          high: 48
          unit: months from Oct 2023 close
          note: >-
            完全取决于烧钱速度和资本部署速度。若月烧钱 $15M、账上 $600M，从 2023 年 10 月起跑道为 40 个月（约 2027 年 2 月）。若月烧钱 $22M，跑道约 27 个月（约 2026 年 1
            月）。信贷额度提款、DOE 拨款支付和 48C 货币化会延长实际跑道。不是预测——只是展示烧钱敏感性。
    approximationNotes: 所有估算均已标注，不应在没有管理层确认的情况下当作前瞻预测使用。月度烧钱估算尤其不确定，因为它把累计融资额与支出速度混在一起，而支出并非线性。毛利率区间基于同业，而这些同业的规模、产品组合和利用率均不同于 EH2。
    claimRefs:
      - CI022
      - CI026
      - CI028
      - CI029
      - CI017
      - CI018
      - CI019
  - id: FI004
    title: 资本密集度与现金流地图
    type: flow
    layout: wide
    summary: 将 EH2 的资本结构映射到主要资金用途。图中展示融资结构的多来源属性，以及资金来源与主要现金流出之间的先后关系。Generate Capital 渠道位于 EH2 公司资产负债表之外，因此单独展示。
    data:
      nodes:
        - id: equity-stack
          label: 股权融资轮次（Seed 至 Series C；截至 2023 年 10 月累计 > $600M）
        - id: credit-facility
          label: $100M 公司信贷额度（HSBC 牵头；2024）
        - id: doe-instruments
          label: $65M DOE 支持：$46.3M 拨款 + $18.3M 可转让 48C 税收抵免
        - id: trinity-equipment
          label: $50M Trinity Capital 设备融资（以制造资产担保）
        - id: corporate-liquidity
          label: EH2 公司流动性池（上述资金合计；取决于烧钱速度）
        - id: factory-capex
          label: Devens 超级工厂资本开支 + 设备（已投入且仍在投入）
        - id: manufacturing-burn
          label: 制造运营 + Texas 制造（持续固定开销）
        - id: opex-commercial
          label: R&D、G&A 和商务团队烧钱（持续）
        - id: working-capital
          label: 营运资本：WIP 库存、应收款、客户里程碑滞后
        - id: ambient-acquisition
          label: 收购 Ambient Fuels 成本（未公开披露）
        - id: generate-channel
          label: Generate Capital：最高 $400M 项目融资（表外；2026+ 部署）
        - id: project-revenue
          label: 项目里程碑收款（FID 触发；首笔预计约 2026–2027 年）
      edges:
