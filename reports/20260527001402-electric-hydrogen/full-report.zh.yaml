  - id: TI003
    title: 单位经济性表
    columns:
      - 指标
      - 数值 / 可用代理指标
      - 信心
      - 为什么重要
      - 尽调请求
    enumerationScope:
      coverage: exhaustive
      basis: >-
        All financially material unit-economics inputs for an industrial OEM equipment company; null entries reflect
        genuinely private data, not research failure.
    rows:
      - - 每 MW 平均售价（设备）
        - 未公开披露；null
        - 不适用——不可得
        - ASP 决定任意利用率情景下的收入模型上限
        - 要求所有已交付或签约工厂的签署合同价值、已预订 MW 和实际 ASP
      - - 每 kW 总安装成本（TIC，客户侧）
        - 基于 Synergen 公开表述和 EH2 60% 降本主张，声称达到或低于 $1,000/kW；未验证
        - 低（公司主张，未验证）
        - 决定竞争定位，并影响项目能否在当前 LCOH 经济性下达到 FID
        - 获取独立第三方 TIC 审计；与 Infinium Roadrunner 调试后的实际资本开支对比
      - - 单厂毛利率
        - 未公开披露；同行代理指标（Nel、ITM）显示在未达规模时深度为负；EH2 为 null
        - 不适用——不可得
        - 判断收入模型能否规模化成立的最关键指标
        - 要求单厂销货成本（COGS）拆分、工厂固定成本吸收计划，以及从当前利用率到目标利用率的毛利率桥
      - - 每 MW 制造成本（电堆）
        - 未公开披露；DOE PEM 2026 目标意味着约 $300/kW 电堆成本；EH2 声称正朝 DOE Hydrogen Shot 目标推进；实际 EH2 为 null
        - 低（仅由 DOE 目标推断）
        - 电堆成本是销货成本（COGS）中最大的单项驱动因素；DOE 目标是在 2026 实现 $300/kW 电堆成本
        - 要求 Devens 实际与目标电堆制造成本 / MW；对比 DOE 2026 和 2031 成本里程碑
      - - 月度经营烧钱速度
        - 未披露；基于 300+ 员工数、Devens 工厂运营和同行烧钱速度基准，估计每月 $10–20M；验证值为 null
        - 很低（仅推断）
        - 决定当前现金头寸能支撑多久；如果烧钱速度落在区间高端，2023 Series C 资金到 2026 将被大幅消耗
        - 要求经审计现金流量表，以及按成本类别（制造、R&D、G&A、商业化）拆分的月度烧钱速度
      - - 目标利用率下 LCOH（$1.50/kg、$1/kg）
        - EH2 目标是在高可再生能源州到 2030 实现 $1.50/kg H2；DOE Hydrogen Shot 目标是在 2031 实现 $1/kg；按当前天然气价格，美国绿氢成本目前约为灰氢的 3×
        - 中等（目标由公司主张并获 DOE 佐证；当前 LCOH 高得多）
        - LCOH 目标决定项目能否在无补贴情况下签下承购；对 FID 时间和订单簿转化至关重要
        - 要求每个已命名客户的项目级 LCOH 模型；对比 45V 激励组合、EU RED III 价值和实际可再生 PPA 定价
    notes: >-
      本表中的 null 项不是研究失败，而是 EH2 作为私营公司的结构性特征。每个 null 项都代表只能靠尽调解决的信息缺口，无法在不接触 EH2 内部财务记录的情况下补齐。Nel 和 ITM 的同行代理指标是实质性反向信号；在
      EH2 拿出显著不同的利润率证据之前，应把它们作为基准情景。
