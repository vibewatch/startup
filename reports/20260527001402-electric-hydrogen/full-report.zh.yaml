      - number: '6.4'
        title: 留存、持久性、扩张与集中风险
        blocks:
          - type: paragraph
            body: >-
              公开材料中没有传统 SaaS
              式留存指标——NRR、GRR、队列续约率或客户满意度评分。对工业资本设备业务来说，这在结构上符合预期：每个项目都是多年期、数亿美元级合同，而不是经常性订阅。这里的「留存」指客户是否会再次合作第二个项目；五个具名关系全部都是首个项目选择，公开证据没有显示任何客户二次合作或复购。合同期限等持久性指标只有间接线索（例如
              Infinium 与 IAG 的 eSAF 承购期为 10 年，但它约束的是燃料销售，不是 EH2 设备），EH2 也未公开披露调试后的服务条款。

              扩张动力有两个层面。地域上，EH2 聘请了 Europe/MENA 总经理（Bruno Forget，2025 年 9 月）和 LATAM 总经理（Maria Gabriela da Rocha
              Oliveira，2025 年 12 月），显示公司正认真建设非美国管线——鉴于 CEO 承认当前天然气价格和政策条件下，美国本土绿氢市场经济性承压，这一点尤其重要。Ambient Fuels 收购和
              Generate Capital 合作关系创造了第二条商业动作（项目共同开发和氢即服务），让 EH2 能触达那些不能或不愿自建并运营可再生氢工厂的客户。

              客户集中风险是最重要的结构性担忧。五个公开具名关系都是非常大的项目，且 FID 到调试周期跨多年；任何一个账户发生融资失败、政策逆转或 FID 延迟，都可能显著影响近期收入。2026
              年宏观背景强化了这一担忧：ING 2026 年氢能展望把绿氢描述为「卡在试点阶段」，并预计 2026 年全球产量仅 1.8 million TPA——不到氢气总使用量的 2%。OBBBA 将 45V
              开工截止期提前到 January 1, 2028，压缩了美国绿氢项目窗口，尤其是那些很难快速锁定承购的大型项目。IEA 数据显示，到 2025 年全球电解槽制造能力超过 50
              GW，而装机基数很小，形成供给过剩的定价环境；如果 EH2 不能维持差异化，竞争地位可能被侵蚀。
