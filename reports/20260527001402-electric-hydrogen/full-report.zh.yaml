      - number: '6.3'
        title: 具名客户证明与参考质量
        blocks:
          - type: paragraph
            body: >-
              Electric Hydrogen 最有价值的公开证明资产，是 Infinium Project Roadrunner 部署。这是公开材料中唯一一个设备已经发货、在第三方 Texas
              撬装工厂完成组装和水压测试、实物运至客户现场并进入调试的关系；这一序列同时由 EH2 自有网站和独立第三方新闻报道记录。Project Roadrunner 还与 Brookfield Asset
              Management 和 Breakthrough Energy Catalyst 完成财务交割，并拥有与 IAG（British Airways、Aer Lingus、Iberia）签订的有约束力 10 年
              eSAF 承购协议。这些资质——项目融资、机构股权和具名承购方——让 Infinium 关系具备其他四个具名账户所没有的可融资性验证。Infinium CEO Robert Schuetzle 对
              HYPRPlant 设计和商业包质量给出了确认性引述。

              HIF Global 关系（2025 年 9 月公布）是可信的第二个证明点：它通过 EH2 自有渠道和 GlobeNewswire 联合公布，在 EH2 的 LATAM
              公告中被引用为现有客户部署案例，并涉及资本充足的交易对手（HIF 于 2023 年在 Chile 生产出全球首批商业 eFuels）。不过，FEED、FID 或交付时间线均未公开，当前阶段不透明。

              Synergen 的 FEED 协议（2025 年 12 月）和 Uniper 的 pre-FEED（2024 年 10 月公布）阶段更早，但它们之所以可信，恰恰因为涉及工程承诺，而不只是意向书。Synergen
              CEO Pranav Tanti 表示，选择 EH2 的原因是目标实现低于 $1,000/kW 的总安装成本。Uniper 作为独家合作伙伴，传递出 EH2 首个大型欧洲项目中高信心的交易对手关系。

              AES 框架协议是五个具名关系中承诺程度最低的：它是一项最高 1 GW 的供应预留，取决于 AES 开发具体项目。投资者应注意，United Airlines Ventures 是 EH2
              的财务投资者；在任何已审阅来源中，United Airlines 都没有被列为电解槽客户，Infinium 的下游 eSAF 客户（American Airlines、IAG）购买的是 Infinium
              的燃料，而不是 EH2 的制氢设备。
