      - - 2026 年底前零 FID
        - 到 2026 年 12 月 31 日，Synergen、HIF、Uniper 或任何新项目均未宣布 FID
        - 证实需求错位是结构性而非周期性；现金跑道压力加速
        - 下调至回避；观察过桥融资或降估值信号
      - - 45V 政策进一步收紧
        - 新立法或财政部指引在 OBBBA 之外进一步限制绿氢抵免
        - 削弱美国项目经济性；进一步压缩本已紧张的 2028 窗口
        - 对集中美国敞口的投资者下调至回避；重新评估欧洲管线权重
      - - 核心管理层离职
        - CEO Raffi Garabedian 或 CTO David Eaglesham 在首个 FID 前宣布离职
        - 关键人物风险；技术可信度和投资者关系承压
        - 暂停追加投资；跟投前要求披露继任安排
      - - Generate Capital 契约或违约事件
        - 披露 $400M 项目融资额度的任何重新谈判、加速到期或重组
        - 显示成熟共同投资方担心项目经济性或 EH2 交易对手风险
        - 立即复盘；是否退出取决于严重程度
    notes: 触发因素基于可公开观察的信号；私有财务事件（契约违约、烧钱速度、薪资压力）没有尽调权限无法观察。
