          to: corporate-liquidity
          label: 主要资金来源
        - from: credit-facility
          to: corporate-liquidity
          label: 循环流动性缓冲
        - from: doe-instruments
          to: corporate-liquidity
          label: 非稀释性流入（与里程碑挂钩 + 可转让抵免）
        - from: trinity-equipment
          to: corporate-liquidity
          label: 设备担保债务；增加杠杆
        - from: corporate-liquidity
          to: factory-capex
          label: 一次性资本投资
        - from: corporate-liquidity
          to: manufacturing-burn
          label: 持续固定成本
        - from: corporate-liquidity
          to: opex-commercial
          label: 持续可变成本
        - from: corporate-liquidity
          to: working-capital
          label: WIP 与里程碑时点
        - from: corporate-liquidity
          to: ambient-acquisition
          label: M&A 资本（金额未披露）
        - from: project-revenue
          to: corporate-liquidity
          label: 项目进入调试后回流资本（2026–2028 年窗口）
        - from: generate-channel
          to: project-revenue
          label: 项目融资让更多项目更快达到 FID
    approximationNotes: >-
      公司流动性节点无法量化，因为当前现金和信贷额度提款状态均未公开披露。Generate 渠道明确按表外建模，因为 EH2 表示 Generate Capital
      的资本部署在项目层面，而非公司资本。从项目收入回流到公司流动性的反馈回路，是公司走向自我造血的关键路径；其时点完全取决于具名项目能否达到 FID 并进入商业运营。
