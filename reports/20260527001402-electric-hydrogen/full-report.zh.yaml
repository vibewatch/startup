  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Covers publicly traded pure-play electrolyzer OEMs (Nel, ITM Power, Plug Power), diversified OEM with
        large-scale order data (thyssenkrupp nucera), a major industrial-gas project reference (Air Products NEOM), and
        EH2's own last equity mark. Private pre-revenue comparables excluded due to information limits; Chinese OEMs
        (Peric, CSSC, Longi Green Energy) excluded due to limited public comparable data. Coverage assessed partial, not
        exhaustive.
    columns:
      - 公司 / 参考
      - 阶段
      - 关键财务指标（2025/最新）
      - 隐含倍数或估值
      - 与 EH2 的相关性
      - 关键局限
    rows:
      - - Nel ASA（上市）
        - 商业规模 OEM；PEM + 碱性
        - 收入 NOK 963M；经营亏损 NOK 1,365M（FY2025）
        - ~5–10× P/S；EBITDA 为负
        - 最佳西方上市可比；大规模 PEM OEM
        - 收入下降；电解业务占收入 < 100%
      - - ITM Power（上市）
        - PEM 商业化中；规模较小
        - H1 FY2026 收入 £26M；EBITDA 亏损 £33M；现金 £208M
        - ~4–6× P/S；估计市值 ~£100–150M
        - 纯 PEM OEM；技术上最接近 EH2 的可比公司
        - 收入规模偏小；现金消耗加速
      - - Plug Power（上市）
        - 重组中；制氢 + FCEV
