      - number: '5.4'
        title: 信任、质量控制与技术风险
        blocks:
          - type: paragraph
            body: >-
              最强的公开信任信号是 DNV 的技术尽调。其审查覆盖电堆技术、工厂设计、性能、可靠性、制造、质量和标准商业保证，并包括在 Pioneer 工厂的现场见证。Electric Hydrogen
              自有页面还显示出更多质量控制：每套全尺寸电堆的产线末端测试、Roadrunner
              的水压测试和工厂质量流程、供应商和商业行为准则，以及公开表单上的隐私承诺。这些是有用的尽调标记，因为它们说明公司知道，氢工厂的可融资性不只取决于电化学性能。

              与此同时，公开材料在贷款人、保险方、EPC 交易对手或工业买家想看到的具体安全与合规包上仍不完整。Electric Hydrogen
              不披露针对工厂的认证矩阵、具名规范合规包，也不披露详细的数字控制和网络安全架构。竞品在 ISO 22734、ASME 或 PED
              压力系统、ATEX、第三方网络评估等方面更明确。更大的行业背景也抬高了信任门槛。IEA 表示，氢能部署仍受成本、基础设施和监管准备度约束；Plug Power 的 10-K
              则显示，制造、可靠性、流动性、激励和易燃燃料风险会在规模化过程中叠加。Electric Hydrogen 具备可信的流程和质量信号，但公开尽调仍需要其背后的硬性工厂文件。
