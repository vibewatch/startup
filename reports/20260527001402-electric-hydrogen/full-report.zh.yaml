  - id: TM004
    title: 增长驱动因素与采用约束
    columns:
      - 因素
      - 方向
      - 时间
      - 对 EH2 的影响
      - 尽调追问
    rows:
      - - EU RED III 与各国氢能强制要求
        - 驱动
        - 2026–2030 年生效
        - 拉动欧洲公用事业需求；支撑 Uniper 等类似项目
        - 确认会转化为电解槽采购的具体 EU 合规时间表和承购量
      - - 英国 SAF 强制要求（2030 年 10%）
        - 驱动
        - 2030 年截止
        - 支撑 IAG 对 Infinium Roadrunner 的承购；航空溢价弥合成本差
        - 确认量级义务，以及英国强制要求是否延续至 2030 年后
      - - 欧洲天然气价格（美国的 3–4×）
        - 驱动
        - 持续性的结构因素
        - 让欧洲绿 H2 更早具备成本竞争力；支撑德国项目
        - 监测 LNG 正常化是否压缩欧洲天然气溢价
      - - DOE H2 Shot — 成本目标 2026 年 $2/kg、2031 年 $1/kg
        - 驱动
        - 2026–2031
        - 验证 EH2 的成本路线图；DOE 支持（$65M）直接利好 EH2
        - 验证当前 OBBBA 政策框架下 $2/kg 目标是否可达
      - - OBBBA — 45V 截止日提前至 2028 年 1 月 1 日
        - 约束
        - 立即生效（2025 年颁布）
        - 压缩项目开发窗口；大型项目风险最高
        - 量化 EH2 具名客户中有多少能在 2028 年 1 月前开工
      - - 绿氢与灰氢成本差（美国约 3×）
        - 约束
        - 结构性；会持续到 H2 成本低于约 $2/kg
        - 将美国需求限制在出口导向或强制要求驱动的项目
        - 跟踪 EH2 自身 2030 年 $1.50/kg 成本目标与当前轨迹的差距
      - - 中国电解槽竞争（$303/kW vs. 西方 $1,200–1,400/kW）
        - 约束
        - 中期（若贸易壁垒放松，则在 2028 年后）
        - 西方 OEM 承压降价；EH2 试图靠 TIC 而非电堆价格做差异化
        - 评估中国碱性电解槽灵活性提升后，EH2 总安装成本优势还能否守住
      - - 制造产能过剩（50+ GW 供给 vs. <5 GW 年需求）
        - 约束
        - 2025–2028 年持续
        - 全行业工厂利用率危机；EH2 的 Devens 工厂敞口未知
        - 获取或估算 Devens 工厂利用率和积压订单转化时间表
    notes: >-
      方向与时间判断基于 ING Think、National Law Review、Canary Media 和 EH2 新闻稿分析。时间为近似值；准确监管节点可能变化。中国成本数据来自 PV Magazine /
      BloombergNEF（2021 年口径），并有 2024–2026 年部分更新。
