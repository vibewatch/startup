          label: 阶段 4：前端工程设计（FEED）
          description: 签署 FEED 协议；装置集成设计；EPC 承包商选择（Synergen FEED；Roadrunner 的 Weitz EPC）
        - id: fid
          label: 阶段 5：最终投资决策（FID）
          description: 设备供应合同最终确定；项目融资关闭（Infinium 在 Brookfield 和 BE Catalyst 支持下达到 FID；IAG 承购）
