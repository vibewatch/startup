    rows:
      - - IEA Global Hydrogen Review 2025 — 已承诺部署
        - 全球
        - 2030（已承诺项目）
        - '>200 项已承诺投资；2024 年底已部署约 2 GW'
        - 项目数据库自下而上；IEA 跟踪器
        - 高
        - 已承诺 ≠ 已投运；许多项目卡在 FID 到运营之间
      - - BloombergNEF / ING — 清洁 H2 产量预测
        - 全球
        - 需求 2026E：1.8 mtpa；2030E：5.5 mtpa
        - 2030 年需求预测为 5.5 mtpa——若全部为绿氢，意味着电解槽装机约 69 GW
        - 基于政策与成本假设的情景建模
        - 中
        - 各国政府目标到 2030 年为 25 mtpa；相比 BNEF 基准高估 4.5x
      - - Clean Energy Associates / Utility Dive — 制造产能
        - 全球
        - 2027（供给侧）
        - 54 GW/year 制造产能
        - OEM 公布的行业铭牌产能
        - 中
        - 制造产能 ≫ 需求；过剩产能不会直接变成收入
      - - EH2 管线代理指标 — 自下而上的客户预留
        - 西方市场（美国 + 欧洲）
        - 2023（按披露）
        - '>5 GW 已预留；4 个具名客户合同'
        - 订单簿与预留公告
        - 低-中
        - 管线数据已过期（最后更新于 2023 年 10 月）；预留 ≠ 确定订单；此后需求环境已明显恶化
      - - 项目经济性代理指标 — 按行业成本测算的每 GW 资本开支
        - 西方市场
        - 2025–2028 年期间
        - $800–1,200/kW 装机成本意味着每 GW 需 $800M–$1.2B；EH2 工厂 1.2 GW/year 的产能意味着满负荷利用时收入上限约 $1.0–1.5B/year
        - 资本开支强度基准来自 Repsol（€292M/100 MW）和 Synergen（<$1,000/kW TIC）
        - 低
        - SOM 估计受产出产能约束；实际利用率与定价未知
      - - 政府资金承诺 — 全球政策视角
        - 全球
        - '2025'
        - $222B 政府 H2 支持总额；EU $123B
        - ING Think 分析中的政府预算分配与已公布补贴
        - 中
        - 供给侧偏重；仅约 3% 指向需求侧承购；并不衡量资本开支市场规模
    notes: 目前没有单一可信公开估计能界定西方 ≥75 MW 大型 PEM 电解槽的 SAM。各行只是指示性视角，不是等价估计。SAM 和 SOM 无法用公开数据可靠三角验证；按章节简报保留这些矛盾。
