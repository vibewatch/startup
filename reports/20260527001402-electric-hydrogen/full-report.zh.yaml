      - number: '8.5'
        title: 可比估值背景
        blocks:
          - type: paragraph
            body: >-
              EH2 的上市可比公司均处于不同程度的财务困境；这既验证了 EH2 继续保持私有化的决定，也让任何新入场定价都面对极不利的行业情绪。


              Nel ASA 是西方最大的纯电解槽 OEM，2025 全年收入 NOK 963M，经营亏损 NOK 1,365M——亏损率约为收入的
              1.4×。其投资者关系页面强调管线和技术里程碑，但没有给出近期盈利路径证据。ITM Power H1 FY2026 收入 £26.2M，EBITDA 亏损 £33.2M，部分由此前股权融资留下的 £207.6M
              现金抵消。ITM 2026 年初新闻流呈现的是小合同（Octopus Energy Generation 12.5 MW 交易），而不是 EH2 瞄准的 100–240 MW 规模。Plug Power
              则在收入从 2023 年 $891M 降至 2024 年 $628M 后，转向生存型重组叙事；其公开市值约 $1–2B，隐含 1.5–3× P/S——若套用到 EH2 已披露的零收入，估值会是 $0。


              thyssenkrupp nucera 提供了更正面的数据点：2026 年，它在西班牙拿下一个 300 MW 电解项目，价值为低三位数百万欧元，订单收入指引为
              €550–850M。这说明在工业规模且有项目背书时，大额电解槽订单确实存在。EH2 的 Synergen 240 MW FEED 如果转为 FID，将构成规模相近的参考交易。


              可比公司组确认，EH2 的 $1B 估值代表一种当前公开市场没有等价物的技术溢价。该溢价是否合理，完全取决于 Infinium Roadrunner 运行数据和管线 FID 转化能否按期兑现。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV024
