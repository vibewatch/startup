            body: >-
              电解槽行业已进入结构性供过于求危机：到 2025 年，全球制造产能超过 50 GW/year，而年部署约 2 GW，比例为 25:1。Cummins 于 2024 年末退出该行业；2025 年约 50
              个项目取消；美国清洁能源投资取消总额达 $34.8 billion。对 EH2 而言，这意味着 Devens 超级工厂——铭牌产能 1.2
