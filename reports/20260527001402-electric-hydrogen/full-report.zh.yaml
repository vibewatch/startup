        - 关键
        - 没有已确认收入或可信收入运行率，所有 DCF、可比公司和从里程碑到收入的模型都只是猜测
        - 要求自创立以来按年度经审计收入；在手订单账龄表；取消和修改历史；所有活跃合同的 FID 触发里程碑时间表
      - - 按收入来源拆分的毛利率（设备、服务、开发）
        - 利润率路径
        - 关键
        - 公开同行（Nel、ITM）显示未达规模时毛利率深度为负；没有 EH2 实际数据，基准情景必须显著为负；任何正毛利主张都必须验证
        - 要求按收入类型拆分销货成本（COGS）和毛利润；工厂固定成本吸收计划；从当前收入运行率到目标规模的利润率桥
      - - 账面现金、月度烧钱速度和现金跑道（月数）
        - 资本充足性
        - 关键
        - Series C 是 2023；工厂自 2024 以来一直在爬坡；烧钱速度可观；当前流动性决定项目达到 FID 前是否需要新一轮融资
        - 要求最新季度现金头寸；按成本类别拆分的月度烧钱速度；12 个月前瞻现金流预测；信用额度提款状态
      - - Devens 工厂利用率（占 1.2 GW/year 名义产能的 %）
        - 经营杠杆
        - 高
        - 工厂成本结构大多固定；低利用率会放大单位成本并拉大毛利率缺口；利用率低于约 50% 可能意味着显著负毛利率
        - 要求自 2024 工厂开业以来每个月的月度电堆产量、发货节奏，以及相对名义产能的利用率
      - - 每 MW ASP 和订单经济性（合同价值、付款里程碑、违约金（LD）条款）
        - 收入模型
        - 高
        - 所有收入预测都需要单位经济性锚点；没有 ASP，任何模型都不受约束
        - 要求所有已签采购订单的合同摘要，包括 MW 数量、总合同价值、付款里程碑时间表，以及违约金或取消条款
      - - 项目开发管线阶段门和概率加权漏斗
        - 市场进入（GTM）效率
        - 中
        - Ambient 后，EH2 有两套收入机制；项目开发漏斗完全不透明，公开信息只有“美国 10+ 个州的 15+ 个项目”
        - 要求按阶段（线索开发、可行性、FEED、pre-FID、FID）、MW、地区、预期 FID 日期、客户和概率权重列示项目管线
    notes: >-
      以上所有缺口都是 IPO 前工业公司标准财务尽调请求。考虑到 EH2 的私营公司身份，公开资料缺失属于预期之内；但这些数据合起来，是承销公司当前股权估值或设计新融资工具所需的最低数据。Generate Capital $400M
      应按项目融资安排分析，并与 EH2 公司流动性分开建模。
