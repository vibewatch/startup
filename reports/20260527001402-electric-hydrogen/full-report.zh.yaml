      items:
        - label: BNEF 基准情景 — 2030 年清洁氢产量（ING Think 引用）
          low: 3.5
          mid: 5.5
          high: 7.5
          unit: mtpa
          note: BloombergNEF 需求侧模型；代表当前已获资金且有政策支持的项目
        - label: ING Think 行业共识区间 — 2026 年产量（近期）
          low: 1.5
          mid: 1.8
          high: 2.2
