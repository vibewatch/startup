  - id: TP002
    title: 能力、GTM 与信任矩阵
    columns:
      - 公司 / 类型
      - 核心技术与工厂架构
      - 项目开发 / EPC 支持
      - 信任 / 监管姿态
      - 分销 / 承购杠杆
      - 相对 EH2 的主要优势
      - 相对 EH2 的主要短板
    rows:
      - - Electric Hydrogen
        - 标准化大型 PEM 区块工厂（75-120 MW），在模块化撬装上集成辅助系统
        - 提供项目开发支持并推进欧洲项目准备；不是完整工业气体 EPC 栈
        - DNV 验证竞争力、可靠性审查和商业保证
        - 自有下游物流或承购能力有限；靠项目开发商和合作伙伴获胜
        - 标准化、美国制造、总安装成本叙事
        - 渠道力弱于工业气体传统巨头
      - - Nel
        - PEM 与碱性电解槽，具备模块化配置和下一代加压碱性路线图
        - 与 Samsung E&A 建立战略 EPC 合作，并有活跃 FEED 管线
        - 百年运营历史；2025 年拿到公司史上最大 PEM 订单
        - 由 OEM 销售驱动，而非承购驱动；依赖项目 FID 填充产能
        - 装机基础和宽产品集
        - 2025 年取消订单和产能闲置削弱定价权
      - - thyssenkrupp nucera
        - 工业碱性 20 MW 模块可扩展至 GW 级工厂；撬装且单电池设计便于维护
        - 可行性、LCOH、FEED、调试和全生命周期支持
        - TUV / ISO 22734 背书和极大的工业案例基础
        - 强工业关系和 EPC 式项目塑形能力
        - 工业可融资性、服务网络和案例规模
        - 与坚持 PEM 动态响应或紧凑占地的买方匹配度较低
      - - ITM Power
        - PEM 专家，拥有模块化产品家族，并有数座 100 MW 工厂纳入交付范围
        - 产品销售、咨询和维护；不像 nucera 或 Linde 那样偏集成商
        - FAT 通过率提升，上市公司披露纪律更强
        - 下游渠道杠杆有限；仍是 OEM 驱动型销售
        - 聚焦 PEM 专业化，流动性相对较强
        - 工厂成本吸收不足，旧代库存承压
      - - Plug Power
        - PEM 电解槽连接更宽的氢生产和燃料使用生态
        - 在部分客户中，可将电解槽与氢燃料和物流能力打包
        - 上市公司披露和全球客户足迹
        - 氢供应路径强于多数 OEM，但不是 Air Products 式全球工业气体网络
        - 平台宽度和既有氢业务
        - 战略收窄暗示需求受限，也体现资本纪律
      - - Bloom / Topsoe SOEC
        - 为高效率和热集成优化的固体氧化物电解
        - Topsoe 明确围绕下游电子燃料和保证做定位；Bloom 以电效率主张竞争
        - INL 验证 Bloom 效率主张；Topsoe 有性能保证计划和工业规模工厂
        - 氢交付网络有限；在项目经济性与流程集成绑定时最强
        - 有废热或下游合成时，LCOH 可能更低
        - 并非每类 PEM 项目画像都能直接插拔替代
      - - Linde / Air Products
        - 多种电解槽技术，加上完整氢系统集成和物流
        - 建设-拥有-运营、EPC、液化、储存、分销和氨出口能力
        - 数十年工业气体安全与运营信任
        - 渠道、承购和既有客户基础设施杠杆最高
        - 执行确定性，以及打包整条价值链的能力
        - 标准化单一产品叙事弱于 EH2 的 HYPRPlant 切入点
    notes: 各行把异质竞争者压缩进可比较的购买标准列；判断是方向性的，依据所引用的公开来源包，而非单一基准数据集。
