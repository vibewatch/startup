      - number: '5.3'
        title: 成熟度、路线图与差异化
        blocks:
          - type: paragraph
            body: >-
              公开成熟度证据显示，Electric Hydrogen 不是从实验室直接跳到吉瓦叙事，而是阶梯式推进。公司的 1 MW 工厂自 2022 年运行，用于开发全厂控制和安全设计。Pioneer 工厂自 2024 年
              1 月运行，采用全尺寸商用电堆，并使用 HYPRPlant 大部分相同的电力和工艺组件，规模为其十分之一。到 2026 年，面向 Infinium Roadrunner 场址的首套商用 100 MW
              工厂正在调试。更多具名项目扩展了版图：Uniper 选择 EH2 参与德国 200 MW pre-FEED；HIF 选择公司用于 Texas e-fuels 设施；Synergen 在 FEED 下选择两套
              120 MW 工厂。已公开披露的 Devens 制造能力为每年 1.2 GW；本次审阅材料未披露单独的每年 500 MW 过渡爬坡目标。

              差异化落在集成和可制造性上。DNV 验证的不只是电堆技术，还包括工厂设计、制造质量、可靠性和商业保证。不过，竞品基准很强。Accelera 宣传认证和数字监控，Nucera 强调装机基础和有 ISO
              支撑的碱性系统，Topsoe 销售 SOEC 效率和服务保修，Bloom 销售效率和大型电池 / 电堆制造，Linde 销售一体化工业气基础设施，Nel 销售装机基础广度。因此 EH2
              的公开优势更窄也更具体：一套标准化 PEM 工厂，目标是在 100 MW 以上项目中降低总安装成本并压缩交付时间。Roadrunner 和后续工厂的现场执行，是把这一叙事转化为持久优势的证明点。
