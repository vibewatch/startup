  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接、既有、相邻、替代与现状竞争版图
        blocks:
          - type: paragraph
            body: >
              Electric Hydrogen 的竞争场域不只是“其他 PEM 创业公司”。买方真正要解决的问题，是采购一套工业制氢系统，它能完成财务交割、通过工程尽调，并以可接受的平准化制氢成本运行。因此，EH2
              首先与直接电解槽 OEM 同行竞争——Nel、ITM Power、Plug Power、Accelera/Cummins，以及很多情况下的 thyssenkrupp
              nucera——因为即便底层化学路线不同，项目开发商也会比较工厂级电解平台。EH2 自身切入口异常具体：标准化 75 MW、100 MW 或 120 MW 一体化 PEM 工厂，以撬装交付并包含工厂配套系统，在
              Massachusetts 和 Texas 制造，同时明确宣称总安装成本更低、调试更快。


              相邻替代技术有实际意义。Bloom Energy 和 Topsoe 都在推动固体氧化物电解；当有余热或能与氨、甲醇、SAF 下游紧密集成时，它们主张这条路径可带来更低
              LCOH。工业气体巨头在战略上更重要。Linde 可以建设、持有并运营电解槽，同时利用既有液化器、管道和分销网络；Air Products 在 NEOM 证明，它能在 4 GW 可再生能源规模下担任
              EPC、系统集成商和独家承购方。这些公司卖的不只是电堆，而是执行确定性和市场路径。


              最强替代仍是维持现状和内部自建。在需求弱的地区，灰氢或蓝氢短期经济性仍占优；Repsol 等一体化工业买方也可以选择把电解直接嵌入炼厂或燃料综合体，而不是依赖一家独立 OEM 掌握客户关系。现实中，EH2
              因此同时面对五类竞争：直接 OEM 同行、既有碱性供应商、固体氧化物效率挑战者、工业气体集成商，以及客户继续使用化石来源氢或自行集成氢资本开支的能力。
