  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 已交付系统与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Electric Hydrogen 的产品更应理解为面向工业项目开发商、由工厂制造的制氢工厂，而不是卖进他人辅助系统资产负债表的一套商品化电堆。公开页面一贯把 HYPRPlant
              描述为完整、预工程化的电解槽工厂，包含把电力和水转化为氢所需的周边电力转换、气体处理、水处理和热管理设备。公司卖进的项目工作流，是客户试图让炼厂脱碳、e-fuels、氨以及其他重工业应用在 75 MW 到 120
              MW 规模上算得过账。因此销售动作也对应企业级、项目牵引：公开表单要求填写行业、项目规模和地点，而不是提供任何自助购买或公开标价路径。

              本次审阅的公开材料没有显示单独营销的电堆 SKU 名称。公司呈现的是置于 HYPRPlant 内部的全尺寸商用 PEM 电堆核心模块。这一点对尽调很重要，因为 EH2
              面向客户的主张不只是更好的电化学；它承诺把电堆设计、模块化工厂工程、制造、运输和调试一起优化，以降低总安装成本并压缩投运时间。因此，产品线由标准 75 MW、100 MW 和 120 MW
              工厂型号组成，再加上更早成熟度资产——1 MW 工厂和 Pioneer 工厂——用来证明商业架构如何在首个客户交付前跑通。
