      - number: '2.2'
        title: 市场规模测算——多视角分析与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >
              测算 EH2 的市场需要多个视角，因为没有任何单一可靠的公开估计能对应 EH2 实际销售的狭窄细分（大型西方 PEM 电解槽，≥75
              MW）。下文使用四个不同视角：供给侧产能、产量、政策和政府资金承诺，以及自下而上的项目管线。这些视角差异很大，任何单一数字都会扭曲真实不确定性。


              供给侧视角显示严重过剩。IEA 称，全球电解槽制造产能从 2022 年约 10 GW/year 扩到 2025 年超过 50 GW/year。相比之下，2024 年底全球已安装电解槽产能仅约 2
              GW——部署与产能之比约为 1:25。Clean Energy Associates 预测，到 2027 年制造产能将达 54 GW，而年需求预计只有约 5 GW，意味着短期内行业制造供给超过所需 10 倍。


              产量视角显示愿景与现实分叉。全球清洁氢产量预计在 2026 年约翻倍至 1.8 million tonnes per year，但仍不到全球氢使用量的 2%。到 2030 年，BloombergNEF 预测为
              5.5 mtpa，而各国政府目标合计约 25 mtpa，差距 4.5x。如果以约 50 kWh/kg 效率、平均每年运行 4,000 小时的电解槽生产 5.5 mtpa 清洁氢，隐含的已安装电解槽基数约为 69
              GW——明显高于当前任何可信的 2030 年需求预测。


              政策和资金承诺视角补充了规模背景：2025 年全球政府为蓝氢和绿氢配置 $222 billion（较 2024 年下降 20%），其中 EU 和成员国约提供 $123 billion。但其中只有约 3%
              支持需求侧承购——大多数资金流向供给侧或基础设施。供给倾斜而缺少绑定需求，会放大设备供应商的市场风险。


              自下而上管线视角最贴近 EH2：截至 2026 年，全球约 1,700 个清洁氢项目停留在图纸阶段，IEA 口径下超过 200 个已有承诺投资。EH2 截至 2023 年 10 月报告预订量超过 5
              GW；四个具名客户合同已公开确认。EH2 SAM 与任何公开全球 TAM 估计之间的测算缺口，无法用公开数据可靠填补；规模表（TM002）中的 SAM 和 SOM 估计具有高不确定性，矛盾被保留下来。
