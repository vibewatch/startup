      - number: '8.6'
        title: 退出准备度与尽调要求
        blocks:
          - type: paragraph
            body: >-
              传统意义上，EH2 尚未具备退出条件。IPO 至少需要 $100M 的过去 12 个月收入、可信的 EBITDA 转正路径，以及没有陷入生存型财务困境的公开市场可比公司；截至 2026
              年中，这些条件均不成立。公开电解槽 OEM 市场背景（Nel、ITM Power、Plug Power 均深度亏损，行业下行周期）使干净的 IPO 窗口实际关闭，至少要到 2028–2029 年，并取决于绿氢项目
              FID 是否恢复。


              战略 M&A 是更可行的退出情景。潜在买方包括寻求垂直整合的石油巨头（TotalEnergies、Equinor、JERA）、希望拥有上游规模化电解能力的工业气体公司（Air Products、Linde、Air
              Liquide），以及已承诺清洁氢的大型综合集团（Baker Hughes、GE Vernova）。DNV 验证和具名项目管线会降低产业买方的尽调摩擦。鉴于 EH2 的制造规模和技术差异化，相对可比 OEM
              倍数支付 30–50% 战略溢价是合理可能的。


              任何投资决策前，五项尽调要求最关键。第一：Infinium Roadrunner 投运数据包——运营前 90
              天的实际可用率、单位能耗和衰减曲线。第二：完整股权结构表、优先权堆叠和信贷额度约束披露。第三：单位经济模型——100 MW 规模下每安装 kW 的 COGS、毛利率和贡献毛利。第四：Synergen 与 HIF
              Global 的确定 FID 时间表和承诺融资状态。第五：在当前没有商业收入的情况下，烧钱速度和现金跑道。
