      - number: '4.2'
        title: 成本结构、毛利驱动因素与单位经济
        blocks:
          - type: paragraph
            body: >
              Electric Hydrogen 的成本结构资本密集、资产重，贯穿价值链每个环节。主要成本中心包括 Devens
              超级工厂的电堆制造（设施资本、制造人工、直接材料，包括铂族金属催化剂、膜电极组件和钛部件）、Texas 的工艺模块制造（由当地油气行业制造合作伙伴承接，具备撬装建造经验）、电力转换和工厂配套系统集成、EH2
              制造模式特有的产线末端电堆测试，以及现场调试人工。工厂交付后的质保和服务义务进一步增加负债，视收入确认政策而定，可能在资产负债表上归类为递延成本或准备金。


              EH2 不公开披露毛利率、每 MW 制造成本、销货成本或运营费用。公司称，相比替代电解槽方案，HYPRPlant 可把项目总安装成本最多降低 60%，并在高可再生能源州争取到 2030 年左右以约
              $1.50/kg、到 2031 年以 $1/kg（DOE Hydrogen Shot 目标）实现与化石燃料制氢的成本平价。这些是客户侧平准化制氢成本（LCOH）目标，不是 EH2 的毛利披露。


              公开可比同行证实，大型 PEM 电解槽制造商在爬坡期当前普遍为负毛利或薄毛利。Nel 2025 年收入 NOK 963 million，经营亏损 NOK 1,365
              million——利用率低、项目取消和固定制造成本基数导致利润率深度为负。ITM Power FY2025 收入 £26.0 million，adjusted EBITDA 亏损 £33.0
              million，其中包括约 £9.6 million 工厂成本吸收不足和 £13.2 million 库存减记。Plug Power 2025 年出货超过 185 MW 电解槽，同比增长 203%，但仍亏损，并在
              Project Quantum Leap 下做战略重定位。Topsoe 报告 2025 年收入 DKK 8,197 million，但指出低碳项目延期和市场不确定性拖慢 SOEC 订单转化。


              这些可比公司合在一起说明，早期 PEM OEM 如果利用率不到满产，很可能在制造吞吐达到铭牌产能的有意义比例之前一直承受负毛利。EH2 的 1.2 GW/year Devens 工厂于 2024
              年开业；第一套商用 HYPRPlant 已发往 Infinium，但截至 2026
              年仍在调试。若工厂只以铭牌产能的一小部分运行，固定开销会摊到很小的收入基数上，短期内产生大幅负毛利。工厂利用率百分比没有公开披露。


              这一阶段的项目 OEM 营运资本动态不利。大型氢项目的资本设备客户通常按工程完成、工厂验收测试和调试等里程碑付款——这意味着 EH2
              必须在里程碑付款到账前先垫付制造成本。部分制造完成的电堆库存、等待客户订单确认的撬装模块、进行中的工程合同，都会拖累营运资本。异地制造模式（Massachusetts 生产电堆，Texas
              生产撬装模块）还增加地理物流成本。


              服务和质保义务是工业 OEM 设备的标准配置，但 EH2 的规模未知。DNV 于 2025 年 7 月发布的技术尽调审查确认
              HYPRPlant“高度可靠”且“在成本和当前商业保证上高度有竞争力”，意味着质保条款符合市场标准、可被银行接受——但交付后服务的财务准备或溢价结构没有公开披露。
