      - number: '3.4'
        title: 护城河耐久性、商品化风险与竞争者反向证据
        blocks:
          - type: paragraph
            body: >
              最残酷的竞争事实是，行业在需求真正起来之前已经供给过剩。2024 年底全球约 2 GW 电解槽在运行，而 2025 年制造产能扩至 50 GW 以上，并有望在 2027 年达到 54 GW。ING 的 2026
              年分析补上了同一问题的需求侧：2025 年约 50 个项目公开取消，氢仍困在试点阶段，政府支持中只有约 3% 投向需求创造，而 45V 的开工截止日期提前到 2027
              年底之后，美国对大型绿氢项目的吸引力下降。这一组合会摧毁所有 OEM 的定价权，不只是落后者。


              竞争者反向证据证实了结构性问题。Nel 削减产能，取消订单侵蚀积压。ITM 虽然收入和现金改善，但仍承受工厂吸收不足和老一代库存压力。Cummins/Accelera 与商业电解槽业务暂停相关。Plug
              收窄战略，而不是庆祝品类级需求爆发。即便 Topsoe 规模更大且业务更多元，也表示低碳项目推迟和市场不确定性拖累收入与订单转化。这些不是孤立执行错误，而是全行业证据：买方犹豫正在压缩整个领域。


              EH2 仍有真实但狭窄的护城河。当客户需要大型标准化西方 PEM 工厂、贷方友好的验证、快速模块化部署，以及一定项目开发支持，同时又不想购买完整工业气体一体化方案时，EH2
              看起来最强。当集成商能捆绑承购和物流、SOEC 玩家能把余热转化为显著更低运营成本、买方能在既有工业综合体内自行集成氢，或中国成本压力重置市场对可接受电解槽经济性的预期时，护城河最弱。因此，核心尽调问题不是
              EH2 是否有差异化，而是这种差异化是否足够大，能在供给过剩、且更大玩家可从价值链相邻环节进攻的市场里守住利润率和订单转化。
