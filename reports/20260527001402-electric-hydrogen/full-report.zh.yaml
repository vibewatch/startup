  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手 / 替代方案
      - 类别
      - 公开规模 / 融资信号
      - 目标买方
      - 产品范围
      - 战略方向 / 限制
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the most relevant direct OEMs, adjacent technologies, integrators, and substitute paths evidenced in
        the 2026 source pack rather than every global electrolyzer supplier.
    rows:
      - - Electric Hydrogen
        - 直接 OEM 基准
        - 1.2 GW/year 美国制造模式；75 MW / 100 MW / 120 MW 标准工厂；DNV 验证
        - 电子燃料、氨、欧洲工业氢的大型项目开发商
        - 集成 PEM 工厂，包含辅助系统、模块化撬装和项目开发支持
        - 标准化和本土制造叙事很强，但下游分销与承购能力弱于传统厂商
      - - Nel
        - 直接 OEM 同业
        - 3,800+ 台电解槽已安装；2025 年收入 NOK 963m；积压订单 NOK 1,319m；Heroya 产能按需求调整
        - 比较 PEM 与碱性路线的工业氢和 Power-to-X 开发商
        - PEM 与碱性电解槽，加上 EPC 合作伙伴和下一代加压碱性产线
        - 装机基础带来较强可信度，但 2025 年取消订单、积压订单下降、产能闲置都是实质反向信号
      - - thyssenkrupp nucera
        - 传统电解 OEM
        - '>10 GW 已安装；>3 GW 已签约；>600 个项目；1.5 GW/year 供应链；300 MW 西班牙中标'
        - 炼油、氨、电子燃料、钢铁及其他工业氢项目
        - 工业规模碱性电解、FEED/LCOH 研究、预制撬装工厂、全生命周期服务
        - 服务和 EPC 可信度深，但技术路线是碱性，不是 EH2 的 PEM 切入点
      - - ITM Power
        - 直接 PEM 同业
        - FY2025 收入 £26.0m；积压订单 £145.1m；现金 £207m；>400 MW 已交付或在建
        - 寻找 PEM 专家的大型绿氢开发商
        - PEM 电解槽、模块化 NEPTUNE / POSEIDON 产品组合、咨询和维护
        - 财务纪律和积压订单好于早期周期，但毛亏损仍显示工厂利用率承压
      - - Plug Power
        - 宽口径氢能平台同业
        - '>185 MW 于 2025 年出货；>70 台累计 >317 MW；具备上市公司披露体系'
        - 需要电解槽，同时需要氢供应或物料搬运生态链接的客户
        - GenEco 电解槽、氢生产网络、物料搬运燃料电池平台
        - 平台宽度真实存在，但 2025 年定位是重新聚焦最高价值市场，并非全品类需求爆发
      - - Bloom Energy / Topsoe
        - 相邻技术替代品
        - Bloom 称年制造能力 >2 GW；Topsoe 称拥有 500 MW SOEC 工厂和 DKK 4,859m 积压订单
        - 电效率、废热或紧密下游集成主导决策的项目
        - 固体氧化物电解，带有高效率主张，以及强氨 / 甲醇 / SAF 集成叙事
        - 在合适用例中 LCOH 叙事很强，但不是 EH2 低温 PEM 标准工厂模式的直接复制品
      - - Accelera by Cummins 竞品
        - 直接或相邻 PEM 同业
        - 500,000+ 电堆运行小时；60+ 台已部署设备；背靠 Cummins 制造与安全资历
        - 需要认证深度 PEM 的油气、工业气体及其他安全敏感买方
        - HyLYZER PEM 平台、数字监控、全球支持、Cummins 制造基地
        - 安全和传统工业信任很强，但行业逆风已让 Cummins 释放商业收缩信号
      - - Linde / Air Products
        - 集成商 / 工业气体传统巨头
        - Linde 拥有 80+ 个碱性安装项目和建设-拥有-运营资产；Air Products 作为 EPC 和承购方牵头 4 GW / 600 tpd NEOM 项目
        - 优先看重执行确定性、氢物流和下游承购的工业买方
        - 电解加上液化、管道、分销、氨运输和长期氢价值链控制
        - 对 EH2 最强的执行和渠道威胁：客户可以买整条价值链，而不是只买一座工厂
      - - 灰氢 / 蓝氢和内部自建
        - 现状方案 / 替代品
        - 灰氢仍明显更便宜；Repsol 100 MW / €292m 炼厂项目显示，大买方能自行集成绿 H2 资本开支
        - 已有氢需求和运营资产的炼厂、化工企业及工业场址
        - 化石来源氢、碳捕集变体，或内部集成电解部署
        - 惯性最高的替代方案，因为它保留既有资产、运营模式和买方控制权
    notes: 公开定价稀少，因此规模信号混合了装机基础、积压订单、工厂出货、工厂产能和项目中标，而不是干净的收入倍数或完全一致的订单指标。
