company:
  name: Electric Hydrogen
chapter:
  number: 1
  title: Company Overview
  summary: Electric Hydrogen (EH2) is a U.S. manufacturer of high-power PEM electrolyzers, founded in 2020 by Raffi Garabedian (CEO), David Eaglesham (CTO), and Derek Warnick (CFO)—all veterans of First Solar and Breakthrough Energy Ventures. Its flagship product, HYPRPlant, is offered in 75 MW, 100 MW, and 120 MW variants and is designed to deliver the lowest total installed cost for industrial-scale green hydrogen production. The company's 1.2 GW/year Devens, Massachusetts gigafactory opened in 2024. EH2 has secured over $750 million in financing, including an oversubscribed $380 million Series C at roughly a $1 billion valuation in October 2023, plus a $100 million corporate credit facility and $65 million in DOE support. Named customer wins include Infinium (Project Roadrunner in Texas), HIF Global (Texas e-fuels), Synergen (240 MW FEED agreement), and Uniper (200 MW pre-FEED for Green Wilhelmshaven in Germany). The company has also acquired Ambient Fuels and partnered with Generate Capital on up to $400 million in project finance solutions. Adverse context includes CEO-acknowledged sector demand headwinds with another year and a half of muted activity expected and structurally challenging U.S. green hydrogen economics under the current natural-gas price environment.

sections:
- id: identity-and-mission
  title: Identity, Mission, and Business Model
  body: 'Electric Hydrogen Co. (trading as Electric Hydrogen, abbreviated EH2) was founded in 2020 in the San Francisco Bay Area and Massachusetts with a single stated purpose: manufacturing the world''s most powerful and lowest-cost electrolyzers to make green hydrogen an economic inevitability for heavy industry. The company''s official tagline—"Making Molecules to Decarbonize Our World"—reflects its singular focus on proton exchange membrane (PEM) electrolysis at industrial scale, targeting steel, fertilizer, ammonia, shipping, aviation, and chemicals.


    The core product is HYPRPlant, a fully integrated electrolyzer plant shipped on factory-fabricated skids that includes all balance-of-plant components: power conversion, gas processing, water treatment, and thermal management. HYPRPlant is available in three standard capacity variants: 75 MW, 100 MW, and 120 MW. The 100 MW variant produces approximately 50 tons of green hydrogen per day. The company claims HYPRPlant reduces total installed project costs by up to 60% compared with alternative electrolyzer solutions and enables delivery-to-commissioning in under six months.


    EH2''s business model combines product sale (selling fully integrated HYPRPlant systems to project developers), manufacturing-as-a-service (producing stacks at the Devens gigafactory while process modules are fabricated in Texas), and—following the 2025 acquisition of Ambient Fuels—a co-development and project-finance channel supported by a $400 million facility with Generate Capital. The company positions itself against both incumbent PEM competitors and lower-cost Chinese alkaline electrolyzers, arguing that its engineering heritage from solar cost reduction creates a durable efficiency and manufacturing cost advantage. As of the 2026 run date, EH2 is headquartered in Devens, Massachusetts, with a pioneer demonstration plant in San Jose, California, a fabrication facility in West Texas, and commercial teams in Spain, Denmark, Germany, Belgium, Australia, and Brazil.'
