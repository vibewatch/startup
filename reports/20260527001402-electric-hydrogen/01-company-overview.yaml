- id: milestones-and-adverse
  title: Milestones, Partnerships, and Adverse Context
  body: 'EH2''s public milestone record spans founding in 2020 through a series of financing events, manufacturing build-out steps, named customer wins, and geographic expansion through 2025. On the product side, the company transitioned from the original 100 MW plant branding to the "HYPRPlant" product name in 2025 and expanded the offering to 75 MW and 120 MW variants. On the customer side, the announced pipeline includes Uniper''s 200 MW Green Wilhelmshaven pre-FEED project in Germany (pre-FEED started October 2024), Infinium''s 100 MW Project Roadrunner in Pecos, Texas (deployment underway), HIF Global''s Texas e-fuels facility, and Synergen Green Energy''s 240 MW FEED agreement (two 120 MW HYPRPlants, FID targeted 2026). The acquisition of Ambient Fuels and the Generate Capital partnership were announced in September 2025 with the transaction having closed in May 2025, adding project co-development and up to $400 million in project finance to EH2''s customer offering.


    Geographic expansion milestones include the appointment of Bruno Forget as GM for Europe and MENA (September 2025) and Maria Gabriela da Rocha Oliveira as GM for LATAM (December 2025), reflecting a deliberate pivot toward European demand driven by RED-III compliance mandates and higher gas prices. In July 2025, independent engineering firm DNV completed a comprehensive technical due diligence review of HYPRPlant, concluding the offering is "very competitive and unique in the market."


    The principal adverse signal is market-demand softness. In a May 2026 Canary Media interview, CEO Garabedian acknowledged that EH2 had "built the company for growth" but is now facing slower-than-expected demand and expects "another year and a half of muted activity." He noted that green hydrogen in the U.S. remains roughly three times more expensive than gray hydrogen even with 45V tax credits, and that U.S. politics and natural-gas prices make it "hard to impossible for green hydrogen to compete head-to-head economically." IEA data confirm that global electrolysis capacity reached only about 2 GW at end-2024 against more than 50 GW of manufacturing capacity, implying severe sector-wide utilization pressure. EH2''s strategic response is a European pivot and co-development model, but material revenue and delivery execution remain forward-looking risks as of the run date.'
