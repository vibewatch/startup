- id: leadership-and-governance
  title: Founders, Leadership Bench, and Governance Signals
  body: 'The founding triad at Electric Hydrogen carries substantial industry pedigree. Raffi Garabedian (CEO and Co-founder) served as CTO of First Solar during the phase that drove module costs from $0.65 per watt to $0.20 per watt and scaled production from 1.9 GW to 5.5 GW annually. David Eaglesham (CTO and Founder) was a serial cleantech technologist and former Entrepreneur in Residence at Breakthrough Energy Ventures; he preceded Garabedian as First Solar''s CTO during the 1.9 GW era. Derek Warnick (CFO and Co-founder) was formerly CFO of FGE Power and a Company Builder at Breakthrough Energy Ventures. This three-founder structure, with identical institutional heritage and complementary commercialization, technology, and capital responsibilities, is coherent with EH2''s stated ambition to replicate the cost-reduction discipline of the solar industry in electrolyzer manufacturing.


    The broader leadership bench is publicly identified and functional. Beth Deane (Chief Legal Officer) brings a decade of project-development legal work from First Solar and Leeward Renewables. Jason Mortimer (SVP Commercial) led sales at Level10 Energy and spent a decade at SunPower. Renata Naoumov (Chief People Officer) scaled HeartFlow from 100 to 500 employees. Jigish Trivedi (SVP Manufacturing) leads production at Devens. Jacob Susman (SVP Development), who founded Ambient Fuels before EH2 acquired it in 2025, now leads project development.


    Governance disclosures are limited. EH2 publishes a Supplier Code of Conduct, a Code of Business Conduct, and a 2024 Sustainability Report through its Governance and Sustainability page, but does not publicly disclose board composition, investor voting rights, or the specific governance provisions attached to its large syndicate of strategic investors. Key-person risk is concentrated in the founding trio, particularly Garabedian as the public face of commercial strategy and market positioning.'
