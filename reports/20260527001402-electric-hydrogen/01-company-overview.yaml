- id: funding-and-investors
  title: Funding History, Valuation, and Investor Base
  body: 'Electric Hydrogen has assembled one of the largest private financing stacks in the electrolyzer sector. Since founding in 2020, the company completed multiple equity rounds anchored by deep cleantech investors (Breakthrough Energy Ventures, Capricorn Partners, Energy Impact Partners, Fifth Wall, Prelude Ventures, S2G Ventures) before its oversubscribed $380 million Series C in October 2023—the round that established EH2 as green hydrogen''s first unicorn at approximately $1 billion valuation. The Series C was led by Fortescue, Fifth Wall, and Energy Impact Partners and added a wide syndicate of strategic investors including bp Ventures, Oman Investment Authority, Temasek, Microsoft''s Climate Innovation Fund, United Airlines Sustainable Flight Fund, Kajima Ventures, Fatima Holdings USA, Amazon''s Climate Pledge Fund, Equinor Ventures, Mitsubishi Heavy Industries, and Rio Tinto.


    Beyond equity, EH2 has layered in government and institutional capital. The U.S. Department of Energy awarded a $46.3 million grant under the Bipartisan Infrastructure Law''s Clean Electrolysis Program and an $18.3 million transferable tax credit under Section 48C of the Inflation Reduction Act, bringing total DOE support to $65 million. In 2024, the company closed a $100 million corporate credit facility led by HSBC, with participation from J.P. Morgan, Stifel Bank, and Hercules Capital—marking what CFO Warnick described as "a step-change in Electric Hydrogen''s access to capital and overall maturity." The company also received $50 million in equipment financing from Trinity Capital.


    EH2''s public-facing materials describe total financing to date of over $750 million, with the company website stating "over $700M raised from leading investors and banks." Precise equity-round sizing below Series C and current post-Series C valuation are not publicly disclosed. No secondary transactions or convertible-note activity has been publicly reported. The strategic composition of the cap table—with industrial end-users like Fortescue and Rio Tinto alongside climate-mandate investors like Microsoft and United Airlines—reflects EH2''s intent to secure both equity capital and customer-market access.'
