  evidenceGaps:
  - id: EGO001
    topic: Equity round history and sizes below Series C
    type: private-evidence-only
    severity: material
    description: Pre-Series C round names, sizes, and closing dates have never been publicly disclosed by EH2. Only the combined post-Series C total of >$600M is stated in the Series C press release.
    diligencePath: Request cap-table summary and Series A/B closing documents in due diligence.
  - id: EGO002
    topic: Current post-Series C valuation
    type: private-evidence-only
    severity: material
    description: No equity event has been publicly announced since October 2023. The ~$1B valuation is the last publicly attached mark. Any 409A or secondary transaction data would be private.
    diligencePath: Request most recent 409A valuation report and any secondary transaction documentation.
  - id: EGO003
    topic: Revenue, run-rate, and gross margin
    type: private-evidence-only
    severity: blocking
    description: EH2 is private and has disclosed no revenue figures, ASP per MW, margin structure, or recognized-revenue policy. These are critical for valuation chapter.
    diligencePath: Request audited financial statements and management accounts for 2023-2025.
  - id: EGO004
    topic: Updated customer backlog or pipeline beyond 5 GW (2023 figure)
    type: stale
    severity: material
    description: The last backlog disclosure was ">5 GW reserved" in October 2023. No subsequent pipeline update has been issued despite multiple named 2025 wins.
    diligencePath: Request current order book, signed contracts vs. LOIs, and cancellation provisions.
  - id: EGO005
    topic: Board composition and investor governance rights (TO002)
    type: private-evidence-only
    severity: material
    description: EH2 does not disclose board members, investor board seats, or protective provisions in its public materials. The breadth and strategic diversity of the Series C syndicate makes governance structure a material diligence item.
    diligencePath: Request certificate of incorporation, investor rights agreement, and voting agreement.
    relatedTableRefs:
    - TO002
  - id: EGO006
    topic: Investor ownership percentages and pre-Series-C cap table (TO003)
    type: private-evidence-only
    severity: material
    description: Ownership stakes, preference stack, and pro-rata rights are not disclosed publicly. Only investor names are known from press releases; no equity percentages or liquidation preferences have been shared.
    diligencePath: Request cap-table summary and Series A/B closing documents in due diligence.
    relatedTableRefs:
    - TO003
  - id: EGO007
    topic: Pre-Series-C financing rounds, dates, and round sizes (TO004)
    type: private-evidence-only
    severity: moderate
    description: Series A and B round names, sizes, and closing dates have never been publicly disclosed. The milestone table reflects only publicly verifiable events; pre-2023 financing milestones are incomplete.
    diligencePath: Request full financing history with closing dates, amounts, and lead investors from company.
    relatedTableRefs:
    - TO004
