- id: cover-metrics
  title: Cover Metrics and Data Gaps
  body: 'EH2 is a private company and does not publish audited financial statements. The metrics below represent the best publicly available position as of the 2026 run date; gaps reflect genuinely unavailable private data rather than researcher failure. The company reports over 300 employees across the Americas, Asia Pacific, and Europe—a figure consistently cited in press releases from 2024 onward. An earlier 2023 announcement ahead of the Devens factory opening described "nearly 300 people." No official headcount update beyond "over 300" has been issued for 2025 or 2026.


    Revenue and run-rate are not publicly disclosed. No customer pricing, contract volumes, or recognized revenue figures have been shared in any press release or public filing. Customer reservation depth has been publicly cited as "more than 5 GW of its electrolysis systems reserved by customers" in the October 2023 Series C announcement, but no updated backlog or pipeline figure has been released since. The Devens gigafactory opened in 2024 with 1.2 GW/year stated nameplate capacity; factory utilization is not public. Cover metrics that can be computed from public sources are noted in the Snapshot KPI table (TO001) with confidence levels; all unsupported private metrics use null values.'
