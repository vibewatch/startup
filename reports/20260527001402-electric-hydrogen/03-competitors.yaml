- id: peer-profiles-and-positioning
  title: Competitor Profiles, Scale Signals, and Strategic Positioning
  body: |
    The most relevant direct peer cohort is diverse in maturity but not in ambition. Nel remains the installed-base leader with more than 3,800 electrolysers worldwide, but its 2025 annual report is materially adverse: revenue fell 31% to NOK 963 million, order backlog fell 18% to NOK 1,319 million, and cancellations plus low order intake forced temporary idling of Heroya alkaline production lines. thyssenkrupp nucera approaches the market from the opposite angle: more than 600 projects, over 10 GW installed capacity, over 3 GW contracted capacity, FEED-to-operation services, and a newly disclosed 300 MW Spain project in the low three-digit million-euro range. ITM remains a meaningful PEM specialist rather than a marginal startup: it says it is already entrusted with several 100 MW plants, ended FY2025 with £145.1 million backlog and £207 million cash, and has more than 400 MW delivered or in build, albeit while still posting gross losses from under-absorbed factory costs.

    Plug and Accelera show how broad hydrogen platforms intersect with electrolysis. Plug narrowed 2025 strategy to electrolyzers, material handling, and hydrogen fuel under Project Quantum Leap and shipped more than 185 MW during the year, but its official review also reads like a refocused survival story in a difficult market. Accelera markets oil-and-gas-grade safety, digital monitoring, and Cummins-backed financial strength with more than 500,000 operational stack hours and 60-plus deployed HyLYZER units, yet the same market weakness pushed Cummins to halt commercial electrolyzer efforts representing roughly 1 GW of capacity according to Canary. That is strong adverse evidence that credibility and manufacturing pedigree do not by themselves create durable demand.

    The adjacent and incumbent layer is equally formidable. Bloom's attack is electricity efficiency, not turnkey plant standardization: it says Bloom Electrolyzer is the most efficient commercial-scale electrolyzer and that Bloom can manufacture more than 2 GW annually. Topsoe's attack is downstream integration: its SOEC is designed for ammonia, methanol, and SAF, promises 20-30% higher efficiency than low-temperature electrolysis when waste heat is available, and is now backed by a 500 MW Herning factory. Linde and Air Products are harder for EH2 to dislodge because their competitive proposition is not just the electrolyzer itself but the surrounding industrial-gas system, logistics, and customer trust.
