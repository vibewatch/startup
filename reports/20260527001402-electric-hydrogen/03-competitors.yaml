- id: capability-pricing-and-switching-costs
  title: Capability, Pricing, GTM Power, and Switching Costs
  body: |
    The critical comparison point is total project execution, not nameplate stack performance in isolation. EH2 explicitly sells total installed cost reduction and faster commissioning from a standard plant architecture; nucera emphasizes FEED studies, LCOH analysis, maintainability, and lifecycle services; ITM emphasizes modular PEM products and quality improvement; Topsoe and Bloom emphasize lower power consumption in contexts where heat integration matters; Linde and Air Products sell a broader industrial-gas solution that includes operation, logistics, or offtake. In other words, large buyers are comparing bankability packages, warranty packages, and execution models just as much as they are comparing cell chemistry.

    Public pricing transparency is poor. No source in the current pack provides a clean list-price table across EH2, Nel, ITM, nucera, or Plug. Instead, the public record exposes project-capex proxies: EH2 claims up to 60% lower total installed cost, Synergen has publicly tied viability to sub-$1,000/kW total installed cost, and Repsol's 100 MW Petronor project gives a concrete benchmark of €292 million for a large refinery-integrated plant. That opacity itself is strategically meaningful: this is a negotiated EPC-and-project-finance market, not a transparent catalog market.

    Switching costs are also asymmetrical. Before FEED or pre-FEED, buyers can compare PEM, alkaline, SOEC, and integrator-led routes with relatively low friction. After FEED, the selected OEM's warranties, safety case, balance-of-plant assumptions, financing model, and sometimes local-content plan are embedded into lender and customer diligence. At that point, single-project multi-homing is low and expensive. Portfolio-level multi-sourcing remains plausible — a developer could choose EH2 for one PEM project, nucera for a refinery-scale alkaline project, and Topsoe for a waste-heat-enabled e-fuels project — but the individual plant tends to be locked to one design path. This dynamic favors incumbents and integrators with proven certifications, service networks, and downstream control.
