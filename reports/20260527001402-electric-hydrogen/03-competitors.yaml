- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - EH2 moat claim
  - Main threat
  - Severity
  - Current public evidence
  - Mitigation / diligence ask
  rows:
  - - Standardized 75-120 MW integrated PEM plant lowers total installed cost and schedule risk
    - Direct peers, internal-build buyers, and SOEC players can all contest LCOH from different angles
    - high
    - EH2 claims strong TIC advantages, but public pricing is opaque and alternative routes remain viable
    - Request project-by-project installed-cost breakdown versus Nel, nucera, ITM, and self-integrated refinery benchmarks
  - - U.S. manufacturing and modular fabrication create delivery and domestic-content advantage
    - Muted demand can still leave capacity underutilized, as seen at Nel and across the sector
    - high
    - Overcapacity exceeds demand by an order of magnitude; local manufacturing is not enough by itself
    - Obtain current factory-utilization, backlog-conversion, and Europe-localization plan data under NDA
  - - DNV validation improves bankability and trust
    - Incumbents already possess decades of industrial references, certifications, and operating history
    - medium-high
    - nucera, Linde, Air Products, and Cummins-linked Accelera all market industrial-grade trust signals
    - Ask lenders and insurers how much DNV narrows bankability gap versus incumbents in actual underwriting
  - - Project-development support broadens EH2 beyond pure hardware sales
    - Integrators can still bundle EPC, logistics, and offtake more comprehensively
    - critical
    - Air Products at NEOM and Linde build-own-operate projects show deeper value-chain control than EH2
    - Test whether EH2 wins because of plant economics or because customers need quasi-integrator support not yet proven at scale
  - - Large standardized PEM focus differentiates EH2 from smaller systems and some niche competitors
    - Buyers may select alkaline, SOEC, or self-integrated refinery configurations depending on process conditions
    - medium-high
    - Repsol, nucera, Topsoe, and Bloom all highlight paths where EH2's specific architecture is not the natural winner
    - Map EH2's pipeline by use case to see where PEM standardization is essential versus optional
  - - Market weakness could remove weaker competitors and help EH2 consolidate share
    - Weak demand can instead empower the strongest incumbents and suppress everyone's margins
    - high
    - Nel, Plug, Cummins/Accelera, and broader market data show stress without clear share transfer to EH2
    - Underwrite the market as structurally oversupplied until utilization and firm FIDs improve, not as a simple consolidation story
  notes: Severity is an analyst judgment based on current public evidence; it prioritizes diligence rather than quantifying exact downside.
