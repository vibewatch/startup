- id: moat-durability-and-adverse-signals
  title: Moat Durability, Commoditization Risk, and Adverse Competitor Evidence
  body: |
    The harshest competitive fact is that the sector is oversupplied before it is fully demanded. Roughly 2 GW of electrolyzers were operating globally at the end of 2024, while manufacturing capacity expanded beyond 50 GW in 2025 and is on pace for 54 GW by 2027. ING's 2026 analysis adds the demand side of the same problem: around 50 projects were publicly cancelled in 2025, hydrogen remains stuck in the pilot phase, only about 3% of government support is directed to demand creation, and the United States became less attractive for large green-hydrogen projects after 45V's construction-start deadline was pulled forward to end-2027. That combination destroys pricing power for all OEMs, not just for laggards.

    Adverse evidence from competitors confirms the structural issue. Nel cut capacity and saw cancellations erode backlog. ITM still carried factory under-absorption and older-generation inventory pain despite better revenue and cash. Cummins/Accelera was associated with a commercial halt in electrolyzers. Plug narrowed strategy instead of celebrating category-wide breakout demand. Even Topsoe, a far larger and more diversified company, said low-carbon project postponements and market uncertainty weighed on revenue and order conversion. These are not isolated execution errors; they are sector-wide proof that buyer hesitation is compressing the entire field.

    EH2 still has a real but narrow moat. It appears strongest where customers want large standardized Western PEM plants, lender-friendly validation, fast modular deployment, and some project-development support without having to buy a fully integrated industrial-gas offering. The moat looks weakest where integrators can bundle offtake and logistics, where SOEC players can convert waste heat into materially lower operating cost, where buyers can self-integrate hydrogen inside an existing industrial complex, or where Chinese cost pressure resets expectations for acceptable electrolyzer economics. The core diligence question is therefore not whether EH2 is differentiated at all. It is whether its differentiation is large enough to hold margin and order conversion in an oversupplied market where much bigger players can attack from adjacent parts of the value chain.
