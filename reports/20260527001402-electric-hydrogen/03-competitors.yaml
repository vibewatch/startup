  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized-oem-pricing
    missingEvidence: Current realized ASPs, warranty pricing, service attach rates, and discount structures for EH2, Nel, ITM, nucera, Plug, and SOEC alternatives.
    whyItMatters: Public price opacity makes it impossible to underwrite whether EH2's claimed total-installed-cost edge survives actual negotiated contracts.
    diligencePath: Request current customer proposals, service-term sheets, and lender models under NDA and normalize them into a like-for-like total installed cost workbook.
    relatedQuestionRefs:
    - QP020
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: factory-utilization-and-backlog-conversion
    missingEvidence: Current factory-utilization, delivery conversion, and backlog-risk data for EH2 and the most relevant peer set.
    whyItMatters: Nel and ITM already show utilization pressure publicly; without comparable EH2 utilization and shipment data, it is hard to know whether EH2 is structurally stronger or simply earlier in the same cycle.
    diligencePath: Obtain monthly utilization, shipment cadence, backlog aging, cancellation clauses, and plant-level delivery schedule data from management and compare against peer public disclosures.
    relatedQuestionRefs:
    - QP024
    - QP025
    relatedTableRefs:
    - TP001
    - TP004
  - type: missing-source
    severity: material
    topic: post-feed-switching-costs
    missingEvidence: Public lender, insurer, or customer scorecards showing how hard it is to switch OEM or technology choice after FEED, pre-FEED, or early FID work has begun.
    whyItMatters: This chapter can infer lock-in from engineering and financing logic, but not quantify whether EH2's bankability advantage is enough to create durable retention.
    diligencePath: Interview project-finance lenders, EPC partners, and hydrogen insurers; collect redlined EPC or warranty packages from recent deals; and map exactly which approvals restart when the OEM changes.
    relatedQuestionRefs:
    - QP021
    - QP022
    relatedTableRefs:
    - TP002
    - TP004
