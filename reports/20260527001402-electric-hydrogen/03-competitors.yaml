callouts:
- calloutType: strength
  title: EH2's product wedge is unusually clear
  body: >-
    Unlike many peers that market a broad portfolio, EH2 has a tightly scoped public proposition: a complete 75-120 MW
    standardized PEM plant with balance-of-plant included, U.S. manufacturing, and third-party DNV validation.
  claimRefs:
  - CP006
  - CP008
  - CP009
- calloutType: insight
  title: Industrial-gas integrators may be the most dangerous competitors
  body: >-
    Linde and Air Products threaten EH2 less through stack novelty than through value-chain control. They can bundle
    hydrogen production with logistics, operations, and offtake in a way standalone OEMs generally cannot.
  claimRefs:
  - CP026
  - CP027
  - CP034
- calloutType: risk
  title: Overcapacity caps moat durability across the whole sector
  body: >-
    Weak demand is not hurting only weaker startups. Nel, Plug, Cummins/Accelera, and market-wide data all indicate
    that underutilized factories, cancellations, and strategy resets are already shaping competitive behavior.
  claimRefs:
  - CP039
  - CP040
  - CP042
  - CP043
