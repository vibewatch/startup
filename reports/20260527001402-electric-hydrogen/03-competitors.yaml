- id: TP002
  title: Capability, GTM, and trust matrix
  columns:
  - Company / class
  - Core technology and plant architecture
  - Project-development / EPC support
  - Trust / regulatory posture
  - Distribution / offtake leverage
  - Main competitive edge vs EH2
  - Main gap vs EH2
  rows:
  - - Electric Hydrogen
    - Standardized large-block PEM plant (75-120 MW) with integrated balance-of-plant on modular skids
    - Project-development support and European project-prep activity; not a full industrial-gas EPC stack
    - DNV validation for competitiveness, reliability review, and commercial guarantees
    - Limited owned downstream logistics or offtake; wins via project developers and partners
    - Standardization, U.S. manufacturing, total-installed-cost narrative
    - Less channel power than industrial-gas incumbents
  - - Nel
    - PEM and alkaline electrolysers with modular configurations and next-gen pressurized alkaline roadmap
    - Strategic EPC partnership with Samsung E&A and active FEED pipeline
    - Century-long operating history and largest PEM order in company history in 2025
    - OEM-led rather than offtake-led; depends on project FIDs to fill capacity
    - Installed base and broad product set
    - 2025 cancellations and idled capacity weaken pricing power
  - - thyssenkrupp nucera
    - Industrial alkaline 20 MW modules scaling to gigawatt plants; skid-mounted and maintainable single-cell design
    - Feasibility, LCOH, FEED, commissioning, and lifecycle support
    - TUV / ISO 22734 references and very large industrial reference base
    - Strong industrial relationships and EPC-style project shaping
    - Industrial bankability, service network, and reference scale
    - Less aligned with buyers insisting on PEM dynamics or compact footprint
  - - ITM Power
    - PEM specialist with modular product family and several 100 MW plants in delivery scope
    - Product sale, consulting, and maintenance; less integrator-like than nucera or Linde
    - Improved FAT pass rate and public-company disclosure discipline
    - Limited downstream channel leverage; still an OEM-driven sale
    - Focused PEM specialization and comparatively strong liquidity
    - Under-absorbed factory costs and older-generation inventory pressure
  - - Plug Power
    - PEM electrolyzers connected to broader hydrogen production and fuel-use ecosystem
    - Can pair electrolyzers with hydrogen-fuel and logistics capabilities in some accounts
    - Public-company disclosure and global customer footprint
    - Stronger hydrogen-supply route than most OEMs, but not an Air Products-style global industrial-gas network
    - Platform breadth and existing hydrogen operations
    - Strategic narrowing suggests constrained demand and capital discipline
  - - Bloom / Topsoe SOEC
    - Solid-oxide electrolysis optimized for high efficiency and heat integration
    - Topsoe explicitly positions around downstream e-fuels and guarantees; Bloom competes on power-efficiency claims
    - INL validation for Bloom efficiency claim; Topsoe performance-guarantee program and industrial-scale factory
    - Limited hydrogen-delivery network; strongest where project economics are process-integrated
    - Potentially lower LCOH when waste heat or downstream synthesis is available
    - Not a direct plug-in replacement for every PEM project profile
  - - Linde / Air Products
    - Multiple electrolyzer technologies plus full hydrogen system integration and logistics
    - Build-own-operate, EPC, liquefaction, storage, distribution, and ammonia export capabilities
    - Decades of industrial-gas safety and operating trust
    - Highest leverage in channels, offtake, and existing customer infrastructure
    - Execution certainty and ability to bundle the full value chain
    - Less standardized single-product narrative than EH2's HYPRPlant wedge
  notes: Rows compress heterogeneous competitors into comparable buying-criteria columns; judgments are directional and grounded in the cited public source pack rather than a single benchmarking dataset.
