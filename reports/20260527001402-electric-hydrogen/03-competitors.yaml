- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Offer / model
  - Public price or capex signal
  - Included capabilities
  - Contract / commercial model
  - Public unknowns
  - Competitive implication
  rows:
  - - Electric Hydrogen HYPRPlant
    - Claims up to 60% lower total installed cost versus alternative electrolyzer solutions; no public list price
    - Complete plant, balance-of-plant, modularized fabrication, commissioning narrative
    - Project-specific OEM contract with development support; exact warranty and realization terms private
    - No public realized ASP, warranty pricing, or service-margin disclosure
    - Competes on plant-level economics rather than transparent stack price
  - - Nel
    - No public list price in source pack; annual report shows order intake, backlog, and cancellations rather than catalog pricing
    - PEM plus alkaline product set and EPC partnership option
    - Project-specific orders, FEED studies, firm backlog definition
    - Realized pricing, discounting, and service attach rates remain undisclosed
    - Scale does not eliminate bespoke commercial negotiation
  - - thyssenkrupp nucera
    - 300 MW Spain order described only as low three-digit million-euro range
    - Electrolyzers, FEED, LCOH work, skid-mounted plant, lifecycle service
    - Large industrial supply contract tied to project FID and multiyear revenue recognition
    - No public module-level price transparency
    - Industrial buyers appear willing to buy integrated service and execution, not only low stack capex
  - - ITM Power
    - No public list price; annual report monetizes through product sales, maintenance, and consulting contracts
    - PEM products plus maintenance and consulting
    - Mix of product sales, maintenance contracts, and feasibility / FEED work
    - Exact pricing by MW block or warranty structure not public
    - Public-company disclosure is better than EH2's, but customer-level pricing still opaque
  - - SOEC alternatives (Bloom / Topsoe)
    - Compete on lower LCOH and efficiency claims rather than visible catalog price
    - Efficiency narrative, waste-heat integration, performance guarantees, downstream e-fuel integration
    - Project-specific commercial terms with strong dependence on process configuration
    - No public comparable turnkey price per MW
    - Can win even without list-price visibility if process economics dominate buyer math
  - - Repsol internal-build benchmark
    - €292m for a 100 MW refinery-integrated plant at Petronor
    - Electrolyzer embedded inside existing industrial complex and hydrogen demand base
    - Owner-led capex allocation rather than vendor catalog purchase
    - OEM split, service package, and operating assumptions not disclosed
    - Shows large incumbents can benchmark turnkey OEM offers against self-integrated capex
  - - Gray / blue hydrogen status quo
    - Gray hydrogen remains materially cheaper than green H2 in weak-demand regions; blue hydrogen benefits from stronger policy economics in parts of the U.S.
    - Existing plants, feedstock access, and industrial operating base
    - Continue operating status quo assets or retrofit with CCS rather than buy green electrolysis now
    - Carbon-cost trajectory and long-run policy durability vary by jurisdiction
    - Strongest baseline competitor because it requires no new electrolyzer purchase at all
  notes: The source pack does not support a clean apples-to-apples OEM price table. Project capex proxies and total-installed-cost claims are the only defensible public comparison inputs.
