    basis: Rows cover the most relevant direct OEMs, adjacent technologies, integrators, and substitute paths evidenced in the 2026 source pack rather than every global electrolyzer supplier.
  rows:
  - - Electric Hydrogen
    - Direct OEM benchmark
    - 1.2 GW/year U.S. manufacturing model; 75 MW / 100 MW / 120 MW standard plants; DNV validation
    - Large project developers in e-fuels, ammonia, and European industrial hydrogen
    - Integrated PEM plant with balance-of-plant, modular skids, and project-development support
    - Strong standardization and domestic-manufacturing story, but weaker downstream distribution and offtake power than incumbents
  - - Nel
    - Direct OEM peer
    - 3,800+ electrolysers installed; 2025 revenue NOK 963m; backlog NOK 1,319m; Heroya capacity adjusted to demand
    - Industrial hydrogen and Power-to-X developers comparing PEM and alkaline routes
    - PEM and alkaline electrolysers plus EPC partnerships and next-generation pressurized alkaline line
    - Installed-base credibility is strong, but 2025 cancellations, lower backlog, and idled capacity are material adverse signals
  - - thyssenkrupp nucera
    - Incumbent electrolysis OEM
    - ">10 GW installed; >3 GW contracted; >600 projects; 1.5 GW/year supply chain; 300 MW Spain award"
    - Refinery, ammonia, e-fuels, steel, and other industrial hydrogen projects
    - Industrial-scale alkaline electrolysis, FEED/LCOH studies, prefabricated skid-mounted plants, lifecycle service
    - Deep service and EPC credibility; chemistry is alkaline rather than EH2's PEM wedge
  - - ITM Power
    - Direct PEM peer
    - FY2025 revenue £26.0m; backlog £145.1m; cash £207m; >400 MW delivered or in build
    - Large green-hydrogen developers seeking PEM specialists
    - PEM electrolysers, modular NEPTUNE / POSEIDON portfolio, consulting, and maintenance
    - Better financial discipline and backlog than earlier cycles, but gross losses still show factory-utilization pressure
  - - Plug Power
    - Broad hydrogen platform peer
    - ">185 MW shipped in 2025; >317 MW cumulative across >70 units; public-company disclosure infrastructure"
    - Customers wanting electrolyzers plus hydrogen supply or material-handling ecosystem links
    - GenEco electrolyzers, hydrogen production network, material handling fuel-cell platform
    - Broader platform is real, but 2025 positioning was a refocus around highest-value markets rather than a category-wide demand breakout
  - - Bloom Energy / Topsoe
    - Adjacent technology substitutes
    - Bloom says >2 GW annual manufacturing; Topsoe says 500 MW SOEC factory and DKK 4,859m order backlog
    - Projects where electricity efficiency, waste heat, or tight downstream integration dominate the decision
    - Solid-oxide electrolysis with high-efficiency claims and strong ammonia / methanol / SAF integration narratives
    - Strong LCOH story in the right use case, but not a direct copy of EH2's low-temperature PEM standard-plant model
  - - Accelera by Cummins
    - Direct or adjacent PEM peer
    - 500,000+ operational stack hours; 60+ deployed units; backed by Cummins manufacturing and safety pedigree
    - Oil & gas, industrial gas, and other safety-sensitive buyers needing PEM with certification depth
    - HyLYZER PEM platform, digital monitoring, global support, Cummins manufacturing base
    - Safety and incumbent-industrial trust are strong, but sector headwinds have already driven a commercial retreat signal at Cummins
  - - Linde / Air Products
    - Integrator / industrial-gas incumbent
    - Linde has 80+ alkaline installs and build-own-operate assets; Air Products leads a 4 GW / 600 tpd NEOM project as EPC and offtaker
    - Industrial buyers prioritizing execution certainty, hydrogen logistics, and downstream offtake
    - Electrolysis plus liquefaction, pipelines, distribution, ammonia shipping, and long-term hydrogen value-chain control
    - Strongest execution and channel threat to EH2 because the customer can buy a full value chain instead of a plant
  - - Gray / blue hydrogen and internal build
    - Status quo / substitute
    - Gray hydrogen remains materially cheaper; Repsol's 100 MW / €292m refinery project shows large buyers can self-integrate green H2 capex
    - Refiners, chemicals, and industrial sites with existing hydrogen demand and operating assets
    - Fossil-derived hydrogen, carbon-capture variants, or in-house integrated electrolysis deployment
    - Highest inertia alternative because it preserves incumbent assets, operating models, and buyer control
  notes: Public pricing is sparse, so scale signals mix installed base, backlog, plant shipments, factory capacity, and project awards rather than clean revenue multiples or identical booking metrics.
