- id: FM004
  title: Adoption Funnel — Global Clean H2 Project Pipeline to EH2 Named Deployments
  type: funnel
  layout: standard
  summary: >-
    Of approximately 1,700 clean hydrogen projects on drawing boards globally, only one EH2 plant
    reached commissioning by 2026; this funnel illustrates the severe attrition from announcement
    to commercial deployment that defines the market's maturity constraint.
