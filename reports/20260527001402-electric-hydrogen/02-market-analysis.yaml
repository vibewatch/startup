    - id: offtake
      label: "Offtake contract (airlines, shipping, NH3 buyer, utility)"
    - id: projectfinance
      label: "Project finance close (equity + debt — Brookfield, Generate Capital)"
    - id: eh2
      label: "EH2 HYPRPlant procurement (FEED → FID → delivery → commissioning)"
    - id: production
      label: "Green hydrogen / e-fuels / ammonia production (commercial operations)"
    edges:
