figures:
- id: FM001
  title: Green Hydrogen Market Size Pyramid — TAM to SOM Capacity Ceiling
  type: pyramid
  layout: standard
  summary: >-
    Three-layer indicative sizing from global clean hydrogen capex (TAM) through large-scale Western PEM
    electrolyzers addressable by EH2 (SAM) to EH2 factory-constrained obtainable market (SOM); all
    values are approximate annual capex in USD billions. High uncertainty applies to all three layers.
  data:
    items:
    - label: "TAM — Global clean hydrogen production capex (2030E, all technologies)"
      value: 50
      unit: "$B/year (approx.)"
      note: >-
        Based on ING 2025 estimate of $222B total government support 2025 + project pipeline; actual
        private capex deployment estimated at $30–70B/year by 2030 under BNEF base scenario.
        Excludes infrastructure and storage.
    - label: "SAM — Large-scale Western PEM electrolyzers ≥75 MW (U.S. + Europe)"
      value: 10
      unit: "$B/year (est. 2028–2030)"
      note: >-
        Estimated from public project pipeline and Repsol/Synergen project capex benchmarks (~$800–1,200/kW
        installed). Highly uncertain; no independent analyst estimate exists for this specific segment.
        Contradictory with supply-side overhang.
    - label: "SOM — EH2 factory-capacity-constrained obtainable market (Devens 1.2 GW/year)"
      value: 1.2
      unit: "$B/year (full utilization ceiling)"
      note: >-
        EH2 factory nameplate at 1.2 GW/year × ~$1,000/kW installed TIC (Synergen benchmark) = ~$1.2B/year
        max revenue at full utilization. Actual utilization rate is private; CEO acknowledged 1.5 years
        of muted activity.
  approximationNotes: >-
    All three layers are estimates with low reliability. TAM is derived from government support and
    project pipeline proxies, not a direct capex survey. SAM is interpolated from four named project
    benchmarks and cannot be validated independently. SOM is a factory output ceiling, not a forecast.
    Do not use these as price-target inputs without independent diligence. Contradictions between supply
    and demand lenses are preserved; a higher-confidence sizing requires primary market research.
  claimRefs:
  - CM007
  - CM012
  - CM025
  - CM036
  - CM037

- id: FM002
  title: Market Estimate Range — Green Hydrogen Production Forecasts by 2030
  type: range
  layout: standard
  summary: >-
    Published estimates for global clean hydrogen production by 2030 span from 5.5 mtpa (BNEF base) to
    25 mtpa (government targets), a 4.5× gap that reflects irreconcilable assumptions about policy
    execution and cost reduction. All values are million tonnes per year (mtpa).
  data:
    items:
    - label: "BNEF base scenario — 2030 clean H2 production (as cited by ING Think)"
      low: 3.5
      mid: 5.5
      high: 7.5
      unit: "mtpa"
      note: "BloombergNEF demand-side model; represents currently-funded and policy-supported projects"
    - label: "ING Think industry consensus range — 2026 production (near-term)"
      low: 1.5
      mid: 1.8
      high: 2.2
      unit: "mtpa"
      note: "ING 2026E estimate; doubling from 2025 actuals due to projects under construction"
    - label: "IEA committed project pipeline — implied 2030 production (electrolysis only)"
      low: 3.0
      mid: 5.0
      high: 8.0
      unit: "mtpa"
      note: "Derived from IEA >200 committed projects; wide range due to project attrition uncertainty"
    - label: "National government combined targets — 2030 aspirational"
      low: 20.0
      mid: 25.0
      high: 30.0
      unit: "mtpa"
      note: "Aggregated national government pledges; ING notes these are 'ripe for a reset'; highly optimistic"
  approximationNotes: >-
    BNEF range (3.5–7.5 mtpa) and ING 2026E (1.5–2.2 mtpa) are sourced from the ING Think January 2026
    article which cites BNEF. Government targets (20–30 mtpa) are aggregated national pledges from ING;
    IEA range (3–8 mtpa) is interpolated from the IEA committed project database narrative. These are
    production volume forecasts, not electrolyzer capex estimates; unit conversion to electrolyzer GW
    requires assumptions about capacity factor and efficiency.
  claimRefs:
  - CM008
  - CM009
  - CM014
  - CM006

