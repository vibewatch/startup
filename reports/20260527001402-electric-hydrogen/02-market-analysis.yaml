- id: growth-drivers-and-constraints
  title: Growth Drivers and Adoption Constraints
  body: |
    Growth drivers for EH2's market are most favorable outside the United States: European
    regulatory mandates including the EU Renewable Energy Directive (RED III), EU national
    IPCEI programs, and the UK Sustainable Aviation Fuel Mandate (10% SAF by 2030) create
    binding offtake obligations that can justify green hydrogen project economics at a premium.
    European gas prices are regularly three to four times higher than U.S. prices, compressing
    the cost gap between green and gray hydrogen in a way that is not currently achievable in
    the United States without aggressive use of the 45V production tax credit.

    The U.S. market faces layered constraints that EH2's CEO has explicitly acknowledged. The
    One Big Beautiful Bill Act (OBBBA), enacted in 2025, moved the 45V construction start
    deadline forward from January 1, 2033 to January 1, 2028 — a five-year compression of the
    project development window. This structurally disadvantages large-scale green hydrogen
    projects that require two to three years of permitting, FEED, and project financing before
    breaking ground. Concurrently, the DOE proposed reducing or eliminating funding for four of
    seven Regional Clean Hydrogen Hubs, representing nearly 60% of the original $7 billion committed.

    Chinese alkaline electrolyzer manufacturers offer equipment at roughly $303/kW domestically
    (2021 vintage), approximately one-quarter the cost of Western PEM systems at $1,200–1,400/kW
    for comparable delivered project economics. Although trade restrictions limit direct Chinese
    competition for U.S. and EU projects seeking domestic content requirements or government
    subsidies, the price disparity is a long-run structural threat to Western electrolyzer margins.
    BloombergNEF projected that announced global manufacturing capacity of 52.6 GW (2024)
    against forecast near-term demand of only approximately 5 GW indicates a severe supply glut
    that will sustain downward pricing pressure on Western OEMs.

    Adverse signals are corroborated by Cummins Inc.'s November 2024 exit from commercial
    electrolysis (1 GW of manufacturing capacity in the U.S. and Spain), approximately 50 publicly
    announced project cancellations in 2025, and $34.8 billion in total U.S. clean energy
    investment abandonment in 2025. The green hydrogen sector remains, in the words of ING, in the
    "pilot phase" — with adoption following a multi-decade commercial maturation pathway rather
    than the near-term growth curve implied by high government targets.
