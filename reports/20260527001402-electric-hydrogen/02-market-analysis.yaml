callouts:
- calloutType: risk
  title: Manufacturing Overcapacity Is a Sector-Wide Existential Signal
  body: >-
    The electrolyzer industry has entered a structural oversupply crisis: global manufacturing capacity
    exceeded 50 GW/year by 2025 while annual deployment was approximately 2 GW — a 25:1 ratio.
    Cummins exited the sector in late 2024; approximately 50 projects were cancelled in 2025; and U.S.
    clean energy investment cancellations totaled $34.8 billion. For EH2, this means the Devens gigafactory
    — with 1.2 GW/year nameplate capacity — is operating in a market where near-term demand is a fraction
    of available supply. Factory utilization, not pipeline, is the binding constraint on near-term revenue.
  claimRefs:
  - CM006
  - CM007
  - CM013
  - CM029
  - CM030
  - CM034

- calloutType: insight
  title: European Market Is the Near-Term Commercial Lifeline
  body: >-
    EH2's CEO explicitly stated that U.S. green hydrogen economics are "hard to impossible" at current
    natural gas prices, and that both the HIF and Synergen U.S. projects target export to Europe where
    demand and policy support are stronger. European gas at 3–4× U.S. prices, combined with EU RED III,
    IPCEI grants, and the UK SAF Mandate, creates structurally better project economics. EH2's Uniper
    partnership in Germany and its stated intent to announce additional German projects signals that
    the company has de facto pivoted to Europe as its primary commercial theater.
  claimRefs:
  - CM024
  - CM026
  - CM027
  - CM028

