  evidenceGaps:
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      An independent analyst estimate for the annual capex market for large-scale (≥75 MW) Western PEM
      electrolyzers, segmented from the broader clean hydrogen or electrolyzer market.
    whyItMatters: >-
      Without a credible SAM estimate, it is impossible to assess EH2's market penetration rate or
      evaluate whether the company's pipeline and factory utilization represent strong or weak market
      share. All sizing in TM002 relies on proxy lenses, not a direct market survey.
    diligencePath: >-
      Commission or identify a primary market sizing study from Hydrogen Council, BloombergNEF, or
      Wood Mackenzie that specifically sizes the Western large-scale PEM electrolyzer capex market
      annually through 2030. Cross-check against EH2's stated pipeline.
    relatedQuestionRefs:
    - QM005
    - QM006
    relatedTableRefs:
    - TM002

  - type: private-evidence-only
    severity: material
    topic: buyer-segmentation
    missingEvidence: >-
      Confirmed conversion status of the AES Corporation 1 GW framework supply agreement into firm
      project procurement orders; no project-level milestone or FID announcement has been made since
      the framework was signed in October 2023.
    whyItMatters: >-
      If the AES 1 GW framework has not progressed to any project procurement, it represents a pipeline
      claim that may be stale; understanding conversion rate of framework agreements to firm orders is
      critical for evaluating EH2's backlog quality.
    diligencePath: >-
      Request from EH2 or AES an update on the project development status of each project within the
      1 GW framework, including whether any projects have reached pre-FEED or procurement stage.
    relatedQuestionRefs:
    - QM015

  - type: stale
    severity: minor
    topic: market-sizing
    missingEvidence: >-
      An updated EH2 customer pipeline or backlog figure; the last public disclosure was >5 GW of
      reservations as of October 2023, more than two and a half years before the run date.
    whyItMatters: >-
      Given the substantial deterioration in green hydrogen project activity in 2024–2025, the October
      2023 pipeline figure is likely stale; without an updated figure, it is unclear how much of the
      5 GW reservation has cancelled, been deferred, or advanced to FEED.
    diligencePath: >-
      Request a current customer pipeline update from EH2 management including FEED, pre-FEED, and
      reservation stages; cross-reference with named project announcements to identify which of the
      original 5 GW reservation volume remains active.

  - type: missing-source
    severity: minor
    topic: market-sizing
    missingEvidence: >-
      A 2025–2026 electrolyzer capex pricing benchmark from an independent source for large-scale
      Western PEM systems at 75–120 MW to validate the $800–1,200/kW total installed cost range
      used in TM002 and FM001.
    whyItMatters: >-
      The $800–1,200/kW range is derived from the Synergen <$1,000/kW target (company claim) and the
      Repsol €292M/100 MW benchmark (European refinery context); neither is an arms-length Western
      PEM pricing study, creating uncertainty in the SOM revenue ceiling estimate.
    diligencePath: >-
      Identify or commission a 2025–2026 electrolyzer capex benchmarking study from BNEF, Lazard, or
      equivalent covering 75–120 MW PEM systems in U.S. and EU markets.

acknowledgedWarnings:
  - dimension: unverifiedSource
    reason: >-
      Source SM003 (U.S. DOE Technical Targets for PEM Electrolysis) cites the canonical DOE EERE
      page at energy.gov/eere/fuelcells/technical-targets-proton-exchange-membrane-electrolysis.
