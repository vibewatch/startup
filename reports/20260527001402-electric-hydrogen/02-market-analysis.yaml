    - '2023 (as reported)'
    - '>5 GW reserved; 4 named customer contracts'
    - Order book and reservation announcements
    - Low-Medium
    - Pipeline is stale (last updated Oct 2023); reservation ≠ firm order; demand environment has deteriorated materially since then
