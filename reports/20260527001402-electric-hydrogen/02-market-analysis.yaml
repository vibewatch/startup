company:
  name: Electric Hydrogen
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Electric Hydrogen operates in a narrowly defined sub-market: large-scale industrial PEM electrolyzers
    (75–120 MW) for project-finance-backed green hydrogen derivatives including e-fuels, green ammonia,
    and refinery decarbonization. The addressable market is constrained by severe near-term demand
    headwinds — globally only ~2 GW of electrolyzers were installed through 2024 against 50+ GW of
    manufacturing supply capacity — driven by the unresolved cost gap between green and gray hydrogen,
    compressed U.S. policy timelines under the OBBBA, and weak offtake development. Europe and
    export-oriented U.S. projects present the most viable near-term demand, while the broader
    TAM/SAM sizing remains highly uncertain and contradictory across public estimates.

sections:
- id: market-boundary
  title: Market Boundary, Adjacencies, and Status-Quo Substitutes
  body: |
    Electric Hydrogen's addressable market is not the broad hydrogen economy — it is the specific
    sub-segment of large-scale (75 MW and above) industrial electrolysis plants sold to project
    developers and industrial end-users who require cost-competitive green hydrogen for derivatives
    production, hard-to-abate industrial processes, or export fuels. This boundary distinction is
    material: the global hydrogen market is dominated by approximately 90 million tonnes per year of
    gray hydrogen produced from natural gas via steam methane reforming (SMR), none of which passes
    through an electrolyzer and none of which is EH2's near-term market. Clean hydrogen production
    (green + blue) remains below 2% of global hydrogen use as of 2026.

    Included spend is industrial capex for electrolysis plants at or above 75 MW capacity, including
    all balance-of-plant integration, power conversion, and commissioning. Target end-uses include
    green ammonia for fertilizer and maritime fuel, sustainable aviation fuel (e-SAF), e-methanol,
    direct reduced iron (DRI) for steelmaking, and refinery hydrogen replacement. Each of these
    adjacencies shares a common upstream input — green hydrogen at a competitive cost — and collectively
    represent the industries that cannot decarbonize via electrification alone.

    Excluded from EH2's target market are: small-scale (<10 MW) electrolyzers for mobility
    or on-site industrial applications, alkaline electrolyzers positioned at lower capital cost but
    fewer flexibility advantages, blue hydrogen (SMR plus CCS) which competes on a different policy
    track (45Q rather than 45V), and fuel cell mobility stacks. Competing substitutes are gray and
    blue hydrogen at $1–2/kg in the United States — approximately three times cheaper than green
    hydrogen under current conditions, even with the 45V production tax credit — creating a durable
    cost-of-hydrogen gap that defines the most critical adoption constraint.

    The buyer class EH2 targets is project-finance-backed developers rather than direct industrial
    users. Infinium, HIF Global, Synergen, and Uniper are all project developers or industrial
    operators who assemble capex stacks (equity + debt + offtake + power PPAs) and then procure
    the electrolyzer plant as the hydrogen production core. This means EH2's market is not purely
    determined by industrial demand for green hydrogen but also by the willingness of project
    finance structures to support it — a critical dependency on policy stability, offtake contract
    certainty, and power cost.
