      to: developer
      label: "Creates demand signal and cost support"
    - from: power
      to: developer
      label: "Enables project economics"
    - from: offtake
      to: developer
      label: "De-risks revenue for project finance"
    - from: developer
      to: projectfinance
      label: "Structured as SPV; seeks debt + equity"
    - from: projectfinance
      to: developer
      label: "Capital release on FID"
    - from: developer
      to: eh2
      label: "Electrolyzer procurement contract (post-FID)"
    - from: eh2
      to: production
      label: "HYPRPlant delivery and commissioning"
