- id: buyer-segmentation
  title: Buyer Segmentation, Budget Ownership, and Adoption Path
  body: |
    EH2's commercially active buyer segments share two structural characteristics: large project
    scale (100 MW or above per unit) and export-oriented or European-linked offtake. The four
    primary confirmed buyer archetypes are: (1) advanced e-fuels developers using green hydrogen as
    a feedstock for aviation or maritime fuels, (2) green ammonia project developers targeting
    fertilizer or maritime export markets, (3) European utilities seeking green hydrogen or ammonia
    for industrial decarbonization commitments, and (4) U.S. energy and power companies building
    green hydrogen project pipelines against future policy optionality.

    Budget ownership in all four segments rests primarily with the project developer or sponsor
    equity stack, supported by project-finance debt. The electrolyzer itself is a capex line in
    the overall project — typically one of the largest single equipment line items alongside power
    conversion infrastructure. EH2's typical procurement path involves: (a) expression of interest
    and preliminary engineering dialogue, (b) FEED (front-end engineering design) or pre-FEED
    agreement, (c) commercial offtake contracts for the downstream product, (d) financial close with
    project finance lenders, (e) electrolyzer procurement contract and equipment delivery, and
    (f) commissioning. This six-step path means EH2's revenue is back-loaded against a multi-year
    project development cycle.

    The Infinium Project Roadrunner example illustrates the full adoption path: Infinium secured
    renewable power PPA from NextEra, offtake agreements from American Airlines and IAG, project
    equity from Brookfield Asset Management and Breakthrough Energy Catalyst, then selected EH2's
    100 MW HYPRPlant and reached financial close. The EH2 plant is now commissioning in 2026.
    This path — from concept to commissioning — took approximately three years.

    EH2 is also building a co-development model via its Ambient Fuels acquisition and Generate
    Capital partnership, which provides up to $400 million in project finance to support customers
    who cannot self-fund a full development stack. This positions EH2 not only as an equipment
    vendor but as a project development partner for smaller or earlier-stage buyers who lack the
    balance sheet to navigate the multi-year development cycle alone. EH2's development pipeline
    publicly cites approximately 15 active projects across 10+ U.S. states with a combined
    potential of over 600 tonnes per day of hydrogen.
