- id: TM004
  title: Growth Drivers and Adoption Constraints
  columns:
  - Factor
  - Direction
  - Timing
  - Implication for EH2
  - Diligence Ask
  rows:
  - - EU RED III and national hydrogen mandates
    - Driver
    - Active 2026–2030
    - Drives demand from European utilities; supports Uniper and similar projects
    - Confirm specific EU compliance timelines and offtake volumes that translate to
      electrolyzer procurement
  - - UK SAF Mandate (10% by 2030)
    - Driver
    - 2030 deadline
    - Underpins IAG offtake for Infinium Roadrunner; aviation premium bridges cost gap
    - Confirm volume obligations and whether UK mandate extends post-2030
  - - European natural gas prices (3–4× U.S.)
    - Driver
    - Ongoing structural
    - Makes European green H2 cost-competitive earlier; supports German projects
    - Monitor for LNG normalization that could compress European gas premium
  - - DOE H2 Shot — cost target $2/kg by 2026, $1/kg by 2031
    - Driver
    - 2026–2031
    - Validates EH2's cost roadmap; DOE support ($65M) directly benefits EH2
    - Verify whether $2/kg target is achievable under current OBBBA policy framework
  - - OBBBA — 45V deadline moved to Jan 1, 2028
    - Constraint
    - Immediate (enacted 2025)
    - Compresses project development window; large-scale projects at highest risk
    - Quantify how many of EH2's named customers can reach construction start by Jan 2028
  - - Green vs. gray hydrogen cost gap (~3× in U.S.)
    - Constraint
    - Structural; persists until H2 cost < ~$2/kg
    - Limits U.S. demand to export-oriented or mandated projects
    - Track EH2's own 2030 $1.50/kg cost target vs. current trajectory
  - - Chinese electrolyzer competition ($303/kW vs. $1,200–1,400/kW Western)
    - Constraint
    - Medium-term (post-2028 if trade barriers relax)
    - Pricing pressure on Western OEMs; EH2 targets differentiation via TIC not stack price
    - Assess how EH2's total installed cost advantage holds as Chinese alkaline improves flexibility
  - - Manufacturing overcapacity (50+ GW supply vs. <5 GW annual demand)
    - Constraint
    - Active 2025–2028
    - Industry-wide factory utilization crisis; EH2's Devens factory exposure unknown
    - Obtain or estimate Devens factory utilization rate and backlog conversion timeline
  notes: Direction and timing assessments are based on ING Think, National Law Review, Canary Media,
    and EH2 press release analysis. Timing is approximated; exact regulatory milestones may shift.
    Chinese cost data from PV Magazine / BloombergNEF (2021 vintage) with partial 2024–2026 update.
