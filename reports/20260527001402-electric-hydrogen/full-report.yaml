      - number: '8.3'
        title: Financing Context and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              EH2 has raised approximately $380M in its October 2023 Series C, which was the largest single financing in
              the green hydrogen sector at the time and established the company's unicorn status at approximately $1B
              implied valuation. Prior to the Series C, EH2 raised approximately $170M across Series A and B rounds.
              Total financing since founding exceeds $750M when combining equity, DOE grants ($46.3M AACI grant plus
              $18.3M transferable manufacturing tax credit), a $100M credit facility from equipment-finance lenders
              (July 2024), and the Generate Capital project-finance partnership (up to $400M, announced September 2025).


              The layered financing structure is a double-edged signal. On the positive side, it demonstrates that
              sophisticated institutional capital (Breakthrough Energy Ventures, Equinor, Rio Tinto through earlier
              rounds, and equipment lenders through the credit facility) has been willing to underwrite EH2 at multiple
              stages. The Generate Capital partnership is specifically structured as project-level financing rather than
              corporate equity, which limits dilution while providing bankability support to project developers who
              might otherwise hesitate to commit to a pre-revenue equipment supplier.


              On the negative side, the absence of any disclosed equity round since October 2023 means the cap table and
              preference stack are opaque. A new investor has no visibility into liquidation preferences, anti-dilution
              protections, or the extent to which the credit facility carries restrictive covenants. Entry discipline
              requires negotiating full cap table transparency, a discount of at least 20–35% to the $1B reference
              price, and contractual milestones tied to Infinium Roadrunner operating data and the first FID before
              deploying full capital.
            claimRefs:
              - CV001
