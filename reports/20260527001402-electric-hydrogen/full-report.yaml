      - number: '7.5'
        title: Mitigations, Monitoring Indicators, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: |
              The investable thesis for Electric Hydrogen rests on a set of conditions that are currently
              plausible but unconfirmed. Monitoring each condition quantitatively — with defined kill-criteria
              thresholds — is more actionable than narrative risk assessment.

              The strongest risk mitigations on record as of 2026 are: (a) DNV independent technical validation
              (July 2025) covering stack, plant design, manufacturing, reliability, quality, and warranty,
              which materially improves bankability with lenders; (b) the modular, factory-tested deployment
              model (Pioneer proved at 10 MW, Roadrunner in commissioning at 100 MW, all skids pre-tested
              before shipment), which structurally reduces field commissioning failure modes relative to stick-
              built alternatives; (c) a large, diversified financing base ($750M+) providing runway for at
              least one to two years of pre-revenue operations if manufacturing is paced to pipeline; (d) a
              European localization strategy, with a Europe/MENA GM hired and Uniper project in pre-FEED,
              reducing U.S. policy dependence; and (e) the Generate Capital partnership, which converts some
              demand risk from "will projects reach FID?" to "can EH2 and Generate co-develop them?" — removing
              one layer of dependency on external developers.

              Mitigations that are claimed but not yet verifiable include: EH2's assertion of significantly
              lower iridium usage than peers (not independently confirmed); the stated 60% total-installed-cost
              reduction (claimed but not independently audited across a full completed project); and the
              European supply-chain localization (announced but not yet executed at commercial-project scale).

              Key monitoring indicators for an investor should include: (1) Roadrunner commissioning completion
              date and first-month operational performance data versus guaranteed performance specs; (2) Synergen
              FID in 2026 — if this slips to 2027, it signals that demand conditions remain frozen for a second
              consecutive year; (3) HIF Texas facility FID or a formal engineering-contract conversion;
              (4) Draw-down activity on the Generate Capital $400M project finance facility — any deployment
              of capital in 2026 validates the demand-enablement thesis; (5) EH2 revenue disclosure or
              indications of equipment-acceptance milestones at Roadrunner; (6) Uniper Green Wilhelmshaven
              FID or meaningful pre-FEED completion; (7) any public indication of a second commercial project
              beyond Roadrunner reaching commissioning or delivery; (8) quarterly monitoring of Nel, ITM, and
              Plug orders and backlog conversion as leading indicators of sector FID momentum.

              Thesis-break triggers — conditions that would require re-underwriting or investment impairment —
              include: (a) Roadrunner operational failure or sustained availability below 85% in the first six
              months post-commissioning, which would halt bankability for all follow-on EH2 plants; (b) Synergen
              FID does not occur by end of 2026 and HIF also delays — signalling that all near-term U.S. projects
              are frozen simultaneously; (c) EH2 raises additional equity at a materially lower valuation
              (down-round), implying the $750M financing stack has been consumed without commensurate revenue
              conversion; (d) the 45V credit is further restricted or removed entirely in subsequent legislation,
              eliminating U.S. green-hydrogen project economics; or (e) a safety incident at Roadrunner or a
              peer facility triggers new regulatory requirements that delay all large-scale PEM projects.

              Critical diligence asks for any investor conducting diligence in 2026: (1) full audited financials,
              cash runway, and burn rate; (2) Roadrunner performance-test data and warranty-claim status;
              (3) iridium and membrane procurement contracts and hedging; (4) Titan and Weitz commercial terms
              and substitutability; (5) Generate Capital deployment pipeline and any committed hydrogen project
              terms; (6) Uniper and Synergen project FID timeline and current bankability status; (7) EH2's
              European supply-chain localization plan, milestone timeline, and cost delta relative to U.S.
              model; (8) cyber and process-safety architecture, especially SCADA/ICS hardening.
