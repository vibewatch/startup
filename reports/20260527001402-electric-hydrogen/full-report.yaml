      - number: '8.5'
        title: Comparable Valuation Context
        blocks:
          - type: paragraph
            body: >-
              The public comparables for EH2 are all in varying degrees of financial distress, which simultaneously
              validates EH2's decision to remain private and creates a deeply unfavorable sector sentiment context for
              any new entry pricing.


              Nel ASA, the largest Western pure-play electrolyzer OEM, reported NOK 963M in revenue for full-year 2025
              on an operating loss of NOK 1,365M—a loss rate of approximately 1.4× revenue. Its investor relations page
              highlights pipeline and technology milestones but provides no evidence of near-term path to profitability.
              ITM Power reported H1 FY2026 revenue of £26.2M with EBITDA loss of £33.2M, offset partially by a £207.6M
              cash position from prior equity raises. The ITM news feed in early 2026 features small contracts (12.5 MW
              Octopus Energy Generation deal) rather than the 100–240 MW scale EH2 is targeting. Plug Power, by
              contrast, has pivoted to a survival restructuring narrative after revenue declined from $891M in 2023 to
              $628M in 2024; its public market capitalization of approximately $1–2B implies 1.5–3× P/S—a multiple that
              would put EH2 at $0 if applied to its disclosed zero revenue.


              thyssenkrupp nucera offers a more constructive data point: it won a 300 MW electrolysis project in Spain
              valued at a low three-digit million euros in 2026, with order intake guidance of €550–850M. This suggests
              that at industrial scale and with project backing, large-ticket electrolyzer orders do exist. EH2's 240 MW
              Synergen FEED, if converted to FID, would represent a comparable-scale reference transaction.


              The comparable set confirms that EH2's $1B valuation represents a technology premium that has no current
              public-market equivalent. Whether that premium is warranted depends entirely on whether Infinium
              Roadrunner operational data and pipeline FID conversions materialize on schedule.
