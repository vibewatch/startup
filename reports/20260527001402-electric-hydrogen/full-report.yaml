  - id: FM001
    title: Green Hydrogen Market Size Pyramid — TAM to SOM Capacity Ceiling
    type: pyramid
    layout: standard
    summary: >-
      Three-layer indicative sizing from global clean hydrogen capex (TAM) through large-scale Western PEM electrolyzers
      addressable by EH2 (SAM) to EH2 factory-constrained obtainable market (SOM); all values are approximate annual
      capex in USD billions. High uncertainty applies to all three layers.
    data:
      items:
        - label: TAM — Global clean hydrogen production capex (2030E, all technologies)
          value: 50
          unit: $B/year (approx.)
          note: >-
            Based on ING 2025 estimate of $222B total government support 2025 + project pipeline; actual private capex
            deployment estimated at $30–70B/year by 2030 under BNEF base scenario. Excludes infrastructure and storage.
        - label: SAM — Large-scale Western PEM electrolyzers ≥75 MW (U.S. + Europe)
          value: 10
          unit: $B/year (est. 2028–2030)
          note: >-
            Estimated from public project pipeline and Repsol/Synergen project capex benchmarks (~$800–1,200/kW
            installed). Highly uncertain; no independent analyst estimate exists for this specific segment.
            Contradictory with supply-side overhang.
        - label: SOM — EH2 factory-capacity-constrained obtainable market (Devens 1.2 GW/year)
          value: 1.2
          unit: $B/year (full utilization ceiling)
          note: >-
            EH2 factory nameplate at 1.2 GW/year × ~$1,000/kW installed TIC (Synergen benchmark) = ~$1.2B/year max
            revenue at full utilization. Actual utilization rate is private; CEO acknowledged 1.5 years of muted
            activity.
    approximationNotes: >-
      All three layers are estimates with low reliability. TAM is derived from government support and project pipeline
      proxies, not a direct capex survey. SAM is interpolated from four named project benchmarks and cannot be validated
      independently. SOM is a factory output ceiling, not a forecast. Do not use these as price-target inputs without
      independent diligence. Contradictions between supply and demand lenses are preserved; a higher-confidence sizing
      requires primary market research.
    claimRefs:
      - CM007
      - CM012
      - CM025
      - CM036
      - CM037
