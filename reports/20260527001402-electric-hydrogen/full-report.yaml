  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Policy, and Legal Risk
        blocks:
          - type: paragraph
            body: |
              Electric Hydrogen operates at the intersection of the most volatile clean-energy policy landscape
              in a decade. The company's commercial model presupposes projects that can reach final investment
              decision under a supportive U.S. incentive structure, particularly the 45V hydrogen production
              tax credit introduced by the Inflation Reduction Act. The One Big Beautiful Bill Act (OBBBA),
              signed in 2025, fundamentally altered that assumption.

              The OBBBA moved the 45V construction-start deadline from January 1, 2033 to January 1, 2028,
              a five-year compression that squeezes permitting, design finalization, financing, and procurement
              schedules simultaneously. Industry groups warned the deadline shift would divert green hydrogen
              investment to Europe and Asia, which have more stable incentive frameworks. For large-scale PEM
              projects like those in EH2's pipeline — where FEED alone can take six to twelve months and project
              finance for a 100–240 MW facility typically requires 18–36 months of commercial and technical
              diligence — the compressed window is a material execution and FID risk, not merely a policy
              inconvenience.

              The H2Hubs program adds a second layer of policy risk. The DOE confirmed in early 2025 that it
              was considering reducing or eliminating funding for four of the seven originally selected hubs —
              those in California, the Mid-Atlantic, the Pacific Northwest, and the Midwest — representing
              nearly 60% of the original $7 billion federal commitment. Total project costs for the H2Hubs
              programme escalated from approximately $14 billion to nearly $50 billion, and the OIG issued a
              critical report in June 2025 identifying the absence of a formal program-level risk assessment
              and workforce plan despite more than 250 federal staff and 165 contractors managing the programme.
              EH2's near-term U.S. pipeline includes HIF's Texas e-fuels facility and Synergen's ammonia
              project, neither of which is directly part of an H2Hub, but both depend on the same broad policy
              environment and investor confidence that H2Hubs was designed to anchor.

              The OBBBA simultaneously strengthened 45Q carbon-sequestration credits, making blue hydrogen more
              competitive relative to green hydrogen and shifting projected 2030 clean hydrogen composition to
              more than 90% blue according to ING analysis. That structural tilt toward blue hydrogen reduces
              the addressable project market for a pure green hydrogen equipment company.

              Regulatory risk extends beyond U.S. federal policy. EH2 is actively pursuing European projects —
              the Uniper 200 MW pre-FEED in Germany, potential pipeline projects in Europe and MENA under GM
              Bruno Forget appointed September 2025, and LatAm expansion under GM da Rocha Oliveira appointed
              December 2025. European RED III mandates and the European Hydrogen Bank provide more stable demand
              signals, but localization requirements are real: the CEO explicitly stated EH2 must "move a lot of
              our supply chain to Europe for European suppliers," imposing supply-chain reconfiguration cost and
              execution risk. EH2 has no publicly disclosed environmental permits, safety cases, or Hazardous
              Area Classification approvals for any commercial project; these diligence items remain unverified.

              No public evidence of active EH2-specific litigation, regulatory enforcement actions, IP disputes,
              or OSHA or EPA sanctions has been identified. However, the company operates hydrogen processing
              equipment subject to hydrogen safety codes (NFPA 2, IEC 62443 for control systems), and
              commissioning a first-of-kind 100 MW plant carries inherent incident and liability risk that
              could surface during or after the Roadrunner commissioning. Monitoring is required.
            claimRefs:
