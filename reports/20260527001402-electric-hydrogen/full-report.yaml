  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation
        blocks:
          - type: paragraph
            body: >-
              Electric Hydrogen's market is structurally narrow by design: the product is a complete 75 MW to 120 MW
              electrolyzer

              plant whose unit economics only make sense for large capital projects, so the buyer profile is limited to
              project

              developers, energy companies, utilities, and industrial IPPs capable of financing and operating
              hundred-megawatt-scale

              clean hydrogen facilities. The company's public intake form explicitly asks for project size in MW and
              industry type,

              and the smallest project-size band on the form (1–5 MW) is far below a commercially sold HYPRPlant
              unit—suggesting

              EH2 qualifies leads rather than accepting all comers.


              Five distinct buyer segments emerge from the reviewed public source pack. eFuels developers (Infinium, HIF
              Global)

              buy a complete hydrogen plant as a feedstock production asset for sustainable aviation fuel, e-methanol,
              or e-diesel.

              Green ammonia developers (Synergen Green Energy) use the hydrogen output to synthesize ammonia for
              maritime fuel and

              fertilizer export markets, particularly Europe and Asia. European energy utilities (Uniper) seek
              large-scale

              electrolysis capacity as a cornerstone of national or regional hydrogen backbone strategy. IPPs and
              diversified energy

              companies (AES) reserve supply capacity ahead of specific project FIDs under framework agreements. A fifth
              segment—

              direct heavy-industry users such as refineries, steel producers, and chemical manufacturers—appears on the
              intake form

              and the homepage's market-applications section, but no named customer in this category appears in the
              reviewed public pack.


              Geographically, all five named relationships are either US-domiciled projects or a single large European
              project

              (Uniper in Wilhelmshaven, Germany). However, commercial hires announced in Q3–Q4 2025 signal active
              pipeline

              development in Europe/MENA and Latin America. EH2 CEO Garabedian confirmed in late 2025 that European gas
              prices

              and EU carbon-policy mandates make European projects more economically compelling than US domestic
              decarbonization

              in the near term, and that several US-domiciled customer projects (HIF, Synergen) are actually exporting
              hydrogen

              products to European buyers. Channel access is entirely through direct enterprise sales; no distributor,
              systems

              integrator, or marketplace channel has been disclosed.
