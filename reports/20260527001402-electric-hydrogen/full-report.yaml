    title: Market Estimate Range — Green Hydrogen Production Forecasts by 2030
    type: range
    layout: standard
    summary: >-
      Published estimates for global clean hydrogen production by 2030 span from 5.5 mtpa (BNEF base) to 25 mtpa
      (government targets), a 4.5× gap that reflects irreconcilable assumptions about policy execution and cost
      reduction. All values are million tonnes per year (mtpa).
