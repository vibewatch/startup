      - number: '5.3'
        title: Maturity, Roadmap, and Differentiation
        blocks:
          - type: paragraph
            body: >-
              Public maturity evidence shows a stepped progression rather than a leap directly from lab work to gigawatt
              rhetoric. Electric Hydrogen’s 1 MW plant has run since 2022 and was used to develop plant-wide controls
              and safety design. The Pioneer plant, operating since January 2024, uses a full-size commercial stack and
              most of the same power and process components as HYPRPlant at one-tenth scale. By 2026, the first
              commercial 100 MW plant for Infinium’s Roadrunner site is in commissioning. Additional named projects
              extend the map: Uniper selected EH2 for a 200 MW pre-FEED in Germany; HIF selected the company for a Texas
              e-fuels facility; and Synergen selected two 120 MW plants under FEED. Publicly disclosed manufacturing
              capacity is already 1.2 GW per year at Devens; the reviewed pack does not disclose a separate 500 MW per
              year interim ramp target.


              Differentiation rests on integration and manufacturability. DNV validated not only stack technology but
              plant design, manufacturing quality, reliability, and commercial assurances. The competitor benchmark,
              however, is formidable. Accelera advertises certifications and digital monitoring, Nucera emphasizes
              installed base and ISO-backed alkaline systems, Topsoe sells SOEC efficiency and service warranties, Bloom
              sells efficiency and large cell/stack manufacturing, Linde sells integrated industrial-gas infrastructure,
              and Nel sells installed-base breadth. EH2’s public edge is therefore narrower and more specific: a
              standardized PEM plant intended to cut total installed cost and compress delivery time for 100-plus-MW
              projects. Field execution at Roadrunner and follow-on plants is the proof point that must convert this
              narrative into durable advantage.
