      - number: '7.3'
        title: Partner, Customer-Concentration, and Dependency Risk
        blocks:
          - type: paragraph
            body: |
              Electric Hydrogen's entire near-term commercial pipeline is concentrated in fewer than five named
              project relationships. Infinium's Project Roadrunner (100 MW, first commercial plant, commissioning
              2026) is the only plant that has shipped and reached the site. HIF's Texas e-fuels facility, Synergen's
              240 MW (two 120 MW plants) ammonia FEED with FID targeted in 2026, and Uniper's 200 MW Green
              Wilhelmshaven pre-FEED (started October 2024, no FID published) collectively constitute the
              total publicly known near-term pipeline. The AES 1 GW framework agreement is a conditional
              reservation, not a binding purchase order, and EH2 is developing approximately 15 projects across
              10+ U.S. states through the Ambient Fuels acquisition, but none of these are named or at advanced
              FEED stage publicly.

              Customer-concentration risk is therefore extreme by any private-company standard. The loss of
              a single named project — whether due to project sponsor financial failure, loss of offtake,
              permitting failure, or a FEED-to-FID conversion failure — would remove a significant fraction of
              near-term potential equipment revenue. Infinium's Roadrunner is backed by Brookfield Asset
              Management and Breakthrough Energy Catalyst; HIF Global is backed by Porsche AG and major
              energy investors; Synergen is a relatively young Houston-based developer (founded 2022); Uniper is
              a large European utility. Synergen, as the newest and smallest project sponsor, carries higher
              developer execution and financing risk than Brookfield or Uniper.

              The Generate Capital partnership provides up to $400 million in project finance, but this is
              structured as a commitment from an infrastructure investor (with >$14B raised since 2014) to deploy
              capital into hydrogen projects co-developed with EH2, not as an equity backstop to EH2 itself.
              The partnership depends on Generate's own deployment decisions, market conditions, and ability
              to underwrite project economics. Generate Capital as a single dominant project-finance counterparty
              creates a concentration risk at the project-capital level.

              Key supplier dependencies include Titan Production Equipment (Texas skid fabrication, sole-source),
              The Weitz Company (EPC for Roadrunner), and Ingeteam (Spanish power systems technology supplier
              referenced for European deployments). Ingeteam as a European power-electronics partner is not
              publicly described in terms of exclusivity, minimum commitments, or substitutability. For European
              projects, EH2 has confirmed that it is developing local supply-chain partners to meet local content
              expectations, but these relationships are not disclosed.

              Cloud and digital platform dependency is not publicly described; EH2 does not disclose its
              plant monitoring, SCADA, or remote-diagnostics architecture, creating an unverified cybersecurity
              and operational resilience gap. Large industrial hydrogen plants are process-safety-critical
              environments where control-system vulnerabilities could have disproportionate physical consequences.

              Labor and key-person risk is meaningful at the top. CEO and co-founder Raffi Garabedian is the
              primary public voice, technical vision holder, and investor relationship lead. SVP of Global
              Commercial Jason Mortimer and the newly hired Europe and LatAm GMs represent geographic expansion
              bets made in 2025 on relatively limited public track records within EH2. The company has >300
              employees but a small executive team for a capital-intensive industrial manufacturer at scale.
              Nel cut workforce to 346 employees by end-2025 — a benchmark warning that the sector punishes
              over-hiring relative to order conversion.
