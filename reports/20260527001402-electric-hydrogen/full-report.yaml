  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The bull thesis for Electric Hydrogen rests on four pillars. First, EH2 is the only US-headquartered PEM
              electrolyzer OEM to have commissioned a 100 MW-class plant by 2026, giving it a meaningful first-mover
              operating data advantage over every Western competitor at that scale. Second, its HYPRPlant design
              received independent DNV validation in July 2025, confirming it is "very competitive and unique in the
              market"—an endorsement that reduces bankability risk for project developers seeking equipment for
              project-financed facilities. Third, the Devens gigafactory at 1.2 GW/year provides manufacturing leverage
              that smaller peers cannot replicate: Nel ASA reported NOK 963M in 2025 revenue on an operating loss of NOK
              1,365M, while ITM Power reported just £26M in H1 FY2026 revenue. EH2's vertically integrated
              stack-to-plant model positions it to capture a larger share of per-project value than pure technology
              licensors. Fourth, the Generate Capital partnership (up to $400M project finance, September 2025) solves
              near-term project bankability without diluting equity at the corporate level.


              The anti-thesis is equally substantial. EH2 has disclosed no revenue, gross margin, or EBITDA, making
              valuation inherently speculative. The CEO publicly acknowledged approximately 18 months of muted demand as
              of late 2025, which implies the commercial pipeline is moving slower than the original Series C investors
              anticipated. The OBBBA's compression of the 45V construction-start deadline from January 2033 to January
              2028 is a structural headwind: large projects (200–240 MW) require 18–36 months of project-finance
              diligence after FEED, meaning the effective FID window for OBBBA-compliant projects closes around
              mid-2026, a constraint that directly threatens Synergen and any future US awards. Meanwhile the
              gray-versus-green hydrogen cost gap remains at approximately 3× in the United States even after full 45V
              credit application, and the OBBBA's simultaneous strengthening of 45Q credits makes blue hydrogen more
              competitive at the margin. The combined effect is a sector in structural demand dislocation, not merely a
              cyclical trough.
