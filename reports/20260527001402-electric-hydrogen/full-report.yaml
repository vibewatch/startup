      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Manufacturing Overcapacity Is a Sector-Wide Existential Signal
            body: >-
              The electrolyzer industry has entered a structural oversupply crisis: global manufacturing capacity
              exceeded 50 GW/year by 2025 while annual deployment was approximately 2 GW — a 25:1 ratio. Cummins exited
              the sector in late 2024; approximately 50 projects were cancelled in 2025; and U.S. clean energy
              investment cancellations totaled $34.8 billion. For EH2, this means the Devens gigafactory — with 1.2
              GW/year nameplate capacity — is operating in a market where near-term demand is a fraction of available
              supply. Factory utilization, not pipeline, is the binding constraint on near-term revenue.
