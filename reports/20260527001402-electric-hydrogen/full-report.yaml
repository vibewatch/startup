          Without recognized revenue or a credible revenue-run-rate, all DCF, comparables, and milestones-to-revenue
          models are speculative
        - >-
          Request audited revenue by year since founding; backlog aging schedule; cancellation and modification history;
          FID-triggered milestone schedule for all active contracts
      - - Gross margin by revenue stream (equipment, services, development)
        - Margin path
        - Critical
        - >-
          Public peers (Nel, ITM) imply deeply negative gross margin at sub-scale; without EH2 actuals, the base case
          must be materially negative; any positive-margin claim must be verified
        - >-
          Request COGS and gross-profit by revenue type; factory overhead absorption schedule; margin bridge from
          current run-rate to target scale
      - - Cash on hand, monthly burn, and runway in months
        - Capital adequacy
        - Critical
        - >-
          Series C was 2023; factory has been ramping since 2024; burn is material; current liquidity determines whether
          a new round is needed before projects reach FID
        - >-
          Request latest quarterly cash position; monthly burn by cost category; 12-month forward cash flow projection;
          draw status on credit facility
      - - Factory utilization at Devens (% of 1.2 GW/year nameplate)
        - Operating leverage
        - High
        - >-
          Factory cost structure is substantially fixed; low utilization amplifies per-unit cost and widens gross-margin
          gap; utilization below ~50% likely implies significant negative gross margin
        - >-
          Request monthly stack production volume, shipment cadence, and utilization versus nameplate for all months
          since factory opening in 2024
      - - ASP per MW and order economics (contract values, payment milestones, LD provisions)
        - Revenue model
        - High
        - All revenue forecasting requires a unit-economics anchor; without ASP, any model is unconstrained
        - >-
          Request contract summaries for all signed purchase orders including MW value, total contract value, payment
          milestone schedule, and liquidated damages or cancellation provisions
      - - Project development pipeline stage-gate and probability-weighted funnel
        - GTM efficiency
        - Medium
        - >-
          Post-Ambient, EH2 has two revenue mechanisms; the project-development funnel is entirely opaque with only a
          "15 projects across 10+ U.S. states" description available
        - >-
          Request project pipeline by stage (prospecting, feasibility, FEED, pre-FID, FID), MW, geography, expected FID
          date, customer, and probability weighting
    notes: >-
      All gaps listed above are standard financial-diligence requests for a pre-IPO industrial company. Their absence
      from public sources is expected given EH2's private-company status, but they collectively represent the minimum
      data required to underwrite the company's current equity valuation or structure a new financing instrument. The
      Generate Capital $400M should be analyzed as a project-finance facility and modeled separately from EH2's
      corporate liquidity.
