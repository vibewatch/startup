      - number: '2.2'
        title: Market Sizing — Multi-Lens Analysis and Contradictory Estimates
        blocks:
          - type: paragraph
            body: |
              Sizing EH2's market requires multiple lenses because there is no single reliable published
              estimate for the narrow segment (large-scale Western PEM electrolyzers, ≥75 MW) that EH2
              actually sells into. The analysis below uses four distinct lenses: supply-side capacity,
              production volume, policy and government financial commitment, and bottom-up project pipeline.
              These lenses disagree sharply, and any single number would misrepresent the genuine uncertainty.

              The supply-side lens shows a severe oversupply problem. Global electrolyzer manufacturing
              capacity expanded from approximately 10 GW per year in 2022 to over 50 GW per year in 2025,
              according to the IEA. By contrast, global installed electrolyzer capacity was only approximately
              2 GW at the end of 2024 — a deployment-to-capacity ratio of roughly 25:1. Clean Energy
              Associates forecast manufacturing capacity reaching 54 GW by 2027 while annual demand is only
              forecast at approximately 5 GW, implying the sector has more than 10 times the manufacturing
              supply it needs in the near term.

              The production volume lens shows aspirational divergence. Global clean hydrogen production is
              expected to approximately double to 1.8 million tonnes per year in 2026, still less than 2% of
              global hydrogen use. By 2030, BloombergNEF forecasts 5.5 mtpa — while combined national
              government targets are approximately 25 mtpa, a 4.5x gap. If 5.5 mtpa of clean hydrogen were
              produced at roughly 50 kWh/kg efficiency from electrolyzers averaging 4,000 operating hours
              per year, the implied installed electrolyzer base would be approximately 69 GW — substantially
              above any current credible demand projection for 2030.

              The policy and financial commitment lens adds scale context: governments globally allocated
              $222 billion for blue and green hydrogen in 2025 (down 20% from 2024), with the EU and member
              states providing approximately $123 billion. However, only approximately 3% of that total support
              targets demand-side offtake — most funding is supply-side or infrastructure. This skew toward
              supply without binding demand creates compounding market risk for an equipment vendor.

              The bottom-up pipeline lens — the most relevant for EH2 — shows approximately 1,700 clean
              hydrogen projects globally on drawing boards as of 2026, with over 200 committed investments
              per IEA. EH2 has reported more than 5 GW of reservations as of October 2023; four named
              customer contracts have been publicly confirmed. The sizing gap between the EH2 SAM and any
              published global TAM estimate cannot be bridged reliably with public data; the stated SAM and
              SOM estimates in the sizing table (TM002) carry high uncertainty and contradictions are preserved.
