          - type: callout
            title: European Market Is the Near-Term Commercial Lifeline
            body: >-
              EH2's CEO explicitly stated that U.S. green hydrogen economics are "hard to impossible" at current natural
              gas prices, and that both the HIF and Synergen U.S. projects target export to Europe where demand and
              policy support are stronger. European gas at 3–4× U.S. prices, combined with EU RED III, IPCEI grants, and
              the UK SAF Mandate, creates structurally better project economics. EH2's Uniper partnership in Germany and
              its stated intent to announce additional German projects signals that the company has de facto pivoted to
