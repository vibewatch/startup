            is 40 months from Oct 2023 (~Feb 2027). At $22M/month, runway is ~27 months (~Jan 2026). Actual runway
            extended by credit facility draws, DOE grant disbursements, and 48C monetization. Not a prediction —
            illustrates burn sensitivity.
    approximationNotes: >-
