      - number: '5.2'
        title: Architecture, Manufacturing, and Deployment Model
        blocks:
          - type: paragraph
            body: >-
              At the technology layer, HYPRPlant is a proton exchange membrane system. DOE’s PEM primer and target table
              provide the public benchmark for what this means technically: a solid polymer membrane carries protons,
              current flows through an external circuit, and performance is judged on current density, energy
              efficiency, degradation, lifetime, and stack cost. Electric Hydrogen’s own public materials stay one layer
              higher. They claim a highest-power advanced PEM stack, but do not publish a cell-by-cell bill of materials
              or a plant control-system architecture. What the pack does show clearly is the operating model around that
              stack.


              Manufacturing is split across two geographies. Devens, Massachusetts produces and assembles proprietary
              electrochemical stacks, while Texas partner facilities build the process modules and plant skids. Electric
              Hydrogen says every full-sized stack gets end-of-line testing, the skids are laser-scanned for fit-up, the
              plant is factory-tested before shipment, and every skid is road-shippable. Roadrunner adds the best field
              proof so far: before shipment, its skids were assembled, hydro-tested, and completed a quality process in
              Texas; after arrival, Weitz handled on-site installation. The result is a hardware architecture
              inseparable from a manufacturing and deployment architecture: plant economics depend on standardized
              fabrication and minimized site work, not just electrochemical efficiency.
