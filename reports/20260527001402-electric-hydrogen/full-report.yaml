  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered System and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Electric Hydrogen’s product is best understood as a factory-built hydrogen plant for industrial project
              developers, not as a merchant stack sold into someone else’s balance-of-plant. The public pages
              consistently describe HYPRPlant as a complete, pre-engineered electrolyzer plant that includes the
              surrounding power-conversion, gas-processing, water-treatment, and thermal-management equipment needed to
              turn power and water into hydrogen. The company sells into project workflows where customers are trying to
              make refinery decarbonization, e-fuels, ammonia, and other heavy-industry applications pencil at 75 MW to
              120 MW scale. The sales motion is correspondingly enterprise and project-led: public forms ask for
              industry, project size, and location rather than exposing any self-serve buying or list-pricing path.


              The reviewed public pack does not show a separately marketed stack SKU name. Instead, it presents the
              full-size commercial PEM stack as the core module inside HYPRPlant. That matters for diligence because
              EH2’s pitch to customers is not simply better electrochemistry; it is a promise that stack design, modular
              plant engineering, fabrication, shipping, and commissioning are all optimized together to lower total
              installed cost and compress time to operation. The plant lineup therefore consists of standard 75 MW, 100
              MW, and 120 MW plant variants plus earlier maturity assets — the 1 MW plant and the Pioneer plant — that
              demonstrate how the commercial architecture was proven before the first customer delivery.
