  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct, Incumbent, Adjacent, Substitute, and Status-Quo Landscape
        blocks:
          - type: paragraph
            body: >
              Electric Hydrogen's competitive arena is broader than "other PEM startups." The direct buyer problem is
              procuring an industrial hydrogen-production system that can reach financial close, clear engineering
              diligence, and operate at acceptable levelized hydrogen cost. That means EH2 competes first with direct
              electrolyzer OEM peers — Nel, ITM Power, Plug Power, Accelera/Cummins, and in many cases thyssenkrupp
              nucera — because project developers compare plant-scale electrolysis platforms even when the underlying
              chemistry differs. EH2's own wedge is unusually specific: a standardized 75 MW, 100 MW, or 120 MW
              integrated PEM plant, shipped on skids with balance-of-plant included, paired with manufacturing in
              Massachusetts and Texas and explicit claims around lower total installed cost and faster commissioning.


              The adjacent substitute set is technologically meaningful. Bloom Energy and Topsoe both push solid-oxide
              electrolysis as a lower-LCOH path when waste heat or tight downstream integration into ammonia, methanol,
              or SAF is available. The industrial-gas incumbents matter even more strategically. Linde can build, own,
              and operate electrolyzers while leveraging its existing liquefier, pipeline, and distribution networks;
              Air Products demonstrates at NEOM that it can act as EPC, system integrator, and exclusive offtaker at 4
              GW renewable scale. Those companies do not merely sell stacks; they sell execution certainty and
              route-to-market.


              The strongest substitutes remain status quo and internal build. Gray or blue hydrogen still wins on
              near-term economics in weak-demand regions, while integrated industrial buyers such as Repsol can choose
              to embed electrolysis directly inside refinery or fuels complexes rather than rely on a standalone OEM to
              own the customer relationship. In practice, EH2 therefore competes across five classes at once: direct OEM
              peers, incumbent alkaline suppliers, solid-oxide efficiency challengers, industrial-gas integrators, and
              customers' ability to keep using fossil-derived hydrogen or self-integrate hydrogen capex.
