  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing, and Go-to-Market Motion
        blocks:
          - type: paragraph
            body: |
              Electric Hydrogen's revenue model is structured around three intersecting mechanisms: capital
              equipment sales of fully integrated HYPRPlant electrolyzer plants, engineering and commissioning
              services that accompany each plant sale, and post-acquisition project co-development and
              project-finance facilitation enabled by the 2025 integration of Ambient Fuels and the Generate
              Capital partnership. A fourth potential revenue stream — service, warranty, and performance-
              monitoring contracts after commissioning — exists by inference from the product architecture
              but has not been sized or described publicly.

              The core transaction is the sale of a HYPRPlant at the project level: EH2 manufactures
              electrolyzer stacks at its 1.2 GW/year Devens, Massachusetts gigafactory, while chemical
              process modules are fabricated at its Texas facility by local partners. Stacks and skids are
              then shipped, assembled on site by local EPC teams, and commissioned. The three capacity
              variants — 75 MW, 100 MW, and 120 MW — create a ladder of contract sizes; a 120 MW
              HYPRPlant for the Synergen FEED comprises two units paired together, implying modular
              stacking for larger orders. Pricing is project-negotiated and is not published as a list price.
              EH2 does not disclose average selling price, revenue per MW, or any realized contract value.

              The go-to-market motion is entirely enterprise and project-development led. All named customer
              relationships began with multi-month to multi-year FEED, pre-FEED, or framework supply
              agreements before any commercial delivery obligation. The AES 1 GW framework supply agreement
              is a conditional reservation, not a binding order. The Infinium 100 MW engagement at Project
              Roadrunner moved through pre-FEED, to engineering, to plant shipment, to current commissioning
              in 2026 — a cycle spanning at least two years from selection to commissioning. The Uniper 200 MW
              engagement began pre-FEED in October 2024 with no FID date published. Synergen's 240 MW FEED
              agreement targets FID in 2026. This pattern implies a sales cycle of 18 to 36+ months from
              first selection to recognized equipment revenue.

              Following the September 2025 announcement of the Ambient Fuels acquisition (transaction closed
              May 2025) and the associated Generate Capital partnership, EH2 added a project co-development
              channel. The company is actively developing approximately 15 projects across more than 10 U.S.
              states with a potential of over 600 tonnes per day. Generate Capital provides up to $400 million
              in project finance solutions, allowing EH2 to originate, develop, and potentially sell or
              refinance hydrogen projects as a developer rather than solely as an equipment supplier. This
              creates a potential second revenue path — development fees, asset sales, and equity carries —
              but the economics are not publicly disclosed and the company stated it was targeting deployment
              of project capital beginning in 2026.

              Revenue recognition will differ materially between the equipment stream and the project-
              development stream. Equipment sales likely recognize revenue on delivery and acceptance of
              major milestones; project development revenue would recognize on development fee events, asset
              sales, or production offtake tied to commercial operations. The two streams therefore have
              different leading indicators, different capital intensity, and different margin profiles — but
              neither is publicly sized.
