      - number: '8.6'
        title: Exit Readiness and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              EH2 is not exit-ready in a conventional sense. An IPO would require at minimum $100M in trailing annual
              revenue, a credible path to positive EBITDA, and public-market comparables that are not in existential
              financial distress—none of which apply as of mid-2026. The public electrolyzer OEM market context (Nel,
              ITM Power, Plug Power all deep in losses, sector down-cycles) makes a clean IPO window effectively closed
              until at least 2028–2029, contingent on a recovery in green hydrogen project FIDs.


              Strategic M&A is the more plausible exit scenario. Plausible acquirers include oil majors seeking to
              vertically integrate (TotalEnergies, Equinor, JERA), industrial gas firms seeking to own upstream
              electrolysis at scale (Air Products, Linde, Air Liquide), and larger conglomerates that have stated clean
              hydrogen commitments (Baker Hughes, GE Vernova). The DNV validation and named project pipeline would
              reduce due diligence friction for an industrial acquirer. A strategic premium of 30–50% over a comparable
              OEM multiple is plausible given EH2's manufacturing scale and technology differentiation.


              Five diligence asks are critical before any investment decision. First: the Infinium Roadrunner
              commissioning data package—actual availability, specific energy consumption, and degradation profile for
              the first 90 days of operation. Second: full cap table, preference stack, and credit facility covenant
              disclosure. Third: unit economics model—COGS, gross margin, and contribution margin per installed kW at
              100 MW scale. Fourth: firm FID timelines and committed financing status for Synergen and HIF Global.
              Fifth: burn rate and runway given the current absence of commercial revenue.
