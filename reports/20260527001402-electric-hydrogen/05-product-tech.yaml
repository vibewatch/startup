- id: TE006
  title: Trust, quality, and compliance controls table
  columns:
  - Control or evidence area
  - Public status
  - Scope
  - Why it matters
  - Gap or follow-up ask
  rows:
  - - DNV technical due diligence
    - Completed and publicly summarized
    - Stack, plant, reliability, manufacturing, warranty, commercial assurances
    - Strongest independent bankability signal in public pack
    - Need underlying report, assumptions, and exclusions
  - - Full-size stack testing at Pioneer
    - Publicly disclosed
    - Rigorous cycling and extended-duration tests over thousands of hours
    - Supports maturity claim before broader field deployment
    - Need publicly shared degradation and availability results
  - - End-of-line stack testing
    - Publicly disclosed
    - Every full-sized stack at Devens
    - Signals factory QA discipline before shipment
    - Need acceptance criteria and failure-rate disclosure
  - - Hydro-testing and skid quality process
    - Publicly disclosed for Roadrunner
    - Texas fabrication and pre-shipment checks
    - Important for leak, fit-up, and field-readiness risk
    - Need replication evidence across future plants
  - - Supplier and business conduct policies
    - Publicly disclosed
    - Supplier Code of Conduct, Code of Business Conduct, 2024 Sustainability Report
    - Shows governance expectations for labor, safety, and ethics
    - Need operational audit, supplier-qualification, and enforcement detail
  - - Privacy statement on intake forms
    - Publicly disclosed
    - Prospective customer and stakeholder personal information
    - Relevant for enterprise trust and basic data handling
    - Need full privacy-policy review and data-retention detail
  - - Plant certification and code matrix
    - Not publicly disclosed
    - Hydrogen safety, pressure systems, hazardous areas, electrical and process codes
    - Critical for owner, lender, insurer, and EPC diligence
    - Request named compliance matrix including NFPA 2, pressure-equipment, hazardous-area, and plant acceptance standards
  - - Digital controls and cybersecurity architecture
    - Not publicly disclosed
    - Control system, remote monitoring, software boundaries, cyber controls
    - Needed to underwrite reliability, support, and cyber resilience
    - Request architecture narrative, vendor map, logging, segmentation, and incident-response controls
  notes: The chapter separates disclosed quality processes from missing certification and cyber documentation. Missing rows
    are deliberate diligence asks, not evidence of non-compliance.
