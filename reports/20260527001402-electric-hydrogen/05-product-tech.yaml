- id: TE005
  title: Differentiation versus alternative electrolysis approaches
  columns:
  - Vendor or approach
  - Public pitch
  - Maturity or scale signal
  - What EH2 counters with
  - Implication for diligence
  rows:
  - - Electric Hydrogen
    - Integrated PEM plant optimized for total installed cost and rapid deployment
    - DNV diligence plus first 100 MW commercial commissioning
    - Turnkey plant scope, modular fabrication, DNV validation
    - Need field uptime, certification matrix, and service-term proof
  - - Accelera PEM
    - Proven PEM modules with safety certifications, digital monitoring, and global support
    - 500,000+ operating hours and 60+ deployed units
    - EH2 argues larger turnkey plant economics rather than installed-base depth
    - EH2’s weaker public certification detail is a visible gap
  - - thyssenkrupp nucera AWE
    - Industrial-scale alkaline system with large installed base, backlog, and ISO-backed modular plants
    - '>10 GW installed and >3 GW contracted'
    - EH2 argues advanced PEM plus lower total installed cost for standardized large plants
    - Customers will compare PEM integration value against lower-cost mature AWE options
  - - Topsoe SOEC
    - Higher efficiency when waste heat is available plus service warranty and downstream integration
    - Commercial-scale European factory and explicit warranty program
    - EH2 counters with low-temperature PEM flexibility and broad industrial deployment narrative
    - Heat-integrated projects may prefer SOEC if efficiency beats PEM economics
  - - Bloom SOEC
    - Best-efficiency story and >2 GW annual cell and stack manufacturing
    - Commercial efficiency validation and large manufacturing footprint
    - EH2 counters on turnkey plant standardization and total installed cost
    - Need to separate electricity-efficiency leadership from full-plant deliverability
  - - Linde and Nel
    - Installed-base breadth, industrial gas integration, and modular electrolyzer families
    - 80+ alkaline projects at Linde and 3,800+ electrolysers installed at Nel
    - EH2 counters with plant-level modularization and targeted 100+ MW project economics
    - Service network and installed-base trust remain incumbent advantages
  notes: This comparison is based on competitor self-descriptions and is used only to frame EH2’s differentiation challenge.
    It does not imply identical product scope across vendors.
