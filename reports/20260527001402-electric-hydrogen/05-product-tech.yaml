  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: digital-controls-cybersecurity
    missingEvidence: Detailed plant controls architecture, remote monitoring model, cybersecurity controls, and incident-response
      design for HYPRPlant deployments.
    whyItMatters: Without control-system and cyber detail, an investor or lender cannot fully underwrite reliability, remote
      support, or cyber-resilience risk for an industrial hydrogen plant.
    diligencePath: Request control narratives, software and network boundary diagrams, vendor stack, remote-access model,
      logging design, and any third-party cyber assessments for deployed plants.
    relatedQuestionRefs:
    - QE027
    relatedTableRefs:
    - TE003
    - TE006
  - type: missing-source
    severity: material
    topic: plant-certification-and-codes
    missingEvidence: A plant-specific certification and code-compliance matrix covering hydrogen safety, hazardous areas,
      pressure systems, electrical integration, and plant acceptance testing.
    whyItMatters: Public quality-process claims are helpful, but owner, insurer, EPC, and lender diligence still requires
      the hard code and certification package behind the plant.
    diligencePath: Request a named compliance matrix for HYPRPlant including NFPA 2 or equivalent hydrogen-safety references,
      pressure-equipment standards, hazardous-area standards, factory acceptance criteria, and site acceptance procedures.
    relatedQuestionRefs:
    - QE028
    relatedTableRefs:
    - TE006
  - type: private-evidence-only
    severity: minor
    topic: field-performance-after-commissioning
    missingEvidence: Post-commissioning availability, degradation, and maintenance data from the first commercial HYPRPlant
      once Roadrunner exits commissioning.
    whyItMatters: The core proof of differentiation is not just shipment but sustained field performance at commercial scale.
    diligencePath: Refresh after Roadrunner reaches steady operation and request uptime, maintenance, output, and warranty-claim
      statistics from the first operating year.
    relatedQuestionRefs: []
    relatedTableRefs:
    - TE004
    - TE006
