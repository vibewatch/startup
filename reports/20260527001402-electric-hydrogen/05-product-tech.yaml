- id: trust-quality-controls-and-technical-risks
  title: Trust, Quality Controls, and Technical Risks
  body: |-
    The strongest public trust signal is DNV’s technical due diligence. Its review covered stack technology, plant design, performance, reliability, manufacturing, quality, and standard commercial assurances, and included an on-site witness at the Pioneer plant. Additional quality controls are visible on Electric Hydrogen’s own surfaces: end-of-line testing of every full-sized stack, hydro-testing and factory quality processes at Roadrunner, supplier and business-conduct codes, and a stated privacy commitment on public forms. These are useful diligence markers because they show the company recognizes that bankability for hydrogen plants depends on more than electrochemical performance.

    At the same time, the public pack remains incomplete on the exact safety and compliance package a lender, insurer, EPC counterparty, or industrial buyer would want to see. Electric Hydrogen does not publish a plant-specific certification matrix, named code-compliance package, or detailed digital-controls and cybersecurity architecture. Competitors are more explicit on points such as ISO 22734, ASME or PED pressure systems, ATEX, and third-party cyber assessments. The wider sector backdrop also raises the bar for trust. The IEA says hydrogen deployment is still constrained by cost, infrastructure, and regulatory readiness, while Plug Power’s 10-K shows how manufacturing, reliability, liquidity, incentive, and flammable-fuel risks can compound during scale-up. Electric Hydrogen has credible process and quality signals, but public diligence still needs the hard plant documentation behind them.
