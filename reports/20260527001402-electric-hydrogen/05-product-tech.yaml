- id: TE003
  title: Technology and operating architecture table
  columns:
  - Layer or component
  - Role in system
  - Publicly evidenced detail
  - Key dependency
  - Technical or diligence risk
  rows:
  - - PEM electrochemical stack
    - Converts electricity and water into hydrogen and oxygen
    - EH2 says advanced PEM and highest-power stack; DOE explains PEM mechanism
    - Membrane, catalyst, current density, durability
    - No EH2 public cell-level bill of materials or degradation curve
  - - Power conversion
    - Conditions incoming electricity for electrolysis
    - Included in complete plant and Pioneer/common architecture descriptions
    - Grid interconnect and electrical integration
    - No public one-line diagram or converter vendor disclosure
  - - Water treatment
    - Prepares feedwater for electrolysis
    - Listed as part of complete plant scope
    - Water quality and site utilities
    - No public water specification or consumption curve
  - - Gas processing
    - Conditions and handles hydrogen and oxygen streams
    - Listed as part of complete plant scope
    - Process design and pressure management
    - No public process-flow diagram or purity spec
  - - Thermal management
    - Controls heat and protects stack performance
    - Listed as part of complete plant scope
    - Cooling loop and operating profile
    - No public operating-temperature or cooling architecture disclosure
  - - Plant controls and safety logic
    - Coordinates operation, trips, and plant-wide safety
    - 1 MW plant developed controls and safety design; Pioneer reused commercial architecture
    - Software, sensors, operating procedures
    - No public control-system or cybersecurity architecture
  - - Modular skid packaging
    - Concentrates equipment into transportable plant modules
    - Road-shippable skids, factory testing, laser-scanned fit-up
    - Fabrication quality and transport logistics
    - Need field data on installation defects or punch-list burden
  - - Massachusetts stack factory
    - Manufactures proprietary stacks at scale
    - 1.2 GW/year stack capacity and end-of-line testing
    - Throughput, yield, supply chain, local labor
    - No public yield, utilization, or cost-per-kW data
  - - Texas module fabrication and EPC handoff
    - Builds process modules and hands off to site installation teams
    - Titan fabrication plus Weitz installation at Roadrunner
    - Partner execution and local industrial base
    - Partner-quality variation or schedule slippage could erode deployment claims
  notes: This table intentionally separates electrochemical architecture from manufacturing and deployment architecture, because
    EH2’s product proposition depends on both. Several engineering details remain non-public and are therefore shown as diligence
    risks rather than as asserted features.
