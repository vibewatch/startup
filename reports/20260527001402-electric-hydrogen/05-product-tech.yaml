- id: TE002
  title: Workflow and use-case table
  columns:
  - Customer job
  - Current workflow constraint
  - Electric Hydrogen solution step
  - Claimed benefit
  - Limitation or diligence ask
  rows:
  - - Screen green-hydrogen project economics
    - Custom EPC scope and imported equipment can make projects uneconomic
    - EH2 proposes a standard integrated plant in 75-120 MW sizes
    - Up to 60% lower total installed cost
    - Need customer-verified TIC after commissioning
  - - Match plant to end market
    - Different sectors need different offtake and infrastructure configurations
    - EH2 markets refineries, e-fuels, ammonia, and critical-industry applications
    - Focuses selling on heavy-industry decarbonization workflows
    - No public sector-specific performance cases beyond project selections
  - - Move from interest to plant design
    - Hydrogen projects require project-specific sizing, site, and power context
    - Public intake asks for industry, project size, and geography before engagement
    - Signals consultative project-sales motion rather than stack resale
    - No public list price or self-serve configurator
  - - Fabricate and ship plant hardware
    - Traditional field-built plants create schedule and execution risk
    - EH2 fabricates stacks in Devens and skids in Texas before shipment
    - Factory quality processes and shorter field schedule
    - Need evidence on logistics cost and schedule variance
  - - Install, commission, and operate
    - Project site work and support burden can delay revenue
    - Local EPC and commissioning partners complete site erection around factory-built skids
    - Under-six-month and >3x-faster deployment claims
    - No detailed public service SLA, warranty term, or monitoring architecture
  notes: The workflow is derived from public product pages, deployment announcements, and Roadrunner execution disclosures;
    it describes how a buyer would move from interest to plant operation, not a consumer checkout flow.
