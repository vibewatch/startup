  topStrengths:
    - >-
      Adrabetadex addresses the core cholesterol-trafficking defect in infantile-onset NPC and remains under FDA
      Priority Review with Breakthrough, Orphan Drug, and Rare Pediatric Disease designations.
    - >-
      June 2026 financing gives Beren a materially stronger launch runway than a typical single-asset rare-disease
      biotech and funds patient-support infrastructure ahead of potential approval.
    - >-
      Founder-led leadership combines investing, rare-disease regulatory, commercial, and CMC experience, while the
      company has maintained continuity with families and clinicians through expanded access.
  topRisks:
    - >-
      FDA has already extended review once, and the efficacy narrative still leans heavily on external controls,
      biomarker interpretation, and long-history program data rather than a clean modern pivotal package.
    - >-
      Approved oral competitors MIPLYFFA and AQNEURSA mean Beren is entering a served NPC market and must prove that its
      more burdensome intrathecal route justifies adoption and reimbursement.
    - >-
      Debt and royalty financing reduce dilution today but cap equity upside later, especially if launch ramps more
      slowly than management hopes.
    - >-
      Public disclosure remains thin on pricing, gross-to-net, manufacturing scale, center-of-care capacity, total
      headcount, and broader pipeline diversification.
  unresolvedGaps:
    - >-
      The actual equity price, post-money valuation, liquidation preferences, and anti-dilution terms from the June 2026
      financing are undisclosed.
    - >-
      Management has not publicly disclosed launch pricing, gross-to-net assumptions, or site-capacity plans for
      sustained intrathecal administration.
    - >-
      Total company headcount, cash burn, runway excluding undrawn facilities, and long-term margin structure remain
      opaque.
    - Public materials do not yet prove a named post-adrabetadex pipeline with clear stage-gated milestones.
