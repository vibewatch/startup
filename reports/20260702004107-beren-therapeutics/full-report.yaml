      - number: '1.2'
        title: Leadership bench, governance visibility, and key-person concentration
        blocks:
          - type: paragraph
            body: >-
              The public leadership bench is one of the more reassuring parts of the Beren story. Jason Camm remains the
              clear center of gravity as founder, director, president, and chief executive officer, but the team page
              shows real functional depth around him rather than a thin founder shell. Aaron Ondrey adds large-company
              finance and transaction experience as CFO; Alex Gold anchors clinical and regulatory execution as CMO;
              Jennifer Spinella covers regulatory and quality; Irene von Hennigs leads medical affairs; Bennett Smith
              leads commercial planning for a first launch; Rajinder Singh covers science; Magali Hickey covers
              technical operations and CMC; Heather McCuen covers people; Peter Cicala covers legal and IP; and Cathy
              Traz covers patient and community engagement. For a private rare-disease company preparing for a potential
              first launch, that is a materially more complete bench than the bare minimum.


              The caution is that public governance disclosure lags public leadership disclosure. The reviewed official
              surfaces clearly identify Jason as a director, but they do not publish a fuller current board roster,
              committee structure, or ownership-and-control map. That means investors can see who runs functions day to
              day, but not yet how formal governance is distributed above them. Jason also remains the dominant public
              narrator across financing, regulatory, and community communications, which reinforces founder continuity
              but also flags key-person dependence. In other words, Beren looks deeper than a one-person startup
              operationally, yet still more founder-concentrated than fully institutionally disclosed from a governance
              perspective.
