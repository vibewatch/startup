      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The right financial verdict is that Beren has assembled a credible orphan-launch platform, but not yet a
              publicly underwritable operating model. The positives are real: approved NPC therapies prove that the
              category can support branded economics; Beren has assembled a much larger-than-typical pre-launch
              financing package for a single ultra-rare asset; and the company is explicitly funding diagnosis support,
              case management, care-site access, and real-world evidence as part of commercialization. The financing
              terms also suggest management sees ex-U.S. and pipeline expansion as part of the longer-term value case.


              The blockers are equally clear. The best public U.S. prevalence source still points to only 294 diagnosed
              patients and 305 diagnosed-or-treated patients against a modeled 943 prevalent cases, which means
              diagnosis capture and specialist-site execution may matter more than broad marketing spend. Beren also
              discloses no price, no realized reimbursement terms, no revenue, no margin, no current cash balance, no
              burn, no runway, and no customer concentration. The 2023 Roquette strategic relationship confirms partner
              interest in the platform, but the public pack does not disclose the investment amount, so its present
              capitalization significance cannot be measured.


              Taken together, Beren’s economics hinge on an approval-led launch of adrabetadex, the company’s ability to
              convert tiny patient numbers into durable net sales through high-touch support, and the extent to which
              milestone-based and royalty-based capital remains available without overly taxing future revenue. Until
              private diligence closes the pricing, margin, cash, and contract gaps, this chapter supports a cautious
              “pre-revenue launch option” framing rather than a clean underwriting case.
