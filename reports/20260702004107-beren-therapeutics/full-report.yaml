      - number: '7.2'
        title: Safety monitoring and intrathecal delivery create a high-touch operating model
        blocks:
          - type: paragraph
            body: >-
              Even if adrabetadex is approved, Beren still has to commercialize an intrathecal therapy in a tiny
              pediatric population with heavy caregiver burden. Company materials and poster previews consistently frame
              adrabetadex as intrathecal, while the published HPβCD literature repeatedly surfaces hearing burden as a
              recurring cost of treatment. The 2017 intrathecal study documented hearing loss in all participants, the
              feline paper tied HPβCD to dose-dependent threshold increases and recommended auditory testing, and
              long-term case reports kept hearing on a separate monitoring track even when broader neurologic scores
              stabilized. Beren likewise discloses hearing impairment, post-dose fatigue, and ataxia as the main adverse
              events. None of that makes the program non-viable, but it does mean commercialization is inseparable from
              center activation, travel reduction, case management, audiology workflows, and continued expanded-access
              obligations. Beren’s own community and financing updates effectively admit this by emphasizing local sites
              of care, family support, and real-world evidence collection as launch prerequisites rather than
              nice-to-have services.
            claimRefs:
              - CR009
