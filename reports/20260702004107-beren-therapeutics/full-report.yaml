  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: The relevant customers are families, specialists, centers, payers, and advocates
        blocks:
          - type: paragraph
            body: >-
              Beren is not yet selling an approved mass-market product, so its customer map has to be framed around the
              people and institutions that determine whether an infantile-onset NPC patient can ever reach treatment.
              The company explicitly says it designs around patient communities, healthcare providers, and health
              systems, which fits the disease reality described by NORD and NINDS: NPC is ultra-rare, heterogeneous,
              often misdiagnosed, and clinically severe enough that families, metabolic neurologists, treatment centers,
              payers, and advocacy groups all matter at once. In practical terms, families and caregivers are the
              day-to-day users of support infrastructure, specialist clinicians and centers are the operational
              adopters, payers and health systems will become the economic gatekeepers after approval, and
              advocacy/registry groups are the trust and referral multipliers. That is why Beren’s customer language is
              less about logos or account counts and more about access, diagnosis, case management, and community
              partnership.
