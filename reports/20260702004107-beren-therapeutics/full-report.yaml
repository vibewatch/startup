      - number: '2.3'
        title: Buyer, user, payer, and adoption path in an ultra-rare disease market
        blocks:
          - type: paragraph
            body: >-
              NPC adoption is not a classic broad-prescriber biopharma launch. The decisive prescribers and workflow
              owners are concentrated in specialist metabolic, genetic, and neurological centers; families and
              caregivers carry much of the day-to-day administration and support burden; and payers or health systems
              shape access through reimbursement, site-of-care approval, and patient-services coordination. NORD’s
              treatment guidance makes clear that NPC care already spans many specialties, while Beren’s own support
              materials repeatedly emphasize diagnosis acceleration, local site access, reimbursement navigation, and a
              single point of contact for families. That mix means the “buyer” is really a coalition: the physician or
              center decides clinical fit, the caregiver decides whether the journey is manageable, and the payer
              decides whether logistics and coverage are feasible. The importance of early diagnosis also changes
              adoption economics. A product can have strong biological rationale yet still miss patients if physicians
              do not suspect NPC, if biomarker or genetic workup is delayed, or if centers are not prepared to move
              quickly. In practice, the route from symptoms to treatment is a narrow funnel where recognition, testing,
              specialist referral, and support infrastructure matter at least as much as promotional reach.
            claimRefs:
