      - number: '8.4'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              Scenario work is a better fit than a single point estimate because nearly every important value driver is
              conditional. In the bull case, Beren converts Priority Review into approval on the extended timeline,
              preserves a meaningful mechanistic differentiation story in infantile-onset NPC, opens enough sites of
              care to reduce logistics friction, and shows that families and clinicians will choose its more burdensome
              route despite oral competition. That supports roughly $1.2 billion to $1.6 billion. The base case assumes
              approval odds remain real but not certain, launch builds gradually, and the market continues to weigh debt
              and royalty leakage against a narrow patient pool; that supports roughly $0.8 billion to $1.1 billion. The
              bear case assumes another regulatory setback, weak early uptake, or financing terms that bite harder than
              expected, which could drive value toward roughly $0.3 billion to $0.6 billion. The asymmetry is the point:
              there is upside, but it is capped faster than the downside once approval risk and structured capital are
              acknowledged.
