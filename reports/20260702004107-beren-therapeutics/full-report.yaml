        title: Product scope and asset map
        blocks:
          - type: paragraph
            body: >-
              Beren's public product surface is unusually concentrated for a platform-framed biotech. Across the
              company, science, patients, and medical-affairs pages, the named deliverable is adrabetadex for
              infantile-onset Niemann-Pick disease type C, advanced through Mandos and supported by an expanded-access
              program that predates the current NDA. The company repeatedly describes a broader cholesterol-trafficking
              and derivatized-cyclodextrin platform, but the reviewed pack does not identify a second named clinical
              asset, separate development candidate, or modular software product that stands independently from the
              adrabetadex/NPC narrative. That makes the product map look like a tiered stack rather than a broad
              portfolio: one lead clinical asset, one delivery and patient-support motion around that asset, and one
              scientific platform thesis that could expand later but is not yet publicly enumerated in the same way. The
              medical.berentx.com surface and repeated congress activity add practitioner-facing credibility, but they
              reinforce adrabetadex centrality rather than proving broad pipeline breadth. That concentration heightens
