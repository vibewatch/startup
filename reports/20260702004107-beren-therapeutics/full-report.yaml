      - number: '3.2'
        title: Capability, packaging, and switching-cost differences center on route, companion therapy, and services
        blocks:
          - type: paragraph
            body: >-
              The biggest practical competitive difference is not a subtle biomarker nuance but the treatment experience
              each option asks families and sites to absorb. MIPLYFFA and AQNEURSA are oral therapies; MIPLYFFA adds a
              miglustat requirement, while AQNEURSA markets a stand-alone label and a suspension format that can be
              delivered by mouth or G-tube with weight-based dosing. Beren, by contrast, is selling an intrathecal
              cyclodextrin story aimed at restoring cholesterol trafficking more directly in infantile-onset NPC. That
              creates a more invasive administration profile and likely a narrower site-of-care network, but it also
              underpins Beren’s strongest differentiation claim because the approved oral options are framed around
              neurological manifestations rather than the same route or mechanistic thesis.


              Packaging and support economics matter almost as much as label language in an ultra-rare disease. Zevra’s
              public support materials already advertise education, coverage support, access support, and fulfillment
              help for MIPLYFFA. Beren’s own community update says it is building diagnosis support, case management,
              site networks, real-world evidence loops, and peer connection before approval. Public price transparency,
              however, is weak across the entire retained pack: brand and reference pages disclose dosing schedules,
              side-effect warnings, and support programs, but not straightforward list or net pricing. That means
              switching costs will likely be shaped more by physician familiarity, specialty-site logistics, access
              services, and family burden than by any publicly visible WAC comparison today.
