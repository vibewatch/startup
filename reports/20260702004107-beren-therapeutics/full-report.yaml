    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or event
      - Transmission to thesis
      - Action implication
    rows:
      - - Regulatory delay / CRL
        - Another material FDA delay, CRL, or materially weaker label
        - Cuts the probability that Beren merits a unicorn-class benchmark
        - Move from track toward avoid until valuation resets or new evidence emerges
      - - Launch starts miss
        - Early eligible starts skew toward MIPLYFFA or AQNEURSA despite Beren rollout
        - Turns support-program buildout into catch-up rather than moat
        - Reduce base-case range and require harder evidence before committing capital
      - - Structured capital worsens
        - New capital adds more royalty leakage or dilutive equity before traction
        - Reduces common-equity upside even if product approval lands
        - Demand lower entry price or walk away
      - - Pricing / reimbursement miss
        - Gross-to-net or payer friction makes economics weaker than implied
        - Base case stops looking self-sustaining
        - Shift valuation toward bear case
      - - Center readiness shortfall
        - Site-of-care rollout lags launch ambition
        - Delays uptake in an already narrow market
        - Treat any high-end valuation as unsupported
    notes: >-
      Kill triggers are intentionally monitorable so the recommendation can be revised quickly if the fact pattern
      changes.
