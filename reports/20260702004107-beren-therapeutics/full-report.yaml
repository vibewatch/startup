        - id: w5
          label: Manage tolerability and hearing risk
          detail: >-
            Audiology surveillance, hearing aids when needed, and post-dose fatigue/ataxia management support repeat
            use.
        - id: w6
          label: Layer longer-term care choices
          detail: >-
