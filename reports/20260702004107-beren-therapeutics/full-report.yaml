      - number: '3.4'
        title: Moat durability depends on proving disease-modifying value before service and scale gaps close
        blocks:
          - type: paragraph
            body: >-
              Beren’s most defensible wedge is not convenience, regulatory lead, or current commercial reach. On public
              evidence, the company’s best argument is that adrabetadex is mechanistically closer to the underlying
              cholesterol-trafficking pathology and more targeted to rapidly progressive infantile-onset NPC than the
              approved oral options. The same source pack also shows why that wedge is fragile. Zevra already has the
              first approved U.S. label, a marketed support platform, and public-company funding access; AQNEURSA has
              the simplest day-to-day label posture as a stand-alone oral therapy; and Cyclo continues to keep a second
              cyclodextrin program alive. Beren is therefore trying to win on higher-value clinical positioning while
              beginning from a weaker readiness position on present-day commercial convenience.


              The adverse evidence keeps the durability case honest. FierceBiotech reports that FDA review slipped by
              three months after a major amendment, reminding investors that the program’s regulatory path is still
              active and not de-risked by approval. Fierce also revisits the asset’s earlier clinical setback under
              prior ownership, which makes Beren’s current sponsor-presented survival and progression data important but
              not definitive. Finally, the tiny U.S. diagnosed-or-treated NPC pool means control of advocacy
              relationships, specialty centers, and access workflows could matter as much as incremental efficacy. Beren
              can plausibly argue for a differentiated role, potentially even as a foundational therapy layered with
              oral products, but it has not yet proved the head-to-head superiority, launch traction, or reimbursement
              leverage needed for a durable moat.
