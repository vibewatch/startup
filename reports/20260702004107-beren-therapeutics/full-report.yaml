      - number: '2.2'
        title: Epidemiology lenses, infantile subset severity, and why SAM remains constrained
        blocks:
          - type: paragraph
            body: >-
              Public patient counts are good enough to show that NPC is real, clinically important, and extremely small,
              but not good enough to produce a clean infantile-onset SAM. The strongest U.S. prevalence source in the
              local corpus found 294 diagnosed NPC patients and 305 diagnosed-or-treated patients, yet the same study
              estimated about 943 prevalent cases if awareness and diagnosis improved. That gap matters more than the
              absolute numbers because it means diagnosis capture is a core market-sizing variable. The same study
              estimated roughly 42 new U.S. cases per year, while NORD frames NPC incidence at about 1 in 100,000 to
              120,000 live births and stresses that many patients are missed or misclassified. Beren’s materials further
              narrow the thesis to infantile-onset disease, defined as neurological onset before age six, with
              especially poor outcomes for earlier onset: mean age of death of about 5.6 years for early infantile onset
              versus about 13.4 years for late infantile onset. Those data justify a high-urgency commercial story, but
              they do not reveal how many of the modeled 943 U.S. prevalent patients fall into the filed infantile
              subset. The market chapter therefore uses evidence-constrained patient lenses rather than pretending to
              know a bottom-up adrabetadex SAM from public sources alone.
