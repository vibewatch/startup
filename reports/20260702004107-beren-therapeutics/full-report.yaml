      - number: '1.3'
        title: Capital structure, named stakeholders, and disclosure limits
        blocks:
          - type: paragraph
            body: >-
              Beren's most concrete public scale signal is the June 10, 2026 financing. The company announced $300
              million of combined capital, split between $135 million of equity and up to $165 million of non-dilutive
              capital. The equity syndicate named Wellington Partners, JIC Venture Growth Investments, Founders Fund,
              Narya Capital, Eisai, and other institutional investors, while Hercules Capital provided the
              debt-and-royalty facility. The Hercules structure matters because it shows Beren trying to preserve upside
              ahead of a potential launch rather than relying on equity alone: the facility included milestone-based
              term loans, only $30 million drawn at announcement, plus a royalty tranche that would fund on approval.


              The capital is tied directly to a launch-and-support thesis, not to abstract balance-sheet optionality.
              Official uses of proceeds emphasize diagnosis acceleration, a single point of contact for families,
              broader site-of-care access, real-world evidence generation, and community connectivity. That fits Beren's
              public benefit framing and its repeated attempt to differentiate on long-term family support as much as on
              molecule claims. The earlier 2023 Roquette strategic investment adds one more useful capital and
              partnership datapoint because it connected Beren's cyclodextrin platform rhetoric to a manufacturing and
              CMC-oriented industrial partner before the 2026 financing arrived.


              The biggest caveat is disclosure depth. Public materials are strong on named financing amounts and
              stakeholder names, but weak on the classic investor cover metrics: there is no public valuation mark in
              the retained pack, no revenue run rate, no customer count, and no headcount disclosure. For underwriting
              purposes, the public record therefore proves access to capital more convincingly than it proves operating
              scale.
