      - number: '5.3'
        title: Safety, quality, and manufacturing dependencies
        blocks:
          - type: paragraph
            body: >-
              The core technical risk is not whether adrabetadex reaches the CNS; it is whether the intrathecal HPβCD
              benefit-risk profile is operationally manageable at scale. Human and animal literature both point to
              auditory toxicity or hearing-threshold changes as a recurring class effect, and Beren's own summaries now
              frame hearing impairment, post-dose fatigue, and ataxia as the leading adverse events. Those are
              manageable in principle, but only inside a product system with reliable audiology surveillance,
              specialized dosing centers, and family tolerance for repeat procedures. Public quality signals are
              therefore clinical and regulatory rather than digital: more than a decade of program history,
              expanded-access experience, Breakthrough Therapy and Priority Review milestones, and a Roquette
              partnership that explicitly references chemistry, manufacturing, and controls, safety protocols, and
              regulatory registration. What is missing is the commercial-grade supply picture: formulation specifics,
              manufacturing-site footprint, release criteria, scale-up status, and how much of the CMC burden Beren
              versus partners actually controls.
