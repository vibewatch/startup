      - number: '3.3'
        title: Adjacent rare-disease benchmarks show how much scale sits above the direct NPC field
        blocks:
          - type: paragraph
            body: >-
              Direct NPC competition is only part of the underwriting problem. The better benchmark for moat durability
              is the set of rare-disease companies that have already turned specialized science into repeatable
              commercial infrastructure. Zevra itself is only a partial benchmark at roughly $0.81 billion in market
              cap, but even that is far ahead of a private single-asset launch story. Ultragenyx describes one of the
              largest and most diverse rare-disease pipelines plus expanding commercial and medical affairs teams;
              Amicus remains a multi-billion-dollar rare-disease peer; BioMarin says it already has nine commercial
              therapies; Biogen combines rare disease with much larger neurology infrastructure; and Krystal pairs
              commercialization with owned GMP facilities. None of these companies is a direct NPC substitute, but all
              of them define what durable orphan execution can look like once science has to be supported by
              manufacturing, field, and medical systems.


              Those benchmarks matter because Beren’s moat will probably not come from disease exclusivity alone.
              Evaluate’s orphan-drug report still describes a large and growing market, but it also says the category’s
              growth advantage is narrowing. In other words, rare disease remains commercially attractive enough to pull
              capital and capable entrants into the space, while policy and reimbursement pressure make single-product
              stories harder to defend. For Beren, that means adrabetadex’s investment case has to survive comparison
              not just with current NPC labels, but with the operational sophistication expected of successful
              rare-disease franchises more broadly.
