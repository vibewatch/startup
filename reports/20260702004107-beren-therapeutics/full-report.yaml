      - number: '7.3'
        title: Commercial adoption risk rises because approved oral therapies already set the reference point
        blocks:
          - type: paragraph
            body: >-
              Beren is not bringing adrabetadex into an empty market anymore. The FDA approved Miplyffa in 2024 as the
              first NPC treatment, and AQNEURSA now markets itself as the only stand-alone FDA-approved therapy for NPC
              neurological manifestations. Both competitor franchises now define physician expectations around
              convenience, support services, and ongoing safety management before adrabetadex ever launches. Their
              labels also matter strategically: while both carry real warnings, they are still oral therapies, whereas
              adrabetadex remains investigational and intrathecal. That contrast increases the burden on Beren to prove
              that any disease-modifying advantage is large enough to offset procedure logistics, travel, monitoring,
              and hub complexity. The competitive fight is therefore not only scientific. Miplyffa already promotes
              coverage and fulfillment support, and orphan-market growth itself is no longer expanding with the same
              premium it once had. If launch data or payer narratives are only modestly better than existing options,
              late entry plus higher service intensity can compress uptake, margin, and investor confidence at the same
              time.
            claimRefs:
