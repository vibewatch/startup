  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      The main risks transmit through a few chokepoints: approval timing, site-of-care readiness, launch uptake, and
      financing flexibility.
    data:
      nodes:
        - id: approval
          label: Approval outcome
          detail: Timing and sufficiency of the FDA review
        - id: sites
          label: Site-of-care readiness
          detail: Centers, logistics, family support, and monitoring capacity
        - id: monitoring
          label: Monitoring burden
          detail: Audiology, travel, and post-dose management
        - id: competition
          label: Approved oral competitors
          detail: Miplyffa and AQNEURSA already shape physician choice
        - id: uptake
          label: Launch uptake
          detail: Referral conversion and payer / physician adoption
        - id: margin
          label: Commercial margin
          detail: Net sales after support costs and royalties
        - id: capital
          label: Capital flexibility
          detail: Debt draws, royalty burden, and runway
        - id: valuation
          label: Investor underwrite
          detail: Confidence, multiple, and position sizing
      edges:
        - from: approval
          to: uptake
          label: label scope
        - from: approval
          to: capital
          label: milestones
        - from: sites
          to: uptake
          label: access friction
        - from: monitoring
          to: uptake
          label: care burden
        - from: competition
          to: uptake
          label: late entry
        - from: uptake
          to: margin
          label: volume mix
        - from: margin
          to: capital
          label: cash generation
        - from: capital
          to: valuation
          label: dilution / overhang
        - from: uptake
          to: valuation
          label: proof of launch
        - from: approval
          to: valuation
          label: binary event
    approximationNotes: >-
      Edges reflect directional business transmission drawn from the cited evidence rather than internal company process
      maps.
    claimRefs:
      - CR002
      - CR015
      - CR017
      - CR023
      - CR024
      - CR025
      - CR045
      - CR046
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      Beren’s launch path depends on a small set of financiers, technical partners, treating centers, and specialist
      leaders.
    data:
      nodes:
        - id: beren
          label: Beren / Mandos
          detail: Single-asset sponsor seeking first launch
        - id: hercules
          label: Hercules
          detail: Debt and royalty counterparty
        - id: roquette
          label: Roquette
          detail: CMC and regulatory-registration collaborator
        - id: centers
          label: Treating centers
          detail: Intrathecal delivery and monitoring sites
        - id: leaders
          label: Key executives
          detail: Finance, regulatory, quality, and commercial leaders
        - id: families
          label: Families / caregivers
          detail: Need case management and travel-light support
        - id: competitors
          label: Approved NPC therapy vendors
          detail: Oral alternatives with support programs
      edges:
        - from: hercules
          to: beren
          label: capital
        - from: roquette
          to: beren
          label: CMC support
        - from: leaders
          to: beren
          label: execution
        - from: beren
          to: centers
          label: activation
        - from: centers
          to: families
          label: procedure access
        - from: competitors
          to: families
          label: choice set
        - from: beren
          to: families
          label: hub / case management
        - from: competitors
          to: beren
          label: launch pressure
    approximationNotes: The map emphasizes counterparties and delivery nodes that Beren does not fully control but must align.
    claimRefs:
      - CR016
      - CR024
      - CR027
      - CR029
      - CR030
      - CR031
      - CR032
      - CR041
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The call moves from a unicorn-adjacent financing benchmark through competition and financing leakage to a track
      recommendation.
    data:
      nodes:
        - id: financing
          label: Financing benchmark
          detail: $135M equity supports a roughly $0.9B-$1.35B sensitivity band depending on dilution
          tone: positive
        - id: proof
          label: Proof gap
          detail: Adrabetadex remains unapproved and commercialization is still framed as potential
          tone: warning
        - id: competition
          label: Competition
          detail: MIPLYFFA and AQNEURSA already serve NPC patients
          tone: warning
        - id: overhang
          label: Capital overhang
          detail: Debt draws and royalty obligations leak value from common equity
          tone: negative
        - id: decision
          label: 'Recommendation: Track'
          detail: Fair only near the lower end of the band; stretched above it without more proof
          tone: neutral
      edges:
        - from: financing
          to: decision
          label: Creates valuation anchor
        - from: proof
          to: decision
          label: Caps confidence
        - from: competition
          to: decision
          label: Compresses upside
        - from: overhang
          to: decision
          label: Reduces equity capture
    approximationNotes: Decision flow is qualitative and summarizes the evidentiary chain rather than assigning numeric probabilities.
    claimRefs:
      - CV014
      - CV028
      - CV029
      - CV032
      - CV036
      - CV039
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: Implied post-money valuation in USD billions from the $135M equity tranche under different dilution assumptions.
    data:
      items:
        - label: 25% dilution
          value: 0.54
          detail: Lowest reasonable late-stage case if investors demanded heavy dilution
          tone: negative
        - label: 20% dilution
          value: 0.675
          detail: Still below current Zevra public value only modestly
          tone: warning
        - label: 15% dilution
          value: 0.9
          detail: Lower-end unicorn-adjacent benchmark
          tone: neutral
        - label: 12% dilution
          value: 1.125
          detail: True unicorn benchmark with limited dilution
          tone: positive
        - label: 10% dilution
          value: 1.35
          detail: Upper-end band that needs strong approval and launch confidence
          tone: positive
    approximationNotes: >-
      Post-money equals the disclosed $135M equity raise divided by assumed dilution; the company did not disclose the
      actual dilution percentage.
    claimRefs:
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Public evidence supports a wide range because regulatory outcome and financing leakage matter as much as the
      headline raise.
    data:
      items:
        - label: Bear case
          low: 0.3
          mid: 0.45
          high: 0.6
          displayValue: $0.3B-$0.6B
          detail: Another delay, weak starts, or harsher financing leakage
          tone: negative
        - label: Base case
          low: 0.8
          mid: 0.95
          high: 1.1
          displayValue: $0.8B-$1.1B
          detail: Approval remains plausible but execution discounts remain material
          tone: warning
        - label: Bull case
          low: 1.2
          mid: 1.4
          high: 1.6
          displayValue: $1.2B-$1.6B
          detail: Approval on time plus smooth site-of-care build and early adoption
          tone: positive
    approximationNotes: >-
      Ranges are current valuation benchmarks, not exit values, and exclude undisclosed preference-stack effects that
      could further reduce common-equity returns.
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV039
      - CV046
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: Beren scores best on unmet need and optionality, but weakest on economics visibility and commercial proof.
    data:
      items:
        - label: Unmet need / market importance
          score: 4
          detail: NPC remains serious and orphan-positioned despite a narrow diagnosed pool
          tone: positive
        - label: Mechanism / differentiation
          score: 3
          detail: Adrabetadex retains a differentiated biology story, but it is not yet fully de-risked commercially
          tone: neutral
        - label: Regulatory optionality
          score: 3
          detail: Priority Review and Breakthrough help timing but do not guarantee approval
          tone: neutral
        - label: Commercial readiness
          score: 2
          detail: Support and site-of-care infrastructure are still being built in public materials
          tone: warning
        - label: Competitive position
          score: 2
          detail: Approved oral options already exist and narrow first-mover advantages
          tone: warning
        - label: Economics visibility
          score: 1
          detail: No disclosed equity price, launch price, revenue base, or gross-to-net bridge
          tone: negative
        - label: Valuation support
          score: 2
          detail: The financing implies a benchmark, but the public comps do not justify a large premium today
          tone: warning
    approximationNotes: Scores are 1-5 ordinal judgments synthesized from the public evidence set for investment-committee discussion.
    claimRefs:
      - CV025
      - CV028
      - CV029
      - CV032
      - CV037
      - CV038
      - CV039
