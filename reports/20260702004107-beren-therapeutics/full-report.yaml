  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, current therapy context, and what counts as spend
        blocks:
          - type: paragraph
            body: >-
              Beren’s useful market is much narrower than the headline orphan-drug market and narrower even than “all
              Niemann-Pick disease.” The relevant boundary starts with NPC-specific diagnosis, specialist evaluation,
              chronic supportive management, and therapy budgets tied to neurological manifestations and rapid pediatric
              decline. Today’s approved treatment market is defined by two oral products with different positioning:
              MIPLYFFA is FDA approved only in combination with miglustat, while AQNEURSA markets itself as the only
              FDA-approved stand-alone therapy. Both address neurological manifestations, which means current commercial
              spend is organized around specialist follow-up, family administration, and payer approval for
              symptom-focused care. Beren’s filing is narrower still because adrabetadex is aimed at infantile-onset
              NPC, not every diagnosed NPC patient. That keeps the addressable market ultra-rare by patient count, but
              also makes the unmet-need narrative sharper because the targeted subgroup is the fastest-progressing
              pediatric segment. The practical implication is that broad orphan-neuro totals are contextual only; the
              real market boundary is an NPC treatment-and-care pathway shaped by tiny volumes, severe burden, and a
              small number of specialized centers.
