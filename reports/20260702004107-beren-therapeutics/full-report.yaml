      - number: '1.4'
        title: Milestones, regulatory path, and the adverse signals that still matter
        blocks:
          - type: paragraph
            body: >-
              The adrabetadex timeline is long enough now that Beren's current position should be read as a
              rehabilitation-and-launch story, not as a fresh platform reveal. Mandos acquired the asset in 2021, Beren
              says it worked with FDA during 2022 on the external-control survival methodology, and the company kept the
              expanded-access program and community communication cadence alive through 2023, 2024, and 2025. In
              September 2024, Mandos said FDA had accepted a Type C meeting request and that RUSH EAP eligibility
              expanded to patients from 3 months through 25 years of age. In December 2025, Beren won a new Breakthrough
              Therapy Designation and submitted the NDA. In February 2026, FDA accepted the filing for Priority Review
              with an original August 17, 2026 PDUFA date.


              The positives are real: Beren now has an accepted NDA, a visible medical-affairs surface, more than 60
              patients publicly described in the EAP, and evidence of pre-launch organizational buildout. But the
              adverse signals are just as important to preserve. The same Breakthrough materials acknowledge that
              adrabetadex had received Breakthrough status in 2016 under a prior sponsor and later lost it after
              12-month phase 2b/3 data. Then, in May 2026, FDA extended the current review to November 17, 2026 after
              treating Beren's response to an information request as a major amendment. FierceBiotech also highlighted
              broader FDA skepticism toward external-control filings, which is especially relevant because Beren's
              efficacy narrative depends heavily on that methodology.


              The context around the disease has changed as well. NPC is a severe, often life-threatening
              cholesterol-trafficking disorder, and the category now has approved therapies: FDA approved Miplyffa in
              2024, while AQNEURSA markets itself as the only FDA-approved stand-alone NPC therapy. Beren's launch
              narrative therefore cannot be "first NPC therapy." It is narrower and more specific: a potential first
              cholesterol-trafficking-targeted therapy for infantile-onset NPC, backed by a patient-support model that
              the company claims has been built alongside the community since 2021.
