companyProfile:
  summary: >-
    Beren Therapeutics is a Thousand Oaks, California public-benefit biotech built around cyclodextrin-based medicines
    for diseases of impaired cholesterol trafficking. Its lead and only publicly named advanced asset is adrabetadex, an
    intrathecal hydroxypropyl-β-cyclodextrin therapy under FDA Priority Review for infantile-onset Niemann-Pick disease
    type C. Founder and CEO Jason Camm has assembled a senior team with rare-disease regulatory, medical, commercial,
    and CMC experience, and the company has supported patients through expanded access since 2021. The main investment
    tension is that Beren now has real launch financing and regulatory optionality, but still discloses very little
    about priced valuation terms, revenue model realization, manufacturing scale, or broader post-adrabetadex pipeline
    depth.
  foundedDate: '2020-01-01'
  founders:
    - name: Jason Camm
      role: Founder, Director, President & CEO
      background: >-
        Former founder and general partner of Thiel Bio Fund and managing director/chief medical officer at Thiel
        Capital.
      claimRefs:
        - CO006
  foundingLocation: Thousand Oaks, California, US
  headquarters: Thousand Oaks, California, US
  productSummary: >-
    Adrabetadex is an investigational intrathecal 2-hydroxypropyl-β-cyclodextrin therapy intended to restore
    intracellular cholesterol trafficking in infantile-onset NPC; Beren frames it as the first step in a broader
    cholesterol-trafficking platform, but has not publicly enumerated a diversified follow-on pipeline.
  customerFocus: >-
    Infantile-onset NPC patients and families, metabolic neurologists, rare-disease treatment centers, payers, and
    advocacy organizations involved in diagnosis, access, and long-term care.
  businessModel: >-
    Pre-revenue today; if approved, economics would come from ultra-rare therapy sales for adrabetadex plus possible
    future ex-US partnerships, adjacent pipeline expansion, and broader patient-support or evidence-generation
    infrastructure.
