    rows:
      - - NPC1 / NPC2 cholesterol-trafficking biology
        - Defines the disease mechanism adrabetadex is trying to bypass or restore
        - Correct interpretation of lysosomal cholesterol sequestration and infantile NPC pathobiology
        - If mechanistic translation is overstated, disease-modifying narrative weakens
      - - HPβCD isomer mixture (adrabetadex)
        - Active therapeutic intended to mobilize intracellular cholesterol
        - Formulation consistency and delivery suitability for intrathecal use
        - Public pack does not disclose commercial formulation or release details
      - - Intrathecal / central administration
        - Places drug directly into the CNS-relevant compartment and links route to target engagement
        - Specialized clinicians, lumbar or central dosing workflow, and family tolerance for repeat procedures
        - Procedure burden can constrain adoption even if efficacy is meaningful
      - - Evidence engine
        - Combines phase 1/2a, phase 2b/3, EAP, external controls, and biomarkers into a registrational story
        - Natural-history datasets, patient registries, longitudinal follow-up, and rigorous matching methodology
        - External-control dependence remains a regulatory and payer vulnerability
      - - Safety and monitoring loop
        - Audiology, fatigue/ataxia assessment, and clinician oversight support repeat dosing
        - Reliable hearing surveillance and multidisciplinary rare-disease centers
        - Inadequate monitoring would directly erode product tolerability
      - - Manufacturing / regulatory partner layer
        - Roquette collaboration and FDA interaction support CMC and review execution
        - Partner execution, documentation quality, and agency responsiveness
        - Beren may orchestrate more of this layer than it fully owns end to end
    notes: >-
      This architecture synthesizes company, literature, and regulatory sources rather than reproducing a single
      published system diagram.
