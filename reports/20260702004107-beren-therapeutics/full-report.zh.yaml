    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围和资产地图
        blocks:
          - type: paragraph
            body: >-
              对一家以平台包装的生物技术公司来说，Beren 的公开产品界面异常集中。贯穿公司、科学、患者和医学事务页面，具名交付物都是面向婴儿期起病 Niemann-Pick C 型病的 adrabetadex；该项目经
              Mandos 推进，并由一个早于当前 NDA 的扩大使用项目支撑。公司反复描述更宽的胆固醇转运和衍生化环糊精平台，但已审阅材料包没有识别第二个具名临床资产、独立开发候选，或可脱离 adrabetadex/NPC
              叙事单独成立的模块化软件产品。因此，产品地图看起来更像分层栈，而不是宽组合：一个领先临床资产、围绕该资产的一套给药和患者支持动作，以及一个未来可能扩张但尚未以同等方式公开列举的科学平台假说。medical.berentx.com
              界面和反复出现的大会活动增加了面向从业者的可信度，但它们强化的是 adrabetadex 的中心地位，而不是证明宽管线广度。这种集中加重了单资产风险。
