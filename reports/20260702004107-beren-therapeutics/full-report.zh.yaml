      - number: '2.3'
        title: 超罕见病市场中的买方、用户、支付方和采用路径
        blocks:
          - type: paragraph
            body: >-
              NPC 采用不是典型的宽处方生物医药上市。关键处方者和流程主导者集中在代谢、遗传和神经专科中心；家庭和照护者承担大量日常给药和支持负担；支付方或卫生系统通过报销、护理地点批准和患者服务协调来塑造准入。NORD
              的治疗指南清楚说明，NPC 照护已经跨越许多专科；Beren
              自己的支持材料也反复强调加速诊断、本地护理地点可及性、报销导航，以及为家庭提供单一联络点。这个组合意味着“买方”其实是一个联盟：医生或中心决定临床适配，照护者决定这段旅程是否可承受，支付方决定物流和覆盖是否可行。早诊的重要性也改变了采用经济学。即便产品有强生物学逻辑，只要医生没有怀疑
              NPC，生物标志物或基因检查被延迟，或中心没有准备好快速行动，产品仍会错过患者。实践中，从症状到治疗是一条窄漏斗；识别、检测、专科转诊和支持基础设施至少和推广触达同样重要。
