      - number: '7.3'
        title: 已获批口服疗法设定参照点，商业采用风险随之上升
        blocks:
          - type: paragraph
            body: >-
              Beren 不再是把 adrabetadex 带进一片空白市场。FDA 2024 年批准 Miplyffa，作为首个 NPC 治疗药物；AQNEURSA 现在则把自己定位为唯一可独立使用、获 FDA 批准治疗
              NPC 神经系统表现的疗法。两条竞品产品线已经在 adrabetadex 上市前，定义了医生对便利性、支持服务和持续安全管理的预期。它们的标签也有战略意义：两者确实都有警示，但毕竟是口服疗法，而
              adrabetadex 仍处于研究阶段且需鞘内给药。这个反差抬高了 Beren 的证明门槛：任何疾病修饰优势都必须足够大，才能抵消操作物流、旅行、监测和 hub 复杂度。竞争因此不只是科学之争。Miplyffa
              已经在推广报销和履约支持，孤儿药市场增长本身也不再享有过去那样的溢价扩张。如果上市数据或支付方叙事只比现有选项略好，后进入叠加更高服务强度，可能同时压缩采用、利润率和投资者信心。
