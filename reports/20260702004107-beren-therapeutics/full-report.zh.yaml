      - number: '1.3'
        title: 资本结构、具名利益方和披露边界
        blocks:
          - type: paragraph
            body: >-
              Beren 最具体的公开规模信号是 2026 年 6 月 10 日融资。公司宣布合并资本 $300M，其中 $135M 为股权，最高 $165M 为非稀释资本。股权财团点名 Wellington
              Partners、JIC Venture Growth Investments、Founders Fund、Narya Capital、Eisai 及其他机构投资人；Hercules Capital
              则提供债务与销售分成融资安排。Hercules 结构重要，因为它显示 Beren 在潜在上市前试图保留上行，而不是只依赖股权：该设施包括基于里程碑的定期贷款，公告时仅提取
              $30M，另有一档销售分成资金会在获批后到账。


              这笔资本直接绑定上市和支持假说，而不是抽象的资产负债表可选性。官方资金用途强调加速诊断、为家庭设置单一联络点、扩大护理地点可及性、生成真实世界证据，以及连接社区。这契合 Beren
              的公益定位，也契合公司反复试图在长期家庭支持上与分子主张同等差异化的做法。2023 年 Roquette 的早期战略投资又补上一个有用的资本和合作数据点，因为在 2026 年融资到来之前，它已经把 Beren
              的环糊精平台叙事连到了制造和 CMC 导向的产业伙伴。


              最大保留项是披露深度。公开材料在具名融资金额和利益方名称上很强，但在经典投资人封面指标上很弱：留存材料包里没有公开估值标记，没有收入运行率，没有客户数，也没有员工人数披露。因此，从承销角度看，公开记录更有力地证明了资本可得性，而不是运营规模。
