      - number: '3.3'
        title: 相邻罕见病标杆显示，直接 NPC 战场上方还有多少规模
        blocks:
          - type: paragraph
            body: >-
              直接 NPC 竞争只是承销问题的一部分。判断护城河耐久性，更好的标杆是那些已经把专门科学转成可复制商业基础设施的罕见病公司。Zevra 本身只是部分标杆，市值约
              $0.81B，但即便它也远超一个私营单资产上市故事。Ultragenyx 描述了最大且最多元的罕见病管线之一，并扩张商业和医学事务团队；Amicus 仍是数十亿美元级罕见病同业；BioMarin 称其已有 9
              款商业化疗法；Biogen 将罕见病与更大规模的神经科学基础设施结合；Krystal 则把商业化与自有 GMP 设施配在一起。这些公司都不是直接 NPC
              替代品，但它们共同定义了科学必须由制造、现场和医学系统支撑之后，耐久孤儿病执行可以长什么样。


              这些标杆重要，因为 Beren 的护城河很可能不会只来自疾病独占性。Evaluate
              的孤儿药报告仍描述了一个庞大且增长中的市场，但也指出该类别的增长优势正在收窄。换句话说，罕见病仍有足够商业吸引力，会把资本和有能力的进入者拉进来；同时，政策和报销压力让单产品故事更难防守。对 Beren
              来说，这意味着 adrabetadex 的投资案不仅要经得起当前 NPC 标签的比较，也要经得起更广义成功罕见病业务体系所要求的运营成熟度比较。
