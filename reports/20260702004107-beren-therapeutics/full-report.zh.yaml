  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 当前估值 / 状态
      - 重要性
      - 与 Beren 的局限
    rows:
      - - Beren Therapeutics
        - 2026 年 6 月融资隐含的私募基准：基准约 $0.8B-$1.1B；只有在稀释较低时才达到独角兽级别
        - 标的公司；锚点来自当前融资，而不是陈旧轮次
        - 具体股权价格、资本表条款和收入画像未披露
      - - Zevra Therapeutics
        - ~$0.81B 公开市值；在 NPC 销售 MIPLYFFA
        - 最接近的疾病特定公开基准，因为它已把获批 NPC 疗法商业化
        - 公开市场折价和获批产品经济账，不等同于私营公司获批前轮次
      - - Ultragenyx
        - ~$3.18B 公开市值
        - 罕见病专科公司的上限参照，已有多元化管线和基础设施
        - 组合和运营基础远比 Beren 宽
      - - Amicus Therapeutics
        - ~$4.54B 公开市值
        - 另一个商业化罕见病基准，用于判断规模和耐久性
        - 已商业化，并且多元化程度超过单个近期开启上市的产品
      - - Krystal Biotech
        - ~$10.95B 公开市值
        - 显示市场如何奖励已有商业化证明和制造能力的罕见病公司
        - 技术路径不同，风险释放远强于 Beren
      - - BioMarin
        - ~$11.17B 公开市值
        - 商业化罕见病龙头；可作为上限背景点
        - 收入基础和多产品组合大得多
      - - Biogen
        - ~$30.96B 公开市值
        - 为神经疾病和罕见病宽度提供规模参照
        - 过于多元，不能作为直接估值可比
      - - Sarepta Therapeutics
        - ~$1.92B 公开市值，2024 年曾高得多
        - 下行类比，显示执行冲击后情绪会如何压缩
        - 疾病组合和事件路径不同；用于风险框架，而非直接定价
    notes: 该表是 2026 年 7 月用于框定 Beren 当前基准的一组代表性公开可比公司，并非穷尽；规模更大的多元化公司是上限背景，不是直接可比公司。
    enumerationScope:
