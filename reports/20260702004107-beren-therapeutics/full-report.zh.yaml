  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、现有治疗语境，以及哪些支出算在内
        blocks:
          - type: paragraph
            body: >-
              Beren 的有效市场远窄于头部孤儿药市场，甚至也窄于“所有 Niemann-Pick 病”。边界从 NPC
              特异诊断、专科评估、慢性支持性管理开始，并延伸到与神经系统表现和儿童快速衰退绑定的治疗预算。今天的获批治疗市场由两款定位不同的口服产品定义：MIPLYFFA 仅获 FDA 批准与 miglustat
              联合使用，AQNEURSA 则把自己营销为唯一 FDA 批准的独立疗法。两者都处理神经系统表现，这意味着当前商业支出围绕专科随访、家庭给药，以及支付方批准症状导向护理来组织。Beren 的申报更窄，因为
              adrabetadex 瞄准的是婴儿期起病 NPC，而不是每一个已诊断 NPC
              患者。这让可触达市场按患者数看仍是超罕见，但未满足需求叙事也更锋利，因为靶向亚群是进展最快的儿童人群。实际含义是，宽口径孤儿神经疾病总量只能作背景；真实市场边界是一条 NPC
              治疗与照护路径，由极小量级、沉重疾病负担和少数专科中心塑造。
