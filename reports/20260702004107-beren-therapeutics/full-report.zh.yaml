        - 支持治疗，加上已获批口服 NPC 方案；口服方案并非围绕婴儿起病型的鞘内胆固醇转运恢复来设计
        - 通过临床研究 / EAP / 潜在 NDA 路径递送的鞘内 adrabetadex
        - 外部对照生存分析报告 5 年生存率为 84%，对照组为 42%，死亡风险降低 71%
        - 收益来自非随机生存比较，且给药具有侵入性
      - - 追踪疗法是否触达底层生物学机制
        - 单靠临床观察可能漏掉机制性靶点作用
        - CSF 和血浆生物标志物，包括 24(S)-OHC 以及神经元损伤蛋白
        - Beren 报告 CSF 24(S)-OHC +27.7%，calbindin D / FABP3 下降
        - 生物标志物分析来自子集，而非全试验人群
      - - 延缓婴儿型人群的神经功能下降
        - 自然病程严重，早发通常预示更差结局
        - 围绕行走、语言、精细运动和吞咽的四领域神经功能随访
        - ACMG 数据报告，52 周内年化进展低 43%
        - 公开材料未披露完整患者级耐久性表
      - - 商业化批准前维持用药可及
        - 家庭否则只能依赖试验、对症治疗或已获批口服药
        - Mandos / Beren 运营的扩大用药项目
        - 支持治疗连续性，并让 Beren 积累交付经验
        - 公开记录未显示 EAP 地域、站点容量或运营流失
      - - 围绕患者需求叠加治疗选择
        - 医生目前在标签和安全性不同的口服 NPC 疗法之间选择
        - APMRF 材料将 adrabetadex 描述为可能与口服疗法并行的基础性治疗
        - 可能支持机制互补的联合用药范式
        - 当前联合证据仍是早期、海报级，尚无标签背书
    notes: 收益来自已披露研究摘要；获批前不应读作商业标签声明。
