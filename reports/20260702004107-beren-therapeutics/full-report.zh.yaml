      - number: '1.2'
        title: 领导团队厚度、治理可见度和关键人集中
        blocks:
          - type: paragraph
            body: >-
              公开领导团队是 Beren 故事里更让人安心的部分之一。Jason Camm 仍然是明确重心，身兼创始人、董事、总裁和 CEO，但团队页面显示，他身边并不是单薄的创始人外壳，而是已有真实职能厚度。Aaron
              Ondrey 以 CFO 身份带来大型公司财务和交易经验；Alex Gold 以 CMO 身份压住临床和监管执行；Jennifer Spinella 覆盖监管和质量；Irene von Hennigs
              负责医学事务；Bennett Smith 负责首次上市的商业规划；Rajinder Singh 覆盖科学；Magali Hickey 覆盖技术运营和 CMC；Heather McCuen 覆盖人事；Peter
              Cicala 覆盖法律和 IP；Cathy Traz 覆盖患者和社区参与。对一家准备潜在首次上市的私营罕见病公司来说，这比最低配置完整得多。


              需要警惕的是，公开治理披露落后于公开领导披露。已审阅的官方界面清楚标出 Jason
              是董事，但没有公布更完整的当前董事会名单、委员会结构，或所有权与控制权地图。也就是说，投资人能看到日常职能由谁负责，却还看不到上层正式治理如何分配。Jason
              也仍是融资、监管和社区沟通中的主要公开叙述者，这强化了创始人连续性，也提示关键人依赖。换句话说，Beren 在运营上不像一人创业公司那么薄，但从治理视角看，公开披露仍比成熟机构化公司更集中于创始人。
