  - id: TV005
    title: 投资主张破裂与否决触发表
    columns:
      - 触发信号
      - 阈值或事件
      - 对投资主张的传导
      - 行动含义
    rows:
      - - 监管延误 / CRL
        - 再次出现重大 FDA 延误、CRL 或明显更弱的标签
        - 削弱 Beren 配得上独角兽级基准的概率
        - 从跟踪转向回避，直到估值重置或新证据出现
      - - 上市启动不及预期
        - 即使 Beren 铺开，早期合格起始患者仍偏向 MIPLYFFA 或 AQNEURSA
        - 支持项目建设从护城河变成追赶
        - 下调基准区间，承诺资本前要求更硬证据
      - - 结构化资本恶化
        - 产品起量前，新资本带来更多版税漏损或稀释性股权
        - 即使产品获批，也会压低普通股上行空间
        - 要求更低入场价，或直接放弃
      - - 定价 / 报销不及预期
        - 总价到净价折扣或支付方摩擦让经济账弱于隐含假设
        - 基准情景不再像能自我支撑
        - 把估值转向悲观情景
      - - 中心准备不足
        - 诊疗点铺开落后于上市雄心
        - 在本就狭窄的市场里延迟采用
        - 将任何高端估值视为缺乏支撑
    notes: 否决触发信号刻意设计成可监控项，因此事实格局一变，建议就能快速修订。
    claimRefs:
