      - - 即使成功上市，债务和版税资本也会把价值从普通股中抽走。
        - 反方
        - 契约和版税负担若轻于担忧，或定价能力强得多，就能缓释压力。
      - - 公开罕见病可比公司已经说明，多元化商业平台值多少钱。
        - 反方
        - 更便宜的入场价格，或新的证据证明 Beren 值得可比公司溢价，会改善投资条件。
