  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、信心、风险和估值立场
        blocks:
          - type: paragraph
            body: >-
              Beren 披露的 2026 年 6 月融资很重要，因为它在没有真正披露定价轮的情况下，给市场提供了一个真实且近期的估值线索。套餐规模达到 $300 million，但其中只有 $135 million
              是股权；其余是与里程碑挂钩的债务和版税资本。这意味着，最干净的估值读数不是把整个标题金额资本化，而是对股权部分做敏感性测试。按这个口径，当前私有市场基准大致接近独角兽：若稀释 15%，约为 $0.9
              billion；若稀释 12%，约为 $1.125 billion；若稀释 10%，约为 $1.35
              billion。这些都是可能成立的后期私有市场标记，但对一家首要资产尚未获批、公开记录仍把商业化描述为潜在机会、且尚未通过披露收入、定价或 gross-to-net
              数据呈现经济性的公司来说，并不便宜。因此建议是跟踪。信心为中等而非高，因为即便确切股权条款未知，判断方向已经清楚。风险仍高；估值只有在隐含区间低端附近才算合理，高于约 $1.2 billion 就显得偏紧。
