      - number: '8.5'
        title: 止损触发、最终尽调问题，以及什么会改善判断
        blocks:
          - type: paragraph
            body: >-
              在这里最容易失去纪律的做法，是把融资标题当作估值问题已经解决的证据。事实并非如此。真正决定当前私有标记是否合理的，是那些仍未解决的问题：股权投资者支付的每股价格、排在普通股之前的清算优先权和反稀释权、未提取债务受哪些契约约束、不同地区下真实适用的版税瀑布，以及管理层用来论证可自我维持商业化的定价加患者启动假设。另一个明确止损触发来自监管：如果
              FDA 再次出现重大延迟，或标签结果削弱 Beren 的差异化，区间会迅速压缩。商业止损触发同样重要。如果已获批口服竞品及其现有支持生态主导早期起始治疗，Beren
              的服务建设看起来就更像追赶，而不是护城河。只有在入场价格移向区间低端，或尽调回答这些未决经济性问题且保留当前获批可选性时，这个判断才会改善。
