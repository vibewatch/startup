      - number: '5.2'
        title: 机制、给药途径和证据包
        blocks:
          - type: paragraph
            body: >-
              Adrabetadex 被呈现为一次机制靶向尝试，目标是在 NPC
              中恢复细胞内胆固醇转运，而不是作为症状性口服疗法。把给药途径连接到机制的证据基础强于许多早期罕见病项目：小鼠和猫的临床前工作显示环糊精介导的神经保护和寿命延长；NIH/Rush 1/2a
              期鞘内研究使用血清和脑脊液 24(S)-hydroxycholesterol 以及 CSF 蛋白生物标志物作为靶点作用信号；后来 Beren 分析又把同一路径连到外部对照生存、4
              领域疾病进展和神经元损伤生物标志物结果。公开层面，给药途径之所以重要，是因为 Beren 要求临床医生和家庭接受腰穿或中枢给药疗法，以换取一个面向快速致死婴儿人群的疾病修饰主张。相较于现在已获批的口服 NPC
              药物，这是差异化命题；但它也意味着产品价值取决于程序负担、监测需求和基于外部对照的疗效叙事，在 FDA 和商业审视下是否仍有说服力。
