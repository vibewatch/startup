        - 市值 $4.54B；聚焦罕见病的上市公司
        - 罕见病临床医生、患者和支付方
        - 狭窄适应症中可持续公开市场支持的基准
        - 保留材料包中关于当前产品组合的官方细节稀少
      - - BioMarin
        - 相邻罕见病基准
        - 九款商业化疗法，外加强临床和临床前管线
        - 基因定义罕见病患者和专家
        - 展示孤儿药生物技术公司反复商业化的样子
        - 不针对 NPC 或胆固醇转运生物学
      - - Biogen
