      - CV040
      - CV041
      - CV042
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 股权定价和投后估值
        - 2026 年 6 月股权分期的股价、完全稀释投后估值和优先权结构
        - 决定当前基准是合理还是已经偏高
        - 向管理层索取融资材料、资本表和最终协议
      - - 债务契约和提款
        - 里程碑测试、契约组合和未提款额度条件
        - 决定资本是真能动用，还是只是账面承诺
        - 审阅 Hercules 信贷协议和董事会材料
      - - 版税瀑布
        - 地域排除、上限、阶梯下调和控制权变更处理
        - 直接影响成功情景下普通股上行空间
        - 索取版税协议摘要和律师备忘录
      - - 定价和报销模型
        - 假设净价、患者援助和总价到净价桥
        - 判断商业化能否自我支撑需要这些信息
        - 索取上市模型和支付方策略材料
      - - 初始患者启动证据
        - 中心准备度、家庭交接和早期需求指标
        - 显示 Beren 能否在口服竞争和既有支持体系下胜出
        - 索取上市准备仪表盘和外勤计划
      - - 标签和采用敏感性
        - 窄标签或较慢采用下的情景分析
        - 解释价值会多快从乐观降到基准或悲观
        - 用公开基准区间检验管理层敏感性情景
    notes: 这些问题聚焦融资标题背后的隐性经济账；澄清这些问题，建议才会从跟踪转向更高确信。
    claimRefs:
      - CV037
      - CV043
      - CV046
