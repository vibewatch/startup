  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设
      - 估值 / 回报逻辑
      - 概率信号
    rows:
      - - 乐观
        - 在延长后的 2026 年日期前获批，婴儿发病型 NPC 的差异化保住，诊疗点爬坡顺利。
        - $1.2B-$1.6B 基准；投资者押注溢价上市轨迹，融资漏损可控。
        - 有可能，但需要监管成功，也需要早期采用清晰可见。
      - - 基准
        - 获批仍有可能，但上市爬坡会偏审慎，竞争和结构化资本压住价值。
        - $0.8B-$1.1B 基准；大致接近独角兽，但不该明显高于此。
        - 最符合当前证据组合。
      - - 悲观
        - 再度延期、标签不及预期、起始患者弱，或融资条款更紧。
        - $0.3B-$0.6B 基准；一旦市场怀疑审批或上市匹配度，下行会比上行走得更快。
        - 实质性风险，因为多道关口仍未解。
    notes: 情景区间是来自公开融资和可比背景的当前估值基准，不是管理层指引或 DCF。
