      - number: '7.2'
        title: 安全监测和鞘内给药造就高接触运营模式
        blocks:
          - type: paragraph
            body: >-
              即便 adrabetadex 获批，Beren 仍必须在一个照护者负担很重的微型儿科人群中商业化鞘内疗法。公司材料和海报预告一直把 adrabetadex 描述为鞘内给药，而已发表的 HPβCD
              文献反复把听力负担列为治疗的经常性成本。2017 年鞘内研究记录了所有参与者出现听力损失；猫科动物论文把 HPβCD
              与剂量依赖性阈值上升关联起来，并建议做听力检测；长期病例报告显示，即便更广泛的神经评分稳定，听力仍被单独纳入监测轨道。Beren
              也披露，听力损害、给药后疲劳和共济失调是主要不良事件。这些并不让项目失去可行性，但意味着商业化离不开中心启动、减少旅行、病例管理、听力学流程和持续的扩大使用义务。Beren
              自己的社区和融资更新其实也承认了这一点：公司把本地治疗站点、家庭支持和真实世界证据收集强调为上市前提，而不是锦上添花的服务。
