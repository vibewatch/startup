      - number: '3.4'
        title: 护城河耐久性取决于先证明疾病修饰价值，再赶在服务和规模差距收拢之前站稳
        blocks:
          - type: paragraph
            body: >-
              Beren 最可防守的楔子不是便利性、监管领先或当前商业触达。基于公开证据，公司最强论点是：与获批口服选项相比，adrabetadex 在机制上更接近底层胆固醇转运病理，也更贴合快速进展的婴儿期起病
              NPC。同一份来源包也显示了这个楔子为何脆弱。Zevra 已有美国首个获批标签、已上市支持平台和上市公司融资渠道；AQNEURSA 作为独立口服疗法，拥有最简单的日常标签姿态；Cyclo
              也继续维持第二个环糊精项目。也就是说，Beren 正试图用更高价值的临床定位取胜，但起点上的现有商业便利性准备更弱。


              负面证据让耐久性论证保持诚实。FierceBiotech 报道，重大修正案后 FDA 审评延后 3 个月，提醒投资人该项目的监管路径仍在推进，并未因获批而去风险化。Fierce
              也回顾了该资产在前所有者手中的早期临床挫折，这让 Beren 当前由赞助方呈现的生存和进展数据重要，但不具决定性。最后，美国已诊断或已治疗 NPC
              人群极小，意味着掌控倡导关系、专科中心和准入流程，可能和增量疗效同样重要。Beren
              可以有理由主张一个差异化角色，甚至可能作为与口服产品叠加的基础疗法，但尚未证明头对头优势、上市牵引或报销杠杆足以支撑耐久护城河。
