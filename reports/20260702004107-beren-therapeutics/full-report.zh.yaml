      - number: '1.4'
        title: 里程碑、监管路径，以及仍然重要的负面信号
        blocks:
          - type: paragraph
            body: >-
              Adrabetadex 时间线现在已经足够长，Beren 当前位置应被理解为修复加上市的故事，而不是新的平台亮相。Mandos 于 2021 年收购该资产；Beren 称其在 2022 年与 FDA
              就外部对照生存方法学合作；公司在 2023、2024 和 2025 年持续维持扩大使用项目和社区沟通节奏。2024 年 9 月，Mandos 称 FDA 已接受 Type C 会议请求，且 RUSH EAP
              资格扩展至 3 个月到 25 岁患者。2025 年 12 月，Beren 获得新的突破性疗法认定，并提交 NDA。2026 年 2 月，FDA 接受申报并给予优先审评，原始 PDUFA 日期为 2026 年 8
              月 17 日。


              积极面是真实的：Beren 现在有已受理 NDA、可见的医学事务界面、公开描述中超过 60 名 EAP 患者，以及上市前组织搭建证据。但负面信号同样必须保留。同一组突破性疗法材料承认，adrabetadex 曾在
              2016 年由前赞助方取得突破性疗法资格，后来在 12 个月 2b/3 期数据后失去该资格。随后，2026 年 5 月，FDA 将 Beren 对信息请求的回复视为重大修正案，把当前审评延长到 2026 年 11
              月 17 日。FierceBiotech 还强调了 FDA 对外部对照申报更广泛的怀疑；这一点尤其重要，因为 Beren 的疗效叙事高度依赖该方法学。


              疾病背景也变了。NPC 是一种严重、常常危及生命的胆固醇转运障碍，而该类别现在已有获批疗法：FDA 于 2024 年批准 Miplyffa，AQNEURSA 则把自己营销为唯一 FDA 批准的独立 NPC
              疗法。因此，Beren 的上市叙事不能是“首个 NPC 疗法”。它更窄，也更具体：一种潜在的、首个面向婴儿期起病 NPC 且靶向胆固醇转运的疗法，背后是公司声称自 2021 年以来与社区共同搭建的患者支持模型。
