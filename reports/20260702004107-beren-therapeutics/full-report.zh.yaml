      - number: '2.2'
        title: 流行病学视角、婴儿期亚群严重性，以及 SAM 为何仍受约束
        blocks:
          - type: paragraph
            body: >-
              公开患者数足以说明 NPC 真实、临床重要且极小，但不足以算出干净的婴儿期起病 SAM。本地语料中最强的美国患病率来源发现 294 名已诊断 NPC 患者和 305
              名已诊断或已治疗患者；同一研究也估计，若认知和诊断改善，患病病例约为 943 例。这个缺口比绝对数字更重要，因为它说明诊断捕获本身就是核心市场规模变量。同一研究估计美国每年约 42 个新病例；NORD 则把
              NPC 发病率定位在每 100,000 到 120,000 个活产中约 1 例，并强调许多患者被漏诊或误分类。Beren 材料进一步把假说收窄到婴儿期起病疾病，即 6
              岁前出现神经系统起病；更早起病的结局尤其差：早发婴儿型平均死亡年龄约 5.6 岁，晚发婴儿型约 13.4 岁。这些数据支撑了高紧迫性的商业故事，但没有揭示模型中的 943
              名美国患病患者里有多少落入已申报的婴儿期亚群。因此，本市场章节使用受证据约束的患者视角，而不是假装仅靠公开来源就知道自下而上的 adrabetadex SAM。
