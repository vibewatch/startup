      - number: '3.2'
        title: 能力、包装和转换成本差异集中在给药途径、伴随疗法和服务
        blocks:
          - type: paragraph
            body: >-
              最大的实际竞争差异不是细微的生物标志物差别，而是每个选项要求家庭和站点吸收的治疗体验。MIPLYFFA 和 AQNEURSA 都是口服疗法；MIPLYFFA 增加了 miglustat 要求，AQNEURSA
              则营销独立标签和可经口或 G-tube 按体重给药的混悬剂格式。相比之下，Beren 卖的是一个鞘内环糊精故事，目标是在婴儿期起病 NPC
              中更直接恢复胆固醇转运。这带来更侵入性的给药画像，且很可能意味着更窄的护理地点网络；但它也支撑了 Beren 最强的差异化主张，因为获批口服选项围绕神经系统表现，而不是同一给药路径或机制假说。


              在超罕见病里，包装和支持经济性几乎和标签语言同样重要。Zevra 的公开支持材料已经宣传 MIPLYFFA 的教育、覆盖支持、准入支持和履约帮助。Beren
              自己的社区更新称，公司正于获批前搭建诊断支持、个案管理、站点网络、真实世界证据循环和同伴连接。但整个留存材料包的公开价格透明度都很弱：品牌和参考页面披露给药日程、副作用警示和支持项目，却没有直接的标价或净价。因此，转换成本今天很可能更多由医生熟悉度、专科站点物流、准入服务和家庭负担决定，而不是由任何公开可见的
              WAC 对比决定。
