              材料已经暗示分层治疗范式，这在战略上可能聪明，但也让标签、报销和医生采用问题更复杂。2022
              年以来的路线图显示，公司在方法学、数据披露、监管认定、融资和医学社区参与上执行认真；但剩余技术风险集中在三处：外部对照证据未必能干净转化为完全获批或标签广度；商业化鞘内部署可能比试验或 EAP
              使用更窄；公开披露仍未证明 Beren 更宽的环糊精平台已经成熟为 adrabetadex 之后的多元化管线。
