          high: 1.6
          displayValue: $1.2B-$1.6B
          detail: 按时获批，治疗点建设顺利，早期采用跑通
          tone: positive
    approximationNotes: 区间是当前估值基准，不是退出价值；未披露的优先权结构影响未纳入，普通股回报可能因此进一步降低。
    claimRefs:
      - CV033
      - CV034
