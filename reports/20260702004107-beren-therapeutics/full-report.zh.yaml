      - number: '5.3'
        title: 安全、质量和制造依赖
        blocks:
          - type: paragraph
            body: >-
              核心技术风险不是 adrabetadex 能否到达 CNS，而是鞘内 HPβCD 的获益风险画像能否在规模化时被运营好。人类和动物文献都指向听觉毒性或听阈变化这种反复出现的类别效应，Beren
              自己的摘要现在也把听力损害、给药后疲劳和共济失调列为主要不良事件。原则上这些可以管理，但只能嵌在一个拥有可靠听力学监测、专门给药中心，以及家庭愿意承受重复程序的产品系统里。因此，公开质量信号更多是临床和监管，而不是数字化：超过
              10 年的项目历史、扩大使用经验、突破性疗法和优先审评里程碑，以及一个明确提到化学、制造与控制、安全协议和监管注册的 Roquette
              合作。缺失的是商业级供应图景：制剂细节、制造站点版图、放行标准、放大状态，以及 CMC 负担中究竟有多少由 Beren 控制、多少由伙伴控制。
