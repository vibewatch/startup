      - number: '2.4'
        title: 增长驱动、采用约束和必须保留的矛盾
        blocks:
          - type: paragraph
            body: >-
              尽管规模很小，这个市场仍有真实增长驱动。两款获批疗法提高了疾病可见度，Beren 的婴儿期起病申报加入了疾病修饰叙事，孤儿药资本市场仍能支持很小但医学上紧迫的类别。Beren
              近期融资、社区项目和医学事务界面都表明，公司正围绕罕见病准入而不是大规模推广来搭建商业化。但约束同样重要。诊断延迟是结构性问题，adrabetadex 的 FDA
              审评时钟已经因重大修正案后移，公开定价或支付方政策数据仍然太薄，无法支撑可靠的收入 SOM。治疗格局也必须谨慎描述，不能压平成一句标题。MIPLYFFA 已获 FDA 批准；AQNEURSA
              官方声称是唯一获批独立疗法；Beren 称 adrabetadex
              将是唯一直接靶向胆固醇转运的疗法。这三句话并不相同，也不应被“整理”为单一营销话术。它们意味着未来采用可能按年龄、给药途径和机制分段，在部分患者中还可能是叠加治疗，而不是赢家通吃。因此，孤儿药市场总量可作为估值背景，但不能替代疾病特异采用工作。
