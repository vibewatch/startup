      - CV039
      - CV046
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Beren 在未满足需求和可选性上得分最高，但在经济性可见度和商业证据上最弱。
    data:
      items:
        - label: 未满足需求 / 市场重要性
          score: 4
          detail: NPC 仍是严重疾病且具备孤儿药定位，尽管确诊池很窄
          tone: positive
        - label: 机制 / 差异化
          score: 3
          detail: adrabetadex 保留差异化生物学故事，但商业风险尚未完全解除
          tone: neutral
        - label: 监管可选性
          score: 3
          detail: Priority Review 和 Breakthrough 有助于节奏，但不保证获批
          tone: neutral
        - label: 商业准备度
          score: 2
          detail: 支持和治疗点基础设施仍在公开材料中搭建
          tone: warning
        - label: 竞争位置
          score: 2
          detail: 已有获批口服选项，削弱先发优势
          tone: warning
        - label: 经济性可见度
          score: 1
          detail: 未披露股权价格、上市价格、收入基础或毛额到净额桥
          tone: negative
        - label: 估值支撑
          score: 2
          detail: 融资隐含了基准，但公开可比公司今天不足以支持大幅溢价
          tone: warning
    approximationNotes: 评分是 1-5 的序数判断，综合公开证据集，供投委会讨论。
