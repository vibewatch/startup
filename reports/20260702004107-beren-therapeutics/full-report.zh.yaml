chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、商业模式和规范官网
        blocks:
          - type: paragraph
            body: >-
              Beren Therapeutics 现在通过 berentx.com 展示自己，而不是通过用户提供的 berentherapeutics.com 域名。这个区别重要，因为当前官方材料反复把读者导向
              BerenTx.com，而旧域名已经不像正常企业网站那样运作。berentherapeutics.com 根页面只返回一个很小的 JavaScript 重定向壳，跳转后的 /lander 页面加载的是
              GoDaddy 停放落地页资产，而不是公司内容。这是一个小但真实的尽调瑕疵：它不推翻底层业务，却在漏斗顶部制造了本可避免的品牌和信任摩擦。


              回到实质，公司比域名卫生更清楚。Beren 的首页、公司、科学和融资材料一致把业务描述为一家 2020 年成立、总部位于 Thousand
              Oaks、专注于环糊精类疗法的公益公司，治疗胆固醇转运缺陷疾病。官方叙事由创始人主导，也偏垂直整合：发现、开发、准入规划和最终商业化都被放进一个与患者利益一致的运营模型，而不是只做授权的生物技术公司。公开层面，该模型仍集中在一个领先资产上。Adrabetadex
              是第一个点名项目、第一个上市候选，也是当前公司画像得以成立的主要原因。因此，Beren 的身份很连贯——罕见病、胆固醇转运、创始人主导、以患者为中心——但公开面貌在使命和定位上远比在组合广度上成熟。
