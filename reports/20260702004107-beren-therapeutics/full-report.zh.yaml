    rows:
      - - 优先审评、突破性疗法认定和 2026 年 6 月融资带来真实的近期期权价值。
        - 正方
        - 按延长后的时间线获批，并清楚披露定价股权条款，会增强确信度。
      - - Adrabetadex 在婴儿发病型 NPC 中仍有机制差异化叙事。
        - 正方
        - 独立的上市和标签证据若显示家庭愿意承受给药路径负担而选择该疗法，就能验证护城河。
