        - 临床标签和支持姿态可见；实际经济性不可见
        - 未保留公开返利或合同细节
        - 可作为可上市 NPC 需求参照，给药比 adrabetadex 更简单
      - - Hercules 销售分成层
        - 公开披露的是未来销售经济性，不是产品价格
        - 美国 7.5% 销售分成；美国境外 5% 销售分成；上限为 1.75x，期限至 2031 年
        - 适用于净销售额，而非标价
        - 与支付方返利或 gross-to-net 如何相互作用没有公开可见度
        - 即便收入爬坡顺利，未来变现也有一部分已被锁定
      - - 孤儿药市场背景
        - Evaluate 提供品类背景，不提供药物级定价
        - 小众产品即使销量很小，也能撑起可观经济性
        - 没有 Beren 特定的实际成交数据
        - 监管和 IRA 压力会随时间压缩定价权
        - 背景解释了为何 Beren 在收入公开前仍可融资
    notes: 可比页面披露给药、标签范围和支持项目，比价格披露更充分。保留的 Beren 材料中，唯一直接量化的变现条款，是未来向 Hercules 承担的销售分成义务。
