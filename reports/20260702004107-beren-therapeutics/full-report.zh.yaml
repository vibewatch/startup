  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管延迟和获批不确定性仍是优先级最高的风险
        blocks:
          - type: paragraph
            body: >-
              相比 Beren 2021 年收购该项目时，adrabetadex 已经离市场近得多，但公开记录读起来仍像一场高风险监管重建，而不是已经去风险的获批故事。申报进入优先审评，但 FDA 将 Beren
              的回复定性为重大修正案后，仍把 PDUFA 日期推迟到 2026 年 11 月 17 日。关键在于，这份 NDA 并没有建立在干净的随机关键试验成功之上。Beren
              称，证据包把外部对照生存分析与生物标志物、非临床证据和患者体验叙事结合在一起。FierceBiotech 明确把这套安排放在 FDA
              近期对其他外部对照申报持怀疑态度的背景下审视。历史包袱也仍清晰可见：此前申办方在一项 2b/3 期研究失败后失去突破性疗法认定，项目经历破产流转，Beren
              自己的法律免责声明仍称，疗效、安全性和质量主张在监管审评完成前都只是初步结论。实际含义是，加速资格能改善时间表，却不会压低二元获批风险。
