      - number: '4.3'
        title: 资本充足性和融资结构
        blocks:
          - type: paragraph
            body: >-
              2026 年 6 月融资包实质性提升了 Beren 的上市准备度，但没有消除依赖风险。公司宣布合并融资 $300M，由 $135M 股权和 Hercules 提供的最高 $165M 非稀释资本组成。在
              Hercules 包内，最高 $110M 被设计为绑定监管和收入里程碑的定期贷款，另有 $55M 销售分成融资仅在 FDA 获批后提供。公告时只提取了 $30M
              定期贷款设施。换句话说，标题金额里的很大一部分是有条件的，而不是可立即支配的。


              这个结构重要，因为同一来源包也显示监管时点风险仍然存在。Beren 2026 年 5 月更新和 FierceBiotech 同期报道均称，在 FDA 将公司对信息请求的回复归类为重大修正案后，审评延长至 2026
              年 11 月 17 日。Fierce
              还强调该项目历史复杂，包括前赞助方挫折，以及一个倚重外部对照生存证据的获批论证。这些事实不否定该资产，但确实意味着评估资本充足性时，应对照获批时间和证据风险，而不是只看标题融资数字。


              该融资包还嵌入未来义务。销售分成融资对美国净销售额收取 7.5% 分成，对美国以外净销售额收取 5%，直至 2031 年达到 1.75x
              上限，并带有提前赎回可选性。形式上它是非稀释资本，但经济上并非免费。因此，Beren
              的资本基础最好理解为已关闭股权、有条件债务、获批闸门后的销售分成资本，以及未来收入分成义务的组合，全部用于资助一个仍缺少公开现金、现金消耗和资金跑道披露的上市计划。
