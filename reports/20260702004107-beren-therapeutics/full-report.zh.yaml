      - number: '4.4'
        title: 财务结论和尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              正确的财务结论是，Beren 已经搭起可信的孤儿药上市平台，但还没有形成可公开承销的运营模型。积极面是真实的：获批 NPC 疗法证明该类别能支撑品牌化经济；Beren
              为一个单一超罕见资产组装了远大于典型上市前规模的融资包；公司也明确把诊断支持、个案管理、护理站点准入和真实世界证据作为商业化的一部分来资助。融资条款还暗示，管理层把美国以外市场和管线扩张视为长期价值案的一部分。


              阻塞点同样清楚。最好的公开美国患病率来源仍显示，在模型化 943 名患病病例背景下，只有 294 名已诊断患者和 305 名已诊断或已治疗患者；这意味着诊断捕获和专科站点执行可能比广泛营销支出更重要。Beren
              也没有披露价格、已实现报销条款、收入、利润率、当前现金余额、现金消耗、资金跑道或客户集中度。2023 年 Roquette 战略关系确认了伙伴对平台的兴趣，但公开包没有披露投资金额，因此无法衡量其当前资本化意义。


              合在一起，Beren 的经济性取决于 adrabetadex
              由获批带动的上市、公司能否通过高触感支持把极小患者数转成耐久净销售额，以及基于里程碑和销售分成的资本能在多大程度上继续可用且不过度压榨未来收入。在私下尽调补上定价、利润率、现金和合同缺口前，本章节支持一种谨慎的“收入前上市期权”框架，而不是干净的承销案例。
