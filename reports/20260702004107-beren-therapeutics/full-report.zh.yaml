      - number: '7.5'
        title: 缓释因素真实存在，但投资论点仍需要明确止损标准
        blocks:
          - type: paragraph
            body: >-
              公开记录确实包含有意义的缓释因素。Beren 已筹到足够资本继续建设上市基础设施，在审评期间保留扩大使用，招募了有经验的上市、监管和质量负责人，也接入了能帮助护理交付和 CMC
              准备的伙伴。但这些缓释因素仍让位于少数可量化关口。第一是获批结果本身：再次修正、咨询委员会意外，或收到完整回复函，都应立即重置承销判断。第二是运营证明：鞘内给药能否在没有不可接受监测或旅行摩擦的情况下启动。第三是已获批口服竞品是否会在
              adrabetadex 到来前固化医生和支付方行为。第四是债务加版税结构下的资本效率。投资者因此应把 Beren
              视为一个可能有价值、但仍脆弱的特殊机会；审评进展、中心准备度、人员连续性和披露质量的月度里程碑，比宽泛的品类热情更重要。
