      - - Trappsol Cyclo / Cyclo Therapeutics
        - 直接开发中替代品
        - 官网仍强调 TransportNPC 3 期和扩展使用
        - 寻求基于环糊精治疗的 NPC 患者和研究者
        - 保留公开来源中，与 adrabetadex 机制最接近的替代品
        - 仍未获批，保留材料包中的公开疗效细节也更少
      - - 支持性照护 + 超说明书 miglustat
        - 现状替代方案
