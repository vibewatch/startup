      - number: '4.2'
        title: 对照代理、成本驱动和单位经济现实
        blocks:
          - type: paragraph
            body: >-
              公开语料足以识别主要单位经济驱动，但不足以直接量化 Beren。对照疗法页面显示，获批 NPC 市场已经能支撑慢性治疗经济性，但它们披露给药、安全和准入支持，远比披露定价清楚。AQNEURSA 的 HCP
              材料强调独立使用、12 周内的神经系统获益，以及持续的延长期随访。MIPLYFFA 官方材料强调与 miglustat 联用、剂量规格、肾功能和超敏反应监测，以及 Zevra
              商业基础设施提供的支持。这些披露有用，因为它们显示，即使公开标价透明度仍弱，一个微小 NPC 上市仍能承载哪些准入、依从和不良事件流程。


              Adrabetadex 看起来比这些口服对照品在经济上更重。Beren 自己的材料和 PubMed
              文献都把该药与鞘内给药、听力监测，以及给药后疲劳或共济失调联系起来。这个组合意味着成本结构不仅由药品制造塑造，也由专科站点、程序物流、监测和高触感家庭支持塑造。公司自己的支持更新也强化了这一点：重点放在加速诊断、单一联络点、护理站点扩张和真实世界证据循环。这些不是可选附件，而是隐含服务模型的一部分。


              因此，公开单位经济桥梁缺了核心拼图。对照页面和孤儿药市场语境表明，小患者池仍可能支撑有意义的孤儿药收入；但留存记录没有给出已验证毛利率，没有 CAC
              或回收期，没有已实现净价，也没有证据说明上市支持会吃掉多少贡献利润。财务建模因此必须把 Beren 的经济性视为结构上可行，但仍不可观察。
