  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接 NPC 格局：获批口服对手、环糊精同类，以及残留的标准护理
        blocks:
          - type: paragraph
            body: >-
              Beren 的直接战场已经足够拥挤，足以拿掉任何先发叙事。最清楚的获批竞争者是 Zevra 的 MIPLYFFA 和 IntraBio 的 AQNEURSA，两者都围绕 Niemann-Pick C
              型病的神经系统表现打造品牌。MIPLYFFA 标签明确绑定与 miglustat 联用，Zevra 现在还把该产品放进一家更宽的罕见病公司，配有公开市值和具名患者支持项目。AQNEURSA
              则用公开材料中最干净的便利性故事反击：赞助方材料反复把它定位为唯一 FDA 批准的 NPC 独立疗法，由一项关键交叉试验和一种口服制剂支撑；该制剂也可通过 G-tube 给药，并按体重给药。这些事实意味着，在
              adrabetadex 获批之前，临床医生和家庭已经有两个商业化口服选择。


              直接替代集合比这两个标签更宽。Cyclo Therapeutics 仍在官网展示 TransportNPC 3 期工作、Trappsol Cyclo
              和扩大使用，这让同一疾病里第二个环糊精项目即便尚未获批，也仍留在视野中。历史标准护理也没有消失：PubMed 2021 年美国患病率研究记录，在美国没有获批疗法时，miglustat 曾被超说明书用于
              NPC；在品牌选项不可及或不适合的地方，支持性护理仍是后备方案。Beren 自己的 APMRF 材料也强化了一个判断：市场可能走向联合和序贯，而不是赢家通吃的替代，因为公司已经在真实世界和临床前语境中把
              adrabetadex 与 arimoclomol、levacetylleucine 放在一起讨论。
