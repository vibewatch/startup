companyProfile:
  summary: >-
    Beren Therapeutics 是一家总部位于加州 Thousand Oaks 的公益型生物技术公司，围绕环糊精类药物，治疗胆固醇转运受损疾病。公司唯一公开点名的领先后期资产是
    adrabetadex：一种鞘内给药的羟丙基-β-环糊精疗法，正接受 FDA 优先审评，用于婴儿期起病的 Niemann-Pick C 型病。创始人兼 CEO Jason Camm 组建了一支高管团队，覆盖罕见病监管、医学、商业化和
    CMC 经验；自 2021 年以来，公司还通过扩大使用支持患者。核心投资张力在于：Beren 现在确实拿到了上市资金，也拥有监管上的可选路径，但对带价格的估值条款、收入模型落地、制造规模，以及 adrabetadex
    之后更宽的管线深度披露仍然很少。
