    {
      "id": "drivers-constraints-and-preserved-contradictions",
      "title": "Growth drivers, adoption constraints, and preserved contradictions",
      "body": "The market has genuine growth drivers despite its tiny size. Two approved therapies have increased disease visibility, Beren’s infantile-onset filing adds a disease-modification narrative, and orphan-drug capital markets remain capable of supporting very small but medically urgent categories. Beren’s recent financing, community programming, and medical-affairs surfaces all signal that commercialization is being built around rare-disease access rather than around mass promotion. But the constraints are just as important. Diagnostic delay remains structural, the FDA review clock for adrabetadex has already slipped after a major amendment, and public pricing or payer-policy data are still too thin for a defensible revenue SOM. The therapy landscape also has to be described carefully rather than flattened into one headline. MIPLYFFA is FDA approved; AQNEURSA officially claims to be the only stand-alone approved therapy; and Beren says adrabetadex would be the only therapy directly targeting cholesterol trafficking. Those statements are not identical and should not be “resolved” into a single marketing line. They imply that future uptake could be segmented by age, route, and mechanism, and in some patients layered rather than winner-take-all. That is why orphan-market totals help as a valuation backdrop, but not as a substitute for disease-specific adoption work.",
