  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "Beren’s market is an ultra-rare NPC treatment-and-care pathway rather than a broad orphan-drug TAM: the strongest public U.S. lens is only 294 diagnosed patients versus about 943 modeled prevalent cases, and Beren’s filed infantile-onset niche is narrower still. Approved oral therapies create a real market baseline, but diagnosis bottlenecks, specialist-center capacity, reimbursement burden, and unresolved pricing data are the main adoption constraints. The chapter therefore sizes the market by patient-count and workflow lenses, preserves the AQNEURSA / MIPLYFFA / adrabetadex positioning contradictions, and treats broad orphan-drug totals as context rather than as Beren’s SAM."
  },
  "sections": [
