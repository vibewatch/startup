- id: capital-adequacy-and-financing-structure
  title: Capital adequacy and financing structure
  body: |-
    The June 2026 financing package materially improved Beren’s launch readiness, but it did not remove dependency risk. The company announced $300 million of combined financing composed of $135 million of equity and up to $165 million of non-dilutive capital from Hercules. Within that Hercules package, up to $110 million is structured as term loans tied to regulatory and revenue milestones, while $55 million of royalty financing funds only upon FDA approval. Only $30 million of the term-loan facility was drawn at announcement. In other words, a large portion of the headline package is conditional rather than immediately spendable.

    That structure matters because the same source pack also shows live regulatory timing risk. Beren’s May 2026 update and FierceBiotech’s contemporaneous coverage say the FDA extended review to November 17, 2026 after classifying the company’s response to an information request as a major amendment. Fierce also underscores that the program has a complicated history, including a prior sponsor setback and an approval argument that leans on external-control survival evidence. Those facts do not invalidate the asset, but they do mean capital adequacy should be judged against approval timing and evidence risk, not against the headline financing number alone.

    The package also embeds future obligations. The royalty financing carries a 7.5% royalty on U.S. net sales and 5% on ex-U.S. net sales up to a 1.75x cap through 2031, with early redemption optionality. That is non-dilutive in form but not free in economics. Beren’s capital base is therefore best understood as a mix of closed equity, conditional debt, approval-gated royalty capital, and future revenue-sharing obligations, all funding a launch plan that still lacks public cash, burn, and runway disclosure.
