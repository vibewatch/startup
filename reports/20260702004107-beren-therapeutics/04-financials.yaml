    - High
    - Royalty financing reduces future economics even if launch succeeds
    - Request base-, upside-, and downside-case cash waterfalls after royalty payments
  - - Debt availability versus actual draw
    - Only $30M drawn at announcement; remaining term debt is milestone-based
    - High
    - Undrawn capital should not be treated as fully available runway
    - Request milestone schedule, expected draw timing, and covenant package
