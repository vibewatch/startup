- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Current public signal
  - Exact diligence path
  - Impact
  rows:
  - - Adrabetadex price corridor / WAC / gross-to-net
    - Needed to convert patient scenarios into revenue and royalty economics
    - No public price disclosed
    - Request launch pricing memo, payer strategy, and base-case gross-to-net assumptions
    - Blocking for full revenue model
  - - Current revenue / ARR / recognized commercial sales
    - Determines whether Beren is already monetizing anything beyond financing inflows
    - No retained public revenue disclosure
    - Request historical P&L or investor deck with revenue line items
    - Material to quality-of-revenue assessment
  - - Gross margin / COGS bridge
    - Needed to judge whether high-touch launch support is economically durable
    - No public gross-margin disclosure
    - Request manufacturing, logistics, monitoring, and support cost breakdown by patient
    - Material to margin-path underwriting
  - - Cash balance, monthly burn, and runway
    - Required to test capital adequacy before and after approval
    - No public cash or burn disclosure
    - Request latest balance sheet, cash flow statement, and board runway model
    - Blocking for runway analysis
  - - Hercules coupon / covenants / collateral / amortization
    - Debt economics can materially change post-approval cash generation
    - Only facility size, milestone gating, and royalty burden are disclosed
    - Request definitive credit agreement or lender summary
    - Material to capital-structure risk
  - - Customer / payer concentration
    - A tiny patient population can produce extreme concentration risk quickly
    - No public mix disclosed
    - Request launch-account map, payer concentration view, and top-site exposure
    - Material to revenue durability
  - - Roquette dollar amount and current ownership significance
    - Needed to understand historical validation and cap-table weight
    - Strategic investment confirmed but amount undisclosed
    - Request cap-table history or financing chronology appendix
    - Moderate but relevant context gap
  notes: These are not cosmetic asks. Each missing metric prevents conversion of a credible launch narrative into a full operating
    model.
