  evidenceGaps:
  - type: missing-source
    severity: material
    topic: hercules-debt-terms
    missingEvidence: Exact coupon, amortization, collateral, covenant, and draw-condition language for the Hercules facility.
    whyItMatters: Those terms determine how much of the non-dilutive package is genuinely attractive versus merely available
      in principle.
    diligencePath: Request the executed credit summary or a lender diligence memo covering rate, amortization, collateral,
      covenants, and milestone triggers.
    relatedQuestionRefs:
    - QI010
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: cash-burn-runway
    missingEvidence: Current cash balance, monthly burn, quarterly cash flow, and management runway forecast.
    whyItMatters: Without those figures, the June 2026 financing headline cannot be translated into a verified pre-approval
      or post-approval runway.
    diligencePath: Request recent management accounts, board materials, or investor-update cash runway slides.
    relatedQuestionRefs:
    - QI018
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: roquette-investment-size
    missingEvidence: The dollar size and current ownership significance of Roquette’s 2023 strategic investment.
    whyItMatters: The relationship may validate the platform, but its real capitalization significance cannot be assessed
      without the amount and ownership terms.
    diligencePath: Request historical cap-table materials or the 2023 financing appendix showing investor amount, security
      type, and ownership impact.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-reimbursement
    missingEvidence: Target net price, expected rebates, payer mix, coverage assumptions, and any draft contract economics
      for adrabetadex.
    whyItMatters: Revenue quality, royalty burden, and gross-to-net outcomes cannot be underwritten from route of administration
      and orphan-market context alone.
    diligencePath: Request pricing committee materials, payer strategy deck, and base-/bear-case gross-to-net assumptions
      used internally for launch planning.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI002
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: gross-margin-path
    missingEvidence: Manufacturing cost, distribution cost, monitoring burden, patient-support cost, and gross-margin bridge
      by treated patient.
    whyItMatters: A high-touch launch can still fail economically if support intensity overwhelms gross profit per patient.
    diligencePath: Request a launch economics model that separates drug COGS, site-of-care support, monitoring, and patient-services
      spend.
    relatedTableRefs:
    - TI003
    - TI005
