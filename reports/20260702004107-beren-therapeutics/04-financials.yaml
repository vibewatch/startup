- id: comparator-proxies-cost-drivers-and-unit-economics
  title: Comparator proxies, cost drivers, and unit-economics reality
  body: |-
    The public corpus is strong enough to identify the main unit-economics drivers, but not strong enough to quantify them for Beren directly. Comparator therapy pages show that the approved NPC market already supports chronic treatment economics, but they disclose dosing, safety, and access support much more clearly than pricing. AQNEURSA’s HCP materials emphasize stand-alone use, neurological benefit within 12 weeks, and ongoing extension follow-up. MIPLYFFA’s official materials emphasize use with miglustat, dose strengths, renal and hypersensitivity monitoring, and support through Zevra’s commercial infrastructure. Those disclosures are useful because they show the kinds of access, adherence, and adverse-event workflows that a tiny NPC launch can sustain, even when public list-price transparency is still weak.

    Adrabetadex appears economically heavier than those oral comparators. Beren’s own materials and the PubMed literature tie the drug to intrathecal administration, hearing monitoring, and post-dose fatigue or ataxia. That combination implies a cost structure shaped not just by drug manufacturing but also by specialist sites, procedure logistics, monitoring, and high-touch family support. The company’s own support update reinforces that point by focusing on diagnosis acceleration, a single point of contact, care-site expansion, and real-world evidence loops. Those are not optional accessories; they are part of the implied service model.

    The result is a public unit-economics bridge with missing center pieces. Comparator pages and orphan-market context suggest that small patient pools can still support meaningful orphan revenues, but the retained record gives no verified gross margin, no CAC or payback, no realized net price, and no evidence for how much launch support erodes contribution margin. Financial modeling therefore has to treat Beren’s economics as structurally plausible but still unobservable.
