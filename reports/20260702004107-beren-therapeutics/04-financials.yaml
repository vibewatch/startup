  - - AQNEURSA
    - No simple public WAC on retained official pages
    - Stand-alone oral therapy with weight-based dosing
    - Clinical label and support posture visible; realized economics not visible
    - No retained public rebate or contract detail
    - Useful proxy for launchable NPC demand with simpler administration than adrabetadex
  - - Hercules royalty layer
    - Publicly disclosed economics on future sales rather than product price
    - 7.5% U.S. royalty; 5% ex-U.S. royalty; 1.75x cap through 2031
    - Applies to net sales, not list price
    - No public visibility into interaction with payer rebates or gross-to-net
    - Future monetization is partly encumbered even if revenue ramps well
