- id: mitigations-and-kill-criteria
  title: Mitigations are real, but the thesis still needs explicit kill criteria
  body: 'The public record does contain meaningful mitigations. Beren has raised enough capital to keep building launch infrastructure, it has preserved expanded access during review, it has recruited experienced launch, regulatory, and quality leaders, and it has engaged partners that can help with care delivery and CMC readiness. But those mitigations are still second-order to a handful of measurable gates. The first is the approval outcome itself: another amendment, an advisory-committee surprise, or a complete response letter should immediately reset the underwriting case. The second is operational proof that intrathecal delivery can be activated without unacceptable monitoring or travel friction. The third is whether approved oral competitors harden physician and payer behavior before adrabetadex arrives. The fourth is capital efficiency under a debt-plus-royalty structure. Investors should therefore treat Beren as a potentially valuable but still brittle special situation, where monthly
    milestones on review, center readiness, staffing continuity, and disclosure quality matter more than broad category enthusiasm.'
