  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: payer-and-site-readiness
    missingEvidence: Center activation counts, referral-to-first-dose timing, payer approvals, and hub conversion metrics for the launch plan.
    whyItMatters: Commercial feasibility for an intrathecal rare-disease launch depends on operational throughput rather than topline demand alone.
    diligencePath: Request launch-readiness dashboard, center map, and monthly operating metrics from management.
    relatedTableRefs:
    - TR002
    - TR005
  - type: private-evidence-only
    severity: material
    topic: auditory-monitoring-burden
    missingEvidence: Age-stratified rates of hearing interventions, dose interruptions, discontinuations, and durable hearing outcomes in the filed population.
    whyItMatters: The biggest non-regulatory adoption risk is whether monitoring and hearing burden stay manageable in routine care.
    diligencePath: Request NDA safety tables, investigator brochures, and longitudinal audiology summaries.
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: capital-structure-covenants
    missingEvidence: Detailed Hercules covenants, milestone definitions, draw conditions, and optional redemption economics beyond the press release.
    whyItMatters: A debt-plus-royalty stack can erode investor returns quickly if hidden triggers or restricted draws appear.
    diligencePath: Review executed financing agreements and board-approved downside liquidity scenarios.
    relatedTableRefs:
    - TR003
    - TR005
  - type: missing-source
    severity: minor
    topic: competitor-uptake-benchmark
    missingEvidence: Public 2025-2026 uptake curves for Miplyffa and AQNEURSA in NPC centers to benchmark how much late-entry friction Beren may face.
    whyItMatters: Without live uptake data, commercial-risk comparisons rely more on logic than on observed market share.
    diligencePath: Ask management and KOLs for prescribing trends, payer behavior, and center-level analogs.
    relatedTableRefs:
    - TR005
  - type: private-evidence-only
    severity: material
    topic: TR001 regulatory correspondence and coverage completeness
    missingEvidence: Complete FDA correspondence, meeting minutes, and internal legal assessments needed to determine whether the public regulatory risk register is exhaustive.
    whyItMatters: The highest-severity table is explicitly partial because public materials cannot show the full scope of agency questions or legal exposure.
    diligencePath: Request the FDA information-request package, amendment cover letter, counsel memo, and any draft-label negotiation tracker.
    relatedTableRefs:
    - TR001
