- id: financing-partner-and-people-dependence
  title: Financing, partner, and key-person concentration make execution fragile
  body: 'Beren’s June 2026 financing clearly strengthens the balance sheet, but it also makes the next phase more path dependent rather than less. Only part of the Hercules package is drawn today, the rest depends on regulatory and revenue milestones, and the royalty leg still takes a meaningful share of future sales through 2031. That makes the capital stack tolerable if approval and uptake come quickly, but punitive if launch slips. The operating plan also depends on a few named partners and leaders. Roquette is not just a passive investor; Beren describes the relationship as supporting CMC, safety protocols, and regulatory registration. Public materials also show a small, high-leverage leadership bench spanning finance, commercial, regulatory, quality, and scientific communications. That is promising because the team has rare-disease launch experience, but it also means turnover or underperformance in a single role can propagate quickly through a one-asset company. The same concentration
    appears in disclosure quality: much of the public evidence still arrives through company-curated timelines, posters, and leadership messaging rather than a broad independent data package.'
