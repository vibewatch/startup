- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold or event
  - Action implication
  rows:
  - - Approval uncertainty
    - FDA process signal
    - Another major amendment, unplanned AdCom, or CRL
    - Pause underwriting until the path to approval is reset
  - - Monitoring burden
    - Audiology and site-of-care readiness
    - Center rollout lags launch plan or hearing-management burden exceeds plan
    - Discount uptake assumptions and demand operational proof
  - - Competitive uptake
    - Physician and payer adoption
    - Oral competitors capture standard-of-care status before adrabetadex launch
    - Require stronger differentiation evidence before investing
  - - Debt and royalty overhang
    - Financing utilization and covenant headroom
    - Additional tranches remain unavailable or royalty economics dominate base-case margin
    - Rework return case with downside capital structure
  - - Data transparency
    - Public disclosure quality
    - No fuller safety or methodology disclosure appears before decision or launch
    - Keep recommendation at watchful diligence rather than conviction underwriting
  - - Single-asset execution
    - Leadership depth and launch staffing
    - Key finance, regulatory, or commercial roles turn over during review
    - Treat company risk as too concentrated for a high-conviction entry
  notes: Kill criteria are intentionally tied to observable review, launch, and financing events rather than subjective management optimism.
