company:
  name: Beren Therapeutics
chapter:
  number: 7
  title: Risks
  summary: 'Beren Therapeutics faces its highest risk at the regulatory and operating boundary: approval still depends on an externally controlled package that just absorbed a three-month FDA extension, and any approval must then be commercialized through an intrathecal, monitoring-heavy care model. Approved oral competitors, a debt-plus-royalty capital stack, and single-asset/key-person concentration all raise the bar for flawless execution, leaving the company attractive only if approval, center readiness, and early uptake clear explicit kill criteria.'
sections:
- id: regulatory-approval-uncertainty
  title: Regulatory delay and approval uncertainty remain the highest-ranked risks
  body: 'Adrabetadex is much closer to market than it was when Beren acquired the program in 2021, but the public record still reads as a high-stakes regulatory rebuild rather than a de-risked approval story. The filing reached priority review, yet the FDA still pushed the PDUFA date to November 17, 2026 after classifying Beren’s response as a major amendment. That matters because the NDA is not anchored by a clean randomized pivotal success. Instead, Beren says the package combines an externally controlled survival analysis with biomarkers, nonclinical evidence, and patient-experience narratives. FierceBiotech explicitly frames that setup against recent FDA skepticism toward other external-control submissions. The legacy overhang also remains visible: the earlier sponsor lost Breakthrough Therapy Designation after a failed phase 2b/3 study, the program passed through bankruptcy, and Beren’s own legal disclaimer still says efficacy, safety, and quality claims remain preliminary until regulators
    finish review. The practical implication is that expedited status improves timing but does not shrink binary approval risk.'
