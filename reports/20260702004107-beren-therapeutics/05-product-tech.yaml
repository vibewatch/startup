- id: FE001
  title: Product architecture map
  type: stack
  layout: standard
  summary: Beren's product stack runs from cholesterol-trafficking disease biology into one lead intrathecal asset, a practitioner-facing evidence layer, and long-term rare-disease support.
  data:
    layers:
    - label: Disease-biology layer
      detail: NPC1/NPC2 dysfunction, lysosomal cholesterol sequestration, and infantile neurodegeneration define the mechanistic target.
    - label: Therapeutic-asset layer
      detail: Adrabetadex is a proprietary HPβCD isomer mixture intended to restore intracellular cholesterol trafficking.
    - label: Delivery and monitoring layer
      detail: Intrathecal administration, audiology surveillance, fatigue/ataxia monitoring, and rare-disease-center workflow operationalize use.
    - label: Evidence and community layer
      detail: Trials, expanded access, ACMG/APMRF congress activity, and medical.berentx.com support the technical narrative.
    - label: Access and scale-up layer
      detail: FDA review, Roquette-linked CMC support, financing, and long-term family support determine commercial reach.
  approximationNotes: This stack abstracts the public product surface into layers; Beren does not publish a single canonical architecture schematic.
