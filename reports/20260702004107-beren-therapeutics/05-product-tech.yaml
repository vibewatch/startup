tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - User / job
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Adrabetadex NDA asset for infantile-onset NPC
    - Metabolic neurologists, rare-disease families, FDA-reviewed pediatric treatment centers
    - Most mature surface; NDA under FDA review in 2026 with prior EAP and trial history
    - Only Beren asset with a full survival + progression + biomarker package and explicit disease-modifying positioning
    - Need final label scope, dosing cadence, site-readiness, and approval outcome
  - - Expanded Access Program delivery layer
    - Eligible NPC patients needing pre-approval access and clinician supervision
    - Operational since 2021 and still referenced as ongoing
    - Creates real delivery experience and community continuity before approval
    - Need center count, patient throughput, discontinuation rates, and monitoring burden
  - - Medical-affairs / congress evidence surface
    - Clinicians and scientific community evaluating data quality
    - Visible but partially gated behind healthcare-professional access
    - Adds practitioner-facing signal beyond generic corporate marketing
    - Need full poster-level datasets and protocol detail in public view
  - - Cyclodextrin cholesterol-trafficking platform
    - Researchers and partners evaluating broader disease applicability
    - Conceptually central but only lightly enumerated publicly
    - Platform is anchored in a coherent mechanistic thesis around intracellular cholesterol trafficking
    - Need named follow-on assets, indications, and stage-specific milestones
  - - Broader post-adrabetadex pipeline
    - Investors underwriting portfolio breadth and durability
    - Sparse in reviewed public record
    - Company language implies expansion potential beyond core NPC work
    - Need explicit asset list, preclinical package, or second-program timeline
  notes: Maturity reflects public disclosure depth and regulatory stage, not internal portfolio scoring.
