- id: mechanism-route-and-evidence-package
  title: Mechanism, route, and evidence package
  body: 'Adrabetadex is presented as a mechanistically targeted attempt to restore intracellular cholesterol trafficking in NPC rather than as a symptomatic oral therapy. The evidence base linking route to mechanism is stronger than for many early rare-disease programs: preclinical mouse and cat work showed cyclodextrin-mediated neuroprotection and lifespan extension; the NIH/Rush phase 1/2a intrathecal study used serum and cerebrospinal-fluid 24(S)-hydroxycholesterol plus CSF protein biomarkers as target-engagement signals; later Beren analyses tied the same route to external-control survival, 4-domain disease-progression, and neuronal-injury biomarker results. Publicly, the route matters because Beren is asking clinicians and families to accept lumbar or centrally administered therapy in exchange for a disease-modifying claim in a rapidly fatal infantile population. That is a differentiated proposition versus the now-approved oral NPC drugs, but it also means product value depends on whether
    the procedure burden, monitoring needs, and external-control-based efficacy narrative remain compelling under FDA and commercial scrutiny.'
