- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / quality signal
  - Status
  - Scope
  - Gap
  rows:
  - - '>10 years of clinical development history'
    - Described
    - Program continuity across NIH, prior sponsors, and Beren-era development
    - Does not itself prove current commercial execution quality
  - - Expanded Access Program operations
    - Described / ongoing
    - Real-world patient access and clinician experience before approval
    - No public disclosure of center count, enrollment flow, or discontinuation metrics
  - - Audiology surveillance and hearing-aid management
    - Documented
    - Main recurring adverse-event management approach for HPβCD-related hearing impairment
    - Public pack does not provide protocolized surveillance schedule or threshold criteria
  - - Biomarker + disease-progression triangulation
    - Documented
    - 24(S)-OHC, calbindin D, FABP3, survival, and 4DNPCCSS create a multi-modal evidence package
    - Poster and press-release summaries provide less detail than a full statistical report
  - - FDA designations and review milestones
    - Documented
    - Breakthrough Therapy, Priority Review, and NDA amendment history
    - Milestones de-risk urgency but do not eliminate approval risk
  - - Commercial CMC / supply disclosure
    - Not found in reviewed pack
    - No public formulation specs, site network, batch scale, or release metrics surfaced here
    - Requires management disclosure before investors can grade launch readiness
  - - Detailed practitioner dataset access
    - Partially gated
    - Full posters available only to healthcare professionals through Beren Medical
    - Outside investors cannot independently inspect all technical details from open sources
  notes: Status reflects what is visible in the reviewed public corpus, not what Beren may run privately.
