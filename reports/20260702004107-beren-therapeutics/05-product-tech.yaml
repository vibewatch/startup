  evidenceGaps:
  - type: missing-source
    severity: material
    topic: quality-controls
    missingEvidence: Public documentation of formal quality systems, surveillance protocols, and operating controls beyond conference summaries and general regulatory milestones.
    whyItMatters: Investors can see clinical intent but cannot independently grade operational quality maturity from the current public pack.
    diligencePath: Request quality-system overview, audiology monitoring SOPs, and any GxP or site-readiness documentation used for adrabetadex treatment centers.
    relatedQuestionRefs:
    - QE013
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: blocking
    topic: CMC-dependency
    missingEvidence: Commercial CMC package details including formulation specs, manufacturing-site network, batch-release criteria, and scale-up readiness.
    whyItMatters: Adrabetadex is an invasive rare-disease product whose launch readiness cannot be underwritten without supply and release transparency.
    diligencePath: Obtain manufacturing overview, partner split with Roquette, release testing plan, and commercial supply timeline from management.
    relatedQuestionRefs:
    - QE014
    - QE024
    relatedTableRefs:
    - TE003
    - TE004
  - type: private-evidence-only
    severity: material
    topic: pipeline-breadth
    missingEvidence: Named follow-on cyclodextrin assets, stage-specific milestones, and explicit post-adrabetadex portfolio map.
    whyItMatters: Platform language has limited value if investors cannot identify the next asset, indication, or timeline that diversifies single-program risk.
    diligencePath: Request internal pipeline review with named programs, target indications, stage, and go/no-go milestones.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE001
    - TE005
  - type: private-evidence-only
    severity: material
    topic: deployment-burden
    missingEvidence: Treatment-center footprint, site throughput, procedure cadence, and attrition or discontinuation data for intrathecal administration outside formal trials.
    whyItMatters: Commercial uptake may be constrained by procedure logistics even if the efficacy case is strong.
    diligencePath: Request EAP operational metrics, center map, dosing schedule detail, and family-support burden metrics from Beren.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE002
    - TE003
