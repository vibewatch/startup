- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Beren solution
  - Measurable benefit
  - Limitation
  rows:
  - - Treat rapidly progressive infantile NPC after diagnosis
    - Supportive care plus approved oral NPC options that are not designed around intrathecal cholesterol trafficking restoration in infantile onset
    - Intrathecal adrabetadex delivered through clinical study / EAP / potential NDA pathway
    - External-control survival analysis reported 84% 5-year survival versus 42% controls and 71% mortality-risk reduction
    - Benefit comes from non-randomized survival comparison and invasive administration
  - - Track whether therapy is engaging the underlying biology
    - Clinical observation alone can miss mechanistic target engagement
    - CSF and plasma biomarkers including 24(S)-OHC plus neuronal-injury proteins
    - Beren reported +27.7% CSF 24(S)-OHC and reduced calbindin D / FABP3
    - Biomarker analyses were reported from subsets rather than full-trial populations
  - - Slow neurologic decline in an infantile population
    - Natural history is severe and early onset predicts worse outcomes
    - 4-domain neurologic follow-up around ambulation, speech, fine motor, and swallowing
    - ACMG data reported 43% lower annual progression over 52 weeks
    - Public materials do not disclose full patient-level durability tables
  - - Maintain access before commercial approval
    - Families otherwise depend on trials, symptomatic care, or approved oral agents
    - Expanded Access Program run through Mandos / Beren
    - Supports continuity of treatment and gives Beren delivery experience
    - Public record does not show EAP geography, site capacity, or operational attrition
  - - Layer therapy choices around patient need
    - Clinicians now choose among oral NPC therapies with different labels and safety profiles
    - APMRF materials frame adrabetadex as potentially foundational alongside oral therapies
    - Could support combination paradigms with complementary mechanisms
    - Current combination evidence is early and poster-level rather than label-backed
  notes: Benefits are taken from disclosed study summaries and should not be read as a commercial label claim until approval.
