- id: FE002
  title: Customer workflow / operating flow
  type: flow
  layout: wide
  summary: The adrabetadex workflow links diagnosis, intrathecal dosing, biomarker and neurologic follow-up, and long-term access decisions in a high-touch rare-disease path.
  data:
    nodes:
    - id: w1
      label: Suspect or confirm infantile NPC
      detail: Families and metabolic neurology teams identify early-onset neurologic decline consistent with NPC1/NPC2 disease.
    - id: w2
      label: Select adrabetadex access path
      detail: Eligible patients enter trial follow-up, expanded access, or a future approved-label pathway through Beren/Mandos.
    - id: w3
      label: Dose intrathecal adrabetadex
      detail: HPβCD is delivered through CNS-directed administration rather than oral outpatient dosing.
    - id: w4
      label: Monitor target engagement and function
      detail: 24(S)-OHC, neuronal-injury biomarkers, and neurologic severity scales frame response assessment.
    - id: w5
      label: Manage tolerability and hearing risk
      detail: Audiology surveillance, hearing aids when needed, and post-dose fatigue/ataxia management support repeat use.
    - id: w6
      label: Layer longer-term care choices
      detail: Clinicians may consider combination with approved oral therapies and long-term support plans depending on patient need.
    edges:
    - from: w1
      to: w2
      label: diagnosis and eligibility
    - from: w2
      to: w3
      label: initiate treatment path
    - from: w3
      to: w4
      label: evaluate biology and function
    - from: w4
      to: w5
      label: continue only if tolerable
    - from: w5
      to: w6
      label: optimize long-term regimen
  approximationNotes: The flow synthesizes public study, EAP, and congress narratives rather than a labeled commercial SOP.
