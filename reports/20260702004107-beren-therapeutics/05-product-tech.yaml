company:
  name: Beren Therapeutics
chapter:
  number: 5
  title: Product & Technology
  summary: 'Beren''s current product story is dominated by adrabetadex: an intrathecal 2-hydroxypropyl-β-cyclodextrin program for infantile-onset Niemann-Pick disease type C built around cholesterol-trafficking biology, expanded-access operations, and an NDA supported by survival, progression, and biomarker analyses. Public proof is strongest on route, mechanism, and rare-disease urgency, but weaker on commercial CMC disclosure, randomized confirmatory evidence, and whether Beren''s broader cyclodextrin platform extends into named follow-on assets beyond adrabetadex.'
sections:
- id: product-scope-and-asset-map
  title: Product scope and asset map
  body: 'Beren''s public product surface is unusually concentrated for a platform-framed biotech. Across the company, science, patients, and medical-affairs pages, the named deliverable is adrabetadex for infantile-onset Niemann-Pick disease type C, advanced through Mandos and supported by an expanded-access program that predates the current NDA. The company repeatedly describes a broader cholesterol-trafficking and derivatized-cyclodextrin platform, but the reviewed pack does not identify a second named clinical asset, separate development candidate, or modular software product that stands independently from the adrabetadex/NPC narrative. That makes the product map look like a tiered stack rather than a broad portfolio: one lead clinical asset, one delivery and patient-support motion around that asset, and one scientific platform thesis that could expand later but is not yet publicly enumerated in the same way. The medical.berentx.com surface and repeated congress activity add practitioner-facing
    credibility, but they reinforce adrabetadex centrality rather than proving broad pipeline breadth. That concentration heightens single-asset risk.'
