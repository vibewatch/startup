- id: diligence-and-kill-triggers
  title: Kill Triggers, Final Diligence Asks, and What Would Improve the Call
  body: 'The easiest way to lose discipline here is to treat the financing headline as proof that the valuation question is solved. It is not. The unresolved questions are the ones that actually determine whether the current private mark is fair: what price per share the equity investors paid, what liquidation preferences and anti-dilution rights sit ahead of common, what covenants govern the undrawn debt, what royalty waterfall really applies under different geographies, and what pricing-plus-patient-start assumptions management uses to argue for self-sustaining commercialization. Another clear kill trigger is regulatory: another material FDA delay or a label outcome that weakens Beren’s differentiation would compress the range quickly. Commercial kill triggers matter too. If approved oral competitors and their existing support ecosystems dominate early starts, Beren’s service buildout looks like catch-up rather than moat. The call improves only if the entry price moves toward the low end
    of the range or diligence closes these open economics questions while preserving the current approval optionality.'
