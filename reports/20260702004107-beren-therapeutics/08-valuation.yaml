- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Side
  - What would change the view
  rows:
  - - Priority Review, Breakthrough designation, and June 2026 financing create real near-term optionality.
    - Thesis
    - Approval on the extended timeline plus clean disclosure of priced-equity terms would strengthen conviction.
  - - Adrabetadex retains a mechanistic differentiation story in infantile-onset NPC.
    - Thesis
    - Independent launch and label evidence that families choose the therapy despite route burden would validate the moat.
  - - Approved oral competitors already serve the market, reducing first-mover leverage.
    - Anti-thesis
    - Clear evidence that infantile-onset outcomes or positioning overcome oral convenience would soften this objection.
  - - Debt and royalty capital leak value away from common equity even in a successful launch.
    - Anti-thesis
    - A lighter-than-feared covenant and royalty profile, or much stronger pricing power, would mitigate the overhang.
  - - Public rare-disease comps already show what diversified commercial platforms are worth.
    - Anti-thesis
    - A cheaper entry point or new proof that Beren deserves a comparable premium would improve the setup.
  notes: Each row links the investment case to a specific falsifiable event rather than treating valuation as a generic quality score.
