company:
  name: Beren Therapeutics
chapter:
  number: 8
  title: Valuation
  summary: 'Beren’s June 2026 financing finally provides a live valuation anchor, but it is an indirect one: the cleanest benchmark comes from the $135 million equity tranche, not the full $300 million package. That sensitivity points to a roughly unicorn-adjacent private mark, yet current economics remain pre-revenue in the public record and upside is already compressed by approved oral competitors plus debt-and-royalty leakage. The chapter therefore lands on a track recommendation, high risk, and a fair-only-at-the-low-end valuation stance with explicit bull, base, bear, and kill-trigger conditions.'
sections:
- id: recommendation-summary
  title: Recommendation, Confidence, Risk, and Valuation Stance
  body: 'Beren’s disclosed June 2026 financing is meaningful because it gives the market a real, recent valuation clue without actually disclosing a priced round. The package is large at $300 million, but only $135 million is equity; the rest is milestone-tied debt and royalty capital. That means the cleanest valuation read is to sensitivity-test the equity slice, not to capitalize the whole headline. On that basis, the current private benchmark looks roughly unicorn-adjacent: about $0.9 billion at 15 percent dilution, $1.125 billion at 12 percent, and $1.35 billion at 10 percent. Those are plausible late-stage private marks, but they are not cheap for a company whose lead asset remains unapproved, whose public record still frames commercialization as potential, and whose economics are not yet visible through disclosed revenue, pricing, or gross-to-net data. The recommendation is therefore track. Confidence is medium rather than high because the direction of the call is clear even if exact
    equity terms are not. Risk stays high, and valuation is fair only near the lower end of the implied band while stretched above roughly $1.2 billion.'
