  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: comparable-set-completeness
    missingEvidence: Exact private-round valuation terms for Beren and a fuller set of directly comparable rare-disease pre-commercial rounds.
    whyItMatters: The public comparable table brackets the range, but direct private pricing evidence would tighten the benchmark materially.
    diligencePath: Request the June 2026 equity term sheet and management’s internal comparable-round deck; extend the set with banker or cap-table materials.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: pricing-and-reimbursement
    missingEvidence: Launch pricing, gross-to-net assumptions, payer mix, and initial patient-start expectations.
    whyItMatters: A rare-disease launch can look attractive on approval alone yet fail to support the benchmark if net realized economics are weaker than assumed.
    diligencePath: Request launch model, payer strategy, and first-center readiness dashboard from management before upgrading the call.
    relatedQuestionRefs:
    - QV029
  - type: private-evidence-only
    severity: material
    topic: debt-covenants-and-waterfall
    missingEvidence: Detailed covenant package, draw conditions, and royalty waterfall terms across territories and scenarios.
    whyItMatters: Structured capital can materially reduce common-equity value even when headline financing looks supportive.
    diligencePath: Review definitive Hercules and royalty documents or obtain lender-side summary schedules during diligence.
