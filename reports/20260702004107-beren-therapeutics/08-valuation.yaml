- id: valuation-benchmark-and-comps
  title: Financing Benchmark and Public Comparable Set
  body: 'The cleanest public comparable is Zevra, not because Zevra and Beren are identical, but because Zevra already commercializes MIPLYFFA in NPC and therefore shows what a live public benchmark for this disease can command today. Zevra’s roughly $0.81 billion market value sits below the upper end of Beren’s implied private range, which is a warning against assuming approval alone justifies a large premium. The larger comparables—Ultragenyx, Amicus, Krystal, BioMarin, and especially Biogen—are best read as ceiling context. Their public values reflect diversified pipelines, existing product portfolios, manufacturing depth, and broader commercial infrastructure that Beren does not yet have. Sarepta adds the opposite lesson: even a company with approved products can suffer severe equity compression after execution shocks. Taken together, the comparable set argues that a private benchmark around unicorn status is not impossible, but it requires assuming approval and launch execution that
    the public record has not yet proven.'
