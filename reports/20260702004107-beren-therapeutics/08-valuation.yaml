- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Key assumptions
  - Valuation / return logic
  - Probability signal
  rows:
  - - Bull
    - Approval by the extended 2026 date, preserved differentiation in infantile-onset NPC, and smooth site-of-care ramp.
    - $1.2B-$1.6B benchmark; investors are underwriting a premium launch trajectory with manageable financing leakage.
    - Possible, but it needs both regulatory success and visible early uptake.
  - - Base
    - Approval remains plausible but launch scales deliberately, with competition and structured capital tempering value.
    - $0.8B-$1.1B benchmark; roughly unicorn-adjacent but not richly above it.
    - Most consistent with the current evidence set.
  - - Bear
    - Another delay, label disappointment, weak starts, or tighter financing terms.
    - $0.3B-$0.6B benchmark; downside moves faster than upside once the market doubts approval or launch fit.
    - Material risk because multiple gates remain unresolved.
  notes: Scenario bands are current valuation benchmarks derived from public financing and comparable context, not management guidance or a DCF.
