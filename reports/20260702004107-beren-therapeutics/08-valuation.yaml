- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold or event
  - Transmission to thesis
  - Action implication
  rows:
  - - Regulatory delay / CRL
    - Another material FDA delay, CRL, or materially weaker label
    - Cuts the probability that Beren merits a unicorn-class benchmark
    - Move from track toward avoid until valuation resets or new evidence emerges
  - - Launch starts miss
    - Early eligible starts skew toward MIPLYFFA or AQNEURSA despite Beren rollout
    - Turns support-program buildout into catch-up rather than moat
    - Reduce base-case range and require harder evidence before committing capital
  - - Structured capital worsens
    - New capital adds more royalty leakage or dilutive equity before traction
    - Reduces common-equity upside even if product approval lands
    - Demand lower entry price or walk away
  - - Pricing / reimbursement miss
    - Gross-to-net or payer friction makes economics weaker than implied
    - Base case stops looking self-sustaining
    - Shift valuation toward bear case
  - - Center readiness shortfall
    - Site-of-care rollout lags launch ambition
    - Delays uptake in an already narrow market
    - Treat any high-end valuation as unsupported
  notes: Kill triggers are intentionally monitorable so the recommendation can be revised quickly if the fact pattern changes.
  claimRefs:
  - CV031
  - CV040
  - CV041
  - CV042
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Equity pricing and post-money
    - Share price, fully diluted post-money, and preference stack from the June 2026 equity tranche
    - Determines whether the current benchmark is fair or already stretched
    - Request financing deck, cap table, and definitive documents from management
  - - Debt covenants and draws
    - Milestone tests, covenant package, and undrawn-facility conditions
    - Determines whether capital is truly available or only optically committed
    - Review Hercules credit agreement and board materials
  - - Royalty waterfall
    - Territory carve-outs, caps, step-downs, and change-of-control treatment
    - Directly affects common-equity upside in success cases
    - Request royalty agreement summary and counsel memo
  - - Pricing and reimbursement model
    - Assumed net price, patient assistance, and gross-to-net bridge
    - Needed to judge whether self-sustaining commercialization is realistic
    - Request launch model and payer strategy materials
  - - Initial patient-start evidence
    - Center readiness, family handoff, and early demand indicators
    - Shows whether Beren can win despite oral competition and support incumbency
    - Request launch-readiness dashboard and field plan
  - - Label and uptake sensitivity
    - Scenario analysis under narrower label or slower adoption
    - Explains how quickly value falls from bull to base or bear
    - Run management sensitivity cases against the public benchmark range
  notes: These asks focus on the hidden economics behind the financing headline; clearing them is what would move the call beyond track.
  claimRefs:
