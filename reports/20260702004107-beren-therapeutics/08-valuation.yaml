- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Current valuation / status
  - Why it matters
  - Limitation versus Beren
  rows:
  - - Beren Therapeutics
    - 'Private benchmark implied by June 2026 financing: roughly $0.8B-$1.1B base; unicorn-class only under lower dilution'
    - Subject company; anchor comes from current financing rather than stale rounds
    - Exact equity price, cap-table terms, and revenue profile are undisclosed
  - - Zevra Therapeutics
    - ~$0.81B public market cap; sells MIPLYFFA in NPC
    - Closest disease-specific public benchmark because it already commercializes approved NPC therapy
    - Public-market discounting and approved-product economics are not the same as a private pre-approval round
  - - Ultragenyx
    - ~$3.18B public market cap
    - Ceiling context for a rare-disease specialist with diversified pipeline and infrastructure
    - Much broader portfolio and operating base than Beren
  - - Amicus Therapeutics
    - ~$4.54B public market cap
    - Another commercial rare-disease benchmark for scale and durability context
    - Already commercial and diversified beyond a single near-term launch
  - - Krystal Biotech
    - ~$10.95B public market cap
    - Shows how the market rewards a rare-disease company with commercial proof and manufacturing capability
    - Different modality and much stronger de-risking than Beren
  - - BioMarin
    - ~$11.17B public market cap
    - Commercial rare-disease leader; useful as an upper-bound context point
    - Far larger revenue base and multi-product portfolio
  - - Biogen
    - ~$30.96B public market cap
    - Provides scale context for neurology and rare-disease breadth
    - Too diversified to function as a direct valuation comparable
  - - Sarepta Therapeutics
    - ~$1.92B public market cap after much higher 2024 levels
    - Downside analog showing how sentiment can compress after execution shocks
    - Different disease mix and event path; use as risk framing, not direct pricing
  notes: Table is a representative, not exhaustive, July 2026 public-comp set used to frame Beren’s current benchmark; larger diversified issuers are ceiling context rather than direct comps.
  enumerationScope:
    coverage: partial
    basis: Representative July 2026 public rare-disease and gene-medicine comparables used to bracket Beren; private round and exact pricing comps remain undisclosed.
