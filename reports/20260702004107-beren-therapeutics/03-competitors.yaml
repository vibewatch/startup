  rows:
  - - Adrabetadex / Beren
    - Direct investigational rival
    - Private clinical-stage; priority review for infantile-onset NPC; pre-launch support buildout underway
    - Infantile-onset NPC families, clinicians, and specialty sites
    - Cyclodextrin / cholesterol-trafficking thesis plus infantile-onset focus
    - Unapproved and intrathecal, with heavier site-of-care burden
  - - MIPLYFFA / Zevra
    - Direct approved oral therapy
    - $0.81B public rare-disease company; first FDA-approved NPC treatment
    - Adults and children 2+ with neurological manifestations of NPC using miglustat
    - First-mover approval, oral capsules, named support program
    - Requires miglustat and competes more on symptom progression than Beren’s root-cause narrative
  - - AQNEURSA / IntraBio
    - Direct approved oral therapy
    - Approved stand-alone therapy; private sponsor in retained pack
    - Adults and pediatric patients >=15 kg with neurological manifestations of NPC
    - Standalone oral label, 12-week fSARA signal, G-tube-compatible suspension
    - Less public proof than Beren on infantile-onset survival or broader commercial infrastructure
  - - Trappsol Cyclo / Cyclo Therapeutics
    - Direct developmental substitute
    - Official site still highlights TransportNPC phase 3 and expanded access
    - NPC patients and investigators seeking cyclodextrin-based treatment
    - Closest mechanistic substitute to adrabetadex among retained public sources
    - Still unapproved and with less visible public efficacy detail in the retained pack
  - - Supportive care + off-label miglustat
    - Status quo substitute
    - Historically the U.S. fallback before approvals; still relevant where branded therapy is inaccessible
    - NPC patients managed through symptom control and off-label treatment
    - Existing clinician familiarity and no need to wait for a new launch
    - Incomplete disease-control story and no fresh branded-service infrastructure
  - - Ultragenyx
    - Adjacent rare-disease benchmark
    - $3.18B market cap; large and diverse rare-disease pipeline; expanding commercial teams
    - Rare and ultra-rare disease specialists globally
    - Shows the scale of infrastructure that can support multiple niche launches
    - Not a direct NPC competitor or direct efficacy comparator
  - - Amicus Therapeutics
    - Adjacent rare-disease benchmark
    - $4.54B market cap; rare-disease-focused public company
    - Rare-disease clinicians, patients, and payers
    - Benchmark for sustainable public-market support in narrow indications
    - Sparse retained official detail on current product mix in this pack
  - - BioMarin
    - Adjacent rare-disease benchmark
    - Nine commercial therapies plus strong clinical and preclinical pipeline
    - Genetically defined rare-disease patients and specialists
    - Shows what repeat commercialization looks like in orphan biotech
    - Not specific to NPC or cholesterol-trafficking biology
  - - Biogen
    - Adjacent scale benchmark
    - $30.96B market cap; neurology, immunology, and rare-disease reach
    - Large neurology and rare-disease prescriber base
    - Demonstrates the distribution and medical scale that can compress smaller launches
    - Far broader enterprise than a focused NPC company
  - - Krystal Biotech
    - Adjacent execution benchmark
    - $10.95B market cap; commercialization plus two GMP facilities
    - Patients with severe genetic diseases and specialist prescribers
    - Manufacturing ownership highlights infrastructure depth that supports a moat
    - Different modality and not a direct NPC substitute
  notes: Rows mix direct NPC rivals with adjacent rare-disease benchmarks because Beren must beat both current label competition and the higher commercialization bar set by successful orphan-drug operators.
