  - type: private-evidence-only
    severity: material
    topic: moat-proof
    missingEvidence: Head-to-head clinician feedback, site-adoption plans, and reimbursement positioning showing why adrabetadex would displace or complement the approved oral therapies in practice.
    whyItMatters: Beren’s moat depends on real prescribing behavior, not only on mechanistic narratives or sponsor-presented efficacy summaries.
    diligencePath: Interview metabolic specialists, treatment centers, and advocacy leaders; request planned launch segmentation and payer materials.
