  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Public or diligence-only list price, net price, reimbursement, and gross-to-net data for MIPLYFFA, AQNEURSA, and any eventual adrabetadex launch package.
    whyItMatters: Without economics, it is impossible to underwrite whether label differences or support programs translate into superior realized pricing power.
    diligencePath: Request payer decks, hub-services budgets, gross-to-net assumptions, and any public WAC filings or conference disclosures.
