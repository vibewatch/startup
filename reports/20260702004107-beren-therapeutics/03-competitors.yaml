company:
  name: Beren Therapeutics
chapter:
  number: 3
  title: Competitors
  summary: 'Beren is not entering an empty NPC market: Zevra already commercializes MIPLYFFA, IntraBio markets AQNEURSA as a stand-alone oral option, and Cyclo still positions Trappsol Cyclo as a phase 3 competitor in the same disease. Adrabetadex therefore competes less on first-mover status than on whether its intrathecal cyclodextrin approach can justify higher operational burden with stronger disease-modifying value in infantile-onset NPC, while Beren also builds commercial and community infrastructure that starts far below adjacent rare-disease benchmarks such as Ultragenyx, Amicus, Biogen, Krystal, and BioMarin.'
sections:
- id: direct-npc-landscape
  title: 'Direct NPC landscape: approved oral rivals, cyclodextrin peers, and residual status quo care'
  body: |-
    Beren’s direct field is already crowded enough to remove any first-mover narrative. The clearest approved competitors are Zevra’s MIPLYFFA and IntraBio’s AQNEURSA, both branded around neurological manifestations of Niemann-Pick disease type C. MIPLYFFA’s label is specifically tied to concomitant miglustat use and Zevra now wraps the product inside a broader rare-disease company with a public market cap and a named patient-support program. AQNEURSA counters with the cleanest convenience story in the public pack: sponsor materials repeatedly frame it as the only FDA-approved stand-alone therapy for NPC, supported by a pivotal crossover trial and an oral formulation that can also be given by G-tube with weight-based dosing. Those facts give clinicians and families two already-commercial oral choices before adrabetadex is approved.

    The direct substitute set is broader than those two labels. Cyclo Therapeutics still presents TransportNPC phase 3 work, Trappsol Cyclo, and expanded access on its official site, which keeps a second cyclodextrin program in view for the same disease even without current approval. Historical status quo care has also not disappeared: PubMed’s 2021 U.S. prevalence work documents that miglustat was used off-label for NPC when no U.S. therapy was approved, and supportive care remains the fallback wherever branded options are inaccessible or unsuitable. Beren’s own APMRF materials reinforce that the market may settle into combination and sequencing rather than winner-take-all displacement, because the company is already discussing adrabetadex alongside arimoclomol and levacetylleucine in real-world and preclinical contexts.
