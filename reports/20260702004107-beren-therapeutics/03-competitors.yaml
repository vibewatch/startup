- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence
  - Mitigation / diligence ask
  rows:
  - - Disease-modifying differentiation in infantile-onset NPC
    - Approved oral therapies already cover neurological manifestations and may satisfy some families with easier administration
    - High
    - MIPLYFFA and AQNEURSA are approved now, while adrabetadex is not
    - Ask for head-to-head rationale, subgroup durability, and site-level switching criteria
  - - Foundational-combination role
    - Combination framing can expand use but may also cap monotherapy pricing power if Beren becomes one component of a regimen
    - Medium
    - Beren is already discussing adrabetadex alongside arimoclomol and levacetylleucine
    - Model economics for layered use rather than winner-take-all share
  - - Commercial and community intimacy
    - Zevra already markets support services and has first-mover presence with prescribers and families
    - High
    - AmplifyAssist is live; Beren support programs are still pre-launch buildout
    - Pressure-test referral pathways, named centers, and advocacy relationships before assuming rapid uptake
  - - Cyclodextrin leadership
    - Trappsol Cyclo keeps another cyclodextrin narrative alive and could dilute uniqueness if clinical evidence converges
    - Medium
    - Cyclo still advertises TransportNPC phase 3 and expanded access
    - Track TransportNPC timing and whether mechanistic closeness turns into real commercial overlap
  - - Rare-disease launch scalability
    - Adjacent benchmarks show moat durability usually comes with manufacturing and multi-product infrastructure Beren does not yet have
    - High
    - Ultragenyx, BioMarin, Biogen, and Krystal all signal far deeper platform scale
    - Ask what functions Beren owns versus outsources across medical, supply, and access
  - - Regulatory execution credibility
    - Timeline slippage and the asset’s prior clinical failure history raise execution risk even if current data look encouraging
    - High
    - FDA extended review in 2026 and Fierce recapped the earlier 2018 phase 2/3 failure under prior ownership
    - Demand a clean explanation of amendment scope, remaining review risk, and post-approval study expectations
  notes: Severity reflects likely impact on adoption, pricing power, or launch durability rather than a view on scientific promise alone.
