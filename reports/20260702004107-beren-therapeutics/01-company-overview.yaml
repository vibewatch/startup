  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-composition
    missingEvidence: A current board roster, committee structure, and ownership-linked governance map beyond Jason Camm’s disclosed director role.
    whyItMatters: Governance concentration and investor control cannot be judged cleanly from executive biographies alone.
    diligencePath: Request the current board list, observer rights, and governance summary from management or lead investors.
    relatedQuestionRefs:
    - QO008
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: valuation-disclosure
    missingEvidence: A current valuation mark tied to the June 2026 financing or any later board-approved fair-value reference.
    whyItMatters: Without a valuation anchor, it is impossible to connect financing size to dilution, investor conviction, or relative pricing.
    diligencePath: Request the financing deck, signed term sheet, or cap-table summary showing price per share and post-money valuation.
    relatedQuestionRefs:
    - QO016
  - type: private-evidence-only
    severity: material
    topic: operating-scale-metrics
    missingEvidence: Current revenue, customer count, and headcount figures or a formal statement that the company remains pre-revenue with no relevant commercial metrics.
    whyItMatters: Standard company-overview cover metrics remain incomplete without operating-scale disclosure, which weakens benchmarking across peers.
    diligencePath: Request internal KPI dashboards or management commentary covering headcount, burn, revenue, commercial staffing, and customer analogs.
    relatedQuestionRefs:
    - QO017
  - type: private-evidence-only
    severity: material
    topic: stakeholder-map-incomplete
    missingEvidence: Ownership percentages, governance rights, draw conditions, and any strategic side letters tied to the named investor and lender syndicate.
    whyItMatters: The public map names stakeholders but does not reveal who controls economics, downside protection, or formal decision rights.
    diligencePath: Obtain the cap table, investor-rights agreement, debt term sheet, and any commercial or board-right side letters.
    relatedTableRefs:
    - TO003
