company:
  name: Beren Therapeutics
chapter:
  number: 1
  title: Company Overview
  summary: Beren Therapeutics is a 2020-founded public benefit biotech headquartered in Thousand Oaks and now publicly centered on adrabetadex, a cyclodextrin program for infantile-onset NPC, with a visibly expanded leadership bench and a June 2026 $300 million financing package. The strongest public positives are the named investor and patient-support buildout around a late-stage regulatory asset; the strongest negatives are a parked legacy domain, a three-month FDA review extension, the asset's rescinded historical Breakthrough designation under a prior sponsor, and limited public disclosure on valuation, revenue, customer count, and headcount.
sections:
- id: identity-model-and-web-presence
  title: Identity, business model, and canonical web presence
  body: 'Beren Therapeutics now presents itself through berentx.com, not through the user-supplied berentherapeutics.com domain. That distinction matters because current official materials repeatedly direct readers to BerenTx.com, while the legacy domain no longer behaves like a normal corporate site. The root berentherapeutics.com page returns only a tiny JavaScript redirect shell, and the redirected /lander page loads GoDaddy parking-lander assets instead of company content. That is a small but real diligence blemish: it does not undermine the underlying business, but it does create avoidable brand and trust friction at the top of the funnel.


    On the substance, the company is clearer than the domain hygiene. Beren''s home, company, science, and financing materials consistently describe the business as a public benefit corporation founded in 2020, headquartered in Thousand Oaks, and focused on cyclodextrin-based therapeutics for diseases of defective cholesterol trafficking. The official story is founder-led and vertically integrated: discovery, development, access planning, and eventual commercialization are all framed as part of one patient-aligned operating model rather than as a licensing-only biotech. Publicly, that model is still concentrated around one lead asset. Adrabetadex is the first named program, the first launch candidate, and the main reason the current company profile exists at all. The result is a coherent identity—rare-disease, cholesterol-trafficking, founder-led, patient-aligned—but one whose public face is still far more mature on mission and positioning than on portfolio breadth.'
