- id: precommercial-adoption-proof
  title: Current adoption proof is real, but it is precommercial and community-centered
  body: 'The strongest evidence that Beren has genuine stakeholder traction today is not a booked-revenue figure or a disclosed prescriber base; it is the persistence of an expanded-access and community-engagement apparatus that predates approval. The February 2026 webinar says more than 60 patients are enrolled in the Expanded Access Program, and multiple company and wire releases say the program continues during FDA review. The news archive also shows a sustained cadence of community updates across 2023, 2025, and 2026, plus conference participation with NNPDF, INPDA, APMRF, and registry partners. Those are meaningful proof points because they show repeated engagement with families, clinicians, and advocacy organizations over time. But they still stop short of conventional commercial adoption evidence: the public pack does not disclose paid patient counts, activated treatment centers, payer contracts, or retention metrics. The customer base is therefore visible as a care-and-access network,
    not yet as a mature commercial franchise.'
