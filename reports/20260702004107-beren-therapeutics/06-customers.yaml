- id: FU002
  title: Adoption / deployment flow
  type: flow
  layout: wide
  summary: Traces the operational path from underdiagnosed disease burden to a durable treated-user base, highlighting where referral and center readiness can stall adoption.
  data:
    nodes:
    - id: need
      label: Underdiagnosed need
      detail: NPC is ultra-rare and often misdiagnosed or undiagnosed, so the true pool is larger than the currently identified treated population.
    - id: diagnosis
      label: Diagnosis / specialist confirmation
      detail: Families need specialist suspicion, testing, and clinical confirmation before treatment options can be considered.
    - id: referral
      label: Referral / information path
      detail: Beren routes families through treating physicians, care teams, community updates, and advocacy touchpoints rather than direct consumer enrollment.
    - id: center
      label: Center workflow readiness
      detail: Potential adrabetadex recipients still require treatment-center workflow setup, logistics, monitoring, and case-management support.
    - id: continuity
      label: Treated-user continuity
      detail: The visible proof today is EAP continuity plus broader support planning; post-approval durability metrics remain undisclosed.
    edges:
    - from: need
      to: diagnosis
      label: awareness + testing
    - from: diagnosis
      to: referral
      label: physician / caregiver routing
    - from: referral
      to: center
      label: eligibility + logistics
    - from: center
      to: continuity
      label: ongoing care + support
