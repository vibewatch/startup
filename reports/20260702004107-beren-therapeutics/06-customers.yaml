figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Shows the stakeholder path from suspicion and diagnosis through referral, center workflow, treatment continuity, and post-approval support needs.
  data:
    items:
    - label: Symptoms / diagnostic odyssey
      note: Families and community physicians face an often-misdiagnosed rare disease; diagnosis delay is a core adoption bottleneck.
    - label: Specialist suspicion and testing
      note: Genetic testing, clinical evaluation, and specialist recognition move the patient from uncertainty toward confirmed NPC and subtype framing.
    - label: Referral into Beren / EAP information path
      note: Families are directed through treating physicians and care teams, with Beren community updates, advocacy channels, and case-management concepts reducing friction.
    - label: Center workflow and eligibility
      note: Treatment centers need workflow readiness, monitoring, and logistics support before an intrathecal therapy can be delivered at scale.
    - label: Ongoing treatment continuity
      note: Current proof comes from EAP continuity, caregiver support, monitoring burden, and repeated communications rather than from commercial retention metrics.
    - label: Post-approval expansion loop
      note: If approved, expansion depends on faster diagnosis, local sites of care, payer clearance, real-world evidence, and peer learning rather than on broad consumer marketing.
