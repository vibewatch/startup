  evidenceGaps:
  - type: missing-source
    severity: material
    topic: commercial-metrics
    missingEvidence: Public disclosure of paid patient counts, prescriber counts, activated site counts, and any commercial revenue or utilization metrics for adrabetadex.
    whyItMatters: Without those denominators, the chapter can only call the current customer proof qualitative and precommercial.
    diligencePath: Request launch dashboards or board-level commercialization KPIs covering treated patients, active sites, prescribers, and revenue cadence.
    relatedQuestionRefs:
    - QU005
    - QU015
    - QU016
    relatedTableRefs:
    - TU002
    - TU004
  - type: private-evidence-only
    severity: material
    topic: eap-persistence
    missingEvidence: Persistence, discontinuation, interruption, and caregiver-satisfaction data for the current EAP cohort.
    whyItMatters: Continuity of care is a central part of Beren’s value proposition, but the public record does not show whether treated families remain on therapy or with what burden.
    diligencePath: Ask for EAP retention tables, discontinuation reasons, safety-related pauses, and any family-feedback or burden-of-care metrics.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: payer-visibility
    missingEvidence: Named payer relationships, early coverage planning, reimbursement pathways, or economic dossiers prepared for adrabetadex launch.
    whyItMatters: Payers and health systems are central customers or gatekeepers in this model, yet no public proof clarifies how launch access will actually be funded or authorized.
    diligencePath: Request market-access strategy documents, payer-advisory outputs, draft value dossiers, and any early coverage conversations by segment or geography.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: material
    topic: named-stakeholder-proof
    missingEvidence: A fuller named list of treatment centers, advocacy partners, or clinician references that materially interacted with Beren around adrabetadex.
    whyItMatters: The public proof table is currently built from EAP, advocacy, and registry examples because Beren has not published a broader customer-reference set.
    diligencePath: Request a stakeholder-reference pack with named centers, KOLs, advocacy groups, and their role in referral, treatment, or evidence generation.
    relatedQuestionRefs:
    - QU012
    - QU013
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: site-activation
    missingEvidence: Public or diligence-grade data on the number, location, readiness, and throughput of care sites able to support adrabetadex.
    whyItMatters: Site-of-care access is one of the clearest practical adoption bottlenecks for a monitoring-heavy intrathecal therapy in an ultra-rare disease.
    diligencePath: Ask for a center map, onboarding status, referral-to-dose timing, monitoring burden, and family travel assumptions by site.
    relatedQuestionRefs:
    - QU010
    - QU018
    relatedTableRefs:
    - TU005
