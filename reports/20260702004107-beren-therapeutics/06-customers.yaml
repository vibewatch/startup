callouts:
- calloutType: insight
  title: Best proof today is service design plus EAP continuity, not paid commercial scale
  body: Beren has real stakeholder proof because the company continues an expanded-access cohort, keeps a steady communication cadence with families and advocates, and is funding concrete support infrastructure. But the public record still behaves like a precommercial access story rather than a disclosed revenue engine.
  claimRefs:
  - CU013
  - CU016
  - CU019
  - CU020
  - CU027
  - CU039
- calloutType: risk
  title: Diagnosis and site-of-care logistics are the biggest customer bottlenecks
  body: The hardest part of adoption is not explaining NPC to a broad market; it is finding the right patients early enough, routing them through specialist care teams, and supporting treatment centers that can manage intrathecal care and follow-up.
  claimRefs:
  - CU028
  - CU029
  - CU030
  - CU033
  - CU050
- calloutType: risk
  title: Approved oral competitors already define support expectations
  body: Even before adrabetadex launches, competitors have set a benchmark for branded physician/patient support and easier route-of-administration expectations. Beren must therefore win on service infrastructure and logistics in addition to any efficacy or mechanistic differentiation.
  claimRefs:
