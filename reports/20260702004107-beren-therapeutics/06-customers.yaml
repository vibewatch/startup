- id: durability-expansion-and-competition
  title: Durability and expansion are plausible, but public proof remains mostly qualitative
  body: 'If adrabetadex is approved, Beren does have visible expansion levers: converting EAP continuity into post-approval treatment, shortening diagnosis-to-referral times, reducing travel through local sites of care, and turning real-world evidence plus community learning into stronger physician and payer confidence. The June 2026 financing explicitly funds those workstreams, and the presence of dedicated commercial and patient-engagement leadership shows the company is preparing for them. Still, the adverse realities matter. Approved oral competitors already anchor current physician, patient, and payer expectations, and at least one competitor openly advertises education, insurance-coverage support, access support, and prescription fulfillment. Beren’s own public materials therefore argue for a thoughtful service model, but they do not yet disclose payer wins, conversion rates, NRR/GRR, or concentration by center or account. The underwriting stance for this chapter should be that Beren
    has stakeholder intent and some real operating proof, but not yet a disclosed durable customer engine. Public durability proof remains sparse today.'
