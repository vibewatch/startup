company:
  name: Beren Therapeutics
chapter:
  number: 6
  title: Customers
  summary: 'For Beren Therapeutics, the relevant "customer" base is a precommercial rare-disease stakeholder network rather than a disclosed revenue roster: families and caregivers seeking diagnosis and continuity of care, specialist clinicians and treatment centers managing intrathecal delivery, payers and health systems that will eventually authorize access, and advocacy/community groups that shape trust and referral flow. Public proof is strongest that Beren has built a real community-support and expanded-access motion around infantile-onset NPC, but weakest on classical customer metrics such as paid patient counts, activated site counts, payer wins, retention, or concentration by account; adoption still depends on diagnosis speed, referral logistics, and scarce site-of-care capacity.'
sections:
- id: stakeholder-map
  title: The relevant customers are families, specialists, centers, payers, and advocates
  body: 'Beren is not yet selling an approved mass-market product, so its customer map has to be framed around the people and institutions that determine whether an infantile-onset NPC patient can ever reach treatment. The company explicitly says it designs around patient communities, healthcare providers, and health systems, which fits the disease reality described by NORD and NINDS: NPC is ultra-rare, heterogeneous, often misdiagnosed, and clinically severe enough that families, metabolic neurologists, treatment centers, payers, and advocacy groups all matter at once. In practical terms, families and caregivers are the day-to-day users of support infrastructure, specialist clinicians and centers are the operational adopters, payers and health systems will become the economic gatekeepers after approval, and advocacy/registry groups are the trust and referral multipliers. That is why Beren’s customer language is less about logos or account counts and more about access, diagnosis, case management,
    and community partnership.'
