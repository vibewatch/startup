tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - What Beren is solving today
  - Public proof of engagement
  - Gap before commercial proof
  rows:
  - - Patients and families
    - Users and coordinators of care; eventual therapy seekers
    - Shorten diagnosis, simplify logistics, preserve continuity, reduce travel burden
    - Patients page, webinar, and 2026 support update all speak directly to family navigation needs
    - No public paid-patient count, satisfaction score, or conversion data
  - - Specialist clinicians and treatment centers
    - Metabolic neurologists, rare-disease pediatric teams, infusion / intrathecal-capable centers
    - Establish referral, eligibility, treatment-center workflows, monitoring, and evidence-sharing channels
    - Medical-affairs site, APMRF posters, EAP continuity messaging, and workflow-building language
    - No public activated-site list, site count, or referral-to-dose timing
  - - Payers and health systems
    - Future reimbursement gatekeepers rather than current disclosed buyers
    - Prepare coverage narrative around severe unmet need, early intervention, and high-touch care
    - Company says it integrates health-system needs and is investing in access infrastructure
    - No named payer wins, policy coverage decisions, or reimbursement contracts disclosed
  - - Advocacy, registry, and community organizations
    - Trust multipliers, referral channels, and longitudinal evidence partners
    - Sustain communication, peer connection, conference participation, and registry learning
    - NNPDF webinar partnership, APMRF participation, INPDR registry access, AbbyStrong quote
    - These proofs show trust and engagement, not commercial revenue durability
  - - Expanded-access participants
    - Current treated-user cohort before approval
    - Maintain continuity of care and transition path if approved
    - Webinar says more than 60 patients are currently enrolled in EAP
    - No public persistence, discontinuation, or geography data
  notes: 'This segmentation treats “customers” appropriately for a precommercial rare-disease biotech: the adoption network spans families, specialists, centers, payers, advocacy groups, and EAP participants rather than a conventional revenue roster.'
