- id: diagnosis-and-referral-frictions
  title: Diagnosis speed, referral logistics, and site-of-care readiness are the real adoption bottlenecks
  body: 'Beren’s support strategy makes sense because the core customer problem in infantile NPC is not simple awareness. Public disease references repeatedly say many cases are misdiagnosed or undiagnosed, many physicians have limited direct NPC experience, and the disease burden includes swallowing, movement, hearing, and multisystem decline that require specialist management. Beren’s own 2026 support materials focus on faster diagnosis, rare-disease case management, local access to sites of care, real-world evidence, and peer learning. The webinar also says treatment centers still need help establishing workflows for potential adrabetadex recipients, while families are told to work through treating physicians and care teams rather than self-service channels. The result is a high-friction adoption path: diagnosis has to happen sooner, referral has to route into a capable center, and the center has to support an intrathecal therapy with monitoring and continuity obligations. That makes
    site-of-care scarcity and coordinator burden central customer risks even before payer access enters the picture.'
