  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - factor
      - direction
      - timing
      - implication for GlossGenius
      - diligence ask
    rows:
      - - Beauty occupation employment growth (BLS 2024–34 projections; 5–15% across categories)
        - Tailwind
        - Structural / long-term
        - Expanding practitioner base increases total addressable units year over year
        - Confirm new-cohort acquisition CAC relative to existing-cohort retention
      - - Medspa market expansion (10,488 US locations in 2023; +18% from 2022)
        - Tailwind
        - Current / near-term
        - High-ARPU segment growing rapidly; Platinum plan directly targets this vertical
        - Validate conversion rate of medspa inquiries to Platinum plan activations
      - - Gen Z / Millennial digital booking expectations
        - Tailwind
        - Current / near-term
        - Rising consumer expectation for online booking creates pull demand from stylists
        - Measure what share of GlossGenius new customer activations originate from consumer booking demand
      - - Global beauty products market expansion ($88.20B, 7% CAGR per GVR 2025)
        - Tailwind
        - Structural / long-term
        - Broader sector vitality supports service business formation and expansion
        - Secondary indicator only; does not directly drive software adoption
      - - Consumer spending restraint (Morgan Stanley outlook; SBDC 2025 analysis)
        - Headwind
        - Current / near-term
        - Lower discretionary spend reduces frequency of salon visits; pressures operator revenue and capex
        - Monitor GlossGenius gross payment volume trend vs. prior periods
      - - Tariff-driven cost inflation (imported goods; 2025)
        - Headwind
        - Current / near-term
        - Rising input costs compress operator margins; new software subscriptions deprioritized
        - Track how tariff-related cost escalation affects churn in Standard plan cohort
      - - Free-tier competition (Square Appointments, Fresha zero-cost plans)
        - Headwind
        - Current / ongoing
        - Structural pricing floor limits GlossGenius's upward pricing power at entry tier
        - Assess switching triggers and NPS gap between GlossGenius and free alternatives
      - - Booth-rental and independent-contractor structural fragmentation
        - Mixed
        - Structural / ongoing
        - Large solo-operator TAM but lower ARPU ceiling; high churn risk when renter relocates
        - Quantify booth-renter share of customer base and their churn vs. salon-owner cohorts
    notes: >-
      All timing assessments are based on publicly available economic data as of June 2026.
      Morgan Stanley consumer spending projection and tariff data are cited via SBDC aggregation and
      BLS CPI; independent Morgan Stanley report was not directly accessed.
