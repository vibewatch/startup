callouts:
  - calloutType: risk
    title: Divergent software market size estimates cannot be reconciled without paywalled reports
    body: >-
      MarketsAndMarkets and Allied Market Research estimates for the beauty/salon software market diverge
      by more than a factor of twelve ($803M vs. $9.74B, both by 2030 projections). Without accessing
      the full underlying reports—both behind paywalls—the divergence cannot be attributed to scope,
      methodology, or data quality differences. This gap is a material diligence risk: the software market
      narrative in growth-equity investment theses often relies on analyst TAM estimates that have not
      been independently validated.
    claimRefs:
      - CM022
      - CM023

  - calloutType: risk
    title: Consumer spending restraint is the most immediate near-term headwind
    body: >-
      SBDC's 2025 beauty industry analysis explicitly flags early signs of consumer restraint in salon
      spending, backed by Morgan Stanley's consumer spending outlook and Bank of America spending data.
      Lower-to-middle income consumers—the core routine-service demographic—are projected to reduce
      discretionary spending first. If beauty service frequency declines, operator revenue falls, reducing
      willingness to invest in software subscriptions or new payment tools.
    claimRefs:
      - CM036
      - CM037
      - CM038

  - calloutType: insight
    title: Medical spa sub-segment offers the highest ARPU and fastest unit-count growth
    body: >-
      US medical spas grew from 8,899 to 10,488 locations in a single year (2022–2023), representing
      an 18% increase. With 81% single-location operators, the structural profile mirrors the independent
      salon market but at materially higher willingness to pay. GlossGenius's Platinum plan with HIPAA
      compliance directly addresses the medspa segment's regulatory requirements, potentially enabling
      higher ARPU extraction than from the core hair and nail segments.
    claimRefs:
      - CM018
      - CM019
      - CM020
      - CM021
      - CM027

