  - id: section-2
    title: Market sizing—services spend, business population, and software opportunity
    body: >
      No single authoritative source covers total US personal care services revenue across all NAICS 8121
      sub-segments. Multiple sizing lenses are required. First Research, cited by SBDC (2025), estimates the
      US hair care services sub-segment alone at approximately $25 billion across roughly 84,000 establishments.
      Adding BLS-implied revenues for nail care, massage therapy, skincare, and medical aesthetics, a bottom-up
      cross-segment estimate places total US personal care services revenue in the range of $45–85 billion,
      depending on whether medical spas, fitness-adjacent wellness, and salon retail are included.

      From a consumer-spending lens, the BLS Consumer Expenditure Survey 2024 reports average annual household
      spending of $978 on personal care products and services combined; scaled across 135.76 million consumer
      units, this implies approximately $133 billion in total personal care spending, though the majority
      represents home-use products rather than professional services.

      The software and payments platform opportunity is sized separately. Approximately 270,000 establishments
      operate in NAICS 812 (personal care and laundry services, per BLS iag812 2025); a conservative estimate
      of 500,000–700,000 total addressable units—including solo operators working outside traditional brick-
      and-mortar—at an average $2,500–$4,000 per year in combined subscription and payments fees yields a
      software-plus-payments TAM of $1.25–$2.8 billion. GlossGenius's self-reported 100,000+ customers at
      roughly $1,000 average ARPU (implied by ~$100M ARR) implies current penetration of approximately 14–20%
      of the software-addressable market, corroborating the TAM upper bound.

      The global appointment scheduling software market (a narrower category) was estimated at $342.3 million
      in 2023 by MarketsAndMarkets, growing at 13.8% CAGR to $803.7 million by 2030. A separate Allied Market
      Research press release placed the global salon management software market at $9.74 billion by 2030—a
      twelve-fold divergence that reflects fundamentally different scope definitions and is treated with low
      confidence without access to underlying methodology.
