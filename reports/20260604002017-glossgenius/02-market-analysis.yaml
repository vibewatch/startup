company:
  name: GlossGenius
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    GlossGenius operates in the US personal care services SMB market—hair salons, barbershops, nail salons,
    day spas, massage practices, and medical spas—a structurally fragmented industry of approximately 270,000
    establishments and over one million workers (BLS, 2025). Hair care services alone generate roughly $25 billion
    in annual US revenue (First Research via SBDC); the broader personal care services industry is estimated at
    $45–85 billion depending on boundary assumptions, with no single authoritative total. The software and
    payments TAM for US beauty and wellness SMBs is estimated at $1–2 billion based on addressable business
    population and willingness-to-pay proxies; GlossGenius's 100,000+ customers at approximately $1,000 annual
    ARPU implies roughly 14–20% penetration of the software-addressable market. Growth is driven by strong
    employment projections (5–15% across beauty occupations through 2034), medspa expansion (+18% new locations
    in 2023 alone), and Gen Z digital booking expectations. Consumer-spending restraint, tariff-driven cost
    inflation, and competition from free-tier alternatives (Square, Fresha) are the primary near-term constraints.
    Analyst estimates for the software sub-market span more than an order of magnitude across sources and are
    treated with low confidence in this analysis.

sections:
  - id: section-1
    title: Market boundary and definition
    body: >
      GlossGenius's addressable market is the population of US personal care services businesses that operate
      appointment-based workflows and handle client payments—encompassing hair salons, barbershops, nail salons,
      day spas, massage therapy practices, skincare studios, and medical spas. These businesses are classified
      primarily under US Census NAICS code 8121 (Personal Care Services), which itself subdivides into barbershops
      and hair salons (812111/812112), other personal care services (81219), and nail salons (812113). Medical
      spas straddle NAICS 8121 and healthcare services, depending on regulatory classification; GlossGenius
      explicitly includes them through its HIPAA-compliant Platinum plan.

      Included spend categories span three buckets: platform subscription fees (the $24–$148 per month range),
      embedded payments processing at 2.6% of gross service revenue, and optional add-on modules (payroll,
      HIPAA compliance, invoicing). Excluded from the primary TAM are beauty product retail (NAICS 4461),
      enterprise salon chains with custom ERP systems, and informally operating professionals who do not use
      digital scheduling tools. Adjacent markets—fitness studios, tattoo parlors, pet grooming—use overlapping
      workflows but are served by distinct vertical competitors and are treated here as adjacencies rather
      than core TAM.

      The status-quo substitute set that GlossGenius displaces is meaningful: paper appointment books, generic
      calendar applications such as Google Calendar, manual phone-based scheduling, social-media DM booking
      (especially Instagram and Facebook), and no-software walk-in queuing at booth-rental locations. The
      persistence of these substitutes among the large self-employed portion of the workforce—76% of barbers
      and 48% of hairdressers are self-employed per BLS 2024 data—creates both addressable opportunity and
      inertia risk.
    claimRefs:
