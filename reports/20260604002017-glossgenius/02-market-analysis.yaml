  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing
      missingEvidence: >-
        No single authoritative source provides total annual US revenue for all personal care services
        (NAICS 8121) sub-segments combined. Hair care (~$25B) is available from First Research; nail,
        massage, skincare, and medspa sub-segments require separate estimates with high uncertainty.
      whyItMatters: >-
        Without a credible total market size, TAM calculations for GlossGenius rely on bottom-up
        estimates with wide uncertainty bands ($45–85B range), making it difficult to validate the
        company's market sizing claims or compare across investment theses.
      diligencePath: >-
        Obtain US Census Service Annual Survey (SAS) 2022 or 2023 NAICS 8121 revenue tables; commission
        or obtain IBISWorld full report for beauty salon industry; compare against BLS-derived bottom-up
        estimate.
      relatedQuestionRefs:
        - QM006
        - QM013
      relatedTableRefs:
        - TM002

    - type: conflicting-sources
      severity: material
      topic: software-market-sizing
      missingEvidence: >-
        MarketsAndMarkets and Allied Market Research estimates for the beauty or salon software market
        diverge by more than 12x ($803M vs. $9.74B, both projecting to 2030). Without access to the
        full underlying methodology for either report, the divergence cannot be attributed to scope
        differences, methodology, data quality, or market definition—making it impossible to select
        a credible TAM estimate for the software sub-market.
      whyItMatters: >-
        Software market TAM is the primary investability data point cited in beauty tech investment
        memos. A 12x range renders the estimate unusable without reconciliation. The Allied figure
        appears in press releases only and should be treated with extreme caution.
      diligencePath: >-
        Obtain full methodology and scope definition from both MarketsAndMarkets appointment scheduling
        report and Allied Market Research salon management software report; verify beauty-specific
        sub-segment share within the broader scheduling software market.
      relatedQuestionRefs:
        - QM014
        - QM008
      relatedTableRefs:
        - TM002

    - type: private-evidence-only
      severity: material
      topic: software-adoption
      missingEvidence: >-
        No publicly available source measures the actual penetration rate of dedicated beauty management
        software among US beauty professionals. The funnel stage estimates (50% awareness, 25% adoption)
        are inferred and have no independent benchmark.
      whyItMatters: >-
        The size of the software whitespace—the TAM not yet captured by any paid solution—determines
        whether GlossGenius's 100K customer base represents early innings or approaching saturation.
        Without adoption rate data, the remaining market opportunity cannot be reliably sized.
      diligencePath: >-
        Commission primary research survey of US beauty professionals on software tool usage; review
        any GlossGenius internal cohort data on geographic penetration rates; cross-check against
        Square market share and Fresha subscriber counts if disclosed.
      relatedQuestionRefs:
        - QM013
        - QM012
      relatedTableRefs:
        - TM002
      relatedFigureRefs:
        - FM004

    - type: missing-source
      severity: minor
      topic: consumer-spending
      missingEvidence: >-
        The BLS Consumer Expenditure Survey combines personal care products and services into a single
        $978/consumer-unit figure without disaggregating professional services from home-use products.
        The BEA personal income and outlays reports provide aggregate PCE services data but not a
        personal-care-services-only line.
      whyItMatters: >-
        Without a services-only personal care expenditure figure, the consumer-spending lens cannot
        independently validate the $25B hair care + other segment revenue estimates. The $133B combined
        figure overstates the professional services market by including retail product spending.
      diligencePath: >-
        Access BEA NIPA Table 2.4.5 (PCE by type of product, services detail) for personal care and
        health sub-categories; cross-check with IBISWorld revenue estimates for NAICS 8121 sub-segments.
      relatedQuestionRefs:
        - QM009
