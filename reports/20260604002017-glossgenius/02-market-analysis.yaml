  - id: section-4
    title: Growth drivers and adoption constraints
    body: >
      Four structural growth drivers support the beauty and wellness software market. First, employment growth
      across all beauty occupations is positive and sustained: BLS projects 5% growth for cosmetologists
      (2024–34), 7% for manicurists and estheticians, and 15% for massage therapists—the single fastest-growing
      personal care occupation. New practitioners entering the market represent incremental software adoption
      opportunities as they establish independent practices. Second, the medical spa segment is expanding
      rapidly: AmSpa data shows US medspa locations rose from 8,899 in 2022 to 10,488 in 2023, a net addition
      of approximately 1,600 new facilities in a single year—each a potential software customer with higher
      willingness to pay. Third, digital booking expectations are rising across generational cohorts, with Gen Z
      and Millennial consumers demanding social media visibility and online booking as table stakes. Fourth,
      the global beauty and personal care products market—a proxy for overall sector vitality—was estimated at
      $88.20 billion globally in 2025 by GVR, growing at 7.0% CAGR.

      Against these drivers, three adoption constraints are material. Consumer spending pressure is the most
      immediate: SBDC's 2025 analysis explicitly identifies early signs of consumer restraint in the salon
      industry, with Morgan Stanley projecting US consumer spending growth to ease, most severely affecting
      lower-to-middle income consumers who represent the core salon-services demographic. Rising tariff costs
      in 2025 are compressing operator margins, reducing their capacity to invest in new software platforms.
      Competitive free-tier alternatives—Square Appointments and Fresha both offer zero-cost entry plans—
      create structural pricing pressure on GlossGenius's $24/month Standard tier. Switching cost within
      beauty software is real (client databases, payment history, booking logic) but not prohibitive, particularly
      for solopreneurs early in their booking-tool adoption journey.
