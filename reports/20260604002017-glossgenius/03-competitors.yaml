  - id: section-4
    title: Moat durability and displacement risks
    body: >
      GlossGenius's durable competitive advantages cluster around three dimensions: (1) brand equity with
      beauty and wellness professionals who associate the platform with premium mobile UX and simplicity;
      (2) integrated payroll processing, which creates an accounting and tax-filing dependency that makes
      switching operationally costly during payroll cycles; and (3) beauty-native data formatting, including
      client photos, service history, and custom intake forms tailored to beauty workflows.

      The primary displacement risk is commoditization of core scheduling and payment functionality.
      Square's free tier, Fresha's low-cost model, and Vagaro's all-inclusive mid-market plan all deliver
      scheduling, payments, and basic marketing at a price that challenges GlossGenius's value proposition
      for early-stage solopreneurs. If a new stylist's first digital tool is Square (free) or Fresha
      (~$20/mo), GlossGenius must earn that professional's business later—against brand inertia and
      embedded workflows.

      A secondary risk is upmarket displacement from Boulevard and Mindbody. As GlossGenius expands its
      team management and medspa features to capture larger clients, it increasingly competes with Boulevard's
      purpose-built multi-provider and ePrescribe toolchain—and against Mindbody's dominant brand recognition
      in the gym-and-spa enterprise segment. Boulevard's 12-month contract structure and $140–$328/mo
      price point reflect willingness-to-pay in the premium-salon segment that GlossGenius can only address
      at scale via its Platinum plan.

      The weakest moat element is the lack of a proprietary distribution channel. Vagaro, Booksy, and
      Fresha all have consumer-side network effects: each new consumer on the platform creates marginal
      value for existing professionals. GlossGenius's network effects are limited to referral traffic
      from its booking page and the Fast Company Most Innovative Companies 2024 brand signal—a soft
      competitive advantage that is not defensible against platform-side incumbents.
