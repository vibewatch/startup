  - id: section-6
    title: Strategic outlook and diligence asks
    body: >
      The competitive dynamics over the next 12–24 months hinge on three pivots: whether Fresha sustains
      its marketplace scale post-pricing-change (upside for GlossGenius if Fresha bleeds professionals),
      whether Square launches beauty-specific tooling that closes GlossGenius's UX advantage (downside),
      and whether GlossGenius develops or acquires a consumer-discovery capability (transformational upside
      if executed). Booksy's $120M in disclosed funding and $65.9M 2024 revenue suggest a better-capitalized
      international peer, but Booksy's broader geographic diversification and barbershop-heavy mix means
      direct overlap with GlossGenius's premium-salon base is partial rather than total.

      Key diligence asks: (1) What share of GlossGenius's churned accounts migrate to Fresha vs. Vagaro
      vs. Square? Churn-destination data would quantify the most acute displacement vector. (2) Has
      GlossGenius piloted or evaluated a marketplace or demand-generation feature, and what were the
      product or business model obstacles? (3) What is GlossGenius's multi-location customer count and
      ARPU relative to single-location accounts? This would clarify whether upmarket expansion meaningfully
      improves unit economics or creates support complexity without revenue uplift.

      Boulevard is the most analogous premium-positioning competitor and warrants a detailed pricing audit
      before any GlossGenius financial projection assumes defensible ARPU at the medspa tier. If Boulevard
      is successfully retaining medspas at $234–$328/mo with ePrescribe, GlossGenius's Platinum plan at
      $148/mo may be structurally under-priced, or it may be correctly priced for a mass-market medspa
      tier that Boulevard's enterprise approach cannot reach efficiently.
