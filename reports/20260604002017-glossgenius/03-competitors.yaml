  - id: section-5
    title: Switching costs and lock-in analysis
    body: >
      Switching costs in beauty software are moderate and asymmetric. Professional-side data—client
      contact lists, appointment history, formulation notes, and payment records—is held in the platform
      and is not trivially portable. GlossGenius provides CSV export for basic client data, but photo
      archives and service-history notes are not easily ingested by competing platforms without manual
      re-entry. This data portability friction is the most concrete lock-in mechanism.

      Payroll lock-in is higher than for scheduling alone. Professionals using GlossGenius's integrated
      payroll module must reconcile historical payroll records, tax filings, and W-2/1099 artifacts before
      switching—a meaningful mid-year deterrent. Boulevard and Mindbody also offer payroll integrations
      at higher price points, but neither Fresha nor Booksy currently competes on embedded payroll.

      Consumer-side switching costs are low by design: beauty consumers are accustomed to booking via
      multiple platforms (multi-homing is the norm in barbershop and hair salon booking). Booksy, Fresha,
      and Vagaro all allow consumers to book any professional on their marketplace, so a consumer does
      not change behavior when a professional switches platforms—they simply find the professional on the
      new platform. This structural characteristic means GlossGenius cannot leverage consumer lock-in
      as a retention mechanism for its professional subscriber base.

      Operational inertia—staff training, front-desk workflows, reminder templates—provides low-to-medium
      switching resistance that delays but does not prevent competitive loss. Salons that have custom-built
      onboarding flows, intake forms, and rebooking automations around GlossGenius's interface face a
      non-trivial migration cost, but this resistance typically erodes when a compelling price or feature
      advantage appears on a competitor platform.
    claimRefs:
      - CP033
      - CP034
      - CP035
      - CP036
