callouts:
  - calloutType: strength
    title: Solo-Operator NPS Proxy Is Industry-Leading
    body: >-
      GlossGenius's 4.8/5 SoftwareAdvice rating with 76% five-star reviews and 4.5/5 on
      3,800+ App Store ratings represents unusually high satisfaction density for a vertical
      SaaS product. Multiple switching testimonials (from Vagaro, Square, Mangomint) confirm
      durable retention among its core solo-professional base.
    claimRefs:
      - CU023
      - CU024
      - CU025

  - calloutType: risk
    title: Solo Concentration Caps ARPU and Creates Churn Sensitivity
    body: >-
      GlossGenius's customer base is structurally concentrated in solo operators and sub-10
      teams—the highest churn-risk segment in vertical SaaS. Solo professionals are more
      susceptible to business closures, career pivots, and competitor price wars (Fresha
      offers a free tier). This limits upward ARPU pressure and creates downward risk if
      the US personal-services economy contracts.
    claimRefs:
      - CU031
      - CU033
      - CU036

  - calloutType: insight
    title: Wider-Vertical Expansion Is a Double-Edged Signal
    body: >-
      GlossGenius's addition of chiropractors, personal trainers, yoga studios, and medical
      weight-loss clinics to its specialty list suggests intentional TAM expansion beyond
      core beauty. However, no named customer proof and no dedicated feature pages for these
      verticals were located; the expansion may be aspirational marketing rather than
      substantive product differentiation for those segments.
    claimRefs:
      - CU003
      - CU004
      - CU034

  - calloutType: risk
    title: Adverse Reviews Reveal Reliability and Scalability Gaps
    body: >-
      A minority of SoftwareAdvice reviews report appointment data loss, unreliable SMS
      reminders, and card reader failures with slow support response (ticket-based, 1–2 day
      SLA). While representing fewer than 3% of total reviews, these complaints indicate
      non-trivial operational risk for businesses where a missed reminder or lost booking
      is directly revenue-impacting.
    claimRefs:
      - CU028
      - CU029
      - CU030

