chapter:
  number: 6
  title: Customers
  summary: >-
    GlossGenius serves 120,000+ beauty, wellness, and health professionals—primarily
    solo operators and small teams in the US—across 18+ specialty verticals including
    hairstylists, nail artists, estheticians, barbers, lash techs, and medspa practitioners.
    The platform earns strong satisfaction scores (4.5/5 App Store, 4.8/5 SoftwareAdvice)
    from its core solo-professional base, with named customer testimonials citing dramatic
    revenue gains and time savings. Its design centers on solopreneurs and sub-10-person
    teams; feature gaps, per-seat pricing structures, and limited multi-location support
    constrain appeal to larger operators, implying a ceiling on upmarket expansion.

sections:
  - id: customer-profile-segmentation
    title: Customer Profile and Segmentation
    body: >-
      GlossGenius targets beauty, wellness, and health service professionals operating in the
      US. As of 2026 the company states it serves 120,000+ businesses, and its About page
      references 100,000+ owners—figures that likely reflect different measurement points
      (business accounts vs. individual owner-operators). The platform explicitly addresses
      18 specialty verticals: hairdressers, barbers, estheticians, lash technicians, nail
      artists, makeup artists, massage therapists, medspa and aesthetics practitioners,
      chiropractors, acupuncturists, brow artists, behavioral therapists, personal trainers,
      tanning artists, tattoo and piercing artists, sports coaches, yoga studios, and medical
      weight-loss clinics. This breadth is notable, but hair-adjacent professionals
      (hairdressers, barbers, estheticians, lash and nail techs) historically dominate
      beauty-software adoption and are presumed to represent the largest GlossGenius
      revenue concentration given their prevalence in the addressable market.

      GlossGenius organizes its product around four roles: solo professionals, booth renters,
      team members, and owners/managers. The solo-professional segment is the primary design
      target: the Standard plan at $24/month is described as "perfect for solopreneurs,"
      and the solo-professionals landing page positions GlossGenius as the "always-on partner
      built to give you an edge" for one-person operations. Booth renters are explicitly
      supported with payments routed directly to their bank accounts, independent of the
      studio owner's payroll. Teams of up to nine are served by the Gold plan ($48/month);
      teams of ten or more are served by the Platinum plan ($148/month). Independent reviewers
      consistently describe GlossGenius as weakest for larger teams, with one review
      platform noting that "limited team scheduling" is a material constraint and that the
      product is "designed primarily for solo professionals." The company operates exclusively
      in the US market; no international expansion is evidenced by website language, pricing,
      or press coverage.
