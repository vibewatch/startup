companyProfile:
  summary: >-
    GlossGenius is a New York-based vertical SaaS and embedded-payments platform built for appointment-based beauty and
    wellness businesses. Founded in 2016 by Danielle Cohen-Shohet and Leah Cohen-Shohet, the company has expanded from
    solo-provider scheduling software into a broader operating system spanning booking, POS, client CRM, marketing,
    payroll, memberships, embedded financial services, and AI-assisted growth tooling. Public evidence indicates that it
    serves more than 120,000 businesses, crossed $100M in ARR, and reached unicorn status in January 2026, but the key
    underwriting challenge remains limited disclosure on margin quality, retention, and cap-table terms.
