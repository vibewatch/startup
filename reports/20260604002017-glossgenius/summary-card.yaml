  topStrengths:
    - >-
      Real scale in a focused vertical: public sources support 120,000+ businesses, $100M+ ARR, billions in annual
      payment volume, and more than one million appointments per week.
    - >-
      Product breadth spans booking, POS, payments, CRM, marketing, payroll, memberships, financing, and emerging AI
      tools in one beauty-specific stack.
    - >-
      Founder-led, product-led growth without an outbound sales motion suggests strong founder-market fit and efficient
      distribution.
  topRisks:
    - >-
      Competitive pressure from Square, Vagaro, Fresha, Boulevard, Mindbody, Booksy, StyleSeat, and Acuity can compress
      pricing and weaken differentiation.
    - >-
      Public disclosure is thin on gross margin, churn, NRR, burn, runway, and the legal/economic terms of the Series D,
      limiting underwriting confidence.
    - >-
      The customer base skews to small beauty businesses that can churn or fail quickly in weaker consumer-spending
      periods.
    - Payment-processing dependence and app-platform / support-quality issues create operational and reputation risk.
  unresolvedGaps:
    - Exact current ARR, gross margin, burn, and runway remain undisclosed beyond a public $100M-plus ARR threshold.
    - >-
      Net revenue retention, logo churn, and customer mix across solo, team, medspa, and wellness cohorts are not
      public.
    - >-
      Series D lead investor identity, board rights, preferences, and full cap-table terms are not clearly disclosed in
      retained sources.
    - Geographic mix and penetration by city tier, urban density, or chain versus independent segment remain opaque.
