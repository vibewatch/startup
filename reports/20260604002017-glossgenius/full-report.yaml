  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Competitive Intensity and Market Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              Competition is a first-order risk for GlossGenius because the company sits in the most crowded part of
              salon software: solo and microbusiness workflow tools. Square Appointments can onboard an individual
              provider at zero monthly subscription cost while offering a near-identical core payments rail, and Fresha
              still uses a zero-subscription framing that lowers the software price anchor for beauty operators. That
              means GlossGenius must justify paid software not against weak local incumbents, but against credible,
              well-distributed alternatives with either free entry points or stronger distribution. The risk is not only
              price. Booksy brings marketplace scale and customer-side network effects, while Boulevard and Mindbody are
              better positioned for larger or multi-location operators that GlossGenius would need to win to move
              upmarket. Independent reviews also describe GlossGenius as lighter on features than many rivals, which
              makes the product easier to love for solo users but harder to stretch into the larger-team segment. The
              competitive burden is amplified by valuation: after the 2026 Series D, any slowdown in customer additions
              or upmarket expansion creates pressure on both growth expectations and exit multiples.
            claimRefs:
