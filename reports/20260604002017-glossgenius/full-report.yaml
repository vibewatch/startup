      - number: '4.4'
        title: Capital structure, adequacy, and financing dependency
        blocks:
          - type: paragraph
            body: >
              GlossGenius closed its Series D on January 23, 2026—a $44 million round at $49.00 per share, implying a
              post-money valuation of approximately $1.12 billion (unicorn status). Forge Global identifies the
              investors as "Undisclosed," which is atypical for a round of this size and prevents governance and
              information-rights analysis. Total capital raised stands at approximately $112.98 million across all
              rounds (Forge Global data), a modest cumulative burn footprint for a company at $100M ARR.

              The progression of post-money valuations—$131.77M (Series A-1), $394.51M (Series B), $508.71M (Series
              C-2), $1.12B (Series D)—reflects an approximate 8.5x valuation increase over four years on ARR growth from
              sub-$20M to $100M+. The implied revenue multiple at the Series D is approximately 10–11x ARR (on a $100M
              ARR base), consistent with premium vertical SaaS multiples for high-growth companies in 2025–2026.

              Nasdaq Private Market estimated a secondary share price of $44.54 on May 20, 2026, representing a modest
              9% discount to the $49.00 Series D price set five months earlier—an unusually tight discount that suggests
              limited secondary supply and continued investor conviction in the platform.

              With $44 million raised in January 2026 and typical growth-stage operating costs for a 378-person team,
              estimated annual burn is $20–35 million, implying a Series D runway of roughly 15–26 months from close
              (through approximately Q2 2027–Q3 2027). This estimate assumes the company is not yet cash-flow positive;
              if $100M ARR at high contribution margin translates to near-breakeven operations, runway could extend
              substantially. The exact financial position requires data-room confirmation.
