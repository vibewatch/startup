      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >
              The GlossGenius addressable market contains at least six structurally distinct buyer segments, each with
              different workflows, budget authority, and software adoption triggers. Solo stylists and solopreneurs—
              individuals operating under their own brand or within a rented booth—represent the numerically largest
              segment; BLS data shows 76% of barbers and approximately 48% of hairdressers are self-employed, implying
              roughly 350,000–400,000 potential solo-operator customers. For these buyers, the budget owner is the
              professional themselves, software cost comes from personal income, and the adoption trigger is typically a
              client rebooking failure or an administrative-time crisis.

              Booth renters are a structurally distinct sub-segment: they are independent contractors within a salon who
              need portable booking and payment tools that do not depend on the salon owner's system. GlossGenius
              explicitly supports this model with separate bank-account features per its pricing page.

              Small-team salons (2–9 providers) introduce a new payer dynamic—a salon owner or manager who controls
              platform choice and bears the subscription cost while deploying it across staff. Mid-size salons (10+
              providers) add payroll, compliance, and reporting requirements. Day spas and wellness centers have more
              complex service catalogues and retail POS needs. Medical spas are the premium segment, requiring HIPAA-
              compliant data handling, detailed client records, and often tighter integration with clinical intake
              forms.

              Consumer age-cohort data from IBISWorld (via SBDC) shows that the paying end-client base skews older:
              consumers 55 and above account for 30% of hair and nail salon spending, while under-25 consumers account
              for only 12.1%—suggesting that the incumbent client base values service continuity over technology
              novelty. However, Gen Z and Millennials are reshaping adoption expectations: 55% of Gen Z and 47% of
              Millennials rate a business's social media presence as the most important booking factor per a Boulevard
              survey cited in SBDC's 2025 analysis, creating downstream software demand as stylists build digital
              profiles.
            claimRefs:
