          description: Gross margin ≥65%, NRR ≥115%, ARR growth ≥30%, cap table review
        - id: pass-gate
          label: Diligence Passes
          description: Margin, NRR, and ARR bridge confirm base or bull case; proceed with term sheet
        - id: fail-gate
          label: Diligence Fails
          description: Gross margin <50%, NRR <105%, or ARR deceleration evidence; reprice or pass
        - id: bull-outcome
          label: Bull Outcome (2× return)
          description: $250M ARR × 10× = $2.5B exit; 2028 IPO or strategic M&A
        - id: base-outcome
          label: Base Outcome (1.3× return)
