  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape overview
        blocks:
          - type: paragraph
            body: >
              GlossGenius operates in a competitive landscape with three distinct tiers. The first tier consists of
              legacy enterprise incumbents: Mindbody (founded 1998, rebranded 2001) which has absorbed Booker,
              ClassPass, and FitMetrix and now targets mid-to-large wellness studios at $139–$599 per month under
              mandatory 12-month contracts. Mindbody no longer lists pricing on its website and routes prospects through
              a sales call, a friction point that GlossGenius exploits with transparent self-serve pricing.

              The second tier is mid-market general-purpose platforms. Vagaro charges $30 per month for a solo provider
              plus $10 per additional user, supports website booking widgets, hosts a consumer marketplace, and recently
              added AI-assisted tools and a $100/month branded app add-on—making it the most feature-complete mid-market
              competitor. Square Appointments offers a free individual tier and Plus ($29/mo) and Premium ($69/mo)
              plans, and is the strongest free-tier threat by brand recognition and payment-network ubiquity. Acuity
              Scheduling (now owned by Squarespace) is a horizontal scheduling tool not optimized for beauty workflows;
              it competes primarily for price-sensitive independent professionals who prioritize website-native booking.

              The third tier is beauty-specific marketplace platforms with strong consumer-side networks. Booksy
              operates in 25+ countries with 140,000 business customers, 40 million consumers, and $10 billion in annual
              GMV as of 2024. Fresha, which pivoted from a fully free model to a subscription-plus-commission model in
              2025, serves 450,000+ professionals across 120 countries and 25 million consumers. StyleSeat is a US-only
              marketplace focused on independent hairstylists and barbers, offering AI-driven dynamic pricing. Boulevard
              targets premium salons and medspas at $140–$328/mo with ePrescribe and clinical chart features.
              GlossGenius sits between the mid-market and marketplace tiers: premium UX, transparent pricing, and
              beauty-native design, but without the consumer-discovery flywheel that Booksy and Fresha have built.
