            body: >-
              The clearest 2025-2026 product narrative is the combination of AI tooling and embedded-finance expansion.
              Growth Analyst is not marketed as a passive dashboard; GlossGenius says it scans business data daily,
              proactively surfaces missed revenue, builds custom reports, and benchmarks a salon or medspa against
              similar operators. Careers-page examples go further by claiming the first proactive AI agent found more
              than $5 million in potential customer revenue. The same page also surfaces adjacent AI work: a Voice AI
