      - number: '3.2'
        title: Feature and pricing comparison
        blocks:
          - type: paragraph
            body: >
              Across the eight competitors, GlossGenius's $24–$148 per month pricing (three tiers: Starter, Standard,
              Platinum) positions it above the free Square entry point, below Boulevard's enterprise tiers, and roughly
              comparable to Vagaro and Booksy. The Platinum tier ($148/mo) adds HIPAA-compliant charting for medspas,
              payroll processing, and team management—features that also appear on Boulevard and Mindbody but at
              significantly higher price points.

              The most consequential feature gap is the absence of an embeddable website booking widget. Vagaro,
              Mindbody, Boulevard, Fresha, and Booksy all support a widget that lets existing websites receive bookings
              without redirecting consumers to a separate platform. GlossGenius instead provides a subdomain booking
              page (yourname.glossgenius.com), which cannot be embedded on a custom domain. This restricts GlossGenius's
              addressable customer to professionals without an existing web presence—a meaningful but not unlimited
              subset.

              A second gap is multi-location management. Boulevard, Mindbody, and Vagaro all support multi-location
              scheduling and reporting under a single account. GlossGenius's team management feature (introduced in
              2023) supports staff-level scheduling but does not provide a consolidated multi-location dashboard at the
              level of its enterprise competitors. StyleSeat and Fresha, like GlossGenius, are primarily single-location
              or solo-professional oriented.

              On payment processing, GlossGenius charges 2.6% per transaction (matching Square's Plus-tier rate) with no
              per-transaction flat fee, while Square charges 2.6% + 15¢ per in-person transaction. Fresha charges 2.29%
              + $0.20 in-person and 2.79% + $0.20 online. Boulevard has custom processing rates. Among the named
              competitors, GlossGenius's processing rate is not a differential disadvantage and may be marginally
              favorable for low-ticket transactions.
