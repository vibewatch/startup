      - number: '6.2'
        title: Adoption Trajectory and Growth
        blocks:
          - type: paragraph
            body: >-
              GlossGenius's stated customer count of 120,000+ businesses (App Store, 2026) represents a significant
              milestone for a vertical SaaS platform targeting independent beauty professionals. The growth trajectory
              is corroborated across multiple funding-round announcements: a TechCrunch article from late 2022
              referenced the platform serving "thousands of beauty and wellness professionals," while the Series D
              announcement in 2024 and subsequent coverage in Entrepreneur cited over 70,000 businesses; by 2026 the App
              Store listing states 120,000+, implying at least 70% growth from the 2024 baseline. The earlier
              FastCompany framing of "100,000+ businesses" aligns with the About page language and likely reflects a
              slightly earlier snapshot.

              Platform engagement signals are favorable: the App Store shows 3,800+ ratings averaging 4.5/5, while
              SoftwareAdvice records 348 verified reviews at 4.8/5—a high ratio of review depth to account count
              (roughly 1 review per 345 accounts) consistent with an engaged user base. JustUseApp's NLP analysis of
              3,802 App Store reviews similarly extracts positive themes (easy to use, keeps track of everything,
              clients love it). The Vagaro-vs-GlossGenius comparison blog on GlossGenius's own site references a "40%
              drop-off in booking" from mandatory account creation as a conversion argument, suggesting the company
              tracks and markets on client rebooking conversion rates. The platform's stated claim that "businesses
              processing payments with GlossGenius earn 2.6x more" is a company-claimed outcome metric with no
              third-party verification; it likely reflects average ticket increases from upsell features (BNPL,
              memberships) rather than a causal processing-rate effect.
