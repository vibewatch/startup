  - id: FI001
    title: GlossGenius revenue model — architecture flow
    type: flow
    layout: wide
    summary: >-
      Revenue flows from a merchant's monthly subscription fee plus a variable fintech layer capturing payment volume,
      payroll, capital, and instant-payout fees. No marketplace or consumer-facing revenue exists.
    sourceRefs:
      - SI001
      - SI002
      - SI019
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
    data:
      nodes:
        - label: Merchant subscription
          role: Fixed monthly SaaS fee
          tier: Standard / Gold / Platinum
          annualValue: $288–$1,776/yr per merchant (list)
          confidence: high
        - label: Payment processing (2.6% flat)
          role: Percentage of GMV routed through GlossGenius
          tier: All tiers; mandatory integration
          annualValue: Variable; est. $4.2–6.2B GMV implies $109–161M gross revenue
          confidence: low (GMV is modeled estimate)
        - label: Payroll add-on
          role: Staff payroll, commissions, tips, tax filing
          tier: Add-on to any subscription
          annualValue: $480+/yr per merchant per location (list)
          confidence: medium
        - label: Instant payout fee (1.8%)
          role: Premium settlement speed; add-on to transactions
          tier: All tiers; optional per transaction
          annualValue: Variable; adoption rate not disclosed
          confidence: low
        - label: Capital advances
          role: Revenue-based advances to merchant; $1K–$250K per advance
          tier: All tiers; application required
          annualValue: Portfolio size and APR not disclosed
          confidence: low
        - label: Hardware sales
          role: Card reader and POS hardware
          tier: One-time; Tap & Go $49; Pro Reader $299–$349
          annualValue: One-time; not ARR
          confidence: medium
