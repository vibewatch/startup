  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization architecture
        blocks:
          - type: paragraph
            body: >
              GlossGenius generates revenue across two interlocked pillars: a recurring SaaS subscription layer and an
              embedded fintech layer that routes, processes, and finances customer transactions. The SaaS layer bills
              merchants monthly or annually on one of three fixed tiers—Standard, Gold, and Platinum—with no free plan
              and no usage-based pricing within the subscription itself. The fintech layer captures a flat-rate
              percentage on every dollar transacted through the platform, plus add-on fees for instant payouts, payroll
              processing, and capital advances. By anchoring the platform to mandatory payment routing (GlossGenius
              Payments is deeply integrated and not easily replaced), the company ensures that every subscription
              customer also generates fintech revenue at scale.

              There is no marketplace or consumer-discovery revenue model; GlossGenius earns nothing from new-client
              acquisition on behalf of its merchants. The business is also US-only as of mid-2026, concentrating all
              revenue and operating risk within a single regulatory and macroeconomic geography. The payroll add-on and
              capital advance products were launched after the core subscription-and-payments architecture was
              established, representing deliberate ARPU expansion levers rather than separate go-to-market motions.
              Third-party reviewers note that the platform's mobile-first, US-focused design limits addressable
              enterprise market and creates a ceiling on ARPU from multi-location operators.
            claimRefs:
