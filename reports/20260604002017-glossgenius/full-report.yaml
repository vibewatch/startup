      - number: '7.2'
        title: Payment Economics and Margin Compression
        blocks:
          - type: paragraph
            body: >-
              GlossGenius is exposed to margin compression because its monetization stack is tied closely to payment
              processing, and payment processing is increasingly standardized across salon software vendors. The company
              relies on Stripe for processing and advertises a 2.6% flat in-person rate, but Square posts 2.6% plus a
              small per-transaction fee and Fresha uses a subscription-free model that can shift monetization into
              payments or marketplace economics. That reduces the room for GlossGenius to widen payment take rates
              without inviting comparison shopping or churn. The legal framework adds another layer of risk: GlossGenius
              reserves the right to change fees on 14 days' notice and to hold funds during investigations, which may
              protect the company in edge cases but can intensify customer dissatisfaction when the base consists of
              small operators with tight cash cycles. The biggest diligence gap is that GlossGenius does not publicly
              separate software margin from payment margin. Without that split, investors cannot tell whether the
              business is really a premium SaaS company with attached payments or a payments-heavy vertical software
              business facing direct commoditization pressure.
