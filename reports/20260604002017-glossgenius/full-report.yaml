      - number: '1.4'
        title: Scale, traction, and key milestones
        blocks:
          - type: paragraph
            body: >
              GlossGenius has built scale unusual for a bootstrapped-then-accelerated vertical SaaS company. From "tens
              of thousands" at the Series A close in late 2021, customer count grew to approximately 40,000 by September
              2022, approximately 50,000-60,000 by mid-2023, and exceeded 120,000 by mid-2026. Forbes noted that the
