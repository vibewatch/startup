            body: >-
              GlossGenius reached its $100M ARR threshold on approximately $112.98M in total capital raised across all
              rounds—an ARR-to-invested-capital ratio near 1:1 that is exceptionally rare for a vertical SaaS plus
              fintech business. This trajectory reflects the structural advantage of a product-led growth model with no
              outbound sales headcount, where payment-routing lock-in drives high retention and expansion without
              traditional S&M spend. The comparison benchmark: the median Series D SaaS company at unicorn valuation
