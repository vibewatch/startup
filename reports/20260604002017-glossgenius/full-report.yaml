  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Profile and Segmentation
        blocks:
          - type: paragraph
            body: >-
              GlossGenius targets beauty, wellness, and health service professionals operating in the US. As of 2026 the
              company states it serves 120,000+ businesses, and its About page references 100,000+ owners—figures that
              likely reflect different measurement points (business accounts vs. individual owner-operators). The
              platform explicitly addresses 18 specialty verticals: hairdressers, barbers, estheticians, lash
              technicians, nail artists, makeup artists, massage therapists, medspa and aesthetics practitioners,
              chiropractors, acupuncturists, brow artists, behavioral therapists, personal trainers, tanning artists,
              tattoo and piercing artists, sports coaches, yoga studios, and medical weight-loss clinics. This breadth
              is notable, but hair-adjacent professionals (hairdressers, barbers, estheticians, lash and nail techs)
              historically dominate beauty-software adoption and are presumed to represent the largest GlossGenius
              revenue concentration given their prevalence in the addressable market.

              GlossGenius organizes its product around four roles: solo professionals, booth renters, team members, and
              owners/managers. The solo-professional segment is the primary design target: the Standard plan at
              $24/month is described as "perfect for solopreneurs," and the solo-professionals landing page positions
              GlossGenius as the "always-on partner built to give you an edge" for one-person operations. Booth renters
              are explicitly supported with payments routed directly to their bank accounts, independent of the studio
              owner's payroll. Teams of up to nine are served by the Gold plan ($48/month); teams of ten or more are
              served by the Platinum plan ($148/month). Independent reviewers consistently describe GlossGenius as
              weakest for larger teams, with one review platform noting that "limited team scheduling" is a material
              constraint and that the product is "designed primarily for solo professionals." The company operates
              exclusively in the US market; no international expansion is evidenced by website language, pricing, or
              press coverage.
            claimRefs:
