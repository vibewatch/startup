      - number: '1.5'
        title: Product overview and platform scope
        blocks:
          - type: paragraph
            body: >
              The GlossGenius platform is a vertically integrated operating system for appointment-based businesses.
              Core modules include online booking (with Instagram and Google integrations), a mobile point-of-sale with
              Tap & Go ($49) and Pro Reader ($299/$349) hardware options, client management and history, SMS and email
              marketing, payroll and staff scheduling, digital forms and waivers, inventory management, and embedded
              financing. Memberships and Packages launched in 2025 and the AI Growth Analyst debuted in 2026. Payment
              processing offers same-day payouts and business capital advances between $1,000 and $250,000.

              Third-party reviewers note the platform's strengths in mobile-first UX, integrated card reader, social
              booking integrations, and flat-rate pricing predictability. Identified limitations include the absence of
              a free entry-level tier, constrained multi-location team management, and historically limited AI booking
              automation relative to some newer entrants. The App Store rating of 4.5 out of 5 from 3,800+ reviews and a
              4.5 Capterra score suggest strong practitioner satisfaction at the individual-operator level.
            claimRefs:
              - CO026
              - CO027
              - CO028
              - CO029
              - CO036
              - CO037
      - number: '1.6'
        title: Recognition, headwinds, and adverse signals
        blocks:
          - type: paragraph
            body: >
              GlossGenius has accumulated meaningful industry recognition: Fast Company Most Innovative Companies 2024
              (retail), Forbes Cloud 100, Forbes Fintech 50, Inc Female Founders 100, and Inc Best Workplaces. Fast
              Company's 2024 piece called out the company having signed up more salons than there are Starbucks in the
              US, and cited the founders' combination of Princeton education, Goldman Sachs financial discipline, and
              hands-on beauty-industry domain knowledge as a differentiated founding profile.

              Against this, the Better Business Bureau gave GlossGenius a D- rating as of mid-2026—the second-lowest
              possible score—primarily reflecting a pattern of unresolved consumer complaints centered on payment
              processing disputes, account closures without warning, and slow customer service response times. The
              SchedulingKit and JustUseApp review aggregators independently corroborate these themes: users praise the
              product functionality but report frustration with support escalation paths. These signals are material for
              enterprise or multi-location operators who require guaranteed uptime and SLA-backed service, and the gap
              between product ratings and BBB standing is a diligence item for downstream commercial and risk chapters.
            claimRefs:
              - CO031
              - CO032
              - CO035
              - CO036
              - CO038
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and definition
        blocks:
          - type: paragraph
            body: >
              GlossGenius's addressable market is the population of US personal care services businesses that operate
              appointment-based workflows and handle client payments—encompassing hair salons, barbershops, nail salons,
              day spas, massage therapy practices, skincare studios, and medical spas. These businesses are classified
              primarily under US Census NAICS code 8121 (Personal Care Services), which itself subdivides into
              barbershops and hair salons (812111/812112), other personal care services (81219), and nail salons
              (812113). Medical spas straddle NAICS 8121 and healthcare services, depending on regulatory
              classification; GlossGenius explicitly includes them through its HIPAA-compliant Platinum plan.

              Included spend categories span three buckets: platform subscription fees (the $24–$148 per month range),
              embedded payments processing at 2.6% of gross service revenue, and optional add-on modules (payroll, HIPAA
              compliance, invoicing). Excluded from the primary TAM are beauty product retail (NAICS 4461), enterprise
              salon chains with custom ERP systems, and informally operating professionals who do not use digital
              scheduling tools. Adjacent markets—fitness studios, tattoo parlors, pet grooming—use overlapping workflows
              but are served by distinct vertical competitors and are treated here as adjacencies rather than core TAM.

              The status-quo substitute set that GlossGenius displaces is meaningful: paper appointment books, generic
              calendar applications such as Google Calendar, manual phone-based scheduling, social-media DM booking
              (especially Instagram and Facebook), and no-software walk-in queuing at booth-rental locations. The
              persistence of these substitutes among the large self-employed portion of the workforce—76% of barbers and
              48% of hairdressers are self-employed per BLS 2024 data—creates both addressable opportunity and inertia
              risk.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM007
              - CM008
