    layout: wide
    summary: >-
      The public workflow moves from discovery to hosted booking, reminders, appointment delivery, integrated payment,
      and repeat booking.
    data:
      nodes:
        - id: client-discovery
          label: Client discovery
          description: A client finds the business via a hosted booking page, Google, Instagram, Facebook, or Yelp.
        - id: booking-request
          label: Booking request
          description: The client books through the hosted site without logging in or downloading an app.
        - id: confirmation
          label: Confirmation
          description: GlossGenius confirms the appointment, applies booking rules, and can capture deposits or forms.
        - id: reminder
          label: Reminder
          description: Automated reminders, updates, and rebooking prompts reduce no-shows and admin work.
        - id: appointment
          label: Appointment
          description: The operator delivers the service with client notes, images, waivers, and history available in-profile.
        - id: payment
