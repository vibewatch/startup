      - number: '6.4'
        title: Retention, Satisfaction, and Rebooking
        blocks:
          - type: paragraph
            body: >-
              GlossGenius does not publicly disclose net revenue retention (NRR), gross revenue retention (GRR), or
              churn rates. Satisfaction proxies from review platforms are consistently strong: SoftwareAdvice gives
              4.84/5 for ease of use, 4.75/5 for value for money, and 4.75/5 for customer support across 348 verified
              reviews. Of these reviews 266 are five-star, 30 are four-star, and only 1 is two-star, indicating a highly
              skewed positive distribution. The App Store shows 4.5/5 on 3,800+ ratings.

              The platform's retention mechanics are explicit: GlossGenius's App Store description states "60% of
              clients who leave without a next appointment won't rebook on their own," and the platform addresses this
              through automated Rebooking Reminders, a Waitlist for last-minute cancellations, and AI-powered Email/Text
              Marketing for re-engagement. Memberships and Packages (added in 2025) provide subscription lock-in for
              high-frequency clients. The Client Insights feature surfaces rebooking habit analytics and tracks
              retention rate, average sales value per client, and monthly new client count.

              Adverse evidence from SoftwareAdvice reviews reveals operational friction: one reviewer reports
              "appointments vanish, text reminders don't send, credit card reader doesn't work" and complaints about
              slow issue-resolution (ticket-based, one-to-two day SLA). Another notes SMS marketing limits: the Gold
              plan includes 500 SMS credits per month, with overage costs that sting businesses with large legacy client
              databases. A third reviewer cites scheduling edge cases where work-hours settings block longer services.
              These complaints collectively represent a small minority of the 348 reviews (fewer than 10
              one-to-three-star ratings) but indicate real pain points in reliability and scalability for higher-volume
              operators.
