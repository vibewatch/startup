            body: >-
              GlossGenius Inc. holds a D- rating with the Better Business Bureau, the lowest non-F grade on the BBB
              scale. For a company processing billions in annual payment volume and offering capital advances to small
              businesses, unresolved consumer complaints in financial product categories carry regulatory and
              reputational risk beyond what would apply to a pure-SaaS company. The CFPB complaint database should be
