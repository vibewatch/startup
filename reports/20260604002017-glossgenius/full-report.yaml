      - number: '7.4'
        title: Regulatory, Legal, and Data Privacy Risk
        blocks:
          - type: paragraph
            body: >-
              GlossGenius carries a broader compliance surface than its consumer-friendly brand implies. The privacy
              policy says the company collects sensitive identifiers and financial data including Social Security
              numbers, bank accounts, payment card information, professional license details, and photos. That
              automatically raises the bar on privacy, security, and payments handling. The policy also references
              California and other state privacy regimes, and the FTC's privacy-security guidance makes clear that
              companies handling consumer data must protect it and keep their privacy promises. On the payments side,
              PCI standards apply to entities that process payment cards, so Stripe dependence does not eliminate
              compliance exposure; it shifts it into shared-responsibility territory. The terms add more legal
              complexity by placing licensing compliance on the professional, imposing mandatory individual arbitration,
              and granting GlossGenius a broad perpetual license over user content. The company also reserves the right
              to transfer data in a business transaction. What is not publicly documented is equally important: the
              reviewed materials do not surface a PCI DSS level, SOC 2 report, or comparable certification, leaving
              external investors with limited visibility into security maturity.
