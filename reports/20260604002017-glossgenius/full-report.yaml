      - number: '8.7'
        title: Thesis-Break Triggers and Key Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Three conditions would materially impair the investment thesis and force a reassessment of entry price:
              (1) Gross margin below 50% at blended level—if confirmed by audited financials, the ARR multiple must be
              rebased to 5–7× rather than 10–12×, implying a maximum supportable valuation of $500–700M. (2) NRR below
              110%—sustained sub-NRR performance indicates GlossGenius is not expanding in existing accounts at a rate
              sufficient to offset churn, implying ARR growth decelerates faster than modeled. (3) Evidence of
              competitive share loss to Square Appointments, Fresha, or Booksy at the sub-$30/month price point that
              drives initial acquisition. Conversely, the thesis is confirmed if audited financials show NRR above 115%,
              gross margin above 65%, and ARR growth of 35%+ on a rolling 12-month basis as of mid-2026. The six open
              diligence asks listed in the following section represent the minimum information set required for a
              defensible investment decision. Without addressing at least the first four—margin breakdown, NRR, ARR
              bridge, and cap table—the investment cannot be underwritten with high confidence.
            claimRefs:
              - CV013
              - CV023
              - CV033
              - CV036
              - CV045
          - type: table
            tableRef: TV006
            claimRefs:
              - CV013
              - CV022
              - CV034
              - CV036
              - CV037
      - number: '8.8'
        title: Valuation Conclusion
        blocks:
          - type: paragraph
            body: >-
              GlossGenius's $1.12 billion Series D valuation is within a defensible range given its $100M+ ARR milestone
              and vertical SaaS market leadership, but the 11× implied multiple offers limited margin of safety relative
              to ServiceTitan's 6–7× EV/Revenue and the Damodaran software median P/S of 9×. The secondary market
              premium commands caution: a 9.1% discount to the Series D PPS, while modest, confirms that no secondary
              market has emerged willing to pay up to the round price. The base case IRR of roughly 8–12% over a 5-year
              hold is insufficient for a typical venture return target; only the bull case (2× return) represents a
              venture-grade outcome. Whether the bull case is achievable depends on whether NRR, gross margin, and
              growth rate outperform the peer median—none of which can be confirmed without proprietary financial
              disclosure. The investment is therefore conditionally constructive: proceed with a term sheet conditioned
              on margin, NRR, and ARR bridge confirmation; price-protect downside by negotiating participation rights or
              anti-dilution provisions to limit exposure in the bear case. All six diligence asks must be addressed
              before close.
            claimRefs:
              - CV011
              - CV017
              - CV018
              - CV026
              - CV028
              - CV029
              - CV030
              - CV031
              - CV041
              - CV043
              - CV045
