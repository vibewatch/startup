      - number: '4.5'
        title: Financial gaps, adverse signals, and diligence agenda
        blocks:
          - type: paragraph
            body: >
              All core unit-economics metrics—gross margin, NRR, CAC, LTV—are private and cannot be verified from public
              sources. The $100M ARR figure is a threshold crossing reported by Forbes, not a precise current number.
              Exact payment volume, monthly burn, and cap table structure post-Series D are unknown. This opacity is
              standard for a private company at this stage, but it means every financial conclusion in this chapter is
              modeled or inferred, not observed.

              The most material adverse public signal is the D- rating from the Better Business Bureau for GlossGenius
              Inc. (New York). The BBB D- rating is a significant downgrade from its standard letter scale and typically
              reflects a pattern of unresolved consumer complaints or failure to respond to BBB inquiries. For a company
              whose core value proposition includes payment processing and embedded financial services, unresolved
              complaints in those product areas are a more significant reputational risk than the same rating for a
              non-financial business. No CFPB complaint data was directly confirmed in public searches; this should be
              specifically verified.

              The undisclosed Series D investor identities are a governance red flag. Without knowing who provided $44
              million at unicorn pricing, due diligence cannot assess liquidation-preference stacking, redemption
              rights, anti-dilution provisions, or board-seat changes. The embedded capital advance product (loans of
              $1,000–$250,000 to beauty business owners) introduces credit risk, money-service licensing obligations,
              and loss provisioning requirements that are entirely absent from public disclosures.
