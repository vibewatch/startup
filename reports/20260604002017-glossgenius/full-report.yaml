              Payment processing volume, estimated at $2B annualized at Series B close (September 2022), is described in
              2026 company materials as "billions in annual payment volume." The company reported triple-digit
              year-over-year growth in both 2022 and 2023.

              Fast Company's recognition as a Most Innovative Company in retail for 2024 cited new features—digital
              waivers, deposits, and an AI marketing assistant—that reduced cancellation and no-show rates by an average
              of 42% across customers. GlossGenius added Memberships and Packages in 2025 and launched its AI Growth
              Analyst product in 2026. Employee headcount has grown to approximately 300–378 per available sources.
