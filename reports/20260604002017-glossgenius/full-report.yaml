      - number: '6.5'
        title: Expansion, Concentration, and Operator-Scale Limitations
        blocks:
          - type: paragraph
            body: >-
              GlossGenius's business model creates a structural tension between its current solo/small- team base and
              the higher-ARPU segment of multi-location or high-headcount businesses. The Platinum plan at $148/month
              targets "teams of 10+" and includes unlimited team members, commission structures, and premium
              analytics—but independent reviewers flag material gaps: no room-and-resource management (only "Coming
              Soon" on the all-features page), limited multi-location support compared to Boulevard or Mindbody, and no
              white-label or advanced custom branding. The SchedulingKit review is explicit: "Limited team scheduling,
              designed primarily for solo professionals; only serves beauty and wellness industry, not suitable for
              other business types."

              Concentration risks are significant in three dimensions. First, the customer base is heavily skewed toward
              solo operators, who have lower average revenue per account and higher individual churn sensitivity than
              team-based businesses. Second, GlossGenius is US-only—the SchedulingKit review and all official content
              confirm no international presence—limiting total addressable revenue. Third, the beauty/wellness vertical
              concentration means the platform is tightly correlated with the US personal services employment cycle.
              Professional Beauty Association data suggests the salon industry has ~1M licensed professionals, but the
              GlossGenius addressable market within that (appointment-based, mobile-primary operators willing to pay
              SaaS fees) is smaller; at 120,000 accounts, GlossGenius may already serve a meaningful share of the
              digitally-willing solo segment.

              Land-and-expand within existing accounts occurs through plan upgrades (Standard → Gold → Platinum) and
              add-on products (Payroll $40+$6/seat, BNPL, Memberships). The no-show protection stack, Waitlist, and AI
              Growth Analyst are Gold/Platinum features, creating natural upgrade incentives for solo pros who outgrow
              Standard. The free data migration program ("Free Data Transfer") lowers switching costs for new sign-ups
              but also means incoming customers have low sunk costs if they later defect. No publicly disclosed data on
              ARPU by plan tier, upgrade velocity, or payroll-addon attach rate limits the quantitative assessment of
              expansion economics.
            claimRefs:
              - CU031
              - CU032
              - CU033
              - CU034
              - CU035
              - CU036
