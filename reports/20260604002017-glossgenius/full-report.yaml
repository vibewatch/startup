chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >
              GlossGenius is an all-in-one software-as-a-service platform purpose-built for appointment-based beauty and
              wellness businesses—salons, spas, medspas, wellness practices, and adjacent verticals. The company was
              incorporated in New York in September 2015 and launched its product commercially in 2016, growing from a
              dorm-room freelance-makeup-artist concept to a scaled platform serving more than 120,000 businesses as of
              mid-2026. Its headquarters are at 169 Madison Avenue, New York, NY 10016, with a secondary office address
              at 579 Broadway Suite 2C, New York.

              The business model is recurring-subscription plus payment-processing economics: merchants pay a monthly
              platform fee (Standard, Gold, or Platinum tier) and route transactions through GlossGenius at a flat 2.6%
              card-present rate, generating blended software-plus-fintech revenue per seat. GlossGenius reports that
              customers see an average 26% revenue increase in year one, save approximately 40 hours per month on
              administrative work, and achieve a 75% average rebooking rate—figures the company uses as its primary
              go-to-market proof points. The platform handles booking, payments, client management, marketing, payroll,
              forms, and embedded financial services from a single mobile-first interface. By design, the company has no
              outbound sales function; organic word-of-mouth and product-led distribution have driven growth from its
              founding through unicorn valuation.
