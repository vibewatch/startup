      - number: '3.5'
        title: Switching costs and lock-in analysis
        blocks:
          - type: paragraph
            body: >
              Switching costs in beauty software are moderate and asymmetric. Professional-side data—client contact
              lists, appointment history, formulation notes, and payment records—is held in the platform and is not
              trivially portable. GlossGenius provides CSV export for basic client data, but photo archives and
              service-history notes are not easily ingested by competing platforms without manual re-entry. This data
              portability friction is the most concrete lock-in mechanism.

              Payroll lock-in is higher than for scheduling alone. Professionals using GlossGenius's integrated payroll
              module must reconcile historical payroll records, tax filings, and W-2/1099 artifacts before switching—a
              meaningful mid-year deterrent. Boulevard and Mindbody also offer payroll integrations at higher price
              points, but neither Fresha nor Booksy currently competes on embedded payroll.

              Consumer-side switching costs are low by design: beauty consumers are accustomed to booking via multiple
              platforms (multi-homing is the norm in barbershop and hair salon booking). Booksy, Fresha, and Vagaro all
              allow consumers to book any professional on their marketplace, so a consumer does not change behavior when
              a professional switches platforms—they simply find the professional on the new platform. This structural
              characteristic means GlossGenius cannot leverage consumer lock-in as a retention mechanism for its
              professional subscriber base.

              Operational inertia—staff training, front-desk workflows, reminder templates—provides low-to-medium
              switching resistance that delays but does not prevent competitive loss. Salons that have custom-built
              onboarding flows, intake forms, and rebooking automations around GlossGenius's interface face a
              non-trivial migration cost, but this resistance typically erodes when a compelling price or feature
              advantage appears on a competitor platform.
            claimRefs:
              - CP033
              - CP034
              - CP035
              - CP036
      - number: '3.6'
        title: Strategic outlook and diligence asks
        blocks:
          - type: paragraph
            body: >
              The competitive dynamics over the next 12–24 months hinge on three pivots: whether Fresha sustains its
              marketplace scale post-pricing-change (upside for GlossGenius if Fresha bleeds professionals), whether
              Square launches beauty-specific tooling that closes GlossGenius's UX advantage (downside), and whether
              GlossGenius develops or acquires a consumer-discovery capability (transformational upside if executed).
              Booksy's $120M in disclosed funding and $65.9M 2024 revenue suggest a better-capitalized international
              peer, but Booksy's broader geographic diversification and barbershop-heavy mix means direct overlap with
              GlossGenius's premium-salon base is partial rather than total.

              Key diligence asks: (1) What share of GlossGenius's churned accounts migrate to Fresha vs. Vagaro vs.
              Square? Churn-destination data would quantify the most acute displacement vector. (2) Has GlossGenius
              piloted or evaluated a marketplace or demand-generation feature, and what were the product or business
              model obstacles? (3) What is GlossGenius's multi-location customer count and ARPU relative to
              single-location accounts? This would clarify whether upmarket expansion meaningfully improves unit
              economics or creates support complexity without revenue uplift.

              Boulevard is the most analogous premium-positioning competitor and warrants a detailed pricing audit
              before any GlossGenius financial projection assumes defensible ARPU at the medspa tier. If Boulevard is
              successfully retaining medspas at $234–$328/mo with ePrescribe, GlossGenius's Platinum plan at $148/mo may
              be structurally under-priced, or it may be correctly priced for a mass-market medspa tier that Boulevard's
              enterprise approach cannot reach efficiently.
