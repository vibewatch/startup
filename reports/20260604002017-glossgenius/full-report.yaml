      - number: '8.3'
        title: Public Comparable Company Analysis
        blocks:
          - type: paragraph
            body: >-
              GlossGenius sits at the intersection of vertical SaaS and embedded fintech, making pure-play comparables
              limited. The most relevant public reference is ServiceTitan (TTAN), which serves home and commercial
              service businesses with a platform including scheduling, payments, and workforce management.
              ServiceTitan's FY2026 (ending January 31, 2026) revenue was $960.97 million, gross margin was 70.1%, and
              the aggregate market cap of non-affiliate shares was approximately $6.05 billion as of July 2025—implying
              an EV/Revenue of approximately 6.3× at the time of IPO and post-IPO trading. ServiceTitan's comparable
              gross margin and vertical SaaS business model make it the single most useful public comp for GlossGenius.
              Toast (TOST), while operating in an adjacent vertical (restaurant technology), provides a negative
              comparison: its FY2025 gross margin of only 25.9% on $6.15 billion of revenue reflects a
              payment-volume-heavy revenue mix, resulting in a P/S ratio of approximately 2.4× as of early 2026. If
              GlossGenius's revenue skews heavily toward payments (as Toast's does), its justified multiple would
              compress significantly toward that range. The Damodaran January 2026 dataset shows that the median
              software company P/S is 9.01× and EV/Sales is 9.56×, providing a ceiling benchmark. Mindbody—acquired by
              Vista Equity Partners in 2019 for $1.9 billion—provides the most relevant M&A comp: a vertical SaaS
              platform for wellness and beauty businesses with direct product overlap. That transaction provides an
              upper-bound M&A reference. No public valuation data exists for Jobber, a private home-services vertical
              SaaS company with 400,000+ users.
            claimRefs:
