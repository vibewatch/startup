      - number: '4.2'
        title: Subscription pricing, realized revenue proxies, and growth signals
        blocks:
          - type: paragraph
            body: >
              GlossGenius's subscription pricing is publicly documented and transparent. The Standard plan is priced at
              $24 per month on an annual commitment or $28 per month on a month-to-month basis; the Gold plan (described
              by the company as its most popular tier) is $48/$56 per month; and the Platinum plan targets larger or
              medspa-oriented businesses at $148/$168 per month. These are list prices and represent the minimum
              subscription contribution per active business. The actual ARPU is higher when payroll ($40/month plus $6
              per seat), payment hardware, and capital interest income are added.

              Forbes reported that GlossGenius crossed $100 million in annual recurring revenue "over the past year,"
              implying the $100M threshold was reached in 2025 or very early 2026. The company's LinkedIn profile
              describes "billions in annual payment volume" in 2026 materials. At 120,000+ businesses (company-stated)
              and an assumed average of the Gold plan tier ($48/month), the SaaS-only ARR floor would be approximately
              $69 million annualized—consistent with a total ARR above $100 million once fintech contributions are
              included. The company reported 1 million+ appointments per week (Forbes); at an estimated average service
              ticket of $80–120, implied weekly GMV of $80–120 million would extrapolate to $4.2–6.2 billion in annual
              GMV. These are modeled estimates, not confirmed figures.

              Software Advice, an independent B2B software review platform, rated GlossGenius 4.8 out of 5 based on 348
              verified reviews and designated it a FrontRunner 2026 winner in appointment scheduling software. This high
              satisfaction score, combined with the company's reported 75% rebooking rate and 22% average booking
              increase in year one, suggests strong retention dynamics at the individual-operator level.
