              - CV026
      - number: '8.5'
        title: Scenario Analysis — Bull, Base, and Bear Cases
        blocks:
          - type: paragraph
            body: >-
              The three-scenario framework models GlossGenius's value trajectory over a 3-to-5-year hold period from the
              Series D entry price of $49.00 per share ($1.12B post-money). All scenarios assume the entry multiple of
              ~11× trailing ARR and project exit multiples consistent with the public SaaS market at exit. In the bull
              case, GlossGenius reaches $250M ARR by 2028, sustains 70%+ gross margin through continued SaaS
              subscription dominance over payments, and exits at 10× ARR via IPO, yielding a $2.5 billion
              valuation—approximately 2.2× the entry. In the base case, ARR grows to $180M by 2029 with blended margins
              of 60–65%, a market-clearing exit at 8× ARR produces a $1.44 billion outcome—roughly 1.3× the entry and a
              single-digit IRR for Series D investors. In the bear case, growth decelerates to below 20%
              annually—perhaps driven by payments market share loss to Square or Stripe, or elevated churn from an SMB
              customer base under economic stress—ARR stalls at $130M, and the multiple compresses to 5×, yielding a
              $650 million exit, a loss at the $1.12B entry price. An extreme downside scenario (flat ARR, 4× multiple)
              would yield only $400M, roughly a 65% loss. Multiple compression is a key swing factor: if public SaaS P/S
              multiples decline from today's ~9× median to 6×, even the base case trajectory requires $190M+ ARR to
              achieve breakeven at the Series D price.
            claimRefs:
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
