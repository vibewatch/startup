      - number: '6.3'
        title: Named Customer Proof and Testimonials
        blocks:
          - type: paragraph
            body: >-
              GlossGenius's named customer evidence skews toward solo operators and small studios who switched from
              incumbent platforms (Square, Vagaro, Mangomint). Multiple testimonials across official pages cite seamless
              data migration and immediate business impact. On the App Store, "Ellishea L." writes: "Switching from
              Mangomint to GlossGenius was a no-brainer. GlossGenius has opened up so many opportunities to grow my
              business." "Kathy R." reports: "Moving over from Vagaro was seamless and faster than I even thought."
              "Yolanda O." claims a striking revenue leap: "What I used to make in three months, I made in one day." The
              Wildflower Collective (a collective studio) describes GlossGenius as "a game-changer for the industry,
              acts as your own personal assistant."

              On the official site, Amanda Bairos (AB Aesthetics, esthetician) reports that without GlossGenius she
              "would've actually lost clients," citing booking simplicity as the retention driver. Melissa Proulx (Hair
              by Melissa Proulx, hairdresser/booth renter) calls the platform "so user-friendly for both me and my
              clients. Affordable, dependable, and amazing support." Gregga Prothero (Gregga Hair) likens it to "a
              personal assistant handling all the nitty-gritty details." Kayla Hameister (The Golden Hour Little
              Luxuries) says the analytics tools are "like gold" for seeing top clients, services, and business growth
              trends.

              The named customer proof is entirely official-source (company-collected testimonials) or app-store
              reviews, with no independently verified case studies from third-party trade press. Quality is high on
              specificity and emotional resonance but low on outcome verifiability—no independently confirmed revenue
              figures, client count changes, or cohort comparisons are publicly available. All named customers
              identifiable from official pages appear to be solo operators or small studios, reinforcing the product's
              primary positioning within that segment.
