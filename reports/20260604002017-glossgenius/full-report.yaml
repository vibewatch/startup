      - number: '8.2'
        title: Series D Transaction and Valuation History
        blocks:
          - type: paragraph
            body: >-
              GlossGenius raised $44 million in its Series D round on January 23, 2026 at $49.00 per share, setting a
              post-money valuation of $1.12 billion. The investors in the round include 2048 Ventures, Abaco, Bessemer
              Venture Partners, Burst Capital, HearstLab, Imaginary Ventures, and L Catterton, per Forge Global
              disclosures. The round represents the fourth institutional raise following a $16.4 million Series A in
              November 2021 (Bessemer-led, ~$131M post-money), a $25 million Series B in September 2022 (~$394M
              post-money), and a $28 million Series C in July 2023 (L Catterton-led, $510M post-money). The step-up from
              Series C to Series D—$510M to $1.12B, a 2.2× increase in 30 months—is consistent with a company crossing
              $100M ARR and achieving meaningful payment volume. Total capital raised stands at approximately $112.98M,
              strikingly efficient for a unicorn. The SEC EDGAR filing for GlossGenius (CIK 0001988828) confirms a Form
              D for the Series C in August 2023 with a $35.99M total offering. A corresponding Form D for the Series D
              had not yet appeared in the EDGAR full-text search as of the research date, which is a minor gap but not
              uncommon for rounds under the five-day filing deadline. Nasdaq Private Market data from May 20, 2026 shows
              a secondary price of $44.54 per share, a 9.1% discount to the $49.00 Series D price-per-share, consistent
              with normal illiquidity discounts on late-stage private shares and not indicative of a markdown in
              fundamental value.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
