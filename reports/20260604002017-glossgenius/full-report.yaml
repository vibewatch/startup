      - number: '1.3'
        title: Funding history and investor map
        blocks:
          - type: paragraph
            body: >
              GlossGenius raised a small pre-seed of approximately $2.8M and remained substantially bootstrapped for
              roughly five years before its Series A. That capital discipline, combined with $1B+ in GMV by late 2021,
              positioned the company well for institutional backing.

              The Series A of $16.4M closed in November 2021, led by Bessemer Venture Partners with notable strategic
              angels: Tobias Lütke (Shopify CEO), Chris Comparato (Toast CEO), Aman Narang (Toast co-founder), and
              Robert Murphy (Mindbody co-founder). The participation of operators from the most successful vertical SaaS
              and SMB-payments companies was deliberately cited as validation of the market thesis. The Series B
              followed in September 2022 at $25M, co-led by Imaginary Ventures and Bessemer, with Left Lane Capital
              added as a new institutional voice; at that point GlossGenius reported 40,000 customers and $2B in
              annualized transaction volume. The Series C of $28M closed in July 2023, led by L Catterton Growth Fund at
              a $510M post-money valuation. The Series D—$44M closed January 23, 2026—pushed the post-money valuation to
              approximately $1.12B, confirming unicorn status. Total capital raised stands at approximately $112.98M.
