          description: Integrated POS, card readers, and BNPL or standard payments close the sale.
        - id: review
          label: Review
          description: Post-visit review collection and performance data feed retention and reputation loops.
        - id: rebook
          label: Rebook
          description: Rebooking reminders, waitlist logic, and marketing campaigns pull the client back into the next visit.
