      - number: '4.5'
        title: 财务缺口、负面信号与尽调议程
        blocks:
          - type: paragraph
            body: >
              所有核心单位经济指标——毛利率、NRR、CAC、LTV——都是私有信息，无法从公开来源验证。$100M ARR 是 Forbes 报道的门槛跨越，不是精确当前数字。精确支付量、月度烧钱速度和 Series D
              后股权结构均未知。这种不透明对该阶段私营公司而言常见，但意味着本章所有财务结论都是建模或推断，而非直接观测。

              最重大的公开负面信号，是 Better Business Bureau 给 GlossGenius Inc.（New York）的 D- 评级。BBB D-
              评级在其标准字母评分中属于显著下调，通常反映出未解决消费者投诉的模式，或未回应 BBB
              询问。对一家核心价值主张包含支付处理和嵌入式金融服务的公司而言，这些产品领域的未解决投诉，比同样评级出现在非金融业务上带来更大的声誉风险。公开搜索未直接确认 CFPB 投诉数据；尽调应专门核验这一点。

              Series D 投资人身份未披露，是治理红旗。在不知道谁以独角兽价格提供 $44 million 的情况下，尽调无法评估清算优先权堆叠、赎回权、反稀释条款或董事席位变化。嵌入式资本预支产品（向美容商户提供
              $1,000–$250,000 贷款）引入信用风险、货币服务牌照义务和损失准备要求，而这些在公开披露中完全缺失。
