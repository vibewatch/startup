      - number: '3.3'
        title: 市场平台缺口与获客发现风险
        blocks:
          - type: paragraph
            body: >
              GlossGenius 面临的最重要结构性竞争不对称，是缺少面向消费者、用于新客户获取的市场平台。Booksy 的 40 million 名消费者和 $10 billion 年 GMV、Fresha 横跨 120
              个国家的 25 million 名消费者，以及 Vagaro 的美国本土市场，都形成了 GlossGenius 订阅客户无法获得的客户发现飞轮。StyleSeat 也通过 $35/month
              固定订阅捆绑市场曝光，变现其 2 million+ 客户端用户基础。

              TheSalonBusiness.com（March 2025）的负面评测证据明确把这一点列为从业者离开 GlossGenius 的原因：“不同于 Fresha 和 Vagaro 等竞品，GlossGenius
              没有提供让新客户发现你业务的一体化市场。”同一来源提到，Fresha 的模式用首单 20% 佣金带来新客预约，本质上是用收入分成换获客；当客户管道偏瘦时，独立专业人士会觉得这笔交换有吸引力。

              市场平台缺口带来两个二阶影响。第一，它限制 GlossGenius 的数据护城河：没有消费者侧行为数据，GlossGenius
              无法构建发现算法、消费者偏好图谱或跨专业人士推荐引擎。第二，业务放缓时会制造流失压力：即便 GlossGenius 的专业工具在运营上更好，遇到淡季的专业人士也可能合理化迁移到 Fresha 或
              StyleSeat，以换取内置需求生成收益。

              Fresha 2025 年从免费转付费的转向提出了相邻战略问题：Fresha 引入订阅收入后，市场护城河会削弱，还是混合模式会让它成为更耐久的竞品？早期证据显示，平台在定价转换中留住了多数专业人士基础；这相对
              GlossGenius 是强化，而不是削弱了 Fresha 的竞争位置。
