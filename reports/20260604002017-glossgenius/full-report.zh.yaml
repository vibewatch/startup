      - number: '2.2'
        title: 市场规模——服务支出、商户数量与软件机会
        blocks:
          - type: paragraph
            body: >
              没有单一权威来源覆盖所有 NAICS 8121 子板块的美国个人护理服务总收入，需要用多组口径交叉测算。SBDC（2025）引用的 First Research 估计，仅美国美发护理服务子板块就约 $25
              billion，覆盖约 84,000 家机构。若加入由 BLS 推导的美甲、按摩理疗、护肤和医美收入，自下而上的跨板块估计显示，美国个人护理服务总收入约为 $45–85 billion，取决于是否纳入医美
              spa、健身相邻健康服务和沙龙零售。

              从消费者支出口径看，BLS Consumer Expenditure Survey 2024 报告，家庭在个人护理产品和服务上的年均支出合计为 $978；按 135.76 million
              个消费单位放大，意味着个人护理总支出约 $133 billion，不过其中大多数是居家使用产品，而非专业服务。

              软件和支付平台机会需单独测算。BLS iag812 2025 显示，约 270,000 家机构经营 NAICS 812（个人护理和洗衣服务）；若保守估计可服务单元总数为
              500,000–700,000（包括在传统实体店之外工作的单人经营者），并假设合并订阅与支付费用年均 $2,500–$4,000，则软件加支付 TAM 为 $1.25–$2.8
              billion。GlossGenius 自报 100,000+ 客户，ARPU 约 $1,000（由 ~$100M ARR 推导），意味着当前渗透率约为软件可服务市场的 14–20%，也印证了 TAM 上限。

              全球预约排班软件市场（更窄类别）由 MarketsAndMarkets 估计 2023 年为 $342.3 million，并以 13.8% CAGR 增长至 2030 年 $803.7 million。另一份
              Allied Market Research 新闻稿则称，全球沙龙管理软件市场到 2030 年为 $9.74
              billion——十二倍差距反映的是范围定义完全不同；在无法取得底层方法论前，本文对该数字保持低置信度。
