  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与货币化架构
        blocks:
          - type: paragraph
            body: >
              GlossGenius 的收入来自两根互相咬合的支柱：经常性 SaaS 订阅层，以及为客户交易导流、处理和融资的嵌入式金融科技层。SaaS
              层按月或按年向商户收取三档固定订阅费——Standard、Gold、Platinum——没有免费方案，订阅本身也没有基于用量的定价。金融科技层对平台上每一美元交易收取固定比例，另对即时到账、薪资处理和资本预支收取附加费用。通过把平台锚定在强制支付路由上（GlossGenius
              Payments 深度集成且不易替换），公司确保每个订阅客户在规模化时也贡献金融科技收入。

              GlossGenius 没有市场平台或消费者发现收入模式；公司不会因替商户获得新客户而收费。截至
              mid-2026，业务也只在美国运营，所有收入和经营风险集中在单一监管与宏观经济地理范围内。薪资附加项和资本预支产品是在核心订阅加支付架构建立后推出的，属于有意设计的 ARPU
              扩张杠杆，而不是独立获客动作。第三方评测指出，平台移动优先、聚焦美国的设计限制了可服务企业级市场，也压低了多门店经营者带来的 ARPU 天花板。
