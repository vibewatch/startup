      - number: '6.5'
        title: 扩张、集中度与经营规模限制
        blocks:
          - type: paragraph
            body: >-
              GlossGenius 的商业模式在当前单人 / 小团队基础和多门店、高人数商家这个更高 ARPU 客群之间，形成了结构性张力。$148/month 的 Platinum 方案面向“10
              人及以上团队”，包含无限团队成员、佣金结构和高级分析；但独立评论者指出了实质缺口：没有房间和资源管理（全功能页仅标注“即将推出”）、多门店支持弱于 Boulevard 或
              Mindbody，也没有白标或高级自定义品牌。SchedulingKit 评论说得很直接：“团队排期有限，主要为单人专业人士设计；只服务美容和健康行业，不适合其他业务类型。”

              集中度风险体现在三层。第一，客户基底高度偏向单人经营者；相较团队型商家，他们的账户平均收入更低，个体流失敏感度更高。第二，GlossGenius 只做美国市场——SchedulingKit
              评论和所有官方内容都确认没有国际存在——这限制了总可服务收入。第三，美容 / 健康垂直集中意味着平台与美国个人服务就业周期高度相关。Professional Beauty Association
              数据显示沙龙行业约有 ~1M 持证专业人士，但 GlossGenius 在其中真正可触达的市场（预约制、移动优先、愿意支付 SaaS 费用的经营者）更小；在 120,000 个账户规模下，GlossGenius
              可能已经覆盖了愿意数字化的单人经营者中相当可观的一部分。

              存量账户内的先落地再扩张，靠方案升级（Standard → Gold → Platinum）和附加产品（Payroll
              $40+$6/seat、BNPL、Memberships）完成。爽约保护功能栈、Waitlist 和 AI Growth Analyst 都是 Gold/Platinum 功能，为超出 Standard
              需求的单人专业人士创造自然升级动机。免费数据迁移项目（“Free Data Transfer”）降低了新注册客户的切换成本，但也意味着这些客户后续流失时沉没成本较低。按方案层级划分的 ARPU、升级速度或
              Payroll 附加产品采用率都没有公开披露，限制了对扩张经济性的量化评估。
