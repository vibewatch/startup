      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >
              四个结构性驱动因素支撑美容与健康软件市场。第一，所有美容职业的就业增长为正且持续：BLS 预计美容师（2024–34）增长 5%，美甲师和美容护理师增长 7%，按摩理疗师增长
              15%——后者是增长最快的个人护理职业。新从业者进入市场并建立独立业务时，会带来增量软件采用机会。第二，医美 spa 板块快速扩张：AmSpa 数据显示，美国医美 spa 门店数从 2022 年 8,899
              家升至 2023 年 10,488 家，一年净增约 1,600 家设施——每一家都是支付意愿更高的潜在软件客户。第三，各年龄队列对数字预约的期待上升，Gen Z 和 Millennial
              消费者把社交媒体可见性和在线预约视为基本配置。第四，全球美容与个人护理产品市场可作为行业活力代理；GVR 估计该市场 2025 年全球规模为 $88.20 billion，并以 7.0% CAGR 增长。

              与这些驱动相对，三个采用约束具有实质影响。消费者支出压力最直接：SBDC 2025 分析明确指出沙龙行业消费克制出现早期迹象，并引用 Morgan Stanley 的消费支出展望和 Bank of America
              支出数据。中低收入消费者是常规沙龙服务核心客群，预计会最先削减可选支出。2025 年关税成本上升压缩经营者利润率，降低其投资新软件平台的能力。免费竞品入门档——Square Appointments 和
              Fresha 都提供零成本入门方案——对 GlossGenius $24/month Standard
              档形成结构性价格压力。美容软件内部存在切换成本（客户数据库、支付历史、预约逻辑），但并非高到难以跨越，尤其是刚开始采用预约工具的个体经营者。
