              GlossGenius 的客户基底结构性集中在单人经营者和 10 人以下团队，这是垂直 SaaS 中流失风险最高的客群。单人专业人士更容易受到停业、职业转向和竞争对手价格战影响（Fresha
              提供免费档）。这会限制 ARPU 上行压力；如果美国个人服务经济收缩，也会带来下行风险。
            calloutType: risk
