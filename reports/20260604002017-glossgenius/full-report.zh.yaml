      - number: '8.2'
        title: Series D 交易与估值历史
        blocks:
          - type: paragraph
            body: >-
              GlossGenius 于 2026 年 1 月 23 日完成 $44 million Series D，价格为每股 $49.00，投后估值 $1.12 billion。按 Forge Global
              披露，本轮投资方包括 2048 Ventures、Abaco、Bessemer Venture Partners、Burst Capital、HearstLab、Imaginary Ventures 和 L
              Catterton。在此之前，公司已完成三轮机构融资：2021 年 11 月 $16.4 million Series A（Bessemer 领投，投后约 $131M）、2022 年 9 月 $25
              million Series B（投后约 $394M），以及 2023 年 7 月 $28 million Series C（L Catterton 领投，投后 $510M）。Series C 到 Series
              D 的估值跃升——从 $510M 到 $1.12B，30 个月内增加 2.2×——符合公司跨过 $100M ARR 并达到可观支付量后的状态。累计融资约 $112.98M，对独角兽而言效率突出。SEC EDGAR
              中 GlossGenius（CIK 0001988828）的文件确认，2023 年 8 月 Series C 提交了 Form D，总发行规模 $35.99M。截至研究日，EDGAR 全文搜索尚未出现
              Series D 对应 Form D；这是小缺口，但对仍处五天申报期限内的融资并不罕见。Nasdaq Private Market 2026 年 5 月 20 日数据显示，二级价格为每股 $44.54，较
              $49.00 的 Series D 每股价格折价 9.1%；这符合后期私营股常见的流动性折价，不代表基本价值被下调。
