          - type: callout
            title: 资本效率异常出色——$113M 累计融资撬出 $100M ARR
            body: >-
              GlossGenius 用约 $112.98M 累计融资跨过 $100M ARR 门槛，ARR 与投入资本接近 1:1；在垂直 SaaS
              叠加金融科技的公司里，这种资本效率极少见。轨迹背后是产品驱动增长的结构性优势：没有外呼销售团队，支付路由锁定效应推高留存和扩张，又不需要传统 S&M 开支。对照基准是：达到独角兽估值的 Series D SaaS
              公司，中位数通常累计融资为 ARR 的 2–4 倍。
