  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >
              GlossGenius 的可服务市场，是美国所有采用预约制工作流并处理客户付款的个人护理服务商户，覆盖美发沙龙、理发店、美甲店、日间 spa、按摩理疗机构、护肤工作室和医美 spa。这些商户主要归入 US
              Census NAICS code 8121（Personal Care Services），其下又分为理发店与美发沙龙（812111/812112）、其他个人护理服务（81219）和美甲店（812113）。医美
              spa 视监管分类横跨 NAICS 8121 和医疗服务；GlossGenius 通过其 HIPAA 合规的 Platinum 方案明确覆盖这一类。

              纳入的支出类别分三桶：平台订阅费（每月 $24–$148 区间）、按总服务收入 2.6% 收取的嵌入式支付处理费，以及可选附加模块（薪资、HIPAA 合规、开票）。核心 TAM 不纳入美妆产品零售（NAICS
              4461）、拥有定制 ERP 系统的企业级连锁沙龙，以及不用数字排班工具的非正式经营者。相邻市场——健身工作室、纹身店、宠物美容——工作流有重叠，但由不同垂直竞品服务，本文将其视为相邻机会，而非核心 TAM。

              GlossGenius 替代的现状工具集很有分量：纸质预约本、Google Calendar 等通用日历应用、电话手工排班、社交媒体私信预约（尤其是 Instagram 和
              Facebook），以及租椅场景中不使用软件的到店排队。劳动力中大量自雇人群仍在使用这些替代品——BLS 2024 数据显示，76% 的理发师和 48% 的美发师为自雇——既创造了可触达机会，也带来惯性风险。
