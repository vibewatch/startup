      - number: '1.3'
        title: 融资历史与投资人图谱
        blocks:
          - type: paragraph
            body: >
              GlossGenius 早期拿到约 $2.8M 的小额种子前轮融资，随后在 Series A 前大约五年基本自举。资本纪律叠加 late 2021 前超过 $1B 的 GMV，让公司顺利进入机构融资阶段。

              $16.4M 的 Series A 于 November 2021 完成，由 Bessemer Venture Partners 领投，并有一批值得注意的战略天使参与：Tobias Lütke（Shopify
              CEO）、Chris Comparato（Toast CEO）、Aman Narang（Toast 联合创始人）和 Robert Murphy（Mindbody 联合创始人）。这些最成功垂直 SaaS 和 SMB
              支付公司的运营者入股，被公司有意作为市场论证的背书。Series B 于 September 2022 跟进，金额 $25M，由 Imaginary Ventures 和 Bessemer 共同领投，Left
              Lane Capital 新增为机构投资人；彼时 GlossGenius 披露 40,000 名客户和 $2B 年化交易量。$28M 的 Series C 于 July 2023 完成，由 L Catterton
              Growth Fund 领投，投后估值 $510M。Series D 于 January 23, 2026 完成，金额 $44M，把投后估值推至约 $1.12B，确认独角兽身份。累计融资约 $112.98M。
