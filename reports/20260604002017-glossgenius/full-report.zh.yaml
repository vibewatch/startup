      - number: '4.3'
        title: 单位经济与利润率结构
        blocks:
          - type: paragraph
            body: >
              GlossGenius 未公开披露毛利率、净收入留存率、获客成本或客户终身价值。以下判断基于可得定价和竞争数据的结构性分析。

              订阅板块具备 SaaS 典型毛利率，扣除托管、支持和产品成本后可能在 70–80% 区间。支付板块毛利率显著更低：GlossGenius 对所有交易类型（刷卡、轻触支付、存档卡和手工录入）收取
              2.6%，但支付服务商面对线下和非线下美容交易组合的底层交换费成本估计为 1.5–1.9%。扣除交换费、卡组织费用和支付处理商成本后，净支付利润率可能为 0.6–1.1%，也就是支付收入线毛利率约
              23–42%。这与该规模下的嵌入式金融科技经济性一致。

              两根支柱的混合毛利率——权重偏向更高毛利的 SaaS 部分——估计为 55–70%。这低于纯垂直 SaaS 公司 75–85% 的中位水平，但高于纯支付处理商通常 20–35%
              的毛利率。公司资本效率较高（累计融资约 $113M 即达到 $100M ARR），意味着即便精确数字不可得，单位经济仍然强。没有外呼销售团队是结构性 CAC
              优势：靠产品驱动病毒传播和社交预约集成获客，成本显著低于背负配额的现场销售。净收入留存率无法验证；“客户使用 GlossGenius Payments 后收入增加 65%” 的说法反映的是客户侧收入改善，而非
              GlossGenius 的 NRR。

              薪资和资本预支产品能在底层基础设施建成后增加 ARPU，成本不成比例上升。薪资栈（$40/month 基础费加 $6/seat）可能部分转付给第三方薪资引擎，从而压缩该产品线利润率。
