      - number: '8.3'
        title: 公开可比公司分析
        blocks:
          - type: paragraph
            body: >-
              GlossGenius 处在垂直 SaaS 和嵌入式金融科技的交叉点，纯可比公司有限。最相关的公开参照是
              ServiceTitan（TTAN），它服务家政和商业服务企业，平台包含排期、支付和劳动力管理。ServiceTitan 的 FY2026（截至 2026 年 1 月 31 日）收入为 $960.97
              million，毛利率 70.1%；截至 2025 年 7 月，非关联方股份合计市值约 $6.05 billion——对应 IPO 及 IPO 后交易期约 6.3× 的
              EV/Revenue。ServiceTitan 的可比毛利率和垂直 SaaS 商业模式，使其成为 GlossGenius
              最有用的单一公开可比。Toast（TOST）虽处相邻垂直（餐饮技术），但提供负面对照：FY2025 在 $6.15 billion 收入上的毛利率只有 25.9%，反映收入组合高度依赖支付量；截至 2026
              年初，P/S 约 2.4×。如果 GlossGenius 收入也像 Toast 一样明显偏向支付，其合理倍数会显著向该区间压缩。Damodaran 2026 年 1 月数据集显示，软件公司 P/S 中位数为
              9.01×、EV/Sales 为 9.56×，可作为上限基准。Mindbody 由 Vista Equity Partners 于 2019 年以 $1.9 billion 收购，是最相关的 M&A
              可比：它同样是面向健康和美容商家的垂直 SaaS 平台，产品直接重叠。这笔交易提供了 M&A 上限参考。Jobber 是一家拥有 400,000+ 用户的私人家政服务垂直 SaaS 公司，但没有公开估值数据。
