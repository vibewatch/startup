  - id: FO002
    title: 公司快照逻辑
    type: flow
    layout: standard
    summary: GlossGenius 将软件订阅和嵌入式支付打包，在一个交付给美容 / 健康服务商户的平台上，同时跑出 SaaS + 金融科技两条收入流。
    data:
      nodes:
        - id: operator
          label: 美容 / 健康服务商户
          description: 沙龙、水疗、医美 Spa 或健康管理机构；平台的主要买家和使用者。
        - id: platform
          label: GlossGenius 平台
          description: 一体化 SaaS：预约、支付、客户管理、营销、薪资、AI 分析。
        - id: consumer
          label: 终端消费者（客户）
          description: 预约服务的客户；通过 GlossGenius 托管预约页或社交集成互动。
        - id: payment-rail
          label: 支付处理
          description: 线下刷卡统一费率 2.6%；当日到账；Tap & Go 和 Pro Reader 硬件。
        - id: marketing
          label: 营销与留存
          description: SMS / 邮件活动、自动提醒、订金和豁免书功能减少爽约。
        - id: embedded-finance
