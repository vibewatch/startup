      - number: '1.5'
        title: 产品概览与平台范围
        blocks:
          - type: paragraph
            body: >
              GlossGenius 平台是面向预约制商户的垂直整合经营系统。核心模块包括在线预约（集成 Instagram 和 Google）、带 Tap & Go（$49）和 Pro
              Reader（$299/$349）硬件选项的移动 POS、客户管理与历史记录、SMS 与邮件营销、薪资与员工排班、数字表单和弃权书、库存管理以及嵌入式融资。Memberships 和 Packages 于
              2025 年上线，AI Growth Analyst 于 2026 年首发。支付处理支持当日到账，以及 $1,000 至 $250,000 的商业资本预支。

              第三方评测认为，平台强项在于移动优先 UX、一体化读卡器、社交预约集成和固定费率定价的可预测性。已识别的限制包括没有免费入门档、多门店团队管理受限，以及相较部分新进入者，历史上 AI 预约自动化不足。App
              Store 评分为 4.5/5（3,800+ 条评价），Capterra 评分为 4.5，说明个体经营者层面的从业者满意度较强。
