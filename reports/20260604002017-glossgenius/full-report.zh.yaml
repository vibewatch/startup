      - number: '7.2'
        title: 支付经济性与利润率压缩
        blocks:
          - type: paragraph
            body: >-
              GlossGenius 面临利润率压缩，因为它的变现栈与支付处理紧密绑定，而沙龙软件厂商之间的支付处理正在越来越标准化。公司依赖 Stripe 处理交易，并宣传线下刷卡固定费率 2.6%；但 Square 标价为
              2.6% 加一小笔单笔交易费，Fresha 则采用免订阅模式，可把变现转向支付或交易市场经济。这会压缩 GlossGenius
              扩大支付抽成的空间，否则容易引发比价或流失。法律框架又叠了一层风险：GlossGenius 保留提前 14
              天通知后更改费用的权利，也可在调查期间暂扣资金。极端场景下这能保护公司，但客户基底由现金周期紧的小经营者组成时，也会放大不满。最大的尽调缺口在于，GlossGenius
              没有公开拆分软件利润率和支付利润率。没有这项拆分，投资者无法判断业务到底是附带支付的高端 SaaS 公司，还是支付占比重、正面临直接商品化压力的垂直软件公司。
