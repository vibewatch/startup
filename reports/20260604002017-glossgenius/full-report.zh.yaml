            title: 单人经营者 NPS 代理指标处于行业领先
            body: >-
              GlossGenius 在 SoftwareAdvice 上评分 4.8/5，五星评论占 76%；App Store 3,800+ 条评分为 4.5/5。对垂直 SaaS
              产品来说，这种满意度密度不寻常。多条切换评价（来自 Vagaro、Square、Mangomint）确认，其核心单人专业人士基底具备较强留存。
