      - number: '8.4'
        title: 私营 SaaS 市场估值框架
        blocks:
          - type: paragraph
            body: >-
              SaaS Capital 是面向私营 B2B SaaS 公司的领先机构贷款方，维护一套估值框架，并每年更新至 2026 年。该框架用三个因素计算公司的合理 ARR 倍数：当前公开 SaaS 的 SaaS
              Capital Index（SCI）倍数、公司的 ARR 增长率，以及公司的净留存率（NRR）。在披露的 $100M+ ARR 和此前几年行业推算约 60–80%
              增长（基于收入里程碑和融资时间）下，GlossGenius 落在私营 SaaS 倍数的高端层级——取决于 NRR 质量，约为 8–15× ARR。因此 Series D 的 11×
              倍数处在市场给强增长公司区间的上半段。不过，没有确认的 NRR 数据，仍留下很大不确定性。作为背景，SaaS Capital 调研中 2025 年 SaaS 公司增长率中位数为 25%，显著低于
              GlossGenius 的隐含增长。如果按同业中位数增长、且没有 NRR 溢价，合理倍数会压缩到 5–7× ARR，对应 $500–700M 估值，较 Series D 价格有明显折价。因此，基准情景假设
              GlossGenius 继续跑赢私营 SaaS 中位数，并靠持续 30%+ 增长和 115% 以上 NRR 支撑溢价倍数。
