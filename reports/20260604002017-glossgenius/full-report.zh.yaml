              GlossGenius
              把脊椎按摩师、私人教练、瑜伽工作室和医学减重诊所加入专业垂直列表，说明公司有意把总可用市场（TAM）扩到核心美容之外。不过，未找到这些垂直的具名客户证据或专门功能页；这类扩张可能更像愿景型营销，而不是针对这些细分市场已经形成实质产品差异化。
