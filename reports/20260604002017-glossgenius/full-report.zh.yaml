      - number: '6.4'
        title: 留存、满意度与再次预约
        blocks:
          - type: paragraph
            body: >-
              GlossGenius 没有公开披露净留存率（NRR）、总留存率（GRR）或流失率。评论平台给出的满意度代理指标持续较强：SoftwareAdvice 的 348 条已验证评论中，易用性 4.84/5、性价比
              4.75/5、客户支持 4.75/5。其中 266 条为五星、30 条为四星，只有 1 条为二星，分布明显向正面倾斜。App Store 的 3,800+ 条评分为 4.5/5。

              平台的留存机制写得很明白：GlossGenius 的 App Store 描述称，“60% 离店时没有下一次预约的客户不会主动再次预约”；平台用自动化 Rebooking Reminders、处理临时取消的
              Waitlist，以及用于重新触达的 AI-powered Email/Text Marketing 来应对。Memberships and Packages（2025
              年新增）为高频客户提供订阅锁定。Client Insights 功能会展示再次预约习惯分析，并跟踪留存率、每位客户平均销售额和月度新客户数。

              SoftwareAdvice 评论里的反向证据暴露了运营摩擦：一位评论者称“预约会消失、短信提醒发不出去、信用卡读卡器不能用”，并抱怨问题解决很慢（工单制，1–2 天 SLA）。另一位提到 SMS
              营销限制：Gold 方案每月包含 500 个 SMS 额度，超额费用会让拥有大量历史客户数据库的商家感到吃痛。第三位评论者提到排期边界场景，即工作时长设置会挡住更长的服务。这些投诉在 348
              条评论中只占少数（1–3 星评分少于 10 条），但说明高客流经营者在可靠性和可扩展性上确实有痛点。
