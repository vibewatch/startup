        - GlossGenius 通过 Stripe 处理银行卡付款，并承接支付受理流程。
        - PCI SSC 称，处理银行卡的实体必须遵守 PCI 标准。
        - 高
        - 要求提供 PCI 范围、SAQ/ROC 状态，以及与 Stripe 的共同责任细节。
      - - FTC 隐私与安全预期
        - 公司一边储存财务和身份数据，一边作出隐私承诺。
        - FTC 指引强调数据保护措施和真实的隐私声明。
        - 中高
        - 要求提供安全控制、泄露处理流程和隐私治理负责人。
      - - 州许可和美容业合规
        - 专业人士用该软件经营受监管的美业生意。
        - Terms 将许可合规责任放在专业用户身上。
        - 中
        - 要求说明平台如何按州检查、提示或免责声明许可义务。
      - - 仲裁和集体诉讼弃权
        - 客户争议按合同被导离法院。
        - Terms 要求个人仲裁，并放弃集体诉讼。
        - 中
        - 审查争议数量、投诉处理流程和仲裁历史。
      - - 用户内容和业务转让权
        - GlossGenius 主张宽泛的内容权利，并可能在交易中转让数据。
        - Terms 授予永久内容许可；Privacy Policy 允许在并购中转让数据。
        - 中高
        - 要求提供数据留存规则、并购转让保护措施和同意机制。
    notes: 各行覆盖公开材料中可见的主要监管和合同义务；认证深度和执法历史在公开来源中仍不完整。
