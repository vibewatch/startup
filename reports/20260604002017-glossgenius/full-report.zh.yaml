      - 乐观逻辑
      - 悲观逻辑 / 反向逻辑
      - 关键尽调问题
    rows:
      - - 收入质量
        - 高毛利经常性 SaaS 订阅，120K+ 付费商户
        - 支付组合可能把混合毛利率稀释到 50% 以下；类似 Toast 26% 毛利率轨迹
        - 实际 SaaS 订阅收入与支付收入拆分是什么？
      - - 增长率
        - 公司达到 $100M ARR——建设阶段 CAGR 可能为 60–80%
        - 到 $100M ARR 规模后，增长通常放缓；经济压力下 SMB 流失可能加速
        - 最近 12 个月 ARR 增长率是多少？
      - - 市场领导力
        - 美业 / 健康垂直 SaaS 的品类创造者；120K 家商户带来品牌忠诚度
        - Square Appointments、Fresha 和 Booksy 增加垂直专用功能；横向 SaaS 继续扩张
        - 核心美发沙龙客群的 NRR 和流失率是多少？
      - - 估值倍数
        - ServiceTitan 可比为 6–7× EV/Rev；Mindbody 并购为 13–19× ARR；11× 站得住
        - 若毛利结构接近 Toast，合理倍数会降至 2–4× P/S；$1.12B 入场价意味着实质下行
        - 按收入流审计后的毛利率是多少？
      - - 退出路径
        - IPO 候选（云原生、$100M ARR、独角兽）；大型企业 SaaS 或 PE 可能有并购兴趣
        - 2026 年 IPO 市场条件不确定；前几轮 PE 形成悬置压力；老股市场流动性不足
        - 管理层目标退出时间表和偏好路径是什么？
    notes: 投资逻辑和反向逻辑条目代表投资者之间的核心分歧。若 NRR 和毛利率达到基准情景门槛，证据权重偏向投资逻辑；若毛利披露显示收入严重依赖支付，反向逻辑占上风。
