      - number: '7.4'
        title: 监管、法律与数据隐私风险
        blocks:
          - type: paragraph
            body: >-
              GlossGenius
              的合规面比其面向消费者的友好品牌暗示的更宽。隐私政策称，公司会收集敏感身份标识和金融数据，包括社会安全号码、银行账户、支付卡信息、专业执照详情和照片。这会自动抬高隐私、安全和支付处理门槛。政策还提到
              California 和其他州隐私制度；FTC 的隐私安全指引也明确，处理消费者数据的公司必须保护数据，并兑现隐私承诺。支付侧，PCI 标准适用于处理支付卡的实体，因此依赖 Stripe
              并不会消除合规暴露，只是把它转入共同责任区。条款又增加了法律复杂度：把执照合规责任放在专业人士身上，强制个人仲裁，并授予 GlossGenius
              对用户内容的广泛永久许可。公司还保留在业务交易中转移数据的权利。同样重要的是公开材料没有写出的东西：所审查材料未披露 PCI DSS 等级、SOC 2 报告或类似认证，外部投资者对安全成熟度的可见度有限。
