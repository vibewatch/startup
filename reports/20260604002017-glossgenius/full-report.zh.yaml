chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >
              GlossGenius 是一体化 SaaS 平台，专为预约制美容与健康商户打造，覆盖沙龙、spa、医美 spa、健康护理机构及相邻垂直场景。公司于 September 2015 在 New York 注册，并在
              2016 年商业化上线产品，从宿舍里的自由职业化妆师想法，成长为截至 mid-2026 服务超过 120,000 家商户的平台。总部位于 169 Madison Avenue, New York, NY
              10016，另有办公地址 579 Broadway Suite 2C, New York。

              商业模式由经常性订阅和支付处理经济性共同驱动：商户支付月度平台费（Standard、Gold 或 Platinum 档位），并以固定 2.6% 的线下刷卡费率把交易导入
              GlossGenius，从而按每个席位产生软件加金融科技的混合收入。GlossGenius 称，客户第一年收入平均提升 26%，每月节省约 40 小时行政工作，并达到 75%
              的平均再预约率——这些数字是公司主要的获客证明点。平台用一个移动优先界面处理预约、支付、客户管理、营销、薪资、表单和嵌入式金融服务。公司有意不设外呼销售职能；从创立到独角兽估值，增长主要靠自然口碑和产品驱动分发。
