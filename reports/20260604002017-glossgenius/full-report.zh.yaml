      - number: '1.4'
        title: 规模、牵引力与关键里程碑
        blocks:
          - type: paragraph
            body: >
              对一家先自举、后加速的垂直 SaaS 公司而言，GlossGenius 已跑出不常见的规模。客户数从 late 2021 Series A 完成时的“数万”，增长到 September 2022 约
              40,000，mid-2023 约 50,000–60,000，并在 mid-2026 超过 120,000。Forbes 提到，公司已跨过 $100M ARR，平台每周记录超过一百万次预约。支付处理量在
              Series B 完成时（September 2022）估计为 $2B 年化，2026 公司材料则称为“数十亿美元年支付量”。公司披露 2022 和 2023 年收入均实现三位数同比增长。

              Fast Company 将公司评为 2024 年零售领域 Most Innovative Company，理由包括新功能——数字弃权书、订金和 AI 营销助手——把客户取消和爽约率平均降低
              42%。GlossGenius 在 2025 年加入 Memberships 和 Packages，并在 2026 年推出 AI Growth Analyst 产品。公开来源显示员工数已增至约 300–378
