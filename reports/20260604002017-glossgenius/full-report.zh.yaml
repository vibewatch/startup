          - type: callout
            title: BBB D- 评级对支付和借贷平台是重大信号
            body: >-
              GlossGenius Inc. 在 Better Business Bureau 获得 D- 评级，是 BBB 评分体系中仅高于 F 的最低非 F
              等级。对一家处理数十亿美元年支付量、并向小商户提供资本预支的公司而言，金融产品类别中的未解决消费者投诉带来的监管和声誉风险，高于纯 SaaS 公司会承受的风险。尽调应专门查询 CFPB
              投诉数据库；州货币转移牌照主管机关或 FTC 是否存在正在进行的监管调查，必须确认或排除。
