  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 竞争强度与市场替代风险
        blocks:
          - type: paragraph
            body: >-
              竞争是 GlossGenius 的一阶风险，因为公司正处在沙龙软件最拥挤的区域：单人和微型商家的工作流工具。Square Appointments
              能以零月度订阅费接入个体服务提供者，同时提供几乎相同的核心支付轨；Fresha 也继续用零订阅叙事压低美容经营者的软件价格锚。也就是说，GlossGenius
              需要证明付费软件的价值，对手不是弱小本地既有厂商，而是可信、分发能力强，并带有免费入口或更强渠道的替代品。风险不只在价格。Booksy 拥有交易市场规模和客户端网络效应；Boulevard 和 Mindbody
              则更适合大型或多门店经营者，而 GlossGenius 若想上移市场就必须赢下这类客户。独立评论也认为 GlossGenius
              功能比许多竞品更轻；这让单人用户更容易喜欢它，却更难延展到更大团队客群。估值放大了竞争负担：2026 年 Series D 之后，客户新增或上移市场一旦放缓，增长预期和退出倍数都会承压。
