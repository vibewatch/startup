      - number: '3.4'
        title: 护城河耐久性与替代风险
        blocks:
          - type: paragraph
            body: >
              GlossGenius 的可持续竞争优势集中在三个维度：（1）在美容和健康专业人士中的品牌资产，他们把平台与高端移动 UX
              和简单易用联系在一起；（2）集成薪资处理，会形成会计和税务申报依赖，在薪资周期内显著抬高切换运营成本；（3）贴合美容行业的数据格式，包括客户照片、服务历史和为美容工作流定制的采集表单。

              首要替代风险，是核心排班和支付功能被商品化。Square 免费档、Fresha 低成本模式和 Vagaro 全包中端方案，都能以挑战 GlossGenius
              对早期个体经营者价值主张的价格，提供排班、支付和基础营销。如果新造型师的第一个数字工具是 Square（免费）或 Fresha（~$20/mo），GlossGenius
              之后必须在品牌惯性和已嵌入工作流面前重新赢得这名专业人士。

              次级风险来自 Boulevard 和 Mindbody 的高端替代。随着 GlossGenius 扩展团队管理和医美 spa 功能以争取更大客户，它会越来越多地与 Boulevard 专为多服务者和
              ePrescribe 打造的工具链竞争，也会面对 Mindbody 在健身与 spa 企业级板块的主导品牌认知。Boulevard 的 12 个月合同结构和 $140–$328/mo
              价格点，反映出高端沙龙板块的支付意愿；GlossGenius 只有通过 Platinum 方案做大规模后，才能触达这部分需求。

              最弱的护城河元素，是缺少自有分发渠道。Vagaro、Booksy 和 Fresha 都有消费者侧网络效应：平台每新增一名消费者，都会为现有专业人士创造边际价值。GlossGenius
              的网络效应仅限于预约页带来的推荐流量和 Fast Company Most Innovative Companies 2024 品牌信号——这是一种软竞争优势，难以抵御平台侧在位者。
