      - number: '8.5'
        title: 情景分析——乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              三情景框架从 Series D 入场价每股 $49.00（投后 $1.12B）出发，模拟 GlossGenius 在 3–5 年持有期内的价值轨迹。所有情景都假设入场倍数为约 11× 滞后 ARR，并按退出时公开
              SaaS 市场状态预测退出倍数。乐观情景中，GlossGenius 到 2028 年达到 $250M ARR，靠 SaaS 订阅继续主导支付，维持 70%+ 毛利率，并以 10× ARR 通过 IPO 退出，形成
              $2.5 billion 估值——约为入场的 2.2×。基准情景中，ARR 到 2029 年增长至 $180M，混合毛利率为 60–65%；以 8× ARR 达成市场可接受退出，对应 $1.44 billion
              结果——约为入场的 1.3×，给 Series D 投资者带来个位数 IRR。悲观情景中，增长放缓到每年低于 20%——可能由支付市场份额输给 Square 或 Stripe，或经济压力下 SMB
              客户基底流失上升驱动——ARR 卡在 $130M，倍数压缩到 5×，退出价值 $650 million，相对 $1.12B 入场价亏损。极端下行情景（ARR 持平，4× 倍数）只会得到 $400M，约亏损
              65%。倍数压缩是关键摇摆因素：如果公开 SaaS P/S 倍数从今天约 9× 中位数降至 6×，即便基准情景轨迹也需要 $190M+ ARR 才能在 Series D 价格上达到盈亏平衡。
