      - number: '3.5'
        title: 切换成本与锁定分析
        blocks:
          - type: paragraph
            body: >
              美容软件的切换成本中等且不对称。专业人士侧数据——客户联系方式、预约历史、配方备注和支付记录——存放在平台内，并不容易迁移。GlossGenius 可为基础客户数据提供 CSV
              导出，但照片档案和服务历史备注若不手工重录，竞争平台很难顺利吃进。这种数据可携带摩擦，是最具体的锁定机制。

              薪资锁定高于单纯排班。使用 GlossGenius 集成薪资模块的专业人士，切换前必须对齐历史薪资记录、税务申报和 W-2/1099 文件——这会在年中形成有分量的阻力。Boulevard 和 Mindbody
              也以更高价格提供薪资集成，但 Fresha 和 Booksy 目前都不在嵌入式薪资上竞争。

              消费者侧切换成本天然较低：美容消费者习惯通过多个平台预约（多归属是理发店和美发沙龙预约的常态）。Booksy、Fresha 和 Vagaro
              都允许消费者预约市场上的任何专业人士，因此当专业人士更换平台时，消费者行为并不需要改变——只需在新平台上找到该专业人士。这一结构特征意味着 GlossGenius 无法利用消费者锁定来留住其专业订阅客户基础。

              运营惯性——员工培训、前台工作流、提醒模板——提供低到中等的切换阻力，会延缓但无法阻止竞争性流失。围绕 GlossGenius
              界面定制了入职流程、采集表单和再预约自动化的沙龙，确实会面临非平凡迁移成本；但当竞品出现有吸引力的价格或功能优势时，这种阻力通常会被侵蚀。
            claimRefs:
              - CP033
              - CP034
              - CP035
              - CP036
      - number: '3.6'
        title: 战略展望与尽调问题
        blocks:
          - type: paragraph
            body: >
              未来 12–24 个月的竞争动态取决于三个拐点：Fresha 在价格调整后能否守住市场规模（如果 Fresha 流失专业人士，对 GlossGenius 是上行）；Square 是否推出美容专用工具，抹平
              GlossGenius 的 UX 优势（下行）；GlossGenius 能否开发或收购消费者发现能力（若执行到位，带来转型级上行）。Booksy 已披露融资 $120M，2024 年收入
              $65.9M，说明其是资本更充足的国际同业；但 Booksy 地理分散更广、理发店占比更高，与 GlossGenius 高端沙龙基础的直接重叠只是部分而非全部。

              关键尽调问题：（1）GlossGenius 流失账户中，有多少迁往 Fresha、Vagaro 或 Square？流失去向数据可以量化最尖锐的替代向量。（2）GlossGenius
              是否试点或评估过市场平台或需求生成功能？产品或商业模式障碍是什么？（3）GlossGenius 的多门店客户数和 ARPU
              相对单店账户如何？这将厘清高端化扩张究竟能实质改善单位经济，还是只增加支持复杂度而没有收入提升。

              Boulevard 是高端定位上最相似的竞品；任何 GlossGenius 财务预测若假设医美 spa 档 ARPU 可防守，都应先详细审计 Boulevard 定价。如果 Boulevard 能以
              $234–$328/mo 加 ePrescribe 成功留住医美 spa，GlossGenius $148/mo 的 Platinum 方案可能结构性定价偏低；也可能恰好定价于大众化医美 spa 档，而
              Boulevard 的企业级打法无法高效覆盖这一层。
