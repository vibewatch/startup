      - number: '4.6'
        title: 展品
        blocks:
          - type: callout
            title: Series D 投资人未披露，是治理尽调阻断点
            body: >-
              Forge Global 对 January 2026 Series D 的列表把所有投资人标为“未披露”。对于一轮 $44 million
              的独角兽融资，缺少具名机构投资人并不寻常，也阻止了对清算优先权堆叠、反稀释机制、董事会组成变化和新投资人信息权的任何尽调。在数据室确认投资人身份和条款清单之前，无法评估 Series D 后的治理结构。
            calloutType: risk
