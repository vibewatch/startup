      - number: '7.3'
        title: 客户基底脆弱性与经济周期暴露
        blocks:
          - type: paragraph
            body: >-
              GlossGenius 已经有可观规模，但客户组合让收入基底结构性脆弱。公司强调平台上有超过 120,000
              家商家，不过自己的套餐设计和第三方评论都显示，重心仍是单人专业人士或很小的团队。这个客群很有吸引力，因为市场大且分散，但天然也更容易流失。BLS
              创业数据表明，企业存活率会随时间下降；当客户是一人经营者或微型商家时，这一点尤其重要，因为他们关停、退休、搬迁或转行都不需要漫长采购周期。宏观因素会把风险进一步放大。美容服务对消费者不是刚性支出，SBDC
              2025 年沙龙行业报告已经指出早期消费克制。如果弱消费环境下预约频次走软，微型商家几乎会立刻感受到压力，并可能取消软件、降级方案或减少支付量。GlossGenius 没有公开披露流失率、GRR 或
              NRR，因此投资者无法量化当前增长中有多少是耐久的，多少只是可替换的新增。
