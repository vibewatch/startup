      - number: '3.2'
        title: 功能与价格对比
        blocks:
          - type: paragraph
            body: >
              在八个竞品中，GlossGenius $24–$148/month 的定价（三档：Starter、Standard、Platinum）高于 Square 免费入门点，低于 Boulevard 企业级档位，大致与
              Vagaro 和 Booksy 相当。Platinum 档（$148/mo）为医美 spa 增加 HIPAA 合规图表、薪资处理和团队管理；这些功能 Boulevard 和 Mindbody
              也有，但价格显著更高。

              最关键的功能缺口，是缺少可嵌入网站的预约挂件。Vagaro、Mindbody、Boulevard、Fresha 和 Booksy
              都支持让现有网站直接接收预约、无需把消费者重定向到独立平台的挂件。GlossGenius 则提供子域名预约页（yourname.glossgenius.com），无法嵌入自定义域名。这把 GlossGenius
              的可服务客户限制在没有现有网站存在感的专业人士——这是有意义但并非无限的子集。

              第二个缺口是多门店管理。Boulevard、Mindbody 和 Vagaro 都支持单一账户下的多门店排班和报表。GlossGenius 的团队管理功能（2023
              年推出）支持员工级排班，但没有达到企业级竞品那种统一多门店仪表盘。StyleSeat 和 Fresha 与 GlossGenius 一样，主要面向单店或单人专业人士。

              在支付处理上，GlossGenius 每笔交易收 2.6%（与 Square Plus 档费率相同），且没有每笔固定费用；Square 对线下交易收 2.6% + 15¢。Fresha 线下收 2.29% +
              $0.20，线上收 2.79% + $0.20。Boulevard 采用定制处理费率。在这些命名竞品中，GlossGenius 的处理费率不是差异化劣势，低客单价交易下甚至可能略有优势。
