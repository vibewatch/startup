  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户画像与分层
        blocks:
          - type: paragraph
            body: >-
              GlossGenius 面向美国的美容、健康和保健服务专业人士。截至 2026 年，公司称服务 120,000+ 家商家，About 页面则提到 100,000+
              位业主；这些数字可能来自不同口径（商家账户相对个体业主 / 经营者）。平台明确覆盖 18 个专业垂直：发型师、理发师、美容师、睫毛技师、美甲师、化妆师、按摩师、medspa
              和医美从业者、脊椎按摩师、针灸师、眉艺师、行为治疗师、私人教练、美黑师、纹身和穿孔师、运动教练、瑜伽工作室，以及医学减重诊所。覆盖面很宽，但与头发护理相邻的人群（发型师、理发师、美容师、睫毛和美甲技师）历来主导美容软件采用；考虑到这些人在可服务市场中的普遍性，GlossGenius
              最大的收入集中度很可能也来自这部分人群。

              GlossGenius 按四类角色组织产品：单人专业人士、租位经营者、团队成员、业主 / 管理者。单人专业人士是最核心的设计对象：Standard 方案为
              $24/month，被描述为“非常适合单人创业者”；面向单人专业人士的落地页把 GlossGenius
              定位为一人业务的“始终在线伙伴，专为帮你取得优势而打造”。平台明确支持租位经营者，款项可直接打到其银行账户，不经过工作室业主的薪酬系统。最多 9 人的团队对应 Gold 方案（$48/month）；10
              人及以上团队对应 Platinum 方案（$148/month）。独立评论者一致认为 GlossGenius
              在更大团队场景里最弱；一家评论平台指出，“团队排期有限”是实质约束，产品“主要为单人专业人士设计”。公司只在美国市场运营；网站语言、定价和媒体报道都没有显示国际扩张。
