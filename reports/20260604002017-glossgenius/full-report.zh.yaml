      - number: '4.2'
        title: 订阅定价、实际收入代理指标与增长信号
        blocks:
          - type: paragraph
            body: >
              GlossGenius 的订阅价格公开且透明。Standard 方案年付承诺价为 $24/month，月付为 $28/month；Gold 方案（公司称其为最受欢迎档位）为
              $48/$56/month；Platinum 方案面向更大规模或医美 spa 取向的商户，价格为 $148/$168/month。这些都是标价，也代表每个活跃商户的最低订阅贡献。若加入薪资（$40/month 加
              $6/seat）、支付硬件和资本利息收入，实际 ARPU 会更高。

              Forbes 报道称，GlossGenius 在“过去一年”跨过 $100 million 年经常性收入（ARR），意味着 $100M 门槛是在 2025 年或 2026 年初达到。公司 LinkedIn 资料在
              2026 材料中描述为“数十亿美元年支付量”。按 120,000+ 家商户（公司披露）和 Gold 档平均水平（$48/month）假设，纯 SaaS ARR 下限约为 $69 million
              年化；纳入金融科技贡献后，总 ARR 超过 $100 million 与此一致。公司披露每周 1 million+ 次预约（Forbes）；若估计平均服务客单价为 $80–120，隐含周 GMV 为
              $80–120 million，外推年 GMV 为 $4.2–6.2 billion。这些是模型估计，不是已确认数字。

              独立 B2B 软件评测平台 Software Advice 基于 348 条已验证评价，将 GlossGenius 评为 4.8/5，并把它列为预约排班软件 FrontRunner 2026
              获奖者。高满意度评分叠加公司披露的 75% 再预约率和第一年平均预约量提升 22%，说明个体经营者层面的留存动态较强。
