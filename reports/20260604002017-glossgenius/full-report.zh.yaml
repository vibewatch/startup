      - number: '7.5'
        title: 平台依赖与运营可靠性
        blocks:
          - type: paragraph
            body: >-
              GlossGenius 在软件分发和获客上都依赖外部门卫。Apple 和 Google
              控制应用商店准入，其公开政策明确保留拒绝、下架或终止分发的权利。这不是假想的合同细节：对移动优先产品而言，应用商店中断会立刻伤害注册流、更新，甚至账户访问。分发风险也不止于应用商店。GlossGenius
              营销自己与 Google 和主要社交资料的预约连接，这有助于获客，却也让公司依赖自己无法控制的上游政策和 API。公开评论证据同样显示运营可靠性风险。Software Advice
              评论者提到预约消失、提醒失败、读卡器损坏和支持解决慢；BBB 档案则显示 D- 评级。条款还允许 GlossGenius
              在不通知情况下暂停账户，并自行决定停止服务功能。最后，对一家独角兽规模私营企业而言，公司仍相对不透明：治理、认证和财务分拆的公开披露都很薄，而这些正是平台和运营风险最难量化的地方，尽调负担因此上升。
