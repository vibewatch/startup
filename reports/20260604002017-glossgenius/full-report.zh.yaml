  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心产品套件与预约-支付流程
        blocks:
          - type: paragraph
            body: >-
              GlossGenius 把产品打包成三个付费档位，并用紧密衔接的预约到结账流程串起来。Standard、Gold、Platinum
              覆盖从单人经营者到更大团队的升级路径，价格也足够简单，匹配公司的自助购买模式。典型客户流程从托管预约页开始，客户通过 Google
              或社交渠道发现商家资料，然后无需登录即可选择预约。预约进入系统后，确认、提醒、订金、表单、免责书、客户资料补全、结账和再次预约提示都在同一套系统里完成。核心模块覆盖线上预约、CRM、收款、营销、库存、礼品卡、薪酬和分析；嵌入式金融则把结账和服务后的变现继续做厚。这种一体化是真正的产品强项，因为经营者不必再拼接排期、POS
              和营销系统。主要取舍在于：预约体验围绕 GlossGenius 托管环境优化，而不是做成可完整嵌入经营者自有网站的组件。
