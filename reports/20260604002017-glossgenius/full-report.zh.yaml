      - number: '5.5'
        title: 信任、安全、质量与合规
        blocks:
          - type: paragraph
            body: >-
              信任信号不错，但强度并不均匀。客户情绪方面，Software Advice、Capterra 和 The Salon Business 都给出较高评价，移动应用评分在 iOS
              上尤其强。合规和支持方面，公开材料显示公司有正式帮助中心、独立支付文档区、符合 EMV 的安全支付表述，以及招聘页提到的 medspa 工作流 HIPAA 插件。Fast Company 的 Most
              Innovative Companies 2024 和 Best Workplaces for Innovators 2025
              认可，也从第三方角度证明产品组织还在持续发货。信任图景里较软的一面没有那么有利。BBB 搜索结果也显示 GlossGenius 评级为 D-，与整体偏正面的软件评论均值形成声誉上的反向信号。Android
              评分明显落后 iOS，GitHub 上几乎看不到公开工程或开源足迹；除了营销话术和支持页面，公开材料也没有提供更深的支付安全控制外部文档。综合看，GlossGenius 对 SMB
              采用来说可信度足够，但大型买家可能期待的公开技术透明度信号仍偏弱。
