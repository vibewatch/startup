      - number: '8.6'
        title: 反向逻辑与不利因素
        blocks:
          - type: paragraph
            body: >-
              主要反向逻辑集中在估值和利润率风险。如果 GlossGenius 真实收入组合中支付占比超过 40%（类似 Toast），混合毛利率会向 40–50% 下滑，可比公司组也会从 ServiceTitan（6–7×
              EV/Revenue、70% 毛利率）转向 Toast（2–3× P/S、26% 毛利率）。混合毛利率低于 50% 时，11× ARR 倍数很难辩护。没有 NRR 披露，增长耐久性无法验证：聚焦 SMB 的
              SaaS 公司通常流失更高；如果 GlossGenius 的 NRR 低于 105%，市场会对其倍数给出明显折价。BBB D-
              评级反映未解决客户投诉，是声誉上的不利信号；它不至于击穿投资逻辑，但需要确认整改。二级市场流动性折价（较 Series D PPS 折价 9.1%）以及没有公开 IPO
              申报，都说明退出时间线不确定。最后，美容和健康垂直天然暴露于可选消费周期。若出现衰退或长期消费收紧，GlossGenius 的 SMB 客户基底可能出现更高停业率，带来流失和 ARR
              逆风，把公司推向悲观情景。相较下游市场更多元的横向 SaaS 平台，单一垂直集中会放大这一风险。
