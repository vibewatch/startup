        title: 创始人、领导层与董事会
        blocks:
          - type: paragraph
            body: >
              GlossGenius 由双胞胎姐妹 Danielle Cohen-Shohet（CEO）和 Leah Cohen-Shohet（Chief Business Officer）共同创立。Danielle 以
              summa cum laude 成绩毕业于 Princeton University；在校期间，她还做自由职业化妆师，客户管理摩擦直接启发了 GlossGenius。Princeton 之后，她加入
              Goldman Sachs 任金融分析师，随后离职全栈搭建 GlossGenius。她是 Techstars 校友，也参加过 Sephora Accelerate 项目。Leah 同样毕业于
              Princeton，担任 CBO；Inc Female Founders 100 对二人的报道也同等认可她。

              截至 2026，现任高管团队包括 Chief Technology Officer Christopher Cunningham、Chief Financial Officer Jed Cullen，以及在
              Nasdaq Private Market 文件中列为联合创始人的 Karim Butt。董事会由 Danielle Cohen-Shohet、Leah Cohen-Shohet、Kent
              Bennett（Bessemer Venture Partners 合伙人、Series A 领投方）和 Ian Friedman（L
              Catterton）组成，反映出主要机构投资人的位置。团队前五年基本没有专业销售人员，先靠自然产品市场契合验证业务，再接受机构资本。
