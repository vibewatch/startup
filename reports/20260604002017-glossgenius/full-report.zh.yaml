  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              GlossGenius 所处竞争格局分为三层。第一层是老牌企业级在位者：Mindbody（1998 年创立，2001 年更名）已吸收 Booker、ClassPass 和 FitMetrix，如今以
              $139–$599/month、强制 12 个月合同服务中大型健康工作室。Mindbody 官网已不再列示价格，而是把潜在客户导向销售电话；这种摩擦正是 GlossGenius 用透明自助定价切入的点。

              第二层是中端通用平台。Vagaro 对单人服务者收取 $30/month，额外用户每人 $10，支持网站预约挂件，拥有消费者市场，近期还加入 AI 辅助工具和 $100/month
              品牌应用附加项，是功能最完整的中端竞品。Square Appointments 提供免费个人档，以及 Plus（$29/mo）和
              Premium（$69/mo）方案，凭品牌认知和支付网络普及度构成最强免费档威胁。Acuity Scheduling（现归 Squarespace
              所有）是横向排班工具，并未针对美容工作流优化；它主要争夺重视网站原生预约、且价格敏感的独立专业人士。

              第三层是具备强消费者网络的美容垂直市场平台。Booksy 截至 2024 年在 25+ 个国家运营，拥有 140,000 家商户、40 million 名消费者和 $10 billion 年 GMV。Fresha
              在 2025 年从完全免费模式转向订阅加佣金模式，服务 120 个国家的 450,000+ 名专业人士和 25 million 名消费者。StyleSeat 只在美国运营，聚焦独立发型师和理发师，提供 AI
              驱动动态定价。Boulevard 面向高端沙龙和医美 spa，价格 $140–$328/mo，并带 ePrescribe 和临床图表功能。GlossGenius 位于中端平台与市场平台之间：UX
              高端、定价透明、设计贴近美容行业，但没有 Booksy 和 Fresha 已经建立的消费者发现飞轮。
