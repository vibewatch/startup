      - number: '2.3'
        title: 购买者、使用者与付款者分层
        blocks:
          - type: paragraph
            body: >
              GlossGenius 的可服务市场至少包含六类结构不同的购买者，每类工作流、预算权和软件采用触发点都不同。单人造型师和个体经营者——以个人品牌经营或在租用工位内经营的人——是数量最大的板块；BLS 数据显示
              76% 的理发师和约 48% 的美发师为自雇，意味着约 350,000–400,000
              名潜在单人经营客户。对这些买家而言，预算所有者就是专业人士本人，软件成本来自个人收入，采用触发点通常是客户无法再预约，或行政时间压力爆发。

              租椅经营者是结构不同的子板块：他们是沙龙内的独立承包商，需要可携带的预约与支付工具，不能依赖沙龙老板的系统。GlossGenius 在定价页中用独立银行账户功能明确支持这一模式。

              小团队沙龙（2–9 名服务者）引入了新的付款者动态——沙龙业主或经理控制平台选择并承担订阅费用，同时把平台部署到员工。中型沙龙（10+ 名服务者）叠加薪资、合规和报表要求。日间 spa
              和健康中心服务目录更复杂，也更需要零售 POS。医美 spa 是高端板块，需要 HIPAA 合规的数据处理、详细客户记录，并且通常要与临床采集表单更紧密集成。

              IBISWorld（经 SBDC）提供的消费者年龄队列数据显示，付费终端客户偏年长：55 岁及以上消费者贡献美发和美甲沙龙支出的 30%，25 岁以下消费者仅占
              12.1%——这说明现有客户群更重视服务连续性，而非技术新鲜感。不过 Gen Z 和 Millennials 正在重塑采用预期：SBDC 2025 分析引用的 Boulevard 调查显示，55% 的 Gen Z
              和 47% 的 Millennials 认为商户社交媒体存在感是最重要的预约因素；随着造型师打造数字档案，下游软件需求随之出现。
