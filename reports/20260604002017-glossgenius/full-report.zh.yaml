      - number: '8.7'
        title: 击穿投资逻辑的触发因素与关键尽调问题
        blocks:
          - type: paragraph
            body: >-
              三个条件会实质削弱投资逻辑，并迫使重新评估入场价：（1）混合毛利率低于 50%——若经审计财务确认，ARR 倍数必须从 10–12× 下修到 5–7×，意味着最高可支撑估值只有 $500–700M。（2）NRR
              低于 110%——持续低 NRR 表明 GlossGenius 无法在存量账户中以足够速度扩张来抵消流失，ARR 增长会比模型更快减速。（3）在驱动初始获客的 sub-$30/month 价位上，出现向
              Square Appointments、Fresha 或 Booksy 丢失竞争份额的证据。反过来，如果审计财务显示截至 2026 年中，滚动 12 个月 NRR 高于 115%、毛利率高于 65%、ARR 增长
              35%+，投资逻辑就得到确认。下一节列出的六项未决尽调问题，是做出可辩护投资决策所需的最低信息集。如果至少前四项——利润率拆分、NRR、ARR 桥和股权结构表——无法解决，这笔投资就不能高置信度承销。
