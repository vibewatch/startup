      - number: '6.2'
        title: 采用轨迹与增长
        blocks:
          - type: paragraph
            body: >-
              GlossGenius 披露的 120,000+ 商家客户数（App Store，2026 年），对一个面向独立美容专业人士的垂直 SaaS 平台是重要里程碑。多轮融资公告相互印证了增长轨迹：2022 年底的
              TechCrunch 文章称平台服务“数千名美容和健康专业人士”；2024 年 Series D 公告及随后 Entrepreneur 报道称超过 70,000 家商家；到 2026 年，App Store
              列表写着 120,000+，意味着较 2024 年基线至少增长 70%。更早的 FastCompany “100,000+ 家商家”表述与 About 页面一致，可能是稍早时间点的快照。

              平台互动信号偏正面：App Store 有 3,800+ 条评分，平均 4.5/5；SoftwareAdvice 记录 348 条已验证评论，评分 4.8/5。评论深度相对于账户数偏高（约每 345 个账户 1
              条评论），符合高参与度用户群特征。JustUseApp 对 3,802 条 App Store 评论的 NLP 分析也提取出正面主题（好用、能跟踪所有事情、客户喜欢）。GlossGenius 自己网站上的
              Vagaro-vs-GlossGenius 对比博客提到，强制创建账户会带来“预约流失 40%”，并把它作为转化率论据；这说明公司会跟踪并营销客户再次预约转化率。平台称“使用 GlossGenius
              处理收款的商家收入高出 2.6x”，这是公司自称的结果指标，没有第三方验证；它更可能反映 BNPL、会员等增购功能推高平均客单，而不是处理费率本身带来的因果效果。
