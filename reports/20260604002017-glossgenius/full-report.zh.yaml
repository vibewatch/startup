      - number: '8.8'
        title: 估值结论
        blocks:
          - type: paragraph
            body: >-
              鉴于 GlossGenius 已达到 $100M+ ARR 里程碑，并在垂直 SaaS 市场具备领导地位，$1.12 billion 的 Series D 估值仍在可辩护区间内；但相较 ServiceTitan
              的 6–7× EV/Revenue 和 Damodaran 软件 P/S 9× 中位数，11× 隐含倍数提供的安全边际有限。二级市场价格信号要求谨慎：较 Series D PPS 折价 9.1%
              虽不大，但确认尚未出现愿意按本轮价格买入的二级市场。5 年持有期下，基准情景 IRR 约 8–12%，不足以满足典型风投回报目标；只有乐观情景（2× 回报）属于风投级结果。乐观情景能否实现，取决于
              NRR、毛利率和增长率能否跑赢同业中位数——没有专有财务披露，三者都无法确认。因此，本投资结论是有条件建设性：可以推进投资意向书，但须以确认毛利率、NRR 和 ARR
              桥为条件；同时通过谈判参与权或反稀释条款来给下行价格保护，限制悲观情景中的暴露。交割前，六项尽调问题都必须解决。
