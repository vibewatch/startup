  evidenceGaps:
  - type: missing-source
    severity: material
    topic: regulatory-risk
    missingEvidence: Public regulator or court records that conclusively show whether GlossGenius has faced privacy, payments, or licensing enforcement as of June 2026.
    whyItMatters: Absence of an identified public action is not the same as proof of no action; investors need a cleaner legal-enforcement sweep before treating compliance posture as benign.
    diligencePath: Run direct regulator, court-docket, and state licensing database searches and request a management representation letter covering enforcement history.
    relatedQuestionRefs:
    - QR004
  - type: private-evidence-only
    severity: material
    topic: customer-risk
    missingEvidence: Customer churn, GRR, NRR, cohort retention, and plan-downgrade data by customer size.
    whyItMatters: Without retention disclosure, it is impossible to separate durable customer value from gross adds in a segment known for natural business attrition.
    diligencePath: Request cohort retention by plan tier and business size directly from management, with monthly logo churn and revenue churn over the last 24 months.
    relatedQuestionRefs:
    - QR014
  - type: private-evidence-only
    severity: material
    topic: payment-risk
    missingEvidence: Gross profit or contribution margin split between subscription software, payment processing, and other fintech revenue streams.
    whyItMatters: Margin durability depends on whether the business is mostly software or mostly payments economics exposed to commoditization and reserve risk.
    diligencePath: Request management financial segmentation for SaaS revenue, payments revenue, payment gross margin, and chargeback/fraud loss history.
    relatedQuestionRefs:
    - QR015
  - type: private-evidence-only
    severity: material
    topic: TR004 regulatory certification coverage gap
    missingEvidence: Public or diligence-room evidence of PCI DSS level, SOC 2 status, audit cadence, and formal governance ownership for security and privacy.
    whyItMatters: GlossGenius handles sensitive identity and financial data; certification opacity materially weakens confidence in control maturity.
    diligencePath: Request latest compliance reports, penetration-test summaries, and the internal owner for privacy, security, and payments compliance.
    relatedQuestionRefs:
    - QR018
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: governance-risk
    missingEvidence: Board composition, committee structure, audited financials, and investor-rights materials for the post-Series D company.
    whyItMatters: Governance opacity forces investors to underwrite operational and compliance risk without knowing oversight quality or financial discipline.
    diligencePath: Request cap table, board list, governance documents, audited financial statements, and current cash-runway materials during diligence.
    relatedQuestionRefs:
    - QR005
