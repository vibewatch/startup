- id: TR004
  title: Regulatory / legal risk register
  columns:
  - Framework / obligation
  - Why it applies
  - Evidence from sources
  - Residual risk
  - Diligence ask
  rows:
  - - CCPA and state privacy laws
    - GlossGenius collects sensitive business and consumer data and references California compliance.
    - Privacy Policy discusses processor/service-provider posture and California-related rights.
    - High
    - Request privacy program ownership, state-law mapping, and vendor DPA coverage.
  - - PCI DSS
    - GlossGenius processes card payments through Stripe and handles payment acceptance flows.
    - PCI SSC says card-processing entities must follow PCI standards.
    - High
    - Request PCI scope, SAQ/ROC status, and shared-responsibility details with Stripe.
  - - FTC privacy-security expectations
    - The company makes privacy promises while storing financial and identity data.
    - FTC guidance emphasizes data safeguards and truthful privacy statements.
    - Medium-High
    - Request security controls, breach processes, and privacy-governance ownership.
  - - State licensing and cosmetology compliance
    - Professionals use the software to operate regulated beauty businesses.
    - Terms place licensing compliance on the professional user.
    - Medium
    - Request how the platform checks, surfaces, or disclaims licensing obligations by state.
  - - Arbitration and class-action waiver
    - Customer disputes are contractually routed away from court.
    - Terms require individual arbitration and waive class actions.
    - Medium
    - Review dispute volume, complaint-handling process, and arbitration history.
  - - User-content and business-transfer rights
    - GlossGenius claims broad content rights and may transfer data in transactions.
    - Terms grant perpetual content license; Privacy Policy permits data transfers in M&A.
    - Medium-High
    - Request data-retention rules, M&A transfer safeguards, and consent mechanics.
  notes: Rows cover the main regulatory and contractual obligations visible in the public materials; certification depth and enforcement history remain incomplete in public sources.
