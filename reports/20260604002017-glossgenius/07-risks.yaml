- id: customer-fragility
  title: Customer Base Fragility and Economic Cycle Exposure
  body: GlossGenius has meaningful scale, but its customer mix creates a structurally fragile revenue base. The company highlights more than 120,000 businesses on the platform, yet its own packaging and third-party reviews show the center of gravity is the solo professional or very small team. That segment is attractive because it is large and fragmented, but it is also naturally churn-prone. BLS entrepreneurship data shows that establishment survival declines over time, and that matters disproportionately when the customers are one-person or microbusiness operators who can close, retire, relocate, or switch careers without a long procurement cycle. The macro overlay makes the risk worse. Beauty services are not mission-critical expenses for consumers, and SBDC's 2025 salon industry report already pointed to early consumer restraint. If appointment frequency softens during a weaker spending environment, microbusiness owners feel it almost immediately and may cancel software, downgrade plans,
    or reduce payment volume. GlossGenius has not publicly disclosed churn, GRR, or NRR, so investors cannot quantify how much of current growth is durable versus replaceable.
  claimRefs:
  - CR017
