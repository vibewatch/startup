- id: platform-dependency-operational
  title: Platform Dependency and Operational Reliability
  body: 'GlossGenius depends on external gatekeepers for both software distribution and customer acquisition. Apple and Google control app-store access, and their published policies explicitly preserve the right to reject, remove, or terminate distribution. That is not a hypothetical contract detail: for a mobile-first product, app-store disruption can immediately hurt sign-up flow, updates, or even account access. Distribution risk extends beyond the app stores. GlossGenius markets booking connections to Google and major social profiles, which helps customer acquisition but creates reliance on upstream policies and APIs that the company does not control. Operational reliability risk is visible in public review evidence as well. Software Advice reviewers describe disappearing appointments, failed reminders, broken card readers, and slow support resolution, while the BBB profile shows a D- rating. The terms also let GlossGenius suspend accounts without notice and discontinue service features
    at its own discretion. Finally, the company is still relatively opaque for a unicorn-scale private business: public disclosures remain thin on governance, certifications, and financial segmentation, which increases diligence burden exactly where platform and operational risks are hardest to quantify.'
