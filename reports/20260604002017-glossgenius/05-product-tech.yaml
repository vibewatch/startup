    {
      "id": "ai-innovation-embedded-finance-and-2025-2026-launches",
      "title": "AI Innovation, Embedded Finance, and 2025-2026 Launches",
      "body": "The clearest 2025-2026 product narrative is the combination of AI tooling and embedded-finance expansion. Growth Analyst is not marketed as a passive dashboard; GlossGenius says it scans business data daily, proactively surfaces missed revenue, builds custom reports, and benchmarks a salon or medspa against similar operators. Careers-page examples go further by claiming the first proactive AI agent found more than $5 million in potential customer revenue. The same page also surfaces adjacent AI work: a Voice AI Receptionist backend, an internal coding agent that reads tickets and writes code, and a HIPAA compliance plugin for medspa workflows. On the fintech side, the product now combines flat-rate payments, instant payouts, BNPL through Affirm, Afterpay, and Klarna, revenue-based capital advances, and integrated payroll. Fast Company’s 2025 workplace recognition adds one more roadmap signal by tying a hackathon-born goal-setting and analytics feature to a reported 51% average revenue increase for users.",
