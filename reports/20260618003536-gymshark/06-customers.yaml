  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: Consent-based named customer case studies or verified order-frequency evidence that tie specific end customers to repeat behavior, LTV, or app-led expansion rather than just public review surfaces.
    whyItMatters: Public proof today is strong enough to show real adoption, but it is still sample-based and surface-level. Without named case studies or validated repeat-order evidence, it is hard to convert customer enthusiasm into diligence-grade durability proof.
    diligencePath: Request anonymized cohort snapshots or consented case studies showing order frequency, AOV, return rates, and app usage by customer segment; cross-check them against review-platform themes.
    relatedQuestionRefs:
    - QU019
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-disclosure
    missingEvidence: Recent NRR, GRR, and post-2025 repeat-purchase cohorts by channel, geography, and loyalty-member status.
    whyItMatters: Historical public retention estimates are enough to flag durability questions, but they are too stale and too coarse to show whether the 2025 loyalty launch or app investment has structurally improved repeat behavior.
    diligencePath: Request monthly repeat-purchase cohorts, year-1 and year-3 retention curves, and loyalty-member versus non-member repeat rates from management dashboards.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: app-order-share
    missingEvidence: App-originated GMV, order share, conversion, and repeat-purchase performance versus web-only cohorts.
    whyItMatters: The app is central to the public customer story, but without order-share and repeat data investors cannot tell whether it is a real growth engine or mainly a better user interface layered on the same demand base.
    diligencePath: Request cohort dashboards splitting app versus web acquisition, first-order conversion, push-notification lift, and repeat purchase by platform.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU002
    - TU005
  - type: private-evidence-only
    severity: material
    topic: geographic-concentration
    missingEvidence: Customer, order, and GMV concentration by country and by each of Gymshark’s 14 online storefronts.
    whyItMatters: Public reach claims show breadth, but public traffic snapshots also imply meaningful concentration in a handful of developed markets. Without actual customer and sales concentration data, geographic resilience is still under-specified.
    diligencePath: Request storefront-level customer counts, GMV, repeat rates, refund rates, and courier performance for the top ten countries and all online storefronts.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU005
