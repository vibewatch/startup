chapter:
  number: 6
  title: Customers
  summary: 'Gymshark’s public customer evidence points to a large but still digitally concentrated DTC base: the company says it serves 200+ countries through 14 online stores, has 18M+ social followers, and supports that reach with 900+ employees, while third-party research shows it owns the gym/training occasion among younger buyers better than its broad awareness would suggest. The strongest independent proof of adoption comes from app-store ratings, user-testing conversion evidence, and transaction-panel history, but durability is less settled: third-party estimates put first-year retention near 28%, review sites are sharply polarized, and there is still no public cohort, NRR/GRR, app-order-share, or store-level concentration disclosure.'
sections:
- id: customer-footprint
  title: Customer footprint and segmentation
  body: 'Gymshark’s customer base is broad in geographic reach but still quite specific in who it wins with most naturally. The official about page says the company serves customers in more than 200 countries through 14 online stores, carries more than 18 million social followers, and employs more than 900 people across five regions. That is large enough to treat the brand as a scaled global consumer platform, not a niche influencer label. At the same time, public demographic summaries remain consistent that the core buyer is young, online-first, and fitness-native: third-party demographic writeups cluster the heartland in the 16–30 or 18–29 range, while also noting a smaller but real 35–44 cohort. The public mix has also evolved. Multiple summaries point to a shift from male-led roots toward a more female-skewed base, with women’s lines now driving a disproportionate share of sales. Category pages reinforce that reality: leggings and sports bras remain core merchandising anchors, while
    shorts and hoodies keep cross-gender breadth. The result is a customer base best segmented by age, gendered product mission, and digital behavior rather than by enterprise-style account logos.'
