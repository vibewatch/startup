- id: TU005
  title: Expansion and concentration risk table
  notes: The table focuses on customer-expansion levers and the matching structural concentration risks; risks are framed around cohorts, channels, and geographies because Gymshark is a DTC consumer brand.
  claimRefs:
  - CU015
  - CU017
