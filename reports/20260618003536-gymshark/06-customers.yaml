- id: TU003
  title: Named customer proof table
  notes: For a DTC brand, public “named customer proof” is mostly review-surface or app-store evidence rather than consented enterprise-style case studies; this table therefore enumerates public proof surfaces and the specific customer context they reveal.
  enumerationScope:
