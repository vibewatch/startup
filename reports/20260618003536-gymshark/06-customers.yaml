- id: expansion-and-concentration
  title: Expansion path and concentration risk
  body: 'Gymshark’s next customer-expansion leg does not look like landing a few huge accounts; it looks like deepening repeat behavior inside a large DTC base while widening the brand beyond a narrow youth and gym-only identity. Public evidence suggests three expansion levers already exist: first, the brand owns a defensible gym/training occasion among younger buyers; second, the app and training surfaces create repeat touchpoints beyond a single drop purchase; and third, the shift toward a more female-skewed mix shows the company can broaden within its installed audience. The concentration risk is therefore structural rather than logo-specific. Demand appears concentrated in younger cohorts, in a handful of developed markets, and in owned digital channels where checkout, delivery, and refund execution can quickly damage intent. Public sources still do not disclose app-originated order share, post-2025 cohort retention, or customer concentration by country or storefront. That means investors
    can see customer energy and digital adoption, but they still cannot cleanly underwrite how much of that energy becomes durable, repeat, geography-diversified revenue.'
