- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Public evidence suggests Gymshark’s journey runs from community awareness to app- or site-led browsing, first order, post-purchase service, and then either loyalty/community re-engagement or leakage.
  claimRefs:
