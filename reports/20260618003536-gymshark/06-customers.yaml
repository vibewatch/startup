  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Owns the gym / training occasion better than broad awareness would imply
    - Occasion ownership may stay narrow if the brand never broadens beyond gym identity
    - Strong acquisition among serious gym users, but harder expansion into mass athleisure
    - Request repeat purchase and AOV by use case, not just by geography
  - - App + loyalty + training surfaces create repeat touchpoints
    - No public app-originated order share or app-only retention curve
    - App could be the main expansion engine, or simply a convenience layer; public evidence cannot tell yet
    - Request app-led GMV, app repeat rate, and notification-to-purchase conversion
  - - Women-led product mix broadens the addressable base
    - A more female-skewed mix increases fashion-cycle and fit/sizing execution risk
    - Potentially higher wallet share if the line remains sticky, but returns and defect risk matter more
    - Request gender/category repeat rate, refund rate, and margin by family
  - - 200+ countries and 14 online stores create global reach
    - Demand is still concentrated in a handful of developed markets
    - Large long-tail opportunity, but exposure to core-market demand shocks remains high
    - Request customer and GMV mix by country and storefront
  - - DTC-first model preserves first-party data and pricing control
    - Courier, refund, and support failures can destroy repeat intent quickly
    - Operational leakage can offset otherwise strong product and app sentiment
    - Request courier SLA, delivery failure rate, refund cycle time, and support CSAT
  - - Loyalty/community programs may improve retention from a weak historical base
    - No public NRR, GRR, or post-2025 cohort evidence exists yet
    - Expansion story is directionally plausible but not yet diligence-grade on durability
    - Request monthly repeat-purchase cohorts before and after the loyalty launch
