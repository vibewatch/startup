  data:
    items:
    - label: Discover
      detail: Influencers, social following, and Gymshark’s owned gym/training association create top-of-funnel awareness, especially among younger buyers.
    - label: Browse
      detail: Shoppers land on the website or app to compare leggings, sports bras, shorts, hoodies, and launch drops; some consult outside reviews before committing.
    - label: Buy
      detail: The app tries to accelerate conversion with early access, wishlist saves, notifications, and order tracking, while user-testing work has improved checkout flow.
    - label: Receive / resolve
      detail: Post-purchase experience hinges on delivery, sizing, returns, and support execution; public review platforms show that this is the most common leakage point.
    - label: Re-engage
      detail: Training app use, loyalty XP, and Gymshark66-style community rituals aim to pull the customer back between purchases rather than rely on one-off drop hype.
    - label: Repeat or drift
      detail: Public retention evidence suggests some repeat behavior improves over time, but cohort durability is still materially below what best-in-class activewear brands report.
