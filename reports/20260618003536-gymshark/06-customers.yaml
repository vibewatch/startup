  rows:
  - - Core Gen Z / Millennial gym buyer
    - Self-buyer / self-user / self-payer
    - Performance + aesthetic gym apparel, especially launch-led purchases
    - Third-party summaries cluster the core in roughly the 16–30 or 18–29 range
    - Still the brand’s most natural acquisition engine
    - No public cohort split by age, LTV, or repeat rate
  - - Women-led apparel buyer
    - Usually self-buyer / self-user
    - Leggings, sports bras, seamless sets, lounge-to-gym crossover
    - Public summaries say women now drive roughly two-thirds of sales and product mix leans toward women’s wear
    - Largest visible broadening from Gymshark’s male roots
    - No public revenue split by gender after 2020
  - - Men’s performance buyer
    - Usually self-buyer / self-user
    - Shorts, hoodies, tees, conditioning basics
    - Brand started male-focused and still maintains active men’s/core categories
    - Keeps the brand from becoming a single-gender activewear label
    - No public men’s share, repeat rate, or category margin data
  - - App-first loyalist
    - Self-buyer / self-user
    - Early access, wishlist saves, push alerts, order tracking, app-only drops
    - App stores show 4.9-star ratings at scale across iOS and Android
    - Most direct path from discovery into repeat digital touchpoints
    - No public app-originated order share or retention curve
  - - International DTC shopper
    - Self-buyer / self-user / self-payer
    - Cross-border ecommerce orders through localized storefronts
    - Official about page says 14 online stores serve 200+ countries
    - Enables long-tail growth without wholesale dependence
    - No country-by-country customer or GMV disclosure
  - - Secondary older buyer (35–44)
    - Self-buyer / self-user, sometimes household gift buyer
    - Fitness wear with value-for-money and lifestyle use cases
    - FutureFit explicitly notes a 35–44 buyer pocket despite a younger core
    - Useful bridge into broader athleisure and household spending
    - Public proof is materially thinner than for the youth segment
