  rows:
  - - Apple App Store iPhone shoppers
    - Mobile-first buyers
    - Browse launches, save products, and buy through the iOS app
    - Production / live
    - App store shows a 4.9 / 5 rating from 169K ratings, which is unusually large visible proof for a DTC shopping app
    - Aggregate store rating does not reveal repeat-order frequency or revenue contribution
  - - Google Play Android shoppers
    - Mobile-first buyers
    - Use personalized recommendations, push alerts, order tracking, and wishlist features
    - Production / live
    - Google Play shows a 4.9 / 5 rating from 21.8K reviews and describes a full shopping workflow
    - Review count is smaller than iOS and still does not disclose app-originated order share
  - - Reviews.io direct buyers
    - Web/app apparel purchasers with post-purchase feedback
    - Assess fit, material quality, refunds, and service responsiveness
    - Production / live
    - Public buyer reviews are detailed enough to show both repeat buyers and churn threats
    - Self-selected complaint-heavy sample with no verified order frequency
  - - Trustpilot service reviewers
    - Customers reaching the refund/delivery stage
    - Expose courier, refund, and exchange friction after purchase
    - Production / live
    - Verified-review framing provides real post-purchase voice and shows repeat-order reluctance after bad experiences
    - Strongly skewed toward service issues rather than average everyday purchases
  - - Sitejabber reviewers
    - Cross-border and sizing-sensitive shoppers
    - Surface missing-order, refund-delay, and sizing complaints
    - Production / live
    - Adds a separate review platform and more geographically varied anecdotal evidence
    - Also self-selected and not a representative customer panel
