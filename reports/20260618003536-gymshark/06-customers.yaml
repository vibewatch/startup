- id: proof-and-adoption
  title: Public customer proof and adoption signals
  body: Because Gymshark is a consumer brand, public customer proof looks different from a SaaS-style logo roster. The cleanest independent proof is not a named procurement case study but a stack of adoption signals spread across app stores, review ecosystems, and digital-research case studies. Morning Consult’s 2026 athletic-apparel work is especially important because it shows Gymshark punching above its size in the specific gym/training occasion, leading that category entry point at roughly 36% despite far lower overall awareness than Nike. That helps explain why the app matters so much. Official app surfaces position it as the fastest path to launches, restocks, wishlist saves, and notifications; Apple’s App Store and Google Play both show 4.9-star ratings with very large review counts; and UserTesting’s case study shows Gymshark translating customer research into concrete digital gains such as higher checkout completion and higher size-guide use. Historical panel data from Bloomberg
    Second Measure adds another layer by showing that Gymshark built its growth first through strong new-customer acquisition, then gradually increased the returning-customer share of sales. Taken together, the public evidence supports real customer adoption, but it remains sample-based rather than a full customer ledger.
