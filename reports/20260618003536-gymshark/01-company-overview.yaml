callouts:
  - calloutType: strength
    title: "Thirteen Consecutive Years of Revenue Growth"
    body: "Gymshark has grown revenue every year since 2012, reaching £646m in FY25. This streak—through recessions, a pandemic, and supply chain disruptions—signals genuine demand durability and model resilience."
    claimRefs: [CO017, CO022]

  - calloutType: risk
    title: "Founder Concentration and Key-Person Dependency"
    body: "Ben Francis controls over 70% of equity and serves as CEO. His departure or incapacitation would pose an existential risk to brand identity, community credibility, and strategic continuity. No formal succession plan has been disclosed."
    claimRefs: [CO046, CO013]

  - calloutType: risk
    title: "Pre-tax Profit Decline for Three Consecutive Years"
    body: "While management frames declining pre-tax profit as deliberate reinvestment, the compression from £27.8m (FY22) to £7m (FY25) alongside a 2025 workforce restructure of 296 roles suggests that the operating model is under strain. EBITDA growth provides a partial offset."
    claimRefs: [CO018, CO023, CO026]

  - calloutType: insight
    title: "DTC Model Structurally Protects Margins"
    body: "By selling exclusively through owned digital channels (and a small but growing physical retail estate), Gymshark avoids wholesale margin leakage, captures first-party data, and maintains gross margins above 62%—materially above most wholesale-dependent sportswear brands."
    claimRefs: [CO035, CO048]

