      confidence: high
      freshness: historical
      answersQuestionRefs: [QO001]

    - id: CO002
      statement: "Ben Francis was 19 years old when he founded Gymshark, having been a student at Aston University and a part-time pizza delivery driver in Birmingham."
      type: company-claimed
