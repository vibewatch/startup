- id: verdict-and-gaps
  title: Financial Verdict and the Public-Evidence Gaps That Still Matter
  body: |-
    The financial verdict is directionally positive but not yet diligence-complete. Gymshark has proven that it can scale revenue into the mid-hundreds of millions, defend a still-strong gross margin, and remain profitable while funding stores, infrastructure, and community investment without paying dividends. That is materially better than the economics profile of many consumer brands that need repeated external capital to stay in motion. However, the evidence set is still too thin for a clean underwriting model. Public sources do not disclose category mix, realized net pricing after returns and promotions, customer acquisition cost, repeat purchase behavior, or store-level contribution. They also do not provide enough obligations detail to build a genuine runway or downside cash model. That leaves the chapter with a clear conclusion: revenue quality appears real and capital dependence does not look acute today, but the next step in diligence must focus on unit economics and working-capital cadence rather than on the already-proven headline growth line.
