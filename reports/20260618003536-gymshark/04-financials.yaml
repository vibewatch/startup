    - About 67%-72% pre-FY25 compression
    - Low to medium
    - Frames whether FY25 margin is cyclical reinvestment pressure or structural deterioration
    - Provide audited annual gross-margin series through FY25
  - - CAC / payback / repeat rate
    - Not publicly disclosed
    - Low
    - These are the core variables needed to judge growth quality and store rollout returns
    - Open customer-cohort, CAC, retention, and contribution-margin reporting
  notes: The table deliberately mixes disclosed facts and clearly labeled unknowns because Gymshark publishes enough data to infer direction, but not enough to calculate contribution margin or customer payback cleanly.
