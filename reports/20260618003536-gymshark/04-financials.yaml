    - +14.1%
    - Medium
    - Useful proxy for demand and checkout throughput
    - Provide order frequency, conversion rate, and returning-customer share
  - - FY24 units sold growth
    - +13.6%
    - Medium
    - Suggests unit demand stayed healthy alongside revenue growth
    - Disclose AOV, units per order, and category mix change
