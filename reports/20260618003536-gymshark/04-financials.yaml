chapter:
  number: 4
  title: Financials
  summary: Gymshark still shows quality top-line growth and resilient mid-60s gross margin, but the public record indicates that omnichannel, technology, and community reinvestment are compressing profit conversion while key unit-economics and capital-obligation details remain private.
sections:
- id: revenue-quality
  title: Revenue Quality and What the Public Record Actually Shows
  body: |-
    Gymshark’s headline revenue trajectory remains strong by any private-company standard. FY25 revenue reached £646 million, following FY24 revenue of £607.3 million, FY23 revenue of £556.2 million, and roughly £485 million in FY22. That sequence matters because it shows the top line is still growing even as profitability has deliberately compressed. Public commentary around FY25 makes clear that management does not view the lower profit line as an operational accident; it frames the reduced pre-tax result as the cost of funding stores, technology, and free community events while keeping the brand on a self-financed growth path. The quality issue is therefore not weak demand. The real diligence question is whether growth still converts into durable gross profit and repeatable contribution after inventory, promotions, and omnichannel costs. Public evidence says gross profit economics remain healthy, but it does not fully disclose how category mix, returns leakage, or store-level productivity are changing underneath the headline revenue line.
