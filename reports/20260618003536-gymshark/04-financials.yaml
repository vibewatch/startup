- id: pricing-monetization
  title: Pricing, Monetization, and Conversion Mechanics
  body: |-
    Public product surfaces still point to a straightforward monetization model: sell owned-brand apparel and accessories through Gymshark-controlled digital checkout, then use the app and community layer to pull demand forward. The visible price architecture supports a mid-premium positioning. Leggings on the public collection page show regular prices stretching from about $38 to $80, seamless items span roughly $24 to $68, and accessories range from about $6 to $62. Promotional overlays are clearly active, with sale prices appearing throughout the public assortment, and the app is explicitly positioned as a commerce accelerator via early access, app-only drops, notifications, order tracking, and personalized recommendations. Terms and conditions confirm orders are placed through the website or app, preserving owned checkout and first-party customer capture. The missing piece is realized pricing quality. Public sources show list prices and discounting behavior, but they do not reveal realized AOV, returns-adjusted net revenue, or how much app engagement translates into lower acquisition cost or higher retention.
  claimRefs:
  - CI016
  - CI017
