- id: TI004
  title: Capital adequacy table
  columns:
  - Metric
  - Value / status
  - Implication
  - Evidence quality
  - Diligence ask
  rows:
  - - Cash on hand
    - More than £37m at FY25 year-end
    - Supports continued self-funded expansion but is not a large cushion against a severe slowdown
    - Medium
    - Reconcile cash, revolver availability, and restricted cash if any
  - - Monthly burn
    - Not publicly disclosed
    - Cannot build a true runway model from public evidence alone
    - Low
    - Provide monthly cash burn or monthly operating cash outflow by season
  - - Runway months
    - Not publicly disclosed / not directly inferable
    - Profitable status lowers immediate concern, but runway still cannot be stress-tested
    - Low
    - Provide downside runway under flat revenue and elevated returns assumptions
  - - Planned use of funds
    - Stores, technology/data stack, community events, operating-model redesign
    - Profit compression appears strategic rather than rescue financing driven
    - Medium
    - Separate growth capex, technology opex, and community-marketing spend
  - - Next-round trigger
    - No public new-round trigger disclosed after the 2020 GA deal
    - Suggests no obvious near-term equity dependence, but visibility is incomplete
    - Low to medium
    - Disclose any covenant, board, or liquidity trigger for external capital
  - - Debt / project-finance obligations
    - No clear public debt package or project-finance schedule disclosed
    - Hard to test downside obligations without facilities and lease detail
    - Low
    - Provide debt facilities, lease commitments, and store-payback assumptions
  - - Formal filing status
    - Companies House lists full accounts through 31 July 2025, plus earlier FY24/FY23/FY22 filings
    - Confirms the reporting trail exists even where the public narrative simplifies the detail
    - High
    - Supply machine-readable extracts from the filed accounts for faster diligence review
  notes: Capital adequacy is judged from management disclosures, filing status, and known ownership structure; several rows are intentionally marked undisclosed because public sources do not provide debt, burn, or runway detail.
