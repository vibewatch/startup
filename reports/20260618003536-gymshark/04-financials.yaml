  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-returns
    missingEvidence: Net realized price, markdown depth, AOV, and return-rate data by category and market.
    whyItMatters: Visible list prices do not show whether promotions and returns are eroding contribution margin.
    diligencePath: Request weekly order-level revenue waterfalls showing gross sales, discounts, returns, refunds, and net sales by region and category.
    relatedQuestionRefs:
    - QI009
    relatedTableRefs:
    - TI002
    - TI005
  - type: private-evidence-only
    severity: material
    topic: runway-and-obligations
    missingEvidence: Monthly burn, downside runway, debt facilities, lease commitments, and covenant detail.
    whyItMatters: Liquidity looks acceptable today, but outside investors cannot stress-test capital adequacy without obligations detail.
    diligencePath: Obtain the treasury pack, debt schedule, lease roll-forward, and management downside liquidity model.
    relatedQuestionRefs:
    - QI017
    - QI023
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: unit-economics-and-cohorts
    missingEvidence: CAC, repeat purchase, contribution margin, cohort retention, and payback by geography and channel.
    whyItMatters: These metrics determine whether Gymshark’s reinvestment is compounding value or simply sustaining topline growth.
    diligencePath: Review cohort tables, attribution rules, paid-media efficiency reports, and contribution-margin views used in management reporting.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: minor
    topic: category-and-store-mix
    missingEvidence: Category-level revenue and gross profit plus store-level sales productivity and four-wall contribution.
    whyItMatters: Without these splits, investors cannot tell whether growth is broad-based or increasingly reliant on specific categories or immature stores.
    diligencePath: Request monthly category P&Ls, store KPI packs, and lease-adjusted payback analysis for each flagship and partner location.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI001
    - TI005
