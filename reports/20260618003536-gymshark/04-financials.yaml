- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on judgment
  - Exact diligence path
  rows:
  - - Category revenue and gross-profit split across women, men, accessories, and stores
    - Prevents precise understanding of mix quality and whether growth is broad or concentrated
    - Request monthly category P&Ls and channel mix for FY24-FY26 year-to-date
  - - AOV, markdown rate, return rate, and net realized price
    - Blocks clean translation from list price into true net revenue quality
    - Pull cohort-level order tables with gross sales, discounts, returns, and refunds
  - - CAC, repeat purchase, and payback by market
    - Prevents underwriting of growth efficiency and the economic value of the app/community funnel
    - Review channel-attributed CAC, cohort retention curves, and LTV/CAC by region
  - - Store-level productivity and lease-adjusted payback
    - Makes omnichannel expansion hard to value and stress-test
    - Obtain four-wall sales, contribution, capex, rent, and payback by location
  - - Debt facilities, lease obligations, and downside liquidity model
    - Limits true capital-adequacy analysis despite current profitability
    - Request treasury pack with facilities, maturities, lease commitments, and downside runway model
  notes: These are the highest-value missing metrics left after the public-source pass; each gap is phrased as a concrete diligence workstream rather than a generic request for more data.
  claimRefs:
  - CI036
  - CI037
  - CI038
  - CI040
