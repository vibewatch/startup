- id: TI002
  title: Pricing / monetization table
  columns:
  - Product / motion
  - List price / unit
  - Realized pricing visibility
  - Discount / friction signal
  - Source-backed implication
  rows:
  - - Leggings
    - Visible regular prices about $38-$80
    - Not publicly disclosed
    - Sale prices visible on collection page
    - Core apparel pricing supports a mid-premium position but does not reveal net realized price
  - - Seamless apparel
    - Visible regular prices about $24-$68
    - Not publicly disclosed
    - Sale prices visible; some final-sale non-returnable SKUs appear
    - Promotions are active enough that gross margin quality depends on mix and markdown discipline
  - - Accessories
    - Visible prices about $6-$62
    - Not publicly disclosed
    - Mix includes low-ticket essentials and higher-ticket bags
    - Accessories likely support basket building, but public sources do not disclose attach rate
  - - Shopping app
    - Free to download; monetized through product sales
    - No disclosed app-specific conversion metrics
    - App-only access, early drops, and push notifications are explicit
    - The app appears designed to lift conversion and repeat engagement rather than create direct subscription revenue
  - - Checkout flow
    - Website and app checkout require customer, delivery, billing, and payment data
    - No public funnel metrics
    - Owned checkout preserved across digital surfaces
    - Gymshark keeps first-party transaction control, which should support customer-data economics
  - - Returns mechanics
    - Most items returnable within 30 days; some hygiene items and 60%+ final-sale items excluded in US/Canada
    - No public return-rate disclosure
    - Returns carve-outs and final-sale rules can protect net revenue on deep discounts
    - Returns policy is visible, but returns-cost leakage into contribution margin remains undisclosed
