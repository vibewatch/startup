- id: TI001
  title: Revenue streams table
  columns:
  - Stream / lens
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Core DTC apparel
    - Owned-brand online sales through website and app
    - Revenue line
    - Primary economic engine; FY25 revenue £646m and FY24 revenue £607.3m
    - High headline visibility; low category split visibility
    - Disclose women/men/accessories/store share of revenue and gross profit
  - - Accessories
    - Bags, bottles, socks, lifting accessories and add-ons
    - Visible SKU pricing
    - 248 accessories listed publicly with visible prices from about $6 to $62
    - Medium; breadth is visible but revenue contribution is not
    - Quantify accessory mix, attach rate, and margin versus apparel
  - - App-assisted commerce
    - App-only access, early drops, notifications, secure checkout, order tracking
    - Checkout / retention surface
    - Free app used to accelerate product sales rather than sell a subscription
    - Medium; feature set is public but conversion impact is private
    - Provide app MAUs, conversion uplift, and repeat-purchase deltas
  - - FY24 geography mix — US
    - Regional DTC and omnichannel demand
    - Revenue
    - £251m in FY24
    - High for disclosed topline geography
    - Break out US growth by online versus store and by customer cohort
  - - FY24 geography mix — UK / Europe ex-UK
    - Regional DTC and store demand
    - Revenue
    - UK £136.4m; Europe ex-UK £145.7m in FY24
    - High for disclosed topline geography
    - Disclose margin and return-rate differences by region
  - - FY24 geography mix — Rest of World
    - International DTC demand outside core western markets
    - Revenue
    - £74m in FY24
    - High for topline; low for underlying profitability
    - Disclose logistics cost, duties, and return economics by RoW corridor
  notes: Public sources support consolidated revenue and FY24 geography splits, but not category-level revenue or gross-profit mix; stream-quality judgments therefore separate visible topline facts from undisclosed contribution detail.
