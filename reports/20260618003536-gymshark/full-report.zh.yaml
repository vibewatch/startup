            body: >-
              走完公开来源后，仍有两个重要缺口。第一，athleisure 与更宽 sportswear 的边界足够模糊，头部市场数字容易被滥用。超过 USD 600 billion 的 sportswear 数字和接近
              USD 400 billion 的 athleisure 数字可以同时为真，但描述的不是同一支出池。第二，Gymshark 披露的品类或地理维度 cohort 数据不足，无法锚定硬 SAM
              或转化漏斗。我们可以推断公司甜蜜点是高端线上训练服饰，但只靠公开证据，无法把这块需求和更宽的休闲穿着、鞋履或批发主导支出稳健拆开。因此，市场章节方向上很强，但在一个对承销重要的问题上仍不完整：在当前价格点下，Gymshark
              能盈利服务的品类需求到底有多大。正确的尽调姿态是保留巨大的自上而下机会，同时把自下而上的 SAM 和份额估算视为有边界的近似，而非事实。
