      - number: '8.3'
        title: 牛市、基准和熊市估值区间
        blocks:
          - type: paragraph
            body: >-
              情景分析最站得住脚的做法，是紧贴已披露的 FY25 收入和 EBITDA，而不是假装存在一轮干净的当前融资。熊市情景约 £1.1 billion 到 £1.3 billion，对应 20x EBITDA 或 2x
              收入，适用于利润再被侵蚀一年、门店经济疲弱或服务摩擦持续，把市场拉向更低公开可比公司的情况。基准情景约 £1.3 billion 到 £1.9 billion，反映 2x 到 3x 收入与约 22.5x 到
              25x EBITDA 的重叠。这个区间仍为规模、品牌和现金生成付费，但没有按 Gymshark 已经证明上市公司级经营杠杆来付费。牛市情景高于约 £2.2 billion、最高约 £2.6
              billion，只有在利润率修复、门店回本和渠道纪律足够可见，能在当前更冷的公开服装倍数环境下支撑 3.5x 到 4x 收入时才成立。没有披露入场价格时，这些是估值支撑区，而不是精确 IRR。
