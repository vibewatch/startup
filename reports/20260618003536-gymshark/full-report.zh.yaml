      - number: '6.4'
        title: 扩张路径与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Gymshark 下一段客户扩张不像拿下几个巨型账户，更像是在大型 DTC 基础内深化复购，同时把品牌从狭窄的年轻和只健身房身份中拓宽。公开证据显示，三个扩张杠杆已经存在：第一，品牌在年轻买家中拥有可防守的健身房
              / 训练场景；第二，app 和训练界面创造了超越单次上新购买的重复触点；第三，向更偏女性组合的转移显示公司能在既有受众内拓宽。集中度风险因此是结构性的，而不是特定客户标识的。需求看起来集中在年轻
              cohort、少数发达市场，以及自有数字渠道；在这些渠道里，结账、配送和退款执行会迅速伤害意图。公开来源仍未披露 app 来源订单占比、2025 年后的 cohort 留存，或按国家 /
              门店网站划分的客户集中度。这意味着投资者能看到客户能量和数字采用，但仍无法干净承销其中多少会变成耐久、可复购、地域多元化的收入。
