      - number: '4.5'
        title: 财务结论与仍然重要的公开证据缺口
        blocks:
          - type: paragraph
            body: >-
              财务结论方向正面，但还不到尽调完成。Gymshark
              已证明自己能把收入扩展到数亿英镑中段，守住仍然强劲的毛利率，并在不分红的情况下为门店、基础设施和社区投资出资，同时保持盈利。这明显好于许多需要反复外部资本才能运转的消费品牌经济画像。不过，证据集仍太薄，无法支撑干净的承销模型。公开来源未披露品类组合、扣除退货和促销后的实际净价、获客成本、复购行为或门店层面贡献，也没有提供足够义务细节来建立真正的资金续航或下行情景现金模型。本章因此留下一个清晰结论：收入质量看起来真实，资本依赖今天也不显急迫，但下一步尽调必须聚焦单位经济和营运资本节奏，而不是已经证明的口径增长线。
