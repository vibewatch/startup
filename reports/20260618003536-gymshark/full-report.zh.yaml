      - number: '1.5'
        title: 里程碑与战略演进
        blocks:
          - type: paragraph
            body: >
              Gymshark 从 Birmingham 车库创业项目走到全球独角兽，经历了几个清晰阶段。2012 年创立时，公司先做代发货补剂网站；不到一年，Ben Francis 就开始手工缝制服饰，并率先向头部健身
              YouTuber 播种影响者营销。BodyPower 2013 是拐点——Luxe Tracksuit 在 30 分钟内产生 £30,000
              收入——验证了品牌的大众吸引力和展会加运动员的营销模型。2015–2017 年，公司引入职业经理人（Steve Hewitt、Paul
              Richardson）来扩展基础设施；品牌拓展女性无缝品类，并扩大其全球社区。

              2020 年 General Atlantic 交易释放了用于北美扩张的资本和战略支持。2021 年 CEO 交接让创始人重回掌舵位置。Gymshark 于 2022 年 10 月开设 London Regent
              Street 旗舰店，首次进入线下零售。2023 至 2026 年，公司大举投资全渠道基础设施：在全球主要城市开设新店，由 Deloitte 搭建的 Google Cloud 数据平台据称单年带来 £20m
              增量收入，并推出一系列免费社区举铁活动。2026 年初，公司通过零售伙伴 Breuninger 和 Engelhorn 进入德国。Ben Francis 于 2026 年初暗示的“secret
              project”尚未公开宣布。
