      - number: '6.3'
        title: 留存、满意度与复购行为
        blocks:
          - type: paragraph
            body: >-
              耐久性是公开图景更复杂的地方。历史交易面板研究和衍生第三方摘要都把 Gymshark 第一年的留存率放在约 28%，Bloomberg Second Measure 视角下三年后仅 15%
              客户仍被留存。对一个接近时尚的 DTC 品牌来说，这并非灾难，但也足够弱，意味着复购必须被持续争取，而不能默认存在。管理层更新的留存工具包看起来正是为这个问题设计。Rivo 记录了 2025
              年四层忠诚度计划，奖励训练、app下载和购买，同时把 Gymshark66 及其他社区循环描述为订单之间争夺日常注意力的机制。不过，公开情绪两极分化。Apple 和 Google app
              评分优秀，TopConsumerReviews 3.5/5 尚可，并引用 Trustpilot 中 75% 五星占比；但 Reviews.io、Trustpilot 和 Sitejabber
              等服务权重高的评论平台，频繁出现配送失败、换货循环、面料偏薄、尺码不一致和支持响应问题。Gymshark 确实发布了清晰 30 天退货政策和专门帮助流程，因此公开问题不是缺政策，而是购买后执行流失。
