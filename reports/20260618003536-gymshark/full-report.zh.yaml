    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 以投委会风格，从品牌证明、经济性、风险和估值支撑维度打分。
    data:
      items:
        - label: 品牌 / 社群证明
          value: 8
          detail: 全球触达和社交规模确实支撑溢价
        - label: 规模证明
          value: 7
          detail: £646m 收入说明 Gymshark 已不再是小众细分品牌
        - label: 毛利质量
          value: 7
          detail: 62.3% 毛利率仍支撑高端定位
        - label: 利润轨迹
          value: 4
          detail: 税前利润压缩和重组仍是明确观察点
        - label: 资产负债表韧性
          value: 6
          detail: 现金和库存显示短期没有压力，但公开跑道细节有限
        - label: 公开可比公司支撑
          value: 5
          detail: 当前市场参照支持有纪律的溢价，不支持空白支票式溢价
        - label: 证据质量
          value: 4
          detail: 2020 年后没有披露估值标记或股权结构桥接，压低确信度
        - label: 入场纪律
          value: 6
          detail: 价格合适时标的仍可投；高于约 £2bn 后就很难辩护
    approximationNotes: 分数是服务投委会讨论的分析判断，不是标准化外部评级。分数越高越好。
