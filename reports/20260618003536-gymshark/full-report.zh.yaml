      - number: '2.3'
        title: 买家分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              Morning Consult 数据显示，运动服饰实际上已接近全民品类，但不同人群进入品类的理由差异很大。舒适导向的日常穿着是最大触发因素，其次是替换需求和促销购买。Gymshark
              最清晰的自有入口是健身房和训练场景；尽管历史规模小得多，它在这个场景略好于 Under
              Armour。最年轻的成年群体最重要，因为他们在健身房和训练场景上超配，也更愿意通过数字内容和社区线索发现品牌，而不是依赖门店陈列。女性对品类增长仍具结构性重要性，尽管不同品牌在高端 activewear
              心智可得性上会有偏差。预算通常由个人消费者掌握，但内部决策规则随分层而变：舒适买家优化多场景穿着，功能买家优化功能和版型，促销买家优化价格。因此，采用路径先从需求场景相关性开始，远早于品牌偏好形成。
