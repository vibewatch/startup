          detail: 网红、社媒粉丝和 Gymshark 自有健身 / 训练联想共同制造漏斗顶端认知，年轻买家尤其明显。
        - label: 浏览
          detail: 消费者进入网站或 app，比较紧身裤、运动内衣、短裤、连帽衫和新品发布；部分人下单前会查看外部评论。
        - label: 购买
          detail: app 借助提前进入、愿望清单保存、通知和订单追踪加速转化；用户测试也改善了结账流程。
        - label: 收货 / 解决问题
          detail: 购后体验取决于配送、尺码、退货和客服执行；公开评论平台显示，这是最常见的流失点。
        - label: 重新互动
          detail: 训练 app 使用、忠诚度 XP 和 Gymshark66 式社群仪式，目标是在两次购买之间把客户拉回来，而不是依赖一次性新品热度。
        - label: 复购或漂移
          detail: 公开留存证据显示，部分复购行为会随时间改善，但队列耐久度仍明显低于一流运动服品牌披露的水平。
