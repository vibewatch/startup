  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Gymshark 2020 General Atlantic 轮
        - 最近一次披露的一级市场锚点
        - '>£1bn 估值；出售 21% 股权；按 MarktoMarket 估算，约 4x 收入、约 35x EBITDA'
        - 最硬的历史参照，显示战略成长投资者曾愿意支付什么价格
        - 2020 年成长周期环境和较小收入基数，令其作为独立公允价值锚点已经过时
      - - Gymshark FY25 收入视角
        - 当前分析性收入锚点
        - 2x-4x FY25 收入意味着约 £1.292bn-£2.584bn
        - 将估值直接绑定已披露的 FY25 规模，并能清楚映射当前公开市场销售倍数
        - 只看收入会忽略利润修复是否真正到来
      - - Gymshark FY25 EBITDA 视角
        - 当前分析性 EBITDA 锚点
        - 20x-30x FY25 EBITDA 意味着约 £1.066bn-£1.599bn
        - 加入利润率纪律，也捕捉到今天偏薄的利润转化
        - EBITDA 质量披露不如收入完整，可能漏掉资本开支或零售建设义务
      - - Nike
        - 当前公开可比
        - 按 $65.44bn 市值和 $46.309bn 2025 年收入计算，约 1.4x 收入
        - 大型运动服饰既有巨头，显示当前超大市值运动服饰倍数有多冷
        - 鞋履广度、批发组合和企业成熟度，让 Nike 比 Gymshark 更安全、也更宽
      - - lululemon
        - 当前公开可比
        - 按 $12.69bn 市值和 $11.073bn TTM 收入计算，约 1.1x-1.2x 过去 12 个月收入
        - 高端运动服饰品牌，证明即使顶级公司也已从此前泡沫中大幅降估
        - 门店资产更重、女性品类占比更高、上市公司画像更强，因此只能作为方向性高端可比
      - - Deckers
        - 当前公开专业服饰可比
        - 基于保留的 2026 年快照，约 3.0x trailing revenue
        - 对仍能拿到溢价倍数的品牌化专业赢家，是有用的公开市场上沿参照
        - 品牌组合和鞋履敞口不同，Deckers 不能纯粹外推到 Gymshark
      - - Under Armour / Gap 下沿
        - 当前公开下沿参照
        - 基于保留的公开数据，Under Armour 约 0.45x 收入；Gap 约 0.7x 收入
        - 提醒市场怀疑时，较弱或更成熟服饰公司会落到什么交易区间
        - 两者数字原生属性更弱，结构上也不同于 Gymshark 的 DTC 身份
      - - Vuori 2024 融资轮
        - 当前私募情绪信号
        - $825m 融资后估值 $5.5bn
        - 显示私募资本仍愿意为带扩张叙事的高端 activewear 品牌支付高价
        - Vuori 未披露收入，因此该估值不是干净倍数，也不能直接桥接 Gymshark 公允价值
    enumerationScope:
      coverage: partial
      basis: >-
        Selected sample spanning Gymshark's historical round, current analytical revenue and EBITDA anchors, four public
        apparel references, and one recent private premium activewear financing signal reviewed directly during this
        run.
