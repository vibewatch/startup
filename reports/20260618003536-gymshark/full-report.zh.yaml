  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 横向看 Gymshark 的主要风险簇：治理权集中、供应链劳工暴露，以及退货拉低 DTC 效率，都落在剩余风险最高的一档。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 创始人 / 关键人物风险
          values:
            - 治理边界扩大，继任安排形成文件
            - 管理梯队分担部分决策负荷
            - 控制权仍集中在创始人兼 CEO 身上
        - label: 利润转化风险
          values:
            - 门店和技术投入很快回本
            - 利润率受压但保持稳定
            - 收入增长下，税前利润仍继续下滑
        - label: 退货 / 客户体验漏损
          values:
            - 投诉只是零星个案
            - 服务摩擦仍可控
            - 退款和配送问题压低复购
        - label: 供应链劳工 / 韧性
          values:
            - 审计评分持续改善
            - 高风险国家暴露保持不变
            - 供应商集中或不合规问题再次浮现
        - label: 隐私 / 监管执行
          values:
            - 控制措施兑现政策承诺
            - 出现小的合规流程缺口
            - 数据使用或劳工治理失误演变成重大问题
        - label: 平台 / 云依赖
          values:
            - Web 渠道抵消中断影响
            - 政策变化抬高摩擦
            - 应用商店或云问题伤及重大发售
        - label: 竞争与贸易政策风险
          values:
            - 小额豁免改革缩窄价差
            - 竞争对手压力仍可控
            - 规则变化后，低价对手仍有结构性优势
    approximationNotes: 可能性分档来自公开证据下的分析判断，不是精算概率或公司评分。
