  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前股权结构表与 2020 年后任何定价
        - 股份类别、股数、期权池、二级交易，以及 2020 年以来任何定价融资
        - 没有这座桥，没人能把公司质量转成可防守的入场价格
        - CFO、法律顾问和股东名册请求
      - - FY25 审计桥接
        - 收入到 EBITDA 桥接、调整后到法定口径调节，以及 FY26 交易更新
        - 当前区间取决于 FY25 是低谷年，还是新的经济基线
        - 财务尽调与审计账目包
      - - 门店回本与租约经济性
        - 门店分群回本、四壁利润率、租金负担和门槛回报率
        - 牛市情景要求门店创造价值，而不是固定成本沉重
        - 零售运营审查与租约排期分析
      - - 经退货调整的渠道利润率
        - 退货率、退款周期、降价漏损，以及按渠道拆分的贡献利润率
        - 即使营收增长守住，服务摩擦也可能悄悄摧毁倍数支撑
        - 客户运营与渠道损益尽调
      - - 当前所有权与下行条款
        - 任何会改变普通股结果的优先权、反稀释棘轮条款或权利
        - 如果结构吸收上行或放大下行，表面估值还不够
        - 对股东协议和条款清单做法律尽调
      - - 下一阶段增长质量证明
        - 当前客户分群留存、营销效率，以及数据工具正在抬高实际利润率的证据
        - 高溢价倍数需要证明数据与社群飞轮在规模化后仍能高效转化
        - 增长分析包与管理层 KPI 审阅
    notes: 这些要求并非泛泛清单，而是判断 Gymshark 究竟只是强公司，还是能以有吸引力价格买到的强公司所需的精确披露。
