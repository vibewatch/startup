  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Gymshark 位于 athleisure 品类内，但尽调视角应比推介材料里常见的宽口径 activewear 或 sportswear
              数据更窄。相关市场包括消费者同时期待运动功能和日常可穿性的服饰及配件支出：打底裤、无缝上衣、训练短裤、连帽衫、运动内衣、包和相邻配件。即便鞋履生态、营养补剂或纯健身服务也争夺钱包份额，也不能自动纳入。这个区分很关键：如果把每一美元相邻
              sportswear 支出都并进来，市场会显得巨大；但 Gymshark 可见货盘仍集中在服饰优先的购物篮。真实替代集合也比直接品牌同业更宽：有些买家升级到 Nike 或
              Lululemon，有些降级到折扣进口品，很多人只是把已有基础款拿来训练。这种碎片化支撑需求，也意味着 Gymshark 很少在一个干净的单品牌品类里竞争。
