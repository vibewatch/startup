      - number: '6.2'
        title: 公开客户证明与采用信号
        blocks:
          - type: paragraph
            body: >-
              因为 Gymshark 是消费品牌，公开客户证明不同于 SaaS 式客户标识名单。最干净的独立证明不是具名采购案例，而是一组分布在应用商店、评论生态和数字研究案例中的采用信号。Morning Consult
              2026 年运动服饰研究尤其重要，因为它显示 Gymshark 在具体健身房 / 训练场景中以小博大：尽管总体认知远低于 Nike，它在该品类入口点约 36% 领先。这有助于解释 app 为何如此重要。官方
              app 界面将其定位为进入发布、补货、愿望清单保存和通知的最快路径；Apple App Store 和 Google Play 都显示 4.9 星且评论数量很大；UserTesting 案例显示 Gymshark
              将客户研究转化为具体数字增益，如更高结账完成率和更高尺码指南使用率。Bloomberg Second Measure 的历史面板数据又补了一层：Gymshark
              先靠强劲新客获取建立增长，随后逐步提高回头客销售占比。合起来看，公开证据支持真实客户采用，但仍是样本基础，而不是完整客户账本。
