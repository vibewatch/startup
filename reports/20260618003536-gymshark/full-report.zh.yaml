      - number: '5.3'
        title: 运营模型、可持续性与信任控制
        blocks:
          - type: paragraph
            body: >-
              Gymshark 的运营模型是外包和审计驱动，而不是传统意义上自有工厂的垂直整合。最清晰的公开证据在可持续性和支持界面：供应商行为准则要求、Shared Fitness 审计、Fair Labour
              Association 会员资格、Bangladesh Accord 参与、Oritain
              棉花溯源工作，以及明确的气候和循环目标。这让本章拥有比许多私营服饰品牌更强的信任和质量基础。公司还把产品工程重新接回运营：它声称无缝制造技术相较传统裁剪缝制减少浪费，并披露 recycled polyester
              使用和海运占比。客户体验端，Gymshark
              发布了详细退货流程，以及针对瑕疵商品、换货和退款时点的专门支持分类。公开缺口在于，流程披露不等于流程结果：评论平台仍显示围绕配送延迟、退款循环、质量不一致和客服难触达的反复投诉。
