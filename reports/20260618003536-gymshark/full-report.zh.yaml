  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              Gymshark 仍值得做尽调，但当前章节的核心是价格纪律，而不是品牌崇拜。最硬的历史锚点仍是 2020 年 8 月 General Atlantic 交易：该交易把公司估值定在 10
              亿英镑以上；MarktoMarket 估算，对当时业务而言大约是 4x 收入和 35x EBITDA。今天的公开证据集已经不同：FY25 收入达到 £646 million，调整后 EBITDA 达到 £53.3
              million，毛利率为 62.3%，税前利润只有约 £7 million。用 2x 到 4x 收入计算，对应约 £1.3 billion 到 £2.6 billion；用 20x 到 30x EBITDA
              计算，对应约 £1.1 billion 到 £1.6 billion。两种方法的重叠区间落在 10 亿英镑中段，而不是机械重演 2020 年泡沫溢价。由于 2020
              年后没有公开披露的定价基准，最有支撑的判断是跟踪 / 继续研究；公允价值支撑在约 £1.3 billion 到 £1.6 billion 附近最强，超过 £2 billion 后明显走弱。
