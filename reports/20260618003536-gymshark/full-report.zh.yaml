      - number: '7.3'
        title: 运营、供应链和合作伙伴依赖风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，Gymshark 现在更像一个分布式系统，而不是单一品牌店面。公开工厂名单和现代奴役声明显示，公司拥有庞大的外包网络，覆盖 Tier 1 到 Tier 4
              以及配送站点，在越南、斯里兰卡、孟加拉国、土耳其、柬埔寨、约旦、中国和其他离岸或近岸制造中心都有大量设施。即使 Gymshark 已减少高风险国家工厂数量，并称 Tier 1 现场审计覆盖率已达
              100%，供应韧性和劳工治理责任仍然清晰存在。客户体验是另一道运营暗门。Reviews.io 和存档 Trustpilot 证据显示，配送延误、退款循环和产品质量投诉反复出现；NRF 称 2025
              年线上销售预计有 19.3% 会被退回，糟糕退货体验会显著压低复购意愿。数字漏斗也高度依赖外部能力。关于页面、Think with Google、Google Play 和 Deloitte
              都显示，Gymshark 靠 App 互动、推送通知、应用商店分发，以及基于 Google Cloud 的商品陈列和分析来维持 DTC
              转化。零售扩张让图景更复杂：门店和合作伙伴主导的线下进入或许能提升品牌密度，但也带来租约、人员、库存和执行负担，而公司仍未披露单店经济或外汇对冲。上述组合让供应连续性、退货漏损、平台规则和云可用性都变成直接估值变量。
