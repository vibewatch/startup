chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >
              Gymshark 是一家 DTC 健身服饰与配件品牌，2012 年在英国注册成立。公司主要靠自有数字渠道运营——14 个线上门店覆盖 200
              多个国家的客户——并拥有一个刚起步的线下零售网络，目前在英国、美国和欧洲拥有多家旗舰店。核心主张是面向全球训练社群的功能型健身与生活方式服饰，目标客户包括力量训练者、健身房用户和健身爱好者。公司总部位于 West
              Midlands 的 Solihull，Blythe Valley Business Park（GSHQ），并在 New York City 等地区设有办公室。

              Gymshark 的商业模式建立在对客户关系的全链条垂直控制之上：DTC 渠道去掉批发中间商，让毛利率在结构上保持 60%
              以上，并沉淀第一方客户数据，支撑个性化和留存能力。公司收入主要来自服饰和配件销售，历史上把所有利润再投入，不支付股息。英国 Companies House 注册号为 08130873。
