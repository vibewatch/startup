      - number: '5.2'
        title: 数据、app 与个性化架构
        blocks:
          - type: paragraph
            body: >-
              技术架构现在围绕两个移动端界面和一条第一方数据骨干展开。Think with Google 描述 Gymshark 在早期基础设施不堪重负后，从直觉驱动决策转向用户级分析；Google Cloud
              的合作公告补充了当前栈组件：BigQuery、Looker、实时分析和 Vertex AI。从实际流程看，网站和购物 app 捕获浏览、愿望清单、结账和订单追踪行为；分析团队随后用 GA4
              风格的用户级数据诊断流失和排序机会；陈列和增长团队再通过个性化、push 通知和发布节奏把洞察落地。训练 app
              在战略上重要，因为伙伴披露将其描述为不止内容营销：它是一个产品界面，可能积累意图、文本记录活动和推荐数据。主要尽调风险是集中度。公开证据证明了技术栈方向，但没有证明每一层在交易高峰和持续国际扩张下的经济性或韧性。公开披露也没有说明
              uptime、app 来源订单占比或伙伴切换成本。
