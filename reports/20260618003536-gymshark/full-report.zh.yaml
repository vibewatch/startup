companyProfile:
  summary: >-
    Gymshark 是一家起源于英国的 DTC 健身服饰品牌，从 2012 年伯明翰车库创业项目长成全球独角兽。公司由 Ben Francis（当时 19 岁）和 Lewis Morgan
    创立，在健身领域率先跑通以影响者带动社区营销的打法，推动收入连续 13 年增长，FY25 达到 £646m。General Atlantic 于 2020 年 8 月以超过 £1 billion 的估值收购 21% 股权，这是
    Gymshark 首次外部投资；Ben Francis 仍持有超过 70% 股权。公司运营 14 个 DTC 门店网站，服务 200+ 国家，线下零售网络刚起步但在扩张。税前利润从 FY22 的 £27.8m 压缩至 FY25 约
    £7m，反映公司有意投入全渠道扩张、技术和社区活动。2025 年 4 月劳动力重组（296 个岗位面临风险、创建 168 个新岗位）说明运营模型仍在演进。
