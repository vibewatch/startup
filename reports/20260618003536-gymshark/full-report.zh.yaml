  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户足迹与分层
        blocks:
          - type: paragraph
            body: >-
              Gymshark 的客户基础地理覆盖很广，但最自然赢下的人群仍相当具体。官方 About 页面称，公司通过 14 个线上门店服务 200 多个国家的客户，拥有超过 1800 万社交粉丝，并在五个区域雇用 900
              多人。这个规模足以把品牌视为规模化全球消费平台，而不是小众影响者标签。同时，公开人口统计摘要仍一致指向：核心买家年轻、线上优先、健身原生；第三方人口统计写作把核心区间集中在 16–30 岁或 18–29
              岁，同时也指出较小但真实的 35–44 岁
              cohort。公开组合也已演变。多份摘要指向从男性主导根基转向更偏女性的客群，女性产品线现在贡献了不成比例的销售份额。品类页强化了这一现实：打底裤和运动内衣仍是核心陈列锚点，短裤和连帽衫则保持跨性别宽度。结果是，客户基础更适合按年龄、性别化产品任务和数字行为分层，而不是按企业式账号标识分层。
