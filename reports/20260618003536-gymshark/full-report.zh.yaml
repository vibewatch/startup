      - number: '1.3'
        title: 融资历史、估值与资本结构
        blocks:
          - type: paragraph
            body: >
              Gymshark 的资本历史很特殊：公司从 2012 年到 2020 年 8 月完全自举经营，成为 2001 年以来第二家未接受任何前期外部投资就达到独角兽地位的英国公司。2020 年 8
              月，全球领先成长股权投资机构 General Atlantic 收购 21% 股权，交易对公司的估值超过 £1 billion。PwC Corporate Finance 和 Gateley Legal 为
              Gymshark 提供交易顾问服务；RBC Capital Markets 和 Freshfields 为 General Atlantic 提供顾问服务。按当时 £250m 收入测算，交易隐含约 4×
              过去收入和约 35× EBITDA。交易完成后，Ben Francis 将持股提高至 70% 以上。

              除 General Atlantic 的少数股权投资外，公司未在可得公开来源中披露后续融资轮或债务工具。Gymshark 每年向 Companies House 提交账目；FY24
              账目确认其现金状况健康。公司至今未宣派股息，所有利润都回投增长和全渠道扩张。2020 年后没有重大估值披露；所有关于当前价值的说法都只是分析师估算。
