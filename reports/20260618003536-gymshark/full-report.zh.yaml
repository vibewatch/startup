            body: >-
              只看压缩的利润线，会低估 Gymshark 的资本状况；但披露仍不丰富。管理层称 FY25 末现金超过 £37 million，库存略高于 £117
              million，同时公司再次不分红，继续内部出资扩张。更宽的融资结构在公开信息中也仍显简单：General Atlantic 2020 年少数股权投资仍是唯一明确披露的外部股权事件，Ben Francis
              仍持股超过 70%，General Atlantic 持有
              21%。这个组合意味着创始人控制力强，短期也没有明显依赖新融资；但公开来源没有给出投资者做完整资本充足性工作真正需要的数据。没有披露月度现金消耗，没有明确资金续航测算，没有量化债务包讨论，也没有干净的门店回本披露。实际结论是，Gymshark
              今天看起来能靠盈利和资产负债表现金支持当前计划，但外部读者还无法用义务细节对这个结论做压力测试。
