      - number: '2.2'
        title: TAM、SAM 与相邻规模口径
        blocks:
          - type: paragraph
            body: >-
              公开市场规模数据方向上有支撑，但不够精确。Fortune Business Insights 估算全球 athleisure 2025 年为 USD 368.61 billion，2026 年为 USD
              402.74 billion，并有望在 2034 年达到 USD 844.77 billion。WorldMetrics 将更宽的 sportswear 市场界定为 2023 年 USD 400
              billion，到 2030 年升至 USD 623.9 billion；仅线上 sportswear 到 2030 年可能达到 USD 250 billion。这些并非矛盾，更像是口径不同：athleisure
              是更大 sportswear 体系的子品类，数字渠道估算又是另一种视角。对 Gymshark 来说，实际结论是 TAM 不是硬约束，服务能力才是。一个数字原生训练服饰品牌理论上能触达庞大全球池子，但实际 SAM
              取决于线上需求、对高价的接受度、尺码覆盖，以及服饰——而不是鞋履或批发主导支出——在购买任务中的占比。因此，Gymshark 自身 FY25 约 USD 820 million
              的收入，更应被理解为在一个极大市场中的很小份额，而不是饱和的证据。
