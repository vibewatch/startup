        - Gymshark 毛利率走弱的同时，价差仍结构性宽
        - 假设 de minimis 改革不是持久护城河改善，并下调利润率预期
    notes: 这些放弃标准是基于公开证据搭建的投资人参考门槛，不是公司指引。它们强调可监控结果，而非抽象标签，因为 Gymshark 没有发布足够内部 KPI 细节，无法设置更严格的定量 covenant 式测试。
