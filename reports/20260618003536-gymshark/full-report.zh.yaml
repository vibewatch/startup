  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品界面与客户流程
        blocks:
          - type: paragraph
            body: >-
              Gymshark 面向客户的产品，最好理解为分层的健身商业系统，而不是单一爆款打底裤产品线。活跃目录仍覆盖核心无缝家族——Flex、Vital 和
              Adapt——以及专门的短裤、运动内衣、连帽衫、打底裤和配件界面；Ombre
              仍是上线但当前为空的系列页，看起来更像休眠家族，而不是被完整支持的产品线。这很重要，因为买家购买的不只是面料廓形；他们进入的是围绕上新、移动端发现、app 专属访问、通知、愿望清单行为和重复浏览搭建的流程。购物
              app 被明确定位为进入新品发布和独家库存的最快路径；训练 app 则增加训练内容和进度追踪功能，可在两次购买之间继续把品牌放在用户面前。因此，产品视角是货盘加参与循环，而不是只有服饰。这个区别对承销很重要。
