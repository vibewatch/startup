      - number: '1.4'
        title: 财务表现与全球规模
        blocks:
          - type: paragraph
            body: >
              Gymshark 已实现连续十三年收入增长。FY24（截至 2024 年 7 月 31 日）收入达到 £607.3m，较 £556.2m 增长 9%，是第十二年增长；订单增长 14.1%，销量增长
              13.6%，调整后 EBITDA 增长 14% 至 £51.7m。美国仍是最大单一市场，收入 £251m，其次是英国以外欧洲（£145.7m）、英国（£136.4m）和其他地区（£74m）。FY24 员工数从
              853 人增至 881 人。

              FY25（截至 2025 年 7 月 31 日）是连续第十三年增长，收入达到 £646m。税前利润压缩至 £7m（FY24 为 £11.8m，FY22 为 £27.8m），EBITDA 增至
              £53.3m，毛利率为 62.3%。年末现金超过 £37m，库存约 £117m。Ben Francis 将利润下滑定义为有意为之，反映公司重金投入新门店（Manchester、Amsterdam、Long
              Island、Dubai、New York）、技术和免费社区活动。公司未支付股息，并继续把所有利润再投入。

              2025 年 4 月，Gymshark 将 296 名员工置于裁员风险之下，同时宣布新增 168 个岗位——这次劳动力重组被公司归因于宏观经济波动，以及重新校准运营模型的需要。公司官方平台社交粉丝超过 1800
              万；在全球五个区域拥有 900+ 员工。
