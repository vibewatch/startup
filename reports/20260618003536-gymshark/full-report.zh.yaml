  - id: TV005
    title: 投资论点失效与否决触发器表
    columns:
      - 触发器
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 利润恶化
        - 收入增长之下，利润继续下滑一年，或 EBITDA 利润率继续走弱
