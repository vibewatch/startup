              现在也把实质商业价值归因于数据平台。同时，几个最有野心的元素仍是前瞻性或只有部分证据：AI 产品选择助手、文本驱动的训练 app 洞察、全球 app 可用性，以及 FY25 业绩前后提到但仍不透明的“secret
              project”。外部报道还显示，Gymshark 正通过重组和重金技术投入继续重塑运营模型，这支持一个判断：产品和数字基础设施仍是活跃管理重点，而不是已经完成的能力。核心投资者结论是，Gymshark
