        - 技术型产品、门店、数字、社区
        - 本轮精确价格抓取仍不完整
        - 即使精确可比性仍是尽调问题，也支撑高端基准框架
      - - Under Armour
        - 观察到 UA Motion 紧身裤标价 $55 / 售价 $49.97
        - 技术性能功能、奖励、满 $50 免运费、免费退货
        - 打折状态未必代表完整产品线
        - 说明技术定位可以与战术性打折并存
      - - Vuori
        - 观察到 Daily Legging 为 $98
        - 性能生活方式面料叙事、满 $75 免运费、符合条件商品免费退货
        - 单 SKU 快照，不代表完整产品线
        - 相对 Gymshark 核心定价有清晰高端跃升
