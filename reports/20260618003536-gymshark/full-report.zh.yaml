      - number: '8.2'
        title: 可比公司、正向论点和反向论点
        blocks:
          - type: paragraph
            body: >-
              支付高于困境服装倍数的理由很直接。Gymshark 仍是有规模的全球 DTC 品牌，称客户覆盖 200 多个国家，社交受众超过 1800
              万，并有证据显示，其数据栈和自有客户旅程能够带动收入和商品陈列质量。因此，用 Gap 或 Under Armour
              这类简单锚点会低估品牌。反向论点同样真实。公开市场可比公司比私募热情派想象得更冷：按当前公开数据，Nike 约为 1.4x 销售额，lululemon 现在只有约 1.1x 到 1.2x 过去收入，Gap 约为
              0.7x，即使 Deckers 也更接近 3.0x。Vuori 的 $5.5 billion 融资证明，私募资本仍愿为高端运动休闲服饰支付溢价；但在收入未披露的情况下，它只是情绪信号，不是干净倍数。再加上
              Gymshark 的利润压缩、2025 年重组和评论端服务摩擦，证据支持其相对弱服装可比公司享有溢价，但不支持无约束溢价。
