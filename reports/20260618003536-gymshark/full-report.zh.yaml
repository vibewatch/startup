      - number: '7.2'
        title: 监管、法律、消费者权益与雇佣风险
        blocks:
          - type: paragraph
            body: >-
              在已复核的公开材料里，Gymshark 没有明显仍在进行的诉讼或执法行动，但它的法律边界远不止退货政策或 GDPR
              页脚这么简单。隐私通知明确覆盖客户、App、营销、活动和社交媒体互动，并包含加州隐私通知；英国政府指引也写明，UK GDPR 和 Data Protection Act 2018
              对公平使用、安全、画像和自动化决策提出要求。Terms of Use
              又给出一个实际风险信号：面向美国用户，它依赖有约束力的仲裁条款，并保留因业务和运营原因暂停或撤回数字服务的权利。消费者权益风险也落在运营层。Gymshark 给出看似宽松的 30
              天退货窗口，但英国指引规定，线上买家享有法定取消和退款权利，商家不能用合同排除；退款或瑕疵商品处理不佳，就可能从 CX 问题升级为合规问题。雇佣法同样重要，因为 2025
              年重组跨过了集体协商规则需要关注的门槛。供应链劳工治理是最长的法律尾部。Gymshark 现在发布现代奴役声明、工厂名单和行为准则，但这些披露也确认，公司自己认为活跃供应网络里存在劳工风险较高的司法辖区。
