        - 门店 cohort 无法越过内部门槛回报率，或管理层仍不披露回本周期
        - 全渠道扩张叙事会从上行空间翻成固定成本拖累
        - 移除牛市情景，把估值封顶在基准或熊市区间附近
      - - 新价格要求过高
        - 新融资或二级出售要价超过约 £2bn，且没有更好披露
        - 证据到来前，上行已被吃掉，普通股回报被压缩
        - 除非价格重置，否则从跟踪转为放弃
      - - 服务质量持续偏弱
        - 退款、配送和质量投诉在主要交易期仍处高位
        - 复购、实际净收入和品牌拥护度会同时走弱
        - 将服务修复作为任何投委会批准的前置条件
      - - 竞争价格伞回归
        - 贸易政策缓和褪去，或超低价对手重新拉大价值差
        - Gymshark 可能需要更多折扣或营销支出来守住增长
        - 下调收入视角做压力测试，并重新评估入场纪律
    notes: 这些触发器刻意设计为可证伪。目标是在承销新的私募价格或二级报价之前，让估值立场可以被衡量。
