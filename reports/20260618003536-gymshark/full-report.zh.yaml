      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              该品类仍受益于持久的结构性顺风。健身参与、休闲着装规范、远程和混合生活节奏，以及可持续驱动的产品创新，都让 athleisure
              在健身房之外继续相关。电商渗透和高频上新也利好能创造数字需求并快速周转产品的品牌。但同一组证据也显示约束不小。价格是最大障碍，高端品牌还必须处理尺码可得性、运费和退货摩擦。McKinsey
              更宽的时尚展望指出消费者谨慎、促销强度高，这意味着市场增长不会自动转化成数字原生品牌干净的毛利增长。贸易扭曲也重要：Retail Week 强调，de minimis
              规则可能帮助超低价进口模型，加大成熟服饰玩家的价格压力。即便 Gymshark 自己 2025 年的重组也说明，一个又大又增长的品类，仍会惩罚执行失误、库存失衡或过度扩张的成本结构。
