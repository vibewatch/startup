        - 税前利润和毛利率轨迹
        - 收入增长但税前利润再降一年，或毛利率明显侵蚀
        - 在管理层说明再投资在哪里重新转化为盈利之前，暂停扩张假设
      - - 创始人集中且未披露备份方案
        - 领导连续性披露
        - 创始人角色变化、长期缺席，或没有具名继任框架的战略重置
        - 在真实应急计划得到证据支持前，将治理风险视为足以击穿投资逻辑
      - - 退货和服务漏损
        - 评价、投诉和已披露政策变化
        - 退款 / 配送投诉持续存在，或退货经济性收紧但服务没有改善
        - 假设复购行为转弱，并下调客户 LTV 假设
      - - 供应链劳工 / 合规
        - 现代奴役披露和审计结果
        - 出现新的未解决强迫劳动指标、高风险国家暴露上升，或审计覆盖走弱
