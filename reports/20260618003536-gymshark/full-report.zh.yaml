      - number: '8.4'
        title: 最后尽调问题、否决标准和推动评级变化的因素
        blocks:
          - type: paragraph
            body: >-
              尚待完成的工作是机械性的，不是概念性的。投资人仍需要当前股权结构表、2020 年后任何融资条款、门店 cohort 回本、按渠道调整退货后的利润率，以及从 FY25 EBITDA
              到未来经营杠杆的更清晰桥梁。这些输入决定 10 亿英镑中段的价格是否有吸引力，还是更高 headline mark
              只是把未来回报提前吃掉。若管理层证明门店回本有吸引力、服务问题没有侵蚀复购需求、数据驱动的商品陈列正在转化为更干净的利润率修复，投资论点会改善。若利润再恶化一年、评论端摩擦仍未解决，或新一轮 mark
              要求投资人在披露改善前支付高于约 £2 billion 的价格，投资论点就会破裂。小额免税改革可能有助于收窄廉价进口保护伞，但不能替代关于回本、利润率和股权结构条款的证据。
