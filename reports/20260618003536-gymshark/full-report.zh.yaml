  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层 / 流程 / 组件
      - 角色
      - 依赖
      - 风险
    rows:
      - - 服装系列层
        - 把需求打包成可识别的产品系列，例如 Flex、Vital、Adapt、紧身裤、运动内衣、短裤、连帽衫和配饰
        - 新设计节奏、库存可得性，以及稳定的版型 / 质量
        - 系列页面空置或陈旧，可能暴露商品运营欠账或产品线疲态
      - - 网站 + 购物 App 触点
        - 承接浏览、愿望清单、结账、预约和订单管理动作
        - 可靠的移动端 UX、支付通道、通知基础设施和内容流
        - 大促期间宕机或 App 体验差，会直接伤害转化和品牌信任
      - - 训练 App 触点
        - 把互动延伸到训练、计划、动作发现和进度记录
        - 内容管线、运动员训练编程，以及产品 / 工程维护
        - 缺少公开参与度指标时，训练触点可能具备战略价值，但商业价值仍未验证
      - - 第一方分析层
        - 把衡量口径从会话数推向用户级旅程分析和问题发现
        - GA4 落地、埋点质量和分析师采用
        - 埋点失准或隐私处理不当，会削弱个性化和决策质量
      - - Google Cloud 数据平台
        - 支撑数据仓库、报表、实时分析、预测和 GenAI 试验
        - BigQuery、Looker、Vertex AI、合作伙伴实施和内部团队熟练度
        - 合作伙伴集中度和不清晰的回报经济性，仍是尽调问题
      - - 供应商与可追溯层
        - 支撑材料采购、审计、行为准则执行，以及围绕回收投入品和棉花可追溯性的主张
        - 供应商合规、Oritain 可追溯、审计节奏和工厂配合
        - 公开披露在政策上更强，在 SKU 级证明或供应商集中度上更弱
      - - 履约与退货层
        - 推动订单完成配送、退货、换货和退款处理
        - 快递伙伴、仓库处理和客服执行
        - 评论平台显示，配送和退款摩擦仍可能外溢为用户对产品质量的感知
    notes: 这套架构混合了面向消费者的软件、数据基础设施和外包运营控制，因为三层都会影响 Gymshark 的真实产品体验。
