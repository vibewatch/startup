  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 治理集中与利润转化风险
        blocks:
          - type: paragraph
            body: >-
              Gymshark 的一阶风险不是需求崩塌，而是战略系统仍有多少依赖创始人集中主导模型，同时利润转化持续走弱。PwC 称 Ben Francis 在 2020 年 General Atlantic 交易后保留约
              70% 多数股权，General Atlantic 获得 21% 加一个董事会席位，官方 About 界面仍将 Francis 呈现为 Founder and
              CEO。这个组合把品牌、文化、资本配置和运营判断集中在一个人身上。财务趋势提高了任何执行失误的代价。公开报道显示税前利润 FY23 为 £13 million，FY24 为 £11.8 million，FY25
              约 £7 million，尽管收入持续上升；管理层将压缩归因于门店、技术和社区活动投资。因此，2025 年 4 月一边让 296 个岗位面临风险、一边新增 168 个岗位的重组，更像是 Gymshark
              在扩张运营模型的同时仍在重设计该模型，而不是一次性新闻。除非公开披露显示更强的接班计划、门店层面回本和恢复的利润纪律，投资者承销的就是一个创始人权重很高、运营复杂度增长快于治理透明度提升的系统。
