    rows:
      - - Gymshark
        - 观察到核心紧身裤为 $38-$74；也能看到打折降价
        - 训练服、无缝系列、配件；满 $75 免运费
        - 实际促销组合未披露
        - 位于中间：相对价值型玩家偏高端，低于高端瑜伽同业
      - - Nike
        - 可见女性价格阶梯约 $32-$230，覆盖紧身裤及相邻产品
        - 巨大品类范围，加上鞋履和配件
        - 目录很宽，意味着并非所有价格都能与紧身裤逐项可比
        - 能在规模上同时守住入门和高端位置
      - - adidas
        - 多个女性单品约 $65-$150，且频繁降价
        - 鞋履牵引的运动生活方式平台
        - 观察页面折扣很重，受组合影响
