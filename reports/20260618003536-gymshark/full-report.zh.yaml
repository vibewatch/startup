        title: 收入质量与公开记录真正显示的内容
        blocks:
          - type: paragraph
            body: >-
              按任何私营公司标准，Gymshark 的表观收入轨迹仍很强。FY25 收入达到 £646 million，此前 FY24 为 £607.3 million，FY23 为 £556.2 million，FY22 约
              £485 million。这组序列重要，因为它显示即便盈利能力被有意压缩，收入顶线仍在增长。围绕 FY25
              的公开评论清楚表明，管理层并不把较低利润线视为运营事故；公司把税前利润下降定义为在保持自筹增长路径的同时，为门店、技术和免费社区活动投入资金的成本。因此，质量问题不是需求疲弱。真正的尽调问题是，库存、促销和全渠道成本之后，增长是否仍能转化为耐久毛利和可重复贡献。公开证据显示毛利经济性仍健康，但没有充分披露品类组合、退货流失或门店层面产出在表观收入之下如何变化。
