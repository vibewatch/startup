    rows:
      - - 熊市
        - 利润修复停滞，门店铺开带来的固定成本增速快于贡献增量，市场估值锚更接近 20x EBITDA 或 2x 收入
        - 约 £1.1bn-£1.3bn；若入场价接近 £2bn，该情景下会显得明显买贵
        - 利润再度下滑一年、服务问题未解，或零售回本表现偏弱
        - 按当前披露，真实下行尾部不能忽视
      - - 基准
        - 增长仍然体面，品牌强度保持完整，管理层证明经营杠杆足以支撑较弱上市服饰公司之上的溢价
        - 约 £1.3bn-£1.9bn；这是 2x-3x 收入与约 22.5x-25x EBITDA 的重叠区间
        - 当前价格不透明、回本披露有限，以及持续执行风险
        - 以今天公开证据看，这是概率最高的区间
      - - 牛市
        - 利润率修复、门店经济性和数据驱动的商品运营都足够快地改善，冷却后的公开市场倍数下仍能支撑 3.5x-4x 收入
        - 约 £2.2bn-£2.6bn；只有入场价仍显著低于这个支撑区间时才有吸引力
        - 证明到来前，就要求投资者先为上行买单
        - 有可能，但执行要求很高，不能作为基准承销情景
    notes: 这些是分析性支撑区间，不是管理层指引。由于没有公开的新定价轮，本表刻画的是不同入场价需要哪些前提成立，而不是假装今天存在精确公允价值。
