  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 规模层级与真正设定标尺者
        blocks:
          - type: paragraph
            body: >-
              竞争场并不是一个干净的同业集合。Nike 和 adidas 仍是外层边界，因为它们把全球品牌规模与鞋履、批发和品类宽度结合起来，而 Gymshark 还没有达到。lululemon 是另一种标尺：大众规模不如
              Nike，但在高端女性 activewear、门店驱动陈列和社区前置的品牌建设上更强。Under Armour
              更像替代品而不是风格领导者，因为它仍结合技术服饰、鞋履和折扣驱动的入口。再往下是私营挑战者。Vuori 是最严肃的高端增长对标，因为它把近奢价位、门店铺开和 $5.5 billion
              估值支撑的扩张计划绑在一起。Alo、AYBL 和 Alphalete 在数字原生陈列和社交优先美学上更接近 Gymshark，但规模透明度低得多。实际结论是，Gymshark
              一边向上与高端和老牌品牌争夺钱包份额，一边向下、横向防守更新的服饰优先挑战者。
