      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              Gymshark 由 Ben Francis（19 岁）和 Lewis Morgan 于 2012 年在 Birmingham 创立。Ben Francis 仍是公司最关键的人物：创始人、CEO，并持有超过
              70% 股权。他高度集中的所有权和运营角色，带来实质性的关键人物依赖。Lewis Morgan 是被动型联合创始人；根据 PwC 顾问披露，他在 2020 年 General Atlantic
              交易中完全出售所持股权。Ben Francis 于 2017 年卸任 CEO，担任 Chief Brand Officer，由 Steve Hewitt 接手运营；Francis 于 2021 年 8 月回任
              CEO。Paul Richardson（Executive Chairman）和 Steve Hewitt 大致在同一时期离开各自岗位。

              根据公司官方 About 页面和 2026 年行业媒体报道，现任 C-suite 包括：Ben Francis MBE（Founder & CEO）、Noel Mack（Chief Brand
              Officer）、John Douglas（Chief Technology Officer）、Carly Natalizia（Chief Commercial Officer，2026 年 2 月由 Chief
              Digital Officer 晋升）、Sian Keane（Chief People Officer）和 Rich Sanders（Chief Financial Officer）。前任 CFO 于 2024
              年 12 月突然离职。David Laid 被任命为 Creative Director of Lifting，体现品牌重新聚焦举铁根基。董事会方面，General Atlantic EMEA 消费负责人
              Melis Kahya Akar 在 2020 年投资后获得一个席位。职业健美运动员、Gymshark 运动员 Chris Bumstead 于 2024 年 9
              月成为新股东。除上述已识别成员外，完整董事会构成未公开披露。
