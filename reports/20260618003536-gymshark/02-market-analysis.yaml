- id: market-sizing
  title: TAM, SAM, and Adjacent Sizing Lenses
  body: 'Public market sizing is directionally supportive but not precise. Fortune Business Insights places global athleisure at USD 368.61 billion in 2025 and USD 402.74 billion in 2026, with a path to USD 844.77 billion by 2034. WorldMetrics frames the broader sportswear market at USD 400 billion in 2023 rising to USD 623.9 billion by 2030, while online sportswear alone could reach USD 250 billion by 2030. These are not contradictions so much as different scope definitions: athleisure is a subcategory of the wider sportswear complex, and digital channel estimates are yet another lens. For Gymshark, the practical takeaway is that TAM is not the binding constraint; serviceability is. A digital-native training-apparel brand can theoretically tap a vast global pool, but its realized SAM depends on online demand, premium willingness to pay, fit breadth, and the extent to which apparel—not footwear or wholesale-led spend—dominates the buyer mission. Gymshark''s own FY25 revenue of about USD
    820 million is therefore better read as a very small share of a very large market than as proof of saturation.'
