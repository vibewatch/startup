    - Important substitute pool because it caps premium pricing power
  - - Broad sportswear context
    - Athleisure plus footwear, wholesale-led teamwear, and wider branded sport categories
    - Non-apparel fitness services
    - Individuals, retailers, institutions
    - Useful macro lens, but too broad to use as Gymshark's direct SAM
