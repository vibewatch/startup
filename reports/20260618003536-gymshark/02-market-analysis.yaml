  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Fitness participation and wellness culture
    - Positive
    - Now / medium term
    - Keeps training apparel relevant beyond elite athletes
    - Measure how much of Gymshark's demand still comes from gym-identified buyers versus casual wear
  - - Comfort-led casualization and hybrid routines
    - Positive
    - Now / medium term
    - Expands use cases beyond workouts and enlarges total occasion set
    - Test whether Gymshark converts casual buyers or remains concentrated in training-led wardrobes
  - - E-commerce and content-led discovery
    - Positive
    - Now
    - Favors digital-native brands with rapid merchandising and community reach
    - Benchmark Gymshark conversion efficiency versus larger incumbents online
  - - Sustainability expectations and material innovation
    - Positive
    - Medium term
    - Supports premium storytelling and product differentiation
    - Quantify whether sustainability claims change conversion or retention
  - - Price barrier above willingness to pay
    - Negative
    - Now
    - Limits premium penetration and forces promotion discipline
    - Request price-elasticity and markdown cadence by cohort
  - - Fit, size, shipping, and no-store friction
    - Negative
    - Now
    - Raises abandonment risk for DTC-heavy brands
    - Request return-rate, size-miss, and shipping-cost disclosure by geography
  - - De minimis and ultra-low-cost import competition
    - Negative
    - Now / policy-dependent
    - Can compress pricing power for incumbent apparel brands
