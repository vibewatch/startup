    - Individual consumer / self-pay
    - Closest match to Gymshark's visible assortment and brand positioning
  - - Training-apparel subset
    - Performance-first apparel used for lifting, running, studio, and gym sessions
    - Footwear-led ecosystems and sport equipment
    - Individual consumer / self-pay
    - Where Gymshark has the strongest brand cue via gym/training CEP
  - - Accessories adjacencies
    - Gym bags, socks, caps, lightweight accessories, cross-sell add-ons
    - Hardgoods such as machines or recovery tools
