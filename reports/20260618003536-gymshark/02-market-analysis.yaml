- id: drivers-and-constraints
  title: Growth Drivers and Adoption Constraints
  body: 'The category still benefits from durable structural tailwinds. Fitness participation, casual dress norms, remote and hybrid routines, and sustainability-led product innovation all keep athleisure relevant beyond the gym. E-commerce penetration and frequent newness also favor brands that can create digital demand and turn products quickly. Yet the same evidence base shows meaningful constraints. Price is the largest barrier, and premium brands must also manage size availability, shipping costs, and return friction. McKinsey''s broader fashion outlook points to cautious consumers and promotional intensity, which means market growth does not automatically convert into clean margin growth for digitally native brands. Trade distortions matter too: Retail Week highlights how de minimis rules can aid ultra-low-cost import models, increasing price pressure on established apparel players. Even Gymshark''s own 2025 restructuring illustrates that a large and growing category can still punish
    execution mistakes, inventory imbalances, or overbuilt cost structures.'
