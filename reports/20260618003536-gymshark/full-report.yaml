      - number: '4.3'
        title: 'Unit Economics Proxies: Good Gross Profit, Thin Public Visibility'
        blocks:
          - type: paragraph
            body: >-
              The public record provides enough information to see direction, but not enough to underwrite exact unit
              economics. FY24 orders rose 14.1% and units sold rose 13.6%, while FY25 gross margin stayed at 62.3% and
              EBITDA increased to £53.3 million. Those are constructive signals: traffic and order conversion are still
              producing revenue, and gross profit remains meaningfully above mass-market apparel economics. Historical
              references suggest Gymshark operated for years in a high-60s to low-70s gross-margin band, so the current
              62.3% level reads as compressed rather than broken. At the same time, the absence of disclosed CAC, repeat
              purchase rates, return rates, contribution margin, and payback periods means investors cannot tell from
              public evidence whether the business is buying growth efficiently or merely carrying enough gross margin
              to absorb reinvestment. Review platforms add a cautionary note here: repeated complaints about delivery
              failures, cancellations, and refund friction suggest service leakage could be eroding contribution quality
              even while top-line demand remains healthy.
