chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Business Model
        blocks:
          - type: paragraph
            body: >
              Gymshark is a direct-to-consumer fitness apparel and accessories brand incorporated in the United Kingdom
              in 2012. The company operates primarily through its own digital channels—fourteen online storefronts
              serving customers in more than 200 countries—and a nascent physical retail estate now spanning multiple
              flagships across the UK, US, and Europe. Its core proposition is performance-oriented gym and lifestyle
              apparel, targeting the global conditioning community of strength trainers, gym-goers, and fitness
              enthusiasts. The business is headquartered at Blythe Valley Business Park (GSHQ) in Solihull, West
              Midlands, with additional offices in New York City and other regions.

              Gymshark's business model is built on full vertical control of the customer relationship: the DTC channel
              eliminates wholesale intermediaries, keeps gross margins structurally above 60%, and concentrates
              first-party customer data that underpins its personalisation and retention capabilities. The company
              generates revenue primarily from apparel and accessory sales and has historically reinvested all profits,
              paying no dividends. Company number 08130873 on the UK Companies House register.
