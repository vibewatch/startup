      - number: '2.3'
        title: Buyer Segments, Budget Ownership, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Morning Consult's data suggests athletic apparel is effectively a near-universal category, but the reasons
              for entry differ sharply by segment. Comfort-led everyday wear is the largest trigger, followed by
              replacement demand and promotion-led purchases. Gymshark's clearest owned entry point is gym and training,
              where it slightly outperforms Under Armour despite much smaller legacy scale. The youngest adult cohort is
              the most important because it over-indexes on gym and training occasions and is most willing to discover
              brands through digital content and community cues rather than store-led merchandising. Women also remain
              structurally important to category growth, even though premium activewear mental availability can skew by
              brand. Budget ownership is usually the individual consumer, but the internal decision rule changes by
              segment: comfort buyers optimize versatility, performance buyers optimize function and fit, and promotion
              buyers optimize price. The adoption path therefore starts with need-state relevance long before it turns
              into brand preference.
