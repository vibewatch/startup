      - number: '3.2'
        title: 'Capability Breadth: Apparel-First Specialist Versus Full Athletic Platform'
        blocks:
          - type: paragraph
            body: >-
              Capability breadth is where the field separates most clearly. Gymshark is powerful inside training
              apparel, seamless collections, and accessories, but its public range is still overwhelmingly
              apparel-first. Nike, adidas, and Under Armour all present much wider ecosystems that connect apparel to
              shoes, team sports, performance technology, and broader retail surfaces. That matters because a buyer
              choosing among activewear brands is not only comparing leggings; they are often comparing whether one
              brand can also supply shoes, jackets, lifestyle basics, and repeat-purchase categories. lululemon, Vuori,
              and Alo compete differently. They lean on premium product storytelling, fabric claims, community
              engagement, and versatile performance-to-lifestyle usage rather than sheer sport breadth. AYBL and
              Alphalete stay closer to Gymshark in social-native visual language and women's training emphasis, but
              their visible public capability stack remains narrower and more apparel-centric than the public
              incumbents. Gymshark's real competitive risk is therefore not that everyone is identical; it is that
              different rivals attack different parts of the decision tree.
