      - number: '2.5'
        title: Sizing Gaps and Analytical Reservations
        blocks:
          - type: paragraph
            body: >-
              Two gaps remain material after the public-source pass. First, the boundary between athleisure and broader
              sportswear is fuzzy enough that headline market figures can be abused. A sportswear number above USD 600
              billion and an athleisure number near USD 400 billion can both be true at the same time, but they do not
              describe the same spend pool. Second, Gymshark does not disclose enough category- or geography-level
              cohort data to anchor a hard SAM or conversion funnel. We can infer that the company's sweet spot is
              premium online training apparel, but we cannot robustly separate that slice from broader casual wear,
              footwear, or wholesale-led spend using public evidence alone. That makes the market chapter directionally
              strong but still incomplete in one respect that matters for underwriting: the precise portion of category
              demand that Gymshark can profitably serve at current price points. The right diligence posture is
              therefore to keep the top-down opportunity large while treating bottom-up SAM and share estimates as
              bounded approximations rather than fact.
            claimRefs:
              - CM004
              - CM026
              - CM027
              - CM040
              - CM041
              - CM042
              - CM049
