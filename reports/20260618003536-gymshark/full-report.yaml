          value: 8
          detail: Global reach and social scale are real premium-support factors
        - label: Scale proof
          value: 7
          detail: £646m revenue shows Gymshark is no longer a small niche label
        - label: Gross-profit quality
          value: 7
          detail: 62.3% gross margin still supports premium positioning
        - label: Profit trajectory
          value: 4
          detail: Pre-tax profit compression and restructuring remain clear watchpoints
        - label: Balance-sheet resilience
          value: 6
          detail: Cash and inventory suggest no immediate distress but limited public runway detail
        - label: Public comp support
          value: 5
          detail: Current market references support a disciplined premium, not a blank-cheque premium
        - label: Evidence quality
          value: 4
          detail: No disclosed post-2020 mark or cap-table bridge limits conviction
        - label: Entry discipline
          value: 6
          detail: At the right price the name stays investable; above ~£2bn it becomes hard to defend
    approximationNotes: >-
      Scores are analytical judgments for investment-committee framing, not standardized external ratings. Higher is
      better.
