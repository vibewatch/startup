            body: >-
              The technical architecture now centers on two mobile surfaces and a first-party data backbone. Think with
              Google describes a shift away from intuition-led decision making toward user-level analytics after
              Gymshark outgrew its earlier infrastructure, while Google Cloud’s partnership announcement adds the
              current stack components: BigQuery, Looker, real-time analytics, and Vertex AI. In practical workflow
              terms, the website and shopping app capture browsing, wishlists, checkout, and order-tracking behavior;
              analytics teams then use GA4-style user-level data to diagnose drop-off and ranking opportunities;
              merchandising and growth teams act on those insights through personalization, push notifications, and
              launch timing. The training app is strategically important because partner disclosures frame it as more
              than content marketing: it is a product surface that could accumulate intent, text-recorded activity, and
              recommendation data. The main diligence risk is concentration. Public evidence proves the stack direction,
              but not the economics or resilience of each layer under peak trading and ongoing international expansion.
              Public disclosures also stop short of naming uptime, app-originated order share, or partner-switching
