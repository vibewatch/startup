  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Scale Tiers and Who Actually Sets the Bar
        blocks:
          - type: paragraph
            body: >-
              The competitive field is not one clean peer set. Nike and adidas remain the outer boundary because they
              pair global brand scale with footwear, wholesale, and category breadth that Gymshark does not yet match.
              lululemon is a different benchmark: less mass than Nike, but stronger in premium women's activewear,
              store-led merchandising, and community-forward brand building. Under Armour matters more as a substitute
              than as a style leader, because it still combines technical apparel, footwear, and discount-led access.
              Below that layer sit the private challengers. Vuori is the most serious premium-growth comparator because
              it couples near-luxury pricing with store rollout and a $5.5 billion valuation-backed expansion plan. Alo,
              AYBL, and Alphalete are closer to Gymshark in digital-native merchandising and social-first aesthetics,
              but they are much less transparent on scale. The practical takeaway is that Gymshark competes upward
              against premium and incumbent brands for wallet share, while defending downward and sideways against newer
              apparel-first challengers.
