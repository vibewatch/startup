      - number: '1.3'
        title: Funding History, Valuation, and Capital Structure
        blocks:
          - type: paragraph
            body: >
              Gymshark's capital history is singular: the company was entirely bootstrapped from 2012 until August 2020,
              making it only the second British company since 2001 to achieve unicorn status without any prior external
              investment. In August 2020, General Atlantic—a leading global growth equity firm—acquired a 21% stake in a
              transaction valuing the business at over £1 billion. PwC Corporate Finance and Gateley Legal advised
              Gymshark on the deal; RBC Capital Markets and Freshfields advised General Atlantic. The deal implied
              approximately 4× trailing revenue and ~35× EBITDA based on £250m revenues at the time. As part of the
              transaction, Ben Francis increased his stake to over 70%.

              Beyond the General Atlantic minority equity investment, the company has not disclosed subsequent funding
              rounds or debt facilities from available public sources. Gymshark files annual accounts with Companies
              House; the FY24 accounts confirm a healthy cash position. The company has declared no dividends to date,
              channelling all profits back into growth and omnichannel expansion. No material valuation disclosure has
              been made post-2020; all references to current worth are analyst estimates only.
            claimRefs:
              - CO012
              - CO013
              - CO014
              - CO015
              - CO028
              - CO035
              - CO047
      - number: '1.4'
        title: Financial Performance and Global Scale
        blocks:
          - type: paragraph
            body: >
              Gymshark has achieved thirteen consecutive years of revenue growth. FY24 (year to 31 July 2024) revenue
              reached £607.3m, a 9% increase from £556.2m, marking the twelfth year of growth; orders rose 14.1%, units
              sold 13.6%, and adjusted EBITDA grew 14% to £51.7m. The US remained the single largest market at £251m,
              followed by Europe ex-UK (£145.7m), UK (£136.4m), and Rest of World (£74m). FY24 headcount increased from
              853 to 881.

              FY25 (year to 31 July 2025) marked the thirteenth consecutive year of growth, with revenue reaching £646m.
              Pre-tax profit compressed to £7m (from £11.8m in FY24 and £27.8m in FY22), EBITDA rose to £53.3m with
              gross margin at 62.3%. Cash at year-end exceeded £37m with inventory at approximately £117m. Ben Francis
              characterised the profit decline as intentional, reflecting heavy investment in new stores (Manchester,
              Amsterdam, Long Island, Dubai, New York), technology, and free community events. The company has not paid
              dividends and continues to reinvest all profits.

              In April 2025, Gymshark placed 296 employees at risk of redundancy while simultaneously announcing 168 new
              roles—a workforce restructure it attributed to macroeconomic volatility and the need to realign its
              operating model. The company's social following exceeds 18 million across official platforms; it has 900+
              employees across five global regions.
