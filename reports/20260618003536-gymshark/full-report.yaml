  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Cross-cutting view of Gymshark's major risk clusters. Governance concentration, supply-chain labour exposure, and
      returns-driven DTC leakage sit in the highest-residual-risk band.
    data:
      columns:
        - Low likelihood
        - Medium likelihood
        - High likelihood
      rows:
        - label: Founder / key-person risk
          values:
            - Governance broadens and succession is documented
            - Bench absorbs some decision load
            - Control remains concentrated in founder-CEO role
        - label: Profit-conversion risk
          values:
            - Store and tech spend pay back quickly
            - Margin stays compressed but stable
            - Pre-tax profit keeps falling despite revenue growth
        - label: Returns / CX leakage
          values:
            - Complaints prove anecdotal
            - Service friction stays manageable
            - Refund and delivery issues suppress repeat buying
        - label: Supply-chain labour / resilience
          values:
            - Audits continue to improve scores
            - High-risk-country exposure is flat
            - Supplier concentration or non-compliance re-emerges
        - label: Privacy / regulatory execution
          values:
            - Controls match policy promises
            - Minor compliance process gaps appear
            - Data-use or labour-governance lapse becomes material
        - label: Platform / cloud dependency
          values:
            - Web channel offsets disruptions
            - Policy changes raise friction
            - App-store or cloud issue harms major launches
        - label: Competitive trade-policy risk
          values:
            - De minimis reform narrows price gap
            - Competitor pressure remains manageable
            - Low-price rivals stay structurally advantaged despite rule changes
    approximationNotes: >-
      Likelihood bands are analytical judgments from public evidence rather than actuarial probabilities or company
      scores.
    claimRefs:
      - CR004
      - CR008
      - CR020
      - CR023
      - CR038
      - CR046
