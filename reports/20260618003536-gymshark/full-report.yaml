  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Gymshark still deserves diligence attention, but the current chapter is about price discipline rather than
              brand admiration. The hard historical anchor remains the August 2020 General Atlantic deal that valued the
              company at above £1 billion, with MarktoMarket estimating roughly 4x revenue and 35x EBITDA on the
              then-business. Today the public evidence set is different: FY25 revenue reached £646 million, adjusted
              EBITDA reached £53.3 million, gross margin was 62.3%, and pre-tax profit was only about £7 million.
              Applying 2x to 4x revenue yields roughly £1.3 billion to £2.6 billion, while 20x to 30x EBITDA yields
              about £1.1 billion to £1.6 billion. The overlap between those methods sits in the mid-£1 billion range,
              not in a reflexive premium re-run of 2020 froth. Because no post-2020 pricing benchmark is publicly
              disclosed, the most supportable call is Track / Research-more, with fair value support strongest near
              roughly £1.3 billion to £1.6 billion and visibly weaker above £2 billion.
            claimRefs:
