      - number: '4.4'
        title: 'Capital Adequacy: Self-Funded Expansion, But Not Infinite Slack'
        blocks:
          - type: paragraph
            body: >-
              Gymshark’s capital picture is healthier than its compressed profit line alone might suggest, but it is not
              disclosure-rich. Management says FY25 ended with more than £37 million of cash and just over £117 million
              of inventory, while the company again paid no dividends and kept funding expansion internally. The broader
              financing structure also still appears simple in public: General Atlantic’s 2020 minority investment
              remains the only clearly disclosed external equity event, with Ben Francis still above 70% ownership and
              General Atlantic at 21%. That combination implies strong founder control and no obvious near-term
              dependence on a fresh round, yet public sources stop short of giving investors the data they would
              actually need for full capital adequacy work. There is no disclosed monthly burn, no explicit runway
              calculation, no quantified debt-package discussion, and no clean store-payback disclosure. The practical
              conclusion is that Gymshark looks capable of funding current plans from earnings and balance-sheet cash
              today, but external readers cannot yet stress-test that conclusion against obligations detail.
