  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Governance concentration and profit-conversion risk
        blocks:
          - type: paragraph
            body: >-
              Gymshark's first-order risk is not demand collapse; it is how much of the strategic system still depends
              on a concentrated founder-led model while profit conversion keeps weakening. PwC said Ben Francis retained
              a roughly 70% majority stake in the 2020 General Atlantic transaction, General Atlantic took 21% plus a
              board seat, and the official about surface still presents Francis as Founder and CEO. That combination
              concentrates brand, culture, capital-allocation, and operating judgment in one person. The financial trend
              raises the cost of any execution mistake. Public reporting pegs pre-tax profit at £13 million in FY23,
              £11.8 million in FY24, and about £7 million in FY25 even as revenue kept rising, with management
              attributing the compression to investment in stores, technology, and community activity. The April 2025
              restructure that put 296 roles at risk while opening 168 new roles therefore reads less like a one-off
              headline and more like evidence that Gymshark is still redesigning the operating model while it is
              expanding it. Until public disclosure shows a stronger succession plan, store-level payback, and restored
              profit discipline, investors are underwriting a founder-heavy system that has become more operationally
              complex faster than it has become transparently governable.
            claimRefs:
