        title: Operating model, sustainability, and trust controls
        blocks:
          - type: paragraph
            body: >-
              Gymshark’s operating model is outsourced and audit-driven rather than vertically integrated in the
              traditional factory-owning sense. The clearest public evidence sits in the sustainability and support
              surfaces: supplier code-of-conduct requirements, Shared Fitness audits, Fair Labour Association
              membership, Bangladesh Accord participation, Oritain cotton traceability work, and explicit
              climate/circularity targets. That gives the chapter a stronger trust-and-quality base than many private
              apparel brands disclose. The company also ties product engineering back to operations by claiming that its
              seamless manufacturing technology reduces waste versus traditional cut-and-sew and by reporting
              recycled-polyester usage plus sea-freight mix. On the customer-experience side, Gymshark publishes a
              detailed returns workflow and a dedicated support taxonomy for faulty items, exchanges, and refund timing.
              The public gap is that process disclosure is not the same as process outcome: review platforms still show
              recurring complaints around delayed deliveries, refund loops, quality inconsistency, and hard-to-reach
              support.
