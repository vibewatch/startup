      - number: '7.4'
        title: Mitigations, transmission paths, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The encouraging part of Gymshark's risk picture is that management is not ignoring the weak points; the
              caution is that most mitigations remain operating mitigants rather than structural removals of risk.
              Modern-slavery disclosures show broader audit coverage, a reduced count of high-risk-country facilities,
              and remediation processes. Returns policies, app documentation, and data-stack case studies show that
              management knows customer experience, personalization, and owned checkout matter. De minimis reform may
              also weaken the imported-price umbrella that benefited Shein and Temu. Even so, the risks transmit quickly
              when one node breaks. Founder concentration affects decision velocity, succession, and capital discipline.
              Supplier or platform shocks flow into stock availability, refund pressure, and customer trust. Returns
              friction and price competition hit gross margin at the same time that retail rollout raises fixed costs.
              That is why kill criteria should focus less on abstract risk ratings and more on monitorable thresholds:
              another year of falling pre-tax profit, no visibility on store payback, persistent review-side service
              failures, renewed labour-governance incidents, or a material app/cloud disruption during major launches
              would all tell investors that Gymshark is still carrying too much operational complexity for its current
              disclosure level.
