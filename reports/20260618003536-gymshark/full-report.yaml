      - number: '3.3'
        title: 'Pricing and Packaging: Gymshark Occupies the Middle of the Ladder'
        blocks:
          - type: paragraph
            body: >-
              Pricing evidence supports a clear middle-market position for Gymshark. Its public leggings range sits well
              above entry-level discount or clearance offers and below the premium tickets visible at Vuori and Alo.
              Nike and adidas are harder to summarize with one number because their women's surfaces combine full-price
              merchandise, outlet behavior, and broad product breadth, but that complexity itself is a competitive tool:
              the incumbents can clear inventory, defend entry price points, and still keep premium SKUs live. Under
              Armour shows how discounting can be deployed tactically without abandoning technical-performance claims.
              AYBL and Alphalete sit much closer to Gymshark in the digital-native legging comparison, often with
              narrower price bands and similar returns or checkout conveniences. Packaging also matters. Free shipping
              thresholds, free returns, Klarna, and rewards programs all reduce friction in a category with high fit
              sensitivity. Gymshark remains competitive here, but not uniquely advantaged.
