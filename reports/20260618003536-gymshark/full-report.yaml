      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >
              Gymshark was founded by Ben Francis (age 19) and Lewis Morgan in Birmingham in 2012. Ben Francis remains
              the company's single most consequential figure: Founder, CEO, and holder of more than 70% of the equity.
              His concentrated ownership and operational role create a material key-person dependency. Lewis Morgan, a
              passive co-founder, exited his stake in full during the 2020 General Atlantic transaction per PwC advisory
              disclosures. Ben Francis stepped down as CEO in 2017 to serve as Chief Brand Officer while Steve Hewitt
              took the operational helm; Francis returned as CEO in August 2021. Paul Richardson (Executive Chairman)
              and Steve Hewitt departed from their respective roles around the same time.

              The current C-suite, as of the official about page and trade-press reports from 2026, consists of: Ben
              Francis MBE (Founder & CEO), Noel Mack (Chief Brand Officer), John Douglas (Chief Technology Officer),
              Carly Natalizia (Chief Commercial Officer, promoted from Chief Digital Officer in February 2026), Sian
              Keane (Chief People Officer), and Rich Sanders (Chief Financial Officer). The prior CFO departed abruptly
              in December 2024. David Laid was appointed Creative Director of Lifting, reflecting the brand's renewed
              focus on its lifting roots. On the board, Melis Kahya Akar (Head of Consumer, EMEA at General Atlantic)
              holds a seat following the 2020 investment. Chris Bumstead, a professional bodybuilder and Gymshark
              athlete, was named as a new shareholder in September 2024. Full board composition beyond these identified
              members is not publicly disclosed.
