      - number: '6.3'
        title: Retention, satisfaction, and repeat behavior
        blocks:
          - type: paragraph
            body: >-
              Durability is where the public picture gets more mixed. Historical transaction-panel work and derivative
              third-party summaries both put Gymshark’s first-year retention around 28%, with only 15% of customers
              retained after three years in the Bloomberg Second Measure view. That is not catastrophic for a
              fashion-adjacent DTC brand, but it is weak enough that repeat behavior must be earned rather than assumed.
              Management’s newer retention toolkit appears to be designed exactly for that problem. Rivo documents a
              2025 four-tier loyalty program that rewards workouts, app downloads, and purchases, while also framing
              Gymshark66 and other community loops as mechanisms for daily attention between orders. Public sentiment,
              however, is polarized. Apple and Google app ratings are excellent, TopConsumerReviews is respectable at
              3.5/5 and cites a 75% five-star Trustpilot mix, yet service-heavy review platforms such as Reviews.io,
              Trustpilot, and Sitejabber contain frequent complaints about delivery failures, exchange loops, thin
              materials, sizing inconsistency, and support responsiveness. Gymshark does publish a clear 30-day returns
              policy and dedicated help flows, so the public problem is not policy absence; it is execution leakage
              after purchase.
            claimRefs:
