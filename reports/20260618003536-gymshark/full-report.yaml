      - number: '1.5'
        title: Milestones and Strategic Evolution
        blocks:
          - type: paragraph
            body: >
              Gymshark's trajectory from a Birmingham garage start-up to a global unicorn spans several distinct phases.
              The 2012 founding began with a drop-shipping supplements website; within one year Ben Francis was
              hand-stitching apparel and pioneering influencer seeding with top fitness YouTubers. The BodyPower 2013
              inflection point—where the Luxe Tracksuit generated £30,000 in revenue in 30 minutes—validated the brand's
              mass appeal and its expo-plus-athlete marketing model. The 2015–2017 period saw professional management
              (Steve Hewitt, Paul Richardson) installed to scale infrastructure; the brand expanded into women's
              seamless categories and grew its global community.

              The 2020 General Atlantic deal unlocked capital and strategic support for North American expansion. The
              2021 CEO transition returned the founder to the helm. Gymshark opened its London Regent Street flagship in
              October 2022, entering physical retail for the first time. From 2023 to 2026, the company invested heavily
              in omnichannel infrastructure: new stores in major global cities, a Deloitte-built Google Cloud data
              platform that reportedly generated £20m incremental revenue in a single year, and a programme of free
              community lifting events. Germany was entered via retail partners Breuninger and Engelhorn in early 2026.
              A "secret project" signalled by Ben Francis in early 2026 has not yet been publicly announced.
