  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Gymshark sits inside the athleisure category, but the correct diligence lens is narrower than the broadest
              activewear or sportswear figures often quoted in pitch materials. The relevant market includes apparel and
              accessory spend where consumers expect workout utility plus casual wearability: leggings, seamless tops,
              training shorts, hoodies, sports bras, bags, and adjacent accessories. It does not automatically include
              footwear-led ecosystems, nutritional supplements, or pure fitness services, even though those categories
              compete for wallet share. That distinction matters because the market can look enormous if one imports
              every adjacent sportswear dollar, yet Gymshark's visible assortment remains concentrated in apparel-first
              baskets. The true substitute set is also broader than direct brand peers: some buyers trade up to Nike or
              Lululemon, some trade down to discount imports, and many simply repurpose existing basics for training.
              That fragmentation supports demand, but it also means Gymshark rarely competes inside a clean one-brand
              category.
