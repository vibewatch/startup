  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: Decision chain from scale proof, public multiple reset, and disclosure gaps to the current recommendation.
    data:
      nodes:
        - id: n1
          label: Scale proof
          detail: £646m FY25 revenue and global brand reach
        - id: n2
          label: Profit reality
          detail: £53.3m EBITDA but only c.£7m pre-tax profit
        - id: n3
          label: Comp reset
          detail: Public activewear multiples are much colder than 2020
        - id: n4
          label: Is entry at or below the mid-£1bn support zone?
          detail: Roughly £1.3bn-£1.6bn based on overlap methods
        - id: n5
          label: Are cap-table and store-payback gaps closed?
          detail: Current valuation, structure, and payback still matter
        - id: n6
          label: Track / Research-more
          detail: Default stance while price and diligence gaps stay open
        - id: n7
          label: Conditional buy only at disciplined price
          detail: Possible if pricing and disclosure both improve materially
        - id: n8
          label: Pass at premium ask
          detail: Required when price outruns disclosed economics
      edges:
        - from: n1
          to: n2
          label: Quality exists
        - from: n2
          to: n3
          label: But margin recovery matters
        - from: n3
          to: n4
          label: Price must respect comps
        - from: n4
          to: n6
          label: 'No'
        - from: n4
          to: n5
          label: 'Yes'
        - from: n5
          to: n6
          label: 'No'
        - from: n5
          to: n7
          label: 'Yes'
        - from: n3
          to: n8
          label: If seller anchors to frothy premium
    approximationNotes: >-
      The flow isolates recommendation logic from table TV001 by adding the public-multiple reset and
