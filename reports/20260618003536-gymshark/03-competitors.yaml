- id: moat-durability
  title: Moat Durability and Where Competitive Pressure Is Real
  body: Gymshark's moat is real, but conditional rather than absolute. Its best defenses are training-native brand identity, a large social audience, and a DTC model that has already reached meaningful revenue scale while preserving a 62.3% FY25 gross margin. Those traits matter because they let Gymshark price below the most premium yoga and lifestyle brands while remaining more aspirational than the cheapest alternatives. The moat weakens whenever the battle shifts away from community and into structural distribution. Nike and adidas can cross-subsidize with footwear, sponsorship, and wholesale channels; lululemon and Vuori can justify higher ticket prices through premium product storytelling and store-led brand experiences; Under Armour can still win with discounting and technical breadth. Service quality also matters more than management teams often admit. Review sources show that delivery, refund, and customer-service friction can damage advocacy in a brand whose growth model depends
    heavily on repeat purchase and word-of-mouth. The right diligence stance is therefore to treat Gymshark as durable in training apparel, but vulnerable wherever footwear, stores, or premium experience become the main purchase driver.
