- id: diligence-gaps
  title: What Public Evidence Still Cannot Resolve
  body: 'Three public-evidence gaps remain important. First, the premium price hierarchy is directionally clear, but one direct benchmark remains incomplete: a clean, captured lululemon Align price could not be reliably extracted during the run, so the chapter supports premium positioning more confidently than exact parity. Second, the private challengers remain opaque on hard scale. Vuori has a valuation and store-expansion narrative, but Alo, AYBL, and Alphalete still provide much less public revenue or order-volume disclosure than a diligence-grade underwriting model would need. Third, public sources do not show real switching behavior. We can infer overlap from assortment, price ladders, and brand narratives, yet the evidence does not reveal how often Gymshark actually wins or loses head-to-head baskets by cohort, geography, or channel. Those gaps do not break the chapter''s judgment, but they do cap precision on share-taking claims.'
  claimRefs:
  - CP031
  - CP036
  - CP037
  - CP042
  - CP046
