  rows:
  - - Gymshark
    - Training-first DTC scale-up
    - FY25 revenue £646m; 200+ countries; social following >18m
    - Digitally native gym and training buyers
    - Influencer-native training identity and mid-premium price position
    - No footwear ecosystem or large wholesale/store moat
  - - Nike
    - Global incumbent
    - 2025 revenue $46.3bn; June 2026 market cap $65.44bn
    - Mass global performance and lifestyle buyers
    - Footwear-led ecosystem plus broad category reach
    - Less niche-authentic than specialist gym labels
  - - adidas
    - Global incumbent
    - June 2026 market cap $35.31bn; public annual-report disclosure
    - Global sport and lifestyle buyers
    - Footwear, apparel, promotion, and lifestyle crossover
    - Less training-community-specific than Gymshark
  - - lululemon
    - Premium public incumbent
    - Public company; investor materials emphasize omni growth and annual reports
    - Premium women's activewear and lifestyle buyers
    - Technical product, community, stores, and digital service model
    - Higher price architecture and less male-training identity than Gymshark
  - - Under Armour
    - Performance incumbent / substitute
    - June 2026 market cap $2.35bn
    - Performance and team-sport buyers seeking technical gear
    - Footwear, apparel, accessories, and discount-access strategy
    - Weaker current brand heat than Nike or adidas
  - - Vuori
    - Premium growth challenger
    - $5.5bn valuation in 2024; 18 countries; >100 stores expected in 2026
    - Premium performance-lifestyle buyers across men and women
    - Versatile performance-to-lifestyle brand with store rollout
    - Less disclosed scale than public incumbents
  - - Alo Yoga
    - Premium studio / wellness challenger
    - Private; public financial scale not disclosed in retained sources
    - Yoga, pilates, studio, and lifestyle buyers
    - Studio-to-wellness adjacency with shoes and accessories
    - Exact scale and economics remain opaque
  - - AYBL
    - Social-native DTC challenger
    - Private; public financial scale not disclosed in retained sources
    - Women's training and value-conscious gym buyers
    - Women's-led collection architecture and lower visible price points
    - Narrower public capability stack and no footwear moat
  - - Alphalete
    - Social-native DTC challenger
    - Private; public financial scale not disclosed in retained sources
    - Gym and physique-oriented apparel buyers
    - Strong women's and men's apparel focus with sale elasticity
    - Still apparel-first and less diversified than incumbents
  notes: Profile rows mix disclosed public scale with clearly labeled undisclosed cases. Private-peer cells use only retained public evidence and do not imply hidden parity with Gymshark or the incumbents.
