- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Brand
  - Price / unit / contract model
  - Included capabilities
  - Discount / unknowns
  - Implication
  rows:
  - - Gymshark
    - Core leggings observed at $38-$74; sale markdowns also visible
    - Training apparel, seamless, accessories; free shipping over $75
    - Realized promo mix undisclosed
    - 'Sits in the middle: premium versus value players, cheaper than premium yoga peers'
  - - Nike
    - Visible women's price ladder roughly $32-$230 across leggings and adjacent products
    - Huge category range plus footwear and accessories
    - Broad catalog means not all prices are like-for-like leggings
    - Can defend both entry and premium positions at scale
  - - adidas
    - Many women's items around $65-$150 with frequent markdowns
    - Footwear-led athletic-lifestyle platform
    - Observed page is sale-heavy and mix-driven
    - Promotion power can pressure mid-market specialists
  - - lululemon
    - Premium DTC apparel model; exact canonical Align SKU price not reliably extracted in this run
    - Technical product, stores, digital, community
    - Precise in-run price capture remains incomplete
    - Supports premium benchmark framing even if exact parity is still a diligence ask
  - - Under Armour
    - UA Motion leggings observed at $55 list / $49.97 sale
    - Technical performance features, rewards, free shipping over $50, free returns
    - Sale state may not represent the full line
    - Shows how technical positioning can coexist with tactical discounting
  - - Vuori
    - Daily Legging observed at $98
    - Performance-lifestyle fabric story, free shipping over $75, free returns on eligible items
    - Single-SKU snapshot, not the full line
    - Clear premium step-up versus Gymshark core pricing
  - - Alo Yoga
    - Collection HTML surfaced an Airlift legging at $134
    - Yoga/studio/wellness ecosystem and complimentary shipping/returns
    - Collection-page extraction rather than full PDP snapshot
    - Represents the high-premium end of the lifestyle studio set
  - - AYBL
    - Multiple leggings observed at £28-£44
    - Women's training apparel, Klarna, free UK shipping over £45, 30-day returns
    - GBP pricing not FX-normalized here
    - Closer to value-mid pricing and checkout convenience than to premium positioning
  - - Alphalete
    - $58-$70 core leggings with deeper sale entries as low as $20.40 and $28
    - Women's and men's apparel, free domestic shipping over $120, 30-day returns
    - Sale mix increases apparent price elasticity
    - Can compete directly on aesthetic and promo intensity even without larger-scale distribution
  notes: Prices are current list or sale observations from retained public pages and are not normalized for region, tax, or realized discount mix. The lululemon row intentionally preserves an exact-price extraction gap instead of overstating certainty.
