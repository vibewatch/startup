- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Training-native community and content loop
    - Nike, adidas, and lululemon can outspend or out-distribute the same audience
    - High
    - Measure cohort retention and repeat purchase in creator-led segments to verify whether community offsets scale disadvantage
  - - Mid-premium pricing with healthy margin headroom
    - Vuori and Alo can reset the premium anchor upward while value challengers pull price-sensitive buyers down
    - High
    - Track basket mix and markdown cadence by category to test whether Gymshark preserves gross margin while expanding range
  - - Apparel-led DTC speed
    - Footwear-led ecosystems and wholesale channels still reach more purchase occasions than Gymshark can
    - High
    - Request category expansion roadmap, especially footwear and offline productivity assumptions
  - - Social reach and word-of-mouth
    - Service failures, delivery issues, and return friction can damage advocacy faster than paid acquisition can replace it
    - Medium
    - Audit NPS, complaint resolution time, courier dependence, and repeat-order behavior after returns incidents
  - - International reach across 200+ countries
    - Global reach does not equal local store productivity or market-share density
    - Medium
    - Request top-market contribution, conversion, and fulfillment economics by country cluster
  - - Younger brand with training authenticity
    - Private challengers can imitate aesthetics and drops without needing Gymshark's scale
    - Medium
    - Track collection-level launch hit rate and creator conversion versus AYBL and Alphalete lookalikes
  notes: Severity reflects underwriting relevance rather than certainty. The register deliberately separates moat claims from the evidence still needed to prove durability in practice.
