- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Profit deterioration
    - Another year of falling profit or EBITDA margin slippage despite revenue growth
    - The market will stop paying for the brand and start valuing the company on weaker public apparel discipline
    - Recut toward the bear range and pause any aggressive entry
  - - Store economics disappoint
    - Store cohorts fail to clear internal hurdle rates or management still will not disclose payback
    - The omnichannel expansion narrative flips from upside to fixed-cost drag
    - Remove the bull case and cap valuation near the base or bear range
  - - Fresh price demands too much
    - A new financing or secondary ask is above roughly £2bn without better disclosure
    - Upside gets consumed before evidence arrives and common-equity returns compress
    - Move from track to pass unless the price resets
  - - Service quality stays weak
    - Refund, delivery, and quality complaints remain elevated through major trading periods
    - Repeat purchase, realized net revenue, and brand advocacy all weaken at once
    - Treat service remediation as a gating item for any investment committee approval
  - - Competitive price umbrella returns
    - Trade-policy relief fades or ultra-cheap rivals re-widen the value gap
    - Gymshark may need more discounting or marketing spend to defend growth
    - Stress-test the revenue lens downward and reassess entry discipline
  notes: These triggers are deliberately falsifiable. The goal is to make the valuation stance measurable before a fresh private price or secondary quote is underwritten.
