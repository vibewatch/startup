- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Gymshark 2020 General Atlantic round
    - Last disclosed primary anchor
    - '>£1bn valuation; 21% stake sold; c.4x revenue and c.35x EBITDA by MarktoMarket''s estimate'
    - Best hard historical reference for what a strategic growth investor once paid
    - 2020 growth-cycle conditions and a smaller revenue base make it stale as a stand-alone fair-value anchor
  - - Gymshark FY25 revenue lens
    - Current analytical revenue anchor
    - 2x-4x FY25 revenue implies about £1.292bn-£2.584bn
    - Ties valuation directly to disclosed FY25 scale and maps cleanly to current public sales multiples
    - Revenue-only work ignores whether profit recovery arrives
  - - Gymshark FY25 EBITDA lens
    - Current analytical EBITDA anchor
    - 20x-30x FY25 EBITDA implies about £1.066bn-£1.599bn
    - Adds margin discipline and captures today's thinner profit conversion
    - EBITDA quality is less fully disclosed than revenue and can miss capex or retail-build obligations
  - - Nike
    - Current public comp
    - About 1.4x revenue using $65.44bn market cap and $46.309bn 2025 revenue
    - Large-scale athletic incumbent showing how cold mega-cap activewear multiples are now
    - Footwear breadth, wholesale mix, and corporate maturity make Nike safer and broader than Gymshark
  - - lululemon
    - Current public comp
    - About 1.1x-1.2x trailing revenue using $12.69bn market cap and $11.073bn TTM revenue
    - Premium activewear brand proving that even top-tier names have de-rated hard from prior froth
    - Heavier store estate, women's mix, and public-company profile make it only a directional premium comp
  - - Deckers
    - Current public specialty-apparel comp
    - About 3.0x trailing revenue on the retained 2026 snapshot
    - Useful upper-end public reference for a branded specialty winner that still earns a premium multiple
    - Different brand portfolio and footwear exposure mean Deckers is not a pure Gymshark read-through
  - - Under Armour / Gap lower bounds
    - Current public lower-bound references
    - Under Armour about 0.45x revenue; Gap about 0.7x revenue on retained public figures
    - Helpful reminder of where weaker or more mature apparel names trade when the market is skeptical
    - Both are less digitally native and structurally different from Gymshark's DTC identity
  - - Vuori 2024 funding round
    - Current private sentiment signal
    - $5.5bn valuation after an $825m financing round
    - Shows private capital still pays up for premium activewear brands with expansion narratives
    - No disclosed Vuori revenue means the mark is not a clean multiple or direct Gymshark fair-value bridge
  enumerationScope:
    coverage: partial
    basis: Selected sample spanning Gymshark's historical round, current analytical revenue and EBITDA anchors, four public apparel references, and one recent private premium activewear financing signal reviewed directly during this run.
  notes: This table is intentionally partial rather than exhaustive. Several attractive private peers disclose valuations without revenue, and several public names are operationally different enough that they should be treated as bracket signals, not exact fair-value twins.
