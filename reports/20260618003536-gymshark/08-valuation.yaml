- id: scenario-ranges
  title: Bull, base, and bear valuation ranges
  body: The scenario work is most defensible when it stays close to disclosed FY25 revenue and EBITDA rather than pretending a clean current round exists. A bear case of roughly £1.1 billion to £1.3 billion corresponds to 20x EBITDA or 2x revenue and fits a world where another year of profit erosion, weak store economics, or persistent service friction pulls the market toward lower public comparables. A base case of roughly £1.3 billion to £1.9 billion reflects the overlap between 2x to 3x revenue and roughly 22.5x to 25x EBITDA. That range still pays for scale, brand, and cash generation, but it does not pay as if Gymshark were already proving public-company-grade operating leverage. A bull case above roughly £2.2 billion and up to about £2.6 billion is possible only if margin recovery, store payback, and channel discipline become visible enough to justify 3.5x to 4x revenue despite today's cooler public apparel multiples. Without a disclosed entry price, these are valuation support zones,
    not precise IRRs.
