- id: diligence-asks-and-kill-criteria
  title: Final diligence asks, kill criteria, and what would move the call
  body: The outstanding work is mechanical, not conceptual. Investors still need the current capitalization table, any post-2020 financing terms, store cohort payback, returns-adjusted margin by channel, and a cleaner bridge from FY25 EBITDA to future operating leverage. Those are the inputs that decide whether a mid-£1 billion price is attractive or whether a higher headline mark simply front-loads future return. The thesis would improve if management shows that stores are earning attractive paybacks, service issues are not eroding repeat demand, and data-led merchandising is converting into cleaner margin recovery. The thesis breaks if another year of profit deterioration arrives, if review-side friction remains unresolved, or if a fresh mark asks investors to pay above roughly £2 billion without better disclosure. De minimis reform may help narrow the cheap-import umbrella, but it is not a substitute for evidence on payback, margins, and cap-table terms.
