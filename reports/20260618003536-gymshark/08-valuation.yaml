- id: comparable-set-and-thesis
  title: Comparable set, thesis, and anti-thesis
  body: 'The thesis for paying more than a distressed-apparel multiple is straightforward. Gymshark is still a scaled global DTC brand, claims customers in more than 200 countries, has a social audience above 18 million, and has evidence that its data stack and owned customer journey can move revenue and merchandising quality. That is why a simple Gap-like or Under Armour-like anchor would understate the brand. The anti-thesis is equally real. Public market comps are colder than private enthusiasts may assume: Nike screens near 1.4x sales on current public data, lululemon is now only around 1.1x to 1.2x trailing revenue, Gap is about 0.7x, and even Deckers sits closer to 3.0x. Vuori''s $5.5 billion round proves private capital still pays up for premium activewear, but without disclosed revenue it is a sentiment signal, not a clean multiple. Add Gymshark''s profit compression, 2025 restructure, and review-side service friction, and the evidence supports a premium to weak apparel comps without
    supporting an unconstrained premium.'
