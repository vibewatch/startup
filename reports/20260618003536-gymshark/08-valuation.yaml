- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bear
    - Profit recovery stalls, store rollout adds fixed cost faster than it adds contribution, and the market anchors closer to 20x EBITDA or 2x revenue
    - About £1.1bn-£1.3bn; any entry near £2bn would look sharply overpaid in this state
    - Another down-year in profit, unresolved service issues, or weak retail payback
    - Real downside tail that cannot be ignored on current disclosure
  - - Base
    - Growth stays respectable, brand strength remains intact, and management proves enough operating leverage to justify a premium to weaker public apparel names
    - About £1.3bn-£1.9bn; this is the overlap between 2x-3x revenue and ~22.5x-25x EBITDA
    - Current-price opacity, limited payback disclosure, and ongoing execution risk
    - Highest-likelihood zone on today's public evidence
  - - Bull
    - Margin recovery, store economics, and data-led merchandising all improve fast enough to justify 3.5x-4x revenue despite colder public multiples
    - About £2.2bn-£2.6bn; attractive only if entry is still much lower than that support zone
    - Asking investors to pay for upside before the proof arrives
    - Possible, but execution-heavy and not the base underwriting case
  notes: These are analytical support zones, not management guidance. Because no fresh priced round is public, the table frames what different entry levels would need to be true rather than pretending a precise fair value exists today.
