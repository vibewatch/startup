- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current cap table and any post-2020 pricing
    - Share classes, share count, option pool, secondaries, and any priced financing since 2020
    - No one can convert company quality into a defendable entry price without this bridge
    - CFO, counsel, and shareholder-register request
  - - FY25 audited bridge
    - Revenue to EBITDA bridge, adjusted-to-statutory reconciliation, and FY26 trading update
    - The current range depends on whether FY25 is a trough year or the new economic baseline
    - Finance diligence and audited accounts package
  - - Store payback and lease economics
    - Store cohort payback, four-wall margin, occupancy burden, and hurdle rates
    - The bull case requires stores to be value-accretive rather than fixed-cost heavy
    - Retail operations review and lease schedule analysis
  - - Returns-adjusted channel margin
    - Return rates, refund cycle times, markdown leakage, and contribution margin by channel
    - Service friction can quietly destroy multiple support even when topline growth holds
    - Customer operations and channel-P&L diligence
  - - Current ownership and downside terms
    - Any preferences, ratchets, or rights that alter common-equity outcomes
    - Headline valuation is not enough if structure absorbs the upside or worsens the downside
    - Legal diligence on shareholder agreements and term sheets
  - - Growth quality proof for the next leg
    - Current customer-cohort retention, marketing efficiency, and evidence that data tooling is raising realized margin
    - A premium multiple needs proof that the data and community flywheel still converts efficiently at scale
    - Growth analytics pack and management KPI review
  notes: These asks are not generic. They are the exact disclosures needed to decide whether Gymshark is merely a strong company or a strong company available at an attractive price.
