- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Brand and demand proof
    - Gymshark has global reach, strong social scale, and a recognizable training-first identity
    - Community strength does not automatically offset weaker profit conversion or service friction
    - Show repeat purchase durability, better service metrics, and clean channel-level margin data
  - - Unit economics
    - 62.3% FY25 gross margin and positive EBITDA show the engine still works
    - Pre-tax profit and restructuring imply operating leverage is not yet clean enough for a premium mark
    - Disclose contribution margin, return-adjusted profitability, and store payback
  - - Data and owned journey
    - Deloitte and Think with Google both point to meaningful data-stack upside
    - Case studies do not prove today's marginal revenue quality or CAC efficiency at scale
    - Provide current cohort, retention, and merchandising-lift evidence
  - - Category backdrop
    - De minimis reform and steady athleisure demand can help incumbent branded players
    - Price competition, store expansion costs, and customer-service friction still pressure the thesis
    - Show that growth remains mid-teens without heavier discounting or service leakage
  - - Valuation anchor
    - Mid-£1bn support is plausible on revenue and EBITDA lenses
    - A Vuori-like or 2020-style premium is under-evidenced without new disclosure
    - Produce current ownership terms and a fresh mark that can be reconciled to FY25 economics
  notes: The thesis is not that Gymshark is broken; it is that the current evidence supports a disciplined premium, not a blank cheque. The anti-thesis is mostly about price, margin recovery, and disclosure quality.
