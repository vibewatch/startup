  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current valuation disclosure
    missingEvidence: Current share count, share classes, any post-2020 financing terms, and any current secondary clearing price.
    whyItMatters: Without a fresh pricing and cap-table bridge, public evidence cannot convert company quality into a defendable entry price or common-equity return case.
    diligencePath: Request the current capitalization table, board-approved financing documents, and any investor update deck that bridges FY25 results to current valuation expectations.
    relatedQuestionRefs:
    - QV031
    - QV036
  - type: enumeration-incomplete
    severity: material
    topic: comparable valuation set
    missingEvidence: A broader like-for-like activewear peer set with disclosed channel mix, margin profile, and current market multiples for every close apparel comparator.
    whyItMatters: The comparable valuation table is intentionally partial because several attractive private peers disclose valuations without revenue, while some public peers are operationally different from Gymshark.
    diligencePath: Extend the comp set with more disclosed activewear and specialty-apparel names, normalizing for channel mix and profitability before relying on an upper-end revenue multiple.
    relatedQuestionRefs:
    - QV020
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: store payback and omnichannel economics
    missingEvidence: Store-level payback, four-wall margin, lease-adjusted return thresholds, and channel-mix contribution after returns.
    whyItMatters: The bull case depends on stores and omnichannel investment creating durable operating leverage rather than just more fixed cost.
    diligencePath: Request store cohort economics, lease schedule, and management's hurdle-rate framework for retail rollout and omnichannel inventory deployment.
    relatedQuestionRefs:
    - QV028
    - QV036
  - type: missing-source
    severity: minor
    topic: preference stack and downside protection
    missingEvidence: Any liquidation preferences, ratchets, or secondary transfer restrictions affecting common-equity outcomes.
    whyItMatters: A high headline valuation can still produce weak common-equity returns if preference terms absorb much of the upside or reshape downside outcomes.
    diligencePath: Review shareholder agreements, any preference summary, and legal counsel notes before underwriting upside or downside on a per-share basis.
    relatedQuestionRefs:
    - QV031
    - QV036
