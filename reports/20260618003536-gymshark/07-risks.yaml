  - Diligence path
  rows:
  - - Supply-chain labour and modern-slavery exposure
    - UK Modern Slavery Act / supplier-country labour regimes
    - Gymshark flags Bangladesh, Cambodia, China, Egypt, Jordan, and Pakistan as higher-risk countries and disclosed three potential forced-labour non-compliances in FY24-25
    - High
    - High
    - 203 audits, public factory list, code of conduct, Accord coverage in Bangladesh
    - High because production remains outsourced across higher-risk jurisdictions
    - Request supplier-level spend mix, CAP closure logs, and evidence that resolved forced-labour cases did not recur
  - - Consumer-rights and refunds compliance
    - UK distance-selling and refund law
    - Gymshark offers a 30-day policy, but UK guidance says online buyers have statutory cancellation and refund rights that cannot be restricted
    - Medium
    - High
    - Published returns policy, support taxonomy, and standard refund workflow
    - Medium-high because review evidence suggests execution friction can turn policy into complaints or claims
    - Test refund turnaround, fault handling, and statutory-rights disclosures across core markets
  - - Data privacy and profiling obligations
    - UK GDPR / Data Protection Act 2018 / California privacy
    - Privacy notice covers customer, app, marketing, events, social media, and California residents; UK law adds profiling and security duties
    - Medium
    - High
    - Formal privacy notice, owned checkout, and first-party data architecture
    - Medium because the public set does not show external assurance or incident history
    - Request DSR metrics, retention schedules, automated-decision controls, and any breach or regulator correspondence
  - - Employment-law exposure from 2025 restructure
    - UK collective consultation rules
    - 296 roles were put at risk in April 2025; UK guidance says 20+ redundancies within 90 days trigger collective-consultation duties and HR1 notification
    - Medium
    - Medium
    - Management paired proposed cuts with 168 new roles and framed the move as operating-model redesign
    - Medium because the public record does not show consultation process quality or tribunal outcomes
    - Request consultation timeline, RPS filing evidence, and any subsequent employment claims
  - - Trade-policy volatility around low-value imports
    - US de minimis / Section 321 reform
    - White House, CBP, and CRS materials show the trade regime that helped PRC-linked ecommerce scaled has been materially tightened since 2025
    - Medium
    - Medium
    - Policy changes may narrow ultra-low-price gaps for incumbents like Gymshark
    - Medium because price pressure does not disappear and future rulemaking can shift again
    - Track whether Temu/Shein price architecture, delivery promises, or US demand materially re-accelerate under new rules
  - - Digital-terms and dispute-resolution exposure
    - Website/app terms and sale terms
    - US Terms of Use include binding arbitration, class-action waiver language, and the right to suspend or withdraw sites for business reasons
    - Low-Medium
    - Medium
    - Clear published terms and owned checkout reduce ambiguity about platform rules
    - Medium because outages or policy changes still sit on the conversion path
    - Review jurisdiction-specific terms, outage response obligations, and any dispute data by channel
  notes: Ordered by current severity rather than legal novelty. This is a partial register focused on publicly visible consumer, privacy, employment, labour-governance, and trade-policy exposures; it is not an exhaustive litigation or enforcement scan.
