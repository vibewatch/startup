- id: regulatory-and-legal-risk
  title: Regulatory, legal, consumer-rights, and employment risk
  body: 'Gymshark does not show an obvious active lawsuit or enforcement action in the reviewed public set, but its legal perimeter is wider than a simple returns policy or GDPR footer suggests. The privacy notice explicitly covers customer, app, marketing, event, and social-media interactions and includes a California privacy notice, while UK government guidance makes clear that UK GDPR and the Data Protection Act 2018 create duties around fair use, security, profiling, and automated decision-making. Terms of Use add another practical risk signal: they rely on binding arbitration language for US users and reserve the right to suspend or withdraw digital services for business and operational reasons. Consumer-rights exposure also exists at the operating layer. Gymshark offers a generous-looking 30-day returns window, but UK guidance says online buyers get statutory cancellation and refund rights that cannot be contracted away, so poor execution on refunds or faulty items can become a compliance
    issue rather than just a CX issue. Employment law is similarly material because the 2025 restructure crossed the threshold where collective-consultation rules matter. Supply-chain labour governance is the largest legal tail. Gymshark now publishes a modern-slavery statement, factory list, and code of conduct, but those same disclosures confirm that the company itself sees elevated labour-risk jurisdictions inside the active supply network.'
