- id: operational-and-dependency-risk
  title: Operational, supply-chain, and partner-dependency risk
  body: 'Operationally, Gymshark now looks more like a distributed system than a single-brand storefront. The public factory list and modern-slavery statement show a large outsourced network spanning Tier 1 through Tier 4 and distribution sites, with numerous facilities in Vietnam, Sri Lanka, Bangladesh, Turkey, Cambodia, Jordan, China, and other offshore or near-shore manufacturing hubs. That creates clear resilience and labour-governance obligations even though Gymshark has reduced the number of high-risk-country factories and claims full live Tier 1 audit coverage. Customer experience adds another operational trapdoor. Reviews.io and archived Trustpilot evidence show recurring complaints around delivery delays, refund loops, and product quality; NRF says 19.3% of online sales are expected to be returned in 2025, and poor returns experiences materially reduce repurchase intent. The digital funnel is also dependency-heavy. The about page, Think with Google, Google Play, and Deloitte all
    show that Gymshark relies on app engagement, push notifications, app-store distribution, and Google Cloud-based merchandising and analytics to sustain DTC conversion. Retail expansion complicates the picture further: stores and partner-led physical entry may improve brand density, but they also add leases, staffing, inventory, and execution burden while the company still does not disclose four-wall economics or FX hedging. That combination makes supply continuity, return leakage, platform rules, and cloud uptime direct valuation variables.'
