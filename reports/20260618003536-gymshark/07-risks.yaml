- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Profit-conversion deterioration
    - Pre-tax profit and gross-margin trajectory
    - Another year of lower pre-tax profit despite revenue growth or visible gross-margin erosion
    - Pause expansion underwriting until management shows where reinvestment is converting back into earnings
  - - Founder concentration without disclosed backup
    - Leadership continuity disclosure
    - Founder role change, prolonged absence, or strategic reset without a named succession framework
    - Treat governance risk as thesis-breaking until a real contingency plan is evidenced
  - - Returns and service leakage
    - Reviews, complaints, and disclosed policy changes
    - Persistent refund/delivery complaints or more restrictive return economics without service improvement
    - Assume weaker repeat behaviour and haircut customer-LTV assumptions
  - - Supply-chain labour / compliance
    - Modern-slavery disclosures and audit outcomes
    - New unresolved forced-labour indicators, rising high-risk-country exposure, or weaker audit coverage
    - Escalate legal and reputational discount rate; require supplier-remediation proof before proceeding
  - - Platform / cloud dependency
    - App-store availability, major-launch execution, or cloud tooling outages
    - Material disruption during a major drop or loss of key mobile / cloud functionality
    - Reduce confidence in DTC resilience and demand-forecast accuracy
  - - Competitive trade-policy reset
    - Shein / Temu price-gap and delivery proposition after de minimis reform
    - Price gap remains structurally wide while Gymshark gross margin weakens
    - Assume de minimis reform is not a durable moat improvement and lower margin expectations
  notes: These kill criteria are advisory investor thresholds built from public evidence, not company guidance. They emphasize monitorable outcomes rather than abstract labels because Gymshark does not publish enough internal KPI detail for tighter quantitative covenant-style tests.
