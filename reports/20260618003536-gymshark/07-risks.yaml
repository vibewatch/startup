  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-scan
    missingEvidence: An exhaustive jurisdiction-by-jurisdiction litigation, enforcement, and regulatory-complaint search covering all Gymshark operating markets and every disclosed supplier-country legal venue.
    whyItMatters: The public register captures material visible risks, but a private company with global ecommerce and outsourced manufacturing can still have unobserved claims or regulator correspondence outside the obvious UK and US touchpoints.
    diligencePath: Run counsel-assisted searches across court, regulator, and arbitration databases in the UK, US, EU, and major supplier jurisdictions; reconcile results against management legal reserves and incident logs.
    relatedQuestionRefs:
    - QR014
    - QR016
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: store-payback
    missingEvidence: Store-level payback periods, four-wall margins, lease commitments by site, and hurdle rates for new flagships and partner-led retail entries.
    whyItMatters: Retail expansion is a core explanation for weaker profit conversion, so investors need to know whether stores are value-accretive or simply adding fixed cost and working-capital pressure.
    diligencePath: Request site-by-site capex, rent, labour, traffic, conversion, and contribution dashboards plus management’s pass/fail thresholds for new physical locations.
    relatedQuestionRefs:
    - QR011
    - QR030
    relatedTableRefs:
    - TR005
  - type: private-evidence-only
    severity: material
    topic: returns-metrics
    missingEvidence: Gross return rate, defective-item incidence, cancellation rate, exchange completion, and refund cycle-time distributions by market and product family.
    whyItMatters: Review complaints and industry benchmarks suggest risk, but only internal metrics can show whether Gymshark’s returns leakage is normal for apparel or materially worse than peers.
    diligencePath: Request post-purchase operations dashboards, reverse-logistics cost bridges, and cohort retention data segmented by returned versus non-returned orders.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: supplier-concentration
    missingEvidence: Supplier spend allocation, top-factory dependency, dual-sourcing coverage, and contingency capacity for key categories and fabrics.
    whyItMatters: A public factory list proves breadth, but it does not reveal whether a small number of factories, mills, or regions still carry outsized revenue and delivery risk.
    diligencePath: Request supplier scorecards showing spend, volume, category dependency, lead times, and backup capacity by country, tier, and material type.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: fx-hedging
    missingEvidence: Currency mix of revenue and cost of goods sold, freight and duty exposure by currency, and any hedging policy or hedge effectiveness history.
    whyItMatters: Gymshark reports in GBP but operates globally and sources across many non-UK geographies, so unhedged currency swings could amplify already weaker profit conversion.
    diligencePath: Request treasury policy, currency sensitivity analysis, and historical gross-margin bridge separating FX from mix, markdowns, and logistics costs.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR002
    - TR003
  - type: private-evidence-only
    severity: material
    topic: succession-governance
    missingEvidence: Formal succession plan, founder contingency protocols, delegated authorities, and any key-man insurance or retention package for the senior bench.
    whyItMatters: The founder remains both symbolic and structural to the business, so the absence of disclosed backup arrangements leaves a real underwriting gap around continuity.
    diligencePath: Request board-approved succession materials, emergency-coverage plans, and governance minutes showing how strategic decision rights transfer under disruption.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR004
