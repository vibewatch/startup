company:
  name: Gymshark
chapter:
  number: 5
  title: Product & Technology
  summary: 'Gymshark’s product stack is broader than a leggings-first DTC brand pitch suggests: the company now runs multiple seamless families, always-on shorts/bras/hoodies/accessories catalogs, a shopping app, a training app, and a data platform built around first-party analytics plus Google Cloud tooling. Public evidence supports real maturation in mobile commerce, personalization, supplier-audit infrastructure, and recycled-material operations, but it also shows uneven proof on collection-level certifications, app usage economics, outsourced-factory footprint, and the quality leakage implied by refund and delivery complaints.'
sections:
- id: product-surface
  title: Product surface and customer workflow
  body: Gymshark’s customer-facing product is best understood as a layered fitness-commerce system rather than a single hero legging franchise. The active catalog still spans core seamless families—Flex, Vital, and Adapt—alongside dedicated shorts, sports bra, hoodie, legging, and accessory surfaces, while Ombre remains a live but currently empty collection page that reads more like a dormant family than a fully supported line. That matters because buyers are not only purchasing fabric silhouettes; they are entering a workflow built around drops, mobile discovery, app-only access, notifications, wishlist behavior, and repeat browsing. The shopping app is explicitly positioned as the fastest route into launches and exclusive inventory, while the training app adds workout content and progress-tracking utility that can keep the brand in front of the user between purchases.   The product lens, therefore, is assortment plus engagement loop, not apparel alone. That distinction matters for underwriting.
