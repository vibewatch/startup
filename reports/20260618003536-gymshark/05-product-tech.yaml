- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / certification / quality metric
  - Status
  - Scope
  - Gap
  rows:
  - - 30-day returns policy for web and app orders
    - Explicitly published
    - Most items bought on gymshark.com or the Gymshark App, subject to exclusions
    - No public gross return-rate or refund-cycle KPI
  - - Final-sale and hygiene exclusions
    - Explicitly published
    - Underwear, swimwear, bottles, personalized items, and 60%+ discount items in US/Canada
    - Policy clarity does not show customer understanding or dispute rate
  - - Faulty-item and exchange workflow
    - Explicit support taxonomy exists
    - Dedicated help paths for faulty items, exchange requests, and return timeframes by country
    - No public defect incidence, exchange success rate, or warehouse SLA
  - - Recycled-polyester disclosure
    - Explicitly published
    - FY24 material mix says 80% of polyester came from recycled sources
    - No current SKU-level GRS or similar public certification proof was surfaced in this review set
  - - Cotton traceability and human-rights controls
    - Explicitly published
    - Oritain cotton traceability plus Code of Conduct requirements across suppliers
    - No public supplier-level pass/fail file or remediation detail by factory
  - - Audit and labour-governance evidence
    - Explicitly published
    - 174 Shared Fitness audits, FLA membership, Bangladesh Accord registration, and improved factory grades
    - No public factory concentration or country-level risk-weighted scorecard
  - - Transport and waste-reduction controls
    - Explicitly published
    - 83% sea-freight mix, 30% recycled mailing bags, waste diversion and donation/recycling pilots
    - No public cost or customer-service trade-off analysis for these operating choices
  - - External quality sentiment
    - Mixed and adverse-leaning
    - Review platforms still record complaints on delivery, refunds, and quality inconsistency
    - Public review data is anecdotal and not a substitute for cohort defect or NPS reporting
  notes: Statuses refer to publicly visible controls and evidence, not to an external assurance opinion; the key gap in every row is outcome measurement rather than policy existence.
