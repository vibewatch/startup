  evidenceGaps:
  - type: missing-source
    severity: material
    topic: grs-proof
    missingEvidence: Current SKU-level or collection-level public certification evidence showing whether recycled-material claims are backed by GRS or an equivalent standard.
    whyItMatters: Without public certification proof, recycled-content claims are directionally useful but not fully diligence-grade for underwriting product trust or ESG differentiation.
    diligencePath: Request current certification files, factory-level scope documents, or public product-detail pages that tie specific collections to auditable recycled-material standards.
    relatedQuestionRefs:
    - QE020
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: app-economics
    missingEvidence: Shopping-app MAU, DAU, order-share, conversion, retention, and repeat-purchase lift versus web-only cohorts.
    whyItMatters: The mobile commerce surface is strategically important, but without usage and conversion metrics investors cannot value the app as a true product asset.
    diligencePath: Request monthly app KPI dashboards, cohort retention curves, and attribution splits for app-originated orders by geography and product family.
    relatedQuestionRefs:
    - QE021
    relatedTableRefs:
    - TE002
  - type: private-evidence-only
    severity: material
    topic: manufacturing-footprint
    missingEvidence: Current supplier count, country mix, top-factory concentration, and explicit owned-versus-outsourced production split.
    whyItMatters: Supplier concentration and country exposure are central to operational resilience, compliance risk, and the credibility of sustainability and availability claims.
    diligencePath: Request the current factory list, sourcing allocation by country and tier, and management’s internal concentration thresholds for core families.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: quality-metrics
    missingEvidence: Gross return rate, exchange completion rate, refund cycle-time distribution, and defective-item incidence by product family or courier market.
    whyItMatters: Review complaints show friction, but only internal quality and support metrics can separate anecdotal noise from structural leakage in the product experience.
    diligencePath: Request operations dashboards covering returns, exchanges, courier failures, and quality defects by market, family, and fulfilment partner.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
