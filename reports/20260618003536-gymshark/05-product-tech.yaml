- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Company solution
  - Measurable benefit
  - Limitation
  rows:
  - - Catch limited drops before stockouts
    - Monitor website or email and refresh manually
    - Shopping app push notifications plus app-only access and early releases
    - Think with Google says loyal app users can get Thursday early access via push notifications
    - No public app-open, click-through, or order-share data
  - - Browse and shortlist apparel across categories
    - Search separate category pages and re-find items later
    - Wishlist, personalized recommendations, curated favourites, and saved items in the app
    - Play Store and official app copy indicate intent capture beyond a single session
    - No public evidence on wishlist-to-purchase conversion after redesign
  - - Complete mobile checkout quickly
    - Website checkout with repeated data entry and higher mobile friction
    - Smooth checkout with multiple payment options plus order tracking and click-and-collect / home delivery options
    - Think with Google disclosed a 9% improvement in first-time app-user checkout drop-off after UX changes
    - No public payment-failure rate, fraud rate, or app checkout uptime stats
  - - Train between purchases
    - Use third-party workout content or self-program
    - Training app provides workout library, plans, athlete-led video, custom workouts, and progress logging
    - Creates a repeat-use surface that can deepen brand engagement between shopping sessions
    - No public DAU/MAU, retention, or commerce-lift disclosure
  - - Improve assortment relevance and growth decisions
    - Rely on session-level web analytics and judgment calls
    - GA4-style user-level analytics plus Google Cloud data tooling and merchandising insights
    - Public case study cites 5% product-listing CTR uplift and 30% faster user-journey analysis
    - No public ROI breakdown by tool, market, or team
  - - Resolve returns, exchanges, and faulty-item issues
    - Ad hoc customer-service escalation
    - Dedicated support taxonomy for returns policy, refund timing, exchanges, and faulty items
    - Clear published workflow should reduce ambiguity for customers and ops teams
    - Review platforms still show dissatisfaction with execution speed and support responsiveness
  notes: Benefits are limited to publicly disclosed workflow outcomes; absence of MAU, order-share, and defect-rate metrics prevents clean underwriting of mobile or support economics.
