tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset / product line
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Flex seamless family
    - Women’s training-apparel buyer
    - Active legacy family with live catalog page
    - Signature sculpting, seamless knit, breathable fabric, leggings plus matching bra positioning
    - No public sell-through, return-rate, or margin disclosure by family
  - - Vital seamless family
    - Women’s training and lounge buyer
    - Active seamless family with broad live assortment
    - Spans leggings, tops, vests, padded bras, and shrug formats; public page ties the line to the seamless platform
    - No SKU-level recycled-material or certification detail is visible publicly
  - - Adapt seamless family
    - Performance-focused gym buyer
    - Active and highly merchandised
    - Squat-proof, sweat-wicking positioning and physique-accentuating design features support a distinct premium niche
    - No public repeat-purchase or product-failure metrics by family
  - - Ombre family
    - Legacy seamless buyer
    - Dormant or empty at current fetch
    - Still has a named collection endpoint, which preserves brand memory even without live products
    - Need internal decision on whether Ombre is paused, sunset, or about to relaunch
  - - Training shorts
    - Cross-gender training buyer
    - Active core category
    - Dedicated category with multiple fits and price points keeps Gymshark relevant outside leggings-led missions
    - No public category revenue split or conversion data
  - - Leggings
    - Core women’s buyer
    - Always-on anchor category
    - Broad price ladder and family overlap make leggings the assortment spine
    - No public evidence on fit-return rates or best-seller concentration
  - - Sports bras
    - Women’s support and layering buyer
    - Active core category
    - Support-level, activity, and range filters show a function-led merchandising taxonomy
    - No public bra-support testing, bounce-lab, or wear-test disclosure
  - - Hoodies
    - Warm-up and rest-day buyer
    - Active supporting category
    - Multiple fits and price points extend the brand into non-lift sessions and layering
    - No public data on seasonality or markdown dependence
  - - Accessories
    - Basket-building buyer
    - Active supporting category
    - Standalone accessories catalog supports attach-rate and gifting logic beyond apparel
    - No public attach-rate, return-rate, or margin disclosure
  - - Shopping app
    - Mobile commerce user
    - Live and expanding
    - Combines early access, exclusives, notifications, checkout, order management, and appointments in one surface
    - No public MAU, order-share, or retention metrics
  - - Training app
    - Fitness content user
    - Live but lighter-proof engagement layer
    - Workout library, athlete-led video, custom workouts, and progress logging create a non-commerce touchpoint
    - No public active-user or conversion-into-commerce disclosure
  - - Data platform
    - Internal growth, analytics, and merchandising teams
    - Operational and still evolving
    - User-level analytics plus Google Cloud tooling turn browsing and app behavior into ranking, launch, and forecast inputs
    - Dependency on partner stack and missing public uptime/economics detail
  notes: Status is judged from live collection or product-support surfaces and partner case studies; dormant means publicly visible but not clearly stocked, not necessarily internally discontinued.
