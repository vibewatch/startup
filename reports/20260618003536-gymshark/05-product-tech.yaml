- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Apparel family layer
    - Packages demand into identifiable franchises such as Flex, Vital, Adapt, leggings, bras, shorts, hoodies, and accessories
    - Fresh design cadence, inventory availability, and consistent fit/quality
    - Empty or stale family pages can signal merchandising debt or line fatigue
  - - Website + shopping app surface
    - Captures browsing, wishlist, checkout, appointments, and order-management actions
    - Reliable mobile UX, payment rails, notification infrastructure, and content feeds
    - Peak-event outages or poor app UX directly impair conversion and brand trust
  - - Training app surface
    - Extends interaction into workouts, plans, exercise discovery, and progress logging
    - Content pipeline, athlete programming, and product/engineering upkeep
    - Without public engagement metrics, the training surface may be strategically important but commercially unproven
  - - First-party analytics layer
    - Moves measurement from session counts toward user-level journey analysis and problem detection
    - GA4 implementation, instrumentation quality, and analyst adoption
    - Bad instrumentation or privacy missteps would weaken personalization and decision quality
  - - Google Cloud data platform
    - Runs data warehousing, reporting, real-time analytics, forecasting, and GenAI experimentation
    - BigQuery, Looker, Vertex AI, partner implementation, and internal team fluency
    - Partner concentration and unclear payback economics remain diligence issues
  - - Supplier and traceability layer
    - Supports material sourcing, audits, code-of-conduct enforcement, and claims around recycled inputs and cotton traceability
    - Supplier compliance, Oritain traceability, audit cadence, and factory cooperation
    - Public disclosures are stronger on policy than on SKU-level proof or supplier concentration
  - - Fulfilment and returns layer
    - Moves orders through delivery, returns, exchanges, and refund processing
    - Courier partners, warehouse processing, and customer-support execution
    - Review platforms suggest delivery and refund friction can still leak into perceived product quality
  notes: The architecture mixes consumer-facing software, data infrastructure, and outsourced operating controls because all three layers affect Gymshark’s real product experience.
