companyProfile:
  summary: "Gymshark is a UK-founded direct-to-consumer fitness apparel brand that grew from a 2012 Birmingham garage start-up into a global unicorn. Founded by Ben Francis (aged 19) and Lewis Morgan, the company pioneered influencer-led community marketing in the fitness sector, driving 13 consecutive years of revenue growth to £646m in FY25. General Atlantic acquired a 21% stake in August 2020 at over £1 billion valuation—Gymshark's first-ever external investment—and Ben Francis retains over 70% of equity. The business operates 14 DTC storefronts serving 200+ countries, with a nascent but growing physical retail estate. Pre-tax profit has compressed from £27.8m in FY22 to approximately £7m in FY25, reflecting deliberate investment in omnichannel expansion, technology, and community events. An April 2025 workforce restructure (296 roles at risk, 168 new roles created) signals ongoing operating model evolution."
  foundedDate: "2012-01-01"
  founders:
    - name: "Ben Francis"
      role: "Founder & CEO"
      background: "Started Gymshark aged 19 while studying at Aston University; pioneered fitness influencer marketing; returned as CEO August 2021"
      claimRefs: [CO001, CO002]
    - name: "Lewis Morgan"
      role: "Co-founder (exited 2020)"
      background: "Passive co-founder; exited his stake in full during the 2020 General Atlantic transaction"
      claimRefs: [CO012]
  foundingLocation: "Birmingham, UK"
  headquarters: "Solihull, West Midlands, UK (Blythe Valley Business Park)"
  productSummary: "Performance and lifestyle fitness apparel and accessories for the global conditioning community, including seamless leggings, training shorts, sports bras, hoodies, tracksuits, and gym bags; sold primarily through 14 DTC online storefronts and a small but growing physical retail estate."
  customerFocus: "Gen Z and Millennial (18-35) gym-goers and fitness enthusiasts globally; women represent a growing majority of buyers; secondary segments include older lifestyle-fitness consumers."
  businessModel: "Direct-to-consumer e-commerce (primary channel); supplemented by nascent physical flagship stores; revenue from apparel and accessory sales with no wholesale distribution; all profits reinvested, no dividends."
  stage: "Late-stage private (unicorn, last valued >£1B in August 2020)"
