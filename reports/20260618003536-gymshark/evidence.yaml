evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      An independent post-2020 valuation or secondary transaction price for Gymshark shares, reflecting current revenue
      and EBITDA performance.
    whyItMatters: >-
      Without a current valuation anchor, diligence on return potential, implied multiples, and investment
      attractiveness cannot be properly anchored for 2026.
    diligencePath: >-
      Request latest shareholder register from Companies House (PSC register); engage Gymshark investor relations for
      any secondary market intelligence; consult PitchBook/CBInsights for reported transactions.
    relatedQuestionRefs:
      - QO016
  - type: private-evidence-only
    severity: material
    topic: operating costs
    missingEvidence: >-
      Detailed operating cost breakdown including marketing spend, technology capex, fulfilment cost per unit, and
      headcount cost by function.
    whyItMatters: >-
      Without the cost structure, EBITDA-to-pre-tax profit bridge cannot be independently reconstructed, and the
      sustainability of the margin profile under scaling is unclear.
    diligencePath: >-
      Request management accounts or detailed P&L from Gymshark; analyse the full Companies House statutory accounts
      when FY25 is filed.
    relatedQuestionRefs:
      - QO023
  - type: private-evidence-only
    severity: minor
    topic: governance
    missingEvidence: >-
      Full board composition beyond Ben Francis, Melis Kahya Akar (GA), and the C-suite executive team; governance
      charter, committee structure, and independent director appointments.
    whyItMatters: >-
      Governance quality materially affects risk profile in founder-controlled private companies; absence of independent
      oversight is a diligence flag.
    diligencePath: >-
      Review Companies House PSC register and recent confirmation statements; request the board charter and committee
      terms of reference from management.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
