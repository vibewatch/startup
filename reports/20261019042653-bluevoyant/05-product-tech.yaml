      - ["Regulated-market overlay", "Extends the platform into classified, defense, and compliance-heavy environments", "C-SCRM integrations plus CMMC / Managed XDR heritage", "Need currency checks on accreditations and program boundaries"]
    notes: This condenses menu-level modules, historical external descriptions, and current product pages into an operating model rather than a source-verbatim architecture diagram.
    claimRefs: [CE007, CE008, CE010, CE011, CE013, CE015, CE016]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: BlueVoyant layers Microsoft-centric MDR and new AI workflows on top of external-risk modules, while keeping human services and regulated-market overlays inside the operating model.
    data:
      layers:
        - label: Customer and external inputs
          detail: Telemetry starts with networks, endpoints, attack surface, supply chain, and Microsoft 365 / Defender data plus external risk feeds.
          modules:
            - Networks / endpoints
            - Attack surface + supply chain
            - Microsoft 365 / Defender
        - label: Microsoft operating core
          detail: Current MDR surfaces are explicitly organized around Microsoft-specific services and optimization modules.
          modules:
            - MDR for Microsoft
            - Continuous Optimization for Microsoft Security
            - COMS for Purview
        - label: AI and automation
          detail: BlueVoyant AI adds agentic triage, response actions, and self-service onboarding on top of the core telemetry flow.
          modules:
            - AI-powered managed SOC
            - Self-service agentic SecOps
            - Response agents
        - label: External-risk and vendor workflows
          detail: TPRM and DRP widen the platform from SOC telemetry into vendor posture and external exposure.
          modules:
            - Continuous Monitoring & Remediation
            - Questionnaire Management
            - Brand Protection / Dark Web Watcher
        - label: Human expert layer
          detail: Analysts and professional-services teams stay embedded for remediation, advisory, and incident response.
          modules:
            - 24/7 SOC coverage
            - Strategic Advisory / Offensive Operations
            - DFIR / Proactive Defense
        - label: Regulated-environment overlay
          detail: Government supply-chain and compliance-heavy use cases extend the stack into classified and defense settings.
          modules:
            - C-SCRM
            - Classified-environment integrations
            - CMMC / Managed XDR heritage
    approximationNotes: This stack groups public menu-level modules into an operating model; it is not a vendor-authored system architecture.
    claimRefs: [CE002, CE003, CE004, CE006, CE007, CE008, CE011, CE013, CE015]
callouts:
  - calloutType: strength
    title: Microsoft-centric product depth is the clearest technical moat
    body: >-
      BlueVoyant's best-documented technical advantage is concentrated Microsoft operating depth: current menus
      expose Microsoft-specific MDR and optimization modules, the 2026 AI launch claims more than 2,500
      Microsoft-native deployments behind its playbooks, and the Conquest integration explicitly adds more
      Microsoft control-surface depth.
    claimRefs: [CE002, CE009, CE015]
  - calloutType: risk
    title: Independent proof trails the amount of current roadmap and product detail
    body: >-
      The current pool supports breadth, regulated-market relevance, and staffing seriousness, but most detailed
      claims on AI efficacy, onboarding speed, and platform outcomes still come from BlueVoyant materials.
      Before underwriting product defensibility, diligence should request recent customer references,
      trust/compliance artifacts, and measured response-quality or uptime data.
    claimRefs: [CE006, CE008, CE016]
