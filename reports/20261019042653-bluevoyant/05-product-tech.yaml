      - ["Microsoft control plane", "Core environment for MDR, optimization, and identity-adjacent services", "Customer reliance on Microsoft 365, Defender, Entra, Purview, and related controls", "Platform depth is concentrated around one ecosystem"]
      - ["AI and automation layer", "Runs agentic triage, automated response, and self-service onboarding", "Playbooks, response agents, and tuned workflows informed by prior deployments", "Current efficacy claims are mostly company-issued"]
