      diligencePath: Request recent reference customers, operating metrics such as MTTR / false-positive reduction, and any public or customer-shareable trust / status documentation.
      relatedQuestionRefs: [QE008]
    - type: private-evidence-only
      severity: material
      topic: pricing-and-adoption
      missingEvidence: Current pricing structure, deployment mix between managed and self-service AI, and attach rates across MDR, TPRM, and DRP.
      whyItMatters: Monetization and cross-sell depth affect both product stickiness and the economic value of BlueVoyant's suite strategy.
      diligencePath: Request current SKU sheets, win/loss commentary, and product-level customer counts by module.
