chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与经营足迹
        blocks:
          - type: paragraph
            body: >-
              即使部分经营指标尚不清楚，BlueVoyant 当前的公开身份仍然明确。公司材料一贯将业务定位在纽约，并将成立年份定为 2017
              年；官网则把平台定位在托管检测与响应、第三方风险管理、数字风险保护和专业服务。相同的官方页面还把公司描述为已经具备相当规模、而非尚未商业化的企业，引用了超过 600 名员工、广泛的办公室覆盖和深入的
              Microsoft 体系部署说法。真正难判断的不是 BlueVoyant 是否已经进入相关市场，而是其规模叙事有多少得到独立佐证，又有多少仍依赖公司发布或合作伙伴放大的数字。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO016
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO010
              - CO012
              - CO014
              - CO015
              - CO016
      - number: '1.2'
        title: 领导层、治理与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              BlueVoyant 仍是审计披露有限的私人公司，因此领导层连续性比上市同业更重要，管理层变动的影响也更大。最近最明确的变化是 2026 年 5 月 CEO 从联合创始人 Jim Rosenthal 交接给
              John Hernandez；Rosenthal 留任董事长，Tom Glocer
              转任副董事长。这一组合既显示创始人影响力仍在延续，也意味着机构记忆可能集中在少数高级领导者身上。较早的履历材料仍可用于了解职位历史和高管深度，但投资者应将其视为背景资料，不能替代当前组织架构、董事会委员会分工图或书面继任计划。
            claimRefs:
              - CO001
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO007
              - CO008
              - CO009
      - number: '1.3'
        title: 融资里程碑与更新风险
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，在当前领导层交接前，公司一直在扩大平台范围。公开材料支持 2023 年收购 Conquest Cyber、同期完成相关的 E 轮融资，以及 2024 年 7 月推出 Cyber Defense
              Platform，定位是整合内部、外部和供应链防御。材料也支持公司继续拓展欧洲业务，并显示公司目前仍为私人企业、没有官方 IPO
              时间表。尚未解决的是总体资本历史：可获得的来源对累计融资额甚至当前员工规模都存在分歧，因此后续估值和财务章节不能在未完成一级资料核对前，直接沿用本章的融资额或员工数。
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
