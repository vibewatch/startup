              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: 增长驱动、约束与尽调含义
        blocks:
          - type: paragraph
            body: >-
              证据池中最强的采用驱动是整合：BlueVoyant 承诺用一个运营层覆盖内部网络、第三方和外部数字风险面；其 Microsoft 专用模块也让公司更容易切入已经标准化使用该技术栈的企业。收购 Conquest
              Cyber 同样针对国防和政府环境，在这些环境中，合规和风险成熟度要求可能形成明确的采购触发点。约束也同样清楚：Tracxn 列出 345
              个竞争者，意味着竞争噪声很大；公开规模说法较为滞后；现有证据无法独立证明新 AI 定位的价格、ROI
              或转化率。服务加订阅的模式，以及运营、工程、销售和客户成功岗位同时招聘，也说明实施过程高度依赖信任。因而，市场信心在方向上偏正面，但对估值仍不完整。
            claimRefs:
              - CM001
              - CM009
              - CM010
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 例证
        blocks:
          - type: callout
            title: 融合扩大预算池，而不只是功能清单
            body: >-
              当一个买方希望在同一运营模式下同时覆盖内部 SOC、第三方风险监控和外部数字风险响应时，BlueVoyant
              的市场逻辑最有说服力。融合扩大了潜在预算负责人的范围，但也意味着销售过程依赖跨职能协同，而不是单一工具续约。
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM012
              - CM013
          - type: callout
            title: 市场规模仍是尽调事项，不是已闭合的答案
            body: 证据池支持真实需求和品类相关性，但没有提供独立的美元 TAM，也没有核对一致的当前客户数。因此在估值工作中，市场逻辑仍应视为受证据约束，直到管理层或第三方数据集补上这些缺口。
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM009
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合以 MDR 同业和内部 SOC 替代方案为中心
        blocks:
          - type: paragraph
            body: >-
              独立品类分析将 BlueVoyant 放在托管检测与响应的服务运营模式中，而不是单点安全工具中。因此，实际决策集合包括其他 MDR 服务商、内部 SOC 加 SIEM 的现状，以及相邻的 XDR
              软件路径，而不只是逐项比较产品功能。Gartner Peer Insights 在现有证据中给出了最明确的点名清单：Bitdefender、Cisco Systems 和 CrowdStrike 都被列为购买
              BlueVoyant 前考虑过的替代方案，但同一证据包没有提供这些竞争者的直接产品、价格或赢单率细节。因此，本章最稳妥的表述是按类别描述竞争，并辅以少量点名信号，而不是给出确定的正面对决排名。
            claimRefs:
              - CP001
              - CP002
              - CP009
              - CP015
              - CP016
