        title: 资本需求与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              现有证据中最清晰的资本信号，是 BlueVoyant 在 2023 年 11 月披露其在收购 Conquest Cyber 的同时完成了超过 $140 million 的 E
              轮融资。这显示公司愿意且能够为平台战略扩张提供资金，尤其是进入受监管和政府网络风险项目；但它没有回答前瞻性的投资判断问题。现有公开证据仍未披露当前收入、毛利率、现金、烧钱、债务或现金跑道。同时，竞争者比较页面和合作伙伴撰写的公司简介也提醒我们，公开市场定位和外部宣传材料可能有选择性或已经过时，因此下一阶段尽调必须依赖管理层一级数据，而不是从营销页面外推。
