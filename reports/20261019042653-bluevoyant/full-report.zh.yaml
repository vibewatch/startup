      - number: '8.2'
        title: 投资论点、反论点与情景
        blocks:
          - type: paragraph
            body: >-
              投资论点是：客户规模、整合式 MDR/TPRM/DRP 方案，以及受监管和政府相关工作流敞口，可能支撑持久的企业价值。Conquest Cyber 收购增加了风险态势和合规能力，BlueVoyant 2023
              年的 Deloitte Fast 500 公告则提供了历史增长信号。反论点是：这些大多是公司发布的指标和回溯性里程碑，无法披露当前
              ARR、收入增长、毛利率、留存、现金消耗或客户集中度。公开来源也没有提供收入质量和期间相匹配、可用于模型的交易或上市可比公司。因此，乐观、基准和悲观情景都必须保留条件性，不能凭空附加估值区间：乐观情景要求验证盈利增长，基准情景维持跟踪姿态，悲观情景则由经济性疲弱、优先权悬置或流动性周期过长触发。
            claimRefs:
              - CV001
