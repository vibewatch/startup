      - number: '3.2'
        title: 差异化来自套件宽度、Microsoft 能力和受监管行业可信度
        blocks:
          - type: paragraph
            body: >-
              BlueVoyant 的公开定位不止一条 MDR 产品线。官方页面将 MDR、第三方风险管理、数字风险保护、专业服务和 BlueVoyant

              AI 放在同一体系下；英国网站和收购材料则强调多次获得 Microsoft 认可，以及 Conquest Cyber 带来的受监管市场扩张。这种组合在竞争上有意义，因为它让 BlueVoyant 能够主张比单工具
              XDR 厂商更宽的控制点，又比通用 MSSP 更专业。证据最充分的细分市场，是既需要托管运营又需要相邻风险产品的 Microsoft 核心型或受监管买方；公开证据最薄弱的地方，则是这种宽度能否匹敌
              Microsoft 生态之外最强的多信号 MDR 领导者。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP006
              - CP007
              - CP010
              - CP015
              - CP016
      - number: '3.3'
        title: 商业结构偏向顾问式、伙伴支持的企业销售
        blocks:
          - type: paragraph
            body: >-
              现有证据显示其商业动作偏顾问式，而非自助式。RFP Wiki 描述了按终端定制的 MDR 价格，另有独立的平台许可依赖和多个附加模块；BlueVoyant
              自己的网站则强调申请演示、客户登录和合作伙伴登录，而不是透明结账。合作伙伴与咨询渠道进一步印证了这种企业销售模式：经销商页面通过合作关系销售
              BlueVoyant，第三方目录则明确提供替代方案比较和条款谈判协助。这种结构能支撑更大、更复杂的交易，但也增加了尽调摩擦，因为公开渠道很难核实标价、折扣和范围边界。
            claimRefs:
              - CP008
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP010
              - CP011
              - CP012
              - CP016
      - number: '3.4'
        title: 持久性取决于平台宽度能否在 Microsoft 核心优势区之外兑现
        blocks:
          - type: paragraph
            body: >-
              最站得住脚的乐观判断是，BlueVoyant 正从 MDR 服务商走向更广泛的网络运营平台，具备受监管行业的态势能力和足够规模来赢得企业客户。反向证据也很清楚：独立分析认为，在
              Microsoft/Sentinel 和 Splunk 核心领域之外，其覆盖仍窄于一些多信号 MDR
              领导者；公开评论数量有限；价格仍不透明，买方在评估竞争壁垒前仍需要演示、客户推荐和协商范围审查。这并不否定产品，但意味着商品化和在位者反击风险仍然存在。
            claimRefs:
              - CP007
              - CP010
              - CP015
              - CP016
      - number: '3.5'
        title: 例证
        blocks:
          - type: callout
            title: BlueVoyant 证据最充分的切入点是 Microsoft 加相邻网络风险模块
            body: 现有证据最清楚地支持 BlueVoyant 在以下场景中的定位：Microsoft 能力、托管服务交付，以及 TPRM/DRP/监管态势需要同时存在。相比只靠最低摩擦的 MDR 采购取胜，这是更强的切入点。
            calloutType: insight
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP014
          - type: callout
            title: 公开证据薄于平台叙事
            body: 平台叙事很宽，但独立证据对点名竞争者比较、实际价格和评论数量仍然不足，因此商品化与在位者反击风险高于套件叙事所暗示的水平。
            calloutType: risk
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP015
              - CP016
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开商业牵引
        blocks:
          - type: paragraph
            body: >-
