    approximationNotes: 层级顺序反映有证据支撑的邻接关系和买方触达范围，而非市场规模；由于指定来源池没有可比的支出估计，每个数值都仍未量化。
    claimRefs:
      - CM008
      - CM011
      - CM012
      - CM013
      - CM014
      - CM016
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 该序数图展示了与 BlueVoyant 竞争的主要解决方案类别，维度是套件广度与供应商主导的运营所有权。
    data:
      xAxis:
        label: 解决方案广度
        min: 1
        max: 5
        lowLabel: Narrow / single-lane
        highLabel: Multi-suite / platform-led
      yAxis:
        label: 供应商主导的运营所有权
        min: 1
        max: 5
        lowLabel: Customer-run / tool-led
        highLabel: Managed outcomes / service-led
      points:
        - label: BlueVoyant
          x: 4.5
          'y': 4.5
          note: 官方证据覆盖 MDR、TPRM、DRP、专业服务、AI，以及 Conquest 强化的受监管市场能力。
        - label: 多信号 MDR 领导者
          x: 4.7
          'y': 4.2
          note: 独立证据显示，其在 SaaS、NDR 和 OT 上的基础覆盖范围比 BlueVoyant 更广。
        - label: 仅工具型 XDR / 单点控制
          x: 2.1
          'y': 1.3
          note: RFP Wiki 区分了软件平台采购与由分析师主导运营的 MDR。
        - label: 内部 SOC + Microsoft Sentinel
          x: 3
          'y': 1.4
          note: BlueVoyant 可以在客户的 Sentinel 租户中运行，因此这仍是一条真实的替代路径。
        - label: 内部 SOC + Splunk
          x: 3
          'y': 1.4
          note: Splunk 是独立证据中明确点名的另一种 BlueVoyant 核心交付环境。
        - label: 受监管行业态势专家
          x: 3.6
          'y': 3
          note: Conquest 风格的合规和风险成熟度专家，在 DIB 和政府用例中构成最直接的竞争。
    approximationNotes: 坐标是根据指定来源综合得出的、有证据支撑的序数评分；它们表达按解决方案类别划分的相对位置，不是经过测量的市场份额或赢单率数据。
    claimRefs:
      - CP001
      - CP004
      - CP007
      - CP010
  - id: FI001
    title: 公开收入模型桥接
    type: flow
    summary: 公开证据展示了 BlueVoyant 如何把广泛的网络防御需求转化为可变现项目，但价格和利润率机制仍未披露。
    data:
      nodes:
        - label: 客户需求
          detail: 受监管企业和公共部门买方需要持续覆盖内部、外部及供应商风险。
          claimRefs:
            - CI001
            - CI007
        - label: 商业报价
          detail: BlueVoyant 将 MDR、TPRM、DRP 和相邻服务打包成持续性项目，但公开来源没有披露价目表或合同经济性。
          claimRefs:
            - CI001
            - CI012
        - label: 服务交付
          detail: SOC 运营、全球招聘，以及 Microsoft 联邦和渠道岗位，都指向一个由人力支撑的交付引擎，而非纯自助式软件模式。
          claimRefs:
            - CI003
            - CI004
            - CI005
        - label: 客户价值代理指标
          detail: 公开的 MDR 案例研究称，某代表性企业实现了 210% ROI、$3.9 million NPV、升级告警减少 90%，以及解决速度提高 70%。
          claimRefs:
            - CI008
            - CI009
            - CI010
        - label: 利润率驱动因素
          detail: 毛利可能取决于自动化杠杆、分析师利用率和跨模块销售，但公开证据没有量化其中任何一项。
          claimRefs:
            - CI005
            - CI013
        - label: 资本 / 投资判断缺口
          detail: 公开证据披露了过往收购融资，但没有披露当前收入、现金消耗、债务或现金跑道。
          claimRefs:
            - CI006
            - CI013
    claimRefs:
      - CI001
      - CI005
      - CI006
      - CI008
      - CI009
      - CI010
      - CI012
      - CI013
  - id: FE001
    title: 产品架构图
    type: stack
    summary: BlueVoyant 在外部风险模块之上叠加以 Microsoft 为中心的 MDR 和新的 AI 工作流，同时把人工服务和受监管市场覆盖纳入运营模式。
    data:
      layers:
        - label: 客户与外部输入
          detail: 遥测从网络、终端、攻击面、供应链和 Microsoft 365 / Defender 数据开始，同时接入外部风险源。
          modules:
            - 网络 / 终端
            - 攻击面 + 供应链
            - Microsoft 365 / Defender
        - label: Microsoft 运营核心
          detail: 当前 MDR 功能明确围绕 Microsoft 专属服务和优化模块组织。
          modules:
            - 面向 Microsoft 的 MDR
            - Microsoft Security 持续优化
            - Purview 的 COMS
        - label: AI 与自动化
          detail: BlueVoyant AI 在核心遥测流之上增加智能体分诊、响应动作和自助式入门。
          modules:
            - AI 驱动的托管 SOC
            - 自助式智能体 SecOps
            - 响应智能体
        - label: 外部风险与供应商工作流
          detail: TPRM 和 DRP 将平台从 SOC 遥测扩展到供应商态势和外部暴露面。
          modules:
            - 持续监控与修复
            - 问卷管理
            - 品牌保护 / 暗网观察器
        - label: 人工专家层
          detail: 分析师和专业服务团队继续参与修复、咨询和事件响应。
          modules:
            - 24/7 SOC 覆盖
            - 战略咨询 / 攻击行动
            - DFIR / 主动防御
        - label: 受监管环境覆盖层
          detail: 政府供应链和高合规要求用例将技术栈延伸至机密和国防场景。
          modules:
            - C-SCRM
            - 机密环境集成
            - CMMC / 托管式 XDR 传统能力
    approximationNotes: 该技术栈把公开的菜单级模块归入一个运营模式；它不是供应商编写的系统架构。
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE006
      - CE007
      - CE008
      - CE011
      - CE013
      - CE015
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据显示，这是一条由企业主导的路径：从受监管或高度依赖 Microsoft 的安全需求开始，经由直销或合作伙伴渠道落地，并仅在 BlueVoyant 能证明交付深度时扩展。
    data:
      items:
        - label: 安全触发点
          actor: CISO / 安全负责人
          stage: 识别需求
          channel: 直接需求或合作伙伴转介
          touchpoints:
            - 托管检测与响应
            - 第三方网络风险管理
            - 数字风险保护
          detail: 公开材料将初始需求定位为：为复杂或人手不足的组织提供统一网络防御。
        - label: 评估路径
          actor: 企业买方及经销商 / 联邦渠道
          stage: 评估
          channel: 客户经理、精选 VAR 和合作伙伴网络
          touchpoints:
            - 风险产品售前工程
            - 联邦客户高管拓展
          detail: 可见的市场进入路径结合了企业直销和合作伙伴协助覆盖。
        - label: 初始部署
          actor: SOC 与 Microsoft 安全团队
          stage: 部署
          channel: 托管服务或自助式平台
          touchpoints:
            - 面向 Microsoft 的 MDR
            - Microsoft 原生部署
            - BlueVoyant AI 入门
          detail: 面向 Microsoft 的部署，是指定来源池中最清晰的公开既有客户基础证据。
        - label: 运营支持
          actor: 客户成功与 SOC 团队
          stage: 服务交付
          channel: 区域 SOC 与客户成功覆盖
          touchpoints:
            - Leeds / 匈牙利 / 爱尔兰 SOC 覆盖
            - 客户成功经理招聘
            - 安全运营中心经理招聘
          detail: 支持投入似乎仍在多个地域和职能岗位上持续。
        - label: 扩张路径
          actor: 客户安全负责人
          stage: 扩张
          channel: 向 AI、TPRM、政府和合规工作流交叉销售
          touchpoints:
            - BlueVoyant AI
            - Conquest / CMMC 路径
            - 英国 DFIR 和 GRC 服务
          detail: 扩张似乎扎根于相邻安全模块和受监管环境工作流。
        - label: 续约证据缺口
          actor: 投资人 / 尽调团队
          stage: 持续性检查
          channel: 公开尽调
          touchpoints:
            - 匿名案例研究
            - 公开评价数量有限
            - 没有公开 NRR / 流失披露
          detail: 公开记录更能支持采用情况，而不能充分支持留存、集中度或队列持续性。
    approximationNotes: 各阶段综合了公开证据链；它们展示可观察的客户路径及其缺口，而不是公司披露的漏斗。
    claimRefs:
      - CU002
      - CU003
      - CU009
      - CU010
      - CU011
      - CU015
      - CU016
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最高的剩余风险集中在披露不透明、受监管交付的整合，以及对 Microsoft 关联市场进入路径的依赖。
    data:
      columns:
        - label: 可能性
          note: 根据保留的公开证据评估概率，而不是基于内部 KPI 访问。
        - label: 影响
          note: 对投资判断质量和运营执行的潜在影响。
        - label: 缓释成熟度
          note: 有公开证据支持的缓释成熟度，不仅是管理层表述。
      rows:
        - label: 融资 / 披露不透明
          note: 公开融资历史相互矛盾，且经审计的运营披露有限。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: critical
            - label: 低
              tone: low
              note: 公开缓释措施弱于披露缺口。
        - label: Conquest 整合 / 受监管交付
          note: 更广泛的 DIB、政府和合规态势增加了执行负担。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 中
              tone: medium
        - label: Microsoft 生态依赖
          note: BlueVoyant 的公开叙事反复依赖 Microsoft 的认可和解决方案契合度。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 中
              tone: medium
        - label: 领导层交接
          note: 公司强调 AI 驱动增长和全球扩张之际，CEO 发生了变更。
          values:
            - label: 中
              tone: medium
            - label: 中
              tone: medium
            - label: 中
              tone: medium
        - label: 欧洲 SOC 扩张
          note: 新增及规划中的 SOC 产能应改善覆盖，但也增加协调负担。
          values:
            - label: 中
              tone: medium
            - label: 中
              tone: medium
            - label: 中
              tone: medium
        - label: 分散式招聘与服务广度
          note: SOC、联邦、工程和客户成功职能均在招聘，说明协调需求广泛。
          values:
            - label: 中
              tone: medium
            - label: 中
              tone: medium
            - label: 中
              tone: medium
    approximationNotes: 热力图色调是根据保留证据综合得出的分析评级，不是公司引用的评分。
    claimRefs:
      - CR004
      - CR007
      - CR011
      - CR013
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 运营证据支持继续尽调，但价格、经济性和流动性证据缺失，使建议只能停留在观察。
    data:
      nodes:
        - id: scale
          label: 运营规模
          value: Company reports more than 1,000 customers
          claimRefs:
            - CV001
        - id: breadth
          label: 平台广度
          value: Internal, external, and supply-chain defense
          claimRefs:
            - CV002
        - id: financing
          label: 融资证据
          value: More than $140M Series E disclosed in 2023
          claimRefs:
            - CV003
        - id: conflict
          label: 数据冲突
          value: External cumulative funding figures do not reconcile
          claimRefs:
            - CV006
            - CV007
        - id: liquidity
          label: 流动性缺口
          value: No announced IPO timeline or current valuation disclosure
          claimRefs:
            - CV004
            - CV005
        - id: decision
          label: 观察
          value: Require audited metrics, cap table, and price support
          claimRefs:
            - CV014
            - CV015
            - CV016
      edges:
        - from: scale
          to: breadth
          label: 规模使平台广度值得尽调
        - from: breadth
          to: financing
          label: 更广的范围伴随收购融资
        - from: financing
          to: conflict
          label: 累计历史仍未核对
        - from: conflict
          to: liquidity
          label: 不透明阻碍可靠的价格发现
        - from: liquidity
          to: decision
          label: 缺失的下行输入限制信心
    approximationNotes: 该流程是定性分析，不推断估值、回报、转化率或超出所述建议逻辑的因果关系。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV009
      - CV014
      - CV015
      - CV016
