        title: 财务模型风险与止损标准
        blocks:
          - type: paragraph
            body: >-
              最尖锐的财务模型风险是：当前公开来源既无法核对 BlueVoyant 的融资历史，也没有提供经审计的经营指标，投资者因此无法把增长势头转化为投资确信。AlleyWatch 在 2023 年 12
              月的采访称，公司完成了 E 轮融资，累计融资达到 $665.5 million；而 FundedIQ 在 2026 年 10 月的公司简介仍只记录了两轮合计 $318 million，最后一轮是 2022 年 2
              月的 D 轮。与此同时，证据池中最强的增长信号——Deloitte Fast 500 排名、客户从超过 900 家增至超过 1,000
              家，以及地理范围扩张带来的招聘——仍主要由公司发布。由此，实际止损标准是可量化的：如果尽调无法核对轮次历史、现金与烧钱、客户集中度、平台可靠性以及
              Microsoft/渠道依赖，公司就仍应是跟踪或继续研究对象，而不是可以直接完成投资判断的标的。
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR006
              - CR008
              - CR009
              - CR012
              - CR013
      - number: '7.5'
        title: 例证
        blocks:
          - type: callout
            title: 不透明度是投资判断的首要风险
            body: 最大风险不是缺乏野心或客户证明，而是 BlueVoyant 的规模叙事与验证融资时间线、当前现金状况、客户集中度和受监管交付控制所需的有限独立/公开数据之间存在缺口。
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR012
              - CR013
          - type: callout
            title: 在形成价格敏感型判断前设定明确止损标准
            body: 在把后期轮次评估为值得买入、而不是继续观察前，应要求核对融资历史和当前现金跑道、按行业划分的客户集中度与留存、当前信任/合规状态证据，以及量化的 Microsoft/渠道敞口。
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR010
              - CR011
              - CR013
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              BlueVoyant 值得继续尽调，而不是直接否定：公司发布的两份 2024 年和 2026 年公告都称客户超过 1,000
              家，当前平台覆盖内部、外部和供应链防御。这些事实说明它是一家规模化运营公司，而不是早期产品试验。但它们并不能验证入场价格。IPOs.fyi 在 2026 年 4 月报道称，BlueVoyant
              仍是私人公司，没有公布 IPO 时间表，估值细节也没有广泛披露。公开融资记录同样难以核对：官方 2023 年公告披露了与收购 Conquest Cyber 相关、超过 $140 million 的 E
              轮融资，而两个外部页面给出的累计融资额和时间范围明显不同。因此，投资姿态应继续保持跟踪；只有在核实当前估值、经审计经营指标、完全稀释后股权结构和优先权条款后，才考虑升级判断。
