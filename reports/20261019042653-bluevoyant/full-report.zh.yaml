      - number: '2.3'
        title: 买方、用户与预算归属
        blocks:
          - type: paragraph
            body: >-
              来源暗示的买方地图比纯软件销售更宽。BlueVoyant 的产品导航围绕托管检测与响应、Microsoft 优化和第三方风险流程展开，Multiples
              则将收入模式描述为服务与订阅的组合。实际预算负责人可能包括安全运营负责人、Microsoft 技术栈负责人、第三方风险团队，以及政府或国防项目运营方；分析师和响应团队则是日常用户。CIO Bulletin
              还将公司描述为既服务大型企业，也服务无法自行搭建同等能力的小型组织，进一步说明其采用路径偏向服务驱动，而不是狭窄的纯企业软件销售。
            claimRefs:
              - CM002
              - CM003
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
