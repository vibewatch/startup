      - number: '1.4'
        title: 对后续章节的尽调含义
        blocks:
          - type: paragraph
            body: >-
              本报告其余部分较可靠的事实基础包括公司身份、产品范围、广泛的经营相关性、2023 年收购、2024 年平台整合和 2026
              年领导层变动。较不可靠的是投资者评估一家后期网络平台时通常最想知道的精确商业化规模：累计融资额、当前是否达到独角兽估值、付费客户定义和准确员工数。由于连较为友好的外部资料彼此也有冲突，后续章节应将公开规模数字视为区间或方向性信号，除非能追溯到更直接的证据。这一点对估值尤其重要：私人公司信息不透明时，一个看似精确的数字可能比明确记录的缺口更具误导性。
            claimRefs:
              - CO004
              - CO005
              - CO014
              - CO015
              - CO016
      - number: '1.5'
        title: 例证
        blocks:
          - type: callout
            title: 身份扎实，精度有限
            body: BlueVoyant 的存在、所属类别、地理位置、领导层变动和主要里程碑都容易核实，但其确切的后期规模并不清楚。因此，本章适合用于定位公司和梳理里程碑顺序，但对收入相关或估值相关指标的精确判断，只能算部分可靠。
            calloutType: insight
            claimRefs:
              - CO001
              - CO007
              - CO009
              - CO016
          - type: callout
            title: 指标冲突是概览阶段的主要风险
            body: 公司概览阶段最大的风险，不是证据池中出现了某个明显的生死事件，而是私人公司信息不透明，加上公开数字在累计融资额、客户数和员工数上彼此不一致。后续财务和估值工作应保留这些冲突，而不是将其平滑掉。
            calloutType: risk
            claimRefs:
              - CO004
              - CO005
              - CO014
              - CO015
              - CO016
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相邻支出
        blocks:
          - type: paragraph
            body: >-
              证据池支持将 BlueVoyant
              的市场定义为融合式网络防御运营层，而不是单一软件品类。官方来源和市场数据一贯将公司覆盖范围放在托管检测与响应、第三方及供应链风险、数字风险保护，以及更广义的态势或主动防御服务上。这个边界很重要：相关买方从 SOC
              扩展到供应商风险、合规和公共部门网络项目；但这也意味着不能把 BlueVoyant 按“全部网络安全”支出计算。相邻的终端工具、通用采购软件和无关的联邦 IT 服务是替代方案或渠道，不是有证据支持的纳入支出。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM013
      - number: '2.2'
        title: 受证据约束的规模测算与采用视角
        blocks:
          - type: paragraph
            body: >-
              证据池中没有来源能为 BlueVoyant 的具体组合——MDR、第三方风险、数字风险和以 Microsoft 为核心的托管服务——单独给出可信的美元 TAM、SAM 或
              SOM，因此本章只能改用采用情况来衡量需求。这些视角仍有用：公司公开声称 2024 年年中客户超过 1,000 家、2023 年末客户超过 900 家，招聘页面称业务覆盖超过 20 个国家；Tracxn
              显示竞争者众多，Deloitte Fast 500 入选资格只能提供历史收入下限，不能代表当前收入。合起来，这些信号支持一个可信的跨国机会，但无法确定当前客户基数或按支出计算的市场上限。
            claimRefs:
