              - CV016
      - number: '8.3'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              退出准备度有可能，但尚未证实。BlueVoyant 在 2026 年 5 月任命 John Hernandez 为
              CEO，并明确要求其扩大平台规模；招聘页面显示，公司仍在美国、英国、罗马尼亚、菲律宾和爱尔兰招聘技术、客户成功、销售和联邦岗位。这些是积极的经营信号，不是准备 IPO
              或即将产生流动性的证据。决定性尽调材料应包括一份载明所有优先权条款的当前股权结构表、经审计的 2025-2026 年收入与 ARR 桥接、按服务线划分的毛利率、NRR
              与客户群留存、现金余额与烧钱、客户集中度，以及任何近期二级交易定价。在管理层能将这些指标与统一平台叙事连接起来前，不应按战略退出或公开市场退出进行投资判断。即使产品宽度仍可信，如果无法核对累计融资、提供优先权瀑布或证明持久增长，投资论点也会失效。
            claimRefs:
