    title: Company milestone timeline
    type: timeline
    summary: >-
      BlueVoyant's public milestones cluster around founding, financing, platform consolidation, European operating
      expansion, and the 2026 CEO transition.
    data:
      items:
        - date: '2017'
          label: Founded in New York
          detail: Company and third-party profiles date BlueVoyant's founding to 2017 and place headquarters in New York.
          tone: positive
          claimRefs:
            - CO001
            - CO002
        - date: '2021'
          label: Series C appears in tracker history
          detail: >-
            IPOs.fyi describes Series C as completed in 2021, which is useful chronology but not enough to reconcile
            total capital raised.
