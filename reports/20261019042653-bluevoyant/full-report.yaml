        title: Operating model, telemetry, and deployment
        blocks:
          - type: paragraph
            body: >-
              The most specific current operating evidence centers on BlueVoyant AI and government supply-chain risk.
              BlueVoyant AI is presented as a dual-mode operating layer: customers can buy a managed SOC backed by
              BlueVoyant analysts or use the same agentic workflows as self-service software, with Microsoft 365,
              Defender, and related tools positioned as fast onboarding points. The government C-SCRM surface adds a
              complementary outside-in data model that emphasizes large external feed coverage, supplier mapping, and
              integration into internal or classified environments. Together, those surfaces imply a platform logic in
              which telemetry aggregation, analyst validation, and automation coexist rather than replacing one another,
              with humans still materially embedded in remediation and regulated-market delivery.
