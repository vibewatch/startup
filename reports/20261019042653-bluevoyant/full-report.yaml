chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating footprint
        blocks:
          - type: paragraph
            body: >-
              BlueVoyant's current public identity is clear even if some operating metrics are not. Company materials
              consistently anchor the business in New York and date its founding to 2017, while the homepage positions
              the platform around managed detection and response, third-party risk management, digital risk protection,
              and professional services. Those same official pages also present the company as materially scaled rather
              than pre-commercial, citing more than 600 employees, broad office coverage, and deep Microsoft-centric
              deployment claims. The more difficult issue is not whether BlueVoyant has reached relevance, but how much
              of the scale story is independently corroborated versus still dependent on company-issued or
              partner-amplified numbers.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO016
