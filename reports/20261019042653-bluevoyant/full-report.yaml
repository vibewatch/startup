  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence suggests an enterprise-led motion that starts with regulated or Microsoft-heavy security needs,
      lands through direct or partner channels, and expands only where BlueVoyant can prove delivery depth.
    data:
      items:
        - label: Security trigger
          actor: CISO / security leadership
          stage: Need identification
          channel: Direct demand or partner referral
          touchpoints:
            - Managed detection and response
            - Third-party cyber risk management
            - Digital risk protection
          detail: >-
            Public materials frame the initial need around unified cyber defense for complex or understaffed
            organizations.
        - label: Evaluation motion
          actor: Enterprise buyer plus reseller / federal channel
          stage: Evaluation
          channel: Account specialists, select VARs, and partner network
          touchpoints:
            - Risk-product sales engineering
            - Federal client executive motion
          detail: The visible route to market combines direct enterprise selling with partner-assisted coverage.
        - label: Initial deployment
          actor: SOC and Microsoft security teams
          stage: Deployment
          channel: Managed service or self-service platform
          touchpoints:
            - MDR for Microsoft
            - Microsoft-native deployments
            - BlueVoyant AI onboarding
          detail: Microsoft-oriented deployments are the clearest public installed-base proof in the assigned pool.
        - label: Operational support
          actor: Client success and SOC teams
          stage: Service delivery
          channel: Regional SOCs and customer-success coverage
          touchpoints:
            - Leeds / Hungary / Ireland SOC footprint
            - Client Success Manager hiring
            - Manager, Security Operations Center hiring
          detail: Support investment appears ongoing across multiple geographies and functional roles.
        - label: Expansion path
          actor: Customer security leaders
          stage: Expansion
          channel: Cross-sell into AI, TPRM, government, and compliance workflows
          touchpoints:
            - BlueVoyant AI
            - Conquest / CMMC motion
            - UK DFIR and GRC services
          detail: Expansion seems anchored in adjacent security modules and regulated-environment workflows.
        - label: Renewal proof gap
          actor: Investor / diligence team
          stage: Durability check
          channel: Public diligence
          touchpoints:
            - Anonymized case studies
            - Thin public review volume
            - No public NRR / churn disclosure
          detail: The public record supports adoption better than it supports retention, concentration, or cohort durability.
    approximationNotes: >-
      Stages synthesize the public evidence trail; they illustrate the observable customer motion and its gaps rather
      than a company-disclosed funnel.
    claimRefs:
      - CU002
      - CU003
      - CU009
      - CU010
      - CU011
      - CU015
      - CU016
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Highest residual exposure clusters around disclosure opacity, integration into regulated delivery, and
      Microsoft-linked go-to-market dependence.
    data:
      columns:
        - label: Likelihood
          note: Probability based on retained public evidence rather than internal KPI access.
        - label: Impact
          note: Potential effect on underwriting quality and operating execution.
        - label: Mitigation maturity
          note: Publicly evidenced mitigation maturity, not management assertions alone.
      rows:
        - label: Financing / disclosure opacity
          note: Conflicting public funding histories and limited audited operating disclosure.
          values:
            - label: High
              tone: high
            - label: High
              tone: critical
            - label: Low
              tone: low
              note: Public mitigants are weaker than the disclosure gap.
        - label: Conquest integration / regulated delivery
          note: Broader DIB, government, and compliance posture raises execution burden.
          values:
            - label: Medium
              tone: medium
            - label: High
              tone: high
            - label: Medium
              tone: medium
        - label: Microsoft ecosystem dependence
