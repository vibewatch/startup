      - number: '1.4'
        title: Diligence implications for later chapters
        blocks:
          - type: paragraph
            body: >-
              For the rest of the report, the dependable ground truth is identity, product scope, broad operating
              relevance, the 2023 acquisition, the 2024 platform consolidation, and the 2026 leadership change. The less
              dependable layer is the exact commercialization scale that investors would normally want for underwriting
              a late-stage cyber platform: lifetime capital raised, any current unicorn valuation, paying-customer
              definitions, and precise headcount. Because even friendly external references conflict with one another,
              later chapters should treat public scale numbers as ranges or directional signals unless they can be tied
              to more primary evidence. That is especially important for valuation work, where private-company opacity
              can make a clean-looking figure more misleading than a documented gap.
            claimRefs:
              - CO004
              - CO005
              - CO014
              - CO015
              - CO016
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Solid identity, soft precision
            body: >-
              BlueVoyant's existence, category, geography, leadership transition, and major milestones are easy to
              verify, but its exact late-stage scale is not. That makes this chapter reliable for orientation and
              milestone sequencing, but only partly reliable for underwriting exact revenue-adjacent or
              valuation-adjacent metrics.
            calloutType: insight
            claimRefs:
              - CO001
              - CO007
              - CO009
              - CO016
          - type: callout
            title: Metric conflict is the main overview risk
            body: >-
              The biggest company-overview risk is not a visible existential event in the assigned pool; it is the
              combination of private-company opacity and internally inconsistent public numbers around total capital
              raised, customer count, and employee count. Later financial and valuation work should preserve those
              conflicts rather than smoothing them away.
