  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set centers on MDR peers and in-house SOC substitutes
        blocks:
          - type: paragraph
            body: |-
              Independent category analysis places BlueVoyant in managed detection and response as a
              service operating model, not as a point security tool, so the practical decision set includes
              other MDR providers, internal SOC + SIEM status quo, and adjacent XDR-style software paths
              rather than only one-for-one product feature checklists. Gartner Peer Insights gives the most
              explicit named shortlist in the assigned evidence: Bitdefender, Cisco Systems, and
              CrowdStrike each appear as alternatives considered before a BlueVoyant purchase, but the same
              evidence bundle does not provide direct product, pricing, or win-rate detail for those named
              rivals. That leaves the chapter's most supportable framing as class-based competition with a
              few named signals, not a definitive league table of head-to-head winners.
            claimRefs:
