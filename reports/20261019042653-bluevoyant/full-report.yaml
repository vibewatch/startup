companyProfile:
  summary: >-
    BlueVoyant is a scaled private cyber-defense platform with public evidence of broad service breadth, a customer base
    above 1,000, and a Microsoft-heavy operating posture. The company looks like a late-stage enterprise seller rather
    than an early product experiment, but public evidence still leaves valuation, financing history, and audited
    economics unresolved.
