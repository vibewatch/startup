  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and adjacent spend
        blocks:
          - type: paragraph
            body: >-
              The evidence in the assigned pool supports defining BlueVoyant's market as a converged cyber-defense
              operating layer rather than a single software category. Official and market-data sources consistently
              place the company across managed detection and response, third-party and supply-chain risk, digital risk
              protection, and broader posture or proactive defense services. That boundary matters because it expands
              the relevant buyer set from the SOC alone to include vendor-risk, compliance, and public-sector cyber
              programs, but it also means BlueVoyant should not be sized as "all cybersecurity" spend. Adjacent endpoint
              tools, generic procurement software, and unrelated federal IT services are substitutes or channels, not
              evidence-backed included spend.
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
