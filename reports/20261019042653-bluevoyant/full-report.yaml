              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Growth drivers, constraints, and diligence implications
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption driver in the pool is consolidation: BlueVoyant promises one operating layer across
              internal networks, third parties, and external digital-risk surfaces, and its Microsoft-specific modules
              give it a clearer wedge in enterprises already standardized on that stack. The acquisition of Conquest
              Cyber also targeted defense and government environments where compliance and risk-maturity requirements
              can create a concrete buying trigger. The main constraints are equally clear. Tracxn's 345-competitor set
              implies heavy noise, public scale claims are dated, and the assigned evidence does not independently prove
              pricing, ROI, or conversion for the newer AI positioning. A services-plus- subscription model and an
              active mix of operations, engineering, sales, and client-success hiring also imply a trust-heavy
              implementation motion. Market confidence is therefore directionally positive but incomplete for valuation
              work.
            claimRefs:
              - CM001
              - CM009
              - CM010
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Convergence widens the budget pool, not just the feature list
            body: >-
              BlueVoyant's market case is strongest when one buyer wants internal SOC coverage, third-party risk
              monitoring, and external digital-risk response in the same operating model. That convergence broadens
              potential budget owners, but it also means the sales motion depends on cross-functional coordination
              rather than a single-tool renewal.
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM012
              - CM013
          - type: callout
            title: Market sizing is still a diligence item, not a closed form answer
            body: >-
              The assigned pool supports real demand and category relevance, but it does not provide an independent
              dollar TAM or a reconciled current customer count. For valuation work, the market case should therefore be
              treated as evidence-constrained until management or a third-party dataset closes those gaps.
