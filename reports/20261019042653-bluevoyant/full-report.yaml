        - Independent customer and retention evidence would strengthen the scale claim.
      - - Thesis
        - >-
          The platform combines internal, external, and supply-chain defense, and Conquest Cyber added regulated-market
          capabilities.
        - Segment bookings and cross-sell data would show whether breadth creates economic leverage.
      - - Anti-thesis
        - External pages cite incompatible cumulative funding figures without a common period or definition.
        - A financing ledger and fully diluted cap table would resolve the discrepancy.
      - - Anti-thesis
        - No announced IPO timeline, current valuation disclosure, audited economics, or preference waterfall is public.
        - Verified pricing, financial statements, and exit preparation could support an investable range.
    notes: >-
      The anti-thesis distinguishes missing price and financial evidence from product quality; the funding figures are
      not treated as cash available or as a current valuation.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV006
      - CV007
      - CV010
      - CV011
      - CV012
      - CV013
