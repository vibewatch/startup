      - number: '1.3'
        title: Funding milestones and refresh risk
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a business that kept broadening its platform before the current leadership
              transition. Public materials support a 2023 Conquest Cyber acquisition, a linked Series E capital raise,
              and a July 2024 Cyber Defense Platform launch framed around integrating internal, external, and
              supply-chain defense. They also support continued European operating expansion and a current-private
              status with no official IPO timeline. What remains unresolved is the capital history at the aggregate
              level: accessible sources disagree on total dollars raised and even on current workforce size, which means
              later valuation and financial chapters should not inherit a clean funding or headcount number from this
              chapter without primary reconciliation.
