  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Required assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - Audited growth and retention are strong; platform cross-sell raises margins; entry terms are clean.
        - No numeric range is supportable yet; upside requires pricing below a verified peer or transaction benchmark.
        - AI monetization or integration benefits may not convert into durable economics.
        - Upgrade only after audited cohort and margin evidence.
      - - Base
        - BlueVoyant remains a scaled private cyber platform, but price, dilution, and profitability stay undisclosed.
        - Maintain an uncertain valuation stance and track recommendation until the missing inputs are supplied.
        - Holding period and financing structure can absorb otherwise sound operating progress.
        - Best fit with currently retained evidence.
      - - Bear
        - Growth is weaker than historical proxies, preference overhang is material, or liquidity remains remote.
        - >-
          Reject or demand substantial downside protection; no precise downside range is defensible without the cap
          table.
        - Multiple compression, dilution, concentration, and cash needs can compound.
        - Triggered by unreconciled funding, weak retention, or no credible exit path.
    notes: >-
      Scenarios are conditional and deliberately omit unsupported valuation amounts, multiples, and probabilities; all
      three require private financial and cap-table evidence to quantify.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV007
      - CV009
      - CV014
      - CV015
      - CV016
