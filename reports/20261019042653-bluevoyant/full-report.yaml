          label: Financing evidence
          value: More than $140M Series E disclosed in 2023
          claimRefs:
            - CV003
        - id: conflict
          label: Data conflict
          value: External cumulative funding figures do not reconcile
          claimRefs:
            - CV006
            - CV007
        - id: liquidity
          label: Liquidity gap
          value: No announced IPO timeline or current valuation disclosure
          claimRefs:
            - CV004
            - CV005
        - id: decision
          label: Track
          value: Require audited metrics, cap table, and price support
          claimRefs:
            - CV014
            - CV015
            - CV016
      edges:
        - from: scale
          to: breadth
          label: scale makes platform breadth diligence-worthy
        - from: breadth
          to: financing
          label: broader scope accompanied acquisition financing
        - from: financing
          to: conflict
          label: cumulative history remains unreconciled
        - from: conflict
          to: liquidity
          label: opacity prevents reliable price discovery
        - from: liquidity
          to: decision
          label: missing downside inputs cap conviction
    approximationNotes: >-
