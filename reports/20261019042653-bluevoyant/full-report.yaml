              - CU003
              - CU004
              - CU009
              - CU012
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU003
              - CU009
              - CU010
              - CU011
              - CU015
              - CU016
      - number: '6.2'
        title: Adoption proof is real, but it is strongest where BlueVoyant can point to deployment and delivery scale
        blocks:
          - type: paragraph
            body: >
              The assigned pool supports real commercial traction, although most of the proof is company-issued. Across
              2023 to 2026, BlueVoyant repeatedly described its customer base as moving from more than 900 clients to
              more than 1,000 customers, while a 2026 leadership release added 45-country coverage and 38 million alerts
              processed per day. The most specific deployment evidence sits inside the Microsoft ecosystem: BlueVoyant
              says it has more than 2,500 Microsoft-native customer deployments, and the company is still hiring for
              client-success, SOC, federal, and Purview-specialist roles across the US, UK, Ireland, and Manila. Those
              signals support a real installed base and ongoing service delivery capacity, but they do not yet quantify
              renewals, module expansion rates, or revenue concentration by segment.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU011
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU011
              - CU013
      - number: '6.3'
        title: Reference quality and durability remain the weak point in the public record
        blocks:
          - type: paragraph
            body: >
              BlueVoyant's customer proof is better described as directional than durable. The public case-study surface
              in the assigned pool is dominated by anonymized references such as a large municipality and an online
              travel agency, while Gartner Peer Insights shows one favorable MDR review but no critical-review depth on
              the category page. That leaves the public record thin on cohort durability, contract length, churn, and
              top-customer exposure even though the company clearly serves meaningful enterprise and government
              workloads. The gap matters because BlueVoyant's go-to-market appears concentrated in Microsoft-heavy and
              regulated environments, which can produce strong expansion economics when customers renew but can also
              hide vertical or channel concentration if management does not disclose it.
            claimRefs:
              - CU007
              - CU008
              - CU014
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU007
              - CU008
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Installed-base proof is strongest where BlueVoyant can point to real operating depth
            body: >-
              The Microsoft-native deployment count, multinational client claims, and active client-success / SOC hiring
              together make the customer base look operationally real rather than purely logo-driven.
            calloutType: strength
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU011
          - type: callout
            title: Durability and concentration are still under-evidenced
            body: >-
              Public sources in the assigned pool do not disclose NRR, churn, contract length, or top-customer exposure,
              and most reference quality still comes from anonymized or company-issued customer proof.
            calloutType: risk
            claimRefs:
              - CU008
              - CU014
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              The highest residual risk is not evidence of customer demand failure; it is the combination of incomplete
              external disclosure, rapid operating change, and concentration around a few strategic execution vectors.
              BlueVoyant publicly framed the Conquest Cyber acquisition as a way to deepen its position in highly
              regulated and government environments, then later paired that broader platform ambition with a 2026 CEO
              transition, a large global client footprint, and ongoing global hiring across SOC, federal, and
              client-success functions. Those are credible signs of scale, but they also increase the number of places
              where an investor can be wrong: capital intensity, integration quality, service consistency across
              regions, and partner leverage all matter more once the company is serving more than 1,000 clients and
              marketing a unified internal, external, and supply-chain defense platform.
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR009
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR007
              - CR011
              - CR013
      - number: '7.2'
        title: Regulatory, legal, and compliance risk
        blocks:
          - type: paragraph
            body: >-
              BlueVoyant's own materials position the company closer to regulated and public-sector requirements than a
              generic MDR vendor. The Conquest acquisition was explicitly tied to Defense Industrial Base and government
              buyers, CMMC-oriented workflows, and a broader risk-management stack; the UK business also markets DFIR
              and governance/risk/compliance services for sensitive incidents. That expands the company's commercial
              addressable market, but it also raises the burden of proof on certifications, delivery controls, incident
              handling, and regulatory readiness. Within this worker pool, adverse and regulatory searches did not
              retain court, enforcement, regulator, or trust-center evidence that would independently confirm the
              company's current litigation, incident, or certification posture, so the residual risk is driven less by a
              known negative event than by incomplete public verification of a regulated-delivery story.
            claimRefs:
              - CR001
              - CR007
              - CR010
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR004
              - CR007
              - CR010
              - CR013
      - number: '7.3'
        title: Operating execution and partner dependence
        blocks:
          - type: paragraph
            body: >-
              Execution risk is elevated because BlueVoyant is trying to do several hard things at once: absorb an
              acquisition, roll out a broader AI-driven platform narrative, expand regional SOC capacity in Europe, and
              continue staffing globally across technical, sales, customer-success, and federal-facing roles. The
              operating model appears broad rather than narrow, spanning MDR, TPRM, digital risk, DFIR, GRC, and
              incident response. That breadth can be a strength, but it also increases complexity in service quality,
              integration roadmaps, and margin discipline. The partner layer matters too: BlueVoyant's public messaging
              repeatedly centers Microsoft recognition, Microsoft-focused services, and ecosystem credibility, which is
              strategically useful but creates a dependency if platform roadmaps, co-sell leverage, or buyer demand in
              the Microsoft channel soften.
            claimRefs:
              - CR005
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR005
              - CR007
              - CR008
              - CR009
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR010
              - CR011
              - CR013
      - number: '7.4'
        title: Financial/model risk and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The sharpest financial-model risk is that current public sources do not reconcile BlueVoyant's funding
              history or provide audited operating metrics that would let an investor convert momentum into conviction.
              AlleyWatch's December 2023 interview said the company had raised a Series E and reached $665.5 million in
              total funding, while FundedIQ's October 2026 company profile still records only $318 million across two
              rounds ending with a February 2022 Series D. Separately, the strongest growth indicators in this pool —
              Deloitte Fast 500 ranking, more than 900 to more than 1,000 customers, and geographic hiring expansion —
              are directionally positive but still largely company-issued. That means the practical kill criteria are
              measurable: if diligence cannot reconcile round history, cash and burn, customer concentration, platform
              reliability, and Microsoft/channel dependency, the company remains a track or research-more candidate
              rather than a clean underwrite.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR006
              - CR008
              - CR009
              - CR012
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Opacity is the primary underwriting risk
            body: >-
              The biggest risk is not lack of ambition or lack of customer proof; it is the gap between BlueVoyant's
              scale narrative and the limited independent/public data needed to validate funding chronology, current
              cash profile, customer concentration, and regulated-delivery controls.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR012
              - CR013
          - type: callout
            title: Clear kill criteria before price-sensitive conviction
            body: >-
              Require reconciled financing history and current cash runway, customer concentration and retention by
              vertical, evidence for current trust/compliance posture, and quantified Microsoft/channel exposure before
              underwriting a late-stage round as a buy rather than a monitored track position.
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR010
              - CR011
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              BlueVoyant merits continued diligence rather than rejection: two company-issued 2024 and 2026 releases
              each report more than 1,000 customers, while the current platform spans internal, external, and
              supply-chain defense. Those facts indicate a scaled operating company, not an early product experiment.
              They do not, however, validate an entry price. IPOs.fyi reported in April 2026 that BlueVoyant remained
              private, had no announced IPO timeline, and lacked widely disclosed valuation details. The public
              financing record is also difficult to reconcile: the official 2023 release disclosed more than $140
              million of Series E funding tied to the Conquest Cyber acquisition, while two external pages cite
              materially different cumulative funding totals and periods. The investment posture should therefore remain
              track, with any upgrade contingent on verified current valuation, audited operating metrics, fully diluted
              ownership, and preference terms.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and scenarios
        blocks:
          - type: paragraph
            body: >-
              The thesis is that customer scale, an integrated MDR/TPRM/DRP proposition, and exposure to regulated and
              government-adjacent workflows can support durable enterprise value. The Conquest Cyber acquisition added
              risk-posture and compliance capabilities, and BlueVoyant's 2023 Deloitte Fast 500 release provides a
              historical growth signal. The anti-thesis is that these are mostly company-issued indicators and
              backward-looking milestones. They do not disclose current ARR, revenue growth, gross margin, retention,
              cash burn, or customer concentration. Public sources also do not provide a model-appropriate trading or
              transaction comparable with matching revenue quality and period. Bull, base, and bear cases must therefore
              remain conditional rather than attach invented valuation ranges: the bull case requires verified
              profitable growth, the base case preserves the track posture, and the bear case is triggered by weak
              economics, preference overhang, or a prolonged liquidity horizon.
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is plausible but unproven. BlueVoyant appointed John Hernandez as CEO in May 2026 with an
              explicit platform-scaling mandate, while its careers page shows active technical, client-success, sales,
              and federal hiring across the United States, United Kingdom, Romania, the Philippines, and Ireland. These
              are constructive operating signals, not evidence of IPO preparation or near-term liquidity. The decisive
              diligence package is a current cap table with all preferred terms, audited 2025-2026 revenue and ARR
              bridges, gross margin by service line, NRR and cohort retention, cash balance and burn, customer
              concentration, and any recent secondary pricing. A strategic or public exit should not be underwritten
              until management can connect those metrics to the unified platform narrative. Failure to reconcile
              cumulative funding, provide preference waterfalls, or demonstrate durable growth would break the
              underwriting thesis even if product breadth remains credible.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive conclusion
            body: >-
              Keep BlueVoyant in active diligence, but require a verified entry price, audited economics, and complete
              preference terms before considering an investment.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV014
              - CV015
          - type: callout
            title: Thesis-break trigger
            body: >-
              The thesis breaks if management cannot reconcile financing history, disclose the preference waterfall, or
              show durable retention and margins behind the platform narrative.
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV015
              - CV016
