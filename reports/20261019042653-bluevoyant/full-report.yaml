      - number: '5.3'
        title: Differentiation, maturity, and dependency profile
        blocks:
          - type: paragraph
            body: >-
              BlueVoyant's clearest documented differentiation is not a fully open developer ecosystem; it is deep
              operational specialization around Microsoft security controls and workflows that span internal defense and
              external-risk monitoring. The 2026 AI launch claims more than 2,500 Microsoft-native deployments behind
              BlueVoyant playbooks, while the 2023 Conquest Cyber acquisition explicitly aimed to add risk-maturity,
              compliance, and posture-management depth to the existing stack. Government-oriented supply-chain features,
              classified-environment integration, and CMMC/Managed XDR credentials reinforce that regulated and
              high-security environments are part of the design target. Those are credible maturity signals, but they
              also create concentration around Microsoft ecosystem execution and continued services delivery quality.
            claimRefs:
              - CE009
              - CE011
              - CE012
              - CE014
              - CE015
      - number: '5.4'
        title: Trust, control surface, and technical diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Public evidence in the assigned pool is stronger on product taxonomy than on trust verification. The
              company discloses classified-environment integration, human validation of supplier-risk events, and a
              staffing posture that still emphasizes SOC and Microsoft-specialist roles, which all support a
              services-heavy control model. However, the best non-company current proof here is mostly structural: a
              Gartner Peer Insights MDR listing and an older independent profile confirming the categories BlueVoyant
              operates in. The pool does not independently verify current AI efficacy, uptime, alert-quality metrics,
              pricing, or broad certification depth, so diligence should ask for recent customer references, measured
              operating outcomes, and trust/compliance artifacts before underwriting technical defensibility.
            claimRefs:
              - CE010
              - CE013
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Microsoft-centric product depth is the clearest technical moat
            body: >-
              BlueVoyant's best-documented technical advantage is concentrated Microsoft operating depth: current menus
              expose Microsoft-specific MDR and optimization modules, the 2026 AI launch claims more than 2,500
              Microsoft-native deployments behind its playbooks, and the Conquest integration explicitly adds more
              Microsoft control-surface depth.
            calloutType: strength
            claimRefs:
              - CE002
              - CE009
              - CE015
          - type: callout
            title: Independent proof trails the amount of current roadmap and product detail
            body: >-
              The current pool supports breadth, regulated-market relevance, and staffing seriousness, but most detailed
              claims on AI efficacy, onboarding speed, and platform outcomes still come from BlueVoyant materials.
              Before underwriting product defensibility, diligence should request recent customer references,
              trust/compliance artifacts, and measured response-quality or uptime data.
            calloutType: risk
            claimRefs:
              - CE006
              - CE008
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and routes to market skew enterprise, regulated, and Microsoft-centric
        blocks:
          - type: paragraph
            body: >
              BlueVoyant's public customer evidence points to a company selling primarily into enterprise and
              regulated-security workflows rather than a broad self-serve market. The strongest segment signals cluster
              around large enterprises, government and defense-adjacent buyers, Microsoft-native security teams, and
              resource-constrained organizations that need managed coverage instead of building large internal SOC
              staffs. The channel mix also appears broader than direct enterprise sales alone: the 2026 AI launch
              explicitly names account specialists and select value-added resellers, CIO Bulletin describes an expanding
              partner network, and current hiring still includes federal and risk-product selling roles. That
              combination suggests BlueVoyant is trying to land through high-trust enterprise motions, then widen
              distribution through partners and adjacent regional teams rather than relying on a single buyer cohort.
            claimRefs:
              - CU001
              - CU002
              - CU009
              - CU010
              - CU012
              - CU015
          - type: table
            tableRef: TU001
            claimRefs:
