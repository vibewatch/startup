          claimRefs:
            - CO015
        - date: '2023-11-29'
          label: Conquest Cyber acquisition announced
          detail: BlueVoyant announced the Conquest Cyber acquisition as part of a broader cyber risk posture strategy.
          tone: positive
          claimRefs:
            - CO011
        - date: '2023-11-29'
          label: Series E add-on capital announced
          detail: The acquisition announcement also said BlueVoyant raised more than $140 million in Series E funding.
          tone: positive
          claimRefs:
