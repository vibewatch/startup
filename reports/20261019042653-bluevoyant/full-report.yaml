              - CP010
              - CP015
              - CP016
      - number: '3.3'
        title: Commercial structure favors consultative, partner-supported enterprise selling
        blocks:
          - type: paragraph
            body: |-
              The commercial motion in assigned evidence is consultative rather than self-serve. RFP Wiki
              describes custom endpoint-based MDR pricing with separate platform-license dependencies and
              multiple add-on modules, while BlueVoyant's own web surfaces emphasize request-a-demo,
              customer-login, and partner-login paths instead of transparent checkout. Partner and advisory
              surfaces reinforce that enterprise-sales pattern: a reseller page markets BlueVoyant through
              a partner relationship, and a third-party directory explicitly offers to compare BlueVoyant
              against alternatives and help buyers negotiate terms. This structure can support larger,
              more complex deals, but it also raises diligence friction because list prices, discounting,
              and scope boundaries remain hard to verify publicly.
            claimRefs:
              - CP008
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP010
              - CP011
              - CP012
              - CP016
      - number: '3.4'
        title: Durability depends on breadth proving real outside the Microsoft-led sweet spot
        blocks:
          - type: paragraph
            body: |-
              The most defensible bullish case is that BlueVoyant is moving from an MDR vendor toward a
              broader cyber-operations platform with regulated-sector posture depth and enough scale to win
              enterprise accounts. The main disconfirming evidence is also clear: independent analysis says
              breadth outside the core Microsoft/Sentinel and Splunk lanes is still narrower than some
              multi-signal MDR leaders, public review volume is thin, and pricing remains opaque enough
              that buyers still need demos, references, and negotiated scope review before underwriting the
              competitive moat. That does not negate the offering, but it does mean commoditization and
              incumbent response risk are still live.
            claimRefs:
              - CP007
              - CP010
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: BlueVoyant's best-supported wedge is Microsoft plus adjacent cyber-risk modules
            body: >-
              The assigned evidence most clearly supports BlueVoyant where Microsoft depth, managed service delivery,
              and adjacent TPRM/DRP/regulatory posture matter together; that is a stronger wedge than trying to win on
              lowest-friction MDR procurement alone.
            calloutType: insight
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP014
          - type: callout
            title: Public evidence is thinner than the platform story
            body: >-
              The platform narrative is broad, but the independent proof base is still light on named rival comparisons,
              realized pricing, and review volume, which keeps commoditization and incumbent-response risk higher than
              the suite story implies.
            calloutType: risk
            claimRefs:
