      - number: '1.2'
        title: Leadership, governance, and key-person risk
        blocks:
          - type: paragraph
            body: >-
              Leadership continuity matters because BlueVoyant is still a private company with limited audited
              disclosure, so management transitions carry more weight than they would at a public peer. The clearest
              recent change is the May 2026 CEO handoff from co-founder Jim Rosenthal to John Hernandez, with Rosenthal
              remaining board chair and Tom Glocer shifting to vice-chairman. That combination suggests continuity in
              founder influence while also implying some concentration of institutional memory around a small set of
              senior leaders. Older profile material remains useful for role history and executive depth, but investors
              should treat it as background rather than a substitute for a current org chart, board committee map, or
              documented succession plan.
            claimRefs:
              - CO001
              - CO007
              - CO008
              - CO009
