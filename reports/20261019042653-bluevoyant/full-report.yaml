      - number: '2.2'
        title: Evidence-constrained sizing and adoption lenses
        blocks:
          - type: paragraph
            body: >-
              No source in the assigned pool isolates a defensible TAM, SAM, or SOM in dollars for BlueVoyant's exact
              mix of MDR, third-party risk, digital risk, and Microsoft-heavy managed services, so the chapter has to
              size demand through adoption lenses instead. Those lenses are still useful: the company publicly cites
              more than 1,000 customers in mid-2024, more than 900 clients in late 2023, and more than 20 countries of
              operation on its careers page, while Tracxn shows a crowded competitive set and Deloitte Fast 500
              eligibility supplies only a historical revenue floor rather than current revenue. Together, those signals
              support a credible multinational opportunity, but they do not establish a precise current customer base or
              a spend-based market ceiling.
            claimRefs:
              - CM005
