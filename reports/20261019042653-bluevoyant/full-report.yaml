      - number: '2.3'
        title: Buyer, user, and budget ownership
        blocks:
          - type: paragraph
            body: >-
              The buyer map implied by the sources is broader than a pure software sale. BlueVoyant's own product
              navigation centers on managed detection and response, Microsoft optimization, and third-party risk
              workflows, while Multiples describes the revenue model as a blend of services and subscription. That
              points to security-operations leaders, Microsoft-stack owners, third-party risk teams, and government or
              defense-program operators as the practical budget owners, with analysts and response teams as day-to-day
              users. CIO Bulletin also frames the company as useful for both large enterprises and smaller organizations
              that cannot build equivalent in-house capabilities, reinforcing a services-led adoption path rather than a
              narrow enterprise-software-only motion.
            claimRefs:
              - CM002
              - CM003
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
