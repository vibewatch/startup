    claimRefs: [CV002, CV003, CV004, CV005, CV006, CV007, CV009, CV014, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: Price-sensitive conclusion
    body: >-
      Keep BlueVoyant in active diligence, but require a verified entry price, audited economics,
      and complete preference terms before considering an investment.
