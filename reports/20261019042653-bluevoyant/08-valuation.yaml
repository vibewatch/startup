  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: valuation-and-cap-table
      missingEvidence: Current enterprise and equity value, fully diluted ownership, liquidation preferences, debt, and recent secondary pricing.
      whyItMatters: Price, dilution, and downside priority determine whether operating quality can produce an acceptable investor return.
      diligencePath: Request the current cap table, all preferred financing documents, debt schedule, latest 409A, and records of recent primary or secondary transactions.
      relatedQuestionRefs: [QV001, QV002, QV004, QV005]
    - type: private-evidence-only
      severity: material
      topic: operating-economics
      missingEvidence: Audited 2025-2026 revenue and ARR bridges, growth, gross margin, NRR, burn, cash balance, and customer concentration.
      whyItMatters: Historical growth and customer-count claims cannot establish current revenue quality, capital efficiency, or an appropriate valuation multiple.
      diligencePath: Obtain audited statements and board KPI packs, then reconcile ARR versus revenue and segment economics across MDR, TPRM, DRP, and services.
      relatedQuestionRefs: [QV002, QV003, QV005, QV006, QV008]
    - type: missing-source
      severity: material
      topic: comparable-set
      missingEvidence: A current independent public-company, private-round, or M&A comparable with matching metric definitions and transaction period.
      whyItMatters: Without a comparable benchmark, no evidence-backed valuation or return range can be presented.
      diligencePath: Obtain management's banker materials and current transaction comparables, then verify each metric, period, and enterprise-to-equity bridge.
      relatedQuestionRefs: [QV005, QV006]
