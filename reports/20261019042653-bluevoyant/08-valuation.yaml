schemaVersion: report-v2
artifact: valuation
slug: bluevoyant
runDate: 2026-10-19
company:
  name: BlueVoyant
chapter:
  number: 8
  title: Valuation
  summary: >-
    BlueVoyant has credible operating scale, a broad cyber-defense platform, and a substantial
    financing history, but the retained public evidence does not establish a current valuation,
    audited economics, or preference stack. The appropriate stance is track with medium confidence:
    advance only at a price supported by verified financials, cap-table terms, and a realistic
    liquidity path.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      BlueVoyant merits continued diligence rather than rejection: two company-issued 2024 and
      2026 releases each report more than 1,000 customers, while the current platform spans
      internal, external, and supply-chain defense. Those facts indicate a scaled operating
      company, not an early product experiment. They do not, however, validate an entry price.
      IPOs.fyi reported in April 2026 that BlueVoyant remained private, had no announced IPO
      timeline, and lacked widely disclosed valuation details. The public financing record is
      also difficult to reconcile: the official 2023 release disclosed more than $140 million
      of Series E funding tied to the Conquest Cyber acquisition, while two external pages cite
      materially different cumulative funding totals and periods. The investment posture should
      therefore remain track, with any upgrade contingent on verified current valuation, audited
      operating metrics, fully diluted ownership, and preference terms.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV014]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-scenarios
    title: Thesis, anti-thesis, and scenarios
    body: >-
      The thesis is that customer scale, an integrated MDR/TPRM/DRP proposition, and exposure to
      regulated and government-adjacent workflows can support durable enterprise value. The
      Conquest Cyber acquisition added risk-posture and compliance capabilities, and BlueVoyant's
      2023 Deloitte Fast 500 release provides a historical growth signal. The anti-thesis is that
      these are mostly company-issued indicators and backward-looking milestones. They do not
      disclose current ARR, revenue growth, gross margin, retention, cash burn, or customer
      concentration. Public sources also do not provide a model-appropriate trading or transaction
      comparable with matching revenue quality and period. Bull, base, and bear cases must
      therefore remain conditional rather than attach invented valuation ranges: the bull case
      requires verified profitable growth, the base case preserves the track posture, and the bear
      case is triggered by weak economics, preference overhang, or a prolonged liquidity horizon.
    claimRefs: [CV001, CV002, CV008, CV009, CV010, CV011, CV012, CV013, CV015, CV016]
    tableRefs: [TV002, TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness and final diligence asks
    body: >-
      Exit readiness is plausible but unproven. BlueVoyant appointed John Hernandez as CEO in May
      2026 with an explicit platform-scaling mandate, while its careers page shows active technical,
      client-success, sales, and federal hiring across the United States, United Kingdom, Romania,
      the Philippines, and Ireland. These are constructive operating signals, not evidence of IPO
      preparation or near-term liquidity. The decisive diligence package is a current cap table
      with all preferred terms, audited 2025-2026 revenue and ARR bridges, gross margin by service
      line, NRR and cohort retention, cash balance and burn, customer concentration, and any recent
      secondary pricing. A strategic or public exit should not be underwritten until management can
      connect those metrics to the unified platform narrative. Failure to reconcile cumulative
      funding, provide preference waterfalls, or demonstrate durable growth would break the
      underwriting thesis even if product breadth remains credible.
    claimRefs: [CV004, CV005, CV006, CV007, CV008, CV009, CV014, CV015, CV016]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Current assessment
      - Evidence basis
      - Decision implication
    rows:
      - [Recommendation, Track, "Scaled customer and platform evidence is credible, but current price support is absent.", "Continue diligence; do not issue a buy recommendation from public evidence."]
      - [Confidence, Medium, "Operating signals recur across company materials, while valuation and economics remain opaque.", "Use explicit information gates rather than a point estimate."]
      - [Risk rating, High, "Private-company liquidity, preference, dilution, and unit-economics risks are unresolved.", "Require downside protection and complete financing terms before sizing."]
      - [Valuation stance, Uncertain, "No retained source establishes a current enterprise or equity value.", "Treat any seller mark as unverified until reconciled to audited metrics and transaction terms."]
    notes: >-
      Assessments synthesize company-issued scale and financing statements with independent IPO
      status evidence; no row represents an audited metric or a current price opinion.
    claimRefs: [CV001, CV003, CV004, CV005, CV006, CV007, CV014, CV015]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Evidence-backed argument
      - What would change the view
    rows:
      - [Thesis, "Two company-issued releases report more than 1,000 customers, supporting evidence of operating scale.", "Independent customer and retention evidence would strengthen the scale claim."]
      - [Thesis, "The platform combines internal, external, and supply-chain defense, and Conquest Cyber added regulated-market capabilities.", "Segment bookings and cross-sell data would show whether breadth creates economic leverage."]
      - [Anti-thesis, "External pages cite incompatible cumulative funding figures without a common period or definition.", "A financing ledger and fully diluted cap table would resolve the discrepancy."]
      - [Anti-thesis, "No announced IPO timeline, current valuation disclosure, audited economics, or preference waterfall is public.", "Verified pricing, financial statements, and exit preparation could support an investable range."]
    notes: >-
      The anti-thesis distinguishes missing price and financial evidence from product quality; the
      funding figures are not treated as cash available or as a current valuation.
    claimRefs: [CV001, CV002, CV004, CV005, CV006, CV007, CV010, CV011, CV012, CV013, CV015]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Required assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Audited growth and retention are strong; platform cross-sell raises margins; entry terms are clean.", "No numeric range is supportable yet; upside requires pricing below a verified peer or transaction benchmark.", "AI monetization or integration benefits may not convert into durable economics.", "Upgrade only after audited cohort and margin evidence."]
      - [Base, "BlueVoyant remains a scaled private cyber platform, but price, dilution, and profitability stay undisclosed.", "Maintain an uncertain valuation stance and track recommendation until the missing inputs are supplied.", "Holding period and financing structure can absorb otherwise sound operating progress.", "Best fit with currently retained evidence."]
      - [Bear, "Growth is weaker than historical proxies, preference overhang is material, or liquidity remains remote.", "Reject or demand substantial downside protection; no precise downside range is defensible without the cap table.", "Multiple compression, dilution, concentration, and cash needs can compound.", "Triggered by unreconciled funding, weak retention, or no credible exit path."]
    notes: >-
      Scenarios are conditional and deliberately omit unsupported valuation amounts, multiples, and
      probabilities; all three require private financial and cap-table evidence to quantify.
    claimRefs: [CV001, CV004, CV005, CV006, CV007, CV009, CV014, CV015, CV016]
