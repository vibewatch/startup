  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: underwriting-gap
      missingEvidence: Current revenue ARR gross margin CAC payback burn cash balance debt schedule and runway.
      whyItMatters: These are the core inputs required to underwrite revenue quality margin path and financing dependency.
      diligencePath: Request audited historical financials a current monthly cash-burn bridge debt documents and board-approved operating plan.
      relatedQuestionRefs: [QI008]
      relatedTableRefs: [TI003]
    - type: missing-source
      severity: material
      topic: pricing-opacity
      missingEvidence: Public or management-shared price cards standard contract terms renewal uplift policy and typical discount bands by offer family.
      whyItMatters: Without pricing mechanics it is not possible to translate product breadth into ACV retention or sales-efficiency assumptions.
      diligencePath: Obtain current rate cards sample order forms and cohort data on realized discounts by channel and customer segment.
      relatedTableRefs: [TI002]
    - type: private-evidence-only
      severity: material
      topic: revenue-mix
      missingEvidence: Revenue split across MDR TPRM DRP professional services and government programs plus any software versus services accounting treatment.
      whyItMatters: Mix determines gross-margin quality cyclicality and whether growth is coming from scalable platform usage or labor-backed work.
      diligencePath: Request product-line P&L, revenue-recognition policy, and services utilization by quarter.
      relatedTableRefs: [TI001]
    - type: private-evidence-only
      severity: minor
      topic: customer-concentration
      missingEvidence: Customer concentration retention and vertical mix, especially for government and financial-services accounts.
      whyItMatters: Concentration and retention determine whether public scale claims translate into durable revenue quality.
      diligencePath: Review top-20 customer exposure retention by cohort and segment-level churn/contraction data.
