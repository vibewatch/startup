callouts:
  - calloutType: insight
    title: Real scale, limited transparency
    body: Public disclosures consistently support a large enterprise platform with global coverage and more than 1,000 customers or clients, yet they stop short of the metrics an investor needs to underwrite unit economics.
    claimRefs: [CI002, CI003, CI013]
  - calloutType: risk
    title: Financial diligence blocker
    body: Without public revenue mix, realized pricing, gross margin, burn, or cash disclosures, the investment case depends on management data-room access rather than public evidence.
    claimRefs: [CI012, CI013]
