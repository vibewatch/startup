schemaVersion: report-v2
artifact: financials
slug: bluevoyant
runDate: 2026-10-19
company:
  name: BlueVoyant
chapter:
  number: 4
  title: Financials
  summary: >-
    BlueVoyant's public evidence supports a real enterprise-scale cyber-defense business with MDR, TPRM,
    DRP, and professional-services revenue pathways, but public disclosures stop well short of an
    underwritable financial model. The strongest external proxy is a commissioned Forrester MDR study,
    while current revenue mix, realized pricing, margins, burn, cash, and runway remain undisclosed in the
    assigned evidence set.
sections:
  - id: revenue-model-and-public-traction
    title: Revenue model and public traction
    body: |-
      BlueVoyant's public materials consistently frame the company as a unified cyber-defense platform that
      monetizes multiple solution families rather than a single SKU. Across company pages and company-issued
      newswire releases, the visible offer set includes Managed Detection and Response, Third-Party Risk
      Management, Digital Risk Protection, and adjacent professional services. That supports a diversified
      revenue architecture with several expansion paths per enterprise account, but the reviewed public
      sources do not disclose how much revenue each line contributes, whether contracts are primarily program
      retainers versus project work, or how any software-like revenue is distinguished from labor-backed
      services for accounting and margin analysis.
    claimRefs: [CI001, CI002, CI003, CI012]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: delivery-model-and-unit-economics
    title: Delivery model and unit economics
    body: |-
      The operating model looks materially service-backed. BlueVoyant's 2024 and 2026 public statements
      pair customer-scale claims with SOC buildout and high-volume alert processing, while the live careers
      page shows open roles across SOC operations, client success, federal sales, channel sales, and
      Microsoft-specialist work. That pattern is consistent with a business whose revenue quality depends on
      keeping platform automation, analyst productivity, and support utilization in balance. The best public
      unit-economics evidence is still a commissioned Forrester Total Economic Impact study for MDR, which is
      useful as a customer-value proxy but not a substitute for BlueVoyant's own CAC, payback, gross-margin,
      or retention disclosures.
    claimRefs: [CI004, CI005, CI008, CI009, CI010]
    tableRefs: [TI003]
  - id: capital-needs-and-diligence-blockers
    title: Capital needs and diligence blockers
    body: |-
      The clearest capital signal in the assigned evidence is BlueVoyant's November 2023 disclosure that it
      raised more than $140 million in Series E funding alongside the Conquest Cyber acquisition. That shows
      willingness and ability to fund strategic platform expansion, especially into regulated and government
      cyber-risk programs, but it does not answer the forward-looking underwriting questions. The assigned
      public evidence still does not disclose current revenue, gross margin, cash, burn, debt, or runway.
      Meanwhile, a competitor comparison page and a partner-authored profile are reminders that public market
      positioning and external collateral can be selective or stale, so the next stage of diligence has to be
      primary-management data rather than extrapolation from marketing surfaces.
    claimRefs: [CI006, CI007, CI011, CI013, CI014]
  - id: financial-verdict
    title: Financial verdict
    body: |-
      Financially, BlueVoyant looks credible as a scaled enterprise cyber platform, but not yet underwritable
      from public evidence alone. The company appears to have multiple monetizable modules, a global service
      footprint, and customer-value signals strong enough to support enterprise sales conversations. The
      missing pieces are the ones investors actually price: realized pricing, mix by product and services,
      gross margin by line, customer concentration, retention, current liquidity, and financing dependency.
      Until management opens those figures, the sensible judgment is that revenue quality is plausible,
      margin expansion is possible but unproven, and capital adequacy remains a diligence blocker rather than
      a solved question.
    claimRefs: [CI005, CI012, CI013]
