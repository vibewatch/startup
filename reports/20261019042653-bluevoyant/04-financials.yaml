  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Public value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [Customers / installed base, ">1,000 clients/customers disclosed in 2024-2026 company statements", Medium, Scale supports enterprise relevance and expansion potential, Provide logo count by product paying sites and NRR]
      - [Geographic / delivery footprint, "45 countries and 38 million alerts per day in 2026 release; >20 operating countries plus multi-region hiring on careers page", Medium, Indicates revenue opportunity but also delivery and support burden, Provide delivery-headcount split utilization and follow-the-sun staffing model]
      - [MDR customer value proxy, "210% ROI and $3.9 million NPV over three years for a representative 10,000-user organization", Medium, Useful willingness-to-pay proxy if case assumptions resemble target customers, Provide actual customer cohorts CAC and realized payback]
      - [Operational efficiency proxy, "90% fewer escalated alerts 70% faster resolution and >$895k optimized spending in TEI composite", Medium, Suggests margin leverage depends on automation and analyst productivity, Provide alerts-per-analyst gross margin by service line and support load]
      - [Capital event, "> $140 million Series E funded alongside Conquest acquisition in Nov. 2023", Medium, Shows capacity to finance expansion and M&A but not current liquidity, Provide current cash debt covenants and next-round trigger]
      - [Underwriting-critical metrics, null, High, Revenue gross margin CAC payback burn cash debt and runway are the inputs needed to underwrite margin path and capital adequacy, Open the data room with audited financials monthly burn and pipeline-to-cash bridge]
    notes: Public values here are proxies or disclosures from company-issued materials; null marks investor-critical metrics that remain undisclosed in the assigned evidence.
    claimRefs: [CI002, CI003, CI004, CI006, CI008, CI009, CI010, CI013]
