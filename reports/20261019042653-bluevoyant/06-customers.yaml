company:
  name: "BlueVoyant"
chapter:
  number: 6
  title: "Customers"
  summary: "BlueVoyant has credible public proof of large-enterprise and regulated-market adoption, including company-stated scale above 1,000 customers, a Microsoft-heavy installed base, and multiple regulated/government entry points. The durability story is weaker than the adoption story because public references remain heavily company-issued, named customer proof is mostly anonymized, and no public source in the assigned pool discloses retention, renewal, or concentration metrics."
sections:
  - id: "customer-segments-and-routes"
    title: "Customer segments and routes to market skew enterprise, regulated, and Microsoft-centric"
    body: |
      BlueVoyant's public customer evidence points to a company selling primarily into enterprise and regulated-security workflows rather than a broad self-serve market. The strongest segment signals cluster around large enterprises, government and defense-adjacent buyers, Microsoft-native security teams, and resource-constrained organizations that need managed coverage instead of building large internal SOC staffs. The channel mix also appears broader than direct enterprise sales alone: the 2026 AI launch explicitly names account specialists and select value-added resellers, CIO Bulletin describes an expanding partner network, and current hiring still includes federal and risk-product selling roles. That combination suggests BlueVoyant is trying to land through high-trust enterprise motions, then widen distribution through partners and adjacent regional teams rather than relying on a single buyer cohort.
    claimRefs: ["CU001", "CU002", "CU009", "CU010", "CU012", "CU015"]
    tableRefs: ["TU001"]
    figureRefs: ["FU001"]
  - id: "adoption-footprint-and-expansion"
    title: "Adoption proof is real, but it is strongest where BlueVoyant can point to deployment and delivery scale"
    body: |
      The assigned pool supports real commercial traction, although most of the proof is company-issued. Across 2023 to 2026, BlueVoyant repeatedly described its customer base as moving from more than 900 clients to more than 1,000 customers, while a 2026 leadership release added 45-country coverage and 38 million alerts processed per day. The most specific deployment evidence sits inside the Microsoft ecosystem: BlueVoyant says it has more than 2,500 Microsoft-native customer deployments, and the company is still hiring for client-success, SOC, federal, and Purview-specialist roles across the US, UK, Ireland, and Manila. Those signals support a real installed base and ongoing service delivery capacity, but they do not yet quantify renewals, module expansion rates, or revenue concentration by segment.
    claimRefs: ["CU003", "CU004", "CU005", "CU006", "CU011", "CU013"]
    tableRefs: ["TU002"]
  - id: "reference-quality-and-durability-gaps"
    title: "Reference quality and durability remain the weak point in the public record"
    body: |
      BlueVoyant's customer proof is better described as directional than durable. The public case-study surface in the assigned pool is dominated by anonymized references such as a large municipality and an online travel agency, while Gartner Peer Insights shows one favorable MDR review but no critical-review depth on the category page. That leaves the public record thin on cohort durability, contract length, churn, and top-customer exposure even though the company clearly serves meaningful enterprise and government workloads. The gap matters because BlueVoyant's go-to-market appears concentrated in Microsoft-heavy and regulated environments, which can produce strong expansion economics when customers renew but can also hide vertical or channel concentration if management does not disclose it.
    claimRefs: ["CU007", "CU008", "CU014", "CU016"]
    tableRefs: ["TU003"]
