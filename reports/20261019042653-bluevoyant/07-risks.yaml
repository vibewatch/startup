    - type: missing-source
      severity: material
      topic: litigation-and-incident-history
      missingEvidence: Independent court, regulator, or incident-history evidence showing current litigation, enforcement, certification, or breach posture as of the 2026 run date.
      whyItMatters: Without it, regulatory and legal risk is driven by incomplete verification rather than by a clean independent record.
      diligencePath: Pull litigation schedule, regulator correspondence, current trust-center exports, and 24-month incident log during diligence.
      relatedQuestionRefs: [QR002]
      relatedTableRefs: [TR001]
    - type: conflicting-data
      severity: material
      topic: capital-structure-and-runway
      missingEvidence: Reconciled round history, current cash balance, burn, debt, and cap-table summary that explains the gap between the 2023 Series E narrative and FundedIQ's 2026 round record.
      whyItMatters: Financing opacity prevents clean underwriting of runway, dilution risk, and whether current scale was purchased with unusually high capital intensity.
      diligencePath: Request board-approved financing table, last-twelve-month cash flow, and lead-investor materials for the 2023 transaction.
      relatedQuestionRefs: [QR006, QR008]
    - type: private-evidence-only
      severity: material
      topic: customer-and-channel-concentration
      missingEvidence: Customer concentration, renewal, and channel-mix data by vertical, especially government, Microsoft-related motions, and regulated enterprise segments.
      whyItMatters: The chapter can identify likely dependency vectors, but not size their real revenue exposure or renewal sensitivity.
      diligencePath: Obtain ARR by top ten accounts, vertical cohorts, renewal cohorts, and channel-sourced pipeline/revenue splits.
      relatedQuestionRefs: [QR004, QR005]
      relatedTableRefs: [TR003]
    - type: missing-source
      severity: minor
      topic: delivery-quality-metrics
      missingEvidence: Current utilization, analyst coverage, SLA attainment, and post-acquisition product integration milestones for SOC and client-success operations.
      whyItMatters: Public hiring and SOC expansion show operating breadth, but they do not prove that service quality scales cleanly.
