      - ["CEO transition disrupts operating cadence during platform repositioning", "John Hernandez took over as CEO in May 2026 while the company emphasized AI-driven growth", Medium, Medium, Medium, Medium, "Need 12-month product, GTM, and retention KPI continuity across the transition"]
      - ["Global hiring outpaces training or management bandwidth", "Open roles span SOC, federal sales, client success, and engineering across multiple regions", Medium, Medium, Medium, Medium, "Need attrition, ramp-time, and manager-span data by function and geography"]
    notes: >-
      Risk statements combine factual source points with analyst framing; severity and mitigation maturity are directional judgments, not audited operating metrics.
    claimRefs: [CR001, CR005, CR007, CR008, CR009, CR013]
