      - ["Regulated-enterprise and government buying motion", "DIB / government / public-sector-adjacent customers", "Supports growth in higher-assurance environments", Unknown, "Long procurement cycles or control gaps slow conversion and renewals", Medium, "Request cohorts by regulated vertical and win-loss data for public-sector deals", Medium]
    notes: >-
