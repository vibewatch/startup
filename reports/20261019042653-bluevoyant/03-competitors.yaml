figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal map of the main solution classes competing with BlueVoyant on suite breadth versus
      provider-led operational ownership.
    data:
      xAxis:
        label: Solution breadth
        min: 1
        max: 5
        lowLabel: Narrow / single-lane
        highLabel: Multi-suite / platform-led
      yAxis:
        label: Provider-led operational ownership
        min: 1
        max: 5
        lowLabel: Customer-run / tool-led
        highLabel: Managed outcomes / service-led
      points:
        - label: BlueVoyant
          x: 4.5
          y: 4.5
          note: Official evidence spans MDR, TPRM, DRP, professional services, AI, and Conquest-enhanced regulated-market capabilities.
        - label: Multi-signal MDR leaders
          x: 4.7
          y: 4.2
          note: Independent evidence implies broader base coverage than BlueVoyant on SaaS, NDR, and OT.
        - label: Tool-only XDR / point control
          x: 2.1
          y: 1.3
          note: RFP Wiki distinguishes software-platform buying from MDR's analyst-led operating model.
        - label: Internal SOC + Microsoft Sentinel
          x: 3.0
          y: 1.4
          note: BlueVoyant can run in the customer's Sentinel tenant, so this remains a real substitute path.
        - label: Internal SOC + Splunk
          x: 3.0
          y: 1.4
          note: Splunk is the other explicitly named BlueVoyant core delivery environment in independent evidence.
        - label: Regulated-sector posture specialist
          x: 3.6
          y: 3.0
          note: Conquest-style compliance and risk-maturity specialists compete most directly in DIB and government use cases.
    approximationNotes: >-
      Coordinates are evidence-backed ordinal scores synthesized from assigned sources; they express
      relative position by solution class, not measured market-share or win-rate data.
    claimRefs: [CP001, CP004, CP007, CP010]
callouts:
  - calloutType: insight
    title: BlueVoyant's best-supported wedge is Microsoft plus adjacent cyber-risk modules
    body: >-
      The assigned evidence most clearly supports BlueVoyant where Microsoft depth, managed service
      delivery, and adjacent TPRM/DRP/regulatory posture matter together; that is a stronger wedge
      than trying to win on lowest-friction MDR procurement alone.
    claimRefs: [CP003, CP004, CP005, CP006, CP014]
  - calloutType: risk
    title: Public evidence is thinner than the platform story
    body: >-
      The platform narrative is broad, but the independent proof base is still light on named
      rival comparisons, realized pricing, and review volume, which keeps commoditization and
      incumbent-response risk higher than the suite story implies.
    claimRefs: [CP007, CP008, CP009, CP015, CP016]
