schemaVersion: report-v2
artifact: company-overview
slug: bluevoyant
runDate: 2026-10-19
company:
  name: BlueVoyant
chapter:
  number: 1
  title: Company Overview
  summary: >-
    BlueVoyant presents as a New York-based private cybersecurity platform built
    around MDR, third-party risk, and digital risk protection, with current
    public materials pointing to meaningful enterprise scale and
    Microsoft-centric delivery depth. The strongest recent evidence also
    highlights a May 2026 CEO transition and a November 2023
    acquisition-plus-Series-E step-up, while public funding, headcount, and
    customer metrics remain internally inconsistent enough to require diligence
    follow-up.
sections:
  - id: identity-and-operating-footprint
    title: Identity and operating footprint
    body: >-
      BlueVoyant's current public identity is clear even if some operating
      metrics are not. Company materials consistently anchor the business in New
      York and date its founding to 2017, while the homepage positions the
      platform around managed detection and response, third-party risk
      management, digital risk protection, and professional services. Those
      same official pages also present the company as materially scaled rather
      than pre-commercial, citing more than 600 employees, broad office
      coverage, and deep Microsoft-centric deployment claims. The more
      difficult issue is not whether BlueVoyant has reached relevance, but how
      much of the scale story is independently corroborated versus still
      dependent on company-issued or partner-amplified numbers.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO016
    tableRefs:
      - TO001
  - id: leadership-governance-and-key-person-risk
    title: Leadership, governance, and key-person risk
    body: >-
      Leadership continuity matters because BlueVoyant is still a private
      company with limited audited disclosure, so management transitions carry
      more weight than they would at a public peer. The clearest recent change
      is the May 2026 CEO handoff from co-founder Jim Rosenthal to John
      Hernandez, with Rosenthal remaining board chair and Tom Glocer shifting
      to vice-chairman. That combination suggests continuity in founder
      influence while also implying some concentration of institutional memory
      around a small set of senior leaders. Older profile material remains
      useful for role history and executive depth, but investors should treat
      it as background rather than a substitute for a current org chart, board
      committee map, or documented succession plan.
    claimRefs:
      - CO001
      - CO007
      - CO008
      - CO009
    tableRefs:
      - TO002
  - id: funding-milestones-and-refresh-risk
    title: Funding milestones and refresh risk
    body: >-
      The milestone record shows a business that kept broadening its platform
      before the current leadership transition. Public materials support a 2023
      Conquest Cyber acquisition, a linked Series E capital raise, and a July
      2024 Cyber Defense Platform launch framed around integrating internal,
      external, and supply-chain defense. They also support continued European
      operating expansion and a current-private status with no official IPO
      timeline. What remains unresolved is the capital history at the aggregate
      level: accessible sources disagree on total dollars raised and even on
      current workforce size, which means later valuation and financial
      chapters should not inherit a clean funding or headcount number from this
      chapter without primary reconciliation.
    claimRefs:
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
      - CO016
    tableRefs:
      - TO003
    figureRefs:
      - FO001
  - id: diligence-implications
    title: Diligence implications for later chapters
    body: >-
      For the rest of the report, the dependable ground truth is identity,
      product scope, broad operating relevance, the 2023 acquisition, the 2024
      platform consolidation, and the 2026 leadership change. The less
      dependable layer is the exact commercialization scale that investors
      would normally want for underwriting a late-stage cyber platform:
      lifetime capital raised, any current unicorn valuation, paying-customer
      definitions, and precise headcount. Because even friendly external
      references conflict with one another, later chapters should treat public
      scale numbers as ranges or directional signals unless they can be tied to
      more primary evidence. That is especially important for valuation work,
      where private-company opacity can make a clean-looking figure more
      misleading than a documented gap.
    claimRefs:
      - CO004
      - CO005
      - CO014
      - CO015
      - CO016
