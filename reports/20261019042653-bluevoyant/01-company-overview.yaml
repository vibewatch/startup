    rows:
      - ["John Hernandez", "CEO", "Primary operating owner of the post-May-2026 strategy, platform execution, and go-to-market scaling story.", "Request first-year operating plan, leadership bench, and KPI cadence under the new CEO."]
      - ["James Rosenthal", "Co-founder and Chairman", "Retains board-level continuity and likely meaningful informal influence over strategy and investor narrative.", "Clarify board powers, founder ownership, and any ongoing executive involvement beyond chair duties."]
      - ["Liberty Strategic Capital", "Existing investor leading 2023 Series E add-on", "Named as lead for the financing that accompanied the Conquest acquisition, making it central to pricing and governance questions.", "Obtain round terms, ownership, liquidation preferences, and any board or observer rights."]
      - ["ISTARI", "Existing investor and cybersecurity adviser founded by Temasek", "Named in the 2023 financing syndicate, suggesting strategic value beyond pure capital.", "Confirm check size, governance rights, and how strategic support shows up in pipeline or product decisions."]
      - ["Microsoft ecosystem", "Award and solution-channel dependency", "Repeated Microsoft-specific claims, awards, and deployment counts suggest material ecosystem leverage in delivery and positioning.", "Test how much growth, services margin, and product roadmap depend on Microsoft tooling and co-sell access."]
    notes: This map is intentionally partial because the assigned pool does not include a cap table, debt schedule, or full investor list; it focuses on stakeholders explicitly visible in retained sources.
    enumerationScope:
      coverage: partial
      basis: Stakeholders are limited to parties explicitly named in retained financing, leadership, and platform sources rather than a complete ownership or governance registry.
    claimRefs:
