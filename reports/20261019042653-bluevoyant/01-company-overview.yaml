      - CO008
      - CO010
      - CO012
      - CO013
callouts:
  - calloutType: insight
    title: Solid identity, soft precision
    body: >-
      BlueVoyant's existence, category, geography, leadership transition, and
      major milestones are easy to verify, but its exact late-stage scale is
      not. That makes this chapter reliable for orientation and milestone
      sequencing, but only partly reliable for underwriting exact
      revenue-adjacent or valuation-adjacent metrics.
    claimRefs:
      - CO001
      - CO007
      - CO009
      - CO016
  - calloutType: risk
    title: Metric conflict is the main overview risk
    body: >-
      The biggest company-overview risk is not a visible existential event in
      the assigned pool; it is the combination of private-company opacity and
      internally inconsistent public numbers around total capital raised,
      customer count, and employee count. Later financial and valuation work
      should preserve those conflicts rather than smoothing them away.
    claimRefs:
      - CO004
      - CO005
      - CO014
      - CO015
      - CO016
