    rows:
      - ["John Hernandez", CEO, "Former Quest Software Microsoft Platform Management leader; earlier leadership roles at Genesys, Salesforce, IBM, and Cisco.", "Adds enterprise software scaling and Microsoft-platform relevance after the founder era.", "High, because the 2026 transition concentrates execution expectations on a new CEO."]
      - ["James Rosenthal", "Co-founder and Chairman of the Board", "Former Morgan Stanley COO and previously responsible for cybersecurity at the firm.", "Links BlueVoyant's origin story to regulated-enterprise cyber operations and board access.", "High, because he remains the clearest continuity link after leaving the CEO seat."]
      - ["Thomas Glocer", "Co-founder and Vice Chairman of the Board", "Former CEO of Thomson Reuters and Reuters; managing partner of Angelic Ventures.", "Adds capital-markets, media, and enterprise-governance experience at board level.", "Medium, because influence appears strategic rather than day-to-day operational."]
      - ["Jim Penrose", "Last publicly profiled as COO", "Former NSA executive with cyber-operations experience, per CIO Bulletin's company profile.", "Illustrates depth in national-security and operations leadership, but the source is older and not current-org definitive.", "Medium, because current remit should be re-verified before relying on it in operational diligence."]
    notes: This is a partial public roster built from the company page, the May 2026 CEO release, and an older profile article; it is not a substitute for a current management org chart or board committee list.
    enumerationScope:
      coverage: partial
      basis: Publicly named founder, board, and executive roles visible in the assigned company page, CEO transition release, and retained profile coverage as of the 2026 refresh run.
    claimRefs:
