evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      Primary financing history or investor-confirmed cap table support that reconciles Series E proceeds, lifetime
      capital raised, and any current private valuation.
    whyItMatters: >-
      Valuation and return underwriting are unreliable if cumulative capital and current mark are inferred from
      inconsistent public references.
    diligencePath: >-
      Request financing deck history, signed term sheets, and investor ownership tables from the company or lead
      investors.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: scale-metrics
    missingEvidence: >-
      A management-defined current KPI pack covering paying-customer count, active countries, employee count, and the
      basis for 38 million daily alerts.
    whyItMatters: >-
      Later customer, financial, and valuation chapters need consistent definitions rather than mixing marketing counts,
      partner summaries, and tracker estimates.
    diligencePath: Request a current board or monthly operating dashboard with metric definitions and reporting dates.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: minor
    topic: governance
    missingEvidence: Current board composition, committee structure, observer rights, and founder/investor control provisions.
    whyItMatters: >-
      The leadership transition is visible, but governance power and investor influence remain only partially observable
      from public materials.
    diligencePath: Request the latest board deck appendix, governance chart, and post-Series-E governance documents.
    relatedQuestionRefs:
      - QO002
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      An independent market-size source that isolates MDR, third-party risk, digital risk, and posture-management spend
      for BlueVoyant's target geographies and buyer set.
    whyItMatters: >-
      Without that spend-based lens, the chapter can show adoption proxies and scope but cannot defend a precise TAM,
      SAM, or SOM in dollars.
    diligencePath: >-
      Pull current analyst or public-company disclosures that separately size MDR, TPRM, and digital-risk spend, then
      reconcile them into an evidence-backed segmented model.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: customer-count
    missingEvidence: >-
      A reconciled current customer metric that defines whether BlueVoyant is counting customers, clients, contracts, or
      product deployments.
    whyItMatters: >-
      Dated claims of more than 900 clients and more than 1,000 customers indicate growth but do not establish a current
      count or a stable denominator for a SAM-to-SOM narrative.
    diligencePath: >-
      Request management's current customer-count definition, historical bridge, and segmentation by product family and
      geography.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: ai-adoption
    missingEvidence: >-
      Independent proof of deployment scale, pricing, and conversion impact for BlueVoyant AI and related Microsoft-led
      AI offerings.
    whyItMatters: >-
      The newest market-expansion narrative in the pool leans on AI positioning, but the chapter cannot treat that as a
      validated growth driver without third-party adoption evidence.
    diligencePath: >-
      Obtain customer references, independent case studies, or product-level adoption metrics tied to the 2026 AI and
      Microsoft-related launches.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: named-alternative-benchmarks
    missingEvidence: >-
      Direct source-backed product, pricing, and customer-segment evidence for Bitdefender, Cisco Systems, and
      CrowdStrike in the same run.
    whyItMatters: >-
      Named alternatives appear in Gartner, but the retained pool does not support a real head-to-head comparison on
      scope, pricing, or win rate.
    diligencePath: >-
      Pull each named alternative's official MDR packaging, pricing proxies, and independent review evidence into a
      dedicated competitor benchmark pack.
    relatedQuestionRefs:
      - QP001
      - QP008
    relatedTableRefs:
      - TP001
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Realized enterprise pricing, discounting, bundle boundaries, and renewal terms for BlueVoyant and its named
      rivals.
    whyItMatters: >-
      Public evidence shows cost drivers but not the negotiated commercial reality that determines whether BlueVoyant
      wins or loses against peers.
    diligencePath: >-
