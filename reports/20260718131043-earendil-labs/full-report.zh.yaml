  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 变现模式：先合作，后产品收入
        blocks:
          - type: paragraph
            body: >-
              公开证据支撑的是一套变现架构，而不是收入表。Earendil 现在或近期看起来靠战略合作、授权首付款经济性、里程碑期权，以及最终的特许权使用费赚钱，同时把内部项目推进到临床。April 2025 和
              January 2026 的 Sanofi 协议，是这个模式最清晰的证明。它们显示 Earendil 靠 AI
              驱动的生物药发现来变现，路径是对外授权和更广的平台使用权，而不是广泛客户数故事，也不是任何可见的自助式软件业务。同样重要的是缺失项：没有公开证据显示已确认产品销售、经常性平台
              ARR，甚至没有方向性的年收入数字。因此，财务章节必须把公司看作合作驱动、商业化前的生物科技公司；当前经济性主要通过融资和交易结构可见，而不是通过经营报表可见。
