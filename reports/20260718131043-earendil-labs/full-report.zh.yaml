              申报。这与狭窄软件或数据供应商的成本基础不同。公开来源没有披露毛利率、资本开支、营运资本或烧钱速度，因此无法量化确切成本结构。但方向上，支出组合很可能包括湿实验室运营、转化开发、CMC
              工作、蛋白工程、算力和监管准备。融资轮本身的规模，是一个间接证据：管理层和投资人预期的是资本密集型扩张期，而不是轻量软件扩张阶段。缺少利润率数据也意味着，投资人无法判断平台规模化后每个项目是否变得更便宜，还是只是为了保持广度而吃掉更多资本。
