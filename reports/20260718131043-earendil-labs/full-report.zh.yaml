  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与当前价格
        blocks:
          - type: paragraph
            body: >-
              作为公司概念，Earendil 很容易让人喜欢；作为便宜资产，则难得多。战略正面因素很明显：一轮非常大的融资、Sanofi
              反复验证、领先资产正接近更有意义的临床证明窗口，以及一个有可能创造不止一个项目的平台故事。这些都是公司拿到独角兽估值的真实理由。但价格很重要。在 $1B+
              估值下，投资人不再是免费押注一个科学期权；他们已经在为未来执行的一大部分买单。结论因此是混合的。Earendil
              看起来明显强于典型概念阶段生物科技公司，但公开证据仍把太多关键输入留白——收入、已实现现金、续约深度、股权结构表条款和治理成熟度——不足以支撑激进买入。这就是本章的关键不对称：公司质量强，不自动等于估值吸引力强。
