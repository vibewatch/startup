      - number: '2.3'
        title: 谁买、怎么买，以及为什么采用仍然很难
        blocks:
          - type: paragraph
            body: >-
              Earendil
              这类平台的潜在买方并不同质。大药企是最清晰的预算持有者，因为它能为平台集成付费，能同时跑多个生物药项目，也能变现合作资产和内部资产。新兴生物科技公司会看重加速效果，但资产负债表往往撑不起全栈、实验室集成式关系。CRO、CDMO
              和研究机构作为工作流用户与验证渠道很重要，但通常不是最有钱的战略交易对手。竞争格局也说明，市场预期已越过纯软件。Generate、Recursion、Insilico、Absci、AbCellera 和
              Relay 都在讲平台加管线，或平台加精准医学的故事。也就是说，买方越来越需要看到 AI
              公司能交付分子，而不只是交付模型。因此，采用不只取决于聪明算法；胜出的平台需要生物数据、湿实验反馈回路、监管可信度，以及熬过漫长临床周期的耐心。这就是市场有吸引力但难打的原因。
