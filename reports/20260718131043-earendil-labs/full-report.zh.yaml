              等上市同行有方向性参考价值，因为它们显示市场奖励的是证明、披露和耐久客户价值，而不只是 AI 叙事。独角兽榜单文章和生物科技融资追踪解释了为什么当前私有估值在 2026
              年可以成立，但不能证明它便宜。基准情景下，如果当前势头延续，Earendil
              大致配得上今天的估值。悲观情景下，较弱的临床或客户结果会把公司拉回独角兽线以下。乐观情景下，合作伙伴扩张和差异化临床证明可能支撑明显更高的价值。这个框架很宽，但业务本身也仍然很宽。必须做情景分析，正是因为证据基础好到足以支撑真实上行，却又不够精确，无法把区间压缩成狭窄目标。结果分布很宽，本身就是进入价格需要保持纪律的理由。
