      - number: '2.4'
        title: 增长驱动、约束与受证据限制的判断
        blocks:
          - type: paragraph
            body: >-
              自上而下的增长驱动很明显：AI 药物发现预算快速扩张，生物药板块增速快于小分子支持，研发生产率承压，中国牵引 / 跨境交易让外部创新搜索成本居高不下。IQVIA
              明确称，行业正把投资和交易集中到高价值科学和中国牵引活动上，这与 Earendil
              的定位相当匹配。但自下而上的约束同样真实。临床开发周期拉长，买方证明标准上升，宽口径市场报告常把软件、服务和结果型经济性打包进一个 TAM。TL1A 本身是强靶点类别，但也很拥挤：duvakitug 已进入
              Phase 3，Absci 也把一个 AI 设计的抗 TL1A 项目推进到 Phase 1。结果是：这个市场明确存在且在增长，但不能只靠通用 TAM 幻灯片来支撑 Earendil
              的投资判断。机会真实；可服务和可获取份额仍取决于公开记录尚未披露的商业模式细节。
