      - number: '1.3'
        title: 资本形成、Sanofi 验证与里程碑节奏
        blocks:
          - type: paragraph
            body: >-
              Earendil 的公开崛起，锚定在少数几笔体量很大的融资和合作事件上。March 2026 融资公告披露，公司从一个财团获得 $787 million 新资本，投资方包括 Dimension
              Capital、DST Global、Sanofi、INCE Capital、Luminous Ventures、Miracle Capital，以及 Hillhouse/Pfizer Biotech
              Development Fund。公告还把 Earendil 的 AI 栈描述成生产引擎，而不是单一发现工具，并称平台已经生成 40 多个项目。Sanofi 关系作为外部验证信号更重要。April
              2025，Sanofi 以 $125 million 首付款、最高 $1.72 billion 里程碑价值加特许权使用费，授权引进 HXN-1002 和 HXN-1003。January
              2026，双方又扩展为更广合作，价值最高 $2.56 billion。即便考虑非现金里程碑和漫长兑现窗口，放在 Earendil 这个年龄段的私营公司身上，这也是异常强的合作伙伴证据。
