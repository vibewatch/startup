      - CR014
      - CR020
      - CR022
      - CR029
      - CR031
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: standard
    summary: 当前结论基于强战略验证，但信息披露和集中度仍压着估值，因此对价格敏感。
    data:
      nodes:
        - id: proof
          label: 融资 + Sanofi 验证
        - id: optionality
          label: 平台延展空间
        - id: opacity
          label: 披露 / 集中度拖累
        - id: price
          label: $1B+ 入场估值
        - id: rec
          label: 继续研究
      edges:
        - from: proof
          to: price
        - from: optionality
          to: price
        - from: opacity
          to: price
        - from: price
          to: rec
    claimRefs:
      - CV002
      - CV003
      - CV019
      - CV020
      - CV026
      - CV028
      - CV031
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 让估值摆动最大的变量是新客户验证、临床差异化、里程碑现金兑现，以及上市可比公司估值压力。
    data:
      items:
        - label: 第二个大客户出现
          value: 2
        - label: HXN-1001 差异化改善
          value: 2
        - label: 现金兑现 / 里程碑验证改善
          value: 1
        - label: 上市 AI 生物科技可比公司估值收缩
          value: -2
        - label: IPO 准备被迫提前
          value: -2
    approximationNotes: 这些数值以十亿美元计，表示相对当前私募估值的方向性估值影响分数；来源是情景表，而非管理层指引。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV033
      - CV034
      - CV035
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据支持较宽的战略估值区间；当前估值大致落在基准情景的低到中段，并非明显低估。
    data:
      items:
        - label: 悲观
          low: 0.6
          mid: 0.75
          high: 0.9
        - label: 基准
          low: 1
          mid: 1.2
          high: 1.4
        - label: 乐观
          low: 1.8
          mid: 2.2
          high: 2.6
        - label: 当前估值
          low: 1
          mid: 1
          high: 1
    approximationNotes: 数值以十亿美元计，反映情景加权后的战略估值区间，不代表经审计财务结果。
    claimRefs:
      - CV014
      - CV015
      - CV016
      - CV031
      - CV036
      - CV037
      - CV038
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 式打分显示，科学实力和合作伙伴画像有吸引力，但估值透明度弱、集中度高，抵消了优势。
    data:
      items:
        - label: 市场 / 战略重要性
          value: 4
          max: 5
        - label: 产品 / 平台验证
          value: 4
          max: 5
        - label: 客户验证质量
          value: 4
          max: 5
        - label: 财务透明度
          value: 2
          max: 5
        - label: 风险画像
          value: 2
          max: 5
        - label: 当前估值下的吸引力
          value: 2
          max: 5
        - label: 整体证据质量
          value: 3
          max: 5
    approximationNotes: 评分为定性判断且对价格敏感；估值吸引力低，并不等于公司质量低。
    claimRefs:
      - CV019
      - CV020
      - CV026
      - CV028
      - CV029
      - CV030
      - CV031
      - CV041
