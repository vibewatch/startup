              理解 Earendil Labs，最稳妥的方式是把它看作一家跨境生物药创业公司：对外身份比法律和运营地图更干净。当前活跃官网是 earendil.bio，earendillabs.com
              停在域名销售页，Helixon.com 则显示维护页。这很关键，因为投资人或合作伙伴从更广的网络接触公司时，合理问题就是哪个域名、哪个实体才是当前主体。抓取材料里最强的注册类证据，是 Bizapedia
              对一家活跃 Delaware 公司、December 2024 备案的摘要。独立媒体随后补上运营版图：BioPharma Dive 称公司注册于 Delaware、办公室在 Beijing；BioSpace 和
              The Medicine Maker 则称其 Delaware 注册、总部位于 Beijing。最稳妥的综合判断是：Earendil 使用美国法律主体和以中国为中心的运营基地；更细的法律实体图仍披露不足。
