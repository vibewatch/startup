  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局结构：平台同行与机制竞争者
        blocks:
          - type: paragraph
            body: >-
              Earendil 在两个重叠但不同的竞技场竞争。第一个是 AI 生物药平台格局，AbCellera、Absci、Generate Biomedicines、Insilico
              Medicine、Recursion，以及程度较低的 Relay，都在争夺资本、合作伙伴和买方注意力。第二个是围绕炎症性肠病和 TL1A 的机制特定赛道，Sanofi/Teva、Roche、Merck
              系免疫学项目和 Absci 更贴近领先项目问题。这个区分很重要：有些竞争者更适合作为平台信任和融资基准，另一些更适合衡量 Earendil 围绕 HXN-1001 赢得临床心智有多难。几乎每个 AI
              生物药同行的公开材料，现在都把平台和管线放在一起讲，竞争标准不再是“有意思的 AI”，而是“拿出资产、合作伙伴质量，或公开市场耐久度”。Earendil 有清晰的 Sanofi
              验证，但它进入的赛场里，基准叙事已经相当成熟。
            claimRefs:
              - CP001
              - CP002
              - CP013
              - CP024
              - CP036
