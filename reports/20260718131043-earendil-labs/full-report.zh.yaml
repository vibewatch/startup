  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：平台软件、生物药发现与资产价值
        blocks:
          - type: paragraph
            body: >-
              Earendil 并不干净地落在某个熟悉 SaaS 类别里。最接近的自上而下桶是 AI 药物发现平台市场，但这个口径仍低估了公司想变现的东西。Precedence Research
              将这个市场定义为卖给药企、生物科技公司、CRO 和研究机构的软件、数据、算力与实验室集成服务。Earendil
              符合这一定义，但公司也在搭建内部资产，因此机会横跨平台收入和管线价值捕获。MarketsandMarkets 用 2025 年 $30.58 billion 药物发现技术市场提供了更宽的邻近视角，Global
              Market Insights 则给出更窄的 AI 药物发现估计。正确框架应当分层：核心 AI 发现平台总可用市场（TAM）、更宽的发现技术预算池，以及按疾病和靶点划分的资产机会；如果 Earendil
              自有生物药项目推进顺利，资产端可以创造不成比例的价值。这个分层框架既避免夸大一个泛化巨型 AI 市场，也避免低估内部药物资产的经济意义。
