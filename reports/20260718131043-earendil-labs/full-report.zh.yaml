      - number: '3.4'
        title: 护城河耐久度、拥挤风险与可能取代 Earendil 的因素
        blocks:
          - type: paragraph
            body: >-
              护城河图景是混合的。耐久的一面是，能把自有生物数据、湿实验吞吐量、合作伙伴入口和临床转化结合起来的公司，应当比只把自己包装成 AI
              原生的公司更有优势。脆弱的一面是，许多竞争者现在都在讲非常相似的平台加管线故事，叙事本身更容易商品化。对 Earendil 的领先项目来说，紧迫威胁不是通用模型商品化，而是靶点类别拥挤。Duvakitug 已在
              Phase 3，Absci 也有一个 AI 设计的抗 TL1A 抗体处在 Phase 1。这意味着 Earendil 必须证明自己能拿到差异化疗效、便利性或执行速度，而不只是证明 TL1A
              重要。更大的战略风险在于，大药企越来越能把更多 AI 工作内部化，同时选择性购买外部科学。Earendil
              仍有胜出空间，但它竞争的领域里，多条战线的证明标准都在同时抬升。公开市场可比公司也很重要，因为它们揭示了公司一旦寻求更广泛投资者资本，披露质量会多快进入护城河讨论。
