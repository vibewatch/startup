      - number: '3.3'
        title: 能力、切换成本与获得市场力量的路径
        blocks:
          - type: paragraph
            body: >-
              公开竞争者页面显示，市场不再奖励单独的建模主张。胜出的平台现在需要数据、实验检测集成、转化生物学、资本，以及把发现产出转化为资产或合作交易的耐心。这样的结构会形成有意义的切换成本：买方一旦把平台嵌入湿实验工作流和内部项目语境，平台就同时嵌进流程和资产结果。管线所有权会再增加锁定效应，因为价值通过分子、特许权使用费或里程碑经济性捕获，而不是只靠软件席位。分发力量也不是企业
              SaaS
              那一套。这里最可信的分发楔子，是战略药企合作、临床证明和公开市场耐力。因此，公开材料里的定价反而显得异常不透明。买方不是在透明菜单之间选择，而是在证明系统、团队和长周期交付能力之间选择。这让竞争尽调更少是在读功能列表，更多是在判断谁能反复把平台主张转化为持久的合作伙伴信任和资产进展。
