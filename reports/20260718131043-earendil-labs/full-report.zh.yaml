              第二组风险来自结构和控制可见度，而不是任何已知执法事件。公开来源显示有 Delaware 实体，但活跃官网走的是 Helixon 体系基础设施，对精确运营边界说明有限。这留下了 IP 归属、数据权利，以及跨美国
              / 中国版图治理的问题。与此同时，公开技术和合规表面偏轻。抓取来源没有提供正式安全认证包、事件历史，或采购就绪的数据控制叙事。这些缺口在私人尽调中也许可以管理，但会给新合作和任何未来 IPO
              叙事制造摩擦。这些都不能证明隐藏弱点；但它意味着外部投资人仍要承受法律结构、隐私姿态和运营控制上的有意义不透明。私募投资人只有看到管理层迅速把这种不透明转化为具体尽调材料，才能把风险视为可控。FDA BLA
              流程也提醒一点：即便临床数据很强，没有制造和质量准备也不够。
