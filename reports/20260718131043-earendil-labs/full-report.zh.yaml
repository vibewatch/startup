            body: >-
              财务建模时，Earendil 应按研发重型公司处理。公司在跑 AI 原生生物药发现引擎，维持高通量生物学，增加跨学科团队，并把多个项目推向临床。HXN-1001 的 Phase 1 披露确认，Earendil
