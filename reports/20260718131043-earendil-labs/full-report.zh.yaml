              看起来是最成熟的抗体发现基础设施基准。Absci 尤其重要，因为它把上市公司可见度、生物药聚焦和 AI 设计的抗 TL1A 项目组合在一起。Generate
              说明，当平台加生物药叙事配上可见临床项目时，市场可以给出多强奖励。Recursion 和 Insilico 在模态上略宽，但仍是争夺投资人注意力和战略合作可信度的重要平台加管线可比公司。Relay
              在生物药模态上没那么直接，却仍争夺同一类专业资本池。对 Earendil 的竞争含义很直接：上市同行已经把披露、证明和投资者沟通的门槛推高，而 Earendil 当前还没有达到。
