    title: 产品与技术
    sections:
      - number: '5.1'
        title: Earendil 看起来交付什么
        blocks:
          - type: paragraph
            body: >-
              公开产品故事不是单个 API，也不是单个治疗资产。Earendil 把自己呈现为一个生物药研发引擎，组合 AI
              驱动的序列生成、抗体性质预测、高通量实验验证和迭代式自我改进。技术资源包和官方文案反复把它框定为蛋白治疗药物研发，而不是通用生命科学软件。这很关键，因为买方隐含购买的是更快、更好的生物药项目，而不只是计算能力。公开来源还显示，平台的商业表达可以不止一种：内部管线生成、对外授权双特异性资产，以及更广的发现合作。因此，这个产品应被理解为一套整合发现和开发的运营模型；它的输出是治疗项目，而不只是模型访问权。这个框架与
              Sanofi 使用 Earendil 的方式一致：先是具名资产，再是更广平台合作。它也意味着，投资人应把产品当作资本密集型系统评估，其价值用资产产出质量衡量，而不能只看软件使用指标。
