      - number: '2.2'
        title: IBD 疾病负担与靶点类别需求
        blocks:
          - type: paragraph
            body: >-
              疾病侧需求已经强到值得建模，即便还没进入定价假设。Crohn's & Colitis Foundation 将炎症性肠病（IBD）描述为慢性胃肠炎症，克罗恩病和溃疡性结肠炎是两大主要形态。2026 Curr
              Opin Pharmacol 综述称，30% to 40% 患者仍会对现有疗法无应答，或在一段时间后失去应答；这正是让新生物药类别保持商业意义的残余需求。同一综述将 TL1A
              抑制和双特异性抗体列为尤其有前景的下一代路径，Frontiers 2026 文章也强化了一个判断：抗 TL1A 工程化仍是活跃科学前沿。Sanofi February 2026 的 duvakitug
              更新补充了有用的负担统计，引用全球约 4.9 million 例 IBD 病例，且发病率仍在增长。落到 Earendil，领先 HXN-1001 和 Sanofi
              合作双特异性项目瞄准的是一个大、临床重要、仍服务不足的需求池，而不是免疫学的小众支路。
            claimRefs:
