companyProfile:
  summary: >-
    Earendil Labs 是一家私有 AI 生物药公司，Delaware 母公司叠加中国研究版图，商业模式把内部治疗项目和外部药企合作放在一起。公开证据显示，平台真实存在：公司宣称项目总数超过 40 个，官网可见项目 19
    个，领先抗 TL1A 资产正走向 Phase 2，两项大型 Sanofi 合作覆盖具名双特异性资产和更广的发现工作。战略逻辑有吸引力，但公开投资判断仍卡在几处：经济性披露稀疏、客户广度偏窄、披露成熟度还在补课。
