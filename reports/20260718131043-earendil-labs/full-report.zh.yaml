            body: >-
              剩下的功课并不难列，难在拿到答案。投资人需要分清已落袋现金和理论里程碑价值，需要看清 Sanofi 之外的客户分散度，
              还要确认治理和股权结构条款，并拿到足够运营细节，判断公司是否真的在为公开市场或大规模后期私募阶段做准备。
              在这些问题回答之前，当前估值更像合理偏高，且高度依赖执行。答案补齐后，公司才可能从「有意思但未明显低估」转为更可操作的机会。 换句话说，Earendil
              现在要证明的，不再是公司是否真实，而是相对未知项是否足够便宜。在此之前，投资决策同样取决于缺失的信息， 而不只是已经亮眼的部分。即便是积极投资人，这种不对称也足以支持谨慎。
