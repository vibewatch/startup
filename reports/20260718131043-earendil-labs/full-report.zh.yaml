    summary: 临床或合作伙伴受挫，会快速传导到融资、客户信心和估值。
    data:
      nodes:
        - id: clinical
          label: 临床数据
        - id: partner
          label: Sanofi 关系
        - id: cust
          label: 客户信心
        - id: cash
          label: 融资选项
        - id: val
          label: 估值
        - id: ipo
          label: IPO 路径
      edges:
        - from: clinical
          to: partner
        - from: clinical
          to: val
        - from: partner
          to: cust
        - from: partner
          to: cash
        - from: cash
          to: ipo
        - from: val
          to: ipo
    claimRefs:
      - CR003
      - CR011
      - CR013
      - CR021
      - CR027
      - CR035
      - CR038
      - CR039
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Earendil 对交易对手、公开市场环境、法律边界清晰度和内部执行的依赖，不亚于对模型质量的依赖。
    data:
      nodes:
        - id: sanofi
          label: Sanofi
        - id: helixon
          label: Helixon 边界
        - id: reg
          label: 监管 / 隐私义务
        - id: leaders
          label: 领导层梯队
        - id: markets
          label: 资本市场
        - id: assets
