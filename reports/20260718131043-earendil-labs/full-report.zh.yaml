        title: 客户看起来是谁
        blocks:
          - type: paragraph
            body: >-
              公开证据不支持多元化客户基础，只支持一个清晰具名的外部客户：Sanofi。这段关系至少横跨两个不同商业事件——April 2025 对两个具名双特异性资产的授权交易，以及 January 2026
              面向更多双特异性抗体的发现合作。抓取材料里的其他内容，更适合理解为融资、生态信号或内部平台使用，而不是外部客户广度。这个区分很关键，因为 Earendil
              卖的是药企合作模式，一个锚定账户可以验证平台，同时也会制造集中风险。可能买方不是一支现场商业化团队，而是 Sanofi 的免疫学和生物药研发组织；这符合交易里的自身免疫和炎症疾病焦点，也匹配 Sanofi
              的公开科学战略。放到客户工作流里看，Earendil 还没有在销售一个广泛打包的软件产品；它是在把科学产出和发现访问权卖给高度筛选的企业买方。就当前阶段而言，这已经很有商业含金量。
