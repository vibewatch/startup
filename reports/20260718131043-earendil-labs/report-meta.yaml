companyProfile:
  summary: Earendil Labs is a private AI-biologics company operating across a Delaware parent and China-linked research footprint, with a business model that combines internal therapeutic programs and external pharma partnering. Public evidence points to a real platform with more than 40 total programs claimed, 19 publicly visible website programs, a lead anti-TL1A asset moving toward Phase 2, and two large Sanofi collaborations spanning named bispecific assets and broader discovery work. The strategic case is compelling, but public underwriting remains constrained by sparse economics, narrow customer breadth, and still-developing disclosure maturity.
