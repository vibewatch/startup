  topStrengths:
  - Blue-chip partner validation from Sanofi across both named assets and broader discovery collaboration.
  - Unusually large 2026 financing round for stage, reducing near-term survival risk.
  - Credible AI-plus-biology platform narrative with visible pipeline breadth across immunology and oncology.
  - Multiple paths to value creation through internal assets, partnered programs, milestones, and royalties.
  topRisks:
  - Public proof remains concentrated in Sanofi and the lead TL1A story, creating customer and narrative concentration risk.
  - Realized economics, milestone cash, and cap-table terms remain undisclosed, limiting valuation confidence.
  - Cross-border structure and Helixon boundary questions add governance, IP, and diligence friction.
  - IPO-readiness appears more narrative than operationally proven from public disclosures.
  unresolvedGaps:
  - Realized cash, milestone timing, royalty assumptions, and the share of value already contracted versus theoretical.
  - Customer diversification beyond Sanofi and whether additional major counterparties exist under NDA.
  - Governance depth, board structure, investor rights, and liquidation preferences behind the 2026 round.
  - Security, data-rights, and compliance materials needed for public-market or procurement-grade diligence.
  - Exact HXN-1001 and partnered-asset catalyst calendar needed to tighten scenario probabilities.
