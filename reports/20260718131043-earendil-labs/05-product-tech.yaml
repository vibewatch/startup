- id: platform-architecture-and-pipeline
  title: Architecture, workflow, and disclosed pipeline
  body: The current website bundle gives a surprisingly concrete—if still partial—view of Earendil's architecture. The Foundational Protein AI Platform spans sequence, structure, interaction, target information, biophysics, and function. The High-Throughput Biology Platform then extends into lead generation, screening and profiling, engineering, and production. In other words, Earendil publicly claims a stack that can move from target context to antibody design to experimental validation. The pipeline bundle supports that interpretation. It shows 19 visible programs across immunology and oncology, with HXN-1001 furthest advanced as a Phase 1 TL1A monoclonal antibody and a broad bench of IND-enabling assets behind it. This architecture is productively broader than a single-model company, but it also means execution depends on more than algorithms; the wet-lab and translational layers are inseparable from the product promise.
  claimRefs:
  - CE004
