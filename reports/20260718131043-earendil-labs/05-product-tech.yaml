- id: trust-surface-and-gaps
  title: Trust surface, maturity questions, and technical diligence gaps
  body: The weakest part of the product-tech story is not the core scientific ambition but the public trust surface around it. The website is live, yet much of the substantive content is only visible through a JavaScript bundle. The contact path routes through Helixon.com, which itself currently shows a maintenance page, and earendillabs.com is parked. No fetched source exposes a status page, implementation guide, uptime history, public security certification set, or detailed deployment documentation. None of this disproves the platform. It simply means external diligence still depends heavily on management materials rather than on a robust public technical surface. Relative to public peers like Generate, Insilico, and Recursion, Earendil is lighter on operational documentation and heavier on narrative positioning. The key remaining diligence questions therefore concern productivity evidence, data rights, security controls, and the exact IP and operating boundary between Earendil and Helixon.
    That contrast does not negate Earendil's science, but it does raise the proof bar for private diligence materials and partner references.
