  evidenceGaps:
  - type: missing-source
    severity: material
    topic: platform productivity proof
    missingEvidence: Independent benchmarks for hit rate, cycle-time reduction, developability improvement, or successful transition rates.
    whyItMatters: The public technology narrative is coherent, but performance claims remain mostly company-described.
    diligencePath: Request program-level benchmarking and compare against both historical internal baselines and external peers.
    relatedQuestionRefs:
    - QE020
    relatedTableRefs:
    - TE002
  - type: missing-source
    severity: material
    topic: deployment reliability
    missingEvidence: Uptime, implementation, support, or SLA evidence for platform users or partners.
    whyItMatters: Operational maturity matters if Earendil intends to be a repeat platform partner, not only an asset creator.
    diligencePath: Request support metrics, implementation case studies, and partner references.
    relatedQuestionRefs:
    - QE021
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: IP and entity boundary
    missingEvidence: Clear IP ownership and operating-boundary explanation between Earendil and Helixon.
    whyItMatters: The contact path and affiliate language imply a close tie, but public sources do not define the boundary cleanly.
    diligencePath: Request legal entity chart, IP assignment documents, and shared-service explanation.
