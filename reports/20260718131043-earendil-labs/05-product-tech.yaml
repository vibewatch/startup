- id: asset-level-proof-and-roadmap
  title: Asset-level proof, external validation, and roadmap signals
  body: 'Public technical proof is strongest where Earendil has attached named assets and partner behavior to the platform. HXN-1001 is a real example rather than a concept slide: it has a public Phase 1 initiation release, stated formulation advantages for subcutaneous dosing, and later public claims of Phase 2 readiness. HXN-1002 and HXN-1003 matter because Sanofi licensed them, creating third-party validation that the platform can output partnership-grade bispecifics. The roadmap also extends beyond IBD. The visible pipeline includes asthma and COPD programs, atopic-dermatitis assets, B-cell disease programs, and multiple oncology assets. Meanwhile the 2026 financing release promises multiple IND submissions in 2026 and 2027. The resulting picture is not of a one-asset biotech but of a platform trying to convert many programs into clinical and partnering events on a compressed timeline. Investors should read those milestones as evidence of translation, but not yet as proof that the platform
    can repeatedly industrialize every program family at the same pace.'
  claimRefs:
