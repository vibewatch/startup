evidenceGaps:
  - type: missing-source
    severity: material
    topic: board governance
    missingEvidence: A public board roster, ownership map, or governance disclosure for Earendil Labs.
    whyItMatters: The overview can identify founders and legal shell but cannot assess board independence or control rights.
    diligencePath: >-
      Request an org chart, board list, and cap-table summary from management or pull them from any confidential data
      room.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: capital structure
    missingEvidence: >-
      Debt, secondary, preference-stack, and liquidation-preference details for the March 2026 financing and prior
      capital.
    whyItMatters: >-
      Headline fundraising and milestone economics are public, but underwriting the real ownership and downside stack
      requires private financing documents.
    diligencePath: Request financing docs, investor-rights agreements, and any side letters from the latest round.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: headcount and revenue
    missingEvidence: Audited revenue, burn, headcount, and customer-count metrics.
    whyItMatters: Later financial and valuation chapters need denominators that are not available in the public evidence set.
    diligencePath: Ask management for 2025-2026 operating dashboard and audited or board-approved management accounts.
    relatedQuestionRefs:
      - QO017
      - QO025
  - type: conflicting-data
    severity: minor
    topic: lead-asset stage wording
    missingEvidence: >-
      A direct 2026 clinical-trial registry update or company slide clarifying whether HXN-1001 is completed in Phase 1,
      enrolling further, or fully Phase 2-ready.
    whyItMatters: The public record supports rapid progression but uses different stage language across 2025 and 2026 materials.
    diligencePath: >-
      Cross-check future corporate presentations or a trial-registry record once posted and reconcile the exact
      transition point.
    relatedQuestionRefs:
      - QO024
  - type: missing-source
    severity: material
    topic: legal-entity map
    missingEvidence: >-
      A full legal-entity diagram covering Earendil Labs, Helixon Therapeutics, and any offshore or China operating
      vehicles.
    whyItMatters: Cross-border structure affects IP ownership, governance, regulatory exposure, and IPO route analysis.
    diligencePath: Request a legal-entity chart and IP-assignment summary from counsel before concluding on structure risk.
    relatedQuestionRefs:
      - QO025
  - type: missing-source
    severity: material
    topic: serviceable market sizing
    missingEvidence: Public pricing, contract size, or volume assumptions for Earendil platform deals and royalty participation.
    whyItMatters: >-
      Without a revenue model or average-deal denominator, the chapter can only frame TAM/SAM lenses, not a defendable
      SOM.
    diligencePath: >-
      Request typical collaboration economics, average program count per deal, and assumed royalty stack from
      management.
    relatedQuestionRefs:
      - QM019
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: reimbursement economics
    missingEvidence: Public pricing and reimbursement assumptions for future Earendil IBD biologics.
    whyItMatters: Disease burden alone cannot translate into product revenue without pricing and access assumptions.
    diligencePath: Model pricing only after management or comparable product assumptions are disclosed.
    relatedQuestionRefs:
      - QM020
  - type: conflicting-data
    severity: minor
    topic: TAM overlap
    missingEvidence: >-
      A management view that separates platform revenue opportunity from internal-pipeline value to avoid double
      counting.
    whyItMatters: Broad AI platform TAM and therapeutic-market value can overlap if reported carelessly.
    diligencePath: Ask management to segment external platform revenues, milestone revenues, and internal asset value creation.
    relatedQuestionRefs:
      - QM018
  - type: missing-source
    severity: material
    topic: buyer concentration by segment
    missingEvidence: Named current or historical buyers outside Sanofi and the size of those contracts.
    whyItMatters: The market chapter can identify likely buyers but not actual demand capture without customer disclosure.
    diligencePath: Request customer-segment mix and average contract value in diligence.
    relatedQuestionRefs:
      - QM025
  - type: stale
    severity: minor
    topic: pricing and timeline compression claims
    missingEvidence: Current, company-specific evidence tying AI to actual cycle-time and cost compression at Earendil.
    whyItMatters: The top-down AI narrative is persuasive, but bottom-up proof of productivity matters more for underwriting.
    diligencePath: Request program-by-program discovery-cycle benchmarks versus historical controls.
    relatedQuestionRefs:
      - QM012
  - type: missing-source
    severity: material
    topic: competitor pricing
    missingEvidence: Public competitor pricing or average contract economics across the AI-biologics peer set.
    whyItMatters: >-
      Without pricing or contract-size data, the chapter can compare capability and disclosure but not monetize
      switching decisions cleanly.
    diligencePath: >-
      Request contract archetypes, milestone splits, and average program sizes from management or third-party deal
      databases.
    relatedQuestionRefs:
      - QP020
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: real customer overlap
    missingEvidence: Named customer overlap or buyer win-loss data across Earendil and direct peers.
    whyItMatters: >-
      Competitive intensity depends on whether companies actually fight for the same accounts, not merely resemble each
      other on paper.
    diligencePath: Ask management for active competitor lists by partner opportunity and for examples of deals won or lost.
    relatedQuestionRefs:
      - QP025
  - type: private-evidence-only
    severity: material
    topic: internal build displacement
    missingEvidence: Evidence on how much AI-discovery work large pharma still outsources versus internalizes.
    whyItMatters: This affects how durable independent-platform economics will be as pharma capabilities mature.
    diligencePath: Pressure-test Earendil management on internal-vs-external build logic for Sanofi and future pharma partners.
    relatedQuestionRefs:
      - QP017
  - type: conflicting-data
    severity: minor
    topic: Roche and Merck TL1A specificity
    missingEvidence: More precise public same-target detail from Roche and Merck pages directly tied to IBD programs.
    whyItMatters: >-
      Target-class crowding is clear, but the fetched public pages do not equally expose each company's full competitive
      specifics.
    diligencePath: Add future trial-registry or company-specific program pages when they become accessible.
    relatedQuestionRefs:
      - QP018
  - type: missing-source
    severity: minor
    topic: net retention across peers
    missingEvidence: Any public evidence on renewals, NRR, or recurring-platform durability across competitors.
    whyItMatters: This would materially improve switching-cost and distribution analysis.
    diligencePath: Look for post-IPO or investor-day disclosures from public peers.
    relatedQuestionRefs:
      - QP011
  - type: missing-source
    severity: material
    topic: public pricing
    missingEvidence: Platform pricing, average deal size, or recurring software economics.
    whyItMatters: Without pricing, the revenue-model discussion remains architectural rather than quantitative.
    diligencePath: Request standard collaboration economics and any software / service pricing sheets.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: blocking
    topic: burn and runway
    missingEvidence: Current cash balance, monthly or quarterly burn, and runway estimate.
    whyItMatters: This is the single biggest blocker to a stronger capital-adequacy view.
    diligencePath: Request latest board package or management cash-forecast model.
    relatedQuestionRefs:
      - QI019
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: milestone realization
    missingEvidence: How much of the Sanofi economics has actually been received or recognized.
    whyItMatters: Headline deal size can badly overstate current financial strength if milestones are distant.
    diligencePath: Ask management to separate received cash, earned milestones, and future contingent value.
    relatedQuestionRefs:
      - QI023
    relatedTableRefs:
      - TI004
  - type: missing-source
    severity: material
    topic: revenue quality
    missingEvidence: Revenue mix by financing, upfronts, milestones, grants, or any service / platform revenues.
    whyItMatters: Underwriting revenue quality is impossible without even a directional mix.
    diligencePath: Request audited or board-approved revenue bridge by source.
    relatedQuestionRefs:
      - QI020
    relatedTableRefs:
      - TI005
  - type: missing-source
    severity: material
    topic: customer concentration
    missingEvidence: Named revenue exposure to Sanofi versus any other partners.
    whyItMatters: Financial quality depends heavily on whether one partner dominates realized economics.
    diligencePath: Request partner concentration and pipeline concentration metrics.
    relatedQuestionRefs:
      - QI025
    relatedTableRefs:
      - TI005
  - type: missing-source
    severity: material
    topic: platform productivity proof
    missingEvidence: >-
