  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: platform software, biologics discovery, and asset value'
        blocks:
          - type: paragraph
            body: >-
              Earendil does not sit cleanly inside one familiar SaaS category. The closest top-down bucket is the AI
              drug discovery platforms market, but that still understates what the company is trying to monetize.
              Precedence Research defines this market as software, data, compute, and lab-integration services sold into
              pharma, biotech, CROs, and research institutions. Earendil fits that definition, yet the company is also
              building internal assets, which means its opportunity spans both platform revenue and pipeline value
              capture. MarketsandMarkets provides a broader adjacency lens through the $30.58 billion 2025 drug
              discovery technologies market, while Global Market Insights gives a narrower AI-in-drug-discovery
              estimate. The right framing is therefore layered: a core AI-discovery platform TAM, a wider
              discovery-technology budget pool, and a disease- and target-specific asset opportunity where Earendil can
              create disproportionate value if its own biologics programs advance. That layered framing avoids both
              over-claiming a giant generic AI market and under-claiming the economic relevance of internal drug assets.
