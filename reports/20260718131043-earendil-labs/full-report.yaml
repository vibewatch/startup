  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Top risk stack
        blocks:
          - type: paragraph
            body: >-
              Earendil's risk profile is dominated by a classic early-biotech problem with an added platform twist. The
              lead asset, HXN-1001, is becoming the public proof point for a much broader AI-biologics engine. That
              creates leverage on the upside, but it also means one clinical program can disproportionately shape
              perception of the whole company. Competitive timing matters because TL1A has become an active field with
              better-established comparators and increasingly specific partner expectations. The company is well
              financed, which meaningfully lowers near-term survival risk, yet it does not change the fact that the next
              stage of value creation depends on more expensive clinical execution and clearer evidence of
              differentiated outcomes. In practical terms, Earendil is not most exposed to cash today; it is most
              exposed to whether science, development execution, and commercial proof continue to compound in the right
              order.
