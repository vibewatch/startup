        title: Who the customer appears to be
        blocks:
          - type: paragraph
            body: >-
              The public evidence does not support a diversified customer base. It supports one clearly named external
              customer: Sanofi. That relationship spans at least two distinct commercial events—an April 2025 license
              for two named bispecific assets and a January 2026 discovery collaboration for additional bispecific
              antibodies. Everything else in the fetched set is better understood as financing, ecosystem signaling, or
              internal platform use rather than external customer breadth. That distinction matters because Earendil is
              selling into a pharma-partner model where one anchor account can validate the platform while
              simultaneously creating concentration risk. The likely buyer is not a field-commercial team but Sanofi's
              immunology and biologics R&D organization, which fits the autoimmune and inflammatory-disease focus of the
              deals and matches Sanofi's public science strategy. In customer-workflow terms, Earendil is not yet
              selling a broadly packaged software product; it is selling scientific outputs and discovery access into a
              highly selective enterprise buyer. That is commercially impressive for the stage.
