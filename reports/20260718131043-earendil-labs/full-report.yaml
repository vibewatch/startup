      - number: '3.2'
        title: Peer profiles, scale signals, and disclosure benchmarks
        blocks:
          - type: paragraph
            body: >-
              AbCellera, Absci, Generate, Recursion, and Relay all have public-company or IPO-ready surfaces that make
              them useful disclosure benchmarks. AbCellera looks like the most mature antibody-discovery infrastructure
              benchmark. Absci is especially important because it marries public-company visibility, biologics focus,
              and an AI-designed anti-TL1A program. Generate shows how strongly the market can reward a
              platform-plus-biologics narrative when it is paired with visible clinical programs. Recursion and Insilico
              sit slightly wider in modality but remain important platform-plus-pipeline comparables for investor
              attention and strategic-partnership credibility. Relay is less direct in biologics modality, yet still
              competes for the same specialist-capital pool. The competitive implication for Earendil is
              straightforward: public peers have already normalized a higher bar for disclosure, proof, and investor
              communication than Earendil currently offers.
