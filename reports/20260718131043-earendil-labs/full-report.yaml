      - number: '8.4'
        title: Final diligence asks before underwriting the mark
        blocks:
          - type: paragraph
            body: >-
              The remaining work is straightforward to name even if it is hard to obtain. Investors need realized cash
              versus theoretical milestone value, a sharper view of customer diversification beyond Sanofi, confirmation
              of governance and cap-table terms, and enough operational detail to judge whether the company is genuinely
              preparing for a public-market or large-scale late-private future. Without those answers, the current mark
              should be seen as fair-to-rich and highly execution dependent. With them, the company could migrate from
              “interesting but not obviously mispriced” into a more actionable opportunity. In other words, the burden
              of proof for Earendil is no longer whether it is real. It is whether it is cheap enough relative to what
              remains unknown. Until then, the investment decision is as much about what is missing as about what is
              already impressive. That asymmetry justifies caution even for enthusiastic investors.
            claimRefs:
              - CV021
