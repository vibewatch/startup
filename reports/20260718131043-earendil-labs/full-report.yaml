            body: >-
              The public financial verdict is positive on capital access and negative on transparency. Earendil has
              strong proof that sophisticated capital and one global pharma partner are willing to fund the story. It
              does not have public proof on revenue quality, burn discipline, margin path, or contractual durability
              beyond Sanofi. Compared with public AI-biotech comps, the disclosure gap is wide: peers such as Generate,
              Recursion, Absci, AbCellera, and Relay all offer market-data surfaces or SEC-grade filings that Earendil
              does not yet match. That does not mean Earendil is weak. It means the company is still being underwritten
              on strategic validation and future optionality more than on visible operating metrics. For diligence
              purposes, the key blockers are missing revenue data, missing cash-burn and runway detail, and missing
              evidence on how much of the theoretical Sanofi economics have been converted into realized cash or booked
