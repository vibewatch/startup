      - number: '1.3'
        title: Capital formation, Sanofi validation, and milestone cadence
        blocks:
          - type: paragraph
            body: >-
              Earendil’s public rise is anchored by a small number of very large financing and partnership events. The
              March 2026 financing announcement disclosed $787 million of new capital from a syndicate that included
              Dimension Capital, DST Global, Sanofi, INCE Capital, Luminous Ventures, Miracle Capital, and the
              Hillhouse/Pfizer Biotech Development Fund. That announcement also framed Earendil’s AI stack as a
              production engine, not a single discovery tool, and said the platform had already generated more than 40
              programs. The Sanofi relationship is even more important as an external validation signal. In April 2025
              Sanofi licensed HXN-1002 and HXN-1003 with a $125 million upfront and up to $1.72 billion of milestone
              value plus royalties. In January 2026 the two companies expanded into a broader collaboration worth up to
              $2.56 billion. Even allowing for non-cash milestones and long realization windows, that is unusually
              strong partner proof for a private company at Earendil’s age.
