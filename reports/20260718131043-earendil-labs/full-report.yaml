      - number: '8.3'
        title: Recommendation, confidence, and kill triggers
        blocks:
          - type: paragraph
            body: >-
              The most defensible call today is research-more at current price. That recommendation is not timid; it is
              price sensitive. A buy would require either a lower entry or better proof that the company can broaden
              beyond the current Sanofi-and-HXN-1001-centered narrative. An avoid call would overstate the downside
              because Earendil has already crossed a proof bar that many AI-biotech startups never reach. Confidence
              should therefore be medium and risk rating high. The investment case can improve quickly if additional
              customers, clearer milestone economics, or differentiated data appear. It can also deteriorate quickly if
              public comps weaken, the IPO path is forced early, or the clinical and partner story stalls. Investors
              should treat this as an opportunity that merits continued diligence rather than immediate price-taking.
              Price discipline matters here because small changes in proof quality could still shift fair value by
              hundreds of millions of dollars.
            claimRefs:
