      - number: '6.3'
        title: Durability is inferred; concentration is explicit
        blocks:
          - type: paragraph
            body: >-
              The biggest customer question is not whether Earendil has any proof—it does—but whether the model is
              durable without one large partner carrying the story. No fetched source discloses NRR, GRR, churn, renewal
              timing, contract length, or cohort retention. As a result, durability has to be inferred from Sanofi's
              willingness to deepen the relationship. That is positive, but it is not the same thing as transparent
              retention. Concentration, by contrast, is directly visible. No second named customer appears, public case
              studies are sparse, and the website does little to widen buyer confidence through deployment stories or
              procurement-ready documentation. In practical terms, the current posture should be underwritten as an
              anchor-account business with meaningful expansion potential but also meaningful single-customer exposure.
              Until new named customers appear, any underwriting model has to assume that a delay, reprioritization, or
              scientific disappointment at Sanofi would transmit directly into Earendil's commercial narrative.
