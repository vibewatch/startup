      - number: '2.2'
        title: Disease burden and target-class demand in IBD
        blocks:
          - type: paragraph
            body: >-
              The disease-side demand case is strong enough to matter even before one models pricing. Crohn's & Colitis
              Foundation describes inflammatory bowel disease as chronic GI inflammation, with Crohn's disease and
              ulcerative colitis as the two dominant forms. The 2026 Curr Opin Pharmacol review says that 30% to 40% of
              patients still fail to respond or lose response to existing therapies over time, which is exactly the kind
              of residual need that keeps new biologics classes commercially relevant. The same review identifies TL1A
              inhibition and bispecific antibodies as especially promising next-generation approaches, and the Frontiers
              2026 article reinforces that anti-TL1A engineering remains an active scientific frontier. Sanofi's
              February 2026 duvakitug update adds a useful burden statistic, citing approximately 4.9 million global IBD
              cases and ongoing incidence growth. For Earendil, that means the lead HXN-1001 and the Sanofi-partnered
              bispecifics are aimed at a large, clinically important, and still under-served demand pool rather than a
              niche immunology side street.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
              - CM017
              - CM018
