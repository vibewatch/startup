    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, legal shell, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Earendil Labs is easiest to understand as a cross-border biologics startup whose public-facing identity is
              cleaner than its legal and operating map. The active public site is earendil.bio, while earendillabs.com
              is parked on a domain-sales page and Helixon.com sits on a maintenance screen. That matters because
              investors or partners encountering the business through the broader web would reasonably ask which domain
              and which entity are current. The strongest registry-style evidence in the fetched set is the Bizapedia
              summary of an active Delaware corporation filed in December 2024. Independent media then layers on the
              operating footprint: BioPharma Dive says the company is incorporated in Delaware with offices in Beijing,
              while BioSpace and The Medicine Maker frame it as Delaware-incorporated and Beijing-headquartered. The
              safest synthesis is that Earendil uses a US legal shell and a China-centered operating base, with the
              precise legal-entity map beyond that still under-disclosed.
