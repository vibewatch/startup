  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis versus current price
        blocks:
          - type: paragraph
            body: >-
              Earendil is easy to like as a company concept and much harder to underwrite as a bargain. The strategic
              positives are obvious: a very large financing round, repeated Sanofi validation, a lead asset approaching
              a more meaningful clinical proof window, and a platform story that can plausibly create more than one
              program. Those are real reasons the company could command a unicorn valuation. But price matters. At a
              $1B+ mark, investors are no longer underwriting a scientific option for free; they are already paying for
              a meaningful share of future execution. The result is a mixed view. Earendil looks substantially stronger
              than a typical concept-stage biotech, yet public evidence still leaves too many key inputs—revenue,
              realized cash, renewal depth, cap-table terms, and governance maturity—unstated for an aggressive buy
              call. That is the key asymmetry in this chapter: strong company quality does not automatically mean strong
              valuation attractiveness.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV017
              - CV018
              - CV019
              - CV020
          - type: table
            tableRef: TV002
            claimRefs:
              - CV019
              - CV020
              - CV025
              - CV026
              - CV027
              - CV033
              - CV034
              - CV040
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV019
              - CV020
              - CV026
              - CV028
              - CV031
      - number: '8.2'
        title: Comparable context and scenario framing
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to value Earendil is through scenarios anchored by strategic proof and
              late-private/public-biotech sentiment rather than by spreadsheet precision. Public peers such as Generate,
              Recursion, AbCellera, and Absci are directionally useful because they show how markets reward proof,
              disclosure, and durable customer value—not just AI storytelling. Unicorn-board articles and biotech
              funding trackers explain why the current private mark is possible in 2026, but they do not prove it is
              cheap. In the base case, Earendil roughly earns today's mark if current momentum continues. In the bear
              case, weaker clinical or customer outcomes pull the company below the unicorn line. In the bull case,
              partner expansion and differentiated clinical proof could justify a meaningfully higher value. That
              framing is wide, but the business is still wide. Scenario work is necessary precisely because the evidence
              base is good enough to justify real upside, but not precise enough to collapse the range into a narrow
              target. That breadth of outcomes is itself a reason to stay disciplined on entry price.
            claimRefs:
              - CV007
