            body: >-
              The public product story is not a single API or a single therapeutic asset. Earendil presents itself as a
              biologics R&D engine that combines AI-driven sequence generation, antibody-property prediction,
              high-throughput experimental validation, and iterative self-improvement. The technology bundle and
              official copy repeatedly frame this as protein therapeutics R&D, not general-purpose life-science
              software. That matters because the buyer is implicitly purchasing faster and better biologics programs
              rather than just computation. Public sources also show that the commercial expression of the platform can
              take more than one form: internal pipeline generation, out-licensed bispecific assets, and broader
              discovery collaborations. The product should therefore be understood as an integrated
              discovery-and-development operating model whose output is therapeutic programs, not merely model access.
              That framing aligns with how Sanofi has engaged Earendil—first through named assets, then through broader
              platform collaboration. It also implies that investors should assess the product as a capital-intensive
              system whose value is measured by asset output quality, not by software usage metrics alone.
