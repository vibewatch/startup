  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape structure: platform peers versus mechanism competitors'
        blocks:
          - type: paragraph
            body: >-
              Earendil competes in two overlapping but different arenas. The first is the AI-biologics platform
              landscape, where AbCellera, Absci, Generate Biomedicines, Insilico Medicine, Recursion, and to a lesser
              degree Relay all compete for capital, partnerships, and buyer attention. The second is the
              mechanism-specific field around inflammatory bowel disease and TL1A, where Sanofi/Teva, Roche,
              Merck-linked immunology efforts, and Absci are closer to the lead-program question. This distinction
              matters because some competitors are better benchmarks for platform trust and financing, while others are
              better benchmarks for how hard it will be for Earendil to win clinical mindshare around HXN-1001. Public
              materials from almost every AI-biologics peer now combine platform and pipeline language, which means the
              competitive standard is no longer “interesting AI.” It is “show me assets, partner quality, or
              public-market durability.” Earendil has clear Sanofi validation, but it is entering a field where the
              benchmark narratives are already well established.
