  evidenceGaps:
  - type: missing-source
    severity: material
    topic: competitor pricing
    missingEvidence: Public competitor pricing or average contract economics across the AI-biologics peer set.
    whyItMatters: Without pricing or contract-size data, the chapter can compare capability and disclosure but not monetize switching decisions cleanly.
    diligencePath: Request contract archetypes, milestone splits, and average program sizes from management or third-party deal databases.
    relatedQuestionRefs:
    - QP020
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: real customer overlap
    missingEvidence: Named customer overlap or buyer win-loss data across Earendil and direct peers.
    whyItMatters: Competitive intensity depends on whether companies actually fight for the same accounts, not merely resemble each other on paper.
    diligencePath: Ask management for active competitor lists by partner opportunity and for examples of deals won or lost.
    relatedQuestionRefs:
    - QP025
  - type: private-evidence-only
    severity: material
    topic: internal build displacement
    missingEvidence: Evidence on how much AI-discovery work large pharma still outsources versus internalizes.
    whyItMatters: This affects how durable independent-platform economics will be as pharma capabilities mature.
    diligencePath: Pressure-test Earendil management on internal-vs-external build logic for Sanofi and future pharma partners.
    relatedQuestionRefs:
    - QP017
