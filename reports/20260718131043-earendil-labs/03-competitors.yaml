- id: moat-durability-and-threats
  title: Moat durability, crowding risk, and what could displace Earendil
  body: The moat picture is mixed. On the durable side, companies that combine proprietary biological data, wet-lab throughput, partner access, and clinical translation should keep an edge over firms that only brand themselves as AI-native. On the fragile side, many competitors now tell a very similar platform-plus-pipeline story, which makes the narrative itself easier to commoditize. For Earendil's lead program, the urgent threat is target-class crowding rather than generic model commoditization. Duvakitug is already in Phase 3, and Absci has an AI-designed anti-TL1A antibody in Phase 1. That means Earendil must prove it can reach differentiated efficacy, convenience, or execution speed rather than merely show that TL1A matters. The broader strategic risk is that large pharma can increasingly internalize more AI work while selectively buying external science. Earendil still has room to win, but it is competing in a field where proof standards are rising on multiple fronts at once. Public-market
    comps also matter because they reveal how quickly disclosure quality becomes part of the moat conversation once companies seek broader investor capital.
