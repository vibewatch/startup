- id: capability-lockin-and-distribution
  title: Capabilities, switching costs, and routes to market power
  body: 'Public competitor pages suggest that the market no longer rewards standalone modeling claims. Winning platforms now need data, assay integration, translational biology, capital, and the patience to convert discovery output into assets or partner deals. That structure creates meaningful switching costs: once a buyer integrates a platform into wet-lab workflows and internal program context, the platform becomes embedded in both process and asset outcomes. Pipeline ownership adds still more lock-in because value is captured through molecules, royalties, or milestone economics rather than software seats alone. Distribution power also comes from different places than in enterprise SaaS. Here, the most credible distribution wedges are strategic pharma partnerships, clinical proof, and public-market stamina. That is why pricing remains oddly opaque in public materials. Buyers are not choosing between transparent menus; they are choosing between proof systems, teams, and long-cycle delivery
    capacity. That makes competitive diligence less about reading feature lists and more about judging who can repeatedly convert platform claims into durable partner trust and asset progress.'
