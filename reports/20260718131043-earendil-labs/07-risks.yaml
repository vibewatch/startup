- id: dependency-and-financial-risk
  title: Dependency, people, and financial-model risk
  body: Sanofi is both a strength and a risk concentrator. Repeat transactions validate the technology and create a high-quality external reference, but they also make Earendil unusually exposed to one counterparty's portfolio choices. If Sanofi slows, reprioritizes, or delays programs, Earendil does not yet have enough named-customer breadth to soften the blow. Financially, the $787 million round buys time and optionality, but not immunity. Milestone-heavy economics can flatter headline value while leaving realized cash timing uncertain, and internal clinical expansion could quickly consume capital if management pushes too many assets at once. People risk also remains meaningful because the public leadership bench is still narrow. For an investor, the main question is whether Earendil can diversify proof—across customers, assets, and governance signals—before one dependency becomes the entire story. Diversification of proof, not just diversification of capital, is the core risk-reduction
    task here.
  claimRefs:
  - CR010
  - CR011
  - CR013
  - CR014
  - CR020
  - CR021
  - CR022
