- id: mitigations-and-kill-criteria
  title: Mitigations, monitors, and kill criteria
  body: 'The encouraging part of the risk picture is that many of the biggest issues are monitorable. Investors can watch for differentiated HXN-1001 data, evidence of additional named customers, more mature governance and security disclosures, and whether the company enters any IPO process with a broader proof set than it has today. The discouraging part is that these mitigations are still future-state items. Strong financing and a blue-chip partner lower immediate failure risk, but they do not eliminate the need for sharper proof. A workable underwriting stance is therefore conditional: remain constructive if Earendil adds evidence faster than it adds complexity, but treat clinical disappointment, partner narrowing, or disclosure stagnation as thesis-break events. This is a company with attractive upside and very visible ways to get the story wrong. That is why the monitors in this chapter matter more than generic risk labels. That broadens the risk lens from science alone to submission
    and CMC readiness.'
  claimRefs:
