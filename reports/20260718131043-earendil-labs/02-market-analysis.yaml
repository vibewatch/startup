company:
  name: Earendil Labs
chapter:
  number: 2
  title: Market Analysis
  summary: 'Earendil sits at the intersection of three real but easy-to-confuse markets: AI drug discovery platforms, broader drug-discovery technologies, and the therapeutic opportunity around next-generation IBD biologics. The market is attractive because biologics support is growing quickly, IBD need remains high, and large pharma keeps paying for differentiated external science—but the serviceable obtainable market for Earendil cannot be pinned down cleanly from public data alone.'
sections:
- id: market-boundary
  title: 'Market boundary: platform software, biologics discovery, and asset value'
  body: 'Earendil does not sit cleanly inside one familiar SaaS category. The closest top-down bucket is the AI drug discovery platforms market, but that still understates what the company is trying to monetize. Precedence Research defines this market as software, data, compute, and lab-integration services sold into pharma, biotech, CROs, and research institutions. Earendil fits that definition, yet the company is also building internal assets, which means its opportunity spans both platform revenue and pipeline value capture. MarketsandMarkets provides a broader adjacency lens through the $30.58 billion 2025 drug discovery technologies market, while Global Market Insights gives a narrower AI-in-drug-discovery estimate. The right framing is therefore layered: a core AI-discovery platform TAM, a wider discovery-technology budget pool, and a disease- and target-specific asset opportunity where Earendil can create disproportionate value if its own biologics programs advance. That layered framing
    avoids both over-claiming a giant generic AI market and under-claiming the economic relevance of internal drug assets.'
