- id: growth-drivers-constraints-and-judgment
  title: Growth drivers, constraints, and evidence-constrained judgment
  body: 'The top-down growth drivers are obvious: rapid expansion in AI drug discovery budgets, a biologics segment growing faster than small-molecule support, pressure on R&D productivity, and China-linked / cross-border dealmaking that keeps search costs for external innovation high. IQVIA explicitly says the industry is concentrating investment and deals in high-value science and China-linked activity, which maps well to Earendil''s positioning. But the bottom-up constraints are just as real. Clinical development timelines have lengthened, buyer proof standards are rising, and broad market reports often bundle software, services, and outcome-based economics into one TAM. TL1A itself is a strong but crowded target class, with duvakitug already in Phase 3 and Absci pushing an AI-designed anti-TL1A program into Phase 1. The result is a market that clearly exists and is growing, but not one where Earendil can be underwritten from generic TAM slides alone. The opportunity is real; the serviceable
    and obtainable share still depends on commercial model details the public record does not yet disclose.'
