- id: buyers-competition-and-adoption
  title: Who buys, how they buy, and why adoption is still hard
  body: 'The likely buyers for an Earendil-like platform are not homogeneous. Large pharma is the clearest budget owner because it can pay for platform integration, run multiple biologics programs at once, and monetize both partnered and internal assets. Emerging biotech can value the acceleration, but often lacks balance-sheet depth for a full-stack, lab-integrated relationship. CROs, CDMOs, and research institutions matter as workflow users and validation channels, but typically not as the richest strategic counterparties. The competitive set also shows that market expectations have moved beyond pure software. Generate, Recursion, Insilico, Absci, AbCellera, and Relay all present platform-plus-pipeline or platform-plus-precision-medicine stories. That means buyers increasingly expect evidence that an AI company can deliver molecules, not just models. Adoption therefore depends on more than clever algorithms: the winning platforms need biological data, wet-lab feedback loops, regulatory
    credibility, and the patience to survive long clinical timelines. This is why the market is attractive but difficult.'
