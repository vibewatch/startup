company:
  name: Earendil Labs
chapter:
  number: 6
  title: Customers
  summary: 'Earendil has genuine named-customer proof, but it is concentrated in one blue-chip counterparty: Sanofi. The relationship appears to be deepening from specific asset licensing into broader discovery collaboration, which is strong adoption evidence for stage, yet the public record still lacks breadth, retention metrics, and measurable customer outcomes.'
sections:
- id: buyer-map
  title: Who the customer appears to be
  body: 'The public evidence does not support a diversified customer base. It supports one clearly named external customer: Sanofi. That relationship spans at least two distinct commercial events—an April 2025 license for two named bispecific assets and a January 2026 discovery collaboration for additional bispecific antibodies. Everything else in the fetched set is better understood as financing, ecosystem signaling, or internal platform use rather than external customer breadth. That distinction matters because Earendil is selling into a pharma-partner model where one anchor account can validate the platform while simultaneously creating concentration risk. The likely buyer is not a field-commercial team but Sanofi''s immunology and biologics R&D organization, which fits the autoimmune and inflammatory-disease focus of the deals and matches Sanofi''s public science strategy. In customer-workflow terms, Earendil is not yet selling a broadly packaged software product; it is selling scientific
    outputs and discovery access into a highly selective enterprise buyer. That is commercially impressive for the stage.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU005
  - CU007
  - CU008
  - CU009
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: proof-and-adoption
  title: What adoption is actually proven
  body: Adoption proof is real, but it is narrower than the headline financing suggests. The first Sanofi transaction proves that Earendil produced specific assets worth licensing. The second proves that the relationship expanded from asset transfer into broader platform access. Those are meaningful signals because repeat engagement from a large public pharma company is harder to dismiss than a one-off pilot or an undifferentiated MOU. At the same time, public evidence stops short of revealing how many programs are active, how deeply Sanofi teams are using Earendil outputs, what outcomes have been measured, or whether the relationship has translated into recurring revenue beyond upfront economics and milestone optionality. Investors should therefore read the customer story as proof of counterparty quality and account expansion, not as proof of customer-base breadth. That is still valuable evidence, because pharma partnering rarely advances in two stages unless the first interaction produced
    enough confidence to justify a broader mandate.
  claimRefs:
  - CU010
  - CU011
  - CU021
  - CU022
  - CU023
  - CU024
  - CU031
  tableRefs:
  - TU002
  - TU003
  figureRefs:
  - FU002
  - FU003
- id: durability-and-concentration
  title: Durability is inferred; concentration is explicit
  body: The biggest customer question is not whether Earendil has any proof—it does—but whether the model is durable without one large partner carrying the story. No fetched source discloses NRR, GRR, churn, renewal timing, contract length, or cohort retention. As a result, durability has to be inferred from Sanofi's willingness to deepen the relationship. That is positive, but it is not the same thing as transparent retention. Concentration, by contrast, is directly visible. No second named customer appears, public case studies are sparse, and the website does little to widen buyer confidence through deployment stories or procurement-ready documentation. In practical terms, the current posture should be underwritten as an anchor-account business with meaningful expansion potential but also meaningful single-customer exposure. Until new named customers appear, any underwriting model has to assume that a delay, reprioritization, or scientific disappointment at Sanofi would transmit directly
    into Earendil's commercial narrative.
  claimRefs:
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
  - CU025
  - CU027
  - CU028
  - CU030
  - CU033
  - CU034
  tableRefs:
  - TU004
  - TU005
  figureRefs:
  - FU004
- id: judgment
  title: Customer-quality verdict
  body: 'Sanofi is a high-quality reference customer because it is scientifically sophisticated, globally scaled, and capable of real diligence. That makes the existing proof more valuable than a handful of shallow logos. But Earendil is still early in customer development by public-company standards. The market can see relationship depth with one counterpart, yet it cannot see breadth, renewal economics, or measurable user outcomes. Thin public customer storytelling, a parked legacy domain, and limited procurement-facing materials add avoidable friction for future customer acquisition. The right conclusion is therefore balanced: Earendil has enough named-customer proof to show that the platform is commercially legible, but not enough disclosed customer diversity to remove concentration risk from the investment case. A stronger case would require at least one more named customer, clearer renewal mechanics, and a better public-facing procurement and trust surface. Even one additional disclosed
    pharma account would change the story materially.'
  claimRefs:
  - CU018
  - CU019
  - CU020
  - CU026
  - CU029
  - CU032
  - CU035
