chapter:
  number: 4
  title: Financials
  summary: Earendil looks unusually well capitalized for a private AI-biologics company, with a $787 million 2026 financing and multi-billion-dollar Sanofi deal economics. But the public record remains thin on the denominators that matter most for underwriting—revenue, burn, runway, margin, and what portion of the headline Sanofi value is actually realized rather than contingent.
sections:
- id: monetization-model
  title: 'Monetization model: partnerships first, product revenue later'
  body: 'The public evidence supports a monetization architecture, not a revenue statement. Earendil appears to make money today or in the near term through strategic partnerships, upfront licensing economics, milestone optionality, and eventually royalties, while it builds internal programs toward the clinic. The April 2025 and January 2026 Sanofi agreements are the clearest proof of that model. They show Earendil monetizing AI-driven biologics discovery through out-licenses and broader platform access rather than through a broad customer-count story or any visible self-serve software business. What is missing is equally important: there is no public evidence of recognized product sales, recurring platform ARR, or even a directional annual revenue figure. That means the financial chapter has to treat the company as a partnership-led, pre-commercial biotech whose current economics are visible mainly through financing and deal structures rather than through operating statements.'
  claimRefs:
  - CI001
  - CI005
  - CI006
  - CI007
  - CI008
  - CI010
