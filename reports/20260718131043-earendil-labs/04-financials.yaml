- id: capital-adequacy-and-financing-path
  title: Capital adequacy, contingent economics, and liquidity path
  body: 'By headline size alone, Earendil looks well capitalized. The $787 million financing is unusually large for a private AI-biologics startup, and the two Sanofi agreements add substantial non-dilutive optionality. But the structure matters: the biggest numbers in the Sanofi deals are contingent milestones, not cash already realized. The April 2025 deal included $125 million upfront and a $50 million near-term payment, while the January 2026 collaboration offered up to $160 million in upfront and near-term economics. Everything above that depends on development and commercial execution. This means Earendil is simultaneously better funded than most peers and still financially dependent on continued execution. Independent coverage of a possible Hong Kong IPO reinforces that interpretation. A company with enough capital still seeks liquidity and financing flexibility when its business model remains long-cycle, milestone-heavy, and pre-commercial.'
  claimRefs:
  - CI002
  - CI003
