  title: Public financial gaps table
  columns:
  - Gap
  - Why it matters
  - Effect on underwriting
  - Best next diligence step
  rows:
  - - Revenue / ARR
    - Needed to judge quality and scale of monetization
    - Prevents clean valuation multiple work
    - Request management accounts or audited statements
  - - Burn and runway
    - Needed to test adequacy of the 2026 round
    - Makes liquidity view directional only
    - Request budget, cash balance, and forecast
  - - Milestone realization
    - Needed to separate theoretical from earned economics
    - Could materially change quality of capital base
    - Ask what cash has actually been received
  - - Gross margin / cost structure
    - Needed to test software-like versus biotech-like economics
    - Blocks operating-leverage view
    - Request cost buckets and gross-margin bridge
  - - Customer concentration beyond Sanofi
    - Needed to test dependence and diversification
    - May reveal single-partner risk
    - Request partner revenue mix and pipeline mix
  notes: These gaps are the reasons the chapter stops at “well funded but under-disclosed” rather than giving a stronger quality verdict.
