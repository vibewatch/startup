  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public pricing
    missingEvidence: Platform pricing, average deal size, or recurring software economics.
    whyItMatters: Without pricing, the revenue-model discussion remains architectural rather than quantitative.
    diligencePath: Request standard collaboration economics and any software / service pricing sheets.
    relatedQuestionRefs:
    - QI005
    relatedTableRefs:
    - TI002
  - type: missing-source
    severity: blocking
    topic: burn and runway
    missingEvidence: Current cash balance, monthly or quarterly burn, and runway estimate.
    whyItMatters: This is the single biggest blocker to a stronger capital-adequacy view.
    diligencePath: Request latest board package or management cash-forecast model.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: milestone realization
    missingEvidence: How much of the Sanofi economics has actually been received or recognized.
    whyItMatters: Headline deal size can badly overstate current financial strength if milestones are distant.
    diligencePath: Ask management to separate received cash, earned milestones, and future contingent value.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: revenue quality
    missingEvidence: Revenue mix by financing, upfronts, milestones, grants, or any service / platform revenues.
    whyItMatters: Underwriting revenue quality is impossible without even a directional mix.
    diligencePath: Request audited or board-approved revenue bridge by source.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI005
  - type: missing-source
    severity: material
    topic: customer concentration
    missingEvidence: Named revenue exposure to Sanofi versus any other partners.
    whyItMatters: Financial quality depends heavily on whether one partner dominates realized economics.
    diligencePath: Request partner concentration and pipeline concentration metrics.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI005
