- id: cost-structure-and-intensity
  title: Cost structure and capital intensity
  body: Earendil should be modeled financially as R&D-heavy. The company is running an AI-native biologics discovery engine, maintaining high-throughput biology, adding interdisciplinary teams, and moving multiple programs toward the clinic. The HXN-1001 Phase 1 disclosure confirms that Earendil had clinical-stage spending no later than 2025, while the 2026 financing release adds multiple planned IND filings through 2027. That is a different cost base from a narrow software or data vendor. Public sources do not disclose gross margin, capex, working capital, or burn, so the exact cost structure cannot be quantified. But directionally the spending mix likely includes wet-lab operations, translational development, CMC work, protein engineering, compute, and regulatory preparation. The size of the financing round itself is indirect evidence that management and investors expect a capital-intensive scaling period rather than a lightweight software-expansion phase. The absence of margin data also
    means investors cannot tell whether the platform is becoming cheaper per program as it scales or simply consuming more capital to stay broad.
  claimRefs:
  - CI016
  - CI017
  - CI018
  - CI019
  - CI022
  - CI023
  - CI038
