- id: leadership-and-affiliation
  title: Founders, leadership bench, and the Helixon link
  body: 'The fetched primary record points to a leadership story dominated by two people. Jian Peng is consistently identified as founder and CEO, while Zhenping Zhu appears as co-founder, president, and co-CEO. The official web bundle adds the clearest background color: Peng is presented as an ex-UIUC professor with AI, machine-learning, and structural-biology credentials, and Zhu as a veteran biologics executive from Novartis, ImClone, Kadmon, and 3SBio. That is a credible founder pair for a biologics platform that wants both computational depth and industrial protein-science judgment. At the same time, the visible governance surface is thin. The official site exposes two biographies, not a broader board or management roster, and the contact channel routes inquiries to a Helixon.com address. Together with repeated press-release language calling Helixon Therapeutics an affiliate, the evidence supports a close operational relationship between Earendil and Helixon without resolving the full
    ownership or governance structure.'
