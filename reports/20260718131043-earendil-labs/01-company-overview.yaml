chapter:
  number: 1
  title: Company Overview
  summary: Earendil Labs presents as a newly formalized Delaware legal shell wrapped around a Beijing-centered AI-biologics operating story, with unusually strong external validation from Sanofi and a March 2026 $787 million financing. The fetched evidence supports a real multi-program biologics platform and a credible founder pair, but it also leaves important gaps around governance, full legal structure, audited financials, and the company’s still-messy web and disclosure surface.
sections:
- id: identity-and-footprint
  title: Identity, legal shell, and operating footprint
  body: 'Earendil Labs is easiest to understand as a cross-border biologics startup whose public-facing identity is cleaner than its legal and operating map. The active public site is earendil.bio, while earendillabs.com is parked on a domain-sales page and Helixon.com sits on a maintenance screen. That matters because investors or partners encountering the business through the broader web would reasonably ask which domain and which entity are current. The strongest registry-style evidence in the fetched set is the Bizapedia summary of an active Delaware corporation filed in December 2024. Independent media then layers on the operating footprint: BioPharma Dive says the company is incorporated in Delaware with offices in Beijing, while BioSpace and The Medicine Maker frame it as Delaware-incorporated and Beijing-headquartered. The safest synthesis is that Earendil uses a US legal shell and a China-centered operating base, with the precise legal-entity map beyond that still under-disclosed.'
