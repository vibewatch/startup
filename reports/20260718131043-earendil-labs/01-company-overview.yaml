- id: pipeline-stage-and-open-questions
  title: Pipeline scale, stage progression, and unresolved contradictions
  body: 'The core operating claim across Earendil’s public record is that the platform is already generating a multi-program pipeline rather than merely demonstrating AI concepts. The official web bundle shows 19 disclosed programs across immunology and oncology, while the funding press release says the platform has produced more than 40 programs overall. HXN-1001 is the lead disclosed clinical asset and the most important maturity marker. The July 2025 clinical release documents Phase 1 initiation and cohort-1 dosing, whereas the March 2026 financing release and several independent articles describe the same program as ready for Phase 2. That is not a contradiction so much as a stage progression, but it shows how quickly Earendil’s public story is evolving. The remaining gaps are material: there is still no audited revenue denominator, no reconciled headcount, no public board map, and no fully resolved explanation of how the Delaware entity, Beijing operations, Helixon affiliate, and Hong
    Kong IPO plan fit together. That ambiguity is itself part of the diligence story.'
