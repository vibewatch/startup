- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Realized economics
    - Upfront cash received, realized milestones, royalty structure
    - Separates theoretical from earned value
    - Request management data room
  - - Customer diversification
    - Named customers beyond Sanofi or referenceable pipeline
    - Reduces concentration discount
    - Request partner list under NDA
  - - Governance and cap table
    - Board structure, investor rights, liquidation preferences
    - Determines whether the mark is clean or burdened
    - Request legal/finance materials
  - - Operational readiness
    - Security, data-rights, and compliance package
    - Affects IPO readiness and partner conversion
    - Request diligence package
  - - Clinical value drivers
    - Detailed HXN-1001 and partnered-asset milestones
    - Sharpens scenario probabilities
    - Request development plan and data calendar
  notes: These asks are the shortest path from “research-more” to a firmer view.
