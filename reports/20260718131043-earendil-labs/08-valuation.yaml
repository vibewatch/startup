- id: comparable-context-and-scenarios
  title: Comparable context and scenario framing
  body: The cleanest way to value Earendil is through scenarios anchored by strategic proof and late-private/public-biotech sentiment rather than by spreadsheet precision. Public peers such as Generate, Recursion, AbCellera, and Absci are directionally useful because they show how markets reward proof, disclosure, and durable customer value—not just AI storytelling. Unicorn-board articles and biotech funding trackers explain why the current private mark is possible in 2026, but they do not prove it is cheap. In the base case, Earendil roughly earns today's mark if current momentum continues. In the bear case, weaker clinical or customer outcomes pull the company below the unicorn line. In the bull case, partner expansion and differentiated clinical proof could justify a meaningfully higher value. That framing is wide, but the business is still wide. Scenario work is necessary precisely because the evidence base is good enough to justify real upside, but not precise enough to collapse the
    range into a narrow target. That breadth of outcomes is itself a reason to stay disciplined on entry price.
