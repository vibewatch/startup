    - Re-cut valuation toward bear case
  - - Partner concentration persists
    - No second named major customer through next value-inflection cycle
    - Keeps discount rate high
    - Maintain research-more / demand lower entry
  - - Public comp compression
    - AI-biotech comparables derate materially
    - Shrinks IPO and crossover support
    - Assume lower exit multiple
  - - Disclosure stagnation
    - No improvement in realized-cash / governance transparency
    - Limits confidence and public-market readiness
    - Avoid paying premium multiple
  notes: These are the events most likely to invalidate the current valuation stance.
