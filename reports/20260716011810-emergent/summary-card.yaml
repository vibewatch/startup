  topStrengths:
    - >-
      Emergent has reached unusual scale for a 2024-founded company, with disclosed ARR / run-rate, customer, and
      app-creation metrics far above typical early-stage software norms.
    - >-
      The product is clearly positioned for non-technical builders, which is a differentiated buyer focus versus many
      developer-first AI coding tools.
    - >-
      Founder-market fit is strong, combining Mukund Jha's operating history at Dunzo with Madhav Jha's ML-systems
      background.
    - The company has attracted a strong investor set and enough capital to reduce immediate survivability risk.
    - >-
      Private-market comparables show that the broader AI-builder category can sustain premium valuations when growth
      remains exceptional.
  topRisks:
    - >-
      Public evidence is still thin on churn, NRR, gross margin, burn, and support-cost structure, so revenue quality
      remains under-proven.
    - >-
      Trust, compliance, and incident-history disclosure look light relative to the claim that customers are building
      business-critical software.
    - Competitors such as Replit, Lovable, and Bolt are also well funded, which means capital alone is not a moat.
    - >-
      The current price already assumes continued breakout execution, leaving less room for ordinary software-style
      repricing.
    - >-
      Cap-table preferences and dilution terms remain private, so investor return outcomes could be materially worse
      than the headline mark suggests.
  unresolvedGaps:
    - Cohort retention, GRR, NRR, and active-paying-customer behavior by plan and geography.
    - Gross margin, inference and hosting-cost burden, support intensity, and CAC payback.
    - Incident history, SLA commitments, security diligence artifacts, and enterprise procurement proof.
    - Pipeline quality and enterprise conversion evidence beyond first-party case studies.
    - Fully diluted cap table, liquidation preferences, and other financing terms that drive actual return math.
