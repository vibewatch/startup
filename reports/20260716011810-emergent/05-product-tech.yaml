- calloutType: insight
  title: Wingman turns the story from app builder into broader operating system ambition
  body: By adding a connected assistant that can work across messaging channels and hundreds of integrations, Emergent is extending from software creation into software-assisted operations. That broadens the strategic upside but also raises the security bar materially.
  claimRefs:
