  title: Security disclosure is promising, but independent proof still trails the product promise
  body: The Wingman security write-up is unusually thoughtful and candid, especially on prompt injection. But most of the evidence is still company-authored, and public proof around formal certifications, long-run app reliability, and incident history remains thin.
