  - TE004
  figureRefs:
  - FE003
- id: trust-safety-and-technical-risk
  title: Trust, safety, security, and technical risk
  body: 'Wingman''s security documentation is unusually explicit for a young AI product and gives the best available window into Emergent''s technical control philosophy. The company describes trust boundaries, action controls, sandboxing, auditability, continual regression evaluation, and external red-team work, while also acknowledging that prompt injection remains unsolved across the industry. That candor is a positive signal, but it also highlights a gap: public technical detail for the core app builder is much thinner than for Wingman. Investors therefore can see how Emergent wants to think about agent security, but still cannot independently verify reliability, app-maintenance quality, or formal trust artifacts such as certifications and detailed SLAs. The right read is that technical ambition is high and the security posture is thoughtfully described, yet the public proof base still trails the breadth of the product promise. That asymmetry should stay central in diligence. Buyers
    should therefore separate documented intent from independently verified operational outcomes.'
