  evidenceGaps:
  - type: missing-source
    severity: material
    topic: independent-reliability-benchmark
    missingEvidence: Independent benchmark evidence on how well Emergent-built apps perform and hold up in production over time.
    whyItMatters: The product promise is broad enough that long-run quality matters more than first-build delight.
    diligencePath: Run standardized build, deploy, and maintain tests against representative workflows.
    relatedQuestionRefs:
    - QE022
    - QE025
    relatedTableRefs:
    - TE004
    - TE005
  - type: missing-source
    severity: material
    topic: formal-trust-artifacts
    missingEvidence: Public certifications, SLA detail, trust-center documentation, or third-party security attestations for the core product.
    whyItMatters: Security philosophy is not the same thing as formal trust proof.
    diligencePath: Request SOC / penetration-test summaries, uptime commitments, and customer-facing trust documentation.
    relatedQuestionRefs:
    - QE018
    - QE025
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: runtime-architecture-detail
    missingEvidence: Internal architecture details for generation, testing, hosting, rollback, and performance management.
    whyItMatters: Public docs describe workflows but not enough internals to fully assess reliability or scalability.
    diligencePath: Request architecture review with engineering leadership and sample incident postmortems.
    relatedQuestionRefs:
    - QE021
    - QE025
    relatedTableRefs:
    - TE002
    - TE003
  - type: stale
    severity: minor
    topic: connector-depth
