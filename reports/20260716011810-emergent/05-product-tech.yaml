- id: architecture-deployment-and-modules
  title: Architecture, deployment, and visible modules
  body: 'The most concrete product mechanics appear in the help center. Emergent documents a GitHub workflow that includes account connection, push and pull, branch management, pull requests, backup, and recovery. Separate documentation covers deployment and mobile app development through Expo and React Native, with EAS called out for packaging and publishing. Those elements imply a managed-cloud, full-lifecycle architecture rather than a toy prompt interface. Public materials also reveal a wide module surface: core app generation, deployment, mobile support, version control, integrations, and the distinct Wingman assistant product. The integrations directory suggests the platform is designed to plug into real business operations across payments, content, collaboration, and workflow tools. What remains less clear is the exact runtime stack, testing depth, and performance envelope under production load, because the public docs focus on workflows more than architecture internals. Observability
    depth and rollback behavior remain private. Enterprise-grade observability, load behavior, and rollback guarantees are not publicly benchmarked.'
  claimRefs:
  - CE004
  - CE005
  - CE006
  - CE007
