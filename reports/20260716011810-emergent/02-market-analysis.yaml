callouts:
- calloutType: insight
  title: The real market is narrower than the biggest TAM headlines
  body: The broadest LCNC numbers are useful for context, but Emergent’s actual battleground is the smaller slice where non-technical buyers want deployable custom software without hiring developers. That slice is still very large, but it should not be confused with all low-code spend.
  claimRefs:
  - CM001
  - CM004
  - CM005
  - CM007
  - CM030
  - CM039
- calloutType: strength
  title: The buyer base is expanding beyond engineering teams
  body: 'Searchlab, Hostinger, and Kissflow all point to the same structural shift: the fastest category growth comes from citizen developers, SMB operators, and first-time builders. Emergent’s focus on that group therefore targets the fastest-growing user pool rather than the most entrenched incumbent cohort.'
  claimRefs:
  - CM011
  - CM012
  - CM013
  - CM031
- calloutType: risk
  title: The market can grow rapidly while still punishing weak production reliability
  body: Caspio, Kissflow, and broader app-builder statistics all suggest the category bifurcates at the moment an app touches governed data or business-critical workflows. Fast generation is no longer enough once buyers demand auditability, quality control, and low-defect operation.
  claimRefs:
  - CM002
  - CM032
  - CM033
  - CM034
