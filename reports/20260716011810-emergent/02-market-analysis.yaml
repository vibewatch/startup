- id: market-size-lenses-and-regional-shape
  title: Market size lenses and regional shape
  body: 'Public market estimates vary widely because they measure different layers of the stack. The narrowest, analyst-grade governed-low-code lens is roughly $44.5 billion in 2026 according to the Gartner-linked Caspio summary. Broader low-code/no-code aggregations climb to about $52 billion in Kissflow and $65 billion in Searchlab, while Searchlab pushes the broader market toward $94 billion by 2028. A different but relevant lens is the AI-native subsegment: Hostinger cites a no-code AI platform market of $6.56 billion in 2025 growing to more than $75 billion by 2034, while GetMocha cites AI code tools at $4.86 billion in 2023 growing to $26.03 billion by 2030. These are not contradictions so much as category-definition differences. For Emergent, the broadest estimates are useful only as ceiling indicators. The more actionable lens is a constrained slice centered on SMB custom software, non-technical builders, and buyers who need deployable apps rather than code snippets. Regionally,
    the market is strongest in North America and Europe today, with Asia-Pacific the fastest grower — a shape that matches Emergent’s own early revenue distribution unusually well.'
