      - number: '1.3'
        title: 融资时间线与估值跃升
        blocks:
          - type: paragraph
            body: >-
              即使按 2026 年 AI 公司的标准看，Emergent 的融资节奏也很压缩。公开披露显示，公司先拿到 $7M 种子轮，2025 年 9 月完成 $23M Series A，2025 年 12 月获得
              Google AI Futures 未披露金额的战略投资，2026 年 1 月完成 $70M Series B，随后在 2026 年 7 月以 $1.5B 估值完成 $130M Series C
              轮。这意味着在未计入 Google 未披露金额前，已披露融资额为 $230M。估值跳升同样醒目：外部报道称公司在 2026 年 1 月估值约 $300M，也就是说 2026 年 7 月 Series C
              轮在六个月内大约翻了五倍。积极的一面是，投资人阵容顶级，覆盖风险投资、战略资本，如今也包括成长型股权资本。需要谨慎的是，资本故事远比收入质量、稀释条款或治理权利更有资料支撑。公开材料能让分析师验证融资动能和市场胃口，却无法验证决定独角兽头衔到底对投资人友好还是只对新闻标题友好的详细经济条款。
