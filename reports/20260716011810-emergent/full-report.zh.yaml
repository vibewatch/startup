  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 当前判断
      - 为何重要
      - 决策含义
    rows:
      - - 建议
        - 观察 / 有条件推进
        - 业务质量有潜力，但证据缺口仍然重大
        - 不要仅凭公开数据按干净买入承销
      - - 置信度
        - 中
        - 收入规模和融资证据充分，但耐久性输入不足
        - 提高确信度前，必须补做尽调
      - - 风险评级
        - 高
        - 执行、信任和披露缺口会快速撬动估值
        - 按显著下行波动来控制敞口
      - - 估值立场
        - 饱满到小幅偏贵
        - 只有增长继续爆发，~12.5x ARR 才撑得住
        - 守住入场纪律和下行条款
      - - 决策含义
        - 建设性但要挑选
        - 公司值得持续跟踪并争取接触
        - 只有留存、利润率、信任和股权结构表证据改善，才上调判断
    notes: 这份摘要刻意围绕价格敏感性，而不是给泛泛的质量评分。
