  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              Emergent 的公开表现已经足以获得严肃投资人关注，但还不足以支撑在任何价格下都轻松承销。正面逻辑很清楚：公司上线仅一年多一点就达到独角兽地位，披露 $120 million ARR
              或年度化收入运行率，而且似乎搭出一个非常广、全球化、偏 SMB 的漏斗。这些信号很少见。更难的问题是，当前价格是否已经把大部分兴奋提前资本化。按当前 ARR 约 12.5x 计算，相比最热的 AI
              构建器同业，这一轮并不离谱，但也不是安全边际很宽的入场点。剩余承销中，太多仍取决于留存、毛利率、事件历史和企业转化等缺失信息。因此，正确立场应是有条件的：公司有吸引力、增长有证据支撑，但建议仍应对价格和尽调敏感，而不是无条件买入。这个区别很关键。
