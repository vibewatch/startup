companyProfile:
  summary: >-
    Emergent 是一家未上市 AI 软件创建公司，由 Mukund Jha 和 Madhav Jha 兄弟于 2024 年创立。公司销售一个提示词驱动平台，把自然语言意图转成可部署的 Web
    或移动软件，并提供后端和集成支持；它明确瞄准非技术构建者，而不只是职业开发者。以公司年龄来看，公开规模证据异常强：2026 年 7 月宣布 $130M Series C 轮、估值 $1.5B，约 $120M 年经常性收入（ARR）/
    收入运行率，超过 200,000 名付费客户，构建应用超过 12M。核心投资争论不在 Emergent 是否有产品拉力，而在当前价格是否已经提前计入了大部分动能，而公司尚未公开证明留存、利润率质量、企业信任准备度或股权结构友好度。
