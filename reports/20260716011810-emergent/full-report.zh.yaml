chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、市场位置与当前运营信号
        blocks:
          - type: paragraph
            body: >-
              Emergent 把自己定义为全栈 AI 软件创建平台，而不是狭窄的代码补全工具。最新融资公告、当前定价页、FAQ 文案、YC 资料和独立评测都给出同一套叙事：非技术创始人、SMB
              业主、代理商和产品运营者用自然语言描述业务需求，就能拿到包含后端、部署和集成的可投产 Web 或移动软件。这个定位很关键，因为 Emergent 进入的是正在成形的“盒子里的工程团队”品类，而不是仍假设用户会操作
              IDE 的开发者优先代码副驾。以一家 2024 年成立、2025 年公开发布的公司来看，公开可见的最新运营指标异常强：公司称已构建超过 12M 个应用，TechCrunch 报道年经常性收入（ARR）为
              $120M，付费客户超过 200,000。需要注意的是，Emergent 自己的公开页面并未完全同步。较旧的营销页仍显示超过 5M 名构建者和超过 6M
              个应用，这可能是增长很快，也可能是页面过时；尽调在把任何单一指标当作标准口径前，必须先校准。
