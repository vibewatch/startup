  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、邻近市场与替代方案
        blocks:
          - type: paragraph
            body: >-
              Emergent 所在市场正在快速收敛，低代码 / 无代码、AI
              代码工具和提示词驱动的应用构建器混在一起。最清晰的边界不是所有软件开发支出，也不只是传统无代码。真正相关的市场，是买方希望从业务需求走到可部署软件，并大幅减少工程劳动力的那一层。Caspio 的 2026
              年框架很有用，因为它把品类拆成原型优先的 AI 生成器，以及能用可审计性和访问控制跑真实业务应用的治理型平台。Emergent 更靠近提示词优先的一端，但它的产品野心已经越过原型图，进入全栈部署、GitHub
              所有权、托管和变现。这让它的真实替代集合远不止低代码厂商。买方还可以雇代理商、用内部开发者、把电子表格和垂直 SaaS 工具拼在一起，或采用 Cursor、Copilot Workspace
              这类开发者中心智能体。因此，市场边界必须纳入直接 AI 应用构建器、邻近开发者工具和传统低代码既有厂商，同时排除那些不能明显缩短定制应用创建流程的更宽泛企业软件品类。
