  - id: FE002
    title: 工作流架构图
    type: flow
    summary: 公开文档显示，Emergent 似乎采用托管云架构，把生成、部署、版本控制、移动端打包和集成组合在一起。
    data:
      nodes:
        - id: nl
          label: 自然语言界面
          tone: neutral
        - id: gen
          label: 生成 / 修订引擎
          tone: positive
        - id: vc
          label: GitHub 版本控制层
          tone: positive
        - id: dep
          label: 部署 + 预览
          tone: positive
        - id: mob
          label: Expo / React Native 移动端路径
          tone: positive
        - id: conn
          label: 集成 / 连接器
          tone: neutral
      edges:
        - from: nl
          to: gen
          label: 提示
        - from: gen
          to: vc
          label: 保存 / 同步
        - from: gen
          to: dep
          label: 预览 / 部署
        - from: gen
          to: mob
          label: 移动端构建
        - from: gen
          to: conn
          label: 连接工具
    approximationNotes: 这是基于公开文档综合出的工作流架构，不是内部系统图。
    claimRefs:
