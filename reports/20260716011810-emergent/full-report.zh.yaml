  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 安全与平台完整性风险
        blocks:
          - type: paragraph
            body: >-
              最重要的单一风险簇是安全。Emergent 不只是帮用户写代码片段；它在帮助用户生成、部署，并在某些情况下跨真实系统自动执行动作。Wingman
              进一步抬高风险，因为它能跨数百个应用、消息、文档和计划任务协调工作。Emergent 自己的安全文档周到且具体，尤其是在提示词注入和跨工具副作用上，但这并不能消除底层品类风险。来自 ACM、IBM、AppSec
              Santa 和 Security Boulevard 的独立来源都描述了同一种模式：AI 生成应用可能看起来功能正常，却仍然带着重大漏洞、数据暴露或技术债问题上线。由于 Emergent
              瞄准非技术用户，风险被放大：最依赖工具的构建者，可能也是最没有能力直接审计输出的人。最可信的风险路径不是一次灾难性模型失败，而是大量较小的不安全默认项在庞大用户基础中层层叠加。
