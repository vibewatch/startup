        The table covers the most decision-relevant public and private references available from current public sources
        rather than every possible software comparable.
  - id: TV005
    title: 打破投资逻辑和终止触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 留存恶化
        - 队列数据显示续约疲弱或扩张不佳
        - 把快速 ARR 增长变成低质量收入
        - 重估到悲观情景，并暂停后续资本
      - - 信任 / 事件失效
        - 重大安全、隐私或可靠性事件公开
        - 削弱业务关键软件叙事
        - 要求立即复盘事件并重置估值
      - - 企业转化停滞
        - 大客户因信任材料不足而无法扩张
        - 压住倍数支撑，缩窄 TAM 兑现
        - 将建议维持在观察或更低
      - - 竞争性资本差距扩大
        - 同行在分销和企业功能上花钱超过 Emergent
        - 抬高获客和护城河压力
        - 要求证明留存或效率有差异化
      - - 优先权包袱超预期
        - 股权结构表经济条款大幅压缩普通股上行
        - 即便经营增长稳健，回报也会被削弱
        - 投入资本前重定价预期回报
    notes: 这些触发因素把叙事驱动的投资逻辑转成可监测的决策规则。
