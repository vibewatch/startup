  - id: FR003
    title: 缓释 / 信任 KPI
    type: kpi
    summary: Emergent 的风险姿态受益于明确的安全思考，但相对于其支持工作流的敏感度，机构信任材料仍稀疏。
    data:
      items:
        - label: 提示注入坦率度
          value: High
          unit: public acknowledgment
          status: observed
        - label: 连接器宽度
          value: 300+
          unit: apps
          status: observed
        - label: 法律披露可读性
          value: Low
          unit: practical reviewability
          status: estimated
        - label: Gartner 评论深度
          value: None yet
          unit: peer reviews
          status: observed
        - label: 欧盟透明度截止期
          value: Aug 2026
          unit: rules effective
          status: observed
        - label: 整体剩余风险
          value: High
          unit: current posture
          status: estimated
    approximationNotes: 估计项概括公开证据完整度，而非内部风险评分。
    claimRefs:
      - CR004
      - CR017
      - CR018
      - CR022
      - CR034
      - CR040
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 从市场和牵引力证明，经披露和风险缺口，推导到有条件建议。
    data:
      nodes:
        - id: RL1
          label: 品类需求仍强劲
          note: 低代码 / AI 构建器需求仍有独立市场支撑
        - id: RL2
          label: Emergent 增长势头异常快
          note: $120M ARR / 收入运行率和 200k+ 付费客户是真正利好
        - id: RL3
          label: 客户证明已有，但一方材料偏重
          note: 案例研究有用，但独立评测深度不足
        - id: RL4
          label: 披露质量仍不完整
          note: 留存、毛利率、事故历史和股权结构条款仍未公开
        - id: RL5
          label: 竞争端资本强度在上升
          note: Replit、Lovable、Bolt 都显示出强融资或估值势头
        - id: RL6
          label: 当前价格撑得住，但不便宜
          note: ~12.5x ARR 说得通，但容错空间更小
        - id: RL7
          label: 有条件观察 / 推进
          note: 只有尽调补上质量缺口，建议才会改善
      edges:
        - from: RL1
          to: RL7
          label: 支撑继续关注
        - from: RL2
          to: RL7
          label: 证明已真正突破规模
        - from: RL3
          to: RL4
          label: 压低信心
        - from: RL4
          to: RL7
          label: 阻碍明确买入
        - from: RL5
          to: RL6
          label: 压缩定价余地
        - from: RL6
          to: RL7
          label: 需要纪律
    claimRefs:
      - CV002
      - CV010
      - CV025
      - CV028
      - CV031
      - CV036
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 核心投资假设变化对估值的方向性影响。
    data:
      items:
        - label: ARR 很快超过 $200M
          value: 2
        - label: 企业级信任证据改善
          value: 1
        - label: 留存 / NRR 不及预期
          value: -2
        - label: 上市可比公司倍数压缩主导
          value: -2
        - label: 优先股堆叠对投资者不友好
          value: -1
    approximationNotes: 数值是相对当前估值标记的方向性影响评分，不是管理层指引，也不是 DCF 输出。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
      - CV037
      - CV039
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 覆盖当前、悲观、基准、乐观和概率加权结果的大致估值区间。
    data:
      items:
        - label: 当前轮次
          low: 1.45
          mid: 1.5
          high: 1.55
          displayValue: ~$1.5B
          note: 最新披露的投后估值
        - label: 悲观情景
          low: 0.6
          mid: 0.75
          high: 0.9
          displayValue: $0.6-0.9B
          note: 增长放缓，市场重新锚定上市软件可比公司
        - label: 基准情景
          low: 1.3
          mid: 1.5
          high: 1.7
          displayValue: $1.3-1.7B
          note: 强增长延续，但披露质量只小幅改善
        - label: 乐观情景
          low: 2.2
          mid: 2.5
          high: 2.8
          displayValue: $2.2-2.8B
          note: 增长继续复利，企业级信任证据跟上
        - label: 概率加权
          low: 1.35
          mid: 1.45
          high: 1.55
          displayValue: ~$1.45B
          note: 大致落在当前轮次附近，因此上行空间没有明显不对称
    claimRefs:
      - CV032
      - CV033
      - CV034
      - CV035
      - CV040
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 按投资委员会口径，给市场、验证、经济性、风险、估值和证据质量打分。
    data:
      items:
        - label: 市场顺风
          value: 8/10
          note: 品类增长和采用仍然强劲
        - label: 收入端证明
          value: 9/10
          note: 以公司阶段看，ARR 和融资轨迹异常强
        - label: 客户证明质量
          value: 6/10
          note: 覆盖面有用，但公司一方撰写内容仍然太多
        - label: 经济性披露
          value: 3/10
          note: 留存、毛利率和烧钱细节仍然单薄
        - label: 竞争压力
          value: 4/10
          note: 资金充足的同业压缩战略余地
        - label: 当前估值吸引力
          value: 5/10
          note: 撑得住，但没有明显便宜到偏向投资者
        - label: 整体立场
          value: Track
          note: 保持建设性，但等待更强尽调或更好价格
    approximationNotes: 评分是基于公开证据综合出的序数型尽调判断，不是公司披露的 KPI。
    claimRefs:
      - CV015
      - CV020
      - CV025
      - CV028
      - CV031
      - CV036
      - CV040
