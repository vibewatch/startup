  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人 / 尽调路径
    rows:
      - - 留存和 NRR
        - 队列留存、GRR、NRR 和活跃付费客户队列
        - 决定当前 ARR 是否配得上溢价倍数
        - 财务数据室和队列复核
      - - 毛利率和支持负担
        - 托管、推理、支持和支付成本结构
        - 区分真正 SaaS 杠杆和昂贵增长
        - 财务 + 工程利润率拆解
      - - 信任和事件
        - 事件历史、SLA、安全测试、隐私控制、采购材料
        - 对业务关键和企业场景至关重要
        - 安全尽调和客户访谈
      - - 企业转化
        - 管线组合、ACV 阶梯、向团队或企业扩张
        - 检验上行能否跑赢 SMB ARPA 上限
        - 用匿名化管线数据做销售 / GTM 复核
      - - 股权结构表和优先权
        - 完全稀释股权结构表、清算优先权和按比例参与权
        - 需要用它把经营结果转化为实际回报
        - 法律尽调和融资文件
    notes: 这些是阻断性尽调要求，不是可有可无的加分项。
    claimRefs:
      - CV010
      - CV037
      - CV038
      - CV039
