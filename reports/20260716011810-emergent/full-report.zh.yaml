        title: 决策闸门与最后尽调问题
        blocks:
          - type: paragraph
            body: >-
              投资决策前剩余工作异常清晰。投资人不需要更多证据证明 Emergent
              有意思；他们需要证明，这轮增长的质量足以配得上当前价格。闸门问题很直接：队列能否留住，扣除推理和支持成本后毛利率是否健康，信任和事件控制是否足以支撑企业扩张，股权结构表在优先权和稀释后是否仍留有足够上行空间。这些不是小的清理项，而是区分两类公司的关键：一类是值得耐心资本持有的高溢价增长公司，另一类是可能快速重定价的动量故事。决策含义很务实。继续看好业务，但除非尽调缩小信心缺口，否则不要上调建议。障碍清掉后，这一轮仍可能成立；如果没有，当前估值已经留下的容错空间有限。故事很好，但仍必须靠披露来挣得溢价。
