      - number: '1.4'
        title: 里程碑、披露缺口与早期谨慎信号
        blocks:
          - type: paragraph
            body: >-
              第一年的时间线显示，这家公司从成立到获得品类可见度的速度极快。除融资节点外，Emergent 的里程碑还包括 2025 年公开发布、Google 战略投资、2026 年 1 月宣布七个月做到 $50M
              年经常性收入（ARR），以及到 2026 年 7 月形成更宽的产品野心：移动应用构建、连接 GitHub 的代码所有权，以及 Wingman
              这个原生于消息场景的自主智能体。核心尽调问题在于，公开披露仍然选择性很强。Emergent
              披露了亮眼的顶线采用数据和有说服力的构建者故事，但没有披露流失、留存、毛利率或详细治理地图。品类层面的风险也已经可见：TechCrunch 指出公司仍把设计质量视为弱点，ACM、IBM、AppSec Santa
              和 Axios 则都记录了氛围编程软件可能跑在安全和维护控制前面。这些报道都不能证明 Emergent
              已经出现特定失败，但它们确立了一个非技术构建者平台必须比同行管理得更好的风险面；否则早期规模很难转化为持久的企业或 SMB 价值。
