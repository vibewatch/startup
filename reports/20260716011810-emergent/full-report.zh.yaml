  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - ARR 复合增长走向 $190M-$220M+，客户证明变宽，企业信任改善，品类继续拿到私募溢价倍数
        - ~$2.2B-$2.8B 估值区间；相对当前标记有明显上行
        - 执行广度、企业可信度、资本竞争
        - 有可能，但不能只靠今天亮眼增长惯性延续
      - - 基准
        - 增长仍强，但披露质量只小幅改善，市场不再支付越来越高的倍数
        - ~$1.3B-$1.7B 区间；当前轮次大致合理
        - 留存或利润率不明压住上行
        - 目前多数证据指向这里
      - - 悲观
        - 增长明显放缓，留存或信任证据恶化，估值重新锚定到公开软件区间
        - ~$0.6B-$0.9B 区间；降估值轮或平轮风险显现
        - 公开可比公司倍数压缩、流失、事件或高端市场转化停滞
        - 不是基准情景，但在当前价格下可信到足以影响决策
    notes: 区间很宽，因为关键承销输入仍未公开。
    claimRefs:
