  - id: FU004
    title: 获客与扩张循环
    type: flow
    summary: 公开故事显示，这是一条产品主导循环：构建者发现 Emergent，解决一个工作流，再把使用扩展到新应用或外部客户。
    data:
      nodes:
        - id: discover
          label: 广告、内容或试验带来的发现
          tone: neutral
        - id: internal
          label: 解决首个内部工作流
          tone: positive
        - id: production
          label: 生产应用 / 团队采用
          tone: positive
        - id: external
