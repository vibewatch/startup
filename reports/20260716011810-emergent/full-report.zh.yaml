        blocks:
          - type: paragraph
            body: >-
              法律与监管压力正在升高，时间点正好卡在 Emergent 进入更敏感工作流之际。EU AI Act 将相关 AI 系统的透明度义务定在 August 2026 生效，并对通用 AI
              模型提供方施加更广泛义务。英国指引同样强调，AI 系统使用个人数据时，必须履行数据保护义务并开展风险评估。Emergent
              自身公开法律界面比理想状态更难审查：隐私与条款端点通过常规提取几乎不呈现可读政策细节，这本身就是尽调上的麻烦。采购风险由此而来。大型机构和企业会要求易审阅的信任材料、正式支持承诺和清晰隐私语言。今天的公开界面通过安全理念和案例研究说法提供了一部分安慰，但还没有达到成熟平台通常应有的机构级证据深度。欧洲和英国买方会期待这些材料成为常规配置，而不是逐案定制。
