      - number: '8.2'
        title: 情景逻辑与区间承销
        blocks:
          - type: paragraph
            body: >-
              估值工作应从情景出发，而不是从单一标题倍数出发。乐观情景下，Emergent 继续把品类热度转化为持久增长，ARR 向 $200 million 或更高扩张，并补上当前部分信任和企业级证明缺口。鉴于私有 AI
              构建器可比公司已经显示，投资人愿意为持续爆发式增长支付高溢价，这可以支撑明显更高的估值标记。基准情景更冷静：增长仍强，但今天的叙事动能并不能足够快地全部转成持久的收入质量，难以支撑倍数继续扩张。在这个情形下，当前估值标记大致合理。悲观情景不是业务失败，而是普通软件公司的重新定价。如果留存、满意度或合规准备度不及预期，市场可能很快重新锚定到公开软件公司区间，下行会很大。最大不确定性在证据质量，而不是收入存在与否，所以情景区间才是正确镜头。
