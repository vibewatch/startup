        blocks:
          - type: paragraph
            body: >-
              创始人与市场匹配是 Emergent 最强的公开信号之一。Mukund Jha 曾在 Dunzo 积累创业运营经验，外界也反复把他视为商业叙事者：定制软件应该让没有工程团队的人也能使用。Madhav Jha
              的研究和平台背景更深，经历横跨 Amazon SageMaker、Dropbox 和高阶学术训练。这个组合解释了为什么 Emergent
              既会讲有野心的消费级产品体验，也会讲技术交付系统。公开足迹也明显跨国。TechCrunch 称团队约 200 人，多数员工在 Bengaluru，San Francisco
              规模较小；其他资料也把创始人放在两座城市之间，并把公司定位为印度创始、商业触达美国市场。治理上的取舍是透明度不足：不同于成熟软件公司，Emergent
              没有公开完整董事会、委员会或股权结构表。公开来源最强的是创始人履历，最弱的是更广泛的管理层深度、独立监督和控制权。
