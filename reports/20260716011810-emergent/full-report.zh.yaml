      - CR003
      - CR018
      - CR027
      - CR040
  - id: FR002
    title: 依赖风险流
    type: flow
    summary: 风险从模型和连接器宽度进入，再传导到部署、客户运营和机构信任。
    data:
      nodes:
        - id: models
          label: 模型 / 生成代码
          tone: warning
        - id: connectors
          label: 连接器 + 外部系统
          tone: warning
        - id: deploy
          label: 部署 + 版本控制
          tone: neutral
        - id: ops
          label: 客户运营
          tone: negative
        - id: trust
          label: 监管 / 采购信任
          tone: negative
      edges:
        - from: models
          to: deploy
          label: 质量 / 回归
        - from: connectors
          to: ops
          label: 动作副作用
        - from: deploy
          to: ops
          label: 生产故障
        - from: ops
          to: trust
          label: 事故 / 投诉
        - from: connectors
          to: trust
