  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价机制
        blocks:
          - type: paragraph
            body: >-
              公开定价证据显示，Emergent 有意设计了一条很宽的变现阶梯。它从免费层开始，随后销售 Standard、Pro 和 Team
              计划，也允许买方购买额外点数。这很重要，因为收入模式看起来是为产品驱动扩张设计的：公司可以低成本获取非技术构建者，把更重度使用变现，再把部分账户推进协作型团队计划或定制企业协议。定价阶梯也说明，算力消耗很重要。更高套餐宣传更大的上下文窗口、更大的机器和更丰富的协作功能，意味着变现不只绑定座席，也绑定软件生成和托管活动的强度。这有利于增长，但也意味着仅看标价无法看清实际收入质量。没有披露折扣、转化或套餐结构时，公开定价只能证明模式存在，不能证明它能高效扩张。
