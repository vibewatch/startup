      - CE015
      - CE016
      - CE028
      - CE033
      - CE035
  - id: FU001
    title: 客户证明强度图
    type: matrix
    summary: 公开证据在创始人和 SMB 细分市场最强，机构引用较薄但真实存在。
    data:
      columns:
        - 证明宽度
        - 生产深度
        - 独立佐证
      rows:
        - label: 创始人 / SMB
          values:
            - label: 强
              tone: positive
            - label: 强
              tone: positive
            - label: 中
              tone: neutral
        - label: 代理机构 / 顾问
          values:
            - label: 中
              tone: neutral
            - label: 中
              tone: neutral
            - label: 低
              tone: warning
        - label: 类企业机构
          values:
            - label: 低至中
              tone: warning
            - label: 中
              tone: neutral
            - label: 低
              tone: warning
    approximationNotes: 单元格概括公开证据组合，而非实际收入占比。
    claimRefs:
