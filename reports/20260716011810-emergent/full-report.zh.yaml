  - id: FU003
    title: 耐久度 KPI
    type: kpi
    summary: 采用广度可见，但相对于公司的规模主张，留存和评价成熟度仍缺失。
    data:
      items:
        - label: 已披露付费客户
          value: 200,000+
          unit: accounts
          status: observed
        - label: 业务关键使用主张
