      - number: '8.3'
        title: 可比公司集合及其真正证明的东西
        blocks:
          - type: paragraph
            body: >-
              可比公司分析只能有条件地支持当前轮次。最强的私有市场信号来自 Replit、Lovable 等同业；它们披露的收入和估值水平显示，投资人仍愿意承销激进的 AI 构建器结果。StackBlitz 和 Bolt
              提供了有用的较低层级参照：市场也在奖励更窄的故事，说明品类有宽度。但这些私有可比样本是双刃剑。它们显示上行潜力，也确认资本正快速流向资金充足的对手。Appian
              以及更广泛开发者软件公司的公开市场参照仍然重要，因为它们代表市场不再只为叙事速度付费时会发生什么。因此，Emergent
              既不显然高估，也不显然便宜。它夹在私有市场溢价狂热和公开市场纪律之间，建议也应反映这个中间位置。
