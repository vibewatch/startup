  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 按客户工作流看产品范围
        blocks:
          - type: paragraph
            body: >-
              Emergent 卖的是结果，而不只是生成模型。它的公开页面持续描述一个系统：把自然语言提示词转成可投产软件，包括 Web
              和移动应用，并在第一次构建后给客户继续迭代的工具。这一点很重要，因为产品更接近托管式软件创建环境，而不是纯粹的 代码副驾。GitHub 同步、部署指导、教程和社区项目都强化了同一点：Emergent
              想让非技术或半技术买方从想法走到可维护应用，而不必组装复杂工具链。这个工作流叙事是公司在公开材料中最清晰的差异化之一。产品不是先定位为职业工程师的
              IDE；它定位为给需要快速软件结果的人使用的完整构建并发布系统。公开案例密度也强化了这一解读。这也解释了为什么定价、文档和社区本身都是产品的一部分。
