  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 立场
      - 论点
      - 当前证据
      - 什么会改变判断
    rows:
      - - 投资逻辑
        - 收入端爆发势头真实
        - $120M ARR / 运行率、200k+ 付费用户、融资推进很快
        - 需要队列和利润率数据证明质量
      - - 投资逻辑
        - 产品广度把 TAM 扩到编码助手之外
        - 应用、部署、集成和智能体工作流都已露出
        - 需要证明广度不会制造脆弱的支持负担
      - - 投资逻辑
        - 全球分布降低单一地域集中度
        - 据称收入覆盖美国、欧洲和世界其他地区
        - 需要区域留存和企业客户组合
      - - 反向逻辑
        - 公开证据对收入耐久性解释仍少
        - 未披露 NRR、流失、毛利率或支持成本结构
        - 直接队列、利润率和回款数据会降低折价
      - - 反向逻辑
        - 面向业务关键场景，信任触点显得单薄
        - 有隐私页面，但企业级证明和审查深度仍有限
        - SOC、事件和采购证据会提升舒适度
      - - 反向逻辑
        - 品类资本强度快速上升
        - Replit、Lovable 和 Bolt 都显示竞争对手资金充足、势头强
        - 更清晰的护城河或更好的价格会缓和担忧
    notes: 反向逻辑不是 Emergent 没有增长，而是公开记录仍没有充分说明增长质量和防御性。
    claimRefs:
      - CV006
