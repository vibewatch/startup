      - CE007
      - CE008
      - CE009
      - CE010
      - CE022
      - CE030
  - id: FE003
    title: 差异化 / 就绪度 KPI
    type: kpi
    summary: Emergent 最强的公开产品信号是工作流宽度和可及性；独立可靠性证明仍是最大技术缺口。
    data:
      items:
        - label: 工作流宽度
          value: High
          unit: build + deploy + GitHub + mobile
          status: observed
        - label: 非技术可及性
          value: High
          unit: community + positioning
          status: observed
        - label: 连接器宽度
          value: 300+ apps for Wingman
          unit: apps
          status: observed
        - label: 代码可移植性
          value: Present
          unit: GitHub sync
          status: observed
        - label: 独立可靠性证明
          value: Limited
          unit: public evidence
          status: estimated
        - label: 正式信任材料
          value: Partial / unclear
          unit: public surface
          status: estimated
    approximationNotes: 估计项概括披露完整度，而非实测产品表现。
    claimRefs:
      - CE012
      - CE017
      - CE018
      - CE023
      - CE028
      - CE035
  - id: FE004
    title: 安全控制图
    type: matrix
    summary: Emergent 公开说明了 Wingman 的分层安全模型，但各功能面的正式证明深度仍不均衡。
    data:
      columns:
        - 策略控制
        - 沙箱
        - 可审计性
        - 用户确认
        - 公开深度
      rows:
        - label: 核心应用构建器
          values:
            - label: 部分
              tone: neutral
            - label: 暗含
              tone: neutral
            - label: 低
              tone: warning
            - label: 低
              tone: warning
            - label: 有限
              tone: warning
        - label: Wingman 助手
          values:
