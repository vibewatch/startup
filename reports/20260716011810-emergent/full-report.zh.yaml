      - CU035
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 安全和信任风险目前占主导，因为工作流宽度和非技术使用会放大失败后果。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
      rows:
        - label: 安全漏洞
          values:
            - label: 高
              tone: negative
            - label: 关键
              tone: negative
            - label: 中
              tone: warning
        - label: 提示注入 / 跨工具滥用
          values:
            - label: 高
              tone: negative
            - label: 关键
              tone: negative
            - label: 中
              tone: warning
        - label: 监管 / 隐私义务
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: negative
            - label: 低至中
              tone: warning
        - label: 留存 / 集中度不透明
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: negative
            - label: 低
              tone: warning
    approximationNotes: 矩阵取值是有证据支撑的判断，不是量化模型。
    claimRefs:
