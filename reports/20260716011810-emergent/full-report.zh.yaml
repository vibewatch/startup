              工具或漫长工程周期的替代品。这些故事支撑了一个判断：如果平台真的减少劳动力或解锁新收入，客户就能为经常性支出找到理由。仍然不透明的是供给侧。产品承诺需要大量 AI 推理、云执行、部署支持、GitHub
              同步、移动工作流和不断增长的安全控制；即使公司在传统硬件意义上不是资本密集型，这些都会产生真实运营成本。公开来源没有披露毛利率、托管成本负担、支持强度，也没有披露有多少用户真正从免费或低价计划向上扩张。因此，买方价值主张可见，但公司的利润率结构仍主要靠推断。支持人员投入强度也是另一个缺失驱动项。
