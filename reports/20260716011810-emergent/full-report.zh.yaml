      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              这个市场由两类相互重叠的人群搭起来。第一类是非技术买方：SMB
              业主、运营者、代理商、顾问和产品经理，他们想要定制工作流或面向客户的工具，却不想组建完整工程团队。第二类是技术买方，他们在创业公司、代理商或内部创新团队中把 AI 构建器当作加速器。Hostinger
              的非开发者使用数据和 Searchlab
              的公民开发者采用数据说明了为什么第一类人群如此重要：增长不只是开发者生产率提升，也是过去无法经济地购买或构建定制工具的人开始创建软件。采用路径通常从手工流程、电子表格或碎片化 SaaS
              栈开始，进入原型生成，随后要么升级成已部署的内部或面向客户应用，要么被治理、可靠性或维护压力卡住。新兴 AI
              应用构建器最激烈争夺的是这段旅程的前半段；企业低代码既有厂商仍主导治理最重的生产工作流。Emergent 明确聚焦创业者和 SMB，意味着它的天然战场在中间：足够生产级，能跑业务；又足够简单，买方仍能亲自构建。
