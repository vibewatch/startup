  - id: FU002
    title: 具名客户结果区间
    type: range
    summary: 客户故事披露了可衡量结果，但它们是零散案例，而不是组合层面的数据。
    data:
      items:
        - label: 备餐创始人所建系统月收入
          low: 100
          mid: 110
          high: 120
          unit: USD K/mo
          status: company-claimed
        - label: 线索生成创始人 3 周收入
