      - number: '2.2'
        title: 市场规模视角与区域形态
        blocks:
          - type: paragraph
            body: >-
              公开市场估算差异很大，因为它们衡量的是技术栈中的不同层。最窄、偏分析师级的治理型低代码口径，根据 Gartner 相关的 Caspio 摘要，2026 年约为 $44.5B。更宽的低代码 / 无代码汇总口径在
              Kissflow 约为 $52B、在 Searchlab 约为 $65B，而 Searchlab 还把更广义市场推到 2028 年约 $94B。另一个不同但相关的视角是 AI 原生子领域：Hostinger
              引述的无代码 AI 平台市场 2025 年为 $6.56B，到 2034 年增长到超过 $75B；GetMocha 则称 AI 代码工具 2023 年为 $4.86B，到 2030 年增长到
              $26.03B。这些不是矛盾，更像是品类定义不同。对 Emergent 来说，最宽口径估算只能作为天花板指标。更可操作的视角，是围绕 SMB
              定制软件、非技术构建者，以及需要可部署应用而不是代码片段的买方所形成的受限切片。区域上，今天市场在北美和欧洲最强，亚太增长最快——这一形态与 Emergent 自身早期收入分布异常吻合。
