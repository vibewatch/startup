      - number: '2.4'
        title: 增长驱动、约束与尽调重点
        blocks:
          - type: paragraph
            body: >-
              品类增长驱动很容易识别：软件需求上升、开发者稀缺、模型访问更便宜、应用生成工作流更好，以及买方愿意用速度和更低成本换取不那么完美的软件工艺。Searchlab、ToolJet、Hostinger 和
              GetMocha 都呈现了同一故事的不同版本——更多应用正用低代码和 AI 构建，更多构建者来自工程团队之外，头部平台以异常速度扩张。更难的问题是，什么会约束持久市场价值。Caspio 和 Kissflow
              在这里尤其有用，因为它们把即时生成的魔法，与治理型部署的混乱经济性拆开。一旦应用触碰受监管数据、核心工作流或真实客户记录，治理、权限、审计轨迹、缺陷控制和生命周期管理就比提示词速度本身更重要。品类最可能在这里分叉。原型优先的构建器会继续快速增长，但长期赢家会是那些把信任、生产可靠性和所有权解决到足够好，让买方在演示时刻之后仍愿意留下来的公司。这正是
              Emergent 最终必须通过的市场测试。
