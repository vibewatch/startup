      - CV022
      - CV023
      - CV032
      - CV033
      - CV034
      - CV040
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 已披露指标
      - 估值 / 倍数信号
      - 参考意义
      - 局限
    rows:
      - - Emergent（当前轮次）
        - ~$120M ARR / 运行率
        - ~$1.5B 投后（~12.5x ARR）
        - 当前决策的直接锚点
        - 留存、利润率和股权结构表条款仍未公开
      - - Replit（2025 年 9 月）
        - ~$150M 年化收入
        - $3B 私募轮（~20x）
        - 已披露收入、更大规模的 AI 构建者可比对象
        - 产品组合和规模不同；收入阶段更靠后
      - - Lovable（2025 年 12 月 / 2026 年 3 月）
        - '>$200M ARR、估值 $6.6B，之后 $400M ARR'
        - 私募溢价远高于公开低代码区间
        - 显示市场给品类龙头定价可多激进
        - 热情峰值可能高估可持续部分
      - - StackBlitz / Bolt（2026 年讨论）
        - 数千万经常性收入、~1M 月活用户
        - 据报道融资目标为 $700M
        - 对产品范围更窄的低一档可比对象有参考价值
        - 来源质量较弱，融资仍在讨论中
      - - Appian（公开参考）
        - ~$617M 收入、~$2.33B 市值
        - ~3.8x 往绩收入
        - 可用于校准较慢增长公开低代码公司的现实定价
        - 成熟度、盈利能力和公开市场环境不同
    notes: 这组样本用于框定估值讨论，不是声称不同商业模式之间可以完美可比。
