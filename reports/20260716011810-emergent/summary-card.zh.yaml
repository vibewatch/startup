  topStrengths:
    - 对一家 2024 年成立的公司来说，Emergent 规模异常突出；披露的 ARR / 收入运行率、客户和应用创建指标都远高于典型早期软件公司。
    - 产品清楚瞄准非技术构建者；相比许多开发者优先的 AI 编程工具，它的买方焦点更有差异。
    - 创始人与市场匹配度强：Mukund Jha 有 Dunzo 运营经历，Madhav Jha 有 ML 系统背景。
    - 公司吸引了强投资人阵容，资本也足以降低近期生存风险。
    - 私募市场可比公司显示，只要增长继续异常突出，更广义的 AI 构建工具类别可以支撑高溢价估值。
  topRisks:
    - 流失率、NRR、毛利率、烧钱速度和支持成本结构的公开证据仍薄，收入质量还没有被充分证明。
    - 如果客户真的在构建业务关键软件，当前信任、合规和事故历史披露显得偏轻。
    - Replit、Lovable、Bolt 等竞争对手同样资金充足，资本本身不是护城河。
    - 当前价格已经假设公司继续爆发式执行，留给普通软件式重估的空间更小。
    - 股权结构中的优先权和稀释条款仍未公开，实际投资人回报可能显著差于头部估值暗示。
  unresolvedGaps:
    - 按套餐和地区拆分的队列留存、GRR、NRR，以及活跃付费客户行为。
    - 毛利率、推理和托管成本负担、支持强度，以及 CAC 回本周期。
    - 事故历史、SLA 承诺、安全尽调材料和企业采购证据。
    - 第一方案例研究之外的 pipeline 质量和企业转化证据。
    - 完全稀释后股权结构、清算优先权，以及驱动实际回报测算的其他融资条款。
