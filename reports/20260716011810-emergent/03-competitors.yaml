callouts:
- calloutType: insight
  title: Emergent is being attacked from both sides of the market
  body: Direct prompt-to-app peers compete on ease and speed, while enterprise incumbents and developer ecosystems compete on trust, governance, and distribution. The company’s strongest position is the middle ground where the buyer is non-technical but still wants a real production app.
  claimRefs:
  - CP001
  - CP017
  - CP018
  - CP024
  - CP028
- calloutType: risk
  title: Prompt-to-app generation is becoming table stakes
  body: The more direct peers and adjacent ecosystems add full-stack generation, hosting, and enterprise controls, the less durable pure generation quality becomes as a moat. Emergent will need distribution, retention, and trust to stay differentiated.
  claimRefs:
  - CP016
  - CP029
  - CP035
  - CP036
- calloutType: strength
  title: The company’s buyer narrative is clearer than many peers’
  body: 'Emergent’s strongest competitive edge today is audience precision: it consistently frames itself for non-technical founders, SMBs, and operators rather than trying to be everything to everyone. That can be valuable if the company turns early usage into durable operational software.'
  claimRefs:
  - CP015
  - CP028
  - CP038
