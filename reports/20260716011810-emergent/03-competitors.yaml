- id: capability-pricing-and-switching-dynamics
  title: Capability, pricing, and switching dynamics
  body: 'Capability comparisons matter more than brand names because nearly every platform now claims AI-generated full-stack output. The real differences sit in hosting, backend services, enterprise controls, design flexibility, code ownership, and developer adjacency. Replit and Bolt push relatively far on bundled infrastructure. Lovable appears strongest where rapid creation and design accessibility matter. Builder.io and v0 are advantaged in visual or frontend-centric workflows. Cursor and Copilot Workspace win where codebase context and engineering productivity dominate the buying decision. Pricing pages reinforce these splits: direct peers typically offer self-serve ladders from casual builders to teams, while OutSystems and Mendix preserve sales-led opacity as part of their enterprise moat. Switching remains easiest before a buyer commits real workflows, data, auth, or operations into a specific platform. Once hosting, database, roles, and enterprise governance enter the picture,
    multi-homing gets harder and trust becomes much more important than the initial wow factor of generation speed. That trade-off is now central.'
  claimRefs:
  - CP019
  - CP020
  - CP021
  - CP022
