  evidenceGaps:
  - type: missing-source
    severity: material
    topic: reliability-benchmark
    missingEvidence: Hands-on benchmark evidence comparing how well direct peers ship and maintain production-grade apps over time.
    whyItMatters: Public positioning pages say little about long-run quality or failure rates.
    diligencePath: Run standardized build-and-maintain tests across Emergent, Replit, Lovable, and Bolt on the same workflows.
    relatedQuestionRefs:
    - QP024
    - QP025
    relatedTableRefs:
    - TP002
  - type: missing-source
    severity: material
    topic: retention-proof
    missingEvidence: Cohort retention and production-app survival rates by competitor.
    whyItMatters: Without durability data, feature comparisons overweight first-use delight and underweight real competitive advantage.
    diligencePath: Request management anecdotes with denominators or find third-party cohort data.
    relatedQuestionRefs:
    - QP021
    - QP024
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: win-loss-data
