  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Security and platform-integrity risks
        blocks:
          - type: paragraph
            body: >-
              The single most important risk cluster is security. Emergent is not merely helping users write snippets of
              code; it is helping them generate, deploy, and in some cases automate actions across real systems. Wingman
              raises the stakes further because it can coordinate work across hundreds of applications, messages,
              documents, and scheduled tasks. Emergent’s own security write-up is thoughtful and specific, especially on
              prompt injection and cross-tool side effects, but that does not eliminate the underlying category risk.
              Independent sources from ACM, IBM, AppSec Santa, and Security Boulevard all describe a pattern where
              AI-generated applications can be secure enough to look functional while still shipping major
              vulnerabilities, data exposures, or technical-debt problems. Because Emergent aims at non-technical users,
              the risk is amplified: the builder who depends on the tool most may be the least equipped to audit its
              output directly. The most credible risk path is not one catastrophic model failure, but many smaller
              unsafe defaults compounding across a broad user base.
            claimRefs:
