        title: Exhibits
        blocks:
          - type: callout
            title: The real market is narrower than the biggest TAM headlines
            body: >-
              The broadest LCNC numbers are useful for context, but Emergent’s actual battleground is the smaller slice
              where non-technical buyers want deployable custom software without hiring developers. That slice is still
              very large, but it should not be confused with all low-code spend.
            calloutType: insight
            claimRefs:
