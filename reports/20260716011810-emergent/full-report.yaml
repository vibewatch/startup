          - type: callout
            title: The buyer base is expanding beyond engineering teams
            body: >-
              Searchlab, Hostinger, and Kissflow all point to the same structural shift: the fastest category growth
              comes from citizen developers, SMB operators, and first-time builders. Emergent’s focus on that group
              therefore targets the fastest-growing user pool rather than the most entrenched incumbent cohort.
            calloutType: strength
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM031
          - type: callout
            title: The market can grow rapidly while still punishing weak production reliability
            body: >-
              Caspio, Kissflow, and broader app-builder statistics all suggest the category bifurcates at the moment an
              app touches governed data or business-critical workflows. Fast generation is no longer enough once buyers
              demand auditability, quality control, and low-defect operation.
            calloutType: risk
            claimRefs:
