      - number: '7.4'
        title: Financial, governance, and thesis-break risks
        blocks:
          - type: paragraph
            body: >-
              The remaining risks are governance and thesis sustainability risks. Public sources still do not provide
              enough disclosure on concentration, renewal quality, or governance structure to know how fragile the
              revenue base might become under stress. The founder story is strong, but strong founder centrality can
              become key-person exposure when processes and customer mix are opaque. Several independent articles
              already frame the company’s valuation durability as contingent on proving churn, contract quality, and
              secure operation over time. That means the investment thesis can break in monitorable ways: a visible
              privacy incident, material churn, procurement rejection from larger institutions, or evidence that
              business-critical apps built by non-technical users become too brittle to maintain. The company appears
              aware of many of these risks, which matters, but awareness is not the same as resolved exposure. The
              faster growth continues, the less forgiving the market will be about unresolved trust gaps.
