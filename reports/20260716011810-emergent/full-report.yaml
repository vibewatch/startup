  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct AI app-builder peers
        blocks:
          - type: paragraph
            body: >-
              Emergent’s most direct competitors are prompt-driven builders that promise to move a user from idea to
              deployable app with very little traditional software labor. Replit, Lovable, and Bolt all fit that
              description better than enterprise low-code incumbents or developer-only agents. Replit explicitly markets
              business apps, mobile apps, rapid prototyping, and built-in infrastructure. Lovable leans harder into
              app-and-website creation by chatting with AI and presents a creator-friendly surface. Bolt spans websites,
              apps, and prototypes while emphasizing backend infrastructure and built-in cloud services. These three
              products overlap most with Emergent’s value proposition, but they do not overlap perfectly. Emergent’s own
              story is more explicitly centered on non-technical entrepreneurs, agencies, and SMB operators who want
              production-grade software that can run operations, not merely a prototype or developer-friendly sandbox.
              That distinction matters because it is currently Emergent’s clearest direct-buyer differentiation even if
              the underlying generation capabilities across peers are converging fast.
            claimRefs:
