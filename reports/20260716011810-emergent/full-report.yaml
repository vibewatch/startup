      - number: '4.3'
        title: Cost structure, unit economics, and buyer ROI
        blocks:
          - type: paragraph
            body: >-
              Buyer-side ROI is much easier to observe than company-side unit economics. Emergent's case studies
              repeatedly frame the product as a substitute for six-figure agency work, multiple disconnected SaaS tools,
              or long engineering timelines. Those stories support the idea that customers can rationalize recurring
              spend if the platform removes real labor or unlocks new revenue. What remains opaque is the supply side.
              The product promise requires heavy AI inference, cloud execution, deployment support, GitHub
              synchronization, mobile workflows, and growing security controls, all of which create real operating costs
              even if the company is not capital intensive in the traditional hardware sense. Public sources do not
              disclose gross margin, hosting-cost burden, support intensity, or the share of users who meaningfully
              expand beyond the free or low-cost plans. As a result, the buyer value proposition is visible, but the
              company's margin structure is still mostly an inference problem. Support staffing intensity is another
