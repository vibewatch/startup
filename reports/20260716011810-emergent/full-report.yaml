  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing mechanics
        blocks:
          - type: paragraph
            body: >-
              Public pricing evidence points to a deliberately broad monetization ladder. Emergent starts with a free
              tier, then sells Standard, Pro, and Team plans, while also allowing buyers to purchase extra credits. That
              matters because the revenue model appears designed for product-led expansion: the company can acquire
              non-technical builders cheaply, monetize heavier usage, and then move some accounts into collaborative
              team plans or custom enterprise agreements. The pricing ladder also suggests that compute consumption
              matters. Bigger plans advertise larger context windows, bigger machines, and richer collaboration
              features, implying that monetization is tied not just to seats but also to the intensity of software
              generation and hosting activity. This is attractive for growth, but it also means list pricing alone does
              not reveal realized revenue quality. Without disclosed discounting, conversion, or plan mix, public
              pricing can prove the model exists but not how efficiently it scales.
