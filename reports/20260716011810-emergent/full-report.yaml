      - number: '8.4'
        title: Decision gates and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The remaining work before an investment call is unusually clear. Investors do not need more proof that
              Emergent is interesting; they need proof that the quality of this growth is good enough for the current
              price. The gating questions are straightforward: are cohorts retaining, are margins healthy after
              inference and support costs, are trust and incident controls good enough for enterprise expansion, and
              does the cap table leave enough upside after preferences and dilution? These are not minor clean-up
              requests. They are the difference between a premium-growth company that deserves patient capital and a
              momentum story that could re-rate quickly. The decision implication is practical. Stay constructive on the
              business, but do not upgrade the recommendation unless diligence narrows the confidence gap. If those
              blockers are cleared, the round can still work. If they are not, the current mark already leaves limited
              room for error. It is a good story, but still one that must earn its premium through disclosure.
            claimRefs:
