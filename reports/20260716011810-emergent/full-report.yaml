  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Emergent sits in a fast-converging market that mixes low-code/no-code, AI code tools, and prompt-driven
              application builders. The cleanest boundary is not all software-development spend and not merely
              traditional no-code. Instead, the relevant market is the layer where buyers want to move from business
              need to deployable software with substantially less engineering labor. Caspio’s 2026 framing is useful
              because it splits the category into prototype-first AI generators and governed platforms that can run real
              business applications with auditability and access control. Emergent belongs closer to the prompt-first
              end of that spectrum, but its product ambition reaches beyond mockups into full-stack deployment, GitHub
              ownership, hosting, and monetization. That puts its true substitute set far beyond low-code vendors alone.
              Buyers can also hire agencies, use internal developers, stitch together spreadsheets and niche SaaS tools,
              or adopt developer-centric agents like Cursor and Copilot Workspace. The boundary therefore has to include
              direct AI app builders, adjacent developer tools, and legacy low-code incumbents while excluding broader
              enterprise-software categories that do not meaningfully shorten the custom-app creation workflow.
