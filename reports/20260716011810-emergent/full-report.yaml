      - number: '7.2'
        title: Operational, customer, and dependency risks
        blocks:
          - type: paragraph
            body: >-
              Operational risk rises sharply once apps stop being prototypes and start running core workflows.
              Emergent’s public customer stories now include meal-prep operations, energy-procurement contracts,
              enterprise product release coordination, a university phone agent, and fleet management. In those
              contexts, a bug is not just a cosmetic defect; it can affect orders, bookings, customer communication, or
              compliance-sensitive workflows. Review evidence also hints at platform fragility, with TechRaisal citing
              reports of outages losing entire projects. Dependency risk adds another layer. The platform spans
              deployment, GitHub, mobile packaging, integrations, and background automation, so failures can stem from
              model behavior, external connectors, version-control sync, or weak customer oversight. That complexity is
              manageable, but it means operational risk can emerge from many layers at once. As more customers rely on
              these systems daily, support and incident response quality will matter more than launch speed.
            claimRefs:
              - CR016
