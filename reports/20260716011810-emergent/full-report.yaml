      - number: '1.2'
        title: Founders, operating footprint, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Founder-market fit is one of Emergent’s strongest public signals. Mukund Jha brings prior startup
              operating experience from Dunzo and is repeatedly cited as the commercial storyteller for the thesis that
              custom software should be accessible to people without engineering teams. Madhav Jha brings a deeper
              research-and-platform pedigree through prior work spanning Amazon SageMaker, Dropbox, and advanced
              academic training. That combination helps explain why Emergent speaks both the language of ambitious
              consumer-grade product experience and the language of technical delivery systems. The public footprint is
              also clearly transnational. TechCrunch describes a team of roughly 200 employees with most staff in
              Bengaluru and a smaller San Francisco presence, while other profiles place the founders across both cities
              and position the company as Indian-founded with US commercial reach. The governance trade-off is opacity:
              unlike a mature software company, Emergent does not publicly expose a full board, committee, or cap-table
              structure. Public sources are strongest on founder biography and weakest on broader leadership depth,
              independent oversight, and control rights.
