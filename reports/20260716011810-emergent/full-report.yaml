      - number: '7.3'
        title: Legal, regulatory, and procurement risks
        blocks:
          - type: paragraph
            body: >-
              Legal and regulatory pressure is increasing at exactly the point where Emergent is moving into more
              sensitive workflows. The EU AI Act makes transparency obligations for relevant AI systems effective in
              August 2026 and imposes broader obligations on providers of general-purpose AI models. UK guidance
              similarly emphasizes data-protection obligations and risk assessment when personal data is used in AI
              systems. Emergent’s own public legal surface is harder to inspect than ideal because the privacy and terms
              endpoints do not render much readable policy detail through normal extraction, which itself is a diligence
              annoyance. Procurement risk follows from that. Larger institutions and enterprises will want
              easy-to-review trust artifacts, formal support commitments, and clear privacy language. The public surface
              today gives partial reassurance through security philosophy and case-study claims, but still not the depth
              of institutional evidence a mature platform would normally provide. Buyers in Europe and the UK will
              expect those materials to be routine rather than bespoke.
            claimRefs:
