  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope in customer workflow terms
        blocks:
          - type: paragraph
            body: >-
              Emergent sells an outcome, not just a generation model. Its public pages consistently describe a system
              that turns natural-language prompts into production-ready software, including web and mobile applications,
              and then gives customers the tools to keep iterating after the first build. This matters because it puts
              the product closer to a managed software-creation environment than to a pure copilot. GitHub
              synchronization, deployment guidance, tutorials, and community programs all reinforce the same point:
              Emergent wants a non-technical or semi-technical buyer to move from idea to a maintained application
              without assembling a complex toolchain. That workflow framing is one of the company's clearest
              differentiators in public. The product is not positioned as an IDE for professional engineers first; it is
              positioned as a complete build-and-ship system for people who need software outcomes quickly. Public
              case-study density strengthens that interpretation as well. It also explains why pricing, docs, and
              community matter as parts of the product itself.
