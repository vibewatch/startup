      - number: '1.3'
        title: Funding chronology and valuation step-up
        blocks:
          - type: paragraph
            body: >-
              Emergent’s financing timeline is compressed even by 2026 AI standards. Public disclosures show a $7
              million seed, a $23 million Series A in September 2025, an undisclosed Google AI Futures strategic check
              in December 2025, a $70 million Series B in January 2026, and then a $130 million Series C in July 2026 at
              a $1.5 billion valuation. That implies disclosed funding of $230 million before counting the undisclosed
              Google amount. The valuation jump is equally notable: external coverage says the company was valued at
              about $300 million in January 2026, meaning the July 2026 Series C represented an approximate fivefold
              step-up in six months. On the positive side, the investor roster is elite and diversified across venture,
              strategic, and now growth-equity capital. On the cautionary side, the capital story is much better
              documented than revenue quality, dilution terms, or governance rights. Public material lets an analyst
              verify fundraising momentum and market appetite, but not the detailed economic terms that determine
              whether the headline unicorn mark is investor-friendly or merely headline-friendly.
