        title: Customer base and segmentation
        blocks:
          - type: paragraph
            body: >-
              The public customer story is unusually broad for a young software company, but it clearly skews toward
              self-serve and operator-led buyers. TechCrunch’s 200,000 paying-customer figure and Business Wire’s
              earlier five-million-user metric imply a very large top-of-funnel relative to typical B2B SaaS. Named
              examples reinforce the pattern: founders, consultants, operators, and internal product teams using
              Emergent to solve concrete workflow problems without waiting for traditional development cycles. That does
              not mean enterprise usage is absent. There are some larger-account signals, such as the hospitality-team
              and university examples, but the evidence base is still dominated by SMB and mid-market style references.
              The result is a customer mix that looks geographically and vertically diverse, yet still more product-led
              and founder-heavy than CIO-led. That shape is consistent with low-friction self-serve acquisition and a
              very wide long tail of smaller accounts. It also fits the pricing ladder, which is designed for individual
              builders, small teams, and gradual expansion rather than immediate large-ticket enterprise contracts.
