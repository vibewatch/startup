              window into Emergent's technical control philosophy. The company describes trust boundaries, action
              controls, sandboxing, auditability, continual regression evaluation, and external red-team work, while
              also acknowledging that prompt injection remains unsolved across the industry. That candor is a positive
              signal, but it also highlights a gap: public technical detail for the core app builder is much thinner
              than for Wingman. Investors therefore can see how Emergent wants to think about agent security, but still
              cannot independently verify reliability, app-maintenance quality, or formal trust artifacts such as
