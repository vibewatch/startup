      - number: '2.3'
        title: Buyer segmentation and adoption path
        blocks:
          - type: paragraph
            body: >-
              The market is being built by two overlapping populations. First are non-technical buyers: SMB owners,
              operators, agencies, consultants, and product managers who want custom workflows or customer-facing tools
              without assembling a full engineering team. Second are technical buyers who use AI builders as
              accelerants, whether inside startups, agencies, or internal innovation teams. Hostinger’s non-developer
              usage data and Searchlab’s citizen-developer adoption data show why the first population matters so much:
              growth is not only developer productivity but also software creation by people who historically could not
              buy or build custom tools economically. The adoption path typically starts with a manual workflow,
              spreadsheet, or fragmented SaaS stack, moves into prototype generation, and then either advances into a
              deployed internal or customer-facing app or fails under governance, reliability, or maintenance pressure.
              Emerging AI app builders compete hardest for the first half of that journey; enterprise low-code
              incumbents still dominate the most governed production workflows. Emergent’s stated focus on entrepreneurs
              and SMBs means its natural battleground is the middle: production-grade enough to run a business, but easy
              enough that the buyer can still be the builder.
