companyProfile:
  summary: >-
    Emergent is a private AI software creation company founded in 2024 by brothers Mukund Jha and Madhav Jha. The
    company sells a prompt-driven platform that turns natural-language intent into deployable web or mobile software
    with backend and integration support, and it explicitly targets non-technical builders rather than only professional
    developers. Public evidence of scale is unusually strong for the company’s age, including a $130M Series C announced
    in July 2026 at a $1.5B valuation, roughly $120M ARR / run-rate revenue, more than 200,000 paying customers, and
    more than 12 million apps built. The core investment debate is not whether Emergent has product pull, but whether
    the current price already discounts most of that momentum before the company has publicly proven retention, margin
    quality, enterprise trust readiness, or cap-table friendliness.
  foundedDate: '2024-01-01'
  founders:
    - name: Mukund Jha
      role: Co-founder & CEO
      background: >-
        Former Dunzo co-founder/CTO with additional Google background and strong founder-market fit around democratized
        software creation.
      claimRefs:
        - CO003
        - CO005
        - CO006
    - name: Madhav Jha
      role: Co-founder & CTO
      background: Former Dropbox ML engineer and Amazon SageMaker founding-team researcher with deeper AI-systems credibility.
      claimRefs:
        - CO004
        - CO007
        - CO008
  foundingLocation: Bengaluru, India
  headquarters: Bengaluru, India and San Francisco, California, USA
  productSummary: >-
    Emergent offers a full-stack AI builder that handles coding, design, backend setup, deployment, and integration
    workflows so users can create production-ready applications from prompts.
  customerFocus: >-
    Non-technical founders, SMB owners, agencies, product operators, and teams that want to build custom software
    without relying on a traditional engineering organization.
  businessModel: >-
    Freemium and subscription-led software model with credit-based usage, team packaging, and likely enterprise/custom
    expansion for heavier or more collaborative customers.
  stage: Private, Series C / unicorn
  fundingStatus: >-
