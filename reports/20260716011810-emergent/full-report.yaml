        title: Traction signals and revenue-quality limits
        blocks:
          - type: paragraph
            body: >-
              The top-line trajectory is extraordinary. Public sources show an internal milestone of roughly $15 million
              ARR within 90 days, a later milestone of $25 million ARR, an externally reported $50 million ARR by
              January 2026, and management telling TechCrunch that annual run-rate revenue had reached $120 million by
              July 2026. TechCrunch also reported more than 200,000 paying customers, which implies low average revenue
              per payer relative to enterprise SaaS but fits a large, global SMB and creator funnel. The strongest
              quality signal is that both the official Series C announcement and named case studies claim software is
              being used for real operations, not only prototypes. Even so, the public record remains incomplete. There
              is still no disclosed churn, cohort retention, renewal profile, or plan mix, so the evidence supports real
