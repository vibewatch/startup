      - number: '3.2'
        title: 'Adjacencies: developer tools and governed incumbents'
        blocks:
          - type: paragraph
            body: >-
              The competitive perimeter is broader than those direct peers. Cursor and GitHub Copilot Workspace are not
              natural no-code substitutes today, but they matter because they dominate developer mindshare and continue
              to add more agentic workflow depth. If those tools become easier for non-developers to wield, they could
              cross the boundary into Emergent’s segment with very little friction. At the other end of the market sit
              OutSystems and Mendix, which are not vibe-coding products at all. Their competitive strength comes from
              governed deployment, enterprise administration, and mature lifecycle controls. Builder.io and Vercel v0
              fall somewhere in the middle: they are highly relevant to frontend and digital-experience workflows, but
              less naturally aligned to the run-your-small-business-on-custom-software thesis. This means Emergent is
              squeezed from both sides — lighter, creator-friendly builders on one side and trusted incumbents or
              developer ecosystems on the other.
