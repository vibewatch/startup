      - number: '3.4'
        title: Moat durability and competitive risk
        blocks:
          - type: paragraph
            body: >-
              Emergent’s moat today is more a positioning advantage than a hard technical monopoly. The company has
              articulated a clear audience — non-technical entrepreneurs and SMBs — and it packages that audience’s
              desired outcome as a full engineering team in a box. That is valuable, but it is also vulnerable to
              commoditization because app generation itself is quickly becoming a table-stakes feature across the
              category. The more durable competitive contest will likely be fought on trust, distribution, and
              post-generation durability. Big ecosystems such as GitHub, Vercel, Microsoft, and enterprise low-code
              incumbents already have stronger channels and stronger enterprise trust signals. Direct rivals are racing
              to close the governance gap by adding security, enterprise controls, and richer infrastructure. Public
              evidence still says little about which platforms keep apps alive, reliable, and revenue-generating after
              launch. Until that durability is more visible, Emergent should be treated as a strong early category
              contender in a market where the moat is still forming, not yet a settled winner.
