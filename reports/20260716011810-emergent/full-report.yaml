      - number: '2.4'
        title: Growth drivers, constraints, and what matters for diligence
        blocks:
          - type: paragraph
            body: >-
              The category’s growth drivers are easy to identify: rising software demand, developer scarcity, cheaper
              model access, better app-generation workflows, and a willingness among buyers to trade perfect software
              craftsmanship for speed and lower cost. Searchlab, ToolJet, Hostinger, and GetMocha all show versions of
              the same story — more applications are being built with low-code and AI, more builders are outside
              engineering, and the biggest platforms are scaling at exceptional speed. The harder question is what
              constrains durable market value. Caspio and Kissflow are especially useful here because they separate the
              magic of instant generation from the messy economics of governed deployment. Once an app touches regulated
              data, core workflows, or real customer records, governance, permissions, audit trails, defect control, and
              lifecycle management matter more than prompt speed alone. That is where the category is most likely to
              bifurcate. Prototype-first builders will keep growing quickly, but the long-term winners will be the ones
              that solve trust, production reliability, and ownership well enough that buyers can stay after the demo
              moment. That is the exact market test Emergent ultimately has to pass.
            claimRefs:
