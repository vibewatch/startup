  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Emergent has done enough publicly to earn serious investor attention, but not enough to justify a carefree
              underwriting posture at any price. The positive case is obvious: the company reached unicorn status only a
              little more than a year after launch, disclosed $120 million of ARR or annual run-rate revenue, and
              appears to have built a very broad, global, SMB-heavy funnel. Those are rare signals. The harder question
              is whether the current price already capitalizes most of that excitement. At roughly 12.5x current ARR,
              the round is not outrageously expensive relative to the hottest AI-builder peers, but it is also not a
              wide-margin entry. Too much of the remaining underwriting still depends on missing information around
              retention, gross margin, incident history, and enterprise conversion. That is why the right stance is
              conditional: attractive company, evidence-supported growth, but a recommendation that remains
              price-sensitive and diligence-sensitive rather than a blanket buy. That distinction matters.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
