  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Gross margin and cost-of-revenue disclosure covering inference, cloud, support, and payment-processing costs.
    whyItMatters: Without margin visibility, the $120M run-rate cannot be translated into durable operating economics.
    diligencePath: Request a quarterly gross-margin bridge with hosting, model, support, and payment-cost detail.
    relatedQuestionRefs:
    - QI014
    - QI025
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: retention-cohorts
    missingEvidence: Logo retention, GRR, NRR, and cohort revenue expansion by plan and segment.
    whyItMatters: The current valuation requires durable customer behavior, not just rapid acquisition.
    diligencePath: Request cohort tables showing paid conversions, churn, GRR, and NRR by acquisition quarter.
    relatedQuestionRefs:
    - QI020
    - QI021
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: cash-runway
    missingEvidence: Cash on hand, burn, and runway under base and downside cases.
    whyItMatters: Capital raised is not the same as current liquidity.
    diligencePath: Request a recent board-update or investor-update cash bridge and 12-month budget.
