callouts:
- calloutType: strength
  title: Top-line proof is real even if the quality of that revenue is not fully disclosed
  body: Multiple sources now support a coherent growth sequence from tens of millions of ARR shortly after launch to a reported $120 million run-rate by July 2026. That is enough to treat Emergent as a real monetizing business, not just a product with vanity usage.
  claimRefs:
  - CI008
  - CI009
  - CI011
  - CI013
- calloutType: risk
  title: List pricing and customer anecdotes are not a substitute for margin and retention disclosure
  body: The public record strongly supports customer value and fundraising access, but it still does not answer the central diligence questions around churn, gross margin, burn, and contract quality. That is why the right verdict is demand proven, underwriting incomplete.
  claimRefs:
  - CI026
  - CI027
  - CI028
  - CI029
  - CI038
- calloutType: insight
  title: Emergent's monetization likely scales with usage intensity, not only seat count
  body: Because plans include credit allotments, larger machines, and extra credit purchases, the business appears designed to capture more revenue when customers move from one-off experiments to heavier production workflows. That can be powerful if retention holds.
  claimRefs:
  - CI003
  - CI004
  - CI006
