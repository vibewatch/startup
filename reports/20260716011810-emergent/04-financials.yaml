- id: capital-adequacy-and-underwriting-blockers
  title: Capital adequacy and underwriting blockers
  body: Capital availability does not look like the immediate issue. Emergent's public funding path — seed, a $23 million Series A, a $70 million Series B, strategic backing from Google's AI Futures Fund, and a $130 million Series C — gives the company both balance-sheet credibility and room to continue product expansion. Series B disclosures said the capital would support hiring, product work, and market expansion, which is consistent with a still-scaling software company rather than a business trying to bridge a near-term solvency gap. Still, that should not be confused with proof of financial efficiency. There is no public cash balance, burn figure, runway estimate, or financing trigger for the next round. The best way to interpret the current record is that Emergent likely has enough cash to keep investing, but investors still lack the margin, retention, and enterprise-mix data needed to fully underwrite the sustainability of that growth at the current valuation. Preference terms, dilution,
    and investor rights also remain private.
