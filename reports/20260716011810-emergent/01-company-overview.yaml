callouts:
- calloutType: strength
  title: Emergent reached unicorn status on unusually broad non-technical-user demand
  body: The most powerful public signal is not only the size of the July 2026 round but the combination of 12 million-plus apps, 200,000-plus paying customers, and a product thesis aimed at people who historically could not commission custom software at all.
  claimRefs:
  - CO019
  - CO021
  - CO022
  - CO023
  - CO024
- calloutType: risk
  title: Public operating proof still trails the valuation headline
  body: Emergent discloses top-line growth and compelling case-study anecdotes, but not churn, net revenue retention, gross margin, or a formal governance map. That makes the $1.5 billion mark easier to celebrate than to fully underwrite.
  claimRefs:
  - CO020
  - CO040
  - CO041
- calloutType: insight
  title: The company is selling outcome ownership, not just code generation
  body: Official materials repeatedly emphasize GitHub ownership, deployment, monetization, and end-to-end product creation. That shifts Emergent from a tool for faster coding into a platform that tries to replace the need for an initial engineering team.
  claimRefs:
  - CO009
  - CO010
  - CO011
  - CO031
  - CO042
- calloutType: assumption
  title: Later chapters should treat current scale claims as directionally credible but economically incomplete
  body: The combination of official posts, TechCrunch reporting, and historical round announcements supports exceptional growth. Later chapters should still test how much of that usage converts into durable revenue, low churn, secure apps, and strong unit economics.
  claimRefs:
  - CO021
  - CO022
  - CO023
  - CO035
  - CO036
  - CO040
