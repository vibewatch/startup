company:
  name: Emergent
chapter:
  number: 1
  title: Company Overview
  summary: 'Emergent is a 2024-founded, publicly launched 2025 AI software-creation startup that reached a $1.5 billion valuation by July 2026 after raising a $130 million Series C. Public evidence supports exceptional top-line scale — including 12 million-plus apps built, more than 200,000 paying customers, and $120 million ARR according to management — plus a strong founder-market-fit story anchored in Mukund Jha’s Dunzo background and Madhav Jha’s AI systems pedigree. The main overview caveat is disclosure quality: capital formation and adoption claims are far more visible than retention, margin, governance, or precise headcount, so later chapters must test whether the unicorn valuation rests on durable economics or just remarkable early momentum.'
sections:
- id: identity-positioning-and-scale
  title: Identity, positioning, and current operating signals
  body: 'Emergent presents itself as a full-stack AI software creation platform rather than a narrow code-completion tool. Across its latest funding announcement, current pricing pages, FAQ copy, YC profile, and independent reviews, the company consistently frames the product as a way for non-technical founders, SMB owners, agencies, and product operators to describe a business need in natural language and receive production-ready web or mobile software with backend, deployment, and integrations included. That positioning matters because it places Emergent in the emerging engineering-team-in-a-box category, distinct from developer-first copilots that still assume the user can operate an IDE. The freshest operating metrics in public view are unusually strong for a company founded in 2024 and launched publicly in 2025: the company says 12 million-plus applications have been built, while TechCrunch reports $120 million ARR and more than 200,000 paying customers. The caveat is that Emergent’s
    own public surfaces are not perfectly synchronized. Older marketing pages still show five million-plus builders and six million-plus apps, suggesting either rapid growth or stale pages that diligence should normalize before using any single metric as canonical.'
