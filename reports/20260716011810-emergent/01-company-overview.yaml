  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A full cap table, board roster, investor rights summary, and any preference stack terms.
    whyItMatters: The public record supports valuation momentum but not the ownership and control mechanics that determine governance and eventual returns.
    diligencePath: Request the latest cap table, board composition, major protective provisions, and any side-letter summary from company counsel.
    relatedQuestionRefs:
    - QO007
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Customer retention, net revenue retention, churn, gross margin, and cohort quality behind the $120M ARR headline.
    whyItMatters: Without revenue-quality metrics, it is impossible to determine whether current scale is durable or simply acquisition-fueled.
    diligencePath: Request cohort retention tables, NRR/GRR, gross-margin bridge, and customer concentration by ARR band.
    relatedQuestionRefs:
