- id: milestones-disclosure-gaps-and-early-cautions
  title: Milestones, disclosure gaps, and early caution signals
  body: 'The first-year chronology shows a company moving from formation to category visibility at extreme speed. Beyond the funding steps, Emergent’s milestones include a public launch in 2025, Google’s strategic investment, the January 2026 declaration of $50 million ARR in seven months, and by July 2026 a broader product ambition spanning mobile-app building, GitHub-connected code ownership, and Wingman, an autonomous messaging-native agent. The central diligence problem is that public disclosure remains selective. Emergent discloses impressive top-line adoption figures and compelling builder anecdotes, but not churn, retention, gross margin, or a detailed governance map. Category-level risk is also already visible: TechCrunch notes the company still sees design quality as a weakness, while ACM, IBM, AppSec Santa, and Axios all document how vibe-coded software can outrun security and maintenance controls. None of those reports prove an Emergent-specific failure, but they do establish
    the risk surface that a non-technical-builder platform must manage better than peers if it wants its early scale to convert into durable enterprise or SMB value.'
