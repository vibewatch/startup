callouts:
- calloutType: risk
  title: The most serious risk is unauthorized action, not ugly output
  body: Prompt injection, cross-tool data movement, and business-critical automation matter more than website aesthetics once Emergent is used to run real workflows. That is why security and policy controls should outrank generic product-risk debates.
  claimRefs:
  - CR003
  - CR004
  - CR006
  - CR025
  - CR026
- calloutType: insight
  title: Regulation is arriving just as Emergent moves into more sensitive use cases
  body: EU transparency obligations, UK data-protection guidance, and institutional procurement expectations are all becoming more relevant while Emergent expands from app building into agents and operational systems.
  claimRefs:
  - CR018
  - CR019
  - CR020
  - CR038
- calloutType: strength
  title: The company is at least explicit about some of the hardest AI-agent risks
  body: Many startups avoid discussing prompt injection, source-to-destination policy, or regression security testing in public. Emergent does not, which improves confidence that management understands the problem even if the proof base is still incomplete.
