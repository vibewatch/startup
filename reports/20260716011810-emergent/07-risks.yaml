chapter:
  number: 7
  title: Risks
  summary: 'Emergent’s biggest risks are not abstract market risks but practical trust and control risks created by putting business-critical software creation into the hands of non-technical builders while simultaneously expanding into connected agents. Public evidence shows the company is unusually explicit about prompt injection, unauthorized side effects, sandboxing, and policy controls for Wingman, which is a positive signal, but independent sources also warn that vibe-coded applications can ship with materially higher security, reliability, and maintainability problems. Regulatory pressure is also rising: EU AI Act transparency rules become relevant in August 2026, UK data-protection guidance for AI is already active, and larger customers will care about trust artifacts that remain thin in public. The bottom line is that Emergent’s risk profile is high but monitorable: strong awareness and rapid growth are real strengths, yet public proof around retention, certifications, concentration,
    and long-run production quality still trails the scale of the product promise.'
sections:
- id: security-and-platform-integrity-risks
  title: Security and platform-integrity risks
  body: 'The single most important risk cluster is security. Emergent is not merely helping users write snippets of code; it is helping them generate, deploy, and in some cases automate actions across real systems. Wingman raises the stakes further because it can coordinate work across hundreds of applications, messages, documents, and scheduled tasks. Emergent’s own security write-up is thoughtful and specific, especially on prompt injection and cross-tool side effects, but that does not eliminate the underlying category risk. Independent sources from ACM, IBM, AppSec Santa, and Security Boulevard all describe a pattern where AI-generated applications can be secure enough to look functional while still shipping major vulnerabilities, data exposures, or technical-debt problems. Because Emergent aims at non-technical users, the risk is amplified: the builder who depends on the tool most may be the least equipped to audit its output directly. The most credible risk path is not one catastrophic
    model failure, but many smaller unsafe defaults compounding across a broad user base.'
