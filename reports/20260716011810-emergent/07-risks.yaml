  figureRefs:
  - FR002
- id: legal-regulatory-and-procurement-risks
  title: Legal, regulatory, and procurement risks
  body: Legal and regulatory pressure is increasing at exactly the point where Emergent is moving into more sensitive workflows. The EU AI Act makes transparency obligations for relevant AI systems effective in August 2026 and imposes broader obligations on providers of general-purpose AI models. UK guidance similarly emphasizes data-protection obligations and risk assessment when personal data is used in AI systems. Emergent’s own public legal surface is harder to inspect than ideal because the privacy and terms endpoints do not render much readable policy detail through normal extraction, which itself is a diligence annoyance. Procurement risk follows from that. Larger institutions and enterprises will want easy-to-review trust artifacts, formal support commitments, and clear privacy language. The public surface today gives partial reassurance through security philosophy and case-study claims, but still not the depth of institutional evidence a mature platform would normally provide. Buyers
    in Europe and the UK will expect those materials to be routine rather than bespoke.
  claimRefs:
  - CR018
  - CR019
  - CR020
  - CR021
  - CR022
  - CR023
  - CR033
  - CR038
  tableRefs:
  - TR003
  figureRefs:
  - FR003
- id: financial-governance-and-thesis-break-risks
  title: Financial, governance, and thesis-break risks
  body: 'The remaining risks are governance and thesis sustainability risks. Public sources still do not provide enough disclosure on concentration, renewal quality, or governance structure to know how fragile the revenue base might become under stress. The founder story is strong, but strong founder centrality can become key-person exposure when processes and customer mix are opaque. Several independent articles already frame the company’s valuation durability as contingent on proving churn, contract quality, and secure operation over time. That means the investment thesis can break in monitorable ways: a visible privacy incident, material churn, procurement rejection from larger institutions, or evidence that business-critical apps built by non-technical users become too brittle to maintain. The company appears aware of many of these risks, which matters, but awareness is not the same as resolved exposure. The faster growth continues, the less forgiving the market will be about unresolved
    trust gaps.'
  claimRefs:
