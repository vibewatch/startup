  - CU035
- calloutType: insight
  title: The buyer base looks more product-led and founder-heavy than enterprise-procurement-led
  body: Even when larger organizations appear, the common pattern is still a motivated operator or PM solving a workflow quickly rather than a long formal enterprise buying cycle. That helps explain the speed of adoption and also the current thinness of review depth.
