callouts:
- calloutType: strength
  title: Emergent has real named production usage across multiple verticals
  body: The customer evidence is not limited to vague logos. Meal prep, energy procurement, higher education, logistics, and internal enterprise tooling all show credible production workflows with measurable outcomes.
