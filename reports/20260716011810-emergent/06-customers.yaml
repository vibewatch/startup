- id: retention-reviews-and-durability
  title: Retention, reviews, and durability signals
  body: The sharpest weakness in the customer evidence is durability. The company and media sources show strong acquisition and some mission-critical usage, but none disclose churn, GRR, NRR, or renewal behavior. Independent review surfaces are also immature. Gartner’s page has no reviews yet, while TechRaisal provides one positive but cautious user testimonial and notes complaints about credits draining quickly and outages losing projects. That does not disprove product-market fit, but it does mean the social proof stack is still thin relative to the scale implied by 200,000 paying customers. The right interpretation is that demand is clearly real, while retention quality and customer satisfaction at scale remain partly unresolved. Mature enterprise software usually has much deeper peer-review density by this stage. That gap matters more because management is already framing a global, high-scale installed base.
  claimRefs:
  - CU020
  - CU021
  - CU022
  - CU023
  - CU032
  - CU034
  - CU035
