  - TU004
  figureRefs:
  - FU003
- id: expansion-concentration-and-go-to-market
  title: Expansion, concentration, and go-to-market dynamics
  body: Public stories suggest the company benefits from product-led acquisition and then some expansion into multi-tenant, licensing, team, or enterprise-like use cases. Several customers began by solving one internal bottleneck and then broadened usage into customer-facing applications or new revenue streams. That is a strong sign for land-and-expand potential. Still, public concentration risk is impossible to judge because no account-level ARR, enterprise share, or top-customer mix is disclosed. Procurement friction may also become more important as the product sells into larger institutions that care about trust, compliance, and review depth. In other words, the customer engine looks broad and viral, but the upmarket durability layer is still much thinner in public than the top-of-funnel growth layer. Until that layer is clearer, upmarket forecasts should stay conservative. The company may eventually prove a strong upmarket motion, but public evidence today still weights the thesis toward
    breadth before depth.
