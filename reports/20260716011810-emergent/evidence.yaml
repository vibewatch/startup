evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A full cap table, board roster, investor rights summary, and any preference stack terms.
    whyItMatters: >-
      The public record supports valuation momentum but not the ownership and control mechanics that determine
      governance and eventual returns.
    diligencePath: >-
      Request the latest cap table, board composition, major protective provisions, and any side-letter summary from
      company counsel.
    relatedQuestionRefs:
      - QO007
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Customer retention, net revenue retention, churn, gross margin, and cohort quality behind the $120M ARR headline.
    whyItMatters: >-
      Without revenue-quality metrics, it is impossible to determine whether current scale is durable or simply
      acquisition-fueled.
    diligencePath: Request cohort retention tables, NRR/GRR, gross-margin bridge, and customer concentration by ARR band.
    relatedQuestionRefs:
      - QO014
      - QO023
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: >-
      A single canonical current employee count and location split across Bengaluru, San Francisco, and any other
      offices.
    whyItMatters: >-
      Public sources disagree on whether the team is roughly 200 people or 276, which matters for productivity and
      burn-rate interpretation.
    diligencePath: Ask management for the current payroll headcount by function and geography, plus year-end hiring plan.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO001
  - type: stale
    severity: minor
    topic: metric-versioning
    missingEvidence: A dated policy for updating public metrics across landing pages, pricing pages, and funding posts.
    whyItMatters: >-
      The older 5M-builder/6M-app marketing page and the fresher 12M-app Series C post may both be true at different
      times, but investors need one current source of truth.
    diligencePath: Ask the company which metric page is canonical and whether historical pages are archived or routinely updated.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: minor
    topic: legal-entity-structure
    missingEvidence: A clean explanation of operating and legal entities across the US, India, and any other jurisdictions.
    whyItMatters: >-
      Cross-border headcount, tax, and IP ownership questions matter more as the company scales and considers European
      expansion or acquisitions.
    diligencePath: Request legal-entity chart, IP assignment structure, and principal employing entities by geography.
    relatedQuestionRefs:
      - QO002
      - QO025
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: som-sizing
    missingEvidence: >-
      A high-quality public estimate for the exact non-technical SMB prompt-to-production app-creation segment Emergent
      targets.
    whyItMatters: Broad LCNC and AI-code-tool TAMs are too wide to support a precise market-share argument for Emergent.
    diligencePath: Triangulate internal cohort revenue by buyer segment against third-party surveys or proprietary analyst work.
    relatedQuestionRefs:
      - QM008
      - QM025
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: market-definition
    missingEvidence: >-
      A standardized taxonomy that cleanly separates prompt-to-app builders, AI code tools, enterprise low-code, and
      visual-experience builders.
    whyItMatters: Public publishers measure overlapping but different things, making apples-to-apples comparison difficult.
    diligencePath: Document a house taxonomy before any valuation or share model is circulated.
    relatedQuestionRefs:
      - QM001
      - QM024
    relatedTableRefs:
      - TM001
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-mix
    missingEvidence: A reliable breakdown of Emergent’s revenue by SMB, agency, enterprise, geography, and builder sophistication.
    whyItMatters: Without buyer-mix data it is difficult to know which parts of the market the company is actually winning.
    diligencePath: Request company cohort and revenue segmentation by customer type and region.
    relatedQuestionRefs:
      - QM009
      - QM023
    relatedTableRefs:
      - TM003
  - type: stale
    severity: minor
    topic: forecast-noise
    missingEvidence: Updated 2026 primary-source market estimates that are not synthesized by vendors or category participants.
    whyItMatters: >-
      Many available sources are compilations that cite Gartner or Grand View rather than publishing original datasets
      directly.
    diligencePath: Supplement with paid analyst access or verified reprints before final IC modeling.
    relatedQuestionRefs:
      - QM024
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: production-readiness
    missingEvidence: Public quantitative evidence on what share of AI-built apps stay in production for 12 months or more.
    whyItMatters: Adoption statistics say little about durability, which matters far more than experimentation for market quality.
    diligencePath: Look for cohort survival studies or ask management for retained deployed-app counts by vintage.
