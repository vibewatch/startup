- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Side
  - Argument
  - Evidence today
  - What would change the view
  rows:
  - - Thesis
    - Breakout top-line momentum is real
    - $120M ARR / run-rate, 200k+ payers, fast funding progression
    - Need cohort and margin data to prove quality
  - - Thesis
    - Product breadth expands TAM beyond coding assistants
    - Apps, deployment, integrations, and agentic workflows are all visible
    - Need proof that breadth does not create brittle support burden
  - - Thesis
    - Global distribution reduces single-geo concentration
    - Revenue is reported across US, Europe, and rest of world
    - Need regional retention and enterprise mix
  - - Anti-thesis
    - Public evidence still says little about revenue durability
    - No disclosed NRR, churn, gross margin, or support-cost profile
    - Direct cohort, margin, and collections data would reduce the discount
  - - Anti-thesis
    - Trust surface looks thin for business-critical use cases
    - Privacy page exists, but enterprise-proof and review depth remain limited
    - SOC, incident, and procurement evidence would improve comfort
  - - Anti-thesis
    - Category capital intensity is rising fast
    - Replit, Lovable, and Bolt all show well-funded competitor momentum
    - A clearer moat or better price would soften this concern
  notes: The anti-thesis is not that Emergent lacks growth; it is that the public record still under-describes its quality and defensibility.
