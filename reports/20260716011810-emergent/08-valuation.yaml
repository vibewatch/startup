- id: comparable-set-and-what-it-really-proves
  title: Comparable set and what it really proves
  body: 'Comparable analysis supports the current round only in a qualified way. The strongest private signals come from peers such as Replit and Lovable, where disclosed revenue and valuation levels show that investors are still willing to underwrite aggressive AI-builder outcomes. StackBlitz and Bolt add a useful lower-tier point: the market is also rewarding narrower stories, which suggests category breadth. But those private comps cut both ways. They show upside potential, yet they also confirm that capital is flowing quickly into well-funded rivals. Public references such as Appian and broader developer-software names remain important because they represent what happens when the market stops paying purely for narrative speed. That is why Emergent should be viewed as neither obviously overvalued nor obviously cheap. It sits between premium private exuberance and public-market discipline, and the recommendation should reflect that middle ground.'
  claimRefs:
  - CV011
  - CV012
  - CV013
  - CV014
