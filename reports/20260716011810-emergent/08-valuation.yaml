- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Disclosed metric
  - Valuation / multiple signal
  - Relevance
  - Limitation
  rows:
  - - Emergent (current round)
    - ~$120M ARR / run-rate
    - ~$1.5B post-money (~12.5x ARR)
    - Direct anchor for current decision
    - Retention, margin, and cap-table terms remain private
  - - Replit (Sep 2025)
    - ~$150M annualized revenue
    - $3B private round (~20x)
    - Useful larger-scale AI-builder comparable with disclosed revenue
    - Different product mix and scale; later revenue profile
  - - Lovable (Dec 2025 / Mar 2026)
    - '>$200M ARR at $6.6B, later $400M ARR'
    - Private premium far above public low-code bands
    - Shows how aggressively the market can price category leaders
    - Peak enthusiasm may overstate what is durable
  - - StackBlitz / Bolt (2026 talk)
    - Tens of millions recurring revenue, ~1M monthly users
    - $700M reported fundraise target
    - Helpful lower-tier comparable for narrower product scope
    - Source quality is weaker and financing was still in discussion
  - - Appian (public reference)
    - ~$617M revenue, ~$2.33B market cap
    - ~3.8x trailing revenue
    - Useful reality check on slower-growth public low-code pricing
    - Different maturity, profitability, and public-market context
  notes: This set is meant to bracket the valuation conversation, not to claim perfect comparability across business models.
