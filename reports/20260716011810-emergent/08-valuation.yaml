- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Retention deterioration
    - Cohort data shows weak renewals or poor expansion
    - Turns fast ARR growth into lower-quality revenue
    - Re-rate toward bear case and pause follow-on capital
  - - Trust / incident failure
    - Material security, privacy, or reliability event becomes public
    - Undercuts business-critical software narrative
    - Demand immediate incident review and valuation reset
  - - Enterprise conversion stalls
    - Large accounts fail to expand because trust artifacts are insufficient
    - Caps multiple support and narrows TAM realization
    - Hold recommendation at track or worse
  - - Competitive capital gap widens
    - Peers outspend Emergent on distribution and enterprise features
    - Raises customer-acquisition and moat pressure
    - Require proof of differentiated retention or efficiency
  - - Preference overhang surprises
    - Cap-table economics materially reduce common-equity upside
    - Weakens return even if operating growth remains solid
    - Reprice expected return before committing capital
  notes: These triggers convert a narrative-driven thesis into monitorable decision rules.
  claimRefs:
  - CV023
  - CV024
  - CV029
  - CV030
  - CV031
  - CV038
  - CV039
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Retention and NRR
    - Cohort retention, GRR, NRR, and active-paying-customer cohorts
    - Determines whether current ARR deserves a premium multiple
    - Finance data room and cohort review
  - - Gross margin and support burden
    - Hosting, inference, support, and payment-cost profile
    - Separates real SaaS leverage from expensive growth
    - Finance + engineering margin walk
  - - Trust and incidents
    - Incident history, SLA, security testing, privacy controls, procurement artifacts
    - Critical for business-critical and enterprise use cases
    - Security diligence and customer references
  - - Enterprise conversion
    - Pipeline mix, ACV ladder, expansion into teams or enterprises
    - Tests whether upside can outrun SMB ARPA limits
    - Sales / GTM review with anonymized pipeline data
  - - Cap table and preferences
    - Fully diluted cap table, liquidation preferences, and pro-rata rights
    - Needed to translate operating outcomes into actual returns
    - Legal diligence and financing docs
  notes: These are blocking diligence asks, not optional nice-to-haves.
