- id: scenario-logic-and-range-underwriting
  title: Scenario logic and range underwriting
  body: 'The valuation work should start from scenarios, not from a single headline multiple. In a bull case, Emergent keeps converting category excitement into durable growth, expands toward or above $200 million ARR, and closes some of the current trust and enterprise-proof gaps. That can support a meaningfully higher mark because private AI-builder comparables have shown investors will pay large premiums for sustained breakout growth. The base case is more sober: growth remains strong, but not all of today’s narrative momentum turns into durable revenue quality quickly enough to justify further multiple expansion. In that world, the current mark is roughly fair. The bear case is not business failure; it is ordinary software repricing. If retention, satisfaction, or compliance readiness disappoint, the market can quickly re-anchor toward public software bands and the downside becomes significant. Because the biggest uncertainty is evidence quality rather than top-line existence, scenario
    ranges are the right lens.'
  claimRefs:
