- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - ARR compounds toward $190M-$220M+, customer proof broadens, enterprise trust improves, and the category keeps premium private multiples
    - ~$2.2B-$2.8B value range; meaningful upside from current mark
    - Execution breadth, enterprise credibility, capital competition
    - Possible, but needs more than simple continuation of today’s headline growth
  - - Base
    - Growth remains strong, but disclosure quality only improves modestly and the market stops paying ever-higher multiples
    - ~$1.3B-$1.7B range; current round is roughly fair
    - Retention or margin ambiguity caps upside
    - Most evidence points here today
  - - Bear
    - Growth slows materially, retention or trust evidence worsens, and valuation re-anchors toward public software bands
    - ~$0.6B-$0.9B range; down-round or flat-round risk becomes visible
    - Public-comp compression, churn, incidents, or stalled upmarket conversion
    - Not the base case, but credible enough to matter at the current price
  notes: Ranges are broad because key underwriting inputs remain private.
