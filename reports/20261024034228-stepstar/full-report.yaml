chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              The legal entity is Shanghai StepStar Intelligent Technology Co., Ltd., branded StepFun, registered in
              Shanghai on April 6, 2023. The registry profile describes an unlisted company limited by shares with
              RMB66.576028 million of registered capital; that legal capital is not a proxy for funding raised or cash
              available. The same profile identifies Yin Qi as chairman and legal representative and Jiang Daxin as a
              director and manager, while two independent secondary profiles describe Jiang as the former Microsoft
              Research Asia leader behind the lab and date Yin's chairmanship to January 2026. The disclosed board and
              supervisory roster reduces the appearance of a single-person organization, but public biographies, voting
              arrangements, committee mandates, succession planning, and founder ownership remain too thin to measure
              effective control or key-person risk.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO006
      - number: '1.2'
        title: Capital, scale, and stakeholder structure
        blocks:
          - type: paragraph
            body: >-
              Public reporting depicts an unusually capital-intensive 2026 expansion. The Eastern Herald reports a $717
              million Series B+ in January and a $2.5 billion May round, totaling $3.2 billion across those two rounds
              and implying an approximately $10 billion valuation; China AI Atlas independently repeats a
              greater-than-$3.2 billion cumulative funding figure and a $10 billion valuation. Those figures are
              financing reports, not evidence of current cash, revenue, ARR, burn, or runway. A low-reputation
              AI-generated outlet separately describes a $12 billion Hong Kong IPO target and acknowledges criticism
              that national-champion sentiment may inflate the mark, so the $12 billion figure should be treated as a
              proposed valuation rather than a completed transaction. Registry data shows a broad shareholder roster,
              but the fetched record does not expose usable ownership percentages. Macro evidence also points to a large
              AI spending pool alongside a structurally different Chinese capital mix in which private-investment data
              omits government guidance funds.
            claimRefs:
              - CO005
              - CO007
              - CO008
              - CO009
              - CO013
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO007
              - CO008
              - CO009
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO007
              - CO008
      - number: '1.3'
        title: Product strategy and business model
        blocks:
          - type: paragraph
            body: >-
              The current product story combines model APIs with an AI-to-device distribution strategy. In September
              2026, StepFun launched the 600-billion-parameter Step 5 Preview, reporting roughly 27 billion active
              parameters per token and API prices of $1 per million input tokens and $2.70 per million output tokens. A
              separate Shanghai news report describes the STEPX Neo as an agentic smartphone and names ecosystem
              partners including Trip.com, Alipay, Didi, Meituan, WPS, and ByteDance's Jianying, while noting that
              retail pricing was not disclosed. That report also relays the company's claim that its models had been
              integrated into more than 42 million devices by 2025. These data points support a
              model-plus-agent-plus-terminal strategy, but they do not reveal how much usage is paid, recurring, or
              attributable to StepFun rather than device partners.
            claimRefs:
              - CO010
              - CO011
              - CO012
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO006
              - CO007
              - CO010
              - CO011
              - CO012
              - CO016
      - number: '1.4'
        title: Diligence implications and adverse signals
        blocks:
          - type: paragraph
            body: >-
              The strongest near-term diligence issue is the distance between demonstrated product velocity and
              unverified commercial economics. A practitioner comparison of five Chinese frontier-model stacks in April
              2026 omitted StepFun; because that comparison was selective, the omission is a visibility signal rather
              than proof of technical inferiority. The registry feed also records an October 14, 2026 labor-dispute
              hearing, but supplies no allegation detail, outcome, or materiality basis. Likewise, the assigned searches
              returning no additional litigation or outage result cannot establish that no incident exists. Investment
              underwriting therefore needs bank statements, audited financials, compute commitments, customer cohorts,
              contractual device economics, cap-table percentages, preference terms, and governance documents before the
              reported financing scale or valuation can be converted into a reliable enterprise assessment.
            claimRefs:
              - CO004
              - CO015
              - CO016
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Reported funding is not liquidity
            body: >-
              The $3.2 billion figure is secondary reporting about two 2026 rounds. Without closing documents, bank
              evidence, debt schedules, and compute commitments, it does not establish current cash, runway, or
              unencumbered capital.
            calloutType: risk
            claimRefs:
              - CO007
              - CO008
          - type: callout
            title: Distribution claims need economic conversion
            body: >-
              More than 42 million reported device integrations may indicate reach, but the metric does not disclose
              paid users, active devices, revenue share, retention, or StepFun's direct customer count.
            calloutType: insight
            claimRefs:
              - CO012
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and demand context
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not one homogeneous “AI market.” For StepStar, the boundary should include
              foundation-model training and inference infrastructure, model APIs and agent tooling, enterprise
              application integration, and device-side licensing or embedded AI. It should exclude unrelated
              semiconductor sales, general IT spending, and all consumer-device revenue not attributable to StepFun
              software or model capability. The distinction matters because public estimates use incompatible
              perimeters: China’s government figure covers the whole stack, while private research estimates focus on
              software and applications. StepStar’s own described model is mixed cloud usage plus device licensing, so
              demand can come from developers, enterprises, and device manufacturers rather than one subscription buyer.
              The market is therefore best evaluated as linked lenses, not a single TAM.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM011
      - number: '2.2'
        title: Sizing lenses and adoption trajectory
        blocks:
          - type: paragraph
            body: >-
              The strongest sizing evidence is a set of explicitly labeled lenses. Gartner forecasts worldwide AI
              spending of $2.59 trillion in 2026, but that figure is a global all-AI spend estimate and cannot be
              assigned to StepStar. Axis reports China’s 2025 core AI industry at 1.2 trillion yuan ($173.9 billion),
              including chips, intelligent-computing infrastructure, software, and services. Its narrower
              software-and-application lens is $28.18 billion in 2025, with a 32.5% CAGR toward $202 billion in 2032.
              The same source reports 602 million Chinese generative-AI users in December 2025, a 42.8% population
              penetration, while Gartner describes infrastructure as more than 45% of worldwide spending and says model
              spending growth was raised to 110% in 2026. These figures show substantial demand, but differing units,
              geographies, and perimeters mean they are not additive and do not isolate StepStar’s obtainable share.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM016
      - number: '2.3'
        title: Buyer segmentation, drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              StepStar’s buyer map has at least three distinct budget paths. Developers and application teams buy API
              calls and agent tooling against usage budgets; enterprises buy workflow integration, governance, and
              potentially dedicated deployment against software or transformation budgets; and device makers buy
              embedded model capability, licensing, and ecosystem integration against product and hardware roadmaps.
              Reported API invocation growth and integration into more than 42 million devices indicate adoption
              signals, but neither establishes recurring revenue, retention, margin, or paid conversion. The principal
              drivers are expanding agentic workflows, falling inference cost, multimodal use cases, and Chinese user
              adoption. Constraints include model price compression, licensing and compliance requirements,
              infrastructure cost, switching or multi-homing among providers, and the absence of public customer-level
              economics. A company-specific SOM remains an evidence gap.
            claimRefs:
              - CM004
              - CM009
              - CM011
              - CM012
              - CM013
              - CM014
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM011
              - CM012
              - CM013
              - CM016
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Large market, unproven obtainable share
            body: >-
              The evidence supports a large and expanding AI demand environment, but StepStar’s market opportunity
              should be underwritten through buyer-level API economics, device-license terms, and renewal evidence
              rather than a top-down headline TAM.
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
              - CM011
              - CM016
          - type: callout
            title: Perimeter and price compression risk
            body: >-
              China’s reported AI market values range from private software/application revenue to whole-stack industry
              scale, while comparable model providers advertise very low token prices; both effects can overstate
              StepStar’s realistic monetizable pool.
            calloutType: risk
            claimRefs:
              - CM007
              - CM014
              - CM017
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              StepFun is not competing against one homogeneous peer set. The immediate direct set includes Moonshot's
              Kimi, DeepSeek, Zhipu's GLM, MiniMax, and Alibaba's Qwen: all offer model families and developer access,
              while several also support agents, multimodality, or open-weight deployment. The broader set includes
              Baidu ERNIE, Huawei Pangu, SenseTime SenseNova, ByteDance Doubao, and Alibaba Cloud as incumbent
              distribution and industry-specialist alternatives. For a buyer, the status quo is often a third-party API
              or an existing cloud stack rather than a fresh foundation-model vendor. Internal build or self-hosting is
              also a substitute where open weights, data residency, latency, or compliance matter. The evidence
              therefore supports a layered landscape, not a claim that StepFun owns a uniquely defined category.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP012
              - CP015
              - CP016
      - number: '3.2'
        title: Capability, packaging, and distribution comparison
        blocks:
          - type: paragraph
            body: >-
              The comparable buying criteria are capability fit, deployment choice, price transparency, and
              distribution. Independent comparison material describes Qwen as general-purpose and multimodal, DeepSeek
              as reasoning and coding oriented, Kimi as a document and agent workflow option, MiniMax as a broad
              multimodal suite, and GLM as a model family with visual and developer tooling. StepFun's public profile
              emphasizes multimodal models, open weights for selected releases, and a route from APIs into phones and
              cars. That is a credible differentiation lens, but the available pool does not provide a like-for-like
              StepFun price sheet or an independently audited benchmark. Pricing comparisons should therefore be treated
              as directional: the third-party 2026 comparison lists rival token prices, while StepFun's smartphone
              report gives a device launch but no retail price. Buyers can multi-home across APIs, so switching costs
              are likely lower at the model layer than at the integrated device or workflow layer.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP011
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP015
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              StepFun's strongest defensibility hypothesis is systems integration: the company says its models were
              integrated into more than 42 million devices by 2025, and its launch materials describe a built-in agent
              connecting foundation models, software, and hardware. This can create distribution, feedback, and workflow
              advantages that a raw API does not. It is not yet proof of durable monetization, because the device report
              does not disclose conversion, retention, unit economics, or the commercial terms of ecosystem
              partnerships. The adverse case is that open-weight releases and rapidly falling rival inference prices
              commoditize model access, while Alibaba, Huawei, ByteDance, and other incumbents bring cloud, channel, and
              enterprise trust.       The registry's 214 insured participants for the 2025 annual report are a workforce
              proxy, not total headcount or evidence of model-market traction. The moat should consequently be
              underwritten as conditional on sustained deployment and partner access rather than company claims about
              installations or an unsupported inference from corporate scale.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation is downstream of the model
            body: >-
              The most credible differentiation is the multimodal-to-device route, not a standalone claim of superior
              model quality.
            calloutType: strength
            claimRefs:
              - CP009
              - CP010
          - type: callout
            title: API competition is structurally intense
            body: >-
              Open weights, multi-homing, low rival token prices, and incumbent cloud ecosystems limit pricing power
              unless StepFun converts integrations into durable workflows.
            calloutType: risk
            claimRefs:
              - CP005
              - CP007
              - CP011
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and public traction
        blocks:
          - type: paragraph
            body: >-
              StepFun's public commercial model appears to combine foundation-model access, consumer applications, and
              embedded AI in phones, vehicles, and other devices. A 2024 report described Step-1V and Step-2 as the
              technical base for consumer-focused products, while later coverage described Step 3, multimodal systems,
              and cloud-edge integration as the strategic center. This supports a diversified revenue hypothesis, not a
              verified revenue mix: the cited sources do not disclose paid API revenue, subscription revenue, device
              royalty rates, take rates, contract values, or realized average selling prices. The reported Geely
              deployment and expected vehicle rollout are distribution and utilization signals, not revenue or
              gross-profit evidence. The relevant underwriting distinction is between model capability, deployment
              volume, and cash realization; each requires contracts, invoices, cohort usage, and customer retention data
              before a revenue forecast can be made.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI003
              - CI004
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
      - number: '4.2'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              Training and serving frontier models create a structurally demanding cost base. StepFun reporting
              emphasizes self-built and leased compute, large-scale training infrastructure, multimodal development, and
              on-device optimization. The public record supplies no audited cost of revenue, inference cost per token,
              GPU lease commitments, depreciation, data acquisition cost, support cost, or gross margin. A separate 2026
              industry report provides context rather than StepFun company data: an AI startup CEO said switching models
              caused its cost curve to fall sharply and that AI spending could exceed payroll. That context makes model
              routing, utilization, and hardware mix important diligence variables, but it cannot be transferred into
              StepFun's accounts. List pricing or third-party benchmark pricing would likewise not establish realized
              price or margin. The correct current conclusion is that unit economics are unavailable, with compute
              intensity and model-price compression as material margin risks.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI011
              - CI014
      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              StepFun's financing capacity is the clearest public financial signal. Yicai reported about CNY5 billion,
              or USD719 million, in the Series B+ round, with state-linked and existing investors participating; KrASIA
              likewise reported more than RMB5 billion. SiliconANGLE's earlier account said the exact amount of its 2024
              Series B was not disclosed and described intended use for multimodal capabilities and consumer products.
              These are financing facts, not cash-on-hand or runway facts: no cited source establishes current cash,
              committed spend, debt, burn, or the amount remaining after the round. A company-registry source reports
              214 insured employees in the 2025 annual record and a registered capital figure, but neither is a
              financial statement. Capital is therefore likely sufficient for continued model and deployment investment
              relative to smaller peers, while the absence of audited revenue, cash conversion, and obligations prevents
              a reliable solvency or valuation conclusion. Underwriting should remain research-more until management
              provides a current balance sheet, monthly burn, compute commitments, and customer-level economics.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing access
            body: >-
              The reported CNY5 billion Series B+ round and participation by state-linked, industrial, and existing
              investors indicate meaningful access to capital, but do not prove cash available or profitability.
            calloutType: strength
            claimRefs:
              - CI009
              - CI010
          - type: callout
            title: Missing underwriting inputs
            body: >-
              Revenue, gross margin, burn, runway, cash balance, debt, realized pricing, and customer-level unit
              economics remain undisclosed in the retained evidence.
            calloutType: risk
            claimRefs:
              - CI004
              - CI006
              - CI008
              - CI014
          - type: callout
            title: Diligence gate
            body: >-
              Treat the business as research-more until management supplies audited or management-certified financial
              statements and a bridge from deployments and API usage to recognized revenue and gross profit.
            calloutType: recommendation
            claimRefs:
              - CI004
              - CI008
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              StepFun's public surface separates an API Platform, AI Studio, and a product family rather than presenting
              one monolithic application. The official site lists Step 5 Preview for complex work and agentic tasks,
              StepAudio 3 variants for speech recognition, real-time interaction, voice generation, music generation,
              and ASR, plus a subscription-oriented coding and agent workflow. It also presents API access with a
              chat-completions example. This supports a developer workflow in which users can trial models, subscribe to
              a coding/agent plan, or integrate models into their own applications. It does not establish paid
              conversion, service-level commitments, realized pricing, or customer outcomes.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE011
      - number: '5.2'
        title: Architecture and efficiency thesis
        blocks:
          - type: paragraph
            body: >-
              The clearest architectural evidence concerns Step-3, a 321B-parameter vision-language model with 38B
              parameters active per token. The paper attributes its decoding economics to Multi-Matrix Factorization
              Attention and Attention-FFN Disaggregation, separating attention and feed-forward subsystems. Its reported
              implementation reaches up to 4,039 tokens per second per GPU under a stated 50ms time-per-output-token
              service target, at 4K context, FP8, and without multi-token prediction. These are paper-reported test
              conditions, not an independently verified production benchmark. The architecture's value proposition is
              therefore a measurable inference-cost and throughput hypothesis, with operational complexity and hardware
              availability still material diligence questions.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
      - number: '5.3'
        title: Maturity, deployment, and differentiation
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows a model release and distribution path, but maturity is unevenly observable. The
              official page links Step 5 Preview weights to Hugging Face and GitHub, while the Step-3 paper records a
              detailed model-system design and comparison setup. A third-party technical analysis describes eight 48GB
              GPUs for one deployment configuration, Apache 2.0 licensing, and support for common inference engines, but
              those details are not independently reproduced here and should be treated as analyst-reported. The product
              can plausibly differentiate through efficiency-oriented systems design and breadth across modalities;
              public evidence does not yet demonstrate sustained uptime, integration depth, support quality, or a
              durable moat.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Trust, safety, and technical diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The reviewed material does not document a security or privacy control framework, formal incident history,
              uptime statistics, model evaluation policy, content-safety process, or certifications. The technical
              analysis flags a reported dead-expert phenomenon in mixture-of-experts training, which is a research and
              reliability consideration rather than evidence of a customer incident. The official page's public links
              establish discoverability of models and platforms, not their security posture. Before underwriting
              production adoption, diligence should obtain architecture and data-flow diagrams, isolation and retention
              controls, incident and status history, model-card limitations, red-team results, versioning policy, and
              evidence that benchmark behavior survives the target workload.
            claimRefs:
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Efficiency is the differentiated technical thesis
            body: >-
              Step-3's strongest public proof is a specific model-system co-design claim around decoding cost, not a
              generalized claim that every StepFun product is cheaper or more capable.
            calloutType: insight
            claimRefs:
              - CE005
              - CE006
              - CE007
          - type: callout
            title: Production controls remain unverified
            body: >-
              Public product pages and technical materials do not establish uptime, security, privacy, safety, or
              support controls for production deployment.
            calloutType: risk
            claimRefs:
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and payer segments
        blocks:
          - type: paragraph
            body: >-
              StepFun appears to serve four distinct customer motions. Consumers use the StepFun AI application for
              question answering, document understanding, and task execution; the Google Play listing says StepClaw can
              execute tasks across devices and connect with Feishu bots. Developers and enterprise teams are a second
              segment: LLMReference describes StepFun as providing API access to Step models and tracks models for
              coding, retrieval, agents, and long-context workloads. A third segment is device and platform partners.
              The July 2026 launch coverage names Alipay, Meituan, Amap, Didi, JD.com, Baidu, Weibo, WPS, Trip.com, and
              CapCut as ecosystem partners for STEPX Neo. A Qichacha record adds a more concrete enterprise signal: a
              winning-bid notice for a Guotai Haitong Securities model, compute-resource, and token-governance project.
              These are different buying and usage relationships, so partner logos and procurement notices should not be
              treated as evidence of recurring retention.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption and usage signals
        blocks:
          - type: paragraph
            body: >-
              The public record supports product availability and ecosystem formation, but not a verified adoption
              denominator. The Google Play listing was updated on 2026-09-23 and displayed 81 reviews when fetched on
              2026-10-24; that is an observable store signal, not a download count or active-user measure. LLMReference
              reported eight tracked StepFun models and last verified its catalog on 2026-10-15, while a separate
              pricing catalog listed token prices updated on 2026-10-12. The STEPX launch article says the company did
              not solely pursue shipment volume and instead wanted to get early users on board quickly, indicating an
              early-stage terminal adoption objective rather than disclosed scale. No public source in this pool
              supplies paid accounts, API call volume, renewal cohorts, or customer revenue.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: Named proof, durability, and concentration
        blocks:
          - type: paragraph
            body: >-
              Named platform relationships provide evidence of intended use cases, not necessarily production
              deployment. The 36Kr launch account says StepFun had ecosystem cooperation with major domestic internet
              companies, while the StepX coverage identifies travel, payments, ride-hailing, food, office, video, and
              mapping workflows. Qichacha records a Guotai Haitong Securities project win, but does not disclose its
              value, delivery status, or outcome. The app-store record provides a more direct user signal: reviewers
              reported failed requests and country-specific phone-number registration constraints in October 2026. Those
              complaints show usability and geographic-access friction, but they do not quantify churn or establish that
              the complaints are representative. Retention metrics, contract length, gross or net retention,
              top-customer concentration, and expansion rates remain unverified; diligence should require customer-level
              revenue, deployment stage, cohort, and renewal evidence.
            claimRefs:
              - CU004
              - CU009
              - CU010
              - CU011
              - CU012
