              - CR009
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The appropriate call is research-more, with medium confidence and a stretched valuation stance. The
              strongest company-specific valuation evidence is a current-dated secondary profile reporting a $10 billion
              valuation and more than $3.2 billion of disclosed or announced funding, while a separate business article
              claims a $2.5 billion pre-IPO round at a $10 billion post-money valuation. Those figures are not
              independently corroborated by a filing or priced-round announcement in this pool, and the sources differ
              in quality and provenance. Strategic investors and state-linked capital could support financing access,
              but they do not establish cash available to the company, investor return terms, liquidation preferences,
              or operating profitability. Entry should therefore be conditioned on a verified term sheet, cap table,
              audited or management revenue bridge, gross margin, compute commitments, and evidence that the reported
              valuation is an arm's-length priced mark rather than an aspirational IPO target.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV011
              - CV014
              - CV015
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The bullish thesis is that StepFun sits in a strategically supported Chinese foundation-model market, has
              attracted hardware, telecom and state-linked investors, and can convert multimodal model capability into
              API, enterprise and device distribution. The market context is substantial: an industry analysis reports
              China’s core AI industry exceeded 1.2 trillion yuan in 2025, while Gartner forecasts worldwide AI spending
              to grow 47% in 2026. These are addressable-market signals, not StepFun revenue. The anti-thesis is that
              foundation-model competition can destroy pricing power and require sustained compute investment. Public
              comparables show how quickly private marks can re-rate: TechCrunch reports Moonshot raised $2 billion at a
              $20 billion valuation, while another report describes a rise from $4.3 billion to $20 billion in five
              months and a temporary subscription freeze caused by limited computing capacity. StepFun’s reported mark
              therefore needs a model-specific revenue and margin bridge before it can be treated as attractive.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV011
              - CV012
              - CV015
      - number: '8.3'
        title: Scenarios, exit readiness and diligence
        blocks:
          - type: paragraph
            body: >-
              The scenario framework is deliberately conditional because no assigned source provides StepFun audited
              revenue, ARR, retention, gross margin, burn, runway, preference stack or confirmed listing timetable. The
              bull case requires verified paid usage growth, durable inference economics, strategic distribution and a
              financing or IPO mark at or above the reported $10 billion level. The base case assumes technical progress
              and continued capital access but applies a material private-market discount until operating metrics and
              terms are disclosed. The bear case is a down-round or delayed listing caused by commoditized model
              pricing, compute constraints, regulatory friction or weak monetization. Exit readiness is unproven: the
              claimed Hong Kong IPO path is reported by a low-reputation source, not a prospectus or exchange filing.
              Before investment, request the latest cap table and preferences, round subscription documents, monthly
              revenue by product, gross-margin bridge, compute contracts, customer concentration, model/API pricing,
              regulatory approvals and an IPO adviser or exchange-status confirmation.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV009
              - CV011
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive decision
            body: >-
              Reported financing marks are not enough to establish an investable price; wait for transaction terms and
              operating metrics.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV011
          - type: callout
            title: Key thesis-break trigger
            body: >-
              A failed or delayed financing or listing, combined with evidence of weak paid conversion or compute-driven
              margin pressure, would materially weaken the thesis.
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
              - CV012
              - CV013
