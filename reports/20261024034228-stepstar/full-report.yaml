  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              StepStar's highest-consequence risk is not model capability but whether a capital-intensive
              foundation-model business can convert technical progress into durable, cash-generative demand. Independent
              commentary describes an unproven profit model, persistent training and inference costs, and a channel
              structure dependent on a few hardware manufacturers. That combination creates operating leverage in both
              directions: device launches or enterprise adoption can accelerate utilization, while delayed hardware
              cycles, in-house model substitution, or pricing pressure can compress contribution margins. The
              company-specific financial evidence remains incomplete, so likelihood is assessed as material rather than
              quantified. A thesis-break trigger is evidence of sustained gross-margin deterioration, inability to fund
              committed compute, or a financing round materially below the last credible mark.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR010
              - CR013
              - CR015
      - number: '7.2'
        title: Regulatory, legal, and governance exposure
        blocks:
          - type: paragraph
            body: >-
              The listing and operating structure create several compliance dependencies. A contemporaneous account says
              StepFun was dismantling its red-chip structure, completing a shareholding reform, and preparing for a Hong
              Kong listing, while noting that no formal A1 application had appeared as of 20 May 2026. A corporate
              registry extract records the entity as an unlisted Hong Kong-and-Macao-invested company and lists licenses
              for value-added telecommunications and internet information services; it also shows a labour-dispute
              hearing notice. These records do not establish a violation, but they make data, related-party, licensing,
              labour, and disclosure diligence decision-critical. The relevant kill criteria are a material regulator
              finding, an unremediated license gap, a prospectus qualification, or a filing delay caused by unresolved
              compliance questions.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR016
      - number: '7.3'
        title: Dependencies, technical resilience, and diligence
        blocks:
          - type: paragraph
            body: >-
              StepFun's device-oriented strategy makes counterparties and compute supply strategic rather than
              incidental. Public reporting identifies work with Geely on smart cockpits and Guotai Junan International
              on investment-advisory systems, while separate analysis warns that hardware-market cycles, manufacturer
              in-house development, and long replacement cycles can weaken a third-party model supplier's bargaining
              position. The broader compute environment is also exposed to export controls: reporting describes Nvidia
              sales in China stalling as domestic suppliers such as Huawei gain share, while noting that demand still
              exceeds available supply and that Chinese chips lag Nvidia in some advanced workloads. Monitoring should
              therefore focus on top-counterparty revenue share, renewal and deployment milestones, inference cost per
              token, domestic accelerator performance, incident rates, and unrestricted cash runway. The immediate
              diligence ask is a customer-by-customer revenue bridge and compute procurement plan.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR006
              - CR010
              - CR013
              - CR015
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break condition
            body: >-
              The investment case breaks if StepStar cannot demonstrate audited unit economics and funded compute
              capacity while keeping strategic hardware and enterprise partners diversified enough to protect deployment
              volume.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR010
          - type: callout
            title: Evidence limitation
            body: >-
              Public sources in this assigned pool do not establish complete litigation, licensing, incident,
              customer-concentration, or cash-runway records; those remain explicit diligence gaps rather than assumed
              negatives.
            calloutType: assumption
            claimRefs:
