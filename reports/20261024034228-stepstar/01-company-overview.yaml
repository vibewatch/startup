company:
  name: StepStar
chapter:
  number: 1
  title: Company Overview
  summary: >-
    StepStar, operating under the StepFun brand, is a Shanghai foundation-model company
    founded in April 2023 whose public profile now spans multimodal models, low-cost APIs,
    agent software, and device integration. Registry and reporting evidence supports its
    identity, leadership, and rapid 2026 financing and product milestones, but audited
    economics, true headcount, customer counts, cap-table percentages, and financing terms
    remain unavailable.
sections:
  - id: identity-and-governance
    title: Identity, leadership, and governance
    body: >-
      The legal entity is Shanghai StepStar Intelligent Technology Co., Ltd., branded
      StepFun, registered in Shanghai on April 6, 2023. The registry profile describes an
      unlisted company limited by shares with RMB66.576028 million of registered capital;
      that legal capital is not a proxy for funding raised or cash available. The same
      profile identifies Yin Qi as chairman and legal representative and Jiang Daxin as a
      director and manager, while two independent secondary profiles describe Jiang as the
      former Microsoft Research Asia leader behind the lab and date Yin's chairmanship to
      January 2026. The disclosed board and supervisory roster reduces the appearance of a
      single-person organization, but public biographies, voting arrangements, committee
      mandates, succession planning, and founder ownership remain too thin to measure
      effective control or key-person risk.
    claimRefs: [CO001, CO002, CO003, CO006]
    tableRefs: [TO002]
  - id: capital-scale-and-stakeholders
    title: Capital, scale, and stakeholder structure
    body: >-
      Public reporting depicts an unusually capital-intensive 2026 expansion. The Eastern
      Herald reports a $717 million Series B+ in January and a $2.5 billion May round,
      totaling $3.2 billion across those two rounds and implying an approximately $10
      billion valuation; China AI Atlas independently repeats a greater-than-$3.2 billion
      cumulative funding figure and a $10 billion valuation. Those figures are financing
      reports, not evidence of current cash, revenue, ARR, burn, or runway. A low-reputation
      AI-generated outlet separately describes a $12 billion Hong Kong IPO target and
      acknowledges criticism that national-champion sentiment may inflate the mark, so the
      $12 billion figure should be treated as a proposed valuation rather than a completed
      transaction. Registry data shows a broad shareholder roster, but the fetched record
      does not expose usable ownership percentages. Macro evidence also points to a large
      AI spending pool alongside a structurally different Chinese capital mix in which
      private-investment data omits government guidance funds.
    claimRefs: [CO005, CO007, CO008, CO009, CO013, CO014]
    tableRefs: [TO001, TO003]
  - id: product-and-business-model
    title: Product strategy and business model
    body: >-
      The current product story combines model APIs with an AI-to-device distribution
      strategy. In September 2026, StepFun launched the 600-billion-parameter Step 5 Preview,
      reporting roughly 27 billion active parameters per token and API prices of $1 per
      million input tokens and $2.70 per million output tokens. A separate Shanghai news
      report describes the STEPX Neo as an agentic smartphone and names ecosystem partners
      including Trip.com, Alipay, Didi, Meituan, WPS, and ByteDance's Jianying, while noting
      that retail pricing was not disclosed. That report also relays the company's claim
      that its models had been integrated into more than 42 million devices by 2025. These
      data points support a model-plus-agent-plus-terminal strategy, but they do not reveal
      how much usage is paid, recurring, or attributable to StepFun rather than device
      partners.
    claimRefs: [CO010, CO011, CO012]
    figureRefs: [FO001]
  - id: diligence-implications
    title: Diligence implications and adverse signals
    body: >-
      The strongest near-term diligence issue is the distance between demonstrated product
      velocity and unverified commercial economics. A practitioner comparison of five
      Chinese frontier-model stacks in April 2026 omitted StepFun; because that comparison
      was selective, the omission is a visibility signal rather than proof of technical
      inferiority. The registry feed also records an October 14, 2026 labor-dispute hearing,
      but supplies no allegation detail, outcome, or materiality basis. Likewise, the
      assigned searches returning no additional litigation or outage result cannot establish
      that no incident exists. Investment underwriting therefore needs bank statements,
      audited financials, compute commitments, customer cohorts, contractual device economics,
      cap-table percentages, preference terms, and governance documents before the reported
      financing scale or valuation can be converted into a reliable enterprise assessment.
    claimRefs: [CO004, CO015, CO016]
