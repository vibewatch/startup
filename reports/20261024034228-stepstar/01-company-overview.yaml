callouts:
  - calloutType: risk
    title: Reported funding is not liquidity
    body: >-
      The $3.2 billion figure is secondary reporting about two 2026 rounds. Without closing
      documents, bank evidence, debt schedules, and compute commitments, it does not establish
      current cash, runway, or unencumbered capital.
    claimRefs: [CO007, CO008]
  - calloutType: insight
    title: Distribution claims need economic conversion
    body: >-
      More than 42 million reported device integrations may indicate reach, but the metric
      does not disclose paid users, active devices, revenue share, retention, or StepFun's
      direct customer count.
    claimRefs: [CO012]
