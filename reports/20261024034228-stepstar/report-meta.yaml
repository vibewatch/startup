  topStrengths:
    - >-
      Substantial reported financing and access to strategic capital support continued model and infrastructure
      investment.
    - A broad product surface links frontier models, APIs, agents, consumer software, and AI-terminal distribution.
    - Multimodal and device integration create a differentiated route beyond standalone model benchmarking.
  topRisks:
