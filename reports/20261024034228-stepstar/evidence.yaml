evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: >-
      Audited revenue, ARR, gross margin, customer count, active paid users, compute commitments, cash, burn, and
      runway.
    whyItMatters: >-
      Without consistent periods and denominators, reported financing and distribution reach cannot establish commercial
      quality or financing durability.
    diligencePath: >-
      Obtain audited financial statements, bank statements, compute contracts, revenue cohort exports, customer
      contracts, and a monthly cash bridge through 2026-10-24.
    relatedQuestionRefs:
      - QO005
      - QO010
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance-and-ownership
    missingEvidence: >-
      Complete founder and executive biographies, beneficial ownership, cap-table percentages, board appointment rights,
      preference terms, committees, and succession plans.
    whyItMatters: >-
      The visible roster establishes names but cannot resolve control, dilution, related-party exposure, or key-person
      dependence.
    diligencePath: >-
      Request the fully diluted cap table, shareholder register, financing documents, board minutes, committee charters,
      option plan, and executive employment agreements.
    relatedQuestionRefs:
      - QO002
      - QO003
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: financing-and-valuation
    missingEvidence: >-
      Primary closing documents, verified proceeds, debt obligations, liquidation preferences, and an IPO filing
      supporting the reported $10 billion and proposed $12 billion valuation contexts.
    whyItMatters: >-
      Secondary funding totals do not establish cash availability, and a proposed listing valuation is not a completed
      market price.
    diligencePath: >-
      Obtain signed term sheets and closing sets, reconcile proceeds to bank statements, and review any HKEX filing
      before using either valuation in underwriting.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: minor
    topic: milestone-verification
    missingEvidence: >-
      Independent confirmation that the scheduled October 15, 2026 open-weight release occurred and primary dates for
      the STEPX Neo launch.
    whyItMatters: The milestone timeline distinguishes completed launches from announced or imprecisely dated events.
    diligencePath: Review the official model repository, release artifacts, device launch materials, and dated WAIC records.
    relatedQuestionRefs:
      - QO006
  - type: private-evidence-only
    severity: material
    topic: evidence-gap
    missingEvidence: >-
      Audited revenue, paid-account counts, retention, gross margin, token volumes by paying cohort, and device-license
      economics.
    whyItMatters: >-
      Without buyer-level denominators, the broad market lenses cannot be converted into a defensible StepStar SAM, SOM,
      or valuation-relevant revenue opportunity.
    diligencePath: >-
      Request management's segment revenue bridge, cohort retention, contract sizes, API utilization, device-license
      terms, and pipeline conversion by buyer segment.
    relatedQuestionRefs:
      - QM007
      - QM008
  - type: conflicting-data
    severity: material
    topic: market-perimeter
    missingEvidence: >-
      A reconciled China foundation-model and AI application market series using a consistent geography, currency,
      period, and inclusion rule.
    whyItMatters: >-
      The 1.2 trillion yuan whole-stack figure and $28.18 billion software/application figure answer different questions
      and cannot support a single TAM calculation.
    diligencePath: >-
      Build a bottom-up China model/API/device opportunity from disclosed customer counts, token volumes, contract
      values, and addressable device shipments.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: stale
    severity: minor
    topic: adoption
    missingEvidence: >-
      Post-December-2025 user, post-2025 device-integration, and post-May-2026 AI-spending updates reconciled to the
      2026-10-24 run date.
    whyItMatters: >-
      AI adoption, model pricing, and competitive capability move quickly; older user and integration indicators may not
      represent current monetization.
    diligencePath: >-
      Refresh CNNIC, Gartner, device-integration, API-pricing, and customer evidence with current-period primary
      disclosures.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: commercial-evidence
    missingEvidence: >-
      Comparable peer funding and scale data plus StepFun API price cards, realized revenue, retention, device
      activation, and unit economics.
    whyItMatters: >-
      Without comparable scale and realized economics, the device and API differentiation thesis cannot be translated
      into durable pricing power or investor returns.
    diligencePath: >-
      Obtain current StepFun contracts, price cards, cohort retention, activation, gross-margin data, and comparable
      peer disclosures under diligence access.
    relatedQuestionRefs:
      - QP003
      - QP006
      - QP008
      - QP010
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: benchmark-comparison
    missingEvidence: >-
      Independent, like-for-like evaluations of StepFun against Qwen, DeepSeek, Kimi, GLM, and MiniMax on representative
      workloads.
    whyItMatters: Narrative model descriptions do not establish capability leadership or a defensible quality premium.
    diligencePath: Run reproducible evaluations with identical prompts, latency, price, safety, and deployment constraints.
    relatedQuestionRefs:
      - QP003
      - QP007
  - type: missing-source
    severity: minor
    topic: partner-access
    missingEvidence: Contractual terms, renewal rates, and exclusivity for device and ecosystem partners.
    whyItMatters: Reported integrations may create distribution or may be non-exclusive launch relationships with limited lock-in.
    diligencePath: Review partner agreements, active-device telemetry, renewal cohorts, and channel economics.
    relatedQuestionRefs:
      - QP006
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure
    missingEvidence: >-
      Audited or management-certified revenue by API, application, device and services stream, including recognition
      policy and customer concentration.
    whyItMatters: Without revenue and mix, deployment signals cannot be converted into a forecast or valuation test.
    diligencePath: >-
      Request the latest income statement, revenue-recognition memo, customer cohort schedule and top-customer
      contracts.
    relatedQuestionRefs:
      - QI001
      - QI004
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Gross-margin bridge and measured compute, inference, data, support and deployment costs by product.
    whyItMatters: Frontier-model scale can produce high technical performance while remaining structurally loss-making.
    diligencePath: >-
      Request product-level contribution margins, GPU utilization, cloud invoices, capacity commitments and support-cost
      allocation.
    relatedQuestionRefs:
      - QI005
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Current cash, monthly burn, runway, debt and remaining financing proceeds.
    whyItMatters: Funding raised is not equivalent to cash available and cannot establish financing independence.
    diligencePath: Request a current balance sheet, twelve-month cash-flow bridge, debt schedule and board-approved financing plan.
    relatedQuestionRefs:
      - QI006
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: First-party API, application and OEM pricing, including discounts, minimum guarantees and revenue shares.
    whyItMatters: List or benchmark pricing does not establish realized price, take rate or margin.
    diligencePath: Request current price sheets, representative invoices and executed OEM/commercial agreements.
    relatedQuestionRefs:
      - QI003
      - QI010
    relatedTableRefs:
      - TI002
  - type: adverse
    severity: material
    topic: margin-risk
    missingEvidence: Evidence of StepFun's response to customer token-budget pressure and lower-cost model competition.
    whyItMatters: Price compression or routing to cheaper alternatives could reduce realized revenue per unit of compute.
    diligencePath: Request pricing history, customer retention by price cohort, routing mix and gross-margin sensitivity scenarios.
    relatedQuestionRefs:
      - QI009
  - type: missing-source
    severity: material
    topic: trust
    missingEvidence: >-
      Independent security, privacy, safety, and reliability documentation for the API, Studio, and model-serving
      environments.
    whyItMatters: Production adoption depends on controls that are not established by product listings or model architecture papers.
    diligencePath: >-
      Request current security architecture, data-retention policy, incident log, uptime history, red-team results, and
      model-safety evaluation package.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: deployment
    missingEvidence: Independent production evidence for throughput, latency, failure recovery, and support under customer workloads.
    whyItMatters: >-
      Paper benchmarks and analyst deployment descriptions may not predict service behavior, cost, or operability in
      production.
    diligencePath: >-
      Obtain workload-specific benchmark traces, SLA terms, capacity commitments, version policy, and named customer
      references.
    relatedQuestionRefs:
      - QE004
      - QE005
  - type: stale
    severity: minor
    topic: roadmap
    missingEvidence: A dated changelog or release history covering model versions, deprecations, and roadmap commitments.
    whyItMatters: Preview labels and fast-moving model releases make product availability and compatibility time-sensitive.
    diligencePath: Request the current public changelog, API deprecation policy, and supported-model matrix as of the diligence date.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: retention
    missingEvidence: >-
      Customer-level cohorts showing paid conversion, renewal, GRR, NRR, churn, and contract duration for the assistant
      and API businesses.
    whyItMatters: >-
      Without retention data, named integrations and app availability cannot establish durable recurring demand or
      expansion economics.
    diligencePath: >-
      Request monthly customer cohorts, logo and revenue retention, renewal schedules, cancellations, and usage-based
      retention by product for the last 24 months.
    relatedQuestionRefs:
      - QU006
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Revenue and usage concentration by top customers, platform partners, device channels, and model/API accounts.
    whyItMatters: A small number of partners or channels could create material bargaining, rollout, or revenue concentration risk.
    diligencePath: >-
      Obtain a redacted customer and partner concentration schedule with top-10 revenue, usage, contract terms, renewal
      dates, and channel dependence.
    relatedQuestionRefs:
      - QU009
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof
    missingEvidence: >-
      Independent customer references that identify production status, deployment scope, measurable outcomes, and
      renewal or expansion.
    whyItMatters: >-
      The public sources name ecosystem relationships but do not distinguish pilots, integrations, and scaled production
      deployments.
    diligencePath: >-
      Interview at least three named partners or customers and reconcile their deployment stage, active users, task
      completion, support burden, and renewal intent.
    relatedQuestionRefs:
      - QU005
      - QU007
    relatedTableRefs:
      - TU003
  - type: access-blocked
    severity: minor
    topic: geography
    missingEvidence: Country-level availability, onboarding success, and support metrics for the consumer app.
    whyItMatters: >-
      Public reviews report registration and request failures that may limit addressable consumer usage outside
      supported markets.
    diligencePath: >-
      Request country-by-country activation, failed-request, support-ticket, and retention data, split by app version
      and signup method.
    relatedQuestionRefs:
      - QU008
  - type: private-evidence-only
