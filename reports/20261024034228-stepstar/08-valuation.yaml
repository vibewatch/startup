callouts:
  - calloutType: recommendation
    title: Price-sensitive decision
    body: Reported financing marks are not enough to establish an investable price; wait for transaction terms and operating metrics.
    claimRefs: [CV001, CV003, CV004, CV011]
  - calloutType: risk
    title: Key thesis-break trigger
    body: A failed or delayed financing or listing, combined with evidence of weak paid conversion or compute-driven margin pressure, would materially weaken the thesis.
    claimRefs: [CV008, CV009, CV012, CV013]
