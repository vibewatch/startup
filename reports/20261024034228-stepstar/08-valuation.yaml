      - ["Valuation stance", stretched, "Require a material evidence or price improvement before entry", "Reported mark is not independently verified"]
      - ["Entry discipline", Conditional, "Verify cap table, preferences, revenue, margins and financing terms", "No price target is supportable yet"]
    notes: "Assessment is an analyst judgment synthesized from the cited evidence; unavailable company metrics are not treated as zero."
    claimRefs: [CV001, CV003, CV004, CV011]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Argument, Supporting signal, What would change the view, Evidence qualifier]
    rows:
      - ["Strategic financing access", "Reported hardware, telecom and state-linked participation", "Evidence of non-strategic pricing or weak follow-on demand", "Participation does not prove return terms"]
      - ["Large market opportunity", "China core AI industry reported above 1.2 trillion yuan in 2025", "StepFun-specific paid revenue and margin conversion", "Market size is not company revenue"]
      - ["Technical differentiation", "Multimodal and device-oriented positioning in the atlas profile", "Independent benchmark and production retention evidence", "Positioning is not proof of monetization"]
      - ["Valuation risk", "Reported $10 billion mark lacks a filing in this pool", "Priced-round documents and investor-verified cap table", "Marks may refer to different instruments"]
      - ["Liquidity risk", "Claimed Hong Kong IPO path is unconfirmed", "Prospectus, exchange filing or adviser confirmation", "IPO reporting is not approval"]
    notes: "Signals are not equivalent measures: market size is not company revenue, funding is not cash available, and an IPO report is not a listing approval."
    claimRefs: [CV002, CV005, CV006, CV011, CV012, CV015]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Verified paid API and device growth", "$10B mark is supported or exceeded by priced financing", "Low-to-medium until metrics are disclosed", "Slowing usage or margin compression"]
      - [Base, "Capital access continues but monetization remains opaque", "Apply a material private-market discount to reported $10B", "Most defensible pending diligence", "No audited revenue bridge or preference data"]
      - ["Bear", "Model competition and compute intensity impair economics", "Down-round or delayed exit becomes plausible", "Material tail risk", "Financing failure, regulatory block or sustained capacity constraint; scenario is conditional"]
      - ["Catalyst", "Confirmed strategic round or exchange filing", "Re-rate only after terms and operating metrics are verified", "Evidence-dependent", "Terms differ from public claims; catalyst is not a forecast"]
    notes: "These are conditional decision scenarios, not a forecast or a precise valuation model; no probability percentages are assigned because the evidence does not support false precision."
    claimRefs: [CV001, CV004, CV008, CV009, CV011, CV013, CV014, CV016]
