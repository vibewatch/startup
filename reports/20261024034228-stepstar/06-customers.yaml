      - [Platform and ecosystem partners, "Buyer/partner: app and service platforms; end user is the device or assistant user", "Cross-app agent workflows across travel, payments, mobility, food, office, video, and maps", "Named cooperation with Alipay, Meituan, Amap, Didi, JD.com, Baidu, Weibo, WPS, Trip.com, and CapCut", "Commercial terms, production status, and partner-sourced revenue are not disclosed"]
      - [Enterprise procurement, "Buyer: enterprise technology or operations team; users not disclosed", "Model, compute-resource, and token-governance platform", "Guotai Haitong Securities project win recorded by Qichacha", "Contract value, delivery status, utilization, outcome, and renewal are not disclosed"]
