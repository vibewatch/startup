schemaVersion: "report-v2"
artifact: customers
slug: stepstar
runDate: 2026-10-24
company:
  name: StepStar
chapter:
  number: 6
  title: Customers
  summary: StepFun's customer surface spans a consumer assistant, developer API access, and an emerging AI-terminal ecosystem. Public evidence shows named ecosystem integrations and a live app with user complaints, but does not establish paid customer counts, production deployment breadth, retention, or revenue concentration.
sections:
  - id: customer-segments
    title: Buyer, user, and payer segments
    body: >-
      StepFun appears to serve four distinct customer motions. Consumers use the StepFun AI application for question answering, document understanding, and task execution; the Google Play listing says StepClaw can execute tasks across devices and connect with Feishu bots. Developers and enterprise teams are a second segment: LLMReference describes StepFun as providing API access to Step models and tracks models for coding, retrieval, agents, and long-context workloads. A third segment is device and platform partners. The July 2026 launch coverage names Alipay, Meituan, Amap, Didi, JD.com, Baidu, Weibo, WPS, Trip.com, and CapCut as ecosystem partners for STEPX Neo. A Qichacha record adds a more concrete enterprise signal: a winning-bid notice for a Guotai Haitong Securities model, compute-resource, and token-governance project. These are different buying and usage relationships, so partner logos and procurement notices should not be treated as evidence of recurring retention.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption and usage signals
    body: >-
      The public record supports product availability and ecosystem formation, but not a verified adoption denominator. The Google Play listing was updated on 2026-09-23 and displayed 81 reviews when fetched on 2026-10-24; that is an observable store signal, not a download count or active-user measure. LLMReference reported eight tracked StepFun models and last verified its catalog on 2026-10-15, while a separate pricing catalog listed token prices updated on 2026-10-12. The STEPX launch article says the company did not solely pursue shipment volume and instead wanted to get early users on board quickly, indicating an early-stage terminal adoption objective rather than disclosed scale. No public source in this pool supplies paid accounts, API call volume, renewal cohorts, or customer revenue.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
  - id: named-proof-and-durability
    title: Named proof, durability, and concentration
    body: >-
      Named platform relationships provide evidence of intended use cases, not necessarily production deployment. The 36Kr launch account says StepFun had ecosystem cooperation with major domestic internet companies, while the StepX coverage identifies travel, payments, ride-hailing, food, office, video, and mapping workflows. Qichacha records a Guotai Haitong Securities project win, but does not disclose its value, delivery status, or outcome. The app-store record provides a more direct user signal: reviewers reported failed requests and country-specific phone-number registration constraints in October 2026. Those complaints show usability and geographic-access friction, but they do not quantify churn or establish that the complaints are representative. Retention metrics, contract length, gross or net retention, top-customer concentration, and expansion rates remain unverified; diligence should require customer-level revenue, deployment stage, cohort, and renewal evidence.
    claimRefs: [CU004, CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
    figureRefs: [FU001]
