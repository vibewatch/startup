    claimRefs: [CU001, CU002, CU003, CU004]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns: [Metric, Value, Date, Source, Confidence, Implication, Missing denominator]
    rows:
      - [Google Play reviews, 81 reviews displayed, "2026-10-24 fetch; app updated 2026-09-23", Google Play, medium, "Confirms a live consumer distribution surface and visible user feedback", "Downloads, active users, geography, and review coverage"]
      - [Tracked models, 8 models, "2026-10-15 verification", LLMReference, medium, "Indicates a catalog broad enough for multiple developer workloads", "Paying developers, request volume, and model-level mix"]
      - [API price catalog, "$0.090 input and $0.300 output per 1M tokens for Step 3.5 Flash", "2026-10-12 update", AI API Prices, medium, "Makes a low-cost API entry point observable", "Official price confirmation, discounts, volume, and realized revenue"]
      - [Terminal adoption objective, "Early users should be onboarded quickly; shipment volume not the sole objective", "2026-07-13 launch coverage", 36Kr, medium, "Signals validation-focused early terminal commercialization", "Actual devices shipped, activated, retained, and paid"]
    notes: "Values are direct observations or quoted objectives from the listed sources; none is an audited customer-count or retention metric."
    claimRefs: [CU005, CU006, CU007, CU008]
  - id: TU003
    title: Named customer proof table
    columns: [Customer or partner, Segment, Deployment/use case, Production vs pilot, Outcome, Limitation]
    rows:
      - [Alipay and Meituan, Platform partners, Cross-app payments and local-services workflows for STEPX Neo, "Launch-stage ecosystem cooperation; production status not established", "Named integrations make the intended agent workflow concrete", "No contract, usage, outcome, or revenue disclosure"]
      - ["Didi and Trip.com", Platform partners, "Ride-hailing and travel task orchestration", "Launch-stage ecosystem cooperation; production status not established", "Supports a multi-service travel workflow proposition", "No active-user, completion-rate, or retention evidence"]
      - ["WPS and CapCut", Platform partners, "Office-document and video-editing actions", "Launch-stage ecosystem cooperation; production status not established", "Extends the agent proposition beyond chat into work and media tasks", "No named customer case study or independently measured outcome"]
      - [Guotai Haitong Securities, Enterprise financial services, "Model, compute-resource, and token-governance platform project", "Winning-bid notice; delivery status not established", "Provides procurement evidence tied to a named enterprise", "No award value, utilization, production outcome, or renewal evidence"]
      - [StepFun AI app users, Consumer users, "Chat, document understanding, and StepClaw task execution", "Live app listing; user feedback is public", "81 reviews and direct complaints provide observable user evidence", "Reviews include failures and access friction; no representative satisfaction or churn rate"]
    notes: "Enumeration is partial: it covers named relationships and the public app evidence in the assigned sources, not the full customer population. Rows are not claims that any named partner is a paying customer."
    enumerationScope:
      coverage: partial
      basis: "Named relationships and app-store evidence publicly visible in assigned sources fetched on 2026-10-24"
    claimRefs: [CU003, CU004, CU009, CU010, CU011, CU012]
figures:
  - id: FU001
    title: Customer journey from discovery to expansion
    type: journey-map
    summary: StepFun's observable customer path moves from assistant or API discovery into ecosystem-enabled use, while expansion and retention remain unverified.
    data:
      items:
        - label: Discover
          detail: "Consumer finds the StepFun AI app, or a developer evaluates the public model catalog and token pricing."
          touchpoints: ["Google Play listing", "LLMReference catalog", "API pricing catalog"]
          claimRefs: [CU002, CU005, CU006, CU007]
        - label: Evaluate
          detail: "Users test chat and task execution; developers assess coding, retrieval, agent, and long-context workloads."
          touchpoints: ["81 store reviews", "Eight tracked models", "Published per-token reference prices"]
          claimRefs: [CU005, CU006, CU007, CU009]
        - label: Deploy
          detail: "Platform relationships are intended to enable cross-app tasks in STEPX Neo and the assistant ecosystem."
          touchpoints: ["Alipay and Meituan", "Didi and Trip.com", "WPS and CapCut", "Guotai Haitong Securities"]
          claimRefs: [CU003, CU004, CU010]
        - label: Expand
          detail: "A durable expansion loop would require repeat usage, paid API growth, device activation, or partner rollout; public evidence does not quantify any of these."
          touchpoints: ["Retention data: not disclosed", "Customer concentration: not disclosed", "Production outcomes: not disclosed"]
          claimRefs: [CU008, CU011, CU012]
        - label: Support
          detail: "The app-store record exposes onboarding and request-failure friction that could create support demand."
          touchpoints: ["Phone-number registration complaints", "Failed-request complaints"]
          claimRefs: [CU009]
        - label: Renew
          detail: "Renewal, repeat purchase, and contracted expansion cannot be assessed from the assigned public evidence."
          touchpoints: ["Renewal data: not disclosed", "Cohort data: not disclosed"]
          claimRefs: [CU011, CU012]
