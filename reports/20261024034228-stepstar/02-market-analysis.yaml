slug: stepstar
runDate: 2026-10-24
company:
  name: StepStar
chapter:
  number: 2
  title: Market Analysis
  summary: StepStar participates in a broad Chinese AI stack whose addressable opportunity spans infrastructure, model access, enterprise workflows, and device integration. Public evidence supports a large and rapidly adopting market, but incompatible perimeters, opaque buyer economics, and intense price competition prevent a defensible company-specific SAM or SOM.
sections:
  - id: market-boundary
    title: Market boundary and demand context
    body: >-
      The relevant market is not one homogeneous “AI market.” For StepStar, the
      boundary should include foundation-model training and inference infrastructure,
      model APIs and agent tooling, enterprise application integration, and device-side
      licensing or embedded AI. It should exclude unrelated semiconductor sales,
      general IT spending, and all consumer-device revenue not attributable to StepFun
      software or model capability. The distinction matters because public estimates
      use incompatible perimeters: China’s government figure covers the whole stack,
      while private research estimates focus on software and applications. StepStar’s
      own described model is mixed cloud usage plus device licensing, so demand can
      come from developers, enterprises, and device manufacturers rather than one
      subscription buyer. The market is therefore best evaluated as linked lenses, not
      a single TAM.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and adoption trajectory
    body: >-
      The strongest sizing evidence is a set of explicitly labeled lenses. Gartner
      forecasts worldwide AI spending of $2.59 trillion in 2026, but that figure is
      a global all-AI spend estimate and cannot be assigned to StepStar. Axis reports
      China’s 2025 core AI industry at 1.2 trillion yuan ($173.9 billion), including
      chips, intelligent-computing infrastructure, software, and services. Its narrower
      software-and-application lens is $28.18 billion in 2025, with a 32.5% CAGR toward
      $202 billion in 2032. The same source reports 602 million Chinese generative-AI
      users in December 2025, a 42.8% population penetration, while Gartner describes
      infrastructure as more than 45% of worldwide spending and says model spending
      growth was raised to 110% in 2026. These figures show substantial demand, but
      differing units, geographies, and perimeters mean they are not additive and do
      not isolate StepStar’s obtainable share.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-constraints
    title: Buyer segmentation, drivers, and constraints
    body: >-
      StepStar’s buyer map has at least three distinct budget paths. Developers and
      application teams buy API calls and agent tooling against usage budgets;
      enterprises buy workflow integration, governance, and potentially dedicated
      deployment against software or transformation budgets; and device makers buy
      embedded model capability, licensing, and ecosystem integration against product
      and hardware roadmaps. Reported API invocation growth and integration into more
      than 42 million devices indicate adoption signals, but neither establishes
      recurring revenue, retention, margin, or paid conversion. The principal drivers
      are expanding agentic workflows, falling inference cost, multimodal use cases,
      and Chinese user adoption. Constraints include model price compression,
      licensing and compliance requirements, infrastructure cost, switching or
      multi-homing among providers, and the absence of public customer-level
      economics. A company-specific SOM remains an evidence gap.
    claimRefs: [CM004, CM009, CM011, CM012, CM013, CM014, CM016]
    tableRefs: [TM003]
callouts:
  - calloutType: insight
    title: Large market, unproven obtainable share
    body: The evidence supports a large and expanding AI demand environment, but StepStar’s market opportunity should be underwritten through buyer-level API economics, device-license terms, and renewal evidence rather than a top-down headline TAM.
    claimRefs: [CM006, CM007, CM011, CM016]
  - calloutType: risk
    title: Perimeter and price compression risk
    body: China’s reported AI market values range from private software/application revenue to whole-stack industry scale, while comparable model providers advertise very low token prices; both effects can overstate StepStar’s realistic monetizable pool.
    claimRefs: [CM007, CM014, CM017]
tables:
  - id: TM001
    title: Market definition and buyer boundary
    columns: [Segment, Included spend, Excluded spend, Buyer or payer, Relevance to StepStar]
    rows:
      - [Foundation-model infrastructure, "Training and inference compute attributable to model services", "Unrelated general semiconductor sales", "Cloud provider or enterprise infrastructure owner", "Enables model availability but is capital intensive"]
      - [Model API and agent tooling, "Token usage, hosted models, orchestration, and agent services", "General SaaS unrelated to AI workloads", "Developer or enterprise software budget", "Direct cloud monetization path"]
      - [Enterprise AI workflows, "Integration, governance, and workflow automation using models", "Non-AI consulting and ordinary IT operations", "Business-unit or transformation budget", "Potential higher-value, lower-volume demand"]
      - [Device-side AI, "Embedded model licensing and terminal integrations", "Device hardware revenue not attributable to AI software", "Device manufacturer product budget", "Distinct licensing and distribution path"]
    notes: "Boundary is analytical and separates StepStar's mixed cloud/device model from broader AI infrastructure and unrelated IT spend; public sources do not disclose StepStar's segment revenue split."
    claimRefs: [CM001, CM002, CM003, CM004, CM011]
  - id: TM002
    title: Sizing lenses and adoption evidence
    columns: [Publisher, Year or period, Geography, Value, CAGR or growth, Methodology and limitation, Confidence]
    rows:
      - [Gartner, 2026, Worldwide, "$2.59T AI spending", "47% YoY", "All-AI spending forecast; not StepStar-specific and includes infrastructure", high]
      - [Axis Intelligence Research citing MIIT, 2025, China, "1.2T yuan ($173.9B) core AI industry", null, "Whole-stack government perimeter including chips, infrastructure, software, and services", medium]
      - [Axis Intelligence Research citing Fortune Business Insights, 2025-2032, China, "$28.18B in 2025 to $202B in 2032", "32.5% CAGR", "Narrower software/application revenue lens; excludes hardware and infrastructure investment", medium]
      - [CNNIC as reported by Axis Intelligence Research, December 2025, China, "602M generative-AI users; 42.8% penetration", "141.7% YoY user increase", "Six-month active-use window; user count is adoption context, not revenue", medium]
    notes: "Values are not additive: publishers use different geographies, units, periods, and market perimeters. The table preserves those qualifications rather than deriving a StepStar SAM."
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010]
  - id: TM003
    title: Segment and buyer map
    columns: [Segment, Buyer, User, Payer, Workflow, Budget owner, Adoption trigger]
    rows:
      - [Developer and application teams, Product or engineering lead, Developers and end users, API or engineering budget, Build and operate AI features, Engineering or product, Model capability and API availability]
      - [Enterprise workflow teams, Business-unit sponsor and CIO organization, Employees and customers, Transformation or software budget, Automate multistep knowledge work, Business unit plus IT, Measurable productivity or service improvement]
      - [Device manufacturers, Product and platform leadership, Device users, Hardware product budget, Embed agents and multimodal functions, Product and ecosystem, Differentiated terminal experience and partner integrations]
      - [Consumer application operators, Product or ecosystem lead, Consumer application users, Product or growth budget, Embed multimodal model features, Product and growth, Payment conversion or differentiated user experience]
    notes: "Segments are evidence-constrained operating hypotheses based on the company model descriptions and reported integrations; public disclosures do not identify named paying customers, contract values, or conversion rates."
    claimRefs: [CM003, CM004, CM011, CM012, CM013, CM016]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: Nested sizing lenses show why whole-stack China AI industry figures cannot be treated as StepStar's obtainable market.
    data:
      nodes:
        - {label: "Worldwide AI spending (2026)", value: "$2.59T", detail: "Gartner forecast; all-AI worldwide perimeter"}
        - {label: "China core AI industry (2025)", value: "1.2T yuan / $173.9B", detail: "MIIT whole-stack perimeter"}
        - {label: "China software and applications (2025)", value: "$28.18B", detail: "Narrower software/application lens"}
        - {label: "StepStar obtainable share", value: "Not disclosed", detail: "Requires buyer-level revenue and contract evidence"}
        - {label: "StepStar SOM", value: "Not isolated", detail: "No public paid-customer or retention denominator"}
        - {label: "StepStar revenue pool by segment", value: "Not disclosed", detail: "Cloud API versus device licensing split unavailable"}
    approximationNotes: "The pyramid is an ordered presentation of distinct published lenses, not a proportional scale or additive calculation; values retain their source units and perimeters."
    claimRefs: [CM005, CM006, CM007, CM016]
