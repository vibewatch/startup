company:
  name: StepStar
chapter:
  number: 3
  title: Competitors
  summary: StepFun competes in a crowded Chinese foundation-model field where Qwen, DeepSeek, Kimi, MiniMax, GLM, and large incumbent ecosystems offer overlapping model, API, and multimodal capabilities. Its most distinctive angle is a multimodal-to-device strategy, but open-weight rivals, low inference prices, and incumbent distribution make durability dependent on deployment, ecosystem, and trust rather than model size alone.
sections:
  - id: landscape
    title: Competitive landscape and buyer alternatives
    body: >-
      StepFun is not competing against one homogeneous peer set. The immediate direct set includes Moonshot's Kimi, DeepSeek, Zhipu's GLM, MiniMax, and Alibaba's Qwen: all offer model families and developer access, while several also support agents, multimodality, or open-weight deployment. The broader set includes Baidu ERNIE, Huawei Pangu, SenseTime SenseNova, ByteDance Doubao, and Alibaba Cloud as incumbent distribution and industry-specialist alternatives. For a buyer, the status quo is often a third-party API or an existing cloud stack rather than a fresh foundation-model vendor. Internal build or self-hosting is also a substitute where open weights, data residency, latency, or compliance matter. The evidence therefore supports a layered landscape, not a claim that StepFun owns a uniquely defined category.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]
  - id: capability-and-economics
    title: Capability, packaging, and distribution comparison
    body: >-
      The comparable buying criteria are capability fit, deployment choice, price transparency, and distribution. Independent comparison material describes Qwen as general-purpose and multimodal, DeepSeek as reasoning and coding oriented, Kimi as a document and agent workflow option, MiniMax as a broad multimodal suite, and GLM as a model family with visual and developer tooling. StepFun's public profile emphasizes multimodal models, open weights for selected releases, and a route from APIs into phones and cars. That is a credible differentiation lens, but the available pool does not provide a like-for-like StepFun price sheet or an independently audited benchmark. Pricing comparisons should therefore be treated as directional: the third-party 2026 comparison lists rival token prices, while StepFun's smartphone report gives a device launch but no retail price. Buyers can multi-home across APIs, so switching costs are likely lower at the model layer than at the integrated device or workflow layer.
    claimRefs: [CP005, CP006, CP007, CP008]
    tableRefs: [TP002, TP003]
    figureRefs: [FP001]
  - id: moat-and-displacement
    title: Moat durability and displacement risk
    body: >-
      StepFun's strongest defensibility hypothesis is systems integration: the company says its models were integrated into more than 42 million devices by 2025, and its launch materials describe a built-in agent connecting foundation models, software, and hardware. This can create distribution, feedback, and workflow advantages that a raw API does not. It is not yet proof of durable monetization, because the device report does not disclose conversion, retention, unit economics, or the commercial terms of ecosystem partnerships. The adverse case is that open-weight releases and rapidly falling rival inference prices commoditize model access, while Alibaba, Huawei, ByteDance, and other incumbents bring cloud, channel, and enterprise trust.       The registry's 214 insured participants for the 2025 annual report are a workforce proxy, not
      total headcount or evidence of model-market traction. The moat should consequently be
      underwritten as conditional on sustained deployment and partner access rather than company
      claims about installations or an unsupported inference from corporate scale.
    claimRefs: [CP009, CP010, CP011, CP012]
callouts:
  - calloutType: strength
    title: Differentiation is downstream of the model
    body: The most credible differentiation is the multimodal-to-device route, not a standalone claim of superior model quality.
    claimRefs: [CP009, CP010]
  - calloutType: risk
    title: API competition is structurally intense
    body: Open weights, multi-homing, low rival token prices, and incumbent cloud ecosystems limit pricing power unless StepFun converts integrations into durable workflows.
    claimRefs: [CP005, CP007, CP011]
