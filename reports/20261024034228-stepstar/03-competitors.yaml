      - [Kimi K2.6 API, "$0.50 input / $1.50 output per 1M tokens in third-party snapshot", "Coding and agent workflow positioning", "Self-hosting and version terms require verification", "Multi-homing gives buyers a substitute"]
      - [MiniMax M2.7, "$1.00 input / $3.00 output per 1M tokens in third-party snapshot", "Native multimodal voice / video positioning", "Voice and video extras are unspecified", "Multimodal specialization is a direct comparison axis"]
