      whyItMatters: Without revenue and mix, deployment signals cannot be converted into a forecast or valuation test.
      diligencePath: Request the latest income statement, revenue-recognition memo, customer cohort schedule and top-customer contracts.
      relatedQuestionRefs: [QI001, QI004]
      relatedTableRefs: [TI001, TI002]
    - type: private-evidence-only
      severity: blocking
      topic: unit-economics
      missingEvidence: Gross-margin bridge and measured compute, inference, data, support and deployment costs by product.
      whyItMatters: Frontier-model scale can produce high technical performance while remaining structurally loss-making.
      diligencePath: Request product-level contribution margins, GPU utilization, cloud invoices, capacity commitments and support-cost allocation.
      relatedQuestionRefs: [QI005, QI009]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: capital-adequacy
      missingEvidence: Current cash, monthly burn, runway, debt and remaining financing proceeds.
      whyItMatters: Funding raised is not equivalent to cash available and cannot establish financing independence.
      diligencePath: Request a current balance sheet, twelve-month cash-flow bridge, debt schedule and board-approved financing plan.
      relatedQuestionRefs: [QI006, QI007, QI008]
      relatedTableRefs: [TI003]
    - type: missing-source
      severity: material
      topic: pricing
      missingEvidence: First-party API, application and OEM pricing, including discounts, minimum guarantees and revenue shares.
      whyItMatters: List or benchmark pricing does not establish realized price, take rate or margin.
      diligencePath: Request current price sheets, representative invoices and executed OEM/commercial agreements.
