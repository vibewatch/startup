      - [Investment-advisory deployment, Guotai Junan International, Enterprise / financial-services use case, Undisclosed, Compliance or procurement delay blocks production rollout, High, Named deployment objective, Medium-high]
      - [Advanced accelerator supply, Nvidia / Huawei and domestic chip ecosystem, Training and inference compute, Systemic and not disclosed for StepFun, Export controls or domestic capacity constraints raise cost or limit performance, High, Domestic-accelerator adaptation is an industry direction, High]
      - [Capital-market access, Hong Kong Exchange and investors, Funding and liquidity, Concentrated, Listing delay or down-round restricts compute investment, High, Shareholding reform and reported IPO preparation, Medium-high]
    notes: "Counterparty roles are drawn from public reporting; concentration, contract terms, exclusivity, service levels, and switching costs are not disclosed in the assigned evidence."
    claimRefs: [CR010, CR011, CR012, CR013, CR014]
