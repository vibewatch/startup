callouts:
  - calloutType: risk
    title: Primary thesis-break condition
    body: The investment case breaks if StepStar cannot demonstrate audited unit economics and funded compute capacity while keeping strategic hardware and enterprise partners diversified enough to protect deployment volume.
    claimRefs: [CR001, CR002, CR010]
  - calloutType: assumption
    title: Evidence limitation
    body: Public sources in this assigned pool do not establish complete litigation, licensing, incident, customer-concentration, or cash-runway records; those remain explicit diligence gaps rather than assumed negatives.
    claimRefs: [CR008, CR009, CR014]
