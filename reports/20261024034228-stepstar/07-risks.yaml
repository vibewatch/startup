company:
  name: StepStar
chapter:
  number: 7
  title: Risks
  summary: StepStar's principal risks are commercialization economics, dependence on hardware ecosystems, export-control and compute constraints, and unresolved regulatory and legal exposure. Public evidence supports a research-more posture, but the current pool does not establish audited cash runway, customer concentration, or the completeness of regulatory filings.
sections:
  - id: risk-ranking
    title: Ranked risk posture
    body: >-
      StepStar's highest-consequence risk is not model capability but whether a capital-intensive foundation-model business can convert technical progress into durable, cash-generative demand. Independent commentary describes an unproven profit model, persistent training and inference costs, and a channel structure dependent on a few hardware manufacturers. That combination creates operating leverage in both directions: device launches or enterprise adoption can accelerate utilization, while delayed hardware cycles, in-house model substitution, or pricing pressure can compress contribution margins. The company-specific financial evidence remains incomplete, so likelihood is assessed as material rather than quantified. A thesis-break trigger is evidence of sustained gross-margin deterioration, inability to fund committed compute, or a financing round materially below the last credible mark.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR015]
    tableRefs: [TR001]
  - id: regulatory-and-legal
    title: Regulatory, legal, and governance exposure
    body: >-
      The listing and operating structure create several compliance dependencies. A contemporaneous account says StepFun was dismantling its red-chip structure, completing a shareholding reform, and preparing for a Hong Kong listing, while noting that no formal A1 application had appeared as of 20 May 2026. A corporate registry extract records the entity as an unlisted Hong Kong-and-Macao-invested company and lists licenses for value-added telecommunications and internet information services; it also shows a labour-dispute hearing notice. These records do not establish a violation, but they make data, related-party, licensing, labour, and disclosure diligence decision-critical. The relevant kill criteria are a material regulator finding, an unremediated license gap, a prospectus qualification, or a filing delay caused by unresolved compliance questions.
    claimRefs: [CR006, CR007, CR008, CR009, CR016]
    tableRefs: [TR002]
  - id: dependencies-and-monitoring
    title: Dependencies, technical resilience, and diligence
    body: >-
      StepFun's device-oriented strategy makes counterparties and compute supply strategic rather than incidental. Public reporting identifies work with Geely on smart cockpits and Guotai Junan International on investment-advisory systems, while separate analysis warns that hardware-market cycles, manufacturer in-house development, and long replacement cycles can weaken a third-party model supplier's bargaining position. The broader compute environment is also exposed to export controls: reporting describes Nvidia sales in China stalling as domestic suppliers such as Huawei gain share, while noting that demand still exceeds available supply and that Chinese chips lag Nvidia in some advanced workloads. Monitoring should therefore focus on top-counterparty revenue share, renewal and deployment milestones, inference cost per token, domestic accelerator performance, incident rates, and unrestricted cash runway. The immediate diligence ask is a customer-by-customer revenue bridge and compute procurement plan.
    claimRefs: [CR010, CR011, CR012, CR013, CR014]
    tableRefs: [TR003]
    figureRefs: [FR001]
