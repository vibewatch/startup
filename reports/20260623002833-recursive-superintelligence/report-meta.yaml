  productSummary: >-
    No commercially deployed product as of run date. The company is developing a
    self-improving AI research system that automates the full AI research loop: proposing
    ideas, implementing them, running experiments, validating results, and using learnings
    to guide the next cycle. First results published in June 2026 show state-of-the-art
    performance on three benchmarks (NanoChat Autoresearch, NanoGPT Speedrun,
    SOL-ExecBench). A "Level 1" autonomous training system is planned; public launch is
    targeted for mid-2026.
  customerFocus: >-
