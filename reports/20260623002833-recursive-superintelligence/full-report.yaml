  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk overview
        blocks:
          - type: paragraph
            body: >-
              The risk profile of Recursive Superintelligence is that of a high-conviction, high-variance bet, and the
              risks rank in a clear order. The highest-severity risk is thesis risk: recursive self-improvement may
              never become a reliable, deployable capability, and no public source quantifies the probability of
              technical success. Closely behind sits valuation risk, because a $4.65 billion price assumes a success
              that is currently unproven, so any disappointment compresses value sharply. Key-person risk is also acute,
              given five founders, several on leave from senior roles, with concentrated decision-making. Regulatory,
              compute-dependency, and financial risks form the next tier. Across almost every category, mitigation
              maturity is low because the company is early-stage and discloses little about its controls. The aggregate
              picture is that the downside is the loss of most invested capital if the thesis fails, while the upside
              depends on an outcome that the field has not yet demonstrated. This asymmetry, rather than any single
              operational flaw, is the defining investment-relevant feature of the risk set.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR022
              - CR027
              - CR040
              - CR041
