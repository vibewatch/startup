      - number: '7.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Binary, capital-at-risk thesis
            body: >-
              If recursive self-improvement does not compound within the funded runway, the most likely outcome is a
              down-round or wind-down with loss of most capital.
