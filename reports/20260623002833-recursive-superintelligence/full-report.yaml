      - number: '3.3'
        title: Capability, pricing, GTM, and trust
        blocks:
          - type: paragraph
            body: >-
              On capability, no public benchmark places Recursive against current frontier production models, so
              head-to-head comparison is not yet possible. On pricing, competition is presently moot for Recursive
              because it has nothing to price, but Anthropic’s and OpenAI’s published per-token API pricing set the
              commercial bar it will eventually face. On go-to-market and distribution, incumbents enjoy a decisive
              advantage through embedding in cloud and productivity ecosystems and through enterprise sales machines
              that Recursive has not begun to build. On trust and regulatory posture, Anthropic, OpenAI, and DeepMind
              already engage formally with safety institutes and have multi-year track records in evaluations and
              enterprise assurance, whereas Recursive has none. Cohere and Aleph Alpha further demonstrate that
              enterprise trust and data residency can substitute for raw frontier capability, opening positioning lanes
              that do not depend on winning the capability race. In every commercial dimension that buyers actually
              evaluate today, Recursive trails, and its only offsetting asset is the credibility of its founders.
            claimRefs:
