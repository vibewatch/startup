      - number: '5.2'
        title: Module map and use cases
        blocks:
          - type: paragraph
            body: >-
              The system decomposes into five demonstrated modules, an idea proposer, an implementer, an experiment
              runner, a validator, and a learning loop, plus a planned Level 1 autonomous training system on the
              roadmap. The current use cases are internal: automating ML research experiments and beating community
              benchmarks. The concrete results anchor this. On the NanoChat Autoresearch benchmark, the company reports
              0.9109 bits-per-byte against a community best of 0.9372; on the NanoGPT Speedrun, it reports reaching the
              3.28 validation-loss target in 77.5 seconds versus 79.7 seconds; and on SOL-ExecBench, it reports a 0.754
              mean SOL score versus 0.699, framed as an 18% reduction in the gap to optimal. These benchmarks are
              derived from community baselines such as Karpathy’s autoresearch, nanochat, and nanoGPT, with an academic
              LLM-speedrunning benchmark and Meta’s speedrunner repository providing independent context. The gains are
              real but incremental and narrow-domain, and external or commercial use cases remain prospective rather
