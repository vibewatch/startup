      - number: '3.4'
        title: Switching cost, distribution, and supply access
        blocks:
          - type: paragraph
            body: >-
              Structural competitive dynamics cut both ways. Switching costs are rising as enterprises embed specific
              models into workflows and agents, which advantages incumbents that are already deployed, but multi-homing
              across several providers remains common, limiting any single vendor’s lock-in and leaving a theoretical
              door open for a later entrant. Distribution power clearly favours incumbents embedded in cloud and
              productivity ecosystems. Supply and partner access is contested primarily through compute, and here
              Recursive’s NVIDIA and AMD backing partially levels the field, although those same hardware vendors are
              suppliers and investors across multiple competing labs, so the advantage is shared rather than exclusive.
              Recursive’s most tangible competitive asset is its founding team, but talent moats are fragile because
              elite researchers are mobile and aggressively recruited. The net effect is that Recursive holds a credible
              seat at the research table through its people and its compute backing, yet it has no durable distribution
              or supply advantage that would protect it if its method does not deliver.
            claimRefs:
              - CP017
              - CP018
              - CP019
              - CP020
              - CP021
              - CP033
      - number: '3.5'
        title: Moat durability and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The durability question reduces to a single bet. If recursive self-improvement works as a deployable
              capability, Recursive could leapfrog incumbents; if it does not, the company lacks the fallback commercial
              assets, products, distribution, and enterprise relationships, that competitors have accumulated. Two
              structural risks weigh against the moat. First, incumbents already pursue automated AI research
              internally, so the methodological edge may be narrower than the company’s framing implies. Second,
              commoditisation risk is high as open-weight models from Mistral and others compress the value of raw
              capability. The adverse coverage reinforces this: FrontierBeat highlighted the absence of product,
