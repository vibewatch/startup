      - number: '3.2'
        title: Competitor profiles and scope
        blocks:
          - type: paragraph
            body: >-
              The incumbents are formidable. Anthropic distributes Claude through direct products, an API, and
              enterprise plans with published pricing; OpenAI pairs ChatGPT with a priced API and enterprise tiers; and
              Google DeepMind couples frontier research with distribution across Google’s products and cloud. Among
              challengers, Mistral ships a product family spanning open-weight and commercial models, Cohere targets
              enterprise retrieval and agentic workloads with its Command family, and Aleph Alpha emphasises sovereign
              and regulated-market deployments. Against this, Recursive has no shipping product, no published pricing,
              and no distribution channel; its public footprint is a research article, open-sourced artifacts, and a
              financing announcement. Its stated differentiation is methodological, open-ended algorithms and recursive
              self-improvement rather than scale alone, which is intellectually distinct but commercially untested.
              Crucially, the incumbents are far larger by funding, headcount, and revenue, so Recursive is competing on
              a thesis about future capability rather than on any present product comparison, and its benchmark claims
              are measured against community baselines, not frontier production systems.
