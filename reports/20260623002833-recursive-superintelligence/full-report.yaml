        title: Milestones and adverse signals
        blocks:
          - type: paragraph
            body: >-
              The public chronology is short but already material. The UK entity was incorporated on 31 December 2025;
              the Financial Times first reported the financing in April 2026; the company came out of stealth in May
              2026 with a confirmed $650 million round; and it published first technical results describing an automated
