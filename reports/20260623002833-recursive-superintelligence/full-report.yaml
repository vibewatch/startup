  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition in workflow terms
        blocks:
          - type: paragraph
            body: >-
              Recursive Superintelligence’s product is an automated AI research system that, in the company’s own
              description, proposes research ideas, implements them as code, runs the resulting experiments, validates
              the outcomes, and feeds the learnings into the next cycle. In customer-workflow terms, it automates the
              machine-learning research loop itself rather than serving an end-user application, and it is framed as a
              step toward recursively self-improving AI built on open-ended algorithms. The value proposition is high
              leverage in principle, because automating research could compound capability gains, but it is also
              unproven, and the system is currently a research pipeline rather than a product that an external customer
              could buy or integrate. There is no described deployment, integration path, service-level agreement, or
              support model, which is consistent with a pre-product lab. The honest framing is that the company has
              demonstrated an internal research engine and published evidence of its early performance, not a
              customer-facing offering, and the entire later product surface depends on this loop maturing into
              something deployable.
