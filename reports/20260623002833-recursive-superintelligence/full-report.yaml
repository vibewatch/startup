              - CR040
      - number: '7.5'
        title: People, execution, and reputational risk
        blocks:
          - type: paragraph
            body: >-
              People and execution risks are heightened by the company’s structure and stage. Key-person dependence is
              high because the company is built around five founders with concentrated control, several of whom remain
              affiliated with prior academic or industry institutions, raising questions about divided attention and
              long-term commitment. Talent-retention risk is elevated because the founders and staff are heavily
              recruited across the industry, and the organisation is unproven at execution and scaling as a company
              rather than as individual researchers. Reputational and safety-narrative risk is also meaningful: any
              company branding itself around superintelligence attracts scrutiny, and the Economist’s warning that
              society may be unprepared for an intelligence explosion sharpens that scrutiny. Adverse coverage from
              FrontierBeat, Startup Fortune, and Otherworlds AI is itself a risk signal worth tracking, since sustained
              skepticism can affect hiring, partnerships, and future financing. These risks are harder to mitigate with
              capital alone and depend on governance and leadership choices the company has not yet disclosed.
            claimRefs:
              - CR023
              - CR024
              - CR026
              - CR031
              - CR033
          - type: table
            tableRef: TR004
            claimRefs:
              - CR003
              - CR023
