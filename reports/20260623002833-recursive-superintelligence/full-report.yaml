      - number: '2.4'
        title: Drivers, constraints, and contradictory signals
        blocks:
          - type: paragraph
            body: >-
              Growth drivers and adoption constraints are tightly coupled in frontier AI. On the driver side, rapid
              capability improvement, abundant venture capital, and strategic hardware-vendor backing all accelerate the
              market. On the constraint side, the EU AI Act introduces general-purpose and frontier-model obligations
              that raise compliance costs, while the UK’s pro-innovation, principles-based stance may lower near-term
              friction for a UK-incorporated lab. Lawfare’s analysis underscores genuine uncertainty about how
              general-purpose AI rules will be applied, an ambiguity that itself slows regulated adoption. Capital
              intensity acts as both a driver and a barrier, because the compute scale required to do frontier research
              simultaneously gates entry and rewards the best-funded players. The binding constraint for regulated
              buyers is likely to be trust and verifiability: self-improving systems are precisely the class of
              technology that is hardest to validate and certify. These signals are contradictory by design, and we
              preserve that tension rather than resolving it into a single optimistic or pessimistic sizing number.
