companyProfile:
  summary: >-
    Recursive Superintelligence is a frontier AI research lab incorporated in England and Wales (company number
    16937077, registered December 31 2025) with offices in London and San Francisco. The company's thesis is that the
    fastest path to superintelligence is AI that recursively improves itself via open-ended algorithms, with an initial
    focus on automating the AI research process itself. The founding team of five — Richard Socher (CEO, ex-Salesforce
    Chief Scientist), Tim Rocktäschel (ex-Google DeepMind, UCL professor), Jeff Clune (UBC professor, open-endedness
    pioneer), Josh Tobin (ex-OpenAI, co-founder of Cresta), and Tim Shi (ex-OpenAI, Delphi co-founder) — brings a rare
    combination of frontier-research credibility and company-building experience. The company raised $650M at a $4.65B
    valuation in its first disclosed round in April–May 2026, led by GV and Greycroft with NVIDIA and AMD Ventures
    participating. As of the run date, Recursive has published first technical results showing state-of-the-art
    performance on three AI research benchmarks and open-sourced the associated artifacts, but has no commercial
    product, no revenue, and no public customer traction.
