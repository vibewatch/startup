              - CR031
      - number: '7.6'
        title: Mitigations, monitoring, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Mitigation maturity is low across most categories, but some levers exist. The strongest is the company’s
              capital base, which funds milestones and buys time, and strategic hardware backing partially mitigates
              compute-supply risk through preferential access. Beyond these, mitigations are largely undisclosed. For
              monitoring, the key indicators are benchmark progress, hiring and attrition, regulatory developments, and
              runway burn. We define explicit thesis-break triggers: a failure to demonstrate compounding
              self-improvement within the funded runway is the primary kill criterion; the loss of one or more core
              founders is a second; and a severe regulatory blocker, such as a frontier-model prohibition in a key
              market, is a third. The principal diligence asks follow directly: the company’s safety policy, governance
              structure, and regulatory-engagement plan; its burn and runway; and the founders’ commitment terms. Until
              these are addressed, the risk-adjusted view is that this is a binary, capital-at-risk research bet whose
              mitigations cannot yet be verified, which argues for staged, milestone-linked engagement rather than
              unconditional conviction.
            claimRefs:
              - CR027
              - CR028
              - CR029
              - CR030
              - CR032
              - CR039
