      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Sizing this opportunity in dollars is unusually difficult because the company has no revenue, pricing, or
              customers, so a single TAM figure would be misleading. We therefore use multiple lenses. The broad AI
              software and services market is plausibly in the hundreds of billions of dollars annually, but analyst
              estimates diverge widely, so we treat that figure as low-confidence context rather than a target. A
              narrower serviceable market focused on frontier model development and automated AI research is far smaller
              and concentrated among a handful of labs and hyperscalers. The near-term obtainable market for Recursive
              is effectively zero today. The clearest quantitative signal is the capital-raised proxy: the company
              secured roughly $650 million pre-product, which says more about investor conviction than realised demand.
              The UK AISI’s observation that capabilities are doubling roughly every eight months in some domains, and
              the Economist’s intelligence-explosion thesis, support a fast-growing but highly uncertain demand
              environment. The honest conclusion is that company-specific sizing remains an open question.
