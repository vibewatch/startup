      critical coverage.
    data:
      items:
        - date: '2025-12-31'
          label: UK incorporation
          detail: Recursive Superintelligence Ltd registered in England and Wales.
          tone: neutral
        - date: '2026-04-17'
          label: FT funding report
          detail: Early report of a $500M raise at $4B pre-money.
          tone: positive
        - date: '2026-04-18'
          label: FrontierBeat critique
          detail: No product, benchmarks or repo at the time of reporting.
          tone: warning
        - date: '2026-05-13'
          label: Out of stealth
          detail: $650M at $4.65B confirmed; GV and Greycroft lead.
          tone: positive
