      - number: '2.3'
        title: Segments, buyers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              On the demand side, four buyer segments matter. Frontier enterprises, whose budgets sit with CTO and CIO
              functions, would adopt self-improving AI on a medium-term horizon once capability and trust thresholds are
              met. Governments and public-sector AI programmes are a second segment, and the UK’s AI Opportunities
              Action Plan signals concrete public demand and compute investment that could open a regulated channel. AI
              developers and researchers are the most immediately reachable group, which is consistent with the company
              open-sourcing benchmark artifacts to seed community interest. Finally, hyperscalers and hardware vendors
              are already engaged as investors rather than customers, with NVIDIA and AMD participation reflecting
              strategic compute alignment. The adoption path runs from research and community interest, through
              capability validation, to pilots and eventual commercial deployment, and the company is only at the
              earliest stage of that funnel. Crucially, budget ownership and adoption horizons here are estimates,
              because no contracts, pilots, or paid deployments are disclosed.
