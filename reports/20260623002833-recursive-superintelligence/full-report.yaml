  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Recursive Superintelligence sits in the frontier AI research market, where the unit of value is general
              capability rather than a packaged application. Drawing the boundary requires care because the company has
              no shipping product: its core scope is automated AI research and frontier-model capability, with adjacent
              expansion possible into enterprise AI platforms and agentic tooling, and longer-term ambitions toward
              general-intelligence services. The most relevant status-quo substitutes are human-led machine-learning
              research and the internal research pipelines of incumbent labs such as OpenAI, Anthropic and Google
              DeepMind, all of which already pursue automated experimentation. Excluded from the boundary are generic
              SaaS automation and non-AI research and development, which do not compete for the same budgets or talent.
              Because demand for this specific company is still latent, the boundary is necessarily analytical rather
              than revenue-derived, and it should be revisited once the company ships a product that can be mapped to
              identifiable buyers and spend. This framing keeps later sizing honest about what is and is not currently
              monetisable.
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM010
              - CM030
          - type: table
            tableRef: TM001
            claimRefs:
