        title: Identity, headquarters, founding, and model
        blocks:
          - type: paragraph
            body: >-
              Recursive Superintelligence is an early-stage research lab whose stated mission is to build recursively
              self-improving AI through open-ended algorithms. Its UK entity, Recursive Superintelligence Ltd, was
              incorporated in England and Wales on 31 December 2025 under company number 16937077, with a registered
              office at Myo King’s Cross in London and a registered SIC code of 72190 for research and experimental
              development. The company’s privacy and terms pages additionally name a US entity, Recursive
              Superintelligence, Inc., and public reporting describes a London headquarters with a San Francisco
              presence. As of this run the company is pre-revenue, with no commercially deployed product and no
              disclosed paying customers. Its public identity rests on a combination of an official filing, the
              company’s own materials, and funding coverage, which together establish the firm’s legal existence and
              research-lab positioning even though operational metrics such as a verified headcount remain incomplete.
              The one-line characterisation is a frontier research lab pursuing self-improving AI rather than a product
              company with revenue.
