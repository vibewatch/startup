  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape
        blocks:
          - type: paragraph
            body: >-
              Recursive Superintelligence enters a crowded and well-capitalised field along three fronts. The first is a
              small group of direct research peers explicitly chasing superintelligence, most notably Safe
              Superintelligence, founded by Ilya Sutskever, alongside Thinking Machines Lab and research efforts
              associated with Yann LeCun and David Silver. The second front is the set of dominant frontier incumbents,
              Anthropic, OpenAI, and Google DeepMind, which combine state-of-the-art capability with mature
              distribution. The third is a cohort of challengers, Mistral, Aleph Alpha, and Cohere, that compete on
              enterprise, open-weight, and sovereign-AI angles. Substitutes include the internal automated-research
              pipelines that incumbents already run, which is significant because it means Recursive’s methodological
              thesis is not unique to it. Likely future entrants are further well-funded research spinouts, since the
              financing environment rewards elite-team formation. The structural takeaway is that Recursive is the least
              commercially developed actor in a market where every serious competitor either ships products at scale or,
              like SSI, holds a comparable research-first posture with deep funding.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP024
              - CP032
              - CP035
