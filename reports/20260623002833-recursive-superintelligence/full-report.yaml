      - number: '7.2'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory and legal exposure is material and multi-jurisdictional. The EU AI Act, codified as Regulation
              (EU) 2024/1689, imposes obligations on general-purpose and frontier models that raise compliance and
              testing costs, and self-improving systems are precisely the class regulators target for the strictest
              oversight. In the US, the 2023 Executive Order introduced compute thresholds and safety-testing
              expectations for frontier models, while the Seoul Summit frontier AI safety commitments set voluntary
              obligations the company will be expected to meet. The UK’s pro-innovation stance lowers near-term domestic
              friction but does not exempt the company from EU or US rules, and divergence across these regimes raises
              ongoing compliance overhead as the company scales. Against this, the company has no public safety,
              evaluation, or incident-response framework and has not adopted a recognised governance baseline such as
              the NIST AI Risk Management Framework, which is a notable governance gap. There is no current litigation
              or enforcement action, but the dual UK–US entity structure adds legal complexity around IP ownership and
              inter-company arrangements that warrants review.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR015
              - CR016
              - CR034
              - CR036
              - CR038
              - CR042
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR015
              - CR034
      - number: '7.3'
        title: Operational and quality risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, the company’s most important exposure is compute supply, because experiment throughput, and
              therefore research progress, depends on continued GPU access from NVIDIA and AMD. The concentration of
              compute among a few hardware vendors creates supplier-dependency risk, even though those same vendors are
              also investors. Reliability and quality controls for autonomous experimentation are undocumented, which is
              an operational-risk gap that matters more than usual because the system is designed to run experiments
              with limited human oversight. Safety and incident-response capacity is likewise absent from public
              materials, and for a self-improving system that is a high-severity gap rather than a cosmetic one.
              Security exposure from open-sourcing artifacts is comparatively low but non-zero. None of these
              operational risks is unusual for a pre-product research lab, but their combination, heavy compute
              dependence plus undocumented safety and quality controls, means the company’s ability to operate its core
              research engine safely and continuously cannot be verified from public evidence and should be a focus of
              technical diligence.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR025
              - CR035
          - type: figure
            figureRef: FR003
            claimRefs:
              - CR013
              - CR017
              - CR018
              - CR042
      - number: '7.4'
        title: Partner, dependency, and financial/model risk
        blocks:
          - type: paragraph
            body: >-
              Partner and dependency risks compound the operational picture. The company relies on hardware investors
              who also back competing labs, so its compute advantage is shared rather than exclusive, and
              capital-provider concentration is high, with a small lead-investor group holding significant leverage over
              future financing. Regulators function as gatekeepers whose decisions could constrain frontier-model work.
              On the financial and model side, the dominant risk is high burn against an undisclosed runway with no
              revenue buffer; without revenue, a missed capability milestone could trigger a difficult down-round or a
              wind-down. Margin and credit risks are not yet applicable but become relevant once monetisation is
              attempted, and the absence of audited accounts is itself a model risk for any underwriter. Competitive
              displacement risk is high because incumbents pursue the same automated-research goal at far greater scale.
              The throughline is that the company’s survival depends on converting capital into a fundable or
              revenue-generating capability before runway, talent, or investor patience runs out.
            claimRefs:
              - CR017
              - CR018
              - CR019
              - CR020
              - CR021
              - CR037
          - type: table
            tableRef: TR003
            claimRefs:
              - CR013
              - CR017
              - CR018
              - CR038
          - type: figure
            figureRef: FR002
            claimRefs:
