      - number: '5.3'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              Architecturally, the system is an iterative loop layered on top of an algorithmic core that draws on
              open-endedness, AI-generating algorithms, and quality-diversity methods associated with the founders’
              research. Each cycle proposes, implements, executes, validates, and learns, and the loop is fundamentally
              compute-bound because every iteration runs experiments that consume substantial GPU resources. This makes
              NVIDIA and AMD hardware backing a critical dependency for experiment throughput, and it explains why the
              company’s capital intensity is high. The operating model is therefore a tight coupling of three scarce
              inputs: the founders’ algorithmic methods, large-scale compute, and a battery of community benchmarks
              against which progress is measured. The internals beyond this description are not fully disclosed, so the
              architecture is summarised rather than audited. The key architectural question for diligence is whether
              the learning loop produces compounding improvements across cycles or merely one-off gains on individual
