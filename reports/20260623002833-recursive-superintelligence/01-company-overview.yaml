company:
  name: Recursive Superintelligence
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Recursive Superintelligence is a London- and San Francisco-based pre-revenue research lab, incorporated in the UK on
    31 December 2025, pursuing recursively self-improving AI. It raised a reported $650M Series A at a $4.65B valuation
    led by GV and Greycroft, with an exceptional five-founder bench but no product, revenue, or customers, drawing
    pointed critiques of its valuation.
sections:
  - id: section-1
    title: Identity, headquarters, founding, and model
    body: >-
      Recursive Superintelligence is an early-stage research lab whose stated mission is to build recursively
      self-improving AI through open-ended algorithms. Its UK entity, Recursive Superintelligence Ltd, was incorporated
      in England and Wales on 31 December 2025 under company number 16937077, with a registered office at Myo King’s
      Cross in London and a registered SIC code of 72190 for research and experimental development. The company’s
      privacy and terms pages additionally name a US entity, Recursive Superintelligence, Inc., and public reporting
      describes a London headquarters with a San Francisco presence. As of this run the company is pre-revenue, with no
      commercially deployed product and no disclosed paying customers. Its public identity rests on a combination of an
      official filing, the company’s own materials, and funding coverage, which together establish the firm’s legal
      existence and research-lab positioning even though operational metrics such as a verified headcount remain
      incomplete. The one-line characterisation is a frontier research lab pursuing self-improving AI rather than a
      product company with revenue.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
      - CO034
      - CO040
    tableRefs:
      - TO001
    figureRefs:
      - FO003
  - id: section-2
    title: Founders, leadership, and key-person dependence
    body: >-
      The company is built around five co-founders with unusually concentrated research credibility. Richard Socher, the
      CEO, was Chief Scientist and EVP at Salesforce, founded you.com, completed a Stanford PhD in 2014, and is widely
      cited as a deep-learning and NLP pioneer. Tim Rocktäschel, a UCL professor and a director and principal scientist
      at Google DeepMind, is on leave for 2026 and specialises in open-endedness and self-improvement, with two Best
      Paper Awards at ICML 2024. Jeff Clune is a UBC professor, a Canada CIFAR AI Chair, affiliated with the Vector
      Institute, formerly at OpenAI, and associated with AI-generating algorithms. Josh Tobin co-founded Cresta and was
      early at OpenAI, while Tim Shi brings experience from Delphi.ai and OpenAI. This bench gives the company strong
      founder-market fit for a self-improving-AI agenda. The same concentration, however, creates material key-person
      dependence: several founders are listed as on leave from senior academic or industry posts, so their long-term
      commitment and availability are central diligence questions.
    claimRefs:
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
      - CO030
      - CO031
      - CO032
      - CO033
      - CO035
    tableRefs:
      - TO002
  - id: section-3
    title: Funding, valuation, and investors
    body: >-
      Recursive Superintelligence emerged from stealth in 2026 with a Series A financing, but the headline figures
      evolved across sources. The Financial Times reported in April 2026 a $500 million raise at a $4 billion pre-money
      valuation, while tech.eu, CrowdFund Insider and MarketScreener subsequently reported a final close of $650 million
      at a $4.65 billion valuation. We treat the later $650 million at $4.65 billion as canonical because it is the
      confirmed close reported by multiple independent outlets, while flagging the discrepancy explicitly. GV and
      Greycroft are reported as co-leads, with NVIDIA and AMD Ventures participating, the latter two underscoring the
      strategic importance of compute access. Because this is the only known round, total disclosed capital is
      approximately $650 million. No secondaries, debt, or credit facilities are disclosed in public materials, and
      ownership percentages, the preference stack, and board composition are not public, leaving the precise control map
      as an open diligence item despite the clarity on lead investors and headline size.
    claimRefs:
      - CO015
      - CO016
      - CO017
      - CO018
      - CO019
      - CO020
      - CO021
      - CO039
    tableRefs:
      - TO003
    figureRefs:
      - FO002
  - id: section-4
    title: Cover metrics and evidence gaps
    body: >-
      On supportable cover metrics, the company shows a December 2025 founding, a roughly $650 million round, a $4.65
      billion valuation, and a London-plus-San-Francisco footprint, but several headline numbers are unverifiable from
      public sources. Headcount is reported inconsistently: the company says over 25 and growing, tech.eu describes a
      team of fewer than 30, and an earlier FrontierBeat report estimated roughly 20 staff before the close, so we
      record a range rather than a point estimate. Revenue, run-rate, and customer counts are simply absent because the
      company is pre-revenue with no deployed product. Crunchbase aggregates the funding profile but publishes no
      audited financials, and no public source provides a management-approved current headcount or a complete cap table.
      These omissions do not undermine the company’s legitimacy, but they do prevent a clean underwrite and are carried
      forward as explicit gaps rather than filled with invented figures, which is the appropriate posture for a
      pre-product lab at this valuation.
    claimRefs:
      - CO021
      - CO022
      - CO023
      - CO024
      - CO036
      - CO038
    figureRefs:
      - FO001
  - id: section-5
    title: Milestones and adverse signals
    body: >-
      The public chronology is short but already material. The UK entity was incorporated on 31 December 2025; the
      Financial Times first reported the financing in April 2026; the company came out of stealth in May 2026 with a
      confirmed $650 million round; and it published first technical results describing an automated AI research system,
      with a public launch and a Level 1 autonomous training system reported as planned for mid-2026. Alongside these
      positive markers sit two clear adverse signals. FrontierBeat argued in April 2026 that the company had no product
      demos, no benchmarks, and no public repository, framing it as an idea-stage bet. Startup Fortune went further,
      characterising the round as proof that AI talent has become a venture asset and noting that investors are paying
      for possibility rather than cash flow. Both critiques converge on the same tension: an exceptional founding team
      and a bold thesis are being valued at $4.65 billion despite no product, revenue, or customers, which is the
      defining risk of this opportunity.
    claimRefs:
      - CO025
      - CO026
      - CO027
      - CO028
      - CO029
      - CO037
    tableRefs:
      - TO004
