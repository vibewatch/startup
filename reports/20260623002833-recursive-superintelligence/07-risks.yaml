company:
  name: Recursive Superintelligence
chapter:
  number: 7
  title: Risks
  summary: >-
    Recursive Superintelligence presents a binary, capital-at-risk profile. The dominant risk is that recursive
    self-improvement never becomes deployable, compounded by a $4.65B valuation, acute key-person dependence, rising
    EU/US/UK regulatory obligations, heavy compute dependency, and undisclosed runway, all against low mitigation
    maturity and no public safety framework.
sections:
  - id: section-1
    title: Severity-ranked risk overview
    body: >-
      The risk profile of Recursive Superintelligence is that of a high-conviction, high-variance bet, and the risks
      rank in a clear order. The highest-severity risk is thesis risk: recursive self-improvement may never become a
      reliable, deployable capability, and no public source quantifies the probability of technical success. Closely
      behind sits valuation risk, because a $4.65 billion price assumes a success that is currently unproven, so any
      disappointment compresses value sharply. Key-person risk is also acute, given five founders, several on leave from
      senior roles, with concentrated decision-making. Regulatory, compute-dependency, and financial risks form the next
      tier. Across almost every category, mitigation maturity is low because the company is early-stage and discloses
      little about its controls. The aggregate picture is that the downside is the loss of most invested capital if the
      thesis fails, while the upside depends on an outcome that the field has not yet demonstrated. This asymmetry,
      rather than any single operational flaw, is the defining investment-relevant feature of the risk set.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR022
      - CR027
      - CR040
      - CR041
    tableRefs:
      - TR002
    figureRefs:
      - FR001
  - id: section-2
    title: Regulatory and legal risk
    body: >-
      Regulatory and legal exposure is material and multi-jurisdictional. The EU AI Act, codified as Regulation (EU)
      2024/1689, imposes obligations on general-purpose and frontier models that raise compliance and testing costs, and
      self-improving systems are precisely the class regulators target for the strictest oversight. In the US, the 2023
      Executive Order introduced compute thresholds and safety-testing expectations for frontier models, while the Seoul
      Summit frontier AI safety commitments set voluntary obligations the company will be expected to meet. The UK’s
      pro-innovation stance lowers near-term domestic friction but does not exempt the company from EU or US rules, and
      divergence across these regimes raises ongoing compliance overhead as the company scales. Against this, the
      company has no public safety, evaluation, or incident-response framework and has not adopted a recognised
      governance baseline such as the NIST AI Risk Management Framework, which is a notable governance gap. There is no
      current litigation or enforcement action, but the dual UK–US entity structure adds legal complexity around IP
      ownership and inter-company arrangements that warrants review.
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR009
      - CR010
      - CR015
      - CR016
      - CR034
      - CR036
      - CR038
      - CR042
    tableRefs:
      - TR001
  - id: section-3
    title: Operational and quality risk
    body: >-
      Operationally, the company’s most important exposure is compute supply, because experiment throughput, and
      therefore research progress, depends on continued GPU access from NVIDIA and AMD. The concentration of compute
      among a few hardware vendors creates supplier-dependency risk, even though those same vendors are also investors.
      Reliability and quality controls for autonomous experimentation are undocumented, which is an operational-risk gap
      that matters more than usual because the system is designed to run experiments with limited human oversight.
      Safety and incident-response capacity is likewise absent from public materials, and for a self-improving system
      that is a high-severity gap rather than a cosmetic one. Security exposure from open-sourcing artifacts is
      comparatively low but non-zero. None of these operational risks is unusual for a pre-product research lab, but
      their combination, heavy compute dependence plus undocumented safety and quality controls, means the company’s
      ability to operate its core research engine safely and continuously cannot be verified from public evidence and
      should be a focus of technical diligence.
    claimRefs:
      - CR011
      - CR012
      - CR013
      - CR014
      - CR025
      - CR035
    figureRefs:
      - FR003
  - id: section-4
    title: Partner, dependency, and financial/model risk
    body: >-
      Partner and dependency risks compound the operational picture. The company relies on hardware investors who also
      back competing labs, so its compute advantage is shared rather than exclusive, and capital-provider concentration
      is high, with a small lead-investor group holding significant leverage over future financing. Regulators function
      as gatekeepers whose decisions could constrain frontier-model work. On the financial and model side, the dominant
      risk is high burn against an undisclosed runway with no revenue buffer; without revenue, a missed capability
      milestone could trigger a difficult down-round or a wind-down. Margin and credit risks are not yet applicable but
      become relevant once monetisation is attempted, and the absence of audited accounts is itself a model risk for any
      underwriter. Competitive displacement risk is high because incumbents pursue the same automated-research goal at
      far greater scale. The throughline is that the company’s survival depends on converting capital into a fundable or
      revenue-generating capability before runway, talent, or investor patience runs out.
    claimRefs:
      - CR017
      - CR018
      - CR019
      - CR020
      - CR021
      - CR037
    tableRefs:
      - TR003
    figureRefs:
      - FR002
  - id: section-5
    title: People, execution, and reputational risk
    body: >-
      People and execution risks are heightened by the company’s structure and stage. Key-person dependence is high
      because the company is built around five founders with concentrated control, several of whom remain affiliated
      with prior academic or industry institutions, raising questions about divided attention and long-term commitment.
      Talent-retention risk is elevated because the founders and staff are heavily recruited across the industry, and
      the organisation is unproven at execution and scaling as a company rather than as individual researchers.
      Reputational and safety-narrative risk is also meaningful: any company branding itself around superintelligence
      attracts scrutiny, and the Economist’s warning that society may be unprepared for an intelligence explosion
      sharpens that scrutiny. Adverse coverage from FrontierBeat, Startup Fortune, and Otherworlds AI is itself a risk
      signal worth tracking, since sustained skepticism can affect hiring, partnerships, and future financing. These
      risks are harder to mitigate with capital alone and depend on governance and leadership choices the company has
      not yet disclosed.
    claimRefs:
      - CR023
      - CR024
      - CR026
      - CR031
      - CR033
    tableRefs:
      - TR004
  - id: section-6
    title: Mitigations, monitoring, and kill criteria
    body: >-
      Mitigation maturity is low across most categories, but some levers exist. The strongest is the company’s capital
      base, which funds milestones and buys time, and strategic hardware backing partially mitigates compute-supply risk
      through preferential access. Beyond these, mitigations are largely undisclosed. For monitoring, the key indicators
      are benchmark progress, hiring and attrition, regulatory developments, and runway burn. We define explicit
      thesis-break triggers: a failure to demonstrate compounding self-improvement within the funded runway is the
      primary kill criterion; the loss of one or more core founders is a second; and a severe regulatory blocker, such
      as a frontier-model prohibition in a key market, is a third. The principal diligence asks follow directly: the
      company’s safety policy, governance structure, and regulatory-engagement plan; its burn and runway; and the
      founders’ commitment terms. Until these are addressed, the risk-adjusted view is that this is a binary,
      capital-at-risk research bet whose mitigations cannot yet be verified, which argues for staged, milestone-linked
      engagement rather than unconditional conviction.
    claimRefs:
      - CR027
      - CR028
      - CR029
      - CR030
      - CR032
      - CR039
    tableRefs:
      - TR005
