          - type: paragraph
            body: >-
              伙伴和依赖风险会放大运营图景。公司依赖的硬件投资人也投资竞争实验室，因此它的算力优势是共享的，不是独占的；资本提供方也高度集中，少数领投方对未来融资拥有显著杠杆。监管者扮演守门人，决策可能限制前沿模型工作。财务和模型侧，主导风险是高资金消耗与未披露现金跑道之间的张力，且没有收入缓冲；没有收入时，一次能力里程碑落空就可能触发艰难降价融资或清盘。毛利和信用风险目前尚不适用，但一旦尝试商业化就会变得相关；缺少审计账目本身，也是任何承销方都要面对的模型风险。竞争替代风险很高，因为在位者以大得多的规模追逐同一个自动化研究目标。主线很清楚：公司必须在现金跑道、人才或投资人耐心耗尽前，把资本转化为可融资或可产生收入的能力。
            claimRefs:
              - CR017
              - CR018
              - CR019
              - CR020
              - CR021
              - CR037
          - type: table
            tableRef: TR003
            claimRefs:
              - CR013
              - CR017
