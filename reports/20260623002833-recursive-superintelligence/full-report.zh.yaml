  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局
        blocks:
          - type: paragraph
            body: >-
              Recursive Superintelligence 进入的是一个拥挤且资本充足的领域，竞争分三条战线。第一条是少数直接研究同行，它们明确追逐超级智能，最典型的是 Ilya Sutskever 创立的 Safe
              Superintelligence，以及 Thinking Machines Lab 和与 Yann LeCun、David Silver 相关的研究努力。第二条是占主导地位的前沿既有玩家
              Anthropic、OpenAI 和 Google DeepMind，它们把当前最佳能力和成熟分发结合在一起。第三条是 Mistral、Aleph Alpha、Cohere
              等挑战者，它们分别从企业、开放权重和主权 AI 角度竞争。替代品还包括既有实验室已经运行的内部自动化研究流水线，这一点很重要，因为它意味着 Recursive
              的方法论假设并非其独有。未来可能进入者是更多资金充足的研究衍生公司，因为融资环境奖励精英团队成型。结构性结论是：在这个市场里，每个严肃竞争者要么已经大规模交付产品，要么像 SSI
              一样保持研究优先姿态且资金深厚；Recursive 则是商业化最不成熟的参与者。
