companyProfile:
  summary: >-
    Recursive Superintelligence 是一家在英格兰和威尔士注册的前沿 AI 研究实验室（公司编号 16937077，注册日期为 2025 年 12 月 31
    日），在伦敦和旧金山设有办公室。公司的核心假设是，通向超级智能最快的路径，是让 AI 借助开放式算法递归改进自身；初始重点放在自动化 AI 研究流程本身。五位创始人 Richard Socher（CEO，前 Salesforce
    首席科学家）、Tim Rocktäschel（前 Google DeepMind、UCL 教授）、Jeff Clune（UBC 教授、开放式研究先驱）、Josh Tobin（前 OpenAI、Cresta 联合创始人）和 Tim
    Shi（前 OpenAI、Delphi 联合创始人）把前沿研究信誉和公司搭建经验罕见地叠在一起。公司在 2026 年 4–5 月披露首轮融资，以 $4.65B 估值融得 $650M，由 GV 和 Greycroft
    领投，NVIDIA 和 AMD Ventures 参投。截至本次报告日期，Recursive 已发布首批技术结果，在三个 AI 研究基准上达到当前最佳水平，并开源了相关工件；但公司尚无商业产品、无收入，也没有公开客户牵引。
