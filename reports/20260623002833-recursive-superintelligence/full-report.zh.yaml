              - CV006
              - CV037
      - number: '8.3'
        title: 估值语境和进入纪律
        blocks:
          - type: paragraph
            body: >-
              当前估值语境是：据报道，GV 和 Greycroft 领投的 Series A 融资 $650 million，估值 $4.65 billion，NVIDIA 和 AMD 参投。不过 Financial
              Times 最初报道的是较小的 $500 million 轮次、$4 billion 投前估值；我们标出这一差异，并以更晚、由多方印证的交割信息为准。Crunchbase 和 MarketScreener
              佐证了作为估值锚的融资事件，英国备案确认了实体。进入纪律至关重要：价格内嵌英雄假设，却没有下行现金流保护；公开证据也不能从基本面支撑 $4.65 billion，只能从可选性支撑，正如 Otherworlds
              AI 把这笔交易概括为押注“会自我修复的 AI”。优先权和稀释悬顶无法量化，因为股权结构表和优先权结构不公开，这本身就是谨慎理由。这个估值与 2026 年其他由人才驱动、尚无产品的 AI
              融资轮内部一致，但和泡沫化同业集合一致，不等于有基本面理由。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV026
              - CV031
              - CV032
      - number: '8.4'
        title: 牛、基准和熊情景
        blocks:
          - type: paragraph
            body: >-
              三个情景最好用方向描述，而不是给出虚假的精度。牛市情景下，方法形成复利，公司达到 Level 1 自主训练系统，并成为前沿领导者；若如此，奖品会非常大，OpenAI 和 DeepMind
              的规模已经说明这一点。基准情景下，公司继续做出可信研究，并仅凭进展继续融资，但短期没有商业突破；价值得以守住，却没有台阶式跃迁。Aleph Alpha 和 Mistral
              说明，即便没有前沿领导地位，企业牵引路径也能支撑价值。熊市情景下，自我改进无法复利，导致降价融资或清盘；基准测试停滞和人才流失是预警信号。由于估值建立在可选性上，市场实际上正在为达到前沿领导者级别结果的有意义概率定价；核心尽调任务，就是用可复现证据检验这个隐含概率。结果分布足够宽，回报倍数可能从接近全损到数倍入场价。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV027
              - CV034
              - CV035
              - CV036
