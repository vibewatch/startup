  productSummary: >-
    截至本次报告日期，公司尚无商业化部署产品。公司正在开发一套自我改进的 AI 研究系统，自动化完整 AI 研究闭环：提出想法、实现代码、运行实验、验证结果，并用学到的内容指导下一轮循环。2026 年 6
    月发布的首批结果显示，公司在三个基准（NanoChat Autoresearch、NanoGPT Speedrun、SOL-ExecBench）上达到当前最佳水平。公司计划推出「Level 1」自主训练系统；公开发布目标为 2026
    年中。
