              方法。每一轮都会提出、实现、执行、验证并学习；而这个闭环从根本上受算力约束，因为每次迭代都要运行消耗大量 GPU 资源的实验。这让 NVIDIA 和 AMD
              的硬件支持成为实验吞吐的关键依赖，也解释了公司的高资本密集度。因此，运营模型是三类稀缺投入的紧耦合：创始人的算法方法、大规模算力，以及一组用于衡量进展的社区基准。除此之外的内部细节并未充分披露，所以这里总结的是架构，而非审计。尽调中最关键的架构问题是：学习闭环能否在多个循环之间产生复利式改进，还是只能在单个基准上取得一次性增益；只有前者才构成真正的递归自我改进。
