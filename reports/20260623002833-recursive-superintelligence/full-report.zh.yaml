        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              Recursive Superintelligence
              的风险画像，是一笔高信念、高方差的下注，风险排序也很清楚。最严重的是论题风险：递归自我改进可能永远无法成为可靠、可部署的能力，公开来源也没有量化技术成功概率。紧随其后的是估值风险，因为 $4.65 billion
              的价格假设了一个尚未被证明的成功，任何失望都会迅速压缩价值。关键人风险同样尖锐：公司由五位创始人驱动，其中多人从高级职位休假，决策权高度集中。监管、算力依赖和财务风险构成下一层。几乎所有类别里，缓释成熟度都很低，因为公司仍处早期，且很少披露控制措施。合起来看，下行是一旦论题失败，绝大部分投入资本可能损失；上行则依赖一个行业尚未证明的结果。真正定义这组风险投资意义的，不是某个运营瑕疵，而是这种不对称性。
