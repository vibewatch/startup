  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 论题与反论题
        blocks:
          - type: paragraph
            body: >-
              Recursive Superintelligence 的投资逻辑建立在一个强而集中的想法上：来自 Salesforce、OpenAI、Google DeepMind、UCL 和 UBC
              的异常强创始团队，加上真正新颖的自我改进方法，可能做出少数对手无法复制的大幅能力突破；强资本和战略算力在背后支撑。反论题同样清晰，而且按现有证据更站得住：递归自我改进尚未被证明是可部署、可商业化的能力，$4.65
              billion
              估值背后没有产品、收入或客户。最强正面信号是团队质量和第一批基准测试结果的具体性；最强负面信号是产品、收入、客户和独立验证全部缺位。因此，本案不是牛熊观点在中间相遇：它们描述的是两家公司，一家可能成为前沿领导者，另一家只是资金充足的研究实验，今天能看到的证据还无法区分它最终会是哪一种。
            claimRefs:
              - CV001
              - CV002
              - CV024
              - CV025
              - CV042
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV024
              - CV025
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV024
              - CV025
              - CV037
      - number: '8.2'
        title: 建议、信心和风险评级
        blocks:
          - type: paragraph
            body: >-
              我们的建议是继续研究并跟踪，而不是投入；先等待自我改进形成复利的证据，并按里程碑复盘，而非现在承销。任何估值结论的信心都低，因为输入仍处早期且主要是定性信息；风险评级高，反映这是一笔二元、资本承险的技术下注。目标回报今天无法量化；更合适的理解是，它是一张押注突破的风险投资看涨期权，收益分布极宽。按概率加权，这种分布最多只支持一个小型、分阶段仓位：仓位要能承受归零，同时保留论题被验证后跟投的选择权。这种姿态是刻意谨慎的，因为价格内嵌了没有下行现金流保护的英雄假设，而公司还没有拿出能把跟踪转化为信念的独立证据。该建议并非看空公司；它只是在说明，承销这个价格所需的证据尚不存在。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV019
              - CV030
              - CV037
