      - number: '2.4'
        title: 驱动因素、约束与矛盾信号
        blocks:
          - type: paragraph
            body: >-
              在前沿 AI 领域，增长驱动和采用约束紧紧缠在一起。驱动端，能力快速提升、充裕风险资本和战略硬件厂商支持都在加速市场。约束端，EU AI Act
              对通用目的模型和前沿模型提出义务，抬高合规成本；英国支持创新、基于原则的立场，则可能降低一家英国注册实验室的近期摩擦。Lawfare 的分析凸显了通用目的 AI
              规则将如何落地的真实不确定性，而这种模糊本身会拖慢受监管采用。资本密集度既是驱动也是壁垒，因为前沿研究需要的算力规模既把守入口，也奖励资金最充裕的玩家。对受监管买家而言，最硬的约束很可能是信任和可验证性：自我改进系统恰恰是最难验证和认证的技术类别。这些信号本来就相互矛盾，我们保留这种张力，而不是把它压成单一乐观或悲观的市场规模数字。
