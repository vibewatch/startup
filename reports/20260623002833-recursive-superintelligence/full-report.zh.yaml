          - type: callout
            title: 治理和安全缺口
            body: 一家自我改进 AI 实验室没有公开安全框架、没有采用治理基线，又面临不断上升的多司法辖区义务，因此监管和声誉风险更高。
            calloutType: risk
            claimRefs:
