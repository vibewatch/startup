            body: >-
              Recursive Superintelligence 是一家早期研究实验室，自称使命是借助开放式算法打造可递归自我改进的 AI。其英国实体 Recursive Superintelligence Ltd 于
              2025 年 12 月 31 日在英格兰和威尔士注册成立，公司编号 16937077，注册办公室位于伦敦 Myo King’s Cross，登记 SIC 代码为
              72190，即研究与实验开发。公司的隐私和条款页面还列出一个美国实体 Recursive Superintelligence,
              Inc.；公开报道则描述其总部在伦敦，并在旧金山设点。截至本次报告，公司仍处于收入前阶段，没有商业化部署产品，也未披露付费客户。其公开身份由官方备案、公司材料和融资报道共同支撑：这些材料足以确认公司的法律存在和研究实验室定位，但经核验员工数等经营指标仍不完整。一句话概括：这是一家追求自我改进
              AI 的前沿研究实验室，而不是已有收入的产品公司。
