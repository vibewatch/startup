            body: >-
              监管和法律敞口重大且跨多司法辖区。欧盟《AI Act》已编入 Regulation (EU)
              2024/1689，对通用和前沿模型施加义务，推高合规和测试成本；自我改进系统正是监管者最可能严格监督的类别。在美国，2023 年 Executive Order
              引入了前沿模型的算力阈值和安全测试预期；Seoul Summit 的前沿 AI
              安全承诺也设定了公司将被期待遵守的自愿义务。英国鼓励创新的立场降低了近期本土摩擦，但不能让公司豁免欧盟或美国规则；这些制度彼此分化，公司扩张后持续合规开销会更高。与此相对，公司没有公开的安全、评估或事件响应框架，也没有采用
              NIST AI Risk Management Framework 这类公认治理基线，这是明显的治理缺口。目前没有诉讼或执法行动，但英国—美国双实体结构增加了 IP 归属和公司间安排的法律复杂度，需要审查。
