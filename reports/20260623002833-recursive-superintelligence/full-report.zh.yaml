  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              Recursive Superintelligence 所处的是前沿 AI 研究市场，价值单位是通用能力，而不是打包应用。由于公司尚无已发布产品，划定边界必须谨慎：其核心范围是自动化 AI
              研究和前沿模型能力，相邻方向可能扩展到企业 AI 平台和智能体工具，长期则指向通用智能服务。最相关的现状替代品，是人类主导的机器学习研究，以及 OpenAI、Anthropic、Google DeepMind
              等既有实验室内部的研究流水线；这些机构已经在推进自动化实验。不纳入边界的是通用 SaaS 自动化和非 AI
              研发，它们争夺的预算和人才不同。由于针对这家公司的需求仍处于潜在状态，边界只能来自分析，而不是收入反推；公司一旦发布可映射到明确买家和支出的产品，就应重新审视该边界。这样的框架能让后续市场测算诚实地区分哪些现在可以货币化、哪些还不能。
