              运营上，公司最重要的敞口是算力供应，因为实验吞吐量以及研究进展，都取决于能否继续从 NVIDIA 和 AMD 获得
              GPU。算力集中在少数硬件厂商手中，即便这些厂商也是投资人，也会形成供应商依赖风险。自动化实验的可靠性和质量控制没有文件披露，这个运营风险缺口比通常更重要，因为系统设计目标就是在有限人工监督下跑实验。公开材料同样看不到安全和事件响应能力；对一个自我改进系统来说，这是高严重度缺口，而不是装饰性问题。开源产物带来的安全敞口相对较低，但并非为零。这些运营风险对一家尚无产品的研究实验室并不罕见，但组合在一起——重度依赖算力，加上未披露安全和质量控制——意味着公开证据无法验证公司能否安全、连续地运转核心研究引擎，技术尽调应把它列为重点。
