      - number: '8.5'
        title: 可比公司集合
        blocks:
          - type: paragraph
            body: >-
              没有公开可比公司能提供干净的收入或折现现金流基础，因此估值只能建立在风险投资可选性上，最好与其他“人才 + 论题”融资轮对标，而不是与收入倍数对标。最相关的可比项是 Safe
              Superintelligence：它同样是一家研究优先实验室，在产品前阶段以高估值融资，说明市场愿意仅凭精英团队和论题出资。Anthropic 和 OpenAI
              等前沿在位者估值高得多，但已有收入和产品，因此更适合作为奖品上界参照，而非直接可比。Mistral 和 Cohere
              等欧洲挑战者则提供中段可比，它们有真实商业牵引，展示了另一条企业驱动的价值路径。我们刻意不声称精确同业估值，因为这些数据并非统一公开；可比集合是示意性、抽样性的，不是穷尽性的。诚实结论是，Recursive
              的价格只在 2026 年“人才驱动、产品前 AI 融资轮”这个特定群体内可辩护，无法与任何基本面倍数对齐。
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV017
              - CV033
              - CV039
              - CV040
          - type: table
            tableRef: TV004
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV035
              - CV036
      - number: '8.6'
        title: 退出准备度、触发器和最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              退出准备度低。任何流动性事件最可能来自被更大实验室收购，或未来由能力驱动的上调估值融资；公开信息无法证明这类事件的概率或时点。持续跟踪需要明确的论题破裂触发器：在已融资现金跑道内无法显示自我改进形成复利，是首要技术触发器；一位或多位核心创始人离开，是人员触发器；关键市场禁止前沿或自我改进模型，是监管触发器；在可融资里程碑前耗尽现金跑道，是财务触发器。任何从跟踪转向承销之前，最终尽调必须拿到股权结构表和优先权结构、资金消耗和现金跑道及运营计划、经过规模验证的可复现基准测试、安全和治理框架，以及创始人的投入条款。总体结论是：这是一个高方差、由可选性驱动的机会，值得有纪律地跟踪并绑定里程碑复评，而不是现在就形成信念；在核心论题获得独立验证前，仓位应保持很小。
            claimRefs:
              - CV018
              - CV020
              - CV021
              - CV022
              - CV023
              - CV028
              - CV029
              - CV038
              - CV041
          - type: table
            tableRef: TV005
            claimRefs:
              - CV020
              - CV021
              - CV022
              - CV034
          - type: table
            tableRef: TV006
            claimRefs:
              - CV009
              - CV023
              - CV039
              - CV040
      - number: '8.7'
        title: 附录
        blocks:
          - type: callout
            title: 跟踪，但暂不承销
            body: 继续研究并按里程碑跟踪复评；在自我改进复利获得独立验证前，任何仓位都应保持很小。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV030
              - CV037
          - type: callout
            title: 押注突破的风险投资看涨期权
            body: $4.65B 的价格只有可选性能解释；结果分布从接近全损到前沿领导者倍数都有可能。
            calloutType: insight
            claimRefs:
              - CV010
              - CV019
              - CV027
