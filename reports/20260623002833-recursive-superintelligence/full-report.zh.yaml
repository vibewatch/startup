              - CR032
      - number: '7.7'
        title: 附录
        blocks:
          - type: callout
            title: 二元、资本承险的论题
            body: 如果递归自我改进无法在已融资现金跑道内形成复利，最可能的结果是降价融资或清盘，并损失大部分资本。
            calloutType: risk
            claimRefs:
              - CR001
