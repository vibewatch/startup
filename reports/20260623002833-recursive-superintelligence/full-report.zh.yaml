      - number: '5.2'
        title: 模块图与用例
        blocks:
          - type: paragraph
            body: >-
              系统可拆为五个已展示模块：想法提出器、实现器、实验运行器、验证器和学习闭环；路线图上还包括计划中的 Level 1 自主训练系统。当前用例都在内部：自动化 ML 研究实验，并击败社区基准。具体结果提供了锚点。在
              NanoChat Autoresearch 基准上，公司报告达到 0.9109 bits-per-byte，社区最佳为 0.9372；在 NanoGPT Speedrun 上，公司报告用 77.5 秒达到
              3.28 验证损失目标，社区为 79.7 秒；在 SOL-ExecBench 上，公司报告平均 SOL 分数 0.754，对比 0.699，并称这是将距离最优的差距缩小 18%。这些基准来自 Karpathy 的
              autoresearch、nanochat 和 nanoGPT 等社区基线，学术 LLM-speedrunning 基准和 Meta 的 speedrunner
              仓库提供独立背景。增益真实，但幅度增量、领域狭窄；外部或商业用例仍停留在未来式，而非已交付。
