      - number: '2.2'
        title: 受证据约束的市场测算
        blocks:
          - type: paragraph
            body: >-
              用美元为这个机会定规模异常困难，因为公司没有收入、定价或客户；单一 TAM 数字会误导。因此我们采用多重视角。广义 AI
              软件和服务市场每年可能达到数千亿美元，但分析师估计分歧很大，所以我们把该数字视作低置信度背景，而非目标市场。更窄的可服务市场聚焦前沿模型开发和自动化 AI
              研究，规模小得多，且集中在少数实验室和超大规模云厂商手中。Recursive 近期可获取市场今天实际为零。最清晰的量化信号是融资代理：公司在产品前拿到约 $650M，这更多说明投资人信念，而非已实现需求。UK
              AISI 观察到某些领域能力大约每八个月翻倍，Economist 的智能爆炸论也支持一个快速增长但高度不确定的需求环境。诚实结论是：公司特定的市场规模仍是开放问题。
