              - CR040
      - number: '7.5'
        title: 人员、执行和声誉风险
        blocks:
          - type: paragraph
            body: >-
              公司结构和阶段推高了人员与执行风险。关键人依赖很高，因为公司围绕五位创始人搭建，控制权集中；其中多人仍与原学术或产业机构保持关联，引发精力分散和长期投入的问题。人才留存风险也偏高，因为创始人与员工在行业内都很抢手，而组织尚未证明自己能作为一家公司执行和扩张，而不只是依赖个体研究者。声誉和安全叙事风险同样有分量：任何以超级智能为品牌核心的公司都会吸引审视，Economist
              关于社会可能尚未准备好迎接智能爆炸的警告，又加重了这种审视。FrontierBeat、Startup Fortune 和 Otherworlds AI
              的负面报道本身就是值得跟踪的风险信号，因为持续怀疑会影响招聘、伙伴关系和未来融资。这些风险很难只靠资本缓释，取决于公司尚未披露的治理和领导层选择。
            claimRefs:
              - CR023
              - CR024
              - CR026
              - CR031
              - CR033
          - type: table
            tableRef: TR004
            claimRefs:
              - CR003
              - CR023
              - CR024
              - CR031
      - number: '7.6'
        title: 缓释、监控和终止标准
        blocks:
          - type: paragraph
            body: >-
              多数风险类别的缓释成熟度都很低，但仍有一些抓手。最强的是公司的资本基础，它能资助里程碑、买来时间；战略硬件投资人支持也通过优先获取机会，部分缓释算力供应风险。除此之外，缓释措施大多未披露。监控上，关键指标是基准测试进展、招聘与流失、监管动态以及现金跑道消耗。我们定义明确的论题破裂触发器：在已融资现金跑道内无法证明自我改进能够复利，是首要终止标准；失去一位或多位核心创始人是第二项；关键市场出现前沿模型禁令等严重监管阻断，是第三项。主要尽调问题也由此直接推出：公司的安全政策、治理结构和监管沟通计划；资金消耗与现金跑道；以及创始人的投入条款。在这些问题解决前，经风险调整后的判断是：这是一笔二元、资本承险的研究下注，缓释尚无法验证，因此更适合分阶段、绑定里程碑地接触，而不是无条件相信。
            claimRefs:
              - CR027
              - CR028
              - CR029
              - CR030
              - CR032
              - CR039
          - type: table
            tableRef: TR005
            claimRefs:
              - CR028
              - CR029
