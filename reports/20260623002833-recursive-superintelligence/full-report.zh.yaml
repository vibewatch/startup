  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              按公司自己的描述，Recursive Superintelligence 的产品是一套自动化 AI
              研究系统：提出研究想法，把想法实现为代码，运行相应实验，验证结果，并把学习结果喂入下一轮循环。放到客户工作流里看，它自动化的是机器学习研究闭环本身，而不是服务终端用户的应用；公司将其框定为迈向基于开放式算法的递归自我改进
              AI
              的一步。价值主张在原则上杠杆很高，因为自动化研究可能让能力提升复利化；但这一点尚未验证，系统目前仍是研究流水线，不是外部客户可以买来或集成的产品。公司没有描述部署、集成路径、服务级别协议或支持模式，这与产品前实验室一致。诚实框架是：公司展示了一个内部研究引擎，并发布了其早期表现证据；它还不是面向客户的产品，后续整个产品表面都取决于这个闭环能否成熟为可部署能力。
