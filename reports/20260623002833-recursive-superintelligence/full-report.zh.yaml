      - number: '2.3'
        title: 细分、买家与采用路径
        blocks:
          - type: paragraph
            body: >-
              需求侧有四类买家值得关注。前沿企业的预算掌握在 CTO 和 CIO 职能手中；当能力和信任门槛达标后，它们可能在中期采用自我改进 AI。政府和公共部门 AI 项目是第二类；英国 AI Opportunities
              Action Plan 释放了具体公共需求和算力投资信号，可能打开受监管渠道。AI
              开发者和研究者是最容易先触达的人群，这与公司开源基准工件、播种社区兴趣的做法一致。最后，超大规模云厂商和硬件厂商已经以投资人身份参与，而非客户；NVIDIA 和 AMD
              参投反映的是战略算力协同。采用路径从研究和社区兴趣开始，经过能力验证，再到试点和最终商业部署；公司目前只处在漏斗最早期。关键是，这里的预算归属和采用周期都是估计，因为没有披露合同、试点或付费部署。
