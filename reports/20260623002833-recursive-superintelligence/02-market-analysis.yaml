company:
  name: Recursive Superintelligence
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Recursive Superintelligence targets the frontier AI research market, where capability rather than a product is the
    unit of value. Company-specific sizing is evidence-constrained: there is no revenue or customer demand to measure,
    so capital raised, fast capability growth, and regulated public-sector demand serve as imperfect proxies, against EU
    compliance and trust constraints.
sections:
  - id: section-1
    title: Market boundary and substitutes
    body: >-
      Recursive Superintelligence sits in the frontier AI research market, where the unit of value is general capability
      rather than a packaged application. Drawing the boundary requires care because the company has no shipping
      product: its core scope is automated AI research and frontier-model capability, with adjacent expansion possible
      into enterprise AI platforms and agentic tooling, and longer-term ambitions toward general-intelligence services.
      The most relevant status-quo substitutes are human-led machine-learning research and the internal research
      pipelines of incumbent labs such as OpenAI, Anthropic and Google DeepMind, all of which already pursue automated
      experimentation. Excluded from the boundary are generic SaaS automation and non-AI research and development, which
      do not compete for the same budgets or talent. Because demand for this specific company is still latent, the
      boundary is necessarily analytical rather than revenue-derived, and it should be revisited once the company ships
      a product that can be mapped to identifiable buyers and spend. This framing keeps later sizing honest about what
      is and is not currently monetisable.
    claimRefs:
      - CM001
      - CM002
      - CM005
      - CM010
      - CM030
    tableRefs:
      - TM001
  - id: section-2
    title: Evidence-constrained sizing
    body: >-
      Sizing this opportunity in dollars is unusually difficult because the company has no revenue, pricing, or
      customers, so a single TAM figure would be misleading. We therefore use multiple lenses. The broad AI software and
      services market is plausibly in the hundreds of billions of dollars annually, but analyst estimates diverge
      widely, so we treat that figure as low-confidence context rather than a target. A narrower serviceable market
      focused on frontier model development and automated AI research is far smaller and concentrated among a handful of
      labs and hyperscalers. The near-term obtainable market for Recursive is effectively zero today. The clearest
      quantitative signal is the capital-raised proxy: the company secured roughly $650 million pre-product, which says
      more about investor conviction than realised demand. The UK AISI’s observation that capabilities are doubling
      roughly every eight months in some domains, and the Economist’s intelligence-explosion thesis, support a
      fast-growing but highly uncertain demand environment. The honest conclusion is that company-specific sizing
      remains an open question.
    claimRefs:
      - CM003
      - CM004
      - CM006
      - CM007
      - CM008
      - CM009
      - CM021
      - CM022
      - CM023
      - CM031
    tableRefs:
      - TM002
    figureRefs:
      - FM001
      - FM002
  - id: section-3
    title: Segments, buyers, and adoption path
    body: >-
      On the demand side, four buyer segments matter. Frontier enterprises, whose budgets sit with CTO and CIO
      functions, would adopt self-improving AI on a medium-term horizon once capability and trust thresholds are met.
      Governments and public-sector AI programmes are a second segment, and the UK’s AI Opportunities Action Plan
      signals concrete public demand and compute investment that could open a regulated channel. AI developers and
      researchers are the most immediately reachable group, which is consistent with the company open-sourcing benchmark
      artifacts to seed community interest. Finally, hyperscalers and hardware vendors are already engaged as investors
      rather than customers, with NVIDIA and AMD participation reflecting strategic compute alignment. The adoption path
      runs from research and community interest, through capability validation, to pilots and eventual commercial
      deployment, and the company is only at the earliest stage of that funnel. Crucially, budget ownership and adoption
      horizons here are estimates, because no contracts, pilots, or paid deployments are disclosed.
    claimRefs:
      - CM010
      - CM011
      - CM012
      - CM024
      - CM026
      - CM027
      - CM032
      - CM033
      - CM034
    tableRefs:
      - TM003
    figureRefs:
      - FM003
      - FM004
  - id: section-4
    title: Drivers, constraints, and contradictory signals
    body: >-
      Growth drivers and adoption constraints are tightly coupled in frontier AI. On the driver side, rapid capability
      improvement, abundant venture capital, and strategic hardware-vendor backing all accelerate the market. On the
      constraint side, the EU AI Act introduces general-purpose and frontier-model obligations that raise compliance
      costs, while the UK’s pro-innovation, principles-based stance may lower near-term friction for a UK-incorporated
      lab. Lawfare’s analysis underscores genuine uncertainty about how general-purpose AI rules will be applied, an
      ambiguity that itself slows regulated adoption. Capital intensity acts as both a driver and a barrier, because the
      compute scale required to do frontier research simultaneously gates entry and rewards the best-funded players. The
      binding constraint for regulated buyers is likely to be trust and verifiability: self-improving systems are
      precisely the class of technology that is hardest to validate and certify. These signals are contradictory by
      design, and we preserve that tension rather than resolving it into a single optimistic or pessimistic sizing
      number.
    claimRefs:
      - CM013
      - CM014
      - CM015
      - CM016
      - CM017
      - CM018
      - CM019
      - CM025
      - CM029
      - CM035
      - CM036
    tableRefs:
      - TM004
