  topStrengths:
    - 创始团队履历顶尖，把前沿研究（DeepMind、OpenAI）和公司搭建经验（Salesforce、you.com、Cresta）放在一起，在同阶段实验室里背景密度最高的一档
    - 投资人组合很强（GV、Greycroft、NVIDIA、AMD Ventures），既提供资本（$650M），也可能带来优先硬件和合作入口
    - 已发布首批技术结果，在三个 AI 研究基准上达到 state-of-the-art，并开源相关 artifact，显示早期执行力
    - 相比纯扩展路线，开放式探索和 AI-Generating Algorithms 路线可能形成差异化；创始人在这一领域是全球公认的领军者
    - 英国 / 美国双重架构和伦敦学术网络（UCL、Turing Institute）可能在当前前沿 AI 环境下带来监管弹性和人才优势
  topRisks:
    - 核心投资逻辑（递归式自我改进）尚未在可靠商业环境中经过长时间证明，技术风险接近二元
    - 一家产品和收入都没有的公司估值 $4.65B，普通进展几乎没有安全垫；技术突破一旦推迟，就可能触发估值重置
    - 五位创始人承载关键人物风险，且治理结构和继任计划未披露；任一创始人离开都可能构成重大影响
    - 前沿 AI 监管正在快速收紧（EU AI Act GPAI 规则、英国 AISI 监督、美国 EO 门槛），可能限制训练算力扩张
    - 没有商业产品或客户牵引，整条收入和利润率路径都还停留在假设中；现金跑道和烧钱速度也未披露
    - 竞争对手包括 Anthropic、OpenAI、DeepMind 等资本充足的实验室，它们也在投入自动化 AI 研究管线
