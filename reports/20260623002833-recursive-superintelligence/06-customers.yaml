company:
  name: Recursive Superintelligence
chapter:
  number: 6
  title: Customers
  summary: >-
    Recursive Superintelligence has no named customers, pilots, usage metrics, or retention data; it is pre-product. The
    only customer-adjacent evidence is open-source community access to its artifacts and strategic-investor
    relationships. The founders’ track record of building widely used products is the strongest available predictor of
    future customer acquisition, but present customer proof is absent.
sections:
  - id: section-1
    title: Customer base and segmentation
    body: >-
      Recursive Superintelligence has no named production customers and no disclosed paying users, so a conventional
      customer-segmentation analysis is not possible. The honest description is that the company has no customer base.
      The closest analog today is the open-source and research community that can access the company’s published
      artifacts on GitHub, which is the primary channel through which external parties engage with its work. Strategic
      investors NVIDIA and AMD function as backers rather than customers, providing capital and compute rather than
      commercial usage. There is no segmentation by geography, vertical, company size, or revenue band because there is
      nothing to segment. Looking forward, the eventual buyer set is likely to mirror broader frontier-AI demand,
      enterprises, governments, and developers, with the open-source release positioning developers as the most
      reachable near-term proxy. But all of this is prospective. This chapter is therefore necessarily dominated by the
      absence of customer evidence, and we treat community access and investor relationships as proxies rather than as
      customer proof.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU023
      - CU027
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: section-2
    title: Adoption trajectory
    body: >-
      With no product launched, adoption can only be measured by research-community interest in the open-sourced
      benchmarks, not by deployments, accounts, locations, or utilisation. There are zero paying customers and zero
      production deployments. The one new and concrete adoption-relevant event is the release of the open-source
      artifacts alongside the first technical results, which gives developers something to access and inspect, and the
      company’s X account and research posts are the channels through which it cultivates that interest. Any uptick in
      community or developer engagement is a soft, unquantified proxy rather than a hard metric, and no public source
      provides repeat-usage or active-user figures. Should the product launch in mid-2026 as reported, early developer
      adoption would become the first measurable customer signal, but until then the adoption trajectory is effectively
      flat on every commercial axis. The appropriate diligence posture is to track GitHub engagement and any future
      product analytics rather than to infer demand from the financing event.
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU019
      - CU024
      - CU031
      - CU035
    tableRefs:
      - TU002
    figureRefs:
      - FU002
  - id: section-3
    title: Named customer proof and references
    body: >-
      There is no named customer proof, whether production or pilot, in public sources, and consequently no
      testimonials, case studies, or customer logos. Reference quality is effectively nil. The only customer-adjacent
      evidence is a sample of proxies: the open-source community that can use the artifacts, and the strategic investors
      who provide capital and compute. Neither constitutes a deployment or a paying relationship, and we label them as
      such. What partially offsets this absence is the founders’ track record of attracting real users at scale in prior
      ventures, Richard Socher’s you.com and earlier enterprise AI work, his association with AI used at large consumer
      platforms, and Josh Tobin’s prior company serving large enterprises. These histories are the strongest predictor
      of future customer-acquisition ability, but they are predictors, not present proof. Demand verification will
      require pilots with named design partners, which do not yet exist publicly. The named-customer-proof table
      therefore documents proxies under an explicit sample scope rather than asserting any customer relationship the
      evidence does not support.
    claimRefs:
      - CU009
      - CU010
      - CU017
      - CU018
      - CU026
      - CU029
      - CU030
      - CU032
    tableRefs:
      - TU003
    figureRefs:
      - FU003
  - id: section-4
    title: Retention, durability, and credibility
    body: >-
      Retention and durability metrics, net revenue retention, gross retention, churn, renewal, cohort behaviour, and
      satisfaction, do not exist because there are no contracts or customers to measure, and no customer satisfaction or
      cohort data is available to assess durability. This is not a sign of poor retention; it is the absence of the
      precondition for retention. What the company does have is credibility capital. Tim Rocktäschel’s UCL profile and
      inaugural lecture evidence deep research standing in open-endedness, Jeff Clune’s Vector Institute affiliation
      reinforces research-community credibility, and Richard Socher’s prior products demonstrate an ability to convert
      technical work into widely used products. This credibility creates a talent and trust pipeline that could
      accelerate future customer adoption once a product exists. For diligence, retention is simply deferred: it cannot
      be evaluated until customers exist, and the right step is to revisit durability after the first cohorts of users
      or design partners are in place rather than to manufacture metrics now.
    claimRefs:
      - CU011
      - CU014
      - CU015
      - CU016
      - CU022
      - CU036
    tableRefs:
      - TU004
  - id: section-5
    title: Expansion, concentration, and the evidence gap
    body: >-
      Expansion dynamics such as land-and-expand cannot be evaluated absent any initial customer, and top-customer
      revenue concentration is nil because there is no revenue. The concentration risk that does exist sits on the
      capital side, in the form of a small lead-investor group, rather than on the customer side, and channel or partner
      dependence is minimal beyond the compute relationships with NVIDIA and AMD. There is no procurement or contracting
      evidence to assess go-to-market friction. The single largest customer-side risk is plainly that no demand
      materialises before the company’s capital is exhausted, a risk the adverse coverage emphasises in characterising
      the company as idea-stage. The defining feature of this chapter is that it is dominated by evidence gaps rather
      than evidence, which is the correct reflection of a pre-product lab. We document the proxies honestly, decline to
      invent customer metrics, and carry the absence of named customers, pilots, usage data, and retention as the
      binding diligence asks that must be resolved before any customer-based underwrite is possible.
    claimRefs:
      - CU012
      - CU013
      - CU021
      - CU025
      - CU028
      - CU033
      - CU034
    tableRefs:
      - TU005
      - TU006
