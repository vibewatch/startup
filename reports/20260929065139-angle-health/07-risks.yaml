  evidenceGaps:
    - type: "enumeration-incomplete"
      severity: "blocking"
      topic: "regulatory-legal-risk-register"
      missingEvidence: "Current legal-entity-by-state licenses, product approvals, market-conduct findings, regulator correspondence, litigation, and enforcement records."
      whyItMatters: "The company-reported 47-state footprint and combined carrier, TPA, and MGU roles cannot be risk-ranked conclusively without primary regulator and court evidence."
      diligencePath: "Obtain the legal-entity and license schedule, then verify each material state directly with Departments of Insurance and search federal and state court dockets."
      relatedQuestionRefs:
        - "QR002"
      relatedTableRefs:
        - "TR001"
    - type: "missing-source"
      severity: "material"
      topic: "security-and-incidents"
      missingEvidence: "Independent security audits, privacy assessments, outage history, breach records, complaint trends, model-validation reports, and incident postmortems."
      whyItMatters: "The disclosed data and integration footprint creates material operational exposure, but absence of a retained incident record is not proof that incidents did not occur."
      diligencePath: "Request SOC and penetration-test reports, security and privacy assessments, regulator notices, outage logs, model-risk records, and customer complaint data."
      relatedQuestionRefs:
        - "QR005"
      relatedTableRefs:
        - "TR002"
    - type: "stale"
      severity: "material"
      topic: "reinsurance-and-stop-loss"
      missingEvidence: "Current reinsurer identity and ratings, executed reinsurance and stop-loss contracts, attachment points, exclusions, collateral, aggregate limits, and renewal terms."
      whyItMatters: "The only retained reinsurance evidence is a company statement from 2022, which cannot establish protection available in 2026."
      diligencePath: "Inspect current executed treaties and policies, independently confirm counterparty ratings, and reconcile coverage to claims, reserves, products, and states."
      relatedQuestionRefs:
        - "QR003"
      relatedTableRefs:
        - "TR001"
        - "TR002"
        - "TR003"
    - type: "private-evidence-only"
      severity: "material"
      topic: "capital-and-loss-performance"
      missingEvidence: "Financing close documents, funded primary cash, tender settlement, debt terms, audited financials, statutory capital, reserves, and medical-loss performance."
      whyItMatters: "Funding announced is not cash available, and reported profitability does not establish cash generation, reserve sufficiency, or sustainable underwriting economics."
      diligencePath: "Reconcile bank and closing records to the post-close cap table and review audited statements, statutory filings, debt schedules, reserves, and cohort loss triangles."
      relatedQuestionRefs:
        - "QR006"
        - "QR007"
      relatedTableRefs:
        - "TR003"
    - type: "private-evidence-only"
      severity: "material"
      topic: "customer-and-channel-concentration"
      missingEvidence: "Employer, broker, network, geography, premium, claims, renewal, and margin concentration distributions on comparable cohorts."
      whyItMatters: "Employer count and a company-reported renewal rate do not show whether revenue, risk, or distribution depends on a small number of counterparties."
      diligencePath: "Request top-10 and top-25 concentration schedules, broker attribution, cohort retention, renewal pricing, claims concentration, and contribution margin by segment."
      relatedQuestionRefs:
        - "QR008"
        - "QR009"
        - "QR010"
      relatedTableRefs:
        - "TR003"
