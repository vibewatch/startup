    title: "Only One-Third of the Headline Package Was Identified as Primary Financing"
    body: "The September 2026 announcement separates $200 million of Series C financing from a $400 million tender offer. The full $600 million should not be treated as cash available to the company, and the assigned sources do not disclose final closing, fees, tender participation, or net proceeds."
    claimRefs:
      - "CO009"
      - "CO010"
  - calloutType: "risk"
    title: "Reported Performance Still Requires Primary Financial Validation"
    body: "Angle reports 120% year-over-year growth and four consecutive quarters of EBITDA and GAAP net-income profitability. An independent commentary source says its own cited evidence is not an independent third-party audit of Angle's underwriting model; diligence should therefore obtain audited financials and cohort-level underwriting evidence rather than generalizing from the announcement."
    claimRefs:
      - "CO014"
      - "CO016"
