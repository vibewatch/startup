company:
  name: "Angle Health"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Angle Health is a San Francisco-based health benefits provider founded in 2019 by former Palantir engineers Ty Wang and Anirban Gangopadhyay. On September 18, 2026, the company announced a $600 million package at a $2.7 billion valuation, but only $200 million was identified as primary Series C financing; the other $400 million was a tender offer, and the announcement said closing was expected later that month."
sections:
  - id: "corporate-identity-and-foundational-model"
    title: "Identity and Operating Model"
    body: "Independent company profiles report that Angle Health was founded in 2019 and is headquartered in San Francisco. Its 2022 release identifies co-founders Ty Wang as chief executive and Anirban Gangopadhyay as chief technology officer, both formerly engineers at Palantir. Angle's current website describes level-funded employer health plans, firm quoting from a member census, and a full-stack platform connecting data, partners, plan customization, administration, and member support. A 2026 company announcement says plans can serve employers with as few as two employees, subject to state variation. These product and minimum-group-size statements are company claims, not independent performance validation."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO005"
      - "CO007"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance"
    title: "Leadership and Governance Visibility"
    body: "The assigned evidence consistently identifies Ty Wang as co-founder and CEO and Anirban Gangopadhyay as co-founder and CTO. It supports their former Palantir engineering backgrounds, but it does not establish their detailed functional remits, the current broader executive roster, board membership, investor voting rights, succession coverage, or the degree of operational dependence on either founder. Financing announcements identify major investors, yet capital participation does not by itself prove a board seat or control right. The leadership table is therefore deliberately partial: it records only supported roles and backgrounds, while treating governance structure and key-person concentration as diligence questions rather than findings."
    claimRefs:
      - "CO003"
      - "CO008"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-scale-milestones"
    title: "Capitalization and Reported Scale"
    body: "Angle announced a $600 million equity package at a $2.7 billion valuation on September 18, 2026: $200 million of Series C financing and a $400 million tender offer, with closing expected later that month. The full headline amount is therefore neither revenue nor balance-sheet cash. Earlier disclosed events include a $4 million seed round in 2020, a $58 million Series A in 2022, and a $134 million Series B mix of debt and equity in 2025. The company also reports more than 5,000 employers, availability in 47 states, nearly $1 billion in annualized premium-equivalents, 120% year-over-year growth, and four consecutive quarters of EBITDA and GAAP net-income profitability. Annualized premium-equivalents are not revenue, and the assigned pool contains no audited financial statements."
    claimRefs:
      - "CO004"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    tableRefs:
      - "TO003"
  - id: "milestones-and-evidence-boundaries"
    title: "Milestones and Evidence Boundaries"
    body: "The milestone record shows a rapid progression from 2019 formation through Y Combinator and seed financing in 2020, commercial launch in 2021, Series A in 2022, Series B in 2025, and the announced Series C and tender package in 2026. The chronology is strongest for dated financing announcements and weaker for governance, employee count, and audited operating performance. One independent commentary explicitly says its evidence is not an independent third-party audit of the underwriting model; that caveat cannot be generalized into proof that no audit exists. Likewise, the adverse search returned no assigned result, which is a coverage gap rather than evidence that no legal, regulatory, outage, or complaint history exists."
    claimRefs:
      - "CO004"
      - "CO006"
      - "CO009"
      - "CO010"
      - "CO013"
      - "CO016"
    figureRefs:
      - "FO001"
