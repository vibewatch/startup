  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "retention-and-churn"
      missingEvidence: "Audited employer account Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and annual logo churn percentages across historical cohorts."
      whyItMatters: "Without audited retention and churn data, institutional investors cannot evaluate whether customer growth is durable or offset by SMB business failure and plan shopping."
      diligencePath: "Request historical cohort retention bridges and broker-level renewal summaries under confidentiality in financial diligence."
      relatedQuestionRefs:
        - "QU005"
    - id: "gap-customer-concentration"
      type: "private-evidence-only"
      severity: "material"
      topic: "customer-concentration"
      missingEvidence: "Breakdown of covered lives and premium volume by top 10 employer accounts and top brokerage general agencies."
      whyItMatters: "High concentration among specific broker partners or regional employers would create severe revenue vulnerability if a major agency defected."
      diligencePath: "Review client concentration schedule and top producer revenue contribution agreements."
      relatedQuestionRefs:
        - "QU007"
    - id: "gap-clinical-outcomes"
      type: "missing-source"
      severity: "minor"
      topic: "clinical-outcomes"
      missingEvidence: "Independent third-party clinical outcomes evaluations or peer-reviewed health risk reduction metrics across Angle Health members."
      whyItMatters: "Clinical efficacy and cost containment claims are critical to long-term employer ROI and self-funded risk underwriting durability."
      diligencePath: "Obtain independent actuarial claims studies and validated healthcare utilization analyses."
