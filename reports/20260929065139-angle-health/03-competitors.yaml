    title: Competitive solution archetypes and public evidence
    columns: [Alternative, Category, Public scale or funding, Target segment, Differentiation in assigned evidence, Limitation]
    rows:
      - ["Angle Health", "Integrated level-funded health plan", ">3,000 employers in 44 states reported in Dec. 2025; Sep. 2026 press-list item names $600M raise at $2.7B valuation", "Small and midsize employers; broader group sizes are company-claimed", "Unified quoting, administration, medical, pharmacy, and care navigation", "No public comparative renewal, claims-cost, or win-rate benchmark"]
      - ["Traditional fully insured carrier", "Incumbent carrier", "Unknown in assigned pool", "Employer-sponsored groups", "Established carrier alternative; no named-carrier comparison retained", "Capabilities, price, and service performance not evidenced here"]
      - ["Broker-assembled level-funded arrangement", "Broker-driven platform or plan stack", "Unknown in assigned pool", "Employers seeking plan flexibility", "Broker can combine underwriting, administration, networks, and vendors", "Integration quality and economics not evidenced here"]
      - ["Digital-only health-plan player", "Emerging digital alternative", "Unknown in assigned pool", "Digitally oriented employers and members", "Digital experience is the category proposition", "No named peer or feature benchmark in assigned evidence"]
      - ["Standalone TPA/MGU plus point solutions", "Multi-vendor substitute", "Unknown in assigned pool", "Self-funded or level-funded employers", "Potential modularity across administration and care vendors", "More handoffs are plausible, but comparative burden is not measured"]
      - ["Internal employer administration/status quo", "Do-it-yourself substitute", "Not applicable", "Employers retaining existing carrier and HR workflows", "Avoids immediate migration", "Internal workload and switching economics are not quantified"]
    notes: >-
      Angle metrics are reported or company-claimed as stated; alternative-category rows are a
      non-exhaustive procurement map, and unknown cells reflect missing assigned evidence.
    claimRefs: [CP006, CP007, CP008, CP012, CP013]
  - id: TP002
    title: Capability and trust matrix
    columns: [Buying criterion, Angle Health, Traditional carrier, Broker-assembled stack, Internal/status quo]
    rows:
      - ["Quote speed and certainty", "Company claims firm level-funded quotes in minutes, valid 90 days with limited adjustment criteria", "Unknown in assigned pool", "Unknown in assigned pool", "Unknown; depends on current process"]
      - ["Administration integration", "Company claims 100+ payroll, HRIS, and benefits-administration integrations", "Unknown in assigned pool", "Unknown in assigned pool", "Existing internal workflow; interoperability unknown"]
      - ["Medical, pharmacy, and navigation", "Company claims one unified benefit experience", "Unknown in assigned pool", "May be assembled across vendors; performance unknown", "Depends on retained carrier and vendors"]
      - ["Network reach", "Company claims access to national PPO networks", "Unknown in assigned pool", "Unknown in assigned pool", "Depends on current carrier"]
      - ["Organizational integration", "Company says it combines carrier, TPA, MGU, and navigation roles", "Unknown in assigned pool", "Roles may remain separate; exact architecture unknown", "Employer coordinates retained parties"]
      - ["Trust and risk transfer", "2022 company release reported policies reinsured by an A+ rated insurer", "Unknown in assigned pool", "Unknown in assigned pool", "Depends on retained plan and counterparties"]
    notes: >-
      This matrix records only capabilities present in the assigned source pool; unknown does not
      mean absent, and Angle entries are company claims rather than independent performance tests.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP015]
  - id: TP003
    title: Pricing and packaging evidence
    columns: [Alternative, Public price or unit, Contract model, Included capabilities, Discount or unknowns, Competitive implication]
    rows:
      - ["Angle Health", "Not disclosed in assigned pool", "Level-funded; company also historically reported fully insured and self-funded products", "Medical, pharmacy, care navigation, administration, and virtual-care elements are company-claimed", "Realized premium, fees, risk corridors, and renewal terms unknown", "Workflow breadth is visible, but price-value superiority is unproven"]
      - ["Traditional fully insured carrier", "Not available in assigned pool", "Fully insured archetype", "Not benchmarked", "Rates, commissions, and renewal terms unknown", "Cannot compare total cost from public evidence retained here"]
      - ["Broker/TPA multi-vendor arrangement", "Not available in assigned pool", "Potential level-funded or self-funded structure; exact terms unknown", "Component capabilities depend on selected vendors", "Administrative and vendor fees unknown", "Modularity may compete with integration, but economics are unmeasured"]
      - ["Internal/status quo", "No discrete public price", "Existing employer process", "Existing carrier and internal administration", "Migration cost and internal labor are unknown", "Avoided switching may offset inferior workflow until ROI is demonstrated"]
    notes: >-
      No retained source supplies comparable list or realized pricing. Contract categories are
      descriptive, and every economic comparison requires quote-, fee-, and renewal-level diligence.
    claimRefs: [CP002, CP006, CP016]
figures:
  - id: FP001
    title: Evidence-constrained competitive positioning
    type: quadrant
    summary: >-
      Ordinal positioning highlights Angle's claimed integration and broker enablement while
      separating evidence availability from independently verified performance.
    data:
      points:
        - {label: "Angle Health", x: 5, y: 5, detail: "High claimed workflow integration and high visible broker enablement; outcomes not independently benchmarked."}
        - {label: "Traditional fully insured carrier", x: 2, y: 3, detail: "Illustrative archetype; assigned evidence does not support a named-carrier score."}
        - {label: "Broker-assembled level-funded plan", x: 3, y: 5, detail: "Channel alignment may be high, while integration depends on the assembled stack."}
        - {label: "Digital-only health-plan player", x: 4, y: 2, detail: "Digital proposition may be strong; broker enablement is unknown in the assigned pool."}
        - {label: "Standalone TPA/MGU stack", x: 2, y: 4, detail: "Broker configurability may be meaningful, but role integration is not established."}
        - {label: "Internal/status quo", x: 1, y: 1, detail: "Low modeled integration change and low new-channel enablement; retained-process economics are unknown."}
      xAxis: "Workflow integration (analyst ordinal score, 1-5)"
      yAxis: "Broker enablement (analyst ordinal score, 1-5)"
    approximationNotes: >-
      Scores are directional analyst judgments from category descriptions and Angle's company-issued
      claims, not a measured benchmark; non-Angle positions should be replaced with named-peer data.
    claimRefs: [CP009, CP014]
callouts:
  - calloutType: risk
    title: Comparative economics are still unproven
    body: >-
      Funding and product breadth do not establish lower total cost or better renewals. Request
      matched quotes, renewal cohorts, claims-cost trends, broker concentration, and named win/loss
      evidence before underwriting a durable moat.
    claimRefs: [CP010, CP014, CP016]
