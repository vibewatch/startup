callouts:
  - calloutType: "insight"
    title: "Premium-Equivalents Mask Operating Software Economics"
    body: "Angle Health's top-line milestone of nearly $1 billion in annualized premium-equivalents highlights tremendous commercial reach across 5,000 employers. Underwriters must recognize that level-funded premium-equivalents represent the total medical expenditure under management, not Angle's net software or fee income. With historical 2024 revenue estimated at $44.2 million, Angle's net revenue take-rate is estimated at 5% to 10% of managed premiums, consisting of administrative PEPM fees and MGU underwriting spreads."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI008"
  - calloutType: "risk"
    title: "Secondary Tender Valuation Discount Signals Private Pricing Tension"
    body: "While Angle Health established a $2.7 billion post-money primary valuation in its September 2026 Series C round, the Wall Street Journal reported that the accompanying $400 million secondary tender offer priced near $2.5 billion. This 7.4% discount between primary equity and secondary liquidity illustrates pricing friction in late-stage private markets and indicates that institutional diligence should evaluate capital structure preferences, liquidation rights, and secondary terms closely."
    claimRefs:
      - "CI010"
      - "CI013"
      - "CI014"
      - "CI016"
