        - label: 系统集成与参保资格运营
          values:
            - Unknown
            - 高
            - 已披露 100+ 项集成；内控未经证实
            - label: 高
              tone: warning
        - label: 融资完成度与可用资金
          values:
            - Unknown
            - 高
            - 预期交割及已披露的 $200M 新股融资
            - label: 中高
              tone: warning
        - label: 雇主与渠道集中度
          values:
