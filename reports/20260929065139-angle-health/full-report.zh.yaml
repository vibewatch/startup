  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、测算视角与目标支出
        blocks:
          - type: paragraph
            body: >-
              全美雇主赞助的商业健康险生态每年支出超过 $1.2 trillion，为私营企业逾 155 million 人提供医疗保障。在这一宏观总量中，Angle Health
              将业务重心锁定在中小企业（SMB），该群体雇佣了约 62 million 名美国人。历史上，500 人以下企业的商业健康保障一直被传统险企（业内统称 BUCA：Blue Cross Blue Shield
              各实体、UnitedHealth Group、Cigna 和 Aetna/CVS
              Health）发行的全额投保团体重大医疗计划所主导。在传统全额投保模式下，雇主按月向传统险企支付固定的人均保费，虽转移了整体承保风险，却放弃了理赔明细可见度，且在医疗利用率较低的年份无法获得资金结余返还。相比之下，财富
              500 强企业长期依据《员工退休收入保障法案》（ERISA）采取员工福利自保机制，借助定制方案设计、第三方管理（TPA）及止损再保险规避承保加价与管理开支。Angle Health 则围绕中段的
              level-funded 保险架构划定核心目标市场，将具备 ERISA 架构的自保机制下沉至参保人数在 10 到 500
              人的雇主群体。在该架构下，客户雇主每月支付可预期的固定款项，拆分为理赔管理费、综合止损保费与精算隔离的理赔基金账户，未消耗的理赔结余会在保单续期时返还。Angle 明确将个人 ACA
              交易市场计划、Medicare Advantage 以及直接面向政府的 Medicaid 经办业务排除在直营业务之外，全面聚焦 44 个持牌州的商业团体雇主福利。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM008
