            body: >-
              Angle Health 的核心技术差异化优势之一，是其与 AI 工程公司 Azumo 联合研发的端到端自动化 RFP-to-quote
              管线。外部经纪人的咨询与方案征集（RFP）通常以非结构化邮件形式送达，附带格式杂乱的员工花名册表格与冗长的多页方案附件。该平台基于 Zendesk 工单通知自动抓取完整对话链与附件，将邮件原始文本与文档片段分发给
              OpenAI GPT 模型提取参数。附件分类层将花名册文件路由至专用的 Python
              标准化微服务，对杂乱的表格布局、表头和员工职级做规范化清洗。系统随后生成医疗方案与定价的结构化报价对象，使核保团队在正式审批承保并导出报价单 PDF 之前，将以往耗时 45 分钟的手工录入转变为仅需 5
              分钟的人机协同复核流程。
