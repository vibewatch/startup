        - id: employer-contribution
          label: 雇主每月固定出资
          detail: level-funded 方案下按每位员工每月支付的固定费用
        - id: claims-fund
          label: 雇主理赔资金账户
          detail: 专项隔离资金，用于支付停损起赔点（亦称自留额）以下的员工医疗理赔
        - id: stop-loss-premium
          label: 停损再保险保费
          detail: 划转至评级为 A+ 的再保险保司，提供重疾巨灾风险保障
        - id: angle-platform-fees
          label: Angle Health 行政管理与核保抽成
          detail: TPA 管理费（PEPM）、MGU 利差及技术平台使用费
        - id: retained-ebitda
          label: Angle Health EBITDA 与净利润率
          detail: 扣除健康导医服务与技术研发支出后的经营净利率
        - id: surplus-rebate
          label: 未动用理赔资金结余
          detail: 返还给雇主企业或抵扣次年续保费用
      edges:
        - from: employer-contribution
          to: claims-fund
        - from: employer-contribution
          to: stop-loss-premium
        - from: employer-contribution
          to: angle-platform-fees
        - from: claims-fund
          to: surplus-rebate
        - from: angle-platform-fees
          to: retained-ebitda
    approximationNotes: 流向图展示 level-funded 健康险保费的标准结构化切分；具体百分比分配取决于各雇主群体的风险特征。
