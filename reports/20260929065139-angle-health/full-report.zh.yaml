      - number: '4.2'
        title: 成本结构、毛利与再保险架构
        blocks:
          - type: paragraph
            body: >-
              Angle Health 的毛利率走势受制于其兼具软件基础设施公司与保险风险聚合商的双重属性。针对全额投保产品，Angle 借助获 A.M. Best 与 Standard & Poor's 给予 A+
              财务实力评级的商业再保险伙伴来支撑保单，将灾难性尾部风险移出资产负债表，同时保留一手承保敞口。针对其占据主导地位的 level-funded
              产品线，止损保险承保商负责承担超出个人特定止损免赔额或综合自留额阈值的理赔款项，保护 Angle 和雇主免受尾部理赔波动的冲击。其成本结构包括 Access+ 就医导航员等临床运营支出、研发与工程薪酬（例如年薪在
              $140,000 至 $240,000 之间的后端工程师）、经纪人分销佣金以及日常管理费用。Angle 称其在 EBITDA 与 GAAP
              净利润上连续四个季度盈利，在同等业务规模的风投支持型保险科技同行中实属少见。然而，由于未公开披露医疗赔付率（MLR）、净佣金留存率及止损费率分成，机构投资人尚无法证实该盈利究竟来自核心承保结余，还是纯粹受益于理赔确认的时间差。
