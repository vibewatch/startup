  - id: TV002
    title: 投资逻辑与反向逻辑
    columns:
      - 立场
      - 核心论点
      - 支撑证据
      - 转向条件
    rows:
      - - 投资逻辑
        - 一体化运营模式有望化解小微雇主健康险业务摩擦
        - Angle 称其将保司、MGU 与 TPA 三重职能整合于单一平台，支持快速配置保障方案
        - 若出现系统交付延误、经纪人采纳度低或权责割裂，则该逻辑被推翻
      - - 投资逻辑
        - 披露的业务体量与增速支撑高估值溢价
        - 据披露，公司业务覆盖 47 个州的 5,000 多家雇主群体，年化等效保费近 $1B，同比增速达 120%
        - 须调阅经审计的营业收入、保费、客户留存、理赔及客群队列明细（亦称赔付明细）以核实验证
      - - 反向逻辑
        - 调阅证据中缺少经独立审计的经营数据支撑
        - 盈利与续保口径仅出自既有投资方陈述，或基于公司声明的媒体报道
        - 若有经审计财务报告及对齐各项指标的法定监管申报文件，可减轻该顾虑
      - - 反向逻辑
        - 缺乏反映独立流动性的市场证据
        - Forge 数据显示交易极不活跃，未见公开撮合成交价
        - 独立公允融资轮次完成交割及出现可观察的老股二级交易，将强化价格发现基础
    notes: 表内公司与投资方言论均已注明出处；本表未将各自主张视作独立核实验证，亦未将等效保费等同于营业收入。
