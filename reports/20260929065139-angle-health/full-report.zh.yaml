              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 退出就绪度、尽调诉求与逻辑证伪触发点
        blocks:
          - type: paragraph
            body: >-
              现有公开记录不足以证明公司已做好退出准备。Forge
              报道称市场交易活跃度有限且未提供可用价格，而最新一轮交易名义价值中有三分之二用于要约收购，而非公司获得的新增资本。在评估入场前，尽调应调取已签署的融资文件、股权结构表、优先股堆叠、要约收购参与情况、新增现金到账额、经审计的收入与利润调节表、法定保险资本、历年赔损进展、留存队列、客户集中度以及按计划年度划分的续保表现。若交易未能交割、审计结果无法证实所报道的增长与盈利能力、续保涨幅大幅超出报道区间，抑或赔损与资本要求吃掉增长资金，则该投资逻辑应当证伪。若无上述记录，目标回报率、持有期限或可信的退出估值均无从谈起。
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 价格敏感性结论
            body: 对公司保持观察；在考虑以所公布的 $2.7 billion 估值或相近价位入场之前，须完成融资、财务、法定资本以及股权结构表尽调。
            calloutType: recommendation
            claimRefs:
              - CV001
