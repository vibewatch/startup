  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 核心风险
      - 概率信号
    rows:
      - - 乐观情景
        - 披露的增长与盈利能力经审计确认；续保率保持平稳；新股募集资金加速渠道分发扩张
        - 估值存在站上 $2.7B 标杆的可能，但无公开区间或目标回报率可供支撑
        - 核保质量恶化、资金链承压及执行复杂度提升
        - 经营报道偏正面，但缺乏充分的独立财务凭据
      - - 基准情景
        - 交易按公布条款大体完成交割，披露的运营指标大体得以维持
        - $2.7B 仅作为融资参考基准，并非独立的公允价值判断结论
        - 清算优先权积压、股权稀释及业务增速放缓
        - 当前最可靠的价格信号，具体仍取决于交割情况与条款尽调结果
      - - 悲观情景
        - 增长或盈利出现逆转、续保率恶化，或本轮融资未能完成交割
        - 估值大幅回调至早前一级市场参考价属合理可能；$682M 仅反映历史背景，并非预测值
        - 赔付损失敞口扩大、资本金要求提高、流动性疲软及下调轮次（down-round）风险
        - Forge 交易极不活跃，且缺乏经审计的公开财务数据
    notes: 鉴于调阅证据缺少经审计财务报表、股权及清算优先权条款、对标企业组合以及针对特定入场价的回报模型，上述情景均为定性分析，不隐含发生概率或精确预测区间。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV006
      - CV012
      - CV013
      - CV014
      - CV015
