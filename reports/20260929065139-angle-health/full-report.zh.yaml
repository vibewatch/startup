      - number: '7.4'
        title: 合作伙伴、资本、财务与客户依赖
        blocks:
          - type: paragraph
            body: >-
              交易对手与资本层面的证据需严谨审视其基数口径。公司 2022 年的一份新闻稿称，Angle 的保单由一家未具名且获 A.M. Best 和 S&P 评为 A+
              的险企提供再保险，但这并不能证明当前的承保商、再保合约、止损自留点、保障期限或续约条款。同样，2026 年 9 月公布的融资头条数字并不等同于公司可支配的现金：宣布的 $600 million 交易中包含了
              $200 million 的 Series C 融资与 $400 million 的要约收购，且 HIT Consultant 指出仅有 $200 million
              的新股注资进入了资产负债表。公司新闻稿称该交易预计当月晚些时候交割，截至尽调基准日交割完成情况仍待核实。自述的规模与连续四个季度的盈利记录固然令人鼓舞，但无法替代经审计的现金、资本准备金、医疗赔付表现、债务条款、雇主集中度或对手方层面的风险敞口。这些非公开记录才能决定其业务扩张究竟是在分散风险还是在放大风险。
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR008
