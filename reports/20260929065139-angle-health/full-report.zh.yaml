              名员工的中小企业（SMB）。这类企业在传统商业险企面前历来面临严重的成本劣势与方案僵化。在这一细分市场中，雇主作为主要买家与最终方案发起人，在合同约定的止损自留额阈值内承担平准型方案（通称
