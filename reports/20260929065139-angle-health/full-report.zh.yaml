      - number: '7.5'
        title: 重点图表
        blocks:
          - type: callout
            title: 头条融资金额不等于可支配现金
            body: >-
              公布的 $600 million 交易中包含了 $400 million 的要约收购与 $200 million 的 Series C
              轮融资。仅应将有据可查、资金到账的新股收益计为资产负债表资本，在更新现金跑道或储备金结论之前，必须先行核实交割状态、资金受限情况、负债及资金用途。
            calloutType: risk
            claimRefs:
              - CR013
              - CR014
              - CR015
          - type: callout
            title: 监控指标与终止投资标准
            body: >-
              若尽调发现以下情形，应升级风险或暂停投资：核心牌照遭遇实质性限制；无法证明当前再保险或止损保障依然有效；经审计的赔付与准备金数据与自述盈利相矛盾；可比客群续保率低于公司公布的 80%
              以上基准；或公布的融资未按披露条款完成交割。
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR011
              - CR013
              - CR015
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与价格约束
        blocks:
          - type: paragraph
            body: >-
              在公布的 $2.7 billion 估值水平下，投资建议为继续研究而非买入。该定价属于真实的交易信号，而非分析师预估：Wall Street Journal、HLTH 以及现有投资方 Blumberg
              Capital 均报道了基于该估值水平的 $600 million 融资。然而，资金构成至关重要。仅有 $200 million 被定性为注入 Angle Health 的 Series C 投资，而其余
              $400 million 属于为既有投资方与员工提供流动性的要约收购。Wall Street Journal 亦指出该交易预计在 9
              月下旬完成交割，因此在缺乏正式交割确认之前，公布的估值不能直接视作已落地的资产负债表事实。基于此，当前评定风险为高、置信度为中：该估值数字虽得到多方佐证，但该价格下的可投资性尚未得到证明。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
