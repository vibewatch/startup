      - number: '6.4'
        title: 留存韧性、增购模型与集中度风险
        blocks:
          - type: paragraph
            body: >-
              评估 Angle Health 的长期商业韧性，会发现其在续保留存与客户集中度上面临严重的尽调疑点。由于 Angle
              主要通过第三方福利经纪人分销健康计划，公司无法完全掌控客户的续保决定；一旦止损自留额（通称止损线）费率上升或理赔情况恶化，独立顾问往往每年都会在市场上为雇主重新比价寻源。虽然 Angle
              在初次入职健康调查后，借助开放专项临床项目、直通基础医疗导航及药品成本管理工具来拉动增购与扩张，但公司从未公布经过验证的净收入留存率（NRR）、总收入留存率（GRR）或年度客户流失率。此外，Angle
              的客户集中度未予披露，目前无法查明大型中端市场经纪代理机构或跨州雇主客户是否占据了过高的参保人份额。叠加小企业对价格极其敏感以及传统综合险企在续保时激进打折等不利市场环境，未经核实的留存数据成为机构持续投资判断中的关键焦点。
            claimRefs:
              - CU003
              - CU005
              - CU013
              - CU015
              - CU016
      - number: '6.5'
        title: 重点图表
        blocks:
          - type: callout
            title: 经纪人中介主导客户切换节奏
            body: >-
              Angle Health
              的商业落地依赖于独立福利经纪人，他们是中小企业雇主的最终受托人与把关方。尽管自动报价与数字化入职降低了经纪人的行政负担，但只要止损理赔数据发生波动（通称赔付经验波动），年度方案续保就极易引发重新寻源换险。
            calloutType: insight
            claimRefs:
              - CU003
              - CU005
              - CU013
          - type: callout
            title: 缺乏经审计的客群留存与赔付指标
            body: 尽管自述快速增长至 5,000 多家雇主客户并在四个季度内实现 GAAP 净利为正，Angle Health 却未披露经审计的净收入留存率、总收入留存率或分客群流失数据，其续保韧性尚未得到独立审计机构的验证。
            calloutType: risk
            claimRefs:
              - CU008
              - CU011
              - CU016
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险定级排序与逻辑证伪条件
        blocks:
          - type: paragraph
            body: >-
              最高的残留风险敞口在于监管范围、承保与理赔表现，以及再保险的连续性。Angle 自述兼具承保机构、第三方管理（TPA）和总核保代理（MGU）职责，而 2026 年 9 月的公开材料报道其方案覆盖 47 个州及
              5,000
              多个雇主团体。尽管指定证据并未证实发生过违规、宕机或监管执法事件，但如此广泛的展业面放大了内部控制失效的影响。因此，在缺乏可观测发生频率或独立事故记录的维度上，热力图将发生概率标为“未知”。投资跟踪应将以下情况视为投资逻辑证伪的信号：关键牌照受到实质性限制、无法出具有效的当前止损或再保险保障凭证、可比客群续保率跌破公司自述的
              80% 以上基准，或无法证实公布的融资已正式交割。风险严重性等级基于已披露的运营版图与依赖结构进行排序，并不代表负面事件已经发生。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR011
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR010
              - CR013
              - CR015
      - number: '7.2'
        title: 监管、法律与模型治理风险敞口
        blocks:
          - type: paragraph
            body: >-
              监管风险具有结构性，因为公司称单一平台集成了承保商、TPA 与 MGU 职能，且第三方报道转述了公司自述的 47
              州展业能力。调取的证据库中未包含各州监管牌照证书、监管记录、法院案卷、市场行为检查报告，亦无独立的隐私与模型审计，因此无法核实哪些法人实体持有相应资质及其当前资质状态。此外，level-funded
              方案让雇主在止损上限内承担理赔风险，这使具体合同条款、自留额触发点及实际风险承担主体成为尽调关键。Angle
              称其模型使用了数百万份去标识化的患者记录与多类健康数据，但该表述不能证明其已符合隐私合规、模型验证、算法公平性或安全控制要求。当前的当务之急是梳理一份与保费规模挂钩的各州法人牌照分布图，随后核验最新的监管往来函件、客户投诉、诉讼记录、隐私评估与模型治理归档。
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR010
      - number: '7.3'
        title: 运营、质量与安全风险敞口
        blocks:
          - type: paragraph
            body: >-
              Angle 披露的运营模式高度依赖自动化与数据。公司称经纪人无需个人健康调查即可在几分钟内获取确定性承保报价，其承保模型采用去标识化的临床与理赔数据，且平台与 100 多个薪酬、HRIS
              和福利管理系统对接。其常见问题解答（FAQ）还记录了面向 First Health、Cigna 和 MPCN
              参保人的不同预先授权路径。这些功能虽能减少行政摩擦，却在参保资格数据流、定价、理赔路由、事前授权、数据隐私以及供应商可用性等方面带来了失效风险点。指定证据中未见任何服务等级协议（SLA）履约记录、安全审计、模型性能研究、理赔准确率指标或事故日志。因此，在尽调通过一手数据核实系统可用率、对账差错率、模型漂移、赔付率、授权周转时间、投诉趋势以及经检验的灾备恢复流程之前，仅凭产品介绍，残留风险敞口依然处于高位。
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR006
              - CR007
