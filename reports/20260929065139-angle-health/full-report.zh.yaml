      - number: '8.2'
        title: 投资逻辑、反向逻辑与证据质量
        blocks:
          - type: paragraph
            body: >-
              投资逻辑在于，Angle 建立了一套垂直整合的保险与管理运营模式，且展现出规模化迹象。公司宣传材料展示了涵盖承保商、总核保代理与第三方管理职责的全栈平台、level-funded 方案、快速方案配置以及 100
              多项软件系统对接。HLTH 报道其在 47 个州服务 5,000 多个雇主团体；Blumberg 则披露其年化等效保费近 $1 billion、同比增长 120%、在 EBITDA 与 GAAP
              净利润口径下连续四个季度盈利，且续保涨幅保持在 5% 到 7%。反向逻辑在于，最亮眼的经营数据均出自融资参与方或转述公司自述材料的媒体，并非来自经审计的监管申报文件。此外，Forge
              平台上的非公开市场交易活跃度较低且缺乏可撮合的成交价格，削弱了对该估值水平的独立流动性支撑。
            claimRefs:
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: 避免虚假精度的情景推演
        blocks:
          - type: paragraph
            body: >-
              公开证据仅能支持方向性的情景推演，无法给出赋予概率权重的精确估值区间。乐观情景要求自述的增长与盈利经得起财务尽调核验、续保表现得以延续，且新增新股资金在加速渠道分销的同时不牺牲承保质量。基准情景将 $2.7
              billion 视为当前的融资信号，但在交割确认、优先股条款、持股比例及审计结果明朗之前，暂不对投资回报做出定论。悲观情景考虑到一旦增长、盈利或续保数据转弱，估值可能大幅回调至此前非公开轮次的水平。Forge
              上记录的 $682 million Series B
              投后估值仅为历史参考，既非当前的公允价值，亦非下行底部预测。调取的证据中缺乏适用于模型测算的上巿公司或并购可比标的池，因此强行套用营收、保费或利润乘数将产生缺乏依据的虚假精度。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
