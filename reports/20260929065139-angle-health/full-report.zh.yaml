  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 一套有序决策链将运营证据与价格及交易风险明确区分。
    data:
      nodes:
        - id: scale
          label: 规模证据
          detail: 据报道，公司覆盖 47 个州、服务超过 5,000 家雇主团体，年化等效保费近 $1B。
        - id: operating-proof
          label: 运营验证
          detail: 据报 120% 同比增长、连续四个季度盈利以及 5%-7% 续约增幅中位数，仍待审计确认。
        - id: model
          label: 一体化模式
          detail: 承保航司、MGU、TPA、方案设计与软件集成共同构筑潜在运营杠杆。
        - id: price
          label: 价格信号
          detail: 公布的交易对 Angle 估值为 $2.7B，据称较此前 12 月估值标杆翻倍有余。
        - id: structure
          label: 交易架构与流动性
          detail: $200M 为新股，$400M 为要约收购；Forge 报告交易活跃度有限且无可用价格。
        - id: decision
          label: 继续研究
          detail: 在做出投资判断前，须核实交割进展、条款细节、审计后业务经济模型、资金需求及可比公司标杆。
    approximationNotes: 未暗示任何转化率、情景概率或定量估值桥梁。
