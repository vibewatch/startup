  - id: FR001
    title: 残留风险热力图
    type: matrix
    summary: 定性排序热力图；调阅的公开证据中未见事故发生频次记录，因此发生概率保持未知。
    data:
      columns:
        - 发生概率
        - 潜在影响
        - 缓解措施证据
        - 残留严重程度
      rows:
        - label: 监管角色与多州展业范围
          values:
            - Unknown
            - 严重
            - 仅见公司自述的角色定位与展业版图描述
            - label: 高
              tone: negative
        - label: 承保与理赔表现
          values:
