  - id: FE001
    title: Angle Health 全栈系统架构
    type: stack
    summary: 贯通分销渠道、AI 录入解析、核保微服务与 level-funded 风险转移的六层系统架构栈。
    data:
      layers:
        - label: 客户端与分销交互层
          detail: 会员移动端 App、雇主管理门户、经纪人报价工作流，以及 100+ 处薪酬 / HRIS API 接口集成。
        - label: 工单流转与数据录入层
          detail: 基于 Zendesk API 解析录入经纪人邮件、对话往来及非结构化文档附件。
        - label: AI 提取与标准化层
          detail: OpenAI GPT 参数提取链路结合专用 Python 微服务，对员工参保花名册（census）表格做标准化处理。
        - label: 核保与保障方案设计层
          detail: 团体自动定价测算、level-funded 福利保障方案定制，以及人机协同（human-in-the-loop）销售复核。
        - label: TPA 与医疗健康运营层
          detail: 理赔一体化处理（通称理赔处理）、参保资格管理、事前授权及 Access+ 医疗关怀团队导医服务。
        - label: 临床合作方与风险转移层
          detail: Doctor on Demand 远程医疗、区域医疗服务网络、专科转诊通道，以及 A+ 评级保司再保险保障。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE006
      - CE007
      - CE009
      - CE012
  - id: FU001
    title: Angle Health 客户全生命周期与中介拓展旅程
    type: journey-map
    summary: 梳理涵盖经纪人报价、雇主入驻开通、会员导医服务及年度保单续保全流程的客户触点图谱。
    data:
      items:
        - label: 经纪人触达与方案报价
          stage: 方案评估
          actor: 福利经纪人
          action: Submits group census to generate firm underwritten quote in minutes
          touchpoint: Angle Benefit Builder & Quote-to-Card Platform
          sentiment: Positive
        - label: 雇主签约与入驻接入
          stage: 签约获客
          actor: 雇主 HR / 管理员
          action: Selects level-funded plan and integrates with HRIS/payroll systems
          touchpoint: 100+ Payroll & HRIS API Connectors
          sentiment: Positive
        - label: 会员健康导医服务
          stage: 日常使用
          actor: 参保员工 / 家属
          action: Accesses digital ID cards, telehealth, and dedicated care team
          touchpoint: Angle Mobile App & Access+ Concierge
          sentiment: Positive
        - label: 临床健康风险识别
          stage: 健康管理
          actor: 临床运营团队
          action: Analyzes pharmacy trends, claims patterns, and health survey data
          touchpoint: Angle Health Underwriting Scorecard
          sentiment: Neutral
        - label: 保单年度续保
          stage: 留存 / 续保
          actor: 雇主与经纪人
          action: Evaluates stop-loss attachment rates, claims surplus, and premium shifts
          touchpoint: Annual Renewal Census & Stop-Loss Audit
          sentiment: Risk
        - label: 二次方案增购拓展
          stage: 增购拓展
          actor: 出资雇主
          action: Adds specialized programs including direct primary care or infusion therapy
          touchpoint: Partner Integrations (Leap Health, DPC)
          sentiment: Positive
    approximationNotes: 生命周期各阶段综合了记录在案的经纪人工作流、HRIS 入驻机制以及会员关怀管理触点。
