  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 营收模式、保费规模与变现机制
        blocks:
          - type: paragraph
            body: >-
              Angle Health 运行一套高度整合的医疗健康福利模式，兼具总核保代理（MGU）风险评估、第三方管理（TPA）理赔管理及全栈健康险业务运营。在 2026 年 9 月的股权融资披露中，公司称在 47 个州的
              5,000 多家雇主团体中管理近 $1 billion 的年化等效保费，较 2025 年 12 月的 3,000 家雇主进一步扩张。尽调必须严格将这 $1 billion
              的等效保费规模与公司报表确认的净营收区分开来。在 level-funded 团体福利架构下，雇主按月支付固定款项，并在合同上明确划分为三部分：第三方管理服务费、止损再保险保费以及雇主专属理赔账户。因此，Angle
              Health 赚取的是每月每员工（PEPM）的管理费收入以及潜在的 MGU 承保佣金，而非将全部等效保费计为确认收入。第三方行业监测机构估计 Angle Health 2024 年年度营收约为 $44.2
              million，但非公开的经审计财务报表仍未披露。
