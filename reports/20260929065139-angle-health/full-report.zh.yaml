      - number: '3.3'
        title: 资本规模与经纪人渠道拉大触达范围，但不代表经济模型已被验证
        blocks:
          - type: paragraph
            body: >-
              公开的规模指标持续走高。Becker's 曾报道，在完成包含股债混合的 $134 million Series B 轮融资后，公司业务覆盖 44 个州逾 3,000 家雇主客户，当时累计融资接近 $200
              million。Angle 随后披露的新闻材料显示，2026 年 9 月完成了一笔估值 $2.7 billion 的 $600 million
              融资，且一篇声誉有限的独立文章将该交易定性为股权融资。这些属于融资与展业版图指标，并不等同于营收、流动性或承保利润指标。分销策略明显以经纪人为主导：TipRanks 自动生成的一份 Angle
              自主宣传摘要重点提及了经纪人培训、定制方案网络研讨会以及渠道互动。这种策略能加速获客触达，但也意味着业务增长高度依赖中介机构的关注度以及可被验证的续保价值。
