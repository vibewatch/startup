  - id: FI001
    title: Angle Health Premium Dollar Allocation and Revenue Flow Architecture
    type: flow
    summary: >-
      Structural breakdown demonstrating how gross employer level-funded contributions bifurcate into claims reserves,
      reinsurance protection, and Angle platform fee capture.
    data:
      nodes:
        - id: employer-contribution
          label: Employer Monthly Fixed Contribution
          detail: Monthly payment per employee under level-funded plan
        - id: claims-fund
          label: Employer Claims Account
          detail: Segregated fund to pay employee medical claims up to stop-loss attachment
        - id: stop-loss-premium
          label: Stop-Loss Reinsurance Premium
          detail: Transferred to A+ rated reinsurance carriers for catastrophic coverage
        - id: angle-platform-fees
          label: Angle Health Administrative & Underwriting Capture
          detail: TPA administration fees (PEPM), MGU spread, and technology platform fees
        - id: retained-ebitda
          label: Angle Health EBITDA & Net Margin
          detail: Net operational margin after care navigation and engineering expenses
        - id: surplus-rebate
          label: Unused Claims Fund Surplus
          detail: Refunded to employer group or credited toward next year renewal
      edges:
        - from: employer-contribution
          to: claims-fund
        - from: employer-contribution
          to: stop-loss-premium
        - from: employer-contribution
          to: angle-platform-fees
        - from: claims-fund
          to: surplus-rebate
        - from: angle-platform-fees
          to: retained-ebitda
    approximationNotes: >-
      Flow illustrates standard structural division of level-funded healthcare premiums; exact percentage allocations
      vary by employer group risk profile.
