    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Reported growth and profitability are audited; renewals remain controlled; primary capital accelerates
          distribution
        - Value above the $2.7B mark is possible, but no public range or target return is supportable
        - Underwriting deterioration, capital strain, and execution complexity
        - Positive operating reports, but insufficient independent financial proof
      - - Base
        - Transaction closes near announced terms and reported operating metrics broadly hold
        - $2.7B is a financing reference, not a standalone fair-value conclusion
        - Preference overhang, dilution, and slower growth
        - Best current price signal, subject to closing and terms diligence
      - - Bear
        - Growth or profitability reverses, renewals worsen, or the financing does not close
        - >-
          Material reset toward the earlier private-round reference is plausible; $682M is historical context, not a
          forecast
        - Loss exposure, capital requirements, weak liquidity, and down-round risk
        - Limited Forge market activity and absence of audited public economics
    notes: >-
