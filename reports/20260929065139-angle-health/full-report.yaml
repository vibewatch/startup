              - CU003
              - CU004
              - CU013
              - CU015
      - number: '6.2'
        title: Adoption Trajectory, Geographic Coverage, and Scale Metrics
        blocks:
          - type: paragraph
            body: >-
              Angle Health's commercial adoption trajectory reflects rapid expansion across state jurisdictions and
              small-to-midsize employer accounts since its commercial launch in 2021. Following its Series A expansion
              into Arizona, Georgia, Indiana, Ohio, Missouri, and South Carolina, the company reported covering tens of
              thousands of members across its fully insured and self-funded product lines. By December 2025,
              corresponding with its $134 million Series B financing announcement, Angle reported serving more than
              3,000 employer groups across 44 states. By September 2026, the company's platform footprint expanded
              further to encompass over 5,000 employer groups across 47 states, managing nearly $1 billion in annualized
              premium-equivalents and delivering four consecutive quarters of GAAP net income profitability. Third-party
              industry trackers estimate Angle Health's 2024 annual revenue at approximately $44.2 million with a team
              of roughly 104 employees. However, diligence must note that annualized premium-equivalents represent gross
              underwritten health plan volume and stop-loss cash flows rather than recognized administrative fee
              revenue, and independent member census counts by state remain undisclosed.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
