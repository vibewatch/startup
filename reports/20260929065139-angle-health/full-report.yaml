        - High
        - Verify current counterparties, ratings, treaties, attachment points, collateral, exclusions, and renewal terms
      - - Provider networks and utilization management
        - First Health, Cigna, MPCN, MedWatch, and other care partners
        - Vendor shares and substitution rights are not disclosed
        - Network termination, authorization delay, denial errors, or service interruption
        - High
