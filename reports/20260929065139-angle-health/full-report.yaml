        title: Exhibits
        blocks:
          - type: callout
            title: Premium-Equivalents Mask Operating Software Economics
            body: >-
              Angle Health's top-line milestone of nearly $1 billion in annualized premium-equivalents highlights
              tremendous commercial reach across 5,000 employers. Underwriters must recognize that level-funded
              premium-equivalents represent the total medical expenditure under management, not Angle's net software or
              fee income. With historical 2024 revenue estimated at $44.2 million, Angle's net revenue take-rate is
              estimated at 5% to 10% of managed premiums, consisting of administrative PEPM fees and MGU underwriting
              spreads.
            calloutType: insight
            claimRefs:
