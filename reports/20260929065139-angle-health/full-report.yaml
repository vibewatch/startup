  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Suite and Employer Benefit Modules
        blocks:
          - type: paragraph
            body: >
              Angle Health delivers tech-enabled group health benefit plans tailored specifically for small and midsize
              businesses (SMBs) and technology startups across 44 states. The core commercial product is a level-funded
              health plan structure that provides employers with predictable monthly premium payments, integrated
              stop-loss protection, and potential surplus returns, avoiding the volatility of traditional self-funding
              while bypassing the rigidity of fully insured small-group community rating. Enrolled employees access
              their benefits through a mobile-first digital platform providing digital insurance cards, provider search
              directories, real-time claim status tracking, and 24/7 care team chat. For employer administrators, Angle
              provides an administrative dashboard featuring automated integrations across more than 100 payroll, HRIS,
              and benefits administration platforms, automating routine member onboarding, census changes, and
              eligibility maintenance.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE010
              - CE011
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE008
              - CE011
      - number: '5.2'
        title: Technical Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >
              Angle Health operates under a full-stack architectural model that brings together the traditionally
              fragmented responsibilities of health insurance carrier, Third Party Administrator (TPA), and Managing
              General Underwriter (MGU) onto a unified cloud infrastructure. Deploying core services primarily on Amazon
              Web Services using Python-based microservices, the company structures its platform to bridge customer
              engagement channels, data ingestion, and claims operations. Rather than contracting disparate
              administrative vendors, Angle manages plan customization, underwriting rules, and claims adjudication
              directly. Risk transfer is managed through structured stop-loss reinsurance agreements underwritten with
              an A+ rated reinsurance partner, protecting employer groups and Angle against catastrophic medical claims.
              Clinical care pathways and specialty provider networks are integrated directly into Angle's TPA claims and
              prior authorization workflows, establishing measurable cost controls and minimizing out-of-network claims
              leakage across regional markets.
