      - number: '4.3'
        title: Capital Adequacy, Liquidity, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              On September 18, 2026, Angle Health announced a $600 million equity financing package consisting of $200
              million in primary Series C equity capital and a $400 million secondary tender offer, establishing a
              headline primary valuation mark of $2.7 billion. Notably, secondary market reporting from the Wall Street
              Journal indicated that secondary tender shares priced near $2.5 billion, reflecting an approximate 7.4%
              discount to the primary Series C valuation headline. Led by Vitruvian Partners with participation from
              Town Hall Ventures, Blumberg Capital, Portage, PruVen Capital, and Y Combinator, this round expanded Angle
              Health's cumulative lifetime primary equity funding to approximately $334 million, following a $134
              million Series B in December 2025 and a $58 million Series A in January 2022. With $200 million in fresh
              primary equity proceeds alongside positive self-reported operating cash flows across four consecutive
              quarters, Angle exhibits substantial forward runway. Critical diligence blockers nevertheless persist:
              institutional investors must demand audited statutory insurance filings, capital reserve ratios, and
              secondary-versus-primary capitalization tables prior to underwriting.
            claimRefs:
              - CI001
              - CI005
