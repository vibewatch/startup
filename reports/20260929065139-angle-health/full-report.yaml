              While Angle Health established a $2.7 billion post-money primary valuation in its September 2026 Series C
              round, the Wall Street Journal reported that the accompanying $400 million secondary tender offer priced
              near $2.5 billion. This 7.4% discount between primary equity and secondary liquidity illustrates pricing
              friction in late-stage private markets and indicates that institutional diligence should evaluate capital
              structure preferences, liquidation rights, and secondary terms closely.
