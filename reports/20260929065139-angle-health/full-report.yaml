  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Sizing Lenses, and Addressable Spend
        blocks:
          - type: paragraph
            body: >-
              The broader employer-sponsored commercial health insurance ecosystem in the United States represents an
              addressable expenditure exceeding $1.2 trillion annually, providing medical coverage to over 155 million
              individuals across private enterprise. Within this macroeconomic aggregate, Angle Health intentionally
              cabins its operational focus to small and medium-sized businesses (SMBs), a segment employing
              approximately 62 million Americans. Historically, commercial health coverage for enterprises under 500
              employees has been dominated by fully insured group major medical plans issued by incumbent carriers,
              colloquially known as BUCA (Blue Cross Blue Shield entities, UnitedHealth Group, Cigna, and Aetna/CVS
              Health). In a traditional fully insured model, employers remit fixed monthly per-employee premiums to
              legacy carriers, transferring aggregate underwriting risk while forfeiting claims visibility and receiving
              no financial recoupment during years of low healthcare utilization. Conversely, Fortune 500 enterprises
              have long mitigated underwriting margins and administrative overhead by self-funding employee benefit
              programs under the Employee Retirement Income Security Act (ERISA), relying on customized plan design,
              third-party administration (TPA), and stop-loss reinsurance protections. Angle Health defines its core
              addressable boundary around the intermediate level-funded insurance architecture, bringing
              ERISA-structured self-funding mechanics down to employers with 10 to 500 enrolled lives. Under this
              structure, client employers make predictable monthly installments comprising claims administration,
              aggregate stop-loss insurance premiums, and an actuarially segregated claims funding account, with unused
              claims surplus refunded at policy renewal. Angle explicitly excludes individual ACA marketplace exchange
              plans, Medicare Advantage, and direct government Medicaid administration from its direct commercial scope,
              concentrating entirely on commercial group employer benefits across 44 licensed states.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM008
