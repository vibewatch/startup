        - Medium-high
        - Map members and claims by vendor; review SLAs, outages, denial appeals, termination rights, and backups
      - - Payroll, HRIS, and benefits-administration connectivity
        - More than 100 integrated systems
        - Traffic, failure rates, and largest-system dependence are not disclosed
        - Bad census or eligibility data interrupts enrollment, billing, cards, or claims
        - High
        - Company describes centralized administration in one platform
        - High
