      - number: '4.2'
        title: Cost Structure, Gross Margins, and Reinsurance Architecture
        blocks:
          - type: paragraph
            body: >-
              Angle Health's gross margin trajectory is governed by its operating hybridity between a software
              infrastructure company and an insurance risk aggregator. For fully insured products, Angle backs its
              policies through commercial reinsurance partners holding A+ financial strength ratings from A.M. Best and
              Standard & Poor's, transferring catastrophic tail risk off its balance sheet while retaining primary
              underwriting exposure. For its dominant level-funded product line, stop-loss insurance carriers absorb
              claims exceeding individual specific stop-loss deductibles or aggregate attachment corridors, shielding
              Angle and employers from tail claims volatility. The cost structure consists of clinical operations
              including Access+ care navigators, developer and engineering compensation (such as backend engineers
              earning $140,000 to $240,000), broker distribution commissions, and administrative overhead. Angle claims
              to have delivered four consecutive quarters of both EBITDA and GAAP net income profitability, a milestone
              rarely observed among venture-backed insurtech peers at similar operating scale. However, without public
              disclosure of its Medical Loss Ratio (MLR), net commission retention, and stop-loss fee splits,
              institutional underwriters cannot confirm whether profitability stems from core underwriting surplus or
              favorable claims timing.
            claimRefs:
              - CI003
              - CI005
              - CI007
              - CI009
              - CI011
              - CI012
          - type: table
            tableRef: TI002
