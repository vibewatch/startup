      SAN FRANCISCO – September 18, 2026 – Angle Health, the first AI-native healthcare benefits platform, today
      announced a $600 million equity financing at a $2.7 billion valuation, consisting of a $200 million Series C
      financing and a $400 million tender offer. The round, led by Vitruvian Partners with participation from new
      investor Town Hall Ventures and existing investors Blumberg Capital, Portage Ventures, PruVen Capital, and Y
      Combinator, is expected to close later this month.
