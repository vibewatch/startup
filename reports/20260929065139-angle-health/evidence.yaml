evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership-governance
    missingEvidence: >-
      Current board roster, broader executive team, delegated authorities, succession coverage, and investor governance
      rights.
    whyItMatters: >-
      The assigned sources identify the co-founders but do not permit a supported assessment of board control or
      key-person concentration.
    diligencePath: Request the board schedule, governance documents, organization chart, succession plan, and management references.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: statutory-financials
    missingEvidence: >-
      Audited GAAP financial statements, balance sheet disclosures, and statutory medical loss ratio (MLR) filings for
      2025 and 2026.
    whyItMatters: >-
      Validating Angle Health's claimed four consecutive quarters of GAAP net income profitability and evaluating
      underwriting risk retention requires audited loss data.
    diligencePath: >-
      Request confidential audited financials, state DOI regulatory examination reports, and underwriting risk-sharing
      agreements under NDA.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-cap-table-enumeration
    missingEvidence: >-
      Complete cap table records including minority angel investors, seed syndicate participants, and exact ownership
      percentages across all preferred classes.
    whyItMatters: >-
      Table TO003 captures a representative sample of major institutional leads; unlisted minority investors and exact
      share allocations remain private.
    diligencePath: >-
      Request the official capitalization table and investor rights agreement from company counsel during formal
      confirmatory diligence.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: headcount-census
    missingEvidence: Direct company-disclosed full-time employee census and department breakdown for Q3 2026.
    whyItMatters: >-
      A low-reputation third-party estimate does not establish the current payroll census needed to assess operating
      leverage.
    diligencePath: Obtain employee census and department breakdown directly from company management during formal diligence.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: comparative-economics
    missingEvidence: >-
      Matched employer quotes, fee schedules, commissions, stop-loss terms, renewal increases, retention cohorts, and
      claims-cost results for Angle and named competitors.
    whyItMatters: >-
      Product breadth and funding cannot establish price-value superiority or durable renewals without comparable
      realized economics.
    diligencePath: >-
      Request anonymized quote books and renewal cohorts, then validate a sample with brokers and employers that
      evaluated Angle alongside named alternatives.
    relatedQuestionRefs:
      - QP004
      - QP008
    relatedTableRefs:
      - TP003
  - type: enumeration-incomplete
    severity: material
    topic: named-competitors
    missingEvidence: >-
      A current, segment-specific list of named direct peers, incumbent carriers, TPAs, MGUs, broker platforms, and
      point-solution bundles appearing in actual Angle sales processes.
    whyItMatters: Category archetypes do not reveal which vendors win the same accounts or where Angle loses.
    diligencePath: >-
      Obtain the last four quarters of CRM win-loss records and interview a representative broker sample to map named
      alternatives by employer size and geography.
    relatedQuestionRefs:
      - QP001
      - QP003
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: underwriting-margins
    missingEvidence: >-
      Audited statutory financial filings, historical Medical Loss Ratio (MLR) loss runs, and gross vs. net premium
      reconciliations.
    whyItMatters: >-
      Underwriters cannot determine whether profitability is driven by sustainable underwriting margins or favorable
      claims variance without statutory MLR loss runs.
    diligencePath: >-
      Request audited statutory financial statements, state insurance department annual filings, and multi-year
      actuarial reserve reports under non-disclosure agreement.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: valuation-structure
    missingEvidence: >-
      Fully diluted capitalization table detailing terms, liquidation preferences, and share pricing for the $200M
      primary Series C versus the $400M secondary tender.
    whyItMatters: >-
      The 7.4% discount between the primary $2.7B valuation and the $2.5B secondary tender creates dual-tier valuation
      pricing and potential liquidation overhang.
    diligencePath: Obtain complete cap table schedule and series-by-series investor rights agreement from company legal counsel.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: technical-architecture
    missingEvidence: >-
      Production architectural specifications detailing internal data pipeline schemas, HIPAA-compliant encryption
      enclaves, and microservice SLA benchmarks.
    whyItMatters: >-
      Without detailed engineering specifications, the degree of proprietary automation versus off-the-shelf
      orchestration cannot be independently verified.
    diligencePath: >-
      Request SOC 2 Type II audit reports, architectural whitepapers, and system reliability metrics directly during
      technical diligence.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: minor
    topic: api-documentation
    missingEvidence: Public developer API reference documentation, webhooks schemas, and partner sandbox integration guides.
    whyItMatters: >-
      Direct custom integrations by employers or broker platforms require private credentialing and cannot be
      independently audited for developer experience.
    diligencePath: Obtain broker portal API specifications and sample integration code under NDA.
    relatedTableRefs:
      - TE002
  - type: private-evidence-only
    severity: material
    topic: retention-and-churn
    missingEvidence: >-
      Audited employer account Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and annual logo churn
      percentages across historical cohorts.
    whyItMatters: >-
      Without audited retention and churn data, institutional investors cannot evaluate whether customer growth is
      durable or offset by SMB business failure and plan shopping.
    diligencePath: >-
      Request historical cohort retention bridges and broker-level renewal summaries under confidentiality in financial
      diligence.
    relatedQuestionRefs:
      - QU005
  - id: gap-customer-concentration
    type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Breakdown of covered lives and premium volume by top 10 employer accounts and top brokerage general agencies.
    whyItMatters: >-
      High concentration among specific broker partners or regional employers would create severe revenue vulnerability
      if a major agency defected.
    diligencePath: Review client concentration schedule and top producer revenue contribution agreements.
    relatedQuestionRefs:
      - QU007
  - id: gap-clinical-outcomes
    type: missing-source
    severity: minor
    topic: clinical-outcomes
    missingEvidence: >-
      Independent third-party clinical outcomes evaluations or peer-reviewed health risk reduction metrics across Angle
      Health members.
    whyItMatters: >-
      Clinical efficacy and cost containment claims are critical to long-term employer ROI and self-funded risk
      underwriting durability.
    diligencePath: Obtain independent actuarial claims studies and validated healthcare utilization analyses.
    relatedQuestionRefs:
      - QU003
  - id: gap-named-customer-enumeration
    type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: >-
      Comprehensive roster of reference enterprise and mid-market employer deployments with verified member sizes and
      contract terms.
    whyItMatters: >-
      Public case study references are largely limited to early tech clients, leaving modern mid-market adoption proof
      incomplete.
    diligencePath: >-
      Conduct blind reference calls with a cross-section of contracted small business and mid-market HR benefits
      administrators.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: blocking
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Current legal-entity-by-state licenses, product approvals, market-conduct findings, regulator correspondence,
      litigation, and enforcement records.
    whyItMatters: >-
      The company-reported 47-state footprint and combined carrier, TPA, and MGU roles cannot be risk-ranked
      conclusively without primary regulator and court evidence.
    diligencePath: >-
      Obtain the legal-entity and license schedule, then verify each material state directly with Departments of
      Insurance and search federal and state court dockets.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: security-and-incidents
    missingEvidence: >-
      Independent security audits, privacy assessments, outage history, breach records, complaint trends,
      model-validation reports, and incident postmortems.
    whyItMatters: >-
      The disclosed data and integration footprint creates material operational exposure, but absence of a retained
      incident record is not proof that incidents did not occur.
    diligencePath: >-
      Request SOC and penetration-test reports, security and privacy assessments, regulator notices, outage logs,
      model-risk records, and customer complaint data.
    relatedQuestionRefs:
      - QR005
    relatedTableRefs:
      - TR002
  - type: stale
    severity: material
    topic: reinsurance-and-stop-loss
    missingEvidence: >-
      Current reinsurer identity and ratings, executed reinsurance and stop-loss contracts, attachment points,
      exclusions, collateral, aggregate limits, and renewal terms.
    whyItMatters: >-
      The only retained reinsurance evidence is a company statement from 2022, which cannot establish protection
      available in 2026.
    diligencePath: >-
      Inspect current executed treaties and policies, independently confirm counterparty ratings, and reconcile coverage
      to claims, reserves, products, and states.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR001
      - TR002
      - TR003
  - type: private-evidence-only
    severity: material
    topic: capital-and-loss-performance
    missingEvidence: >-
      Financing close documents, funded primary cash, tender settlement, debt terms, audited financials, statutory
      capital, reserves, and medical-loss performance.
    whyItMatters: >-
      Funding announced is not cash available, and reported profitability does not establish cash generation, reserve
      sufficiency, or sustainable underwriting economics.
    diligencePath: >-
      Reconcile bank and closing records to the post-close cap table and review audited statements, statutory filings,
      debt schedules, reserves, and cohort loss triangles.
    relatedQuestionRefs:
      - QR006
      - QR007
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: customer-and-channel-concentration
    missingEvidence: >-
      Employer, broker, network, geography, premium, claims, renewal, and margin concentration distributions on
      comparable cohorts.
    whyItMatters: >-
      Employer count and a company-reported renewal rate do not show whether revenue, risk, or distribution depends on a
      small number of counterparties.
    diligencePath: >-
      Request top-10 and top-25 concentration schedules, broker attribution, cohort retention, renewal pricing, claims
      concentration, and contribution margin by segment.
    relatedQuestionRefs:
      - QR008
      - QR009
      - QR010
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: blocking
    topic: audited-economics
    missingEvidence: >-
      Audited revenue, EBITDA, GAAP net income, cash flow, statutory capital, claims development, retention cohorts, and
      customer concentration records.
    whyItMatters: >-
      Reported growth and profitability cannot be converted into a valuation multiple or downside case without verified
      denominators, accounting bridges, insurance capital, and loss exposure.
    diligencePath: >-
      Obtain audited financial statements, statutory insurance filings, monthly management accounts, cohort schedules,
      claims triangles, and customer-level concentration data.
  - type: private-evidence-only
    severity: blocking
    topic: financing-terms
    missingEvidence: >-
      Executed Series C and tender documents, capitalization table, ownership purchased, liquidation preferences,
      participation rights, anti-dilution terms, and actual primary cash proceeds.
    whyItMatters: >-
      The headline valuation and transaction size do not determine entry ownership, dilution, preference overhang, or
      cash available to fund the company.
    diligencePath: >-
      Review executed financing documents, the fully diluted capitalization table, funds-flow statement, tender
      participation schedule, and post-close ownership model.
  - type: missing-source
    severity: material
    topic: comparable-set-and-exit
    missingEvidence: >-
      Model-appropriate public-company, private-round, and M&A comparables with consistent revenue, premium, earnings,
      growth, margin, and transaction-date definitions.
    whyItMatters: >-
      Without comparable metrics and complete entry terms, no defensible target return, hold period, exit multiple, or
      scenario valuation range can be calculated.
    diligencePath: >-
      Build a dated comparable set from filings and transaction documents, normalize each metric, and run
      entry-price-specific dilution and exit sensitivity analysis.
    relatedQuestionRefs:
      - QV008
  - type: missing-source
    severity: material
    topic: transaction-closing
    missingEvidence: Independent confirmation that the announced September 2026 transaction closed on the described terms.
    whyItMatters: An announced financing is not proof that cash was received or that the valuation became effective.
    diligencePath: >-
      Obtain the executed closing set, wire confirmation, amended capitalization table, and a dated closing
      announcement.
