  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: audited-economics
      missingEvidence: >-
        Audited revenue, EBITDA, GAAP net income, cash flow, statutory capital, claims development,
        retention cohorts, and customer concentration records.
      whyItMatters: >-
        Reported growth and profitability cannot be converted into a valuation multiple or downside
        case without verified denominators, accounting bridges, insurance capital, and loss exposure.
      diligencePath: >-
        Obtain audited financial statements, statutory insurance filings, monthly management accounts,
        cohort schedules, claims triangles, and customer-level concentration data.
    - type: private-evidence-only
      severity: blocking
      topic: financing-terms
      missingEvidence: >-
        Executed Series C and tender documents, capitalization table, ownership purchased, liquidation
        preferences, participation rights, anti-dilution terms, and actual primary cash proceeds.
      whyItMatters: >-
        The headline valuation and transaction size do not determine entry ownership, dilution,
        preference overhang, or cash available to fund the company.
      diligencePath: >-
        Review executed financing documents, the fully diluted capitalization table, funds-flow
        statement, tender participation schedule, and post-close ownership model.
    - type: missing-source
      severity: material
      topic: comparable-set-and-exit
      missingEvidence: >-
        Model-appropriate public-company, private-round, and M&A comparables with consistent revenue,
        premium, earnings, growth, margin, and transaction-date definitions.
      whyItMatters: >-
        Without comparable metrics and complete entry terms, no defensible target return, hold period,
        exit multiple, or scenario valuation range can be calculated.
      diligencePath: >-
        Build a dated comparable set from filings and transaction documents, normalize each metric,
        and run entry-price-specific dilution and exit sensitivity analysis.
      relatedQuestionRefs:
        - QV008
    - type: missing-source
      severity: material
      topic: transaction-closing
      missingEvidence: "Independent confirmation that the announced September 2026 transaction closed on the described terms."
      whyItMatters: "An announced financing is not proof that cash was received or that the valuation became effective."
      diligencePath: "Obtain the executed closing set, wire confirmation, amended capitalization table, and a dated closing announcement."
