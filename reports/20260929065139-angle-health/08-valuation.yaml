      - - "Anti-thesis"
        - "Operating proof is not independently audited in the assigned evidence"
        - "Profitability and renewal claims come from an existing investor or reporting based on company disclosures"
        - "Audited financials and statutory filings that reconcile the metrics would reduce this concern"
      - - "Anti-thesis"
        - "Independent liquidity evidence is weak"
        - "Forge reports limited activity and no available matched price"
        - "A closed arm's-length round and observable secondary trades would strengthen price discovery"
    notes: >-
      Company and investor claims are attributed to their issuers; the table does not treat them as
      independent verification or equate premium-equivalents with revenue.
