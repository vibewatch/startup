- id: deployment-and-trust
  title: Deployment Model, Developer Signal and Trust Gaps
  body: |-
    Rhoda’s product story ends with a hardware-agnostic licensing thesis. FutureVision is supposed to start inside Rhoda systems and then spread across partner platforms. That is strategically attractive because it could let Rhoda sell intelligence without absorbing all the capex and manufacturing burden of being a full robot OEM. It also aligns with the company’s recruiting posture. Team and job pages show a decidedly full-stack buildout: hardware, world models, cloud infrastructure, field operations and model training all sit inside the same platform. The company is clearly investing in the machinery needed for data collection, fleet support and model iteration, which is exactly what a neutral brain vendor needs if it wants to support heterogeneous deployments.

    The problem is not absence of technical detail; it is absence of independent validation. Coey’s critique is fair: ten hours of data is not the real underwriting question. The real question is operationalization under messy failure recovery, logging, monitoring and customer-specific edge cases. No public third-party safety certification, formal model audit, or standardized benchmark for DVA was found in the sources reviewed for this chapter. The official site advertises safety-rated vision, actuator brakes and a three-year reliability claim, and the research blog argues video rollouts help interpretability and safe-behavior inspection. Those are positive signals, but they are still internal signals. Likewise, developer signal currently comes more from hiring than from a public ecosystem surface; no public SDK, API docs or repository were found on the reviewed official materials. That does not invalidate the product, but it does mean the external proof stack is still narrower than the technical narrative suggests.
