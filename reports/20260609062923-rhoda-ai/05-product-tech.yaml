  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: safety-certification
    missingEvidence: Third-party safety certification, external audit, or formal validation documents for the DVA stack and robot platform.
    whyItMatters: Industrial underwriting needs more than homepage safety language and research-blog interpretability claims.
    diligencePath: Request certification status, test protocols, incident logs and external audit artifacts.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: benchmarking
    missingEvidence: Independent standardized task benchmarks versus named VLA and world-model baselines.
    whyItMatters: Without apples-to-apples comparisons, architecture differentiation remains plausible but not fully proved.
    diligencePath: Ask Rhoda for side-by-side evaluations against at least GR00T, Gemini or another published baseline.
    relatedQuestionRefs:
    - QE022
    - QE025
  - type: private-evidence-only
    severity: material
    topic: developer-ecosystem
    missingEvidence: Public SDK, API docs, developer repos, or integration guides.
    whyItMatters: A hardware-agnostic licensing business is easier to trust when outside developers and integrators can inspect the surface area.
    diligencePath: Request partner docs, public API roadmaps and any private beta materials.
    relatedQuestionRefs:
    - QE024
  - type: private-evidence-only
    severity: material
    topic: deployment-cohorts
    missingEvidence: Customer-by-customer uptime, failure-rate, and pilot-to-production conversion cohorts.
    whyItMatters: Demos do not reveal whether DVA scales across sites, products or changing edge cases.
    diligencePath: Request deployment dashboards, incident postmortems and cohort retention data.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE002
