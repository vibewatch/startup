callouts:
- calloutType: strength
  title: DVA is a real architectural thesis, not just a slogan
  body: Rhoda’s research blog is unusually explicit about context amortization, inverse dynamics, KV-caching and leapfrog control. The company is not merely saying “video helps” — it is specifying how video prediction becomes the control policy.
  claimRefs:
  - CE002
  - CE005
  - CE006
  - CE007
- calloutType: strength
  title: The sample-efficiency claim is directionally credible
  body: 'Multiple official and independent sources repeat the same core message: Rhoda is trying to compress embodiment data needs into roughly 10–20 hours by borrowing physical priors from web-scale video.'
  claimRefs:
  - CE008
  - CE010
  - CE011
  - CE012
- calloutType: risk
  title: Independent benchmarking is the biggest missing proof point
  body: The strongest public evidence remains company-authored demos and partner-style media coverage. There is still no standardized external benchmark that lets an investor compare Rhoda’s DVA stack against named VLA or world-model baselines on the same task set.
  claimRefs:
  - CE034
  - CE035
  - CE038
- calloutType: risk
  title: Developer signal is hiring-led, not ecosystem-led
  body: Rhoda is clearly investing in the platform internally, but the current public surface is mostly jobs and demos rather than SDKs, repos or public docs that would let outside developers or integrators build around the stack.
  claimRefs:
  - CE023
  - CE024
  - CE025
  - CE036
