- id: TE003
  title: Technology / Operating Architecture Table
  notes: This table mixes official mechanism claims with identified risk surfaces where public evidence remains thin.
  columns:
  - Layer / process
  - Role
  - Dependency
  - Primary upside
  - Risk
  rows:
  - - Web-video pretraining
    - Learns motion and physics priors
    - Large-scale general video data
    - Cheaply expands training diversity beyond robot demonstrations
    - Unknown data provenance and copyright exposure
  - - Causal video model
    - Predicts future visual states
    - Long context and efficient training objective
    - Keeps dynamics at the center of control
    - May be compute-intensive without careful caching and overlap
  - - Context Amortization
    - Trains future prediction at every sequence position
    - Long clean context windows
    - Makes hundreds-of-frame training tractable
    - Public evidence does not quantify absolute compute cost
  - - KV-cached inference
    - Reuses encoded context between steps
    - Stable long-context runtime path
    - Cuts redundant computation
    - Latency numbers are not publicly disclosed
  - - Leapfrog Inference
    - Overlaps action execution with next prediction
    - Action-conditioned future overlap
    - Supports continuous control despite inference delay
    - No public latency or jerk metric versus simpler loops
  - - Inverse dynamics
    - Converts predicted future into end-effector actions
    - Embodiment-specific data and translation model
    - Needs far less embodiment data than full policy retraining
    - Adapter performance across many robot types is not benchmarked publicly
  - - Closed-loop execution
    - Observe → predict → act → re-observe
    - Robot sensors and actuator stack
    - Responds to layout and object changes on the fly
    - Safety case still depends on undisclosed low-level controls and validation
  claimRefs:
