  researchQuestions:
  - id: QE001
    question: What exactly is FutureVision in customer-facing product terms?
    type: verification
    status: answered
    answer: FutureVision is Rhoda’s intelligence layer rather than a single fixed application, and the company expects it to expand across partner platforms over time.
    targets:
    - contentRequirements/0
    - plannedTables/product-module-asset-matrix
  - id: QE002
    question: How does Rhoda’s Direct Video Action architecture work mechanically?
    type: mechanism
    status: answered
    answer: A causal video model predicts future states from long context and a separate inverse-dynamics model converts those predictions into actions in closed loop.
    targets:
    - contentRequirements/2
    - plannedFigures/product-architecture-map
  - id: QE003
    question: Why does Rhoda pre-train on web-scale video instead of relying mainly on robot trajectories?
    type: mechanism
    status: answered
    answer: Rhoda argues web video is the most scalable source of physical interaction data and builds stronger motion and physics priors than scarce robot-only data.
    targets:
    - contentRequirements/2
  - id: QE004
    question: What are the major stages in Rhoda’s training and inference stack?
    type: enumeration
    status: answered
    answer: The public stack is web-video pretraining, context-efficient causal video learning, inverse-dynamics training, then closed-loop execution with overlap between inference and action.
    targets:
    - contentRequirements/2
    - plannedTables/technology-operating-architecture-table
  - id: QE005
    question: What is Context Amortization and why does it matter to DVA?
    type: mechanism
    status: answered
    answer: It turns long-context training into a next-token-style prediction problem over video so Rhoda can train on hundreds of context frames efficiently.
    targets:
    - contentRequirements/2
    - plannedTables/technology-operating-architecture-table
  - id: QE006
    question: How does Rhoda keep the system responsive enough for real-time control?
    type: mechanism
    status: answered
    answer: It uses KV-caching to reuse encoded context and Leapfrog Inference to overlap action execution with the next prediction cycle.
    targets:
    - contentRequirements/3
    - plannedFigures/customer-workflow-operating-flow
  - id: QE007
    question: How much embodiment-specific data does the inverse-dynamics adapter reportedly need?
    type: quantification
    status: answered
    answer: Rhoda says roughly 10 hours can be enough and that even random motions may be sufficient for inverse-dynamics training.
    targets:
    - contentRequirements/2
    - plannedTables/technology-operating-architecture-table
  - id: QE008
    question: How data-efficient is Rhoda on real customer-style industrial tasks?
    type: quantification
    status: answered
    answer: Rhoda’s public claim is roughly 10–20 hours of robot data for long-horizon tasks, which is much lower than most teleop-heavy robotics narratives.
    targets:
    - contentRequirements/4
    - plannedTables/workflow-use-case-table
  - id: QE009
    question: What does the public evidence show about the bearing-decanting task?
    type: verification
    status: answered
