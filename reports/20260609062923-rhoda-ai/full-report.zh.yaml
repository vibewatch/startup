        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Rhoda 的好消息是，绝对融资额大到足以产生影响。首个披露轮次
              $450M，让管理层一开始的资产负债表深度就超过多数机器人创业公司多轮融资之后的水平。官方材料和法律报道也用偏增长的方式描述募资用途：工程投入、工业部署、客户试点和团队增长。这说明资本被定位成扩张燃料，而不是为既有义务再融资。


              坏消息是，公开数据仍太薄，无法把轮次规模换算成现金跑道。烧钱速度和账上现金都未披露。检索到的来源没有显示债务工具或项目融资结构，SEC 公司搜索也没有 Rhoda AI 或 Rhoda Ai
              Corporation
              名下的公开发行人记录，但这种缺席并不能解决承销问题。一家公司仍可能通过模型训练、招聘和部署支持快速消耗资本，而无需公开披露。因此，本轮融资降低了短期破产风险，却没有消除融资依赖这一尽调主题。如果部署和收入转化滞后，而算力和招聘支出像招聘板暗示的那样扩大，Rhoda
              在达到持久现金生成前，仍可能需要更多大额轮次。
