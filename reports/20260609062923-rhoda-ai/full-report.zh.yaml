      - number: '2.2'
        title: 规模测算视角：增长真实存在，但直接 SAM 小于机器人 TAM 标题数字
        blocks:
          - type: paragraph
            body: >-
              多个规模测算视角都支持 Rhoda 的建设性背景，但每个视角回答的问题不同。最宽的软件加硬件视角是 AI 机器人市场，MarketsandMarkets 预计 2025 年为 $6.11B，2030 年达到
              $33.39B。更窄的“物理 AI”视角落在 2026 年 $1.50B，并到 2032 年增长至 $15.24B。再往外，Mordor Intelligence 估算 2026 年仓库自动化市场为
              $34.17B，Modern Materials Handling 指出 2023 年全球仓库自动化投资约 $21B，到 2033 年超过
              $90B。这些数字不能相加，但合在一起呈现一层栈：顶部是巨大的物流和工厂运营，下面是大型自动化预算，内部则是更小但快速增长的智能层。


              装机基础视角同样重要。IFR 称 2024 年安装了 542,000 台工业机器人，全球已有 4.664 million 台在运行；预计 2025 年为 575,000 台，2028 年超过 700,000
              台。这意味着市场不再单纯受限于“机器人会不会存在”。商业问题转向：通用化智能软件能在哪些地方提高已部署机队的价值，或让新类别工作变得可自动化。


              对 Rhoda 而言，这意味着一套实际的 TAM/SAM/SOM 层级。TAM 是物理 AI 和可适配机器人控制支出中偏软件的切片。SAM
              是制造、仓库和物流工作流里的子集，运营方既有变化性问题，也有预算权购买智能软件。SOM 更窄：愿意在定价、正常运行时间和安全主张完全验证前，先试点新模型驱动工作流的存量工业场地和系统集成商。由于公开来源没有披露
              Rhoda 定价、转化率或抽成率，今天任何 SOM 都必须受证据约束并明确加注，而不能被当作精确预测。
