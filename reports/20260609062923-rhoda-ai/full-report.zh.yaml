        title: 公开客户表面与目标细分市场
        blocks:
          - type: paragraph
            body: >-
              Rhoda 的客户故事已经能看见，但更多是靠工作流而不是客户标识呈现。官网明确说，公司服务汽车、制造、物流和电商等行业客户，并用三个任务例子支撑：为物流客户处理退货、汽车装配线上的轴承倒料、在制造场景拆解
              Contico。这足以判断其核心商业切入点。买方大概率不是消费者或小企业团队，而是想把可变物理作业自动化的企业运营或制造组织；传统脚本式机器人在这类工作上一直很难跑通。实际用户可能是工厂技师、机器人工程师、产线或仓库主管，付款方则是通过资本设备或自动化预算采购的工业企业。官方联系流程也偏顾问式，而非自助式，进一步印证其企业销售路径。同样重要的是缺失项。公开客户信息没有列出客户数、具名账户、合同结构，也没有给出宽泛工业垂类之外的地理分布，因此本章把
              Rhoda 视为一家确有早期客户活动、但公开账户披露仍有限的公司。
