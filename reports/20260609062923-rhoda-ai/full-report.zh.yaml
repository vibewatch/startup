    rows:
      - - 投资逻辑：品类顺风大
        - 2026 年 Q1 物理 AI 融资和 2026 年 AI 预算扩张显示投资人胃口仍有韧性
        - 如果出现具名企业部署和复购客户，判断会进一步增强
      - - 投资逻辑：软件层定位有战略价值
        - Rhoda 将 FutureVision 定位为可授权、跨硬件的智能层
        - 如果披露定价和附着率，判断会增强
      - - 投资逻辑：团队强，方向贴近工业场景
        - 领导层履历和生产环境声明方向上利好
        - 如果有客户背书和正常运行时间数据，判断会增强
      - - 反向逻辑：没有公开收入分母
        - 保留的公开来源没有收入、利润率或定价披露
        - 如果 Rhoda 披露 ARR、利润率和续约行为，反向逻辑会削弱
      - - 反向逻辑：私募市场噪音高
        - 二手来源对融资轮次信息说法不一，许多同业按不透明私募估值交易
        - 如果第三方数据趋同，私募估值也能映射到公开市场可比公司，反向逻辑会削弱
      - - 反向逻辑：商业化可能落后于叙事
        - 同业报道显示，一些头部公司仍缺商业化时间表
        - 如果 Rhoda 发布可复制部署经济性，反向逻辑会削弱
    notes: 反向逻辑不是假设；它基于当前披露缺口和可比公司报道。
