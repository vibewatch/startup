  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险格局排序
        blocks:
          - type: paragraph
            body: >-
              Rhoda 最严重的风险都来自一个简单观察：公司正试图在混乱的工业场景中商业化通用机器人智能，但公开记录还没有显示成熟装机基础。这形成了多层风险栈。第一层是技术稳健性：DVA
              或许比许多替代方案更省数据、更擅长长上下文推理，但真实工厂或仓库会惩罚每一次失败，方式是基准测试永远模拟不出来的。第二层是安全和责任。机器人一旦在人周围做出高速闭环物理决策，监督不足或故障监测薄弱就可能带来工伤、财产损失和产品责任敞口。第三层是商业化执行：Rhoda
              的公开客户信息仍未具名，投资者还无法验证转化、集中度或续约。第四层是依赖风险：硬件无关模型扩大 TAM，但也把成功押在外部硬件、集成和客户运营栈上。最后是市场和估值风险。具身 AI
              和人形机器人热度正在上升，但赛道拥挤、昂贵，规模化收入证据仍薄。图 FR001 对当前公开风险栈排序。
