      - number: '7.4'
        title: 竞争、估值、不透明度和否决标准
        blocks:
          - type: paragraph
            body: >-
              即便 Rhoda 技术上跑通，公司仍要在一个可能惩罚延迟和含混的市场中取胜。具身 AI 和人形机器人融资已经异常激进。CNBC 援引 Barclays，把 2035
              年的人形机器人市场描绘为潜在巨大，但当前基数仍小，中国已经主导制造规模和成本结构。Humanoids Daily 更广泛的竞争报道把 Rhoda 放在一个拥挤队列中，与 Figure、Tesla、1X
              和其他资金充足的入局者并列；即便态度正面的行业观察者也警告，商业化路径漫长，工程陷阱很多。Rhoda 还承受披露不透明的折价。官方材料始终把 2026 年 3 月轮次称为 Series
              A，但至少一家二级媒体称其为 Series B；关于 Rhoda
              主要是硬件无关的大脑层，还是也会自研硬件，公开叙事同样混杂。这些不一致并不致命，但正是会扭曲估值可比、增加尽调难度的含混。实际否决标准因此必须可量化：无法拿出具名可背书客户、缺少可见安全或合规里程碑、试点转付费部署乏力，或证据显示更广泛市场商品化速度快于
