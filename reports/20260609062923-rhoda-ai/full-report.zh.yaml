  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前轮次背景：巨额 Series A 轮，但基本面图景仍不透明
        blocks:
          - type: paragraph
            body: >-
              Rhoda 的 2026 年 3 月轮次首先因规模而突出。$450 million 的 Series A 轮是机器人和具身 AI 品类中最大的早期融资之一，多家二级媒体还把估值放在约 $1.7
              billion。这个绝对价格并不是本周期最极端的，但对于一家没有公开披露收入分母、毛利率画像、客户数或合同经济性的公司，仍是很高的价格。换句话说，这一轮足够大，能显示投资人信念很强；但透明度不够，外部投资人无法把估值转化为严谨倍数。


              围绕这一轮的公开证据也有质量问题。Rhoda 和 Wilson Sonsini 称该融资为 Series A，而至少一家二级媒体把它标成 Series B。这种不一致不改变募资金额，但有助于提醒我们：具身 AI
              私募市场元数据噪音很大，尽调应优先采用官方来源，而不是聚合器叙事。同样的模式也体现在缺失项上：Rhoda 披露工业部署和客户试点，但没有任何公开来源给出付费客户名称、ARR、定价结构或留存行为。


              积极解读是，市场在为一个可信团队攻坚难题的期权价值定价。Rhoda
              领导层阵容很强，其声称的软件层野心在战略上也有吸引力。消极解读是，当前价格主要靠叙事和未来可选性支撑，而不是靠已观察到的商业化支撑。对于正在决定是否追高进场的投资者，这一区别比本轮标题金额本身更重要。
