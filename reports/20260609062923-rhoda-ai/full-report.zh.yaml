chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与运营模式
        blocks:
          - type: paragraph
            body: >-
              Rhoda AI 经过 18 个月隐身期后，于 2026 年 3 月 10 日公开亮相，给自己的定位是位于 Palo Alto
              的机器人智能公司，目标是把通用型机器人从实验室演示推进生产环境。官网、新闻材料和发布报道里的口径一致：FutureVision 是商业化智能层，Direct Video
              Action（DVA）是底层技术押注。卖点不只是“更好的机器人控制策略”，而是一套不同的学习栈：Rhoda
              先用互联网规模视频做预训练，再用较少机器人数据做后训练，让系统能在传统工业自动化难以处理的高变化环境中泛化。


              运营模式看起来也更像混合型，而不是纯软件或纯硬件。Rhoda 称 FutureVision 计划随时间授权给合作方硬件和软件平台，但首页同时在推广 Rhoda
              机器人平台，带有定制执行器、安全等级视觉和载荷能力说法，暗示内部也在做硬件。公开示例集中在工业操作而非消费机器人：退货处理、汽车产线轴承拆袋转移、重型容器拆解，以及跟随演示执行任务。这给公司提供了可信的制造 /
              物流切入点，但也意味着业务必须证明，技术演示能转成可重复的商业部署，而不是一次性试点胜利。
