  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与 DVA 架构
        blocks:
          - type: paragraph
            body: >-
              Rhoda 已交付的产品不只是机器人演示，也不只是研究模型；它是一个名为 FutureVision 的拟议智能层。用客户语言说，FutureVision
              计划位于传感器和执行之间，持续观察世界，把未来状态预测成视频，再足够快地把这些预测转成动作，用于真实世界控制。这个架构重要，因为 Rhoda 正在反对一种主流框定：机器人基础模型主要是视觉-语言-动作系统。在
              Rhoda 的表述里，语言仍可给模型加条件，但重心是因果视频预测：世界随时间运动，所以控制策略应该直接从视频学习运动、物理和物理交互，而不是主要依赖远程操作机器人轨迹。


              官方研究博客把架构讲得异常具体。DVA 从一个从零训练、基于互联网规模视频的因果视频模型开始。Rhoda 不只是在编码完整序列后预测少数几帧，而是使用一种名为 Context Amortization
              的训练方法，在一段干净长历史上下文的每个位置预测未来帧。运行时，KV-caching
              复用已编码上下文，系统不必为长时域条件反复支付完整算力成本。预测出的未来随后交给一个独立逆动力学模型，由它推断实现想象结果所需的精确末端执行器运动。Rhoda 的 Leapfrog Inference
              把正在执行的动作和下一轮预测周期重叠起来，让模型思考时系统仍在移动。这是一套具体且自洽的栈，也是本章的关键技术差异点。
            claimRefs:
