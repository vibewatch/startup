      - number: '5.4'
        title: 部署模式、开发者信号与信任缺口
        blocks:
          - type: paragraph
            body: >-
              Rhoda 的产品故事落在硬件无关的授权逻辑上。FutureVision 应先在 Rhoda 系统里起步，再扩展到合作方平台。这个策略有吸引力，因为 Rhoda 可能销售智能，而不用吸收作为完整机器人 OEM
              的全部资本支出和制造负担。它也符合公司的招聘姿态。团队和职位页面显示出明显的全栈建设：硬件、世界模型、云基础设施、现场运营和模型训练都放在同一平台内。公司显然在投入数据采集、机队支持和模型迭代所需的机器；如果一个中立大脑供应商想支持异构部署，这些正是必需能力。


              问题不是缺少技术细节，而是缺少独立验证。Coey 的批评是公平的：10 hours
              数据并不是真正的承销问题。真正问题是在混乱的故障恢复、日志、监控和客户特定边缘情况中如何运营化。为本章审阅的来源中，没有找到公开第三方安全认证、正式模型审计或 DVA
              标准化基准测试。官网宣传安全等级视觉、执行器刹车和三年可靠性主张，研究博客也认为视频推演有助于可解释性和安全行为检查。这些是积极信号，但仍是内部信号。同样，开发者信号目前更多来自招聘，而不是公共生态表面；审阅的官方材料没有找到公开
              SDK、API 文档或代码仓库。这不会否定产品，但意味着外部证明栈仍比技术叙事暗示的更窄。
