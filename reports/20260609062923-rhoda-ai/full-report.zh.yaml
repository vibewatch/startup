      - number: '1.3'
        title: 融资基础、投资方与法律足迹
        blocks:
          - type: paragraph
            body: >-
              Rhoda 公开亮相时同步宣布了一笔融资；对于刚走出隐身期的公司来说，规模非常大。官方发布材料和法律顾问报道相互印证：公司于 2026 年 3 月 10 日宣布 $450M A 轮；多家二级来源将估值放在约
              $1.7B。投资方名单广且质量高，包括 Premji Invest、Khosla Ventures、Temasek、Mayfield、Capricorn、Prelude Ventures、Xora、John
              Doerr 等。这个投资团既给资本，也给战略信号，但并不能完全说明本轮领投权究竟有多集中。


              领投归属正好说明，后续承销应依赖签署版融资文件，而不是媒体摘要。Rhoda 自己的新闻稿列出支持方，但没有指定单一领投。Wilson Sonsini 称本轮由多名机构组成的投资团领投。几篇二级文章则把
              Premji Invest 称为领投方，部分第三方追踪平台甚至误把本轮标成 B 轮。法律层面，California 注册数据显示 Rhoda AI Corporation 是一家有效存续的 Delaware
              公司，成立于 2024 年 8 月 1 日，注册地址在 San Jose。这不一定与 Palo Alto
              运营总部矛盾，但说明公开法律足迹和公开运营地点口径并不完全一致。重要结论是：公司资本基础很强，但围绕阶段、领投方和设立细节的公开元数据，比标题报道暗示的更嘈杂。
