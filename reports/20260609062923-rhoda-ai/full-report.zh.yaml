      - number: '6.4'
        title: 怀疑视角：工业买家仍会惩罚薄弱集成和站不住的 ROI 账
        blocks:
          - type: paragraph
            body: >-
              Rhoda 的公开客户故事应放在工业采购的怀疑视角下看。NIST
              指出，潜在制造业用户中只有少数采用了机器人，因为买家在混乱的车间现场里仍难确保集成、性能和互操作性。独立行业资料还指出，如果每个地点都需要定制代码，跨多设施扩展机器人部署会变得贵到难以承受；仓库自动化项目也常常失败，因为
              ROI 论证低估了 WMS 集成、停机、培训和变更管理成本。Monocle 2026
              年的反向观点在这里尤其相关：许多仓库自动化项目失败，并不是因为机器人技术上做不到，而是因为商业案例建立在错误假设上，机器人周围的运营栈也没有准备好。这个提醒对 Rhoda
              很重要，因为公司明确瞄准可变、异常密集的工作流，集成细节昂贵，边缘案例也会快速增多。相邻仓库自动化市场的可比运营商已经发布具名证据点——Amazon 授权 Covariant 技术、KNAPP 公开延长与
              Covariant 的合作关系、GXO 公开试点 Dexterity 系统——这意味着该品类中，公开的可背书客户验证门槛实质上高于 Rhoda 当前披露。实际含义很直接。Rhoda
              的演示足以支撑继续尽调，但可投资客户证据的门槛应是具名背书、可量化正常运行时间、干预率和站点级 ROI，而不只是有说服力的视频和有利于合作伙伴的叙事。
