      - number: '7.2'
        title: 安全、监管和责任风险
        blocks:
          - type: paragraph
            body: >-
              即便 Rhoda 仍未披露许多运营细节，法律和安全负担也是真实的。OSHA 指出，机器人事故经常发生在设置、维护、测试和调整等非常规状态；OSHA 还指出，美国仍没有专门针对机器人的 OSHA
              标准。这意味着部署方必须从更宽泛的机器防护和工作场所安全义务中拼出安全体系，而不能依靠一套单一清晰的规则手册。NIOSH 的机器人中心之所以存在，正是因为协作式、移动式和 AI
              驱动机器人的伤害监测与安全实践仍在演进。欧洲又增加了一层：EU AI Act 明确把 AI 监管与健康和安全危害相连，新的 Machinery Regulation 也纳入了 AI 驱动安全功能和网络安全。现有
              ISO 标准已经勾勒出安全设计、系统集成和协作机器人预期。法律上最重要的一点是，Rhoda 不能假设一旦出事，下行风险都由客户吸收。Brookings 解释说，过失、设计缺陷和未尽警示义务都可能适用于 AI
              系统；Harvard 的监督分析也认为，除非真正具备稳健性、监控和协作系统，否则人在回路并不是充分抗辩。由于 Rhoda 没有公开披露认证、监控框架或保险条款，剩余责任敞口仍高。
