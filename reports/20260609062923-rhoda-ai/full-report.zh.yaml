      - number: '4.2'
        title: GTM 成熟度与收入质量
        blocks:
          - type: paragraph
            body: >-
              公开 GTM 证据在 Rhoda 谈部署时最强，在投资人需要合同经济性时最弱。公司似乎通过直接试点工作和未来授权给合作方软硬件平台的组合，触达工业运营商。信息口径偏企业、偏集成，符合 Rhoda
              正在追逐的领域。但公开记录没有说明交易究竟围绕试点里程碑、经常性软件订阅、捆绑硬件加服务套餐，还是长期 OEM 授权来设计。这个缺席很关键，因为每种收入模式都意味着完全不同的利润率画像和营运资本需求。


              招聘信号让商业化姿态看起来真实，但仍处于规模化前。公开 Ashby 招聘板显示 33 个开放职位，全部在 Palo
              Alto，明显集中在研究和软件，同时定向招聘硬件、供应链和运营岗位。这更像一家公司在为更深产品化配人，而不是已经建成成熟的多站点销售和现场服务机器。正确解读是：Rhoda
              正在投资走向商业化，不是已经证明可规模化、可重复收入。在客户集中度、合同期限和续约数据披露前，公开的收入质量逻辑仍由叙事主导。
