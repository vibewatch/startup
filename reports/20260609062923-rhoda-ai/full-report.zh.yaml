      - number: '5.2'
        title: 数据效率、长上下文记忆与用例证据
        blocks:
          - type: paragraph
            body: >-
              Rhoda 最强的产品主张是数据效率。公司称，在因果视频模型已经从互联网规模视频吸收运动先验后，DVA 可以用大约 10–20 hours
              机器人数据学会新的长时域工业任务。两个旗舰用例都刻意选择难啃场景：轴承拆袋转移和 Contico 容器拆解。据称，轴承拆袋转移只用了 11 hours
              任务数据，却仍能处理断裂绑带、撕裂袋子、歪斜箱子等边缘情况，并连续运行 1.5 hours。容器拆解据称使用 17 hours 机器人数据，随后在处理重箱、部分可观测和随机碎片时连续运行 160
              minutes。官方材料把两者都定位为生产式客户概念验证（PoC），而不是受控实验室基准测试。


              长上下文视觉记忆是第二个定义性能力。Rhoda 明确把数百帧原生上下文，与许多只处理少数帧的 VLA
              系统对比。猜杯游戏示例是这一能力的玩具基准测试：物体消失，杯壳移动，模型仍必须跨时间保持状态。更有商业相关性的是退货处理，Rhoda
              称它能端到端运行，不需要手工设计的进度指示器或多阶段脚手架。单样本分类和绘图演示将同一思路从记忆延伸到上下文模仿：单次人类演示被注入上下文窗口，机器人在不更新权重的情况下模仿演示意图。这些机制和演示有吸引力，但仍是公司自写证据，而不是独立基准测试结果。
