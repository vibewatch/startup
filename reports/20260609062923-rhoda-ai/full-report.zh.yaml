      - number: '4.5'
        title: 财务结论与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              Rhoda
              的公开财务画像只有在尽调愿意先于收入证明承销技术承诺和投资方质量时，才具备可投性。乐观情景足够清晰：很大的轮次、强投资方阵容、可信研究背景，以及至少看起来具备商业方向的具体工业工作流。悲观情景同样清晰：没有披露收入、定价、具名客户、毛利率、烧钱速度、现金余额，也没有独立验证的部署经济性。这正是能让一个有吸引力的物理
              AI 叙事跑在公开承销纪律前面的披露模式。


              检索集中最强的怀疑来源 robotics.press
              认为，估值由未来潜力而非市场证明支撑。这个判断可能略微过度，但抓住了核心问题。严肃尽调需要客户访谈、合同结构、定价、集中度、烧钱、现金跑道和利润率数据；没有这些，就很难把机会作为财务投资来承销，只能作为物理 AI
              主题下注。在这些输入私下披露前，唯一诚实的公开结论是：Rhoda 的资本基础和技术野心很强，但收入质量和利润率路径仍未证明。
