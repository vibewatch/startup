      - number: '8.3'
        title: 上市自动化公司可比与情景测算：当前估值靠对未来收入的信念，不靠当下收入证据
        blocks:
          - type: paragraph
            body: >-
              上市自动化企业并不是 Rhoda 产品模式的直接可比，但它们是估值纪律能找到的最好护栏。截至报告运行日，Yahoo Finance 显示 Symbotic 约为 2.27x 销售额，Zebra 约为 2.10x
              销售额，Rockwell 约为 5.72x 销售额。这些公司成熟得多，有真实收入分母和已建立的商业历史，因此不应被用来直接给 Rhoda
              “估值”。但它们能作为理性校验：当公开市场投资者真正看得见收入时，规模化自动化企业是什么样。


              含义很直接。如果 Rhoda 要用 5x 收入支撑 $1.7 billion——高于 Symbotic 和 Zebra、低于 Rockwell 的溢价——就需要大约 $340 million 收入。即便按 10x
              收入，也仍需要约 $170 million。公开来源并没有显示 Rhoda 今天接近这个水平，因为公开来源根本没有给出任何 Rhoda 收入数字。这并不意味着 Rhoda
              最终无法长进这个估值。它意味着当前估值并没有扎在一个可观察分母上。


              由此可以形成三情景框架。悲观情景假设私募估值回归常态，Rhoda 也无法把试点转化为已披露的经常性收入；公允价值随后压缩到大约 $0.9 billion 到 $1.3 billion。基准情景假设 Rhoda
              把技术承诺转化为更清晰的付费部署和收入披露，支撑当前估值附近或略高的水平。乐观情景假设 Rhoda 成为可信的多硬件软件平台，并出现可见授权增长，未来 24 个月把价值抬升至 $3 billion 到 $5
              billion 区间。三种情景都必然粗略，因为缺失分母才是核心问题。
