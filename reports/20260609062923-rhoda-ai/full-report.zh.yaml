      - number: '5.3'
        title: FutureVision 与重 VLA 路线的差异
        blocks:
          - type: paragraph
            body: >-
              概括 Rhoda 逻辑最锋利的说法是：许多 VLA 系统仍过于语言优先、上下文太短，无法弥合“真实世界鸿沟”。Rhoda
              并不是唯一使用视频或互联网规模数据的公司，但比多数同业更激进，因为它把因果视频预测本身做成策略。系统先想象世界的下一段，之后才把想象出的未来转成动作。这不同于 GR00T、GR-2 和 Gemini
              Robotics；即便这些系统变得更多模态，或大规模使用人类视频，它们仍清楚处在 VLA 家族内。外部评论有助于解释 Rhoda 为什么认为这很重要。Mimic Robotics 认为，VLA
              主干继承了语义，但没有继承物理动态，把昂贵的具身学习留给稀缺的机器人轨迹。Kempner Institute 也认为，互联网规模视频捕捉物理变换的方式，是图文预训练做不到的。


              这不意味着 Rhoda 独占赛道。DreamGen 和其他世界模型努力说明，市场更多力量正在转向更丰富的视频预训练。NVIDIA 的 GR00T 路线更开放、更面向基准测试，Google 的 Gemini
              Robotics 通过 VLA 栈声称更强泛化指标和更广具身覆盖。换句话说，Rhoda
              的逻辑有差异，但并不孤立。真正问题是，因果视频优先公式能否在生产中带来实质更好的稳健性、样本效率和运营调试。公开来源支持这个逻辑的可信度，尤其在上下文长度和可解释性上，但还没有用标准化第三方基线证明它优于同任务集上的具名
              VLA 或世界模型。
