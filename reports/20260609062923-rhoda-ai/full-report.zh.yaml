      - number: '3.3'
        title: 数据策略、部署模式与定价压力
        blocks:
          - type: paragraph
            body: >-
              比较 Rhoda 与同业，最干净的轴是数据策略。Rhoda 的 DVA 栈押注互联网规模视频加少量特定具身机器人数据。这不同于 Skild 的四来源叙事：仿真、互联网视频、远程操作和部署反馈；也不同于
              Physical Intelligence 的多机器人灵巧操作数据集加 VLM 预训练；不同于 Dexterity 在生产中完成 100 million 次自主动作的说法；也不同于 NVIDIA 建在
              20,000 hours 人类 EgoScale 视频加机器人示范之上的 VLA 配方。Google DeepMind 也更靠近 VLA 一侧，即便它现在强调基准测试泛化和具身推理。换句话说，Rhoda
              的独特性不只是“使用视频”——许多对手也用——而是因果视频预测是策略核心，而不是辅助数据来源或模型组件。


              商业模式差异同样大。Rhoda 和 Skild 暗示软件授权。Physical Intelligence 把开源开发者触达与未来企业层级混合。NVIDIA
              免费提供或开放模型层重要部分，用来销售周边栈。Figure 和 Apptronik 靠完整机器人、服务和工厂规模变现。Dexterity
              向仓库工作流销售生产系统，而整个领域几乎没有公开标价。这意味着买方常常会根据部署风险、支持负担和渠道力量选择，而不是根据价格透明度选择。Rhoda
              的硬件无关立场，在客户已经拥有机器人或想保留供应商灵活性时很有吸引力，但也意味着 Rhoda 必须解决垂直供应商可藏进单一软硬件合同里的难啃集成工作。
