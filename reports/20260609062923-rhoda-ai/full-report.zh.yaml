      - number: '3.4'
        title: 差异化耐久性与竞争压力
        blocks:
          - type: paragraph
            body: >-
              Rhoda 的差异化可信，但仅凭公开证据还不算耐久。核心逻辑——因果视频预测应比重 VLA
              的替代方案更能泛化、也更少依赖机器人数据——是自洽的，并且与许多同业主导的语言优先框架有实质差异。但在这个品类里，架构不是持久护城河。平台公司能模仿接口模式，开源开发者能复现栈的部分组件，买方最终在意的是错误恢复、部署吞吐和可支持性。因此，Rhoda
              必须比资本更充足的对手更快把视频优先的先发优势转成数据和部署飞轮。Skild 在融资和公开伙伴叙事上已经更靠前。Physical Intelligence 在公开技术披露上更靠前。Figure
              在已披露工业试点证明上更靠前。NVIDIA 和 Google 在生态杠杆上更靠前。


              持久压力点在分销、基准测试可见度和切换成本。Rhoda 一旦嵌入客户工作流，集成复杂度应会形成有意义的锁定效应。在此之前，市场要软得多。如果中立大脑市场商品化，NVIDIA 和 Google
              可以靠平台捆绑压低定价；如果客户偏好一个可问责供应商，Figure、Apptronik 和 Dexterity
              可以凭全栈可靠性赢。公开定价不透明、缺少标准化跨公司基准测试，也让当前市场异常依赖叙事。对投资人来说，正确问题不是“Rhoda 的方法技术上是否有趣？”，而是“Rhoda
              能否在既有巨头和垂直玩家把它挤进狭窄位置前，把技术独特性转成部署密度？”
