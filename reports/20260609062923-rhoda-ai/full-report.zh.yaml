      - number: '8.2'
        title: 未上市具身 AI 可比公司：Rhoda 低于巨额轮次，但板块明显虚高
        blocks:
          - type: paragraph
            body: >-
              Rhoda 应放在当前具身 AI 估值阶梯中估值，而不应只对标成熟工业自动化企业。在这条阶梯上，Figure 是明确上限，2025 年估值约 $39 billion。Skild 从 2024 年的 $1.5
              billion 升至 2026 年超过 $14 billion，同时披露收入约 $30 million；这个倍数只有在投资者相信它能成为默认机器人“大脑”平台时才说得通。据报道，Physical
              Intelligence 在 2026 年寻求超过 $11 billion 的估值，而几个月前估值约 $5.6 billion；与此同时，TechCrunch 报道其没有商业化时间表。Apptronik 达到
              $5 billion，Dexterity 达到 $1.65 billion。FieldAI 融了大量资金，甚至没有公开披露估值。


              与这组相比，Rhoda 的 $1.7 billion 绝对值看起来不高。这是乐观论点：投资者用远低于 Figure、Skild、Physical Intelligence 或 Apptronik
              的价格，买到同一大类敞口——面向混乱真实世界任务的通用机器人智能。不过，反向逻辑是，那些更高估值未必证明 Rhoda 便宜；它们也可能只是揭示整个同业组已经被拉得过高。


              这正是怀疑来源重要的地方。TechCrunch 关于 Physical Intelligence 的报道指出，其没有商业化时间表。Eilla
              的机器人估值手册认为，更接地气的仓储和内部物流机器人企业通常落在低个位数到中个位数 EV/revenue
              区间，服务占比高的集成商甚至更低。对于一家收入前的前沿模型公司，这不是完美的逐项可比基准，但它是有用的纪律锚点。当前具身 AI
              市场显然奖励叙事、人才和战略可选性。它还没有证明，所有这些私募估值都能转化为持久的公开市场价值。
