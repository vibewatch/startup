  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              Rhoda AI 处在一个拥挤但仍在成形的物理 AI 市场，买方可以用几种很不同的方法解决同一件事。第一类是 Rhoda、Skild AI、Physical Intelligence 和 FieldAI
              这样的中立机器人脑供应商。它们承诺的是横向软件杠杆：一个智能层跨越多种机器人、任务和环境。Rhoda 属于这一类，因为 FutureVision
              被明确包装为一个智能层，预计授权给不同机器人硬件和软件平台，而不是锁在一台自家机器上。Skild 提出类似的跨形态论点，FieldAI 称 EDGE 是“跨机器人共用一个大脑”，Physical
              Intelligence 称 π0 是能控制不同机器人的通用机器人策略。


              第二类是既有平台方：NVIDIA Isaac GR00T 和 Google DeepMind Gemini Robotics。它们不需要靠机器人模型收入来证明投资合理。NVIDIA 能用
              GPU、模拟器和推理需求补贴开放模型；DeepMind 能把机器人纳入 Gemini 更大的基础模型栈和合作伙伴网络。第三类是 Figure 和 Apptronik
              这样的垂直整合人形机器人厂商，把自研模型、一个机器人家族和制造路线图捆在一起。第四类是 Dexterity 这样的生产专精厂商，以及更相邻的仓库 AI 既有方如
              Covariant，范围往往更窄，但在单一工作流里部署证明更强。对 Rhoda 来说，核心竞争问题不是物理 AI 有没有价值，而是视频优先的中立大脑能否在平台方和垂直玩家压缩市场之前，赢得足够部署数据。
