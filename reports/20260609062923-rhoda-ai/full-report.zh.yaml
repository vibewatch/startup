      - number: '1.2'
        title: 领导梯队与关键人物集中度
        blocks:
          - type: paragraph
            body: >-
              公开可见的领导层集中在少数人身上。Jagdeep Singh 作为 CEO 和联合创始人，是公司的门面；技术叙事由首席科学家 Eric Chan 和 Stanford 教授 Gordon Wetzstein
              承载；更宽的公开领导团队包括产品、研究、战略和数据高管。这足以说明 Rhoda 不只是两个人的科研项目，但也暴露了公开控制面偏窄：投资人被要求承销的故事，仍高度绑定 Singh 的创始人口碑，以及 Chan 和
              Wetzstein 的研究可信度。


              现有资料也显示，研究实力和公开可见部署深度之间并不对称。Wetzstein 的 Stanford 页面确认他自 2024 年 10 月起就是 Rhoda 联合创始人，把公司锚定在严肃的学术视频生成能力上。Chan
              被描述为 Stanford 研究员、前 WorldLabs 生成模型架构师。但检索到的材料没有披露董事会，没有讲清治理结构，也没有呈现具备大规模部署资历的现场服务或工业运营负责人。这个缺口很关键，因为 Rhoda
              瞄准的是变化多的制造和物流工作流，安装、安全、正常运行时间和售后执行可能与模型质量同样重要。招聘板和团队页显示公司确实在广泛招人，但仍没有消除公开公司画像里的关键人物依赖。
