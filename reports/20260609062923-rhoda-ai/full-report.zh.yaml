        - 需要它才能把估值转化为真实倍数
        - 与管理层开展财务 + GTM 尽调
      - - 客户证明
        - 具名付费客户、站点数量和扩张数据
        - 区分试点和可复制商业需求
        - 背书访谈和队列分析
      - - 单位经济性
        - 毛利率、实施成本、支持负担、算力成本
        - 决定 Rhoda 更像软件公司，还是服务占比高
        - 管理层数据室 + 部署模型审查
      - - 可靠性
        - 第三方正常运行时间、安全和错误率记分卡
        - 企业买家重视可靠性胜过新颖性
        - 客户 KPI 包 / 技术尽调
      - - 股权结构
        - 优先权、清算堆叠和稀释条款
        - 即使名义估值可接受，也会影响实际回报
        - 法务 / 融资尽调
      - - GTM 路径
        - 集成商、OEM 和直销渠道组合
        - 厘清采用速度和利润率获取
        - 渠道访谈 + 合同审查
    notes: 前三个问题中任意一个都可能实质改变当前估值下的建议，因为 Rhoda 的公开证据集异常缺分母。
    claimRefs:
      - CV005
      - CV027
      - CV028
      - CV040
      - CV041
      - CV045
