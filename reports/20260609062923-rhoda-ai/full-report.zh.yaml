      - number: '8.4'
        title: 建议、投资逻辑破坏点和最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              以公开证据得出的最干净结论是观察 / 继续研究，而不是激进追高。品类顺风很明显：劳动力短缺持续存在，自动化预算仍有意义，AI 预算在扩张，大型投资者也显然愿意为具身 AI 平台赌注融资。Rhoda
              还受益于强领导层信号，以及具有战略吸引力的“机器人智能层”叙事。如果公司后续证明其授权经济性在制造和物流中具备持久性，今天的价格可能会像一个可接受的早期路标，而不是峰值。


              但当前证据还不足以用高置信度支持这一结果。决定性缺失项都很基础：具名付费客户、定价结构、经常性收入、毛利率、部署留存，以及模型能在精挑细选的评估之外稳定工作的证明。在披露这些之前，投资案例对价格和证据敏感，而不是只对品类敏感。换句话说，相信具身
              AI 还不够；问题是 Rhoda 自己能否把这种信念转化为经得起公开市场审视的软件经济性。


              如果下一轮融资周期仍缺少具名付费部署和收入披露，或者证据更扎实的同业出现平轮或下调轮、重新锚定整个板块，投资逻辑会最快破裂。因此，尽调议程很直接。在显著高于据报当前估值付款之前，投资者应要求看到站点级付费使用证据、软件抽成率清晰度、实施成本和毛利数据，以及能说明正常运行时间和扩张行为的客户背书。没有这些，审慎立场就是保持跟踪、学习，等待证据，而不是追逐兴奋。
            claimRefs:
