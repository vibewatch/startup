        title: 里程碑、证据点与未披露事项
        blocks:
          - type: paragraph
            body: >-
              Rhoda 的里程碑时间线很压缩。公开记录从 2024 年法律设立证据，直接跳到 2026
              年发布：一场头部融资事件、一份旗舰新闻稿和密集招聘。官网和转载报道提供了足够证据，说明公司关注的是真实工业任务，而不是投机式机器人品牌包装：它展示了具体物流和汽车工作流，声称在一次高产量评估中制造周期低于两分钟，并挂出
              33 个开放职位，集中在研究、软件和硬件。这些都是有意义的就绪信号，尤其对于一家刚从隐身期出来的创业公司。


              但公开披露包在尽调最需要硬证据的地方仍然偏薄。公司没有点名客户，不公布收入或客户数，不披露定价，也没有给出确切员工数，只有团队页姓名、招聘职位和外部数据平台估算等间接代理指标。新闻页目前指向单一的 2026 年
              3 月新闻稿，进一步说明沟通记录仍很窄。robotics.press 的第三方分析更进一步，认为投资人在没有独立验证部署或经济性的情况下承销强技术逻辑。这个批评可能放大了下行，但准确抓住了主要尽调约束：Rhoda
              目前最强的公开信号是技术架构、投资方质量和招聘动能，而不是已验证商业牵引力。
