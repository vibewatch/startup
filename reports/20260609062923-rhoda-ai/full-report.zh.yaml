  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与商业表面
        blocks:
          - type: paragraph
            body: >-
              Rhoda 的公开材料显示，变现模式比纯软件授权或纯机器人销售都更宽。FutureVision 被描述为一个智能层，今天驱动 Rhoda
              系统，未来预计授权给合作方硬件和软件平台。这个表述指向软件平台野心。但公司同时推广自己的机器人平台和公开任务演示，意味着部署服务、系统集成，以及至少一部分内部硬件敞口。落实到承销，Rhoda
              看起来是一家混合型前沿机器人公司：想捕获类似软件的杠杆，但还没有摆脱类似硬件和服务的执行要求。


              商业证据点仍处早期。官网和发布稿指向汽车、制造、物流和电商工作流，再加上一个制造基准测试：据称在无人干预下，用不到两分钟完成一个组件处理周期。它有方向性价值，因为叙事不再只停留在实验室演示。但同一套公开材料仍缺少具名客户、客户数、收入、ARR、定价、ACV
              和合同结构。所以商业表面已经可见，变现表面仍不透明。现有证据支持的是“存在试点需求和可信工业兴趣”，而不是“Rhoda 已经降低收入质量风险”。
