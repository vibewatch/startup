      - number: '4.3'
        title: 成本结构与资本强度
        blocks:
          - type: paragraph
            body: >-
              Rhoda 的成本结构几乎肯定比传统 AI 应用公司更重。研究说明清楚表明，DVA
              依赖互联网规模视频预训练、长上下文视频记忆和自回归生成，这些都意味着大量算力、存储、数据工程和模型运营成本。与此同时，公司在物理侧显然不是轻资产：官网宣传带定制执行器和安全等级视觉的 Rhoda
              机器人平台，在线职位包括 VP of Hardware，以及供应链和集成岗位。这个组合指向混合支出画像：前沿模型训练，加上物理系统工程和部署。


              反方论点是，如果技术逻辑跑通，Rhoda 仍可能实现有吸引力的单位经济性。公司称部分任务可用约 10 hours
              机器人数据学会；如果得到验证，相比需要大得多的任务特定数据集的机器人栈，远程操作成本可能大幅下降。如果 FutureVision
              确实能跨多个硬件合作方迁移，公司也可能在早期偏硬件的建设期之上赚到类似软件的杠杆。但公开数据还不能让外部人判断两种未来哪一种会发生。现有记录足以得出“现在资本密集，之后可能像软件”的结论，不足以量化这个转变何时、是否会发生。
