      - number: '2.4'
        title: 增长驱动与约束：真实需求顺风存在，炒作和证据缺口也真实存在
        blocks:
          - type: paragraph
            body: >-
              Rhoda 这类软件的需求逻辑很直接。制造商和仓库仍依赖数百万人工岗位，BLS 预计物料搬运每年有超过 1 million 个职位空缺，U.S. Chamber 仍显示制造业有数十万开放岗位。NVIDIA 的
              2026 年零售和 CPG 调查显示 AI 预算在扩张，UPS 和 DHL 都把 2026 年物流投资围绕韧性、可见性、软件定义仓库、AMR 和 AI 辅助决策展开。Interact Analysis 和
              Modern Materials Handling 也都显示，即使宏观环境波动，自动化预算仍在前进。


              同一批来源也说明，投资人为什么要抵抗物理 AI 炒作。McKinsey 仍把资本成本和内部经验不足视为主要阻碍。Interact Analysis
              对移动机器人前景的下调幅度大于固定自动化，并称不确定性、关税和更高钢材成本正在扭曲项目时点。存量场地改造占主导，因为企业对新建项目承诺很谨慎。即便支持性来源，也越来越把市场框定在软件定义编排、服务质量和 ROI
              纪律，而不是任何自称“物理 AI”的公司都能拿到不受约束的支出。


              这带来两个明确限定。第一，许多公开市场数字仍偏硬件，而 Rhoda 能变现的层只是这些预算的一小片。第二，Rhoda
              自身公开证据仍薄：没有披露收入、定价、具名付费客户名单，也没有按工作流公布抽成率。这不会否定市场机会，但意味着市场逻辑应被视为可信需求背景，而不是 Rhoda
              已经抓住持久软件切入点的证明。换句话说，品类真实存在，但具体商业胜利仍是承销问题。
