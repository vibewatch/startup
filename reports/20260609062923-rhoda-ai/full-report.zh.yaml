      - number: '7.3'
        title: 技术稳健性、数据飞轮和集成风险
        blocks:
          - type: paragraph
            body: >-
              Rhoda 的核心论点在逻辑上自洽：用互联网规模视频建立丰富的运动先验，把预测转化为闭环动作，再让真实部署形成复利式数据飞轮。但从论点到运营公司，中间仍有缺失的桥板。公司称可以用大约 10 到 20
              小时机器人数据学会任务，也展示了几个有说服力的概念验证；但
              MTBF、干预率、安全认证和生产正常运行时间的公开证据缺席。借助视频生成提升可解释性，可能帮助工程师调试策略行为，但不能证明模型的可审计性足以用于受监管或贴近工人的环境。商业化模式也带来集成风险。Reuters
              和 RoboHorizon 都把 FutureVision 描述为可跨大量机器人硬件或现有机队运行；这在战略上有吸引力，但也让 Rhoda 依赖 OEM、集成商、客户 WMS 和 MES
              环境，以及公司没有公开列举的站点特定异常处理。NIST 和行业互操作性评论都说明，工厂常常不是因为机器人想法错误而失败，而是集成、标准和异常处理先断裂。如果 Rhoda
              不能把未具名演示转化为可重复、可引用的部署，数据飞轮论点会很快变弱。
