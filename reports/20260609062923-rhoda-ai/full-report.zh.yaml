      - number: '3.2'
        title: 直接同业、相邻对手与平台威胁
        blocks:
          - type: paragraph
            body: >-
              Skild AI 是 Rhoda 在 2026 年最明显的直接压力点，因为它用多得多的资本追求同一个中立大脑逻辑。Skild 的公开叙事结合了估值、伙伴叙事和通用控制野心：2026 年 1 月融资 $1.4
              billion，估值超过 $14 billion，并坚持认为跨多种具身形态共享一个模型才是唯一可扩展答案。Physical Intelligence 是最接近的技术同业。π0
              被公开记录为一个视觉-语言-动作流匹配模型，建立在预训练 VLM 和来自八种机器人的数据之上；openpi 让开发者和研究者能看清这套栈。Figure
              是另一类对手：不是中立软件，而是垂直整合的人形机器人供应商，Helix 模型、Figure 03 硬件和 BotQ 工厂构成同一个逻辑。Dexterity 和 FieldAI
              重要，是因为它们说明，即使更宽的“通用型”市场仍未验证，买方仍会奖励仓储和工业现场里窄而生产级的物理 AI。


              NVIDIA 和 Google 是 Rhoda 不能忽视的既有平台方。GR00T N1.7 开放、可商业授权，并由 NVIDIA 的模拟器、工具链和算力生态支撑。Gemini Robotics 明确偏 VLA，但
              Google 声称它比早期模型有更强基准测试泛化表现和更广具身支持，并有覆盖 Apptronik、Agility 和 Boston Dynamics 的可信测试者网络。Apptronik
              本身与其说是直接模型实验室对手，不如说是战略信号：如果 OEM 更偏好垂直整合人形机器人加 Gemini 捆绑包，中立授权层就会被挤压。Covariant 更远，但仍是相关先例，因为它代表仓库 AI
              路线：工作流深度，而不是硬件广度。不过公开层面，它目前官方资料面比新一代基础模型实验室薄得多，因此更像先例案例，而不是首要基准。
