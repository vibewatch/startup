  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：Rhoda 卖的是智能层，不是整套机器人栈
        blocks:
          - type: paragraph
            body: >-
              Rhoda 自己的发布材料一直把 FutureVision 描述为机器人智能系统，而不是机器人 OEM 产品。公司称 Direct Video Action 架构是一个“智能层”，今天可驱动 Rhoda
              系统，之后可授权到不同机器人硬件和软件平台。这一点重要，因为它大幅收窄相关市场边界。正确比较集合不是整个工业机器人硬件、传感器或工厂自动化资本支出，而是软件和模型层：硬件已经存在或正在采购后，正是这一层让高变化、高混合度的实体工作流变得可自动化。


              这个区分很关键，因为多数分析师的机器人市场仍把硬件重的类别打包在一起。MarketsandMarkets 的 AI 机器人市场预测，2025 年硬件仍占支出 61%，同时软件和服务扩张。同样，其物理 AI
              市场分类把 GPU、传感器、内存、执行器等硬件组件和软件、服务并列。对 Rhoda 来说，这些硬件重数字可作为自上而下背景，也能证明装机基础足够大，足以支撑一个软件层，但它们不是 Rhoda 能直接捕获的收入。


              公开描述也指向 Rhoda
              的第一批滩头阵地：制造和物流环境，材料、布局和工作流持续变化。在这些场景里，既有替代方案不只是人工，还包括固定自动化、定制机器人编程、重度依赖远程操作的训练闭环，以及一旦工作流变化就变贵的系统集成项目。Rhoda
              的切入点，是主张闭环、视频训练模型能降低机器人适配新任务的边际成本。因此，相关纳入支出包括：机器人智能软件、世界模型或策略模型授权、任务适配、编排和相关集成。排除支出则包括机器人臂、夹爪、移动底盘、货架、输送线，以及占据更广泛仓库和工厂自动化预算的大部分场地建设支出。
