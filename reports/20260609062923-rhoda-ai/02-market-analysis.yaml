  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: rhoda-pricing
    missingEvidence: Public pricing, contract structure, and whether Rhoda charges per site, per workflow, per robot, or per inference cycle.
    whyItMatters: Without a pricing model, software take-rate and SOM math remain speculative even if the broader market is attractive.
    diligencePath: Request pilot statements of work, pricing sheets, and any partner revenue-sharing terms.
    relatedQuestionRefs:
    - QM024
    - QM025
  - type: private-evidence-only
    severity: material
    topic: paid-deployments
    missingEvidence: Named paying customers, active site count, and renewal or expansion evidence.
    whyItMatters: Pilots and demos do not prove that budget owners will convert to recurring software spend.
    diligencePath: Request customer references, deployment counts, and proof of paid renewal or expansion.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM003
  - type: conflicting-data
    severity: material
    topic: software-share
    missingEvidence: Independent estimate of what percentage of target-site automation budgets is captured by intelligence software versus hardware and integration.
    whyItMatters: Most public robotics TAMs remain hardware-heavy, which can inflate Rhoda’s apparent addressable market if used without adjustment.
    diligencePath: Benchmark software attach rates from comparable automation vendors and integrators in manufacturing and warehousing.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: minor
    topic: safety-and-uptime
    missingEvidence: Independent uptime, safety, and error-rate benchmarks for Rhoda systems in production settings.
    whyItMatters: Enterprise buyers rank reliability and support above novelty, so benchmark proof matters for real procurement probability.
    diligencePath: Ask for third-party validation reports or customer KPI scorecards from live sites.
    relatedQuestionRefs:
    - QM015
    - QM024
