- id: private-comps
  title: 'Private Physical-AI Comparables: Rhoda Is Cheaper Than the Mega-Rounds, but the Sector Is Clearly Inflated'
  body: |-
    Rhoda should be valued against the current physical-AI ladder, not against mature industrial automation businesses alone. On that ladder, Figure is the clear upper bound at roughly $39 billion in 2025. Skild moved from $1.5 billion in 2024 to above $14 billion in 2026 while disclosing about $30 million of revenue, implying a multiple that only makes sense if investors believe it can become the default robot-brain platform. Physical Intelligence reportedly sought more than $11 billion in 2026 after being valued around $5.6 billion only months earlier, even while TechCrunch reported it had no commercialization timeline. Apptronik reached $5 billion, and Dexterity reached $1.65 billion. FieldAI raised substantial capital without even publicly disclosing a valuation.

    Against that group, Rhoda’s $1.7 billion looks modest on an absolute basis. That is the bull argument: investors are paying for the same broad category exposure—generalist robot intelligence for messy real-world tasks—but at a price much lower than Figure, Skild, Physical Intelligence, or Apptronik. However, the anti-thesis is that those higher marks do not necessarily make Rhoda cheap; they may instead reveal how stretched the whole peer set has become.

    This is where skeptical sources matter. TechCrunch’s reporting on Physical Intelligence notes no timeline for commercialization. Eilla’s robotics valuation playbook argues that more grounded warehouse and intralogistics robotics businesses typically clear at low- to mid-single-digit EV/revenue ranges, with services-heavy integrators even lower. That is not a perfect apples-to-apples benchmark for a pre-revenue frontier model company, but it is a useful discipline anchor. The current physical-AI market clearly rewards narrative, talent, and strategic optionality. It has not yet demonstrated that all of those private marks will convert into durable public-market value.
