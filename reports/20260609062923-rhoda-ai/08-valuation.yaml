- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue model
    - Pricing basis, ARR/MRR, and customer count
    - Needed to convert valuation into a real multiple
    - Finance + GTM diligence with management
  - - Customer proof
    - Named paying customers, site count, and expansion data
    - Separates pilots from repeatable commercial demand
    - Reference calls and cohort analysis
  - - Unit economics
    - Gross margin, implementation cost, support burden, compute cost
    - Determines whether Rhoda is software-like or services-heavy
    - Management data room + deployment model review
  - - Reliability
    - Third-party uptime, safety, and error-rate scorecards
    - Enterprise buyers prioritize reliability over novelty
    - Customer KPI packages / technical diligence
  - - Cap structure
    - Preferences, liquidation stack, and dilution terms
    - Affects realized return even if headline valuation is acceptable
    - Legal / financing diligence
  - - Go-to-market route
    - Integrator, OEM, and direct-sales channel mix
    - Clarifies adoption speed and margin capture
    - Channel interviews + contract review
  notes: Any one of the first three asks could materially change the recommendation at the current mark because Rhoda’s public evidence set is unusually denominator-light.
