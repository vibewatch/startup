  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: rhoda-revenue
    missingEvidence: ARR or revenue run-rate, gross margin, and pricing model for Rhoda’s current deployments.
    whyItMatters: Without a denominator, the reported $1.7 billion valuation cannot be translated into a defensible multiple or return profile.
    diligencePath: Request management revenue bridge, pricing sheets, and cohort-level deployment economics.
    relatedQuestionRefs:
    - QV005
    - QV029
    - QV030
  - type: private-evidence-only
    severity: material
    topic: named-customers
    missingEvidence: Named paying customers, deployment count, and renewal or expansion data.
    whyItMatters: Pilots and benchmark evaluations are not enough to prove durable revenue conversion at scale.
    diligencePath: Ask for customer references, deployment invoices, and signed expansion schedules.
    relatedQuestionRefs:
    - QV004
    - QV028
    - QV029
  - type: conflicting-data
    severity: minor
    topic: round-stage-metadata
    missingEvidence: Clean reconciliation of round-stage labeling across secondary databases and trackers.
    whyItMatters: Noisy private-market metadata is a symptom of broader information quality issues in the sector.
    diligencePath: Reconcile the cap table and financing history directly from counsel and company data room materials.
    relatedQuestionRefs:
    - QV003
  - type: private-evidence-only
    severity: material
    topic: cap-structure
    missingEvidence: Liquidation preferences, participation features, investor rights, and expected future dilution.
    whyItMatters: A headline valuation can look acceptable while realized common-equity returns still become unattractive.
    diligencePath: Review financing docs and pro-forma ownership scenarios with counsel.
    relatedQuestionRefs:
    - QV028
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set
    missingEvidence: More disclosed private physical-AI rounds with both valuation and revenue data.
    whyItMatters: Today’s comparable table is informative but still partial because most peers disclose valuation far more readily than economics.
    diligencePath: Expand the set with secondary tender data, late-stage private filings, and additional investor memos.
