- id: TI001
  title: Revenue Streams Table
  columns:
  - Stream
  - Mechanism
  - Unit / contract
  - Current status
  - Revenue quality
  - Diligence ask
  rows:
  - - FutureVision platform licensing
    - License robot intelligence layer across Rhoda or partner systems
    - Unknown; likely enterprise software / platform contract
    - Publicly described, not commercially quantified
    - Unproven publicly
    - Get sample MSAs, pricing schedule, and renewal mechanics
  - - Pilot deployments
    - Industrial customer pilots and deployment programs
    - Project or pilot milestone based
    - Explicitly referenced in use-of-proceeds
    - Early-stage and likely non-recurring until scaled
    - Request active pilot list, success criteria, and conversion rate
  - - Deployment / integration support
    - System bring-up, workflow mapping, site integration, safety work
    - Services or implementation fees (not disclosed)
    - Implied by operating model and hiring mix
    - Potentially meaningful but opaque
    - Break out services revenue from recurring software revenue
  - - Rhoda-operated systems / hardware-adjacent revenue
    - Own robot platform or full-system deployments
    - Unknown
    - Suggested by product positioning, not commercially detailed
    - Could dilute software margins if material
    - Clarify hardware revenue share, COGS, and asset ownership
  - - OEM / partner licensing over time
    - FutureVision embedded into third-party hardware or software stacks
    - Unknown multi-year licensing construct
    - Strategic aspiration rather than disclosed current business
    - High upside but not yet proven
    - Identify first OEM deal and unit economics
  notes: Summarizes the publicly implied revenue architecture; every commercial term remains undisclosed.
