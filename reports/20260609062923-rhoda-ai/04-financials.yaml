- id: financial-verdict-and-diligence-blockers
  title: Financial Verdict and Diligence Blockers
  body: |-
    Rhoda’s public financial profile is investable only if the diligence process is willing to underwrite technical promise and investor quality ahead of revenue proof. The bull case is clear enough: a very large round, strong investor roster, credible research pedigree, and specific industrial workflows that at least look directionally commercial. The bear case is equally clear: no disclosed revenue, no pricing, no named customers, no gross margin, no burn, no cash balance, and no independently validated deployment economics. That is exactly the type of disclosure pattern that lets a compelling physical-AI narrative outrun public underwriting discipline.

    The strongest skeptical source in the retrieved set, robotics.press, argues that the valuation is being carried by future potential rather than market proof. That may be slightly overstated, but it captures the core issue. A serious diligence process would need customer references, contract structure, pricing, concentration, burn, runway, and margin data before this opportunity could be underwritten as a financial investment rather than a thematic bet on physical AI. Until those inputs are disclosed privately, the only honest public verdict is that Rhoda’s capital base and technical ambition are strong, but revenue quality and margin path remain unproven.
