- id: TI005
  title: Public Financial Gaps Table
  columns:
  - Missing private metric
  - Why it matters
  - Current public substitute
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Revenue / ARR
    - Core anchor for valuation and go-to-market quality
    - Only pilot / deployment narrative plus one company-stated manufacturing KPI
    - Cannot test valuation against fundamentals
    - Obtain monthly revenue bridge and latest ARR
  - - Pricing / ACV / contract structure
    - Required to model revenue quality and margin
    - No public pricing whatsoever
    - Cannot distinguish software platform from services-heavy business
    - Review executed customer contracts and order forms
  - - Customer concentration
    - Needed to assess dependency risk and revenue durability
    - No named customers or count disclosed
    - A few pilots could explain all current traction
    - Request top-10 customer revenue mix
  - - Gross margin by stream
    - Separates software leverage from hardware/services drag
    - No margin disclosure
    - Cannot model path to profitability
    - Provide software, services, and hardware gross margins
  - - Burn and cash balance
    - Needed for runway and financing-dependency analysis
    - Large round size is known, burn is not
    - Runway claims would be speculative
    - Review cash waterfall and 12-month plan
  - - Retention / renewals / NRR
    - Needed to underwrite recurring economics
    - No renewal or cohort disclosure
    - Cannot judge whether pilots convert to durable ARR
    - Provide cohort retention and renewal history
  notes: Each row is a real blocker to public underwriting rather than a stylistic “nice to have.”
