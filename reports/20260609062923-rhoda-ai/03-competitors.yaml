chapter:
  number: 3
  title: Competitors
  summary: Rhoda AI faces the heaviest direct pressure from other neutral robot-brain companies such as Skild AI and Physical Intelligence, the heaviest platform pressure from NVIDIA GR00T and Google DeepMind Gemini Robotics, and the clearest adjacent deployment proof from Figure, Dexterity and FieldAI. Rhoda’s clearest differentiation is its video-first Direct Video Action architecture and hardware-agnostic licensing thesis, but public durability still depends on whether that architecture turns into deployment density before better-capitalized rivals and platform incumbents compress the market.
sections:
- id: competitive-landscape
  title: Competitive Landscape and Buyer Alternatives
  body: |-
    Rhoda AI sits in a crowded but still-forming physical-AI market where buyers can solve the same job in several very different ways. The first bucket is neutral robot-brain providers such as Rhoda, Skild AI, Physical Intelligence and FieldAI. Their promise is horizontal software leverage: one intelligence layer spanning multiple robots, tasks and environments. Rhoda belongs here because FutureVision is explicitly framed as an intelligence layer expected to license across different robotic hardware and software platforms rather than stay locked to one in-house machine. Skild makes a similar cross-form-factor case, FieldAI says EDGE is “one brain across robots,” and Physical Intelligence says π0 is a generalist robot policy that can control different robots.

    The second bucket is platform incumbents: NVIDIA Isaac GR00T and Google DeepMind Gemini Robotics. These players do not need robotics-model revenue to justify the investment. NVIDIA can subsidize open models through GPU, simulator and inference demand; DeepMind can tie robotics into Gemini’s broader foundation-model stack and partner network. The third bucket is vertically integrated humanoid builders such as Figure and Apptronik, which pair a proprietary model with one robot family and a manufacturing roadmap. The fourth bucket is production-specialist operators such as Dexterity and, more adjacently, warehouse AI incumbents like Covariant, which often have narrower scope but stronger deployment proof in one workflow. For Rhoda, the central competitive question is not whether physical AI will be valuable; it is whether a video-first neutral brain can win enough deployment data before platform and vertical players compress the market.
