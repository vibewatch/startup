    targets:
    - contentRequirements/2
    - plannedTables/feature-capability-matrix
  - id: QP017
    question: How much competitive pressure comes from niche specialists rather than direct foundation-model peers?
    type: comparison
    status: answered
    answer: A meaningful amount, because Dexterity and FieldAI can win workflows through domain depth and reference customers even if they are less horizontal than Rhoda.
    targets:
    - contentRequirements/0
    - plannedTables/competitor-profile-table
  - id: QP018
    question: Which competitor sets the hardest valuation or proof bar for Rhoda in investor narratives?
    type: comparison
    status: answered
    answer: Figure sets the toughest proof bar on deployment optics, while Skild sets the toughest bar on capital and software-layer market appetite.
    targets:
    - contentRequirements/1
    - plannedFigures/moat-readiness-kpis
  - id: QP019
    question: How should investors think about hardware-agnostic licensing versus vertically integrated robot OEM models?
    type: mechanism
    status: answered
    answer: Hardware-agnostic models maximize market reach but push integration burden onto the software vendor; vertical OEMs sacrifice breadth for tighter hardware/software optimization.
    targets:
    - contentRequirements/3
    - plannedTables/pricing-packaging-comparison
  - id: QP020
    question: What is the single biggest external force that could commoditize Rhoda’s model layer?
    type: adverse
    status: answered
    answer: Platform bundling by NVIDIA or Google is the largest commoditization risk because each can give away or underprice the model layer to deepen ecosystem adoption.
    targets:
    - contentRequirements/4
    - plannedTables/moat-durability-competitive-risk-register
  - id: QP021
    question: Which competitors are best positioned to win on reliability and buyer trust before general-purpose breadth is proven?
    type: comparison
