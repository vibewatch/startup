callouts:
- calloutType: insight
  title: The real contest is software leverage versus channel leverage
  body: Rhoda’s neutral-brain thesis can create wider addressable market than any single robot OEM, but only if customers value portability enough to tolerate integration complexity. That makes channel leverage, not architecture elegance, the gating factor in near-term competition.
  claimRefs:
  - CP028
  - CP029
  - CP037
- calloutType: risk
  title: Platform incumbents can compress standalone pricing
  body: NVIDIA and Google do not need robotics models to be standalone profit centers. They can subsidize robotics through compute, simulator, API and broader AI-platform economics, which is exactly the kind of cross-subsidy that can erode model-layer margins for startups.
  claimRefs:
  - CP030
  - CP039
- calloutType: risk
  title: Rhoda still trails several rivals on public proof
  body: Physical Intelligence publishes clearer technical comparisons, Figure publishes stronger deployment metrics, and Skild publishes a louder partner/distribution narrative. Rhoda’s architecture may be distinct, but its moat is not yet durable on public evidence alone.
  claimRefs:
  - CP027
  - CP031
  - CP032
  - CP040
