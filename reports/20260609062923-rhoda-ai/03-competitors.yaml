  researchQuestions:
  - id: QP001
    question: What are the major competitive categories Rhoda faces in physical AI and industrial robot intelligence?
    type: enumeration
    status: answered
    answer: Rhoda faces neutral robot-brain peers, platform incumbents, vertically integrated humanoid builders, and production specialists in warehouse or field robotics.
    targets:
    - contentRequirements/0
    - plannedTables/competitor-profile-table
  - id: QP002
    question: Which rivals most directly match Rhoda’s ambition to provide one intelligence layer across many robots and tasks?
    type: comparison
    status: answered
    answer: Skild, Physical Intelligence and FieldAI are the closest architecture-level peers because each frames itself as a generalized brain rather than a single robot product.
    targets:
    - contentRequirements/0
    - plannedTables/competitor-profile-table
  - id: QP003
    question: Which competitors currently have the largest public funding or valuation advantage over Rhoda?
    type: quantification
    status: answered
    answer: Skild and Figure are the clearest scale outliers in public markets discourse, at >$14B and roughly $39B respectively.
    targets:
    - contentRequirements/1
    - plannedTables/competitor-profile-table
  - id: QP004
    question: Which important adjacent rivals are vertically integrated around a specific humanoid or robot family?
    type: enumeration
    status: answered
    answer: Figure and Apptronik are the clearest humanoid examples, while Dexterity is more vertically packaged around warehouse outcomes than neutral software licensing.
    targets:
    - contentRequirements/0
    - plannedTables/competitor-profile-table
  - id: QP005
    question: How do the main competitors differ in their core data strategy?
    type: comparison
    status: answered
    answer: Rhoda leans on internet video plus small robot-data post-training; Skild adds simulation and deployment data; PI uses multi-robot dexterous data; Dexterity uses production action logs; GR00T and Gemini combine human and robot data.
    targets:
    - contentRequirements/2
    - plannedTables/feature-capability-matrix
    - plannedFigures/feature-breadth-capability-map
  - id: QP006
    question: Which competitors have the strongest public deployment proof in real production settings?
    type: comparison
    status: answered
    answer: Figure and Dexterity have the strongest disclosed production-style evidence, with FieldAI and Skild behind them on public clarity but ahead of PI on deployments.
    targets:
    - contentRequirements/1
    - plannedTables/competitor-profile-table
  - id: QP007
    question: Which rivals publish explicit benchmark comparisons rather than only product demos or partner claims?
    type: verification
    status: answered
    answer: Physical Intelligence and Google DeepMind publish the clearest benchmark-style claims, while Rhoda and Skild remain more demo- and narrative-led.
    targets:
    - contentRequirements/2
    - plannedTables/feature-capability-matrix
  - id: QP008
    question: How different are NVIDIA GR00T and Gemini Robotics from Rhoda’s video-first DVA thesis?
    type: comparison
    status: answered
    answer: Both are explicitly VLA-oriented, whereas Rhoda makes causal video prediction the policy core and uses inverse dynamics to translate video to action.
    targets:
    - contentRequirements/2
    - plannedFigures/feature-breadth-capability-map
  - id: QP009
    question: How serious is Figure’s full-stack humanoid strategy as a substitute for Rhoda’s neutral-licensing model?
    type: comparison
    status: answered
    answer: It is serious where customers prefer one accountable vendor and humanoid hardware already fits the workflow, but less directly substitutive for mixed-fleet licensing.
    targets:
    - contentRequirements/4
    - plannedTables/moat-durability-competitive-risk-register
  - id: QP010
    question: Is there enough public pricing information to compare Rhoda’s commercial model against peers on cost rather than positioning?
    type: freshness
    status: answered
    answer: No; public pricing is sparse across nearly all peers, so packaging and distribution are more observable than actual contract economics.
    targets:
    - contentRequirements/1
    - plannedTables/pricing-packaging-comparison
  - id: QP011
    question: What is Rhoda’s clearest product-level technical difference from VLA-heavy competitors?
    type: mechanism
    status: answered
    answer: Rhoda says the causal video model predicts future states directly and an inverse-dynamics model translates those states into actions in closed loop.
    targets:
    - contentRequirements/2
    - plannedTables/feature-capability-matrix
  - id: QP012
    question: Which competitors pursue the strongest hardware-agnostic or cross-embodiment positioning?
    type: enumeration
    status: answered
    answer: Rhoda, Skild, Physical Intelligence, FieldAI, GR00T and Gemini all make some form of cross-embodiment claim, though the surrounding business models differ sharply.
    targets:
    - contentRequirements/3
    - plannedFigures/competitive-positioning-map
  - id: QP013
    question: How durable is the platform-incumbent threat from NVIDIA and Google?
    type: adverse
    status: answered
    answer: It is highly durable because both can bundle models with broader ecosystem control over compute, simulators, APIs and partner networks.
    targets:
    - contentRequirements/4
    - plannedTables/moat-durability-competitive-risk-register
  - id: QP014
    question: Which rivals currently have the strongest distribution leverage or partner channels?
    type: comparison
    status: answered
    answer: Skild, Figure, NVIDIA and Google show the strongest public channel leverage, with Dexterity and FieldAI strong inside narrower domains.
    targets:
    - contentRequirements/3
    - plannedTables/competitor-profile-table
  - id: QP015
    question: How much does open-source distribution matter in this market right now?
    type: comparison
    status: answered
    answer: Open-source matters most for developer reach and experimentation, which is why openpi and GR00T are strategically relevant even if they are not complete enterprise products.
    targets:
    - contentRequirements/2
    - plannedFigures/feature-breadth-capability-map
  - id: QP016
    question: Are Rhoda’s peers materially ahead on publicly retrievable benchmark evidence?
