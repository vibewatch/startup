      - number: '2.2'
        title: 'Sizing Lenses: Fast Growth Is Real, but the Direct SAM Is Smaller Than Headline Robotics TAMs'
        blocks:
          - type: paragraph
            body: >-
              Multiple sizing lenses support a constructive backdrop for Rhoda, but each lens answers a different
              question. The broadest software-plus-hardware lens is the AI robots market, which MarketsandMarkets
              projects at $6.11 billion in 2025 and $33.39 billion by 2030. A narrower “physical AI” lens lands at $1.50
              billion in 2026 growing to $15.24 billion by 2032. Broader still, Mordor Intelligence sizes warehouse
              automation at $34.17 billion in 2026, and Modern Materials Handling points to about $21 billion of global
              warehouse automation investment in 2023 with more than $90 billion by 2033. Those numbers are not
              additive, but together they show a stack: huge logistics and factory operations at the top, large
              automation budgets beneath, and a much smaller but rapidly growing intelligence layer inside them.


              The installed-base lens is equally important. IFR says 542,000 industrial robots were installed in 2024
              and 4.664 million were already in operation globally, with 575,000 expected in 2025 and more than 700,000
              by 2028. That means the market is no longer constrained purely by “will robots exist?” The commercial
              question shifts to where generalized intelligence software can raise the value of those deployed fleets or
              make new categories of work automatable.


              For Rhoda, that implies a practical TAM/SAM/SOM hierarchy. TAM is the software-oriented slice of physical
              AI and adaptable robot-control spend. SAM is the subset inside manufacturing, warehouse, and logistics
              workflows where operators have both variability problems and budget authority to buy intelligence
              software. SOM is narrower again: brownfield industrial sites and system integrators willing to pilot new
              model-driven workflows before pricing, uptime, and safety claims are fully proven. Because public sources
              do not disclose Rhoda pricing, conversion rates, or take rates, any SOM today must remain
              evidence-constrained and explicitly caveated rather than treated as a precise forecast.
