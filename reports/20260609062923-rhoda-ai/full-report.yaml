      - number: '2.3'
        title: 'Buyer, User, and Payer: Adoption Runs Through Existing Ops Budgets and Integrator Channels'
        blocks:
          - type: paragraph
            body: >-
              The buyer map for Rhoda is shaped by who already owns automation budgets. In manufacturing cells, the
              daily user is likely an automation engineer, line supervisor, or robotics integrator, while the economic
              buyer sits with plant operations, advanced manufacturing, or central automation leadership. In warehouses,
              the user is more often a robotics or fulfillment operations team, but the payer sits with network
              operations, supply-chain engineering, or logistics leadership that already manages WMS, WES, AMR, and
              systems-integration spend. That division matters because Rhoda’s “robot brain” value proposition only gets
              funded if it improves throughput, uptime, labor productivity, or deployment flexibility within an existing
              capex or opex envelope.


              Public buyer-priority data shows what those teams care about. Modern Materials Handling says durability,
              reliability, and uptime dominate selection criteria, followed by fast service response, purchase price,
              total cost of ownership, and integration with existing equipment. McKinsey’s industrial survey adds that
              many customers prefer full-service implementation models and are worried about capital cost and lack of
              internal experience. Hy-Tek’s 2026 warehouse trends piece reinforces that software
              orchestration—especially WES and low-code integration—has become central because enterprises increasingly
              need heterogeneous systems to work as one stack.


              This creates a likely adoption path for Rhoda. The first sale is rarely a pure foundation-model license
              sold into a blank sheet of paper. More often, it is a pilot or brownfield enhancement inserted into an
              existing automation program, often via an OEM, integrator, or operational sponsor. The operational user
              wants fewer exception cases and faster task adaptation. The budget owner wants a credible ROI story. The
              payer wants confidence that the vendor can support deployment, not just publish impressive demos. Rhoda’s
              commercialization challenge is therefore not only technical generalization; it is earning a place in
              procurement workflows that already penalize novelty when uptime or safety is uncertain.
