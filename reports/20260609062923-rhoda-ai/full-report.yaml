      - number: '3.3'
        title: Data Strategy, Deployment Model and Pricing Pressure
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to compare Rhoda with peers is through data strategy. Rhoda’s DVA stack bets on
              internet-scale video plus small amounts of embodiment-specific robot data. That differs from Skild’s
              four-source story of simulation, internet video, teleoperation and deployment feedback; from Physical
              Intelligence’s multi-robot dexterous dataset plus VLM pretraining; from Dexterity’s claim of 100 million
              autonomous actions in production; and from NVIDIA’s VLA recipe built on 20,000 hours of human EgoScale
              video plus robot demonstrations. Google DeepMind sits closer to the VLA side as well, even if it now
              emphasizes benchmark generalization and embodied reasoning. In other words, Rhoda’s uniqueness is not
              merely “uses video” — many rivals do — but that causal video prediction is the policy core rather than an
              auxiliary data source or model component.


              Commercial models are just as different. Rhoda and Skild imply software licensing. Physical Intelligence
              mixes open-source developer reach with a future enterprise tier. NVIDIA gives away or opens major parts of
              the model layer to sell the surrounding stack. Figure and Apptronik monetize full robots, services and
              factory scale. Dexterity sells production systems into warehouse workflows, and public list pricing is
              scarce across the whole field. That means buyers will often choose on deployment risk, support burden and
              channel power rather than price transparency. Rhoda’s hardware-agnostic stance is attractive where the
              customer already owns robots or wants vendor flexibility, but it also means Rhoda must solve the ugly
              integration work that a vertical vendor can hide inside a single hardware/software contract.
