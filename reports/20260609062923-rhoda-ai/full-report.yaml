  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - No named paid deployments by next financing cycle
        - Still no customer names, pricing, or ARR disclosure
        - Collapses software-economics thesis into pure narrative risk
        - Do not pay up; require hard customer proof first
      - - Sector reset in better-proven peers
        - Flat/down rounds or major valuation cuts for stronger peers
        - Shrinks narrative premium available to Rhoda
        - Re-mark fair value toward bear case
      - - Pilot economics fail to scale
        - High implementation cost or weak gross margin once disclosed
        - Undermines platform-software thesis
        - Treat as services-heavy integrator economics instead
      - - Model fails on safety / uptime in live sites
        - Independent KPI data contradicts demo claims
        - Damages enterprise procurement probability
        - Pause diligence until reliability proof appears
      - - Opaque cap structure or investor protections
        - Unexpected preference stack or heavy future dilution
        - Reduces upside even if company executes operationally
        - Re-cut expected return or walk away
    notes: >-
      These are kill triggers at or above the current reported valuation. At a much lower entry, some would become
      monitor items rather than hard stops.
    claimRefs:
      - CV012
      - CV025
      - CV026
      - CV041
      - CV042
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Revenue model
        - Pricing basis, ARR/MRR, and customer count
        - Needed to convert valuation into a real multiple
        - Finance + GTM diligence with management
      - - Customer proof
        - Named paying customers, site count, and expansion data
        - Separates pilots from repeatable commercial demand
        - Reference calls and cohort analysis
      - - Unit economics
        - Gross margin, implementation cost, support burden, compute cost
        - Determines whether Rhoda is software-like or services-heavy
        - Management data room + deployment model review
      - - Reliability
        - Third-party uptime, safety, and error-rate scorecards
        - Enterprise buyers prioritize reliability over novelty
        - Customer KPI packages / technical diligence
      - - Cap structure
        - Preferences, liquidation stack, and dilution terms
        - Affects realized return even if headline valuation is acceptable
        - Legal / financing diligence
      - - Go-to-market route
        - Integrator, OEM, and direct-sales channel mix
        - Clarifies adoption speed and margin capture
        - Channel interviews + contract review
    notes: >-
      Any one of the first three asks could materially change the recommendation at the current mark because Rhoda’s
      public evidence set is unusually denominator-light.
    claimRefs:
      - CV005
      - CV027
      - CV028
      - CV040
