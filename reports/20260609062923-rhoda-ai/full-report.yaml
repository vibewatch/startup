      - number: '1.2'
        title: Leadership Bench and Key-Person Concentration
        blocks:
          - type: paragraph
            body: >-
              Public leadership visibility centers on a small number of people. Jagdeep Singh is the face of the company
              as CEO and co-founder; the technical thesis is personified by Chief Scientist Eric Chan and Stanford
              professor Gordon Wetzstein; and the broader named leadership bench includes product, research, strategy,
              and data executives. That is enough to show Rhoda is more than a two-person science project, but it also
              reveals a narrow public control surface: the story investors are being asked to underwrite is still
              heavily tied to Singh’s founder reputation and to the research credibility of Chan and Wetzstein.


              The available sources also suggest asymmetry between research strength and publicly visible deployment
              depth. Wetzstein’s Stanford page confirms he has been a Rhoda co-founder since October 2024 and anchors
              the company to serious academic video-generation expertise. Chan is described as a Stanford researcher and
              former WorldLabs generative-model architect. Yet the retrieved materials do not disclose a board, do not
              spell out a governance structure, and do not surface field-service or industrial-operations leaders with
              large-scale deployment credentials. That gap matters because Rhoda is targeting variable manufacturing and
              logistics workflows where installation, safety, uptime, and post-sales execution can be as important as
              model quality. The jobs board and team page show real hiring breadth, but they do not remove the
              key-person dependency that still defines the public company profile.
