      - number: '3.4'
        title: Differentiation Durability and Competitive Pressure
        blocks:
          - type: paragraph
            body: >-
              Rhoda’s differentiation is credible but not yet durable on public evidence alone. The core thesis — causal
              video prediction should generalize better and use less robot data than VLA-heavy alternatives — is
              coherent, and it is meaningfully different from the dominant language-first framing of many peers. But
              architecture is not the durable moat in this category. Platform companies can imitate interface patterns,
              open-source developers can reproduce pieces of the stack, and buyers will ultimately care about error
              recovery, deployment throughput and supportability. Rhoda therefore has to turn its video-first head start
              into a data and deployment flywheel faster than better-capitalized rivals. Skild is already farther ahead
              on funding and public partner narrative. Physical Intelligence is farther ahead on open technical
              disclosure. Figure is farther ahead on disclosed industrial pilot proof. NVIDIA and Google are farther
              ahead on ecosystem leverage.


              The durable pressure points are distribution, benchmark visibility and switching costs. Once Rhoda is
              embedded in a customer workflow, integration complexity should create meaningful lock-in. Before that, the
              market is much softer. If the neutral-brain market commoditizes, NVIDIA and Google can collapse pricing
              through platform bundling; if customers prefer a single accountable vendor, Figure, Apptronik and
              Dexterity can win on full-stack reliability. Public pricing opacity and the absence of standardized
              cross-company benchmarks also make the current market unusually narrative-driven. For investors, the right
              question is less “is Rhoda’s approach technically interesting?” and more “can Rhoda convert technical
              distinctiveness into deployment density before incumbents and vertical players box it into a narrow
              niche?”
