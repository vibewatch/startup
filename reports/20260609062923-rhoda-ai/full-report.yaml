      - number: '5.3'
        title: How FutureVision Differs from VLA-Heavy Approaches
        blocks:
          - type: paragraph
            body: >-
              The sharpest way to state Rhoda’s thesis is this: many VLA systems are still too language-first and too
              short-context to close the “real-world gap.” Rhoda is not alone in using video or web-scale data, but it
              is more radical than most peers in making causal video prediction the policy itself. The system imagines
              the next part of the world and only then converts that imagined future into action. That differs from
              GR00T, GR-2 and Gemini Robotics, all of which remain clearly inside the VLA family even when they become
              more multimodal or use human video at scale. External commentary helps explain why Rhoda thinks this
              matters. Mimic Robotics argues VLA backbones inherit semantics but not physical dynamics, leaving
              expensive embodiment learning to scarce robot trajectories. The Kempner Institute similarly argues
              web-scale video captures physical transformations in a way image-text pretraining does not.


              That does not mean Rhoda has the field to itself. DreamGen and other world-model efforts show that more of
              the market is moving toward richer video pretraining. NVIDIA’s GR00T path is more open and
              benchmark-oriented, and Google’s Gemini Robotics claims stronger generalization metrics and broader
              embodiment reach through a VLA stack. In other words, Rhoda’s thesis is differentiated, but not isolated.
              The real question is whether its causal-video-first formulation delivers materially better robustness,
              sample efficiency and operational debugging in production. Public sources support the plausibility of that
              thesis, especially on context length and interpretability, but they do not yet prove it against
              standardized third-party baselines.
            claimRefs:
              - CE016
