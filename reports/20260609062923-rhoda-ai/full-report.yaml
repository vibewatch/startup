  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk landscape
        blocks:
          - type: paragraph
            body: >-
              Rhoda’s highest-severity risks all flow from one simple observation: the company is trying to
              commercialize general-purpose robotic intelligence in messy industrial settings before the public record
              shows a mature installed base. That creates a layered risk stack. The first layer is technical robustness:
              DVA may be more data-efficient and better at long-context reasoning than many alternatives, but a real
              factory or warehouse punishes every failure in ways a benchmark never will. The second layer is safety and
              liability. Once a robot is making fast, closed-loop physical decisions around people, poor supervision or
              weak failure monitoring can create worker-injury, property-damage, and product-liability exposure. The
              third layer is commercialization execution: Rhoda’s public customer surface is still unnamed, so investors
              cannot yet verify conversion, concentration, or renewal. The fourth layer is dependency risk: a
              hardware-agnostic model broadens TAM, but it also pushes success onto outside hardware, integration, and
              customer-operating stacks. Finally, there is market and valuation risk. Physical AI and humanoid
              enthusiasm is surging, but the field is crowded, expensive, and still thin on scaled revenue proof. Figure
              FR001 ranks the current public risk stack.
