      - number: '8.4'
        title: Recommendation, Thesis Breakers, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The cleanest public-evidence conclusion is TRACK / research-more, not an aggressive buy-up. The category
              tailwinds are obvious: labor shortages persist, automation budgets remain meaningful, AI budgets are
              expanding, and large investors are clearly willing to finance physical-AI platform bets. Rhoda also
              benefits from strong leadership signaling and a strategically attractive “robot intelligence layer”
              narrative. If the company later proves durable licensing economics across manufacturing and logistics,
              today’s price could look like an acceptable early waypoint rather than the peak.


              But current evidence does not yet justify underwriting that outcome with high confidence. The decisive
              missing items are basic: named paid customers, pricing structure, recurring revenue, gross margin,
              deployment retention, and proof that the model consistently works outside carefully selected evaluations.
              Until those are disclosed, the investment case is price-sensitive and evidence-sensitive rather than
              category-sensitive. Put differently: belief in physical AI is not enough; the question is whether Rhoda
              specifically can convert that belief into software economics that survive public-market scrutiny.


              The thesis breaks fastest if the next financing cycle still lacks named paid deployments and revenue
              disclosure, or if better-proven peers experience flat or down rounds that re-anchor the whole sector. The
              diligence agenda is therefore straightforward. Before paying materially above the reported current mark,
              an investor should demand site-level proof of paid usage, software take-rate clarity, implementation cost
              and margin data, and customer references that speak to uptime and expansion behavior. Without that, the
              prudent stance is to stay close, learn, and wait for evidence rather than for excitement.
