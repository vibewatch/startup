      - number: '3.2'
        title: Direct Peers, Adjacent Rivals and Platform Threats
        blocks:
          - type: paragraph
            body: >-
              Skild AI is Rhoda’s most obvious direct pressure point in 2026 because it is pursuing the same
              neutral-brain thesis with much more capital. Skild’s public case combines valuation, partner narrative and
              generalized-control ambition: $1.4 billion raised in January 2026, valuation above $14 billion, and an
              insistence that one shared model across many embodiments is the only scalable answer. Physical
              Intelligence is the closest technical peer. π0 is openly documented as a vision-language-action
              flow-matching model built on a pre-trained VLM and data from eight robots, and openpi makes that stack
              legible to developers and researchers. Figure is a different kind of rival: not neutral software, but a
              vertically integrated humanoid vendor whose Helix model, Figure 03 hardware and BotQ factory are all one
              thesis. Dexterity and FieldAI matter because they show that buyers still reward narrow, production-grade
              physical AI in warehousing and industrial field settings even when the broader “generalist” market remains
              unproven.


              NVIDIA and Google are the platform incumbents Rhoda cannot ignore. GR00T N1.7 is open, commercially
              licensable and backed by NVIDIA’s simulator, toolchain and compute ecosystem. Gemini Robotics is
              explicitly VLA-heavy, but Google claims stronger benchmark generalization and broader embodiment support
              than earlier models, plus a trusted-tester network spanning Apptronik, Agility and Boston Dynamics.
              Apptronik itself is less a direct model-lab rival than a strategic signal: if OEMs prefer a vertically
              integrated humanoid plus Gemini bundle, the neutral licensing layer gets squeezed. Covariant is a more
              distant but still relevant precedent because it represents the warehouse-AI route: workflow depth instead
              of hardware breadth. Publicly, however, its current official source surface is much thinner than the newer
              foundation-model labs, making it more of a precedent case than a lead benchmark.
