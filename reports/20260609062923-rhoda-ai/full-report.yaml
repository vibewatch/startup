  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market Boundary: Rhoda Sells the Intelligence Layer, Not the Whole Robot Stack'
        blocks:
          - type: paragraph
            body: >-
              Rhoda’s own launch materials consistently describe FutureVision as a robot intelligence system rather than
              as a robot OEM product. The company says its Direct Video Action architecture is an “intelligence layer”
              that can power Rhoda systems today and later be licensed across different robotic hardware and software
              platforms. That matters because it sharply narrows the relevant market boundary. The right comparison set
              is not total industrial robotics hardware, sensors, or plant automation capex. It is the software and
              model layer that makes variable, high-mix physical workflows automatable after the hardware is already
              present or being procured.


              This distinction is essential because most analyst robotics markets still bundle hardware-heavy
              categories. MarketsandMarkets’ AI robots market expects hardware to remain 61% of spend in 2025, even
              while software and services expand. Likewise, its physical AI market taxonomy includes hardware components
              such as GPUs, sensors, memory, and actuators alongside software and services. For Rhoda, those
              hardware-heavy numbers are useful as top-down context and as evidence that the installed base is getting
              large enough to support a software layer, but they are not revenue that Rhoda can directly capture.


              Public descriptions also point to Rhoda’s first beachheads: manufacturing and logistics environments with
              continuously changing materials, layouts, and workflows. In those settings, the incumbent alternatives are
              not just humans; they are combinations of fixed automation, bespoke robot programming, teleoperation-heavy
              training loops, and system integration projects that become expensive whenever workflows change. Rhoda’s
              wedge is the claim that a closed-loop, video-trained model can lower the marginal cost of adapting robots
              to new tasks. That makes the relevant included spend: robot intelligence software, world-model or
              policy-model licensing, task adaptation, orchestration, and related integration. Excluded spend includes
              the robot arms, grippers, mobile bases, storage racks, conveyors, and most site construction spend that
              dominate broader warehouse and factory automation budgets.
