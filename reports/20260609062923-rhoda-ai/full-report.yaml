      - number: '8.3'
        title: >-
          Public Automation Comps and Scenario Math: Today’s Mark Requires Faith in Future Revenue, Not Evidence of
          Current Revenue
        blocks:
          - type: paragraph
            body: >-
              Public automation businesses are not direct comps for Rhoda’s product model, but they are the best
              available guardrails for valuation discipline. As of the run date, Yahoo Finance showed Symbotic at about
              2.27x sales, Zebra at about 2.10x sales, and Rockwell at about 5.72x sales. Those companies are far more
              mature, with real revenue denominators and established commercial histories, so they should not be used to
              “value” Rhoda directly. But they are valuable as a sanity check on what scaled automation businesses look
              like when public investors can actually see revenue.


              The implication is stark. If Rhoda were to justify $1.7 billion at 5x revenue—a premium above Symbotic and
              Zebra but below Rockwell—it would need roughly $340 million of revenue. At 10x revenue, it would still
              need about $170 million. Public sources do not suggest anything close to that today, because public
              sources do not suggest any Rhoda revenue figure at all. That does not mean Rhoda cannot eventually grow
              into the valuation. It means the current mark is not grounded in an observable denominator.


              That leads to a three-case framework. The bear case assumes private marks normalize and Rhoda fails to
              convert pilots into disclosed recurring revenue; fair value then compresses toward roughly $0.9 billion to
              $1.3 billion. The base case assumes Rhoda converts technical promise into clearer paid deployments and
              revenue disclosure, supporting something around the current mark or modestly above it. The bull case
              assumes Rhoda becomes a credible multi-hardware software platform with visible licensing growth, lifting
              value into a $3 billion to $5 billion range over the next 24 months. All three cases are necessarily
              coarse because the missing denominator is the core problem.
            claimRefs:
