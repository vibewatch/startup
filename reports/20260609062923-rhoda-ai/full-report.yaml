      - number: '7.4'
        title: Competition, valuation, opacity, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Even if Rhoda executes technically, the company still has to win in a market that may punish delay and
              ambiguity. Physical AI and humanoid funding have become exceptionally aggressive. CNBC, citing Barclays,
              frames the humanoid market as potentially enormous by 2035, but the current base is still small and China
              already dominates manufacturing scale and cost structure. Humanoids Daily’s broader competition reporting
              places Rhoda in a crowded cohort alongside Figure, Tesla, 1X, and other well-capitalized entrants, and
              even supportive industry observers warn that the path to commercialization is long and full of engineering
              traps. Rhoda also carries a disclosure-opacity penalty. Official materials consistently call the March
              2026 round a Series A, but at least one secondary outlet called it a Series B, and the public narrative on
              whether Rhoda is primarily a hardware-agnostic brains layer or will also build its own hardware is
              similarly mixed. Those inconsistencies are not fatal, but they are the kind of ambiguity that can distort
              valuation comps and make diligence harder. The practical kill criteria are therefore measurable: failure
              to produce named reference customers, lack of visible safety or compliance milestones, weak conversion
              from pilots to paid deployments, or evidence that the broader market is commoditizing faster than Rhoda
              can build a proprietary deployment data moat.
