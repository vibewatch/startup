      - number: '2.4'
        title: 'Growth Drivers and Constraints: Real Demand Tailwinds, but Also Real Hype and Evidence Gaps'
        blocks:
          - type: paragraph
            body: >-
              The demand case for Rhoda-like software is straightforward. Manufacturers and warehouses still depend on
              millions of manual roles, BLS projects more than one million annual material-moving openings, and the U.S.
              Chamber still shows hundreds of thousands of open manufacturing jobs. NVIDIA’s 2026 retail and CPG survey
              suggests AI budgets are expanding, while UPS and DHL both frame 2026 logistics investment around
              resilience, visibility, software-defined warehouses, AMRs, and AI-assisted decision-making. Interact
              Analysis and Modern Materials Handling both show that even in a choppy macro environment, automation
              budgets continue to move.


              But the same sources also show why investors should resist physical-AI hype. McKinsey still sees capital
              cost and lack of internal experience as major blockers. Interact Analysis downgraded its mobile robot
              outlook more sharply than fixed automation and says uncertainty, tariffs, and higher steel costs are
              distorting project timing. Brownfield retrofits dominate because enterprises are careful with greenfield
              commitments. Even supportive sources increasingly frame the market around software-defined orchestration,
              service quality, and ROI discipline—not around unconstrained spend on any company calling itself “physical
              AI.”


              That leads to two explicit caveats. First, many published market numbers remain hardware-heavy, while
              Rhoda’s monetizable layer is only a slice of those budgets. Second, public evidence on Rhoda itself is
              still thin: there is no disclosed revenue, pricing, named paid customer roster, or published take rate by
              workflow. That does not negate the market opportunity, but it does mean the market case should be treated
              as a credible demand backdrop rather than as proof that Rhoda has already captured a durable software
              wedge. In other words, the category is real, but the specific commercial win is still an underwriting
              question.
