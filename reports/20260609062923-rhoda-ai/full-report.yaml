  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: Decision chain from category tailwinds and proof gaps to a TRACK / research-more stance.
    data:
      nodes:
        - id: n1
          label: Category tailwind
          detail: Physical-AI funding and AI budgets are clearly expanding in 2026.
          sentiment: positive
        - id: n2
          label: Team / strategy
          detail: Strong leadership and software-layer positioning are credible positives.
          sentiment: positive
        - id: n3
          label: Commercial proof
          detail: Pilots and production claims exist, but public customer and revenue proof does not.
          sentiment: mixed
        - id: n4
          label: Comparable set
          detail: Peers show the sector can command huge prices, but many marks are opaque.
          sentiment: mixed
        - id: n5
          label: Fundamental denominator
          detail: No public revenue or margin denominator for Rhoda today.
          sentiment: negative
        - id: n6
          label: Current valuation
          detail: $1.7B looks plausible as option value, not yet as fundamental value.
          sentiment: mixed
        - id: n7
          label: 'Recommendation: TRACK / research-more'
          detail: Stay close, but wait for disclosed customers, revenue, and economics before paying up.
          sentiment: neutral
      edges:
        - from: n1
          to: n6
          label: supports category upside
        - from: n2
          to: n6
          label: supports optionality
        - from: n3
          to: n7
          label: proof still incomplete
        - from: n4
          to: n6
          label: peer marks give context but not discipline
        - from: n5
          to: n7
          label: no denominator → wait
        - from: n6
          to: n7
          label: price-sensitive stance
    approximationNotes: Flow represents analyst judgment based on retained public evidence, not a company-published decision framework.
    claimRefs:
