  - id: FE001
    title: Product Architecture Map
    type: stack
    layout: wide
    summary: Five-layer stack showing how Rhoda turns web-scale video into deployed robot behavior.
    data:
      layers:
        - id: l1
          label: FutureVision Licensing Layer
          detail: Intelligence layer intended to power Rhoda systems first and partner platforms over time
        - id: l2
          label: Closed-Loop DVA Policy
          detail: Observe → predict future video → translate to action → re-observe
        - id: l3
          label: Inverse-Dynamics Translator
          detail: Small embodiment adapter converting predicted future into end-effector motion
        - id: l4
          label: Causal Video World Model
          detail: Long-context visual predictor trained from scratch on web-scale video
        - id: l5
          label: Training and Data Engine
          detail: Web video, context amortization, KV-cached inference, leapfrog control, robot post-training
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE006
      - CE007
      - CE008
  - id: FE002
    title: Customer Workflow / Operating Flow
    type: flow
    layout: wide
    summary: >-
      Operating flow from messy real-world task observation through DVA prediction, action translation and continuous
      recovery.
    data:
      nodes:
        - id: scene
          label: Observed work scene
          detail: Camera, proprioception and optional language capture current state
        - id: context
          label: Long-context history
          detail: Hundreds of frames preserve task progress and visual memory
        - id: predict
          label: Future video prediction
          detail: Causal video model imagines the near future
        - id: translate
          label: Inverse dynamics
          detail: Predicted future becomes robot action
        - id: act
          label: Robot executes
          detail: Actions run while next prediction is prepared
        - id: recover
          label: Closed-loop recovery
          detail: System re-observes, adapts and continues through edge cases
      edges:
        - from: scene
          to: context
          label: Appends observation
        - from: context
          to: predict
          label: Conditioning
        - from: predict
          to: translate
          label: Desired future
        - from: translate
          to: act
          label: Motor targets
        - from: act
          to: recover
          label: Real-world outcome
        - from: recover
          to: context
          label: Fresh state
