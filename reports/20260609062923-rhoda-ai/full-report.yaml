  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and DVA Architecture
        blocks:
          - type: paragraph
            body: >-
              Rhoda’s delivered product is not just a robot demo and not merely a research model; it is a proposed
              intelligence layer called FutureVision. In customer terms, FutureVision is meant to sit between sensors
              and actuation, observe the world continuously, predict future states as video and then convert those
              predictions into actions quickly enough for real-world control. That architecture matters because Rhoda is
              arguing against the dominant framing of robot foundation models as primarily vision-language-action
              systems. In Rhoda’s framing, language can still condition the model, but the center of gravity is causal
              video prediction: the world moves in time, so the control policy should learn motion, physics and physical
              interaction directly from video rather than rely mostly on teleoperated robot trajectories.


              The official research blog makes the architecture unusually explicit. DVA starts with a causal video model
              trained from scratch on web-scale video. Rather than predicting only a few frames after encoding an entire
              sequence, Rhoda uses a training method called Context Amortization to predict future frames at every
              position in a long history of clean context. At runtime, KV-caching reuses the encoded context so the
              system does not repeatedly pay the full compute cost of long-horizon conditioning. The predicted future is
              then handed to a separate inverse-dynamics model that infers the precise end-effector motion needed to
              realize the imagined outcome. Rhoda’s Leapfrog Inference overlaps ongoing action execution with the next
              prediction cycle so the system keeps moving while the model thinks. This is a specific and coherent stack,
              and it is the chapter’s key technical differentiator.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
