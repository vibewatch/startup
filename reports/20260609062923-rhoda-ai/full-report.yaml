      - number: '5.2'
        title: Data Efficiency, Long-Context Memory and Use-Case Evidence
        blocks:
          - type: paragraph
            body: >-
              Rhoda’s strongest product claim is data efficiency. The company says DVA can learn new long-horizon
              industrial tasks with roughly 10–20 hours of robot data once the causal video model has already absorbed
              motion priors from web-scale video. The two flagship use cases are both intentionally ugly: bearing
              decanting and Contico container breakdown. Bearing decanting reportedly required only 11 hours of task
              data yet still handled broken straps, torn bags, off-angle boxes and other corner cases for 1.5 hours of
              continuous operation. Container breakdown reportedly used 17 hours of robot data and then ran for 160
              minutes continuously while dealing with heavy boxes, partial observability and random debris. The official
              materials frame both as production-style customer proofs of concept rather than controlled lab benchmarks.


              Long-context visual memory is the second defining capability. Rhoda explicitly contrasts hundreds of
              frames of native context with VLA systems that often operate on only a few frames. The shell-game example
              is a toy benchmark for this capability: the object disappears, shells shuffle, and the model must still
              keep state over time. More commercially relevant is returns processing, which Rhoda says runs end-to-end
              without hand-engineered progress indicators or multi-stage scaffolding. The one-shot sorting and drawing
              demos extend the same idea from memory to in-context imitation: a single human demonstration is injected
              into the context window and the robot imitates the demonstrated intent without weight updates. These are
              compelling mechanisms and demos, but they are still company-authored evidence rather than independent
              benchmark results.
