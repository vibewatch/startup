      - number: '7.2'
        title: Safety, regulatory, and liability risk
        blocks:
          - type: paragraph
            body: >-
              The legal and safety burden on Rhoda is real even though the company is still pre-disclosure on many
              operational details. OSHA notes that robot accidents frequently happen during non-routine states such as
              setup, maintenance, testing, and adjustment, and it also notes that the United States still lacks a
              robotics-specific OSHA standard. That means deployers must stitch safety together from broader
              machine-guarding and workplace-safety duties rather than relying on a single clean rulebook. NIOSH’s
              robotics center exists precisely because injury monitoring and safety practice for collaborative, mobile,
              and AI-enabled robots remain evolving areas. Europe adds another layer: the EU AI Act explicitly links AI
              regulation to health and safety harms, while the new Machinery Regulation incorporates AI-powered safety
              functions and cyber-safety. Existing ISO standards already outline safe design, system integration, and
              collaborative-robot expectations. Legally, the most important point is that Rhoda cannot assume a customer
              absorbs the downside if something goes wrong. Brookings explains that negligence, design defect, and
              failure-to-warn doctrines can all apply to AI systems, while Harvard’s oversight analysis argues that a
              human in the loop is not a sufficient defense unless real robustness, monitoring, and collaboration
              systems exist. Because Rhoda has not publicly disclosed certifications, monitoring frameworks, or
              insurance terms, residual liability exposure remains high.
            claimRefs:
