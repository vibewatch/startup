        - $1.5B-$2.2B; current mark roughly fair with modest upside
        - Long sales cycles, margin uncertainty, budget gating
        - Medium
      - - Bear
        - Revenue remains undisclosed, sector multiples compress, and better-proven peers reset expectations
        - $0.9B-$1.3B; downside from current mark
        - Private-market reset, weak pilot conversion, slower procurement
        - Medium
      - - Price discipline
        - Investor refuses to pay up before new disclosure
        - Return comes from waiting for denominator clarity, not from immediate momentum
        - Could miss upside if Rhoda executes quickly
        - Prudent default
