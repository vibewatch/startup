  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Current Round Context: A Huge Series A, but Still an Opaque Fundamental Picture'
        blocks:
          - type: paragraph
            body: >-
              Rhoda’s March 2026 round is notable first for scale. A $450 million Series A is one of the largest
              early-stage financings in the robotics and physical-AI category, and multiple secondary outlets place the
              valuation at roughly $1.7 billion. That absolute mark is not the most extreme in the current cycle, but it
              is still a very large price for a company with no publicly disclosed revenue denominator, gross margin
              profile, customer count, or contract economics. In other words, the round is large enough to signal strong
              investor conviction, but not transparent enough to let an outside investor translate the mark into a
              disciplined multiple.


              Public evidence around the round also contains quality issues. Rhoda and Wilson Sonsini call the financing
              a Series A, while at least one secondary outlet labeled it a Series B. That inconsistency does not change
              the cash raised, but it is a useful reminder that private-market metadata in physical AI is noisy and that
              diligence should privilege official sources over aggregator narratives. The same pattern shows up in what
              is missing: Rhoda discloses industrial deployments and customer pilots, yet no public source identifies
              paid customer names, ARR, pricing structure, or retention behavior.


              The positive interpretation is that the market is underwriting option value on a credible team attacking a
              hard problem. Rhoda’s leadership bench is strong, and its stated software-layer ambition is strategically
              appealing. The negative interpretation is that the current price is being justified mainly on narrative
              and future optionality rather than on observed commercialization. For an investor trying to decide whether
              to chase a higher entry, that distinction matters more than the headline size of the round itself.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
