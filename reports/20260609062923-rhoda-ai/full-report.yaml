  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Illustrates how Rhoda’s likely enterprise customer journey moves from workflow discovery to technical validation
      and, eventually, scaled licensing or site expansion.
    data:
      nodes:
        - label: Problem discovery
          description: Plant or warehouse leaders identify variable physical tasks that scripted robotics has not solved well.
          actors: Operations VP, automation lead
          examples: Returns processing, heavy-material decanting, container breakdown
        - label: Workflow evaluation
          description: Rhoda maps one workflow and demonstrates DVA-based handling of ambiguity, force, or long-horizon memory.
          actors: Rhoda solutions team, customer engineering
          examples: Automotive decanting, logistics returns
        - label: Customer proof of concept
          description: >-
            A task-specific post-training phase uses small amounts of robot data and runs in a real customer setting for
            hours without intervention.
          actors: Customer engineering, robotics operators
          examples: 11-hour and 17-hour data examples in the DVA blog
        - label: Production-environment validation
          description: >-
            Rhoda publicizes at least one high-volume manufacturing evaluation with a customer KPI under two minutes per
            cycle.
          actors: Manufacturing leadership, site operations
          examples: Component-processing workflow
        - label: Expansion or licensing
          description: >-
            Commercial upside comes from repeat deployments, multi-site rollouts, or software licensing across other
            robot platforms.
          actors: Procurement, corporate automation strategy
          examples: Industrial deployments, customer pilots, future partner licensing
    approximationNotes: >-
      Stages are synthesized from official language about customer pilots, production-environment evaluations, and
      future licensing plans. No public timeline by account is disclosed.
    claimRefs:
      - CU003
      - CU010
      - CU011
      - CU014
      - CU017
