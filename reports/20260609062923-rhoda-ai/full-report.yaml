      - number: '1.3'
        title: Funding Base, Investors, and Legal Footprint
        blocks:
          - type: paragraph
            body: >-
              Rhoda’s public debut was paired with a very large financing announcement for a company only just emerging
              from stealth. Official launch materials and legal-adviser coverage corroborate a $450 million Series A
              announced on 10 March 2026, while multiple secondary sources place the valuation around $1.7 billion. The
              investor list is broad and high quality, spanning Premji Invest, Khosla Ventures, Temasek, Mayfield,
              Capricorn, Prelude Ventures, Xora, and John Doerr among others. That syndicate provides strategic signal
              as well as capital, but it does not fully resolve how concentrated the round leadership really was.


              Lead attribution is a good example of why later underwriting should rely on signed financing documents
              rather than media summaries. Rhoda’s own release names backers without assigning a single lead. Wilson
              Sonsini describes the round as led by a multi-name syndicate. Several secondary articles instead call
              Premji Invest the lead investor, while some third-party trackers even mislabel the round as Series B. On
              the legal side, California registry data shows Rhoda AI Corporation as an active Delaware corporation
              incorporated on 1 August 2024, with a San Jose registered address. That does not necessarily contradict
              Palo Alto as the operating HQ, but it does mean the public legal footprint and public operating-location
              language are not identical. The important takeaway is that the company’s capital base is strong, but the
              public metadata around stage, lead investor, and formation details is noisier than the headline coverage
              suggests.
