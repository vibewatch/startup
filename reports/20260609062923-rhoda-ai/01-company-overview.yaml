company:
  name: Rhoda AI
chapter:
  number: 1
  title: Company Overview
  summary: Rhoda AI is a Palo Alto robotics-intelligence startup that exited stealth on 10 March 2026 with FutureVision and a $450 million Series A. The public record shows a technically credible founder-scientist bench and strong investor syndicate, but still leaves material gaps around exact founding chronology, governance, customer identity, revenue, and other cover metrics. Rhoda’s strongest public signals today are DVA/FutureVision differentiation, industrial workflow demos, and unusually aggressive hiring rather than independently validated financial traction.
sections:
- id: identity-business-overview
  title: Identity, Product, and Operating Model
  body: |-
    Rhoda AI emerged publicly on 10 March 2026 after an 18-month stealth period, framing itself as a Palo Alto robotics-intelligence company focused on moving generalist robots out of lab demos and into production environments. Across the official site, press materials, and launch coverage, the company consistently presents FutureVision as the commercial intelligence layer and Direct Video Action (DVA) as the underlying technical bet. The pitch is not just “better robot policies,” but a different learning stack: Rhoda pre-trains on web-scale video, then post-trains on smaller amounts of robot data so the system can generalize in environments that are too variable for classic industrial automation.

    The operating model also looks hybrid rather than purely software or purely hardware. Rhoda says FutureVision is intended to be licensed over time across partner hardware and software platforms, but the home page also markets a Rhoda robot platform with custom actuators, safety-rated vision, and payload claims that imply internal hardware development. Public examples concentrate on industrial manipulation rather than consumer robotics: returns processing, bearing decanting on an automotive line, heavy container breakdown, and demo-following tasks. That gives the company a credible manufacturing/logistics wedge, but it also means the business must prove it can convert technical demos into repeatable commercial deployments rather than one-off pilot wins.
