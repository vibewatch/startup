evidenceGaps:
  - type: missing-source
    severity: material
    topic: founding-date
    missingEvidence: >-
      Primary-source documentation that pinpoints the exact company founding date before or alongside the August 2024
      registry record.
    whyItMatters: Without a precise founding date, the early chronology relies on formation proxies and stealth duration language.
    diligencePath: Request incorporation docs, founding paperwork, or founder-confirmed timeline in diligence.
    relatedQuestionRefs:
      - QO013
      - QO026
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board composition, governance rights, and any board-observer allocations for the launch financing.
    whyItMatters: Governance structure affects underwriting of control, oversight, and follow-on financing behavior.
    diligencePath: Request cap table, board deck, and financing documents; validate any investor board rights.
    relatedQuestionRefs:
      - QO017
      - QO021
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: cover-metric-gaps
    missingEvidence: Exact employee count, customer count, revenue, ARR, and public pricing or contract-structure data.
    whyItMatters: These are the cover metrics later chapters need for clean underwriting, but the public record remains sparse.
    diligencePath: Obtain management KPI pack, HR census, customer list, and pricing / contract samples under NDA.
    relatedQuestionRefs:
      - QO012
      - QO022
      - QO023
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: lead-investor-conflict
    missingEvidence: Signed financing documents or cap table entries that resolve whether any investor formally led the round.
    whyItMatters: Secondary coverage conflicts on round leadership, which reduces trust in later cap-table summaries.
    diligencePath: Confirm lead-investor language directly from closing docs or management.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: deployment-validation
    missingEvidence: Independent customer or integrator attestations for the manufacturing and logistics workflows cited publicly.
    whyItMatters: >-
      Commercial significance hinges on whether launch proof points are repeatable paid deployments or controlled
      pilots.
    diligencePath: Request site references, KPI dashboards, and at least one customer interview tied to the disclosed workflows.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: rhoda-pricing
    missingEvidence: >-
      Public pricing, contract structure, and whether Rhoda charges per site, per workflow, per robot, or per inference
      cycle.
    whyItMatters: >-
      Without a pricing model, software take-rate and SOM math remain speculative even if the broader market is
      attractive.
    diligencePath: Request pilot statements of work, pricing sheets, and any partner revenue-sharing terms.
    relatedQuestionRefs:
      - QM024
      - QM025
  - type: private-evidence-only
    severity: material
    topic: paid-deployments
    missingEvidence: Named paying customers, active site count, and renewal or expansion evidence.
    whyItMatters: Pilots and demos do not prove that budget owners will convert to recurring software spend.
    diligencePath: Request customer references, deployment counts, and proof of paid renewal or expansion.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: software-share
    missingEvidence: >-
      Independent estimate of what percentage of target-site automation budgets is captured by intelligence software
      versus hardware and integration.
    whyItMatters: >-
      Most public robotics TAMs remain hardware-heavy, which can inflate Rhoda’s apparent addressable market if used
      without adjustment.
    diligencePath: >-
      Benchmark software attach rates from comparable automation vendors and integrators in manufacturing and
      warehousing.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: safety-and-uptime
    missingEvidence: Independent uptime, safety, and error-rate benchmarks for Rhoda systems in production settings.
    whyItMatters: >-
      Enterprise buyers rank reliability and support above novelty, so benchmark proof matters for real procurement
      probability.
    diligencePath: Ask for third-party validation reports or customer KPI scorecards from live sites.
    relatedQuestionRefs:
      - QM015
      - QM024
  - type: missing-source
    severity: material
    topic: competitive-benchmarking
    missingEvidence: Standardized head-to-head benchmarks comparing Rhoda against named peers on identical industrial tasks.
    whyItMatters: Without cross-company baselines, competitive claims remain narrative-heavy and underwrite poorly.
    diligencePath: Request controlled evaluations against at least one VLA baseline, one open model and one production specialist.
    relatedQuestionRefs:
      - QP022
      - QP023
  - type: private-evidence-only
    severity: material
    topic: pricing-and-terms
    missingEvidence: Actual software pricing, support terms and deployment economics for Rhoda and most direct peers.
    whyItMatters: Buyer choice may turn more on total integration cost than on model quality.
    diligencePath: Ask management for pilot pricing, uptime commitments, and the services burden required for each deployment.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP003
  - type: enumeration-incomplete
    severity: minor
    topic: covariant-and-adjacent-precedents
    missingEvidence: A fuller primary-source picture on Covariant and other warehouse AI adjacencies.
    whyItMatters: The chapter can still map major pressures, but one adjacent category remains thinner than ideal.
    diligencePath: Run a focused follow-up on Covariant official materials and post-Amazon commercial positioning.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: blocking
    topic: rhoda-durability-proof
    missingEvidence: Cohort-level deployment retention, failure-rate distributions, and pilot-to-production conversion data for Rhoda.
    whyItMatters: Those metrics determine whether Rhoda’s neutral-brain thesis becomes durable or stays experimental.
    diligencePath: Request customer-by-customer pilot outcomes, time-to-production, and post-deployment support load.
    relatedQuestionRefs:
      - QP023
  - type: private-evidence-only
    severity: material
    topic: revenue-gap
    missingEvidence: Latest monthly revenue, ARR, and split between recurring software, services, and any hardware-adjacent revenue.
    whyItMatters: Without top-line and revenue-mix data, valuation and revenue quality cannot be underwritten.
    diligencePath: Request management-certified revenue bridge plus contract-type segmentation.
    relatedQuestionRefs:
      - QI004
      - QI024
      - QI025
    relatedTableRefs:
      - TI001
      - TI005
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: List pricing, realized pricing, discounting, ACV distribution, and contract duration.
    whyItMatters: Monetization structure determines whether Rhoda can ever look like a software business economically.
    diligencePath: Review customer order forms, rate cards, and executed licensing agreements.
    relatedQuestionRefs:
      - QI005
      - QI006
      - QI024
    relatedTableRefs:
      - TI002
      - TI005
  - type: private-evidence-only
    severity: material
    topic: runway-gap
    missingEvidence: Cash balance, monthly burn, quarterly budget, and scenario runway.
    whyItMatters: Public round size alone cannot support a runway view, especially in compute-heavy robotics.
    diligencePath: Obtain board budget pack and 12-month cash forecast.
    relatedQuestionRefs:
      - QI017
      - QI018
      - QI023
      - QI026
    relatedTableRefs:
      - TI004
  - type: missing-source
    severity: material
    topic: unit-economics-gap
    missingEvidence: Gross margin by stream, CAC, payback, renewal, churn, and NRR.
    whyItMatters: Without unit economics, there is no factual basis for a margin-path or valuation-quality view.
    diligencePath: Request cohort economics and customer renewal analytics.
    relatedQuestionRefs:
      - QI007
      - QI012
      - QI025
    relatedTableRefs:
      - TI003
      - TI005
  - type: conflicting-data
    severity: minor
    topic: stage-and-lead-noise
    missingEvidence: Signed financing docs that resolve lead-investor language and eliminate stage misclassification from trackers.
    whyItMatters: Conflicting metadata increases the risk of building later diligence on noisy secondary sources.
    diligencePath: Verify round classification and lead/anchor structure from closing documents.
    relatedQuestionRefs:
      - QI014
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: customer-proof
    missingEvidence: Named customers, customer concentration, and third-party deployment attestations.
    whyItMatters: Pilot narrative without named accounts cannot prove commercial durability or predictability.
    diligencePath: Request top-customer list, reference calls, and site KPI reports.
    relatedQuestionRefs:
      - QI021
      - QI022
      - QI024
    relatedTableRefs:
