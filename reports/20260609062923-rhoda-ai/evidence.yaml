  - type: missing-source
    severity: blocking
    topic: safety-certification
    missingEvidence: >-
      Third-party safety certification, external audit, or formal validation documents for the DVA stack and robot
      platform.
    whyItMatters: Industrial underwriting needs more than homepage safety language and research-blog interpretability claims.
    diligencePath: Request certification status, test protocols, incident logs and external audit artifacts.
    relatedQuestionRefs:
      - QE023
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: benchmarking
    missingEvidence: Independent standardized task benchmarks versus named VLA and world-model baselines.
    whyItMatters: Without apples-to-apples comparisons, architecture differentiation remains plausible but not fully proved.
    diligencePath: Ask Rhoda for side-by-side evaluations against at least GR00T, Gemini or another published baseline.
