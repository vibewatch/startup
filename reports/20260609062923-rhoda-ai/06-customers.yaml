chapter:
  number: 6
  title: Customers
  summary: 'Rhoda AI’s public customer evidence is stronger at the workflow and vertical level than at the account level: the company shows real customer tasks in logistics, automotive, and manufacturing, but it does not publicly name the accounts behind those demonstrations. Official materials do support that Rhoda is selling into enterprise industrial use cases with a buyer likely anchored in operations, manufacturing engineering, and logistics leadership, and they show concrete workflow fit in returns processing, decanting, and materials-handling tasks. The central diligence issue is commercialization proof, not technical imagination: investors still need named references, ROI and renewal data, and a clearer read on how many pilots have converted into scaled deployments.'
sections:
- id: customer-surface
  title: Public customer surface and target segment
  body: 'Rhoda’s customer story is visible, but mostly through workflows rather than logos. The homepage explicitly says the company works with customers across automotive, manufacturing, logistics, and ecommerce, and then anchors that claim with three task examples: returns processing for a logistics customer, bearing decanting from an automotive assembly line, and Contico breakdown in a manufacturing context. That is enough to identify the core commercial wedge. The likely buyer is not a consumer or small business team; it is an enterprise operations or manufacturing organization trying to automate variable physical work that conventional scripted robotics has struggled to handle. The likely users are plant technicians, robotics engineers, and line or warehouse supervisors, while the payer is the industrial enterprise itself through a capital-equipment or automation budget. The official contact flow is also consultative rather than self-serve, reinforcing an enterprise-sales motion. What
    remains absent is equally important. The public customer surface does not enumerate customer count, named accounts, contract structure, or geography beyond broad industrial verticals, so this chapter treats Rhoda as a company with genuine early customer activity but still-limited public account disclosure.'
