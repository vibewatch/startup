- id: durability-and-expansion
  title: Durability, expansion, and concentration need direct diligence
  body: 'Public materials support a plausible land-and-expand narrative, but they do not yet prove it. Rhoda says funding will expand industrial deployments and customer pilots, and Reuters says the platform is designed to work across a wide range of robotic hardware so manufacturers and logistics operators can deploy intelligent robots without rebuilding existing systems. That is commercially attractive because it lowers the buyer’s migration burden and could let Rhoda sell an intelligence layer into existing fleets rather than only bundled proprietary robots. But the missing retention data is substantial. None of the official pages reviewed discloses customer count, contract length, renewals, NRR, GRR, churn, or satisfaction. There is also no public ROI or payback disclosure from the manufacturing evaluation or the logistics workflow. As a result, the central commercialization question is not whether Rhoda can demo interesting tasks; it is whether those tasks repeat across sites and persist
    across budget cycles. Without named references, the company also carries an elevated concentration risk: a small number of pilot-heavy industrial accounts could dominate learning and revenue, but the market cannot currently measure that exposure.'
