- id: deployment-proof
  title: Workflow proof is real, but account proof is still incomplete
  body: 'The positive read is that Rhoda’s evidence is not limited to glossy lab clips. The March 2026 launch materials say the company has demonstrated autonomous operation in production environments, and they quantify at least one recent high-volume manufacturing evaluation at under two minutes per cycle without human intervention. The deeper technical research post goes further: Rhoda says two example customer tasks were real customer proof-of-concepts that ran for multiple hours without intervention, including a decanting workflow that used 11 hours of task data and a container-breakdown workflow that used 17 hours. Those are meaningful signs that the company is tackling deployment-grade variability rather than only benchmark-friendly manipulation tasks. The caveat is that the public record still stops short of reference-grade customer proof. The official pages do not name the logistics account, the automotive assembly account, or the customer behind the high-volume manufacturing evaluation.
    Third-party outlets add color — including one report of operation in a very large automotive factory — but they still do not convert the evidence into named deployer references. In diligence terms, Rhoda has public workflow proof and early deployment proof, but not yet public account proof.'
