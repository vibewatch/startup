  evidenceGaps:
  - type: missing-source
    severity: material
    topic: safety-certifications
    missingEvidence: Named certifications, conformity-assessment status, and any CE or ISO audit outputs for Rhoda-enabled deployments.
    whyItMatters: Safety and liability risk cannot be right-sized without knowing whether Rhoda is already operating inside a formal certification regime.
    diligencePath: Request the company’s safety case, conformity files, and any external audit or certification reports.
    relatedQuestionRefs:
    - QR011
    - QR026
    - QR028
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: incident-and-monitoring-data
    missingEvidence: Intervention rates, near misses, incident logs, and post-market monitoring procedures for customer deployments.
    whyItMatters: A robotics company can look strong in demos but still fail operationally if intervention rates are high or incident handling is immature.
    diligencePath: Request deployment dashboards and post-market monitoring SOPs for each production or pilot site.
    relatedQuestionRefs:
    - QR026
    - QR029
    relatedTableRefs:
    - TR002
    - TR005
  - type: missing-source
    severity: material
    topic: hardware-and-oem-dependencies
    missingEvidence: Named robot OEMs, integrators, sensors, and compute dependencies that sit underneath Rhoda’s hardware-agnostic strategy.
    whyItMatters: Dependency risk cannot be ranked precisely when the underlying hardware and integrator stack is undisclosed.
    diligencePath: Request a current bill-of-materials dependency map and integration partner list for deployed systems.
    relatedQuestionRefs:
    - QR013
    - QR027
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: insurance-and-indemnity
    missingEvidence: Insurance coverage, contractual indemnities, and failure-allocation terms for workplace incidents or property damage.
    whyItMatters: Product-liability exposure changes materially depending on who bears operational, design, and warning risk in customer contracts.
    diligencePath: Request customer contract schedules, insurance certificates, and indemnity carve-outs.
    relatedQuestionRefs:
    - QR008
    - QR028
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: minor
    topic: funding-and-strategy-consistency
    missingEvidence: A reconciled explanation for conflicting secondary descriptions of the funding round and hardware strategy.
    whyItMatters: Conflicting external narratives are not fatal on their own, but they can complicate market understanding and valuation comps.
    diligencePath: Ask management to reconcile funding-round labels, total raised history, and hardware-vs-software strategy in one written note.
    relatedQuestionRefs:
    - QR023
