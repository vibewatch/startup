  title: Customer segmentation table
  columns:
  - segment
  - buyer/user/payer
  - use case
  - scale
  - revenue/strategic value
  - gap
  rows:
  - - Automotive manufacturing
    - Plant operations, manufacturing engineering, automation leaders
    - Assembly support, intralogistics, repetitive handling, ergonomically difficult work
    - Very large; multi-plant environments with repeatable workflows
    - Best fit for Walden’s current public proof because Toyota is already the anchor environment
    - No public pricing, plant count served, or task-level ROI
  - - Aerospace / defense manufacturing
    - Production, quality, and safety-sensitive industrial teams
    - Complex manufacturing and support tasks where labor and safety matter
    - Large but slower-moving enterprise accounts
    - Boeing investment suggests strategic relevance and future demand adjacency
    - No public evidence Boeing is a customer or pilot site
  - - Electronics / advanced manufacturing
    - Factory operations, automation and process engineers
    - High-mix precision handling, assembly, or internal logistics
    - Potentially large global footprint
    - Samsung’s robotics and AI-factory strategy supports fit with sophisticated manufacturing buyers
    - No public evidence Samsung or portfolio companies are Walden customers
  - - Warehousing / logistics inside industrial campuses
    - Operations leaders and site managers
    - Material handling and repetitive movement tasks
    - Large but less evidenced than automotive
    - Walden launch materials mention logistics-oriented physical work
    - No named warehouse/logistics customer disclosed
  - - General industrial enterprises
    - Operations and automation buyers at large manufacturers
    - Task-by-task deployment where fixed automation is too rigid
    - Potentially broad long tail after early references
    - Could broaden TAM once anchor deployments prove ROI
    - No public segment penetration or conversion data
  notes: Segment value is inferred from Walden’s launch framing plus the manufacturing footprints of its named strategic backers and anchor environment.
