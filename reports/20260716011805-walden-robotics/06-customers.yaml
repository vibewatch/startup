  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-count-and-stage
    missingEvidence: Named account list, customer count by stage, and paid-versus-pilot deployment breakdown.
    whyItMatters: Without it, investors cannot separate a credible anchor deployment from a still-concentrated customer base.
    diligencePath: Request CRM export or board customer KPI pack with named accounts, stage, paid status, and expected close or expansion dates.
    relatedQuestionRefs:
    - QU010
    - QU012
    - QU024
    relatedTableRefs:
    - TU003
    - TU004
  - type: private-evidence-only
    severity: material
    topic: retention-and-expansion
    missingEvidence: Renewal rates, contract terms, repeat-site expansions, NRR/GRR, and customer referenceability.
    whyItMatters: These metrics determine whether Toyota is the start of a scalable installed base or a one-off proof point.
    diligencePath: Request contract summaries, renewal dashboard, site-expansion history, and customer references under NDA.
    relatedQuestionRefs:
    - QU016
    - QU017
    - QU018
    - QU023
    relatedTableRefs:
    - TU005
    - TU006
  - type: private-evidence-only
    severity: material
    topic: deployment-economics
    missingEvidence: Customer ROI, utilization, uptime, and task-level productivity impact for the Toyota deployment.
    whyItMatters: The commercial case only scales if customers achieve repeatable economic gains from deployment.
    diligencePath: Request deployment scorecards, shift-level utilization, labor-substitution or throughput impact, and any shared customer ROI analysis.
    relatedQuestionRefs:
    - QU013
    - QU023
    relatedTableRefs:
    - TU003
    - TU005
  - type: private-evidence-only
    severity: material
    topic: buyer-and-budget-owner
    missingEvidence: Specific buyer persona, procurement path, and capital-versus-opex budget owner inside target customers.
    whyItMatters: Enterprise robotics adoption can stall even when technical interest is high if internal ownership is unclear.
    diligencePath: Request win/loss notes, champion titles, procurement timeline, and objection patterns from active deals.
