- id: constraints-regulation-and-timing
  title: Constraints, regulation, and why timing remains the market’s hardest variable
  body: The strongest adoption constraints are not conceptual but operational. Bain’s analysis says most humanoid deployments remain in pilot phases, often in highly structured environments and with significant human oversight. It also highlights an autonomy gap, handling limitations, and battery performance that still falls short of a full unattended shift. Humanoid.guide points to dexterous hands, safety-by-design, and certification as hard gates to scale. The legal and regulatory layer reinforces that caution. The EU AI Act adds AI-governance obligations to certain systems, while the EU Machinery Regulation covers physical machine safety for advanced robots. OSHA notes that the U.S. lacks a dedicated robotics standard and instead points deployers toward a patchwork of existing standards and guidance, which increases integrator burden. Legal commentary from Hill Dickinson, MLT Aikins, and Today’s General Counsel further emphasizes unresolved questions around liability allocation, cyber-physical
    risk, and labor-law compliance when robots and embodied AI work alongside people. For Walden, this means the market is large enough to justify investment today, but still gated enough that commercialization speed will depend on how quickly specific workflows clear safety, trust, and economic proof rather than on how impressive headline TAM claims appear.
