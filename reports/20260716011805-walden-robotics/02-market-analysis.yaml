callouts:
- calloutType: insight
  title: The industrial robot market is already real; the humanoid wedge is the immature layer on top of it.
  body: Walden does not need to prove that factories buy automation at all. It needs to prove that general-purpose physical-AI robots can win inside the subset of tasks where fixed automation or pure human labor is currently a poor fit.
  claimRefs:
  - CM005
  - CM008
  - CM017
  - CM039
- calloutType: strength
  title: Automotive manufacturing is the best near-term entry point.
  body: Automotive plants combine labor pressure, repetitive support tasks, strong safety culture, and high throughput sensitivity. Public deployments from Walden, Agility, and Boston Dynamics all point at automotive as a credible first beachhead.
  claimRefs:
  - CM001
  - CM025
  - CM026
  - CM039
- calloutType: risk
  title: Market size headlines still overstate near-term revenue liquidity.
  body: Humanoid TAM forecasts and venture inflows are useful indicators of enthusiasm, but Bain, Humanoid.guide, and legal/regulatory sources all argue that practical deployment remains gated by safety, runtime, integration, and accountability.
  claimRefs:
  - CM011
  - CM012
  - CM015
  - CM016
  - CM017
  - CM018
  - CM019
  - CM036
  - CM037
  - CM038
- calloutType: assumption
  title: Walden’s early SAM is probably smaller and better than generic TAM suggests.
  body: If Walden keeps prioritizing structured industrial support tasks and wheeled mobility, its near-term market may be smaller than broad humanoid rhetoric implies but commercially more reachable because customer pain is concrete and retrofit demands are lower.
