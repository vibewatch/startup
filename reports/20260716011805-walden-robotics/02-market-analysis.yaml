  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: walden-sam
    missingEvidence: A clean Walden-specific SAM or SOM estimate grounded in target workflows, facility counts, pricing, and achievable deployment density.
    whyItMatters: Headline humanoid TAM figures are too broad to support underwriting; investors need the specific subset Walden can address in the next few years.
    diligencePath: Build a bottom-up model from target sectors, facilities, workflow counts, robot-per-site assumptions, and realized pricing or RaaS terms.
    relatedQuestionRefs:
    - QM022
    - QM023
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: roi-benchmarks
    missingEvidence: Public payback periods, labor-substitution rates, uptime metrics, and task-level ROI for factory humanoid deployments.
    whyItMatters: Adoption will depend on whether robots save enough labor or downtime cost to justify procurement, integration, and safety overhead.
    diligencePath: Request customer case studies with time-to-value, utilization, uptime, and avoided labor or quality costs.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM004
  - type: enumeration-incomplete
    severity: material
    topic: secondary-vertical-depth
    missingEvidence: Vertical-by-vertical evidence for aerospace, semiconductors, electronics, and life-sciences demand depth beyond launch-era naming.
    whyItMatters: Walden’s broader industry list may be commercially meaningful, but current public evidence is too thin to know which adjacencies are real sales wedges versus narrative placeholders.
    diligencePath: Collect named pilot or design-partner evidence by vertical, including task categories, plant types, and safety constraints.
    relatedQuestionRefs:
    - QM024
