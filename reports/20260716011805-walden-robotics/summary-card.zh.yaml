  topStrengths:
    - 创始人与市场匹配度、技术血统都很强：Walden 继承 TRI 脉络，由 Russ Tedrake 领导；他是机器人学术界和应用界最知名的领军人物之一。
    - 对一家刚公开亮相的机器人创业公司来说，真实工厂证据来得异常早；Walden 称自 2026 年 2 月起已在 Toyota North America 工厂内生产性部署。
    - $300 million 种子轮让 Walden 在规模化证据出现前，就拿到多数硬件创业公司难以企及的研发和商业化现金跑道。
    - Toyota 关联实体、NVIDIA、Boeing、Samsung Ventures 等战略投资者入场，带来生态入口，可能加快部署并提升可信度。
    - Walden 先打工业场景，比纯人形机器人表演更务实；它看起来瞄准的是存量制造现场落地，而不只是演示。
  topRisks:
    - 公开财务披露太薄，无法支撑有把握的估值承销：收入、毛利率、烧钱速度、现金跑道和股权结构条款均未披露。
    - 当前公开记录显示客户集中风险极高：证据仍围绕一个 Toyota 部署，而不是多元化生产客户群。
    - 对一家刚走出隐身模式的公司来说，当前 $1.1 billion 估值已经提前计入了相当多预期执行成功。
    - 已部署机器人的安全性、在线率和运营可靠性数据未公开，技术血统与运营证据之间仍有大缺口。
    - Figure、Apptronik、Agility、Physical Intelligence、Tesla 等资本充足的 physical-AI 项目都在挤压赛道，竞争很激烈。
  unresolvedGaps:
    - Toyota 部署的付费经济性，包括定价模式、毛利率、支持负担和客户 ROI。
    - Toyota 之外的客户宽度，包括试点、生产客户和同一客户多站点扩张证据。
    - 可靠性和安全性证据，例如在线率、事故历史、认证和回滚治理。
    - 烧钱速度、资本开支计划、现金管理，以及 Walden 在什么条件下需要新融资。
    - Russ Tedrake 和公开可见的创始人中心叙事之外的治理深度。
