- id: operational-quality-and-technical-risk
  title: Operational, quality, security, and technical risk
  body: Walden’s largest non-legal risk is simply whether a research-derived robot stack can become a robust industrial system at scale. The company claims productive work at Toyota, but it does not publish uptime, MTBF, deployment duration, warranty metrics, safety incidents, or service burden. That means investors are being asked to bridge from technical lineage to operational reliability without the data that usually proves the bridge. NIST’s AI RMF and CISA’s Secure by Design guidance are helpful here because they emphasize that trustworthy AI and cyber resilience need to be built into product development and deployment, not added later. In a robot fleet, a failure can be physical, digital, or both. Sensors, policies, control systems, and update pathways all become risk transmission channels. The absence of public architecture, monitoring, and incident-governance detail does not prove weakness, but it does raise residual uncertainty. The correct interpretation is that Walden’s technical
    promise is real, but its operational maturity is only partially demonstrated in public.
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
