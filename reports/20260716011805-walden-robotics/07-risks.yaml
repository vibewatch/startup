- id: partner-dependency-people-and-financial-risk
  title: Partner dependency, people concentration, and financial-model risk
  body: 'Walden is also exposed to classic dependency and execution risks. Toyota is simultaneously the company’s strongest proof point, a likely strategic ally, and the biggest concentration concern if public deployment breadth remains narrow. Investors Boeing and Samsung broaden the ecosystem, but they do not substitute for diversified revenue. On the people side, Russ Tedrake is not just a CEO; he is a major part of the technical trust story. Any distraction, departure, or inability to scale the leadership bench would matter disproportionately. Competition for top robotics talent is also intense, especially against companies like Figure, Boston Dynamics, Apptronik, Physical Intelligence, and Tesla. Financially, the company has a large seed round, but hardware, field support, training, and manufacturing scale-up can consume capital quickly. If paid customer expansion lags, Walden could end up funding a long proof cycle from a finite cash pool while better-capitalized peers continue spending
    aggressively. In short: the company is not under-resourced today, but it is still highly dependent on partner leverage, founder execution, and disciplined capital deployment.'
  claimRefs:
  - CR021
