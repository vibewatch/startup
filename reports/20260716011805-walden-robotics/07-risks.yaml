- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold/event
  - action implication
  rows:
  - - Customer concentration
    - No second named production customer
    - Still only one meaningful reference after next commercial milestone window
    - Downgrade customer scalability thesis
  - - Safety / reliability
    - Material incident, repeated downtime, or failed certification gate
    - Any uncontained incident or inability to clear customer safety reviews
    - Pause or reject until root-cause and mitigation evidence are proven
  - - Capital intensity
    - Burn accelerates without corresponding commercial proof
    - Runway compresses below planned proof window or new financing required before diversification
    - Re-price risk or avoid participating on current terms
  - - People concentration
    - Loss or distraction of key technical leadership without bench replacement
    - Founder/key executive departure or inability to name strong operator bench
    - Reassess execution probability and governance quality
  - - Operational repeatability
    - Toyota proof does not expand into adjacent tasks/sites and no comparable new account appears
    - Anchor deployment stays isolated
    - Treat Walden as an impressive project rather than a scalable platform
  - - Cyber / product governance
    - Secure-development or update-governance controls remain undocumented
    - No evidence of fleet security, rollback, or incident response process
    - Condition investment on product-governance remediation
  notes: These triggers convert narrative risk into observable operating thresholds.
