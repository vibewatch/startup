callouts:
- calloutType: risk
  title: Concentration is the risk that can turn every other risk into a financing problem.
  body: As long as Toyota remains the only publicly confirmed production reference, any operational, safety, or timing issue around that relationship can ripple directly into fundraising leverage and perceived commercial credibility.
  claimRefs:
  - CR021
  - CR023
  - CR031
  - CR033
- calloutType: strength
  title: Most of Walden’s key risks are diligence-fixable, not unknowable.
  body: Safety processes, update governance, customer expansion, leadership depth, and burn discipline are all measurable if management provides the right operating data.
  claimRefs:
  - CR015
  - CR018
  - CR035
  - CR040
- calloutType: assumption
  title: The thesis breaks faster on execution slippage than on market demand.
  body: Public evidence already suggests real industrial demand for automation; the harder question is whether Walden can scale safely and repeatedly before capital or concentration becomes binding.
  claimRefs:
  - CR017
  - CR025
  - CR032
  - CR039
