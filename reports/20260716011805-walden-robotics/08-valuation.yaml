- id: TV004
  title: Comparable valuation table
  columns:
  - comparable
  - metric
  - multiple/valuation/status
  - relevance
  - limitation
  rows:
  - - Walden Robotics
    - Seed-stage physical-AI spinout with one public anchor deployment
    - $1.1B post-money on $300M seed
    - Closest direct reference because it is the price under review
    - No revenue or margin disclosure
  - - Figure
    - General-purpose humanoid platform
    - Officially >$1B Series C at $39B post-money
    - Upper-bound scarcity valuation in the category
    - Much larger capital scale and broader narrative scope
  - - Apptronik
    - Industrial humanoid vendor
    - Reuters-covered ~ $5B valuation; company says >$935M Series A total
    - Industrial-first private comp with named commercial relationships
    - More public commercial detail than Walden
  - - Agility Robotics
    - Industrial humanoid vendor
    - Public-listing deal at $2.5B pre-money equity value
    - Relevant industrial deployment comp with public order disclosure
    - Different stage and public-listing dynamics
  - - Physical Intelligence
    - Robot foundation-model platform
    - ~$5.6B 2025 valuation, then >$11B 2026 funding talks
    - Shows how aggressively capital values physical-AI platform narratives
    - More model-platform than factory-OEM business
  - - Symbotic
    - Public A.I.-enabled warehouse automation company
    - Public-company robotics / automation reference; FY2025 revenue $2.247B, adjusted EBITDA $147M
    - Useful maturity benchmark for what large-scale commercial proof looks like
    - Different vertical, public market, and business model
  - - Rockwell Automation
    - Public industrial automation incumbent
    - Public mature automation reference with FY2025 10-K publicly available
    - Anchors what scaled industrial automation disclosure looks like
    - Not a startup and not a humanoid OEM
  - - Teradyne / ABB
    - Public automation and robotics incumbents
    - Public industrial-robotics references with large operating systems
    - Useful for benchmarking maturity and enterprise credibility
    - Business mix and capital structure differ materially from Walden
  enumerationScope:
    coverage: partial
    basis: The comparable set mixes private humanoid rounds and public automation references because no perfect public comp exists for a seed-stage industrial physical-AI company.
  notes: Comparables are intended to bracket valuation logic, not to imply direct multiple equivalence.
