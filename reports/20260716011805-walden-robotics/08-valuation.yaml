- id: final-diligence-gates-and-exit-readiness
  title: Final diligence gates, downside triggers, and exit readiness
  body: The diligence agenda should focus on whether Walden deserves to be valued like a future platform winner rather than merely a strong research spinout. The most important missing items are paid deployment economics, customer diversification, product reliability, safety governance, and capital-burn discipline. These are not nice-to-have details; they are the variables that determine whether a $1.1 billion entry point is conservative, fair, or aggressive. Exit readiness is far too early to underwrite in any conventional sense. The company has not yet demonstrated the breadth of proof that would make IPO-style or strategic-exit speculation anything more than narrative. That does not weaken the strategic optionality, but it should keep investors disciplined. In practice, the right posture is to define explicit diligence gates and only pay today’s price if management can clear them with data. Otherwise, Walden is better treated as a company to track closely than as a conviction buy on existing
    public evidence.
