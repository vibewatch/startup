- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - assumptions
  - valuation/return logic
  - key risks
  - probability signal
  rows:
  - - 'Bull: Toyota expands, second major customer appears, safety/reliability metrics are strong, and software leverage improves'
    - Walden earns a materially higher private mark because it begins to look like a platform with repeatable industrial adoption; illustrative range 1.8B-2.8B
    - Execution still hard, but risk is offset by proof and strategic scarcity
    - Requires multiple concrete proof points within current runway window
  - - 'Base: Toyota remains strong, but diversification arrives slowly and economics are only partially proven'
    - Current valuation looks roughly fair to slightly full; illustrative range 1.0B-1.5B
    - Narrative stays strong while hard metrics lag
    - Most consistent with current public evidence
  - - 'Bear: anchor proof does not expand, safety or uptime data disappoints, or capital is needed before customer breadth is proven'
    - Valuation compresses materially because investors reclassify Walden as a promising but unproven robotics project; illustrative range 0.5B-0.9B
    - Concentration, burn, and execution slippage interact
    - Becomes more likely if the next set of disclosures remains thin
  notes: Ranges are analytical scenario outputs, not quoted market prices.
