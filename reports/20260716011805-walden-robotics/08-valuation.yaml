  title: Thesis / anti-thesis table
  columns:
  - argument
  - what would change the view
  rows:
  - - Elite TRI spinout pedigree plus Toyota production proof could make Walden one of the rare industrial physical-AI winners
    - Improves if Walden shows multiple paid deployments, repeat-site expansion, and strong safety / reliability metrics
  - - Large $300M seed lowers immediate financing risk and gives time to commercialize
    - Improves if burn is controlled and the next financing is not needed before diversification proof
  - - Strategic investor base implies industrial demand and ecosystem access
    - Improves if Boeing, Samsung, or comparable large manufacturers become real customers or design partners
  - - Current valuation may already reflect a large share of expected upside for a company with sparse public financial disclosure
    - Improves if pricing becomes more attractive or diligence proves unusually strong unit economics
  - - Humanoid and physical-AI theme could support a strategic premium
    - Worsens if the category cools or execution lags better-capitalized peers
  notes: Both the thesis and the anti-thesis are real; the decision hinges on price and proof, not on narrative alone.
