- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - No second named production customer
    - Customer breadth still effectively one account after next proof window
    - Turns Walden into a concentration bet rather than a scalable platform
    - Avoid paying a premium price without a discount or stronger protections
  - - Safety / uptime disappointment
    - Material incident or inability to document strong reliability
    - Weakens the core argument that elite technical lineage translates into operating superiority
    - Pause or pass until technical proof is repaired
  - - Burn rises ahead of proof
    - Need for new financing before diversification and economics are demonstrated
    - Turns strategic seed strength into dilution risk
    - Demand stronger terms or do not proceed
  - - Founder-key-person shock
    - Loss of technical leadership or inability to build operating bench
    - Reduces probability of converting research quality into company quality
    - Reassess or pass unless bench depth is clearly visible
  - - Market premium compresses
    - Physical-AI valuation sentiment cools before Walden matures
    - Narrows exit optionality and makes current entry price harder to justify
    - Tighten valuation discipline
  notes: These are thesis-breakers because they directly impair the arguments that support a premium seed valuation.
  claimRefs:
  - CV024
  - CV026
  - CV031
  - CV032
  - CV035
  - CV037
- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - Paid deployment economics
    - Contract structure, ASP, support burden, gross margin, and customer ROI
    - Separates option value from fundamental value
    - Management + finance data room
  - - Customer diversification
    - Named pipeline, pilots, production customers, and repeat-site expansions
    - Reduces concentration and proves repeatability
    - Sales / customer success diligence
  - - Product reliability and safety
    - Uptime, MTBF, incident history, certification status, and update governance
    - Execution quality is the key risk variable
    - Engineering / operations diligence
  - - Leadership and governance depth
    - Functional leaders, board composition, delegation, and succession readiness
    - Founder centrality is currently too important to ignore
    - Org / board diligence
  - - Capital plan
    - Monthly burn, capex commitments, runway, and next-round triggers
    - Determines whether current entry price faces near-term dilution risk
    - Finance / board diligence
  - - Commercial expansion playbook
    - How Toyota proof translates into new plants, new tasks, and new customers
    - This is the mechanism that makes the valuation work
    - Product + GTM diligence
  notes: If management clears most of these asks convincingly, today’s valuation can look much more defensible.
