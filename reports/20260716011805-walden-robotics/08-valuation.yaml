- id: comparable-context-and-scenario-logic
  title: Comparable context and scenario logic
  body: Private humanoid and physical-AI valuations provide context, but they do not solve the pricing problem. Figure’s latest financing sits on an entirely different scale at $39 billion post-money. Physical Intelligence and Apptronik also operate at much higher headline values, while Agility’s public-listing transaction sits above Walden but below the most extreme private marks. Those figures show that investors are willing to pay aggressively for scarce robotics platforms. They do not show that Walden is cheap. Public automation references such as ABB, Rockwell Automation, Teradyne, and Symbotic are useful for triangulating what mature industrial automation, robotics, or AI-enabled supply-chain businesses can look like, but they are structurally different. They have disclosed revenues, established customer bases, and much larger operating systems. Walden is closer to a milestone-driven option than to a traditional public-comp multiple. The scenario framework should therefore focus on
    whether Walden can convert its seed capital and Toyota proof into diversified commercial traction before the next financing event.
  claimRefs:
