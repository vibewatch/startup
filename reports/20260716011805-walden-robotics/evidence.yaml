evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: commercial-metrics
    missingEvidence: Revenue, ARR, customer count, and paid-deployment mix across the current customer base.
    whyItMatters: >-
      The launch valuation is impossible to benchmark rigorously without knowing whether the Toyota deployment is paid,
      how many other customers exist, or how quickly revenue is forming.
    diligencePath: >-
      Request management KPI disclosure, customer count by stage, and a paid-versus-pilot deployment breakdown in
      diligence materials.
    relatedQuestionRefs:
      - QO016
      - QO025
  - type: private-evidence-only
    severity: material
    topic: governance-disclosure
    missingEvidence: Full executive roster, board composition, committee structure, and investor governance rights.
    whyItMatters: >-
      Founder concentration is easier to tolerate when a company has a visible operating bench and formal governance.
      Public sources do not yet show either in detail.
    diligencePath: Obtain board deck cover pages, cap-table governance summary, and an org chart with named functional leaders.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: cap-table-economics
    missingEvidence: >-
      Ownership percentages, preference stack, investor rights, secondaries, and any debt or credit facilities
      associated with the seed round.
    whyItMatters: Headline valuation alone does not show true investor entry price, downside protection, or control dynamics.
    diligencePath: Review the financing summary, cap table, and principal transaction documents under NDA.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: deployment-repeatability
    missingEvidence: >-
      Evidence on whether the Toyota deployment is repeatable across other plants, customers, and workflows with similar
      uptime and economics.
    whyItMatters: A single anchor deployment improves credibility but does not prove scalable commercialization.
    diligencePath: Request deployment pipeline, reference customers, uptime data, task-level ROI, and post-pilot conversion rates.
    relatedQuestionRefs:
      - QO019
      - QO025
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: walden-sam
    missingEvidence: >-
      A clean Walden-specific SAM or SOM estimate grounded in target workflows, facility counts, pricing, and achievable
      deployment density.
    whyItMatters: >-
      Headline humanoid TAM figures are too broad to support underwriting; investors need the specific subset Walden can
      address in the next few years.
    diligencePath: >-
      Build a bottom-up model from target sectors, facilities, workflow counts, robot-per-site assumptions, and realized
      pricing or RaaS terms.
    relatedQuestionRefs:
      - QM022
      - QM023
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: roi-benchmarks
    missingEvidence: >-
      Public payback periods, labor-substitution rates, uptime metrics, and task-level ROI for factory humanoid
      deployments.
    whyItMatters: >-
      Adoption will depend on whether robots save enough labor or downtime cost to justify procurement, integration, and
      safety overhead.
    diligencePath: Request customer case studies with time-to-value, utilization, uptime, and avoided labor or quality costs.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM004
  - type: enumeration-incomplete
    severity: material
    topic: secondary-vertical-depth
    missingEvidence: >-
      Vertical-by-vertical evidence for aerospace, semiconductors, electronics, and life-sciences demand depth beyond
      launch-era naming.
    whyItMatters: >-
      Walden’s broader industry list may be commercially meaningful, but current public evidence is too thin to know
      which adjacencies are real sales wedges versus narrative placeholders.
    diligencePath: >-
      Collect named pilot or design-partner evidence by vertical, including task categories, plant types, and safety
      constraints.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM001
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Per-unit pricing, contract lengths, fleet-management fees, and service economics across the main industrial
      humanoid vendors.
    whyItMatters: >-
      Without price and service structure, it is hard to estimate switching cost, ROI, or whether Walden competes on
      economics or only on technical narrative.
    diligencePath: >-
      Request customer proposals, contract terms, and modeled payback assumptions for Walden and at least two close
      peers.
    relatedQuestionRefs:
      - QP013
      - QP023
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: manufacturing-capacity
    missingEvidence: Actual production capacity, supplier bottlenecks, and gross-margin path for Walden and major peers.
    whyItMatters: >-
      The race may be won by the vendors that can manufacture reliably and support fleets, not just by those with the
      strongest demos or valuations.
    diligencePath: >-
      Review internal manufacturing plans, actuator sourcing, QA metrics, and field-service buildout for Walden and
      benchmark peers.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP004
  - type: conflicting-data
    severity: material
    topic: forward-valuation-talks
    missingEvidence: >-
      Reliable confirmation of whether early-stage valuation rumors such as 1X’s target valuation or PI’s >$11B funding
      talks close on the discussed terms.
    whyItMatters: Competitive comparisons can become distorted if rumor-stage valuations are treated like closed financing events.
    diligencePath: >-
      Separate closed rounds from reports of ongoing talks and refresh competitor cap tables before any investment
      committee discussion.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Revenue, billings, ARR, and paid-versus-pilot deployment mix by customer or site.
    whyItMatters: >-
      Without it, investors cannot connect the $1.1 billion valuation to any commercialization base or test
      concentration risk.
    diligencePath: >-
      Request monthly revenue bridge, signed customer list by stage, and revenue recognition policy for deployments and
      services.
    relatedQuestionRefs:
      - QI003
      - QI021
      - QI024
    relatedTableRefs:
      - TI001
      - TI005
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, BOM cost, warranty reserve methodology, service staffing burden, and customer payback.
    whyItMatters: >-
      These metrics determine whether Walden becomes more software-like at scale or remains a cash-hungry hardware
      integrator.
    diligencePath: >-
      Request cohort economics for deployed sites, BOM snapshots, warranty reserves, uptime, MTTR, and post-deployment
      ROI studies.
    relatedQuestionRefs:
      - QI013
      - QI014
      - QI022
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Net cash at close, monthly burn, debt facilities, liquidation preferences, and investor rights.
    whyItMatters: Headline funding size alone does not show runway durability or the true economics of the seed round.
    diligencePath: Obtain cap table, financing documents, board-approved budget, and monthly cash-burn reporting.
    relatedQuestionRefs:
      - QI016
      - QI023
      - QI025
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
