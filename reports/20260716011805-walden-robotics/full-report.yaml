              values if the product works: automotive, aerospace, electronics, and logistics-heavy manufacturers. The
              Toyota proof gives that thesis real weight. Yet the chapter’s core limitation is simple: one strong anchor
              relationship is not the same thing as a diversified customer base. Investors need to know whether the
              Toyota deployment is paid, whether it is expanding, how many other accounts are in pipeline, and whether
              additional customers are in pilot or production. They also need clarity on buyer persona—operations,
              manufacturing engineering, automation, or corporate innovation—and on what operational metric closes the
              sale. Until those answers are available, Walden’s customer evidence supports a focused but still
              high-concentration commercialization thesis.
            claimRefs:
              - CU028
              - CU029
              - CU030
              - CU031
              - CU032
