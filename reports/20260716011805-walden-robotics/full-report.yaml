companyProfile:
  summary: >-
    Walden Robotics is a Cambridge, Massachusetts physical-AI robotics company that spun out of Toyota Research
    Institute in January 2026 and launched publicly on 2026-07-15. The company says it builds the full stack across
    hardware, software, frontier-class physical AI, and the application layer required to deploy general-purpose robots
    into real industrial workflows. Its public commercial story centers on a Toyota North America factory deployment
    that Walden says has been doing useful production work since February 2026. Walden launched with a $300 million seed
    financing at a $1.1 billion valuation, creating an unusually strong capital base for a company at such an early
    disclosure stage. The central diligence question is not whether Walden has elite technical and strategic
    ingredients; it is whether those ingredients already justify the current price without broader customer, economics,
    and reliability proof.
