  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and which competitors actually matter most
        blocks:
          - type: paragraph
            body: >-
              Walden’s practical competitor set is not every robot company on the internet. The most relevant direct
              peers are the companies building general-purpose or humanoid systems for industrial work in human-designed
              spaces: Figure, Apptronik, Agility Robotics, Boston Dynamics, 1X, Physical Intelligence, and Tesla’s
              internal Optimus effort. They matter for different reasons. Figure is the raw capital and brand leader in
              the category. Apptronik and Agility are strongest on publicly named industrial agreements and operating
              commercialization language. Boston Dynamics is the hardware incumbent with the deepest industrial robotics
              brand and Hyundai-backed production ambitions. Physical Intelligence is closer to a robotics
              foundation-model platform than a factory-workcell vendor, but it can still compete for talent, data,
              capital, and OEM relationships. 1X and Tesla broaden the frame by showing how quickly consumer or
              internal-manufacturing narratives can spill back into industrial competition. Against that set, Walden’s
              clearest wedge is not category breadth but focused credibility in factory deployment plus a TRI-derived
              learning stack.
