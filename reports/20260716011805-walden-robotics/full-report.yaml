        title: Revenue model and monetization visibility
        blocks:
          - type: paragraph
            body: >-
              Walden’s public surface looks like an enterprise robotics company selling or leasing outcome-bearing
              deployments rather than a self-serve software product. The launch release, homepage, and contact page all
              frame Walden around getting robots “to work today” for manufacturers, while the company page describes a
              full stack spanning hardware, software, physical AI, and an application layer. That strongly implies
              several monetization layers: robot-system sales or leases, integration and deployment services, ongoing
              software/model updates, and recurring support. But none of the economically decisive pieces are disclosed.
              There is no public list pricing, no statement about robot-as-a-service versus capex purchase, no
              contract-length disclosure, and no guidance on whether Toyota’s production deployment is paid, subsidized,
              or strategic. 1X remains the clearest public pricing reference in the peer group, but its home-oriented
              pricing is not directly portable to industrial factory deployments. Figure, Apptronik, Agility, and Boston
              Dynamics all likewise keep public pricing sparse. That means Walden’s revenue model is legible in
