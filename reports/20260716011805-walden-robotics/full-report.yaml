      - number: '2.2'
        title: Sizing lenses, growth drivers, and why the market looks large before it looks liquid
        blocks:
          - type: paragraph
            body: >-
              The market can be sized credibly only through multiple lenses. The mature baseline is industrial robotics,
              where IFR says 542,000 robots were installed in 2024 and annual installations stayed above 500,000 for a
              fourth straight year. Axis Intelligence adds that 4.66 million industrial robots were active globally and
              highlights high robot density in markets such as South Korea. That established installed base matters
              because it shows manufacturers already buy automation at scale. The emerging layer is humanoid and
              physical-AI robotics: Axis estimates roughly $4.89 billion of humanoid-market revenue in 2025 rising to
              about $6.24 billion in 2026, with 18,000 units shipped in 2025 and nearly $9.8 billion of cumulative
              venture capital in the sector. Those numbers are directionally important, but they should not be treated
              as Walden’s immediate revenue pool. Bain, Humanoid.guide, and operator pages from peer vendors all suggest
              that early commercialization remains concentrated in structured industrial settings rather than in
              generalized “robots for everywhere” scenarios. The most supportable growth drivers are labor shortages,
              re-shoring and domestic-production pressure, increasing AI capability, and the economic appeal of adding
              flexible automation without fully redesigning plant layouts.
