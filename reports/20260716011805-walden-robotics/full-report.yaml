      - number: '7.4'
        title: Mitigation framework, monitorable triggers, and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              The right response to Walden’s risk stack is not immediate rejection; it is disciplined conditionality.
              Several of the major risks are addressable if management can show concrete data: safe deployment records,
              repeat-site expansion, explicit customer ROI, architecture governance, and a credible second-layer
              leadership bench. But until those datapoints are visible, investors should define monitorable kill
              criteria. If Toyota remains the only meaningful reference after a reasonable commercialization window,
              concentration risk should be treated as thesis-relevant. If safety or quality incidents occur without
              transparent mitigation, the company’s core advantage—trust in elite technical execution—weakens quickly.
              If burn expands faster than customer proof, the financing story can flip from strategic strength to
              dilution risk. These are measurable problems, not abstract fears. The main diligence task is therefore to
              force the company’s narrative into operating thresholds that either confirm or break the investment case.
