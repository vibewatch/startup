chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product surface, and current deployment posture
        blocks:
          - type: paragraph
            body: >-
              Walden Robotics presents itself as a full-stack Physical AI company rather than as a pure software model
              vendor or a traditional factory automation integrator. Across its launch announcement, homepage, company
              page, and contact flow, the company consistently says it builds hardware, software, frontier-class
              Physical AI, and the application layer needed to put general-purpose robots to work in manufacturing and
              logistics. The public launch materials also make an unusually strong operational claim for a company that
              only emerged from stealth one day before this report date: Walden says its robots have already been doing
              useful work in production at a Toyota plant in North America since February 2026, and third-party coverage
              adds that at least one robot has run eight-hour shifts on tasks such as part loading, machine cleaning,
              and kitting. The physical form factor also matters. Walden is not chasing a pure biped narrative; external
              launch coverage says the company chose a wheeled base for safety, practicality, battery, and compute
              reasons inside existing factories. That makes the company easier to place in today’s brownfield industrial
              environments, but it also signals a deliberately pragmatic, non-cinematic positioning strategy.
