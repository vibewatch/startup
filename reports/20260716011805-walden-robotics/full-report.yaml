      - number: '4.3'
        title: Cost structure, margin drivers, and working-capital realities
        blocks:
          - type: paragraph
            body: >-
              Walden’s likely cost structure is closer to advanced industrial automation than to pure software.
              Public-company filings and industrial OEM disclosures show the same cost buckets recurring across the
              physical-AI stack: inventory and property, plant, and equipment; warranty reserves and service
              liabilities; field deployment and systems integration labor; and the ongoing compute, data, and
              reliability work needed to improve robot performance. Hyundai’s audited 2025 report shows how warranty,
              inventory, PP&E, and financial liabilities remain central even at automotive scale, while Tesla’s 2025
              10-K continues to treat Optimus as part of a large manufacturing and AI effort rather than a low-capital
              software product. That does not mean Walden will mirror those cost lines directly, but it does mean the
              margin path depends on manufacturing yield, robot uptime, service burden, and speed of software reuse
              across customers. Public sources do not expose Walden’s BOM cost, gross margin, warranty assumptions,
              utilization, or working-capital profile. As a result, the most important underwriting question is not
              whether Walden can raise money—it already has—but whether one robot deployment can become a repeatable and
              increasingly software-weighted unit of economics.
