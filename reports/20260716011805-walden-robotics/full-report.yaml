  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and what Walden is actually selling into
        blocks:
          - type: paragraph
            body: >-
              The right market boundary for Walden is not “all robotics” or even “all humanoids.” Walden is specifically
              targeting factory and logistics environments where tasks are repetitive, physically taxing, variable
              enough to be awkward for fixed automation, yet structured enough for near-term physical-AI systems to
              operate safely. Official Walden materials emphasize manufacturing and logistics first, while naming
              strategic partners in automotive, aerospace, semiconductors, electronics, logistics, and life sciences.
              That positions the company in the overlap between industrial automation, machine tending, lineside
              support, kitting, and mobile material-handling workflows. The status-quo substitutes are important: fixed
              industrial robots remain the default where a cell can be re-engineered around high-volume repeatability;
              traditional cobots and AMRs cover narrower tasks with lower autonomy demands; and human labor still
              dominates where variability, ergonomics, and judgment defeat rigid automation. Peer materials from
              Apptronik, Agility, Figure, and Boston Dynamics all reinforce the same basic commercial wedge: early value
              comes from repetitive industrial support work, not from open-world home robotics. Walden’s market is
              therefore best understood as a constrained subset of industrial automation where general-purpose form
              factors can reduce the retrofit burden of deploying robots into spaces designed for people.
            claimRefs:
