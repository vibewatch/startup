      - number: '4.2'
        title: Capital adequacy, burn, and runway
        blocks:
          - type: paragraph
            body: >-
              The headline seed round matters because Walden is entering a category where commercialization usually
              requires years of spending before durable margins appear. Walden’s $300 million financing is very large
              for a company that spun out in January 2026, but it still sits materially below the raw capital levels
              that public sources attribute to Figure, Apptronik, Agility, and Physical Intelligence. Walden therefore
              has enough money to build, hire, and deploy, but not enough to be obviously overcapitalized relative to
              its best-funded rivals. The careers page suggests active hiring across robotics, hardware, and AI
              disciplines, which usually implies high payroll burn. The need to train models, support pilots on-site,
              and manufacture or source physical systems further raises fixed cash requirements. On a qualitative basis,
              the round likely funds a multi-year development window, yet runway confidence remains weak because Walden
              has not disclosed current headcount, monthly burn, manufacturing commitments, or whether Toyota offsets
              deployment costs through paid contracts. Investors should treat capital adequacy as strong in absolute
