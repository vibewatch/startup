      - number: '3.4'
        title: Switching costs, moat durability, and Walden’s actual relative position
        blocks:
          - type: paragraph
            body: >-
              The competitive moat picture is still fluid. Buyers are not obviously locked into one humanoid vendor yet
              because the category remains pre-standardized and public pricing is mostly undisclosed. Multi-homing risk
              is high: a large manufacturer can pilot several vendors across different tasks before committing broadly.
              Distribution power also looks likely to concentrate around companies with deep strategic partners and
              manufacturing access—Hyundai for Boston Dynamics, Mercedes and Google links for Apptronik, Toyota
              relationships for Agility and Walden, and Tesla’s internal factory network for Optimus. Walden’s moat case
              therefore has to be narrower and more executional than the biggest rivals’ stories. Its public advantages
              are TRI-originated research, Tedrake’s unusually strong control-and-manipulation credentials, a large seed
              round, and a claimed production deployment inside Toyota. Its public weaknesses are thinner pricing
              visibility, fewer named customer contracts than Agility or Apptronik, and less overwhelming capital scale
              than Figure or Physical Intelligence. That means Walden can win if the market rewards real factory fit and
              learning speed over spectacle, but it remains vulnerable if scale, distribution, or data network effects
              consolidate quickly around larger peers.
