      - number: '3.2'
        title: Funding, valuation, and disclosed commercial scale
        blocks:
          - type: paragraph
            body: >-
              The disclosed capital hierarchy is stark. Figure’s official Series C announcement says it crossed $1
              billion of committed capital at a $39 billion post-money valuation. Apptronik’s Reuters-covered February
              2026 round valued it at about $5 billion, and Apptronik’s own press page says its Series A total exceeded
              $935 million. Agility’s June 2026 public-listing announcement pegged the company at a $2.5 billion
              pre-money equity value and claimed more than $300 million of multi-year Digit v5 orders, while also
              describing current deployments across nine facilities. Physical Intelligence’s public record is more
              model-platform-driven but still formidable: The Robot Report says it raised $600 million in Series B and
              about $1.1 billion total at a roughly $5.6 billion valuation, and TechCrunch says it was already
              discussing another $1 billion round at more than $11 billion. 1X’s public Sacra profile shows far less
              historical capital raised than those names but also a more unusual consumer-plus-enterprise model with
              visible rental pricing. Walden’s $300 million at $1.1 billion is therefore large for a fresh spinout, but
              still smaller than the category leaders on both valuation and publicly disclosed commercial scale.
