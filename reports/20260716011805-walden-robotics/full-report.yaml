    sections:
      - number: '6.1'
        title: Who Walden is selling to and why those buyers make sense
        blocks:
          - type: paragraph
            body: >-
              Walden’s target customer profile is large-scale industrial operators that have repetitive physical
              workflows, labor pressure, safety-sensitive tasks, and enough process maturity to deploy robotics in real
              facilities. Toyota is the clearest example and is therefore the most important anchor for understanding
              the rest of the customer map. Toyota’s public North American manufacturing footprint spans a large network
              of plants, batteries, engines, vehicles, and supplier ecosystems, which makes it an ideal proving ground
              for robotics that need repetitive task density and measurable operational value. Boeing and Samsung widen
              the likely buyer archetype. Boeing brings exposure to aerospace production and complex manufacturing
              environments where labor, quality, and safety are central. Samsung brings both a venture-investor
              relationship and a public strategy to transition manufacturing into AI-driven factories by 2030. These are
              not proof of signed customer contracts, but they do indicate that Walden is being pulled toward large
              enterprise buyers rather than small experimental labs. Public evidence therefore supports a narrow but
              credible target segment: blue-chip manufacturers with hard-to-staff or ergonomically difficult workflows.
