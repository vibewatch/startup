  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: What the current price is really paying for
        blocks:
          - type: paragraph
            body: >-
              Walden’s current valuation is not a conventional revenue multiple story. The company launched at a $1.1
              billion valuation with $300 million of fresh capital after only emerging from stealth, while still
              withholding most of the commercial metrics that growth-stage investors typically use to anchor price. The
              public case for that price is instead a combination of three things: elite technical lineage from TRI and
              Russ Tedrake, one meaningful production proof point inside Toyota North America, and the strategic
              importance of physical AI as a theme. Those ingredients are real. But so is the valuation gap. Walden has
              disclosed no revenue, no gross margin, no customer-count progression, no repeat-site expansion, and no
              unit-economics proof. That means the headline price is paying for future execution and scarce category
              positioning, not for a current audited business base. Investors should be explicit about that distinction,
              because it determines whether they are underwriting fundamentals or buying an option on a category winner.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: figure
