  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Walden’s public disclosures do not show an immediate enforcement or litigation problem, but they do show
              exposure to a dense compliance surface. Industrial robots operating around people can trigger obligations
              from workplace safety regimes, machinery rules, testing-lab expectations, and broader AI-governance
              frameworks. OSHA’s robotics overview and machine-guarding materials make clear that even without a bespoke
              OSHA rulebook for every robotics scenario, employers still face existing safety obligations around
              guarding, hazard reduction, and safe operation. The EU machinery and AI frameworks add another layer for
              any product that could enter European markets or emulate high-risk AI functionality. Legal commentary from
              Hill Dickinson, MLT Aikins, and Today’s General Counsel further underscores that autonomy, product
              liability, data collection, and employment-law issues expand as robots become more capable and more
              embedded in workplaces. Walden’s own terms and privacy pages prove the company has thought about online
              service legalities, but they do not answer the harder questions around robot telemetry, incident
              reporting, product liability allocation, or site-level safety governance.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
