            body: >-
              Almost every durability question remains unanswered publicly. There is no disclosed NRR, GRR, renewal
              rate, contract length, backlog conversion rate, or repeat-site deployment count. That means the public
              record cannot yet distinguish a sticky enterprise robotics platform from an impressive but isolated anchor
              deployment. The likely expansion logic is understandable: land inside one workflow, prove reliability,
              then extend to adjacent tasks, shifts, or plants. But that logic remains theoretical until Walden shows
              repeat contracts or more than one named customer. Concentration risk is therefore high. If Toyota is the
              only meaningful current deployment, then any delay, budget cut, safety issue, or narrow task fit at Toyota
              would disproportionately affect commercial credibility. Publicly disclosed investor alignment with Boeing
              and Samsung slightly softens this risk by showing interest from other industrial ecosystems, but it does
              not remove it. For now, Walden’s customer story supports a promising enterprise wedge, not a de-risked
