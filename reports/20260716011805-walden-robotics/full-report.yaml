      - number: '1.2'
        title: Founding pedigree, leadership credibility, and team build-out
        blocks:
          - type: paragraph
            body: >-
              The clearest strength in the public record is founder-market fit. Russ Tedrake is not a newly minted
              founder trading on AI market enthusiasm; official MIT pages describe him as the Toyota Professor of
              Electrical Engineering and Computer Science, Aeronautics and Astronautics, and Mechanical Engineering at
              MIT, the director of the MIT Center for Robotics, and the former leader of Team MIT’s DARPA Robotics
              Challenge entry. His own Robot Locomotion Group biography says he spent 10 years as Senior Vice President
              of Robotics Research and Large Behavior Models at Toyota Research Institute before moving into startup
              formation. Walden’s launch material puts him at the center of the company as co-founder and CEO, while the
              company page broadens the founding bench to pioneers from Toyota Research Institute, MIT, Stanford, and
              Amazon. Public leadership depth is still thin compared with a mature industrial company, but the careers
              page confirms active recruiting across robotics, AI, operations, product, and business functions, and the
              contact page shows the company already soliciting deployment conversations from prospective industrial
              users. The core diligence takeaway is that the public team signal is elite, but still concentrated around
              Tedrake and a small founding nucleus rather than a fully disclosed executive bench.
