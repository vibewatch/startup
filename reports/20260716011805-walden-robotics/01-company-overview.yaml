company:
  name: Walden Robotics
chapter:
  number: 1
  title: Company Overview
  summary: 'Walden Robotics emerged from stealth on 2026-07-15 with unusually strong early proof points for a seed-stage robotics company: a $300 million round at a $1.1 billion valuation, a spinout lineage from Toyota Research Institute, and an official claim that its robots have already been doing useful work in production at a Toyota plant since February 2026. The public record is strongest on pedigree, financing, and deployment narrative, and weakest on revenue, customer breadth, governance detail, and unit economics. As a result, the company overview can establish a credible identity and milestone chronology, but it cannot yet underwrite commercial scale with high certainty.'
sections:
- id: identity-and-deployment-surface
  title: Identity, product surface, and current deployment posture
  body: 'Walden Robotics presents itself as a full-stack Physical AI company rather than as a pure software model vendor or a traditional factory automation integrator. Across its launch announcement, homepage, company page, and contact flow, the company consistently says it builds hardware, software, frontier-class Physical AI, and the application layer needed to put general-purpose robots to work in manufacturing and logistics. The public launch materials also make an unusually strong operational claim for a company that only emerged from stealth one day before this report date: Walden says its robots have already been doing useful work in production at a Toyota plant in North America since February 2026, and third-party coverage adds that at least one robot has run eight-hour shifts on tasks such as part loading, machine cleaning, and kitting. The physical form factor also matters. Walden is not chasing a pure biped narrative; external launch coverage says the company chose a wheeled
    base for safety, practicality, battery, and compute reasons inside existing factories. That makes the company easier to place in today’s brownfield industrial environments, but it also signals a deliberately pragmatic, non-cinematic positioning strategy.'
