callouts:
- calloutType: strength
  title: Few robotics launches pair elite pedigree with claimed production work this early
  body: Walden combines a top-tier academic and research pedigree with a specific factory-deployment claim at launch. That is materially stronger than a pure demo-stage narrative, even though the public record is still too thin to prove scaled economics.
  claimRefs:
  - CO012
  - CO013
  - CO018
  - CO020
  - CO028
- calloutType: risk
  title: Public operating disclosure lags far behind the funding headline
  body: Launch materials disclose the size of the round, the valuation, and the investor roster, but not revenue, customer count, unit economics, or a broad customer list. The company is easy to admire and still hard to underwrite.
  claimRefs:
  - CO002
  - CO003
  - CO027
  - CO037
  - CO038
- calloutType: insight
  title: The wheeled design choice is a commercialization thesis, not a cosmetic detail
  body: Walden’s decision to avoid legs at launch signals that the company is optimizing for current factory safety, runtime, and payload constraints rather than for viral humanoid aesthetics. That makes the product thesis more industrially grounded than many peers.
  claimRefs:
  - CO033
  - CO034
  - CO035
- calloutType: assumption
  title: Later chapters should treat Toyota deployment as strong proof of relevance, not proof of repeatability
  body: A single factory deployment materially de-risks technical credibility, but it does not yet answer whether Walden can repeat the same economics, safety performance, and workflow fit across multiple customers and facilities.
  claimRefs:
  - CO013
  - CO014
  - CO031
  - CO032
