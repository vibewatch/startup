- id: milestones-and-disclosure-limits
  title: Milestones, technology lineage, and disclosure limits
  body: Walden’s launch narrative is more credible than a greenfield concept startup because it sits on a documented research arc that predates the company itself. Toyota Research Institute and associated coverage have publicly traced advances in Diffusion Policy, Large Behavior Models, and whole-body manipulation over several years, while the March 2026 stealth-startup coverage showed that Tedrake’s move from TRI to a new physical AI venture was already underway months before the July launch. The official launch announcement then ties that lineage to commercial intent by saying Walden spun out in January 2026 and moved from first pilot to real work in under two months. At the same time, adverse and cautionary evidence should not be ignored. TNW’s launch coverage frames the humanoid race as crowded and unproven, quotes Tedrake saying success is not assured, and emphasizes that the company intentionally avoided legs because factory users are not ready for them. Bain’s broader 2025 sector
    analysis reinforces that most humanoid deployments remain early-stage and highly structured. The right reading of the timeline is therefore neither “science project” nor “solved commercialization.” Walden has a real pedigree and an early deployment signal, but public proof still stops well short of scaled, repeatable economics.
