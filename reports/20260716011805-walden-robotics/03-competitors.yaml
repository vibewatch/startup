  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Per-unit pricing, contract lengths, fleet-management fees, and service economics across the main industrial humanoid vendors.
    whyItMatters: Without price and service structure, it is hard to estimate switching cost, ROI, or whether Walden competes on economics or only on technical narrative.
    diligencePath: Request customer proposals, contract terms, and modeled payback assumptions for Walden and at least two close peers.
    relatedQuestionRefs:
    - QP013
    - QP023
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: manufacturing-capacity
    missingEvidence: Actual production capacity, supplier bottlenecks, and gross-margin path for Walden and major peers.
    whyItMatters: The race may be won by the vendors that can manufacture reliably and support fleets, not just by those with the strongest demos or valuations.
    diligencePath: Review internal manufacturing plans, actuator sourcing, QA metrics, and field-service buildout for Walden and benchmark peers.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP004
  - type: conflicting-data
    severity: material
    topic: forward-valuation-talks
    missingEvidence: Reliable confirmation of whether early-stage valuation rumors such as 1X’s target valuation or PI’s >$11B funding talks close on the discussed terms.
    whyItMatters: Competitive comparisons can become distorted if rumor-stage valuations are treated like closed financing events.
    diligencePath: Separate closed rounds from reports of ongoing talks and refresh competitor cap tables before any investment committee discussion.
    relatedQuestionRefs:
    - QP024
