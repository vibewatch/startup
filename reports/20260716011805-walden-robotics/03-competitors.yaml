callouts:
- calloutType: strength
  title: Walden is not the biggest, but it may be the most credible new spinout in factory-first physical AI.
  body: Walden lacks Figure’s balance sheet and Agility’s disclosed order book, but its combination of TRI lineage, Tedrake credibility, and a claimed Toyota production deployment gives it an unusually strong starting position for a company that only just emerged from stealth.
  claimRefs:
  - CP003
  - CP019
  - CP026
  - CP038
- calloutType: risk
  title: Several peers are further ahead on publicly disclosed commercial traction.
  body: Agility and Apptronik have named industrial agreements and stronger public workflow detail, while Figure and Physical Intelligence operate with much larger capital cushions. Walden’s public GTM evidence is therefore promising but still thinner than the best-compared peers.
  claimRefs:
  - CP007
  - CP019
  - CP020
  - CP021
  - CP029
  - CP032
  - CP038
- calloutType: insight
  title: The field is splitting into robot OEMs, model platforms, and internal-build giants.
  body: Walden mainly fights other industrial OEMs for deployments, but it also competes with model-platform players like Physical Intelligence for talent and with public-company internal programs like Tesla for long-run strategic mindshare.
  claimRefs:
  - CP016
  - CP018
  - CP024
  - CP031
- calloutType: assumption
  title: The near-term winners may be the vendors that reduce deployment friction, not the vendors with the boldest long-term narrative.
  body: Because buyers can still multi-home and the category lacks price transparency, the most durable advantage may come from safety approvals, workflow fit, runtime, and service support rather than from the broadest humanoid vision alone.
