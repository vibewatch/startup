    - Manufacturing and logistics
    - TRI lineage + claimed Toyota production deployment
    - Thin public GTM, pricing, and customer breadth disclosure
  - - Figure
    - General-purpose humanoid OEM
    - '>$1B Series C at $39B post-money'
    - Commercial plus home over time
    - Category-leading capital scale and Helix AI platform
    - Broad ambition raises execution scope and dilution risk
  - - Apptronik
    - Industrial humanoid OEM
    - ~$5B valuation; >$935M Series A total
    - Manufacturing and logistics first
    - Explicit manufacturing workflow pages and named commercial agreements
    - Public pricing still undisclosed; capital scale below Figure
  - - Agility Robotics
    - Industrial humanoid OEM
    - Public-listing deal at $2.5B pre-money
    - Manufacturing, distribution, logistics
    - Named customer deployments and strong safety/commercial language
    - Less raw capital than Figure and less research mystique than TRI/Tesla
  - - 1X Technologies
    - Consumer + enterprise humanoid OEM
    - ~$136.5M historical funding; 2025 $10B target valuation talks
    - Home robots plus some enterprise use
    - Visible consumer pricing and vertically integrated AI narrative
    - Consumer focus can dilute industrial concentration
  - - Physical Intelligence
    - Robot foundation-model platform
    - ~$1.1B raised; ~$5.6B valuation, then >$11B funding talks
    - General-purpose AI for robots
    - Model-centric talent and open-source signal
    - No public commercialization timeline and thinner deployment proof
  - - Boston Dynamics / Atlas
    - Industrial robotics incumbent
    - Hyundai-backed scale; 2026 production fully committed
    - Automotive and enterprise industrial tasks
    - Deep hardware brand and enterprise-grade deployment specs
    - Not a startup-like pure-play software or services story
  - - Tesla Optimus
    - Internal build / public-company benchmark
    - Backed by Tesla balance sheet and AI stack
    - Tesla factories first, broader future optionality
    - Massive internal data and manufacturing base
    - External go-to-market and standalone pricing remain opaque
  notes: The competitor set mixes direct industrial humanoid rivals, an AI-model platform, and Tesla as an internal-build/public-market reference because all compete for capital, talent, customers, or strategic mindshare.
