- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim / risk
  - Threat
  - Severity
  - Mitigation or diligence ask
  rows:
  - - TRI research pedigree
    - Larger peers can outspend Walden on data, compute, and hiring
    - High
    - Verify whether TRI-originated know-how translates into faster on-site learning and safer deployment
  - - Toyota anchor relationship
    - A single anchor relationship may not generalize into broad customer base
    - High
    - Request non-Toyota pipeline, conversion data, and contractual freedom to sell broadly
  - - Industrial-first focus
    - Figure, Apptronik, Agility, and Boston Dynamics all target industrial tasks too
    - High
    - Test whether Walden’s wheeled form factor and workflow fit materially shorten deployment time
  - - Category fragmentation
    - Buyers can pilot multiple vendors and delay lock-in
    - Medium
    - Assess switching cost after integration, retraining, and safety validation
  - - Opaque pricing
    - Competitors with clearer ROI proof can win procurement even with weaker narratives
    - High
    - Demand concrete payback models and pricing structure in diligence
  - - Foundation-model commoditization
    - Platform players or open-source models can weaken software exclusivity
    - Medium
    - Check whether Walden’s moat is data plus operations, not just model architecture
  - - Manufacturing and distribution power
    - Hyundai, Mercedes, Tesla, and other strategic ecosystems can compress Walden’s room to scale
    - High
    - Understand supplier access, production capacity, and strategic partner commitments
  notes: The risk register treats Walden’s moat as execution-dependent rather than structurally settled; almost every advantage has a plausible better-funded counterparty.
