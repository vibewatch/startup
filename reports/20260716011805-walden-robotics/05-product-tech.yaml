    - Custom automation often requires workflow-specific programming and long integration
    - Learning-based robot stack intended to generalize across tasks
    - Potentially faster redeployment across adjacent tasks
    - No public deployment-time benchmarks
  - - Warehouse / factory supervisor
    - Labor shortages and inconsistent staffing around repetitive tasks
    - Robot fills physically demanding or hard-to-staff roles
    - Potential throughput stability and labor-gap coverage
