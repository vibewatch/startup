- id: deployment-reliability-and-safety-controls
  title: Deployment, reliability, and safety controls
  body: 'Walden’s biggest product unknown is operational maturity. The company claims its robots are already productive at Toyota North America, but it does not publish uptime, MTBF, safety incident rates, deployment duration, or named certifications. The public trust surface is also thin: the website includes privacy and terms pages for its online services, but those are not substitutes for robot-fleet security architecture, functional safety documentation, or industrial compliance disclosures. External materials help frame what good looks like. OSHA’s robotics standards page, the EU Machinery Regulation, and industrial robot-safety guidance all emphasize risk assessment, safeguarding, and human-machine interface design. Agility and Boston Dynamics are more explicit publicly about safety testing and enterprise deployment conditions, while Apptronik maps concrete tasks like kitting and machine tending. Walden’s product may in fact meet or exceed those standards internally, but the public
    record does not yet show the evidence. Investors should therefore separate credible technical lineage from unverified field reliability and compliance maturity.'
