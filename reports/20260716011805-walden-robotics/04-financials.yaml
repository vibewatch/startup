  title: Unit economics table
  columns:
  - metric
  - value/null
  - confidence
  - why it matters
  - diligence ask
  rows:
  - - Gross margin per deployed robot
    - Not disclosed
    - 'null'
    - Separates high-value software leverage from low-margin hardware pass-through
    - Request BOM, assembly labor, warranty reserve, and gross margin by robot generation
  - - Deployment payback for customer
    - Not disclosed
    - 'null'
    - Enterprise adoption depends on clear labor, quality, or throughput ROI
    - Request customer ROI models and post-deployment realized savings
  - - Field service cost per site
    - Not disclosed
    - 'null'
    - High on-site support burden can destroy contribution margin
    - Request service staffing, travel cost, spare-parts usage, and MTTR data
  - - Model-training / compute cost
    - Not disclosed
    - 'null'
    - Physical-AI performance gains may require recurring expensive training cycles
    - Request annual training spend, inference stack, and hardware-provider commitments
  - - Warranty / replacement reserve
    - Not disclosed
    - 'null'
    - Industrial uptime commitments require reserve planning
    - Request warranty assumptions, failure rates, and reserve methodology
  - - Sales cycle length
    - Not disclosed
    - 'null'
    - Hardware enterprise cycles affect CAC and working capital timing
    - Request pipeline stage durations and close rates by customer type
  notes: Public sources support the importance of these metrics but do not disclose the values; the table therefore documents the underwriting gaps rather than inventing precision.
