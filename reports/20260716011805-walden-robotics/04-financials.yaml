callouts:
- calloutType: strength
  title: Walden has enough money to matter.
  body: A $300 million seed round gives Walden far more financial room than most newly emerged robotics spinouts receive, which materially lowers immediate financing risk and supports serious product development and deployment work.
  claimRefs:
  - CI011
  - CI013
  - CI015
- calloutType: risk
  title: The public record still cannot prove revenue quality.
  body: No public source reviewed here discloses Walden’s pricing, paid deployment mix, gross margin, service burden, or customer payback. Those gaps are too central to ignore in a capital-intensive robotics business.
  claimRefs:
  - CI006
  - CI021
  - CI032
  - CI033
- calloutType: assumption
  title: Financial upside depends on software reuse outrunning support intensity.
  body: The best version of Walden is one where each additional site benefits from a reusable learning stack and declining deployment friction. The weak version is one where support, safety validation, and custom integration stay labor-heavy.
  claimRefs:
  - CI024
  - CI026
  - CI028
  - CI038
