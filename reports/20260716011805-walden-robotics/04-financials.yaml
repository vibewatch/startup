  rows:
  - - Industrial robot deployment
    - Enterprise sale, lease, or structured deployment contract
    - Per robot / per site / multi-site contract
    - Publicly implied but not priced
    - 'Medium: demand structure is visible, economics are not'
    - Request signed contract examples with pricing, payment timing, and acceptance terms
  - - Software / model updates
    - Ongoing improvement of policies, perception, and fleet behavior
    - Subscription, license, or bundled support
    - Not disclosed
    - Low
    - Clarify whether software revenue is separable from hardware and how updates are billed
  - - Integration / commissioning
    - On-site installation, workflow mapping, safety setup, and operator training
    - Per deployment / project fee
    - Not disclosed
    - Low
    - Request SOW examples, implementation timelines, and pass-through cost treatment
  - - Support / maintenance
    - Field service, uptime support, replacement parts, preventive maintenance
    - Annual support or usage-linked fee
    - Not disclosed
    - Low
    - Ask for warranty reserve policy, service staffing model, and uptime SLA terms
  - - Strategic development work
    - Toyota-linked development or co-creation arrangements
    - Milestone payment or sponsored work
    - Possible but not publicly confirmed
    - Low
    - Separate paid customer revenue from sponsor-funded R&D and in-kind support
  notes: Walden’s public materials imply enterprise robotics monetization, but they do not disclose which layers are contracted separately versus bundled into one deployment price.
