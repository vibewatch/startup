  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Revenue, billings, ARR, and paid-versus-pilot deployment mix by customer or site.
    whyItMatters: Without it, investors cannot connect the $1.1 billion valuation to any commercialization base or test concentration risk.
    diligencePath: Request monthly revenue bridge, signed customer list by stage, and revenue recognition policy for deployments and services.
    relatedQuestionRefs:
    - QI003
    - QI021
    - QI024
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, BOM cost, warranty reserve methodology, service staffing burden, and customer payback.
