- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metrics
  - impact
  - exact diligence path
  rows:
  - - Revenue and ARR by customer / site
    - Without this, valuation cannot be tied to any commercialization base
    - Request monthly revenue bridge, customer count by stage, and trailing twelve-month billings
  - - Paid vs pilot vs subsidized deployments
    - Paid demand quality is the core commercialization question
    - Request contract classification and deployment revenue recognition policy
  - - Gross margin and BOM path
    - Determines whether the company can compound software leverage or stays hardware-heavy
    - Request BOM snapshots, supplier concentration, and target gross margin by generation
  - - Service and warranty burden
    - Field support intensity can invert economics even with strong demand
    - Request warranty claims, uptime, spare parts, and field-engineer staffing data
  - - Working-capital needs
    - Inventory and receivable timing could absorb more cash than expected
    - Request inventory policy, payment terms, receivable aging, and any customer prepayments
  - - Preference stack / investor rights
    - Headline post-money may overstate common-equity value
    - Request cap table, liquidation preferences, pro rata rights, and side-letter obligations
  notes: The most material financial blockers are all private-data questions rather than public-document inconsistencies.
