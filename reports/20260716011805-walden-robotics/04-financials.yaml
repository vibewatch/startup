  rows:
  - - Seed financing announced at $300M gross proceeds
    - Not disclosed
    - Estimated multi-year but not publicly quantifiable
    - Hiring, robot development, manufacturing scale-up, deployments, and customer support
    - Likely tied to commercial proof, repeat deployments, and margin confidence rather than pure launch milestone
    - No debt, equipment finance, or special-purpose facilities disclosed publicly
  - - Relative to Figure
    - Smaller capital base
    - Lower than category leader if field scales quickly
    - Must allocate more selectively across product and GTM
    - Could need follow-on before Figure-like fleet scale is reached
    - No public leverage disclosed
  - - Relative to Apptronik and Agility
    - Comparable to or below later-stage peer capital pools depending on source
    - Potentially tighter if hardware deployment ramps quickly
    - Funding likely enough for near-term proof, not guaranteed for dominance
    - Next round could be triggered by scaling factories and customer conversions
    - No project-finance structure disclosed
  - - Relative to Physical Intelligence
    - Much smaller than the best-funded model-platform capital stack
    - May be adequate for OEM focus but not open-ended research race
    - Supports focused industrial execution better than broad platform expansion
    - Trigger likely if software ambitions broaden faster than deployment revenue
    - No public financing obligations disclosed
  notes: This table intentionally emphasizes capital adequacy rather than exact cash balance because Walden has not disclosed closing cash, burn, or debt.
