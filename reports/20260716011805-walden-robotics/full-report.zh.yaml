      - number: '8.3'
        title: 建议、正向论点与反论点
        blocks:
          - type: paragraph
            body: >-
              在当前公开价格背景下，建议是继续研究（research-more），而不是明确推进或明确放弃。多头逻辑很容易表述：如果商业化能放大，Walden
              可能是少数同时具备足够技术深度、足够资本和真实工厂证明的工业机器人剥离公司，能成为真正品类领导者。反论点同样重要：当前估值可能已经计入了比公开证据能支撑的更多商业必然性。如果客户广度、安全可靠性和单位经济落后，投资人可能是在为一个仍脆弱的运营故事支付高溢价倍数。这里价格敏感度很重要。若入场估值低得多，或尽调证据显著更强，判断可以转向
              推进（pursue）。反过来，如果出现集中度、烧钱或安全滑坡证据，判断会转向放弃（pass）。现有证据支持谨慎中间立场：上行空间存在，但对于一家收入未披露或几乎未披露的硬件公司，价格已经很贵。
