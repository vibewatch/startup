      - number: '7.4'
        title: 缓释框架、可监控触发项与投资判断破坏项
        blocks:
          - type: paragraph
            body: >-
              应对 Walden 这一组风险，不是立刻否决，而是设定严格条件。若管理层能拿出具体数据，几个主要风险都可以处理：安全部署记录、重复站点扩张、明确客户
              ROI、架构治理，以及可信的第二层领导梯队。但在这些数据可见之前，投资人应定义可监控的止损标准。如果在合理商业化窗口之后，Toyota
              仍是唯一有意义的参考客户，集中度风险就应被纳入投资论证。如果安全或质量事件出现而公司没有透明缓解，公司的核心优势——对精英技术执行的信任——会迅速变弱。如果现金消耗快于客户证明，融资叙事会从战略强项反转为稀释风险。这些是可衡量的问题，不是抽象恐惧。因此，尽调的主任务是把公司叙事压进运营阈值；这些阈值要么确认投资判断，要么打破投资判断。
