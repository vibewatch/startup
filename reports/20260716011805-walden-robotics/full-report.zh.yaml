  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与真正重要的竞争对手
        blocks:
          - type: paragraph
            body: >-
              Walden 的实际竞争集合不是互联网上每一家机器人公司。最贴近的直接同业，是那些为人类设计空间里的工业工作打造通用或人形系统的公司：Figure、Apptronik、Agility
              Robotics、Boston Dynamics、1X、Physical Intelligence，以及 Tesla 内部的 Optimus 项目。它们的重要性各不相同。Figure
              是品类里的原始资本和品牌领跑者。Apptronik 和 Agility 在公开点名的工业协议和运营商业化表述上最强。Boston Dynamics 是硬件老牌厂商，拥有最深的工业机器人品牌和 Hyundai
              支持的生产野心。Physical Intelligence 更像机器人基础模型平台，而不是工厂工作单元厂商，但仍会争夺人才、数据、资本和 OEM 关系。1X 和 Tesla
              则扩大了竞争框架，展示消费者或内部制造叙事多快会回流到工业竞争。面对这组对手，Walden 最清楚的楔子不是品类宽度，而是工厂部署可信度加上源自 TRI 的学习栈。
