  - id: FR003
    title: 依赖关系图
    type: dag
    layout: standard
    summary: Walden 的执行力靠一条异常紧密的链条支撑：锚定客户证明、战略伙伴、创始人可信度和资本纪律。
    data:
      nodes:
        - id: d1
          label: Walden 核心平台
          description: 机器人硬件、物理 AI 栈、部署引擎
        - id: d2
          label: Toyota 锚定证明
          description: 当前量产可信度和扩张潜力
        - id: d3
          label: 战略投资者生态
          description: Boeing、Samsung、Toyota 相关资本与产业网络
        - id: d4
          label: 创始人 / 技术班底
          description: Tedrake 带来的可信度，以及扩充团队的能力
        - id: d5
          label: 客户多元化
          description: Toyota 之外的更多具名部署
        - id: d6
          label: 融资耐久度
          description: 现金跑道能覆盖验证窗口
      edges:
