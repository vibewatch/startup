  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 现有公开证据支撑的区间很宽，基准情景更接近当前轮次，而不是明显高于当前轮次。
    data:
      items:
        - id: bear
          label: 悲观情景
          low: 500
          value: 700
          high: 900
          unit: USDm equity value
        - id: base
          label: 基准情景
          low: 1000
          value: 1200
          high: 1500
          unit: USDm equity value
        - id: bull
          label: 乐观情景
          low: 1800
          value: 2300
          high: 2800
          unit: USDm equity value
    approximationNotes: 这些区间反映由里程碑驱动的结果，而不是公开市场倍数计算。
    claimRefs:
