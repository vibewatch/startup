      - number: '3.4'
        title: 切换成本、护城河耐久性与 Walden 的真实相对位置
        blocks:
          - type: paragraph
            body: >-
              竞争护城河仍在流动中。买方尚未明显被某一家人形机器人厂商锁住，因为品类仍未标准化，公开定价也大多缺失。多供应商试点风险很高：大型制造商可以先让多家厂商在不同任务上试点，再广泛承诺。分销权力也很可能集中到拥有深战略伙伴和制造入口的公司手里——Boston
              Dynamics 有 Hyundai，Apptronik 有 Mercedes 和 Google 关联，Agility 与 Walden 有 Toyota 关系，Optimus 则有 Tesla
              内部工厂网络。因此，Walden 的护城河逻辑必须比最大对手的故事更窄、更依赖执行。公开优势包括源自 TRI 的研究、Tedrake 异常强的控制与操作履历、大额种子轮，以及声称在 Toyota
              内部已经生产部署。公开弱点是定价可见度更薄、点名客户合同少于 Agility 或 Apptronik，资本规模也不如 Figure 或 Physical Intelligence
              压倒性。也就是说，如果市场奖励真实工厂契合度和学习速度而非表演，Walden 可以赢；但一旦规模、分销或数据网络效应快速向更大同业集中，公司仍然脆弱。
