        - 零部件与生产生态
        - 机器人制造与服务支持
        - 公开未知
        - 零件、执行器、电池或服务能力瓶颈拖慢规模化
        - 高
        - 验证双供应商与产能计划
        - 高
    notes: 公开文件没有披露 Walden 的供应商图谱，因此 Toyota 的集中度明确，基础设施和硬件依赖只能推断。
