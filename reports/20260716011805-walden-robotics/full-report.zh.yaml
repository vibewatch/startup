      - number: '8.2'
        title: 可比参照与情景逻辑
        blocks:
          - type: paragraph
            body: >-
              私有人形机器人和物理 AI 估值能提供参照，但不能解决定价问题。Figure 最新融资的投后估值达到 $39B，完全是另一量级。Physical Intelligence 和 Apptronik
              的头条估值也高得多；Agility 的公开上市交易高于 Walden，但低于最极端的私募标记。这些数字说明，投资人愿意为稀缺机器人平台激进付费。它们不能说明 Walden 便宜。ABB、Rockwell
              Automation、Teradyne 和 Symbotic 等公开自动化参照，有助于三角定位成熟工业自动化、机器人或 AI
              赋能供应链业务可能长成什么样，但结构上并不同。它们有披露收入、既有客户基础和大得多的运营系统。Walden
              更像一个由里程碑驱动的期权，而不是传统上市公司可比倍数标的。因此，情景框架应聚焦于：在下一次融资前，Walden 能否把种子轮资本和 Toyota 证明转化为多元化商业牵引。
