            title: 后续章节应把 Toyota 部署视为适配性的强证据，而不是可复制性的证明。
            body: 单一工厂部署大幅降低了技术可信度风险，但还不能回答 Walden 能否在多客户、多设施里复制同样的经济性、安全表现和工作流契合度。
