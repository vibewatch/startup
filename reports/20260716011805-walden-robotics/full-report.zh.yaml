      - number: '4.3'
        title: 成本结构、利润率驱动与营运资本现实
        blocks:
          - type: paragraph
            body: >-
              Walden 可能的成本结构更接近先进工业自动化，而不是纯软件。上市公司文件和工业 OEM 披露显示，物理 AI
              栈反复出现同几类成本：库存以及物业、厂房和设备；保修准备和服务负债；现场部署与系统集成人工；以及为提升机器人表现所需的持续算力、数据和可靠性工作。Hyundai 经审计的 2025
              报告显示，即使达到汽车规模，保修、库存、PP&E 和金融负债仍是核心；Tesla 的 2025 10-K 也继续把 Optimus 视为大型制造和 AI 工作的一部分，而不是低资本软件产品。这并不意味着
              Walden 会直接复制这些成本线，但确实说明，利润率路径取决于制造良率、机器人正常运行时间、服务负担，以及软件跨客户复用速度。公开来源没有暴露 Walden 的 BOM
              成本、毛利率、保修假设、利用率或营运资本画像。结果，最重要的投资判断问题不是 Walden 能不能融资——它已经融到了——而是一台机器人部署能否变成可复制、并且软件权重越来越高的单元经济。
