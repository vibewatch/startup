chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、产品形态与当前部署姿态
        blocks:
          - type: paragraph
            body: >-
              Walden Robotics 把自己定位成全栈物理 AI 公司，而不是纯软件模型厂商，也不是传统工厂自动化集成商。从发布公告、官网首页、公司页面到联系流程，公司反复强调自己搭建硬件、软件、前沿级物理 AI
              和应用层，把通用机器人放进制造与物流场景干活。公司在走出隐身仅一天后就提出了一个很强的运营主张：Walden 称，其机器人自 2026 年 2 月起已经在 Toyota
              北美工厂生产中承担有用工作；第三方报道还补充，至少一台机器人已经跑过 8 小时班次，任务包括上料、机器清洁和配套拣配。物理形态同样关键。Walden
              没有追逐纯双足叙事；外部首发报道称，公司为现有工厂内的安全、实用性、电池和算力因素选择了轮式底盘。轮式路线让公司更容易进入今天的棕地工业环境，也说明其定位刻意务实、并不追求电影感。
