  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: Walden 卖给谁，以及这些买方为何合理
        blocks:
          - type: paragraph
            body: >-
              Walden 的目标客户画像是大规模工业运营方：拥有重复物理工作流、劳动力压力、安全敏感任务，并且流程成熟到可以在真实设施中部署机器人。Toyota
              是最清楚的例子，因此也是理解其余客户地图的最重要锚点。Toyota
              公开的北美制造版图覆盖庞大的工厂、电池、发动机、整车和供应商生态网络，这让它成为理想验证场：机器人需要足够密集的重复任务，也需要可衡量运营价值。Boeing 和 Samsung 拓宽了可能买方原型。Boeing
              带来航空航天生产和复杂制造环境敞口，那里劳动力、质量和安全都居核心位置。Samsung 既带来风险投资人关系，也有到 2030 年把制造转向 AI 驱动工厂的公开战略。这些并不能证明已签客户合同，但确实表明
              Walden 正被拉向大型企业买方，而不是小型实验室。公开证据因此支持一个狭窄但可信的目标细分：拥有难招人或人体工学困难工作流的蓝筹制造商。
