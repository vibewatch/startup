              - CO027
              - CO037
              - CO038
          - type: callout
            title: 轮式设计选择是商业化逻辑，不是外观细节。
            body: Walden 发布时避开腿部，说明公司优先优化现有工厂的安全、续航和载荷约束，而不是追逐病毒式传播的人形外观。产品逻辑比许多同业更贴近工业现实。
            calloutType: insight
