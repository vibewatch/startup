      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              Walden
              的实际买方地图比品类口号窄。短期经济买方通常是制造或物流组织，它们希望缓解劳动力瓶颈、提升吞吐或减少人体工学负担，同时不改造每一个工位。日常用户是工厂或仓库运营团队：班组长、操作员、维护人员、工业工程师和安全团队，他们必须信任系统能在人和现有设备周围工作。付款方通常由工厂领导、运营、供应链管理、自动化工程和财务赞助人组合而成，评估指标包括正常运行时间、劳动力替代和资本效率。公开同业证据让采用路径变得可见。Apptronik
              的制造页面主打产线旁支持、配套拣配、检测和机床上下料。Agility 的 Toyota Motor Manufacturing Canada 公告展示了从试点到商业协议的路径。Boston Dynamics
              围绕企业级物料搬运和订单履约定位 Atlas，Figure 的总体规划则首先指向制造、运输与物流、仓储和零售。共同模式是：采用从已经承压设施里的重复工作流开始，只有在安全验证、IT/OT
              集成和基本正常运行信任建立后，才会扩张。
