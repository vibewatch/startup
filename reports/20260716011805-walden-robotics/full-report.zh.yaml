            body: >-
              几乎所有持久性问题在公开层面都没有答案。没有披露
              NRR、GRR、续约率、合同长度、积压订单转化率或重复站点部署数。公开记录因此还无法区分一个黏性企业机器人平台和一个令人印象深刻但孤立的锚点部署。可能的扩张逻辑容易理解：先进入一个工作流，证明可靠性，再扩到相邻任务、班次或工厂。但在
              Walden 展示重复合同或超过一个点名客户之前，这套逻辑仍停留在理论层面。因此，集中度风险很高。如果 Toyota 是目前唯一有意义的部署，那么 Toyota
              的任何延期、预算削减、安全问题或任务契合过窄，都会不成比例地打击商业可信度。Boeing 和 Samsung 的公开投资人绑定略微缓和了这一风险，显示其他工业生态也有兴趣，但不能消除风险。目前，Walden
              的客户故事支持一个有希望的企业楔子，而不是已经去风险的装机基础。
