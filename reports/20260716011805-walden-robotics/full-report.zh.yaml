  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观：Toyota 扩张，出现第二个大客户，安全 / 可靠性指标强，软件杠杆改善
        - Walden 获得显著更高的私募估值，因为它开始像一个可复制工业采用的平台；示意区间 1.8B-2.8B
        - 执行仍难，但证明和战略稀缺性抵消一部分风险
        - 需要在当前现金跑道窗口内拿出多个具体证明点
      - - 基准：Toyota 仍强，但多元化推进缓慢，经济性只得到部分证明
        - 当前估值看起来大致合理到略偏满；示意区间 1.0B-1.5B
        - 叙事仍强，硬指标滞后
        - 最符合当前公开证据
      - - 悲观：锚定证明未扩张，安全或正常运行时间数据令人失望，或客户广度得到证明前就需要资本
        - 估值显著压缩，因为投资人将 Walden 重新归类为有潜力但未经证明的机器人项目；示意区间 0.5B-0.9B
        - 集中度、烧钱和执行滑坡相互叠加
        - 如果下一批披露仍单薄，悲观情景概率上升
    notes: 区间是分析情景输出，不是市场报价。
    claimRefs:
      - CV014
      - CV020
      - CV024
      - CV032
      - CV033
      - CV034
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 可比意义
      - 局限
    rows:
      - - Walden Robotics
        - 种子阶段物理 AI 分拆公司，已有一个公开锚定部署
        - $300M 种子轮，投后估值 $1.1B
        - 最直接参照，因为这就是待评估价格
        - 未披露收入或利润率
      - - Figure
        - 通用人形机器人平台
        - 官方披露 Series C 轮 >$1B，投后估值 $39B
        - 赛道稀缺估值上限参照
        - 资本规模大得多，叙事范围也更宽
      - - Apptronik
        - 工业人形机器人厂商
        - Reuters 报道估值约 $5B；公司称 Series A 累计 >$935M
        - 以工业为先的私营可比公司，拥有具名商业关系
        - 公开商业细节多于 Walden
      - - Agility Robotics
        - 工业人形机器人厂商
        - 上市交易的投前股权价值 $2.5B
        - 具备公开订单披露的工业部署可比公司
        - 阶段和上市交易机制不同
      - - Physical Intelligence
        - 机器人基础模型平台
        - 2025 年估值约 $5.6B，随后 2026 年融资洽谈估值 >$11B
        - 显示资本给物理 AI 平台叙事定价有多激进
        - 更像模型平台，而非工厂 OEM 业务
      - - Symbotic
        - 上市 AI 赋能仓储自动化公司
        - 上市机器人 / 自动化参照；FY2025 收入 $2.247B，调整后 EBITDA $147M
        - 可作为成熟度基准，说明大规模商业证明长什么样
        - 垂直领域、公开市场和商业模式不同
      - - Rockwell Automation
        - 上市工业自动化既有厂商
        - 成熟上市自动化参照，FY2025 10-K 公开可查
        - 锚定规模化工业自动化披露应有的样子
        - 不是初创公司，也不是人形机器人 OEM
      - - Teradyne / ABB
        - 上市自动化与机器人既有厂商
        - 拥有大型运营体系的上市工业机器人参照
        - 可用于对标成熟度和企业可信度
        - 业务组合和资本结构与 Walden 显著不同
    enumerationScope:
      coverage: partial
      basis: >-
        The comparable set mixes private humanoid rounds and public automation references because no perfect public comp
        exists for a seed-stage industrial physical-AI company.
    notes: 可比公司用于框定估值逻辑，不意味着倍数可以直接等同。
    claimRefs:
      - CV001
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
  - id: TV005
    title: 投资逻辑破裂与叫停触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 没有第二个具名生产客户
        - 下一个证明窗口后，客户广度实质上仍是一家
        - Walden 变成集中度押注，而不是可扩展平台
        - 如果没有折价或更强保护，避免支付溢价
      - - 安全 / 正常运行时间不及预期
        - 重大事故，或无法用文档证明强可靠性
        - 削弱核心论点：顶级技术血脉能转化为运营优势
        - 在技术证明修复前暂停或放弃
      - - 证明出现前烧钱上升
        - 多元化和经济性得到证明前就需要新融资
        - 战略种子轮优势转成稀释风险
        - 要求更强条款，或不推进
      - - 创始人 / 关键人冲击
        - 技术领导流失，或无法建立运营梯队
        - 降低把研究质量转成公司质量的概率
        - 除非梯队深度清晰可见，否则重新评估或放弃
      - - 市场溢价压缩
        - Walden 成熟前，物理 AI 估值情绪降温
        - 压窄退出选择，也让当前入场价格更难自证
        - 收紧估值纪律
    notes: 这些是投资逻辑破裂点，因为它们会直接削弱支撑种子轮溢价估值的论据。
    claimRefs:
      - CV024
      - CV026
      - CV031
      - CV032
      - CV035
      - CV037
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 付费部署经济性
        - 合同结构、ASP、支持负担、毛利率和客户 ROI
        - 区分期权价值和基本面价值
        - 管理层 + 财务资料室
      - - 客户多元化
        - 具名管线、试点、生产客户和重复场址扩张
        - 降低集中度，证明可复制性
        - 销售 / 客户成功尽调
      - - 产品可靠性与安全
        - 正常运行时间、MTBF、事故历史、认证状态和更新治理
        - 执行质量是关键风险变量
        - 工程 / 运营尽调
      - - 领导层与治理深度
        - 职能负责人、董事会构成、授权和继任准备
        - 创始人中心性目前过重，不能忽视
        - 组织 / 董事会尽调
      - - 资本计划
        - 月度烧钱、capex 承诺、现金跑道和下一轮触发条件
        - 决定当前入场价是否面临近期稀释风险
        - 财务 / 董事会尽调
      - - 商业扩张打法
        - Toyota 证明如何转化为新工厂、新任务和新客户
        - 这是让估值成立的机制
        - 产品 + GTM 尽调
    notes: 如果管理层能有力回应大多数问题，今天的估值会显得更站得住脚。
    claimRefs:
      - CV033
      - CV034
      - CV036
      - CV038
      - CV039
      - CV040
