  - id: TV001
    title: 投资建议摘要表
    columns:
      - 建议
      - 置信度
      - 风险评级
      - 估值立场
      - 决策含义
    rows:
      - - 继续研究
        - 中
        - 高
        - 按当前公开证明看估值偏满；只有私下执行数据更强时才算合理
        - 只有尽调补上付费牵引力、可靠性和客户多元化缺口，才继续推进
    notes: 该建议对价格敏感：更强证明或更低入场价格，都可能改变结论。
