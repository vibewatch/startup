        blocks:
          - type: callout
            title: 集中度是能把其他所有风险都转成融资问题的风险。
            body: 只要 Toyota 仍是唯一公开确认的量产参考，围绕该关系的任何运营、安全或时间问题，都可能直接传导到募资议价能力和外界感知的商业可信度。
