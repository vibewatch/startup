      - number: '4.2'
        title: 资本充足性、烧钱速度与现金跑道
        blocks:
          - type: paragraph
            body: >-
              头部种子轮重要，因为 Walden 进入的是一个通常需要多年投入、之后才出现耐久利润率的品类。Walden 的 $300 million 融资对一家 2026 年 1
              月才剥离的公司已经非常大，但仍明显低于公开来源记录的 Figure、Apptronik、Agility 和 Physical Intelligence 原始资本水平。因此，Walden
              有足够资金去建产品、招人和部署，但相对资金最充沛的对手，还不能说明显资本过剩。招聘页面显示公司正积极招聘机器人、硬件和 AI
              学科人才，这通常意味着高工资烧钱。训练模型、现场支持试点、制造或采购物理系统，也会进一步抬高固定现金需求。定性看，这轮融资很可能覆盖多年研发窗口；但现金跑道信心仍弱，因为 Walden
              没有披露当前员工数、月度烧钱、制造承诺，或 Toyota 是否通过付费合同抵消部署成本。投资人应把资本充足性视为绝对意义上很强，但仍取决于公司能否守住部署经济纪律。
