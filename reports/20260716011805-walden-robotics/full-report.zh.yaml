  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: 技术和合规失误会传导为客户延迟、资金需求上升和估值支撑变弱。
    data:
      nodes:
        - id: n1
          label: 安全 / 合规缺口
          description: 工作场所安全、测试、AI 治理、责任暴露
        - id: n2
          label: 运营可靠性缺口
          description: 正常运行时间、支持负担、更新退化、泛化风险
        - id: n3
          label: 客户集中度
          description: Toyota 是唯一具名的量产证明点
        - id: n4
          label: 商业扩张放慢
          description: 试点、部署或站点扩张落后于预期
        - id: n5
          label: 更高烧钱 / 更长验证周期
          description: 多元化尚未证明，资金先被吃掉
        - id: n6
          label: 融资议价力变弱
          description: 证明范围仍窄，投资人会折价看叙事
      edges:
