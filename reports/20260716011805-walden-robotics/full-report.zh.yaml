  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前价格真正买的是什么
        blocks:
          - type: paragraph
            body: >-
              Walden 当前估值不是常规收入倍数故事。公司刚走出隐身，就带着 $300M 新资本、以 $1.1B
              估值发布，同时仍保留大部分商业指标，而这些指标通常是成长期投资人定价的锚。支撑这个价格的公开理由，不是收入，而是三件事的组合：来自 TRI 和 Russ Tedrake 的顶级技术血统、Toyota North
              America 内部一个有意义的生产证明点，以及物理 AI 这一主题的战略重要性。这些要素都真实存在。但估值缺口同样真实。Walden
              没有披露收入、毛利率、客户数量变化、重复站点扩张或单位经济证明。也就是说，头条价格买的是未来执行和稀缺品类位置，不是已经审计的当前业务基础。投资人必须讲清这个区别，因为它决定他们是在承销基本面，还是在买一个品类赢家期权。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
