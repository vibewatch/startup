        title: 产品范围、形态与 GTM 差异
        blocks:
          - type: paragraph
            body: >-
              产品策略是这个领域开始分化的地方。Walden 官方材料强调当前生产中的制造和物流工作流，发布日报道突出其轮式底盘架构，称这是对现有工厂内安全、续航和实用性的刻意让步。这不同于 Figure
              同时向家庭和商业场景扩张的更宽野心，也不同于 1X 明确的消费机器人姿态，更不同于 Physical Intelligence 聚焦于可驱动机器人的通用 AI
              模型、但自身并不定义一套集成工业部署栈。Apptronik 和 Agility 在即时目标客户逻辑上更像 Walden：它们明确谈到真实生产环境中的配套拣配、机床上下料、物流支持和劳动力缺口。Boston
              Dynamics 稍微独立，因为 Atlas 带着企业级规格、MES/WMS 集成语言和 Hyundai 支持的生产规模进入市场。Tesla 也独立：其 2025 10-K 把 Optimus 放进 Tesla
              更广的 AI 与工厂战略，而不是一个必须证明独立 GTM 契合度的创业公司。结果是，Walden 最直接竞争的是工业优先的人形机器人厂商，而不是每一个宽泛的具身 AI 叙事。
