      - number: '7.3'
        title: 伙伴依赖、人员集中与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              Walden 还暴露在典型依赖和执行风险里。Toyota 同时是公司最强证明点、很可能的战略盟友，也是在公开部署广度仍窄时最大的集中度隐忧。Boeing 和 Samsung
              等投资人拓宽了生态，但不能替代多元化收入。人员层面，Russ Tedrake 不只是
              CEO；他本身就是技术信任叙事的一大部分。任何分心、离任，或无法把领导层梯队扩起来，影响都会被放大。顶尖机器人技术人才争夺也很激烈，尤其要与 Figure、Boston
              Dynamics、Apptronik、Physical Intelligence 和 Tesla
              等公司竞争。财务上，公司种子轮很大，但硬件、现场支持、训练和制造爬坡都会快速吃掉资本。如果付费客户扩张滞后，Walden
              可能一边用有限现金池支撑漫长证明周期，一边看着资本更厚的同行继续大手笔投入。简言之：公司今天不缺资源，但仍高度依赖合作伙伴撬动、创始人执行和有纪律的资本投放。
