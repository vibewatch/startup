      - number: '4.4'
        title: 财务结论与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              财务结论因此是混合的。Walden
              的种子轮降低了短期融资风险，让公司在下一轮融资前有可信机会做出真实工业验证。这是重大优势。但公开投资人仍无法判断收入质量、利润率结构或现金跑道耐久性，因为公司几乎没有披露能让机器人业务按基本面投资的私人指标。即便最强公开正面因素——Toyota
              生产部署——也没有回答 Walden 是否拥有可复制付费需求、企业销售周期多长、客户看到什么回本，或现场支持是否会吞掉毛利。相对同业，Walden
              的资金水平高于其年龄通常能支撑的水平，但文档化程度又低于成熟工业自动化投资判断所需。这个组合支持在财务上继续研究：公司今天并不明显缺钱，但围绕付费牵引和单元经济性的缺失数据太核心，不能忽视。
