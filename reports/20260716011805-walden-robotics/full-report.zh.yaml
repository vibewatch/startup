            body: >-
              Walden 最大的产品未知数是运营成熟度。公司声称其机器人已经在 Toyota North America
              产生生产力，但没有发布正常运行时间、MTBF、安全事故率、部署时长或点名认证。公开信任表面也很薄：网站为在线服务提供隐私和条款页面，但这些不能替代机器人车队安全架构、功能安全文档或工业合规披露。外部材料有助于界定好状态应该长什么样。OSHA
              的机器人标准页面、EU Machinery Regulation 和工业机器人安全指引都强调风险评估、防护和人机界面设计。Agility 和 Boston Dynamics
              在公开层面对安全测试和企业部署条件更明确，Apptronik 则映射出配套拣配和机床上下料等具体任务。Walden
              的产品内部或许确实达到或超过这些标准，但公开记录尚未展示证据。投资人因此应把可信技术脉络，与未经验证的现场可靠性和合规成熟度分开看。
