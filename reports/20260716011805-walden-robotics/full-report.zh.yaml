  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现可见度
        blocks:
          - type: paragraph
            body: >-
              Walden 的公开表面更像一家企业机器人公司，销售或租赁带结果承诺的部署，而不是自助式软件产品。发布稿、官网首页和联系页面都围绕让机器人今天就「上岗」服务制造商来叙述，公司页面则描述覆盖硬件、软件、物理 AI
              和应用层的完整栈。这强烈暗示几层变现：机器人系统销售或租赁、集成和部署服务、持续软件 /
              模型更新，以及经常性支持。但经济上决定性的部分全部缺席。没有公开标价，没有说明是机器人即服务还是资本开支购买，没有披露合同长度，也没有说明 Toyota 的生产部署是付费、补贴还是战略性安排。在同业里，1X
              仍是最清楚的公开定价参照，但其面向家庭的定价不能直接移植到工业工厂部署。Figure、Apptronik、Agility 和 Boston Dynamics 同样把公开定价留得很稀少。因此，Walden
              的收入模式在结构上看得懂，但经济性仍不透明。
