  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流契合度
        blocks:
          - type: paragraph
            body: >-
              Walden 用工作流而不是 SKU 表来定义自己的产品。官网首页称，公司正在搭建完整栈——硬件、软件、前沿级物理 AI
              和应用层；发布稿称，机器人面向工厂、仓库和其他真实世界场景里的高体力要求工作。公司和联系页面进一步说明，这是瞄准既有工业运营的企业部署产品，不是消费机器人。公开报道补充了一个重要实践细节：Walden
              当前产品似乎为工厂环境优化，采用轮式底盘，而不是完整腿式人形形态；这个选择可能改善结构化室内工作流中的续航、安全和部署实用性。这个设计点重要，因为它把初始用例范围收窄到可预测移动、重复任务和安全边界比泛化人类模仿更重要的地方。简言之，Walden
              短期产品最好理解为面向结构化制造和物流任务的工业物理 AI 工人。
