            title: 工业机器人市场已经真实存在；人形楔子只是上面的不成熟新层。
            body: Walden 不需要证明工厂会不会买自动化。它需要证明，在固定自动化或纯人力当前都不合适的任务子集中，通用物理 AI 机器人能够胜出。
