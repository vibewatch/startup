  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Walden 的公开披露没有显示眼前存在执法或诉讼问题，但暴露出很密的合规面。工业机器人在人员周边运行，可能触发工作场所安全制度、机械规则、检测实验室预期，以及更广泛的 AI 治理框架。OSHA
              的机器人概览和机器防护材料讲得很清楚：即便 OSHA 没有为每一种机器人场景单独写规则，雇主仍要履行既有安全义务，包括防护、降低危害和安全操作。欧盟机械和 AI 框架又给任何可能进入欧洲市场、或具备类似高风险
              AI 功能的产品加了一层要求。Hill Dickinson、MLT Aikins 和 Today’s General Counsel
              的法律评论进一步说明，机器人能力越强、越嵌入工作场所，自主性、产品责任、数据收集和劳动法问题都会扩大。Walden
              自己的条款和隐私页面说明公司考虑过在线服务的法律问题，但没有回答更难的问题：机器人遥测、事故报告、产品责任分配，或现场级安全治理。
