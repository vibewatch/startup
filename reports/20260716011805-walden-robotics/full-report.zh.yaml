            title: 公开运营披露远远落后于融资头条。
            body: 发布材料披露了轮次规模、估值和投资人名单，但没有披露收入、客户数、单元经济性或广泛客户名单。公司容易让人佩服，但仍很难支撑投资判断。
            calloutType: risk
            claimRefs:
              - CO002
