          to: d5
        - from: d3
          to: d5
        - from: d4
          to: d1
        - from: d1
          to: d5
        - from: d5
          to: d6
        - from: d4
          to: d6
    claimRefs:
      - CR021
      - CR024
      - CR027
      - CR028
      - CR030
      - CR037
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 品类位置强、商业证明尚未完整，再叠加种子轮高价估值，直接推导出当前建议。
    data:
      nodes:
        - id: n1
          label: 顶级 TRI 背景 + Toyota 证明
        - id: n2
          label: 巨额种子轮降低短期融资风险
        - id: n3
          label: 收入、利润率和覆盖广度仍未披露
        - id: n4
          label: 当前 $1.1B 估值已计入有意义的执行成功
        - id: n5
          label: 继续研究建议
      edges:
