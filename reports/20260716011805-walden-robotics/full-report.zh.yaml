      - number: '1.4'
        title: 里程碑、技术传承与披露边界
        blocks:
          - type: paragraph
            body: >-
              Walden 的发布叙事比一个从零开始的概念型创业公司更可信，因为公司站在一条早于自身存在的、有记录的研究弧线上。Toyota Research Institute 和外部报道过去几年公开追踪了
              Diffusion Policy、Large Behavior Models 和全身操作的进展；2026 年 3 月的隐身创业报道已经显示，Tedrake 从 TRI 转向新的物理 AI 创业公司在 2026 年
              7 月发布前数月就已启动。官方发布公告进一步把这条技术脉络接到商业意图上：Walden 在 2026 年 1 月剥离，并在不到两个月内从首个试点走到真实工作。与此同时，反向和谨慎证据不能忽视。TNW
              的首发报道把人形机器人竞赛描述为拥挤且未经验证，引用 Tedrake 称成功并无保证，并强调公司因为工厂用户尚未准备好接受腿式机器人而刻意避开腿部。Bain 更广的 2025
              行业分析也强化了一个判断：多数人形机器人部署仍处于早期、高结构化阶段。因此，正确解读这条时间线，既不是「科研项目」，也不是「商业化已解决」。Walden
              有真实履历和早期部署信号，但公开证据距离规模化、可复制经济性仍差很远。
