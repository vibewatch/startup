      - number: '2.2'
        title: 规模测算口径、增长驱动与市场为何先显大、后变现
        blocks:
          - type: paragraph
            body: >-
              只有用多重口径，才能相对可信地测算这个市场。成熟基线是工业机器人：IFR 称 2024 年安装了 542,000 台机器人，年安装量连续第四年维持在 500,000 台以上。Axis Intelligence
              补充，全球在役工业机器人达到 4.66 million 台，并强调 South Korea 等市场的机器人密度很高。既有装机基础重要，因为它说明制造商已经在规模化采购自动化。新兴层是人形和物理 AI
              机器人：Axis 估计，2025 年人形机器人市场收入大约 $4.89 billion，2026 年升至约 $6.24 billion；2025 年出货 18,000 台，行业累计风险投资接近 $9.8
              billion。这些数字方向上重要，但不应被当成 Walden 的即时收入池。Bain、Humanoid.guide
              以及同业厂商的运营页面都显示，早期商业化仍集中在结构化工业场景，而不是泛化的「到处可用机器人」。最站得住的增长驱动是劳动力短缺、回流和本土生产压力、AI
              能力提升，以及在不彻底重做工厂布局的前提下增加柔性自动化的经济吸引力。
