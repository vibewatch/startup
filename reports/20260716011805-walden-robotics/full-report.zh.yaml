  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 什么会改变判断
    rows:
      - - 顶级 TRI 分拆背景叠加 Toyota 生产证明，可能让 Walden 成为少数工业物理 AI 赢家
        - 如果 Walden 展示多个付费部署、重复场址扩张和强安全 / 可靠性指标，判断会上修
      - - $300M 大额种子轮降低近期融资风险，也给商业化留出时间
        - 如果烧钱受控，且多元化证明前不需要下一轮融资，判断会上修
      - - 战略投资人基础暗示产业需求和生态入口
        - 如果 Boeing、Samsung 或可比大型制造商成为真实客户或设计伙伴，判断会上修
      - - 公开财务披露稀少，当前估值可能已经计入公司大部分预期上行
        - 如果定价更有吸引力，或尽调证明单位经济性异常强，判断会上修
      - - 人形机器人和物理 AI 主题可能支撑战略溢价
        - 如果赛道降温，或执行落后于资本更充足的同行，判断会下修
    notes: 投资逻辑和反向逻辑都成立；决策取决于价格和证明，而不只靠叙事。
    claimRefs:
