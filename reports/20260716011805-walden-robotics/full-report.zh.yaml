      - 依赖或缺口
      - 发生概率
      - 严重性
      - 缓释措施
      - 尽调路径
    rows:
      - - CEO / 技术信任锚（Russ Tedrake）
        - 创始人对技术可信度和外部信心都过于关键
        - 中
        - 高
