      - number: '2.4'
        title: 约束、监管与时点为何仍是最大变量
        blocks:
          - type: paragraph
            body: >-
              最强的采用约束不是概念，而是运营。Bain
              分析称，多数人形机器人部署仍处于试点阶段，往往在高度结构化环境中运行，并伴随显著人工监督。报告还指出自治差距、操作局限和电池表现仍不足以支撑完整无人值守班次。Humanoid.guide
              把灵巧手、安全内生设计和认证列为规模化硬门槛。法律和监管层进一步强化谨慎判断。EU AI Act 为某些系统增加 AI 治理义务，EU Machinery Regulation
              则覆盖先进机器人的物理机器安全。OSHA 指出，美国缺少专门的机器人标准，部署方只能转向一套既有标准和指引拼成的框架，这提高了集成负担。Hill Dickinson、MLT Aikins 和 Today’s
              General Counsel 的法律评论进一步强调，当机器人和具身 AI 与人一起工作时，责任分配、网络物理风险和劳动法合规仍有未解问题。放到 Walden
              身上，市场已经大到足以支持今天投入，但商业化速度仍受闸门约束，取决于具体工作流多快通过安全、信任和经济性验证，而不是头部 TAM 主张有多好看。
