      - number: '8.4'
        title: 最终尽调门槛、下行情景触发项与退出准备度
        blocks:
          - type: paragraph
            body: >-
              尽调议程应聚焦：Walden 是否配得上按未来平台赢家估值，而不仅仅是一个优秀研究剥离公司。最重要的缺口是付费部署经济性、客户多元化、产品可靠性、安全治理和资本消耗纪律。这些不是锦上添花的细节；它们决定
              $1.1B 入场点到底保守、公允还是激进。退出准备度现在还太早，无法按任何常规方式承销。公司尚未证明足够广的证据面，让 IPO
              式或战略退出猜想不止停留在叙事上。这不削弱战略可选性，但应该让投资人保持纪律。实际做法是定义明确尽调门槛，并且只有在管理层能用数据跨过这些门槛时，才支付今天的价格。否则，相比基于现有公开证据给出高确信买入，Walden
              更适合被密切跟踪。
