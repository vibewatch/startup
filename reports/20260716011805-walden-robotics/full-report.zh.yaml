  - id: TR005
    title: 缓释措施与叫停标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 客户集中
        - 没有第二个具名生产客户
        - 下一个商业里程碑窗口后，仍只有一个有意义案例
        - 下调客户可扩展性论点
      - - 安全 / 可靠性
        - 重大事故、反复停机或认证关口失败
        - 任何未受控事故，或无法通过客户安全审查
        - 在根因和缓释证据得到证明前暂停或拒绝
      - - 资本密集度
        - 烧钱提速，但没有匹配的商业证明
        - 现金跑道短于计划证明窗口，或多元化前就需要新融资
        - 重新定价风险，或避免按当前条款参与
      - - 人才集中
        - 关键技术领导流失或分心，且没有梯队接替
        - 创始人 / 关键高管离任，或无法列出强运营梯队
        - 重新评估执行概率和治理质量
      - - 运营可复制性
        - Toyota 证明未扩展到相邻任务 / 场址，也没有出现可比新客户
        - 锚定部署仍是孤例
        - 将 Walden 视为亮眼项目，而非可扩展平台
      - - 网络安全 / 产品治理
        - 安全开发或更新治理控制仍无文档
        - 没有机群安全、回滚或事件响应流程证据
        - 将产品治理整改作为投资条件
    notes: 这些触发项把叙事风险转成可观察的运营阈值。
    claimRefs:
