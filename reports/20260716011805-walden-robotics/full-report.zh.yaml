        title: 架构与学习栈
        blocks:
          - type: paragraph
            body: >-
              Walden 周围最强的公开技术证据来自其 TRI 脉络。Toyota 的 2023 Diffusion Policy 公告以及 Columbia
              论文描述了一种视觉运动策略学习方法，利用动作扩散生成机器人行为。之后 TRI 和 Robot Report 关于 Large Behavior Models
              的材料，则勾勒出一个更广的栈，用来加速机器人跨任务学习；Toyota / Boston Dynamics 公告还展示了把全身运动和操作迁移到 Atlas 上。这并不能证明 Walden
              部署产品只是这些论文的直接包装，但确实说明创始团队取材于严肃技术底座，既有公开方法，也有真实机器人演示。Drake 又在基于模型的设计和验证上增加了一层可信度。与同业相比，Walden 披露的栈不如
              Physical Intelligence 的 openpi 工作开放，也不如 Apptronik 或 Agility 的公开解决方案页面产品化，但从研究到部署的连续性，可能比许多发布阶段进入者更深。
