      - number: '1.2'
        title: 创始背景、领导可信度与团队扩张
        blocks:
          - type: paragraph
            body: >-
              公开记录里最清楚的优势是创始人与市场匹配。Russ Tedrake 不是借 AI 市场热度新近包装出来的创始人；MIT 官方页面称，他是 MIT 电气工程与计算机科学、航空航天和机械工程的 Toyota
              Professor，MIT Center for Robotics 主任，并曾领导 Team MIT 参加 DARPA Robotics Challenge。他自己的 Robot Locomotion Group
              简介称，他在 Toyota Research Institute 担任 Robotics Research and Large Behavior Models 高级副总裁 10 年，之后转向创业。Walden
              发布材料把他放在公司中心，任联合创始人兼 CEO；公司页面则把创始团队扩展到来自 Toyota Research Institute、MIT、Stanford 和 Amazon
              的先行者。与成熟工业公司相比，公开领导层厚度仍然有限，但招聘页面确认公司正在机器人、AI、运营、产品和业务职能上招人，联系页面也显示公司已经向潜在工业用户征集部署交流。核心尽调结论是：公开团队信号顶级，但仍集中在
              Tedrake 和小规模创始核心周围，还不是完整披露的高管班子。
