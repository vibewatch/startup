  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 围绕当前轮次，少数几个证明变量驱动了大部分价值波动。
    data:
      items:
        - label: 第二个具名量产客户
          value: 350
          description: 若广度证明公开，按 USD 百万美元计的示意上行空间
        - label: 强毛利率和 ROI 证明
          value: 250
          description: 若付费经济性得到验证，对应示意上行空间
        - label: 安全 / 正常运行时间证明
          value: 200
          description: 若可靠性和合规风险被化解，对应示意上行空间
        - label: Toyota 之外没有多元化
          value: -300
          description: 若集中度持续，对应示意下行空间
        - label: 验证窗口前就需要融资
          value: -250
          description: 若烧钱速度跑在商业证明前面，对应示意下行空间
    approximationNotes: 敏感性条形图是围绕当前估值的分析性变化量，不是市场报价。
