      - number: '7.2'
        title: 运营、质量、安全与技术风险
        blocks:
          - type: paragraph
            body: >-
              Walden 最大的非法律风险很简单：源自研究的机器人栈能否在规模化时变成可靠的工业系统。公司称已在 Toyota
              开展生产性工作，但没有发布正常运行时间、MTBF、部署时长、保修指标、安全事件或服务负担。也就是说，投资人要从技术血统跨到运营可靠性，却缺少通常用来证明这座桥存在的数据。NIST 的 AI RMF 和 CISA
              的 Secure by Design 指南在这里有用，因为它们强调可信 AI
              和网络韧性必须嵌入产品开发和部署，不能事后补上。机器人机群里，一次失效可以是物理的、数字的，或两者兼有。传感器、策略、控制系统和更新路径都会成为风险传导通道。公开架构、监控和事故治理细节缺位，并不能证明
              Walden 薄弱，但会抬高剩余不确定性。正确解读是：Walden 的技术承诺真实存在，但运营成熟度在公开证据里只证明了一部分。
            claimRefs:
              - CR011
              - CR012
              - CR013
