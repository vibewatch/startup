        - 要求提供组织架构图和授权地图
      - - CTO / 研究到产品转化
        - 需要把研究转成可复制的现场产品
        - 中
        - 高
        - 把路线图、发布流程和可靠性指标落进运营机制
        - 要求提供发布治理和产品运营节奏
      - - 部署 / 现场运营梯队
        - 需要足够现场人才完成调试并支持客户
        - 中
        - 高
        - 提前扩充现场工程和支持流程
        - 要求提供现场人员计划和支持比例
      - - 相比大型同行的人才留存
        - 面临 Figure、Tesla、Boston Dynamics、Apptronik、PI 等竞争
        - 高
        - 中到高
        - 提供使命吸引力、资本稳定性和技术自主权
        - 要求提供招聘漏斗、流失率和关键岗位空缺
      - - 治理 / 运营梯队深度
        - 相比公司野心，公开领导层名单仍显单薄
        - 中
        - 中
        - 补充有经验的运营者和独立治理深度
        - 要求提供董事会构成和具名职能负责人
    notes: Walden 的外部可信度紧紧绑定具名技术负责人，因此人才风险格外重要。
