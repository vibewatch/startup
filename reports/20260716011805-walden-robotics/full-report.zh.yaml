companyProfile:
  summary: >-
    Walden Robotics 是一家位于 Cambridge, Massachusetts 的物理 AI 机器人公司，2026 年 1 月从 Toyota Research Institute 剥离，并于 2026-07-15
    公开亮相。公司称自己搭建从硬件、软件、前沿级物理 AI 到应用层的完整栈，把通用机器人部署进真实工业工作流。公开商业叙事围绕 Toyota North America 工厂部署展开；Walden 称，该部署自 2026 年 2
    月起已经在生产中承担有用工作。Walden 以 $300 million 种子轮融资、$1.1 billion 估值亮相；公司披露还这么早，资本底座已异常强。核心尽调问题不是 Walden
    是否拥有顶级技术和战略要素，而是缺少更广客户、经济性和可靠性验证时，技术和战略要素是否已经撑得起当前价格。
