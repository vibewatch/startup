      - number: '1.5'
        title: 佐证要点
        blocks:
          - type: callout
            title: 很少有机器人公司在发布这么早就同时拥有顶级履历和声称的生产工作。
            body: Walden 在发布时就把顶级学术 / 研究履历与具体工厂部署主张放在一起。即使公开记录仍太薄，尚不足以证明规模化经济性，这也明显强于纯演示阶段叙事。
            calloutType: strength
            claimRefs:
