      - number: '3.2'
        title: 融资、估值与已披露商业规模
        blocks:
          - type: paragraph
            body: >-
              已披露资本层级差距很明显。Figure 官方 Series C 公告称，其承诺资本超过 $1 billion，投后估值 $39 billion。Reuters 报道的 Apptronik 2026 年 2
              月轮次给出约 $5 billion 估值，Apptronik 自己的新闻页面称 Series A 总额超过 $935 million。Agility 2026 年 6 月公开上市公告把公司定在 $2.5
              billion 投前权益价值，并称 Digit v5 多年订单超过 $300 million，同时描述当前已在 9 个设施部署。Physical Intelligence
              的公开记录更偏模型平台，但仍然强大：The Robot Report 称其 Series B 融资 $600 million，累计约 $1.1 billion，估值大约 $5.6
              billion；TechCrunch 称其已经在讨论另一轮超过 $1 billion、估值超过 $11 billion 的融资。1X 的公开 Sacra
              资料显示，历史融资明显少于上述公司，但拥有更不寻常的消费者加企业模式，并披露可见租赁定价。因此，Walden 以 $300 million、$1.1 billion
              估值从刚剥离公司起步，规模已经很大，但无论估值还是公开披露的商业规模，都仍小于品类领头羊。
