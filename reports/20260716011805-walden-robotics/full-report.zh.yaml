      - number: '1.3'
        title: 资本底座、投资人版图与商业信号
        blocks:
          - type: paragraph
            body: >-
              以种子期硬件公司的标准看，Walden 的融资画像很不寻常。公司称其以 $300 million 种子轮、$1.1 billion 估值亮相，由 Toyota 系实体和 Deviation Capital
              共同领投，NVIDIA、Boeing、Samsung Ventures、Prologis Ventures、CoreWeave Ventures、AE Ventures
              以及多家财务投资人参投。投资人名单重要有两个原因。第一，Walden 在证明可复制商业经济性之前，就拿到了远多于多数机器人创业公司的研发现金跑道。第二，制造、航空航天、算力、物流和工业资本生态的战略背书，正好贴合
              Walden
              的目标工作负载。代价是，公开证据在「谁投了公司」上远比在「这些投资人承销了什么业务基本面」上丰富。发布材料没有披露收入、ARR、单元贡献利润率、客户数，或除头部估值和参与方名单之外的轮次经济条款。因此，Walden
              带着强资本和强信誉故事进入市场，但运营数据刻意不透明，后续章节必须谨慎处理。
