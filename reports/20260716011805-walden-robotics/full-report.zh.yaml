  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、邻近领域与 Walden 实际切入点
        blocks:
          - type: paragraph
            body: >-
              Walden 的正确市场边界不是「所有机器人」，甚至也不是「所有人形机器人」。公司具体瞄准的是工厂和物流环境：任务重复、体力负担重，变化性足以让固定自动化尴尬，但结构化程度又足以让短期物理 AI
              系统安全运行。Walden
              官方材料首先强调制造和物流，同时点名汽车、航空航天、半导体、电子、物流和生命科学领域的战略伙伴。这把公司放在工业自动化、机床上下料、产线旁支持、配套拣配和移动物料搬运工作流的交集上。现状替代方案很关键：只要产线单元能围绕高量重复性重做，固定工业机器人仍是默认选项；传统协作机器人和
              AMR 覆盖更窄、自治要求更低的任务；当变化性、人体工学和判断力压过刚性自动化时，人力仍占主导。Apptronik、Agility、Figure 和 Boston Dynamics
              的同业材料都强化了同一个基础商业楔子：早期价值来自重复的工业支持工作，而不是开放世界家庭机器人。因此，Walden
              的市场最好理解为工业自动化里一个受约束的子集，通用形态可以降低把机器人部署进为人设计的空间时的改造负担。
