      regulation or jurisdiction.
    whyItMatters: Without a quantified bridge, the chapter can rank regulatory-demand risk but cannot fully size it.
    diligencePath: >-
      Ask management for pipeline and ARR cuts by module, jurisdiction, and compliance driver, then reconcile them
      against 2025–2026 policy changes.
    relatedQuestionRefs:
      - QR014
      - QR028
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: implementation-quality
    missingEvidence: >-
      Median deployment time, delayed go-live rate, supplier completion rate, professional-services attachment,
      escalation rate, and implementation-margin data.
    whyItMatters: >-
      A business that looks like scalable software in marketing can become a slower, services-heavy operating model in
      practice.
    diligencePath: >-
      Request module-level deployment metrics, services revenue mix, and failed / delayed implementation references, not
      only successful case studies.
    relatedQuestionRefs:
      - QR010
      - QR011
      - QR023
      - QR024
  - type: private-evidence-only
    severity: material
    topic: current-arr-and-margin
    missingEvidence: Board-approved current ARR, recognized revenue, gross margin, and services mix through the latest completed month.
    whyItMatters: >-
      The recommendation and valuation stance are constrained mainly by denominator risk and software-like economics
      uncertainty.
    diligencePath: >-
      Request monthly ARR and revenue bridge, gross-margin walk, and services versus subscription mix from the CFO data
      room.
    relatedQuestionRefs:
      - QV005
      - QV026
      - QV030
    relatedTableRefs:
      - TV004
  - type: private-evidence-only
    severity: material
    topic: preference-stack
    missingEvidence: >-
