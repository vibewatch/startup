    relatedQuestionRefs:
      - QR008
      - QR028
  - type: missing-source
    severity: blocking
    topic: security-assurance-gap
    missingEvidence: >-
      Current SOC 2 or ISO 27001 evidence, recent pen-test summary, incident log, cyber insurance details, and customer
      security-review outcomes.
    whyItMatters: >-
      Security assurance is a gating factor for enterprise procurement and a core thesis-break trigger for a platform
      handling supplier, reporting, and workflow data.
    diligencePath: >-
      Obtain the latest assurance pack under NDA, review any open remediation items, and test references with
      security-conscious enterprise customers.
    relatedQuestionRefs:
      - QR009
      - QR029
  - type: private-evidence-only
    severity: blocking
    topic: financial-visibility
    missingEvidence: >-
      Audited FY2025 / LTM revenue, ARR bridge, burn, cash balance, runway, gross margin, services mix, and financing
      terms / preferences.
    whyItMatters: >-
      Large private rounds and a unicorn label do not answer whether the business can fund growth without an adverse
      financing event.
    diligencePath: >-
      Request audited or board-grade financials, cash waterfall, and scenario model tying hiring and expansion plans to
      runway and financing needs.
    relatedQuestionRefs:
      - QR017
      - QR030
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-retention
    missingEvidence: >-
      Top-customer ARR share, top-10 ARR share, GRR, NRR, logo churn, module mix, regional revenue mix, and renewal
      cohorts.
    whyItMatters: >-
      The public logo set is large, but durability and concentration determine whether growth is repeatable and
      defensible.
    diligencePath: >-
      Review customer cohort data, account concentration schedules, and reference calls focused on expansion, renewal,
      and deployment quality.
    relatedQuestionRefs:
      - QR019
      - QR030
  - type: enumeration-incomplete
