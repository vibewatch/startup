evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board roster, shareholder-rights summary, and any committee or observer structure.
    whyItMatters: >-
      Founder-led governance appears concentrated, but late-stage control rights can materially affect financing terms
      and exit pathways.
    diligencePath: Request the latest board deck, governance chart, and post-Series C shareholder agreement summary from management.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Whether osapiens has any venture debt, revolving credit, or other leverage facilities.
    whyItMatters: Leverage would affect true dilution-adjusted enterprise value, liquidity runway, and downside risk.
    diligencePath: Ask management for a debt schedule, bank covenants, and any credit-side security package.
    relatedQuestionRefs:
      - QO013
  - type: private-evidence-only
    severity: material
    topic: secondary-liquidity
    missingEvidence: Any employee, founder, or early-investor secondary sales executed alongside or between rounds.
    whyItMatters: >-
      Secondary activity can signal founder liquidity preferences, price discovery, and cap-table pressure ahead of an
      eventual exit.
    diligencePath: Request cap-table history and any secondary transaction summary covering 2023-2026.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: footprint
    missingEvidence: >-
      A reconciled list of current offices and the distinction between legal registered office and operating campuses in
      Mannheim.
    whyItMatters: >-
      The discrepancies are not investment-breaking, but they weaken confidence in seemingly simple cover metrics such
      as office count and headquarters address.
    diligencePath: Confirm the current registered office, principal operating campus, and active office list in a management Q&A.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure
    missingEvidence: Current ARR, revenue, margin, burn, and profitability data tied to the 2025-2026 scale disclosures.
    whyItMatters: >-
      Without hard operating metrics, later valuation work must lean on scenario analysis instead of actual SaaS
      performance.
    diligencePath: >-
      Obtain management financials, audited statements if available, and KPI history through the Series B and Series C
      periods.
    relatedQuestionRefs:
      - QO025
  - type: conflicting-data
    severity: material
    topic: market-size-variance
    missingEvidence: >-
      A single apples-to-apples 2026 market model separating reporting software, due-diligence platforms, and broader
      sustainability suites.
    whyItMatters: >-
      Public TAM numbers vary too widely to support one clean headline figure without preserving methodological
      uncertainty.
    diligencePath: Request primary analyst datasets or build a bottom-up model from customer counts, ACVs, and in-scope-company data.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-owner
    missingEvidence: >-
      Real buyer-level spend data showing which function ultimately signs contracts for multiregulation compliance
      platforms.
    whyItMatters: >-
      Budget ownership determines sales cycles, ACVs, and expansion logic, yet public evidence only shows shared
      accountability rather than definitive payer concentration.
    diligencePath: Interview customers and pipeline owners about who signed, paid for, and expanded the software deployment.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: sam-sizing
    missingEvidence: A bottom-up logo count and ACV model for the specific sectors where osapiens is competitive today.
    whyItMatters: Without a bottom-up SAM, valuation work can only bracket the category rather than estimate true reachable spend.
    diligencePath: Model EU and non-EU enterprise accounts by sector, regulation exposure, and typical annual contract value.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM001
      - TM002
  - type: private-evidence-only
    severity: blocking
    topic: som-precision
    missingEvidence: Pipeline conversion, win rates, and category-level penetration data for osapiens versus direct competitors.
    whyItMatters: >-
      SOM is the key bridge between market analysis and valuation, and public data does not permit a credible near-term
      penetration estimate.
    diligencePath: Use management pipeline data, customer cohort counts, and competitor win/loss analysis to estimate practical SOM.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: material
    topic: competitive-unit-economics
    missingEvidence: Realized ACV, discounting, contract length, and renewal benchmarks for osapiens versus direct peers.
    whyItMatters: >-
      Public list-price opacity makes pricing-power and go-to-market comparison hard to underwrite from external
      evidence alone.
    diligencePath: Request won and lost deal pricing ranges, median contract length, and discount bands by segment.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: competitive-retention
    missingEvidence: Net revenue retention, module attach rates, churn reasons, and implementation duration versus peers.
    whyItMatters: >-
      These are the most direct tests of switching cost and cross-sell durability, but they are not public in the
      reviewed sources.
    diligencePath: Ask management for cohort tables, module adoption curves, and examples of competitive replacements.
    relatedQuestionRefs:
      - QP017
      - QP024
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: material
    topic: osapiens-sap-fit
    missingEvidence: >-
      Independent customer evidence isolating whether osapiens wins because of SAP fit or because of broader workflow
      coverage.
    whyItMatters: >-
      Public SAP-fit claims currently come mainly from competitor-authored sources, which are directionally useful but
      not decisive.
    diligencePath: Request neutral customer references, system-integrator references, and win-loss analysis in SAP-heavy accounts.
    relatedQuestionRefs:
      - QP019
    relatedTableRefs:
      - TP001
      - TP004
  - type: private-evidence-only
    severity: material
    topic: channel-power
    missingEvidence: Partner, system-integrator, marketplace, and reseller contribution to pipeline or bookings.
    whyItMatters: >-
      Suite incumbents may have distribution advantages that are invisible in public product pages but decisive in
      enterprise procurement.
    diligencePath: Request partner-sourced pipeline share, named strategic partners, and direct-versus-partner win rates.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP004
  - type: missing-data
    severity: critical
    topic: revenue-mix-and-services-split
    missingEvidence: Product-family revenue mix, services share, and realized pricing by major module line
    whyItMatters: >-
      QI006 remains only partial because the public web shows packaging structure but not how bookings or revenue split
      across transparency products, efficiency products, and services.
    diligencePath: >-
      Request a product-level ARR and revenue bridge, quote-to-cash price book, discount policy, and services
      attach-rate analysis.
    relatedQuestionRefs:
      - QI006
  - type: missing-data
    severity: critical
    topic: cash-burn-and-runway
    missingEvidence: Current unrestricted cash, monthly burn, operating cash flow, and downside runway assumptions
    whyItMatters: >-
      QI019 is only partial because disclosed funding history does not reveal present liquidity or whether current
      growth plans require another financing.
    diligencePath: >-
      Request the latest management balance sheet, monthly cash-flow statement, board budget, and 18-24 month runway
      model.
    relatedQuestionRefs:
      - QI019
  - type: missing-source
    severity: critical
    topic: debt-and-capital-structure
    missingEvidence: Any debt facility, venture loan, project-finance obligation, or covenant package
    whyItMatters: QI020 is unresolved because no public source in the chapter documents leverage, maturities, or covenant risk.
    diligencePath: >-
      Request debt schedules, lender agreements, security interests, and any contingent or off-balance-sheet financing
      obligations.
    relatedQuestionRefs:
      - QI020
  - type: missing-source
    severity: material
    topic: german-registry-financials
    missingEvidence: >-
      Company-specific numeric statements or registry documents that expose usable income statement, balance sheet, and
      cash data
    whyItMatters: >-
      QI021 remains partial because the fetched register landing pages confirm publication infrastructure but do not
      deliver figures that can anchor underwriting.
    diligencePath: >-
      Retrieve the actual register filings or annual accounts from the company or its legal counsel and reconcile them
      to management reporting.
    relatedQuestionRefs:
      - QI021
  - type: missing-source
    severity: material
    topic: performance-metrics
    missingEvidence: >-
      Public SLA documents, incident history, customer reference metrics, and methodology notes for the 99% reliability
      and productivity claims.
    whyItMatters: >-
      Without evidence for uptime definitions and benchmark methods, the headline productivity and reliability claims
      are not strong enough for underwriting.
    diligencePath: >-
      Request the current SLA pack, status-page history, KPI definitions, and named customer benchmark methodology for
      reporting-time and downtime claims.
    relatedQuestionRefs:
      - QE019
      - QE025
  - type: missing-source
    severity: material
    topic: certifications
    missingEvidence: >-
      Current ISO 9001 and ISO 27001 certificates plus SOC 2 Type II scope statements or auditor reports covering the
      relevant product entities and modules.
    whyItMatters: >-
      Security and procurement diligence often depends on certificate scope, issuance dates, and covered systems rather
      than headline certification claims alone.
    diligencePath: >-
      Ask for certificate numbers, issuing bodies, validity periods, SOC 2 bridge letters, and the exact entity or
      environment scope for each claim.
    relatedQuestionRefs:
      - QE023
      - QE024
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: api-operability
    missingEvidence: >-
      Full supplier and certification API references, sandbox credentials, auth policies, rate limits, error-handling
      behavior, and versioning commitments.
    whyItMatters: >-
      Integration feasibility and implementation effort cannot be fully underwritten from public docs when the most
      detailed technical material is customer-gated.
    diligencePath: >-
      Obtain sandbox access, full OpenAPI references, changelog policy, and sample production integration runbooks from
      osapiens or a reference customer.
    relatedQuestionRefs:
      - QE009
      - QE010
      - QE025
  - type: missing-source
    severity: material
    topic: roadmap-transparency
    missingEvidence: A shareable roadmap, release calendar, or changelog for the core HUB modules and the maintenance line.
    whyItMatters: >-
      It is hard to separate shipped functionality from near-term roadmap intention when future milestones and release
      ownership are not publicly visible.
    diligencePath: >-
      Request the last 12 months of release notes and the next 12 months of roadmap by module, including dependencies
      and customer rollout status.
    relatedQuestionRefs:
      - QE024
    relatedTableRefs:
      - TE005
  - type: access-blocked
    severity: minor
    topic: gated-surfaces
    missingEvidence: Logged-in views of the production portal and osapeers documents or community materials.
    whyItMatters: >-
      Support quality, workflow depth, and community knowledge reuse are partially opaque to outside reviewers when the
      relevant surfaces are access-controlled.
    diligencePath: >-
      Ask for a read-only portal demo, osapeers walkthrough, and screenshots of production support or community
      workflows.
    relatedQuestionRefs:
      - QE013
      - QE025
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: NRR, GRR, logo churn, renewal rates, average contract term, and cohort retention by module or segment.
    whyItMatters: >-
      Without renewal economics it is impossible to test durability, cohort quality, or whether public customer growth
      is masking churn.
    diligencePath: >-
      Request cohort tables by module and region, last 12 quarters of gross and net retention, and sample customer
      contracts or renewal schedules.
    relatedQuestionRefs:
      - QU015
      - QU025
    relatedTableRefs:
      - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration-risk
    missingEvidence: >-
      Top-10 customer ARR share, top-customer ARR share, share of ARR tied to EUDR-related products, and partner-sourced
      revenue share.
    whyItMatters: >-
      Public references show strong regulatory-use-case concentration, but they do not reveal whether revenue is
      concentrated in a few logos, sectors, or channels.
    diligencePath: >-
      Request revenue concentration tables, module mix by ARR, and channel-sourced pipeline or booking contribution for
      the last two fiscal years.
    relatedQuestionRefs:
      - QU025
    relatedTableRefs:
      - TU005
