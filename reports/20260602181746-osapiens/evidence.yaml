    severity: minor
    topic: named customer proof table
    missingEvidence: >-
      An exhaustive customer-reference register with production status, start dates, module mix, and current status for
      all public logos.
    whyItMatters: >-
      The public named-customer proof table is intentionally a reviewed sample from the visible reference set, not an
      exhaustive ledger of all deployments.
    diligencePath: >-
      Request a full reference list with customer status, geography, module, and willingness-to-reference flags;
