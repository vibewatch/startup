callouts:
- calloutType: strength
  title: The strongest product proof is workflow breadth tied to one shared data story
  body: osapiens looks strongest where regulated supplier and product data can be reused across multiple modules. Public evidence shows the company is not only selling point solutions; it has supplier portal, API, and maintenance surfaces that all reinforce a shared-HUB positioning.
  claimRefs:
  - CE001
  - CE018
  - CE026
  - CE029
  - CE046
- calloutType: risk
  title: Underwriting risk comes from public proof gaps, not from lack of module count
  body: The company publishes many module pages and some unusually concrete docs, but public evidence remains thin on certificate scope, SLA or incident history, full API operability, and lightweight deployment for smaller teams. Independent reviews consistently point to overkill and implementation load outside large-enterprise use cases.
  claimRefs:
  - CE034
  - CE036
  - CE037
  - CE040
  - CE050
