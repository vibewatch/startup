  - TE002
  figureRefs:
  - FE002
- id: architecture-integration
  title: Architecture, integrations, and deployment model
  body: 'Architecture evidence is strongest where osapiens publishes workflow documentation, not where it publishes low-level system diagrams. The supplier-facing help center is public and documents EUDR land-plot uploads, batches, questionnaires, and a REST Supplier API. That gives concrete evidence of a portal layer, machine-to-machine ingestion, and structured data exchange for regulated supplier networks. Code & Co.''s due-diligence summary is the main independent corroboration that the product suite sits on a proprietary Hub with shared backend logic, EU-service integrations, and asset sharing across user-facing solutions. On the operations side, the separate maintenance site adds a second architecture trail: public pages claim a certified SAP connector, more than 30 integrations, developer API access, Power BI, SharePoint, Outlook, and SSO hooks, plus mobile and offline execution for technicians. The trade-off is visibility. Full supplier API documentation is customer-gated, CertifierOS
    docs expose only a landing page publicly, the production portal and osapeers community are login-gated, and GitHub shows only a small public fork footprint. That is enough to verify integration surfaces exist, but not enough to fully underwrite error handling, rate limits, or internal cloud and service topology.'
  claimRefs:
