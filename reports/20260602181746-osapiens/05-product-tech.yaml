  evidenceGaps:
  - type: missing-source
    severity: material
    topic: performance-metrics
    missingEvidence: Public SLA documents, incident history, customer reference metrics, and methodology notes for the 99% reliability and productivity claims.
    whyItMatters: Without evidence for uptime definitions and benchmark methods, the headline productivity and reliability claims are not strong enough for underwriting.
    diligencePath: Request the current SLA pack, status-page history, KPI definitions, and named customer benchmark methodology for reporting-time and downtime claims.
    relatedQuestionRefs:
    - QE019
    - QE025
  - type: missing-source
    severity: material
    topic: certifications
    missingEvidence: Current ISO 9001 and ISO 27001 certificates plus SOC 2 Type II scope statements or auditor reports covering the relevant product entities and modules.
    whyItMatters: Security and procurement diligence often depends on certificate scope, issuance dates, and covered systems rather than headline certification claims alone.
    diligencePath: Ask for certificate numbers, issuing bodies, validity periods, SOC 2 bridge letters, and the exact entity or environment scope for each claim.
    relatedQuestionRefs:
    - QE023
    - QE024
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: api-operability
    missingEvidence: Full supplier and certification API references, sandbox credentials, auth policies, rate limits, error-handling behavior, and versioning commitments.
    whyItMatters: Integration feasibility and implementation effort cannot be fully underwritten from public docs when the most detailed technical material is customer-gated.
    diligencePath: Obtain sandbox access, full OpenAPI references, changelog policy, and sample production integration runbooks from osapiens or a reference customer.
    relatedQuestionRefs:
    - QE009
    - QE010
    - QE025
  - type: missing-source
    severity: material
    topic: roadmap-transparency
    missingEvidence: A shareable roadmap, release calendar, or changelog for the core HUB modules and the maintenance line.
    whyItMatters: It is hard to separate shipped functionality from near-term roadmap intention when future milestones and release ownership are not publicly visible.
    diligencePath: Request the last 12 months of release notes and the next 12 months of roadmap by module, including dependencies and customer rollout status.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE005
  - type: access-blocked
    severity: minor
    topic: gated-surfaces
    missingEvidence: Logged-in views of the production portal and osapeers documents or community materials.
    whyItMatters: Support quality, workflow depth, and community knowledge reuse are partially opaque to outside reviewers when the relevant surfaces are access-controlled.
    diligencePath: Ask for a read-only portal demo, osapeers walkthrough, and screenshots of production support or community workflows.
    relatedQuestionRefs:
    - QE013
    - QE025
