figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence points to a land-and-expand revenue model that starts with regulation or operations pain,
      converts into platform subscriptions, and adds services and adjacent modules over time.
    data:
      nodes:
        - id: trigger
          label: Buyer trigger
          detail: Regulation, supplier risk, traceability, or maintenance pain initiates the search.
        - id: entry
          label: Initial module sale
          detail: A transparency or efficiency module becomes the first contracted entry point.
        - id: expand
          label: Platform expansion
          detail: Additional HUB modules are attached across compliance, supplier, and operations workflows.
        - id: services
          label: Integration and enablement
          detail: ERP/SAP integration, onboarding, support, and customer success help deployment.
        - id: revenue
          label: Recurring revenue base
          detail: Subscription revenue grows while services influence delivery cost and cash timing.
      edges:
        - from: trigger
          to: entry
          label: converts to
        - from: entry
          to: expand
          label: expands via
        - from: entry
          to: services
          label: implemented through
        - from: expand
          to: revenue
          label: compounds
        - from: services
          to: revenue
          label: supports and dilutes
    claimRefs:
      - CI001
      - CI002
      - CI006
      - CI013
      - CI040
  - id: FI002
    title: Unit economics bridge
    type: flow
    summary: >-
      The public-only unit-economics view moves from strong growth signals to a few rough proxies and then
      quickly runs into missing CAC, retention, and margin data.
    data:
      nodes:
        - id: growth
          label: Strong public growth
          detail: ARR doubled YoY in Q2 2025 and 400+ new enterprise customers were added in H1 2025.
        - id: scale
          label: Customer-count scale
          detail: Official sources move from nearly 2,000 to more than 2,400 customers across 2025-2026.
        - id: proxy
          label: Low-confidence ACV proxy
          detail: Conflicting GetLatka revenue data implies roughly $37.5k-$45k revenue per customer.
        - id: gaps
          label: Missing core metrics
          detail: CAC, payback, NRR, GRR, gross margin, and burn remain private.
        - id: verdict
          label: Partial underwriting only
          detail: Momentum is visible, efficiency is not.
      edges:
        - from: growth
          to: scale
          label: supports
        - from: scale
          to: proxy
          label: allows
        - from: proxy
          to: gaps
          label: still leaves
        - from: gaps
          to: verdict
          label: limits
    claimRefs:
      - CI007
      - CI008
      - CI014
      - CI022
      - CI024
      - CI025
      - CI037
      - CI042
      - CI043
