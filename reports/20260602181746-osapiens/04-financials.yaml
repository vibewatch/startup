    title: Financial estimate range
    type: range
    summary: >-
      Only a small set of financially relevant values can be bounded from public evidence, and several of them
      are estimates or contradictory rather than audited company disclosures.
    data:
      items:
        - label: Implied revenue per customer proxy
          low: 37.5
          high: 45.0
          unit: USD K / customer
          note: GetLatka $90M revenue divided by official 2.0k-2.4k customer counts; low-confidence and conflicting
        - label: Disclosed primary round-size range
          low: 25
          high: 120
          unit: native-currency M
          note: Series A €25M, Series B $120M, Series C $100M
        - label: Estimated gross-margin boundary
          low: 65
          high: 80
          unit: percent
          note: Estimated range for multi-tenant enterprise workflow SaaS with implementation burden; not management disclosed
    approximationNotes: >-
      Only the round-size range is fully public and company-specific. The revenue-per-customer range is a rough
      proxy built from conflicting inputs, and the gross-margin boundary is an estimated diligence range rather
