  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - ARR growth signal
        - Q2 2025 ARR doubled year on year; 42 consecutive months above 100% YoY growth
        - Medium
        - Best public growth-quality signal available
        - Request quarterly ARR bridge and cohort-based expansion detail
      - - Customer-add velocity
        - 400+ new enterprise customers in H1 2025; company approaching 2,000 customers then 2,400+ by January 2026
        - Medium
        - Indicates commercial momentum and potential account breadth
        - Request net adds, gross adds, churned logos, and expansion ARR by quarter
      - - Revenue per customer proxy
        - ~$37.5k-$45k annual revenue per customer if one combines GetLatka's $90M figure with official 2.0k-2.4k customer counts
        - Low
        - Provides a rough ACV boundary only when direct pricing data is absent
        - Request audited ARR/customer distribution and top-decile customer concentration
      - - Gross margin
        - Not publicly disclosed
        - Low
        - Core profitability and valuation input
        - Request gross-margin bridge split between software, services, and support
      - - CAC / payback / sales cycle
        - Not publicly disclosed
        - Unknown
        - Needed to test whether hypergrowth is efficient or cash intensive
        - Request fully loaded CAC, sales-cycle by segment, and payback by product family
      - - NRR / GRR / renewal rate
        - Not publicly disclosed
        - Unknown
        - Determines durability of the recurring base
        - Request cohort retention tables and renewal performance by geography and product
      - - Working capital / deferred revenue
        - Annual billing exists for CMMS Premium, but company-wide deferred revenue, DSO, and cash-conversion data are unavailable
        - Low
        - Distinguishes strong subscription cash timing from services-heavy drag
        - Request deferred-revenue roll-forward, billing cadence mix, and DSO / DPO history
    notes: >-
      The table deliberately separates disclosed traction from inferred or unavailable unit economics. The
      revenue-per-customer proxy is a low-confidence exercise built from conflicting public inputs.
