company:
  name: osapiens
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports osapiens as a recurring enterprise-software business with multiple monetizable
    module families, strong 2025 growth signals, and substantial equity backing through early 2026. The same
    evidence is still too thin to underwrite margin quality, sales efficiency, or runway with precision because
    cash, burn, debt, retention, and product-level revenue mix remain undisclosed.
sections:
  - id: revenue-model-and-pricing
    title: Revenue streams, packaging, and monetization posture
    body: >-
      osapiens should be read financially as a platform vendor with several monetizable wedges, not as a single
      ESG reporting SKU. The company’s main commercial story combines transparency products such as CSRD, EUDR,
      supplier risk, disclosure, and traceability with efficiency products such as maintenance, service, and
      distribution. That breadth matters because it supports both land-and-expand selling and cross-functional
      budgets: procurement, sustainability, compliance, operations, and field teams can all become entry points.
      The one public price sheet available in this chapter is the maintenance/CMMS product line. It shows a
      Premium plan at €49 per user per month billed annually, plus an Enterprise tier that moves immediately to
      integration, customization, and sales-led contracting. That is useful evidence for list pricing and
      packaging, but it is not evidence of company-wide realized pricing. Core HUB modules still sell mostly via
      demo- and contact-led motions. The defensible conclusion is therefore structural rather than precise:
      osapiens likely has subscription-led revenue quality with a services layer around deployment and
      integration, while realized ASP, discounts, and product-family revenue mix remain open diligence items.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI013
      - CI040
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: gtm-and-public-traction-proxies
    title: GTM motion, sales-efficiency proxies, and public traction
    body: >-
      The public growth narrative is strong on momentum and weak on efficiency. osapiens said Q2 2025 ARR once
      again doubled year on year, that it had delivered 42 consecutive months of triple-digit year-on-year
      growth, and that it added more than 400 new enterprise customers in the first half of 2025 alone. The
      same release said a significant portion of ARR was already coming from non-German-speaking markets, while
      the UK expansion release added a €35 million local investment plan and more than 150 jobs. Those signals
      point to a business still funding market capture, geography expansion, and category leadership rather than
      maximizing short-term operating leverage. GTM also appears segmented. Core compliance and transparency
      modules remain enterprise-led and contact-sales oriented, but the maintenance line adds a lighter free-
      trial entry motion. A strong international partner network suggests some channel leverage as well. What is
      missing is the part investors normally need most: CAC, payback, quota productivity, net retention, and
      sales-cycle data. A low-confidence revenue-per-customer proxy can be triangulated only by combining
      GetLatka’s disputed $90 million revenue number with official customer counts, and even that should be used
      as a rough boundary, not an anchor.
    claimRefs:
      - CI007
      - CI008
      - CI009
      - CI010
      - CI011
      - CI012
      - CI013
      - CI014
      - CI022
      - CI023
      - CI024
      - CI025
      - CI042
      - CI043
    tableRefs:
      - TI003
    figureRefs:
      - FI002
  - id: cost-structure-margin-and-working-capital
    title: Cost structure, gross-margin drivers, and working-capital visibility
    body: >-
      Public evidence points to a software model with meaningful delivery overhead. osapiens repeatedly describes
      the HUB as a cloud-based, multi-tenant platform, while the maintenance enterprise package adds ERP and SAP
      integrations, customization, dedicated customer success, training, and support. The maintenance site also
      highlights deployment scope across dozens of sites and thousands of assets, which implies real onboarding,
      services, and support labor even if the core software is highly repeatable. Because osapiens does not
      publish audited financial statements or accounting notes, the cleanest public benchmark is comparable
      enterprise workflow SaaS. ServiceNow’s 2026 10-K is instructive: subscriptions are recognized ratably,
      annual advance billing is common, professional services are recognized as delivered, subscription cost of
      revenue is driven by hosting, support, cloud, and regulated-market requirements, and professional-services
      cost includes personnel and partner delivery. That does not prove osapiens has the same exact economics,
      but it does define the right diligence frame. The likely financial shape is attractive recurring software
      economics partially offset by implementation, partner, and support burden. The actual gross-margin bridge,
      deferred-revenue profile, and working-capital behavior remain unavailable publicly.
    claimRefs:
      - CI015
      - CI016
      - CI017
      - CI018
      - CI019
      - CI020
      - CI021
      - CI041
      - CI042
    figureRefs: []
  - id: capital-adequacy-and-underwriting-blockers
    title: Capital adequacy, financing dependence, and financial verdict
    body: >-
      The Company Overview chapter already records the round-by-round chronology; the forward-looking financial
      question here is adequacy. Publicly disclosed equity support is meaningful: €25 million in Series A,
      $120 million in Series B, and $100 million in Series C, with the later rounds explicitly earmarked for
      product innovation and international expansion. The July 2025 UK announcement then layered on a €35
      million deployment commitment and 150 planned jobs, which shows capital is still being consumed for growth.
      Small public grants disclosed in the Bundestag lobby register are immaterial next to that equity base.
      The problem is not lack of capital history but lack of balance-sheet visibility. No public source in this
      chapter gives cash on hand, monthly burn, runway, leverage, or covenant detail. Northdata and German
      publication portals show that filing infrastructure exists, but the fetched public surfaces still do not
      deliver usable figures for underwriting. Regulatory timing is also mixed: omnibus and CSRD delays can slow
      near-term buyer urgency for some reporting workflows even while long-term transparency needs persist. The
      best public verdict is therefore qualified: revenue quality looks better than capital visibility, margin
      path is plausible but unproven, and underwriting still depends on direct diligence for cash, retention,
      pricing realization, and debt.
    claimRefs:
      - CI026
      - CI027
      - CI028
      - CI029
      - CI030
      - CI031
      - CI032
      - CI033
      - CI034
      - CI035
      - CI036
