tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value / status
      - Quality
      - Diligence ask
    rows:
      - - Transparency solutions subscriptions
        - Recurring software sold around CSRD, EUDR, disclosure, traceability, supplier risk, and due diligence workflows
        - Annual or multi-year enterprise software contracts
        - Confirmed as a major product family; no public realized pricing
        - High if renewal-led; mix by module undisclosed
        - Request ARR and net retention by transparency module family
      - - Efficiency solutions subscriptions
        - Recurring software for maintenance, service, distribution, and adjacent workflow automation
        - Seat-, workflow-, or site-based enterprise contracts
        - Confirmed as a second product family on the HUB
        - Medium to high; pricing and usage basis mostly undisclosed
        - Request bookings and gross margin by efficiency product line
      - - CMMS list-priced subscriptions
        - Public maintenance pricing with Premium per-user monthly billing and Enterprise upsell
        - Per user / month, billed annually for Premium
        - Premium published at €49; Enterprise is talk-to-sales
        - Useful list-price evidence only, not realized group pricing
        - Request discount bands, attach rate, and churn for maintenance customers
      - - Implementation and integration services
        - ERP/SAP connectors, data import, customization, onboarding, and workflow configuration
        - Project, fixed-fee, or time-and-materials scope
        - Commercially implied; no public revenue split
        - Lower quality than pure subscription revenue but likely important for deployment
        - Request services revenue, utilization, and services gross margin
      - - Support, training, and customer-success work
        - Support center, training, customer success, and partner-assisted enablement
        - Bundled or separately scoped support activities
        - Operationally visible but not monetized publicly
        - Helpful for retention; margin impact unknown
        - Request support staffing model and attach-rate economics
      - - Partner-influenced sales
        - Channel and partner network contributes to selling and delivery
        - Partner-assisted enterprise contracts
        - Confirmed at company level; commission economics undisclosed
        - Can broaden reach but compress realized margins
        - Request sourced-pipeline mix, partner fees, and channel discount policy
    notes: >-
      This table separates visible revenue mechanisms from unavailable realized economics. The only public list
      price in the chapter is the maintenance/CMMS product line; that should not be generalized to the whole HUB.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI006
      - CI012
      - CI013
      - CI040
