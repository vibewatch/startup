  - id: TI004
    title: Capital adequacy table
    columns:
      - Item
      - Public status
      - Implication
      - Confidence
      - Diligence ask
    rows:
      - - Disclosed external equity base
        - €25M Series A, $120M Series B, $100M Series C publicly disclosed
        - Meaningful access to growth capital is proven historically
        - Medium
        - Request current cap table, ownership dilution, and any investor protection terms
      - - Planned uses of funds
        - Product innovation and international expansion cited across Series B and Series C; UK plan adds €35M and 150 jobs
        - Capital is still being deployed aggressively for scale
        - Medium
        - Request annual operating plan by R&D, S&M, infrastructure, and expansion geography
      - - Public grants and subsidies
        - Approximately €250k-€280k of disclosed public support in lobby register entries
        - Not material relative to venture rounds
        - Medium
        - Confirm whether grants carry clawbacks, reporting obligations, or restricted-use conditions
      - - Cash on hand / runway
        - Not publicly disclosed
        - Public materials cannot establish runway duration
        - Low
        - Request latest balance sheet, unrestricted cash, and 18-24 month runway model
      - - Debt / leverage / project finance
        - Not publicly disclosed
        - Covenant or refinancing risk cannot be assessed publicly
        - Low
        - Request debt schedule, maturities, liens, and covenant package
      - - Next-round trigger
        - No public trigger, milestone, or timing disclosed
        - Impossible to judge whether another financing is optional or necessary
        - Low
        - Request board-approved financing plan and downside liquidity thresholds
    notes: >-
      This chapter intentionally focuses on current adequacy rather than repeating the full funding chronology
      already captured in Company Overview.
    claimRefs:
      - CI026
      - CI027
      - CI028
      - CI029
      - CI032
      - CI044
  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing private metric
      - Impact
      - Why it matters
      - Exact diligence path
    rows:
      - - Product-family ARR and revenue mix
        - Blocking
        - Needed to separate transparency products, efficiency products, and services economics
        - Request ARR / revenue bridge by module family, geography, and contract type
      - - Realized pricing, discounting, and ACV distribution
        - Blocking
        - Public list pricing exists only for CMMS Premium and does not explain enterprise monetization
        - Request price book, discount policy, average contract value, and upsell path by segment
      - - Gross-margin bridge
        - Blocking
        - Public evidence shows likely cloud and services burden but no auditable margin outcome
        - Request gross margin by software, services, support, and partner-delivered work
      - - CAC, payback, and retention
        - Blocking
        - Growth without efficiency data cannot be underwritten cleanly
        - Request CAC by channel, payback, GRR, NRR, and cohort waterfalls
      - - Cash, burn, debt, and runway
        - Blocking
        - Capital adequacy remains the largest open question despite large prior rounds
        - Request latest balance sheet, cash flow statement, debt schedule, and runway forecast
      - - Working-capital and deferred-revenue behavior
        - Material
        - Annual billing can materially change cash conversion and risk profile
        - Request deferred-revenue roll-forward, billing cadence mix, DSO, DPO, and collections history
    notes: >-
      These are the main blockers to underwriting osapiens from public information alone. They should be treated
      as first-day diligence requests rather than nice-to-have follow-ups.
    claimRefs:
