companyProfile:
  summary: osapiens is a Mannheim-based enterprise software company building the osapiens HUB, a platform that combines sustainability reporting, supply-chain due diligence, traceability, compliance, and operational-efficiency workflows. Since 2023 it has raised three major disclosed rounds, reached unicorn status in January 2026, and built public customer proof across regulated industrial, retail, and consumer-goods workflows. The company looks strategically relevant in Europe’s compliance stack, but still discloses far less than a public-company-style late-stage SaaS underwrite would ideally require.
  foundedDate: '2018-01-01'
  founders:
    - name: Alberto Zamora
      role: Co-Founder and CEO
      background: Previously co-founded and led a cloud-based B2B supply chain software business before launching osapiens.
      claimRefs: [CO001, CO035]
    - name: Stefan Wawrzinek
      role: Co-Founder and Chair of the Board
      background: Worked with the founding team for more than a decade before osapiens and now anchors founder-led governance.
      claimRefs: [CO001, CO018, CO035]
    - name: Matthias Jungblut
      role: Co-Founder and Managing Director
      background: Worked with the founding team at a prior supply-chain software business and remains central to product and executive leadership.
      claimRefs: [CO001, CO019, CO035]
  foundingLocation: Mannheim, Germany
  headquarters: Mannheim, Germany
  productSummary: The osapiens HUB is a multi-tenant platform with 25+ modules spanning sustainability reporting, supply-chain due diligence, traceability, product compliance, maintenance, service, and workflow automation.
  customerFocus: Large enterprises and supplier ecosystems in regulated, supply-chain-intensive sectors such as manufacturing, retail, consumer goods, logistics, and adjacent industrial markets.
  businessModel: Primarily enterprise SaaS sold through multi-module contracts around compliance, transparency, and workflow automation, with some public list pricing visible only for a maintenance/CMMS product line.
  stage: Series C
  fundingStatus: $100M Series C announced in January 2026 after a $120M Series B in 2024 and a €25M Series A in 2023; public use-of-funds language emphasizes product innovation and international expansion.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO004, CO005, CO006, CO007, CO012, CO015]
