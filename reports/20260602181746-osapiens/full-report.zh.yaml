  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和规模测算视角
        blocks:
          - type: paragraph
            body: >-
              先定义市场，再谈规模，是第一项分析任务。对 osapiens 来说，相关类别既不是「全部 ESG 支出」，也不是「全部企业软件」。
              最贴近的定义，是企业用于可持续发展报告、供应链尽调、可追溯性、产品和供应商合规，以及相邻运营效率工作流的软件；当监管和价值链透明度要求上升时，这些工作流会变成强制项或具有经济价值。 这意味着咨询费、审计鉴证和通用
              ERP 许可不属于核心软件市场，尽管它们会影响买方总预算。公开市场研究说明了为什么边界重要：狭义 ESG 报告口径下，2026 年市场约为 $1.1-$1.6 billion；更宽的可持续发展或 ESG
              软件类别约为 $4.9-$5.2 billion；另一个狭义可持续发展软件定义则低于 $1 billion。
              这些差异与其说是矛盾，不如说是类别定义仍不稳定的证据。做估值时，最佳做法是保留多个视角，而不是硬压出一个虚假精确的总可用市场（TAM）。
