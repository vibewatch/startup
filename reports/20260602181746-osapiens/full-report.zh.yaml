        - 已上线 / 覆盖面广
        - 一个界面覆盖 PFAS、REACH、RoHS、SCIP、电池、DPP、TPD、食品、医疗和 PCF 主张
        - 独立评测称，若只看 DPP 适配度和定价透明度，表现较弱
      - - 供应商关系管理
        - 采购和供应商经理
        - 已上线
