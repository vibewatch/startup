          detail: 团队从一个合规或运营模块起步，绑定最高优先级工作流。
        - label: 嵌入式运营使用
          detail: 最强引用中出现了日常工作流使用或多站点推广。
        - label: 扩张循环
          detail: 首个部署稳定后，账户继续增加模块、地区，或在母集团层面推广。
    approximationNotes: 这是对所审阅公开证据集的综合，不是来自内部 CRM 数据的实测漏斗。
    claimRefs:
      - CU007
      - CU043
      - CU045
      - CU050
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    summary: 公开证据从宽泛营销主张收窄到少量具名部署，再收窄到更少的已披露耐久性代理指标。
    data:
      items:
        - label: 营销口径客户全集
          value: 2500
          note: 供应商客户页标题口径；确切分母未解决。
        - label: EUDR 专项网络主张
          value: 700
          note: 供应商在 EUDR 产品页上的主张。
        - label: 已审阅具名部署证据
          value: 9
          note: 本章抽样的具名公开部署。
        - label: 重复使用或广度代理
          value: 4
          note: Puratos 多站点、Netto 日常使用、Salling 推广、Lohmann 供应商广度。
        - label: 公开披露的留存指标
          value: 0
          note: 未在公开渠道找到 NRR、GRR、流失率或队列数据。
    approximationNotes: 计数混合了供应商报告的客户总数和本章层面的证据计数；适合衡量证据深度，不适合建收入模型。
    claimRefs:
      - CU006
      - CU011
      - CU018
      - CU027
      - CU041
      - CU051
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    summary: 最强证据同时具备新近时间、明确具名部署边界，以及至少一个具体结果或规模指标。
    data:
      columns:
        - 2025-26 新近？
        - 披露结果？
        - 披露部署深度？
        - 独立佐证？
      rows:
        - label: Puratos
          values:
            - 是
            - 是
            - 是
            - 是
        - label: Netto / Salling
          values:
            - 当前
            - 部分
            - 是
            - 否
        - label: JELD-WEN Europe
          values:
            - 是
            - 有限
            - 是
            - 是
        - label: James Cropper
          values:
            - 是
            - 有限
            - 是
            - 是
        - label: Westwing
          values:
            - 是
            - 有限
            - 是
            - 是
    approximationNotes: 矩阵单元格是对所审阅证据集的定性总结，不用内部产品遥测给客户打分。
    claimRefs:
      - CU020
      - CU022
      - CU024
      - CU040
      - CU051
  - id: FU004
    title: 留存 / 重复可见度矩阵
    type: matrix
    summary: 公开耐久性证据大多是使用代理指标；留存经济性本身未披露。
    data:
      columns:
        - 公开披露？
        - 证据质量
        - 用于投资测算
      rows:
        - label: NRR / GRR / 流失
          values:
            - 否
            - None
            - 需要尽调
        - label: 重复使用代理
          values:
            - 是
            - 中
            - 有帮助但不完整
        - label: 扩张代理
          values:
            - 是
            - 中
            - 有帮助但不完整
        - label: 独立满意度信号
          values:
            - 有限
            - 低
            - 单独看不足以支持决策
    approximationNotes: 由于已审阅公开来源没有披露队列百分比、NRR 或续约曲线，该矩阵只能替代真正的留存队列。
    claimRefs:
      - CU041
      - CU047
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 将当前公开缓释因素纳入后，osapiens 主要风险簇的可能性—影响矩阵。
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
        - 关键影响
      rows:
        - label: 高可能性
          values:
            - label: 员工评价信号稀薄
              tone: neutral
              detail: RepVue 信号偏负面，但只有 8 条评分，不能单独推翻投资逻辑。
            - label: 英国招聘执行压力
              tone: risk
              detail: 快速招聘和本地市场搭建会压迫入职、销售产能和管理带宽。
            - label: 实施 / 配置拖累
              tone: risk
              detail: API、SAP 连接和模块配置可能拉长价值实现时间，并推高服务负荷。
            - label: 监管需求压缩
              tone: risk
              detail: CSRD/CSDDD/LkSG 变化可能降低近期紧迫性，且正落在 osapiens 瞄准的采购细分里。
        - label: 中等可能性
          values:
            - label: 政策参与不足以抵消冲击
              tone: neutral
              detail: 游说动作可见但规模不大，因此不应被视为真正对冲。
            - label: 产品广度与深度取舍
              tone: risk
              detail: 套件可以靠广度赢单，但在网络安全主导或极深单点用例中可能输给专门厂商。
            - label: 客户 / 收入集中度不透明
              tone: risk
              detail: 公开客户标识数量很大，但集中度和留存仍未披露。
            - label: 安全保证可见度缺口
              tone: risk
              detail: 已审阅来源未确认公开安全保证包，因此企业就绪度必须在尽调中验证。
        - label: 低可能性
          values:
            - label: 轻微政策建议错配
              tone: neutral
              detail: 常规合规解读变化可以放进平台路线图里消化。
            - label: 局部招聘延误
              tone: neutral
              detail: 单一地区的小执行失误，本身不太可能打穿整体投资逻辑。
            - label: 孤立模块不适配
              tone: risk
              detail: 只要更广的平台采用保持健康，失去一个专门模块的影响相对有限。
            - label: 重大财务不透明冲击
              tone: risk
              detail: 尾部风险在于：私有财务指标可能明显弱于表面增长叙事。
    claimRefs:
      - CR007
      - CR018
      - CR033
      - CR037
      - CR044
      - CR045
      - CR046
      - CR047
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 监管、实施与保障风险如何传导为增长放缓、续约变弱和融资压力。
    data:
      nodes:
        - id: r1
          label: CSRD / CSDDD / LkSG 适用范围收窄
          detail: EU 与德国规则调整，削弱部分买家的紧迫感。
          tone: risk
        - id: r2
          label: 合规驱动管线放慢
          detail: 进入漏斗的适用范围内买家或急单买家减少。
          tone: risk
        - id: r3
          label: 单笔交易定制更多
          detail: 买家需要的不只是合规，还要更充分的 ROI 论证。
          tone: risk
        - id: r4
          label: 部署和价值验证拉长
          detail: 集成、数据清理和供应商入驻都会拖慢结果兑现。
          tone: risk
        - id: r5
          label: 扩张 / 续约信心下降
          detail: 结果延迟会削弱交叉销售和留存经济性。
          tone: risk
        - id: r6
          label: ARR 增长跑输叙事
          detail: 增速低于超高速增长和独角兽叙事所隐含的水平。
          tone: risk
        - id: r7
          label: 安全保障缺口卡住采购
          detail: 缺少强保障证据时，企业买家会推迟或拒绝交易。
          tone: risk
        - id: r8
          label: 估值 / 融资压力
          detail: 经济性不透明叠加增长放缓，会压低下一轮融资或退出质量。
          tone: risk
      edges:
        - from: r1
          to: r2
          label: 削弱紧迫感
        - from: r2
          to: r3
          label: 提高需求
        - from: r3
          to: r4
          label: 拉长
        - from: r4
          to: r5
          label: 削弱
        - from: r5
          to: r6
          label: 施压
        - from: r6
          to: r8
          label: 传导至
        - from: r7
          to: r4
          label: 也可能拖慢
        - from: r7
          to: r6
          label: 可直接削减
    claimRefs:
      - CR007
      - CR018
      - CR033
      - CR041
      - CR042
      - CR044
      - CR045
      - CR048
      - CR050
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: osapiens HUB 周边的关键外部与运营依赖。
    data:
      nodes:
        - id: d1
          label: osapiens HUB
          detail: 共享的多解决方案平台，也是运营核心。
          tone: neutral
        - id: d2
          label: EU 可持续规则
          detail: 决定核心合规模块的紧迫度。
          tone: risk
        - id: d3
          label: 客户 ERP / SAP 系统
          detail: 为许多工作流提供运营数据和主数据。
          tone: risk
        - id: d4
          label: 供应商提交的证据
          detail: 地块、问卷、批次和支持文件。
          tone: risk
        - id: d5
          label: 实施与客户成功团队
          detail: 把配置和集成转化为真实价值。
          tone: risk
        - id: d6
          label: 企业买家
          detail: 为合规、报告和效率预算买单。
          tone: neutral
        - id: d7
          label: 资本提供方
          detail: 支撑全球招聘、产品增长和国际扩张。
          tone: neutral
        - id: d8
          label: 云 / 集成栈
          detail: 承载并连接跨模块的共享数据模型。
          tone: risk
      edges:
        - from: d2
          to: d1
          label: 驱动用例
        - from: d3
          to: d1
          label: 输入数据
        - from: d4
          to: d1
          label: 输入证据
        - from: d8
          to: d1
          label: 运行
        - from: d5
          to: d1
          label: 实施并支持
        - from: d1
          to: d6
          label: 向其交付价值
        - from: d7
          to: d5
          label: 为增长出资
        - from: d6
          to: d7
          label: 支撑回报
    claimRefs:
      - CR013
      - CR019
      - CR020
      - CR029
      - CR030
      - CR036
      - CR037
      - CR043
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 结论维持观察：真实增长和规模证据，仍被监管重置、上市可比公司估值约束以及经济性披露缺口抵消。
    data:
      nodes:
        - id: scale
          label: 规模证据：>2,400 家客户、550+ 名员工
          type: input
        - id: growth
          label: 增长证据：2025 年 Q2 ARR 同比翻倍
          type: input
        - id: breadth
          label: 平台宽度：25+ 个企业级解决方案
          type: input
        - id: reg
          label: 监管重置：Omnibus 收窄并推迟适用范围
          type: input
        - id: comps
          label: 上市可比公司上限：收入倍数约 2x-6x
          type: process
        - id: opacity
          label: 不透明：当前 ARR、利润率、NRR 或条款均未公开
          type: input
        - id: decision
          label: 决策：观察，中等信心、高风险、估值偏高
          type: output
        - id: upgrade
          label: 只有尽调证实 ARR >$100M、多元化和干净条款，才上调评级
          type: output
      edges:
        - from: scale
          to: decision
        - from: growth
          to: decision
        - from: breadth
          to: decision
        - from: reg
          to: decision
        - from: comps
          to: decision
        - from: opacity
          to: decision
        - from: decision
          to: upgrade
    approximationNotes: 这是一套决策逻辑，不是确定性模型；它突出的是在当前价格下会推动建议变化的变量。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV018
      - CV025
      - CV039
      - CV041
      - CV042
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 只有当前 ARR 支撑明确进入九位数，超过 $1B 的估值标记才更容易站住脚。
    data:
      items:
        - label: 按 4x 计算所需 ARR
          value: 250
          note: 较低的上市可比公司情景
        - label: 按 6x 计算所需 ARR
          value: 166.7
          note: 上市可比公司区间上沿
        - label: 按 8x 计算所需 ARR
          value: 125
          note: 软件溢价情景
        - label: 按 10x 计算所需 ARR
          value: 100
          note: 高增长私有公司情景
        - label: 按 12x 计算所需 ARR
          value: 83.3
          note: 极乐观溢价情景
        - label: 低置信度的供应商 ARR 锚点
          value: 90
          note: GetLatka 数据只用于敏感性校验
    approximationNotes: 这些门槛只是用 $1B 估值除以 ARR 得到的简单桥接，不是 DCF 输出；$90M 锚点明确属于低置信度。
    claimRefs:
      - CV021
      - CV023
      - CV024
      - CV034
      - CV035
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 情景支撑区间显示，只有 osapiens 当前 ARR 已达到基准情景或更高水平时，披露估值才算大致合理。
    data:
      items:
        - label: 悲观情景
          low: 350
          mid: 490
          high: 630
          note: 5x-7x 下的 $70M-$90M ARR 支撑
        - label: 基准情景
          low: 800
          mid: 1050
          high: 1300
          note: 8x-10x 下的 $100M-$130M ARR 支撑
        - label: 乐观情景
          low: 1300
          mid: 1610
          high: 1920
          note: 10x-12x 下的 $130M-$160M ARR 支撑
    approximationNotes: 区间受证据约束，但仍高度依赖假设，因为已审阅的公开记录没有披露当前 ARR、利润率或留存。
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
      - CV043
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: osapiens 在增长、客户证据和产品宽度上得分较高，但在监管耐久性、经济性可见度和即时价格支撑上偏弱。
    data:
      items:
        - label: 市场需求
          value: 4
          note: 大多数保留的分析师来源显示，终端市场仍在正增长
        - label: 增长证据
          value: 4.5
          note: 官方来源称 ARR 翻倍，且连续 42 个月 YoY 增长超过 100%
        - label: 客户证据
          value: 4.5
          note: Series C 报道显示客户超过 2,400 家、专业人员 550+ 名
        - label: 产品宽度
          value: 4
          note: 25+ 个企业级解决方案带来真实的平台延展空间
        - label: 监管耐久性
          value: 2.5
          note: Omnibus 调整让法规牵引的需求不如表面增长显示得那么稳固
        - label: 经济性可见度
          value: 1.5
          note: 当前 ARR、利润率、NRR、服务收入占比和条款均未公开
        - label: 估值支撑
          value: 2.5
          note: 上市可比公司和情景门槛尚未让独角兽估值显得明确有吸引力
        - label: 退出准备度
          value: 2.5
          note: 战略买家或财务赞助方退出，看起来比近期 IPO 更现实
    approximationNotes: 评分是投资委员会的方向性辅助，不是机械模型；这里的低分主要反映披露缺口和市场背景，并不代表不相信产品。
    claimRefs:
      - CV003
      - CV005
      - CV016
      - CV019
      - CV025
      - CV039
      - CV042
      - CV044
      - CV047
