      - number: '2.3'
        title: 监管驱动因素和时间节奏
        blocks:
          - type: paragraph
            body: >-
              监管仍是这个类别最强的单一催化剂，但时间节奏已经不再统一。最初的 CSRD 承诺带来一次巨大报告扩容，从 NFRD 下不到 12,000 家公司扩展到首版设计下近 50,000 家公司。 omnibus
              一揽子方案之后，这个故事发生了实质变化。修订后的门槛如今把 CSRD 聚焦在超大型公司上，显著缩小了短期纯报告买方池。 但市场没有消失，因为其他规则仍在推进。CSDDD 仍把最大的公司推向 2029
              年尽调要求。LkSG 已在德国生效。 CBAM 在 2026 年 1 月 1 日进入最终制度，迫使超过门槛的进口商运营化申报人和排放工作流。EUDR 仍要求适用产品流提供无毁林证明和尽调。
              实操中，买方往往会为多项监管准备一个软件预算，而不是只列一条 CSRD 支出线。因此，对纯报告供应商而言，可服务市场在漏斗顶端被压缩；但对把报告、采购、可追溯性和风险管理结合起来的平台而言，需求更有韧性。
