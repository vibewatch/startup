      - number: '2.4'
        title: 约束、相互矛盾的估算和现实可服务市场（SAM）
        blocks:
          - type: paragraph
            body: >-
              主要采用约束并非假设。市场研究指出，企业部署成本可能超过 $1 million，熟练的可持续发展数据分析师短缺，数据主权问题棘手，供应商准备度不足。 Sedex 和 BCG
              都强调，最难的工作往往发生在一级供应商之外，这会抬高入驻成本、拖慢价值兑现。omnibus 一揽子变更也制造了买方困惑：公司需要重新划定范围、重新评估时间表，并决定是否继续投资。
              但公开证据显示，许多公司仍在继续投入，因为即便直接法律适用范围变软，供应商仍需要满足客户、贷款方和保险方要求。这种动态为 osapiens 创造了一个更窄但仍耐久的可服务市场（SAM）。
              最实用的公开近似，是大型企业 ESG 报告支出与增长最快的供应链可持续发展和尽调工作流的交集。公开证据不支持的是干净的可获取市场（SOM）。 如果没有内部管线、ACV 或胜率数据，就无法可靠隔离 osapiens
              现实可触达的客户数量或软件支出。
            claimRefs:
              - CM028
              - CM029
              - CM030
              - CM027
              - CM026
              - CM031
