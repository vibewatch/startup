      - - 效率解决方案订阅
        - 面向维护、服务、分销及相邻工作流自动化的经常性软件
        - 按席位、工作流或站点计费的企业合同
        - 已确认是 HUB 上第二个产品族
        - 中到高；定价和用量基准大多未披露
        - 要求按效率产品线提供预订额和毛利率
      - - 标价 CMMS 订阅
        - 公开维护产品定价，Premium 按用户月度计费，并向 Enterprise 增购
        - Premium 按用户 / 月计费，按年结算
        - Premium 公开价格为 €49；Enterprise 需联系销售
        - 只能作为标价证据，不能代表集团实际定价
        - 要求维护客户的折扣区间、附加率和流失率
      - - 实施与集成服务
        - ERP/SAP 连接器、数据导入、定制、上线和工作流配置
        - 项目制、固定费用或按工时材料计费
        - 商业上可推断；未公开收入拆分
        - 质量低于纯订阅收入，但可能对部署很重要
        - 要求提供服务收入、利用率和服务毛利率
      - - 支持、培训和客户成功工作
        - 支持中心、培训、客户成功和合作伙伴协助落地
        - 打包或单独约定范围的支持活动
        - 运营上可见，但未公开变现方式
        - 有助于留存；利润率影响未知
        - 要求支持人员配置模型和附加率经济性
      - - 合作伙伴影响的销售
        - 渠道和合作伙伴网络参与销售与交付
        - 合作伙伴协助的企业合同
        - 公司层面已确认；佣金经济性未披露
        - 能扩大触达，但会压缩实际利润率
        - 要求来源管线占比、合作伙伴费用和渠道折扣政策
    notes: 本表把可见收入机制和缺失的实际经济性分开。本章唯一公开标价来自维护 / CMMS 产品线，不应外推到整个 HUB。
