  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与公开定价支撑
        blocks:
          - type: paragraph
            body: >-
              osapiens 进入估值讨论时，有一个异常强的公开事实，也有一个异常重要的缺口。强事实是，公司在 2026 年 1 月宣布 $100 million Series C，并称该轮将其推过 $1 billion
              独角兽门槛；此前它在 2024 年完成 $120 million Series B、2023 年完成 $27 million Series A。独立报道也重复了公司的规模说法：客户超过 2,400
              家，全球专业人员超过 550 名。缺口在于，本次审阅的公开来源都没有披露当前 ARR
              金额、毛利率、NRR、服务收入组合，或融资条款；投资人无法验证价格是真的有吸引力，还是仅仅真实存在。官方增长叙事方向上亮眼——2025 年 Q2 ARR 同比翻倍，上半年新增 400
              多家企业客户——但分母风险仍是投资论证的核心。对高增长软件资产而言，独角兽估值可以合理；但如果没有当前财务基数和名义估值背后真实经济性的证据，新买方不能自动接受这个价格。
