  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 市场图谱和竞争者类别
        blocks:
          - type: paragraph
            body: >-
              这个市场不能简化成一组干净的同业。直接聚焦采购和尽调的竞争对手包括 IntegrityNext、Prewave 和 Sourcemap，它们都公开强调供应商风险、多层级可见性或可追溯性。
              第二个集群来自报告和碳管理驱动的平台，例如 Watershed、Persefoni 和 Workiva；当买方从披露、鉴证或碳管理工作流切入再向外扩展时，它们会参与竞争。
              第三个集群是既有厂商或宽套件回应：SAP、Sphera 和 Cority 可以从更大的 ERP、风险、EHS 或咨询关系里销售重叠的可持续发展功能。 相邻替代品也重要。EcoVadis
              在本次审阅来源中不是一对一工作流替代，但它可以完成足够多的供应商评级任务，从而分流预算。 Greenly 和 Coolset
              展示了更窄工具如何凭借包装清晰或部署更快胜出。最后，现状方案仍是电子表格、收件箱、顾问搭建的追踪表和 ERP 插件；对较小或较早阶段买方而言，这仍代表「不做集成化改造」的替代选项。
