          - type: callout
            title: Omnibus 一揽子变更压缩纯报告需求，并抬高规模测算不确定性
            body: >-
              最大的市场逆风不是技术被拒绝，而是监管范围收窄。omnibus 一揽子变更后，仅 CSRD 需求明显下降；如果不混入报告、尽调和可追溯性工作流，公开证据仍无法隔离像 osapiens
              这样的供应商到底还有多少软件支出在范围内。
