        title: GTM 动作、销售效率代理指标和公开牵引力
        blocks:
          - type: paragraph
            body: >-
              公开增长叙事在动能上很强，在效率上很弱。osapiens 称 2025 年 Q2 年经常性收入（ARR）再次同比翻倍，已连续 42 个月实现三位数同比增长，仅 2025 年上半年就新增 400 多家企业客户。
              同一篇新闻稿称，ARR 中已有相当一部分来自非德语市场；英国扩张新闻稿又加入了 €35 million 本地投资计划和 150 多个岗位。
              这些信号指向一家仍在为市场占领、地域扩张和类别领导地位投入资金的公司，而不是短期最大化运营杠杆。GTM 看起来也有分层。
              核心合规和透明度模块仍由企业销售和联系销售驱动，但维护产品线增加了更轻的免费试用入口。强大的国际合作伙伴网络也显示出一定渠道杠杆。
              缺失的是投资人通常最需要的部分：获客成本（CAC）、回本周期、销售配额产能、净留存和销售周期数据。 低信心的单客户收入代理指标，只能把 GetLatka 有争议的 $90 million
              收入数字与官方客户数结合起来粗略三角测算；即便如此，它也只能作为粗边界，而不是锚点。
