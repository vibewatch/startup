      - number: '7.5'
        title: 缓释因素、监测指标与投资逻辑失效触发点
        blocks:
          - type: paragraph
            body: >-
              缓释故事可信，但需要证据。osapiens 越来越把自己定位为效率、风险管理、审计工作流和供应商运营平台，而不是纯 ESG
              报告供应商。这一定位重要，因为即便报告适用范围收窄，投资人、客户和保险方压力仍可能延续。不过，并非所有缓释因素都同样有力。招聘和英国扩张展示的是雄心，不必然证明可持续的单位经济。游说活动说明公司有意识，不说明它能控制政策。可执行的监测指标因此应务实且可量化：安全保障、价值兑现时间、客户集中度、经审计现金跑道，以及非规则驱动模块正在扩张的证据。投委会应把这些视为否决标准，而不是可有可无的尽调项。如果管理层无法证明企业级保障、可接受的部署滑坡、健康留存，以及不依赖监管不断扩大的增长路径，那么下行情景不是小幅降估值，而是持久性投资逻辑失效。
