      - number: '8.4'
        title: 建议、退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              基于公开证据的建议是观察，中等信心、高风险，估值立场偏高。对一家增长和客户证据都很强的公司来说，这听起来可能谨慎，但它刻意对价格敏感。问题不是 osapiens
              没有产品市场契合的信号；问题是公开记录仍无法展示当前收入桥、利润率结构、留存、服务强度或融资条款，因而不足以有把握地支持支付超过 $1
              billion。退出准备度也同样好坏参半。由财务赞助方支持的交易或战略并购，比短期 IPO 更站得住脚，因为公司仍缺少上市公司级别的披露深度。实际含义很简单：继续尽调，但如果数据室无法证明
              ARR、监管依赖的多元化或优先权条款，应把它视为否决事件，而不是可争论事项。尽调议程应聚焦真正驱动价值的变量——当前 ARR
              和收入质量、监管驱动模块与运营模块的组合、扣除服务和实施负担后的毛利率、队列留存，以及名义估值背后普通股的真实经济性。
