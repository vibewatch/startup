  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 以客户工作流理解产品范围
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，osapiens 销售的是面向受监管供应链和可持续发展团队的共享工作流栈，而不是单一应用。 在官方平台页面上，HUB
              被包装为一个云端系统和单一事实来源，覆盖透明度、披露与报告、供应商协作、分销与循环，以及维护。 最清晰的客户工作流是 EUDR：供应商可以用免费门户或 REST API 提交地块、DDS
              或批次数据，买方随后把这些数据复用于尽调、可追溯性和报告。 相邻页面把同一套运营模型延伸到 CSRD 报告、CSDDD 或 LkSG 尽调、产品合规与可追溯性，以及
              SRM。维护产品线把套件从合规扩展到运营执行，但它从一个独立站点营销，所以投资人应把 osapiens 看作一个带共享数据野心的套件，而不是边界狭窄的 SKU。 横跨 EUDR、ESG
              报告、维护和烟草追踪追溯的客户故事，也强化了这种多模块定位。
