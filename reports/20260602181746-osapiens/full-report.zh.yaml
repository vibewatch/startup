      - number: '5.4'
        title: 信任、控制和产品风险
        blocks:
          - type: paragraph
            body: >-
              信任和质量证据好坏不一。积极面是，osapiens 发布基于 GDPR 的隐私声明，列出数据保护官，并以一家私营软件公司少见的具体程度记录供应商工作流。 EUDR
              页面还声称使用欧盟服务器托管、与法律专家共同开发，并拥有 ISO 9001、ISO 27001 和 SOC 2 Type II 资质。
              这些信号对企业采购重要，但在本次审阅的公开材料中，仍主要停留在营销层证据。没有找到公开证书编号、范围说明、审计桥接信或产品级安全白皮书。 同样，99%+ 可靠性、报告耗时减少 80%、每张工单节省 17
              分钟、停机时间减少 8% 等公开性能主张，也没有可访问的 SLA 文件、事故历史或可复现方法学支撑。 公开路线图可见度也弱：供应商门户帮助中心保持维护，但审阅表面没有暴露核心模块的未来发布日期历。
              最后，一些最相关的表面被客户凭证或登录墙挡住，这限制了外部对支持质量、社区材料和真实 API 可用性的尽调。 因此，主要产品技术风险不是缺少模块广度，而是实施和投资判断的不透明。
