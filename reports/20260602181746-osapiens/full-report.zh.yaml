      - number: '8.3'
        title: 情景区间与入场纪律
        blocks:
          - type: paragraph
            body: >-
              由于公司没有公开披露当前 ARR，情景测算必须明确区分假设和证据。证据是：当前估值标记高于 $1 billion，公司报告了极高的近期增长，公开可比公司集中在大约 2x 到 6x
              收入。以此为起点，入场纪律变成支撑门槛测算。$1 billion 估值在 6x 下需要大约 $166.7 million ARR，在 8x 下需要 $125 million，在 10x 下需要 $100
              million。如果当前可支撑 ARR 只有约 $70 million 到 $90 million，隐含价值区间降至大约 $350 million 到 $630 million。如果 ARR 已经达到 $100
              million 到 $130 million，且增长和多元化守得住、公司配得上 8x 到 10x 倍数，区间才会来到大约 $800 million 到 $1.3 billion。只有 ARR 约 $130
              million 到 $160 million 且溢价倍数持续的乐观情景，才明确支撑独角兽估值以上的实质上行空间。因此建议必须对价格敏感：关键问题不是 osapiens 好不好，而是今天这个价格下面到底有多少当前
              ARR，以及收入质量如何。
