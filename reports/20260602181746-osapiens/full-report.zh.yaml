          - type: paragraph
            body: >-
              公开证据显示，法律和监管风险面是真实存在的，但不是被制造出来的争议。一方面，osapiens 受益于欧盟可持续发展和尽调规则，因为它的产品页面和客户叙事都围绕这些规则搭建。另一方面，这些规则本身也在变化。CSRD
              适用范围大幅收窄，CSDDD 被缩窄并推迟，BAFA 也公开放松了德国 LkSG 执法的部分口径。即便大型企业义务仍在，这一组合也会削弱中端市场买家的短期紧迫感。法律层面更微妙。osapiens 发布了 GDPR
              隐私政策、列明管理董事和登记信息的法定声明，以及一条显示其参与政策沟通的游说登记记录。但本次审阅的公开来源没有显示实质性事故历史、诉讼，或安全保障材料。因此应把它放进风险清单，并列入尽调问题：核验数据处理控制、法律索赔历史、保险、报告责任的合同分配，以及是否有客户在尽调或披露流程中质疑过输出准确性。
