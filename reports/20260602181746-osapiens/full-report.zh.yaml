      - number: '3.3'
        title: 切换成本、多栖使用和分发能力
        blocks:
          - type: paragraph
            body: >-
              最强锁定效应不太可能来自一张监管清单，而是在平台成为供应商入驻、证据存储、审计轨迹以及向 TRACES 或 CSRD 报告等工作流反复提交的运营记录系统时形成。
              在这种情况下，替换问题不只是软件替代，而是要在采购、合规、可持续发展、财务和供应商之间重新接管流程。即便如此，多栖使用仍然合理，因为预算和购买中心不同。 财务主导团队可以保留 Workiva，采购团队可以添加
              IntegrityNext 或 EcoVadis，气候团队仍可使用 Watershed 或 Greenly。因此，分发能力和功能广度一样重要。 SAP、Workiva、Sphera 和 Cority 可以通过既有
              ERP、报告、风险或咨询预算切入；osapiens 看起来最强的场景，是企业买方想要一个更宽的合规平台，而不是几件狭窄工具。 开放问题在于，osapiens 的企业契合度到底有多少来自 SAP
              友好性、伙伴准入和生态杠杆，又有多少只是来自广泛模块覆盖。
