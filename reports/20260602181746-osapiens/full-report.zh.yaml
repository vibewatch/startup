      - number: '5.2'
        title: 架构、集成和部署模型
        blocks:
          - type: paragraph
            body: >-
              osapiens 发布工作流文档的地方，架构证据最强；发布底层系统图的地方则不是。面向供应商的帮助中心是公开的，记录了 EUDR 地块上传、批次、问卷和 REST Supplier API。
              这给出了门户层、机器对机器摄取，以及受监管供应商网络结构化数据交换的具体证据。Code & Co. 的尽调摘要是主要独立佐证，确认产品套件运行在自研 Hub
              上，带有共享后端逻辑、欧盟服务集成，以及跨用户侧解决方案的资产共享。 运营侧，独立维护网站提供了第二条架构线索：公开页面声称有认证 SAP 连接器、30 多个集成、开发者 API 访问、Power
              BI、SharePoint、Outlook 和 SSO 钩子，并支持技术人员移动端和离线执行。 代价是可见度不足。完整供应商 API 文档对客户设门槛，CertifierOS 文档公开只露出一个落地页，生产门户和
              osapeers 社区需要登录，GitHub 只显示少量公开 fork 记录。 这些足以验证集成表面存在，但不足以完整判断错误处理、速率限制，或内部云与服务拓扑。
