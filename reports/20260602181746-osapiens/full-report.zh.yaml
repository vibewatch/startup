          label: 供应商维护资料和请求上下文
          detail: 门户支持组织数据和客户沟通。
        - id: geodata
          label: 供应商上传地块、DDS 或批次
          detail: 地块可手动提交，也可通过多格式上传；API 可提交请求和响应。
        - id: hub
          label: HUB 集中并丰富合规数据
