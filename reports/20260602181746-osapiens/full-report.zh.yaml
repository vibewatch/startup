  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 可支撑的 ARR 假设
      - 倍数逻辑
      - 指示性估值区间
      - 概率信号
      - 主要触发因素
    rows:
      - - 悲观
        - $70M-$90M ARR 支撑
        - 5x-7x；2026 年市场更艰难，估值更接近上市可比公司的收敛水平
        - $350M-$630M
        - ~25%：规则驱动需求走弱、服务强度偏高时较可能成立
        - 经审计 ARR 低于 ~$90M、Omnibus 后业务组合偏弱，或毛利率偏低
      - - 基准
        - $100M-$130M ARR 支撑
        - 8x-10x；适用于仍在高速增长且更分散的软件资产
        - $800M-$1.3B
        - ~50%：如果当前 ARR 约为九位数且增长质量守住，这是最可能情景
        - 需要干净条款，并证明运营模块和交叉销售确实重要
      - - 乐观
        - $130M-$160M ARR 支撑
        - 10x-12x；对应异常高速增长和宽平台韧性
        - $1.3B-$1.92B
        - ~25%：需要高质量收入，并有强留存和毛利率支撑
        - 非规则驱动需求、强队列表现，且服务拖累有限
      - - 按概率加权后的读数
        - 中点等价支撑
        - 按上述概率加权的情景中点
        - ~$1.05B 中点
        - 只有在基准到乐观的有利组合下，当前价格才大致合理
        - ARR 或条款一旦有负面意外，价值会很快跌到披露估值之下
    notes: 这些情景是支撑框架，不是管理层指引；它们用于说明，要持有这个价格，需要怎样的当前 ARR 和倍数支撑。
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
