        - 贯穿透明度、效率和合规的单一事实源
        - 公共云、数据模型和服务拓扑细节未披露
      - - EUDR 合规
        - 进口商、出口商、下游运营方和供应商
        - 已上线的旗舰工作流
        - 门户 + API + 尽职调查、可追溯和报告流程
        - 未公开 SLA 或风险模型方法论细节
      - - CSRD 与披露报告
        - 可持续和报告团队
        - 已上线
        - 自动化报告、审计就绪框架和 IRO 指引
        - 未看到公开模板深度或输出示例包
      - - CSDDD / LkSG 尽职调查
        - 合规、法务和采购团队
        - 已上线
        - 以法律框架组织的尽职调查工作流
        - 运营 KPI 和大规模部署证据在公开层面很薄
      - - 产品合规与可追溯 / DPP
