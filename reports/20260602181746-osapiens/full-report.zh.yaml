        - 如果现金跑道偏短且没有清晰融资路径，或经济性依赖下轮降价融资
        - 重估为融资风险情景，或停止
      - - 客户集中度和留存不透明
        - 大型公开客户集和交叉销售叙事
        - 前 10 大 ARR 占比、logo 集中度、GRR、NRR、模块级扩张
        - 如果头部客户依赖或弱留存削弱耐久性
        - 按集中度风险定价，或拒绝
