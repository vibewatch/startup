    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、法律架构和平台范围
        blocks:
          - type: paragraph
            body: >-
              osapiens 将自己定位为一家在 Mannheim 创立的软件公司，主打通过透明度和效率实现可持续增长。在官网首页、About 页面和融资新闻稿中，公司始终把叙事锚定在 osapiens
              HUB：一个云端平台，把监管合规工作流、供应链透明度和运营效率工具放进同一套系统。 法律主干很清楚：运营实体是注册在 Mannheim 的 osapiens Services
              GmbH。产品叙事已比早期的供应链透明度信息明显拓宽。 最初的可信供应链数字平台，如今已经扩展到披露管理、尽调、可追溯性、维护、服务和自动化工作流。2024-2026 年的资料中，公司一直沿用同一套战略表述：一个
              AI 加持的多租户平台，承载多项企业级解决方案。 这种一致性很重要，因为后续章节可以把 osapiens 视为围绕欧洲监管和运营绩效销售工作流整合的控制平台供应商，而不是狭义 ESG 单点工具。
