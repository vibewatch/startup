  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础和分层
        blocks:
          - type: paragraph
            body: >-
              osapiens 的公开客户证据显示，这家公司主要卖给企业和受监管的中端市场买方，而不是靠自助式 SMB 采用。
              反复出现的买方画像包括可持续发展负责人、合规团队、采购或供应商风险负责人、报告团队，以及部分模块中的维护经理等运营负责人。 公开用例证据集中在 EUDR
              和更广泛的供应链尽调上，但表面已经延伸到披露管理、碳核算、审计工作流、维护和分销。 分层最清楚的具名参考客户，是 hagebau、Puratos、Coca-Cola HBC、JELD-WEN
              Europe、Westwing、Motor Oil Group 和 NKG 等大型欧洲集团。 这种广度有用，但不能完全化解集中度风险，因为公开证据仍偏向欧洲和监管触发的需求。BAT 和 Tesco
              出现在英国扩张页面上，说明触达范围已超出 DACH；但公开材料没有按细分、地域或渠道量化收入，所以客户分层地图比收入地图更可见。
