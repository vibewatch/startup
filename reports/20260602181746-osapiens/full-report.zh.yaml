            body: >-
              公开的领导层画像仍高度依赖创始人。osapiens 将 Alberto Zamora、Stefan Wawrzinek 和 Matthias Jungblut 列为创始人，当前页面也把 Jörg Bernauer
              和 Daniel Schwarz 放在重要运营岗位上。 法律披露的董事总经理是 Alberto Zamora、Stefan Wawrzinek 和 Matthias Jungblut，当前 About 页面则将
              Wawrzinek 描述为董事会主席。 但公司没有提供上市公司或材料充分的后期私营公司通常会披露的详细董事会名单、委员会架构或投资人权利信息。 本报告覆盖期内最明显的领导层变化，是 2024 年 4 月任命
              Lucas Ziegler 负责财务，之后体现在其 CFO 头衔上。头衔体系本身也有些流动：部分页面称 Zamora 为「CEO」，而 Series C 材料把 Zamora 和 Jungblut 称为联席
              CEO。 合起来看，证据指向强创始人控制、财务职能逐步专业化，以及一套仍需直接尽调、不能只靠桌面研究推断的治理安排。
