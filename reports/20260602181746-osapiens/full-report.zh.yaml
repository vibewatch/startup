        - 更广泛的效率 / 审计 / 风险模块和非德国市场扩张
        - 非规则驱动模块贡献的新 ARR 占比；规则驱动管线敞口
        - 如果尽调无法证明非规则驱动扩张路径可信，或规则敏感型管线仍占主导
        - 视为投资逻辑破裂，或要求入场价格大幅下调
      - - 安全和隐私保证缺口
        - 隐私政策和集中式平台控制公开可见，但外部保证不可见
        - SOC 2 / ISO 27001、渗透测试节奏、事故日志、客户安全审批
        - 当前没有保证包、重大问题未解决，或存在未报告的重大事故历史
        - 暂停投资，直到问题清除
