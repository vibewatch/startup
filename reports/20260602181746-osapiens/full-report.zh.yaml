  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        This table covers the most decision-useful public and private references with directly reviewable valuation or
        revenue evidence. It is not exhaustive because most private sustainability platforms do not disclose current
        revenue cleanly.
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考价值
      - 局限
    rows:
      - - osapiens（标的）
        - 最新轮融资加公开增长信号
        - '>$1.0B 估值；无公开当前 ARR；低可信度数据供应商信号意味着以 $90M ARR 计约 11.1x'
        - 直接评估标的，客户规模可见，并有超高速增长说法
        - 当前 ARR、毛利率、留存和股权结构表条款仍未披露；供应商数据与官方融资历史冲突
      - - SAP
        - 2026 年 6 月市值对 TTM 收入
        - 以 $224.96B 市值和 $43.72B 收入计，收入倍数约 5.1x
        - 大型软件和企业数据参考，显示公开市场愿意为已规模化、披露充分的平台支付什么价格
        - 规模大得多、业务更分散，也比 osapiens 成熟得多
      - - Wolters Kluwer
        - 2026 年 6 月市值对 2025 年收入
        - 以 $16.05B 市值和 $7.19B 收入计，收入倍数约 2.2x
        - 有用的合规与信息服务基准，专业软件敞口高
        - 业务组合和增长画像比 osapiens 更成熟、增速更低
      - - Nasdaq
        - 2026 年 6 月市值对 TTM 收入
        - 以 $49.71B 市值和 $8.30B 收入计，收入倍数约 6.0x
        - 数据、工作流和治理基础设施参考，位于公开可比区间上沿
        - 资本市场敞口和披露质量使它只能作为方向性可比
      - - IntegrityNext
        - 数据供应商披露的 2025 年 ARR 和估值
        - 以 $17.5M ARR 和 $52.5M 估值计，隐含 ARR 倍数约 3.0x
        - 纳入材料的来源中，最接近的已披露私营可持续软件倍数
        - 数据供应商权威性低，且规模远小于 osapiens
      - - Watershed
        - 私营估值状态
        - $1.8B 当前估值，累计融资 $185M
        - 说明规模化可持续平台仍可拿到溢价私募估值
        - 纳入材料的来源未披露当前收入，因此没有干净倍数可用
      - - Persefoni
        - 私募轮次和估值状态
        - 2025 年 $23M Series C；PremierAlts 列示 $450M 估值
        - 作为一家追求盈利的可持续软件同行，是有用的偏低端参考
        - 纳入材料的来源里，收入披露不够干净，无法做逐项对比倍数
    notes: 由于收入披露干净的直接私营可比公司稀缺，本表混合了公开软件与信息服务参照，以及私营可持续平台。
