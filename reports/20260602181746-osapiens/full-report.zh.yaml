        - id: entry
          label: 首个模块成交
          detail: 透明度或效率模块成为第一个签约入口。
        - id: expand
          label: 平台扩张
          detail: 合规、供应商和运营工作流继续接入更多 HUB 模块。
        - id: services
          label: 集成与启用
          detail: ERP/SAP 集成、上线导入、支持和客户成功推动部署。
        - id: revenue
          label: 经常性收入底座
          detail: 订阅收入增长；服务则影响交付成本和现金节奏。
      edges:
        - from: trigger
          to: entry
          label: 转化为
        - from: entry
          to: expand
          label: 借助扩张
        - from: entry
          to: services
          label: 靠其落地
        - from: expand
          to: revenue
          label: 持续叠加
        - from: services
          to: revenue
          label: 支撑也稀释
