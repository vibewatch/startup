  - id: TV005
    title: 投资逻辑破坏与否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 经审计 ARR 远低于支撑阈值
        - 当前 ARR 或收入运行率低于大约 $80M-$90M
        - 即便不讨论毛利率或溢价倍数，独角兽估值也难以自圆其说
        - 不要按披露价格投资
      - - 监管需求集中度过高
        - 新增 ARR 中，很大一部分仍依赖那些在 Omnibus 范围调整后紧迫性大幅下降的客户或模块
        - 韧性论证会从平台逻辑转为短期监管提前拉动
        - 下调倍数，重看整个投资逻辑
      - - 服务或实施负担过重
        - 毛利率偏弱，或服务强度吃掉过多收入基础
        - 这门生意不再像溢价软件，更像低倍数部署模式
        - 把情景推向悲观区间
      - - 压缩市场中出现争议或实施失败
        - 出现重大数据质量、合规输出或客户部署争议
        - 信任一旦破裂，估值压缩的软件市场很可能迅速惩罚不透明资产
        - 暂停尽调，重新评估下行空间
      - - 优先股堆叠对投资人不友好
        - 参与型优先权、反稀释棘轮或隐藏保护条款压低干净普通股价值
        - 名义估值不再代表可投资的经济权益
        - 除非价格或条款改善，否则把当前估值视为误导
    notes: 这些是估值否决标准，不是泛泛的经营风险；每一项都会直接改变当前价格对新投资人的价值。
    claimRefs:
      - CV008
      - CV018
      - CV031
      - CV032
      - CV033
      - CV039
      - CV045
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 当前 ARR 与收入桥
        - 董事会批准的 ARR、确认收入，以及从 2024 年到最新月份的增长桥
        - 公开承销主要卡在分母风险，不是故事质量
        - CFO 数据室、审计材料和月度董事会材料
      - - 毛利率和服务组合
        - 按模块拆分的毛利率、实施负担、专业服务占比，以及按部署类型计算的回本周期
        - 只有扣除服务和上线成本后仍像软件，溢价估值才成立
        - 财务与交付尽调
      - - Omnibus 后的模块组合
        - 与 CSRD/CSDDD/EUDR 紧迫性相关的预订和 ARR 占比，对比更广泛运营工作流
        - 它决定监管收窄只是减速带，还是投资逻辑问题
        - 销售运营管线复盘和队列分析
      - - 留存和扩张质量
        - Logo 留存、扩张 ARR、ACV 组合、实施周期和客户集中度
        - 按当前价格，增长质量比原始客户数更重要
        - 收入运营队列包和客户背调电话
      - - 股权结构表和下行保护
        - 股份类别、清算优先权、反稀释条款、MFN 条款，以及任何老股经济安排
        - 名义估值可能显著高估干净普通股价值
        - 律师审阅融资文件
      - - 退出准备度
        - 经审计财务节奏、控制环境，以及财务投资人或战略买家的匹配度
        - 可能的退出路径决定今天能接受多少倍数风险
        - 董事会材料、审计准备度复盘和战略买家映射
    notes: 每个尽调问题都对应一个变量：它可能抬高公允价值、显著压低公允价值，或直接打破投资逻辑。
    claimRefs:
      - CV006
      - CV008
      - CV017
      - CV019
      - CV039
      - CV044
      - CV046
      - CV047
