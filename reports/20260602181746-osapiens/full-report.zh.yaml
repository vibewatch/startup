  - id: FI001
    title: 收入模式传导图
    type: flow
    summary: 公开证据显示，osapiens 采用先落地再扩张的收入模式：从监管或运营痛点切入，转化为平台订阅，再逐步叠加服务和相邻模块。
    data:
      nodes:
        - id: trigger
          label: 买方触发点
