  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源、包装和商业化姿态
        blocks:
          - type: paragraph
            body: >-
              从财务角度看，osapiens 应被理解为拥有多个可变现切入点的平台供应商，而不是单一 ESG 报告 SKU。 公司的主要商业叙事，把
              CSRD、EUDR、供应商风险、披露和可追溯性等透明度产品，与维护、服务和分销等效率产品结合在一起。 这种广度重要，因为它支撑先落地再扩张的销售和跨职能预算：采购、可持续发展、合规、运营和现场团队都可能成为入口。
              本章唯一可见的公开价格表来自维护 / CMMS 产品线。它显示 Premium 计划按年计费为每用户每月 €49，另有 Enterprise 层级，直接进入集成、定制和销售主导签约。
              这对标价和包装是有用证据，但不能证明公司整体实际定价。核心 HUB 模块仍主要通过演示和联系销售完成。 因此，可防守的结论是结构性的，而非精确数字：osapiens
              很可能具备订阅主导的收入质量，并在部署和集成周围叠加服务层；实际平均销售价格（ASP）、折扣和产品家族收入结构仍是开放尽调项。
