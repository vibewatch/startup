      - number: '8.2'
        title: 投资逻辑、反向逻辑与可比公司集
        blocks:
          - type: paragraph
            body: >-
              osapiens 的正向逻辑真实且有证据。公司不是只停留在幻灯片里的 ESG 故事：它从知名投资方拿到大额融资，声称客户超过 2,400 家，报告 2025 年 Q2 ARR
              又一次同比翻倍，并把自己定位为覆盖合规、可持续发展和运营效率的 25+ 模块平台，而不是狭窄的披露工具。市场报告也指向 ESG 和可持续发展软件的结构性需求仍在延续。反向逻辑同样重要。2025-2026
              年同一组监管来源显示，Omnibus 变更显著收窄了 CSRD 和 CSDDD 适用范围，这可能削弱中端市场合规支出的紧迫感。公开可比数据给估值加了约束。SAP、Wolters Kluwer 和 Nasdaq
              虽不完美，但可作为软件和信息服务参照，收入倍数大约在 2x 到 6x。私有公司可比数据差异很大：低权威数据供应商显示 IntegrityNext 接近 3x ARR，Watershed 仍有 $1.8
              billion 私有估值，Persefoni 则低得多。这组混合证据支持继续关注，但不支持盲目接受 osapiens 的价格。
