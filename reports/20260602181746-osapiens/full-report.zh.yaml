      - number: '2.2'
        title: 买方地图、预算归属和采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图比单一「ESG
              团队」叙事更宽。公开实施指南和供应商定位显示出三类重叠买方：需要供应商风险可见性和可追溯性的采购与供应链负责人；拥有政策、披露内容和监管解读职责的可持续发展与合规团队；以及当鉴证、申报和审计就绪要求靠近财务报告技术栈时，相关性上升的财务或内控职能。
              采用通常从一个触发点开始，例如 CSRD 范围界定、EUDR 准备、供应商压力或边境碳暴露。之后，买方会映射供应商和数据源、评估风险、收集信息、分派整改动作，并把周期性报告或证据生成运营化。
              这也是尽调软件粘性可能很强的原因：一旦工作流把采购、供应商、法务和报告团队连接起来，替换就会带来运营痛感。
              近期最大的买方也明显偏大型企业。市场数据称大型组织主导类别支出，最相关行业是制造、能源与公用事业、消费品、零售，以及其他供应链密集行业；在这些行业里，可追溯性和合规已经是董事会层面的议题。
