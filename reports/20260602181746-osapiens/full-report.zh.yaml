      - number: '7.4'
        title: 财务、客户与执行风险
        blocks:
          - type: paragraph
            body: >-
              财务风险主要来自不透明，而不是看得见的困境。osapiens 已披露 2023、2024 和 2026
              年三次有意义的融资，并仍在投资员工扩张和英国市场，但公开材料没有披露经审计收入、利润率或现金跑道。第三方数据也无法干净消除这种不透明：GetLatka 称其收入为 $90 million、估值为 $270
              million，同时又称公司未接受外部融资，这与官方融资公告直接冲突。客户风险同样来自尚未披露的内容。官方页面在不同位置分别引用 1,800 个满意客户、近 2,000 家公司、超过 2,500
              家公司，但本次审阅材料都没有量化留存、模块组合、大客户集中度或按地域拆分的收入。执行风险也顺势出现。公司从 Armira 尽调时描述的 115+ 名员工 / 200 家企业客户阶段，增长到 500+
              名员工并计划在英国招聘 150 人，确实可能赢很大；但它也必须证明招聘、入职、客户成功和产品治理的扩张速度，能跟上客户标识数量。
