  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 主要威胁
      - 严重性
      - 威胁为何可信
      - 当前公开信号
      - 尽调问题
    rows:
      - - 统一的报告 + 尽调 + 可追溯套件
        - 买方把预算拆给报告、碳管理和采购的最佳单点工具
        - 高
        - 不同职能掌握不同预算时，多工具并用可行
        - Workiva、Watershed、EcoVadis 和采购平台可以共存
        - 按客户队列索取附加购买率和模块整合数据
      - - 企业适配和 SAP 友好度
        - SAP、Workiva 等既有厂商依托更强装机基础，捆绑重叠能力
        - 高
        - 既有 ERP 或财务关系降低了既有厂商切入时的供应商切换阻力
        - 竞争对手来源强调 osapiens 对 SAP 的亲和度，同时 SAP 也销售自己的可持续发展栈
        - 索取 SAP 权重高账户的赢单 / 输单数据，以及伙伴主导管线占比
      - - 可审计的监管工作流
        - IntegrityNext 等厂商营销同样的信任话术后，清单覆盖会商品化
        - 高
        - 审计轨迹、自动化和法规更新如今出现在多个厂商中
        - osapiens 和 IntegrityNext 都主打可审计合规定位
        - 索取续约驱动因素和合规结果差异化证明
      - - 供应链数据网络和入驻工作流
        - 评级网络和可追溯专科厂商可能掌握价值最高的供应商数据交互
        - 中
        - EcoVadis、Prewave、IntegrityNext 和 Sourcemap 都在争夺供应商触点
        - 多家玩家都营销供应商网络密度，并非只有一家
        - 索取活跃连接供应商数、提交频率和跨客户复用指标
      - - 面向企业买方的平台广度
        - 中端市场专科厂商靠速度、包装清晰度和更轻实施负担赢单
        - 中
        - Coolset 和 KEY ESG 明确把 osapiens 描述为可能对小团队偏重
        - 竞争对手撰写的反向证据指向复杂度和适配风险
        - 按交易规模索取实施时间和服务强度基准
      - - 法规驱动需求
        - 法规延后或收窄会削弱纯合规差异化
        - 高
        - Verdantix 称，市场不再只看报告能力后，供应商正在重新思考差异化
        - Assent 和 Verdantix 都认为需求会持续，但监管节奏噪音更大
        - 检验管线有多大比例来自直接适用范围，多少来自客户层层传导的压力
    notes: 严重程度来自作者对公开证据的判断。本登记表用于标出 osapiens 可能真正有护城河的地方，以及护城河可能更像叙事、难以持久的地方。
