              - CM036
              - CM037
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 市场窄于泛 ESG 热潮，但结构性吸引力仍在
            body: >-
              公开证据支持一个务实市场：它小于最宽泛的可持续发展软件头条数字，但仍规模可观、增长较快，并且对大型企业越来越像必选项。
              最好的信号不是宽口径总可用市场（TAM）标题本身，而是高企业客户占比、强劲报告增长，以及供应链可持续发展模块更快增长的组合。
