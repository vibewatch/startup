      - - 投资逻辑：产品不只是狭义 ESG 报告工具
        - 公司材料描述了 25+ 个企业级解决方案，覆盖合规、可持续和运营效率，并运行在同一平台上。
        - 如果模块附加、交叉销售和非规则驱动使用在当前 ARR 中已具备实质占比，判断会增强。
      - - 投资逻辑：品类需求仍然存在
        - 尽管规则发生变化，多份市场报告仍显示 ESG 和可持续软件有两位数增长。
        - 如果即便在不再直接受 CSRD 紧迫性驱动的细分市场中，订单仍保持强劲，判断会增强。
      - - 反向逻辑：监管在收窄，而不是扩大
        - KPMG 和 Coolset 显示，Omnibus 之后适用范围明显缩小、时间表延后，这可能削弱部分买家的紧迫性。
        - 只有当管理层证明增长正在转向运营、审计和风险用例，而不是收缩中的规则驱动队列时，担忧才会缓解。
      - - 反向逻辑：公开可比公司的现实比融资故事更苛刻
        - SAP、Wolters Kluwer 和 Nasdaq 的交易区间大致为 2x-6x 收入，而不是开放式风险投资倍数。
        - 如果当前 ARR 已经能以溢价倍数支撑该估值，而不是靠激进假设硬撑，这个担忧会缓解。
      - - 反向逻辑：分母仍不透明
        - 已审阅的公开来源均未披露当前 ARR 金额、毛利率、NRR 或优先权条款；GetLatka 的数据还与官方融资历史冲突。
        - 只有数据室补齐收入桥、单位经济模型和普通股条款，这个担忧才会缓解。
    notes: 反向逻辑主要指向分母风险和监管韧性，而不是质疑公司是否存在或是否已有客户牵引。
