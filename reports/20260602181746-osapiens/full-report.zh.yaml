      - number: '4.4'
        title: 资本充足性、融资依赖和财务判断
        blocks:
          - type: paragraph
            body: >-
              公司概况章节已经记录了逐轮融资时间线；这里前瞻的财务问题是资金是否足够。公开披露的股权支持有分量：€25 million Series A、$120 million Series B 和 $100 million
              Series C，后两轮明确指定用于产品创新和国际扩张。 2025 年 7 月英国公告随后叠加了 €35 million 部署承诺和 150 个计划岗位，说明资本仍在为增长消耗。Bundestag
              游说登记册中披露的小额公共补助，相比这套股权基础并不重要。 问题不是缺少资本历史，而是缺少资产负债表可见度。本章没有任何公开来源给出现金余额、月度烧钱速度、现金跑道、杠杆或契约细节。 Northdata
              和德国公开发布门户显示申报基础设施存在，但抓取到的公开表面仍没有提供可用于投资判断的数字。 监管时间节奏也好坏参半：omnibus 一揽子变更和 CSRD
              延迟会减缓部分报告工作流的近期买方紧迫感，即便长期透明度需求仍在。 因此，最好的公开判断只能带条件：收入质量看起来好于资本可见度，利润率路径合理但未证实，投资判断仍取决于现金、留存、定价兑现和债务的直接尽调。
