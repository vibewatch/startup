  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序和投资含义
        blocks:
          - type: paragraph
            body: >-
              osapiens 最高的剩余风险，是监管需求压缩。来自 European Commission、KPMG、QIMA、Harvard/Skadden 和 ClimatePartner 的 2025-2026
              年公开材料，都描述了一个 CSRD 和 CSDDD 义务仍然存在、但适用时间更晚且覆盖公司少于最初预期的市场。 这很重要，因为 osapiens 仍在营销 EUDR、CSRD 和 CSDDD
              具名模块，公司自己的高速增长新闻稿也明确表示，近期表现是在监管不确定性下取得的。 第二个风险集群是复杂性下的执行：供应商 API、SAP 相关维护迁移、可配置问卷和多模块落地，都依赖客户数据质量和服务能力。
              第三个是财务不透明：公司完成了大额融资并继续招聘，但公开材料没有披露经审计收入、烧钱速度、毛利率或现金跑道。 投资判断含义是有条件的，而不是非黑即白：尽调必须证明，在政策紧迫感减弱之前，osapiens
              能把合规驱动入口转化为更宽的运营支出。
