      - number: '1.3'
        title: 融资历史和资本基础
        blocks:
          - type: paragraph
            body: >-
              对一家欧洲后期软件公司来说，osapiens 的公开资本形成路径异常清晰。公司披露 2023 年 9 月完成由 Armira Growth 领投的 €25 million Series A，随后在 2024 年
              7 月完成由 Growth Equity at Goldman Sachs Alternatives 领投的 $120 million Series B，又在 2026 年 1 月完成由
              Decarbonization Partners 领投的 $100 million Series C。 由此计算，三轮融资构成约 $247 million
              的已披露新股资本。融资叙事也显示公司定位如何上移：Series A 把 osapiens 包装为 ESG 软件先行者，Series B 强调围绕欧盟监管的平台独特性，Series C
              则把它定位为全球可持续增长类别领导者。 独立媒体也印证了 2026 年的独角兽里程碑，Tech.eu 给出的估值约为 $1.1
              billion。缺失的信息几乎同样重要：仍没有关于债务融资、老股交易或经审计经营表现的公开证据。 对后续估值工作而言，资本历史扎实，但商业化历史仍基本留在私域。
