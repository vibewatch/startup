      - 哪些证据会改变判断
    rows:
      - - 投资逻辑：客户和增长证据真实存在
        - Series C 材料称 osapiens 服务超过 2,400 家客户、拥有 550 多名专业人员，而 2025 年官方更新提到 ARR 翻倍、H1 新增 400+ 家企业客户。
