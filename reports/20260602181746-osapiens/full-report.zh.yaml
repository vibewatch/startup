  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 单位
      - 当前价值 / 状态
      - 质量
      - 尽调要求
    rows:
      - - 透明度解决方案订阅
        - 围绕 CSRD、EUDR、披露、可追溯、供应商风险和尽职调查工作流销售的经常性软件
        - 年度或多年期企业软件合同
        - 已确认是主要产品族；未公开实际定价
        - 若以续约驱动则高；模块组合未披露
