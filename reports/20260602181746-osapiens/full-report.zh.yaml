            body: >-
              耐久性证据是公开客户文件中最弱的一部分。本次审阅没有看到按模块、队列或地域披露的净留存率（NRR）、总留存率（GRR）、流失、续约率、合同期限或队列留存。 存在的是代理信号：Netto
              描述日常使用；Salling Group 的扩展暗示初次采用后的模块扩张；Puratos 显示多站点标准化；EUDR 页面带有来自 dmTech、Weig 和 Givaudan 的具名客户引述。
              这些信号重要，因为它们指向活跃使用，而不是静态客户标识。即便如此，它们不能替代硬留存数据。满意度证据也有同样限制。
              可见材料主要由供应商托管的引述、推荐语和成功故事构成，独立评论深度则限于宽泛产品摘要和一组较薄的聚合页面。 正确结论是，使用看起来真实，但耐久经济性仍是私域信息，应被当作明确尽调项，而不是从营销材料中推断出来。
