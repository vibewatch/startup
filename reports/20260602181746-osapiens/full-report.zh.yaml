      - number: '7.3'
        title: 运营、质量、安全与依赖风险
        blocks:
          - type: paragraph
            body: >-
              osapiens 是软件平台，核心运营风险不是工厂或召回，而是部署质量和数据保真度。供应商 API 文档、FitGap 评测、CMMS 定价和 SAP
              迁移指南都指向同一个结论：价值兑现取决于客户特定集成、供应商参与、分类体系设计和变更管理。这带来结构性风险——平台更像配置和服务很重的系统，而不是快速见效的 SaaS
              产品。产品宽度进一步放大问题。osapiens 横跨可持续发展报告、供应商风险、举报、维护、审计和可追溯性。FitGap 认为，这种宽度可能牺牲专业深度，尤其是在偏网络安全的用例上。Code & Co
              的尽调范围在一个层面上让人放心，因为它明确审阅了可扩展性、集成、上线和支持。但那次尽调发生在公司规模远小于当前声称规模的时候，所以运营问题已经从产品可信度，转向增长期能否可重复交付。
