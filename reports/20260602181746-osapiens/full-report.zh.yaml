companyProfile:
  summary: >-
    osapiens 是一家位于 Mannheim 的企业软件公司，打造 osapiens HUB，将可持续发展报告、供应链尽调、可追溯性、合规和运营效率工作流整合到一个平台。 自 2023 年以来，公司已完成三轮已披露的大额融资，并在
    2026 年 1 月跻身独角兽；它还在受监管的工业、零售和消费品工作流中积累了公开客户证据。 osapiens 在欧洲合规技术栈里具备战略相关性，但披露水平仍远低于后期 SaaS 投资判断理想情况下所需的上市公司式材料。
