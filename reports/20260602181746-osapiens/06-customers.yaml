- id: proof
  title: Named customer proof and outcome quality
  body: The named proof set is strongest when osapiens describes a specific operational problem, a concrete module, and an observable deployment boundary. JELD-WEN Europe is framed as a multi-country traceability deployment ahead of EUDR; James Cropper references geospatial data, product tracking, and due-diligence statement automation; Westwing details supplier-portal, geolocation, and automated risk-management capabilities; Motor Oil identifies CSRD, EU Taxonomy, and carbon-footprint modules; Schunk and Solo midocean provide reporting-stack evidence beyond traceability. Outcome specificity varies. Puratos is one of the best examples because it discloses deployment breadth and time savings; PROLIT adds workflow and manual-effort detail; Coca-Cola HBC claims improved customer satisfaction and financial security but gives little denominator detail. Overall, the proof quality is good enough to confirm real enterprise usage across several modules, but the public library remains curated and
    sample-based rather than exhaustive.
  claimRefs:
  - CU011
  - CU013
  - CU015
  - CU016
  - CU019
  - CU021
  - CU023
  - CU025
  - CU028
  - CU039
  - CU048
  - CU049
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: retention
  title: Retention, repeat usage, and satisfaction
  body: 'Durability evidence is the weakest part of the public customer file. There is no reviewed disclosure of NRR, GRR, churn, renewal rate, contract length, or cohort retention by module, cohort, or geography. What does exist are proxies: Netto describes daily use; the Salling Group extension suggests module expansion after initial adoption; Puratos shows multi-site standardization; and the EUDR page carries named customer quotes from dmTech, Weig, and Givaudan. These signals matter because they point to active usage rather than static logos. Still, they are not substitutes for hard retention data. Satisfaction evidence has the same limitation. The visible material is dominated by vendor-hosted quotes, testimonials, and success stories, while independent review depth is limited to broad product summaries and a thin set of aggregator pages. The right conclusion is that usage looks real, but durability economics remain private and should be treated as an explicit diligence item rather
    than inferred from marketing.'
  claimRefs:
  - CU017
  - CU018
  - CU040
  - CU041
  - CU042
  - CU044
  - CU045
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-risk
  title: Expansion and concentration risk
  body: 'The expansion story appears credible because osapiens sells a broad platform, and IDC specifically highlighted integration across supplier intelligence, product compliance, carbon management, and maintenance. Customer proofs at Motor Oil, Schunk, Solo midocean, and the EUDR reference set support that cross-sell logic. The main visible risk is concentration by demand driver rather than by a single logo. Public proof is still dominated by Europe and by regulations such as EUDR, LkSG, CSDDD, and CSRD. That creates sensitivity to regulatory timing and to the company’s ability to keep converting compliance-led entry points into broader operational spend. FitGap also flags procurement friction: the suite is broad, EU-framed, and likely to require meaningful configuration as scope expands. Finally, the hypergrowth update references a strong international partner network, but management does not disclose partner-sourced revenue, top-customer ARR share, or revenue concentration, leaving
    concentration and channel dependence as real diligence gaps.'
