  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: NRR, GRR, logo churn, renewal rates, average contract term, and cohort retention by module or segment.
    whyItMatters: Without renewal economics it is impossible to test durability, cohort quality, or whether public customer growth is masking churn.
    diligencePath: Request cohort tables by module and region, last 12 quarters of gross and net retention, and sample customer contracts or renewal schedules.
    relatedQuestionRefs:
    - QU015
    - QU025
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration-risk
    missingEvidence: Top-10 customer ARR share, top-customer ARR share, share of ARR tied to EUDR-related products, and partner-sourced revenue share.
    whyItMatters: Public references show strong regulatory-use-case concentration, but they do not reveal whether revenue is concentrated in a few logos, sectors, or channels.
    diligencePath: Request revenue concentration tables, module mix by ARR, and channel-sourced pipeline or booking contribution for the last two fiscal years.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: named customer proof table
    missingEvidence: An exhaustive customer-reference register with production status, start dates, module mix, and current status for all public logos.
    whyItMatters: The public named-customer proof table is intentionally a reviewed sample from the visible reference set, not an exhaustive ledger of all deployments.
    diligencePath: Request a full reference list with customer status, geography, module, and willingness-to-reference flags; cross-check against CRM and customer-marketing libraries.
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: independent satisfaction
    missingEvidence: Independent review depth, reference-call notes, win-loss data, and implementation NPS or CSAT.
    whyItMatters: The available public satisfaction evidence is heavily curated by the vendor, while independent reviews are thin and not clearly tied to current enterprise deployments.
    diligencePath: Request customer-reference calls across three cohorts, implementation NPS or CSAT by module, and recent competitive win-loss summaries.
    relatedQuestionRefs:
    - QU016
    - QU025
    relatedTableRefs:
    - TU004
  - type: conflicting-data
    severity: material
    topic: customer-count reconciliation
    missingEvidence: A reconciled definition of “customer” explaining whether the public figures count contracts, legal entities, groups, active modules, or historic logos.
    whyItMatters: The reviewed public surfaces cite 1,700+, nearly 2,000, and 2,500+ customers, which makes exact scale and growth analysis sensitive to denominator choice.
    diligencePath: Ask management for a dated customer-count bridge from FY2024 to current, including active vs historical accounts and group-account counting rules.
    relatedQuestionRefs:
    - QU021
    - QU025
    relatedTableRefs:
    - TU002
