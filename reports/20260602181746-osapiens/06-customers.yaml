      detail: EUDR, LkSG/CSDDD, CSRD, maintenance inefficiency, or data-silo pain opens the buying motion.
    - label: Executive sponsor
      detail: Compliance, sustainability, procurement, finance, or operations leaders sponsor enterprise evaluation.
    - label: Initial module deployment
      detail: Teams start with one compliance or operations module tied to the highest-priority workflow.
    - label: Embedded operational use
      detail: Daily workflow use or multi-site rollout appears in the strongest references.
    - label: Expansion loop
      detail: Accounts add modules, regions, or parent-group rollouts when the first deployment stabilizes.
