schemaVersion: report-v2
artifact: customers
slug: osapiens
runDate: '2026-06-02'
company:
  name: osapiens
chapter:
  number: 6
  title: Customers
  summary: Official surfaces show osapiens moving from more than 1,300 customers in 2024 to nearly 2,000 in 2025 and marketing 2,500+ companies in 2026, with the strongest named proof in European compliance, traceability, reporting, and maintenance use cases. Public evidence confirms real multi-site and group-scale deployments, but retention economics, top-customer concentration, and channel dependence remain undisclosed.
sections:
- id: segmentation
  title: Customer base and segmentation
  body: osapiens’ public customer evidence points to a business selling primarily into enterprise and regulated mid-market buyers rather than self-serve SMB adoption. The recurring buyer archetypes are sustainability leaders, compliance teams, procurement or supplier-risk owners, reporting teams, and in some modules operational leaders such as maintenance managers. Public use-case proof clusters around EUDR and broader supply-chain due diligence, but the surface extends into disclosure management, carbon accounting, audit workflows, maintenance, and distribution. The best-segmented named references are large European groups such as hagebau, Puratos, Coca-Cola HBC, JELD-WEN Europe, Westwing, Motor Oil Group, and NKG. That breadth is useful, but it does not fully de-risk concentration because public proof still tilts toward Europe and regulation-triggered demand. The presence of BAT and Tesco on the UK expansion page suggests reach beyond DACH, yet public materials do not quantify revenue
    by segment, geography, or channel, so the segment map is more visible than the revenue map.
  claimRefs:
  - CU001
  - CU005
  - CU007
  - CU008
  - CU030
  - CU031
  - CU043
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: trajectory
  title: Adoption trajectory and deployment depth
  body: 'The public trajectory is directionally strong. osapiens said it had more than 1,300 customers in mid-2024, nearly 2,000 customers by mid-2025, and more than 400 new enterprise customers in the first half of 2025 alone. By June 2026, the customer page marketed a 2,500+ customer headline, while the same page still carried a stale 1,700+ badge. That inconsistency means growth is credible but exact active-account scale still needs a reconciled denominator. Deployment-depth proof is better than the headline count: Puratos describes one platform across 65 of 76 production units, Netto says the HUB is used every day and that the parent group is extending to EUDR, and Lohmann & Rauscher describes a supply-chain footprint with 9,000+ suppliers and 40+ group companies. These are meaningful usage and breadth signals, but none of them substitute for formal renewal or retention cohorts.'
  claimRefs:
  - CU004
  - CU005
  - CU006
  - CU011
  - CU017
  - CU018
  - CU027
  - CU041
  - CU042
  tableRefs:
