  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: competitive-unit-economics
      missingEvidence: Realized ACV, discounting, contract length, and renewal benchmarks for osapiens versus direct peers.
      whyItMatters: Public list-price opacity makes pricing-power and go-to-market comparison hard to underwrite from external evidence alone.
      diligencePath: Request won and lost deal pricing ranges, median contract length, and discount bands by segment.
      relatedQuestionRefs:
        - QP024
      relatedTableRefs:
        - TP003
    - type: private-evidence-only
      severity: material
      topic: competitive-retention
      missingEvidence: Net revenue retention, module attach rates, churn reasons, and implementation duration versus peers.
      whyItMatters: These are the most direct tests of switching cost and cross-sell durability, but they are not public in the reviewed sources.
      diligencePath: Ask management for cohort tables, module adoption curves, and examples of competitive replacements.
      relatedQuestionRefs:
        - QP017
        - QP024
      relatedTableRefs:
        - TP004
    - type: missing-source
      severity: material
      topic: osapiens-sap-fit
      missingEvidence: Independent customer evidence isolating whether osapiens wins because of SAP fit or because of broader workflow coverage.
      whyItMatters: Public SAP-fit claims currently come mainly from competitor-authored sources, which are directionally useful but not decisive.
      diligencePath: Request neutral customer references, system-integrator references, and win-loss analysis in SAP-heavy accounts.
      relatedQuestionRefs:
        - QP019
      relatedTableRefs:
        - TP001
        - TP004
    - type: private-evidence-only
      severity: material
      topic: channel-power
      missingEvidence: Partner, system-integrator, marketplace, and reseller contribution to pipeline or bookings.
      whyItMatters: Suite incumbents may have distribution advantages that are invisible in public product pages but decisive in enterprise procurement.
      diligencePath: Request partner-sourced pipeline share, named strategic partners, and direct-versus-partner win rates.
      relatedQuestionRefs:
        - QP025
      relatedTableRefs:
        - TP004
