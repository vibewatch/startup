tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - dimension
  - assessment
  - evidence basis
  rows:
  - - Recommendation
    - TRACK — continue diligence, but do not pay the unicorn price on public evidence alone
    - Scale proof and growth are real, but the valuation bridge still lacks current ARR, margin, retention, and term data.
  - - Confidence
    - Medium
    - The company-quality case is credible, while the price-support case remains incomplete.
  - - Risk rating
    - High
    - Regulatory narrowing, software multiple compression, and financial opacity all sit directly on valuation support.
  - - Valuation stance
    - Stretched
    - A mark above $1B needs roughly $100M ARR at 10x or $125M ARR at 8x, neither of which is publicly verified.
  - - Entry discipline
    - Prefer a lower entry or stronger proof
    - An entry nearer $800M-$900M offers a better public-comparable buffer than paying above $1B without data-room support.
  - - Target return / exit
    - Prefer 3-5 year sponsor or strategic path
    - At the disclosed mark, upside looks attractive only if current ARR is already well above $100M and economics are clean.
  notes: 'This table is intentionally price-sensitive: more diligence proof or a lower entry price would matter more than another generic growth narrative.'
