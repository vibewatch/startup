- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Audited ARR is far below support threshold
    - Current ARR or run-rate revenue is below roughly $80M-$90M
    - The unicorn mark becomes difficult to defend even before debating margins or premium multiples
    - Do not invest at the disclosed price
  - - Regulatory-demand concentration is too high
    - A large share of new ARR still depends on customers or modules whose urgency falls sharply after Omnibus scope changes
    - The durability case shifts from platform to transient regulation pull-forward
    - Re-cut the multiple lower and revisit the whole thesis
  - - Services or implementation load is too heavy
    - Gross margin is weak or services intensity absorbs too much of the revenue base
    - The business behaves less like premium software and more like a lower-multiple deployment model
    - Move the case toward the bear range
  - - Controversy or implementation failure emerges in a compressed tape
    - Material data-quality, compliance-output, or customer-deployment controversy appears
    - Compressed software markets are likely to punish opaque assets quickly when trust breaks
    - Pause diligence and reassess downside
  - - Preference stack is investor-unfriendly
    - Participating preferences, ratchets, or hidden protections reduce clean common-equity value
    - Headline valuation stops representing investable economics
    - Treat the current mark as misleading unless price or terms improve
  notes: These are valuation kill criteria, not generic operating risks; each one directly changes what the current price is worth to a new investor.
  claimRefs:
  - CV008
  - CV018
  - CV031
  - CV032
  - CV033
  - CV039
  - CV045
- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - Current ARR and revenue bridge
    - Board-approved ARR, recognized revenue, and growth bridge from 2024 through the latest month
    - The public underwrite fails mainly on denominator risk, not on narrative quality
    - CFO data room, auditor materials, and monthly board package
  - - Gross margin and services mix
    - Gross margin by module, implementation load, professional-services share, and payback by deployment type
    - A premium valuation only works if the business is software-like after service and onboarding costs
    - Finance and delivery diligence
  - - Module mix after Omnibus
    - Share of bookings and ARR tied to CSRD/CSDDD/EUDR urgency versus broader operational workflows
    - This determines whether regulatory narrowing is a speed bump or a thesis problem
    - Sales-ops pipeline review and cohort analysis
  - - Retention and expansion quality
    - Logo retention, expansion ARR, ACV mix, implementation duration, and customer concentration
    - Growth quality matters more than raw customer count at the current price
    - Revenue-operations cohort pack and customer-reference calls
  - - Cap table and downside protections
    - Share classes, liquidation preferences, anti-dilution terms, MFN clauses, and any secondary economics
    - Headline valuation can materially overstate clean common-equity value
    - Counsel review of financing documents
  - - Exit readiness
    - Audited financial cadence, control environment, and sponsor or strategic buyer fit
    - The likely exit path shapes how much multiple risk is acceptable today
    - Board materials, audit readiness review, and strategic-buyer mapping
  notes: Every diligence ask is tied to a variable that could raise the fair value, lower it materially, or break the thesis outright.
