  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-arr-and-margin
    missingEvidence: Board-approved current ARR, recognized revenue, gross margin, and services mix through the latest completed month.
    whyItMatters: The recommendation and valuation stance are constrained mainly by denominator risk and software-like economics uncertainty.
    diligencePath: Request monthly ARR and revenue bridge, gross-margin walk, and services versus subscription mix from the CFO data room.
    relatedQuestionRefs:
    - QV005
    - QV026
    - QV030
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: preference-stack
    missingEvidence: Cap table by share class, liquidation preferences, anti-dilution provisions, ratchets, and any investor side letters from recent rounds.
    whyItMatters: Headline valuation can materially overstate the value of clean common equity if terms are investor-unfriendly.
    diligencePath: Request financing documents and counsel summary of the liquidation stack before underwriting entry price.
    relatedQuestionRefs:
    - QV006
    - QV027
    - QV030
  - type: missing-source
    severity: material
    topic: post-omnibus-demand-mix
    missingEvidence: Current bookings and ARR split across CSRD, CSDDD, EUDR, whistleblowing, audit, maintenance, and other non-rule-driven modules.
    whyItMatters: This determines whether regulatory narrowing is a manageable mix shift or a direct threat to valuation durability.
    diligencePath: Request pipeline, bookings, and ARR breakdown by module and by customer motivation, then test against new-logo cohorts.
    relatedQuestionRefs:
    - QV009
    - QV010
    - QV025
  - type: private-evidence-only
    severity: material
    topic: retention-and-implementation-quality
    missingEvidence: Gross and net retention, implementation duration, concentration, and customer-reference evidence on deployment quality.
    whyItMatters: A premium multiple is easier to defend if ARR is sticky, expansion-led, and not too service-heavy to sustain.
    diligencePath: Request cohort tables, churn analysis, implementation KPIs, and reference calls covering multi-module customers.
    relatedQuestionRefs:
    - QV024
    - QV030
