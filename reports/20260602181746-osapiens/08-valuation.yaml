- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - current evidence
  - what would change the view
  rows:
  - - 'THESIS: customer and growth proof is real'
    - Series C materials say osapiens serves more than 2,400 customers with more than 550 professionals, while official 2025 updates cite ARR doubling and 400+ new enterprise customers in H1.
    - The view strengthens if diligence confirms that recent logo growth converts into durable ARR, not just implementation-heavy volume.
  - - 'THESIS: the product is broader than a narrow ESG reporting tool'
    - Company materials describe 25+ enterprise-grade solutions spanning compliance, sustainability, and operational efficiency on one platform.
    - The view strengthens if module attach, cross-sell, and non-rule-driven usage prove material in current ARR.
  - - 'THESIS: category demand still exists'
    - Multiple market reports still show double-digit growth in ESG and sustainability software despite rule changes.
    - The view strengthens if bookings remain strong even in segments now less directly driven by CSRD urgency.
  - - 'ANTI-THESIS: regulation is narrowing, not widening'
    - KPMG and Coolset show materially reduced scope and delayed timing after Omnibus, which can weaken urgency for some buyers.
    - The concern eases only if management shows that growth is shifting toward operational, audit, and risk use cases rather than shrinking rule-led cohorts.
  - - 'ANTI-THESIS: public comp reality is harsher than the round story'
    - SAP, Wolters Kluwer, and Nasdaq all trade in roughly a 2x-6x revenue band, not at open-ended venture multiples.
    - The concern eases if current ARR already supports the mark at a premium multiple rather than requiring heroic assumptions.
  - - 'ANTI-THESIS: the denominator is still opaque'
    - No reviewed public source disclosed current ARR dollars, gross margin, NRR, or preference terms, and GetLatka conflicts with official funding history.
    - The concern eases only when a data room closes the revenue bridge, unit economics, and common-equity terms.
  notes: The anti-thesis is mostly about denominator risk and regulatory durability, not about whether the company exists or has customer traction.
