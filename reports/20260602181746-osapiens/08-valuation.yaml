- id: thesis-antithesis-and-comparable-set
  title: Thesis, anti-thesis, and comparable set
  body: 'The positive case for osapiens is real and evidence-backed. The company is not a slideware ESG story: it has raised large rounds from recognizable investors, claims more than 2,400 customers, reported another quarter of ARR doubling in Q2 2025, and positions itself as a 25-plus-module platform spanning compliance, sustainability, and operational efficiency rather than a narrow disclosure tool. Market reports also point to continued structural demand for ESG and sustainability software. The anti-thesis is just as important. The same 2025-2026 regulatory sources show that Omnibus changes narrowed CSRD and CSDDD scope materially, which can reduce urgency for mid-market compliance spending. Public comparable data adds discipline. SAP, Wolters Kluwer, and Nasdaq—imperfect but useful software-and-information references—trade at roughly 2x to 6x revenue. Private comp data is heterogeneous: IntegrityNext screens near 3x ARR in a low-authority data vendor, Watershed still carries a $1.8
    billion private valuation, and Persefoni sits much lower. That mix supports continued interest, but not blind acceptance of the osapiens price.'
