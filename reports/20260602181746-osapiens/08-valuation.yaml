company:
  name: osapiens
chapter:
  number: 8
  title: Valuation
  summary: osapiens has enough customer scale, growth signals, and financing support to remain investable in principle, but the public record still does not defend the unicorn mark with high conviction because actual ARR, gross margin, retention, and financing terms remain undisclosed while 2026 regulatory scope and software multiples are less forgiving. Public knowledge, compliance, and data-infrastructure comparables mostly sit around roughly 2x to 6x revenue, and even a generous base case needs current ARR above about $100 million plus clean terms. The evidence therefore supports a TRACK recommendation with medium confidence, high risk, and a stretched valuation stance until diligence closes the denominator and regulatory-mix gaps.
sections:
- id: financing-context-and-public-price-support
  title: Financing context and public price support
  body: 'osapiens enters valuation with one unusually strong public fact and one unusually important omission. The strong fact is that the company announced a $100 million Series C in January 2026 and said the round pushed it above the $1 billion unicorn threshold, after a $120 million Series B in 2024 and a $27 million Series A in 2023. Independent coverage also repeated the company''s scale claims: more than 2,400 customers and more than 550 professionals globally. The omission is that none of the reviewed public sources disclosed the current ARR dollar figure, gross margin, NRR, services mix, or financing terms that would let an investor test whether the price is actually attractive rather than merely real. Official growth messaging is directionally impressive—ARR doubled year over year in Q2 2025, with more than 400 new enterprise customers in the first half—but that still leaves denominator risk at the center of the underwrite. A unicorn valuation can be reasonable for a high-growth
    software asset; it is not automatically reasonable for a new buyer without evidence on the current financial base and the true economics behind the headline mark.'
