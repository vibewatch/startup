- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - supportable ARR assumption
  - multiple logic
  - indicative value range
  - probability signal
  - main trigger
  rows:
  - - Bear
    - $70M-$90M ARR support
    - 5x-7x, closer to public-comp convergence in a tougher 2026 tape
    - $350M-$630M
    - '~25%: plausible if rule-driven demand weakens and services intensity is high'
    - Audited ARR below ~$90M, weak post-Omnibus mix, or low gross margin
  - - Base
    - $100M-$130M ARR support
    - 8x-10x for a still-fast-growing, diversified software asset
    - $800M-$1.3B
    - '~50%: most plausible if current ARR is around nine figures and growth quality holds'
    - Needs clean terms plus evidence that operational modules and cross-sell matter
  - - Bull
    - $130M-$160M ARR support
    - 10x-12x for exceptional growth plus broad platform durability
    - $1.3B-$1.92B
    - '~25%: requires premium-quality revenue with strong retention and margin'
    - Non-rule-driven demand, strong cohort behavior, and limited services drag
  - - Probability-weighted read-through
    - Midpoint equivalent support
    - Scenario midpoints weighted by stated probabilities
    - ~$1.05B midpoint
    - Current price is only roughly fair in a favorable base-to-bull mix
    - Any negative surprise on ARR or terms quickly pushes value below the disclosed mark
  notes: These scenarios are support frameworks, not management guidance; they exist to show what level of current ARR and multiple support is required to own the price.
