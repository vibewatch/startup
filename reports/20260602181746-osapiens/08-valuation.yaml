- id: recommendation-exit-readiness-and-diligence
  title: Recommendation, exit readiness, and final diligence asks
  body: 'The public-evidence recommendation is TRACK with medium confidence, high risk, and a stretched valuation stance. That may sound cautious for a company with strong growth and customer proof, but it is deliberately price-sensitive. The problem is not that osapiens lacks signs of product-market fit; the problem is that the public record still cannot show the current revenue bridge, margin structure, retention, services intensity, or financing terms that would justify paying above $1 billion with conviction. Exit readiness is similarly mixed. A sponsor-backed or strategic outcome looks more supportable than a near-term IPO because public-company-style disclosure depth is still absent. The practical implication is simple: keep diligence open, but treat a data-room failure on ARR, regulatory diversification, or preference terms as a kill event rather than a debate point. The diligence agenda should focus on the variables that actually move value—current ARR and revenue quality, mix across
    regulation-led versus operational modules, gross margin after services and implementation load, cohort retention, and the real common-equity economics behind the headline valuation.'
