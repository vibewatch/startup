- id: scenario-range-and-entry-discipline
  title: Scenario range and entry discipline
  body: 'Because the company does not disclose current ARR publicly, the scenario work has to be explicit about what is assumption and what is evidence. The evidence is that the current mark is above $1 billion, the company reported extraordinary recent growth, and public comps cluster around roughly 2x to 6x revenue. From that starting point, entry discipline becomes a support-threshold exercise. A $1 billion mark needs roughly $166.7 million of ARR at 6x, $125 million at 8x, and $100 million at 10x. If current supportable ARR is only around $70 million to $90 million, the implied value range falls to roughly $350 million to $630 million. If ARR is already $100 million to $130 million and the company deserves an 8x to 10x multiple because growth and diversification hold, the range becomes roughly $800 million to $1.3 billion. Only a bull case with ARR around $130 million to $160 million and sustained premium multiples clearly supports material upside above the unicorn mark. That is why
    the recommendation is price-sensitive: the key question is not whether osapiens is good, but how much current ARR and quality of revenue actually sit under the price today.'
