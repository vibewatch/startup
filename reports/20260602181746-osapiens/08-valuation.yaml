- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: This table covers the most decision-useful public and private references with directly reviewable valuation or revenue evidence. It is not exhaustive because most private sustainability platforms do not disclose current revenue cleanly.
  columns:
  - comparable
  - metric
  - multiple / valuation / status
  - relevance
  - limitation
  rows:
  - - osapiens (subject)
    - Latest round plus public growth signals
    - '>$1.0B valuation; no public current ARR; low-confidence data-vendor signal implies ~11.1x on $90M ARR'
    - Direct underwrite object with visible customer scale and hypergrowth claims
    - Current ARR, margin, retention, and cap-table terms remain undisclosed and vendor data conflicts with official funding history
  - - SAP
    - June 2026 market cap vs TTM revenue
    - ~5.1x revenue on $224.96B market cap and $43.72B revenue
    - Large software and enterprise-data reference for what public markets pay for scaled, disclosed platforms
    - Far larger, more diversified, and much more mature than osapiens
  - - Wolters Kluwer
    - June 2026 market cap vs 2025 revenue
    - ~2.2x revenue on $16.05B market cap and $7.19B revenue
    - Useful compliance and information-services benchmark with heavy professional-software exposure
    - Business mix and growth profile are more mature and lower-growth than osapiens
  - - Nasdaq
    - June 2026 market cap vs TTM revenue
    - ~6.0x revenue on $49.71B market cap and $8.30B revenue
    - Data, workflow, and governance infrastructure reference at the upper end of public-comp range
    - Capital-markets exposure and disclosure quality make it only a directional comp
  - - IntegrityNext
    - 2025 ARR and valuation from data vendor
    - ~3.0x implied ARR multiple on $17.5M ARR and $52.5M valuation
    - Nearest disclosed private sustainability-software multiple in retained sources
    - Low-authority vendor data and a much smaller scale than osapiens
  - - Watershed
    - Private valuation status
    - $1.8B current valuation and $185M raised
    - Shows that scaled sustainability platforms can still command premium private marks
    - Current revenue is not disclosed in retained sources, so no clean multiple is available
  - - Persefoni
    - Private round and valuation status
    - $23M 2025 Series C; PremierAlts lists $450M valuation
    - Useful down-market reference for a sustainability-software peer pursuing profitability
    - Revenue is not disclosed cleanly enough in retained sources for a like-for-like multiple
  notes: The table mixes public software-and-information references with private sustainability platforms because direct private comps with clean revenue disclosure are scarce.
