- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Original CSRD expansion
    - positive
    - 2023-2025
    - Created a very large reporting-software narrative and initial demand surge
    - Which customers bought for CSRD only versus broader workflow reasons?
  - - Omnibus scope reduction
    - negative
    - 2025-2026
    - Shrinks immediate pure-reporting buyer pool by about 90%
    - How much of current pipeline remains in scope after new thresholds?
  - - CSDDD narrowing and delay
    - negative
    - 2026-2029
    - Pushes the largest-company due-diligence deadline farther out
    - How dependent is demand on direct legal scope versus proactive risk management?
  - - EUDR and CBAM go-live
    - positive
    - '2026'
    - Keep traceability, import, and supplier-data workflows urgent
    - Which sectors convert fastest into software spend?
  - - Procurement cascade pressure
    - positive
    - current
    - Large buyers still demand supplier ESG data from out-of-scope firms
    - How many suppliers buy because customers require it?
  - - Upfront implementation cost
    - negative
    - current
    - Can delay adoption, especially for SMEs or first-time buyers
    - What ACV and deployment model reduce payback friction?
  - - Talent and data bottlenecks
    - negative
    - current
    - Data quality and internal capability limit speed of rollout
    - How much implementation service does the vendor need to bundle?
  - - Supplier capability gaps
    - negative
    - current
    - Weak sub-tier readiness reduces automation gains and slows customer ROI
    - What onboarding and engagement tooling is necessary?
  notes: 'The key analytical point is timing: omnibus compresses the reporting-only narrative, but 2026 product-traceability and import-compliance workflows keep the broader platform market alive.'
