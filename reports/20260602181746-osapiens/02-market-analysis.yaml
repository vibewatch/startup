- id: buyer-map-and-adoption-path
  title: Buyer map, budget ownership, and adoption path
  body: 'The buyer map is broader than a single “ESG team” narrative. Public implementation guidance and vendor positioning show three overlapping buyer groups: procurement and supply-chain leaders who need supplier risk visibility and traceability; sustainability and compliance teams who own policy, disclosure content, and regulatory interpretation; and finance or controllership functions that become more relevant once assurance, filing, and audit-readiness requirements move closer to the financial-reporting stack. Adoption usually starts with a trigger such as CSRD scoping, EUDR readiness, supplier pressure, or border carbon exposure. From there, buyers map suppliers and data sources, score risk, collect information, assign corrective actions, and operationalize periodic reporting or evidence generation. This is why due-diligence software can be sticky: once workflows connect procurement, suppliers, legal, and reporting teams, replacement becomes operationally painful. The largest near-term
    buyers also skew enterprise-heavy. Market data says large organisations dominate category spend, and the most relevant industries are manufacturing, energy and utilities, consumer goods, retail, and other supply-chain-intensive sectors where traceability and compliance are already board-level issues.'
  claimRefs:
  - CM013
