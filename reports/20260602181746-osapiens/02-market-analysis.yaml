chapter:
  number: 2
  title: Market Analysis
  summary: osapiens sells into a regulation-driven enterprise software market whose broad sustainability-software envelope is worth roughly $5 billion in 2026, but whose more directly comparable ESG reporting layer is closer to $1.1-$1.6 billion. The relevant buyer base is concentrated in large regulated enterprises, especially procurement-, sustainability-, and compliance-heavy organizations facing CSRD, EUDR, CBAM, LkSG, and CSDDD workflows; however, omnibus scope reductions, implementation costs, supplier-readiness gaps, and category overlap make the company’s exact SAM and SOM impossible to isolate cleanly from public data alone.
sections:
- id: market-boundary-and-sizing
  title: Market boundary and sizing lenses
  body: 'The first analytical task is to define the market before sizing it. For osapiens, the relevant category is not “all ESG spend” and not “all enterprise software.” The closest fit is enterprise software used for sustainability reporting, supply-chain due diligence, traceability, product and supplier compliance, and adjacent operational-efficiency workflows that become mandatory or economically valuable when regulation and value-chain transparency intensify. That means consulting fees, audit assurance, and generic ERP licenses sit outside the core software market, even though they influence total buyer budgets. Public market studies show why the boundary matters: a narrow ESG reporting lens yields a 2026 market of roughly $1.1-$1.6 billion, while broader sustainability or ESG software categories span roughly $4.9-$5.2 billion, and one narrow sustainability-software definition lands below $1 billion. These variances are not contradictions so much as proof that category definitions are
    still unstable. For valuation work, the best practice is to preserve multiple lenses rather than force a single false-precision TAM.'
