company:
  name: osapiens
chapter:
  number: 1
  title: Company Overview
  summary: osapiens is a Mannheim-founded ESG and supply-chain compliance software company that has scaled rapidly from a 2023 €25 million Series A to a 2026 $100 million Series C led by Decarbonization Partners, reaching unicorn status. Public materials show the osapiens HUB expanding from supply-chain transparency roots into a broader sustainable-growth platform with 25+ solutions, 2,400-2,500+ customers, and 500-550+ employees, but key financial disclosure remains sparse and some address or title disclosures are not perfectly harmonized across public surfaces.
sections:
- id: identity-and-platform
  title: Identity, legal setup, and platform scope
  body: 'osapiens presents itself as a Mannheim-founded software company focused on sustainable growth through transparency and efficiency. Across its homepage, About page, and fundraising releases, the company consistently anchors the story around the osapiens HUB, a cloud-based platform that combines regulatory-compliance workflows, supply-chain transparency, and operational-efficiency tooling in a single system. The legal spine is clear: the operating entity is osapiens Services GmbH, registered in Mannheim. The product story has widened materially since the company’s early supply-chain-transparency messaging. What began as a digital platform for trustworthy supply chains now encompasses disclosure management, due diligence, traceability, maintenance, service, and automation workflows. The company uses the same strategic framing across 2024-2026 sources: multiple enterprise-grade solutions on one AI-enabled, multi-tenant platform. That consistency matters because later chapters can treat
    osapiens less as a narrow ESG point tool and more as a control-platform vendor selling workflow consolidation around European regulation and operational performance.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  figureRefs:
  - FO002
- id: leadership-and-governance
  title: Founders, leadership, and governance concentration
  body: 'The public leadership profile remains founder-heavy. osapiens credits Alberto Zamora, Stefan Wawrzinek, and Matthias Jungblut as founders, while current pages also surface Jörg Bernauer and Daniel Schwarz in prominent operating roles. The legally disclosed managing directors are Alberto Zamora, Stefan Wawrzinek, and Matthias Jungblut, and the current About page portrays Wawrzinek as Chair of the Board. That said, the company does not provide the kind of detailed board roster, committee structure, or investor-rights disclosure that a public company or a heavily documented late-stage private company might surface. The main visible leadership change in the period covered by this report is the April 2024 appointment of Lucas Ziegler to lead finance, later reflected in his CFO title. The title stack itself is somewhat fluid: certain pages call Zamora “CEO,” while Series C materials refer to Zamora and Jungblut as co-CEOs. Taken together, the evidence suggests strong founder control,
    increasing finance professionalization, and a governance package that still requires direct diligence rather than desk-research inference.'
  claimRefs:
  - CO001
  - CO018
  - CO019
  - CO020
  - CO021
  - CO032
  tableRefs:
  - TO002
- id: funding-history-and-capital-base
  title: Funding history and capital base
  body: 'osapiens’ public capital formation is unusually clean for a late-stage European software company. The company disclosed a €25 million Series A in September 2023 led by Armira Growth, followed by a $120 million Series B in July 2024 led by Growth Equity at Goldman Sachs Alternatives, then a $100 million Series C in January 2026 led by Decarbonization Partners. That gives the market a disclosed primary-capital stack of roughly $247 million across the three rounds. The funding narrative also shows how the company’s positioning shifted upmarket: the Series A framed osapiens as an ESG software pioneer, the Series B emphasized platform uniqueness around EU regulation, and the Series C positioned it as a global sustainable-growth category leader. Independent outlets corroborate the 2026 unicorn milestone, with Tech.eu putting valuation at roughly $1.1 billion. What remains absent is almost as important as what is disclosed: there is still no public evidence of debt facilities, secondaries,
    or audited operating performance. For later valuation work, the capital history is solid, but the monetization history remains mostly private.'
  claimRefs:
  - CO011
  - CO010
  - CO007
  - CO008
  - CO009
  - CO012
  - CO034
  tableRefs:
  - TO003
- id: scale-footprint-and-customer-proof
  title: Scale, footprint, and customer proof
  body: 'The strongest public evidence for osapiens’ scale comes from the progression of company-disclosed customer and employee counts. The Series A release pointed to 1,000+ customers and 200+ employees; the 2024 Series B release moved to 1,300+ customers and 300+ employees; the July 2025 UK announcement referenced nearly 2,000 customers, 500+ employees, and 400+ new enterprise customers in the first half of 2025; and January-June 2026 materials point to 2,400-2,500+ customers and 500-550+ employees. Those are not audited metrics, but the directional consistency across multiple years is notable. Customer proof is also stronger than many private ESG vendors offer: osapiens names blue-chip enterprises including Bosch, Coca-Cola North America, Metro, Lidl, Carrefour, OTTO, BAT, Tesco, and DS Smith, while its customers and resource pages showcase extensive case studies. The office footprint also indicates broad commercial ambition, although public address disclosures are not fully harmonized
    between legal pages, marketing pages, and databases. Third-party directories broadly confirm the same core profile: private, Mannheim-based, enterprise software, and hundreds of employees.'
  claimRefs:
  - CO013
  - CO014
  - CO015
  - CO016
  - CO017
  - CO024
  - CO025
  - CO026
  - CO033
  - CO031
  tableRefs:
  - TO001
  figureRefs:
  - FO003
- id: milestones-and-open-diligence-gaps
  title: Milestones and remaining diligence gaps
  body: 'The milestone arc is straightforward: founded in 2018, publicly recognized with the German Founder Award in 2022, visibly scaling its Mannheim footprint in 2023, professionalizing finance and closing a major Series B in 2024, pushing into the UK with a large hiring commitment and hypergrowth messaging in 2025, and reaching unicorn status in early 2026. The path is coherent and well-supported by company disclosures. The open questions sit elsewhere. The company still does not disclose current revenue, ARR in hard numbers, profitability, leverage, or secondary liquidity activity in a way that supports a true cover-metric treatment. Governance disclosure also remains light for a company now valued above $1 billion. Finally, public office disclosures are directionally consistent but not exact, with multiple Mannheim addresses and varying office counts across pages. None of those gaps invalidate the core identity narrative, but they do constrain confidence in later financial and valuation
    work unless management materials close them directly.'
  claimRefs:
