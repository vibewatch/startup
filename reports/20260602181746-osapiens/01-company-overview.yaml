  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board roster, shareholder-rights summary, and any committee or observer structure.
    whyItMatters: Founder-led governance appears concentrated, but late-stage control rights can materially affect financing terms and exit pathways.
    diligencePath: Request the latest board deck, governance chart, and post-Series C shareholder agreement summary from management.
    relatedQuestionRefs:
    - QO006
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Whether osapiens has any venture debt, revolving credit, or other leverage facilities.
    whyItMatters: Leverage would affect true dilution-adjusted enterprise value, liquidity runway, and downside risk.
    diligencePath: Ask management for a debt schedule, bank covenants, and any credit-side security package.
    relatedQuestionRefs:
    - QO013
  - type: private-evidence-only
    severity: material
    topic: secondary-liquidity
    missingEvidence: Any employee, founder, or early-investor secondary sales executed alongside or between rounds.
    whyItMatters: Secondary activity can signal founder liquidity preferences, price discovery, and cap-table pressure ahead of an eventual exit.
    diligencePath: Request cap-table history and any secondary transaction summary covering 2023-2026.
    relatedQuestionRefs:
    - QO014
    relatedTableRefs:
    - TO003
  - type: conflicting-data
    severity: minor
    topic: footprint
    missingEvidence: A reconciled list of current offices and the distinction between legal registered office and operating campuses in Mannheim.
    whyItMatters: The discrepancies are not investment-breaking, but they weaken confidence in seemingly simple cover metrics such as office count and headquarters address.
    diligencePath: Confirm the current registered office, principal operating campus, and active office list in a management Q&A.
    relatedQuestionRefs:
    - QO020
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure
    missingEvidence: Current ARR, revenue, margin, burn, and profitability data tied to the 2025-2026 scale disclosures.
    whyItMatters: Without hard operating metrics, later valuation work must lean on scenario analysis instead of actual SaaS performance.
    diligencePath: Obtain management financials, audited statements if available, and KPI history through the Series B and Series C periods.
    relatedQuestionRefs:
    - QO025
