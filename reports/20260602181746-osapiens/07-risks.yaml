  title: Risk heatmap
  type: matrix
  layout: wide
  summary: Likelihood-versus-impact matrix for the main osapiens risk clusters after considering current public mitigations.
  data:
    columns:
    - Low Impact
    - Medium Impact
    - High Impact
    - Critical Impact
    rows:
    - label: High Likelihood
      values:
      - label: Thin employee-review signal
        tone: neutral
        detail: RepVue is adverse but based on only eight ratings, so it is not a standalone thesis breaker.
      - label: UK hiring execution stretch
        tone: risk
        detail: Rapid hiring and local-market build-out can pressure onboarding, sales productivity, and management bandwidth.
      - label: Implementation / configuration drag
        tone: risk
        detail: APIs, SAP links, and module configuration can delay time-to-value and inflate services load.
      - label: Regulatory-demand compression
        tone: risk
        detail: CSRD/CSDDD/LkSG changes can reduce near-term urgency in exactly the buying segments osapiens targets.
    - label: Medium Likelihood
      values:
      - label: Policy engagement too small to offset shock
        tone: neutral
        detail: Lobbying is visible but modest, so it should not be treated as a true hedge.
      - label: Product breadth vs depth trade-off
        tone: risk
        detail: The suite can win on breadth but lose to specialists in cyber-led or very deep point use cases.
      - label: Customer / revenue concentration opacity
        tone: risk
        detail: Public logo volume is large, but concentration and retention are still not disclosed.
      - label: Security-assurance visibility gap
        tone: risk
        detail: No public assurance pack was confirmed in reviewed sources, so enterprise readiness must be diligence-tested.
    - label: Low Likelihood
      values:
      - label: Minor policy-advice mismatch
        tone: neutral
        detail: Routine compliance interpretation changes are manageable inside the platform roadmap.
      - label: Localized hiring slippage
        tone: neutral
        detail: Small execution misses in one geography are unlikely to break the overall thesis by themselves.
      - label: Isolated module misfit
        tone: risk
        detail: A single specialist loss matters less if broader platform adoption remains healthy.
      - label: Major financial opacity shock
        tone: risk
        detail: The tail risk is that private economics are materially worse than the headline growth narrative implies.
