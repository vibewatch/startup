  evidenceGaps:
  - type: missing-source
    severity: material
    topic: litigation-enforcement-gap
    missingEvidence: Court, regulator, insurance, or company disclosures confirming whether osapiens or its principals have any current or historic litigation, enforcement, or indemnity events material to the platform.
    whyItMatters: A compliance platform can face outsized reputational damage if hidden disputes or regulator complaints surface after investment.
    diligencePath: Run named court and regulator searches in Germany, the UK, and major operating markets; ask management and counsel for litigation, claim, and insurance schedules.
    relatedQuestionRefs:
    - QR008
    - QR028
  - type: missing-source
    severity: blocking
    topic: security-assurance-gap
    missingEvidence: Current SOC 2 or ISO 27001 evidence, recent pen-test summary, incident log, cyber insurance details, and customer security-review outcomes.
    whyItMatters: Security assurance is a gating factor for enterprise procurement and a core thesis-break trigger for a platform handling supplier, reporting, and workflow data.
    diligencePath: Obtain the latest assurance pack under NDA, review any open remediation items, and test references with security-conscious enterprise customers.
    relatedQuestionRefs:
    - QR009
    - QR029
  - type: private-evidence-only
    severity: blocking
    topic: financial-visibility
    missingEvidence: Audited FY2025 / LTM revenue, ARR bridge, burn, cash balance, runway, gross margin, services mix, and financing terms / preferences.
    whyItMatters: Large private rounds and a unicorn label do not answer whether the business can fund growth without an adverse financing event.
    diligencePath: Request audited or board-grade financials, cash waterfall, and scenario model tying hiring and expansion plans to runway and financing needs.
    relatedQuestionRefs:
    - QR017
    - QR030
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-retention
    missingEvidence: Top-customer ARR share, top-10 ARR share, GRR, NRR, logo churn, module mix, regional revenue mix, and renewal cohorts.
    whyItMatters: The public logo set is large, but durability and concentration determine whether growth is repeatable and defensible.
    diligencePath: Review customer cohort data, account concentration schedules, and reference calls focused on expansion, renewal, and deployment quality.
    relatedQuestionRefs:
    - QR019
    - QR030
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-dependence-mix
    missingEvidence: A company-specific bridge showing what percentage of pipeline, ARR, and module adoption depends on each major regulation or jurisdiction.
    whyItMatters: Without a quantified bridge, the chapter can rank regulatory-demand risk but cannot fully size it.
    diligencePath: Ask management for pipeline and ARR cuts by module, jurisdiction, and compliance driver, then reconcile them against 2025–2026 policy changes.
    relatedQuestionRefs:
    - QR014
    - QR028
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: implementation-quality
    missingEvidence: Median deployment time, delayed go-live rate, supplier completion rate, professional-services attachment, escalation rate, and implementation-margin data.
    whyItMatters: A business that looks like scalable software in marketing can become a slower, services-heavy operating model in practice.
    diligencePath: Request module-level deployment metrics, services revenue mix, and failed / delayed implementation references, not only successful case studies.
    relatedQuestionRefs:
    - QR010
    - QR011
    - QR023
    - QR024
