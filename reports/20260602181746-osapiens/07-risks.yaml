- id: SR003
  title: Operational, quality, security, and dependency risks
  body: 'osapiens is a software platform, so the core operating risk is not factories or recalls; it is deployment quality and data fidelity. The supplier API documentation, FitGap review, CMMS pricing, and SAP migration guide all point to the same conclusion: value realization depends on customer-specific integration, supplier participation, taxonomy design, and change management. That creates a structural risk that the platform behaves like a configuration- and services-heavy system rather than a fast time-to-value SaaS product. The product breadth compounds the issue. osapiens spans sustainability reporting, supplier risk, whistleblowing, maintenance, audit, and traceability. FitGap argues that this breadth can come at the expense of specialist depth, especially for cyber-centric use cases. Code & Co''s diligence scope is reassuring in one sense because it explicitly reviewed scalability, integrations, onboarding, and support. But that diligence took place at a much smaller scale than
    the company now claims, so the operational question has shifted from product plausibility to repeatable delivery under growth.'
