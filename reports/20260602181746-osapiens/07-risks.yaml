- id: SR002
  title: Regulatory and legal risks
  body: 'Public evidence supports a real legal and regulatory risk surface, but not an invented controversy. On the one hand, osapiens benefits from EU sustainability and due-diligence rules because its product pages and customer messaging are built around them. On the other hand, those same rules are changing. CSRD scope was cut sharply, CSDDD was narrowed and delayed, and BAFA publicly softened parts of German LkSG enforcement. That combination can reduce near-term urgency for mid-market buyers even while leaving large-enterprise obligations intact. The legal layer is subtler. osapiens publishes a GDPR privacy policy, an imprint with named managing directors and registry data, and a lobby-register entry showing some policy engagement. But the public sources reviewed here do not surface substantive incident history, litigation, or security-assurance artifacts. The correct treatment is therefore a risk register plus diligence asks: verify data-processing controls, legal claims history, insurance,
    contractual allocation of reporting liability, and whether any customer has challenged output accuracy in due-diligence or disclosure workflows.'
  claimRefs:
