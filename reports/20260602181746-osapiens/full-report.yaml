      - number: '7.4'
        title: Financial, customer, and execution risks
        blocks:
          - type: paragraph
            body: >-
              Financial risk is dominated by opacity rather than visible distress. osapiens has disclosed three
              meaningful financing events in 2023, 2024, and 2026 and is still investing in headcount and UK expansion,
              but public materials stop short of audited revenue, margin, or runway disclosure. Third-party datasets do
              not resolve that opacity cleanly: GetLatka reports $90 million revenue and a $270 million valuation while
              also calling the company bootstrapped, which directly conflicts with official funding announcements.
              Customer risk is similarly about what remains undisclosed. Official pages cite 1,800 satisfied customers,
              nearly 2,000 companies, and more than 2,500 companies across different surfaces, yet none of the reviewed
              materials quantify retention, module mix, top-account concentration, or revenue by geography. Execution
              risk follows naturally. A company that has grown from the 115+ staff / 200-corporation stage described
              during Armira diligence to 500+ employees and a planned 150 UK hires can win big, but it also has to show
              that hiring, onboarding, customer success, and product governance are scaling as fast as the logo count.
