  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope in customer workflow terms
        blocks:
          - type: paragraph
            body: >-
              Public evidence suggests osapiens sells a shared workflow stack for regulated supply-chain and
              sustainability teams rather than a single app. On its official platform pages, the HUB is framed as one
              cloud-based system and single source of truth spanning transparency, disclosures and reporting, supplier
              collaboration, distribution and circularity, and maintenance. The clearest customer workflow is EUDR:
              suppliers can use a free portal or REST API to submit land plots, DDS, or batch data, and buyers can then
              reuse that data for due diligence, traceability, and reporting. Adjacent pages extend the same operating
              model into CSRD reporting, CSDDD or LkSG due diligence, product compliance and traceability, and SRM. The
              maintenance product line broadens the suite from compliance into operational execution, but it is marketed
              from a separate site, so investors should think of osapiens as a suite with shared data ambitions rather
              than a narrowly bounded SKU. Customer stories across EUDR, ESG reporting, maintenance, and tobacco
              track-and-trace reinforce that multi-module positioning.
