  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and investment implication
        blocks:
          - type: paragraph
            body: >-
              The highest residual risk for osapiens is regulatory-demand compression. Public 2025–2026 materials from
              the European Commission, KPMG, QIMA, Harvard/Skadden, and ClimatePartner all describe a market where CSRD
              and CSDDD obligations survive, but apply later and to fewer companies than originally expected. That
              matters because osapiens still markets named modules for EUDR, CSRD, and CSDDD, and its own hypergrowth
              release explicitly says recent performance came despite regulatory uncertainty. The second risk cluster is
              execution-through-complexity: supplier APIs, SAP-linked maintenance migrations, configurable
              questionnaires, and multi-module rollouts all depend on customer data quality and services capacity. Third
              is financial opacity: the company has raised large rounds and continues hiring, but public materials do
              not disclose audited revenue, burn, gross margin, or runway. The underwriting implication is conditional
              rather than binary: diligence must prove that osapiens can convert compliance-led entry points into
              broader operating spend before policy urgency fades.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR008
              - CR018
