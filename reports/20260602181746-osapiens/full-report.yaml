            body: >-
              osapiens’ public customer evidence points to a business selling primarily into enterprise and regulated
              mid-market buyers rather than self-serve SMB adoption. The recurring buyer archetypes are sustainability
              leaders, compliance teams, procurement or supplier-risk owners, reporting teams, and in some modules
              operational leaders such as maintenance managers. Public use-case proof clusters around EUDR and broader
              supply-chain due diligence, but the surface extends into disclosure management, carbon accounting, audit
              workflows, maintenance, and distribution. The best-segmented named references are large European groups
              such as hagebau, Puratos, Coca-Cola HBC, JELD-WEN Europe, Westwing, Motor Oil Group, and NKG. That breadth
