            body: >-
              The public growth narrative is strong on momentum and weak on efficiency. osapiens said Q2 2025 ARR once
              again doubled year on year, that it had delivered 42 consecutive months of triple-digit year-on-year
              growth, and that it added more than 400 new enterprise customers in the first half of 2025 alone. The same
              release said a significant portion of ARR was already coming from non-German-speaking markets, while the
              UK expansion release added a €35 million local investment plan and more than 150 jobs. Those signals point
              to a business still funding market capture, geography expansion, and category leadership rather than
              maximizing short-term operating leverage. GTM also appears segmented. Core compliance and transparency
