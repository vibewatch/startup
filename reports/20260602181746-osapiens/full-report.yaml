  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and competitor classes
        blocks:
          - type: paragraph
            body: >-
              The market does not reduce to one clean peer set. Direct procurement- and due-diligence-focused rivals
              include IntegrityNext, Prewave, and Sourcemap, all of which publicly emphasize supplier risk, multi-tier
              visibility, or traceability. A second cluster comes from reporting- and carbon-led platforms such as
              Watershed, Persefoni, and Workiva, which compete when buyers start from disclosure, assurance, or
              carbon-management workflows and then expand outward. A third cluster is the incumbent or broad-suite
              response: SAP, Sphera, and Cority can sell overlapping sustainability functionality from inside larger
              ERP, risk, EHS, or advisory relationships. Adjacent substitutes matter too. EcoVadis is not a
              like-for-like workflow replacement in the reviewed sources, but it can solve enough of the supplier-rating
              job to divert budget. Greenly and Coolset show how narrower tools can win with packaging clarity or faster
              deployment. Finally, the status quo remains spreadsheets, inboxes, consultant-built trackers, and ERP
              bolt-ons, which still represent the “do nothing integrated” alternative for smaller or earlier-stage
              buyers.
