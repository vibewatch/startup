companyProfile:
  summary: >-
    osapiens is a Mannheim-based enterprise software company building the osapiens HUB, a platform that combines
    sustainability reporting, supply-chain due diligence, traceability, compliance, and operational-efficiency
    workflows. Since 2023 it has raised three major disclosed rounds, reached unicorn status in January 2026, and built
    public customer proof across regulated industrial, retail, and consumer-goods workflows. The company looks
    strategically relevant in Europe’s compliance stack, but still discloses far less than a public-company-style
    late-stage SaaS underwrite would ideally require.
