  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: A mark above $1B becomes easier to defend only as current ARR support moves clearly into nine figures.
    data:
      items:
        - label: ARR needed at 4x
          value: 250
          note: Lower public-comp outcome
        - label: ARR needed at 6x
          value: 166.7
          note: Upper public-comp range
        - label: ARR needed at 8x
          value: 125
          note: Premium software case
        - label: ARR needed at 10x
          value: 100
          note: High-growth private case
        - label: ARR needed at 12x
          value: 83.3
          note: Very bullish premium case
        - label: Low-confidence vendor ARR anchor
          value: 90
          note: GetLatka figure used only as a sensitivity check
    approximationNotes: >-
      Thresholds are simple valuation divided by ARR bridges against a $1B mark; they are not DCF outputs and the $90M
      anchor is explicitly low confidence.
    claimRefs:
      - CV021
      - CV023
      - CV024
      - CV034
      - CV035
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Scenario-based support ranges show that the disclosed mark is only roughly fair if osapiens already has base-case
      or better current ARR support.
    data:
      items:
        - label: Bear case
          low: 350
          mid: 490
          high: 630
          note: $70M-$90M ARR support at 5x-7x
        - label: Base case
          low: 800
          mid: 1050
          high: 1300
          note: $100M-$130M ARR support at 8x-10x
        - label: Bull case
          low: 1300
          mid: 1610
          high: 1920
          note: $130M-$160M ARR support at 10x-12x
    approximationNotes: >-
      Ranges are evidence-constrained but still assumption-heavy because the reviewed public record does not disclose
      current ARR, margin, or retention.
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
      - CV043
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      osapiens scores well on growth, customer proof, and product breadth, but weakly on regulatory durability,
      economics visibility, and immediate price support.
    data:
      items:
        - label: Market demand
          value: 4
          note: End-market growth remains positive across most retained analyst sources
        - label: Growth proof
          value: 4.5
          note: Official sources report ARR doubling and 42 straight months above 100% YoY growth
        - label: Customer proof
          value: 4.5
          note: Series C coverage points to >2,400 customers and 550+ professionals
        - label: Product breadth
          value: 4
          note: 25+ enterprise-grade solutions create real platform optionality
        - label: Regulatory durability
          value: 2.5
          note: Omnibus changes make rule-led demand less durable than headline growth alone suggests
        - label: Economics visibility
          value: 1.5
          note: Current ARR, margin, NRR, services mix, and terms remain opaque publicly
        - label: Valuation support
          value: 2.5
          note: Public comps and scenario thresholds do not yet make the unicorn mark look clearly attractive
        - label: Exit readiness
          value: 2.5
          note: Strategic or sponsor exit looks more plausible than a near-term IPO
    approximationNotes: >-
      Scores are directional IC aids rather than a mechanical model; low scores here mostly reflect disclosure gaps and
      market context, not disbelief in the product.
    claimRefs:
      - CV003
      - CV005
      - CV016
      - CV019
      - CV025
      - CV039
      - CV042
      - CV044
      - CV047
