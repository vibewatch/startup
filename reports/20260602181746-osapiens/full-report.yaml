      - number: '3.4'
        title: Moat durability and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence points to a durable market need but a less durable product moat. Verdantix explicitly
              says vendors are rethinking differentiation as regulation gets noisier and buyer demand shifts from pure
              reporting toward actionable insight, supplier engagement, and AI. That weakens a simple “we cover the
              regulation” pitch for everyone in the category. Competitor-authored sources from Coolset and KEY ESG add
              an additional negative lens: they argue that osapiens can be too heavy for smaller teams, too dependent on
              enterprise process maturity, or not the cleanest fit for reporting-led organizations that care most about
              governance and carbon-accounting structure. Those claims are self-interested and should not be treated as
              independent truth, but they do highlight a credible competitive fault line. The likely durable
              differentiators are data-network density, workflow embedding, trust and compliance execution, and
              ecosystem access. The likely non-durable differentiators are generic AI language, generic audit-readiness
              claims, and check-box regulatory coverage that multiple direct peers and incumbents now market in
