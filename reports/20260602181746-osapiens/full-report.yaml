      - number: '1.3'
        title: Funding history and capital base
        blocks:
          - type: paragraph
            body: >-
              osapiens’ public capital formation is unusually clean for a late-stage European software company. The
              company disclosed a €25 million Series A in September 2023 led by Armira Growth, followed by a $120
              million Series B in July 2024 led by Growth Equity at Goldman Sachs Alternatives, then a $100 million
              Series C in January 2026 led by Decarbonization Partners. That gives the market a disclosed
              primary-capital stack of roughly $247 million across the three rounds. The funding narrative also shows
              how the company’s positioning shifted upmarket: the Series A framed osapiens as an ESG software pioneer,
              the Series B emphasized platform uniqueness around EU regulation, and the Series C positioned it as a
              global sustainable-growth category leader. Independent outlets corroborate the 2026 unicorn milestone,
              with Tech.eu putting valuation at roughly $1.1 billion. What remains absent is almost as important as what
              is disclosed: there is still no public evidence of debt facilities, secondaries, or audited operating
              performance. For later valuation work, the capital history is solid, but the monetization history remains
              mostly private.
