        blocks:
          - type: paragraph
            body: >-
              The public leadership profile remains founder-heavy. osapiens credits Alberto Zamora, Stefan Wawrzinek,
              and Matthias Jungblut as founders, while current pages also surface Jörg Bernauer and Daniel Schwarz in
              prominent operating roles. The legally disclosed managing directors are Alberto Zamora, Stefan Wawrzinek,
              and Matthias Jungblut, and the current About page portrays Wawrzinek as Chair of the Board. That said, the
              company does not provide the kind of detailed board roster, committee structure, or investor-rights
              disclosure that a public company or a heavily documented late-stage private company might surface. The
              main visible leadership change in the period covered by this report is the April 2024 appointment of Lucas
              Ziegler to lead finance, later reflected in his CFO title. The title stack itself is somewhat fluid:
              certain pages call Zamora “CEO,” while Series C materials refer to Zamora and Jungblut as co-CEOs. Taken
              together, the evidence suggests strong founder control, increasing finance professionalization, and a
              governance package that still requires direct diligence rather than desk-research inference.
