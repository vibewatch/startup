  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing lenses
        blocks:
          - type: paragraph
            body: >-
              The first analytical task is to define the market before sizing it. For osapiens, the relevant category is
              not “all ESG spend” and not “all enterprise software.” The closest fit is enterprise software used for
              sustainability reporting, supply-chain due diligence, traceability, product and supplier compliance, and
              adjacent operational-efficiency workflows that become mandatory or economically valuable when regulation
              and value-chain transparency intensify. That means consulting fees, audit assurance, and generic ERP
              licenses sit outside the core software market, even though they influence total buyer budgets. Public
              market studies show why the boundary matters: a narrow ESG reporting lens yields a 2026 market of roughly
              $1.1-$1.6 billion, while broader sustainability or ESG software categories span roughly $4.9-$5.2 billion,
              and one narrow sustainability-software definition lands below $1 billion. These variances are not
              contradictions so much as proof that category definitions are still unstable. For valuation work, the best
              practice is to preserve multiple lenses rather than force a single false-precision TAM.
