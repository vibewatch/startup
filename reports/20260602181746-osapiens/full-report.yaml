      - number: '3.2'
        title: Capability, pricing, and GTM comparison
        blocks:
          - type: paragraph
            body: >-
              Public product surfaces suggest osapiens sits closest to the intersection of reporting, traceability, and
              supply-chain due diligence rather than the center of any single point category. IntegrityNext, Prewave,
              and Sourcemap look deeper on procurement- and supply-chain-specific workflows; Watershed and Persefoni
              look stronger on carbon and reporting narratives; Workiva and SAP look stronger on finance-stack or
              ERP-native distribution. That makes capability comparison a matrix problem, not a leaderboard problem. The
              public pricing picture is also revealing. Greenly and Coolset expose modular packaging structures, even if
              they still require contact for final commercial terms. Workiva and Sourcemap push buyers into demo or
              consultation flows, while most enterprise platforms disclose little or no list pricing at all. The
              consequence is that competitive evaluation likely happens through solution fit, existing systems, and
              implementation speed more than transparent list-price shopping. Trust posture is similarly converged:
              audit trails, automation, AI, and regulatory coverage now appear across most serious vendors, which limits
              how much any one player can claim them as a unique moat.
