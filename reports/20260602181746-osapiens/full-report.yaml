      - number: '4.3'
        title: Cost structure, gross-margin drivers, and working-capital visibility
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a software model with meaningful delivery overhead. osapiens repeatedly
              describes the HUB as a cloud-based, multi-tenant platform, while the maintenance enterprise package adds
              ERP and SAP integrations, customization, dedicated customer success, training, and support. The
              maintenance site also highlights deployment scope across dozens of sites and thousands of assets, which
              implies real onboarding, services, and support labor even if the core software is highly repeatable.
              Because osapiens does not publish audited financial statements or accounting notes, the cleanest public
              benchmark is comparable enterprise workflow SaaS. ServiceNow’s 2026 10-K is instructive: subscriptions are
              recognized ratably, annual advance billing is common, professional services are recognized as delivered,
              subscription cost of revenue is driven by hosting, support, cloud, and regulated-market requirements, and
              professional-services cost includes personnel and partner delivery. That does not prove osapiens has the
              same exact economics, but it does define the right diligence frame. The likely financial shape is
              attractive recurring software economics partially offset by implementation, partner, and support burden.
              The actual gross-margin bridge, deferred-revenue profile, and working-capital behavior remain unavailable
              publicly.
