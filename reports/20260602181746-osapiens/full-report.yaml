  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Current mitigation evidence
      - Monitor
      - Kill threshold / event
      - Investment implication
    rows:
      - - Regulatory-demand compression
        - Broader efficiency / audit / risk modules and non-German market expansion
        - Share of new ARR tied to non-rule-led modules; rule-driven pipeline exposure
        - >-
          If diligence cannot show a credible path for non-rule-led expansion or rule-sensitive pipeline remains
          dominant
        - Treat as thesis break or require materially lower entry price
      - - Security and privacy assurance gap
        - Privacy policy and centralized platform controls are public, but external assurance is not
        - SOC 2 / ISO 27001, pen-test cadence, incident log, customer security approvals
        - No current assurance package, unresolved major findings, or unreported material incident history
        - Pause investment until cleared
      - - Implementation drag
        - APIs, SAP connector, customer-success layers, and one-platform data model
        - Median deployment time, delayed go-live rate, services mix, supplier completion rates
        - If >20% of large deployments slip materially or payback depends on heavy services forever
        - Underwrite as services-heavy business or walk away
      - - Financial opacity and runway uncertainty
        - Strong investor roster and recent funding history
        - Audited ARR / revenue bridge, burn, cash, runway, covenant or preference stack
        - If runway is short without a clean financing path or economics depend on a down round
        - Re-rate to financing-risk case or stop
      - - Customer concentration and retention opacity
        - Large public customer set and cross-sell narrative
        - Top-10 ARR share, logo concentration, GRR, NRR, module-level expansion
        - If top-customer dependence or weak retention undermines durability
        - Price for concentration risk or reject
      - - Execution scaling
        - 500+ employee base, active hiring, UK investment, shared platform
        - Leadership bench depth, management spans, quota-ramp success, support backlog
        - If management depth lags growth or UK / international build-out misses plan materially
        - Cut conviction and revise growth assumptions
    notes: >-
      Kill criteria are intentionally monitorable and diligence-linked so unresolved public gaps do not get hand-waved
      into generic risk language.
