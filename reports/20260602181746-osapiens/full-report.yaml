        title: Exhibits
        blocks:
          - type: callout
            title: The market is narrower than generic ESG hype, but still structurally attractive
            body: >-
              Public evidence supports a practical market that is smaller than the broadest sustainability-software
              headlines but still large, fast-growing, and increasingly mandatory for large enterprises. The best signal
              is not the broad TAM headline alone but the combination of high enterprise mix, strong reporting growth,
              and even faster growth in supply-chain sustainability modules.
            calloutType: strength
            claimRefs:
              - CM003
              - CM007
              - CM010
              - CM012
              - CM013
          - type: callout
            title: Omnibus changes compress pure-reporting demand and raise sizing uncertainty
            body: >-
              The biggest market headwind is not technology rejection but regulatory narrowing. CSRD-only demand fell
              materially after omnibus changes, and public evidence still cannot isolate exactly how much software spend
              remains in scope for a vendor like osapiens without mixing reporting, due diligence, and traceability
              workflows.
            calloutType: risk
            claimRefs:
              - CM016
              - CM017
              - CM035
              - CM036
          - type: callout
            title: Platforms win when they connect reporting, procurement, and supplier workflows
            body: >-
              The procurement-heavy due-diligence market and the finance-heavy reporting market are converging around
              shared data, assurance, and traceability needs. Vendors that can bridge both worlds should have more
              durable demand than vendors tied to a single regulation or one disclosure template.
