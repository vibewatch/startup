chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, legal setup, and platform scope
        blocks:
          - type: paragraph
            body: >-
              osapiens presents itself as a Mannheim-founded software company focused on sustainable growth through
              transparency and efficiency. Across its homepage, About page, and fundraising releases, the company
              consistently anchors the story around the osapiens HUB, a cloud-based platform that combines
              regulatory-compliance workflows, supply-chain transparency, and operational-efficiency tooling in a single
              system. The legal spine is clear: the operating entity is osapiens Services GmbH, registered in Mannheim.
              The product story has widened materially since the company’s early supply-chain-transparency messaging.
              What began as a digital platform for trustworthy supply chains now encompasses disclosure management, due
              diligence, traceability, maintenance, service, and automation workflows. The company uses the same
              strategic framing across 2024-2026 sources: multiple enterprise-grade solutions on one AI-enabled,
              multi-tenant platform. That consistency matters because later chapters can treat osapiens less as a narrow
              ESG point tool and more as a control-platform vendor selling workflow consolidation around European
              regulation and operational performance.
