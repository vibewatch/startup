      - number: '7.5'
        title: Mitigations, monitoring indicators, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              There is a credible mitigation story, but it needs proof. osapiens increasingly presents itself as a
              platform for efficiency, risk management, audit workflows, and supplier operations rather than as a pure
              ESG reporting vendor. That positioning matters because investor, customer, and insurer pressure can
              persist even when reporting scope narrows. Still, not every mitigation is equally strong. Hiring and UK
              expansion show ambition, not necessarily durable unit economics. Lobbying activity shows awareness, not
              policy control. The actionable monitors are therefore practical and measurable: security assurance,
              time-to-value, concentration, audited cash runway, and evidence that non-rule-driven modules are
              expanding. The investment committee should treat those as kill criteria rather than nice-to-have diligence
              items. If management cannot verify enterprise-grade assurance, acceptable deployment slippage, healthy
              retention, and a path to growth that does not depend on ever-broader regulation, then the downside case is
              not a minor de-rating; it is a thesis failure on durability.
