      - number: '2.4'
        title: Constraints, contradictory estimates, and practical SAM
        blocks:
          - type: paragraph
            body: >-
              The main adoption constraints are not hypothetical. Market research flags enterprise deployments that can
              exceed $1 million, shortages of skilled sustainability data analysts, data-sovereignty headaches, and
              supplier-readiness gaps. Sedex and BCG both emphasize that the hardest work often sits beyond tier one,
              which raises onboarding cost and slows time to value. Omnibus changes also created buyer confusion:
              companies need to re-scope, reassess timelines, and decide whether to keep investing. But public evidence
              suggests many do continue investing because suppliers still need to satisfy customers, lenders, and
              insurers even if direct legal scope softens. That dynamic creates a narrower but still durable SAM for
              osapiens. The most practical public approximation is the intersection of large-enterprise ESG reporting
              spend and the fastest-growing supply-chain sustainability and due-diligence workflows. What public
              evidence does not support is a clean SOM. There is no robust way to isolate the number of logos or
              software dollars realistically available to osapiens without internal pipeline, ACV, or win-rate data.
            claimRefs:
              - CM028
              - CM029
              - CM030
              - CM027
              - CM026
              - CM031
              - CM032
              - CM035
              - CM036
              - CM037
