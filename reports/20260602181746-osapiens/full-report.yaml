      - number: '2.3'
        title: Regulatory drivers and timing
        blocks:
          - type: paragraph
            body: >-
              Regulation is still the single strongest catalyst for the category, but the timing is no longer uniform.
              The original CSRD promised a huge reporting expansion from fewer than 12,000 companies under NFRD to
              nearly 50,000 under the first design. That story changed materially after the omnibus package. The revised
              threshold now focuses CSRD on very large companies, materially shrinking the immediate pure-reporting
              buyer pool. Yet the market did not disappear because other rules kept moving. CSDDD still pushes due
              diligence into 2029 for the largest companies. LkSG is already active in Germany. CBAM entered its
              definitive regime on 1 January 2026, forcing importers above threshold to operationalize declarant and
              emissions workflows. EUDR still requires deforestation-free proof and due diligence for in-scope product
              flows. In practice, that means buyers often rationalize a multiregulation software budget rather than a
              CSRD-only spend line. The addressable market therefore compresses at the top of the funnel for pure
              reporting vendors, but remains more resilient for platforms that combine reporting with procurement,
              traceability, and risk management.
            claimRefs:
              - CM015
              - CM016
              - CM017
              - CM018
              - CM019
              - CM020
              - CM021
              - CM033
