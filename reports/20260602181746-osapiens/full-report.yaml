  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and public price support
        blocks:
          - type: paragraph
            body: >-
              osapiens enters valuation with one unusually strong public fact and one unusually important omission. The
              strong fact is that the company announced a $100 million Series C in January 2026 and said the round
              pushed it above the $1 billion unicorn threshold, after a $120 million Series B in 2024 and a $27 million
              Series A in 2023. Independent coverage also repeated the company's scale claims: more than 2,400 customers
              and more than 550 professionals globally. The omission is that none of the reviewed public sources
              disclosed the current ARR dollar figure, gross margin, NRR, services mix, or financing terms that would
              let an investor test whether the price is actually attractive rather than merely real. Official growth
              messaging is directionally impressive—ARR doubled year over year in Q2 2025, with more than 400 new
              enterprise customers in the first half—but that still leaves denominator risk at the center of the
              underwrite. A unicorn valuation can be reasonable for a high-growth software asset; it is not
              automatically reasonable for a new buyer without evidence on the current financial base and the true
              economics behind the headline mark.
            claimRefs:
              - CV001
              - CV002
