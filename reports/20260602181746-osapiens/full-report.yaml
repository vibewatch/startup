      - number: '3.3'
        title: Switching costs, multi-homing, and distribution power
        blocks:
          - type: paragraph
            body: >-
              The strongest lock-in is unlikely to come from one regulation checklist. It comes when a platform becomes
              the operational system of record for supplier onboarding, evidence storage, audit trails, and recurring
              submissions into workflows such as TRACES or CSRD reporting. Under that condition, the replacement problem
              is not just software substitution but process re-plumbing across procurement, compliance, sustainability,
              finance, and suppliers themselves. Even so, multi-homing remains plausible because budgets and buying
              centers differ. A finance-led team can keep Workiva, a procurement team can add IntegrityNext or EcoVadis,
              and a climate team can still use Watershed or Greenly. Distribution power therefore matters as much as
              feature breadth. SAP, Workiva, Sphera, and Cority can enter through existing ERP, reporting, risk, or
              advisory budgets, while osapiens appears strongest where enterprise buyers want one broader compliance
              platform rather than several narrow tools. The open question is how much of osapiens’ enterprise fit truly
