            body: >-
              Trust and quality evidence is mixed. On the positive side, osapiens publishes a GDPR-based privacy notice,
              names a data protection officer, and documents supplier workflows in unusually concrete detail for a
              private software company. The EUDR page also claims EU-server hosting, legal-expert co-development, and
              ISO 9001, ISO 27001, and SOC 2 Type II credentials. Those signals matter for enterprise procurement, but
              they are still mostly marketing-level evidence in the reviewed public set. No public certificate numbers,
              scope statements, audit bridge letters, or product-level security whitepapers were found. Likewise, public
              performance claims such as 99%+ reliability, 80% less time on reporting, 17 minutes saved per work order,
              and 8% less downtime were not backed by accessible SLA documents, incident history, or reproducible
              methodology. Public roadmap visibility is also weak: the supplier portal help center is maintained, but
              the reviewed surfaces do not expose a forward-dated release calendar for core modules. Finally, some of
              the most relevant surfaces are gated by customer credentials or login, which limits outside diligence on
              support quality, community artifacts, and real API operability. That leaves the main product-tech risk as
