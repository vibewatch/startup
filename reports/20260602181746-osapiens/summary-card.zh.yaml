  topStrengths:
    - 多模块平台覆盖报告、尽调、可追溯性和运营工作流，不是狭窄的 ESG 单点工具
    - 公开客户证据和方向性规模指标较强，包括 2,400-2,500+ 客户和 500-550+ 员工
    - Armira Growth、Goldman Sachs Alternatives 和 Decarbonization Partners 构成可信投资人基础
