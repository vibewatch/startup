  topRisks:
    - 当前 ARR、毛利率、留存和融资条款仍未披露，估值争议的核心仍是分母风险
    - 2025-2026 年 omnibus 变更缩窄了部分直接 CSRD 和 CSDDD 需求叙事
    - 实施和供应商数据复杂度可能拖慢部署，并抬高服务强度
    - 与现有厂商和相邻 ESG / 合规平台重叠，会挤压定价和差异化
    - 客户集中度、续约深度和普通股经济性没有公开可见
  unresolvedGaps:
