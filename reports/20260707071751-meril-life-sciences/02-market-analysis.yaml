  rows:
  - - Coronary intervention
    - Drug-eluting stents, bioresorbable scaffolds, balloon catheters, PCI accessories
    - Other PCI stent systems and non-device revascularization alternatives
    - Interventional cardiology programs, cath-lab procurement, hospital reimbursement logic
    - Publicly sized Indian implant market with direct price-cap exposure
  - - Structural heart / TAVR
    - Transcatheter heart valves, delivery systems, heart-team procedure ecosystem
    - Open surgical valve replacement and incumbent TAVR platforms
    - Heart teams, tertiary cardiac centers, hospital capital and procedure economics
    - High-value but specialized market with heavy incumbent trust advantages
  - - Orthopedic implants
    - Hip, knee, revision, trauma, spine implants and related instruments
    - Conventional implant competitors and non-robotic arthroplasty workflows
    - Orthopedic service lines, implant committees, hospital procurement
    - Different buyer logic from cardiology; some implant categories face price regulation
  - - Surgical robotics / endo-surgery
    - MISSO, HandX, robotic or assisted-surgery platforms and integration
    - Conventional laparoscopy, manual instrumentation, incumbent robotic systems
    - Hospital capital committees, surgeon champions, OR leadership
    - Capital intensity, training, and utilization determine adoption speed
  - - Diagnostics automation
    - Biochemistry analyzers, central-lab automation, hospital and home-testing workflows
    - Manual or semi-automated diagnostics workflows and incumbent analyzers
    - Central labs, hospitals, diagnostic chains, sometimes home-testing distributors
    - Different OPEX-led buying motion; less tied to implant reimbursement
  - - Excluded broad medtech spend
    - Imaging, pharma, generic consumables, unrelated devices not evidenced in Meril's retained source set
    - N/A
    - Broader healthcare budgets
    - Useful for macro context but not serviceable Meril TAM without further narrowing
  notes: The table defines Meril as a multi-segment device company. “Included spend” follows Meril's public product scope, while substitutes and excluded spend prevent an overstated all-medtech TAM narrative.
