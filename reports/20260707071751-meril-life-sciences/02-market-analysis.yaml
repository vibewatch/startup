- id: drivers-and-constraints
  title: Growth drivers and adoption constraints
  body: |-
    The strongest growth drivers are policy-supported domestic manufacturing, rising cardiovascular disease burden, broader hospital automation needs, and continued adoption of minimally invasive therapy. India's medtech policy stack — National Medical Devices Policy, PLI, medical-device parks, and 100% FDI — favors scaled local manufacturers. For Meril specifically, that helps on supply positioning and localization credibility. In structural heart, TAVR adoption is supported by aging populations, lower-risk approvals, and hospital preference for shorter-stay minimally invasive care. In robotics and diagnostics, the demand story is about precision, throughput, surgeon dexterity, and lower manual error rates.

    The brakes are equally clear. Official Indian pricing controls apply directly to coronary stents and knee implants, capping Meril-adjacent categories and limiting pure ASP expansion. The Department of Pharmaceuticals also describes many device segments as capital intensive, long-gestation, and training heavy, which raises sales friction in robots and specialized implant programs. TAVR faces high procedure cost, regulatory complexity, workforce constraints, and durable incumbent ecosystems. Myval also carries an adverse European overhang: the November 2024 UPC injunction summarized by EP Law restricted Meril's transcatheter heart valves in 16 UPC member countries, with only narrow XL carve-outs, and the appeal registry shows the dispute remained active in April 2025. Taken together, Meril's market opportunity is real, but adoption speed depends on regulatory credibility, price-discipline resilience, and the ability to convert clinical differentiation into trust inside conservative hospital buying systems.
