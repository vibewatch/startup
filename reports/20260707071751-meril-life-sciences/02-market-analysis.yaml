callouts:
- calloutType: insight
  title: The right TAM for Meril is a portfolio of submarkets, not the full medtech headline
  body: India's medical devices market is a useful backdrop, but Meril's actual opportunity is much narrower and more specialized. The most evidenced slices in this chapter are cardiovascular implants and structural heart, while orthopedics, robotics, and diagnostics still require more segment-specific public sizing before they can be rolled into a precise SAM.
  claimRefs:
  - CM006
  - CM007
  - CM018
  - CM038
  - CM039
  - CM045
- calloutType: risk
  title: Price caps and litigation are the two non-obvious monetization brakes
  body: Meril can operate in growing markets and still under-earn them. Stent and knee-implant price controls cap pricing upside in two adjacent categories, while the Myval patent dispute shows that even clinical differentiation may not translate into unconstrained market access when trust, licensing, and legal barriers tighten.
  claimRefs:
  - CM011
  - CM012
  - CM037
  - CM040
  - CM041
  - CM042
