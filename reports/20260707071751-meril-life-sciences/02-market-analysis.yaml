- id: buyer-user-payer
  title: Buyer, user, payer, and adoption path
  body: |-
    Meril's portfolio sells into hospitals, but not through a single buying motion. Coronary stents are used by interventional cardiologists, yet hospital cath labs, procurement teams, and reimbursement realities shape the economic decision. Future Market Insights places hospitals at 61.3% of India coronary stent end-user share, which is consistent with bulk procurement and standardized pathway control. TAVR is an even narrower buyer motion: both Medtronic and Edwards frame therapy selection around a heart team, specialized center infrastructure, follow-up protocols, and risk-based clinical appropriateness. That means Meril's structural-heart sales depend less on broad awareness and more on winning highly credentialed hospital programs.

    Outside cardiology, the economic buyer changes again. Orthopedic implants and robotic knee systems sit with orthopedic service lines and capital committees that care about implant alignment, recovery, and revision risk. Surgical robotics requires physician champions, training pathways, and capital justification tied to utilization. Diagnostics automation addresses central labs, hospitals, and home-testing contexts, with budget cases built around throughput, error reduction, and workflow automation rather than around per-procedure reimbursement. Across all segments, the patient is a downstream beneficiary and sometimes a demand signal, but the paying institution or payer framework — hospital capital budget, procedure reimbursement, tender pricing, or lab OPEX — remains the actual gatekeeper. That makes adoption path design and buyer education as important as product technology.
