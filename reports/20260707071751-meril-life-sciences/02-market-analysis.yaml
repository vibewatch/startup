- id: tam-sam-som
  title: TAM, SAM, and SOM using multiple public lenses
  body: |-
    The broadest public TAM lens is India medical devices: IBEF places the market at roughly US$15.2 billion in 2025 and projects about US$50 billion by 2030, while the Department of Pharmaceuticals separately describes India as a top-20 global market growing around 15% annually. That lens is useful for context and policy support, but it is too broad for Meril because it includes categories such as imaging, consumables, and many diagnostics segments where Meril either does not compete directly or where the retained source set does not show public share data. A narrower public lens comes from Meril's cardiovascular franchises. For India coronary stents, Future Market Insights estimates a US$0.9 billion market in 2025, whereas Coherent Market Insights estimates US$1.67 billion for the same year. That 1.9x spread is too large to treat as noise, so the prudent reading is that the market exists and is material, but publisher methodology materially changes the headline.

    Structural heart adds a second lens. A published Vantage outlook places global TAVR at US$6.8 billion in 2024, growing to US$14.06 billion by 2035, with North America accounting for 42% of revenue in 2024. That lens is relevant because Myval sits in a specialized, incumbent-heavy heart-team market rather than in a generic implant pool. But it still does not solve portfolio SAM or SOM, because Meril does not publicly disclose segment revenue, installed base, geography- specific procedure counts, or ASPs across stents, valves, orthopedics, robots, and diagnostics. The public evidence therefore supports a multi-lens market map — broad India medtech TAM, narrower cardiovascular submarket lenses, and a still-private company-specific SOM — rather than a single “correct” number.
