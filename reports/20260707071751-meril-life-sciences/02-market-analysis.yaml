- id: TM004
  title: Growth drivers and constraints
  columns:
  - Factor
  - Type
  - Segment exposure
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - India medtech policy support (NMDP, PLI, parks, 100% FDI)
    - Driver
    - Portfolio-wide
    - Current and multi-year
    - Supports domestic manufacturing scale and localization narrative
    - What share of Meril capacity and sourcing benefits directly from these schemes?
  - - Import dependence in India
    - Driver
    - Portfolio-wide
    - Current
    - Creates whitespace for domestic producers with regulatory credibility
    - How much of Meril's mix substitutes imports in regulated categories?
  - - Rising CVD burden and minimally invasive cardiac care adoption
    - Driver
    - Coronary + TAVR
    - Current and multi-year
    - Expands procedural demand for stents and structural-heart therapies
    - What share of Meril growth is procedure-growth vs share-gain?
  - - Hospital automation and lab throughput demand
    - Driver
    - Diagnostics
    - Current
    - Supports analyzer and workflow-automation adoption
    - Which customer archetypes drive Meril diagnostics sell-through?
  - - Precision and recovery narrative in robotic or assisted surgery
    - Driver
    - Orthopedics + surgical robotics
    - Current and multi-year
    - Supports capital cases built on outcomes and surgeon productivity
    - How often does Meril win when robotics is evaluated against manual workflows?
  - - Coronary stent and knee implant price controls
    - Constraint
    - Vascular + orthopedics
    - Current
    - Limit premium pricing and force margin discipline
    - What are realized ASPs and tender discounts after price regulation?
  - - Capital intensity and long training cycles
    - Constraint
    - Robotics + specialized implants
    - Current
    - Lengthen sales cycles and delay utilization ramp
    - What is time-to-productivity after installation by segment?
  - - Incumbent trust and switching costs
    - Constraint
    - TAVR + robots + implants
    - Current
    - Makes hospital adoption conservative and reference-based
    - What proof changes behavior in centers already standardized on incumbents?
  - - Clinical evidence and durability scrutiny
    - Constraint
    - TAVR + advanced implants
    - Current and multi-year
    - Requires continuous evidence generation to support adoption
    - Which peer-reviewed endpoints matter most for Meril's next share gains?
  - - European patent litigation overhang on Myval
    - Constraint
    - TAVR
    - Recent / unresolved
    - Can restrict market access and weaken trust in some geographies
    - What is the current post-appeal selling status by UPC country?
  notes: The same factor can help demand while slowing monetization. Meril benefits from policy support and rising clinical demand, but regulated pricing, training friction, and litigation can still compress realized market capture.
