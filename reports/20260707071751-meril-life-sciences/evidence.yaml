evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: leadership-disclosure
    missingEvidence: >-
      A single official current Meril group leadership or board roster that reconciles promoter, parent-company, and
      subsidiary-level executives.
    whyItMatters: >-
      Governance and key-person assessment is materially weaker when leadership must be reconstructed from filing
      aggregators and product-line communications.
    diligencePath: >-
      Request the latest board pack, organisation chart, and statutory registers for Micro Life Sciences, Meril Life
      Sciences Pvt Ltd, and the main operating subsidiaries.
    relatedQuestionRefs:
      - QO011
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: capital-raised
    missingEvidence: >-
      A reconciled cap table and round history showing exact primary versus secondary proceeds, investor names, and
      ownership percentages across the 2022-2025 period.
    whyItMatters: >-
      Without a reconciled cap table, public sources can establish valuation markers and named rounds but not a clean
      lifetime total raised figure.
    diligencePath: >-
      Obtain the latest cap table, shareholder register, and board materials for the Warburg and ADIA transactions, then
      reconcile them against ICRA/CARE funding references.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: minor
    topic: customer-count
    missingEvidence: A product-line installed-base or customer-count disclosure for hospitals, physicians, or systems in use.
    whyItMatters: >-
      Customer-count is a standard cover metric, but Meril’s public sources focus on countries and subsidiaries instead
      of named customer totals.
    diligencePath: >-
      Ask management for installed systems, hospital accounts, and recurring customer cohorts by therapy area and
      geography.
    relatedQuestionRefs:
      - QO022
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: A fully evidenced founder roster and unified public governance list for the full Meril group.
    whyItMatters: >-
      The leadership table is partial because the public evidence set does not expose every promoter, director, and
      executive in one place.
    diligencePath: Reconcile MCA records with an official leadership page or management presentation supplied by the company.
    relatedQuestionRefs:
      - QO006
      - QO008
      - QO009
      - QO011
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      A current post-ADIA ownership schedule plus lender list, board observer rights, and litigation reserve
      disclosures.
    whyItMatters: >-
      The stakeholder map is intentionally partial because public sources identify the major parties but do not provide
      a full ownership or creditor schedule.
    diligencePath: Request shareholder register, debt schedule, and material-contract summary in diligence.
    relatedQuestionRefs:
      - QO013
      - QO014
      - QO015
      - QO017
      - QO018
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table-TO004
    missingEvidence: A fully exhaustive all-events chronology for every Meril legal entity, product line, financing, and jurisdiction.
    whyItMatters: >-
      The milestone table is intentionally curated to the most material public company-overview events rather than every
      subsidiary-level announcement.
    diligencePath: >-
      Request the internal historical milestone tracker, cap table chronology, and product launch archive to validate
      whether any material public events are missing.
    relatedQuestionRefs:
      - QO012
      - QO023
      - QO024
      - QO026
      - QO027
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: india-coronary-stents
    missingEvidence: >-
      A reconciled methodology for India coronary stent market size and forecast, ideally with consistent year
      definitions and segment scope.
    whyItMatters: >-
      The retained publishers disagree too sharply for the number to be used as a precise input into Meril's market
      model.
    diligencePath: >-
      Obtain the underlying analyst methodology or triangulate with hospital procurement or PCI procedure datasets
      before using one estimate in valuation work.
    relatedQuestionRefs:
      - QM009
      - QM010
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: portfolio-sam-som
    missingEvidence: >-
      Meril segment revenue, installed base, procedure volumes, ASPs, and geography split across stents, valves,
      orthopedics, robots, and diagnostics.
    whyItMatters: >-
      Without company-level mix data, public TAM lenses cannot be converted into a defendable SAM or SOM for
      underwriting or valuation.
    diligencePath: >-
      Request management disclosures, investor materials, distributor sell-through, or tender data segmented by product
      family and geography.
    relatedQuestionRefs:
      - QM016
      - QM027
  - type: missing-source
    severity: material
    topic: litigation-risk
    missingEvidence: >-
      A current primary-source update on the post-appeal commercial status of Myval in UPC territories after the April
      2025 registry entry.
    whyItMatters: >-
      European structural-heart access and trust could be materially affected if the injunction or licensing
      restrictions remain active.
    diligencePath: >-
      Review the latest UPC orders, any licensing announcements, and Meril or Edwards commercial communications by
      country.
    relatedQuestionRefs:
      - QM026
  - type: missing-source
    severity: minor
    topic: orthopedics-diagnostics-sizing
    missingEvidence: >-
      Public market-size sources aligned to Meril's orthopedics, robotics, and diagnostics footprint with clear India or
      export scope.
    whyItMatters: The portfolio story is incomplete without segment-specific size and growth lenses outside cardiovascular devices.
    diligencePath: >-
      Add segment-specific orthopedic implant, surgical robotics, and diagnostics market reports or trade-association
      datasets in a later refresh.
    relatedQuestionRefs:
      - QM028
  - type: private-evidence-only
    severity: material
    topic: pricing-constraints
    missingEvidence: >-
