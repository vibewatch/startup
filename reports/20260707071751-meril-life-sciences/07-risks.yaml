  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: litigation-exposure-breakout
    missingEvidence: Product- and geography-level revenue, gross margin, and backlog exposure for Myval SKUs affected by European
      sale restrictions or injunctions.
    whyItMatters: Without a quantified earnings bridge, the true cash-flow severity of the Edwards dispute cannot be underwritten
      even though legal costs and restrictions are already visible.
    diligencePath: Request internal revenue, gross-profit, and order-book data by Myval SKU and country, plus scenario analysis
      for reopened versus restricted jurisdictions.
    relatedQuestionRefs:
    - QR003
    - QR008
    - QR032
  - type: private-evidence-only
    severity: material
    topic: debt-and-shareholder-terms
    missingEvidence: Detailed loan covenants, security package, ADIA shareholder-rights terms, and contemplated IPO lock-up
      / governance mechanics.
    whyItMatters: Balance-sheet flexibility and exit timing depend on terms that are not visible in public sources, especially
      if litigation or cash conversion worsens.
    diligencePath: Request debt agreements, covenant model, cap table, shareholders agreement summaries, and IPO preparedness
      workstreams directly from management.
    relatedQuestionRefs:
    - QR013
    - QR014
    - QR015
    - QR027
    - QR032
  - type: missing-source
    severity: material
    topic: misso-commercialization-metrics
    missingEvidence: MISSO installed base, paid utilization, service response times, disposable or recurring margin profile,
      and CE / U.S. regulatory roadmap updates.
    whyItMatters: Robotics could either become valuable diversification or a management-distraction cash sink; public launch
      articles do not resolve which path is unfolding.
    diligencePath: Request robot placements, utilization per site, ASP / gross margin, field-service coverage model, and current
      CE/U.S. submission milestones.
    relatedQuestionRefs:
    - QR024
    - QR025
    - QR028
    - QR032
  - type: missing-source
    severity: minor
    topic: global-adverse-event-visibility
    missingEvidence: A consolidated recall, field-safety, or adverse-event log for Myval across India, Europe, and other export
      markets.
    whyItMatters: Published literature contains at least one severe edge-case event, but public surveillance visibility outside
      the U.S. is too thin to conclude residual safety risk is low.
    diligencePath: Request post-market surveillance summaries, complaint and recall history by region, and regulator correspondence
      for Myval and related delivery systems.
    relatedQuestionRefs:
    - QR021
    - QR022
    - QR032
  - type: missing-source
    severity: minor
    topic: headcount-and-function-reconciliation
    missingEvidence: A reconciled employee and function count by legal entity and major operating function.
    whyItMatters: Public sources vary sharply on headcount and footprint, making it hard to judge whether Meril has scaled
      regulatory, service, and quality capacity proportionally.
    diligencePath: Request current organization chart, headcount by function and geography, and hiring plan for QA, RA, clinical,
      field service, and software.
    relatedQuestionRefs:
    - QR017
    - QR018
    - QR028
