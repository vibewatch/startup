callouts:
- calloutType: risk
  title: Commercial Restriction Is Already Visible on Meril's Own Site
  body: The Edwards dispute is not just a legal footnote. Meril's homepage currently says Myval systems are unavailable for
    sale across a wide set of European countries and are not approved for sale in the U.S. That means the market-access impact
    is already reflected in outward-facing product availability, not just in hypothetical downside scenarios.
  claimRefs:
  - CR005
  - CR009
  - CR042
- calloutType: risk
  title: Fast Growth Does Not Eliminate Balance-Sheet Strain
  body: Meril is growing quickly, but ICRA still highlights working-capital intensity above 50% of operating income, rising
    debt, and another large year of capex. Growth is therefore cash hungry, and litigation plus restricted pricing flexibility
    can magnify that burden even if revenue momentum stays healthy.
  claimRefs:
  - CR029
  - CR032
  - CR033
  - CR034
  - CR036
- calloutType: insight
  title: Disclosure Inconsistency Itself Is a Diligence Signal
  body: Retained sources disagree materially on employee count, country coverage, and the visible perimeter of Meril's legal
    entities. That does not prove a control problem, but it does mean management should be asked to reconcile group-scope
    definitions, product-level exposure, and segment economics before an investor treats scale claims as fully comparable
    across materials.
  claimRefs:
  - CR039
  - CR040
  - CR041
  - CR045
