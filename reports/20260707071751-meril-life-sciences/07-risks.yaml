- id: mitigations-monitors-and-thesis-breakers
  title: Mitigations, Monitors & Thesis-Break Triggers
  body: 'Meril does have mitigants: diversified therapy areas, favorable rulings in some jurisdictions, product liability
    insurance, a positive ICRA outlook, anchor investors, and an increasingly global clinical evidence program. But the residual
    exposure remains high enough that underwriting should be conditioned on monitorable triggers. The most important thesis-break
    events are not abstract: broader enforcement of the Edwards dispute, failure to reopen restricted Myval markets, rising
    litigation spend without settlement clarity, worsening working-capital intensity, debt-funded capex outrunning cash conversion,
    or a robotics rollout that consumes management attention without creating a meaningful installed base. The diligence agenda
    should therefore focus less on headline growth and more on the hard transmission paths from legal outcomes, pricing caps,
    and execution slippage into revenue mix, liquidity, and IPO timing. If management cannot quantify these paths with internal
    data, residual exposure should be treated as high even if surface-level growth remains attractive.'
  claimRefs:
  - CR006
