- id: TR005
  title: Mitigation and Kill Criteria Table
  columns:
  - Risk
  - Monitorable Trigger
  - Threshold / Event
  - Action Implication
  rows:
  - - European Myval litigation
    - Commercial restriction footprint
    - No meaningful reopening of restricted Myval markets or new adverse injunction event through 2026
    - Re-cut Europe growth case and treat Myval upside as impaired
  - - Litigation cost and settlement exposure
    - Legal cash burn
    - Annual litigation expense remains near FY2025 pace without clearer path to resolution
    - Stress cash conversion and valuation multiple
  - - Working-capital strain
    - NWC/OI and inventory
    - Working-capital intensity rises above FY2025 level or inventory days stop improving
    - Tighten downside case and require cash waterfall by segment
  - - Capex and leverage
    - Capacity ramp versus debt draw
    - New facilities slip while debt and repayment obligations continue rising
    - Reduce confidence in EBITDA-to-cash conversion and IPO readiness
  - - Robotics commercialization
    - Installed-base and approvals progress
    - MISSO remains subscale or lacks CE/U.S. regulatory progress while support costs rise
    - Treat robotics as option value only, not core thesis support
  - - IPO / financing window
    - Transaction and listing timetable
    - CCI, shareholder-rights, or public-offer preparation slips beyond the 12-18 month framing
    - Re-rate exit timing assumptions and increase financing dependency score
  notes: These triggers are intentionally operational and monitorable; each maps to a concrete transmission path into revenue,
