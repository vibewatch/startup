  claims:
  - id: CR001
    statement: ADIA's July 2025 agreement invests $200 million for an approximately 3% stake in Micro Life Sciences and values
      Meril at roughly $6.6 billion, with the transaction explicitly subject to Competition Commission of India approval.
    type: observed
    topic: transaction-regulatory-risk
    sourceRefs:
    - SR011
    - SR012
    - SR014
    confidence: high
    freshness: current
  - id: CR002
    statement: Warburg Pincus agreed in 2022 to invest about $210 million for a minority stake in Micro Life Sciences at a
      roughly $2 billion valuation, and that transaction also awaited CCI approval.
    type: observed
    topic: transaction-regulatory-risk
    sourceRefs:
    - SR016
    - SR013
    confidence: high
    freshness: historical
  - id: CR003
    statement: ICRA explicitly says Micro's credit profile is constrained by ongoing patent infringement litigation against
      Meril Life Sciences Private Limited, the group entity that handles the cardiovascular segment.
    type: observed
    topic: litigation-risk
    sourceRefs:
    - SR010
    confidence: medium
    freshness: current
  - id: CR004
    statement: ICRA says the group had already incurred cumulative legal costs of about Rs. 500-550 crore as of March 31,
      2025, including Rs. 106 crore in FY2025, and expects similar annual litigation costs going forward.
    type: observed
    topic: litigation-risk
    sourceRefs:
    - SR010
    confidence: medium
    freshness: current
  - id: CR005
    statement: The UPC Court of Appeal's 25 November 2025 decision confirmed validity of EP 3 646 825 as upheld by the Paris
      Central Division and largely upheld the injunction granted against Meril in the infringement action.
    type: observed
    topic: litigation-risk
    sourceRefs:
    - SR001
    - SR004
    confidence: high
    freshness: current
  - id: CR006
    statement: The Court of Appeal order on suspensive effect records that Meril had already carried out the recall, destruction,
      information, and interim-damages orders from the Munich Local Division before seeking relief, and the application for
      suspensive effect was dismissed.
    type: observed
    topic: litigation-risk
    sourceRefs:
    - SR002
    confidence: medium
    freshness: current
  - id: CR007
    statement: The Munich Local Division order described in the April 2025 appeal order covered Myval Octacor and Navigator-type
      systems and prohibited offering, using, importing, or storing them for those purposes across 16 UPC contracting states.
    type: observed
    topic: litigation-risk
    sourceRefs:
    - SR002
    confidence: medium
