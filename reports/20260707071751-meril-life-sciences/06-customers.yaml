  - id: named-customer-proof
    title: "Named customer proof: production versus pilot, outcomes, and freshness"
    body: >-
      Named customer proof is mixed across Meril's portfolio. In structural heart, the strongest evidence is not a
      glossy logo wall but named hospitals and centers embedded in published trials and registries. The first-in-human
      MyVal-1 program ran across 14 Indian sites, the extended program reached more than 30 Indian sites, and the
      University Medical Centre Ljubljana registry recorded 97 Myval implants between 2017 and 2023. Meril's clinical
      program index also points to named regional programs such as Serbia's first systematic TAVI program and a Myval
      European study targeting about 15 sites. These are production or late-clinical-use signals because they involve
      enrolled patients, follow-up protocols, and outcome reporting rather than only product launch pages.

      Robotics evidence is fresher and easier to name, but it is thinner. Pluto Hospital in Himmatnagar publicly
      launched MISSO as the city's first AI-based robotic joint-replacement system and reported a patient walking
      pain-free within three days of surgery; Dr. Keval Patel described the platform as improving outcomes and
      recovery, which is a clear production-use signal. Digital Health News adds another layer of physician proof via
      Sarvodaya Hospital's robotic joint-replacement leader, who endorsed MISSO's economics and surgeon usability, but
      that story does not confirm a named installed base the way Pluto does.

      HandX sits somewhere in between. Human Xtensions' site documents concrete procedures—Roux-en-Y gastric bypass,
      TAPP hernia repair, total laparoscopic hysterectomy, and eTEP surgery—and frames the user as surgeons and OR
      teams seeking robotic articulation with a small footprint and regular trocars. What is missing across MISSO,
      HandX, and Cuvis is a comprehensive public customer ledger with account counts, repeat purchases, and fresh named
      hospital references. Meril therefore has enough proof to show real use, but not enough to show broad commercial
      penetration outside structural heart.
    claimRefs:
      - CU021
      - CU022
