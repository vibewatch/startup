  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-metrics
      missingEvidence: "NRR, GRR, churn, renewal rates, and product-level active account cohorts for Myval, MISSO, HandX, and diagnostics."
      whyItMatters: "Without commercial cohort data, Meril's published clinical durability cannot be translated into revenue durability or customer stickiness."
      diligencePath: "Request installed-base and renewal cohorts by product family, plus reorder behavior for disposables and service contracts."
      relatedQuestionRefs: [QU016]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-ledger
      missingEvidence: "A full named customer list by product, geography, site type, deployment date, and production status."
      whyItMatters: "Meril has enough named proof to show real use, but not enough to quantify concentration, segment weighting, or how representative the named sites are."
      diligencePath: "Build an account ledger from Meril's CRM or distributor records and reconcile it with published studies and named hospital references."
      relatedQuestionRefs: [QU014, QU017, QU025]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: direct-vs-channel-split
      missingEvidence: "Revenue and account mix split between direct subsidiaries, distributors, and channel partners by region and product line."
      whyItMatters: "Channel-heavy growth can look broad on paper while hiding fragile partner concentration or weak direct service control."
      diligencePath: "Request top-partner concentration, regional distribution agreements, and direct/channel revenue disclosure."
      relatedQuestionRefs: [QU004, QU020, QU025]
    - type: missing-source
      severity: material
      topic: robotics-contract-model
      missingEvidence: "Pricing, maintenance, service-level terms, and repeat-purchase model for MISSO and HandX."
      whyItMatters: "Robotics adoption quality depends on whether accounts reorder, expand, and stay supported economically after the first procedure or installation."
      diligencePath: "Review sample commercial agreements, consumables pricing, service SLAs, and year-2 site utilization for MISSO and HandX."
      relatedQuestionRefs: [QU026]
    - type: access-blocked
      severity: minor
      topic: product-page-detail-loss
      missingEvidence: "Full public product-page details for several Meril product URLs that rendered as country-restricted shells in this run."
      whyItMatters: "Geoblocked product pages reduce the amount of directly reviewable official evidence on buyer messaging and feature positioning."
      diligencePath: "Re-fetch the blocked URLs from an allowed geography or request Meril's current product collateral directly."
