callouts:
  - calloutType: strength
    title: Myval has unusually deep public customer proof for a private medtech company
    body: >-
      Meril's strongest customer evidence is not a raw customer count but a multinational clinical-adoption trail:
      14 Indian first-in-human sites, more than 30 Indian extension sites, 31 LANDMARK centers in 16 countries,
      named registries in Slovenia and Serbia, and a 246-entry Myval publication library. That level of public proof
      is materially stronger than the thin, logo-led customer evidence typical of many private device makers.
    claimRefs:
      - CU012
      - CU013
      - CU014
      - CU017
      - CU018
      - CU024

  - calloutType: risk
    title: Public customer breadth does not equal unrestricted commercial access
    body: >-
      Meril can point to broad physician and site adoption for Myval, but that does not mean the commercial runway is
      unconstrained. The UPC injunction, appeal activity, and Myval's own country-exclusion notice show that some of
      the most valuable European markets remain restricted, and the US remains unavailable. This is the clearest
      publicly documented customer-expansion risk in the chapter.
    claimRefs:
      - CU031
      - CU038
      - CU039

  - calloutType: insight
    title: Robotics evidence is promising but still one layer short of investable durability proof
    body: >-
      MISSO and HandX have credible surgeon and workflow narratives, and Pluto Hospital provides real production-use
      proof. But Meril has not yet published the install-base, repeat-procedure, or reorder metrics needed to show
      that these products are moving from early curiosity to durable commercial franchises. For robotics, the next
      diligence step is less about product capability and more about account-cohort behavior.
    claimRefs:
      - CU021
      - CU022
      - CU026
      - CU027
      - CU035
      - CU036

