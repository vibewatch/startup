  - id: durability-expansion-and-concentration
    title: Retention proxies, expansion levers, concentration, and adverse constraints
    body: >-
      Meril's public reporting does not expose the core commercial durability metrics an investor would want. There is
      no NRR, GRR, churn, renewal-rate, product-level install-base, or top-customer disclosure on the corporate pages
      reviewed for this chapter. The best public durability proxies are clinical rather than commercial: LANDMARK
      includes quality-of-life endpoints and ten-year follow-up, Myval's early studies show one-year and two-year
      survival curves that are comparable with established competitors, and MISSO's year-one retrospective emphasizes
      surgeon feedback, training, and service investment. Those facts suggest Meril is trying to support repeat use,
      but they do not prove account retention or unit economics.

      Expansion vectors are clearer than retention. Myval continues to build physician acceptance through multicenter
      trials and registries; MISSO is explicitly marketed as a lower-cost way to bring robotic knee replacement into
      smaller Indian hospitals; HandX markets multiple business models, no maintenance, and minimal OR footprint for
      cost-sensitive surgery programs; and diagnostics spans central labs, hospitals, and home testing. Meril Academy
      appears in several geographies and helps explain how the company tries to convert physician training into product
      adoption.

      The main downside is that Meril's commercial reach can be bottlenecked by indirect channels and by legal access.
      Meril Europe's own site claims 2,600-plus channel partners, implying partner dependence is significant, while the
      Myval site now says the valve systems are unavailable for sale in a long list of European countries and are not
      approved for sale in the US. The 2024 UPC injunction and subsequent 2025 appeal activity make that restriction
      concrete rather than hypothetical. Meril thus looks capable of generating broad clinical interest, but the public
      record still leaves open whether the company can translate that interest into durable, unrestricted, repeatable
      commercial adoption across every product family.
    claimRefs:
