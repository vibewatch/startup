  - id: adoption-trajectory
    title: Adoption trajectory, clinical scale, and deployment breadth
    body: >-
      Meril's strongest adoption evidence comes from Myval rather than from its newer robotics products. The 2022
      review article on Myval said more than 1,800 patients worldwide had already been treated and described a
      first-in-human program across 14 Indian clinical sites, later extended to more than 30 Indian sites. By 2025,
      the LANDMARK randomized controlled trial had enrolled 768 patients across 31 centers in 16 countries, and the
      2026 EuroPCR follow-up reported comparable two-year efficacy and survival versus contemporary TAVI valves. That
      sequence matters because it shows Meril moving from domestic proof-of-use into multicenter, multinational,
      ongoing clinical follow-up rather than relying on single-site promotional anecdotes.

      Meril's own evidence infrastructure is also large by medtech startup standards. The clinical-publications page
      lists 494 total publications, including 407 cardiovascular papers and 246 Myval-specific entries. The clinical
      programs page names a long pipeline of ongoing registries and trials: the German Myval Series Registry, Myval
      China, MyPORTuVal, Myval Global Study, Myval European Study, Serbia's first systematic TAVI program, Argentina
      registries, and multiple India-focused studies. Even where those entries do not identify every hospital, they do
      show that Meril's customer adoption in structural heart is not confined to one country or a small number of KOL
      centers.

      The robotics adoption story is earlier-stage and more qualitative. MISSO launched in June 2024, and Meril's own
      one-year retrospective thanks surgeons who brought the system into their OTs while promising more software,
      service, and AI tools. That is directionally positive, but unlike Myval it does not come with a disclosed install
      base or procedure count. So Meril's adoption trajectory is asymmetric: cardiovascular has visible multinational
      procedural depth, whereas robotics has early named production proof and physician advocacy but much weaker scale
      disclosure.
