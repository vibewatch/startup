  topStrengths:
    - >-
      Real operating scale: ICRA disclosed FY2025 consolidated revenue of Rs. 4,902.9 crore and a 26.4% operating
      margin, unusual transparency for a private medtech company.
    - >-
      Broad product and geographic footprint: official materials claim 150+ countries served, 35+ subsidiaries, and
      multiple therapy areas rather than a single-product bet.
    - >-
      Institutional validation: Warburg Pincus (2022) and ADIA (2025) both invested, giving Meril more credible external
      sponsorship than most private Indian device makers.
    - >-
      Clinical optionality in structural heart: Myval has randomized-trial evidence and broad clinical-program activity
      that support premium-category ambition beyond commodity implants.
  topRisks:
    - >-
      The Edwards/Myval patent dispute in Europe is already constraining market access and has reportedly consumed
      roughly Rs. 500-550 crore of cumulative legal cost.
    - >-
      The July 2025 ADIA mark implies roughly 11.6x FY2025 revenue, richer than most diversified medtech peers despite
      materially weaker public disclosure quality.
    - >-
      Working-capital intensity, debt, and capex remain heavy: FY2025 NWC/OI was 53.8%, total debt reached Rs. 2,592.5
      crore, and FY2026 capex is still planned at Rs. 500-600 crore.
    - >-
      Public underwriting gaps remain material: no public cap-table waterfall, customer concentration, realised pricing,
      burn, or segment gross-margin disclosure.
  unresolvedGaps:
    - Full cap table, CCPS / preference waterfall, and ADIA shareholder-rights terms.
    - >-
      Revenue, gross profit, and backlog exposure for Myval products and geographies affected by litigation
      restrictions.
    - >-
      Customer concentration, distributor economics, realised ASPs, and revenue-recognition policy by major product
      line.
    - Monthly burn, runway, and FY2026-FY2027 cash-flow bridge after current capex and working-capital demands.
    - Installed-base, service-economics, and recurring-revenue profile for the robotics business.
