  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing-opacity
    missingEvidence: Confirmed list pricing, hospital realized pricing, service-contract terms, and per-procedure
      economics for Meril, Intuitive, Stryker, and TAVR competitors.
    whyItMatters: Public materials strongly signal pricing posture but do not support hard pricing comparisons,
      making cost leadership and bundling claims directionally useful rather than underwriteable.
    diligencePath: Collect distributor quotes, hospital procurement documents, or customer references
      that disclose capital, consumable, and service pricing by platform.
    relatedQuestionRefs:
    - QP018
    - QP026
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: diagnostics-competition
    missingEvidence: Named direct diagnostic rivals, market-share data, and product-level comparisons
      for Meril diagnostics across central-lab, hospital, and home-testing segments.
    whyItMatters: Diagnostics is part of Meril's public portfolio, but the current public source set is
      insufficient to distinguish whether it is strategically material or simply adjacent breadth.
    diligencePath: Fetch diagnostic product-line competitor pages, public tender results, and market reports
      for immunoassay, PoC, and home-testing categories relevant to Meril.
    relatedQuestionRefs:
    - QP024
  - type: stale
    severity: material
    topic: robotics-commercial-readiness
    missingEvidence: Current installed-base counts, live customer sites, and country-by-country approval
      status for MISSO and HandX, plus clearer country availability for Myval variants.
    whyItMatters: Meril's moat durability depends on converting disclosed products into deployed systems
      and approved geographies; sparse current-readiness data makes incumbent-comparison harsher by default.
    diligencePath: Request Meril commercial materials, recent congress presentations, regulatory listings,
      and distributor catalogs that show active sales footprints and installed-base evidence.
    relatedQuestionRefs:
    - QP020
    - QP026
