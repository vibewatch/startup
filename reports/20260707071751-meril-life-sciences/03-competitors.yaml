- id: TP004
  title: Moat Durability / Competitive Risk Register
  columns:
  - Meril moat claim
  - Competitive threat
  - Severity
  - Evidence base
  - Mitigation / diligence ask
  rows:
  - - Portfolio breadth and manufacturing offset specialist rivals
    - Category specialists still hold deeper clinical, installed-base, or regulatory moats inside their
      core segments
    - High
    - Meril portfolio breadth versus public-company incumbent depth
    - Get segment-level revenue and account-penetration data to prove breadth converts into account control
  - - Myval can challenge TAVR incumbents on clinical credibility
    - Country-availability limits and incumbent service depth can still block share gains
    - High
    - Myval availability limits, Myval-vs-Evolut study, incumbent TAVR product pages
    - Confirm active approvals and commercial footprints by country and hospital segment
  - - MISSO gives Meril an orthopedic-robot growth option
    - Mako already spans four procedure families and 47 countries; Zimmer remains a known incumbent rival
    - High
    - MassDevice MISSO article plus Stryker Mako page
    - Obtain customer-site, installed-base, and procedure-volume evidence for MISSO
  - - HandX adds soft-tissue robotic adjacency
    - Intuitive da Vinci already spans major laparoscopic specialties with stronger disclosed breadth
    - Medium
    - HandX title page and Intuitive da Vinci indications
    - Verify HandX commercial status, installed sites, and supported indications by geography
  - - Diagnostics expands Meril's platform story
    - Sparse direct-rival evidence makes diagnostics easy to over-credit in a portfolio narrative
    - Medium
    - Meril diagnostics page with limited rival mapping
    - Map direct diagnostic competitors before assigning strategic weight or moat value
  notes: Severity ratings reflect competitive durability risk to Meril rather than short-term revenue
    impact. The evidence base is strongest in TAVR and robotics and weakest in diagnostics, which is why
    mitigation asks are most specific where public evidence is currently thin.
