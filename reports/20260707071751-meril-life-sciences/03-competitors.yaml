callouts:
- calloutType: strength
  title: Portfolio Breadth Gives Meril More Account-Entry Angles Than a Single-Product Startup
  body: Meril can approach hospitals through vascular devices, implants, robotics, and diagnostics rather
    than relying on one wedge product. That breadth can support cross-selling and distribution efficiency
    even when Meril is not the category leader in any single battleground.
  claimRefs:
  - CP004
  - CP044
- calloutType: risk
  title: Incumbent Lock-In Is Strongest Where Buyers Cannot Multi-Home Easily
  body: The biggest competitive danger is not price competition in stents; it is incumbent control in
    TAVR and robotics, where follow-up workflows, training, capital equipment, and installed-base habits
    make replacement slower and more expensive.
  claimRefs:
  - CP045
  - CP046
  - CP047
- calloutType: insight
  title: Meril's Public Moat Is Stronger in Manufacturing Breadth Than in Visible Installed Base
  body: Current public evidence supports Meril's cross-category manufacturing and distribution claims
    more strongly than it supports live installed-base scale for MISSO, HandX, or broad diagnostics leadership.
    That gap matters because incumbents win by showing deployment, service, and outcomes, not just product
    scope.
  claimRefs:
  - CP044
  - CP052
  - CP053
