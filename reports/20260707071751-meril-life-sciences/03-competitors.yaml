- id: pricing-lock-in-and-distribution-power
  title: Pricing Posture, Lock-In, Multi-Homing, and Distribution Power
  body: The public record supports a directional, not numeric, pricing conclusion. Meril's integrated
    manufacturing footprint and broad device portfolio imply a value-oriented posture, especially in emerging
    or price-sensitive accounts, but public materials do not disclose realized pricing in any way that
    would let an investor underwrite exact price leadership. That opacity matters because switching costs
    vary sharply by category. Coronary stents can usually be multi-homed more easily inside cath labs,
    letting hospitals carry several SKUs at once. TAVR and robotics are harder. Medtronic's patient follow-up
    workflow, valve-card process, and broader procedural infrastructure illustrate how device choice extends
    beyond the implant itself. Robotics adds capital equipment, training, workflow redesign, and service
    obligations, which makes installed-base incumbents stickier. Meril does have real distribution reach
    and the ability to bundle across categories, but the larger public-company competitors still enjoy
    deeper disclosure, financing access, and account-control leverage in the categories where lock-in
    matters most.
  claimRefs:
  - CP011
  - CP017
  - CP039
  - CP043
  - CP044
