- id: TP003
  title: Pricing / Packaging Comparison
  columns:
  - Company / Platform
  - Public pricing posture
  - Commercial / package signal
  - What is included in public evidence
  - Implication for switching or buyer leverage
  rows:
  - - Meril portfolio
    - Value-oriented posture implied, exact realized pricing undisclosed
    - Portfolio bundle potential across devices and implants
    - Integrated manufacturing, broad categories, but no confirmed realized price sheets
    - Could help in price-sensitive accounts, but opaque pricing limits underwriteable advantage
  - - Medtronic TAVR
    - Premium implant pathway; list pricing not public here
    - Procedure plus formal follow-up, valve card, and patient-registration workflow
    - Four valve sizes, self-expanding architecture, care pathway detail
    - Support stack raises replacement friction beyond the implant itself
  - - Abbott / Edwards TAVR incumbents
    - Premium structural-heart positioning; public list prices not retained
    - Portfolio breadth and label depth matter more than price in the retained evidence
    - Navitor design differentiation and Sapien label breadth are public; exact pricing is not
    - Meril must win on availability, physician confidence, or economics not disclosed here
  - - Boston Scientific / SMT coronary stents
    - More SKU-like and easier to multi-home; exact realized pricing still undisclosed
    - Product-led device competition rather than capital-platform lock-in
    - Stent names and handling claims are public
    - Buyers can hold several DES options at once, limiting any one vendor's lock-in
  - - Stryker Mako 4
    - Premium capital-equipment posture implied
    - Procedure-family expansion, CT planning, and haptic stack sell as a platform
    - Orthopedic breadth and 47-country footprint are public; exact price is not
    - Installed platform breadth raises switching cost and reduces room for late challenger discounts
  - - Intuitive da Vinci
    - Premium installed-base posture implied
    - Multiple platforms across major soft-tissue specialties
    - Broad indications and pioneer positioning are public; exact price is not
    - Training and installed-base effects likely dominate pure price competition
  notes: This table intentionally compares pricing posture rather than unsupported list prices. Public
    sources were strong enough to infer premium versus value positioning, but not strong enough to model
    realized customer economics.
