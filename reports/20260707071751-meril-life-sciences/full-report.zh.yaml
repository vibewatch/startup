      - number: '6.2'
        title: 采用轨迹、临床规模与部署广度
        blocks:
          - type: paragraph
            body: >-
              Meril 最强的采用证据来自 Myval，而不是更新的机器人产品。2022 年 Myval 综述文章称，全球已有 1,800+ 名患者接受治疗，并描述了覆盖 14 个印度临床点的 first-in-human
              项目，后续扩展到 30+ 个印度点。到 2025 年，LANDMARK 随机对照试验已在 16 个国家的 31 个中心纳入 768 名患者；2026 年 EuroPCR 随访则报告，两年疗效和生存率与当代
              TAVI 瓣膜相当。这个序列很重要，因为它显示 Meril 已从本土使用证明，推进到多中心、跨国、持续临床随访，而不是依赖单点促销案例。


              以 medtech 初创公司的标准看，Meril 自身证据基础设施也很大。临床发表页面列出 494 篇总发表，其中包括 407 篇心血管论文和 246 条 Myval
              专项条目。临床项目页面点名一长串进行中的注册研究和试验：German Myval Series Registry、Myval China、MyPORTuVal、Myval Global Study、Myval
              European Study、Serbia 首个系统性 TAVI 项目、Argentina registries，以及多个聚焦印度的研究。即便这些条目没有逐一识别所有医院，也说明 Meril
              在结构性心脏领域的客户采用并未局限于单一国家或少数 KOL 中心。


              机器人采用故事更早期，也更偏定性。MISSO 于 2024 年 6 月发布；Meril 自己的一周年回顾感谢把系统引入手术室的外科医生，并承诺更多软件、服务和 AI 工具。这是正向信号，但不像 Myval
              那样披露装机基础或手术量。因此 Meril 的采用轨迹是不对称的：心血管有可见的跨国手术深度，机器人则有早期具名生产使用证明和医生背书，但规模披露弱得多。
