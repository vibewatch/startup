            body: 来源集合支持发起人控制，也识别出几位具名高管和董事，但无法产出一份清晰、官方、当前的集团名单。对一家 Meril 这种规模和估值的公司来说，这个披露缺口值得注意，应与股权结构审查一起在尽调中补上。
            calloutType: risk
