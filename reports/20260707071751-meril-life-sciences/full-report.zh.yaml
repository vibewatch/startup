  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用客户工作流定义产品组合
        blocks:
          - type: paragraph
            body: >-
              Meril 更像一个多事业部器械平台，而不是单品医疗科技公司；它切入医院工作流的多个节点。公开产品界面覆盖心血管介入、骨科植入、手术机器人、诊断和内镜外科，并为 Myval THV、Evermine
              50、MISSO、HandX、Cuvis Joint 和 Merilyzer CelQuant 5 Plus 设置专页。放到客户语境里，Meril
              不只是卖一个孤立耗材；它可以参与术前规划、介入或手术本身、植入物选择、实验室测量和术后证据生成。


              但工作流覆盖不均。心血管页面技术和临床叙事最丰富，骨科有宽产品组合表述和论文轨迹，机器人有可信功能描述但仍高度依赖公司主导框架，诊断显示品类宽度却缺少同等独立验证。结果是一张很宽的 SKU
              地图：成熟度最强之处，是 Meril 能控制植入物设计、制造和面向临床医生的证据生成；透明度较弱之处，则需要软件、支持经济性或跨市场批准细节来承销执行。
