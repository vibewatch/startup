      - number: '7.2'
        title: 定价、临床证据与安全风险
        blocks:
          - type: paragraph
            body: >-
              定价和临床风险是第二层，但仍然重大，因为 Meril 的旗舰心血管平台位于国内限价、医疗责任和仍在成熟的证据交叉点。ICRA 明确提示，支架和膝关节植入物受 NPPA
              监管，未来更多产品被纳入会进一步压缩定价灵活性。安全性方面，已发表 Myval 证据方向上令人鼓舞，但仍然混合：早期 MyVal-1 经验样本小，直接前瞻性对照仍有限，首例已报告 Myval
              embolization 病例说明罕见但严重的手术事件可能发生。集团的缓释工具真实存在——产品责任险、多产品线和进行中的试验——但并不完整。Meril
              的证据深度最强在选定结构性心脏项目，而非组合中各处均衡，因此旗舰品类一旦出现反向信号，仍会不成比例地传导到利润率、声誉和监管关注。
