      - number: '8.3'
        title: 情景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Meril 的公开证据支持情景框架，而不是虚假精确。悲观情景围绕倍数压缩到 Edwards-like 区间：诉讼成本保持高位、出口驱动增长放缓、库存和应收账款仍重、投资者发现 CCPS
              堆栈吸收的权益价值高于预期。这指向约 USD 4.0-4.8 billion。基准情景假设 Meril 维持体面增长，把利润率守在当前附近，转换新增产能且不让杠杆失控，并保留战略可选性；这支持约 USD
              5.5-6.5 billion，已经几乎不给 ADIA 标记以上留下空间。超过 USD 7 billion
              的乐观情景需要的不只是传统品类继续执行：它需要结构性心脏和机器人给出高端品类证明、伙伴驱动扩张成功，以及一座能缩小当前信任折扣的披露桥。因此入场纪律应对价格敏感。没有完整 waterfall
              的情况下，新投资者应偏好按不高于 2024 年底区间定价，或取得保护下行泄漏的结构性条款。
