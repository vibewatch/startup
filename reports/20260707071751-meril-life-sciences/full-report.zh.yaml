      - number: '6.4'
        title: 留存代理指标、扩张杠杆、集中度与反向约束
        blocks:
          - type: paragraph
            body: >-
              Meril 的公开报告没有暴露投资者最想看的核心商业耐久性指标。为本章查看的公司页面中，没有 NRR、GRR、流失率、续约率、产品级装机基础或头部客户披露。最好的公开耐久性代理指标来自临床，而不是商业：
              LANDMARK 包含生活质量终点和十年随访，Myval 早期研究显示一年和两年生存曲线与成熟竞争对手相当，MISSO 一周年回顾强调外科医生反馈、培训和服务投入。这些事实说明 Meril
              正努力支持重复使用，但不能证明账户留存或单位经济性。


              扩张向量比留存更清楚。Myval 继续通过多中心试验和注册研究建立医生接受度；MISSO 明确被营销为一种成本更低的路径，把机器人膝关节置换带进印度较小医院； HandX
              面向成本敏感的外科项目，强调多种商业模式、无需维护和极小 OR 占地；诊断业务则覆盖中心实验室、医院和居家检测。Meril Academy 出现在多个地区，也解释了公司如何试图把医生培训转化为产品采用。


              主要下行在于，Meril 的商业触达会被间接渠道和法律准入卡住。Meril Europe 自有网站宣称 2,600+ 渠道伙伴，意味着伙伴依赖很重；Myval
              网站现在又说瓣膜系统在一长串欧洲国家不可销售，也未获准在美国销售。2024 年 UPC 禁令和后续 2025 年上诉活动，让这种限制不再是假设。Meril
              看起来有能力产生广泛临床兴趣，但公开记录仍未回答：公司能否把这种兴趣转化为跨产品家族、持久、不受限制、可重复的商业采用。
