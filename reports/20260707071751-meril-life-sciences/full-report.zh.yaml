        - ~USD 2.0B，按 ET 持股比例推算；Warburg 官方公告只披露 USD 210M 少数股权投资
        - 全球投资人进入后，业务重估幅度的历史底线
        - 关于 2022 年具体持股测算的公开报道，不如 2025 ADIA 公告清楚
      - - Meril 2024 IPO 前迹象
        - 报道的私人轮融资讨论
        - 约 USD 5.0B，对应出售 3-4% 股权的指示价格
        - 最接近 2025 年前新投资者入场价的公开参考
        - 新闻报道口径，并非已确认完成的融资轮
      - - Meril 2025 年 ADIA 轮
        - 官方交易
        - 约 USD 6.6B EV，对应约 3% 股权
        - 当前最好的价格信号，也是入场纪律的主要锚点
        - 名义 EV 仍看不出普通股实际分配顺位
      - - Medtronic
        - 市值 / 收入代理
        - 约 3.0x（USD 106.32B 市值 / USD 35.48B TTM 收入）
        - 规模化多元医疗科技平台的底部可比公司
        - 增长成熟、披露充分，因此是保守基准
      - - Abbott Laboratories
        - 市值 / 收入代理
        - 约 3.7x（USD 166.56B / USD 45.13B）
        - 显示具备规模和质量的宽口径器械组合能拿到什么倍数
        - 业务组合包含诊断和类药品板块，与 Meril 不完全可比
      - - Edwards Lifesciences
        - 市值 / 收入代理
        - 约 9.0x（USD 54.80B / USD 6.06B）
        - Meril 最有用的结构性心脏专科中位参照
        - 心血管更聚焦，且有公开市场流动性，仍应较 Meril 享有一定溢价
      - - Boston Scientific
        - 市值 / 收入代理
        - 约 3.2x（USD 66.29B / USD 20.61B）
        - 另一组多元医疗科技参照，用于观察下行压缩风险
        - 更成熟的宽口径组合和上市公司披露，削弱直接可比性
      - - Intuitive Surgical
        - 市值 / 收入代理
        - 约 14.5x（USD 153.29B / USD 10.58B）
        - 如果 Meril 未来在机器人和高端品类上讲出稀缺性，这是溢价上限参照
        - 纯机器人经济性和装机基础质量明显强于 Meril 当前披露画像
    notes: 该表混合了私募轮锚点和公开市值 / 收入代理，因为 Meril 没有披露公开的 EV 桥接细节；只应用于相对定位，不应用来机械定价。
    enumerationScope:
