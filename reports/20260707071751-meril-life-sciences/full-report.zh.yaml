  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 按买方、用户、支付方、地域和使用场景划分客户基础
        blocks:
          - type: paragraph
            body: >-
              Meril 的客户基础更适合按临床细分组合来理解，而不是一个单一 medtech 账户池。心血管侧，Myval 卖给由介入心脏科医生、结构性心脏团队和医院导管室运营的 TAVI/TAVR
              项目。直接用户是医生和导管室团队；买方和付款方则是医院与医疗体系，它们承担瓣膜库存、手术基础设施和医生培训。 Meril
              的诊断业务瞄准另一套采购中心——中心实验室、医院和居家检测渠道；骨科与手术机器人则卖给关节置换中心、骨科医生和手术室管理者。


              公司的地理覆盖和 go-to-market 模式也很混合。Meril 全球 about 页面称其服务 150+ 个国家，经营 35+
              家自有子公司；联系页面列出位于印度、美国、德国、巴西、俄罗斯、南非、孟加拉国和土耳其的全资实体，以及印度、土耳其、西班牙和俄罗斯的 academy
              地点。这指向一种混合模式：关键市场有直营销售，再叠加更宽的间接足迹。Meril Life GmbH 的欧洲站进一步宣称拥有 9,000+ 客户和 2,600+
              渠道伙伴，说明渠道杠杆很重要，即便公司未披露这套组合按产品线或地区如何拆分。


              产品级用户故事进一步强化这种分层。Human Xtensions 的 HandX 网站面向外科医生和 OR 团队，主打紧凑型手持机器人腹腔镜系统，让他们不用占用大型手术室空间，也能获得机器人灵活度；Meril
              骨科页面则强调植入物和机器人已在 50+ 个国家使用，并有外科医生顾问支持。MISSO
              的定位更明确地围绕未被充分服务的骨科需求、可负担性，以及都市医院之外的采用。因此，客户基础横跨高敏度心脏中心、骨科医院、微创手术团队、实验室和伙伴中介渠道；但公开资料仍没有收入或账户结构，无法说明哪些细分真正主导销售。
