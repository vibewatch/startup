      - number: '7.5'
        title: 缓释、监测与投资逻辑失效触发项
        blocks:
          - type: paragraph
            body: >-
              Meril 确实有缓释因素：多元治疗领域、部分司法辖区有利裁决、产品责任险、ICRA
              正面展望、锚定投资者，以及越来越全球化的临床证据项目。但剩余敞口仍高到足以要求有条件承销。最重要的投资逻辑失效事件并不抽象：Edwards 争议执行范围扩大、受限 Myval
              市场无法重新打开、诉讼支出继续上升但和解不清晰、营运资本强度恶化、债务融资 capex 跑赢现金转化，或机器人 rollout
              消耗管理层注意力却没有形成有意义装机基础。尽调议程因此应少看表面增长，多看法律结果、限价和执行滑坡如何硬传导到收入结构、流动性和 IPO
              时间。如果管理层无法用内部数据量化这些路径，即便表面增长仍有吸引力，剩余敞口也应按高处理。
