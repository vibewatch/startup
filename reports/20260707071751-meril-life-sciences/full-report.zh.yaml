  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 组合驱动的战场：Meril 同时打多个器械赛场，而不是一个
        blocks:
          - type: paragraph
            body: >-
              Meril 的竞争问题对一家私营医疗器械公司来说不寻常，因为它不落在单一狭窄品类里。公开公司材料显示，Meril 横跨血管介入、骨科、机器人、诊断及相邻外科品类，并通过 35 家以上子公司服务 150
              多个国家。这个宽度让 Meril 比单品创业公司有更多切入医院账户的方式；但也意味着它会同时撞上不同类型的竞争者：TAVR
              的结构性心脏既有巨头、介入心脏病学里的冠脉支架巨头和印度同行、骨科与腹腔镜机器人里的装机基数领先者，以及当前来源证据仍偏薄的广泛诊断赛道。结果是一个组合驱动战场：Meril
              的跨品类触达本身是优势，但它仍必须逐品类赢过资本更雄厚的专科玩家。
