      - number: '8.2'
        title: 经营实质与可比框架
        blocks:
          - type: paragraph
            body: >-
              不同于许多私营 medtech 名字，Meril 拥有足够第三方经营披露，可以做真实可比练习。ICRA 报告 FY2025 经营收入 Rs. 4,902.9 crore、PAT Rs. 729.4
              crore、OPBDIT margin 26.4%、出口贡献 61%，共同证明了真实规模和盈利能力。Meril 似乎也有实质产品宽度：官方页面描述 150+ 国家触达、35+
              子公司、广泛治疗领域、可见的结构性心脏临床项目，以及在日本扩张的合作足迹。话虽如此，正确同行集应是天花板和地板练习，而不是完美可比篮子。Meril 过于多元，不能按 Intuitive Surgical
              这种纯机器人高溢价处理；但增长性和临床差异化又足够强，也不应只按 3-4x 收入的广义多元化 medtech 基准。Edwards 是最有用的专业化中间点；Medtronic、Abbott 和 Boston
              Scientific 则展示了在披露充分、增长更成熟时，公开市场如何严格定价有规模但多元化的医疗器械组合。
