chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、法律结构与商业模式
        blocks:
          - type: paragraph
            body: >-
              Meril 对外定位为一家 2006 年创立、立足印度的全球医疗器械公司；但保留来源显示，公开品牌之下是多家法律实体，而不是单一运营公司。工商/备案聚合信息和评级报告共同指向 Micro Life
              Sciences Private Limited：它是集团母公司或经济中心；Meril Life Sciences Private Limited
              则是同一合并信用边界内的核心运营子公司之一。这个区分很关键：收入、债务、估值和诉讼经常在合并 Micro 集团层面披露，单个法律实体却有各自申报和担保/抵押记录。


              集团口径的商业模式，是在心血管、骨科、诊断、内镜外科和手术机器人等领域设计、制造、分销自有和相邻医疗器械，出口市场已经成为核心叙事。官方页面称 Meril 生态有 12,000 多人、服务 150 多个国家、拥有
              35+ 家自有子公司；ICRA 和 CARE 均将其描述为已成规模、出口驱动的制造商，目前大部分收入来自海外市场。总部证据在官方与备案衍生来源中一致：集团锚定 Gujarat 邦 Vapi 的
              Chala，Bilakhia House / Muktanand Marg 反复出现在核心地址簇中。
