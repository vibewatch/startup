      - number: '6.3'
        title: 具名客户证明：生产使用、试点、结果和新鲜度
        blocks:
          - type: paragraph
            body: >-
              Meril 组合里的具名客户证明强弱不一。结构性心脏业务中，最强证据不是光鲜 logo 墙，而是嵌在已发表试验和注册研究里的具名医院与中心。first-in-human MyVal-1 项目覆盖 14
              个印度点，扩展项目达到 30+ 个印度点，University Medical Centre Ljubljana 注册研究记录了 2017 至 2023 年间的 97 例 Myval 植入。Meril
              临床项目索引还指向具名区域项目，例如 Serbia 首个系统性 TAVI 项目，以及目标约 15 个点的 Myval European
              study。这些是生产或后期临床使用信号，因为它们涉及入组患者、随访方案和结果报告，而不只是产品发布页。


              机器人证据更新，也更容易点名，但厚度较薄。Himmatnagar 的 Pluto Hospital 公开上线 MISSO，称其为当地首个 AI 机器人关节置换系统，并报告患者术后三天内无痛行走；Dr. Keval
              Patel 称该平台改善结果和康复，这是明确的生产使用信号。Digital Health News 通过 Sarvodaya Hospital 的机器人关节置换负责人又补了一层医生证明，后者认可 MISSO
              的经济性和外科医生可用性，但该报道不像 Pluto 那样确认具名装机基础。


              HandX 介于两者之间。Human Xtensions 网站记录了具体手术——Roux-en-Y gastric bypass、TAPP hernia repair、total laparoscopic
              hysterectomy 和 eTEP surgery——并把用户框定为寻求小占地、常规套管和机器人关节灵活度的外科医生与 OR 团队。MISSO、HandX 和 Cuvis
              共同缺失的是完整公开客户账本，包括账户数量、复购和新近具名医院引用。因此 Meril 的证明足以说明真实使用存在，但不足以证明结构性心脏之外已有广泛商业渗透。
