  - id: FR001
    title: Meril 风险热力图：严重性与可能性
    type: matrix
    layout: wide
    summary: 在考虑已披露缓释措施后，本图按剩余严重性和发生可能性放置 Meril 主要下行风险向量。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 诉讼 / 市场准入
          values:
            - 进一步上诉救济缩小限制范围
            - 法律成本持续，但商业影响趋稳
            - 受限 Myval 地区仍关闭，执法范围扩大
        - label: 监管 / 定价
          values:
            - 没有新的价格管制动作
            - 现有限价持续，但产品组合抵消压力
            - NPPA 或其他审批实质压缩定价和上市节奏
        - label: 临床 / 安全
          values:
            - 没有出现有意义的新信号
            - 证据更成熟，但结论仍不一
            - 罕见严重事件或较弱对照数据触发犹豫
        - label: 运营 / 质量
          values:
            - 系统平稳扩张
            - 复杂度带来可控摩擦
            - 多治疗领域合规和场点集中引发服务或质量扰动
        - label: 财务模型
          values:
            - 现金转化明显改善
            - 增长保持强劲，但营运资本仍重
            - 债务、资本开支和库存跑得比现金生成更快
        - label: 机器人执行
          values:
            - MISSO 高效商业化
            - 印度证明在推进，但全球扩张缓慢
            - 机器人业务消耗支持支出，却没有形成有意义的装机牵引
    approximationNotes: 单元格位置有证据支撑，但仍带判断，因为公开来源不提供内部风险评分或完整产品级敞口数据。
    claimRefs:
      - CR005
      - CR009
      - CR017
      - CR022
      - CR027
      - CR032
      - CR034
      - CR042
