      - number: '1.4'
        title: 规模、里程碑与不利事件
        blocks:
          - type: paragraph
            body: >-
              运营故事是产品版图拓宽、全球野心上行。公开来源显示，Meril 从 Myval 取得 CE 和 CDSCO 批准等心血管里程碑，走向覆盖机器人、内镜外科、诊断和出口分销的更大平台。到 2025 年，集团已录得
              ₹4,902.9 crore 合并收入，大手笔投入 R&D，并计划在 Vapi 继续扩产。产品和监管里程碑包括 LANDMARK Myval 结果、Myval Octapro 发布、MeRes100 CE
              里程碑、Monik trocar 的 FDA 510(k)、Japan Lifeline 面向日本的分销联盟，以及 MISSO 下机器人持续推出。


              主要不利项是 Edwards 心脏瓣膜诉讼。CARE 和 ICRA 均将 Myval 专利纠纷列为评级约束；EPLAW 和 UPC 命令显示，该问题已在 2024 年 11 月 Munich
              判决中具体化，后者包括禁令、召回/销毁令和初步损害赔偿。ICRA 又称截至 2025 年 3 月，累计法律成本已达约 ₹500-550 crore。因此，公司概览必须保持平衡：Meril
              显然已具规模且仍在加速，但它也背着一项昂贵且战略重要的诉讼包袱，诉讼触及其旗舰心血管产品线之一。
