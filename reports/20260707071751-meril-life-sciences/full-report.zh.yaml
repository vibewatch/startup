    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 以当前财务披露和上市可比公司为锚，给出以十亿美元计的情景估值区间。
    data:
      items:
        - label: 悲观情景
          low: 4
          base: 4.4
          high: 4.8
        - label: 基准情景
