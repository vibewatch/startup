  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、产品组合范围与替代品
        blocks:
          - type: paragraph
            body: >-
              不应把 Meril
              当作单一产品医疗器械公司分析。公开产品组合横跨血管介入、骨科植入、手术机器人或内镜外科，以及体外诊断；因此相关市场是一组器械品类组合，每类都有不同买方、替代品和定价逻辑。最外层边界是印度医疗器械行业，官方和行业来源将其描述为快速增长但仍依赖进口的市场。在这个大框架内，Meril
              最有公开证据支撑的收入池是心血管植入和结构性心脏产品：药物洗脱支架、生物可吸收支架、球囊导管和 TAVR
              系统。骨科、手术机器人和诊断把公司带入不同的医院预算池，但保留来源没有为每个细分提供同等扎实的公开市场规模数据。


              替代品集合也随细分变化。冠脉介入中，Meril 面对传统金属支架和更宽的 PCI 治疗栈；结构性心脏中，它面对既有 TAVR
              系统，以及微创瓣膜试图替代的开胸手术路径。骨科植入和机器人膝关节系统的对照对象，是传统关节置换器械和既有机器人工作流，而不是心脏病科预算。诊断领域，Meril 与手工或半自动流程、中心实验室既有厂商、低成本
              POCT 替代方案竞争。核心含义：任何只用“医疗器械”拼出的标题级 TAM，都会高估 Meril 可服务机会；口径必须收窄到实际购买相应器械的医院项目、临床专科和报销环境。
