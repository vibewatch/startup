  - id: TP003
    title: 定价 / 打包对比
    columns:
      - 公司 / 平台
      - 公开定价姿态
      - 商业 / 打包信号
      - 公开证据包含什么
      - 对切换或买方议价能力的影响
    rows:
      - - Meril 产品组合
        - 暗示价值导向定位，实际成交价未披露
        - 器械和植入物之间具备产品组合打包潜力
        - 一体化制造、品类广，但没有确认的实际价目表
        - 可能有利于价格敏感客户，但定价不透明限制可测算优势
      - - Medtronic TAVR
        - 高端植入路径；此处未公开标价
        - 手术 + 正式随访、瓣膜卡和患者登记流程
        - 四种瓣膜尺寸、自膨式架构、照护路径细节
        - 支持栈把替换摩擦抬高到植入物本身之外
      - - Abbott / Edwards TAVR 既有厂商
        - 高端结构性心脏定位；未保留公开标价
        - 在保留证据中，产品组合宽度和标签深度比价格更重要
        - Navitor 设计差异化和 Sapien 标签宽度公开；精确价格未公开
        - Meril 必须靠可得性、医生信心或此处未披露的经济性取胜
      - - Boston Scientific / SMT 冠脉支架
        - 更像 SKU，也更容易多供应商并用；实际成交价仍未披露
        - 产品主导的器械竞争，而非资本平台锁定
        - 支架名称和操控性主张公开
        - 买方可同时保留多个 DES 选项，限制单一供应商锁定
      - - Stryker Mako 4
        - 暗示高端资本设备定位
        - 手术家族扩展、CT 规划和触觉反馈栈以平台形式销售
        - 骨科覆盖和 47 国足迹公开；精确价格未公开
        - 已装平台宽度抬高切换成本，压缩后发挑战者折扣空间
      - - Intuitive da Vinci 系统
        - 暗示高端装机基础定位
        - 多个平台覆盖主要软组织专科
        - 广泛适应症和先行者定位公开；精确价格未公开
        - 培训和装机基础效应可能压过单纯价格竞争
    notes: 本表有意比较定价姿态，而不是没有支撑的标价。公开来源足以推断高端与价值定位，但不足以建模实际客户经济性。
