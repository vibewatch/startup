        - 介入心脏病医生 / 导管室
        - 公开证据最成熟；多项研究加上进行中试验摘要
        - 精细化尺寸、专用输送体系、对照文献
        - 逐国审批足迹未公开
      - - Evermine 50 / MeRes100 心血管植入物
        - 心脏病医生 / 血管介入团队
        - 商业化组合，叙事围绕 CE 标志支架
        - 材料科学，加上 Meril 声称的一体化制造控制
        - 独立长期商业采用数据稀少
      - - 骨科植入系统
        - 骨科医生
        - 在 50+ 个国家拥有广泛植入物组合
        - 覆盖髋、膝、创伤、脊柱、翻修等范围
        - 具体旗舰 SKU 和审批地图披露不足
      - - MISSO 机器人膝关节系统
        - 关节置换医生 / 医院管理者
        - 新兴；公开新闻加门户链接收录的骨科文献
        - 光学追踪、机械臂、小占地定位
        - 成本、时间和成功率主张缺少独立验证
      - - HandX 手持机器人腹腔镜
        - 普外 / 妇科 MIS 医生
        - 商业伙伴资产，审批信息明确
        - 5 mm 关节式手持机器人，保留腹腔镜流程
        - Meril 的具体商业化和集成角色不清楚
      - - Cuvis Joint 机器人平台
        - 膝关节置换医生
        - 产品页和文献索引提供中等公开成熟度
        - 已有机器人对线和 CT 关联规划证据
        - 公开监管状态和所有权经济性不明确
      - - Merilyzer CelQuant 与诊断组合
        - 实验室管理者 / 临床医生
        - 品类覆盖广，但公开证据深度薄
        - 一个组合覆盖中心实验室和即时检测
        - 公开可见的独立性能数据有限
      - - Monik 一次性内镜套管针
        - 腹腔镜医生 / 手术室人员
        - 通过 FDA 510(k) 获得直接美国监管证明
