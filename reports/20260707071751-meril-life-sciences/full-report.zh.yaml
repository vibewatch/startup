        title: 财务模型、资本强度与 IPO 风险
        blocks:
          - type: paragraph
            body: >-
              Meril 的财务模型强，但并非低风险。ICRA 记录了高速增长和健康利润率，也提示资产负债表的运营杠杆明显加重：出口市场贡献大部分收入，营运资本强度仍高于经营收入的 50%，库存天数超过 200
              天，营运资本债务和总债务都在 FY2025 大幅上升。与此同时，公司仍在为大型 capex 项目投入资金，并承担延伸到 FY2028 的还款义务。ADIA 注资改善流动性，但在 ICRA
              审核日，这笔现金仍停放在定期存款中，说明资金灵活性不等于部署已经完全去风险。估值叙事同样有两面：私募定价从 2022 年 Warburg 交易抬升到 2025 年 ADIA 投资，但这也让任何 IPO
              窗口对诉讼、利润率滑坡或出口执行慢于预期更敏感。
