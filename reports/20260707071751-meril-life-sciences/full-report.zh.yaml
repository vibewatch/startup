        title: 展示项
        blocks:
          - type: callout
            title: Meril 已经像一家成规模的全球制造商，而不是早期器械创业公司
            body: 官方规模声明、ICRA/CARE 收入披露和 ADIA 估值标记都指向一个已经进入后期工业执行阶段的业务。尽调关键不再是基本产品-市场匹配，而是治理、资本效率和诉讼敞口能否跟上这种规模。
