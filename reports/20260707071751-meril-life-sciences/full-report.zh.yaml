        title: 估值背景与价格支撑
        blocks:
          - type: paragraph
            body: >-
              最干净的当前价格信号是 2025 年 7 月 ADIA 交易：约 USD 200 million 买入 Micro Life Sciences 约 3% 股权，隐含企业价值接近 USD 6.6
              billion。这个水平明显高于 2024 年底媒体讨论的 USD 5 billion pre-IPO 轮，也显著高于 Economic Times 关于 Warburg 2022 年入场所隐含的约 USD 2
              billion。价格支撑并非虚构——主权投资者确实为这个故事付款——但公开证据也显示， 2025 轮不是简单的新钱标记。ICRA 称，只有约一半募资是 primary capital，其余是 BHPL 的
              secondary sale；公司从 FY2023 起股本堆栈中已经有 CCPS。这意味着名义 EV 可作为漏斗顶部信号，但没有完整 waterfall
              模型时，不能可靠代理新普通股投资者会实现的价值。简言之，Meril 有市场出清的私募标记，但还没有达到市场出清的公开股权披露标准。
