      - number: '8.4'
        title: 建议、退出准备度与尽调要求
        blocks:
          - type: paragraph
            body: >-
              由此得出的判断是观察，而不是买入。Meril 有足够实质值得认真尽调：它规模大、盈利、出口化、临床活跃，并有机构资本支持。但当前私募标记已经把 Meril 定价得更接近专业化高端
              medtech，而非多元化医疗器械同行，尽管公开披露仍是私营公司水平。退出准备度有所提升，因为公司现在有蓝筹投资者和外部描述的财务画像；但证据集仍缺少能把强私募故事转换为可承销公开股权机会的文件。委员会应在管理层提供股权结构表和
              CCPS waterfall、ADIA 交易条款、分部经济性和诉讼分析前，假设风险高。低于 USD 5.5 billion
              的入场价或有意义的下行保护可以改善判断；否则，审慎姿态是跟踪里程碑，只在价格和证据一起改善后推进。
