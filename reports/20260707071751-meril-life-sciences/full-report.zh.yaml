      - number: '4.3'
        title: 资本充足性、营运资本、资本开支与债务负担
        blocks:
          - type: paragraph
            body: >-
              ICRA 对 Meril 当前资产负债表压力点给出罕见细节。FY2025 净营运资本强度为经营收入的 53.8%，高于 FY2024 的 50.4%；库存仍高达 212 天，营运资本债务升至 Rs.
              1,690.5 crore。与此同时，增长需要大额资本开支：FY2025 约 Rs. 600 crore，此前 FY2024 为 Rs. 673 crore；FY2026 还计划再投入 Rs. 500-600
              crore，用于制造扩张、MMIPL 搭建、去瓶颈和能源资产。这些支出把总债务从一年前的 Rs. 1,808.0 crore 推高到 2025 年 3 月 31 日的 Rs. 2,592.5
              crore，尽管经营表现改善足以把 debt/OPBDITA 降到 2.0x、把利息覆盖率抬到 6.7x。


              2025 年 7 月 ADIA 交易改善近期充足性，但没有消除融资依赖。ICRA 称这笔 $200 million 交易只给公司带来约 Rs. 860 crore
              一级资本，余额流向股东流动性；报告出具时，一级所得款项仍以银行定存形式持有。流动性由 2025 年 3 月约 Rs. 593 crore 自由现金和流动投资，以及截至 2025 年 7 月 Rs. 315.1
              crore 未提取营运资本额度支撑；但这些缓冲要面对 FY2026 计划资本开支，以及 FY2026-FY2028 分别为 Rs. 128.3 crore、Rs. 195.6 crore 和 Rs. 183.1
              crore 的计划还本。Meril 因此看起来足以支撑下一阶段执行，但还不是完全自我造血。增长仍依赖纪律化资本开支爬坡、营运资本控制，以及避免新的诉讼或监管现金冲击。
