      - number: '4.4'
        title: 公开牵引、私域缺口与财务判断
        blocks:
          - type: paragraph
            body: >-
              Meril 的公开业务牵引显著好于多数私营医疗科技同行。ICRA 显示 FY2025 收入 Rs. 4,902.9 crore、Q1 FY2026 收入 Rs. 1,416
              crore；官方和新闻来源显示，公司规模足以支撑 150+ 个国家、35+ 家子公司、12,000+ 至 13,000+ 名员工，以及 Warburg 和 ADIA
              连续头部机构投资轮。这个组合给外部投资者更多承销抓手，比典型不透明私营制造商大得多。它也支持建设性的收入质量判断：产品组合按治疗领域分散，出口市场重要，Myval
              等旗舰产品有监管进展和临床竞争力证据，有望维持更高出口实现价格。


              但缺失数据仍关键。Meril 不公开现金消耗、资金跑道、客户集中度、实际
              ASP、分部毛利率、CAC、销售回收期或收入确认政策。这些缺口尤其重要，因为它不是轻资本软件：业务需要库存、本地商业存在、培训、持续监管工作和大额持续制造资本开支。此外，ICRA 对定价压力、监管控制以及
              Myval 累计 Rs. 500-550 crore
              诉讼成本的讨论，意味着不能只看增长来评估盈利质量。财务判断因此平衡：受益于多元化、出口和利润率改善，收入质量方向上较好；但资本强度仍高，现金转化质量披露不足。Meril
              的规模更容易相信，自由现金流耐久性更难相信。
