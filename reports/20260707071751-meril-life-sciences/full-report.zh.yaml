      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强驱动因素是政策支持的本土制造、心血管疾病负担上升、医院自动化需求扩大，以及微创疗法持续采用。印度医疗科技政策组合——National Medical Devices Policy、PLI、医疗器械园区和
              100% FDI——利好有规模的本土制造商。Meril 的受益点在于供应定位和本土化可信度更强。结构性心脏领域，TAVR
              采用受益于人口老龄化、低风险适应症批准，以及医院偏好的短住院微创照护。机器人和诊断的需求故事则围绕精准度、吞吐量、外科医生灵活性和更低手工差错率。


              阻力同样清楚。印度官方定价管制直接覆盖冠脉支架和膝关节植入物，压住 Meril 相邻品类并限制纯 ASP 扩张。Department of Pharmaceuticals
              还将许多器械细分描述为资本密集、培育期长、培训负担重；这会抬高手术机器人和专科植入项目的销售摩擦。TAVR 面对高昂手术成本、监管复杂性、劳动力约束和稳固的既有厂商生态。Myval 还背着欧洲不利项：EP Law
              总结的 2024 年 11 月 UPC 禁令限制了 Meril 经导管心脏瓣膜在 16 个 UPC 成员国的销售，仅留下狭窄的 XL 豁免；上诉登记显示纠纷截至 2025 年 4 月仍在继续。合在一起，Meril
              的市场机会真实存在，但采用速度取决于监管可信度、价格纪律韧性，以及能否把临床差异化转化为保守医院采购体系内的信任。
