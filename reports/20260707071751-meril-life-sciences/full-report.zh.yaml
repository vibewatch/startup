  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、组合与定价可见度
        blocks:
          - type: paragraph
            body: >-
              Meril 变现的是多元医疗器械组合，而不是单一 SKU。官方和评级机构证据指向五个治疗/业务领域——心血管与结构性心脏、骨科、内镜外科、诊断和手术机器人——产品宽度超过 100 项技术。ICRA
              给出最干净的当前组合披露：血管介入贡献 FY2025 收入约 35%，骨科约 30%，其余分布在诊断、内镜外科、机器人相关业务和其他集团运营。2024 年 Economic Times 援引 CARE
              数据的报道显示，历史组合同样多元，只是心血管植入物集中度略高。出口收入是经济引擎：ICRA 称出口贡献 FY2025 合并收入约 61%，Mint 报道约 55%，官方页面则显示覆盖 150+ 个国家和 35+
              家子公司。Myval 似乎是尤其重要的收入质量驱动因素，因为 ICRA 将利润率扩张归因于更好的出口实现价格，并称这条旗舰瓣膜线 FY2025 出口占比为 84%。


              缺口仍是公开定价透明度。Meril
              的官方公开界面强调产品组合宽度，但不披露标价、实际成交价、合同结构或收入确认政策。这很关键，因为经济模型可能因产品线而异：植入物按手术或植入物变现，内镜外科取决于一次性耗材和设备吞吐，诊断混合仪器与耗材，机器人叠加资本设备和服务型收入特征。国内定价弹性也受限。ICRA
              明确提到支架和部分骨科植入物的定价压力，并将行业经济性与 NPPA 对支架和膝关节植入物的监管联系起来；因此不能把公开增长误读成不受约束的定价权。结论是收入基底看起来宽且增长，但实际价格和组合质量仍只部分透明。
