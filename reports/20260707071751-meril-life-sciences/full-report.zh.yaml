              运营和执行风险来自规模加宽度。Meril 公开描述的足迹覆盖 150+ 个国家、至少 35 家子公司，产品栈从瓣膜、支架延伸到诊断、endo-surgery
              和机器人。宽度可以成为护城河，也会放大质量体系、上市后监测、培训和服务义务。较早的 CDSCO CLAA 批准清单显示，到 2015 年，Meril 的 Vapi 园区已获准生产一长串骨科
              SKU，凸显监管记录保存和工厂级质量保证有多集中于该地点。机器人推进尤其依赖执行。MISSO 有可信技术抱负和一些早期医院证明点，但 2024 年报道仍把 CE 和美国 FDA 批准描述为待定，并把 Meril
              与 Stryker、Zimmer
              更成熟的骨科机器人生态对标。公开披露也留下缺口：招聘页面很薄，不同来源的员工数差异很大，官方页面上的实体清单也不如第三方法律实体目录宽。这些不一致抬高了关于治理、汇报线和扩张深度的尽调问题。
