      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Meril 的规模叙事很清楚，创始人与领导层披露却明显不那么干净。Warburg Pincus 称 Meril 由 Bilakhia 家族创立；IndiaMedToday 则明确把 Shahid Bilakhia
              列为 Micro Life Sciences (Meril) 的创始成员。CARE 补上更宽的发起人语境：Bilakhia Group 由 Gafurbhai Bilakhia 创立，目前由
              Yunus、Zakir 和 Anjum Bilakhia 管理，最终控股公司是 Bilakhia Holdings。证据足以判断发起人家族控制，但不足以从一手来源还原完整创始人名单。


              当前治理信息只露出碎片。Masterdata 在 Micro 名下列出 Narendra Ostawal、Pramodkumar Minocha、Vivek Prafulbhai Shah、Dinesh
              Saraf 和公司秘书 Prashant Arunkumar Mehta；Meril Life Sciences Private Limited
              实体页在子公司层面显示另一组董事。公开运营发言人也按产品线分散：Vivek Shah 以 MISSO 机器人项目 CEO 身份出现，Pramodkumar Minocha 是全职董事和 R&D
              发声人，Sanjeev Bhatt 多次作为融资和瓣膜发布的战略发言人出现。因此，尽调结论不是已经确认的 CEO 更迭事件，而是治理透明度问题：公开证据没有给出一个清晰、官方、当前的集团领导层名单。
