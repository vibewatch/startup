      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 这不是只靠叙事的私营 medtech 公司
            body: >-
              Meril 已经像一家有规模的经营公司，而不是纯风险投资押注：ICRA 披露 FY2025 收入近 Rs. 4,903 crore、OPBDIT margin 26.4%、PAT Rs. 729.4
              crore、出口贡献 61%。这种已披露经营实质在印度私营 medtech 平台中罕见，也解释了为什么机构资本能支撑溢价标记。
            calloutType: strength
            claimRefs:
              - CV011
              - CV013
              - CV014
              - CV017
          - type: callout
            title: 名义 EV 比股权故事更干净
            body: >-
              ADIA 的 USD 6.6 billion 企业价值信号是真实的，但公开证据也确认了 CCPS 历史、primary-secondary 混合募资、沉重营运资本需求和持续诉讼成本。没有完整完全摊薄
              waterfall，投资者不能假设企业价值等于干净普通股价值。
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV009
              - CV010
              - CV018
              - CV022
          - type: callout
            title: 价格和证据都需要改善
            body: Meril 值得主动尽调，因为业务质量可见；但新投资者应要求更低入场价格，接近 2024 年 pre-IPO 区间，或要求明确下行保护。按今天的名义价格，委员会相对仍可公开获得的披露质量，承销了过多希望。
