  - id: TV004
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 估值区间
      - 概率信号
      - 关键风险
    rows:
      - - 牛市
        - 收入增速维持在十几个百分点的高段或更高，利润率守在 FY2025 附近，结构性心脏临床证据继续支撑较好可比，伙伴扩张叠加高端品类可选性，压缩披露折价
        - USD 7.0B-8.0B
        - 低-中；需要高端品类跑出来，也需要更干净的披露桥接
        - 业务仍过于多元且不透明，难拿到 Intuitive 式定价
      - - 基准
        - 增长保持健康，利润率守住，资本开支加速但不带来杠杆压力，Meril 在没有进一步估值上台阶的情况下保留战略可选性
        - USD 5.5B-6.5B
        - 中；与当前基本面和 ADIA 轮大体一致
        - 当前价格已经吃掉这部分上行的大半，容错空间有限
      - - 熊市
        - 增长降温，诉讼或资本开支消耗管理层精力，营运资本仍偏重，市场把 Meril 重新定价到接近 Edwards 或多元医疗科技区间
        - USD 4.0B-4.8B
        - 中；如果多条下行线索同时触发，就并不牵强
        - 未知优先权结构可能让普通股结果比名义区间暗示的更差
    notes: 情景区间是判断输出，锚定 FY2025 已披露收入、公开医疗科技可比公司，以及 USD 5.0B 和 USD 6.6B 两个已知私募标记。
    claimRefs:
      - CV021
      - CV022
      - CV037
      - CV038
      - CV039
      - CV048
      - CV049
      - CV050
  - id: TV005
    title: 投资论点失效与否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 降价融资或二级市场重估
        - 可信的新融资价格低于 2024 年末约 USD 5.0B 的指示价
        - 说明 ADIA 标记站不住，私募市场现在要求更低出清价
        - 把估值重切到熊市区间，并暂停任何买入案例
      - - 利润率 / 现金转化恶化
        - 盈利能力明显低于 FY2025，或营运资本拖累加重
        - 会挑战 Meril 能否在不放大资本需求的情况下扩张高端品类
        - 从“跟踪”转向“回避”，直到现金经济性重新跑通
      - - 诉讼不利进展
        - 法院或和解结果实质性损害 Myval 经济性或增长弹性
        - 同时打击临床溢价叙事和自由现金价值桥
        - 立即重估结构性心脏贡献和下行情景准备金需求
      - - 资本开支没有转化为利用率
        - FY2026-27 扩张推进，但新增产能没有转化为收入结构升级或出口增量
        - 会拉低投入资本回报，并压缩投资者愿意为增长故事支付的价格
        - 下调基准和牛市权重，要求更低入场价
      - - 签约时分配瀑布不透明
        - 管理层拒绝完整披露完全稀释持股、CCPS 条款或清算顺位
        - 即使企业故事仍强，也无法核算股权价值
        - 没有结构性保护，不从“跟踪”升到“买入”
    notes: 这组触发项盯的是会改变估值的事件，而不只是公司质量；第五项是尽调否决条件，不是经营 KPI。
    claimRefs:
      - CV009
      - CV010
      - CV018
      - CV021
      - CV022
      - CV050
      - CV057
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 股权结构表和清算分配瀑布
        - 完全稀释股数、CCPS 条款、投资者权利和收益分配顺位
        - 决定名义 EV 中到底有多少归属新普通股
        - 管理层、公司律师、股东名册和交易文件
      - - ADIA 交易条款
        - SPA、二级出售机制、治理权，以及任何棘轮或附函
        - 用于判断 2025 年估值标记是干净价格发现，还是部分来自结构性保护
        - 管理层、ADIA 流程律师和董事会材料
      - - 分板块经济性
        - 按结构性心脏、骨科、诊断、内镜手术和机器人拆分的收入、毛利率和营运资本强度
        - 厘清高端叙事由最有价值的品类支撑，还是由低倍数业务托起
        - 财务数据室和 FY2026 管理账
      - - 诉讼准备金和情景备忘录
        - 最新案卷摘要、损害赔偿区间、保险 / 追偿假设和商业应急计划
        - 估值下行对心血管诉讼结果高度敏感
        - 外部律师备忘录加 CFO 准备金明细
      - - 现金转化和资金投放
        - 库存周转、应收账款账龄，以及未提取 / 新募集资本的投向
        - 沉重的营运资本拖累会让高收入倍数难以持续
        - 资金管理材料和经营仪表盘
      - - 退出路径准备度
        - IPO 工作流、投行、董事会准备度，或正在推进的战略流程证据
        - 退出路径影响时间表，也影响今天入场该用哪套可比框架
        - 董事会材料、投行和管理层访谈
    notes: 这些问题按估值重要性排序；在当前定价下，前三项是任何从“跟踪”上调的门槛。
    claimRefs:
      - CV009
      - CV010
      - CV022
      - CV045
      - CV050
      - CV056
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Meril 从法律实体设立，到融资、监管进展、扩张和关键不利诉讼事件的公司层面公开里程碑。
    data:
      items:
        - date: '2006-05-31'
          label: Micro 注册成立
          detail: Micro Life Sciences Private Limited 在 Gujarat 注册成立，后来作为母体法律实体出现在信贷和融资披露中。
          tone: positive
        - date: '2007-06-19'
          label: MLSPL 注册成立
          detail: Meril Life Sciences Private Limited 注册成立，成为更大 Meril 结构中的关键运营公司。
          tone: neutral
        - date: 2019-05
          label: Myval 获 CE + CDSCO 批准
          detail: Myval 获得 CE 和 CDSCO 批准，确立 Meril 本土 TAVR 的商业里程碑。
          tone: positive
        - date: '2022-02-22'
          label: Warburg 少数股权投资
          detail: Warburg Pincus 签署对 Micro Life Sciences 约 US$210M 的少数股权投资。
          tone: positive
        - date: 2024-01
          label: ₹910 crore Vapi 扩建
          detail: Meril 宣布一项制造扩建，覆盖三家子公司，目标创造约 3,000 个岗位。
          tone: positive
        - date: '2024-05-15'
          label: LANDMARK 结果
          detail: EuroPCR 2024 发布的 30 天 LANDMARK 结果支撑 Myval 的非劣效定位。
          tone: positive
        - date: '2024-05-24'
          label: FDA K233386 许可
          detail: Meril Endo Surgery 的 Monik 一次性内镜套管针获得 FDA 510(k) 许可。
          tone: positive
        - date: '2024-09-04'
          label: Micro 董事会变动
          detail: Narendra Ostawal 出现在 Micro 董事会，证明 2024 年治理层面发生变化。
          tone: neutral
        - date: '2024-11-15'
          label: UPC 禁令
          detail: Edwards 在 Munich UPC 赢得针对 Meril 的裁决，包括禁令、召回 / 销毁和初步损害赔偿。
          tone: negative
        - date: '2025-07-21'
          label: ADIA 投资 $200M
          detail: ADIA 同意对 Micro Life Sciences 投资 $200M，以约 $6.6B EV 取得约 3% 股权。
          tone: positive
        - date: 2025-09
          label: 软组织机器人发布
          detail: CARE 报告称，一款将由 Micro 销售的软组织手术机器人已经发布。
          tone: positive
        - date: 2025-10
          label: 正面信用展望维持
          detail: ICRA 和 CARE 均称，近期股权注资支撑了持续增长、更强利润率和正面展望。
          tone: positive
    approximationNotes: 部分里程碑日期只到月份，因为保留的公开来源集在抓取文本页中没有给出具体发布日期。
