      - number: '4.2'
        title: GTM 动作、销售效率代理指标与成本结构
        blocks:
          - type: paragraph
            body: >-
              公开证据指向全球渠道加子公司的 GTM 模式，而不是轻直销模式。Meril 官方页面提到 35+ 家自有子公司，以及主要市场的全资子公司；印度业务在至少若干产品线仍依赖经销商分销：Economic Times
              报道印度骨科产品有超过 120 家经销商。公司还通过 Meril Academy
              和持续专业培训项目重投入临床医生教育和销售赋能。这说明收入增长绑定现场密集型商业动作，每个地域都嵌入监管、培训和临床支持开销。最佳公开销售效率代理指标是间接的：出口组合、足迹增长、经销商触达，以及
              Myval、MISSO 等更复杂产品能跨过监管和临床采用门槛的证据。Meril 不披露 CAC、回收期、转化周期或销售人效。


              公开数据里的成本结构符合资本密集型医疗科技制造商。ICRA 将利润率提升归因于有利组合和后向一体化，但也描述了多 SKU
              库存、海外备货和给渠道伙伴较长账期带来的高营运资本需求。临床验证和培训推高服务交付成本。Meril
              的临床项目门户本身列出心外科、结构性心脏、骨科、内镜外科和诊断等几十项进行中或随访研究及登记，说明证据生成和医生赋能是常态运营要求，而非一次性上市费用。Myval
              持续积累临床证据和监管批准，提升高端定位；手术机器人等新品类带来未来可选性，但在形成实质利润池前，很可能先扩大工程、服务和参考站点成本。MISSO
              早期手术牵引在商业上令人鼓舞，却强化而非降低了现场支持强度，因为机器人系统需要医院导入、外科医生信任和装机后支持。公开看来，Meril
              的毛利线具备不错经营杠杆，但销售模型仍会消耗营运资本和运营基础设施，才能维持出口驱动增长。
