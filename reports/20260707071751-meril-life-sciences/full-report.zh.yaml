companyProfile:
  summary: >
    Meril 是一家总部位于印度 Gujarat 邦 Vapi 的医疗器械集团，围绕 Micro Life Sciences Private Limited 和 Meril Life Sciences
    运营实体展开。公开材料将品牌创立时间定在 2006 年，并描述了一套宽产品栈，覆盖心血管器械、结构性心脏、骨科、诊断、内镜外科和机器人。官方页面称员工超过 12,000 人、服务 150+ 个国家、拥有 35+
    家自有子公司；ICRA 披露 FY2025 合并收入为 Rs. 4,902.9 crore，出口贡献 61%，经营利润率 26.4%。公司 2022 年从 Warburg Pincus 融得约 US$210M，2025 年又从
    ADIA 融得 US$200M，对应隐含约 US$6.6B 估值；但营运资本占用高、债务上升、资本开支需求大，Myval 瓣膜平台诉讼也尚未解决。
