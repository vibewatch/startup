      - number: '2.2'
        title: 用多个公开镜头看 TAM、SAM 和 SOM
        blocks:
          - type: paragraph
            body: >-
              最宽的公开 TAM 镜头是印度医疗器械：IBEF 将 2025 年市场规模放在约 US$15.2 billion，并预计 2030 年达到约 US$50 billion；Department of
              Pharmaceuticals 另将印度描述为全球前 20 市场，年增速约 15%。这个口径有助于看背景和政策支持，但对 Meril 过宽，因为它包括影像、耗材和许多诊断细分；Meril
              要么不直接参与，要么保留来源没有显示公开份额数据。更窄的公开口径来自 Meril 的心血管业务。针对印度冠脉支架，Future Market Insights 估算 2025 年市场为 US$0.9
              billion，Coherent Market Insights 对同年估算为 US$1.67 billion。1.9x 的差距太大，不能当成噪声；审慎解读是市场存在且有规模，但发布方方法论会显著改变标题数字。


              结构性心脏提供第二个镜头。Vantage 发布的展望将全球 TAVR 市场放在 2024 年 US$6.8 billion，并预计 2035 年增至 US$14.06 billion；北美在 2024 年贡献
              42% 收入。这个镜头之所以有用，是因为 Myval 所在的是专科化、既有巨头密集的心脏团队市场，而不是通用植入物池。但它仍不能解出组合层面的 SAM 或 SOM，因为 Meril
              不公开支架、瓣膜、骨科、机器人和诊断的分部收入、装机基础、各地域手术量或 ASP。因此，公开证据支持的是多镜头市场地图——宽口径印度医疗科技 TAM、较窄心血管子市场镜头，以及仍属私域的公司特定
              SOM——而不是单一“正确”数字。
