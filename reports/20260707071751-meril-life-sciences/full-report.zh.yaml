  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 诉讼与市场准入风险
        blocks:
          - type: paragraph
            body: >-
              诉讼和市场准入风险是最清楚的红旗，因为欧洲法院结果已经在限制商业自由，而不是一个假设中的未来争议。UPC 上诉法院维持了 Edwards 核心专利，基本保留禁令架构；2025 年 4 月的
              suspensive-effect order 显示，在上诉程序继续时，Meril 已被要求执行召回、销毁、信息披露和临时损害赔偿义务。Meril 自己首页现在带有免责声明，说明 Myval
              系统在多个欧洲司法辖区不可销售，且未获准在美国销售，这让争议直接出现在面向客户的渠道语言中。美国 safe-harbor 胜诉有帮助，但保护的是获批前活动，而不是授予经营自由。FDA 的 PMN
              数据库中，Meril Endo Surgery 的 K233386 trocar 备案也显示，即便 Meril 有限的美国足迹，也处在带有具名申请人、分类和决策路径的产品级审批制度内。再加上 ADIA 交易需要
              CCI 批准，监管和法律依赖明确位于严重性堆栈顶部。
