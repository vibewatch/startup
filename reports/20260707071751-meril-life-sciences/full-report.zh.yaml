      - number: '1.3'
        title: 融资、估值与资本结构
        blocks:
          - type: paragraph
            body: >-
              Meril 的融资史公开程度足以证明势能，但还不足以拼出完全勾稽的全生命周期股权结构。Warburg Pincus 于 2022 年 2 月宣布向 Micro Life Sciences 进行约 US$210
              million 少数股权投资。CARE 后来称私募股权投资者在 Q1FY23 向 Micro 注入 ₹1,900 crore；但保留来源没有给出该项完整具名投资者名单，也没有把它与 Warburg
              交易的重合关系讲清。


              2025 年 7 月的 ADIA 交易文档扎实得多。ADIA 宣布以 US$200 million 投资取得 Micro Life Sciences 约 3% 股权，对 Meril 的企业价值估约 US$6.6
              billion。ICRA 和 CARE 进一步把口径收紧：交易总额约 ₹1,720 crore，其中约 ₹860 crore 是一级股权，剩余部分是 Bilakhia Holdings
              二级出售。同一组评级报告显示，快速扩张和营运资本累积把集团总债务推到 2025 年 3 月 31 日约 ₹2,592 crore，即便杠杆和流动性仍处在投资级舒适区。最干净的资本结论是：Meril
              是后期私营企业，融资能力强、评级达到投资级；但累计一级资本到底融了多少，公开来源仍有歧义。
