              结构性心脏是最清晰的直接对垒。Meril 推 Myval，但公开证据显示 Medtronic、Abbott 和 Edwards 已经拥有差异化 TAVR
              平台，并围绕架构、适应症和照护路径形成成熟主张。冠脉介入更混合：Meril 的 Evermine 50 一边对上 Boston Scientific 的 SYNERGY XD 等全球系列，一边面对 SMT
