  - id: FU001
    title: 按产品家族划分的客户旅程图
    type: journey-map
    layout: wide
    summary: Meril 各产品家族的客户旅程不同，但都依赖医生培训、术式证明和本地商业支持。
    data:
      nodes:
        - id: identify-clinical-need
          label: 识别临床需求
          description: 结构性心脏团队、骨科医生、MIS 医生和诊断买家，起点都是临床吞吐量或治疗缺口。
        - id: physician-evidence
          label: 医生证据与 KOL 验证
          description: 论文、注册研究、外科医生引述和试验数据，在客户转化前先建立信心。
        - id: training-enablement
          label: Meril Academy / 赋能
          description: Meril Academy 和同伴交流项目支撑医生导入、产品培训和本地商业化。
        - id: procurement-decision
          label: 采购 / 付款方决策
          description: 医院、实验室或渠道伙伴判断经济性和本地支持模型是否足以支撑购买或采用。
        - id: first-procedure
          label: 首次真实临床术式或部署
          description: 只有真实使用后出现具名场点或患者结果，客户证明才最有力。
        - id: expansion-loop
          label: 扩张与重复使用闭环
          description: 临床结果、服务质量和进入市场支持决定使用会扩大、停滞，还是保持受限。
    claimRefs:
      - CU001
      - CU004
      - CU006
      - CU007
      - CU008
      - CU029
      - CU037
  - id: FU002
    title: 从证据生成到规模化部署的采用流程
    type: flow
    layout: standard
    summary: Myval 从早期临床使用走到多国随访，路径最清楚；机器人业务仍处在更早阶段。
    data:
      nodes:
        - id: early-india-sites
          label: 早期多中心证明
          description: MyVal-1 起步于印度 14 个场点的 30 名患者，随后扩展到 30 多个场点。
        - id: multinational-rct
          label: 多国随机证据
          description: LANDMARK 将证明扩大到 16 个国家 31 个中心的 768 名患者。
        - id: publication-engine
          label: 发表与注册研究引擎
          description: Meril 的发表和临床项目页面记录了持续产出的注册研究和临床研究。
        - id: named-production-robotics
          label: 具名真实部署的机器人证明
          description: MISSO 在 Pluto Hospital 有公开真实使用证据和医生背书，但未披露装机基数。
        - id: scaled-commercial-unknown
          label: 规模化商业基数仍不透明
          description: Meril 未披露产品级活跃账户、续约或完整具名客户名单。
      edges:
        - from: early-india-sites
          to: multinational-rct
          label: 扩大规模
        - from: multinational-rct
          to: publication-engine
          label: 随访 + 传播
        - from: publication-engine
          to: named-production-robotics
          label: 外溢到其他产品家族
        - from: publication-engine
          to: scaled-commercial-unknown
          label: 缺少商业分母
        - from: named-production-robotics
          to: scaled-commercial-unknown
          label: 有证明但未披露基数
    claimRefs:
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
      - CU017
      - CU020
      - CU026
      - CU027
  - id: FU003
    title: 客户证明质量矩阵
    type: matrix
    layout: wide
    summary: 结构性心脏客户证明比更新的机器人证明集更深，也更具多国属性。
    data:
