  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 按当前价格评估 Meril 的 IC 式评分卡。
    data:
      items:
        - label: 经营动能
          value: 8/10
          detail: FY2025 收入、PAT 和利润率结构显示经营底子真实。
          tone: positive
        - label: 临床验证
          value: 7/10
          detail: Myval RCT 和广泛临床项目，支撑品类可信度。
          tone: positive
        - label: 全球触达
          value: 8/10
          detail: 150+ 个国家和广泛子公司布局，撑起规模，也留下出口可选性。
          tone: positive
        - label: 资本结构清晰度
          value: 2/10
          detail: CCPS 和近期轮次机制可见，但完整清算瀑布仍看不清。
          tone: negative
        - label: 资本效率
          value: 5/10
          detail: 利润率改善，但营运资本和 capex 仍然吃重。
          tone: neutral
        - label: 退出准备度
          value: 5/10
          detail: 机构背书是真的，但公开层面还看不到 IPO 等效披露桥接。
          tone: neutral
        - label: 估值纪律
          value: 3/10
          detail: 当前估值相对多数可比公司偏高，容错空间有限。
          tone: negative
    approximationNotes: 分数是供委员会使用的定性判断，锚定本章证据集，而不是机械模型。
    claimRefs:
      - CV017
      - CV022
      - CV029
      - CV037
      - CV046
      - CV047
      - CV048
      - CV049
      - CV055
