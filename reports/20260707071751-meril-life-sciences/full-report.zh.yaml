      - number: '2.3'
        title: 买方、用户、支付方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Meril 的产品组合卖进医院，但不是单一购买动作。冠脉支架由介入心脏病医生使用，但医院导管室、采购团队和报销现实共同决定经济账。Future Market Insights 将医院列为印度冠脉支架终端用户份额
              61.3%，这与批量采购和标准化路径控制一致。TAVR 的购买动作更窄：Medtronic 和 Edwards 都把疗法选择放在心脏团队、专科中心基础设施、随访协议和基于风险的临床适用性之中。这意味着 Meril
              的结构性心脏销售更少依赖广泛认知，更依赖拿下资质很高的医院项目。


              心脏病科之外，经济买方再次变化。骨科植入物和机器人膝关节系统落在骨科服务线和资本委员会手里，后者关心植入物对线、恢复和翻修风险。手术机器人需要医生拥护者、培训路径和与利用率绑定的资本支出理由。诊断自动化面向中心实验室、医院和居家检测场景，预算逻辑围绕吞吐量、差错降低和流程自动化，而不是单台手术报销。所有细分里，患者是下游受益者，有时也是需求信号；但真正守门的仍是付费机构或支付框架——医院资本预算、手术报销、招标定价或实验室
              OPEX。因此，采用路径设计和买方教育与产品技术同样关键。
