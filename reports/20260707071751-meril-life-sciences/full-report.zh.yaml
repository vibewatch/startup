      - number: '3.3'
        title: 定价姿态、锁定、多供应商并用与分销力量
        blocks:
          - type: paragraph
            body: >-
              公开记录支持方向性而非数字化定价结论。Meril
              的一体化制造足迹和宽产品组合暗示其偏价值型定位，尤其适用于新兴市场或价格敏感账户；但公开材料没有披露实际成交价，投资者无法据此承销精确价格领导力。这个不透明性很重要，因为切换成本在品类间差异极大。冠脉支架通常更容易在导管室内多供应商并用，医院可以同时备多个
              SKU。TAVR 和机器人更难。Medtronic
              的患者随访流程、瓣膜卡流程和更广的手术基础设施说明，器械选择会延伸到植入物本身之外。机器人还叠加资本设备、培训、流程重塑和服务义务，使装机基数领先者更黏。Meril
              确实有真实分销触达，也能跨品类打包；但在锁定最重要的品类里，更大的上市公司竞争者仍享有更深披露、融资渠道和账户控制杠杆。
