  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 经营验证和临床广度支撑跟踪兴趣；但资本结构不透明、当前估值偏高，限制了投资确信度。
    data:
      nodes:
        - id: scale
          label: 规模化经营基础
          detail: FY2025 收入 Rs. 4,902.9 crore；PAT Rs. 729.4 crore；出口占 61%。
          tone: positive
        - id: clinical
          label: 临床与品类验证
          detail: Myval RCT 支撑，临床项目广，覆盖多个治疗领域。
          tone: positive
        - id: access
          label: 资本渠道与机构背书
          detail: Warburg 与 ADIA 共同证明投资人有胃口，融资渠道打得开。
          tone: positive
        - id: overhang
          label: 清算瀑布与诉讼拖累
          detail: CCPS、一级加二级交易结构和诉讼成本，让股权价值更难看清。
          tone: negative
        - id: price
          label: 当前估值偏高
          detail: ADIA 隐含约 11.6x FY2025 收入，高于大多数多元化医疗科技可比公司。
          tone: warning
        - id: call
          label: 跟踪
          detail: 等价格更好，或拿到结构性保护，再上调至买入。
          tone: neutral
      edges:
        - from: scale
          to: call
        - from: clinical
          to: call
        - from: access
          to: call
        - from: overhang
          to: price
        - from: price
          to: call
    approximationNotes: 本图是逻辑图，不是统计模型；与价值相关的节点来自截至运行日的公开及准公开证据。
    claimRefs:
