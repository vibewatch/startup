summary:
  headline: |
    Meril 是一家规模真实的印度 medtech 平台，已披露盈利能力并有出口触达；但 Myval 诉讼仍在进行、资本强度高，且 July 2025 估值已隐含高端 medtech 倍数，因此只能给观察判断。
