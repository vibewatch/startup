  topStrengths:
    - 真实经营规模已跑出来：ICRA 披露 FY2025 合并收入 Rs. 4,902.9 crore、经营利润率 26.4%，这类透明度在私营 medtech 公司中少见。
    - 产品和地理覆盖都宽：官方材料称服务 150+ 个国家、拥有 35+ 家子公司，治疗领域也不止一个单品押注。
    - 机构背书扎实：Warburg Pincus（2022）和 ADIA（2025）均已投资，使 Meril 比多数印度私营医疗器械厂商更有可信外部支持。
    - 结构性心脏业务有临床可选性：Myval 拥有随机试验证据和广泛临床项目，能支撑其从普通植入物走向高端品类的野心。
  topRisks:
    - Edwards/Myval 在欧洲的专利纠纷已限制市场准入，据报道累计法律成本约 Rs. 500-550 crore。
    - July 2025 ADIA 估值约为 FY2025 收入 11.6x，显著高于多数多元化 medtech 同行，而公开披露质量明显更弱。
    - 营运资本、债务和资本开支仍重：FY2025 NWC/OI 为 53.8%，总债务达到 Rs. 2,592.5 crore，FY2026 仍计划资本开支 Rs. 500-600 crore。
    - 公开承销缺口仍大：未披露股权结构 waterfall、客户集中度、实际成交价格、烧钱速度或分部毛利率。
  unresolvedGaps:
    - 完整股权结构表、CCPS / 优先权 waterfall，以及 ADIA 股东权利条款。
    - 受诉讼限制影响的 Myval 产品和地区对应收入、毛利及 backlog 敞口。
    - 按主要产品线披露的客户集中度、经销商经济性、实际 ASP，以及收入确认政策。
    - 当前资本开支和营运资本需求之后的月度烧钱、现金跑道，以及 FY2026-FY2027 现金流桥接。
    - 机器人业务的装机基础、服务经济性和经常性收入画像。
