companyProfile:
  summary: >
    Meril is a Vapi, Gujarat-based Indian medical-device group centred on Micro Life Sciences Private Limited and the Meril Life Sciences
    operating entities. Public materials place the brand's founding in 2006 and describe a broad product stack spanning cardiovascular
    devices, structural heart, orthopaedics, diagnostics, endo-surgery, and robotics. Official pages claim more than 12,000 employees,
    service in 150+ countries, and 35+ owned subsidiaries, while ICRA disclosed FY2025 consolidated revenue of Rs. 4,902.9 crore with
    61% export contribution and a 26.4% operating margin. The company raised ~US$210M from Warburg Pincus in 2022 and a further
    US$200M from ADIA in 2025 at an implied ~US$6.6B valuation, but still carries high working-capital intensity, rising debt, large
    capex needs, and unresolved litigation over the Myval valve platform.
  foundedDate: "2006-01-01"
  founders:
    - name: "Shahid Bilakhia"
      role: "Founding member / promoter"
      background: "Public trade-press coverage identifies Shahid Bilakhia as a founding member of Micro Life Sciences, while investor materials describe Meril as founded by the Bilakhia family."
      claimRefs: ["CO011", "CO012", "CO013"]
  foundingLocation: "Vapi, Gujarat, India"
  headquarters: "Vapi, Gujarat, India"
  productSummary: >
    Meril designs, manufactures, and distributes medical devices across cardiovascular intervention and structural heart, orthopaedic
    implants, endo-surgery, diagnostics, and surgical robotics, with flagship products including the Myval THV platform, stent lines,
    joint implants, MISSO/Cuvis robotics, and Merilyzer diagnostics.
  customerFocus: >
    Hospitals, surgeons, interventional cardiologists, orthopaedic providers, distributors, and healthcare systems across India and
    export markets; buyers vary by line between hospital procurement, distributor channels, and specialist physician-led adoption.
  businessModel: >
    Capital-intensive medtech manufacturer model: Meril earns revenue from device and implant sales, distributor and export channels,
    diagnostics instruments and consumables, and emerging capital-equipment/service-style robotics activity, while also funding ongoing
    clinical-program and physician-training infrastructure to support adoption.
  stage: "Late-stage private / pre-IPO"
  fundingStatus: >
    Warburg Pincus announced a ~US$210M minority investment in 2022. ADIA announced a US$200M investment for an approximately 3% stake
    in July 2025 at an implied ~US$6.6B valuation; rating agencies say only about Rs. 860 crore was fresh primary capital and the rest
    was secondary liquidity for Bilakhia Holdings.
