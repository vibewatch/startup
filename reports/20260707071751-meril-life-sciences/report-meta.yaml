summary:
  headline: >
    Meril is a real, scaled Indian medtech platform with disclosed profitability and export reach, but live Myval litigation,
    heavy capital intensity, and a July 2025 valuation already implying premium medtech multiples support only a Track call.
  overallScore: 6.1
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
