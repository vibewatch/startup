        - Meril lacks equivalent publicly disclosed label breadth and installed-base evidence
      - - Boston Scientific SYNERGY XD
        - Coronary incumbent
        - Public medtech with focused coronary franchise
        - Interventional cardiology / DES buyers
        - Established everolimus-eluting stent franchise
        - Category depth is narrow compared with Meril's broader portfolio but stronger inside coronary
      - - SMT / Supraflex Star
        - Direct coronary peer
