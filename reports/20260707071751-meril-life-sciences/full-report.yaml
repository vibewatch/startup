companyProfile:
  summary: >
    Meril is a Vapi, Gujarat-based Indian medical-device group centred on Micro Life Sciences Private Limited and the
    Meril Life Sciences operating entities. Public materials place the brand's founding in 2006 and describe a broad
    product stack spanning cardiovascular devices, structural heart, orthopaedics, diagnostics, endo-surgery, and
    robotics. Official pages claim more than 12,000 employees, service in 150+ countries, and 35+ owned subsidiaries,
    while ICRA disclosed FY2025 consolidated revenue of Rs. 4,902.9 crore with 61% export contribution and a 26.4%
    operating margin. The company raised ~US$210M from Warburg Pincus in 2022 and a further US$200M from ADIA in 2025 at
    an implied ~US$6.6B valuation, but still carries high working-capital intensity, rising debt, large capex needs, and
    unresolved litigation over the Myval valve platform.
