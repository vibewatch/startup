            body: >-
              Unlike many private medtech names, Meril has enough third-party operating disclosure to justify a real
              comparable exercise. ICRA reported FY2025 operating income of Rs. 4,902.9 crore, PAT of Rs. 729.4 crore,
              OPBDIT margin of 26.4%, and 61% export contribution, which collectively establish real scale and
              profitability. Meril also appears to have substantive product breadth: official pages describe
              150-plus-country reach, 35-plus subsidiaries, broad therapy exposure, a visible structural-heart clinical
              program, and an expanding partnership footprint in Japan. That said, the right peer set is a
              ceiling-and-floor exercise rather than a perfect comp basket. Meril is too diversified to be treated as
              Intuitive Surgical, whose pure-play robotics premium remains much richer, but too growthy and clinically
              differentiated to be benchmarked only to broad diversified medtech at 3-4x revenue. Edwards is the most
              useful specialist middle point, while Medtronic, Abbott, and Boston Scientific establish how harshly
              public markets price scaled-but-diversified device portfolios when disclosure is abundant and growth is
              more mature.
