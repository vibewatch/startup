  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Portfolio-Led Battlefield: Meril Competes Across Several Device Arenas, Not One'
        blocks:
          - type: paragraph
            body: >-
              Meril's competitive problem is unusual for a private medtech company because it does not sit inside a
              single narrowly defined category. Public company materials show Meril spanning vascular intervention,
              orthopedics, robotics, diagnostics, and adjacent surgical categories while serving more than 150 countries
              through 35 or more subsidiaries. That breadth gives Meril more ways to enter a hospital account than a
              single-product startup, but it also means Meril runs into different competitor types at the same time:
              structural-heart incumbents in TAVR, coronary-stent incumbents and Indian peers in interventional
              cardiology, installed-base leaders in orthopedic and laparoscopic robotics, and a broad diagnostics field
              that remains thinly evidenced in the current source set. The result is a portfolio-led battlefield where
              Meril's own cross-category reach is a strength, but one that does not remove the need to win category by
              category against better-capitalized specialists.
