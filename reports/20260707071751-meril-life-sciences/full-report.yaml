      - number: '3.4'
        title: Moat Durability, Commoditization Risk, and Adverse Competitive Evidence
        blocks:
          - type: paragraph
            body: >-
              Meril's moat is most defensible where its own manufacturing depth and portfolio span let it compete on
              breadth plus value, but it is least durable where incumbents combine regulatory maturity, installed base,
              service infrastructure, and richer public evidence. The clearest adverse sign is not one catastrophic data
              point; it is the pattern of asymmetry. Meril's home page itself discloses country-availability limits for
              Myval variants. MISSO is visible as a product direction, but the public record still frames it as a
              developing knee robot rather than a deployed multi-procedure franchise. HandX confirms adjacency in
              laparoscopic robotics, yet the disclosure is too thin to establish broad commercial traction. Diagnostics
              looks strategically adjacent, but the current source set cannot prove category leadership. Against this
              backdrop, Meril's primary displacement risk is category-specific incumbent depth from TAVR leaders,
              coronary franchises, and robotics platforms such as Mako and da Vinci. That makes the current competitive
              judgment clear: Meril has enough breadth to stay relevant, but not enough public evidence yet to claim
              durable superiority over the best-positioned incumbents.
