    data:
      nodes:
        - id: revenue
          label: Strong revenue growth
          detail: FY2025 revenue reached Rs. 4,902.9 crore and Q1 FY2026 stayed strong.
          tone: positive
        - id: wc
          label: Working-capital build
          detail: 53.8% NWC/OI, 212 inventory days, and high debtor levels tie cash into growth.
          tone: negative
        - id: capex
          label: Manufacturing / robotics / MMIPL capex
          detail: Rs. 600 crore in FY2025 and another Rs. 500-600 crore planned in FY2026.
          tone: negative
        - id: debt
          label: Debt and repayment obligations
          detail: Total debt Rs. 2,592.5 crore plus scheduled repayments through FY2028.
          tone: negative
        - id: liquidity
          label: Liquidity buffers
          detail: Rs. 593 crore free cash, ADIA primary infusion, and Rs. 315.1 crore undrawn WC lines.
          tone: neutral
        - id: litigation
          label: Litigation / regulatory overhang
          detail: Myval legal spend and price-regulation risk can absorb cash unexpectedly.
          tone: negative
        - id: verdict
          label: Adequate but not self-funding
          detail: Public data supports near-term adequacy, not proven free-cash-flow independence.
          tone: neutral
      edges:
        - from: revenue
          to: wc
          label: Growth needs stock and credit
        - from: revenue
          to: capex
          label: Scale-out investment
        - from: capex
          to: debt
          label: Funded with term debt + accruals
        - from: wc
          to: liquidity
          label: Absorbs cash buffer
        - from: debt
          to: verdict
          label: Adds fixed obligations
        - from: liquidity
          to: verdict
          label: Offsets near-term strain
        - from: litigation
          to: verdict
          label: Potential downside shock
    approximationNotes: >-
      The map is directional rather than a cash-flow statement. It emphasizes recurring balance-sheet demands visible in
      ICRA and the ADIA transaction rather than attempting an unsupported free-cash-flow estimate.
    claimRefs:
      - CI022
