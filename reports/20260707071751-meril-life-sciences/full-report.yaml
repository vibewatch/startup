  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Litigation & Market-Access Risk
        blocks:
          - type: paragraph
            body: >-
              Litigation and market-access risk is the clearest red flag because European court outcomes are already
              constraining commercial freedom rather than representing a hypothetical future dispute. The UPC Court of
              Appeal upheld the core Edwards patent, left the injunction architecture largely intact, and the April 2025
              suspensive-effect order shows Meril had already been compelled to execute recall, destruction,
              information, and interim-damages obligations while appeal proceedings continued. Meril's own homepage now
              carries a disclaimer that Myval systems are unavailable in multiple European jurisdictions and not
              approved for U.S. sale, making the dispute visible in customer-facing channel language. The U.S.
              safe-harbor win is helpful, but it protects pre-approval activities rather than conferring operating
              freedom. FDA's PMN database entry for Meril Endo Surgery's K233386 trocar filing shows that even Meril's
              limited U.S. footprint sits inside a product-specific clearance regime with named applicant,
              classification, and decision trail. Add CCI approval gating to the ADIA transaction, and regulatory/legal
              dependencies sit squarely at the top of the severity stack.
