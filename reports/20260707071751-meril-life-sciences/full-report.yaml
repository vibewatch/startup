      - number: '1.4'
        title: Scale, milestones, and adverse events
        blocks:
          - type: paragraph
            body: >-
              The operating story is one of broadening product scope and rising global ambition. Public sources show
              Meril moving from cardio-focused milestones such as Myval’s CE and CDSCO approvals into a broader platform
              spanning robotics, endo-surgery, diagnostics, and export distribution. By 2025 the group was generating
              ₹4,902.9 crore of consolidated revenue, spending heavily on R&D, and planning further capacity expansion
              in Vapi. Product and regulatory milestones include the LANDMARK Myval results, the Myval Octapro launch,
              the MeRes100 CE milestone, an FDA 510(k) for the Monik trocar, Japan Lifeline’s distribution alliance for
              Japan, and continuing robotics rollout under MISSO.


              The main adverse overlay is the Edwards heart-valve litigation. CARE and ICRA both identify the Myval
              patent dispute as a ratings constraint, while EPLAW and the UPC order show that the issue had already
              crystallised into a serious November 2024 Munich decision with injunction, recall/destruction orders, and
              preliminary damages. ICRA adds that cumulative legal costs had already reached roughly ₹500-550 crore by
              March 2025. That makes the company overview balanced: Meril is clearly scaled and still accelerating, but
              it is doing so while carrying an expensive and strategically important litigation overhang in one of its
              flagship cardiovascular franchises.
