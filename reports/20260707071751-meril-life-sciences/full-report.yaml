  - id: FV001
    title: Recommendation Logic
    type: flow
    layout: wide
    summary: >-
      Shows how operating proof and clinical breadth support interest, while capital-structure opacity and a rich
      current mark limit conviction.
    data:
      nodes:
        - id: scale
          label: Scaled operating base
          detail: FY2025 revenue Rs. 4,902.9 crore; PAT Rs. 729.4 crore; 61% exports.
          tone: positive
        - id: clinical
          label: Clinical and category proof
          detail: Myval RCT support, broad clinical programs, and multiple therapy areas.
          tone: positive
        - id: access
          label: Capital access and sponsorship
          detail: Warburg plus ADIA validate investor appetite and financing access.
          tone: positive
        - id: overhang
          label: Waterfall and litigation overhang
          detail: CCPS, mixed primary-secondary deal structure, and litigation costs obscure equity value.
          tone: negative
        - id: price
          label: Rich current mark
          detail: ADIA implies roughly 11.6x FY2025 revenue, above most diversified medtech comps.
          tone: warning
        - id: call
          label: TRACK
          detail: Wait for better price or structural protection before upgrading to Buy.
          tone: neutral
      edges:
        - from: scale
          to: call
        - from: clinical
          to: call
        - from: access
          to: call
        - from: overhang
          to: price
        - from: price
          to: call
    approximationNotes: >-
