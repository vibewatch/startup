      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: This is not a narrative-only private medtech name
            body: >-
              Meril already looks like a scaled operating company rather than a pure venture bet: ICRA disclosed nearly
              Rs. 4,903 crore of FY2025 revenue, 26.4% OPBDIT margin, Rs. 729.4 crore of PAT, and 61% export
              contribution. That level of disclosed operating substance is rare for a private Indian medtech platform
              and explains why institutional capital can support a premium mark.
            calloutType: strength
            claimRefs:
              - CV011
              - CV013
