          - type: callout
            title: The headline EV is cleaner than the equity story
            body: >-
              ADIA’s USD 6.6 billion enterprise-value signal is real, but public evidence also confirms CCPS history,
              mixed primary-secondary proceeds, heavy working-capital needs, and ongoing litigation costs. Without the
              full fully diluted waterfall, an investor cannot assume that enterprise value equals clean common-equity
              value.
            calloutType: risk
            claimRefs:
