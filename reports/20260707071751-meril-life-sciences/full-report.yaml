        - Price-sensitive and performance-sensitive DES buyers
        - Flexibility, trackability, and conformability claims
        - Narrower portfolio breadth than Meril outside coronary
      - - Stryker Mako 4
        - Orthopedic-robot incumbent
        - Public medtech with annual-report disclosure
        - Joint-replacement and spine orthopedic accounts
