  - id: TV004
    title: Bull / Base / Bear Scenario Table
    columns:
      - Scenario
      - Assumptions
      - Valuation range
      - Probability signal
      - Key risk
    rows:
      - - Bull
        - >-
          High-teens or better growth persists, margins stay near FY2025 levels, structural-heart clinical proof keeps
          comping well, and partnership-led expansion plus premium-category optionality narrow the disclosure discount
        - USD 7.0B-8.0B
        - Low-Medium; requires premium category execution and cleaner disclosure bridge
        - The business remains too diversified and opaque to earn Intuitive-like treatment
      - - Base
        - >-
          Growth remains healthy, margins hold, capex ramps without leverage stress, and Meril preserves strategic
          optionality without a further valuation step-up
        - USD 5.5B-6.5B
        - Medium; broadly consistent with current fundamentals and the ADIA round
        - Current price already uses much of this upside, leaving limited margin for error
      - - Bear
        - >-
          Growth cools, litigation or capex absorbs management attention, working capital stays heavy, and the market
          re-rates Meril closer to Edwards-like or diversified-medtech territory
        - USD 4.0B-4.8B
        - Medium; plausible if multiple downside vectors hit at once
        - Unknown preference stack could make common-equity outcomes worse than the headline range implies
    notes: >-
      Scenario ranges are judgment-based outputs anchored on disclosed FY2025 revenue, public medtech comparables, and
      the known private marks at USD 5.0B and USD 6.6B.
    claimRefs:
      - CV021
      - CV022
      - CV037
      - CV038
      - CV039
      - CV048
      - CV049
      - CV050
  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Down-round or secondary reset
        - A credible new financing below the late-2024 ~USD 5.0B indication
        - Would show the ADIA mark was not durable and that the private market now demands a lower clearing price
        - Re-cut the valuation to the bear range and suspend any buy case
      - - Margin / cash-conversion deterioration
        - Material slippage below FY2025 profitability or worsening working-capital drag
        - Would challenge the idea that Meril can scale premium categories without bloating capital needs
        - Move from Track toward Avoid until cash economics are re-proven
      - - Adverse litigation step
        - Court or settlement outcome that materially impairs Myval economics or growth flexibility
        - Hits both clinical-premium narrative and free-cash-value bridge
        - Immediately re-underwrite structural-heart contribution and downside reserve needs
      - - Capex without utilization
        - FY2026-27 expansion proceeds but new capacity does not convert into revenue mix or export gains
        - Would reduce returns on invested capital and compress what investors pay for the growth story
        - Lower scenario weights on base and bull; demand lower entry price
      - - Opaque waterfall at signing
        - Management will not disclose fully diluted ownership, CCPS terms, or liquidation ordering
        - Prevents underwriting equity value even if the enterprise story stays strong
        - Do not move from Track to Buy without structural protection
    notes: >-
      The trigger set focuses on events that would change valuation, not just company quality; item five is a diligence
      kill criterion rather than an operating KPI.
    claimRefs:
      - CV009
      - CV010
      - CV018
      - CV021
      - CV022
      - CV050
      - CV057
  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Cap table and liquidation waterfall
        - Fully diluted share count, CCPS terms, investor rights, and ordering of proceeds
        - Determines how much of the headline EV actually belongs to new common equity
        - Management, company counsel, shareholder register, and transaction documents
      - - ADIA transaction terms
        - SPA, secondary-sale mechanics, governance rights, and any ratchets or side letters
        - Needed to understand whether the 2025 mark is clean price discovery or partly structured protection
        - Management, ADIA process counsel, and board materials
      - - Segment-level economics
        - >-
          Revenue, gross margin, and working-capital intensity by structural heart, orthopedics, diagnostics,
          endo-surgery, and robotics
        - >-
          Clarifies whether the premium narrative is carried by the most valuable categories or by lower-multiple
          businesses
        - Finance data room and FY2026 management accounts
      - - Litigation reserve and scenario memo
        - Latest docket summary, damages range, insurance/recovery assumptions, and commercial contingency plan
        - Valuation downside is highly sensitive to cardiovascular litigation outcomes
        - Outside counsel memo plus CFO reserve schedule
      - - Cash conversion and deployment
        - Inventory turns, receivable aging, and where the undrawn / newly raised capital is being deployed
        - Heavy working-capital drag can make a rich revenue multiple unsustainable
        - Treasury package and operating dashboard
      - - Exit route preparedness
        - IPO workstreams, bankers, board readiness, or live strategic-process evidence
        - Exit path affects both timing and the right comp framework for today's entry decision
        - Board materials, bankers, and management interviews
    notes: >-
      These asks are ordered by valuation materiality; the first three are gating items for any move beyond Track at
      current pricing.
    claimRefs:
      - CV009
      - CV010
      - CV022
      - CV045
      - CV050
      - CV056
