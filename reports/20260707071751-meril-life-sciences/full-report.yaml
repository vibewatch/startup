  - id: FR001
    title: 'Meril Risk Heatmap: Severity vs Likelihood'
    type: matrix
    layout: wide
    summary: >-
      Principal Meril downside vectors placed by residual severity and likelihood after considering disclosed
      mitigations.
    data:
      columns:
        - Low Likelihood
        - Medium Likelihood
        - High Likelihood
      rows:
        - label: Litigation / Market Access
          values:
            - Further appeal relief narrows restrictions
            - Legal costs persist but commercial impact stabilises
            - Restricted Myval geographies remain closed and enforcement widens
        - label: Regulatory / Pricing
          values:
            - No new price-control action
            - Existing caps persist but mix offsets pressure
            - NPPA or other approvals materially compress pricing and launch timing
        - label: Clinical / Safety
          values:
            - No meaningful new signal emerges
            - Evidence matures but remains mixed
            - Rare severe event or weak comparative data triggers hesitation
        - label: Operations / Quality
          values:
            - Systems scale smoothly
            - Complexity raises manageable friction
            - Multi-therapy compliance and site concentration create service or quality disruption
        - label: Financial Model
          values:
            - Cash conversion improves materially
            - Growth stays strong but working capital remains heavy
            - Debt, capex, and inventory outpace cash generation
        - label: Robotics Execution
          values:
            - MISSO commercialises efficiently
            - India proof develops but global scale is slow
            - Robotics absorbs support spend without meaningful installed-base traction
    approximationNotes: >-
