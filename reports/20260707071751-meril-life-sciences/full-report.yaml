            title: Price and evidence both need to improve
            body: >-
              Meril deserves active diligence because the business quality is visible, but a new investor should demand
              either a lower entry level closer to the 2024 pre-IPO range or explicit downside protection. At today’s
              headline price, the committee is underwriting too much hope relative to the disclosure quality still
              available publicly.
            calloutType: recommendation
