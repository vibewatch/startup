      - number: '7.3'
        title: Operational Breadth & Execution Risk
        blocks:
          - type: paragraph
            body: >-
              Operational and execution risk flows from scale plus breadth. Meril publicly describes a footprint
              spanning more than 150 countries, at least 35 subsidiaries, and a product stack that ranges from valves
              and stents to diagnostics, endo-surgery, and robots. That breadth can be a moat, but it also multiplies
              quality-system, post-market, training, and service obligations. The older CDSCO CLAA approval list shows
              that Meril's Vapi campus had already been licensed for a long orthopaedic SKU roster by 2015, underscoring
              how much regulatory record-keeping and plant-level quality assurance concentrate around that site. The
              robotics push is particularly execution-sensitive. MISSO has credible technical aspirations and some early
              hospital proof points, yet 2024 coverage still framed CE and U.S. FDA approvals as pending and benchmarked
              Meril against much more mature orthopedic robot ecosystems from Stryker and Zimmer. Public disclosure also
              leaves gaps: the careers page is thin, headcount figures vary sharply across sources, and entity lists on
              official pages are less expansive than third-party legal-entity directories. Those inconsistencies raise
              diligence questions about governance, reporting lines, and scaling depth.
