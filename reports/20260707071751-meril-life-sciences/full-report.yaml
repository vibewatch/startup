      - number: '3.2'
        title: Direct Peers, Incumbents, and Adjacent Alternatives by Product Line
        blocks:
          - type: paragraph
            body: >-
              Structural heart is the clearest direct-incumbent contest. Meril markets Myval, but the public evidence
              shows Medtronic, Abbott, and Edwards already field differentiated TAVR platforms with mature claims around
              architecture, indications, and care pathways. Coronary intervention is more mixed: Meril's Evermine 50
              competes against global franchises like Boston Scientific's SYNERGY XD while also facing Indian peers such
              as SMT, whose Supraflex Star is positioned around flexibility and deliverability. Orthopedic robotics is
              earlier-stage for Meril. MassDevice describes MISSO as a knee-focused robot under development, while
              Stryker already markets a fourth-generation Mako platform spanning hip, knee, partial knee, and spine. In
              soft-tissue robotics, Intuitive's da Vinci system remains the broadest disclosed platform, and Meril's
              public HandX disclosure confirms adjacency but not comparable commercial maturity. Diagnostics rounds out
              the portfolio, yet its direct rival set is the least developed in the current public evidence and
              therefore the least supportable to overstate.
            claimRefs:
              - CP009
              - CP010
              - CP012
