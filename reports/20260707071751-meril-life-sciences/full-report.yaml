  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, portfolio scope, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Meril should not be analyzed as a single-product medtech company. Its public portfolio spans vascular
              intervention, orthopedic implants, surgical robotics or endo-surgery, and in-vitro diagnostics, so the
              relevant market is a portfolio of device categories with different buyers, substitutes, and pricing logic.
              The broadest outer boundary is India's medical devices sector, which official and industry sources
              describe as a fast-growing but still import-dependent market. Inside that broad frame, Meril's clearest
              publicly evidenced revenue pools are cardiovascular implants and structural heart products: drug-eluting
              stents, bioresorbable scaffolds, balloon catheters, and TAVR systems. Orthopedics, surgical robots, and
              diagnostics extend the company into different hospital budgets, but the retained source set does not
              provide equally strong public market-size data for each of those segments.


              The substitute set also changes by segment. In coronary intervention, Meril competes against conventional
              metallic stents and the broader PCI treatment stack; in structural heart it competes against incumbent
              TAVR systems and against the open- surgery pathway that minimally invasive valves seek to displace. In
              orthopedic implants and robotic knee systems, the comparison point is conventional arthroplasty
              instrumentation and incumbent robotic workflows rather than cardiology budgets. In diagnostics, Meril
              competes against manual or semi-automated workflows, central-lab incumbents, and lower- cost point-of-care
              alternatives. The key implication is that any headline TAM built from “medical devices” alone will
              overstate Meril's serviceable opportunity unless it is narrowed to the hospital programs, clinical
              specialties, and reimbursement environments that actually buy the relevant devices.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
