      - number: '5.4'
        title: Trust, Quality Controls, Deployment Support, and Roadmap
        blocks:
          - type: paragraph
            body: >-
              Meril’s public trust signals are strongest where hard regulatory or publication infrastructure is visible.
              The FDA clearance letter for Monik shows explicit exposure to design controls, CAPA, device master record
              discipline, labeling controls, adverse-event reporting, and GMP obligations. The CDSCO medical-device
              portal provides the Indian regulatory backdrop for software, sterilization outsourcing, and testing-lab
              requirements. Meril’s own clinical-publications portal, which lists hundreds of cardiovascular papers and
              dozens of orthopedic entries, suggests that evidence generation is part of the operating model rather than
              a side activity.


              Even so, the disclosure pattern leaves material gaps. MISSO’s cost, planning-time, and success-rate claims
              are still mostly company-led; public sources do not disclose the software lifecycle or cybersecurity
              standards behind robotics and diagnostics; and Meril’s public developer signal is thin enough that outside
              observers must infer technical maturity from publications, partner surfaces, and regulatory filings
              instead of repos, API docs, or public release notes. The roadmap is visible but asymmetric: Myval
              continues to publish and launch follow-on valves, MISSO still appears to be working through CE/USFDA
              expansion, and the company’s broad geographic claims are not matched by a clean country-by-country SKU
              approval matrix. That makes Meril look execution-capable, but still under-disclosed on serviceability and
              governance details that matter for diligence.
