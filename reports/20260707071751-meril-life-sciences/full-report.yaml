  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Mix, and Pricing Visibility
        blocks:
          - type: paragraph
            body: >-
              Meril monetises a diversified medical-device portfolio rather than a single SKU. Official and
              credit-agency evidence points to five therapy areas — cardiovascular and structural heart, orthopaedics,
              endo-surgery, diagnostics, and surgical robotics — with product breadth exceeding 100 technologies. ICRA
              gives the cleanest current mix disclosure: vascular intervention contributed around 35% of FY2025 revenue
              and orthopaedics around 30%, with the balance spread across diagnostics, endo-surgery, robotics-related
              activity, and other group operations. A 2024 Economic Times report citing CARE data suggests the
              historical mix was similarly diversified, though somewhat more concentrated in cardiovascular implants.
              Export revenue is the economic engine: ICRA says exports contributed about 61% of FY2025 consolidated
              revenue, while Mint reported about 55% and official pages show a footprint across 150+ countries and 35+
              subsidiaries. Myval appears to be a particularly important quality-of-revenue driver because ICRA
              attributes margin expansion to better export realisations and 84% export contribution for that flagship
              valve line in FY2025.


              What remains missing is public pricing transparency. Meril’s official public surfaces market the breadth
              of the portfolio but do not disclose list pricing, realised pricing, contract structure, or a
              revenue-recognition policy. That matters because the economic model likely differs by line: implants
              monetise per procedure or per implant, endo-surgery depends on disposable and device throughput,
              diagnostics mixes instruments and consumables, and robotics adds capital-equipment and service-style
              revenue characteristics. Domestic pricing flexibility is also constrained. ICRA explicitly notes pricing
              pressure in stents and some orthopaedic implants and links sector economics to NPPA regulation of stents
              and knee implants, meaning public growth should not be confused with unconstrained price power. The result
              is a revenue base that looks broad and growing, but still only partially transparent on realised price and
              mix quality.
