  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation Context and Price Support
        blocks:
          - type: paragraph
            body: >-
              The cleanest current price signal is the July 2025 ADIA transaction: approximately USD 200 million for
              about 3% of Micro Life Sciences, implying an enterprise value near USD 6.6 billion. That is meaningfully
              above the late-2024 press discussion of a USD 5 billion pre-IPO round and well above the roughly USD 2
              billion level implied by Economic Times reporting on Warburg’s 2022 entry. Price support is not fictional
              — a sovereign investor actually paid into the story — but public evidence also shows that the 2025 round
              was not a simple new-money mark. ICRA said only around half of the proceeds were primary capital and the
              remainder was a secondary sale by BHPL, while the company already had CCPS in the stack from FY2023. That
              means the headline EV is helpful as a top-of-funnel signal, but not a reliable proxy for what a new
              common-equity investor would realize without a full waterfall model. In short, Meril has a market-clearing
              private mark, but not yet a market-clearing public-equity disclosure standard.
