      - number: '1.3'
        title: Funding, valuation, and capital structure
        blocks:
          - type: paragraph
            body: >-
              Meril’s financing history is public enough to establish momentum, but not precise enough to produce a
              fully reconciled lifetime cap-table number. Warburg Pincus announced a ~US$210 million minority investment
              into Micro Life Sciences in February 2022. CARE later said private-equity investors infused ₹1,900 crore
              into Micro in Q1FY23, but the retained source set does not provide a fully named investor roster for that
              line item or make overlap with the Warburg transaction perfectly explicit.


              The July 2025 ADIA transaction is far better documented. ADIA announced a US$200 million investment for an
              approximately 3% stake in Micro Life Sciences, valuing Meril at about US$6.6 billion enterprise value.
              ICRA and CARE sharpen that further by stating that the transaction was about ₹1,720 crore in total, of
              which roughly ₹860 crore was primary equity and the remainder was a Bilakhia Holdings secondary sale. On
              debt, the same rating reports show that rapid expansion and working-capital build pushed total group debt
              to roughly ₹2,592 crore by March 31, 2025, even as leverage and liquidity remained within investment-grade
              comfort bands. The cleanest capital takeaway is therefore: late-stage private, strongly financed,
              investment-grade rated, but with public-source ambiguity around exact cumulative primary capital raised.
