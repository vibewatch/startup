          - type: callout
            title: Price caps and litigation are the two non-obvious monetization brakes
            body: >-
              Meril can operate in growing markets and still under-earn them. Stent and knee-implant price controls cap
              pricing upside in two adjacent categories, while the Myval patent dispute shows that even clinical
              differentiation may not translate into unconstrained market access when trust, licensing, and legal
              barriers tighten.
            calloutType: risk
            claimRefs:
