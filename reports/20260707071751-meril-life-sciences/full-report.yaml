  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base segmentation by buyer, user, payer, geography, and use case
        blocks:
          - type: paragraph
            body: >-
              Meril's customer base is best understood as a portfolio of clinical segments rather than a single medtech
              account base. On the cardiovascular side, Myval is sold into TAVI/TAVR programs run by interventional
              cardiologists, structural-heart teams, and hospital cath labs. The direct users are physicians and
              cath-lab teams; the buyer and payer are hospitals and health systems that fund valve inventory, procedure
              infrastructure, and physician training. Meril's diagnostics division targets a different buying
              center—central laboratories, hospitals, and home-testing channels—while orthopedics and surgical robotics
              sell into joint-replacement centers, orthopedic surgeons, and operating-theatre administrators.

              The company's geography and route-to-market model are also mixed. Meril's global about page says it serves
              more than 150 countries and operates 35-plus owned subsidiaries, while the contact page lists fully owned
              entities in India, the US, Germany, Brazil, Russia, South Africa, Bangladesh, and Turkey plus academy
              locations in India, Turkey, Spain, and Russia. That points to a hybrid direct-sales model in key markets
              layered on top of a much wider indirect footprint. Meril Life GmbH's Europe site further advertises
              9,000-plus customers and 2,600-plus channel partners, which suggests channel leverage is material even if
              the company does not disclose how that mix breaks down by product line or region.

              Product-specific user stories reinforce that segmentation. Human Xtensions' HandX site markets a compact,
              handheld robotic-laparoscopy system for surgeons and OR teams that want robotic dexterity without a large
              OR footprint, while Meril's orthopedics page emphasizes implants and robotics used in more than 50
              countries and backed by surgeon counsel. MISSO is positioned even more explicitly around underserved
              orthopedic demand, affordability, and adoption beyond metro hospitals. The result is a customer base
              spanning high-acuity heart centers, orthopedic hospitals, minimally invasive surgery teams, laboratories,
              and partner-mediated channels, but without a public revenue or account mix that would show which segments
              actually dominate sales.
