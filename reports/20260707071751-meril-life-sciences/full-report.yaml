      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The right TAM for Meril is a portfolio of submarkets, not the full medtech headline
            body: >-
              India's medical devices market is a useful backdrop, but Meril's actual opportunity is much narrower and
              more specialized. The most evidenced slices in this chapter are cardiovascular implants and structural
              heart, while orthopedics, robotics, and diagnostics still require more segment-specific public sizing
              before they can be rolled into a precise SAM.
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
              - CM018
              - CM038
