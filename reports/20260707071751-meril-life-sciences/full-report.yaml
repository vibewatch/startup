chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, legal structure, and business model
        blocks:
          - type: paragraph
            body: >-
              Meril presents itself publicly as an India-based global medical device company founded in 2006, but the
              retained source set shows that the public brand sits on top of multiple legal entities rather than one
              single operating company. Filing aggregators and the credit-agency reports point to Micro Life Sciences
              Private Limited as the parent or economic centre of the group, while Meril Life Sciences Private Limited
              is one of the core operating subsidiaries inside the same combined credit perimeter. This distinction
              matters because revenue, debt, valuation, and litigation are often disclosed at the consolidated
              Micro-group level, whereas individual legal entities have separate filings and charges.


              The group’s stated business model is to design, manufacture, and distribute proprietary and adjacent
              medical devices across cardiovascular, orthopaedics, diagnostics, endo-surgery, and surgical robotics,
              with export markets now central to the story. Official pages claim more than 12,000 people in the Meril
              ecosystem, service in more than 150 countries, and 35+ owned subsidiaries, while ICRA and CARE both
              describe a scaled export-led manufacturer with most revenue now coming from overseas markets. Headquarters
              evidence is consistent across official and filing-derived sources: the group is anchored in Chala, Vapi,
              Gujarat, with Bilakhia House / Muktanand Marg repeatedly appearing as the core address cluster.
