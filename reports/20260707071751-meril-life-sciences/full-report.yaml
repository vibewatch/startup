      - number: '7.2'
        title: Pricing, Clinical Evidence & Safety Risk
        blocks:
          - type: paragraph
            body: >-
              Pricing and clinical risk are second-order but still material because Meril's flagship cardiovascular
              platform sits at the intersection of capped domestic pricing, medical liability, and still-maturing
              evidence. ICRA explicitly flags NPPA regulation for stents and knee implants, with future product
              inclusion able to compress pricing flexibility further. On safety, published Myval evidence is
              directionally encouraging, yet still mixed: the early MyVal-1 experience was small, direct prospective
              comparisons remain limited, and a first reported Myval embolization case shows that rare but severe
              procedural events can occur. The group's mitigation toolkit is real—product liability insurance, multiple
              product lines, and ongoing trials—but not complete. Meril's evidence depth is strongest around selected
              structural-heart programs rather than uniformly across the portfolio, so adverse signals in a flagship
              category would still transmit disproportionately into margin, reputation, and regulator attention.
