      - number: '7.4'
        title: Financial Model, Capital Intensity & IPO Risk
        blocks:
          - type: paragraph
            body: >-
              Meril's financial model is strong but not low-risk. ICRA records fast growth and healthy margins, yet also
              highlights a balance sheet that has become meaningfully more operationally levered: export markets drive
              most revenue, working capital intensity remains above 50% of operating income, inventory sits above 200
              days, and both working-capital debt and total debt rose sharply through FY2025. At the same time, the
              company is still funding large capex programs and carrying repayment obligations into FY2028. ADIA's
              capital injection improves liquidity, but even that cash was still parked in fixed deposits at ICRA's
              review date, underscoring that funding flexibility is not the same as fully de-risked deployment. The
              valuation narrative is similarly double-edged: private pricing stepped up from the 2022 Warburg
              transaction to the 2025 ADIA investment, but that also makes any IPO window more sensitive to litigation,
              margin slippage, or slower-than-expected export execution.
