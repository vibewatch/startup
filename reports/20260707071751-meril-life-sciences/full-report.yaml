    rows:
      - - Meril Life Sciences
        - Portfolio medtech challenger
        - Private; 150+ countries; 35+ subsidiaries
        - Hospitals across vascular, orthopedics, robotics, diagnostics
        - Integrated manufacturing plus multi-category portfolio breadth
        - Public evidence is thinner on realized pricing, installed base, and category leadership
      - - Medtronic Evolut / TAVR
        - Structural-heart incumbent
        - Public medtech with annual-report disclosure
        - Severe aortic stenosis and valve-replacement pathways
        - Self-expanding architecture, four sizes, follow-up infrastructure, coronary-access framing
        - Public Meril evidence does not show parity in global availability or service depth
      - - Abbott Navitor / TAVI
        - Structural-heart incumbent
        - Public medtech with annual-report disclosure
        - Severe aortic stenosis; high or extreme surgical-risk patients
        - Fabric cuff, leaflet positioning, structural-heart portfolio breadth
        - Meril can challenge clinically but not yet on disclosed U.S. portfolio breadth
      - - Edwards SAPIEN 3 / Ultra
        - Structural-heart incumbent
        - Public medtech with annual-report disclosure
        - Native severe AS and valve-in-valve risk cohorts
