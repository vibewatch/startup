      - number: '4.4'
        title: Public Traction, Private Gaps, and Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              Meril’s public traction is materially better than most private medtech peers. ICRA shows FY2025 revenue of
              Rs. 4,902.9 crore and Q1 FY2026 revenue of Rs. 1,416 crore; official and news sources show a company large
              enough to support 150+ countries, 35+ subsidiaries, 12,000+ to 13,000+ employees, and successive blue-chip
              investor rounds from Warburg and ADIA. That combination gives outside investors more underwriting surface
              than a typical opaque private manufacturer. It also supports a constructive revenue-quality view: the
              portfolio is diversified by therapy area, export markets are meaningful, and flagship products such as
              Myval have evidence of regulatory progress and clinical competitiveness that can plausibly sustain premium
              export realisations.


              But the missing data still matters. Meril does not publicly disclose burn, runway, customer concentration,
              realised ASPs, segment gross margins, CAC, sales payback, or a revenue-recognition policy. Those gaps are
              especially important because the business is not light-capital software: it requires inventory, local
              commercial presence, training, recurring regulatory work, and large ongoing manufacturing capex. In
              addition, ICRA’s discussion of pricing pressure, regulatory controls, and Rs. 500-550 crore of cumulative
              Myval litigation cost means that earnings quality cannot be evaluated on growth alone. The financial
              verdict is therefore balanced. Revenue quality appears directionally good because of diversification,
              exports, and margin improvement, but capital intensity remains high and cash-conversion quality remains
              under-disclosed. Meril is easier to believe on scale than on free-cash-flow durability.
