  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: leadership-disclosure
    missingEvidence: A single official current Meril group leadership or board roster that reconciles promoter, parent-company, and subsidiary-level executives.
    whyItMatters: Governance and key-person assessment is materially weaker when leadership must be reconstructed from filing aggregators and product-line communications.
    diligencePath: Request the latest board pack, organisation chart, and statutory registers for Micro Life Sciences, Meril Life Sciences Pvt Ltd, and the main operating subsidiaries.
    relatedQuestionRefs:
    - QO011
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: capital-raised
    missingEvidence: A reconciled cap table and round history showing exact primary versus secondary proceeds, investor names, and ownership percentages across the 2022-2025 period.
    whyItMatters: Without a reconciled cap table, public sources can establish valuation markers and named rounds but not a clean lifetime total raised figure.
    diligencePath: Obtain the latest cap table, shareholder register, and board materials for the Warburg and ADIA transactions, then reconcile them against ICRA/CARE funding references.
    relatedQuestionRefs:
    - QO017
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: minor
    topic: customer-count
    missingEvidence: A product-line installed-base or customer-count disclosure for hospitals, physicians, or systems in use.
    whyItMatters: Customer-count is a standard cover metric, but Meril’s public sources focus on countries and subsidiaries instead of named customer totals.
    diligencePath: Ask management for installed systems, hospital accounts, and recurring customer cohorts by therapy area and geography.
    relatedQuestionRefs:
    - QO022
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: A fully evidenced founder roster and unified public governance list for the full Meril group.
    whyItMatters: The leadership table is partial because the public evidence set does not expose every promoter, director, and executive in one place.
    diligencePath: Reconcile MCA records with an official leadership page or management presentation supplied by the company.
    relatedQuestionRefs:
    - QO006
    - QO008
    - QO009
    - QO011
    relatedTableRefs:
    - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map
    missingEvidence: A current post-ADIA ownership schedule plus lender list, board observer rights, and litigation reserve disclosures.
    whyItMatters: The stakeholder map is intentionally partial because public sources identify the major parties but do not provide a full ownership or creditor schedule.
    diligencePath: Request shareholder register, debt schedule, and material-contract summary in diligence.
