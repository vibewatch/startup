company:
  name: Meril Life Sciences
chapter:
  number: 1
  title: Company Overview
  summary: Meril is the public brand of a Vapi-based Indian MedTech group centred on Micro Life Sciences Private Limited, founded in 2006 and now selling across 150+ countries. Credit-agency disclosures show ₹4,902.9 crore of FY2025 consolidated revenue and a July 2025 ADIA deal valuing the group at roughly $6.6 billion, but public governance disclosure remains fragmented across multiple legal entities. The clearest overview-level red flag is the ongoing Edwards/Myval patent dispute, which rating agencies say had already consumed roughly ₹500-550 crore of legal spend by March 2025.
sections:
- id: identity-legal-structure-and-business-model
  title: Identity, legal structure, and business model
  body: 'Meril presents itself publicly as an India-based global medical device company founded in 2006, but the retained source set shows that the public brand sits on top of multiple legal entities rather than one single operating company. Filing aggregators and the credit-agency reports point to Micro Life Sciences Private Limited as the parent or economic centre of the group, while Meril Life Sciences Private Limited is one of the core operating subsidiaries inside the same combined credit perimeter. This distinction matters because revenue, debt, valuation, and litigation are often disclosed at the consolidated Micro-group level, whereas individual legal entities have separate filings and charges.


    The group’s stated business model is to design, manufacture, and distribute proprietary and adjacent medical devices across cardiovascular, orthopaedics, diagnostics, endo-surgery, and surgical robotics, with export markets now central to the story. Official pages claim more than 12,000 people in the Meril ecosystem, service in more than 150 countries, and 35+ owned subsidiaries, while ICRA and CARE both describe a scaled export-led manufacturer with most revenue now coming from overseas markets. Headquarters evidence is consistent across official and filing-derived sources: the group is anchored in Chala, Vapi, Gujarat, with Bilakhia House / Muktanand Marg repeatedly appearing as the core address cluster.'
