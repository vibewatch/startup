callouts:
- calloutType: strength
  title: Meril already looks like a scaled global manufacturer, not an early-stage device startup
  body: Official scale claims, ICRA/Care revenue disclosures, and the ADIA valuation marker all point to a business that has already crossed into late-stage industrial execution. The relevant diligence question is not basic product-market fit, but whether governance, capital efficiency, and litigation exposure are keeping pace with that scale.
  claimRefs:
  - CO008
  - CO009
  - CO024
  - CO027
- calloutType: risk
  title: Public leadership disclosure is weaker than Meril’s operating and financing disclosure
  body: The source set supports promoter control and identifies several named executives and directors, but it does not yield one clean official current group roster. For a company operating at Meril’s scale and valuation, that disclosure gap is notable and should be closed in diligence alongside the cap-table review.
  claimRefs:
  - CO015
  - CO018
  - CO019
  - CO020
- calloutType: risk
  title: The Edwards/Myval dispute is a genuine chapter-1 red flag rather than a niche legal footnote
  body: The litigation is already large enough to affect ratings language, legal spend, and product-market access. Because the disputed franchise is Myval, a flagship structural-heart product, the downside belongs in company overview rather than being deferred entirely to a later risk chapter.
  claimRefs:
  - CO039
  - CO040
  - CO041
