    - Promoter and control shareholder
    - Ultimate holding company and control centre of the wider Bilakhia group; also sold part of stake in ADIA deal.
    - Promoter control confirmed by ICRA, CARE, Bilakhia Holdings, and ADIA/ICRA transaction descriptions.
    - Obtain full post-ADIA ownership table and reserved matters.
  - - Warburg Pincus
    - Minority private-equity investor
    - Disclosed ~US$210M 2022 investment into Micro; likely a material minority position and governance participant.
    - Official Warburg release confirms minority investment, but current stake size is not disclosed in retained sources.
    - Confirm current board rights, anti-dilution terms, and whether the 2022 infusion is the same capital event later described as Q1FY23 PE money.
  - - ADIA
    - Minority investor
    - US$200M for ~3% stake at ~US$6.6B EV makes ADIA the clearest current valuation marker.
    - Official ADIA release plus ICRA/CARE detail the transaction and primary/secondary split.
    - Confirm final post-closing stake percentage and any IPO-related rights.
  - - Banks and working-capital lenders
    - Senior creditors / facility providers
    - Credit ratings cover group bank facilities and rising debt tied to capex and working capital.
    - ICRA and CARE report total debt of ~₹2,592 crore and continued investment-grade comfort metrics.
    - Request lender list, covenant package, and security package by entity.
  - - Edwards Lifesciences
    - Litigation counterparty
    - Not a capital provider, but economically material because the Myval dispute can affect market access, margins, and liquidity.
    - EPLAW, UPC order, ICRA, and CARE all treat the dispute as strategically important.
    - Map affected geographies, product SKUs, and contingency plans.
  - - Japan Lifeline
    - Distribution / channel partner
    - Exclusive route to Japanese rollout for Myval Octacor after PMDA approval, making it a strategic channel stakeholder.
    - Official Meril summary describes exclusive introduction rights in Japan.
    - Validate economics, launch timing, and PMDA dependency.
