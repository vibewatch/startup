- id: scenarios-and-entry-discipline
  title: Scenarios and Entry Discipline
  body: 'Meril’s public evidence supports a scenario frame, not false precision. The bear case centers on multiple compression toward Edwards-like territory if litigation costs stay elevated, export-led growth slows, inventory and receivables remain heavy, and investors discover that the CCPS stack absorbs more equity value than expected. That points to roughly USD 4.0-4.8 billion. The base case assumes Meril sustains respectable growth, protects margins around current levels, converts new capacity without blowing out leverage, and keeps strategic optionality alive; that supports roughly USD 5.5-6.5 billion and already leaves little room above the ADIA mark. The bull case above USD 7 billion needs more than continued execution in legacy categories: it needs premium-category proof from structural heart and robotics, successful partnership-led expansion, and a disclosure bridge that narrows the current trust discount. Entry discipline should therefore be price-sensitive. Without a full waterfall,
    a fresh investor should prefer pricing at or below the late-2024 range or obtain structural protection against downside leakage.'
