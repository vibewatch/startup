- id: recommendation-exit-readiness-and-diligence
  title: Recommendation, Exit Readiness, and Diligence Asks
  body: 'The resulting call is Track, not Buy. Meril has enough substance to deserve serious diligence: it is large, profitable, export-scaled, clinically active, and backed by institutional capital. But the current private mark is already pricing Meril closer to specialist premium medtech than to diversified medical-device peers, even though public disclosure remains private-company thin. Exit readiness has improved because the company now has blue-chip investors and an externally described financial profile, yet the evidence set still lacks the documents that convert a strong private story into an underwritable public-equity opportunity. The committee should assume high risk until management provides the cap-table and CCPS waterfall, ADIA transaction terms, segment-level economics, and litigation analysis. A sub-USD 5.5 billion entry or meaningful downside protection could move the call; absent that, the prudent stance is to monitor milestones and only advance once price and evidence improve
    together.'
