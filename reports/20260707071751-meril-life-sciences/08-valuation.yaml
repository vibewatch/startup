company:
  name: Meril Life Sciences
chapter:
  number: 8
  title: Valuation
  summary: Meril has credible operating substance — ICRA disclosed FY2025 revenue of Rs. 4,902.9 crore, OPBDIT margin of 26.4%, and export-heavy scale — but the current July 2025 ADIA-backed mark of roughly USD 6.6 billion implies an approximately 11.6x value-to-revenue proxy and embeds materially richer expectations than most diversified medtech peers. The public record also confirms CCPS history, mixed primary-secondary deal structure, litigation expense, and heavy capex, but not the full dilution waterfall. The result is a Track recommendation at medium confidence with a high risk rating and a stretched valuation stance unless entry moves closer to the 2024 pre-IPO indication or downside protection is negotiated.
sections:
- id: valuation-context-and-price-support
  title: Valuation Context and Price Support
  body: 'The cleanest current price signal is the July 2025 ADIA transaction: approximately USD 200 million for about 3% of Micro Life Sciences, implying an enterprise value near USD 6.6 billion. That is meaningfully above the late-2024 press discussion of a USD 5 billion pre-IPO round and well above the roughly USD 2 billion level implied by Economic Times reporting on Warburg’s 2022 entry. Price support is not fictional — a sovereign investor actually paid into the story — but public evidence also shows that the 2025 round was not a simple new-money mark. ICRA said only around half of the proceeds were primary capital and the remainder was a secondary sale by BHPL, while the company already had CCPS in the stack from FY2023. That means the headline EV is helpful as a top-of-funnel signal, but not a reliable proxy for what a new common-equity investor would realize without a full waterfall model. In short, Meril has a market-clearing private mark, but not yet a market-clearing public-equity
    disclosure standard.'
