  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: capital-structure
    missingEvidence: Full cap table, fully diluted share count, CCPS terms, liquidation stack, and any anti-dilution or investor-protection rights across the 2022, FY2023, and 2025 financings.
    whyItMatters: Headline enterprise value can diverge materially from realizable equity value if the preference stack, conversion terms, or senior claims are aggressive.
    diligencePath: Request the shareholder register, financing documents, and waterfall model from management and legal counsel before underwriting any common-equity value.
    relatedQuestionRefs:
    - QV005
    - QV032
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: robotics-segment
    missingEvidence: Segment revenue, gross margin, and order-book contribution from robotics versus structural heart, orthopedics, diagnostics, and endo-surgery.
    whyItMatters: The upside narrative references robotics scarcity, but public evidence does not show whether robotics is currently material enough to support a premium multiple.
    diligencePath: Obtain FY2025 and FY2026 segment dashboards and pipeline KPIs, including revenue mix and backlog by therapy area.
    relatedQuestionRefs:
    - QV013
    relatedTableRefs:
    - TV002
  - type: missing-source
    severity: material
    topic: exit-readiness
    missingEvidence: Any banker mandates, IPO timeline, draft offering documents, or board-governance upgrades associated with a public listing process.
    whyItMatters: Exit timing and route determine whether the current mark should be compared to a private secondary, a strategic sale, or a public-market bridge.
    diligencePath: Ask management and counsel for mandate letters, IPO workstreams, and any confidential filing status; verify with lead-bank references.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: litigation-outcome
    missingEvidence: Up-to-date court docket status, reserves, potential damages range, and commercial mitigation plans for the Myval-related litigation.
    whyItMatters: The litigation already carries cumulative legal cost and could affect both cardiovascular growth assumptions and equity proceeds in downside scenarios.
    diligencePath: Pull the latest court filings, outside-counsel memo, and management reserve analysis; reconcile them against the ICRA summary.
    relatedQuestionRefs:
    - QV010
    - QV031
    relatedTableRefs:
    - TV005
    - TV006
  - type: missing-source
    severity: material
    topic: TV003 comparable coverage
    missingEvidence: Verified private-round terms and cleaner recent medtech transaction comparables for Indian or emerging-market device platforms with similar mix and disclosure depth.
    whyItMatters: The comparable table necessarily mixes Meril's own private marks with public medtech proxies because recent directly comparable transactions are not fully public.
    diligencePath: Request secondary transaction data, banker precedent books, and full round documents for the 2022 and 2025 transactions before final valuation committee review.
    relatedQuestionRefs:
    - QV004
    - QV015
    - QV016
    - QV017
    relatedTableRefs:
    - TV003
