- id: TV003
  title: Comparable Valuation Table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation status
  - Relevance
  - Limitation
  rows:
  - - Meril 2022 Warburg anchor
    - Reported private round
    - ~USD 2.0B implied by ET stake math; official Warburg release disclosed only USD 210M minority investment
    - Historical floor for how far the business has re-rated since global investors entered
    - Public reports on exact 2022 stake math are not as clean as the 2025 ADIA release
  - - Meril 2024 pre-IPO indication
    - Reported private round discussion
    - ~USD 5.0B indicated for a 3-4% stake sale
    - Closest public pre-2025 price reference for a new investor
    - News-report indication, not a confirmed closed round
  - - Meril 2025 ADIA round
    - Official transaction
    - ~USD 6.6B EV for a ~3% stake
    - Current best price signal and the main reference point for entry discipline
    - Headline EV does not reveal the effective common-equity waterfall
  - - Medtronic
    - Market cap / revenue proxy
    - ~3.0x (USD 106.32B market cap / USD 35.48B TTM revenue)
    - Floor comp for a scaled diversified medtech platform
    - Mature growth and abundant disclosure make it a conservative benchmark
  - - Abbott Laboratories
    - Market cap / revenue proxy
    - ~3.7x (USD 166.56B / USD 45.13B)
    - Shows what broad device portfolios can command with scale and quality
    - Mix includes diagnostics and pharma-adjacent businesses not directly comparable to Meril
  - - Edwards Lifesciences
    - Market cap / revenue proxy
    - ~9.0x (USD 54.80B / USD 6.06B)
    - Most useful specialist structural-heart middle point for Meril
    - Pureer cardiovascular focus and public-market liquidity still justify some premium over Meril
  - - Boston Scientific
    - Market cap / revenue proxy
    - ~3.2x (USD 66.29B / USD 20.61B)
    - Another diversified medtech reference for downside compression risk
    - Broader mature portfolio and listed-company disclosure reduce direct comparability
  - - Intuitive Surgical
    - Market cap / revenue proxy
    - ~14.5x (USD 153.29B / USD 10.58B)
    - Premium ceiling comp if Meril ever earns a scarcity narrative around robotics and premium categories
    - Pure-play robotics economics and installed-base quality are materially stronger than Meril's current disclosed profile
  notes: The table mixes private round anchors and public market-cap-to-revenue proxies because Meril lacks public enterprise-value bridge detail; use it for relative framing, not mechanical pricing.
  enumerationScope:
    coverage: partial
    basis: Public medtech references plus the main known private valuation anchors for Meril through the 2025 ADIA round, selected for underwriting relevance rather than exhaustive sector coverage.
