- id: TV002
  title: Thesis / Anti-Thesis Table
  columns:
  - Pillar
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Scale and reach
    - Meril already operates at meaningful global scale with 150+ countries served and 35+ subsidiaries
    - Scale claims are company-described and do not reveal the quality or profitability of each geography
    - Segment and geography-level revenue, margin, and cash conversion disclosure
  - - Financial momentum
    - FY2025 revenue, margins, and PAT show that Meril is not a concept-stage medtech story
    - Working capital remains heavy, debt has risen, and fresh capital is not yet fully deployed
    - Two more periods of growth with stable or improving cash conversion
  - - Clinical proof
    - Myval RCT and broader clinical-program activity support premium-category credibility
    - Clinical strength is concentrated in structural heart and does not automatically validate the whole portfolio
    - Independent multi-market adoption and segment economics by flagship products
  - - Strategic optionality
    - Japan Lifeline and broad export mix create multiple routes to premium markets
    - Myval is still not approved in the USA and robotics may remain more option value than current earnings power
    - Proof of U.S. regulatory expansion or disclosed robotics revenue contribution
  - - Valuation
    - The current mark reflects real investor demand and institutional sponsorship
    - The ADIA mark already prices Meril near premium specialist medtech without public-market disclosure quality
    - A lower entry price or a disclosure bridge that clarifies the equity waterfall
  notes: Thesis and anti-thesis deliberately mix company disclosures with independent financial evidence; unresolved gaps mostly concern segment mix, dilution, and geography-level monetization.
