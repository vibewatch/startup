tables:
- id: TV001
  title: Recommendation Summary Table
  columns:
  - Dimension
  - Current View
  - Implication
  - Evidence basis
  rows:
  - - Recommendation
    - Track
    - Do not chase the current mark; keep in active diligence rather than commit capital now
    - Real operating quality is visible, but valuation is already rich versus most comps
  - - Confidence
    - Medium
    - Enough evidence to avoid a blind pass, not enough to move to Buy
    - ICRA supplies useful financial disclosure, but the cap table and exit route remain opaque
  - - Risk rating
    - High
    - Assume downside can widen quickly if litigation, working capital, or capex turns against execution
    - Debt, capex, litigation, and disclosure gaps all transmit directly into equity value
  - - Valuation stance
    - Stretched
    - Current price needs continued premium growth and cleaner disclosure to hold
    - ADIA implies ~11.6x FY2025 revenue proxy, above most diversified medtech comps
  - - Decision implication
    - Proceed only with structure or better price
    - Prefer entry at or below the late-2024 reference range or with downside protection
    - Unknown waterfall means enterprise value is not the same as underwritable equity value
  notes: Summary reflects public evidence as of 2026-07-07; the key caveat is that enterprise value and equity value may diverge materially because financing terms are not public.
