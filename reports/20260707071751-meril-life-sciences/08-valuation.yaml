callouts:
- calloutType: strength
  title: This is not a narrative-only private medtech name
  body: 'Meril already looks like a scaled operating company rather than a pure venture bet: ICRA disclosed nearly Rs. 4,903 crore of FY2025 revenue, 26.4% OPBDIT margin, Rs. 729.4 crore of PAT, and 61% export contribution. That level of disclosed operating substance is rare for a private Indian medtech platform and explains why institutional capital can support a premium mark.'
  claimRefs:
  - CV011
  - CV013
  - CV014
  - CV017
- calloutType: risk
  title: The headline EV is cleaner than the equity story
  body: ADIA’s USD 6.6 billion enterprise-value signal is real, but public evidence also confirms CCPS history, mixed primary-secondary proceeds, heavy working-capital needs, and ongoing litigation costs. Without the full fully diluted waterfall, an investor cannot assume that enterprise value equals clean common-equity value.
  claimRefs:
  - CV001
  - CV002
  - CV009
  - CV010
  - CV018
  - CV022
- calloutType: recommendation
  title: Price and evidence both need to improve
  body: Meril deserves active diligence because the business quality is visible, but a new investor should demand either a lower entry level closer to the 2024 pre-IPO range or explicit downside protection. At today’s headline price, the committee is underwriting too much hope relative to the disclosure quality still available publicly.
  claimRefs:
  - CV038
  - CV046
