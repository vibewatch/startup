- id: TV004
  title: Bull / Base / Bear Scenario Table
  columns:
  - Scenario
  - Assumptions
  - Valuation range
  - Probability signal
  - Key risk
  rows:
  - - Bull
    - High-teens or better growth persists, margins stay near FY2025 levels, structural-heart clinical proof keeps comping well, and partnership-led expansion plus premium-category optionality narrow the disclosure discount
    - USD 7.0B-8.0B
    - Low-Medium; requires premium category execution and cleaner disclosure bridge
    - The business remains too diversified and opaque to earn Intuitive-like treatment
  - - Base
    - Growth remains healthy, margins hold, capex ramps without leverage stress, and Meril preserves strategic optionality without a further valuation step-up
    - USD 5.5B-6.5B
    - Medium; broadly consistent with current fundamentals and the ADIA round
    - Current price already uses much of this upside, leaving limited margin for error
  - - Bear
    - Growth cools, litigation or capex absorbs management attention, working capital stays heavy, and the market re-rates Meril closer to Edwards-like or diversified-medtech territory
    - USD 4.0B-4.8B
    - Medium; plausible if multiple downside vectors hit at once
    - Unknown preference stack could make common-equity outcomes worse than the headline range implies
  notes: Scenario ranges are judgment-based outputs anchored on disclosed FY2025 revenue, public medtech comparables, and the known private marks at USD 5.0B and USD 6.6B.
