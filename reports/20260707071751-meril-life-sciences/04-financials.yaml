- id: TI005
  title: Public Financial Gaps
  columns:
  - Missing Metric
  - Impact on Analysis
  - Why Unavailable Publicly
  - Diligence Path
  rows:
  - - Burn rate / monthly cash use
    - Prevents rigorous runway and self-funding analysis
    - Meril has not publicly disclosed cash burn or cash-flow cadence
    - Request monthly cash bridge and board reporting pack under NDA
  - - CAC / payback / rep productivity
    - No direct sales-efficiency underwriting
    - Private company does not publish go-to-market cohort data
    - Request channel- and therapy-level CAC and payback cohort analysis
  - - Realised ASPs and discounting
    - Revenue-quality analysis cannot distinguish price from volume
    - Official surfaces omit pricing and channel rebates
    - Obtain gross-to-net bridge by product line and geography
  - - Customer concentration
    - Cannot test resilience to large hospital or distributor loss
    - No public concentration disclosure
    - Request top-10 customer and distributor revenue shares
  - - Revenue-recognition policy
    - Cannot assess timing risk around exports, tenders, and bundled services
    - No public accounting-policy detail in accessible materials
    - Review audited notes and management accounting memo
  - - Segment gross margins
    - Cannot isolate which therapy areas truly fund capex and growth
    - Private company does not disclose line-level profitability
    - Request contribution margins for cardio, ortho, endo, diagnostics, and robotics
  notes: 'These are not generic investor asks: each missing metric blocks a specific underwriting question around cash conversion, pricing power, or capital adequacy. The public record is strongest on scale and weakest on conversion quality.'
