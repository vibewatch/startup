  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: Channel-level CAC, payback period, sales-cycle length, and rep productivity by therapy area and geography.
    whyItMatters: Public proxies like export share and dealer count do not reveal whether growth is becoming cheaper or more expensive to acquire.
    diligencePath: Request board or operating-review materials showing CAC, payback, funnel conversion, and quota productivity by major product line.
    relatedQuestionRefs:
    - QI009
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn
    missingEvidence: Monthly or quarterly burn rate, cash runway, and cash-flow cadence after the ADIA primary infusion.
    whyItMatters: Without cash-consumption data, the adequacy of current liquidity cannot be converted into a runway or free-cash-flow underwriting view.
    diligencePath: Obtain monthly cash bridge, quarterly cash-flow statements, and FY2026 budget versus actuals under NDA.
    relatedQuestionRefs:
    - QI023
  - type: missing-source
    severity: material
    topic: debt-terms
    missingEvidence: Detailed covenant package, pricing, security package, and lender restrictions attached to Meril's term debt and working-capital facilities.
    whyItMatters: Public repayment schedules show fixed obligations but not the covenant or collateral terms that could constrain future financing flexibility.
    diligencePath: Request facility agreements, security documents, and any rating-monitoring updates from lenders or management.
    relatedQuestionRefs:
    - QI026
  - type: private-evidence-only
    severity: material
    topic: revenue-recognition-and-concentration
    missingEvidence: Accounting policy for export, distributor, and bundled-service revenue recognition plus customer and distributor concentration metrics.
    whyItMatters: Revenue quality cannot be fully assessed without knowing when export/channel revenue is booked and whether a few customers or distributors dominate the mix.
    diligencePath: Review audited accounting-policy notes, monthly revenue cut-off memos, and top-customer concentration schedules under NDA.
    relatedQuestionRefs:
    - QI028
