- id: capital-adequacy-working-capital-and-debt
  title: Capital Adequacy, Working Capital, Capex, and Debt Burden
  body: 'ICRA provides unusually detailed visibility into Meril’s current balance-sheet strain points. FY2025 net working capital intensity was 53.8% of operating income, up from 50.4% in FY2024, with inventory still high at 212 days and working-capital debt up to Rs. 1,690.5 crore. At the same time, growth required sizeable capex: about Rs. 600 crore in FY2025 after Rs. 673 crore in FY2024, followed by another Rs. 500-600 crore planned for FY2026 across manufacturing expansion, MMIPL setup, debottlenecking, and energy assets. These outlays pushed total debt to Rs. 2,592.5 crore as of 31 March 2025 from Rs. 1,808.0 crore a year earlier, even though operating performance improved enough to reduce debt/OPBDITA to 2.0x and lift interest coverage to 6.7x.


    The July 2025 ADIA transaction improves near-term adequacy but does not eliminate financing dependence. ICRA says the $200 million deal delivered only about Rs. 860 crore of primary capital to the company, with the balance going to shareholder liquidity, and that the primary proceeds were still held as bank fixed deposits at the time of the report. Liquidity was supported by around Rs. 593 crore of free cash and liquid investments at March 2025 plus Rs. 315.1 crore of undrawn working-capital headroom as of July 2025, but those buffers sit against planned FY2026 capex and scheduled debt repayments of Rs. 128.3 crore, Rs. 195.6 crore, and Rs. 183.1 crore across FY2026-FY2028. Meril therefore looks adequately financed for the next phase of execution, not fully self-funding. Growth still depends on disciplined capex ramp, working-capital control, and avoidance of new litigation or regulatory cash shocks.'
