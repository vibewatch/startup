callouts:
- calloutType: risk
  title: Growth Quality Is Better Than Cash-Conversion Quality
  body: Meril’s public growth and margin profile is credible, but the balance-sheet demands behind that growth are heavy. FY2025 NWC/OI of 53.8%, debt of Rs. 2,592.5 crore, and another Rs. 500-600 crore of planned FY2026 capex mean that reported expansion is not yet equivalent to self-funding cash generation.
  claimRefs:
  - CI001
  - CI022
  - CI026
  - CI027
  - CI041
  - CI043
- calloutType: insight
  title: Myval Appears to Be the Best Public Margin Driver
  body: Among Meril’s many product lines, Myval has the clearest public link to quality of revenue. ICRA attributes MLSPL margin expansion to higher Myval capacity utilisation and better export realisations, while clinical and regulatory sources show the product remains commercially and scientifically competitive.
  claimRefs:
  - CI004
  - CI010
  - CI020
  - CI021
- calloutType: assumption
  title: Underwriting Still Requires Private Data on Pricing and Burn
  body: Any serious investment model still needs management-only data on realised ASPs, revenue recognition, CAC/payback, customer concentration, and burn. Public data is strong enough to underwrite scale and capex intensity, but not strong enough to convert that scale into a defensible free-cash-flow forecast.
  claimRefs:
  - CI012
  - CI013
  - CI042
  - CI043
