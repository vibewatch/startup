chapter:
  number: 5
  title: Product & Technology
  summary: Meril presents a broad medtech platform spanning cardiovascular devices, orthopedics, robotics, diagnostics, and endo-surgery, but the public evidence quality is highly uneven across those families. The strongest technical and clinical proof sits around Myval THV, where device architecture, delivery mechanics, and multiple comparator studies are visible. Robotics, diagnostics, and support economics are directionally credible yet still under-disclosed on independent validation, software controls, and country-level approval detail.
sections:
- id: portfolio-workflows
  title: Portfolio Definition in Customer Workflow Terms
  body: |-
    Meril presents itself less as a single-product medtech company and more as a multi-division device platform that inserts itself at multiple points in hospital workflow. The public product surface spans cardiovascular intervention, orthopedic implants, surgical robotics, diagnostics, and endo-surgery, with dedicated pages for Myval THV, Evermine 50, MISSO, HandX, Cuvis Joint, and Merilyzer CelQuant 5 Plus. In customer terms, that means Meril can participate in pre-procedure planning, the intervention or surgery itself, implant selection, lab measurement, and post-procedure evidence generation rather than selling one isolated consumable.

    The workflow coverage is uneven, however. Cardiovascular pages carry the richest technical and clinical narrative, orthopedics has broad portfolio statements plus a publication trail, robotics has credible feature descriptions but still relies heavily on company-led framing, and diagnostics shows category breadth with comparatively light independent validation. The result is a broad SKU map with strongest maturity where Meril controls implant design, manufacturing, and clinician-facing evidence generation, and weaker transparency where software, support economics, or cross-market approval detail would be needed to underwrite execution.
