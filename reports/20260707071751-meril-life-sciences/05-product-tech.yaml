- id: robotics-diagnostics-endo
  title: Robotics, Diagnostics, and Endo-Surgery Operating Model
  body: |-
    Outside cardiovascular intervention, Meril’s product-tech story shifts from implant architecture toward procedure enablement. MISSO is framed as an indigenous robotic knee platform that helps surgeons with personalized pre-planning, precise cutting, optical tracking, and automated safety stops. HandX occupies a different place in the OR: it is a handheld, 5 mm, fully articulated robotic-assisted laparoscopy tool that preserves conventional laparoscopic workflow while offering more dexterity. Cuvis Joint appears to be Meril’s other robotic knee asset, with the strongest public maturity signal coming from publication listings rather than from an unusually detailed product page.

    Diagnostics is the broadest but least independently illuminated segment. Meril’s diagnostics pages show category breadth across central labs, hospitals, and home testing, while the publication portal gives at least one public validation reference for the CelQuant hematology analyzer. Endo-surgery has the clearest regulatory anchor outside TAVR: the FDA’s K233386 clearance letter for Monik disposable endoscopic trocars demonstrates Meril can get at least some surgical access products through US device review. Across these categories, the customer proposition is practical workflow fit—smaller footprint, instrument familiarity, or lab throughput support—while the main diligence risk is that public evidence quality still lags the breadth of the portfolio.
