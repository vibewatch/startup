  rows:
  - - Myval THV series
    - Interventional cardiologist / cath lab
    - Most mature public evidence set; multiple studies plus ongoing trial summaries
    - Fine-grained sizing, dedicated delivery stack, comparator literature
    - Country-by-country approval footprint not public
  - - Evermine 50 / MeRes100 cardiovascular implants
    - Cardiologist / vascular intervention team
    - Commercial portfolio with CE-marked scaffold narrative
    - Materials science plus Meril-claimed integrated manufacturing control
    - Independent long-term commercial uptake data sparse
  - - Orthopedic implant systems
    - Orthopedic surgeon
    - Broad implant portfolio in 50+ countries
    - Range breadth across hip, knee, trauma, spine, revision
    - Specific flagship SKUs and approval map not well disclosed
  - - MISSO robotic knee system
    - Joint-replacement surgeon / hospital admin
    - Emerging; public press plus portal-linked orthopedic literature
    - Optical tracking, articulated arm, smaller-footprint positioning
    - Independent validation of cost/time/success claims missing
  - - HandX handheld robotic laparoscopy
    - General / gynecologic MIS surgeon
    - Commercial partner asset with explicit approvals
    - 5 mm articulated handheld robot that preserves lap workflow
    - Meril's exact commercialization and integration role unclear
  - - Cuvis Joint robotic platform
    - Knee arthroplasty surgeon
    - Moderate public maturity via product page and publication index
    - Robotic alignment and CT-linked planning evidence present
    - Public regulatory status and ownership economics are not explicit
  - - Merilyzer CelQuant and diagnostics portfolio
    - Lab managers / clinicians
    - Broad category coverage but thin public proof depth
    - Central-lab and point-of-care breadth under one portfolio
    - Independent performance data are limited in public view
  - - Monik disposable endoscopic trocar
    - Laparoscopic surgeon / OR staff
    - Direct US regulatory proof via FDA 510(k)
    - Shows Meril can clear surgical-access hardware in the US
    - Broader endo-surgery roadmap beyond trocar access not public
