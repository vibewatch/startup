  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: misso-performance-claims
    missingEvidence: Independent clinical or health-economic validation of MISSO's 66% cost reduction, 83% planning-time reduction, and 98% success-rate claims.
    whyItMatters: Those claims are central to the hospital ROI and adoption thesis for robotics but currently remain company-led in press coverage.
    diligencePath: Request named-site outcome studies, procurement comparisons, and surgeon utilization data from deployed MISSO hospitals.
    relatedQuestionRefs:
    - QE013
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: Public repositories, API docs, package telemetry, engineering talks, or other practitioner-community signals tied to Meril's robotics or diagnostics stack.
    whyItMatters: Without broader practitioner signal, outside observers cannot easily test the maturity of Meril's software or field-engineering layer.
    diligencePath: Ask management for software release process evidence, field-service tooling, and any private developer or clinician training communities.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: software-cybersecurity-controls
    missingEvidence: Explicit published software lifecycle, cybersecurity, privacy, or IEC/ISO control documentation for MISSO, Cuvis integration, HandX integration, or diagnostics analyzers.
    whyItMatters: Robotics and diagnostics both depend on software trust, yet the public record here is much thinner than the record for mechanical or regulatory controls.
    diligencePath: Request ISO 13485/IEC 62304 style quality evidence, threat-modeling artifacts, SBOM or patch-management policies, and post-market software incident history.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: sku-approval-matrix
    missingEvidence: A country-by-country SKU, indication, and approval matrix backing Meril's 100-country vascular and 50-country orthopedic distribution claims.
    whyItMatters: Without a clean approval matrix, it is hard to separate genuine commercialized presence from partial distributor reach or legacy registration.
    diligencePath: Obtain the current regulatory master list by geography, SKU, and status from Meril's regulatory affairs team.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE001
