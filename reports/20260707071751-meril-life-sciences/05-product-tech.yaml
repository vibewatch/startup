- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - User Job
  - Current Workflow
  - Meril Solution
  - Measurable Benefit (Evidence Level)
  - Limitation
  rows:
  - - Treat severe aortic stenosis
    - CT sizing, transfemoral access, valve delivery, deployment, follow-up
    - Myval THV + Navigator + Python sheath
    - Comparator and early-study evidence plus randomized-trial summaries (technical-docs + official)
    - Global evidence is stronger than explicit country approval mapping
  - - Revascularize coronary disease without permanent metal burden
    - PCI with DES or scaffold selection
    - Evermine 50 and MeRes100 cardiovascular implant line
    - Company-led CE/scaffold narrative and manufacturing story (official)
    - Independent commercial outcome disclosure is limited here
  - - Plan and execute total knee replacement
    - Pre-op planning, cutting accuracy, gap balancing, implant positioning
    - MISSO or Cuvis robotic workflow support
    - Independent feature reporting and publication-index support for knee robotics (news + technical-docs)
    - MISSO economics and performance claims remain company-led
  - - Perform minimally invasive laparoscopic surgery with added dexterity
    - Standard trocar setup and laparoscopic manipulation
    - HandX handheld robotic assistance
    - FDA/CE-marked handheld articulation with 540° tip rotation (partner-proof)
    - Meril's exact role versus partner commercialization is not fully clear
  - - Run hematology diagnostics in lab settings
    - Collect sample, run analyzer, compare parameters, report results
    - Merilyzer CelQuant analyzer within broader diagnostics portfolio
    - At least one public comparative publication plus product presence (official + technical-docs)
    - Diagnostics evidence depth is much thinner than cardiovascular
  - - Establish endoscopic access in surgery
    - Port access, device labeling, sterility, reporting
    - Monik disposable endoscopic trocar
    - FDA-cleared access device under QSR and adverse-event reporting rules (regulatory)
    - Broader endo-surgery instrument stack is not publicly detailed
  notes: Benefits are phrased at the evidence level actually visible in public sources; company-claimed metrics are not treated as independently verified outcomes.
