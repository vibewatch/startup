    - Adds robotic dexterity without a full console or room rebuild
    - Partner hardware, disposable instruments, OR familiarity
    - Commercial dependence on partner surface and unclear Meril bundling
  - - Diagnostics evidence layer
    - Connects portfolio claims to comparative clinical or post-marketing data
    - Analyzer validation studies, hospital/lab adoption, quality systems
    - Public diagnostics validation remains sparse
  notes: This table mixes hard architecture (Myval, HandX) with operating architecture (manufacturing, evidence generation) because Meril is primarily a regulated device stack, not a pure software stack.
