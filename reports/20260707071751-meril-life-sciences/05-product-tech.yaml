- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Layer / Component
  - Role
  - Dependency
  - Risk
  rows:
  - - In-house manufacturing base
    - Supports portfolio-wide device production and validation claims
    - Meril facilities, process controls, materials know-how
    - Public evidence is company-led outside selected regulatory filings
  - - Myval valve construct
    - Creates implant hemodynamics, sealing, and sizing flexibility
    - Nickel-cobalt frame, bovine pericardium, PET cuff
