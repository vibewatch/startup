callouts:
- calloutType: strength
  title: Breadth plus manufacturing control is the core platform strength
  body: Meril's visible advantage is not a single blockbuster SKU but a regulated device stack that spans implants, robotics, diagnostics, and access hardware while repeatedly emphasizing manufacturing control and publication-backed iteration in its strongest category.
  claimRefs:
  - CE002
  - CE004
  - CE010
  - CE025
- calloutType: risk
  title: Robotics evidence quality still lags robotics ambition
  body: MISSO has credible feature descriptions and local adoption framing, but the most commercial-sounding 66%, 83%, and 98% figures remain company-led in press coverage rather than independently audited clinical or health-economic literature.
  claimRefs:
  - CE029
  - CE030
  - CE031
- calloutType: insight
  title: Meril looks like a device-and-process moat, not a public software moat
  body: The company's differentiation is easiest to verify where materials, geometry, manufacturing, and regulated workflow are visible; public code, APIs, cyber standards, and developer-community signals are much harder to find.
  claimRefs:
  - CE038
  - CE042
  - CE045
