- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Stablecoin payment scale
    - Driver
    - Now
    - Large public-chain payment flows make confidentiality economically relevant
    - Which subset of this flow truly needs privacy controls?
  - - RWA tokenization growth
    - Driver
    - 2026-2030
    - Institutional assets moving onchain create clear confidentiality demand
    - How much of tokenization stays on public versus private rails?
  - - Selective disclosure and compliance
    - Driver
    - Now
    - Privacy is more adoptable when audit paths exist
    - Which jurisdictions accept the operator / decryption model?
  - - Tooling through Solidity and standards
    - Driver
    - Now
    - Lower developer friction can widen adoption faster than bespoke cryptography stacks
    - What is the real conversion from developers to paying deployments?
  - - Specialized hardware dependence
    - Constraint
    - Now-2027
    - Performance economics still depend on GPUs and future accelerators
    - What is cost per confidential transaction at production scale?
  - - Competing privacy architectures
    - Constraint
    - Now
    - ZK, TEEs, permissioned networks, and other models compete for the same buyer budgets
    - Where does Zama win decisively versus each substitute?
  - - Operator-network complexity
    - Constraint
    - Now
    - Adoption requires trust in KMS, coprocessors, and operational reliability
    - How many operators and what uptime / slashing protections exist?
  - - Token overhang and volatility
    - Constraint
    - Now
    - Speculative token repricing can undermine enterprise confidence
    - How much usage-driven demand exists relative to unlocked supply?
  - - Institutional proof points
    - Driver
    - Near term
    - T-REX and Kinexys make the market story more credible
    - Are pilots converting into recurring production volumes?
  - - Forecast uncertainty
    - Constraint
    - Ongoing
    - Forecasts span below $2T to above $30T, so investors can overfit to headline TAM
    - What bottom-up SAM assumptions hold even in a conservative case?
  notes: Rows mix structural drivers with execution constraints because the commercial outcome depends on how quickly the former outrun the latter.
