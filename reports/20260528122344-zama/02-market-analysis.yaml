  title: Market definition table
  columns:
  - Segment / category
  - Included spend or value
  - Excluded spend
  - Buyer / payer
  - Relevance to Zama
  rows:
  - - Confidential public-chain payments
    - Stablecoin payment flows and payment infrastructure on public chains
    - Generic card processing, bank core systems, and private-ledger-only payment stacks
    - Wallets, payment providers, issuers
    - High
  - - Tokenized RWAs on public chains
    - Treasuries, commodities, funds, securities, and tokenized-asset infrastructure with confidentiality needs
    - Private-chain-only securitization or offchain fund administration
    - Asset managers, issuers, tokenization platforms
    - High
  - - Confidential DeFi and onchain trading
    - AMMs, lending, swaps, sealed-bid auctions, and private order flow
    - Transparent DeFi that does not value privacy, plus centralized-exchange order books
    - Protocols, market makers, treasury teams
    - High
  - - Identity and governance workflows
    - KYC-linked credentials, onchain identity checks, confidential voting
    - Conventional offchain IAM and non-blockchain voting systems
    - Applications, DAOs, regulated operators
    - Medium
  - - Broader confidential computing
    - Enterprise privacy infrastructure budgets adjacent to blockchain confidentiality
    - Non-blockchain confidential computing workloads
    - Cloud and data-security buyers
    - Low / adjacency only
  notes: The included market is intentionally narrower than all confidential computing or all tokenization; relevance scores reflect fit to Zama’s current product posture.
