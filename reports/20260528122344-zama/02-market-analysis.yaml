callouts:
- calloutType: insight
  title: The live market is already large enough to matter
  body: The combination of $4.5T quarterly stablecoin payment flow and a $19.3B live RWA market means Zama does not need a speculative future market to justify interest. It only needs confidentiality to become valuable in a narrow slice of workflows that already exist.
  claimRefs:
  - CM006
  - CM009
  - CM038
- calloutType: risk
  title: Top-down TAM can mislead
  body: Forecasts from below $2T to above $30T all support “large market” narratives, but they do not prove Zama’s near-term serviceable market. Performance economics, operator complexity, and token overhang could keep realized adoption far below headline TAM for several years.
  claimRefs:
  - CM016
  - CM017
  - CM027
  - CM034
  - CM040
