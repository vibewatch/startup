company:
  name: Zama
chapter:
  number: 2
  title: Market Analysis
  summary: Zama is not attacking a generic “privacy tech” market; it is targeting the narrower but increasingly important need to run compliant, confidential workflows on public blockchains. Public data shows that the live RWA market has already reached roughly $19.3 billion by Q1 2026, stablecoin payment flows hit $4.5 trillion in Q1 2026, and institutional tokenization forecasts still span from under $2 trillion to well above $10 trillion by 2030. The opportunity is therefore real, but Zama’s realistic near-term market remains much smaller than top-down TAM headlines because buyer adoption still depends on performance, regulation, integration complexity, and post-launch token stability.
sections:
- id: market-boundary-and-status-quo
  title: Market Boundary and Status-Quo Substitutes
  body: 'Zama’s market only makes sense when defined narrowly. The company is not simply a participant in “privacy” or even in the whole confidential-computing market. It is selling programmable confidentiality for assets and logic that still need to live on public blockchains. That boundary matters because it excludes a large amount of adjacent spend: organizations can still choose private chains, zero-knowledge-heavy designs, trusted execution environments, or permissioned-network architectures if they care more about control, settlement finality, or legal enforceability than about shared public-chain composability. The retained sources repeatedly describe the same problem from different angles: public ledgers expose sensitive balances, investor positions, trading logic, and identity-linked data; that openness helps verification but blocks many institutional or regulated workloads. In that sense, the status quo substitute is not “do nothing.” It is to remain on private infrastructure or
    adopt narrower privacy tools. Zama’s claim to relevance is that buyers can preserve public-chain composability and still keep data hidden. If that claim proves true, the market wedge is meaningful. If not, the company risks being trapped between permissioned incumbents and alternative privacy architectures that satisfy buyers with less complexity.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM026
  - CM029
  tableRefs:
  - TM001
  figureRefs:
  - FM004
- id: sizing-lenses
  title: 'Sizing Lenses: Payments, Tokenization, and Institutional Finance'
  body: 'The right way to size Zama’s market is to stack multiple lenses rather than anchor on one inflated headline. The payments lens is already enormous: the litepaper treats stablecoins as a leading blockchain use case with trillions in yearly volume, and Forbes cited a16z research showing $4.5 trillion of stablecoin payment volume in Q1 2026 alone. The tokenization lens is smaller today but more obviously aligned with confidentiality needs. CoinGecko data summarized by Crowdfund Insider shows RWAs at $19.3 billion by Q1 2026 after tripling from the start of 2025, with Treasuries still dominant but commodities, stocks, and ETFs growing quickly. Institutional infrastructure adds another sizing clue: T-REX says ERC-3643 already secures $32 billion of assets and Apex-backed infrastructure aims for $100 billion by mid-2027. For longer-dated TAM, the spread is huge. McKinsey’s base case remains below $2 trillion by 2030, while BCG-backed tokenized-fund materials alone suggest $600 billion
    of AUM and broader forecast summaries run far above that. The correct takeaway is not that every trillion-dollar estimate is wrong. It is that Zama’s eventual TAM can be large while its credible near-term SAM remains much narrower and tied to specific productized workflows.'
