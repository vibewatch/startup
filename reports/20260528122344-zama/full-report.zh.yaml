      - number: '2.4'
        title: 增长驱动、约束与市场风险
        blocks:
          - type: paragraph
            body: >-
              Zama 的需求侧逻辑很直接：公链金融规模已经很大，代币化正在扩展，更多机构工作流想要隐私加互操作性，而不是用隔离换隐私。 保留来源显示，合规、选择性披露和抗抢跑不是附带收益，而是买方愿意付费的核心原因。
              但约束同样重要。技术仍要靠专用硬件进步、运营商网络信任和性能提升，才能补上“演示很有吸引力”与“默认市场标准”之间的差距。 竞争性隐私模型仍然可行。Zama
              自身代币又引入第二个市场变量：如果估值、解锁和投机压过使用增长，就可能反噬企业可信度。 这里保留的反向证据并不致命，但足以否定无摩擦采用故事。 最现实的看法是：Zama
              处在一个增长市场中，结构性需求驱动很强；但公司仍要证明基于 FHE 的保密能力可以经济化扩展、顺畅集成，并在技术周期和代币市场周期中持续守住信心。
