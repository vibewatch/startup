            title: 现有市场已经大到值得关注
            body: $4.5T 的季度稳定币支付流量，加上 $19.3B 的现有 RWA 市场，意味着 Zama 不需要靠投机性的未来市场来证明关注价值。它只需要让保密能力在一小段已经存在的工作流里变得有价值。
