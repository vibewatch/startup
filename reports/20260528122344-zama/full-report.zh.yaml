chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              在公司主体层面，Zama 的法律与商业身份异常清晰；到产品叙事层面，边界仍有些流动。 法律声明和法国登记记录显示，Zama 是一家注册办公室位于 8 rue du Sentier、总部在巴黎的
              SAS；当前官网则不再把 Zama 包装成泛化的 FHE 研究实验室，而是强调以 Zama Protocol、$ZAMA 代币、开发者工具和企业区块链用例为中心的运营型协议公司。
              这个公开姿态很关键：公司叙事已从宽泛的“开源密码学公司”转向协议与网络模式，后续章节也应把它作为当前运营基线。 同一批官方材料和代码仓库页面还显示，Zama 推的不是一条新链。它借助 FHE 库、协议服务、SDK
              和运营商基础设施，在既有公链之上销售一层保密能力。 这一区别对尽调很重要，因为它决定买方采用路径、资本强度和竞争集合。 Zama 的开源足迹也不是装饰：组织页面、TFHE-rs、Concrete ML，尤其是
              FHEVM，都显示出可量化的开发者关注度，说明公司的产品面不止一个代币或一条合作公告。
