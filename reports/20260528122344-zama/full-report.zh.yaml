      - number: '8.3'
        title: 可比对象与情景
        blocks:
          - type: paragraph
            body: >-
              可比集合无法给出整齐公式，但仍有信息量。Fireblocks 是乐观的私募市场锚点：成熟的机构加密基础设施平台，据报道二级市场式估值 $8B，已融资 $1B。Digital Asset 是更冷静的企业账本锚点，在
              Premier Alternatives 上约 $380M。Arqit 提供公开市场警示样本：一家上市密码学公司，可以在极高收入倍数上交易，却仍只有几十万美元的当期收入。Zama
              介于这些两端之间。它的类别动能强于小众上市加密安全微盘股，但披露的分发广度远少于 Fireblocks。


              因此，情景分析比点估值更自然。牛市情景里，Dfns 式分发加上机构隐私需求，转化为可重复交易量和费用销毁，从而验证或超过最近一轮私募股权估值。基准情景里，Zama
              继续发货，维持强质押参与度，并扩大生产用例，但投资者仍需要在财务证据不完整的情况下控制仓位。熊市情景里，监管继续高压，与隐私相关的代币仍被折价，协议难以把技术可信度转化为可持续经济性，合理价值回落到代币销售或二级市场区间。今天的公开证据最支持基准情景，而不是牛市情景。
