      - number: '1.4'
        title: 规模信号与关键警报
        blocks:
          - type: paragraph
            body: >-
              Zama 当前画像里最强的正面信号，是多个独立领域指向同一个模式：开源参与度很高，一线加密与基础设施投资方在场，合作伙伴贴近受监管金融工作流。 最强的负面信号，是市场信心仍跑在已验证运营披露之前。 Zama
              称其向数十家公司许可技术，合作伙伴材料也指向机构用例；但公开证据仍撑不起收入、精确客户数或董事会层面治理的硬指标。 同时，多家独立来源认为底层 FHE
              市场仍处早期，可用性能仍离不开专用硬件进步，公开代币价格波动也足以暴露估值风险。 TechCrunch 质疑同态加密是否已达到大众市场可扩展性；MEXC 和 CoinGabbar
              则把公开代币安排描述为估值激进、面临供应悬顶。 这些都不是致命警报，但会改变尽调姿态。 Zama
              目前更像一家资本充足、技术差异化明确、确有生态拉力的协议公司，而不是一家已完全去风险、披露纪律成熟的金融基础设施平台。
