      - number: '7.4'
        title: 财务包袱与否决条件
        blocks:
          - type: paragraph
            body: >-
              Zama 的融资数据很亮眼——2025 年 Series B 融资 $57M，估值超过
              $1B——但最可投资的问题不是公司有没有融到钱，而是监管、商业化和代币分发风险，能否在公司必须证明持久变现之前被压下来。公开拍卖数据令人鼓舞，因为它显示兴趣强，且未报告停机；但也显示需求质量受退款影响很大：$118.5M
              承诺额最终只有 $44M 由中标方支付。这是有用的价格发现，不是稳定长期需求的证明。公司也称协议上线前已向数十家公司授权技术，但公开收入、留存、正常运行时间 和转化指标仍然缺位。


              实际投资含义是，Zama 的风险不能只靠密码学打分。会打破投资论点的事件可以监控：制裁、AML 或 MiCA 合规失败；重大安全或解密事故；运营商集中度变得不稳定；或伙伴试点无法转成生产使用。反过来，如果
              Zama
              披露公开审计、经常性机构收入、面向监管的合规工作流，以及重复的生产交易量，剩余风险会显著下降。在此之前，协议应因真实上线进展获得认可，但证据基础仍更偏向技术可行性，而不是规模化商业耐久性，因此剩余风险仍高。
