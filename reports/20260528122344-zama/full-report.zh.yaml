      - number: '2.2'
        title: 规模测算视角：支付、代币化与机构金融
        blocks:
          - type: paragraph
            body: >-
              测算 Zama 市场，正确方法是叠加多个视角，而不是锚定一个膨胀的标题数字。 支付视角已经很大：litepaper 把稳定币视为领先的区块链用例，年交易量以数万亿美元计；Forbes 引用 a16z 研究称，仅
              2026 年 Q1 稳定币支付量就达到 $4.5 trillion。 代币化视角今天更小，但与保密需求更明显对齐。Crowdfund Insider 汇总的 CoinGecko 数据显示，RWA 在 2025
              年初以来增长两倍后，到 2026 年 Q1 达到 $19.3 billion；美国国债仍占主导，但大宗商品、股票和 ETF 增长很快。 机构基础设施又给出一条测算线索：T-REX 称 ERC-3643 已保护
              $32 billion 资产，Apex 支持的基础设施目标是在 2027 年中达到 $100 billion。 更长期的总可用市场（TAM）口径差异巨大。McKinsey 的基准情景到 2030 年仍低于 $2
              trillion；仅 BCG 支持的代币化基金材料就指向 $600 billion AUM，更宽的预测汇总远高于此。 正确结论不是所有万亿美元级估算都错，而是 Zama 最终 TAM
              可以很大，但可信的近期可服务市场（SAM）要窄得多，并且绑定具体产品化工作流。
