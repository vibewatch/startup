      - number: '3.3'
        title: 定价可见度、分销能力与机构触达
        blocks:
          - type: paragraph
            body: >-
              这个市场整体公开定价都偏弱，这本身就是竞争事实。 Zama 称部署免费，但没有为保密应用公布清晰的企业价格表；许多同业协议同样不透明。 公开集合里的少数具体数字来自替代方案或基础设施厂商。Oasis
              Sapphire 公布了强相对性能和费用主张；AWS、Azure 和 Google 则把保密能力作为既有基础设施目录的一部分销售，而不是作为独立隐私产品。 Zama 很难匹配这种捆绑式分销能力。 同时，Zama
              进入市场并非没有现场证据。Dfns 集成把保密代币标准暴露给 400 多家企业客户，Kinexys 概念验证则显示至少一个大型金融基础设施沙盒测试过这套栈。
              这些是有意义的市场进入信号，但相较超大规模云基础设施或上线历史更长、市场运行更成熟的主网替代方案，它们仍更早、更窄。
