      - number: '7.3'
        title: 伙伴与商业依赖
        blocks:
          - type: paragraph
            body: >-
              Zama 的商业叙事高度依赖外部验证的机构用例。这是优势，因为公司不是抽象地卖隐私，而是把保密性绑定到工资、钱包、OTC 交易、代币化 RWA，以及 JPM
              组织的隐私研究上。但这也是集中风险，因为大量证据仍由试点、PoC 或伙伴推动。J.P. Morgan 的 Project EPIC
              明确把隐私、身份和可组合性列为代币化金融的前提；但被引用的成果是一篇论文加概念验证，不是规模化生产项目。GSR 公告同样被定位为概念验证。T-REX 和 Dfns
              更有商业含金量，因为它们更接近机构分发：T-REX 称 ERC-3643 下已有 $32B 上链，Apex 承诺到 2027 年 6 月目标 $100B；Dfns 则称由 Zama 驱动的保密基础设施可提供给
              400+ 企业客户。


              这些伙伴叙事仍留下执行缺口。投资者还没有公开证据能判断 PoC 到经常性合同的转化率、伙伴收入贡献、客户集中度或标准化
              SLA。运营商名单很强——Fireblocks、Ledger、Figment、DFNS、OpenZeppelin、Etherscan
              等——但同一名单也把声誉和运营依赖集中在相对小的基础设施专家圈子里。只要其中少数标杆伙伴降低 Zama 优先级，协议的商业可信度就可能比密码学本身更快下滑。
