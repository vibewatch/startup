  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与替代边界
        blocks:
          - type: paragraph
            body: >-
              不能只拿一个狭窄同业集合来承销 Zama。 直接同业是一小群 FHE 原生保密层公司，尤其是 Fhenix 和 Inco，因为它们同样承诺为既有区块链用户提供保密智能合约。 替代集合更宽，也更危险。Secret
              Network 和 Oasis Sapphire 提供已经推向市场、信任假设不同的保密执行环境；Aztec 和 Aleo 则借助新的 zk rollup 或专用私密应用栈，进攻相邻隐私工作负载。 Partisia
              和 Arcium 又通过基于 MPC 的机密计算扩大竞争场。 现状替代方案往往根本不是另一个加密协议，而是 AWS、Azure 或 Google Cloud 的企业
              enclave，让买方把敏感逻辑留在链下或内部构建工作流里。 更宽的边界很重要，因为买方不需要专门相信 FHE 就能解决同一个任务。若 TEE、zk-first 设计或云 enclave
              栈看起来更成熟、更便宜、更容易向内部解释，采购团队仍可选择它们。
