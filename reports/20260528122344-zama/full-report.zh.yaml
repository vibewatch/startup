      - number: '7.2'
        title: 运营与安全执行
        blocks:
          - type: paragraph
            body: >-
              协议已经不只是概念：Zama 有公开测试网使用数据、完成的去中心化密钥生成仪式、上线的质押，以及至少一笔主网工资交易。即便如此，从技术上亮眼的发布走到机构级可靠性，路径仍然很窄。测试网更新披露了超过 120
              万笔加密交易、超过 19,000 份保密合约、120,000+ 活跃钱包和 20+ 伙伴；FHEVM v0.9 则被定位为首个主网候选版本，并把解密性能提升
              10x。这些都是强进展信号，但也暴露出这套技术栈仍然高度依赖性能。DKG 仪式中每方传输了 10.5 TB 数据，协议也仍依靠阈值 MPC 和相对较小的运营商集合，来维持密钥管理去中心化。


              主网上线没有消除实施风险。Zama 的上线后更新称全栈已经上线且可集成，但 SDK 仍处于测试版，委托解密也只是刚发布的新原语。质押上线时有 18 家运营商，分为 5 个 FHE 节点和 13 个 KMS
              节点；超过一半流通供应量已经质押。这改善了经济对齐，但也意味着，只要有限基础设施伙伴中出现运营中断、密钥管理故障或协调失败，就可能同时冲击用户信任和估值。第一笔保密工资交易是真正的里程碑，但单笔工资交易还不能替代长期公开
              正常运行时间记录、广泛应用多样性或披露的事故指标。
