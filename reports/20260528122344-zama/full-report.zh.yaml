      - number: '3.2'
        title: 能力、信任模型与开发者迁移
        blocks:
          - type: paragraph
            body: >-
              买方既看重不依赖可信硬件的隐私，又不想迁移到专用私链时，Zama 的技术故事最强。 Zama 自身材料和 Figment 分析都把产品描述为既有 L1 和 L2 之上的一层：用链下 FHE
              协处理器加阈值密钥管理，而不是新执行环境。 Fhenix 是理念上最接近的对手，因为它同样为 Ethereum 营销纯 FHE 隐私，并称开发者可以留在标准 Solidity 中。
              Inco、Secret、Oasis 和云 enclave 厂商则从不同角度竞争：它们承诺兼容性和更容易集成，但依赖 TEE 或 enclave 假设。 Aztec 从相反方向竞争，完全拒绝 TEE，改用隐私优先的
              zk rollup；但这种方案会带来新 VM 和更高迁移成本。 Aleo 在架构上离 Zama 更远，因为它要求开发者进入自己的程序、节点和质押世界。
              因此，能力问题不只是“有没有隐私”，而是买方愿意接受哪一种信任与迁移取舍。
