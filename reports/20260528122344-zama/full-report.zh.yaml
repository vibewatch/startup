  - id: TV005
    title: 投资逻辑破裂和止损触发表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 商业证据迟迟不出现
        - 到下一次重大融资或金库事件时，仍没有收入 / 费用消耗披露
        - 估值仍由叙事驱动，而不是经济性驱动
        - 不要在估值区间中段以上做投资测算
      - - 监管折价扩大
        - 针对隐私相关资产和选择性披露设计的新限制或交易所反弹
        - 代币和股权倍数被压缩
        - 将基准情景移向悲观区间
      - - 合作伙伴转化停滞
        - 除当前上线和合作伙伴公告外，没有新增生产案例
        - 企业分发逻辑明显弱化
        - 下调确信度，要求更低入场价
      - - 网络安全性走弱
        - 质押参与度或运营方质量从当前占流通量多数和 18 家运营方阵容的水平恶化
        - 安全性和可信度溢价快速压缩
        - 重新评估代币和股权投资测算
      - - 股权结构表或悬置风险爆雷
        - 代币解锁、排放或金库行为的支撑力度低于暗示水平
        - 公开定价区间高估可持续价值
        - 暂停资金部署，直到股权结构表清晰度提升
    notes: 每个触发因素都应靠公开或管理层提供的证据监测，而不是靠主观叙事更新。
    claimRefs:
      - CV009
      - CV010
      - CV031
      - CV032
      - CV036
      - CV037
      - CV038
      - CV042
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 收入质量
        - 费用消耗、协议收入、企业合同价值和客户集中度
        - 缺少这些，估值无法跳出基于区间的启发式判断
        - 管理层财务包，加上从代币活动到收入的 KPI 桥接
      - - 单位经济性
        - 毛利率、运营方补贴负担、每笔保密交易的服务成本
        - 用来检验费用消耗能否跑赢排放和基础设施成本
        - 财务主管 / FP&A 尽调会
      - - 法律准备度
        - MiCA / 旅行规则 / 制裁操作流程和法律意见
        - 用来判断机构采用是否被合规摩擦卡住
        - 外部律师备忘录和合规工作流演示
      - - 股权结构表和代币悬置
        - 金库持仓、解锁时间表、权利以及股权 / 代币互动
        - 用来理解稀释，以及代币定价是否会脱离股权价值
        - 法务 / CFO 股权结构表审查
      - - 客户证据
        - 除薪资支付外的具名生产部署，以及重复交易量
        - 用来区分概念验证和可持续商业化
        - 客户背调电话和产品使用仪表盘
    notes: 这些问题刻意收窄到能决定投资的事项；相比更多市场规模报告，这些缺口更能快速改变建议。
    claimRefs:
      - CV026
      - CV027
      - CV036
      - CV042
