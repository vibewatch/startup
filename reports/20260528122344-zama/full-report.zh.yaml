      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              创始人质量是 Zama 最强的公开可见资产之一。 Rand Hindi 仍是公司在法律披露、融资公告和产品传播中的主导外部发声者；Pascal Paillier 则为这套栈压住科学可信度。
              合作方和媒体来源强化了同一条叙事：Zama 的可信度很大程度上靠这对创始人支撑。Hindi 把公司的隐私逻辑翻译成市场故事，Paillier 则提供密码学权威，让“FHE 已从理论走向可用基础设施”这句话站得住。
              公开团队快照也显示，Zama 的研究属性异常重：96 名员工中有 37 名博士；Jeremy Bradley 带出可见的运营层，Benoît Chevallier-Mames 则体现产品工程深度。
              但机构投资者通常想看的结构性披露仍偏薄。公开证据足以识别创始人和少数运营者，却不足以画出完整董事会、投票结构或当前股权结构表控制权。
              结果是：这家公司看起来由创始人主导、人才密度很高，但治理透明度仍不足。因此，在进入代币或协议经济之前，关键人依赖和信息不对称已经是真实尽调议题。
