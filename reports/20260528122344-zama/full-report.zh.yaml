        - id: u6
          label: 持久性测试
          description: 续约、交易量增长和集中度结果决定该具名客户会成为持久客户，还是只留下一个一次性证明点。
    claimRefs:
      - CU005
      - CU009
      - CU011
      - CU013
      - CU017
      - CU042
      - CU043
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: Zama 的漏斗顶部活动如何从构建者和标准工作，推进到具名部署和近生产证明。
    data:
      nodes:
        - id: f1
          label: 构建者和标准漏斗
          detail: 开发者计划、黑客松、标准组织和生态列表带来漏斗顶部关注
        - id: f2
          label: 测试网或沙盒实验
          detail: 应用部署到 Sepolia，或机构团队在受控环境测试私有工作流
        - id: f3
          label: 渠道或基础设施集成
          detail: 钱包、浏览器或基于标准的基础设施采用包装器和机密 token 支持
        - id: f4
          label: 具名近生产工作流
          detail: 工资发放、OTC 交易或钱包发布成为公开证明点
        - id: f5
          label: 更广客户触达
          detail: 平台合作伙伴或标准组织把 Zama 支持的功能延伸给下游机构或应用
        - id: f6
          label: 商业持久性
          detail: 剩下的一步是续约、经常性使用和跨工作流扩张；这些大多仍未公开
      edges:
        - from: f1
          to: f2
        - from: f2
          to: f3
        - from: f3
          to: f4
        - from: f4
          to: f5
        - from: f5
          to: f6
    claimRefs:
      - CU020
      - CU022
      - CU024
      - CU025
      - CU026
      - CU042
