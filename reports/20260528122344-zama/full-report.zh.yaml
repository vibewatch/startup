      - number: '5.2'
        title: 运营模式是分层的：公链保密合约、链下协处理器，以及 MPC 支撑的密钥控制
        blocks:
          - type: paragraph
            body: >-
              公开证据足够具体，能勾勒真实架构，而不是模糊的隐私故事。 FHEVM 是开发者直接接触的智能合约框架，但它只是其中一层。 这套栈还包括宿主链合约、网关、执行加密计算的链下协处理器、KMS 连接器、中继器，以及阈值
              MPC 密钥管理设计。 这很关键，因为 Zama 明确想保留公链可组合性，同时把 FHE 中昂贵的部分移出基础链。 协议文档和第三方解读都描述了
              handle、委托解密、封装器，以及用于密钥生成和访问控制的链上协调。 结果比纯研究原型更面向生产，但也意味着产品从链下运营商、专用计算和编排服务继承了真实依赖风险。 因此，投资者应把 Zama
              看作一个有多重运动部件的保密运营层，而不是一个可以孤立评估的单一库。
