companyProfile:
  summary: >-
    Zama 是一家总部位于巴黎的开源密码学公司，2019 年末注册，公开材料称由 Rand Hindi 和 Pascal Paillier 于 2020 年创立。 公司靠两条线把全同态加密（FHE）商业化：面向公链的保密层，以及涵盖
    FHEVM、TFHE-rs、Concrete 和 Concrete ML 的更广泛开发者栈。 截至 2026-05-28 的运行日，公开证据显示团队 96 人、其中 37
    名博士，并有一线加密与基础设施投资方支持，协议栈也已上线；但收入质量和客户耐久性的披露仍有限。
