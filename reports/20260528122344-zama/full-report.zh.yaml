  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 剩余风险集中在监管、运营方集中度和商业化不透明度。
    data:
      columns:
        - 关键影响
        - 高影响
        - 中等影响
      rows:
        - label: 高可能性
          values:
            - tone: negative
              label: 旅行规则 / 制裁执行复杂，拖慢机构入驻
            - tone: negative
              label: SDK 仍处 beta 阶段，运营方集中带来持续执行阻力
            - tone: neutral
              label: 隐私政策和数据治理更新滞后于产品扩张
        - label: 中等可能性
          values:
            - tone: negative
              label: MiCA 边界或合规解读阻断旗舰用例
            - tone: negative
              label: PoC 合作伙伴未能转化为经常性生产流
            - tone: neutral
              label: 拍卖需求显得波动，而非粘性
        - label: 低可能性
          values:
            - tone: negative
              label: 主网密钥管理或解密事件损害信任
            - tone: neutral
              label: 大型合作伙伴调整优先级，转离机密性用例
            - tone: positive
              label: 兼容监管的选择性披露成为护城河，而非负担
    claimRefs:
      - CR006
      - CR011
      - CR015
      - CR018
      - CR024
      - CR027
      - CR035
      - CR041
  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: 监管和架构失败会传导为合作伙伴转化放慢、需求走弱和估值压缩。
    data:
      nodes:
        - id: n1
          label: 合规摩擦
          description: MiCA、旅行规则、制裁、GDPR、入驻控制
        - id: n2
          label: 运营方集中
          description: 18 个运营方 / 13 个 KMS 节点，第三方依赖度高
        - id: n3
          label: SDK 和集成风险
          description: beta 阶段工具加复杂 FHE / 委托解密流程
        - id: n4
          label: 合作伙伴转化风险
          description: PoC 和已宣布渠道未能变成可重复的生产使用
        - id: n5
          label: 需求质量风险
          description: 拍卖超额认购、退款比例和 token 需求波动
        - id: n6
          label: 收入可见性缺口
          description: 收入、留存和可用性仍未公开披露
        - id: n7
          label: 估值压力
          description: 商业验证滞后，投资者会折价看待技术进展
      edges:
        - from: n1
          to: n4
        - from: n1
          to: n7
        - from: n2
          to: n4
        - from: n2
          to: n7
        - from: n3
          to: n4
        - from: n4
          to: n6
        - from: n5
          to: n7
        - from: n6
          to: n7
    claimRefs:
      - CR021
      - CR024
      - CR025
      - CR027
      - CR030
      - CR032
      - CR040
      - CR042
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: standard
    summary: Zama 要把隐私基础设施转成可持续采用，得靠运营方、渠道和机构验证者。
    data:
      nodes:
        - id: n1
          label: Zama 协议
          description: 保密智能合约栈和代币经济
        - id: n2
          label: 运营方集合
          description: FHE 和 KMS 节点，包括 Fireblocks、Ledger、Figment、DFNS、OpenZeppelin 及同类方
        - id: n3
          label: 钱包 / 企业渠道
          description: Dfns 等钱包 / 托管入口
        - id: n4
          label: 机构验证点
          description: J.P. Morgan Project EPIC、GSR、Bron 薪资
        - id: n5
          label: 代币化资产渠道
          description: T-REX / ERC-3643 生态和保密金融合作方
        - id: n6
          label: 受监管金融采用
          description: 生产环境客户使用和变现
      edges:
        - from: n1
          to: n2
        - from: n1
          to: n3
        - from: n1
          to: n4
        - from: n1
          to: n5
        - from: n2
          to: n6
        - from: n3
          to: n6
        - from: n4
          to: n6
        - from: n5
          to: n6
    claimRefs:
