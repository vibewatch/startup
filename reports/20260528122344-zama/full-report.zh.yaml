  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与价格纪律
        blocks:
          - type: paragraph
            body: >-
              公开证据不给出一个干净的 Zama 单一价格，而是给出一个区间。最近一个明确披露的股权数据点，是 2025 年 6 月估值超过 $1B 的 Series B。Premier Alternatives
              的二级市场式数据指向约 $840M。Alpha Drops 显示 2026 年 1 月公开代币销售估值为 $550M；Zama 自己的拍卖页面又补充了细节：承诺额 $118.5M、实际支付仅 $44M、出清价
              $0.05，且超额认购很重。这些数据点并不完全可互换——代币出清、二级市场指示和私募股权估值，是流动性和控制权不同的工具——但合在一起说明一件重要事：市场尚未给 Zama 定出一个显而易见的价格。


              这种模糊性很重要，因为 Zama 仍没有公开披露收入、ARR、利润率或留存。在这种背景下，不能像给一家财务 KPI 清晰的私有 SaaS 公司那样，用同样信心给 Zama
              估值。公开价值论据建立在三点上：机密计算类别领先、协议确实上线的证据，以及来自运营商、拍卖和机构渠道的早期需求信号。这足以支持继续尽调和不低的战略溢价；但如果没有未披露商业化数据作为条件，还不足以承销任何高于
              $1B 的价格。
