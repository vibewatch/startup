            body: >-
              融资侧看，标题数字很强，流动性细节很弱。 2024 年 Series A 轮和 2025 年 Series B 轮形成了可见的股权基础；2026 年 1 月公开拍卖带来 $44 million 中标出价，并以
              11,103 名独立竞价者显示强市场胃口。 官方和独立报道一致认为，Series B 轮用于资助主网上线、生态增长和持续 R&D。 这足以判断 Zama 抽象意义上并不缺资本，却不足以判断今天的现金跑道。
              当前现金余额、月度烧钱速度和预期现金跑道仍未出现在保留的公开记录中。 法律实体图谱也重要。代币销售条款指向 Zama Switzerland AG 作为代币发行方，法国登记记录则指向 ZAMA SAS
