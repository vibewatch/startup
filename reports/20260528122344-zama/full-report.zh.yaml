            body: >-
              公开牵引证据存在，但大多是代理证据，不是会计证据。 Zama 自己的关于页面显示 96 人和 37 名博士；TechCrunch 此前报道，2024 年团队 75 人、3,000 名开发者使用这些库；到 2025
              年 6 月，Tech.eu 和 EU-Startups 报道开发者超过 5,000 名。 Dfns、Kinexys 和 T-REX 分别以不同方式强化机构需求故事：Dfns 可能分销到 400
              多家企业客户；Kinexys 给 Zama 一个大型银行沙盒证明点；T-REX 公告则把这套栈接到 ERC-3643 代币化基础设施上。 但这些来源都没有披露确认收入、付费客户数、平均合同价值或贡献利润率。
              成本侧也只部分可见。TFHE-rs 文档和官方融资报道强调，GPU、FPGA 和 ASIC 加速是规模化路径，这意味着计算和研究强度会持续。
              仅员工数增长也意味着固定成本基础在上升。因此，公开证据支持需求和技术投入真实存在，却不能搭出一条从产品使用到毛利润的清晰公开桥梁。
