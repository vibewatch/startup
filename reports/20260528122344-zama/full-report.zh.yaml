      - number: '4.4'
        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              因此，财务结论是混合的。 Zama 有可信的商业化证据、可信的机构兴趣，以及对一家深密码学公司而言异常强的融资支持。这些都是真正的正面因素。
              但保留来源仍让核心承销问题悬而未决。登记和备案来源提供实体、资本和持续经营通知，却没有提供足以做下行情景分析的一组公开财务报表。
              公开媒体来源提供签约合同价值、开发者采用和融资估值标记，但没有提供确认收入、年经常性收入（ARR）、毛利率、现金、烧钱速度或现金跑道。 反向记录不算灾难性，但有意义：Societe.com 保留了 2021
              年净资产跌破资本一半后的继续经营通知；代币市场评论则强调完全解锁风险、估值缺口观感和波动的二级市场表现。 结果是，这家公司的增长与融资叙事，比收入质量和当前偿付能力证据链有更充分证据。
              本章建议因此停留在“需求证据丰富、会计证据偏薄”。
