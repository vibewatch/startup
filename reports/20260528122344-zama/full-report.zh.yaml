        - 入场价格应反映财务披露不完整
      - - 持有 / 重估触发因素
        - 只有披露费用消耗、收入和企业转化数据后才重估
        - 不要仅因技术新颖就支付溢价
    notes: 取值仅基于截至 2026-05-28 抓取到的公开证据；不假设代币市场与股权市场数据点在经济含义上相同。
