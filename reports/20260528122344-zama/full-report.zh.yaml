  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Zama 的品类位置和早期验证较强，但财务可见性和定价清晰度偏弱。
    data:
      items:
        - id: market
          label: 市场顺风
          value: Strong
          description: 代币化和保密需求仍然强劲
          tone: positive
        - id: product
          label: 产品验证
          value: Moderate-Strong
          description: 主网里程碑已经落地，但仍处早期
          tone: positive
        - id: distribution
          label: 分销
          value: Moderate
          description: Dfns 和合作伙伴渠道有潜力，但尚未规模化验证
          tone: neutral
        - id: economics
          label: 财务可见性
          value: Weak
          description: 收入和利润率未披露
          tone: negative
        - id: regulation
          label: 监管敞口
          value: High
          description: 隐私相关资产仍承受折价和合规复杂度
          tone: negative
        - id: pricing
          label: 定价纪律
          value: Critical
          description: 公开定价区间宽，尚未收敛
          tone: negative
        - id: evidence
          label: 证据质量
          value: Medium
          description: 技术 / 市场证据强，商业 KPI 弱
          tone: neutral
    claimRefs:
