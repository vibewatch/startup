    则服务于加密计算与隐私保护机器学习。
  customerFocus: 核心客群是区块链开发者、代币化资产发行方、钱包、托管与结算基础设施提供商，以及其他需要保密链上工作流的机构；次级方向包括隐私保护 AI 和加密数据应用。
