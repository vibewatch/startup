  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 投资逻辑
      - 反向逻辑
    rows:
      - - 市场需求
        - 代币化金融越来越需要隐私、身份和可组合性
        - 代币化资产 TAM 材料不能证明 Zama 能捕获经济价值
      - - 产品验证
        - 主网质押、DKG、薪资支付和 SDK 上线，显示出真实交付速度
        - SDK 仍是测试版，公开正常运行时间 / 事故证据仍稀少
      - - 分发
        - Dfns 及其他运营方 / 合作伙伴渠道能加快企业触达
        - 公开机构证据大多仍以 PoC、合作伙伴或公告为主
      - - 定价支撑
        - 多个公开定价点拼出可投资区间
        - 同一组定价点也说明市场尚未形成一个可信价值
      - - 护城河质量
        - 可编程保密性与传统隐私币定位拉开差异
        - 合规落地一旦卡住，监管折价仍会压缩任何隐私相关协议
      - - 资本基础
        - Series B 轮为生态建设提供现金跑道
        - 已融资本不能替代收入、毛利率或留存证据
    notes: 这组反向逻辑有意围绕价格和证据敏感性展开，而不是泛泛的质量批评。
