  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律边界
        blocks:
          - type: paragraph
            body: >-
              Zama 的风险首先不是纯密码学，而是法律架构。公开网站由法国 SAS 运营；代币销售、拍卖和拍卖专用隐私声明，则由位于 Zug 的 Zama Switzerland AG
              发布。这个拆分本身不构成问题，但投资者必须同时追踪两套法律足迹、多项管辖法律条款，以及几套彼此独立的条款。网站条款把争议置于法国法和巴黎上诉法院之下；代币销售链条又叠加了瑞士公司和制裁筛查义务。代币拍卖和销售条款明确排除受制裁人士、被拒绝方以及
              AML 不合作司法辖区居民；销售隐私声明则称 Zama 会收集钱包地址，以及来自 Sumsub 的 KYC 数据。这个方向与公司“隐私可以和合规共存”的说法一致，但也意味着协议可投资性高度取决于跨司法辖区
              AML、制裁、准入和披露控制能否执行到位。


              外部监管正在收紧，正好压在 Zama 想商业化的领域。ESMA 将 MiCA 描述为一套覆盖加密资产活动透明度、披露、授权和监管的统一制度；EU travel rule
              则把发起人和受益人可追踪性延伸到加密资产转移。FATF 和 FinCEN 从另一个角度给出同样判断：私密或加密的价值转移，并不会取消可追踪性预期。Zama
              的选择性披露设计是一种缓释，因为它试图保留监管者或审计方访问入口；但公开材料尚未展示经过监管检验的合规落地，也未披露牌照状态。因此，任何押注其快速拿下受监管金融客户的投资论点，剩余风险都很高。
