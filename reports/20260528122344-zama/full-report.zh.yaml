            body: >-
              相比许多加密基础设施项目，Zama 披露的信任和运营细节更多。 公开材料描述了 13 节点 MPC 设计、链上分布式密钥生成、面向受监管读者的委托解密、规模很大的首发审计投入，以及拆分核心服务的实时状态页。
