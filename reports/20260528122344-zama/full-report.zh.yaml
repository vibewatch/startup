  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、变现面与代币经济
        blocks:
          - type: paragraph
            body: >-
              Zama 公开可见的经济模型比典型单产品 SaaS 公司更宽，但也远没那么明确。 协议上线前最清晰的商业化证明来自 TechCrunch 2024 年 3 月访谈。Rand Hindi 当时称，Zama
              已在六个月前开始商业化，签下超过 $50 million 合同价值，对部分加密客户收取代币，对使用私有链的银行按交易收费。 这些表述意味着商业模式以企业许可和使用量定价为中心，而非自助订阅。
              协议上线后发布的官方来源又加了一层变现：代币被设计用于加密、解密、跨链和运营商参与；公开拍卖和 CoinList 材料则描述了一次融资事件，清算价 $0.05，最终付费金额 $44 million。
              这一点很重要，因为代币销售不应与运营收入混淆。条款明确否认股权、债务或收入分成权利，因此代币更像网络融资加未来效用经济，而不是经常性软件收入的直接替代品。
