  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 证据
      - 重要性
      - 尽调问题
    rows:
      - - 现有链上的纯 FHE 保密性
        - Fhenix 在 Ethereum 上给出类似承诺
        - 中
        - Fhenix 也用标准 Solidity 钩子宣传纯 FHE 隐私
        - 直接同行把差异缩窄到执行质量和生态牵引力
        - 在匹配试点中测试开发者对 Zama 与 Fhenix 的偏好
      - - 不要求可信硬件
        - Aztec 认为 TEE 不可接受，zk 系统可以占住信任最小化叙事
        - 中
        - Aztec 明确攻击 TEE 和后门
        - 当 zk 迁移可接受时，反 TEE 买方并不会自动归 Zama
        - 访谈买方：zk 隐私是否值得迁移到新 VM
      - - 现有链部署
        - 云保密计算可在现有采购渠道内、以链下方式完成同一任务
        - 高
        - AWS、Azure 和 Google 都把保密计算作为通用基础设施销售
        - 维持现状的内部自建可能比区块链原生隐私更容易获批
        - 建模预算负责人有多常来自云基础设施，而不是协议创新
      - - 机构市场路径
        - 更宽泛的替代方案有更长生产历史或更强采购入口
        - 高
        - Secret 和 Oasis 有真实市场历史；超大规模云厂商已有现成合同
        - 企业采购里，分发可能比架构纯度更重要
        - 索取 Dfns 和具名机构试点的转化数据
      - - 研究型团队和 FHE 路线图
        - 硬件和性能路线图耗时可能超过替代方案采用曲线
        - 高
        - Zama 仍指向 GPU、FPGA 和 ASIC 里程碑，用来缩小吞吐差距
        - 如果买方今天接受足够好的保密性，未来硬件胜利可能来得太晚
        - 获取当前单笔交易成本，以及硬件里程碑时间线的信心
      - - 跨架构市场教育
        - 到 2026 年，尚无单一隐私架构显出主导地位
        - 中
        - ChainSafe 和 BlockEden 都把市场描述为 FHE、ZK、TEE 之间的取舍
        - 市场碎片化支持多栈并用，削弱硬锁定
        - 测试客户计划单栈标准化，还是分层共存
    notes: 严重性来自分析师判断，反映投资判断风险，不是供应商报告的 KPI。每行都基于已抓取的架构或市场结构证据。
