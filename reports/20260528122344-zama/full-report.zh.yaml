      - number: '8.4'
        title: 建议与最终尽调
        blocks:
          - type: paragraph
            body: >-
              正确建议是继续研究，置信度中等，风险评级高。Zama 已明显跨过值得严肃关注的门槛：它交付了主网组件，组织了有声誉的运营商，展示了实际运行
              用例，并以独角兽估值融资。但投资者不应把强技术可信度误认为已被证明的估值支撑。如果价格高于最近披露的 >$1B 轮次，公开记录太薄，不足以下买入判断。在约 $550M 到 $840M
              之间，证据更有吸引力，因为入场价更好地反映了收入未披露和商业化问题仍未关闭。


              最终尽调清单因此要窄而实用。决策者需要经审计或管理层认证的收入和费用销毁
              数据、毛利率或服务成本证据、生产客户集中度，以及对股权结构表和代币包袱机制的清晰视图。法律侧需要确认，MiCA、travel-rule、制裁和隐私义务，已经转成运营工作流，而不是只停留在使用条款措辞。如果这些披露结果正面，估值就能从区间框架扩展为更常规的增长型基础设施承销模型。如果不能，价格纪律应压过热情。
