      - number: '2.3'
        title: 买方图谱、用户图谱与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方图谱比一次简单企业软件销售复杂得多。 在发行方主导的工作流里，付费预算所有者可能是需要合规结算和保密投资人处理的资产管理人、基金发起方或代币化平台。
              在运营商或钱包工作流里，经济买方也可能是托管或钱包基础设施提供商，它们必须为企业客户支持保密余额、KMS 操作或阈值解密服务。 开发者构成第三类：他们通常先是用户，之后才成为直接买方；只要保密能力能叠进
              Solidity 和既有链，而不必从零学习新体系，他们就会采用工具。 这也是 OpenZeppelin 和 Dfns 关系重要的原因。两者在开发者体验和运营信任两个关键点降低采用摩擦。
              因此，可能的采用路径不是一夜横向铺开，而是一条一条生态推进：先是工具包和试点，再是运营商参与，再到发行方和交易工作流，最后才是更广泛的默认采用。 这条路径与保留证据一致，但也意味着商业化会不均匀。与
              Kinexys 的概念验证或与 T-REX 的合作公告能提高可信度，却不能自动证明所有买方细分都能重复转化预算。
