      - CR030
      - CR031
      - CR032
      - CR033
      - CR034
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 当前建议靠真实产品验证和品类顺风支撑，但财务披露薄、监管折价仍在抵消。
    data:
      nodes:
        - id: n1
          label: 上线协议验证
          description: 主网质押、DKG 完成、薪资场景和上线后集成
        - id: n2
          label: 品类顺风强
          description: 代币化资产和保密需求仍在扩张
        - id: n3
          label: 财务不透明
          description: 未公开披露收入、ARR、利润率或留存
        - id: n4
          label: 监管折价
          description: 隐私相关资产仍面临合规和交易所阻力
        - id: n5
          label: 继续研究
          description: 在信心提升前，先跟踪定价纪律并补齐尽调缺口
      edges:
        - from: n1
          to: n5
        - from: n2
          to: n5
        - from: n3
          to: n5
        - from: n4
          to: n5
    claimRefs:
