  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Zama 的市场只有窄定义才说得通。 公司不是泛泛参与“隐私”，甚至也不是覆盖整个机密计算市场。它销售的是可编程保密能力，服务于仍必须存在于公链上的资产和逻辑。
              这个边界很重要，因为它排除了大量相邻支出：如果组织更在意控制权、结算终局性或法律可执行性，而不是共享公链可组合性，仍可选择私链、重零知识设计、可信执行环境或许可网络架构。
              保留来源从不同角度反复描述同一个问题：公开账本会暴露敏感余额、投资人头寸、交易逻辑和身份关联数据；开放性有利于验证，却挡住许多机构或受监管工作负载。
              因此，现状替代方案不是“什么都不做”，而是继续留在私有基础设施上，或采用范围更窄的隐私工具。 Zama
              的相关性主张是：买方既能保留公链可组合性，又能隐藏数据。若这一主张成立，市场切入点就有意义；若不能，公司可能被夹在许可制既有厂商与复杂度更低、足以满足买方的替代隐私架构之间。
