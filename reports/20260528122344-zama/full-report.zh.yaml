      - number: '1.3'
        title: 资本基础与合作节奏
        blocks:
          - type: paragraph
            body: >-
              Zama 的融资曲线陡到本身就值得关注。 官方与独立来源口径一致：2024 年 3 月，Multicoin Capital 和 Protocol Labs 领投 $73 million Series A
              轮；2025 年 6 月，Pantera Capital 和 Blockchange Ventures 领投 $57 million Series B 轮，估值超过 $1 billion。
              独立报道把这次跃升视为首个 FHE 独角兽里程碑，管理层则把后一轮描述为战略性辛迪加搭建，而不只是财务融资。 这些说法有可信度，因为投资人名单与公司的市场进入目标相匹配：Zama
              想让公链保密能力成为新的机构级原语，因此招来的投资人与合作方本就扎在区块链金融里。 Series B 之后的合作节奏支撑了这一逻辑。公开公告显示，T-REX、GSR、OpenZeppelin、JPMorgan 的
              Kinexys 概念验证和 Dfns 以不同角色进入 Zama 生态——分销、开发者工具、市场结构和运营商基础设施。 重要的是，它们并不等价。有些是概念验证，有些是分销或工具关系，有些是合作伙伴对网络设计的验证。
              但合在一起看，Zama 用资本不只是延长现金跑道，也在围绕保密公链工作流搭建一条可信的机构叙事。
