        - 官方文档宣传费用低 99%+、终局性 6 秒
        - 依赖 TEE 假设，而非纯密码学保密性
      - - Aztec
        - zk 优先替代方案
        - zk rollup，设备侧证明，加密 UTXO
        - 带新 VM 的隐私优先 L2
        - 相比迁移简单性，更看重反 TEE 隐私保证的开发者
        - 官方文档和网站宣传隐私优先的 Ethereum rollup 定位
        - 不兼容 EVM，因此迁移成本明显更高
      - - Aleo
        - 专用私有应用平台
        - 私有应用栈，带自有程序和节点 / 质押流程
        - 专用私有应用网络
        - 愿意为隐私采用新编程和节点环境的团队
        - 文档覆盖程序、钱包、质押和漏洞赏金
        - 新技术栈和不同开发者路径提高切换成本
      - - AWS / Azure / Google 保密计算
        - 维持现状的内部自建替代方案
        - 云 enclave / TEE 基础设施
        - 通用保密计算服务
        - 在现有云资产内解决同一保密问题的企业
        - 成熟采购和运营方熟悉度
        - 不是 Zama 所追求的区块链原生和可组合形态
    notes: 行内概括保留下来的高信号替代方案，而不是市场上每个隐私项目。规模和成熟度证据仅限已抓取来源中 公开可见的信息。
