evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board list, committee structure, and governance-rights summary for major investors.
    whyItMatters: >-
      Later diligence on control, key-person risk, and governance quality cannot be completed from the retained public
      record.
    diligencePath: >-
      Request cap-table and governance materials directly from the company or a database source with board-rights
      coverage.
    relatedQuestionRefs:
      - QO003
      - QO024
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial-metrics
    missingEvidence: Audited revenue, ARR, and precise customer counts or contract-value schedules.
    whyItMatters: >-
      The public record supports ambition and partner validation, but not hard commercial conversion or operating
      efficiency.
    diligencePath: Request management reporting or investor materials that reconcile licensees, protocol users, and booked revenue.
    relatedQuestionRefs:
      - QO010
      - QO025
  - type: enumeration-incomplete
    severity: minor
    topic: enumeration coverage
    missingEvidence: A more complete public chronology of product and governance milestones plus a fuller leadership roster.
    whyItMatters: The chapter can ship, but the leadership and milestone tables are intentionally partial rather than exhaustive.
    diligencePath: Refresh from newsroom archives, company decks, and database profiles before a final investment memo.
    relatedQuestionRefs:
      - QO003
      - QO024
    relatedTableRefs:
      - TO002
      - TO003
      - TO004
  - type: missing-source
    severity: material
    topic: som-sizing
    missingEvidence: >-
      A bottom-up breakdown of how much current confidential-public-chain spend is actually available to a third-party
      confidentiality layer like Zama.
    whyItMatters: The chapter can bound TAM and SAM, but not isolate a clean production SOM from public evidence alone.
    diligencePath: Request pipeline, pilot-to-production conversion, and pricing data by buyer segment from management or investors.
    relatedQuestionRefs:
      - QM019
  - type: missing-source
    severity: material
    topic: institutional-conversion
    missingEvidence: >-
      Evidence that named institutional pilots, operator relationships, or proofs of concept have converted into
      recurring production spend.
    whyItMatters: Partnership logos validate relevance but do not prove durable demand or budget conversion.
    diligencePath: Ask for production-volume references, contracted operator economics, or reference customers.
    relatedQuestionRefs:
      - QM021
  - type: private-evidence-only
    severity: minor
    topic: adjacent-confidential-computing
    missingEvidence: A reliable public source mapping confidential-computing budgets directly into blockchain confidentiality spend.
    whyItMatters: Broader confidential-computing forecasts may overstate the blockchain-relevant opportunity.
    diligencePath: >-
      Treat confidential-computing market reports as adjacency only unless management or third-party market research
      segments blockchain specifically.
    relatedQuestionRefs:
      - QM022
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Public realized pricing, enterprise contract sizes, and gross-margin disclosures for Zama and most retained
      protocol competitors.
    whyItMatters: >-
      Without realized pricing, the buyer can compare architecture more easily than economics, which weakens
      underwriting of competitive durability.
    diligencePath: >-
      Request pilot proposals, enterprise contracts, and pricing schedules from Zama and at least one direct peer plus
      one cloud-enclave substitute.
    relatedTableRefs:
      - TP003
  - type: enumeration-incomplete
    severity: minor
    topic: production-deployments
    missingEvidence: >-
      A comprehensive list of live production deployments or named customers for private confidentiality layers in this
      market.
    whyItMatters: >-
      The public market still mixes testnet, sandbox, and production signals, so maturity comparisons remain partly
      directional.
    diligencePath: >-
      Ask each retained competitor for named production references, contract status, and referenceable customer counts
      by use case.
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: current-financial-statements
    missingEvidence: >-
      Current recognized revenue, ARR, gross margin, cash, burn, and runway for the operating company and the token
      issuer.
    whyItMatters: Without these metrics, the chapter can judge fundraising strength but not current solvency or unit economics.
    diligencePath: Request management reporting pack with latest P&L, balance sheet, cash flow, and revenue by stream.
    relatedQuestionRefs:
      - QI017
      - QI019
      - QI020
      - QI024
    relatedTableRefs:
      - TI005
  - type: conflicting-data
    severity: minor
    topic: capital-social-reconciliation
    missingEvidence: >-
      A reconciled explanation for why INPI shows €2,395.50 of capital social while Pappers and Societe.com show
      €2,372.33.
    whyItMatters: The discrepancy is small in absolute terms but signals that registry extracts are not perfectly synchronized.
    diligencePath: Pull the underlying filing or latest certified extract from the Paris registry and compare effective dates.
    relatedQuestionRefs:
      - QI018
  - type: private-evidence-only
    severity: material
    topic: intercompany-treasury
    missingEvidence: >-
      Treasury flow between ZAMA SAS and Zama Switzerland AG, including the destination and availability of token-sale
      proceeds.
    whyItMatters: >-
      The entity split affects which pool of capital actually supports operating burn and therefore whether runway can
      be underwritten.
    diligencePath: Request legal-entity chart, intercompany agreements, and treasury policy for token-sale proceeds.
    relatedQuestionRefs:
      - QI025
    relatedTableRefs:
      - TI004
  - type: missing-source
    severity: material
    topic: audits
    missingEvidence: Public audit reports or detailed findings for the protocol, KMS, and coprocessor stack.
    whyItMatters: >-
      The company cites a large audit effort, but buyers still need report-level detail to evaluate residual risk and
      issue severity.
    diligencePath: >-
      Request the latest audit reports, remediation trackers, and post-audit retest results before underwriting
      institutional workloads.
    relatedQuestionRefs:
      - QE023
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: throughput
    missingEvidence: Independent benchmarking of mainnet throughput, latency, and failure handling under production workloads.
    whyItMatters: The strongest performance claims remain company-published, which limits confidence in the 2026 throughput roadmap.
    diligencePath: Ask for customer or auditor benchmark packs covering real workloads on current mainnet infrastructure.
    relatedQuestionRefs:
      - QE024
    relatedTableRefs:
      - TE005
  - type: missing-source
    severity: material
    topic: service-levels
    missingEvidence: Formal public SLAs or historical uptime exports for the mainnet stack.
