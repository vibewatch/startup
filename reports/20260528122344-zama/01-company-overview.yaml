- id: capital-base-and-partnership-cadence
  title: Capital Base and Partnership Cadence
  body: 'Zama’s financing arc is steep enough to matter on its own. Official and independent sources align on a March 2024 Series A of $73 million led by Multicoin Capital and Protocol Labs, followed by a June 2025 Series B of $57 million led by Pantera Capital and Blockchange Ventures at a valuation above $1 billion. Independent coverage treats that jump as the first FHE-unicorn milestone, while management frames the later round as a strategic syndicate build rather than a purely financial one. Those claims are credible because the investor roster matches the company’s go-to-market target: the business wants public-blockchain confidentiality to become a new institutional primitive, so it recruited investors and partners already embedded in blockchain finance. The partnership cadence after the Series B supports that thesis. Public announcements show T-REX, GSR, OpenZeppelin, JPMorgan’s Kinexys proof-of-concept, and Dfns entering the orbit in different roles—distribution, developer tooling,
    market structure, and operator infrastructure. Importantly, these are not all equivalent. Some are proofs of concept, some are distribution or tooling relationships, and some are partner-authored validations of network design. But taken together they demonstrate that Zama has used capital not just to extend runway, but to build a credible institutional narrative around confidential public-blockchain workflows.'
