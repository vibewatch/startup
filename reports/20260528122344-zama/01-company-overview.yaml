- id: leadership-and-governance
  title: Founders, Leadership, and Governance
  body: 'Founder quality is one of Zama’s strongest publicly visible assets. Rand Hindi remains the company’s dominant external spokesperson across legal disclosures, fundraising announcements, and product messaging, while Pascal Paillier anchors the scientific legitimacy of the stack. Partner and press sources reinforce the narrative that Zama’s credibility depends heavily on this founder pair: Hindi translates the company’s privacy thesis into a market story, and Paillier supplies the cryptographic authority behind the claim that FHE has crossed from theory into usable infrastructure. The public team snapshot also signals unusually research-heavy composition, with 37 PhDs out of 96 staff, plus a visible operations layer through Jeremy Bradley and product-engineering depth through Benoît Chevallier-Mames. That said, disclosure is still thin where institutional investors typically want more structure. Public evidence is sufficient to identify founders and a few operators, but not enough
    to map a complete board, voting structure, or current cap-table control. The result is a company that looks founder-led and talent-dense, but not yet broadly transparent on governance. That makes key-person dependency and information asymmetry real diligence considerations even before one reaches token or protocol economics.'
