  topStrengths:
    - >-
      Technically differentiated FHE stack spanning TFHE-rs, Concrete ML, FHEVM, and the Zama protocol, with visible
      open-source developer traction.
    - >-
      Institutional ecosystem proof from T-REX, Dfns, GSR, OpenZeppelin, and J.P. Morgan Kinexys suggests real demand
      for compliant confidentiality on public blockchains.
    - >-
      Strong capital base and specialist investors give Zama runway to keep pushing category leadership in confidential
      infrastructure.
    - >-
      Research-heavy team composition (96 people, 37 PhDs) supports technical credibility in a difficult cryptography
      domain.
  topRisks:
    - >-
      Revenue, margin, retention, and customer-concentration disclosures remain absent, so commercialization quality
      cannot be underwritten from public evidence.
    - >-
      MiCA, travel-rule, sanctions, and privacy obligations create real execution risk for any protocol selling
      confidential finance to regulated institutions.
    - >-
      Much of the visible traction is still partner-, pilot-, or announcement- led, so conversion into durable
      production usage is unproven.
    - >-
      Valuation markers range from roughly $550M token-sale pricing to more than $1B equity pricing, implying overhang
      if economics lag the narrative.
    - >-
      Operator concentration, KMS coordination, and performance scaling remain material technical and reliability risks
      as volume grows.
  unresolvedGaps:
    - Verified revenue, fee-burn, enterprise contract value, and customer concentration data.
    - Gross-margin, subsidy, and cost-to-serve evidence for confidential transactions and protocol operations.
    - >-
      Management or counsel materials showing how MiCA, travel-rule, sanctions, and privacy obligations map into
      operating workflows.
    - Cap-table, treasury, unlock, and equity/token interaction details needed to underwrite dilution and overhang.
