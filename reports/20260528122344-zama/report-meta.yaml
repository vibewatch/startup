companyProfile:
  summary: >-
    Zama is a Paris-based open-source cryptography company registered in late
    2019 and publicly described as founded in 2020 by Rand Hindi and Pascal
    Paillier. The company commercializes fully homomorphic encryption through a
    confidentiality layer for public blockchains and a broader developer stack
    that includes FHEVM, TFHE-rs, Concrete, and Concrete ML. By the 2026-05-28
    run date, public evidence showed a 96-person team with 37 PhDs, blue-chip
    crypto and infrastructure backers, and a live post-launch protocol stack,
    but still limited disclosure on revenue quality and customer durability.
