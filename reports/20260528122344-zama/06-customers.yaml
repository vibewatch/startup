company:
  name: Zama
chapter:
  number: 6
  title: Customers
  summary: 'Zama has credible named customer proof in institutional finance infrastructure: Kinexys by J.P. Morgan, T-REX Ledger, GSR, Dfns, Bron, and Blockscout all provide real workflow evidence. The gap is durability rather than existence—public materials show strong channel and production-style signals, but almost no renewal, concentration, or revenue-retention disclosure.'
sections:
- id: segment-map-and-buyer-types
  title: Zama’s visible customer base clusters around financial infrastructure, not broad enterprise seat deployments
  body: 'The public customer picture is real but concentrated. Zama’s strongest proof comes from infrastructure-heavy segments where confidentiality is a prerequisite: institutional tokenization rails, OTC trading desks, enterprise wallet infrastructure, explorers, and developer-built finance apps. Named examples span Kinexys by J.P. Morgan for sandboxed financial privacy workflows, T-REX Ledger for ERC-3643-based tokenization, GSR for confidential OTC settlement, Dfns for enterprise wallet distribution, Bron for confidential payroll, and Blockscout for explorer support around confidential tokens. That is a meaningful mix of buyers, users, and channels, but it does not look like a classic SaaS customer base with many disclosed seat-count contracts. Instead, Zama is selling or enabling infrastructure nodes inside broader regulated-finance workflows. The underwriting implication is that customer value can be high per integration, yet concentration and partner dependence matter more than raw
    logo count because the public proof base is still anchored on a small number of flagship relationships.'
