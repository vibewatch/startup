  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-gaps
    missingEvidence: NRR, GRR, churn, renewal timing, and contract duration for major integrations.
    whyItMatters: Without commercial durability metrics, named proofs can demonstrate technical fit without proving lasting customer value.
    diligencePath: Request cohort retention, renewal schedules, and expansion timelines for Dfns, GSR, T-REX, and other flagship integrations.
    relatedQuestionRefs:
    - QU016
    - QU022
    - QU025
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration-risk
    missingEvidence: Top-customer or top-channel revenue mix and dependency concentration.
    whyItMatters: The visible proof base clusters around a small number of flagship names, which may imply concentrated commercial exposure.
    diligencePath: Request ARR or usage concentration by channel, logo, and vertical before assigning a low concentration-risk rating.
    relatedQuestionRefs:
    - QU018
    - QU019
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: A complete, fresh list of audited production customers and their deployment status.
    whyItMatters: The public proof table is representative but not exhaustive, and some ecosystem entries are explicitly unaudited.
    diligencePath: Ask management for a referenceable production-customer list separated into pilots, current production, and channel partners.
    relatedQuestionRefs:
    - QU012
    - QU023
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: minor
    topic: monetization
    missingEvidence: Clear disclosure of who pays Zama in partner-led motions such as standards integrations, wallets, and explorer support.
    whyItMatters: Strategic ecosystem reach can overstate direct revenue contribution if payment responsibility sits elsewhere in the stack.
    diligencePath: Map every flagship proof to payer, contract owner, and expected gross-margin profile.
