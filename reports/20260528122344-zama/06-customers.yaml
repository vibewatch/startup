- id: adoption-trajectory-and-builder-funnel
  title: 'Adoption data is ecosystem-heavy: network activity and builder throughput are visible, contract economics are not'
  body: 'Zama has more public adoption signal than most infrastructure protocols at a similar stage, but it is the wrong kind of signal for straightforward customer-quality underwriting. The protocol and third-party coverage point to more than 1.2 million encrypted transactions, over 120,000 addresses or wallets, and a wide ecosystem of builders, wrappers, and applications preparing for or already using mainnet. The Shielded report adds 51 Zama-built projects out of 880 hackathon entries, while the developer program shows recurring incentives for confidential-finance and tooling teams. This supports a real top-of-funnel and real developer interest. It does not, however, disclose how many of those teams convert into paying production customers, how much usage sits on mainnet versus testnet, or whether integrations are expanding over time. In practice, the adoption curve looks stronger in ecosystem breadth and infrastructure embedding than in disclosed revenue-backed account expansion. That
    still matters positively: for a protocol aiming to become the confidentiality layer for public chains, deep ecosystem distribution may be a better early signal than raw seat count.'
  claimRefs:
  - CU019
  - CU020
  - CU021
  - CU022
  - CU024
  - CU025
  - CU026
  - CU027
  - CU035
  tableRefs: []
  figureRefs:
  - FU002
- id: durability-and-retention-gaps
  title: Durability evidence is mostly indirect because public retention metrics are missing
  body: 'The biggest weakness in the customers chapter is not whether Zama has named proof; it is whether those relationships are sticky, expanding, and revenue material. None of the fetched public sources disclosed NRR, GRR, churn, renewal rate, contract length, or top-customer revenue share. The best public durability proxies are channel strength and operational evidence: Dfns advertises 99.95 percent uptime and recognizable reference customers, GSR describes confidentiality as a major institutional pain point, and the protocol stack has live apps plus more than half of circulating ZAMA staked. Those are useful signs, but they do not substitute for commercial retention metrics. The same issue appears across flagship logos: Kinexys is still a proof of concept, T-REX is a structural integration with downstream promise, and many community apps are explicitly labeled unaudited. The correct reading is that customer quality is promising but not yet underwritten. Future diligence should focus
    on renewal paths, account expansion after first integration, and whether partner-led distribution converts into recurring usage rather than one-time launch events.'
  claimRefs:
  - CU014
  - CU019
  - CU023
  - CU041
  tableRefs:
  - TU004
  figureRefs: []
- id: expansion-and-concentration-risk
  title: Expansion upside is real, but concentration risk is equally real because proof clusters around a few flagship channels
  body: 'Zama’s expansion logic is intuitive. Once a customer or channel integrates confidential tokens and delegated decryption, the same confidentiality layer can extend into settlement, custody, payroll, tokenized assets, treasury operations, and regulated DeFi. Dfns is especially important because one integration opens a path to hundreds of enterprise clients. T-REX provides a similar multiplier through ERC-3643 asset flows, while GSR and Kinexys show how Zama can sit inside specific institutional transaction workflows. The risk is that these very same strengths create concentration. The public evidence clusters around a small group of flagship relationships, a handful of standards bodies, and a partner-heavy go-to-market motion. Competitive uncertainty also remains visible: independent coverage still frames FHE as one contender alongside ZK and permissioned alternatives, and even supportive pieces acknowledge latency trade-offs or legal-enforceability debates. Net: Zama has a plausible
    land-and-expand motion, but investors should not confuse ecosystem excitement with diversified customer concentration until direct revenue, renewal, and expansion data are available.'
