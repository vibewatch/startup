  - - Explorer and tooling layer
    - Explorers, compliance tooling, developer infra
    - Visibility for confidential tokens without exposing balances
    - Named proof from Blockscout and ecosystem partners
    - Improves discoverability and workflow compatibility
    - Tooling distribution does not guarantee paid usage
  - - Developer-built application layer
