- id: named-customer-proof
  title: Named customer proof is strongest in institutional pilots and infrastructure integrations
  body: The named proof base is unusually concrete for a privacy-infrastructure startup, but it spans multiple maturity levels. Kinexys is still described as a proof of concept in a sandbox, which makes it valuable as validation from a top-tier institution but not the same thing as a production contract. T-REX looks more like a platform-level integration with a large downstream asset pipeline tied to ERC-3643 and Apex Group’s tokenization ambitions. GSR is the cleanest production-style proof because both Zama and GSR describe a completed confidential OTC trade on Ethereum between KYCd counterparties. Dfns matters because it can propagate Zama functionality to 400-plus enterprise clients, while Bron matters because confidential payroll executed on Ethereum mainnet is more specific than generic partnership PR. Blockscout is also useful because it shows encrypted assets appearing in user-facing infrastructure rather than remaining buried in protocol demos. The main limitation is that many of
    these proofs sit at the pilot, infrastructure, or channel layer, so they signal technical credibility faster than they signal recurring commercial durability.
  claimRefs:
