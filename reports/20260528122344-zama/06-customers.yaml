  - - Institutional trading desks
    - Market makers, OTC desks, treasury operators
    - Confidential OTC settlement and transfer sizing
    - Named proof from GSR
    - Shows institution-grade trading use case
    - Single flagship proof today; repeat volumes undisclosed
  - - Bank and financial-infrastructure innovators
    - Digital-asset strategy teams and compliance groups
    - Private fund subscriptions, auctions, DvP, encrypted KYC AML
    - Named proof from Kinexys sandbox
    - Top-tier credibility signal
    - Still disclosed as proof of concept, not broad rollout
  - - Wallet and custody infrastructure
