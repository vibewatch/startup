- id: pricing-distribution
  title: Pricing visibility, distribution power, and institutional reach
  body: Public pricing is mostly weak across this market, which itself is a competitive fact. Zama says
    deployment is free, but it does not publish a clear enterprise price card for confidential applications;
    many peer protocols are similarly opaque. The few concrete numbers in the public set come from substitutes
    or infrastructure vendors. Oasis Sapphire publishes strong relative performance and fee claims, while
    AWS, Azure, and Google sell confidentiality as part of existing infrastructure catalogs rather than
    as a standalone privacy product. That bundled distribution power is hard for Zama to match. At the
    same time, Zama is not entering the market with zero field evidence. The Dfns integration exposes
    the confidential token standard to 400-plus enterprise clients, and the Kinexys proof of concept shows
    at least one large financial-infrastructure sandbox has tested the stack. Those are meaningful route-to-market
    signals, but they are still earlier and narrower than the channel advantages enjoyed by hyperscaler
    infrastructure or mature mainnet alternatives with longer live-market histories.
  claimRefs:
  - CP003
  - CP006
  - CP009
  - CP010
  - CP016
  - CP021
