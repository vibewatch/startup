tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Trust model
  - Execution surface
  - Target buyer / use case
  - Scale or maturity proof
  - Key limitation versus Zama
  rows:
  - - Zama
    - Reference company
    - FHE with offchain coprocessors and threshold KMS
    - Confidential layer on existing L1/L2 chains
    - Institutions and developers wanting cryptographic confidentiality on existing chains
    - Kinexys proof of concept; Dfns distribution; 96-person team
    - Still earlier in live-market scale than mature cloud or mainnet substitutes
  - - Fhenix
    - Direct FHE peer
    - Pure FHE, marketed as no TEE / no ZK workaround
    - Ethereum privacy layer with standard Solidity hooks
    - Ethereum teams wanting privacy without a new VM or rollup
    - Official site and docs emphasize FHE-native smart contracts
    - Less public maturity and institutional proof than Zama claims through Dfns and Kinexys
  - - Inco
    - Direct privacy-layer peer
    - TEE-based private compute
    - Privacy layer with wallet and EVM/SVM tooling compatibility
    - Developers prioritizing compatibility and broad wallet/tool support
    - Main site lists MetaMask, Coinbase Wallet, Phantom, Hardhat, Foundry, and Anchor support
    - Hardware-trust assumption is weaker than Zama’s pure-FHE pitch
  - - Secret Network
    - Established substitute
    - Intel SGX plus key management
    - Standalone privacy-first network
    - Builders wanting live private smart contracts with longer mainnet history
    - Docs say private smart contracts live since September 2020
    - Requires commitment to a separate network and TEE trust model
  - - Oasis Sapphire
    - Established substitute
    - TEE-based confidential EVM
    - Confidential EVM ParaTime
    - EVM teams prioritizing low fees and fast finality
    - Official docs market 99%+ lower fees and 6-second finality
    - Relies on TEE assumptions rather than pure cryptographic confidentiality
  - - Aztec
    - zk-first substitute
    - zk rollup with device-side proving and encrypted UTXOs
    - Privacy-first L2 with new VM
    - Builders prioritizing anti-TEE privacy guarantees over migration simplicity
    - Official docs and site market privacy-first Ethereum rollup posture
    - Not EVM compatible, so migration cost is materially higher
  - - Aleo
    - Dedicated private-app platform
    - Private-app stack with own programs and node/staking flow
    - Dedicated private application network
    - Teams willing to adopt a new programming and node environment for privacy
    - Docs cover programs, wallets, staking, and bug bounty
    - New stack and different developer motion increase switching cost
  - - AWS / Azure / Google confidential computing
    - Status-quo internal-build substitute
    - Cloud enclave / TEE infrastructure
    - General-purpose confidential compute services
    - Enterprises solving the same confidentiality problem inside existing cloud estates
    - Mature procurement and operator familiarity
    - Not blockchain-native or composable in the way Zama wants to be
  notes: Rows summarize the highest-signal retained alternatives rather than every privacy project in
    market. Scale and maturity evidence is limited to what was publicly visible in fetched sources.
