- id: durability
  title: Moat durability and adverse competitive thesis
  body: 'The durable question is whether Zama’s pure-FHE confidentiality becomes the buyer’s must-have
    requirement, or merely one architecture among several acceptable ones. The positive case is clear.
    Zama combines a research-heavy team, a cross-chain posture, and a privacy model that avoids trusted
    hardware while preserving familiar developer surfaces. That makes it unusually well positioned if
    the market decides that institutional-grade confidentiality requires cryptographic rather than enclave-based
    guarantees. The adverse case is equally clear in the public evidence. ChainSafe and BlockEden both
    frame the 2026 market as a live choice among architectures, not as a winner-take-all FHE conversion.
    Aztec explicitly attacks TEE-based systems on trust grounds, while AWS, Azure, and Google can win
    internal-build or regulated buyers through existing procurement and operational familiarity. In practice,
    Zama’s moat is therefore conditional: it strengthens when the buyer wants strong cryptographic privacy
    on existing chains, and weakens when good-enough privacy, easier procurement, or broader ecosystem
    maturity matter more than architectural purity.'
