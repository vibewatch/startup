- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence
  - Why it matters
  - Diligence ask
  rows:
  - - Pure-FHE confidentiality on existing chains
    - Fhenix reaches similar promise on Ethereum
    - Medium
    - Fhenix also markets pure-FHE privacy with standard Solidity hooks
    - Direct peer narrows differentiation to execution quality and ecosystem traction
    - Test developer preference between Zama and Fhenix in a matched pilot
  - - No trusted hardware requirement
    - Aztec argues TEEs are unacceptable and zk systems can own the trust-minimization narrative
    - Medium
    - Aztec explicitly attacks TEEs and backdoors
    - Zama does not automatically own the anti-TEE buyer when zk migration is acceptable
    - Interview buyers on whether zk privacy is worth new-VM migration
  - - Existing-chain deployment
    - Cloud confidential computing can solve the same job offchain inside existing procurement channels
    - High
    - AWS, Azure, and Google all sell confidential compute as general infrastructure
    - Status-quo internal build may be cheaper to approve than blockchain-native privacy
    - Model how often the budget owner is cloud infrastructure rather than protocol innovation
  - - Institutional route to market
    - Broader substitutes have longer production history or stronger procurement access
    - High
    - Secret and Oasis have live-market history; hyperscalers have existing contracts
    - Distribution can matter more than architectural purity in enterprise buying
    - Request conversion data from Dfns and named institutional pilots
  - - Research-heavy team and FHE roadmap
    - Hardware and performance roadmap may take longer than substitute adoption curves
    - High
    - Zama still points to GPU, FPGA, and ASIC milestones to close throughput gap
    - If buyers accept good-enough confidentiality today, future hardware wins may arrive too late
    - Get current cost-per-transaction and timeline confidence for hardware milestones
  - - Cross-architecture market education
    - No single privacy architecture appears dominant in 2026
    - Medium
    - ChainSafe and BlockEden both frame the market as tradeoffs among FHE, ZK, and TEE
    - Market fragmentation supports multi-homing and weakens hard lock-in
    - Test whether customers plan single-stack standardization or layered coexistence
  notes: Severity is analyst-judgmental and reflects underwriting risk, not a vendor-reported KPI. Each
    row is grounded in fetched architecture or market-structure evidence.
