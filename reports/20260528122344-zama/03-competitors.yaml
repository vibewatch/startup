- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Provider
  - Public pricing basis
  - What is publicly visible
  - What remains unknown
  - Competitive implication
  rows:
  - - Zama
    - No public enterprise price card
    - Deployment is described as free; product runs on existing chains
    - Realized pricing for institutional applications and operators
    - Easy entry helps adoption, but opaque enterprise economics weakens buyer-side modeling
  - - Fhenix
    - No public list price retained
    - Privacy-as-a-service positioning and no-new-VM integration pitch
    - Contract value, pricing unit, and gross-margin profile
    - Direct feature overlap without clear public price anchor
  - - Inco
    - No public list price retained
    - Broad compatibility story across wallets and dev frameworks
    - Commercial pricing and production support terms
    - Tooling breadth can win pilots even when economics are undisclosed
  - - Secret / Oasis
    - Relative claims rather than comparable list rates
    - Oasis publishes 99%+ lower-fee and 6-second-finality claims; Secret emphasizes private-by-default
      execution
    - Net enterprise price realization and support economics
    - Mature substitutes can still look easier to adopt despite weak apples-to-apples pricing
  - - Aztec / Aleo
    - No retained public comparable price card
    - Security and privacy posture are more visible than commercial packaging
    - Migration economics and production support pricing
    - Trust-model differentiation may matter more than list price for some buyers
  - - AWS / Azure / Google
    - Infrastructure consumption catalogs
    - Confidential computing is sold inside broader cloud estates
    - Workload-specific cost of equivalent blockchain confidentiality
    - Bundled procurement can beat protocol-native privacy on buyer convenience
  notes: This is a packaging table, not a realized-revenue table. Public materials for most privacy protocols
    remain much weaker on pricing than on architecture or developer experience.
