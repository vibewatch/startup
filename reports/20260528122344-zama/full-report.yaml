      - number: '3.2'
        title: Capability, trust model, and developer migration
        blocks:
          - type: paragraph
            body: >-
              Zama’s technical story is strongest when the buyer values privacy without trusted hardware and without
              moving onto a purpose-built private chain. Its own materials and Figment’s analysis frame the product as a
              layer on top of existing L1s and L2s, using offchain FHE coprocessors plus threshold key management
              instead of a new execution environment. Fhenix is the closest philosophical rival because it also markets
              pure-FHE privacy for Ethereum and claims developers can stay in standard Solidity. Inco, Secret, Oasis,
              and the cloud-enclave vendors all compete from a different angle: they promise compatibility and easier
              integration, but they rely on TEE or enclave assumptions. Aztec competes from the opposite direction by
              rejecting TEEs entirely and using a privacy-first zk rollup, but that approach forces a new VM and higher
              migration cost. Aleo is further from Zama on architecture because it asks developers to enter its own
              programs, nodes, and staking world. The capability question is therefore less about whether privacy exists
              and more about which trust and migration tradeoff a buyer is willing to accept.
