              but they do not substitute for commercial retention metrics. The same issue appears across flagship logos:
              Kinexys is still a proof of concept, T-REX is a structural integration with downstream promise, and many
              community apps are explicitly labeled unaudited. The correct reading is that customer quality is promising
              but not yet underwritten. Future diligence should focus on renewal paths, account expansion after first
              integration, and whether partner-led distribution converts into recurring usage rather than one-time
