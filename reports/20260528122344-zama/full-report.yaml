  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, monetization surfaces, and token economics
        blocks:
          - type: paragraph
            body: >-
              Zama’s public economics are broader than a typical single-product SaaS company, but also much less
              explicit. The clearest pre-protocol commercialization proof comes from TechCrunch’s March 2024 interview,
              where Rand Hindi said Zama had begun commercializing six months earlier, had signed north of $50 million
              in contract value, charged some crypto clients in tokens, and charged banks using private blockchains by
              transaction. Those statements imply a business model centered on enterprise licensing and usage pricing
              rather than self-serve subscriptions. Official sources published after the protocol launch add a second
              monetization layer: the token is designed for encryption, decryption, bridging, and operator
              participation, while the public auction and CoinList materials describe a financing event with a $0.05
              clearing price and a $44 million final paid amount. That matters because the token sale should not be
              confused with operating revenue. The terms explicitly deny equity, debt, or revenue-share rights, so the
              token looks more like network financing plus future utility economics than like a direct substitute for
              recurring software revenue.
