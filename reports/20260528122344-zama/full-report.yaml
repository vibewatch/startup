  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Perimeter
        blocks:
          - type: paragraph
            body: >-
              Zama's risk profile starts with legal architecture rather than pure cryptography. The public website is
              operated by a French SAS, while the token sale, auction, and auction-specific privacy notice are issued by
              Zama Switzerland AG from Zug. That split is not inherently problematic, but it means investors have to
              track two different legal footprints, multiple governing-law provisions, and several separate sets of
              terms. The website terms place disputes under French law and the Paris Court of Appeal, while the
              token-sale stack adds Swiss corporate and sanctions-screening obligations. The token auction and sale
              terms explicitly exclude sanctioned persons, denied parties, and residents of AML-noncooperative
              jurisdictions, while the sale privacy notice says Zama collects wallet addresses plus KYC data sourced
              from Sumsub. This is directionally consistent with the company's claim that privacy can coexist with
              compliance, but it also makes the protocol investability highly dependent on execution of AML, sanctions,
              onboarding, and disclosure controls across jurisdictions.


              External regulation is tightening around exactly the areas Zama wants to commercialize. ESMA describes
              MiCA as a uniform regime for transparency, disclosure, authorization, and supervision of crypto-asset
              activity, while the EU travel rule extends originator-and-beneficiary traceability to crypto-asset
              transfers. FATF and FinCEN make the same point from a different angle: private or encrypted value transfer
              does not remove traceability expectations. Zama's selective-disclosure design is a mitigation because it
              tries to preserve regulator or auditor access; however, the public materials do not yet show a
              regulator-tested compliance implementation or a disclosed licensing status. That leaves residual exposure
              high for any thesis that assumes rapid scaling with regulated finance customers.
            claimRefs:
