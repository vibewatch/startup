      - number: '7.3'
        title: Partner and Commercial Dependency
        blocks:
          - type: paragraph
            body: >-
              Zama's commercial narrative depends heavily on externally validated institutional use cases. That is a
              strength because the company is not selling privacy in the abstract; it is tying confidentiality to
              payroll, wallets, OTC trading, tokenized RWAs, and JPM-organized privacy research. But it is also a
              concentration risk because much of the proof is still pilot-, PoC-, or partner-led. J.P. Morgan's Project
              EPIC explicitly frames privacy, identity, and composability as prerequisites for tokenized finance, yet
              the cited work is a paper plus proof-of-concept rather than a scaled production program. The GSR
              announcement is also framed as a proof-of-concept. T-REX and Dfns are more commercially interesting
              because they sit closer to institutional distribution: T-REX cites $32 billion already onchain under
              ERC-3643 and an Apex commitment targeting $100 billion by June 2027, while Dfns says Zama-powered
              confidential infrastructure is available to 400+ enterprise clients.


              Those partner narratives still leave an execution gap. Investors do not yet have public evidence on
              conversion rates from PoCs to recurring contracts, partner revenue contribution, customer concentration,
              or standardized SLAs. The operator roster is impressive—Fireblocks, Ledger, Figment, DFNS, OpenZeppelin,
              Etherscan, and others—but the same roster also concentrates reputational and operational dependency in a
              relatively small club of infrastructure specialists. If even a few of these reference partners
              deprioritize Zama, the commercial credibility of the protocol could fall faster than the cryptography
              itself.
