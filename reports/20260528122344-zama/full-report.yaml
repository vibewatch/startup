      - number: '1.4'
        title: Scale Signals and Critical Flags
        blocks:
          - type: paragraph
            body: >-
              The strongest positive signal in Zama’s current profile is that several independent domains point to the
              same pattern: heavy open-source engagement, blue-chip crypto and infrastructure investors, and partners
              that exist close to regulated financial workflows. The strongest negative signal is that market confidence
              still runs ahead of proven operating disclosure. Zama says it licenses technology to dozens of companies
              and partner material points toward institutional use cases, but public evidence still does not support
              hard cover metrics for revenue, precise customer count, or board-level governance. At the same time,
              multiple independent sources argue that the underlying FHE market remains early, specialized hardware is
              still important to achieve usable performance, and public-token price action has been volatile enough to
              expose valuation risk. TechCrunch questioned whether homomorphic encryption had yet reached mass-market
              scalability, while MEXC and CoinGabbar framed the public-token setup as aggressively valued and exposed to
              supply overhang. Those are not fatal flags, but they do change the diligence posture. Zama currently looks
              like a well-capitalized, technically differentiated protocol company with genuine ecosystem pull, not like
              a fully de-risked financial-infrastructure platform with mature disclosure discipline.
