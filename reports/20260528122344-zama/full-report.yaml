      - number: '7.4'
        title: Financial Overhangs and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Zama has strong headline financing—$57 million at a valuation above $1 billion in the 2025 Series B—yet
              the most investable question is not whether capital was raised. It is whether regulatory,
              commercialization, and token-distribution risk can be de-risked before the company needs to prove durable
              monetization. The public auction data is encouraging because it shows strong interest and no reported
              downtime, but it also shows refund-heavy demand quality: $118.5 million of commitments translated into
              only $44 million paid by winning bids. That is useful price discovery, not proof of stable long-term
              demand. The company also says it had licensed technology to dozens of companies before protocol launch,
              but public revenue, retention, uptime, and conversion metrics are still missing.


              The practical investment implication is that Zama's risk cannot be scored from cryptography alone.
              Thesis-break events are monitorable: a sanctions, AML, or MiCA compliance failure; a material security or
              decryption incident; operator concentration becoming unstable; or partner pilots failing to convert into
              production usage. Conversely, residual risk would decline materially if Zama disclosed public audits,
              recurring institutional revenue, regulator-facing compliance workflows, and repeat production transaction
              volumes. Until then, the protocol deserves credit for real launch progress, but its residual exposure
              remains high because the evidence base is still much stronger on technical possibility than on scaled
              commercial durability.
            claimRefs:
              - CR026
