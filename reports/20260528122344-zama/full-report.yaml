chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Zama’s legal and commercial identity is unusually clear at the company-shell level and still somewhat
              fluid at the product-narrative level. The legal notice and French registry records show a Paris-based SAS
              with registered office at 8 rue du Sentier, while the current website frames Zama less as a generic FHE
              research lab and more as an operating protocol company centered on the Zama Protocol, the $ZAMA token,
              developer tooling, and enterprise blockchain use cases. That public posture matters because it shows a
              shift from a broad “open-source cryptography company” message toward a protocol-and-network model that
              later chapters can treat as the current operating baseline. The same official materials and repository
              surfaces also show that Zama is not pitching a new chain. Instead, it is selling a confidentiality layer
              built on top of existing public chains through FHE libraries, protocol services, SDKs, and operator
              infrastructure. This distinction is essential for diligence because it shapes buyer adoption, capital
              intensity, and competitive set. Zama’s open-source footprint is also meaningful rather than cosmetic: the
              organization page, TFHE-rs, Concrete ML, and especially FHEVM all show measurable developer following,
              suggesting the company’s product surface is broader than a single token or single partnership
              announcement.
