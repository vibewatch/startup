      - number: '2.2'
        title: 'Sizing Lenses: Payments, Tokenization, and Institutional Finance'
        blocks:
          - type: paragraph
            body: >-
              The right way to size Zama’s market is to stack multiple lenses rather than anchor on one inflated
              headline. The payments lens is already enormous: the litepaper treats stablecoins as a leading blockchain
              use case with trillions in yearly volume, and Forbes cited a16z research showing $4.5 trillion of
              stablecoin payment volume in Q1 2026 alone. The tokenization lens is smaller today but more obviously
              aligned with confidentiality needs. CoinGecko data summarized by Crowdfund Insider shows RWAs at $19.3
              billion by Q1 2026 after tripling from the start of 2025, with Treasuries still dominant but commodities,
              stocks, and ETFs growing quickly. Institutional infrastructure adds another sizing clue: T-REX says
              ERC-3643 already secures $32 billion of assets and Apex-backed infrastructure aims for $100 billion by
              mid-2027. For longer-dated TAM, the spread is huge. McKinsey’s base case remains below $2 trillion by
              2030, while BCG-backed tokenized-fund materials alone suggest $600 billion of AUM and broader forecast
              summaries run far above that. The correct takeaway is not that every trillion-dollar estimate is wrong. It
              is that Zama’s eventual TAM can be large while its credible near-term SAM remains much narrower and tied
              to specific productized workflows.
