  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and substitute boundary
        blocks:
          - type: paragraph
            body: >-
              Zama should not be underwritten against one narrow peer set. The direct peer group is the small FHE-native
              confidentiality layer cohort, especially Fhenix and Inco, because those companies also promise
              confidential smart contracts for existing blockchain users. The substitute set is broader and more
              dangerous. Secret Network and Oasis Sapphire offer already-marketed confidential execution environments
              with different trust assumptions, while Aztec and Aleo attack adjacent privacy workloads through a new zk
              rollup or a dedicated private-application stack. Partisia and Arcium expand the field again through
              MPC-based confidential computing. The status-quo alternative is often not another crypto protocol at all,
              but enterprise enclaves from AWS, Azure, or Google Cloud that let a buyer keep sensitive logic offchain or
              in internal-build workflows. That broader boundary matters because the buyer does not need to believe in
              FHE specifically to solve the same job. A procurement team can still choose TEEs, a zk-first design, or a
              cloud enclave stack if those options look more mature, cheaper, or easier to explain internally.
