  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Zama’s market only makes sense when defined narrowly. The company is not simply a participant in “privacy”
              or even in the whole confidential-computing market. It is selling programmable confidentiality for assets
              and logic that still need to live on public blockchains. That boundary matters because it excludes a large
              amount of adjacent spend: organizations can still choose private chains, zero-knowledge-heavy designs,
              trusted execution environments, or permissioned-network architectures if they care more about control,
              settlement finality, or legal enforceability than about shared public-chain composability. The retained
              sources repeatedly describe the same problem from different angles: public ledgers expose sensitive
              balances, investor positions, trading logic, and identity-linked data; that openness helps verification
              but blocks many institutional or regulated workloads. In that sense, the status quo substitute is not “do
              nothing.” It is to remain on private infrastructure or adopt narrower privacy tools. Zama’s claim to
              relevance is that buyers can preserve public-chain composability and still keep data hidden. If that claim
              proves true, the market wedge is meaningful. If not, the company risks being trapped between permissioned
              incumbents and alternative privacy architectures that satisfy buyers with less complexity.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM026
              - CM029
