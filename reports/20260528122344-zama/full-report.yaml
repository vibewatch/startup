    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Revenue quality
        - Fee burn, protocol revenue, enterprise contract value, and customer concentration
        - Without these, valuation cannot move beyond range-based heuristics
        - Management finance pack plus KPI bridge from token activity to revenue
      - - Unit economics
        - Gross margin, operator subsidy burden, and cost-to-serve per confidential transaction
        - Needed to test whether fee burn can outgrow emissions and infra cost
        - Controller / FP&A diligence session
      - - Legal readiness
        - MiCA / travel-rule / sanctions operating workflow and legal opinions
        - Needed to know whether institutional adoption is constrained by compliance friction
        - Outside-counsel memo and compliance workflow demo
      - - Cap table and token overhang
        - Treasury holdings, unlock schedule, rights, and equity / token interaction
        - Needed to understand dilution and whether token pricing can gap away from equity value
        - Legal / CFO cap-table review
      - - Customer proof
        - Named production deployments beyond payroll plus repeat transaction volumes
        - Needed to distinguish proof-of-concept from durable commercialization
        - Customer-reference calls and product-usage dashboard
    notes: >-
      These asks are intentionally narrow and investment-decisive; they are the missing pieces that would move the
      recommendation faster than additional market-size reports.
