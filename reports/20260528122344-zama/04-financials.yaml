- id: verdict-and-gaps
  title: Financial verdict and diligence blockers
  body: 'The financial verdict is therefore mixed. Zama has credible commercialization evidence, credible
    institutional interest, and unusually strong funding support for a deep-cryptography company. Those
    are real positives. But the retained sources still leave the core underwriting questions open. Registry
    and filing sources provide entity, capital, and continuity notices, yet they do not provide a set
    of public financial statements strong enough for downside analysis. Public media sources provide signed-contract
    value, developer adoption, and fundraising marks, but they do not provide recognized revenue, ARR,
    gross margin, cash, burn, or runway. The adverse record is not catastrophic, but it is meaningful:
    Societe.com preserves a 2021 continuation notice after net assets fell below half of capital, and
    token-market commentary highlights full unlock risk, valuation-gap optics, and volatile aftermarket
    behavior. The result is a company whose growth and financing narrative are much better evidenced than
    its revenue quality and current solvency bridge. That keeps the chapter’s recommendation at “evidence-rich
    on demand, evidence-thin on accounting.”'
