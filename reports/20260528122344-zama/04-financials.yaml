- id: capital-adequacy
  title: Capital adequacy, legal entities, and financing dependency
  body: On the financing side, the picture is strong in headline terms and weak in liquidity detail. The
    Series A in 2024 and Series B in 2025 created a visible equity base, while the January 2026 public
    auction added $44 million of winning bids and demonstrated strong market appetite with 11,103 unique
    bidders. Official and independent coverage agree that the Series B was meant to fund mainnet launch,
    ecosystem growth, and continued R&D. That is enough to conclude that Zama is not capital-starved in
    the abstract. It is not enough to conclude what runway exists today. The current cash balance, monthly
    burn, and expected runway are still absent from the retained public record. The legal-entity picture
    also matters. Token sale terms point to Zama Switzerland AG as issuer of the token, while French registry
    records point to ZAMA SAS as the operating entity. Public sources do not make the intercompany treasury
    flows, licensing arrangements, or availability of token-sale proceeds to the operating company transparent.
    That leaves financial capacity directionally positive but still hard to underwrite.
  claimRefs:
