- id: traction-unit-economics
  title: Traction signals, unit-economics proxies, and cost structure
  body: 'Public traction evidence exists, but it is mostly proxy evidence rather than accounting evidence.
    Zama’s own about page shows 96 people and 37 PhDs, while TechCrunch earlier reported a 75-person team
    and 3,000 developers using the libraries in 2024; by June 2025, Tech.eu and EU-Startups were reporting
    more than 5,000 developers. Dfns, Kinexys, and T-REX each strengthen the institutional-demand story
    in different ways: Dfns offers potential distribution into 400-plus enterprise clients, Kinexys gives
    Zama a large-bank sandbox proof point, and the T-REX announcement ties the stack to ERC-3643 tokenization
    infrastructure. But none of those sources disclose recognized revenue, paid-customer count, average
    contract value, or contribution margin. The cost side is also only partially visible. TFHE-rs documentation
    and official funding coverage emphasize GPU, FPGA, and ASIC acceleration as the path to scale, which
    implies continued compute and research intensity. Headcount growth alone also implies a rising fixed-cost
    base. As a result, public evidence supports the existence of demand and technical investment, but
    not a clean public bridge from product usage to gross profit.'
  claimRefs:
