  evidenceGaps:
  - type: missing-source
    severity: material
    topic: current-financial-statements
    missingEvidence: Current recognized revenue, ARR, gross margin, cash, burn, and runway for the operating
      company and the token issuer.
    whyItMatters: Without these metrics, the chapter can judge fundraising strength but not current solvency
      or unit economics.
    diligencePath: Request management reporting pack with latest P&L, balance sheet, cash flow, and revenue
      by stream.
    relatedQuestionRefs:
    - QI017
    - QI019
    - QI020
    - QI024
    relatedTableRefs:
    - TI005
  - type: conflicting-data
    severity: minor
    topic: capital-social-reconciliation
    missingEvidence: A reconciled explanation for why INPI shows €2,395.50 of capital social while Pappers
      and Societe.com show €2,372.33.
    whyItMatters: The discrepancy is small in absolute terms but signals that registry extracts are not
      perfectly synchronized.
    diligencePath: Pull the underlying filing or latest certified extract from the Paris registry and
      compare effective dates.
    relatedQuestionRefs:
    - QI018
  - type: private-evidence-only
    severity: material
    topic: intercompany-treasury
    missingEvidence: Treasury flow between ZAMA SAS and Zama Switzerland AG, including the destination
      and availability of token-sale proceeds.
    whyItMatters: The entity split affects which pool of capital actually supports operating burn and
      therefore whether runway can be underwritten.
    diligencePath: Request legal-entity chart, intercompany agreements, and treasury policy for token-sale
      proceeds.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI004
