- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on verdict
  - Current public state
  - Exact diligence path
  rows:
  - - Recognized revenue / ARR
    - Prevents verification of scale and quality of monetization
    - No retained public source disclosed current recognized revenue or ARR
    - Request revenue by stream and last-twelve-month recognized revenue
  - - Gross margin
    - Blocks underwriting of cryptography and infrastructure economics
    - No retained public source disclosed gross margin
    - Request cost-of-revenue bridge and infrastructure cost allocation
  - - Cash balance
    - Blocks solvency and runway analysis
    - Not publicly disclosed
    - Request latest management balance sheet or treasury memo
  - - Monthly burn and runway
    - Blocks next-round timing analysis
    - Not publicly disclosed
    - Request monthly burn, downside case, and minimum cash target
  - - Realized enterprise pricing
    - Prevents comparison of list mechanics with actual monetization
    - 'Only quoted patterns exist: tokens for some clients, per transaction for banks'
    - Request contracts, discount schedules, and billing examples
  - - Customer count and concentration
    - Prevents assessment of dependency on a few large pilots or partners
    - Not publicly disclosed
    - Request customer segmentation and top-account share
  - - Intercompany cash flows
    - Prevents clear view of whether token-sale proceeds fund operations
    - Swiss issuer and French operating company both appear in retained sources
    - Request treasury structure and transfer agreements
  - - Audited public financial statements
    - Prevents classical underwriting and covenant-style review
    - Registry extracts exist but not a public statement set sufficient for underwriting
    - Request audited financials or investor reporting package
  notes: This table is the core reason the chapter can judge capital availability only directionally.
    Public signals are real, but the accounting set remains thin.
