tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Enterprise technology licensing
    - Commercial use of Zama cryptography for blockchain and AI customers
    - Contract value / license
    - Officially described as licensing to dozens of companies; no public revenue split
    - Potentially durable if contracts renew, but current recognition is undisclosed
    - Request customer count, ACV, term length, and revenue recognition policy
  - - Bank / private-chain pricing
    - Usage-based charging for private-blockchain customers
    - Per transaction
    - Quoted by CEO to TechCrunch; no public tariff
    - Useful evidence that pricing can scale with usage, but unsupported by contracts
    - Request actual schedules, minimums, and gross-margin bridge
  - - Crypto-client pricing
    - Charges some crypto customers in tokens
    - Token-denominated commercial fees
    - Quoted by CEO to TechCrunch; no public realized conversion
    - Shows crypto-native monetization, but fiat-equivalent revenue quality is unclear
    - Request examples of token-denominated contracts and treasury policy
  - - Protocol utility fees
    - Token required for encryption, decryption, bridging, and operator participation
    - Protocol token utility
    - Official terms define utility but do not publish realized fee volume
    - Could become durable network revenue, but not yet visible as a public cash-flow stream
    - Request fee schedule, burn/mint policy, and operator-economics model
  - - Token sale proceeds
    - Public auction and platform sales in Jan 2026
    - Auction clearing price and winning bids
    - $44 million final amount paid by winning bids; financing rather than operating revenue
    - Strengthens capital base but does not prove recurring monetization
    - Separate treasury proceeds from recurring software or protocol revenue
  - - Partner-led distribution
    - Dfns, Kinexys, T-REX ecosystem pathways
    - Pipeline / distribution channel
    - Visible partner traction but no public revenue disclosure
    - Strategically important but not yet monetized in a measurable public way
    - Request pipeline conversion, paid pilots, and revenue-share terms
  notes: The table separates operating monetization surfaces from financing events. Token sale proceeds
    are shown because they affect capital adequacy, not because they should be booked as recurring revenue.
