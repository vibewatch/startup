  figureRefs: []
- id: differentiation-verdict
  title: 'Verdict: Zama has a real product and technology edge, but its strongest public proof still comes from its own operating footprint'
  body: 'The core investment case in product and technology is credible. Zama has a coherent stack, real documentation, live protocol apps, meaningful open-source surfaces, and public evidence that encrypted smart-contract tooling has moved out of the lab. The strongest differentiator is architectural: instead of asking users to migrate to a new privacy chain, Zama tries to add confidentiality to the networks and workflows that already exist. That can be a powerful adoption wedge if the team keeps abstraction high and operational complexity low. The main risks are also clear. Public evidence still leans heavily on company-published performance numbers, roadmap targets, and Zama-operated services; the testnet-to-mainnet reliability gap is visible; and the commercial-license overlay means openness is not frictionless for every downstream builder. Net: product and technology look investable, but the next diligence step should be live customer references on uptime, latency, and production support
    rather than more protocol marketing.'
