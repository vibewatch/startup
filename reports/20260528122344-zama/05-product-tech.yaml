- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Host chain
    - Executes confidential contracts and records state transitions
    - Ethereum and compatible EVM chains
    - Base-chain economics and outages still matter
  - - FHEVM contract layer
    - Defines encrypted types, ACLs, wrappers, and symbolic execution hooks
    - Solidity tooling and Zama libraries
    - API or version churn could affect downstream apps
  - - Gateway / executor
    - Coordinates requests, events, validation, and decryption flow
    - Protocol smart contracts and operator transactions
    - Becomes a control point for latency and incident handling
  - - Coprocessor network
    - Performs heavy encrypted computation offchain
    - Specialized compute and honest operator execution
    - Operational complexity and hardware cost are non-trivial
  - - KMS / TKMS MPC layer
    - Holds distributed key shares and supports threshold decryption
    - Independent MPC partners and secure coordination
    - Threshold assumptions and partner uptime are critical
  - - Relayer / SDK layer
    - Lets apps encrypt inputs, submit calls, and read decrypted outputs
    - Frontend libraries and managed infra
    - Managed relayer reliance may constrain self-hosting flexibility
  - - Registry / wrappers
    - Maps supported confidential assets and canonical contract addresses
    - Protocol governance and token wrapper maintenance
    - Upgrade or registry mistakes could ripple across multiple apps
  notes: The architecture table mixes onchain and offchain components because public-chain confidentiality depends on both working together.
