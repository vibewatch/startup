- id: performance-release-cadence-and-developer-signal
  title: Release cadence and developer signal are strong, but the biggest performance leaps are still largely company-published
  body: The product story is helped by unusually dense public release evidence. Zama has kept publishing detailed updates across TFHE-rs, FHEVM, Concrete, and Concrete ML, and the open-source repos, docs, package registries, and developer-program posts show a real effort to build mindshare. TFHE-rs v1.4 and Concrete ML v1.9 are especially important because they tie Zama’s privacy pitch to measurable changes in GPU throughput, HPU latency, and encrypted ML workflows rather than generic promises. The protocol testnet update also points to 1.2 million encrypted transactions, 19,000 confidential contracts, 120,000 active wallets, and 20-plus partners building. Those metrics are meaningful directional signal, but they are still overwhelmingly company-reported and sit alongside forward-looking roadmap claims such as materially higher throughput and confidential-staking extensions. The evidence supports real execution velocity and real developer uptake, but it does not yet prove durable enterprise-scale
    economics or independently audited throughput under sustained production load.
