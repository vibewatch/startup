- id: architecture-and-operating-model
  title: 'The operating model is layered: confidential contracts on public chains, offchain coprocessors, and MPC-backed key control'
  body: Public evidence is specific enough to outline a real architecture rather than a vague privacy story. FHEVM is the smart-contract framework developers touch, but it is only one layer. The stack also includes host-chain contracts, a gateway, offchain coprocessors that perform encrypted computation, a KMS connector, relayers, and a threshold-MPC key-management design. This matters because Zama is explicitly trying to preserve public-chain composability while moving the expensive parts of FHE off the base chain. The protocol docs and third-party explainers both describe handles, delegated decryption, wrappers, and onchain coordination for key generation and access control. The result is more production-oriented than a pure research prototype, but it also means the product inherits real dependency risk from offchain operators, specialized compute, and orchestration services. Investors should therefore see Zama as a confidentiality operating layer with multiple moving parts, not a single
    library that can be evaluated in isolation.
