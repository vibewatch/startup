  evidenceGaps:
  - type: missing-source
    severity: material
    topic: audits
    missingEvidence: Public audit reports or detailed findings for the protocol, KMS, and coprocessor stack.
    whyItMatters: The company cites a large audit effort, but buyers still need report-level detail to evaluate residual risk and issue severity.
    diligencePath: Request the latest audit reports, remediation trackers, and post-audit retest results before underwriting institutional workloads.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: throughput
    missingEvidence: Independent benchmarking of mainnet throughput, latency, and failure handling under production workloads.
    whyItMatters: The strongest performance claims remain company-published, which limits confidence in the 2026 throughput roadmap.
    diligencePath: Ask for customer or auditor benchmark packs covering real workloads on current mainnet infrastructure.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: material
    topic: service-levels
    missingEvidence: Formal public SLAs or historical uptime exports for the mainnet stack.
    whyItMatters: A status page snapshot is directionally useful but not enough for mission-critical enterprise deployment decisions.
    diligencePath: Request 12-month uptime, incident response, and service-credit commitments for the services customers actually depend on.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: minor
    topic: operator-dependence
    missingEvidence: Customer evidence separating protocol-design advantage from Zama-managed service quality.
    whyItMatters: Some differentiation could come from strong operator execution rather than purely from protocol design, which matters for moat durability.
    diligencePath: Interview operators and live customers about migration effort, self-hosting options, and operational responsibilities.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE003
