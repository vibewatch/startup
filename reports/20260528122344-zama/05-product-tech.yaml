- id: trust-reliability-and-commercialization
  title: Trust controls are improving, but reliability and licensing still create diligence friction
  body: Zama has done more than many crypto infrastructure projects to expose trust and operations detail. Public materials describe a 13-node MPC design, onchain distributed key generation, delegated decryption for regulated readers, a very large first-release audit effort, and a live status page that breaks out core services. Those are meaningful positives because the product cannot win institutional workloads without both confidentiality and controlled visibility. The reliability picture is not perfect, however. The mainnet status indicators looked strong at fetch time, while at least one testnet service still showed materially weaker uptime. That split is acceptable for a platform still expanding its stack, but it means resilience is not yet conclusively bank-grade from public evidence alone. Commercially, the company’s open-source stance is real, yet the repos also make clear that commercial production use requires a patent license. That may help monetization, but it can also slow ecosystem
    adoption versus infrastructure that is simpler to self-host or commercialize independently.
  claimRefs:
  - CE030
  - CE033
  - CE038
  - CE039
  - CE040
