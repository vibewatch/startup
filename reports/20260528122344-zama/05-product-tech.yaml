  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Current status / maturity
  - Differentiation
  - Key diligence gap
  rows:
  - - Zama Protocol
    - Institutions and dApp builders
    - Mainnet live with wrappers, staking, bridging, and confidential-finance positioning
    - Adds confidentiality to existing chains instead of launching a siloed privacy chain
    - Independent proof on production latency and failure handling is thin
  - - FHEVM
    - Solidity developers
    - Current core framework with live repo, docs, and release cadence
    - Lets encrypted state coexist with public EVM state and familiar tooling
    - How much performance depends on Zama-operated coprocessors is not publicly benchmarked
  - - TFHE-rs
    - Rust engineers and protocol teams
    - Stable and actively released open-source library
    - Pure Rust TFHE with CPU, GPU, and HPU backends plus C and WASM access
    - Side-channel mitigation is still described as upcoming in public repo text
  - - Concrete / Concrete ML
    - ML engineers and privacy-sensitive AI teams
    - Current open-source tooling with demos and package distribution
    - Brings encrypted ML closer to scikit-learn, PyTorch, and Rust pipelines
    - Commercial customer references are sparse relative to technical depth
  - - Zama SDK + React SDK
    - Wallet, exchange, and dApp teams
    - Beta but publicly documented and integrable now
    - Hides FHE complexity behind ERC-20-style abstractions and frontend bindings
    - Beta maturity means API stability and support load still need direct validation
  - - Official wrappers + registry
    - Token issuers and app teams
    - Current on mainnet and testnet
    - Lets builders use confidential equivalents of standard tokens without deploying custom wrappers
    - Wrapper governance and upgrade controls need review
  - - Portfolio / staking / bridge apps
    - Token holders and operators
    - Current user-facing protocol apps
    - Shows Zama can ship workflows, not just primitives
    - App availability is proven publicly; enterprise support obligations are not
  - - Developer program and ecosystem funnel
    - Startups, template builders, and experimental teams
    - Active in 2026
    - Creates an onboarding path from experimentation to production-ready apps
    - Program participation is not the same as durable commercial adoption
