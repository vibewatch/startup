  name: Zama
chapter:
  number: 5
  title: Product & Technology
  summary: 'Zama has built a real confidentiality stack rather than a single cryptography asset: public evidence now spans protocol rails, FHEVM, TFHE-rs, Concrete ML, SDKs, wrappers, and live protocol apps. The product/tech edge is credible, but the strongest proof still comes from Zama-operated releases, status pages, and company-published benchmarks rather than long-duration independent production validation.'
sections:
- id: product-surface-and-workflow
  title: Product surface now spans protocol rails, developer libraries, and user-facing confidential-finance apps
  body: 'Zama no longer looks like a single cryptography library masquerading as a company. The public surface in 2026 spans a confidentiality protocol for public chains, the FHEVM framework for confidential smart contracts, TFHE-rs for low-level encrypted computation, Concrete and Concrete ML for encrypted AI and analytics workflows, and a newer SDK plus protocol apps for shielding, bridging, staking, and auctions. That breadth matters because the customer workflow is explicit: developers can start at the library layer, builders can plug confidential tokens into existing Web3 apps, and institutions can use prebuilt wrappers and apps rather than wiring FHE primitives from scratch. The strongest evidence is official documentation plus the GitHub and package surfaces showing that Zama is exposing real developer entry points rather than only publishing whitepapers. The caveat is that several buyer-facing use cases still rely on Zama-operated interfaces and wrappers, so the platform looks more
    integrated than fully decentralized in day-to-day practice.'
