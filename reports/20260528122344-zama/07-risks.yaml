- id: operational-and-security-execution
  title: Operational and Security Execution
  body: 'The protocol is no longer merely conceptual: Zama has public evidence of testnet usage, a completed decentralized key-generation ceremony, live staking, and at least one mainnet payroll transaction. Even so, the path from technically impressive launch to institution-grade reliability is still narrow. The testnet update reported more than 1.2 million encrypted transactions, more than 19,000 confidential contracts, 120,000+ active wallets, and 20+ partners, while FHEVM v0.9 was framed as the first mainnet release candidate with a 10x decryption improvement. Those are strong indicators of progress, but they also reveal how performance-sensitive the stack remains. The DKG ceremony moved 10.5 TB of data per party, and the protocol still depends on threshold MPC plus a relatively small operator set to keep key management decentralized.


    Mainnet launch did not eliminate implementation risk. Zama''s post-launch update says the full stack is live and integrable, but the SDK is still in beta and delegated decryption remains a newly shipped primitive. Staking launched with 18 operators split between 5 FHE nodes and 13 KMS nodes, and more than half of circulating supply is already staked. That improves economic alignment, yet it also means outages, key-management faults, or coordination failures among a limited set of infrastructure partners could affect both user trust and valuation simultaneously. The first confidential payroll is a real milestone, but one payroll does not yet substitute for a long public uptime record, broad app diversity, or disclosed incident metrics.'
  claimRefs:
