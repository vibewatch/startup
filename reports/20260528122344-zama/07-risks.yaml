- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Regulatory fit breaks
    - Public MiCA / travel-rule compliance issues, sanctions breaches, or partner offboarding over compliance concerns
    - Any formal enforcement action or material onboarding suspension tied to confidentiality controls
    - Treat as thesis break for regulated-finance adoption
  - - Operational architecture breaks
    - Mainnet incident, decryption outage, or operator-set instability
    - Repeated outage, failed key-management event, or visible operator churn before new nodes are added
    - Pause underwriting until reliability evidence improves
  - - Pilot-to-production conversion stalls
    - No additional production case studies beyond auction, payroll, or isolated partner pilots
    - Twelve months without repeatable enterprise transaction growth or named production customers
    - Shift view from infrastructure leader to research asset
  - - Demand quality deteriorates
    - Secondary token demand or staking participation weakens after launch
    - Sustained staking participation below current majority-of-float level or visible post-launch liquidity stress
    - Reduce conviction in tokenomics-backed security model
  - - Commercial evidence stays opaque
    - No public revenue, uptime, audit, or customer-retention disclosures
    - Another financing cycle arrives before disclosure improves
    - Demand protective terms or defer investment
  notes: Kill criteria are intentionally monitorable and tied to observable legal, operational, demand, and disclosure events.
