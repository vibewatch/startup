  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited or management-certified protocol revenue, fee burn, gross margin, and customer concentration.
    whyItMatters: These metrics determine whether the current price band can be treated as conservative, fair, or aggressive.
    diligencePath: Request a finance room with monthly revenue bridge, fee-burn detail, and top-customer concentration.
    relatedQuestionRefs:
    - QV022
    - QV027
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: cap-table-overhang
    missingEvidence: Current cap table, treasury holdings, unlock schedule, and interaction between token supply overhang and equity dilution.
    whyItMatters: Entry discipline is impossible if equity and token claims on future value are not mapped clearly.
    diligencePath: Request cap-table schedule and token / equity rights memo from legal and finance.
    relatedQuestionRefs:
    - QV022
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: customer-proof
    missingEvidence: Named production customers, recurring transaction volume, and channel-conversion data beyond the announced examples.
    whyItMatters: This is the difference between technical validation and durable commercialization.
    diligencePath: Request production cohort review covering Dfns, payroll, RWA, and other live workflows.
