- id: comparable-set-and-scenarios
  title: Comparable set and scenarios
  body: 'The comparable set does not produce a tidy formula, but it is still informative. Fireblocks is the optimistic private-market anchor: a mature institutional crypto-infrastructure platform with a reported $8 billion secondary-style valuation and $1 billion raised. Digital Asset is the more sobering enterprise-ledger anchor at roughly $380 million on Premier Alternatives. Arqit provides the public-market cautionary example: a listed cryptography business that can trade on extremely high revenue multiples while still generating only hundreds of thousands of dollars of current-period revenue. Zama sits somewhere between those poles. It has stronger category momentum than a niche listed crypto-security microcap, but much less disclosed distribution breadth than Fireblocks.


    That leads naturally to scenario analysis rather than point precision. In a bull case, Dfns-style distribution plus institutional privacy demand convert into repeatable transaction volume and fee burn, which can validate or exceed the last private equity mark. In the base case, Zama continues shipping, maintains strong staking participation, and expands production use cases, but investors still need to size positions off incomplete financial evidence. In the bear case, regulation stays heavy, privacy-linked tokens remain discounted, and the protocol struggles to turn technical credibility into sustained economics, pushing fair value back toward the token-sale or secondary range. Public evidence today supports the base case, not the bull case, as the most likely path.'
