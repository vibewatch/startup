- id: recommendation-and-final-diligence
  title: Recommendation and final diligence
  body: 'The correct recommendation is research-more, with medium confidence and a high risk rating. Zama has clearly crossed the threshold where it deserves serious attention: it has shipped mainnet components, assembled reputable operators, demonstrated live use cases, and raised capital at a unicorn mark. But investors should not confuse strong technical legitimacy with proven valuation support. Above the last disclosed >$1 billion round, the public record is too thin for a buy call. Between roughly $550 million and $840 million, the evidence becomes more interesting because entry price better reflects the absence of disclosed revenue and the still-open commercialization question.


    The final diligence list is therefore narrow and practical. A decision maker needs audited or management-certified revenue and fee-burn data, gross-margin or cost-to-serve evidence, production customer concentration, and a clear view of cap-table and token-overhang mechanics. The legal side needs confirmation that MiCA, travel-rule, sanctions, and privacy obligations have been translated into operating workflows rather than just terms-of-use language. If those disclosures come through positively, valuation can expand from a range-based framework into a more conventional growth-infrastructure underwriting model. If they do not, price discipline should dominate enthusiasm.'
