- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Commercial proof fails to emerge
    - Still no revenue / fee-burn disclosure by the next major financing or treasury event
    - Valuation remains narrative-led rather than economics-led
    - Do not underwrite above the mid-band valuation range
  - - Regulatory discount widens
    - New restrictions or exchange pushback toward privacy-linked assets and selective-disclosure designs
    - Compressed token and equity multiples
    - Shift base case toward the bear range
  - - Partner conversion stalls
    - No additional production case studies beyond current launches and partner announcements
    - Enterprise-distribution thesis weakens materially
    - Downgrade conviction and demand a lower entry
  - - Network security weakens
    - Staking participation or operator quality deteriorates from current majority-of-float level and 18-operator roster
    - Security and credibility premium compresses quickly
    - Reassess both token and equity underwriting
  - - Cap-table or overhang risk surprises
    - Token unlock, emission, or treasury behavior proves less supportive than implied
    - Public pricing band overstates durable value
    - Pause deployment until cap-table clarity improves
  notes: Each trigger is intended to be monitored with public or management-provided evidence rather than subjective narrative updates.
  claimRefs:
