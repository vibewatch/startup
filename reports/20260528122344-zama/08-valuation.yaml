company:
  name: Zama
chapter:
  number: 8
  title: Valuation
  summary: 'Public evidence supports a broad valuation band for Zama rather than a single clean price: the last disclosed equity round was above $1 billion, market-implied secondary data points nearer to ~$840 million, and the January 2026 token sale cleared around a ~$550 million valuation. Because revenue, margin, and customer-retention metrics remain undisclosed, the best current call is research-more with medium confidence and high risk, with the evidence looking fairer in the mid-band than above the unicorn round.'
sections:
- id: valuation-context-and-price-discipline
  title: Valuation context and price discipline
  body: 'Public evidence does not give a single clean price for Zama; it gives a range. The last clearly disclosed equity datapoint is the June 2025 Series B at more than $1 billion. Secondary-style market data from Premier Alternatives points to roughly $840 million. Alpha Drops shows a January 2026 public token sale at a $550 million valuation, while Zama''s own auction pages add nuance by showing $118.5 million committed, only $44 million paid, a $0.05 clearing price, and heavy oversubscription. These datapoints are not perfectly fungible—token clearing, secondary indications, and private equity marks are different instruments with different liquidity and control rights—but together they say something important: the market has not settled on one obvious price for Zama.


    That ambiguity matters because Zama still has no public revenue, ARR, margin, or retention disclosures. In that context, the company cannot be valued with the same confidence as a private SaaS business that has clean financial KPIs. Instead, the public case for value rests on category leadership in confidential computing, evidence that the protocol is genuinely live, and early demand signals from operators, auctions, and institutional channels. That is enough to justify continued diligence and a non-trivial strategic premium. It is not enough to underwrite any price above $1 billion without conditioning the decision on undisclosed commercialization data.'
