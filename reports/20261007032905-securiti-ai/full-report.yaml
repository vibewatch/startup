              - CP013
      - number: '3.3'
        title: Pricing, Packaging, GTM Friction, and Total Cost of Ownership
        blocks:
          - type: paragraph
            body: >-
              Commercial packaging in enterprise data security and AI governance is dominated by opaque, sales-led
              quoting models that impose friction on prospective buyers. Securiti AI operates exclusively under custom
              enterprise subscription contracts, requiring proof-of-concept scoping and delivery team engagement rather
              than self-service provisioning. Industry pricing tracker xpay and review platform WhatIf AI observe that
              Securiti's enterprise pricing scales with connected cloud accounts, data repositories, user entitlements,
              and modular governance tiers (such as Privacy Rights Automation, DSPM, and AI Security). While this custom
              pricing model accommodates petabyte-scale Global 2000 deployments, independent reviews identify high total
              cost of ownership (TCO)—including extended implementation timelines, multi-team onboarding, and ongoing
              professional services—as a material adoption headwind compared to mid-market platforms like Vanta and
              Drata.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Moat Durability, Switching Costs, and Incumbent Displacement Risks
        blocks:
          - type: paragraph
            body: >-
              Securiti AI's long-term competitive durability is fundamentally anchored in high enterprise switching
              costs, deep integration sprawl, and its post-acquisition combination with Veeam. Connecting Securiti
              requires integrating cloud infrastructure, enterprise data warehouses, identity providers, and LLM
              endpoints across more than 1,000 systems. Once an enterprise maps its petabyte-scale data estate,
              automates legal DSAR workflows, and configures runtime LLM firewall rules, displacing the platform entails
              severe operational disruption and audit risk. Furthermore, Veeam's global distribution
              footprint—encompassing over 550,000 enterprise customers and 82% of the Fortune 500—provides an unmatched
              go-to-market advantage against standalone DSPM startups. However, Securiti faces strategic
              vulnerabilities: aggressive consolidation by platform giants (such as Check Point acquiring Lakera, F5
              acquiring CalypsoAI, and Cato Networks buying Aim Security) threatens to commoditize standalone AI
              firewalls, while Rubrik's strong data resilience momentum creates fierce platform competition.
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Veeam Acquisition Reshapes Enterprise Competitive Dynamics
            body: >-
              The acquisition of Securiti AI by Veeam for $1.725B fundamentally transforms its competitive posture.
              Rather than battling well-capitalized standalone DSPM rivals like Cyera as an independent startup,
              Securiti gains immediate distribution into Veeam's 550,000 enterprise customers, directly positioning it
              against Rubrik's cyber-resilience narrative.
            calloutType: insight
            claimRefs:
              - CP001
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Core Architecture, and Monetization Mechanisms
        blocks:
          - type: paragraph
            body: >-
              Securiti AI operates an enterprise software-as-a-service (SaaS) and platform monetization model centered
              on its Data Command Center architecture. The company packages and sells its capabilities across core
              modules including Data Security Posture Management (DSPM), Data Discovery and Classification, and AI
              Security & Governance. Monetization scales primarily through annual recurring enterprise subscription
              contracts whose contract value is determined by the size and complexity of the customer's hybrid
              multi-cloud data estate, active cloud repositories, and connected database endpoints. The platform
              maintains over 1,000 pre-built integrations spanning cloud infrastructure, SaaS platforms, and enterprise
              data warehouses, enabling automated discovery, sensitive data mapping, and continuous policy enforcement.
              In response to rapid enterprise deployment of generative AI and autonomous systems, Securiti expanded its
              commercial reach by introducing specialized governance tiers, including its Agent Commander solution to
              monitor autonomous agent interactions. Gross margin economics are driven by cloud telemetry and scanning
              infrastructure costs, where automated data minimization and redundant data pruning serve both as customer
              value drivers and operational efficiency levers.
            claimRefs:
              - CI005
              - CI009
              - CI010
              - CI011
              - CI014
          - type: table
            tableRef: TI001
            claimRefs:
              - CI005
