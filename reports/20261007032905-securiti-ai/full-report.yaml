  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Executive Risk Profile and Threat Landscape
        blocks:
          - type: paragraph
            body: >-
              Evaluating Securiti AI requires assessing risks across legal, operational, and architectural dimensions
              following its $1.725 billion acquisition by Veeam [CR002]. While enterprise adoption of generative AI and
              agentic systems accelerates demand for Data Security Posture Management (DSPM) and AI trust frameworks
              [CR004], Securiti operates in a volatile regulatory and threat landscape. Key exposures stem from emerging
              AI accountability regulations [CR006, CR007], complex multi-cloud and IAM integration dependencies
              [CR001], and the operational friction of unifying 600 specialized personnel into Veeam's broader corporate
              structure [CR003]. Historical capital disclosures indicating $156 million raised across venture rounds
              highlight the high valuation multiple paid by Veeam [CR008], amplifying execution sensitivity if
              post-close retention or cross-platform roadmap delivery falters [CR005].
