      - number: '5.2'
        title: Product Lines, Module Matrix, and AI Governance
        blocks:
          - type: paragraph
            body: >
              The functional surface of Securiti AI spans four interconnected disciplines: Data Security Posture
              Management (DSPM), Data Privacy Automation, Data Access Governance, and AI Security & Governance. For
              privacy operations, the platform leverages specialized People Data Graphs to automate individual data
              subject access requests (DSARs), consent tracking, and regulatory impact assessments across global
              frameworks including GDPR and CPRA. Within the AI governance domain, Securiti delivers dedicated tooling
              to discover and catalog deployed AI models across public clouds, private infrastructure, and SaaS
              applications, surfacing shadow AI workloads and evaluating models against vulnerabilities including OWASP
              Top 10 for LLMs and adversarial manipulation attacks. In enterprise search, the specialized Gencore AI
              module provides identity-aware, governed semantic search by enforcing upstream entitlements and policy
              controls directly at the embedding and retrieval layers. In March 2026, the company introduced Agent
              Commander to govern autonomous multi-step AI agents and policy-driven execution across enterprise
              workflows.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
