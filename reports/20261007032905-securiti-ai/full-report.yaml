              - CU010
      - number: '6.3'
        title: Named Customer Proof, Production Deployments, and Industry Adoption References
        blocks:
          - type: paragraph
            body: >
              Enterprise adoption proof for Securiti AI spans Tier-1 production case studies, joint ecosystem solution
              validations, and high-visibility industry references across highly regulated sectors. In corporate
              communications, Securiti leadership confirmed that major production implementations include four of the
              largest airlines in North America, premier global financial institutions, major telecommunications
              carriers, and prominent international retailers deploying the platform to discover sensitive data and
              enforce unified access controls. Public customer references highlighted by the company include Sanofi,
              which integrates Securiti's AI governance and sensitive data controls to shorten drug development
              timelines; real estate finance giant Walker & Dunlop, which leverages the Data Command Center to modernize
              data discovery across its $135 billion asset portfolio; and Dye & Durham, where analytics leadership
              deployed Securiti for contextual risk scoring and sensitive asset intelligence. Furthermore, technology
              partner integrations provide indirect customer proof: HPE selected Securiti in 2024 for its Unleash AI
              program to deliver data security and compliance for enterprise customers deploying HPE Private Cloud AI.
              While these references confirm production readiness, independent customer audit data remains limited due
              to enterprise confidentiality across proprietary cybersecurity deployments.
            claimRefs:
              - CU003
              - CU011
              - CU012
              - CU013
