      - number: '6.2'
        title: Adoption Trajectory, Demand Generation Transition, and Commercial Scaling
        blocks:
          - type: paragraph
            body: >
              Securiti AI's commercial adoption trajectory underwent a foundational strategic evolution between 2023 and
              2025. In its initial high-growth phase, Securiti relied heavily on volume-driven bottom-funnel lead
              generation. However, competing across more than 10 global enterprise markets against well-capitalized
              cybersecurity incumbents generated severe operational inefficiencies and budget dispersion among
              enterprise buyers who preferred minimal introductory meetings. In response, Securiti executed a targeted
              account-based marketing (ABM) pivot across North America and EMEA focused exclusively on selected $1B+
              enterprise accounts. This precision strategy reached 54% of its defined enterprise Total Addressable
              Market (TAM), generated over $141 million in qualified pipeline with a verified 128X marketing ROI, and
              drove a 30.83% relative lift in enterprise brand recall within a 41-day measured study. On the global
              talent and delivery side, Securiti scaled international operations across the UK, Germany, and Singapore
              through 15 specialized machine learning and DevSecOps hires across three continents via Adapt Talent.
              However, independent diligence reveals significant disclosure gaps: Securiti has never publicly published
              exact paying account counts, net expansion rates (NRR), or gross revenue retention (GRR), leaving
              enterprise adoption durability largely unverified outside of strategic milestones.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
