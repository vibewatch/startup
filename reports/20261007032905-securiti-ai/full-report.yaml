      - number: '1.4'
        title: Platform continuity after acquisition
        blocks:
          - type: paragraph
            body: >-
              Securiti's current AI Security & Governance page describes a control plane that discovers and catalogs AI
              models, classifies risk, maps models to data and compliance obligations, monitors data flows, and applies
              governance controls. The company also remained visible in HPE's Unleash AI program, and its March 2026
              materials presented Agent Commander as a post-acquisition step toward safer AI agent adoption. These
              signals indicate continued product activity after closing, but they are company- or partner-issued rather
              than independent proof of adoption or integration quality. Diligence should therefore distinguish
              published product breadth from shipped Veeam integration, customer migration, cross-sell, and retention
              outcomes, none of which are quantified in the assigned evidence.
