  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Convergence, and Addressable Scope
        blocks:
          - type: paragraph
            body: >-
              The enterprise market for data governance and security is undergoing a structural paradigm shift driven by
              cloud data sprawl and generative AI adoption. Securiti AI operates at the intersection of Data Security
              Posture Management (DSPM), Data Access Governance (DAG), enterprise privacy operations automation, and AI
              Trust, Risk, and Security Management (AI TRiSM). Historically, enterprises addressed these operational
              requirements through fragmented point solutions: legacy Data Loss Prevention (DLP) suites, periodic
              privacy assessments, manual entitlement reviews, and siloed data catalogs. However, perimeter security
              models fail when generative AI agents and autonomous workloads interact across distributed enterprise
              repositories at machine speed. Securiti's Data Command Center redefines this boundary by establishing an
              active knowledge graph that continuously scans primary repositories and secondary backup archives across
              AWS, Azure, Google Cloud, and Snowflake estates. Excluded from this addressable scope are commodity
              network firewalls, general endpoint detection and response (EDR), and model foundation training
              infrastructure, focusing spend strictly on the data and governance control plane.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 'Market Sizing: Multi-Lens TAM, SAM, and SOM Dynamics'
        blocks:
          - type: paragraph
            body: >-
              Evaluating the total market opportunity for Securiti AI requires disaggregating standalone DSPM estimates
              from the broader data security and privacy software landscape. Independent market research shows
              significant variance in 2026 baseline estimates due to differing category boundaries. Grand View Research
              projects the core DSPM market at $2.2B to $2.5B in 2026 growing at a 13.9% CAGR toward $6.2B by 2033.
              Alternative estimates establish a wide corridor: narrow definitions such as Future Market Insights size
              the 2025 baseline at $1.1B (reaching $1.9B by 2035 at a 5.1% CAGR), while Stratistics MRC projects a
              baseline of $1.3B in 2026 expanding aggressively at a 34.4% CAGR to $13.9B by 2034, and Verified Market
              Reports estimates the 2026 baseline at $3.27B scaling to $12.75B by 2033. When expanding beyond standalone
              DSPM into the broader enterprise TAM—encompassing privacy compliance automation, data access governance,
              and AI security guardrails—the aggregate addressable spend exceeds $20B to $25B globally. Securiti's
              serviceable addressable market (SAM) focuses on Global 2000 enterprises managing petabyte-scale hybrid
              multicloud environments, while its serviceable obtainable market (SOM) is accelerated by Veeam's
              distribution engine across more than 550,000 enterprise backup customers.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: Buyer Personas, Procurement Dynamics, and Budget Allocation
        blocks:
          - type: paragraph
            body: >-
              Enterprise procurement of unified data and AI governance solutions involves a coordinated
              multi-stakeholder dynamic across security, privacy, and infrastructure leadership. The economic buyer is
              typically the Chief Information Security Officer (CISO) or Chief Data Officer (CDO) at enterprises
              generating over $1B in annual revenue, operating with annual data security tooling budgets between $200K
              and $1M+. Purchase decisions are triggered by three primary catalysts: multi-jurisdictional compliance
              exposure across GDPR, CCPA, and emerging global mandates; board-level mandates for safe generative AI
              deployment; and acute tool fatigue caused by managing disconnected point solutions. End-user
              practitioners—including Data Security Officers, Privacy Engineers, and Compliance Analysts—face 40% or
              higher productivity losses when manually reconciling audit trails across fragmented tools, creating an
              estimated operational penalty exceeding $500K annually per enterprise. By consolidating data discovery,
              access entitlements, and compliance reporting into a unified console, Securiti enables buyers to replace 3
              to 5 disparate point products, reduce compliance remediation cycles by up to 60%, and achieve
              comprehensive data classification across 80% or more of infrastructure within 12 months.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Macro Growth Drivers, Regulatory Pressures, and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption of Securiti's platform is propelled by structural enterprise tailwinds alongside notable
              procurement and operational frictions. The dominant growth driver is the rapid operationalization of
              generative AI and autonomous agentic workflows. Industry data indicates that 70% to 90% of enterprise data
              resides in unstructured formats—such as emails, documents, and customer tickets—which is forecasted to
              triple in volume by 2029. Because up to 80% to 90% of enterprise AI projects risk failure due to
              incomplete, inconsistent, or non-compliant underlying data, organizations require continuous discovery,
              entitlement enforcement, and precision rollback. Concurrently, global regulatory enforcement is
              accelerating: frameworks such as the NIST AI Risk Management Framework (AI RMF 1.0 / NIST AI 600-1), the
              European Union AI Act, and state-level enforcement (such as Colorado SB24-205 and Connecticut AG guidance)
              penalize unmanaged data leakage and algorithmic discrimination. Conversely, adoption constraints include
              complex multi-cloud integration friction, enterprise procurement inertia, proprietary pricing opacity, and
              organizational friction between security, legal, and data platform teams.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Platform Absorption Overcomes Standalone Category Limits
            body: >-
              Standalone DSPM is increasingly absorbed into consolidated data security platforms rather than scaling as
              an isolated budget line. By combining DSPM, access governance, privacy automation, and secondary data
              recovery post-Veeam acquisition, Securiti captures adjacent IT and resilience spending pools unavailable
              to pure-play posture startups.
            calloutType: insight
            claimRefs:
              - CM003
              - CM007
              - CM014
          - type: callout
            title: Enterprise Pricing Opacity and Proof-of-Value Friction
            body: >-
              Custom subscription licensing tailored to petabyte scale and complex cloud connector footprints restricts
              transactional velocity and obscures cross-vendor cost comparisons, requiring lengthy enterprise POC
              evaluations.
            calloutType: risk
            claimRefs:
              - CM010
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Segmentation, Substitutes, and Market Convergence'
        blocks:
          - type: paragraph
            body: >-
              The competitive arena surrounding Securiti AI spans five distinct operating categories: specialized Data
              Security Posture Management (DSPM) vendors, legacy data protection and backup incumbents, broad privacy
              operations suites, cloud compliance automation platforms, and internal do-it-yourself (DIY) engineering
              builds. Pure-play competitors such as Cyera, BigID, and early-stage posture managers initially pioneered
              agentless cloud data discovery, while specialized AI security startups such as Lakera, CalypsoAI, and Aim
              Security focused on model firewalls before recent waves of industry consolidation. In data backup and
              cyber-resilience, Veeam's primary rival Rubrik has aggressively integrated DSPM into its Rubrik Security
              Cloud, creating a direct clash between secondary data protection leaders. Meanwhile, compliance platforms
              such as Vanta and Drata offer mid-market automated governance, and legacy privacy suites like OneTrust
              address legal workflows. Historically, enterprises also relied on internal scripts, manual entitlement
              audits, and cloud-native tools (such as AWS Macie or Azure Purview), which remain primary status-quo
              substitutes despite prohibitive maintenance overhead.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP014
      - number: '3.2'
        title: Competitor Capability Analysis and Architecture Comparison
        blocks:
          - type: paragraph
            body: >-
              Evaluating Securiti AI against key market peers reveals significant divergence across architectural scope,
              discovery depth, and targeted workflows. Securiti's core technical asset is its contextual Data Command
              Graph, which integrates multi-cloud structured and unstructured data discovery with identity entitlements,
              privacy workflows, and AI model governance. In independent evaluations, benchmark platform AI Scanner
              scored Securiti AI at 7.5 out of 10 overall, rating its performance at 8.5/10 and versatility at 8.5/10,
              but flagging its complex deployment and enterprise-only scope with a 5/10 on pricing value. Compared to
              Varonis (rated 6.9/10), which excels in on-premises and SaaS access governance, Securiti demonstrates
              broader multi-cloud coverage and native privacy rights automation. Against OneTrust (rated 6.9/10), which
              leads in privacy legal templates and consent orchestration, Securiti offers superior petabyte-scale
              automated data discovery and runtime LLM firewalls. Rubrik provides enterprise data protection and
              cleanroom recovery but lacks Securiti's deep AI-specific model risk assessment and regulatory compliance
              libraries.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
