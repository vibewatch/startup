      - number: '6.4'
        title: Expansion Dynamics, Partner Channel Leverage, and Customer Concentration Risks
        blocks:
          - type: paragraph
            body: >
              Securiti AI's long-term customer economics and account durability are increasingly shaped by its
              integration into Veeam's broader commercial ecosystem following its December 2025 acquisition. While
              Securiti historically drove land-and-expand adoption from point compliance modules into broader DSPM and
              AI trust, its standalone customer expansion faced headwinds from enterprise procurement friction and
              lengthening security review cycles. The Unify Partner Program (UPP) established crucial co-selling
              relationships across Cloud Service Providers (AWS, Azure, GCP marketplaces), Technology Alliance Partners,
              and Global System Integrators, yet customer retention and revenue concentration risks persist. With Veeam
              serving over 550,000 customers worldwide, including 82% of the Fortune 500, Securiti's future growth
              hinges on cross-selling its Data Command Center into Veeam's vast installed base of secondary backup
              environments. However, enterprise customer churn risks arise from potential organizational misalignment:
              secondary backup administrators who manage Veeam deployments often report into IT infrastructure
              organizations, whereas Securiti's economic buyers reside in corporate CISO and privacy compliance offices,
              requiring distinct procurement pathways and multi-stakeholder approval.
            claimRefs:
              - CU004
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'The Enterprise ABM Pivot: From Lead Volume to Pipeline Precision'
            body: >
              Securiti AI's transition from broad bottom-funnel lead generation to an account-based marketing (ABM)
              strategy targeting $1B+ enterprises delivered a benchmark 128X ROI and unlocked over $141M in qualified
              pipeline. In competitive cybersecurity deal cycles where Fortune 500 buying committees prefer minimal
              sales meetings, precision targeting on platforms like LinkedIn proved essential for building brand
              credibility against incumbent giants.
            calloutType: insight
            claimRefs:
