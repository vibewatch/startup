      - number: '1.3'
        title: Leadership continuity and governance concentration
        blocks:
          - type: paragraph
            body: >-
              Founder Rehan Jalil remains the central operating figure: after closing, he joined Veeam as President of
              Security and AI. His earlier record includes founding Elastica, which merged with Blue Coat for $280
              million, and WiChorus, which Tellabs acquired for $165 million. That background supports founder-market
              fit in cloud security and enterprise infrastructure, while also creating key-person dependence around
              product vision and integration execution. Anand Eswaran, Veeam's CEO, is the parent-company executive
              sponsor. The assigned pool does not identify Securiti's board, other current functional leaders, retention
              packages, or post-close decision rights, so the leadership roster and governance assessment are explicitly
              partial.
