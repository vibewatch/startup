      - number: '1.2'
        title: Capital history and strategic exit
        blocks:
          - type: paragraph
            body: >-
              Independent reporting identifies a $50 million Series B led by General Catalyst with Mayfield
              participation and a $75 million Series C in 2022. ZK Research later reported $156 million raised across
              three rounds, naming Mayfield, General Catalyst, Workday Ventures, and Capital One Ventures, but the
              assigned sources do not provide a primary cap table or a full round-by-round reconciliation. Veeam agreed
              to acquire Securiti for $1.725 billion in October 2025 and completed the transaction in December. One
              analyst described the price as about three times a reported $575 million prior valuation. That comparison
              is useful context, but the purchase price is not ARR and cannot establish an operating multiple without
              audited revenue and transaction accounting.
