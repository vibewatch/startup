        title: Operational Dependencies and Integration Execution
        blocks:
          - type: paragraph
            body: >-
              Operationally, Securiti relies heavily on cloud infrastructure integrations, Managed Service Provider
              (MSP) deliverables, and complex Customer Identity and Access Management (CIAM) systems [CR001].
              Integrating Securiti's Data Command Graph with Veeam's secondary data protection infrastructure requires
              deep synchronization across backup repositories and primary runtime pipelines [CR003, CR005]. As Securiti
              absorbs 600 technical and security staff into Veeam, key-person dependencies and organizational
              restructuring present immediate operational friction [CR002, CR003]. Furthermore, failure in underlying
              SaaS APIs or credential sync with cloud service providers could blind DSPM posture scanners, exposing
              enterprise clients to unmonitored shadow AI deployments [CR004].
