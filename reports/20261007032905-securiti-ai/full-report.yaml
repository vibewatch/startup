  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Stance, and Transaction Valuation Context
        blocks:
          - type: paragraph
            body: >
              Securiti AI presents a compelling case study in cybersecurity architecture consolidation, culminating in
              its $1.725 billion strategic acquisition by Veeam Software announced in October 2025 and closed in
              December 2025. The core investment thesis centered on the emergence of the Data Command Center—a unified
              knowledge-graph control plane spanning data security posture management (DSPM), automated privacy
              compliance operations (PrivacyOps), data access governance, and safe enterprise generative AI
              orchestration. Prior to the acquisition, Securiti had established a strong foundation across hybrid
              multicloud estates, securing backing from premier institutional venture firms including General Catalyst,
              Mayfield, Capital One Ventures, and Cisco Investments across approximately $151.7 million to $156 million
              in total equity funding. Forge Global secondary trading records tracked a post-money Series C valuation
              benchmark of $575 million as of March 2023, following a $75 million Series C funding round in October
              2022. The subsequent $1.725 billion acquisition price represented an approximate 3.0x valuation step-up
              over the last private round mark, delivering substantial liquidity to early syndicate backers and
              validating the commercial demand for unified data-and-AI governance controls. Our overall recommendation
              stance is classified as track, supported by medium analytical confidence and a fair valuation stance:
              while the strategic transaction closed cleanly and established an explicit enterprise transaction value,
              Securiti operates as a private corporate subsidiary without standalone audited quarterly filings, limiting
              ongoing liquidity and public secondary market entry.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
      - number: '8.2'
        title: Scenario Analysis, Revenue Multiples, and Operating Cases
        blocks:
          - type: paragraph
            body: >
              Evaluating the $1.725 billion acquisition multiple requires dissecting the software-as-a-service and
              enterprise cybersecurity operating profiles under varying revenue assumptions. Securiti never publicly
              disclosed audited recurring revenue figures or annual recurring revenue (ARR) milestones prior to closing,
              creating a critical information gap for valuation benchmarking. Third-party analyst estimates and private
              equity tracking benchmarks suggested annualized trailing revenue between $300 million and $400 million at
              the time of acquisition announcement, implying an aggressive yet defensible revenue multiple of
              approximately 4.3x to 5.8x revenue. In a bull case scenario, Securiti's Data Command Graph successfully
              cross-sells across Veeam's massive enterprise install base—encompassing over 550,000 customers and 82% of
              the Fortune 500—positioning the combined business for an upgraded AI-security public market re-rating
              ahead of a potential Veeam initial public offering. In our base case, standalone annual recurring revenue
              was more moderately situated in the $120 million to $160 million ARR band, reflecting an implied
              acquisition multiple of 10.8x to 14.4x ARR, consistent with high-growth premium DSPM pure-play targets.
              Conversely, the bear case highlights post-merger organizational friction, revenue cannibalization, and
              heavy platform overhead. Integrating Securiti's deep continuous cloud-scanning agent architecture into
              Veeam's legacy on-premises backup estates creates severe compute and egress costs, while intense
              competition from Microsoft Purview, BigID, and Cyera limits greenfield expansion.
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV010
      - number: '8.3'
        title: Comparable Transaction Landscape, Regulatory Catalysts, and Diligence Asks
        blocks:
          - type: paragraph
            body: >
              Securiti's transaction occurred amidst an unprecedented M&A wave consolidating AI governance and data
              protection vendors. Strategic buyers aggressively acquired AI security assets throughout 2025, illustrated
              by Check Point acquiring Lakera, F5 Networks acquiring CalypsoAI, Cato Networks acquiring Aim Security,
              and Varonis acquiring SlashNext. Furthermore, public data protection competitors like Rubrik expanded
              heavily into DSPM to drive enterprise retention, while BigID and OneTrust continued competing across
              enterprise privacy compliance. Regulatory catalysts across 2026—including the enforcement of the European
              Union AI Act, state-level algorithmic accountability statutes such as Connecticut's AI enforcement
              memorandum and Colorado's AI discrimination law, and NIST's CAISI AI agent security standards—reinforce
              secular tailwinds for Securiti's Agent Commander and AI TRiSM capabilities. Nevertheless, adverse
              operational realities persist: unapproved AI tools continue driving enterprise data breaches and
              regulatory enforcement actions across healthcare and finance, proving that software discovery controls
              face persistent edge-case bypasses. For institutional investors tracking Veeam's capital structure or
              secondary holdings, core diligence asks must focus on post-acquisition standalone ARR growth, gross margin
              retention, customer churn, and cross-sell penetration rates across Veeam's existing data resilience
              accounts.
            claimRefs:
              - CV003
              - CV009
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV008
              - CV013
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic Valuation Stance and Investment Decision
            body: >
              Securiti AI's $1.725 billion acquisition represents a premier exit multiple for enterprise data governance
              and privacy infrastructure. With the transaction fully completed in December 2025, direct venture capital
              investment is closed. We assign a track rating with fair valuation stance, advising institutional
              investors to monitor Veeam's consolidated performance and public market IPO trajectory rather than seeking
              illiquid secondary entries.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV005
          - type: callout
            title: Financial Opacity and Valuation Downside Triggers
            body: >
              The total absence of verified public disclosures regarding Securiti's audited ARR, gross margins, net
              revenue retention, and customer acquisition costs represents a material diligence hurdle. If standalone
              annual recurring revenue was beneath $80 million at acquisition, Veeam paid in excess of 21x ARR, creating
              substantial risk of balance sheet write-downs if post-merger cross-selling falters.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV014
