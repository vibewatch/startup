  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, operating model, and scale
        blocks:
          - type: paragraph
            body: >-
              Securiti was founded in 2019 and is based in San Jose, California. Its current legal terms describe a
              subscription product composed of a hosted web application plus downloadable components deployed in
              customer environments, while its product surface spans data security, privacy, governance, compliance, and
              AI governance. Veeam completed the acquisition on December 11, 2025, so Securiti should now be evaluated
              as an acquired operating platform rather than as an independent venture-backed startup. Veeam said it
              welcomed 600 Securiti employees at closing; that is a transaction-date workforce indicator, not a current
              headcount guarantee. No Securiti-specific customer count is disclosed in the assigned evidence, and
              Veeam's own customer count must not be substituted for it.
