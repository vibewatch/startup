            title: Retention Opacity and Cross-Sell Friction in Secondary Backup Estates
            body: >
              Despite strong enterprise logos including Sanofi, Walker & Dunlop, and four major North American airlines,
              Securiti has never disclosed net revenue retention (NRR) or churn figures. Furthermore, cross-selling
              Securiti's security-centric Data Command Center into Veeam's 550,000+ backup customers requires bridging
              the organizational chasm between infrastructure administrators and corporate CISOs.
            calloutType: risk
