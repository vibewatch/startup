      - number: '7.2'
        title: Regulatory and Legal Compliance Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Securiti's core value proposition depends on helping customers maintain compliance across fragmented
              global standards, including the EU AI Act, NIST AI RMF, GDPR, and emerging state-level algorithmic
              discrimination statutes [CR004, CR006, CR007]. However, regulatory divergence creates dual exposures:
              customer liability if automated controls fail, and product adaptation costs as jurisdictions enforce
              active supervisory mandates. Enforcement actions regarding unapproved AI tools and scraping mandates
              demonstrate that supervisory bodies demand stringent runtime auditing and human accountability [CR006,
              CR007]. If Securiti's compliance mapping lags evolving statutory interpretations or if client environments
              suffer regulatory penalties while relying on automated DSPM guardrails, enterprise customer trust and
              renewal dynamics would be severely impaired [CR004, CR005].
            claimRefs:
