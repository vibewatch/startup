      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Strategic Fusion of Production DSPM with Backup Resilience
            body: >
              The acquisition of Securiti AI by Veeam for $1.725 billion represents an architectural convergence between
              live production Data Security Posture Management (DSPM) and secondary data resilience. Traditional DSPM
              platforms operate exclusively on active cloud repositories, lacking the capability to remediate ransomware
              or surgically roll back compromised machine learning models. By linking Securiti's contextual knowledge
              graph directly into Veeam's backup infrastructure, the combined architecture enables automated discovery
              across primary estates alongside cleanroom-validated restoration and granular rollback of poisoned
              training datasets, embeddings, and model weights.
            calloutType: insight
            claimRefs:
              - CE003
              - CE004
              - CE011
              - CE015
          - type: callout
            title: Architectural Synchronization Across Heterogeneous Estates
            body: >
              While unifying primary DSPM and secondary backups provides compelling theoretical resilience, reconciling
              real-time streaming metadata graphs with petabyte-scale offline backup images creates formidable
              distributed systems challenges. Maintaining low-latency policy enforcement across active SaaS, cloud
              databases, and high-latency secondary snapshots risks metadata drift, potential false-positive policy
              alerts, and substantial ongoing engineering overhead as Veeam aligns two previously independent platforms.
            calloutType: risk
            claimRefs:
              - CE004
              - CE011
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation, Buyer Personas, and Enterprise Deployment Surfaces
        blocks:
          - type: paragraph
            body: >
              Securiti AI's customer base is concentrated primarily in large enterprise and Global 2000 accounts
              operating hybrid, multicloud IT architectures across North America, EMEA, and APAC. The company segments
              its commercial audience across three primary enterprise buying committees: Data Security and Cloud
              Infrastructure (led by Chief Information Security Officers and Heads of Cloud Security), Privacy
              Operations and Compliance (led by Chief Privacy Officers and General Counsels), and Emerging AI
              Initiatives (commanded by Chief Data Officers and Enterprise AI Leads). Prior to its acquisition by Veeam,
              Securiti focused its direct go-to-market engine on global brands generating over $1 billion in annual
              revenue, where multicloud data sprawl across public hyperscalers (AWS, Azure, GCP), data clouds
              (Snowflake, Databricks), and SaaS estates creates acute operational vulnerability. Customer engagements
              typically land through high-priority posture management initiatives—such as locating shadow sensitive
              data, automating Subject Rights Requests (DSARs), or satisfying new regulatory requirements like the EU AI
              Act—before expanding into a broader data intelligence control plane. Channel integration through the Unify
              Partner Program (UPP) further segments deployment between direct enterprise accounts, technology alliance
              co-selling (with hyperscalers and hardware providers like HPE), and global system integrator (GSI)
              implementations.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU009
