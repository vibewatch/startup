              - CI009
              - CI010
              - CI014
      - number: '4.2'
        title: Enterprise Pricing Architecture and Contract Packaging Dynamics
        blocks:
          - type: paragraph
            body: >-
              Securiti AI's go-to-market motion relies on direct enterprise sales supported by cloud ecosystem partners
              and system integrators, targeting Chief Information Security Officers (CISOs), Chief Data Officers (CDOs),
              and enterprise compliance leadership. Official pricing is not published on public list schedules; instead,
              commercial agreements are structured as negotiated custom annual licenses reflecting corporate data
              volume, tenant environments, and selected security modules. Pricing tiers typically begin with
              foundational discovery and DSPM capabilities, with customers expanding their annual contract value (ACV)
              through add-on governance packs for generative AI, large language model (LLM) firewall controls, and
              privacy compliance automation. Following the completion of Veeam's $1.725 billion acquisition in December
              2025, Securiti's monetization is transitioning toward unified platform packaging, offering cross-sell
              opportunities into Veeam's installed base of over 550,000 enterprise customers. Standard enterprise
              discounting applies for multi-year commitments, although realized discounting schedules, average selling
              prices, and net price realization remain closely guarded private commercial data.
            claimRefs:
              - CI001
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI009
              - CI010
              - CI011
      - number: '4.3'
        title: Acquisition Valuation, Capital Structure, and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              On December 11, 2025, backup and data resilience market leader Veeam Software completed its acquisition of
              Securiti AI for an aggregate purchase price of $1.725 billion. The transaction represents Securiti AI's
              definitive liquidity exit, concluding its standalone capital lifecycle. Prior to the sale, Securiti had
              raised approximately $156 million in total institutional venture funding across three primary financing
              rounds, supported by prominent venture backers including Mayfield, General Catalyst, Workday Ventures, and
              Capital One Ventures. An earlier $50 million Series B round led by General Catalyst in January 2020 had
              valued the company at an estimated post-money valuation of $575 million; thus, the $1.725 billion
              transaction price delivered an approximate three-fold step-up in corporate valuation. Morgan Stanley acted
              as exclusive financial advisor to Securiti AI on the sale, while JPMorgan Chase Bank provided credit
              facilities to finance Veeam's purchase. Upon transaction closing, Veeam integrated approximately 600
              Securiti employees into its corporate structure, with Securiti founder and CEO Rehan Jalil appointed
              President of Security and AI at Veeam.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI007
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI006
              - CI007
              - CI013
      - number: '4.4'
        title: Commercial Traction Divergence and Underwriting Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Evaluating Securiti AI's standalone operating performance reveals significant information asymmetry and
              contradictory secondary evidence. Third-party private equity tracking estimates placed Securiti's trailing
              twelve-month revenue leading into the acquisition between $300 million and $400 million, which implied an
              acquisition valuation multiple of roughly 4.3x to 5.8x revenue. In stark contrast, alternative corporate
              intelligence trackers recorded 2024 annual revenue at $75.9 million, which would indicate a significantly
              steeper transaction multiple of 22.7x. Furthermore, digital engagement signals recorded by traffic
              intelligence providers show monthly web visits at 247.4K with a month-over-month decline of 13.3%,
              presenting potential top-of-funnel friction. Neither Securiti AI nor Veeam has publicly disclosed audited
              GAAP revenue, recurring revenue run rates (ARR), gross retention, or net revenue retention (NRR) cohorts.
              Consequently, external underwriting cannot definitively establish whether the purchase price reflected
              sustained commercial revenue scale or a premium paid for strategic intellectual property, enterprise DSPM
              market leadership, and high-growth AI security capabilities.
            claimRefs:
              - CI005
              - CI006
              - CI008
              - CI013
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Acquisition Valuation Multiples Mask Revenue Opacity
            body: >-
              While Veeam paid $1.725 billion to acquire Securiti AI—representing an estimated 5x multiple on
              upper-bound trailing revenue estimates ($300M–$400M)—alternative private estimates of $75.9 million
              suggest an effective multiple exceeding 22x, underscoring severe information asymmetry in standalone
              financial performance.
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI006
          - type: callout
            title: Absence of Audited Unit Economics Precludes Precise Underwriting
            body: >-
              Neither Securiti AI nor Veeam disclosed GAAP gross margin, net revenue retention, or customer acquisition
              costs prior to acquisition close. Underwriters must treat private valuation multiples as strategic
              enterprise premium rather than proof of standalone unit profitability.
            calloutType: risk
            claimRefs:
              - CI008
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Architecture and the Data Command Graph
        blocks:
          - type: paragraph
            body: >
              Securiti AI pioneers an integrated control plane termed the Data Command Center, structured around a
              unified knowledge graph known as the Data Command Graph or DataAI Command Graph. Rather than relying on
              point security scanners that inspect discrete cloud storage buckets or databases in isolation, Securiti
              continuously ingests telemetry, metadata, and access permissions across structured databases, unstructured
              repositories, and streaming pipelines. This underlying contextual graph dynamically cross-references data
              asset lineage, object classification, identity entitlements, and operational posture across hybrid
              multicloud environments. The platform integrates an extensible agentic AI automation engine that
              operationalizes detection, access remediation, and risk classification across petabyte-scale footprints,
              bridging raw infrastructure discovery with policy enforcement. Following the company's $1.725 billion
              acquisition by Veeam, Securiti's core graph architecture is being coupled directly into secondary backup
              data environments and disaster-recovery pipelines, bridging production DSPM with enterprise data
              resilience.
            claimRefs:
