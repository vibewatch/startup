    title: Recommendation Summary and Valuation Framework
    columns:
      - Dimension
      - Assessment / Metric
      - Benchmark / Reference
      - Decision Implication
    rows:
      - - Recommendation
        - Track
        - Direct venture investment closed via acquisition
        - Monitor Veeam pre-IPO capitalization and secondary liquidity opportunities
      - - Confidence
        - Medium
        - Verified transaction value but private operating metrics
        - Financial opacity on ARR and churn limits high-confidence forecasting
      - - Risk Rating
        - Medium
        - Corporate parent backing vs integration execution
        - Downside buffered by Veeam balance sheet; upside tied to product synergy
      - - Valuation Stance
        - Fair
        - $1.725B exit (~3.0x step-up over $575M Series C mark)
        - Reflects category-defining AI governance premium balanced by revenue uncertainty
      - - Target Return Profile
        - Private corporate holding
        - Veeam public IPO equity re-rating candidate
        - Value realization tied to Veeam public market debut multiple expansion
    notes: >-
      Recommendation and stance reflect closed M&A transaction dynamics as of December 2025; Securiti AI operates as a
      wholly owned subsidiary of Veeam Software.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
  - id: TV002
    title: Thesis and Anti-Thesis Balance Sheet
    columns:
      - Stance
      - Core Thesis Argument
      - Supporting Evidence & Market Proof
      - What Would Change The View
    rows:
      - - Thesis (Bull)
        - Unified Data Command Center captures secular convergence of DSPM, privacy compliance, and AI governance.
        - >-
          Cisco Investments partnership, 1000+ connectors, and adoption by Fortune 500 enterprises across hybrid
          multicloud.
        - Significant slowdown in enterprise generative AI deployments or commoditization of data classification.
      - - Thesis (Bull)
        - >-
          Massive commercial distribution leverage through Veeam's 550,000+ enterprise customer footprint and 82%
          Fortune 500 reach.
        - >-
          Veeam completed acquisition for $1.725B to form the industry's first unified Data Platform spanning production
          and backup.
        - Channel partner resistance or failure of backup buyers to adopt security and governance software.
      - - Anti-Thesis (Bear)
        - Opaque financial disclosure obscures underlying organic burn, unit economics, and standalone revenue scale.
        - >-
          FundedIQ and Forge Global show $151.7M-$156M equity raised but zero verified public disclosures of audited ARR
          or gross margin.
        - Audited disclosure of >$200M ARR with >80% gross margins and positive operating cash flow.
      - - Anti-Thesis (Bear)
        - >-
          Post-merger integration friction and technological mismatch between real-time SaaS graph and on-premise backup
          images.
        - >-
          Knowledge-graph deep inspection across heterogeneous multicloud estates creates heavy compute and egress
          overhead.
        - >-
          Seamless native integration demonstrating sub-second cleanroom restoration and zero-friction customer
          expansion.
    notes: >-
      Thesis arguments evaluate Securiti AI's standalone technological defensibility against operational execution risks
      within Veeam.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV006
      - CV008
      - CV013
  - id: TV003
    title: Scenario Analysis and Implied Valuation Multiples
    columns:
      - Operating Scenario
      - Revenue / ARR Assumption
      - Implied Deal Multiple
      - Core Valuation Logic & Synergies
      - Probability Signal
    rows:
      - - Aggressive Growth Case
        - $300M - $400M estimated trailing revenue
        - 4.3x - 5.8x Revenue
        - >-
          Top-line PE tracking estimates materialize; cross-sell into Veeam enterprise accounts drives rapid multiple
          expansion.
        - 25% (High execution hurdle given private estimates)
      - - Base Market Case
        - $120M - $160M standalone ARR
        - 10.8x - 14.4x ARR
        - >-
          Premium multiple consistent with high-growth cybersecurity peers (e.g., Rubrik, Varonis); reflects 3.0x
          step-up over Series C.
        - 50% (Aligns with typical private venture exit metrics)
      - - Stressed Bear Case
        - <$80M standalone ARR
        - '>21.5x ARR'
        - Strategic premium paid for defensive tech and talent; substantial multiple compression if integration stalls.
        - 25% (Supported by post-merger integration risks)
    notes: >-
      Scenarios model implied transaction multiples against $1.725B acquisition price; baseline assumes 600 acquired
      employees and $156M venture capital raised.
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV008
      - CV010
