callouts:
  - calloutType: "recommendation"
    title: "Strategic Valuation Stance and Investment Decision"
    body: >
      Securiti AI's $1.725 billion acquisition represents a premier exit multiple for enterprise data governance and privacy infrastructure. With the transaction fully completed in December 2025, direct venture capital investment is closed. We assign a track rating with fair valuation stance, advising institutional investors to monitor Veeam's consolidated performance and public market IPO trajectory rather than seeking illiquid secondary entries.
    claimRefs:
      - "CV001"
      - "CV003"
      - "CV005"
  - calloutType: "risk"
    title: "Financial Opacity and Valuation Downside Triggers"
    body: >
      The total absence of verified public disclosures regarding Securiti's audited ARR, gross margins, net revenue retention, and customer acquisition costs represents a material diligence hurdle. If standalone annual recurring revenue was beneath $80 million at acquisition, Veeam paid in excess of 21x ARR, creating substantial risk of balance sheet write-downs if post-merger cross-selling falters.
    claimRefs:
      - "CV007"
      - "CV008"
      - "CV014"
