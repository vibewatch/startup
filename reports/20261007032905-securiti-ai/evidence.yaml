evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial disclosure
    missingEvidence: Audited revenue, ARR, gross margin, retention, cash, debt, and acquisition-accounting schedules.
    whyItMatters: >-
      Without consistent operating denominators, the acquisition price cannot be converted into a reliable revenue or
      ARR multiple.
    diligencePath: >-
      Request audited statements, monthly recurring-revenue cohorts, debt schedules, and Veeam purchase-accounting
      materials.
    relatedQuestionRefs:
      - QO004
      - QO010
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership and board
    missingEvidence: >-
      A complete current executive roster, board composition, retention arrangements, succession plan, and post-close
      decision rights.
    whyItMatters: Founder dependence and integration accountability cannot be assessed from two named executives.
    diligencePath: >-
      Obtain the post-close organization chart, board records, employment agreements, and delegation-of-authority
      matrix.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder map
    missingEvidence: >-
      The final cap table, ownership percentages, liquidation preferences, debt, secondaries, and acquisition proceeds
      by holder.
    whyItMatters: Named investors do not reveal control, dilution, preference outcomes, or realized returns.
    diligencePath: Review financing documents, the closing waterfall, option ledger, debt agreements, and shareholder consents.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: company-specific adverse events
    missingEvidence: Company-specific court, regulator, breach, and outage records sufficient to resolve the adverse-event check.
    whyItMatters: >-
      General AI-governance incidents and acquisition-price skepticism do not establish Securiti's own litigation,
      enforcement, or incident history.
    diligencePath: >-
      Run jurisdiction-specific court and regulator searches and obtain Securiti's incident, claims, and insurance-loss
      runs.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: blocking
    topic: Audited Standalone ARR and Gross Margin at Acquisition
    missingEvidence: Audited GAAP income statements, trailing twelve-month ARR, and subscription gross margins for FY2024–FY2025.
    whyItMatters: >-
      Without audited revenue and gross margins, underwriting the $1.725 billion valuation multiple requires relying on
      conflicting secondary estimates ($75.9M vs $300M–$400M).
    diligencePath: Request confidential acquisition disclosure schedule or Veeam integration audit files under NDA.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: Net Revenue Retention and Churn Benchmarks
    missingEvidence: Cohort-level net revenue retention (NRR), gross retention, and annual customer logo churn rates.
    whyItMatters: Expansion velocity determines whether the platform sustains top-line growth within Veeam's 550,000+ customer base.
    diligencePath: Examine post-acquisition cross-sell metrics and customer renewal disclosures in future Veeam financial reporting.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: benchmarks
    missingEvidence: >-
      Independent third-party benchmark data on Securiti AI's scanning latency, resource consumption, and cloud egress
      cost at petabyte scale.
    whyItMatters: >-
      High scanning overhead in live cloud production environments is a primary customer objection for DSPM
      architectures.
    diligencePath: Request customer proof-of-concept performance reports and cloud infrastructure consumption audits under NDA.
    relatedQuestionRefs:
