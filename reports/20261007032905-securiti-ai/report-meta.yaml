companyProfile:
  summary: >-
    Securiti AI is a San Jose-founded enterprise data-security, privacy, governance, and AI-governance software company
    that Veeam acquired for $1.725B in December 2025. The current product surface spans AI discovery, risk
    classification, data mapping, and governance controls, and Veeam said it welcomed roughly 600 employees at close.
    Public evidence supports a subscription software model and continued product activity after the deal, but audited
    revenue, ARR, gross margin, customer count, and post-close integration outcomes remain undisclosed, so the report
    treats the business as an acquired but still-opaque platform.
