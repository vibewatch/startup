chapter:
  number: 6
  title: "Customers"
  summary: "Securiti AI targets Global 2000 and Fortune 500 enterprises with a unified Data Command Center addressing multicloud data security, automated privacy governance, and enterprise AI trust. While the company demonstrates enterprise traction across highly regulated verticals—including North American airlines, financial institutions, global retailers, and healthcare leaders—retention metrics like NRR and GRR remain undisclosed, and post-acquisition commercial expansion increasingly depends on cross-selling into Veeam's 550,000+ data protection account base."
sections:
  - id: "customer-segmentation-and-buyer-profiles"
    title: "Customer Base Segmentation, Buyer Personas, and Enterprise Deployment Surfaces"
    body: >
      Securiti AI's customer base is concentrated primarily in large enterprise and Global 2000 accounts operating hybrid, multicloud IT architectures across North America, EMEA, and APAC. The company segments its commercial audience across three primary enterprise buying committees: Data Security and Cloud Infrastructure (led by Chief Information Security Officers and Heads of Cloud Security), Privacy Operations and Compliance (led by Chief Privacy Officers and General Counsels), and Emerging AI Initiatives (commanded by Chief Data Officers and Enterprise AI Leads). Prior to its acquisition by Veeam, Securiti focused its direct go-to-market engine on global brands generating over $1 billion in annual revenue, where multicloud data sprawl across public hyperscalers (AWS, Azure, GCP), data clouds (Snowflake, Databricks), and SaaS estates creates acute operational vulnerability. Customer engagements typically land through high-priority posture management initiatives—such as locating shadow sensitive data, automating Subject Rights Requests (DSARs), or satisfying new regulatory requirements like the EU AI Act—before expanding into a broader data intelligence control plane. Channel integration through the Unify Partner Program (UPP) further segments deployment between direct enterprise accounts, technology alliance co-selling (with hyperscalers and hardware providers like HPE), and global system integrator (GSI) implementations.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU009"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-trajectory-and-pipeline-dynamics"
    title: "Adoption Trajectory, Demand Generation Transition, and Commercial Scaling"
    body: >
      Securiti AI's commercial adoption trajectory underwent a foundational strategic evolution between 2023 and 2025. In its initial high-growth phase, Securiti relied heavily on volume-driven bottom-funnel lead generation. However, competing across more than 10 global enterprise markets against well-capitalized cybersecurity incumbents generated severe operational inefficiencies and budget dispersion among enterprise buyers who preferred minimal introductory meetings. In response, Securiti executed a targeted account-based marketing (ABM) pivot across North America and EMEA focused exclusively on selected $1B+ enterprise accounts. This precision strategy reached 54% of its defined enterprise Total Addressable Market (TAM), generated over $141 million in qualified pipeline with a verified 128X marketing ROI, and drove a 30.83% relative lift in enterprise brand recall within a 41-day measured study. On the global talent and delivery side, Securiti scaled international operations across the UK, Germany, and Singapore through 15 specialized machine learning and DevSecOps hires across three continents via Adapt Talent. However, independent diligence reveals significant disclosure gaps: Securiti has never publicly published exact paying account counts, net expansion rates (NRR), or gross revenue retention (GRR), leaving enterprise adoption durability largely unverified outside of strategic milestones.
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU010"
    tableRefs:
      - "TU002"
  - id: "named-customer-evidence-and-production-outcomes"
    title: "Named Customer Proof, Production Deployments, and Industry Adoption References"
    body: >
      Enterprise adoption proof for Securiti AI spans Tier-1 production case studies, joint ecosystem solution validations, and high-visibility industry references across highly regulated sectors. In corporate communications, Securiti leadership confirmed that major production implementations include four of the largest airlines in North America, premier global financial institutions, major telecommunications carriers, and prominent international retailers deploying the platform to discover sensitive data and enforce unified access controls. Public customer references highlighted by the company include Sanofi, which integrates Securiti's AI governance and sensitive data controls to shorten drug development timelines; real estate finance giant Walker & Dunlop, which leverages the Data Command Center to modernize data discovery across its $135 billion asset portfolio; and Dye & Durham, where analytics leadership deployed Securiti for contextual risk scoring and sensitive asset intelligence. Furthermore, technology partner integrations provide indirect customer proof: HPE selected Securiti in 2024 for its Unleash AI program to deliver data security and compliance for enterprise customers deploying HPE Private Cloud AI. While these references confirm production readiness, independent customer audit data remains limited due to enterprise confidentiality across proprietary cybersecurity deployments.
    claimRefs:
      - "CU003"
      - "CU011"
      - "CU012"
      - "CU013"
    tableRefs:
      - "TU003"
  - id: "expansion-retention-and-concentration-risks"
    title: "Expansion Dynamics, Partner Channel Leverage, and Customer Concentration Risks"
    body: >
      Securiti AI's long-term customer economics and account durability are increasingly shaped by its integration into Veeam's broader commercial ecosystem following its December 2025 acquisition. While Securiti historically drove land-and-expand adoption from point compliance modules into broader DSPM and AI trust, its standalone customer expansion faced headwinds from enterprise procurement friction and lengthening security review cycles. The Unify Partner Program (UPP) established crucial co-selling relationships across Cloud Service Providers (AWS, Azure, GCP marketplaces), Technology Alliance Partners, and Global System Integrators, yet customer retention and revenue concentration risks persist. With Veeam serving over 550,000 customers worldwide, including 82% of the Fortune 500, Securiti's future growth hinges on cross-selling its Data Command Center into Veeam's vast installed base of secondary backup environments. However, enterprise customer churn risks arise from potential organizational misalignment: secondary backup administrators who manage Veeam deployments often report into IT infrastructure organizations, whereas Securiti's economic buyers reside in corporate CISO and privacy compliance offices, requiring distinct procurement pathways and multi-stakeholder approval.
    claimRefs:
      - "CU004"
      - "CU014"
      - "CU015"
      - "CU016"
