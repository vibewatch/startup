callouts:
  - calloutType: "insight"
    title: "The Enterprise ABM Pivot: From Lead Volume to Pipeline Precision"
    body: >
      Securiti AI's transition from broad bottom-funnel lead generation to an account-based marketing (ABM) strategy targeting $1B+ enterprises delivered a benchmark 128X ROI and unlocked over $141M in qualified pipeline. In competitive cybersecurity deal cycles where Fortune 500 buying committees prefer minimal sales meetings, precision targeting on platforms like LinkedIn proved essential for building brand credibility against incumbent giants.
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
  - calloutType: "risk"
    title: "Retention Opacity and Cross-Sell Friction in Secondary Backup Estates"
    body: >
      Despite strong enterprise logos including Sanofi, Walker & Dunlop, and four major North American airlines, Securiti has never disclosed net revenue retention (NRR) or churn figures. Furthermore, cross-selling Securiti's security-centric Data Command Center into Veeam's 550,000+ backup customers requires bridging the organizational chasm between infrastructure administrators and corporate CISOs.
    claimRefs:
      - "CU003"
      - "CU010"
      - "CU014"
      - "CU016"
