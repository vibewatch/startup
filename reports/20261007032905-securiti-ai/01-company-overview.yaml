company:
  name: "Securiti AI"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Securiti AI is a San Jose-founded enterprise data-security, privacy, governance,
    and AI-governance software company that Veeam acquired for $1.725 billion in
    December 2025. The exit and approximately 600-person team establish scale, but
    audited revenue, ARR, margins, customer count, cap-table economics, and the
    post-acquisition integration roadmap remain unavailable in the assigned evidence.
sections:
  - id: "identity-and-business-model"
    title: "Identity, operating model, and scale"
    body: >-
      Securiti was founded in 2019 and is based in San Jose, California. Its current
      legal terms describe a subscription product composed of a hosted web application
      plus downloadable components deployed in customer environments, while its product
      surface spans data security, privacy, governance, compliance, and AI governance.
      Veeam completed the acquisition on December 11, 2025, so Securiti should now be
      evaluated as an acquired operating platform rather than as an independent
      venture-backed startup. Veeam said it welcomed 600 Securiti employees at closing;
      that is a transaction-date workforce indicator, not a current headcount guarantee.
      No Securiti-specific customer count is disclosed in the assigned evidence, and
      Veeam's own customer count must not be substituted for it.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO009"
      - "CO010"
      - "CO014"
    tableRefs:
      - "TO001"
  - id: "capital-and-exit"
    title: "Capital history and strategic exit"
    body: >-
      Independent reporting identifies a $50 million Series B led by General Catalyst
      with Mayfield participation and a $75 million Series C in 2022. ZK Research later
      reported $156 million raised across three rounds, naming Mayfield, General
      Catalyst, Workday Ventures, and Capital One Ventures, but the assigned sources do
      not provide a primary cap table or a full round-by-round reconciliation. Veeam
      agreed to acquire Securiti for $1.725 billion in October 2025 and completed the
      transaction in December. One analyst described the price as about three times a
      reported $575 million prior valuation. That comparison is useful context, but the
      purchase price is not ARR and cannot establish an operating multiple without
      audited revenue and transaction accounting.
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO013"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
  - id: "leadership-and-governance"
    title: "Leadership continuity and governance concentration"
    body: >-
      Founder Rehan Jalil remains the central operating figure: after closing, he joined
      Veeam as President of Security and AI. His earlier record includes founding
      Elastica, which merged with Blue Coat for $280 million, and WiChorus, which Tellabs
      acquired for $165 million. That background supports founder-market fit in cloud
      security and enterprise infrastructure, while also creating key-person dependence
      around product vision and integration execution. Anand Eswaran, Veeam's CEO, is
      the parent-company executive sponsor. The assigned pool does not identify
      Securiti's board, other current functional leaders, retention packages, or
      post-close decision rights, so the leadership roster and governance assessment
      are explicitly partial.
    claimRefs:
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO002"
  - id: "platform-continuity-and-integration"
    title: "Platform continuity after acquisition"
    body: >-
      Securiti's current AI Security & Governance page describes a control plane that
      discovers and catalogs AI models, classifies risk, maps models to data and
      compliance obligations, monitors data flows, and applies governance controls.
      The company also remained visible in HPE's Unleash AI program, and its March 2026
      materials presented Agent Commander as a post-acquisition step toward safer AI
      agent adoption. These signals indicate continued product activity after closing,
      but they are company- or partner-issued rather than independent proof of adoption
      or integration quality. Diligence should therefore distinguish published product
      breadth from shipped Veeam integration, customer migration, cross-sell, and
      retention outcomes, none of which are quantified in the assigned evidence.
    claimRefs:
      - "CO014"
      - "CO015"
      - "CO016"
