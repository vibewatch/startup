callouts:
  - calloutType: "insight"
    title: "The investable object has changed"
    body: >-
      The central diligence question is no longer whether Securiti can finance an
      independent scale-up; it is whether Veeam can retain the team and convert
      Securiti's data graph and governance controls into a unified, adopted platform.
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO016"
  - calloutType: "risk"
    title: "The exit price lacks an audited operating denominator"
    body: >-
      The $1.725 billion consideration and reported $575 million prior valuation are
      visible, but public audited revenue, ARR, gross margin, and retention metrics are
      not. The cited revenue range is third-party estimated and cannot support a precise
      acquisition multiple.
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO013"
