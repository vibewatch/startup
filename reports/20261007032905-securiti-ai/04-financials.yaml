callouts:
  - calloutType: "insight"
    title: "Acquisition Valuation Multiples Mask Revenue Opacity"
    body: "While Veeam paid $1.725 billion to acquire Securiti AI—representing an estimated 5x multiple on upper-bound trailing revenue estimates ($300M–$400M)—alternative private estimates of $75.9 million suggest an effective multiple exceeding 22x, underscoring severe information asymmetry in standalone financial performance."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI005"
      - "CI006"
  - calloutType: "risk"
    title: "Absence of Audited Unit Economics Precludes Precise Underwriting"
    body: "Neither Securiti AI nor Veeam disclosed GAAP gross margin, net revenue retention, or customer acquisition costs prior to acquisition close. Underwriters must treat private valuation multiples as strategic enterprise premium rather than proof of standalone unit profitability."
    claimRefs:
      - "CI008"
      - "CI013"
