      - number: '7.2'
        title: 监管与法律合规漏洞
        blocks:
          - type: paragraph
            body: >-
              Securiti 的核心价值主张是帮助客户遵守分散的全球标准，包括 EU AI Act、NIST AI RMF、GDPR 以及新兴州级算法歧视法规 [CR004, CR006,
              CR007]。但监管分化会带来双重暴露：自动化控制失败时的客户责任，以及各司法辖区执行主动监管要求时的产品适配成本。针对未经批准 AI 工具和抓取要求的执法行动表明，监管机构要求严格的运行时审计和人为问责
              [CR006, CR007]。如果 Securiti 的合规映射落后于法律解释变化，或客户依赖自动 DSPM 护栏却遭受监管处罚，企业客户信任和续约动态将严重受损 [CR004, CR005]。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
