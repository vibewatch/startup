      - number: '1.2'
        title: 融资历史与战略退出
        blocks:
          - type: paragraph
            body: >-
              独立报道显示，General Catalyst 领投了 $50 million 的 B 轮融资，Mayfield 参与其中；公司又在 2022 年完成了 $75 million 的 C 轮融资。ZK
              Research 后来报道称，公司三轮融资共筹得 $156 million，投资方包括 Mayfield、General Catalyst、Workday Ventures 和 Capital One
              Ventures，但指定来源没有提供一手股权结构表，也没有逐轮核对的完整记录。Veeam 于 2025 年 10 月同意以 $1.725 billion 收购 Securiti，并于 12
              月完成交易。一位分析师称，该价格约为此前据报道 $575 million 估值的三倍。这个对比可以提供背景，但收购价不是 ARR；没有经审计的收入和交易会计数据，不能据此确定经营倍数。
