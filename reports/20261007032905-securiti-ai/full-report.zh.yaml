  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类融合与可触达范围
        blocks:
          - type: paragraph
            body: >-
              云端数据扩散和生成式 AI 采用正在推动企业数据治理与安全市场发生结构性转变。Securiti AI 位于数据安全态势管理（DSPM）、数据访问治理（DAG）、企业隐私运营自动化以及 AI
              信任、风险与安全管理（AI TRiSM）的交汇处。过去，企业依靠零散点解决方案满足这些需求，包括传统数据丢失防护（DLP）套件、定期隐私评估、手工权限审查和孤立数据目录。但当生成式 AI
              智能体与自主工作负载以机器速度跨分布式企业存储交互时，边界安全模型会失效。Securiti 的 Data Command Center 建立主动知识图谱，持续扫描 AWS、Azure、Google Cloud 和
              Snowflake 环境中的主存储库及二级备份档案，从而重新划定边界。商品化网络防火墙、通用终端检测与响应（EDR）及基础模型训练基础设施不在可触达范围内，支出严格聚焦于数据和治理控制平面。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 市场规模：多视角 TAM、SAM 与 SOM 动态
        blocks:
          - type: paragraph
            body: >-
              评估 Securiti AI 的总市场机会，需要将独立 DSPM 估算与更广泛的数据安全和隐私软件市场拆开。独立研究显示，由于品类边界不同，2026 年基准估算差异很大。Grand View Research
              预计核心 DSPM 市场 2026 年为 $2.2B 至 $2.5B，按 13.9% CAGR 增长至 2033 年的 $6.2B。其他估算形成宽幅区间：Future Market Insights 对狭义市场的
              2025 年基准估算为 $1.1B，按 5.1% CAGR 于 2035 年达到 $1.9B；Stratistics MRC 预计 2026 年基准为 $1.3B，按 34.4% CAGR 激增至 2034 年的
              $13.9B；Verified Market Reports 预计 2026 年基准为 $3.27B，2033 年达到 $12.75B。若从独立 DSPM 扩展到涵盖隐私合规自动化、数据访问治理和 AI
              安全护栏的企业 TAM，全球可触达支出超过 $20B 至 $25B。Securiti 的可服务市场（SAM）聚焦管理 PB 级混合多云环境的 Global 2000 企业，其可获取市场（SOM）则受益于
              Veeam 覆盖逾 550,000 家企业备份客户的分销引擎。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: 买方画像、采购动态与预算分配
        blocks:
          - type: paragraph
            body: >-
              统一数据与 AI 治理方案的企业采购，需要安全、隐私和基础设施负责人共同决策。经济买方通常是年收入超过 $1B 企业的首席信息安全官（CISO）或首席数据官（CDO），年度数据安全工具预算为 $200K 至
              $1M+。采购主要由三类因素触发：GDPR、CCPA 和新兴全球规则带来的多司法辖区合规暴露；董事会要求安全部署生成式
              AI；以及管理断裂点解决方案造成的工具疲劳。数据安全官、隐私工程师和合规分析师等一线人员手工对账碎片化工具的审计轨迹时，生产力损失可达 40% 以上，预计每家企业每年运营损失超过 $500K。Securiti
              将数据发现、访问权限和合规报告整合到统一控制台，使买方能够替换 3 至 5 个点产品，将合规整改周期最多缩短 60%，并在 12 个月内完成 80% 或以上基础设施的数据分类。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 宏观增长驱动、监管压力与采用约束
        blocks:
          - type: paragraph
            body: >-
              企业结构性顺风推动 Securiti 平台采用，但采购和运营摩擦仍然明显。最大增长驱动是生成式 AI 和自主智能体工作流快速落地。行业数据表明，企业数据中 70% 至 90%
              采用非结构化格式，如邮件、文档和客户工单，预计到 2029 年体量将增至三倍。由于底层数据不完整、不一致或不合规，最多 80% 至 90% 的企业 AI
              项目面临失败风险，组织需要持续发现、权限执行和精确回滚。与此同时，全球监管执法加速，NIST AI Risk Management Framework（AI RMF 1.0 / NIST AI
              600-1）、European Union AI Act 以及州级执法会惩罚未受控的数据泄露和算法歧视。采用约束包括复杂的多云整合摩擦、企业采购惯性、自有定价不透明，以及安全、法务和数据平台团队之间的组织摩擦。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 平台吸收克服独立品类限制
            body: >-
              独立 DSPM 正被整合进统一数据安全平台，而不是作为单独预算项扩张。Veeam 收购后，Securiti 将 DSPM、访问治理、隐私自动化和二级数据恢复结合起来，切入纯 DSPM 初创公司无法触达的 IT
              与韧性支出池。
            calloutType: insight
            claimRefs:
              - CM003
              - CM007
              - CM014
          - type: callout
            title: 企业定价不透明与价值验证摩擦
            body: 针对 PB 级规模和复杂云连接器布局定制的订阅许可，限制交易速度，也掩盖跨供应商成本比较，因而需要漫长的企业 PoC 评估。
            calloutType: risk
            claimRefs:
              - CM010
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：细分、替代方案与市场融合
        blocks:
          - type: paragraph
            body: >-
              围绕 Securiti AI 的竞争分为五类：专业的数据安全态势管理（DSPM）厂商、传统数据保护与备份厂商、综合隐私运营套件、云合规自动化平台，以及企业内部自建的工程系统。Cyera、BigID
              等纯软件厂商和早期态势管理公司最初推动了无代理云数据发现；Lakera、CalypsoAI 和 Aim Security 等专业 AI
              安全初创公司则在近期行业整合前专注于模型防火墙。在数据备份和网络韧性领域，Veeam 的主要竞争对手 Rubrik 大力把 DSPM 集成进 Rubrik Security
              Cloud，使两家二级数据保护龙头正面交锋。与此同时，Vanta、Drata 等合规平台为中型市场提供自动化治理，OneTrust
              等传统隐私套件则覆盖法律流程。过去，企业还依赖内部脚本、手工权限审计和云原生工具（如 AWS Macie 或 Azure Purview）；尽管维护成本高得难以承受，这些方案仍是最主要的现状替代品。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP014
      - number: '3.2'
        title: 竞争者能力分析与架构比较
        blocks:
          - type: paragraph
            body: >-
              将 Securiti AI 与主要市场同行比较，可见架构范围、发现深度和目标工作流存在明显差异。其核心技术资产是上下文 Data Command Graph，将多云结构化与非结构化数据发现、身份权限、隐私工作流和
              AI 模型治理整合起来。独立评估中，benchmark 平台 AI Scanner 给 Securiti AI 总分 7.5/10，性能和多功能性均为 8.5/10，但认为部署复杂、仅面向企业，定价价值为
              5/10。相比 Varonis（6.9/10），Securiti 的多云覆盖和原生隐私权自动化更广；相比 OneTrust（6.9/10），Securiti 提供更强的 PB 级自动数据发现和运行时 LLM
              防火墙。Rubrik 提供企业数据保护和 cleanroom 恢复，但缺少 Securiti 深度的 AI 模型风险评估和监管合规库。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP013
      - number: '3.3'
        title: 定价、产品组合、GTM 摩擦与总拥有成本
        blocks:
          - type: paragraph
            body: >-
              企业数据安全和 AI 治理的商业包装，主要采用不透明、由销售主导的报价模式，给潜在买家增加了摩擦。Securiti AI
              只提供定制化企业订阅合同，客户需要先界定概念验证（PoC）范围并投入交付团队，不能自行开通。行业定价跟踪机构 xpay 和评测平台 WhatIf AI 观察到，Securiti
              的企业定价会随接入的云账户、数据存储库、用户权限以及模块化治理层级（如 Privacy Rights Automation、DSPM 和 AI Security）变化。这种定制定价能够适配 PB 级的
              Global 2000 部署，但独立评测指出，其总拥有成本（TCO）较高——实施周期长、需要多团队上线，并持续依赖专业服务——相较 Vanta、Drata 等中端市场平台，构成明显的采用阻力。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: 护城河持久性、切换成本与替代 incumbent 的风险
        blocks:
          - type: paragraph
            body: >-
              Securiti AI 的长期竞争韧性，根本上靠高昂的企业切换成本、广泛而深入的集成，以及收购后与 Veeam 的组合来支撑。接入 Securiti 需要打通云基础设施、企业数据仓库、身份提供商和 LLM
              端点，覆盖超过 1,000 个系统。企业一旦完成 PB 级数据资产映射、自动化法律 DSAR 流程并配置运行时 LLM 防火墙规则，替换该平台就会带来严重的运营中断和审计风险。Veeam 的全球分销覆盖超过
              550,000 家企业客户和 Fortune 500 企业的 82%，为 Securiti 相较独立 DSPM 初创公司提供了无可匹敌的市场进入优势。不过，Securiti
              也面临战略脆弱性：平台巨头加速整合（例如 Check Point 收购 Lakera、F5 收购 CalypsoAI、Cato Networks 收购 Aim Security）可能让独立 AI 防火墙商品化，而
