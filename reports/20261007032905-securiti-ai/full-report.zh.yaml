  - id: FU001
    title: Securiti AI 企业客户旅程与扩张闭环
    type: journey-map
    summary: 描绘企业客户从初始态势发现，到多利益相关方治理和生态交叉销售的旅程。
    data:
      items:
        - label: 1. 发现与评估
          stage: 发现与评估
          buyerPersona: CISO / Head of Cloud Security
          trigger: Multicloud data sprawl, shadow AI risk, impending regulatory audit
          touchpoints:
            - ABM 活动触达
            - CSP Marketplace 上架
            - 合作伙伴推荐
          customerAction: Connects read-only cloud APIs across AWS, Azure, GCP, or Snowflake
          keyOutcome: Immediate inventory of shadow data, sensitive assets, and toxic access combinations
        - label: 2. 初始落地与态势强制执行
          stage: 初始落地与态势强制执行
          buyerPersona: Security Operations & Cloud Security Engineers
          trigger: Executive reporting of critical data exposure findings
          touchpoints:
            - Data Command Center 控制台
            - 自动化分类引擎
          customerAction: Deploys DSPM module to continuously map sensitive data and remediate access anomalies
          keyOutcome: Achieves sensitive data classification and visibility across core enterprise assets
        - label: 3. 隐私合规自动化
          stage: 隐私合规自动化
          buyerPersona: Chief Privacy Officer / Legal Counsel
          trigger: Escalating operational burden of manual Subject Rights Requests (DSARs)
          touchpoints:
            - People Data Graph
            - 自动化同意管理器
          customerAction: Integrates privacy modules to automate data subject fulfillment and regulatory reporting
          keyOutcome: Reduces privacy fulfillment cycle times and mitigates GDPR/CCPA enforcement exposure
        - label: 4. 跨职能 AI 治理
          stage: 跨职能 AI 治理
          buyerPersona: Chief Data Officer / Enterprise AI Lead
          trigger: Enterprise mandates for safe generative AI deployment and model trust
          touchpoints:
            - AI Model Catalog
            - Gencore AI 搜索护栏
          customerAction: Expands subscription to include automated AI model risk cataloging and TRiSM guardrails
          keyOutcome: Replaces fragmented point solutions with single multicloud compliance command center
        - label: 5. 合作伙伴生态编排
          stage: 合作伙伴生态编排
          buyerPersona: Enterprise Architecture / System Integrator
          trigger: Complex multicloud deployment across hybrid private and public cloud estates
          touchpoints:
            - UPP 合作伙伴网络
            - HPE Unleash AI 联盟
          customerAction: Leverages system integrators and technology partners to standardize cross-platform controls
          keyOutcome: Accelerates enterprise-wide rollout across production data pipelines and hybrid environments
        - label: 6. 韧性与备份统一
          stage: 韧性与备份统一
          buyerPersona: CIO / VP Infrastructure (via Veeam)
          trigger: Need for unified clean recovery, cyber resilience, and secondary data governance
          touchpoints:
            - Veeam 数据平台
            - Cleanroom 恢复引擎
          customerAction: Unifies primary DSPM intelligence with enterprise backup recovery pipelines
          keyOutcome: End-to-end data resilience spanning production systems, AI models, and disaster backups
    claimRefs:
      - CU001
      - CU004
      - CU009
      - CU014
      - CU015
  - id: FR001
    title: 风险严重性与可能性评估矩阵
    type: matrix
    summary: 评估 Securiti AI 面临的主要企业风险的可能性、严重性与缓解态势。
    data:
      columns:
        - 可能性低
        - 可能性中
        - 可能性高
      rows:
        - label: 影响严重
          name: Critical Impact
          detail: Threats with enterprise-wide survival or structural implications
          values:
            - label: 历史 IP 诉讼
              detail: 竞争对手专利主张
              tone: medium
            - label: 监管合规失败
              detail: GDPR / AI Act 执法处罚严重
              tone: critical
            - label: 平台整合失效
              detail: Veeam 与 Securiti 图谱完全无法统一
              tone: critical
        - label: 影响高
          name: High Impact
          detail: Material operational or customer disruption
          values:
            - label: 云厂商 API 弃用
              detail: 遥测 API 锁死
              tone: low
            - label: CIAM / DSPM 扫描盲区
              detail: 影子 AI 工具造成的泄漏
              tone: high
            - label: 合并后核心人才流失
              detail: 核心 AI 研究工程人员流失
              tone: high
        - label: 影响中等
          name: Moderate Impact
          detail: Localized operational friction or elevated customer support burden
          values:
            - label: MSP 合同重新谈判
              detail: 供应商交付延迟
              tone: low
            - label: 跨境政策漂移
              detail: 当地隐私规则修改
              tone: medium
            - label: 数据管道重新索引延迟
              detail: 暂时性的态势扫描积压
              tone: medium
        - label: 影响轻微
          name: Minor Impact
          detail: Manageable administrative or non-critical process variations
          values:
            - label: 报告格式差异
              detail: 标准化仪表盘调整
              tone: low
            - label: 临时用户访问审计
              detail: 轻微权限审查
              tone: low
            - label: 文档同步
              detail: 目录翻译延迟
              tone: low
        - label: 运营摩擦
          name: Operational Friction
          detail: Internal engineering and tooling alignment challenges
          values:
            - label: 工具整合
              detail: 重叠的内部 DevOps 管道
              tone: low
            - label: 一线赋能延迟
              detail: 联合技术栈的销售工程培训
              tone: medium
            - label: 客户门户迁移
              detail: 统一登录与身份迁移
              tone: medium
        - label: 监控偏差
          name: Monitoring Variance
          detail: Metric and telemetry observation thresholds across cloud endpoints
          values:
            - label: 智能体心跳延迟
              detail: 端点网络短暂中断
              tone: low
            - label: API 限流告警
              detail: 突发查询触发速率告警
              tone: low
            - label: 审计日志归档同步
              detail: 次级备份时间线延误
              tone: low
    approximationNotes: 依据公开披露及收购后的运营风险画像评估。
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
  - id: FV001
    title: Securiti AI 建议与价值兑现流程
    type: flow
    summary: 决策流程展示从风险投资支持与 Series C 估值，到 $1.725B Veeam 退出交易，再到最终观察立场的顺序。
    data:
      nodes:
        - id: N1
          label: 风险投资基础：从 Seed 到 Series C 累计融资 $151.7M-$156M（General Catalyst、Mayfield、Cisco）
        - id: N2
          label: 私有估值基准：$575M Series C 投后估值（2023 年 3 月 Forge 估值）
        - id: N3
          label: 战略退出事件：Veeam Software 以 $1.725B 收购（2025 年 12 月完成；上升约 3.0 倍）
        - id: N4
          label: 整合界面：Data Command Graph 接入 550,000+ 个企业数据韧性账户
        - id: N5
          label: 分析决策关口：独立 ARR 与流失率缺口阻碍公开市场股权评级
        - id: N6
          label: 最终立场：观察（中等信心，合理估值立场取决于 Veeam 的 IPO 准备度）
      edges:
        - from: N1
          to: N2
        - from: N2
          to: N3
        - from: N3
          to: N4
        - from: N4
          to: N5
        - from: N5
          to: N6
    approximationNotes: 流程依据已验证的交易披露，展示定性的战略演进与估值里程碑。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV007
