            body: >-
              运营上，Securiti 高度依赖云基础设施整合、托管服务提供商（MSP）交付物和复杂的客户身份与访问管理（CIAM）系统 [CR001]。将 Data Command Graph 与 Veeam
              二级数据保护基础设施整合，需要在备份存储库和主运行时管道之间深度同步 [CR003, CR005]。Securiti 将 600 名技术和安全员工纳入 Veeam 后，关键人物依赖和组织重组会造成即时运营摩擦
              [CR002, CR003]。底层 SaaS API 或与云服务商的凭据同步若失败，可能使 DSPM 扫描器失明，让企业客户暴露于未受监控的影子 AI 部署 [CR004]。
