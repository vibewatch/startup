  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、立场与交易估值背景
        blocks:
          - type: paragraph
            body: >
              Securiti AI 是网络安全架构整合的典型案例，最终由 Veeam Software 于 2025 年 10 月宣布以 $1.725 billion 战略收购，并于 2025 年 12
              月完成。核心投资逻辑围绕 Data Command Center 的出现展开：这是一套统一知识图谱控制平面，覆盖 DSPM、自动化隐私合规运营（PrivacyOps）、数据访问治理和安全的企业生成式 AI
              编排。收购前，Securiti 在混合多云环境中建立了扎实基础，并从 General Catalyst、Mayfield、Capital One Ventures 和 Cisco Investments
              等机构获得约 $151.7 million 至 $156 million 股权融资。Forge Global 二级交易记录显示，截至 2023 年 3 月，Series C 投后估值基准为 $575
              million，此前 2022 年 10 月完成 $75 million Series C。后续 $1.725B 收购价相当于较上一轮私人估值约 3.0x
              的提升，为早期联合投资方带来大量流动性，也验证了统一数据与 AI 治理控制的商业需求。总体建议立场为 track，分析信心为 medium，估值立场为 fair：战略交易顺利完成并确立了明确企业交易价值，但
              Securiti 作为私人企业子公司运营，没有独立经审计季度申报，限制了持续流动性和公开二级市场进入。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
