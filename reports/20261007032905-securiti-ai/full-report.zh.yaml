chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、经营模式与规模
        blocks:
          - type: paragraph
            body: >-
              Securiti 成立于 2019 年，总部位于加利福尼亚州 San Jose。当前法律条款将其产品描述为订阅产品，由托管 Web 应用和部署在客户环境中的可下载组件构成；产品覆盖数据安全、隐私、治理、合规和
              AI 治理。Veeam 于 2025 年 12 月 11 日完成收购，因此现在应将 Securiti 视为被收购的运营平台，而非独立的风险投资创业公司。Veeam 表示交割时接收了 600 名 Securiti
              员工；这是交易日员工规模指标，不代表当前员工数。指定证据没有披露 Securiti 的客户数，不得以 Veeam 自身客户数替代。
