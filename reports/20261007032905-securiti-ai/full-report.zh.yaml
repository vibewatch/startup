      - number: '1.3'
        title: 管理层延续与治理集中
        blocks:
          - type: paragraph
            body: >-
              创始人 Rehan Jalil 仍是核心经营人物：交易完成后，他加入 Veeam，担任安全与 AI 总裁。他此前创立 Elastica，该公司以 $280 million 与 Blue Coat 合并；他还创立
              WiChorus，后者被 Tellabs 以 $165 million 收购。这段经历支持其在云安全和企业基础设施领域的创始人与市场匹配度，但也使产品愿景和整合执行存在关键人物依赖。Veeam CEO Anand
              Eswaran 是母公司的执行发起人。指定材料没有说明 Securiti 的董事会、其他现任职能负责人、留任方案或交割后的决策权，因此管理层名单和治理评估明确不完整。
