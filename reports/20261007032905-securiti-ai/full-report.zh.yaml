      - number: '1.4'
        title: 收购后的平台延续性
        blocks:
          - type: paragraph
            body: >-
              Securiti 当前的 AI Security & Governance 页面介绍了一套控制平面：发现并编目 AI 模型、分类风险、将模型映射到数据和合规义务、监控数据流并执行治理控制。公司也仍出现在 HPE
              的 Unleash AI 项目中，并在 2026 年 3 月材料中将 Agent Commander 定位为收购后推动更安全采用 AI
              智能体的一步。这些信号说明交割后产品仍在活动，但它们来自公司或合作伙伴，不是独立的采用率或整合质量证据。因此尽调应区分已发布的产品广度与已交付的 Veeam
              整合、客户迁移、交叉销售和留存结果；指定证据没有量化这些结果。
            claimRefs:
              - CO014
              - CO015
              - CO016
