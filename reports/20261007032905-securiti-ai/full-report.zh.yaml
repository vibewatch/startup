  - id: FE001
    title: Securiti AI Data Command 平台架构栈
    type: stack
    summary: 六层架构栈展示数据如何从分布式企业数据源流经 Data Command Graph，最终进入治理与韧性控制。
    data:
      layers:
        - label: 次级数据韧性层
          detail: 经 cleanroom 验证的恢复速度最高快 5x；通过 Veeam 整合，可对数据集、向量嵌入和模型权重进行精细回滚。
        - label: 智能体 AI 与编排层
          detail: 可扩展的智能体 AI 框架，自动化敏感数据智能、定制工作流剧本和政策修复。
        - label: 治理、隐私与信任层
          detail: 自动化隐私运营、People Data Graphs、对照 OWASP/NIST 的 AI 模型风险映射，以及 Gencore AI 治理搜索。
        - label: 上下文智能层
          detail: DataAI Command Graph 关联敏感资产、身份权限、云基础设施与运营态势。
        - label: 数据发现与分类层
          detail: 持续发现、分类并映射动态数据与静态数据中的 petabyte-scale 敏感数据血缘。
        - label: 多云摄取与连接器层
          detail: 超过 1,000 个连接器，覆盖原生云存储、SaaS 平台、数据库、流服务和 LLM 向量嵌入管道。
    approximationNotes: 平台架构概念图，依据技术文档和 Veeam 整合披露绘制。
    claimRefs:
      - CE001
      - CE002
