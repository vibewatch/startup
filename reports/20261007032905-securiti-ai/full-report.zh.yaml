companyProfile:
  summary: >-
    Securiti AI 是一家总部位于 San Jose 的企业数据安全、隐私、治理和 AI 治理软件公司，Veeam 于 2025 年 12 月以 $1.725B 收购了该公司。当前产品覆盖 AI
    发现、风险分类、数据映射和治理控制；Veeam 表示交割时接收了约 600
    名员工。公开证据支持其订阅软件模式及交易后的持续产品活动，但经审计收入、ARR、毛利率、客户数和交割后整合结果仍未披露，因此本报告将其视为已被收购、但仍不透明的平台。
