      - [Royalty or per-unit economics, null, "License and chiplet model reported; royalty base and per-unit fees not disclosed", "Revenue quality and gross-margin sensitivity remain open", "Review contracts, royalty definitions, and audit rights"]
      - [Discounting and channel economics, null, "No public discount, reseller, channel, or integration fee disclosure", "Strategic investors may help distribution but do not establish net price", "Request customer-level waterfall from list to realized price"]
      - [Sales cycle and payback, null, "Design qualification and customer chip cycles are described; cycle length and CAC are not disclosed", "Cash conversion may lag technical validation", "Measure funnel stage, CAC, cycle time, and payback by program"]
    notes: "Null means unavailable in the assigned public evidence, not zero. Official product or funding announcements are not a realized pricing schedule."
    claimRefs: [CI001, CI005, CI007, CI008]
  - id: TI003
    title: Unit-economics evidence and diligence requirements
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue, "Low millions in 2025", "Medium; management figure reported by Reuters", "Sets the only public starting point for the stated 2027 growth plan", "Reconcile to audited statements, recognized revenue, and product mix"]
      - [Revenue target, "Hundreds of millions by end of 2027", "Low; management forecast", "Drives the valuation narrative but is not a booked order or independent estimate", "Provide forecast bridge by customer, program, unit, and shipment date"]
      - [Gross margin, null, "Unavailable", "Chiplet manufacturing, test, packaging, and IP mix could materially change margin", "Provide gross-margin bridge and costs by product family"]
      - [Cash burn and runway, null, "Unavailable", "The latest raise does not reveal how long capital lasts", "Provide monthly cash balance, burn, runway, debt, and financing triggers"]
      - [Customer concentration, null, "Unavailable", "Strategic investors may overlap with potential customers, increasing both validation and concentration risk", "Provide top-customer revenue, backlog, and dependency by program"]
    notes: "Unavailable fields are explicit diligence gaps; funding raised is not treated as cash available, and revenue is not treated as ARR."
    claimRefs: [CI002, CI003, CI009, CI010, CI011, CI012]
