company:
  name: Eliyan
chapter:
  number: 4
  title: Financials
  summary: Eliyan's public financial picture is a privately held licensing and chiplet business priced at a $1 billion post-money valuation after a $145 million Series C, while revenue remains at "low millions" for 2025 and management's hundreds-of-millions 2027 outlook is not audited. The central underwriting issue is conversion of design activity and strategic investors into shipped volume, gross margin, and cash generation; public evidence does not disclose realized pricing, burn, runway, customer concentration, or profitability.
sections:
  - id: monetization-and-revenue-quality
    title: Monetization is tied to customer chip cycles
    body: >-
      Eliyan describes a business that licenses physical-layer interconnect IP and provides chiplets
      for semiconductor companies and systems builders, rather than manufacturing finished AI chips.
      Reuters reports that the company aims to license its technology and provide chiplets that
      custom-processor companies integrate into their designs. That mechanism can create sticky
      multi-year economics after a design win, but it also makes revenue dependent on customers'
      qualification, production schedules, and eventual system volume. The available record does not
      provide a list price, royalty rate, per-chip fee, contract minimum, backlog, or realized
      revenue by product. Eliyan's reported "low millions" of 2025 revenue and forecast of hundreds
      of millions by the end of 2027 are management disclosures reported by Reuters, not audited
      statements or an independent revenue forecast. Initial chiplet shipments were expected in
      2026, so the evidence supports a commercialization transition rather than established scale.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
  - id: pricing-and-unit-economics
    title: Pricing, margin, and sales efficiency remain underwriting gaps
    body: >-
      Public materials describe product families and technical performance, but they do not disclose
      realized pricing or the financial terms that turn NuLink PHY and NuGear deployments into
      revenue. Official January 2026 materials say proceeds would accelerate manufacturing and
      qualification, ecosystem partnerships, and deployment, while the company describes multiple
      connectivity domains and bandwidth targets. Those disclosures show where commercial effort is
      being invested; they do not establish gross margin, unit cost, foundry or packaging pass-through,
      warranty exposure, inventory ownership, implementation cost, sales-cycle length, CAC, payback,
      or channel economics. A licensing model could support high incremental margins, but the chiplet
      and qualification components may add manufacturing, test, support, and working-capital
      requirements. These unknowns are material because the $1 billion valuation is being assessed
      against a forward commercialization plan, not a public earnings history.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI002, TI003]
  - id: capital-adequacy-and-financing-dependency
    title: Capital supports expansion, but runway cannot be calculated
    body: >-
      The July 2026 Series C was reported as $145 million at a $1 billion valuation, led by Seligman
      Ventures with Cisco Investments and Lumentum participating. Reuters says the financing followed
      a stated plan to begin initial chiplet shipments in 2026 and grow from low millions of 2025
      revenue to hundreds of millions by the end of 2027. Eliyan's January 2026 announcement says
      its $50 million strategic round would support manufacturing and qualification, ecosystem
      partnerships, and deployment. ValueAddVC and Pomegra report roughly $295 million of announced
      funding, while GamesBeat reports that Eliyan had raised close to $250 million. Forge presents
      a lower, transaction-recorded total and explicitly cautions that its private-company data are
      not independently verified. The discrepancy is a reminder to preserve source definitions rather
      than treat all funding totals as interchangeable. No source in the assigned pool reports cash
      on hand, operating burn, debt, runway, customer concentration, or a next-round trigger. Capital
      adequacy is therefore unproven even though the latest round increases liquidity relative to the
      prior public record.
    claimRefs: [CI009, CI010, CI011, CI012]
  - id: financial-verdict
    title: "Financial verdict: strategic validation, limited operating proof"
    body: >-
      Eliyan has credible strategic validation: its Series C included networking and optical
      companies, and its own prior announcement named AMD, Arm, Coherent, Meta, Samsung Catalyst Fund,
      and Intel Capital among strategic participants. That investor mix can reduce distribution and
      ecosystem risk, but it is not the same as contracted revenue, paid production volume, or
      independent customer corroboration. The valuation case consequently rests on future conversion
      of silicon-proven interconnect products, customer qualification, and the optical expansion into
      a much larger revenue base. The adverse financial case is straightforward: a $1 billion post-money
      price is difficult to underwrite from "low millions" of reported 2025 revenue when the 2027
      revenue target is only a management forecast, and the public record supplies no margin or cash
      bridge. Investment diligence should request customer-level contracts and design-win stages,
      royalty and chiplet pricing, shipment and acceptance data, gross-margin bridge, monthly cash
      burn, cash balance, debt terms, working-capital commitments, and concentration by customer and
      program before assigning a revenue multiple or runway.
    claimRefs: [CI002, CI003, CI009, CI012]
    figureRefs: [FI001]
