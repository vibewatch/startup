      - ["Connect packages or modules", "Electrical reach and bandwidth density decline off package", "NuLinkX, NuLink-XS, and NuLink-XD", "Longer electrical reach and roadmap to higher rates", "Roadmap maturity and interoperability remain unclear"]
      - ["Extend AI scale-up links across racks", "Copper reach and power become limiting", "Nexus and Oscar with parallel microVCSEL optics", "Approximately 50-meter initial target", "Target is not a measured deployment result"]
      - ["Maintain an optical link through lane degradation", "One failed lane can interrupt processing", "Telemetry, FEC monitoring, and spare-lane repair", "Traffic redirection without interruption is claimed", "No public field-failure or stress-test data"]
    notes: Benefits preserve the issuers' stated scope and are not customer outcomes; each limitation identifies evidence not established by the retained sources.
    claimRefs: [CE002, CE003, CE004, CE005, CE008, CE010, CE015]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or component, Role, Dependency, Principal risk]
    rows:
      - ["Host electrical interface", "Presents 212G PAM4 links", "Host SerDes, auto-negotiation, and link training", "Compatibility and retiming errors"]
      - ["Nexus reverse gearbox", "Maps each host channel to four 53G NRZ channels", "TSMC 3nm implementation, FEC, and telemetry", "Power, signal integrity, and yield are not independently measured"]
      - ["Oscar electrical interface", "Drives microVCSELs and receives photodiode signals", "Optical-array, crosstalk, and thermal compatibility", "Vendor interoperability and heat margin"]
      - ["Parallel optical arrays", "Carry slow-and-wide NRZ lanes", "GaAs microVCSEL and photodiode supply and packaging", "Alignment, supply, lifetime, and manufacturing variation"]
      - ["Spare-lane and diagnostic controls", "Monitor links and reroute a degraded lane", "Spare capacity and correct degradation detection", "No public stress-test or field-failure evidence"]
      - ["Deployment form", "Packages the link as OSFP, NPO, XPO, or future CPO", "Customer architecture and manufacturing qualification", "Roadmap timing and customer engineering burden"]
    notes: The architecture is reconstructed from company-issued descriptions; dependencies and risks are analytical implications, not reported incidents.
    claimRefs: [CE006, CE007, CE008, CE009, CE010, CE011]
figures:
