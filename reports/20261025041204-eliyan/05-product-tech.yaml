  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: product-maturity
      missingEvidence: Customer qualification reports, completed shipment records, production volumes, design wins, and repeat orders by product line.
      whyItMatters: Sampling, silicon proof, and shipment expectations do not establish production readiness or durable adoption.
      diligencePath: Review customer qualification milestones, shipment and return records, design-win status, and repeat-order data under NDA.
      relatedQuestionRefs: [QE003, QE007]
      relatedTableRefs: [TE001]
    - type: missing-source
      severity: material
      topic: reliability-controls
      missingEvidence: Independent measurements of power, latency, reach, yield, crosstalk, thermal margin, lane-repair behavior, and field reliability.
      whyItMatters: System value depends on performance and availability under production operating conditions, not architecture claims alone.
      diligencePath: Obtain third-party lab reports, silicon characterization, qualification matrices, accelerated-life tests, and customer reference calls.
      relatedQuestionRefs: [QE006]
      relatedTableRefs: [TE002, TE003]
    - type: missing-source
      severity: material
      topic: trust-controls
      missingEvidence: Security threat model, vulnerability process, privacy scope, compliance certifications, quality-system audits, RMA history, and incident records.
      whyItMatters: Missing public evidence prevents assessment of security, compliance, supportability, and manufacturing-control readiness.
      diligencePath: Request security and quality documentation, certification records, supplier audits, incident logs, and customer support obligations.
      relatedQuestionRefs: [QE008]
    - type: missing-source
      severity: minor
      topic: ecosystem-adoption
      missingEvidence: A current public usage metric from developers, package designers, standards participants, or production customers.
      whyItMatters: Practitioner commentary is useful context but does not measure adoption, integration frequency, or ecosystem durability.
      diligencePath: Seek public reference designs, standards contributions, engineering talks, package-tool integrations, and measured community activity.
      relatedQuestionRefs: [QE009]
