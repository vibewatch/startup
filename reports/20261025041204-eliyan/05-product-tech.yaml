          detail: High-speed electrical entry point
          items: [Host ASIC, 212G PAM4 links, Host link training]
        - label: Electrical translation
          detail: Retiming and channel conversion
          items: [Nexus 1.6T reverse gearbox, "Four 53G NRZ lanes per host channel", FEC telemetry]
        - label: Optical electrical interface
          detail: Transmit and receive electronics
          items: [Oscar EIC, Laser drivers, TIA receivers]
        - label: Optical arrays
          detail: Parallel optical transport
          items: [microVCSEL array, Photodiode array, Spare optical lanes]
        - label: Reliability controls
          detail: Detection and continuity mechanisms
          items: [Diagnostics, Lane-degradation detection, On-the-fly lane repair]
        - label: Deployment forms
          detail: Product path from modules toward co-packaging
          items: [OSFP, NPO and XPO, Future CPO path]
    approximationNotes: Layer order is an analytical presentation of the announced interfaces; it is not a verified production topology, performance benchmark, or complete bill of materials.
    claimRefs: [CE007, CE009, CE010]
