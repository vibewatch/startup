company:
  name: Eliyan
chapter:
  number: 5
  title: Product & Technology
  summary: Eliyan now presents a portfolio spanning die-to-die PHY IP, memory and I/O chiplets, and the Nexus/Oscar optical interconnect pair. The architecture is specific enough to evaluate, but current public evidence supports sampling and roadmap status rather than independently verified production qualification, reliability, security, or customer deployment.
sections:
  - id: product-surface-and-maturity
    title: Product surface and maturity
    body: >-
      Eliyan's product surface has expanded from NuLink PHY technology into several
      physical forms and distance domains. Semiconductor Engineering describes
      NuLink as a protocol-agnostic die-to-die PHY with simultaneous bidirectional
      signaling. A January 2026 company release describes NuLink D2D, NuLink-X
      chip-to-chip connectivity, and NuGear chiplets as distinct product families.
      In October 2026, Eliyan added the NuLight platform: Nexus is described as a
      1.6T reverse gearbox, while Oscar is the electrical interface to microVCSEL and
      photodiode arrays.
      Syndicated company announcements say both chiplets were sampling on October 14,
      2026. Reuters separately reported management's expectation that initial chiplet
      shipments would begin in 2026, but neither statement establishes completed
      qualification, production volume, repeat orders, or field performance.
    claimRefs: [CE001, CE002, CE003, CE004, CE006, CE012, CE013, CE014]
    tableRefs: [TE001]
  - id: architecture-and-operating-model
    title: Architecture and operating model
    body: >-
      NuLight is described as a bridge from high-speed host electrical links to a
      slow-and-wide optical array. Nexus converts each 212G PAM4 host channel into
      four 53G NRZ channels and adds retiming, forward-error-correction monitoring,
      auto-negotiation, and host link training. Oscar supplies laser-driver and
      transimpedance-amplifier interfaces for the transmit and receive arrays.
      Eliyan says spare optical lanes can take over when an active lane degrades,
      while the overall microVCSEL design targets about 50 meters of reach. This
      architecture is modular rather than turnkey: host SerDes behavior, substrate,
      optical-array compatibility, thermals, packaging, and manufacturing
      qualification remain customer-system dependencies. The six-layer map below
      represents those stated relationships, not a verified bill of materials or a
      production reference design.
    claimRefs: [CE006, CE007, CE008, CE009, CE010, CE011]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: workflow-and-differentiation
    title: Workflow and differentiation
    body: >-
      The common product thesis is to move data between compute and memory without
      forcing every design into the same advanced-package topology. Semiconductor
      Engineering independently confirms that Eliyan targets both advanced packaging
      and standard organic substrates. Chipstrat offers a practitioner-oriented but
      still claim-dependent explanation of the proposed advantage: interposer-class
      performance on organic substrates. MarketScale identifies a named hyperscaler
      procurement disclosure as the next meaningful validation signal rather than
      treating financing as contracted demand. A 2026 Electronic Design article explains the adjacent
      SPHBM4 design space, but its author is an Eliyan executive and must likewise be
      treated as company-issued technical material. The differentiated idea is
      coherent; independent, comparable measurements of power, latency, bandwidth
      density, yield, and system cost are still missing.
    claimRefs: [CE003, CE004, CE005, CE015, CE016]
    tableRefs: [TE002]
  - id: deployment-reliability-and-trust
    title: Deployment, reliability, and trust
    body: >-
      Publicly described controls focus on link availability rather than the full
      trust and quality stack. Eliyan identifies FEC telemetry, diagnostics, host link
      training, heat-management techniques, crosstalk cancellation, and on-the-fly
      lane repair. Those are relevant design controls, but the assigned evidence does
      not report qualification standards, measured failure rates, RMA history,
      security architecture, vulnerability handling, privacy scope, compliance
      certifications, or customer support commitments. This is an evidence gap, not
      proof that controls or incidents are absent. Diligence should therefore test
      whether sampling devices have passed customer and supplier qualification,
      whether the spare-lane mechanism works under realistic degradation, and whether
      manufacturing and optical-component dependencies can support repeatable volume.
      Product readiness should remain provisional until those records and independent
      deployment references are available.
    claimRefs: [CE009, CE010, CE012, CE013, CE016]
callouts:
  - calloutType: strength
    title: One portfolio spans package to rack
    body: Eliyan's stated portfolio covers on-package PHY links, memory bridging, board-level connectivity, and a modular optical path, giving customers several possible integration points rather than one fixed system.
    claimRefs: [CE001, CE003, CE004, CE006, CE011]
  - calloutType: risk
    title: Sampling is not production proof
    body: Nexus and Oscar were announced as sampling, while management expected initial chiplet shipments in 2026; public evidence does not yet establish qualification, field reliability, repeat orders, or production scale.
    claimRefs: [CE012, CE013, CE016]
