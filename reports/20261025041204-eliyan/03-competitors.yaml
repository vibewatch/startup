    columns: [Competitor or alternative, Category, Target customer or use, Observable capability or position, Limitation or unknown]
    rows:
      - [Blue Cheetah, Specialist die-to-die PHY, Chiplet designers, Customizable die-to-die PHY and link-layer IP including UCIe and BoW, Relative pricing and production scale not disclosed]
      - [Alphawave Semi, Specialist connectivity IP, AI and HPC chip designers, I/O and memory disaggregation support in customer design flows, Comparable Eliyan benchmark and realized pricing unavailable]
      - [Arteris, Interconnect and NoC IP, Complex multi-die system designers, Top-down and bottom-up integration approaches for chiplet systems, Not a like-for-like PHY substitute in every deployment]
      - [Ayar Labs, Optical interconnect, AI data-center operators and system builders, Co-packaged optical I/O for scale-up connectivity, Optical qualification and economics differ from electrical PHY]
      - [Lightmatter, Optical interconnect, AI data centers, Photonic interconnect and related infrastructure, Optical-first architecture may not fit every package]
      - [Chipletz, Packaging and smart substrate, System companies needing heterogeneous integration, Smart Substrate packaging for multi-chip integration, Packaging partner or alternative rather than equivalent PHY IP]
      - [Broadcom and Marvell, Incumbent networking and connectivity, Custom AI-chip builders and cloud operators, Existing networking technology and customer relationships, Bundling and internal roadmap control can disadvantage an independent vendor]
      - [Nvidia, Integrated incumbent, AI accelerator buyers, Connectivity capability reinforced by Mellanox ownership, External licensing alternative is not clearly comparable]
      - [Advanced packaging such as CoWoS or EMIB, Packaging substitute, High-end AI and HPC system designers, High-density interconnect without buying Eliyan PHY IP, "Capacity, cost, yield and lead-time constraints remain material"]
      - [Internal build, Status quo or build, Large semiconductor companies, Proprietary PHY and chiplet integration controlled in-house, Engineering cost and verification burden are unknown]
    notes: >-
      This is an evidence-constrained landscape, not an exhaustive market
      census. Named capabilities are drawn from the retained source text;
      absence of a value or direct equivalence means public evidence was not
      available in this pool.
    claimRefs: [CP001, CP002, CP003, CP010, CP011]
