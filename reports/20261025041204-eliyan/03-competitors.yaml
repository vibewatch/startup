      - [UCIe or BoW compatibility, "Official page reports UCIe and BoW support", "Blue Cheetah and Arteris ecosystem references support interoperability work", "UCIe participation is ecosystem-wide", "UCIe can also be implemented in broader architectures", Supported with qualifications]
      - [Simultaneous bidirectional signaling, "Official page reports SBD", "Peer parity not established", "Not established", "Not established", Company-claimed only]
      - [Chip-to-chip reach, "NuLink-XS reports up to 100 mm in the retained product table", "Peer comparable values unavailable", "SerDes and networking links are alternatives", "Optical links target longer reach", Partially supported]
      - [Bandwidth density, "Official product table reports separate beachfront and area metrics", "Comparable normalized data unavailable", "Comparable normalized data unavailable", "Optical density may differ by architecture", Partially supported]
      - [Memory connectivity, "NuGear and UMI are described", "Comparable product scope varies", "Incumbent solution scope not established", "HBM and packaging alternatives remain relevant", Partially supported]
      - [Customer integration support, "Hiring material describes direct customer engagement", "Industry sources describe customer design support", "Incumbents have established relationships", "Packaging and optical vendors may co-design", Supported directionally]
      - [Interoperability proof, "UCIe alignment is stated", "UCIe consortium demonstrations provide ecosystem evidence", "Cross-vendor proof varies", "UCIe demonstrations are broader than Eliyan-specific proof", Gap]
      - [Production scale, "Initial shipments and volumes are not independently established in this pool", "Peer production volumes unavailable", "Incumbent scale is a structural advantage", "Optical and packaging scale unavailable", Gap]
      - [Pricing and realized economics, "No public list or realized pricing retained", "No comparable public pricing retained", "Bundled pricing likely varies by account", "Total package economics are architecture-specific", Gap]
    notes: >-
      Cells distinguish company-reported capability from comparative evidence.
      Unknown and gap cells are intentionally preserved because no retained
      source supplies a defensible like-for-like comparison.
    claimRefs: [CP005, CP006, CP007, CP008, CP009, CP015]
  - id: TP003
    title: Pricing, packaging and switching comparison
    columns: [Alternative, Commercial model or cost basis, Included capability, Switching or lock-in factor, Competitive implication]
    rows:
      - [Eliyan NuLink IP, Licensing model described but price not disclosed, Die-to-die, die-to-memory and chip-to-chip PHY options; customer design integration, Potentially attractive if system savings exceed integration cost]
      - [Eliyan NuGear chiplets, Chiplet product model described but price not disclosed, Memory and I/O chiplet connectivity, Package and ASIC co-design dependencies, Expands scope beyond pure IP but adds supply obligations]
      - [Specialist PHY vendor, IP licensing, PHY and link-layer functions vary by vendor, Verification and interoperability dependencies, Direct technical substitute]
      - [Broadcom or Marvell, Incumbent networking supply or co-development, Networking technology integrated into custom AI systems, Existing customer and platform relationships, Distribution and bundling power]
      - [Nvidia integrated route, Integrated system and connectivity stack, Accelerator plus acquired networking capability, Proprietary platform lock-in, Raises bar for independent suppliers]
      - [Advanced packaging, Packaging and manufacturing spend, Dense die integration, "Capacity, yield, lead-time and supplier dependence", Substitute for some Eliyan value proposition]
      - [Optical interconnect, Product or component ecosystem, Longer-reach connectivity and rack-scale bandwidth, New qualification and thermal/control dependencies, Longer-term displacement or adjacency risk]
      - [Internal build, Engineering and manufacturing program budget, Full control of interface and roadmap, "High talent, verification and schedule burden", Viable mainly for scaled semiconductor companies]
      - [UCIe ecosystem implementation, Standard-aligned integration, Interoperable die-to-die foundation, Standardization can reduce differentiation, Tailwind and commoditization risk]
      - [Status quo monolithic or limited multi-die design, Existing product architecture, Avoids new integration work, Performance and scaling ceiling, Slow adoption substitute]
    notes: >-
      Public retained evidence does not disclose Eliyan or peer license prices,
      discounts, contract terms, customer switching costs or realized gross
      savings. The comparison therefore focuses on observable cost drivers and
      commercial implications rather than invented price points.
    claimRefs: [CP008, CP009, CP010, CP013, CP015, CP016]
