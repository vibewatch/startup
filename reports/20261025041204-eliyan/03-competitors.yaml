company:
  name: Eliyan
chapter:
  number: 3
  title: Competitors
  summary: Eliyan competes in a crowded chiplet-connectivity stack where proprietary PHY performance, open standards, packaging economics, and ecosystem access matter together. Its standard-substrate positioning is differentiated, but UCIe adoption, incumbent networking suppliers, optical interconnect vendors, and packaging alternatives create credible displacement paths.
sections:
  - id: landscape
    title: Competitive landscape and buyer alternatives
    body: >-
      Eliyan sits between several buying alternatives rather than facing one
      homogeneous peer set. Its NuLink family addresses die-to-die PHY and
      die-to-memory connectivity, while NuLink-XS extends to separately
      packaged devices and the company also offers NuGear chiplets. The closest
      specialist peers include Blue Cheetah, Alphawave Semi, Arteris and
      Kandou-type interconnect providers; the broader ecosystem also includes
      packaging specialists such as Chipletz and optical interconnect vendors
      such as Ayar Labs, Celestial AI and Lightmatter. Large semiconductor and
      networking companies, including Broadcom, Marvell, Intel and Nvidia, can
      supply or internalize portions of the same system function. A customer can
      therefore buy third-party PHY IP, use an incumbent networking stack,
      adopt an optical architecture, rely on advanced packaging, or keep the
      design in-house. This is a strategic market, not a simple feature race:
      standards, verification, packaging availability, customer qualification
      and supply-chain execution can be as decisive as peak bandwidth.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]
  - id: differentiation
    title: Differentiation, capability and distribution
    body: >-
      Eliyan's principal differentiation is the attempt to deliver
      interposer-like connectivity on standard organic substrates while
      remaining compatible with UCIe and BoW. Its product page reports
      distinct data-lane, reach and bandwidth-density configurations across
      standard-package, advanced-package and chip-to-chip products; the
      reported numbers are company specifications rather than independent
      benchmarks. Industry coverage supports the importance of the problem:
      chiplet adopters must reconcile interoperability, verification and
      multi-vendor integration, and buyers want high bandwidth at low power.
      Eliyan's own hiring material shows that its go-to-market depends on
      direct customer integration, external IP vendors and OSAT or packaging
      partners. This can create a credible technical wedge, but it also means
      that adoption requires design-win proof, production qualification and a
      sufficiently broad integration ecosystem. No public source in this pool
      provides comparable realized pricing, customer volumes or a complete
      feature benchmark across all named competitors, so unsupported cells
      remain unknown.
    claimRefs: [CP005, CP006, CP007, CP008, CP009]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: durability
    title: Moat durability and displacement risk
    body: >-
      The moat case rests on specialized PHY know-how, standards fluency,
      silicon and packaging integration experience, and the ability to make
      standard substrates work at demanding system speeds. Those assets may
      compound through customer qualification and design-flow integration, but
      the same market is standardizing rapidly. UCIe reporting describes
      cross-vendor interoperability demonstrations and a growing consortium,
      while industry analysis describes a shift from proprietary PHYs toward
      third-party chiplets and identifies Blue Cheetah, Alphawave and Arteris
      in the surrounding design stack. EE Times also reports acquisition
      activity and continuing challenges in testing, reliability and security.
      These trends create both tailwinds and risks: an open ecosystem expands
      Eliyan's addressable market, but it can make the underlying interface
      more substitutable and give larger vendors leverage. Reuters reports
      that customers can alternatively work with Broadcom and Marvell, while
      Nvidia addressed connectivity partly through its Mellanox acquisition.
      Eliyan's near-term durability test is therefore not the existence of a
      technical claim; it is repeatable production adoption against incumbent,
      open-standard and optical routes.
    claimRefs: [CP010, CP011, CP012, CP013, CP014]
    tableRefs: [TP003]
  - id: diligence
    title: Competitive diligence verdict
    body: >-
      Eliyan appears differentiated enough to merit continued tracking, but
      public evidence does not yet establish a durable commercial moat over
      incumbent networking suppliers, specialist PHY vendors, advanced
      packaging or optical alternatives. The most decision-relevant unknowns
      are realized price and margin by product, named production customers,
      design-win conversion, qualification time, interoperability results
      outside demonstrations, and the share of value captured by Eliyan
      versus packaging and system partners. The available hiring evidence
      indicates a complex execution path spanning silicon, packaging, software,
      customers and external vendors. A buyer would likely compare total
      system cost, power, bandwidth density, reach, yield, lead time, support
      obligations and roadmap control rather than license price alone. Until
      those comparisons are disclosed, the standard-substrate thesis is
      promising but remains exposed to incumbent bundling, standards
      commoditization and optical displacement.
    claimRefs: [CP015, CP016]
    tableRefs: []
