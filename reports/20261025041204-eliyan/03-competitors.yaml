      yAxis: Package-to-rack integration scope
    claimRefs: [CP002, CP003, CP010, CP011, CP013]
callouts:
  - calloutType: insight
    title: Differentiation is real but not yet durable
    body: Eliyan's standard-substrate and multi-form-factor positioning is differentiated in the retained evidence, but public proof of repeat production adoption, pricing power and comparative performance remains incomplete.
    claimRefs: [CP005, CP008, CP015]
  - calloutType: risk
    title: Incumbent and standards risk
    body: UCIe expands the addressable ecosystem while potentially reducing interface-level differentiation, and Broadcom, Marvell and Nvidia can combine connectivity with stronger distribution or platform control.
    claimRefs: [CP010, CP011, CP013]
  - calloutType: recommendation
    title: Underwrite design wins, not only PHY claims
    body: The next diligence step should test named production customers, qualification milestones, realized system economics and repeat shipments against specialist, incumbent, optical and packaging alternatives.
    claimRefs: [CP015, CP016]
