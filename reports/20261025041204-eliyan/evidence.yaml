evidenceGaps:
  - type: missing-source
    severity: material
    topic: operating-scale
    missingEvidence: A current employee roster or independently verified headcount and complete office footprint.
    whyItMatters: >-
      Team scale and geographic expansion affect burn, execution capacity, and the interpretation of a hardware
      company’s commercialization stage.
    diligencePath: Request a dated HR roster by function and location, then reconcile it to payroll records and legal entities.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
      - TO002
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: The current board roster, voting agreements, preference stack, founder ownership, and reserved matters.
    whyItMatters: >-
      The July round added an investor director, but public evidence does not establish control, dilution, or succession
      resilience.
    diligencePath: >-
      Review the post-Series C capitalization table, charter, investor-rights agreement, voting agreement, and board
      minutes.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: customers
    missingEvidence: Named production customers, design-win status, purchase orders, shipment records, and repeat deployment evidence.
    whyItMatters: >-
      Strategic investment and anonymous evaluations do not demonstrate recurring production demand or revenue
      conversion.
    diligencePath: >-
      Obtain a customer-level pipeline and shipment cohort, then confirm material design wins directly with customer
      references.
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: material
    topic: financial-scale
    missingEvidence: Audited revenue, revenue mix, gross margin, cash balance, operating burn, debt, and runway.
    whyItMatters: >-
      Funding raised is not cash available, and a management sales forecast cannot establish current economics or
      financing risk.
    diligencePath: >-
      Review monthly financial statements, bank balances, debt schedules, bookings-to-revenue bridges, and the operating
      plan.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: Customer-level design wins, paid evaluations, production shipments, pricing and revenue by IP versus chiplets.
    whyItMatters: >-
      Without conversion and monetization data, the broad market estimates cannot be translated into Eliyan's SAM, SOM
      or valuation support.
    diligencePath: >-
      Request a customer- and program-level pipeline schedule with stage, qualification status, expected shipment date,
      contract value and realized revenue.
    relatedQuestionRefs:
      - QM003
      - QM007
      - QM010
  - type: missing-source
    severity: material
    topic: buyer
    missingEvidence: Public evidence on budget ownership, procurement cycle length and qualification gates at named external customers.
    whyItMatters: These variables determine adoption timing, sales efficiency and working-capital needs.
    diligencePath: >-
      Obtain anonymized customer references or diligence calls with a hyperscaler, accelerator designer, packaging
      partner and memory supplier.
    relatedQuestionRefs:
      - QM004
      - QM007
  - type: conflicting-data
    severity: minor
    topic: market-size
    missingEvidence: >-
      A reconciled market model that maps the chiplet-interconnect estimate to the broader advanced-packaging and HBM
      lenses.
    whyItMatters: Mixing ecosystem spend with addressable IP and chiplet revenue would overstate Eliyan's serviceable market.
    diligencePath: >-
      Reconcile category definitions, geography, currency, forecast vintage and included value-chain layers in a
      bottoms-up model.
    relatedQuestionRefs:
      - QM002
      - QM009
  - type: enumeration-incomplete
    severity: minor
    topic: segment-buyer-map
    missingEvidence: Named customer segments and payer budgets for each deployment stage.
    whyItMatters: The public map establishes roles but not the relative spend or conversion probability of each segment.
    diligencePath: Build a reference-backed account map from CRM exports, design-win documentation and procurement records.
    relatedQuestionRefs:
      - QM004
      - QM010
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Comparable Eliyan and peer license prices, discounts, contract duration and realized system-level economics.
    whyItMatters: >-
      Without price and savings evidence, the standard-substrate value proposition cannot be converted into customer ROI
      or margin durability.
    diligencePath: >-
      Obtain anonymized contracts, customer ROI cases and a competitor quote set for equivalent PHY, packaging and
      optical configurations.
    relatedQuestionRefs:
      - QP004
      - QP005
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: commercial-proof
    missingEvidence: >-
      Named production customers, design-win counts, qualification milestones, shipment volumes and repeat-order
      evidence.
    whyItMatters: >-
      Technical differentiation may not translate into durable adoption or bargaining power against incumbents and
      internal builds.
    diligencePath: >-
      Request a customer pipeline by stage, production references under NDA and shipment or royalty history reconciled
      to product families.
    relatedQuestionRefs:
      - QP005
      - QP008
    relatedTableRefs:
      - TP002
      - TP003
  - type: missing-source
    severity: material
    topic: interoperability
    missingEvidence: >-
      Independent Eliyan-specific interoperability, power, latency, yield and reliability results against named peer
      implementations.
    whyItMatters: >-
      UCIe ecosystem momentum can help adoption while also narrowing differentiation; buyer confidence depends on
      measured system behavior.
    diligencePath: >-
      Review third-party lab reports, interoperability test results and production qualification data for each supported
      package and protocol.
    relatedQuestionRefs:
      - QP003
      - QP006
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Audited or management financial statements with cash, monthly burn, gross margin, debt, working capital, and
      runway.
    whyItMatters: >-
      The latest financing amount cannot be converted into a runway or solvency judgment without cash usage and
      obligation data.
    diligencePath: >-
      Request the latest balance sheet, income statement, cash-flow statement, debt schedule, and a monthly cash
      forecast from management.
    relatedQuestionRefs:
      - QI006
      - QI008
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Customer-level contracts, design-win stages, shipments, acceptance records, pricing, and recognized revenue by
      product.
    whyItMatters: The valuation depends on converting qualification activity into recurring or repeatable commercial volume.
    diligencePath: >-
      Review the top customer and program pipeline under NDA, including contract terms, shipment milestones, renewal or
      royalty mechanics, and concentration.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI003
      - QI004
      - QI007
  - type: conflicting-data
    severity: minor
    topic: funding-definition
    missingEvidence: >-
      A reconciled capitalization table explaining why public funding totals and round classifications differ across
      databases.
    whyItMatters: >-
      Funding raised, valuation, and transaction-recorded amounts use different definitions and should not be treated as
      interchangeable.
    diligencePath: >-
      Obtain the company-approved financing chronology and reconcile it to financing documents and post-money
      definitions.
    relatedQuestionRefs:
      - QI005
  - type: private-evidence-only
    severity: material
    topic: product-maturity
    missingEvidence: >-
      Customer qualification reports, completed shipment records, production volumes, design wins, and repeat orders by
      product line.
    whyItMatters: Sampling, silicon proof, and shipment expectations do not establish production readiness or durable adoption.
    diligencePath: >-
      Review customer qualification milestones, shipment and return records, design-win status, and repeat-order data
      under NDA.
    relatedQuestionRefs:
      - QE003
      - QE007
    relatedTableRefs:
      - TE001
  - type: missing-source
    severity: material
    topic: reliability-controls
    missingEvidence: >-
      Independent measurements of power, latency, reach, yield, crosstalk, thermal margin, lane-repair behavior, and
