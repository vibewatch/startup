company:
  name: Eliyan
chapter:
  number: 7
  title: Risks
  summary: Eliyan's principal risks are commercialization and execution risk as it moves from chiplet PHY development toward shipments and optical connectivity, plus ecosystem, financing, and dependency exposure. Public evidence confirms the technology thesis and financing, but does not establish production volumes, named customers, revenue quality, reliability performance, or a complete legal and operational control environment.
sections:
  - id: commercial-execution
    title: Commercialization and execution exposure
    body: >-
      Eliyan is attempting a demanding transition from semiconductor IP development to repeatable product commercialization. Its public technical description emphasizes high bandwidth, low latency, and power efficiency, while third-party coverage describes initial chiplet shipments as an upcoming milestone rather than an established production base. The visible financing is substantial, but funding is not revenue or cash available for the operating plan. The principal execution risk is therefore not whether the problem exists; it is whether Eliyan can qualify, ship, support, and scale products across customer designs before the market and standards landscape move again. Public sources do not name production customers, provide shipment volumes, or disclose revenue quality and margin, so the investment case remains exposed to a design-win-to-volume conversion gap. A diligence process should require a customer-qualified shipment schedule, design-win funnel by stage, silicon-yield data, support commitments, and a bridge from cash resources to the next commercial milestone.
    claimRefs: [CR001, CR002, CR003, CR004, CR013]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: regulatory-technology
    title: Regulatory, technology, and quality risk
    body: >-
      No assigned source establishes a current Eliyan enforcement action, lawsuit, safety incident, or security breach; that absence is not evidence that none exists. The more visible risk is systemic to chiplet commercialization: independent industry analysis identifies unresolved challenges in reliability, testing, security, known-good-die qualification, and responsibility across a multi-vendor system. Eliyan's own page supports a broad standards and packaging strategy, but it does not provide third-party qualification results or a complete compliance control set. The company therefore needs to demonstrate that its claimed performance survives process corners, package variation, interoperability testing, field reliability, and customer security review. Legal and regulatory diligence should also test IP ownership, standards licensing, export-control exposure, product-liability allocation, and incident-response obligations across suppliers and customers. Until that evidence is supplied, mitigation maturity is best treated as developing rather than proven.
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
  - id: dependencies-and-thesis-breaks
    title: Partner, financing, and thesis-break conditions
    body: >-
      Eliyan's financing syndicate includes semiconductor and networking strategics, which can improve access to design ecosystems but can also create dependency and alignment risk. Public databases list many investors and a large Series C, yet the full shareholder register, profitability, customer concentration, and runway are not public. A strategic investor can be a channel, design partner, or future competitor; the relationship should not be treated as contracted demand without documentation. The broader chiplet market is also consolidating, with independent coverage describing acquisitions and a hybrid future of proprietary and open approaches. Eliyan's founder-authored demand thesis argues that efficiency gains will expand AI hardware demand, but that is company-issued analysis rather than independent validation. The thesis should break if shipment milestones slip materially, verified customer qualification fails, measured reliability or power claims miss specification, strategic partners do not convert to paid deployments, or new capital is required before operating proof improves.
    claimRefs: [CR009, CR010, CR011, CR012, CR013]
    tableRefs: [TR003]
