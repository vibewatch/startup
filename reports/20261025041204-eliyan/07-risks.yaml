    notes: "Public sources describe planned shipments and undisclosed revenue/customer metrics; residual exposure is an analytical risk assessment, not a disclosed company probability."
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR013]
  - id: TR002
    title: Regulatory / legal risk register
    columns: [Risk, Likelihood, Severity, Mitigation maturity, Residual exposure, Diligence path]
    rows:
      - [Reliability and testing across multi-vendor chiplets, high, high, developing, high, "Review qualification plans, corner data, known-good-die controls, RAS evidence, and field-return assumptions."]
      - [Security and root-of-trust allocation, medium, high, developing, medium-high, "Review threat model, secure-design controls, vulnerability disclosure, and customer security attestations."]
      - ["IP, standards, and interoperability disputes", medium, high, unknown, medium-high, "Complete freedom-to-operate, license, patent, UCIe/BoW, and interoperability diligence."]
      - ["Export, product-liability, and incident obligations", medium, high, unknown, medium-high, "Map jurisdictions, end uses, supplier contracts, indemnities, and incident-response duties."]
    notes: "The assigned industry source identifies ecosystem-level reliability, testing, and security hurdles; no assigned source confirms a current Eliyan enforcement or litigation outcome."
    enumerationScope:
      coverage: partial
      basis: "Risk categories supported by Eliyan materials and independent chiplet ecosystem reporting, not a complete legal register."
    claimRefs: [CR005, CR006, CR007, CR008]
  - id: TR003
    title: Partner and dependency risk register
    columns: [Dependency, Counterparty or role, Failure scenario, Likelihood, Severity, Mitigation and residual exposure]
    rows:
      - [Strategic capital and ecosystem access, "Cisco, Lumentum, AMD, Arm, Meta and other disclosed strategics", "Strategic participation does not convert to paid production demand or may create conflicts.", medium, high, "Obtain commercial agreements and conversion evidence; residual exposure remains high until disclosed."]
      - ["Foundry, packaging, and manufacturing chain", "Multi-vendor semiconductor ecosystem", "Capacity, yield, package, or test constraints delay customer qualification.", medium, high, "Review supply commitments, qualified vendors, yield, lead times, and dual-source options."]
      - [Standards and market structure, "UCIe/BoW and competing interconnect vendors", "Standard changes, consolidation, or a platform owner internalizes competing IP.", medium, high, "Track standards, interoperability results, competing roadmaps, and change-of-control protections."]
      - [Financing and runway, "Private capital providers", "Capital is consumed before repeatable revenue and another round is required on worse terms.", medium, high, "Obtain cash, burn, runway, covenants, preference stack, and financing plan."]
    notes: "Investor names and funding amounts are public database or reported data; counterparty roles, contracts, concentration, and runway are not fully disclosed."
    enumerationScope:
      coverage: partial
      basis: "Material partner and dependency categories identified in the assigned financing and chiplet ecosystem sources."
    claimRefs: [CR009, CR010, CR011, CR012]
