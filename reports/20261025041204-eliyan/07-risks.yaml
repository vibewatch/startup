        - {label: Security and interoperability, values: [2, 3, 2, 1]}
        - {label: Export and product liability, values: [2, 3, 2, 1]}
    approximationNotes: "Scores are analyst-assigned ordinal rankings from 1 low to 3 high, anchored to disclosed gaps and reported ecosystem hurdles; they are not company-provided probabilities."
    claimRefs: [CR003, CR005, CR009, CR012, CR013]
callouts:
  - calloutType: risk
    title: The key risk is proof conversion, not problem relevance
    body: Public evidence supports a real interconnect bottleneck and a technically differentiated architecture, but production qualification, customer conversion, reliability, and unit economics remain insufficiently disclosed to reduce residual execution risk.
    claimRefs: [CR001, CR002, CR003, CR006]
  - calloutType: assumption
    title: Absence of a recorded incident is not clearance
    body: The assigned pool does not establish a current Eliyan lawsuit, enforcement action, outage, or breach; those items remain diligence questions rather than negative findings.
    claimRefs: [CR007, CR008]
