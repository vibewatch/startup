            - PHY or chiplet selection
        - id: engage
          label: Design engagement
          detail: Eliyan offers licensed technology or chiplets for integration.
          touchpoints:
            - Architecture review
            - Internal skill-gap assessment
        - id: evaluate
          label: Evaluation
          detail: Company-attributed reporting describes evaluations across several infrastructure cohorts.
          touchpoints:
            - Validation
            - Interoperability and packaging work
        - id: design-in
          label: Design-in
          detail: No public named design win or customer-issued confirmation was found.
          touchpoints:
            - Qualification
            - Testing, reliability, and security review
        - id: ship
          label: Initial shipment
          detail: Management expected initial chiplet shipments during 2026.
          touchpoints:
            - Production release
            - Volume and recipient remain undisclosed
        - id: expand
          label: Expansion
          detail: Management forecasts a large 2027 sales ramp and broader optical connectivity.
          touchpoints:
            - Follow-on orders
            - Cross-product adoption remains unverified
