  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and demand
        blocks:
          - type: paragraph
            body: >-
              This chapter defines Eliyan's market as semiconductor connectivity content that moves data between dies,
              chips, memory and, increasingly, rack-scale optical fabrics. The included spend is PHY and
              controller/protocol IP, chiplets, SerDes and parallel signaling, optical links, interposers, embedded
              bridges, package-routing and package-validation work that is required to deploy heterogeneous AI and
              high-performance-computing systems. It excludes the full value of AI accelerators, standalone HBM memory,
              general cloud networking, and generic OSAT revenue except where those categories directly purchase or
              constrain interconnect content. Semiconductor Engineering describes the underlying demand as a widening
              gap between processor performance and bandwidth/memory, while the company frames the system problem across
              compute, memory and networking. The practical substitute is a monolithic or internally proprietary die and
              fabric; that can reduce interoperability work but leaves leading-edge node economics, bandwidth density
              and power constraints unresolved.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
      - number: '2.2'
        title: Sizing lenses and commercial scope
        blocks:
          - type: paragraph
            body: >-
              Public estimates are not interchangeable: they use different boundaries, vintages and methodologies.
              Global Market Insights estimates the chiplet interconnect market at $2.17 billion in 2025, $2.89 billion
              in 2026 and $41.2 billion in 2035, a 34.4% 2026–2035 CAGR, and explicitly includes electrical and optical
              die-to-die links, PHY and controller IP and enabling package hardware. PatSnap presents a broader adjacent
              ecosystem lens, putting advanced packaging at $49–55 billion in 2026 and HBM at $33 billion by 2027, but
              those figures are not Eliyan's serviceable market. The most defensible near-term SAM is therefore a subset
              of the chiplet-interconnect estimate: design programs that need reusable PHY, chiplets or optical
              interfaces and can qualify an external supplier. A numeric SOM cannot be isolated because public evidence
              does not disclose Eliyan's customer count, design-win conversion, pricing, shipment volume or revenue mix.
              The company says financing will support development, ecosystem partnerships and manufacturing scale; that
              is evidence of intended expansion, not proof of realized share.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
      - number: '2.3'
        title: Buyers, adoption path, and constraints
        blocks:
          - type: paragraph
            body: >-
              The buying center is a technical and capital-allocation chain rather than a single software buyer.
              Semiconductor and hyperscale system architects specify package and interface requirements; chip-design and
              physical-design teams integrate and sign off the IP; foundries, packaging partners and memory suppliers
              constrain manufacturability and supply; and data-center operators ultimately fund the system when
              bandwidth, latency, power and time-to-market justify the change. Eliyan's public positioning targets
              semiconductor, hyperscale, memory and optical-module customers, while its job material emphasizes
              physical-design signoff, packaging and manufacturing coordination. Demand drivers are AI data movement,
              heterogeneous integration, advanced-node cost optimization and open standards. Adoption is slowed by
              cross-PHY qualification, thermal and power-management requirements, package capacity and the need to prove
              production reliability. Marvell and Lumentum's optical-circuit-switch demonstration shows that larger
              incumbents are also developing rack-scale optical fabrics, so Eliyan must win on integration, power,
              performance, qualification speed or ecosystem access rather than on category creation alone.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM014
      - number: '2.4'
        title: Diligence implications
        blocks:
          - type: paragraph
            body: >-
              The market case is strategically credible but financially underdetermined. Eliyan's July 2026 company
              announcement reports a $145 million Series C at a $1 billion valuation and says the platform spans
              die-to-die, chip-to-chip and rack-to-rack connectivity; Reuters reports management's expectation of
              initial chiplet shipments in 2026 and a forecast of hundreds of millions of dollars in sales by the end of
              2027, up from low millions in 2025. Those figures are management expectations reported by Reuters, not
              audited operating proof. The key diligence path is to obtain named production or paid-evaluation
              customers, design-win-to-shipment conversion, pricing and gross-margin data by IP versus chiplets, package
              and foundry qualification status, and evidence that optical expansion creates incremental budget rather
              than cannibalizing the electrical core. Until that evidence exists, the market supports a large strategic
              opportunity but not a precise SOM or valuation conclusion.
            claimRefs:
              - CM016
              - CM008
              - CM009
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The market is real, but the investable slice is narrower than the headline TAM
            body: >-
              The strongest public market estimate includes package hardware and multiple interconnect categories;
              Eliyan's monetizable slice depends on external qualification and demonstrated conversion from design
              activity into shipments.
            calloutType: insight
            claimRefs:
              - CM005
              - CM007
              - CM008
          - type: callout
            title: Qualification and packaging can delay adoption
            body: >-
              Open standards enlarge the ecosystem, but cross-PHY interoperability has not been validated at scale in
              the assigned market source, while thermal management and package capacity remain system-level bottlenecks.
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Eliyan sits between several buying alternatives rather than facing one homogeneous peer set. Its NuLink
              family addresses die-to-die PHY and die-to-memory connectivity, while NuLink-XS extends to separately
              packaged devices and the company also offers NuGear chiplets. The closest specialist peers include Blue
              Cheetah, Alphawave Semi, Arteris and Kandou-type interconnect providers; the broader ecosystem also
              includes packaging specialists such as Chipletz and optical interconnect vendors such as Ayar Labs,
              Celestial AI and Lightmatter. Large semiconductor and networking companies, including Broadcom, Marvell,
              Intel and Nvidia, can supply or internalize portions of the same system function. A customer can therefore
              buy third-party PHY IP, use an incumbent networking stack, adopt an optical architecture, rely on advanced
              packaging, or keep the design in-house. This is a strategic market, not a simple feature race: standards,
              verification, packaging availability, customer qualification and supply-chain execution can be as decisive
              as peak bandwidth.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP010
              - CP011
      - number: '3.2'
        title: Differentiation, capability and distribution
        blocks:
          - type: paragraph
            body: >-
              Eliyan's principal differentiation is the attempt to deliver interposer-like connectivity on standard
              organic substrates while remaining compatible with UCIe and BoW. Its product page reports distinct
              data-lane, reach and bandwidth-density configurations across standard-package, advanced-package and
              chip-to-chip products; the reported numbers are company specifications rather than independent benchmarks.
              Industry coverage supports the importance of the problem: chiplet adopters must reconcile
              interoperability, verification and multi-vendor integration, and buyers want high bandwidth at low power.
              Eliyan's own hiring material shows that its go-to-market depends on direct customer integration, external
              IP vendors and OSAT or packaging partners. This can create a credible technical wedge, but it also means
              that adoption requires design-win proof, production qualification and a sufficiently broad integration
              ecosystem. No public source in this pool provides comparable realized pricing, customer volumes or a
              complete feature benchmark across all named competitors, so unsupported cells remain unknown.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP003
              - CP010
              - CP011
              - CP013
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The moat case rests on specialized PHY know-how, standards fluency, silicon and packaging integration
              experience, and the ability to make standard substrates work at demanding system speeds. Those assets may
              compound through customer qualification and design-flow integration, but the same market is standardizing
              rapidly. UCIe reporting describes cross-vendor interoperability demonstrations and a growing consortium,
              while industry analysis describes a shift from proprietary PHYs toward third-party chiplets and identifies
              Blue Cheetah, Alphawave and Arteris in the surrounding design stack. EE Times also reports acquisition
              activity and continuing challenges in testing, reliability and security. These trends create both
              tailwinds and risks: an open ecosystem expands Eliyan's addressable market, but it can make the underlying
              interface more substitutable and give larger vendors leverage. Reuters reports that customers can
              alternatively work with Broadcom and Marvell, while Nvidia addressed connectivity partly through its
              Mellanox acquisition. Eliyan's near-term durability test is therefore not the existence of a technical
              claim; it is repeatable production adoption against incumbent, open-standard and optical routes.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP013
              - CP015
              - CP016
      - number: '3.4'
        title: Competitive diligence verdict
        blocks:
          - type: paragraph
            body: >-
              Eliyan appears differentiated enough to merit continued tracking, but public evidence does not yet
              establish a durable commercial moat over incumbent networking suppliers, specialist PHY vendors, advanced
              packaging or optical alternatives. The most decision-relevant unknowns are realized price and margin by
              product, named production customers, design-win conversion, qualification time, interoperability results
              outside demonstrations, and the share of value captured by Eliyan versus packaging and system partners.
              The available hiring evidence indicates a complex execution path spanning silicon, packaging, software,
              customers and external vendors. A buyer would likely compare total system cost, power, bandwidth density,
              reach, yield, lead time, support obligations and roadmap control rather than license price alone. Until
              those comparisons are disclosed, the standard-substrate thesis is promising but remains exposed to
              incumbent bundling, standards commoditization and optical displacement.
            claimRefs:
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation is real but not yet durable
            body: >-
              Eliyan's standard-substrate and multi-form-factor positioning is differentiated in the retained evidence,
              but public proof of repeat production adoption, pricing power and comparative performance remains
              incomplete.
            calloutType: insight
            claimRefs:
              - CP005
              - CP008
              - CP015
          - type: callout
            title: Incumbent and standards risk
            body: >-
              UCIe expands the addressable ecosystem while potentially reducing interface-level differentiation, and
              Broadcom, Marvell and Nvidia can combine connectivity with stronger distribution or platform control.
            calloutType: risk
            claimRefs:
              - CP010
              - CP011
              - CP013
          - type: callout
            title: Underwrite design wins, not only PHY claims
            body: >-
              The next diligence step should test named production customers, qualification milestones, realized system
              economics and repeat shipments against specialist, incumbent, optical and packaging alternatives.
            calloutType: recommendation
            claimRefs:
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization is tied to customer chip cycles
        blocks:
          - type: paragraph
            body: >-
              Eliyan describes a business that licenses physical-layer interconnect IP and provides chiplets for
              semiconductor companies and systems builders, rather than manufacturing finished AI chips. Reuters reports
              that the company aims to license its technology and provide chiplets that custom-processor companies
              integrate into their designs. That mechanism can create sticky multi-year economics after a design win,
              but it also makes revenue dependent on customers' qualification, production schedules, and eventual system
              volume. The available record does not provide a list price, royalty rate, per-chip fee, contract minimum,
              backlog, or realized revenue by product. Eliyan's reported "low millions" of 2025 revenue and forecast of
              hundreds of millions by the end of 2027 are management disclosures reported by Reuters, not audited
              statements or an independent revenue forecast. Initial chiplet shipments were expected in 2026, so the
              evidence supports a commercialization transition rather than established scale.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI003
              - CI005
              - CI006
      - number: '4.2'
        title: Pricing, margin, and sales efficiency remain underwriting gaps
        blocks:
          - type: paragraph
            body: >-
              Public materials describe product families and technical performance, but they do not disclose realized
              pricing or the financial terms that turn NuLink PHY and NuGear deployments into revenue. Official January
              2026 materials say proceeds would accelerate manufacturing and qualification, ecosystem partnerships, and
              deployment, while the company describes multiple connectivity domains and bandwidth targets. Those
              disclosures show where commercial effort is being invested; they do not establish gross margin, unit cost,
              foundry or packaging pass-through, warranty exposure, inventory ownership, implementation cost,
              sales-cycle length, CAC, payback, or channel economics. A licensing model could support high incremental
              margins, but the chiplet and qualification components may add manufacturing, test, support, and
              working-capital requirements. These unknowns are material because the $1 billion valuation is being
              assessed against a forward commercialization plan, not a public earnings history.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI005
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI003
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.3'
        title: Capital supports expansion, but runway cannot be calculated
        blocks:
          - type: paragraph
            body: >-
              The July 2026 Series C was reported as $145 million at a $1 billion valuation, led by Seligman Ventures
              with Cisco Investments and Lumentum participating. Reuters says the financing followed a stated plan to
              begin initial chiplet shipments in 2026 and grow from low millions of 2025 revenue to hundreds of millions
              by the end of 2027. Eliyan's January 2026 announcement says its $50 million strategic round would support
              manufacturing and qualification, ecosystem partnerships, and deployment. ValueAddVC and Pomegra report
              roughly $295 million of announced funding, while GamesBeat reports that Eliyan had raised close to $250
              million. Forge presents a lower, transaction-recorded total and explicitly cautions that its
              private-company data are not independently verified. The discrepancy is a reminder to preserve source
              definitions rather than treat all funding totals as interchangeable. No source in the assigned pool
              reports cash on hand, operating burn, debt, runway, customer concentration, or a next-round trigger.
              Capital adequacy is therefore unproven even though the latest round increases liquidity relative to the
              prior public record.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: 'Financial verdict: strategic validation, limited operating proof'
        blocks:
          - type: paragraph
            body: >-
              Eliyan has credible strategic validation: its Series C included networking and optical companies, and its
              own prior announcement named AMD, Arm, Coherent, Meta, Samsung Catalyst Fund, and Intel Capital among
              strategic participants. That investor mix can reduce distribution and ecosystem risk, but it is not the
              same as contracted revenue, paid production volume, or independent customer corroboration. The valuation
              case consequently rests on future conversion of silicon-proven interconnect products, customer
              qualification, and the optical expansion into a much larger revenue base. The adverse financial case is
              straightforward: a $1 billion post-money price is difficult to underwrite from "low millions" of reported
              2025 revenue when the 2027 revenue target is only a management forecast, and the public record supplies no
              margin or cash bridge. Investment diligence should request customer-level contracts and design-win stages,
              royalty and chiplet pricing, shipment and acceptance data, gross-margin bridge, monthly cash burn, cash
              balance, debt terms, working-capital commitments, and concentration by customer and program before
              assigning a revenue multiple or runway.
            claimRefs:
              - CI002
              - CI003
              - CI009
              - CI012
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
