chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Eliyan was founded in 2021 and is headquartered in Santa Clara, California. Its business sits at the
              data-movement layer of AI infrastructure: Reuters describes a model that combines licensing interconnect
              technology with supplying chiplets that custom-processor developers can integrate into their designs.
              Semiconductor Engineering independently characterizes NuLink as die-to-die PHY technology for advanced
              packages or standard organic substrates. This makes Eliyan neither a general-purpose chip vendor nor a
              pure optical-component company; it is an interconnect IP and chiplet supplier spanning compute, memory,
              and networking links. The company is at Series C, while detailed commercial scale remains much less
              visible than its technical and financing profile.
            claimRefs:
              - CO001
              - CO002
              - CO003
