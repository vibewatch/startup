              - CE010
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE007
              - CE009
              - CE010
      - number: '5.3'
        title: Workflow and differentiation
        blocks:
          - type: paragraph
            body: >-
              The common product thesis is to move data between compute and memory without forcing every design into the
              same advanced-package topology. Semiconductor Engineering independently confirms that Eliyan targets both
              advanced packaging and standard organic substrates. Chipstrat offers a practitioner-oriented but still
              claim-dependent explanation of the proposed advantage: interposer-class performance on organic substrates.
              MarketScale identifies a named hyperscaler procurement disclosure as the next meaningful validation signal
              rather than treating financing as contracted demand. A 2026 Electronic Design article explains the
              adjacent SPHBM4 design space, but its author is an Eliyan executive and must likewise be treated as
              company-issued technical material. The differentiated idea is coherent; independent, comparable
              measurements of power, latency, bandwidth density, yield, and system cost are still missing.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE015
              - CE016
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE008
              - CE010
              - CE015
      - number: '5.4'
        title: Deployment, reliability, and trust
        blocks:
          - type: paragraph
            body: >-
              Publicly described controls focus on link availability rather than the full trust and quality stack.
              Eliyan identifies FEC telemetry, diagnostics, host link training, heat-management techniques, crosstalk
              cancellation, and on-the-fly lane repair. Those are relevant design controls, but the assigned evidence
              does not report qualification standards, measured failure rates, RMA history, security architecture,
              vulnerability handling, privacy scope, compliance certifications, or customer support commitments. This is
              an evidence gap, not proof that controls or incidents are absent. Diligence should therefore test whether
              sampling devices have passed customer and supplier qualification, whether the spare-lane mechanism works
              under realistic degradation, and whether manufacturing and optical-component dependencies can support
              repeatable volume. Product readiness should remain provisional until those records and independent
              deployment references are available.
            claimRefs:
              - CE009
              - CE010
              - CE012
              - CE013
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: One portfolio spans package to rack
            body: >-
              Eliyan's stated portfolio covers on-package PHY links, memory bridging, board-level connectivity, and a
              modular optical path, giving customers several possible integration points rather than one fixed system.
            calloutType: strength
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE006
              - CE011
          - type: callout
            title: Sampling is not production proof
            body: >-
              Nexus and Oscar were announced as sampling, while management expected initial chiplet shipments in 2026;
              public evidence does not yet establish qualification, field reliability, repeat orders, or production
              scale.
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying motion
        blocks:
          - type: paragraph
            body: >-
              Eliyan's apparent buyer universe is concentrated in technically sophisticated semiconductor and
              AI-infrastructure organizations rather than a broad base of end enterprises. Reuters describes the target
              as companies developing custom AI computing chips, while company-attributed reporting adds hyperscalers,
              AI accelerator developers, memory participants, and infrastructure providers. Eliyan can sell licensed PHY
              technology or chiplets for integration into a customer's own design, which makes the buying motion a
              design-in process rather than a conventional software purchase. Management also says an organization may
              become a customer when its internal team lacks bandwidth or specialized interconnect skills. Strategic
              investors such as Cisco and Lumentum demonstrate ecosystem alignment, but investment must not be treated
              as proof that either is a production customer.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
              - CU010
              - CU014
              - CU015
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
              - CU010
              - CU014
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU003
              - CU005
              - CU012
              - CU015
      - number: '6.2'
        title: Adoption trajectory is promising but mostly forward-looking
        blocks:
          - type: paragraph
            body: >-
              The clearest quantitative commercial disclosure comes from a July 2026 Reuters interview: management
              described 2025 revenue as being in the low millions, expected initial chiplet shipments during 2026, and
              forecast hundreds of millions of dollars in sales by the end of 2027. These are different metrics and
              periods, so the revenue disclosure, shipment milestone, and sales forecast should not be combined into a
              conversion rate or recurring-revenue proxy. The projected increase is substantial and therefore depends on
              design wins converting through qualification and production. Other coverage repeats that customers are
              evaluating or deploying the technology, but provides no account count, utilization denominator, shipment
              volume, or split between evaluation and production. The disclosed trajectory is therefore evidence of
              commercialization intent, not yet a durable adoption curve.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU008
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU010
      - number: '6.3'
        title: Named proof remains relationship evidence, not customer validation
        blocks:
          - type: paragraph
            body: >-
              The reviewed source set does not identify a production customer by name. Pomegra explicitly reports that
              no production customers have been named, while GamesBeat conveys management and investor assertions about
              commercial momentum, a marquee customer base, and twelve strategic investors. Those statements increase
              confidence that relevant ecosystem parties are engaged, but they do not establish deployment scope, paid
              production status, realized outcomes, or renewal behavior. Cisco and Lumentum are named as strategic
              investors; neither should be classified as a customer without a contract, deployment announcement, or
              customer-issued confirmation. The named-proof table therefore records the relationship actually evidenced
              and leaves customer status unverified instead of promoting logos or financing participants into customer
              references.
            claimRefs:
              - CU007
              - CU009
              - CU010
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU007
              - CU009
              - CU010
              - CU013
      - number: '6.4'
        title: Durability, expansion, and procurement risk
        blocks:
          - type: paragraph
            body: >-
              No reviewed source supplies net or gross retention, churn, renewals, contract length, customer
              concentration, or cohort expansion. That omission is material because semiconductor design wins can
              involve long qualification cycles and uneven shipment ramps, while the public 2027 sales forecast requires
              rapid conversion from today's limited disclosed revenue base. Independent industry analysis also describes
              unresolved chiplet-ecosystem hurdles in testing, reliability, and security; these can lengthen diligence
              and procurement even when product performance is attractive. MarketScale identifies a named hyperscaler
              procurement disclosure as the next signal that would distinguish contracted demand from forward
              speculation. Until Eliyan provides customer-level contracts, production volumes, renewal or follow-on
              orders, and revenue concentration, land-and-expand durability remains an open underwriting issue.
            claimRefs:
              - CU004
              - CU006
              - CU011
              - CU012
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial proof trails the forecast
            body: >-
              Management's 2027 sales ambition is not supported by disclosed backlog, production-customer names,
              retention metrics, or concentration data. A named, customer-issued production reference with repeat-order
              evidence would materially improve confidence in the ramp.
            calloutType: risk
            claimRefs:
              - CU006
              - CU007
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Commercialization and execution exposure
        blocks:
          - type: paragraph
            body: >-
              Eliyan is attempting a demanding transition from semiconductor IP development to repeatable product
              commercialization. Its public technical description emphasizes high bandwidth, low latency, and power
              efficiency, while third-party coverage describes initial chiplet shipments as an upcoming milestone rather
              than an established production base. The visible financing is substantial, but funding is not revenue or
              cash available for the operating plan. The principal execution risk is therefore not whether the problem
              exists; it is whether Eliyan can qualify, ship, support, and scale products across customer designs before
              the market and standards landscape move again. Public sources do not name production customers, provide
              shipment volumes, or disclose revenue quality and margin, so the investment case remains exposed to a
              design-win-to-volume conversion gap. A diligence process should require a customer-qualified shipment
              schedule, design-win funnel by stage, silicon-yield data, support commitments, and a bridge from cash
              resources to the next commercial milestone.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR005
              - CR009
              - CR012
              - CR013
      - number: '7.2'
        title: Regulatory, technology, and quality risk
        blocks:
          - type: paragraph
            body: >-
              No assigned source establishes a current Eliyan enforcement action, lawsuit, safety incident, or security
              breach; that absence is not evidence that none exists. The more visible risk is systemic to chiplet
              commercialization: independent industry analysis identifies unresolved challenges in reliability, testing,
              security, known-good-die qualification, and responsibility across a multi-vendor system. Eliyan's own page
              supports a broad standards and packaging strategy, but it does not provide third-party qualification
              results or a complete compliance control set. The company therefore needs to demonstrate that its claimed
              performance survives process corners, package variation, interoperability testing, field reliability, and
              customer security review. Legal and regulatory diligence should also test IP ownership, standards
              licensing, export-control exposure, product-liability allocation, and incident-response obligations across
              suppliers and customers. Until that evidence is supplied, mitigation maturity is best treated as
              developing rather than proven.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: Partner, financing, and thesis-break conditions
        blocks:
          - type: paragraph
            body: >-
              Eliyan's financing syndicate includes semiconductor and networking strategics, which can improve access to
              design ecosystems but can also create dependency and alignment risk. Public databases list many investors
              and a large Series C, yet the full shareholder register, profitability, customer concentration, and runway
              are not public. A strategic investor can be a channel, design partner, or future competitor; the
              relationship should not be treated as contracted demand without documentation. The broader chiplet market
              is also consolidating, with independent coverage describing acquisitions and a hybrid future of
              proprietary and open approaches. Eliyan's founder-authored demand thesis argues that efficiency gains will
              expand AI hardware demand, but that is company-issued analysis rather than independent validation. The
              thesis should break if shipment milestones slip materially, verified customer qualification fails,
              measured reliability or power claims miss specification, strategic partners do not convert to paid
              deployments, or new capital is required before operating proof improves.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The key risk is proof conversion, not problem relevance
            body: >-
              Public evidence supports a real interconnect bottleneck and a technically differentiated architecture, but
              production qualification, customer conversion, reliability, and unit economics remain insufficiently
              disclosed to reduce residual execution risk.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
          - type: callout
            title: Absence of a recorded incident is not clearance
            body: >-
              The assigned pool does not establish a current Eliyan lawsuit, enforcement action, outage, or breach;
              those items remain diligence questions rather than negative findings.
            calloutType: assumption
            claimRefs:
              - CR007
              - CR008
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Eliyan's July 29, 2026 Series C provides a current transaction reference: Reuters reported $145 million
              raised at a $1 billion valuation, and the company, Tracxn, and Multiples corroborate the round and mark.
              The new capital equals 14.5% of the disclosed post-money value as a simple arithmetic ratio, but that is
              not the same as actual ownership dilution; primary versus secondary proceeds, option-pool changes, and
              round-specific preferences are not public. Forge shows 1.0x liquidation preferences and 8.0% dividend
              rates for January 2026 preferred tranches, not the July round. Public reporting also relays management's
              trajectory from low-single-digit millions of 2025 revenue to hundreds of millions of sales by the end of
              2027. Because that forecast is neither ARR nor realized revenue, the visible price is more dependent on
              execution than on demonstrated scale. The present call is research-more, not buy: require a verified entry
              price, signed terms, revenue quality, gross margin, backlog, and customer-level production evidence before
              underwriting a return.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV009
              - CV014
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and commercialization proof
        blocks:
          - type: paragraph
            body: >-
              The thesis rests on strategic relevance rather than proven financial scale. Cisco Investments and Lumentum
              joined the latest round, extending a shareholder base aligned with compute, networking, memory, and
              optical infrastructure. Management expected initial chiplet shipments in 2026, creating a near-term
              milestone that can be tested against production records. The anti-thesis is that investors may be paying
              ahead of commercial proof. MarketScale identified named hyperscaler procurement as the signal needed to
              show contracted demand rather than forward speculation, while EE Times described unresolved reliability,
              testing, and security hurdles across the multi-vendor chiplet ecosystem. Strategic participation can
              improve access and technical validation, but it is not a customer contract, recognized revenue, or proof
              of repeat deployment. The view improves only if the company converts the reported shipment plan into paid
              production, repeat orders, acceptable yields, and margins that support the financing mark; it weakens if
              qualification slips or strategic investors do not convert into demand.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV014
      - number: '8.3'
        title: Scenarios, comparables, and exit readiness
        blocks:
          - type: paragraph
            body: >-
              Public references show opportunity but do not support a precise valuation range. Multiples reports Arteris
              at 9.0x LTM enterprise value to revenue, yet Eliyan lacks a comparable disclosed current revenue
              denominator. Unite.AI reports Ayar Labs at a $3.75 billion private valuation, while EE Times reports
              Qualcomm's $2.4 billion acquisition of Alphawave Semi; both are useful strategic reference points but
              differ in product mix, maturity, and transaction structure. EE Times also identifies interconnect
              specialists such as Eliyan as sought-after acquisition targets, supporting an M&A path, although Forge
              displays no price and labels current market activity low, so liquidity is not established. The bull, base,
              and bear cases are therefore directional rather than false-precision outputs. A defensible target return
              or hold period requires the actual security price, preference stack, dilution, revenue, margin, and exit
              assumptions. Thesis-break triggers include missing the stated shipment window, failed qualification, no
              repeat production adoption, or a financing below the last mark without a corresponding improvement in
              fundamentals.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive call
            body: >-
              Research-more with medium confidence: do not underwrite the $1 billion reference until current operating
              evidence and the economics of the offered security are verified.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV016
          - type: callout
            title: Thesis-break conditions
            body: >-
              Missed shipment timing, failed qualification, absent repeat production adoption, or a financing below the
              last mark without stronger fundamentals would materially weaken the case.
            calloutType: risk
            claimRefs:
              - CV007
              - CV009
              - CV016
