      - Scenario
      - Explicit assumptions
      - Valuation / return range
      - Probability signal
      - Downside or confirmation trigger
    rows:
      - - Bull
        - >-
          Initial shipments become repeat production deployments; revenue approaches management's 2027 ambition; margins
          support scaling
        - Above the $1B reference may be supportable, but public evidence cannot set an upper bound or target return
        - Possible only after customer and financial verification
        - Paid production wins, audited growth, durable margin, and no preference surprise
      - - Base
        - Qualification progresses but sales cycles and production conversion remain gradual
        - At or below the $1B reference; exact range and return remain unquantifiable
        - Most supportable while operating evidence is private
        - On-time shipments, growing backlog, and financing terms consistent with common equity value
      - - Bear
        - Qualification, reliability, supply, or adoption delays prevent forecast conversion
        - Materially below the $1B reference or a down round; downside magnitude is not publicly calculable
        - Material risk because the valuation depends on execution
        - Missed shipment milestone, failed qualification, or weak repeat demand
      - - Exit lens
        - Industry consolidation continues and Eliyan retains differentiated interconnect IP
        - Strategic M&A is plausible; Forge shows no current price and low activity
        - Optionality rather than an underwritten exit
        - Credible buyer interest, clean preferences, and transaction evidence
    notes: >-
      Scenario ranges are directional because no audited current revenue, margin, complete cap table, round terms, or
      entry security price is public; comp transactions are not treated as directly interchangeable valuations.
    claimRefs:
      - CV004
      - CV010
      - CV011
      - CV012
      - CV013
      - CV015
      - CV016
