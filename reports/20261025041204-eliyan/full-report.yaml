      - number: '1.2'
        title: Capitalization and visible scale
        blocks:
          - type: paragraph
            body: >-
              On July 29, 2026, Eliyan announced a $145 million Series C at a $1 billion valuation. Reuters, the
              company-issued release, Tracxn, MarketScale, and SiliconANGLE all support the core round terms. Tracxn and
              another company profile put cumulative funding near $295 million, although the underlying round count and
              earlier amounts do not reconcile cleanly across retained databases. Management told Reuters that 2025
              revenue was in the “low millions” and forecast hundreds of millions of dollars in sales by the end of
              2027. Those are management statements, not audited results, ARR, cash availability, or evidence of runway.
              Current customer count, current headcount, gross margin, burn, and liquidity therefore remain explicit
              gaps rather than inferred metrics.
