  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and maturity
        blocks:
          - type: paragraph
            body: >-
              Eliyan's product surface has expanded from NuLink PHY technology into several physical forms and distance
              domains. Semiconductor Engineering describes NuLink as a protocol-agnostic die-to-die PHY with
              simultaneous bidirectional signaling. A January 2026 company release describes NuLink D2D, NuLink-X
              chip-to-chip connectivity, and NuGear chiplets as distinct product families. In October 2026, Eliyan added
              the NuLight platform: Nexus is described as a 1.6T reverse gearbox, while Oscar is the electrical
              interface to microVCSEL and photodiode arrays. Syndicated company announcements say both chiplets were
              sampling on October 14, 2026. Reuters separately reported management's expectation that initial chiplet
              shipments would begin in 2026, but neither statement establishes completed qualification, production
              volume, repeat orders, or field performance.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE006
              - CE012
              - CE013
              - CE014
          - type: table
