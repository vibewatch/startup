      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              NuLight is described as a bridge from high-speed host electrical links to a slow-and-wide optical array.
              Nexus converts each 212G PAM4 host channel into four 53G NRZ channels and adds retiming,
              forward-error-correction monitoring, auto-negotiation, and host link training. Oscar supplies laser-driver
              and transimpedance-amplifier interfaces for the transmit and receive arrays. Eliyan says spare optical
              lanes can take over when an active lane degrades, while the overall microVCSEL design targets about 50
              meters of reach. This architecture is modular rather than turnkey: host SerDes behavior, substrate,
              optical-array compatibility, thermals, packaging, and manufacturing qualification remain customer-system
              dependencies. The six-layer map below represents those stated relationships, not a verified bill of
              materials or a production reference design.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
