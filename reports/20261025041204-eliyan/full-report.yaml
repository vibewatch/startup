            body: >-
              The retained evidence consistently identifies Ramin Farjadrad, Patrick Soheili, and Syrus Ziai as
              founders. Farjadrad remains chief executive and is the principal technical spokesperson, while Reuters
              identifies Soheili as chief strategy and business officer. Eliyan’s current team page also lists Alan
