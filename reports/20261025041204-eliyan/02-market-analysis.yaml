chapter:
  number: 2
  title: Market Analysis
  summary: Eliyan operates in a growing chiplet-interconnect layer spanning die-to-die electrical IP, chiplets, and an emerging optical extension. The opportunity is supported by AI package-density and heterogeneous-integration demand, but addressable spend remains constrained by interoperability qualification, thermal limits, advanced-packaging capacity, and the absence of public customer or revenue detail.
sections:
  - id: market-boundary
    title: Market boundary and demand
    body: >-
      This chapter defines Eliyan's market as semiconductor connectivity content
      that moves data between dies, chips, memory and, increasingly, rack-scale
      optical fabrics. The included spend is PHY and controller/protocol IP,
      chiplets, SerDes and parallel signaling, optical links, interposers,
      embedded bridges, package-routing and package-validation work that is
      required to deploy heterogeneous AI and high-performance-computing
      systems. It excludes the full value of AI accelerators, standalone HBM
      memory, general cloud networking, and generic OSAT revenue except where
      those categories directly purchase or constrain interconnect content.
      Semiconductor Engineering describes the underlying demand as a widening
      gap between processor performance and bandwidth/memory, while the company
      frames the system problem across compute, memory and networking. The
      practical substitute is a monolithic or internally proprietary die and
      fabric; that can reduce interoperability work but leaves leading-edge
      node economics, bandwidth density and power constraints unresolved.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and commercial scope
    body: >-
      Public estimates are not interchangeable: they use different boundaries,
      vintages and methodologies. Global Market Insights estimates the chiplet
      interconnect market at $2.17 billion in 2025, $2.89 billion in 2026 and
      $41.2 billion in 2035, a 34.4% 2026–2035 CAGR, and explicitly includes
      electrical and optical die-to-die links, PHY and controller IP and
      enabling package hardware. PatSnap presents a broader adjacent ecosystem
      lens, putting advanced packaging at $49–55 billion in 2026 and HBM at
      $33 billion by 2027, but those figures are not Eliyan's serviceable
      market. The most defensible near-term SAM is therefore a subset of the
      chiplet-interconnect estimate: design programs that need reusable PHY,
      chiplets or optical interfaces and can qualify an external supplier.
      A numeric SOM cannot be isolated because public evidence does not disclose
      Eliyan's customer count, design-win conversion, pricing, shipment volume
      or revenue mix. The company says financing will support development,
      ecosystem partnerships and manufacturing scale; that is evidence of
      intended expansion, not proof of realized share.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-constraints
    title: Buyers, adoption path, and constraints
    body: >-
      The buying center is a technical and capital-allocation chain rather than
      a single software buyer. Semiconductor and hyperscale system architects
      specify package and interface requirements; chip-design and physical-design
      teams integrate and sign off the IP; foundries, packaging partners and
      memory suppliers constrain manufacturability and supply; and data-center
      operators ultimately fund the system when bandwidth, latency, power and
      time-to-market justify the change. Eliyan's public positioning targets
      semiconductor, hyperscale, memory and optical-module customers, while its
      job material emphasizes physical-design signoff, packaging and
      manufacturing coordination. Demand drivers are AI data movement,
      heterogeneous integration, advanced-node cost optimization and open
      standards. Adoption is slowed by cross-PHY qualification, thermal and
      power-management requirements, package capacity and the need to prove
      production reliability. Marvell and Lumentum's optical-circuit-switch
      demonstration shows that larger incumbents are also developing
      rack-scale optical fabrics, so Eliyan must win on integration, power,
      performance, qualification speed or ecosystem access rather than on
      category creation alone.
    claimRefs: [CM010, CM011, CM012, CM013, CM014, CM015]
    tableRefs: [TM003]
  - id: diligence-implications
    title: Diligence implications
    body: >-
      The market case is strategically credible but financially underdetermined.
      Eliyan's July 2026 company announcement reports a $145 million Series C
      at a $1 billion valuation and says the platform spans die-to-die,
      chip-to-chip and rack-to-rack connectivity; Reuters reports management's
      expectation of initial chiplet shipments in 2026 and a forecast of
      hundreds of millions of dollars in sales by the end of 2027, up from low
      millions in 2025. Those figures are management expectations reported by
      Reuters, not audited operating proof. The key diligence path is to obtain named
      production or paid-evaluation customers, design-win-to-shipment
      conversion, pricing and gross-margin data by IP versus chiplets, package
      and foundry qualification status, and evidence that optical expansion
      creates incremental budget rather than cannibalizing the electrical core.
      Until that evidence exists, the market supports a large strategic
      opportunity but not a precise SOM or valuation conclusion.
    claimRefs: [CM016, CM008, CM009, CM015]
callouts:
  - calloutType: insight
    title: The market is real, but the investable slice is narrower than the headline TAM
    body: The strongest public market estimate includes package hardware and multiple interconnect categories; Eliyan's monetizable slice depends on external qualification and demonstrated conversion from design activity into shipments.
    claimRefs: [CM005, CM007, CM008]
  - calloutType: risk
    title: Qualification and packaging can delay adoption
    body: Open standards enlarge the ecosystem, but cross-PHY interoperability has not been validated at scale in the assigned market source, while thermal management and package capacity remain system-level bottlenecks.
    claimRefs: [CM012, CM013, CM014]
