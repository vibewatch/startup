  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: sizing-gap
      missingEvidence: Customer-level design wins, paid evaluations, production shipments, pricing and revenue by IP versus chiplets.
      whyItMatters: Without conversion and monetization data, the broad market estimates cannot be translated into Eliyan's SAM, SOM or valuation support.
      diligencePath: Request a customer- and program-level pipeline schedule with stage, qualification status, expected shipment date, contract value and realized revenue.
      relatedQuestionRefs: [QM003, QM007, QM010]
    - type: missing-source
      severity: material
      topic: buyer
      missingEvidence: Public evidence on budget ownership, procurement cycle length and qualification gates at named external customers.
      whyItMatters: These variables determine adoption timing, sales efficiency and working-capital needs.
      diligencePath: Obtain anonymized customer references or diligence calls with a hyperscaler, accelerator designer, packaging partner and memory supplier.
      relatedQuestionRefs: [QM004, QM007]
    - type: conflicting-data
      severity: minor
      topic: market-size
      missingEvidence: A reconciled market model that maps the chiplet-interconnect estimate to the broader advanced-packaging and HBM lenses.
      whyItMatters: Mixing ecosystem spend with addressable IP and chiplet revenue would overstate Eliyan's serviceable market.
      diligencePath: Reconcile category definitions, geography, currency, forecast vintage and included value-chain layers in a bottoms-up model.
      relatedQuestionRefs: [QM002, QM009]
    - type: enumeration-incomplete
      severity: minor
      topic: segment-buyer-map
      missingEvidence: Named customer segments and payer budgets for each deployment stage.
      whyItMatters: The public map establishes roles but not the relative spend or conversion probability of each segment.
      diligencePath: Build a reference-backed account map from CRM exports, design-win documentation and procurement records.
      relatedQuestionRefs: [QM004, QM010]
      relatedTableRefs: [TM003]
