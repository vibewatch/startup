    claimRefs: [CV001, CV003, CV007, CV009, CV014, CV016]
callouts:
  - calloutType: recommendation
    title: Price-sensitive call
    body: >-
      Research-more with medium confidence: do not underwrite the $1 billion reference until
      current operating evidence and the economics of the offered security are verified.
    claimRefs: [CV001, CV005, CV006, CV016]
  - calloutType: risk
    title: Thesis-break conditions
    body: >-
      Missed shipment timing, failed qualification, absent repeat production adoption, or a
      financing below the last mark without stronger fundamentals would materially weaken the case.
    claimRefs: [CV007, CV009, CV016]
