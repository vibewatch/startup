company:
  name: Eliyan
chapter:
  number: 8
  title: Valuation
  summary: >-
    Eliyan's July 2026 financing establishes a $1 billion transaction reference, but public
    evidence does not establish the revenue quality, customer conversion, margins, or current
    financing terms needed to underwrite that price. The recommendation is research-more with
    medium confidence, high risk, and a stretched valuation stance until production evidence
    catches up with the financing narrative.
sections:
  - id: recommendation-and-entry
    title: Recommendation and entry discipline
    body: >-
      Eliyan's July 29, 2026 Series C provides a current transaction reference: Reuters reported
      $145 million raised at a $1 billion valuation, and the company, Tracxn, and Multiples
      corroborate the round and mark. The new capital equals 14.5% of the disclosed post-money
      value as a simple arithmetic ratio, but that is not the same as actual ownership dilution;
      primary versus secondary proceeds, option-pool changes, and round-specific preferences are
      not public. Forge shows 1.0x liquidation preferences and 8.0% dividend rates for January
      2026 preferred tranches, not the July round. Public reporting also relays management's
      trajectory from low-single-digit millions of 2025 revenue to hundreds of millions of sales
      by the end of 2027. Because that forecast is neither ARR nor realized revenue, the visible
      price is more dependent on execution than on demonstrated scale. The present call is
      research-more, not buy: require a verified entry price, signed terms, revenue quality,
      gross margin, backlog, and customer-level production evidence before underwriting a return.
    claimRefs: [CV001, CV003, CV004, CV005, CV006, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-antithesis
    title: Thesis, anti-thesis, and commercialization proof
    body: >-
      The thesis rests on strategic relevance rather than proven financial scale. Cisco
      Investments and Lumentum joined the latest round, extending a shareholder base aligned
      with compute, networking, memory, and optical infrastructure. Management expected initial
      chiplet shipments in 2026, creating a near-term milestone that can be tested against
      production records. The anti-thesis is that investors may be paying ahead of commercial
      proof. MarketScale identified named hyperscaler procurement as the signal needed to show
      contracted demand rather than forward speculation, while EE Times described unresolved
      reliability, testing, and security hurdles across the multi-vendor chiplet ecosystem.
      Strategic participation can improve access and technical validation, but it is not a
      customer contract, recognized revenue, or proof of repeat deployment. The view improves
      only if the company converts the reported shipment plan into paid production, repeat
      orders, acceptable yields, and margins that support the financing mark; it weakens if
      qualification slips or strategic investors do not convert into demand.
    claimRefs: [CV007, CV008, CV009, CV014]
    tableRefs: [TV002]
  - id: scenarios-and-exit
    title: Scenarios, comparables, and exit readiness
    body: >-
      Public references show opportunity but do not support a precise valuation range. Multiples
      reports Arteris at 9.0x LTM enterprise value to revenue, yet Eliyan lacks a comparable
      disclosed current revenue denominator. Unite.AI reports Ayar Labs at a $3.75 billion
      private valuation, while EE Times reports Qualcomm's $2.4 billion acquisition of Alphawave
      Semi; both are useful strategic reference points but differ in product mix, maturity, and
      transaction structure. EE Times also identifies interconnect specialists such as Eliyan
      as sought-after acquisition targets, supporting an M&A path, although Forge displays no
      price and labels current market activity low, so liquidity is not established. The bull,
      base, and bear cases are therefore directional rather than false-precision outputs. A
      defensible target return or hold period requires the actual security price, preference
      stack, dilution, revenue, margin, and exit assumptions. Thesis-break triggers include
      missing the stated shipment window, failed qualification, no repeat production adoption,
      or a financing below the last mark without a corresponding improvement in fundamentals.
    claimRefs: [CV010, CV011, CV012, CV013, CV015, CV016]
    tableRefs: [TV003]
tables:
  - id: TV001
    title: Recommendation summary table
    columns: [Decision field, Assessment, Evidence basis, Change trigger]
    rows:
      - [Recommendation, "Research-more", "$1B financing mark but incomplete operating and terms evidence", "Verified production revenue, margins, backlog, and complete financing terms"]
      - [Confidence, "Medium", "Current round is corroborated; private operating data remain unavailable", "Audited or diligence-grade financial and customer records"]
      - [Risk rating, "High", "Commercialization, qualification, liquidity, and preference uncertainty", "Repeat production adoption with acceptable yield and unit economics"]
      - [Valuation stance, "Stretched", "Forecast growth rather than disclosed current scale supports the price", "Realized growth that makes the entry multiple defensible"]
      - [Entry discipline, "Track or seek a material price concession", "Actual security economics and target return cannot be calculated publicly", "Signed term sheet, cap table, entry price, and exit assumptions"]
    notes: >-
      Assessments synthesize current financing disclosures and independent coverage; they do not
      treat funding raised as cash available or management sales forecasts as ARR.
    claimRefs: [CV001, CV003, CV004, CV005, CV006, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Lens, Argument, Current evidence, What would change the view]
    rows:
      - [Thesis, "Strategic ecosystem access", "Cisco Investments and Lumentum joined the latest round", "Evidence that strategic participation produces paid design wins"]
      - [Thesis, "Commercial inflection is testable", "Management expected initial chiplet shipments in 2026", "Shipment records, production qualification, and repeat orders"]
      - [Anti-thesis, "Valuation may precede contracted demand", "Independent commentary calls named hyperscaler procurement the confirmation signal", "Customer-level contracts and recognized production revenue"]
      - [Anti-thesis, "Ecosystem execution remains difficult", "Independent industry coverage cites reliability, testing, and security hurdles", "Third-party qualification, yield, reliability, and security evidence"]
    notes: >-
      Strategic investors are ecosystem signals, not counted as customers; future shipment and
      sales statements remain company expectations until independently verified.
    claimRefs: [CV007, CV008, CV009, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return range, Probability signal, Downside or confirmation trigger]
    rows:
      - [Bull, "Initial shipments become repeat production deployments; revenue approaches management's 2027 ambition; margins support scaling", "Above the $1B reference may be supportable, but public evidence cannot set an upper bound or target return", "Possible only after customer and financial verification", "Paid production wins, audited growth, durable margin, and no preference surprise"]
      - [Base, "Qualification progresses but sales cycles and production conversion remain gradual", "At or below the $1B reference; exact range and return remain unquantifiable", "Most supportable while operating evidence is private", "On-time shipments, growing backlog, and financing terms consistent with common equity value"]
      - [Bear, "Qualification, reliability, supply, or adoption delays prevent forecast conversion", "Materially below the $1B reference or a down round; downside magnitude is not publicly calculable", "Material risk because the valuation depends on execution", "Missed shipment milestone, failed qualification, or weak repeat demand"]
      - [Exit lens, "Industry consolidation continues and Eliyan retains differentiated interconnect IP", "Strategic M&A is plausible; Forge shows no current price and low activity", "Optionality rather than an underwritten exit", "Credible buyer interest, clean preferences, and transaction evidence"]
    notes: >-
      Scenario ranges are directional because no audited current revenue, margin, complete cap
      table, round terms, or entry security price is public; comp transactions are not treated as
      directly interchangeable valuations.
    claimRefs: [CV004, CV010, CV011, CV012, CV013, CV015, CV016]
