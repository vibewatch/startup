  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "retention-durability"
      missingEvidence: "NRR, GRR, churn, renewal rates, contract duration, cohort performance, and repeat-order evidence."
      whyItMatters: "Without durability metrics, early design activity cannot be translated into recurring or repeatable demand."
      diligencePath: "Request customer cohorts, renewal and repeat-order schedules, signed contract terms, and reference calls covering at least the largest production relationships."
      relatedQuestionRefs: [QU004]
    - type: "private-evidence-only"
      severity: "material"
      topic: "customer-concentration"
      missingEvidence: "Revenue, backlog, shipment, and design-win concentration by the largest customers and channels."
      whyItMatters: "A small number of semiconductor design wins could dominate the forecast and make timing or cancellation risk material."
      diligencePath: "Obtain anonymized top-10 customer revenue and backlog tables, contract status, stage, channel attribution, and downside sensitivity."
      relatedQuestionRefs: [QU005]
    - type: "enumeration-incomplete"
      severity: "material"
      topic: "named-customers"
      missingEvidence: "Named customer-issued production references with deployment scope, shipped volume, measured outcomes, and follow-on orders."
      whyItMatters: "Investor names and unnamed evaluations do not prove paid production adoption or customer value."
      diligencePath: "Secure permissioned reference calls and customer-authored deployment evidence for at least three production accounts across distinct segments."
      relatedQuestionRefs: [QU003, QU009]
      relatedTableRefs: [TU003]
    - type: "missing-source"
      severity: "material"
