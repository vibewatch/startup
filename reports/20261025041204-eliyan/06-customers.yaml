      - ["AI accelerator developers", "Accelerator product and interconnect teams", "Compute-to-memory and die-to-die links", "Included in company-described commercial momentum", "Core fit with AI performance bottlenecks", "No customer-issued validation or outcome"]
      - ["Memory ecosystem", "Memory suppliers and system architects", "Memory-bandwidth expansion and HBM connectivity", "Named as a customer category; individual users undisclosed", "Strategic adjacency to memory suppliers and investors", "No paid deployment or revenue contribution"]
      - ["Optical and infrastructure ecosystem", "Networking, optical-module, and platform teams", "Chip-to-chip and rack-to-rack electro-optical links", "Cisco and Lumentum are named investors, not verified customers", "Expansion path beyond package-level links", "Commercial role and channel economics are undisclosed"]
    notes: >-
      Segment classifications synthesize Reuters, Yahoo Finance, GamesBeat, and
      Eliyan's official positioning; public scale evidence distinguishes named
      investors from unverified customers and does not estimate revenue by segment.
    claimRefs: [CU001, CU002, CU003, CU009, CU010, CU014, CU015]
  - id: "TU002"
    title: "Customer growth and adoption trajectory"
    columns:
      - "Metric / milestone"
      - "Value"
      - "Period"
      - "Attribution"
      - "Confidence"
      - "Implication and missing denominator"
    rows:
      - ["Revenue", "Low millions of dollars", "2025", "Management statement reported by Reuters", "Medium", "Early commercial activity; customer count, mix, and recurrence are absent"]
      - ["Initial chiplet shipments", "Expected to start", "2026", "Management statement reported by Reuters", "Medium", "Near-term commercialization milestone; units and named recipients are absent"]
      - ["Customer activity", "Evaluating or deploying", "Current as reported in 2026", "Company-attributed reporting in GamesBeat", "Low", "Shows pipeline breadth but does not separate pilots from production"]
      - ["Sales forecast", "Hundreds of millions of dollars", "By end of 2027", "Management forecast reported by Reuters", "Low", "Implies a steep ramp; backlog, design-win count, and contracted share are absent"]
      - ["Public customer disclosure", "No named production customer", "As of reviewed 2026 sources", "Pomegra assessment", "Medium", "Prevents validation of reference quality, outcomes, and concentration"]
    notes: >-
      Values retain their original metric names and periods; revenue is not treated as
      ARR, a shipment expectation is not treated as completed deployment, and the
      company forecast is not presented as contracted demand.
    claimRefs: [CU004, CU005, CU006, CU007, CU010]
  - id: "TU003"
    title: "Named customer proof table"
    columns:
      - "Named party / cohort"
      - "Segment"
      - "Evidenced relationship"
      - "Production vs. pilot"
      - "Outcome"
      - "Limitation"
    rows:
      - ["Cisco", "Networking and AI infrastructure", "New strategic investor in the 2026 financing", "Not disclosed as a customer", null, "Investment does not establish a deployment or purchase"]
      - ["Lumentum", "Optical components and data-center infrastructure", "New strategic investor in the 2026 financing", "Not disclosed as a customer", null, "Supplier, partner, or customer role is not publicly resolved"]
      - ["Unnamed hyperscale, accelerator, memory, and infrastructure customers", "Multiple target cohorts", "Company says they are evaluating or deploying Eliyan technology", "Mixed or undisclosed", null, "No names, deployment scope, outcome, volume, or renewal evidence"]
    notes: >-
      Partial enumeration of names and cohorts appearing in the assigned public
      evidence through 2026-10-25; null outcomes mean no customer-issued result was
      available, and strategic investors are not relabeled as customers.
    enumerationScope:
      coverage: "partial"
      basis: >-
        Public names and customer cohorts stated in the assigned prefetched evidence;
        private evaluations and undisclosed design wins are necessarily excluded.
    claimRefs: [CU001, CU007, CU009, CU010, CU013]
figures:
  - id: "FU001"
    title: "Evidence-qualified customer journey"
    type: "journey-map"
    summary: >-
      The public journey progresses from technical fit to forecast expansion, but
      customer identity, production outcomes, and repeat purchasing remain unverified.
    data:
      nodes:
        - id: "fit"
          label: "Architecture fit"
          detail: "Custom AI-chip developers identify bandwidth, memory, or power constraints."
          touchpoints: ["Technical evaluation", "PHY or chiplet selection"]
        - id: "engage"
          label: "Design engagement"
          detail: "Eliyan offers licensed technology or chiplets for integration."
          touchpoints: ["Architecture review", "Internal skill-gap assessment"]
        - id: "evaluate"
          label: "Evaluation"
          detail: "Company-attributed reporting describes evaluations across several infrastructure cohorts."
          touchpoints: ["Validation", "Interoperability and packaging work"]
        - id: "design-in"
          label: "Design-in"
          detail: "No public named design win or customer-issued confirmation was found."
          touchpoints: ["Qualification", "Testing, reliability, and security review"]
        - id: "ship"
          label: "Initial shipment"
          detail: "Management expected initial chiplet shipments during 2026."
          touchpoints: ["Production release", "Volume and recipient remain undisclosed"]
        - id: "expand"
          label: "Expansion"
          detail: "Management forecasts a large 2027 sales ramp and broader optical connectivity."
          touchpoints: ["Follow-on orders", "Cross-product adoption remains unverified"]
    approximationNotes: >-
      Ordered stages describe the evidenced commercial sequence; they do not imply
      conversion rates, elapsed time, customer counts, or completed progression.
    claimRefs: [CU002, CU003, CU005, CU012, CU015]
callouts:
  - calloutType: "risk"
    title: "Commercial proof trails the forecast"
    body: >-
      Management's 2027 sales ambition is not supported by disclosed backlog,
      production-customer names, retention metrics, or concentration data. A named,
      customer-issued production reference with repeat-order evidence would materially
      improve confidence in the ramp.
    claimRefs: [CU006, CU007, CU011]
