company:
  name: "Eliyan"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    Eliyan publicly targets custom-AI-chip developers and reports evaluation or
    deployment activity across hyperscale, accelerator, memory, and infrastructure
    customers, but no named production customer is disclosed in the reviewed evidence.
    The strongest measurable commercialization signals remain management's reported
    low-millions 2025 revenue, expected initial 2026 chiplet shipments, and a highly
    ambitious hundreds-of-millions 2027 sales forecast.
sections:
  - id: "customer-segments-and-buying-motion"
    title: "Customer segments and buying motion"
    body: >-
      Eliyan's apparent buyer universe is concentrated in technically sophisticated
      semiconductor and AI-infrastructure organizations rather than a broad base of
      end enterprises. Reuters describes the target as companies developing custom AI
      computing chips, while company-attributed reporting adds hyperscalers, AI
      accelerator developers, memory participants, and infrastructure providers.
      Eliyan can sell licensed PHY technology or chiplets for integration into a
      customer's own design, which makes the buying motion a design-in process rather
      than a conventional software purchase. Management also says an organization may
      become a customer when its internal team lacks bandwidth or specialized
      interconnect skills. Strategic investors such as Cisco and Lumentum demonstrate
      ecosystem alignment, but investment must not be treated as proof that either is
      a production customer.
    claimRefs: [CU001, CU002, CU003, CU009, CU010, CU014, CU015]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: "adoption-trajectory"
    title: "Adoption trajectory is promising but mostly forward-looking"
    body: >-
      The clearest quantitative commercial disclosure comes from a July 2026 Reuters
      interview: management described 2025 revenue as being in the low millions,
      expected initial chiplet shipments during 2026, and forecast hundreds of
      millions of dollars in sales by the end of 2027. These are different metrics and
      periods, so the revenue disclosure, shipment milestone, and sales forecast should
      not be combined into a conversion rate or recurring-revenue proxy. The projected
      increase is substantial and therefore depends on design wins converting through
      qualification and production. Other coverage repeats that customers are
      evaluating or deploying the technology, but provides no account count,
      utilization denominator, shipment volume, or split between evaluation and
      production. The disclosed trajectory is therefore evidence of commercialization
      intent, not yet a durable adoption curve.
    claimRefs: [CU004, CU005, CU006, CU008, CU010]
    tableRefs: [TU002]
  - id: "named-proof-and-reference-quality"
    title: "Named proof remains relationship evidence, not customer validation"
    body: >-
      The reviewed source set does not identify a production customer by name.
      Pomegra explicitly reports that no production customers have been named, while
      GamesBeat conveys management and investor assertions about commercial momentum,
      a marquee customer base, and twelve strategic investors. Those statements
      increase confidence that relevant ecosystem parties are engaged, but they do not
      establish deployment scope, paid production status, realized outcomes, or
      renewal behavior. Cisco and Lumentum are named as strategic investors; neither
      should be classified as a customer without a contract, deployment announcement,
      or customer-issued confirmation. The named-proof table therefore records the
      relationship actually evidenced and leaves customer status unverified instead of
      promoting logos or financing participants into customer references.
    claimRefs: [CU007, CU009, CU010, CU013]
    tableRefs: [TU003]
  - id: "durability-expansion-and-risk"
    title: "Durability, expansion, and procurement risk"
    body: >-
      No reviewed source supplies net or gross retention, churn, renewals, contract
      length, customer concentration, or cohort expansion. That omission is material
      because semiconductor design wins can involve long qualification cycles and
      uneven shipment ramps, while the public 2027 sales forecast requires rapid
      conversion from today's limited disclosed revenue base. Independent industry
      analysis also describes unresolved chiplet-ecosystem hurdles in testing,
      reliability, and security; these can lengthen diligence and procurement even
      when product performance is attractive. MarketScale identifies a named
      hyperscaler procurement disclosure as the next signal that would distinguish
      contracted demand from forward speculation. Until Eliyan provides customer-level
      contracts, production volumes, renewal or follow-on orders, and revenue
      concentration, land-and-expand durability remains an open underwriting issue.
    claimRefs: [CU004, CU006, CU011, CU012]
