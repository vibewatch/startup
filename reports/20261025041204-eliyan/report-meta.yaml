  topStrengths:
    - Differentiated interconnect IP and chiplet positioning in a strategically important AI infrastructure layer.
    - Substantial financing and strategic participation from Cisco Investments and Lumentum.
    - Clear commercialization milestones tied to initial chiplet shipments and customer qualification.
  topRisks:
    - Production customer conversion, shipment volume, and repeat deployment remain unverified.
    - Revenue, gross margin, burn, runway, customer concentration, and financing terms are not publicly disclosed.
    - >-
      Reliability, testing, security, packaging, and multi-vendor interoperability remain ecosystem-level execution
      risks.
  unresolvedGaps:
    - Need customer-level evidence that evaluations are converting into repeated production deployments.
    - >-
      Need revenue mix, gross margin, concentration, and runway data to test whether the $1 billion mark is fair or
      stretched.
    - Need verified July 2026 financing terms, including preference, participation, dilution, and option-pool treatment.
