company:
  name: "Eliyan"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Eliyan is a Santa Clara semiconductor-connectivity company founded in 2021 that
    licenses interconnect technology and supplies chiplets for AI and HPC systems.
    Its July 2026 $145 million Series C established a reported $1 billion valuation,
    but named production customers, current headcount, detailed revenue, and runway
    remain unavailable in the retained public evidence.
sections:
  - id: "identity-and-business-model"
    title: "Identity and business model"
    body: >-
      Eliyan was founded in 2021 and is headquartered in Santa Clara, California.
      Its business sits at the data-movement layer of AI infrastructure: Reuters
      describes a model that combines licensing interconnect technology with
      supplying chiplets that custom-processor developers can integrate into their
      designs. Semiconductor Engineering independently characterizes NuLink as
      die-to-die PHY technology for advanced packages or standard organic
      substrates. This makes Eliyan neither a general-purpose chip vendor nor a
      pure optical-component company; it is an interconnect IP and chiplet supplier
      spanning compute, memory, and networking links. The company is at Series C,
      while detailed commercial scale remains much less visible than its technical
      and financing profile.
    claimRefs: [CO001, CO002, CO003]
    tableRefs: [TO001]
  - id: "capital-and-visible-scale"
    title: "Capitalization and visible scale"
    body: >-
      On July 29, 2026, Eliyan announced a $145 million Series C at a $1 billion
      valuation. Reuters, the company-issued release, Tracxn, MarketScale, and
      SiliconANGLE all support the core round terms. Tracxn and another company
      profile put cumulative funding near $295 million, although the underlying
      round count and earlier amounts do not reconcile cleanly across retained
      databases. Management told Reuters that 2025 revenue was in the “low
      millions” and forecast hundreds of millions of dollars in sales by the end
      of 2027. Those are management statements, not audited results, ARR, cash
      availability, or evidence of runway. Current customer count, current
      headcount, gross margin, burn, and liquidity therefore remain explicit gaps
      rather than inferred metrics.
    claimRefs: [CO004, CO005, CO012, CO013, CO016]
    tableRefs: [TO003]
  - id: "leadership-and-governance"
    title: "Leadership and governance"
    body: >-
      The retained evidence consistently identifies Ramin Farjadrad, Patrick
      Soheili, and Syrus Ziai as founders. Farjadrad remains chief executive and is
      the principal technical spokesperson, while Reuters identifies Soheili as
      chief strategy and business officer. Eliyan’s current team page also lists
      Alan Krock as chief financial officer and Patrick Reutens as chief legal
      officer, indicating dedicated finance and legal coverage. The July financing
      added Seligman Ventures managing partner Umesh Padval to the board and brought
      Cisco Investments and Lumentum into the syndicate. Public evidence does not
      establish the full board composition, voting rights, founder ownership, or
      succession plan, so founder concentration and investor control cannot yet be
      assessed.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO011]
    tableRefs: [TO002]
  - id: "execution-milestones-and-open-proof"
    title: "Execution milestones and open proof"
    body: >-
      Eliyan has progressed from a 2021 founding through multiple financings,
      silicon milestones, and a 2026 expansion toward electro-optical connectivity.
      The next measurable operating test is more demanding than the financing
      narrative: management expected initial chiplet shipments before year-end
      2026 and forecast a steep sales increase by the end of 2027. The company says
      hyperscale, accelerator, memory, and infrastructure customers are evaluating
      or deploying its technology, but SiliconANGLE reported that none were named.
      Pomegra’s independent analysis appropriately frames shipments followed by
      revenue growth as the near-term credibility test for the $1 billion
      valuation. Diligence should therefore prioritize production purchase orders,
      named design wins, shipment records, recognized revenue, gross margin, and a
      current capitalization table rather than treating strategic investors as
      customer validation.
    claimRefs: [CO004, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
