chapter:
  number: 7
  title: Risks
  summary: >-
    Mosyle's clearest structural risk is concentration on Apple endpoints: that specialization supports product depth but requires another management layer when customers add Windows, Android, or Linux. The assigned public evidence also exposes operational-control failure modes, inconsistent company-controlled customer counts, and unresolved compliance and financial verification gaps.
sections:
  - id: platform-and-operational-exposure
    title: Apple concentration magnifies control-operation risk
    body: >-
      Mosyle's public materials consistently describe an Apple-focused management and security platform, while two competitor-authored comparisons say mixed operating-system fleets require additional tooling. Those comparisons are not independent benchmarks, but they identify a monitorable boundary: if a target customer's non-Apple fleet becomes material, Mosyle no longer supplies a single control plane and integration burden rises. Inside the Apple estate, product breadth does not eliminate operating risk. A Mosyle services guide identifies silent profile failures, missing FileVault recovery-key escrow, stale operating systems, and unclear BYOD rules as failure modes that can leave endpoints unmanaged, complicate recovery, or weaken security. The mitigation is therefore evidence-driven operations rather than feature availability alone: monthly exports for enrollment, failed profiles, encryption escrow, patch status, exceptions, and remediation ownership. A thesis-break signal would be persistent control failures without measured remediation or a strategic shift toward heterogeneous fleets without a credible integration layer.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR007]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: legal-privacy-and-disclosure-posture
    title: Compliance claims exceed the public assurance record
    body: >-
      Mosyle markets hardening, compliance templates, endpoint security, encrypted-DNS filtering, identity controls, and device trust integrations. The assigned source pool does not include a regulator record, court record, certification report, penetration-test result, or independent audit that would verify legal and compliance posture, so the investment case cannot treat product features as assurance. BYOD creates a concrete diligence boundary because privacy expectations, support scope, application protection, wipe behavior, and user consent must be defined before access is allowed. Disclosure controls also need scrutiny: current Mosyle-controlled pages in the pool state more than 65,000, more than 60,000, and more than 47,000 organizations. These are not safely interchangeable snapshots without publication dates and denominator definitions. The appropriate response is not to select a preferred count, but to require a dated KPI reconciliation, legal/privacy documentation, and control-assurance evidence before underwriting regulated-customer expansion.
    claimRefs: [CR004, CR008, CR011, CR012, CR013]
    tableRefs: [TR001]
  - id: dependency-financial-and-thesis-breaks
    title: Partner dependencies and financial opacity constrain underwriting
    body: >-
      The platform depends on Apple's device-management surface and connects identity workflows to external providers including Google Workspace, Microsoft 365, Okta, Ping Identity, and Active Directory variants. Mosyle also says more than 90% of customers buy directly, concentrating onboarding, support, renewal, and migration execution inside the company even though it maintains an MSP surface. Its six-month side-by-side migration trial is a practical mitigation because investors can request conversion, deployment-failure, and support-escalation data from that program. Financially, the public material says Mosyle raised $215 million and achieved record profitability and free cash flow, but the assigned pool contains no audited statements, ARR, gross margin, burn, cash balance, debt schedule, or retention cohort. Funding raised must not be treated as cash available, and an accounting-profitability claim does not establish liquidity. Investment approval should require a reconciled finance pack; negative free cash flow, shrinking runway, or unverified customer-count definitions after diligence would break the thesis.
    claimRefs: [CR009, CR010, CR014, CR015, CR016]
    tableRefs: [TR003]
