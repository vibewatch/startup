        - >-
          Weight rises with audited growth, greater than 100% net retention, durable free cash flow, and clean
          preferences.
      - - Base
        - >-
          Mosyle remains a credible Apple specialist with useful product breadth, but financial quality and 2026
          financing remain unverified.
        - >-
          Treat fair value and target return as unquantified; negotiate from verified current metrics rather than
          aggregator round or comp data.
        - Moderate growth, low pricing, and Apple concentration could cap the applicable multiple.
        - Most consistent with the present evidence and supports research-more.
      - - Bear
        - >-
          Customer denominators overstate economic scale; channel incentives pressure margins; financing or preferences
          dilute common equity.
        - >-
          Downside cannot be bounded without a liquidation waterfall; reject any price premised on the high end of cited
          software multiples.
        - Retention weakness, cash burn, preference overhang, platform concentration, and multiple compression.
        - Weight rises if financing records cannot be reconciled or verified economics miss management claims.
    notes: >-
      Scenario ranges are intentionally unquantified because the retained sources disclose neither current Mosyle
      revenue nor a verified current valuation.
    claimRefs:
      - CV003
      - CV007
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
