chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and business model
        blocks:
          - type: paragraph
            body: >-
              Mosyle is a Winter Park-based, Series B software company founded in 2012. Its original product was an iPad
              learning-management system in Brazil; TechCrunch reports that the company pivoted into Apple-only device
              management for U.S. schools in 2015, added a business product in 2018, and introduced the broader Fuse
              suite in 2021. Today Mosyle positions itself as an Apple-only unified platform integrating device
              management, endpoint security, online privacy, identity and single sign-on, and application and patch
              management. The commercial model is per-device software sold directly to education, business, and
              managed-service-provider segments. Current business pricing illustrates the subscription model, but
              pricing pages are company-issued and do not establish realized average selling price, revenue, or margins.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
