      - number: '1.2'
        title: Founder leadership and capital structure
        blocks:
          - type: paragraph
            body: >-
              Alcyr Araujo is the only operating executive consistently named in the retained evidence and is identified
              as founder and CEO. That continuity supports a coherent product history, but it also creates a material
              key-person and governance diligence question because the broader executive team, directors, ownership
              percentages, and investor rights are not public in this source set. The best-corroborated financing event
              is the $196 million Series B announced in May 2022, led by Insight Partners with StepStone Group,
              Elephant, and Album VC participating. Public cumulative figures do not reconcile: Tracxn reports $247
              million over six rounds, while Mosyle describes a $215 million investment used in part to facilitate
              shareholder exits. Primary financing documents and a capitalization table are therefore needed before
              treating either number as cash raised or cash available.
            claimRefs:
