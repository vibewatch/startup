  - id: FM001
    title: Evidence ladder from broad category to Mosyle price anchors
    type: pyramid
    summary: >-
      Six non-comparable evidence layers narrow from a broad MDM forecast to company reach and price signals without
      claiming a TAM/SAM/SOM conversion.
    data:
      items:
        - label: Global MDM forecast
          value: $20.4B
          unit: 2026 forecast
          detail: MarketsandMarkets forecast relayed by TechCrunch in 2022; broad category, not Apple-specific.
        - label: Enterprise Mac penetration
          value: 23%
          unit: 2020 computer share
          detail: U.S. companies with at least 1,000 employees; IDC statistic quoted by Mosyle.
        - label: Business-site reach
          value: '>65,000'
          unit: organizations
          detail: Unaudited live-page company claim accessed 2026-10-20.
        - label: Main-site reach
          value: '>47,000'
          unit: organizations
          detail: Conflicting unaudited company claim from a different live Mosyle page.
        - label: Education reach
          value: '>20,000'
          unit: schools
          detail: Company-reported education subset; not additive to organization counts.
        - label: Business Premium entry
          value: $1.00
          unit: per device per month
          detail: Published list price with a 30-license minimum and annual billing.
    approximationNotes: >-
      Layer order reflects analytical narrowing, not magnitude or conversion. Values use different units, periods,
      populations, and evidence quality; no layer is derived from another and widths must not be read as proportional.
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM008
      - CM009
      - CM010
      - CM015
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: >-
      Ordinal positioning separates Apple specialization from breadth of the described management, identity, security,
      and compliance control plane.
    data:
      xAxis:
        label: Apple specialization
        min: 1
        max: 5
        low: Multi-OS
        high: Apple-only
        description: Ordinal analyst score from described operating-system coverage
      yAxis:
        label: Integrated control-plane breadth
        min: 1
        max: 5
        low: Device management
        high: Management + identity + security + compliance
        description: Ordinal analyst score from capabilities described in assigned evidence
      points:
        - label: Mosyle
          x: 5
          'y': 5
          note: Apple-only suite spanning management, security, identity, filtering, and patching
        - label: Jamf
          x: 4.5
          'y': 4.5
          note: Apple-first enterprise suite; some capabilities described as separate modules
        - label: Iru
          x: 2
          'y': 5
          note: Mac and Windows with identity and compliance automation
        - label: NinjaOne
          x: 1.5
          'y': 3
          note: Cross-platform endpoint management and RMM
        - label: Scalefusion
          x: 1
          'y': 2.5
          note: Broad multi-OS UEM and kiosk coverage
        - label: JumpCloud
          x: 2
          'y': 4
          note: Cross-platform identity-led directory and device management
    approximationNotes: >-
      Coordinates are evidence-backed ordinal analyst scores, not product benchmarks or measured market positions; a
      one-point difference should not be read as a quantified performance gap.
    claimRefs:
      - CP014
  - id: FI001
    title: Public revenue model bridge
    type: flow
    summary: >-
      Public evidence shows how adoption can reach billed subscriptions, but the bridge stops before quantified gross
      profit because conversion, realized price, and delivery cost are private.
    data:
      nodes:
        - id: free-entry
          label: Free entry
          value: 'Business Free: up to 30 devices'
          detail: A free company tier and a free App Store companion app lower initial access cost.
        - id: paid-selection
          label: Paid SKU selection
          value: $1.00-$3.00 business monthly list price
          detail: Education also publishes $5.50 and $9.00 per-device annual price points.
        - id: license-floor
          label: License floor
          value: 30-license minimum on paid business plans
          detail: The minimum applies to the public Business Premium and Fuse offers.
        - id: billing
          label: Contracted billing
          value: Billed annually
          detail: Published monthly business prices are invoiced on an annual basis.
        - id: distribution
          label: Direct collection
          value: '>90% of customers claimed direct'
          detail: Mosyle says its direct motion avoids reseller and distributor costs.
        - id: delivery
          label: Bundled delivery
          value: Onboarding and support included
          detail: Public materials do not quantify the associated service-delivery cost.
        - id: gross-profit
          label: Gross profit
          value: Not publicly quantified
          detail: Mosyle claims record profitability and free cash flow without amounts or periods.
    approximationNotes: This is a qualitative mechanism map, not a conversion funnel or a value-proportional bridge.
    claimRefs:
      - CI001
      - CI002
      - CI005
      - CI006
      - CI007
      - CI014
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Evidence-supported product and dependency layers from enrollment through operations.
    data:
      layers:
        - label: Apple enrollment foundation
          detail: Device assignment supervision and the Apple MDM protocol establish management authority.
          modules:
            - Apple Business Manager
            - Apple School Manager
            - Apple MDM protocol
          outputs:
            - Enrolled and supervised device estate
        - label: Device clients and inventory
          detail: A macOS agent and iOS/iPadOS applications augment native management and expose device state.
          modules:
            - macOS agent
            - iOS application
            - iPadOS application
          outputs:
            - Inventory and compliance attributes
        - label: Management and application control
          detail: Profiles restrictions operating-system updates and application deployment are coordinated in the platform.
          modules:
            - Configuration profiles
            - App catalog
            - Patch workflows
          outputs:
            - Configured and updated endpoints
        - label: Security and privacy controls
          detail: Endpoint security hardening compliance and encrypted-DNS web controls share the management plane.
          modules:
            - Endpoint security
            - Hardening and compliance
            - Web filtering
          outputs:
            - Policy and remediation state
        - label: Identity and access
          detail: Mosyle Auth 2 connects Mac login to supported organizational identity providers.
          modules:
            - Local account automation
            - Single sign-on
            - Device 2FA
          outputs:
            - Managed device identity
        - label: External policy integrations
          detail: Mosyle API attributes can synchronize to ClearPass for network authorization and dynamic lookup.
          modules:
            - Mosyle API
            - ClearPass extension
            - Endpoint context lookup
          outputs:
            - Network access policy input
    approximationNotes: >-
      Conceptual layer order reflects documented workflows and dependencies; it is not Mosyle's undisclosed internal
      deployment topology.
    claimRefs:
      - CE003
      - CE016
  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      Publicly described touchpoints reduce trial and migration friction, but the sources do not disclose conversion,
      renewal, or expansion rates.
    data:
      items:
        - label: Discover
          detail: Business, school, and MSP-specific pages frame Apple management and security use cases.
          touchpoints:
            - Product and pricing pages
            - Third-party reviews and comparisons
        - label: Trial
          detail: Business prospects can start with a free tier or trial before paid deployment.
          touchpoints:
            - Free tier for up to 30 business devices
            - Extended migration trial
        - label: Onboard
          detail: Mosyle offers personalized onboarding and support as part of the adoption motion.
          touchpoints:
            - Onboarding specialist
            - Configuration guidance
        - label: Deploy
          detail: IT teams enroll, configure, secure, and patch corporate or school Apple fleets.
          touchpoints:
            - Corporate-issued and BYOD endpoints
            - School and classroom devices
        - label: Expand
          detail: Customers can add devices, security modules, identity capabilities, or MSP-managed estates.
          touchpoints:
            - Premium and Fuse tiers
            - Fuse MSP
        - label: Migrate or renew
          detail: >-
            Mosyle targets switchers with side-by-side evaluation and a first-year incentive, while renewal metrics
            remain private.
          touchpoints:
            - Up to six-month extended trial
            - Migration incentive credit
    approximationNotes: >-
      This is a conceptual sequence synthesized from disclosed customer touchpoints, not a measured funnel; no
      conversion, renewal, or expansion rates are inferred.
    claimRefs:
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU013
      - CU014
