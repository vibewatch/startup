    title: Company milestone timeline
    type: timeline
    summary: >-
      Mosyle evolved from education software into an Apple-only management and security platform, while its latest
      public scale disclosures became harder to compare.
    data:
      items:
        - date: '2012'
          label: Founded in Brazil
          detail: Mosyle began as an iPad-based learning-management system for schools.
          tone: neutral
          claimRefs:
            - CO001
            - CO003
        - date: '2015'
          label: U.S. K-12 MDM pivot
          detail: The company raised $1 million and entered the U.S. market with Apple-only MDM for K-12.
          tone: positive
          claimRefs:
            - CO003
        - date: '2018'
          label: Mosyle Business introduced
          detail: Mosyle extended beyond schools with its first enterprise MDM product.
          tone: positive
          claimRefs:
            - CO003
        - date: '2020'
          label: Pre-Series B financing
          detail: TechCrunch identifies a prior $32.8 million round; Tracxn separately lists a 2020 financing.
          tone: neutral
          claimRefs:
            - CO006
            - CO007
        - date: '2021'
          label: Mosyle Fuse arrived
          detail: The product scope expanded into endpoint security, patch management, and identity.
          tone: positive
          claimRefs:
            - CO003
        - date: '2022-05-04'
          label: $196 million Series B
          detail: Insight Partners led the round as Mosyle announced its Apple Unified Platform.
          tone: positive
          claimRefs:
