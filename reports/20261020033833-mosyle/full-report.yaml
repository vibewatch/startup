  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Mosyle competes for spending on Apple device enrollment, policy enforcement, application deployment and
              patching, identity, endpoint security, privacy, and compliance workflows. The relevant boundary is
              narrower than unified endpoint management because Mosyle manages Apple platforms only; Windows, Android,
              and Linux fleets fall outside its native scope. Within that boundary, the economic alternatives include
              Apple-specialist suites, cross-platform endpoint tools, separate security and identity products, and
              continued manual administration. The status quo remains credible for very small fleets, but recurring
              onboarding, update, inventory, and exception work creates the operational trigger for formal management.
              This definition avoids treating all endpoint-security or all device-management spend as directly
              addressable.
            claimRefs:
              - CM001
              - CM004
              - CM012
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM012
              - CM014
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The available evidence does not reconcile to a Mosyle-specific TAM, SAM, or SOM. A 2022 TechCrunch article
              relayed a MarketsandMarkets forecast that the global MDM market would rise from $5.5 billion in 2021 to
              $20.4 billion in 2026, but that forecast is broad, old, and not Apple-specific. A 2021 Mosyle release
              cited IDC for macOS representing 23% of computers at U.S. companies with at least 1,000 employees in 2020,
              another historical demand indicator rather than spending data. Live Mosyle pages also disagree on
              organizational reach, stating more than 65,000 organizations on the business page and more than 47,000 on
              the main site. These lenses establish opportunity and traction signals while leaving fleet counts,
              addressable device volumes, conversion, and obtainable share unresolved.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM015
      - number: '2.3'
        title: Buyers, users, and budget ownership
        blocks:
          - type: paragraph
            body: >-
              The buying center changes by segment. Business deployments are typically sponsored by IT or security
              leaders who need repeatable enrollment, patching, compliance, and offboarding across Apple fleets. K-12
              deployments add school technology leadership, classroom administrators, shared-device workflows, student
              turnover, and annual per-device budgeting. MSPs need multi-tenant administration for Apple-focused client
              accounts. Users are employees, teachers, students, and administrators, while the payer is usually a
              central IT, security, district, or managed-services budget owner. Published pricing creates a low entry
              point, but the 30-license minimum on paid business plans means the smallest paid deployment starts above a
              single-device price quote.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM012
              - CM013
      - number: '2.4'
        title: Adoption drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption is supported by larger Apple fleets, distributed work, zero-touch deployment, tighter security
              expectations, and the appeal of replacing multiple tools with one Apple-specific platform. Price can
              accelerate a shortlist: Mosyle publishes $1 per device per month for Business Premium and $5.50 per device
              per year for Education Premium. Constraints are equally material. Mixed fleets may favor a cross-platform
              control plane, organizations still need policy ownership and Apple Business or School Manager readiness,
              and an independent 2026 review reports thin documentation, shallow API coverage, and compliance-data
              limitations. Buyers therefore must validate actual fleet mix, integrations, support, migration work, and
              security evidence before converting low list prices into a durable ROI case.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public evidence does not close market sizing
            body: >-
              A broad MDM forecast, historical Mac penetration, unaudited reach claims, and list prices cannot produce a
              Mosyle-specific TAM, SAM, or SOM without segment fleet counts, paid conversion, attach rates, and
              geographic mix.
            calloutType: risk
            claimRefs:
              - CM015
          - type: callout
            title: Apple specialization is both the wedge and the ceiling
            body: >-
              Apple-first organizations can value integrated, platform-specific workflows, while mixed-fleet buyers may
              prioritize one cross-platform control plane.
            calloutType: insight
            claimRefs:
              - CM001
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The buying set is broader than an Apple-MDM shortlist. Jamf is the direct Apple-management incumbent,
              while Iru, NinjaOne, Scalefusion, JumpCloud, and Hexnode compete by extending the control plane across
              operating systems, identity, compliance, remote monitoring, or kiosk use cases. Mosyle occupies the
              Apple-only, integrated-suite corner: its own pages combine device management, security, identity,
              filtering, and patching, and a 2022 Computerworld article described the same five-application platform
              concept. Internal administration with native Apple enrollment and separate point tools remains a
              status-quo alternative, but the assigned evidence does not establish it as a feature-complete substitute.
              Physical device logistics is another adjacent layer rather than an MDM capability, according to Firstbase.
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP007
              - CP009
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP007
              - CP009
              - CP010
              - CP011
              - CP012
              - CP014
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP014
      - number: '3.2'
        title: Capability, trust, and displacement vectors
        blocks:
          - type: paragraph
            body: >-
              Mosyle's strongest documented differentiation is native integration around Apple endpoints, not
              cross-platform reach. Its official materials describe an Apple-specific stack spanning management,
              endpoint security, identity and SSO, encrypted-DNS filtering, and application patching. The principal
              displacement vector is therefore fleet heterogeneity: Iru argues that Windows or Android adoption, deeper
              identity, and compliance obligations can expose the ceiling of an Apple-only platform. Jamf attacks from
              the opposite direction with deeper Apple administration and modular enterprise controls, although the
              detailed comparison available here is vendor-authored rather than an independent benchmark. Gartner's
              seven-rating sample is favorable but too small to settle reliability or enterprise-scale product depth.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
              - CP007
              - CP009
      - number: '3.3'
        title: Pricing, distribution, and switching economics
        blocks:
          - type: paragraph
            body: >-
              Mosyle's public list prices create a clear acquisition wedge: the business page lists Premium at $1 per
              device per month, Fuse for iOS-family devices at $1.50, and Fuse for macOS at $3, each with a 30-license
              minimum and annual billing. Education pricing is separately listed at $5.50 and $9 per device per year.
              These are list prices, not realized revenue or proof of equivalent scope. Mosyle also says more than 90%
              of customers buy directly, implying pricing control and low channel dependence, while its migration offer
              reduces near-term switching friction. Conversely, a Firstbase comparison alleges thin documentation and
              occasional agent disconnection; because Firstbase is an adjacent vendor comparison, those claims require
              direct customer or technical corroboration.
            claimRefs:
              - CP002
              - CP006
              - CP008
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP005
              - CP008
      - number: '3.4'
        title: Moat durability and unresolved competitive evidence
        blocks:
          - type: paragraph
            body: >-
              The moat appears execution-based rather than structurally protected. Apple specialization can produce
              faster integration and lower operating complexity for homogeneous fleets, but it also narrows the
              addressable control plane when buyers standardize on multi-OS identity or endpoint suites. Published scale
              does not resolve durability: Mosyle's current assigned pages variously state more than 65,000, 60,000, and
              47,000 organizations, without reconciling dates or denominators. Mosyle also says it raised $215 million
              to facilitate shareholder exits, which is funding history rather than cash available for competition.
              Underwriting requires a current, denominator-consistent installed base; win/loss data against Jamf and
              mixed-fleet suites; migration and multi-homing rates; and independent security, reliability, and support
              benchmarks.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-to-scope is the clearest wedge
            body: >-
              Mosyle publishes low per-device prices while bundling Apple management, security, identity, filtering, and
              patching; the assigned evidence does not establish realized discounts or feature-quality parity.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP008
          - type: callout
            title: Scale and reliability evidence is not decision-grade
            body: >-
              Three current Mosyle surfaces report different organization counts, and the most specific reliability
              criticism comes from a commercially interested adjacent vendor rather than an independent technical
              benchmark.
            calloutType: risk
            claimRefs:
              - CP006
              - CP010
              - CP011
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public pricing
        blocks:
          - type: paragraph
            body: >-
              Mosyle's public monetization is a recurring, device-based subscription model segmented between business
              and education. Business list prices run from a free tier for up to 30 devices to $1.00 per device per
              month for Business Premium, $1.50 for Fuse on iOS, iPadOS, and visionOS, and $3.00 for Fuse on macOS; paid
              business plans require at least 30 licenses and are billed annually. Education pages publish $5.50 and
              $9.00 per-device annual price points for successively broader management and security bundles. Apple Watch
              management carries no extra fee, while each paid macOS or iOS/iPadOS license includes one Apple TV
              management entitlement. These are current company-issued list prices, not evidence of realized average
              selling price, discounting, contract duration beyond annual billing, or revenue mix. The free business
              tier and free companion app appear designed to reduce initial adoption friction, but public evidence does
              not quantify conversion into paid subscriptions.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI006
              - CI007
              - CI014
      - number: '4.2'
        title: GTM motion and delivery economics
        blocks:
          - type: paragraph
            body: >-
              Mosyle says more than 90% of customers purchase directly, which would limit reseller commissions and
              distributor markups if the mix is accurate. The company also describes a "no-sales" approach intended to
              avoid salaries, commissions, and sales-tool expense. That combination points to a potentially efficient
              self-service and product-led motion, but the evidence is company-authored and supplies no CAC,
              sales-cycle, conversion, churn, or payback data. Delivery is not costless: personalized onboarding and
              technical support are included, so staffing and support intensity are likely material gross-margin
              variables even though their cost is undisclosed. TechCrunch also highlighted broader privacy resistance to
              MDM and BYOD monitoring, which may increase implementation, trust, and retention work. The resulting
              economics could be attractive, but public materials support only the mechanism, not the efficiency
              outcome.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI012
              - CI014
              - CI015
      - number: '4.3'
        title: Traction signals and revenue quality
        blocks:
          - type: paragraph
            body: >-
              Current official pages claim more than 65,000 organizations worldwide, while another passage on the same
              business page says the no-sales approach attracted almost 50,000 customers. Mosyle's education page
              separately claims more than 20,000 schools and millions of managed Apple devices. These disclosures
              demonstrate broad deployment but cannot be added or treated as a single customer count because
              "organizations," "customers," and "schools" may overlap and the pages do not provide measurement dates or
              denominator definitions. Device counts are also not a revenue proxy because free tiers, bundled Apple TV
              and Watch entitlements, product mix, and discounts can produce different revenue per managed device. No
              public source in the assigned evidence discloses ARR, recognized revenue, growth for a defined period,
              renewal, net revenue retention, concentration, or cohort conversion. Revenue quality therefore remains
              directionally promising but quantitatively unverified.
            claimRefs:
              - CI002
              - CI004
              - CI008
              - CI009
              - CI010
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              The strongest dated capital evidence is historical. TechCrunch and 9to5Mac reported a $196 million Series
              B in May 2022, and TechCrunch reported $215 million of cash and 32,000 customers at that time while noting
              that Mosyle declined to disclose valuation. Mosyle now claims record profitability and free cash flow, and
              says the capital facilitated exits for shorter-term shareholders rather than funding survival. Those
              current claims are not accompanied by amounts, accounting definitions, periods, an audited cash balance,
              or a debt schedule; funding raised and historical cash therefore must not be treated as cash available in
              2026. The model has credible ingredients for strong software economics—recurring per-device pricing,
              direct distribution, annual billing, and integrated products—but the underwriting verdict remains
              evidence-constrained. Before valuation work, diligence needs a monthly ARR and revenue bridge,
              gross-margin detail including support costs, retention and concentration cohorts, current cash and burn,
              debt and obligations, and a board-approved operating plan showing runway and next-financing triggers.
            claimRefs:
              - CI001
              - CI005
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Historical funding is not current liquidity
            body: >-
              The $215 million cash figure was reported in May 2022. No assigned source establishes Mosyle's 2026 cash
              balance, burn, runway, debt, or other obligations.
            calloutType: risk
            claimRefs:
              - CI012
              - CI014
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and packaging
        blocks:
          - type: paragraph
            body: >-
              Mosyle positions the product as one integrated control plane for making Apple devices ready for work and
              school, rather than as a generic cross-platform endpoint suite. Its public product surface spans Apple
              device management, endpoint security, encrypted-DNS web controls, macOS identity and single sign-on, and
              application and operating-system patching. The education product adds classroom workflows, parental
              controls, shared-device support, and school-focused identity features, while Mosyle Fuse MSP adds
              provider-level policy, customer-level exceptions, and centralized billing. Current business packaging also
              exposes Free, Premium, and Fuse tiers. This breadth is strategically coherent for Apple-heavy estates, but
              most capability and differentiation statements are company claims rather than independently measured
              outcomes.
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE010
              - CE011
              - CE014
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE010
              - CE011
              - CE014
      - number: '5.2'
        title: Deployment and operating workflow
        blocks:
          - type: paragraph
            body: >-
              The customer workflow begins with Apple enrollment and inventory, then applies profiles, restrictions,
              identity settings, security policies, and application assignments before monitoring compliance and
              remediation. Mosyle says paid customers receive personalized onboarding and ongoing support, which can
              reduce initial implementation burden but is not a substitute for customer-side control ownership.
              Independent practitioner guidance emphasizes that effective Apple management still requires explicit rules
              for device ownership, supervision, profile assignment, updates, exceptions, evidence, and support
              escalation. HPE's ClearPass documentation provides concrete external proof that Mosyle device attributes
              can be synchronized into a network-policy database and used for access decisions, extending the workflow
              beyond Mosyle's own console.
            claimRefs:
              - CE006
              - CE007
              - CE012
              - CE013
          - type: table
            tableRef: TE002
            claimRefs:
              - CE006
              - CE007
              - CE010
              - CE012
              - CE013
      - number: '5.3'
        title: Architecture and integration dependencies
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a layered operating model rather than a fully disclosed software architecture.
              Mosyle says a lightweight macOS agent and iOS/iPadOS applications augment Apple's MDM protocol, while
              identity workflows connect to external identity providers. HPE's integration periodically pulls device
              records through Mosyle endpoints into ClearPass and can request fresh attributes dynamically for
              authorization. That integration requires customer-specific credentials and tokens, and some API access is
              plan-dependent. Initial full synchronization can be resource-intensive, configuration changes can require
              extension restarts, and polling topology must be designed carefully in clustered ClearPass deployments.
              The architecture therefore inherits dependencies on Apple enrollment services, operating-system APIs,
              external identity providers, and customer-managed integration configuration.
            claimRefs:
              - CE002
              - CE005
              - CE006
              - CE007
              - CE008
              - CE016
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE005
              - CE006
              - CE007
              - CE008
              - CE016
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE003
              - CE016
      - number: '5.4'
        title: Maturity, trust, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Product maturity is best evidenced by the breadth of marketed production modules and HPE's detailed
              integration guide, not by independently published performance data. The allocated GitHub page contains
              product-oriented prose but no repository, release, contributor, or package-activity metrics in the fetched
              record, so it cannot substantiate developer adoption. More importantly, the retained sources do not
              include an independent security assessment, certification record, vulnerability history, status history,
              uptime result, or comparative malware benchmark. This is an evidence limitation, not proof that controls
              or incidents are absent. Technical diligence should therefore request architecture diagrams, service-level
              history, incident and vulnerability records, control attestations, endpoint performance tests, roadmap
              commitments, and release evidence before treating integrated packaging as verified security or reliability
              differentiation.
            claimRefs:
              - CE009
              - CE012
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated Apple-only scope is coherent
            body: >-
              The evidence consistently shows a product designed around Apple enrollment, operating-system controls,
              identity, security, and patching rather than a cross-platform feature checklist.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: callout
            title: Packaging breadth is not efficacy proof
            body: >-
              No retained independent source benchmarks Mosyle's detection quality, uptime, endpoint overhead,
              remediation speed, or integrated-control advantage.
            calloutType: risk
            claimRefs:
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and reported scale
        blocks:
          - type: paragraph
            body: >-
              The public customer surface supports a segmented rather than homogeneous customer base. Mosyle markets a
              business platform to IT and security teams managing corporate-issued and BYOD Apple endpoints, while a
              separate school product targets district and school administrators, teachers, and students. The K-12 page
              claims use by more than 20,000 schools and millions of devices, and the business page presents a worldwide
              organization count. However, that business count is not decision-grade: current Mosyle pages use more than
              65,000 organizations, more than 47,000 organizations, and almost 50,000 customers without reconciling
              definitions or vintages. The 32,000-customer figure reported by TechCrunch in May 2022 is a useful
              historical baseline, not a directly comparable current cohort.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU012
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU012
              - CU014
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
      - number: '6.2'
        title: Acquisition, deployment, and expansion motions
        blocks:
          - type: paragraph
            body: >-
              Entry paths are designed to reduce adoption friction. Businesses can start free for up to 30 devices,
              while paid business plans use per-device pricing and a 30-license minimum. Schools have a separate free
              and annual per-device ladder. Mosyle says more than 90% of customers buy directly, which limits
              traditional reseller dependence but also concentrates acquisition in the vendor's self-service and direct
              model. The 2024 Fuse MSP launch creates a second channel for managed-service providers, although no MSP
              account, device, or revenue contribution is disclosed. For switchers, Mosyle describes an extended trial
              and first-year migration credit after having helped thousands of organizations migrate; these are
              conversion mechanisms, not evidence of renewal or durable expansion.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
              - CU013
              - CU014
      - number: '6.3'
        title: Reference quality and customer voice
        blocks:
          - type: paragraph
            body: >-
              Public reference quality is weak relative to the scale claims. Mosyle explicitly says it does not display
              customer logos, so the reviewed pool provides no named organization whose production deployment, outcome,
              or renewal can be checked. The strongest external customer signal is therefore aggregated: InvGate
              summarizes generally positive feedback on support, usability, automation, and value, while also
              identifying requests for better iPad authentication, API functionality, and documentation. A
              competitor-hosted comparison says it uses G2 Fall 2025 feedback and other public materials, but its issuer
              and comparative purpose limit independence. These signals support product-market relevance, not named
              deployment proof or quantified customer outcomes.
            claimRefs:
              - CU013
              - CU014
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU005
              - CU010
              - CU011
              - CU012
              - CU013
              - CU016
      - number: '6.4'
        title: Durability, concentration, and underwriting gaps
        blocks:
          - type: paragraph
            body: >-
              Durability cannot be underwritten from the public record. None of the assigned sources discloses gross or
              net retention, logo churn, renewal rates, contract length, cohort expansion, top-customer revenue share,
              or revenue concentration by business, education, or MSP channel. The direct purchasing claim suggests
              limited reseller dependence, but it does not establish diversified demand or low customer concentration.
              Likewise, millions of managed devices and large organization counts do not reveal paying status, recurring
              revenue, or retention. Diligence should reconcile the three current count labels to a dated
              paying-customer bridge and obtain cohort and concentration schedules before assigning value to the
              apparent installed-base scale.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU006
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale is not the same as durable revenue
            body: >-
              Public scale labels conflict, named deployments are intentionally withheld, and no retention or
              concentration schedule is available. Underwriting should rely on a company-provided reconciliation of
              paying accounts, devices, cohorts, renewals, and top-customer revenue rather than headline organization
              counts.
            calloutType: risk
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Apple concentration magnifies control-operation risk
        blocks:
          - type: paragraph
            body: >-
              Mosyle's public materials consistently describe an Apple-focused management and security platform, while
              two competitor-authored comparisons say mixed operating-system fleets require additional tooling. Those
              comparisons are not independent benchmarks, but they identify a monitorable boundary: if a target
              customer's non-Apple fleet becomes material, Mosyle no longer supplies a single control plane and
              integration burden rises. Inside the Apple estate, product breadth does not eliminate operating risk. A
              Mosyle services guide identifies silent profile failures, missing FileVault recovery-key escrow, stale
              operating systems, and unclear BYOD rules as failure modes that can leave endpoints unmanaged, complicate
              recovery, or weaken security. The mitigation is therefore evidence-driven operations rather than feature
              availability alone: monthly exports for enrollment, failed profiles, encryption escrow, patch status,
              exceptions, and remediation ownership. A thesis-break signal would be persistent control failures without
              measured remediation or a strategic shift toward heterogeneous fleets without a credible integration
              layer.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR008
              - CR012
              - CR014
              - CR016
      - number: '7.2'
        title: Compliance claims exceed the public assurance record
        blocks:
          - type: paragraph
            body: >-
              Mosyle markets hardening, compliance templates, endpoint security, encrypted-DNS filtering, identity
              controls, and device trust integrations. The assigned source pool does not include a regulator record,
              court record, certification report, penetration-test result, or independent audit that would verify legal
              and compliance posture, so the investment case cannot treat product features as assurance. BYOD creates a
              concrete diligence boundary because privacy expectations, support scope, application protection, wipe
              behavior, and user consent must be defined before access is allowed. Disclosure controls also need
              scrutiny: current Mosyle-controlled pages in the pool state more than 65,000, more than 60,000, and more
              than 47,000 organizations. These are not safely interchangeable snapshots without publication dates and
              denominator definitions. The appropriate response is not to select a preferred count, but to require a
              dated KPI reconciliation, legal/privacy documentation, and control-assurance evidence before underwriting
              regulated-customer expansion.
            claimRefs:
              - CR004
              - CR008
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR008
              - CR011
              - CR012
              - CR013
      - number: '7.3'
        title: Partner dependencies and financial opacity constrain underwriting
        blocks:
          - type: paragraph
            body: >-
              The platform depends on Apple's device-management surface and connects identity workflows to external
              providers including Google Workspace, Microsoft 365, Okta, Ping Identity, and Active Directory variants.
              Mosyle also says more than 90% of customers buy directly, concentrating onboarding, support, renewal, and
              migration execution inside the company even though it maintains an MSP surface. Its six-month side-by-side
              migration trial is a practical mitigation because investors can request conversion, deployment-failure,
              and support-escalation data from that program. Financially, the public material says Mosyle raised $215
              million and achieved record profitability and free cash flow, but the assigned pool contains no audited
              statements, ARR, gross margin, burn, cash balance, debt schedule, or retention cohort. Funding raised must
              not be treated as cash available, and an accounting-profitability claim does not establish liquidity.
              Investment approval should require a reconciled finance pack; negative free cash flow, shrinking runway,
              or unverified customer-count definitions after diligence would break the thesis.
            claimRefs:
              - CR009
              - CR010
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR009
              - CR010
              - CR014
              - CR015
              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Investment kill criteria
            body: >-
              Stop underwriting if diligence cannot reconcile customer denominators, produce current control-assurance
              and privacy artifacts, demonstrate profile, escrow, and patch remediation, or bridge the $215 million
              funding claim to current cash, debt, burn, and free cash flow.
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The appropriate public-evidence decision is research-more, not buy. Mosyle's integrated Apple management
              and security scope, published price points, and claimed organizational reach make the company worth
              continued diligence, but those signals do not establish recurring revenue, growth, retention, gross
              margin, cash generation, or a supportable current valuation. The retained evidence therefore supports
              medium confidence in the direction of the call but low confidence in any price or target return. Risk is
              high because the central underwriting inputs are private, while the valuation stance is indeterminate
              rather than cheap or expensive. Entry should be contingent on a verified operating packet and a fully
              diluted capitalization and preference schedule; without those materials, even a strong product view cannot
              be translated into return underwriting.
            claimRefs:
              - CV007
              - CV008
              - CV010
              - CV012
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV009
              - CV012
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV009
              - CV013
              - CV014
              - CV015
      - number: '8.2'
        title: Financing and comparable context
        blocks:
          - type: paragraph
            body: >-
              The financing record is not clean enough to anchor price. Multiples reports $348 million raised across six
              rounds and a $100 million April 2026 round, while Tracxn reports $247 million and identifies the 2022
              Series B as the latest round. Multiples' April 2026 row also contains narrative describing the 2022
              financing, which creates a specific reconciliation problem rather than fresh proof. TechCrunch reported
              that Mosyle declined to disclose its valuation in the 2022 round, and the retained sources provide no
              independently verified current post-money value. Public and private software multiples listed by Multiples
              are context only: Mosyle lacks the disclosed revenue, ARR, margin, growth, and net-cash inputs needed to
              select or apply a multiple. A term sheet, investor confirmation, and audited financials must supersede
              aggregator figures.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV009
              - CV010
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: Scenario and return logic
        blocks:
          - type: paragraph
            body: >-
              The bull case depends on converting Mosyle's claimed scale, integrated suite, direct distribution, and low
              pricing into durable retention and efficient expansion. The base case assumes a useful Apple-focused
              platform but with insufficient evidence to quantify an enterprise-value range or exit return. The bear
              case combines Apple-platform concentration, low price points, potentially expensive channel incentives,
              inconsistent first-party scale disclosures, and unresolved financing data. None of these cases can
              responsibly carry a numeric valuation range from public evidence alone. The probability signal is
              therefore diligence-based: the bull case gains weight only with independently reconciled ARR, net
              retention, gross margin, free cash flow, and customer cohorts; the bear case gains weight if those metrics
              miss, if a preference overhang is material, or if a proposed entry price assumes unsupported software
              multiples.
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not establish exit readiness. The company has financing history, claimed scale, and a
              product positioned across education, business, and MSP channels, but there is no retained audited
              operating series, current ownership schedule, liquidation waterfall, or verified valuation mark. Final
              diligence should obtain monthly ARR and revenue bridges, gross margin by product, logo and dollar
              retention, burn and runway, debt, customer cohorts, the April 2026 financing documents, and all preference
              terms. The thesis should break if verified retention or cash generation is materially weaker than
              management claims, if customer counts cannot be reconciled to paying organizations, if preferences impair
              common-equity outcomes, or if the requested price requires a multiple unsupported by growth and margin
              evidence. A credible exit plan also needs named strategic-buyer logic or IPO-scale financial controls,
              neither of which is public.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price is the missing variable
            body: >-
              Mosyle may be a strong company and still be a poor investment at the wrong terms. Public evidence supports
              diligence on product and scale, but not a numeric entry price, target return, or liquidation outcome.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV013
              - CV014
