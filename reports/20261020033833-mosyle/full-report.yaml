      - number: '1.3'
        title: Scale signals and evidence limits
        blocks:
          - type: paragraph
            body: >-
              Mosyle's public surfaces indicate meaningful scale but use incompatible populations and vintages. The
              corporate page says more than 47,000 organizations use Mosyle; the business page says more than 65,000
              organizations worldwide; and the MSP page says more than 52,000 individual customer accounts and seven
              million devices have joined since 2016. The education page separately says Mosyle Manager reached more
              than 20,000 schools within five years of release. These disclosures can all be directionally consistent if
              organizations, accounts, schools, and cumulative sign-ups are different denominators, but they cannot be
              combined into one current customer count. The retained sources also do not establish current ARR, revenue,
              margin, retention, burn, runway, debt, valuation, or an unambiguous current headcount. TechCrunch flags
              broader privacy concerns around MDM, but the assigned evidence does not establish a Mosyle-specific legal,
              regulatory, breach, or outage event; that absence is an evidence gap, not proof that none occurred.
            claimRefs:
