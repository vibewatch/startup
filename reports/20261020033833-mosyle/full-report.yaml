  - id: FV001
    title: Recommendation logic
    type: flow
    summary: The public record supports continued diligence but not a priced investment decision.
    data:
      nodes:
        - id: scale
          label: Scale signals
          detail: Company pages claim large organization, school, account, and device footprints.
        - id: economics
          label: Economics gap
          detail: Current ARR, retention, margin, burn, runway, and debt are not disclosed in retained evidence.
        - id: financing
          label: Financing conflict
          detail: Independent databases report different funding totals and latest-round histories.
        - id: comparables
          label: Comps not applicable
          detail: Broad software multiples cannot be selected without normalized Mosyle financials.
        - id: conditions
          label: Entry conditions
          detail: Require audited metrics, financing documents, cap table, and liquidation waterfall.
        - id: decision
          label: Research more
          detail: Medium-confidence process call; high risk; valuation remains indeterminate.
      edges:
        - from: scale
          to: economics
        - from: economics
          to: financing
        - from: financing
          to: comparables
        - from: comparables
          to: conditions
        - from: conditions
          to: decision
    approximationNotes: The flow is qualitative and does not imply a numeric conversion rate, probability, or valuation.
    claimRefs:
      - CV001
      - CV003
      - CV009
      - CV013
      - CV014
      - CV015
