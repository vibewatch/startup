artifact: customers
slug: mosyle
runDate: 2026-10-20
company:
  name: Mosyle
chapter:
  number: 6
  title: Customers
  summary: >-
    Mosyle addresses two clear Apple-centric customer groups—businesses and K-12
    schools—and has added an MSP route, but current scale is not reconciled.
    Company pages simultaneously cite more than 65,000 organizations, more than
    47,000 organizations, and almost 50,000 customers, while public retention,
    concentration, and named-deployment evidence remains unavailable.
sections:
  - id: customer-segments-and-scale
    title: Customer segments and reported scale
    body: >-
      The public customer surface supports a segmented rather than homogeneous
      customer base. Mosyle markets a business platform to IT and security teams
      managing corporate-issued and BYOD Apple endpoints, while a separate
      school product targets district and school administrators, teachers, and
      students. The K-12 page claims use by more than 20,000 schools and millions
      of devices, and the business page presents a worldwide organization count.
      However, that business count is not decision-grade: current Mosyle pages
      use more than 65,000 organizations, more than 47,000 organizations, and
      almost 50,000 customers without reconciling definitions or vintages. The
      32,000-customer figure reported by TechCrunch in May 2022 is a useful
      historical baseline, not a directly comparable current cohort.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU012, CU014]
    tableRefs: [TU001, TU002]
  - id: acquisition-deployment-and-expansion
    title: Acquisition, deployment, and expansion motions
    body: >-
      Entry paths are designed to reduce adoption friction. Businesses can start
      free for up to 30 devices, while paid business plans use per-device pricing
      and a 30-license minimum. Schools have a separate free and annual
      per-device ladder. Mosyle says more than 90% of customers buy directly,
      which limits traditional reseller dependence but also concentrates
      acquisition in the vendor's self-service and direct model. The 2024 Fuse
      MSP launch creates a second channel for managed-service providers, although
      no MSP account, device, or revenue contribution is disclosed. For switchers,
      Mosyle describes an extended trial and first-year migration credit after
      having helped thousands of organizations migrate; these are conversion
      mechanisms, not evidence of renewal or durable expansion.
    claimRefs: [CU006, CU007, CU008, CU009, CU010, CU011]
    figureRefs: [FU001]
  - id: reference-quality-and-customer-voice
    title: Reference quality and customer voice
    body: >-
      Public reference quality is weak relative to the scale claims. Mosyle
      explicitly says it does not display customer logos, so the reviewed pool
      provides no named organization whose production deployment, outcome, or
      renewal can be checked. The strongest external customer signal is therefore
      aggregated: InvGate summarizes generally positive feedback on support,
      usability, automation, and value, while also identifying requests for
      better iPad authentication, API functionality, and documentation. A
      competitor-hosted comparison says it uses G2 Fall 2025 feedback and other
      public materials, but its issuer and comparative purpose limit independence.
      These signals support product-market relevance, not named deployment proof
      or quantified customer outcomes.
    claimRefs: [CU013, CU014, CU016]
    tableRefs: [TU003]
  - id: durability-and-concentration
    title: Durability, concentration, and underwriting gaps
    body: >-
      Durability cannot be underwritten from the public record. None of the
      assigned sources discloses gross or net retention, logo churn, renewal
      rates, contract length, cohort expansion, top-customer revenue share, or
      revenue concentration by business, education, or MSP channel. The direct
      purchasing claim suggests limited reseller dependence, but it does not
      establish diversified demand or low customer concentration. Likewise,
      millions of managed devices and large organization counts do not reveal
      paying status, recurring revenue, or retention. Diligence should reconcile
      the three current count labels to a dated paying-customer bridge and obtain
      cohort and concentration schedules before assigning value to the apparent
      installed-base scale.
    claimRefs: [CU001, CU002, CU003, CU005, CU006]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Public scale signal
      - Revenue or strategic value
      - Diligence gap
    rows:
      - - K-12 schools and districts
        - District or school IT buys; administrators and teachers operate; schools or districts pay
        - Apple MDM, classroom workflows, identity, filtering, and endpoint security
        - Company claims more than 20,000 schools and millions of devices
        - Dedicated annual per-device plans and an education-specific product
        - No named deployments, paying-school denominator, retention, or geographic mix
      - - Businesses and enterprises
        - IT or security teams buy and administer; employees use corporate and BYOD Apple endpoints; organizations pay
        - Device management, security, identity, privacy, and app lifecycle
        - Current company pages conflict between more than 65,000 organizations, more than 47,000 organizations, and almost 50,000 customers
        - Direct per-device subscriptions spanning free, premium, and Fuse tiers
        - Definitions, paying status, segment revenue, and customer concentration are undisclosed
      - - Small businesses and BYOD teams
        - Lean IT teams buy and administer; employees use managed or personal Apple devices; employer pays
        - Low-friction device enrollment, configuration, and protection
        - A Mosyle survey reported by Computerworld says roughly 70% of surveyed SMB organizations preferred one provider
        - Free entry tier can seed paid conversion as fleets exceed 30 devices
        - Survey sample and method, free-to-paid conversion, and SMB churn are unavailable
      - - Managed service providers
        - MSP operators buy and administer; client organizations and end users consume the service
        - Multi-customer Apple management and security through Fuse MSP
        - Product launch is documented, but no MSP adoption metric is public
        - Potential indirect reach and managed-service channel expansion
        - MSP accounts, devices, revenue contribution, retention, and partner concentration are undisclosed
    notes: >-
      Segments synthesize the assigned public sources; all scale figures are
      company claims or company-attributed survey results, and null metrics are
      treated as diligence gaps rather than zeros.
    claimRefs: [CU001, CU002, CU003, CU005, CU006, CU007, CU008, CU009, CU012, CU014, CU015]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Evidence period
      - Source character
      - Confidence
      - Implication
      - Missing denominator or qualification
    rows:
      - - Total customers
        - "32,000"
        - May 2022
        - TechCrunch report
        - Medium
        - Establishes a dated historical adoption baseline
        - Customer definition, paying share, and segment split were not disclosed
      - - Worldwide organizations
        - More than 47,000
        - Current page accessed 2026-10-20
        - Company claim
        - Low
        - Indicates broad organization reach if measured consistently
        - Conflicts with another current company page and lacks a vintage
      - - Worldwide organizations
        - More than 65,000
        - Current page accessed 2026-10-20
        - Company claim
        - Low
        - Would imply material expansion beyond the 2022 baseline
        - Conflicts with the 47,000-organization page and the almost-50,000-customer statement
      - - Customers
        - Almost 50,000
        - Current page accessed 2026-10-20
        - Company claim on the same business page as the 65,000-organization statement
        - Low
        - Demonstrates that the company uses customer and organization labels differently or inconsistently
        - No definition, vintage, or reconciliation to organizations and paying accounts
      - - Schools
        - More than 20,000 schools managing millions of devices
        - Five years after product release; calendar date not stated
        - Company claim
        - Low
        - Supports a substantial education footprint
        - Paying-school share, device count, geography, and retention are not disclosed
    notes: >-
      Values preserve each source's metric name and period. Customer,
      organization, school, account, and device denominators are not treated as
      interchangeable, and no growth rate is calculated from incomparable points.
    claimRefs: [CU001, CU002, CU003, CU004, CU005]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs. pilot
      - Public outcome
      - Limitation
    rows:
      - - No public name disclosed
        - Large company, global brand, government entity, or nonprofit
        - Apple device management and protection
        - Not verifiable from assigned sources
        - Company says these cohorts are among organizations managing millions of Apple devices
        - Mosyle intentionally withholds logos; no named outcome or renewal evidence
      - - No public name disclosed
        - K-12 school or district
        - Education-specific MDM, classroom workflows, identity, filtering, and security
        - Company describes daily management, but individual deployments cannot be checked
        - Company claims more than 20,000 schools and millions of devices
        - No named school, deployment date, outcome baseline, or retention evidence
      - - No public name disclosed
        - Organization migrating from another Apple management provider
        - Side-by-side trial, onboarding, and migration
        - Company says it has helped thousands migrate; individual status is unavailable
        - Migration program offers up to six months of trial and a first-year credit
        - No named switcher, conversion rate, post-migration outcome, or renewal evidence
    notes: >-
      This is a partial enumeration of the customer-proof categories present in
      the assigned source pool. It is not a list of named references because no
      assigned source identifies a customer that can be verified.
    enumerationScope:
      coverage: partial
      basis: >-
        All customer-proof categories found across the eight successful
        recommended sources assigned to this chapter.
    claimRefs: [CU004, CU005, CU010, CU011, CU012, CU013, CU016]
figures:
  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      Publicly described touchpoints reduce trial and migration friction, but the
      sources do not disclose conversion, renewal, or expansion rates.
    data:
      items:
        - label: Discover
          detail: Business, school, and MSP-specific pages frame Apple management and security use cases.
          touchpoints:
            - Product and pricing pages
            - Third-party reviews and comparisons
        - label: Trial
          detail: Business prospects can start with a free tier or trial before paid deployment.
          touchpoints:
            - Free tier for up to 30 business devices
            - Extended migration trial
        - label: Onboard
          detail: Mosyle offers personalized onboarding and support as part of the adoption motion.
          touchpoints:
            - Onboarding specialist
            - Configuration guidance
        - label: Deploy
          detail: IT teams enroll, configure, secure, and patch corporate or school Apple fleets.
          touchpoints:
            - Corporate-issued and BYOD endpoints
            - School and classroom devices
        - label: Expand
          detail: Customers can add devices, security modules, identity capabilities, or MSP-managed estates.
          touchpoints:
            - Premium and Fuse tiers
            - Fuse MSP
        - label: Migrate or renew
          detail: Mosyle targets switchers with side-by-side evaluation and a first-year incentive, while renewal metrics remain private.
          touchpoints:
            - Up to six-month extended trial
            - Migration incentive credit
    approximationNotes: >-
      This is a conceptual sequence synthesized from disclosed customer
      touchpoints, not a measured funnel; no conversion, renewal, or expansion
      rates are inferred.
    claimRefs: [CU007, CU008, CU009, CU010, CU011, CU013, CU014]
callouts:
  - calloutType: risk
    title: Scale is not the same as durable revenue
    body: >-
      Public scale labels conflict, named deployments are intentionally withheld,
      and no retention or concentration schedule is available. Underwriting
      should rely on a company-provided reconciliation of paying accounts,
      devices, cohorts, renewals, and top-customer revenue rather than headline
      organization counts.
    claimRefs: [CU001, CU002, CU003, CU004, CU016]
