      - ["Windows / Linux / Android breadth", "No; Apple-only", "Apple-first; Firstbase reports Android Enterprise added in 2025-2026", "Mac and Windows", "NinjaOne, Scalefusion, JumpCloud, and Hexnode cover multiple OS families", "Coverage does not establish equivalent per-OS depth"]
      - ["Endpoint security bundled", "Yes; official claim for Fuse", "Jamf Protect described as separate", "Security integrated", "Unknown or vendor-specific", "Packaging evidence is vendor-authored"]
      - ["Identity and SSO", "Mosyle Auth 2 integrated", "Jamf Connect described as separate", "Passwordless identity and SSO integrated", "JumpCloud identity-led; other cells unknown", "No independent identity-depth test"]
      - ["Compliance automation", "Hardening and compliance templates claimed", "CIS and CVE capabilities described; some require Protect", "Framework and evidence automation claimed", "Scalefusion baseline described; others unknown", "Comparison sources have commercial incentives"]
