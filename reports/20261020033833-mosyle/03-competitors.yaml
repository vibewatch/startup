    claimRefs: [CP002, CP005, CP008]
figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: >-
      Ordinal positioning separates Apple specialization from breadth of the described management,
      identity, security, and compliance control plane.
    data:
      xAxis:
        label: "Apple specialization"
        min: 1
        max: 5
        low: "Multi-OS"
        high: "Apple-only"
        description: "Ordinal analyst score from described operating-system coverage"
      yAxis:
        label: "Integrated control-plane breadth"
        min: 1
        max: 5
        low: "Device management"
        high: "Management + identity + security + compliance"
        description: "Ordinal analyst score from capabilities described in assigned evidence"
      points:
        - label: Mosyle
          x: 5
          y: 5
          note: "Apple-only suite spanning management, security, identity, filtering, and patching"
        - label: Jamf
          x: 4.5
          y: 4.5
          note: "Apple-first enterprise suite; some capabilities described as separate modules"
        - label: Iru
          x: 2
          y: 5
          note: "Mac and Windows with identity and compliance automation"
        - label: NinjaOne
          x: 1.5
          y: 3
          note: "Cross-platform endpoint management and RMM"
        - label: Scalefusion
          x: 1
          y: 2.5
          note: "Broad multi-OS UEM and kiosk coverage"
        - label: JumpCloud
          x: 2
          y: 4
          note: "Cross-platform identity-led directory and device management"
    approximationNotes: >-
      Coordinates are evidence-backed ordinal analyst scores, not product benchmarks or measured
      market positions; a one-point difference should not be read as a quantified performance gap.
    claimRefs: [CP014]
callouts:
  - calloutType: strength
    title: Price-to-scope is the clearest wedge
    body: >-
      Mosyle publishes low per-device prices while bundling Apple management, security, identity,
      filtering, and patching; the assigned evidence does not establish realized discounts or
      feature-quality parity.
    claimRefs: [CP001, CP002, CP008]
  - calloutType: risk
    title: Scale and reliability evidence is not decision-grade
    body: >-
      Three current Mosyle surfaces report different organization counts, and the most specific
      reliability criticism comes from a commercially interested adjacent vendor rather than an
      independent technical benchmark.
    claimRefs: [CP006, CP010, CP011, CP012]
