      - ["Mosyle Fuse for macOS", "$3.00", "Per device per month; 30-license minimum; billed annually", "Management, security, identity, privacy, and patching", "Company list price; realized discounts unknown"]
      - ["Mosyle Fuse for iOS, iPadOS, and visionOS", "$1.50", "Per device per month; 30-license minimum; billed annually", "Integrated portable-device bundle", "Company list price; realized discounts unknown"]
      - ["Mosyle Manager Premium", "$5.50", "Per device per year", "Education MDM, support, classroom tools, automation, and app catalog", "Company list price"]
      - ["Mosyle education integrated tier", "$9.00", "Per device per year", "Premium plus Auth 2, filtering/security, app hosting, and endpoint security", "Company list price"]
      - ["Jamf Now", "$4.00", "Per device per month", "Entry Apple management", "Third-party vendor comparison; current official quote not retained"]
      - ["Jamf for Mac full stack", "$12.50", "Per device per month", "Management plus modular security and identity comparison", "Third-party vendor comparison; scope equivalence and discounts unknown"]
    notes: >-
      Prices are public list figures, not realized contract pricing, revenue, or margin; Jamf values
