artifact: market-analysis
slug: mosyle
runDate: 2026-10-20
company:
  name: Mosyle
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Mosyle addresses an Apple-only slice of endpoint management spanning business,
    education, and MSP workflows, with low published entry prices but no public
    evidence that isolates a defensible company-specific TAM, SAM, or SOM. Broad
    MDM forecasts, historical enterprise Mac penetration, and conflicting company
    reach claims provide useful demand signals, not an investable market-size bridge.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      Mosyle competes for spending on Apple device enrollment, policy enforcement,
      application deployment and patching, identity, endpoint security, privacy,
      and compliance workflows. The relevant boundary is narrower than unified
      endpoint management because Mosyle manages Apple platforms only; Windows,
      Android, and Linux fleets fall outside its native scope. Within that boundary,
      the economic alternatives include Apple-specialist suites, cross-platform
      endpoint tools, separate security and identity products, and continued manual
      administration. The status quo remains credible for very small fleets, but
      recurring onboarding, update, inventory, and exception work creates the
      operational trigger for formal management. This definition avoids treating
      all endpoint-security or all device-management spend as directly addressable.
    claimRefs: [CM001, CM004, CM012, CM014]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Evidence-constrained sizing
    body: >-
      The available evidence does not reconcile to a Mosyle-specific TAM, SAM, or
      SOM. A 2022 TechCrunch article relayed a MarketsandMarkets forecast that the
      global MDM market would rise from $5.5 billion in 2021 to $20.4 billion in
      2026, but that forecast is broad, old, and not Apple-specific. A 2021 Mosyle
      release cited IDC for macOS representing 23% of computers at U.S. companies
      with at least 1,000 employees in 2020, another historical demand indicator
      rather than spending data. Live Mosyle pages also disagree on organizational
      reach, stating more than 65,000 organizations on the business page and more
      than 47,000 on the main site. These lenses establish opportunity and traction
      signals while leaving fleet counts, addressable device volumes, conversion,
      and obtainable share unresolved.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM015]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-budgets
    title: Buyers, users, and budget ownership
    body: >-
      The buying center changes by segment. Business deployments are typically
      sponsored by IT or security leaders who need repeatable enrollment, patching,
      compliance, and offboarding across Apple fleets. K-12 deployments add school
      technology leadership, classroom administrators, shared-device workflows,
      student turnover, and annual per-device budgeting. MSPs need multi-tenant
      administration for Apple-focused client accounts. Users are employees,
      teachers, students, and administrators, while the payer is usually a central
      IT, security, district, or managed-services budget owner. Published pricing
      creates a low entry point, but the 30-license minimum on paid business plans
      means the smallest paid deployment starts above a single-device price quote.
    claimRefs: [CM002, CM003, CM004, CM010, CM011]
    tableRefs: [TM003]
  - id: adoption-drivers-constraints
    title: Adoption drivers and constraints
    body: >-
      Adoption is supported by larger Apple fleets, distributed work, zero-touch
      deployment, tighter security expectations, and the appeal of replacing
      multiple tools with one Apple-specific platform. Price can accelerate a
      shortlist: Mosyle publishes $1 per device per month for Business Premium and
      $5.50 per device per year for Education Premium. Constraints are equally
      material. Mixed fleets may favor a cross-platform control plane, organizations
      still need policy ownership and Apple Business or School Manager readiness,
      and an independent 2026 review reports thin documentation, shallow API
      coverage, and compliance-data limitations. Buyers therefore must validate
      actual fleet mix, integrations, support, migration work, and security evidence
      before converting low list prices into a durable ROI case.
    claimRefs: [CM010, CM011, CM012, CM013, CM016]
tables:
  - id: TM001
    title: Market definition and substitution boundary
    columns: [Segment or category, Included spend, Excluded or substitute spend, Buyer or payer, Mosyle relevance]
    rows:
      - [Business Apple fleets, "Apple enrollment, MDM, patching, identity, endpoint security, privacy, and compliance", "Native Windows, Android, and Linux management", "IT and security leadership", "Core Apple-only business market"]
      - [K-12 Apple programs, "School MDM, shared devices, classroom workflows, filtering, security, and app deployment", "Non-Apple classroom-device administration", "District or school technology budget", "Core education market"]
      - [Apple-focused MSPs, "Multi-tenant management and security for client Apple fleets", "General-purpose service management unrelated to endpoints", "MSP operations or service owner", "Channel and managed-service adjacency"]
      - [Cross-platform endpoint suites, "Apple devices inside a wider mixed-fleet contract", "Apple-specialist depth purchased separately", "Enterprise IT procurement", "Direct substitute when breadth outranks Apple depth"]
      - [Manual administration, "Checklists, one-off setup, informal inventory, and troubleshooting", "Formal recurring software license", "Small-team IT owner", "Status-quo substitute until recurring workload or risk forces standardization"]
    notes: "Boundary is evidence-constrained: it separates Apple-only workflows from mixed-fleet spend and treats manual administration as a substitute, not as software revenue."
    claimRefs: [CM001, CM002, CM003, CM004, CM012, CM014]
  - id: TM002
    title: Market sizing and adoption lenses
    columns: [Lens, Period and geography, Reported value, Method or denominator, Confidence, Limitation]
    rows:
      - ["Global mobile device management forecast", "2021 actual/base and 2026 forecast; global", "$5.5B in 2021 to $20.4B in 2026", "MarketsandMarkets forecast relayed by TechCrunch in 2022", Low, "Broad MDM category; stale forecast; not Apple-specific or Mosyle-addressable"]
      - ["Enterprise Mac penetration", "2020; U.S. companies with at least 1,000 employees", "23% of computers, up from 17% in 2019", "IDC MarketScape statistic quoted in a Mosyle release", Low, "Historical installed-base share; company-issued relay; not spending or device volume"]
      - ["Business-site reach claim", "Live page accessed 2026-10-20; worldwide", "Over 65,000 organizations", "Mosyle company claim; denominator described as organizations", Medium, "Unaudited and inconsistent with another live Mosyle page"]
      - ["Main-site reach claim", "Live page accessed 2026-10-20; worldwide", "Over 47,000 organizations", "Mosyle company claim; denominator described as organizations", Low, "Conflicts with the business-site claim and may reflect page-vintage drift"]
      - ["Education reach claim", "Live page accessed 2026-10-20; worldwide", "Over 20,000 schools", "Mosyle company claim; school denominator", Medium, "Potential subset of organizations; cannot be added to company-wide reach"]
      - ["Published price anchors", "Live pages accessed 2026-10-20", "$1/device/month business; $5.50/device/year education", "List prices, with a 30-license minimum on paid business plans", Medium, "No public fleet distribution, discounting, attach rate, or conversion data"]
    notes: "Values retain each source's period, geography, and denominator. They are separate lenses and must not be summed or treated as a TAM/SAM/SOM bridge."
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010, CM011]
  - id: TM003
    title: Segment, buyer, payer, and adoption map
    columns: [Segment, Buyer, User, Payer or budget owner, Workflow and adoption trigger]
    rows:
      - ["Apple-first SMB", "IT administrator or operations lead", "Employees and IT admins", "Central IT or operations budget", "Recurring onboarding, app deployment, updates, inventory, and offboarding exceed manual capacity"]
      - ["Apple-focused enterprise team", "CIO, CISO, endpoint, or security leader", "Employees, security analysts, and endpoint admins", "Enterprise IT or security budget", "Distributed fleets require standardized compliance, identity, patching, and incident controls"]
      - ["K-12 school or district", "Technology director or school IT lead", "Students, teachers, and school admins", "District or school technology budget", "Shared devices, classroom setup, student turnover, filtering, and annual device programs"]
      - ["Apple-focused MSP", "MSP owner or service operations lead", "MSP technicians and client admins", "Managed-services operating budget passed into client contracts", "Multiple Apple-only client accounts require repeatable multi-tenant policies"]
      - ["Mixed-fleet organization", "Enterprise endpoint-management owner", "Employees and cross-platform IT admins", "Unified endpoint-management budget", "Apple depth must outweigh the efficiency of one Windows, Android, and Apple control plane"]
    notes: "The map is a representative segmentation, not an exhaustive customer enumeration; budget ownership should be confirmed in customer interviews."
    claimRefs: [CM002, CM003, CM004, CM012, CM013]
figures:
  - id: FM001
    title: Evidence ladder from broad category to Mosyle price anchors
    type: pyramid
    summary: >-
      Six non-comparable evidence layers narrow from a broad MDM forecast to
      company reach and price signals without claiming a TAM/SAM/SOM conversion.
    data:
      items:
        - label: Global MDM forecast
          value: "$20.4B"
          unit: "2026 forecast"
          detail: "MarketsandMarkets forecast relayed by TechCrunch in 2022; broad category, not Apple-specific."
        - label: Enterprise Mac penetration
          value: "23%"
          unit: "2020 computer share"
          detail: "U.S. companies with at least 1,000 employees; IDC statistic quoted by Mosyle."
        - label: Business-site reach
          value: ">65,000"
          unit: "organizations"
          detail: "Unaudited live-page company claim accessed 2026-10-20."
        - label: Main-site reach
          value: ">47,000"
          unit: "organizations"
          detail: "Conflicting unaudited company claim from a different live Mosyle page."
        - label: Education reach
          value: ">20,000"
          unit: "schools"
          detail: "Company-reported education subset; not additive to organization counts."
        - label: Business Premium entry
          value: "$1.00"
          unit: "per device per month"
          detail: "Published list price with a 30-license minimum and annual billing."
    approximationNotes: >-
      Layer order reflects analytical narrowing, not magnitude or conversion.
      Values use different units, periods, populations, and evidence quality;
      no layer is derived from another and widths must not be read as proportional.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010, CM015]
callouts:
  - calloutType: risk
    title: Public evidence does not close market sizing
    body: >-
      A broad MDM forecast, historical Mac penetration, unaudited reach claims,
      and list prices cannot produce a Mosyle-specific TAM, SAM, or SOM without
      segment fleet counts, paid conversion, attach rates, and geographic mix.
    claimRefs: [CM015]
  - calloutType: insight
    title: Apple specialization is both the wedge and the ceiling
    body: >-
      Apple-first organizations can value integrated, platform-specific workflows,
      while mixed-fleet buyers may prioritize one cross-platform control plane.
    claimRefs: [CM001, CM012]
