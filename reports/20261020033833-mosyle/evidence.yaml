evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current executive roster, board composition, committee structure, investor rights, ownership, and founder
      succession plan.
    whyItMatters: >-
      Governance coverage determines key-person exposure, control, and the practical rights attached to the
      preferred-equity stack.
    diligencePath: >-
      Request the current cap table, charter, bylaws, voting agreement, investor-rights agreement, board minutes,
      organization chart, and succession plan.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      A financing schedule reconciling the $196 million Series B, the company's $215 million figure, Tracxn's $247
      million total, and any secondary component.
    whyItMatters: Funding raised is not cash available, and secondary proceeds do not fund company operations.
    diligencePath: >-
      Reconcile bank statements, closing binders, share-purchase agreements, and the capitalization ledger by round and
      recipient.
    relatedQuestionRefs:
      - QO003
      - QO007
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: >-
      Dated customer and device cohort data using consistent definitions for organizations, accounts, schools, paid
      customers, and active devices.
    whyItMatters: >-
      Without common denominators and vintages, public scale claims cannot support growth, penetration, or retention
      analysis.
    diligencePath: >-
      Obtain monthly CRM and billing exports with cohort definitions, active-device logic, customer status, and
      reconciliations to invoicing.
    relatedQuestionRefs:
      - QO004
      - QO007
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Audited revenue, ARR, gross margin, retention, burn, runway, debt, current valuation, and dated headcount.
    whyItMatters: These metrics are necessary to assess operating quality, financing need, and valuation support.
    diligencePath: >-
      Request audited financials, ARR and retention bridges, cash and debt schedules, latest 409A or financing
      valuation, and a dated payroll roster.
    relatedQuestionRefs:
      - QO004
      - QO007
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: >-
      Company-specific legal, regulatory, privacy, breach, and outage history from authoritative records and dated
      incident logs.
    whyItMatters: The absence of an event in the assigned source pool does not establish that no event occurred.
    diligencePath: >-
      Review litigation and regulatory searches, security incident and outage logs, cyber-insurance claims,
      penetration-test summaries, and customer notification records.
    relatedQuestionRefs:
      - QO007
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Current segment-level fleet counts, paid-device mix, attach rates, customer geography, conversion, retention, and
      average realized price needed to build a Mosyle-specific TAM/SAM/SOM.
    whyItMatters: >-
      Without common denominators, broad category estimates and company reach claims cannot establish obtainable revenue
      or valuation support.
    diligencePath: >-
      Request management's market model and anonymized billing export, then reconcile devices, organizations, schools,
      paid conversion, and realized price by segment and geography.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: organization-reach
    missingEvidence: >-
      A dated, reconciled definition for the more-than-65,000 and more-than-47,000 organization claims, including
      whether either count includes free, inactive, school, or MSP-managed accounts.
    whyItMatters: Conflicting denominators prevent reliable adoption, penetration, and revenue-per-organization analysis.
    diligencePath: >-
      Obtain a dated customer bridge from Mosyle showing active paid organizations, free organizations, schools, MSP end
      customers, and managed devices.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: stale
    severity: material
    topic: independent-market-data
    missingEvidence: >-
      Current independent Apple-enterprise penetration, Apple endpoint-management spending, and segment growth data
      published near the 2026 run date.
    whyItMatters: The cited category forecast and enterprise Mac share are historical and may not describe the current demand curve.
    diligencePath: >-
      Commission or obtain current IDC, Gartner, Canalys, or equivalent datasets with Apple-specific device and
      endpoint-management spending cuts.
    relatedQuestionRefs:
      - QM002
      - QM005
      - QM006
  - type: private-evidence-only
    severity: material
    topic: competitor-scale
    missingEvidence: >-
      Current, comparable revenue, customer, device, funding, retention, and win-rate evidence for Mosyle and each
      material competitor.
    whyItMatters: Product descriptions cannot establish competitive scale, sales momentum, or durability of the installed base.
    diligencePath: >-
      Obtain a management win/loss cohort, competitor battlecards with underlying CRM records, current cap tables, and
      independently sourced peer scale metrics.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
  - type: conflicting-data
    severity: material
    topic: organization-count
    missingEvidence: >-
      A dated reconciliation of the 47,000, 60,000, and 65,000-plus organization counts, including whether customers,
      schools, organizations, and accounts use the same denominator.
    whyItMatters: Unreconciled company surfaces prevent a defensible installed-base comparison or growth calculation.
    diligencePath: >-
      Request monthly customer and organization bridge data with additions, churn, mergers, education/business splits,
      and a written metric definition.
    relatedQuestionRefs:
      - QP008
  - type: missing-source
    severity: material
    topic: independent-product-benchmark
    missingEvidence: >-
      Independent technical tests of policy execution, patch latency, endpoint detection, reliability, support response,
      and Apple-release readiness across Mosyle and Jamf.
    whyItMatters: >-
      Most detailed feature and reliability comparisons in the assigned pool were issued by commercially interested
      vendors.
    diligencePath: >-
      Commission a controlled proof of concept on matched devices and collect reference calls from comparable enterprise
      and K-12 administrators.
    relatedQuestionRefs:
      - QP006
      - QP008
    relatedTableRefs:
      - TP002
  - type: enumeration-incomplete
    severity: minor
    topic: status-quo-alternatives
    missingEvidence: >-
      A complete cost and control map for internal administration using native Apple services and separate security,
      identity, and patching tools.
    whyItMatters: The status quo may be a material substitute even when buyers do not select another bundled vendor.
    diligencePath: >-
      Interview lost prospects and compare their current tool stack, staffing load, incident rate, and three-year total
      cost with Mosyle.
    relatedQuestionRefs:
      - QP001
      - QP005
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Current ARR, GAAP revenue, realized pricing, gross margin, CAC, payback, retention, and customer-concentration
      data.
    whyItMatters: >-
      Without these metrics, list pricing and customer counts cannot establish revenue quality, operating leverage, or
      durable unit economics.
    diligencePath: >-
      Obtain audited statements, a monthly ARR and revenue bridge, invoice-level pricing cohorts, gross-margin
      allocations, and retention schedules.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: stale
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      A current cash balance, monthly burn, runway, debt schedule, contractual obligations, and board-approved operating
      plan.
    whyItMatters: The 2022 cash figure cannot establish 2026 liquidity or the timing and terms of any next financing.
    diligencePath: >-
      Reconcile the May 2022 cash figure through current bank statements, financing records, cash-flow statements, and
      the latest board plan.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: traction
    missingEvidence: >-
      Definitions, dates, overlap, and paid status for the disclosed 65,000 organizations, almost 50,000 customers, and
      more than 20,000 schools.
    whyItMatters: >-
      Different denominators cannot be combined or converted into revenue without risking double counting and including
      free accounts.
    diligencePath: >-
      Request a dated customer census reconciled by segment, paid status, organization, account, school, device, and
      contract.
    relatedQuestionRefs:
      - QI005
  - type: missing-source
    severity: material
    topic: assurance-gap
    missingEvidence: >-
      Independent control attestations, penetration-test scope, vulnerability history, incident history, uptime records,
      and security-efficacy benchmarks.
