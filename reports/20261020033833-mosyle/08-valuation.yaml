callouts:
  - calloutType: recommendation
    title: Price is the missing variable
    body: >-
      Mosyle may be a strong company and still be a poor investment at the wrong terms.
      Public evidence supports diligence on product and scale, but not a numeric entry price,
      target return, or liquidation outcome.
    claimRefs: [CV004, CV013, CV014]
