    title: Recommendation summary
    columns: [Dimension, Assessment, Evidence basis, Decision implication]
    rows:
      - [Recommendation, "Research more", "Product and pricing signals are credible, but current financial and valuation inputs are not independently verified.", "Do not approve an investment before the operating and financing packet is reconciled."]
      - [Confidence, Medium, "Independent reporting confirms the 2022 round, while current financing databases conflict.", "Confidence applies to the need for diligence, not to a numeric fair value."]
      - [Risk rating, High, "Low prices, company-issued scale claims, Apple concentration, and opaque preferences leave material downside uncertainty.", "Require downside protection and explicit thesis-break covenants if diligence advances."]
      - [Valuation stance, Indeterminate, "The 2022 valuation was undisclosed and public multiples cannot be applied without Mosyle revenue and margin data.", "Set no target price or return until current ARR, net cash, and fully diluted ownership are verified."]
    notes: "Assessments use only retained public evidence; missing private financial and cap-table data prevent a numeric valuation."
    claimRefs: [CV003, CV004, CV007, CV009, CV012, CV013, CV014]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Side, Argument, Supporting signal, What would change the view]
    rows:
      - [Thesis, "Integrated Apple-only management and security can consolidate customer tooling.", "Official pages describe management, security, identity, privacy, and application functions in one platform.", "Independent win-rate, retention, and attach-rate evidence would strengthen the claim."]
      - [Thesis, "Low published pricing and direct distribution may support efficient adoption.", "Business pricing starts at $1 per device per month, and Mosyle says more than 90% of customers buy directly.", "Verified gross margin, CAC payback, and cohort expansion would show whether low pricing creates durable value."]
      - [Anti-thesis, "Public scale and financing records are not internally reconcilable.", "Retained sources report different funding totals and first-party organization counts.", "Signed financing documents and a dated customer bridge would remove this uncertainty."]
      - [Anti-thesis, "Apple concentration and incomplete financial disclosure can make headline scale misleading.", "The platform is Apple-specific, while ARR, retention, margin, burn, debt, and runway remain unavailable in retained public evidence.", "Audited economics and proof of durable Apple fleet growth could reduce the risk."]
    notes: "Thesis signals are primarily company-issued; anti-thesis rows identify the independent evidence needed to validate them."
    claimRefs: [CV001, CV002, CV003, CV007, CV009, CV010, CV014, CV015, CV016]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Case, Explicit assumptions, Valuation and return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Claimed scale converts into strong net retention; integrated modules expand revenue; low-cost direct distribution preserves healthy margins.", "No public numeric range is supportable; underwrite only after verified ARR, growth, margin, and net cash justify a selected software multiple.", "Company-issued metrics may not reconcile to paying customers or recurring revenue.", "Weight rises with audited growth, greater than 100% net retention, durable free cash flow, and clean preferences."]
      - [Base, "Mosyle remains a credible Apple specialist with useful product breadth, but financial quality and 2026 financing remain unverified.", "Treat fair value and target return as unquantified; negotiate from verified current metrics rather than aggregator round or comp data.", "Moderate growth, low pricing, and Apple concentration could cap the applicable multiple.", "Most consistent with the present evidence and supports research-more."]
      - [Bear, "Customer denominators overstate economic scale; channel incentives pressure margins; financing or preferences dilute common equity.", "Downside cannot be bounded without a liquidation waterfall; reject any price premised on the high end of cited software multiples.", "Retention weakness, cash burn, preference overhang, platform concentration, and multiple compression.", "Weight rises if financing records cannot be reconciled or verified economics miss management claims."]
    notes: "Scenario ranges are intentionally unquantified because the retained sources disclose neither current Mosyle revenue nor a verified current valuation."
    claimRefs: [CV003, CV007, CV009, CV010, CV011, CV012, CV013, CV014, CV015, CV016]
