company:
  name: Mosyle
chapter:
  number: 8
  title: Valuation
  summary: >-
    Mosyle shows credible product breadth, low published pricing, and substantial first-party
    scale claims, but the public record does not support a defensible current enterprise value
    or target return. The recommendation is research-more with medium confidence, high risk,
    and an indeterminate valuation stance until financing, cap-table, retention, and current
    financial evidence are reconciled.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The appropriate public-evidence decision is research-more, not buy. Mosyle's integrated
      Apple management and security scope, published price points, and claimed organizational
      reach make the company worth continued diligence, but those signals do not establish
      recurring revenue, growth, retention, gross margin, cash generation, or a supportable
      current valuation. The retained evidence therefore supports medium confidence in the
      direction of the call but low confidence in any price or target return. Risk is high
      because the central underwriting inputs are private, while the valuation stance is
      indeterminate rather than cheap or expensive. Entry should be contingent on a verified
      operating packet and a fully diluted capitalization and preference schedule; without
      those materials, even a strong product view cannot be translated into return
      underwriting.
    claimRefs: [CV007, CV008, CV010, CV012, CV014, CV015]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-and-comparable-context
    title: Financing and comparable context
    body: >-
      The financing record is not clean enough to anchor price. Multiples reports $348 million
      raised across six rounds and a $100 million April 2026 round, while Tracxn reports $247
      million and identifies the 2022 Series B as the latest round. Multiples' April 2026 row
      also contains narrative describing the 2022 financing, which creates a specific
      reconciliation problem rather than fresh proof. TechCrunch reported that Mosyle declined
      to disclose its valuation in the 2022 round, and the retained sources provide no
      independently verified current post-money value. Public and private software multiples
      listed by Multiples are context only: Mosyle lacks the disclosed revenue, ARR, margin,
      growth, and net-cash inputs needed to select or apply a multiple. A term sheet, investor
      confirmation, and audited financials must supersede aggregator figures.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV013]
    tableRefs: [TV002]
  - id: scenarios-and-return-logic
    title: Scenario and return logic
    body: >-
      The bull case depends on converting Mosyle's claimed scale, integrated suite, direct
      distribution, and low pricing into durable retention and efficient expansion. The base
      case assumes a useful Apple-focused platform but with insufficient evidence to quantify
      an enterprise-value range or exit return. The bear case combines Apple-platform
      concentration, low price points, potentially expensive channel incentives, inconsistent
      first-party scale disclosures, and unresolved financing data. None of these cases can
      responsibly carry a numeric valuation range from public evidence alone. The probability
      signal is therefore diligence-based: the bull case gains weight only with independently
      reconciled ARR, net retention, gross margin, free cash flow, and customer cohorts; the
      bear case gains weight if those metrics miss, if a preference overhang is material, or
      if a proposed entry price assumes unsupported software multiples.
    claimRefs: [CV003, CV007, CV008, CV009, CV010, CV011, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness, diligence asks, and thesis-break triggers
    body: >-
      Public evidence does not establish exit readiness. The company has financing history,
      claimed scale, and a product positioned across education, business, and MSP channels, but
      there is no retained audited operating series, current ownership schedule, liquidation
      waterfall, or verified valuation mark. Final diligence should obtain monthly ARR and
      revenue bridges, gross margin by product, logo and dollar retention, burn and runway,
      debt, customer cohorts, the April 2026 financing documents, and all preference terms.
      The thesis should break if verified retention or cash generation is materially weaker
      than management claims, if customer counts cannot be reconciled to paying organizations,
      if preferences impair common-equity outcomes, or if the requested price requires a
      multiple unsupported by growth and margin evidence. A credible exit plan also needs
      named strategic-buyer logic or IPO-scale financial controls, neither of which is public.
    claimRefs: [CV001, CV002, CV003, CV009, CV011, CV012, CV013, CV014, CV016]
