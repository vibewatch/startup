  topStrengths:
    - Integrated Apple-only platform spans device management, security, identity, privacy, and application operations.
    - Transparent per-device list pricing and a predominantly direct distribution model may reduce adoption friction.
    - >-
      Independent reporting confirms a substantial $196 million Series B and a long operating history across education
      and business markets.
  topRisks:
    - Current ARR, revenue growth, margins, retention, cash, burn, debt, and valuation are not independently disclosed.
    - Apple-only specialization limits single-console coverage for customers with Windows, Android, or Linux fleets.
    - >-
      Public customer counts and financing totals use conflicting definitions and cannot support scale or capitalization
      underwriting.
    - >-
      Public product claims are not matched by current independent compliance, security-efficacy, or reliability
      assurance.
  unresolvedGaps:
    - Obtain audited financials and monthly ARR, revenue, gross-margin, retention, cash, burn, debt, and runway bridges.
    - >-
      Reconcile all financing rounds, primary and secondary proceeds, the reported April 2026 round, and the fully
      diluted capitalization and liquidation waterfall.
    - >-
      Reconcile organizations, paying customers, accounts, schools, devices, free accounts, and channel-managed
      customers by date and cohort.
    - >-
      Verify legal, privacy, security, incident, certification, and control-assurance history through authoritative
      records and company documentation.
    - Obtain named customer references plus renewal, concentration, support, migration, and product-usage evidence.
