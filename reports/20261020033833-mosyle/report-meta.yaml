companyProfile:
  summary: >-
    Mosyle is a founder-led, private Series B software company focused exclusively on Apple endpoints. Its platform
    combines device management, endpoint security, identity, online privacy, and application operations for businesses,
    schools, and managed service providers. Public evidence supports a broad product surface, per-device subscriptions,
    and meaningful adoption signals, but does not reconcile current customer scale, financing totals, ownership, or
    operating performance.
  foundedDate: null
  founders:
    - name: Alcyr Araujo
      role: Founder and CEO
      background: Led Mosyle from its 2012 education-software origins through its Apple device-management and security expansion.
      claimRefs:
        - CO003
        - CO004
  foundingLocation: Brazil
  headquarters: Winter Park, Florida, United States
  productSummary: >-
    Apple-only software spanning device management, endpoint security, encrypted-DNS privacy controls, identity and
    single sign-on, and application and patch management.
  customerFocus: Apple-centric businesses, K-12 schools and districts, and managed service providers.
  businessModel: >-
    Recurring per-device subscriptions with separate business and education packaging, free entry tiers, annual billing
    for paid business plans, and predominantly direct distribution.
  stage: Series B
  fundingStatus: >-
