      and Tracxn profile; it does not establish ownership percentages or control rights.
    enumerationScope:
      coverage: partial
      basis: "Investors and founder explicitly named in the retained financing and company-profile sources"
    claimRefs: [CO004, CO005, CO007, CO008, CO016]
