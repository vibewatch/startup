      final item is the run-date evidence snapshot, not a new operating event.
    claimRefs: [CO002, CO003, CO005, CO006, CO010, CO011, CO012, CO013, CO014]
callouts:
  - calloutType: strength
    title: Founder-led platform expansion
    body: >-
      The documented product sequence shows sustained expansion from education MDM
      into a multi-module Apple management and security platform.
    claimRefs: [CO003, CO004]
  - calloutType: risk
    title: Public scale is not a single KPI
    body: >-
      Organization, customer-account, school, and device figures use different
      populations and dates, so none should be treated as a reconciled current customer count.
    claimRefs: [CO010, CO011, CO012, CO013, CO014]
