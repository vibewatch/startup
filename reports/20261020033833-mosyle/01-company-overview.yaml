company:
  name: Mosyle
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Mosyle is a founder-led, Series B Apple device-management and security vendor
    whose product scope now spans management, endpoint security, identity, privacy,
    and application operations. Public evidence confirms a $196 million 2022 Series B
    and substantial adoption, but financing totals, customer denominators, current
    headcount, governance, valuation, and private operating metrics remain unreconciled.
sections:
  - id: identity-and-business
    title: Identity, product, and business model
    body: >-
      Mosyle is a Winter Park-based, Series B software company founded in 2012. Its
      original product was an iPad learning-management system in Brazil; TechCrunch
      reports that the company pivoted into Apple-only device management for U.S.
      schools in 2015, added a business product in 2018, and introduced the broader
      Fuse suite in 2021. Today Mosyle positions itself as an Apple-only unified
      platform integrating device management, endpoint security, online privacy,
      identity and single sign-on, and application and patch management. The
      commercial model is per-device software sold directly to education,
      business, and managed-service-provider segments. Current business pricing
      illustrates the subscription model, but pricing pages are company-issued and
      do not establish realized average selling price, revenue, or margins.
    claimRefs: [CO001, CO002, CO003, CO015]
    tableRefs: [TO001]
  - id: leadership-and-capital
    title: Founder leadership and capital structure
    body: >-
      Alcyr Araujo is the only operating executive consistently named in the
      retained evidence and is identified as founder and CEO. That continuity
      supports a coherent product history, but it also creates a material
      key-person and governance diligence question because the broader executive
      team, directors, ownership percentages, and investor rights are not public in
      this source set. The best-corroborated financing event is the $196 million
      Series B announced in May 2022, led by Insight Partners with StepStone Group,
      Elephant, and Album VC participating. Public cumulative figures do not
      reconcile: Tracxn reports $247 million over six rounds, while Mosyle describes
      a $215 million investment used in part to facilitate shareholder exits.
      Primary financing documents and a capitalization table are therefore needed
      before treating either number as cash raised or cash available.
    claimRefs: [CO004, CO005, CO006, CO007, CO008, CO009, CO016]
    tableRefs: [TO002, TO003]
  - id: scale-and-diligence
    title: Scale signals and evidence limits
    body: >-
      Mosyle's public surfaces indicate meaningful scale but use incompatible
      populations and vintages. The corporate page says more than 47,000
      organizations use Mosyle; the business page says more than 65,000
      organizations worldwide; and the MSP page says more than 52,000 individual
      customer accounts and seven million devices have joined since 2016. The
      education page separately says Mosyle Manager reached more than 20,000
      schools within five years of release. These disclosures can all be directionally
      consistent if organizations, accounts, schools, and cumulative sign-ups are
      different denominators, but they cannot be combined into one current customer
      count. The retained sources also do not establish current ARR, revenue, margin,
      retention, burn, runway, debt, valuation, or an unambiguous current headcount.
      TechCrunch flags broader privacy concerns around MDM, but the assigned evidence
      does not establish a Mosyle-specific legal, regulatory, breach, or outage event;
      that absence is an evidence gap, not proof that none occurred.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO016]
    figureRefs: [FO001]
