        title: 创始人领导与资本结构
        blocks:
          - type: paragraph
            body: >-
              在保留的证据中，持续被点名的唯一运营高管是创始人兼 CEO Alcyr
              Araujo。这种连续性支持清晰的产品演进，但也带来重大的关键人和治理尽调问题：更广泛的管理团队、董事、持股比例和投资人权利在本组来源中均未公开。最有力的融资证据是 2022 年 5 月宣布的 $196
              million Series B，由 Insight Partners 领投，StepStone Group、Elephant 和 Album VC 参与。公开累计数字无法相互勾稽：Tracxn 报告六轮融资共
              $247 million，而 Mosyle 称有一笔 $215 million 的投资，部分用于协助股东退出。因此，在把任一数字视为募得现金或可用现金前，都需要原始融资文件和股权结构表。
