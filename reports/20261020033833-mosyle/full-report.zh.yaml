      - number: '4.2'
        title: GTM 动作与交付经济性
        blocks:
          - type: paragraph
            body: >-
              Mosyle 称超过 90% 客户直接购买；若结构准确，就能减少经销商佣金和分销商加价。公司还描述旨在避免工资、佣金和销售工具费用的“无销售”方式。这可能形成高效的自助式、产品驱动销售，但证据由公司撰写，没有
              CAC、销售周期、转化、流失或回收期数据。个性化入门和技术支持都包含在内，因此人员和支持强度可能显著影响毛利率，尽管成本未披露。TechCrunch 还强调对 MDM 和 BYOD
              监控的隐私抵触，这可能增加实施、信任和留存工作。公开材料只支持机制，不支持效率结果。
