  - id: TR003
    title: 合作伙伴与依赖风险登记表
    columns:
      - 依赖项
      - 对手方
      - 角色
      - 集中度
      - 失效场景
      - 严重程度
      - 缓释措施
      - 剩余风险敞口
    rows:
      - - Apple 平台与协议
        - Apple
        - 终端注册、管理命令、操作系统支持
        - 核心产品范围仅限 Apple
        - 设备组合变化或平台变更会削弱单一控制台的覆盖
        - 高
        - 深耕 Apple，并开展有记录的并行迁移测试
        - 高，因为 Windows、Android 和 Linux 需要另一套控制平面
      - - 身份与合规集成
        - Google、Microsoft、Okta、Ping 与 Active Directory 生态
        - 登录、SSO、设备信任与合规信号
        - 多个外部系统位于关键访问路径上
        - API、策略或兼容性变化会扰乱身份验证或设备状态
        - 高
        - 已测试的集成矩阵、回滚流程与双供应商恢复设计
        - 在审阅正常运行时间、事故与兼容性证据前为中
      - - 直销式上线与支持模式
        - Mosyle
        - 获客、迁移、上线、支持与续约
        - 公司称超过 90% 的客户直接购买
        - 随着已安装基数扩大，支持能力或迁移执行可能失效
        - 中
        - 免费上线服务与为期六个月的并行迁移试用
        - 缺少转化、工单、响应时间与升级数据时为中
      - - 私有财务报告
        - 管理层与投资者
        - 流动性、现金跑道、利润率与资本配置的证据
        - 指定证据池只有公司控制的财务口径
        - 把已募资金误当作可用现金，或利润掩盖流动性压力
        - 高
        - 月度财务报表、银行 / 债务证据与董事会批准的运营计划
        - 在 ARR、利润率、烧钱、现金、债务与留存得到核对前为高
    notes: 集中度与严重程度是分析师的定性判断；财务口径仍由公司自述，不能视为经审计的流动性证据。
