      - number: '1.3'
        title: 规模信号与证据边界
        blocks:
          - type: paragraph
            body: >-
              Mosyle 的公开页面显示其规模不小，但统计口径和时间点互不兼容。公司页面称超过 47,000 家组织使用 Mosyle；企业页面称全球超过 65,000 家组织；MSP 页面称自 2016 年以来已有超过
              52,000 个独立客户账户和 700 万台设备加入。教育页面另称 Mosyle Manager 在发布五年内覆盖超过 20,000
              所学校。如果组织、账户、学校和累计注册采用不同分母，这些披露可以大致一致，但不能合并成一个当前客户数。保留的来源也无法确认当前
              ARR、收入、利润率、留存、现金消耗、现金跑道、债务、估值或明确的当前员工数。TechCrunch 提到 MDM 的更广泛隐私担忧，但指定证据没有证明 Mosyle
              发生过特定的法律、监管、泄露或宕机事件；这是证据缺口，不是证明事件从未发生。
            claimRefs:
              - CO010
