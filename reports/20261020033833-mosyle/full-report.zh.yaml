chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与商业模式
        blocks:
          - type: paragraph
            body: >-
              Mosyle 是一家总部位于 Winter Park、2012 年成立的 Series B 软件公司。最初产品是巴西的 iPad 学习管理系统；TechCrunch 报道称，公司在 2015
              年转向为美国学校提供仅支持 Apple 的设备管理，2018 年加入企业产品，2021 年推出更完整的 Fuse 套件。如今，Mosyle 将自己定位为仅面向 Apple
              的统一平台，整合设备管理、终端安全、在线隐私、身份与单点登录，以及应用和补丁管理。商业模式是按设备向教育、企业和托管服务商直接销售软件。当前企业定价能说明订阅模式，但定价页面由公司发布，不能证明实际平均售价、收入或利润率。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO015
