      - number: '2.2'
        title: 受证据约束的市场测算
        blocks:
          - type: paragraph
            body: >-
              现有证据无法勾稽出 Mosyle 特有的 TAM、SAM 或 SOM。2022 年 TechCrunch 转述的 MarketsandMarkets 预测称，全球 MDM 市场将从 2021 年的 $5.5
              billion 增至 2026 年的 $20.4 billion，但预测范围宽、时间旧，也不专门针对 Apple。Mosyle 2021 年新闻稿引用 IDC，称 2020 年美国员工至少 1,000 人的企业中
              macOS 占电脑的 23%；这只是历史需求指标，不是支出数据。在线页面对组织触达也有分歧：企业页称超过 65,000 家，主站称超过 47,000
              家。这些视角说明机会和牵引力，却无法解决机群数量、可服务设备量、转化率和可获得份额。
