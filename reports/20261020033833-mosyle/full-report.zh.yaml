  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Mosyle 争夺的预算包括 Apple 设备注册、策略执行、应用部署与补丁、身份、终端安全、隐私及合规工作流。由于 Mosyle 只管理 Apple
              平台，相关边界比统一终端管理更窄；Windows、Android 和 Linux 机群不在其原生范围内。在这一边界内，替代方案包括 Apple
              专用套件、跨平台终端工具、独立的安全和身份产品，以及继续手工管理。极小规模机群仍可能维持现状，但持续的入网、更新、盘点和例外处理会推动客户采用正式管理。这个定义避免把所有终端安全或设备管理支出都算作可直接获取的市场。
            claimRefs:
              - CM001
              - CM004
              - CM012
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
