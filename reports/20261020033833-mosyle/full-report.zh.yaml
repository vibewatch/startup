        blocks:
          - type: paragraph
            body: >-
              Mosyle 将产品定位为让 Apple 设备适用于工作和学校的一体化控制面，而非通用跨平台终端套件。公开产品覆盖 Apple 设备管理、终端安全、加密 DNS 网络控制、macOS
