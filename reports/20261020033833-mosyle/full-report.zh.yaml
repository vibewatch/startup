      - number: '4.3'
        title: 牵引力信号与收入质量
        blocks:
          - type: paragraph
            body: >-
              官方页面称全球超过 65,000 家组织；同一企业页另一段称“无销售”方式吸引近 50,000 名客户。教育页另称超过 20,000 所学校和数百万台受管 Apple
              设备。这些披露说明部署广泛，但不能相加或视为单一客户数，因为“组织”“客户”和“学校”可能重叠，页面也没有测量日期或分母定义。设备数不是收入代理变量：免费层、捆绑 Apple TV 和 Watch
              权益、产品组合及折扣都可能改变每台设备收入。指定证据中的公开来源未披露 ARR、确认收入、定义期间的增长、续约、净收入留存、集中度或 cohort 转化。因此，收入质量方向上有希望，但数量上未核实。
