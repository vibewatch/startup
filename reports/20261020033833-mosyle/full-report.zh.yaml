          value: Onboarding and support included
          detail: 公开材料没有量化相关服务交付成本。
        - id: gross-profit
          label: 毛利
          value: Not publicly quantified
          detail: Mosyle 声称实现创纪录盈利和自由现金流，但未说明金额或期间。
    approximationNotes: 这是定性机制图，不是转化漏斗，也不是按价值比例绘制的桥接。
    claimRefs:
      - CI001
      - CI002
      - CI005
      - CI006
      - CI007
      - CI014
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 从注册到运营、由证据支持的产品与依赖层次。
    data:
      layers:
        - label: Apple 注册基础
          detail: 设备分配监管与 Apple MDM 协议建立管理权限。
          modules:
            - Apple Business Manager
            - Apple School Manager
            - Apple MDM 协议
          outputs:
            - 已注册并受监管的设备资产
        - label: 设备客户端与资产清单
          detail: macOS 代理和 iOS/iPadOS 应用补充原生管理，并暴露设备状态。
          modules:
            - macOS 代理
            - iOS 应用
            - iPadOS 应用
          outputs:
            - 资产清单与合规属性
        - label: 管理与应用控制
          detail: 平台统一协调配置文件、限制、操作系统更新和应用部署。
          modules:
            - 配置文件
            - 应用目录
            - 补丁工作流
          outputs:
            - 已配置并更新的终端
        - label: 安全与隐私控制
          detail: 终端安全加固、合规和加密 DNS 网页控制共享同一管理平面。
          modules:
            - 终端安全
            - 加固与合规
            - 网页过滤
          outputs:
            - 策略与修复状态
        - label: 身份与访问
          detail: Mosyle Auth 2 将 Mac 登录连接到受支持的组织身份提供商。
          modules:
            - 本地账户自动化
            - 单点登录
            - 设备双因素认证
          outputs:
            - 受管理的设备身份
        - label: 外部策略集成
          detail: Mosyle API 属性可同步至 ClearPass，用于网络授权和动态查询。
          modules:
            - Mosyle API
            - ClearPass 扩展
            - 终端上下文查询
          outputs:
            - 网络访问策略输入
    approximationNotes: 概念层次反映有文档记录的工作流与依赖；并非 Mosyle 未披露的内部部署拓扑。
    claimRefs:
      - CE003
      - CE016
  - id: FU001
    title: 客户采用与扩张旅程
    type: journey-map
    summary: 公开描述的触点降低了试用和迁移摩擦，但来源没有披露转化率、续约率或扩张率。
    data:
      items:
        - label: 发现
          detail: 面向商业、学校和 MSP 的页面勾勒了 Apple 管理与安全使用场景。
          touchpoints:
            - 产品与定价页面
            - 第三方评测与比较
        - label: 试用
          detail: 商业潜客可以先从免费版或试用开始，再部署付费方案。
          touchpoints:
            - 最多 30 台商业设备的免费版
            - 延长迁移试用
        - label: 上线
          detail: Mosyle 在采用过程中提供个性化上线服务和支持。
          touchpoints:
            - 上线专员
            - 配置指导
        - label: 部署
          detail: IT 团队为企业或学校的 Apple 设备群注册、配置、加固并打补丁。
          touchpoints:
            - 企业配发和 BYOD 终端
            - 学校与教室设备
        - label: 扩张
          detail: 客户可以增加设备、安全模块、身份能力或由 MSP 管理的设备资产。
          touchpoints:
            - Premium 和 Fuse 版本
            - Fuse MSP
        - label: 迁移或续约
          detail: Mosyle 通过并行评估和首年激励吸引迁移客户，而续约指标仍属私有信息。
          touchpoints:
            - 最长六个月的延长试用
            - 迁移激励抵扣
    approximationNotes: 这是根据披露的客户触点综合出的概念序列，不是实测漏斗；没有推断转化率、续约率或扩张率。
    claimRefs:
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU013
      - CU014
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 公开证据指向平台、控制运营、保障和财务验证方面的高影响风险；证据池缺少运营数据时，发生可能性保持未知。
    data:
      columns:
        - label: 可能性
          detail: 基于指定证据的定性评估
        - label: 影响
          detail: 对客户运营或投资判断的潜在影响
        - label: 剩余严重程度
          detail: 公开描述的缓释措施之后的风险敞口
      rows:
        - label: Apple 平台集中度
          note: 官方定义为仅限 Apple；两项竞品比较指出了混合设备群的限制
          values:
            - label: 高
              tone: adverse
            - label: 高
              tone: adverse
            - label: 高
              tone: adverse
        - label: 配置与配置文件漂移
          note: 失效率遥测数据未公开
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: adverse
            - label: 高
              tone: adverse
        - label: BYOD 隐私治理
          note: 缺少策略与同意文件
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: adverse
            - label: 高
              tone: adverse
        - label: 客户指标一致性
          note: 三个当前由公司控制的页面显示了不同的组织数量
          values:
            - label: 高
              tone: adverse
            - label: 中
              tone: warning
            - label: 中
              tone: warning
        - label: 财务验证
          note: 指定证据池中没有经审计报表或流动性桥接
          values:
            - label: Unknown
              tone: neutral
            - label: 高
              tone: adverse
            - label: 高
              tone: adverse
        - label: 身份与支持依赖
          note: 关键工作流依赖外部身份系统和直连支持执行
          values:
            - label: 中
              tone: warning
            - label: 中
              tone: warning
            - label: 中
              tone: warning
    approximationNotes: 定性类别不是实测概率；指定证据缺少事故、控制失效或财务遥测数据时，保留未知状态。
    claimRefs:
      - CR001
      - CR005
      - CR008
      - CR012
      - CR014
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 公开记录支持继续尽调，但不足以支持有价格的投资决策。
    data:
      nodes:
        - id: scale
          label: 规模信号
          detail: 公司页面声称拥有大量组织、学校、账户和设备。
        - id: economics
          label: 经济数据缺口
          detail: 留存证据没有披露当前 ARR、留存、利润率、烧钱、现金跑道和债务。
        - id: financing
          label: 融资冲突
          detail: 独立数据库报告了不同的融资总额和最新轮次历史。
        - id: comparables
          label: 可比倍数不适用
          detail: 没有标准化的 Mosyle 财务数据，无法选择宽泛的软件倍数。
        - id: conditions
          label: 进入条件
          detail: 需要经审计的指标、融资文件、股权结构表和清算瀑布表。
        - id: decision
          label: 继续研究
          detail: 中等信心的流程判断；风险高；估值仍不确定。
      edges:
        - from: scale
          to: economics
        - from: economics
          to: financing
        - from: financing
          to: comparables
        - from: comparables
          to: conditions
        - from: conditions
          to: decision
    approximationNotes: 该流程是定性的，不暗示数值转化率、概率或估值。
    claimRefs:
      - CV001
      - CV003
      - CV009
      - CV013
      - CV014
      - CV015
