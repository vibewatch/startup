      - number: '8.3'
        title: 情景与回报逻辑
        blocks:
          - type: paragraph
            body: >-
              乐观情景取决于 Mosyle 能否把声称的规模、一体化套件、直销和低价转化为持久留存及高效扩张。基准情景假定平台对 Apple 客户有用，但证据不足以量化企业价值区间或退出回报。悲观情景叠加 Apple
              平台集中、低价、渠道激励可能昂贵、第一方规模披露不一致和融资数据未解。任何情景都不能仅凭公开证据负责任地给出数值估值区间。只有独立勾稽的 ARR、净留存、毛利率、自由现金流和客户 cohort
              出现后，乐观情景才加权；若指标不达标、优先权悬垂重大或入场价假设无依据的软件倍数，悲观情景加权。
