      - CV014
  - id: TV002
    title: 正方论点与反方论点
    columns:
      - 立场
      - 论点
      - 支持信号
      - 哪些事实会改变判断
    rows:
      - - 正方
        - 一体化的 Apple 专属管理与安全能力可以整合客户工具链。
        - 官方页面将管理、安全、身份、隐私与应用功能描述为一个平台。
        - 独立的赢单率、留存率和附加率证据会增强这一主张。
      - - 正方
        - 较低的公开定价与直销分发可能支持高效获客。
        - 商业版起价为每台设备每月 $1，Mosyle 称超过 90% 的客户直接购买。
        - 经验证的毛利率、CAC 回收期与 cohort 扩张，可以说明低价是否创造持久价值。
      - - 反方
        - 公开规模与融资记录无法在内部相互核对。
        - 留存来源报告的融资总额和第一方组织数量各不相同。
        - 已签署的融资文件与带日期的客户变动桥接表可以消除这一不确定性。
      - - 反方
        - Apple 集中度与不完整的财务披露，可能让表面规模产生误导。
        - 平台专注 Apple，而 ARR、留存、利润率、烧钱、债务与现金跑道在留存的公开证据中仍不可得。
        - 经审计的经济数据与 Apple 设备群持续增长的证明可以降低风险。
    notes: 正方信号主要由公司发布；反方行列指出了验证这些信号所需的独立证据。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV009
      - CV010
      - CV014
      - CV015
      - CV016
  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 明确假设
      - 估值与回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 声称的规模转化为强劲的净留存；一体化模块扩大收入；低成本直销维持健康利润率。
        - 没有公开来源支持任何数值区间；只有在 ARR、增长、利润率和净现金得到验证、足以支撑所选软件倍数后，才纳入投资判断。
        - 公司发布的指标可能无法与付费客户或经常性收入核对。
        - 若经审计的增长、超过 100% 的净留存、持续自由现金流和清晰的优先权安排得到确认，权重会上升。
      - - 基准
        - Mosyle 仍是可信的 Apple 专家，产品覆盖也有用，但财务质量与 2026 年融资仍未验证。
        - 将公允价值和目标回报视为尚未量化；应基于已验证的当前指标谈判，而不是依赖聚合平台的融资轮次或可比数据。
        - 温和增长、低定价和 Apple 集中度可能压低适用倍数。
        - 这一情景与当前证据最一致，也支持继续研究。
      - - 悲观
        - 客户分母夸大经济规模；渠道激励挤压利润率；融资或优先权安排稀释普通股。
        - 没有清算瀑布表就无法界定下行空间；拒绝任何建立在所引软件倍数高端之上的价格。
        - 留存疲弱、现金消耗、优先权悬压、平台集中度与倍数压缩。
        - 若融资记录无法核对，或经验证的经济数据低于管理层口径，权重会上升。
    notes: 情景区间有意不做量化，因为留存来源既未披露 Mosyle 当前收入，也未披露经验证的当前估值。
    claimRefs:
      - CV003
      - CV007
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
