      - number: '8.4'
        title: 退出准备度、尽调要求与论点破坏触发条件
        blocks:
          - type: paragraph
            body: >-
              公开证据没有证明退出准备度。公司有融资历史、声称的规模和覆盖教育、企业及 MSP 的产品定位，但没有经审计经营序列、当前股权结构表、清算分配瀑布或已核实估值。最终尽调应取得月度 ARR
              和收入桥接、按产品拆分的毛利率、logo 和金额留存、消耗与现金跑道、债务、客户 cohort、2026 年 4
              月融资文件及全部优先权条款。若经核实的留存或现金生成弱于管理层说法，客户数无法勾稽到付费组织，优先权损害普通股回报，或价格需要增长和利润率证据无法支持的倍数，论点就应破坏。可信退出计划还需要战略买方逻辑或 IPO
              规模的财务控制；这些目前都未公开。
