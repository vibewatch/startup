      - number: '2.3'
        title: 买方、用户与预算归属
        blocks:
          - type: paragraph
            body: >-
              采购中心随客户类型变化。企业部署通常由 IT 或安全负责人推动，需要在 Apple 机群中重复执行入网、补丁、合规和离职处理。K-12
              部署还涉及学校技术负责人、课堂管理员、共享设备流程、学生流动和按年按设备预算。MSP 需要为 Apple 客户账户提供多租户管理。使用者包括员工、教师、学生和管理员；付款方通常是中央
              IT、安全、学区或托管服务预算负责人。公开定价降低了进入门槛，但付费企业方案至少需要 30 个许可，因此最小付费部署高于单设备报价。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM012
              - CM013
      - number: '2.4'
        title: 采用驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              更大的 Apple 机群、分布式办公、零接触部署、更严格的安全要求，以及用一个 Apple 专用平台替代多种工具的吸引力，都有利于采用。Mosyle 公布 Business Premium 为每台设备每月
              $1，Education Premium 为每台设备每年 $5.50。约束同样明显：混合机群可能偏好跨平台控制面；组织仍需具备策略所有权及 Apple Business 或 School Manager
              准备度；一份独立的 2026 年评测称文档薄弱、API 覆盖有限、合规数据能力不足。买方在把低目录价转化为可持续 ROI 论证前，必须核实机群构成、集成、支持、迁移工作和安全证据。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM016
      - number: '2.5'
        title: 图表与证据
        blocks:
          - type: callout
            title: 公开证据不足以完成市场测算
            body: 广义 MDM 预测、历史 Mac 渗透率、未经审计的触达声明和目录价，若没有分行业群数量、付费转化、附加率及地域结构，就无法形成 Mosyle 特有的 TAM、SAM 或 SOM。
            calloutType: risk
            claimRefs:
              - CM015
          - type: callout
            title: Apple 专注既是切口也是上限
            body: Apple 优先的组织可能看重一体化、平台专用工作流；混合机群买方则可能优先选择跨平台控制面。
            calloutType: insight
            claimRefs:
              - CM001
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              买方考虑范围比 Apple-MDM 短名单更广。Jamf 是直接的 Apple 管理老牌厂商；Iru、NinjaOne、Scalefusion、JumpCloud 和 Hexnode
              则通过覆盖多种操作系统、身份、合规、远程监控或信息亭场景来竞争。Mosyle 位于“仅 Apple、集成套件”角落：自有页面把设备管理、安全、身份、过滤和补丁放在一起，2022 年 Computerworld
              也描述了相同的五应用平台理念。利用 Apple 原生注册加独立点工具的内部管理仍是现状替代方案，但指定证据没有证明它能完整替代该产品。根据 Firstbase，实体设备物流是相邻层，而不是 MDM 能力。
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP007
              - CP009
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP007
              - CP009
              - CP010
              - CP011
              - CP012
              - CP014
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP014
      - number: '3.2'
        title: 能力、信任与替代路径
        blocks:
          - type: paragraph
            body: >-
              Mosyle 最强的有据可查差异化在于围绕 Apple 终端的原生集成，而不是跨平台覆盖。官方材料描述 Apple 专用技术栈，涵盖管理、终端安全、身份与 SSO、加密 DNS
              过滤和应用补丁。主要替代压力来自机群异质性：Iru 认为，Windows 或 Android 采用、更深身份能力和合规要求会暴露仅 Apple 平台的上限。Jamf 则从相反方向切入，提供更深的 Apple
              管理和模块化企业控制，但这里的比较由厂商撰写，并非独立基准。Gartner 的七条评分样本偏正面，却太小，无法定论可靠性或企业级产品深度。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
              - CP007
              - CP009
      - number: '3.3'
        title: 定价、分销与切换经济性
        blocks:
          - type: paragraph
            body: >-
              Mosyle 的公开目录价形成获客切口：企业页列出 Premium 每台设备每月 $1、iOS 系列设备 Fuse 为 $1.50、macOS Fuse 为 $3，均至少 30
              个许可且按年计费。教育价格为每台设备每年 $5.50 和 $9。这些是目录价，不是实际收入，也不能证明覆盖范围相同。Mosyle 称超过 90%
              客户直接购买，意味着定价控制力较强、渠道依赖较低；迁移优惠也降低近期切换摩擦。另一方面，Firstbase 称文档薄弱、代理偶有断连；由于 Firstbase 是相邻厂商，这些说法需要客户或技术方直接佐证。
            claimRefs:
              - CP002
              - CP006
              - CP008
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP005
              - CP008
      - number: '3.4'
        title: 护城河持久性与未解决的竞争证据
        blocks:
          - type: paragraph
            body: >-
              护城河看起来依赖执行，而非结构性保护。Apple 专注可为同质化机群带来更快集成和更低运营复杂度，但买方转向多操作系统身份或终端套件时，可服务控制面会收窄。公开规模无法说明持久性：指定页面分别称超过
              65,000、60,000 和 47,000 家组织，却没有勾稽日期或分母。Mosyle 称筹集 $215 million
              协助股东退出，这属于融资历史，不等于用于竞争的现金。投资判断需要当前且分母一致的安装基数、相对 Jamf 和混合机群套件的赢单/输单数据、迁移和多归属率，以及独立的安全、可靠性和支持基准。
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP014
              - CP015
      - number: '3.5'
        title: 图表与证据
        blocks:
          - type: callout
            title: 价格与范围是最清晰的切口
            body: Mosyle 公布较低的每设备价格，同时打包 Apple 管理、安全、身份、过滤和补丁；指定证据没有证明实际折扣或功能质量等价。
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP008
          - type: callout
            title: 规模与可靠性证据尚不足以决策
            body: Mosyle 三个当前页面报告的组织数不同，最具体的可靠性批评来自有商业利益的相邻厂商，而非独立技术基准，因此还不足以支持决策。
            calloutType: risk
            claimRefs:
              - CP006
              - CP010
              - CP011
              - CP012
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开定价
        blocks:
          - type: paragraph
            body: >-
              Mosyle 的公开变现是按企业和教育分层的经常性设备订阅模式。企业目录价从最多 30 台设备的免费层，到 Business Premium 每台设备每月 $1.00、iOS、iPadOS 和 visionOS
              Fuse 为 $1.50、macOS Fuse 为 $3.00；付费企业方案至少 30 个许可且按年计费。教育页面公布每台设备年费 $5.50 和 $9.00。Apple Watch 管理不另收费；每个付费
              macOS 或 iOS/iPadOS 许可包含一个 Apple TV
              管理额度。这些是公司当前目录价，不能证明实际平均售价、折扣、合同期限或收入结构。免费企业层和免费配套应用似乎用于降低首次采用摩擦，但公开证据没有量化转化为付费订阅的比例。
            claimRefs:
