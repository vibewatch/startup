      - number: '8.2'
        title: 融资与可比背景
        blocks:
          - type: paragraph
            body: >-
              融资记录不够干净，不能锚定价格。Multiples 报告六轮融资共 $348 million 及 2026 年 4 月一轮 $100 million；Tracxn 报告 $247 million，并把 2022
              年 Series B 视为最新轮。Multiples 的 2026 年 4 月一行还描述 2022 年融资，形成具体勾稽问题而非新证据。TechCrunch 称 Mosyle 拒绝披露 2022
              年融资估值；保留来源没有独立核实的当前投后价值。Multiples 列出的软件倍数只能作背景：Mosyle
              没有收入、ARR、利润率、增长和净现金输入，无法选择或套用倍数。条款清单、投资人确认和经审计财务必须取代聚合网站数字。
