      - number: '4.4'
        title: 资本充足性与财务判断
        blocks:
          - type: paragraph
            body: >-
              最有时间锚点的资本证据属于历史数据。TechCrunch 和 9to5Mac 报道 2022 年 5 月完成 $196 million Series B；TechCrunch 当时还报道 $215 million
              现金和 32,000 名客户，并称 Mosyle 拒绝披露估值。Mosyle
              现在声称创纪录盈利和自由现金流，并称资本主要协助短期股东退出，而非维持生存。这些说法没有金额、会计口径、期间、经审计现金余额或债务表；不能把募资额和历史现金当成 2026
              年可用现金。该模式具备强软件经济性的可信要素——按设备经常性定价、直销、年付和集成产品——但判断仍受证据限制。估值前需要月度 ARR 和收入桥接、含支持成本的毛利明细、留存和集中度
              cohort、当前现金与消耗、债务及义务，以及显示现金跑道和下一轮触发条件的董事会经营计划。
