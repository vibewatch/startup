  - id: TV001
    title: 建议摘要
    columns:
      - 维度
      - 评估
      - 证据基础
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 产品与定价信号可信，但当前财务和估值输入尚未得到独立验证。
        - 运营与融资资料包完成核对前，不要批准投资。
      - - 信心
        - 中
        - 独立报道确认了 2022 年融资轮次，但当前融资数据库彼此冲突。
        - 这一信心只适用于需要尽调，不适用于数值化公允价值。
      - - 风险评级
        - 高
        - 低价格、公司声称的规模数据、Apple 集中度与不透明的优先权安排，留下了显著的下行不确定性。
        - 若尽调继续推进，应要求下行保护和明确的论点失效契约。
      - - 估值立场
        - 不确定
        - 2022 年估值未披露；没有 Mosyle 的收入和利润率数据，不能套用公开市场倍数。
        - 在当前 ARR、净现金与完全摊薄持股得到验证前，不设目标价格或回报。
    notes: 评估只使用留存的公开证据；缺少私有财务和股权结构表数据，无法进行数值估值。
