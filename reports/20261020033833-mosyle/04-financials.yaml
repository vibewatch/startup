company:
  name: Mosyle
chapter:
  number: 4
  title: Financials
  summary: >-
    Mosyle publishes unusually transparent per-device list pricing and describes a low-touch,
    predominantly direct distribution model, but those disclosures do not establish realized
    revenue, margins, retention, or current liquidity. Historical financing provides evidence of
    substantial capital raised in 2022, while the absence of current ARR, burn, runway, and debt
    data remains the central underwriting blocker.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and public pricing
    body: >-
      Mosyle's public monetization is a recurring, device-based subscription model segmented
      between business and education. Business list prices run from a free tier for up to 30
      devices to $1.00 per device per month for Business Premium, $1.50 for Fuse on iOS, iPadOS,
      and visionOS, and $3.00 for Fuse on macOS; paid business plans require at least 30 licenses
      and are billed annually. Education pages publish $5.50 and $9.00 per-device annual price
      points for successively broader management and security bundles. Apple Watch management
      carries no extra fee, while each paid macOS or iOS/iPadOS license includes one Apple TV
      management entitlement. These are current company-issued list prices, not evidence of
      realized average selling price, discounting, contract duration beyond annual billing, or
      revenue mix. The free business tier and free companion app appear designed to reduce initial
      adoption friction, but public evidence does not quantify conversion into paid subscriptions.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: gtm-and-delivery-economics
    title: GTM motion and delivery economics
    body: >-
      Mosyle says more than 90% of customers purchase directly, which would limit reseller
      commissions and distributor markups if the mix is accurate. The company also describes a
      "no-sales" approach intended to avoid salaries, commissions, and sales-tool expense. That
      combination points to a potentially efficient self-service and product-led motion, but the
      evidence is company-authored and supplies no CAC, sales-cycle, conversion, churn, or payback
      data. Delivery is not costless: personalized onboarding and technical support are included,
      so staffing and support intensity are likely material gross-margin variables even though
      their cost is undisclosed. TechCrunch also highlighted broader privacy resistance to MDM and
      BYOD monitoring, which may increase implementation, trust, and retention work. The resulting
      economics could be attractive, but public materials support only the mechanism, not the
      efficiency outcome.
    claimRefs: [CI005, CI006, CI007, CI016]
    tableRefs: [TI003]
  - id: traction-and-revenue-quality
    title: Traction signals and revenue quality
    body: >-
      Current official pages claim more than 65,000 organizations worldwide, while another passage
      on the same business page says the no-sales approach attracted almost 50,000 customers.
      Mosyle's education page separately claims more than 20,000 schools and millions of managed
      Apple devices. These disclosures demonstrate broad deployment but cannot be added or treated
      as a single customer count because "organizations," "customers," and "schools" may overlap
      and the pages do not provide measurement dates or denominator definitions. Device counts are
      also not a revenue proxy because free tiers, bundled Apple TV and Watch entitlements, product
      mix, and discounts can produce different revenue per managed device. No public source in the
      assigned evidence discloses ARR, recognized revenue, growth for a defined period, renewal,
      net revenue retention, concentration, or cohort conversion. Revenue quality therefore remains
      directionally promising but quantitatively unverified.
    claimRefs: [CI002, CI004, CI008, CI009, CI010]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and financial verdict
    body: >-
      The strongest dated capital evidence is historical. TechCrunch and 9to5Mac reported a $196
      million Series B in May 2022, and TechCrunch reported $215 million of cash and 32,000
      customers at that time while noting that Mosyle declined to disclose valuation. Mosyle now
      claims record profitability and free cash flow, and says the capital facilitated exits for
      shorter-term shareholders rather than funding survival. Those current claims are not
      accompanied by amounts, accounting definitions, periods, an audited cash balance, or a debt
      schedule; funding raised and historical cash therefore must not be treated as cash available
      in 2026. The model has credible ingredients for strong software economics—recurring
      per-device pricing, direct distribution, annual billing, and integrated products—but the
      underwriting verdict remains evidence-constrained. Before valuation work, diligence needs a
      monthly ARR and revenue bridge, gross-margin detail including support costs, retention and
      concentration cohorts, current cash and burn, debt and obligations, and a board-approved
      operating plan showing runway and next-financing triggers.
    claimRefs: [CI001, CI005, CI011, CI012, CI013, CI014, CI015]
callouts:
  - calloutType: risk
    title: Historical funding is not current liquidity
    body: >-
      The $215 million cash figure was reported in May 2022. No assigned source establishes
      Mosyle's 2026 cash balance, burn, runway, debt, or other obligations.
    claimRefs: [CI012, CI014, CI015]
