      - ["Gross margin", null, "Unavailable", "Tests software leverage after support and security-delivery costs", "Gross margin by product including hosting, onboarding, and support allocation"]
      - ["CAC and payback", null, "Unavailable", "Validates the claimed low-cost direct and no-sales motion", "Fully loaded CAC, sales cycle, free-to-paid conversion, and payback by segment"]
      - ["Retention and concentration", null, "Unavailable", "Determines durability and customer-risk exposure", "GRR, NRR, logo churn, and top-customer concentration by cohort"]
      - ["Current cash, burn, and runway", null, "Unavailable", "Determines financing dependency and downside protection", "Latest cash, monthly net cash use, board plan, and downside runway"]
      - ["Historical cash", "$215 million reported in May 2022", "Medium", "Provides dated context but not current liquidity", "Reconcile 2022 cash to current cash uses and financing activity"]
      - ["Profitability and free cash flow", "Company claims record levels; no amount or period", "Low", "Could reduce financing risk if verified", "Audited income statement, cash-flow statement, definitions, and monthly trend"]
    notes: "Null means the assigned public evidence does not disclose the metric; historical funding or cash is not treated as current cash availability."
    claimRefs: [CI005, CI006, CI007, CI012, CI014, CI015]
