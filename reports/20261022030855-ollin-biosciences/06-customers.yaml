schemaVersion: "report-v2"
artifact: customers
slug: ollin-biosciences
runDate: 2026-10-22
company:
  name: Ollin Biosciences
chapter:
  number: 6
  title: Customers
  summary: >-
    Ollin has no disclosed commercial customers because it remains a clinical-stage
    biotechnology company. Its strongest adoption evidence is instead a completed
    164-patient randomized trial, a planned global Phase 3 program, named clinical
    investigators, and two development partners; retention, pricing, payer access,
    channel readiness, and concentration remain unquantified.
sections:
  - id: customer-system
    title: The customer system is still pre-commercial
    body: >-
      Ollin's present operating constituency is a clinical-development network rather
      than a conventional paying customer base. Patients with diabetic macular edema
      or wet age-related macular degeneration are the end beneficiaries and trial
      participants, while retinal investigators and clinical sites generate evidence
      and may influence later adoption. Innovent Biologics and VelaVigo are named
      development collaborators, not customers. Future commercial demand would need
      to pass through ophthalmologists, provider organizations, payers, and specialty
      distribution, but the reviewed evidence discloses no contracts, formulary
      positions, prices, purchasing entities, or booked revenue. The distinction is
      material: clinical participation and expert engagement demonstrate access to an
      adoption ecosystem, but neither establishes willingness to pay or repeat use.
    claimRefs: [CU001, CU003, CU007, CU008, CU011]
    tableRefs: [TU001]
  - id: clinical-adoption
    title: Clinical participation is the clearest adoption proxy
    body: >-
      The best quantified engagement signal is JADE. Ollin said in September 2025
      that more than 150 U.S. patients had been enrolled in the randomized Phase 1b
      study; 2026 reports describe the completed study as enrolling 164 patients.
      This is meaningful execution evidence because it converts a development plan
      into recruited and completed clinical participation across two retinal
      indications. It remains a trial metric, however, not a count of customers,
      prescribers, active accounts, or treatment locations. Management now plans
      global Phase 3 trials, and the September 2026 EURETINA program indicates active
      dissemination to specialist audiences. Neither signal provides a denominator
      for site activation, recruitment velocity, geographic breadth, or investigator
      repeat participation.
    claimRefs: [CU002, CU003, CU004, CU005, CU006]
    tableRefs: [TU002]
  - id: named-proof
    title: Named relationships validate access, not customer conversion
    body: >-
      Publicly named organizations fall into three categories: scientific advisers
      and investigators, licensed-asset collaborators, and investors. Retina
      Consultants of America is represented through Charles Wykoff's quoted clinical
      perspective, while David Eichenbaum was named to present JADE results. Innovent
      discovered OLN324 and collaborates on its development; VelaVigo has the same
      role for OLN102. These relationships support clinical credibility and access to
      assets, but the sources do not identify any organization as a paying customer,
      production deployment, procurement counterparty, or recurring account. The
      financing syndicate likewise validates capital-market support rather than
      product demand. Customer-reference quality therefore remains pre-commercial and
      should not be represented as a logo roster.
    claimRefs: [CU006, CU007, CU008, CU009, CU014]
    tableRefs: [TU003]
  - id: durability-expansion
    title: Durability and expansion cannot yet be underwritten
    body: >-
      No reviewed source reports gross or net retention, churn, renewals, contract
      length, repeat purchase, satisfaction, payer coverage, channel economics, or
      top-account concentration. Ollin's expansion loop is therefore prospective:
      complete pivotal trials, win regulatory approval, persuade specialists with
      comparative data, secure payer and provider access, then broaden indications
      or add pipeline assets. Each transition can fail independently. BioPharma Dive
      also notes competitive pressure from cheaper Eylea copycats, which could
      tighten payer thresholds even if OLN324 reaches market. Dependence on Innovent
      and VelaVigo adds another concentration dimension because public sources name
      the partnerships but do not disclose economics, control rights, supply duties,
      or termination protections.
    claimRefs: [CU010, CU012, CU013, CU015]
    figureRefs: [FU001]
