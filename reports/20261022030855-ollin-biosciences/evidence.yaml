evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: financial-disclosure
    missingEvidence: Post-money valuation, security terms, current cash balance, burn rate and runway.
    whyItMatters: >-
      The disclosed financing amount does not establish enterprise value or how long the company can fund Phase 3
      execution.
    diligencePath: Request the latest cap table, financing documents, board-approved budget, cash balance and monthly burn schedule.
    relatedQuestionRefs:
      - QO005
  - type: enumeration-incomplete
    severity: material
    topic: leadership-table-TO002
    missingEvidence: A current, complete leadership and governance roster with tenure, reporting lines and succession coverage.
    whyItMatters: The public launch roster may be stale and does not establish current key-person concentration or governance depth.
    diligencePath: Request the current organization chart, board roster, committee responsibilities and succession plan.
    relatedTableRefs:
      - TO002
    relatedQuestionRefs:
      - QO008
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-table-TO003
    missingEvidence: >-
      Executed financing and collaboration agreements showing ownership, control rights, territories, milestones and
      economics.
    whyItMatters: >-
      Named investors and partners have potentially material economic or strategic importance that cannot be quantified
      from announcements.
    diligencePath: Review the cap table, financing documents and Innovent/VelaVigo agreements under NDA.
    relatedTableRefs:
      - TO003
    relatedQuestionRefs:
      - QO004
  - type: private-evidence-only
    severity: material
    topic: leadership
    missingEvidence: Current employment, reporting lines, succession depth and board rights for the named leaders and investors.
    whyItMatters: A pivotal-stage biotech can be sensitive to key-person loss and concentrated governance.
    diligencePath: Obtain the current org chart, board minutes or governance summary, employment roster and succession plan.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: partnerships
    missingEvidence: OLN324 and OLN102 license or collaboration economics, territories, milestones and cost sharing.
    whyItMatters: Partner terms can materially change economics, control and the cash required for global trials.
    diligencePath: >-
      Review executed license and collaboration agreements under NDA and reconcile them to the clinical development
      plan.
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: material
    topic: sam-som
    missingEvidence: >-
      Management's addressable-market model with launch geographies, expected label, net price, payer access, and share
      scenarios.
    whyItMatters: Without those inputs, the cited market values cannot be translated into Ollin-specific revenue potential.
    diligencePath: Request the model and reconcile it to Phase 3 indication, payer, pricing, and launch assumptions.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: adoption
    missingEvidence: Current payer coverage, formulary placement, KOL switching intent, and net-price evidence for OLN324.
    whyItMatters: Adoption and valuation depend on reimbursed utilization, not only clinical efficacy.
    diligencePath: Obtain payer research, KOL interviews, access assumptions, and commercial planning materials.
    relatedQuestionRefs:
      - QM005
      - QM006
  - type: missing-source
    severity: material
    topic: pricing-access
    missingEvidence: >-
      List and realized pricing, payer coverage, rebates, contracting terms, manufacturing capacity, and launch plans
      for OLN324 and OLN102.
    whyItMatters: >-
      Without access and economics, a differentiation claim cannot be translated into adoption, revenue, or durable
      competitive share.
    diligencePath: Request the commercial plan, payer research, CMC scale-up plan, launch budget, and partner economics under NDA.
    relatedQuestionRefs:
      - QP006
      - QP009
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: competitive-proof
    missingEvidence: >-
      Peer-reviewed or regulator-grade comparative Phase 3 efficacy and safety results against relevant approved
      therapies.
    whyItMatters: >-
      The current evidence is early-stage or company-reported and does not establish superiority or a durable clinical
      moat.
    diligencePath: >-
      Review the full JADE dataset, statistical analysis plan, Phase 3 protocol, adverse-event tables, and regulatory
      correspondence.
    relatedQuestionRefs:
      - QP007
      - QP009
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: minor
    topic: partner-risk
    missingEvidence: >-
      License scope, territory, milestones, royalties, manufacturing rights, and termination provisions with Innovent
      and VelaVigo.
    whyItMatters: >-
