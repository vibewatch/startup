        title: 资本形成与临床里程碑
        blocks:
          - type: paragraph
            body: >-
              Ollin 在 2025 年 9 月启动时披露获得 $100 million 初始融资，并于 2026 年 6 月 24 日完成后续 $330 million B 轮融资。该轮融资据称获得超额认购，计划用于全球
              3 期开发，但公开估值和证券条款均未披露。临床推进是目前最明确的可观察里程碑：随机 JADE 1b 期试验将 OLN324 与 faricimab 对比，公司随后称其在 DME
              中带来更快、更明显的解剖学改善，在湿性 AMD 中取得可比的解剖学结果。2026 年 9 月更新称，全球 3 期试验将在 2026 年第四季度启动。
