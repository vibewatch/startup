    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Ollin Biosciences 是一家成立于 2023
              年、公开资料显示位于德州奥斯汀的私有临床阶段眼科生物科技公司。公司自称采用以资产为中心的模式：收购候选药物或围绕其开展合作，而不是销售已经商业化的平台。核心项目 OLN324
              是针对糖尿病性黄斑水肿和湿性年龄相关性黄斑变性的 VEGF/Ang2 双特异性药物；OLN102 则是针对甲状腺眼病和 Graves 病的更早期 TSHR/IGF-1R
              项目。因此，公司身份比运营规模更清晰：现有资料描述的是一家开发型公司，而非产生收入的商业企业。
