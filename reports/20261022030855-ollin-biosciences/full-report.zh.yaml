              对眼科生物制剂而言，部署依赖于可重复制造、制剂和灌装封口质量、冷链或其他处理控制、经过培训的注射场所、试验中心执行和监管证据。指定公开来源确认 OLN324 由 Innovent 发现并与其共同开发，OLN102
              则由 VelaVigo 发现并与其共同开发。但来源没有披露底层授权经济性、制造网络、工艺验证状态、放行规格、供应冗余、网络安全控制、隐私控制或经审计的质量指标。1b
              期对照数据和有利的安全性描述是有用信号，但不能替代更大暴露量、更长随访或监管审查。Ollin
              声称使用眼科图像分析工具，这是开发能力主张；来源没有提供验证表现、可重复性统计或面向客户的实施方案。指定资料池中没有公开的开发者产品界面，因此开发者信号被记录为证据缺口，而不是从公司营销中推断。
