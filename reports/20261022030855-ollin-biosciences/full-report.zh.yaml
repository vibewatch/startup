        title: 领导层、治理与依赖
        blocks:
          - type: paragraph
            body: >-
              启动公告称 Jason Ehrlich 医学博士、哲学博士为联合创始人兼 CEO，并列出了生物学、开发科学、产品组合、临床开发、临床运营和公司发展等职能负责人。董事会兼具创业和投资背景，ARCH 的 Paul
              Berns 担任主席。这种覆盖面说明公司具备推进关键项目所需的临床开发职能，但公开记录无法确认现任任期、决策权、继任梯队，或公司对 Ehrlich 临床和融资领导力的依赖程度。OLN324
              的发现、开发以及计划中的中国和韩国参与均实质依赖 Innovent；OLN102 同样依赖 VelaVigo。
