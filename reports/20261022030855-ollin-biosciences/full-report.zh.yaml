              现有证据支持一个融资充足的临床阶段故事，但不足以构成完整的投资判断。公开资料未披露投后估值、收入、现金余额、消耗速度、现金跑道、客户数或员工数，因此不能把融资规模当作可用现金或企业价值。独立媒体
