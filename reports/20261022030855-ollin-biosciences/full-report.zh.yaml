            body: >
              2026 年 6 月的 B 轮融资据报道为超额认购的 $330 million，BioPharma Dive 将其称为当年规模较大的生物科技融资之一。这笔资本支持 3
              期工作，但不等于可用现金或已证明的现金跑道：指定来源没有披露投后估值、现金余额、消耗速度、分期条件、债务、优先权条款或项目层面的资金分配。商业压力也确实存在。BioPharma Dive 将 OLN324 描述为
              Roche 的 Vabysmo 的挑战者，并指出更便宜的 Eylea 仿制版本带来竞争。Yahoo Finance 10 月 21 日的市场快照称，Regeneron 的过去十二个月收入为 $15.53
              billion，最近一个季度现金为 $7.99 billion；这体现的是一家在售药企的规模，而不是 Ollin
              的估值基准。资料池没有公开诉讼、监管执法、事故或集中度披露，不代表这些事项不存在；这些未知项应继续作为明确的尽调门槛。
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
