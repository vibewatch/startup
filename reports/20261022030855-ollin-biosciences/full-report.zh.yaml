  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反论点
        blocks:
          - type: paragraph
            body: >-
              Ollin 的投资逻辑建立在大额融资、核心资产从随机概念验证研究走向 3 期，以及采用双特异性形式靶向成熟视网膜疾病生物学之上。2026 年 6 月融资公告称，$330 million B 轮融资将支持
              OLN324 在糖尿病性黄斑水肿和湿性年龄相关性黄斑变性中的全球 3 期开发；BioPharma Dive 则将该轮融资描述为当年规模较大的生物科技融资之一。反论点是，这些仍然只是开发阶段信号：OLN324
              的优势来自公司或合作方围绕一项 164 名患者概念验证研究发布的沟通，公开来源没有提供投资者支付的价格、投后估值、现金跑道、收入或上市经济性。因此，建议会对进入价格以及注册性数据能否复现早期信号高度敏感。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
