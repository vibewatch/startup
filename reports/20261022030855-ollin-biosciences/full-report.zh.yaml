      - number: '7.4'
        title: 展示项
        blocks:
          - type: callout
            title: 投资论点破裂触发器
            body: 重大 3 期延迟、无法复现 JADE 效果、未解决的 CMC 或合作方控制缺陷，或无法支持既定项目计划的融资条款，都应将风险评级提升至严重，并暂停投资判断。
            calloutType: risk
            claimRefs:
