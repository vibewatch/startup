  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与竞争经济性
        blocks:
          - type: paragraph
            body: >-
              Ollin 的主要市场边界是湿性（新生血管性）年龄相关性黄斑变性和糖尿病性黄斑水肿的处方治疗；甲状腺眼病和 Graves
              病属于另一组相邻适应症，而不是合并计算的单一市场。核心视网膜市场包括品牌及生物类似药的玻璃体内抗 VEGF 或 VEGF/Ang2
              疗法、医生给药、支付方覆盖，以及诊所或医院的处方集决策。除非来源将视力损失负担与药物治疗直接挂钩，否则市场不包括未经批准的管线资产、无关眼科手术，也不包括全部视力损失负担。现状并非“没有治疗”：其中已有
              faricimab、aflibercept、ranibizumab 等成熟抗 VEGF
              选择，以及更低成本的超说明书或生物类似药替代方案。这个边界很重要，因为高疾病负担不会自动转化为药品收入；采用取决于对比疗效、安全性、给药间隔、覆盖范围和治疗场景经济性。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 市场测算视角与不确定性
        blocks:
          - type: paragraph
            body: >-
              现有测算证据支持多个观察视角，但不足以支撑可辩护的 TAM/SAM/SOM 加总。公司发布的市场描述称，wAMD 年治疗价值约为 $10 billion 至 $12 billion，DME 为 $3.3
              billion 至 $5.8 billion；这些是宽泛的适应症级估算，没有披露地域、方法、支付方拆分或 Ollin 可触达的份额。另一篇独立视网膜市场文章记录了 2020 年三种最常用抗 VEGF 药物的
              Medicare Part B 年支出超过 $3.5 billion，说明报销敞口很大，但不等于全球市场收入。Roche 报告的 2025 年 Vabysmo 销售额为 4.1 billion Swiss
              francs，即约 $5 billion，这是单一在售产品的观察视角，而非市场总额。这些视角不能相加：它们对应不同人群、地域、年份和分母。可信的 SAM 需要明确 Ollin
              的目标地域、标签、定价假设、支付方准入，以及 3 期之后可能获得的份额。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              视网膜医疗流程中的经济买方分散在多个环节。视网膜专科医生和眼科诊所是临床用户，并会影响处方集选择；保险公司和公共项目负责覆盖药品支出的预算；医院和诊所可能施加处方集或采购限制；患者则承担准入、依从性和自付费用后果。OLN324
              的采用触发点可能是相较 faricimab
              及其他标准疗法，证明其解剖学或视力结局更好、疗效持久性更强，或治疗负担更低。对于生物类似药和低成本替代品，触发点也可能是支付方偏好或处方集强制要求。独立市场来源称，受访视网膜专科医生中有 56.3%
              希望获得更多信息和真实世界数据后才会纳入生物类似药，而半数医生担心安全性、疗效或免疫原性。这是明确的信任和证据约束：仅凭 3 期成功，未必能消除上市后数据和医生教育的需要。
            claimRefs:
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM014
      - number: '2.4'
        title: 增长驱动、约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              市场增长有几项支撑：持续存在的视力威胁性疾病、对双通路抑制的兴趣，以及庞大的既有治疗市场。Ollin 将 OLN324 定位为一种更小规格、更高效力的 VEGF/Ang2 双特异性抗体，并与 faricimab
              进行对比；公司则将 OLN102 描述为针对 TED 和 Graves 病的独立 TSHR/IGF-1R 项目。主要约束包括 3
              期读出前的临床不确定性、在售药和生物类似药竞争、支付方压价、玻璃体内产品的制造和安全要求，以及与 Innovent 的授权经济性。视网膜文献还记录了 Razumab
              曾因无菌性眼内炎而首次召回，并指出部分专科医生可能会等待更多真实世界安全证据。因此，估值相关性取决于可持续差异化和获得报销的采用，而不是疾病患病率这一表面规模。公开资料未披露 Ollin
              的净价、支付方组合、上市地域、预测份额或诊所层面的换药数据；这些仍是重要尽调缺口。
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 差异化必须同时胜过在售药和成本压力
            body: Ollin 作为品类切入口的机会可信，但采用门槛有两重：既要证明相较 faricimab 和其他标准疗法具有临床意义上的差异化，也要扛住生物类似药和支付方对价格及处方集准入的压力。
            calloutType: insight
            claimRefs:
              - CM009
              - CM010
              - CM012
              - CM014
          - type: callout
            title: 表面 TAM 不是可投资的 SAM
            body: 保留的市场数字缺少地域、方法、净价、支付方和份额等输入，无法转化为 Ollin 特定的收入潜力。
            calloutType: risk
            claimRefs:
              - CM005
              - CM006
              - CM008
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与战略位置
        blocks:
          - type: paragraph
            body: >-
              对一家私有临床阶段生物科技公司而言，Ollin 已披露的竞争集合异常具体：OLN324 正在湿性 AMD 和糖尿病性黄斑水肿中与 faricimab（Vabysmo）进行头对头试验；OLN102
              则被描述为甲状腺眼病领域 teprotumumab（Tepezza）的潜在竞争者。独立报道还将 Eylea 纳入相关视网膜市场，并指出 faricimab 已从 Regeneron
              的在售产品手中夺取份额。因此，实际竞争格局不仅包括被点名的风险投资初创公司，还包括已上市的抗 VEGF 和 VEGF/Ang2 药物、Ollin 的临床候选药物，以及未来的仿制药或生物类似药压力。Ollin
              通过交易授权并推进资产，而不是在内部搭建广泛的发现平台；这降低了发现负担，却增加了对合作伙伴准入、转化证据和权利经济性的依赖。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP006
              - CP007
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP009
              - CP013
              - CP014
      - number: '3.2'
        title: 能力、产品与差异化比较
        blocks:
          - type: paragraph
            body: >-
              已披露的能力比较显示，Ollin 的优势在于更进取的机制设计，而不是目前尚未证明的临床或商业表现。OLN324 与 faricimab 采用相同的 VEGF/Ang2
              生物学逻辑，但被描述为效力更高、摩尔剂量更高、分子规格更小；其证明点是随机 1b 期头对头研究，而非已获批产品。OLN102 则在抑制 IGF-1R 的基础上加入 TSHR 阻断，目标是治疗甲状腺眼病和
              Graves 病，并可能采用皮下注射，而 Tepezza 采用输注模式。Roche 2026 年第一季度文件显示 Vabysmo 仍是重要增长驱动因素；独立市场报告则称更便宜的 Eylea
              仿制药正在加大压力。这些事实支持差异化假设，但不能据此断言 Ollin 在疗效、安全性、依从性或成本上更优。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP011
              - CP012
      - number: '3.3'
        title: 分销、换药与商业约束
        blocks:
          - type: paragraph
            body: >-
              眼科换药既说明买方确实会做出选择，也代表很高的门槛：从 Lucentis 转向 Eylea、再转向 Vabysmo
              的报道表明，当疗效或疾病控制改善时，视网膜专科医生可以更换疗法；但在售产品已经具备监管批准、医生熟悉度、制造能力和报销路径。指定来源没有披露 Ollin
              的挂牌价、实际价格、合同条款、上市基础设施、客户数或商业准入承诺。Ollin 2026 年 EURETINA 公告显示 JADE 结果正在发表、全球 3
              期试验正在启动，这改善了信息流，但不等于获得批准或实现采用。因此，买方可能在等待对比数据期间同时使用多种已获批疗法；Ollin 的换药说服力取决于有临床意义的持久性、安全性、给药便利度和支付方经济性。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP010
              - CP011
              - CP012
              - CP014
              - CP016
      - number: '3.4'
        title: 壁垒持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              拟议的壁垒由经过验证的靶点、差异化分子设计、直接对照试验、经验丰富的眼科领导层，以及获得中国来源授权资产的能力共同构成。但这些优势并不会自动持久。独立融资报道将 Ollin
              描述为一波基于中国授权交易建立的公司之一，并指出此类交易涉及国家安全和政策担忧。报道还称 Vabysmo 面临更便宜的 Eylea 仿制药竞争，说明已获批的在售药也可能因价格被替代。Ollin
              仍需证明更高效力或双靶点设计能够转化为持久的患者获益、可接受的安全性、可扩展供应和可报销产品。因此，主要负面结论是执行和商品化风险，而不是候选药物已经失败。
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 竞争结论
