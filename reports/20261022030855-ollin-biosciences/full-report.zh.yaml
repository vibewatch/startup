      - number: '5.2'
        title: 机制、临床证据与成熟度
        blocks:
          - type: paragraph
            body: >-
              OLN324 的技术主张结合了 VEGF/Ang2 双重抑制、更高的已声明 Ang2 效力、更高摩尔剂量，以及相比对照产品更小的蛋白规格。Ollin 和专科媒体称，在 JADE 1b 期试验中，OLN324 相比
              faricimab 带来更快或更明显的解剖学改善，其中包括 Ophthalmology Times 报道的 DME
              中央视网膜厚度结果。这些发现属于早期临床证据，不能证明已获批、疗效持久，或在注册性人群中具备优势。ClinicalTrials.gov 将公开的 JADE 记录描述为一项平行分组的干预性 1 期试验，设有
              OLN324 和 faricimab 组；记录还称研究详情导航中没有发布结果。Ollin 2026 年 9 月公告称，全球 3 期试验将在 2026 年第四季度启动。OLN102
              的成熟度更低：公开资料描述了其机制，但支持的只是计划中的临床开发步骤，而非已证明的临床疗效。
