              - CV011
              - CV015
              - CV017
      - number: '8.2'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              融资记录作为资金信号很强，但作为估值信号并不完整。Ollin 的启动材料称 2025 年 9 月获得 $100 million 初始融资，2026 年 6 月公告称 TCGX 和 ARCH Venture
              Partners 共同领投、超额认购的 $330 million B 轮融资。FundedIQ 独立列出两轮已记录融资、总额 $430 million，并称员工规模为 11–50
              人，但没有提供股权估值或证券条款。这个区分很重要：募集资金不等于可用现金，已披露轮次规模也不能转换成持股比例或隐含企业价值。在投资者拿到股权表、清算优先权、跟投权、期权池、债务、现金和消耗数据之前，入场纪律应要求针对二元临床和融资风险给予估值折价，而不是把银团质量当作价格基准。
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV010
      - number: '8.3'
        title: 情景、可比对象与下行风险
        blocks:
          - type: paragraph
            body: >-
              情景框架比单点估值更可辩护，因为公开记录支持里程碑判断，却没有传统现金流折现或收入倍数模型所需的输入。乐观情景假设 OLN324 的头对头信号在 3 期得到确认、监管执行按计划推进，且 Innovent
              合作转化为商业上有吸引力的权利。基准情景假设在收入变得可见前还需要追加资本，并经历临床延迟。悲观情景假设疗效、安全性、监管、合作或融资结果无法支持注册路径。Roche 的 Vabysmo
              销售额和视网膜机会规模证明商业相关性，而不是 Ollin 的份额或价值。指定材料中的上市公司和并购参考只能提供方向性背景，不是条款已披露、足以确定 Ollin 估值的可比交易。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV009
              - CV010
              - CV013
              - CV014
              - CV017
      - number: '8.4'
        title: 决策、退出准备度与尽调门槛
        blocks:
          - type: paragraph
            body: >-
              当前公开证据支持继续跟踪 Ollin，而不是在价格未明的情况下买入。公司拥有可信的融资银团，并计划启动全球 3 期试验；2026 年 9 月公告称这些试验将在 2026
              年第四季度启动。但公开记录仍不足以判断稀释、优先权悬置、现金跑道或新投资者可获得的回报。只有当投资者能够根据更新后的临床数据、完整融资模型和权利经济性对估值做出投资判断后，决策才应转向买入。最重要的投资论点破裂触发因素包括重大
              3 期延迟、无法复现相较 faricimab 具有临床意义的差异化、不利的安全性或监管结果，或将不成比例价值转移给早期优先股持有人的融资条款。
            claimRefs:
              - CV015
              - CV016
              - CV017
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV009
              - CV016
              - CV017
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 跟踪尚未完成的价格发现
            body: 融资和临床轨迹是可投资信号，但指定资料池中的公开来源没有披露足以支持价格敏感型买入判断的估值或条款。
