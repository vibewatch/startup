        title: 产品组合与客户流程
        blocks:
          - type: paragraph
            body: >-
              Ollin 的产品不是商业软件服务，而是一个为医生、患者和医疗系统收购并推进眼科药物资产的临床开发与授权平台。公开组合中有两款已点名的双特异性抗体。OLN324
              用于开发糖尿病性黄斑水肿（DME）和湿性或新生血管性年龄相关性黄斑变性（wAMD）；OLN102 则针对甲状腺眼病（TED）及其背后的自身免疫疾病 Graves
              病。因此，流程是资产筛选、临床开发、监管执行以及最终由医生实施的玻璃体内治疗，而不是直接面向消费者交付。来源记录称 Ollin 收购并开发疗法，并将 Innovent Biologics 和 VelaVigo
              列为合作方。公开材料无法确认商业标签、获批适应症、实际治疗使用量或支付方路径；这些仍是尽调缺口。
