chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Ollin Biosciences is a private, clinical-stage ophthalmology biotechnology company established in 2023 and
              publicly associated with Austin, Texas. Its stated model is asset-centric: it acquires or collaborates
              around candidate medicines rather than selling a currently commercialized platform. The lead program,
              OLN324, is a VEGF/Ang2 bispecific aimed at diabetic macular edema and wet age-related macular
              degeneration; OLN102 is an earlier TSHR/IGF-1R program for thyroid eye disease and Graves’ disease. The
              identity is therefore clearer than the operating scale: the available sources describe a development
              company, not a revenue-generating commercial business.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO008
              - CO013
