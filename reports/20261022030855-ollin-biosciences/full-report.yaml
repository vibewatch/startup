  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product portfolio and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Ollin's product is not a commercial software service; it is a clinical development and licensing platform
              that acquires and advances ophthalmic drug assets for physicians, patients, and healthcare systems. The
              public portfolio has two named bispecific antibodies. OLN324 is being developed for diabetic macular edema
              (DME) and wet or neovascular age-related macular degeneration (wAMD), while OLN102 targets thyroid eye
              disease (TED) and the underlying autoimmune condition of Graves' disease. The workflow is therefore asset
              selection, clinical development, regulatory execution, and eventual physician-administered intravitreal
              treatment, rather than direct-to-consumer delivery. The source record describes Ollin as acquiring and
              developing therapies and identifies Innovent Biologics and VelaVigo as collaborators. Public materials do
              not establish a commercial label, approved indication, realized treatment utilization, or payer pathway;
              those remain diligence gaps.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
