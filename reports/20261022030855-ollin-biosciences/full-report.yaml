        title: Evidence gaps and execution risk
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a well-financed clinical-stage story but not a complete underwriting picture. The
              public sources do not disclose post-money valuation, revenue, cash balance, burn, runway, customer count
