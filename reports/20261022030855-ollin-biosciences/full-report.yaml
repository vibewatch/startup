              - CI013
              - CI014
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Institutional financing supports near-term development
            body: >-
              The reported $330 million Series B gives Ollin substantial disclosed financing capacity for pivotal OLN324
              work, but the public record does not establish remaining cash or runway.
            calloutType: strength
            claimRefs:
