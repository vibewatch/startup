              - CI012
          - type: callout
            title: Commercial and cash economics remain unobservable
            body: >-
              No retained source discloses revenue, realized price, cash balance, burn, runway, debt, valuation, or
              collaboration economics, leaving the core underwriting bridge incomplete.
            calloutType: risk
            claimRefs:
