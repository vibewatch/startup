        title: Leadership, governance and dependencies
        blocks:
          - type: paragraph
            body: >-
              The launch disclosure identifies Jason Ehrlich, M.D., Ph.D. as co-founder and CEO and lists functional
              leaders across biology, development sciences, portfolio, clinical development, clinical operations and
              corporate development. The board combines company-building and investor backgrounds, with ARCH’s Paul
              Berns as chair. This breadth suggests coverage of the clinical-development functions required for a
              pivotal program, but the public record does not establish current tenure, decision rights, succession
              depth or the extent of dependence on Ehrlich’s clinical and financing leadership. Innovent is a material
              external dependency for OLN324 discovery, development and planned China and South Korea participation;
