  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and competitive economics
        blocks:
          - type: paragraph
            body: >-
              Ollin's primary market boundary is prescription treatment for wet (neovascular) age-related macular
              degeneration and diabetic macular edema, with thyroid eye disease and Graves' disease as a separate
              adjacent indication set rather than a single pooled market. The core retinal market includes branded and
              biosimilar intravitreal anti-VEGF or VEGF/Ang2 therapies, physician administration, payer coverage, and
              clinic or hospital formulary decisions. It excludes unapproved pipeline assets, unrelated ophthalmic
              procedures, and the entire burden of vision loss unless a source ties that burden to drug treatment. The
              status quo is not “no treatment”: it includes established anti-VEGF options such as faricimab,
              aflibercept, ranibizumab, and lower-cost off-label or biosimilar alternatives. This boundary matters
              because a high disease burden does not automatically become drug revenue; adoption depends on comparative
              outcomes, safety, dosing interval, coverage, and treatment-site economics.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses and uncertainty
        blocks:
          - type: paragraph
            body: >-
              The available sizing evidence supports multiple lenses, but not a defensible additive TAM/SAM/SOM. A
              company-issued market description places annual wAMD treatment value at approximately $10 billion to $12
              billion and DME at $3.3 billion to $5.8 billion; those figures are broad indication-level estimates with
              no disclosed geography, methodology, payer split, or Ollin-accessible share. A separate independent
              retinal-market article documents more than $3.5 billion of annual Medicare Part B spending across the
              three most commonly used anti-VEGF agents in 2020, showing that reimbursement exposure is material but not
              equivalent to global market revenue. Roche's reported 2025 Vabysmo sales of 4.1 billion Swiss francs, or
              about $5 billion, are an incumbent-product lens rather than a market total. These lenses should not be
              summed: they have different populations, geographies, years, and denominators. A credible SAM requires
              Ollin's target geography, label, pricing assumptions, payer access, and likely share after Phase 3.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The economic buyer is distributed across the retinal-care workflow. Retina specialists and ophthalmology
              practices are the clinical users and influence formulary choice; insurers and public programs are the
              budget owners for covered drug spend; hospitals and clinics can impose formulary or procurement
              constraints; and patients bear access, adherence, and out-of-pocket consequences. The adoption trigger for
              OLN324 would be evidence of better anatomic or visual outcomes, meaningful durability, or a treatment
              burden advantage against faricimab and other standards. For biosimilar and lower-cost substitutes, the
              trigger can instead be payer preference or formulary mandate. The independent market source reports that
              56.3% of surveyed retina specialists wanted more information and real-world data before incorporating
              biosimilars, while half reported safety, efficacy, or immunogenicity concerns. That is a concrete trust
              and evidence constraint: Phase 3 success alone may not eliminate the need for post-approval data and
              clinician education.
            claimRefs:
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM014
      - number: '2.4'
        title: Growth drivers, constraints, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Market growth is supported by persistent vision-threatening disease, interest in dual-pathway inhibition,
              and a large installed treatment market. Ollin's materials position OLN324 as a smaller-format,
              higher-potency VEGF/Ang2 bispecific tested against faricimab, while the company describes OLN102 as a
              separate TSHR/IGF-1R program for TED and Graves' disease. The principal constraints are clinical
              uncertainty before Phase 3 readout, incumbent and biosimilar competition, payer pressure on price,
              manufacturing and safety expectations for intravitreal products, and licensing economics with Innovent.
              The retinal literature also records an initial recall of Razumab associated with sterile endophthalmitis
              and notes that some specialists may wait for additional real-world safety evidence. Valuation relevance is
              therefore tied to durable differentiation and reimbursed uptake, not headline disease prevalence. Public
              sources do not disclose Ollin's net price, payer mix, launch geography, forecast share, or practice-level
              switching data; those remain material diligence gaps.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation must beat both incumbents and cost pressure
            body: >-
              Ollin's opportunity is credible as a category entry point, but the adoption hurdle is dual: demonstrate
              clinically meaningful differentiation against faricimab and other standards while surviving biosimilar and
              payer pressure on price and formulary access.
            calloutType: insight
            claimRefs:
              - CM009
              - CM010
              - CM012
              - CM014
          - type: callout
            title: Headline TAM is not an investable SAM
            body: >-
              The retained market figures lack the geography, methodology, net-price, payer, and share inputs needed to
              convert them into Ollin-specific revenue potential.
            calloutType: risk
            claimRefs:
              - CM005
              - CM006
              - CM008
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and strategic position
        blocks:
          - type: paragraph
            body: >-
              Ollin's disclosed competitive set is unusually concrete for a private clinical-stage biotech: OLN324 is
              being tested head-to-head against faricimab (Vabysmo) in wet AMD and diabetic macular edema, while OLN102
              is described as a potential competitor to teprotumumab (Tepezza) in thyroid eye disease. Independent
              coverage also places Eylea in the relevant retinal market, noting that faricimab has taken share from
              Regeneron's incumbent. The practical landscape therefore includes marketed anti-VEGF and VEGF/Ang2
              medicines, Ollin's clinical candidates, and future copycat or biosimilar pressure rather than only named
              venture-backed startups. Ollin's model is to license and advance assets through deals, not to build a
              broad discovery platform in-house, which lowers discovery burden but increases dependence on partner
              access, translational evidence, and rights economics.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP006
              - CP007
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP009
              - CP013
              - CP014
      - number: '3.2'
        title: Capability, product, and differentiation comparison
        blocks:
          - type: paragraph
            body: >-
              The disclosed capability comparison favors Ollin on mechanism-specific ambition, not yet on demonstrated
              clinical or commercial performance. OLN324 uses the same VEGF/Ang2 biological logic as faricimab but is
              described as higher potency, higher molar dose, and smaller format; its proof point is a randomized Phase
              1b head-to-head study rather than an approved product. OLN102 adds TSHR blockade to IGF-1R inhibition and
              is intended to address thyroid eye disease and Graves' disease, with a possible subcutaneous route versus
              Tepezza's infusion model. Roche's Q1 2026 filing shows Vabysmo remains a major growth driver, while the
              independent market report says cheaper Eylea copycats are increasing pressure. These facts support a
              differentiation thesis, but not a conclusion that Ollin has superior efficacy, safety, adherence, or cost.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP011
              - CP012
      - number: '3.3'
        title: Distribution, switching, and commercial constraints
        blocks:
          - type: paragraph
            body: >-
              Ophthalmic switching is evidence of a real buyer decision but also a high bar: the reported movement from
              Lucentis to Eylea and then toward Vabysmo suggests retinal specialists can change therapy when outcomes or
              disease control improve, yet incumbent products already have regulatory approval, physician familiarity,
              manufacturing capacity, and reimbursement pathways. Ollin has not disclosed list pricing, realized
              pricing, contracting terms, launch infrastructure, customer counts, or commercial access commitments in
              the assigned sources. Its 2026 EURETINA announcement indicates JADE results were being presented and
              global Phase 3 trials were being initiated, which improves information flow but is not evidence of
              approval or adoption. A buyer could therefore multi-home across approved therapies while waiting for
              comparative data; Ollin's switching leverage depends on clinically meaningful durability, safety, dosing
              convenience, and payer economics.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP010
              - CP011
              - CP012
              - CP014
              - CP016
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The proposed moat is a combination of validated targets, differentiated molecular design, direct
              comparator trials, experienced ophthalmology leadership, and access to licensed Chinese-origin assets.
              Those advantages are not automatically durable. The independent financing coverage describes Ollin as part
              of a broader wave of companies built on Chinese licensing deals and identifies national-security and
              policy concerns around such transactions. It also reports that Vabysmo faces cheaper Eylea copycats,
              showing that an approved incumbent can itself be displaced on price. Ollin must still demonstrate that the
              higher-potency or dual-target design translates into durable patient benefit, acceptable safety, scalable
              supply, and a reimbursable product. The principal adverse conclusion is therefore execution and
              commoditization risk, not a finding that the candidates have failed.
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Competitive conclusion
            body: >-
              Ollin's strongest competitive asset is a focused head-to-head development strategy against validated
              ophthalmic standards. Its weakest point is the unproven bridge from molecular differentiation to
              reimbursed, scalable, durable commercial share.
            calloutType: insight
            claimRefs:
              - CP002
              - CP009
              - CP011
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization visibility
        blocks:
          - type: paragraph
            body: >-
              Ollin is a private, clinical-stage biopharmaceutical company whose public materials describe acquiring and
              developing ophthalmic therapies rather than selling an approved product. Its disclosed programs are OLN324
              for diabetic macular edema and wet age-related macular degeneration and OLN102 for thyroid eye disease and
              Graves' disease. The company has not publicly disclosed product revenue, commercial price, contracts,
              reimbursement, royalties, milestone receipts, or a revenue-recognition policy. Accordingly, the financial
              model should treat current revenue as unavailable rather than infer revenue from disease prevalence, trial
              activity, or the size of the ophthalmology opportunity. The company's initial financing announcement
              describes an asset-centric development strategy, while later coverage reports a $330 million Series B
              intended to fund pivotal development; those are capital inputs, not operating revenue. Public pricing and
              realized economics remain diligence requests.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
