            claimRefs:
              - CI003
              - CI007
              - CI009
      - number: '4.2'
        title: Cost structure and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              The available evidence supports a clinical-development cost narrative, not a conventional SaaS or
              marketplace unit-economics model. Ollin is advancing global Phase 3 work for OLN324 and expects OLN102 to
              enter clinical development, so trial execution, manufacturing, regulatory work, medical affairs, and
              collaboration terms are likely material cost drivers; the sources do not quantify any of them. The company
              says OLN324 was discovered and is being developed with Innovent Biologics, and that OLN102 is being
              developed with VelaVigo. Those collaborations may alter licensing, milestone, royalty, supply, or
              cost-sharing economics, but no public source supplies the relevant terms. The public clinical readout
              provides efficacy signals, including the reported 93% of patients not requiring retreatment between weeks
              12 and 20, but that is a clinical observation and cannot be converted into gross margin, treatment cost,
              or payer savings without dose, manufacturing, administration, and reimbursement inputs.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI008
              - CI009
              - CI014
              - CI016
      - number: '4.3'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Ollin's disclosed financing is meaningful relative to its stage: the launch announcement reported an
              initial $100 million financing, and BioPharma Dive later reported a $330 million Series B co-led by ARCH
              Venture Partners and TCGX. The later round is described as supporting pivotal OLN324 research and
              advancing OLN102, while the company subsequently announced global Phase 3 initiation in the fourth quarter
              of 2026. This supports a conclusion that Ollin has accessed institutional capital for near-term clinical
              execution, not a conclusion about cash on hand or runway. No balance sheet, burn rate, debt facility,
              use-of-proceeds schedule, valuation, post-money ownership, or next-round trigger is publicly disclosed in
              the retained sources. The financial verdict is therefore financing-supported but cash-opaque: investors
              should underwrite milestone delivery and financing dependency, not assume that the headline round equals
              available cash after transaction costs, commitments, or collaboration obligations.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
          - type: figure
