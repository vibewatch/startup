        title: Capital formation and clinical milestones
        blocks:
          - type: paragraph
            body: >-
              Ollin disclosed $100 million of initial financing at launch in September 2025 and a subsequent $330
              million Series B on June 24, 2026. The Series B is described as oversubscribed and intended to fund global
              Phase 3 development, but neither the public valuation nor security terms are disclosed. Clinical
              progression is the central observable milestone: the randomized JADE Phase 1b study compared OLN324 with
