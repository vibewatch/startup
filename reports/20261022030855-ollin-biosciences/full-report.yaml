              - CE010
              - CE011
              - CE012
      - number: '5.2'
        title: Mechanism, clinical evidence, and maturity
        blocks:
          - type: paragraph
            body: >-
              OLN324's technical proposition combines dual VEGF/Ang2 inhibition with higher stated Ang2 potency, higher
              molar dosing, and a smaller protein format than comparator products. Ollin and specialist coverage report
              faster or greater anatomic improvement against faricimab in the JADE Phase 1b study, including the DME
              central-subfield-thickness results reported by Ophthalmology Times. Those findings are early clinical
              evidence, not proof of approval, durability, or superiority in a registrational population.
              ClinicalTrials.gov describes the public JADE record as an interventional Phase 1 study with parallel
              assignment and OLN324 and faricimab arms; the record also says no results are posted in its study-details
              navigation. Ollin's September 2026 announcement says global Phase 3 trials are being initiated in the
              fourth quarter of 2026. OLN102 is less mature: its mechanism is described, but the public record supports
              a planned clinical-development step rather than demonstrated clinical efficacy.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
