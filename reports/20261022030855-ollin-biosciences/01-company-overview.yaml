company:
  name: Ollin Biosciences
chapter:
  number: 1
  title: Company Overview
  summary: Ollin is a well-funded private ophthalmology biotech with a clear clinical identity and a credible partner network,
    but public disclosure still leaves valuation, operating scale and contract economics unresolved.
sections:
- id: identity-and-model
  title: Identity and operating model
  body: 'Ollin Biosciences is a private, clinical-stage ophthalmology biotechnology company established in 2023 and publicly
    associated with Austin, Texas. Its stated model is asset-centric: it acquires or collaborates around candidate medicines
    rather than selling a currently commercialized platform. The lead program, OLN324, is a VEGF/Ang2 bispecific aimed at
    diabetic macular edema and wet age-related macular degeneration; OLN102 is an earlier TSHR/IGF-1R program for thyroid
    eye disease and Graves’ disease. The identity is therefore clearer than the operating scale: the available sources describe
    a development company, not a revenue-generating commercial business.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO008
  - CO013
  tableRefs:
  - TO001
- id: leadership-and-governance
  title: Leadership, governance and dependencies
  body: The launch disclosure identifies Jason Ehrlich, M.D., Ph.D. as co-founder and CEO and lists functional leaders across
    biology, development sciences, portfolio, clinical development, clinical operations and corporate development. The board
    combines company-building and investor backgrounds, with ARCH’s Paul Berns as chair. This breadth suggests coverage of
    the clinical-development functions required for a pivotal program, but the public record does not establish current tenure,
    decision rights, succession depth or the extent of dependence on Ehrlich’s clinical and financing leadership. Innovent
    is a material external dependency for OLN324 discovery, development and planned China and South Korea participation; VelaVigo
    is a comparable dependency for OLN102.
  claimRefs:
  - CO014
  - CO015
  - CO016
  tableRefs:
  - TO002
  - TO003
- id: capital-and-milestones
  title: Capital formation and clinical milestones
  body: 'Ollin disclosed $100 million of initial financing at launch in September 2025 and a subsequent $330 million Series
    B on June 24, 2026. The Series B is described as oversubscribed and intended to fund global Phase 3 development, but neither
    the public valuation nor security terms are disclosed. Clinical progression is the central observable milestone: the randomized
    JADE Phase 1b study compared OLN324 with faricimab, and the company later reported faster and greater anatomic improvement
    in DME and comparable anatomic outcomes in wet AMD. The September 2026 update said global Phase 3 trials were being initiated
    in Q4 2026.'
  claimRefs:
  - CO004
  - CO005
  - CO006
  - CO009
  - CO010
  - CO012
  figureRefs:
  - FO001
- id: evidence-gaps-and-risk
  title: Evidence gaps and execution risk
  body: The evidence supports a well-financed clinical-stage story but not a complete underwriting picture. The public sources
    do not disclose post-money valuation, revenue, cash balance, burn, runway, customer count or headcount, so financing size
    should not be treated as available cash or enterprise value. The independent BioPharma Dive account also places Ollin
    in a broader Chinese-licensing wave and notes policy concerns about technology transfer; this is a strategic and regulatory
    dependency, not proof of misconduct by Ollin. The immediate diligence priorities are license economics, cap-table and
    governance terms, cash planning, current employee depth, and blinded or independently reviewed pivotal-trial execution
    data.
  claimRefs:
  - CO003
  - CO007
  - CO016
  - CO012
  tableRefs: []
