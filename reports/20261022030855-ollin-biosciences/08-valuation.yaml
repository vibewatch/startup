company:
  name: Ollin Biosciences
chapter:
  number: 8
  title: Valuation
  summary: Ollin has raised substantial private capital and is advancing OLN324 toward global Phase 3, but public evidence does not disclose a post-money valuation, security terms, cash balance, burn, or commercialization economics. The evidence therefore supports a track recommendation with price and diligence discipline rather than a conviction underwriting.
sections:
  - id: investment-case
    title: Investment case and anti-thesis
    body: >-
      Ollin's investment case is built on a large financing, a lead asset moving from a randomized proof-of-concept study toward Phase 3, and a strategy that targets established retinal disease biology with a bispecific format. The June 2026 financing announcement says the $330 million Series B will support global Phase 3 development of OLN324 in diabetic macular edema and wet age-related macular degeneration, while BioPharma Dive describes the round as one of the year's larger biotech financings. The anti-thesis is that these are still development-stage signals: OLN324's reported advantages are company or partner communications around a 164-patient proof-of-concept study, and public sources provide no price paid by investors, post-money valuation, cash runway, revenue, or launch economics. The recommendation is consequently sensitive to entry price and to whether registrational data replicate the early signal.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001, TV002]
  - id: financing-and-entry
    title: Financing context and entry discipline
    body: >-
      The financing record is strong as a funding signal but incomplete as a valuation signal. Ollin's launch materials report an initial $100 million financing in September 2025, while the June 2026 announcement reports an oversubscribed $330 million Series B co-led by TCGX and ARCH Venture Partners. FundedIQ independently lists two recorded rounds totaling $430 million and a reported 11–50 employee band, but it does not provide an equity valuation or security terms. The distinction matters: funding raised is not cash available, and the disclosed round sizes cannot be converted into an ownership percentage or implied enterprise value. Until an investor receives cap-table, liquidation-preference, participation, option-pool, debt, cash, and burn data, entry discipline should require a valuation discount for binary clinical and financing risk rather than treating syndicate quality as a price benchmark.
    claimRefs: [CV006, CV007, CV009, CV010]
  - id: scenarios-and-comparables
    title: Scenarios, comparables, and downside
    body: >-
      A scenario framework is more defensible than a point valuation because the public record supports milestones but not the inputs required for a conventional discounted cash-flow or revenue multiple model. The bull case assumes OLN324's head-to-head signal is confirmed in Phase 3, regulatory execution remains on schedule, and the Innovent collaboration converts into commercially attractive rights. The base case assumes additional capital and clinical delay before any revenue visibility. The bear case assumes efficacy, safety, regulatory, partnership, or financing outcomes fail to support a registrational path. Roche's Vabysmo sales and the size of the retina opportunity demonstrate commercial relevance, not Ollin's share or value. Public-company and M&A references surfaced in the assigned material are directional context only, not comparable transactions with disclosed terms that can establish Ollin's valuation.
    claimRefs: [CV011, CV012, CV013, CV014]
    tableRefs: [TV003]
  - id: decision-and-diligence
    title: Decision, exit readiness, and diligence gates
    body: >-
      The current public evidence supports tracking Ollin rather than buying at an unspecified price. The company has a credible financing syndicate and a stated plan to initiate global Phase 3 trials, and its September 2026 announcement says those trials are being initiated in the fourth quarter of 2026. However, the public record remains insufficient to judge dilution, preference overhang, runway, or the return available to a new investor. A decision should move toward buy only after the investor can underwrite the valuation against updated clinical data, a full financing model, and rights economics. The most important thesis-break triggers are a material Phase 3 delay, a failure to reproduce clinically meaningful differentiation versus faricimab, an adverse safety or regulatory outcome, or financing terms that transfer disproportionate value to earlier preferred holders.
    claimRefs: [CV015, CV016, CV017]
    figureRefs: [FV001]
callouts:
  - calloutType: recommendation
    title: Track pending price discovery
    body: >-
      The financing and clinical trajectory are investable signals, but no public source in the assigned pool discloses valuation or terms sufficient for a price-sensitive buy call.
    claimRefs: [CV006, CV009, CV016]
  - calloutType: risk
    title: Clinical and financing risk remain coupled
    body: >-
      A Phase 3 program can increase capital needs before commercialization, so a large Series B should not be treated as proof of runway or shareholder return.
    claimRefs: [CV002, CV010, CV017]
