      - ["Treat wAMD", "Intravitreal retinal-disease management", "OLN324 candidate tested against faricimab", "Reported anatomic and numerically greater vision outcomes", "Magnitude, durability, and registrational confirmation remain open"]
      - ["Treat TED / Graves' disease", "Existing targeted TED therapy and management of autoimmune disease", "OLN102 TSHR/IGF-1R bispecific candidate", "Mechanistic rationale for dual-target inhibition", "No public human efficacy or safety result in assigned evidence"]
      - ["Advance a candidate", "Biotech sponsor runs clinical, regulatory, and CMC work", "Asset-centric acquisition and development with partners", "Two named programs and a funded clinical-development plan", "Partner economics, manufacturing, and execution controls undisclosed"]
    notes: "The benefit column preserves source posture: reported outcomes and mechanistic rationale are not independently verified commercial outcomes."
    claimRefs: [CE001, CE002, CE003, CE006, CE008, CE010, CE011, CE012]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk or evidence gap]
    rows:
