      - ["Molecule design", "Higher stated Ang2 potency, higher molar dosing, smaller protein format", "OLN324 formulation and dose selection", "Public sources do not disclose quantitative design or exposure detail"]
      - ["Clinical development", "Randomized JADE Phase 1b and planned global Phase 3", "Investigators, sites, protocol, data quality, regulators", "Phase 1b scale and follow-up may not predict Phase 3 outcomes"]
      - ["Partner network", "Innovent collaboration for OLN324; VelaVigo collaboration for OLN102", "Licenses, transfer, supply, and rights", "Terms, control points, and dependency concentration are undisclosed"]
      - ["Quality and manufacturing", "CMC, release, formulation, and supply for intravitreal biologics", "Qualified manufacturing and validated process", "No assigned source discloses validation, redundancy, or release metrics"]
      - ["Development analytics", "Advanced ophthalmic image analysis supporting development", "Validated imaging workflows and data governance", "No public validation performance or security controls"]
    notes: "Architecture separates sourced operating components from diligence gaps; no unsupported manufacturing or security capability is inferred."
    claimRefs: [CE005, CE007, CE011, CE012, CE013, CE014, CE015]

