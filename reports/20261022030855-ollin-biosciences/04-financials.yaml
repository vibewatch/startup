company:
  name: Ollin Biosciences
chapter:
  number: 4
  title: Financials
  summary: Ollin has disclosed substantial venture financing and a pipeline aimed at large ophthalmology markets, but public materials do not disclose revenue, cash, burn, realized pricing, or program-level economics. The financial underwriting case therefore rests on financing capacity and clinical milestones rather than demonstrated commercial cash generation.
sections:
  - id: revenue-model
    title: Revenue model and monetization visibility
    body: >-
      Ollin is a private, clinical-stage biopharmaceutical company whose public
      materials describe acquiring and developing ophthalmic therapies rather than
      selling an approved product. Its disclosed programs are OLN324 for diabetic
      macular edema and wet age-related macular degeneration and OLN102 for thyroid
      eye disease and Graves' disease. The company has not publicly disclosed
      product revenue, commercial price, contracts, reimbursement, royalties,
      milestone receipts, or a revenue-recognition policy. Accordingly, the
      financial model should treat current revenue as unavailable rather than
      infer revenue from disease prevalence, trial activity, or the size of the
      ophthalmology opportunity. The company's initial financing announcement
      describes an asset-centric development strategy, while later coverage
      reports a $330 million Series B intended to fund pivotal development; those
      are capital inputs, not operating revenue. Public pricing and realized
      economics remain diligence requests.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001, TI002]
  - id: cost-and-unit-economics
    title: Cost structure and unit-economics proxies
    body: >-
      The available evidence supports a clinical-development cost narrative, not
      a conventional SaaS or marketplace unit-economics model. Ollin is advancing
      global Phase 3 work for OLN324 and expects OLN102 to enter clinical
      development, so trial execution, manufacturing, regulatory work, medical
      affairs, and collaboration terms are likely material cost drivers; the
      sources do not quantify any of them. The company says OLN324 was discovered
      and is being developed with Innovent Biologics, and that OLN102 is being
      developed with VelaVigo. Those collaborations may alter licensing,
      milestone, royalty, supply, or cost-sharing economics, but no public source
      supplies the relevant terms. The public clinical readout provides efficacy
      signals, including the reported 93% of patients not requiring retreatment
      between weeks 12 and 20, but that is a clinical observation and cannot be
      converted into gross margin, treatment cost, or payer savings without dose,
      manufacturing, administration, and reimbursement inputs.
    claimRefs: [CI006, CI007, CI008, CI009, CI010]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and financial verdict
    body: >-
      Ollin's disclosed financing is meaningful relative to its stage: the launch
      announcement reported an initial $100 million financing, and BioPharma Dive
      later reported a $330 million Series B co-led by ARCH Venture Partners and
      TCGX. The later round is described as supporting pivotal OLN324 research and
      advancing OLN102, while the company subsequently announced global Phase 3
      initiation in the fourth quarter of 2026. This supports a conclusion that
      Ollin has accessed institutional capital for near-term clinical execution,
      not a conclusion about cash on hand or runway. No balance sheet, burn rate,
      debt facility, use-of-proceeds schedule, valuation, post-money ownership,
      or next-round trigger is publicly disclosed in the retained sources. The
      financial verdict is therefore financing-supported but cash-opaque:
      investors should underwrite milestone delivery and financing dependency,
      not assume that the headline round equals available cash after transaction
      costs, commitments, or collaboration obligations.
    claimRefs: [CI011, CI012, CI013, CI014, CI015, CI016]
    figureRefs: [FI001]
    tableRefs: []
callouts:
  - calloutType: strength
    title: Institutional financing supports near-term development
    body: The reported $330 million Series B gives Ollin substantial disclosed financing capacity for pivotal OLN324 work, but the public record does not establish remaining cash or runway.
    claimRefs: [CI011, CI012]
  - calloutType: risk
    title: Commercial and cash economics remain unobservable
    body: No retained source discloses revenue, realized price, cash balance, burn, runway, debt, valuation, or collaboration economics, leaving the core underwriting bridge incomplete.
    claimRefs: [CI003, CI009, CI014, CI015]
