    notes: Public company and third-party materials describe clinical programs and financing, not recognized revenue; null means no public value was found in the retained sources as of 2026-10-22.
    claimRefs: [CI001, CI002, CI003, CI007]
  - id: TI002
    title: Pricing and monetization visibility
    columns: [Product or activity, Price or contract model, List vs realized, Public evidence, Implication]
    rows:
      - [OLN324, "Not disclosed", "Neither list nor realized price available", "Clinical-stage program; no commercial price in retained sources", "Revenue model cannot be forecast from public pricing"]
      - [OLN102, "Not disclosed", "Neither list nor realized price available", "Clinical-stage program; no commercial price in retained sources", "Indication economics remain unmodeled"]
      - [Innovent collaboration, "Milestone / royalty / supply terms not disclosed", "Not applicable", "Collaboration identified but terms absent", "Partner economics may affect future gross margin and cash needs"]
      - [VelaVigo collaboration, "Milestone / royalty / supply terms not disclosed", "Not applicable", "Collaboration identified but terms absent", "Partner economics may affect future gross margin and cash needs"]
    notes: No retained source provides a public list price, net price, discount schedule, reimbursement rate, or collaboration contract term; unknowns are not estimates.
    claimRefs: [CI003, CI007, CI009]
  - id: TI003
    title: Unit economics and capital underwriting inputs
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue / ARR, null, "Unavailable", "No commercial revenue base is disclosed", "Obtain latest income statement and revenue bridge"]
      - [Gross margin, null, "Unavailable", "Manufacturing, royalties, and service costs are not disclosed", "Obtain COGS, supply, royalty, and margin assumptions"]
      - [Cash balance, null, "Unavailable", "Headline financing does not equal current cash available", "Obtain latest balance sheet and restricted-cash schedule"]
      - [Burn rate / runway, null, "Unavailable", "Phase 3 timing creates financing dependency but duration is unknown", "Obtain monthly cash forecast, burn by program, and runway case"]
      - [Customer count / utilization, null, "Unavailable", "There is no approved commercial product in the retained evidence", "Obtain trial, access, or commercial-account definitions if applicable"]
      - [Clinical retreatment observation, "93% did not require retreatment from week 12 to week 20", "Company-reported clinical result", "May inform durability but is not a cost or margin metric", "Review full JADE dataset, dosing, follow-up, and comparator analysis"]
    notes: Null values identify unavailable public underwriting inputs; the retreatment percentage is a reported clinical observation and must not be treated as revenue, cash savings, gross margin, or a forecast.
    claimRefs: [CI004, CI008, CI009, CI014, CI016]
