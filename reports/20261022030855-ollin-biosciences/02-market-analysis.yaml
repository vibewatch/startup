        - label: "Ollin-accessible SAM/SOM"
          value: "Not disclosed"
          unit: null
          note: "Requires geography, label, price, payer, and share assumptions"
    approximationNotes: "Layers are evidence lenses, not a mathematically additive funnel; the values use different populations, geographies, currencies, and periods and are shown without inferred conversion rates."
    claimRefs: [CM005, CM006, CM007, CM008]
callouts:
  - calloutType: insight
    title: Differentiation must beat both incumbents and cost pressure
    body: "Ollin's opportunity is credible as a category entry point, but the adoption hurdle is dual: demonstrate clinically meaningful differentiation against faricimab and other standards while surviving biosimilar and payer pressure on price and formulary access."
    claimRefs: [CM009, CM010, CM012, CM014]
  - calloutType: risk
    title: Headline TAM is not an investable SAM
    body: "The retained market figures lack the geography, methodology, net-price, payer, and share inputs needed to convert them into Ollin-specific revenue potential."
    claimRefs: [CM005, CM006, CM008]
