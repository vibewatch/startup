        - label: "Incumbent product lens"
          value: "CHF 4.1B in 2025"
          unit: "CHF"
          note: "Roche Vabysmo sales; single-product lens"
        - label: "US Medicare anti-VEGF lens"
          value: ">$3.5B in 2020"
