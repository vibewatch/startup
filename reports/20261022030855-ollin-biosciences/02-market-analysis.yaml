    claimRefs: [CM005, CM006, CM007, CM008]
  - id: TM003
    title: Segment, buyer, payer, and adoption map
    columns: [segment, buyer, user, payer, workflow, budget owner, adoption trigger]
    rows:
      - [wAMD, "Retina practice and formulary committee", Retina specialist, "Commercial insurer or public program", "Diagnosis, injection, monitoring, repeat dosing", Insurer/public program and practice, "Comparative visual/anatomic outcomes plus acceptable durability and safety"]
      - [DME, "Retina practice and formulary committee", Retina specialist, "Commercial insurer or public program", "Diabetes-linked retinal care, injection, monitoring", Insurer/public program and practice, "Evidence that improves outcomes or lowers treatment burden without access penalty"]
      - [TED/Graves' disease, "Ophthalmology/endocrinology practice", Ophthalmologist and endocrinologist, "Commercial insurer or public program", "Systemic disease context plus eye-disease treatment", Insurer/public program and patient, "Differentiated efficacy/safety with a clear place versus existing TED therapy"]
      - [Biosimilar or lower-cost substitute, "Payer and clinic formulary", Retina specialist, "Commercial insurer, Medicare, or clinic", "Coverage, substitution, monitoring, adverse-event management", Payer/formulary, "Price or mandate advantage, supported by real-world safety and efficacy confidence"]
    notes: "Buyer and workflow roles are analytical mappings from the cited treatment, formulary, and clinician-evidence sources; Ollin-specific contracting, net price, and switching data are not public."
    claimRefs: [CM009, CM010, CM011, CM014]
