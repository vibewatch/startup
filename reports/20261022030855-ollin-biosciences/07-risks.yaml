        - {label: "Financing runway or terms opacity", values: [0, 1, 0, 3, 0]}
        - {label: "Competitive price or efficacy pressure", values: [0, 1, 2, 0, 0]}
        - {label: "Undisclosed legal, cyber, or control issue", values: [0, 0, 2, 0, 0]}
    claimRefs: [CR004, CR007, CR010, CR013, CR014, CR015]
callouts:
  - calloutType: risk
    title: Thesis-break trigger
    body: A material Phase 3 delay, failure to reproduce the JADE effect, an unresolved CMC or partner-control deficiency, or financing terms that do not support the stated program plan should move the risk rating to critical and suspend underwriting.
    claimRefs: [CR004, CR007, CR010]
  - calloutType: assumption
    title: Evidence boundary
    body: The assigned pool contains company releases, one specialist trade report, and competitor market-data context; it does not establish the absence of litigation, incidents, concentration, or control failures.
    claimRefs: [CR011, CR013]
