  foundingLocation: Austin, Texas
  headquarters: Austin, Texas
  productSummary: >-
    OLN324 is a VEGF/Ang2 bispecific antibody for diabetic macular edema and wet age-related macular degeneration;
    OLN102 is a TSHR/IGF-1R bispecific program for thyroid eye disease and Graves’ disease.
  customerFocus: >-
    Patients with vision-threatening retinal disease and thyroid eye disease, served through future clinical and
