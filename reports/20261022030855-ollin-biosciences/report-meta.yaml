companyProfile:
  summary: >-
    Ollin Biosciences is a private, clinical-stage ophthalmology biotechnology company established in 2023 and based in
    Austin, Texas. It uses an asset-centric development model centered on partnered and acquired therapies, with OLN324
    as its lead retinal program and OLN102 as an earlier thyroid-eye-disease program.
  foundedDate: '2023-01-01'
