      - [Eylea and copycats, "Copycat pricing described as cheaper; exact prices unavailable", "Established retinal therapy with lower-price competition", "Price pressure can cap premium for a new entrant", "Partially evidenced"]
      - [OLN102, "Not disclosed", "Dual TSHR/IGF-1R development concept for TED and Graves' disease", "Possible subcutaneous convenience is a hypothesis requiring clinical proof", "Unknown"]
      - [Tepezza, "Not disclosed in assigned source", "Approved IGF-1R treatment for TED; infusion benchmark", "OLN102 must prove better safety, efficacy, or convenience to displace it", "Partially evidenced"]
      - [Internal build or status quo, "Not disclosed", "Continue existing treatment pathway or develop alternative asset", "Avoids Ollin-specific licensing terms but may sacrifice its disclosed comparator strategy", "Unknown"]
    notes: "No assigned source provides realized price, list price, discounts, payer coverage, or contract terms. 'Cheaper' is a relative description from independent coverage, not a quantified price."
    claimRefs: [CP008, CP010, CP011, CP012, CP014, CP016]
