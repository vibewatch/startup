callouts:
  - calloutType: insight
    title: Competitive conclusion
    body: Ollin's strongest competitive asset is a focused head-to-head development strategy against validated ophthalmic standards. Its weakest point is the unproven bridge from molecular differentiation to reimbursed, scalable, durable commercial share.
    claimRefs: [CP002, CP009, CP011, CP015]
