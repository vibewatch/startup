callouts:
  - calloutType: insight
    title: Vertical Integration from Orbital Radar to Automated Action
    body: Tomorrow.io is differentiated from legacy meteorological aggregators by owning the entire value chain from spaceborne Ka-band radar sensors to enterprise AI workflow agents. This full-stack control enables unique real-time data ingestion and custom model calibration.
    claimRefs:
      - CO002
      - CO007
      - CO008
  - calloutType: risk
    title: Discrepancy Between Unicorn Valuation and Historical Revenue Scale
    body: While the February 2026 Series F established a headline $1.0B+ post-money valuation based on claimed ~$100M ARR run-rates, independent aerospace benchmarks previously estimated revenue at $17.5M, underscoring the urgent necessity of data-room GAAP revenue verification.
    claimRefs:
      - CO005
      - CO006
      - CO013
