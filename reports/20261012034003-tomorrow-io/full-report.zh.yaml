      - number: '7.2'
        title: 天基资产可靠性与运营故障模式
        blocks:
          - type: paragraph
            body: >-
              在低地球轨道运行由大量小卫星组成的星座，会遭遇严重的技术故障模式和环境风险。天基资产持续暴露于太阳辐射风暴、原子氧侵蚀、热循环以及潜在的轨道碎片交会之中。哪怕一次在轨雷达电子设备故障或姿态控制推进器失灵，都可能使航天器瘫痪，直到替代卫星制造并发射前，局部观测覆盖都会出现缺口。此外，Tomorrow.io
              的 DeepSky 星座把五种复杂仪器的载荷集成在同一卫星平台上，进一步放大了载荷集成风险和散热难题。为减轻不同大气条件下的传感器校准漂移和辐射测量偏差，Tomorrow.io 依靠与原子时标准关联的 GNSS
              无线电掩星数据，持续校准降水雷达和微波探测测量。然而，在高辐射环境中，硬件的长期可靠性仍是尚未解决的技术尽调风险。
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR010
              - CR011
