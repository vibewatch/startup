      - number: '1.4'
        title: 星座部署、战略联盟与运营里程碑
        blocks:
          - type: paragraph
            body: >-
              Tomorrow.io 的运营进程从地面软件建模快速演进到太空传感 [CO004, CO007]。公司已将 13 颗运营卫星部署至低地球轨道，并实现实时降水与大气传感的 60-minute 全球重访率
              [CO007]。 在此基础上，2026 年 2 月融资主要用于部署 DeepSky；DeepSky 定位为全球首个原生 AI 天气卫星星座 [CO004, CO008]。 DeepSky
              将太空架构升级为多传感器大规模网络，同时搭载五种仪器：降水雷达、高光谱微波探测器、光学成像、GNSS 无线电掩星和 GNSS 反射测量 [CO008]。 商业采用还得到战略生态合作的推动 [CO010,
              CO011]。2025 年 7 月，Tomorrow.io 与 Palantir Technologies 合作，加入其 FedStart 项目， 将天基天气情报和自动化代理决策引擎嵌入联邦国防与情报操作系统
              [CO011]。公司还通过 AWS 扩大商业分发，将平台嵌入 Fortune 500 企业流程， 位于太空硬件、气候韧性和代理式 AI 的交汇处 [CO004, CO008, CO010, CO011]。
            claimRefs:
