chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与天气情报运营模式
        blocks:
          - type: paragraph
            body: >-
              Tomorrow.io 于 2016 年以 ClimaCell 名义注册成立，是一家总部位于波士顿的天气情报与气候韧性平台企业 [CO001]。
              公司由三名前以色列空军军官创立，目标是解决一个根本性的市场低效：超过 50 亿人以及大片海上运输航线无法获得地面天气雷达覆盖， 使全球供应链和城市基础设施存在严重运营盲区 [CO001,
              CO002]。Tomorrow.io 没有仅仅聚合政府公开天气数据，而是执行了资本密集型纵向整合战略 [CO002]。
              公司设计、发射并运营自有低地球轨道（LEO）卫星星座，搭载专用雷达和微波探测载荷，再将专有大气观测直接输入专有机器学习预测引擎 [CO002, CO007, CO008]。
              这套架构支撑企业软件即服务（SaaS）模式，服务超过 250 个企业账户和政府实体，包括航空公司、物流运营商、公用事业和国防机构 [CO009]。 公司还通过与 Amazon Web Services
              的战略关系强化云端分发，在 AWS Marketplace 托管并联合销售；其运营横跨波士顿总部和以色列特拉维夫一处拥有 150 人的研发中心 [CO010, CO012]。
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO008
              - CO009
              - CO010
              - CO012
