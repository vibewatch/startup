      - number: '3.4'
        title: 护城河耐久性、资本密集度与不利替代风险
        blocks:
          - type: paragraph
            body: >-
              虽然 Tomorrow.io 已在太空基础设施与企业 AI 的交汇处建立差异化地位，但长期护城河面临现实阻力。 纵向整合太空硬件需要大量资本开支，Tomorrow.io 在 2026 年 5 月将 F 轮扩大至
              $210 million 正说明了这一点。 在本十年结束前设计、制造并发射数十颗汽车大小的 DeepSky 卫星，会让公司暴露于发射失败、卫星平台集成延迟和高固定折旧成本；
              轻资产软件竞争者无需承担这些成本。大型企业软件传统厂商和超大规模云服务商——包括 Amazon Web Services、Microsoft 和 Google——也在大量投资， 用公开再分析数据集训练全球 AI
              天气基础模型。如果超大规模云厂商或主要国防承包商与替代商业太空观测网络或公共气象机构合作， 在核心云合同中捆绑提供气象情报，Tomorrow.io 的企业平台层可能面临利润率挤压。
              公司能否维持差异化，严格取决于能否证明 DeepSky 的专有观测带来的预测准确性和运营 ROI 优于公开数据。
            claimRefs:
              - CP001
              - CP005
              - CP010
              - CP013
              - CP014
