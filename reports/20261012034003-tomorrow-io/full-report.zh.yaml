            body: >-
              由于轨道卫星基础设施带来的巨额资本开支和服务交付成本，Tomorrow.io 的成本结构与纯企业 SaaS 厂商根本不同。
              公司的销售成本（COGS）包括主要公有云的云计算托管、第三方地面站下行费用、外部数值建模数据摄取，以及卫星硬件遥测处理。 除直接 COGS 外，资本密集度主要来自专有雷达和微波星座的制造、载荷集成、通过
              SpaceX 采购发射服务和轨道运营；该星座目前正扩展为 DeepSky 预警网络。 纯企业 SaaS 公司通常能实现超过 75% 至 80% 的毛利率，而 Tomorrow.io
              的综合毛利率受硬件摊销、发射折旧和 75 人工程团队的载荷工程薪资拖累。 关键是，Tomorrow.io 从未公开披露分部毛利率、EBITDA 或净运营现金流。 第三方历史跟踪机构估计公司收入从 2021 年的
              $11.1 million 增长到 2024 年的 $17.5 million； 但这些是未经核实的外部估算，而非经审计的 GAAP 财务披露，因此长期单位经济利润率仍是待承保判断的问题。
