      - number: '8.2'
        title: 融资历史与估值背景
        blocks:
          - type: paragraph
            body: >-
              Tomorrow.io 在 2026 年 2 月完成由 Stonecourt Capital 和 HarbourVest Partners 领投的 $175 million
              股权融资后，正式成为独角兽。二手报道显示，承诺资本总额达到 $210 million，表观投后估值介于 $825 million 和 $1.04 billion 之间。这轮机构融资成功，标志着公司从
              2021—2022 年与 Pine Technology Acquisition Corp 终止的 SPAC 合并中明显恢复；当时交易曾寻求 $1.2 billion
              估值，但公开市场接受度随后崩塌。之后，二手分析曾将公司企业价值下调至 $256 million 至 $373 million。Series F
              资金注入说明机构对双用途商业气象航天技术仍有强烈兴趣，但这家私营公司的披露状况仍使经审计收入运行率、毛利率和清算优先权顺位等关键指标无法验证。
            claimRefs:
              - CV001
