      - - 基准情景
        - DeepSky 星座在小幅延误下扩张；ARR 稳步增长至 $70M-$90M；综合利润率维持在约 50% 的压缩水平。
        - $900M - $1.2B 企业价值，相比 Series F 投后估值仅温和扩张。
        - 企业销售周期拉长、运载火箭价格上涨，挤压经营现金流。
        - 50%（反映基准资本密度和历史增长节奏，概率高）
      - - 悲观情景
        - DeepSky 遭遇严重发射失败或成本超支；ARR 停滞在 $40M 以下；高额轨道补充消耗迫使公司重组资本。
        - $300M - $450M 的困境估值，或下轮重组融资，大幅稀释普通股股东。
        - 执行停滞、卫星载荷异常，或低成本政府开放数据 AI 替代方案出现。
        - 25%（优先权负担和高资本需求带来实质性下行风险）
    notes: 情景基于 DeepSky 部署、商业采用和退出路径，对未来 3-5 年的潜在结果建模。
