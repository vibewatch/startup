      - number: '8.4'
        title: 退出准备度、尽调路径与最终建议
        blocks:
          - type: paragraph
            body: >-
              Tomorrow.io
              最终能否实现流动性退出，取决于能否建立持续、类似软件公司的毛利率，而不是依赖资本密集型硬件基础设施的单位经济性。潜在收购方包括寻求主权空间感知能力的国防主承包商、把气象智能嵌入企业基础设施的全球云巨头，以及
              Spire Global 这类商业卫星老牌公司。但在考虑配置资本前，机构投资者必须要求进入虚拟数据室，核验经审计的历史
              ARR、政府客户与商业客户群的收入确认政策，以及清算优先权。综合已验证的卫星运营能力、当前估值倍数和财务不透明度，合适的投资立场是继续跟踪，并在确认性尽调完成前维持高风险评级。
