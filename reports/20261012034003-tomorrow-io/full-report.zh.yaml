        blocks:
          - type: callout
            title: 从轨道雷达到自动行动的纵向整合
            body: Tomorrow.io 与传统气象聚合商的差异，在于它拥有从天基 Ka 波段雷达传感器到企业 AI 工作流代理的完整价值链。 这种全栈控制带来独特的实时数据摄取和定制模型校准能力。
            calloutType: insight
