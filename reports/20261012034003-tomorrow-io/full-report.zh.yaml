figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 梳理 Tomorrow.io 从 2016 年成立到 2026 年末的公司、融资、轨道部署和合作里程碑。
    data:
      items:
        - date: 2016-02
          label: 公司成立
          detail: Shimon Elkabetz、Rei Goffer 和 Itai Zlotnik 在波士顿创立 ClimaCell，旨在改造商业天气智能。
          tone: neutral
        - date: 2021-02
          label: Operation Tomorrow Space
          detail: 公司更名为 Tomorrow.io，并宣布 Operation Tomorrow Space，着手建造和部署自有天气雷达卫星。
          tone: positive
        - date: 2021-03
          label: Series D 融资（$77M）
          detail: Stonecourt Capital 领投 $77M Series D，用于启动卫星硬件工程和星座设计。
          tone: positive
        - date: 2022-03
          label: SPAC 合并终止
          detail: 在更广泛的宏观经济和市场收缩背景下，终止了与 Pine Technology Acquisition Corp 拟议的 $1.2B SPAC 合并。
          tone: warning
        - date: 2023-04
          label: 首批雷达卫星（Tomorrow-R1/R2）
          detail: 搭载 SpaceX 任务，成功将首批商业 Ka 波段天气雷达卫星发射至近地轨道。
          tone: positive
        - date: 2023-06
          label: Series E 融资（$87M）
          detail: Activate Capital 领投 $87M Series E，用于扩大轨道星座和企业韧性软件。
          tone: positive
        - date: 2025-07
          label: Palantir 战略联盟
          detail: 与 Palantir 建立战略合作并加入 FedStart，为国防和联邦客户提供自动化天气智能。
          tone: positive
        - date: 2026-02
          label: Series F 独角兽轮（$175M）
          detail: Stonecourt Capital 和 HarbourVest 领投 $175M Series F，估值超过 $1B，用于部署 DeepSky 星座。
          tone: positive
    approximationNotes: 里程碑日期来自公开新闻公告和监管申报；日期对应首次公告的月份。
