            body: >-
              Tomorrow.io 的运营扩张高度绑定少数外部合作伙伴，覆盖航天发射、云基础设施和企业商业合同。公司主要依靠 SpaceX Falcon 9
              的拼车任务部署卫星，因此星座扩张容易受到发射排期延误、助推器停飞或发射价格意外调整的影响，而市场上可负担的商业替代方案寥寥无几。在软件侧，Weather Intelligence Platform 深度构建于
              Amazon Web Services 之上，形成平台集中度风险；一旦多个区域的云服务意外中断，关键任务客户告警就可能受影响。在商业侧，企业客户高度集中于对天气敏感的交通行业，包括 Delta Air Lines
              和 JetBlue Airways 等大型航司。这些标杆合同虽验证了运营能力，但如果天气预测模型未能缓解扰乱运营的异常情况，商业航空客户集中就会把收入暴露在续约风险之下。
            claimRefs:
