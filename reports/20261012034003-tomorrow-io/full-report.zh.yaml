              2026 年 2 月 F 轮融资带来了 $1.0B+ 的投后估值，依据是公司据称约 $100M 的 ARR 运行率；但独立航空航天基准此前估计收入仅为 $17.5M， 这凸显了通过数据室核验 GAAP
              收入的紧迫性。
