      - number: '8.3'
        title: 情景分析与估值区间
        blocks:
          - type: paragraph
            body: >-
              评估 Tomorrow.io，需要在高贝塔技术上行空间、巨额资本消耗和估值倍数压缩风险之间权衡。乐观情景下，DeepSky 星座按计划部署，打开高毛利的政府及企业数据即服务合同，收入增长至 $150
              million 左右，并通过上市或出售给国防主承包商实现 $1.8 billion 至 $2.5 billion 的退出。基准情景下，企业平台稳步增长，但受到星座发射阻力的拖累，收入达到 $70 million
              至 $90 million，公允价值估值维持在 $900 million 至 $1.2 billion。悲观情景则考虑载荷发射失败、卫星补充投入持续攀升，以及商业 ARR
              差异始终无法弥合，最终可能触发摊薄性的下轮重组融资，或以低于 $400 million 的价格困境出售。
