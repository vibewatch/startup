  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类定义与结构范围
        blocks:
          - type: paragraph
            body: >-
              Tomorrow.io 将其运营市场定义在商业卫星观测、数值天气预报和企业运营韧性软件的交汇处。 公司不以传统气象门户或消费天气应用的方式竞争，而是将平台定位为关键任务型企业韧性基础设施。
              历史上，商业天气生态几乎完全依赖国家机构的公开数据流，例如美国国家海洋和大气管理局（NOAA）与欧洲中期天气预报中心（ECMWF）。 AccuWeather 和 The Weather Company
              等传统企业主要打包并再分发纳税人资助的观测模型，导致海洋航线和新兴市场存在明显覆盖缺口。 Tomorrow.io
              的边界涵盖低地球轨道（LEO）高频重访专有传感、大气数据融合，以及面向暴露于恶劣天气行业的代理式决策软件。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM011
      - number: '2.2'
        title: 市场规模视角：服务、技术与资产暴露
        blocks:
          - type: paragraph
            body: >-
              评估可服务支出时，必须把定义不同的估算分开。Ex Terra 报告称，天气预报服务市场 2024 年为 $2.34B、2033 年为 $4.67B； Entrepreneur Loop
              则给出另一组服务估算：2025 年 $3.47B、2030 年 $4.90B。同一篇 Entrepreneur Loop 文章还称，天气信息技术这一更广品类在 2024 年为 $12.3B， 天气情报平台为
              $13.51B，预计分别在 2033 年达到 $25.9B、在 2030 年达到 $24.35B。 这些是出版方报告的全球品类估算，并非 Tomorrow.io 已验证的 TAM/SAM/SOM
              阶梯；其范围和方法披露不足，无法调和差异或单独识别卫星数据、企业软件和政府采购。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: 买方细分、预算归属与采购路径
        blocks:
          - type: paragraph
            body: >-
              Tomorrow.io 当前产品页面按运营用户的需求组织产品，而不是围绕单一气象预算：保险理赔（claims）和灾害团队、工厂与 EHS 经理、机场和航空公司运营团队、
              电网可靠性负责人、铁路控制人员，以及车队或配送运营人员。因此，经济买方可能位于运营、安全、可靠性、供应链或技术部门；
              日常用户则在既有工作流中根据天气触发的事件采取行动。公共部门和国防采购走的是另一条路径，需求集中在大气观测和任务规划。
              分配给本报告的证据支持这些买方类别和使用场景，但没有披露定价、合同期限、预算科目归属、转化率，或企业 SaaS 与政府数据服务的相对收入贡献。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 采用驱动、观测上限与资本约束
        blocks:
          - type: paragraph
            body: >-
              Tomorrow.io 与 NEXI 都将大气观测密度视为 AI 预测的限制性输入，这支持对更高频商业传感的需求，但不能单独证明模型性能有所提升。 Entrepreneur Loop 进一步报道称，10
              颗卫星提供全球模型约 95% 的输入，其中 6 颗预计在本十年结束前退役；这一基础设施高度集中的说法可能推动市场采用，
              但来源是一篇透明度较低的二手文章，需要一手验证。供给受卫星制造、发射和部署执行能力约束。Tomorrow.io 将其 $175M 融资与加速 DeepSky 联系起来， NEXI 则报道称 F 轮后来达到
              $210M。这些融资金额说明项目获得了资本承诺，但不代表总成本、现金可用性或充足的资金续航。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 大气观测上限
            body: >-
              分配到的来源一致将观测密度描述为 AI 预测约束，但最强的量化集中度说法——全球模型约 95% 的输入来自 10 颗卫星、其中 6 颗在本十年结束前退役——
              只出现在一篇二手文章中。这支持采用论点和明确的一手来源尽调请求，但不能推出商业替代需求必然存在。
            calloutType: insight
            claimRefs:
              - CM013
              - CM014
          - type: callout
            title: 太空基础设施的资本密集度
            body: >-
              从软件扩展到轨道基础设施，会引入制造、发射和部署风险。Tomorrow.io 称其 $175M 融资将加速 DeepSky，NEXI 后来报道称 F 轮总额为 $210M；
              两个来源都没有披露项目成本、剩余现金、折旧或续航，因此不能把这笔融资视为部署已获得全额资金支持的证明。
            calloutType: risk
            claimRefs:
              - CM015
              - CM016
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局：传统企业、太空运营商与结构性缺口
        blocks:
          - type: paragraph
            body: >-
              全球商业天气情报市场分为三类：传统商业天气聚合商、专业商业太空传感运营商，以及公共部门气象机构。 The Weather Company（由 Francisco Partners 收购）和 AccuWeather
              等商业传统企业拥有广泛的企业品牌分发能力和消费者触达， 但主要依赖公共部门卫星数据与地面雷达网络，而不是运营专有轨道硬件。Planet Labs 和 Maxar Technologies
              等商业地球观测龙头管理大型卫星星座， 但重点是光学和合成孔径雷达成像，用于地表监测，而非大气柱垂直气象探测。Spire Global、PlanetiQ 和 GeoOptics 等纯太空传感同行部署无线电掩星载荷，
              采集大气温度和湿度剖面，但主要作为批发型数据即服务提供商运营，没有纵向工作流决策自动化。 Tomorrow.io 部署 13 颗 Gen1 低地球轨道卫星，实现 60-minute
              全球重访，直接瞄准结构性雷达缺口：超过 50 亿人以及地球表面约 71 percent 不在地面雷达覆盖范围内； 传统政府系统受数十年采购周期限制，无法迅速解决这一问题。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP009
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
      - number: '3.2'
        title: 架构差异：多传感器星座与传统模型
        blocks:
          - type: paragraph
            body: >-
              Tomorrow.io 的技术架构与传统政府航天器及商业立方星同行都有明显差异。NOAA 的 GOES、JPSS 和 EUMETSAT 的 MetOp 等旗舰政府气象卫星，
              代表数十亿美元级投资，按数十年更新周期部署；它们辐射测量精度高，却只能每数小时到每天两次重访，容易错过对流风暴的快速增强。
              相比之下，商业立方星运营商大多发射单一仪器载荷，主要是无线电掩星接收器，虽能提供全球覆盖，却没有主动降水雷达剖面。 Tomorrow.io 的 Gen1 星座证明了商业微波探测器的运营价值，保持轨道上有 11
              个活跃探测器。 为拉大性能差距，Tomorrow.io 宣布 DeepSky 星座，从 6U 立方星转向搭载五种共址仪器的汽车大小卫星：降水雷达、高光谱微波探测器、红外与可见光成像、 GNSS 无线电掩星和
              GNSS 反射测量。将主动降水雷达与被动微波探测器、无线电掩星结合，可同时对同一大气柱进行交叉校准观测， 生成专门优化 AI 原生大气模型（如 Sky 1）的高分辨率训练数据。
