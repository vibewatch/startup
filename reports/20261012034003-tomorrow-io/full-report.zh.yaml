  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 展示客户从自助开发者 API 发现，到全球企业 Agentic Suite 部署和自动化系统集成的端到端采用旅程。
    data:
      items:
        - label: 开发者与 API 发现
          touchpoints: Free weather API registration and documentation portal access
          actors: Software engineers and product developers
          actions: Test hyperlocal weather endpoints and integrate basic forecast feeds
          friction: Rate limits on free tiers and lack of raw satellite data access
          expansionLoops: Developer projects mature into commercial applications requiring enterprise data tiers
        - label: 运营试点与价值证明
          touchpoints: Dedicated sandbox deployment and historical delay analysis
          actors: Operations directors, dispatch managers, and safety supervisors
          actions: Evaluate impact-based alerts against historical weather incidents and ground delays
          friction: Custom integration into legacy flight operations or dispatch software
          expansionLoops: Documented hub savings justify multi-station expansion
        - label: 企业合同落地
          touchpoints: Master services agreement and security compliance review
          actors: VP of Operations, Chief Risk Officer, and Procurement
          actions: Deploy Resilience Platform across core hubs, terminals, or asset fleets
          friction: Procurement friction regarding data rights and uptime SLA guarantees
          expansionLoops: Standardization across initial geographic divisions or domestic hubs
        - label: 垂直 Agentic Suite 采用
          touchpoints: Specialized suite onboarding (Altitude for aviation, Shield for insurance)
          actors: IOCC dispatchers, route planners, and catastrophe modeling teams
          actions: Transition from manual dashboard monitoring to automated Gale agentic workflows
          friction: Workflow resistance from dispatchers accustomed to legacy radar tools
          expansionLoops: Altitude tablet cockpit rollouts and flight-by-flight route monitoring
        - label: 多垂直领域车队扩张
          touchpoints: Global operational unification and API integration into ERP/dispatch
          actors: C-suite executives, global continuous improvement leaders
          actions: Unify multinational operations under single global resilience standard
          friction: Complex international data sovereignty and multi-hub training coordination
          expansionLoops: Adding ground handling, maintenance, and logistics fleet modules
        - label: 生态与原生 MCP 集成
          touchpoints: Native Model Context Protocol server and enterprise copilot connectors
          actors: Enterprise AI teams and operational software engineers
