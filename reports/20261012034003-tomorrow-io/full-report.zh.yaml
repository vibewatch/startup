      - number: '7.4'
        title: 资本密集度、综合热力图与尽调否决标准
        blocks:
          - type: paragraph
            body: >-
              Tomorrow.io 的财务可持续性，核心矛盾在于 SaaS 经济性与航天硬件基础设施的高资本密集度。公司虽在 2026 年完成 $210 million 的 Series F 融资以加快 DeepSky
              部署，但小卫星的运营寿命只有三至五年，必须持续投入资本进行补充。公开收入披露之间也存在显著差异：第三方估算 2024 年收入为 $17.5 million，而公司自报的营销口径称 ARR 达 $100
              million，其他招聘信息追踪网站则称年收入为 $120
              million。若没有经过审计、能区分高毛利软件订阅与低毛利政府工程合同的分部披露，投资者就无法看清毛利率和现金消耗速度。关键的论点破坏条件包括发射延误持续超过十二个月、多颗卫星损失且没有保险替换，以及企业客户大量流失。
            claimRefs:
