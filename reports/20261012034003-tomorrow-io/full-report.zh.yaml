      - number: '1.2'
        title: 创始人、管理层与治理架构
        blocks:
          - type: paragraph
            body: >-
              Tomorrow.io 仍由三位联合创始人带领；军事气象、飞行运营和关键任务系统经验，塑造了公司的技术身份 [CO001, CO003]。 CEO Shimon Elkabetz 曾在以色列空军担任飞行员和指挥官
              11 年，之后就读于 Harvard Business School；他在执行飞行中多次亲历无法预测的恶劣天气后创立了公司 [CO001, CO003]。 首席战略官 Rei Goffer
              负责监管沟通、全球大气数据战略，以及与 NOAA 和世界气象组织等国家级气象机构的合作 [CO003]。 首席客户官 Itai Zlotnik 负责企业市场拓展、客户扩张和商业客户中的垂直平台采用
              [CO003]。 关键人物依赖集中在创始三人组，尤其涉及高管愿景、政府关系和专有太空架构；不过 CFO 兼 COO Leigha Kemmett 与首席气象官 Arun Chawla
              所带领的职能团队已提升运营成熟度 [CO003]。治理监督依靠机构主要投资人的积极董事会席位，包括 Stonecourt Capital、Square Peg Capital 和 Activate
              Capital； 这些投资人支持公司从早期增长到独角兽资本化的多轮融资 [CO003, CO009, CO014]。
            claimRefs:
              - CO001
              - CO003
              - CO009
              - CO014
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO003
              - CO012
      - number: '1.3'
        title: 融资历程、独角兽估值与尽调分歧
        blocks:
          - type: paragraph
            body: >-
              Tomorrow.io 在 Seed 轮及 A 至 F 轮融资中累计募得超过 $500 million 股权资本；部署轨道星座本身就需要大量资本 [CO004, CO014]。 2026 年 2 月，公司宣布由
              Stonecourt Capital 和 HarbourVest Partners 共同领投的 $175 million F 轮股权融资，投后估值超过 $1.0 billion，正式成为私营独角兽 [CO004,
              CO005]。 这一步发生在动荡的 2021-2022 年之后，代表一次成功的私募市场资本重组；当时 Tomorrow.io 曾宣布与 Pine Technology Acquisition Corp 进行拟议的
              $1.2 billion SPAC 合并， 但在公开市场空白支票交易整体崩塌后于 2022 年 3 月终止 [CO006]。不过，尽调显示底层估值倍数存在明显分析分歧 [CO005, CO006]。
              近期媒体和公司披露引用的估算显示，年度经常性收入约为 $100 million ARR [CO013]。相反，Ex Terra Media 此前根据 2024 年 $17.5 million 收入， 将
              Tomorrow.io 的估值基准定在 $256 million 至 $373 million 之间 [CO006, CO013]。对账报告中的 $100M ARR 与历史 $17.5M
              基准，是潜在投资人最核心的财务尽调任务 [CO005, CO006, CO013, CO014]。
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO013
