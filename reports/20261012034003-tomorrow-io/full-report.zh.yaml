        blocks:
          - type: paragraph
            body: >-
              Tomorrow.io 的投资论点建立在航天基础设施、专有大气感知与人工智能预测的产业融合之上，野心很大。公司部署了由 13
              颗卫星组成的在轨星座，整合天基主动雷达和微波探测器，能够直接观测地面站无法覆盖、数据稀缺的海洋上空大气。与 Palantir、Amazon Web Services
              等头部平台的商业合作，也为其在国防、航空和物流领域提供了可信验证。但反论点同样尖锐：资本密集度高，商业化阻力大。按计划为 DeepSky 网络部署 100
              多颗卫星，需要巨额前期资本和持续的轨道补充投入。公开价格表缺失、企业采购周期漫长，也让收入变得不透明，投资逻辑很容易被硬件延误和执行失误击穿。
