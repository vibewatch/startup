callouts:
  - calloutType: "risk"
    title: "Revenue Scale Discrepancy and Audit Gap"
    body: "A significant discrepancy persists between Tomorrow.io's publicly cited $100 million ARR run-rate and historical third-party tracker estimates that recorded $17.5 million in revenue through 2024. Without audited income statements or contract-level revenue schedules, underwriting the $1.04 billion Series F valuation requires extreme caution regarding true recurring software quality versus non-recurring development grants."
    claimRefs:
      - "CI001"
      - "CI005"
      - "CI006"
      - "CI013"
  - calloutType: "insight"
    title: "Capital Intensity of Space-Based Moat"
    body: "Unlike pure-play enterprise SaaS peers operating at 80%+ gross margins, Tomorrow.io's unit economics bear the ongoing capital requirements of satellite bus procurement, orbital launches, sensor payload engineering, and constellation maintenance. The $210 million Series F provides immediate liquidity, but ongoing constellation replenishment creates a persistent capital drain."
    claimRefs:
      - "CI004"
      - "CI011"
      - "CI012"
      - "CI013"
