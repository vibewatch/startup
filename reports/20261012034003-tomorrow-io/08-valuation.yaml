  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Counter-Argument
      - What Would Change View
    rows:
      - - Data & Technology Moat
        - Proprietary 13-satellite radar/sounder constellation provides unique real-time observations that legacy ground radars cannot match.
        - Hardware maintenance and orbital replacement costs create ongoing capital drain without guarantee of forecasting superiority.
        - Independent meteorological benchmarks verifying CBAM forecasting accuracy gains over NOAA/ECMWF baselines.
      - - Commercial Distribution
        - Tier-1 partnerships with Palantir and AWS embed Tomorrow.io weather intelligence into mission-critical enterprise workflows.
        - Enterprise contracts involve long, customized procurement cycles with zero public pricing transparency.
        - Audited proof of net revenue retention exceeding 120% across commercial enterprise and government cohorts.
      - - Capital & Valuation
        - Over $175M raised in Series F institutional round led by Stonecourt and HarbourVest validates unicorn status and funds DeepSky.
        - Prior terminated $1.2B SPAC and subsequent $256M-$373M valuation estimates suggest volatile private multiple pricing.
        - Data-room disclosure of clean 1x non-participating preferred liquidation structure without downside debt ratchets.
      - - Market Expansion
        - DeepSky 100+ satellite constellation targets 5B people and underserved oceanic regions lacking radar coverage.
        - Constellation launch delays, launch failure risks, and ground segment bottlenecks could defer monetization beyond 2028.
        - Successful on-orbit commissioning of initial DeepSky batches on planned cost and launch timelines.
    notes: Thesis contrasts proprietary space-based sensor moat against extreme capital intensity and revenue transparency risks.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV007
      - CV009
      - CV010
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Key Assumptions
      - Implied Valuation / Return Logic
      - Downside Triggers / Key Risks
      - Probability Signal
    rows:
      - - Bull Case
        - DeepSky deployment hits 2028 targets; Palantir and AWS partnerships drive commercial ARR past $150M; gross margins exceed 65%.
        - $1.8B - $2.5B enterprise value via tech-space IPO or strategic acquisition by aerospace/defense prime (e.g. Palantir, Airbus, Thales).
        - Antitrust scrutiny or delayed federal government procurement budgets for private weather satellite data.
        - 25% (Moderate probability based on proven technical execution of Phase-1 constellation).
      - - Base Case
        - DeepSky constellation scales with moderate delays; ARR grows steadily to $70M-$90M; blended margins remain compressed around 50%.
        - $900M - $1.2B enterprise value representing modest multiple expansion over Series F post-money mark.
        - Prolonged enterprise sales cycles and higher launch vehicle pricing squeezing operating cash flow.
        - 50% (High probability reflecting baseline capital intensity and historical growth cadence).
      - - Bear Case
        - DeepSky encounters severe launch failures or cost overruns; ARR stalls below $40M; high orbital replenishment burn forces recapitalization.
        - $300M - $450M distressed valuation or down-round recapitalization heavily diluting common equity holders.
        - Execution stall, satellite payload anomalies, or emergence of low-cost government open-data AI alternatives.
        - 25% (Material downside risk driven by preference overhang and heavy capital requirements).
    notes: Scenarios model potential outcomes over a 3-5 year horizon based on DeepSky deployment, commercial adoption, and exit paths.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV009
      - CV011
      - CV012
