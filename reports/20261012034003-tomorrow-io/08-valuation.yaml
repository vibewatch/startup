callouts:
  - calloutType: recommendation
    title: 'Investment Stance: Track at Unicorn Valuation'
    body: While Tomorrow.io has demonstrated exceptional technical execution by placing 13 operational weather-sensing satellites in orbit, commitment at its $1.04B Series F valuation is premature without audit-grade data room verification of ARR, gross margins, and cap table preference structures.
    claimRefs:
      - CV001
      - CV004
      - CV014
  - calloutType: risk
    title: Asymmetric Downside from DeepSky Capex and Preference Stack
    body: The planned deployment of over 100 DeepSky satellites exposes Tomorrow.io to severe capital replenishment demands. In the event of commercial growth delays, the preferred equity overhang could severely impair common equity returns in a down-round or sub-$500M exit.
    claimRefs:
      - CV004
      - CV005
      - CV009
      - CV012
