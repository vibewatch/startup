- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Architectural Layer / Component
  - Role & Functional Responsibility
  - Underlying Dependency
  - Technical & Operational Risk
  rows:
  - - Space Sensing Payloads (Ka-Band Radar & Microwave Sounders)
    - Active 3D precipitation profiling and vertical atmospheric temperature sounding
    - Specialized RF traveling-wave tube amplifiers and SpaceX launch availability
    - Instrument calibration drift, radiation degradation, and launch vibration stress
  - - Satellite Bus & Orbital Constellation (pLEO)
    - Proliferated low Earth orbit constellation providing global coverage
    - Commercial smallsat bus suppliers, reaction wheels, and ground downlink stations
    - Orbital decay, thermal cycling extremes, and supply chain lead times for replacements
  - - Multi-Source Ingestion & Fusion Layer
    - Aggregates public NWP (NOAA/ECMWF), commercial IoT, and satellite telemetry
    - High-throughput cloud object storage and partner API availability
    - API schema breaking changes and upstream public data dissemination outages
  - - AI-Native Forecasting Engine & Downscaling
    - Physics-informed neural networks generating 1-hour to 14-day forecasts
    - GPU compute clusters (AWS/GCP) and labeled training dataset pipelines
    - Compute cost escalation and model hallucination under unprecedented climate anomalies
  notes: Architecture components and technical dependencies compiled from DeepSky instrument announcements, eoPortal engineering specifications, and Tomorrow.io technical architecture documentation.
