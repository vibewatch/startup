  data:
    layers:
    - label: 'Layer 1: Enterprise Decision Applications & AI Agents'
      detail: Shield Agent, Route Agent, Operations Agent, and customizable vertical industry dashboard portals.
    - label: 'Layer 2: Developer & Integration Services (API Layer)'
      detail: Core weather endpoints, timelines API, webhook alert streaming, and GIS/enterprise software connectors.
    - label: 'Layer 3: AI-Native Forecast Engine & Downscaling'
      detail: Physics-informed machine learning models, numerical weather prediction fusion, and 1km hyperlocal downscaling.
    - label: 'Layer 4: Multi-Source Data Ingestion & Assimilation'
      detail: Automated ingestion pipelines harmonizing NOAA/ECMWF public NWP, commercial sensors, and ground observations.
    - label: 'Layer 5: Space Ground Segment & Downlink Network'
      detail: Global ground station tracking, direct telemetry downlink, automated orbit determination, and telemetry processing.
    - label: 'Layer 6: Spaceborne Sensing Constellation (DeepSky & R1/R2)'
      detail: Ka-band active radar, hyperspectral microwave sounders, radio occultation, and optical/IR atmospheric sensors in pLEO.
callouts:
- calloutType: strength
  title: Vertically Integrated Space Observation Closes Critical Data Void
  body: By combining proprietary Ka-band precipitation radar in low Earth orbit with an AI-driven forecasting stack, Tomorrow.io eliminates dependency on legacy ground radar networks that leave over 70% of the globe without radar coverage.
  claimRefs:
  - CE003
  - CE004
- calloutType: risk
  title: High Capital Intensity and Constellation Revisit Sensitivity
  body: Tomorrow.io's technical moat depends on deploying and sustaining dozens of satellites in Low Earth Orbit; any launch delays, on-orbit instrument failures, or accelerated orbital decay could delay achieving the sub-hourly revisit intervals required for real-time severe storm warnings.
  claimRefs:
  - CE005
  - CE010
