  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map
    missingEvidence: >-
      Complete capitalization table detailing percentage ownership stakes, liquidation preferences, and board voting
      control across Series A through F investor syndicates.
    whyItMatters: >-
      Prevents independent determination of voting control, liquidation preference seniority overhang, and common equity
      dilution at the $1.0B+ headline valuation.
    diligencePath: Inspect audited cap table, investor rights agreements, and voting covenants in the company data room.
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: financial-reporting
    missingEvidence: >-
      Audited financial statements for FY2024 and FY2025 reconciling company-claimed $100M ARR against independent
      analyst revenue benchmarks of $17.5M-$24.4M.
    whyItMatters: >-
      A 4x ARR variance dramatically alters revenue multiples, unit economics assessments, and sustainable runway
      calculations for capital-intensive satellite operations.
    diligencePath: >-
      Obtain GAAP audited revenue recognition schedules, segment revenue breakdowns (SaaS vs. government data), and
      customer contract backlog under NDA.
    relatedQuestionRefs:
      - QO008
