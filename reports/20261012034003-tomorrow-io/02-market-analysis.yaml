callouts:
  - calloutType: "insight"
    title: "The Atmospheric Observation Ceiling"
    body: "Assigned sources consistently frame observation density as an AI-forecasting constraint, but the strongest quantified concentration claim—about 95% of global-model inputs coming from ten satellites, six retiring before decade-end—appears only in a secondary article. This supports an adoption thesis and a clear primary-source diligence request, not a conclusion that commercial replacement demand is guaranteed."
    claimRefs:
      - "CM013"
      - "CM014"
  - calloutType: "risk"
    title: "Capital Intensity in Space Infrastructure"
    body: "Scaling from software into orbital infrastructure introduces manufacturing, launch, and deployment risk. Tomorrow.io said its $175M financing would accelerate DeepSky, and NEXI later reported a $210M Series F total; neither source discloses program cost, remaining cash, depreciation, or runway, so the financing cannot be treated as proof that deployment is fully funded."
    claimRefs:
      - "CM015"
      - "CM016"
