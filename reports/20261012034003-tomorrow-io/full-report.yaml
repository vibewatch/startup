            body: >-
              Deploying and maintaining a Low Earth Orbit constellation with continuous 60-minute revisit requires
              perpetual capital expenditure. Because smallsats have design lives of three to five years, Tomorrow.io
              must balance recurring SaaS cash flow against periodic launch and bus manufacturing costs, creating an
              elevated burn rate that leaves little margin for launch delays.
