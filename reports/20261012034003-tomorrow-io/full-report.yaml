        title: Counterparty, Launch Provider, and Customer Concentration Dependencies
        blocks:
          - type: paragraph
            body: >-
              Tomorrow.io's operational scalability is tightly bound to concentrated external partnerships across space
              launch, cloud infrastructure, and enterprise commercial contracts. The company relies primarily on SpaceX
              Falcon 9 rideshare missions for satellite deployment, leaving constellation expansion vulnerable to launch
              manifest delays, booster groundings, or unexpected launch pricing adjustments where few cost-effective
              commercial alternatives exist. On the software side, the Weather Intelligence Platform is deeply
              architected around Amazon Web Services, creating platform concentration where unexpected multi-region
              cloud outages could disrupt mission-critical customer alerts. Commercially, the enterprise customer base
              is heavily anchored in weather-sensitive transportation sectors, including major carriers like Delta Air
              Lines and JetBlue Airways. While these marquee contracts demonstrate operational validation, customer
              concentration among commercial airlines exposes revenue to contract renewal risks if weather prediction
              models fail to mitigate disruptive irregular operations.
