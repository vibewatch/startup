      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Procurement Pathways
        blocks:
          - type: paragraph
            body: >-
              Tomorrow.io's current product pages organize demand around operational users rather than a single
              meteorology budget: insurance claims and catastrophe teams, plant and EHS managers, airport and airline
              operations, grid reliability leaders, railroad controllers, and fleet or delivery operators. The economic
              buyer is therefore likely to sit in operations, safety, reliability, supply chain, or technology, while
              daily users act on weather-triggered decisions in existing workflows. Public-sector and defense
              procurement is a separate path tied to atmospheric observations and mission planning. Evidence in the
              assigned pool supports these buyer categories and use cases, but it does not disclose pricing, contract
              duration, budget-line ownership, conversion rates, or the relative revenue contribution of enterprise SaaS
              versus government data services.
