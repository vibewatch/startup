            body: >-
              Evaluating Tomorrow.io requires balancing high-beta technological upside against significant capital
              consumption and valuation multiple compression risks. In an upside bull case, on-schedule deployment of
              the DeepSky constellation unlocks high-margin data-as-a-service government and enterprise contracts,
              allowing revenue to scale toward $150 million and supporting a $1.8 billion to $2.5 billion exit via
