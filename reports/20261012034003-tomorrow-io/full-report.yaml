  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Definition, and Structural Scope
        blocks:
          - type: paragraph
            body: >-
              Tomorrow.io defines its operational market at the convergence of commercial satellite observation,
              numerical weather prediction, and enterprise operational resilience software. Rather than competing as a
              conventional meteorological portal or consumer weather application, the company positions its platform as
              mission-critical enterprise resilience infrastructure. Historically, the commercial weather ecosystem
              relied almost exclusively on public data feeds from governmental entities such as the National Oceanic and
              Atmospheric Administration (NOAA) and the European Centre for Medium-Range Weather Forecasts (ECMWF).
              Traditional incumbents like AccuWeather and The Weather Company largely packaged and redistributed these
              taxpayer-funded observation models, leaving substantial coverage gaps across oceanic corridors and
              emerging markets. Tomorrow.io's boundary encompasses high-revisit proprietary sensing in Low Earth Orbit
              (LEO), atmospheric data fusion, and agentic decision software across severe-weather-exposed industries.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM011
      - number: '2.2'
        title: 'Market Sizing Lenses: Services, Technology, and Asset Exposure'
        blocks:
          - type: paragraph
            body: >-
              Evaluating addressable spend requires keeping differently defined estimates separate. Ex Terra reports a
              weather-forecasting-services market of $2.34B in 2024 and $4.67B in 2033, while Entrepreneur Loop cites
              another services estimate of $3.47B in 2025 and $4.90B in 2030. The same Entrepreneur Loop article reports
              broader categories at $12.3B for weather information technologies and $13.51B for weather intelligence
              platforms in 2024, with respective forecasts of $25.9B in 2033 and $24.35B in 2030. These are
              publisher-reported global category estimates, not a validated TAM/SAM/SOM ladder for Tomorrow.io; their
              scope and methodology are not sufficiently disclosed to reconcile the differences or isolate satellite
              data, enterprise software, and government procurement.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
