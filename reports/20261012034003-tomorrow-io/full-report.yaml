        title: Capital Adequacy, Cash Runway, and Diligence Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              Tomorrow.io reached unicorn scale in May 2026, completing a $210 million Series F financing round that
              valued the business at $1.04 billion post-money, bringing cumulative equity funding to approximately
              $498.7 million to $500 million. Filings confirm that Series F preferred stock was issued at $5.45 per
              share with 38,561,119 shares outstanding, structured with a standard 1.0x non-participating liquidation
              preference senior to earlier equity tranches. This substantial capital injection followed earlier
              capital-raising attempts, including a proposed $1.2 billion SPAC business combination with Pine Technology
              Acquisition Corp that was terminated in March 2022 amid adverse public market conditions. While the $210
              million Series F provides meaningful balance-sheet runway to advance the deployment of the DeepSky
              satellite constellation, the company's forward capital adequacy remains heavily contingent on capital
              expenditure pacing and satellite launch cadence. Diligence underwriting encounters material blockers:
              press claims of $100 million ARR remain uncorroborated by audited GAAP financials, segment-level gross
              margins are undisclosed, and monthly cash burn rates are unknown. Institutional investors must condition
              capital commitments on data-room access to audited financial statements, contract revenue recognition
              schedules, and satellite capex projections.
