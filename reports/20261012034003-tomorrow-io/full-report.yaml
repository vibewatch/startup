      - number: '5.4'
        title: Proprietary Space Infrastructure & DeepSky Constellation
        blocks:
          - type: paragraph
            body: >-
              The foundation of Tomorrow.io's technological moat is its vertically integrated spaceborne observation
              infrastructure, developed to close the vast observational gaps across the 71 percent of the Earth's
              surface covered by oceans and remote terrain lacking terrestrial radar. The company successfully proved
              the viability of commercial satellite radar with the launch of its Tomorrow-R1 and Tomorrow-R2
              microsatellites in 2023, each carrying an active Ka-band software-defined precipitation radar operating at
              35.75 GHz with a 400 km field of view. Building upon these successful technology demonstrators,
              Tomorrow.io is scaling its operational constellation under the DeepSky program. DeepSky spacecraft
              transition from smallsat demonstrators to larger, high-power satellite buses capable of hosting an
              integrated five-instrument payload suite. This multi-sensor configuration incorporates active
              precipitation radar, hyperspectral microwave sounders, GNSS radio occultation receivers, optical and
              multispectral imagers, and infrared sounders. By observing the identical atmospheric column simultaneously
              across multiple electromagnetic bands, DeepSky provides high-cadence 3D vertical profiles of
              precipitation, moisture, and temperature.
            claimRefs:
              - CE003
