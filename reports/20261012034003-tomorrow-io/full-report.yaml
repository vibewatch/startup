        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Tomorrow.io presents an ambitious investment thesis centered on the industrial convergence of space
              infrastructure, proprietary atmospheric sensing, and artificial intelligence forecasting. By deploying an
              operational constellation of 13 satellites that integrates active spaceborne radar and microwave sounders,
              the company captures direct atmospheric observations across data-sparse oceans that ground stations cannot
              observe. Commercial partnerships with tier-one platforms such as Palantir and Amazon Web Services provide
              credible validation across defense, aviation, and logistics sectors. However, the anti-thesis highlights
              severe capital intensity and commercial friction. Deploying over 100 satellites for the planned DeepSky
              network demands massive upfront capital and continuous orbital replenishment. Furthermore, the absence of
              public pricing schedules and prolonged enterprise procurement cycles introduce substantial revenue
