      Chronology of Tomorrow.io key corporate, financing, orbital deployment, and partnership milestones from founding
      in 2016 through late 2026.
    data:
      items:
        - date: 2016-02
          label: Company Founded
          detail: >-
            Founded as ClimaCell in Boston by Shimon Elkabetz, Rei Goffer, and Itai Zlotnik to revolutionize commercial
            weather intelligence.
          tone: neutral
        - date: 2021-02
          label: Operation Tomorrow Space
          detail: >-
            Rebranded to Tomorrow.io and announced Operation Tomorrow Space to build and deploy proprietary weather
            radar satellites.
          tone: positive
        - date: 2021-03
          label: Series D Financing ($77M)
          detail: >-
            Secured $77M Series D round led by Stonecourt Capital to initiate satellite hardware engineering and
            constellation design.
          tone: positive
        - date: 2022-03
          label: SPAC Merger Termination
          detail: >-
            Terminated proposed $1.2B SPAC merger with Pine Technology Acquisition Corp amid broader macroeconomic and
            market contraction.
          tone: warning
        - date: 2023-04
          label: First Radar Satellites (Tomorrow-R1/R2)
          detail: >-
            Successfully launched first commercial Ka-band weather radar satellites to low Earth orbit aboard SpaceX
            missions.
          tone: positive
        - date: 2023-06
          label: Series E Financing ($87M)
          detail: >-
            Raised $87M Series E led by Activate Capital to scale orbital constellation and enterprise resilience
            software.
          tone: positive
        - date: 2025-07
          label: Palantir Strategic Alliance
          detail: >-
            Formed strategic partnership with Palantir and joined FedStart to deliver defense and federal automated
            weather intelligence.
          tone: positive
        - date: 2026-02
          label: Series F Unicorn Round ($175M)
