      - number: '7.2'
        title: Spaceborne Asset Reliability and Operational Failure Modes
        blocks:
          - type: paragraph
            body: >-
              Operating a proliferated constellation of small satellites in Low Earth Orbit entails severe technical
              failure modes and environmental hazards. Spaceborne assets face continuous exposure to solar radiation
              storms, atomic oxygen erosion, thermal cycling, and potential orbital debris conjunctions. A single
              on-orbit radar electronics malfunction or attitude control thruster failure can incapacitate a spacecraft,
              creating localized observation coverage gaps until a replacement satellite is manufactured and launched.
              Furthermore, Tomorrow.io's DeepSky constellation integrates a complex five-instrument payload on a single
              bus, compounding payload integration risks and thermal dissipation challenges. To mitigate sensor
              calibration drift and radiometric bias across varied atmospheric conditions, Tomorrow.io relies on GNSS
              radio occultation data tied to atomic time standards to continuously true its precipitation radar and
              microwave sounding measurements. Nevertheless, long-term hardware reliability in dense radiation
              environments remains an unresolved technical diligence risk.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR010
              - CR011
          - type: table
