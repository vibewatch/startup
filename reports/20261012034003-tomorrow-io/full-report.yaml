  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Enterprise Base Segmentation and Target Personas
        blocks:
          - type: paragraph
            body: >
              Tomorrow.io's customer base spans commercial enterprise and sovereign public sectors, addressing
              weather-sensitive workflows across global operations. The commercial segment is concentrated in
              transportation, aviation, energy, and logistics, where real-time atmospheric volatility directly drives
              operational disruptions and safety liabilities. Within aviation, target personas include Integrated
              Operations Control Center (IOCC) dispatchers, flight operations directors, and network planners who
              require altitude-specific turbulence and convective forecasting rather than generic airport terminal
              aerodrome reports. In the logistics and mobility sectors, fleet managers at enterprises such as Uber
              Technologies utilize automated routing insights to adjust pickup arrival estimates and safeguard couriers
              during severe convective events.


              The public sector represents an equally critical customer pillar, comprising defense institutions and
              civilian meteorological agencies. Agencies including the U.S. Air Force, the Department of Defense, and
              the National Oceanic and Atmospheric Administration (NOAA) procure proprietary satellite data feeds to
              supplement aging government remote-sensing infrastructure. In commercial technology and cloud ecosystems,
              Tomorrow.io maintains a multi-faceted relationship with Amazon Web Services, which acts simultaneously as
              an infrastructure client for operational resilience, a marketplace channel partner, and a consumer data
              customer powering the Alexa Big Sky application.
