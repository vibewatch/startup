  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Spectrum, and Environmental Compliance Risks
        blocks:
          - type: paragraph
            body: >-
              Commercial space operations introduce rigorous regulatory requirements spanning spectrum licensing, remote
              sensing compliance, and international orbital debris standards. Tomorrow.io operates Ka-band precipitation
              radars and microwave sounders in Low Earth Orbit, which requires active coordination with the Federal
              Communications Commission (FCC) and the International Telecommunication Union (ITU) to prevent radio
              frequency interference with terrestrial 5G networks and fixed satellite services. Furthermore, sovereign
              remote sensing licenses administered by the National Oceanic and Atmospheric Administration (NOAA) impose
              strict conditions regarding data dissemination, including potential government priority tasking and
              shutter control restrictions during national defense contingencies. As sovereign governments transition
              from legacy public weather satellites toward commercial data buys, Tomorrow.io's defense contracts with
              the U.S. Air Force and pilot evaluation agreements with NOAA validate compliance while exposing the
              company to evolving federal procurement standards and international ITAR compliance controls.
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR012
          - type: table
