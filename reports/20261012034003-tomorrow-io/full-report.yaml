      - number: '7.4'
        title: Capital Intensity, Synthesis Heatmap, and Diligence Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              The financial sustainability of Tomorrow.io centers on a fundamental tension between software-as-a-service
              economics and the capital intensity of space hardware infrastructure. While the company completed a $210
              million Series F financing in 2026 to accelerate DeepSky deployment, small satellites have finite
              operational lifespans of three to five years, requiring perpetual replenishment capital expenditure.
              Moreover, significant discrepancies persist across public revenue disclosures: third-party estimates
              indicate 2024 revenue of $17.5 million, whereas self-reported marketing statements claim $100 million ARR
              and other job trackers cite $120 million annual revenue. Without audited segment disclosures
              distinguishing high-margin software subscriptions from lower-margin government engineering contracts,
              investors face substantial uncertainty regarding gross margins and cash burn velocity. Critical
              thesis-break kill criteria include sustained launch delays exceeding twelve months, loss of multiple
              satellites without insurance replacement, or material enterprise customer churn.
