evidenceGaps:
  - type: missing-source
    severity: material
    topic: board composition and investor governance rights
    missingEvidence: Octane's board roster, voting control, and investor protective provisions after the Series F.
    whyItMatters: >-
      Control, board seats, and protective provisions shape decision rights and future financing risk for a regulated
      lender.
    diligencePath: Request the current board list, latest cap table, and Series E/F financing documents.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder or investor map ownership detail
    missingEvidence: Full cap table with ownership percentages, preference stack, secondary activity, and lender concentration.
    whyItMatters: Named investors and partners do not reveal concentration, liquidation preferences, or governance leverage.
    diligencePath: Obtain the fully diluted ownership table and term sheets for each round and major capital partner.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: credit performance and audited financials
    missingEvidence: Loan-level loss curves, delinquency, cohort performance, and audited financial statements.
    whyItMatters: >-
      Without credit performance, Octane can be described as profitable and growing but not underwritten as a credit
      business.
    diligencePath: Request a KPI pack with static-pool loss data, delinquency vintages, and audited statements.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: independent TAM/SAM market sizing
    missingEvidence: A reconciled third-party estimate of U.S. recreational-vehicle and powersports POS financing volume.
    whyItMatters: >-
      Without an independent TAM/SAM, market headroom and penetration can only be inferred from Octane's own served
      volume.
    diligencePath: Acquire industry-association unit-sales data and analyst market reports to triangulate financed volume.
    relatedQuestionRefs:
      - QM005
      - QM009
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: market estimate range reconciliation
    missingEvidence: Independent figures to reconcile against Octane's company-reported origination and capacity proxies.
    whyItMatters: The sizing range currently rests on company-served proxies that cannot be cross-checked against external data.
    diligencePath: Compare Octane disclosures to rating-agency pool data and OEM retail registrations for the same period.
    relatedQuestionRefs:
      - QM019
    relatedTableRefs:
      - TM002
  - type: stale
    severity: minor
    topic: market and demand freshness
    missingEvidence: Up-to-date 2026 demand and rate-environment data specific to recreational-vehicle financing.
    whyItMatters: Discretionary demand is rate-sensitive, so stale macro data could misstate near-term market direction.
    diligencePath: Refresh demand indicators and rate forecasts at each run and tie them to origination trends.
    relatedQuestionRefs:
      - QM020
      - QM021
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: dealer churn rate and multi-homing behavior
    missingEvidence: >-
      Annual dealer churn rate, proportion of dealers simultaneously using Synchrony or Sheffield alongside Octane, and
      active vs. enrolled rooftop distinction.
    whyItMatters: >-
      Dealer multi-homing directly affects the durability of the workflow lock-in thesis; if significant churn or
      multi-homing exists, the moat is weaker than distribution scale implies.
    diligencePath: >-
      Request dealer network health metrics, quarterly active-dealer count, and any multi-lender usage data from Octane
      management.
    relatedQuestionRefs:
      - QP020
  - type: missing-source
    severity: material
    topic: Gooding v. Octane Lending lawsuit nature and status
    missingEvidence: >-
      Public docket indicates a lawsuit exists but does not reveal the claims, current status, or potential financial or
      operational exposure.
    whyItMatters: >-
      Lending-practice or servicing lawsuits can signal systemic operational issues that affect regulatory standing and
      investor confidence.
    diligencePath: >-
      Request full case details, legal counsel opinion, and any regulatory correspondence related to the Gooding matter
      from Octane management.
    relatedQuestionRefs:
      - QP026
  - type: private-evidence-only
    severity: material
    topic: OEM partnership exclusivity terms and renewal rights
    missingEvidence: >-
      Whether any OEM partnership agreements include exclusivity provisions, renewal options, or volume minimums that
      would strengthen or weaken competitive moat.
    whyItMatters: >-
      Non-exclusive OEM agreements are a key competitive vulnerability; any exclusivity provisions would materially
      improve the moat assessment.
    diligencePath: Request summary of key OEM agreement terms (exclusivity, term length, renewal options) from Octane management.
    relatedQuestionRefs:
      - QP010
      - QP024
  - type: private-evidence-only
    severity: blocking
    topic: charge-off and delinquency rates
    missingEvidence: >-
      Roadrunner Financial net charge-off rates by credit tier and vintage; 30/60/90 day delinquency curves; servicer
      advance rates.
    whyItMatters: >-
      Full-spectrum lending thesis is only defensible if non-prime loss rates are bounded by Prism underwriting quality;
      without disclosure, the gross margin claim cannot be stress-tested.
    diligencePath: >-
      Request servicer reports from Roadrunner Account Services; access KBRA and S&P ABS surveillance reports
      (credentialed access required).
    relatedQuestionRefs:
      - QI010
      - QI011
      - QI023
  - type: access-blocked
    severity: material
    topic: GlobalCapital ABS Deal of the Year article and S&P structured finance surveillance
    missingEvidence: >-
      Full GlobalCapital article confirming ABS Deal of the Year for OCTL 2024-RVM1; S&P structured finance surveillance
      reports for OCTL series.
    whyItMatters: >-
      Independent credit performance verification requires access to institutional-grade surveillance reports that are
      behind paywalls or access controls.
    diligencePath: >-
      Subscribe to GlobalCapital institutional tier; request S&P performance reports from Octane management or purchase
      through S&P direct access.
    relatedQuestionRefs:
      - QI011
      - QI023
  - type: missing-source
    severity: material
    topic: Warehouse credit line terms and capacity
    missingEvidence: Warehouse facility size, committed vs. drawn amounts, covenant terms, margin call provisions, and lender list.
    whyItMatters: >-
      Warehouse lines are the operational working capital for origination; covenant breaches or capacity limits could
      halt growth at a critical moment.
    diligencePath: Request warehouse facility agreements and most recent compliance certificates from Octane management.
    relatedQuestionRefs:
      - QI022
  - type: missing-source
    severity: material
    topic: Software platform fee revenue confirmation
    missingEvidence: >-
      Whether Dealer Portal 2.0, Prequal, and Prequal Flex generate standalone subscription or transaction fees separate
      from lender economics.
    whyItMatters: >-
      If platform fees exist, they represent higher-quality recurring revenue distinct from credit-cycle-sensitive NIM
      and gain-on-sale.
    diligencePath: >-
      Request product pricing documentation and revenue breakdown by stream from Octane CFO; specifically ask about
      Prequal monetization model.
    relatedQuestionRefs:
      - QI006
      - QI014
  - type: missing-source
    severity: material
    topic: CFPB complaint volume for Roadrunner Financial and Octane Lending
    missingEvidence: >-
      CFPB complaint database does not clearly surface high-volume complaint patterns attributable to Roadrunner
      Financial or Octane Lending in accessible public search.
    whyItMatters: >-
      Complaint patterns are an adverse signal for servicing quality and regulatory risk; inability to verify their
      absence is an evidence gap, not a clearance.
    diligencePath: >-
      Search CFPB FOIA-accessible data for Roadrunner Financial specifically; request regulatory correspondence summary
      from management.
    relatedQuestionRefs:
      - QI016
  - type: missing-source
    severity: material
    topic: Gross margin definition and composition
    missingEvidence: >-
      Whether the 41% gross margin cited by Octane for 2024 includes credit loss provisions, cost of funds, platform
      costs, or is computed on a narrower gross-spread basis.
    whyItMatters: >-
      Gross margin as reported by companies may use varying definitions; without the methodology, the metric cannot be
      compared to financial services industry peers.
    diligencePath: >-
      Request gross margin definition and income statement structure from Octane CFO; clarify what costs are included
      above vs. below the gross margin line.
    relatedQuestionRefs:
      - QI025
  - topic: developer-community-signal
    description: >-
      Octane does not maintain a public GitHub organisation, developer API portal, or open-source SDK. No Stack Overflow
      tags, npm packages, or equivalent developer-community signal surfaces exist. FairPlay.ai was used as the closest
      practitioner-community proxy for the developer-signal requirement: it describes SR 11-7 algorithmic validation
      tooling that Octane uses for model governance. Octane's true API and DMS integration depth cannot be assessed from
      public sources.
    relatedQuestionRefs:
      - QE018
      - QE025
  - topic: security-compliance-certifications
    description: >-
      No SOC 2, ISO 27001, PCI DSS, or similar certification was found in public materials. This is the primary
      trust-layer gap for enterprise or OEM-level due diligence. There is no public status page or uptime SLA for the
      Octane Dealer Portal or consumer application infrastructure. Supply-chain risk from cloud or DMS provider
      concentration cannot be assessed.
    relatedQuestionRefs:
      - QE019
      - QE023
  - topic: internal-credit-model-architecture
    description: >-
      The Prism AI underwriting engine referenced in Octane company overview materials was not found as a separately
      documented product in the chapter-5 source set. Credit model features, training data, vintage-level performance,
      and servicing complaint rates remain undisclosed. No independent attestation of the FairPlay engagement or its
      test outcomes was available.
    relatedQuestionRefs:
      - QE017
      - QE024
  - topic: dealer-and-oem-concentration
    description: >-
      Dealer-level origination distribution (top 10% concentration, Gini coefficient, or monthly volume by dealer
      cohort) is not publicly disclosed. The full list of 30-plus OEM partners and revenue share by OEM channel are also
      unavailable in the reviewed source set. Private diligence is required to assess concentration and OEM-channel
      dependence risk.
    relatedQuestionRefs:
      - QU015
      - QU016
      - QU025
  - topic: oem-partner-roster-incomplete
    description: >-
      The full list of Octane's 30-plus OEM partners is not publicly disclosed. The named customer proof table (TU003)
      covers only the five OEM partners with full press releases and the RideNow dealer-group deal; it does not
      represent the complete OEM roster or concentration picture.
    relatedTableRefs:
      - TU003
    relatedQuestionRefs:
      - QU016
  - topic: consumer-satisfaction-and-retention
    description: >-
      No systematic consumer satisfaction survey, NPS, or cohort retention data was found in public sources. Trustpilot
      evidence is primarily from 2019. CFPB complaint frequency specific to Roadrunner Financial was not available in
      the reviewed search results. Geographic concentration of the consumer borrower base is also undisclosed.
    relatedQuestionRefs:
      - QU020
  - type: private-evidence-only
    severity: material
    topic: risk-organization-depth
    missingEvidence: Current risk-organization chart, committee cadence, and delegated authorities below the CRO.
    whyItMatters: >-
      Public succession news confirms the named transition but not whether Octane has enough depth under the risk leader
      to absorb turnover or rapid growth.
    diligencePath: Request the current risk org chart, committee charters, and the last two quarters of risk-governance materials.
    relatedQuestionRefs:
      - QR025
  - type: missing-source
    severity: material
    topic: state-licensing-and-enforcement
    missingEvidence: A state-by-state licensing and enforcement record for Octane and Roadrunner.
    whyItMatters: >-
      Federal-facing evidence exists, but state licensing and supervisory history determine whether there are hidden
      compliance gaps outside the limited public record reviewed here.
    diligencePath: >-
      Obtain the company compliance matrix and outside-counsel memo summarizing state lending, servicing, and collection
      licenses plus any historical exams or findings.
    relatedQuestionRefs:
      - QR026
  - type: private-evidence-only
    severity: material
    topic: litigation-scope-and-remediation
    missingEvidence: >-
      Detailed allegations, current defense posture, reserve analysis, and any remediation commitments tied to the
      Gooding matter.
    whyItMatters: >-
      The PACER signal proves the case is live, but investors still need to know whether the dispute is isolated or
      reveals a broader servicing-process weakness.
    diligencePath: >-
      Request outside-counsel summary, docket chronology, reserve memo, and internal complaint bridge for the affected
      workflow.
    relatedQuestionRefs:
      - QR027
  - type: private-evidence-only
    severity: material
    topic: partner-and-buyer-concentration
    missingEvidence: Top-OEM, top-dealer-group, and top-capital-partner concentration percentages for origination and funding.
    whyItMatters: >-
      Named counterparties show breadth, but downside sizing still depends on whether any one channel or buyer
      contributes an outsized share of volume.
    diligencePath: Request concentration tables by partner, channel, and funding program for the last twelve months.
    relatedQuestionRefs:
      - QR028
  - type: private-evidence-only
    severity: blocking
    topic: credit-performance-vintages
    missingEvidence: Recent delinquency, charge-off, recovery, and prepayment curves by vintage and channel.
    whyItMatters: >-
      Without current credit-performance data, no outside party can verify whether Octane's growth and funding access
      are supported by durable loan quality.
    diligencePath: >-
      Obtain vintage performance packs, investor tapes, and management commentary on any recent reserve or pricing
      changes.
    relatedQuestionRefs:
      - QR029
  - type: private-evidence-only
    severity: material
    topic: peer-loss-and-margin-benchmarking
    missingEvidence: >-
      Internal or banker-prepared peer set showing Octane's loss, yield, and margin profile against comparable specialty
      lenders.
    whyItMatters: >-
      Relative performance determines whether Octane deserves premium underwriting confidence or should be treated as an
      ordinary cyclical lender.
    diligencePath: >-
      Request board materials or financing decks that compare Octane performance to peer specialty-vehicle or nonprime
      lenders.
    relatedQuestionRefs:
      - QR030
  - type: missing-source
    severity: material
    topic: revenue-opacity
