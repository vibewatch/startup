figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: >-
      Octane's publicly documented customer journey spans four types of participants across distinct
      stages from initial discovery through long-term servicing.
    data:
      items:
        - label: Consumer discovers vehicle on Octane Media or OEM site
          stage: Discovery
          actors:
            - Consumer
            - OEM website visitor
          touchpoints:
            - Cycle World article
            - OEM product page
            - Prequal widget
          emotion: Interest in vehicle; uncertain about financing eligibility
        - label: Dealer prequalifies buyer via Prequal/Prequal Flex
          stage: Prequalify
          actors:
            - Dealer finance manager
            - Consumer
          touchpoints:
            - Dealer Portal 2.0 Leads Page
            - Prequal URL shared via text/email
            - SafeCheck credit report
          emotion: Confidence rises as buyer sees real loan offer without credit impact
        - label: Deal structured on Work-the-Deal page; contract e-signed
          stage: Purchase
          actors:
            - Dealer
            - Consumer
          touchpoints:
            - Work-the-Deal page (APR/term filters)
            - Digital e-sign contract
            - Roadrunner Financial funding
          emotion: Speed and simplicity determine experience quality; 15–20 min savings per deal claimed
        - label: Dealer earns Octane Preferred points on funded volume
          stage: Loyalty
          actors:
            - Dealer
          touchpoints:
            - Octane Preferred dashboard
            - All-Star / MVP tier benefits
          emotion: Positive for high-volume dealers; neutral for low-volume or new dealers
        - label: Consumer makes payments; seeks support for hardship or payoff
          stage: Servicing
          actors:
            - Consumer
            - Roadrunner Account Services
          touchpoints:
            - Online payment portal
            - Phone support (833-288-1367)
            - Hardship extension FAQs
          emotion: Mixed; historical Trustpilot reviews flag payment portal friction
        - label: OEM/dealer advertiser places media on Octane Media properties
          stage: Advertising
          actors:
            - OEM marketing team
            - Dealer group
          touchpoints:
            - Octane Media editorial sites
            - Email newsletter sponsorship
          emotion: High-quality audience engagement signal (70%+ motorcycle owners under 35)
    approximationNotes: >-
      Journey stages are constructed from product pages and press releases.
      Consumer emotion ratings are estimated from public review evidence.
