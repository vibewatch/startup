callouts:
  - calloutType: strength
    title: OEM partnership network creates distribution leverage impossible to replicate quickly
    body: >-
      Five named OEM partnerships spanning Polaris, Kawasaki, BRP, CFMOTO, and Honda provide Octane
      access to hundreds of manufacturer-controlled dealer relationships and consumer web traffic at scale.
      The Kawasaki upgrade from non-prime to full-spectrum in 2024 and CFMOTO's December 2024 prime
      expansion both show that OEM relationships deepen over time rather than remaining static, which
      is the strongest retention signal available in the public record.
