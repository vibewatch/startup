company:
  name: Octane
chapter:
  number: 6
  title: Customers
  summary: >-
    Octane serves three distinct customer segments — powersports and RV dealers (4,000-plus),
    OEM manufacturer partners (30-plus) embedded via branded financing programs, and consumer
    borrowers financed through Roadrunner Financial. Public customer proof is strongest at the
    OEM-partnership level with named press releases from Polaris, Kawasaki, BRP, CFMOTO, and
    the RideNow private-label deal, but consumer satisfaction data is mixed and adverse
    complaint evidence from Trustpilot and BBB primarily flags historical payment-portal and
    credit-reporting friction. Retention and concentration data are not publicly disclosed.
sections:
  - id: section-1
    title: Customer segmentation — dealers, OEMs, consumers, and media advertisers
    body: >-
      Octane's customer base divides into four distinct segments with different value propositions
      and evidence quality. Powersports and OPE dealers (4,000-plus as of April 2024, per the
      Dealer Portal 2.0 press release) are the primary sales and distribution channel: they originate
      loans, use workflow tools, and participate in the Octane Preferred loyalty programme. The dealer
      segment spans independent powersports retailers, franchise dealerships, and Outdoor Power
      Equipment dealers; RV dealers are a growing secondary group after Octane entered the RV market.
      The second segment is OEM manufacturers who embed Octane financing as a branded or promotional
      solution for their dealer networks. These OEM partnerships — covering Polaris, Kawasaki, BRP
      (Sea-Doo), CFMOTO, Honda, and others — give Octane access to OEM-owned dealer networks and
      consumer traffic on OEM websites, broadening origination reach beyond dealers who independently
      enrolled. The third segment is consumer borrowers: individuals financing powersports vehicles,
      RVs, or marine craft through Roadrunner Financial at the point of purchase. Consumers do not
      contract directly with Octane but interact through Roadrunner Financial's branded borrower
      portal, phone support, and online payment system. The fourth and newest segment is media
      advertisers — OEMs, large dealer chains, and insurers who pay to reach Octane Media's audience
      across its seven publications. This segment was activated in May 2023. Evidence quality varies
      sharply: the dealer and OEM segments have strong named-proof in press releases, while the consumer
      segment has operational servicing disclosures and some adverse review evidence but no systematic
      satisfaction or retention data publicly available.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
    tableRefs:
      - TU001
      - TU002
    figureRefs:
      - FU001
  - id: section-2
    title: OEM partner adoption and production deployments
    body: >-
      The OEM segment is Octane's most visible and verifiable customer cohort. Five named partnerships
      with major OEMs have been announced via press releases, each describing a production deployment
      across the OEM's full US dealer network. Polaris (December 2021, effective January 2022) covers
      Sportsman, RANGER, RZR, GENERAL, Indian Motorcycle, Slingshot, and snowmobiles across a large
      global dealer network. BRP expanded its Sea-Doo partnership in November 2021 to include the
      Sea-Doo Switch pontoon, extending an existing powersports relationship that began in 2017. Kawasaki
      announced a full-spectrum agreement in January 2024 covering its entire US product line —
      motorcycles, ATVs, side-by-sides, and JET SKI watercraft — across 1,000-plus independent US
      dealers. CFMOTO announced a prime-and-non-prime agreement in December 2024 covering its full ATV,
      side-by-side, and motorcycle lineup across more than 600 US dealers; notably, more than a quarter
      of CFMOTO's dealer network already had Octane Prequal embedded before the prime-financing expansion.
      Honda has a dedicated Octane landing page listing UTV and ATV financing options. The company
      claims 30-plus OEM partners in total, with the five named deals representing only a subset of
      that roster. The OEM partnership model creates a structural distribution advantage: OEMs direct
      dealer network participation, embed Octane prequalification in their consumer-facing websites, and
      jointly market financing promotions. This makes OEM relationships a distribution lever, not simply
      a co-branding arrangement. Public gaps include the total list of 30-plus OEM partners, revenue or
      volume attributable to any specific OEM channel, and any contract-length or renewal evidence.
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
    tableRefs:
      - TU003
    figureRefs:
      - FU002
  - id: section-3
    body: >-
      The strongest customer proof in the public record is the October 2024 RideNow Finance private-label
      partnership. RideNow, a RumbleOn company (NASDAQ: RMBL), is the largest powersports dealership group
      in the US with 56 stores and over 18,000 new and pre-owned vehicles in inventory. The partnership
      gives RideNow's 56 retail stores Octane-powered branded financing under the RideNow Finance name,
      including digital tools, full-spectrum financing, and branded lifecycle marketing. This is described
      as the only private-label branded financing arrangement for a dealership group in the nearly
      $30 billion powersports market. RumbleOn CEO Mike Kennedy stated that easing the financing process
      through RideNow Finance was how the company would take the buying experience to the next level.
      Beyond RideNow, dealer testimonials in official press releases provide secondary customer proof.
      Tammy Coleman, Finance Manager at All Out Cycles in Virginia, stated that Dealer Portal 2.0 saves
      fifteen to twenty minutes per deal. Kenny Chen, Dealer Principal at Onyx Moto in San Diego,
      described Prequal Flex as effortless to share and said the soft-pull approach ensures customers feel
      at ease. These testimonials are company-published and not independently verified but do represent
      named, production-context customer quotes. The 2022 milestone press release notes that Octane grew
      originations per dealer by 37% year-over-year and that the number of dealers who funded more than
      ten loans per month grew by 50%, signals of deepening dealer engagement rather than breadth-only
      growth. Public gaps include dealer NPS, cohort churn rates, OEM contract renewal evidence, and
      customer-facing satisfaction metrics beyond anecdotal testimonials.
    claimRefs:
      - CU017
      - CU018
      - CU019
      - CU020
      - CU021
      - CU022
      - CU023
      - CU024
    tableRefs: []
    figureRefs:
      - FU003
  - id: section-4
    title: Consumer experience, retention signals, and adverse evidence
    body: >-
      Consumer experience is the least well-documented and most adversely evidenced customer segment
      in the public record. Roadrunner Financial's servicing disclosures confirm operationally mature
      borrower-rights policies — no prepayment penalty, hardship extensions, SCRA military protections,
      and a phone-accessible payment system — which suggest the servicing layer meets baseline consumer
      finance standards. However, Trustpilot reviews of roadrunnerfinancial.com include substantiated
      adverse signals: one reviewer described the payment website as the worst website they had ever
      encountered, citing an inability to make online payments from a mobile device and the need to
      pay over-the-phone surcharges. Another reviewer reported a credit-reporting disruption after a
      servicer transfer in early 2019, which affected their credit profile during a mortgage application.
      The company's Trustpilot responses acknowledge specific service failures, confirming that the
      complaints are not fabricated. BBB Business Profiles for Roadrunner Financial are also in the
      public record but the reviewed page did not disclose a specific rating or complaint count. The
      CFPB consumer complaint database is publicly accessible and covers auto loan servicers including
      niche lenders; complaint volume or regulatory action specific to Roadrunner Financial was not
      found in the reviewed materials, which does not confirm a clean regulatory record — only that
      no specific enforcement action or published settlement was visible. The Trustpilot and BBB
      evidence is primarily from 2019 and may reflect early-stage servicing infrastructure; Roadrunner's
      public disclosures by 2026 describe a more developed borrower-support stack. The core adverse gap
      is that no systematic consumer satisfaction survey, NPS, or independent review aggregate with
      sufficient response count was available in public sources to assess the consumer segment at scale.
    claimRefs:
      - CU025
      - CU026
      - CU027
      - CU028
      - CU029
      - CU030
      - CU031
    tableRefs:
      - TU004
    figureRefs:
      - FU004
  - id: section-5
    title: Expansion dynamics, concentration risk, and channel dependence
    body: >-
      Octane's growth trajectory is supported by a multi-dimensional expansion pattern: new OEM partners,
      new vehicle verticals (RV, marine, OPE), new tools (Prequal Flex, SafeCheck, Preferred), and
      private-label deals (RideNow Finance). In 2024, Octane doubled RV originations for the second
      consecutive year and entered marine, adding two verticals that reduce powersports cyclicality
      concentration. The originations grew 36% in 2024 to $1.6 billion and reached $5 billion in
      aggregate by September 2024. These growth signals validate a land-and-expand motion: Octane
      starts with powersports dealer relationships, adds Prequal/Prequal Flex to the dealer's website,
      then deepens with SafeCheck, Preferred, and eventually RideNow-style private-label branding.
      However, the concentration risks are material. Powersports is a highly cyclical, discretionary
      consumer-credit category; 2022 was described as a period of pervasive inventory constraints.
      OEM concentration is not disclosed: if one or two large OEM partners (Polaris, Kawasaki) account
      for a disproportionate share of originations, their program changes could materially impact
      volumes. The dealer base of 4,000-plus is large, but Octane's 2022 press release notes that the
      number of dealers funding over ten loans per month grew 50%, implying that a relatively small
      subset of dealers may account for a large share of volume. No Herfindahl or top-dealer
      concentration data is public. Consumer-borrower geographic concentration is also undisclosed —
      powersports demand skews toward rural and suburban markets, which may concentrate credit risk
      in specific regions. The RideNow private-label deal, while a marquee win, creates a new form
      of concentration: a single dealership group embedded with Octane's infrastructure at 56 locations.
      Investors need private data on dealer-level origination concentration, OEM-program revenue share,
      and borrower-cohort geographic and credit-tier distribution before making concentration judgments.
    claimRefs:
      - CU032
      - CU033
      - CU034
      - CU035
      - CU036
