      - CU013
  - calloutType: risk
    title: Consumer satisfaction and dealer concentration evidence is insufficient for conviction
    body: >-
      Trustpilot adverse reviews, a lack of public NPS data, and no disclosed dealer-level origination
      concentration data leave the consumer and dealer retention picture materially incomplete. The
      Trustpilot evidence is primarily from 2019 and may not represent current servicing quality, but
      the absence of systematic positive data means investors cannot independently validate the service-
      quality narrative. Private cohort-level retention and concentration data are essential before
      the customer chapter can support high conviction.
    claimRefs:
      - CU025
      - CU026
      - CU027
      - CU028
      - CU035
      - CU036
