companyProfile:
  summary: >-
    Octane (Octane Lending, Inc.) is a New York-based fintech company founded in 2014 by Jason Guss
    and team. Through its in-house lender Roadrunner Financial, Octane provides instant digital
    financing for powersports, recreational vehicles, marine, trailer, and outdoor power equipment
    markets. The platform connects more than 4,000 active dealers and 50 OEM partners with consumers
    via proprietary underwriting technology that delivers near-instant credit decisions. In 2025 Octane
    originated $2.1 billion in loans, sold 91% into a diversified capital markets program, and achieved
    its third consecutive year of GAAP net income profitability on approximately $400 million in revenue.
    Its December 2025 Series F closed at a $1.3 billion post-money valuation.
  foundedDate: "2014-01-01"
  founders:
    - name: Jason Guss
      role: Co-Founder & CEO
      background: >-
        Serial entrepreneur; co-founded Octane in 2014 and has led it through the Series F at a
        $1.3B valuation and three consecutive years of GAAP profitability.
      claimRefs: [CO008]
  foundingLocation: New York, NY
  headquarters: New York, NY
  productSummary: >-
    Octane offers a full-stack digital lending platform: consumer-facing Roadrunner Financial for
    near-instant loan originations, PreQual and PreQual Flex for soft-pull prequalification, Dealer
    Portal 2.0 for merchant workflow management, and Captive-as-a-Service enabling OEMs and dealer
    groups to launch white-label captive finance programs.
  customerFocus: >-
    Powersports, RV, marine, trailer, and outdoor power equipment dealers and OEMs; prime and
    non-prime consumer end-borrowers in recreational vehicle markets.
  businessModel: >-
    Originate-to-sell: Octane originates loans through Roadrunner Financial, collects origination
    fees and net interest margin on a retained portfolio, and sells the majority of loans via
    forward-flow agreements, whole-loan sales, and asset-backed securitizations. Platform and
    technology fees are earned from OEM and dealer integrations.
  stage: Series F
  fundingStatus: >-
    $100M Series F closed December 15, 2025 at $1.3B post-money valuation, led by Valar Ventures,
    with participation from Upper90, Huntington Bank, Camping World/Good Sam, and Holler-Classic.
    Cumulative equity raised: approximately $342M since founding.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO005, CO014, CO015, CO024, CO028, CO034, CO035]
summary:
  headline: >-
    Octane is a profitable, high-growth specialty fintech lender with a defensible moat in
    powersports and recreational markets; the $1.3B valuation is fair given GAAP profitability
    and 29% originations growth, making this a buy for specialty fintech investors with medium
    confidence pending full financial disclosure.
