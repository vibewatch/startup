      - number: '1.2'
        title: Leadership, Governance, and Key-Person Dependence
        blocks:
          - type: paragraph
            body: >
              Octane's leadership bench combines founder continuity with a 2024-2025 wave of senior hires that signals a

              deliberate scale-up. Co-founder Jason Guss remains chief executive officer and is the public face of the
              company

              in funding and milestone coverage. In 2024 Octane appointed Steven Fernald as its first president and
              named Mark

              Molnar chief risk officer, with co-founder Ray Duggins moving to an advisory role. In 2025 the company
              appointed

              Sean Fernandez-Ledon as its first chief legal officer and promoted Jon Vestal and Kartik Kothari to
              executive

              vice president positions. The pattern of firsts — first president, first CLO — is itself a diligence
              signal:

              Octane is institutionalizing functions (legal, risk, operations) that a venture-stage lender can run
              informally

              but a $1.3B-valuation regulated lender cannot. The most important key-person dependence sits with the
              founder-

              CEO and the risk function, because a balance-sheet-light lender lives or dies on underwriting discipline
              and on

              continued access to forward-flow and securitization buyers, both of which are relationship-driven. The
              public

              record is thin on board composition and investor governance rights, which is the principal governance gap
              a

              buyer or later-stage investor would need to close before underwriting control and incentive alignment.
