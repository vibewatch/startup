      - number: '4.2'
        title: Pricing and Monetization
        blocks:
          - type: paragraph
            body: >-
              Octane does not publicly disclose interest rate schedules, dealer fee structures, or platform pricing. The
              observable proxies are: (1) the company offers full-spectrum credit (prime through non-prime), implying a
              range of APRs that are typically higher for non-prime borrowers and competitive with bank rates for prime;
              (2) the Octane Preferred B2B loyalty program provides economic incentives to dealers, but specific rebate
              structures are not published; (3) forward-flow and whole-loan sale pricing is negotiated bilaterally with
              institutional counterparties, and the realized gain margin is not disclosed. The December 2025 Series F
              press release specifically noted that Upper90 cited Octane as growing rapidly and profitably, suggesting
              positive unit economics, but this remains an investor-quoted claim rather than an audited result. The only
              publicly observable pricing information is the description of Synchrony's competitive 2 percent dealer
              rebate, which provides an indirect benchmark for what Octane may need to offer. On the capital-markets
              side, the 2024 OCTL 2024-3 ABS transaction achieved credit spreads materially lower than initial guidance,
              signaling strong institutional demand and potentially better-than-expected execution economics for that
              period. The 2025 OCTL 2025-RVM1 was the second RV/marine ABS shelf, winning the GlobalCapital ABS Deal of
              the Year 2025, which suggests ongoing credit-spread improvement as the program matures.
            claimRefs:
