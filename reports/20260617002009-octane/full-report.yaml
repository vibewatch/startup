  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Scale and funding proof support taking Octane seriously, but disclosure gaps and cyclical credit exposure keep the
      recommendation at track rather than buy.
    data:
      nodes:
        - id: scale
          label: 'Scale proof: $1.6B 2024 originations and $5B+ aggregate volume'
        - id: funding
          label: 'Funding proof: ABS plus forward-flow programs with multiple counterparties'
        - id: strategy
          label: 'Strategic validation: Valar-led Series F with category-linked participants'
        - id: opacity
          label: 'Opacity penalty: no public 2026 revenue, ARR, or loss-curve disclosure'
        - id: valuation
          label: 'Valuation stance: $1.3B+ appears base-case fair, not obviously cheap'
        - id: recommendation
          label: 'Recommendation: track and diligence deeply before paying through the mark'
      edges:
        - from: scale
          to: funding
          label: throughput attracts capital
        - from: funding
          to: strategy
          label: institutional support reinforces narrative
        - from: strategy
          to: valuation
          label: supports current mark
        - from: opacity
          to: valuation
          label: caps multiple confidence
        - from: valuation
          to: recommendation
          label: requires entry discipline
    approximationNotes: Recommendation logic is an analyst synthesis rather than a management-provided decision tree.
    claimRefs:
      - CV001
      - CV008
      - CV013
      - CV016
      - CV021
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      Scenario midpoints and public-market guardrails show that Octane already sits above the bear case but well below
      larger disclosed fintech platforms.
    data:
      items:
        - label: Bear case midpoint
          value: 750
          unit: $M valuation
          note: Assumes cyclical downturn and funding compression
        - label: Series F post-money floor
          value: 1300
          unit: $M valuation
          note: Company disclosed $1.3B+ post-money in Dec 2025
        - label: Base case midpoint
          value: 1300
          unit: $M valuation
          note: Fair if scale holds and no visible credit stress emerges
        - label: Bull case midpoint
          value: 2200
          unit: $M valuation
          note: Requires repeat profitability and better disclosure
        - label: LendingClub public market cap
          value: 2190
          unit: $M valuation
          note: Public lender guardrail with disclosed revenue and filing history
        - label: Upstart public market cap
          value: 3080
          unit: $M valuation
          note: Shows higher ceiling but also sentiment sensitivity
    approximationNotes: Public market cap reference points are June 2026 snapshots and are not adjusted for capital structure differences.
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Base-case valuation centers on the last round, while both downside and upside remain wide because the market lacks
      transparent operating data.
    data:
      items:
        - label: Bear Case
          low: 600
          mid: 750
          high: 900
          unit: $M
          note: Funding stress plus cyclical demand and opaque credit performance
        - label: Base Case
          low: 1100
          mid: 1300
          high: 1500
          unit: $M
          note: Series F remains broadly fair if current scale and funding durability persist
        - label: Bull Case
          low: 1800
          mid: 2200
          high: 2800
          unit: $M
          note: Requires revenue visibility, repeat profitability, and platform expansion beyond current niches
    approximationNotes: >-
      Ranges reflect scenario judgment, not company guidance, and should be interpreted as common-equivalent enterprise
      value ranges subject to preference-stack review.
    claimRefs:
      - CV022
      - CV023
      - CV024
      - CV033
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      IC-style scoring favors Octane on proof and capital access, but discounts the name for evidence quality and
      opacity.
    data:
      items:
        - label: Market Opportunity
          value: 7/10
          note: Large recreation-finance niche, but not a mass-market universal lender
        - label: Proof of Scale
          value: 8/10
          note: $1.6B 2024 originations and $5B+ aggregate originations are meaningful
        - label: Distribution / Moat
          value: 7/10
          note: Dealer, OEM, and strategic partner relationships matter, but are not fully disclosed
        - label: Funding Engine
          value: 8/10
          note: ABS and multiple forward-flow channels show repeat capital formation
        - label: Economics Visibility
          value: 3/10
          note: No public 2026 revenue, ARR, margin, or loss-curve detail
        - label: Risk Profile
          value: 4/10
          note: Cyclical category plus credit-market dependency keeps residual risk high
        - label: Valuation Attractiveness
          value: 5/10
          note: Base-case fair, but not cheap enough to overcome missing disclosure
    approximationNotes: Scores are analyst judgment on a ten-point scale using only public evidence available to this chapter.
    claimRefs:
      - CV015
      - CV016
      - CV017
      - CV020
      - CV021
