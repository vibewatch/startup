            title: Integrated soft-pull, dealer workflow, and media flywheel is a genuine architectural moat
            body: >-
              Octane's combination of free soft-pull tools (Prequal/Prequal Flex/SafeCheck) embedded in a dealer-facing
              portal that also aggregates pre-credited leads from seven editorial properties creates a distribution and
              data loop that pure-play lenders and standalone software vendors cannot easily replicate. The 400,000
