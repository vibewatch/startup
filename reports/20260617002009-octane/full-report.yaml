      - number: '3.2'
        title: Peer Profiles
        blocks:
          - type: paragraph
            body: >-
              Sheffield Financial, a division of Truist Bank, has provided consumer financing for outdoor power
              equipment, powersports, marine, golf cars, and trailers for more than 30 years. Its Truist Bank backing
              provides balance-sheet access that outweighs any single fintech, but Sheffield does not operate a
              standalone ABS program, does not serve non-prime customers with Octane's breadth, and has not announced
              major OEM co-branded agreements. Synchrony Financial offers secured installment loans (up to 84 months for
              powersports and trailers, 180 months for marine) and a revolving Outdoors Credit Card with a documented 2
              percent dealer rebate on loans exceeding $5,000. Synchrony's platform is well-capitalized and widely
              deployed but does not provide full-spectrum non-prime credit coverage. Harley-Davidson Financial Services
              (HDFS), a subsidiary of NYSE-listed Harley-Davidson Inc., serves as captive lender for the Harley-Davidson
              dealer network, offering manufacturer-backed subsidized promotional rates that independent platforms
              cannot replicate. Yamaha Motor Finance and BRP Finance represent similar brand-captive models with strong
              consumer loyalty but narrow collateral scope limited to their respective manufacturer brands. Regional
              credit unions such as GreenState and Georgia's Own Credit Union offer competitive rates on
              recreational-vehicle loans but lack dealer-workflow software or multi-OEM program infrastructure.
