      - number: '4.3'
        title: Cost Structure and Gross Margin
        blocks:
          - type: paragraph
            body: >-
              Octane's cost structure reflects its dual nature as both a financial institution and a technology
              platform. The primary cost components are: (1) cost of funds (warehouse line interest, ABS coupon
              payments, forward-flow pricing) which is the largest cost driver and directly determines NIM; (2) credit
              losses from Roadrunner Financial's held loan book, which are a function of underwriting quality and the
              credit cycle; (3) technology infrastructure and product development costs for OctaneOS, Dealer Portal,
              Prequal, and supporting systems; (4) sales, marketing, and dealer-partner management costs; and (5)
              servicing operations at Roadrunner Account Services. The company's 2024 annual update cited 41 percent
              gross margin, which is a positive signal if validated. For a hybrid fintech-lender, a 41 percent gross
              margin would imply effective control of cost-of-funds and credit losses relative to revenue. However,
              gross margin as defined by Octane may not include all credit-cycle charges, and the definition has not
              been independently verified. The capital intensity of the business is meaningful because origination
              growth requires either on-balance-sheet funded capital (warehouse lines) or committed off-balance-sheet
              capacity (forward-flow), both of which have capacity limits and cost implications. The $100 million Series
              F equity raise was stated to be used for growth initiatives and secondary share transfers, suggesting the
              equity is primarily operational capacity rather than credit-loss buffer alone.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
