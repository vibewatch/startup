  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Ranking And Overview
        blocks:
          - type: paragraph
            body: >-
              Octane's risk stack ranks first as funding-and-credit sensitivity, second as regulatory and litigation
              exposure, third as servicing and operational execution, fourth as partner dependency, and fifth as
              information opacity. The top risk is not that Octane lacks capital access today; public evidence shows the
              opposite, with a repeat ABS program, named forward-flow investors, and a recent Series F. The risk is that
              this access is market conditioned. Octane is a specialty lender in discretionary vehicle categories, and a
              lender that sells or securitizes most of what it originates must keep three systems working at once:
              borrower demand, underwriting discipline, and buyer appetite. If rates stay elevated, ABS spreads widen,
              or loan performance underwhelms private expectations, growth can slow while on-balance-sheet exposure
              rises at the same time. The second cluster is compliance and legal risk. Roadrunner sits directly in the
              borrower relationship, a live 2026 case exists on PACER, and the company's digital workflow naturally
              raises fair-lending, disclosure, collections, and servicing questions. Operationally, the 2024 CRO
              succession, fraud handling, total-loss servicing, and borrower complaint surfaces matter because they
              affect both credit performance and dealer/OEM trust. The honest conclusion is that Octane looks fundable
              and institutionalized, but not yet transparent enough to dismiss downside tails without deeper diligence.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR016
              - CR018
              - CR023
              - CR027
              - CR030
