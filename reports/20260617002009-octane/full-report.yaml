  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model
        blocks:
          - type: paragraph
            body: >-
              Octane's revenue model operates on at least three distinct, overlapping channels. First and most
              fundamental is net interest income: Roadrunner Financial, its in-house lender, originates fixed-rate
              installment loans and earns the spread between the interest rate charged to borrowers and the cost of
              funding (warehouse lines, ABS proceeds, or forward-flow pricing). Second, when Octane sells whole-loan
              pools to institutional investors like Yieldstreet and Bayview, it can realize gain-on-sale income
              representing the premium above the par value of the loan pool; Octane has sold or committed $3.7 billion
              through this channel since December 2023. Third, in ABS transactions, Octane typically retains a residual
              or subordinated interest while selling senior tranches to investors; the execution spread between bond
              yield and loan yield generates income. A fourth possible stream is software or platform fee revenue from
              Dealer Portal, Prequal, and Prequal Flex tools deployed at more than 1,200 dealers each, though Octane has
              not publicly confirmed whether these tools carry separate subscription fees or are bundled into the lender
              economics. Fifth, Roadrunner Account Services earns servicing fees on the growing managed portfolio of
              sold loans, which is a recurring revenue stream that scales with the size of the off-balance-sheet book.
              The 2024 annual update cites 46 percent revenue growth and 41 percent gross margin; Upper90 described
              Octane as growing rapidly and profitably. However, these remain company-asserted figures without
              independent audit confirmation.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
