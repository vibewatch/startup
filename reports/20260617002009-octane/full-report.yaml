  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation — dealers, OEMs, consumers, and media advertisers
        blocks:
          - type: paragraph
            body: >-
              Octane's customer base divides into four distinct segments with different value propositions and evidence
              quality. Powersports and OPE dealers (4,000-plus as of April 2024, per the Dealer Portal 2.0 press
              release) are the primary sales and distribution channel: they originate loans, use workflow tools, and
              participate in the Octane Preferred loyalty programme. The dealer segment spans independent powersports
              retailers, franchise dealerships, and Outdoor Power Equipment dealers; RV dealers are a growing secondary
              group after Octane entered the RV market. The second segment is OEM manufacturers who embed Octane
              financing as a branded or promotional solution for their dealer networks. These OEM partnerships —
              covering Polaris, Kawasaki, BRP (Sea-Doo), CFMOTO, Honda, and others — give Octane access to OEM-owned
              dealer networks and consumer traffic on OEM websites, broadening origination reach beyond dealers who
              independently enrolled. The third segment is consumer borrowers: individuals financing powersports
              vehicles, RVs, or marine craft through Roadrunner Financial at the point of purchase. Consumers do not
              contract directly with Octane but interact through Roadrunner Financial's branded borrower portal, phone
              support, and online payment system. The fourth and newest segment is media advertisers — OEMs, large
              dealer chains, and insurers who pay to reach Octane Media's audience across its seven publications. This
              segment was activated in May 2023. Evidence quality varies sharply: the dealer and OEM segments have
              strong named-proof in press releases, while the consumer segment has operational servicing disclosures and
              some adverse review evidence but no systematic satisfaction or retention data publicly available.
