      - number: '4.4'
        title: Traction vs. Financial Opacity
        blocks:
          - type: paragraph
            body: >-
              Octane's publicly available traction metrics are strong but unaudited. The 2024 annual update reports $1.6
              billion in originations (36 percent growth YoY), 46 percent revenue growth, and 41 percent gross margin.
              Total originations since founding exceeded $7 billion as of the December 2025 Series F announcement. RV
              originations doubled for the second consecutive year in 2024, and the ABS program attracted over 100
              institutional investors across four 2024 transactions. These are meaningful scale signals. At the same
              time, the transparency gaps are significant: there are no audited financial statements, no charge-off or
              delinquency disclosures, no breakdown of revenue by stream, no cost-of-capital or warehouse-line terms,
              and no cohort-level loan performance data accessible without institutional investor credentials. The KBRA
              and S&P rating reports for individual ABS transactions contain performance data but are paywalled or
              require institutional access. The GlobalCapital article confirming the ABS Deal of the Year award was
              access-blocked at time of research. The CFPB consumer complaint database does not show clearly
              attributable Roadrunner Financial or Octane Lending complaints in easily accessible public search (Octane
              primarily serves prime and near-prime customers through a dealer channel, which may limit complaint
              volume). The result is a favorable public narrative with limited independent financial verification.
