      - number: '3.5'
        title: Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Octane's competitive moat rests on four partially reinforcing elements. First, its ABS capital-markets
              program (16 transactions totaling $4.7 billion-plus since 2019) provides an origination-capacity ceiling
              that most competitors cannot approach independently; Sheffield and Synchrony fund through bank balance
              sheets rather than the public ABS market. Second, the combination of lender economics and dealer software
              creates data-network effects where more funded volume improves underwriting models over time and the
              software becomes stickier with use. Third, the multi-OEM partnership portfolio makes it costly for any
              single OEM to substitute Octane wholesale, because the platform now serves complementary brands whose
              combined dealer reach exceeds any individual captive. Fourth, the Captive-as-a-Service product introduced
              in 2025 represents a new competitive vector that could extend Octane's private-label model into auto
              dealer groups and additional recreational categories. Risks to moat durability include OEM partners
              potentially deepening captive programs, large bank-backed competitors investing in non-prime credit tools,
              and dealer-software integration advantages eroding if third-party loan-origination system vendors add
              similar embedded lender routing.
            claimRefs:
              - CP018
              - CP020
              - CP021
              - CP022
              - CP034
