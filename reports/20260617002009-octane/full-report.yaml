  - id: FR002
    title: Risk transmission map
    type: dag
    layout: standard
    summary: >-
      Shows how compliance, funding, and servicing problems propagate into growth, margin, and valuation instead of
      remaining isolated operational issues.
    data:
      nodes:
        - label: Regulatory / legal event
          detail: Litigation, fair-lending review, or complaint escalation
        - label: Servicing breakdown
          detail: Payment, fraud, or total-loss workflow failure
        - label: Funding disruption
          detail: Forward-flow slowdown or weaker ABS execution
        - label: Origination growth
          detail: Dealer and borrower conversion volume
        - label: Credit losses / margin
          detail: Economics after delinquencies, spreads, and remediation
        - label: Partner trust
          detail: OEM, dealer, and bank willingness to keep routing volume
        - label: Valuation
          detail: Equity and exit multiple confidence
      edges:
        - from: Regulatory / legal event
          to: Partner trust
          label: raises diligence burden
        - from: Servicing breakdown
          to: Partner trust
          label: weakens borrower experience
        - from: Funding disruption
          to: Origination growth
          label: constrains capacity
        - from: Origination growth
          to: Credit losses / margin
          label: changes mix and fixed-cost leverage
        - from: Credit losses / margin
          to: Valuation
          label: compresses economics
        - from: Partner trust
          to: Origination growth
          label: affects dealer/OEM referrals
    claimRefs:
