  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing Metric
      - Why It Matters
      - Impact on Underwriting
      - Diligence Path
    rows:
      - - Audited financial statements
        - Only audited figures support independent revenue, margin, and balance-sheet verification
        - Cannot confirm 46% revenue growth or 41% gross margin without auditor sign-off
        - Request most recent audited financials (balance sheet, P&L, cash flow) from management
      - - Net charge-off rates by credit tier and vintage
        - Charge-offs determine true credit economics for full-spectrum lending
        - Full-spectrum credit thesis fails if non-prime charge-offs are outsized
        - Request servicer reports and Roadrunner Financial internal credit metrics
      - - Delinquency rates (30/60/90 day)
        - Leading indicator of future charge-offs and ABS collateral performance
        - High delinquency could trigger structural ABS events; ABS investors would know this privately
        - Access KBRA/S&P ABS surveillance reports; or request from Octane management
      - - Net interest margin and cost of funds
        - NIM is the fundamental economic engine of the held-loan book
        - Without NIM disclosure, gross margin definition may exclude key credit costs
        - Request cost of warehouse lines, ABS coupon history, and NIM by vintage
      - - Warehouse credit line terms and availability
        - Warehouse lines are the working capital of origination; covenant breaches could halt growth
        - Capacity constraints on warehouse lines limit origination ability
        - Request warehouse facility agreements, committed amounts, and covenant terms
      - - Burn rate and operating cash flow
        - Equity runway determines next-round trigger and dilution risk
        - Series F may be insufficient if operating losses are high
        - Request last 12-month operating cash flow; confirm whether company is currently profitable
      - - Software/platform fee revenue breakdown
        - Confirms whether Prequal and Portal represent standalone SaaS revenue
        - Changes the revenue quality and recurring revenue assessment
        - Confirm in management discussion whether platform fees exist and their magnitude
      - - ABS performance vs. expectations
        - ABS collateral performance determines whether ratings hold and future spreads tighten or widen
        - Poor performance would increase cost of capital in ABS market
        - Request KBRA/S&P surveillance reports for OCTL 2023/2024/2025 series
    notes: >-
      These gaps represent the highest-priority items for investor diligence before committing capital to Octane. The
