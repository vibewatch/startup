      - number: '7.5'
        title: Financial Model
        blocks:
          - type: paragraph
            body: >-
              The financial-model risk is that Octane combines lender economics with capital-markets dependence in a
              cyclical, discretionary category, while disclosing too little publicly to let outside investors fully size
              the downside. Federal Reserve policy matters twice: it changes monthly borrower affordability and it
              changes structured-finance pricing. In a strong market, Octane can benefit from fast digital origination,
              institutional buyer demand, and a balance-sheet-light sale model. In a stressed market, the same
              architecture can work in reverse. Slower demand and worse loan performance can coincide with wider spreads
              or slower execution, leaving more loans temporarily on balance sheet and raising the importance of
              warehouse capacity and liquidity buffers. Auto Finance News suggests management is aware of this and
              targets a nine-month buffer, which is constructive. The problem is opacity. Public materials support the
              existence of ABS issuance, rating coverage, funding commitments, and a historical profitability milestone,
              but they do not give charge-off curves, delinquency trends, cohort recoveries, or enough revenue detail to
              judge whether the model remains attractive through a full cycle. That means Octane's core financial risk
              is not simply leverage or cash burn; it is whether credit performance and gain-on-sale economics remain
              durable when external conditions tighten.
            claimRefs:
              - CR015
              - CR016
              - CR017
              - CR018
              - CR020
              - CR023
              - CR024
              - CR026
              - CR027
              - CR032
              - CR033
              - CR034
      - number: '7.6'
        title: Mitigations
        blocks:
          - type: paragraph
            body: >-
              Octane is not unmitigated. The strongest public mitigants are a demonstrated ABS program, multiple named
              forward-flow buyers, a recent equity raise, a formal CRO appointment, and visible borrower-support
              procedures around fraud, military borrowers, and total-loss events. Those signals suggest the company is
              already behaving more like an institutional specialty lender than a lightly governed fintech experiment.
              Still, the most important mitigants are exactly the ones that need private verification. Investors should
              ask for recent delinquency and charge-off curves by vintage, warehouse covenants, investor concentration
              by buyer and facility, fair-lending testing results, complaint-resolution metrics, and a legal memo on the
              Gooding case. If those materials show stable collateral performance, diversified buyer demand, and
              well-controlled servicing, Octane's risks are probably manageable within a growth-finance thesis. If they
              show rising early-stage delinquency, buyer pullback, poor complaint remediation, or weak model-governance
              evidence, the risk stack moves from manageable to thesis-breaking quickly. Put differently: Octane appears
              to have real mechanisms to absorb ordinary volatility, but the company has not publicly disclosed enough
              to prove resilience under a sharper funding or credit shock. The kill criteria therefore need to be
              explicit before any investor relies on the current headline growth narrative.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR008
              - CR018
              - CR020
              - CR027
              - CR031
              - CR032
              - CR036
              - CR037
              - CR040
          - type: table
            tableRef: TR005
            claimRefs:
              - CR001
              - CR016
              - CR023
              - CR027
              - CR030
              - CR032
              - CR036
              - CR037
      - number: '7.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding diversity is a mitigation, not immunity
            body: >-
              Octane has more real funding outlets than many fintech lenders, but every outlet still depends on credit
              performance and market appetite. Diversification reduces single-counterparty failure risk; it does not
              eliminate regime risk.
            calloutType: insight
            claimRefs:
              - CR018
              - CR020
              - CR031
              - CR032
          - type: callout
            title: The live case changes the diligence bar
            body: >-
              The Gooding docket means legal risk is not hypothetical. Even if the case proves isolated, investors
              should request a written legal assessment, remediation history, and borrower-complaint bridge before
              assuming minimal exposure.
            calloutType: risk
            claimRefs:
              - CR001
              - CR030
              - CR036
          - type: callout
            title: Underwrite to private data, not growth headlines
            body: >-
              Public evidence is enough to believe Octane is scaled and fundable, but not enough to size loss
              durability. The investment decision should turn on private delinquency, charge-off, concentration, and
              fair-lending evidence rather than originations alone.
            calloutType: recommendation
            claimRefs:
              - CR016
              - CR027
