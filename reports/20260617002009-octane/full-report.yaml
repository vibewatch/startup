      - number: '4.5'
        title: Capital Adequacy and Funding Structure
        blocks:
          - type: paragraph
            body: >-
              Octane's capital stack combines equity, warehouse credit lines, ABS debt, and off-balance-sheet
              forward-flow commitments. On the equity side, the December 2025 Series F raised $100 million at a $1.3
              billion post-money valuation, following the August 2024 Series E of $50 million. Total equity raised since
              founding is $342 million ($242 million pre-Series F). The ABS program has completed 16 transactions
              totaling $4.7 billion-plus since December 2019, providing medium-term secured funding. For
              off-balance-sheet capacity, Octane had $3.7 billion in whole-loan sales and forward-flow commitments since
              December 2023 as of the June 2026 Bayview transaction; this includes the AB CarVal $500 million
              forward-flow (September 2024), Moore Capital $300 million (August 2025), Nuveen $350 million forward-flow
              (May 2026) plus $150 million whole-loan sale, and Yieldstreet cumulative $480 million in whole-loan sales.
              The Nuveen deal disclosed total forward-flow commitments of over $2.2 billion as of May 2026. This
              diversification of capital sources is a meaningful strength; the 2026 Bayview whole-loan sale (June 16,
              2026) is the sixth whole-loan transaction and the first with Bayview, indicating ongoing expansion of the
              investor base. Warehouse credit line terms, borrowing capacity, and covenant details are not publicly
