      - number: '6.5'
        title: Expansion dynamics, concentration risk, and channel dependence
        blocks:
          - type: paragraph
            body: >-
              Octane's growth trajectory is supported by a multi-dimensional expansion pattern: new OEM partners, new
              vehicle verticals (RV, marine, OPE), new tools (Prequal Flex, SafeCheck, Preferred), and private-label
              deals (RideNow Finance). In 2024, Octane doubled RV originations for the second consecutive year and
              entered marine, adding two verticals that reduce powersports cyclicality concentration. The originations
              grew 36% in 2024 to $1.6 billion and reached $5 billion in aggregate by September 2024. These growth
              signals validate a land-and-expand motion: Octane starts with powersports dealer relationships, adds
              Prequal/Prequal Flex to the dealer's website, then deepens with SafeCheck, Preferred, and eventually
              RideNow-style private-label branding. However, the concentration risks are material. Powersports is a
              highly cyclical, discretionary consumer-credit category; 2022 was described as a period of pervasive
              inventory constraints. OEM concentration is not disclosed: if one or two large OEM partners (Polaris,
              Kawasaki) account for a disproportionate share of originations, their program changes could materially
              impact volumes. The dealer base of 4,000-plus is large, but Octane's 2022 press release notes that the
              number of dealers funding over ten loans per month grew 50%, implying that a relatively small subset of
              dealers may account for a large share of volume. No Herfindahl or top-dealer concentration data is public.
              Consumer-borrower geographic concentration is also undisclosed — powersports demand skews toward rural and
              suburban markets, which may concentrate credit risk in specific regions. The RideNow private-label deal,
              while a marquee win, creates a new form of concentration: a single dealership group embedded with Octane's
              infrastructure at 56 locations. Investors need private data on dealer-level origination concentration,
              OEM-program revenue share, and borrower-cohort geographic and credit-tier distribution before making
              concentration judgments.
