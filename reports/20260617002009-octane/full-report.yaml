      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Path
        blocks:
          - type: paragraph
            body: >
              The market has four distinct constituencies whose budgets and adoption triggers differ. Retail consumers
              are the

              ultimate payers, and they split sharply by credit tier: prime borrowers, where Octane competes on speed
              and a

              soft-pull experience, and near-prime and non-prime borrowers, where Octane's underwriting breadth is the
              core

              differentiator and where OEM partners such as Honda explicitly engaged Octane to reach non-prime
              customers.

              Dealers and merchants own the point-of-sale moment; their budget is effectively the cost of lost sales and
              F&I

              friction, and they adopt Octane to convert more shoppers and reduce the operational load of multi-lender

              routing. OEMs and dealership groups are the third buyer: they control brand-level financing strategy and
              adopt

              Octane (often through Captive-as-a-Service or bank partnerships such as the Huntington-anchored OPE
              program) to

              stand up branded or captive lending without building a balance sheet. Capital partners are the fourth,
              demand-

              side-adjacent constituency, since their appetite for forward-flow and securitized paper determines how
              much

              Octane can originate. The adoption path runs OEM or dealer enablement → soft-pull prequalification at the
              point

              of sale → application and underwriting through Roadrunner Financial → funding → loan sale, which is why

              distribution partnerships, not direct consumer marketing, are the primary growth lever.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
              - CM017
              - CM018
              - CM034
              - CM035
              - CM039
          - type: table
            tableRef: TM003
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
              - CM017
          - type: figure
            figureRef: FM003
            claimRefs:
