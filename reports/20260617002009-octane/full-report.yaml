      - number: '5.2'
        title: Soft-pull prequalification tools — Prequal, Prequal Flex, and SafeCheck
        blocks:
          - type: paragraph
            body: >-
              Octane's most differentiated product surface in dealer-consumer bridging is its suite of soft-pull credit
              tools. Octane Prequal is a free, dealer-integrated prequalification widget that can be embedded on
              dealership websites, used on the showroom floor, or applied in digital marketing campaigns. The workflow
              uses a soft credit pull so the consumer's score is not affected at prequalification; the output is a real
              Roadrunner Financial loan offer, not a generic estimate. Buyer data — including email, phone, and SSN —
              flows directly into the dealer's Octane portal or DMS, shortening the path to contract. As of 2024, over
              1,200 dealers were using each of Octane Prequal and Prequal Flex respectively, and nearly 400,000
              powersports applications were sent to partner dealers through the two tools in 2024. Prequal Flex,
              launched in May 2023, extends Prequal's reach by providing each enrolled dealer with a dedicated
              dealership-branded URL that can be distributed through email, social media, text, NFC cards, hang tags, or
              events. A pilot of Prequal Flex showed a 40% increase in total applications for participating dealers,
              with Onyx Moto dealer principal Kenny Chen describing the soft-pull flow as creating customer ease at the
              prequalification step. SafeCheck, the third tool, gives enrolled dealers access to a full Experian credit
              bureau report for a customer immediately after an application is submitted, at no additional cost.
              SafeCheck also provides OFAC compliance checks and Fraud Shield summaries, reducing dealer compliance
              burden at the point of sale. All three tools are free to Octane's enrolled dealer network and designed to
              funnel higher-quality, pre-credited leads into the dealer's workflow. The principal public-evidence
              limitation is that conversion-rate, credit-pull-to-contract, and dealer adoption-curve data are not
              disclosed beyond the broad counts cited in the 2024 annual press release.
            claimRefs:
