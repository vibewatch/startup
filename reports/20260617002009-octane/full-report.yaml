chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Business Model
        blocks:
          - type: paragraph
            body: >
              Octane presents itself consistently across its own surfaces as a digital fintech lending platform that
              aims to

              make buying recreational and powersports vehicles fast and transparent, pairing a proprietary technology
              stack

              with an in-house lender, Roadrunner Financial, Inc. The company was founded in 2014, is headquartered in
              New

              York, NY, and in October 2025 opened a second office in Dallas, TX. Its model is two-sided: on the front
              end it

              gives dealers and OEMs digital origination tools such as soft-pull prequalification (PreQual and PreQual
              Flex),

              a Dealer Portal, and a Captive-as-a-Service white-label offering; on the back end Roadrunner Financial

              originates the consumer loan, and Octane sells the overwhelming majority of what it originates into
              capital-

              markets channels. That makes Octane both a technology company and a balance-sheet-light specialty lender.
              The

              product footprint now spans powersports (its founding market), RV, marine, trailer, outdoor power
              equipment, and

              a 2025 move into captive auto financing, so the identity is best read as a multi-vertical
              recreational-credit

              platform rather than a single-product lender. The company reports more than 600 employees as of the Series
              F,

              which is a credible operating-scale signal even though Octane does not publish a precise public headcount
              series.
