  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis
        blocks:
          - type: paragraph
            body: >-
              Octane merits attention because the public record shows a real scaled lending platform rather than a
              speculative concept. The company disclosed a $100 million Series F at a $1.3 billion-plus post-money
              valuation in December 2025, followed by operating evidence that 2024 originations reached $1.6 billion,
              aggregate originations exceeded $5 billion, and institutional capital channels kept expanding through
              forward-flow and securitization programs. That combination matters for valuation because it suggests
              Octane is being priced as both a specialty lender and a repeat capital-markets execution engine. The
              positive side of the thesis is therefore tangible scale, evidence of funding diversification, and some
              indication that profitability has existed at least once at GAAP level. The anti-thesis is equally
              important: almost none of the metrics that would let an outside investor normalize that valuation are
              public. There is no disclosed 2026 revenue run rate, no public ARR or NRR disclosure, no transparent
              loss-curve data, and no cap-table detail around preferences. As a result, the chapter's recommendation has
              to reward scale proof while still applying a meaningful opacity discount.
            claimRefs:
              - CV001
              - CV005
              - CV008
              - CV010
              - CV011
              - CV015
              - CV016
              - CV017
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV008
              - CV013
              - CV014
              - CV016
              - CV017
              - CV018
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV008
              - CV013
              - CV016
              - CV021
      - number: '8.2'
        title: Recommendation Confidence
        blocks:
          - type: paragraph
            body: >-
              The right recommendation from public evidence alone is not an aggressive buy; it is a disciplined track
              posture with willingness to lean in only after private diligence closes the largest holes. Octane has
              enough proof points to justify serious work: its last financing was not a seed-stage promotional round,
              the business has processed multi-billion-dollar originations, and funding counterparties appear broad
              enough to matter. At the same time, the absence of public revenue, margin, credit, and cap-table
              disclosure makes it hard to argue that the latest price embeds a clear margin of safety. That tension
              leads to a medium-confidence call rather than a high-confidence one. Confidence is not low because the
              disclosed operating and capital-markets signals are too substantial to ignore; it is not high because
              critical underwriting variables remain unverifiable from outside the data room. Risk should therefore be
              considered high, not because failure is the base case, but because adverse outcomes could travel quickly
              through funding capacity, origination growth, and valuation if credit performance or discretionary demand
              weakens.
            claimRefs:
              - CV019
              - CV020
              - CV021
              - CV034
              - CV035
              - CV040
          - type: table
            tableRef: TV001
            claimRefs:
              - CV019
              - CV020
              - CV021
              - CV040
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV015
              - CV016
              - CV017
              - CV020
              - CV021
      - number: '8.3'
        title: Pricing Context
        blocks:
          - type: paragraph
            body: >-
              Pricing context begins with the fact that Octane's latest mark is a private round set in December 2025,
              not a continuously marked public price. The Series F gives a current anchor, but investors still need to
              decide whether that anchor remains valid into mid-2026. The best argument for taking the price seriously
              is that it followed real scale milestones: 2024 originations, more than $5 billion of aggregate
              originations, repeated ABS execution, and multiple forward-flow deals. Those data points imply the
              valuation did not rest only on thematic fintech enthusiasm. The challenge is entry discipline. Without
              public revenue, current earnings, or static-pool credit data, an investor cannot convert the $1.3 billion
              mark into a clean multiple framework or assess whether senior preferences and dilution overhang make
              common-equivalent value materially lower. That is why the chapter treats the round as a base-case
              reference point, not as proof of cheapness. In practical terms, the price can be called fair if management
              substantiates economics privately, but it trends stretched if the missing disclosures remain unresolved.
            claimRefs:
              - CV001
              - CV002
              - CV013
              - CV014
              - CV021
              - CV033
              - CV035
      - number: '8.4'
        title: Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              Scenario work is more informative here than false precision. The bear case assumes the combination of
              cyclical powersports demand, softer consumer credit, and tighter asset-backed funding causes investors to
              underwrite Octane as a niche lender with unstable throughput rather than as a premium fintech platform. In
              that world, the range compresses to roughly $600-900 million. The base case keeps valuation around
              $1.1-1.5 billion, roughly in line with the Series F, because originations keep growing, forward-flow and
              ABS channels remain open, and no public evidence of credit stress emerges. The bull case expands to
              $1.8-2.8 billion only if Octane can prove repeat profitability, open up revenue visibility, and show the
              platform has room to extend beyond today's powersports and RV concentration. The probability signal today
              favors base over bull because the current evidence set is much stronger on scale and capital access than
              it is on monetization quality. In other words, Octane has earned the right to be valued seriously, but it
              has not yet earned the right to trade on faith alone.
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV034
              - CV035
              - CV039
          - type: table
            tableRef: TV003
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV034
              - CV035
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV033
      - number: '8.5'
        title: Comparables
        blocks:
          - type: paragraph
            body: >-
              Comparable analysis is necessary but imperfect because no public company combines Octane's exact mix of
              specialty-vehicle finance, dealer workflow software, and structured-capital execution. LendingClub and
              Upstart are the most useful reference points for public-market discipline because both disclose revenue
              and operate in lending-adjacent models, but they differ materially in product mix, regulatory posture, and
              underwriting scope. Affirm and SoFi are much larger consumer-finance platforms whose market values mainly
              show the upside available to scaled, diversified fintechs rather than a realistic near-term peer mark for
              Octane. Sheffield Financial is strategically relevant because it competes in the same end-market, yet its
              private ownership removes public valuation transparency. The right lesson is therefore not that Octane
              should trade exactly at any one comp multiple. The lesson is that public investors reward revenue
              visibility, balance-sheet clarity, and product breadth — and discount opacity. Octane's latest private
              price remains plausible within that frame, but the absence of direct specialty powersports comps means
              investors should use comparables as guardrails, not as mechanical marks.
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
          - type: table
            tableRef: TV004
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
      - number: '8.6'
        title: Exit Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The exit question is less about whether Octane could ever reach an IPO and more about what must be true
              before that path deserves underwriting. A public listing story would require Octane to show more than
              origination growth. It would need credible audited disclosure on revenue, take rate, earnings quality,
              static-pool credit performance, and the portion of value attributable to software or workflow economics
              rather than balance-sheet spread capture. If those data do not arrive, a strategic exit looks more
              plausible than a near-term IPO. Possible buyers could include banks, dealer ecosystems, insurers, or
              consumer-finance platforms that value Octane's dealer distribution and underwriting infrastructure.
              Regardless of exit path, diligence should focus on the specific items that can break the thesis: hidden
              preference overhang, weaker-than-implied credit performance, capital-markets dependency, and a cyclical
              downturn in discretionary vehicles. Those are not abstract concerns. They are the variables most likely to
              determine whether the Series F was a fair mark for a compounding platform or a rich mark set near a cycle
              peak.
            claimRefs:
              - CV033
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
          - type: table
            tableRef: TV005
            claimRefs:
              - CV018
              - CV034
              - CV039
          - type: table
            tableRef: TV006
            claimRefs:
              - CV016
              - CV017
              - CV033
              - CV038
              - CV040
      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: The real valuation asset is funding throughput, not just software story
            body: >-
              Octane has enough ABS and forward-flow evidence to be underwritten as a repeat capital-markets platform,
              which is why the last round deserves more credit than a generic niche lender would receive.
            calloutType: insight
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV012
          - type: callout
            title: Opacity is the largest self-inflicted discount
            body: >-
              The biggest reason not to pay through the Series F mark is not lack of growth evidence; it is the lack of
              public revenue, earnings, and credit-performance disclosure needed to test the quality of that growth.
            calloutType: risk
            claimRefs:
              - CV016
              - CV017
              - CV033
              - CV040
          - type: callout
            title: Price discipline should improve before conviction does
            body: >-
              A better entry price or a better diligence package would each justify more aggressive positioning; today
              investors have neither, so the correct posture is track rather than chase.
            calloutType: recommendation
            claimRefs:
              - CV019
              - CV021
              - CV038
