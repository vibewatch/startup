      - number: '3.6'
        title: Adverse Evidence and Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              Several signals limit confidence in Octane's moat durability. First, OEM partner agreements are
              non-exclusive, meaning brands like Kawasaki and CFMOTO could expand relationships with other lenders;
              Kawasaki's pre-2024 financing operations show that captive alternatives existed before Octane's
              full-spectrum partnership. Second, OEM captive programs (HDFS, Yamaha, BRP) can offer
              manufacturer-subsidized promotional rates that Octane's independent lender model structurally cannot
              replicate; dealers relying heavily on promotional financing have reason to multi-home. Third, Sheffield
              Financial's 30-plus years of dealer relationships and Truist Bank's large balance sheet represent an
              incumbency advantage difficult to dislodge purely on software quality. Fourth, Synchrony already serves
              adjacent dealer segments (outdoor power equipment, marine) and could deepen non-prime capabilities if
              strategically motivated. Fifth, a federal lawsuit (Gooding v. Octane Lending and Roadrunner Financial) is
              publicly docketed, representing an adverse legal signal not fully explained by public sources. Sixth, the
              company has not publicly disclosed charge-off rates or delinquency data, meaning credit quality as an
              adverse signal cannot be fully evaluated from public sources. Private diligence must cover OEM agreement
              exclusivity, dealer churn rates, credit performance, and competitive response from incumbents.
            claimRefs:
              - CP026
              - CP027
              - CP030
              - CP033
              - CP037
              - CP041
              - CP042
      - number: '3.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Octane's multi-layer stack separates it from every peer category
            body: >-
              Sheffield and Synchrony are lenders without deep OEM programs. OEM captives are lenders without
              multi-brand software. Credit unions are lenders without dealer workflow. Octane is the only platform that
              currently combines all three. That multi-layer positioning makes it difficult for any single-category
              competitor to displace the full offering.
            calloutType: strength
            claimRefs:
              - CP001
              - CP036
          - type: callout
            title: Non-exclusive OEM agreements and manufacturer-subsidized rates are the clearest structural vulnerabilities
            body: >-
              Every OEM agreement Octane has published is non-exclusive. Manufacturers can subsidize promotional rates
              that Octane's independent model cannot match. Both risks are real and not eliminable through product
              investment alone; they require private diligence on OEM agreement renewal terms and promotional volume
              concentration.
            calloutType: risk
            claimRefs:
              - CP024
              - CP041
          - type: callout
            title: Sheffield and Synchrony represent incumbent resistance, not imminent displacement
            body: >-
              Neither Sheffield nor Synchrony has announced a material product response to Octane's OEM program or
              private-label strategy. Their incumbency threat is primarily through existing dealer relationships and
              balance-sheet durability, not product innovation. This is a stable but not permanent advantage for Octane.
            calloutType: insight
            claimRefs:
