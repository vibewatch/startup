      lender servicing and capital-markets funding.
    data:
      layers:
        - label: Consumer acquisition and intent layer
          description: Octane Media 7 publications; editorial content; Prequal/Prequal Flex embeds
          detail: Generates pre-credited, high-intent leads and routes them into dealer workflow
        - label: Dealer workflow and portal layer
          description: Dealer Portal 2.0; Leads Page; Work-the-Deal; SafeCheck; Octane Preferred
          detail: Centralises lead management, deal structuring, and loyalty incentives for 4,000+ dealers
        - label: Credit decision and prequalification layer
          description: Soft-pull Experian FICO scoring; FairPlay algorithmic fairness testing; real loan offer
          detail: Instant credit decisions without bureau impact; ECOA-compliant underwriting model
        - label: Origination and servicing layer
          description: Roadrunner Financial (NMLS 1525116) lending; Roadrunner Account Services (NMLS 1758660) servicing
          detail: In-house lender and servicer; same-day funding; no-prepayment-penalty; FCRA disclosures
        - label: Capital markets funding layer
          description: ABS programme; ~$1B revolving warehouse; forward-flow deals; whole-loan sales
          detail: AAA-rated ABS; $4B+ cumulative ABS; diversified investor base across 100+ institutions
    approximationNotes: >-
      Architecture is inferred from product pages, press releases, and ABS transaction documents. Internal API, cloud
      infrastructure provider, and data-layer internals are not publicly disclosed.
