      - number: '1.4'
        title: Milestones, Traction, and Adverse Signals
        blocks:
          - type: paragraph
            body: >
              The milestone arc is substantive and well dated. From a 2014 founding in powersports, Octane added RV in
              2021,

              marine and trailer in 2022, outdoor power equipment across 2022-2023, and auto/captive in 2025, while
              building a

              recurring cadence of OEM and dealer partnerships (Kawasaki, Honda, Suzuki, CFMOTO, Husqvarna, Bad Boy,

              Ariens/Gravely, RideNow, Adventure Lifestyle, and Camping World/Good Sam). On traction, Octane reports
              about

              $2.1B of 2025 originations, up 29% year over year, roughly $7.6B of aggregate originations through March
              2026,

              about $1.9B of loans sold in 2025 (around 91% of originations), approximately $400M of total revenue, $80M
              of

              adjusted EBITDA up 23%, and GAAP net income in each of the last three years. Recognition is broad, with
              fifteen

              awards in 2025 including a FICO Decisions Award and repeated Deloitte Technology Fast 500 and Built In
              Best

              Places to Work honors. Against that, the adverse file is real but bounded: Roadrunner Financial draws BBB
              and

              Trustpilot complaints about customer service and payment-processing delays, there is one PACER case
              (Gooding v.

              Octane Lending/Roadrunner Financial), no CFPB enforcement action was found in the reviewed record, and the

              company's credit-loss and detailed unit economics remain undisclosed. The honest read is strong,
              profitable

              growth with servicing and disclosure caveats that diligence must size.
