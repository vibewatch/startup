      - number: '5.3'
        title: Octane Preferred loyalty architecture and dealer incentive layer
        blocks:
          - type: paragraph
            body: >-
              Octane Preferred is a tiered B2B loyalty programme that Octane launched in March 2023 to formalise the
              incentive structure for its most active dealer partners. The programme operates on a monthly funding cycle
              tied exclusively to loans funded through Roadrunner Financial. Two tiers exist publicly: All-Star (five or
              more originations per month) and MVP (ten or more originations per month). Benefits are reset and
              refreshed at the start of each month based on the prior month's activity, creating a short-cycle
              engagement loop. Disclosed programme benefits include VIP stipping experiences, priority chat functions
              for deal support, exclusive access to new products, and personalised dealer statistics. The programme is
              free to join and available to any US powersports dealer enrolled on the Octane platform and approved by
              Roadrunner Financial. The practical significance for product architecture is that Octane Preferred creates
              a pull-through incentive for dealers to use Roadrunner Financial as their primary lender rather than
              routing deals to competing lenders. By tying benefits to Roadrunner-funded volume, Octane aligns dealer
              economics directly with captive lender share. The press release announcing the programme cited over 4,000
              dealer partners and described the programme as a first-of-its-kind B2B loyalty system for the powersports
              lending market. Public gaps include the percentage of active dealers who have reached All-Star or MVP
              tier, average benefit redemption rates, and whether the programme has meaningfully shifted Roadrunner's
              share of wallet within the enrolled network.
