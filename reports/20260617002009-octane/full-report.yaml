              prime-financing expansion. Honda has a dedicated Octane landing page listing UTV and ATV financing
              options. The company claims 30-plus OEM partners in total, with the five named deals representing only a
              subset of that roster. The OEM partnership model creates a structural distribution advantage: OEMs direct
              dealer network participation, embed Octane prequalification in their consumer-facing websites, and jointly
              market financing promotions. This makes OEM relationships a distribution lever, not simply a co-branding
              arrangement. Public gaps include the total list of 30-plus OEM partners, revenue or volume attributable to
