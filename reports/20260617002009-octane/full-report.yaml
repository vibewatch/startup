      - number: '5.4'
        title: Octane Media flywheel and advertising monetisation
        blocks:
          - type: paragraph
            body: >-
              Octane Media is a portfolio of seven powersports and motorsports editorial brands acquired from Bonnier
              Corp in 2020: Cycle World, UTV Driver, Dirt Rider, ATV Rider, Motorcyclist, Cruiser, and Cycle Volta. The
              media properties serve a dual function in Octane's operating model. As a consumer-acquisition funnel, they
              embed Octane Prequal prequalification widgets directly alongside editorial content, routing high-intent
              buyers into the Roadrunner Financial financing pipeline before they ever visit a dealership. As an
              advertising business, Octane launched paid advertising for OEMs, large dealer chains, and insurers in May
              2023 — the first time the properties had been monetised by external advertisers since the Bonnier
              acquisition. Public audience data cited at launch: among Octane Media readers under 35, 70 percent own at
              least one motorcycle, 69 percent live in a household with three motorcycles, and 43 percent plan to
              purchase a motorcycle within two years. Average session duration on review, comparison, and test pages is
              over 16 minutes. Email newsletter open and click-through rates reportedly exceed industry benchmarks by 80
              and 265 percent respectively. In Dealer Portal 2.0, the Leads Page explicitly aggregates pre-qualified
              buyers sourced from Octane Media properties alongside Prequal and OEM partner channels, making the media
              assets a direct input to the dealer workflow layer. This integration of content, prequalification, and
              dealer workflow in a single stack is the most distinguishing architectural feature of Octane's product
              model relative to pure-play lenders or pure-play software vendors. Public evidence gaps include
              media-property traffic volumes, advertising revenue as a share of total revenue, and advertiser renewal or
              CPM benchmarks.
            claimRefs:
              - CE019
              - CE020
              - CE021
              - CE022
              - CE023
      - number: '5.5'
        title: Roadrunner Financial servicing, compliance architecture, and trust posture
        blocks:
          - type: paragraph
            body: >-
              Roadrunner Financial, Inc. (NMLS ID 1525116) is Octane's in-house lender and the originating entity for
              all Dealer Portal transactions. Roadrunner Account Services (NMLS ID 1758660) is a wholly-owned subsidiary
              that serves as the in-house loan servicer. The NMLS registration of both entities confirms federal
              consumer-finance licensing and establishes the regulatory envelope within which Octane's credit products
              operate. Loans are underwritten using Experian FICO scores, and the consumer-facing disclosures on
              roadrunnerfinancial.com reflect FCRA-compliant soft-pull and hard-pull sequencing: soft pull at
              prequalification (no credit impact), hard pull prior to contract generation. The servicing FAQ documents
              key borrower-rights provisions including no prepayment penalty for early payoff, a formal hardship
              extension application process, SCRA protections for military borrowers, and a total-loss insurance claim
              procedure. These disclosures signal that the servicing layer is operationally mature and built to
              consumer-credit regulatory standards, not a lightly integrated bank partner. Octane publicly acknowledged
              a relationship with FairPlay, described as the world's first Fairness-as-a-Service solution, to conduct
              algorithmic fairness testing of its credit model for compliance with fair lending laws including ECOA.
              This is a meaningful technical signal: it confirms Octane uses an external, quantitative validation layer
              on its proprietary underwriting model to test for bias across protected-class dimensions. On the
              capital-markets side, Octane's ABS programme provides indirect validation of loan-pool quality — the OCTL
              2023-2 transaction received AAA/AAA senior ratings from S&P and KBRA after upsizing from $300 million to
              $400 million on strong investor demand. Four ABS transactions were completed in 2024, totalling over $4
              billion in cumulative ABS issuance. The main trust and security gap in the public record is the absence of
              SOC 2 Type II, ISO 27001, or comparable certifications in disclosed materials, and there is no status page
              or published uptime SLA for the Dealer Portal or consumer application infrastructure.
