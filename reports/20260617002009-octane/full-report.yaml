      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and Sizing Gaps
        blocks:
          - type: paragraph
            body: >
              Several structural drivers favor Octane. Powersports, RV, marine, and OPE retail is heavily
              dealer-intermediated

              and historically underserved by digital POS credit, so a soft-pull, multi-vertical platform addresses a
              genuine

              workflow gap. OEM and bank partners (Kawasaki, Honda, Suzuki, CFMOTO, Husqvarna, Bad Boy, Ariens/Gravely,

              Huntington Bank) increasingly prefer to plug into a financing platform rather than build one, which
              compounds

              distribution. New categories — electric two-wheelers via Ubco, captive auto via Captive-as-a-Service —
              extend

              the runway. Against these, the constraints are real. The business is capital-intensive at the loan level
              and

              depends on continued forward-flow and securitization appetite, so a credit-market contraction directly
              throttles

              originations. Recreational purchases are discretionary and rate-sensitive, making volume cyclical.
              Incumbent

              captive finance arms and banks have entrenched dealer relationships and balance sheets, raising switching
              costs

              on the OEM side. Finally, consumer-lending regulation and servicing scrutiny (the same servicing
              complaints that

              surface against Roadrunner Financial) are an adoption and reputational constraint. The largest analytical
              gap is

              sizing itself: the reviewed sources do not contain an independent TAM/SAM estimate or reconciled
              third-party

              market data, so any precise market figure would be speculative and is preserved here as a diligence gap.
            claimRefs:
              - CM019
              - CM020
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
              - CM036
              - CM037
              - CM038
          - type: table
            tableRef: TM004
            claimRefs:
              - CM019
              - CM020
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The real competitor is the status quo, not another fintech
            body: >
              In every vertical Octane enters, the default is manufacturer captive finance, a bank or credit-union
              direct

              loan, a general-purpose card such as Synchrony's powersports product, or cash. Octane's wedge is a
              digital,

              soft-pull dealer workflow that spans prime and non-prime — which is why OEMs and banks partner with it
              rather

              than replicate it.
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM031
          - type: callout
            title: Distribution breadth is the clearest quantitative signal of reachable market
            body: >
              With 50 OEM relationships and 4,000+ active dealers across six verticals, Octane's channel reach is the
              most

              concrete proxy for serviceable market, even absent an independent SAM dollar figure. Each OEM and bank

              partnership widens the pool of dealer-attached purchases it can finance.
            calloutType: strength
            claimRefs:
              - CM009
              - CM010
              - CM019
          - type: callout
            title: Market access is gated by capital-market appetite
            body: >
              Because Octane sells most of what it originates, the size of the market it can actually serve is bounded
              as much

              by forward-flow and securitization demand as by consumer demand. A credit-market contraction would
              compress

              originations regardless of dealer or consumer appetite.
            calloutType: risk
            claimRefs:
              - CM021
              - CM022
              - CM038
          - type: callout
            title: No independent TAM/SAM figure is available
            body: >
              The reviewed sources do not contain a reconciled third-party estimate of the recreational-vehicle POS
              financing

              market. Sizing therefore rests on Octane's served volume plus directional channel-breadth lenses, and any

              precise TAM number should be treated as unverified until independent market data is obtained.
            calloutType: risk
            claimRefs:
              - CM011
              - CM036
              - CM037
          - type: callout
            title: Served volume is the anchor; broader market is directional
            body: >
              This chapter treats Octane's ~$2.1B of 2025 originations as the firm SOM anchor and treats SAM and TAM as

              directional, channel-implied ranges. Readers should not interpret the sizing-lens figure as an
              independently

              audited market estimate.
            calloutType: assumption
            claimRefs:
              - CM008
              - CM032
              - CM036
          - type: callout
            title: Non-prime breadth is the demand-side differentiator
            body: >
              OEMs such as Honda engaged Octane specifically to reach non-prime customers, while CFMOTO and Suzuki
              tie-ups

              target prime expansion. Spanning the full credit spectrum in one dealer workflow is the feature that pulls
              both

              consumer demand and OEM partnerships toward the platform.
            calloutType: insight
            claimRefs:
              - CM014
              - CM015
              - CM017
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape
        blocks:
          - type: paragraph
            body: >-
              Octane's competitive set is best understood as a fragmented landscape of partial substitutes rather than a
              single category rival. The approximately $30 billion U.S. annual powersports market is served by
              specialist bank-backed lenders such as Sheffield Financial (a Truist Bank division with 30-plus years in
              the category), large bank credit programs such as Synchrony Financial's powersports and
              outdoor-power-equipment offerings, OEM captive finance arms including Harley-Davidson Financial Services
              and Yamaha Motor Finance, regional credit unions offering recreational-vehicle loans, and digital-only
              banks like LightStream that offer unsecured personal loans for powersports purchases. None of these
              alternatives combines full-spectrum credit coverage, dealer workflow software, multi-OEM program
              management, and an ABS capital-markets program in a single platform the way Octane does. Octane's public
              footprint covers more than 4,000 dealer partners and over 60 OEM brands, a scale that no single competitor
              appears to match. Most OEM agreements are non-exclusive, meaning dealers and brands can simultaneously use
              Octane alongside captive programs, making the market not winner-take-all and multi-homing a persistent
              risk.
