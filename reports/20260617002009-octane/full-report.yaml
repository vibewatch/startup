      buyers, and the regulatory perimeter.
    data:
      nodes:
        - label: Dealers / OEMs
          detail: Borrower acquisition and distribution entry point
        - label: Octane platform
          detail: Digital origination, Prequal, and workflow layer
        - label: Roadrunner lender / servicer
