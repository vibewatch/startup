      - number: '1.3'
        title: Funding, Investors, and Capital Base
        blocks:
          - type: paragraph
            body: >
              Octane's capital base has two distinct layers that should not be conflated: equity funding for the
              operating

              company, and the much larger pool of debt and loan-sale capacity that funds the loans themselves. On the
              equity

              side, Octane closed a $100M Series F on December 15, 2025 at a $1.3B post-money valuation led by Valar
              Ventures,

              lifting cumulative equity raised to roughly $342M from a prior $242M base; this followed a $50M Series E
              in 2024.

              Series F participants included Upper90, Huntington Bank, Camping World/Good Sam, and Holler-Classic,
              several of

              which are also commercial partners — a strategic-investor pattern that tightens distribution but
              complicates a

              clean arms-length cap-table read. On the funding side, Octane has run an asset-backed securitization
              program

              since 2019, issuing more than $4.7B across sixteen transactions, and layers forward-flow and whole-loan

              agreements with institutions such as Nuveen, Bayview, Moore Capital, AB CarVal, YieldStreet, and Georgia's
              Own

              Credit Union, citing more than $3.3B of commitments since December 2023. The strategic-investor overlap
              and the

              breadth of named capital partners are genuine strengths, but exact ownership percentages, preference
              terms, and

              board seats are not public, leaving real questions about control and economic alignment that diligence
              must

              close.
