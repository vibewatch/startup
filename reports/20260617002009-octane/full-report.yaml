  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition, Boundaries, and Substitutes
        blocks:
          - type: paragraph
            body: >
              The market Octane serves is U.S. retail point-of-sale (POS) installment financing attached to the purchase
              of

              recreational and powersports vehicles. Inside the boundary sits consumer credit for powersports
              (motorcycles,

              ATVs, side-by-sides, personal watercraft), RVs, marine, trailers, and outdoor power equipment, plus the
              2025

              move into captive auto financing for dealership groups. Outside the boundary are dealer
              floorplan/inventory

              financing, F&I insurance and extended-warranty products, leasing, and mainstream prime auto lending, which

              Octane does not principally target. The adjacencies that matter are powersports insurance, protection
              products,

              and dealer software, because they share the same dealer relationship and could become attach revenue. The
              most

              important strategic fact is that Octane's real competition is the status quo: manufacturer captive finance
              arms

              (for example Honda Financial Services and Yamaha Motor Finance), banks and credit unions making direct
              loans,

              general-purpose financing such as Synchrony's powersports credit card and personal lenders like
              LightStream, and

              simply paying cash. Octane's wedge is a digital, soft-pull-first dealer experience that widens approvals
              across

              prime and non-prime borrowers without forcing the dealer to juggle multiple lender portals, which is why
              OEM and

              bank partners increasingly route volume through it rather than building the same workflow themselves.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM030
              - CM031
