            body: >-
              The OEM segment is Octane's most visible and verifiable customer cohort. Five named partnerships with
              major OEMs have been announced via press releases, each describing a production deployment across the
              OEM's full US dealer network. Polaris (December 2021, effective January 2022) covers Sportsman, RANGER,
              RZR, GENERAL, Indian Motorcycle, Slingshot, and snowmobiles across a large global dealer network. BRP
              expanded its Sea-Doo partnership in November 2021 to include the Sea-Doo Switch pontoon, extending an
