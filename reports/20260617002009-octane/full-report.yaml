      - number: '2.2'
        title: Market Sizing Through Evidence-Constrained Lenses
        blocks:
          - type: paragraph
            body: >
              Because no independent TAM or SAM estimate for recreational-vehicle POS financing appears in the reviewed

              sources, this section sizes the opportunity through layered, evidence-constrained lenses rather than a
              single

              headline number. The cleanest quantitative anchor is the served market (SOM): Octane originated roughly
              $2.1B in

              2025 and cites about $7.6B of aggregate originations through March 2026, so its current annual served
              volume is

              measured in the low single-digit billions. The serviceable available market (SAM) is best proxied by reach

              rather than dollars — 50 OEM relationships and 4,000+ active dealers across six verticals — which implies
              a much

              larger pool of dealer-attached purchases that Octane could finance as penetration deepens. The total
              addressable

              market (TAM) is the full set of U.S. recreational, powersports, and eligible captive-auto purchases that
              are

              bought on credit; the OEM breadth (Kawasaki, Honda, Suzuki, CFMOTO, Husqvarna, Bad Boy, Ariens/Gravely)
              and the

              multiple bank and captive incumbents imply a market in the tens of billions of dollars annually, but the

              reviewed record does not pin a precise figure, so TAM is carried as a directional gap. The honest read is
              that

              Octane's served volume is well evidenced while the market it could ultimately reach is real but only
              loosely

              bounded by public data.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM032
              - CM033
