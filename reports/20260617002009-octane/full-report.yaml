      - number: '4.6'
        title: Financial Verdict and Adverse Evidence
        blocks:
          - type: paragraph
            body: >-
              The financial picture is directionally positive but materially opaque. The thesis is that Octane has built
              a diversified, institutional-grade capital base around a growing origination engine with improving unit
              economics, as implied by 41 percent gross margin, 46 percent revenue growth, and the Upper90 investor
              quote about rapid and profitable growth. The adverse case rests on several unverifiable assumptions.
              First, charge-off and delinquency rates are never disclosed publicly; ABS performance data is behind
              institutional investor walls; and KBRA and S&P rating reports require credentialed access. A stressed
              credit cycle could compress NIM and force gain-on-sale at lower premiums. Second, the gain-on-sale revenue
              model is inherently episodic and depends on continued institutional appetite for powersports paper; a
              credit-market dislocation could disrupt the forward-flow pipeline. Third, the S&P Global website returned
              limited results for Octane ABS surveillance and the GlobalCapital article confirming the ABS Deal of the
              Year award was access-blocked during research, creating specific evidence gaps around third-party credit
              assessments. Fourth, the consumer complaint channel (CFPB) did not yield directly attributable high-volume
              adverse data, but Roadrunner Financial and Octane Lending may receive complaints classified under
              different category codes. Fifth, the Gooding v. Octane Lending federal lawsuit (noted in the competitors
              chapter) represents a legal adverse signal with unknown financial exposure. Six, the company is private
              with no reporting obligation, meaning the 46 percent revenue growth and 41 percent gross margin figures
              cannot be independently corroborated without auditor access. Private diligence must address all these
              dimensions before the financial thesis can be underwritten.
            claimRefs:
              - CI026
              - CI027
              - CI028
              - CI029
              - CI030
      - number: '4.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Diversified institutional capital base is a key financial differentiator
            body: >-
              By 2026 Octane has assembled a capital stack spanning 16 ABS transactions, five forward-flow agreements,
              and six whole-loan sales across blue-chip institutional investors including Nuveen (TIAA), Moore Capital,
              AB CarVal, and Bayview. This diversification reduces single-counterparty concentration risk and signals
              institutional validation of Octane's credit performance.
            calloutType: strength
            claimRefs:
              - CI022
              - CI023
          - type: callout
            title: Charge-off opacity is the single largest unresolved financial diligence gap
            body: >-
              All of Octane's published financial metrics (46% revenue growth, 41% gross margin) are unaudited and
              company-asserted. The absence of public charge-off and delinquency data for a full-spectrum lender in a
              cyclical asset class is the most important gap. Investors cannot underwrite the financial thesis without
              accessing Roadrunner Financial servicer reports and KBRA/S&P ABS surveillance data.
            calloutType: risk
            claimRefs:
              - CI026
              - CI027
          - type: callout
            title: The $3.7B sold/committed figure understates total capital activity when ABS is included
            body: >-
              The $3.7B in whole-loan sales and forward-flow commitments since December 2023 does not include the $4.7B+
              in ABS issuance since 2019. Together these represent over $8B in total capital-markets activity, which is
              strong evidence of institutional acceptance of Octane's asset class even in the absence of audited
              financials.
            calloutType: insight
            claimRefs:
              - CI018
              - CI022
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Dealer workflow platform and Dealer Portal 2.0
        blocks:
          - type: paragraph
            body: >-
              Octane's core dealer-facing product is the Octane Dealer Platform, centered on Dealer Portal 2.0, which
              launched in April 2024 across the company's 4,000-plus powersports and OPE dealer partners. The upgrade
              introduced three major workflow changes. The Leads Page, described as a first-of-its-kind feature,
              centralises all customer applications so dealers can search, filter, and monitor leads in one view,
              convert leads to applications directly, and view pre-qualified buyer information sourced from Octane
              Prequal, Prequal Flex, OEM partner channels, and Octane Media editorial properties. The reimagined
              Work-the-Deal page makes deal structuring more dynamic: once a credit application is approved, dealers can
              filter loan terms, APRs, and monthly payment options in real time, reducing manual guesswork and per-deal
              time. According to a dealer testimonial included in the launch announcement, All Out Cycles Finance
              Manager Tammy Coleman reported saving fifteen to twenty minutes per deal. The third change is a shorter
              and smarter credit application that uses dynamic field logic to hide unnecessary inputs and accelerate the
              borrower experience. Dealer Portal 2.0 is also available to Octane's RV dealer partners, extending the
              platform beyond powersports. The dealer signup workflow is clearly documented on the company's enrollment
              pages, and Roadrunner Financial is the contractual lender underneath every deal. The strongest public
              evidence for this module is the April 2024 press release and the Dealer Portal product pages; the gap is
              the absence of third-party uptime, feature adoption, or dealer satisfaction data.
