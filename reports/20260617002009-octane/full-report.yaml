      - number: '6.4'
        title: Consumer experience, retention signals, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Consumer experience is the least well-documented and most adversely evidenced customer segment in the
              public record. Roadrunner Financial's servicing disclosures confirm operationally mature borrower-rights
              policies — no prepayment penalty, hardship extensions, SCRA military protections, and a phone-accessible
              payment system — which suggest the servicing layer meets baseline consumer finance standards. However,
              Trustpilot reviews of roadrunnerfinancial.com include substantiated adverse signals: one reviewer
              described the payment website as the worst website they had ever encountered, citing an inability to make
              online payments from a mobile device and the need to pay over-the-phone surcharges. Another reviewer
              reported a credit-reporting disruption after a servicer transfer in early 2019, which affected their
              credit profile during a mortgage application. The company's Trustpilot responses acknowledge specific
              service failures, confirming that the complaints are not fabricated. BBB Business Profiles for Roadrunner
              Financial are also in the public record but the reviewed page did not disclose a specific rating or
              complaint count. The CFPB consumer complaint database is publicly accessible and covers auto loan
              servicers including niche lenders; complaint volume or regulatory action specific to Roadrunner Financial
              was not found in the reviewed materials, which does not confirm a clean regulatory record — only that no
              specific enforcement action or published settlement was visible. The Trustpilot and BBB evidence is
              primarily from 2019 and may reflect early-stage servicing infrastructure; Roadrunner's public disclosures
              by 2026 describe a more developed borrower-support stack. The core adverse gap is that no systematic
              consumer satisfaction survey, NPS, or independent review aggregate with sufficient response count was
              available in public sources to assess the consumer segment at scale.
