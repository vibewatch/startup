- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Type
  - Market Cap / Status
  - Revenue Multiple or Metric
  - Relevance to Octane
  - Key Limitation
  rows:
  - - LendingClub
    - Public marketplace bank / lender
    - $2.19B market cap (Jun 2026)
    - Public revenue and bank-model disclosures; 2024 filing available
    - Useful for public-market discipline on disclosed lender economics
    - Deposit-funded bank model and regulatory profile differ materially
  - - Upstart
    - Public AI-enabled consumer lender
    - $3.08B market cap (Jun 2026)
    - Public revenue and 2024 filing available; highly sentiment-sensitive multiple
    - Useful to frame how quickly fintech-lender multiples can move with credit views
    - Product mix is consumer unsecured and model visibility is much higher
  - - Affirm
    - Public installment / BNPL platform
    - $25.01B market cap (Jun 2026)
    - Much larger platform with disclosed revenue scale
    - Shows upside available to scaled fintech distribution with capital-markets relevance
    - Scale and category breadth make it an outer-bound reference only
  - - SoFi
    - Public diversified fintech bank
    - $22.71B market cap (Jun 2026)
    - Diversified lending, banking, and cross-sell model
    - Shows what product breadth and disclosure can earn in public markets
    - Far broader business mix than Octane
  - - Sheffield Financial
    - Private powersports / outdoor finance competitor
    - Private; no transparent public valuation
    - Category relevance only
    - Useful as a niche end-market check on competitive set selection
    - Private ownership prevents clean market multiple comparison
  notes: 'Comparable set is exhaustive within the decision-useful public and niche references used in this chapter: the four large public fintech lender platforms with current market values plus the closest disclosed specialty-vehicle competitor reference.'
