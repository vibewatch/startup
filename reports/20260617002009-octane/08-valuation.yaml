- id: TV005
  title: Thesis-break and kill triggers
  columns:
  - Trigger
  - Threshold
  - Transmission to Thesis
  - Action Implication
  rows:
  - - Credit performance miss
    - 2026 delinquency or charge-off data proves materially worse than management plan
    - Undermines both equity value and confidence in ABS / forward-flow execution
    - Move from track to avoid unless repriced materially lower
  - - Funding-market blockage
    - Warehouse, ABS, or forward-flow capacity stalls for multiple quarters
    - Reduces origination throughput and compresses valuation toward bear case
    - Suspend underwriting until financing durability is restored
  - - Category slowdown
    - Dealer demand or discretionary vehicle sales contract sharply through a cycle
    - Weakens growth narrative and tests whether Octane deserves any premium to lender comps
    - Assume bear-case value until demand resilience is proven
  notes: Triggers are investor-defined monitoring points tied to the main ways Octane valuation can fail, not management guidance.
  claimRefs:
  - CV018
  - CV034
  - CV039
- id: TV006
  title: Final diligence asks
  columns:
  - Topic
  - Missing Evidence
  - Why It Matters
  - Owner or Diligence Path
  rows:
  - - 2026 revenue and earnings quality
    - Audited revenue, gross margin, take rate, and current profitability bridge
    - Without these, the latest valuation cannot be anchored to a transparent earnings or revenue framework
    - Request CFO package and audited management accounts
  - - Credit performance disclosure
    - Static-pool loss curves, delinquency, recovery, and vintage performance by major category
    - This is the main missing input for underwriting downside in a lender-like business
    - Request credit memo, ABS diligence materials, and servicing dashboards
  - - Cap table and preference stack
    - Liquidation preferences, ratchets, warrants, side letters, and option pool detail
    - Common-equivalent value could differ materially from headline post-money valuation
    - Review legal data room and board-approved financing documents
  - - Segment economics and platform mix
    - Revenue split between lending spread, fees, and any software-like workflow monetization
    - Needed to judge whether Octane deserves only lender guardrails or some platform premium
    - Request management reporting and customer cohort economics
  notes: These asks are the minimum package required to move from an evidence-limited track call toward a true underwriting decision.
  claimRefs:
  - CV016
  - CV017
  - CV033
  - CV038
  - CV040
