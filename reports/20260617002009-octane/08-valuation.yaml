    - Track; advance only after private diligence on revenue quality, losses, and cap-table preferences
    - Medium
    - Do not underwrite upside above the Series F mark from public evidence alone
  - - Risk Rating
    - High because funding-market, credit, and discretionary-demand shocks would transmit quickly to valuation
    - Medium
    - Size any position as an evidence-constrained special situation, not a plain growth-fintech bet
  - - Valuation Stance
    - Fair to slightly stretched at $1.3B+ post-money because the mark fits the base case but lacks a public-evidence discount
