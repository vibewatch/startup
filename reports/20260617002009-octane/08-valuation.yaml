- id: TV002
  title: Investment thesis and anti-thesis
  columns:
  - Argument
  - Evidence Basis
  - Strength
  - What Would Change the View
  rows:
  - - 'Thesis: scale plus funding engine'
    - 2024 originations reached $1.6B, aggregate originations exceeded $5B, and Octane kept adding ABS and forward-flow capacity
    - Strong
    - Evidence of sustained credit underperformance or funding pullback would weaken the scale thesis quickly
  - - 'Thesis: strategic distribution and investor validation'
    - Valar led the Series F while Upper90, Huntington, Camping World, and Good Sam participated around real dealer and category relationships
    - Medium-strong
    - If partner participation is mostly signaling rather than durable origination leverage, strategic value should be discounted
  - - 'Anti-thesis: economic opacity'
    - No public 2026 revenue, ARR, NRR, charge-off, delinquency, or preference-stack disclosure is available
    - Strong
    - Audited revenue, cohort profitability, and loss-curve data could move this from major concern to manageable risk
  - - 'Anti-thesis: cyclical category and capital-markets dependence'
    - Powersports and RV demand are discretionary, and Octane still depends on ABS/forward-flow markets to recycle capital efficiently
    - Medium-strong
    - Proof that performance remains resilient through a softer cycle would reduce the required risk premium
  notes: The table separates business-quality arguments from price and disclosure objections; it is not a management-supplied framework.
