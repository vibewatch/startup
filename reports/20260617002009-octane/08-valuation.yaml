- id: TV003
  title: Bull / base / bear scenario
  columns:
  - Scenario
  - Key Assumptions
  - Valuation Estimate
  - Return Logic
  - Key Risk
  - Probability Signal
  rows:
  - - Bear
    - Consumer demand softens, funding spreads widen, and investors underwrite Octane mainly as a cyclical specialty lender without premium software economics
    - $600-900M
    - Downside from the last mark is driven by multiple compression and lower throughput confidence
    - Credit and funding stress reinforce each other
    - Plausible if 2026 credit or ABS conditions deteriorate
  - - Base
    - Origination growth stays positive, ABS and forward-flow channels remain open, and no visible credit shock emerges
    - $1.1-1.5B
    - Series F remains roughly fair because scale proof offsets the lack of public financial detail
    - Opacity continues to cap upside
    - Most consistent with current public evidence
  - - Bull
    - Repeat profitability is demonstrated, revenue visibility improves, and Octane expands beyond current niche boundaries
    - $1.8-2.8B
    - Multiple expands as investors view Octane as a durable vertical-fintech platform rather than only a lender
    - Execution risk around expansion and disclosure remains high
    - Requires several non-public diligence items to turn positive
  notes: Ranges are analyst scenarios, not company guidance. They use the last private mark as a reference point and apply an explicit discount or premium for disclosure and funding durability.
