  evidenceGaps:
  - type: missing-source
    severity: material
    topic: revenue-opacity
    missingEvidence: Audited 2026 revenue, gross margin, take rate, and current net income or EBITDA bridge.
    whyItMatters: Without an earnings or revenue base, the Series F valuation cannot be normalized against either public lender comps or platform-style software valuation logic.
    diligencePath: Request CFO-prepared management accounts and auditor-backed revenue bridge in the data room.
    relatedQuestionRefs:
    - QV021
    - QV030
  - type: missing-source
    severity: material
    topic: credit-opacity
    missingEvidence: Static-pool delinquency, charge-off, recovery, and vintage performance data by core product segment.
    whyItMatters: Credit performance is the key downside determinant in a lender-like business and directly affects both capital-market access and equity value.
    diligencePath: Request servicing dashboards, ABS diligence packages, and underwriting committee materials.
    relatedQuestionRefs:
    - QV022
    - QV019
  - type: private-evidence-only
    severity: material
    topic: cap-table-opacity
    missingEvidence: Liquidation preferences, ratchets, warrants, side letters, and option-pool changes across private rounds.
    whyItMatters: Headline post-money valuation can overstate common-equivalent value if the preference stack is investor-favorable.
    diligencePath: Review legal financing documents and the fully diluted cap table in the transaction data room.
    relatedQuestionRefs:
    - QV030
