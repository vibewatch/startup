callouts:
- calloutType: insight
  title: The real valuation asset is funding throughput, not just software story
  body: Octane has enough ABS and forward-flow evidence to be underwritten as a repeat capital-markets platform, which is why the last round deserves more credit than a generic niche lender would receive.
  claimRefs:
  - CV008
  - CV009
  - CV010
  - CV012
- calloutType: risk
  title: Opacity is the largest self-inflicted discount
  body: The biggest reason not to pay through the Series F mark is not lack of growth evidence; it is the lack of public revenue, earnings, and credit-performance disclosure needed to test the quality of that growth.
  claimRefs:
  - CV016
  - CV017
  - CV033
  - CV040
- calloutType: recommendation
  title: Price discipline should improve before conviction does
  body: A better entry price or a better diligence package would each justify more aggressive positioning; today investors have neither, so the correct posture is track rather than chase.
  claimRefs:
  - CV019
  - CV021
  - CV038
