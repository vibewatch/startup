callouts:
- calloutType: insight
  title: Funding diversity is a mitigation, not immunity
  body: Octane has more real funding outlets than many fintech lenders, but every outlet still depends on credit performance and market appetite. Diversification reduces single-counterparty failure risk; it does not eliminate regime risk.
  claimRefs:
  - CR018
  - CR020
  - CR031
  - CR032
- calloutType: risk
  title: The live case changes the diligence bar
  body: The Gooding docket means legal risk is not hypothetical. Even if the case proves isolated, investors should request a written legal assessment, remediation history, and borrower-complaint bridge before assuming minimal exposure.
  claimRefs:
  - CR001
  - CR030
  - CR036
- calloutType: recommendation
  title: Underwrite to private data, not growth headlines
  body: Public evidence is enough to believe Octane is scaled and fundable, but not enough to size loss durability. The investment decision should turn on private delinquency, charge-off, concentration, and fair-lending evidence rather than originations alone.
  claimRefs:
  - CR016
  - CR027
  - CR035
  - CR037
