- id: financial-model
  title: Financial Model
  body: 'The financial-model risk is that Octane combines lender economics with capital-markets dependence in a cyclical, discretionary category, while disclosing too little publicly to let outside investors fully size the downside. Federal Reserve policy matters twice: it changes monthly borrower affordability and it changes structured-finance pricing. In a strong market, Octane can benefit from fast digital origination, institutional buyer demand, and a balance-sheet-light sale model. In a stressed market, the same architecture can work in reverse. Slower demand and worse loan performance can coincide with wider spreads or slower execution, leaving more loans temporarily on balance sheet and raising the importance of warehouse capacity and liquidity buffers. Auto Finance News suggests management is aware of this and targets a nine-month buffer, which is constructive. The problem is opacity. Public materials support the existence of ABS issuance, rating coverage, funding commitments, and
    a historical profitability milestone, but they do not give charge-off curves, delinquency trends, cohort recoveries, or enough revenue detail to judge whether the model remains attractive through a full cycle. That means Octane''s core financial risk is not simply leverage or cash burn; it is whether credit performance and gain-on-sale economics remain durable when external conditions tighten.'
