- id: operational
  title: Operational
  body: 'Operational risk at Octane is less about factories or inventory and more about workflow integrity across underwriting, servicing, and borrower support. The company''s 2024 CRO transition from Ray Duggins to Mark Molnar is therefore meaningful: the risk team is one of the few functions that touches credit policy, investor confidence, and regulator comfort at the same time. A smooth transition is plausible, but public materials do not yet show deep succession beneath the named executive. The servicing layer adds the most concrete operational risk. Roadrunner publicly documents identity-theft support, SCRA handling, total-loss insurance coordination, and a broad FAQ surface, which indicates a real servicing infrastructure. It also means the company is exposed to precisely the kinds of edge cases that generate complaints, compliance lapses, or payment friction when process quality slips. BBB and Trustpilot evidence does not prove systemic failure, but it does show that borrower experience
    can become a visible external signal. Fast origination growth compounds the issue. A lender that grew 74% in 2022 and 36% in 2024 has to keep fraud controls, borrower communications, underwriting exceptions, and servicing staffing synchronized with volume. If any one of those layers lags, losses can emerge through both credit and reputation channels.'
