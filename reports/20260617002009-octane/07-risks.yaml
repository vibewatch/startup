- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable Trigger
  - Threshold / Event
  - Action Implication
  rows:
  - - Funding access deterioration
    - Forward-flow / ABS execution cadence
    - Any failed take-out, major buyer pause, or warehouse utilization trend that breaks the stated nine-month buffer
    - Move from growth underwriting to downside case; require liquidity bridge and contingency funding plan
  - - Credit performance slippage
    - Early-stage delinquency and net charge-off trends
    - Meaningful deterioration versus management plan or prior vintages
    - Re-cut valuation on lower gain-on-sale economics and higher capital needs
  - - Regulatory / fair-lending weakness
    - Model validation, adverse-action testing, complaint escalation
    - No recent third-party fair-lending review or unresolved exception backlog
    - Treat compliance as thesis blocker until controls are independently verified
  - - Servicing reputation damage
    - BBB / Trustpilot trend, complaint backlog, regulator contacts
    - Rising unresolved complaints or evidence of payment-processing/control failures
    - Assume channel pressure and higher remediation cost; discount partner durability
  - - Legal case expansion
    - Gooding docket developments
    - Adverse ruling, broader allegations, or borrower-remediation commitments that imply systemic process gaps
    - Escalate legal reserve analysis and reassess exit timing / public-market readiness
  notes: These kill criteria convert a broad risk chapter into monitorable investment conditions. Each trigger is intentionally phrased so it can be tested in private diligence or board reporting rather than left as narrative judgment alone.
