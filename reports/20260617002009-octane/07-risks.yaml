- id: partner-dependency
  title: Partner Dependency
  body: 'Octane has diversified counterparties, but it is still a dependency-heavy model. On the distribution side, the company relies on OEM and dealer relationships to source borrowers efficiently. On the funding side, it relies on whole-loan buyers, forward-flow investors, warehouse capacity, and securitization markets to recycle capital. Public evidence is encouraging: Moore, Nuveen, and AB CarVal each committed large forward-flow programs, while ratings agencies continue to cover Octane receivables. That breadth lowers the probability of a single counterparty failure becoming existential overnight. It does not remove systemic exposure to a market regime where multiple buyers pause together, ratings criteria tighten, or expected collateral performance weakens. The same logic applies to channel partners. A Huntington Bank relationship can deepen reach and validate the platform, yet it also links Octane more tightly to third-party channel priorities and economics. Competition from incumbents
    such as Sheffield Financial means partner relationships cannot be taken as captive. The biggest unresolved issue is concentration disclosure. Public materials do not say how much volume comes from top OEMs, dealer groups, or specific funding buyers, so dependency risk can be mapped structurally but not fully quantified. That lack of concentration data is itself a risk because it prevents clean downside sizing.'
