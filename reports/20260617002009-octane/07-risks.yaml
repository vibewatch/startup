  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: risk-organization-depth
    missingEvidence: Current risk-organization chart, committee cadence, and delegated authorities below the CRO.
    whyItMatters: Public succession news confirms the named transition but not whether Octane has enough depth under the risk leader to absorb turnover or rapid growth.
    diligencePath: Request the current risk org chart, committee charters, and the last two quarters of risk-governance materials.
    relatedQuestionRefs:
    - QR025
  - type: missing-source
    severity: material
    topic: state-licensing-and-enforcement
    missingEvidence: A state-by-state licensing and enforcement record for Octane and Roadrunner.
    whyItMatters: Federal-facing evidence exists, but state licensing and supervisory history determine whether there are hidden compliance gaps outside the limited public record reviewed here.
    diligencePath: Obtain the company compliance matrix and outside-counsel memo summarizing state lending, servicing, and collection licenses plus any historical exams or findings.
    relatedQuestionRefs:
    - QR026
  - type: private-evidence-only
    severity: material
    topic: litigation-scope-and-remediation
    missingEvidence: Detailed allegations, current defense posture, reserve analysis, and any remediation commitments tied to the Gooding matter.
    whyItMatters: The PACER signal proves the case is live, but investors still need to know whether the dispute is isolated or reveals a broader servicing-process weakness.
    diligencePath: Request outside-counsel summary, docket chronology, reserve memo, and internal complaint bridge for the affected workflow.
    relatedQuestionRefs:
    - QR027
  - type: private-evidence-only
    severity: material
    topic: partner-and-buyer-concentration
    missingEvidence: Top-OEM, top-dealer-group, and top-capital-partner concentration percentages for origination and funding.
    whyItMatters: Named counterparties show breadth, but downside sizing still depends on whether any one channel or buyer contributes an outsized share of volume.
    diligencePath: Request concentration tables by partner, channel, and funding program for the last twelve months.
    relatedQuestionRefs:
    - QR028
  - type: private-evidence-only
    severity: blocking
    topic: credit-performance-vintages
    missingEvidence: Recent delinquency, charge-off, recovery, and prepayment curves by vintage and channel.
    whyItMatters: Without current credit-performance data, no outside party can verify whether Octane's growth and funding access are supported by durable loan quality.
    diligencePath: Obtain vintage performance packs, investor tapes, and management commentary on any recent reserve or pricing changes.
    relatedQuestionRefs:
    - QR029
  - type: private-evidence-only
    severity: material
    topic: peer-loss-and-margin-benchmarking
    missingEvidence: Internal or banker-prepared peer set showing Octane's loss, yield, and margin profile against comparable specialty lenders.
    whyItMatters: Relative performance determines whether Octane deserves premium underwriting confidence or should be treated as an ordinary cyclical lender.
    diligencePath: Request board materials or financing decks that compare Octane performance to peer specialty-vehicle or nonprime lenders.
    relatedQuestionRefs:
    - QR030
