- id: mitigations
  title: Mitigations
  body: 'Octane is not unmitigated. The strongest public mitigants are a demonstrated ABS program, multiple named forward-flow buyers, a recent equity raise, a formal CRO appointment, and visible borrower-support procedures around fraud, military borrowers, and total-loss events. Those signals suggest the company is already behaving more like an institutional specialty lender than a lightly governed fintech experiment. Still, the most important mitigants are exactly the ones that need private verification. Investors should ask for recent delinquency and charge-off curves by vintage, warehouse covenants, investor concentration by buyer and facility, fair-lending testing results, complaint-resolution metrics, and a legal memo on the Gooding case. If those materials show stable collateral performance, diversified buyer demand, and well-controlled servicing, Octane''s risks are probably manageable within a growth-finance thesis. If they show rising early-stage delinquency, buyer pullback, poor
    complaint remediation, or weak model-governance evidence, the risk stack moves from manageable to thesis-breaking quickly. Put differently: Octane appears to have real mechanisms to absorb ordinary volatility, but the company has not publicly disclosed enough to prove resilience under a sharper funding or credit shock. The kill criteria therefore need to be explicit before any investor relies on the current headline growth narrative.'
