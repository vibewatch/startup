  evidenceGaps:
    - topic: developer-community-signal
      description: >-
        Octane does not maintain a public GitHub organisation, developer API portal, or open-source SDK.
        No Stack Overflow tags, npm packages, or equivalent developer-community signal surfaces exist.
        FairPlay.ai was used as the closest practitioner-community proxy for the developer-signal
        requirement: it describes SR 11-7 algorithmic validation tooling that Octane uses for model
        governance. Octane's true API and DMS integration depth cannot be assessed from public sources.
      relatedQuestionRefs:
        - QE018
        - QE025
    - topic: security-compliance-certifications
      description: >-
        No SOC 2, ISO 27001, PCI DSS, or similar certification was found in public materials.
        This is the primary trust-layer gap for enterprise or OEM-level due diligence. There is no
        public status page or uptime SLA for the Octane Dealer Portal or consumer application
        infrastructure. Supply-chain risk from cloud or DMS provider concentration cannot be assessed.
      relatedQuestionRefs:
        - QE019
        - QE023
    - topic: internal-credit-model-architecture
      description: >-
        The Prism AI underwriting engine referenced in Octane company overview materials was not found
        as a separately documented product in the chapter-5 source set. Credit model features, training
        data, vintage-level performance, and servicing complaint rates remain undisclosed. No independent
        attestation of the FairPlay engagement or its test outcomes was available.
      relatedQuestionRefs:
        - QE017
        - QE024
