company:
  name: Octane
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Octane's product architecture is an interlocking set of dealer-facing workflow software,
    consumer-facing soft-pull credit tools, a proprietary in-house lender, and a portfolio of
    enthusiast media properties. The technology differentiation story is credible and operationally
    proven across 4,000-plus dealers and 30-plus OEM partners, but public disclosure of security
    certifications, uptime SLAs, internal credit-model architecture, and proprietary data-layer depth
    remains limited. The platform's strongest verified evidence is in dealer workflow release notes,
    consumer product pages, and capital-markets execution rather than in deep technical documentation
    or third-party benchmarks.
sections:
  - id: section-1
    title: Dealer workflow platform and Dealer Portal 2.0
    body: >-
      Octane's core dealer-facing product is the Octane Dealer Platform, centered on Dealer Portal 2.0,
      which launched in April 2024 across the company's 4,000-plus powersports and OPE dealer partners.
      The upgrade introduced three major workflow changes. The Leads Page, described as a first-of-its-kind
      feature, centralises all customer applications so dealers can search, filter, and monitor leads in
      one view, convert leads to applications directly, and view pre-qualified buyer information sourced
      from Octane Prequal, Prequal Flex, OEM partner channels, and Octane Media editorial properties. The
      reimagined Work-the-Deal page makes deal structuring more dynamic: once a credit application is
      approved, dealers can filter loan terms, APRs, and monthly payment options in real time, reducing
      manual guesswork and per-deal time. According to a dealer testimonial included in the launch
      announcement, All Out Cycles Finance Manager Tammy Coleman reported saving fifteen to twenty minutes
      per deal. The third change is a shorter and smarter credit application that uses dynamic field logic
      to hide unnecessary inputs and accelerate the borrower experience. Dealer Portal 2.0 is also
      available to Octane's RV dealer partners, extending the platform beyond powersports. The dealer
      signup workflow is clearly documented on the company's enrollment pages, and Roadrunner Financial
      is the contractual lender underneath every deal. The strongest public evidence for this module is
      the April 2024 press release and the Dealer Portal product pages; the gap is the absence of third-party
      uptime, feature adoption, or dealer satisfaction data.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
    tableRefs:
      - TE001
      - TE002
    figureRefs:
      - FE001
  - id: section-2
    title: Soft-pull prequalification tools — Prequal, Prequal Flex, and SafeCheck
    body: >-
      Octane's most differentiated product surface in dealer-consumer bridging is its suite of soft-pull
      credit tools. Octane Prequal is a free, dealer-integrated prequalification widget that can be embedded
      on dealership websites, used on the showroom floor, or applied in digital marketing campaigns.
      The workflow uses a soft credit pull so the consumer's score is not affected at prequalification; the
      output is a real Roadrunner Financial loan offer, not a generic estimate. Buyer data — including
      email, phone, and SSN — flows directly into the dealer's Octane portal or DMS, shortening the
      path to contract. As of 2024, over 1,200 dealers were using each of Octane Prequal and Prequal Flex
      respectively, and nearly 400,000 powersports applications were sent to partner dealers through the
      two tools in 2024. Prequal Flex, launched in May 2023, extends Prequal's reach by providing each
      enrolled dealer with a dedicated dealership-branded URL that can be distributed through email, social
      media, text, NFC cards, hang tags, or events. A pilot of Prequal Flex showed a 40% increase in total
      applications for participating dealers, with Onyx Moto dealer principal Kenny Chen describing the
      soft-pull flow as creating customer ease at the prequalification step. SafeCheck, the third tool,
      gives enrolled dealers access to a full Experian credit bureau report for a customer immediately
      after an application is submitted, at no additional cost. SafeCheck also provides OFAC compliance
      checks and Fraud Shield summaries, reducing dealer compliance burden at the point of sale. All three
      tools are free to Octane's enrolled dealer network and designed to funnel higher-quality, pre-credited
      leads into the dealer's workflow. The principal public-evidence limitation is that conversion-rate,
      credit-pull-to-contract, and dealer adoption-curve data are not disclosed beyond the broad counts
      cited in the 2024 annual press release.
    claimRefs:
      - CE008
      - CE009
      - CE010
      - CE011
      - CE012
      - CE013
      - CE014
    tableRefs: []
    figureRefs:
      - FE002
  - id: section-3
    title: Octane Preferred loyalty architecture and dealer incentive layer
    body: >-
      Octane Preferred is a tiered B2B loyalty programme that Octane launched in March 2023 to
      formalise the incentive structure for its most active dealer partners. The programme operates
      on a monthly funding cycle tied exclusively to loans funded through Roadrunner Financial. Two
      tiers exist publicly: All-Star (five or more originations per month) and MVP (ten or more
      originations per month). Benefits are reset and refreshed at the start of each month based on
      the prior month's activity, creating a short-cycle engagement loop. Disclosed programme benefits
      include VIP stipping experiences, priority chat functions for deal support, exclusive access to
      new products, and personalised dealer statistics. The programme is free to join and available to
      any US powersports dealer enrolled on the Octane platform and approved by Roadrunner Financial.
      The practical significance for product architecture is that Octane Preferred creates a pull-through
      incentive for dealers to use Roadrunner Financial as their primary lender rather than routing
      deals to competing lenders. By tying benefits to Roadrunner-funded volume, Octane aligns dealer
      economics directly with captive lender share. The press release announcing the programme cited over
      4,000 dealer partners and described the programme as a first-of-its-kind B2B loyalty system for
      the powersports lending market. Public gaps include the percentage of active dealers who have
      reached All-Star or MVP tier, average benefit redemption rates, and whether the programme has
      meaningfully shifted Roadrunner's share of wallet within the enrolled network.
    claimRefs:
      - CE015
      - CE016
      - CE017
      - CE018
    tableRefs:
      - TE005
    figureRefs: []
  - id: section-4
    title: Octane Media flywheel and advertising monetisation
    body: >-
      Octane Media is a portfolio of seven powersports and motorsports editorial brands acquired from
      Bonnier Corp in 2020: Cycle World, UTV Driver, Dirt Rider, ATV Rider, Motorcyclist, Cruiser, and
      Cycle Volta. The media properties serve a dual function in Octane's operating model. As a
      consumer-acquisition funnel, they embed Octane Prequal prequalification widgets directly alongside
      editorial content, routing high-intent buyers into the Roadrunner Financial financing pipeline
      before they ever visit a dealership. As an advertising business, Octane launched paid advertising
      for OEMs, large dealer chains, and insurers in May 2023 — the first time the properties had been
      monetised by external advertisers since the Bonnier acquisition. Public audience data cited at
      launch: among Octane Media readers under 35, 70 percent own at least one motorcycle, 69 percent
      live in a household with three motorcycles, and 43 percent plan to purchase a motorcycle within
      two years. Average session duration on review, comparison, and test pages is over 16 minutes.
      Email newsletter open and click-through rates reportedly exceed industry benchmarks by 80 and 265
      percent respectively. In Dealer Portal 2.0, the Leads Page explicitly aggregates pre-qualified
      buyers sourced from Octane Media properties alongside Prequal and OEM partner channels, making
      the media assets a direct input to the dealer workflow layer. This integration of content,
      prequalification, and dealer workflow in a single stack is the most distinguishing architectural
      feature of Octane's product model relative to pure-play lenders or pure-play software vendors.
      Public evidence gaps include media-property traffic volumes, advertising revenue as a share of
      total revenue, and advertiser renewal or CPM benchmarks.
    claimRefs:
      - CE019
      - CE020
      - CE021
      - CE022
      - CE023
