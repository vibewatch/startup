callouts:
  - calloutType: strength
    title: Integrated soft-pull, dealer workflow, and media flywheel is a genuine architectural moat
    body: >-
      Octane's combination of free soft-pull tools (Prequal/Prequal Flex/SafeCheck) embedded in a
      dealer-facing portal that also aggregates pre-credited leads from seven editorial properties creates
      a distribution and data loop that pure-play lenders and standalone software vendors cannot easily replicate.
      The 400,000 applications sent through soft-pull tools in 2024 and the 1,200-plus dealer adoption of each
      tool validate that this architecture generates real throughput, not only marketing narrative.
    claimRefs:
      - CE008
      - CE009
      - CE010
      - CE019
      - CE020
      - CE022
  - calloutType: risk
    title: Security certifications, uptime SLAs, and credit-model transparency remain undisclosed
    body: >-
      No SOC 2 Type II, ISO 27001, or equivalent certification appeared in the public record.
      There is no published status page for the Dealer Portal or consumer application infrastructure.
      FairPlay engagement is self-reported and lacks independent attestation detail. These gaps make
      enterprise dealer and OEM due-diligence harder and represent the chief technical-diligence blind
      spot for investors evaluating platform risk at scale.
    claimRefs:
      - CE033
      - CE034
      - CE035
