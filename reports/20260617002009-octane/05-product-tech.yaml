  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - - Soft-pull credit engine (Experian FICO)
        - Instant prequalification without credit impact; routes application to Roadrunner
        - Experian data bureau; FCRA compliance stack
        - Bureau outage or data error would break prequalification flow for all channels
      - - Digital contract and funding layer
        - Converts approved application to loan contract; enables same-day funding via direct deposit
        - Roadrunner Financial lender infrastructure; dealer DMS integration
        - DMS compatibility issues could slow dealer adoption; direct deposit availability varies
      - - ABS and warehouse financing stack
        - Funds origination capacity; pools and securitises loans for capital markets
        - ATLAS SP Partners, J.P. Morgan, Truist Securities; multiple warehouse lenders; ~$1B revolving capacity
        - Warehouse covenant stress or ABS spread widening would compress origination capacity
      - - FairPlay algorithmic fairness layer
        - External bias-testing of Roadrunner credit model for ECOA/fair lending compliance
        - FairPlay.ai SaaS platform; SR 11-7-aligned model validation
        - Regulatory change to fair lending rules could require model re-validation
      - - Octane Media editorial and data pipeline
        - Generates pre-credited consumer leads; feeds Dealer Portal Leads Page
        - Editorial staff; web/email infrastructure; 7 publication sites
        - Audience engagement could decline if editorial quality drops or traffic is disrupted
    notes: >-
      Architecture inferred from product pages, press releases, and partner disclosures.
      Internal API, cloud infrastructure, and ledger architecture are not publicly disclosed.
