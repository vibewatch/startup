      - number: '6.4'
        title: 消费者体验、留存信号与负面证据
        blocks:
          - type: paragraph
            body: >-
              消费者体验是公开记录中记录最少、负面证据最多的客户板块。Roadrunner Financial 的服务披露确认了较成熟的借款人权利政策——提前还款无罚金、困难延期、SCRA
              军人保护，以及可电话访问的支付系统——这说明服务层满足消费金融基线标准。但 roadrunnerfinancial.com 的 Trustpilot
              评论包含有事实支撑的负面信号：一名评论者称支付网站是其遇到过最糟糕的网站，理由是无法用移动设备在线付款，并且需要支付电话付款附加费。另一名评论者称，2019
              年初服务商转移后出现信用报告中断，影响了其按揭申请期间的信用档案。公司的 Trustpilot 回复承认了具体服务故障，确认这些投诉并非捏造。Roadrunner Financial 的 BBB Business
              Profiles 也在公开记录中，但所审阅页面没有披露具体评级或投诉数量。CFPB 消费者投诉数据库公开可访问，覆盖包括细分贷款方在内的 auto loan servicers；所审阅材料未发现
              Roadrunner Financial 的具体投诉量或监管行动，这不能证明监管记录干净，只能说明没有可见的具体执法行动或公开和解。Trustpilot 和 BBB 证据主要来自 2019
              年，可能反映早期服务基础设施；到 2026 年，Roadrunner 的公开披露描述了更完善的借款人支持栈。核心负面缺口在于，公开来源中没有系统性消费者满意度调查、NPS
              或响应数量足够的独立评论汇总，无法规模化评估消费者板块。
