  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点
        blocks:
          - type: paragraph
            body: >-
              Octane 值得关注，因为公开记录显示的是一个真实且有规模的贷款平台，不是概念性项目。公司披露其 2025 年 12 月完成 $100 million Series F，投后估值超过 $1.3
              billion；随后又有运营证据显示，2024 年发起量达到 $1.6 billion，累计发起量超过 $5 billion，机构资本渠道通过 forward-flow
              和证券化项目持续扩张。这组组合对估值很关键，因为它说明 Octane 同时被定价为专业贷款方和可重复执行资本市场交易的引擎。论点的正面是有形规模、资金多元化证据，以及至少曾在 GAAP
              层面盈利的某些迹象。反论点同样重要：几乎没有任何能让外部投资者标准化该估值的指标公开。没有披露 2026 年收入 run rate，没有公开 ARR 或 NRR 披露，没有透明损失曲线数据，也没有关于优先权的
              cap table 细节。因此，本章建议必须奖励规模证明，同时仍施加有意义的不透明折价。
