      - number: '1.3'
        title: 融资、投资方与资本基础
        blocks:
          - type: paragraph
            body: >
              Octane 的资本基础有两层，不能混为一谈：一层是运营公司的股权融资，另一层是为贷款本身提供资金的更大规模债务和贷款出售能力。股权端，Octane 于 2025 年 12 月 15 日完成 $100M
              Series F，融资后估值 $1.3B，由 Valar Ventures 领投，使累计股权融资从此前 $242M 基础增至约 $342M；此前公司在 2024 年完成 $50M Series E。Series
              F 参投方包括 Upper90、Huntington Bank、Camping World/Good Sam 和 Holler-Classic，其中数家同时也是商业合作伙伴——这种战略投资人模式强化分销，但也让
              cap table 的独立解读变复杂。资金端，Octane 自 2019 年起运行资产支持证券化项目，已在十六笔交易中发行超过 $4.7B，并叠加与 Nuveen、Bayview、Moore Capital、AB
              CarVal、YieldStreet 和 Georgia's Own Credit Union 等机构的远期流量与整贷协议，称自 2023 年 12 月以来获得超过 $3.3B
              承诺。战略投资人重叠与具名资本伙伴的广度是真实优势，但具体持股比例、优先权条款和董事席位并不公开，控制权与经济利益一致性仍是真问题，尽调必须补齐。
