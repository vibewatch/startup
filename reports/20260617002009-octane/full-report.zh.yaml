      - number: '5.3'
        title: Octane Preferred 忠诚度架构与经销商激励层
        blocks:
          - type: paragraph
            body: >-
              Octane Preferred 是一套分层 B2B 忠诚度计划，Octane 于 2023 年 3 月推出，用来把最活跃经销商伙伴的激励结构制度化。计划按月度放款周期运行，只与通过 Roadrunner
              Financial 放款的贷款挂钩。公开可见有两档：All-Star（每月五笔及以上起息）和 MVP（每月十笔及以上起息）。权益根据上月活动在每月初重置和刷新，形成短周期参与循环。披露的计划权益包括 VIP
              stipping 体验、交易支持优先聊天功能、新产品独家使用权和个性化经销商统计。计划免费加入，面向所有接入 Octane 平台并获 Roadrunner Financial 批准的美国 powersports
              经销商。放到产品架构里看，Octane Preferred 的实际意义在于，它给经销商设置了牵引激励，让经销商优先使用 Roadrunner Financial
              作为主力贷款方，而不是把交易导向竞争贷款方。Octane 把权益与 Roadrunner 放款量绑定，直接把经销商经济利益与自营贷款方份额对齐。发布该计划的新闻稿提到超过 4,000 家经销商伙伴，并称该计划是
              powersports 贷款市场首个同类 B2B 忠诚度系统。公开缺口包括：活跃经销商中达到 All-Star 或 MVP 档的比例、平均权益兑换率，以及该计划是否实质性提升了 Roadrunner
              在接入网络内的钱包份额。
