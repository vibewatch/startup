      - number: '4.3'
        title: 成本结构与毛利率
        blocks:
          - type: paragraph
            body: >-
              Octane 的成本结构反映了它既是金融机构、也是技术平台的双重属性。主要成本包括：（1）资金成本（仓储额度利息、ABS 票息支付、远期流量定价），这是最大的成本驱动，并直接决定
              NIM；（2）Roadrunner Financial 持有贷款账簿的信用损失，取决于承保质量和信用周期；（3）OctaneOS、Dealer Portal、Prequal
              及支撑系统的技术基础设施和产品开发成本；（4）销售、营销和经销商伙伴管理成本；（5）Roadrunner Account Services 的服务运营。公司 2024 年年度更新提到 41%
              毛利率，若得到验证，这是正面信号。对混合型 fintech 贷款机构而言，41% 毛利率意味着相对于收入，资金成本和信用损失得到有效控制。不过，Octane
              对毛利率的定义可能并未包含所有信用周期费用，且该定义未经独立验证。业务资本强度不低，因为放款增长需要表内资金（仓储额度）或已承诺表外容量（远期流量），两者都有容量限制和成本影响。$100 million
              Series F 股权融资被称将用于增长计划和二级股份转让，说明这笔股权主要提供运营能力，而不只是信用损失缓冲。
