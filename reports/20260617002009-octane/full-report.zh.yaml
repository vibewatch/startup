  - id: FU004
    title: 留存 / 重复队列
    type: cohort
    layout: standard
    summary: 公开证据深度只能支持序数留存代理；所有数字都是定性证据强度代理，不是公司披露的留存指标。
    data:
      columns:
        - 第 1 年信号
        - 第 2 年信号
        - 第 3 年及以后信号
