      - number: '6.2'
        title: OEM 伙伴采用与生产部署
        blocks:
          - type: paragraph
            body: >-
              OEM 板块是 Octane 最可见、最可验证的客户群。五个与主要 OEM 的命名合作已通过新闻稿公布，每个都描述了覆盖该 OEM 全美国经销商网络的生产部署。Polaris（2021 年 12 月宣布，2022
              年 1 月生效）覆盖 Sportsman、RANGER、RZR、GENERAL、Indian Motorcycle、Slingshot 和 snowmobiles，跨越大型全球经销商网络。BRP 于 2021 年
              11 月扩大 Sea-Doo 合作，加入 Sea-Doo Switch pontoon，把 2017 年开始的既有 powersports 关系继续延伸。Kawasaki 于 2024 年 1
              月宣布全谱系协议，覆盖其美国全产品线——摩托车、ATV、side-by-side 和 JET SKI watercraft——并触达 1,000 多家美国独立经销商。CFMOTO 于 2024 年 12 月宣布
              prime-and-non-prime 协议，覆盖其完整 ATV、side-by-side 和摩托车产品线，触达 600 多家美国经销商；值得注意的是，在 prime-financing 扩展之前，CFMOTO
              经销商网络中已有超过四分之一嵌入 Octane Prequal。Honda 有专门的 Octane 落地页，列出 UTV 和 ATV 融资选项。公司称总计有 30 多个 OEM
              伙伴，五个命名交易只是其中一部分。OEM 合作模型创造了结构性分发优势：OEM 引导经销商网络参与，在面向消费者的网站嵌入 Octane 预审批，并共同营销融资促销。这使 OEM
              关系成为分发杠杆，而不只是联合品牌安排。公开缺口包括 30 多个 OEM 伙伴的完整名单、任一具体 OEM 渠道贡献的收入或交易量，以及任何合同期限或续约证据。
