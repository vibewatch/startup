  - id: TV003
    title: 牛 / 基准 / 熊情景
    columns:
      - 情景
      - 关键假设
      - 估值估算
      - 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 熊
        - 消费需求转弱，融资利差走阔，投资人主要把 Octane 按周期性专业贷款机构承销，而不给高溢价软件经济性
        - $600-900M
        - 相比上轮标记的下行，来自倍数压缩和对放款吞吐信心下降
        - 信用与融资压力相互强化
        - 如果 2026 年信用或 ABS 条件恶化，这一情景就有可能
      - - 基准
        - 放款增长保持正向，ABS 和 forward-flow 渠道保持开放，没有出现可见信用冲击
        - $1.1-1.5B
        - Series F 仍大致合理，因为规模证明抵消了公开财务细节不足
        - 不透明继续压住上行
        - 最符合当前公开证据
      - - 牛
        - 可重复盈利能力得到证明，收入可见度改善，Octane 扩张到当前细分边界之外
        - $1.8-2.8B
        - 投资人把 Octane 看成耐久的垂直金融科技平台，而不只是贷款机构，倍数随之扩张
        - 扩张和披露相关执行风险仍高
        - 需要多个非公开尽调事项转为正面
    notes: 区间是分析师情景，不是公司指引。它们以上一轮私募标记为参考点，并对披露和融资耐久性给出明确折价或溢价。
    claimRefs:
      - CV022
      - CV023
      - CV024
      - CV034
      - CV035
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 类型
      - 市值 / 状态
      - 收入倍数或指标
      - 与 Octane 的相关性
      - 主要限制
    rows:
      - - LendingClub
        - 上市市场撮合型银行 / 贷款机构
        - 市值 $2.19B（2026 年 6 月）
        - 公开收入和银行模型披露；有 2024 年申报文件
        - 有助于用公开市场纪律约束已披露贷款机构经济性
        - 存款融资银行模型和监管画像差异很大
      - - Upstart
        - 上市 AI 赋能消费贷款机构
        - 市值 $3.08B（2026 年 6 月）
        - 公开收入和 2024 年申报文件可用；倍数对市场情绪高度敏感
        - 有助于界定金融科技贷款机构倍数会如何随信用观点快速波动
        - 产品组合是无抵押消费贷款，模型可见度高得多
      - - Affirm
        - 上市分期 / BNPL 平台
        - 市值 $25.01B（2026 年 6 月）
        - 平台大得多，已披露收入规模
        - 展示有资本市场相关性的规模化金融科技分销能拿到的上行
        - 规模和品类宽度决定它只能作为外沿参考
      - - SoFi
        - 上市多元化金融科技银行
        - 市值 $22.71B（2026 年 6 月）
        - 多元化贷款、银行和交叉销售模型
        - 展示产品宽度和披露在公开市场能换来什么
        - 业务组合远比 Octane 宽
      - - Sheffield Financial
        - 私有动力运动 / 户外金融竞争对手
        - 私有；没有透明公开估值
        - 仅有品类相关性
        - 可作为细分终端市场参照，用来检查竞争集选择
        - 私有权属导致无法干净比较市场倍数
    notes: 在本章使用、且对决策有用的公开和细分参照里，可比集已经穷尽：四家有当前市值的大型上市金融科技贷款平台，加上披露最接近的专业车辆金融竞争对手参照。
    claimRefs:
