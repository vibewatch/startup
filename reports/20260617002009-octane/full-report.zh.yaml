      - number: '5.2'
        title: 软查询预资格工具——Prequal、Prequal Flex 和 SafeCheck
        blocks:
          - type: paragraph
            body: >-
              Octane 在连接经销商与消费者这件事上，最有差异化的产品表面是一组软查信用工具。Octane Prequal
              是免费、嵌入经销商流程的预审批组件，可以放进经销商网站、在展厅使用，也可以接入数字营销活动。流程用软查信用，消费者在预审批阶段不会影响信用分；输出的是 Roadrunner Financial
              的真实贷款报价，不是泛泛估算。买方数据——包括邮箱、电话和 SSN——直接流入经销商的 Octane 门户或 DMS，缩短从线索到合同的路径。截至 2024 年，Octane Prequal 和 Prequal
              Flex 各自已有超过 1,200 家经销商使用；2024 年，两个工具向合作经销商送出了近 400,000 份 powersports 申请。Prequal Flex 于 2023 年 5
              月上线，为每个接入经销商提供专属、带经销商品牌的 URL，可通过邮件、社媒、短信、NFC 卡、吊牌或活动分发，把 Prequal 的触达做远。Prequal Flex 试点显示，参与经销商的总申请量增加
              40%；Onyx Moto 经销商负责人 Kenny Chen 称，软查流程让客户在预审批环节更轻松。第三个工具 SafeCheck 让接入经销商在客户提交申请后，立即免费查看完整 Experian
              征信局报告。SafeCheck 还提供 OFAC 合规检查和 Fraud Shield 摘要，降低销售现场的经销商合规负担。三个工具都免费提供给 Octane
              接入的经销商网络，设计目标是把质量更高、已预授信的线索导入经销商工作流。公开证据的主要限制在于，除 2024 年年度新闻稿引用的宽口径数量外，转化率、从信用查询到签约、经销商采用曲线等数据均未披露。
