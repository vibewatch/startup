        title: 竞争格局
        blocks:
          - type: paragraph
            body: >-
              Octane 的竞争集合更适合理解为一组碎片化的部分替代品，而非单一品类对手。美国年度动力运动市场约 $30 billion，服务方包括 Sheffield Financial
              这样的专业银行系贷款机构（Truist Bank 旗下部门，在该品类深耕 30 多年）、Synchrony Financial 的动力运动和户外动力设备等大型银行信贷项目、Harley-Davidson
              Financial Services 和 Yamaha Motor Finance 等 OEM 自有金融机构、提供休闲车贷款的区域信用合作社，以及 LightStream
              这类为动力运动购买提供无抵押个人贷款的纯数字银行。没有哪个替代方案像 Octane 一样，在单一平台内同时组合全信用谱系覆盖、经销商工作流软件、多 OEM 项目管理和 ABS 资本市场项目。Octane
              公开足迹覆盖 4,000 多家经销商伙伴和 60 多个 OEM 品牌，尚未看到任何单一竞争对手达到同等规模。多数 OEM 协议并非排他，意味着经销商和品牌可以同时使用 Octane
              与自有金融项目；因此市场不是赢家通吃，多栖使用会长期存在。
