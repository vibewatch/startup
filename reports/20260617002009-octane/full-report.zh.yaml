      - number: '4.6'
        title: 财务结论与负面证据
        blocks:
          - type: paragraph
            body: >-
              财务图景方向上正面，但实质上不透明。核心论点是，Octane 围绕不断增长的放款引擎，搭建了多元、机构级资本基础，单位经济也在改善；41% 毛利率、46% 收入增长，以及 Upper90
              关于快速且盈利增长的投资者引述都支持这一点。负面情形建立在几个无法验证的假设上。第一，核销率和逾期率从未公开披露；ABS 表现数据位于机构投资者墙后；KBRA 和 S&P
              评级报告需要凭证访问。若进入压力信用周期，NIM 可能被压缩，出售收益也可能只能以更低溢价实现。第二，出售收益收入模式天然具有事件性，并依赖机构持续买入动力运动资产；信贷市场错位可能扰乱远期流量管线。第三，S&P
              Global 网站返回的 Octane ABS 监测结果有限，确认 ABS Deal of the Year 奖项的 GlobalCapital
              文章在研究期间受访问限制，围绕第三方信用评估形成具体证据缺口。第四，消费者投诉渠道（CFPB）没有产生可直接归因的大量负面数据，但 Roadrunner Financial 和 Octane Lending
              的投诉可能被归入不同分类代码。第五，竞争对手章节提到的 Gooding v. Octane Lending 联邦诉讼构成法律负面信号，财务暴露未知。第六，公司是私人公司，没有报告义务，因此 46% 收入增长和
              41% 毛利率无法在没有审计师访问的情况下独立印证。私人尽调必须覆盖所有这些维度，才能承销财务论点。
            claimRefs:
              - CI026
              - CI027
              - CI028
              - CI029
              - CI030
      - number: '4.7'
        title: 图表
        blocks:
          - type: callout
            title: 多元机构资本基础是关键财务差异化
            body: >-
              到 2026 年，Octane 已组建一套资本栈，覆盖 16 笔 ABS 交易、五项远期流量协议和六笔整贷出售，投资者包括 Nuveen（TIAA）、Moore Capital、AB CarVal 和
              Bayview 等蓝筹机构。这种多元化降低单一对手方集中风险，也释放机构对 Octane 信用表现的验证信号。
            calloutType: strength
            claimRefs:
              - CI022
              - CI023
          - type: callout
            title: 核销不透明是最大的未解决财务尽调缺口
            body: >-
              Octane 发布的所有财务指标（46% 收入增长、41% 毛利率）均未经审计，且为公司表述。对一家处于周期性资产类别中的全谱系贷款机构来说，缺少公开核销和逾期数据是最重要缺口。投资人若无法访问
              Roadrunner Financial 服务商报告以及 KBRA/S&P ABS 监测数据，就无法承销财务论点。
            calloutType: risk
            claimRefs:
              - CI026
              - CI027
          - type: callout
            title: 纳入 ABS 后，$3.7B 已售 / 已承诺数字低估了总资本活动
            body: >-
              自 2023 年 12 月以来的 $3.7B 整贷出售和远期流量承诺，不包括自 2019 年以来的 $4.7B+ ABS 发行。合计来看，总资本市场活动超过 $8B；即使没有经审计财务，这也是机构接受
              Octane 资产类别的强证据。
            calloutType: insight
            claimRefs:
              - CI018
              - CI022
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 经销商工作流平台与 Dealer Portal 2.0
        blocks:
          - type: paragraph
            body: >-
              Octane 面向经销商的核心产品是 Octane Dealer Platform，以 Dealer Portal 2.0 为中心；该版本于 2024 年 4 月在公司 4,000 多家动力运动和 OPE
              经销商伙伴中上线。升级引入三项主要工作流变化。Leads Page 被描述为同类首创功能，把所有客户申请集中起来，让经销商在一个视图中搜索、筛选和监控线索，直接把线索转为申请，并查看来自 Octane
              Prequal、Prequal Flex、OEM 合作伙伴渠道和 Octane Media 编辑内容资产的预资格买家信息。重新设计的 Work-the-Deal
              页面让交易结构更动态：信用申请获批后，经销商可以实时筛选贷款期限、APR 和月供选项，减少人工猜测和单笔交易时间。发布公告中的经销商证言称，All Out Cycles 财务经理 Tammy Coleman
              每笔交易节省十五到二十分钟。第三项变化是更短、更智能的信用申请，使用动态字段逻辑隐藏不必要输入，加快借款人体验。Dealer Portal 2.0 也向 Octane 的 RV
              经销商伙伴开放，把平台延伸到动力运动之外。公司入驻页面清楚记录了经销商注册工作流，每笔交易底层的合同贷款机构都是 Roadrunner Financial。该模块最强的公开证据是 2024 年 4 月新闻稿和
              Dealer Portal 产品页；缺口是没有第三方 uptime、功能采用率或经销商满意度数据。
