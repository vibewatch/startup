      - number: '6.5'
        title: 扩张动态、集中度风险与渠道依赖
        blocks:
          - type: paragraph
            body: >-
              Octane 的增长轨迹由多维扩张支撑：新增 OEM 伙伴、新车辆垂直（RV、marine、OPE）、新工具（Prequal Flex、SafeCheck、Preferred）和私有品牌交易（RideNow
              Finance）。2024 年，Octane 的 RV 发起量连续第二年翻倍，并进入 marine，增加两个垂直，降低 powersports 周期性集中。发起量 2024 年增长 36% 至 $1.6
              billion，截至 2024 年 9 月累计达到 $5 billion。这些增长信号验证了 land-and-expand 动作：Octane 先建立 powersports 经销商关系，把
              Prequal/Prequal Flex 加到经销商网站，再通过 SafeCheck、Preferred，最终通过 RideNow 式私有品牌化加深关系。但集中度风险很实质。Powersports
              是高度周期性、可选消费信贷品类；2022 年被描述为库存约束普遍存在的时期。OEM 集中度未披露：如果一两个大型 OEM
              伙伴（Polaris、Kawasaki）贡献了不成比例的发起量，它们的项目调整可能实质影响交易量。4,000 多家的经销商基础很大，但 Octane 2022 年新闻稿指出，每月放款超过十笔的经销商数量增长
              50%，意味着相对较小的一组经销商可能贡献了很大份额。没有公开 Herfindahl 或头部经销商集中度数据。消费者借款人的地域集中也未披露——powersports
              需求偏向乡村和郊区市场，可能把信用风险集中在特定地区。RideNow 私有品牌交易虽然是标志性胜利，也创造了新的集中形式：单一经销商集团在 56 个地点嵌入 Octane
              基础设施。投资者在判断集中度前，需要经销商级发起量集中、OEM 项目收入占比，以及借款人队列地域和信用层级分布的私有数据。
