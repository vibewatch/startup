          label: 4,000+ 家已加入的动力运动 / OPE / RV 经销商
        - id: n2
          label: 30+ 个 OEM 合作伙伴（5 个有新闻稿具名）
        - id: n3
          label: 每项软查询工具 1,200+ 家经销商（Prequal / Prequal Flex）
        - id: n4
          label: 具名 OEM 生产部署（Polaris / Kawasaki / BRP / CFMOTO）
        - id: n5
          label: 私有品牌交易（RideNow Finance，56 家门店）
        - id: n6
          label: 消费者留存 / NPS——无公开数据
      edges:
        - from: n1
          to: n2
        - from: n1
          to: n3
        - from: n2
          to: n4
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
    approximationNotes: 漏斗仅作示意；各阶段之间的实际转化率未公开披露。
    claimRefs:
      - CU001
      - CU009
      - CU017
      - CU032
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: standard
    summary: OEM 合作伙伴拥有最强的生产和结果证据；消费者分部公开证明最弱，负面信号最多。
