  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层——经销商、OEM、消费者与媒体广告主
        blocks:
          - type: paragraph
            body: >-
              Octane 的客户群分成四个不同板块，价值主张和证据质量各不相同。Powersports 和 OPE 经销商（根据 Dealer Portal 2.0 新闻稿，截至 2024 年 4 月超过 4,000
              家）是主要销售与分发渠道：他们发起贷款、使用工作流工具，并参与 Octane Preferred 忠诚度计划。经销商板块覆盖独立 powersports 零售商、特许经销店和 Outdoor Power
              Equipment 经销商；Octane 进入 RV 市场后，RV 经销商成为增长中的次级群体。第二个板块是 OEM 制造商，它们把 Octane 融资嵌入自身经销商网络，作为品牌化或促销型解决方案。这些 OEM
              合作覆盖 Polaris、Kawasaki、BRP（Sea-Doo）、CFMOTO、Honda 等，让 Octane 触达 OEM 自有经销商网络和 OEM
              网站上的消费者流量，把发起范围扩展到自主接入经销商之外。第三个板块是消费者借款人：个人在购买时通过 Roadrunner Financial 为 powersports 车辆、RV 或 marine craft
              融资。消费者不直接与 Octane 签约，而是通过 Roadrunner Financial 品牌借款人门户、电话支持和在线支付系统互动。第四个也是最新板块是媒体广告主——OEM、大型经销商集团和保险公司付费触达
              Octane Media 七份出版物的受众。该板块于 2023 年 5 月启动。证据质量差异很大：经销商和 OEM
              板块在新闻稿里有强命名证明；消费者板块有运营服务披露和部分负面评论证据，但公开渠道没有系统性的满意度或留存数据。
