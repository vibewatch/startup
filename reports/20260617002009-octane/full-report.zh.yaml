companyProfile:
  summary: >-
    Octane（Octane Lending, Inc.）是一家总部位于纽约的金融科技公司，Jason Guss 及其团队于 2014 年创办。公司通过内部贷款机构 Roadrunner
    Financial，为动力运动、休闲车、船艇、拖车和户外动力设备市场提供即时数字融资。平台借助专有承保技术，把 4,000 多家活跃经销商、50 家 OEM 合作伙伴与消费者连接起来，并给出近乎即时的信贷决策。2025
    年，Octane 放款 $2.1 billion，将 91% 出售至多元化资本市场项目，并在约 $400 million 收入基础上连续第三年实现 GAAP 净利润盈利。2025 年 12 月 Series F 融资后估值为
    $1.3 billion。
