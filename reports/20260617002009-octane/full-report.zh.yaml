      - number: '8.4'
        title: 情景分析
        blocks:
          - type: paragraph
            body: >-
              这里做情景分析比假装精确更有信息量。熊市情形假设，周期性 powersports 需求、走弱的消费信用和收紧的资产支持融资叠加，使投资者把 Octane 承保为吞吐不稳定的细分贷款方，而不是 premium
              fintech 平台。在这种世界里，区间压缩到约 $600-900 million。基准情形把估值维持在约 $1.1-1.5 billion，大致与 Series F
              一致，因为发起量继续增长，forward-flow 和 ABS 渠道保持开放，且没有公开信用压力证据出现。牛市情形只有在 Octane 能证明可重复盈利、打开收入可见度，并展示平台有空间延伸到当前
              powersports 和 RV 集中之外时，才扩展到 $1.8-2.8 billion。今天的概率信号更偏基准而非牛市，因为当前证据集在规模和资本渠道上强得多，在变现质量上弱得多。换句话说，Octane
              已经赢得了被认真估值的资格，但还没有赢得只凭信仰交易的资格。
