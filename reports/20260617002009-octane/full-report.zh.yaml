      - number: '8.5'
        title: 可比公司
        blocks:
          - type: paragraph
            body: >-
              可比分析必要但不完美，因为没有上市公司同时具备 Octane 这套 specialty-vehicle finance、经销商工作流软件和结构化资本执行的精确组合。LendingClub 和 Upstart
              是公开市场纪律最有用的参照，因为二者披露收入，并运行 lending-adjacent 模型，但它们在产品组合、监管姿态和承保范围上差异很大。Affirm 和 SoFi
              是规模大得多的消费金融平台，其市值主要展示了规模化、多元化 fintech 的上行空间，而不是 Octane 现实的近期同业标记。Sheffield Financial
              具有战略相关性，因为它在同一终端市场竞争，但私有权属消除了公开估值透明度。因此，正确教训不是 Octane 应该精确按某个 comp multiple
              交易。教训是，公开投资者奖励收入可见度、资产负债表清晰度和产品宽度——也会折价不透明。Octane 最新私募价格在这个框架内仍可成立，但缺少直接 specialty powersports
              comps，意味着投资者应把可比公司当护栏，而不是机械标记。
