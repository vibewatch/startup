  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式
        blocks:
          - type: paragraph
            body: >-
              Octane 的收入模式至少运行在三个不同但重叠的渠道上。第一，也是最基础的一项，是净利息收入：内部贷款机构 Roadrunner Financial
              发放固定利率分期贷款，赚取向借款人收取的利率与资金成本（仓储额度、ABS 募资或远期流量定价）之间的利差。第二，当 Octane 向 Yieldstreet 和 Bayview
              等机构投资者出售整贷池时，可确认出售收益，即贷款池面值以上的溢价；自 2023 年 12 月以来，Octane 已通过该渠道出售或承诺 $3.7 billion。第三，在 ABS 交易中，Octane
              通常保留剩余权益或次级权益，同时向投资者出售优先档；债券收益率与贷款收益率之间的执行利差产生收入。第四个可能来源，是 Dealer Portal、Prequal 和 Prequal Flex
              等工具的软件或平台费收入，这些工具各自部署在 1,200 多家经销商；但 Octane 未公开确认这些工具是否单独收取订阅费，还是打包进贷款机构经济。第五，Roadrunner Account Services
              对不断增长的已售贷款管理组合收取服务费，这是一项随表外账簿规模扩张而增长的经常性收入。2024 年年度更新提到收入增长 46%、毛利率 41%；Upper90 也称 Octane
              增长迅速且盈利。不过，这些仍是公司表述，缺少独立审计确认。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
