      - number: '8.3'
        title: 定价语境
        blocks:
          - type: paragraph
            body: >-
              定价语境先从一个事实开始：Octane 最新标记是 2025 年 12 月设定的私募轮价格，不是持续 mark 的公开市场价格。Series F 给出了当前锚点，但投资者仍需判断该锚点到 2026
              年中是否仍有效。认真看待该价格的最佳理由是，它跟在真实规模里程碑之后：2024 年发起量、超过 $5 billion 的累计发起量、重复 ABS 执行和多笔 forward-flow
              交易。这些数据点意味着估值并非只靠 fintech 主题热度支撑。挑战在于入场纪律。没有公开收入、当前盈利或 static-pool 信用数据，投资者无法把 $1.3 billion
              标记转成干净的倍数框架，也无法评估优先权和稀释悬顶是否让普通股等价价值实质更低。因此，本章把该轮价格视为基准情形参考点，而不是便宜的证明。实务上，如果管理层私下证明经济性，该价格可以称为公允；但如果缺失披露仍未解决，价格会显得偏紧。
