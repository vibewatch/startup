  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义、边界与替代品
        blocks:
          - type: paragraph
            body: >
              Octane
              服务的市场，是美国零售销售点（POS）分期融资，绑定休闲和动力运动车辆购买。边界内包括动力运动（摩托车、ATV、side-by-side、个人水上摩托）、RV、船艇、拖车和户外动力设备的消费信贷，以及 2025
              年面向经销商集团切入自有汽车金融。边界外则是经销商 floorplan / 库存融资、F&I 保险和延保产品、租赁、以及主流优质汽车贷款；这些不是 Octane
              的主要目标。真正重要的邻近业务是动力运动保险、保障产品和经销商软件，因为它们共享同一经销商关系，并可能变成附加收入。最重要的战略事实是，Octane 的真正竞争对手是现状：制造商自有金融机构（如 Honda
              Financial Services 和 Yamaha Motor Finance）、发放直接贷款的银行和信用合作社、Synchrony 动力运动信用卡等通用融资产品、LightStream
              等个人贷款机构，以及现金支付本身。Octane 的切入点，是以软查询优先的数字化经销商体验，在不要求经销商切换多个贷款机构门户的情况下，扩大对优质和非优质借款人的批准覆盖；因此，OEM
              和银行伙伴越来越多把量导给它，而不是自己搭同样的工作流。
