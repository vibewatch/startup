  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 热力图按可能性把 Octane 的具名风险放入低、中、高三列，并用单元格细节区分影响和剩余严重度。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 信用 / 融资风险
          values:
            - null
            - null
            - label: 高影响
              detail: ABS 利差走阔、买方退缩，以及资产负债表短期堆积
              tone: critical
        - label: 监管 / 公平放贷风险
          values:
            - null
            - label: 高影响
              detail: 模型治理或披露薄弱可能引发高成本整改
              tone: risk
            - null
        - label: 进行中诉讼风险
          values:
            - null
            - label: 高影响
              detail: 即使没有已知执法，Gooding 仍让法律敞口保持现实压力
              tone: adverse
            - null
        - label: 服务 / 投诉风险
          values:
            - null
            - null
            - label: 中高影响
              detail: 借款人摩擦可能伤害经销商和 OEM 信任
              tone: warning
        - label: 合作伙伴集中风险
          values:
            - null
            - label: 中高影响
              detail: 最大买方或渠道集中度未公开量化
              tone: warning
            - null
        - label: 披露不透明风险
          values:
            - label: 中等影响
              detail: 缺少公开核销和逾期数据，外部很难判断规模
              tone: medium
            - null
            - null
    claimRefs:
      - CR001
      - CR016
      - CR023
      - CR027
      - CR030
      - CR031
      - CR037
  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: 展示合规、融资和服务问题如何传导到增长、利润率和估值，而不是停留在孤立运营问题上。
    data:
      nodes:
        - label: 监管 / 法律事件
          detail: 诉讼、公平放贷审查或投诉升级
        - label: 服务断裂
          detail: 支付、欺诈或全损工作流失效
        - label: 融资中断
          detail: 远期流转放缓或 ABS 执行变弱
        - label: 发放增长
          detail: 经销商和借款人转化量
        - label: 信用损失 / 利润率
          detail: 逾期、利差和整改之后的经济性
        - label: 合作伙伴信任
          detail: OEM、经销商和银行继续导流的意愿
        - label: 估值
          detail: 股权和退出倍数信心
      edges:
        - from: Regulatory / legal event
          to: Partner trust
          label: 提高尽调负担
        - from: Servicing breakdown
          to: Partner trust
          label: 削弱借款人体验
        - from: Funding disruption
          to: Origination growth
          label: 限制容量
        - from: Origination growth
          to: Credit losses / margin
          label: 改变组合和固定成本杠杆
        - from: Credit losses / margin
          to: Valuation
          label: 压缩经济性
        - from: Partner trust
          to: Origination growth
          label: 影响经销商 / OEM 推荐
    claimRefs:
      - CR003
      - CR010
      - CR017
      - CR023
      - CR028
      - CR030
      - CR038
      - CR040
  - id: FR003
    title: 依赖图
    type: dag
    layout: standard
    summary: 梳理 Octane 软件层、Roadrunner 服务、资金买方和监管边界之间的核心外部依赖。
    data:
      nodes:
        - label: 经销商 / OEM
          detail: 借款人获取和分销入口
        - label: Octane 平台
          detail: 数字化发放、Prequal 和工作流层
        - label: Roadrunner 贷款人 / 服务商
          detail: 发放、借款人支持、催收和特殊情形服务
        - label: 机构贷款买方
          detail: 远期流转和整笔贷款交易对手
        - label: ABS / 评级生态
          detail: 证券化投资者，加上 S&P 和 KBRA 覆盖
        - label: 监管机构 / 法院
          detail: 类 CFPB 合规边界和进行中诉讼
        - label: 终端借款人
          detail: 客户可负担性、满意度和还款行为
      edges:
        - from: Dealers / OEMs
          to: Octane platform
          label: 提供申请人
        - from: Octane platform
          to: Roadrunner lender / servicer
          label: 转化并入账贷款
        - from: Roadrunner lender / servicer
          to: Institutional loan buyers
          label: 生成可出售抵押资产
        - from: Institutional loan buyers
          to: ABS / ratings ecosystem
          label: 影响退出融资和定价
        - from: Regulators / courts
          to: Roadrunner lender / servicer
          label: 设定行为边界
        - from: End borrower
          to: Roadrunner lender / servicer
          label: 驱动还款和投诉
    claimRefs:
      - CR002
      - CR018
      - CR020
      - CR022
      - CR028
      - CR031
      - CR039
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 规模和融资证明足以让 Octane 值得认真看，但披露缺口和周期性信用敞口使建议停留在跟踪，而不是买入。
    data:
      nodes:
        - id: scale
          label: 规模证明：2024 年发放 $1.6B，累计成交量 $5B+
        - id: funding
          label: 融资证明：ABS 加远期流转计划，交易对手不止一家
        - id: strategy
          label: 战略背书：Valar 领投 Series F，参与者与品类相关
        - id: opacity
          label: 不透明惩罚：没有公开 2026 年收入、ARR 或损失曲线披露
        - id: valuation
          label: 估值立场：$1.3B+ 看起来是基准情形下合理，并不明显便宜
        - id: recommendation
          label: 建议：跟踪，并在按标记估值支付前做深度尽调
      edges:
        - from: scale
          to: funding
          label: 吞吐量吸引资本
        - from: funding
          to: strategy
          label: 机构支持强化叙事
        - from: strategy
          to: valuation
          label: 支撑当前估值
        - from: opacity
          to: valuation
          label: 压住倍数信心
        - from: valuation
          to: recommendation
          label: 需要入场纪律
    approximationNotes: 推荐逻辑来自分析师综合判断，不是管理层提供的决策树。
    claimRefs:
      - CV001
      - CV008
      - CV013
      - CV016
      - CV021
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 情景中点和公开市场护栏显示，Octane 已经高于熊市情景，但仍远低于披露信息更多、规模更大的金融科技平台。
    data:
      items:
        - label: 熊市情景中点
          value: 750
          unit: $M valuation
          note: 假设周期下行和融资收缩
        - label: Series F 轮投后底线
          value: 1300
          unit: $M valuation
          note: 公司披露 2025 年 12 月投后估值超过 $1.3B
        - label: 基准情景中点
          value: 1300
          unit: $M valuation
          note: 如果规模守住、且没有出现可见信用压力，估值算合理
        - label: 牛市情景中点
          value: 2200
          unit: $M valuation
          note: 需要利润反复兑现，披露质量也要提升
        - label: LendingClub 公开市值
          value: 2190
          unit: $M valuation
          note: 公开贷款机构护栏，有披露收入和申报记录
        - label: Upstart 公开市值
          value: 3080
          unit: $M valuation
          note: 显示更高天花板，也显示情绪敏感性
    approximationNotes: 公开市值参考点是 2026 年 6 月快照，未按资本结构差异调整。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 基准情景估值围绕上一轮融资展开；市场缺少透明经营数据，因此下行和上行空间都很宽。
    data:
      items:
        - label: 熊市情景
          low: 600
          mid: 750
          high: 900
          unit: $M
          note: 融资压力叠加周期性需求和不透明信用表现
        - label: 基准情景
          low: 1100
          mid: 1300
          high: 1500
          unit: $M
          note: 如果当前规模和融资韧性延续，Series F 轮大体仍算合理
        - label: 牛市情景
          low: 1800
          mid: 2200
          high: 2800
          unit: $M
          note: 需要收入可见、利润反复兑现，并把平台拓出当前细分赛道
    approximationNotes: 区间反映情景判断，不是公司指引；应理解为普通股等价企业价值区间，仍需审查优先权结构。
    claimRefs:
      - CV022
      - CV023
      - CV024
      - CV033
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 按 IC 口径打分，Octane 在验证度和资本获取上占优；但证据质量和不透明度会拉低评分。
    data:
      items:
        - label: 市场机会
          value: 7/10
          note: 休闲消费金融是大细分市场，但不是大众市场的通用贷款机构
        - label: 规模验证
          value: 8/10
          note: 2024 年放款 $1.6B、累计放款超过 $5B，有实质分量
        - label: 分销 / 护城河
          value: 7/10
          note: 经销商、OEM 和战略伙伴关系重要，但披露不充分
        - label: 融资引擎
          value: 8/10
          note: ABS 和多条 forward-flow 渠道显示资本可反复拼出
        - label: 经济性可见度
          value: 3/10
          note: 没有公开 2026 年收入、ARR、利润率或损失曲线细节
        - label: 风险画像
          value: 4/10
          note: 周期性品类叠加信用市场依赖，残余风险仍高
        - label: 估值吸引力
          value: 5/10
          note: 基准情景算合理，但不够便宜，无法抵消披露缺口
    approximationNotes: 分数是分析师基于十分制的判断，只使用本章可获得的公开证据。
    claimRefs:
      - CV015
      - CV016
      - CV017
      - CV020
      - CV021
