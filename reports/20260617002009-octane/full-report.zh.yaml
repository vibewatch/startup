      - number: '3.5'
        title: 护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              Octane 的竞争护城河建立在四个相互强化但并不完全重叠的元素上。第一，ABS 资本市场项目（自 2019 年以来 16 笔交易、合计 $4.7
              billion+）提供了多数竞争对手无法独立接近的放款容量上限；Sheffield 和 Synchrony 依赖银行资产负债表融资，而非公开 ABS
              市场。第二，贷款机构经济与经销商软件的组合产生数据网络效应：已放款量越多，承保模型随时间越能改善，软件使用越多也越黏。第三，多 OEM 合作组合提高了任何单一 OEM 整体替换 Octane
              的成本，因为平台现在服务多个互补品牌，合计经销商触达超过任何单个自有金融机构。第四，2025 年推出的 Captive-as-a-Service 产品构成新的竞争向量，可能把 Octane
              的私有品牌模式延伸到汽车经销商集团和更多休闲品类。护城河耐久性的风险包括：OEM
              伙伴可能加深自有金融项目，大型银行系竞争对手投资非优质信用工具，以及若第三方贷款发起系统供应商加入类似嵌入式贷款机构路由，经销商软件集成优势可能被侵蚀。
