      - number: '7.5'
        title: 财务模型
        blocks:
          - type: paragraph
            body: >-
              财务模型风险在于，Octane 把贷款方经济性与资本市场依赖叠加在一个周期性、可选消费品类上，同时公开披露太少，外部投资者无法完整测算下行。Federal Reserve
              政策有双重影响：它改变借款人的月供承受力，也改变结构化融资定价。市场强劲时，Octane
              可以受益于快速数字发起、机构买方需求和轻表内销售模型。市场承压时，同一架构可能反向运转。需求放慢与贷款表现恶化可能和利差扩大或执行变慢同时出现，让更多贷款暂时留在表内，并提高仓储额度和流动性缓冲的重要性。Auto
              Finance News 显示管理层意识到这一点，并以九个月缓冲为目标，这是建设性的。问题在于不透明。公开材料支持 ABS
              发行、评级覆盖、资金承诺和历史盈利里程碑的存在，但没有给出核销曲线、逾期趋势、队列回收，或足够收入细节，无法判断模型穿越完整周期后是否仍有吸引力。这意味着 Octane
              的核心财务风险不只是杠杆或烧钱；而是外部条件收紧时，信用表现和 gain-on-sale 经济性能否保持韧性。
