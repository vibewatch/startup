      - number: '4.5'
        title: 资本充足性与融资结构
        blocks:
          - type: paragraph
            body: >-
              Octane 的资本栈组合了股权、仓储信贷额度、ABS 债务和表外远期流量承诺。股权端，2025 年 12 月 Series F 融资 $100 million，融资后估值 $1.3 billion，此前
              2024 年 8 月完成 $50 million Series E。成立以来累计股权融资 $342 million（Series F 前为 $242 million）。ABS 项目自 2019 年 12
              月以来已完成 16 笔交易，合计 $4.7 billion+，提供中期担保融资。表外容量方面，截至 2026 年 6 月 Bayview 交易，Octane 自 2023 年 12 月以来已有 $3.7
              billion 整贷出售和远期流量承诺；其中包括 AB CarVal $500 million 远期流量（2024 年 9 月）、Moore Capital $300 million（2025 年 8
              月）、Nuveen $350 million 远期流量（2026 年 5 月）外加 $150 million 整贷出售，以及 Yieldstreet 累计 $480 million 整贷出售。Nuveen
              交易披露，截至 2026 年 5 月，总远期流量承诺超过 $2.2 billion。资本来源多元化是重要优势；2026 年 Bayview 整贷出售（2026 年 6 月 16 日）是第六笔整贷交易，也是首次与
              Bayview 合作，说明投资者基础仍在扩张。仓储信贷额度条款、借款容量和 covenant 细节没有公开披露。烧钱速度和现金跑道属于私人公司信息，无法获得。
