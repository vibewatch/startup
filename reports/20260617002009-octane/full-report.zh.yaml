      - number: '8.6'
        title: 退出尽调问题
        blocks:
          - type: paragraph
            body: >-
              退出问题的重点不是 Octane 是否终有一天能 IPO，而是哪些条件必须成立，这条路径才值得承保。公开上市故事要求 Octane 展示的不止是发起增长。它需要可信的经审计披露，覆盖收入、take
              rate、盈利质量、static-pool 信用表现，以及价值中归因于软件或工作流经济性、而非资产负债表利差捕获的部分。如果这些数据迟迟不出现，战略退出会比近期 IPO
              更可信。潜在买方可能包括银行、经销商生态、保险公司或消费金融平台，它们会看重 Octane
              的经销商分发和承保基础设施。无论退出路径如何，尽调都应聚焦那些能打破论点的具体事项：隐藏优先权悬顶、弱于隐含水平的信用表现、资本市场依赖，以及可选消费车辆的周期性下行。这些不是抽象担忧。它们最可能决定
              Series F 是一个复利平台的公允标记，还是周期高点附近设定的偏贵标记。
