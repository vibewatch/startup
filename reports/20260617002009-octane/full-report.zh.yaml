      - number: '3.2'
        title: 同业画像
        blocks:
          - type: paragraph
            body: >-
              Sheffield Financial 是 Truist Bank 旗下部门，30 多年来为户外动力设备、动力运动、船艇、高尔夫球车和拖车提供消费融资。Truist Bank 背书带来资产负债表能力，超过任何单一
              fintech，但 Sheffield 没有独立 ABS 项目，服务非优质客户的广度不及 Octane，也未宣布大型 OEM 联名协议。Synchrony Financial
              提供有担保分期贷款（动力运动和拖车最长 84 个月、船艇最长 180 个月），并提供 Outdoors Credit Card；文件显示，对超过 $5,000 的贷款给经销商 2% 返利。Synchrony
              平台资本充足、铺设广泛，但没有提供全谱系非优质信用覆盖。Harley-Davidson Financial Services（HDFS）是 NYSE 上市公司 Harley-Davidson Inc.
              的子公司，作为 Harley-Davidson 经销商网络的自有贷款机构，能提供制造商补贴的促销利率，独立平台无法复制。Yamaha Motor Finance 和 BRP Finance
              代表类似品牌自有模式，消费者忠诚度强，但抵押品范围狭窄，仅限各自制造商品牌。GreenState 和 Georgia's Own Credit Union
              等区域信用合作社提供有竞争力的休闲车贷款利率，但缺少经销商工作流软件或多 OEM 项目基础设施。
