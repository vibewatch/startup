      - number: '8.2'
        title: 推荐置信度
        blocks:
          - type: paragraph
            body: >-
              仅凭公开证据，正确建议不是激进买入，而是保持纪律性的跟踪姿态；只有在私有尽调关闭最大漏洞后，才愿意加大投入。Octane
              有足够证明点支撑严肃研究：最近一轮融资不是种子阶段宣传轮，业务已处理数十亿美元发起量，资金交易对手看起来也足够宽。与此同时，公开收入、利润率、信用和 cap table
              披露缺失，使人很难论证最新价格嵌入了清晰安全边际。这种张力导向中等置信度，而不是高置信度。置信度不低，是因为披露的运营和资本市场信号太实质，不能忽视；置信度不高，是因为关键承保变量仍无法在 data room
              之外验证。因此风险应被视为高，不是因为失败是基准情形，而是一旦信用表现或可选消费需求走弱，负面结果可能快速穿过资金能力、发起增长和估值。
