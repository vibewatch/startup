      - number: '4.4'
        title: 牵引力与财务不透明
        blocks:
          - type: paragraph
            body: >-
              Octane 的公开牵引力指标强劲，但未经审计。2024 年年度更新披露放款 $1.6 billion（同比增长 36%）、收入增长 46%、毛利率 41%。截至 2025 年 12 月 Series F
              公告，成立以来累计放款超过 $7 billion。RV 放款在 2024 年连续第二年翻倍，ABS 项目在 2024 年四笔交易中吸引超过 100
              家机构投资者。这些都是有意义的规模信号。同时，透明度缺口显著：没有经审计财务报表，没有核销或逾期披露，没有按收入流拆分的数据，没有资本成本或仓储额度条款，也没有无需机构投资者凭证即可访问的队列级贷款表现数据。单笔
              ABS 交易的 KBRA 和 S&P 评级报告含有表现数据，但需要付费或机构权限。确认 ABS Deal of the Year 奖项的 GlobalCapital 文章在研究时受访问限制。CFPB
              消费者投诉数据库在易访问的公开搜索中没有显示可明确归因于 Roadrunner Financial 或 Octane Lending 的投诉（Octane
              主要通过经销商渠道服务优质和近优质客户，这可能限制投诉量）。结果是：公开叙事正面，但独立财务验证有限。
