      - CV032
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Exhaustive within the public lender and niche specialty-finance references explicitly used to anchor Octane
        valuation in this chapter as of 2026-06-17.
  - id: TV005
    title: 论点破裂与否决触发项
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 信用表现不及预期
        - 2026 年逾期或核销数据明显差于管理层计划
        - 股权价值和 ABS / forward-flow 执行信心都会被削弱
        - 除非价格大幅下调，否则从跟踪转为规避
      - - 融资市场堵塞
        - 仓储融资、ABS 或 forward-flow 容量连续多个季度停滞
        - 放款吞吐量下降，估值被压向熊市情形
        - 融资韧性恢复前暂停承销
      - - 品类放缓
        - 经销商需求或可选车辆销售在周期中急剧收缩
        - 增长叙事受损，也检验 Octane 是否配得上相对贷款机构可比公司的溢价
        - 需求韧性被证明前，按熊市价值处理
    notes: 这些触发点是投资人定义的监测项，锚定 Octane 估值可能失效的主要路径，不是管理层指引。
    claimRefs:
      - CV018
      - CV034
      - CV039
  - id: TV006
    title: 最终尽调问题
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 2026 年收入和盈利质量
        - 经审计收入、毛利率、take rate，以及当前盈利能力桥接
        - 缺少这些材料，最新估值无法锚定到透明的利润或收入框架
        - 向 CFO 索取资料包和经审计管理账
      - - 信用表现披露
        - 主要品类的静态池损失曲线、逾期、回收和 vintage 表现
        - 对类贷款机构业务承销下行情形时，这是最关键的缺失输入
        - 索取信用备忘录、ABS 尽调材料和服务仪表盘
      - - 股权结构和优先权栈
        - 清算优先权、ratchet、认股权证、side letter 和期权池细节
        - 普通股等值价值可能与名义 post-money 估值相差很大
        - 审阅法律数据室和董事会批准的融资文件
      - - 分部经济性和平台组合
        - 贷款利差、费用和任何类软件工作流变现之间的收入拆分
        - 用来判断 Octane 只应套用贷款机构护栏，还是可获得部分平台溢价
        - 索取管理层报告和客户 cohort 经济性
    notes: 这些问题是最低材料包；拿到后，才能把证据有限的跟踪判断推进到真正的承销决策。
    claimRefs:
      - CV016
      - CV017
      - CV033
      - CV038
      - CV040
