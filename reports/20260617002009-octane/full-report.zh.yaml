      - number: '6.3'
        blocks:
          - type: paragraph
            body: >-
              公开记录中最强的客户证明，是 2024 年 10 月 RideNow Finance 私有品牌合作。RideNow 是 RumbleOn 公司（NASDAQ: RMBL）旗下业务，是美国最大的
              powersports 经销商集团，拥有 56 家门店和超过 18,000 辆新车及二手车库存。该合作让 RideNow 的 56 家零售门店以 RideNow Finance 名义获得 Octane
              驱动的品牌化融资，包括数字工具、全谱系融资和品牌化生命周期营销。公司称，这是近 $30 billion powersports 市场中唯一面向经销商集团的私有品牌融资安排。RumbleOn CEO Mike
              Kennedy 表示，通过 RideNow Finance 简化融资流程，是公司把购买体验提升到下一层级的方式。RideNow 之外，官方新闻稿中的经销商证言提供了次级客户证明。Virginia 的 All
              Out Cycles 财务经理 Tammy Coleman 表示，Dealer Portal 2.0 每笔交易可节省十五到二十分钟。San Diego 的 Onyx Moto 经销商负责人 Kenny Chen
              称 Prequal Flex 分享起来毫不费力，并表示软查方式能确保客户感到轻松。这些证言由公司发布，未经独立验证，但确实是具名、生产场景下的客户引述。2022 年里程碑新闻稿指出，Octane
              单经销商发起量同比增长 37%，每月放款超过十笔的经销商数量增长 50%，这说明经销商参与在加深，而不只是覆盖面扩张。公开缺口包括经销商 NPS、队列流失率、OEM
              合同续约证据，以及轶事证言之外面向客户的满意度指标。
