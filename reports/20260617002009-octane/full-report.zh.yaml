      - number: '2.4'
        title: 增长驱动、采用约束与规模缺口
        blocks:
          - type: paragraph
            body: >
              多个结构性驱动有利于 Octane。动力运动、RV、船艇和 OPE 零售高度依赖经销商中介，历史上又缺少数字 POS 信贷服务，因此软查询、多垂直平台切中了真实工作流缺口。OEM
              和银行伙伴（Kawasaki、Honda、Suzuki、CFMOTO、Husqvarna、Bad Boy、Ariens/Gravely、Huntington
              Bank）越来越倾向于接入融资平台，而不是自建平台，这会放大分销。新类别——通过 Ubco 切入电动两轮车、通过 Captive-as-a-Service
              切入自有汽车——延长了跑道。约束也真实存在。业务在贷款层面资本密集，并依赖持续的远期流量和证券化需求，因此信贷市场收缩会直接扼住放款。休闲消费具有可选属性，且对利率敏感，成交量带有周期性。既有自有金融机构和银行拥有深厚经销商关系及资产负债表，抬高了
              OEM 侧切换成本。最后，消费贷款监管与服务审查（同样体现在 Roadrunner Financial 相关服务投诉中）构成采用和声誉约束。最大的分析缺口仍是规模本身：审阅来源没有独立 TAM/SAM
              估算或可对账的第三方市场数据，因此任何精确市场数字都带有猜测性，本文将其保留为尽调缺口。
