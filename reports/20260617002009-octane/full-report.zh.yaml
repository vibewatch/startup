        title: 分销力量与锁定
        blocks:
          - type: paragraph
            body: >-
              Octane 的分销优势建立在 OEM 合作上，包括 Polaris（2022 年 1 月）、BRP（2021 年 11 月）、Kawasaki（2024 年 1 月，全谱系）、CFMOTO（2024 年 12
              月）、Honda、Suzuki 以及数十个其他品牌。OEM 关系为融资工作流背书，并把促销融资与车辆购买决策对齐，从而加速经销商采用。RideNow Finance 私有品牌项目于 2024 年 10 月在
              RideNow 的 56 家门店上线；Octane 称其为近 $30 billion 动力运动市场中唯一面向经销商集团的私有品牌融资。经销商工作流锁定具有实际意义，因为从嵌入式平台迁出，需要重新培训 F&I
              员工、迁移工作流并重谈贷款机构关系。同时，OEM 协议明确非排他，意味着自有金融项目和其他贷款机构可在同一经销商场地共存。Kawasaki 协议（2024 年 1 月）把 Octane 扩展至 Kawasaki
              1,000 多家美国经销商网络的全谱系信贷，是 OEM 合作如何显著扩大分销的具体案例；它也说明这类合作需要持续经营，而非永久排他。
