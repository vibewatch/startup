      - number: '5.6'
        title: 附录
        blocks:
          - type: callout
            title: 软查信用、经销商工作流与媒体飞轮整合，构成真实架构护城河
            body: >-
              Octane 把免费软查工具（Prequal/Prequal
              Flex/SafeCheck）嵌入面向经销商的门户；该门户还汇总来自七个编辑资产的已预授信线索，形成分发与数据回路，纯贷款方和独立软件供应商都难以轻易复制。2024 年通过软查工具送出的 400,000
              份申请，以及每个工具 1,200 多家经销商采用，验证了这套架构产生的是真实吞吐，而不只是营销叙事。
