      - number: '7.2'
        title: 监管与法律
        blocks:
          - type: paragraph
            body: >-
              Octane 的法律和监管暴露应透过 Roadrunner 来看，因为公司不只是给经销商提供前端软件。贷款方和服务表面把 Octane
              放进常规消费金融合规边界：借款人披露、不利行动、支付处理、催收、军人借款人待遇和投诉解决都很关键。CFPB auto-loan 材料没有指控 Octane
              有不当行为，但它们定义了任何数字贷款方运行时所处的消费者保护框架。Roadrunner 自己的 SCRA、身份盗用和全损页面是有帮助的控制信号，但也点明了合规失败可能造成客户伤害或法律索赔的具体工作流。在审
              Gooding 对抗程序提高了整个类别的重要性，因为它把抽象法律风险变成了当前尽调项目。公平贷款是另一个主要问题。Octane 营销速度和自动化，Prequal
              体验缩短了从问询到信贷决策的路径。这可以是分发优势，但也让 ECOA
              式模型治理、不利行动逻辑、例外处理和差异影响测试成为董事会层面的核心议题。州许可、执法历史和详细投诉解决统计在公开材料中仍很薄，因此监管成熟度还不能被视为尽调已经完全关闭。
