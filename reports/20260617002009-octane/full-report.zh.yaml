      - number: '1.4'
        title: 里程碑、牵引力与负面信号
        blocks:
          - type: paragraph
            body: >
              里程碑曲线有实质内容，时间也清楚。从 2014 年创立并切入动力运动开始，Octane 2021 年新增 RV，2022 年新增船艇和拖车，2022–2023 年推进户外动力设备，2025 年进入汽车 /
              自有金融；同时持续建立 OEM 和经销商合作（Kawasaki、Honda、Suzuki、CFMOTO、Husqvarna、Bad Boy、Ariens/Gravely、RideNow、Adventure
              Lifestyle、Camping World/Good Sam）。牵引力方面，Octane 披露 2025 年放款约 $2.1B，同比增长 29%；截至 2026 年 3 月累计放款约 $7.6B；2025
              年出售贷款约 $1.9B（约占放款额 91%）；总收入约 $400M；调整后 EBITDA 为 $80M、增长 23%；过去三年每年均实现 GAAP 净利润。外部认可也较广，2025 年获得十五项奖项，包括
              FICO Decisions Award，并多次入选 Deloitte Technology Fast 500 和 Built In Best Places to
              Work。相对地，负面档案真实但边界清楚：Roadrunner Financial 在 BBB 和 Trustpilot 上有关于客服摩擦和付款处理延误的投诉；PACER 上有一宗案件（Gooding v.
              Octane Lending/Roadrunner Financial）；审阅记录中未发现 CFPB 执法行动；公司的信用损失和详细单位经济仍未披露。坦率看，Octane
              增长强劲且盈利，但服务和披露问题仍需尽调定量。
