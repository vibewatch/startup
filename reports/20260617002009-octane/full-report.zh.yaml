        title: 负面证据与替代风险
        blocks:
          - type: paragraph
            body: >-
              多个信号限制了对 Octane 护城河耐久性的信心。第一，OEM 合作协议非排他，Kawasaki 和 CFMOTO 等品牌可以扩大与其他贷款机构的关系；Kawasaki 在 2024
              年前的融资运营也显示，Octane 全谱系合作之前就存在自有替代方案。第二，OEM 自有金融项目（HDFS、Yamaha、BRP）可以提供制造商补贴的促销利率，Octane
              的独立贷款模式在结构上无法复制；高度依赖促销融资的经销商有理由多栖。第三，Sheffield Financial 30 多年的经销商关系和 Truist Bank
              的大型资产负债表，是很难单靠软件质量撬动的在位优势。第四，Synchrony 已服务相邻经销商板块（户外动力设备、船艇），若有战略动机，可能加深非优质能力。第五，一宗联邦诉讼（Gooding v. Octane
              Lending and Roadrunner
              Financial）已公开立案，构成公开来源无法完全解释的负面法律信号。第六，公司未公开披露核销率或逾期数据，意味着公开来源无法充分评估信用质量这一负面信号。私人尽调必须覆盖 OEM
              协议排他性、经销商流失率、信用表现以及 incumbents 的竞争反应。
