      - number: '3.3'
        title: 能力与定价对比
        blocks:
          - type: paragraph
            body: >-
              Octane 最显眼的能力优势，是通过 Roadrunner Financial 提供全信用谱系信贷，并配套 OctaneOS、Dealer Portal 2.0、Prequal 和 Prequal Flex
              软查询预资格工具等专有经销商软件。截至 2025 年初，Prequal 已部署在 1,200 多家经销商，Prequal Flex 部署也超过 1,200 家经销商，合计产生近 400,000
              份推荐申请。尚未看到竞争对手拥有等价的软查询预资格产品，并嵌入到可比规模的经销商网络。Octane 不公开经销商费用或利差经济。Synchrony 披露对合格贷款最高给经销商 2% 返利；Octane 的
              Octane Preferred B2B 忠诚计划提供额外经济激励，但层级结构未披露。OEM 自有金融项目可以提供制造商补贴的促销 APR，Octane
              的独立模式在结构上无法匹配。信用合作社能为优质会员提供有竞争力的利率，但无法满足经销商对嵌入式融资工作流的需求。LightStream
              和类似直面消费者的数字贷款机构无需经销商入驻，因此是借款人的替代品，却不是经销商 B2B 经济的替代品。
