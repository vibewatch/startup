      - number: '4.2'
        title: 定价与变现
        blocks:
          - type: paragraph
            body: >-
              Octane 不公开利率表、经销商费用结构或平台定价。可观察代理指标包括：（1）公司提供全谱系信用（从优质到非优质），意味着 APR 区间通常对非优质借款人更高，对优质借款人则与银行利率竞争；（2）Octane
              Preferred B2B 忠诚计划向经销商提供经济激励，但具体返利结构未公布；（3）远期流量和整贷出售价格由机构对手方双边谈判，已实现出售收益率未披露。2025 年 12 月 Series F 新闻稿特别提到
              Upper90 称 Octane 增长迅速且盈利，暗示单位经济为正，但这仍是投资者引述的说法，而非审计结果。唯一公开可观察的定价信息，是 Synchrony 具有竞争力的 2% 经销商返利描述，这为 Octane
              可能需要提供的条件提供了间接基准。资本市场端，2024 年 OCTL 2024-3 ABS 交易实现的信用利差显著低于初始指引，说明该时期机构需求强劲，执行经济可能好于预期。2025 年 OCTL
              2025-RVM1 是第二个 RV / 船艇 ABS 货架，并赢得 GlobalCapital ABS Deal of the Year 2025，说明随着项目成熟，信用利差仍在改善。
