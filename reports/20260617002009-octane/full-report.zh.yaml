      - number: '5.4'
        title: Octane Media 飞轮与广告变现
        blocks:
          - type: paragraph
            body: >-
              Octane Media 是一组 powersports 和 motorsports 编辑品牌组合，Octane 于 2020 年从 Bonnier Corp 收购了七个品牌：Cycle World、UTV
              Driver、Dirt Rider、ATV Rider、Motorcyclist、Cruiser 和 Cycle Volta。这些媒体资产在 Octane 的运营模型里承担双重功能。作为消费者获客漏斗，它们把
              Octane Prequal 预审批组件直接嵌在编辑内容旁边，在买家到店之前就把高意向人群导入 Roadrunner Financial 融资管线。作为广告业务，Octane 于 2023 年 5 月向
              OEM、大型经销商集团和保险公司推出付费广告——这是 Bonnier 收购后这些资产首次向外部广告主变现。上线时披露的公开受众数据是：35 岁以下 Octane Media 读者中，70%
              至少拥有一辆摩托车，69% 所在家庭拥有三辆摩托车，43% 计划在两年内购买摩托车。评测、对比和测试页面的平均会话时长超过 16 分钟。邮件 newsletter 的打开率和点击率据称分别高出行业基准 80% 和
              265%。在 Dealer Portal 2.0 中，Leads Page 明确汇总来自 Octane Media 资产、Prequal 和 OEM
              合作渠道的预审批买家，使媒体资产成为经销商工作流层的直接输入。内容、预审批和经销商工作流被整合在同一套技术栈里，这是 Octane
              产品模型相对纯贷款方或纯软件供应商最突出的架构特征。公开证据缺口包括媒体资产流量、广告收入占总收入比例，以及广告主续约率或 CPM 基准。
            claimRefs:
              - CE019
              - CE020
              - CE021
              - CE022
              - CE023
      - number: '5.5'
        title: Roadrunner Financial 服务、合规架构与信任姿态
        blocks:
          - type: paragraph
            body: >-
              Roadrunner Financial, Inc.（NMLS ID 1525116）是 Octane 的内部贷款方，也是所有 Dealer Portal 交易的发起实体。Roadrunner Account
              Services（NMLS ID 1758660）是全资子公司，承担内部贷款服务。两家实体的 NMLS 注册确认了联邦消费金融许可，也划定了 Octane 信贷产品运行的监管边界。贷款承保使用 Experian
              FICO 分数；roadrunnerfinancial.com 面向消费者的披露体现了符合 FCRA 的软查 / 硬查顺序：预审批阶段软查（不影响信用），合同生成前硬查。服务 FAQ
              记录了关键借款人权利安排，包括提前还款无罚金、正式困难延期申请流程、军人借款人的 SCRA
              保护，以及全损保险理赔流程。这些披露说明服务层已经较成熟，并按消费信贷监管标准搭建，而不是轻量接入的银行伙伴。Octane 公开承认与 FairPlay 建立关系；FairPlay 被描述为全球首个
              Fairness-as-a-Service 解决方案，用于对其信贷模型做算法公平性测试，以符合包括 ECOA 在内的公平贷款法律。这是有意义的技术信号：它确认 Octane
              在自有承保模型之外使用外部、量化验证层，测试受保护类别维度上的偏差。资本市场侧，Octane 的 ABS 计划对贷款池质量提供了间接验证——OCTL 2023-2 交易因投资者需求强劲，从 $300
              million 扩大到 $400 million 后，获得 S&P 和 KBRA 的 AAA/AAA 优先评级。2024 年完成四笔 ABS 交易，累计 ABS 发行额超过 $4
              billion。公开记录里的主要信任与安全缺口，是披露材料中没有 SOC 2 Type II、ISO 27001 或同类认证，也没有 Dealer Portal 或消费者申请基础设施的状态页或公开 uptime
              SLA。
