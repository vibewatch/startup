      - number: '2.2'
        title: 在证据约束下测算市场规模
        blocks:
          - type: paragraph
            body: >
              审阅来源中没有独立的休闲车 POS 融资 TAM 或 SAM 估算，因此本节不用单一标题数字，而是用分层、受证据约束的视角测算机会。最干净的量化锚点是已服务市场（SOM）：Octane 2025 年放款约
              $2.1B，并称截至 2026 年 3 月累计放款约 $7.6B，因此当前年度已服务量处于低个位数十亿美元。可服务市场（SAM）更适合用触达而非金额近似——50 家 OEM 关系、横跨六个垂直领域的 4,000+
              活跃经销商——这意味着随着渗透率加深，Octane 可融资的经销商绑定购买池要大得多。总可寻址市场（TAM）则是美国所有通过信贷购买的休闲、动力运动和合格自有汽车交易；OEM
              广度（Kawasaki、Honda、Suzuki、CFMOTO、Husqvarna、Bad Boy、Ariens/Gravely）以及多个银行和自有金融 incumbents
              指向一个每年数百亿美元级市场，但审阅记录无法锁定精确数字，因此 TAM 保留为方向性缺口。坦率看，Octane 的已服务量证据充分；它最终可触达的市场真实存在，但公开数据只能给出松散边界。
