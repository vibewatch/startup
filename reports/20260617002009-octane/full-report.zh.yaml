      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >
              这个市场有四类清晰主体，预算和采用触发点各不相同。零售消费者是最终付款方，并按信用层级显著分化：优质借款人看重速度和软查询体验；近优质和非优质借款人则看重 Octane 的承保覆盖广度，这也是 Honda 等
              OEM 合作伙伴明确选择 Octane 触达非优质客户的原因。经销商和商户掌握销售点时刻；他们的预算本质上是销售流失和 F&I 摩擦成本，采用 Octane
              是为了转化更多消费者，并降低多贷款机构路由的运营负担。第三类买方是 OEM 和经销商集团：它们控制品牌层面的融资策略，采用 Octane（常通过 Captive-as-a-Service 或 Huntington
              牵头的 OPE 项目等银行合作）来搭建品牌化或自有贷款能力，而不用自建资产负债表。第四类是资本伙伴，接近需求侧，因为它们对远期流量和证券化资产的胃口决定 Octane 能发起多少贷款。采用路径是 OEM
              或经销商启用 → 销售点软查询预资格评估 → 通过 Roadrunner Financial 申请与承保 → 放款 → 贷款出售；因此，分销合作而非直接消费者营销，是主要增长杠杆。
