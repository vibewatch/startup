      - number: '7.6'
        title: 缓释因素
        blocks:
          - type: paragraph
            body: >-
              Octane 并非毫无缓释。公开可见最强的缓释因素包括：已经跑通的 ABS 计划、多个具名 forward-flow 买方、最近的股权融资、正式 CRO
              任命，以及围绕欺诈、军人借款人和全损事件的可见借款人支持流程。这些信号说明公司已经更像一家机构化专业贷款方，而不是治理轻薄的 fintech 实验。但最重要的缓释因素恰恰需要私下验证。投资者应索取按
              vintage 划分的近期逾期和核销曲线、仓储契约、按买方和 facility 划分的投资者集中度、公平贷款测试结果、投诉解决指标，以及关于 Gooding
              案件的法律备忘录。如果这些材料显示抵押品表现稳定、买方需求多元、服务控制良好，Octane 的风险大概率可以纳入 growth-finance thesis
              管理。如果材料显示早期逾期上升、买方后撤、投诉补救差，或模型治理证据弱，风险栈会很快从可管理变成 thesis-breaking。换句话说，Octane
              似乎有真实机制吸收普通波动，但公司公开披露仍不足以证明其能扛住更尖锐的资金或信用冲击。因此，在任何投资者依赖当前头条增长叙事之前，kill criteria 必须写清楚。
