      - number: '1.2'
        title: 领导层、治理与关键人依赖
        blocks:
          - type: paragraph
            body: >
              Octane 的领导班底兼具创始人延续性和 2024–2025 年一波高级管理层补强，指向一次有意为之的规模化升级。联合创始人 Jason Guss
              仍任首席执行官，也是公司在融资和里程碑报道中的公开面孔。2024 年，Octane 任命 Steven Fernald 为首任总裁，任命 Mark Molnar 为首席风险官，联合创始人 Ray Duggins
              转为顾问角色。2025 年，公司任命 Sean Fernandez-Ledon 为首任首席法务官，并将 Jon Vestal 和 Kartik Kothari 提升为执行副总裁。多个「首任」——首任总裁、首任
              CLO——本身就是尽调信号：Octane 正在把法律、风险、运营等职能制度化；早期贷款公司可以靠非正式机制运转，但估值 $1.3B 的受监管贷款机构不行。最关键的个人依赖落在创始人 CEO
              和风险职能上，因为轻资产负债表贷款机构的生死取决于承保纪律，也取决于持续获得远期流量买家和证券化买家的能力，而两者都高度依赖关系。公开记录对董事会构成和投资者治理权披露很少；买方或后期投资人必须先补齐这一主要治理缺口，才能判断控制权和激励是否一致。
