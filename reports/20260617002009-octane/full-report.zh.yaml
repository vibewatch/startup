      - number: '7.3'
        title: 运营
        blocks:
          - type: paragraph
            body: >-
              Octane 的运营风险不太关乎工厂或库存，更关乎承保、服务和借款人支持之间的工作流完整性。因此，公司 2024 年 CRO 从 Ray Duggins 交接给 Mark Molnar
              很有意义：风险团队是少数同时触达信贷政策、投资者信心和监管舒适度的职能之一。平稳交接是可能的，但公开材料尚未显示具名高管之下有深厚继任梯队。服务层带来最具体的运营风险。Roadrunner
              公开记录身份盗用支持、SCRA 处理、全损保险协调和广泛 FAQ 表面，说明服务基础设施真实存在。它也意味着公司暴露在那些一旦流程质量下滑就会引发投诉、合规失误或支付摩擦的边缘场景中。BBB 和
              Trustpilot 证据不能证明系统性失败，但确实显示借款人体验会变成可见的外部信号。快速发起增长会放大问题。一家 2022 年增长 74%、2024 年增长 36%
              的贷款方，必须让欺诈控制、借款人沟通、承保例外和服务人员配置与交易量同步。如果任一层滞后，损失可能同时从信用和声誉渠道冒出来。
