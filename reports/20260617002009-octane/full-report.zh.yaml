  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失指标
      - 重要性
      - 对承保的影响
      - 尽调路径
    rows:
      - - 经审计财务报表
        - 只有经审计数字才能支撑对收入、利润率和资产负债表的独立验证
        - 没有审计师签字，无法确认 46% 收入增长或 41% 毛利率
        - 向管理层索取最新经审计财务报表（资产负债表、P&L、现金流）
      - - 按信用层级和放款批次划分的净核销率
        - 核销决定全信用谱系贷款的真实信贷经济性
        - 如果非优质客群核销过高，全信用谱系信贷论点就不成立
        - 索取服务商报告和 Roadrunner Financial 内部信贷指标
      - - 逾期率（30/60/90 天）
        - 未来核销和 ABS 抵押品表现的先行指标
        - 高逾期可能触发 ABS 结构性事件；ABS 投资者会私下知道这一点
        - 获取 KBRA/S&P ABS 监控报告；或向 Octane 管理层索取
      - - 净息差和资金成本
        - NIM 是持有贷款账簿的基本经济引擎
        - 没有 NIM 披露，毛利率定义可能排除了关键的信贷成本
        - 索取仓储额度成本、ABS 票息历史和按放款批次划分的 NIM
      - - 仓储信用额度条款和可用性
        - 仓储额度是发放业务的营运资本；违反契约可能让增长停摆
        - 仓储额度容量约束会限制发放能力
        - 索取仓储融资协议、承诺金额和契约条款
      - - 烧钱速度和经营现金流
        - 股权资金续航期决定下一轮融资触发点和稀释风险
        - 如果经营亏损较高，Series F 可能不够用
        - 索取过去 12 个月经营现金流；确认公司当前是否盈利
      - - 软件 / 平台费收入拆分
        - 确认 Prequal 和 Portal 是否构成独立 SaaS 收入
        - 会改变收入质量和经常性收入评估
        - 在管理层讨论中确认平台费是否存在及其规模
      - - ABS 表现相对预期
        - ABS 抵押品表现决定评级能否维持，以及未来利差收紧还是走宽
        - 表现不佳会推高 ABS 市场资金成本
        - 索取 OCTL 2023/2024/2025 系列的 KBRA/S&P 监控报告
    notes: 投资人向 Octane 投入资本前，这些缺口是尽调优先级最高的事项。作为一家私人公司，Octane 不公开披露这些指标并不罕见，也不会让投资逻辑失效；但信息不对称风险会被放大。
    claimRefs:
      - CI026
      - CI027
      - CI028
      - CI029
      - CI030
