  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与概览
        blocks:
          - type: paragraph
            body: >-
              Octane 的风险栈排序是：第一，资金与信用敏感性；第二，监管和诉讼暴露；第三，服务与运营执行；第四，伙伴依赖；第五，信息不透明。首要风险不是 Octane 今天缺少资本渠道；公开证据恰恰相反，显示其有重复
              ABS 计划、具名 forward-flow 投资者和最近的 Series F。风险在于，这些渠道受市场条件约束。Octane
              是可选消费车辆品类里的专业贷款方，而一家出售或证券化大部分发起贷款的贷款方，必须让三个系统同时运转：借款人需求、承保纪律和买方胃口。如果利率维持高位、ABS
              利差扩大，或贷款表现低于私有预期，增长可能放慢，同时表内暴露上升。第二组是合规与法律风险。Roadrunner 直接处在借款人关系中，PACER 上存在 2026
              年在审案件，公司的数字工作流天然引出公平贷款、披露、催收和服务问题。运营上，2024 年 CRO 交接、欺诈处理、全损服务和借款人投诉表面都很重要，因为它们同时影响信用表现和经销商 / OEM
              信任。诚实结论是，Octane 看起来可融资且机构化，但透明度还不够，不能在没有更深尽调的情况下排除尾部下行。
            claimRefs:
