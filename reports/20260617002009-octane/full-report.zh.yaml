      - number: '7.4'
        title: 伙伴依赖
        blocks:
          - type: paragraph
            body: >-
              Octane 的交易对手已经多元化，但模型仍高度依赖外部伙伴。分发侧，公司依靠 OEM 和经销商关系高效获取借款人。资金侧，公司依靠整贷买方、forward-flow
              投资者、仓储额度和证券化市场来循环资本。公开证据令人鼓舞：Moore、Nuveen 和 AB CarVal 各自承诺了大型 forward-flow 项目，评级机构也继续覆盖 Octane
              应收款。这样的广度降低了单一交易对手故障一夜之间变成生死问题的概率。但它不能消除市场状态风险：多个买方同时暂停、评级标准收紧，或预期抵押品表现走弱。渠道伙伴同理。Huntington Bank
              关系可以加深触达并验证平台，但也把 Octane 更紧地连到第三方渠道优先级和经济条款上。来自 Sheffield Financial 等 incumbent 的竞争意味着伙伴关系不能被视为
              captive。最大未解问题是集中度披露。公开材料没有说明多少交易量来自头部
              OEM、经销商集团或特定资金买方，因此依赖风险可以做结构性映射，却无法完整量化。缺少集中度数据本身就是风险，因为它阻止了干净的下行测算。
