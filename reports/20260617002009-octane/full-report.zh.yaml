chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与商业模式
        blocks:
          - type: paragraph
            body: >
              Octane 在自有渠道里的定位始终一致：一家数字化金融科技贷款平台，目标是让休闲和动力运动车辆购买更快、更透明。它把专有技术栈与内部贷款机构 Roadrunner Financial, Inc.
              组合起来。公司成立于 2014 年，总部位于纽约州纽约市，并于 2025 年 10 月在得克萨斯州达拉斯开设第二个办公室。模式是双边的：前端为经销商和 OEM
              提供数字化发起工具，包括软查询预资格评估（PreQual 和 PreQual Flex）、Dealer Portal，以及 Captive-as-a-Service 白标方案；后端由 Roadrunner
              Financial 发放消费贷款，Octane 再把发起贷款中的绝大部分出售至资本市场渠道。因此，Octane
              既是技术公司，也是轻资产负债表的专业贷款机构。产品版图已经覆盖动力运动（其起家市场）、RV、船艇、拖车、户外动力设备，并在 2025
              年进入自有汽车金融，所以更适合把它理解为多垂直休闲信贷平台，而非单一产品贷款机构。公司在 Series F 时披露员工超过 600 人；尽管 Octane 没有公开精确的员工序列，这仍是可信的运营规模信号。
