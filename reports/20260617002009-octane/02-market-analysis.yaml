  - TM004
callouts:
- calloutType: insight
  title: The real competitor is the status quo, not another fintech
  body: |
    In every vertical Octane enters, the default is manufacturer captive finance, a bank or credit-union direct
    loan, a general-purpose card such as Synchrony's powersports product, or cash. Octane's wedge is a digital,
    soft-pull dealer workflow that spans prime and non-prime — which is why OEMs and banks partner with it rather
    than replicate it.
  claimRefs:
  - CM004
  - CM005
  - CM006
  - CM031
- calloutType: strength
  title: Distribution breadth is the clearest quantitative signal of reachable market
  body: |
    With 50 OEM relationships and 4,000+ active dealers across six verticals, Octane's channel reach is the most
    concrete proxy for serviceable market, even absent an independent SAM dollar figure. Each OEM and bank
    partnership widens the pool of dealer-attached purchases it can finance.
  claimRefs:
  - CM009
  - CM010
  - CM019
- calloutType: risk
  title: Market access is gated by capital-market appetite
  body: |
    Because Octane sells most of what it originates, the size of the market it can actually serve is bounded as much
    by forward-flow and securitization demand as by consumer demand. A credit-market contraction would compress
    originations regardless of dealer or consumer appetite.
  claimRefs:
  - CM021
  - CM022
  - CM038
- calloutType: risk
  title: No independent TAM/SAM figure is available
  body: |
    The reviewed sources do not contain a reconciled third-party estimate of the recreational-vehicle POS financing
    market. Sizing therefore rests on Octane's served volume plus directional channel-breadth lenses, and any
    precise TAM number should be treated as unverified until independent market data is obtained.
  claimRefs:
  - CM011
  - CM036
  - CM037
- calloutType: assumption
  title: Served volume is the anchor; broader market is directional
  body: |
    This chapter treats Octane's ~$2.1B of 2025 originations as the firm SOM anchor and treats SAM and TAM as
    directional, channel-implied ranges. Readers should not interpret the sizing-lens figure as an independently
    audited market estimate.
  claimRefs:
  - CM008
  - CM032
  - CM036
- calloutType: insight
  title: Non-prime breadth is the demand-side differentiator
  body: |
    OEMs such as Honda engaged Octane specifically to reach non-prime customers, while CFMOTO and Suzuki tie-ups
    target prime expansion. Spanning the full credit spectrum in one dealer workflow is the feature that pulls both
    consumer demand and OEM partnerships toward the platform.
  claimRefs:
  - CM014
  - CM015
  - CM017
