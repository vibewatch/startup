callouts:
- calloutType: strength
  title: Profitable, multi-vertical growth on a balance-sheet-light model
  body: |
    Octane pairs ~$2.1B of 2025 originations with three consecutive years of GAAP net income and ~$80M adjusted
    EBITDA, while selling roughly 91% of originations into ABS, forward-flow, and whole-loan channels. That
    combination — profitable growth without warehousing most credit risk — is unusual for a venture-backed lender
    and is the core of the bull case.
  claimRefs:
  - CO024
  - CO028
  - CO029
  - CO018
- calloutType: strength
  title: Deep, diversified capital and distribution base
  body: |
    A $4.7B+ ABS program since 2019, $3.3B+ of forward-flow and whole-loan commitments since December 2023, 50 OEMs,
    and 4,000+ active dealers across six verticals give Octane both funding redundancy and origination reach that a
    single-channel lender lacks.
  claimRefs:
  - CO014
  - CO020
  - CO034
  - CO035
- calloutType: risk
  title: Servicing complaints concentrate at Roadrunner Financial
  body: |
    BBB and Trustpilot reviews of Roadrunner Financial cite customer-service friction and payment-processing delays,
    and a single PACER case (Gooding v. Octane Lending/Roadrunner Financial) is on file. No CFPB enforcement action
    was found, so the signal is reputational and operational rather than an established regulatory breach — but it is
    the clearest adverse pattern in the public record.
  claimRefs:
  - CO030
  - CO031
  - CO032
- calloutType: risk
  title: Core financial and credit metrics are private
  body: |
    Octane discloses originations, valuation, and headline profitability, but not loan-level loss curves,
    delinquency, cohort performance, or audited statements. For a lender, those omissions materially limit
    underwriting precision and are the single largest diligence gap in the overview.
  claimRefs:
  - CO025
  - CO033
  - CO040
- calloutType: insight
  title: Strategic investors double as commercial partners
  body: |
    Several Series F backers — Huntington Bank, Camping World/Good Sam, and Upper90 — are also originations,
    distribution, or credit partners. This deepens alignment and distribution but blurs arms-length cap-table
    interpretation, so control and economic terms need explicit confirmation.
  claimRefs:
  - CO016
  - CO017
  - CO019
  - CO039
- calloutType: assumption
  title: Reported traction is treated as company-claimed until audited
  body: |
    Originations, revenue, EBITDA, OEM, dealer, and headcount figures come from Octane's own releases and credible
    secondary reporting. They are internally consistent and partly corroborated by capital-markets activity, but the
    overview treats them as company-claimed pending audited statements and a data-room review.
  claimRefs:
  - CO024
  - CO028
  - CO034
  - CO036
