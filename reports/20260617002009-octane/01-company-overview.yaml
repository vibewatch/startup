company:
  name: Octane
chapter:
  number: 1
  title: Company Overview
  summary: |
    Octane (Octane Lending, Inc.) is a 2014-founded, New York-headquartered digital lending fintech for
    recreational and powersports purchases that underwrites and services consumer loans through its in-house
    lender Roadrunner Financial, Inc. Official releases, independent reporting, and capital-markets disclosures
    support a December 2025 Series F that raised $100M at a $1.3B post-money valuation, roughly $2.1B of 2025
    originations, GAAP profitability for three consecutive years, and a deep funded base of more than 50 OEMs and
    4,000+ active dealers. The same record also shows adverse servicing complaints against Roadrunner Financial and
    a private financial profile that withholds credit-performance and detailed unit data, so identity and scale are
    well evidenced while granular performance remains a diligence gap.
sections:
- id: identity-product-and-model
  title: Identity, Product, and Business Model
  body: |
    Octane presents itself consistently across its own surfaces as a digital fintech lending platform that aims to
    make buying recreational and powersports vehicles fast and transparent, pairing a proprietary technology stack
    with an in-house lender, Roadrunner Financial, Inc. The company was founded in 2014, is headquartered in New
    York, NY, and in October 2025 opened a second office in Dallas, TX. Its model is two-sided: on the front end it
    gives dealers and OEMs digital origination tools such as soft-pull prequalification (PreQual and PreQual Flex),
    a Dealer Portal, and a Captive-as-a-Service white-label offering; on the back end Roadrunner Financial
    originates the consumer loan, and Octane sells the overwhelming majority of what it originates into capital-
    markets channels. That makes Octane both a technology company and a balance-sheet-light specialty lender. The
    product footprint now spans powersports (its founding market), RV, marine, trailer, outdoor power equipment, and
    a 2025 move into captive auto financing, so the identity is best read as a multi-vertical recreational-credit
    platform rather than a single-product lender. The company reports more than 600 employees as of the Series F,
    which is a credible operating-scale signal even though Octane does not publish a precise public headcount series.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
