- id: leadership-and-governance
  title: Leadership, Governance, and Key-Person Dependence
  body: |
    Octane's leadership bench combines founder continuity with a 2024-2025 wave of senior hires that signals a
    deliberate scale-up. Co-founder Jason Guss remains chief executive officer and is the public face of the company
    in funding and milestone coverage. In 2024 Octane appointed Steven Fernald as its first president and named Mark
    Molnar chief risk officer, with co-founder Ray Duggins moving to an advisory role. In 2025 the company appointed
    Sean Fernandez-Ledon as its first chief legal officer and promoted Jon Vestal and Kartik Kothari to executive
    vice president positions. The pattern of firsts — first president, first CLO — is itself a diligence signal:
    Octane is institutionalizing functions (legal, risk, operations) that a venture-stage lender can run informally
    but a $1.3B-valuation regulated lender cannot. The most important key-person dependence sits with the founder-
    CEO and the risk function, because a balance-sheet-light lender lives or dies on underwriting discipline and on
    continued access to forward-flow and securitization buyers, both of which are relationship-driven. The public
    record is thin on board composition and investor governance rights, which is the principal governance gap a
    buyer or later-stage investor would need to close before underwriting control and incentive alignment.
  claimRefs:
  - CO008
  - CO009
  - CO010
  - CO011
  - CO012
  - CO013
  - CO037
  - CO038
  tableRefs:
  - TO002
- id: funding-investors-and-capital-base
  title: Funding, Investors, and Capital Base
  body: |
    Octane's capital base has two distinct layers that should not be conflated: equity funding for the operating
    company, and the much larger pool of debt and loan-sale capacity that funds the loans themselves. On the equity
    side, Octane closed a $100M Series F on December 15, 2025 at a $1.3B post-money valuation led by Valar Ventures,
    lifting cumulative equity raised to roughly $342M from a prior $242M base; this followed a $50M Series E in 2024.
    Series F participants included Upper90, Huntington Bank, Camping World/Good Sam, and Holler-Classic, several of
    which are also commercial partners — a strategic-investor pattern that tightens distribution but complicates a
    clean arms-length cap-table read. On the funding side, Octane has run an asset-backed securitization program
    since 2019, issuing more than $4.7B across sixteen transactions, and layers forward-flow and whole-loan
    agreements with institutions such as Nuveen, Bayview, Moore Capital, AB CarVal, YieldStreet, and Georgia's Own
    Credit Union, citing more than $3.3B of commitments since December 2023. The strategic-investor overlap and the
    breadth of named capital partners are genuine strengths, but exact ownership percentages, preference terms, and
    board seats are not public, leaving real questions about control and economic alignment that diligence must
    close.
  claimRefs:
  - CO014
  - CO015
  - CO016
  - CO017
  - CO018
  - CO019
  - CO020
