- id: distribution-and-lock-in
  title: Distribution Power and Lock-in
  body: |-
    Octane's distribution advantage is anchored in OEM partnerships with Polaris (January 2022), BRP (November 2021), Kawasaki (January 2024 full-spectrum), CFMOTO (December 2024), Honda, Suzuki, and dozens of other brands. OEM relationships accelerate dealer adoption by lending brand credibility to the financing workflow and aligning promotional financing with the vehicle purchase decision. The private-label RideNow Finance program, launched October 2024 in RideNow's 56 stores, was described by Octane as the only private-label branded financing for a dealership group in the nearly $30 billion powersports market. Dealer-workflow lock-in is meaningful since switching from an embedded platform involves retraining F&I staff, migrating workflows, and renegotiating lender relationships. At the same time, OEM agreements are explicitly non-exclusive, meaning captive programs and other lenders can coexist on the same dealer floor. The Kawasaki agreement (January 2024) extended Octane to full-spectrum credit across Kawasaki's 1,000-plus U.S. dealer network and provides a concrete example of how OEM partnerships materially expand distribution while also illustrating that these partnerships require active cultivation rather than permanent exclusivity.
