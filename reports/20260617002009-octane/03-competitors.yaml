  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: dealer churn rate and multi-homing behavior
    missingEvidence: |-
      Annual dealer churn rate, proportion of dealers simultaneously using Synchrony or Sheffield alongside Octane, and active vs. enrolled rooftop distinction.
    whyItMatters: |-
      Dealer multi-homing directly affects the durability of the workflow lock-in thesis; if significant churn or multi-homing exists, the moat is weaker than distribution scale implies.
    diligencePath: |-
      Request dealer network health metrics, quarterly active-dealer count, and any multi-lender usage data from Octane management.
    relatedQuestionRefs:
    - QP020
  - type: missing-source
    severity: material
    topic: Gooding v. Octane Lending lawsuit nature and status
    missingEvidence: |-
      Public docket indicates a lawsuit exists but does not reveal the claims, current status, or potential financial or operational exposure.
    whyItMatters: |-
      Lending-practice or servicing lawsuits can signal systemic operational issues that affect regulatory standing and investor confidence.
    diligencePath: |-
      Request full case details, legal counsel opinion, and any regulatory correspondence related to the Gooding matter from Octane management.
    relatedQuestionRefs:
    - QP026
  - type: private-evidence-only
    severity: material
    topic: OEM partnership exclusivity terms and renewal rights
    missingEvidence: |-
      Whether any OEM partnership agreements include exclusivity provisions, renewal options, or volume minimums that would strengthen or weaken competitive moat.
    whyItMatters: |-
      Non-exclusive OEM agreements are a key competitive vulnerability; any exclusivity provisions would materially improve the moat assessment.
    diligencePath: |-
      Request summary of key OEM agreement terms (exclusivity, term length, renewal options) from Octane management.
    relatedQuestionRefs:
    - QP010
    - QP024
