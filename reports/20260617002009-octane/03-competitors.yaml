callouts:
- calloutType: strength
  title: Octane's multi-layer stack separates it from every peer category
  body: |-
    Sheffield and Synchrony are lenders without deep OEM programs. OEM captives are lenders without multi-brand software. Credit unions are lenders without dealer workflow. Octane is the only platform that currently combines all three. That multi-layer positioning makes it difficult for any single-category competitor to displace the full offering.
  claimRefs:
  - CP001
  - CP036
- calloutType: risk
  title: |-
    Non-exclusive OEM agreements and manufacturer-subsidized rates are the clearest structural vulnerabilities
  body: |-
    Every OEM agreement Octane has published is non-exclusive. Manufacturers can subsidize promotional rates that Octane's independent model cannot match. Both risks are real and not eliminable through product investment alone; they require private diligence on OEM agreement renewal terms and promotional volume concentration.
  claimRefs:
  - CP024
  - CP041
- calloutType: insight
  title: |-
    Sheffield and Synchrony represent incumbent resistance, not imminent displacement
  body: |-
    Neither Sheffield nor Synchrony has announced a material product response to Octane's OEM program or private-label strategy. Their incumbency threat is primarily through existing dealer relationships and balance-sheet durability, not product innovation. This is a stable but not permanent advantage for Octane.
  claimRefs:
  - CP002
  - CP003
  - CP037
