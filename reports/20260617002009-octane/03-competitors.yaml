- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat Claim
  - Competitive Threat
  - Severity
  - Octane Mitigation
  - Diligence Ask
  rows:
  - - OEM partnership network (60+ brands)
    - OEM could revive or deepen captive programs; non-exclusive agreements
    - High
    - |-
      Multi-OEM breadth reduces single-OEM dependence; full-spectrum fills captive gaps
    - Are any OEM partnerships exclusive? What is tenure and renewal history?
  - - Dealer workflow lock-in (OctaneOS, Portal 2.0)
    - |-
      Synchrony or Sheffield deepening workflow tooling; DMS vendors adding lender routing
    - Medium
    - |-
      Switching cost involves staff retraining and workflow re-integration; prequal tools embed deeper
    - What is annual dealer churn rate? How many dealers multi-home with Synchrony?
  - - ABS capital-markets program (16 deals, $4.7B+)
    - |-
      Incumbent bank-backed competitors absorb volume without ABS risk; rising credit spreads
    - Medium
    - |-
      16-deal track record and institutional investor base; S&P AAA rating on senior tranches
    - |-
      What are current OCTL ABS credit spreads vs. market? Is AAA on all senior tranches?
  - - Full-spectrum credit (non-prime coverage)
    - Credit tightening reduces non-prime pool; charge-off risk not publicly confirmed
    - High
    - |-
      Proprietary Prism underwriting engine; full-spectrum is the core differentiation from captives
    - |-
      What are actual charge-off and delinquency rates? How does Prism perform in credit cycles?
  - - Private-label and CaaS platform
    - Competition from traditional fintech or bank-backed CaaS vendors entering market
    - Low-Medium
    - |-
      First-mover in powersports dealer groups; RideNow Finance case study as proof point
    - |-
      How many additional dealer-group deals are in pipeline? What are CaaS unit economics?
  - - Capital-markets diversification ($3.7B+ committed)
    - Counterparty concentration risk; forward-flow partners could withdraw in stress
    - Medium
    - |-
      Multiple forward-flow partners (AB CarVal, Moore Capital, Nuveen, Yieldstreet) reduce concentration
    - What is the maturity profile of forward-flow commitments?
  notes: |-
    Risk severity is evidence-based assessment; private diligence is required to quantify charge-off exposure and OEM agreement exclusivity. Adverse credit-cycle scenarios are not supportable from public data alone.
