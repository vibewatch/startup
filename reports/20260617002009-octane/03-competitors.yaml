  - FP003
- id: adverse-evidence
  title: Adverse Evidence and Displacement Risk
  body: |-
    Several signals limit confidence in Octane's moat durability. First, OEM partner agreements are non-exclusive, meaning brands like Kawasaki and CFMOTO could expand relationships with other lenders; Kawasaki's pre-2024 financing operations show that captive alternatives existed before Octane's full-spectrum partnership. Second, OEM captive programs (HDFS, Yamaha, BRP) can offer manufacturer-subsidized promotional rates that Octane's independent lender model structurally cannot replicate; dealers relying heavily on promotional financing have reason to multi-home. Third, Sheffield Financial's 30-plus years of dealer relationships and Truist Bank's large balance sheet represent an incumbency advantage difficult to dislodge purely on software quality. Fourth, Synchrony already serves adjacent dealer segments (outdoor power equipment, marine) and could deepen non-prime capabilities if strategically motivated. Fifth, a federal lawsuit (Gooding v. Octane Lending and Roadrunner Financial) is publicly docketed, representing an adverse legal signal not fully explained by public sources. Sixth, the company has not publicly disclosed charge-off rates or delinquency data, meaning credit quality as an adverse signal cannot be fully evaluated from public sources. Private diligence must cover OEM agreement exclusivity, dealer churn rates, credit performance, and competitive response from incumbents.
  claimRefs:
