- id: capability-and-pricing
  title: Capability and Pricing Comparison
  body: |-
    Octane's most visible capability advantage is full-spectrum credit delivered through Roadrunner Financial alongside proprietary dealer software including OctaneOS, Dealer Portal 2.0, and the Prequal and Prequal Flex soft-pull prequalification tools. As of early 2025, Prequal was deployed at more than 1,200 dealers and Prequal Flex also exceeded 1,200 dealer deployments, together generating nearly 400,000 referral applications. No competitor appears to have an equivalent soft-pull prequalification product embedded across a comparable dealer footprint. Octane does not publicly disclose its dealer fee or spread economics. Synchrony documents a dealer rebate of up to 2 percent on eligible loans; Octane's Octane Preferred B2B loyalty program provides additional economic incentives with undisclosed tier structure. OEM captive programs can offer manufacturer-subsidized promotional APRs that Octane's independent model structurally cannot match. Credit unions offer competitive rates for prime members but are not available to dealers seeking embedded financing workflows. LightStream and similar direct-to-consumer digital lenders operate without dealer enrollment, making them substitutes for borrowers but not for dealer B2B economics.
  claimRefs:
  - CP007
  - CP008
  - CP013
  - CP014
  - CP029
  - CP032
