  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: charge-off and delinquency rates
    missingEvidence: |-
      Roadrunner Financial net charge-off rates by credit tier and vintage; 30/60/90 day delinquency curves; servicer advance rates.
    whyItMatters: |-
      Full-spectrum lending thesis is only defensible if non-prime loss rates are bounded by Prism underwriting quality; without disclosure, the gross margin claim cannot be stress-tested.
    diligencePath: |-
      Request servicer reports from Roadrunner Account Services; access KBRA and S&P ABS surveillance reports (credentialed access required).
    relatedQuestionRefs:
    - QI010
    - QI011
    - QI023
  - type: access-blocked
    severity: material
    topic: |-
      GlobalCapital ABS Deal of the Year article and S&P structured finance surveillance
    missingEvidence: |-
      Full GlobalCapital article confirming ABS Deal of the Year for OCTL 2024-RVM1; S&P structured finance surveillance reports for OCTL series.
    whyItMatters: |-
      Independent credit performance verification requires access to institutional-grade surveillance reports that are behind paywalls or access controls.
    diligencePath: |-
      Subscribe to GlobalCapital institutional tier; request S&P performance reports from Octane management or purchase through S&P direct access.
    relatedQuestionRefs:
    - QI011
    - QI023
  - type: missing-source
    severity: material
    topic: Warehouse credit line terms and capacity
    missingEvidence: |-
      Warehouse facility size, committed vs. drawn amounts, covenant terms, margin call provisions, and lender list.
    whyItMatters: |-
      Warehouse lines are the operational working capital for origination; covenant breaches or capacity limits could halt growth at a critical moment.
    diligencePath: |-
      Request warehouse facility agreements and most recent compliance certificates from Octane management.
    relatedQuestionRefs:
    - QI022
  - type: missing-source
    severity: material
    topic: Software platform fee revenue confirmation
    missingEvidence: |-
      Whether Dealer Portal 2.0, Prequal, and Prequal Flex generate standalone subscription or transaction fees separate from lender economics.
    whyItMatters: |-
      If platform fees exist, they represent higher-quality recurring revenue distinct from credit-cycle-sensitive NIM and gain-on-sale.
    diligencePath: |-
      Request product pricing documentation and revenue breakdown by stream from Octane CFO; specifically ask about Prequal monetization model.
    relatedQuestionRefs:
    - QI006
    - QI014
  - type: missing-source
    severity: material
    topic: CFPB complaint volume for Roadrunner Financial and Octane Lending
    missingEvidence: |-
      CFPB complaint database does not clearly surface high-volume complaint patterns attributable to Roadrunner Financial or Octane Lending in accessible public search.
    whyItMatters: |-
      Complaint patterns are an adverse signal for servicing quality and regulatory risk; inability to verify their absence is an evidence gap, not a clearance.
    diligencePath: |-
      Search CFPB FOIA-accessible data for Roadrunner Financial specifically; request regulatory correspondence summary from management.
    relatedQuestionRefs:
    - QI016
  - type: missing-source
    severity: material
    topic: Gross margin definition and composition
    missingEvidence: |-
      Whether the 41% gross margin cited by Octane for 2024 includes credit loss provisions, cost of funds, platform costs, or is computed on a narrower gross-spread basis.
    whyItMatters: |-
      Gross margin as reported by companies may use varying definitions; without the methodology, the metric cannot be compared to financial services industry peers.
    diligencePath: |-
      Request gross margin definition and income statement structure from Octane CFO; clarify what costs are included above vs. below the gross margin line.
    relatedQuestionRefs:
    - QI025
