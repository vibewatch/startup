callouts:
- calloutType: strength
  title: Diversified institutional capital base is a key financial differentiator
  body: |-
    By 2026 Octane has assembled a capital stack spanning 16 ABS transactions, five forward-flow agreements, and six whole-loan sales across blue-chip institutional investors including Nuveen (TIAA), Moore Capital, AB CarVal, and Bayview. This diversification reduces single-counterparty concentration risk and signals institutional validation of Octane's credit performance.
  claimRefs:
  - CI022
  - CI023
- calloutType: risk
  title: Charge-off opacity is the single largest unresolved financial diligence gap
  body: |-
    All of Octane's published financial metrics (46% revenue growth, 41% gross margin) are unaudited and company-asserted. The absence of public charge-off and delinquency data for a full-spectrum lender in a cyclical asset class is the most important gap. Investors cannot underwrite the financial thesis without accessing Roadrunner Financial servicer reports and KBRA/S&P ABS surveillance data.
  claimRefs:
  - CI026
  - CI027
- calloutType: insight
  title: |-
    The $3.7B sold/committed figure understates total capital activity when ABS is included
  body: |-
    The $3.7B in whole-loan sales and forward-flow commitments since December 2023 does not include the $4.7B+ in ABS issuance since 2019. Together these represent over $8B in total capital-markets activity, which is strong evidence of institutional acceptance of Octane's asset class even in the absence of audited financials.
  claimRefs:
  - CI018
  - CI022
