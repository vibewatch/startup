company:
  name: Octane
chapter:
  number: 4
  title: Financials
  summary: |-
    Octane's financial picture is directionally positive on scale and capital-markets traction, with 2024 originations of $1.6 billion (36% YoY), company-claimed 46% revenue growth, 41% gross margin, and $3.7 billion in whole-loan sales and forward-flow commitments since December 2023. The company is also well-funded with a $1.3 billion post-money valuation from the December 2025 Series F. However, the company is private with no audited financials, and critical metrics including charge-off rates, delinquency rates, NIM, and warehouse-line terms remain unverified from public sources. The revenue model mixes NIM, gain-on-sale, ABS execution, and potential platform fees in ways that cannot be decomposed without private access.
sections:
- id: revenue-model
  title: Revenue Model
  body: |-
    Octane's revenue model operates on at least three distinct, overlapping channels. First and most fundamental is net interest income: Roadrunner Financial, its in-house lender, originates fixed-rate installment loans and earns the spread between the interest rate charged to borrowers and the cost of funding (warehouse lines, ABS proceeds, or forward-flow pricing). Second, when Octane sells whole-loan pools to institutional investors like Yieldstreet and Bayview, it can realize gain-on-sale income representing the premium above the par value of the loan pool; Octane has sold or committed $3.7 billion through this channel since December 2023. Third, in ABS transactions, Octane typically retains a residual or subordinated interest while selling senior tranches to investors; the execution spread between bond yield and loan yield generates income. A fourth possible stream is software or platform fee revenue from Dealer Portal, Prequal, and Prequal Flex tools deployed at more than 1,200 dealers each, though Octane has not publicly confirmed whether these tools carry separate subscription fees or are bundled into the lender economics. Fifth, Roadrunner Account Services earns servicing fees on the growing managed portfolio of sold loans, which is a recurring revenue stream that scales with the size of the off-balance-sheet book. The 2024 annual update cites 46 percent revenue growth and 41 percent gross margin; Upper90 described Octane as growing rapidly and profitably. However, these remain company-asserted figures without independent audit confirmation.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  tableRefs:
  - TI001
  figureRefs:
  - FI001
- id: pricing-and-monetization
  title: Pricing and Monetization
  body: |-
    Octane does not publicly disclose interest rate schedules, dealer fee structures, or platform pricing. The observable proxies are: (1) the company offers full-spectrum credit (prime through non-prime), implying a range of APRs that are typically higher for non-prime borrowers and competitive with bank rates for prime; (2) the Octane Preferred B2B loyalty program provides economic incentives to dealers, but specific rebate structures are not published; (3) forward-flow and whole-loan sale pricing is negotiated bilaterally with institutional counterparties, and the realized gain margin is not disclosed. The December 2025 Series F press release specifically noted that Upper90 cited Octane as growing rapidly and profitably, suggesting positive unit economics, but this remains an investor-quoted claim rather than an audited result. The only publicly observable pricing information is the description of Synchrony's competitive 2 percent dealer rebate, which provides an indirect benchmark for what Octane may need to offer. On the capital-markets side, the 2024 OCTL 2024-3 ABS transaction achieved credit spreads materially lower than initial guidance, signaling strong institutional demand and potentially better-than-expected execution economics for that period. The 2025 OCTL 2025-RVM1 was the second RV/marine ABS shelf, winning the GlobalCapital ABS Deal of the Year 2025, which suggests ongoing credit-spread improvement as the program matures.
  claimRefs:
  - CI006
  - CI007
  - CI008
  - CI009
  - CI010
  tableRefs:
  - TI002
- id: cost-structure
  title: Cost Structure and Gross Margin
  body: |-
    Octane's cost structure reflects its dual nature as both a financial institution and a technology platform. The primary cost components are: (1) cost of funds (warehouse line interest, ABS coupon payments, forward-flow pricing) which is the largest cost driver and directly determines NIM; (2) credit losses from Roadrunner Financial's held loan book, which are a function of underwriting quality and the credit cycle; (3) technology infrastructure and product development costs for OctaneOS, Dealer Portal, Prequal, and supporting systems; (4) sales, marketing, and dealer-partner management costs; and (5) servicing operations at Roadrunner Account Services. The company's 2024 annual update cited 41 percent gross margin, which is a positive signal if validated. For a hybrid fintech-lender, a 41 percent gross margin would imply effective control of cost-of-funds and credit losses relative to revenue. However, gross margin as defined by Octane may not include all credit-cycle charges, and the definition has not been independently verified. The capital intensity of the business is meaningful because origination growth requires either on-balance-sheet funded capital (warehouse lines) or committed off-balance-sheet capacity (forward-flow), both of which have capacity limits and cost implications. The $100 million Series F equity raise was stated to be used for growth initiatives and secondary share transfers, suggesting the equity is primarily operational capacity rather than credit-loss buffer alone.
  claimRefs:
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
