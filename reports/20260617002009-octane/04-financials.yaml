- id: financial-verdict
  title: Financial Verdict and Adverse Evidence
  body: |-
    The financial picture is directionally positive but materially opaque. The thesis is that Octane has built a diversified, institutional-grade capital base around a growing origination engine with improving unit economics, as implied by 41 percent gross margin, 46 percent revenue growth, and the Upper90 investor quote about rapid and profitable growth. The adverse case rests on several unverifiable assumptions. First, charge-off and delinquency rates are never disclosed publicly; ABS performance data is behind institutional investor walls; and KBRA and S&P rating reports require credentialed access. A stressed credit cycle could compress NIM and force gain-on-sale at lower premiums. Second, the gain-on-sale revenue model is inherently episodic and depends on continued institutional appetite for powersports paper; a credit-market dislocation could disrupt the forward-flow pipeline. Third, the S&P Global website returned limited results for Octane ABS surveillance and the GlobalCapital article confirming the ABS Deal of the Year award was access-blocked during research, creating specific evidence gaps around third-party credit assessments. Fourth, the consumer complaint channel (CFPB) did not yield directly attributable high-volume adverse data, but Roadrunner Financial and Octane Lending may receive complaints classified under different category codes. Fifth, the Gooding v. Octane Lending federal lawsuit (noted in the competitors chapter) represents a legal adverse signal with unknown financial exposure. Six, the company is private with no reporting obligation, meaning the 46 percent revenue growth and 41 percent gross margin figures cannot be independently corroborated without auditor access. Private diligence must address all these dimensions before the financial thesis can be underwritten.
  claimRefs:
  - CI026
  - CI027
  - CI028
  - CI029
  - CI030
