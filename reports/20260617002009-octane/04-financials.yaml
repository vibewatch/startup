  figureRefs:
  - FI002
- id: traction-vs-opacity
  title: Traction vs. Financial Opacity
  body: |-
    Octane's publicly available traction metrics are strong but unaudited. The 2024 annual update reports $1.6 billion in originations (36 percent growth YoY), 46 percent revenue growth, and 41 percent gross margin. Total originations since founding exceeded $7 billion as of the December 2025 Series F announcement. RV originations doubled for the second consecutive year in 2024, and the ABS program attracted over 100 institutional investors across four 2024 transactions. These are meaningful scale signals. At the same time, the transparency gaps are significant: there are no audited financial statements, no charge-off or delinquency disclosures, no breakdown of revenue by stream, no cost-of-capital or warehouse-line terms, and no cohort-level loan performance data accessible without institutional investor credentials. The KBRA and S&P rating reports for individual ABS transactions contain performance data but are paywalled or require institutional access. The GlobalCapital article confirming the ABS Deal of the Year award was access-blocked at time of research. The CFPB consumer complaint database does not show clearly attributable Roadrunner Financial or Octane Lending complaints in easily accessible public search (Octane primarily serves prime and near-prime customers through a dealer channel, which may limit complaint volume). The result is a favorable public narrative with limited independent financial verification.
  claimRefs:
  - CI016
  - CI017
  - CI018
  - CI019
  - CI020
  tableRefs:
  - TI004
- id: capital-adequacy
  title: Capital Adequacy and Funding Structure
  body: |-
    Octane's capital stack combines equity, warehouse credit lines, ABS debt, and off-balance-sheet forward-flow commitments. On the equity side, the December 2025 Series F raised $100 million at a $1.3 billion post-money valuation, following the August 2024 Series E of $50 million. Total equity raised since founding is $342 million ($242 million pre-Series F). The ABS program has completed 16 transactions totaling $4.7 billion-plus since December 2019, providing medium-term secured funding. For off-balance-sheet capacity, Octane had $3.7 billion in whole-loan sales and forward-flow commitments since December 2023 as of the June 2026 Bayview transaction; this includes the AB CarVal $500 million forward-flow (September 2024), Moore Capital $300 million (August 2025), Nuveen $350 million forward-flow (May 2026) plus $150 million whole-loan sale, and Yieldstreet cumulative $480 million in whole-loan sales. The Nuveen deal disclosed total forward-flow commitments of over $2.2 billion as of May 2026. This diversification of capital sources is a meaningful strength; the 2026 Bayview whole-loan sale (June 16, 2026) is the sixth whole-loan transaction and the first with Bayview, indicating ongoing expansion of the investor base. Warehouse credit line terms, borrowing capacity, and covenant details are not publicly disclosed. Burn rate and cash runway are private company figures not available.
