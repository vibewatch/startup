- id: TI001
  title: Revenue streams table
  columns:
  - Revenue Stream
  - Mechanism
  - Unit / Driver
  - Estimated Current State
  - Revenue Quality
  - Diligence Ask
  rows:
  - - Net interest income (NIM) on held loans
    - Roadrunner Financial earns the spread between loan APR and cost of funds
    - Basis points spread per loan per year
    - Not publicly quantified; 41% gross margin cited in 2024 update (unaudited)
    - Recurring and credit-sensitive; core revenue driver
    - What is average loan duration, effective NIM, and warehouse cost of funds?
  - - Gain on sale (whole-loan sales)
    - Octane sells loan pools to institutional buyers at a premium to par
    - Premium percentage over par value per pool
    - $3.7B sold/committed since Dec 2023; gain margin not disclosed
    - Episodic; depends on institutional demand and credit spreads
    - What is realized gain-on-sale margin per pool? How does it vary by buyer?
  - - ABS structuring/execution income
    - Spread between ABS coupon cost and underlying loan yield at securitization
    - Residual and tranche execution spread
    - 16 transactions, $4.7B+; execution margin not disclosed
    - Episodic; improves with scale and lower credit spreads
    - What is residual interest retained per ABS deal? What are current OCTL spreads?
  - - Software/platform fees (inferred)
    - Dealer Portal, Prequal, Prequal Flex may carry per-dealer or per-app fees
    - Per-dealer subscription or per-application fee
    - Not publicly confirmed; existence inferred from product design
    - Potentially recurring SaaS-like if confirmed
    - Are there explicit software fees? What is per-dealer or per-application pricing?
  - - Servicing fee income
    - Roadrunner Account Services earns fee to service sold and ABS loans
    - Basis points per outstanding balance per year
    - Not publicly quantified; scales with $3.7B+ sold/committed book
    - Recurring; grows with managed portfolio
    - |-
      What is the servicing fee rate? What is total managed (off-balance-sheet) portfolio?
  - - Forward-flow facilitation income
    - Origination and structuring fees on forward-flow agreements
    - Per-loan fee or pool-level structuring margin
    - $2.2B+ in forward-flow commitments as of May 2026
    - Quasi-recurring under multi-year committed agreements
    - Are there specific origination fees in forward-flow agreements?
  notes: |-
    Revenue streams are inferred from business model description and partner announcements. Quantitative breakdowns are not publicly available; private diligence is required to validate each stream's magnitude and margin contribution.
