summary:
  headline: >-
    Octane is a profitable, high-growth specialty fintech lender with a defensible moat in powersports and recreational
    markets; the $1.3B valuation is fair given GAAP profitability and 29% originations growth, making this a buy for
    specialty fintech investors with medium confidence pending full financial disclosure.
