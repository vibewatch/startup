  topStrengths:
    - Three consecutive years of GAAP net income profitability — rare for a private fintech lender at this scale.
    - Proprietary underwriting model with 10+ years of specialty lending data creates a durable data moat.
    - >-
      Diversified capital markets program ($4.7B+ ABS issued, $3.3B forward-flow commitments) reduces balance-sheet
      concentration risk.
    - Captive-as-a-Service opens a large greenfield revenue stream with OEMs and dealer groups as platform customers.
    - 29% originations growth in 2025 with 50 OEM partners and 4,000+ dealers demonstrates strong network effects.
  topRisks:
    - >-
      Revenue concentration in cyclical discretionary spending categories (powersports, RV) creates earnings volatility
      risk.
    - >-
      Roadrunner Financial servicing complaints (BBB, Trustpilot) and one PACER lawsuit expose reputational and
      regulatory risk.
    - >-
      Capital markets dependency: forward-flow and whole-loan programs require continued institutional investor
      appetite.
    - >-
      Private company opacity: no audited financials, credit performance metrics, or portfolio loss data are publicly
      disclosed.
    - Early-stage expansion into auto captive and OPE markets; revenue remains predominantly powersports/RV.
  unresolvedGaps:
    - >-
      Audited GAAP financial statements unavailable; revenue (~$400M) and EBITDA ($80M) are unaudited company
      assertions.
    - >-
      Loan-level credit performance (NPL rate, charge-off rate, delinquency by vintage) not disclosed; portfolio quality
      unknown.
    - Gross margin, net interest margin, and unit economics not publicly disclosed.
    - Roadrunner Financial complaint volume, regulatory examination history, and full state licensing status not public.
    - Exact equity cap table, investor ownership percentages, and liquidation preference terms not disclosed.
