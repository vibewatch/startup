- id: growth-drivers-and-constraints
  title: Growth drivers and adoption constraints
  body: 'The strongest growth drivers are straightforward: health awareness rose after COVID, smartphone usage supports ongoing digital engagement, and branded organized gyms benefit from a trust advantage over fragmented local supply. These drivers fit Cult.fit well because its model is neither purely offline nor purely digital. Customers can discover through the app, retain through classes and content, and expand into products or employer-led programs. But the constraints are just as real. Affordability is a binding issue when local unorganized gyms can undercut branded memberships; habit persistence is a second issue because many users trial fitness products without sustaining repeat behavior. That makes the category less about one-time awareness and more about consistent utilization, retention design, and city-by-city economics. Hybrid behaviour should also be read correctly: home workouts did not permanently replace gyms, but they remain a complement that changes expectations around
    flexibility. For operators like Cult.fit, that means the market is attractive only if hybrid engagement improves retention rather than cannibalizing high-value centre usage.'
  claimRefs:
