- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Corporate wellness channel
    - Unclear active-account and renewal base
    - Could diversify CAC and revenue mix if real
    - Request active clients, contract lengths, and churn
  - - Partner-gym / franchise network
    - Inactive or low-quality partners may dilute brand
    - Can accelerate reach but weaken customer experience
    - Request partner productivity and QA metrics
  - - Metro-led consumer base
    - Top four cities drove 90.44% of FY26 fitness-services revenue
    - Any metro slowdown would hit growth and margin
    - Request city-level members, revenue, and maturity curves
  - - Cross-sell from basic membership into programs/products
    - No public evidence on attachment rates
    - Without upsell economics the expansion story may be overstated
    - Request attach-rate and repeat-purchase dashboards
  - - No top-five customer concentration
    - B2C mix reduces single-account dependency
    - Positive for enterprise concentration risk
    - Confirm channel revenue mix and top B2B accounts anyway
  notes: The risk table separates account concentration from city concentration because Cult.fit appears diversified by account but still concentrated by geography.
