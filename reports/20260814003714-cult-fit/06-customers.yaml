- id: expansion-loops-and-concentration-risks
  title: Expansion loops and concentration risks
  body: 'Cult.fit’s expansion logic is straightforward in public sources: once the brand acquires a user, it tries to deepen frequency and wallet share across more than one surface. A basic gym or class member can be moved into home workouts, sports bookings, outcome-led programs such as Transform, or products; separately, the same brand can be sold to employers as a wellness tool or to partner gyms as a demand-generation and operating layer. That creates multiple land-and-expand loops, but the public evidence is far better at proving that those loops exist than at proving how often they work. The DRHP says top-five customer concentration is not applicable, which lowers concern about dependence on a handful of enterprise accounts. Yet that is offset by geographic concentration: the same filing says the top four cities generated 90.44% of FY26 fitness-services revenue. In other words, Cult.fit looks diversified by account type but still concentrated by metro depth. Before underwriting aggressive
    expansion, investors should request city-level member and revenue cohorts, partner productivity, named corporate case studies, and attachment rates from core memberships into higher-intent products. Without that detail, expansion remains plausible but not fully underwritten. The next diligence step is converting these channel stories into measurable renewal and attachment economics.'
