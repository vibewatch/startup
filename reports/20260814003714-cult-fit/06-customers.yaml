  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: Direct consumer churn, pause, renewal, win-back, GRR, and NRR data by product and city.
    whyItMatters: Without retention math, public enthusiasm and rating volume can overstate long-term revenue durability.
    diligencePath: Request plan-level retention dashboards, cohort tables, and complaint-resolution trends.
    relatedQuestionRefs:
    - QU013
    - QU024
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: named-enterprise-proof
    missingEvidence: Named corporate deployments with seat counts, usage levels, outcomes, and renewal evidence.
    whyItMatters: The 1,500+ organizations claim may be meaningful, but the absence of named outcomes limits confidence in B2B quality and cross-sell potential.
    diligencePath: Request three named case studies with start dates, active users, and renewal history.
    relatedQuestionRefs:
    - QU009
    - QU010
    - QU020
    - QU024
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: city-and-channel-concentration
    missingEvidence: Active members, revenue, and churn by city, channel, plan tier, and owned-versus-partner supply.
    whyItMatters: Top-four-city concentration is high enough that metro-specific weakness could materially change growth and valuation.
    diligencePath: Request city/channel cohort deck and mature-centre performance by geography.
    relatedQuestionRefs:
    - QU016
    - QU017
    - QU024
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: minor
    topic: complaint-resolution-quality
    missingEvidence: Internal SLA, refund-resolution, slot-availability, and support-ticket closure data.
    whyItMatters: Review surfaces point to recurring friction, but the company’s true operating response rate is not public.
