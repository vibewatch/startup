  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Channel-level CAC, payback, mature-centre contribution margin, and cohort retention data.
    whyItMatters: These metrics determine whether Cult.fit deserves a premium growth multiple or should be valued like a capital-intensive operator with limited durability.
    diligencePath: Request management cohort decks and centre-level economics by city and format.
    relatedQuestionRefs:
    - QI011
    - QI023
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: runway-and-use-of-funds
    missingEvidence: A monthly runway bridge tying current cash, operating cash flow, capex, and IPO use of proceeds together.
    whyItMatters: Cult.fit is improving fast, but investors still need downside protection if listing timing or market appetite weakens.
    diligencePath: Request cash runway and capex plan from finance team or final RHP disclosures.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI004
  - type: conflicting-data
    severity: minor
    topic: ebitda-definition
    missingEvidence: A reconciled bridge between adjusted EBITDA in the DRHP and plain EBITDA cited in news summaries.
    whyItMatters: Both figures are directionally positive, but valuation work needs one normalized profitability baseline.
    diligencePath: Build a simple adjustment bridge from DRHP notes and management explanations.
