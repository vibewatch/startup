- id: capital-adequacy
  title: Capital adequacy and financing dependency
  body: Capital dependence has fallen, but it has not disappeared. The March 2026 Temasek/MacRitchie round gave Cult.fit fresh balance-sheet support heading into the IPO process, and the DRHP's proposed fresh issue provides a second layer of planned capital. Borrowings declined to roughly ₹260.8 crore by FY26 close, which is helpful, but net worth also remained pressured by the accumulated loss history. The practical takeaway is that Cult.fit is no longer in obvious survival mode; however, it still benefits materially from capital-market access if it wants to expand centres, support products, and keep optionality while public-market timing remains open. This chapter therefore treats IPO readiness not just as an exit event, but as a financing strategy. Investors should be comfortable that the business is improving fast enough to deserve public-market consideration, while still recognizing that runway, capital commitments, and post-IPO balance-sheet flexibility are not fully transparent in
    the free public record.
  claimRefs:
  - CI013
  - CI014
  - CI022
  - CI023
  - CI024
  - CI033
  - CI035
  tableRefs:
  - TI004
  figureRefs:
  - FI004
- id: financial-verdict
  title: Financial verdict and unresolved blockers
  body: 'The financial verdict is more favorable than Cult.fit''s older reputation would suggest. Revenue quality is improving, services appear structurally valuable, and the company has already demonstrated that scale can coexist with sharply better cash generation. That said, the chapter still stops short of a clean “proven compounder” label because several underwriting metrics remain missing: CAC, payback, mature-centre profitability, franchise economics, gross margins by category, and a normalized runway bridge if IPO timing slips. These are not cosmetic omissions; they are the metrics that determine whether a broad consumer fitness platform deserves a premium multiple or merely a narrative discount to simpler specialists. Investors can reasonably say Cult.fit has crossed from fragile to investable on trajectory. They cannot yet say the business is fully transparent or fully insulated from capital-intensity risk. In other words, the upside case is now plausible, but it still needs one
    more layer of unit-economic disclosure before conviction should be high.'
  claimRefs:
