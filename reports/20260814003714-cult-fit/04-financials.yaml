    severity: minor
    topic: refresh-before-pricing
    missingEvidence: Final RHP updates for valuation, use of funds, and any post-July 2026 financial changes.
    whyItMatters: The financial chapter is credible today, but public-market pricing will depend on the freshest disclosures available.
