- id: profitability-and-costs
  title: Profitability path, cost structure, and operating leverage
  body: 'The clearest positive change is the profitability trajectory. Losses narrowed sharply across three fiscal years, adjusted EBITDA turned positive in FY26, and operating cash flow was positive in both FY25 and FY26. That is enough to say Cult.fit has moved beyond the classic growth-at-all-costs startup profile. But it is not enough to say the economics are fully de-risked. The services segment is clearly the profit engine, while the products segment still drags profitability despite strong growth. Large depreciation, amortization, and finance-cost lines also show that the business carries real fixed-cost weight. This is why the distinction between media-reported plain EBITDA and filed adjusted EBITDA matters: the trend is good either way, but the magnitude depends on accounting treatment and which costs are normalized. The right interpretation is that Cult.fit has operating leverage, but not yet the disclosure depth needed to underwrite mature, durable margins with high conviction.'
  claimRefs:
  - CI007
  - CI008
  - CI009
  - CI010
