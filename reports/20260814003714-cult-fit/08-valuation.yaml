- id: final-diligence-and-ic-view
  title: Final diligence asks are what separate a good story from an investable price
  body: 'From an investment-committee perspective, Cult.fit scores well on market and reasonably well on customer proof and improving economics, but materially worse on valuation support and fully evidenced durability. That is a classic hold profile. The final work should therefore focus less on generic admiration and more on the specific missing datasets that can either justify or disprove a premium multiple: retention and churn by plan, mature-centre economics by city, support and complaint-resolution metrics, and exact cap-table / preference mechanics after the latest rounds and planned OFS. The open record already suggests that Cult.fit can be a scaled, category-leading Indian consumer platform. What it does not yet prove is that public-market investors should pay a multiple far above listed global fitness peers for that status. Until that evidence arrives, the prudent approach is to stay engaged, model multiple scenarios, and treat the business as investable only at disciplined entry
    levels rather than at any price management or bankers might test.'
