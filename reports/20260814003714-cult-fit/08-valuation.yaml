- id: valuation-context-and-comparable-gap
  title: The valuation gap versus public comparables is the core issue
  body: 'The most important valuation fact is the spread between Cult.fit’s visible private marks and the trading range of public fitness comparables. Multiple 2026 sources place the last private valuation near ₹12,600 crore, or about $1.5 billion, after Temasek’s March 2026 investment. That already implies roughly 7.3x FY26 revenue. The rumored IPO ask of around $2 billion pushes that to about 9.9x FY26 revenue. By contrast, public fitness comparables collected for this report trade materially lower on a market-cap-to-revenue basis: Peloton about 1.0x, Planet Fitness about 2.7x, Xponential about 0.8x, and Basic-Fit about 1.5x. Those are not perfect apples-to-apples comparisons, because Cult.fit arguably deserves some premium for Indian growth and hybrid breadth. Still, the gap is too large to hand-wave away. To underwrite it, investors need to believe not just that Cult.fit is better than listed peers, but that it is dramatically better in growth durability and long-run monetization. Today’s
    public evidence only partially supports that belief. This is why valuation—not market attractiveness—is the real debate.'
