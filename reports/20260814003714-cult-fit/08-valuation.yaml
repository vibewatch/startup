- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Retention and churn
    - Cohorts, pause, renewal, win-back, NRR/GRR
    - Most important missing proof behind premium
    - Management data room / finance
  - - City economics
    - Same-centre sales, mature-centre margins, member quality by city
    - Needed to test metro concentration and scaling quality
    - Ops + finance workstream
  - - Complaint resolution
    - Ticket ageing, refunds, slot denial, QA metrics
    - Separates noisy reviews from true service risk
    - CX / operations workstream
  - - Cap-table and preference stack
    - Series G conversion terms, dilution, OFS intent
    - Needed to model actual investor entry economics
    - Legal + finance workstream
  - - IPO readiness
    - Updated DRHP, banker feedback, pricing range, cornerstone appetite
    - Determines whether a public-market entry is viable
    - Banking / IR workstream
  notes: These are the minimum asks needed to turn a high-level quality view into a price-committed underwriting decision.
