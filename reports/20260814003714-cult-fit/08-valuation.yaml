- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - IPO pricing remains near ~$2B without new proof
    - No added retention/city economics disclosure
    - Premium case loses support
    - Decline or wait for repricing
  - - Margin inflection reverses
    - EBITDA positivity proves temporary
    - Economics thesis weakens fast
    - Move from hold toward fail
  - - Complaint burden worsens
    - Refund, slot, or support signals deteriorate
    - Customer proof becomes less durable
    - Haircut growth and renewal assumptions
  - - Metro concentration stays extreme
    - Top-four-city dependence remains very high
    - Scale looks less diversified than narrative suggests
    - Reduce premium multiple support
  - - Preference / dilution stack is worse than expected
    - Conversion or OFS mechanics materially dilute upside
    - Entry return shrinks
    - Rework cap-table model before investing
  notes: These triggers are designed for investment-committee refreshes rather than one-time memo language.
