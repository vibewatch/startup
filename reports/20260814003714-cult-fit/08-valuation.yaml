    severity: material
    topic: cap-table-and-preference-stack
    missingEvidence: Full dilution waterfall, Series G conversion mechanics, OFS seller intent, and any remaining preference overhang.
    whyItMatters: Entry economics can look very different from headline valuation numbers once dilution and liquidity preferences are modeled correctly.
