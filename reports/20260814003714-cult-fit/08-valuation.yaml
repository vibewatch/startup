chapter:
  number: 8
  title: Valuation
  summary: 'Cult.fit looks like a serious scaled asset in an attractive market, but the public valuation ask appears rich relative to disclosed economics and to listed fitness comparables. The best-supported stance is hold with medium confidence: the business can merit a premium to public peers if growth and margin inflection continue, but the current private mark already embeds a lot of that upside and the rumored ~$2 billion IPO level would require materially stronger retention, cohort, and city-economics evidence than the public record currently provides.'
sections:
- id: recommendation-and-pricing-discipline
  title: 'Recommendation: attractive company, but only a hold at visible pricing'
  body: 'Cult.fit is easier to like as a company than as an obvious buy at the prices visible in public sources. The thesis side is real: the company operates in an Indian fitness market that still looks underpenetrated and fast-growing, it already has unusual domestic scale with nearly one million members, and FY26 appears to mark an important economic inflection with ₹1,720 crore revenue and EBITDA positivity. Those are the ingredients of a serious premium story. But the anti-thesis is just as real. Public investors are being asked to consider premium pricing before they have public proof on cohort retention, city-level mature-centre economics, complaint-resolution quality, or the exact cap-table and preference implications of the latest round plus OFS structure. That means the right stance is hold with medium confidence and elevated risk. Cult.fit belongs on the investable list, but price discipline matters. If the company prices roughly around or below the last private mark and backs
    the story with harder operating proof, the call can improve. If it leans toward a ~$2 billion IPO ask without materially better disclosure, the pricing case looks stretched.'
