- id: scenarios-and-what-could-change-the-call
  title: Scenario ranges show why the current stance is hold rather than pass
  body: The scenario framework is relatively straightforward. In the bull case, Cult.fit sustains 30%+ growth, maintains EBITDA progress, and proves that its multi-surface model drives meaningful cross-sell and retention. That could justify a valuation band around ₹16,000-18,000 crore and support something close to the rumored IPO narrative. In the base case, growth stays healthy but evidence gaps remain only partly closed, which makes a valuation around ₹12,000-14,000 crore more defensible and much closer to the last private mark. In the bear case, public comps matter more, growth or margin confidence softens, and the acceptable band falls toward ₹9,000-11,000 crore. The recommendation changes toward pass if the company can prove retention, city economics, and complaint control while keeping valuation anchored near the last mark. It changes toward fail if management insists on a rich price while the evidence base remains roughly where it is today. The goal is not false precision; it is
    to keep the underwriting honest about what the public record can and cannot prove.
