evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: lifetime-funding
    missingEvidence: >-
      A reconciled round-by-round funding table that matches the 2026 DRHP, shareholder conversions, and secondary
      activity.
    whyItMatters: >-
      Public databases and media sources disagree on total capital raised, which affects dilution history and valuation
      context.
    diligencePath: Reconcile cap table and financing chronology directly from the final RHP and management investor deck.
    relatedQuestionRefs:
      - QO011
  - type: private-evidence-only
    severity: material
    topic: headcount-and-leadership-table
    missingEvidence: >-
      Management-confirmed current employee count and a breakdown by centres, corporate, technology, and product
      businesses.
    whyItMatters: Headcount efficiency is central to the operating leverage story but public sources only provide rough estimates.
    diligencePath: Request current HR MIS and prior 24-month headcount bridge by function.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: secondary-liquidity-and-investor-map
    missingEvidence: Clear explanation of founder and investor selling motives, lock-ups, and post-listing ownership thresholds.
    whyItMatters: >-
      Partial liquidity is normal, but the investment committee should know whether the IPO doubles as a major cap-table
      reset.
    diligencePath: Review banker presentation and draft lock-up disclosures when available.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: profile-completeness-and-kpi-table
    missingEvidence: >-
      Management-confirmed company profile sheet covering exact locations, current headcount, and active members by
      format.
    whyItMatters: >-
      Several overview facts are directionally strong but still rely on mixed public sources rather than one signed
      company profile.
    diligencePath: Request management fact book or final RHP KPI appendix before IC.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table-coverage
    missingEvidence: >-
      A fully reconciled round-by-round and launch-by-launch chronology including every minor financing and product
      milestone.
    whyItMatters: >-
      The public story is sufficient for investment framing, but some earlier events still rely on narrative summaries
      rather than a complete company-issued chronology.
    diligencePath: Rebuild the milestone list from board materials, historical press releases, and final prospectus exhibits.
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: non-metro-affordability
    missingEvidence: City-level organized-fitness spend and price elasticity data outside the top metros.
    whyItMatters: >-
      Cult.fit's future unit economics depend on whether tier-two expansion can retain branded pricing without
      sacrificing utilization.
    diligencePath: Request Redseer or internal cohort data by city tier before underwriting non-metro growth.
    relatedQuestionRefs:
      - QM024
  - type: stale
    severity: minor
    topic: market-refresh-2027
    missingEvidence: A refreshed 2027 set of facility counts, memberships, and app-market estimates.
    whyItMatters: >-
      Market penetration, supply, and digital-adoption figures are volatile enough that they should be refreshed before
      any new pricing decision.
    diligencePath: Refresh the market deck with the latest Deloitte/HFA, Ken, and app-market releases.
    relatedQuestionRefs:
      - QM025
  - type: conflicting-data
    severity: material
    topic: methodology-drift
    missingEvidence: >-
      A reconciled methodology note comparing commercial-fitness, digital-fitness, and broad-wellness definitions across
      sources.
    whyItMatters: Without a consistent boundary, the risk is accidental double counting or false TAM expansion.
    diligencePath: Normalize publisher definitions into one internal sizing memo used across valuation work.
    relatedQuestionRefs:
      - QM023
  - type: private-evidence-only
    severity: minor
    topic: corporate-wellness-sam
    missingEvidence: Actual corporate-wellness pipeline conversion and employer-paid utilization data from Cult.fit.
    whyItMatters: Public sources show the channel exists but do not quantify its real share of addressable or captured spend.
    diligencePath: Request B2B pipeline, client count, and engagement data from management.
    relatedQuestionRefs:
      - QM011
      - QM021
  - type: private-evidence-only
    severity: material
    topic: competitor-unit-economics
    missingEvidence: Comparable retention, CAC, utilization, and margin data for leading private competitors.
    whyItMatters: Without comparable unit economics, bundle breadth can be overvalued relative to specialist discipline.
    diligencePath: Request broker or primary interview evidence on Healthify, FITPASS, and major gym-chain economics.
    relatedQuestionRefs:
      - QP024
  - type: missing-source
    severity: minor
    topic: public-pricing-granularity
    missingEvidence: Current apples-to-apples pricing snapshots for equivalent plan durations, pauses, and cross-city access rules.
    whyItMatters: Public pricing shape is clear, but exact parity and discounting intensity remain under-documented.
    diligencePath: Mystery-shop competitor memberships and capture screenshots by city.
    relatedQuestionRefs:
      - QP023
  - type: stale
