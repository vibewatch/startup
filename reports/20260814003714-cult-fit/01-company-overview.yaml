  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: lifetime-funding
    missingEvidence: A reconciled round-by-round funding table that matches the 2026 DRHP, shareholder conversions, and secondary activity.
    whyItMatters: Public databases and media sources disagree on total capital raised, which affects dilution history and valuation context.
    diligencePath: Reconcile cap table and financing chronology directly from the final RHP and management investor deck.
    relatedQuestionRefs:
    - QO011
  - type: private-evidence-only
    severity: material
    topic: headcount-and-leadership-table
    missingEvidence: Management-confirmed current employee count and a breakdown by centres, corporate, technology, and product businesses.
    whyItMatters: Headcount efficiency is central to the operating leverage story but public sources only provide rough estimates.
    diligencePath: Request current HR MIS and prior 24-month headcount bridge by function.
    relatedQuestionRefs:
    - QO021
    relatedTableRefs:
    - TO002
  - type: missing-source
    severity: minor
    topic: secondary-liquidity-and-investor-map
    missingEvidence: Clear explanation of founder and investor selling motives, lock-ups, and post-listing ownership thresholds.
    whyItMatters: Partial liquidity is normal, but the investment committee should know whether the IPO doubles as a major cap-table reset.
    diligencePath: Review banker presentation and draft lock-up disclosures when available.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: material
    topic: profile-completeness-and-kpi-table
    missingEvidence: Management-confirmed company profile sheet covering exact locations, current headcount, and active members by format.
    whyItMatters: Several overview facts are directionally strong but still rely on mixed public sources rather than one signed company profile.
    diligencePath: Request management fact book or final RHP KPI appendix before IC.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table-coverage
    missingEvidence: A fully reconciled round-by-round and launch-by-launch chronology including every minor financing and product milestone.
    whyItMatters: The public story is sufficient for investment framing, but some earlier events still rely on narrative summaries rather than a complete company-issued chronology.
    diligencePath: Rebuild the milestone list from board materials, historical press releases, and final prospectus exhibits.
    relatedTableRefs:
    - TO004
