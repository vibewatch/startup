- id: capital-investor-base
  title: Capital history and investor base
  body: Cult.fit is heading toward the market after a fresh private financing, not after a clean pause in capital formation. The March 2026 Temasek-led infusion via MacRitchie added ₹440 crore and appears to have kept the company in a roughly flat-to-modestly-up unicorn valuation zone, based on public reporting rather than explicit DRHP pricing. The filing and supporting news also show a cap table with Tata Digital, Accel, Chiratae, IDG, Fitness First Luxembourg, and MacRitchie visible in the selling-shareholder roster, which means the IPO will serve both new-capital and liquidity objectives. That mix is neither inherently negative nor inherently bullish, but it does mean public buyers are stepping into an already-mature shareholder base where some early investors and even the founder are crystallizing partial exits. Public databases disagree on lifetime capital raised, so the exact total remains a diligence item. The right company-overview conclusion is that Cult.fit has raised ample backing,
    but the funding history should be normalized against the DRHP rather than any single venture database headline.
  claimRefs:
  - CO011
  - CO012
  - CO013
  - CO014
