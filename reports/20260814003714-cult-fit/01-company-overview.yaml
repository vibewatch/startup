chapter:
  number: 1
  title: Company Overview
  summary: Cult.fit is a Bengaluru-centered Indian fitness and active-lifestyle platform that combines a large offline gym network with a single app, memberships, at-home workouts, and product sales. The 2026 DRHP shows nearly 987,000 paid members, 708 fitness centres, and sharply improved FY26 financials, but also highlights execution, franchise, and concentration risks as the company heads toward an IPO.
sections:
- id: identity-model
  title: Identity and operating model
  body: Cult.fit enters the public-filed phase as a fitness and active-lifestyle platform rather than a narrow gym chain. The DRHP says the business is delivered through an integrated app, website, and offline channels, with fitness services spanning group classes, full-service gyms, sports access, and at-home workouts, while products span activewear, equipment, and accessories. That framing matters because the equity story depends on a combined membership, engagement, and cross-sell loop rather than on one SKU. The company is legally Cult.fit Limited, but the filing preserves its earlier CureFit and Cult.Fit private-company names, reflecting a transition from a broader wellness identity to a tighter consumer fitness brand. The corporate office remains in Bengaluru and the registered office in Chennai, so the center of gravity is operationally Bengaluru even as the legal structure has broadened for IPO readiness. Public-facing corporate and business portals show the company also packages
    franchise and B2B wellness offerings around the same brand infrastructure.
  claimRefs:
  - CO001
  - CO003
  - CO004
  - CO005
  - CO026
  - CO034
  - CO035
