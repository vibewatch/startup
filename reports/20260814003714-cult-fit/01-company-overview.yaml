- id: scale-milestones
  title: Scale, concentration, and milestones
  body: 'The strongest part of the overview is not the origin story but the current operating footprint. Cult.fit disclosed 987,020 paid members, 708 fitness centres, and 29 exclusive branded outlets as of March 31, 2026, alongside FY26 operating revenue of ₹17,206.06 million. Those figures make clear that the company is no longer an experiment; it is already one of India’s scaled organized fitness platforms. At the same time, the filing reveals meaningful concentration: Bengaluru and Hyderabad are the two deepest cities, and the top four metros produced 90.44% of fitness-services revenue in FY26. That concentration explains why metro execution quality, franchise consistency, and brand trust still matter more than a simple “20+ cities” headline. The milestone path from 2016 founding, to brand consolidation, to 2024 leadership reshuffle, to the 2026 DRHP also suggests a company trying to professionalize just as it proves operating leverage. Adverse review signals and fuzzy public headcount
    data do not erase the scale proof, but they do mean the overview should be read as scaled yet not fully de-risked.'
