- id: implications-and-open-diligence
  title: Implications and open diligence points
  body: The best evidence in Cult.fit's favor is that no rival in the public record seems to combine its exact physical, digital, product, and employer surfaces. The best evidence against an easy moat narrative is that each surface has its own specialist competitor and most customer switching costs remain low. That combination means the market is probably large enough for multiple winners, but it does not guarantee attractive economics for all of them. Investors should therefore ask less whether Cult.fit has competitors and more whether it can show materially better retention, utilization, and city-level payback than narrower rivals or cheaper substitutes. Public sources still leave meaningful gaps on competitor unit economics, franchise profitability, and true pricing power, so the chapter cannot conclude that Cult.fit has a dominant moat. It can conclude that the company has a broad strategic position that is worth something, but only if management can prove that the broader bundle converts
    into superior economics rather than just higher complexity. That is the real diligence divide between a broad consumer fitness brand and a durable compounder.
