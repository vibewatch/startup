  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: competitor-unit-economics
    missingEvidence: Comparable retention, CAC, utilization, and margin data for leading private competitors.
    whyItMatters: Without comparable unit economics, bundle breadth can be overvalued relative to specialist discipline.
    diligencePath: Request broker or primary interview evidence on Healthify, FITPASS, and major gym-chain economics.
    relatedQuestionRefs:
    - QP024
  - type: missing-source
    severity: minor
    topic: public-pricing-granularity
    missingEvidence: Current apples-to-apples pricing snapshots for equivalent plan durations, pauses, and cross-city access rules.
    whyItMatters: Public pricing shape is clear, but exact parity and discounting intensity remain under-documented.
    diligencePath: Mystery-shop competitor memberships and capture screenshots by city.
    relatedQuestionRefs:
    - QP023
  - type: stale
    severity: minor
    topic: new-entrants-refresh
    missingEvidence: A refreshed tracker of new marketplace, boutique, or AI-coaching entrants in 2027.
    whyItMatters: Competitive intensity can shift quickly with new app formats and funded fitness brands.
    diligencePath: Refresh app-store rankings, funding news, and franchise announcements before pricing decisions.
    relatedQuestionRefs:
    - QP025
  - type: missing-source
    severity: minor
    topic: franchise-profitability
    missingEvidence: Third-party or operator-level proof of franchise payback and same-centre economics for Indian fitness chains.
    whyItMatters: Franchise velocity can look impressive even when unit economics vary widely by city or owner quality.
    diligencePath: Interview franchisees and request payback cohorts from management or channel checks.
    relatedQuestionRefs:
    - QP012
    - QP024
