chapter:
  number: 3
  title: Competitors
  summary: 'Cult.fit competes across several models at once: branded gym chains such as Gold''s Gym India and Anytime Fitness, digital-first coaching platforms such as Healthify and FITTR, flexible access aggregators such as FITPASS, and international marketplaces such as ClassPass. Its edge is breadth and hybrid distribution, but the category remains highly multi-homed and price-sensitive, so moat durability depends more on brand, utilization, and operating consistency than on exclusive technology.'
sections:
- id: landscape-archetypes
  title: Landscape and competitor archetypes
  body: 'Cult.fit does not compete inside a tidy one-category box. The most useful landscape split is into branded gym chains, digital-first coaching platforms, flexible access aggregators, and status-quo substitutes such as local unorganized gyms or home workouts. Gold''s Gym India and Anytime Fitness are the clearest physical-format rivals because they compete for similar urban members on trust, standardization, and franchise expansion. Healthify and FITTR matter for a different reason: they prove that users will spend on digital coaching, nutrition, and community without needing an owned centre network. FITPASS and ClassPass matter because they normalize flexibility and variety, which can weaken loyalty to any one operator. This multi-archetype structure is why Cult.fit''s breadth is a genuine strategic differentiator but also why headline market-share comparisons are incomplete. Investors should read competition as a battle over format choice and habit ownership, not just as a simple
    league table of gym brands.'
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
