      - number: '4.4'
        title: Financial verdict and unresolved blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is more favorable than Cult.fit's older reputation would suggest. Revenue quality is
              improving, services appear structurally valuable, and the company has already demonstrated that scale can
              coexist with sharply better cash generation. That said, the chapter still stops short of a clean “proven
              compounder” label because several underwriting metrics remain missing: CAC, payback, mature-centre
              profitability, franchise economics, gross margins by category, and a normalized runway bridge if IPO
              timing slips. These are not cosmetic omissions; they are the metrics that determine whether a broad
              consumer fitness platform deserves a premium multiple or merely a narrative discount to simpler
              specialists. Investors can reasonably say Cult.fit has crossed from fragile to investable on trajectory.
              They cannot yet say the business is fully transparent or fully insulated from capital-intensity risk. In
              other words, the upside case is now plausible, but it still needs one more layer of unit-economic
              disclosure before conviction should be high.
