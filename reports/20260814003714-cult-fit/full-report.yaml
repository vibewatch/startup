      - number: '6.2'
        title: Customer proof, satisfaction, and durability visibility
        blocks:
          - type: paragraph
            body: >-
              Customer proof is visible, but it is uneven. On the positive side, the Apple App Store shows a 4.8 rating
              from roughly 136,000 ratings, MWM still shows a 4.8-star app signal with continued maintenance into August
              2026, and the Banashankari centre’s Justdial page shows a 4.2 average from 261 ratings. The qualitative
              reviews are also concrete enough to be useful: one App Store reviewer described losing more than 5 kg
              through the belly-burn progression, while another praised trainer support, centre atmosphere, and value.
              But the same review surface also carries caution flags. Other users complained about weak outcomes in
              Transform, inability to pause while travelling, macro discrepancies in delivered food, class-slot
              reductions after a centre’s hybrid conversion, and friction around search and usability in Cult Home.
              Off-platform adverse evidence is harsher still, with Trustpilot at 1.4 out of 5 and complaint boards
              surfacing support and access issues. The practical takeaway is that Cult.fit clearly has many real users,
              but the public record does not provide formal churn, renewal, or cohort metrics, so durability still has
              to be inferred from product design and rating volume rather than proven directly. That distinction is
              crucial, because satisfaction anecdotes can coexist with materially different renewal economics.
