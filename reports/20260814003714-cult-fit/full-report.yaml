      - number: '3.3'
        title: Switching costs, lock-in, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Switching costs in Indian fitness are structurally modest. A user can often move between local gyms,
              branded chains, app subscriptions, or marketplace passes with limited migration cost, especially if price
              and convenience dominate decision-making. Cult.fit does gain some extra stickiness when the app,
              community, products, and employer relationships work together, but that is better understood as bundling
              depth than as hard lock-in. The moat question therefore becomes operational: can Cult.fit translate
              breadth into lower churn, higher visit frequency, and more cross-sell than specialists can achieve in
              narrower niches? Competitive risk rises if workout content becomes more commoditized, if aggregators make
              venue loyalty irrelevant, or if franchise quality becomes inconsistent enough to damage the brand premium.
              These are not hypothetical concerns; they are the natural consequences of competing in a fragmented
              category where buyers can compare many alternatives and substitute formats quickly.
