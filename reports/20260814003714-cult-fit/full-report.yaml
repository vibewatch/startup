  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and mix
        blocks:
          - type: paragraph
            body: >-
              Cult.fit's financial story now starts with scale, not aspiration. Revenue from operations rose from
              ₹926.66 crore in FY24 to ₹1,215.54 crore in FY25 and ₹1,720.61 crore in FY26, showing that growth
              accelerated rather than stalled as the company approached public markets. The most important mix insight
              is that services remain the core engine. In FY26, services contributed roughly ₹1,197.8 crore and products
              ₹522.8 crore, while contemporaneous reporting said subscriptions still made up 64% of operating revenue.
              That tells investors two things at once: first, Cult.fit is still fundamentally a recurring access
              business; second, products and ancillary revenue have become large enough to matter to the model. This is
              attractive because it broadens wallet share, but it also means analysts cannot value the company as a pure
              software or pure gym operator. A proper revenue-quality read has to distinguish repeatable subscription
              behavior from faster-growing but less-proven products and other operating income.
