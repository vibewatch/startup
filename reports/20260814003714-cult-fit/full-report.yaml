      - number: '1.2'
        title: Founders, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              The founder narrative still matters for Cult.fit because the company was built by Mukesh Bansal and Ankit
              Nagori after their earlier consumer-internet experience at Myntra and Flipkart, and that pattern still
              shapes how investors interpret the business. Public profiles and company histories consistently show that
              the original Cult concept became the flagship wedge inside Cure.fit, which later made the shift to the
              Cult.fit brand strategically logical. Governance is now more distributed than in the early years: Naresh
              Krishnaswamy became CEO in 2024, Mukesh Bansal moved to executive chairman, and the DRHP names both a
              formal board and key management roster. The filing also explicitly says the company has no identifiable
              promoter, a listed-market friendly formulation that reduces single-promoter optics even though founder
              influence remains substantial. The mix of independent directors, finance leadership, and compliance
              leadership is a positive sign for IPO process readiness, but founder-brand continuity is still an
              execution dependency rather than a solved governance question.
