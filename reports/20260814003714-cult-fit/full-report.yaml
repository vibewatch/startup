        title: Customer base segmentation and scaled adoption
        blocks:
          - type: paragraph
            body: >-
              Cult.fit’s public customer story is strongest when read as a hybrid consumer-and-channel business rather
              than as a single-format gym operator. The open record shows direct paid members, digital workout users,
              sports users, outcome-program users, corporate employers, and partner gyms all sitting inside one
              commercial map. The most concrete scale data comes from the 2026 DRHP, which says Cult.fit served 690,657
              members in FY24, 833,032 in FY25, and 987,020 in FY26 through a network that grew from 588 to 708 fitness
              centres, with 594 centres app-integrated by FY26. ET Retail later described the network as about 700 gyms
              across 60+ cities with nearly one million active members, which is directionally consistent with the
              filing and supports the view that Cult.fit has already crossed the threshold from urban startup to scaled
              national platform. Beyond the direct member base, the corporate and partner-gym surfaces matter because
              they widen distribution without requiring every interaction to begin with a fully owned centre. That
              diversification is strategically useful, but investors still need to separate broad marketing scale from
              active, revenue-generating customer relationships. It is a wide funnel, but public sources still
              underspecify how much of that funnel is recurring, multi-product, and profitable.
