            body: >-
              The good news for diligence is that most of Cult.fit’s biggest risks are monitorable. Metro concentration
              can be tracked through city mix and same-centre productivity. Partner risk can be tracked through
              closures, audit scores, and review deterioration. Complaint burden can be tracked through refunds, support
              ageing, and slot-denial rates. Profitability durability can be tracked through centre utilization,
              contribution margins, and whether growth still requires heavy promotional intensity. IPO readiness can be
              tracked through DRHP updates, banker stability, and issue-size confidence. What would break the thesis is
              not one isolated complaint or one quarter of slower growth; it would be a combination of still-high metro
              dependence, worsening customer-friction data, weaker centre economics, and a less certain capital-markets
              path. Cult.fit does not currently look broken, but it does look like a business that still has to prove
