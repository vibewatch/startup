  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing lenses
        blocks:
          - type: paragraph
            body: >-
              The most important market-analysis discipline for Cult.fit is refusing to collapse every wellness estimate
              into one investable TAM. Free public sources use at least three different boundaries: the commercial
              fitness-facility market, the digital-fitness or app market, and the far broader wellness economy. For
              diligence purposes, the commercial-fitness lens is the anchor. Deloitte and the Health & Fitness
              Association frame that market at roughly $1.9 billion in 2024 with a path toward about $4.5 billion by
              2030, while Ken Research places today's organized-fitness market closer to $2.2 billion to $2.3 billion.
              Those figures are directionally aligned enough to be useful even if they differ by definition. The
              digital-fitness layer is additive rather than substitutive: IMARC points to a roughly half-billion-dollar
              fitness-app market today, growing faster than offline facilities. Taken together, these lenses support a
              real but not boundless opportunity. The correct market framing for Cult.fit is a hybrid urban
              organized-fitness platform with digital adjacency, not a claim on every Indian wellness rupee.
