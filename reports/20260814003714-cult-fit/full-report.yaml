      - number: '2.4'
        title: Contradictions, diligence gaps, and investment implications
        blocks:
          - type: paragraph
            body: >-
              Public market literature is useful for direction but weak on precision. Many free reports reuse the same
              quoted statistics, blur the line between facilities and digital subscriptions, or widen the frame to all
              wellness consumption without showing a revenue bridge that would matter to Cult.fit. That is why the
              market chapter should preserve contradiction rather than pretend to have one perfect number. The practical
              implication is that the market is supportive of scale but not sufficient to justify any valuation on its
              own. Investors should underwrite Cult.fit against an organized-fitness base case, layer digital upside
              separately, and treat non-metro expansion and employer-funded demand as upside requiring additional proof.
              The biggest remaining market diligence asks are city-level affordability, utilization thresholds outside
              the top metros, and updated penetration or app-growth inputs before the next valuation event. In short,
              the category is attractive enough to support a scaled leader, but its openness does not protect any one
              operator from churn, discounting, or execution mistakes.
            claimRefs:
