    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Cult.fit enters the public-filed phase as a fitness and active-lifestyle platform rather than a narrow gym
              chain. The DRHP says the business is delivered through an integrated app, website, and offline channels,
              with fitness services spanning group classes, full-service gyms, sports access, and at-home workouts,
              while products span activewear, equipment, and accessories. That framing matters because the equity story
              depends on a combined membership, engagement, and cross-sell loop rather than on one SKU. The company is
              legally Cult.fit Limited, but the filing preserves its earlier CureFit and Cult.Fit private-company names,
              reflecting a transition from a broader wellness identity to a tighter consumer fitness brand. The
              corporate office remains in Bengaluru and the registered office in Chennai, so the center of gravity is
              operationally Bengaluru even as the legal structure has broadened for IPO readiness. Public-facing
              corporate and business portals show the company also packages franchise and B2B wellness offerings around
              the same brand infrastructure.
