            body: >-
              The trust story is mixed. On the positive side, Cult.fit has a public security page that references
              vulnerability identification and bug-bounty style reporting, which is more than many consumer fitness
              brands provide. App-store scale and large user-review surfaces also show that the company operates a
              meaningful consumer product with wide distribution. On the negative side, these are only trust signals,
              not deep control proofs. Public sources do not provide uptime metrics, security audit detail, API
              architecture, or service-level reporting. Review sites and complaint surfaces remind investors that
              quality is experienced through local execution as much as through software, and that franchise or centre
              inconsistency can quickly become a product problem. This is important because Cult.fit's offering is
              inherently hybrid: even a strong app cannot protect the brand if local facilities, products, or service
