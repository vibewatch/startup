      - number: '2.2'
        title: Penetration, buyers, and segment structure
        blocks:
          - type: paragraph
            body: >-
              The headline bull case for India fitness is low penetration. Organized-fitness membership still reaches
              only a small share of the population, and supply remains fragmented across local gyms, branded chains,
              studios, and digital-only options. That creates clear headroom if formal players can convert awareness
              into habit and willingness to pay. But the buyer map is not uniform. Metro consumers are still the deepest
              immediate spend pool, while tier-two and tier-three cities represent the next growth leg rather than the
              current revenue base. Most consumer demand is self-pay, making location, trust, community, and
              affordability more important than abstract wellness narratives. Corporate wellness adds another payer, but
              it should be treated as an adjacency that can lower acquisition cost and widen utilization rather than as
              the main market. This matters for Cult.fit because its format range—consumer memberships, digital
              workouts, and employer programs—lets it address multiple journeys, but the company still wins only if it
              converts those journeys into repeat paid activity.
