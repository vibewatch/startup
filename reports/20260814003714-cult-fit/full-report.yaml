      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Capital dependence has fallen, but it has not disappeared. The March 2026 Temasek/MacRitchie round gave
              Cult.fit fresh balance-sheet support heading into the IPO process, and the DRHP's proposed fresh issue
              provides a second layer of planned capital. Borrowings declined to roughly ₹260.8 crore by FY26 close,
              which is helpful, but net worth also remained pressured by the accumulated loss history. The practical
              takeaway is that Cult.fit is no longer in obvious survival mode; however, it still benefits materially
              from capital-market access if it wants to expand centres, support products, and keep optionality while
              public-market timing remains open. This chapter therefore treats IPO readiness not just as an exit event,
              but as a financing strategy. Investors should be comfortable that the business is improving fast enough to
              deserve public-market consideration, while still recognizing that runway, capital commitments, and
              post-IPO balance-sheet flexibility are not fully transparent in the free public record.
