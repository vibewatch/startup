      - number: '3.2'
        title: Capabilities, pricing shape, and relative positioning
        blocks:
          - type: paragraph
            body: >-
              The cleanest strategic read is that Cult.fit is broader than most rivals, not necessarily cheaper or more
              locked-in. Its combination of centres, app engagement, products, and corporate programs is wider than what
              a single gym chain, digital-coaching app, or marketplace usually offers. Traditional chains still have
              credible advantages in physical standardization and franchise clarity; digital-first players have cleaner
              coaching-led economics; and aggregators win when customers prioritize variety and commitment flexibility.
              Public pricing transparency is imperfect across private companies, so the more reliable comparison is
              contract shape. Marketplaces teach users to treat access as interchangeable, while digital-first apps
              teach users to compare coaching intensity and app utility against venue access. This makes Cult.fit's
              competitive question less about one feature gap and more about whether the wider bundle can deliver better
              retention, greater wallet share, and enough perceived value to resist discounting.
