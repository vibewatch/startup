companyProfile:
  summary: >-
    Cult.fit is a Bengaluru-based Indian fitness and wellness company that has expanded from a gym-and-classes brand
    into a broader hybrid platform spanning memberships, digital workouts, sports bookings, products, and corporate
    wellness. Public filings and 2025-2026 reporting show a business with real national scale and improving economics,
    but still meaningful open questions on retention quality, city-level unit economics, and how much premium valuation
    its hybrid model truly deserves.
  founders:
    - name: Mukesh Bansal
      role: Co-founder
      background: Former Myntra founder; later moved from CEO to chairman as Cult.fit professionalized for a public-market path.
    - name: Ankit Nagori
      role: Co-founder
      background: Former Flipkart executive who helped build Cult.fit around integrated fitness and wellness services.
  foundingLocation: Bengaluru, Karnataka, India
  headquarters: Bengaluru, Karnataka, India
  productSummary: >-
    Membership-led access to gyms and classes, at-home workouts, sports bookings, outcome-led programs such as
    Transform, fitness products, and corporate wellness offerings.
  customerFocus: Urban Indian consumers, employers buying employee wellness, and partner gyms / franchise operators.
  businessModel: Consumer memberships and programs, product sales, corporate wellness, and partner / franchise distribution.
  stage: Pre-IPO growth-stage company after Series G
  fundingStatus: Raised a Temasek-backed Series G round in March 2026 and filed a 2026 DRHP for IPO preparation.
  disclosureProfile: private-disclosed
