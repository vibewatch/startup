chapter:
  number: 5
  title: Product & Technology
  summary: 'Cult.fit''s product surface is broad rather than deeply technical in the public record: one app coordinates gyms, classes, at-home workouts, sports bookings, weight-loss programs, product sales, and business offerings. The DRHP and official pages support strong claims about omnichannel product breadth and data-led operations, but they are much thinner on hard technical disclosures such as AI architecture, wearables integrations, or uptime metrics, leaving the technology edge more operational than proprietary.'
sections:
- id: surface-and-modules
  title: Product surface and module map
  body: 'The public record makes one thing very clear: Cult.fit is a broad consumer fitness platform, not a single-service app. The homepage and surrounding pages present memberships, workout formats, at-home content, sports bookings, luxury gyms, weight-loss programs, products, corporate offerings, and franchises as adjacent expressions of the same brand. That breadth is strategically meaningful because it lets the company acquire a user through one use case and monetize them across several others. The official pages also show that these surfaces are not only aspirational labels. At-home content advertises more than 1,200 workouts, Play adds sports bookings and guided sessions, Transform creates an outcome-led coaching layer, and the DRHP confirms a sizable products business. In other words, Cult.fit''s product map is wide enough that any technical or operating assessment has to consider an ecosystem, not just a gym app. The real diligence question is whether that width converts into better
    retention and economics than narrower products can achieve.'
  claimRefs:
  - CE001
  - CE002
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  - CE010
  - CE011
  - CE012
