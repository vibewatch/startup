- id: dependency-people-and-model-risks
  title: Dependencies, people, and economic durability are tightly linked
  body: Several of Cult.fit’s risks only look separate on paper. In practice they interact. Metro concentration makes the business sensitive to local competitive shocks; partner-gym and franchise expansion create brand and audit dependence; supplier exposure can pressure product economics; and leadership stability matters because the company is still balancing growth, profitability, and public-market preparation at once. The 2024 layoffs show that management has already taken cost actions, which can be a sign of discipline, but they also introduce morale and execution risks in a company that relies on both local operations and service recovery. Likewise, the CEO transition to Naresh Krishnaswamy with Mukesh Bansal as chairman preserves continuity, yet it inevitably raises questions about how much of Cult.fit’s operating edge still depends on founder influence versus repeatable systems. The financial story is improving, but without deeper public evidence on retention, centre productivity,
    and complaint resolution, investors are still being asked to extrapolate from directionally positive indicators rather than from a fully de-risked operating model.
