- id: operational-and-customer-risks
  title: Operational risk comes from keeping one promise across many formats and locations
  body: 'Cult.fit’s promise is attractive precisely because it is broad: one brand ties together gyms, classes, home workouts, sports, programs, and products. But that breadth is also the core operational risk. With roughly 700 centres, nearly one million members, and a majority of centres app-integrated, even small service problems can propagate widely. The app-review evidence shows this clearly. Positive reviews exist, but critical reviews also describe weak pause options, class-access deterioration after hybrid conversion, confusing UX, and mismatch between expected and delivered value. These are not abstract complaints; they are the kinds of issues that directly impair renewal and referral behavior. Because Cult.fit sells outcomes and convenience, service inconsistency is not a back-office problem—it is the customer proposition itself. Public sources also do not provide mature-centre quality data, complaint-resolution SLAs, or support load metrics. That leaves investors with meaningful
    evidence that the risk exists, but limited evidence that the operating system is already strong enough to absorb it at national scale.'
  claimRefs:
