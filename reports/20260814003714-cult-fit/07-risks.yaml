chapter:
  number: 7
  title: Risks
  summary: 'Cult.fit’s main risks are not existential demand risk but execution risk at scale: metro concentration, hybrid operating complexity, partner and franchise consistency, unresolved customer-friction signals, and the challenge of translating improving EBITDA into public-market-ready governance and disclosure. The strongest adverse evidence is repeated 2024 layoff coverage and complaint surfaces around support, slot availability, and value perception, while the DRHP highlights concentration and supplier exposure that still need close underwriting.'
sections:
- id: regulatory-and-legal-risks
  title: Regulatory and legal exposure is more visible in consumer friction than in headline lawsuits
  body: 'The public record does not show a dramatic disclosed court-case overhang, but that should not be confused with low legal exposure. Instead, Cult.fit’s more visible legal and regulatory risk comes from consumer-friction surfaces and the demands of becoming a listed company. Complaint boards show allegations around slot availability, payment demands after joining, and dissatisfaction with service delivery. Those are noisy sources, but they matter because they point to potential consumer-protection, refund, and disclosure issues in a business that sells subscriptions and outcome-oriented services. The open record is also thin on the formal compliance side: the security page shows a vulnerability-reporting surface, but not incident history or audit outcomes, while public sources do not provide a clean summary of notices, dispute trends, or privacy controls. At the same time, the company is moving through an IPO process, which raises the bar on disclosure precision and governance readiness.
    The correct read is not that Cult.fit has a known legal crisis, but that it needs far more transparent operating and compliance evidence before public investors can get comfortable.'
  claimRefs:
  - CR001
  - CR009
  - CR010
  - CR011
  - CR012
