- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Metro concentration
    - Top-four-city revenue mix
    - Fails to decline meaningfully or rises further
    - Reduce expansion assumptions and require city diversification plan
  - - Customer-friction burden
    - Complaints, refunds, slot denials, CSAT
    - Trend worsens over multiple quarters
    - Treat retention narrative as impaired
  - - Partner quality
    - Partner closures, rating slippage, audit failures
    - Persistent deterioration across network
    - Haircut asset-light expansion upside
  - - Profitability durability
    - Centre utilization and contribution margin
    - EBITDA gains reverse while growth slows
    - Re-rate underwriting to lower multiple
  - - IPO readiness
    - DRHP delays, banker churn, or revised issue size
    - Repeated slippage or repricing
    - Treat public-market path as uncertain
  notes: Kill criteria are framed around observable signals that can be refreshed before and after IPO launch planning.
