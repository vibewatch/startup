      - number: '7.2'
        title: 运营风险来自在多业态和多地点兑现同一个承诺
        blocks:
          - type: paragraph
            body: >-
              Cult.fit 的承诺之所以有吸引力，正因为它很宽：一个品牌把健身房、课程、居家训练、运动、项目和产品绑在一起。但这种广度也是核心运营风险。约 700 家中心、近一百万会员，再加上多数中心已接入
              app，即便小服务问题也可能大范围扩散。app 评论证据清楚显示了这一点。正面评论存在，但批评评论也描述了暂停选项弱、混合改造后课程准入变差、UX
              混乱，以及预期价值与交付价值不匹配。这些不是抽象投诉，而是会直接伤害续费和转介绍行为的问题。Cult.fit
              卖的是结果和便利，服务不一致不是后台问题，而是客户主张本身。公开来源也没有提供成熟中心质量数据、投诉解决 SLA
              或支持负载指标。因此，投资人能看到风险存在的实质证据，却只能看到有限证据证明运营系统已经强到足以在全国规模下吸收这些风险。
            claimRefs:
              - CR005
              - CR006
