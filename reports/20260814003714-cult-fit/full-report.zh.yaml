      - number: '2.2'
        title: 渗透率、买方与细分结构
        blocks:
          - type: paragraph
            body: >-
              印度健身的多头叙事，核心是低渗透率。组织化健身会员仍只触达很小一部分人口，供给也分散在本地健身房、品牌连锁、工作室和纯数字选择之间。如果正规玩家能把认知转成习惯和支付意愿，成长空间很清楚。但买方地图并不均匀。都市消费者仍是眼前最深的支出池，二三线城市更像下一段增长，而不是当前收入底盘。多数消费者需求来自自费，因此位置、信任、社群和可负担性，比抽象的健康叙事更重要。企业健康增加了另一类付款方，但应把它视为能降低获客成本、扩大利用率的邻接业务，而不是主市场。Cult.fit
              的业态范围——消费者会员、数字训练和雇主项目——让它能覆盖多条旅程，但只有把这些旅程转成重复付费活动，公司才算真正赢下市场。
