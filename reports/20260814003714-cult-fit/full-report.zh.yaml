    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              进入已提交公开文件阶段时，Cult.fit 更像一个健身与积极生活方式平台，而不是单一健身房连锁。DRHP 称，公司靠一体化
              app、网站和线下渠道交付业务；健身服务覆盖团体课、全服务健身房、运动场景准入和居家训练，产品则覆盖运动服饰、器械和配件。这个框架很关键，因为股权故事不押注单一
              SKU，而是押注会员、参与度和交叉销售拼成的闭环。公司法律主体是 Cult.fit Limited，但文件仍保留早期 CureFit 和 Cult.Fit
              私营公司名称，反映公司从更宽的健康身份收敛到更明确的消费者健身品牌。公司办公地仍在 Bengaluru，注册地在 Chennai；即便法律结构为 IPO 准备而拓宽，运营重心仍在
              Bengaluru。面向公众的公司和业务门户也显示，公司围绕同一品牌基础设施包装了加盟和 B2B 健康服务。
