      - number: '4.2'
        title: 盈利路径、成本结构与经营杠杆
        blocks:
          - type: paragraph
            body: >-
              最清晰的正面变化是盈利轨迹。三年间亏损大幅收窄，FY26 调整后 EBITDA 转正，FY25 和 FY26 经营现金流均为正。这足以说明 Cult.fit
              已经走出典型「不计成本增长」的创业公司画像。但还不足以说明经济性已经完全去风险。服务分部显然是利润引擎，而产品分部虽然增长强劲，仍拖累盈利。大额折旧、摊销和财务费用也说明，这门生意背着真实的固定成本重量。因此，媒体报道的普通
              EBITDA 与申报文件中的调整后 EBITDA 之间差异很重要：无论用哪个口径，趋势都不错，但幅度取决于会计处理和哪些成本被归一化。正确解读是，Cult.fit
              已有经营杠杆，但披露深度还不够，无法高置信度承销成熟且耐久的利润率。
