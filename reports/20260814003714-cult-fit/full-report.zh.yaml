    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层与规模化采用
        blocks:
          - type: paragraph
            body: >-
              公开客户故事最有力的读法，是把 Cult.fit
              看成混合的消费者与渠道业务，而不是单一业态健身房运营商。公开记录显示，直接付费会员、数字训练用户、运动用户、结果项目用户、企业雇主和合作健身房，都在同一张商业地图里。最具体的规模数据来自 2026 年
              DRHP：Cult.fit 通过一个从 588 家增至 708 家健身中心的网络，在 FY24 服务 690,657 名会员，FY25 服务 833,032 名，FY26 服务 987,020 名；到
              FY26，594 家中心已接入 app。ET Retail 后来把网络描述为覆盖 60+ 城市、约 700 家健身房、近一百万活跃会员，这与申报文件方向一致，也支持一种判断：Cult.fit
              已经跨过从城市创业公司到规模化全国平台的门槛。直接会员基础之外，企业和合作健身房触点也很重要，因为它们能扩大分发，而不要求每次互动都从完全自有中心开始。这种多元化有战略价值，但投资人仍需区分宽营销规模与活跃、能产生收入的客户关系。漏斗很宽，但公开来源仍没有充分说明其中多少是重复、多产品且有利润的。
