      - number: '8.3'
        title: 情景区间解释了为什么当前是持有，而不是通过
        blocks:
          - type: paragraph
            body: >-
              情景框架相对直接。多头情景下，Cult.fit 维持 30%+ 增长，保持 EBITDA 进展，并证明多表面模型能带来有意义的交叉销售和留存。这可能支撑 ₹16,000-18,000 crore
              左右估值区间，并接近传闻 IPO 叙事。基准情景下，增长保持健康，但证据缺口只部分关闭，₹12,000-14,000 crore
              左右估值更站得住，也更接近最近私募标记。空头情景下，上市可比公司更重要，增长或利润率信心走弱，可接受区间下移至 ₹9,000-11,000
              crore。如果公司能证明留存、城市经济性和投诉控制，同时把估值锚在最近标记附近，建议会转向通过。如果管理层坚持高价，而证据基础仍大致停在今天的位置，建议会转向不通过。目标不是虚假精确，而是让承销诚实面对公开记录能证明什么、不能证明什么。
