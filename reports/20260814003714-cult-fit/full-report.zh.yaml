      - number: '6.3'
        title: 扩张闭环与集中度风险
        blocks:
          - type: paragraph
            body: >-
              公开来源里，Cult.fit 的扩张逻辑很直接：品牌一旦获得用户，就尝试在不止一个表面上加深频次和钱包份额。基础健身房或课程会员，可以被导入居家训练、运动预订、Transform
              等结果导向项目或产品；另一条线，同一品牌也可以卖给雇主，作为健康工具，或卖给合作健身房，作为需求生成和运营层。这创造了多条先落地再扩张闭环，但公开证据更能证明这些闭环存在，而不是证明它们常常奏效。DRHP
              称前五大客户集中度不适用，降低了对少数企业账户依赖的担忧。但地域集中度抵消了这点：同一文件称，前四大城市贡献了 FY26 健身服务收入的 90.44%。换句话说，Cult.fit
              按账户类型看像是多元化，按都市深度看仍然集中。在承销激进扩张前，投资人应要求城市级会员和收入分群、合作伙伴生产率、具名企业案例，以及核心会员向高意图产品的附着率。没有这些细节，扩张仍然可信，但还没有被完整承销。下一步尽调，是把这些渠道故事转成可衡量的续费和附着经济性。
            claimRefs:
              - CU028
              - CU029
              - CU030
              - CU033
              - CU034
              - CU035
              - CU036
