  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律暴露更多体现在消费者摩擦，而不是头条诉讼
        blocks:
          - type: paragraph
            body: >-
              公开记录没有显示重大已披露诉讼包袱，但不能把这等同于法律暴露低。相反，Cult.fit
              更可见的法律和监管风险，来自消费者摩擦表面，以及成为上市公司带来的要求。投诉平台显示，有用户指称时段可得性、加入后付款要求和服务交付不满等问题。这些来源噪声很大，但它们重要，因为它们指向一家销售订阅和结果导向服务的公司可能面临的消费者保护、退款和披露问题。公开记录在正式合规侧也很薄：安全页面有漏洞报告入口，但没有事件历史或审计结果；公开来源也没有给出通知、争议趋势或隐私控制的清晰摘要。与此同时，公司正推进
              IPO 流程，这会提高披露精度和治理准备的门槛。正确读法不是 Cult.fit 已有已知法律危机，而是它需要更透明的运营和合规证据，才能让公开市场投资人放心。
            claimRefs:
              - CR001
              - CR009
              - CR010
              - CR011
              - CR012
