      - number: '3.4'
        title: 含义与未决尽调点
        blocks:
          - type: paragraph
            body: >-
              支持 Cult.fit
              的最佳证据是，公开记录里似乎没有对手能组合出它同样的实体、数字、产品和雇主触点。反驳轻松护城河叙事的最佳证据是，每个触点都有自己的专业竞争者，大多数客户转换成本也仍然低。这种组合意味着市场大概率足够容纳多个赢家，但不保证每个赢家都能拿到有吸引力的经济性。因此，投资人不该只问
              Cult.fit 有没有竞争对手，而应问它能否展示出显著优于更窄对手或更便宜替代品的留存、利用率和城市级回本。公开来源对竞争者单元经济、加盟盈利能力和真实定价权仍留下明显缺口，所以本章不能得出 Cult.fit
              拥有主导性护城河的结论。能得出的结论是，公司拥有有价值的宽战略位置，但前提是管理层能证明，更宽的组合会转化为更优经济性，而不只是更高复杂度。这才是宽消费者健身品牌与耐久复利企业之间真正的尽调分界线。
