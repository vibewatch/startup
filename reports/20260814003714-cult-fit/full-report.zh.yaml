      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >-
              Cult.fit 的创始人叙事仍然重要。公司由 Mukesh Bansal 和 Ankit Nagori 在 Myntra、Flipkart
              的消费者互联网经验之后创立，投资人至今仍会沿着这条经验线索理解业务。公开档案和公司历史都显示，最初的 Cult 概念后来成为 Cure.fit 内部的旗舰切入口，因此再转向 Cult.fit
              品牌在战略上顺理成章。治理已经比早期更分散：Naresh Krishnaswamy 于 2024 年出任 CEO，Mukesh Bansal 转任执行董事长，DRHP
              也列出正式董事会和关键管理人员名单。文件还明确称公司没有可识别发起人；这种更适合上市市场的表述，能削弱单一发起人观感，尽管创始人影响力仍然很强。独立董事、财务负责人和合规负责人组合，有利于 IPO
              流程准备，但创始人品牌延续仍是执行依赖，不是已经解决的治理问题。
