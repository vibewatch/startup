      - number: '3.3'
        title: 转换成本、锁定与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              印度健身的转换成本结构性偏低。用户往往能在本地健身房、品牌连锁、app 订阅或聚合平台通行证之间切换，迁移成本有限，尤其当价格和便利性主导决策时。Cult.fit 的
              app、社群、产品和雇主关系协同运转时，确实能增加一些粘性，但更应把它理解为组合深度，而非硬锁定。因此，护城河问题会落到运营上：Cult.fit
              能否把广度转化为更低流失、更高到访频次，以及比垂直专家更多的交叉销售？如果训练内容进一步商品化、聚合器让场馆忠诚变得无关紧要，或加盟质量不一致到伤害品牌溢价，竞争风险就会上升。这些不是假设性担忧，而是在碎片化品类里竞争的自然结果；买方可以快速比较许多替代方案和替代业态。
