        title: 财务结论与未解阻碍
        blocks:
          - type: paragraph
            body: >-
              财务结论比 Cult.fit
              早年的口碑更正面。收入质量在改善，服务看起来具备结构性价值，公司也已经证明，规模可以与现金生成能力大幅改善并存。即便如此，本章仍不能给出「已证明的复利企业」标签，因为多个承销指标仍缺失：CAC、回本期、成熟中心盈利能力、加盟经济性、按品类毛利率，以及若
              IPO 时点推迟后的标准化跑道桥。这些不是装饰性遗漏，而是决定宽消费者健身平台应拿溢价倍数，还是只应相对更简单垂直专家拿叙事折价的指标。投资人可以合理地说，Cult.fit
              已按趋势从脆弱跨到可投资。还不能说这门生意已完全透明，或已完全隔绝资本强度风险。换句话说，上行案例现在已经可信，但在信心足够高之前，还需要再多一层单元经济披露。
