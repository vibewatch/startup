        title: 客户证明、满意度与耐久性可见度
        blocks:
          - type: paragraph
            body: >-
              客户证明可见，但不均匀。正面看，Apple App Store 显示约 136,000 条评分、平均 4.8；MWM 仍显示 4.8 星 app 信号，并持续维护到 2026 年 8 月；Banashankari
              中心的 Justdial 页面显示 261 条评分、平均 4.2。定性评论也具体到足以使用：一位 App Store 评论者描述自己通过 belly-burn 进阶减重超过 5
              kg，另一位则称赞教练支持、中心氛围和性价比。但同一评论表面也有警示信号。其他用户抱怨 Transform 效果弱、旅行时无法暂停、配送餐食宏量营养不一致、某中心混合改造后课程时段减少，以及 Cult Home
              搜索和可用性摩擦。平台外负面证据更严厉，Trustpilot 只有 1.4/5，投诉平台也暴露支持和准入问题。实际结论是，Cult.fit
              显然有大量真实用户，但公开记录没有正式流失、续费或分群指标，因此耐久性仍只能从产品设计和评分量推断，而不能直接证明。这个区分很关键，因为满意度轶事可以与显著不同的续费经济性并存。
