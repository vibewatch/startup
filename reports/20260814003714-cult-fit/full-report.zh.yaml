  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与结构
        blocks:
          - type: paragraph
            body: >-
              Cult.fit 如今的财务故事从规模开始，而不是从愿景开始。运营收入从 FY24 的 ₹926.66 crore 升至 FY25 的 ₹1,215.54 crore，再到 FY26 的 ₹1,720.61
              crore，说明公司接近公开市场时，增长是在加速而非停滞。最重要的结构洞察是，服务仍是核心引擎。FY26 服务贡献约 ₹1,197.8 crore，产品贡献 ₹522.8
              crore；同期报道还称，订阅仍占运营收入 64%。这同时告诉投资人两件事：第一，Cult.fit
              本质上仍是一个重复准入业务；第二，产品和附属收入已经大到会影响模型。这有吸引力，因为它扩大了钱包份额，但也意味着分析师不能把公司估成纯软件公司或纯健身房运营商。要正确判断收入质量，必须区分可重复订阅行为，与增长更快但证明较少的产品和其他运营收入。
