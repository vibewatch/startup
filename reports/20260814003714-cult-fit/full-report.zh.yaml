      - number: '2.3'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强的增长驱动很直接：COVID 后健康意识提升，智能手机使用支撑持续数字互动，品牌化组织健身房相对碎片化本地供给拥有信任优势。这些驱动都契合 Cult.fit，因为它既不是纯线下，也不是纯数字。用户可通过
              app
              发现产品，靠课程和内容留存，再扩展到产品或雇主主导项目。但约束同样真实。本地非组织化健身房能用更低价格冲击品牌会员，可负担性就是硬约束；习惯延续是第二个问题，因为很多用户会试用健身产品，却无法维持重复行为。因此，这个品类的重点不是一次性认知，而是持续利用、留存设计和逐城经济性。也要正确理解混合行为：居家训练没有永久替代健身房，但仍是补充，并改变了用户对灵活性的预期。
              Cult.fit 这类运营商只有在混合互动提高留存、而不是蚕食高价值中心使用量时，市场才真正有吸引力。
