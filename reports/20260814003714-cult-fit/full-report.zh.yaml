  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：公司有吸引力，但在可见价格下只能持有
        blocks:
          - type: paragraph
            body: >-
              与其说 Cult.fit
              是一个在公开来源可见价格下显然值得买入的标的，不如说它是一家更容易让人喜欢的公司。正向论点是真实的：公司所在的印度健身市场仍显得低渗透且高增长，它已拥有近一百万会员的罕见本土规模，FY26 似乎也以 ₹1,720
              crore 收入和 EBITDA 转正标志着重要经济拐点。这些都是严肃溢价故事的要素。但反向论点同样真实。公开市场投资人需要在尚未看到 分群留存、城市级成熟中心经济性、投诉解决质量，或最新一轮融资加 OFS
              结构的精确股权表和优先权影响之前，就考虑溢价定价。因此，正确立场是中等信心、较高风险的持有。Cult.fit
              应该进入可投资名单，但价格纪律很重要。如果公司定价大致在最近私募标记附近或以下，并用更硬的运营证据支撑故事，判断可以改善。如果它在披露没有明显增强时转向 ~$2 billion 的 IPO
              要价，定价逻辑就显得吃紧。
            claimRefs:
              - CV001
