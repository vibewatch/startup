  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局与竞争者类型
        blocks:
          - type: paragraph
            body: >-
              Cult.fit 并不在一个整齐的单一品类盒子里竞争。最有用的格局划分，是品牌健身房连锁、数字优先教练平台、灵活准入聚合器，以及本地非组织化健身房或居家训练这类现状替代品。Gold's Gym India 和
              Anytime Fitness 是最清晰的实体业态对手，因为它们同样争夺城市会员，竞争点是信任、标准化和加盟扩张。Healthify 和 FITTR
              重要则是另一层原因：它们证明用户愿意为数字教练、营养和社群付费，而不一定需要自有中心网络。FITPASS 和 ClassPass
              之所以重要，是因为它们把灵活性和多样性常态化，可能削弱用户对任何单一运营商的忠诚。多类型竞争结构说明，Cult.fit
              的广度确实是战略差异点，但也说明头部市场份额对比并不完整。投资人应把竞争读成业态选择和习惯所有权之争，而不是健身房品牌的简单排行榜。
