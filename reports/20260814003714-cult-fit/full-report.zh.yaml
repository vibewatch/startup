companyProfile:
  summary: >-
    Cult.fit 是一家总部在 Bengaluru 的印度健身与健康公司，最早从健身房和课程品牌起步，如今已扩展成更广的混合平台，覆盖会员、数字训练、运动预订、产品和企业健康。公开申报文件与 2025-2026
    年报道显示，公司已有真实的全国规模，经济性也在改善，但留存质量、城市级单元经济模型，以及混合模式到底应拿到多少估值溢价，仍有不少问题待回答。
  founders:
    - name: Mukesh Bansal
      role: 联合创始人
      background: Myntra 前创始人；Cult.fit 为上市路径专业化后，从 CEO 转任董事长。
    - name: Ankit Nagori
      role: 联合创始人
      background: Flipkart 前高管，曾帮助围绕一体化健身与健康服务搭建 Cult.fit。
  foundingLocation: Bengaluru, Karnataka, India
  headquarters: Bengaluru, Karnataka, India
  productSummary: 以会员为核心，提供健身房和课程、居家训练、运动预订、Transform 等结果导向项目、健身产品，以及企业健康服务。
  customerFocus: 印度城市消费者、采购员工健康服务的雇主，以及合作健身房 / 加盟运营方。
  businessModel: 消费者会员与项目、产品销售、企业健康服务，以及合作伙伴 / 加盟分销。
  stage: Pre-IPO growth-stage company after Series G
  fundingStatus: 2026 年 3 月完成 Temasek 支持的 Series G 轮融资，并提交 2026 年 DRHP，为 IPO 做准备。
  disclosureProfile: private-disclosed
