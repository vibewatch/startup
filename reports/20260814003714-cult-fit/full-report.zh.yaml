      - number: '7.3'
        title: 依赖、人和经济耐久性紧密相连
        blocks:
          - type: paragraph
            body: >-
              Cult.fit
              的若干风险只是在纸面上看似分开，实际会相互作用。都市集中度让业务容易受本地竞争冲击影响；合作健身房和加盟扩张制造品牌和审计依赖；供应商暴露会压迫产品经济性；领导层稳定性也重要，因为公司仍在同时平衡增长、盈利和公开市场准备。2024
              年裁员说明管理层已经采取成本行动，这可能是纪律信号，但也给一家依赖本地运营和服务补救的公司引入士气与执行风险。同样，Naresh Krishnaswamy 接任 CEO、Mukesh Bansal
              出任董事长，保住了连续性，却不可避免地提出一个问题：Cult.fit
              的运营优势还有多少依赖创始人影响力，多少来自可复制系统？财务故事在改善，但若公开证据无法更深入说明留存、中心生产率和投诉解决，投资人仍是在从方向性正面指标外推，而不是在承销一个已完全去风险的运营模型。
