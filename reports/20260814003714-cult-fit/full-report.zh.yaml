        title: 融资历史与投资人基础
        blocks:
          - type: paragraph
            body: >-
              Cult.fit 是在刚完成新一轮私募融资后走向市场，而不是在资本形成完全暂停之后。2026 年 3 月，MacRitchie 代表 Temasek 领投注入 ₹440 crore；根据公开报道而非 DRHP
              明示定价，公司估值似乎仍处在大致持平到小幅上行的独角兽区间。申报文件和配套新闻还显示，售股股东名单中可见 Tata Digital、Accel、Chiratae、IDG、Fitness First
              Luxembourg 和 MacRitchie，意味着 IPO
              同时承担补充新资本和提供流动性的目标。这种组合既非天然负面，也非天然利多，但确实意味着公开市场买方将接手机构已相当成熟的股东结构，部分早期投资人甚至创始人也在兑现部分退出。公开数据库对累计融资总额说法不一，因此精确总额仍是尽调事项。公司概览层面的正确结论是：Cult.fit
              已拿到充足支持，但融资历史应以 DRHP 做归一化，而不是依赖某一个创投数据库标题。
