      - number: '7.4'
        title: 缓释措施存在，但多个能打破投资论点的因素可被近期衡量
        blocks:
          - type: paragraph
            body: >-
              尽调里的好消息是，Cult.fit
              最大的多数风险都可监控。都市集中度可通过城市结构和同中心生产率追踪。伙伴风险可通过关闭数量、审计分数和评论恶化追踪。投诉负担可通过退款、支持工单积压时间和时段拒绝率追踪。盈利耐久性可通过中心利用率、贡献利润率，以及增长是否仍需要重促销强度追踪。IPO
              准备可通过 DRHP
              更新、投行稳定性和发行规模信心追踪。真正打破投资论点的，不会是一个孤立投诉或一个季度增长放慢，而是高都市依赖仍未下降、客户摩擦数据恶化、中心经济性变弱，以及资本市场路径更不确定同时出现。Cult.fit
              现在看起来并未坏掉，但它仍像一家必须证明 FY26 改善叙事足够耐久、能经得起公开市场承销的公司。
