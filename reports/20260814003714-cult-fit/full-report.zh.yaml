      - number: '3.2'
        title: 能力、定价形态与相对定位
        blocks:
          - type: paragraph
            body: >-
              最干净的战略判断是：Cult.fit 比多数对手更宽，但不一定更便宜，也不一定锁定更强。它把中心、app 互动、产品和企业项目组合在一起，通常比单一健身房连锁、数字教练 app
              或聚合平台更宽。传统连锁在实体标准化和加盟清晰度上仍有可信优势；数字优先玩家有更干净的教练型经济模型；当客户优先考虑多样性和承诺灵活度时，聚合器会赢。私营公司之间公开定价透明度不够，因此更可靠的比较是合约形态。聚合平台
              教会用户把准入视为可替换，数字优先 app 则教会用户拿教练强度和 app 效用对比场馆准入。因此，Cult.fit
              的竞争问题不在某个功能缺口，而在更宽的组合能否带来更好留存、更高钱包份额，以及足够的感知价值来抵抗折扣。
