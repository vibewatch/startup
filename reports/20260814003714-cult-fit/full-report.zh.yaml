  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面与模块地图
        blocks:
          - type: paragraph
            body: >-
              公开记录清楚说明一件事：Cult.fit 是一个宽消费者健身平台，不是单一服务
              app。官网和周边页面把会员、训练形式、居家内容、运动预订、豪华健身房、减重项目、产品、企业服务和加盟，都呈现为同一品牌的相邻表达。这种广度有战略意义，因为公司可以用一个使用场景获客，再跨多个场景变现。官方页面也显示，这些表面不只是愿景标签。居家内容宣称有超过
              1,200 节训练，Play 增加运动预订和指导课程，Transform 搭出结果导向教练层，DRHP 也确认产品业务已有相当规模。换句话说，Cult.fit
              的产品地图足够宽，任何技术或运营评估都必须看生态，而不能只看健身房 app。真正的尽调问题是，这种宽度能否转化为比窄产品更好的留存和经济性。
