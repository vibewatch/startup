      - number: '8.4'
        title: 最后尽调问题决定好故事能否变成可投资价格
        blocks:
          - type: paragraph
            body: >-
              从投资委员会角度看，Cult.fit
              在市场上得分高，在客户证明和改善中的经济性上得分尚可，但在估值支撑和被充分证明的耐久性上明显弱。这是典型持有画像。因此，最后工作不该停留在泛泛欣赏，而应聚焦能证明或推翻溢价倍数的具体缺失数据：按计划划分的留存和流失、按城市划分的成熟中心经济性、支持和投诉解决指标，以及最新几轮和计划
              OFS 后的精确股权表 / 优先权机制。公开记录已经显示，Cult.fit
              可以成为一个规模化、品类领先的印度消费者平台。它尚未证明的是，公开市场投资人应该为这种地位支付远高于全球上市健身同业的倍数。在证据出现前，审慎做法是保持跟踪、建立多个情景模型，并且只在有纪律的入场价格下把业务视为可投资，而不是接受管理层或投行可能测试的任何价格。
