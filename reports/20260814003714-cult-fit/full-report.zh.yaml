      - number: '8.2'
        title: 与上市可比公司的估值缺口是核心问题
        blocks:
          - type: paragraph
            body: >-
              最重要的估值事实，是 Cult.fit 可见私募标记与上市健身可比公司交易区间之间的差距。多家 2026 年来源称，在 Temasek 2026 年 3 月投资后，最近私募估值接近 ₹12,600 crore，约
              $1.5 billion。这已经隐含约 7.3x FY26 收入。传闻中约 $2 billion 的 IPO 要价会把倍数推到约 9.9x FY26 收入。相比之下，本报告收集的上市健身可比公司按市值 /
              收入交易倍数明显更低：Peloton 约 1.0x，Planet Fitness 约 2.7x，Xponential 约 0.8x，Basic-Fit 约 1.5x。这些并非完美同类对比，因为 Cult.fit
              或许确实应因印度增长和混合广度拿到一些溢价。即便如此，这个差距也太大，不能轻描淡写带过。要承销它，投资人不只要相信 Cult.fit
              比上市同业更好，还要相信它在增长耐久性和长期变现上显著更好。今天的公开证据只能部分支撑这种信念。这就是为什么真正的争论是估值，而不是市场吸引力。
