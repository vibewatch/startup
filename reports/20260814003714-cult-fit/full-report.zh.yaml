      - number: '1.4'
        title: 规模、集中度与里程碑
        blocks:
          - type: paragraph
            body: >-
              概览里最强的不是起源故事，而是当前运营足迹。Cult.fit 披露，截至 2026 年 3 月 31 日，公司有 987,020 名付费会员、708 家健身中心和 29 家专属品牌门店，FY26 运营收入为
              ₹17,206.06 million。这些数字说明，公司不再是实验项目，而已是印度规模化组织健身平台之一。同时，申报文件也揭示了明显集中度：Bengaluru 和 Hyderabad
              是两个最深的城市，前四大都市贡献了 FY26 健身服务收入的 90.44%。这解释了为什么都市运营质量、加盟一致性和品牌信任，仍比一个简单的「20+ 城市」标题更重要。从 2016 年创立，到品牌整合、2024
              年领导层调整，再到 2026 年 DRHP，这条里程碑路径也说明，公司正一边证明经营杠杆，一边试图专业化。负面评论信号和模糊的公开员工数，不会抹掉规模证明，但也意味着应把概览读成「已有规模、尚未完全去风险」。
