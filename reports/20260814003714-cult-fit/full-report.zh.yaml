      - number: '2.4'
        title: 矛盾、尽调缺口与投资含义
        blocks:
          - type: paragraph
            body: >-
              公开市场材料能指方向，但精度不够。许多免费报告反复引用同一组统计，模糊设施和数字订阅之间的界线，或把口径扩到全部健康消费，却不给出对 Cult.fit
              有意义的收入桥。因此，市场章节应该保留矛盾，而不是假装存在一个完美数字。实际含义是：市场足以支撑规模，但单靠市场本身不足以证明任何估值。投资人应以组织化健身为基准情形承销
              Cult.fit，把数字上行单独分层，并把非都市扩张和雇主付费需求视为仍需额外证明的上行空间。最大市场尽调问题，是城市级可负担性、前几大都市之外的利用率阈值，以及下一次估值事件前更新后的渗透率或 app
              增长输入。简言之，这个品类足够有吸引力，可以托起一个规模化领导者，但市场开放度并不会保护任何单一运营商免受流失、折扣或执行错误影响。
