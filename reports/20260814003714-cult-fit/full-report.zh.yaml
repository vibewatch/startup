      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              资本依赖已经下降，但没有消失。2026 年 3 月 Temasek/MacRitchie 轮融资给 Cult.fit 在 IPO 流程前补了资产负债表支撑，DRHP 拟议的新股发行又提供了第二层计划资本。FY26
              末借款降至约 ₹260.8 crore，这是利好，但累计亏损历史仍压着净资产。实际结论是，Cult.fit
              已不再明显处于生存模式；不过，如果公司想扩张中心、支持产品，并在公开市场窗口仍未确定时保留选择权，它仍会显著受益于资本市场准入。因此，本章把 IPO
              准备不只视为退出事件，也视为融资策略。投资人可以接受业务改善速度已经快到值得公开市场考虑，同时也要承认，免费公开记录里对跑道、资本承诺和 IPO 后资产负债表灵活性的披露仍不完整。
