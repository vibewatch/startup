  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模口径
        blocks:
          - type: paragraph
            body: >-
              分析 Cult.fit 的市场时，最重要的纪律是不能把所有健康产业估算都压成一个可投资 TAM。免费公开来源至少使用三套边界：商业健身设施市场、数字健身或 app
              市场，以及更宽泛的健康经济。尽调应以商业健身口径为锚。Deloitte 和 Health & Fitness Association 将该市场估为 2024 年约 $1.9 billion，并预计 2030
              年接近 $4.5 billion；Ken Research 则把今天的组织化健身市场放在约 $2.2 billion 至 $2.3
              billion。即便定义不同，这些数字方向上足够一致，可以参考。数字健身层是增量，而不是替代：IMARC 指出，当前健身 app 市场约 $0.5
              billion，增速快于线下设施。合在一起，这些口径支持一个真实但并非无限的机会。Cult.fit 的正确市场框架，是带数字邻接的城市混合组织化健身平台，而不是对每一卢比印度健康消费的索取权。
