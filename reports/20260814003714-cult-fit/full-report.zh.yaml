    data:
      nodes:
        - id: reach
          label: 触达
          detail: 应用商店、搜索、雇主健康福利或加盟供给
        - id: convert
          label: 转化
          detail: 购买会员或访问权限
        - id: use
          label: 使用
          detail: 门店训练、课程、居家训练、运动预订
        - id: satisfy
          label: 满意
          detail: 训练师体验、便利性和结果质量
        - id: expand
          label: 扩展
          detail: 项目、产品、续费和转介绍
      edges:
        - from: reach
          to: convert
          label: 获取
        - from: convert
          to: use
          label: 激活
        - from: use
          to: satisfy
          label: 体验
        - from: satisfy
          to: expand
          label: 留存 / 交叉销售
        - from: satisfy
          to: convert
          label: 投诉可能打断续费
    approximationNotes: null
    claimRefs:
      - CU014
      - CU027
      - CU033
      - CU034
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: standard
    summary: 公开客户证据最强的是消费者规模信号，最弱的是企业结果具体度。
    data:
      columns:
        - 证据质量
        - 结果具体度
        - 留存可见度
        - 生产环境成熟度
      rows:
        - label: App Store 评价界面
          values:
            - 高体量
            - 喜忧参半但案例具体
            - 低
            - 真实消费者使用
        - label: Justdial 本地门店评价
          values:
            - 仅单店
            - 低至中
            - 低
            - 真实本地使用
        - label: 企业健康福利页面
          values:
            - 官方但自述
            - 低
            - 低
            - 声称渠道已上线
        - label: 合作健身房网络页面
          values:
            - 官方但自述
            - 低
            - 低
            - 声称渠道已上线
    approximationNotes: null
    claimRefs:
      - CU018
      - CU027
      - CU030
      - CU036
  - id: FU004
    title: 按渠道的公开客户证据
    type: bar
    layout: standard
    summary: 消费者渠道主导公开证据集，企业和留存证明仍更薄。
    data:
      items:
        - label: 消费者采用量
          value: 5
        - label: App 商店证明点
          value: 6
        - label: 本地门店证明点
          value: 2
        - label: 企业 / 渠道证明点
          value: 4
        - label: 直接留存指标
          value: 1
    approximationNotes: 数值统计本章引用的不同公开证明簇，而非客户总数。
    claimRefs:
      - CU018
      - CU030
      - CU031
      - CU036
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 当前最重的风险集中在都市圈集中度、服务质量漂移，以及 IPO 窗口期证明经济性可持续。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: 都市圈集中度
          values:
            - 高
            - 高
            - 低
            - 高
        - label: 服务质量 / 投诉
          values:
            - 中
            - 高
            - 低
            - 高
        - label: 合作伙伴 / 加盟一致性
          values:
            - 中
            - 高
            - 低至中
            - 中至高
        - label: 盈利能力持久性
          values:
            - 中
            - 高
            - 中
            - 中至高
        - label: IPO 时点 / 披露
          values:
            - 中
            - 中至高
            - 中
            - 中
    approximationNotes: null
    claimRefs:
      - CR002
      - CR015
      - CR021
      - CR023
      - CR030
      - CR040
  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: 多数风险会沿着几条共同通道传导：客户信任、门店效率、利润率和估值。
    data:
      nodes:
        - id: metro
          label: 都市圈集中度
        - id: quality
          label: 服务质量问题
        - id: partners
          label: 合作伙伴不一致
        - id: trust
          label: 客户信任 / 留存
        - id: margin
          label: 利润率持久性
        - id: ipo
          label: IPO 估值 / 时点
      edges:
        - from: metro
          to: margin
          label: 需求冲击压低利用率
        - from: quality
          to: trust
          label: 投诉和流失风险
        - from: partners
          to: quality
          label: 交付不一致
        - from: trust
          to: margin
          label: 续费走弱
        - from: margin
          to: ipo
          label: 估值倍数下调 / 延迟
    approximationNotes: null
    claimRefs:
      - CR015
      - CR021
      - CR023
      - CR030
      - CR040
  - id: FR003
    title: 依赖图
    type: dag
    layout: standard
    summary: Cult.fit 同时依赖都市圈、运营方、供应商、软件渠道和领导层执行。
    data:
      nodes:
        - id: metros
          label: 头部都市圈
        - id: operators
          label: 自营 + 合作运营方
        - id: suppliers
          label: 产品供应商 / 进口
        - id: platforms
          label: 应用商店 / 数字渠道
        - id: leadership
          label: 领导层与组织稳定性
        - id: outcomes
          label: 增长、质量与估值
      edges:
        - from: metros
          to: outcomes
          label: 收入集中
        - from: operators
          to: outcomes
          label: 体验一致性
        - from: suppliers
          to: outcomes
          label: 成本与可得性
        - from: platforms
          to: outcomes
          label: 获客 / 互动
        - from: leadership
          to: outcomes
          label: 执行纪律
    approximationNotes: null
    claimRefs:
      - CR007
      - CR008
      - CR018
      - CR019
      - CR025
      - CR027
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 建议链条很简单：强业务信号被高定价和证据不完整抵消。
    data:
      nodes:
        - id: scale
          label: 规模 + 市场
          detail: 会员基数大，印度健身市场在增长
        - id: improve
          label: 经济性改善
          detail: FY26 收入达到规模，EBITDA 转正
        - id: gaps
          label: 证据缺口
          detail: 留存、投诉解决、城市经济性、股权结构
        - id: premium
          label: 溢价要价
          detail: 私募和 IPO 估值高于上市可比区间
        - id: hold
          label: 建议
          detail: 除非价格或证据显著改善，否则观望
      edges:
        - from: scale
          to: improve
          label: 支撑兴趣
        - from: improve
          to: gaps
          label: 但未补上证明缺口
        - from: gaps
          to: premium
          label: 限制估值倍数支撑
        - from: premium
          to: hold
          label: 形成价格敏感立场
    approximationNotes: null
    claimRefs:
      - CV001
      - CV011
      - CV022
      - CV024
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 按收入倍数看，Cult.fit 的可见估值远高于上市健身可比公司。
    data:
      items:
        - label: Peloton
          value: 1
        - label: Planet Fitness
          value: 2.7
        - label: Xponential
          value: 0.8
        - label: Basic-Fit
          value: 1.5
        - label: Cult.fit 最近私募轮
          value: 7.3
        - label: Cult.fit 传闻 IPO
          value: 9.9
    approximationNotes: 数值为根据引用公开来源推导的市值 / 收入或隐含估值 / FY26 收入倍数，已四舍五入。
    claimRefs:
      - CV015
      - CV016
      - CV017
      - CV018
      - CV020
      - CV021
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 严谨区间应围绕最近私募估值，而不是最激进的 IPO 传闻水平。
    data:
      items:
        - label: 悲观
          low: 9000
          mid: 10000
          high: 11000
        - label: 基准
          low: 12000
          mid: 13000
          high: 14000
        - label: 乐观
          low: 16000
          mid: 17000
          high: 18000
    approximationNotes: 数值为指示性千万卢比估值区间，依据情景假设、可比公司溢价和公司 FY26 收入规模推导。
    claimRefs:
      - CV026
      - CV027
      - CV028
      - CV034
      - CV035
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 投委会式评分解释了为什么业务有吸引力，但估值仍难下手。
    data:
      items:
        - label: 市场
          value: 4.5/5
          detail: 印度健身市场大且在增长
          tone: positive
        - label: 客户证明
          value: 3.5/5
          detail: 规模强，公开质量信号喜忧参半
          tone: medium
        - label: 护城河
          value: 3.0/5
          detail: 混合业态广度 > 硬科技防御性
          tone: medium
        - label: 经济性
          value: 3.5/5
          detail: 在改善，但尚未完全去风险
          tone: medium
        - label: 风险
          value: 2.5/5
          detail: 都市圈、质量和投资论证缺口仍在
          tone: adverse
        - label: 估值
          value: 2.0/5
          detail: 可见估值相对上市同业偏贵
          tone: adverse
    approximationNotes: null
    claimRefs:
      - CV003
      - CV037
      - CV038
      - CV039
      - CV040
