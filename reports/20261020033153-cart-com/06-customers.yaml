      - [PacSun, Omnichannel retailer, "Named by Yahoo Finance among supported brands and retailers", "Not specified", null, "No scope, date, outcome, or current-status detail"]
      - [Tailored Athlete, Consumer brand, "Named by Yahoo Finance among supported brands and retailers", "Not specified", null, "No scope, date, outcome, or current-status detail"]
      - [Janie and Jack, Consumer retailer, "Named by Yahoo Finance among supported brands and retailers", "Not specified", null, "No scope, date, outcome, or current-status detail"]
    notes: >-
      This is a partial enumeration limited to names in the allocated Yahoo
      Finance article; null outcomes mean the fetched evidence did not quantify
      customer results.
    enumerationScope:
      coverage: partial
      basis: >-
