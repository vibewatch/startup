      topic: named-customers
      missingEvidence: >-
        Current contract scope, production status, deployment date, module mix,
        and quantified outcomes for the named customers.
      whyItMatters: >-
        A published customer name does not establish an active production
        deployment, realized value, retention, or expansion.
      diligencePath: >-
        Obtain permissioned reference calls and contract-level deployment data
        for a representative set of named enterprise customers.
      relatedTableRefs: [TU003]
