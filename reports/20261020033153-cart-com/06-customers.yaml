        cohort expansion, top-customer share, and revenue concentration.
      whyItMatters: >-
        Public customer breadth cannot establish durable recurring economics or
        quantify exposure to a small number of enterprise relationships.
      diligencePath: >-
        Request customer-level revenue cohorts, renewal schedules, the top-20
        customer concentration table, and signed-contract summaries from
        management, then reconcile them to audited revenue.
      relatedQuestionRefs: [QU008]
