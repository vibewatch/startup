        fetched customer evidence as of 2026-10-20.
    claimRefs: [CU005, CU008]
figures:
  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      The public evidence describes a route from a channel-specific need to
      broader managed services, while realized retention and expansion remain
      undisclosed.
    data:
      nodes:
        - label: Channel need
          detail: A brand or organization needs fulfillment, commerce, marketplace, or government logistics support.
          touchpoints: [DTC, retail, wholesale, marketplace, public sector]
        - label: Initial deployment
          detail: The customer adopts fulfillment, OMS, WMS, TMS, or a commerce service.
          touchpoints: [Operations team, commerce team, implementation]
        - label: Operational visibility
          detail: Customer-visible warehouse reports and unified order and inventory views support ongoing management.
          touchpoints: [Reporting, inventory visibility, shipment status]
        - label: Performance review
          detail: Service levels, accuracy, cost, and client business reviews are explicit operating priorities.
          touchpoints: [SLA review, accuracy, parcel cost]
        - label: Cross-sell
          detail: Adjacent software, logistics, marketplace, marketing, or engagement services can broaden the relationship.
          touchpoints: [Software, logistics, managed services]
        - label: Broader commerce relationship
          detail: Cart.com presents fulfillment, marketplaces, marketing, and customer acquisition and retention as connected growth and operations surfaces.
          touchpoints: [Fulfillment, marketplaces, marketing, customer acquisition and retention]
    approximationNotes: >-
      The sequence is an analytical map of publicly described offerings, not a
      measured funnel; no conversion, retention, or expansion rates are public.
    claimRefs: [CU010, CU011, CU013, CU015]
callouts:
  - calloutType: risk
    title: Customer scale is not retention proof
    body: >-
      The 6,000-plus customer claim, named brands, and annual order volume show
      reach, but none of the allocated sources discloses NRR, GRR, churn,
      renewals, contract duration, or top-customer concentration.
    claimRefs: [CU001, CU005, CU008]
