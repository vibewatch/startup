chapter:
  number: 6
  title: Customers
  summary: >-
    Cart.com presents a broad customer surface across B2C, B2B, public-sector,
    direct-to-consumer, retail, wholesale, and marketplace workflows, with current
    company materials claiming more than 6,000 customers. Public evidence does
    not disclose retention, contract duration, customer concentration, or
    customer-specific operating outcomes, so durability remains unverified.
sections:
  - id: customer-segments
    title: Customer segments and buying motions
    body: >-
      Cart.com addresses several related but operationally distinct customer
      groups. Company materials describe B2C, B2B, and public-sector
      organizations, while its solutions surface spans direct-to-consumer,
      retail, wholesale, and marketplace channels. The likely economic buyer
      varies by product: operations and supply-chain leaders buy fulfillment,
      order-management, and transportation capabilities; commerce leaders buy
      marketplace and growth services; and brands seeking a connected growth-and-
      operations provider can combine fulfillment and commerce services. A
      third-party 3PL directory also
      presents Cart.com as supporting DTC, Amazon, retail, wholesale, and returns
      workflows, but that supplier listing is not independent customer
      validation. The segment breadth creates cross-sell potential, yet it also
      makes the public headline customer count hard to interpret because a
      customer may use one service, multiple modules, or a fully managed
      relationship. Public-sector claims similarly establish an offered route to
      market, not disclosed contract wins or revenue contribution.
    claimRefs: [CU001, CU006, CU007, CU013, CU014]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-and-reference-proof
    title: Adoption scale and named-reference proof
    body: >-
      The strongest scale indicators are broad but not fully comparable. A
      current company-authored job description says Cart.com serves more than
      6,000 customers through 15 warehouses totaling more than 10 million square
      feet. FreightWaves reported nearly 6,000 brand partners and 10 fulfillment
      centers in 2022, while Cart.com's current solutions page says the network
      processes tens of millions of orders annually. These observations suggest
      material operating scale, but the terms customers, brand partners, and
      annual orders use different denominators and cannot establish account
      growth or utilization trends. Yahoo Finance names Toms Shoes, PacSun,
      Tailored Athlete, and Janie and Jack as supported brands and retailers,
      providing better evidence than an unlabeled logo wall. The article does
      not specify contract scope, production start date, customer outcome, or
      whether each relationship remains active as of the run date.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU007, CU008]
    tableRefs: [TU002, TU003]
  - id: durability-and-expansion
    title: Durability, expansion, and concentration risk
    body: >-
      Public materials describe mechanisms that could deepen a relationship:
      customer-visible warehouse reports, a shared order and inventory view,
      parcel-rate optimization, and a connected fulfillment and commerce
      proposition. The
      company also claims that new customers save 10-15% when moving to Cart
      Parcel pricing, but no cohort, baseline, sample size, or independently
      verified realization is provided. A current operations job description
      treats service levels, order accuracy, client satisfaction, and business
      reviews as improvement objectives; it does not report achieved levels.
      Most importantly, no allocated source discloses NRR, GRR, churn, renewal
      rates, contract duration, top-customer share, or revenue by channel.
      Simplify's commentary alleges repeated layoffs and cites an ADA website
      lawsuit, but supplies no underlying evidence in the fetched text, so it is
      an adverse lead rather than a verified customer-durability finding.
      Investment underwriting should therefore treat expansion as plausible and
      customer durability and concentration as material diligence gaps.
    claimRefs: [CU009, CU010, CU011, CU012, CU013, CU015, CU016]
    calloutRefs: []
