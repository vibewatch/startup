      - ["Brand partners", "Nearly 6,000", "2022-08-26", "Independent news report", "Historical evidence of a broad brand base", "Not comparable to current customer count; no retention bridge"]
      - ["Fulfillment network", "10 centers in 7 markets; two-day delivery to 95% of the U.S.", "2022-08-26", "Independent news report", "Historical national service reach", "Service-level performance and customer utilization not disclosed"]
