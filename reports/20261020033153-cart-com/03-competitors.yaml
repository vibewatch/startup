  - id: TP003
    title: Pricing, packaging, and switching comparison
    columns:
      - Alternative
      - Price, unit, or contract model
      - Included capability evidence
      - Discount or unknown
      - Competitive implication
    rows:
      - - Cart.com
        - Custom quote based on volume, SKU count, storage, channels, and service mix
        - Fulfillment, software, and managed services can be bundled
        - Realized rates, minimums, discounts, surcharges, and SLA credits are unknown
        - Bundle may simplify procurement but prevents public like-for-like comparison
      - - Stord or another direct platform peer
        - Unknown in assigned evidence
        - Unknown in assigned evidence
        - Obtain a matched-volume, matched-SLA bid
        - Direct commercial comparison remains open
      - - Incumbent or asset-light 3PL
        - Unknown in assigned evidence
        - Fulfillment scope and technology ownership require validation
        - Separate owned-versus-partner facility economics
        - Network-model differences may matter as much as headline rates
      - - Software-first provider
        - Unknown in assigned evidence
        - Potentially narrower software-led package; not verified for a named vendor
        - Validate onboarding, minimum volume, and services excluded
        - Could be a better fit for lower-volume merchants
      - - Internal build plus point solutions
        - Internal labor, software subscriptions, carrier terms, and vendor contracts
        - Merchant controls the selected stack and operating model
        - Opportunity cost and integration overhead are not publicly measurable
        - Avoids single-platform dependency but preserves coordination burden
    notes: >-
      Only Cart.com's public custom-quote model is evidenced in the assigned sources;
      all peer pricing remains an explicit diligence gap, and no listed amount should be
      read as realized customer pricing.
    claimRefs: [CP004, CP013, CP015]
figures:
  - id: FP001
    title: Directional positioning by solution breadth and infrastructure control
    type: quadrant
    summary: >-
      Analyst-applied ordinal positions place Cart.com toward the high-breadth,
      high-control corner, while alternatives remain directional pending named-peer
      validation.
    data:
      points:
        - label: Cart.com
          x: 5
          y: 5
          detail: Integrated software, managed services, and reviewer-reported owned U.S. facilities.
        - label: Stord or direct platform peer
          x: 3
          y: 3
          detail: Neutral midpoint placeholder because the assigned evidence names the peer but does not profile it.
        - label: Larger global 3PL incumbent
          x: 3
          y: 5
          detail: High-control category assumption with breadth left at midpoint pending named-provider evidence.
        - label: Asset-light network 3PL
          x: 2
          y: 1
          detail: Lower infrastructure-control archetype based on the partner-warehouse distinction in the retained review.
        - label: Software-first fulfillment vendor
          x: 2
          y: 1
          detail: Narrower, software-led archetype identified as an alternative for smaller merchants.
        - label: Internal multi-vendor stack
          x: 4
          y: 3
          detail: Merchant can assemble broad capabilities, but control varies across selected vendors and facilities.
    approximationNotes: >-
      X is analyst-scored solution breadth and Y is analyst-scored infrastructure
      control on a 1-to-5 ordinal scale. Scores are directional classifications derived
      from the retained source descriptions, not measured performance, market share, or
      customer preference; midpoint values flag unresolved named-peer evidence.
    claimRefs: [CP011, CP015, CP016]
callouts:
  - calloutType: risk
    title: The strongest adverse case is execution, not proven product inferiority
    body: >-
      Independent sources flag acquisition integration, thin unfiltered operating
      reviews, pricing opacity, and larger incumbents. Diligence should test facility-
      level consistency and customer economics before assigning a durable moat premium.
    claimRefs: [CP004, CP010, CP011, CP016]
