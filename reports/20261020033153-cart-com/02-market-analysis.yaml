callouts:
  - calloutType: risk
    title: Broad category growth does not establish company capture
    body: >-
      The retained sources do not quantify Cart.com's SAM, SOM, pricing, software mix, market
      share, utilization, or customer economics. Treat the broad fulfillment forecast as context
      and require operating data before applying a market-growth premium.
    claimRefs: [CM011, CM014, CM015, CM016]
