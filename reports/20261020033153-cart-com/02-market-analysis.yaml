      - [B2B brands and distributors, "B2B commerce or operations leader", "Sales operations and fulfillment teams", "Digital commerce or operations; unverified", "Configure portals, prices, orders, and delivery", "Need for customized multi-store and intracompany ordering"]
      - [Multi-marketplace sellers, "E-commerce or marketplace leader", "Merchandising and channel-operations teams", "E-commerce; unverified", "List products, synchronize inventory, reprice, and route orders", "Channel proliferation and inventory inconsistency"]
      - [Growth-oriented consumer brands, "CMO or digital-growth leader", "Performance marketing and customer-engagement teams", "Marketing; unverified", "Plan and execute full-funnel growth programs", "Need to coordinate acquisition with downstream operations"]
      - [Brands replacing fragmented vendors, "Cross-functional operating sponsor", "Operations, IT, commerce, and marketing teams", "Potentially shared; unverified", "Consolidate point tools and service providers onto one operating layer", "Vendor complexity, implementation friction, or missing end-to-end visibility"]
    notes: >-
      User roles follow the workflows described by Cart.com; payer, budget ownership, pricing,
      and adoption sequencing remain unverified and are explicit diligence gaps.
