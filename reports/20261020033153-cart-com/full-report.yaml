          label: Series A financing
          detail: FreightWaves later reported a $45M Series A.
          tone: positive
          claimRefs:
            - CO011
        - date: 2021-08
          label: Follow-on financing
          detail: FreightWaves reported a further $98M raise.
          tone: positive
          claimRefs:
