              - CP010
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP011
              - CP015
              - CP016
      - number: '3.3'
        title: Bundling can create switching friction, while commercial opacity weakens comparability
        blocks:
          - type: paragraph
            body: >-
              Cart.com sells an enterprise-oriented bundle through custom quotes, with no public rate card or disclosed
              minimum volume in the independent review. Combining fulfillment, software, marketplace operations, and
              managed services under one relationship can reduce vendor coordination and deepen workflow integration.
              The same design may increase switching effort because inventory placement, routing rules, integrations,
              and outsourced processes would have to move together. This is a mechanism-based inference, not evidence of
              realized retention: the assigned sources disclose neither contract duration nor churn, NRR, SLA credits,
              realized discounts, or implementation costs. Capital and an owned network may support national
              distribution, but buyers still need facility-level service data and comparable all-in bids before treating
              the bundle as economically superior.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP013
              - CP015
      - number: '3.4'
        title: Capital extends the roadmap; integration and incumbent response test the moat
        blocks:
          - type: paragraph
            body: >-
              The March 2026 investment gives Cart.com resources to expand its network, automation, predictive
              analytics, and agentic routing. Those plans can widen the suite, but financing is an input to competition
              rather than proof of a moat. The clearest adverse evidence is execution-related: one independent review
              flags acquisition integration risk and a thin public review trail for fulfillment, while an AI-generated
              Built In summary characterizes Cart.com as a challenger against larger incumbents and makes resilience
              contingent on integration quality. The defensible thesis is therefore conditional. Breadth and
              physical-software integration may differentiate Cart.com, but durability depends on consistent facility
              performance, successful integration, transparent enterprise economics, and proof that customers prefer the
              bundle over best-of-breed or internal options. None of those outcomes is established by the funding
              announcement itself.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The strongest adverse case is execution, not proven product inferiority
            body: >-
              Independent sources flag acquisition integration, thin unfiltered operating reviews, pricing opacity, and
              larger incumbents. Diligence should test facility- level consistency and customer economics before
              assigning a durable moat premium.
            calloutType: risk
            claimRefs:
              - CP004
              - CP010
              - CP011
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture is broad but economically opaque
        blocks:
          - type: paragraph
            body: >-
              Cart.com publicly presents an integrated offer spanning order-management software, commerce services,
              fulfillment, transportation, and related warehouse operations. That breadth creates several plausible
              monetization surfaces, but the reviewed materials do not state how much revenue comes from software,
              managed services, storage, handling, transportation, or value-added work. Nor do they disclose contract
              length, minimum commitments, usage tiers, revenue-recognition policies, or the split between recurring and
              transactional revenue. Fulfill.com says prospective clients receive exact rates only after a fit
              conversation and that rates depend on order volume, storage needs, and services. The investable conclusion
              is therefore a diversified operating model with unverified revenue quality, not a proven SaaS-like mix.
            claimRefs:
