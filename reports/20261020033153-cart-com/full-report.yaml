      - number: '1.4'
        title: Evidence quality and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              The available record is strongest on product breadth, named investors, and dated financing events; it is
              weakest on audited operating performance and present-day organizational scale. Built In's expressly
              AI-generated candidate FAQ flags undisclosed audited revenue and profitability and integration risk from
              acquisition-led expansion, but its disclaimer makes this a low-confidence adverse signal rather than
              verified proof. No precise current revenue, margin, EBITDA, cash-flow, customer, or headcount figure is
              supported by the assigned sources. Likewise, the full executive roster, voting control, liquidation
              preferences, debt covenants, and board rights remain private. Investment diligence should treat these as
              material evidence requests, not infer favorable answers from the absence of public disclosures or
              incidents.
