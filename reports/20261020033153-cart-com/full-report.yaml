  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is narrower than all e-commerce spending but broader than a conventional third-party
              logistics category. Cart.com markets a combined layer of omnichannel fulfillment and transportation, order
              and inventory orchestration, commerce software, growth marketing, marketplace enablement, and customer
              engagement. That scope makes the closest economic boundary the spend that brands and retailers direct to
              outsourced commerce operations and the software used to coordinate them, rather than the gross merchandise
              value flowing through merchants. Inventory procurement, manufacturing, carrier-owned linehaul, general
              ERP, and media inventory should remain outside the core boundary unless Cart.com directly earns revenue
              from them. Status-quo substitutes include internal operations, separate 3PL and software vendors, and
              narrower point solutions; the company itself frames channel proliferation as a source of added systems,
              vendor, and cost complexity.
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM007
              - CM013
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The only explicit external market-size series in the assigned evidence is TAMradar's estimate that
              e-commerce fulfillment services were $123.68 billion in 2024 and could reach $272.14 billion by 2030 at a
              14% CAGR. The fetched text does not disclose geography, methodology, sample, or whether software and
              managed commerce services are included, so those numbers are a broad context range rather than a Cart.com
              TAM. Company-footprint indicators offer a second lens but cannot be converted into revenue or market
              share: FreightWaves reported 10 fulfillment centers in seven markets in 2022, UpMarket reported 18
              facilities and more than 10 million square feet by May 2025, while TAMradar described 14 warehouses and
              8.5 million square feet in 2026. The differing definitions or vintages are not reconcilable from public
              evidence.
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM009
              - CM010
              - CM011
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM009
              - CM010
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM015
              - CM016
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The observable customer boundary is B2C and B2B brands and retailers with multi-channel selling or
              fulfillment complexity. The user group varies by module: supply-chain and warehouse teams use fulfillment
              and routing capabilities; e-commerce and merchandising teams manage inventory and listings across
              channels; customer-service teams modify and reroute orders; and CMOs or growth leaders consume managed
              marketing services. Contract ownership is therefore likely to sit with operations, supply chain, digital
              commerce, or marketing depending on the entry product, but the sources do not disclose actual budget
              ownership, contract structure, pricing, or cross-sell sequencing. Adoption is most plausible when a
              merchant has enough channel, inventory, or delivery complexity to value one operating layer over multiple
              point vendors; the company's claimed access to more than 2,000 channels and its investment in routing
              automation support that mechanism without quantifying conversion or ROI.
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM012
              - CM013
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM012
              - CM013
              - CM014
              - CM016
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption drivers include omnichannel complexity, pressure for faster delivery, the desire to coordinate
              inventory across locations, and demand for automation that can reduce shipping time and fulfillment cost.
              The March 2026 financing gives Cart.com additional capacity to invest in its physical network, predictive
              analytics, workflow automation, and agentic inventory routing, but funding is an input rather than proof
              of customer demand or attractive unit economics. The principal constraint is execution across a broad
              stack: Built In's AI-generated synthesis flags integration quality, operational efficiency, M&A
              absorption, and network scaling as the key resilience tests, while public sources provide no audited
              pricing, retention, contract-duration, margin, or customer concentration data. Valuation should therefore
              be tied to verified software mix, contribution margin, facility utilization, retention, and implementation
              payback rather than the broad fulfillment-market forecast.
            claimRefs:
              - CM011
              - CM012
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad category growth does not establish company capture
            body: >-
              The retained sources do not quantify Cart.com's SAM, SOM, pricing, software mix, market share,
              utilization, or customer economics. Treat the broad fulfillment forecast as context and require operating
              data before applying a market-growth premium.
            calloutType: risk
            claimRefs:
              - CM011
              - CM014
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The buyer chooses among platforms, specialists, incumbents, and internal coordination
        blocks:
          - type: paragraph
            body: >-
              Cart.com is not competing only against another third-party logistics provider. Its own positioning targets
              the complexity created when merchants use separate systems and vendors across channels, making an
              internally coordinated multi-vendor stack the core status-quo substitute. The direct shortlist also
              includes Stord, identified by an independent reviewer as an enterprise comparison, while software-first
              fulfillment vendors, asset-light networks, larger global incumbents, and channel-specific point solutions
              address narrower portions of the same job. Public evidence is uneven: the assigned sources describe
              Cart.com in depth but do not provide equivalent current profiles for most alternatives. Consequently, the
              landscape below distinguishes verified Cart.com attributes from competitor classes that require RFP-level
              validation rather than pretending every row is equally observed.
            claimRefs:
              - CP001
              - CP003
              - CP011
              - CP015
          - type: table
