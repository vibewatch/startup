            body: >-
              Public operating indicators show a substantial platform. Cart.com says its network processes tens of
              millions of orders annually and separately describes more than 8.5 million square feet of warehouse space.
              Fulfill.com lists a nationwide network of 14 fulfillment and distribution centers. FreightWaves reported
              in 2022 that the footprint had reached 10 centers in seven markets and that the company served nearly
              6,000 brand partners; those older figures should not be combined mechanically with current claims because
              the vintages differ. FreightWaves also reported revenue growth above 400% in 2021, but without the base or
              an absolute revenue figure. These are credible activity and footprint proxies, not substitutes for audited
