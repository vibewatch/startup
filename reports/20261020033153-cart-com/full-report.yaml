  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The evidence chain moves from financing and operating proof through pricing gaps and capital intensity to a
      research-more recommendation.
    data:
      nodes:
        - id: financing
          label: $180M growth equity
          detail: March 2026 financing confirms access to institutional capital.
        - id: scale
          label: Operating scale
          detail: Network, customer, and order-volume disclosures establish commercial substance.
        - id: hybrid
          label: Hybrid model
          detail: Software, services, facilities, and acquisitions require blended underwriting.
        - id: price-gap
          label: Current price unknown
          detail: The latest disclosed valuation remains the May 2025 $1.6B post-money mark.
        - id: terms-gap
          label: Economics unavailable
          detail: Financial metrics, ownership, dilution, and preference terms are not public.
        - id: recommendation
          label: Research more
          detail: Set entry discipline only after data-room evidence supports price and return.
    approximationNotes: >-
      The ordered flow is analytical rather than temporal; it contains no implied conversion rates, probabilities, or
      value-proportional sizing.
    claimRefs:
      - CV001
      - CV008
      - CV009
      - CV012
      - CV013
      - CV014
      - CV016
