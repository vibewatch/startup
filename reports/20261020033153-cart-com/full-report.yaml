chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Cart.com presents itself as a unified commerce and logistics provider rather than a pure software vendor
              or conventional third-party logistics operator. Its offer combines fulfillment infrastructure with order,
              inventory, and warehouse-management technology, plus marketplace, marketing, and customer engagement
              services. Tracxn dates the company to 2020, while both Tracxn and the March 2026 company release place
              headquarters in Houston. The integrated proposition is strategically coherent because software can
              coordinate demand, inventory, and routing across a physical network, but most detail about the resulting
              economics and service quality is company-issued. The evidence therefore establishes scope and identity
              more strongly than differentiated performance.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
