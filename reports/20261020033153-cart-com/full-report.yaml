  - id: FM001
    title: Evidence-constrained market sizing pyramid
    type: pyramid
    summary: >-
      The available evidence narrows from a broad fulfillment-services forecast to Cart.com's addressable subset, but
      public data does not quantify the lower four layers.
    data:
      items:
        - label: Broad e-commerce fulfillment services
          value: $123.68B in 2024
          detail: TAMradar estimate; geography and methodology not stated.
        - label: Broad market forecast
          value: $272.14B by 2030
          detail: TAMradar forecast at 14% CAGR; not a Cart.com TAM.
        - label: Omnichannel logistics subset
          value: Not publicly isolated
          detail: Relevant physical-services subset; no sourced spend estimate retained.
        - label: Tech-enabled orchestration subset
          value: Not publicly isolated
          detail: OMS, WMS, TMS, routing, and inventory-allocation spend is not separated.
        - label: Integrated software-plus-services segment
          value: Not publicly isolated
          detail: No source quantifies buyers purchasing Cart.com's combined stack.
        - label: Cart.com serviceable and obtainable share
          value: Not publicly disclosed
          detail: Requires pricing, revenue mix, win rate, retention, utilization, and segment data.
    approximationNotes: >-
      This is a boundary hierarchy, not a value-proportional TAM/SAM/SOM calculation; the two numeric top layers come
      from one low-confidence third-party estimate, and lower layers are intentionally left unquantified.
    claimRefs:
      - CM005
      - CM006
      - CM015
      - CM016
  - id: FP001
    title: Directional positioning by solution breadth and infrastructure control
    type: quadrant
    summary: >-
      Analyst-applied ordinal positions place Cart.com toward the high-breadth, high-control corner, while alternatives
      remain directional pending named-peer validation.
    data:
      points:
        - label: Cart.com
          x: 5
          'y': 5
          detail: Integrated software, managed services, and reviewer-reported owned U.S. facilities.
        - label: Stord or direct platform peer
          x: 3
          'y': 3
          detail: Neutral midpoint placeholder because the assigned evidence names the peer but does not profile it.
        - label: Larger global 3PL incumbent
          x: 3
          'y': 5
          detail: High-control category assumption with breadth left at midpoint pending named-provider evidence.
        - label: Asset-light network 3PL
          x: 2
          'y': 1
          detail: Lower infrastructure-control archetype based on the partner-warehouse distinction in the retained review.
        - label: Software-first fulfillment vendor
          x: 2
          'y': 1
          detail: Narrower, software-led archetype identified as an alternative for smaller merchants.
        - label: Internal multi-vendor stack
          x: 4
          'y': 3
          detail: Merchant can assemble broad capabilities, but control varies across selected vendors and facilities.
    approximationNotes: >-
      X is analyst-scored solution breadth and Y is analyst-scored infrastructure control on a 1-to-5 ordinal scale.
      Scores are directional classifications derived from the retained source descriptions, not measured performance,
      market share, or customer preference; midpoint values flag unresolved named-peer evidence.
    claimRefs:
      - CP011
      - CP015
      - CP016
  - id: FI001
    title: Revenue-to-gross-profit evidence bridge
    type: flow
    summary: >-
      Public sources show the operating sequence but not billing terms, revenue mix, direct costs, or gross profit at
      any stage.
    data:
      nodes:
        - id: demand
          label: Customer demand across DTC and B2B channels
          detail: Public materials describe omnichannel customer activity but disclose no contracted volume or concentration.
        - id: orchestration
          label: Order and inventory orchestration
          detail: Cart.com software routes and manages orders and inventory across channels and locations.
        - id: network
          label: Warehouse and fulfillment network
          detail: The company claims more than 8.5 million square feet and tens of millions of orders annually.
        - id: delivery
          label: Pick, pack, transportation, and value-added services
          detail: Multiple physical and managed services create labor, facility, automation, and carrier cost exposure.
        - id: billing
          label: Customer billing under undisclosed terms
          detail: Fulfill.com says exact rates depend on volume, storage, and services; no public price card was found.
        - id: gross-profit
          label: Revenue less direct delivery costs
          detail: Revenue mix, recognition, gross margin, and contribution margin remain unavailable.
    approximationNotes: >-
      Conceptual operating sequence only; node order does not represent disclosed conversion rates, revenue amounts,
      margins, or a quantified waterfall.
    claimRefs:
      - CI001
      - CI003
      - CI006
      - CI013
      - CI015
  - id: FE001
    title: Product and operating architecture map
    type: stack
    summary: >-
      Evidence-backed layers separate customer workflows, orchestration, infrastructure, physical execution, and
      controls without treating roadmap items as deployed.
    data:
      layers:
        - label: Customer and channel surfaces
          detail: B2B portals, marketplaces, storefronts, and customer-service workflows
          items:
            - B2B and intracompany commerce
            - Marketplace and ecommerce management
        - label: Commerce operations
          detail: Catalog, merchandising, CRO, pricing, feed, and repricing workflows
          items:
            - Product feed and inventory synchronization
            - Conversion optimization and merchandising
        - label: Order and inventory orchestration
          detail: Constellation OMS routing, allocation, modification, and fulfillment selection
          items:
            - Order lifecycle management
            - Inventory routing and allocation
        - label: Data and application infrastructure
          detail: Historically disclosed Google Cloud eventing, databases, containers, and analytics
          items:
            - Pub/Sub, Cloud SQL, Spanner, and GKE
            - BigQuery, Dataflow, and Container Registry
        - label: Physical execution
          detail: Warehouse, transportation, returns, and value-added service operations
          items:
            - Proprietary warehouse technology
            - Fulfillment and distribution network
        - label: Controls and roadmap
          detail: Merchant-of-record controls plus announced AI and workflow-automation investment
          items:
            - Payments, tax, reconciliation, and exception controls
            - AI capabilities and workflow automation roadmap
    approximationNotes: >-
      Logical layers are analyst-organized from cited public evidence; they do not establish current production
      boundaries, data flows, or deployment status.
    claimRefs:
      - CE005
      - CE008
      - CE010
      - CE011
  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      The public evidence describes a route from a channel-specific need to broader managed services, while realized
      retention and expansion remain undisclosed.
    data:
      nodes:
        - label: Channel need
          detail: A brand or organization needs fulfillment, commerce, marketplace, or government logistics support.
          touchpoints:
            - DTC
            - retail
            - wholesale
            - marketplace
            - public sector
        - label: Initial deployment
          detail: The customer adopts fulfillment, OMS, WMS, TMS, or a commerce service.
          touchpoints:
            - Operations team
            - commerce team
            - implementation
        - label: Operational visibility
          detail: Customer-visible warehouse reports and unified order and inventory views support ongoing management.
          touchpoints:
            - Reporting
            - inventory visibility
            - shipment status
        - label: Performance review
          detail: Service levels, accuracy, cost, and client business reviews are explicit operating priorities.
          touchpoints:
            - SLA review
            - accuracy
            - parcel cost
        - label: Cross-sell
          detail: Adjacent software, logistics, marketplace, marketing, or engagement services can broaden the relationship.
          touchpoints:
            - Software
            - logistics
            - managed services
        - label: Broader commerce relationship
          detail: >-
            Cart.com presents fulfillment, marketplaces, marketing, and customer acquisition and retention as connected
            growth and operations surfaces.
          touchpoints:
            - Fulfillment
            - marketplaces
            - marketing
            - customer acquisition and retention
    approximationNotes: >-
      The sequence is an analytical map of publicly described offerings, not a measured funnel; no conversion,
      retention, or expansion rates are public.
    claimRefs:
      - CU010
      - CU011
      - CU013
      - CU015
