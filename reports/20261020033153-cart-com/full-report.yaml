              - CE007
              - CE011
              - CE013
              - CE014
      - number: '5.2'
        title: Workflow, deployment, and physical execution
        blocks:
          - type: paragraph
            body: >-
              The clearest integration point is order and inventory orchestration. Constellation OMS is described as
              tracking, routing, allocating, and modifying orders and inventory across channels, while adjacent tools
              manage product feeds, repricing, and routing to first- and third-party fulfillment locations. Execution
              then moves into a warehouse network whose public descriptions vary by date and definition: FreightWaves
              reported ten fulfillment centers in seven markets in 2022, a current supplier profile lists fourteen
              fulfillment and distribution centers, and a reposted company job description states seventeen warehouses.
              These figures are not directly comparable and should not be merged into one current footprint metric.
              Site-level capacity, integration lead time, error rates, service-level commitments, and customer support
              escalation data remain diligence requests.
            claimRefs:
              - CE002
              - CE005
              - CE006
              - CE007
              - CE011
              - CE013
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE005
              - CE007
              - CE011
              - CE013
      - number: '5.3'
        title: Architecture, maturity, and roadmap
        blocks:
          - type: paragraph
            body: >-
              The most detailed technical disclosure is historical. A 2021 Google Cloud customer story named Pub/Sub,
              Cloud SQL, Spanner, Cloud Run, Google Kubernetes Engine, BigQuery, Dataflow, and Container Registry, and
              described Composer, Anthos, Vertex AI, Recommendations AI, and Bigtable as tests or future possibilities
              rather than deployed commitments. Current official material is less implementation-specific, emphasizing
              proprietary order, inventory, and warehouse management technology alongside automation in facilities. A
              2026 capital announcement says Cart.com intends to expand AI capabilities and workflow automation, but
              does not identify shipped functions, performance targets, or release dates. The architecture map therefore
              separates current marketed surfaces, historically named infrastructure, physical execution, and roadmap
              claims instead of implying one fully verified production stack.
            claimRefs:
              - CE004
              - CE008
              - CE009
              - CE010
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE004
              - CE008
              - CE011
              - CE012
              - CE015
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE008
              - CE010
              - CE011
      - number: '5.4'
        title: Differentiation, controls, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Cart.com's potential differentiation is the combination of software orchestration, managed commerce
              expertise, merchant-of-record controls, and owned or operated logistics capacity. The supplier profile
              lists certifications and registrations including C-TPAT, CGMP, FDA Registered, Hazmat, and Seller
              Fulfilled Prime, but a supplier listing is not an audit opinion and the scope by facility is not
              disclosed. Likewise, a reposted merchant-of-record role describes payment reconciliations, tax compliance,
              exception handling, and operational controls, which is evidence of an intended control process rather than
              proof of control effectiveness. The assigned evidence contains no diligence-grade security report, current
              architecture document, status history, uptime series, disaster-recovery test, penetration-test summary, or
              quantified implementation benchmark. Those missing artifacts limit confidence in scalability, resilience,
              and trust despite credible breadth.
            claimRefs:
              - CE004
              - CE008
              - CE010
              - CE011
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is the product thesis and an execution burden
            body: >-
              Cart.com can coordinate digital demand, order orchestration, and physical fulfillment, but the same
              breadth creates integration, service-consistency, and control-verification work that public marketing does
              not quantify.
            calloutType: insight
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
          - type: callout
            title: Trust evidence trails product breadth
            body: >-
              Public sources name operating controls and selected certifications, but they do not provide current
              security attestations, uptime history, architecture currency, or site-level certification scope.
            calloutType: risk
            claimRefs:
              - CE008
              - CE011
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying motions
        blocks:
          - type: paragraph
            body: >-
              Cart.com addresses several related but operationally distinct customer groups. Company materials describe
              B2C, B2B, and public-sector organizations, while its solutions surface spans direct-to-consumer, retail,
              wholesale, and marketplace channels. The likely economic buyer varies by product: operations and
              supply-chain leaders buy fulfillment, order-management, and transportation capabilities; commerce leaders
              buy marketplace and growth services; and brands seeking a connected growth-and- operations provider can
              combine fulfillment and commerce services. A third-party 3PL directory also presents Cart.com as
              supporting DTC, Amazon, retail, wholesale, and returns workflows, but that supplier listing is not
              independent customer validation. The segment breadth creates cross-sell potential, yet it also makes the
              public headline customer count hard to interpret because a customer may use one service, multiple modules,
              or a fully managed relationship. Public-sector claims similarly establish an offered route to market, not
              disclosed contract wins or revenue contribution.
            claimRefs:
              - CU001
              - CU006
              - CU007
              - CU013
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU006
              - CU007
              - CU013
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU010
              - CU011
              - CU013
              - CU015
      - number: '6.2'
        title: Adoption scale and named-reference proof
        blocks:
          - type: paragraph
            body: >-
              The strongest scale indicators are broad but not fully comparable. A current company-authored job
              description says Cart.com serves more than 6,000 customers through 15 warehouses totaling more than 10
              million square feet. FreightWaves reported nearly 6,000 brand partners and 10 fulfillment centers in 2022,
              while Cart.com's current solutions page says the network processes tens of millions of orders annually.
              These observations suggest material operating scale, but the terms customers, brand partners, and annual
              orders use different denominators and cannot establish account growth or utilization trends. Yahoo Finance
              names Toms Shoes, PacSun, Tailored Athlete, and Janie and Jack as supported brands and retailers,
              providing better evidence than an unlabeled logo wall. The article does not specify contract scope,
              production start date, customer outcome, or whether each relationship remains active as of the run date.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU008
      - number: '6.3'
        title: Durability, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Public materials describe mechanisms that could deepen a relationship: customer-visible warehouse reports,
              a shared order and inventory view, parcel-rate optimization, and a connected fulfillment and commerce
              proposition. The company also claims that new customers save 10-15% when moving to Cart Parcel pricing,
              but no cohort, baseline, sample size, or independently verified realization is provided. A current
              operations job description treats service levels, order accuracy, client satisfaction, and business
              reviews as improvement objectives; it does not report achieved levels. Most importantly, no allocated
              source discloses NRR, GRR, churn, renewal rates, contract duration, top-customer share, or revenue by
              channel. Simplify's commentary alleges repeated layoffs and cites an ADA website lawsuit, but supplies no
              underlying evidence in the fetched text, so it is an adverse lead rather than a verified
              customer-durability finding. Investment underwriting should therefore treat expansion as plausible and
              customer durability and concentration as material diligence gaps.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Customer scale is not retention proof
            body: >-
              The 6,000-plus customer claim, named brands, and annual order volume show reach, but none of the allocated
              sources discloses NRR, GRR, churn, renewals, contract duration, or top-customer concentration.
            calloutType: risk
            claimRefs:
              - CU001
              - CU005
              - CU008
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk posture and prioritization
        blocks:
          - type: paragraph
            body: >-
              The highest residual risks arise from the same integration that Cart.com presents as its advantage. The
              company says each added commerce channel can introduce systems, vendors, complexity, and cost, while its
              enterprise model serves DTC, retail, and wholesale from one inventory pool and a shared facility network.
              It also says the network processes tens of millions of orders annually. That breadth makes network
              execution, systems security, and inventory integrity high-impact exposures even though the allocated
              evidence does not quantify failure frequency. The heatmap therefore uses directional, not probabilistic,
              ratings. Capital risk also ranks high because the latest disclosed growth capital is earmarked for further
              logistics and product expansion, while earlier financing included debt. Kill criteria should include a
              material security or fulfillment incident without prompt remediation, covenant pressure that constrains
              operations, or loss of a major customer that reveals concentration above underwriting limits.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR013
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and security exposure
        blocks:
          - type: paragraph
            body: >-
              The retained evidence identifies control claims but not diligence-grade assurance. Fulfill.com lists
              hazmat handling, C-TPAT, CGMP, and FDA registration among Cart.com's capabilities, yet that supplier
              profile does not establish which legal entity, facility, product category, or audit period each item
              covers. Cart.com's own solutions page describes its software as secure, but the assigned pool contains no
              regulator filing, audit report, SOC report, penetration-test summary, incident log, litigation schedule,
              or insurance certificate. Absence of those records from the pool is not evidence that no incident or
              dispute exists. Before investment, counsel and technical diligence should map obligations by facility and
              data flow, verify every certification directly with the issuer, review privacy and security controls, and
              reconcile open claims, investigations, recalls, and coverage limits.
            claimRefs:
              - CR005
              - CR013
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR005
              - CR013
              - CR016
      - number: '7.3'
        title: Operational, integration, and quality risk
        blocks:
          - type: paragraph
            body: >-
              Cart.com's operating model combines physical fulfillment with order, inventory, warehouse, storefront, and
              channel software. FreightWaves reported that the company added 1.6 million square feet in 2022 and reached
              10 centers in seven markets; Fulfill.com now lists warehouse locations across eight states and a wide set
              of handling services. The platform was also assembled through multiple acquisitions: Wikipedia records six
              named deals across software, marketing, and logistics through March 2022, while Grokipedia reports 10
              acquisitions by the end of 2024. These facts support an integration-risk conclusion, not a finding that
              controls have failed. Diligence should test inventory accuracy, on-time shipping, loss and damage,
              returns, uptime, disaster recovery, acquired-system migrations, and facility-level quality metrics. A
              sustained service-level breach or unreconciled inventory variance should trigger thesis review.
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR008
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR013
              - CR014
      - number: '7.4'
        title: Capital, partner, and concentration dependencies
        blocks:
          - type: paragraph
            body: >-
              Springcoast characterizes Cart.com as a single platform spanning software, automation, and physical
              infrastructure, a combination that creates dependencies on financing, carriers, technology integrations,
              facilities, and enterprise customers. InnovationMap reported $180 million of growth capital from
              Springcoast in March 2026 and said the proceeds would support network scale, AI, and workflow automation.
              Earlier public history also shows that the 2022 financing included venture debt. Those facts establish
              that external capital has funded expansion, but they do not reveal cash available, cash burn, debt
              seniority, covenants, liquidation preferences, or refinancing needs. Nor do the retained sources disclose
              customer concentration, renewal rates, carrier concentration, cloud dependencies, or contractual remedies.
              Underwriting should require a cap table, debt schedule, cash bridge, top-customer cohort, vendor map, and
              tested transition plans before treating partner or liquidity exposure as mitigated.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR009
              - CR010
              - CR011
              - CR012
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Evidence quality is the immediate gating risk
            body: >-
              Do not interpret a missing incident, litigation, concentration, or covenant record in the assigned pool as
              proof of absence; underwriting should remain conditional on private control, legal, customer, and
              financing evidence.
            calloutType: risk
            claimRefs:
              - CR016
          - type: callout
            title: Monitorable thesis-break triggers
            body: >-
              Escalate or stop if diligence reveals an unremediated material security or fulfillment incident,
              restrictive covenant pressure, facility-level certification failure, material service-level deterioration,
              or customer concentration beyond the investment committee's limit.
            calloutType: recommendation
            claimRefs:
              - CR013
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision and price discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more, with medium confidence and high underwriting risk. Cart.com has
              attracted another $180 million of growth equity and has credible evidence of physical and software scale,
              but public evidence does not establish what an investor receives at today's price. The last explicit
              valuation in the reviewed pool is the $1.6 billion post-money mark attached to a $50 million financing in
              May 2025. The March 2026 announcement does not update that valuation or disclose instrument seniority,
              liquidation preferences, dilution, debt, or fully diluted ownership. Entry discipline should therefore be
              expressed as a condition, not a point estimate: underwriting at or above the old benchmark requires
              audited growth, margin, retention, cash-flow, and capitalization evidence that is not public.
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV014
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV013
              - CV014
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and comparable-method fit
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Cart.com combines enterprise commerce software with a nationwide fulfillment footprint,
              named brand relationships, and material order throughput. Fresh capital can fund automation, predictive
              analytics, agentic AI, and network investment, while Russell Klein's prior IPO and profitability
              experience adds a relevant governance signal. The anti-thesis is equally material: owned logistics,
              acquisitions, and continuing facility expansion create integration and capital-intensity risk that a
              software multiple would obscure. A pure 3PL comparison would likewise ignore software and managed-services
              value. The appropriate method is therefore a sum-of-parts or blended operating model, but the segment
              revenue, margin, retention, and cash-flow inputs required to execute it are absent.
            claimRefs:
              - CV002
              - CV003
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV014
      - number: '8.3'
        title: Scenario and return logic
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports conditional scenarios rather than precise probabilities or return multiples. A
              bull case requires verified enterprise retention, profitable software growth, improving fulfillment
              contribution margins, disciplined acquisition integration, and non-punitive round terms; only then could a
              premium to the 2025 benchmark be evaluated. The base case treats $1.6 billion solely as a stale reference
              and withholds a valuation range until normalized financials and ownership terms are available. The bear
              case assumes that repeated capital needs reflect low cash conversion or integration drag, warranting a
              material discount to the historical mark. No scenario can produce a target return without entry price,
              dilution, preference stack, holding period, and credible exit proceeds.
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV009
              - CV010
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV009
              - CV010
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is mixed. A scaled network, enterprise customer references, substantial transaction volume,
              and an added director with IPO experience are positive prerequisites, but they do not substitute for
              audited segment economics, durable retention, or a clean capitalization table. Before underwriting an
              exit, diligence should obtain monthly cohort revenue and gross margin by software, fulfillment, and
              managed services; facility utilization and contribution margin; customer concentration and NRR/GRR; cash
              burn and debt schedules; and every preferred-stock and growth-equity term. Thesis breaks include another
              large raise without measurable profitability progress, worsening customer concentration, integration
              slippage, or a preference stack that prevents common-equity investors from achieving the required return
              even at an operating exit.
            claimRefs:
              - CV001
              - CV008
              - CV009
              - CV012
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV008
              - CV009
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price is the gating variable
            body: >-
              The company may be operationally substantial, but the reviewed evidence cannot support a buy decision
              without the March 2026 round price, preference stack, audited segment economics, and a fully diluted
              ownership schedule.
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV013
              - CV014
              - CV016
