            title: Financing is not runway
            body: >-
              The $180 million growth-equity round provides additional capital, but public sources do not disclose
              Cart.com's cash balance, burn, debt service, or operating cash flow. A runway estimate would therefore be
              invented.
            calloutType: risk
            claimRefs:
              - CI005
              - CI007
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Cart.com's product is better understood as an operating system plus services for commerce than as a single
              application. Its current official surfaces cover marketplace management, conversion optimization,
              merchandising, B2B portals, channel listing, order management, and fulfillment. The customer workflow can
              therefore run from product discovery and catalog preparation through inventory synchronization, order
              routing, physical delivery, and post-purchase support. That breadth may reduce vendor coordination for a
              brand, but it also makes product quality depend on both software and human operations. The public evidence
              describes what is offered and how teams work, not attach rates, module-level revenue, implementation
              duration, or realized outcomes. The module matrix consequently treats advertised capabilities as marketed
              or operating surfaces rather than proof of uniform deployment across customers.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE013
              - CE014
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
