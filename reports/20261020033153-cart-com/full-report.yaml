              - CP014
              - CP015
      - number: '3.2'
        title: Breadth is differentiated, but relative performance is not benchmarked
        blocks:
          - type: paragraph
            body: >-
              Cart.com's public differentiation is the combination of fulfillment operations, proprietary
              order-management capabilities, and commerce services rather than a single point product. Its solutions
              page describes order routing, inventory allocation, B2B fulfillment, marketplace operations, marketing,
              and customer engagement, while an independent review describes an integrated OMS, WMS, and TMS stack. That
              is a meaningful consolidation proposition for enterprise buyers. It is not, however, proof that Cart.com
              beats named peers on cost, accuracy, uptime, or implementation speed. The matrix therefore marks peer
              cells unknown where the assigned pool lacks direct evidence. The positioning map uses directional ordinal
              scores tied to documented business-model breadth and infrastructure control; it is not a market-share
              ranking or an independently measured performance benchmark.
            claimRefs:
              - CP001
              - CP002
              - CP014
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
