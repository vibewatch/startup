      - number: '1.2'
        title: Capital formation and governance
        blocks:
          - type: paragraph
            body: >-
              The clearest current financing fact is the $180 million growth-equity investment announced in March 2026
              and led by Springcoast Partners, with PayPal Ventures, Arsenal Growth Equity, Mercury Fund, and Oak HC/FT
              also identified as investors. The transaction added Springcoast executive Russell Klein to the board.
              Historical funding evidence is less clean: Tracxn reports $735 million over twelve rounds, whereas Houston
              Innovation Map reports $872 million before the latest financing and more than $1 billion afterward. Those
              totals should not be merged because they may use different definitions for equity, debt, and acquisition
              financing. Tracxn separately records $105 million of BlackRock venture debt in July 2024, underscoring the
              need for a security-level capitalization schedule.
