      - number: '4.3'
        title: Physical-network exposure dominates the underwriting questions
        blocks:
          - type: paragraph
            body: >-
              The model couples software orchestration with warehouses, labor, automation, transportation, and
              inventory-routing operations. That combination may improve customer outcomes, but it also creates
              facility, labor, carrier, and automation costs that a software-only benchmark would miss. The company’s
              stated plan to invest new capital in its nationwide footprint, workflow automation, predictive analytics,
              and AI reinforces the importance of those operating dependencies. An industry-adjacent analysis further
              warns that software-led routing requires tighter network orchestration and capital for distribution
              centers and automation. No reviewed source quantifies gross margin, contribution margin per order,
              utilization, labor cost per order, CAC, payback, retention, or customer concentration, so a margin path
              cannot be underwritten from public evidence.
            claimRefs:
              - CI006
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: New equity adds flexibility, not a disclosed runway
        blocks:
          - type: paragraph
            body: >-
              Cart.com announced a $180 million growth-equity investment led by Springcoast Partners in March 2026. The
              company and Digital Commerce 360 describe the intended uses as software and AI development, automation,
              operational improvement, and expansion of U.S. fulfillment infrastructure. InnovationMap reported that
              cumulative funding since 2020 moved above $1 billion and cited an approximately $1.6 billion valuation
              before the new round, but cumulative financing is not cash on hand. The financing announcement says the
              investment strengthens the balance sheet yet provides no cash balance, burn rate, debt schedule, covenant
              terms, runway, or next-round trigger. Financial diligence should therefore treat capital adequacy,
              profitability, and dilution as open underwriting items.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
