      - number: '1.3'
        title: Scale indicators and development path
        blocks:
          - type: paragraph
            body: >-
              Public scale indicators show a capital-intensive expansion path but are not consistently current.
              FreightWaves reported that the network reached ten fulfillment centers across seven markets in August
              2022, with two-day delivery coverage for 95% of the United States and nearly 6,000 brand partners. An
              undated Fulfill.com profile now lists fourteen fulfillment and distribution centers and warehouse
              locations in eight states, but that supplier listing is not independent verification. The financing
              chronology and Tracxn's 2023 unicorn designation show repeated access to capital. However, stale customer
              counts and undated footprint data should not be used as current cover metrics without management
              confirmation, facility records, and customer-level reconciliation.
            claimRefs:
