evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited revenue, gross margin, EBITDA, cash flow, cash balance, segment economics, and a security-level
      capitalization schedule.
    whyItMatters: >-
      Funding raised does not establish cash availability, profitability, or the economic value accruing to a new
      security.
    diligencePath: >-
      Obtain audited statements, monthly management accounts, bank statements, a fully diluted cap table, and financing
      documents through the data room.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: stale
    severity: material
    topic: operating-scale
    missingEvidence: >-
      Current customer count, customer concentration, active-site list, throughput, headcount, retention, and workforce
      composition.
    whyItMatters: >-
      The retained customer count is from 2022 and the fourteen-center supplier listing is undated, so neither is a
      reliable current cover metric.
    diligencePath: >-
      Reconcile CRM exports, customer contracts, payroll records, facility leases, and monthly network-capacity reports
      as of the run date.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership-governance
    missingEvidence: >-
      A complete current executive, director, observer, and committee roster with appointment dates, affiliations,
      voting rights, and departures.
    whyItMatters: >-
      The public sample cannot establish functional coverage, independence, investor control, or key-person succession
      readiness.
    diligencePath: >-
      Obtain the board deck, governance chart, charter, bylaws, voting agreements, committee mandates, and current
      executive roster.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: minor
    topic: adverse-evidence
    missingEvidence: >-
      Independent primary evidence on litigation, regulatory matters, outages, service-level failures, layoffs, and
      acquisition-integration outcomes.
    whyItMatters: >-
      The retained adverse source is explicitly AI-generated and cannot by itself verify whether the flagged execution
      risks have occurred.
    diligencePath: >-
      Run legal and regulatory searches, review incident and insurance records, and interview reference customers and
      former employees.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A transparent market study separating fulfillment, logistics software, commerce software, and managed services by
      geography and customer segment.
    whyItMatters: >-
      Without category definitions and methodology, the broad forecast cannot be converted into a defensible Cart.com
      TAM, SAM, or valuation growth rate.
    diligencePath: >-
      Obtain the underlying market model or a reputable analyst report with definitions, geography, base-year values,
      and inclusion rules, then reconcile it to Cart.com's product-level revenue.
    relatedQuestionRefs:
      - QM003
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: obtainable-market
    missingEvidence: >-
      Contract pricing, budget owner, sales-cycle, win-rate, retention, customer concentration, revenue mix,
      contribution margin, and facility-utilization data.
    whyItMatters: >-
      These metrics determine serviceable demand, switching friction, attainable share, and whether market growth
      converts into durable gross profit.
    diligencePath: >-
      Request a cohort-level commercial data room export, product-level P&L, top-customer contracts, pipeline conversion
      history, and facility-level utilization schedule.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: peer-pricing
    missingEvidence: >-
      Matched competitor bids covering volume, SKU count, storage, channels, fulfillment locations, surcharges,
      discounts, implementation fees, and SLAs.
    whyItMatters: >-
      Public custom-quote language cannot establish Cart.com's realized price or economic advantage against a comparable
      alternative.
    diligencePath: >-
      Run a normalized RFP across Cart.com, Stord, one incumbent 3PL, and one software-first provider using the same
      operating profile and contract term.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP001
      - TP003
  - type: missing-source
    severity: material
    topic: comparative-trust
    missingEvidence: >-
      Independent facility-level accuracy, on-time shipment, outage, incident, implementation, security, compliance, and
      customer-reference evidence for Cart.com and named peers.
    whyItMatters: >-
      Product breadth does not establish reliable execution or comparative trust, and the retained review explicitly
      describes the public review trail as thin.
    diligencePath: >-
      Obtain SOC reports and incident history, sample facility scorecards, SLA performance, and reference calls with
      comparable omnichannel customers.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP002
  - type: enumeration-incomplete
    severity: material
    topic: named-competitor-benchmarks
    missingEvidence: >-
      Current named-provider profiles covering network scale, funding, customer segment, software ownership, channel
      scope, strategic direction, and contract model across each competitor class.
    whyItMatters: >-
      Category archetypes are useful for framing buyer choice but cannot prove durable differentiation or precise
      relative positioning.
    diligencePath: >-
      Build named profiles from official product and pricing materials, customer references, contracts, independent
      reviews, and current funding disclosures.
    relatedQuestionRefs:
      - QP002
      - QP004
      - QP010
    relatedTableRefs:
      - TP001
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: financial disclosure
    missingEvidence: Audited trailing revenue, revenue mix, recognition policy, gross margin, EBITDA, and free cash flow.
    whyItMatters: >-
      These inputs determine financial scale, revenue quality, operating leverage, and whether growth is creating
      enterprise value.
    diligencePath: >-
      Review audited financial statements, monthly management accounts, and revenue-recognition memos reconciled to bank
      and billing data.
    relatedQuestionRefs:
      - QI001
      - QI003
      - QI005
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Customer contracts, invoices, price cards, discount schedules, minimum commitments, surcharges, and renewal terms.
    whyItMatters: Public service descriptions do not establish realized pricing, recurring mix, discounting, or contract durability.
    diligencePath: >-
      Sample contracts and invoices across software, fulfillment, transportation, and managed-services cohorts and
      reconcile them to recognized revenue.
    relatedQuestionRefs:
      - QI001
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit economics
    missingEvidence: >-
      Contribution margin per order, warehouse utilization, labor cost per order, carrier pass-throughs, returns cost,
      and facility-level profitability.
    whyItMatters: >-
      The software-plus-logistics model cannot be benchmarked to pure SaaS, and network scale may amplify either
      operating leverage or losses.
    diligencePath: >-
      Build cohort and facility contribution statements using order, labor, occupancy, automation, carrier, and revenue
      data.
    relatedQuestionRefs:
      - QI005
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: sales efficiency
    missingEvidence: >-
      Fully loaded CAC, sales cycle, implementation cost, payback, GRR, NRR, churn, expansion, and customer
      concentration.
    whyItMatters: >-
      Enterprise logos and order volume do not reveal acquisition efficiency, retention, or dependence on a small number
      of accounts.
    diligencePath: >-
      Obtain customer-level monthly recurring and services revenue, bookings, churn, implementation cost, and
      sales-and-marketing spend by cohort.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital adequacy
    missingEvidence: >-
      Post-financing cash, monthly burn, operating cash flow, debt principal, interest, covenants, lease obligations,
      and next-round trigger.
    whyItMatters: >-
      Funding raised does not equal cash available, and the physical network may require continuing investment before
      profitability.
    diligencePath: >-
      Review the post-close capitalization table, cash statements, debt and lease schedules, covenant calculations, and
      base/downside 24-month liquidity plan.
    relatedQuestionRefs:
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: security-and-reliability
    missingEvidence: >-
      Current SOC reports or equivalent attestations, penetration-test summary, incident and uptime history,
      disaster-recovery testing, privacy controls, and facility-level certification scope.
    whyItMatters: >-
      Product breadth exposes customer orders, inventory, payments, and operations to software, physical, and
      third-party dependency failures.
    diligencePath: >-
      Request the security package, status and incident exports, business-continuity test results, processor oversight
      evidence, and certification schedules by site.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: deployment-and-integration
    missingEvidence: >-
      Current architecture diagram, integration catalog, implementation timelines, API documentation, connector SLAs,
      and production performance benchmarks.
    whyItMatters: >-
      Historical cloud detail and current marketing do not prove that acquired modules operate as one reliable, scalable
      production architecture.
    diligencePath: >-
      Conduct a technical architecture review and sample three recent enterprise implementations from contract signature
      through steady-state operations.
    relatedQuestionRefs:
      - QE004
      - QE010
  - type: conflicting-data
    severity: material
    topic: fulfillment-network
    missingEvidence: >-
      A current site-by-site inventory reconciling fulfillment centers, distribution centers, warehouses, square
      footage, ownership, automation, and active capacity.
    whyItMatters: >-
      Public counts of ten, fourteen, and seventeen refer to different dates and facility definitions and cannot support
      one current network metric.
    diligencePath: >-
      Obtain the current facility register, leases, throughput and utilization by site, then reconcile it to customer
      service-level coverage.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: customer-durability
    missingEvidence: >-
      NRR, GRR, logo and revenue churn, renewal rates, contract duration, cohort expansion, top-customer share, and
      revenue concentration.
    whyItMatters: >-
      Public customer breadth cannot establish durable recurring economics or quantify exposure to a small number of
      enterprise relationships.
    diligencePath: >-
      Request customer-level revenue cohorts, renewal schedules, the top-20 customer concentration table, and
      signed-contract summaries from management, then reconcile them to audited revenue.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: material
    topic: named-customers
    missingEvidence: >-
      Current contract scope, production status, deployment date, module mix, and quantified outcomes for the named
      customers.
    whyItMatters: >-
      A published customer name does not establish an active production deployment, realized value, retention, or
      expansion.
    diligencePath: >-
      Obtain permissioned reference calls and contract-level deployment data for a representative set of named
      enterprise customers.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: security and regulatory assurance
    missingEvidence: >-
      Issuer-verified facility certificates, regulator records, SOC reports, penetration tests, privacy control
      evidence, incident history, recalls, and litigation schedule.
    whyItMatters: >-
      Without primary assurance, the probability and scope of legal, cyber, safety, and quality loss cannot be
      underwritten.
    diligencePath: >-
      Obtain entity- and facility-level certificates and audits, search regulator and court records, and review
      management's complete incident, recall, and claims logs.
    relatedQuestionRefs:
      - QR002
      - QR004
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: capital dependency
    missingEvidence: >-
      Cash balance, monthly burn, working-capital needs, debt schedule, covenants, liquidation preferences, seniority,
      and refinancing plan.
    whyItMatters: >-
      Funding raised is not cash available, and undisclosed debt or preferences can change downside, dilution, and
      runway.
    diligencePath: >-
      Review audited financials, monthly cash bridge, cap table, all financing agreements, covenant calculations, and a
      downside liquidity model.
    relatedQuestionRefs:
      - QR007
  - type: private-evidence-only
    severity: material
    topic: operating and customer concentration
    missingEvidence: >-
      Facility service levels, inventory accuracy, uptime, carrier and cloud concentration, top-customer revenue and
      volume, renewals, churn, and contract remedies.
    whyItMatters: >-
      The shared infrastructure model can amplify failures, while customer or partner concentration may leave stranded
      capacity and margin pressure.
    diligencePath: >-
      Request monthly facility and system scorecards, dependency maps, top-20 customer cohorts, contract terms, and
      tested business-continuity results.
    relatedQuestionRefs:
      - QR003
      - QR005
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure-gap
    missingEvidence: >-
      Audited revenue, gross margin, EBITDA, cash flow, retention, customer concentration, and segment economics for
