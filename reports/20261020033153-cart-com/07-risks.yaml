company:
  name: "Cart.com"
chapter:
  number: 7
  title: "Risks"
  summary: "Cart.com's central risk is execution across a broad, tightly integrated mix of software, inventory, facilities, and commerce channels while expansion continues to rely on external capital. Public evidence supports the scale and complexity of that exposure, but does not establish incident history, customer concentration, cash burn, debt covenants, or facility-level control assurance."
sections:
  - id: "risk-posture"
    title: "Risk posture and prioritization"
    body: >-
      The highest residual risks arise from the same integration that Cart.com presents as its advantage. The company says each added commerce channel can introduce systems, vendors, complexity, and cost, while its enterprise model serves DTC, retail, and wholesale from one inventory pool and a shared facility network. It also says the network processes tens of millions of orders annually. That breadth makes network execution, systems security, and inventory integrity high-impact exposures even though the allocated evidence does not quantify failure frequency. The heatmap therefore uses directional, not probabilistic, ratings. Capital risk also ranks high because the latest disclosed growth capital is earmarked for further logistics and product expansion, while earlier financing included debt. Kill criteria should include a material security or fulfillment incident without prompt remediation, covenant pressure that constrains operations, or loss of a major customer that reveals concentration above underwriting limits.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR013
      - CR015
      - CR016
    figureRefs:
      - FR001
  - id: "regulatory-legal-security"
    title: "Regulatory, legal, and security exposure"
    body: >-
      The retained evidence identifies control claims but not diligence-grade assurance. Fulfill.com lists hazmat handling, C-TPAT, CGMP, and FDA registration among Cart.com's capabilities, yet that supplier profile does not establish which legal entity, facility, product category, or audit period each item covers. Cart.com's own solutions page describes its software as secure, but the assigned pool contains no regulator filing, audit report, SOC report, penetration-test summary, incident log, litigation schedule, or insurance certificate. Absence of those records from the pool is not evidence that no incident or dispute exists. Before investment, counsel and technical diligence should map obligations by facility and data flow, verify every certification directly with the issuer, review privacy and security controls, and reconcile open claims, investigations, recalls, and coverage limits.
    claimRefs:
      - CR005
      - CR013
      - CR016
    tableRefs:
      - TR001
  - id: "operational-integration"
    title: "Operational, integration, and quality risk"
    body: >-
      Cart.com's operating model combines physical fulfillment with order, inventory, warehouse, storefront, and channel software. FreightWaves reported that the company added 1.6 million square feet in 2022 and reached 10 centers in seven markets; Fulfill.com now lists warehouse locations across eight states and a wide set of handling services. The platform was also assembled through multiple acquisitions: Wikipedia records six named deals across software, marketing, and logistics through March 2022, while Grokipedia reports 10 acquisitions by the end of 2024. These facts support an integration-risk conclusion, not a finding that controls have failed. Diligence should test inventory accuracy, on-time shipping, loss and damage, returns, uptime, disaster recovery, acquired-system migrations, and facility-level quality metrics. A sustained service-level breach or unreconciled inventory variance should trigger thesis review.
    claimRefs:
      - CR004
      - CR006
      - CR007
      - CR008
      - CR014
    tableRefs:
      - TR002
  - id: "capital-partner-concentration"
    title: "Capital, partner, and concentration dependencies"
    body: >-
      Springcoast characterizes Cart.com as a single platform spanning software, automation, and physical infrastructure, a combination that creates dependencies on financing, carriers, technology integrations, facilities, and enterprise customers. InnovationMap reported $180 million of growth capital from Springcoast in March 2026 and said the proceeds would support network scale, AI, and workflow automation. Earlier public history also shows that the 2022 financing included venture debt. Those facts establish that external capital has funded expansion, but they do not reveal cash available, cash burn, debt seniority, covenants, liquidation preferences, or refinancing needs. Nor do the retained sources disclose customer concentration, renewal rates, carrier concentration, cloud dependencies, or contractual remedies. Underwriting should require a cap table, debt schedule, cash bridge, top-customer cohort, vendor map, and tested transition plans before treating partner or liquidity exposure as mitigated.
    claimRefs:
      - CR009
      - CR010
      - CR011
      - CR012
      - CR015
      - CR016
    tableRefs:
      - TR003
