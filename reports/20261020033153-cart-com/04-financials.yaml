schemaVersion: "report-v2"
artifact: financials
slug: cart-com
runDate: 2026-10-20
company:
  name: Cart.com
chapter:
  number: 4
  title: Financials
  summary: >-
    Cart.com combines commerce software and managed services with a large physical
    fulfillment network, but public evidence does not disclose revenue, revenue mix,
    gross margin, unit economics, cash burn, or runway. The March 2026 $180 million
    growth-equity investment increases financing capacity but is not evidence of
    operating profitability or a specific cash runway.
sections:
  - id: revenue-architecture
    title: Revenue architecture is broad but economically opaque
    body: >-
      Cart.com publicly presents an integrated offer spanning order-management
      software, commerce services, fulfillment, transportation, and related
      warehouse operations. That breadth creates several plausible monetization
      surfaces, but the reviewed materials do not state how much revenue comes from
      software, managed services, storage, handling, transportation, or
      value-added work. Nor do they disclose contract length, minimum commitments,
      usage tiers, revenue-recognition policies, or the split between recurring and
      transactional revenue. Fulfill.com says prospective clients receive exact
      rates only after a fit conversation and that rates depend on order volume,
      storage needs, and services. The investable conclusion is therefore a
      diversified operating model with unverified revenue quality, not a proven
      SaaS-like mix.
    claimRefs:
      - CI001
      - CI013
      - CI014
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: scale-and-traction
    title: Operating scale is visible; financial scale is not
    body: >-
      Public operating indicators show a substantial platform. Cart.com says its
      network processes tens of millions of orders annually and separately
      describes more than 8.5 million square feet of warehouse space. Fulfill.com
      lists a nationwide network of 14 fulfillment and distribution centers.
      FreightWaves reported in 2022 that the footprint had reached 10 centers in
      seven markets and that the company served nearly 6,000 brand partners; those
      older figures should not be combined mechanically with current claims because
      the vintages differ. FreightWaves also reported revenue growth above 400% in
      2021, but without the base or an absolute revenue figure. These are credible
      activity and footprint proxies, not substitutes for audited revenue or ARR.
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI010
      - CI011
      - CI012
    tableRefs:
      - TI003
  - id: cost-structure-and-unit-economics
    title: Physical-network exposure dominates the underwriting questions
    body: >-
      The model couples software orchestration with warehouses, labor, automation,
      transportation, and inventory-routing operations. That combination may
      improve customer outcomes, but it also creates facility, labor, carrier, and
      automation costs that a software-only benchmark would miss. The company’s
      stated plan to invest new capital in its nationwide footprint, workflow
      automation, predictive analytics, and AI reinforces the importance of those
      operating dependencies. An industry-adjacent analysis further warns that
      software-led routing requires tighter network orchestration and capital for
      distribution centers and automation. No reviewed source quantifies gross
      margin, contribution margin per order, utilization, labor cost per order,
      CAC, payback, retention, or customer concentration, so a margin path cannot
      be underwritten from public evidence.
    claimRefs:
      - CI006
      - CI014
      - CI015
      - CI016
  - id: capital-adequacy-and-verdict
    title: New equity adds flexibility, not a disclosed runway
    body: >-
      Cart.com announced a $180 million growth-equity investment led by Springcoast
      Partners in March 2026. The company and Digital Commerce 360 describe the
      intended uses as software and AI development, automation, operational
      improvement, and expansion of U.S. fulfillment infrastructure. InnovationMap
      reported that cumulative funding since 2020 moved above $1 billion and cited
      an approximately $1.6 billion valuation before the new round, but cumulative
      financing is not cash on hand. The financing announcement says the investment
      strengthens the balance sheet yet provides no cash balance, burn rate, debt
      schedule, covenant terms, runway, or next-round trigger. Financial diligence
      should therefore treat capital adequacy, profitability, and dilution as open
      underwriting items.
    claimRefs:
      - CI005
      - CI006
      - CI007
      - CI008
      - CI009
      - CI014
callouts:
  - calloutType: risk
    title: Financing is not runway
    body: >-
      The $180 million growth-equity round provides additional capital, but public
      sources do not disclose Cart.com's cash balance, burn, debt service, or
      operating cash flow. A runway estimate would therefore be invented.
    claimRefs:
      - CI005
      - CI007
      - CI014
tables:
  - id: TI001
    title: Publicly visible revenue streams and monetization gaps
    columns:
      - Stream
      - Public mechanism
      - Billing unit or status
      - Revenue-quality evidence
      - Diligence ask
    rows:
      - - Fulfillment and warehousing
        - Stores, picks, packs, and ships orders across DTC, retail, wholesale, and marketplace channels
        - Exact unit and contract terms are not public
        - Tens of millions of annual orders are company-claimed; revenue and margin are unavailable
        - Obtain revenue by service line, minimum commitments, utilization, and contribution margin per order
      - - Order-management software
        - Routes and manages orders and inventory across channels and locations
        - License, subscription, and usage structure are not disclosed
        - Product availability is verified, but software revenue mix and retention are unavailable
        - Obtain ARR, realized pricing, attach rate, GRR, NRR, and gross margin
      - - Commerce and marketing services
        - Managed growth marketing, customer engagement, ecommerce optimization, and marketplace services
        - Fee basis and contract duration are not disclosed
        - Public sources establish the offering, not realized revenue or labor intensity
        - Obtain fee schedules, staffing model, renewal rates, and service gross margin
      - - Transportation management
        - Coordinates freight and delivery alongside fulfillment operations
        - Lane, shipment, or managed-service billing is not disclosed
        - Capability is listed, while pass-through treatment and take rate are unknown
        - Separate gross billings, pass-through carrier spend, net revenue, and take rate
      - - Value-added warehouse services
        - Returns, kitting, customization, packaging, labeling, and related handling
        - Per-order and project pricing are not public
        - Fulfill.com lists capabilities but no contracted prices or mix
        - Obtain service-level price cards, labor content, volume mix, and contribution margin
    notes: >-
      Public sources establish offered services and activity proxies, not reported
      revenue streams, accounting recognition, realized pricing, or margins; unknowns
      are shown explicitly rather than estimated.
    claimRefs:
      - CI001
      - CI002
      - CI013
      - CI014
  - id: TI002
    title: Pricing and contract disclosure
    columns:
      - Offering
      - Public list price
      - Realized price or contract
      - Discounts and unknowns
      - Source position
    rows:
      - - Fulfillment, storage, and handling
        - Not published in reviewed sources
        - Quoted after a fit conversation
        - Volume, storage, service mix, minimums, and surcharges are unknown
        - Fulfill.com says exact rates depend on order volume, storage needs, and services
      - - Order-management software
        - Not published in reviewed sources
        - Unavailable
        - Seat, order, module, implementation, and bundle economics are unknown
        - Cart.com describes capabilities without a price schedule
      - - Commerce and marketing services
        - Not published in reviewed sources
        - Unavailable
        - Retainer, media-spend, performance-fee, and staffing terms are unknown
        - Cart.com describes managed services without commercial terms
      - - Transportation and freight services
        - Not published in reviewed sources
        - Unavailable
        - Carrier pass-throughs, fuel surcharges, margin, and volume discounts are unknown
        - Fulfill.com lists freight capabilities without rates
    notes: >-
      This table distinguishes the absence of public pricing from evidence that a
      service is free or unmonetized; realized terms require contracts, invoices, and
      cohort-level billing data.
    claimRefs:
      - CI001
      - CI013
      - CI014
  - id: TI003
    title: Unit-economics and capital-adequacy underwriting inputs
    columns:
      - Metric
      - Public value or status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Audited revenue and ARR
        - Unavailable
        - Low
        - Establishes financial scale and recurring mix
        - Obtain audited monthly revenue by software, services, fulfillment, and pass-through categories
      - - Historical revenue growth
        - Greater than 400% in 2021; base and absolute revenue not disclosed
        - Medium
        - Shows historical momentum but cannot size the current business
        - Reconcile the reported growth to audited 2020-2021 revenue and current trailing results
      - - Annual order throughput
        - Tens of millions of orders per year, company-claimed
        - Medium
        - Provides an activity denominator for revenue and cost per order
        - Obtain monthly orders, billable events, cancellations, returns, and revenue per order
      - - Warehouse footprint
        - More than 8.5 million square feet, company-claimed
        - Medium
        - Indicates fixed and semi-fixed facility exposure
        - Obtain owned versus leased space, lease maturities, utilization, rent, and capex by facility
      - - Fulfillment-center count
        - 14 current centers in a supplier-directory listing; 10 centers across seven markets reported in 2022
        - Medium
        - Highlights footprint growth and the need for vintage-consistent utilization data
        - Reconcile current active sites, closures, subleases, capacity, and facility-level profitability
      - - Gross and contribution margin
        - Unavailable
        - Low
        - Determines whether software leverage offsets physical fulfillment costs
        - Obtain gross margin by stream and contribution margin per order, facility, and customer cohort
      - - CAC, payback, and retention
        - Unavailable
        - Low
        - Tests sales efficiency and durability of enterprise relationships
        - Obtain fully loaded CAC, sales cycle, payback, GRR, NRR, churn, and expansion by cohort
      - - Cash, burn, debt service, and runway
        - Unavailable; $180 million growth equity was announced in March 2026
        - Medium
        - Determines financing dependency and next-round timing
        - Obtain post-close cash, monthly free cash flow, debt schedule, covenants, and base/downside runway
    notes: >-
      Values combine current company claims, a supplier-directory snapshot, and
      historical reporting with different vintages. Funding raised is not treated as
      cash available, and unavailable financial metrics are not estimated.
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI005
      - CI007
      - CI010
      - CI011
      - CI012
      - CI014
      - CI015
figures:
  - id: FI001
    title: Revenue-to-gross-profit evidence bridge
    type: flow
    summary: >-
      Public sources show the operating sequence but not billing terms, revenue mix,
      direct costs, or gross profit at any stage.
    data:
      nodes:
        - id: demand
          label: Customer demand across DTC and B2B channels
          detail: Public materials describe omnichannel customer activity but disclose no contracted volume or concentration.
        - id: orchestration
          label: Order and inventory orchestration
          detail: Cart.com software routes and manages orders and inventory across channels and locations.
        - id: network
          label: Warehouse and fulfillment network
          detail: The company claims more than 8.5 million square feet and tens of millions of orders annually.
        - id: delivery
          label: Pick, pack, transportation, and value-added services
          detail: Multiple physical and managed services create labor, facility, automation, and carrier cost exposure.
        - id: billing
          label: Customer billing under undisclosed terms
          detail: Fulfill.com says exact rates depend on volume, storage, and services; no public price card was found.
        - id: gross-profit
          label: Revenue less direct delivery costs
          detail: Revenue mix, recognition, gross margin, and contribution margin remain unavailable.
    approximationNotes: >-
      Conceptual operating sequence only; node order does not represent disclosed
      conversion rates, revenue amounts, margins, or a quantified waterfall.
    claimRefs:
      - CI001
      - CI003
      - CI006
      - CI013
      - CI015
